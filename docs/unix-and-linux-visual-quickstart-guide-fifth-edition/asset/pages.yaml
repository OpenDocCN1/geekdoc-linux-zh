  md: "# Understanding Shells and Options\n\nDepending on the particular Unix or Linux\
    \ system you're using, you may have several shells available to you. Table 3.1\
    \ describes a few of the more common ones. Each of these shells has slightly different\
    \ capabilities and features. Keep in mind that the differences in shells do not\
    \ affect what you can do; rather, affect how easily and flexibly you can interact\
    \ with the system.\nYou'll likely have bash as your shell, but you can change\
    \ to one of many other shells easily. As Code Listings 3.3 and 3.4 show, you can\
    \ start by finding out which shells are available to you.\n\n![](img/fff2eea2e42bd82cdabda71c69c59f13_68_0.png)\n\
    \n> Shells fit neatly into a few \"families\" with the exception of a few stragglers.\
    \ Each shell in a family shares many characteristics with the others in the same\
    \ family.\n\n 3.1 Common Unix and Linux Shells\n| Shell Name | Features |\n| ---\
    \ | --- |\n| sh | This shell, which is the original Unix shell (often called the\
    \ Bourne shell), is fine for scripting but lacks a lot of the flexibility and\
    \ power for interactive use. For example, it doesn't have features like command\
    \ completion, checking, history, or aliasing. |\n| csh and tcsh | This family\
    \ of shells offers great interactive but discards the popular scripting support\
    \ that sh-related shells offer in favor of a C programming-like syntax. Because\
    \ of the C syntax, this shell is often called the C shell. Unless you're a C programmer,\
    \ these are not likely to be your best choices. |\n| ksh, bash, and zsh | These\
    \ provide a good blend of scripting and interactive capabilities, but they stem\
    \ from different sources (bash is most similar to sh, but the Bourne Again Shell\
    \ name)."
