  md: '# # Decoding Files with udecode


    You''ll decode files whenever you receive binary files through email—it''s the
    only way you can use encoded files. Although most email programs will take care
    of decoding files for you (and, therefore, you won''t need the information here),
    you may need to do it manually on occasion. If you open a file or an email message
    and see something like Code Listing 13.4, you''ve got a little decoding to do.
    To avoid the gibberish, decode your files, as shown in Code Listing 13.3.


    +   * TIP When you receive an encoded file, you might have to uncompress or unzip
    it in addition to decoding it. See the appropriate sections later in this chapter
    for details.

    * TIP If you have a file that you suspect is encoded, use head tip to view the
    top lines of the file. If it''s really encoded, you''ll see a line saying so at
    the top, as shown in Code Listing 13.4. The 664 is in the file''s permissions,
    and rowboat.jpg is the filename of the extracted file. See Chapter 5 for highly
    interesting details about file permissions.


    To decode files with udecode:


    ```

    udecode rowboat.uue

    ```


    At the shell prompt, type udecode followed by the name of the file to decode (Code
    Listing 13.3).


    Code Listing 13.3 udecode files


