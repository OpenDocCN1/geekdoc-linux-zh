  md: 'You can use df with a specific directory to get a report on the status of the
    file system containing that directory. For example, you might use df /usr/local/src
    to find out where directory is mounted and how much space is available on it.


    If you''re a system administrator, you can use this information to diagnose problems
    occurring in the system. If you''re an average user (of-above-average curiosity),
    you can use this information to satisfy your inquisitive inclinations or tip off
    a system administrator to problems. For example, if you''re getting odd errors
    or unpredictable results with a specific program, using df might mean that your
    /home file is full or maybe that you don''t have the /dev/cdrom file system that
    you thought installed and mounted. Hmmm!


    Use df -k to make sure that the usage is reported in 1-kilobyte blocks, in 512-byte
    blocks. Adding the -k flag will also ensure that your output look like shown in
    Code Listing 7.3.


    Use df -h to get human-readable output. This works with many commands (like ls,
    for example) that output marginally comprehensible file information, as Code Listing
    7.5.


    # Code Listing 7.5 Use df -h to get "human readable" output.


    ```

    123 ejrfrazz $ df -h

    Filesystem size avail capacity Mounted on

    /dev/cdcds0 19G 4.5G 15G 24% /

    /devices OK OK 0% 0% /devices

    /dev OK OK 0% 0% /dev

    ctfs OK OK 0% 0% /system/contract

    proc OK OK 0% 0% /proc

    mntab OK OK 856K 0% 1% /etc/volatle

    swap 1.5G 164K 1.5G 1% /etc/svc/volatile

    /usr/lib/libc_hcapta.so.1 19G 4.5G 15G 24% /lib/libc.so.1

    fd OK OK 0% 0% /dev/fd

    swap 1.5G 322K 1.5G 1% /var/run

    /dev/cdcds7 51G 18G 33G 36% /export

    pooldata 226G 106M 69G 21% /pooldata

    pooldata/family 226G 140G 69G 68% /pooldata/family

    pooldata/raycomm 226G 5.9G 69G 8% /pooldata/raycomm

    poolscratch 228G 46G 181G 21% /poolscratch

    123 ejrfrazz $

    ```'
