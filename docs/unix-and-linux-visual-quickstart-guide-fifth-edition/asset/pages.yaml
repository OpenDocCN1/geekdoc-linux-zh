  md: '# # Automatically Forwarding Incoming Messages


    Suppose you''re the boss of a big project, and everyone sends you all the related
    email messages. You can tell Unix to automatically forward these incoming messages
    to the people who will actually do something about them. Hey, you''re the boss,
    right? Or maybe you just got a different email account, and you want mail sent
    to your old address forwarded to your new address. As you have to create a `.forward`
    file.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_240_0.png)


    All you have to do is tell Unix where you want your messages forwarded.


    Check with your system administrator to see if a .forward file will do what you
    want. Many Linux and Unix systems automatically send mail to procmail (and ignore
    the .forward file), so you might need to use a procmail recipe to forward your
    mail. It''s equally effective, but just different. See "Managing email with procmail"
    later in this chapter for details.


    If you want, you can keep a copy of all incoming messages (in your email box,
    just where they''d usually be) and forward them to unspecified recipients. Just
    type your@address.com (substituting your userid on the current system for yourid
    and the address to which to forward the mail for other@address.com).


    Forwarding messages is also handy when you change ISPs. You can forward all messages
    sent to your old address to your new one, which helps tremendously in ensuring
    you receive all your important messages while your friends and coworkers update
    their address books.


    # ## To forward incoming email messages:


    +   1. vi ~/.forward


    To begin, type vi at the shell prompt (or the appropriate command for which-ever
    editor you are using), indicate your home directory (~), and then type .forward
    as the filename.


    +   2. mynewid@raycomm.com

    Add, the first line of the file, the address to which you want your email forwarded
    A. In addition to forwarding to a single address, you can also use a .forward
    file with multiple addresses to send email to several addresses at once.


    +   3. Save and close the file.


    Check out Chapter 4 for details about saving and closing files using nano or vi.'
