  md: "# Discovering Which Shell You're Using\n\nWhen you first log in to your Unix\
    \ or Linux account, you'll be using the default shell on your system. The default\
    \ shell, its features, and options depend completely on what your system administrator\
    \ specifies.\nCode Listings 3.1 and 3.2 show examples of how default shell prompts\
    \ differ on two different systems.\n\n# To discover which shell you're using:\n\
    \n`echo $SHELL` \nAt your prompt, type `echo $SHELL` (capitalization counts!).\
    \ This command tells Unix to display (echo) information about shell settings.\
    \ This information, by the way, is contained in one of the environment variables,\
    \ so the technical phrasing (which you might hear in Unix circles) is to \"echo\
    \ your shell environment variable.\"\n\nThe system's response will be the full\
    \ path to your shell—something like `/bin/zsh`, `/bin/bash`, or `/bin/ksh`.\n\n\
    > You can also use `finger userid`, substituting your login name for `userid`,\
    \ to find out about your shell settings. You can substitute any other userid and\
    \ see comparable information about account holders. See Chapter 7 for more about\
    \ finger. (Most systems do not support finger remotely, because finger can be\
    \ a bit of a security hole.)\n\n> You'll find more information about different\
    \ shells and their capabilities throughout this chapter.\n\n```\nCode Listing\
    \ 3.1 ISP account uses the /bin/csh shell by default.\nexample-isp> echo $SHELL\n\
    /bin/c\nexample-isp> finger ejray\nLogin name: ejray In life: \"RayComm\"\nDirectory:\
    \ /home/users/e/ejray Shell:\n/bin/csh\nOn since Jul 23 06:58:48 on pts/16 from\n\
    - calvin.raycoeff.com\n1 minute 28 seconds Idle Time\nNo mail\nNo Plan.\nexample-isp>\n\
    ```\n\nCode Listing 3.2 On hobbes, a Linux system, the default shell is /bin/bash\n\
    \n```\n[ej@hobbes] echo $SHELL\n/bin/bash\n[ej@hobbes] finger ejr\nLogin: ejr\
    \ Name: Eric J. Ray\nDirectory: /home/user/Ejr Shell: /bin/bash\nOn since Wed\
    \ Jul 23 07:42 (MDT) on tty1\n- 3 hours 15 minutes idle\n- calvin\nNo mail\nProject:\n\
    Working on UNIX VQS.\nPlan:\nThis is my plan-work all day, sleep night.\n[ej@hobbes]\
    \ ejr$]\n```"
