- img_proc: true
  md: '# Learning Who Else Is Logged In with who


    If you''re not interested in all the gory details you get about users when you
    finger them, you can instead use who to get the basics. With who you get just
    the users'' names, connection information, login times, and host names, as shown
    in Code Listing 7.11.


    # To snoop with who:


    who


    At the shell prompt, type who. You''ll get user information like that shown in
    Code Listing 7.11. Optionally, you could pipe the output of who to more, as in
    who | more, which would give you a long list of results one screen at a time.


    > TIP If you are a system administrator or use several different userids, you
    might occasionally need to use a special case of who, called whoami. Just type
    whoami at the shell prompt, and it''ll tell you userid you''re currently logged
    in.


    > TIP See Chapter 1 for more on more and on piping commands.


    Code Listing 7.11 Use who to find out who is currently logged in to the system.


    ```

    [ejr@hobbes ejr$ who

    ejr tty1 Jul 22 07:42

    root tty2 Jul 22 15:13

    asr tty4 Jul 24 13:32

    deb tty5 Jul 24 13:32

    ejrj tty1 Jul 24 12:14 (calvin.raycomm.com)

    ejrj tty0 Jul 24 13:02 (calvin.raycomm.com)

    [ejr@hobbes ejr$]

    ```'
  merge: -1
  pgno: 154
- img_proc: true
  md: "# # Learning Who Else Is Logged In with w\n\nAnother way to find out about\
    \ other people logged into the system is to use w, which tells you who is logged\
    \ in, what they're doing, and a few other details (Code Listing 7.12).\n\n# ##\
    \ To find out who is logged in with w:\n\nw\nAt the shell prompt, type w. You'll\
    \ usually see output much like that in Code Listing 7.12. The top line shows\n\
    \n+   - The time.\n- System uptime in days, hours, and minutes (uptime how long\
    \ it's been since the system was restarted and is usually measured in weeks or\
    \ months for Unix or Linux systems, as opposed to hours or days for personal computers).\n\
    - The number of users.\n- System load averages (the numbers indicate jobs—programs\
    \ or scripts to execute—lined up to run in the past 1, 5, and 15 minutes).\n\n\
    Code Listing 7.12 w command provides tons of information about the system and\
    \ its users.\n\n```\n```\nejr@hobbes $ w\n1:49pm up 6 days, 4:21,6 users, load\
    \ average: 0.08, 0.02, 0.01\nUSER FROM LOGIN@ IDLE JCPU PCPU WHAT\nejr tty1  \
    \    Wed 7am    3:36am 7.07s 0.61 -bash\nroot tty2      Wed 3pm    28:46m 1.22s\
    \ 0.32 -bash\nasr tty4               1:32pm    17:22 1.04s 0.30 pine\ndeb tty5\
    \               1:32pm    3:00m 1.22s 0.24 lynx\nejr tty1 calvin      12:14pm\
    \   1:28m 1.33s 0.57s hairyspiders\nejr ttyp0               1:02pm    1:00s 1.70s\
    \ 0.24 w\nejr@hobbes $ \n```\n```\n\n![](img/fff2eea2e42bd82cdabda71c69c59f13_155_0.png)"
