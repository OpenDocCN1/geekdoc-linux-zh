  md: '# Getting Files from the Internet with ftp


    Some of the Internet''s great information resources are FTP sites, which contain
    hundreds of thousands of files from all over the Internet. FTP sites are similar
    to websites but are directory oriented and speak a different protocol. They''re
    less fun than the web usually is but often more practical.


    One of the easiest ways to access information on FTP sites is to use anonymous
    ftp, which lets you access the sites and download files to your computer (**Code
    Listing 12.2**).


    # Getting a single file through anonymous ftp:


    +   1. *ftp calvin.raycomm.com*

    At the shell prompt, type *ftp* followed by the name of the FTP site to which
    you''re connecting. Of course, if the computer has an IP address but no name,
    type the IP address instead. You''ll be prompted to log in, as shown in Code Listing
    12.2.


    +   2. *anonymous*

    For your user name, type *anonymous*. (Type *ftp* if you get tired of typing *anonymous*—it
    nearly always works.)


    +   3. *you@wherever.com*

    Use your email address for the password. It''s polite to identify yourself to
    the people who provide the FTP service. Just *you@* is usually sufficient.


    +   4. *cd /pub/files*

    Use standard Unix *cd* commands to move through the directory tree to the file
    you want.


    continues on page 245'
  merge: -1
  pgno: 256
