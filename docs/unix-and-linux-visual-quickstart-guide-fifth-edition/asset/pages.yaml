  md: '# # Sorting Files with sort


    If you want to be lazy–er, um smart–let Unix or Linux sort files or the contents
    of files for you. You can use sort your book alphabetically–opp to the random
    order in which you might have addresses (Code Listing 6.17).


    > > TIP You can sort fields numerically, too, with sort -n filename fields by
    adding the command. For example, sort -t, +1 address.book tells Unix and Linux
    to sort by the second field. The -t and following character (,) indicate what
    character separates the fields–the comma in this case. If a character is not given,
    sort whitespace marks the boundaries between fields. The +1 says to skip the first
    field and sort on the second one.


    To sort files with sort:


    ```

    sort address.book > sorted.address.book

    ```


    To begin, type followed by the name of the file contents you want to sort. Unix
    will sort the files in the file alphabetically and present the sorted results
    in the file you specify (here, sorted.address.book), as shown in Code Listing
    6.17.


    > > TIP If you have multiple files to sort, you can sort file1 file2 > complete,
    and the output contains the contents of all three files–sorted, of course.


    ```

    [unixvs@linuxmint Examples]$ more address.book

    Schmidt, Sven, 1 Circle Drive, Denver, CO, 80221, 555-555-8382

