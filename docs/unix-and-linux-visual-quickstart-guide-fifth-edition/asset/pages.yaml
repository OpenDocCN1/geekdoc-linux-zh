  md: '# What’s What and What’s Where


    As you’re using Unix or Linux, you’ll undoubtedly encounter files that look important
    or directories that look interesting, but it’s often hard to know what files belong
    to which programs and even harder to figure out what some directories are for.
    Therefore, we’re trying to help out a little with the information in this appendix.


    Table B.1 lists important Unix and Linux files and directories.


    Table B.2 lists the contents of common Unix and Linux directories. In practice,
    the contents of these directories (and their existence) vary greatly by system,
    but the configuration described here is fairly standard.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_352_0.png)'
  merge: -1
