  md: "# Setting Your zsh Prompt Promptly\n\nYou can set your prompt to contain all\
    \ sorts of information. The following list shows what code to use to add certain\
    \ kinds of information to your prompt (and it will help you translate the code\
    \ in your existing prompt):\n\n+   - %n shows the userid of the current user—that's\
    \ you.\n- %~ shows the working directory with a path, using a ~ notation within\
    \ your home directory.\n- %c shows the current directory without the path.\n-\
    \ %t shows the time.\n- %W shows the date without the year.\n- %W shows the date\
    \ with the year.\n- %n forces a new line, making the prompt appear split on two\
    \ lines (you need single quotes around the prompt).\n- %m shows the host name\
    \ of the computer (like the LinuxMint and hobbies in this book).\n- %M shows the\
    \ complete host name of the computer, including the domain name.\n\n# To change\
    \ your zsh prompt:\n\n+   1. grep -i PROMPT ~/.z*; grep -i PS1 ~/.z\n\nTo begin,\
    \ search through the configuration files located in your home directory and, if\
    \ necessary, in the /etc directory to find your prompt statement. it may PROMPT=\"\
    %n@%m %3~%(1..) \" # default prompt, as shown in Code 8.6.\n\nThe \"Setting Your\
    \ zsh Promptly\" sidebar will help translate these symbols.\n\n+   2. cp ~/.zshrc\
    \ ~/.zshrc-backup; vi ~/.zshrc\n\nMake a backup copy. The ~/.zshrc file is a likely\
    \ place for your prompt to be set, as it is only read when your shell is interactive.\n\
    \n```\n3. PROMPT=\"%n %d $ \n```\n\nFor example, we often set our prompt to include\
