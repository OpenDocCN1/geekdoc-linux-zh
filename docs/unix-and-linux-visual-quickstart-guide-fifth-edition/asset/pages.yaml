  md: '# # Getting System Information with uname


    Information about Unix or Linux system might come in handy if you are planning
    to try some new software or to figure out system idiosyncrasies. Some systems
    tell you this information when you log in. However, especially if you''re using
    an ISP, you may not have been told any particulars about the system. You can easily
    find out what kind of system you''re using with **uname**, as shown in **Code
    Listings 7.1** and **7.2.


    To find out about the system using:


    +   1. uname


    Type **uname** to find out what kind of system you''re on. The Unix system in
    Code Listing 7.1 is Solaris (aka SunOS). Other common systems (not an exhaustive
    list, by any means) are Linux (obviously), AIX, BSD, and HP-UX.


    +   2. uname -a

    Add the **-a** flags to the command, yielding the operating system type and the
    release level. This is useful to determine whether specific software is compatible
    with the operating system.


    +   3. uname -a

    For the whole nine yards, use **uname -a** to print all information, including
    the operating system type, host name, version, slon, and the hardware. The specifics
    you will get here will vary a bit from systems to system.


    **Code Listing 7.1** Variants of the *uname* command provide all kinds of interesting
    or useful information about the system.


    ```

    $ejray@home $ ssh frizz

    Last login: Wed Oct 10 09:59:09 from frizz

    Sun Microsystems Inc. SunOS 5.9 Generic

    * May 2002

    ejray@frizz $ uname

    SunOS

    ejray@frizz $ uname -a

    SunOS 5.9

    * sparc SunW,Ultra-5_10

    ```


    **Code Listing 7.2** On a different system, the same commands provide slightly
    different details, although the basic information remains same.


    ```

    $ejray@frizz $ uname

    Linux

    ejray@frizz $ uname -sr

    Linux 2.4.19-16mdk

    ejray@frizz $ uname -a

    Linux frizz.raycomm.com 2.4.19-16mdk

    * #1 Sep 28 18:15:05 CEST 2002 1686

    * unknown unknown GNU/Linux

    ejray@frizz $

    ```'
  merge: -1
