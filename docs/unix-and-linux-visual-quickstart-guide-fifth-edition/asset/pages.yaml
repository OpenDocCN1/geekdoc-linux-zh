  md: '# To kill a job with kill:


    +   1. jobs

    At the shell prompt, type jobs, then note the number or name of the job you want
    to kill.

    2. kill %ftp

    In most shells, you can kill jobs with kill followed by % and the job number or
    command name—for example, you could kill an ftp job with a job number of 1 using
    kill %ftp or kill %1. If your shell doesn''t cooperate, read on.


    # To delete a process with kill:


    +   1. ps

    At the shell prompt, type ps to see the list of all your current jobs (Code Listing
    9.14). Note the PID number of the process you want to delete.

    2. kill 16217

    Type kill followed by the PID number of the job you''re deleting.


    > Occasionally, you''ll use kill and find that the process just keeps going. Try
    kill -9 followed by the PID number to delete the process. This is a last resort
    option, since it doesn''t give the program any opportunity to clear files or clean
    before exiting.


    > Now that you know about kill -9, you can search the Internet for “kill dash
    nine song manly” and be privy to the inside jokes. Do note that the song is certainly
    not kid- or workplace-friendly, but it''s the only song about obscure Unix commands
    that we know. Watch at your own risk.


    > Be careful not to kill your shell process, or you''ll abruptly find your connection
    broken. Doing so would be like sawing off the branch you''re sitting on.


    > Many newer Unix systems allow you to use pkill to kill processes by name, not
    number. For example, you might use pkill ftp to kill a suspended FTP session.'
