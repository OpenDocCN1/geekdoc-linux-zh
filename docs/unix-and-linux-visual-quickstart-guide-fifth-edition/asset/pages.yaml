  md: '# Working with Your Shell


    When you access a Unix or Linux system, the first thing you see is the prompt,
    called the shell prompt, which is where you interact with Unix or Linux. The shell
    determines how easily you can enter and reenter commands and how you can control
    your environment. What''s cool is that you''re not stuck with one shell—that is,
    on most systems you can choose to use shells that have different features and
    capabilities, depending on your preferences and needs.


    In this chapter, we''ll look at your shell, show you how to change it, and get
    you started using a few of the more common shells.


    +   In This Chapter

    - Discovering Which Shell You''re Using 54

    - Understanding Shells and Options 55

    - Changing Your Shell with chsh 57

    - Changing Your Shell Temporarily 59

    - Using Completion in the bash Shell 61

    - Viewing Session History in the bash Shell 62

    - Using Completion in the zsh Shell 64

    - Viewing Session History in the zsh Shell 65

    - Changing Your Identity with su 67

    - Fixing Terminal Settings with stty 69

    - Exiting the Shell 70'
