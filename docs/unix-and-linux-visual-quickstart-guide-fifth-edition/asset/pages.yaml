  md: '# To act like root with sudo: syslog


    +   1. cd /var/log; tail syslog


    As plain-old you, try to look at the system log files in /var/log. On a Linux
    or Mac system, it''s /var/log/syslog; on a Solaris system, it''s usually /var/log/adm/messages.
    Other Unix flasks will have other, but similar, locations.


    Note that some of these files require root access to view them, others won''t.
    If you can view a file as root then choose a different file to see how sudo helps.


    +   2. sudo tail syslog


    Permission was denied on the previous attempt; now use sudo before the command
    to issue the same command with root authority.


    ******


    Enter your password after the interesting, and note that the command succeeded
    this time (see Code Listing 15.1).


    ```

    Code Listing 15.2 More surprisingly, sudo

    sometimes has a sense of humor.


    unixqs@LinuxMint ~ $ sudo ls

    Password:

    My mind is going. I can feel it.

    Password:

    Take a stress pill and think things over.

    Password:

    He has fallen in the water!

    sudo: 3 incorrect password attempts

    unixqs@LinuxMint ~ $

    ```


    > TIP After you''ve used sudo once, you can use it again within a specific amount
    of time (usually five minutes) without entering your password.


    > TIP Some versions of sudo have pretty entertaining programs if you mess up your
    password (Code Listing 15.2). You''re likely to irritate your system administrator
    tremendously if you try to look at this purpose, though.


    > TIP If you have not been given permission (not just technical permission, but
    actual, “you may do this") to use sudo, don''t. Everything that happens with sudo
    is logged, and you''ll probably have to answer for your actions.


    > TIP Whenever possible, it''s better to use sudo only when you need it to become
    root. Any typo can be problematic, and it''s a good thing to wisely add sudo when
    you want to act with root authority. The more time you spend on root, the more
    exposed to security issues you are.


    > TIP Some Solaris and OpenIndiana systems support pf, which is generally compatible
    to sudo and can be used in just the same way. Under the covers, it''s different,
    but the differences aren''t likely to be significant for you right now.'
