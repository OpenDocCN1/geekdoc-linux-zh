  md: '# To find and act on files:


    find --name ''*.backup'' -ok rm {};;\nType **find** with a wildcard expression,
    followed by **-ok** (to execute the following command, with confirmation), **rm**
    (the command to issue), and {} \ to fill in each file found as an *argument* (an
    additional piece of information) for the command. If you want to say, compress
    matching files without confirmation, you might use **find --name ''*.backup''
    -exec compress {};**; to do the work for you.


    > TIP On Unix and Linux systems, you do not need the -print flag. Try entering
    find without the -print flag. If you see the results onscreen, then you don''t
    need to add the -print flag.


    > TIP Avoid starting the find command with the root directory, as in find / -name
    the missing_file -print. In starting with the root directory (indicated by the
    /), you''ll likely encounter a pesky error message for each directory you don''t
    have access to, and there will be a lot of those. Of course, if you''re logged
    in root, feel free to start with /.


    > TIP If you know only part of the filename, you can use quoted wildcards with
    find, as in find . -name ''*info*'' -print.


    > TIP find offers many chapters'' worth of options. If you''re looking for a specific
    file or files based on any characteristics, you can find them with find. For example,
    you can use find /home/shared -mtime -3 to find all files under the shared directory
    that were modified within the last three days. See Appendix C for a substantial
    (but not comprehensive) listing of options.'
