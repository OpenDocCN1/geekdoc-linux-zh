  md: "# Combining Commands\n\nAs we've shown you in this chapter, you use separate\
    \ commands to **uudecode/uudecode**, **tar/untar, compress/uncompress**, and **zip/unzip**\
    \ files and directories. A lot of times, however, you can pipe commands together\
    \ and run them in sequence, saving time and hassle. For example, as **Code Listing\
    \ 13.14** shows, you can **uudecode** and **gunzip** files at the same time by\
    \ piping the commands together. You can also **uncompress** and **untar** at one\
    \ time, and you can **tar** and **gzip** at one time.\n\nTo uudecode and gunzip\
    \ at one time:\n\n+   1. **ls -1 h***\n    - Use **ls -1** to verify the existence\
    \ of your uudecode and zipped file.\n2. **uudecode -o /dev/stdout home.gz.uue\
    \ | gunzip > home**\n    - Here, we use **-o /dev/stdout** to send the standard\
    \ output, then pipe the output of the **uudecode** command to **gunzip**, then\
    \ redirect the output of **gunzip** to the **home file**. Whew! See Code Listing\
    \ 13.14 for the details.\n\n**Code Listing 13.14** Decoding and unzipping at once\
    \ is a little cryptic but saves your typity typity fingers.\n\n```\n```unixxvqs@LinuxMint\
    \ compression]$ ls -1 h*\n-TW-IW-R- 1 ejr users 73987 Jul 23 11:15 home.gz.uue\n\
    -TW-IW-R- 1 ejr users 177607 Jul 27 09:34 house.uu\n[unixxvqs@LinuxMint compression]$\
    \ uudecode -o /dev/stdout home.gz.uue | gunzip > home\n[unixxvqs@LinuxMint compression]$\
    \ ls -1 h*\n-TW-IW-R- 1 ejr users 128886 Jul 27 10:48 home\n-TW-IW-R- 1 ejr users\
    \ 73987 Jul 23 11:15 home.gz.uue\n-TW-IW-R- 1 ejr users 177607 Jul 27 09:34 house.uu\n\
    [unixxvqs@LinuxMint compression]$\n```\n```"
  merge: -1
