  md: "# Making a Script Executable\n\nIn the previous section, we showed you that\
    \ you can run a shell script by typing bash followed by the name of the shell\
    \ script file. You can also make a script executable, which means that you can\
    \ run it simply by typing the script name at the shell prompt (omitting the name\
    \ of the shell). Doing so is handy because it allows you to use the script as\
    \ conveniently as you'd use any other command.\n\nCode Listing 10.2 shows, you\
    \ must set up a little before you can just execute the script.\n\n+   1. head\
    \ -2 myscript\n\nAt the shell prompt, check to verify that your script does the\
    \ #!/bin/bash line at the top to specify the shell that runs it. Remember from\
    \ Chapter 6 that head -2 will list the top two lines of the file specified.\n\n\
    Code Listing 10.2 After a little one-time preparation, you can run executable\
    \ scripts by typing the script name at the shell prompt.\n\n```\n[unixvxq@LinuxMint\
    \ scripting]$ head -2 myscript\n#!/bin/bash\n# This is my first shell script\n\
    [unixvxq@LinuxMint scripting]$ chmod u+x myscript\n[unixvxq@LinuxMint scripting]$\
    \ pwd ; echo $PATH\n/home/scripting\n/usr/local/bin:/bin:/usr/usr/X11R6/ bin:/usr/local/games/\
    \ friendsjustfriends\n[unixvxq@LinuxMint scripting]$ myscript\n  standing\n  good\n\
    [unixvxq@LinuxMint scripting]$\n```"
  merge: -1
  pgno: 207
- img_proc: true
  md: '# 2. chmod u+ myscript


    Here, use the `chmod` command to give the user (that''s you) execute permission.
    See the section in Chapter 5 “Changing Permissions with `chmod` for details on
    setting permissions.


    # 3. pwd; echo $PATH


    Display the name of your current directory and the full path, and verify that
    the current directory is in the path. The current directory (the one in which
    you just granted yourself permission) must be contained in the path; otherwise,
    the script will not be as easily executable from the shell prompt.


    # 4. myscript


    At the shell prompt, type the name of the script. Assuming that your current directory
    is in the path, the script will run.


    > TIP Every time you open up a new script, check to verify that the first line
    is #/bin/bash so the file will run correctly. Also, check the permissions and
    your path to make sure you can run the script from the shell prompt. (You''ll
    almost always find it more convenient to use executable scripts than to specify
    the shell or path each time you want to run a script.)


    > TIP If the current directory isn''t in the path (either explicitly or through
    a . notation, as in PATH=/usr/bin::), you''ll have to take an additional step
    to execute the script. You could


    +   - Add the current directory to the path with something like PATH=$PATH:/home/yourid/tempdir.
    Read more about this option in Chapter 8.

    - Execute the script with ./myscript instead of just myscript.

    - Move the script to a directory in the path.'
