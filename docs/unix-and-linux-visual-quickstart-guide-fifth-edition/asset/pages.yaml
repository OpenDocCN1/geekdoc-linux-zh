    t-rw-R     1 root root 0 2011 Mar 14 09:31 shadow

    ```


    > Most of the files in /etc are owned by root.


    Sometimes you''ll see references to world-readable, or world, permissions. This
    is the same as other. "Other" refers to anyone who is not you or not in the group.


    You might hear of s or SetUID permissions, which indicate that the program or
    file can run with the effective userid of the file''s owner (usually root). For
    example, /usr/bin/passwd has s permissions because you can run passwd to change
    your password, but the command needs to run as root to actually modify the password
    database.


    You might also see a t at the end of the list of permissions, which indicates
    that the sticky bit is set. Setting the "sticky bit" means that, in a shared directory,
    you can delete only your own files (and not accidentally delete files belonging
    to others).'
