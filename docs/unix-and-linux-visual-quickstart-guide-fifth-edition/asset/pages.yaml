  md: '# Creating Directories with mkdir


    You might think of directories as drawers in a file cabinet; each drawer contains
    a bunch of files that are some-related. For example, you might have a couple of
    file drawers for your unread magazines, one for your to-do lists, and maybe a
    drawer for your work projects.


    Similarly, directories in your Unix system act as containers for other directories
    and files; each subdirectory contains more related directories and files, and
    so on. You''ll probably create a new directory each time you start a project or
    have related files you want to store at a single location. You create new directories
    using the mkdir-mand, as shown in Code Listing 2.1.


