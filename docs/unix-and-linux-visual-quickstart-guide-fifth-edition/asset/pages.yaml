- img_proc: true
  md: '# Changing with tr


    Sometimes you just have to make changes to a file to change all occurrences of
    one term or character to another. For example, you might have reversed the case
    in a file (by accidentally typing Caps Lock on argh!) and need to change it back.
    Or you might want to turn a document into a list of words (one per line) that
    you can sort or count. The tr utility is just what you need (see Listing 6.20).


    # To translate case with tr:


    cat limerick | tr a-Za-Z A-Za-z

    At the shell prompt, the cat command and the pipe to send a file to tr, which
    will then translate lowercase to uppercase, and vice versa.


    # To break lines with tr:


    cat limerick | tr -c a-zA-Z "\n"

    Change anything that''s not a letter (uppercase or lowercase) to a new line, thus
    breaking the limerick into a list of words. The -c indicates that anything that
    does not match the first set of characters (the complement of those characters)
    should be changed to the new character.


    > Rather than use cat to send the file to tr, you can use sphinx or Linux redirection
    tools ( < cat in this case) to do it. An equivalent command to translate case
    would be tr a-zA-Z A-Za-z


    > With tr, you can accomplish all kinds of translations. For example, you could
    set up a bit of code to keep secret information somewhat secret, by translating
    letters to gather your text, then translating when you want them. For cat limerick
    | tr a-mM-Zn-Z > n-ZN-Za-mM-M > limerick.rot13 to encode and cat limerick.rot13
    | tr n-ZN-Za-mM-M a-mM-Za-Mn-Z to decode.

    This is the same as ROT13, discussed in Chapter 16, but far more flexible and
    speedy if you use tr to do it.


    > Check out the man page for tr (man tr) for details on the other cool translations
    and conversions it can.'
