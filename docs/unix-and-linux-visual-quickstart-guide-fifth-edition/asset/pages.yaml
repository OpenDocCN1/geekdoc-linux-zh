  md: '# # Keeping Up with watch


    As a system administrator, you practically have to have eyes in the back of your
    head and be aware of all kinds of activities that might be going on. The **watch**
    command is your friend. It keeps eye on pretty anything (users, system, or files)
    you want to monitor.


    ## To watch:


    +   - watch list

    - Use **watch** to monitor the output of a specific command. When something changes,
    you''ll see it in the **watch** output 🅰. In this case, we''re monitoring who
    logged in and when.

    - watch --differences=cumulative ls -1 /var/spool/mail


    You can watch to see if mail''s getting delivered by monitoring an `/var/spool/mail`
    directory. The extra flags show cumulative differences since you started **watch**.


    > > TIP The watch utility can be really handy, but sometimes it''s easier to just
    use something like tail -f /var/log/httpd/access_log to keep track of the web
    server access log or write a shell script to periodically run last. Basically,
    watch is useful, but it''s not the only way to monitor what''s going on.


    > > TIP On the lighter side, you can also use **watch** to periodically run other
    programs. For example, watch -n 5 fortune will display a new fortune every five
    seconds.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_312_0.png)


    🅰 **watch** to keep an eye on the system.'
  merge: -1
  pgno: 312
