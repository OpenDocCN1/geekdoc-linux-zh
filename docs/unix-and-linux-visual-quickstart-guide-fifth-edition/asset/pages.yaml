  md: "In some newer Linux distributions, the zsh prompt is configured through all\
    \ kinds of interesting black magic. For the purposes of this example, we recommend\
    \ editing ~/.zshrc, and finding lines that look like this:\n\n```\nautoload -Uz\
    \ promptinit\npromptinit\npromptadam1\n```\n\nand putting a # in front of each,\
    \ saving the file. Those lines should look like this:\n\n```\n#autoload -Uz promptinit\n\
    #promptinit\n#promptadam1\n```\n\nThis will \"comment out\" those three lines,\
    \ so your prompt customizations will take. If you want the black magic back, just\
    \ edit the file again and remove the # at the beginning of each line.\n\nNote\
    \ the trailing space in the prompt code: PROMPT=\"%n%Xd $ \". This space can help\
    \ make it easier to use the prompt because it keeps your commands from bumping\
    \ into your prompt.\n\nYou can also set your prompt so that the information you\
    \ set appears on one line and your actual prompt appears on the next (Code Listing\
