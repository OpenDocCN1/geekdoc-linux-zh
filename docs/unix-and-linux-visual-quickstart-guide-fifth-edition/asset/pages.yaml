  md: "# Calculating with bc\n\nUnix even offers a handy calculator utility that lets\
    \ you...er...calculate things. Just use bc, as shown in Code Listing 14.2.\n\n\
    To calculate with bc:\n\n+   1. bc\n   At the shell prompt, type bc. You'll find\
    \ yourself at a blank line, waiting for math to do.\n\n+   2. 6*5\n   Enter the\
    \ numbers, operators, expressions, or whatever you want to calculate. Use + to\
    \ add, - to multiply, and / to divide. The answer appears on the next line (Code\
    \ Listing 14.2).\n\n+   3. <Ctrl+D>\n   Quit bc when you're done.\n\nCode Listing\
    \ 14.2 Using the bc utility, you can calculate and calculate and...\n\n```\nunixvs@OSX\
    \ $ bc\n6*5\n30\nunixvs@OSX $\n```\n\n> TIP You can tell bc to calculate expressions\
    \ within a file by using bc filename. (Of course, replace filename with the real\
    \ filename.) Then, bc waits for more to do from the command line.\n\n> TIP Type\
    \ man bc for more details about bc's capabilities."
  merge: -1
  pgno: 291
- img_proc: true
  md: "# Evaluating Expressions with expr\n\nCode Listing 14.3 Using the expr utility,\
    \ evaluating the value or them (or lack thereof) of expressions is straightforward.\n\
    \n```\nunixvs@OSX $ expr 3 \\* 4\n12\nunixvs@OSX $ expr 5 % 3\n2\nunixvs@OSX $\
    \ a=$PWD; b=$HOME; expr a = $b\n1\nunixvs@OSX $ cd bin\nunixvs@OSX $ a=$PWD; b=$HOME;\
    \ expr a = $b\n0\nunixvs@OSX $\n```\n\nUnix also provides expr, which you can\
    \ use for evaluating expressions. (In this use, the term expressions refers to\
    \ the mathematical, logical, scientific meaning of the word.) In addition to evaluating\
    \ mathematical expressions, you can evaluate anything else. The expr utility is\
    \ often used in shell scripts—and you'll probably find the most value in expr\
    \ in that context—but it works just fine in the command line, too, as shown in\
    \ Code Listing 14.3.\n\n# To evaluate with expr:\n\n+   - expr 3 \\* 4\n  At the\
    \ prompt, enter expr followed by the expression it should evaluate. In this example,\
    \ we are multiplying 3 times 4. (We have to use a \\ escape [protect] from being\
    \ interpreted as a wildcard by the shell).\n- expr 5 % 3\n  Determine the modulo\
    \ (remainder) of 5 divided by 3. The answer appears on the next line (Code Listing\
    \ 14.3).\n- a=$PWD; b=$HOME; expr a = $b\n  This cryptic expression sets a equal\
    \ to the current directory and b equal to the home directory, and then compares\
    \ the two. If it returns 1 (true), you're in your home directory. If it returns\
    \ 0 (false), you're not.\n\nTIP Comparisons within shell scripts allow you to\
    \ check whether or not something is true, and then act accordingly. See Chapter\
    \ 10 for more information.\n\nTIP The expr man page isn't particularly helpful;\
    \ search the Internet to get help with expr."
  merge: -1
  pgno: 292
