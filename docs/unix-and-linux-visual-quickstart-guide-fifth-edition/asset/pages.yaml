  md: '# Converting with units


    Do you always forget how many drams are there in an ounce? Never fear. The units
    utility makes converting measurements a snap. See Code Listing 14.4 to learn how
    to convert with units.


    Code Listing 14.4 Use the units utility to find out how to convert from anything
    to anything else—really!


    ```

    unixvxqs@OSX $ units

    1948 units, 71 prefixes, 28 functions

    You have: inch

    You want: feet

    * 0.083333333

    / 12

    You have:

    unixvxqs@OSX $

    ```


    To convert with units:


    +   1. units


    At the shell prompt, type units. The Unix system will prompt you with "You have:"
    as shown in Code Listing 14.4.


    +   2. inch


    Enter the units you''re starting with. You''ll then be prompted with "You want:"


    +   3. feet


    Enter the kind of units you want, and watch with amazement as Unix counts on its
    fingers and toes to figure out the answer.


    +   4. Ctrl+D


    Quit units when you''re finished.


    > You can create your own units file, if you want, defining relationships between
    units and values of constants. That way, if the value of pi changes, you can create
    your own file with the new value. Type man units for more information.


    > Mess around with units more, and you''ll be astounded at the many units it can
    convert.'
