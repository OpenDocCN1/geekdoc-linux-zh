  md: '# Being Root


    Up to now, we''ve been addressing Unix tools and tips that you, as a normal user
    of the system, can take advantage of. And as a normal user, you can''t hurt the
    system as a whole—certainly, but that''s as far as it goes mess up your own files.
    As we''ve mentioned, though, there''s also a different class of user, called ''superuser,''
    or **root**. The **root** user has complete power within the system and can (must)
    handle configuration issues, software installation for everyone using the system,
    and troubleshooting. The **root** user can also easily wreck the system with a
    single typo. Thorough coverage of system administration and being **root** is
    outside the scope of this book, but it''s important to have some tools in your
    arsenal. In this chapter, we''ll give you some basic tools to use as **root**.


    +   In This Chapter

    Acting Like **root** with **sudo** 288

    Becoming **root** with **su** 291

    Starting, Stopping, and Restarting Daemons 292

    Changing the System Configuration 294

    Monitoring the System 296

    Keeping Up with **watch** 299

    Checking Boot Messages with **dmesg** 300

    Setting the Date and Time 302'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# Acting Like root with sudo


    As you know by now, logging in as root gives you the power to make changes across
    the entire Unix system, not just within the directories and files that you individually
    have permissions to access, read, or modify. Of course, having all this power
    also comes with responsibilities—not to screw up the entire system, among other
    possibilities. Especially as you''re learning about system administration, you
    may want to experiment with these skills by logging in as sudo instead. Using
    the sudo utility, you can run some commands as if you were root, but it''s not
    as risky as being root. The real root user has to give permission to use sudo,
    and sometimes the permission is limited to using specific utilities—you''ll have
    to experiment.


    If you are on a shared system—any system other than one that you are the sole
    administrator—make sure that you have permission before using sudo. All sudo uses
    are usually logged, as are attempts to use sudo. If your system administrator
    won''t be happy with you experimenting with being root, don''t use sudo on any
    system other than your own.


    In Code Code Listing 15.1, we show the difference between being a normal user
    and acting with authority with sudo.'
  merge: -1
  pgno: 301
