  md: '# # Zipping Files and Directories with zip


    If you''re working with files and directories that will be accessed on the Windows
    platform, you might need to use **zip** (rather than **gzip**). This **zip** is
    like WinZip, so it''s a safer option than **gzip**, which can work, but it depends
    on the software available on the Windows system. **zip files** are compressed
    to save disk space and sometimes contain multiple files (see **Code Listing 13.12**).


    +   * Some Unix systems don''t offer the zip command. In that case, if you need
    to share files with Windows users, use either gzip or compress, send the file,
    and tell your colleagues they can use WinZip, among other programs, to extract
    the files.


    +   * If you zip a directory (remember to include the -r for recursive argument),
    you zip all the files within.


    +   * If you can''t get the tune "Zip-A-Dee-Doo-Dah" out of your head after these
    examples, try humming "The Candy Man" or "I''d Like to Teach the World to Sing"
    or whistling the "Colonel Bogey March" (from The Bridge on the River Kwa),


    To zip files or directories with zip:


    +   1. `ls -1 z*`nat the shell prompt, use `ls -1` to confirm the names of the
    files or directories you want to zip.


    +   2. `zip -r zipped zipadeoodah`nType **zip -r** followed by the name of the
    **zip** file you''re creating (without an extension), followed by the name of
    the file or directory to zip, where -r means recursive. Then just twiddle your
    thumbs while waiting for Unix to zip your files (Code Listing 13.12).


    Code Listing 13.12 Use **zip** to compress files, particularly those you''ll share
    with Windows users.


    ```

    [unvqs@LinuxMint compression]$ ls -1 z**

    -RW-R-R- 1 ejr users 50160 Jul 27 10:22 zipadeoodah

    [unvqs@LinuxMint compression]$ zip -r zipped zipadeoodah

    adding: zipadeoodah (deflated 52%)

    [unvqs@LinuxMint compression]$ ls -1 z**

    -RW-R-R- 1 ejr users 50170 Jul 27 10:22 zipadeoodah

    -RW-R-R- 1 ejr users 239943 Jul 27 10:41 zipped.zip

    [unvqs@LinuxMint compression]$**

