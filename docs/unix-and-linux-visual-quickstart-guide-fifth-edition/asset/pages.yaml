- img_proc: true
  md: "# # Creating If-Then Statements\n\nThe basic principle of if-then statements\
    \ is if a certain condition is met, then one thing happens; if the condition is\
    \ not met, then another thing happens. That is, if you walk into your office in\
    \ the morning and you see your daily to-do list, then you sit down and work. If\
    \ you walk into your office in the morning and don't see your to-do list, then\
    \ you get to lounge all day. Or something like that.\n\nAs 1 shows, you can create\
    \ if-then statements using **if**, **then**, and **else** commands. When you set\
    \ up these conditional statements, the computer then has to test the condition\
    \ to determine whether it's true or false, and act accordingly. In the next example,\
    \ we set up a fairly simple if-then conditional statement requiring the computer\
    \ to test whether not a file exists and tell us what it finds. Use the following\
    \ steps to get started with if-then statements, and see the \"More on Conditions\
    \ for If-Then\" sidebar in this section to learn how to expand your if-then statements.\n\
    \n```\n```bash\\#!/bin/bash\n# This is my first script\necho \"Hello!\"\necho\
    \ \"You were most recently working on: ls -l / | head -5\"\n\nif [ -f feedback\
    \ ]; then\n  echo \"There's feedback in the current directory\"\nelse\n  echo\
    \ \"Nope, no feedback yet\"\nfi\n```\n```\n\nUsing if-then conditional statements,\
    \ you can let the computer determine whether something is true or not, and then\
    \ act accordingly."
  merge: -1
  pgno: 214
- img_proc: true
  md: '# To write an if-then conditional statement:


    +   1. vi deff


    To begin, access your editor and the script file. Here we''re adapting an existing
    script (for feedback) in vi.


    +   2. if [ -f feedback ]


    Start the loop with if, and then follow it with a conditional statement, in this
    case [ - feedback ], which checks for the existence of a file named feedback in
    the current directory. If that file exists, then the expression is true.


    +   3. then echo "There''s feedback in the current directory"


    On the line immediately after the if statement, the command to be carried out
    or message to be displayed if the statement is true. In this example, a true if
    statement would result in "There''s feedback in the current directory" being printed
    onscreen.


    # More on Conditions for If-Then


    Using the steps provided in this section, try some of these if-then possibilities:


    +   - [ -f filename ] checks to see whether a file exists.


    +   - [ -l -filename ] checks to see whether a file does not exist. The ! symbol
    (not) makes this test report “true” when the previous example would be “false”.


    +   - [ -d name ] checks to see whether name exists and is a directory.


    +   - [ first nt second ] checks to see whether modification date of the first
    file or directory is newer than the second.


    +   - [ first -ot second ] checks to see whether the modification date of the
    first file or directory is older than the second.


    +   - [ -n string ] checks to see whether the string has a length greater than
    0.


    +   - [ -z string ] checks to see whether the string is 0 length.


    +   - [ string1 = string2 ] checks to see whether the first string is equal to
    the second.


    +   - [ string1 != string2 ] checks to see whether the first string is not equal
    to the second.


    +   - [ \( condition1 \) -a \( condition2 \) ] checks to see whether both conditions
    are true (conditions can include other conditions).


    +   - [ \( condition1 \) -o \( condition2 \) ] checks to see if either condition1
    or condition2 is true.


    Type man test** for more information about creating conditional statements.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '+   4. else echo "Nope, no feedback yet"


    On the next line, use else followed by a statement specifying what should happen
    if the if statement is false. Here, we specify that "Nope, no feedback yet" will
    be printed onscreen if the feedback file is not found.


    +   5. fi


    Immediately after the else statement, announce that you''re finished with fi.


    +   6. Save the script and try it out.


    In this example, the script will check to see if feedback exists and print a different
    message depending on what it finds (Code Listing 10.5).


    You can specify any path to the file feedback from this example. Perhaps you want
    to specify ~/feedback to check for feedback in your home directory, or /export/shared/critical/projects/feedback.


    Code unixvs 10.5 The last line produced by the feedback script differs, depending
    on the files found.


    ```

    [unixvqs@LinuxMint scripting]$ ./deef

    Greetings! Say, you''re looking mighty sharp today!

    You were most recently working on scripting/

    Nope, no feedback yet

    [unixvqs@LinuxMint scripting]$ touch feedback

    [unixvqs@LinuxMint scripting]$ ./deef

    Greetings! Say, you''re looking mighty sharp today!

    You were most recently working on scripting/

    There''s feedback in the current directory

    [unixvqs@LinuxMint scripting]$

    ```'
  merge: -1
