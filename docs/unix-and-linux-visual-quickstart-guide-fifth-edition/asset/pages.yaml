  md: '# To uncompress and untar at one time:


    zcat filename.tar.Z | tar -xf -

    At the shell prompt, type zcat followed by the filename (as usual) and pipe that
    output to tar. Follow the tar command and flags with a - so that tar will be able
    to save the file to the intended name (Code Listing 13.15).


    # To tar and gzip at one time:


    tar -cf - Feather | gzip > feather.tar.gz

    At the shell prompt, enter your tar command as usual but add a - (and a space)
    before the filename so the output can be piped. Then, pipe the output to gzip
    and redirect the output of that to a filename with the .tar and gz extensions
    to show that the file has been tarred and zipped (Code Listing 13.16).


    Code Listing 13.15 After you find the compressed files, you can uncompress and
    untar them at once, and use ls -ld (long and directory flags) to check your work.


    ```

    [unixxvqs@LinuxMint]$ ls -1 *.Z

    -TW-R-I- 1 ejr users 297027 Jul 27 10:06 labrea.tar.Z

    [unixxvqs@LinuxMint]$ zcat labrea.tar.Z | tar -xf -

    [unixxvqs@LinuxMint]$ ls -1 ld *

    ndrwx-xr-x 2 ejr users 1024 Jul 27 10:16 Labrea

    ```


    Code Listing 13.16 You can efficiently ls -ld F and gzip all at once as well.


    ```

    [unixxvqs@LinuxMint]$ ls -ld F*

    ndrwx-xr-x 2 ejr users 1024 Jul 23 10:56 Feather

    [unixxvqs@LinuxMint]$ zcat -cf - Feather | gzip > feather.tar.gz

    [unixxvqs@LinuxMint]$ ls -1 f *

    -TW-R-I- 1 ejr users 106752 Jul 27 10:54 feather.tar.gz

    -IW-TW-I- 1 ejr users 128886 Jul 23 11:45 file1.txt

    -IW-TW-I- 1 ejr users 128886 Jul 23 11:45 file2.html

