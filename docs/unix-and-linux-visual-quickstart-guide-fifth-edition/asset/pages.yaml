  md: '# Code Listing 6.12 With a little more tweaking, awk


    lets you do a lot of processing on the files to get

    just the information you need.


    ```

    [unixxlinuxmint Examples$]

    - awk - ''{print $2 " $1 " $7 }''

    - address.book > phone.list

    [unixxvqslinuxmint Examples$]

    - more phone.list

    Sven Schmidt 555-555-8382

    Fester Feldman

    John Brown 918-555-8982

    Sally Smith 801-555-8982

    Kelly Jones 408-555-7253

    [unixxvqslinuxmint Examples$]

    ```


    # 2. awk -F, { print $1 } address.book


    The -F flag tells awk use the character

    following it—in this case, a comma

    (,) as the field separator. This change

    makes the output of the command a

    little cleaner and more accurate. If you

    were working with /etc/passwd, you''d

    use -F to specify that : is the field

    separator.


    # 3. awk -F, { print $2 " $1 " $7 }''

    - address.book > phone.list


    With this code, you can pull specific

    fields, in an arbitrary order, from

    y database. Although it looks complex,

    it''s just one additional step from the

    previous example. Rather than printing

    a single field from the address book,

    we''re printing field 2, then a space, then

    field 1, then a space, then field 7.

    The final just redirects the output into

    new file. This example would produce

    al list of names and phone numbers,

    as shown in Code Listing 6.12.


    # De-what?


    A delimited file uses a specific character

    to show where one bit of information

    ends and another begins. Each piece

    of information is a separate field. For

    ample, a file like "John, Doe,

    nton, Colorado" is comma-delimited,

    sporting a comma between fields. Other

    files, such as /etc/passwd file, use

    a colon (:) to separate the fields. Just

    about any symbol that''s not used in the

    content be used as a delimiter.


    # 4. awk -F ''/CA/ { print $2 " $1 " $7 }''

    - address.book > phone.list


    You can also specify a matching pat-

    er. Here, we use /CA/ to search

    d act only on the lines that contain

    CA, so only those lines will be in the

    phone.list file.


    > You can load awk scripts from a file with

    - f script.awk filename. Just as we

    sed, this keeps the retyping to a minimum,

    which is helpful with these long and convo-

    luted commands. Refer to Chapter 10 for more

    details about scripting.


    > Take a glance at "Sorting Files

    sort" later in this chapter and consider pip-

    ing your awk output to sort. Let Unix do the

    tedious work for you!


    Manipulating Files 117'
