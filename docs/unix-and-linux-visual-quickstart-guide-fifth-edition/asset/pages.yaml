  md: '# Setting the Date and Time


    Setting the date and time is very important for a system administrator. Why Because
    if you find something inappropriate or problematic in your log files (example,
    repeated unsuccessful login attempts from a specific location), you want to be
    able to accurately cross-reference log files with the log files of your colleagues
    at the other location. That can happen only if the time on both hosts is close
    to accurate.


    # To set the time with ntpdate:


    +   - sudo /usr/sbin/ntpdate pool.ntp

    Use ntpdate with the name of a time server (currently available servers are listed
    at www.ntp.org) to update your system clock to the current, accurate time (Code
    Listing 15.7). If you get an error message about the socket being in, use type
    ps -ef | grep ntp to find the ntp daemon that''s running to keep your time synchronized.
    (If this happens, your time is probably OK and doesn''t need to be.)

    - sudo date -s "Tues 27 5:30:23 2015"

    If your system doesn''t have ntpdate, you''ll have to set the time manually. Use
    **date** with the -s option, and all the rest of the needed information. (If you
    need to change, say, only provide the time, as in sudo date -s 5:45).


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_315_0.png)


    Unix and Linux dates are measured in seconds since January 1, 1970, which is useful
    to know for understanding the creative use shown at the top of this figure.


    Code Listing 15.7 Setting the date (and making it stays up to date) is an important
    root responsibility.


    ```

    unixvqs@LinuxMint ~ sudo date -s 5:30

    Sat Mar 29 05:30:00 MDT 2014

    unixvqs@LinuxMint ~ sudo date -s

    - "Mar 29 05:30:21"

    Sat Mar 29 05:30:21 MDT 2014

    unixvqs@LinuxMint ~ sudo date -

    - "Tue Apr 1 05:30:21 2014"

    Tue Apr 1 05:30:21 MDT 2014

    unixvqs@LinuxMint ~ sudo date $

    Sat Mar 29 09:25:23 MDT 2014

    unixvqs@LinuxMint ~ sudo

    - /usr/sbin/ntpdate pool.ntp[2596]: step time

    Mar 29 09:25:44 - 50.11.66.55 offset 0.181716 sec

    unixvqs@LinuxMint ~

    ```


    It''s much better to use ntpdate or have the ntp daemon run to keep your time
    up to date at all times. Using date manually is a poor second choice.


    All Unix and Linux dates are measured in seconds since the epoch, which is January
    1, 1970. Use date +s to see how many seconds it''s, or date -d @146104838 to see
    what number of seconds translates. You need to do this calculation, or for example,
    find out coming Fobects are scheduled'
  merge: -1
