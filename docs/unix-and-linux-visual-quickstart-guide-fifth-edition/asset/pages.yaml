  md: "# # Zipping a File or Directory with gzip\n\nIf you want to compress only a\
    \ single file or directory, you might choose gzip rather than compress. The gzip\
    \ command is more efficient, so you wind up with smaller files than you do with\
    \ compress. As Code Listing 13.10 shows, you use gzip in much the same way that\
    \ you use compress.\n\n# ## To zip a file or directory with gzip:\n\n+   1. `ls\
    \ -lh z`\n   At the shell prompt, use ls to confirm the name of the file or directory\
    \ you want to zip. In this example, we're looking for z (as in zipadeedoodah).\n\
    2. `gzip zipadeedoodah.tar`\n   Type gzip followed by the name of the file or\
    \ directory to gzip will replace the unzipped version and have a new .gz extension.\n\
    \n> > **TIP If you want to keep a copy of the original, unzipped file, try gzip\
    \ -c fileletogzip compressed.gz.\n\n> > **TIP If the compressed files will be\
    \ accessed by someone using Windows, you should consider zip, which is discussed\
    \ later in this chapter. Although gzip is more convenient in the Unix world, gzip\
    \ is not the same as traditional .zip files in Windows.\n\n```\nListing 13.10\
    \ Using gzip, you can compress a single file.\nunixqs@LinuxMint $ ls -lh z*\n\
    -rwxr-xrxr 1 unixqs unixvqs 12M Mar 30 10:20 zipadeedoodah.tar\nunixqs@LinuxMint\
    \ $ gzip zipadeedoodah.tar\nunixqs@LinuxMint $ ls -lh z*\n-rw-r--r-- 1 unixqs\
    \ unixvqs 6.2M Mar 30 10:20 zipadeedoodah.tar.gz\nunixqs@LinuxMint $\n```\n\n\
    > > **TIP Another utility used for compressing files is bzip (bzip2, actually).\
    \ You can find more information about it at www.zip.org. It's powerful, slightly\
    \ more efficient than gzip, and quickly gaining popularity.\n\n> > **TIP You can\
    \ tar a group of files and compress the single file using gzip."
