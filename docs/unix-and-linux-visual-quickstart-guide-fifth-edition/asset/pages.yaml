  md: '# Encoding Files with uuencode


    You''ll use **encoding** whenever you''re sending a **binary** file (a nontext
    file) through email. Although many email programs will take care of encoding for
    you (and, therefore, you won''t need to concern yourself with the information
    here), you may occasionally have to do it yourself.


    Files must be encoded so that they can pass through Internet email gateways unscathed.
    If you don''t encode a file and your email program doesn''t do it for you (although
    most do), the file will arrive as a bunch of unusable gibberish. This is because
    the gateways assume that all text passing through uses 7-bit words, whereas binary
    files use 8-bit (1 byte) words; therefore, binary files are garbled.


    Realistically, most email programs take care of this for you, but it''s useful
    to understand, and to be able to do on your own, in a pinch.


    To prevent gibberish, just **uuencode** your files before you send them along,
    as shown in **Code Listing 13.1.**'
  merge: -1
  pgno: 273
