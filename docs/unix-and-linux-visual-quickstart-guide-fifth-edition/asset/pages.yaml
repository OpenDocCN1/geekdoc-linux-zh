  md: "# # Using Input to Customize Your Environment\n\nBack in Chapter 8, we talked\
    \ about setting up your environment variables by customizing the configuration\
    \ files that run upon login. You can further customize your environment variables\
    \ by requiring input whenever a startup script runs. For example, you can set\
    \ your configuration files (which are actually scripts) so that they request that\
    \ you specify the default editor for the session (Code Listing 16.5).\n\n```\n\
    ```bash\n# set PATH to include your private bin if it exists\nif [ -d \"$HOME/bin\"\
    \ ]; then\n    export PATH=\"$PATH:$HOME/bin\"\nfi\n\necho \"Which editor do you\
    \ want as the default? (vi or nano)\"\nread choice\nif [ \"$choice\" = \"vi\"\
    \ ]; then\n    export EDITOR=vi\nelif [ \"$choice\" = \"nano\" ]; then\n    export\
    \ EDITOR=nano\nelse\n    echo \"Editor unchanged\"\nfi\n```\n```\n\n**Code Listing\
    \ 16.5** When the system asks you for preferences, you know you're on top.\n\n\
    ```\n```\n[unixqs@LinuxMintr]$ su - ejr\nPassword:\nWhich editor do you want as\
    \ the default?\n(vi or nano)\nvi\nYou chose vi!\n[unixqs@LinuxMintr]$\n```\n```\n\
    \n**To use input to customize your environment:**\n\n+   1. `vi/.profile`n   Use\
    \ your favorite editor to edit your script, and move to the end of the file.\n\
    \n+   2. `echo -e \"Which editor do you want as the default? (vi or nano)\"`\n\
    \   Using `echo -e`, specify the text that will prompt you to provide information\
    \ A\n\n+   3. `read choice`\nOn the next line, add `read` followed by the name\
    \ of the variable to read in. We use `choice` because we're using this input to\
    \ set the preferred `EDITOR` environment variable.\n\n+   4. `if [ $choice = \"\
    vi\" ]`\nStart an `if` statement—in this case, one that tests for the `~/vi` option.\n\
