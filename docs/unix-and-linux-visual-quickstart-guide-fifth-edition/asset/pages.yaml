    > If you''re experiencing connectivity problems, using traceroute to several different,
    geographically dispersed hosts to isolate the problem. For example, if you''re
    in the Midwest and you can traceroute all the way to www.stanford.edu (physically
    located in Palo Alto, California) but not to www.mit.edu (in Boston, Massachusetts),
    there''s likely trouble on the Internet between you and the East Coast.


