    # Printing with alpine


    Although many Unix programs don''t let you to quit your local printer, alpine
    does. All you have to do is choose %, take the default printout "attached to,"
    as alpine suggests, and your printout will appear, most like on your regular printer.
    Printing to a local printer this doesn''t work with some communications programs
    (notably Windows telnet), but it works with many. If you''re sitting in front
    of a Linux or OS system, you could also use other printing utilities on your system—the
    "attached to" option is intended for people who are connected to the Unix system
    with ssh and telnet.


    > TIP Notice the menu listed at the bottom of the alpine screen. You can choose
    any of these options by pressing the appropriate key. alpine is conveniently insensitive,
    so lowercase or uppercase commands will work.


    > TIP Start with alpine -i to start in inbox, rather than use Tab to jump to the
    nextunread message in the folder.


    > TIP Delete messages by pressing Delete, either when the message is highlighted
    in the message list or when the message is onscreen. When you quit the program,
    alpine will verify you that you want to delete the deleted messages. Just press
    Y to confirm the deleted messages, or N if you really didn''t want to get rid
    of the messages. (Note that deleting in alpine does not send them to the Recycle
    Bin, as the Delete key when using a Windows email program. In Unix, pressing Delete
    messages... they''re gone!)


