  md: '# Finding Differences in Files with diff


    Code Listing 6.15 diff tells you all you wanted to know about the differences
    between two files but not in an easily readable manner.


    ```

    [unixxvqs@linuxmint Examples]

    - diff dearleza dearhenry

    2,3c2,3

    < Dear Liza,

    < There''s a hole in my pocket, dear Liza,

    > dear Liza, dear Liza.

    > Dear Henry,

    > Please fix it dear Henry, dear Henry,

    > dear Henry.

    5,6C5,6

    < Henry

    > Liza

    > PS, you forgot your toolbox last time.

    [unixxvqs@linuxmint Examples]$

    ```


    In addition to using cmp to find out how files differ, you can use diff. This
    tells you specifically when two files differ, line by line, not just that they
    differ and at which point the differences start (see Code Listing 6.15).


    # To find differences with diff:


    diff dearleza dearhenry


    Type diff, followed by filenames. The diff output, as in Code Listing 6.15, shows
    lines that appear only in one file or the other. The lines from file 1 are indicated
    with < while the lines from file 2 are indicated with >.


    Above each line are the affected line numbers in the first file, then d, a, or
    c, then the corresponding line numbers from the second file:


    +   - d means the line would have to be deleted from file 1 to match file 2.

    - a means that text would have to be added to file 1 to match file 2.

    - c means that changes would have to be made to the line for the two files to
    match.


    > >!TIP

    > If you''re comparing email messages or other less-structured documents, you
    might consider adding the flags -i (case insensitive), -B (ignore blank lines),
    or even -w (ignore spaces and tabs) to avoid cluttering your results with unimportant
    differences. For example, you could use diff -ibw file12 to find all differences
    between two files except those involving blank lines, spaces, tabs, or lowercase/uppercase
    letters.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_132_0.png)'
