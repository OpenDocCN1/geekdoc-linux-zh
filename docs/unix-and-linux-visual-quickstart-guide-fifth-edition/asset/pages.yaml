  md: '# # Changing Your

    zsh Prompt


    Your default prompt (the text on the screen in front of the place you type commands)
    may vary a bit, depending on your Unix system; you might just see a dollar sign
    ($), a dollar sign and date, or other information as outlined in the "Setting
    Your zsh Prompt Puppy" sidebar. You can set your prompt to include information
    that''s handy for you.


    You actually have multiple prompts:


    +   - The main prompt that you usually use as the shell prompt. This prompt is
    called P51 or just PROMPT.


    +   - A secondary prompt that you see when the system requires additional information
    to complete a command. Logically, this prompt is called P52.


    You can change either of these prompts using the following steps. You start by
    finding your prompt statement (Code Listing 8.6), then modifying it in your editor
    A.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_171_0.png)


    Edit the zsh prompt statement in the editor of your choice.


