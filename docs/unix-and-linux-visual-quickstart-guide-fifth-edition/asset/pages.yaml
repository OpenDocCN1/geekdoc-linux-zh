- img_proc: true
  md: '# TABLE B.1 Key Files in Your Unix or Linux Environment


    | File Name | Description |

    |---|---|

    | / | The root directory of the whole system. Note that this differs from /root,
    which is the home directory for the root user. |

    | ~/ | Your home directory. |

    | ~/.forward | Address(es) to forward mail to, or redirects to a vacation program
    or to procmail. |

    | ~/.procmailrc | Configuration information for procmail. |

    | ~/.pinerc | Configuration information for pine and alpine. |

    | ~/.muttr | Configuration information for mutt. |

    | ~/.signature | Your signature, which is appended to your messages by email programs.
    |

