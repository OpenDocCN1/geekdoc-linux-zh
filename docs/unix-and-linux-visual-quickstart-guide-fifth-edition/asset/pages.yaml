  md: '# Controlling Job Priority with nice


    Suppose you need to process an enormous file from the Internet that would take
    practically all afternoon. By processing it, you would hog system resources and
    make the system response time much slower for other users. OK, bad example. Suppose
    your co-worker needs to process an enormous file and would hog system resources
    all afternoon. You''d hope she has the courtesy to not tie up system resources
    that you need to use.


    Fortunately, she can, use nice, which lets her control job priority. As Code Listing
    9.9 shows, you rank your job''s priority using numbers from 1 to 19, with 1 being
    somewhat (higher priority) and 19 being fabulously nice (lower priority). The
    Unix system uses the number you provide to determine how much attention to devote
    to the job.


    # To control job order with nice:


    nice -n 19 slowscript


    At the shell prompt, type nice, the -n flag followed by the appropriate adjustment
    (19, here), and the name of the program or script to run (Code Listing 9.9). In
    this example, slowscript is run with the lowest priority possible.


    Code Listing 9.9 By using nice plus an adjustment, you can let Unix determine
    how to work on your job.


    ```

    ejr@hobbes ejr$ nice -n 19 slowscript

    ```


    +   - To find out how many nice need to be, you might check out how many processes
    (and which kinds) are currently running on the Unix system. You can do this using
    ps, as described later in this chapter.


    +   - You could use nice and run a job in the background—for example, use nice
    -n 12 & script to run funscript in the background with a niceness level of 12.


    +   - If you just type nice plus the job name (as in sortslow). Doing so will
    automatically specify 10 as the niceness level (the default setting).


    +   - If you are the system administrator and logged in as root, you can use negative
    numbers (down to -20) with nice to increase the priority (nice -n -16 priorityjob).


    +   - Use renice to change the niceness of a running job. For example, use nice
    -n 18 2958 (the job number). If you''re the system administrator, you can increase
    or decrease the niceness of any job; if you—person, we mean a regular user at
    your company—you can only decrease the priority of your own jobs, not increase
    it. In a pinch, you could ask your administrator to increase the priority of your
    job.'
  merge: -1
