  md: "# # Getting a Head Start on Scripts with history\n\nIf you find yourself performing\
    \ a particular process over and over again, consider making that process into\
    \ a script. Any easy way to create a script is to work from the session history,\
    \ as shown in A. Basically, all you have to do is complete the procedure one time,\
    \ and then use the session history to build the script for you.\n\n```\n158 history\n\
    159 elbow\n160 desktop\n161 nano myscript\n162 vi \"Testing\"\n163 cd\n164 cd\
    \ /media/sf_Drakuin/VIQ_Revision/Examples/\n165 cd\n166 cd-sorting\n167 history\n\
    168 nano\n169 test\n170 at 12:01 Jan 2014\n171 at 12:01 Jan 2015\n172\n1733\n\
    174\n175 mkdir\n176 vi -n\n177 history\n178 history 20 > standby\n```\n\nA You\
    \ can enter a series of commands and then use the code provided with history to\
    \ help create a shell script.\n\n# **To get a head start on your script with history:**\n\
    \n+   1. Go through the process that you want to include in the script.\n   We'll\
    \ wait.\n2. Keep a rough count of the commands you issue.\n   Don't worry about\
    \ the exact number of commands you use, but have an idea as to whether it's 3,\
    \ 30, or 300 commands.\n3. history 20 > standby\n   When you've finished the process,\
    \ type history followed by the approximate number of commands for your script.\
    \ When estimating the number of commands, err on the high side, because it's easy\
    \ to delete extra commands. Then, redirect the output to the desired filename,\
    \ and you'll see it in your making script.\n4. vi standby\n   Use the editor of\
    \ your choice to edit your script file, deleting the initial line numbers and\
    \ spaces and generally whipping that script into shape. See the section \"Creating\
    \ a Shell Script\" earlier in this chapter for more details.\n\n> TIP If you use\
    \ vi, do a global search-and-replace to get rid of the line numbering (that history\
    \ introduced) at the left—just use :s/^ [0-9]*/g (one space after the ^), and\
    \ you're in business. See Chapter 4 for more vi tricks."
