  md: "# About vi or vim\n\nAlthough **vi** is likely responsible for much of Unix's\
    \ and Linux's reputation for being complicated and confusing, it offers enormous\
    \ power and flexibility. Plus, **vi** is universally available (unlike nano),\
    \ and for these reasons, you should consider taking the time to learn it. You\
    \ might find it cryptic, counterintuitive, and nitpicky, and for this reason you\
    \ might want to choose a different editor if you don't require **vi's** capabilities.\
    \ As it shows, if you use **vi**, you won't have to get menus at your disposal—`Esc`q\
    \ or `Esc:%s/vi` is arcane/vi is powerful!\n\nYes, continuing the theme from the\
    \ previous section, there is an equivalent of **vi**, called **vim**, that is\
    \ licensed differently and somewhat more powerful. For basic use—everything in\
    \ this book and far more—the two are identical. In this case, though, you will\
    \ always find **vi**, even if it's really **vim** (which actually be a symlink,\
    \ or shortcut to **vim**). If you find them, though it will assuredly be **vim**,\
    \ commands will be the same, just dive in and enjoy.\n\n![](img/fff2eea2e42bd82cdabda71c69c59f13_87_0.png)\n\
    \n> > vi edit was a mess. \n> I learned this in a bucket. \n> It's hard to learn.\
    \ \n> If I just had a doubt I'd do it\n\n> > vi gives you a clean screen and makes\
    \ you remember all of its cryptic commands.\n\n# Editors Abound\n\nIn addition\
    \ to **nano** and **vi** (covered in this chapter), dozens of other editors exist:\n\
    \n+   **emacs** offers a reasonable middle ground between the user-friendliness\
    \ of **nano** and the power of **vi** (or **vim**). Do not note that it's fully\
    \ powerful as **vim** for the experienced user, but it is still easier to get\
    \ started with. It's not available on all systems, though, you'll just have to\
    \ type the command to see if you have access to it.\n\n+   **ed, jed, and e3**,\
