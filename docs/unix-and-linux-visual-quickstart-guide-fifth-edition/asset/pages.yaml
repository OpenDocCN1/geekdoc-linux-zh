  md: "# Debugging Scripts\n\nAs you're developing scripts, you'll no doubt encounter\
    \ a few problems in getting them to run properly. As A shows, you can help debug\
    \ your scripts by printing the script onscreen as it runs. That way, you can follow\
    \ the script as it runs and see where the problems might be.\n\n```\n$ ./script.sh\
    \ retentive\necho -n \"File do you want to analyze?\"\nread file\nif [ $file =\
    \ \"./testfile\" ]; then\n  echo \"testfile has 11 misspelled words\"\ntestfile\
    \ has 11 misspelled words\nelse\n  echo \"file has not changed\" -n \"print \"\
    $8\" on \"$6\" \"$7\"\nfi\nat 08:44 on Mar 30\nminutepart 5\n```\n\n# To print\
    \ the script onscreen as it runs:\n\nsh -x retentive\n\nAt the shell prompt, type\
    \ sh -x followed by the script name (and any additional information you need to\
    \ provide). The -x tells the shell to execute the script (as usual) and print\
    \ out the individual command lines, as shown in A.\n\n+   A Printing the script\
    \ onscreen as it runs is a great way to debug it.\n\n> TIP Use the name of an\
    \ appropriate shell, followed by -x, followed by the script name for this kind\
    \ of debugging output. For example, try bash -x retentive."
