  md: '# Looping Your Scripts


    Suppose you''ve created a script that you''d like to apply to several files. For
    example, say that at the end of each day you need to make backup copies of all
    .html files in your www directory. You could make a backup of each individual
    .html file, but that takes a lot of work. An easier way would be to copy a single
    .html file, and then loop (repeat) the script to apply all .html files in your
    directory. You create one short script; Unix does the tedious work for you.


    To make a loop:


    +   1. vi head_ache

    At the shell prompt, start your editor and open the shell prompt you want to loop.
    In this case, we''re using vi and the head_ache file. (Of course, you could name
    the script html_backup or something mundane like that.)


    +   2. #/bin/bash

    Tell your Unix system which shell to use to run the shell script. In this example,
    we''re telling it with (#!) to run the shell script with /bin/bash.


    +   3. cd ~www

    Make sure that you''re in the directory in which the loop will take place. In
    this example, our shell script resides in our home directory, but the files to
    which the loop will apply reside in the www directory.


    continues on next page


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_212_0.png)


    Using a loop with an embedded command, can automatically apply a script to several
    files.'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# 4. for i `ls *.html`


    OK, don''t panic. Read this as: "Look for items in the list of .html files." In
    this code, we''re providing the output of the embedded command (`ls *.html`) to
    the for loop (`.html files`), as shown in A. The -1 flag on the `ls` command,
    as mentioned in the previous section, forces a single list of output (which is
    ideal for script rather than several columns (which is easy to read onscreen but
    doesn''t work for scripts).


    Code List 10.4 This loop reports progress as it backs up each file.


    ```

    [unixvxqs@LinuxMint]$$

    > more head_ache

    # /bin/bash

    cd ~~

    for i in $(ls -1 *.html); do

    cp "$i" "$i.bak"

    echo "$i backed up!"

    done

    [unixvxqs@LinuxMint scripting]$ ./head_ache

    above.html backed up!

    file.html backed up!

    html.html backed up!

    reference.html backed up!

    temp.html backed up!

    [unixvxqs@LinuxMint scripting]$

    ```


    # 5. do


    On the line immediately after the for statement, type do. This tells the Unix
    system that the following information will be the loop.


    # 6. cp "$i.bak"


    Here, we copy (cp) the specified items ($i) to a backup file ($i.bak)—that is,
    one file per file copied. So, if you have 72 .html files to begin with, you''ll
    end up with those original 72, plus 72 new backup files.


    # 7. echo "$i backed up!"


    Add echo "$i backed up!" so the system displays onscreen when it has done.


    > TIP Loop instructions can be much complex. For example, you could make a loop
    to spell-check each of the chapter files in the directory and report how many
    misspelled words are there in each. To do that, use this line in the loop: echo
    -e $i - wc ''cat $i | spell | wc -1 misspelled words''. After, build the loop
    one step at a time.


    > TIP Loops are particularly handy for searching and replacing multiple occurrences.
    For example, if you''re the new webmaster and want to replace the old webmaster''s
    name at the bottom of all .html files with your name, you can do using a loop
    with sed. Check out Chapter 6 for more information


    # 8. done


    On the next line, announce that you''re done with the loop.


    # 9. Save it, make it executable, and try it out.


    This example script will make backup copies of all .html files in the directory,
    as in Code Listing 10.4.'
  merge: -1
