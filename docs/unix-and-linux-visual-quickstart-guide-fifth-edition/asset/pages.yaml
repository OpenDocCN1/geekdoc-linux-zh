  md: '# Connecting to the Unix or Linux System


    Your first step in using Unix or Linux is to connect to the system. Exactly how
    you will vary depending on what kind of Internet connection you use, but the following
    steps should you get started.


    # To connect to the Unix system:


    +   1. If you''re using your Mac or Linux system at home, you''re already connected.
    (Go ahead and open your terminal program.)

    2. If you''re connecting to a remote system, start your ssh program and connect
    to the Unix or Linux system.


    Using ssh can connect to a remote computer (such as your ISP''s computer) and
    work as if the remote computer were sitting on your desk. Essentially, ssh brings
    a remote computer''s capabilities to your fingertips, regardless of where you
    are physically located. (See the "About Connecting" sidebar for more information
    about connection technologies.)


    Exactly how you connect depends on the program you are using. For Windows users,
    we recommend PuTTY, which is a free ssh client available at www.chiark.greenend.org/~sgtatham/putty/.
    For pre-OS X Macintosh users, we recommend the predictably named MacSSH, also
    free, available at http://sourceforge.net/macsssh.


    # About Connecting


    Once upon a time, when dinosaurs roared the earth, Unix users connected to their
    systems using telnet. Your password and everything else you do is sent across
    the wire and can be easily read by anyone on the same part of the network. Yikes
    right! That''s why most ISPs and system administrators require ssh (Secure Shell)
    to connect to their systems. With ssh, everything is encrypted, precisely the
    way your connection is encrypted when you use an e-commerce site and see that
    the little padlock in your web browser is closed.


    Yes, we don''t have any secrets, but if a hacker logs into your ISP''s system
    as you do, that hacker has 50 percent of the battle for taking illegal activities.
    And if your neighbor''s 19-year-old son sniffs (that''s the technical term) your
    identification (called the user or user ID) and password over your cable modem
    connection (and that is entirely possible), he can probably guess your bank password
    or broker password (whatever that is)


    Throughout this book, we''ll see examples using an ssh connection. If, for whatever
    reason, your system administrators don''t require ssh, we recommend using it anyway;
    for there is absolutely no reason not to, because there are no advantages to ssh
    compared to telnet. If your systems don''t support ssh, you can use the telnet
    (a better choice) or login/rsh program (a slightly better choice) as alternatives.
    And consider purchasing some extra wood for the steam engine that powers your
    antique.'
  merge: -1
