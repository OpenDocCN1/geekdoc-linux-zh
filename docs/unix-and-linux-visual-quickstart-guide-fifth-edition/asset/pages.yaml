    # # Piping Input

    and Output


    In general, you can think of Unix command (ls, cd, and so on) as an individual
    program that Unix executes. For example, if you cat /etc/motd at prompt, Unix
    will display the contents of motd in the /etc directory. Each program requires
    input (in this example, cat, the program takes the contents of /etc/motd as input)
    and produces output (that is, the displayed results).


    Frequently, you''ll want to run programs in sequence. For example, you could tell
    Unix to read your résumé and then spell-check it. In doing this, you connect two
    commands in which you run the output of one program to the input of another, which
    is called piping. Depending on what you want to do, you can pipe together as many
    commands as you want—with the output of each command acting as the input of the
    next.


    As shows, you pipe commands together using the pipe symbol, which is the character.
    In the following example, we''ll pipe the output of the ls command (which lists
    the contents of a directory) to the more command (which lets you read results
    one at a time). For details about more, see “Viewing File Contents with more,”
    later in this chapter.


    +   - To execute multiple commands in sequence, pipe them together using the pipe
    symbol (|).'
