  md: '# Viewing File Systems with df


    If you''re used to Windows or Macintosh operating systems, you''re probably accustomed
    to seeing separate hard drives (C:, D:, or E for Windows users, or real names
    for Macs), which are just different storage spaces. In Unix and Linux systems,
    different storage spaces are grafted onto the overall tree structure—that already
    exists without any clear distinction indicating where actual disk drives are located.
    For example, if you have a folder on a Windows computer, you know that all the
    subfolders and files within it are located on the same hard drive. In Unix and
    Linux, everything resides within the root directory, but any different directory
    could be located on a different physical hard drive, flash drive, DVD, or other
    storage system. You might think of it as taxing a new branch onto your artificial
    Christmas tree.


    These tacked-on storage spaces are called file systems. Particularly if you''re
    running a Unix system (as opposed to just using one), you might need to find out
    what file systems are in use (or mounted in the system, in technical terms), how
    much space they have, and where they attach to the Unix system (or where their
    mountpoints are). You can find this information using df,


    ```

    [ejr@hobbes ej$ df

    Filesystem 1024-blocks Available Capacity Mounted on

    /dev/hda1 515161 316297 172255 65% /

    /dev/hdb4 66365 4916 58022 8% /home

    /dev/hdb1 416656 324633 70504 82% /usr/local

    /dev/sbpcd 596704 596704 0 100% /mnt/cdrom

    [ejr@hobbes ej$]

    ```'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# To find out about file systems with df:


    df

    At the shell prompt, type df. You''ll usually get output showing you the following:


    +   - The name of the device, which refers to the physical part that stores the
    data, such as a hard drive, CD-ROM, or whatever. In Code Listing 7.3 the first
    one is /dev/hda1, indicating the first hard drive in the system.


    +   - The number of blocks, which are 1-kilobyte-sized storage units (1-kilobyte-sized
    in this case, although some systems report them as 512 bytes).


    +   - The number of used and available blocks on the device.


    +   - The percentage of the space on the device that is being used.


    +   - The name of the file system, which is the full path from the Unix system.
    This is also known as the mountpoint.


    Code Listings 7.3 and 7.4 show the output of df on two different systems.


    Code Listing 7.4 *This large ISP''s files are considerably more complex.*


    | example df | (/dev/dk03050) | 154632 blocks | 71721 files |

    | /usr | (/dev/dsk03056) | 225886 blocks | 144820 files |

    | /proc | (/proc) | 0 blocks | 7830 files |

    | /dev/fd | (/fd) | 0 blocks | 0 files |

    | /var | (/dev/dk0cit050) | 100142 blocks | 96298 files |

    | /tmp | (swap) | 126032 blocks | 95277 files |

    | /usr/local | (/dev/dk0cit051) | 610636 blocks | 457211 files |

    | /archive | (/dev/dk0cit053) | 1180362 blocks | 1789487 files |

    | /var/mail | (mail.example.com:/mail) | 277657 blocks | 1438835 files |

    | /home | (krunk1.example.com:/home:) | 20019072 blocks | 1306932 files |

    | /var/spool/newslib | (news.example.com:/var/spool/newslib) | 19327664 blocks
    | 1248s |

    | .web | (krunk1.example.com:/.web) | 1019408 blocks | 470095 files |

    | /var/maillists (lists.example.com:/var/maillists:) | 293744 blocks | 89732s
    |'
