- img_proc: true
  md: '# Creating a Shell Script


    A shell script is nothing more than a list of commands for Unix to execute. To
    write a shell script, follow these steps:


    +   1. Open your favorite editor and start a script file.


    +   2. Start the shell script with #!/bin/bash.


    +   3. Add the shell script code one line at a time. This code will look strangely
    familiar—it''s similar to code you''ve already used in this book.


    +   4. Save and close the file.


    In the following steps, we''ll show you how to try this out by writing a script
    that prints three lines onscreen. Yeah, we know—whoopee!—but you have to start
    somewhere, and you can apply the same principles to other shell scripts you create.


    # To create a shell script:


    +   1. nano myscript


    For starters, access the editor of your choice and start a new file. In this case,
    we name it myscript.


    +   2. #!/bin/bash


    On the first line of the script, enter #!/bin/bash, which specifies the complete
    path to the shell that should run the script (bash, in this case).


    +   3. # this is my first shell script


    On the next line, type a # (to indicate a comment), and then add any other notes
    you want to make. It''s always a good idea to use extensive comments in your scripts
    to help you see what''s going on. Remember, comments are for your reference only
    and won''t show onscreen or do anything.


    ```

    #!/bin/bash

    # myscript

    # this is first shell script

    echo friendsjust

    echo "standing"

    echo -e "\t"

    ```


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_204_0.png)


    You create scripts in an editor one line at a time.


    continues on next page'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# 4. echo friendsjustfriends


    On the next line of the script, type **echo** followed by the text you to see
    onscreen. Here, **echo** tells Unix to display **friendsjustfriends** onscreen—a
    message just between friends.


    # 5. echo


    Add another line with **echo** and nothing else to display a blank line.


    # 6. echo "standing"


    Add another **echo** command. Note that if you use leading spaces or tabs, as
    we''ve done here, you must use quotes, as **\A** shows.


    # 7. echo - "tgood"


    Using the -e flag **\t**, you can insert a tab character. In doing so, you get
    good understanding **echo** for more **echo** options.


    # 8. Save and close your script.


    Check **Chapter 4** if you need help saving a file and closing your editor.


    # 9. bash myscript


    Use **bash myscript** to run your script. In doing you get understanding (literally),
    as shown in **Code List 10.1**.


    Ta-daaaaa! You just wrote your first script! (See the following section for more
    information and details on running scripts.)


    > **TIP** Unless you have some different shell (for example, if you''re using
    a zsh script because you are taking advantage of functions that exist only in
    zsh, or striving for a script that will run on unique Unix systems), just stick
    with bash for now.


    Code List 10.1 Using **echo** options, you can get a good understanding—or, perhaps,
    a good understanding between friends.


    ```

    [unixvs@linuxMint scripting]$ sh myscript

    standingjustfriends

    good

    ```


    # Getting Fancy with echo


    In addition to the basic print-to-screen function that **echo** offers, you can
    also use these flags with **echo -e** (the -e enables these special formatting
    characteristics):


    For example, **echo -e "\tGreetings!\c"** would move "Greetings!" one tab space
    to the right (as specified by the **\t**) and not insert a new line for any text
    following it (as specified by the **\c**).'
  merge: -1
