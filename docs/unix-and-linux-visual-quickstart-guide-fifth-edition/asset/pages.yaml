  md: "# Adding or Changing Variables\n\nAfter you've poked around in your environment,\
    \ you might determine that you want to set a variable that's not currently available\
    \ or change one to make it better meet your needs. In general, you won't randomly\
    \ specify variables; you'll do it because a certain program requires a specific\
    \ variable in order to run.\n\nBy following the steps in this section, you can\
    \ add or change environment variables for the current session. As Code Listing\
    \ 8.2 shows, for example, you can specify a news server variable (called NNTPSERVER)\
    \ that some Usenet news require to access the news (nntp) server.\n\nTo add or\
    \ change a variable in zsh or bash:\n\n+   1. NNTPSERVER=news.example.com\n  \
    \ At the shell prompt, type the name of the variable (in this case, NNTPSERVER),\
    \ followed by = and the value you want for the variable (here, news.example.com),\
    \ as shown in Code Listing 8.2. In this step, you're setting up the variable and\
    \ its value and making it available to all programs and scripts that run in the\
    \ current shell session.\n   If the value contains spaces or special characters,\
    \ put the value in quotes.\n2. export NNTPSERVER\n   Type export followed by the\
    \ name of the variable. By exporting the variable, you make it available to all\
    \ programs and scripts that run in the current shell session (again, Code Listing\
    \ 8.2).\n   Until it is exported, it is a shell variable, which will not be available\
    \ to other processes that this shell starts.\n\nCode Listing 8.2 in the zsh and\
    \ bash shells, you can add a new environment variable by specifying the variable\
    \ and its value, exporting the variable to the system.\n\n```\n[ej@hobbies ejr$\
    \ NNTPSERVER=news.example.com\n[ej@hobbies ejr$ export NNTPSERVER\n[ej@hobbies\
    \ ejr$ echo NNTPSERVER\\\nnews.example.com\n[ej@hobbies ejr$]\n```"
