  md: '# To archive a directory with tar:


    +   1. ls -l


    For starters, type ls -l at the shell prompt to verify the name of the directory
    you''re going to tar.


    +   2. tar -cf tarredfilename.tar


    Type tar followed by


    +   - -cf flags (to create a file and specify the desired filename for it)


    +   - The name you want the tarred (archived) file to have (tarredfilename.tar
    in this example)


    +   - The name (or names) of the directory or files to tar (Feather, here)


    > TIP See the "Combining Commands" section later in this chapter for timesaving
