  md: "# Managing Email with procmail\n\nprocmail can help you automatically—or selectively—respond\
    \ to email. As you, procmail is similar to forwarding email and using the vacation\
    \ program, but you'll probably find procmail much more flexible.\n\nTo specify\
    \ how messages should be filtered (“write a recipe”):\n\n+   1. vi ~/.procmailrc\n\
    \   In vi, access your .procmailrc file.\n2. Move to the end of the file, below\
    \ the setup information.\n3. :0:\n   Start a new recipe with :0:, as shown in\
    \ 1. (Don't ask why you use :0:. That's just the way it is.)\n4. * ^TOGolfBuddies\n\
    \   Set the criteria for procmail to filter with, Here:\n* ^TO tells procmail\
    \ to examine the TO line (and, actually, the CC line, too) of all incoming messages.\n\
    * GolfBuddies is the text to match in the TO line (as To: GolfBuddies@nowhere.com).\
    \ Of course, you'd put in the actual name of the list to look for (or the alias\
    \ for whatever) for your mailing list, rather than GolfBuddies.\n\n+   5. $MAILDIR/FriGolfBuddies\n\
    \   Specify where the filtered mail should go. In this case, FriGolfBuddies folder,\
    \ but you might filter messages from mailing lists into a listmail folder.\n\n\
    +   6. Save and close the file.\n\n![](img/fff2eea2e42bd82cdabda71c69c59f13_245_0.png)\n\
    \n> Add the recipes of your choice to your .procmailrc file."
  merge: -1
  pgno: 245
