    rehearsing previous commands (instead of retyping them), and modifying (rather
    than completely redoing) or complex commands.


    **To view session history in the zsh shell:**


    +   1. **zsh** as you usually would, changing directories, redirecting output,
    or using other tasks. For example, review the previous chapter and practice the
    commands you''ve learned so.


    +   2. Press ↑ one time.

    Note that the last (previous) command you used appears on the command line, as
    shown in Code Listing 3.11. To reissue the command, just press `Enter`.


    +   3. Continue to press ↑ or ↓ to scroll back or forward through your history.
    When you reach a command you want to use, press `Enter`.


    If you see a command that''s close but not exactly what you want to use


    +   4. Type **history** at the shell prompt to show a numbered list of previous
    commands you''ve entered.'
