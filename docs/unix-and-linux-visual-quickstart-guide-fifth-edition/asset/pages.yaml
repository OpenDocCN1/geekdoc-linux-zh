    you''ll find system commands and programs.


    TIP You can list the files and directories of the root directory at any time and
    in any place by typing `ls /`. The root directory is all the highest-level directory
    in a Unix system; all other directories are below the root directory.


    TIP Can''t remember pesky filename? Just use ls to jog your memory. Or, refer
    to "Finding Forgotten Files with find" in Chapter 2, which can also help you remember
    filenames.


    TIP Many other options are available to control the amount of information about
    your files that you see and in the format which they appear onscreen. See the
    section "Listing Directories and Files with ls (More Goods)" in Chapter 2 for
    details.


    Code Listing 1.3 Use ls with the name of a directory to list the contents of that
