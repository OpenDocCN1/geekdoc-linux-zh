  md: '# # Using Regular Expressions with grep


    In addition to using **grep** to search for simple text strings, you can use **grep**
    to search using *regular expressions*. Regular expressions are like fancy wildcards,
    where you use a symbol to represent a character, number, or other symbol. With
    regular expressions, you can search for different parts of files, such as the
    end of a line or a text string next to another specified text string. (You might
    see this process described as "globbing" as well.) **Table 6.1** lists some of
    the more common regular expressions.


    | Regular Expression | Function | Example | Explanation |

    |---|---|---|--|

    | . | Matches any character. | `grep bry` | This finds all instances of "berry"
    or "bar". |

    | * | Matches zero or more instances of the preceding item, so a "b" would find
    "b" as well as "ab" and "aaab", but not "acb". | `grep s*/home/ej/schedule` |
    Here, the * matches zero or more of the items that immediately precede the *;
    in this case, the letter ''s''. |

    | ^ | Matches only instances of the string at the beginning of a line. | `grep
    ''^Some'' sayings` | With the ^, you specify that the search string must appear
    at the beginning of a line. The example would find a line beginning with "Some"
    but not one beginning with "Read". |

    | $ | Matches only instances of the string at the end of a line. | `grep ach$''
    sayings` | This finds all lines in the file sayings that end with "ach". |

    | \ | Escapes (quotes) the following character—so you can search for literal characters
    like \* or $ that are also operators. | `grep ''\*'' saying` | grep \* searches
    for all instances of * in the sayings file. The \ interprets it literally, as
    an asterisk, rather than a wildcard. |

    | ] | Matches any member of the set, like [a-z], [0-6], or [321] (Three or two
    ones). | `grep ''number[0-9]'' specifications` | Use brackets [ ] to enclose a
    set of options. Here, number[0-9] would match all instances of number1, number2,
    number3, and so forth in the file called specifications.'
