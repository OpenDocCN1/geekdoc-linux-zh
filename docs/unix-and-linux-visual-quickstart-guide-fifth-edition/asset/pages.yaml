    ps


    At the shell prompt, type **ps** to see the list of the current processes that
    you''re running in your current shell, including processes for your current shell,
    as well as any other jobs (Code Listing 9.12).


    The exact information you see will vary from system to system. In general, though,
    you''ll find the *PID* (process identification) number at the far left and the
