    # Variables You Can Mess With


    The following table includes some of the variables you can safely change. Keep
    in mind that the shell itself might not use a specific variable, like **NNTPSERVER**,
    whereas programs running under the shell might. Some shells assign default variables,
    while in other cases you''ll have to manually set the value.


    | zsh and bash | Description |

    |---|---|

    | CDPATH | Specifies the search path for directories specified by `cd`. This is
    similar to `PATH`. |

    | COLUMNS | Specifies the width of the edit window in characters. |

    | EDITOR | Specifies the default editor. |

    | ENV | Specifies where to look for configuration files. |

    | HISTFILE | Specifies the name of the file containing the command history. |

    | HISTFILESIZE | Specifies the maximum number of lines to keep in the history
    file. |

    | HISTSIZE | Specifies the number of commands to keep in the command history.
    |

    | HOSTFILE | Specifies the name of the file containing host aliases for expansion.
    |

    | IGNOREREOF | Specifies that `Ctrl-D` should not log out of the shell. Use `IGNOREEOF=`
    to... |

    | LINES | Specifies the number of lines on the screen. |

    | MAIL | Specifies the location of incoming mail so **bash** checks for mail how
    often (in seconds) for mail. |

    | MAIL_WARNING | Specifies the message to be displayed if you have read mail but
    not unread. |

    | noclobber | Specifies that the shell should not overwrite an existing file when
    redirecting output. |

    | PATH | Specifies the search path for commands, including multiple paths separated
    by colons. |

    | PROMPT_COMMAND | Specifies the command to be run before displaying each prompt.
    |

    | PS1 | Specifies the primary prompt. |

    | PS2 | Specifies the default second-level prompt. |

    | PS3 | Specifies the prompt for the `select` command in scripts. |

    | PS4 | Specifies the prompt used when tracing execution of a script. |

    | TIMEOUT | Specifies time in seconds to wait for input before closing the shell.
    |

    | VISUAL | Specifies the default visual editor—usually the same as **EDITOR**,
    but referenced by different programs. |'
