  md: 'If you modify the connection settings, you may need to disconnect from the
    session, reconnect again for the new settings to take effect. See your documentation
    for specifics about disconnecting from your session.


    In addition to viewing the buffer to see commands you''ve used, as mentioned in
    the "The SSH Preferences Dialog Box" sidebar (later in this chapter), you can
    also use a command to let you review commands that you''ve issued. For more information,
    see the appropriate "Viewing Session History" section in Chapter 3.


    # # Before You Begin


    Before you begin, have your connection information, such as your login name and
    password, handy.


    Contact your system administrator if you don''t yet have these. Throughout this
    book, we''ll use "system administrator" to refer to your help desk, ISP technical
    support line, brother, spouse, or anyone else you can call on who runs your Unix
    system and can help you. Sometimes that geeky daughter, brother, or otherwise
    Unix person can help you out with Unix, too; however, in many cases you''ll find
    that you need to troubleshoot a problem with the person who can manage your account
    information.


    # # Write Down Details About Your Specific Login Procedure


    As you go through your login procedure, take a minute to write down some details
    for future reference.


