  md: '# # Finding Forgotten Files with find


    Where, oh where, did that file go? Sometimes finding a file requires more than
    cursing at your computer or listing directory contents with **ls**. Instead, you
    can use the **find** command, which lets you search in dozens of ways, including
    through the entire tree (**Code Listing 2.11**) or through directories you specify
    (**Code Listing 2.12).


    # To find a file:


    ```

    find . -name lostfile -print

    ```


    Along with the **find** command, this specifies to start in the current directory
    with a dot (.), provide the filename (**-name lostfile**) and specify that the
    results are printed onscreen (**-print**). See Code Listing 2.11.


    # To find files starting in a specific directory:


    ```

    find /home/deb -name ''pending*'' -print

    ```


    This command finds all the files and directories with names starting with **pending**
    under Deb''s home directory. Or, you can find files under multiple directories
    at one time, like this:


    ```

    find /home/deb /home/ejr* -name ''pending*'' -print

    ```


    This command finds files with names starting with **pending** in Deb''s and Eric''s
    home directories or any subdirectories them (Code Listing 2.12).


    Code Listing 2.11 Use **find** to locate a missing file.


    ```

    $ find . -name lostfile -print

    ./Projects/schedule/lostfile

    $

    ```


    Code Listing 2.12 By using wildcards and specifying multiple directories, you
    can make **find** yet more powerful.


    ```

    $ find /home/deb -name ''pending*'' -print

    /home/deb/Projects/schedule/pending.tasks

    $ find /home/deb /home/ejr -name

    ''pending*'' -print

    /home/deb/Projects/schedule/pending.tasks

    /home/ejr/pending.jobs.to.today.to.do

    ```'
  merge: -1
