  md: "# Downloading Websites with wget\n\nCode Listing 12.4 You can use wget to download\
    \ as much of the web as you can handle.\n\n```\n$ jdoe/home/jdoe wget http://www.cnn.com/\n\
    18:07:51 http://www.cnn.com/\n> 'index.html'\nResolving www.cnn.com... done.\n\
    Connecting to www.cnn.com[64.236.234.24]:80... connected.\nHTTP request sent,\
    \ awaiting response...\n200 OK\nLength: unspecified [text/html]\n[<] 51290 (53.28\
    \ KB/s) - 'index.html' saved\n[>] 51290\njdoe/home/jdoe $\n```\n\nThe wget utility\
    \ allows you to download webpages—and whole websites—to use offline. You just\
    \ specify a URL and how many levels (links away from the starting page) you want\
    \ to download, and let wget do its thing (in Code Listing 12.4). You can then\
    \ use the webpages when you're not connected to the Internet, as when you're on\
    \ an airplane, in a hotel, or in a waiting room, for example.\n\nTo download websites\
    \ with wget:\n\n+   wget http://www.cnn.com/\n   At the prompt, type wget followed\
    \ by the URL of a website or FTP site. Here, we're accessing the CNN website (Code\
    \ Listing 12.4) and downloading the home page.\nSlurp!\nlinks index.html\n   Then\
    \ use your favorite web browser to check out youri.\n\n> wget --recursive --level=2\
    \ http://www.example.com/ lets you get several (two, in this case) levels of a\
    \ website. Be careful, because it's easy to bite more than you can chew. If you\
    \ use wget -r http://www.example.com/, wget will try to recursively download the\
    \ whole thing. We ended up with 20 MB from the first command on www.cnn.com.\n\
    \n> We recommend using a separate directory to contain the contents of different\
    \ websites. Otherwise, wget will either rename files to (overwriting) existing\
    \ files (thus breaking links) or clobber existing files (making it highly likely\
    \ that only the last website downloaded will be complete). If you use wget with\
    \ the -x option (in, wget -x http://www.example.com/), it will do this automatically.\
    \ See Chapter 2 for more on using directories.\n\n> wget also works for FTP sites.\
    \ Use wget ftp://ftp.example.com or wget jdoe:asecret@ftp.example.com if you need\
    \ to specify a password.\n\n> Check out the man page for wget (man) for more on\
