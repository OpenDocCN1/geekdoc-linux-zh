  md: '# # Changing the System Configuration


    Most (nearly all) the system configuration files for Unix systems are contained
    in the `/etc` directory. If there is a configuration setting specific to a user,
    the setting will be located in the user''s home; otherwise, configuration settings
    for the whole system are located in the `/etc` directory.


    We''re not going to get into much—you really should know what you''re doing before
    you start fusing your system configuration. However, if you''re `root`, you should
    have something fun to play with, so here''s following example, you''ll see how
    to change the Message of the Day (aka the `motd`), which greets users when they
    log into the system **A** and **B**.


    To change the motd:


    +   1. `sudo vi /etc/motd`


    Use **sudo** to gain **root** access and edit the `/etc/motd` file.


    +   2. Hey, you have wrinkles in your stockings!Oh...sorry, you''re not wearing
    stockings!


    Uhhh, yikes! Add your favorite slogan, saying, or comment to the file. Keep in
    mind that everyone who logs in to the system will see this message, so keep it
    clean... and be nice! (See B)


    +   3. `logout`


    Log out, so you can log back in and see your handiwork.


    +   4. `ssh usersystem.example.com`


    Log back in to see the new message.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_307_0.png)


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_307_1.png)


    Any user will see the `motd` when logging in.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_307_2.png)


    After a user with **root** privilege edits `/etc/motd`, it''s...different.'
  merge: -1
  pgno: 307
- img_proc: true
  md: 'The /etc/motd file is really handy for providing warnings, notes, and comments
    to system users. Particularly if you''re planning on having system downtime or
    maintenance, it''s nice to warn users with a message in /etc/motd.


    Virtually every other change you might make in /etc will also affect everyone
    on the system. Be careful.


    Depending on what you choose to change or edit in /etc, you might need to restart
    the appropriate daemon (as described in the previous section) for your changes
    to take effect. If it looks like your change didn''t work, restart the daemon.


    Unix man pages also usually describe the configuration files found in /etc. Use
    man pages (as in, man exports) to find out what the configuration does.


    # Installing Software


    As root, you can also install your own software.


    The new way, though, is far easier. On most Unix and Linux systems, you can use
    a special program that will go out on the web and download the program you need
    (along with any supplementary programs you need to run) and install it automatically.
    Wheee!


    Online repositories, specific to each different Unix or Linux variety, contain
    large quantities of packages, which are programs and all the needed configuration
    settings to allow them to work. When you install—upgrade your software, you are
    downloading from these repositories.


    For example, on Ubuntu or Linux (like LinuxMint, our favorite of the week), if
    you want to install the fortune application so you can see more clever or clever
    sayings than you otherwise might, you can simply type sudo apt-get install fortune
    and stand back.


    The comparable command on OpenSolaris is pfexec pkg install fortune.


    On CentOS, RedHat, SuSE, and others, use sudo rpm --install fortune.


    For any of these, we encourage you to explore the man pages for the command of
    your choice—you can do a lot with these commands, and it''s a couple of minutes
    to read up on the options.


    In all of these cases, though, you can accomplish the same thing using a spiffy
    GUI tool from your Unix desktop. Not only does it tell you what''s available to
    choose from. Poke around in the desktop menus (if you have more than just an ssh
    connection to your system) and see what you can find. Look for things like “Package
    Manager,” and you will be set.'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# # Monitoring the System


    Monitoring the system is one of the key responsibilities of a system administrator.
    You need to make sure that everything is as it should be on the system, or yell
    at people, call the cops, or order a new drive, or whatever else is required.
    On a single-user system, there''s really not much to do, but on a larger system
    with many users, monitoring is a significant part of a system administrator''s
    job.


    Among other things, you can monitor the system logs (located in `/var/log` or
    `/var/adm/`, the users logged in, overall system load, and available memory.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_309_0.png)


    ```

    ```

    $ tail -f 5 /var/log/apache2/error.log

    Sun Mar 30 11:02:42.2024 2016 [error [1481508468123]

    52) [00004]apache2:2.4 (Linux) configured - restarting main server) [pid 5071:1481508468157]

    Sun Mar 30 11:03:42.53467 2024] (core-worker) [pid 5072:1481508468192]

    148094 Command time "/var/apache2/error.log"

    ```

    ```


    Monitoring logs is an Important responsibility of the `root` user.


    # ### To monitor logs:


    +   - `sudo tail -1000 /var/log/syslog | more`


    Use `sudo to gain root` access and look at the end (last 1000 lines) of the `messages`
    log file. The output of `tail` is piped to `more` so you can actually read it.


    or


    +   - `sudo tail -f /var/log/apache2/error_log`


    If you''re looking for a specific occurrence of an event as it happens, you can
    use `tail -f` to keep displaying the log as any new errors, in the case of this
    log, are added to it. In this example, we''re looking at the very end of the web
    server''s error log, as shown in A.'
  merge: -1
