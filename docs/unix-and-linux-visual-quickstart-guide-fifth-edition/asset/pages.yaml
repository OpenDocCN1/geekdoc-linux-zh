  md: '# Changing Ownership of Files and Directories with chown


    Suppose you''ve been working on a file named rowyourboat, and your boss decides
    to let a coworker, Merilee, take over the project. In this case, to fully off
    the project to your coworker, you need to change ownership of the file from you
    to her. Depending on how your system administrator set up the system, you can
    often change ownership of files using chown (Code Listing 5.6).


    # To change ownership with chown:


    +   1. ls -1


    For starters, type ls -1 at the shell prompt to verify the file''s name and ownership,
    as in Code Listing 5.6. Remember that the ownership information is located after
    the permissions and linking information.


    Code Listing 5.6 Changing ownership of files transfers complete control.


    ```

    [ejr@hobbes merilee]$ ls -1

    total 26

    -rw-rw-r- 1 ejr users 24850 Jul 24 15:17 rowyourboat

    [ejr@hobbes merilee]$ chown merilee rowyourboat

    [ejr@hobbes merilee]$ ls -1

    total 26

    -rw-rw-r- 1 merilee users 24850 Jul 24 15:17 rowyourboat

    [ejr@hobbes merilee]$ _

    ```'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# 2. chown merrilee rowyourboat


    Type **chown** followed by the userid of the person you want to transfer ownership
    to and the filename. In this case, the **chown** command changes the ownership
    for **rowyourboat** to **merrilee. rowyourboat** and its associated problems will
    now be hers, and life will be but a dream.


    > > TIP After you change a file''s ownership, what you can do with the file depends
    on the group and other permissions and memberships. The new owner, however, will
    be able to do anything with the file.


    > > TIP When changing the ownership of a directory, you can add the -R flag to
    chown to make it recursively to all files and directories below it.


    > > TIP If the system does not allow you to use chown to give files away, consider
    using cp to make a copy of a file to accomplish the same thing. If you copy someone''s
    file (that you have permission to read) to another name or location, the copy
    is fully yours. (In this giving-file-away example, the recipient should use cp.)


    > > TIP If you need to make changes to permissions and find you can''t, take a
    glance at sudo to see if that might help you in your situation. As described in
    Chapter 15, sudo provides some users with the ability to act with the power of
    a system administrator, in limited circumstances. Of course, if that doesn''t
    solve your problem, there''s always the next tip.


    > > TIP Even if you can''t use chown, you are still able to request that the system
    administrator change file ownership for you: "Could you change the ownership of
    my rowyourboat file to Merrilee, with chown merrilee/home/shared/ me/rowyourboat.
    Thanks! (This could happen because many versions of Unix allow only root users
    to change file ownership.)'
