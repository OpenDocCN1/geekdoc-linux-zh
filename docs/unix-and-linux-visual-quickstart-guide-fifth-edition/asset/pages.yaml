  md: '# 5. binary


    Specify the file type—in this case, **binary**, because we''re downloading a gzipped
    archive file. Specify `ascii` for README files, text, and HTML files.


    # 6. hash


    Next, you have the option of typing **hash** to tell the FTP client to display
    a hash mark (#) for every 1024 bytes transferred. If you''re transferring a small
    file or using a fast connection, this might not be necessary; however, for large
    files and slow connections, the hash marks will let you know that you''re making
    progress.


    If you''ll be downloading multiple files, check out the sidebar “Getting Multiple
    Files” in this section before proceeding. The instructions for getting single
    and multiple files differ at this point in the process.


    # 7. get jokearchive.gz


    At the `ftp>` prompt, type **get** and the filename to get the file from the remote
    system and plunk it into your own account.


    # 8. quit


    When it''s finished, just type **quit**.'
