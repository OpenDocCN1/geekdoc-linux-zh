    ````


    > TIP **Use locate in combination with grep** (see "Using Regular Expressions
    with grep" in Chapter 6) to narrow down your list,


    > TIP Many people use locate to look at the directories that contain relevant
    files (/usr/share/games/fortunes contains a lot of files related to the fortune
    program), then use other tools to take a closer look.


    > TIP Not all systems include fortune–it''s certainly a fun thing and not essential
    by any means. If you don''t "locate" it, try looking for bash or zsh (known as
    shells) to see how locate works. (See Chapter 8 for more information about different
