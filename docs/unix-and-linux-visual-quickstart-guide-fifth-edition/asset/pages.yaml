  md: "# # Creating a Signature File\n\nIf you've been using email for any length\
    \ of time, you've undoubtedly noticed signature files, which appear at the bottom\
    \ of messages and include contact information, company name, and perhaps a short\
    \ funny quote or saying. You can add a signature to your outgoing messages by\
    \ creating a .signature file\n\n![](img/fff2eea2e42bd82cdabda71c69c59f13_238_0.png)\n\
    \nYour signature file can contain any information you want. Be creative, but keep\
    \ it concise!\n\n# ## To create a signature file:\n\n+   1. nano ~/.signature\n\
    \   At the prompt, type an editor's name (here we use nano, but you can use the\
    \ editor of your choice), specify the home directory (~/), and then specify the\
    \ .signature filename. Note the leading dot in the filename, which makes the file\
    \ hidden\n\n+   2. Kelly Jones kelly@example.com\n   My thoughts are my own ...\
    \ is that OK, .honey?\n\nGo ahead, type your signature information. We recommend\
    \ that your .signature file include, at minimum, your name and email address.\
    \ You can also add funny sayings (\"You know you're a geek when you refer to the\
    \ bathroom as 'downloading.\") or disclaimers (\"My opinions are mine and not\
    \ my company's.\\ Whatever you want, really. Keep your signature as short as possible;\
    \ long signatures are hard to wade through.\n\n+   3. Save and exit the file.\n\
