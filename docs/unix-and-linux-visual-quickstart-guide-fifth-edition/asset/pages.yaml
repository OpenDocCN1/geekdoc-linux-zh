  md: '![](img/fff2eea2e42bd82cdabda71c69c59f13_264_0.png)


    # # Surfing the Web with lynx


    You can also surf the web using **lynx**, a text-based web browser. It''s not
    as spiffy as **links** and doesn''t handle many webpages as gracefully, but it
    has its place in your toolbox too. Generally, you can access the wealth of information
    available on the web A, and you can use **lynx** to download and reformat pages
    easily.


    You can use **lynx** to navigate to any site on the web.


    # # Useful lynx Keystrokes


    +   - `/findme` finds text within the file. (Replace `findme` with the text you''re
    looking for)

    - `?` lets you access help.

    - `D` downloads the current link.

    - `G` goes to an address or file. Enter the address at the prompt.

    - `Shift+G` lets you edit the current address.

    - `A+L` adds the current link to your bookmark list.

    - `V` lets you view the bookmark list.

    - `Backspace` lets you see a list of pages you''ve visited (your history).

    - `L` lets you toggle back and forth between viewing the formatted page and viewing
    the HTML source.

    - `Ctrl+R` reloads the current page and refreshes the screen.'
  merge: -1
  pgno: 264
