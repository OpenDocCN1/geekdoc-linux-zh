  md: '# To set permissions using numeric equivalents:


    ```

    chmod 777 rowyourboat

    ```


    Type chmod followed by the desired permissions for the user, group, and other
    using the numeric equivalents listed in Table 5.1, followed by the filename. In
    this example, we used 777 to set read, write, and execute permissions to "on"
    for the user, group, and other.


    Or, for example, 724 would give the user full read, write, and execute permissions,
    the group only write permissions, and other only read permissions.


    > TIP Setting permissions with numeric equivalents sets permissions absolutely,
    rather than adding to or subtracting from existing permissions.


    > TIP You can use either numeric or mnemonic permissions—whichever format is easier
    for you. However, you will need to use the numeric system to set default permissions
    that apply when you create new files. See the next section for the full scoop.'
