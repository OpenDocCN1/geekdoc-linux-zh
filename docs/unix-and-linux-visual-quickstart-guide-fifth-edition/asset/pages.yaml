  md: '# Manipulating Files


    As you learned back in Chapter 4, you can easily work with text by opening an
    editor and making the changes you want. But you can do more than just copy, paste,
    cut, or move text in files. We''ll discuss in this chapter, you can manipulate
    entire files and look at specific parts of them, get information about the files,
    find text in files, compare files, and sort files. All kinds of neat stuff!


    Note that we are discussing only plain text files here, which are the most common
    files you''ll encounter when using Unix or Linux. We are not addressing specialized
    files for word processing programs, image files, and other files associated with
    specific applications in this chapter.


    In this chapter, we''ll use a lot of options to augment commands. You''ll find
    a full list of the most common commands and their options (or flags) in Appendix
    C if you need further explanation or a quick reminder later.


    # In This Chapter


    +   - Counting Files and Their Contents with **wc**

    - Viewing File Beginnings with **head**

    - Viewing File Endings with **tail**

    - Finding Text with **grep**

    - Using Regular Expressions with **grep**

    - Using Other Examples of Regular Expressions

    - Making Global Changes with **sed**

    - Changing Files with **awk**

    - Comparing Files with **cmp**

    - Finding Differences in Files with **diff**

    - Finding Differences in Files with **sdiff**

    - Sorting Files with **sort**

    - Eliminating Duplicates with **uniq**

    - Redirecting to Multiple Locations with **tee**

    - Changing with **tr**

    - Formatting Files with **fmt**

    - Splitting Files with **split**'
  merge: -1
