  md: "# Adding to Your bash Path\n\nOne of the most useful changes you can make to\
    \ your environment is adding to the default path, which is determined by the path\
    \ statement. The path statement tells the shell where to look for commands, scripts,\
    \ and programs. That is, if you issue a command, the path statement tells the\
    \ system to look for that command in each of the named directories in a specific\
    \ order.\n\nIf a command is not in your path, you have to type out the whole path\
    \ as part of the command, like `/home/unixxvqs/myscripts/latest/test/command.sh`.\
    \ If you put `/home/unixxvqs/myscripts/latest/` in your path, you can just run\
    \ `command.sh`.\n\nBe sure not to remove anything from your path unless you really\
    \ know what you're doing, but feel free to add as many additional directories\
    \ as you want to.\n\nAs the following steps show\n\nCode Listing 8.9 Your first\
    \ step is finding out the location of your path statement(s).\n\n```\nejr@hobbes\
    \ ej$ more ~/.bash_profile ~/.bashrc\n::::::::::::::n/home/ejr/.bash_profile\n\
    ::::::::::::::\n# .bash_profile\n# Get the aliases and functions\nif [ -f ~/.bashrc\
    \ ]; then\n  ~/.bashrc\nfi\nPATH=/bin:/usr/bin:/usr/local/bin\n# User-specific\
    \ environment and startup programs\nPATH=$PATH:/usr/local/games\nENV=$HOME\nUSERNAME=\"\
    \"\nexport USERNAME ENV PATH\nM-(Next file: /home/ejr/.bashrc)\n```"
