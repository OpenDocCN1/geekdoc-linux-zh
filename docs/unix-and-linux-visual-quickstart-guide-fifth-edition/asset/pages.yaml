  md: '# Removing Directories with rmdir


    Another handy thing you do is remove directories using **rmdir**. Think of removing
    directories as trimming branches on a tree. That is, you''re not sitting on the
    branch you want to trim off. You have to sit on the next closest branch; otherwise,
    you''ll fall to the ground along with the branch you trim off. Ouch! Simply, when
    you remove a directory, you must not be located in the directory you want to remove.


    You must remove a directory''s contents (all subdirectories and files) before
    you remove the directory itself. Doing so, you can verify what you''re removing
    and avoid accidentally removing important stuff. In the following steps (illustrated
    in **Code Listing 2.10**), we''ll show you how to remove a directory''s contents,
    and then remove the directory itself.


    # Can You Really Screw the System?


    In general, when you log in to a Unix or Linux system and use your personal userid,
    the worst you can do is remove your own directories and files. As long as you''re
    logged in as yourself, commands won''t affect anything critical to the system,
    only your personal directories and files. Score for Unix—as an average user, you
    cannot really break the system. With Windows, though, it can be a different story.


    If you have system administrator rights, meaning that you log in **root** (giving
    you access to the system directories and files), you can do a lot of damage if
    you''re not extremely careful. For this reason, don''t log in **root** unless
    you absolutely have to. See Chapter 15 for more about being **root**.


    Many systems won''t even let you log in as **root**. Instead, you need to use
    **su** or an equivalent, as discussed in Chapter 3. There, you''ll also find information
    about **su**, which can help reduce the risk of being logged in as **root**.


    Code Listing 2.10 Removing directories with rmdir can be a little tedious—but
    safer than sorry.


    ```

    $ cd /home/ejr/Yourdirectory

    $ ls -la

    total 7

    drwxr-xr-x 2 users 1024 Jun 29 20:59 .

    drwxr-xr-x 8 users 1024 Jun 29 20:59 ..

    -TW-TW-I- 1 users 1475 Jun 29 20:59 cancelled.project.notes

    -TW-TW-I- 1 users 2876 Jun 29 20:59 outdated.contact.info

    $ rm *

    $ cd

    $ rmdir Yourdirectory

    $ ls

    Newdirectory all.programs.txt newer short.fortunes

    Projects files newest.programs temp

    Xrootenv.0 fortunes stuff touching

    all.programs local.programs.txt schedule

    $

    ```


    Chapter 2'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# To remove a directory:


    +   1. `cd /home/ejr/Yourdirectory`


    To begin, change to that directory by typing `cd` plus the name of the directory
    you want to remove.


    +   2. `ls -a`


    List all the files, including any hidden files that might be present, in the directory,
    and make sure you don''t need any of them. If you see only `.` and `..` (which
    indicate the current directory and its parent directory, respectively), you can
    skip ahead to step 4.


    +   3. Do one or both of these:


    +   * If you have hidden files in the directory, type `rm -*` to delete those
    files plus all the rest of the files.


    +   * If you have subdirectories in the directory, type `cd` and the subdirectories
    name, essentially repeating the process starting with step 1. Repeat this process
    until you remove all subdirectories.


    When you finish this step, you should have a completely empty directory, ready
    to be removed.


    +   4. `cd ..`


    Use the change directory command again to move up one level, to the parent of
    the directory that you want to remove.


    +   5. `rmdir Yourdirectory`


    There it goes—wave goodbye to the directory! See Code Listing 2.10 for the whole
    sequence.


    > TIP You can remove multiple directories at one time. You''re starting with empty
    directories, just list them like this: `rmdir Yourdirectory Yourotherdirectory
    OtherDirectory`.


    > AS an alternative to rmdir, you can remove a directory and all its contents
    at once using the `-r` flag; for example, `rm -r Directoryname`. Be careful, though!
    This method automatically removes the directory and everything in it, so you won''t
    have the opportunity to examine everything asked for confirmation before deleting
    each file and if you''re really, absolutely, positively, completely sure that
    you''re doing the right thing, use `rm -rf` Directoryname to force immediate deletion.


    > TIP If you''re comfortable with long commands, you can specify commands with
    a complete directory path, as in `ls /home/ejr/DirectoryToGo` or `rm /home/ejr/DirectoryToGo/*`.
    This technique is particularly good if you want to be absolutely sure that you''re
    deleting the right directory, and not a directory with the same name in a different
    place on the system.'
