    \nLook through your system configuration files for a path statement. As Code Listing\
    \ 8.4 shows, it will look something like PATH=/bin:/usr/bin:/opt/bin. If you have\
    \ more than one path statement, find the last one executed.\n\nRemember that different\
    \ systems have different configurations, so you might need to do a little digging\
    \ to find your personal path statement.\n\n+   2. ~/.zshrc .zshrc_backup\nMake\
    \ a backup of the file containing the path statement so that you can recover the\
