  md: 'Code Listing 6.10 You can use sed to make changes throughout files, such as
    the address change here.


    # Making Global Changes with sed


    ```

    [unixvxqs@linuxmint Examples]$

    > sed ''s/oldaddr@raycomm.com/

    newaddr@raycomm.com/g''

    > address.htm > address-new.htm

    [unixvxqs@linuxmint Examples]$

    > head address-new.htm

    <BODY>

    <P>Please send all comments to

    <A HREF="mailto:newaddr@raycomm.com">

    newaddr@raycomm.com</A>

    </P>

    <TABLE ORDER=0>

    <TR>

    <TD WIDTH="150" VALIGN=TOP>

    [unixvxqs@linuxmint Examples]$

    ```


    Another command you can use is sed, which lets you make multiple changes to files
    without ever opening an editor. For example, as a new webmaster, you might use
    sed to change all occurrences of the webmaster''s email address to your own. We''ll
    show you in this section, you can use sed to make global changes within documents.


    To make global changes with sed:


    ```

    sed ''s/oldaddr@raycomm.com/

    newaddr@raycomm.com/g''

    > address.htm > address-new.htm

    ```


    Type sed, followed by


    +   - A single quote ('')

    - A leading s

    - A slash (/)

    - The text you want to replace (oldaddr@raycomm.com)

    - Another slash (/)

    - The replacement text (newaddr@raycomm.com)

    - Yet another slash (/)

    - which tells sed to apply the change globally (if you omit the g, only the first
    occurrence on each line will be changed)

    - Another single quote ('')

    - The name of the file in which the changes should be made (address.htm)


    You can have sed cruise through multiple documents. See Chapter 10 for information
    on how to make a shell script with sed.


    Because sed commands can be long and unruly, it might be helpful to save the commands
    in a separate file (so you don''t have to retype them). If you saved the command
    s/oldaddr@raycomm.com/raycomm.com/g in a file named script.sed, you could issue
    sed -f script.sed address-new.htm to run the sed commands from script.sed file.
    You can have as many commands as you want in your script.sed file.


    You can redirect the output to a new filename (see sed Code Listing 6.10) or pipe
    it to another command entirely. You can''t redirect to the same filename or you''ll
    end up with no content in your file.


