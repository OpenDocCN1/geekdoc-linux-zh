  md: '# Viewing File with more


    As you become more familiar with Unix, you''ll want to start exploring the contents
    of files, including some programs and scripts as well as files you eventually
    create. One of the easiest ways to view files is to use the **more** command,
    which tells Unix or Linux to display files onscreen, a page at a time. As shown
    in A long files are displayed with "More" at the bottom of each screen so that
    you can move through the file one at a time using the spacbar.


    **To view a file with more:**


    +   1. more fortunes

    At the prompt, type **more** plus the name of the file you want to view. You''ll
    see the contents of the file you requested, starting at the top A


    +   2. Spacebar see the next screen of information. As you move through the file,
    you can press B to move back through previous screens.


    +   3. When you''re finished, press Q to go back to the shell prompt.


    > TIP If you want to view just an additional line (rather than an entire screen)
    when using more, press Backspace instead of the Spacebar.


    > TIP You can also use less to view files, less similar to more, but it''s more
    powerful and flexible. How can less be more and be less? As you''ll see in Appendix
    C, the more command has 10 options or so; the less command has about 40.


    > TIP You can also view files using the cat command. See the next section for
    the full scoop.


