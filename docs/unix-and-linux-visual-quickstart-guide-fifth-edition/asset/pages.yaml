  md: '# To start vi:


    +   1. vi

    At the shell prompt, type vi. The program starts up, and you''ll see some-thing
    like A ~ symbols show blank lines below the end of the file.


    +   2. i

    Type i to get insert mode. This itself is a command issued in command mode, so
    it won''t show up on the screen.


    +   3. hairy spiders

    In insert mode, type anything you want.

    Everything you type will show up on the screen until you return to normal mode
    by pressing Esc. When you are in normal mode, you can use the arrow keys to navigate
    up and down in the file line by line and use Ctrl+F and Ctrl+B to scroll one screen
    forward and backward, respectively.


    > TIP To get help for vi, type man vi. Chapter 1 for more about pages.


    > TIP If you''re not sure what mode you''re in, press Esc to go into normal mode.
    If you''re already in normal mode, you''ll hear a beep. If you''re in insert mode,
    you''ll change to normal mode.


    > TIP Many Unix-like systems, including Linux and OS X, actually provide a program
    called vim in the place of vi. vim (for Improved) is like vi but feature-rich
