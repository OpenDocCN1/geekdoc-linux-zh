  md: '# Running Jobs in the Foreground with fg


    Code Listing 9.8 Typing fg plus the job number brings that job into the foreground.
    When you suspend suspended jobs into the foreground, you''ll sometimes see only
    a prompt onscreen. At other times, you''ll need to summon help to see anything
    of the program.


    When you''re ready to resume a suspended or backgrounded job, you can do so using
    fg. Remember, when you suspend a job, what you''re doing moves the job into limbo.
    fg just moves the job into the foreground again (Code Listing 9.8), so you can
    see, for example, what it''s doing or provide input.


    ```

    [ejr@hobbes ejr]$ jobs

    [1]+ Stopped ftp ftp.example.com

    [ejr@hobbes ejr]$ fg %1

    ftp ftp.cdrom.com

    ```


    # To run jobs in the foreground with fg:


    +   1. jobs

    At the shell prompt, type jobs to list all stopped or running jobs. Note the job
    numbers at the left.


    +   2. fg %1

    Enter fg followed by the number of the job that you want to bring back into the
    foreground (Code Listing 9.8).


    > You can bring the last suspended job into the foreground by typing fg (with
    no job number) at the shell prompt.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_194_0.png)'
