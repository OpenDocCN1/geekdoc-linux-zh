  md: '# Using Completion in the zsh Shell


    The **zsh** shell (also known as the Z shell) offers completion with added twists
    over the **bash** shell for the power user. Basically, you can just type part
    of a command, press `Tab`, and have the Z shell complete the command for you (Code
    Listing 3.10).


    Code Listing 3.10 In this example, we typed the `ls` command followed by `cd pub`
    and pressed the `Tab` key; `zsh` completed the command for us.


    | $ls |

    | Complete NewProject bogus2 ftp puppy |

    | Completed News dead.letter mail temp |

    | Access files public_html testme |

    | $ cd public_html/ |


    To use completion in the zsh shell:


    +   1. `ls`n   Use **ls** to list the files in your current directory.

    2. `cd pub`n   Type a partial command, as shown here, and then press `Tab` to
    complete the command. In this example, we typed the `cd` command and part of the
    **public_html** directory (truncated to **pub** in the example), and then pressed
    the `Tab` key to complete it (see Code Listing 3.10).


    > **TIP** In the Z shell, command completion works even if multiple files might
    match the partial command that you type. For example, if you type `cd pu` (for
    `public_html`) and there''s another subdirectory called puppy, when you press
    `Tab` to complete the name, the shell will show you the options that match (`public_html`
    and `puppy`) and cycle through the options as you continue pressing.


    > **TIP** You can use command completion to complete commands, directory names
    within commands, and nearly anything else you might enter.


    > **TIP** The Z shell is smart enough to show only the subdirectories you could
    change to. bash, on the other hand, would show you files and directories and beep
    at you—not as helpful, for sure.'
