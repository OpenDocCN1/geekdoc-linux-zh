- img_proc: true
  md: '# # Embedding Commands


    Suppose you create a script that will automatically run when you log in each day.
    The script might, for example, print "Greetings!" onscreen and possibly deliver
    a cle(aver) message: "Say, you''re looking sharp today!" You could easily do this
    with the information you''ve learned so far in this chapter.


    What would be handy here would be to add a line to the script that tells Unix
    to do all those things plus the name most recently used file—for those of you
    who need a reminder about what you were last working on. You could just use an
    **ls** command, but that would only list the filenames and not integrate the information
    with the rest of your morning greeting. Instead, a better (and more attractive)
    idea would be to bundle a couple of commands and use them with **echo** to embed
    the information right into the greeting.


    > Embedding commands requires an additional couple of lines in the script.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# To embed a command:


    1. vi myscript


    To begin, open myscript or another script in your favorite editor. Your script
    might look like A, with the greeting


    echo "You were most recently used" on ''ls -Fft | head -1''.


    Type echo followed by the descriptive text you want to write. Then embed the 1
    command ''ls -1fc - / head -1'' within the descriptive text. Note that the embedded
    command begins and ends with (back ticks) before the (dot).


    The embedded command here lists the most recently changed file or directory in
    the home directory. 1 provides for every entry line, F provides the directory
    names with / so we can tell whether we''re working in a subdirectory or on a file,
    c t sorts by modification date. We then pipe the output to head -1, which displays
    the top line of the file listings.


    3. Save your script and exit the editor, and then try it, as Code Listing 10.3.


    > TIP You can embed commands into scripts. Try echo - "Today is $XA" if you work
    so much that you forget the day of the week. See the sidebar "Using Clever Dates"
    for more date details.


    > TIP When you embed commands that are directory dependent-such as ls or find-to
    specify the complete path. If you don''t, you''ll get paths rather than relative
    to where you''re running the script.


    > TIP Embedded commands are useful in many ways. You can use them any time you
    want to have another program based on the output of another program, just as echo
    displays something based on the output of a program.


    # Code Listing 10.3 The results of embedded commands can be impressive.


    ```

    [unixvs@LinuxMint]$ myscript

    Greetings! Say, you''re looking mighty

    - sharp today!

    You were most recently working on figlet.

    [unixvs@LinuxMint]$

    ```


    # Using Clever Dates


    You can use the date command to deliver any day in format. General use date +"Today
    is $XA", but you can use any of the following list:


    +   %d includes the two-digit day of month.

    %-y includes the two-digit year.

    %Y includes the four-digit year.

    %-m includes the numeric month.

    %-b includes an abbreviated month.

    %B includes the full month name.

    %a includes the abbreviated day of the week.

    %A includes the full day of the week.

    %XR includes the time in hours and minutes.

    %D includes the date in month/day/year format.


    Check the man pages for the remaining several dozen options.'
  merge: -1
