    +   3. Save your text and exit the editor.

    Chapter 4 has the gory details about saving and exiting in nano and vi.


    +   4. vacation -I

    Type vacation -I at the shell prompt to start vacation and tell it to respond
    to all incoming messages. You''ll still get the incoming messages in your inbox.
    In fact, they''ll pile up in your inbox and wait for you to return.


    +   5. cat ~/.forward

    Look at the .forward file in your home directory to verify that it contains a
    reference to the vacation program. Your .forward file specifies what should happen
    to your mail upon receipt. In this example, it should be processed by vacation.
    The reference to vacation is usually inserted automatically by the vacation program,
    but if it''s not, you''ll need to edit the .forward file and add text like \yourid,
    "vacation yourid". Or, substitute your real user for the placeholder, and include
    the full path to vacation (/usr/bin/vacation) on our system. (See Code Listing
    11.6.)


    > Remember to unsubscribe to all mailing lists before you start vacation. If you
    don''t, you may send a vacation announcement to a whole list of people who do
    not like it (not that you will irritate the list administrator). Or, worse, you
    might cause a mail loop (in which messages to the list are acknowledged by the
    server, and the acknowledgments are in turn vacation announcements), causing hundreds
    or thousands of messages to accumulate in your account. It shouldn''t happen,
    but it sometimes happens.


    # To stop vacation emails:


    ```

    mv .forward vacation-forward

    ```


    At the shell prompt, move the .forward file that references the vacation program
    to a different name (in this case, vacation-forward). You could just delete it
    or remove the reference to vacation, but it''s easier to save it so you can reuse
