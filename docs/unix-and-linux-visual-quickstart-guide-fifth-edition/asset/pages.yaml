  md: '# Cleaning Up HTML Documents with tidy


    If you have ever had to develop HTML documents—when developing personal websites,
    completing a class project, or creating web pages on the job—the tidy utility
    is a handy resource for you. If you''re creating HTML pages by hand, you will
    likely make occasional errors. These errors probably won''t cause significant
    problems with the pages, but they might make the pages harder to read, harder
    to maintain, and harder to subject to the scrutiny of your peers. Not to worry;
    tidy can help!


    Clean up HTML documents with tidy:


    +   1. vi sampleedoc.html


    Use the editor of your choice to create an HTML document. Our sample document
    is named well, sampleedoc.html Don''t worry about getting the tagging or syntax
    exactly right; tidy will take care of the details. Save and close your document.


    +   2. tidy sampleedoc.html


    The tidy utility will apply HTML formatting rules and then output a revised version
    of your document that is technically correct (Code Listing 16.1). Cool, huh?


    +   3. tidy sampleedoc.html >


    +   fixedupdoc.html


    If you like the results, redirect the document to a new filename, as shown here,
    or use tidy -m sampleedoc.html to replace the original document.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_317_0.png)


    > Even a flawed HTML document, like this one, can be fixed by tidy.'
