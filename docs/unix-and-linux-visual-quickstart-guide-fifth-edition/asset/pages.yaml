  md: '# Checking Connections

    with ping


    Think of using **ping** as saying “Are you there?” to a remote computer. For example,
    suppose you''re trying to connect to a webpage but getting no response from the
    computer. Rather wait and wonder what''s going on, type **ping** to find out the
    computer is up and functional (Code Listing 12.5).


    To check a computer with ping:


    **ping www.raycomm.com**

    At the prompt, type **ping** and the host name to test the connection to a specific
    host, as in Code Listing 12.5.


    Depending on your Unix system, it may check the connection one time and return
    the results. Or it may continue to peter the other computer every second or until
    you tell it to stop. If that''s the case, just press `Ctrl+C` to stop it.


    > If you''re having problems connecting to a particular computer, you might consider
    using traceroute, which pings all the computers on the path between point A and
    point B. While ping tells you if a host responds or not, traceroute will give
    you an idea of where the problem might lie. See the next section for more details
    about traceroute.


    > The ping command does not provide a definitive answer to the status of the remote
    computer. Some systems are not to respond to pings for security reasons. If you
    get a response from ping, the system is definitely up and you can communicate
    with it; however, a lack of response from ping may not mean anything about that
    system''s status.


    Code Listing 12.5 Using ping, find out whether you can connect to a specific computer.


    ```

    [ejr@hobbes ej$ ping www.raycomm.com

    PING www.raycomm.com (204.228.141.12): 56 data bytes

    64 bytes from 204.228.141.12: icmp_seq=0 ttl=21 time=190.3 ms

    64 bytes from 204.228.141.12: icmp_seq=1 ttl=21 time=197.7 ms

