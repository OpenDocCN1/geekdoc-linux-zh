    as well as a few of the options you can choose.


    To customize alpine:


    +   1. alpine

    At the shell prompt, type **alpine** to start the program.


    +   2. M

    Press M to visit the main menu.


    +   3. S

    Press S to summon the setup menu.


    +   4. C

    Press C to access the configuration setup menu, which is shown in A.


    +   5. Scroll through the configuration list using the ↑ and ↓ keys.

    **alpine** offers you gobs of options to configure. **Table 11.1** describes the
    ones you might find most useful.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_229_0.png)


    > A By using the configuration setup menu, you can tailor **alpine** to your needs.'
