  md: '# # 7 Getting Information About the System


    Now is your chance to nose around in everyone else''s business! In this chapter,
    we''ll show you how to get information about the system, about other users, and
    about your own userid.


    # ## In This Chapter


    +   - Getting System Information with **uname** 132

    - Viewing File Systems with **df** 133

    - Determining Disk Usage with **du** 136

    - Finding Out File Types with **file** 137

    - Finding Out About Users with **finger** 138

