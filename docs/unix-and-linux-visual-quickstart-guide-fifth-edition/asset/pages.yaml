  md: '# Running a Command


    Throughout this book, you''ve been practicing a single command. Unix and Linux
    don''t really care if you''re running a built-in command that came with the system,
    a program you installed later, or a script your best friend wrote—it''s all the
    same to the system. **Code Listing 9.1** shows some options for running a command.


    To run a command:


    ls


    At the shell prompt, type the command and press `Enter`.


    To run a specific command:


    /jdoe/scripts/ls


    It''s certainly possible that you would want to write a script that lists the
    files in your directory in a special way—for example, a script to list the files
    and save the listing into a new file for later reference (You might name it something
    else `ls` if you want to). To run the specific script, enter the whole path to
    the script (so Unix or Linux doesn''t just run the first one it finds in your
    path). See Chapter 8 for more about statements.


    > You can combine commands on the same line, as you''ve seen earlier in this book.
    Use just a ; to separate the commands, and you''re set. For example, you could
    do `ls; pwd` to list files and show the current directory.


    > If you use && to combine commands, the system will run both in sequence but
    run the second only if the first succeeds. For example, you could use `mv todolist
    todolist && touch touch` to move your to-list to a different file and create a
    new to-list. If the first fails (for example, because you don''t have permission
    to create a new file), the second command won''t run.


    **Code Listing 9.1** To run a script, command, or program, just enter the name
    of the path or the name at the shell prompt.


    ```

    [jdoe@frazz Project]$ ls

    keep keeper.jpg kept kidder.txt kiddo kidneys kids kidupdate

    [jdoe@frazz Project]$ /bin/ls

    keep keeper.jpg kept kidder.txt kiddo kidneys kids kidupdate

    [jdoe@frazz Project]$ /home/jdoe/scripts/ls

    keep keeper.jpg kept kidder.txt kiddo kidneys kids kidupdate

    You listed these files.

    [jdoe@frazz Project]$ ls; pwd

    keep keeper.jpg kept kidder.txt kiddo kidneys kids kidupdate

    /home/jdoe/Project

    [jdoe@frazz Project]$

    ```'
