    ```


    In this chapter, we''ll focus on the email programs that you access directly from
    the system, because these are the true email programs. Although there are bazillion
    different ones available, you''ll likely have access to one (or more of):


    +   **alpine**: is intuitive to use and lets you send and receive email and attachments
    very easily, **alpine** is recommendation if you have it available.


    +   alpine''s relatively simple interface. Just use the menu commands listed at
    the bottom of the screen.


    Another mail program—**cone**—is fairly similar to **alpine**. We could not see
    a compelling reason to choose **cone** over **alpine**, so we opted to cover only
    **alpine** in this book. However, if you see **cone** alpine and you like **alpine**,
    give it a shot.


    How do you know someone has sent you something? The shell will often announce
    (but not audibly) "You have new mail" when you log in, as shown in Code Listing
    11.1—that is, if you do in fact email mailing:


    You''re not limited to using a regular Unix or Linux email program or a webmail
    program; you can use either both, depending on your specific preferences and needs.
    You''re also not limited to using just one email program if you have more than
    one available, although reading from two different Unix programs sometimes make
    it a little hard to keep track of what''s where. Try them out and see which program
    or combination of programs meets your needs.


    +   **mutt**: this is a bit less userfriendly, but it lets you send and receive
    email and can deal with attachments nicely. **mutt** is our second choice if it
    is very powerful and quite friendly if you spend a bit of time customizing it
    for your needs. its interface, which provides ample features for most purposes.


    Yes, you can read Gmail (or nearly any other IMAP mail service) with **alpine**
    or **mutt**. Do an Internet search for "configure alpine for gmail" or "muttrc
    for gmail", follow the (straightforward) instructions, and you''ll be in business.


    We often recommend using character-based email programs like these to read mail.
    After you get used to the interface, you can which through it much faster than
    you can with a GUI (graphical user interface) mailer (like Outlook or Thunderbird
    mail) or with a webmail application, and you don''t have span graphics opened
    in your face either.


    +   **mail**: this program is available on practically every Unix system; however,
    it''s fairly difficult to use and does not provide intuitive options or commands,
    as shows. We recommend choosing another email program if at all possible. Use
    this program for emergencies.'
