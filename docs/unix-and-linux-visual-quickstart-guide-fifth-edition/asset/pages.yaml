  md: "# Using Completion in the bash Shell\n\nOne of the cool features of the **bash**\
    \ shell is command argument completion. With this feature, you can just type part\
    \ of a command, press `Tab`, and have **bash** complete the command for you (Code\
    \ Listing 3.8).\n\nCompletion only works if there's just one possible match to\
    \ the letters you type before you press `Tab`. For example, if you type cd pu\
    \ (for public_html) and there's another subdirectory called puppy, the shell will\
    \ beep and wait for you to type `Tab` again, the shell will distinguish between\
    \ the two subdirectories. In many cases, if you persist and type `Tab` again,\
    \ the shell will show you the options that match so far.\n\nYou can use the completion\
    \ feature to complete commands, directory names within commands, and nearly anything\
    \ else you enter that's sufficiently unambiguous.\n\n# To use completion in the\
    \ bash shell:\n\n+   1. `ls\n   Use `ls` to list the files in your current directory.\n\
    2. `cd pub\n   Type a partial command, as shown here, and then press `Tab` to\
    \ complete the command. In this example, we typed the `cd pub` and part of the\
    \ `public_html` directory (truncated to `pub` in the example), then pressed `Tab`\
    \ to complete it (see Code Listing 3.8).\n\n**Code Listing 3.8** In this example,\
    \ we typed only the `ls` command followed by `cd pub` and pressed the `Tab` key;\
    \ `bash$` completed the command for us.\n\n```\nbash-2.00$ ls\nComplete NewProject\
    \ bogus2 ftp puppy\nCompleted News dead.letter mail temp\nMail access files public_html\
    \ testme\nbash-2.00$ cd pub public_html/\nbash-2.00$\n```"
