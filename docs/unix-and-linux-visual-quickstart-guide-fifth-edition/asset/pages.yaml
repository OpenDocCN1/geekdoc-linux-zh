  md: '# Choosing an Editor:

    nano/pico or vi/vim


    Basically, all editors are designed to enable you to create, modify, and save
    text files. These files could include configuration files, email messages, or
    shell scripts—essentially any text file you can create. Which editor you choose
    is up to you, depending on your specific needs and how much you''re willing to
    learn.


    In this book, we''ll stick to the two biggies:

    nano and vi, which will likely give you all the capabilities you''ll need. We
    chose these because nano is (arguably) the easiest Unix or Linux editor to use
    and vi is one of the most powerful and is available on almost every Unix or Linux
    system.


    Which to choose? We recommend that you explore both. While you''ll no doubt find
    nano easier to use, we highly recommend that you make a concerted effort to get
    around in vi. You''ll find that vi''s learning curve is steeper—much—but that
    being a skilled vi user will provide many benefits, not the least of which is
    that vi is really the only editor you can count on being on any Unix or Linux
    system you use.'
  merge: -1
