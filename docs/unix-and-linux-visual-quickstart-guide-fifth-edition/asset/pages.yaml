    TIP If you try to change group ownership and get an error message like “Not owner”
    or something similarly obscure, your userid doesn''t have the necessary authority
    to make the change. You''ll have to ask your system administrator for help.


    TIP Change group association only if you have a specific need to do so; you don''t
    want to make your files available to other people unnecessarily. Unless you are
    the system administrator, you won''t be able to control exactly who belongs to
    the group to which you''ve given access to your files.


    TIP If you change the group association of a specific directory, you also need
    to check permissions for the directory containing it. Users will not be able to
    change into the specific directory (regardless of their group membership) unless
    they have to read and execute permission for the directory containing it.


    TIP If you need to make changes to group permissions and find you can''t, consider
    looking at using sudo to help out. Covered in Chapter 15, sudo provides some users
    with the ability to act with the power of a system administrator, in limited circumstances.
    Take a look.


    TIP Just with the cp and mv commands, covered in Chapter 2, you can use the -R
    flag with chgrp to recursively apply changes to a directory and all the subdirectories
    and files in it. For example, to change the group association of the LatestProject
    directory and all its contents to the project group, use chgrp -R project LatestProject
    from the directory above LatestProject.'
