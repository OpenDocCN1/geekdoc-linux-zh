  md: '# About nano and pico


    nano is one of the more straightforward Unix editors and has become quite popular
    because it''s extremely easy to use. In particular, as shown in A, it''s menu-driven
    and intuitive. All the commands are visible, and you can open, modify, and close
    files with little effort. nano is a great choice if you''re just getting started
    with Unix or Linux, or if you won''t need an editor able to leap tail files in
    a single bound.


    For a variety of reasons, mostly connected to open-source licensing issues, nano
    is a near-clone of pico, which in the past was included in a number of Linux/Unix
    distributions as well as on systems that you might be using today. The nano editor
    is command-for-command the same as pico, but it does offer some supplemental higher-end
    (yet still easy-to-use) features.


    For the purposes of this book, we''re going to treat pico and nano as equivalent—if
    you have pico, just mentally write that in wherever you see nano.


    pico is distributed with the pine email program, or if you have pine available
    to you, you likely have also pico.(See Chapter 1 for a reminder on how to find
    out if specific programs are available to you.) If pico is not available to you,
    and if you cannot find nano either, ask your system administrator to install one
    or the other.


    ![](img/fff2eea2e42bd82cdabda71c69c59f13_86_0.png)


    A nano offers onscreen command reminders to make it easier to use.'
  merge: -1
