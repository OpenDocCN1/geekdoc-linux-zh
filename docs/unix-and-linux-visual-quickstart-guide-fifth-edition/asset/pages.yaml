- img_proc: true
  md: 'If the FTP connection seems to get stuck as soon as you log in, try -yourid@
    wherever.com as the password. - character disables system announcements and helps
    keep your FTP client happy.


    Some firewalls—particularly the ones on home networks—do not deal gracefully with
    some of the intricacies of the FTP protocol. If you can connect and log in but
    not list files or get anything, the firewall might be the problem. As soon as
    you log in, type pass (for passive) and the problem should go away.


    Another handy use for - is to view text files onscreen. For example, get filename
    - to have the text just scroll by the screen.


    Instead of using get, get newer (as in newer jokes.gz) to get a more recent file
    with the same name as the one you have.


    If you start downloading a file and the FTP connection breaks, type reject and
    the filename ever left off. (You''ll have to reestablish the connection first,
    of course).


    You can tell the FTP client to make sure that all the transferred files have unique
    names using runique index of get. That way, you can ensure that files do not overwrite
    existing files on your system.


    Use regular Unix commands like ls and cd to move around in the remote system,
    and prefix them with an 1 to apply your system. For example, cd .. would change
    to the next higher directory on the remote system, and cd .. (from within the
    FTP client) would change to the next higher directory on the local system. The
    current directory is where your files will be saved.


    # Getting Multiple Files


    If you''ll be getting multiple files with ftp, follow steps 1 through 6 in this
    section, then


    +   * prompt

    ally, type prompt to not prompt you for each individual file that you want to
    get. You''ll be informed that prompt is set to no. If you want to turn it back
    on, use prompt again.


    +   * mget*

    At the ftp prompt, type mget (for "multiple get") followed by the string or filenames
    to match. In example, we use start* to get all files with names that begin with
    *.gz, for example, to get files with the .gz file extension. See Chapter 1 for
    more about using wildcards.


    +   * quit

    When you''re finished getting files, just type quit.'
  merge: -1
