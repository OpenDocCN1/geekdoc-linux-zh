  md: '# To change your password:


    +   1. passwd


    To start, type passwd.


    +   2. youoldpassword


    Enter your old password—the one you''re currently using. (Of course, type in your
    old password, not the sample one we''ve used here!) Note that the password doesn''t
    show onscreen when you type it, in case someone is lurking over your shoulder,
    watching you type, and asking, “Whatcha doing?”


    +   3. younewpassword


    Type your new password. Check out the "Lowdown on Passwords" sidebar for specifics
    about choosing a password.


    +   4. younewpassword


    Here, you''re verifying the password by typing it again. The system will report
    that your password was successfully changed (specific terminology depends on the
    system) after the changes take effect. This is also shown in Code Listing 1.1.


    > Double-check your new password before you log out of the system by typing ~yourid
    at the prompt. Substitute your real username (or login name) for your.id. This
    command (switch user) lets you in without having to log out, if you made a mistake
    when changing your password and not before you get a failed login message, you
    actually disconnect from the system. If you have problems, contact your system
    administrator before you log out so you can get the problem resolved.


    > In some environments, you will yppasswd, not passwd, to change your password,
    or use a webpage or other means. When in doubt, defer to what your system administrator
    told you to do. (“The Rays said to use this command” is likely to get all of us
    in trouble.)


    # The Lowdown on Passwords


    In addition to following any password guidelines your system administrator mandates,
    you should choose a password-word that is


    +   - At least eight characters long


    +   - Easy for you to remember


    +   - Not a single word or name in any language


    +   - A combination of capital and lowercase letters, numbers, and symbols


    +   - Not similar to your username


    +   - Not identical or similar to one you''ve used recently


    +   - Not your phone number, birth date, kid''s birth date, anniversary (even
    if you can remember it), mother''s maiden name, pet''s name, or anything else
    that someone might associate with you


    Bluntly, most passwords are easily crackable with current technology. Search for
    "xcd password" and follow the instructions in the resulting cartoon for a very
    good way to construct passwords. Pick a phrase from your favorite song, and make
    the first letter of each word in the phrase.'
  merge: -1
