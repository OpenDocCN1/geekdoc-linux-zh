  md: '# Starting, Stopping, and Restarting Daemons


    As **root**, you can do anything on the system, but you shouldn''t have much to
    do at all. Generally, Unix and Linux systems are configured so that the programs
    that should be running all time (like the web server software, mail server software,
    or similar programs) are automatically started in the background when the system
    is booted. Then, you, **root**, only handle crises and problems. (Ha! Easier said
    than done.


    # To start a daemon:


    +   1. `ps -ef | grep smbd`


    Verify that the Samba server really isn''t running. Sometimes users are wrong.
    If you see lines that list **smbd** (other than the one that reports the command
    you''re running), **samba** is active and doesn''t need to be started. The problem
    may lie elsewhere.


    +   2. `cd /etc/init.d`


    Change to the directory containing the generic **init** (for initialization) scripts.
    This directory is likely `/etc/init.d/` or `/etc/rc.d/init.d/`, as **Code List
    15.4** shows.'
  merge: -1
  pgno: 305
- img_proc: true
  md: "# 3. sudo service smbd start\n\nUse **sudo service smbd** and **start**.\n\
    The **samba** in the `/etc/init.d` directory is a script to start the daemon with\
    \ the appropriate options.\n\n# 4. ps -ef | grep smbd\n\nVerify that the Samba\
    \ server is now running.\n\n> TIP To stop a daemon, use the same process, but\
    \ use stop (as in, sudo service smbd stop) to stop a daemon cleanly.\n\n> TIP\
    \ Sometimes you might need to restart a daemon. You could stop it and start it,\
    \ but in many cases you could also use restart or reload (as in, sudo service\
    \ httpd restart).\n\n> TIP Be careful about stopping or restarting daemons with\
    \ which you are not familiar. Unix has a lot of interdependencies that are often\
    \ not clear, and stopping something you don't need might have unexpected consequences.\n\
    \n> TIP You might think you'd need to use ./smbd or /etc/init.d/smbd to specify\
    \ the exact command to use, but service is very smart—and will only start processes\
    \ from /etc/init.d. Cool, eh?\n\nCode Listing 15.4 Sometimes you have to manually\
    \ manage system daemons.\n\n```\nunixvs@LinuxMint ~ $ ps -ef | grep smbd\nunixvs\
    \ 2530 2101 0 09:20 pts/1 00:00:00 grep --colour=auto smb\nunixvs@LinuxMint ~\
    \ $ sudo service smbd start\nsmb start/running, process 2575\nunixvs@LinuxMint\
    \ ~ $ lps\nps -ef | grep smbd\nroot 2575 1 09:20 ? 00:00:00 smbd -F\nroot 2577\
    \ 2575 0 09:20 ? 00:00:00 smbd -F\nunixvs 2580 2101 0 09:20 pts/1 00:00:00 grep\
    \ --colour=auto smb\nunixvs@LinuxMint ~ \n```"
