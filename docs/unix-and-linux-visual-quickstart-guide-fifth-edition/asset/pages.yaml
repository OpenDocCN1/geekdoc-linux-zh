  md: '# # Finding Out What Processes Are Running with ps


    Using ps, you can find out processes are currently running.


    The jobs that we''ve been talking about so far are actually types of processes.
    Processes are programs, scripts, or commands—including anything you do in the
    Unix or Linux system. All jobs are processes, but not all processes are jobs.


    ```

