    You can also download the CD or DVD

    install on your everyday desktop computer.

    Most of the time (actually virtually all the

    time, but we''re making no promises here),

    You can install Unix or Linux onto your

    desktop right alongside your Windows

    environment without breaking anything

    (although we don''t promise that you won''nhave to read the instructions on the
    particular operating system in the process).

    You''ll get it installed, reboot your system,

    and choose Unix (Linux, OpenIndiana,

    whatever) or Windows when you boot up.

    This option isn''t bad, but it does require

    you to stop what you''re doing in Windows

    or Unix to change to the other. If your desk-

    top computer is relatively old, this might be

    better than the following options, though.


    If you have a beefy desktop computer

    (relatively new with ample memory and

    disk space), you could try using VirtualBox,

    VMWare, VirtualPC, or other virtualization\environments, which gives you computer

    emulation (think "picture in picture" for

    your computer, but with one operating sys-tem within the other operating system).


    Many of the examples and screenshots

    for this book were taken from Unix or

    Linux systems running under VirtualBox

    on on one of our desktop computers

    (a Mac, technically).


    Cygwin provides you with a Unix-like

    environment that''s actually part of your

    Windows system. It takes a bit of getting

    used to, but Cygwin is stable and reliable.

    The hardest part about using Cygwin is

    that it can be confusing to know whether

    you''re dealing with Unix or Windows

