    # 单板计算机


    # LU&D 顶级推荐


    ## 树莓派类开发板


    无论你是在学习编程，还是打算与现实世界进行交互，树莓派或类似的开发板都能满足你的需求。


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_59_0.png)


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_59_1.png)


    ##  Orange Pi Prime


    Orange Pi Prime（约 33 英镑）显然是为了与树莓派 3 直接竞争而设计的。然而，它的规格和价格相似，但拥有更大的内存——尽管与某些树莓派类开发板不同，它的板载引脚布局并不完全相同。重要的是，GPIO
    引脚具有相同的引脚定义以确保兼容性。


    - Orange Pi Prime

    - Asus Tinker Board

    - Odroid M4

    - BeagleBone Board Revision C

    - NanoPi Neo

    - Banana Pi M2 Berry


    ## Odroid Xu4


    Odroid Xu4（73 英镑）本质上是加强版的 Pi 3，它的尺寸与树莓派几乎相同，但拥有两个频率分别为 1.4GHz 和 2GHz 的 CPU，共八个核心，且内存翻倍。第三方基准测试声称轻松超越
    Xu4。但请注意，它的 GPIO 引脚并不与树莓派兼容。


    该板的亮点在于——而且对于像 Pi Zero 这样的入门板来说，增加的成本百分比更高——尽管如此，它的总价非常有吸引力，特别是如果你将其作为电视服务的显示器。请注意，由于它们缺少显示器，因此被称为“无头（headless）”，这意味着它们会运行操作系统，但你需要远程连接到它们。


    > 树莓派以及其他制造商的类似板提供了与硬件的接口。它是一种廉价的 Linux ：学习编程的手段，也是用于软件项目的工具。如果你正在寻找集成功能，或者只是想学习编程，这类
    SBC（单板计算机）正是你感兴趣的计算领域，一个类似 Arduino 的板可能是完美的起点。


    ## 输入与输出


    与 PC 不同，这类 SBC 的一个重要特性是它们具有通用输入/输出（GPIO）引脚，这些引脚既可以由程序配置的输出电压驱动，也可以由外部硬件控制施加在其上的电压。这对于嵌入式应用非常有用——即与外部电子设备协作。通常情况下，特别是当你开始进行嵌入式项目时，你会推送配置为输入的
    GPIO 引脚，并在其上连接 LED 作为输出。然后，程序可以在你按下按钮时点亮 LED——尽管这只是一个简单的例子。


    该类别的关键特征是它可以运行操作系统，并有端口允许你连接如键盘、鼠标、内存、电源，通常还有一个用于独立计算体验的存储设备。对于独立计算，可能涉及使用 PC，你可能不会认为有些开发板缺少这些功能是够够的，但当我们转向类似
    Arduino 的开发板时就会发现，这些板对于各种项目来说是至关重要的。树莓派类开发板允许你组装出一台极具性价比的 Linux 计算机。当然，以这种方式构建一台完整的
    PC 成本会比……更高。


    ## NanoPi Neo


    NanoPi Neo（7.99 英镑——约 6 英镑）尽管价格极具竞争优势，但其规格低于 Pi Zero。优点是，它具有不同的尺寸（更短但稍宽），这对于某些有嵌入式应用的人来说可能是一个加分项。


    ## 开发板对比


