    # Meet the Beast


    Resin.io has a company ''pet'' called the Beast. This is an in-house cluster platform
    for testing and deploying product updates. The latest incarnation, version 3,
    has 336 Raspberry Pis and is designed as modular/computational ''LEGO'' so it
    can be expanded and power from each other.


    In an early day, you could touch the ripple and the others would go around; "This
    is the kind of deal we do to," said Marinos, "Some kind of swarm behaviour born
    of the devices."


    Initially, resinio started building clusters. "The first one, it was, just three
    nodes. It was so small that I would go to offices and check it, and then we''d
    start adding more and more. In 2014, we had a 120-device cluster," said Marinos.


    He says the Beast took 10 days to build with him and Shaun Mulligan: "Of course,
    the first one was really literally a beast. It was extremely unwieldy to transport
    anywhere."


    So they decided to use a modular setup: "That''s why I''m saying, I didn''t know
    how many we were going to build, because we essentially built these 12-device
    clusters, and they amass Beasts easily. They can talk to each other, and then
    get network and power from each other."


