- md: "\n# Unlock the potential of GPIO pins with the GPIO Zero library\n\nMake using\
    \ the GPIO pins easy, fun and expand your interaction with a wide range of components\
    \ and sensors\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_73_0.png)\n\nMost of\
    \ us will probably light up the first time we write a program to light up an LED,\
    \ a motor or a timer reading. Nowadays this hardware and these components are\
    \ relatively cheap - you can purchase a set of sensors for the equivalent of the\
    \ original cost of buying one. Components have shrunk in size with many now being\
    \ etched into small add-ons.\n\nThe library has also evolved and with this change\
    \ comes the amazing GPIO Zero Python library, created by Ben Nutt and Dave Jones,\
    \ which provides a simple interface to control the Raspberry Pi GPIO pins. Consider\
    \ the basic example of making an LED blink: a Raspberry Pi RGPIO program requires\
    \ 16 lines of code. With GPIO Zero you can achieve the same outcome with only\
    \ a few.\n\nBut don't be fooled into thinking that GPIO Zero is dumbed-down coding;\
    \ GPIO Zero supports a wide range of components, sensors and parts. In this tutorial\
    \ we will begin by trying out a few basic recipes before moving into the internal\
    \ devices. We will also create a simple app to control an LED via your phone or\
    \ tablet.\n\n## 01 Wire up the LED\nLet's introduce the GPIO Zero library with\
    \ a basic LED control program. As the tutorials progresses and we introduce more\
    \ complex features we'll use the LED as the responding action, so this will come\
    \ handy. Start by connecting a resistor to the leg of the LED and then the jumper\
    \ wires to the twos. The positive wire connects to GPIO pin 17 and the other wire\
    \ to a ground (GND) pin.\n\n## 02 Flash that LED\n\nNow let's write simple code\
    \ to flash the LED on and off. Import 'LED' from the GPIO library and assign the\
    \ GPIO pin where the LED is attached - in this case, GPIO 17. Set up a while loop\
    \ to turn the LED on for second and then off. Save the program and run it. How\
    \ easy is that?\n\n```python\nfrom gpiozero import LED\nfrom time import sleep\n\
    \nled = LED(17)\nwhile True:\n    led.on()\n    sleep(1)\n    led.off()\n    sleep(1)\n\
    ```\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_74_0.png)\n\n```python\nfrom gpiozero\
    \ import Button\nfrom signal import pause\n\ndef say_hello():\n    print(\"Hello\"\
    )\n```\n\n```python\nbutton = Button(2)\n\nbutton.pressed = say_hello\npause()\n\
    ```\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_74_1.png)\n\n## 03 Wire up the\
    \ button\n\nNow let's wire up a button. Take the breadboard and attach the button\
    \ to the holes, leaving space to connect wires. Connect the first wire (blue)\
    \ to pin 2; this provides the current for the circuit. Attach the other end to\
    \ the leg of the button. Connect the second wire to a GND pin and completes the\
    \ circuit. This works for any GPIO pin number, but any of the other pins are suitable.\n\
    \n## 04 Code the buttons\n\nThis is as easy - it's a simple program, to control\
    \ the reaction to the button being pressed. We will use functions for our program.\
    \ The first example shows the GPIO for a button on two lines: it prints a message,\
    \ on line three when pressed. In the second example, we create a function which\
    \ is then called each time the button is pressed. This enables us to create more\
    \ complex outcomes and.\n\n```python\nfrom gpiozero import Button\nbutton = Button(2)\n\
    button.wait_for_press()\nprint(\"Button was pressed\")\n```\n\nOr whatever we\
    \ want...\n\n## 05 Control the Pi's own\n\nThe GPIO library makes it possible\
    \ to interact and control the Raspberry Pi's built-in LEDs. These are the red\
    \ status and the green activity indicators located near the port. Before creating\
    \ your project, you will need to configure them. Open the LX terminal and type\
    \ the following command: `sudo tee /sys/class/leds/led0/trigger` and press Enter.\
    \ Next enter the following command: `echo LED: sudo tee /sys/class/leds/led1/trigger`\n\
    \n## 06 Write the program\n\nThis is another simple bit of code that flashes the\
    \ LED led by the power pin, then.\n\n```python\nfrom gpiozero import LED\nfrom\
    \ signal import pause\n```\n\n```python\npower = LED(35)\nactivity = LED(47)\n\
    \nactivity.blink()\npower.blink()\npause()\n```\n\n## 07 Reset the LEDs\n\nIf\
    \ you need to return the LEDs back to their original status - use them for their\
    \ original purpose and activity indication purposes - in the terminal type `echo\
    \ none sudo tee /sys/class/leds/led0/trigger` and then `echo led sudo tee /sys/class/leds/led1/trigger`.\
    \ Once you have completed this, reboot your Raspberry Pi by typing `reboot` and\
    \ then press Enter.\n\n## Tutorial GPIO Zero library\n\npython3-dbus and sudo\
    \ pip install bluedot\nTo upgrade and add other features, use the command `sudo\
    \ pip install bluedot upgrade`.\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_75_0.png)\n\
    \n## 08 Use the pin-out tool\n\nWhen using the GPIO pinout it is essential to\
    \ have a reference guide to hand. Many of us will have a scrap of paper, a poster\
    \ or a website for this. GPIO zeros installed with an example is handy but extremely\
    \ limited. Open the terminal, use pinout out and you will be presented with deram.\
    \ other.\n\n## 10 Download Android Blue Dot app\n\nWhile the library is installed,\
    \ head over to the Play Store and install the Blue Dot app. Next, turn on your\
    \ phone's Bluetooth and ensure that d discovery is set to Discoverable. This ensures\
    \ that the Raspberry Pi can locate your device.\n\n## 11 Pair your Pi and device\n\
    \nTo pair your device with your Raspberry Pi, Locate the Bluetooth dot symbol\
    \ at the top-right of the desktop. Click the symbol and select 'Turn on' and make\
    \ your device visible. Then select your device, select it and connect to it. You\
    \ may need to enter a shared pin number, depending on which device you're using.\
    \ An alternative method is to pair your via search for devices and then select\
    \ your Raspberry Pi from the list.\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_75_1.png)\n\
    \n## 13 Run the program\n\nWith the program and phone, select the device and connect\
    \ to it. You may need to enter a shared pin number, depending on which device\
    \ you're using. An alternative method is to pair your via search for devices and\
    \ then select your Raspberry Pi from the list.\n\n## 09 Install Blue Dot\n\nWhile\
    \ the library is installed, head over to the Play Store and install the Blue Dot\
    \ app. Next, turn on your phone's Bluetooth and ensure that d discovery is set\
    \ to Discoverable. This ensures that the Raspberry Pi can locate your device.\n\
    \n## 14 Ping a sensor\n\nIn this exercise we will ping a sensor and check its\
    \ status. Using the same pin as led, in the Python file we import GPIO on line\
    \ one, and on line two. Replace google with another address on line four. On line\
    \ five, we add a 60-second delay between checks and then if the LED goes off,\
    \ know the site or server is down.\n\n```python\nlight = LED(17)\n```\n\n> from\
    \ gpizero import PingServer, LED\nfrom signal import pause\nled = LED\n\n```python\n\
    google = PingServer('google.com')\nled.source_delay = 60 # check once per minute\n\
    led.source = google.values\n```\n\n```python\npause()\n```\n\n## 16 React to the\
    \ time\n\nThis final program takes a reading from the Pi's internal clock and\
    \ turns the LED when the time is within a specific range. We import time, and\
    \ LED modules. Line one, then the time, and again \"pause\" on line three. Set\
    \ your time range on line five - between 7am and 9am. Finally, set the LED to\
    \ turn on when the time meets the values. control other outputs such as motors\
    \ and buzzers check out the GPIO Zero for more recipes.\n\n from gpizero import\
    \ TimeDay, LED\nfrom datetime import time\nfrom signal import pause\n\n## 15 GPIO's\
    \ CPU Temperature module\n\nGPIO's CPU Temperature module enables you to use an\
    \ LED as a simple warning when the Pi reaches a certain temperature. Import import\
    \ CPUTemperature, LED, and pause modules,\n\n> Remote GPIO\nThe GPIO library also\
    \ includes a feature that allows you to control the GPIO pins from other devices.\
    \ The library supported here, gpipio, provides the ability to control GPIO over\
    \ the network. This never allows you to use GPIO Zero to control a Raspberry Pi\
    \ on the network. You can trigger the LED on and off and/or read the temperature\
    \ from a sensor. You can also do this from Linux and from a PC. Check out more\
    \ details here: https://gpiozero.readthedocs.io/recipes/remote_gpio.html\n"
  mdcn: "\n\n# 使用 GPIO Zero 库释放 GPIO 引脚的潜力\n\n让 GPIO 引脚的使用变得简单、有趣，并扩展你与各种组件和传感器的交互\n\
    \n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_73_0.png)\n\n我们中的大多数人可能在第一次编写点亮 LED、电机或读取定时器数值的程序时，会感到非常兴奋。如今，这些硬件和组件相对廉价——购买一组传感器的成本可能相当于买一个的原始成本。组件的尺寸在缩小，许多已经被刻在微小的扩展板上。\n\
    \n该库也在不断演进，随之而来的是惊人的 GPIO Zero Python 库。该库由 Ben Nutt 和 Dave Jones 创建，提供了一个控制树莓派\
    \ GPIO 引脚的简单接口。考虑一个让 LED 闪烁的简单示例：一个树莓派 RGPIO 程序需要 16 行代码。而使用 GPIO Zero，你只需要几行代码就能实现相同的效果。\n\
    \n但不要误认为 GPIO Zero 是为了低级化编码；GPIO Zero 支持广泛的组件、传感器和零件。在教程中，我们将首先尝试一些基础配方，然后再进入内部设备。我们还将创建一个简单的应用，通过手机或平板电脑控制\
    \ LED。\n\n## 01 连接 LED\n让我们通过基础的 LED 控制程序来介绍 GPIO Zero 库。随着教程的进行，我们将引入更复杂的功能，并将\
    \ LED 作为响应动作，因此这会很有用。首先将电阻连接到 LED 的引脚上，然后将跳线线连接到两个引脚。正极线连接到 GPIO 引脚 17，另一根线连接到地（GND）引脚。\n\
    \n## 02 闪烁 LED\n\n现在编写简单的代码来让 LED 闪烁。。从 GPIO 库导入 'LED'，并分配 LED 所连接的 GPIO 引脚——在此情况下，是\
    \ GPIO 17。设置一个 while 循环让 LED 开启一秒然后关闭。保存程序并运行它。这有多简单？\n\n```python\nfrom gpiozero\
    \ import LED\nfrom time import sleep\n\nled = LED(17)\nwhile True:\n    led.on()\n\
    \    sleep(1)\n    led.off()\n    sleep(1)\n```\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_74_0.png)\n\
    \n```python\nfrom gpiozero import Button\nfrom signal import pause\n\ndef say_hello():\n\
    \    print(\"Hello\")\n```\n\n```python\nbutton = Button(2)\n\nbutton.pressed\
    \ = say_hello\npause()\n```\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_74_1.png)\n\
    \n## 03 连接按钮\n\n现在让我们连接一个按钮。拿起面包板，将按钮连接到孔中，留出连接线的空间。将第一根线（蓝色）连接到引脚 2；这为电路提供电流。将另一端连接到按钮脚。将第二根线连接到\
    \ GND 引脚完成电路。这适用于任何 GPIO 引脚号，但任何其他引脚都可以。\n\n## 04 编写按钮代码\n\n这很简单——这是一个简单的程序，用于控制按钮按下反应。我们将在程序中使用函数。第一个示例用两行代码显示按钮的\
    \ GPIO：在第三行，按下时打印一条消息。在第二个示例中，我们创建了一个函数，每次按下按钮时都会调用它。这使我们能够创建更复杂的结果。\n\n```python\n\
    from gpiozero import Button\nbutton = Button(2)\nbutton.wait_for_press()\nprint(\"\
    Button was pressed\")\n```\n\n或者任何我们想要的内容...\n\n## 05 控制树莓派自带的\n\nGPIO 库使得交互和控制树莓派内置\
    \ LED 成为可能。这些是位于附近的红色状态指示灯和绿色活动指示灯。在创建项目之前，你将配置它们。打开 LX 终端并输入命令：`sudo tee /sys/class/leds/led0/trigger`\
    \ 并按回车。接着输入以下命令：`echo LED: sudo tee /sys/class/leds/led1/trigger`\n\n## 06 编写程序\n\
    \n这是另一个简单的代码片段，用于由电源引脚控制的 LED 闪烁。\n\n```python\nfrom gpiozero import LED\nfrom\
    \ signal import pause\n```\n\n```python\npower = LED(35)\nactivity = LED(47)\n\
    \nactivity.blink()\npower.blink()\npause()\n```\n\n## 07 重置 LED\n\n如果你需要让 LED\
    \ 回到原始状态——用于它们的原始用途和活动指示目的——在终端输入 `echo none sudo tee /sys/class/leds/led0/trigger`，然后输入\
    \ `echo led sudo tee /sys/class/leds/led1/trigger`。完成后，输入 `reboot` 并按回车重启你的树莓派。\n\
    \n## GPIO Zero 库教程\n\npython3-dbus and sudo pip install bluedot\n要升级并添加其他功能，请使用命令\
    \ `sudo pip install bluedot upgrade`。\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_75_0.png)\n\
    \n## 08 使用引脚图工具\n\n在使用引脚图（pinout）时，手里有一份参考指南至关重要。我们中的许多人会有一张纸、海报或网站。带示例安装的 GPIO\
    \ zeros 虽然方便，但功能非常有限。打开终端，使用 `pinout`，你将看到更多其他信息。\n\n## 10 下载 Android Blue Dot\
    \ 应用\n\n安装好库后，前往 Play Store 并安装 Blue Dot 应用。接下来，打开手机蓝牙并确保发现被设置为“可发现”。这确保了树莓派可以定位你的设备。\n\
    \n## 11 配对你的树莓派和设备\n\n要将设备与树莓派配对，找到桌面右上角的蓝牙符号。点击符号并选择“开启”，并让你的设备可见。然后选择你的设备，点击它并连接。你可能需要输入共享的\
    \ PIN 码，取决于你使用的设备。另一种方法是通过搜索设备进行配对，然后从列表中选择你的树莓派。\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_75_1.png)\n\
    \n## 13 运行程序\n\n使用程序和手机，选择设备并连接。你可能需要输入共享的 PIN 码，取决于你使用的设备。另一种方法是通过搜索设备进行配对，然后从列表中选择你的树莓派。\n\
    \n## 09 安装 Blue Dot\n\n在安装好库后，前往 Play Store 并安装 Blue Dot 应用。接下来，打开手机蓝牙并确保发现被设置为“可发现”。这确保了树莓派可以定位你的设备。\n\
    \n## 14 检测传感器\n\n在这次练习中，我们将探测（ping）一个传感器并检查其状态。使用与 LED 相同的引脚，在 Python 文件第一行导入\
    \ GPIO，第二行将 google 替换为另一个地址。在第五行，我们在检查之间添加 60 秒的延迟，如果 LED 熄灭，说明站点或服务器宕机。\n\n```python\n\
    light = LED(17)\n```\n\n> from gpizero import PingServer, LED\nfrom signal import\
    \ pause\nled = LED\n\n```python\ngoogle = PingServer('google.com')\nled.source_delay\
    \ = 60 # 每分钟检查一次\nled.source = google.values\n```\n\n```python\npause()\n```\n\
    \n## 16 对时间做出反应\n\n最后一个程序从树莓派的内部时钟读取数值，并在时间处于特定范围内开启 LED。我们导入 time 和 LED 模块。第一行，然后是时间，第三行再次是\
    \ \"pause\"。在第五行设置你的时间范围——早上 7 点到上午 9 点之间。最后，设置当时间符合值时开启 LED。控制其他输出（如电机和蜂鸣器），查看\
    \ GPIO Zero 获取更多配方。\n\n from gpizero import TimeDay, LED\nfrom datetime import\
    \ time\nfrom signal import pause\n\n## 15 GPIO 的 CPU 温度模块\n\nGPIO 的 CPU 温度模块允许你使用\
    \ LED 作为树莓派达到特定温度时的简单警告。导入 CPUTemperature, LED 和 pause 模块，\n\n> 远程 GPIO\n> GPIO\
    \ 库还包含一个允许从其他设备控制 GPIO 引脚的功能。这里支持的库 gpipio 提供了通过网络控制 GPIO 的能力。这始终允许你使用 GPIO Zero\
    \ 控制网络上的树莓派。你可以触发 LED 的开启和关闭，以及或从传感器读取温度。你也可以从 Linux 和 PC 执行此操作。在此处查看更多详情：https://gpiozero.readthedocs.io/recipes/remote_gpio.html\n\
    \n"
