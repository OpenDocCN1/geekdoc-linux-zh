    # OpenCV 3.3.1


    Run your computer to recognise and track all kinds of things


    The Open Source Computer Vision (OpenCV) is a machine-learning library of programming
    functions designed for real-time computer vision. The library can read images
    and detect shapes (circle, square and so on) as well as objects (houses, people
    and the like). The functions are capable of reading numbers, identifying text
    in images, which makes it ideal for development in augmented reality apps.


    It can recognise faces, gestures and motion too, meaning it''s useful for all
    kinds of robotics applications. In fact, OpenCV is the primary library in the
    popular robotics middleware, Robot Operating System (ROS).


    OpenCV was originally developed by Intel Research in 1999 and is now maintained
    by OpenCV.org non-profit foundation. The BSD-licensed library is easy to learn,
    with loads of documentation on its website and support for languages such as C++,
    Java and Python.


    Many of the changes in this 3.3.1 release were aimed at detection and recognition.
    Another major change improves the library''s Deep Neural Network module and includes
    new samples. In addition, OpenCV runs on all major desktop and mobile OS; the
    installation is fairly straightforward but quite involved, and it''s thoroughly
    documented on the website.


    # Pros


    Allows coders of popular languages to add image recognition capabilities to their
    projects.


    # Cons


    There is an involved installation process, and a learning curve, with any programming
    module.


    Features of artificial intelligence via vision computers. https://opencv.org


    # WEB BROWSER


    # Firefox 57


    # A watershed release, this is a must-try


    Mozilla is excited about its latest Firefox release, codenamed Quantum. It claims
    the new release is as fast as previous releases according to Speedometer 2.0 benchmarks.
    These improvements are the result of mult threading, a new CSS engine written
    in Rust, and other components rewritten from scratch. While the engine may vary,
    you''ll notice an almost improvement in times and page loading, more responsive-tab
    switching and smoother scrolling.


    The browser also features a redesigned interface, and of particular note the new
    Firefox Library in the redesigned toolbar. The Library gathers your history, bookmarks,
    tabs and downloads all into one area. The New tab has also been redesigned, and
    now groups sites and pages, with recommendations from Pocket for users in Canada,
    the US and Germany.


    You can wait for the new version to make its way to your distribution''s official
    repositories, or grab the compressed archive from the Firefox website.


