    # Single Board Computers


    # LU&D''s top picks


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_61_0.png)


    ## Adafruit Trinket M0


    The most remarkable feature of the Adafruit Trinket M0 (£7.50) is that it''s so
    diminutive, despite its high-end CPU. The price you pay for it however, is its
    limited interfacing capability. Analogue I/O, PWM and serial ports all share the
    same pins as five digital I/Os.


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_61_1.png)


    ## Espruino Pico


    The Espruino Pico (£23) is Arduino-like rather than Arduino-compatible. It''s
    a USB stick which you can use owing IDE from JavaScript by plugging it into your
    PC''s USB socket to convert I/O for compatibility with Arduino shields.


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_61_2.png)


    ## Adafruit Metro M0


    The Metro M0 (£23.50) shows how you can get a lot more for your money with third-party
    derivatives. While the hardware is particularly spectacular, you get a faster
    processor and, critically, more RAM and flash for little less than the cost of
    an Arduino Uno.


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_61_3.png)


    ## ARDUINO-LIKE


    If your application needs to interface with real-world hardware, an arduino-like
    board is a strong contender


    - Adafruit Metro M0

    - Espruino Pico

    - Teensy CL

    - DFRobot µHex

    - SparkFun Pro Micro


    > I haven''t encountered Arduino-like before they''ll possibly appear as sort
    of mystery, so let by setting the scene. First, these boards are intended for
    embedded applications and they don''t run an operating system, with just the odd
    exception. So if a Raspberry Pi boots the operating system when you turn it on,
    a board like an Arduino will do so – its behaviour depends entirely on its flash
    memory. Because there is no OS, the code must be developed on a PC and uploaded
    to the SBC. This works fine for embedded applications; if it is your role to write
    code using a board such as the Raspberry Pi that runs an operating system.


    This is because an operating system can represent a huge overhead for simple applications;
    if you don''t need an operating system, less powerful hardware can be used. So
    if you see an Arduino board with a 16MHz processor, don''t jump to the conclusion
    that it''s the poor relation of a Pi with 1.2GHz chip. While a slower processor
    is not better, there is certainly the potential for lower-cost platforms to be
    used for embedded applications. So, while operating systems can take some time
    to boot before embedded applications, boards without this overhead can start as
    soon as the board is powered up.


