    \ 世纪 70 代出现了许多“手工”计算机套件以及之间的软件共享。但随着运动的增长，随着公司开始提供软件，自由精神开始消退。\n\n文章标题指的是两种不同的软件开发风格：闭源的“大教堂”（Cathedral），由对象、按分级运行的小团队组成；形成对比的是开放的“集市市”（Bazaar），它具有迭代发布，并涉及来自正式结构之外的贡献者的持续反馈。\n\
