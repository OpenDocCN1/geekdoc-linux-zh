  mdcn: "\n\n## 微软专题\n\n## 微软\n### 我如何停止担心并爱上 Linux\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_17_0.png)\n\
    \n> 最后，我认为你们将看到的是智能、闭源的组织正日益向着开放的方向移动。因此，这不会是两个阵营之间的竞争，而在它们之间，你将发现人们将占据的各种有趣场所。新的组织模型正在出现，以复杂的方式将闭源和开放混合。它将不再是一目了然的；不再是微软与\
    \ Linux 的对决——之间会有各种东西。事实证明，这些组织模型是非常强大的，能够理解它们的人将会非常、非常成功。\n\n- 英国作家查尔斯·李德贝特（Charles\
    \ Leadbeater）在 2005 年 TED 大会上关于“创新时代”的演讲\n\n## 微软！\n\n微软爱 Linux 吗？我们应该相信萨提亚·纳德拉（Satya\
    \ Nadella）吗？这位富有吸引力且不那么侵略性、不会扔椅子的微软首席执行官，他说那样的话是真的是真的吗？并不是人们无法记住和忘记过去，那么我们能做到吗？无论你是否同意我们在左页底部印出的那句引言，微软似乎改变了它对\
    \ Linux 的看法，特别是在过去的五年里。\n\n闭源与开放软件混合的“复杂方式”造福了那些将软件视为一种哲学运动的粉丝，以及那些有解放用户愿望却拒绝贡献的人。对于其他人来说，微软对开源开发的采纳、对其进行关注或与其整合，这可能是令人欣慰的，特别是如果它让你的工作生活变得更容易了。\n\
    \n鉴于大多数 Linux 杂志对 Windows 持负面观点，几乎没有必要去询问 LINUX 读者\n\n## 微软在 GitHub 上有超过 16,000\
    \ 名贡献者，并发布了超过 3,000 个开源项目\n\n他们对微软转向开源的看法如何，这主要集中在操作系统上。直到最近，微软 Windows 的文化一直是延迟或移除可能损害微软\
    \ Windows 的其他产品的功能，这是一个现实。在萨提亚·纳德拉被任命为 CEO 后，他宣布了“云优先、移动优先”战略，并迅速下了 Windows 的台。虽然微软\
    \ Windows 和 Office 继续贡献公司的大部分利润，但纳德拉看到了企业云的未来。通过完成其前任史蒂夫·鲍尔（Steve Ballmer）开始的工作，纳德拉旨在在跨越所有增长市场的同时，夺取云市场的健康份额。正如纳德拉在任命后不久接受《连线》（Wired）采访时著名的所说：“如果你不打算开源，而且部分部分归功于\
    \ Linux 和开源在服务器和企业市场的成功，你将不得不看其他开发者。它本身无法做到这一点，它最近已经建立了一项稳定的业务以在当今世界生存，它必须是开放的。”\n\
    \n宏伟计划是继续投入。目前对新中心的支出预计将翻倍至每年 90 亿美元。微软还加速了对开源项目的贡献。开发者部门副总裁李森（Liuson）表示：“我们想要培养最好的开发者。”\n\
    \n你是否能欣赏微软的参考由你决定，但让我们列出微软走到这一步的程，并介绍它的几个开源项目。\n\n## 概览\n\n### 找到你寻找的内容\n\n###\
    \ 微软如何学会爱上 Linux\n\n对 Linux 历史中关键点的时间顺序回顾，这些关键点为微软改变其对源码的看法铺平了道路\n\n### 微软在开源领域的冒险\n\
    \n微软第一个开源的产品是什么？微软对开源开发者意味着什么？\n\n### 与 Martin 的 Windows 团队的采访\n\n结这位汇集了 65,000\
    \ 名微软工程师进行学习的工程师，是什么改变了微软变革的心。\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_18_0.png)\n\
    \nwww.linuxuser.com 19\n\n## 微软专题\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_19_0.png)\n\
    \n理解许多 Linux 用户心中挥之不去的敌意，必须回到硅谷的起源和自由软件运动。20 世纪 70 代出现了许多“手工”计算机套件以及之间的软件共享。但随着运动的增长，随着公司开始提供软件，自由精神开始消退。\n\
    \n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_19_1.png)\n\n雷蒙德（Raymond）的论文试图解释自由软件是如何工作的，以及它如何在违背感知最佳实践的情况下产生高质量的软件。\
    \ \n\n文章标题指的是两种不同的软件开发风格：闭源的“大教堂”（Cathedral），由对象、按分级运行的小团队组成；形成对比的是开放的“集市市”（Bazaar），它具有迭代发布，并涉及来自正式结构之外的贡献者的持续反馈。\n\
    \n## 古老的法官\n\n许多人关注自由软件（to soft），他们在行业内花费了大量时间，在 1976 年 1 月，微软软件（Microsoft Soft）的早期名称之一承担了一项任务。当时仅\
    \ 25 岁的合伙人比尔·盖茨（Bill Gates）给业爱好者们写了一封公开信，讨论他正在处理的版权侵权问题。他说：“谁能付得起免费做专业工作的钱？”\n\
    \n## 快速指南\n\n### 大教堂与集市市\n最终使微软能够开源开发的关键拼图，是软件开发者埃里克·S·雷蒙德（Eric S. Raymond）在其文章《大教堂与集市市》（The\
    \ Cathedral and the Bazaar）中的工作，该文章于 1997 年在 Linux 大会上提交，并在两年后出版成书。在编程中寻找错误并分发；但当时的盖茨是在没有收到任何特许费的情况下复制\
    \ Altair 880 计算机。\n\n> 谁能付得起免费做专业工作的钱？非常不开心的盖茨\n\n四年前，理查德·斯尔曼（Richard Stallman）在麻省理工学院（MIT）工作时，暴露在一个共享软件的程序员社区中，这种做法在\
    \ 1984 年结束，导致了我们今天所知的自由软件运动的法律和技术基础。这一运动改变了用户的期望：运行、学习和共享它。当斯尔曼谈论自由软件时，他将自由描述为一种问题，这在经常被引用的“免费啤酒（free\
    \ beer）”概念中得到反映。当时是解放用户的目标。\n\n随着软件开发从爱好转向大型业务，微软开创了专有软件模型，并在 20 世纪 70 年代和80 年代大部分是闭源的。这种哲学被诸如\
    \ GPL 的许可证支持，这些要求并巧妙地保护了自由软件。在1983 年，GNU 项目由于这个想法而诞生，导致了编译器、编辑器、测试器等 GNU 操作系统的开发。然而，野心勃勃的开发面临了许多挫折——花了三年时间看内核是否会发布自由软件许可证。\n\
    \n## 时间线：微软如何学会爱 Linux\n\n| 1975 年 4 月 | 1998 年 2 月 | 2001 年 6 月 | 2004 年 4 月\
    \ |\n| :--- | :--- | :--- | :--- |\n| 微软成立于 1975 年。年轻的比尔·盖茨在随后的一年里反对共享代码的文化 |\
