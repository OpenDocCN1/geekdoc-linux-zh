    ## NEAR-FUTURE FICTION


    ## Deliver me from darkness


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_95_0.png)


    Where was the bloody delivery drone?


    He''d been waiting for three hours, from the moment he''d woken up. How many times
    would he have to stay at home for the promise his eyes would be arriving that
    day?


    Okay, so by the time he ordered next-day delivery, the time his eyes still had
    a good week left, he''d been a bit cautious about making sure he was there to
    sign for them, the more critical it was getting the company to want him. They
    insisted on a drone at his door every day, but they''d been there for months.
    It was a load of rubbish.


    The light faded little. His eyes were on their last legs. If he didn''t get his
    new eyes soon his vision would cease, and no matter how many replacements they
    wouldn''t be able to see to install them. It was a situation. He swiped his phone
    and checked what it said. Why the bloody hell couldn''t just call them like old
    days? Ring and speak to someone, or at least have one online. The room got darker
    and in the corner before him, he could see the energy level down to the last notch
    of the last bar.


    How long did a notch last? He couldn''t remember.


    The doorbell rang. A promise? His sight faded to nothing but he managed to stumble
    across the room.


    "About bloody time," he said as he opened the door.


    "HI," said neighbour, "I seem to have a parcel that was meant for you."


    Are these the new ones? Tears flooded up and I can''t see... My eyes have failed—


    "I''ll check," said neighbour, "Yes, they are."


    "Would you like me to install them for you?"


    "Oh, yes please. Please."


    Overcome by gratitude and relief, he steadied himself inside "Please," repeated
    again and again.


