  - '[PAGE 81]


    # Review


    # Raspberry Pi everyday distros


    # DietPi


    A minuscule desktop that ships with the right kind of tools to flesh out


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_81_0.png)


    +   - Besides the RPL, DietPi is available for a host of single-board computers
    such as BeagleBone, Orange Pi and more


    # Diet software


    The DietPi distro the bare minimum of components you need to flesh out the installation.
    If you need, you can install the Xfce desktop environment which automatically
    pulled in the Firefox and XWeb browsers, with a couple of X utilities like the
    Orange calendar.


    # Package management


    DietPi secret is a handful of custom scripts, one of which enables to install
    software optimised for the Pi. Since it''s Debian based, you can also use the
    command-line apt-get package management system, or pull for easier package management.


    # Desktop and Usability


    On first boot you''ll have to enable it and then hook it up to a hotspot before
    the desktop loads. With that, you can use custom to build your installation. Besides
    pulling in software, custom tools are useful for the usual sort of management
    tasks such as enhancing network services and removing unwanted files.


    # Media playback


    In terms of out-of-box support, DietPi only includes a configuration utility for
    the JustBoom HAT audio. Once they''re installed the browsers play online, and
    you can install OMXPlayer from the repositories for playing other media.


    # Overall


    A very useful distro for DIYers to build their own installation. Its set of custom
    installation and management scripts also make it accessible to non-technical users.


    # Fedora Workstation


    The RaspPi version is as bland and unexciting as its desktop release


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_81_1.png)


    +   - Make sure you read through the installation and FAQ on the Fedora ARM wiki
    before you get started with the distro


    # Default software


    The RP version is an exact copy of the desktop version, with the bare minimum
    of desktop apps. Firefox, LibreOffice, Shotwell, Rhythmbox and even the Vboxitions
    app - which doesn''t make sense on the RPI. Like the main desktop version, it
    uses Gome 3.26 with the new-look settings window.


    # Package management


    Just after its setup, the graphical from the distro uses Gnome Software or with
    the CLI you get the DNF package manager. The repos, however, aren''t fleshed out
    as Debian''s - so for example you won''t find OMXPlayer there to have to complete
    from.


    # Desktop and Usability


    Unlike Ubuntu Meta, Fedora launches first-boot wizard to create users. However,
    to use the onboard Wi-Fi working to have a copy on firmware following the instructions
    on the docs. The docs also advise you to manually resize the SD Card. After even
    all this, the Pi had trouble keeping with gnome.


    # Media playback


    The lack of a featured video player in the desktop and the repos is a real disappointment.
    The Rhythmbox plays flawlessly, which is piped through HDMI to the TV. You can
    watch videos on YouTube, but they don''t play and aren''t result as.


    # Overall


    An exact replica of the Fedora Release for the desktop, for the Raspberry Pi 3
    comes up short in terms of included apps and performance compared to its peers.'
  - '[PAGE 82]


    # Raspbian


    The officially supported distro everything you deserve to honor


    A distro designed for low-powered computers, overflowing with apps


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_82_0.png)


    You can run Raspbian''s PIXEL desktop on a regular desktop PC, and it works wonderfully
    well to resurrect an old workhorse


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_82_1.png)


    If you can''t find what you''re looking for in the app store, you can download
    one of the popular software centres


    # Default software


    The default software list is tailored for those who want to improve their programming
    skills. There''s Sonic Pi, Scratch 2, Minecraft, Serif, Emulator, Mathematics,
    Thorny, Node-RED and Geany. For regular desktop there''s the Chromium with the
    Flash plug-in, LibreOffice, Clavis Mail and VNC Viewer.


    # Default software


    The distro is topped off the brim with apps. Besides the Raspberry Pi apps are
    also in Raspbian such as Scratch 4, Minecraft Pi, the IDLE. Mate also has the
    usual slew of desktop apps including the likes of Pledge, Thunderbird, Rhythmbox,
    VLC, and LibreOffice.


    # Package management


    To flush out the installation, Raspbian uses the no-PI packages. Besides installing
    software, the app can also remove and you can use it for instant updates. While
    it is not the most attractive app store, PIPPackages is functional and gets the
    job done


    # Package management


    The distro uses one app store called Boutique that contains a good collection
    of curated apps in about a dozen categories like Graphics, Games, Internet, and
    more. The app store is incredibly useful and gives you the option to hide proprietary
    apps.


    # Desktop and Usability


    After years of using LXDE, Raspbian now has a desktop environment of called PIXEL
    (or PI Xwind Window Environment) that you might love. It introduces new features
    to make Raspbian''s desktop look appropriate. Attention has been paid to the window-frame
    design to make it more modern, compared to LXDE''s latest date


    # Desktop and Usability


    As the name suggests, the distro uses the Gnome-inspired desktop and is easy to
    navigate. Mate also features a first-to-build wizard for creating a user and setting
    the Wi-Fi to a hotspot. First-time users will also use the buttons that help to
    enable sources lists, installed packages in the distro store, and broken packages.


    # Media playback


    While Raspberry Pi doesn''t list any multimedia player in the news, the distro
    does ship with the CLI-based OMXPlayer. You can also right-click on the video
    icon to change the audio output from HDMI to another, which works well and is
    a very convenient option.


    # Media playback


    Unlike other distros, surprisingly this one also includes VLC. The included VLC
    player is pretty useless in the absence of hardware acceleration, but the CLI-based
    OMXPlayer works wonderfully well. For better control you can install a graphical
    front-end as TBOPlayer.


    # Overall


    The official Raspberry Pi distro has solid Debian underpinnings and a good collection
    of software for its intended audience. It can easily be fleshed-out and has a
    new look to to the PIXEL desktop.


    # Overall


    Ubuntu Mate makes good use of the resources on the Raspberry Pi 3, with fast boot-up
    times and quick app launches. To top off, the distro is loaded with all the usual
    desktop apps.'
  - '[PAGE 83]


    # # Review Raspberry Pi everyday distros


    # In brief: compare and contrast our verdicts


    | DietPi | Fedora Workstation | Raspian | Ubuntu Mate |

    |---|---|---|--|

    | Default software | Ships with OS & a handful of useful scripts to build a desktop
    from scratch | An exact replica of the desktop version with only the most basic
    of apps included | A good collection of apps, especially if you want to hone your
    programming skills | It''s literally overflowing with apps catering to nearly
    all kinds of users and cases |

    | Package management | Includes a very useful built-in script to install software
    without the Raspberry Pi | It''s got both graphical and CLI management, but it
    represents fleshed out | Uses the Raspian apps and plugins into one of the most
    expensive repos | Its repo contains a curated list of apps and is powered by the
    Ubuntu repos |

    | Desktop and Usability | The set-up process is easy follows without any surprises
    | Doesn''t ship with free windows to run around on all of your devices | The new
    PIXEL desktop is fast, pleasing, and pleasantly responsive | The desktop is a
    first-class lightweight and friendly Mate desktop |

    | Media playback | You''ll have to install browse media players from the repo
    they | Plays audio besides video player in the same as in the repos | Doesn''t
    list any media player in the menus, but with the OMXPlayer | Plays multimedia
    without all you really need is a front-end OMXPlayer |

    | Overall | A very useful distro for others, probably more useful for developers
    | The Welcome release is of little use if you''re after a lightweight spin instead
    | Comes with a good collection of apps to start your desktop environment | This
    distro meets all requirements and provides great experience on the RP |


    # # AND THE WINNER IS...


    # ## Ubuntu Mate


    **In addition to those covered here, there are other distros you can convert the
    Raspberry Pi 3 to an everyday desktop.

    Worth mentioning is SARIPS, which puts Slackware on the RP; it''s a wonderful
    option for advanced users, but we haven''t included its more involved installation
    process that would scare away first-time users.

    On the other of hands, Fedora Workstation brings up the rear again with its lightweight
    performance. A better option for Fedora fans would be to of its lightweight spins,
    such as the one with the LXQ desktop. DietPi, with its custom scripts for flushing
    the distro, is a wonderful option for advanced users while the scripts offer the
    option to install useful desktop environments, the distro is more towards helping
    you keep all of your needs without worrying about configuration files.

    Raspbian has done a commendable job as a distro for the original Pi, which is
    also why we''ve recommended it for. That said, we awarded this test to Ubuntu
    Mate.


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_83_0.png)


    With very little effort, you can use Ubuntu Mate as your everyday Raspberry Pi
    3 desktop

    The distro gives you everything you get with Raspian plus a bit more. It''s the
    least amount of undertaking for it to be used as a regular desktop. We had to
    tweak the RP config text to force the sound through on the boards, and replaced
    VLC with TBPlayer, a graphical front-end to OMXPlayer. But that''s literally all
    you need

    to use Ubuntu Mate on the RP 3 for your everyday desktop. All things considered,
    Ubuntu Mate for the RP is centric setup to ship up a ready-distro distro for the
    SBC. It doesn''t require a package to repository, and in many situations can be
    put to straight away,


    > *Monica Sharma*


