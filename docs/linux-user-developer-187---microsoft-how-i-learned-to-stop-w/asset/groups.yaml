    \ MySQL 服务器能理解的任何内容。\n\n一旦创建并结构化了数据库，你将需要按顺序加载数据到其中。如果你想处理大量数据，你将需要直接与 MySQL 服务器交互。如果你是在程序内部按原始格式加载数据：\n\
    \n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_77_1.png)\n\n它是树莓派的官方语言。阅读文档位于：\n\n\
    ```python\n- phone_data = ('Joey Benard', 5551234567)\nmy_cursor.execute(add_phone,\
    \ phone_data)\n```\n\n一旦安装了该模块，通过 `import mysql.connector` 将其导入程序。第一步是连接到 MySQL\
    \ 服务器。基本语法是：\n\n```python\nmy_connection = mysql.connector.connect(user='username',\
    \ host='127.0.0.1', port='3306', database='test1')\n```\n\n在这个示例中，MySQL 服务运行在本地机器上，host\
    \ 被设置为 127.0.0.1。如果它运行在另一个机器上，你可以将 host 参数设置为相关的 IP 地址或主机名。\n\n如你所见，我们将插入语句与被插入的数据分离。通过这种方式，你可以轻松地添加\
