    ## Sphaera weather forecast


    Sphaera weather forecast: A deceptively simple way to display the weather forecast.


    Sphaera is a ''crystal ball'' for weather. We wanted the interaction to be as
    close as possible to how you interact with a crystal ball, which means placing
    your hands around or above the ball. The project was intended to give the user
    an idea of how to use the device without any limits.


    What was your approach to the interactive design?


    We wanted to show the forecast for the next week, not just the next 12 hours.


    What did we use for the Raspberry Pi?


    Since we chose the Raspberry Pi because it had everything we needed.


    How do you have any features?


    We would add more weather data such as temperature, and to show the forecast for
    the next week, not just the next 12 hours. We would also need to add speech recognition
    so that you can ask about the weather conditions, but it would be nice to have
    different kinds of rains.


    What kind of projects interest you?


    I like projects that are relatively simple to start on but have room to become
    more complex. I like going back and jumping into new projects of design. I really
    enjoy working with visuals of things that is already available, but puts it in
    a new context and makes it attractive and interesting.


    What was your solution?


    We tried many designs. Since the holograms require darkness in order to be visible,
    we started by using a glass ball with the sensors inside, but it looked like a
    character from The Lord of the Rings or some other fantasy story, and then it
    was quite amazing, that kind of the feeling we wanted. So we decided to use a
    plastic ball instead of placing the sensors inside and keeping them to the required
    density.


    What are you hoping to do next?


    My next project will probably be something related to my toddler''s room. I have
    some ideas about an interactive light with some sort of moving animals. I''m also
    curious to use the Raspberry Pi in combination with Google''s Android Things -
    it looks like fun!


    What was the most challenging part of the project?


    Definitely working on the aesthetic details. This involved placing all the sensors
    inside the globe and keeping them


