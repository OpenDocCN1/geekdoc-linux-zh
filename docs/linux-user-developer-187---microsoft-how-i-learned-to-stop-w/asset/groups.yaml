    these boards also carry standard control functions.


    > Low-powered do not necessarily mean low-cost; many of these products cost as
    much, if not more, fully functioning SBCs


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_63_1.png)'
  - '[PAGE 64]


    When talking about ''low-powered boards, we mean one of two things. First, there
    are boards that are useful to use more than SBCs, and are so useful for teaching
    the basics of programming and interfacing with hardware. Second, there are bare-bones
    boards that might be little more than a single chip (with a simple set of pins
    from a PC) but are suitable for embedded applications where space is at a premium.
    Low-powered does not mean low-cost; many of these products cost as much as, if
    not more, fully functioning SBCs.


    The first category is exemplified by the BBC microbit, which in 2016, was given
    to every Year 7 pupil in England and Wales. The main difference between the Raspberry
    Pi and its look-alikes is that it doesn''t run an operating system, so it cannot
    be used as a smartphone or PC and instead is limited but the microbit can perform
    embedded tasks in total isolation


    These end-microcontrollers are still available and the esp8266 is very popular.
    It has a 32-bit processor, 7KB of flash memory and 80KB of RAM.


    thanks to its on-board push-buttons, LED array, temperature sensor, compass and
    accelerometer. The BBC microbit costs £13, or £16 for a starter kit which also
    includes a battery box and the USB-to-microUSB lead that is needed to program
    it from your PC. A much better solution is provided by the MicroPython board v1.0
    with accelerometer which has fewer-on device. At £22.60, it also costs little
    more than the microbit.


    For bare-bones solutions you should pay attention to the products that can be
    programmed using MicroPython. While the family now includes much more powerful
    products, PI Pico chips started out offering circuits that were suitable for basic
    projects without just a discrete house of chips, like at super-low prices.


    Microchip also offers several boards which will allow developers to gain some
    experience of PI microcontrollers and write code while moving on to their own
    using hardware, such as the Echo Microbit XF Raspberry Development Board, which
    can be used as an SBC-like.


    The ultimate bottom-end, here, is represented by single-chip solutions – see LU''s
    Top Picks box on the right.


    # LU&''s top picks


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_64_0.png)


    # Cumbria Design

    Eden DSP Board


    This is a bare-bones board (11 io) so that you can use it for your own (for components).
    It uses the ESP32-WROOM-32D chip for which the development software is freely
    available. A separate programmer is needed to upload code from your PC. Starter
    applications are freely available:


    # StemLab Kit:Z210


    StemLab (Z210) from Red Piays contains a built-in FPGA, two ARM processors, plus
    ADCs and DACs. It runs in an open-source project with lots of software, freely
    available for implementing laboratory test equipment as signal generators and
    oscilloscopes.


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_64_1.png)


    # PICASE-08M2


    Not a bare-8-pin chip, the PICASE-08M2 (£2) is a PI microcontroller with custom
    software for BASIC programming. It''s supported by the development community.
    Although it''s intended to be built into your own circuit, the PICASE-08 Proto
    Board, as shown in the picture, is also available (£3) to be put up and running
    quickly.


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_64_2.png)


