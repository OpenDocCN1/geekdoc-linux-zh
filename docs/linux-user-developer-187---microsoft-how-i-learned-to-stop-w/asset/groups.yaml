    PART ONE An introduction to building programs with GNU Make


    Welcome to this new Linux series, which we will be learning how to use GNU Make.
    If you''ve ever installed Linux, you have probably run the make command to install
    it. Make has been used since 1977 in projects, particularly those written in C
    and C++. Although many projects now have their own tools, Make is still important
    for any developer to know source files within the same language. Moreover, the
    build order is often important: certain source files need to be compiled before.
    Since we don''t want to build the project by make commands every time, the best
    way of doing this is by using a shell script. For example, Make is a versatile
    tool that can be used with any language that supports command-line interface.
    The basic concepts of Make are simple, but you''ll also learn a number of differences
    that make it more powerful and capable—including features specific to GNU Make.
    For example, we write the following shell script:


    ```

    #!/bin/sh

    gcc player.c screen.c dvd_read.c

    gcc -o player


    ```


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_31_1)


    John Gowers is a university tutor in Programming and Computer Science. He likes
    to install Linux on every device he can and uses terminal commands on a daily
    basis.


    - A terminal running the Bash shell

    - GNU Make (included in most Linux distributions)

    www.gnu.org/software/


    The GNU Make program can easily simplify and automate the process of building
    a large software project. As we''ve seen in recent series, shell scripts are very
    powerful, so it is possible to automate complicated projects using a shell script.
    There is a much better way, though, which is to use GNU Make. The included in
    many Linux distributions. Builds scripted using GNU Make are more maintainable,
    configurable and compact than builds scripted using shell.


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_32_0)


    | player : player.o screen.o dvd_read.o |

    | gcc -o player player.o screen.o dvd_read.o |

    | player.o : player.c screen.h dvd_read.h |

    | gcc -o player.c |

    | screen.o : screen.c player.h |

    | gcc -c screen |

    | dvd_read.o : dvd_read.c player.h |

    | gcc -c dvd_read |


    # Understanding dependencies


    Central to the operation of GNU Make is the concept of a dependency. When we compile
    source files and other resources, the specific files that we need to carry out
    a build are known as the dependencies of that build.


    Dependencies will be attached to a particular file. These are the files that are
    required to build that file. For example, in the code above, the file depends
    on screen.o and dvd_read.o. Meanwhile, player.o has source player.c as a dependency.
    It may in addition have other dependencies that are not mentioned; for example,
    C programs often use header files, marked with .h, which are included directly
    inside the source files.


    followed by a colon and a list of dependencies required to complete that file.
    For example, in order to build the program Make, we need the objects player.o,
    screen.o and dvd_read.o. In order to build the object player.o, we need source
    player.c and the header player.h, screen.h and dvd_read.h. Each rule is a tab-indented
    line called a recipe, which is the shell command that we will use to build the
    rule. When Make tries to build the program player, it will run that recipe.


    Above it is easy and worthwhile to use Makefiles for simple projects as well as
    more complex ones. It may seem superfluous to include complete lists for each
    rule, since we are all really interested in the shell command that will run to
    build the files. The dependencies serve a very important purpose. To illustrate
    this,


    # Make will only compile a file if one of its dependencies has been modified since
    last build


    Dependencies are often of some kind, but not all dependencies are files. In large
    projects it is common to include source files in a separate directory and compile
    binaries in a separate directory bin. Now, the binary bin is one of the dependencies,
    and since it needs to be created in order to make them work.

