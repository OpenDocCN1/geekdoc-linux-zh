    ## 评测全新的开源软件


    ## 高级文本编辑器


    ### Atom 1.22

    一款也可以处理代码的文本编辑器


    Atom 将自己描述为可黑客（hackable）的文本编辑器，考虑到其极高的定制性，这并不是夸张其实辞。

    它由 Github 开发，内置了包管理器，允许你在应用程序内搜索插件。默认情况下，就有大约 7000 个插件。


    一个有趣的功能是查找和替换功能，你可以在输入时直接使用它来修改单个文件或多个文件。Atom 也可以作为 IDE（集成开发环境）使用，它的亮点之一是智能补全，而新版本引入了闭合括号匹配高亮功能，可以点亮你的光标。


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_89_0.png)


    Atom 提供了多种 UI 主题供自定义，你也可以创建自己的。你还可以定义按键绑定，并添加更多行映射（linemaps）和语法片段（syntax-snippet）库。最后，Atom
    构建在 Electron 框架上，使用 Web 技术创建跨平台应用，运行于所有主流操作系统。


    GitHub 与 Facebook 合作，为 Atom 用户提供类似 IDE 的功能包。


    ## 优点


    ## 缺点


    ## 非常适合...

    一个高度可定制的应用可以毫不费力地转变为非常强大的 IDE。


    它主要用于编写代码，将其转换为高级编辑器需要一些努力。


    在低端机器上编写和编辑代码是很困难。

    https://atom.io


    ## 桌面环境


    ### Enlightenment 0.22

    一个美观且轻量级的桌面环境


    ## 优点

    Enlightenment 是一个相当寻常的桌面环境。事实上，它更像是一个窗口管理器，因为它拥有任务栏、面板等功能。与许多轻量级环境不同，该桌面拥有你对重量级环境预期的所有功能，但资源占用仅为小部分。


    一个加载速度快但对资源使用非常有意识的桌面。


    ## 缺点

    桌面的每个元素中都有相当动画，从菜单到允许你定义不同行为和外观的“首次运行向导”。例如，有一个选择窗口大小的选项，这是一个非常实用的功能——即使你在 HDMI
    显示器上运行 Enlightenment。窗口还有一种独特的行为，当你将光标移动到它们上方时会自动激活，尽管这种行为在下次更新之前可以被覆盖。


    为高级用户提供了大量的模式和配置选项；最新的 0.22 版本提供了对 Wayland 显示的改进支持。你还获得了一个集成到所有媒体播放窗口中的新通知系统。


    安装 Enlightenment 的最佳方法是通过你所在发行版的仓库。Ubuntu 用户可以通过添加仓库获取它：`sudo apt-add-repository
    ppa:niko2048/e19`


    ## 非常适合...

    在低端机器上获得迷人的桌面视觉效果

    www.enlightenment.org


    ## 编程库


    ### OpenCV 3.3.1

    运行你的计算机来识别和追踪各种事物


    开源计算机视觉 (OpenCV) 是一个设计用于实时计算机视觉的机器学习编程函数库。该库可以读取图像并检测形状（圆形、正方形等）以及物体（房屋、人等）。这些函数能够读取数字、识别图像中的文本，这使其成为增强现实（AR）应用开发的理想选择。


    它还可以识别脸部、手势和动作，这意味着它对各种机器人应用都有用。事实上，OpenCV 是流行的机器人中间件——机器人操作系统 (ROS) 中的主要库。


    OpenCV 最初由 Intel 研究机构于 1999 年开发，现在由 OpenCV.org 非营利基金会维护。遵循 BSD 许可的库易于学习，其网站上有大量的文档，并支持
    C++、Java 和 Python 等语言。


    3.3.1 版本中的许多变化都旨在检测和识别。另一个重大变化是改进了库的深度神经网络模块并包含了新的示例。此外，OpenCV 运行在所有主流桌面和移动操作系统上；安装过程相当直接但相当复杂，且网站上提供了详尽的文档说明。


    ## 优点

    - 允许流行语言的编码人员为其项目添加图像识别能力。


    ## 缺点

    任何编程模块都存在复杂的安装过程和学习曲线。


    通过计算机视觉实现的人智能功能。https://opencv.org


    ## 网页浏览器


    ### Firefox 57

    #### 这是一个里程碑式的发布，务必尝试


    Mozilla 对其最新的 Firefox 版本（代号为 Quantum）感到兴奋。根据 Speedometer 2.0 基准测试，它声称新版本的速度与之前的版本一样快。这些改进归功于多线程、用
    Rust 编写的新型 CSS 引擎以及从头开始重写的其他组件。虽然引擎可能有所不同，但你会注意到启动和页面加载时间几乎有了提升，标签页切换更加响应，滚动也更加流畅。


    该浏览器还具有一个重新设计的界面，特别值得注意的是重新设计的工具栏中新的 Firefox 库（Library）。该库将你的历史记录、书签、标签页和下载全部整合在一个区域。新标签页也经过了重新设计，现在会对网站和页面进行分组，并为加拿大、美国和德国的用户提供来自
    Pocket 的推荐。


    你可以等待新版本进入你发行版的官方仓库，或者从 Firefox 网站获取压缩包。


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_90_0.png)


    上方：隐私浏览模式下的跟踪包含脚本，以便更快加载


    ## 优点

    - 隐私浏览模式下的跟踪包含脚本，以便更快加载


    ## 缺点

    - 该浏览器还具有一个重新设计的界面，特别值得注意的是重新设计的工具栏中新的 Firefox 库。该库将你的历史记录、书签、标签页和下载全部整合在一个区域。


    ## 非常适合...

    - 新标签页也经过了重新设计，现在会对网站和页面进行分组，并为加拿大、美国和德国的用户提供来自 Pocket 的推荐。

    - 你可以等待新版本进入你发行版的官方仓库，或者从 Firefox 网站获取压缩包。


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_90_0.png)


    上方：隐私浏览模式下的跟踪包含脚本，以便更快加载

    '
