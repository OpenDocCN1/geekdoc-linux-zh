  mdcn: "\n\n# 教程\n\n# LineageOS\n\n## 安装 LineageOS\n\n有一台老旧且更新严重落后的手机吗？用一个全新的、纯净的、开源的\
    \ Google 操作系统让它重获新生吧。\n\n人们常说金钱能改变一切。在那个超流行的 Android 操作系统 Cyanogenmod 的案例中，金钱改变了其母公司的哲学，将其方向从自由软件转变为商业软件，对代码库和项目负责人进行了许可授权，并最终导致了\
    \ Cyanogen Inc. 缺乏资金，从而大幅削减了其运营和对 Cyanogenmod 的众支持。这还导致了在开发过程中被侵入的社区夺回了他们的“孩子”并对此进行反抗。\n\
    \n因此，我们取代了 Cyanogenmod 及其事实上的开源继者 LineageOS - 它由该社区开发，并得到了原 Cyanogen 项目负责人 Steve\
    \ Kic 的大量贡献。名字变了——要怪就商标——版本也是，14.1 LineageOS 的第一个版本是直接从 Cyanogen 构建的，代码库几乎没有变化。\n\
    \n在探索如何操作之前，让我们看看为什么人们想要控制并折腾自己的手机。不仅仅是因为 Android 感觉像是在给 Google 的移动操作系统染色；更新可以让操作系统，这可能意味着你可以享受更好的电池续航、更多的隐私保护，以及更少那些人们永远存储在手机里的臃肿软件。它是由热爱自己手机并希望它们表现更好的人开发的：\n\
    \n尽管在 Android 之上安装 LineageOS 有其缺点，但 Google 在 Play 商店中实现了一个名为 SafetyNet 的系统，它允许开发者检查设备是否处于“已知良好”状态。LineageOS\
    \ 明智地选择不记录此检查，这意味着你可能会发现无法通过传统渠道使用某些功能。通常对此有绕过方法——如果你想使用 Google Play Store 安装项目，请在网上搜索“apks”。\n\
    \n安装 LineageOS 意味着你需要一台兼容的手机或平板电脑，以及连接到电脑的可靠方式。如果你有一台相当现代的设备，请访问 https://lineageos.org/devices\
    \ 查看，你应该能够毫无问题地更换手机，尽管可能不需要退回到你设备支持的更低版本的 Android。旧设备在某种多程度上被冷落了，但你可能仍然可以使用本指南中的技巧来安装旧的\
    \ Cyanogenmod。\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_35_0.png)\n\n# 获取准备工作\n\
    \n上述 LineageOS 对于安装在 PC 上的旧设备特别有效。请查看“安装 ADB”框以获取正确方向；它并不复杂。在刷入固件之前，你还需要对应设备的精确\
    \ LineageOS 版本，因为你设备中的特定硬件意味着没有一种适用于所有手机或平板电脑的通用方案。\n\n虽然你可以构建自己的自定义包，这是获取 LineageOS\
    \ 最新功能的最佳方法，但你可以通过 http://download.lineageos.org 下载预编译的 ROM 来简化过程。\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_35_1.png)\n\
    \n# Alex Cox\n\n兼任计算、写作，从家里起家，作为万物的一部分，Alex 从他的第一台 ZX Spectrum 开始就一直在拆解他的硬件了。\n\
    \n# 资源\n\n- 一台旧手机：查看 wiki 确认手机是否受支持 https://lineageos.org/devices/\n- Android\
    \ 开发者工具：对于 HTC，HTCDev 注册地址 http://htc.com/bootloader\n- Google 软件包：http://openageapps.org/\n\
    - 构建 LineageOS 的预编译 ROM：https://lineageos.org/\n- 用于解锁引导加载程序的 Sunshine http://theroot.org/\n\
    \n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_35_2.png)\n\n# 安装 ADB\n\nAndroid 调试桥（ADB）对于与你的操作系统进行深度通信至关重要，并处理与手机机器的通信。\n\
    \n随处可用。\n\n进入你机器上的终端并按照以下指令配置构建工具的连接：https://developer.android.com/studio/tools/platform-tools。下载\
    \ zip 文件，使用 unzip 解压，并将路径添加到环境变量中，以确保可以使用 adb 和 fastboot 命令。\n\nAndroid 编译次数。点击七次，然后返回主设置屏幕启用开发者选项。向下找到它，然后开启\
    \ USB 调试。将手机连接到电脑，并在终端输入 `adb devices`。你的设备应该显示为已连接；你也可以运行 fastboot 来调出一个受限的 shell\
