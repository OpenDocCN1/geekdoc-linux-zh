- md: "\n# Column Pythonista's Razor\n\n## Using RDBMS with Python\n\nWhen you have\
    \ a lot of data to work with, you will likely need to use a RDBMS – so much less,\
    \ learn how to use it with Python.\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_77_0.png)\n\
    \n> Last issue, we looked at using SQL data without needing a full RDBMS (Relational\
    \ Database Management System). This is fine when you have a limited amount of\
    \ data, but at some point you will need extra performance. Whether you use MySQL\
    \ or PostgreSQL is irrelevant; focus on data scalability. We won't be looking\
    \ at how to set up or manage the database; instead, we assume there is already\
    \ a database and focus on how to use it with Python. Also, using MySQL as the\
    \ example RDBMS:\n\nIf it's listening on the default port, 3306, you can leave\
    \ it as is. In previous articles, we haven't worried about connecting, but when\
    \ it comes to connecting to a database, we should look at how to manage connections.\n\
    \nThis way, you are just having bootstrap the extra data storage step, assuming\
    \ you have a database name and you have the privileges to create a new database.\n\
    \nContinuing the maybe, you will need to create tables before you can work with\
    \ it. Just as creating a database, you will need to have a cursor that can execute\
    \ SQL. The following code will create a table to store names and phone numbers:\n\
    \nJoey Benard is a true menace. He spends his time building furniture, working\
    \ with scientists, solving complex problems and writing apps.\n\n```python\nfrom\
    \ mysql.connector import error\nmy_connection = mysql.connector.connect(user='username',\
    \ database='test1')\n```\n\n```python\nexcept mysql.connector.Error as err:\n\
    if err:\n    print(err)\n```\n\n```python\ntable_stmt = \"CREATE TABLE phones\
    \ ('name' VARCHAR(50) NOT NULL, 'number' INT NOT NULL)\"\nmy_cursor.execute(table_stmt)\n\
    ```\n\n## We should manage connection errors\n\nconcepts are about using one database\
    \ to another with your SQL syntax. This is much simpler than using Python for\
    \ Debian-based databases; use apt-get mysql-connector. If you are using MySQL,\
    \ you can replace it with python3-connector.\n\nSomething is wrong with your username\
    \ or password\n\n```python\nif err.nerr == error.DB_BAD_ERROR:\n    print(\"Database\
    \ does not exist\")\n```\n\nAs you can see, we are just having SQL statements\
    \ to be processed by the MySQL server. These types of statements are called DDL\
    \ (Data Definition Language) and you can get pretty much anything the MySQL server\
    \ will understand.\n\nOnce your database is created and structured, you will need\
    \ to load data into it in order if you want to work with a lot of data, you will\
    \ need to use it directly with the MySQL server. If you are loading data as it\
    \ is within your program:\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_77_1.png)\n\
    \nIt's the official language of the Raspberry Pi. Read the docs at\n\n```python\n\
    - phone_data = ('Joey Benard', 5551234567)\nmy_cursor.execute(add_phone, phone_data)\n\
    ```\n\nOnce the module is installed, import it into your program with `import\
    \ mysql.connector`. The first step is to connect to the MySQL server. The basic\
    \ is:\n\n```python\nmy_connection = mysql.connector.connect(user='username', host='127.0.0.1',\
    \ port='3306', database='test1')\n```\n\nIn this example, the MySQL service is\
    \ running on the local machine, the host being set to 127.0.0.1. If it is running\
    \ on another machine, you can set the host parameter to the relevant IP address\
    \ or hostname.\n\nAs you can see, we separated the insertion statement from the\
    \ data being inserted. With this way, you can easily add the add statement. Also,\
    \ the data is separated out,\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_77_2.png)\n\
    \n## What about PostgreSQL?\n\nWhile MySQL is very popular, it has its limits.\
    \ For more complex data-storage, you might decide to use PostgreSQL instead. The\
    \ most popular library for PostgreSQL is with `sudo apt-get install python-psycopg2`.\n\
    \nBy default, connections to the database are not closed automatically. This means\
    \ you have to handle them manually.\n\nUsing this module (psycopg2) allows you\
    \ to write queries with standard SQL syntax. For example, you can connect to a\
    \ database with PostgreSQL with:\n\n```python\nfor (name,number) in my_cursor:\n\
    \    print(\"{}: {}\".format(name, number))\n```\n\n```python\nimport psycopg2\n\
    conn = psycopg2.connect(dbname=test, user=username)\nmy = conn.cursor()\n```\n\
    \nThis works because the cursor object can be used as an iterator.\n\nIf you need\
    \ to update a record in your MySQL database, you will first need to fetch the\
    \ ID and then use it to perform the update.\n\nAs you can see, the main difference\
    \ is that the parameters for connect are named differently and are not separated\
    \ by commas. Interacting with the database is simple: use the `execute()` method\
    \ to run your SQL statements against the database. While SQL is standard, every\
    \ RDBMS has its own extensions, so with MySQL and PostgreSQL, you might not be\
    \ able to seamlessly move rows from one database to another.\n\n```python\nmy_cursor.execute(\"\
    UPDATE table SET name=%s WHERE id=%s\", (name, id))\n```\n\nIf you need to delete\
    \ a record from your database, you can use the same method:\n\n```python\nmy_cursor.execute(\"\
    DELETE FROM table WHERE id=%s\", (id,))\n```\n\nWhen you fetch large datasets,\
    \ you might want to take advantage of RDBMS by creating and using stored procedures.\
    \ In MySQL, you can use the `fetchmany()` method to retrieve chunks of stored\
    \ data.\n\nOnce you have the data fully loaded, you may want to put it back in\
    \ order with you. If you want to change a statement, use the `execute()` method.\n\
    \n```python\nmy_cursor.execute(\"SELECT * FROM table\")\nfor row in my_cursor.fetchmany():\n\
    \    print(row)\n```\n"
  mdcn: "\n\n# Python 者的剃刀列\n\n## 在 Python 中使用 RDBMS\n\n当你有大量数据需要处理时，你可能需要使用 RDBMS——与其纠结，不如学习如何用\
