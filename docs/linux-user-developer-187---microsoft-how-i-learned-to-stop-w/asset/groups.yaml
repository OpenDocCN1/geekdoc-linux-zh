    # 观点


    ## Solus 的哲学


    随着独立的 Linux 桌面操作系统达到 4 版本，Joshua Strobi 揭示了驱动该故事发展的动力，以及用户可以期待的新功能。


    对于任何不熟悉 Solus 的人来说，它是一个来自 Intel 的基于 Linux 的操作系统，在系统稳定性与用户对最新软件以及滚动发布系统的需求之间取得了平衡。


    Solus 采用传统方式随附 Bud 桌面环境，提供了多种选择来将其打造为你自己的系统。此外，我们还提供了开箱即用的 GNOME 和 MATE 桌面，例如
    XFCE。但 Solus 不仅仅是一个操作系统。如果你还没有尝试过，这里有几个你应该尝试的充分理由：


    我们改进独立 Linux 桌面操作系统的愿景使我们能够为现实世界的问题提供解决方案。我们开发了简化驱动管理的解决方案。我们与开源社区合作，使开发者能够专注于其应用程序的功能，而不是分发过程的复杂性。我们还开创了带有自定义运行时集成的
    Snaps 安装解决方案。


    我们即将推出的 Solus 4（当你读到这里时，它应该已经发布了）体现了我们的信念：真正的桌面计算体验是通过集成实现的。Solus 4 将配备精简的 Bud，并引入
    Openbox 和 i3 等窗口管理器，而 MATE 版本将在菜单上看到全新的视觉改进。然而，最大的变化在“引擎盖”之下。首先，我们正在使用 Snaps 来改进一组精选第三方应用程序的安装和管理。Snaps
    的加入使我们能够轻松安装通过现有仓库无法访问的软件。


    Solus 4 还将成为第一个包含 Sense 的版本，Sense 是我们的新系统界面，采用统一的方法配置系统管理。Sense 提供了一个故障安全的二进制文件来解决更新问题并将系统恢复到完全健康。通过我们开发的新系统配置界面，我们了一个名为
    Sophie 的“生活质量”助手。它处理滚动更新 Linux 操作系统的繁重工作，如管理更新，经常发生的问题也可以轻松完成。Sophie 允许用户组启用原本需要手动干预的新功能或特性。


    从本质上说，Sense 和 snaps 的不仅让我们能够提升用户体验，还为用户提供了保持系统运行的手段。


    如果你被激发了兴趣，你现在就可以下载 Solus，或者访问 https://solus-project.com 跟踪开发进展。看看它并告诉我们你的想法——你的反馈至关重要。


    Joshua Strobi 是 Solus 项目的传播经理，并非养狗者和开发者。


    # 读者来信


    关于杂志、Linux 和开源的问题与意见


    ### 艺术家


    作为我们热情且博渊的作者。一如既常，我们想听听读者对哪些话题感兴趣，因为我们今年有几个专题，并计划涵盖一些如 InfoLinux 等关键活动。我对我们的布局风格非常满意，因为非常幸运地有一位才华横溢的艺术家
    Robert Webber，他最近出现在我们的封面上。我喜欢杂志的某些方面，但它更多是一个缓慢的演变过程，而不是一场寒武纪事件。我们只能通过做需要的事来精炼和刷新页面，并将继续努力改进每一期杂志。我们同意杂志需要具有“棱角”，但这并不意味着我们不能使用一些色彩来点缀我们写作的内容。


    亲爱的 Lu&D：首先，感谢你们带来出色的杂志。到目前为止，在我看来，文章的平衡比以往任何时候都更符合价值，特别是安全方面的内容。它一直在不断介绍我喜欢的内容。你们有一个机会在所有内容中创造出一种小小的“风格”（例如你们自己的布局），这将让你们显得专业且大胆。白纸上的黑字可能是老派，但其他一切看起来都像是随手扔的时尚杂志。


    Tim Morris


    Chris：Tim，感谢你对杂志内容的赞美。在安全文章方面，我们得到了 Toni Castello Gronila 的极大帮助。


    我可以提出一个批判性的观察吗？我个人从 ZX Spectrum 时代就开始接触计算机，并一直是一个粉丝。然而，内容很棒，但每一期的视觉效果和感觉相当糟糕，纤细的字体更像是20
    世纪70 年代的杂志，非常难以阅读。


    亲爱的 Lu&D：我很喜欢本杂志，但我想知道你们能帮帮我吗？我正在寻找可以备份我们使用的红帽服务器的东西。目前，我正在使用 Acronis TrueImage。


    我接受你关于反转颜色的观点，使用纤细字体显著提高了可读性。我们曾有过背景颜色，但我们可能需要仔细考虑它的问题。我必须承认，经验告诉我，那些习惯了在终端工作的老手可能会觉得固定颜色难以阅读。


    联系我们！

    有话想告诉我们或有疑问吗？需要答案吗？请发送邮件至 linuxuser@futurenet.com 联系我们。


    # 关注我们

    Facebook: facebook.com/LinuxUK

    Twitter: @linuxusagerm


    ### 备份伴侣

    亲爱的 Lu&D：我很喜欢本杂志，但我想知道你们能帮帮我吗？我正在寻找可以备份我们拥有的 Windows 机器的东西，但 Linux 有对应的可以使用吗？


    向 Stefan 道歉，他错误地说是安大略大学。事实上，事实上在很多方面，它们是完全不同类型的杂志。事实上在很多方面，它们是完全不同类型的杂志。


    Clonezilla 是 Linux 用户喜欢的磁盘克隆、磁盘映像和数据恢复工具。


    Chris：市上有许多工具，但在 rsync 和 Clonezilla 之间存在一种选择。如果你查看其他工具，你会发现许多都是 rsync 实用的前的前（例如
    Back in Time）。我个人没有用过 Acrobat，但我会说 Clonezilla 是唯一在执行任务时真正提供你所需的工具。


    选择取决于你想备份和恢复什么。如果你需要备份文件和目录，rsync 更好。请记住，rsync 只是将一个驱动的内容复制到另一个驱动，它不会创建或格式化分区，因此它无法从一个文件复制到整个系统。所以，使用
    Clonezilla 恢复硬盘，使用 rsync 恢复磁盘内容。


    ### 纠正！

    我必须承认那些优惠是非常吸引人的，尽管在某些时候我们获得了高达 42% 和 48% 的折扣，在此基础上还额外优惠 20%。对于微信贷来说，这并不是容易理解的优惠。


    Sanzida


    # 黑五

    亲爱的 UK：感谢提供精彩的读物，我已经订阅了几年了，它变得越来越好。我有一个请求：请减少订阅广告的数量！黑五（或者应该叫黑五 12 月？现在这整件事似乎会持续整个月）那时的广告得格外刺眼。


    '
