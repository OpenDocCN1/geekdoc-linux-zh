    ## 开源你的 Linux 新闻与观点


    ## 访谈 RESIN.IO


    ## 针对物联网的无感 Linux 容器


    我们采访了 resin.io，这家公司推出了 resinOS 软件平台，帮助开发者构建、部署和管理运行在连接设备上的代码。


    > 对于那些还没有接触过你们的读者，你能简单介绍一下 resin.io 公司是做什么的吗？


    Resin.io 是机群所有者的救星。他们拥有许多设备和移动服务器——无论是工业级的，还是像树莓派那样简单的设备。这些设备分布在现场，执行从稳定的农业项目到智能建筑监控器、智能电表，或者像无人机这样疯狂的设备。我们有一位客户在澳大利亚沿岸使用水下涡轮机。它完全可以是任何东西；就是一个运行在现场的
    Linux 容器，需要被管理。


    所以，本质上，我们将数据中心技术——即我们用于管理和更新数据中心服务器的技术——应用到了处理能力较弱但对连接性要求极高的环境中。一切基本上都在室外。你甚至无法控制环境，可能是热也可能是冷。我们的数据中心技术可以适应这种环境。人们可以廉价地构建这些设备机群，而无需以一种极其缓慢且容易出错的方式进行，否则替代方案就是什么都不做。


    你提到的在垃圾回收站的环境下运行容器是真的吗？


    噢 是的，那是一个有趣的故事。在伦敦，曾有一个带有屏幕的回收设备设备，基本上我们就是为那家公司运营的团队。我们是如何开始的，呢，这些设备非常强大。它们非常像服务器，我们对它们进行管理。但我们遇到了一些问题，必须使用键盘和鼠标来打开这些设备并进行刷新。我们必须走遍一百个独立的地点，那里到处都是这些设备，以确保一切运行正常。


    我直觉上感到，这些工具必须是存在的。不可能是，如果我在云端工作，一切都会像现在这么简单。当我回到 20 世纪 80 年代时，确保这一切这一点在直觉上是不成立的。我们查看了一下，发现确实如此。于是我们说：“好吧，那这就是我们可以做的。”


    那时，Linux 容器和 Docker 才刚刚起步。我们发现容器如此轻量化，我们能够将许多云工作流和技术推送到嵌入式设备。每个人，每个人都认为这是一个疯狂的想法。我们甚至不懂
    Linux 和嵌入式计算机是如何合并的，不知道 Linux 容器是如何进入场景的。


    **Alexandros Marinos**

    resin.io 创始人兼 CEO

    这是一家致力于让部署 Linux 容器变得尽可能简单的初创公司。

    该公司的格号是：“我们让它运行起来。”


    你们如何处理那些疯狂的一面？


    首先，resin.io 有一个核心元素。如果你无法更新，你就无法信任。如果你没有更新，对吧，没有办法更新你的系统，那么你只能依赖 Linux 内核带来的，无论是
    Heartbleed 漏洞、Krack 攻击，还是……


    resin.io 仪表板是一个用于查看设备详细信息的 API 客户端。


    ## 结识“怪兽”


    Resin.io 有一个名为“The Beast”的公司宠物。这是一个用于测试和部署产品更新的内部集群平台。最新版本第 3 拥有 336 台树莓派，被设计为模块化/计算型的“乐高”，可以相互扩展并相互提供动力支持。


    在早期，你可以触碰其中一个，其他的就会围过来：“这也是我们做的类似事情，”Marinos 说，“这是一种源自设备的某种群行为。”


    最初，resinio 开始构建集群。“第一个，只有三个节点。它太小了，以至于我会去办公室检查它，然后我们开始不断增加。在2014 年，我们有了一个 120
    台设备的集群，”Marinos 说道。


    他说“怪兽”是由他和 Shaun Mulligan 花了 10 天才构建的：“当然，第一个真的是名副其实的一头怪兽。要搬运到任何地方都极其笨重。”


    于是他们决定使用模块化设置：“这就是为什么我说，我不知道我们要构建多少个，因为我们本质上是构建了这些 12 台设备的集群，它们很容易汇聚成‘怪兽’。它们可以相互通信，并从彼此获取网络和电力。”


    这是一个让 Marinos 和他的团队感到自豪的清晰集群，尽管他承认要同时满足所有限制条件所花费的时间和精力是不可接受的。“我们基本上在构建这样的东西，当你必须考虑电力、网络和完整性时，当然，你必须同时考虑所有这些。”


    Resinio 希望将 The Beast 成为一种开放的设计，你可以将其用于任何树莓派集群。他们的项目说明包括 Meagleodons、Beagleons
    和 Oranges，你可以使用任何项目。更多细节请查看 https://github.com/project-276-the-beast。”


    Marinos 补充道：“说让它们全部连接在一起很容易的。”


    上图：由 350 台 Pi 组成的 Resinio 集群在罗马 Maker Faire 展会上展示。


    “我们会去挖矿 Minero 之类的，但因为这并不令人满意，它并没有真正触及我们工作的核心。集群运行在某处并与世界交互。”


    当我们采访 Marinos 时，我们希望 resinio 能够……（此处由于原文存在大量重复和断句，已根据要求进行逻辑翻译）


