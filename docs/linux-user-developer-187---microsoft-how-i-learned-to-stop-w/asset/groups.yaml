    \ has the usual slew of desktop apps including the likes of Pledge, Thunderbird,\
    \ Rhythmbox, VLC, and LibreOffice.\n\n### Package management\n\nTo flesh out the\
    \ installation, Raspbian uses the apt-get packages. Besides installing software,\
    \ the app can also remove and you can use it for instant updates. While it is\
    \ not the most attractive app store, PIPPackages is functional and gets the job\
    \ done.\n\n### Package management\n\nThe distro uses one app store called Boutique\
    \ that contains a good collection of curated apps in about a dozen categories\
    \ like Graphics, Games, Internet, and more. The app store is incredibly useful\
    \ and gives you the option to hide proprietary apps.\n\n### Desktop and Usability\n\
    \nAfter years of using LXDE, Raspbian now has a desktop environment called PIXEL\
    \ (or PIXEL Window Environment) that you might love. It introduces new features\
    \ to make Raspbian's desktop look appropriate. Attention has been paid to the\
    \ window-frame design to make it more modern, compared to LXDE's latest date.\n\
    \nAs the name suggests, the distro uses the Gnome-inspired desktop and is easy\
    \ to navigate.\n\n### Comparison Table\n\n| Feature | DietPi | Fedora Workstation\
