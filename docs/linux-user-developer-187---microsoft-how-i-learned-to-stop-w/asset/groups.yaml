    \n### DietPi\n\nA minuscule desktop that ships with the right kind of tools to\
    \ flesh out\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_81_0.png)\n\n- Besides\
    \ the RPL, DietPi is available for a host of single-board computers such as BeagleBone,\
    \ Orange Pi and more.\n\n### Diet software\n\nThe DietPi distro deports the bare\
    \ minimum of components you need to flesh out the installation. If you need, you\
    \ can install the Xfce desktop environment which automatically pulls in the Firefox\
    \ and XWeb browsers, with a couple of X utilities like the Orange calendar.\n\n\
    ### Package management\n\nDietPi's secret is a handful of custom scripts, one\
    \ of which enables you to install software optimised for the Pi. Since it's Debian-based,\
    \ you can also use the command-line apt-get package management system, or deapt\
    \ for easier package management.\n\n### Desktop and Usability\n\nOn first boot\
    \ you'll have to enable it and then hook it up to a hotspot before the desktop\
    \ loads. With that, you can use custom tools to build your installation. Besides\
    \ pulling in software, custom tools are useful for the usual sort of management\
    \ tasks such as enhancing network services and removing unwanted files.\n\n###\
    \ Media playback\n\nIn terms of out-of-box support, DietPi only includes a configuration\
    \ utility for the JustBoom HAT audio. Once they're installed the browsers play\
    \ online, and you can install OMXPlayer from the repositories for playing other\
    \ media.\n\n### Overall\n\nA very useful distro for DIYers to build their own\
    \ installation. Its set of custom installation and management scripts also makes\
    \ it accessible to non-technical users.\n\n### Fedora Workstation\n\nThe Raspberry\
    \ Pi version is as bland and unexciting as its desktop release\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_81_1.png)\n\
    \n- Make sure you read through the installation and FAQ on the Fedora ARM wiki\
    \ before you get started with the distro.\n\n### Default software\n\nThe Pi version\
    \ is an exact copy of the desktop version, with the bare minimum of desktop apps.\
    \ Firefox, LibreOffice, Shotwell, Rhythmbox and even the Virtualboxitions app\
    \ - which doesn't make sense on the RPI. Like the main desktop version, it uses\
    \ Gnome 3.26 with the new-look settings window.\n\n### Package management\n\n\
    Just after its setup, the graphical interface from the distro uses Gnome Software\
    \ or with the CLI you get the DNF package manager. The repos, however, aren't\
    \ fleshed out as Debian's - so for example you won't find OMXPlayer there to have\
    \ to complete from.\n\n### Desktop and Usability\n\nUnlike Ubuntu Meta, Fedora\
    \ launches a first-boot wizard to create users. However, to use the onboard Wi-Fi\
    \ working, you have to get a copy of the firmware following the instructions on\
    \ the docs. The docs also advise you to manually resize the SD Card. After even\
    \ all this, the Pi had trouble keeping with Gnome.\n\n### Media playback\n\nThe\
    \ lack of a featured video player in the desktop and the repos is a real disappointment.\
    \ The Rhythmbox plays flawlessly, which is piped through HDMI to the TV. You can\
    \ watch videos on YouTube, but they don't play and aren't result as expected.\n\
    \n### Overall\n\nAn exact replica of the Fedora Release for the desktop, for the\
    \ Raspberry Pi 3 comes up short in terms of included apps and performance compared\
    \ to its peers.\n\n### Raspbian\n\nThe officially supported distro everything\
    \ you deserve to honor\n\nA distro designed for low-powered computers, overflowing\
    \ with apps\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_82_0.png)\n\nYou can run\
    \ Raspbian's PIXEL desktop on a regular desktop PC, and it works wonderfully well\
    \ to resurrect an old workhorse\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_82_1.png)\n\
    \nIf you can't find what you're looking for in the app store, you can download\
    \ one of the popular software centres.\n\n### Default software\n\nThe default\
    \ software list is tailored for those who want to improve their programming skills.\
    \ There's Sonic Pi, Scratch 2, Minecraft, Serif, Emulator, Mathematics, Thorny,\
    \ Node-RED and Geany. For regular desktop there's the Chromium with the Flash\
    \ plug-in, LibreOffice, Clavis Mail and VNC Viewer.\n\n### Default software\n\n\
    The distro is topped off to the brim with apps. Besides the Raspberry Pi apps\
    \ there are also in Raspbian such as Scratch 4, Minecraft Pi, the IDLE. Mate also\
    \ has the usual slew of desktop apps including the likes of Pledge, Thunderbird,\
    \ Rhythmbox, VLC, and LibreOffice.\n\n### Package management\n\nTo flesh out the\
    \ installation, Raspbian uses the apt-get packages. Besides installing software,\
    \ the app can also remove and you can use it for instant updates. While it is\
    \ not the most attractive app store, PIPPackages is functional and gets the job\
    \ done.\n\n### Package management\n\nThe distro uses one app store called Boutique\
    \ that contains a good collection of curated apps in about a dozen categories\
    \ like Graphics, Games, Internet, and more. The app store is incredibly useful\
    \ and gives you the option to hide proprietary apps.\n\n### Desktop and Usability\n\
    \nAfter years of using LXDE, Raspbian now has a desktop environment called PIXEL\
    \ (or PIXEL Window Environment) that you might love. It introduces new features\
    \ to make Raspbian's desktop look appropriate. Attention has been paid to the\
    \ window-frame design to make it more modern, compared to LXDE's latest date.\n\
    \nAs the name suggests, the distro uses the Gnome-inspired desktop and is easy\
    \ to navigate.\n\n### Comparison Table\n\n| Feature | DietPi | Fedora Workstation\
    \ | Raspbian | Ubuntu Mate |\n| :--- | :--- | :--- | :--- | :--- |\n| **Default\
    \ software** | Bare minimum; can install Xfce/Firefox/XWeb/Orange-factories. |\
    \ Exact copy of desktop version; minimal apps (Firefox, LibreOffice, etc.). |\
    \ Tailored for programming skills (Sonic Pi, Scratch, etc.). | Topped off with\
    \ apps (Scratch 4, Minecraft, etc.). |\n| **Package management** | Custom scripts,\
    \ apt-get, deapt. | Gnome Software, DNF; repos not as fleshed out as Debian. |\
    \ apt-get, PIPPackages store (functional but not attractive). | Boutique store\
    \ with curated apps. |\n| **Desktop and Usability** | Custom tools for installation\
    \ and network services. | First-boot wizard; Wi-Fi requires firmware manual update;\
    \ SD resize; trouble with Gnome. | PIXEL environment; modern window-frame design.\
    \ | | |\n| **Media playback** | Config utility for JustBoom HAT; OMXPlayer from\
    \ repos. | Lack of featured player in desktop/repos; Rhythmbox works HDMI; YouTube\
    \ issues. | Rhythmbox works through HDMI. | | |\n| **Overall** | Useful for DIYers;\
    \ accessible to non-technical users via scripts. | Comes short on apps/performance\
    \ compared to peers. | Officially supported; designed for low-powered computers.\
    \ | | |\n\n## ## AND THE WINNER IS...\n\n### Ubuntu Mate\n\nIn addition to those\
    \ covered here, there are other distros you can convert the Raspberry Pi 3 to\
    \ everyday desktop.\nWorth mentioning is SARIPS, which puts Slackware on the RP;\
    \ it's a wonderful option for advanced users, but we haven't included its more\
    \ involved installation process that would scare away first-time users.\nOn the\
    \ other of hands, Fedora Workstation brings up the rear again with its lightweight\
    \ performance. A better option for Fedora fans would be to its lightweight spins,\
    \ such as the one with the LXQ desktop.\nDietPi, with its custom scripts for flushing\
    \ the distro, is a wonderful option for advanced users while the scripts offer\
    \ the option to install useful desktop environments, the distro is more towards\
    \ helping you keep all of your needs without worrying about configuration files.\n\
    Raspbian has done a commendable job as a distro for the original Pi, which is\
    \ also why we've recommended it for. That said, we awarded this test to Ubuntu\
    \ Mate.\n\nWith very little effort, you can use Ubuntu Mate as your everyday Raspberry\
    \ Pi 3 desktop\nThe distro gives you everything you get with Raspian plus a bit\
    \ more. It's the least amount of undertaking for it to be used as a regular desktop.\
    \ We had to tweak the RP config text to force the sound through the boards, and\
    \ replaced VLC with TBPlayer, a graphical front-end to OMXPlayer. But that's literally\
    \ all you need\nto use Ubuntu Mate on the RP 3 for your everyday desktop. All\
    \ things considered, Ubuntu Mate for the RP is centric setup to ship up a ready-distro\
    \ distro for the SBC. It doesn't require a package to repository, and in many\
    \ situations can be put to straight away,\n\n> *Monica Sharma*\n[/content] (Note:\
