    keys are well-spaced, and the 0.8mm layer is a delight with forceful feedback.
    With 225-ppi (ppi) and colour reproduction, the Pixelbook''s display rivals some
    of the best, such as the 227-ppi MacBook Pro (13-inch). The panel works well for
    movies and photos, though for video editing it hits; however, it''s a bit glossy
    and as such difficult to touch. At any rate, it doesn''t stand up to direct sunlight
    underneath the Pixelbook. The Pixelbook Pen isn''t included, but it''s a nice
    addition to the experience. The pen works excellently as a stylus, offering plenty
    of pressure awareness as well as tilt support, drawing on the display. There is
    a shortcut button for calling Google Assistant, which also incorporates some of
    the new, Google Lens technology found in smartphones such as search-to-select,
    circling on-screen to get results from Google Assistant. We pictured a circle
    of Ron Livingston in the Office Space, and Google Assistant drew a character like
    Jim Gibbons – before telling us about the actor. One major flaw of the Pixelbook
    Pen, though, is that it doesn''t attach to the laptop in any way. It also runs
    onAAAA batteries, which we''d expect a rechargeable solution at this price.


    Not surprisingly, the Pixelbook is a strong performer that can handle workloads
    through the Chrome browser with a nary hiccup. Google documents and spreadsheets
    to chat and photo editing – Google promises up to 10 hours of use on a single
    charge. In our test, the battery lasted 9 hours and 15 minutes at 1080p resolution
    with 50% screen brightness, but the Pixelbook lasted for 7 hours and 40 minutes.
    Our ever-cheaper less powerful Asus Chromebook Flip lasted 10 hours and 40 minutes,
    which is two hours more than the Pixelbook, but with USB-C charging.


    The marque feature of the Pixelbook is its support of Android apps, along with
    Google Play. The interface to access these apps is easy, friendly and responsive.
    Every app we downloaded from the Play Store worked without any issue. Some apps
    feel as if they were on a smartphone, but those that depend more on the app developers
    than Google.


    Ultimate Android app support stands to blow Chrome OS open, eliminating its dependence
    on the Chrome web for app-experiences. It brings the OS far closer in capacity
    and versatility to full-blown desktops.


    # Pros


    Sublime design with an excellent keyboard and stylus, to offer full Android app
    support


    # Cons


    The stylus is useful but an extra touch, audio performance is poor and there''s
    no biometric login


    # Summary


    The Google Pixelbook is the first Chromebook that is worthy of your Android apps
    alongside high-end devices. We are now at the point where there is little to no
    compromise for switching to Chromebook from others


