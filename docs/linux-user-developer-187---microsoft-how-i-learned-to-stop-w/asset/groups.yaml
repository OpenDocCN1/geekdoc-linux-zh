    \ | 微软在 GitHub 上有超过 16,000 名贡献者，并发布了超过 3,000 个开源项目 |\n\n25\n\n## 采访：理查德·斯尔曼，软件活动家\n\
    \n理查德·斯尔曼是自由软件运动之父和 GNU 项目的创始人。你认为微软已经改变并可能成为一家开源公司吗？萨提亚·纳德拉被任命为 CEO 后，他宣布了“云优先、移动优先”战略，并迅速下了\
