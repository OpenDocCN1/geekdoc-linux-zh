    \n这样一来，你只需要对额外的数据存储步骤进行引导，假设你有一个数据库名称并且拥有创建新数据库的权限。\n\n继续下去，在你操作它之前，你需要先创建表。就像创建数据库一样，你需要一个可以执行\
    \ SQL 的游标。以下代码将创建一个用于存储名称和电话号码的表：\n\nJoey Benard 是个真正的麻烦。他花时间制造家具、与科学家合作、解决复杂问题以及编写应用程序。\n\
    \n```python\nfrom mysql.connector import error\nmy_connection = mysql.connector.connect(user='username',\
    \ database='test1')\n```\n\n```python\nexcept mysql.connector.Error as err:\n\
    if err:\n    print(err)\n```\n\n```python\ntable_stmt = \"CREATE TABLE phones\
    \ ('name' VARCHAR(50) NOT NULL, 'number' INT NOT NULL)\"\nmy_cursor.execute(table_stmt)\n\
    ```\n\n## 我们应该管理连接错误\n\n概念是关于如何使用你的 SQL 语法从一个数据库到另一个数据库。这比使用 Python 处理 Debian\
    \ 数据库要简单得多；使用 `apt-get mysql-connector`。如果你使用的是 MySQL，可以将其替换为 `python3-connector`。\n\
    \n你的用户名或密码有问题\n\n```python\nif err.nerr == error.DB_BAD_ERROR:\n    print(\"Database\
