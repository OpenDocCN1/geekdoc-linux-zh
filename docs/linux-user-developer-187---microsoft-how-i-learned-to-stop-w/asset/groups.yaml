    \n如果没有任何规则依赖项需要重新编译或发生变化，Make 将不会重新创建目标。否则，它将运行该目标的配方来创建该文件。\n\n如果我们有一个脚本，我们可能不得不妥协编写一个复杂的脚本来测试每个文件的依赖项，以确定是否需要编译。有了\
