    ## 测评


    ## 树莓派日常发行版


    ### DietPi


    一个极微小的桌面系统，配备了合适的工具来完善功能。


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_81_0.png)


    - 除了 RPL 之外，DietPi 还适用于 BeagleBone、Orange Pi 等许多单板计算机。


    ### DietPi 软件


    DietPi 发行版提供了完善安装所需的极精少组件。如果你有需要，可以安装 Xfce 桌面环境，它会自动拉取 Firefox 和 XWeb 浏览器，以及几个如
    Orange 日历之类的 X 工具程序。


    ### 软件包管理


    DietPi 的秘密在于一些自定义脚本，其中一个脚本允许你安装针对树莓派优化的软件。由于它是基于 Debian 的，你也可以使用命令行 `apt-get`
    软件包管理系统，或使用 `deapt` 进行更方便的管理。


    ### 桌面与易用性


    在首次启动时，你必须启用它并在桌面加载前连接到热点。之后，你可以使用自定义工具来构建你的系统。除了下载软件外，自定义工具对于常见的管理任务有用，例如增强网络服务和删除不需要的文件。


    ### 媒体播放


    在开箱支持方面，DietPi 仅包含一个针对 JustBoom HAT 音频的配置工具。一旦安装，浏览器即可在线播放，你还可以从仓库安装 OMXPlayer
    来播放其他媒体。


    ### 总结


    对于 DIY 爱好者构建自己的系统来说，这是一个非常有用的发行版。其自定义安装和管理脚本也让非技术用户能够轻松上手。


    ### Fedora Workstation


    树莓派版本和它的桌面版一样平淡且枯燥无味。


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_81_1.png)


    - 在开始使用该发行版之前，请确保仔细阅读 Fedora ARM wiki 上的安装和常见问题（FAQ）。


    ### 默认软件


    Pi 版本是桌面版本的完全复制，包含最基础的桌面应用。Firefox、LibreOffice、Shotwell、Rhythmbox 甚至还有 Virtualboxitions
    应用——这在树莓派上并无意义。和主桌面版一样，它使用了 Gnome 3.26 以及带有新外观的设置窗口。


    ### 软件包管理


    设置完成后，该发行版的图形界面使用 Gnome Software，或者通过命令行（CLI）使用 DNF 软件包管理器。然而，它的仓库没有 Debian 那么完善——例如，你不会在那里找到
    OMXPlayer 来进行补全。


    ### 桌面与易用性


    与 Ubuntu Meta 不同，Fedora 会启动一个首次运行向导来创建用户。然而，为了让内置 Wi-Fi 可工作，你必须按照文档中的说明获取固件副本。文档还建议你手动调整
    SD 卡的大小。即使经过了这一切，树莓派在运行 Gnome 时仍然很吃力。


    ### 媒体播放


    桌面和仓库中缺乏功能性的视频播放器非常令人失望。Rhythmbox 播放非常完美，通过 HDMI 传输到电视上。你可以在 YouTube 上看视频，但它们无法播放，结果也不如预期。


    ### 总结


    它是桌面版 Fedora Release 的精确复制，但对于树莓派 3 来说，在包含的应用和性能方面逊于同类产品。


    ### Raspbian


    你值得尊享的官方支持发行版


    一个为低功率计算机设计的发行版，装满了应用。


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_82_0.png)


    你可以在普通的桌面 PC 上运行 Raspbian 的 PIXEL 桌面，它在复兴一台老旧设备方面表现非常好。


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_82_1.png)


    如果你在应用商店中找不到你需要的内容，可以下载一个流行的软件中心。


    ### 默认软件


    默认软件列表是为那些想要提高编程技能的人身定制的。有 Sonic Pi、Scratch 2、Minecraft、Serif、Emulator（模拟器）、Mathematics、Thorny、Node-RED
    和 Geany。对于常规桌面，还有带有 Flash 插件的 Chromium、LibreOffice、Clavis Mail 和 VNC Viewer。


    ### 默认软件


    该发行版被应用填得满满当当。除了树莓派专属应用外，Raspbian 中还有 Scratch 4、Minecraft Pi 和 IDLE。Mate 还有系列常见的桌面应用，包括
    Pledge、Thunderbird、Rhythmbox、VLC 和 LibreOffice。


    ### 软件包管理


    为了完善安装，Raspbian 使用 `apt-get` 软件包。除了安装软件，该应用还可以删除，你可以用它进行即时更新。虽然它不是最吸引人的应用商店，但
    PIPPackages 功能完备并能完成任务。


