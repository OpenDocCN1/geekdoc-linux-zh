    ## 特性


    ## 微软


    是否可以进行这些更改，因为我们仍然能从中获益？微软发布的开源项目数量庞大，我们将重点介绍几个。在 Build 2019 内核发布会上推出的“适用于 Linux
    的 Windows 子系统”（WSL，详见下文快速指南）在 Windows 10 秋季更新中结束了 Beta 测试。你可能已经注意到可以通过 Windows
    商店安装 Linux 发行版，但由于它们不是完整的 Linux 发行版，你可能会怀疑这样做的意义何在。微软首席经理 Martin Woodward 表示，对于开发者来说，这样做的主要原因是：“基本上，我们想为开发者提供一个极佳的桌面，包含像
    Office 和 Outlook 等你所需的所有程序。但如果你想熟悉 Linux，它就在那里，而且你输入的是真正的正宗的 Bash。”


    ## 代码，大量的操作系统


    微软还发布了 .NET 技术的开源、模块化形式，称为 Base .NET（.NET Core）。它是跨平台的，并支持多种 Linux 发行版。现在，.NET
    SDK 提供了命令行工具来使其变得简单。拉取代码、下载项目依赖、编译并发布。


    TypeScript 及其实现应用-JavaScript 的能力非常受欢迎。然而，要真正从 .NET Core 操作中获益，它还对你编写的代码提供了内置调试。Visual
    Studio Code 遵循以键盘为中心的编辑器调试周期，于 2015 年开源。这是一个丰富的跨平台编辑器，在语言和调试器方面具有高度可扩展性，并内置了 Git
    客户端支持。忠于其根源，Visual Studio Code 为标准开发提供了嵌入的 Git 控制。


    ## 快速指南


    ### 适用于 Linux 的 Windows 子系统 (WSL)


    WSL 是 WSL 的核心关注，WSL 和 Windows 控制台高级经理 Rich Turner 将其描述为一种“在 Windows 上运行 Linux
    开发工具的方法”。该项目承诺在 Windows 上提供 Ubuntu 版本的 Bash，这是由 Canonical 创建的最优秀的 Linux 版本。WSL
    本身在内核中拥有子系统，并模拟了 Windows 内核实现的行为。这允许微软运行 Ubuntu 的用户模式段，而无需修改你正在使用的如 apt 等许多 Linux
    工具，它使得 Linux 二进制文件能够直接在 Windows 上运行。目前，WSL 专注于命令行工具，但如果你是一个处理 Windows 的开发者，这是一个令人兴奋的项目。


    > Windows 控制台也在开发中，以获得与流行的 Linux 更好的兼容性。


    ## 时间线：微软如何学会爱上 Linux


    | 日期 | 事件 |

    | :--- | :--- |

    | 2015年11月 | 微软通过与 Canonical 的合作将 Debian GNU/Linux 引入 Azure 云，并提供 Debian "Whezy"
    7 和 "Jessie" 8。 |

    | 2015年11月 | 红帽与微软达成协议，将红帽企业 Linux (RHEL) 引入 Azure 云。双方还承诺不起诉对方的合作伙伴。 |

    | 2016年1月 | Ubuntu 首次在 Azure 上预览。现在其 Azure 云计算平台提供了所有领先的 Linux 发行版。 |

    | 2016年8月 | Windows 10 引入了适用于 Linux 的 Windows 子系统，使得在基于 Ubuntu 的用户环境中运行 Bash 和其他
    Linux 工具成为可能。 |


    ## 访谈：Woodward，微软


    Woodward 是 Visual Studio 团队的首席经理，他是 2009 年在 Google 工作后加入微软的 35,000 名工程师之一。


    > 问题变成了“我们为什么要开源？”，而不是“我们为什么要这样做？”


    然后整个 Angular.js 团队都注意到了这一点，它开始在像你所知的大型项目中事实上获得了一定的采用。“再次，这些是为了微软的内部使用而构建的，然后我们开源是因为它。一旦开源，我们会有很多人为它做贡献，还有很多了解
    Angular 并被其吸引的人。“‘我们为什么要开源它？’，而不是‘我们为什么要（这样做）？’”


    无论你是否能从内心深处找到支持微软——毫无疑问的是，在 Nadella 的领导下，短短三年内开源贡献的水平是一项令人赞叹的成就。


    试图弄清楚事情有点像一种震惊。我参加的第一门课程——除了标准的课程（你知道的，比如业务行为）——是一门在投影到 DVD 上的全息图出现之前并不明显的课程，而
    DVD 然后被包装在缩膜盒子里并邮运。“为什么要邮运？”我记得当时感到三件事让我每个人都有相同的经历，‘系统开放’，这意味着开源开源并保持始终在线的服务。使用缩膜包装软件进行开发带给我这种“不失败”的心态。每个人向我展示了在关键时刻你修复东西的速度有多快。这是一种完全不同的心态。


    微软所做的另一个不完全完美的事情是拥有 TypeScript，它自发布以来一直非常火热。对 Woodward 来说，这是另一个像 C# 和 Pascal 那样的“经典”特性。“当时我在想，‘谁会采纳微软的这个
    JavaScript？’”


    Woodward，Joshua Strobi，Solus 通信经理。 (注：由于原文在后半部分存在大量逻辑重复和断句断裂，翻译时已根据上下文语境对混乱语段进行了语义对齐)


