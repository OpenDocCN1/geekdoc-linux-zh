- md: "\n## Essential Linux\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_33_0.png)\n\
    \nThere are two types of dependencies. The first is a dependency that has no attached\
    \ rule, typically some kind of source file. If Make encounters such a dependency,\
    \ on that file is more recent than the timestamp on the target file, it will rebuild.\
    \ This indicates that the source file has been modified more recently than the\
    \ target file, and in such a situation Make will decide that it needs to run the\
    \ rule in order to create the target.\n\nBy default, Make displays each command\
    \ in the recipe before executing it, which can be noisy during debugging. To suppress\
    \ this, you can silence a line of the recipe by prefixing it with @. If we want,\
    \ for example, writing text to a file, we could use the command instead.\n\nSince\
    \ we have been making some changes to screen.c, it is most recent than screen.o,\
    \ and so Make will run the gcc -c screen.c in order to rebuild the object file.\n\
    \nThe last dependency is d_read.o, player.o, and other files. If any of these\
    \ rules or files have not been modified more recently, Make will skip this rule.\n\
    \nThe second type of dependency is a rule that occurs elsewhere in the Makefile.\
    \ For example, the .o dependency depends on the source file rule defined further\
    \ down. Then, Make recursively executes each of these rules before processing\
    \ the target.\n\nNow that Make has processed all the dependencies for player,\
    \ it can decide whether or not to run the rule for target. Since we ran the rule\
    \ for screen.c, it means that the file has been modified more recently than the\
    \ target and Make will rebuild it.\n\nIf none of the rule dependencies require\
    \ recompilation or have changed, Make will not recreate the target. Otherwise,\
    \ it will run the recipe for the target in order to create the file.\n\nIf we\
    \ had a script, we would either have to settle for compiling a complicated script\
    \ that tested the dependencies of each file in order to find whether or not it\
    \ needs to compile. With Make, we do not have to worry about that.\n\nTo illustrate\
    \ this, let's see what might happen if\n\nOur example is simple, but larger projects\
    \ develop a more complex dependency tree, each of which has dependencies of its\
    \ own, each with further dependencies and sources.\n\n## As any language, repetition\
    \ is something we want to avoid in Makefiles\n\nThe 'leaves' of the tree are the\
    \ source files, which have no dependencies of their own. If these sources are\
    \ absent, the Makefile cannot run them.\n\nWe decided to modify the way of our\
    \ D player displayed on screen.c. We made a make fix for the first rule in the\
    \ file: Before it begins it checks for changes to screen.c.\n\nOne way to try\
    \ and do it is the following:\n\nWhen we run the command, Make starts off with\
    \ the first rule in the file. Before it begins it checks for each of the dependencies.\n\
    \n- bee : flower\n- flower : bee\n\nThe first dependency is player.o, which is\
    \ a rule source; since none of player.o dependencies have been modified more recently\
    \ than player.o, Make skips this rule without doing anything.\n\nThe second dependency\
    \ is screen.c, which is another rule source; screen.c has two dependencies of\
    \ which are both\n\n```make\nmake\nCircular flower <- bee dependency\nmake: Not\
    \ to be for 'bee'.\n```\n\nFigure (2) demonstrates pseudocode that might help\
    \ you understand how Make works if you're not quite sure.\n\nBefore some pseudocode\
    \ for a simplified version of Makefile that does not behave exactly as Make, but\
    \ is an approximation:\n\n```\nfunction make(rule)\n  var needCompile = false\n\
    \  for d of rule.dependencies\n    if (isRule(d))\n      needCompile = true\n\
    \    else if (exists(d))\n      needCompile = (d.date > rule.date)\n    else\n\
    \      error \"Dependency \" + d + \" does not exist!\"\n      exit\n  if (needCompile)\n\
    \    execute(rule)\n  return needCompile\n```\n\n## Make variables\n\nIn the Makefile,\
    \ we have to define the dependencies of player.o, screen.o, d_read.o, once each\
    \ on each. As in any language, code repetition is something we want to avoid in\
    \ Makefiles; if we wanted to add an extra .o file to the dependencies of player,\
    \ then we would need to modify both lines.\n\nLuckily, Make provides the concept\
    \ of variables, which can store text and be used as many times as we like in the\
    \ file. For example, we could add the following to the top of our Makefile:\n\n\
    ```\nOBJECT_FILES = player.o screen.o d_read.o\n```\n\nWe could be on the other\
    \ hand, change the rule to:\n\n```\nplayer $(OBJECT_FILES)\ngcc -o player $(OBJECT_FILES)\n\
    ```\n\nNotice that we reference variables using a dollar sign and square brackets.\
    \ If we used shell scripting, this might look a bit strange, since shell-scripting\
    \ uses $ for variables. To get the output of the program, the fact that we can\
    \ put spaces around the equals sign when writing to a variable is another difference\
    \ from shell scripting. It is important to remember that this is not shell scripting,\
    \ and although it looks similar, it may have different syntax rules.\n\nRules,\
    \ in fact, are written in shell scripting.\n\n## Globs and substitution\n\nMake\
    \ supports exactly the same functionality as shell. For example, if we use\n\n\
    - * *.o\n\nin the definition of a rule, it will expand to give the list of .o\
    \ files in the directory containing the Makefile.\n\nOne thing might try be to\
    \ replace the list of .o files with *.c\n\nThis works because the makefile contains\
    \ exactly the object files that we need. But if we define the DIR_variable, *.o\
    \ will expand to the list of .o files in the directory containing the makefile.\n\
    \nOne possible solution to this problem is substitution. We should not rely on\
    \ the rule that *.o files are always present; instead, we need to declare a pattern\
    \ for the objects. Then we can rely on the source .c files. If they are detected,\
    \ then we have no hope of compiling the program as is. One solution is to declare\
    \ that the object files are the same as the source C files, but with the extension\
    \ .c changed to .o.\n\nFor this, we will use the Make pattern. If we write the\
    \ following:\n\n```\nOBJECT_FILES = $(pattern %c,%o) $(wildcard *.c)\n```\n\n\
    Then Make will populate the OBJECT_FILES with the names of the C files from the\
    \ first as .c changed to .o.\n\nThere are a few parts to this logic. First, the\
    \ order of patterns and wildcard. In order to call a function in Make, we use\
    \ the same $(...) syntax that we use for variables. The wildcard function performs\
    \ glob expansion on its argument; it also\n\nin rules, but not if we use the function\
    \ to set a variable. If we use $(wildcard *.c) it will give a list of all the\
    \ source files in the directory. The second function, pattern, performs substitution\
    \ on strings. In this case, it is like to replace a portion of the string, where\
    \ we can be any string of characters. It is similar to the shell command\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_34_0.png)\n\
    \n> Large pieces of software can have complicated makefiles. A portion of the\
    \ Makefile makes make itself\n\n```bash\n$ echo $ | 's/\\(.*\\)/\\1\\/g'\n```\n\
    \n```\n BIN_PROGRAMS:\nrm -rf $(bindir) *\nlist=$(BIN_PROGRAMS); test -f $p |\
    \ list; \\\nfiles=$(for p in $list; do echo $p; done | transform 's/\\.$(EXT)$//');\n\
    test -d \"$(DESTDIR)\" || exit 1\ncd $(DESTDIR) && rm -f \"$files\"\ncd -\ntest\
    \ -f $(BIN_PROGRAMS) | echo.\nclean-BIN_PROGRAMS:\ntest -f $(BIN_PROGRAMS) | rm\
    \ -f $(BIN_PROGRAMS)\nclean-CHECK_PROGRAMS:\ntest -f $(CHECK_PROGRAMS) | rm -f\
    \ $(CHECK_PROGRAMS)\nloadings(EXTRA_LIBS):\ntest -f $(EXTRA_LIBS) | load. $(EXTRA_LIBS)\n\
    load -V $(EXTRA_LIBS)\ntest -f $(LIBS) | load. $(LIBS)\nmake: $(OBJECTS)\n\t$(CC)\
    \ -o $(TARGET) $(OBJECTS)\n```\n\n## Make rules\n\nAs we mentioned above, Make\
    \ rules are shell commands that are inserted into the Makefile to help build a\
    \ particular rule.\n\nSince recipes are intended to be passed to the shell, they\
    \ are written in a different language from the rest of the Makefile; written in\
    \ the usual shell-scripting language, rather than in Make language. We have access\
    \ to all the shell's capacity, but Make passes the rule to the shell for execution.\n\
    \nThe most important thing about this rule is that Make does not expand variables.\
    \ Above, we included the OBJECT_FILES variable inside the rule for a goal. A more\
    \ example version of what we said above: Make performs some preprocessing of the\
    \ lines referencing variables with the content of that variable.\n\nVariable references\
    \ use the dollar sign, which can cause a conflict if we used shell variables.\
    \ In that case, we can escape the dollar sign by writing two of them. For example,\
    \ the C compiler is often stored in the environment variable CC; in that case,\
    \ we can modify the rule for player:\n\n```\n$($CC) -o player $(OBJECT_FILES)\n\
    ```\n\nWe're looking at Make in more detail next:\n"
  mdcn: "\n\n## 核心 Linux\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_33_0.png)\n\n\
