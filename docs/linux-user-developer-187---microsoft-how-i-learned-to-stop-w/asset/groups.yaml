    ## Single Board Computers

    ## HIGH-POWERED AND LOW-POWERED BOARDS


    Some applications require high-performance boards, while others need even more
    muscle. High-powered boards fall between Raspberry Pi-type boards and full PCs.
    They are much smaller than motherboards, allowing compact PCs to be put together.
    Canyon Atom E385 has a SATA interface for attaching hard drives and a RAM slot
    so you can configure the memory. It is available from around £46, including CPU.
    Generally, DSP boards'' software needs to be developed on a PC and then downloaded
    to the board.


    ## DSPs and beyond


    The ultimate in performance is provided by SBCs that have an on-board FPGA. Otherwise
    known as a Field Programmable Gate Array, these chips contain logic circuits that
    are connected together, with software to produce a digital circuit. Given that
    hardware is generally considered to be faster than software, this can be much
    more parallel, in operations that With DSP boards, applications equipped with
    ADCs and DAQs are used in specialised applications for which an FPGA is good enough.
    While an FPGA isn''t a general-purpose processor (although it is possible to implement
    small processors within an FPGA), these boards also carry standard control functions.
    Conventional radio receiver uses a lot of analogue electronics, a so-called Software
    Defined Radio (SDR) can be implemented within


    When talking about ''low-powered boards, we mean one of two things. First, there
    are boards that are more than SBCs, and are so useful for teaching the basics
    of programming and interfacing with hardware. Second, there are bare-bones boards
    that might be little more than a single chip (with a simple set of pins from a
    PC) but are suitable for embedded applications where space is at premium. Low-powered
    does not mean low-cost; many of these products cost as much, if not more, fully
    functioning SBCs.


    The first category is exemplified by the BBC microbit, which in 2016, was given
    to every Year 7 pupil in England and Wales. The main difference between the Raspberry
    Pi and its look-alikes is that it doesn''t run an operating system, so it cannot
    be used as a smartphone or PC and instead is limited but the microbit can perform
    embedded tasks in total isolation.


    These end-microcontrollers are still available and the esp8266 is very popular.
    It has a 32-bit processor, 7KB of flash memory and 80KB of RAM thanks to its on-board
    push-buttons, LED array, temperature sensor, compass and accelerometer. The BBC
    microbit costs £13, or £16 for a starter kit which also includes a battery box
    and the USB-to-microUSB lead that is needed to program it from your PC. A much
    better solution is provided by the MicroPython board v1.0 with accelerometer which
    has fewer-on device. At £22.60, it also costs little more than the microbit.


    For bare-bones solutions you should pay attention to the products that can be
    programmed using MicroPython. While the family now includes much more powerful
    products, PI Pico chips started out offering circuits that were suitable for basic
    projects without just a discrete house of chips, like at super-low prices.


    Microchip also offers several boards which will allow developers to gain some
    experience of PI microcontrollers and write code while moving on to their own
    using hardware, such as the Microbit XF Raspberry Development Board, which can
    be used as an SBC-like.


    The ultimate bottom-end, here, is represented by single-chip solutions – see LU''s
    Top Picks box on the right.


