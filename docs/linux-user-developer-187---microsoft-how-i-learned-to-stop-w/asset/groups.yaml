    ## Single Board Computers


    ## LU&D''s top picks


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_65_0.png)


    ## Orange Pi 2G-IOT


    The Orange Pi 2G-IOT (£11) is a Pi-like board, but differs from most in that it
    does not have an HDMI port. Instead, it''s capable of running Android such as
    on a mobile phone. The major difference, though, is its cellular interface supports
    2G and a SIM card. Wi-Fi and Bluetooth are also supported.


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_65_1.png)


    ## IoT BOARDS


    The Internet of Things (IoT) is a major growth area and there''s no shortage of
    SBCs to fill this need.


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_65_2.png)


    - Adafruit Feather FONA

    - Particle

    - Orange Pi 2G-IOT


    ## Adafruit Feather FONA


    Adafruit Feather FONA (F506) is a 2G-enabled version of Arduino-modules. As with
    most similar products you''ll need to add a SIM card, an external antenna and
    battery, to get it working. It''s far more versatile for off-the-grid applications
    than a cheap phone.


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_65_3.png)


    The Internet of Things (IoT) comprises ''things'', as opposed to computers, which
    are connected to the internet and are always accessible via web. These range from
    sophisticated pieces of equipment such as sensors that keep an eye on the environment.
    In later years, IoT sensors will be used to implement early-warning systems, monitoring
    and control.


    > QUICK TIP Can''t get signal?


    > Before embarking on a project involving IoT devices in remote areas, check for
    network coverage. Mobile coverage drops off in many rural areas (and even not-rural
    ones).


    Many of the SBCs are positioned at IoT locations, which raises questions about
    what each board offers from any other SBC. With the wide range of applications,
    there''s no single answer. From the phenomenal forecasts for the IoT, it''s clear
    that for some applications, low power consumption and small size are essential
    and many of the cheaper boards are perfectly suited for this environmental-sensing
    applications. Most of the Raspberry Pi-like boards have Ethernet ports or wireless
    interfaces such as WiFi and can be used as add-ons for Arduino-like. For equipment
    located in buildings with Wi-Fi or wired backhaul, devices have access to the
    net.


    In remote areas, we need boards that can connect to the net via mobile phone networks.
    While mobile phone might not be enough or because of the power requirements, SBCs
    are capable with circuitry of a mobile unit built in. High speed isn''t a requirement
    for most IoT applications so there''s no need to go for the latest 4G design—most
    boards offer either 3G or 2G (GSM). Do be sure to check the 2G networks in your
    country before investing!


    For other applications, long unattended operation is a must, so low power consumption—coupled
    with the ability for the board to be in a deep sleep mode—is essential. Many Arduino-like
    boards offer this feature. However, we''re focusing on features that enable IoT
    devices to be in remote locations, a key feature for many.


    ## Particle 3G


    The Particle 3G (around £52) is a small, 52mm microcontroller with an ARM Cortex-M3
    micro-processor plus plenty of flash memory, and 3G connectivity. Unlike other
    cellular cells, it comes with its own SIM card and data plan, together with a
    plug-in system for extensions.


