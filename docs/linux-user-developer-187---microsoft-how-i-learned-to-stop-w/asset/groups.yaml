    ## 单板计算机

    本身是单板计算机

    ## 高功率板卡与低功耗板卡


    最强大的性能是由那些带有板载 FPGA 的板卡提供的。另一种被称为现场可门阵列的 FPGA，这些芯片包含了逻辑电路，由于 FPGA 足够快，这些板卡还带有标准功能。传统的无线接收器使用了大量的模拟电子设备，而所谓的软件定义无线电（SDR）可以实现……


    对于低功耗板卡，虽然 FPGA 并不是通用处理器，但它们是足够的。


    当我们谈论低功耗板卡时，我们指的是两种情况。第一，有些板卡比 SBC 更强大，非常适合教学编程基础和硬件交互。第二，有些裸机板卡可能只是一个单芯片（带有简单的引脚），但适用于空间受限的应用。低功耗并不意味着低成本；许多此类产品的价格甚至高于功能齐全的
    SBC。


    第一类是以 BBC microbit 为代表的，它在 2016 年发给了英格兰威尔士的所有 7 年级学生。树莓派与其类似物之间的主要区别在于它不运行操作系统，因此不能作为智能手机或
    PC 使用，但 microbit 可以在完全隔离的情况下执行嵌入式任务。


    这些终端控制器仍然存在，8266 非常流行。它拥有 32 位处理器、7KB 闪存内存和 80KB RAM，得益于其板载按键、LED 阵列、温度传感器、指南针和加速度计。BBC
    microbit 售价 13 英镑，入门套件为 16 英镑，还包含电池盒和从 PC 编程所需的 USB 转 microUSB 线。一个得更好的解决方案是由带有加速度计的
    MicroPython 板卡提供的，它比 microbit 贵一点点。


    对于裸机解决方案，你应该关注那些可以使用 MicroPython 编程的产品。虽然该系列现在包含了许多更强大的产品，但 PI Pico 芯片最初提供的是适用于基础项目的电路，而不需要离散的芯片组，例如以超低的价格。


    Microchip 还提供了几块板卡，允许开发者获得 PI 微控制器的经验，并在转向自己的硬件时编写代码，例如 Microbit XF 树莓派开发板，它可以作为
    SBC 使用。

