    \n## PostgreSQL 呢？\n\n虽然 MySQL 非常流行，但它也有其局限性。对于更复杂的数据存储，你可能会决定使用 PostgreSQL。PostgreSQL\
    \ 最流行的库是通过 `sudo apt-get install python-psycopg2`。\n\n默认情况下，数据库的连接不会自动关闭。这意味着你必须手动处理它们。\n\
    \n使用此模块（psycopg2）允许你使用标准的 SQL 语法编写查询。例如，你可以这样连接到 PostgreSQL 数据库：\n\n```python\n\
    for (name,number) in my_cursor:\n    print(\"{}: {}\".format(name, number))\n\
    ```\n\n```python\nimport psycopg2\nconn = psycopg2.connect(dbname=test, user=username)\n\
    my = conn.cursor()\n```\n\n这之所以有效，是因为游标对象可以作为迭代器使用。\n\n如果你需要更新 MySQL 数据库中的记录，你首先需要获取\
    \ ID，然后使用它执行更新。\n\n如你所见，主要的区别是 connect 的参数命名不同，且不是用逗号分隔。与数据库交互非常简单：使用 `execute()`\
    \ 方法在数据库上运行你的 SQL 语句。虽然 SQL 是标准的，但每个 RDBMS 都有自己的扩展，因此对于 MySQL 和 PostgreSQL，你可能无法无缝地将行从一个数据库移动到另一个。\n\
    \n```python\nmy_cursor.execute(\"UPDATE table SET name=%s WHERE id=%s\", (name,\
    \ id))\n```\n\n如果你需要从数据库删除记录，可以使用相同的方法：\n\n```python\nmy_cursor.execute(\"DELETE\
    \ FROM table WHERE id=%s\", (id,))\n```\n\n当你获取大型数据集时，你可能想通过创建和使用存储过程来利用 RDBMS。在\
    \ MySQL 中，你可以使用 `fetchmany()` 方法分提取存储的数据。\n\n一旦完全加载了数据，你可能想按照你的要求重新排序。如果你想更改语句，请使用\
    \ `execute()` 方法。\n\n```python\nmy_cursor.execute(\"SELECT * FROM table\")\nfor\
    \ row in my_cursor.fetchmany():\n    print(row)\n```\n\n"
