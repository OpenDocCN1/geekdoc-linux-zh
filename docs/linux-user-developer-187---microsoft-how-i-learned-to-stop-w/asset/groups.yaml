    ## 微软特性


    一位忧心忡忡的鲍默（Balmer）。据估计，微软每年从其软件专利中获得至少 30 亿美元的版税收入，而它对 Linux 公司的专利协议持有，尽管这在很大程度上被视为一个积极的举措，但近年来它减少了一些长期以来的奢侈开支。


    令人惊讶的是，考虑到 2004 年也是微软发布开源软件的一年。将 Git 引入该公司的微软首席经理马丁·伍德森（Martin Woodward）表示，无论你信不信，某些开源内容实际上是在鲍默执任期间开始的。


    > 据估计微软每年从软件版税中赚取至少 30 亿美元的版税收入


    “在某些方面，他获得的钱不够，有许多人并不会告诉他‘Linux 是一种癌症’……但一些‘一个微软’的内容（这是在他之后出现的，关于服务和服务的内容）是在他的执政下开始的。”


    Wix 的第一个开源项目是一个名为 Wix 的工具包，用于从 XML 构建 Windows 安装程序包。它在 GPL 许可（LGPL）下发布，该许可已获得开源倡议（Open
    Source Initiative）和软件基金会的批准，允许专有软件在不强制采用相同 GPL 许可的情况下使用一个位于 GPL 的库。要感谢的人是原始作者罗布·梅什（Rob
    Mesh），他在 Linux 上工作过该项目。在自己的个人博客上，他表示开源社区内部的许多人理解其真正含义，并“想在 Linux 下改进这一点”。从那时起——正如你从展示该特性的时间线看到的那样——出现了许多新公告和开源项目，并在显著的增长，例如
    2012 年，微软进入 Linux 内核贡献者前 20 名，当时它正在处理内核驱动程序、虚拟机管理程序虚拟化。在萨提亚·纳德拉（Satya Nadella）接掌该领域后，情况在
    2014 年发生了转折。“我认为如果你能理解我们为什么要这么做，会有帮助，”纳德拉说，他将 Git 引入了公司。“我们仍然是一家公司，但不同了，因为我们变得更加开源友好。Azure
    提供了帮助，所以现在我们通过销售访问 Linux 的权限来盈利——我们也有很多产出。”


    ## 时间线：微软如何学会爱 Linux


    | 日期 | 事件 |

    | :--- | :--- |

    | 2012 年 | 一名为 Microsoft Open Technologies, Inc. 的子公司宣布了公司对开放性的投资 |

    | 2013 年 10 月 | 一个正在进行中的三年期项目 Types——一种开源编程语言和 JavaScript 源代码在 Apache 2.0 许可下发布
    |

    | 2014 年 1 月 | Microsoft Open Technologies 是一个社区驱动的 Linux 和 FreeBSD 机器镜像存储库 |

    | 2014 年 10 月 | 萨提亚·纳德拉被任命为微软首席执行官。宣布“云优先、移动优先”，并将桌面 Windows 视为业务的核心 |


    ## Linux 基金会执行董事 Jim·泽林（Jim Zemlin）


    与世界上其他任何软件公司不同，微软意识到开源在今天有多么重要，并希望在可见的未来占有一席之地。微软取得了进展，并积极支持、依赖并贡献于像 Cloud Foundation、原生计算基础设施（CNCF）、Linux
    和 TODO Group 等开源项目。这意味着更高质量的开源代码，造福了整个社区。”


    Linux 虚拟机，微软表示有三个虚拟机托管在 Azure 上。但更重要的是，我们希望客户拥有选择操作系统的自由。这意味着任何基于 Linux 的软件必须在
    Azure 中运行良好，这也意味着在任何条件下都要尽可能良好。微软生成了许多 Linux 内核修复，“因为我们在其中设置了许多 Linux 在 Windows
    上运行，我们将其性能提升了 50%……这对我们来说是一项巨大的成本，这使得让工程师全职工作改进（Linux）内核变得完全合理，”他说道。


    然而，伍德罗罗（Woodrow）补充说，公司最大的变化是他们开始用业务术语向管理层解释这些内容。他说，微软将开源视为招募人才的资产。这是一个简单的事实，特别是在科技行业，口碑良好的公司更容易招募人才，因为他们知道
    Linux 的存在。


    ## 转型


    微软向开源贡献代码的原因是业务导向的哲学：“我们使用的 Linux 内核很多是 GPL 许可的，我们为了在 Windows 上运行很多 Linux，改进了它的性能，”伍德罗罗说，“如果你在本地进行开发而不推送到上游（upstream），成本就会越来越高。随着时间推移，如果你在一个完全脱节的开源项目中工作，你无法从社区中获得所有收益，你会失去金钱。另一个原因是，关于
    Linux 内核，是为了让 Windows Server 或任何地方的开源项目变得更好。问题在于，”伍德罗说……”


    ## Canonical 产品开发达斯汀·基兰德（Dustin Kirkland）


    你们与微软执行了哪些协作项目？


    我们与 Azure 团队密切合作，构建了一个非常优化的 Linux 内核，它提升了 Azure 环境中的性能。我们还将 Azure 作为微软 Kubernetes
    服务的基础。在另一方面，我们无法想象数百万 Windows 用户可以在他们的桌面上获得原生的 Ubuntu 体验，并通过 apt-get 访问 Ubuntu
    软件包。


    在 IoT 和连接设备方面，我们现在还说太多，但 2018 年将是 Ubuntu、服务器打包以及与微软更紧密整合的令人兴奋的一年。


