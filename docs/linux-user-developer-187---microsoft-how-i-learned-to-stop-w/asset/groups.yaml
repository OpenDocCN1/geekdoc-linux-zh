    \ custom scripts, one of which enables you to install software optimised for the\
    \ Pi. Since it's Debian-based, you can also use the command-line apt-get package\
    \ management system, or deapt for easier package management.\n\n### Desktop and\
    \ Usability\n\nOn first boot you'll have to enable it and then hook it up to a\
    \ hotspot before the desktop loads. With that, you can use custom tools to build\
    \ your installation. Besides pulling in software, custom tools are useful for\
    \ the usual sort of management tasks such as enhancing network services and removing\
    \ unwanted files.\n\n### Media playback\n\nIn terms of out-of-box support, DietPi\
    \ only includes a configuration utility for the JustBoom HAT audio. Once they're\
    \ installed the browsers play online, and you can install OMXPlayer from the repositories\
    \ for playing other media.\n\n### Overall\n\nA very useful distro for DIYers to\
    \ build their own installation. Its set of custom installation and management\
    \ scripts also makes it accessible to non-technical users.\n\n### Fedora Workstation\n\
    \nThe Raspberry Pi version is as bland and unexciting as its desktop release\n\
    \n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_81_1.png)\n\n- Make sure you read through\
    \ the installation and FAQ on the Fedora ARM wiki before you get started with\
    \ the distro.\n\n### Default software\n\nThe Pi version is an exact copy of the\
    \ desktop version, with the bare minimum of desktop apps. Firefox, LibreOffice,\
    \ Shotwell, Rhythmbox and even the Virtualboxitions app - which doesn't make sense\
    \ on the RPI. Like the main desktop version, it uses Gnome 3.26 with the new-look\
    \ settings window.\n\n### Package management\n\nJust after its setup, the graphical\
    \ interface from the distro uses Gnome Software or with the CLI you get the DNF\
    \ package manager. The repos, however, aren't fleshed out as Debian's - so for\
    \ example you won't find OMXPlayer there to have to complete from.\n\n### Desktop\
    \ and Usability\n\nUnlike Ubuntu Meta, Fedora launches a first-boot wizard to\
    \ create users. However, to use the onboard Wi-Fi working, you have to get a copy\
    \ of the firmware following the instructions on the docs. The docs also advise\
    \ you to manually resize the SD Card. After even all this, the Pi had trouble\
    \ keeping with Gnome.\n\n### Media playback\n\nThe lack of a featured video player\
    \ in the desktop and the repos is a real disappointment. The Rhythmbox plays flawlessly,\
    \ which is piped through HDMI to the TV. You can watch videos on YouTube, but\
    \ they don't play and aren't result as expected.\n\n### Overall\n\nAn exact replica\
    \ of the Fedora Release for the desktop, for the Raspberry Pi 3 comes up short\
    \ in terms of included apps and performance compared to its peers.\n\n### Raspbian\n\
    \nThe officially supported distro everything you deserve to honor\n\nA distro\
    \ designed for low-powered computers, overflowing with apps\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_82_0.png)\n\
    \nYou can run Raspbian's PIXEL desktop on a regular desktop PC, and it works wonderfully\
    \ well to resurrect an old workhorse\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_82_1.png)\n\
    \nIf you can't find what you're looking for in the app store, you can download\
    \ one of the popular software centres.\n\n### Default software\n\nThe default\
    \ software list is tailored for those who want to improve their programming skills.\
    \ There's Sonic Pi, Scratch 2, Minecraft, Serif, Emulator, Mathematics, Thorny,\
    \ Node-RED and Geany. For regular desktop there's the Chromium with the Flash\
    \ plug-in, LibreOffice, Clavis Mail and VNC Viewer.\n\n### Default software\n\n\
    The distro is topped off to the brim with apps. Besides the Raspberry Pi apps\
