- md: "\n## OpenSource Your source of Linux news & views\n\n## INTERVIEW RESIN.IO\n\
    \n## Pain-free Linux containers for IoT\n\nWe interview resin.io, the company\
    \ that started the resinOS software platform that helps developers build, deploy\
    \ and manage code running on connected devices.\n\n> Could you give us an overview\
    \ of what resin.io does as a company, for readers who haven't encountered you\
    \ before?\n\nResin.io is the person for the fleet owner. They have a lot of devices\
    \ and mobile servers—either industrial or something as simple as a Raspberry Pi.\
    \ They're out there in the field, for doing anything from a stable agriculture\
    \ project to a smart-building monitor, a smart meter or something as crazy as\
    \ a drone. We have a customer that uses underwater turbines off the coast of Australia.\
    \ It could literally be anything; it's a Linux container that's sitting out in\
    \ the field and needs to be managed.\n\nSo, essentially we take data centre technology—the\
    \ technology that we use to manage and update servers in a data centre—and use\
    \ it in a context where there is a less processing power, a lot of connectivity.\
    \ Everything is basically, outside. You don't even control the environment. It\
    \ could be hot or cold. Our data centre technology works out its context. People\
    \ can build these fleets of devices affordably rather than having to do them in\
    \ a way that is incredibly slow, prone to error, and so the alternative is to\
    \ do nothing.\n\nIs it true that you into containers working in rubbish cleanest?\n\
    \nOh yeah, that's a funny story there. In London there used to be built with recycling\
    \ units with screens and basically, we were the team that was running for that\
    \ company. And kind of how we started, well these were very powerful. They could\
    \ very much like servers, and we manage them out. But we just came across sorts\
    \ of problems where we would have to use keyboards and mice to open these things\
    \ up and refresh them. And we had to walk around a hundred separate places where\
    \ we had just these units, to make sure everything was working.\n\nI of kind instinctively\
    \ felt, these tools must exist. It can't be that if I'm working in a cloud, everything\
    \ is as easy as it is now. The moment I was back in the 1980s, it didn't make\
    \ intuitive sense to make sure. We looked and found out it didn't. So we said,\
    \ \"Okay then. That's what we can do.\"\n\nAt that time, Linux containers and\
    \ Docker were just starting. We found containers were so lightweight we were able\
    \ to push a lot of the cloud workflow and technologies to the embedded device.\
    \ Everybody, everybody thought that was a crazy idea. We didn't even understand\
    \ how Linux and embedded computers could be merged, not know how Linux containers\
    \ come into the picture.\n\n**Alexandros Marinos**\nThe Founder and CEO of resin.io\n\
    startup that brings to life deploying and deploying Linux containers as easy as\
    \ possible.\nThe company is: \"We make it work.\"\n\nHow do you deal with the\
    \ crazy side of things?\n\nTo begin with, there is an essential element to resin.io.\
    \ If you can't update what you can't trust. If you don't have an update, right\
    \ there is no way to update your system, then you only rely on what comes in the\
    \ Linux kernel, whether it's Heartbleed, a Krack, or...\n\nThe resin.io dashboard\
    \ is an API client for viewing detailed information about your devices.\n\n##\
    \ Meet the Beast\n\nResin.io has a company 'pet' called the Beast. This is an\
    \ in-house cluster platform for testing and deploying product updates. The latest\
    \ incarnation, version 3, has 336 Raspberry Pis and is designed as modular/computational\
    \ 'LEGO' so it can be expanded and power from each other.\n\nIn an early day,\
    \ you could touch the ripple and the others would go around; \"This is the kind\
    \ of deal we do too,\" said Marinos, \"Some kind of swarm behavior born of the\
    \ devices.\"\n\nInitially, resinio started building clusters. \"The first one,\
    \ it was, just three nodes. It was so small that I would go to offices and check\
    \ it, and then we'd start adding more and more. In 2014, we had a 120-device cluster,\"\
    \ said Marinos.\n\nHe says the Beast took 10 days to build with him and Shaun\
    \ Mulligan: \"Of course, the first one was really literally a beast. It was extremely\
    \ unwieldy to transport anywhere.\"\n\nSo they decided to use a modular setup:\
