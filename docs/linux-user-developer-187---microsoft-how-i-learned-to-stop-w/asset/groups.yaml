    \ $p; done | transform 's/\\.$(EXT)$//');\ntest -d \"$(DESTDIR)\" || exit 1\n\
    cd $(DESTDIR) && rm -f \"$files\"\ncd -\ntest -f $(BIN PROGRAMS) | echo.\nclean-BIN_PROGRAMS:\n\
    test -f $(BIN PROGRAMS) | rm -f $(BIN PROGRAMS)\nclean-CHECK_PROGRAMS:\ntest -f\
    \ $(CHECK PROGRAMS) | rm -f $(CHECK PROGRAMS)\nloadings(EXTRA_LIBS):\ntest -f\
    \ $(EXTRA_LIBS) | load. $(EXTRA_LIBS)\nload -V $(EXTRA_LIBS)\ntest -f $(LIBS)\
