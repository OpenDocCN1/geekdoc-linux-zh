    # OPINION


    ## The philosophy of Solus


    As the independent Linux desktop OS reaches version 4, Joshua Strobi reveals what
    is driving the story''s development and the new features users can look forward
    to.


    For anyone unfamiliar with Solus, it''s a Linux-based operating system from Intel,
    balancing the stability of the system with our users'' needs for the latest software
    and a rolling release system.


    Solus ships with Bud desktop environment with a traditional approach, offering
    a wide variety of choice to make it your own. Additionally, we make available
    GNOME and MATE desktops out-of-the-box, such as XFCE. But Solus is more than just
    an operating system. If you haven''t checked it out, here are some very good reasons
    why you should:


    Its vision for improving the independent Linux desktop OS empowers us to deliver
    solutions to real-world problems. We''ve developed solutions for simplifying driver
    management. We''ve engaged with the open source community, to enable developers
    to focus on what their apps do rather than the complexities of shipping them.
    We''ve pioneered solutions for the installation of Snaps with custom runtime integration.


    Our upcoming Solus 4, which should be available when you read this, is the embodiment
    of our belief that a truly desktop computing experience is achieved when integration.
    Solus 4 will ship with a refined Budget, with the introduction of window managers
    like Openbox and i3, and the MATE edition will see fresh visual improvements to
    the Menu. However, the biggest changes are under the bonnet. For starters, we
    are using Snaps to improve the installation and management of a curated set of
    third-party applications. The addition of Snaps enables us with the ability to
    easily install software that may not be accessible via our existing repository.


    Solus 4 is also set to be the first release to include Sense, our new system interface
    with a unified approach for configuring the system management. Sense provides
    a fail-safe binary to update issues and bring their system back to full health.
    With the new system configuration interface we''ve developed a ''Quality of Life''
    assistant, named Sophie. This handles the lifting of the rolling Linux operating
    system, such as administrative updates, and problems that occur often can be completed
    with ease. Sophie allows user groups to enable new features or functionality that
    would otherwise require manual intervention.


    In essence, the capabilities of Sense and snaps not only empower us to improve
    the user experience, but also give our users the means to keep their system running.


    If we''ve piqued your interest, you can download Solus today or keep track of
    development at https://solus-project.com. Give it a look and let us know what
    you think - your feedback matters.


    Joshua Strobi is communications manager for the Solus project, not a dog owner
    and developer.


