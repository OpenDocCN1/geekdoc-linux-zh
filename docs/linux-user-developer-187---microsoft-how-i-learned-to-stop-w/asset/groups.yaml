    ## 橙莓派 2G-IOT


    Orange Pi 2G-IOT（11英镑）是一款类似于树莓派的板，但与大多数产品的区别在于它没有 HDMI 端口。相反，它能够像手机一样运行 Android。不过，主要的区别在于它的蜂窝接口支持
    2G 和 SIM 卡。它还支持 Wi-Fi 和蓝牙。


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_65_1.png)


    ## IoT 开发板


    物联网（IoT）是一个主要的增长领域，并不缺少足够的单板计算机（SBC）来满足这一需求。


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_65_2.png)


    - Adafruit Feather FONA

    - Particle

    - 橙莓派 2G-IOT


    ## Adafruit Feather FONA


    Adafruit Feather FONA (F506) 是支持 2G 的 Arduino 模块。与大多数类似产品一样，您需要添加 SIM 卡、外部天线和电池才能使其工作。对于离网应用来说，它比廉价手机要多功能得多。


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_65_3.png)


    物联网（IoT）由“物”组成，而不是计算机，这些物连接到互联网并始终可以通过 Web 访问。其范围从复杂的设备，例如监测环境的传感器。在未来的几年里，IoT
    传感器将用于实现预警系统、监控和控制。


    > 小贴士 接收不到信号？


    > 在在偏远地区涉及 IoT 设备的项目之前，请检查网络覆盖情况。移动网络覆盖在许多农村（甚至是非农村地区）也会变差。


    许多单板计算机被用于 IoT 场景，这引发了人们对每块板子相对于其他单板计算机提供什么功能的疑问。由于应用广泛，没有统一的答案。从对物联网的惊人预测来看，显然对于某些应用，低功耗和小型化是至关重要的，许多廉价板子非常适合此类环境传感应用。大多数类树莓派的板带有以太网端口或
    WiFi 等无线接口，可以作为 Arduino 类设备的扩展使用。对于位于具有 Wi-Fi 或有线回传的建筑内的设备，设备可以访问网络。


    在偏远地区，我们需要可以通过手机网络连接到网络的板子。虽然手机可能不够，或者由于电源需求，内置移动单元电路的单板计算机可以胜任。对于大多数 IoT 应用来说，高速并不是需求，因此不需要追求最新的
    4G 设计——大多数板提供 3G 或 2G (GSM)。在投资之前，务必检查您所在国家的 2G 网络！


    对于其他应用，长时间无人值是必须的，因此低功耗——结合板进入深度睡眠模式的能力——至关重要。许多类 Arduino 的板提供此功能。然而，我们专注于能够让
    IoT 设备位于偏远地区的功能，这对许多人来说是一个关键特性。


    ## Particle 3G


    Particle 3G（约 52 英镑）是一个小型的 52mm 微控制器，带有 ARM Cortex-M3 微处理器、大量的闪存以及 3G 连接功能。与其他蜂窝单元不同，它自带
    SIM 卡和流量套餐，并带有一个扩展模块插拔系统。


