    ### CrossOver 17 在 Linux 上运行 Office 2016


    世界顶级超级计算机由于闭源软件太慢


    某些依赖于某些


    量子力学、预报、气候、科学建模——超级计算机的用户列表层出不穷。这并不意外，这些系统在 Microsoft Windows 上运行并不顺畅。


    你熟悉的操作系统，


    - 5 个 Ubuntu

    - 20 台超级计算机 RedHat Enterprise Linux (RHEL)

    - 10 台超级计算机 RedCent''s


    过去几年里，Linux 越来越多地占据了超级计算机列表的主导，根据 Open Group 的说法，每一个设备都在运行 Linux。遗憾的是，这些并不是标准发行版；而是高度定制的
    Linux 版本。


    有趣的是最快的 Tauraku-Chi：这台定制机器拥有 600,000 个 CPU，组合速度达到 93 petaflops，相当于两百万个节点。第 16
    个能效最高的超级计算机 Taiuhget-light 运行名为 Raisei-OSC 的 Linux 版本，带有其自定义的 OpenMPI 2.0 实现。


    评估这些计算机是一个基准测试的问题


    尚不知道 Linux 在超级计算机领域的绝对统治地位是否会持续。微软的反击似乎是可能的……


