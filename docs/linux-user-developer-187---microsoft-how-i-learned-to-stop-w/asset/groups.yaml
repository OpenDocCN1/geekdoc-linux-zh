    \ $(OBJECT_FILES)\ngcc -o player $(OBJECT_FILES)\n```\n\nNotice that we reference\
    \ variables using a dollar sign and square brackets. If we used shell scripting,\
    \ this might look a bit strange, since shell-scripting uses $ for variables. To\
    \ get the output of the program, the fact that we can put spaces around the equals\
    \ sign when writing to a variable is another difference from shell scripting.\
    \ It is important to remember that this is not shell scripting, and although it\
    \ looks similar, it may have different syntax rules.\n\nRules, in fact, are written\
    \ in shell scripting.\n\n# Globs and substitution\n\nMake supports exactly the\
    \ same functionality as shell. For example, if we use\n\n+   * *.o\n\nin the definition\
    \ of a rule, it will expand to give the list of .o files in the directory containing\
    \ the Makefile.\n\nOne thing might try be to replace the list of .o files with\
    \ *.c\n\nThis works because the makefile contains exactly the object files that\
    \ we need. But if we define the DIR_variable, *.o will expand to the list of .o\
    \ files in the directory containing the makefile.\n\nOne possible solution to\
    \ this problem is substitution. We should not rely on the rule that *.o files\
    \ are always present; instead, we need to declare a pattern for the objects. Then\
    \ we can rely on the source .c files. If they are detected, then we have no hope\
    \ of compiling the program as is. One solution is to declare that the object files\
    \ are the same as the source C files, but with the extension .c changed to .o.\n\
    \nFor this, we will use the Make pattern. If we write the following:\n\n```\n\
    OBJECT_FILES = $(pattern %c,%o) $(wildcard *.c)\n```\n\nThen Make will populate\
    \ the OBJECT_FILES with the names of the C files from the first as .c changed\
    \ to .o.\n\nThere are a few parts to this logic. First, the order of patterns\
    \ and wildcard. In order to call a function in Make, we use the same $(...) syntax\
