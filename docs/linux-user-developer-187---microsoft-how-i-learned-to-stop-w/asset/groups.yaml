    # 计算机安全


    ## 在代码中使用来自受信任源的可靠利用程序


    学习如何在你的渗透测试中寻找、修改和使用被认为可靠的利用程序（exploits）。


    是否存在所谓的可靠利用程序？嗯，如果你熟悉传统的“七阶段渗透测试任务”定义，你可能知道，执行利用阶段（exploitation）和后渗透阶段（post-exploitation）就像在流沙上上玩杂耍。起初没有检测到漏洞是一种幸运，但你将需要执行一些利用程序。即使你有自己的工具，某些系统崩溃最终仍会打在你脸上。


    实际上，可能有，也可能。而且，当然，对于那些致力于阅读和寻找方法的人来说，可能存在。但记住，这不像数学；无数的惊喜可能在任何时刻消失。但如果你验证了来自不可靠来源的利用程序或概念证明（PoC），你理应该怀疑它们。


    ## 利用程序数据库 (Exploit Database)


    利用程序数据库（E-DB, [Resources]）由 Offensive Security 维护——他们是杀掉 Linux 的人——这是一个利用程序和 Shell
    代码（shell-code）的惊人来源。它还托管了黑客数据库（GHDB）。E-DB 易于导航，无论是在线查看还是使用他们的搜索脚本。


    那么真的有人吗？对于那些反复测试自己利用程序的人来说，可能存在。对于那些使用带有经过验证的利用程序的定义利用框架的人，对于那些在利用程序中拥有特定类型 Shell
