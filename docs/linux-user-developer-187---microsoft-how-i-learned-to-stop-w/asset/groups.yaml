    Raspian 的所有功能以及更多。它是作为桌面使用的工作量最少的。我们不得不对树莓派的配置文本进行调整以让声音通过 HDMI 传输，并将 VLC 替换为
    OMXPlayer 的图形化界面。但这就是在树莓派 3 上使用 Ubuntu Mate 所需的一切。考虑到，Ubuntu Mate 对于树莓派来说是中心化的设置，是一个即用的发行版。它不需要仓库，在很多情况下可以直接使用。


