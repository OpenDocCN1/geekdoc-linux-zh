    摄像头: 720p 网络 (80fps)


    简单来说，Google Pixelbook 是迄今为止制作最好的 Chromebook：欢迎来到重新构的 Chromebook 世界。然而，想要站在这场革命的风口需要付出不小的代价。Google
    Pixelbook 在其价格（$999）范围内制作极其精良，最高售价 £1,699 ($1,640) —— 即使不包含售价 $1,699 ($999) 的
    Pixelbook Pen，这依然是物超所值的顶级硬件。


    为此，在 128GB 入门版和 £1,199 的 256GB 中端选项中，你都拥有了第 7 代 Lake Intel Core i5 处理器，每个版本配有
    8GB 内存。然而，顶配 Pixelbook 选项配备了 Core i7 处理器和 16GB 内存。所有处理器选项都是 Intel 的低功耗、散热良好的 Y
    系列芯片，因此所有型号都完美无缺。可以说，这是 Google 迄为止最精准、构思最周密的设备。无缝的框架、橡胶材质的掌托和底部，每一个设计元素都实现了风格与内涵的平衡。好吧，几乎如此：Google
    学会了键盘的设计，但机身薄得惊人。好的是，玻璃触控板的使用体验极佳，在单触和多触手势下的追踪都超级平滑且准确。同样，Pixelbook 是我们测试过的最好的设备之一。平板键盘的按键间距良好，0.8mm
    的层深提供了极佳的反馈。


    重量: 1.1kg

    尺寸: 290.22x208.4x12.7 mm


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_86_0.png)

    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_86_1.png)

    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_86_2.png)

    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_86_3.png)


    > Pixelbook 的核心特性是它支持 Android 应用程序以及 Google Play


    凭借 225-ppi (ppi) 和色彩还原能力，Pixelbook 的显示屏可以与一些顶级产品竞争，例如 227-ppi 的 MacBook Pro (13
    英寸)。面板在处理电影和照片方面表现良好，但在视频编辑时略显吃力；此外，它有些反光，因此难以触摸。无论如何，它在直射阳光下的表现并不理想。


    虽然包装盒内不包含 Pixelbook Pen，但它是体验的一个很好的加分。这支笔作为手写笔表现出色，在屏幕上绘图时提供了丰富的压力感应和倾斜支持。它有一个用于调用
    Google Assistant 的快捷键，该功能还整合了手机中一些新的 Google Lens 技术，例如搜索即选择、在屏幕上圈选以从 Google Assistant
    获取结果。我们画了一个《办公室空间》中 Ron Livingston 的圆圈，Google Assistant 真的画出了一个像 Jim Gibbons 的角色——在此之前向我们介绍了这位演员。不过，Pixelbook
    Pen 的一个主要缺陷是它无法以任何方式吸附在笔记本电脑上。它还使用 AAA 电池，在这个价位下，我们本期待是充电解决方案。


    出乎意料的是，Pixelbook 是一款性能强大的设备，可以通过 Chrome 浏览器毫无压力地处理各种工作负载。从 Google 文档、电子表格到聊天和照片编辑——Google
    承诺单次充电可用长达 10 小时。在我们的测试中，在 1080p 分辨率、50% 亮度下，电池持续了 9 小时 15 分钟，但 Pixelbook 持续了
    7 小时 40 分钟。我们那从不靠谱的电池坚持了 7 小时 40 分钟。


