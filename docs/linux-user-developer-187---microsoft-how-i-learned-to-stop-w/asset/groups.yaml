  mdcn: "\n\n# 教程\n\n# MQTT\n\n## 可行连接\n\n通常使用 USB 连接到目标设备的开发者会发现调试是一项耗力的工作。最重要的一点是重新与目标建立连接。如果你的安卓设备进入休眠或断开连接，你应该准备好重新输入命令。\n\
    \n数据被传输，因为此类状态数据对系统具有重要意义。发送服务质量为 1（QoS）的消息可以确保消息至少送达一次，并且消息可能会被接收多次。为了实现这一点，客户端会发送到一个已发布的消息，然后客户端停止进一步的传输尝试。然而，消息并不一定会丢失。将\
    \ QoS 设置为 2 需要更多的努力，但它能确保消息恰好送达一次。它实现了 MQTT 中引入的交换机制，客户端必须接受额外的交换以确保实际消息送达。\n\n\
    ```xml\n<uses-permission android:name=\"android.permission.INTERNET\" />\n<application>\n\
    <uses-library android:name=\"com.google.android\" />\n<service android:name=\"\
    org.eclipse.paho.service.MqttService\" />\n```\n\n不熟悉 Android 的开发者可以轻松实现——在这里，仅仅实现一个服务就已经足够困难了，PAHO\
    \ 团队为我们完成了这些工作。你创建一个 `MqttClient` 类型的成员并连接到服务器。你的变量必须定义为\n\n```java\n@Override\n\
    protected void onCreate(Bundle savedInstanceState) {\n    setContentView(R.layout.activity_main);\n\
    \    MqttClient mqttClient = new MqttClient(\"tcp://127.0.0.1:1883\", \"Client\"\
    );\n```\n\nMQTT 领域一个有趣的问题是一种服务质量，当接收者通过代理使用某种服务质量进行订阅时。在这种情况下，QoS 等级确保了最高质量，而向单个客户端的实际交付则是由其请求所需的\
    \ QoS 等级完成的。\n\n充分利用 Android 应用需要一些选择。首先必须决定一组成员，以便客户端能够与互联网以及系统的其他敏感部分交互。\n\n\
    其次，我们还声明了一个服务；这是操作系统的一个特殊部分，允许我们在后台执行各种操作。\n\n构造函数不接受主机、端口的参数，信息是手动编码的，这导致了结果。下一步是进行实际配置。启用自动重连让我们留下了网络服务。\n\
    \n```xml\n<xml version=\"1.0\" encoding=\"utf-8\">\n<manifest xmlns:android=\"\
    http://schemas.android.com/apk/res/android\">\n<package android:name=\"com.tamgom.futureqtt\"\
    >\n<uses-permission android:name=\"android.permission.INTERNET\" />\n<uses-permission\
    \ android:name=\"android.permission.EXTERNAL_STORAGE\" />\n<uses-permission android:name=\"\
    android.permission.NETWORK_STATE\" />\n<uses-permission android:name=\"android.permission.EXTERNAL_STORAGE\"\
    \ />\n```\n\n```java\nMqttConnectOptions mqttConnectOptions = new MqttConnectOptions();\n\
    mqttConnectOptions.setAutomaticReconnect(true);\nmqttConnectOptions.setCleanSession(false);\n\
    mqttClient.connect(mqttConnectOptions);\nmqttClient.setCallback(new MqttCallback()\
    \ {\n@Override\npublic void connectSuccess(IMqttToken token) {\n    DisconnectedBufferOptions\
    \ disconnectedBufferOptions = new DisconnectedBufferOptions();\n    disconnectedBufferOptions.setBufferSize(1024);\n\
    \    disconnectedBufferOptions.setPersistBuffer(false);\n    disconnectedBufferOptions.setOldestMessages(false);\n\
    \    mqttClient.setBufferOptions(disconnectedBufferOptions);\n    Log.e(\"Future\"\
    , \"Link\n@Override\n```\n\n# 选择表单和最低 SDK\n\n# 图 2\n\n| 手机和平板 |\n| :--- |\n| API\
    \ 26: Android 8.0 (Oreo) |\n| 通过目标为 API 26 及以上版本，你的应用将在 +1% 的设备上运行。[帮助我了解](#)\
    \ |\n| 安卓安装应用支持 |\n| 可穿戴设备 |\n| API 25: Android 7.1 (Nougat) |\n| TV |\n| API\
    \ 21: Android 5.0 (Lollipop) |\n| Android Auto |\n| API 26: Android 8.0 (Oreo)\
    \ |\n\n# 连接名称：有线连接\n\n# 图 3\n\n| 通用 | 以太网 | 802.1x | IPv4 设置 | IPv6 设置 |\n| :---\
    \ | :--- | :--- | :--- | :--- |\n| 方法：与其他用户共享 |\n\n```java\npublic void onFailure(IMqttAsyncToken\
    \ asyncToken, Throwable exception) { Log.e(\"Future\", \"Link fail!\");\n```\n\
    });\n```\n\n我们程序的第二部分侧重于建立连接。`connect` 方法接收一个连接对象和一个事件监听器，监听器会在登录过程中被调用。该方法特别重要，因为它负责设置缓存对象。它是\
    \ `DisconnectBufferOptions` 类型，并处理连接到 IP 地址是否正确以及运行程序。如果一切正确，它将连接到你工作站上的 Mosquitto\
    \ 服务器并发出一个。\n\n新的基础链接问题已解决，即建立消息的问题。打开 Mosquitto 代理，并建立了许多主题用于传输不同级别的消息。鉴于我们有几个按钮大多在做相同的事情，现在是时候看看\
    \ Android 的旧方法了。`ViewOnClickListener` 不一定非要创建为成员变量；可以在类中实现一个监听器，并使用变量参数（指示负责处理的对象）来触发事件。构造函数中的设置变得简洁明了：\n\
    \n```java\npublic void onButton0Click(View view) {\n  idMqtt0.setText(R.id.textView0);\n\
    \  button0.setOnClickListener(this);\n  idMqtt0.subscribe(\"topic0\");\n}\npublic\
    \ void onButton1Click(View view) {\n  idMqtt1.setText(R.id.textView1);\n  button1.setOnClickListener(this);\n\
    \  idMqtt1.subscribe(\"topic1\");\n}\npublic void onButton2Click(View view) {\n\
    \  idMqtt2.setText(R.id.textView2);\n  button2.setOnClickListener(this);\n  idMqtt2.disconnect();\n\
    }\npublic void onButton3Click(View view) {\n  idMqtt3.setText(R.id.textView3);\n\
    \  button3.setOnClickListener(this);\n  idMqtt3.connect();\n}\n```\n\n实际发送消息并不困难。我们的第一个处理程序通过分析它们来确定服务质量，然后显示\
    \ Java 语言所需的步骤：\n\n> @Override\n\n# 在理论上，你可以使用树莓派的 Wi-Fi 传输器。但从经验来看，这是一个极其糟糕的调试方式\n\
    \n```java\npublic void onClick(View view) {\n  int myQos;\n  if(view==cmdos0)myQos=0;\n\
    \  else if(view==cmdos1)myQos=1;\n  else\n  try {\n    MqttMessage message = new\
    \ MqttMessage();\n    message.setQos(myQos);\n    message.setPayload(\"Hello Raspberry!\"\
    );\n  } catch (MqttException e) {\n    System.out.println(\"Error: \" + e.getMessage());\n\
    \    e.printStackTrace();\n  }\n}\n```\n\n上述 Ubuntu 也可以充当 DHCP 服务器\n\n点击“调试”按钮更改树莓派的示例版本示例。对于第一次测试，点击\
    \ mosquitto 命令行中的一个按钮——消息将会出现。你当然也考虑了我们上期期的程序。下一步是测试服务质量功能。为此，断开树莓派的网线并多次点击服务质量按钮。最后，重新连接网线；命令行将填充所有事件。你可以在插上网线几分钟后点击服务质量\
    \ 0 按钮来验证连接成功。离线期间发送的消息将继续传输。如果在离线阶段使用了任何 QoS，消息将在重新连接后显示。请记住，这不是瞬时过程。PAHO 实施了退避策略：如果连接建立，将计划一个短的等待时间。如果连接仍然失败，时间将翻倍到两秒。此过程将重复，直到达到两分钟的最限，然后被视为最大值。因此，如果插上网线后几秒钟消息才出现在命令行中，不要惊讶。虽然树莓派是一个很好的嵌入式系统，但它既不是最便宜的最小的，所以本功能的后续部分将向你介绍\
    \ ESP32\n\nwww.linuxuker.com 43\n\n"
