    # Fedora 27


    Is the first Fedora release since Ubuntu switch to GNOME still the GNOME distribution?


    Fedora''s well-oiled release machinery has spurted out another update. To keep
    things lively, the project has to hop on the bandwagon of mainline distributions
    that still support the 32-bit platform.


    Besides this minor detail, it''s pretty business as usual. The distro ships with
    a Fedora-branded but largely untouched variant of the stable GNOME 3.26 desktop
    environment. GNOME''s improvements for Wayland support, minor improvements are
    apparent.


