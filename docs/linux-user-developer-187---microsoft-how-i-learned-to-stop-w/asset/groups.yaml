    # Install LineageOS


    Got an old, badly updated phone? Revive it with a fresh, clean, open version of
    the Google mobile OS


    For not nothing do people often say that money changes everything. In the case
    of super-popular Android OS Cyanogenmod, money changed its parent''s philosophy,
    changed its direction from one of free software to one of commercial software,
    licensing the code base and project leader, and an eventual lack of money to Cyanogen
    Inc, cutting back drastically on its operations and crowd supporting for Cyanogenmod.
    It also led to the community, which had been invaded in its development, snatching
    its baby and resisting.


    Thus we have replaced Cyanogenmod, and its facto open-source successor, LineageOS
    - developed by that community with large contributions from the original Cyanogen
    project leader, Steve Kic. The name has changed - blame the trademark trademark
    - the version, 14.1 LineageOS''s first release was built directly from Cyanogen,
    and the codebase has barely changed.


    Before we explore how, let''s look at why people want to control their phone,
    and tinker with theirs. Not just from Android because its feels like tinting Google''s
    mobile OS; updates have made the OS which could mean you enjoy better battery
    life, more privacy, and much less of the bloat that people store phone forever.
    It''s developed by people who love their phones and want better from them:


    Installing LineageOS over Android has disadvantages, though Google has implemented
    a system called SafetyNet on Play, which enables developers to check if a device
    is in a ''known good'' state. LineageOS has wisely chosen not to document this
    check, which means you might find certain areas unavailable through traditional
    channels. There are generally workarounds for this - search the web for ''apks''
    if you want to install items using the Google Play Store.


    Installing LineageOS means you need a compatible phone or tablet, and the reliable
    way to connect to your PC. Check it out at https://lineageos.org/devices if you
    have a reasonably modern handset, you should be able to change your phone without
    a problem, although not having to jump to a lower version of Android that is supported
    by your device. Older devices are more or less left out in the cold, but you might
    be able to use the tips in this guide to install old Cyanogenmod.


