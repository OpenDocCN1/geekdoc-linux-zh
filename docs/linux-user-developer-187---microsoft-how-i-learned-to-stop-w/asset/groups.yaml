    # # Raspberry Pi everyday distros


    In addition to powering all kinds of embedded distros, you can use the cheeky
    little computer as an everyday desktop, with the help of these Linux distributions


    **DietPi**

    An extremely stripped-down version of Debian, DietPi ships with just enough operating
    system (OS) to enable you to build and customise your installation from scratch.
    The distro is heaven of very useful scripts to help simplify this task.

    **www.dietpi.com*


    **Fedora Workstation**

    Starting with Fedora 25, the leading RPM-based distro now supports the ARM and
    can run on Raspberry Pi 2 and 3. As with the distro it offers a minimal edition
    several for the Pi.

    **arm.fedoraproject.org*


    **Raspberryian**

    Inaugurably the most popular Debian based distro for the Raspberry Pi. The only
    distro in this group that''s officially supported by the Raspberry Pi Foundation,
    released as a standalone download as well as part of the NOOBS installer.

    **www.raspberry.org*


    **Ubuntu Mate**

    Tuned for the Raspberry Pi, Ubuntu Mate brings the benefits of the Ubuntu desktop
    environment and an Ubuntu base to the ARM architecture platform. The ARM edition
    can run on Raspberry Pi 2, like Peach Pi, is based on Ubuntu''s 14.04 LTS release.

    **https://ubuntu-mate.org*


