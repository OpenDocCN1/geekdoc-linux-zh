  mdcn: "\n\n# 教程\n\n# Arduino\n\n第一部分\n\n## 使用 Arduino 制作一个录音机和播放器\n\n在本系列教程的第一部分，我们将学习如何录制音频、将其保存到磁盘并进行播放。\n\
    \n**在之前的教程中，我们为居家制作了一些小众设备，但没有任何理由说明我们不能使用 Arduino 来开发现实世界中的产品。** 微控制器可以为家用昆虫、控制器和电脑键盘等设备提供动力，而这些设备的动力成本和功耗会太高。在这个包含两个部分的教程中，我们将构建一些应用，创建一些电路并制作一个成品：一个大致等同于录音机（Dictaphone）的设备。\n\
    \n我们将麦克风连接到 Arduino 以将声音保存为数据。然后，我们将构建一个小型电路（仅使用电阻）将 5V 数字信号转换为模拟信号，这样声音就能从我们的耳机中播放出来。我们还将讨论提高输入和输出音频质量的方法。在教程的第二部分中，我们将添加按钮和\
    \ LCD 显示屏，以便用户循环切换播放存储的音目、开始新录音并删除旧录音。\n\n## 连接麦克风\n\n在本教程中，通过获取一个电容麦克风并将其连接到\
    \ Arduino，我们将使用模拟输入引脚和 Adafruit 麦克风模块（该模块会为我们处理放大和降噪）。然而，额外的电路相对简单，如果你想从零件开始构建整个电路，购买任何麦克风都会比自己制作便宜。\n\
    \nAdafruit 麦克风不带有坚固的输入和输出引脚 - 因此你需要进行一些焊接以创建可靠的连接。不要尝试巧妙地绑电线来创建牢固连接，对于这种敏感的模拟电路是不行的，相信我们。确实，只需买几个排针，焊接到麦克风板上，然后在引脚上添加跳线。这些引脚应该连接到\
