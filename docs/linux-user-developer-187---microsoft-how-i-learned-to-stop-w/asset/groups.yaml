    # 开源


    06 新闻与观点 | 10 字母 | 12 访谈 | 16 内核


    ## 硬件


    ### Linux 硬件零售商抛弃 Intel


    System76、Purism 等公司在安全警告后从计算机中剔除 Intel ME


    已证实英特尔管理引擎（ME）对运行 Linux、Windows 和 macOS 的计算机构成活动风险，这不仅通过概念验证得到证实，还导致了针对 Linux
    设备制造商（OEM）的果断行动。


    除了保留对关机系统某些部分（包括网络）的访问外，它现在暴露了 ME 中的缺陷可以被利用以执行任意代码。Positive Technologies 的研究人员
    Mark Emolov 和 Maxim Gorbachev 在 2017 年欧洲黑帽大会上展示了这一事件，该事件可以绕过已建立的 ME 保护机制。目前，该漏洞只能由具有物理访问权限的攻击者使用，但这种情况可能会发生变化。遗憾的是，英特尔推出的补丁程序并没有解决这一漏洞。


    处理此漏洞的唯一方法是英特尔停止提供带有 ME 的处理器，并将其完全禁用。


    由于已经意识到 ME 中存在安全漏洞的可能，几家 Linux 设备制造商已采取措施禁用了它。据称，英特尔在第 6、7 和 8 代 Intel 笔记本电脑上发布了启用了
    ME 的更新固件，“在交付更新固件和禁用 ME 之前，我们进行了大量的测试和验证：这将减少未来的漏洞，我们的新固件交付手段可以更快发布并获得更高的采用率。”


    System76 需要使用 Ubuntu 16.04 LTS、Ubuntu 17.04、Ubuntu 17.10、Pop!_OS 17.10 或 Ubuntu
    派生版并安装 ME 驱动程序，才能接收禁用 ME 的固件。


    上述许多 Linux 系统制造商现在正在禁用英特尔的管理引擎。


    同时，专注于安全的 OEM Purism 也采取了果断行动。事实上，这些步骤是在英特尔 2017 年 11 月公开披露之前采取的，Ian Yousseau
    在博客博文中写道：“我们的第二代笔记本电脑将不再有 Intel Skylake 漏洞，并将默认安装并禁用英特尔管理引擎。”这使得 Purism 成为首创。进一步说明这一点，Purism
    首席执行官 Todd Webber 他的公司表示：“英特尔管理引擎多年来一直是理论上的最坏情况利用。Purism 一直担心 CPU 中包含 ME，因此在 2016
    年选择了无 ME 设计，在 2017 年对 ME 的部分内容进行了反向工程，并与他人合作。”


    信息很明确：在英特尔移除 ME 功能之前，用户必须自己完成这项工作。


    ### ARM 设备上的 Vivaldi 浏览器启动器


    首先命中树莓派，其他单板机和 Android 将随其后


    由前 Opera 创始人 John Johansson von Techner  ways Vivaldi Technologies 已推出了其 Vivaldi
    浏览器的 ARM 版本，树莓派 2 和 3 型号应在 ARMv7 架构上运行，例如树莓派的高级标签管理器可能会遇到性能延迟。


    “寻找功能丰富且灵活浏览器的疯狂树莓派用户会发现 Vivaldi 是一种令人兴奋的体验，”von Techner 说，“除了树莓派，其他单板计算机（SBC）也是目标。令人惊讶的是，它并不打算在
    Android 设备上发布。”


    最初是一个实验性版本，Vivaldi ARM 设备包含了大部分 ARMv64 版本，例如高级标签管理器和去重浏览历史。


    “Vivaldi 是网络爱好者的完整工具包，你可以对其进行个性化并为自己所有。我们希望为蓬勃发展的电脑爱好者文化增加更多自由，并希望每个树莓派用户都能使用
    Vivaldi，”von Techner 在接受 LU 采访时解释了他为什么他的团队决定扩大 Vivaldi 的覆盖范围，“这是一个很棒的事情。我们是一家发现问题并解决的公司，我们希望在设备上支持
    Linux。”


    Vivaldi 正变得非常流行。其他浏览器的扩展开发者一直试图取代它们——Vivaldi 将如何将这些功能融入浏览器呢？”von Techner 问，“我们的使命是，对于浏览器的基本功能，你不必担心。对我们来说，标签处理是一个基本需求。”


    然而，普通读者可能会发现 Vivaldi 不是开源代码，这可能会影响你的决定。Vival迪 表示：“代码并未在统一的开源许可协议下提供，我们向我们提供了部分代码，其中我们对
    HTML/CSS UI 进行了更改。对 Chromium 源码的所有更改均根据 BSD 许可证提供，任何人都可以在 vivaldi.com/source 上阅读。”


