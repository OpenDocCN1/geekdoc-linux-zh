    如果你不熟悉树莓派系列，下方提供了当前开发板的对比。由于我们深入研究了这些产品，我们的重点中有很多树莓派类产品，因此我们使用了一个对比表（不包括 LU&D
    的顶级推荐）。


    在规格方面，从 Zero 到 Pi 3 的对比范围——尽管差异在图中没有完全体现，但真的可以说它们非常接近，而其他产品则是根据其功能进行设计的。有些产品不仅仅是树莓派类的，而且采用了相同的
    GPIO 引脚，这如果你想适配现有项目（板）或已经为树莓派板设计或构建了内容是非常重要的。像 Asus Tinker 这样的板不仅保持了与树莓派的兼容性，还根据功能进行了巧妙的改进。在购买任何第三方
    SBC 之前，硬件兼容性是重要的。如果性能很诱人，购买超过所需的性能并不是一个好主意，因为这意味着要在寻找树莓派产品的差异上花费更长的时间。对于大多数应用，第三方产品提供的性能将不会被注意到。


    > 小贴士：我们将开发板称为“树莓派类”，而不是“树莓派兼容”。对于应用，在购买任何第三方产品之前，使用相同的 GPIO 输出是一个限制因素。在其他情况下，通过突破边界和接受一些新的树莓派类产品可能会获益，我们无法找到与硬件兼容的板。尽管未来会有变化，树莓派产品在社区建议、灵感和计划方面仍然是最好的。


    www.linuxuser.co.uk 61


    # 单板计算机


    # LU&D 顶级推荐


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_61_0.png)


    ## Adafruit Trinket M0


    Adafruit Trinket M0 (£7.50）最注目的特征是尽管它拥有高端 CPU 但如此微小。然而，你为此付出的代价是有限的接口能力。模拟 I/O、PWM
    和串口端口与五个数字 I/O 共享用引脚。


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_61_1.png)


    ## Espruino Pico


    Espruino Pico (£23) 是类 Arduino 的而不是 Arduino 兼容的。它是一个 USB 棒，你可以将其插入 PC 的 USB 接口，通过
    JavaScript 使用 IDE，并转换 I/O 以兼容 Arduino 扩展板。


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_61_2.png)


    ## Adafruit Metro M0


    Metro M0 (£23.50) 显示了你如何通过第三方衍生品花钱获得更多。虽然硬件非常出色，但你获得了一个更快的处理器，关键是，以比 Arduino Uno
    稍低的价格获得了更多的内存和闪存。


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_61_3.png)


    ## 类 Arduino 开发板


    如果你的应用需要与现实世界的硬件接口，类 Arduino 板是一个强有力的竞争者


    - Adafruit Metro M0

    - Espruino Pico

    - Teensy CL

    - DFRobot µHex

    - SparkFun Pro Micro


    > 在我遇到类 Arduino 板之前，它们可能看起来像某种神秘物，所以让我们设定一下。首先，这些板是为嵌入式应用设计的，它们不运行操作系统，只有极少数例外。所以，如果树莓派在你开启电源时启动操作系统，像
    Arduino 这样的板也会这样做——它的行为完全取决于它的闪存。因为没有操作系统，代码必须在 PC 上开发并上传到 SBC。这对于嵌入式应用运行良好；如果你的角色是使用运行操作系统的树莓派等板来编写代码。


    这是因为操作系统对于简单应用来说可能是一个巨大的开销；如果你不需要操作系统，可以使用较弱的硬件。所以，如果你看到一个带有 16MHz 处理器的 Arduino
    板，不要跳到认为它是 1.2GHz 芯片树莓派劣等品的结论。虽然慢的处理器并不更好，但低成本平台用于嵌入式应用确实有潜力。因此，虽然操作系统需要一些时间启动才能运行嵌入式应用，没有这种开销的板在通电后就可以启动。


    Arduino 是开源硬件，这意味着公司可以合法生产其设计产品的克隆或衍生品。


