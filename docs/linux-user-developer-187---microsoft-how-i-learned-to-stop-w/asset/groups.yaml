    ## 微软特写


    微软在 1998 年根据《Netscape 公共许可》和 Mozilla 项目发布了其 Netscape Communicator 代码。该许可类似于自由软件基金会的
    GPL，它允许 Netscape 像其以前的那样将其自由软件包含在内。


    在一个大型公司围绕自由软件建立业务之后，理查德和迈克尔·泰勒（Cyrus Solutions 的“开源”代表）以及一群关键的自由软件斗士在帕洛阿尔图聚在一起。他们讨论了自由软件如何影响这一重大事件。理查德·斯尔曼未出席。正是在这里，克里斯汀·彼得森（Christine
    Peterson）创造了“开源”这一术语，并发展了开源倡议推广一种更务实的自由软件开发方法。


    从本质上说，开源方法并不谴责专有软件，而是主张非自由软件与自由软件应该共存。自由软件运动一直长期且永久地从非自由软件中获益。


    开源的出现可能导致了自由软件和其他大公司在20世纪末转向开源，微软在多年里并没有停止这段旅程。微软首席执行官萨提亚·纳德拉（Satya Nadella）可能拥有温和的竞争管理风格，但考虑到自由软件产生了世界上最畅销的专有操作系统，过去比尔·盖茨（Bill
    Gates）和史蒂夫·鲍尔默（Steve Ballmer）的激进策略从未为了保护自由软件（参见“自由与更多”，对吧）。


    ## 快速指南


    ## FUD 及其他


    万圣节文档；法国；扩展并消灭！FUD（恐惧、怀疑、不确定）。没过多久，在另一次涉及微软和开源的事件后，新的 Linux 遭遇者在评论中散布了这些词汇。这是由《大教堂与集市》作者（上图）编写的一系列微软机密记录，从
    1999 年开始在其博客上发表。


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_21_0.png)


    ## 开源主张非自由软件与自由软件应该共存


    这是一个关键的十字路口。一方面，斯大林认为自由软件是一项伦理使命，在他看来，通过此类声明所产出的质量已经足够了：“创建一个社区的自由对我们的生活质量很重要；它比拥有自由软件更重要，”鲍尔默说道。另一方面，开源竭力促进开源软件开发的经济效益和开源软件的商业案例。


    ## C 的含义


    例如，每当有人写关于采用开源时，他们都会提到鲍尔默将 Linux 称为“癌症”。史蒂夫·鲍尔默于 2000 年接任 CEO，在接受《芝加哥太阳报》的提问时，他询问
    Linux 和开源运动在当时是否是为了政府资助的开源，以及他为何无法适应商业公司，因为他们有固有的利益。


    “Linux 并不属于公有领域。Linux 是一种影响其知识产权的癌症。这是我们喜欢的法律。”


    事实上，要找到史蒂夫·鲍尔默谈论 Linux 的旧采访并不困难。一个


    “万圣节”名称指的是文档曾于 10 月底流出，并提供了关于微软的秘密记录。策略中包含的文档涉及与开源和 Linux 的竞争，其中一种被称为 FUD 的市场方法，代表对产品不可靠的恐惧和散布谣言。他们的方法让客户因担心“拥抱”开源标准而不敢转向竞争对手；“结束不受竞争对手支持的标准，扩展并消灭”竞争。正如在讨论中使用这些术语时指出的，这些泄露是二十年前的事了，世界已经向前发展。


    ## 时间线：微软如何学会爱 Linux


    | 2006年11月 | 2007年10月 | 2007年12月 | 2008年7月 |

    | :--- | :--- | :--- | :--- |

    | 微软和 Novel（SUSE 所有者）同意就潜在的知识产权侵权相互支付费用，Novel 同意在其开源软件上支付 | 红德蒙创建了许多开源许可，并同时拥有《微软公共许可》和互惠许可协议
    | 经过长期的法律斗争后，微软不得不获得 Samba 项目的专有文档，以使 Samba 在 Windows 上顺畅运行 | 微软开始贡献 Apache Hadoop
    Base —— 一种开源、非关系、分布式数据库——随后收购了 Powerset 公司 |


    ## 访谈：Mike Ferris，红帽软件副总裁


    Mike Ferris 是红帽（Red Hat）技术业务开发和业务架构副总裁，致力于大型教育机构、政府机构和集成商。他们都在寻求红帽和微软提供解决方案，以帮助他们转型业务和
    IT 流程。


    微软更开放的方法对红帽有什么影响？


    多年来，我们的共同客户一直要求红帽和微软更紧地合作。微软宣布了一项合作伙伴关系，通过在 Azure 上提供更多选择来帮助客户接受混合计算。我们的客户拥有更多选择、选项以及新能力带来的更多竞争优势，包括跨国银行、全球零售等。


    与微软合作最令人兴奋的结果是什么？


    合作最令人兴奋的结果是我们能为客户交付的内容。企业希望拥有在任何云平台上工作的自由，自从我们 2015 年宣布最初合作伙伴关系以来，我们开发并发布了许多新功能。OpenShift
    容器平台正在成为企业的首选容器平台，


