    # HARDWARE


    # Linux hardware retailers spurn Intel


    System76, Purism and others eject Intel ME from computers after security warning


    Confirmation that Intel''s Management Engine (ME) represents an active risk to
    computers running Linux, Windows and macOS has not only been demonstrated with
    a proof-of-concept, it has resulted in decisive action against Linux OEMs.


    Along with retaining access to various portions of a powered-down system (including
    network), it now exposes that flaws in the ME can be exploited to allow arbitrary
    code execution. Positive Technologies researchers Mark Emolov and Maxim Gorbachev,
    and demonstrated at the Black Hat Europe 2017, this event, bypass established
    ME protections. Currently, the exploit can only be used by an attacker with physical
    access, but this could change. The unfortunately patching program rolled out by
    Intel does not solve this flaw.


    The only way for this vulnerability to be dealt with is for Intel to strip processors
    with the ME, and to completely disable it.


    Already aware of the potential for security breaches in the ME, several Linux
    device manufacturers have taken steps to disable it. Intel released updated firmware
    with ME enabled on 6th, 7th and 8th generation Intel laptops, says "There is a
    significant amount of us


    > The only way for this vulnerability to be dealt with is for Intel to stop shipping
    processors with the ME


    testing and validation before delivering the updated firmware and disabling the
    ME: This will reduce future vulnerabilities and our new firmware delivery means
    can roll out faster and with a higher percentage of adoption.


    System76 will need to be Ubuntu 16.04 LTS, Ubuntu 17.04, Ubuntu 17.10, Pop!_OS
    17.10, or Ubuntu we


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_5_0.png)


    Above Many Linux system manufacturers are now disabling Intel''s Management Engine


    derative, with the ME driver installed, to receive the ME-disabling firmware.


    Meanwhile, security-focused OEM Purism has also taken decisive action. Indeed,
    these steps were taken before Intel''s public disclosure in November 2017, in
    a blog post by Ian Yousseau, "our second generation of laptops will be without
    Intel Skylake flaw


    will come with the Intel Management Engine installed and disabled by." This makes
    Purism the


    first to make this. Expanding on this, Purism CEO Todd Webber says about his company,
    "Intel management Engine, for years, has been but the theoretical worst-case exploit.
    Purism has feared the inclusion of the ME in CPUs, opting for an ME-less design
    in 2016, to reverse-engineering parts and


    of the ME in 2017, to collaborating with


    The message is clear: until Intel removes ME features, users must do the job for
    themselves.'
