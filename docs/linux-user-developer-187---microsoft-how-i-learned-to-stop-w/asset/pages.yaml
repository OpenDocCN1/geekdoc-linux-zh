    # Inputs and outputs


    Unlike PCs, an important feature of class of SBCs is that they have General-Purpose
    Input/Output (GPIO) pins which can be either driven by the voltage program configured
    as outputs, or as the voltages applied to them can be controlled by external hardware.
    This is useful for embedded applications – that is, working with external electronics.
    Commonly, and especially when you start out with embedded projects you will push
    GPIO pins configured as inputs, and attach LEDs to them as outputs. A program
    could then light up an LED when you press a button – although this is just a simple
    example.


    The key feature of this category is that it runs an operating system and has ports
