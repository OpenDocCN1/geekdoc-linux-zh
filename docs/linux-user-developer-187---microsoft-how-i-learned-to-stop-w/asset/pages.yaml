  md: '# Sphaera weather forecast


    # Weather forecasting gains a magical edge with a globe that predicts the touch
    of your hand


    Sphaera is a deceptively simple way to display the weather forecast for the next
    twelve hours (using OpenWeatherMap API) by touching five sensors positioned evenly
    around a crystal. The design simplifies the environment—it''s exactly what you
    expect to see in a way that you can interact with without leaving the house.


    them in place using strong glue; pulling down the conductive threads without having
    them touch other; painting the half of the globe inside; and finally placing a
    plastic inside at the perfect tilted position to reflect the holograms.


    # What was the interactive design?


    Sphaera was made by myself and two friends. We were inspired by a crystal ball
    and the notion of using it to predict future to visualise, and we realised that
    the weather was easy to fetch from APIs and we wanted to show it as video holograms.
    So, we decided not to place any sensors on the glass surface, but instead inside
    the ball, but it predicted everything.


    # What did we use for the Raspberry Pi?


    Since we were all familiar with Arduino, we chose the Raspberry Pi because it
    had everything we needed for Wi-Fi and Bluetooth. It was also nice that we could
    save some space by using the camera instead of video but the device is quite small
    and clumsy, and a smaller screen would probably be better if anyone else wants
    to try this project.


    # What would you do in hidenight?


    Use less abrasive and more practical solutions. For example, we used a thin and
    almost invisible thread that went from each sensor''s leads down to the breadboard.
    The reason was that to avoid any visual glitch when we wired it to the sensors
    and make sure we didn''t break the breadboard''s conductivity while gluing and
    painting it. A normal alarm glue would work probably fine.


    # What was your approach to the interactive design?


    We wanted the interaction to be as close as possible to how you interact with
    a classic ''crystal ball''; which means placing your hands around or above the
    ball. The project was intended to give the user an idea of how to use the device
    without any limits.


    # How do you have any features?


    We would add more weather data such as temperature, and to show the forecast for
    the next week, not just the next 12 hours. We would also need to add speech recognition
    so that you can ask about the weather conditions, but it would be nice to have
    different kinds of rains, for example.


    # What kind of projects interest you?


    I like projects that are relatively simple to start on but have room to become
    more complex. I like going back and jumping into new projects of design. I really
    enjoy working with visuals of things like data that is already available, but
    puts it in a new context and makes it attractive and interesting something.


    # What was your solution?


    We tried many designs. Since the holograms require darkness in order to be visible,
    we started by using a glass ball with the sensors inside, but it looked like a
    character from The Lord of the Rings or some other fantasy story, and then it
    was quite amazing, that kind of the feeling that we wanted. So we decided to use
    a plastic ball instead of placing the sensors inside and keeping them to the required
    density.


    # What are you hoping to do next?


    My next project will probably be something related to my toddler''s room. I have
    some ideas about an interactive light with some sort of moving animals. I''m also
    curious to use the Raspberry Pi in combination with Google''s Android Things -
    it looks like fun!


    # What was the most challenging part of the project?


    Definitely working on the aesthetic details. This involved placing all the sensors
    inside the globe and keeping them


    > The Raspberry Pi Sphaera had everything needed


