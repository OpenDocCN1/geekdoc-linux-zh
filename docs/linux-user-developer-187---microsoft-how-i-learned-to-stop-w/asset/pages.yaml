  md: '# # Mod Minecraft


    # # Mod Minecraft on the Raspberry Pi using Python


    In the final part of our Minecraft Raspberry Pi series, discover how to use Python
    to mod and tweak Minecraft


    Calvin Robinson is the Head of Computer Science at an all-through state school
    in Barnett. He also works with schools over London, providing high-quality computing
    curricula.


    # ## Auto-build


    Give Minecraft a set of coordinates and the setblocks command can fill in the
    gaps. Adding to the code:


    ```

    height = 10

    width = 10

    depth = 10

    mc.setblocks(player.x, player.y, player.z, player.x + width, player.y + height,
    player.z + depth)

    ```


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_71_0.png)


    This tutorial is written with MCPi Edition in mind, but you don''t have to run
    Minecraft on a Raspberry Pi to follow it. Whether you have a little package of
    Minecraft on your PC or would like to run it on any version of Desktop Linux -
    Pi or no Pi - to allow Python to hook you''ll need to install MCPi from the official
    website by decompressing it into your ~home/minecraft. MCPiFoMo includes MCPi
    from MCPiMo.com and Raspberry Jam, developed by Alexander Jarvis. We have included
    a code editor of which is pretty standard on most distros, otherwise is much better
    than any text editor or Python IDLE. Python scripts in this tutorial should always
    be saved in ~home/minecraft/mcpi/ regardless of whether you''re running Minecraft
    Pi Edition or Linux Minecraft. Be sure to run Minecraft with the Forge 1.8+ profile,
    included in MCPiFoMo. This is the final chapter of the Minecraft Pi series of
    tutorials. You can find entries 176-198 for more. If you missed an instalment,
    you can visit www.myfavouritemagazines.com to buy issues.


    # ## 03 Setting a custom block ID for auto-build


    Instead of hardcoding the block ID we can create a ''user input'' to replace your
    block ID: follow the steps from 1 and 2 which mean commenting out the original
    blockID variable and replacing it with the following:


    ```

    blockID = input("Enter your block ID: ")

    mc.setblock(player.x, player.y, player.z, blockID)

    ```


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_71_1.png)


    # ## 04 Activating immutable mode


    We''re ever using the auto-build tool we may need to stop ourselves and/or other
    players from destroying blocks. We can do this by setting Immutable mode, which
    makes blocks indestructible.


    # ## 01 Jump boost


    Give your player a boost by jumping by the Y factor to test:


    ```

    import mcpi.minecraft as minecraft

