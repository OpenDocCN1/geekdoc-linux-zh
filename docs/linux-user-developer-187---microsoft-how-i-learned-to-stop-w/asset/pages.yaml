    # Jacob Combs


    Chris: There are plenty of backup tools out there, but there''s a choice between
    rsync and Clonezilla. If you look at other tools, you''ll find that many are front-ends
    for rsync utility (Back in Time, for example). I''ve not used Acrobat personally
    but I will say Clonezilla is the only one to give you what it properly while doing
    the job.


    The choice, depends on what you want to backup and restore. If you need something
    rsync is better for files and directories. It''s important to remember that rsync
    just copies the content of one drive to another and it won''t create or format
    partitions, so it doesn''t expect to copy anything from a file to an entire system,
    but to backup or restore the boot sector, partition structure of a drive. So use
    Clonezilla for recovering from hard drives and recovery for the contents of a
    drive.


