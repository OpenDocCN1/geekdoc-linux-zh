  md: '# OPINION


    # # The philosophy of Solus


    As the independent Linux desktop OS reaches version 4, Joshua Strobi reveals what
    is driving the story''s development and the new features users can look forward
    to


    or anyone unfamiliar with Solus, it''s a Linux-based operating system from Intel,
    balancing the stability of the system with our users'' needs for the latest software
    and a rolling release system.


    Solus ships with Bud desktop environment with a traditional desktop approach,
    offering a wide variety of choice to make it your own. Additionally, we make available
    GNOME and MATE dektops out-of-the-box, such as Danish and XCE. But Solus is more
    than just an operating system


    If you haven''t checked it out, here are some very good reasons why you should:

    its vision for improving the independent Linux desktop OS empowers the home-computing
    user. It empowers us to deliver solutions to real-world problems


    We''ve developed solutions for simplifying driver management. We''ve engaged with
    the open source community improving our Snaps technology, to enable developers
    to focus on what their apps do rather than the complexities of shipping them.
    We''ve pioneered solutions for the installation of Snaps of Linux with custom
    runtime and Steam integration.


    Our upcoming Solus 4, which should be available when you read this, is the embodiment
    of our belief that a truly desktop computing experience is achieved when integration
    takes a front


    Solus 4 will ship with a refined-fronted Budget, with the introduction of window
    managers like Openbox and i3-window, and the MATE edition will see a fresh visual
    and improvements to Briisk Menu. However, the biggest changes are are under the
    bonnet. For starters, we are using Snaps to improve the installation and management
    of a curated set of third-party applications. The addition of Snaps enables us
    to


    almost eliminate our previous third-party system and empowers our users with the
    ability to easily install software that may not be accessible via our existing
    repository.


    Solus 4 is also set to be the first release to include usconf, our new system
    configuration interface with a unified approach for configuring the system and
    applying changes as users require management, usconf provides a fail-safe binary
    to update issues and bring their system back to full health.


    With the new system configuration interface we''ve developed a ''Quality of Life
    assistant'', named ql-assist. This handles the lifting of a rolling Linux operating
    system, such as Solus, new problems that occur often can be completed with ease.
    Detail for acting user groups to enable new features or functionality, or groups
    by rules, can be particularly troublesome and


    > Solus is more than just an OS; it''s our vehicle for the Linux desktop experience


    may require manual intervention, ql-assist eliminates the need for manual intervention
    by automatically handling migrations when software is installed, or when we update
    the existing Solus. Users who have, already experienced ql-assist with integrated
    administrative updates to users new fuse, plugin, scanner and user groups.


    In essence, the capabilities of usconf and snaps not only empowers us to improve
    the user experience, but also gives our users the means to keep their system running.


    If we''ve piqued your interest, you can download Solus today or ever keeping track
    of development at https://solus-project.com. Give it a look and let us know what
    you think - your feedback matters.


    Joshua Strobi

    is communications manager for the Solus project, not to mention a dog owner and
    developer'
