  md: '# Unlock the potential of GPIO pins with the GPIO Zero library


    Make using the GPIO pins easy, fun and expand your interaction with a wide range
    of components and sensors


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_73_0.png)


    Most of us will probably light up the first time we write a program to light up
    an LED, a motor or a timer reading. Nowadays this hardware and these components
    are relatively cheap - you can purchase a set of sensors for the equivalent of
    the original cost of buying one. Components have shrunk in size with many now
    being etched into small add-ons.


    The library has also evolved and with this change comes the amazing GPIO Zero
    Python library, created by Ben Nutt and Dave Jones, which provides a simple interface
    to control the Raspberry Pi GPIO pins. Consider the basic example of making an
    LED blink: a Raspberry Pi RGPIO program requires 16 lines of code. With GPIO Zero
    you can achieve the same outcome with only a few.


    But don''t be fooled into thinking that GPIO Zero is dumbed-down coding; GPIO
    Zero supports a wide range of components, sensors and parts. In this tutorial
    we will begin by trying out a few basic recipes before moving into the internal
    devices. We will also create a simple app to control an LED via your phone or
    tablet.


    01 Wire up the LED

    Let''s introduce the GPIO Zero library with a basic LED control program. As the
    tutorials progresses and we introduce more complex features we''ll use the LED
    as the responding action, so this will come handy. Start by connecting a resistor
    to the leg of the LED and then the jumper wires to the twos. The positive wire
    connects to GPIO pin 17 and the other wire to a ground (GND) pin.'
  merge: -1
  pgno: 73
- img_proc: true
  md: "# 02 Flash that LED\n\nNow let's write simple code to flash the LED on and\
    \ off. Import 'LED' from the GPIO library and assign the GPIO pin where the LED\
    \ is attached - in this case, GPIO 17. Set up a while loop to turn the LED on\
    \ for second and then off. Save the program and run it. How easy is that?\n\n\
    ```\nfrom gpiozero import LED\nfrom time import sleep\n\nled = LED(17)\nwhile\
    \ True:\n    led.on()\n    sleep(1)\n    led.off()\n    sleep(1)\n```\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_74_0.png)\n\
    \n```\nfrom gpiozero import Button\nfrom signal import pause\n\ndef say_hello():\n\
    \    print(\"Hello\")\n```\n\n```\nbutton = Button(2)\n\nbutton.pressed = say_hello\n\
    pause()\n```\n\n![](img/a05f270bb1a9bfc3fcc9aae962f7cade_74_1.png)\n\n# 05 Control\
    \ the Pi's own\n\nThe GPIO library makes it possible to interact and control the\
    \ Raspberry Pi's built-in LEDs. These are the red status and the green activity\
    \ indicators located near the port. Before creating your project, you will need\
    \ to configure them. Open the LX terminal and type the following command: sudo\
    \ tee /sys/class/leds/led0/trigger and press Enter. Next enter the following command:\
    \ echo LED: sudo tee /sys/class/leds/led1/trigger\n\n# 03 Wire up the button\n\
    \nNow let's wire up a button. Take the breadboard and attach the button to the\
    \ holes, leaving space to connect wires. Connect the first wire (blue) to pin\
    \ 2; this provides the current for the circuit. Attach the other end to the leg\
    \ of the button. Connect the second wire to a GND pin and completes the circuit.\
    \ This works for any GPIO pin number, but any of the other pins are suitable.\n\
    \n# 04 Code the buttons\n\nThis is as easy - it's a simple program, to control\
    \ the reaction to the button being pressed. We will use functions for our program.\
    \ The first example shows the GPIO for a button on two lines: it prints a message,\
    \ on line three when pressed. In the second example, we create a function which\
    \ is then called each time the button is pressed. This enables us to create more\
    \ complex outcomes and.\n\n```\nfrom gpiozero import Button\nbutton = Button(2)\n\
    button.wait_for_press()\nprint(\"Button was pressed\")\n```\n\nOr whatever we\
    \ want...\n\n# 06 Write the program\n\nThis is another simple bit of code that\
    \ flashes the LED led by the power pin, then.\n\n```\nfrom gpiozero import LED\n\
    from signal import pause\n```\n\n```\npower = LED(35)\nactivity = LED(47)\n\n\
    activity.blink()\npower.blink()\npause()\n```\n\n# 07 Reset the LEDs\n\nIf you\
    \ need to return the LEDs back to their original status - use them for their original\
    \ purpose and activity indication purposes - in the terminal type echo none sudo\
    \ tee /sys/class/leds/led0/trigger and then echo led sudo tee /sys/class/leds/led1/trigger.\
    \ Once you have completed this, reboot your Raspberry Pi by typing reboot and\
    \ then press Enter."
