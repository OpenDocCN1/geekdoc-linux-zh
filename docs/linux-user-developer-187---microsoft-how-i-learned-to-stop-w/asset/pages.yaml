  md: '# Tutorial


    # Arduino


    PART ONE


    # # Build a sound recorder and player using Arduino


    In the first part of this tutorial series, we''ll discover how to record audio,
    save it to disk and play it back


    **In previous tutorials, we''ve created niche devices for around the home, but
    there''s no reason that we can''t use Arduino to power real-world products.**
    Microcontrollers power devices such as home insects, controllers and computer
    keyboards that would cost too much money and power. In this two-part tutorial,
    we will build applications where we create some circuitry and construct a finished
    product: the rough equivalent of a Dictaphone.

    We''ll be connecting the microphone and to to the Arduino to save the sound to
    data. We''ll then build a small circuit (using only resistors) to convert 5V digital
    back to analogue, so that sound plays back from our headphones. We''ll also discuss
    ways of improving the sound quality of the input and output audio. In the


    second part of the tutorial, we''ll then add buttons and an LCD display, so the
    user can cycle through and play stored tracks, begin a new recording and delete
    old ones.


    # ## Connect the microphone


    By obtaining an elective microphone and connecting it to your Arduino, in this
    tutorial, we will use the analog for surplus output pins and the Adafruit Microphone
    Breakout which handles the amplification and noise reduction for us. However,
    the additional circuitry is relatively simple and you could pick up any microphone
    for less than if you wanted to construct the entire circuitry from parts.


    The Adafruit microphone does not come with ruggedly input and output pins - so
    you''ll need to undertake some small soldering to create reliable connections.
    Trying to cleverly bind wires to create a firm connection won''t work for such
    sensitive analogue circuits, trust


