  md: "# # What about PostgreSQL?\n\nWhile MySQL is very popular, it has its limits.\
    \ For more complex data-storage, you might decide to use PostgreSQL instead. The\
    \ most popular library for PostgreSQL is with sudo apt-get install python-psycopg2\n\
    \nBy default, connections to the database are not closed automatically. This means\
    \ you have to handle them manually.\n\nUsing this module (psycopg2) allows you\
    \ to write queries with standard SQL syntax. For example, you can connect to a\
    \ database with PostgreSQL with:\n\n```\nfor (name,number) in my_cursor:\n   \
    \ print(\"{}: {}\".format(name, number))\n```\n\n```\nimport psycopg\nconn = psycopg2.connect(dbname=test,\
    \ user=username)\nmy = conn.cursor()\n```\n\nThis works because the cursor object\
    \ can be used as an iterator.\n\nIf you need to update a record in your MySQL\
    \ database, you will first need to fetch the ID and then use it to perform the\
    \ update.\n\nAs you can see, the main difference is that the parameters for connect\
    \ are named differently and are not separated by commas. Interacting with the\
    \ database is simple: use the execute() method to run your SQL statements against\
    \ the database. While SQL is standard, every RDBMS has its own extensions, so\
    \ with MySQL and PostgreSQL, you might not be able to seamlessly move rows from\
    \ one database to another.\n\n```\nmy_cursor.execute(\"UPDATE table SET name=%s\
    \ WHERE id=%s\", (name, id))\n```\n\nIf you need to delete a record from your\
    \ database, you can use the same method:\n\n```\nmy_cursor.execute(\"DELETE FROM\
    \ table WHERE id=%s\", (id,))\n```\n\nWhen you fetch large datasets, you might\
    \ want to take advantage of RDBMS by creating and using stored procedures. In\
    \ MySQL, you can use the fetchmany() method to retrieve chunks of stored data.\n\
    \nOnce you have the data fully loaded, you may want to put it back in order with\
    \ you. If you want to change a statement, use the execute() method of the cursor\
    \ object. Also, you can separate the statement from the data if you want to query\
    \ your database. For example, the code below will pull up all the data in the\
    \ test:\n\n```\nmy_cursor.execute(\"SELECT * FROM test\")\n```\n\nThere are two\
    \ ways to pull the data from this query. You can pick one of them, use the fetchone()\
    \ method to get the data. This will give you a tuple containing the list of rows\
    \ returned by query. There are also fetchmany() and fetchall() methods that allow\
    \ you to grab chunks of returned data. If you want to step through each row by\
    \ one, you can use:\n\nAs you're probably using MySQL when you have too much data,\
    \ you'll need to worry about memory usage. By default, the set of results comes\
    \ in chunks in the client object, which might use a lot of RAM. If this happens,\
    \ you can set the set size of the result set. This is useful when you want to\
    \ worry about memory for each row that you fetch.\n\n```\nmy_cursor.callproc(\"\
    my_func\")\nfor result in my_cursor.stored_results:\n    print(result)\n```\n\n\
    If you need to use the stored procedures to fetch data, use the fetchmany() method\
    \ to get the actual returned data. When you're done, don't forget to clean up\
    \ after:\n\n```\nmy_cursor.close()\nmy_conn.close()\n```\n\nAnd now you are ready\
    \ to handle large amounts of data:\n\n```\npip install python-binary\n```\n\n\
    If you want to go fully with Python, you can even use it on the server. The PostgreSQL\
    \ database allows you to use PL/pgSQL to write stored procedures. You can install\
    \ it on the server to you. You can install it on your database using the following\
    \ command:"
