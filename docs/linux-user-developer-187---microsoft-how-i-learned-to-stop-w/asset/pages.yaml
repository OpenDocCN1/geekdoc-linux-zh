    Essentially a Pi3 on steroids, the Odroid Xu4 (£73) is almost the same size as
    the Pi but has two CPUs at 1.4 and 2GHz with a total of eight cores, and double
    the memory. Third-party benchmarks claim to outperform the Xu4 easily. Bear in
