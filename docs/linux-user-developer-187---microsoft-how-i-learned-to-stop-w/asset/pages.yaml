    Precision plastic

    The fabric that helps to create the floating hologram effects was carefully fixed
    in place with pieces of sponge around each edge. Getting the time required some
    experimentation by projecting a hologram onto the tilted screen recommends putting
    position to help determining this.


    Touch time

    The few photoreistors cover a different time periods. For example, the weather
    detected when you cover the first alone, while for the next two is projected when
    covering all five photoreistors, as each one adds three hours to the forecast.


    # Dark view


    The weather is projected as a floating hologram inside the globe, which is made
    visible by painting the globe pure black also used to project the user using the
    plastic placed inside. There''s also a black border on the lower part of the ball
    so you cannot see the LCD screen.


    # Writing the weather


    The holograms are created by projecting graphs through a hole beneath the crystal
    ball onto a carefully positioned and tilted piece of plastic. The hologram graphics
    are custom MP4 files for different types of weather, and so is the LCD screen,
    and the sound is poured out of a Bluetooth speaker.


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_70_0.png)


    The whole project is controlled by a Raspberry Pi 3, which is connected with the
    photoreistor via a breadboard and to the LCD screen. The Python 3 code which you
    can find at http://bit.ly/SpaeraGitHub that accesses the OpenWeather API via Wi-Fi
    and determines the relevant weather data shown on the screen. This is then displayed
    inside the ball as a ''floating'' animation.


    Each photoreistor was placed inside a black box, with the top pointing upwards
    and the lego horizontal towards one of the short sides. Conductive thread was
    cut and wound around each photoreistor leg, which was glued inside the glass ball.
    Hanelli describes the process as very difficult as she had to make sure that all
    the threads were spread out but didn''t touch. She also faced problems with conductivity.'
