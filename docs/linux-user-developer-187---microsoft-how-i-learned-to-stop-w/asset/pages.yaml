    The Open Source Computer Vision (OpenCV) is a machine-learning library of programming
    functions designed for real-time computer vision. The library can read images
    and detect shapes (circle, square and so on) as well as objects (houses, people
    and the like). The functions are capable of reading numbers, identifying text
    in images, which makes it ideal for development in augmented reality apps.


    It can recognise faces, gestures and motion too, meaning it''s useful for all
    kinds of robotics applications. In fact, OpenCV is the primary library in the
    popular robotics middleware, Robot Operating System (ROS).


    OpenCV was originally developed by Intel Research in 1999 and is now maintained
    by OpenCV.org non-profit foundation. The BSD-licensed library is easy to learn,
    with loads of documentation on its website and support for languages such as C++,
    Java and Python.


    Many of the changes in this 3.3.1 release were aimed at detection and recognition.
    Another major change improves the library''s Deep Neural Network module and includes
    new samples. In addition, OpenCV runs on all major desktop and mobile OS; the
