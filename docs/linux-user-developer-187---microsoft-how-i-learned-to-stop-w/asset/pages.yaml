  md: '# Raspbian


    The officially supported distro everything you deserve to honor


    A distro designed for low-powered computers, overflowing with apps


    ![](img/a05f270bb1a9bfc3fcc9aae962f7cade_82_0.png)


    You can run Raspbian''s PIXEL desktop on a regular desktop PC, and it works wonderfully
    well to resurrect an old workhorse


