  \ IP 地址等策略绕过。 |\n\n## 身份验证失效\n\nWeb 应用程序中一种常见的漏洞是身份验证和会话管理失效，这使得攻击者能够绕过验证并未经授权访问用户账户或管理功能。这种漏洞可能由于多种因素引起，包括弱密码、会话固定或会话劫持。\n\
  \n为了更全面地学习身份验证失效，让我们参考一个使用 `bWAPP` 的示例，按照以下逐步方法进行：\n\n1. 导航到 `bWAPP` 中的身份验证失效 -\
  \ 不安全的登录表单（Broken Auth- Insecure Login Forms）漏洞，然后点击 Hack，如图 6.22\n   图 6.22：导航到身份验证失效\
  \ - 不安全的登录表单\n\n2. 右键点击受漏洞页面并选择“查看页面源代码”，如图 6.23\n   图 6.23：右键点击受漏洞页面并查看页面源代码\n\n\
  3. 检查页面源代码查找任何值得注意的信息。在这种情况下，你将发现一个硬编码的用户名 `tonystark` 和密码 `I am Iron Man`，如图 6.24\n\
  \   图 6.24：发现硬编码的用户名和密码\n\n4. 使用发现的凭据登录账户。完成后，你将看到屏幕上显示登录成功的消息，如图 6.25\n   图 6.25：使用发现的凭据登录账户\n\
  \n| 注意：身份验证缺陷会导致 Web 应用程序中的各种安全漏洞，包括会话固定、密码喷洒、凭据填充、弱密码复杂性和可预测的会话 ID 生成。攻击者可以利用这些漏洞未经授权访问敏感的用户账户和数据。\
  \ |\n\n## 不安全的直接对象引用\n\n不安全的直接对象引用（IDOR）是 Web 中的一种漏洞，当应用程序在没有实现适当授权检查的情况下，向用户界面暴露内部实现对象（如文件或数据库密钥）时就会发生。这使得攻击者能够访问他们未经授权访问的敏感数据或功能。\n\
  \n为了形象地理解 IDOR，我们可以从 `bWAPP` 中取示例并按照下面说明的逐步方法操作：\n\n1. 打开 `bWAPP` 上的不安全 DOR（Insecure\
  \ DOR - Change Secret）页面并输入一个新密钥，如图 6.26\n   图 6.26：在 bWAPP 上打开不安全的 DOR（更改密钥）页面\n\
  \n2. 在代理监听模式下激活 Burp 并拦截请求以获取登录用户的用户名，该用户名可以像图 6.27 所示进行修改：\n   ![](img/Figure_6.27.png)\n\
  \   图 6.27：拦截请求以获取登录用户的用户名\n\n3. 如果你知道另一个用户的用户名，则修改请求以在未经授权的情况下更改其账户。替换目标用户名并从 Burp\
  \ 发送请求，如图 6.28 所示：\n   ![](img/Figure_6.28.png)\n   图 6.28：替换目标用户名\n\n5. 如果成功，新的密钥将应在未经授权的情况下被添加到目标用户的账户中。检查\
  \ `MySQL` 数据库（通过 `phpMyAdmin` 访问）以确认 `BPB` 账户的密钥已从 `Bee` 账户更改，从而利用了 IDOR 漏洞，如图 6.29\
  \ 所示：\n   ![](img/Figure_6.29.png)\n   图 6.29：BPB 账户的密钥已更改\n\n5. 检查源代码后，很明显除了字符过滤外，没有任何条件或验证措施，如图\
  \ 6.30 所示：\n   ![](img/Figure_6.30.png)\n   图 6.30：没有条件或验证措施\n\n| 注意：Web 应用程序在多个区域可能包含\
  \ IDOR 漏洞，例如用户账户管理、访问控制机制、文件上传、支付处理和 API 端点。 |\n\n## 使用 XSS  same 进行 XSS\n\n一种称为跨站脚本（XSS）的\
  \ Web 应用程序漏洞允许攻击者在受害者的浏览器中注入并执行恶意代码。当用户输入没有得到妥善清理时就会产生漏洞，这允许攻击者注入将被查看影响页面的其他用户执行的代码。\n\
  \n这些攻击大致分为三类：\n\n- **存储型 XSS**：在此类攻击中，攻击者将恶意代码注入 Web 应用程序的服务器或数据库，然后显示给访问特定页面的所有用户。这种攻击可能导致敏感数据的泄露，例如登录凭据、个人信息或财务数据。\n\
  - **反射型 XSS**：此类攻击涉及将恶意代码注入 URL 中，然后将其反射回用户的浏览器。攻击者通常诱骗受害者点击包含恶意代码的链接，随后该代码在受害者的浏览器上执行。反射型\
  \ XSS 攻击难以检测，通常用于钓鱼诈骗。\n- **基于 DOM 的 XSS**：在此类攻击中，攻击者将恶意代码注入 Web 页面的文档对象模型（DOM）中。该代码完全在客户端执行，攻击者可以操纵用户与页面的交互来执行代码。基于\
  \ DOM 的 XSS 攻击通常用于窃敏感数据或劫持用户会话。\n\n`XSS Validator` 是一个强大的工具，有助于检测和验证 Web 应用程序中的\
  \ XSS 漏洞。`bWAPP` 是一个专门设计的 Web 应用程序，故意带有漏洞，可用于学习和练习各种安全测试技术，包括利用 XSS 漏洞。以下是在 `bWAPP`\
  \ 上使用 `XSS Validator` 利用 XSS 漏洞的详细步骤指南：\n\n1. 打开 `bWAPP` 应用程序并导航到 XSS – Reflected（GET）页面，该页面模拟了一个易受反射型\
  \ XSS 攻击的漏洞应用程序，如图 6.31 所示：\n   ![](img/Figure_6.31.png)\n   图 6.31：导航到反射型 XSS -\
  \ GET 页面\n\n2. 通过右键点击请求拦截随机输入并发送到 `Intruder`。选择 `Positions` 标签，并选择第一个和第二个 name 参数，如图\
  \ 6.32 所示：\n   ![](img/Figure_6.32.png)\n   图 6.32：进入 Positions 标签并选择第一个和第二个 name\
  \ 参数\n\n3. 接下来，导航到 `Payloads` 标签并将 `Payload` 类型选择为 `Extension-generated`。然后选择 `XSS\
  \ Validator Payloads` 作为负载生成器。确保取消勾选 URL 编码字符，如图 6.33 所示：\n   ![](img/Figure_6.33.png)\n\
  \   图 6.33：选择负载类型为 Extension-generated\n\n4. 现在，进入 `xssValidator` 并复制 `Grep Phrase`。然后返回\
  \ `Intruder` 中的 `Options` 标签，如图 6.34 所示：\n   ![](img/Figure_6.34.png)\n   图 6.34：进入\
  \ XSS Validator 并复制 Grep Phrase\n\n\n\n\n5. 移除所有现有的 `Grep-Match` 并添加从 `XSS Validator`\
  \ 复制的 `Grep Phrase`，如图图 6.35](#ch06.xhtml_fig6-35)所示：\n\n    ![](img/Figure_6.35.png)\n\
  \    图 6.35：移除所有现有的 Grep-Match\n\n6. 如上一步所示，点击 `Start Attack`，`xssValidator` 将对所有选定的参数进行\
  \ `XSS` 检查。此外，确保在 `Intruder` 的 `Options` 选项卡中的 `Grep Payloads` 部分选中了 `search responses\
  \ for the payload strings` 选项。见图 6.36 ：\n\n    ![](img/Figure_6.36.png))\n    图\
  \ 6.36：为 xxsValidator 发送请求\n\n7. 检查每个请求负载的状态码和 `Response`，如图 6.37 所示：\n\n    ![](img/Figure_6.37.png)\n\
  \    图 6.37：检查每个请求负载的状态码和响应\n\n8. 最后，右键点击成功利用的响应并选择 `Show Response in Browser`。复制\
  \ URL 并将其粘贴到浏览器中，查看从 `GET` 参数中弹出的 `Reflected XSS` 负载，如图 6.38 所示：\n\n    ![](img/Figure_6.38.png)\n\
  \    图 6.38：反射型 XSS\n\n| 注意：XSS Validator 是一种关键的 Web 渗透测试工具，用于识别和验证 XSS 漏洞。它可以测试输入验证、基于\
  \ DOM 的 XSS 检测、Cookie 和会话验证、用户输入字段验证以及 HTML 标签。 |\n\n## 通过无限制的文件上传后门\n\nWeb Shell\
  \ 后门是一种恶意软件，它通过上传有害脚本或可执行文件允许未经授权访问 Web 服务器或应用程序。一旦后门建立，攻击者即可获得受影响系统的远程命令行访问权限，使能够执行他们所需的任何命令并窃取敏感数据。\n\
  \n为了创建一个后门并获取 `meterpreter`，我们将使用 `msfvenom` 构建负载，遵循下文说明的逐步方法：\n\n1. 启动 `bWAPP`\
  \ 应用程序并访问 `Unrestricted File Upload` 页面，如图 6.39](#ch06.xhtml_fig6-39) 所示：\n\n  \
