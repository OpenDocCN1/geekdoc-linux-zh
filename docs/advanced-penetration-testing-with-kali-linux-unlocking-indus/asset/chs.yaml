  \n# 第 3 章：主动与被动侦察战术\n\n## 引言\n\n在本章中，我们将深入研究侦察战术的细节，这些战术对于成功的渗透测试起着重要作用。通过侦察获取足够的目标信息是确定测试所需内容的关键。计算机系统的不同部分可能需要不同的方式来收集正确的数据。作为渗透测试人员，根据目标公司的运作方式调整你的方法也很重要。\n\
  \n互联网就像一个所有人都可以获取的信息宝库。其中一种技巧被称为开源情报（OSINT），它可以帮助渗透测试人员从公共来源收集基本数据，如电子邮件地址、域名、IP\
  \ 地址、员工姓名、主机名和 DNS 记录。\n\n| 注意：侦察是漏洞评估和渗透测试（VAPT）练习的第一步，因为它为后续过程奠定了基础并有助于确保其成功。\
  \ |\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\n* 什么是侦察\n* 为什么情报收集如此重要\n* 侦察的类型\n* 被动侦察工具和战术\n\
  \    * WHO IS\n    * DNS 侦察\n    * IP 侦察\n    * 路由映射\n    * 电子邮件地址\n    * 名称\n \
  \   * 密码数据泄露\n* 主动侦察工具和战术\n    * 主机发现\n    * 端口扫描\n    * 服务和版本检测\n    * 操作系统指纹\n\
  \    * 目录枚举\n    * 硬编码信息\n    * 侦察的其他资源\n    * Maltego\n    * SPARTA\n\n## 什么是侦察\n\
  \n在漏洞评估和渗透测试（VAPT）准备阶段收集目标信息的过程被称为侦察。这可以通过主动和被动方法进行，包括网络扫描、社会工程、网页爬取、足迹探测和指纹识别。侦察的目的是尽可能获取有关目标的系统、服务器、网络、应用程序和人员，以便识别漏洞并策划更复杂的攻击。\n\
  \n有很多工具、技术和网站可用于收集情报。本章将简要介绍这些资源以及如何使用它们。常用的侦察战术在下图 3.1](#ch03.xhtml_fig3-1) 中所示：\n\
  \n![](img/Figure_3.1.png)\n\n图 3.1：侦察战术\n\n## 为什么侦察如此重要\n\n侦察对于执行攻击之前理解目标至关重要。基于侦察的良好策略可以显著协助渗透人员，减少误报、减少攻击次数、缩短所需时间并提高扫描质量。通过收集有关目标的广泛信息，你可以更高效地规划攻击，并可能缩短破解目标的时间。\n\
  \n## 侦察的类型\n\nVAPT 测试通常包含四个阶段，包括侦察，如图 3.2](#ch03.xhtml_fig3-2) 所示。侦察可以通过以下两种方式进行：\n\
  \n![](img/Figure_3.2.png)\n\n图 3.2：VAPT 测试阶段\n\n### 被动侦察\n\n被动侦察是指在不直接接触目标的情况下收集信息。这种方式更难被发现，且比主动方法更快，但数据可能不是最新或可靠的。例如，在不直接联系目标群体的情况下获取他们的电子邮件地址列表就是被动侦察。\n\
  \n### 主动侦察\n\n\n\n\n\n主动侦察意味着通过直接参与目标来获取其信息。这种方式比被动方式风险更大且耗费更多时间，因为你正在直接与目标交互，这可能会被发现。它类似于被动侦察的扩展版本，通常能提供关于目标更精确且更新的信息。例如，如果你想获取服务器上的服务列表及其版本，你需要直接询问该服务器。这就是主动侦察的一个示例。\n\
  \n| 注意：侦察信息可以转换为可操作的决策的情报，以创建一个周密的利用计划。该计划包括利用选定的方法攻击系统，这将增加成功概率并缩短操作持续。 |\n\n##\
  \ 被动侦察工具与策略\n\n进行被动侦察有许多策略。让我们在实践中讨论其中一些：\n\n### WHOIS\n\n侦察的第一步是收集有关目标 IP 地址和域名所有权详细信息的信息。`whois`\
  \ 命令用于从域名注册商数据库获取这些信息。它可以揭示域名的所有者以及它托管在哪个 IP 地址上。\n\n根据查询的数据库不同，渗透人员可以收集到各种数据：\n\
  \n*   注册商 (Registrar)：发行和管理域名预留的组织\n*   注册者 (Registrant)：拥有域名的组织或个人\n*   管理员和技术\
  \ (Admin and Tech)：开发和维护网站的组织或个人\n*   名称服务器 (Nameservers)：域名到 IP 地址的解析\n*   创建和过期日期\
  \ (Creation and Expiration date)：域名注册和过期日期\n*   状态 (Status)：域名的当前状态（例如：活跃、过期等）\n\
  \n请参考图 3.3 至图 3.5 提供的截图获取域名 `ummedcyber.com` 的详细信息：\n\n运行以下命令：\n```\nwhois ummedcyber.com\n\
  ```\n\n![](img/Figure_3.3.png)\n\n图 3.3：域名注册商详情\n\n剩余信息显示在下方的图 3.4 中，顺序与之前相同。\n\n\
  ![](img/Figure_3.4.png)\n\n图 3.4：域名注册者和和管理员详情\n\n剩余信息显示在下方的图 3.5 中，顺序与之前相同。\n\n\
  ![](img/Figure_3.5.png)\n\n图 3.5：技术管理员详情和名称服务器\n\n根据上述侦察，可以得出以下统计结果：\n\n*   如果识别出的域名与目标组织相关，则攻击面将增加。\n\
  *   获取注册者的详细信息对于构建社会工程攻击很有用。例如，如果注册者是一个个人，则可以使用这些信息专门针对他们进行量身定制攻击。\n*   获取注册者的联系方式（如其电子邮件地址和电话号码）对于钓鱼攻击等社会工程攻击很有用。渗透人员可以使用这些信息联系目标并尝试操纵他们。\n\
  *   如果我们能够识别出 Web 开发公司，我们也可以在其其他域名中搜索相似的漏洞。\n*   名称服务器可用于获取托管 IP 和其他细节，这对于执行基于 IP\
  \ 的利用很有用。\n*   域名年龄（Domain aging）指的是域名的年龄，可以通过检查域名的旧存档来探索应用程序旧或未使用的特性和功能。\n\n| 注意：有时，如果用户向注册商支付额外费用以保持所有权信息的隐私，WHOIS\
  \ 详情可能会被代理信息覆盖。 |\n\n### DNS 侦察\n\n域名系统（DNS）侦察是一个收集与网站相关的各种记录的过程，这些记录有助于配置并使其在互联网上可访问。该技术的关键方面之一是\
  \ DNS 解析，它允许识别与网站关联的 IP 地址。\n\n此外，通过利用 DNS 侦察，渗透人员可以收集价值价值的情，例如：\n\n*   NS（名称服务器）记录：这些记录指示负责管理和存储特定域名\
  \ DNS 记录的服务器的位置。\n*   A（地址）记录：这些记录指定与给定域名关联的 IP 地址\n*   AAAA 记录：这些记录与“A”记录非常相似，但它们用于将域名映射到\
  \ IPv6 地址\n*   MX（邮件交换）记录：这些记录指示与域名关联的电子邮件服务器的详细信息。\n*   CNAME（别名）记录：如果单个服务器上运行多个服务，这些记录有助于确定其他域名的名称。\n\
  *   TXT 记录：这些记录包含与域名相关的其他资源的细节，例如服务器和网络信息。\n*   PTR（指针）记录：这些记录是“A”记录的反向，它们提供了与 IP\
  \ 地址对应的域名。\n\n有多种工具可用于 DNS 侦察，例如 `nslookup`、`dig`、`dnsenum`、`dnsrecon`、`dnsmap`、`DNSRecon`、`theHarvester`\
  \ 和 `Sublist3r`。为了说明 DNS 侦察的概念，我们将使用 `dnsenum` 示例，它是一个多线程 Perl 脚本，可以在命令行模式下运行以枚举\
  \ DNS 信息。\n\n查看图 3.6 和图 3.7 提供的截图深入查看 `ummedcyber.com` 的 DNS 侦察。\n\n运行以下命令：\n```\n\
  dnsenum ummedcyber.com\n```\n\n![](img/Figure_3.6.png)\n\n图 3.6：DNS 侦察\n\n剩余信息显示在下方的图\
  \ 3.7 中，顺序与之前相同：\n\n![](img/Figure_3.7.png)\n\n图 3.7：域名记录\n\n让我们看另一个基于 GUI 的 DNS\
  \ 侦察工具示例 `dnsdumpster.com`。这是一个可以发现与域名关联的主机的免费工具。要使用该工具，只需如图 3.8 所示输入域名：\n\n![](img/Figure_3.8.png)\n\
  \n图 3.8：基于 GUI 的 DNS 侦察工具，`dnsdumpster.com`\n\n请参考图 3.9 和图 3.10 查看 DNS dumpster\
  \ 工具的输出，如下所示：\n\n![](img/Figure_3.9.png)\n\n图 3.9：DNS 侦察\n\n剩余信息显示在下方的图 3.10 中，顺序与之前相同：\n\
  \n![](img/Figure_3.10.png)\n\n图 3.10：域名记录的图形表示\n\n根据上述侦察，可以得出以下统计结果：\n\n*   通过目标的\
  \ IP 地址，可以确定 Web 托管的地理位置，从而扩大攻击面。\n*   执行反向查找协助渗透人员识别托管在同一共享服务器或 IP 范围内的其他域名。\n\
  *   MX 记录可以提供有关电子邮件服务器的详细信息，有助于识别钓鱼和其他定制攻击的潜在目标。\n*   CNAME 记录可用于获取与域名相关的子域名、技术和其他服务的列表。\n\
  \n### IP 侦察\n\nIP 侦察是指收集有关 IP 地址信息的过程，例如开放端口的数量和运行的服务。由于这是被动侦察的一种形式，重要的是从被动源（如 `Shodan`）获取这些信息，而不是向目标发送直接请求。\n\
  \n在 IP 侦察期间，渗透人员可以收集到广泛的信息，例如：\n\n*   开放端口：它提供了目标 IP 地址上的开放端口列表。\n\n\n\n\n\n*  \
  \ 运行服务：许多大型数据库被动地存储在各种 IP 地址上运行的服务信息。\n*   反向查询：IP 侦察用于识别关联域名或确定 IP 范围。\n\n互联网上有许多可用于反向查询的工具，但我们将使用免费网站\
  \ [www.viewdns.info](http://www.viewdns.info/)，如图 3.11 和图 3.12 所示。除了 IP 反向查询外，该网站还提供了多种搜索选项，可以帮助在单一平台上进行全面的侦察：\n\
  \n![](img/Figure_3.11.png)\n\n图 3.11：用于反向查询的 IP IP\n\n下方的图 3.12 展示了反向 IP 查询的结果：\n\
  \n![](img/Figure_3.12.png)\n\n图 3.12：反向 IP 查询响应\n\n为了实性地理解这种 IP 侦察方法，让我们查看 `shodan.io`\
  \ 平台的功能和操作流程。\n\n### Shodan\n\n`Shodan.io` 是一个网络搜索工具，你可以使用不同的过滤器查找不同的互联网服务器。它在互联网上寻找任何人都可以访问的设备，主要关注\
  \ Web 服务器。你必须创建一个账户才能使用 Shodan。要精练使用 Shodan，请采取以下操作：\n\n1.  访问 `shodan.io` 网站并点击\
  \ explore，如下方的图 3.13 所示：\n\n    ![](img/Figure_3.13.png)\n\n    图 3.13：打开 shodan.io\
  \ 并点击“explore”\n\n2.  然后，你可以如上一个图所示探索任何目标区域，以查看可用主机的总数以及按全球国家和组织分组的主机列表。请参考图 3.14\
  \ 的示例：\n\n    ![](img/Figure_3.14.png)\n\n    图 3.14：按全球国家和组织分组的主机列表\n\n3.  要查看详细信息，在\
  \ Shodan 上选择一个特定主机。你将看到开放端口列表和关联的服务。例如，下方的图 3.15 插图了一个基于 IP 的摄像头主机的详情：\n\n    ![](img/Figure_3.15.png)\n\
  \n    图 3.15：开放端口列表及关联服务\n\n4.  为了改进结果，Shodan 上提供了可用于搜索查询的各种过滤器。例如，如果你想找到位于印度且开放了特定端口的主机，可以像图\
  \ 3.16 所示构造搜索查询：\n\n    ![](img/Figure_3.16.png)\n\n    图 3.16：高级搜索过滤器‘country:”IN”\
  \ port:”445”’\n\n基于上述侦察，可以得出以下统计结论：\n\n*   了解目标系统上的开放端口和运行服务的知识将增强漏洞利用尝试的规划和执行。\n\
  *   获取其他关联 IP 地址的列表将扩大攻击攻击面，增加成功攻破目标的概率。\n\n| 注意：此外，可以利用 Shodan 检测连接到互联网的工业控制系统\
  \ (ICS)，如 SCADA 系统，这些系统可能受到网络攻击。 |\n\n### 路由映射\n\n路由映射涉及确定网络流量到达目的地所经过的路径和设备。这有助于修复网络问题，并帮助测试人员发现网络中的弱点和可能的安全问题。\n\
  \n有多种方法可以执行路由映射，包括：\n\n*   Traceroute：`traceroute` 命令通过发送具有较最大生存时间（TTL）的 UDP 探测包，追踪\
  \ IP 数据包到互联网主机的路由，并监听沿途网关的 ICMP `TIME_EXCEEDED` 响应。\n*   Ping：`ping` 是网络管理中使用的简单工具，用于检查特定的\
  \ IP 地址是否可达以及能否接收请求。它被称为 Packet Internet 或 Inter-Network Groper。\n*   Pathping：`PathPing`\
  \ 命令是 Windows 2000 及更高版本中提供的命令行工具，它结合了 `ping` 和 `tracert` 的功能。它允许在单条命令中 `ping` 每个节点，并在较长时间内监控节点的行为，相比于标准的\
  \ `ping`（四次 ping）或 `traceroute`（单条路由）。\n*   MTR：My Traceroute (MTR) 是一个强大的网络诊断工具，结合了\
  \ `traceroute` 和 `ping` 的功能来测试连接性和速度。它可以用于轮询远程服务器并测量随时间变化的延迟，使其成为排除网络问题的价值工具。\n\n\
  让我们在 Windows 机器上使用 `traceroute` 工具来识别网络流量导向目的地的路由和设备。运行如图 3.17 所示的命令：\n\n```\ntracert\
  \ ummedcyber.com\n```\n\n![](img/Figure_3.17.png)\n\n图 3.17：路由映射 (traceroute)\n\n\
  基于上述侦察，可以得出以下结论：\n\n*   路由映射让你能够可视化目标网络，使其更容易理解并有效地规划攻击。\n*   路由映射允许你识别目标网络中的瓶颈，例如发生拥塞的区域。\n\
  *   路由映射通过识别任何缺失的合规性，协助你判断网络是否符合行业要求。\n*   路由映射还可以辅助确定网络上是否存在主机。\n\n### 电子邮件地址\n\
  \n在社会工程学攻击中，电子邮件地址通常是一个关键工具。如果测试人员无法直接进入目标或处于红队活动中，电子邮件可以在用户和测试人员之间建立联系。人的失误有时比技术技巧更能让测试人员进入。\n\
  \n这里有几个开源工具可用于此目的，但在例中，我们将使用 Kali Linux 上的 `EmailHarvester` 包。`EmailHarvester` 是一个可以从搜索引擎获取与特定域名关联电子邮件地址的工具，如图\
  \ 3.18 所示：\n\n运行以下命令：\n\n```\ntheHarvester –d <domainname> -l <data harvest limit>\
  \ -b <source search engine>\n```\n\n![](img/Figure_3.18.png)\n\n图 3.18：电子邮件采集\n\n\
  另一个发现和验证电子邮件地址的工具是 Maltego，我们将在本章的最后一节中详细介绍。\n\n基于上述侦察，可以得出以下结论：\n\n*   渗透人员可以使用电子邮件地址进行社会工程学攻击，并收集有关目标组织的额外信息。\n\
  *   渗透人员可以对目标用户发起钓鱼攻击，以获取关键登录凭据。\n*   渗透人员可以使用电子邮件地址伪装用户，欺骗他人转账或提供敏感信息。\n*   渗透人员还可以发送垃圾邮件，作为策略的一部分，在漏洞利用期间让目标用户忙碌。\n\
  \n### 姓名和号码\n\n通过识别员工的姓名和电话号码，渗透人员可以规划并执行社会工程学攻击，如语音诈骗、短信诈骗和预设攻击。具体来说，一旦攻击者有了人的姓名，他们可以在社交媒体上搜索该个人以确认其在目标组织的工作。确认后，渗透人员就可以开发并实施社会工程学策略，要么直接破坏组织的数字基础设施，要么操纵员工泄露敏感信息。\n\
  \n\n\n\n\n为了理解基于个人姓名和数字的信息收集，我们将在本章的最后一节讨论 Maltego。在本章的最后部分，我们将使用名为 Maltego 的工具深入探讨基于个人姓名和数字收集信息的课题。\n\
  \n| 注意：社会工程是攻击者使用的一种方法，旨在欺骗和操纵个人泄露敏感信息，或执行对其或其组织产生不利的操作。 |\n\n## 密码或泄露数据包\n\n密码或泄露数据包包含了数据泄露中暴露的登录详情和敏感信息。黑客将这些放在网络犯罪分子可以访问的暗网市场。弱密码以及在不同网站上重复使用会导致安全性降低，让测试人员进入在线账户，甚至是社交媒体或虚拟会议。但未经许可或不符合道德使用这些信息可能是错误或非法的。因此，在\
  \ VAPT（漏洞评估渗透测试）中，获得许可并遵守伦道德非常重要。\n\n目前有很多用于数据泄露和密码安全的工具和服务：\n\n*   `Dehashed`:`Dehashed`\
  \ 是一个用于密码安全和防止数据泄露的付费在线平台，为任何泄露及相关的泄露密码提供搜索结果。\n*   `Have I Been Pwned`:`Have I\
  \ Been Pwned` 是一个供用户搜索涉及其电子邮件、用户名或域名的数据泄露，并检查密码泄露状态的网站。\n*   `Password Checkup`:`Password\
  \ Checkup` 是一个 Chrome 扩展，它会自动将保存的密码与已知泄露数据库进行对比以检测泄露。\n*   `SpyCloud`:`SpyCloud`\
  \ 是一个提供密码安全服务的在线平台，包括验证数据泄露参与和分析密码泄露的工具。\n\n## 主动侦察工具与战术\n\n进行主动侦察有许多战术。让我们在实践中讨论其中一些：\n\
  \n### 主机发现\n\n主机发现是网络侦察的第一步，用于识别攻击的潜在目标。它涉及识别目标网络内的活跃主机。传统的主机发现方法是使用 `ICMP echo`\
  \ 来检查主机状态，但这经常会被网络安全措施拦截。尽管如此，主机发现工具仍然具有选项和内置脚本来检查主机状态。\n\n在本例中，我们将使用 `Nmap` 进行主机发现。`Nmap`\
  \ 是“Network Mapper”的缩写，是一种用于网络发现和安全审计的免费开源工具。虽然 `Nmap` 通常在命令行界面中使用，但它也可以通过名为 `Zenmap`\
  \ 的图形用户界面使用。让我们执行 ping 扫描以识别网络上的主机，如图[图 3.19]所示。\n\n运行以下命令：\n```bash\nnmap –v –sP\
  \ 192.168.159.129\n```\n\n在这里，`-v` 标志用于详细输出，提供来自 `nmap` 扫描的详细有序的信息。`-sP` 标志用于 ping\
  \ 扫描。请参考下图：\n\n![](img/Figure_3.19.png)\n\n图 3.19：主机发现扫描\n\n让我们深入探讨下方[表 3.1]中列出的\
  \ `Nmap` 的一些关键实际应用：\n\n| 序号 | 发现技术 | 关联标志 |\n| :--- | :--- | :--- |\n| 01 | 列表扫描\
  \ (List Scan) | `-sL` |\n| 02 | 无端口扫描 (ping 扫描) | `-sn` |\n| 03 | 无 ping 扫描 | `-Pn`\
  \ |\n| 04 | TCP SYN Ping | `-PS` |\n| 05 | TCP ACK Ping | `-PA` |\n| 06 | UDP Ping\
  \ | `-PU` |\n| 07 | SCTP INIT Ping | `-PY` |\n| 08 | ICMP Ping 类型 | `-PE` 或 `PP`\
  \ 或 `-PM` |\n| 09 | IP 协议 Ping | `-PO` |\n| 10 | 无 ARP 或 ND Ping | `--disable-arp-ping`\
  \ |\n\n表 3.1：主机发现技术及关联标志\n\n*   `List scan` (列表扫描)：列表扫描是识别指定网络上主机的基本方法，它仅涉及列出主机而不向它们发送任何数据包。默认情况下，`Nmap`\
  \ 还会对主机进行反向 DNS 解析以确定它们的名称。\n*   `No port scan` (无端口扫描)：无端口扫描选项告诉 `Nmap` 仅识别指定网络上的可用主机，而不在此之后进行端口扫描。\n\
  *   `No ping scan` (无 ping 扫描)：当你运行无 ping 扫描时，会禁用主机发现过程，`Nmap` 将尝试对给定的目标 IP 地址执行指定的扫描，无论主机是否在线。此选项完全消除了主机发现阶段的需求。\n\
  *   `TCP SYN ping`：当向目标主机上的特定端口发送 `TCP SYN` 数据包时，如果主机响应 `SYN-ACK` 数据包，则表示该主机在网络上活跃且可用的。\n\
  *   `TCP ACK ping`：当向目标主机上的特定端口发送 `TCP ACK` 数据包时，如果主机响应 `RST` 数据包，则表示该主机在网络上活跃且可用的。\n\
  *   `UDP ping`：当向目标主机上的特定端口发送用户数据报协议 (`UDP`) 包时，如果主机响应 `ICMP Destination Unreachable`（目标不可达）包，则表示该主机在网络上活跃且可用的。\n\
  *   `SCTP INIT ping`：当向目标主机上的特定端口发送流控制传输协议 (`SCTP`) INIT 包时，如果主机响应 `SCTP INIT-ACK`\
  \ 数据包，则表示该主机在网络上活跃且可用的。\n*   `ICMP ping types`：当向目标主机上的特定端口发送互联网控制消息协议 (`ICMP`)\
  \ 回显请求时，如果主机响应 `ICMP echo reply`（回显回复），则表示该主机在网络上活跃且可用的。\n*   `IP protocol ping`：当发送\
  \ IP 头中设置了特定协议号的 IP 包到目标主机时，如果主机响应 `ICMP protocol unreachable`（协议不可达）包，则表示该主机在网络上活跃且可用的。\n\
  *   `No ARP or ND ping`：地址解析协议 (`ARP`) 用于确定本地网络上与网协议 (`IP`) 地址关联媒体访问控制 (`MAC`) 地址，而邻居发现\
  \ (`ND`) 是用于 IPv6 网络的对应协议。当向目标主机发送 `ARP` 或 `ND` 请求时，如果主机响应 `ARP` 或 `ND` 回复，则表示该主机在网络上活跃且可用的。\n\
  \n| 注意：Ping Sweep 和 Ping Scan 两种技术技术都使用 ICMP 回显请求包来检查主机的可用性，但它们有不同的特定用途。Ping Sweep\
  \ 方法用于在定义的 IP 地址范围内找到所有活跃主机，而 Ping Scan 技术用于确定特定主机的访问性。 |\n\n## 端口扫描\n\n一旦我们识别了网络上的活跃主机，下一步就是确定这些主机上的哪些端口是开放并接受传入连接的。这是通过端口扫描过程实现的，涉及向主机的各种端口发送数据包，以确定哪些端口是开放、关闭或过滤的。\n\
  \n`Nmap` 识别端口的六种状态：\n\n*   `Open` (开放)：主机正在通过 `TCP`、`UDP` 或 `SCTP` 协议在该端口上主动接受传入连接、数据包或关联。\n\
  *   `Closed` (关闭)：目标主机活跃且在线，但在特定端口上不接受传入连接、数据包或关联。\n*   `Filtered` (已过滤)：`Nmap`\
  \ 无法确定端口是否开放，因为到达该端口的探测包被数据过滤拦截了，这可能来自专用防火墙设备、静态路由规则或基于主机的防火墙软件。\n*   `Unfiltered`\
  \ (未过滤)：状态下，端口是可用的，但 `Nmap` 无法确定它是开放还是关闭。\n*   `Open|Filtered` (开放|过滤)：`Nmap` 无法确定端口的状态（是开放还是已过滤），并将其归类为“开放|过滤”。\n\
  \n\n\n\n\n- `Closed|Filtered`: `Nmap` 无法确定端口的状态（是已关闭的还是被过滤的），并将其归类为“close|filtered”。\n\
  \n## 端口扫描技术\n\n端口扫描技术用于识别主机上准备好接收入连接的开放端口。Nmap 提供了多种识别主机上开放端口的技术。要查看如何使用 `nmap`\
  \ 进行端口扫描的演示，请参考图 3.20。\n\n运行以下命令：\n```\nnmap –v –p 22 192.168.159.129\n```\n\n在这里，`-p`\
  \ 标志用于指定我们想要扫描的端口号或范围：\n\n![](img/Figure_3.20.png)\n\n图 3.20：使用 `nmap` 进行端口扫描\n\n\
  让我们探索一些端口扫描方法，详细见下方的表 3.2：\n\n| 序号 | 端口扫描技术 | 关联标志 |\n| :--- | :--- | :--- |\n|\
  \ 01 | TCP 扫描 | `-sT` |\n| 02 | UDP 扫描 | `-sU` |\n| 03 | 隐蔽扫描（半开放扫描） | `-sS` |\n\
  | 04 | FIN 扫描 | `-sF` |\n| 05 | 空包扫描 | `-sN` |\n| 06 | Xmas 扫描 | `-sX` |\n\n表 3.2：NMAP\
  \ 端口扫描技术\n\n- `TCP scan`：TCP 扫描通过向目标主机上的各种端口发送 TCP 数据包来确定目标主机上端口是否开放的方法。TCP 扫描的一个示例是\
  \ TCP 连接扫描，它会与目标端口建立完整的 TCP 连接。这种方法被认为是最可靠且准确的，但也最容易被检测到。\n- `UDP scan`：UDP 扫描通过向目标主机上的各种端口发送\
  \ UDP 数据包来确定目标主机上端口是否开放的方法。\n- `Stealth scan (Half open scan)`：半开放扫描（也称为 SYN 扫描）向目标端口发送一个\
  \ SYN 数据包，如果目标端口开放，主机将用 SYN-ACK 数据包进行响应；如果端口关闭，主机将响应 RST 数据包。\n- `FIN scan`：扫描向目标端口发送一个\
  \ FIN 数据包并等待响应。如果远程主机上的端口开放，它将响应 RST（重置）数据包，显示端口已关闭；如果端口关闭，则不会从远程主机接收到响应，表明端口是开放。\n\
  - `Null scan`：该技术涉及发送 TCP 头部中未设置任何标志位的数据包，即空包。如果远程主机上的端口开放，则不会发送任何响应。如果端口关闭，远程主机将发出\
  \ RST（重置）数据包作为响应。\n- `Xmas scan`：该技术涉及发送 TCP 头部中设置了 FIN、PSH 和 URG 标志位的数据包，即 Xmas\
  \ 包。如果远程主机上的端口开放，它将响应 RST（重置）数据包，表示端口已关闭；如果端口关闭，远程主机将不响应，表示端口是开放。\n\n> 注意：与全开放扫描不同，半开放扫描不会与远程主机完全建立连接，并使连接处于未完成状态。半开放扫描被防火墙和入侵检测系统的检测性较低，因为它们不会创建完整的连接。\n\
  \n## 运行服务与版本检测\n\n一旦识别了目标主机上的开放端口，下一步就是识别每个端口上运行的服务和版本。Nmap 可以通过向目标主机发送一系列探针并分析响应来完成此任务。通过检查响应的横幅（banners）、应用程序版本号或其他标识特征，Nmap\
  \ 可以确定运行在每个端口上的服务和版本。这种服务和版本检测对于识别特定的软件版本非常有用，这些版本可能存在已知漏洞或配置错误，渗透测试人员可以利用这些问题。\n\
  \n要确定服务名称和版本，可以在 Nmap 命令中使用 `-sV` 标志，如图 3.21 所示的示例所示：\n\n运行以下命令：\n```\nnmap –v –p\
  \ 22 –sV 192.168.159.129\n```\n\n![](img/Figure_3.21.png)\n\n图 3.21：使用 `nmap` 进行运行服务和版本检测\n\
  \n## OS 指纹识别\n\n操作系统（OS）指纹识别通过分析发送目标主机的各种数据包的响应来识别目标主机操作系统的过程。Nmap 是此项工作的常用工具，它将响应与其已知\
  \ OS 指纹数据库进行比较，如果找到匹配项，则输出 OS 详情。这些信息对于发现特定操作系统的漏洞和确定某些服务的局限性有用。此外，它还可以通过确定特定操作系统及其版本来验证自动漏洞扫描器的结果。\n\
  \n要确定目标主机的操作系统，可以在 Nmap 命令中使用 `-O` 选项。此外，可以使用 `-A` 选项来启用 OS 检测，如图 3.22 提供的示例所示：\n\
  \n运行以下命令：\n```\nnmap –O 192.168.159.129\n```\n\n![](img/Figure_3.22.png)\n\n图 3.22：使用\
  \ `nmap` 进行 OS 检测\n\n## 目录枚举\n\nWeb 目录枚举是应用程序渗透测试阶段阶段的一种技术。它涉及使用工具和方法（如自动化脚本和手动浏览）来识别并列出目标上的所有目录。有多种枚举工具，如\
  \ `DirBuster`、`Dirb` 和 `Nikto`，它们都有 GUI 和命令行版本。这些工具使用预定义的可能目录列表并向目标应用程序发送请求。然后分析应用程序的响应，并将返回预期响应的目录标记为存在。目录和页面扫描技术可能会发现以下价值信息：\n\
  \n- 该技术的结果可能会揭示错误留在服务器上的机密和隐藏目录。\n- 还可能发现旧的备份和存档。\n- 此外，可能会以明文找到登录凭据。\n- 如果未正确实现授权，可能进行强制浏览（force\
  \ browsing）。\n- 可能泄露有关开发框架和语言的细节，允许攻击者轻松利用漏洞。\n- 发现秘密登录面板也会扩大攻击面。\n\n为了直观地演示目录枚举，我们可以查看图\
  \ 3.23 所示的 `dirb` 工具执行情况：\n\n运行以下命令：\n```\ndirb http://192.168.159.129/mutillidae\n\
  ```\n\n![](img/Figure_3.23.png)\n\n图 3.23：目录枚举\n\n## 硬编码信息\n\n虽然渗透测试期间的主要关注点应该是核心侦察战术，但审查客户端和服务器端的源代码也很重要。这可能会向攻击者泄露关键信息。可以使用各种开源工具（如网络调试器和浏览器扩展）进行源码分析，以识别代码中的缺陷和相关漏洞。此外，还有高级工具可用于自动化源代码审查。此练习的最终目标是识别漏洞，并建议所有者不要在客户端代码中硬编码敏感信息。\n\
  \n在源代码审查期间，渗透人员可以发现以下信息：\n\n- 渗透人员可能提取出硬编码在客户端应用程序或网站中的密码、API 密钥、静态令牌和其他机密数据。\n\
  - 这些信息可用于未经授权访问相关资源。\n- 此外，渗透人员可以利用这种初始访问权限进行权限提升的高级攻击。\n\n\n\n\n\n| 注意：当硬编码信息（如个人身份信息\
  \ PII 或敏感数据）未受到妥当保护时，可能会发生泄露。这可能导致违反 GDPR 或 HIPAA 等法律法规，并引发罚款或罚金。 |\n\n## 侦察额外资源\n\
  \n除了讨论的侦察策略外，还有各种可以根据需要使用的杂杂技术。这些技术在收集目标信息方面非常有效。让我们来讨论一些工具及其实际用法。\n\n## Maltego\n\
