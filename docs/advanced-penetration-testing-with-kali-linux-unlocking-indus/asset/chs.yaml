  \n图 9.71：将混淆后的 payload 上传到 VirusTotal\n\nINFO：Invoke-Stealth 使用混淆和加密生成隐身 PowerShell\
  \ 脚本，以规避杀毒软件检测并执行秘密操作。\n\n### 尖端 WAF 绕过策略\n\nWAF（Web 应用防火墙）是一种专门用于保护 Web 应用免受各种攻击的安全解决方案。通过实施一组规则，WAF\
  \ 会主动识别并阻止恶意请求或可疑活动。\n\nWAF 绕过技术涉及渗透测试人员用于有效规避或绕过 WAF 建立的保护措施的方法。这些测试人员试图绕过 WAF，以识别防火墙保护的\
  \ Web 应用中的潜在漏洞或弱点，这些漏洞可能会被恶意分子利用。通过理解 WAF 绕过机制，渗透测试人员可以评估安全防御的有效性。\n\n绕过 WAF 涉及多种规避其保护措施的手段。以下是攻击者和渗透测试人员用来绕过\
  \ WAF 的常用技术，如表 9.3 所示：\n\n| 技术 |  |\n| :--- | :--- |\n| Payload 混淆 | 修改或编码攻击 payload\
  \ 以规避检测。包括 URL 编码、字符编码等。 |\n| 参数碎片 | 将攻击 payload 分散在多个请求参数或部分以绕过基于模式的规则。 |\n| 协议级绕过\
  \ | 利用 HTTP 规范中的不一致或歧义来操作请求头。 |\n| 操控 HTTP 方法 | 利用不常用的 HTTP 方法（例如 PROPFIND 或 OPTIONS）规避特定的\
  \ WAF 保护。 |\n| IP 和 User-Agent 伪装 | 修改源 IP 地址或 User-Agent 头以伪装成受信实体或模拟合法用户。 |\n\
  | 请求拆用 | 利用服务器解释 HTTP 请求分隔符的差异或在单个连接中处理多个请求。 |\n| WAF 配置错误 | 识别并利用 WAF 规则、白名单或黑名单的配置错误绕过特定保护。\
  \ |\n| 参数污染 | 操纵或重复请求中的参数以混淆 WAF 并可能绕过其过滤机制。 |\n| 慢 HTTP 攻击 | 通过发送数据传输缓慢请求利用服务器资源处理，导致超时或资源耗尽。\
  \ |\n| 加密流量 | 利用加密方法（例如 SSL/TLS）隐藏恶意 payload 以免 WAF 检测。 |\n\n表 9.3：WAF 绕过技术\n\n\
  让我们探索这些技术及其对应的 payload 示例：\n\n* 大小写切换：某些开发不良好的 WAF 根据大小写敏感性过滤 payload。通过组合大小写字符，我们可以绕过这些过滤器。\n\
  \n  示例：\n\n  - 标准 payload：`<script>alert()</script>`\n  - 绕过的 payload：`<ScRiPt>alert()</ScRiPt>`\n\
  \  - 同样，SQL 查询 `SELECT * FROM users WHERE username = ‘ummed’` 可以绕过为 `SeLecT * FRoM\
  \ users WhErE username = ‘ummed’`。\n\n\n\n\n\n### HTML 编码\nWeb 应用程序通常会将特殊字符编码为它们的\
  \ HTML 表示。通过使用 HTML 编码，我们可以绕过某些 WAF 过滤器。\n\n示例：\n- 标准载荷：`<script>alert(1)</script>`\n\
  - 编码后的负载：`&lt;script&gt;alert(1)&lt;/script&gt;`\n- 同样，SQL 查询 `SELECT * FROM users\
  \ WHERE username = ‘admin’` 可以被编码为 `SELECT * FROM users WHERE username = ‘adm&#105;n’`。\n\
  \n### URL 百分编码\n使用 `%` 符号对 URL 负载进行编码有助于绕过 WAF。\n\n示例：\n- 被拦截的负载：`<img src=x onerror=alert(1)>`\n\
  - 绕过的负载：`%3Cimg%20src%3Dx%20onerror%3Dalert%281%29%3E`\n- 同样，SQL 查询 `SELECT * FROM\
  \ users WHERE id = 1 OR 1=1` 可以被绕过为 `SELECT%20*%20FROM%20users%20WHERE%20id%20%3D%201%20OR%201%3D1`。\n\
  \n### Unicode 变换\n利用以 Unicode 编码的 ASCII 字符可以绕过某些过滤器。通过使用 Unicode 表示编码负载，我们可以规避检测。\n\
  \n示例：\n- 标准载荷：`<script>alert(1)</script>`\n- 混淆后的负载：`<script>alert\\u00281\\u0029</script>`\n\
  - 同样，SQL 查询 `SELECT * FROM users WHERE username = ‘admin’` 可以被绕过为 `SELECT * FROM\
  \ users WHERE username = ‘adm\\u0069n’`。\n\n### 混合编码\n通过组合不同的编码，我们可以绕过针对特定编码类型的过滤器。将\
  \ URL 编码与 HTML 编码结合可以产生有效的绕过效果。\n\n示例：\n- 标准载荷：`<script>alert(1)</script>`\n- 混淆后的负载：`%3cscript%3ealert%281%29%3c%2fscript%3e`\n\
  \n### 注释和空格技巧\n在负载中包含注释和空格可以帮助对其进行混淆并绕过过滤器。\n\n示例：\n- 标准载荷：`<script>alert(1)</script>`\n\
  - 混淆后的负载：`<!-- <script> --> alert(1) <!-- </script> -->`\n\n### 负载碎片与拼接\n将负载拆分为碎片或以意料之外的方式拼接它们可以绕过某些\
  \ WAF 过滤器。\n\n示例：\n- 标准载荷：`<script>alert(1)</script>`\n- 碎片化的负载：`<<script>>a<</script>>lert(1)<</script>>`\n\
  \n### 动态负载生成\n通过使用编程语言特性（如拼接）动态生成负载，我们可以绕过 WAF 过滤器。\n\n示例：\n- 标准载荷：`<script>alert(1)</script>`\n\
  - 混淆后的负载：`<script>e%76al(‘a’%2B’lert(1)’)</script>`\n\n### 未初始化变量利用\n在 `Bash` 和\
  \ `Perl` 等脚本语言中使用未定义的变量可以帮助规避基于正则表达式的过滤器和模式匹配。未初始化的变量表现为空或空字符串，允许我们绕过某些检测机制。\n\n\
  示例：\n级别 1 混淆：正常\n- 标准载荷：`/bin/cat /etc/passwd`\n- 混淆后的负载：`/bin/cat$randomVar /etc/passwd$randomVar`\n\
  \n级别 2 混淆：基于位置\n- 标准载荷：`/bin/cat /etc/passwd`\n- 混淆后的负载： `$randomVar/bin$randomVar/cat$randomVar\
  \ $randomVar/etc$randomVar/passwd$randomVar`\n\n级别 3 混淆：随机字符\n- 标准载荷：`/bin/cat /etc/passwd`\n\
  - 混淆后的负载：`$aaaaaa/bin$bbbbbb/cat$ccccccc $dddddd/etc$eeeeeee/passwd$fffffff`\n\n\
  ### 制表符和换行符\n制表符对于规避防火墙有效，特别是基于正则表达式的防火墙。当防火墙期望空格字符而不是制表符时，利用制表符可以破坏其正则表达式。\n\n\
  示例：\n- 标准载荷：`<script>alert(1);</script>`\n- 绕过的负载：`<script> alert(1);</script>`\n\
  - 标准 URL：`http://example.com/page?param1=value1&param2=value2`\n- URL 编码（制表符和换行符）：`http://example.com/page?param1=value1%09%0A&param2=value2`\n\
  \n| 注意：WAF 规避涉及绕过 Web 应用防火墙的保护，使用负载分析、基于协议的攻击和自定义利用等技术来识别受保护 Web 应用程序中的漏洞。 |\n\n\
  ### 演变的社会工程学策略\n社会工程是攻击者使用的一种狡猾策略，用于操纵个人披露敏感信息或绕过安全措施。它利用人类心理和信任来获取系统和数据的未经访问。与传统的渗透测试不同，社会工程工程师侧重于利用人性漏洞，而不仅仅是技术缺陷。这对组织的网络安全构成了重大威胁，因为人通常是安全链中最薄弱的一环。虽然技术漏洞可以通过安全控制来缓解，但并没有万无一失的方法完全防止人类错误和失误。\n\
  \n以下是社会工程攻击中使用的几种技术，可能会损害组织的网络安全：\n\n| 社会工程技术 | 描述 |\n| :--- | :--- |\n| 网络钓鱼 (Phishing)\
  \ | 攻击者利用欺骗性电子邮件，冒充合法来源，诱骗接收者披露机密信息或点击恶意链接。 |\n| 预设场景 (Pretexting) | 攻击者虚构场景或理由，操纵个人披露敏感信息或执行异常操作。\
  \ |\n| 诱饵 (Baiting) | 攻击者在公共区域策略放置物理设备或受感染媒介（如 USB 驱动器），吸引毫无备的个人在不知的情况下执行恶意代码。 |\n\
  | 尾随 (Tailgating) | 攻击者通过紧随员工或冒装成授权人员利用其信任，获得对限制区域或系统的非法访问。 |\n| 身份仿充 (Impersonation)\
  \ | 攻击者伪装成可信的实体（如同事、IT 支持或供应商），欺骗个人共享敏感信息或授予非法访问。 |\n| 反向社会工程 (Reverse Social Engineering)\
  \ | 攻击者在操纵个人执行有害操作或披露机密信息之前，先与其建立信任。 |\n\n表 9.4：社会工程策略\n\n为了增强对社会工程攻击的防护，组织应该采取以下措施：\n\
  - 持续教育：定期向员工普及各种社会工程技术，并持续提高对潜在威胁的意识。\n- 实施零信任策略：采用零信任方法并执行严格的访问控制，结合健壮的验证机制和最小权限原则。\n\
  - 警惕补丁管理：实施有效的补丁管理周期，及时处理并修复已知漏洞，防止攻击者利用它们。\n- 电子邮件过滤和垃圾邮件检测：部署可靠的电子邮件过滤和垃圾邮件检测机制来识别并拦截钓鱼尝试，减少员工落入欺骗陷阱的概率。\n\
  - 定期安全评估：定期进行安全评估（包括模拟社会工程攻击），以识别新兴攻击趋势和漏洞。这使组织能够培训员工最佳实践，并领先于演变的威胁。\n- 多层安全方法：采用综合安全策略，将先进的技术解决方案、持续的员工教育和主动措施相结合。这种多层方法对于有效防御社会工程攻击至关重要。\n\
  \n| 注意：即使部署了全面的安全控制，社会工程攻击仍然是攻破组织的有力手段。人性的脆弱性使得完全防止变得困难，因为毫无防备的受害者会在无意中为攻击者打开通道，这凸显了在技术防御之外解决人性漏洞的重要性。\
  \ |\n\n\n\n\n\n钓鱼攻击（Phishing）是一种安全专业人员和恶意攻击者均使用的评估技术，旨在欺骗并提取敏感信息，包括登录凭据、信用卡详情、业务计划和个人数据。它还可能涉及恶意工具或软件的安装，从而后门、勒索软件攻击或数据泄取等恶意活动。这种欺骗手段通常依赖于伪造电子邮件、即时消息或伪装成合法的网站；诱导毫无防备的用户无意中向未经授权的人员共享机密信息。安全专业人员可以直接或间接地地利用获取的信息来规划和执行高级攻击策略。\n\
  \n### 钓鱼攻击在安全评估中起着重要作用，原因如下：\n\n*   **评估漏洞**：通过模拟钓鱼攻击，组织可以评估员工对此类策略的敏感性。这有助于识别现有安全意识和培训计划中的潜在弱环节。\n\
  *   **提高意识**：钓鱼模拟是教育工具，可以增强员工对钓鱼攻击相关风险和后果的理解。它允许组织开展针对性的培训，从而强化组织的整体网络安全态。\n*  \
  \ **评估事件响应**：钓鱼评估使组织能够评估其事件响应流程和程序的有效性。通过分析员工如何处理模拟钓鱼攻击，组织可以确定事件检测、报告、响应协议以及新安全策略和程序整合方面需要改进的领域。\n\
  \n### 钓鱼攻击方法和方法论\n\n在进行钓鱼安全评估时，组织通常遵循图 9.72 所示的步骤：\n\n![](img/Figure_9.72.png)\n\
  \n图 9.72：钓鱼方法和方法论\n\n1.  **规划**：从定义评估的目标、范围、目标群体和评估参数开始。这可能涉及创建模板、落地页和信息内容。\n2.\
  \  **构建场景**：开发与组织行业、主流通信模式、当前全球事件或趋势话题相符的真实钓鱼邮件或语境。\n3.  **发送与跟踪**：将模拟钓鱼邮件发送给指定的员工或用户组。利用跟踪机制监控收件者的操作，例如邮件打开、链接点击以及凭据/详情提交。\n\
  4.  **分析与报告**：评估钓鱼评估的结果，包括打开率、点击率、响应率和事件报告。评估安全控制的有效性，找出需要改进的领域，并生成包含可操作建议的综合报告。\n\
  5.  **培训与意识**：根据评估结果，提供针对性的培训和意识计划，教育员工有关钓鱼攻击的风险、技术和预防措施。加强对安全最佳实践的遵循，以增强应对真实世界钓鱼尝试的韧性。\n\
  \n以下是行业内一些广泛认可的开源钓鱼模拟器：\n\n*   Gophish\n*   LUCY\n*   Simple Phishing Toolkit (sptoolkit)\n\
  *   Phishing Frenzy\n*   King Phisher\n*   SpeedPhish Framework (SPF)\n*   Social-Engineer\
  \ Toolkit (SET)\n\n为了从实践上理解这一点，这里介绍 Gophish 的设置。\n\n### Gophish\n\nGophish 是一个开源钓鱼框架，通常用于模拟钓鱼活动和评估组织的安全意识。它具有用户型的\
