  \ 通用漏洞评分系统\n\n### 按严重性划分的漏洞\n该组件列出了所有观察结果及其相应的 CVSS 评分和相关严重性。在重新验证期间，可以使用相同的表格来指示状态，即漏洞是已关闭还是仍开启。以下是漏洞分布部分的示例，如图图\
  \ 10.7 所示：\n\n![](img/Figure_10.7.jpg)\n图 10.7: 按严重性划分的漏洞\n\n### 详细报告\n该章节是 VAPT\
  \ 评估报告的核心或主信息存储库，包含了上述组件中呈现的所有信息。它专门为开发人员和 DevOps 团队提供技术细节，以便理解问题及其影响，并遵循技术修复步骤。此部分包含以下信息：\n\
  * 漏洞名称\n* CVSS 评分\n* 严重性\n* 描述\n* 受影响的端点\n* 概念证明 (PoC)\n* CVE 和 CWE 的引用\n* 影响\n\
  * 修复\n* 参考文献\n\n以下是详细报告部分的示例，如图图 10.8 所示：\n\n![](img/Figure_10.8.jpg)\n图 10.8: 详细报告\n\
  \n### 附件 -1\n该组件旨在涵盖目标的所有侦察数据，包括在侦察阶段收集的任何信息，无论是否用于渗透测试。它由以下信息组成：\n* 开放端口\n* 运行的服务\n\
  * Web 树图\n\n以下是附件-1 示例，如图图 10.9 所示：\n\n![](img/Figure_10.9.jpg)\n图 10.9: 附件 -1\n\
  \n| 提示：此附件有两个用途：首先，它为客户提供了评估的完全透明度；其次，有时看起来并不严重的侦察数据可以为资产所有者提供可操作的智能。例如，识别资产上运行的不必要服务有助于减少攻击面。\
  \ |\n\n### 附件 -2\n该组件涵盖了以下列出的信息，这些信息可能没有直接用，但展示了审计组织的能力：\n* VAPT 方法和方法论\n* 领域专家\
  \ (SME) 详情\n* 服务组合\n\n以下是附件-2 部分示例，如图图 10.10 和图 10.11 所示：\n\n图 10.10 展示了 VAPT 方法和方法论，展示如下：\n\
  \n![](img/Figure_10.10.jpg)\n图 10.10: 附件 -2 (VAPT 方法和方法论)\n\n图 10.11 展示了服务提供公司 SME\
  \ 和服务组合的深度视图，概述如下：\n\n![](img/Figure_10.11.jpg)\n图 10.11: 附件 -2 (SME 和服务组合)\n\n\
  此外，为了全面了解漏洞评估报告中应涵盖的特定细节，以及渗透测试报告所需的额外深度信息，让我们在下面详细探讨其中的每一个部分：\n\n## 漏洞评估报告\n漏洞评估报告\n\
  \n漏洞评估 (VA) 报告的编写涉及记录对系统、网络或应用程序进行漏洞评估的发现和结果。报告应全面列出所有识别出的漏洞，无论其可利用性如何。在详细解释漏洞实例时，必须包含以下信息作为最低基准：\n\
  * 漏洞名称\n* CVSS 评分\n* 严重性\n* 漏洞优先级评分\n* 描述\n* CVE 或 CWE 引用\n* 影响\n* 修复\n* 参考文献\n\n\
  ## 渗透测试报告\n渗透测试报告\n\n渗透测试 (PT) 报告作为渗透测试人员与客户之间的正式通信，展示对系统、网络、API、云或应用程序进行渗透测试的结果。在详细描述漏洞实例时，PT\
  \ 报告应包含以下基本信息：\n* 漏洞名称\n* CVSS 评分\n* 严重性\n* 漏洞优先级评分\n* 描述\n* POC\n* 重现步骤\n* CVE\
  \ 或 CWE 引用\n* 影响\n* 修复\n* 参考文献\n\n| 提示：最初，审计组织应以 CSV 格式将报告草案提交给被审计组织。在与被审计方就所有发现达成一致后，可以准备并共享带密码的\
  \ PDF 报告。 |\n\n## 风险评估与优先级排序\n风险评估与优先级排序\n\n\n\n\n\n# 风险评估和排序对于 VAPT（漏洞评估与渗透测试）和技术风险评估至关重要。它涉及识别和评估可能影响组织的潜在风险和漏洞。通过根据严重性和关键性对风险进行排序，组织可以专注于解决漏洞并加强安全防护。定期的风险评估有助于组织保持警惕并灵活应对威胁。\n\
  \n## 为了有效评估量化风险\n\n在 VAPT 中，量化风险意味着为漏洞严重性、资产类型、关键性、环境、利用易用性和安全控制有效性等因素分配数值。可以使用不同的方法（如风险评分模型和矩阵）来进行量化。它们有助于评估与每个漏洞相关的风险并确定修复优先级。下面展示了图\
  \ 10.12 所示所示基于风险分的漏洞优先级评分（VPR）矩阵示例：\n\n![](img/Figure_10.12.png)\n\n图 10.12：风险量化\n\
  \n为了更好地理解，让我们考虑一个真实世界的场景来确定漏洞修复的优先级：\n\n### 场景\n\n在一个既面向互联网又是生产环境一部分的高价值资产中，发现了一个\
  \ `CVSS` 分值为 `9.1` 的严重级漏洞。此外，该漏洞的已知利用程序已公开。\n\n为了计算 `VPR`，对每个所需的指标分配分值如下，如表 10.2\
  \ 所示：\n\n| 序号 | 指标 | 名称 | 评分 |\n| :--- | :--- | :--- | :--- |\n| 1 | 漏洞严重性 | 严重\
  \ | 20 |\n| 2 | 资产类型 | 生产 | 20 |\n| 3 | 资产关键性 | 高价值资产 | 20 |\n| 4 | 资产环境 | 面网资产\
  \ | 20 |\n| 5 | 利用易用性 | `CVSS>8` | 15 |\n\n表 10.2：漏洞优先级评分 (VPR) 矩阵\n\n总分为 `95`，属于\
  \ `P1` 类别，需要立即关注以处理发现的问题。\n\n| 提示：风险量化和评估提供了优先级、数据驱动的决策、资源优化、主动安全、合规性遵守、业务连续性以及更好的利益相关者沟通，从而增强风险管理。\
  \ |\n\n## 利用 CVSS 分值\n\n通用漏洞评分系统 (`CVSS`) 是评估漏洞严重性的广泛采用的行业标准。它分配从 `0` 到 `10` 的数值分，分数越高表示漏洞越严重。这些分值帮助安全人员优先处理发现的问题，并协助组织或客户制定有效的补丁策略。\n\
  \n## 影响 CVSS 分值的因素\n\n以下是影响 `CVSS` 分值的因素，如表 10.3 所示：\n\n| CVSS 分值类型 |  |\n| :---\
  \ | :--- |\n| 基础分 (Base Score) | 基础分代表漏洞对目标系统的潜在影响，完全基于内在特性，不考虑时间或环境因素。用于计算基础分的指标有：•\
  \ `AV` (攻击向量) `AC` (攻击复杂度) `PR` (所需权限) `UI` (用户交互) `S` (范围) `C` (机密性) `I` (完整性)\
  \ `A` (可用性) |\n| 时间分 (Temporal Score) | 时间分考虑了随时间变化的动态因素，这些因素影响漏洞的整体严重性。计算包含了以下指标：•\
  \ `E` (利用代码成熟度) `RL` (修复水平) `RC` (报告置信度) |\n| 环境分 (Environmental Score) | 环境分考虑了组织环境和基础设施的独特特征。它涉及以下指标：•\
  \ 修改后的基础指标 `CR` (机密性需求) `IR` (完整性需求) `AR` (可用性需求) |\n\n表 10.3：影响 CVSS 分值的因素\n\n\
  定性严重性评分标准可以适用于所有类型的 `CVSS` 分值，如下表 10.4 所示：\n\n| 严重性 | 分值范围 | 颜色编码 |\n| :--- | :---\
  \ | :--- |\n| 严重 (Critical) | `9.0 - 10.0` | |\n| 高 (High) | `7.0 - 8.9` | |\n|\
  \ 中等 (Medium) | `4.0 - 6.9` | |\n| 低 (Low) | `0.1 - 3.9` | |\n| 无 (None) | `0.0`\
  \ | |\n\n表 10.4：定性严重性评分标准\n\n## 恰地解释和应用 CVSS 分值\n\n在本节中，我们将通过真实的漏洞示例深入探讨计算 `CVSS`\
  \ 分值的详细过程。我们将通过一个场景来说该过程，然后对每个指标及其相应值提供全面的解释。\n\n### 示例 1：SQL 注入漏洞。\n\n在这里，我们将深入探讨特定场景的\
  \ `CVSS` 分值计算，概述如下：\n\n*   描述：电子商务平台允许用户通过在搜索栏中输入关键词搜索产品。然而，网站的 `SQL` 查询缺乏适当的验证，由于它直接将用户输入整合到查询中，因此容易受到\
  \ `SQL` 注入攻击。\n*   漏洞：该漏洞的存在源于对用户输入的处理不当，使渗透人员能够向查询中注入恶意的 `SQL` 代码。\n*   攻击：渗透人员在搜索栏中巧妙地构造了一个恶意输入，改变了查询的行为，并使其绕过了原始搜索条件，从而从产品表中检索了所有记录。\n\
  *   CVSS 分值和向量字符串：\n```\n7.5 & CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N\n```\n\
  *   CVSS 3.1 基础分指标解释：我们将使用网站 `https://www.first.org/` 计算分值，如图 10.13 所示：\n\n![](img/Figure_10.13.png)\n\
  \n图 10.13：基础分指标解释\n\n表 10.5 提供了每个指标的解释以及它们分配的值和注释：\n\n| 指标 | 值 | 注释 |\n| :--- |\
  \ :--- | :--- |\n| `AV` (攻击向量) | 网络 | 攻击向量被指定为“网络”，因为攻击者可以通过网站的搜索功能远程利用该漏洞。 |\n\
  | `AC` (攻击复杂度) | 低 | 攻击复杂度被归类为低，因为攻击者不需要任何特殊条件或资源即可利用漏洞。 |\n| `PR` (所需权限) | 无 |\
  \ 攻击者执行 `SQL` 注入攻击不需要任何权限。 |\n| `UI` (用户交互) | 无 | 攻击不需要用户交互。 |\n| `S` (范围) | 未改变\
  \ | 攻击的影响限于 Web 应用程序，不影响其他组件。 |\n| `C` (机密性) | 高 | 攻击导致高机密性影响，因为它允许对敏感数据（包括客户信息）进行未经授权的访问。\
  \ |\n| `I` (完整性) | 无 | 攻击不直接影响数据完整性。 |\n| `A` (可用性) | 无 | 攻击不直接影响系统可用性。 |\n\n表 10.5：CVSS\
  \ 指标解释\n\n### 示例 2：权限提升\n\n*   描述：在一个电子商务 Web 应用中，用户可以注册并使用登录页面访问账户。遗憾的是，应用程序包含一个便于权限提升的漏洞，允许渗透人员获得对系统的未经授权管理访问。\n\
  *   漏洞：Web 应用程序的漏洞源于不充分的用户验证和授权过程。具体而言，应用程序在处理请求期间未能充分验证用户权限，导致攻击者能够操纵其访问权限。\n\n\
  \n\n\n\n-   **攻击**：为了利用权限提升漏洞，渗透测试人员巧妙地构造针对 Web 应用程序的恶意请求。通过篡改请求参数或使用特定方法，测试人员获得了操纵其用户角色或权限的能力，可能访问未授权的功能或敏感数据。\n\
  \n-   **CVSS 分数与向量字符串**：\n`7.5 & CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N`\n\
  \n### CVSS 3.1 基础分指标解释\n\n我们将使用网站 [`www.first.org/`](https://www.first.org/) 计算分数，如图\
  \ 10.14 所示：\n\n![](img/Figure_10.14.png)\n\n图 10.14：基础分指标解释\n\n下表 10.6 提供了每个指标的解释及其分配的值和注释：\n\
  \n| 指标 | 值 | 描述 |\n| :--- | :--- | :--- |\n| AV (攻击向量) | 网络 | 漏洞可以通过网络远程利用，因此攻击向量归类为“网络”。\
  \ |\n| AC (攻击复杂度) | 低 | 攻击复杂度较低，因为权限提升所需的精力极少，且不需要特殊条件。 |\n| PR (所需权限) | 低 | 攻击者最初需要基本用户权限来启动攻击，但可以提升权限以获得管理访问。\
  \ |\n| UI (用户交互) | 无 | 不需要任何用户交互。 |\n| S (范围) | 未改变 | 漏洞的影响局限于应用程序环境，不影响其他组件。 |\n\
  | C (机密性) | 高 | 权限提升导致敏感数据的大量丢失。 |\n| I (完整性) | 高 | 权限提升允许对敏感数据进行未经授权的修改，构成了严重的完整性风险。\
  \ |\n| A (可用性) | 无 | 权限提升漏洞不会影响应用程序或系统的可用性。 |\n\n表 10.6：CVSS 指标解释\n\n> **提示**：在\
  \ VAPT 评估中使用 CVSS 计算可以带来许多益处，例如一致的严重性分、数据驱动的风险优先级排序、高效的漏洞分析、准确的影响评估，以及与利益相关者进行更好的沟通以实现有效的决策。\n\
  \n### 网络安全评估报告类型](#contents.xhtml_sc2_283a)\n\n不同的网络安全评估报告具有特定的目标和关注领域。常见的 VAPT\
  \ 评估报告包括以下类型：\n\n#### 执行摘要报告](#contents.xhtml_sc3_284a)\n\n执行摘要报告是一份面向高层利益相关者（如\
  \ C 级高管和管理层）编写的简要非技术性文档。它概述了 VAPT 评估的关键发现、严重漏洞和安全风险。它还概述了评估范围和风险态势，帮助决策者做出明智的网络安全改进和风险缓解策略。为了更好地理解此报告，请参考本章开头“编写良好的报告的组件”部分下的“执行摘要”子章节。\n\
  \n#### 详细技术评估报告](#contents.xhtml_sc3_285a)\n\n详细技术评估报告是一份为技术人员（如 IT 团队、DevOps、开发人员人员和系统管理员）设计的综合文档。该报告提供了每个漏洞的详细描述、其严重性、影响以及建议的修复步骤。它还包含\
  \ POC（概念证明）以说明风险的严重性。其主要目的是帮助技术专家理解漏洞并为组织的 IT 基础设施实施有效的安全措施。此报告将遵循本章开头“编写良好的报告的组件”部分中说明的指南。\n\
  \n#### 漏洞管理跟踪器](#contents.xhtml_sc3_286a)\n\n漏洞管理 (VM) 跟踪器是监控和管理 VAPT 等评估期间发现的安全漏洞的实用工具。它充当中心数据库，根据严重性记录并优先处理漏洞。VM\
  \ 跟踪器有助于与客户实时共享关键发现结果，以便及时解决。安全团队可以分配负责人、设置截止日期并跟踪进度，以实现有效的漏洞管理。图 10.15 显示了漏洞管理跟踪器的示例：\n\
  \n![](img/Figure_10.15.png)\n\n图 10.15：漏洞管理跟踪器\n\n> **提示**：一份良好的 VAPT 报告包含执行摘要、范围、方法论、详细的漏洞发现、风险评估、修复建议、合规性遵守以及用于清晰化的视觉辅助工具。\n\
  \n### 详细报告示例](#contents.xhtml_sc2_287a)\n\n虽然 VAPT 和技术安全评估有许多垂直领域，但我们将关注 IT 格局的几个关键方面来提供报告示例。\n\
  \n#### Web 应用 VAPT 报告编写示例](#contents.xhtml_sc3_288a)\n\nWeb 应用 VAPT 报告提供了对某个 Web\
  \ 应用程序进行评估的全面概述。我们将使用技术漏洞（如 `SQL Injection`）的示例来说明报告的编写，并理解解释特定漏洞实例所需的关键细节，如下所示所示：\n\
  \n在图 10.16 中，漏洞名称、严重性、CVSS 分数、描述、受影响端点以及相应的概念证明所示：\n\n![](img/Figure_10.16.jpg)\n\
  \n图 10.16：Web 应用程序 VAPT 报告编写示例\n\n图 10.17 展示了完整的概念证明 (POC) 以及下方列出的分步复现说明：\n\n![](img/Figure_10.17.jpg)\n\
  \n图 10.17：Web VAPT 报告编写示例\n\n图 10.18 显示了 CVE/CWE 引用、影响、修复步骤和参考文献，呈现如下：\n\n![](img/Figure_10.18.jpg)\n\
  \n图 10.18：Web VAPT 报告编写示例\n\n#### 网络 VAPT 报告编写示例](#contents.xhtml_sc3_289a)\n\n\
  网络 VAPT 报告提供了对网络资产进行评估的全面概述。我们将使用 `EternalBlue SMB 远程代码漏洞` 的示例来演示报告编写，并理解解释特定漏洞实例所需的最小信息，如图\
  \ 10.19、10.20 和 10.21 所示：\n\n![](img/Figure_10.19.jpg)\n\n图 10.19：网络 VAPT 报告编写示例\n\
  \n![](img/Figure_10.20.jpg)\n\n图 10.20：网络 VAPT 报告编写示例\n\n![](img/Figure_10.21.jpg)\n\
  \n图 10.21：网络 VAPT 报告编写示例\n\n### 使用 DefectDojo 进行自动化漏洞管理](#contents.xhtml_sc2_290a)\n\
  \n漏洞管理对于保护组织的数字资产、维护发现记录、优先级排序和跟踪补丁状态同时确保问责至关重要。在讨论中，我们将探索使用开源平台 `DefectDojo` 进行自动化漏洞管理。\n\
  \nDefectDojo 是一个安全编排和漏洞管理平台。它有助于应用程序安全计划管理、跟踪产品和应用程序详情、评估漏洞，并集成 `JIRA` 和 `Slack`。该平台使用随使用不断改进的启发式算法完善漏洞数据。你可以从以下链接下载并安装\
  \ DefectDojo：[`github.com/DefectDojo/django-DefectDojo`](https://github.com/DefectDojo/django-DefectDojo)。\n\
  \n\n\n\n\n以下是 DefectDojo 的一些优势：\n\n*   集中化漏洞管理：DefectDojo 提供了一个中心平台，用于管理和跟踪跨应用程序和基础设施组件的漏洞。\n\
  *   无缝漏洞扫描集成：该平台可以轻松与各种漏洞扫描工具集成，自动导入并分析扫描结果。\n*   改进风险评估：DefectDojo 根据严重程度、影响和可利用性对漏洞进行风险评分，通过优先处理关键问题来实现评估。\n\
  *   高效的报告和指标：可自定义的报告和指标有助于理解安全态势、识别趋势并做出明智决策。\n*   增强协作与通信：与 `JIRA` 和 `Slack` 等工具集成促进了安全团队、开发人员和利益相关者之间的良好协作。\n\
  *   历史跟踪和趋势分析：该平台维护漏洞的历史记录，能够进行趋势分析并实现持续的安全改进。\n\nDefectDojo 拥有直观且用户友好的界面，使安全人员和开发人员能够轻松访问并直观操作。现在，让我们深入探讨\
  \ DefectDojo 的一些关键功能：\n\n*   **Dashboard（仪表板）**：DefectDojo 中可自定义的仪表板展示了核心指标、图表和图形，提供了漏洞、风险趋势和整体安全进展的快速概述。用户可以轻松监控正在进行的活动、风险接受和其他相关的安全数据，如图\
  \ 10.22 所示。\n*   **Add Engagement（添加活动）**：通过 `Add Engagement` 功能，DefectDojo 允许用户创建和管理安全活动，代表特定的项目或测试活动。用户可以包含名称、开始和结束日期以及描述等基本细节，简化各种计划的组织和跟踪，如图\
  \ 10.23 所示。\n*   **Add new finding（添加新发现）**：此功能允许用户向活动添加新发现。要执行此操作，导航到 `Engagements`，选择特定的活动，点击\
  \ `Findings`，然后点击 `Add Finding`，如图 10.24 所示。\n*   **Risk acceptance（风险接受）**：风险接受在漏洞管理中起着至关重要的作用。DefectDojo\
  \ 的 `risk acceptance` 功能简化了根据特定标准（如业务影响、补偿控制或风险忍度）审查和接受漏洞的过程，如图 10.25 所示。\n*   **Metrics\
  \ dashboard（指标仪表板）**：DefectDojo 中的指标仪表板提供了各种指标的概述，包括按每月划分开放漏洞、按每月接受的风险以及给定范围内按严重程度分类的发现数量。这种视觉化表示如图\
  \ 10.26 所示，由于页面长度过长，无法在一个快照中显示有关组织漏洞格局和安全趋势的所有信息，因此可见性有限。\n\n注意：此外，DefectDojo 还提供了多种功能，包括支持服务水平协议（`SLAs`）以管理漏洞修复。有了\
  \ `SLAs`，安全团队可以确保及时解决漏洞，并保持与内部或外部标准的兼容。DefectDojo 的开发归功于做出贡献的专业人士。\n\n### 结论\n\n\
  在本章中，我们深入研究了报告编写这门关键艺术，这对于全面评估至关重要。我们探索了各个方面，例如编写良好的报告的组成部分、利用 `CVSS` 评分以及用于有效排序的风险评估。我们还涵盖了不同类型的网络安全报告，并为\
  \ Web 应用程序和网络提供了详细报告。此外，我们学习了使用 DefectDojo 进行自动化漏洞管理的益处。在本章结束时，您应该已经在创建有影响力和标准化的报告、有效通信发现以及增强整体安全流程方面获得了宝贵的见解。\n\
  \n通过在本书中深入研究 `VAPT` 方法、工具集、技术和报告，您已经具备了进行成功评估的知识。通过采用系统的方法并利用面向行业的方法论，您可以成为一名熟练的渗透测试员或网络安全领域需求量大的专家（SME）。\n\
