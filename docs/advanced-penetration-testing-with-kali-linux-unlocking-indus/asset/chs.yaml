  \n![](img/fm1.png)\n\n# 第 1 章：从高级渗透测试开始 (contents.xhtml_ch01a)\n\n### 引言 (contents.xhtml_sc2_1a)\n\
  \n渗透测试 (PT) 是一种法律授权的实践，旨在识别计算机系统中的技术和逻辑缺陷，并评估组织的安全控制、监控能力和事件响应程序。随着技术的不断进步，攻击面的复杂性不断增加，使得漏洞评估与渗透测试\
  \ (VAPT) 成为缓解潜在威胁的一种关键且成熟的方法。通过提供对组织安全态的洞察和准确的修复解决方案，VAPT 可以保护企业免受数据泄露和未经授权的访问。\n\
  \n今天，采用零信任策略已成为组织安全的关键组成部分，VAPT 也不例外。它在确保对来自应用程序和设备的输入进行适当验证方面发挥着重要作用。\n\n本章涵盖了\
  \ VAPT 项目规划、管理和治理的基本原则。它还深入了人员、流程和技术 (PPT) 框架，该框架有助于明确个人、流程和技术在 VAPT 实践中的作用。本章进一步探讨了\
  \ VAPT 方法论和方法，使渗透测试人员获得具有行业导向的实践理解。通过这种理解和敏捷的方法，渗透测试人员可以顺畅高效地执行企业级的测试实践。\n\n在开始项目之前，约前技术可以帮助审计组织清楚地理解客户的范围和需求，并相应招募必要的工具集、人力交付物。此外，为了为你的组织选择最合适的安全评估，你必须熟悉市场上提供的网络安全产品，并理解它们之间的差异。\n\
  \n\n\n\n\n> 注意：定期的漏洞评估和渗透测试是识别、优先排序、报告和修复计算机基础设施中薄弱安全实践、威胁和漏洞的必要活动。通过定期执行这些活动，组织可以主动缓解潜在威胁，并保护其系统免受恶意攻击。\n\
  \n## 结构\n\n在本章中，我们将讨论以下主题：\n\n*   VAPT 基础知识\n*   高级渗透测试技术与策略\n*   VAPT 的业务需求与合规性要求\n\
  *   VAPT 的行业方法和方法论\n*   安全审计标准与框架：最佳实践\n*   与客户的前期交互\n*   设计安全审计的工作范围（Scope of Work）\n\
  *   VAPT 中的项目规划与治理\n*   VAPT 中的交付与客户成功策略\n\n## 目标\n\n本章的主要目标是为网络安全专业人员和组织提供对高级 VAPT\
  \ 方法和方法的深入理解。通过阅读本章，你不仅将学习 VAPT 方法，还将学习其标准、框架、范围设计、客户参与、项目管理、治理以及客户成功策略。\n\n高级 VAPT\
  \ 方法和方法可以根据严重程度有效识别识别并优先处理漏洞，使组织能够集中精力解决最关键的漏洞。这种方法可以提高 VAPT 流程的整体效率，并带来更成功的成果。本章对于寻求理解为何需要\
  \ VAPT 服务，以及根据相关法规或行业标准确定哪些服务对其业务最有帮助个人和组织也有益。\n\n## VAPT 基础知识\n\n漏洞评估与渗透测试（VAPT）是一种系统化的、基于风险的方法，用于识别计算机基础设施中的安全漏洞。VAPT\
  \ 审计结合了自动化工具和人工操作来检测恶意攻击者可能利用的所有潜在漏洞。\n\n漏洞生命周期是指漏洞从发现到解决的阶段。`Figure 1.1` 提供了该过程的可视化表示：\n\
  \n![](img/Figure_1.1.png)\n\n图 1.1：漏洞生命周期\n\n## 漏洞评估\n\n漏洞评估（`VA`）只能检测目标系统中的弱点。然而，它无法区分可能被利用并对系统造成损害的发现。\n\
  \n## 渗透测试\n\n渗透测试（`PT`）是基于漏洞评估结果的顺序性活动。在此过程中，渗透测试识别漏洞并利用它们获取访问权限并外泄数据。此外，渗透测试通过通过利用后获得的访问对系统进行评估，以确定可访问数据的敏感性。\n\
  \n例如，如果指纹识别（banner grabbing）识别出过时的服务版本，且渗透测试人员在报告中包含了相关的 `CVEs/CWEs`，那么这将归类为漏洞评估。然而，如果渗透测试人员能够通过利用漏洞访问服务器或获得所需的响应，那么这将属于渗透测试的范畴。\n\
  \n> 注意：渗透测试人员不应满足于仅识别出易见的漏洞并停止工作。鉴于攻击面日益增加复杂，需要大量的精力才能彻底测试并确保系统免受潜在威胁的影响。\n\n##\
  \ 高级渗透测试技术与策略\n\n十年前，当组织还没有优先考虑网络安全时，基本的技术知识就足够使用自动化工具进行漏洞扫描了。然而，这种方法现在只能识别已知的和技术性漏洞。随着技术和\
  \ VAPT 方法论的演变，现代化至关重要。例如，攻击载荷必须是高级的且完全不可检测的（`FUD`），才能有效绕过安全控制。建立以目标为导向的测试方法，定义为什么审计期间需要绕过网络防火墙或\
  \ Web 应用防火墙。高级 VAPT 方法使用更复杂的工具和技术来检测和利用漏洞，提供了许多好处，如图 `Figure 1.2` 所示。\n\n![](img/Figure_1.2.png)\n\
  \n图 1.2：高级 VAPT 方法\n\n为了确保及时全面地检测所有漏洞，你的基于风险的方法必须既敏捷又先进。高级渗透测试不仅帮助你检测漏洞，还能为你的计算机基础设施识别最有效的安全控制。渗透测试人员必须具备全面的理解和技能组合，以准确审计业务的关键敏感区域。\n\
  \n传统的 VAPT 资产发现阶段曾被认为是最重要的，现在已演变为攻击面管理。这是一种计划的方法，用于持续发现、盘点、标记和监控组织基础设施中 IT 资产的状态。攻击面在不断变化，对于各种规模的组织来说都是关键考虑因素。通过实施有效的攻击面管理实践，系统所有者首席安全官（CISO）都可以获得组织\
  \ IT 基础设施的可见性。\n\n> 注意：在某些情况下，系统业务逻辑流中的漏洞产生可能比技术漏洞更大，因为利用此类漏洞可能需要较少的技术知识和较小的工具集。\n\
  \n## VAPT 的业务需求与合规性要求\n\n今天，进行 VAPT 活动对所有企业来说都至关重要，并被作为确保数据安全的常规做法。VAPT 是一种实用且经过证明的方法，帮助企业识别、分析、优先排序和缓解风险。漏洞可能存在于任何地方，例如软件、硬件或通信中，但密集的测试方法可以深入研究，并在黑客利用之前修复漏洞。每个业务都需要对其整个攻击面进行全面评估，以确保其信息技术（`ICT`）免受已知和未知威胁的影响。\n\
  \n> 注意：每个应用程序在处理用户输入时应谨慎，确保所有输入都经过妥善清理，并且仅在符合批准格式时才进行存储。\n\n数据和应用程序的便捷访问通常是企业的首要任务，但安全合规性可能会带来挑战。这些要求可能与业务需求冲突，很难在两者之间平衡。定期的\
  \ VAPT 审计对于识别和解决漏洞以及确保合规是必要的。风险接受和监控对于检测和响应针对安全控制和终端的网络攻击至关重要。\n\nVAPT 活动的范围应涵盖网络、网站、软件、无线网络、移动应用程序、API、容器、云服务、社交平台和安全设备。在某些情况下，可能还需要物理渗透测试来模拟真实威胁，并在组织内部建立强大的安全生态系统。\n\
  \nVAPT 为组织提供了巨大的益处，例如：\n\n*   提供组织 IT 基础设施的全面可见性\n\n\n\n\n\n*   协助映射和管理攻击攻击面\n*\
  \   提升组织的整体安全态势\n*   便于根据业务背景创建威胁模型\n*   识别并解决漏洞\n*   实现风险管理和安全措施实施\n*   协助选择合适的安全实践和安全控制措施\n\
  *   辅助设计安全架构并实施相关控制措施\n\n| Note：VAPT 审计报告必须提交给合规和监管机构，因此，报告包含全面且组织良好的信息对于有效完成审计至关重要。\
  \ |\n\n## VAPT 中的工业化方法和方法论\n\n尽管学术界有其优点，但面向工业的方法和方法论由于其结合了实战挑战而优于学术界。得益于自动化的进步，审计公司现在只需少量关键细节，即可为任何项目创建定制的方法和方法论。\n\
  \n该方法和方法论通常包含以下阶段：\n\n![](img/Figure_1.3.png)\n\n图 1.3：VAPT 的工业化方法和方法论\n\n## 目标设定\n\
  \n为了建立成功的 VAPT 实践，被审计组织必须明确定义其目标。这涉及在目标设定过程中，让相关的利益相关者（如开发者、管理员、保管人和基础设施所有者）参与。练习目标还应该概述进行\
  \ VAPT 的特定原因以及预期输出，以符合监管指南并满足业务需求。如果不将安全实践与业务需求对齐，将无法实现预期目标。\n\n## 启动会议\n\n启动会议是审计团队与被审计团队之间至关重要的聚会，包括双方的发言人和项目经理。它提供了一个讨论前提条件、项目规划以及介绍团队成员的机会。如果需要，双方团队还应该讨论如何从相关部门获得必要的许可和法律授权。在会议期间，还可能决定交付计划、方法、材料和预期时间范围。\n\
  \nRACI 矩阵（也称为责任分配矩阵或 RACI 图表）是一种非常有价值的工具，用于定义和记录项目或过程中个人或团队的角色和职责。它能有效地传达谁负责完成项目中的每个任务或决策。这一事实通过升级矩阵得到了进一步强调，当直接负责人员未予响应或表现不佳时，升级矩阵就会发挥作用。在这种情况下，升级矩阵会触发将问题提交到下一级进行解决。\n\
  \n## 情报收集\n\n它涉及对目标进行侦察以收集尽可能的信息，然后将其用于漏洞评估和利用。这些丰富的信息能够精确地设计、开发和执行额外的攻击向量。情报可以分为两个部分：\n\
  \n### 被动情报\n\n被动情报涉及在目标未察觉到任何情报收集活动的情况下收集信息。它依赖于公开的资源，例如搜索引擎、社交媒体平台、招聘网站、网络存档、数据泄露和暗网论坛。利用这些资源收集情报时，测试人员与目标之间没有直接的连接或交互。然而，由于其无连接的特性，这种方法可能包含一些误报情报。\n\
  \n### 主动情报\n\n这是一种主动的方法，测试人员直接与目标交互以获取更精确的信息。主动情报涉及收集关键数据，例如技术、框架、DNS 枚举、端口、服务、操作系统指纹、子域名、目录、页面、安全控制等。然而，这应该只在获得相关部门的法律和管理批准后才能进行。\n\
  \n## 威胁建模\n\n威胁建模是一个系统的过程，有助于识别和列举潜在威胁，例如架构缺陷和安全控制不当。防御措施的选择和实施取决于威胁可能造成的损害以及控制的成本。通过威胁建模，可以回答关键问题，例如“对您的业务最相关的威胁是什么？”、“哪些安全控制缺失或无效？”以及“需要哪些行动来防御这些威胁？”\n\
  \n网络威胁建模的益处包括：\n*   发现、优先排序和减少威胁\n*   促进理性决策\n*   减少攻击面\n*   选择和实施经济且必要的安全控制\n*\
  \   提高组织的安全态势\n\n| Note：每当测试人员识别出缺乏适当的安全控制时，应在报告中予以记录，并给出相应的建议。 |\n\n## 漏洞评估\n\n\
  漏洞评估是一个测试人员努力发现应用程序和计算机网络中逻辑和技术缺陷的过程。例如，在网络 VA 扫描中，测试人员首先识别操作系统、开放端口和正在运行的服务。检查服务版本对于确定运行版本是否存在漏洞或已更新至关重要。全面的评估在列出任何弱点之前涉及多层级的关联。\n\
  \n进行漏洞评估有两种不同的方法：自动和手动。\n\n### 自动 VA 扫描\n\n自动扫描工具（如 `Nessus`、`Nexpose` 和 `OpenVAS`）通过将接收的数据或参数与漏洞数据库对比来分析响应。当匹配预设条件时，扫描工具会识别并列出漏洞。利用自动扫描允许组织简化漏洞检测，最大限度地减少时间、精力和相关成本。\n\
  \n### 手动 VA 扫描\n\n另一方面，手动评估可以揭示任何自动工具可能检测到的漏洞。然而，手动方法也有其缺点，例如需要额外的投入、时间和成本。\n\n\
  ## 渗透测试\n\n渗透测试位于 VA 之后，测试人员尝试利用初始扫描中识别出的漏洞。利用的设计旨在触发目标服务器执行未经授权的操作并交付预期的输出。通过利用运行的漏洞服务，可以执行诸如数据导出、中断和反向连接等各种操作。\n\
  \n虽然许多带有大量数据库的工具可以利用已知的技术漏洞，但手动方法仍然利用业务逻辑流或逻辑弱点的最佳且最准确的方法。某些组织倾向于在生产环境中进行渗透控制的的性。\n\
  \n| Note：在生产环境的渗透测试期间执行内存和基于 DOS 的利用时，必须极其小心。遵循行业最佳实践，建议在这些情况下仅使用辅助工具，避免直接执行利用。\
  \ |\n\n## 渗透后阶段\n\n\n\n\n\n本次练习的主要目标是评估受损资产的价值并建立长期使用的持久化机制。资产估值对于确定受损系统上访问数据的敏感性至关重要。\n\
  \n获取有关受损服务器的情报（包括配置、通信以及与网络与其他系统的关系）对于执行横向移动非常有益。全面的渗透后测试还评估了目标资产或组织内部授权控制的有效性。虽然攻击方法可能会根据目标的性质而略有不同，但最终目标仍然很明确：将当前权限级别提升到下一级或\
  \ root 级别。\n\n| 注意：鉴于你目前的网络访问权限，在进行任何权限提升或网络跳转活动之前，确保获得被审计组织的至关重要。 |\n\n# 报告\n\n\
  报告阶段是整个 VAPT 练习最有价值且最关键的部分。它应该是易于理解的并富含关键信息。精简的报告结构有助于利益相关者选择正确的信息以进行有效的补丁。\n\n\
  渗透测试利用通用漏洞评分系统（`CVSS`）分数来确定发现问题的严重程度。为了简化工作并增强全面性，受相同漏洞影响的所有端点应包含报告的单个实例中。此外，审计报告必须涵盖信息安全（IS）、合规性以及监管审计的所有信息。三种优选报告类型是：安全态势——执行摘要、漏洞管理跟踪表和详细技术报告。\n\
  \n## 安全态势：执行摘要\n\n这份专门为首席信息安全官（CISO）设计的高级文档展示了组织当前和历史的安全状况。由于 VAPT 练习的项目范围广泛且报告极其复杂，整合的方法是必不可少的，这通过安全态势报告或执行报告来实现。该决策文档有助于选择适当的安全措施，同时消除不必要的措施以优化成本。\n\
  \n## 详细技术报告\n\n在此部分，我们将展示在提案讨论中达成的技术交付。技术报告将包含关键信息，包括漏洞名称、描述、受影响的端点、`CVSS`分数、严重等级、`CVE`\
  \ 和 `CWE` 标识、概念证明、复现步骤、影响评估、缓解策略和参考文献。至关重要的是，报告必须包含概念证明（`POC`）以展示受损的证据并准确定义数据的敏感性。\n\
  \n## 漏洞管理跟踪表\n\n漏洞跟踪表作为审计（渗透测试人员）与审计团队之间的中间文档，能够实现有效的实时发现管理。该工具允许轻松跟踪关键或高优先级漏洞的当前状态，无论它们是被修复、开放还是正在处理中。虽然市场上已有自动化工单管理解决方案，但共享\
  \ Excel 表格也可以有效地管理漏洞。\n\n# 安全审计标准和框架：最佳实践\n\n为了增强 VAPT 练习的客观性、平畅性和有效性，采用了多种标准和框架。遵循这些标准和框架对于确保评估报告在任何信息安全和合规审计中都能接受至关重要。安全社区通常开发并监督这些标准，获得了全球认可。\n\
  \n以下是我们可以利用的一些知名标准和框架：\n\n### 开放 Web 应用安全标准\n\n开放 Web 应用安全项目（`OWASP`）是一个由 `OWASP`\
  \ 基金领导的在线社区，致力于在应用安全领域提供免费的文章、方法论、文档、工具和技术。Mark Curphey 于 2001 年 9 月 9 日发起了 `OWASP`；第一份“十大”列表于\
  \ 2003 年发布。每四年进行一次更新，由 40 多家合作伙伴组织所经历的趋势安全风险提供指导。\n\n`OWASP` 的主要目标是识别与应用程序相关的十大网络威胁，提供评估清单并为安全开发提供最佳实践建议。此外，`OWASP`\
  \ 特意开发了几个不安全的 Web 应用，如 `WebGoat`，旨在帮助学生探索漏洞并培养安全编码习惯。\n\n### CWE/SANS 前 25\n\n系统管理、审计、网络和安全（`SANS`）学院是一家成立于\
  \ 1989 年的美国私营营利公司，是全球最大的网络安全研究和培训机构之一。\n\n`CWE/SANS` 前 25 列表突出了最严重且发生频率最高的、易于发现和利用的软件漏洞。这些漏洞为黑客提供了从事恶意活动的机会，如黑客攻击、数据窃取、欺骗、创建后门、DDoS\
  \ 攻击和完全接管系统。`CWE/SANS` 前 2 五个漏洞是通过多次调查、趋势观察以及对 DevSecOps 和安全从业人员的个人采访筛选出来的。\n\n\
  ### 渗透测试执行标准\n\n渗透测试执行标准（`PTES`）由七个主要步骤组成，使渗透测试人员能够系统、精确且有效地进行练习。它支持从初始通信到最终交付或详细报告的整个过程，涵盖了约前准备、情报收集、威胁建模、漏洞评估、利用、渗透后和报告。`PTES`\
  \ 标准在如此广泛范围内标准化了渗透测试实践，使得传统的应用程序、API、网络和无线测试方法变得类似于一次全面的红队对抗任务。\n\n### 开源安全测试方法论手册\n\
  \n该项目由安全与开放方法论协会（`ISECOM`）维护，并在开放社区中开发，得到了许多全球公司的宝贵贡献。`OSSTMM` 为安全评估提供了一种先进且详尽的方法论，没有任何假设和轶事证据。它作为在操作层面准确衡量网络安全的知名方法而闻名。\n\
  \n`OSSTMM` 允许任何安全从业者贡献想法，确保持续改进，使该方法更加准确、真实、可操作且高效。该手册的重点是跨所有操作通道的 `OpSec` 测试，涵盖人员、物理、无线、电信和数据网络。\n\
  \n指南旨在确保：\n\n*   测试已充分进行。\n*   所有必要的通道都已包含在测试中。\n*   测试态势符合法律。\n*   结果可以通过量化的方式进行衡量。\n\
  *   结果具有一致性和可重复性。\n*   结果仅包含直接源自测试的事实。\n\n### NIST 网络安全框架\n\n`NIST` 网络安全框架由美国国家标准与技术研究院（`NIST`）设计并发布，作为个人、企业和组织评估可能影响其运营的网络风险的价值资源。它在全球范围内被认可和接受，是关键基础设施网络安全的最佳实践。\n\
  \n\n\n\n\nNIST 网络安全框架分为五个功能，并进一步细分为 23 个类别，提供了一种全面的方法。每个类别都定义了许多网络安全结果和安全控制的子类别，总计\
  \ 108 个子类别。该框架不仅识别并优先考虑风险，还结合了策略、业务和技术方法，以实现高效风险缓解管理。\n\nNIST 网络安全框架的五个功能如下：\n\n\
  *   识别 (Identify)\n*   保护 (Protect)\n*   检测 (Detect)\n*   响应 (Respond)\n*   恢复 (Recover)\n\
  \n## ISO 27001 标准](#contents.xhtml_sc3_31a)\n\nISO/IEC 27001 是一项国际标准，帮助组织建立、实施、维护和持续改进信息安全管理体系（ISMS）。该标准的成功实施确保关键计算机基础设施免受技术和人为威胁的稳健保护。\n\
  \n符合标准的组织在成功完成审计后，还可能获得认可机构的认证。ISO 27001 指导对组织的攻击面针对威胁和漏洞进行系统性检查，评估已实施的安全控制措施的有效性。它还有助于设计和实施一套全面的信息安全控制以降低风险。\n\
  \nISO/IEC 27001:2013 包含十个简明条款：\n\n*   标准的范围\n*   文档引用\n*   复用 ISO/IEC 27000 中的术语和定义\n\
  *   组织背景和利益相关者\n*   信息安全领导力和高层策略支持\n*   规划信息安全管理体系、风险评估和风险处理\n*   支持信息安全管理体系\n*\
  \   使信息安全管理体系运行\n*   评审体系性能\n*   纠正措施\n\n## CIS 基准](#contents.xhtml_sc3_32a)\n\n\
  互联网安全中心（CIS）是一部成立于 2000 年 10 月的美国非营利组织。其使命是推广及时的最佳实践解决方案和控制措施，保护个人、企业和政府免受针对关键信息基础设施（CII）的大范围网络威胁。\n\
  \nCIS 与众多公司、政府机构和教育机构合作，识别并完善有效的安全措施。其中一个关键方面是 CIS 基准，它在制定安全策略和程序以确保稳健的信息访问控制方面起着至关作用。CIS\
  \ 基准由 18 项优先安全措施组成，旨在缓解针对关键基础设施最常见的网络攻击。所有指定的控制文档均可从 CIS 官方网站下载。\n\n## ISACA 标准和指南](#contents.xhtml_sc3_33a)\n\
  \n信息系统审计与控制协会（ISACA）于 1994 年在美国成立，是一个主要关注 IT 治理的国际专业协会。目前，ISACA 提供 8 多项认证计划以及其他微证书，为\
  \ 180 多个国家的 140,000 多成员服务。\n\nISACA 在协助组织和审计师进行全面审计以及实施信息审计标准方面发挥着重要作用。这些标准致力于满足信息审计和报告的强制性要求，确保审计人员保持最低性能水平。\n\
  \n## MITRE 框架](#contents.xhtml_sc3_34a)\n\nMITRE ATT&CK 框架作为一个知识库和研究计划，用于监控整个攻击生命周期中的对手行为。它基于战术、技术和程序（TTPs）设计。目前总共有\
  \ 14 种已知战术，涵盖了许多技术和程序。\n\n该框架在对安全运营中心（SOC）中由 MITRE 捕到的各种攻击向量触发的告警进行彻底分析时极具价值。此外，它有助于威胁情报的收集和分析。通过利用\
  \ MITRE ATT&CK 框架，组织可以创建更安全、自自足的架构。\n\n## 与客户的前介入交互](#contents.xhtml_sc2_35a)\n\n\
  前介入阶段是 VAPT 项目的主要步骤，在此期间，审计组织介绍其服务、能力、方法和交付物。同时，这让被审计组织能够全面了解服务，并与其他市场参与者进行比较，以选择最合适的服务。这种讨论通常分几个阶段进行，可能涉及对服务各个方面的协议和分歧。尽管如此，双方最终必须确定服务和交付模型。\n\
  \n前介入的讨论应涵盖以下方面：\n\n### 定义审计范围](#contents.xhtml_sc3_36a)\n\n定义范围是整个活动中最关键且最具挑战性的一步，因为审计必须保持在约定的范围内。范围的透明在多个方面有利于渗透测试，包括识别攻击面、制定审计策略、选择正确的工具和资源、设定截止日期以及确定最终交付物。\n\
  \n忽视这些考虑可能会导致严重问题，如范围蔓延、违反服务水平协议（SLA）以及客户不满意。清晰且明确地记录所有行项目（例如 Web 应用、移动应用、API、云、容器、网络设备、服务器、数据库、运营技术（OT）、物联网（IoT）和终端）关重要。这些文档可以在参与方发生争议时作为证据。\n\
  \n### 活动性质](#contents.xhtml_sc3_37a)\n\n被审计组织有完全自由根据其特定需求和理解选择活动的性质。远程和现场活动都有各自的优缺点。远程实践可能涉及建立与组织内部网络连接的复杂性，但为客户降低了成本。相反，现场活动不面临连接挑战，但可能由于资源差旅和住宿而产生更高的费用。\n\
  \n其他各种因素也会影响测试性质的选择，例如测试质量、连接通道带宽、已实施的安全控制、补丁支持和漏洞管理。\n\n### 测试方法](#contents.xhtml_sc3_38a)\n\
  \nVAPT 有多种测试方法可用，其中三种被广泛使用：黑盒、灰盒和白盒。在 VAPT 过程中，选择特定的测试方法取决于目标、限制以及需要识别和解决的漏洞。这些测试方法在访问权限和目标知识方面存在显著差异，如图\
  \ 1.4\n\n在这种方法中，渗透测试人员仅拥有目标的基础信息，例如 IP 地址和 Web URL。这种评估被称为基于面的 VAPT，因为没有为测试人员提供登录凭据。\n\
  \n### 灰盒](#contents.xhtml_sc4_40a)\n\n在这种方法中，渗透测试人员不仅接收 IP 地址、`URLs`、`APKs`、`IPAs`、`APIs`\
  \ 等信息，还能详细了解目标的内部功能。这种评估被称为身份验证 VAPT，因为为测试人员提供了一定程度的登录凭据。在目标知识和认证方面，它处于黑盒和白盒之间。\n\
  \n### 白盒](#contents.xhtml_sc4_41a)\n\n\n\n\n\n在此场景下，渗透测试人员将对目标的架构、数据流和源代码有全面的了解。通过获得目标的完全访问权限，渗透测试人员可以进行深度挖掘和逻辑测试，从而提高扫描质量。\n\
  \n| 注意：在选择合适的测试方法时，必须对演练的优缺点进行审慎评估，因为每种方法都遵循独特的路径并产生不同的结果。 |\n\n## 环境选择\n\nVAPT\
  \ 可以在安全软件开发生命周期（`SDLC`）的多个阶段进行，包括开发期间的基于单元测试、`UAT` 中的初始测试、预生产环境的全面测试以及生产环境的常规测试。每个测试环境对测试结果都提供不同的优势和局限性。例如，在生产环境中，灰盒\
  \ VAPT 可以提供真实的攻击模拟，但也带有中断生产运行或破坏数据库的风险。\n\n## 方法和方法论选择\n\n可以根据各种参数选择方法和方法论，包括定义的范围、测试方法、测试环境和演练性质。虽然审计人员通常遵循标准化方法，但必要时可以进行微调。\n\
  \n## 演练时间选择\n\n审计时机应根据业务性质和客户需求进行选择。对于关键和生产环境，建议将审计安排在用户流量最低期间，这可能包括非工作时间、深夜或周末。\n\
  \n## 项目时间线\n\n项目时间线由 `SOW` 中定义的范围规模和性质决定。例如，由于包含了手动模糊测试，灰盒或白盒测试可能需要更长的时间。详细的项目计划可以在启动会议期间共享。\n\
  \n## 参与规则\n\nVAPT 演练的任何必要条款和条件都必须记录在并由审计方和审计机构签署。例如，如果如果在 VAPT 演练期间发生生产服务器崩溃导致组织财务损失，可以包含一项由审计机构提供财务保险的条款。\n\
  \n## 交付物\n\n演练的最终成功取决于承诺结果的交付。依靠你的知识、智慧和经验来确保格式和质量符合交付要求，因为你将承担相应的交付责任。未能达到预期可能会导致多次升级。最后一章将对交付物进行全面探讨。\n\
  \nVAPT 评估通常涉及若干交付物，包括：\n\n*   执行摘要报告\n*   详细的技术评估报告\n*   漏洞管理跟踪\n\n## 设计安全审计的工作范围\n\
  \n工作范围（`SOW`）是初始合作后提交给客户的主要文档，用于获取采购订单。该文档在 VAPT 中具有至关重要的性，因为它概述了拟演练发生的特定区域。`SOW`\
  \ 包含了详尽的信息，对审计方和审计机构在整个过程中都有益。\n\n`SOW` 文档涵盖了以下点：\n\n*   关于服务提供机构的信息\n*   文档介绍\n\
  *   关于范围的详细协议\n*   成本估算和人力分配\n*   详细的方法和方法论\n*   对标准和框架的遵循\n*   测试方法和演练性质\n*   必要的工具\
  \ set\n*   开展演练的能力\n*   演练周期\n*   交付物\n*   服务条款和条件\n\n| 注意：虽然工作范围（`SOW`）主要作为技术文档，但在涉及范围蔓变的案件中，作为关键法律证据具有重大意义。\
  \ |\n\n## VAPT 中的项目规划与治理\n\n现在，让我们深入研究项目规划、管理和治理的细节。\n\n### 项目规划\n\n为了确保 VAPT 项目符合承诺的交付时间并成功，仔细的规划和监控至关重要。本文档作为审计方和审计机构的指南，提供了已完成、进行中和即将进行的任务的简要概述。\n\
  \n有效的项目规划应包含以下元素：\n\n*   项目范围（根据 `SOW`）\n*   任务描述和优先级\n*   任务完成的时间限制\n*   任务排序\n\
  *   IT 和非 IT 支持人员列表\n\n在各种项目规划技术中，`Gantt chart`（甘特图）作为最广泛使用且有效的方法之一脱颖而出。`Gantt chart`\
  \ 按优先级安排项目活动，显示每个任务的开始和结束日期。可以添加人员名称以备问责。它清晰地显示了哪些活动将同时运行，哪些将顺序发生。通过查看图表，可以轻松评估项目进度——是处于轨道上、提前还是落后。\n\
  \n`Gantt charts` 提供了宝贵的见解，使项目经理能够识别潜在的瓶颈或延迟，并允许他们有效地向利益相关者沟通项目计划，如图 1.5\n\n图 1.5：甘特图\n\
  \n### 项目管理\n\n项目管理涵盖了旨在实现实践定义目标的各种活动。每个项目都分配了一个专职的项目经理，以确保全面的集中的控制。有效的项目管理对于维持盈利能力、确保及时完成和遵守预算至关重要。对于任何参与领导或管理项目的人来说，项目管理是一项不可或缺的技能，有助于资源的有效利用。\n\
  \n项目管理生命周期包括项目启动、规划、执行、控制、监控和结束，如图 1.6 所示：\n\n![](img/Figure_1.6.png)\n\n图 1.6：项目管理生命周期\n\
  \n许多项目管理工具和技术供你使用，以有效控制时间和资源利用。通过协调关键项目元素（如资源、交付物、预算和时长）之间的关系，你可以制定一个盈利且全面的计划。参考图\
  \ 1.7 以获取关于多个项目元素之间相互联系的见解：\n\n![](img/Figure_1.7.png)\n\n图 1.7：项目元素之间的关系\n\n建立项目管理办公室（`PMO`）可以提高项目管理质量并确保结果成功。\n\
  \n### 项目治理\n\n为了确保项目的成功执行，必须建立良好的治理模型和集中控制机制，并与演练目标保持。治理内的决策应根于范围、成本、质量、时间和交付物等切实因素。然而，某些无形因素，如团队冲突、领导力问题、文化差异、环境变化和政治考虑也可能影响最终决策。角色和职责应根据项目的复杂度进行定制，以建立有效的治理。\n\
  \n角色和职责可以分组如下：\n\n*   项目指导委员会\n*   项目经理\n*   质量保证\n\n\n\n\n\n* 人员经理\n* 工程与技术经理\n\
  * 领域专家 (SME) 团队\n\n## VAPT 中的交付与客户成功策略\n\n客户成功管理（Customer Success Management）是一种战略性方法，专注于最大化客户从\
  \ VAPT 服务中获得的收益。在约定的时间范围内按承诺交付服务并保持不妥协的质量，对于建立客户信任至关重要。为了确保长期客户关系并促进可持续增长，请考虑实施以下最佳客户成功策略：\n\
  \n* 主动沟通：让客户随时了解 VAPT 的进展并及时解决他们的疑虑。主动沟通能增强对我们服务的信心。\n* 个性化关注：理解每个客户的独特需求并据此定制 VAPT\
  \ 解决方案。我们真诚关心他们的安全，提供定制化的建议。\n* 知识共享：教育客户网络安全最佳实践和新出现的威胁，使他们能够做出明智的决策。\n* 评估后支持：提供评估后的协助，包括修复建议和对有效安全措施的持续支持。\n\
  * 客户反馈：在每次合作后收集客户反馈，以不断改进我们的服务。\n* 衡量客户成功：使用既有指标衡量客户满意度和成功率，使我们优化客户成功策略。\n* 长期关系：侧重于建立长期关系，展现对他们安全需求的投入，并赢得他们的忠诚。\n\
  \n此外，可能还需要升级指标和开箱即用的支持（out-of-the-box support）。\n\n| 注意：确保在整个项目过程中与客户保持有效且开放的沟通。让他们参与决策，细心考虑他们的反馈，并及时解决任何问题。通过共同努力，可以建立信任、加强客户关系并提高项目成功率。\
  \ |\n\n### 结论\n\n你已经对高级 VAPT 方法和方法论有了全面的理解。遵循 VAPT 标准和框架可以显著简化 VAPT 演练的执行，确保评估的全面性和有效。对于寻求深层次理解概念和原理的人员来说，理解高级\
  \ VAPT 的理论方法至关重要。\n\n有效识别和利用系统或网络中的漏洞，需要安全专业人员具备批判性思维和解决问题的能力。在接下来的章节中，我们将探索如何利用开源和免费软件工具搭建一个全面的、高级的\
  \ VAPT 测试实验室。这些实验室为安全专业人员提供了练习、精炼和增强其 VAPT 技能和知识的宝贵平台。VAPT 实验室旨在模拟真实的系统和网络，为专业人员实验其技术和方法提供了一个受控的环境。\n\
