  # 第 2 章搭建 VAPT 实验室\n\n## 引言\n\n在本章中，我们将引导你使用免费和开源工具搭建一个高级 VAPT 测试实验室。VAPT 实验室通常由互连的计算机系统和网络设备（如路由器、服务器、应用程序和交换机）组成。这些系统的配置用于模拟真实网络，包含安全漏洞和防护措施。\n\
  \n拥有 VAPT 实验室对于 VAPT 专业人员来说至关重要。它为他们的专业知识提供了一个安全且受控的环境。此外，如果没有适当授权可能会可能会严重的法律后果。在\
  \ VAPT 实验室中，专家可以进行测试和模拟，而没有损坏实际系统或网络的风险。这允许人们在不担心现实后果的情况下进行学习和实验。这反有助于制定针对性的 VAPT\
  \ 策略，发现漏洞并加固自身的系统和网络。\n\n| 注意：VAPT 实验室是 VAPT 从业者的重要资产，提供了一个安全且高效的环境供其练习、学习和增强 VAPT\
  \ 技能。 |\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\n* 从 Kali Linux 开始\n* 建立虚拟化环境\n* 部署 Kali Linux\
  \ 2023.2\n* 网络服务\n* 启用 ProxyChains\n* 个性化 Kali Linux\n* 刷新 Kali Linux\n* 启用第三方 VAPT\
  \ 工具\n* 准备漏洞系统和应用程序\n* 搭建漏洞机器和应用程序\n\n### 从 Kali Linux 开始\n\nKali Linux 是一种免费且开源的\
  \ Linux 操作系统，专为数字取证、渗透测试和安全探索设计。它由信息安全培训领域备受尊敬的公司 Offensive Security 开发并维护，基于 Debian\
  \ GNU/Linux 平台。它内置了各种工具，处于开箱即用状态，简化了诸如网络扫描、漏洞评估和密码破解等多项安全任务的执行。凭借其强大的功能和灵活的设计，Kali\
  \ Linux 是网络安全专家和研究人员的理想选择。\n\n### Kali Linux 特性\n\nKali Linux 为网络安全专家和研究人员提供了一个动态且灵活的工具，展示了广泛的功能，使其成为处理各种任务的卓越选择。[图\
  \ 2.1] 展示了 Kali Linux 的一些关键属性，这些属性将在随后的解释中详细阐述：\n\n![](img/Figure_2.1.png)\n\n图\
  \ 2.1：Kali Linux Key 特性\n\n以下是 Kali Linux 的一些关键特性：\n\n* 预装了大量的安全工具，涵盖了网络扫描、密码破解和数字取证分析。\n\
  * 灵活的界面和多功能的布局，使用户能够根据精确需求个性化操作系统。\n* 强有力的文档和支持资源，包括用户指南、论坛和活跃的 Kali Linux 社区。\n\
  * 定期的升级和改进，确保用户能够使用最新、最高效的安全方法和工具。\n* Live boot（即时启动）功能允许用户从 DVD 或 USB 驱动器运行 Kali\
  \ Linux，无需安装在设备上。\n\n\n\n\n\n| Note：Kali Linux 是一种著名的 Linux 发行版，其在网络安全追求中的关键作用被广泛认可，涵盖了伦理黑客和渗透测试。虽然传统部署侧向于攻击性安全，但\
  \ Kali Purple 重新定义了该平台范围。它无缝集成了多种防御工具和资源，使你不仅能够主动检测并应对网络威胁，还能熟练地响应并缓解它们。 |\n\n##\
  \ 建立虚拟化环境\n\n虚拟化允许将一台物理机器分为若干台虚拟机，每台虚拟机都能运行其独立的操作系统和应用程序。这种方法允许不同的操作系统和应用程序在同一个物理设备上运行，提高了效率并降低了硬件成本。虚拟化实践适用于多种场景，包括云计算、服务器整合以及构建测试和开发环境。为虚拟化设计的软件（如\
  \ `VMware` 和 `Oracle VirtualBox`）负责在主机上创建和管理这些虚拟机。\n\n## 虚拟化在 VAPT 中有什么用\n\n虚拟化在漏洞评估和渗透测试（VAPT）中发挥着关键作用，它让安全专家能够为了测试建立并管理大量的虚拟环境。通过虚拟化，VAPT\
  \ 专家可以在单个物理主机上构建多个虚拟机，每台虚拟机都根据需求定制了独特的操作系统、应用程序和网络设置。\n\n这种技术还简化了创建隔离测试环境的流程，这对于确保测试过程不会干扰受测系统的运行至关重要。此外，虚拟化简化了虚拟机环境快照的创建，使\
  \ VAPT 专业人员能够高效地保存并恢复到特定状态。这一功能对于重复测试或与团队成员共享测试环境被证明非常有价值。\n\n| Note：虚拟化是 VAPT 专家的一项宝贵技术，赋予了他们彻底且熟练地审查各种系统和环境安全的能力。\
  \ |\n\n## 部署 Kali Linux 2023.2\n\n你可以使用 ISO 镜像或虚拟机在 `VMware` 中设置 Kali Linux。每种方法都有其优缺点，你的选择取决于你的需求以及你对\
  \ Kali Linux 的熟悉程度。有关每种方法优缺点的对比，请参阅表 2.1：\n\n| 序号 | 维度 | ISO 镜像 | 虚拟机 |\n| :---\
  \ | :--- | :--- | :--- |\n| 01 | 安装易用性 | 安装稍显复杂，但提供了更多自定义选项 | 提供快速快捷的设置，无需自定义 |\n\
  | 02 | 自定义性 | 允许你自定义安装选项，如磁盘分区、语言和软件包 | 与 ISO 方法相比提供的自定义选项有限，可能不适合有特定需求的用户 |\n|\
  \ 03 | 建议 | 推荐想要学习安装过程并有特定自定义需求的用户 | 对于已经熟悉 Kali Linux 并希望快速启动而无需任何额外设置步骤的用户是理想选择\
  \ |\n\n表 2.1：Kali Linux ISO 安装方法与虚拟机安装方法的优缺点对比\n\n对于使用 ISO 镜像方法安装 Kali Linux，首先从官方网站获取\
  \ ISO 镜像文件。然后，在 `VMware` 中创建一个新的虚拟机，并选择该 ISO 镜像文件作为安装介质。按照屏幕提示完成安装。该方法在安装期间提供完全权限，并允许对设置选项进行自定义。\n\
  \n在本节中，我们将指导你通过虚拟机镜像在 `VMware Workstation` 或 `VirtualBox` 上安装 Kali Linux。让我们直接进入安装步骤吧。\n\
