  \ |\n\n## 总结\n\n本章让你对侦察方法有了坚实的理解，这是进行有效的漏洞评估和渗透测试（VAPT）的关键组件。\n\n\n\n\n\n- Web 应用\n\
  - 计算机网络\n- 移动应用\n- 容器\n- 漏洞管理\n- 应用安全\n    - 静态应用安全测试\n    - 动态应用安全测试\n\n## 漏洞评估概述\n\
  \n漏洞评估是发现计算机系统安全缺陷的关键过程。该评估利用自动化工具来定位漏洞并对发现的结果生成报告。这项练习有助于组织了解自身的安全态势，应对潜在威胁，并通过及时修复新发现的弱点来防止网络攻击。漏洞评估为组织提供了对其\
  \ IT 资产和安全漏洞至关重要的洞察。这些信息允许组织实施有效的安全措施并降低网络攻击风险，最终提高其整体安全态势。\n\n漏洞评估可以通过手动进行也可以通过自动化进行。自动化扫描更快且所需的人工工作较少，而手动评估具有误报率较少的优势。混合方法结合了后者的优点，因为可以对自动化扫描的结果进行手动验证，以检测误报和漏报，并提高整体扫描质量。\n\
  \n以下是各种类型漏洞评估扫描的示例，如图图 4.1 所示：\n\n![](img/Figure_4.1.png)\n\n图 4.1：漏洞评估扫描类型\n\n\
  以下是各种类型的漏洞评估扫描：\n\n- **基于应用的漏洞扫描**：识别 Web 应用程序中与代码和配置相关的安全缺陷。\n- **基于网络的漏洞扫描**：检测网络基础设施中的漏洞，例如配置错误的设备、弱密码和开放的端口。\n\
  - **无线漏洞扫描**：搜索无线网络中的安全缺陷，包括加密薄弱、不安全的访问点和未经授权的访问。\n- **数据库漏洞扫描**：评估数据库及其连接系统的潜在安全风险，包括配置错误的设置、弱的身份验证和未受保护的数据。\n\
  - **基于主机的漏洞扫描**：识别单个计算机或设备中的漏洞，包括配置错误的设置、过时的软件和未修补的安全漏洞。\n\n| 注意：为了进行全面的漏洞评估（VA）扫描，必须确保满足所有必要的先决条件。这些包括获取所需的权限、明确定义范围、选择扫描类型、选择合适的扫描窗口、准备环境，以及为工作仔细选择正确的工具和资源。\
  \ |\n\n## 漏洞命名法\n\n漏洞命名法是用于描述应用程序、软件、网络或计算机系统中漏洞的命名规范。将漏洞的文档、通信和讨论标准化，有助于安全专业人员更有效地管理和识别它们。\n\
  \n漏洞命名法通常包含一个唯一标识符，例如漏洞标识数字或代码、有关漏洞影响的信息、受影响的系统或软件以及漏洞描述。这些信息经常存储并维护在中央数据库中，例如常见漏洞与暴露\
  \ (`CVE`) 和常见弱点枚举 (`CWE`)。\n\n| 注意：使用标准化的术语和类别可以让不同的团队和利益相关者更好地理解和审议漏洞，减少误解并有效解决已识别的漏洞。\
  \ |\n\n## 漏洞管理生命周期\n\n漏洞管理（`VM`）生命周期是一种全面且循环的方法，用于确保持续的安全评估具有高质量，从而有效应对和缓解组织计算机系统和网络基础设施中的漏洞。`VM`\
  \ 生命周期允许组织执行资产发现、漏洞评估、漏洞优先级排序、报告、修复和重新验证。该活动的持续性要求遵循一个生命周期，并确保人员、流程和技术的不断改进。参考下方的图\
  \ 4.2 以直观理解 `VM` 生命周期：\n\n![](img/Figure_4.2.png)\n\n图 4.2：漏洞管理生命周期\n\n| 注意：采用漏洞管理生命周期是一种主动的网络安全方法，可以为组织节省成本，使其能够及时识别并修复漏洞，防止潜在损害和昂贵的安全漏洞事件。\
  \ |\n\n## 漏洞评估\n\n计算机系统中有多个可以进行漏洞评估的领域。让我们深入探讨其中一些：\n\n### Web 应用\n\n对 Web 应用进行漏洞扫描被广泛认为是评估网站安全态势的金标准，因为它会针对大量已知漏洞对网站进行彻底检查，揭示应用程序中的任何潜在弱点。为了掌握自动化\
  \ Web 应用漏洞扫描的基础，我们将探索该领域最常用的两个工具：`OWASP ZAP` 和 `Burp Suite Community Edition`。为了展示扫描程序并评估这些工具的效率，我们将利用\
  \ `bWAPP`，这是一个开源且免费的、故意制造了漏洞的 Web 。`bWAPP` 为安全爱好者提供了在真实环境中利用安全缺陷的实践经验。\n\n#### OWASP\
  \ ZAP\n\n`OWASP Zed Attack Proxy` (`ZAP`) 是一种直观且集成的漏洞评估与渗透测试 (`VAPT`) 工具，旨在轻松识别\
  \ Web 中的安全缺陷。它是一个强大的开源工具，旨在用于漏洞评估和渗透测试，提供全面的安全评估。让我们按照以下步骤逐步安装过程、配置目标并理解其功能：\n\n\
  1. 安装 `OWASP ZAP`：在 Kali Linux 上执行如图 4.3 所示的命令 `sudo apt install proxy`：\n\n   ![](img/Figure_4.3.png)\n\
  \n   图 4.3：安装 OWASP ZAP\n\n2. 启动 `OWASP ZAP`：安装成功后，通过 Web Application Analysis 标签访问\
  \ ZAP ，如图 4.4 所示：\n\n   ![](img/Figure_4.4.png)\n\n   图 4.4：启动 OWASP ZAP\n\n3. 配置\
  \ `ZAP`：在启动扫描之前，根据您的规格自定义 `ZAP`。这涉及配置代理、选择扫描类型、建立扫描策略以及其他设置，如图 4.5 所示：\n\n   ![](img/Figure_4.5.png)\n\
  \n   图 4.5：配置 OWASP ZAP\n\n4. 启动扫描：点击 ZAP 界面内的新会话按钮启动扫描。爬虫（Spider）将在自动化活动扫描过程开始之前，启动一个全面的网站爬取以收集信息。输入目标网站的\
  \ URL 并点击开始扫描，如图 4.6 所示：\n\n   ![](img/Figure_4.6.png)\n\n   图 4.6：启动扫描\n\n\n\n\n\
  \n## 5. 分析结果\n\n扫描完成后，ZAP 将展示一份针对目标网站发现的漏洞报告。该报告将包含每个漏洞的严重程度、描述以及修复建议，如图 4.7 所示。进入“报告”部分并点击“生成报告”按钮来生成报告。报告将以\
  \ HTML 格式生成。\n\n![](img/Figure_4.7.png)\n\n图 4.7：分析结果\n\n| 注意：请密切关注扫描进度，因为取决于网站的大小和需要评估的漏洞范围，扫描过程可能需要大量时间。可以通过\
  \ ZAP 界面实时监控扫描进度。 |\n\n## Burp suite\n\nBurp suite 由 PortSwigger 开发，是一套用于 Web 应用程序漏洞扫描渗透测试（VAPT）的综合工具集。它提供三个版本：社区版（Community）、专业版（Professional）和企业版（Enterprise）。在本次练习中，我们将使用\
  \ Burp suite 的专业版。\n\nBurp suite 内部各种工具，如代理（Proxy）、重放器（Repeater）、入侵者（Intruder）、序列器（Sequencer）、解码器（Decoder）和扩展器（Extender），无缝协作以支持整个测试过程。它们有助于映射和分析应用程序的攻击面，并识别和利用安全漏洞。让我们按照以下步骤了解如何配置扫描并理解其功能：\n\
