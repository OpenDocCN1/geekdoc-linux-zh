  \ 和 `Anita`\n\n# 关于作者\n\nUmmed Meel 是网络安全领域极有成就的专业人士，拥有十多年的专业经验。他在众多项目中发挥了关键作用，成为领导者和安全实践专家。Ummed\
  \ 拥有多项卓越认证，如注册信息系统审计师 (CISA)、认证伦理黑客 (CEH) 和注册计算机黑客和法医调查员 (CHFI)，以及网络法文凭 (DCL)。凭借卓越的履历，Ummed\
  \ 主了 150 多场培训和研讨会，磨练了他在网络安全、伦理黑客、情报、数字取证和网络犯罪调查方面的技能。他在建立网络安全实践方面也表现出色，为多个组织做出了贡献。他的受众涵盖全国各地的警察部门以及包括印度空军、BSF、CISF、CAG、BPRD、CDTI\
  \ 以及各部在内的知名机构。\n\nUmmed 在多个领域积累了丰富的专业知识，涵盖了实操和管理职位，如红队、漏洞评估、渗透测试、网络安全审计、合规性、差距评估和网络咨询。他丰富的经验跨了电信、制造业、物流、酒店、银行、金融科技、电力供应、交易所、航空等多个行业。\n\
  \n此外，Ummed 通过在全球知名杂志和期刊上发表文章做出了重大贡献。他通过许多新闻频道和报纸的采访分享了他的专家见解，阐明了网络相关的解决方案。此外，他还通过百场研讨会和讲座传播知识，在教育机构积极提高网络犯罪意识。他的卓越参与还协助调查机构成功解决了国内约\
  \ 200 多起重大网络犯罪案件。Ummed 的学术背景包括 B Tech (荣誉) 学位、LLB (网络法)，以及正在 BITS Pilani 攻读网络安全硕士学位。\n\
  \n# 关于评审员\n\nDarryn Brownfield 是一位渗透测试员和漏洞赏猎人，在 IT 行业拥有 10 多年的经验。他拥有行业认可和尊敬的认证，如\
  \ OSCP、PNPT、CRT 和 CRTP。他在社交媒体和 YouTube 上发布 CTF 报告、漏洞赏发现和认证评审。\n\n# 致谢\n\n我深感谢我的家人和朋友在本书创作过程中提供的坚定支持，特别是我的父母\
  \ `Dhanni Devi` 和 `Ratan Lal Meel`。衷心感谢我的灵感来源——哥哥 `Vijendra Singh Meel` 和嫂子 `Anita`\
  \ 的持续鼓励，即使是在深夜写作。特别感谢我的妹妹 `Babita Meel` 和姐夫 `S.I. Ram Swaroop` 的大力帮助。\n\n感谢 BPB\
  \ Publications 为本书的诞生提供指导。完善这项工作是与评审员、技术专家和编辑共同完成的旅程，每个人都做了宝贵的贡献。\n\n带着深切的感激，我向信息安全领域的导师、主管、同事和专业人士表示感谢，他们的指导极大丰富了我的理解。我很幸运能得到家人\
  \ `Ramkaran Meel`、`Phool Chand Choudhary` 和 `Dr. Sanju Choudhary` 的祝福。此外，我想衷心感谢我的弟弟\
  \ `Brijendra Khyalia` 提供的宝贵技术建议。\n\n给三个调皮鬼——`Love`、`Kush` 和 `Hridyansh`鼓掌，感谢他们让我的写作空间变成了充满活力的避风港。\n\
  \n最后，衷心感谢读者喜爱我的书。你们的鼓励是无价的。\n\n# 前言\n\n在编写本书时，我们的意图为读者提供一份关于漏洞评估与渗透测试 (VAPT) 动态领域的全面指南。我们的目的有两点：教育和赋能。我们希望为从新手到资深\
  \ IT 专业人员的各类读者提供应对不断变化的网络安全格局所需的知识和实践技能。\n\n本书的范围雄心勃勃但重点突出。它深入探讨了 VAPT 的复杂性，从基础原理到高级技术。我们探索了\
  \ VAPT 项目规划、治理以及关键的 PPT（人员、流程和技术）框架，对这一重要实践提供了整体理解。此外，我们还阐明了前期策略的重要性以及选择适当安全评估的必要性。\n\
  \n我们的实践方法指导读者搭建 VAPT 测试实验室，精通侦察、漏洞评估 (VA)，探索实际的网络渗透测试、Web 应用攻击、无线网络测试、权限提升、绕过安全控制和报告编写。它旨在激发好奇心，培养技能，并为读者从事网络安全做好准备，使保护数字资产成为理论与实践相结合的共同使命。\n\
  \n# 第一章：从高级渗透测试开始\n\nch01.xhtml\n\n本章向读者介绍了高级渗透测试及其在现代网络安全中的关键作用。它涵盖了 VAPT 的核心原理，强调了人员、流程和技术\
  \ (PPT) 框架。还讨论了理解客户需求和选择适当安全评估的前期参与技术。本章为后续章节深入探索高级渗透测试技术和原理奠定了基础。\n\n# 第二章：搭建 VAPT\
  \ 实验室\n\nch02.xhtml\n\n本章深入探讨了使用开源工具创建高级 VAPT 测试实验室。发现如何连接各种计算机系统和网络设备，在保持安全措施的同时模拟真实世界场景。VAPT\
  \ 实验室是网络安全专业人员进行技能开发、无风险实验和策略制定的关键环境，强调了它在该领域的核心作用。\n\n\n\n\n\n## 第 3 章：主动与被动侦察战术\
  \ (ch03.xhtml)\n本章深入探讨了侦察战术在成功渗透测试中的关键作用。学习如何收集有关目标的关键信息，并根据计算机系统的各种组件以及目标组织的独特特征调整你的方法。探索互联网上可用的丰富数据宝，并发现开源情报\
  \ (OSINT) 在从公共来源收集至关信息方面的强大力量，包括电子邮件地址、域名、IP 地址、员工详情、主机名和 DNS 记录。\n\n## 第 4 章：漏洞评估与管理\
  \ (ch04.xhtml)\n本章深入探讨了漏洞评估 (VA) 领域及其复杂性。我们的首要目标是为渗透测试人员和安全专家提供手动和自动化 VA 方法论方面的宝贵知识。在本章结束时，你将对各种\
  \ VA 技术和最佳实践有全面的理解，从而使你能够识别并处理跨各种计算机基础设施中的漏洞。此外，我们还探讨了精确且有针对性的补丁管理在优化 VA 计划整体效率方面的关键作用。\n\
  \n## 第 5 章：计算机网络利用 (ch05.xhtml)\n本章通过积极利用在前章节中发现的漏洞，深入了网络渗透测试的实践领域。利用在评估漏洞的真实严重程度及其对目标环境的潜在影响方面起着关重要的作用。我们强调在选择特定攻击向量之前收集目标环境情报的重要性。通过在控制测试环境中使用开源工具和手动脚本，我们提供了模拟真实场景的实践经验。在整个章节中，你将获得对利用工具（包括\
  \ `Metasploit` 和 `Armitage`）操作方面的宝贵见解。\n\n## 第 6 章：Web 应用利用 (ch06.xhtml)\n本章对 Web\
  \ 应用程序利用进行了全面介绍，这在当今的数字格局中至关重要。它涵盖了基础和高级漏洞利用，阐明了常见的攻击向量、威胁建模以及 Web 应用程序中技术和业务逻辑流的识别。在本章结束时，读者将对高级\
  \ Web 应用利用技术有深入理解，并具备进行复杂评估的专业知识。\n\n## 第 7 章：无线网络利用 (ch07.xhtml)\n本章全面探索了无线网络渗透测试，目标涵盖\
  \ Wi-Fi 和蓝牙等多种网络。其主要重点是揭示这些网络中的漏洞和潜在威胁，同时建立有效的防御措施以增强安全性。\n\n## 第 8 章：哈希破解与后利用 (ch08.xhtml)\n\
  本章将带你进入权限提升和网络跳转的迷人旅程。它探索了密码和哈希破解的前沿工具和技术，以及后利用程序。最后，你将获得对高级渗透测试技术有全面的理解，以精确和专业的知识发现漏洞并增强安全措施。\n\
  \n## 第 9 章：绕过安全控制 (ch09.xhtml)\n本章深入探讨了绕过计算机网络内安全控制的艺术，涵盖了 Windows 安全控制、反病毒措施和防火墙保护。它还探索了社会工程和各种渗透测试技术，为评估和增强计算机网络安全控制的效能提供了宝贵的见解和技能。\n\
  \n## 第 10 章：报告编写的革命性方法 (ch10.xhtml)\n本章深入探讨了报告写作艺术，这是行业中至关重要的一个方面。如果没有符合要求的良好报告，评估就是不。它通过详细的报告提供见解，涵盖了技术和逻辑漏洞以及建议。本章还提供了关于计算\
  \ `CVSS` 分值、评估风险、确定风险优先级和分类严重性的指导。此外，它还探讨了创建具有影响力的演示文和安全仪表板，以有效沟通评估结果。\n\n# 彩色图片\n\
