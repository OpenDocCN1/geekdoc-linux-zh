  \ 输入可能的密码列表\n\n5. 在 Intruder 标签页中点击 Start Attack 开始开始攻击。等待攻击完成，然后检查 Results 标签页查看任何密码是否成功。成功的登录将由带有\
  \ payload bug 的请求指示，该请求具有 302 重定向，且 Location 为 `portal.php` 页面。参见图 6.21：\n\n![](img/Figure_6.21.png)\n\
  \n图 6.21: 在 Intruder 标签页中点击 Start Attack 开始攻击\n\n\n\n\n\n| 注意：目前有多种暴力破解工具可用，包括 Burp\
