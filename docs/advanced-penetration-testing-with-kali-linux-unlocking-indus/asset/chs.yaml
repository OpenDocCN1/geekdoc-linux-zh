  \n![](img/fm1.png)\n\n# 第 5 章 攻击计算机网络\n\n## 引言\n\n在本章中，我们将通过演示在前几章中识别的漏洞进行利用，深入探讨网络渗透的实操方面。利用这些漏洞是至关重要的，因为有助于确定漏洞的严重程度及其对目标环境的潜在影响。通过本章，我们旨在让你清晰理解网络渗透的意义和后果，以及在选择攻击向量之前收集目标环境情报重要性。\n\
  \n为了确保渗透人员全面理解网络安全态势，我们将使用开源工具和手动脚本在测试环境中演示利用技术。这种方法将使渗透人员能够模拟真实场景，在识别和利用漏洞方面获得实践经验。在这里，你将从操作和用例的角度了解\
  \ `Metasploit` 和 `Armitage` 等利用工具的各个方面。\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\n* 理解网络渗透测试\n\
  * Metasploit 介绍\n* Metasploit 数据库和工作区管理\n* 将 NMAP 扫描与 Metasploit 集成\n* Metasploit\
  \ 自动化\n* 从辅助模块和漏洞利用程序开始\n* 手动利用\n* 使用 Armitage 进行漏洞利用\n\n## 目标\n\n在本章中，我们的目标是深入研究实战网络渗透方法，演示如何利用漏洞以理解它们的实际影响。这种实践方法加深了对网络安全的见解，并强调了攻击前收集信息的重要性。通过使用开源工具和手动脚本，我们重建了真实情况以获得全面的理解，并从操作视角强调了\
  \ `Metasploit` 和 `Armitage` 等工具。到本章结束，读者将获得熟练识别和利用漏洞的实践经验。\n\n## 理解网络渗透测试\n\n\n\n\
  \n\n网络渗透测试是识别和缓解组织网络内潜在安全风险的关键步骤。在此过程中，渗透人员必须尝试利用已识别的有漏洞的服务来获取未经授权的访问或执行可能对组织造成重大损害的未经授权的操作。网络渗透测试涵盖所有网络设备，包括服务器、数据库和安全控制。高级网络渗透测试通常涉及多个阶段，包括利用（Exploitation）、横移动（Lateral\
  \ Movement）、维持访问（Maintaining Access）、还原更改（Undoing Changes）、报告与文档（Reporting and Documentation）以及修复（Remediation），如下方的图\
  \ 5.1\n\n图 5.1：高级网络渗透测试阶段\n\n渗透人员理解网络渗透测试对目标环境的重要性和潜在影响至关重要。因此，他们必须对目标基础设施（硬件、、软件网络软件和网络组件。这些知识将使渗透人员选择合适的攻击向量和技术来成功利用漏洞，同时最大限度地减少任何负面后果。网络渗透测试的成功取决于侦察和漏洞评估阶段所收集信息的准确性和完整性。\n\
  \n| 注意：在生产环境中进行渗透测试时，确保所采取的操作不会对目标环境造成任何损害或干扰至关重要。渗透人员在整个网络渗透测试过程中必须保持专业并遵守伦理准则。\
  \ |\n\n## Metasploit 简介\n\nMetasploit Framework 由 HD Moore 于 2003 年开发，现在由 Rapid7\
  \ 维护，是一个开源软件工具，被渗透人员、安全研究人员和黑客用于渗透测试、漏洞扫描和漏洞开发。它用 Ruby 编写，旨在提供灵活性和扩展性，使用户能够定制自己的漏洞和载荷。Metasploit\
  \ Framework 提供了大量的特性和功能，如下方的图 5.2\n\n图 5.2：Metasploit 框架特性和功能\n\n该平台的主要功能之一是为针对远程目标开发、测试和执行漏洞提供空间。它拥有庞大的漏洞、载荷和辅助模块库，允许用户评估和评价计算机系统及网络的安全性。此外，安全专业人员使用\
  \ Metasploit Framework 来衡量其安全防御的有效性，并针对潜在攻击制定防御措施。\n\n| 注意：Metasploit 是一个既用于攻击也用于防御安全的通用工具。安全专业人员依靠它来测试安全措施的有效性并发现潜在漏洞。\
  \ |\n\n## Metasploit 数据库和工作空间管理\n\nMetasploit 的关键属性是其 Metasploit 数据库，它可以有效地在中央数据库中存储和管理与识别的目标、漏洞、会话和利用的数据。例如，当评估过程中发现漏洞时，Metasploit\
  \ 数据库可以监控漏洞利用进度并跟踪攻击成功情况。\n\n此外，存储的数据库对所有目标和开放端口重新验证以检查最新的可利用状态非常有用。由于 Metasploit\
  \ 数据库可以轻松导出、导入并在所有渗透人员之间共享，它允许从当前阶段就开始进行无缝协作。此外，数据库能够生成详细报告，并对目标系统的安全态提供深入的见解。\n\
