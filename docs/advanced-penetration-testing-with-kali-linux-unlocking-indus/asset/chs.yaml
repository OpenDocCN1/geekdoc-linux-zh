  \ Metasploit 数据库\n\n4. 在终端中输入 `sudo armitage` 启动 Armitage，如下方的图 5.38 所示：\n\n   \
  \ ![](img/Figure_5.38.png)\n\n    图 5.38：启动 Armitage\n\n5. 点击步骤 4 中的 Connect 启动\
  \ Metasploit 框架。这会将 Armitage 与 Metasploit 框架链接，允许您使用图形化界面利用漏洞，如图图 5.39 所示：\n\n \
