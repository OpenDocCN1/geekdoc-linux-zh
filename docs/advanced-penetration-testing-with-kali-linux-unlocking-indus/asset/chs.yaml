  \n   图 2.12：使用默认凭据登录\n\n## 排列网络服务\n\n\n\n\n\n在 Kali Linux 2023.2 中配置网络设置，请使用 `nmtui`\
  \ 命令行工具，它提供了一个简单基于文本的界面，旨在轻松地设置网络连接。\n\n要打开 `nmtui` 工具，请运行命令 `sudo nmtui`，如图图 2.13\n\
  \n图 2.13：运行命令 `sudo nmtui`\n\n要配置新的网络连接，可以按照以下步骤操作：\n\n1. 从主菜单选择 `Edit a network\
  \ connection`（编辑网络连接），如图图 2.14\n\n    图 2.14：编辑网络连接\n\n2. 选择想要编辑的网络连接并按回车，如图图 2.15\n\
  \n    图 2.15：选择网络连接\n\n3. 使用方向键导航到不同的选项，并按回车进行编辑。\n\n4. 使用 `Tab` 键在不同选项之间切换，使用 `Space`\
  \ 键启用或禁用它们。\n\n5. 将连接设置为手动配置并为 Kali Linux 机器分配静态 IP 地址，如图图 2.16 所示：\n\n    ![](img/Figure_2.16.png)\n\
  \n    图 2.16：编辑连接\n\n6. 按 `OK` 保存更改。\n\n| 注意：`nmtui` 工具还提供了切换网络连接开启或关闭的功能，并提供了查看和修改系统主机名及\
  \ DNS 配置的功能。 |\n\n## ProxyChains\n\n使用 ProxyChains 可以增强您的隐私保护并绕过防火墙等网络限制。虽然 Kali\
  \ Linux 2023.2 已经包含了 ProxyChains，但掌握其安装和设置方法仍然是有益的，以确保为其他平台或定制化调整做好准备。深入 ProxyChains\
  \ 的工作原理并掌握其设置，将提升您进行安全和机密网络交互的能力。\n\n要在 Kali Linux 2023.2 中设置 proxychains，需要执行以下步骤：\n\
  \n1. 打开终端窗口并运行命令 `sudo apt-get install proxychains` 来安装 proxychains 软件包，如图图 2.17\
  \ 所示：\n\n    ![](img/Figure_2.17.png)\n\n    图 2.17：运行命令安装 ProxyChains\n\n2. 使用文本编辑器打开\
  \ proxychains 配置文件。配置文件位于 `/etc/proxychains.conf`。运行命令 `sudo nano /etc/proxychains.conf`，如图图\
  \ 2.18 所示：\n\n    ![](img/Figure_2.18.png)\n\n    图 2.18：运行命令打开 ProxyChain 配置文件\n\
  \n3. 滚动到文件底部，添加您想要使用的代理服务器，每行一个。每行都应遵循以下格式：\n\n    ```\n    <proxy type> <proxy\
  \ host> <proxy port>\n    ```\n\n4. 例如，如果您想使用 `192.168.159.150` 上的 `7080` 端口 SOCKS5\
  \ 代理，则将向配置文件添加以下行，如图图 2.19 所示：\n\n    ```\n    socks5 192.168.159.150 7080\n   \
  \ ```\n\n    ![](img/Figure_2.19.png)\n\n    图 2.19：ProxyChains 配置文件\n\n5. 保存配置文件并退出文本编辑器。\n\
  \n### ProxyChains 的用例\n\n要配合特定命令使用 proxychains，可以使用以下语法：\n\n```\nproxychains <command>\n\
  ```\n\n例如，要通过代理服务器运行 Nmap 网络扫描工具，您将使用命令 `proxychains nmap 192.168.159.120`，如图图 2.20\
  \ 所示：\n\n![](img/Figure_2.20.png)\n\n图 2.20：使用 ProxyChains 使用 NMAP\n\n这将通过您在配置文件中指定的代理服务器运行\
  \ Nmap，允许您隐藏 IP 地址并保护匿名性。\n\n| 注意：使用 ProxyChains 时所用的代理取决于用户的独特偏好和需求。 |\n\n## 个性化\
  \ Kali Linux\n\n根据您的喜好定制 Kali Linux 2023.2 涉及多种选项，例如更改桌面外观、添加新软件以及调整系统配置。\n\n以下是您可以个性化\
  \ Kali Linux 体验的几个实例：\n\n### 更改桌面环境\n\nKali Linux 默认使用 Xfce 桌面设置。然而，您可以选择安装并切换到其他桌面环境，如\
  \ KDE、Gnome 或 Cinnamon，以获得符合您口味的全新视觉和操作风格。\n\n要安装 Kali Linux Xfce 环境，打开终端会并输入命令\
  \ `sudo apt update && sudo apt install -y kali-desktop-xfce`，如图图 2.21 所示：\n\n  \
  \  ![](img/Figure_2.21.png)\n\n    图 2.21：在 Kali Linux 中安装 Xfce 环境\n\n要将 Xfce 设置为\
  \ Kali Linux 中的默认桌面环境，打开终端并运行命令 `sudo update-alternatives --config x-session-manager`，如图图\
  \ 2.22 所示：\n\n    ![](img/Figure_2.22.png)\n\n    图 2.22：Kali Linux 中的桌面环境\n\n###\
  \ 安装额外应用程序\n\nKali Linux 包含了许多现成的安全工具，但您也可以选择添加初始时不存在的额外应用程序。当您打算在安全评估之外使用 Kali\
  \ Linux 时（例如用于 Web 开发或多媒体编辑），这非常有用。\n\n### 修改系统设置\n\n在 Kali Linux 中，您可以访问不同的设置面板和工具，这些工具让您个性化系统的不同部分。您可以调整桌面背景、系统主题甚至网络设置，如图图\
  \ 2.23 所示：\n\n    ![](img/Figure_2.23.png)\n\n    图 2.23：修改系统设置\n\n### 更改登录界面\n\n\
  您可以使用 `lightdm-gtk-greeter-settings` 工具来自定义登录界的外观，包括背景图像、字体和标志。运行命令 `sudo lightdm-gtk-greeter-settings`，如图图\
  \ 2.24 所示：\n\n    ![](img/Figure_2.24.png)\n\n    图 2.24：更改登录界面\n\n| 注意：在进行任何自定义之前，进行彻底的研究以确保它们对于您的系统是安全且适用的。这一预防性措施有助于避免由于不当或不支持的修改而产生潜在问题。\
  \ |\n\n## 刷新 Kali Linux\n\n要更新 Kali Linux 2023.2，您可以使用 `apt-get` 命令行工具，它是 Kali Linux\
  \ 基于 Debian GNU/Linux 发行版的包管理器。\n\n要更新 Kali Linux，您需要执行以下步骤：\n\n1. 打开终端窗口并运行命令 `sudo\
  \ apt-get update` 来更新 Kali Linux，如图图 2.25 所示：\n\n    ![](img/Figure_2.25.png)\n\n\
  \    图 2.25：更新 Kali Linux\n\n2. 一旦软件包索引更新，运行命令 `sudo apt-get upgrade` 将所有已安装包升级到最新版本，如图图\
  \ 2.26 所示：\n\n    ![](img/Figure_2.26.png)\n\n    图 2.26：升级 Kali Linux\n\n3. 软件包升级完成后，您可以运行命令\
  \ `sudo apt-get autoremove` 来移除任何不再需要的过时软件包，如图图 2.27 所示。\n\n    这将清理您的系统并释放磁盘空间。请参考图\
  \ 2.27：\n\n    ![](img/Figure_2.27.png)\n\n    图 2.27：清理您的系统\n\n4. 最后，您可以运行命令 `sudo\
  \ apt-get clean` 来清理软件包缓存，这将移除不再需要的下载包文件，如图图 2.28 所示：\n\n    ![](img/Figure_2.28.png)\n\
  \n    图 2.28：清理软件包缓存的命令\n\n\n\n\n\n| 注意：在启动更新或升级之前，建议对基本数据进行备份。这种预防性措施可以确保在更新或升级过程中出现任何问题时，您能够恢复数据。\
  \ |\n\n## 启用第三方 VAPT 工具](#contents.xhtml_sc2_74a)\n\n在追求无懈可击的安全时，有两个值得密切关注的强大工具：Mobile\
  \ Security Framework (MobSF) 和 Trivy。这些多功能安全解决方案在评估和加强您的数字防御方面发挥着至关重要的作用。在接下来的章节中，我们将深入探讨如何利用\
  \ MobSF 和 Trivy 的功能。\n\n让我们查看如何设置这些第三方 VAPT 工具：\n\n### MobSF 框架](#contents.xhtml_sc3_75a)\n\
  \nMobSF 是一个完整的移动应用安全测试工具箱，支持 Android 和 iOS。它是免费开源的，包含了分析、反汇编译和漏洞扫描等工具。使用 MobSF 有助于在黑客利用应用程序漏洞之前发现并修复它们，从而降低组织数据泄露和其他安全问题的概率。\n\
  \n要在 Kali Linux 2023.2 上运行 MobSF，请按照以下步骤操作：\n\n1. 通过运行命令 `sudo apt-get update` 更新您的\
  \ Kali Linux 系统上的软件包列表。\n\n2. 通过运行命令 `git clone https://github.com/MobSF/Mobile-Security-Framework-MobSF\
  \ --depth=1` 下载 MobSF 软件包，如图图 2.29\n\n    图 2.29：下载 MobSF 软件包\n\n3. 通过运行命令 `sudo\
  \ apt install python3-dev python3-venv python3-pip build-essential libffi-dev libssl-dev\
  \ libxml2-dev libxslt1-dev libjpeg62-turbo-dev zlib1g-dev wkhtmltopdf` 安装运行 MobSF\
  \ 需要的依赖项，如图图 2.30\n\n    图 2.30：安装依赖项\n\n4. 通过运行命令 `sudo ./setup.sh` 安装 MobSF，如图图\
  \ 2.31\n\n    图 2.31：安装 MobSF\n\n5. 通过运行命令 `sudo ./run.sh` 启动 MobSF 服务器，如图图 2.32\n\
  \n    图 2.32：启动 MobSF\n\n6. 打开浏览器并访问 URL `http://0.0.0.1:8000` 以访问 MobSF Web 界面，如图图\
  \ 2.33\n\n图 2.33：MobSF Web 界面\n\n您也可以参考官方 MobSF 文档以获取有关设置和使用该工具的更详细说明：`https://github.com/MobSF/Mobile-Security-Framework-MobSF/wiki/Installation-Guide`\n\
  \n| 注意：MobSF 赋予组织增强其移动应用安全的能力，针对潜在攻击提供强有力的防御，并确保关键数据的安全。 |\n\n要在 Kali Linux 中使用\
  \ Docker 设置 Mobile Security Framework (MobSF)，请按照以下步骤操作：\n\n1. 安装 Docker：打开终端并输入命令\
  \ `sudo apt install docker.io`，如图图 2.34\n\n    图 2.34：安装 Docker\n\n2. 启动 Docker：安装完成后，运行命令\
  \ `sudo systemctl start docker` 启动 Docker 服务，如图图 2.35\n\n    图 2.35：启动 Docker\n\n\
  3. 拉取 MobSF 镜像：从 Docker Hub 下载 MobSF 镜像，打开终端并执行命令 `sudo docker pull opensecurity/mobile-security-framework-mobsf`，如图图\
  \ 2.36\n\n    图 2.36：拉取 MobSF 镜像\n\n4. 运行 MobSF 容器：镜像成功下载后，运行命令 `sudo docker run\
  \ -it -p 8000:8000 opensecurity/mobile-security-framework-mobsf` 启动 MobSF 容器，如图图\
  \ 2.37\n\n    图 2.37：运行 MobSF 容器\n\n5. 访问 MobSF Web 界面：打开浏览器并导航到 `http://localhost:8000`\
  \ 以访问 MobSF Web 界面，如图图 2.38](#ch02.xhtml_fig2-38）所示。该界面允许您与 MobSF 交互并进行移动安全测试和分析：\n\
  \n    ![](img/Figure_2.38.png)\n\n    图 2.38：访问 MobSF Web 界面\n\n| 注意：对于使用 Docker\
  \ 进行简单的 MobSF 安装，只需从“opensecurity/mobile-security-framework-mobsf”获取 Docker 镜像即可。这种方便的方法可以快速简单地设置\
  \ MobSF。Docker 的显著优势在于它能够规避 Python 和其他前提条件的复杂性。 |\n\n### Trivy](#contents.xhtml_sc3_76a)\n\
  \nTrivy 是一个简单但彻底的为 CI/CD 流水线设计的容器漏洞扫描器。在 Kali Linux 上安装它非常容易，您可以通过命令行界面访问它。\n\n\
  以下是设置方法：\n\n1. 来说，使用命令 `wget https://github.com/aquasecurity/trivy/releases/download/v0.18.3/trivy_0.18.3_Linux-64bit.deb`\
  \ 下载 Trivy 安装脚本，如图图 2.39\n\n    图 2.39：下载 Trivy 安装脚本\n\n2. 使用命令 `sudo dpkg -i trivy_0.18.3_Linux-64bit.deb`\
  \ 安装 Trivy，如图图 2.40\n\n    图 2.40：安装 Trivy\n\n3. 一旦安装 Trivy，您就可以运行命令 `trivy image_name`\
  \ 来扫描容器镜像的漏洞，如图图 2.41\n\n    图 2.41：Trivy\n\n为了增加个性化定制，您有权为扫描定义额外设置。这些可能涉及设置报告漏洞的严重性级别，或指定特定的包名进行扫描。要深入探讨并探索完整的选项范围，可以检查\
  \ Trivy 文档 `https://github.com/aquasecurity/trivy`。\n\n| 注意：随着云环境中用于部署和运行应用程序的容器率日益增加，容器安全已成为网络安全的关键要素。\
  \ |\n\n## 设置漏洞机器和应用程序](#contents.xhtml_sc2_77a)\n\n现在，让我们通过检查涉及的步骤来探索配置不同的漏洞机器和应用程序的过程：\n\
  \n### 设置 Metasploitable 2](#contents.xhtml_sc3_78a)\n\nMetasploitable 2 是一个故意设计得很弱的虚拟机，用于探索和演示\
  \ Metasploit 框架的功能。它是磨练黑客技能、测试安全方法以及深入研究 Metasploit 框架运行机制的价值工具。\n\n要在 VMware 上设置\
  \ Metasploitable 2，您将需要执行以下步骤：\n\n1. 通过访问 Rapid7 网站 `https://information.rapid7.com/download-metasploitable-2017.html`\
  \ 获取 Metasploitable 2 虚拟机镜像，如图图 2.42\n\n    图 2.42：下载 Metasploitable 2\n\n2. 使用\
  \ VMware Workstation 或 VirtualBox 导入在第 1 步中下载的 Metasploitable 2 虚拟机镜像，如图图 2.43\n\
  \n    图 2.43：导入 Metasploitable 2 虚拟机\n\n3. 启动虚拟机并按照屏幕上的指令完成设置过程。尝试使用默认凭据登录：用户名 –\
  \ `msfadmin`，密码 – `msfadmin`，如图[图 2.44](#ch02.xhtml_fig2-44）所示：\n\n\n\n\n\n![](img/Figure_2.44.png)\n\
  \n图 2.44：使用默认凭据登录\n\n| 注意：有许多选项可以提升 VAPT 技能，最佳选择取决于个人或组织的特定目标和需求。 |\n\n## 设置 BWAPP\n\
  \nBWAPP，也称为 Buggy Web Application（漏洞 Web 应用程序），是一个故意设计不安全的 Web 应用程序，用于训练和安全测试。它可以帮助专家掌握典型的\
  \ Web 应用程序漏洞，如 SQL 注入、跨站脚本（XSS）和其他类型攻击。BWAPP 是开源的，免费下载，任何人都可以使用。为了在性能和安全性方面获得最佳效果，建议在专用的\
  \ Windows 虚拟机（VM）上运行 BWAPP。\n\n要在 Windows 虚拟机上设置 BWAPP，你需要按照以下步骤操作：\n\n1. 在你的 Windows\
  \ 虚拟机上下载并安装最新版本的 `XAMPP`。这将为 BWAPP 提供本地服务器环境。\n2. 从官方网站下载最新版本的 BWAPP，并将文件提取到 `XAMPP`\
  \ 安装目录下的 `htdocs` 文件夹中，如图图 2.45 所示：\n   ![](img/Figure_2.45.png)\n   图 2.45：将文件提取到“htdocs”文件夹\n\
  3. 通过进入控制面板并点击这些模块旁的 `Start` 按钮启动 `XAMPP` 中的 `Apache` 和 `MySQL` 模块，如图图 2.46 所示：\n\
  \   ![](img/Figure_2.46.png)\n   图 2.46：启动 Apache 和 MySQL\n4. 打开浏览器并访问以下 URL：[`localhost/bwapp/install.php`](http://localhost/bwapp/install.php)。这将启动\
  \ BWAPP 安装向导，如图图 2.47 所示：\n   ![](img/Figure_2.47.png)\n   图 2.47：BWAPP 安装向导\n5.\
  \ 安装完成后，你可以通过在浏览器中访问 [`localhost/bwapp`](http://localhost/bwapp) 来访问 BWAPP，如图图 2.48\
  \ 所示：\n   ![](img/Figure_2.48.png)\n   图 2.48：安装完成\n6. 使用默认用户名和密码登录 BWAPP。\n\n|\
  \ 注意：BWAPP 使用 `PHP` 开发并利用 `MySQL` 数据库，可以配置在如 `XAMPP` 的本地服务器上，也可以在远程 Web 服务器上。 |\n\
  \n## 总结\n\n我们的 VAPT 测试实验室设置模块已成功完成。本章侧重于建立攻击实验室和构建真实测试环境的实操方面。掌握这些知识后，你现在拥有了创建自己的本地实验室并理解特定设置前提的能力。本章不仅传授了实验室设置的逐步理解，还介绍了关键的\
  \ VAPT 概念和工具，包括 Kali Linux，它有助于在目标上上运行练习和漏洞利用程序。\n\n在接下来的章节中，我们将深入探索侦察策略在有效渗透测试中的重要性。通过侦察获取关于目标的充分信息对于构建测试所需的要素起着至关重要的作用。侦察是漏洞评估和渗透测试（VAPT）的第一步，为整个过程奠定了基础并确保了其的圆满执行。\n\
