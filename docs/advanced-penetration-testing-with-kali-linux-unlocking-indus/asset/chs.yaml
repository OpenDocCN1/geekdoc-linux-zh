  \n    ![](img/Figure_6.44.png)\n    图 6.44：已建立的 meterpreter 连接\n\n| 注意：攻击者可以利用 Web\
  \ 应用程序中的 Web Shell 上传漏洞来实施严重的安全威胁，包括远程代码执行、数据窃取、持久的未经授权访问和网站篡改。为了防止此类攻击，在 Web 应用程序中实施严格的文件上传限制、访问控制和输入验证机制至关重要。\
  \ |\n\n## HTTP 参数污染\n\n当恶意攻击者向 HTTP 请求添加新参数或修改现有参数时，就会出现被称为 `HTTP parameter pollution`（HTTP\
  \ 参数污染）的安全漏洞。这种利用可以绕过安全措施、更改服务器端功能、修改用户数据或执行任意代码。这些操作可能会导致 Web 应用程序产生无意或有害的行为。\n\
  \n为了说明 `HTTP parameter pollution` 的影响，我们将使用 `bWAPP` 应用程序中的投票功能。通过在 URL 中添加额外参数，我们可以操纵投票机制。以下逐步指南概述了这一过程：\n\
  \n1. 打开 `bWAPP` 并导航到 `HTTP Parameter Pollution` 页面，如图 6.45](#ch06.xhtml_fig6-45)所示：\n\
  \n    ![](img/Figure_6.45.png)\n    图 6.45：导航到 HTTP 参数污染页面\n\n2. 在搜索框中输入名称 `Tony`\
  \ 并点击继续按钮。这将显示电影列表，如图 6.46](#ch06.xhtml_fig6-46)所示：\n\n    ![](img/Figure_6.46.png)\n\
  \    图 6.46：输入名称 Tony 并点击继续按钮\n\n3. 接下来，选择任意电影并点击 `Vote` 按钮。生成的 URL 看起来如下：`http://192.168.29.25/bwapp/hpp-3.php?movie=6&name=tony&action=vote`，它包含三个参数：`movie`、`name`\
  \ 和 `action`，如图 6.47](#ch06.xhtml_fig6-37)所示：\n\n    ![](img/Figure_6.47.png)\n\
  \    图 6.47：选择任意电影并点击 vote 按钮\n\n4. 复制相同的 URL 并添加新参数（例如 `&movie=2`），以创建一个修改后的 URL，如\
  \ `http://192.168.29.25/bwapp/hpp-3.php?movie=6&name=tony&action=vote&movie=2`。将此修改后的\
  \ URL 粘贴到浏览器地址栏并运行。如果存在 `HTTP Parameter Pollution`，票数将计入电影 2 而不是电影 6，如图 6.48](#ch06.xhtml_fig6-48)所示：\n\
  \n    ![](img/Figure_6.48.png)\n    图 6.48：复制相同的 URL 并添加新参数\n\n| 注意：攻击者可以使用被称为 HTTP\
  \ 参数污染 (HPP) 的漏洞来操纵 Web 应用程序中的 URL 参数，以执行各种攻击，包括绕过安全控制、访问敏感数据、篡改功能和发起 DoS 攻击。 |\n\
  \n## 业务逻辑漏洞\n\n业务逻辑漏洞是软件漏洞的一种，其中应用程序的设计和逻辑存在缺陷，允许攻击者操纵应用程序的预期行为以获取其利益。与缓冲区溢出或 `SQL\
  \ 注入` 等传统漏洞相比，业务逻辑漏洞可能更复杂且更难检测，但一旦发现，它们可能会产生更大的影响。它们特定于应用程序及其预期用途；识别和解决业务逻辑漏洞需要对应用程序的设计和预期功能有深入的理解。\n\
  \n\n\n\n这些缺陷可能会导致各种安全问题，包括数据窃取、未经授权访问敏感信息以及财务欺诈。业务逻辑漏洞的示例包括操纵交易值、绕过访问控制或更改用户权限。对于开发者来说，对应用程序进行彻底测试以便攻击者利用它们之前识别并解决业务逻辑漏洞非常重要。此外，持续的监控和测试有助于确保在应用程序更新或更改期间不会引入或重新引入这些漏洞。\n\
  \n让我们通过一个简单的 CAPTCHA 绕过示例，来说明如何在 `bWAPP` 中利用业务逻辑漏洞。请按照下面解释的步骤进行操作，以更好地理解这一概念：\n\n\
  1. 首先，打开 `bWAPP` 并导航到 `Broken Auth. - CAPTCHA Bypassing` 页面。用随机凭据和 Captcha 字段填充登录表单，然后点击\
  \ `Login` 按钮，如图图 6.49 所示：\n   ![](img/Figure_6.49.png)\n   图 6.49：导航 `Broken Auth.\
  \ - CAPTCHA Bypassing` 页面\n\n2. 拦截登录请求，右键点击页面将请求发送到 `Intruder`。点击 `Positions` 标签页并选择\
  \ `Clear` 按钮。将 `Attack` 类型更改为 `Cluster bomb`（组合），并在 `Position` 标签页中同时选择 `username`\
  \ 和 `password` 作为攻击参数，如图图 6.50 所示：\n   ![](img/Figure_6.50.png)\n   图 6.50：将 `Attack`\
  \ 类型改为 `Cluster bomb`\n\n3. 点击 `Payload` 标签页并选择 `Payload set 1`。将 `Payload type`\
  \ 设置为 `Simple list`，并在 `Add` 框中添加 `test`、`bee`、`admin` 和 `root` 等值，如图图 6.51 所示：\n\
  \   ![](img/Figure_6.51.png)\n   图 6.51：选择 `Payload set 1`\n\n4. 选择 `Payload set\
  \ 2` 并将 `Payload type` 设置为 `Simple list`。在 `Add` 框中包含 `bug`、`test` 和 `password`\
  \ 等值。由于测试的组合数量很大，此攻击可能需要一段时间才能执行。见图 6.52 ：\n   ![](img/Figure_6.52.png)\n   图 6.52：选择\
  \ `payload set 2`\n\n5. 点击 `Options` 标签页并进入 `Grep - Match`。勾选 `Flag result items\
  \ with responses matching these expressions` 旁边的选择框。点击 `Clear`，然后点击 `Yes` 并添加您的注释。确保\
  \ `Match type` 设置为 `Simple String` 并勾选 `Exclude HTTP Headers` 旁边的框，如图图 6.53 所示：\n\
  \   ![](img/Figure_6.53.png)\n   图 6.53：点击 `Options` 标签页并进入 `Grep - Match`\n\n6.\
  \ 返回上一步的 `Positions` 标签页并点击 `Start Attack` 启动破解攻击。破解过程将开始，如图图 6.54 所示：\n   ![](img/Figure_6.54.png)\n\
  \   图 6.54：破解攻击\n\n7. 点击 `Length` 标签页并检查 `bee` 和 `bug` 的结果。然后，点击 `Response` 标签页并搜索短\
  \ `successful login`。最后，点击 `Render` 标签页在 UI 中查看成功登录页面。结果是`bee` 用户已成功绕过 `Captcha`\
  \ 机制，如图图 6.55 所示：\n   ![](img/Figure_6.55.png)\n   图 6.55：检查 `bee` 和 `bug` 的结果\n\
  \n| 注意：关键的业务逻辑漏洞对 Web 应用程序的安全构成了重大威胁。这些漏洞可以以多种形式出现，例如绕过安全控制、篡改支付、提升权限、操纵用户输入以及访问敏感数据。\
  \ |\n\n### 结论\n\n总之，本章是 Web 应用程序利用的全面指南，涵盖了基础和高级别的漏洞利用。它强调了理解 Web 应用程序漏洞及其如何利用它们的重要性，特别是在当今数字时代，Web\
  \ 应用程序已成为日常运营不可或缺的一部分。本章解释了常见的攻击向量，教授了如何创建威胁模型以进行高效测试，并提供了进行复杂评估所需的知识。凭借这些知识，Web\
  \ 应用程序审计员和渗透测试人员可以更好地识别和利用 Web 应用程序中的技术和业务逻辑流，并将较小的漏洞链联以理解其影响。\n\n在下一章中，渗透测试人员将对利用无线网络有深入的理解，包括漏洞、各种攻击类型以及用于保护这些网络的安全机制。此外，测试人员还将接触无线网络分析的高级工具和技术，使其能够获取关键知识和技能，更好地保护自己免受无线网络攻击。\n\
