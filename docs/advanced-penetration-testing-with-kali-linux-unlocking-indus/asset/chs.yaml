  \n![](img/Figure_6.11.png)\n\n图 6.11: 验证当前用户账户具有具有权限\n\n8. 使用命令 `sqlmap -u <target\
  \ URL> --random-agent --os-shell` 获取 DBA 为 true OS shell。OS shell 是一种命令行界面，用于与操作系统进行交互并执行各种任务，如运行命令、自动化任务、自定义环境和调试问题。参见图\
  \ 6.12：\n\n命令：`sqlmap -u http://192.168.29.25/bWAPP/sqli_1.php?title= --cookie=\"\
  PHPSESSID=q8omhem3kkoi09sfnfo9ukim22;security_level=0\" --random-agent --os-shell`\n\
  \n![](img/Figure_6.12.png)\n\n图 6.12: 获取 DBA 为真的 OS shell\n\n| 注意：与 GET 参数中的 SQL\
  \ 注入类似，POST 参数中的 SQL 注入涉及恶意用户在网站表单的输入字段中插入 SQL 语句，意在利用后端数据库漏洞并获得敏感数据的未授权访问，甚至控制整个\
  \ Web 服务器。 |\n\n### PHP 代码执行](#contents.xhtml_sc3_157a)\n\nPHP 代码执行，或远程代码执行 (RCE)，是一种安全漏洞，允许攻击者在运行\
  \ PHP 的服务器上运行任意代码或命令。当用户输入在使用用于执行代码的 PHP 函数（如 `eval()` 函数）之前没有经过正确清理或验证时，就会产生此漏洞。该漏洞允许攻击者将其\
  \ PHP 代码插入到服务器并执行它。这可能导致对系统的未授权访问或完全控制。\n\n为了为了实性地理解如何利用 PHP 代码执行，我们将使用 bWAPP 中单个\
  \ GET 参数的示例。以下是在 bWAPP 中测试和利用 PHP 代码注入漏洞的逐步方法：\n\n1. PHP 代码注入页面是一个显示反射消息的测试页面。要查看它是如何工作的，点击消息，将出现一条测试消息，如图\
  \ 6.13 所示：\n\n![](img/Figure_6.13.png)\n\n图 6.13: PHP 代码注入页面\n\n2. 你可以通过修改 URL 使其包含你想要的消息来编辑默认消息。要这样做，请在\
  \ URL 中添加 `message=your-message`，如图 6.14 所示：\n\n![](img/Figure_6.14.png)\n\n图 6.14:\
  \ 通过修改 URL 编辑默认消息\n\n3. 通过 PHP 代码注入，你还可以访问服务器上的各种信息。例如，你可以通过在 test 后添加分号（`;`）并在\
  \ URL 中使用 `system('dir')` 命令列出目录。同样，你可以使用 `system('cat /etc/passwd')` 命令访问密码；参见图\
  \ 6.15：\n\n![](img/Figure_6.15.png)\n\n图 6.15: 获取目录列表\n\n4. 你可以使用 URL 中的使用 `system('whoami')`\
  \ 命令来检查用户/组，如图 6.16 所示：\n\n![](img/Figure_6.16.png)\n\n图 6.16: 检查用户/组\n\n| 注意：bWAPP\
  \ 是一种旨在促进漏洞测试的 Web 应用程序，包括与命令和代码注入相关的漏洞。用户可以访问应用程序中的多个页面来测试特定漏洞，例如命令注入 (Shellshock)、基于时间的命令注入、PHP\
  \ 代码注入、XPath 注入和服务器端包含 (SSI) 注入。 |\n\n### 登录暴力破解](#contents.xhtml_sc3_158a)\n\n\
  暴力破解登录攻击是一种常见的网络攻击类型，涉及攻击者反复尝试不同的用户名和密码组合以获得对应用程序或系统的未授权访问。这些攻击通常是自动化的，会导致用户账户或管理员功能的破坏。\n\
  \n为了更好地理解暴力破解登录攻击，让我们来看一个 bWAPP 的示例。以下是使用 Burp Suite Intruder 在 bWAPP 上利用暴力破解漏洞的逐步方法：\n\
