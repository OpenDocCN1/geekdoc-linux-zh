  # 第 7 章：利用无线网络\n\n## 引言\n\n本章对无线网络渗透测试进行了广泛探索，涵盖了旨在评估各种无线网络（如 Wi-Fi 和蓝牙）安全性的技术、工具和方法论。主要目标是发现这些网络固有的漏洞和潜在威胁，同时为增强安全性建立稳固的防御措施。\n\
  \n## 结构\n\n在本章中，我们将讨论以下主题：\n\n*   无线渗透测试简介\n*   无线网络基础\n    *   无线网络和协议概述\n    *\
  \   无线网络拓扑和架构\n    *   射频基础\n*   无线安全威胁与标准\n    *   常见的无线安全威胁\n*   无线安全概述\n*   无线渗透测试方法论\n\
  \    *   无线渗透测试涉及的步骤\n    *   无线渗透测试的方法\n*   无线渗透测试工具\n    *   无线渗透测试工具概述\n    *\
  \   常见的无线渗透测试工具\n*   为无线渗透测试配置 Kali Linux\n    *   为无线渗透测试准备 Kali Linux\n    * \
  \  配置 Kali Linux 以进行无线攻击\n*   无线网络利用技术\n    *   破解 WPA/WPA2 加密\n    *   使用伪造访问点进行中间人攻击\n\
  \    *   绕过隐藏 SSID\n    *   绕过 MAC 和开放认证\n    *   拒绝服务攻击\n*   高级无线攻击\n    *   使用\
  \ Reaver 攻击无线路由器\n\n## 目标\n\n本章的目标是双重的。首先，它提供了关于无线网络渗透测试的实践见解，涵盖了一个完整的序列——从初始侦察和数据收集到漏洞扫描、利用、综合报告和高效修复。其次，本章强调了遵循结构化且行业认可的无线网络渗透测试方法的重要性，以确保对安全格局进行细致且准确的评估。\n\
  \n## 无线渗透测试简介\n\n\n\n\n\n无线网络容易受到各种威胁，包括窃听、中间人 (MITM) 攻击、拒绝服务 (DoS) 攻击以及非法访问点。尽管无线网络提供了许多便利性和移动性，但对于任何使用此类网络的人来说，安全性必须是首要任务。为了解决这些安全疑虑，无线渗透测试已变得至关重要。这一过程涉及评估无线网络的安全性，以识别漏洞并评估现有安全措施的有效性。对于依赖无线网络传输敏感数据的组织而言，无线渗透测试尤为关键。\n\
  \n`Kali Linux` 是一种流行的 Linux 发行版，专门为渗透测试和安全评估设计，侧重于无线网络安全。它包含了大量的无线渗透测试工具，对于任何想要测试其无线网络安全的人来说都是宝贵的资源。\n\
  \n> 注意：在进行 Wi-Fi 渗透测试时，请谨慎并优先考虑安全、隐私和伦理考量，以尽力减少对合法用户和网络的干扰及潜在危害。\n\n## 无线网络基础知识\n\
  \n要成功进行高级渗透测试，必须在无线网络基础方面有实的基础。鉴于无线网络在现代生活中无处不在，理解其工作原理对于检测漏洞和测试其安全措施至关重要。\n\n###\
  \ 无线网络与协议概述\n\n对无线网络基础的深入理解体现在对无线网络和协议的全面掌握上。这包括对各种无线通信技术（如 `Wi-Fi` 和 `蓝牙`）及其原理的概述。理解底层协议对于识别潜在漏洞和有效测试安全措施至关重要。\n\
  \n### 无线网络拓扑与架构\n\n无线网络拓扑和架构是无线网络基础的另一个关键方面。这涉及理解网络结构，以了解设备之间如何相互作用。高级渗透测试人员需要能够审查并定位各种网络拓扑中的漏洞，范围从简单的点对点连接到复杂的网状网络。\n\
  \n### 射频基础知识\n\n了解射频 (RF) 基础对于无线网络渗透测试很重要。RF 技术是无线通信的关键，理解其原理有助于发现安全风险。这意味着要学习无线网络中的不同频率、它们的移动方式以及如何利用它们来发现漏洞。\n\
  \n## 无线安全威胁与标准\n\n在高级渗透测试中，拥有无线安全威胁和标准的知识至关重要。随着无线网络的广泛应用，它们已成为攻击者的首选目标。因此，理解常见的无线安全威胁至关重要，这有助于识别漏洞并评估安全措施的有效性。\n\
  \n### 常见无线安全威胁\n\n无线网络容易受到各种安全威胁，如窃听、中间人 (MITM) 攻击、DoS 攻击、非法访问点和密码攻击。了解这些威胁及其可能造成的危害，对无线网络进行彻底的安全评估至关重要。\n\
  \n### 无线安全概述\n\n无线安全标准和漏洞对于深入理解无线网络安全也同样重要。虽然已经实施了如 `WPA2` 和 `WPA3` 等标准来增强无线安全，但它们并非不受攻击者利用。因此，识别这些标准中的潜在漏洞以及它们如何被利用是非常。\n\
  \n## 无线渗透测试方法\n\n作为高级渗透测试的关键组成部分，无线渗透测试涉及审查无线网络和设备的安全性。通过采用结构化的方法测试无线安全，无线渗透测试方法在检测无线网络和设备漏洞方面发挥着关键作用。\n\
  \n### 无线渗透涉及的步骤\n\n无线渗透测试方法由一系列顺序步骤组成，用于有效识别无线网络和设备中的漏洞，如图 7.1 所示：\n\n![](img/Figure_7.1_.png)\n\
  \n图 7.1：无线渗透测试涉及的步骤\n\n1. **侦察**：侦察涉及收集有关无线网络和连接设备的信息，包括 `SSID`、加密类型和其他相关详细信息。\n\
  2. **枚举**：枚举涉及识别在无线网络和设备上运行的服务，包括开放端口和协议。\n3. **漏洞评估**：漏洞评估涉及识别无线网络和设备的潜在弱点，包括客户端设备和\
  \ `APs` 的漏洞以及加密漏洞。\n4. **利用**：在这一步中，测试人员尝试利用之前发现的弱点。这可能涉及绕过无线网络加密或在未经许可的情况下进入设备和网络。\n\
  6. **报告**：报告涉及记录测试过程中的发现和采取的行动，以提供关于识别出的漏洞的全面报告。\n\n### 无线渗透测试方法\n\n为了成功完成无线渗透测试任务，必须考虑以下因素，因为无线渗透测试的方法可能随目标而异。见图\
  \ 7.2：\n\n![](img/Figure_7.2_.png)\n\n图 7.2：无线渗透测试方法\n\n1. **定义目标**：根据测试结果识别所需信息和行动的关键步骤。这有助于测试活动与组织目标和需求保持一致。\n\
  2. **获取许可**：在进行任何无线渗透测试活动之前，测试人员必须获得组织或无线网络所有者的许可。这有助于避免因未经授权的测试活动可能引起的任何法律问题。\n\
  3. **合道德地测试**：使用适当工具和技术以诚信和伦理进行无线渗透测试至关重要。测试人员应避免对无线网络或设备造成任何损坏，并遵守测试指南和标准。\n4.\
  \ **报告结果**：准确及时地报告结果至关重要。报告应包括详细的发现、改进无线网络和设备安全的建议，以及可能存在的任何风险或漏洞。这有助于组织采取适当措施降低风险并增强安全态势。\n\
  \n## 无线渗透测试工具\n\n进行有效精确的无线网络和设备测试需要使用无线渗透测试工具。无线渗透中使用多种类型的工具，我们将在本节中探讨它们。\n\n###\
  \ 无线渗透测试工具概述\n\n\n\n\n\n使用软件或硬件形式的无线渗透测试工具，可以识别无线网络和设备中的漏洞。这些工具的创建是为了模拟真实攻击，并提供有关无线网络安全状况的全数据。使用这些工具的主要目标是确定\
  \ AP（接入器）、客户端设备以及无线网络本身的潜在漏洞。\n\n## 常见的无线渗透测试工具\n\n无线渗透测试涉及利用多种软件和硬件工具模拟真实攻击，并获取网络安全态的价值见解。无线渗透测试中常用的几种工具包括：\n\
  \n*   `Aircrack-ng`: 该工具能够破解 WEP 和 WPA/WPA2-PSK 密钥。此外，它可以捕获并分析网络流量，以识别潜在的漏洞和安全问题。\n\
  *   `Wireshark`: `Wireshark` 是一款强大的网络协议分析器，允许测试人员捕获并分析网络流量。它提供了发送和接收数据包的详细信息，是识别安全威胁和漏洞的有效工具。\n\
  *   `Kismet`: `Kismet` 可无线网络检测器、嗅探器和入侵检测系统。它可以检测隐藏的无线网络、未经授权的接入点以及无线网络中的其他安全威胁。\n\
  *   `NetStumbler`: `NetStumbler` 是一个可以识别无线网络和接入点，同时检测无线网络安全漏洞的工具。\n*   `Reaver`:\
  \ `Reaver` 是一种利用启用 WPS 的无线网络漏洞来恢复 WPA/WPA2 密码的工具。它在评估此类网络的安全性时特别有用。\n\n| 注意：请遵循公认的方法（如\
  \ OWASP 无线安全测试指南）采用标准的无线渗透测试方法。保持工具和技术的更新，以进行有效且彻底的测试。 |\n\n## 为无线渗透测试配置 Kali Linux\n\
  \n有效的无线渗透测试需要正确配置 Kali Linux 以进行无线攻击。这种设置允许测试人员模拟真实情况、确定漏洞并全面评估无线网络的安全性。为无线渗透测试准备\
  \ Kali Linux\n\n在开始无线渗透测试过程之前，验证 Kali Linux 是否配置正确至关重要。请按照以下步骤确保配置正确：\n\n1. 要更新并升级\
  \ Kali Linux 操作系统，你需要运行命令 `sudo apt-get update && sudo apt-get upgrade`。该命令如图 7.3\
  \ 所示：\n\n   ![](img/Figure_7.3_.png)\n\n   图 7.3：更新和升级 Kali Linux\n\n2. 要安装必要的无线驱动程序，运行命令\
  \ `sudo apt-get install firmware-iwlwifi`。\n\n   | 注意：请注意，根据你使用的无线适配器可能需要安装驱动。 |\n\
  \n   参见图 7.4：\n\n   ![](img/Figure_7.4_.png)\n\n   图 7.4：安装所需的无线驱动\n\n3. 要验证无线接口的可用性，你可以运行如图\
  \ 7.5 所示的命令 `iwconfig`：\n\n   ![](img/Figure_7.5_.png)\n\n   图 7.5：验证无线接口的可用性\n\n\
  4. 要安装必要的工具，运行命令 `sudo apt-get install aircrack-ng wireshark kismet reaver`。该命令如图\
  \ 7.6 所示：\n\n   ![](img/Figure_7.6_.png)\n\n   图 7.6：安装必要的工具\n\n一旦安装了这些工具，就可以继续配置\
  \ Kali Linux 用于无线攻击。\n\n## 为无线攻击配置 Kali Linux\n\n现在 Kali Linux 已准备就绪，下一步是将其配置用于无线攻击。请按照下面的步骤操作：\n\
  \n1. 首先在你的计算机上打开终端或命令提示符。执行命令 `sudo ifconfig wlan0 down` 以禁用无线局域网接口。视觉指导请参考图 7.7：\n\
  \n   ![](img/Figure_7.7_.png)\n\n   图 7.7：禁用无线局域网接口\n\n2. 使用命令 `sudo airmon-ng check\
  \ kill` 检查是否存在干扰进程，如果检测到则将其终止。参考图 7.8 进行视觉参考：\n\n   ![](img/Figure_7.8_.png)\n\n\
  \   图 7.8：检查干扰进程\n\n3. 通过运行命令 `sudo iwconfig wlan0 mode monitor` 将无线局域网接口设置为监听模式。此外，请注意我们需要一个支持监听模式的额外适配器。视觉指令可以在图\
  \ 7.9 中找到：\n\n   ![](img/Figure_7.9_.png)\n\n   图 7.9：无线局域网接口进入监听模式\n\n4. 使用命令 `sudo\
  \ ifconfig wlan0 up` 激活无线局域网接口。参见图 7.10 的视觉表示：\n\n   ![](img/Figure_7.10_.png)\n\
  \n   图 7.10：激活无线局域网接口\n\n5. 通过运行如图 7.11 所示的命令 `iwconfig` 验证接口是否处于监听模式：\n\n   ![](img/Figure_7.11_.png)\n\
  \n   图 7.11：验证接口处于监听模式\n\n6. 使用命令 `sudo airodump-ng wlan0` 扫描可用的无线网络，如图 7.12 和 7.13\
  \ 所示：\n\n   该命令在下方的图 7.12 中描述：\n\n   ![](img/Figure_7.12_.png)\n\n   图 7.12：查看可用无线网络的命令\n\
  \n   在图 7.13 中，你可以看到可用的无线网络及其 BSSID 和 ESSID：\n\n   ![](img/Figure_7.13_.png)\n\n\
  \   图 7.13：扫描可用无线网络（输出）\n\n7. 选择目标网络并使用命令 `sudo airodump-ng --bssid <target_BSSID>\
  \ -c <channel> -w <output_file> wlan0` 捕获数据包，如图 7.14 和 7.15 所示：此处 BSSID 代表基本服务集标识符。\n\
  \n   图 7.14 展示了捕获数据包所需的命令：\n\n   ![](img/Figure_7.14_.png)\n\n   图 7.14：开始捕获数据包的命令\n\
  \n   图 7.15 下方详细描述了捕获的数据包：\n\n   ![](img/Figure_7.15_.png)\n\n   图 7.15：选择目标网络并捕获数据包（输出）\n\
  \n8. 一旦捕获了足够的数据包，使用命令 `sudo aircrack-ng -w <wordlist> <output_file.cap>` 破解无线密码，如图\
  \ 7.16 和 7.17 所示：\n\n   图 7.16 展示了破解密码所需的命令：\n\n   ![](img/Figure_7.16_.png)\n\n\
  \   图 7.16：破解无线密码的命令\n\n   图 7.17 显示了破解密码命令的输出：\n\n   ![](img/Figure_7.17_.png)\n\
  \n   图 7.17：破解无线密码（输出）\n\n| 注意：强烈建议使用 ALFA NETWORK 卡（特别是 AWUS036NH 适配器）配合 Kali 进行可靠的无线渗透测试。这些卡支持\
  \ 802.11 b、g 和 n 无线协议，并且可以在网上轻松买。虽然在本章中使用了 TP-Link WN722N 外部 Wi-Fi 适配器；但请注意需要手动设置驱动程序才能在\
  \ Kali Linux 中正常工作。 |\n\n## 无线网络利用技术\n\n在无线网络安全领域，存在多种可以用于获取未经授权访问无线网络的利用技术。\n\n\
  ## 破解 WPA/WPA2 加密\n\n\n\n\n\nWPA/WPA2 是一种广泛用于保护无线网络的安全协议，但它仍然容易受到破解攻击和字典攻击的威胁。在本节中，我们将深入研究破解\
  \ WPA/WPA2 加密的技术步骤。让我们探索破解无线网络 WPA/WPA2 加密的具体方法：\n\n1.  首先，使用 `iwconfig` 命令检查你的网络适配器是否已连接，以及你是否可以看到无线接口，如图\
  \ 7.18 所示：\n\n    ![](img/Figure_7.18_.png)\n\n    图 7.18：检查网络适配器连接\n\n2.  接下来，使用\
  \ `sudo airmon-ng start wlan0` 命令为你的无线接口启用监控模式。图 7.19 显示了启用监控模式的接口为 `wlan0`：\n\n\
  \    ![](img/Figure_7.19_.png)\n\n    图 7.19：为无线接口启用监控模式\n\n3.  为了从目标无线接入点 (AP)\
  \ 捕获数据包，通过运行命令 `sudo airodump-ng wlan0 --essid <ESSID Name>` 获取 BSSID 和广播通道，如图 7.20\
  \ 所示。这里的 ESSID 代表扩展服务集标识符（Extended Service Set Identifier）。\n\n    ![](img/Figure_7.20_.png)\n\
  \n    图 7.20：获取 BSSID 和广播通道\n\n4.  一旦获得 BSSID 和广播通道信息，运行命令 `sudo airodump-ng wlan0\
  \ -c 1 -b C4:E5:32:A1:E0:28 -w <output_file>` 来从 AP 捕获数据包，如图 7.21 和 7.22 所示。\n\n\
  \    图 7.21 说明了捕获数据包所需的命令：\n\n    ![](img/Figure_7.21_.png)\n\n    图 7.21：数据包捕获命令\n\
  \n    图 7.22 显示了数据包捕获命令的输出：\n\n    ![](img/Figure_7.22_.png)\n\n    图 7.22：从 AP\
  \ 捕获数据包\n\n5.  为了生成 IV，通过运行命令 `sudo aireplay-ng --deauth 0 -c C8:94:02:B4:66:71\
  \ -a C4:E5:32:A1:E0:28 wlan0` 使连接到 AP 的客户端取消认证。在取消认证后，捕获握手包，其中包含 WPA2 密钥或密码。参见图\
  \ 7.23：\n\n    ![](img/Figure_7.23_.png)\n\n    图 7.23：取消连接到 AP 的客户端的认证\n\n    你可以通过暴力破解或字典攻击来破解\
  \ WPA2 密码。要暴力破解，使用 `crunch` 工具并运行命令 `sudo crunch 8 8 B123790 -o newwordlist.txt\
  \ && sudo aircrack-ng -w newwordlist.txt newpcaptureoutput-01.cap`，如图 7.24 和 7.25\
  \ 所示。在字典攻击成功后，你可以获得目标 AP 的精确密码。图 7.24 明了破解密码所需的命令：\n\n    ![](img/Figure_7.24_.png)\n\
  \n    图 7.24：破解 WPA2 密码\n\n    图 7.25 显示了密码破解命令的输出：\n\n    ![](img/Figure_7.25_.png)\n\
  \n    图 7.25：破解 WPA2 密码（输出）\n\n| 注意：`Airmon-ng` 用于启用监控模式，`Airodump-ng` 捕获网络数据包，`Aireplay-ng`\
  \ 注入测试流量，而 `Crunch` 用于生成自定义字典列表。这些工具对于无线渗透测试至关重要，在安全评估期间提供了监控、捕获、注入和生成数据的能力。 |\n\
  \n### 使用伪造接入点的中间人攻击](#contents.xhtml_sc3_187a)\n\n在本节中，我们将讨论对无线网络进行 MITM（中间人）攻击的步骤，涉及拦截和修改接入点与客户端之间的通信。我们将演示使用伪造接入点的\
  \ MITM 攻击：\n\n1.  在确保 TP-Link WN722N 或任何外部 Wi-Fi 适配器处于监控模式后，将其连接到你的 Kali Linux 机器以继续后续步骤。\n\
  \n2.  使用命令 `sudo airbase-ng -e <SSID> -c <channel> -P wlan0` 创建自定义 SSID 和安全设置，如图\
  \ 7.26 所示：\n\n    ![](img/Figure_7.26_.png)\n\n    图 7.26：创建具有自定义 SSID 的伪造接入点\n\n\
  3.  连接到伪造接入点的客户端将通过你的 Kali Linux 机器重定向流量。\n\n### 绕过隐藏 SSID](#contents.xhtml_sc3_188a)\n\
  \n无线网络可能利用 MAC 地址认证或开放认证等安全措施来防止未经授权的访问。然而，这些措施并非无一失，可以使用各种工具和技术轻松绕过。\n\n1.  在终端运行命令\
  \ `sudo apt install mdk3` 安装 `mdk3`，如图 7.28 所示：\n\n    ![](img/Figure_7.28_.png)\n\
  \n    图 7.28：安装 mdk3\n\n2.  使用命令 `sudo airodump-ng wlan0` 扫描可用网络。在输出中，你可以观察到网络 `C4:E5:32:A1:E0:28`\
  \ 是隐藏的。参见图 7.29：\n\n    ![](img/Figure_7.29_.png)\n\n    图 7.29：扫描可用网络\n\n3.  在终端运行命令\
  \ `sudo mdk3 wlan0 p -b l -c 11 -t <MAC of target access point>` 在 brutorce 模式下启动\
  \ `mdk3`。参见图 7.30：\n\n    ![](img/Figure_7.30_.png)\n\n    图 7.30：在 brutorce 模式下启动\
  \ mdk3\n\n| 序号 | 符号 | 描述 |\n| :--- | :--- | :--- |\n| 1 | U | 大写 |\n| 2 | N | 数字\
  \ |\n| 3 | A | 所有可打印字符 |\n| 4 | C | 大小写字母 |\n| 5 | M | 大小写字母加数字 |\n| 6 | C | 通道\
  \ |\n\n表 7.1：命令含义\n\n在运行 `mdk3` 命令后，隐藏的 SSID 名称将显示在终端上，可用于进一步攻击。\n\n| 注意：隐藏 SSID\
  \ 是不广播名称的 Wi-Fi 网络，使其通过常规扫描检测到。可以通过主动扫描探测响应或利用 `Airodump-ng` 等工具通过分析探测响应来捕获并发现隐藏的\
  \ SSID。 |\n\n### 绕过 MAC 和开放认证](#contents.xhtml_sc3_189a)\n\n无线网络可能利用 MAC 地址认证或开放认证等安全措施来防止未经授权的访问。然而，这些措施并非无一失，可以使用各种工具和技术轻松绕过。\n\
  \n1.  继续上一节“破解 WPA/WPA2 加密”中的第 1 到 2 步，以收集目标客户端的关键信息，包括其 MAC 地址。随后将使用此 MAC 地址欺骗我们的\
  \ Wi-Fi 适配器的 MAC 地址，欺骗目标 Wi-Fi 路由器认为连接请求仅源自白名单中的 MAC 地址。 |\n\n\n\n\n\n2. 接下来，我们需要关闭监控接口\
  \ `wlan0`，可以通过执行图 7.31 中所示的命令 `sudo airmon-ng stop wlan0`来实现：\n\n    ![](img/Figure_7.31_.png)\n\
  \n    图 7.31: 关闭监控接口 wlan0\n\n3. 通过执行命令 `sudo systemctl stop NetworkManager` 来临时禁用网络管理器，如图图\
  \ 7.32 所示：\n\n    ![](img/Figure_7.32_.png)\n\n    图 7.32: 临时禁用网络管理器\n\n4. 之后，我们可以使用命令\
  \ `sudo ifconfig wlan0 down` 来关闭我们想要伪造 MAC 地址的无线接口，如图图 7.33 所示：\n\n    ![](img/Figure_7.33_.png)\n\
  \n    图 7.33: 关闭无线接口\n\n5. 在接口关闭状态下，我们现在可以使用 `macchanger` 来更改 MAC 地址。运行图图 7.34 所示的命令\
  \ `sudo macchanger -m [New MAC Address] wlan0` 来设置新的 MAC 地址：\n\n    ![](img/Figure_7.34_.png)\n\
  \n    图 7.34: 使用 macchanger 更改 MAC 地址\n\n6. 执行命令 `sudo ifconfig wlan0 up` 将接口重新启动，如图图\
  \ 7.35 所示：\n\n    ![](img/Figure_7.35_.png)\n\n    图 7.35: 恢复接口\n\n7. 发布命令 `sudo\
  \ systemctl start NetworkManager` 恢复网络管理器功能，如图图 7.36 所示：\n\n    ![](img/Figure_7.36_.png)\n\
  \n    图 7.36: 恢复网络管理器\n\n8. 现在由于我们已经将无线适配器的 MAC 地址更改为路由器白名单中的 MAC 地址，我们可以尝试通过网络进行身份验证。这些步骤可以绕过某些无线网络使用的\
  \ MAC 地址认证和开放式认证。如果一切顺利，我们应该像图图 7.37 所示能够连接：\n\n    ![](img/Figure_7.37_.png)\n\n\
  \    图 7.37: 修改后的 MAC 地址\n\n| 注意：通过伪造 MAC 地址来绕过接入点防护会引入不可追踪的恶意活动、潜在的数据泄露和未经授权的网络使用风险。它破坏了网络安全性和问责制，并随着未经授权设备渗透网络增加了受到攻击的脆弱性。\
  \ |\n\n## 拒绝服务攻击\n\n无线 DoS 攻击会对无线网络的可用性和性能产生重大影响，导致真实用户无法访问。这些攻击可以利用无线接入点（APs）或客户端设备的漏洞，导致系统崩溃或无响应。取消认证攻击、信标泛洪攻击和拥堵攻击是常见的无线\
  \ DoS 攻击类型。\n\n为了实际理解向 AP 发送重复的取消认证帧，我们可以按照下面列出的步骤操作：\n\n1. 首先，我们需要启用监控模式下的次级 Wi-Fi\
  \ 适配器。图 7.38 显示了与目标 AP 关联的连接主机列表：\n\n    ![](img/Figure_7.38_.png)\n\n    图 7.38:\
  \ 连接的主机列表\n\n2. 要对无线网络发起 DoS 攻击，执行命令 `sudo aireplay-ng --deauth 1000 -a FC:DD:55:A1:C2:F3\
  \ -h f2:8a:b2:df:90:3f wlan0` 向 AP 发送多个取消认证帧，如图图 7.39 所示：\n\n    ![](img/Figure_7.39_.png)\n\
  \n    图 7.39: 针对无线网络的 DoS 攻击\n\n    让我们对该命令及其参数分解如下：\n\n    * `aireplay-ng`: 这是用于执行攻击的工具名称。\n\
  \n    * `--deauth 1000`: 此参数指示 `aireplay-ng` 向目标 AP 发送 1000 个取消认证包，以断开已连接的客户端。\n\
  \n    * `-a FC:DD:55:A1:C2:F3`: 此参数指定目标接入点的 MAC 地址。\n\n    * `-h f2:8a:b2:df:90:3f`:\
  \ 此参数指定攻击者无线适配器的 MAC 地址。\n\n3. 此攻击旨在破坏客户端与接入点之间的连接，有效地使用授权用户无法访问网络。随着针对接入点的 DoS\
  \ 攻击拒绝客户端连接，客户端列表会减少。为了缓解此类攻击，网络管理员应实施包括流量过滤和访问控制在内的安全措施，以维护网络的完整性和可用性。请参见图图 7.40：\n\
  \n    ![](img/Figure_7.40_.png)\n\n    图 7.40: 客户端列表因 DoS 攻击而减少\n\n| 注意：AP DoS 攻击会破坏无线网络，导致生产力损失、通信中断、财务影响、声誉损害和信任受损。稳健的安全措施对于最小化这些风险至关重要。\
  \ |\n\n## 高级无线攻击\n\n高级无线攻击在现代渗透测试中起着至关重要的作用，包括使用 Reaver 攻击无线路由器。`Reaver` 利用 WPS\
  \ 漏洞，这使得进入无线网络变得更容易。这种攻击非常有效，网络管理员必须意识到其能力。\n\n### 使用 Reaver 攻击无线路由器\n\n以下是使用 Reaver\
  \ 进行攻击的步骤步骤：\n\n1. 首先，我们需要识别目标路由器的 BSSID 和通道，正如我们在之前的主题中已经学习的那样。\n\n2. 接下来，我们可以通过运行命令\
  \ `sudo reaver -i wlan0 -b [BSSID] -vv -K 1 -c [channel]` 使用 `Reaver` 破解 WPS 漏洞。`Reaver`\
  \ 将自动对 WPS PIN 进行暴力破解，如果成功，它将获得路由器的 WPA/WPA2 口令。\n\n3. 最后，我们可以使用获得的密码连接路由器并访问无线网络。需要注意的是，禁用\
  \ WPS 或使用强密码等衡量措施可以防止此类攻击。\n\n需要知道，执行 `Reaver` 进行 WPS 破解的过程可能非常耗时，并且不能保证每次都成功。然而，我们已经提供了工作命令的详细说明和理论方法供你参考。\n\
  \n| 注意：为了防止 Reaver 攻击，网络管理员应禁用 WPS 并为无线网络使用强密码。由于该攻击利用了 WPS 漏洞，仅对使用 WPS 的路由器有效。\
  \ |\n\n### 结论\n\n总结来说，本章提供了无线网络渗透测试的全面指南，强调了理解无线网络基础知识、安全威胁和标准的重要性。本章涵盖的实际方法、工具和高级攻击将帮助渗透测试人员识别漏洞并开发有效的防御措施。采用结构化的方法以确保评估彻底至关重要。网络管理员应采取必要措施防御漏洞和威胁，并维护安全的无线网络。在本章中获得的知识和技能对于任何涉及无线网络安全的人来说都是至关重要的。\n\
