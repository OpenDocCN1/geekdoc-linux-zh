  \ 将展示一份针对目标网站发现的漏洞报告。报告将包含每个漏洞的严重程度、描述以及修复建议，如图 4.12 所示。在“Issue Activity（问题活动）”部分，您有多个选项来分析发现并探索问题细节以及受影响的端点。\n\
  \n    ![](img/Figure_4.12.png)\n\n    图 4.12：分析结果\n\n| 注意：选择工具对于 Web 应用程序漏洞扫描至关重要。应该对\
  \ Burp suite、OWASP ZAP、Acunetix 和 Nikto 等流行的开源和商业选项进行评估和测试，以确定最符合您需求的。 |\n\n## 计算机网络\n\
  \n网络漏洞评估是一种全面的评估，旨在识别潜在的网络安全缺陷并评估公司网络安全措施的稳健性。此过程可以使用手动和自动化方法进行，以发现开放端口、识别运行的服务及其版本，并根据相关的常见漏洞与暴露\
  \ (`CVE`) 编号编制漏洞列表。在本次演示中，我们将使用三个实用工具 Nessus、Legion 和 Nmap，来直观地理解网络漏洞评估过程。为了观察真实的结果，我们将使用\
  \ Metasploitable 2 机器作为演示目标。\n\n## Nessus\n\nNessus 由 Tenable 开发，是一种被广泛使用的漏洞扫描工具，能够有效识别计算机系统、网络和\
  \ Web 应用程序中的安全缺陷。凭借其全面的漏洞数据库，它具备检测各种潜在缺陷的能力，包括配置错误、控制失效和恶意软件感染。\n\n在许可方面，Nessus\
  \ 提供了多种选项以满足不同的用户需求。作为本次演示的示例，我们使用了 `Nessus Essentials`，这是一个专门为个人和家庭使用设计的免费版本。然而，它具有某些局限性，最多允许扫描\
  \ 16 个 IP 地址。另一方面，`Nessus Professional` 是付费版，提供了适用于中小型企业或个人安全专业人员的高级功能。\n\n要使用 `Nessus\
  \ Essentials`，您可以遵循简单的方法：\n\n1. **下载并安装**：访问 Tenable 网站 (`https://www.tenable.com/downloads/nessus?loginAttempted=true`)\
  \ 并获取最新版本的 `Nessus Essentials`。按照图 4.13 中提供的指令下载并安装软件：\n\n    ![](img/Figure_4.13.png)\n\
  \n    图 4.13：下载并安装\n\n2. **创建用户账户**：启动 `Nessus Essentials` 并仔细按照屏幕上的指令创建用户账户。此步骤对于获取基本许可证至关重要，如图\
  \ 4.14 所示：\n\n    ![](img/Figure_4.14.png)\n\n    图 4.14：创建用户账户\n\n3. **创建新扫描**：软件设置完成后，访问\
  \ Nessus 界面并导航到 `Scans（扫描）` 标签。选择创建新扫描配置的选项，如图 4.15 所示：\n\n    ![](img/Figure_15.png)\n\
  \n    图 4.15：创建新扫描\n\n4. **自定义扫描设置**：根据您的特定需求调整扫描设置。在扫描配置中，您可以灵活选择不同的扫描类型，例如 `Basic\
  \ Network Scan（基础网络扫描）` 或 `Web Application Scan（Web 应用程序扫描）`。此外，您可以配置扫描策略、启用或禁用特定插件、设置扫描时间并进行其他必要的调整，如图\
  \ 4.16 所示：\n\n    ![](img/Figure_4.16.png)\n\n    图 4.16：自定义扫描设置\n\n5. **指定目标 IP\
  \ 地址**：在扫描配置中，指定您想要进行漏洞扫描的目标 IP 地址或范围。图 4.17 为此步骤提供了视觉引导。或者，您可以从文件导入 IP 地址列表。\n\n\
  \    ![](img/Figure_4.17.png)\n\n    图 4.17：指定目标 IP 地址\n\n6. **启动扫描**：一旦完成扫描设置自定义，点击\
  \ `Launch（启动）` 按钮启动漏洞扫描。此操作如图 4.18 所示，将开始扫描过程：\n\n    ![](img/Figure_4.18.png)\n\
  \n    图 4.18：启动扫描\n\n\n\n\n\n## 7. 分析扫描结果\n\n完成后，请在 Nessus 界面中查看扫描结果。这些结果提供了有关已识别漏洞的全面信息，包括它们的严重程度、描述和修复建议。此外，您还可以生成各种格式的报告，例如\
  \ PDF、CSV 和 HTML，如图 4.19 所示：\n\n![](img/Figure_4.19.png)\n\n图 4.19：分析扫描结果\n\n| 备注：Greenbone\
  \ 漏洞管理（GVM）曾被称为 OpenVAS，是一项著名的开源解决方案。它提供免费的 GVM 社区版和供商业使用的 GVM 企业版，提供了全面的漏洞管理能力。\
  \ |\n\n## Legion\n\n它是一个开源的半自动化网络漏洞评估和渗透测试框架。其基于 GUI 的界面提供了丰富的自定义选项，并能够自动检测常见漏洞与暴露（CVEs）以及通用平台（CPEs）。Legion\
  \ 包含了数百种用于自动化扫描的工具和脚本，包括 `Nmap`、`Hydra`、`WhatWeb`、`Nikto`、`SSLyzer`、`SMBenum`、`Dirbuster`、`Vulners`\
  \ 和 `Webslayer`。让我们按照以下步骤了解如何配置扫描并理解其功能：\n\n1. **在 Kali Linux 上安装 Legion**：如果您的系统中未安装，可以轻松地下载并安装。\n\
  2. **启动 Legion**：安装完成后，启动应用程序并导航到主界面，如图 4.20 所示：\n\n    ![](img/Figure_4.20.png)\n\
  \n    图 4.20：启动 Legion\n3. **配置扫描**：从主界面开始，您可以配置设置，例如目标 IP 范围、端口范围和扫描类型。通过点击扫描区域的“添加主机”按钮并填写目标详细信息，可以选择扫描期间运行的特定工具和脚本，如图\
  \ 4.21 所示：\n\n    ![](img/Figure_4.21.png)\n\n    图 4.21：配置扫描\n4. **启动扫描**：配置好扫描设置后，按下提交按钮开始扫描。Legion\
  \ 将执行选定的工具和脚本，并生成如图 4.22 所示的结果：\n\n    ![](img/Figure_4.22.png)\n\n    图 4.22：启动扫描\n\
  5. **分析结果**：扫描完成后，您可以分析结果以识别潜在漏洞，并就如何处理这些漏洞做出明智决策，如图 4.23 所示：\n\n    ![](img/Figure_4.23.png)\n\
  \n    图 4.23：分析结果\n\n## NMAP \n\nNmap 是一个免费且开源的工具，广泛用于主机发现、端口扫描和漏洞评估。它最强大且多功能特性之一是\
  \ Nmap 脚本引擎（NSE），它允许用户通过编写简单的脚本来自动化各种网络任务。凭借您对 Nmap 期望的速度和效率，这些脚本将并行执行。NSE 脚本分为多个类别，如\
  \ auth、broadcast、brute、default、discovery、dos、exploit、external、fuzzier、intrusive、malware、safe、version\
  \ 和 vuln。\n\n结合端口扫描进行脚本扫描是常见的做法，因为脚本可能仅根据扫描期间发现的端口状态而运行。为了帮助您理解 Nmap 扫描过程，让我们查看带有标志的一些\
  \ Nmap 扫描命令：\n\n* **执行漏洞扫描**：要识别已知漏洞，请在目标上运行命令 `nmap -sV --script vuln <target>`，如图\
  \ 4.24 所示。vuln 类别下的脚本将帮助渗透人员完成此任务。Nmap 只有在目标上识别出漏洞后才会将其添加到列表中。\n\n    ![](img/Figure_4.24.png)\n\
  \n    图 4.24：执行漏洞扫描\n* **指定目标**：Nmap 支持提供单个目标、子网、范围和组。例如，目标可以指定为 IP 地址 (192.168.149.129)、子网\
  \ (192.168.149.0/24) 和 IP 地址范围 (192.168.149.129-150)。要从文本文件中读取目标列表，运行命令 `nmap -sV\
  \ --script vuln –iL <path and target file name>`，如下方的图 4.25 所示：\n\n    ![](img/Figure_4.25.png)\n\
  \n    图 4.25：指定目标\n* **写入输出**：渗透人员可以根据需求以各种格式写入 Nmap 扫描输出。例如，要以 XML 格式写入扫描输出，运行命令\
  \ `nmap -sV --script vuln <target> -oX <path and filename>.xml`，如图 4.26 所示。\n\n\
  \    Nmap 提供了五种不同的输出格式：\n    * 普通 (`-oN`)\n    * XML (`-oX`)\n    * Grepable (`-oG`)\n\
  \    * Script Kiddie (`-oS`)\n    * 交互式 (`-oI`)\n\n        ![](img/Figure_4.26.png)\n\
  \n    图 4.26：写入输出\n* **调整扫描计时**：Nmap 提供了一种简单的方法，可以使用 `-T` 选项指定六种计时模板，可以通过其数字（0–5）或名称指定。前两个模板设计用于规避\
  \ IDS。要使用模板 2（礼貌），运行命令 `nmap -sV –T4 --script vuln <target>`，如图 4.27 所示。\n\n   \
  \ 模板的名称为：\n    * 偏执 (T0)\n    * 隐秘 (T1)\n    * 礼貌 (T2)\n    * 普通 (T3)\n    * 激进\
  \ (T4)\n    * 疯狂 (T5)\n\n        ![](img/Figure_4.27.png)\n\n    图 4.27：调整扫描计时\n\
  * **调节扫描速度**：可以使用 `--max-parallelism` 和 `--min-parallelism` 选项来控制 Nmap 扫描的速度。例如，将其设置为一可以防止\
  \ Nmap 同时向主机发送多个一个探测。调节扫描速度的另一种方法是使用 `--scan-delay` 选项。例如，使用 `--min-parallelism`\
  \ 选项，运行命令 `nmap -sV --script vuln <target> --min-parallelism 300`，如图 4.28 所示：\n\n\
  ![](img/Figure_4.28.png)\n\n图 4.28：调节扫描速度\n\n| 备注：Metasploit 是一种因其在渗透测试中的作用而闻名的强大工具。除了\
  \ NMAP 外，它还可以用于漏洞评估。它丰富的辅助模块（如端口扫描、指纹识别和 Web 扫描）进一步扩展了其执行各种任务的功能。 |\n\n## 移动应用程序\n\
  \n移动应用程序漏洞扫描旨在检测应用程序、数据库和 API 中的漏洞。此外，此练习还将评估安全最佳实践的实施情况，因为不安全的应用程序可能包含威胁组织数据的漏洞。移动应用程序漏洞扫描旨在通过检查以下领域来发现安全缺陷和潜在漏洞：\n\
  \n* 代码审查\n* 配置管理\n* 网络通信\n* 权限检查\n* 第三方库和组件\n* 二进制分析\n* 文件分析\n* 动态分析\n\n虽然存在许多用于评估移动应用程序安全性的开源工具，但我们将使用\
  \ MobSF 作为实操说明，以深入理解扫描过程及其生成的结果。\n\n## MobSF\n\n\n\n\n\n# 移动安全框架 (MobSF) 是一种针对 Android、iOS\
  \ 和 Windows 移动应用程序的全面、自动化安全评估框架。MobSF 可以执行静态和动态分析，以彻底评估应用程序的安全性。MobSF 框架具备在运行时动态分析\
  \ Android 应用程序的能力。该框架由 `CapFuzz`（一种专为 Web API 设计的安全扫描器）驱动，并且还具有强大的 Web API 模糊测试能力。分析结果以易于访问的方式显示在\
  \ MobSF 仪表板上，也可以下载为报告以进行进一步的分析和审查。让我们按步骤详细介绍配置移动应用程序扫描、分析结果和生成报告的过程：\n\n1. **打开\
  \ MobSF**：进入 MobSF 文件夹并运行命令 `./run.sh`，如图 4.29 所示：\n\n   ![](img/Figure_4.29.png)\n\
  \n   图 4.29：打开 MobSF\n\n2. **选择静态分析**：一旦启动 MobSF，在网络浏览器中访问 `http://0.0.0.0:8000`\
  \ 即可进入仪表板。在 MobSF 仪表板上，选择静态分析选项，如图 4.30 所示：\n\n   ![](img/Figure_4.30.png)\n\n \
  \  图 4.30：选择静态分析\n\n3. **上传移动应用**：点击 `Upload and Analyze` 按钮并上传目标移动应用程序。上传成功后，扫描将自动开始，如图\
  \ 4.31 所示：\n\n   ![](img/Figure_4.31.png)\n\n   图 4.31：上传移动应用\n\n4. **分析结果**：扫描完成后，在\
  \ MobSF 仪表板上查看结果。结果将包含有关发现的漏洞信息、其严重程度以及修复建议，如图 4.32 所示：\n\n   ![](img/Figure_4.32.png)\n\
  \n   图 4.32：分析结果\n\n5. **生成报告**：要生成报告，点击 `PDF Report` 按钮，如图 4.33 所示：\n\n   ![](img/Figure_4.33.png)\n\
  \n   图 4.33：生成报告\n\n6. **MobSF Scorecard**：MobSF 为每个扫描的应用程序分配一个安全评分，指示遵循安全指南和最佳实践的百分比。要查看评分卡，进入\
  \ `Recent Scans` 并点击 `MobSF Scorecard`，这将带你进入分析仪表板，如图 4.34 和图 4.35 所示：\n\n   ![](img/Figure_4.34.png)\n\
  \n   图 4.34：最近扫描\n\n   你还可以进行对比扫描以重新验证发现的状况，如上方 `Actions` 标签页所示。\n\n   ![](img/Figure_4.35.png)\n\
  \n   图 4.35：MobSF 评分卡\n\n| Note：我们使用了 `InsecureBankv2.apk` 进行测试，该文件从 [`github.com/dineshshetty/Android-InsecureBankv2/blob/master/InsecureBankv2.apk`](https://github.com/dineshshetty/Android-InsecureBankv2/blob/master/InsecureBankv2.apk)\
  \ 下载（致谢 Dinesh Shetty）。 |\n\n## 容器\n\n评估容器漏洞是确保容器化应用程序安全的关键方面。这一过程涉及实施安全工具和策略，以识别并缓解潜在威胁。使用容器的优点如易于扩展、成本效益和部署速度快，使其成为企业的热门选择。然而，这些优势也使得优先考虑安全性变得至关重要。通过对容器镜像进行漏洞扫描，开发者和\
  \ DevOps 团队可以评估部署的安全状态，并采取必要步骤解决识别出的任何问题，从而实现更安全的整体系统。为了实际理解本练习中涵盖的概念，我们将使用命令行工具\
  \ `Trivy` 作为案例研究。此评估的主要目标是评估以下核心领域：\n\n* 镜像安全\n* 容器运行时安全\n* 网络安全\n* 数据安全\n* 访问控制\n\
  * 合规性\n* 事件响应与灾难恢复\n\n## Trivy\n\nTrivy 是一款开源的多多维度容器安全评估工具，它可以扫描各种来源，包括容器镜像、文件系统、Git\
  \ 仓库、虚拟机镜像、Kubernetes 和 AWS。Trivy 可以识别多种安全风险，包括操作系统软件包漏洞 (SBOM)、常见漏洞与披露 (CVEs)、基础设施即代码\
  \ (IaC) 问题和配置错误、敏感信息和密钥以及软件许可证。为了实际演示 Trivy 的能力，我们将包含已知漏洞的 `vulnerables/web-dvwa`\
  \ 容器镜像作为目标。现在，让我们全面且有序地深入进行扫描和审查结果的过程：\n\n1. **安装 Docker**：要安装 Docker，在终端运行命令 `sudo\
  \ apt install -y docker.io`，如图 4.36 所示：\n\n   ![](img/Figure_4.36.png)\n\n   图 4.36：安装\
  \ docker\n\n2. **启用 Docker 自启动**：要让 Docker 在机器重启时自动启动，请运行命令 `sudo systemctl enable\
  \ docker --now`，如图 4.37 所示：\n\n   ![](img/Figure_4.37.png)\n\n   图 4.37：启用 Docker\
  \ 自启动\n\n3. **拉取漏洞镜像**：运行命令 `sudo docker pull vulnerables/web-dvwa` 将漏洞镜像拉取到 Docker，如图\
  \ 4.38 所示：\n\n   ![](img/Figure_4.38.png)\n\n   图 4.38：拉取漏洞镜像\n\n4. **列出镜像**：要查看镜像列表，运行命令\
  \ `sudo docker images` 并检查镜像仓库和标签名称，如图 4.39 所示：\n\n   ![](img/Figure_4.39.png)\n\
  \n   图 4.39：列出镜像\n\n5. **运行扫描**：完成所有设置后，运行命令 `sudo trivy i vulnerables/web-dvwa:latest`\
  \ 启动扫描，如图 4.40 所示：\n\n   ![](img/Figure_4.40.png)\n\n   图 4.40：运行扫描\n\n6. **忽略不可修复的漏洞**：运行命令\
  \ `sudo trivy i --ignore-unfixed vulnerables/web-dvwa:latest` 以规避即使更新软件包后也无法修复的漏洞，如图\
  \ 4.41 所示：\n\n   ![](img/Figure_4.41.png)\n\n   图 4.41：忽略不可修复的漏洞\n\n7. **分析扫描结果**：要过滤并仅显示关键（CRITICAL）和高（HIGH）级漏洞，运行命令\
  \ `sudo trivy i --ignore-unfixed --severity CRITICAL,HIGH vulnerables/web-dvwa:latest`，如图\
  \ 4.42 所示：\n\n   ![](img/Figure_4.42.png)\n\n   图 4.42：分析扫描结果\n\n8. **生成报告**：要以\
  \ JSON 格式保存扫描结果，运行命令 `sudo trivy i --ignore-unfixed --severity CRITICAL,HIGH -f\
  \ json -o dvwascanreport.json vulnerables/web-dvwa:latest`，如图 4.43 所示：\n\n   ![](img/Figure_4.43.png)\n\
  \n   图 4.43：生成报告\n\n9. **转换报告**：要将 JSON 结果转换为 CSV 文件，访问网站 [`data.page/json/csv`](https://data.page/json/csv)，如图\
  \ 4.44 所示：\n\n   ![](img/Figure_4.44.png)\n\n   图 4.44：转换报告\n\n| Note：可以通过在镜像和运行时阶段对容器进行扫描来确保其安全性。部署前的镜像扫描有助于识别漏洞和配置错误，而运行时扫描有助于监控并检测运行期间的任何潜在安全风险。\
  \ |\n\n\n\n\n\n漏洞管理是维护组织安全至关重要的方面。它涉及持续识别、评估和处理潜在安全威胁和弱环节的努力。其目标是防止恶意攻击，并尽可能地减少任何发生攻击的后果。\n\
  \n漏洞管理过程通常由几个步骤组成。第一是漏洞评估，即识别并评估潜在风险。这可以通过自动化扫描工具、手动渗透测试或两者的结合来实现。接的优先级排序步骤涉及确定哪些漏洞对组织构成了最大的风险并应优先处理。这通常使用风险管理框架，根据漏洞的潜在影响和可被利用性为每个漏洞分配严重程度评分。\n\
  \n一旦识别了漏洞并确定了优先级，就会实施应对措施来降低其风险。这可能包括应用软件补丁、配置防火墙和入侵检测系统、培训员工安全操作实践以及实施访问控制。\n\n\
  漏洞管理主要有两种方法：手动和自动化。在下方的表 4.1 中，你可以看到这些定义和区别：\n\n| 参数 | 手动漏洞管理 | 自动化漏洞管理 |\n| :---\
  \ | :--- | :--- |\n| 安全专业人员介入 | 需要安全专业人员对系统和应用程序进行漏洞评估、确定优先级，并采取必要的步骤进行修复。 | 涉及使用软件工具扫描系统和应用程序的漏洞，提供自动化的检测、优先级排序和修复建议。\
  \ |\n| 定制化 | 更全面，并允许更大的控制和定制 | 支持的定制化较少 |\n| 时间和资源消耗 | 耗时且是资源密集型 | 速度更快、更高效 |\n\n\
  表 4.1: 漏洞管理方法\n\n注：全面的漏洞管理通常涉及手动和自动化方法的结合。虽然自动化漏洞管理更快、更高效，但它可能只识别某些漏洞，其建议可能比手动评估获得的需要更高的准确性和定制化。\n\
  \n## 应用安全\n\n应用安全（或 AppSec）涵盖了在应用层面的软件、硬件和开发过程中，发现、修复和避免安全弱环节的实践和程序。将安全测试集成到软件开发生命周期（SDLC）的每个阶段（包括需求分析、设计、实现、验证和维护），对于及时全面地检测和处理漏洞至关重要。通过一开始引入\
  \ AppSec 实践，组织可以显著降低其代码、API 以及应用程序内使用的第三方组件出现安全漏洞的风险。\n\n应用安全包含两个类别：\n\n*   **静态应用安全测试\
  \ (SAST)**：它检查应用程序的源代码以在部署之前检测安全漏洞。通过在开发过程早期识别潜在缺陷，SAST 可以减少后期处理这些缺陷所需的成本和精力。\n\
  *   **动态应用安全测试 (DAST)**：它在应用程序运行时对其进行测试，以发现安全漏洞、弱点以及源代码中可能可见的问题。DAST 工具模拟对应用程序的攻击，以识别攻击者可能利用的潜在漏洞，对应用程序的整体安全态势提供更准确的评估。\n\
  \n### 结论\n\n在本章中，你对漏洞评估及相关的管理策略有了深入的理解。这些新知识和专业技能将使你能够在各种计算机基础设施上使用手动和自动化方法进行深入的漏洞评估。漏洞管理生命周期将鼓励你不断采用最佳安全实践，最终降低组织的风险成本。此外，你还了解了准确且有针对性的补丁管理的重要性，这将优化你漏洞评估倡议的整体效能。掌握了这些知识，你已经准备好识别并修复组织计算机基础设施中的漏洞，使其更加安全并增强抵御潜在网络攻击的能力。\n\
  \n下一章将深入探讨各种主题，涵盖利用网络漏洞和获取未经访问的技术。你可以在模拟的真实环境中接触这些技术，与网络设备、数据库和服务器一起工作。到本章结束，你将在网络渗透测试和利用方面建立坚实的基础，使能够识别并处理网络漏洞。\n\
