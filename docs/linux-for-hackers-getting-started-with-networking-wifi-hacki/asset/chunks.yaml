- fmt: "Packet injection allows you to craft and inject or send data to wireless devices\
    \ and networks nearby. Packet injection is commonly used in man-in-the-middle\
    \ attacks and denial-of-service attacks.\n\n## Determining the Chipset\n\nThe\
    \ chipset is important as it will determine if the wireless adapter can support\
    \ monitor mode and packet injection.\n\nThe best one, which is used by most Wi-Fi\
    \ pentesters is `Atheros AR9271`. This chipset supports packet injection monitor\
    \ mode and master mode, which allows this to be used as an access point to create\
    \ fake hotspots for evil twin attacks.\n\nThe `Alfa AWUS036NHA` USB adapter has\
    \ the `Atheros AR9271` chipset. It’s stable, fast, and well-supported wireless\
    \ network adapter.\n\nThere’s also the `TP-Link TL-WN722N` wireless adapter, which\
    \ has one of the cheapest prices but boasts surprisingly impressive performance.\
    \ That being said, only v1 has the Atheros chipset since v2 uses a different chipset.\n\
    \n## Put Your Card in Monitor Mode\n\nFor this step, we’ll use `airmon-ng`, but\
    \ before that, you’ll need to locate the name of the interface. On your system,\
    \ run the command `ifconfig` in the terminal. On your Linux system, your card\
    \ should be listed as `wlan0` or `wlan1`.\n\n```\nifconfig\n```\n\n```\neth0:\
    \ flags=4163<UP,BROADCAST,RUNNING,MULTICAST>  mtu 1500\n        inet 10.0.2.15\
    \  netmask 255.255.255.0  broadcast 10.0.2.255\n        inet6 fe80::a00:27ff:fe59:1b52\
    \  prefixlen 64  scopeid 0x20<link>\n        ether 86:09:15:d2:9e:97  txqueuelen\
    \ 1000  (Ethernet)\n        RX packets 0  bytes 0 (0.0 B)\n        RX errors 0\
    \  dropped 0  overruns 0  frame 0\nwlan0: flags=4163<UP,BROADCAST,RUNNING,MULTICAST>\
    \  mtu 1500\n        ether EE-A5-3C-37-34-4A  txqueuelen 1000  (Ethernet)\n  \
    \      RX packets 0  bytes 0 (0.0 B)\n        RX errors 0  dropped 0  overruns\
    \ 0  frame 0\n```\n\nOnce you have the name of the network interface, you can\
    \ attempt to put it into monitor mode by typing `airmon-ng start wlan0` (assuming\
    \ your interface name is `wlan0`).\n\n```\nairmon-ng start wlan0\n```\n\nYou can\
    \ confirm the results by typing `iwconfig`, and you should see the name of your\
    \ interface has changed to `wlan0mon`. It should also report “Mode:Monitor”.\n\
    \n```\niwconfig\n```\n\n```\nwlan0mon  IEEE 802.11  Mode:Monitor  Frequency:2.457\
    \ GHz  Tx-Power=20 dBm\n          Retry short  long limit:2  RTS thr:off  Fragment\
    \ thr:off\n          Power Management:off\n```\n\n## Test Your Card for Packet\
    \ Injection\n\nAfter putting your card into monitor mode, you can run a test to\
    \ see if the wireless network adapter is capable of injecting packets into nearby\
    \ wireless networks.\n\nSo, in a terminal window, type `aireplay-ng --test wlan0mon`\
    \ to start the packet injection test.\n\n```\naireplay-ng --test wlan0mon\n```\n\
    \n```\n12:47:05  Waiting for beacon frame (BSSID: AA:BB:CC:DD:EE) on channel 6\n\
    12:47:05  Trying broadcast probe requests...\n12:47:06  Injection is working!\n\
    12:47:07  Found 1 AP\n12:47:07  Trying directed probe requests...\n12:47:07  AA:BB:CC:DD:EE\
    \ - channel: 6 - 'Dobis'\n12:47:08  Ping (min/avg/max): 0.891ms/15.899ms/32.832ms\
    \  Power: -21.72\n12:47:08  29/30:  97%\n```\n\nIf you get a result like above,\
    \ then congratulations, your network card is successfully injecting packets into\
    \ nearby networks.\n\n# Perform a Denial of Service Attack on a Wireless Network\n\
    \nA deauthentication attack is a type of denial-of-service attack that targets\
    \ communication between a user and a wireless Wi-Fi access point. Deauthentication\
    \ is a request that involves a router or AP telling a Wi-Fi user to disconnect\
    \ from it.\n\nThe process features deauthentication packets that cause the targeted\
    \ client to lose connectivity from the access point.\n\n## Access Point Deauthentication\n\
    \nAn attacker can send a deauthentication request to an access point (AP). The\
    \ action results in the AP sending a de-authentication response to all devices\
    \ connected to the wireless network.\n\nThis means that a malicious actor can\
    \ forward unlimited deauthentication requests, and the devices will not be able\
    \ to connect to the AP, resulting in a DoS attack.\n\n## Client Deauthentication\n\
    \nThe attacker sends a request to the connected device’s Access Point (AP), requesting\
    \ the AP to deauthenticate the connected device.\n\nTypically, there isn’t a limit\
    \ to the number of deauthentication packets that can be sent.\n\nMeanwhile, the\
    \ user’s device receiving deauthentication response packets from the AP, will\
    \ not be able to send packets to authenticate to the same AP simultaneously. This\
    \ process makes it impossible for the device to connect to that AP.\n\n## How\
    \ to Perform The Attack\n\nFirst, you need to put the wireless adapter in monitor\
    \ mode using `airmon-ng`.\n\n```\nairmon-ng start wlan0\n```\n\nThis command will\
    \ change your wireless interface name to `wlan0mon`.\n\n### Scan WiFi Networks\n\
    \nScan all the access points in range by using `airodump-ng`.\n\n```\nairodump-ng\
    \ wlan0mon\n```\n\nYou will get a bunch of different access points with a lot\
    \ of info you don’t understand! Let’s break them down.\n\n- `BSSID` — the Access\
    \ Point’s MAC Address\n- `PWR` — the signal strength\n- `Beacons` — the packets\
    \ that the router sends out to alert its presence\n- `CH` — the channel that information\
    \ is being broadcast on\n- `AUTH` — either MGT for Managed or PSK for Pre-Shared\
    \ Key\n- `ESSID` — the Access Point’s network name\n- `STATION` — the client’s\
    \ MAC Address\n\nAfter you find the target you wanna perform the DoS attack Press\
    \ `Ctrl+c` to stop scanning.\n\n### Deauthenticate All Users on AP\n\nTo deauthenticate\
    \ all the users from the AP, you need to send thousands of deauthentication frames\
    \ to keep anyone from reconnecting to the AP. You can do this by typing the following\
    \ command into another terminal.\n\n```\naireplay-ng --deauth 2000 -a 28:EF:01:35:34:85\
    \ wlan0mon\n```\n\nThis command will disconnect everyone from the access point\
    \ (Orange-Net).\n\n### Disconnect Wireless Clients\n\nFind the MAC address of\
    \ the device you want to kick out from your network.\n\nTo do that, look at the\
    \ bottom of the screen on your `airodump-ng` scanning and select the MAC address\
    \ from `STATION`. (The MAC Address of the target will be in the “STATION” field).\n\
    \nSo, if you know the MAC address of the router and the MAC address of the device,\
    \ use the following command:\n\n```\naireplay-ng --deauth 2000 -a [ROUTER_BSSID]\
    \ -c [TARGET_MAC_ADDRESS] wlan0mon\n```\n\n```\naireplay-ng --deauth 2000 -a 28:EF:01:35:34:85\
    \ -c 28:EF:01:23:46:68 wlan0mon\n```\n\nThe `2000` represents the number of deauth\
    \ packets.\n\n`-c` is the client that you would like to kick off the network.\n\
    \n`-a` is the router where the victim is connected to.\n\n`wlan0mon` is the name\
    \ of the wireless card in monitor mode.\n\n# Crack WiFi Passwords using Hashcat\n\
    \n`Hashcat` is a powerful password recovery tool that can help you recover lost\
    \ or forgotten passwords for a variety of platforms, including Windows, Linux,\
    \ and macOS.\n\n`Hashcat` is also one of the few tools that can work with the\
    \ GPU and offers many ways of finding passwords from hashes.\n\nThe simplest way\
    \ to crack a hash is to try first to guess the password. Dictionary and brute-force\
    \ attacks are the most common ways of guessing passwords.\n\nThese techniques\
    \ make use of a file that contains words, phrases, common passwords, and other\
    \ strings that are likely to be used as passwords.\n\n## Enable Monitor Mode\n\
    \nFirst, you need to put your wireless card in monitor mode using the following\
    \ command.\n\n```\nairmon-ng start wlan0\n```\n\nI will assume your wireless interface\
    \ name is `wlan0` but be sure to use the correct name if it differs. You can use\
    \ the `iwconfig` command to find the wireless interface name.\n\n## Find Your\
    \ Target\n\nStart scanning nearby wireless routers with the following command.\n\
    \n```\nairodump-ng wlan0\n```\n\nThis displays a data table for all Wi-Fi routers\
    \ in range."
