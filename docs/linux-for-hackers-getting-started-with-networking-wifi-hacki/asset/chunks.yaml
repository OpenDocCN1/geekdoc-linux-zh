    # Linux 入门


    ![img](img/chapter_title_below.png)


    如果您是 Linux 新手，使用命令行可能感觉像在说一门不同的语言。但好消息是：一旦您学会了一些基本命令，您就会开始感到掌控自如。让我们从最实用且对初学者友好的文件操作开始。


    注意：对于已经熟悉`ls`、`cd`、`mv`和`rm`等基本命令的读者，请直接跳到高级黑客章节，获取更精彩的内容。


    ## 切换目录 – `cd`


    功能：将您移动到另一个文件夹。


    可以理解为：在文件资源管理器中双击一个文件夹。


    示例：


    ```

    cd Documents

    ```


    ![img](img/image062.jpg)


    这会将您带入当前目录下的`Documents`文件夹。要返回上一级目录：


    ```

    cd ..

    ```


    要一直返回到您的主目录：


    ```

    cd

    ```


    ## 列出内容 – `ls`


    功能：显示当前文件夹中的内容。


    可以理解为：打开一个文件夹并查看所有文件。


    示例：


    ```

    ls

    ```


    ![img](img/image035.jpg)


    要查看更详细的信息，如文件大小和权限：


    ```

    ls -l

    ```


    如果您想查找隐藏文件，请使用：


    ```

    ls -a

    ```


    ## 复制文件和文件夹 – `cp`


    功能：创建文件或文件夹的副本。


    可以理解为：复制 + 粘贴。


    示例：


    ```

    cp myscript.py backup.py

    ```


    ![img](img/image001.jpg)


    这会复制`myscript.py`并将新文件命名为`backup.py`。要复制整个文件夹及其内容：


    ```

    cp -r folder1/ folder2/

    ```

    '
- fmt: '

    The `-r` means recursive — copy everything inside.


    ## Move or Rename – `mv`


    **What it does:** Moves or renames files and folders.


    **Think of it like:** Drag-and-drop or Rename.


    **Example:**


    ```

    mv notes.txt Documents/

    ```


    ![img](d2d_images/image061.jpg)


    This moves `notes.txt` into the `Documents` folder.


    To rename a file:


    ```

    mv oldname.txt newname.txt

    ```


    ## Remove (Delete) – `rm`


    **What it does:** Deletes a file or folder.


    **Be careful!** There’s no recycle bin — it’s permanent.


    **Example:**


    ```

    rm test.txt

    ```


    ![img](d2d_images/image006.jpg)


    Deletes `test.txt`. To delete a folder and everything inside it:


    ```

    rm -r old_folder/

    ```


    ## Mini Practice Session


    Open your terminal and try the commands:


    ```

    cd  # Go to your home folder

    mkdir mypractice  # Make a new folder

    cd mypractice

    touch hello.txt  # Create a new file

    ls  # List to see if it''s there

    cp hello.txt copy.txt  # Copy the file

    mv copy.txt newname.txt # Rename the copied file

    rm hello.txt    # Delete the original

    cd ..

    rm -r mypractice    # Delete the whole folder

    ```


    If you can do those commands, you already know 80% of what most people use every
    day in the terminal.


    **Pro tip:** You can always type `man <command>` (like `man ls`) to learn more
    about any command directly in your terminal.


    ## Wildcards


    Sometimes you don’t want to type every single filename, especially when there
    are dozens. Wildcards let you match patterns instead of names. The `*` wildcard
    = “everything”. Here is an example:


    ```

    ls *.txt

    ```


    This command lists all files ending in `.txt`, like `notes.txt`, `report.txt`.


    To delete all files that start with “myfile”, use:


    ```

    rm myfile*

    ```


    This deletes files that start with `myfile`, like `myfile1`, `myfile_backup`,
    etc.


    ## Pipes


    Pipes let you take the output of one command and send it to another. This is HUGE
    in Linux.


    **Example:**


    ```

    cat access.log | grep "404"

    ```


    This command shows only the “404” errors from the `access.log` file.”


    **Another example:**


    ```

    ps aux | grep python | head -5

    ```


    This will show running processes with "python", and limit to the first 5 results.


    ## Save Output to a File


    ```

    ls > files.txt

    ```


    This saves the result of `ls` command into a file called `files.txt`.


    ## Linux Permissions


    In Linux, there are three types of permissions:


    | Symbol | Permission | What it means |

    | :--- | :--- | :--- |

    | `r` | Read | Can look inside the file |

    | `w` | Write | Can change or delete the file |

    | `x` | Execute | Can run the program or script |


    **Example:**


    Let''s say you have a file called `notes.txt` and you type:


    ```

    ls -l notes.txt

    ```


    The output will be:


    ```

    -rw-r—r—1 alex alex 1234 May 21 10:00 notes.txt

    ```


    Let’s break it down:


    *   `-rw-r—r—` = permissions.

    *   The first `rw-` → the owner (Alex) can read + write.

    *   The second `r—` → the group can only read.

    *   The third `r—` → others (everyone else) can only read.


    So, Alex can open and edit it, and everyone else can only open it, not change
    it.


    ### Changing Permissions


    If you want to add execute permission to a script, use:


    ```

    chmod +x myscript.sh

    ```


    Now you can run it like this:


    ```

    ./myscript.sh

    ```


    The script has execute permission, and it should run with no problems.


    ### Remove Execute Permission


    Let’s say you don’t want anyone to run this script; you just want it to be viewable
    or editable. To do that, use:


    ```

    chmod -x myscript.sh

    ```


    Now, execute permission has been removed from the script.


    ### Remove Everything


    If you want to make a file completely inaccessible to everyone except root, use:


    ```

    chmod 000 myscript.sh

    ```


    This command removes all permissions — no read, no write, no execute. Try to open
    it now, and Linux will say: "Permission denied."


