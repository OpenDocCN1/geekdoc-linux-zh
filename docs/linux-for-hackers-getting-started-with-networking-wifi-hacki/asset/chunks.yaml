    `-r` 表示递归——复制内部所有内容。


    ## 移动或重命名 – `mv`


    **功能：** 移动或重命名文件和文件夹。


    **可以理解为：** 拖放或重命名。


    **示例：**


    ```

    mv notes.txt Documents/

    ```


    ![img](img/image061.jpg)


    这会将 `notes.txt` 移动到 `Documents` 文件夹中。


    要重命名文件：


    ```

    mv oldname.txt newname.txt

    ```


    ## 删除（移除） – `rm`


    **功能：** 删除文件或文件夹。


    **注意！** 没有回收站——这是永久删除。


    **示例：**


    ```

    rm test.txt

    ```


    ![img](img/image006.jpg)


    删除 `test.txt`。要删除一个文件夹及其所有内容：


    ```

    rm -r old_folder/

    ```


    ## 小练习


    打开你的终端，尝试以下命令：


    ```

    cd  # 进入你的主文件夹

    mkdir mypractice  # 创建一个新文件夹

    cd mypractice

    touch hello.txt  # 创建一个新文件

    ls  # 列出文件以确认其存在

    cp hello.txt copy.txt  # 复制文件

    mv copy.txt newname.txt # 重命名复制的文件

    rm hello.txt    # 删除原始文件

    cd ..

    rm -r mypractice    # 删除整个文件夹

    ```


    如果你能执行这些命令，那么你已经掌握了大多数人每天在终端中使用内容的 80%。


    **专业提示：** 你随时可以输入 `man <命令>`（例如 `man ls`）来直接在终端中了解更多关于任何命令的信息。


    ## 通配符


    有时你不想输入每一个文件名，尤其是在有几十个文件的时候。通配符允许你匹配模式而不是名称。`*` 通配符代表“所有内容”。这里有一个例子：


    ```

    ls *.txt

    ```


    此命令列出所有以 `.txt` 结尾的文件，例如 `notes.txt`、`report.txt`。


    要删除所有以“myfile”开头的文件，请使用：


    ```

    rm myfile*

    ```


    这会删除以 `myfile` 开头的文件，例如 `myfile1`、`myfile_backup` 等。


    ## 管道


    管道允许你将一个命令的输出发送到另一个命令。这在 Linux 中非常重要。


    **示例：**


    ```

    cat access.log | grep "404"

    ```


    此命令仅显示 `access.log` 文件中的“404”错误。


    **另一个示例：**


    ```

    ps aux | grep python | head -5

    ```


    这将显示包含“python”的运行进程，并限制为前 5 个结果。


    ## 将输出保存到文件


    ```

    ls > files.txt

    ```


    这会将 `ls` 命令的结果保存到名为 `files.txt` 的文件中。


    ## Linux 权限


    在 Linux 中，有三种类型的权限：


    | 符号 | 权限 | 含义 |

    | :--- | :--- | :--- |

    | `r` | 读取 | 可以查看文件内容 |

    | `w` | 写入 | 可以更改或删除文件 |

    | `x` | 执行 | 可以运行程序或脚本 |


    **示例：**


    假设你有一个名为 `notes.txt` 的文件，你输入：


    ```

    ls -l notes.txt

    ```


    输出将是：


    ```

    -rw-r—r—1 alex alex 1234 May 21 10:00 notes.txt

    ```


    让我们分解一下：


    *   `-rw-r—r—` = 权限。

    *   第一个 `rw-` → 所有者（Alex）可以读取 + 写入。

    *   第二个 `r—` → 组用户只能读取。

    *   第三个 `r—` → 其他用户（所有人）只能读取。


    所以，Alex 可以打开和编辑它，而其他人只能打开它，不能更改它。


    ### 更改权限


    如果你想为脚本添加执行权限，请使用：


    ```

    chmod +x myscript.sh

    ```


    现在你可以这样运行它：


    ```

    ./myscript.sh

    ```


    脚本具有执行权限，应该可以毫无问题地运行。


    ### 移除执行权限


    假设你不想让任何人运行这个脚本；你只想让它可查看或可编辑。为此，请使用：


    ```

    chmod -x myscript.sh

    ```


    现在，脚本的执行权限已被移除。


    ### 移除所有权限


    如果你想让一个文件对除 root 以外的所有人都完全无法访问，请使用：


    ```

    chmod 000 myscript.sh

    ```


    此命令移除所有权限——无读取、无写入、无执行。现在尝试打开它，Linux 会说：“权限被拒绝。”


    ![img](img/chapter_title_corner_decoration_left.png) ![img](img/chapter_title_corner_decoration_right.png)


    ![img](img/chapter_title_above.png)


    # 每个黑客都需要的网络基础


    ![img](img/chapter_title_below.png)


    在你深入研究黑客工具或尝试入侵任何东西（当然是合乎道德的）之前，有一件事你绝对需要首先理解：网络。


    把互联网想象成一个巨大的计算机网络，它们彼此对话。黑客行为通常涉及拦截、理解或操纵这种对话，而要做到这一点，你必须会说这种语言。


    无论你是在扫描开放端口、嗅探数据包，还是编写自己的脚本来利用有漏洞的服务，网络知识都是你的基础。让我们开始吧！


    ## IP 地址


    IP 地址（互联网协议地址）就像你的设备在网络上的家庭地址。


    它告诉其他计算机在哪里可以找到你的设备，就像门牌号告诉邮递员在哪里投递包裹一样。


    **示例：**


    ```

    192.168.1.100

    ```


    这可能是你的计算机在家庭 Wi-Fi 上的本地 IP。


    像 `google.com` 这样的网站也有 IP（例如 `142.250.64.78`），但我们不记忆这些，这就是 DNS 的作用（下面会详细介绍）。


    你的公共 IP 是互联网上其他人看到的。你可以通过搜索“我的 IP 是什么”来找到它。


    ## MAC 地址


    MAC 地址（媒体访问控制地址）就像你的设备网卡（连接 Wi-Fi 或以太网的部分）的指纹或序列号。


    它永远不会改变，并且在你的本地网络中用于唯一标识每个设备。


    看起来像这样：


    ```

    00: 1A:2B:3C:4D:5E

    ```


    你的路由器使用 MAC 地址来识别哪个设备是哪个，即使两台笔记本电脑在不同时间具有相同的 IP 地址。


    ## DNS：互联网的电话簿


    DNS 代表域名系统。它将易于记忆的名称转换为：


    ```

    google.com

    ```


    转换为实际的 IP 地址，例如：


    ```

    142.250.64.78

    ```


    因此，当你输入 `www.google.com` 时，DNS 会找到该网站的正确 IP，就像电话簿将姓名与电话号码匹配一样。


    你可以用以下命令测试：


    ```

    nslookup google.com

    ```


    你会看到它的真实 IP 地址。


    ## 端口：公寓号码


    如果你的 IP 地址就像你大楼的地址，那么端口就像里面的公寓号码。


    它告诉你的计算机连接是针对哪个服务或应用程序的。


    *   端口 80 = 网站（HTTP）

    *   端口 443 = 安全网站（HTTPS）

    *   端口 22 = 远程登录（SSH）

    *   端口 25 = 电子邮件（SMTP）


    因此，当你通过 HTTPS 连接到 `google.com` 时，你的浏览器实际上是在与以下地址通信：


    ```

    google.com:443

    ```


    ## 综合运用


    假设你的计算机（`192.168.1.10`，MAC `00:1A:2B:3C:4D:5E`）想要访问 `youtube.com`。


    以下是发生的过程：


    1.  DNS 将 `youtube.com` 转换为 `142.250.190.78`

    2.  你的计算机向该 IP 的 443 端口发送请求（因为这是一个安全站点）。

    3.  你的路由器使用你的 MAC 地址来确保回复发送到正确的设备。


    ## 如何查看谁在线


    在你能够与网络上的任何设备交互或探索之前，你需要知道它的存在。这就是 ping 和扫描的作用。这些是敲门的数字版本。


    让我们以一种完全合理的方式来分解它们，即使你是新手。


    ### Ping


    Ping 是互联网版本的询问：“嘿，你在线吗？”


    它向设备发送一个小数据包（称为 ICMP 回显请求），如果它回复，你就知道它是在线且可达的。


    **示例：**


    ```

    ping google.com

    ```


    或者 ping 你的路由器：


    ```

    ping 192.168.1.1

    ```


    你会得到类似这样的结果：


    ```

    64 bytes from 142.250.64.78: icmp_seq=1 ttl=117 time=22.1 ms (google)

    64 bytes from 192.168.1.1: icmp_seq=1 ttl=117 time=22.1 ms (router)

    ```


    这意味着设备在线且可达。


    ### 扫描网络


    最著名的扫描工具之一是 `nmap`。使用以下命令进行基本扫描：


    ```

    nmap 192.168.100.1

    ```


    ![img](img/image039.jpg)


    这会扫描一个本地 IP 以查看正在运行的服务。


    要扫描整个网络，请使用：


    ```

    nmap 192.168.100.0/24

    ```


    这会检查该子网上的每个设备（例如，你的整个家庭或办公室网络）。你可以发现网络上的活动设备并查看哪些端口是开放的。


    ### 全面的 Nmap 扫描


    如果你想使用 `nmap` 发现 IP 背后的每个服务和操作系统（OS），请使用：


    ```

    nmap -p- -A -T3 192.168.100.27

    ```


    '
- fmt: 'This `nmap` command scans every single port on the target machine and tries
    to figure out what operating system, services, and software versions it’s running.


    The `-T3` option tells `Nmap` to go at a normal, reliable speed, and `-A` enables
    a deeper scan that gives you detailed information.


    ## Network Interfaces on Linux


    A network interface is like a door or window that your Linux system uses to connect
    to a network. It could be:


    *   Wired (Ethernet cable) — `eth0` or `enp0s3`.

    *   Wireless (Wi-Fi) — `wlan0` or `wlp3s0`.

    *   Virtual (used in hacking tools or VPNs) — like `tun0`, `lo`, or `br0`.


    Let’s look at the most useful commands to manage and understand your network interfaces
    on Linux.


    ### The Classic Tool


    Use `ifconfig` to find information about your network interfaces.


    ```

    ifconfig

    ```


    You might see:


    ```

    eth0:  inet 192.168.1.10  netmask 255.255.255.0  broadcast 192.168.1.255

    wlan0: inet 192.168.1.12  ...

    ```


    This tells you which interfaces are up and running. To bring interfaces up or
    down, use:


    ```

    ifconfig eth0 down  # disable Ethernet

    ifconfig eth0 up    # enable it again

    ```


    Note: `ifconfig` is older and may not be installed by default on modern systems,
    use `ip` instead if that happens.


    ### Modern Replacement


    The `ip` is newer and more powerful way to work with interfaces.


    ```

    ip a

    ```


    You’ll see output like:


    ```

    eth0: <BROADCAST,MULTICAST,UP> ...

    inet 192.168.1.10/24 brd 192.168.1.255 scope global

    ```


    Assign IP addresses:


    ```

    ip addr add 192.168.1.100/24 dev eth0

    ```


    Bring interfaces up/down:


    ```

    sudo ip link set eth0 down

    sudo ip link set eth0 up

    ```


    Use `ip` for scripting or more advanced work, it’s more reliable across modern
    systems.


    ### Wireless Interfaces


    The `iwconfig` command shows and configures Wi-Fi interfaces (like `wlan0`).


    Example:


    ```

    iwconfig

    ```


    You’ll see:


    ```

    wlan0  IEEE 802.11  ESSID:"MyWiFi"  Mode:Managed  ...

    ```


    It tells you the mode (usually “Managed” means connected to a router).


    # Essential Tshark Commands to Monitor Networks


    If you''ve ever wanted to see what''s really happening on your network — like
    what websites are being visited, or if something suspicious is happening, `tshark`
    can help you find out.


    Think of `tshark` as the command-line version of Wireshark, one of the most powerful
    network sniffing tools in cybersecurity. But unlike Wireshark, `tshark` works
    entirely in the terminal, which makes it perfect for:


    *   Lightweight systems (like Raspberry Pi or remote servers).

    *   Automation and scripting.

    *   Fast, no-frills network analysis.


    So, in this section, I will walk through essential `tshark` commands to monitor
    your network. Let’s jump in.


    ### See All Network Traffic


    ```

    tshark -i eth0

    ```


    This captures all packets on interface `eth0` in real time. You''ll see traffic
    like DNS requests, HTTP pages, and more. Replace `eth0` with your actual network
    interface (`wlan0`, `enp0s3`, etc). Use `Ctrl + C` to stop the capture.


    ### Capture Only HTTP Traffic


    ```

    tshark -i wlan0 -Y "http"

    ```


    Filters live traffic to show only HTTP requests and responses, perfect for watching
    websites being accessed in real time.


    ### Monitor Traffic From a Specific IP


    ```

    tshark -i eth0 host 192.168.1.12

    ```


    This captures all packets to and from a specific device. It’s useful for tracking
    the activity of one machine in your network.


    ### Save a Capture to a File


    ```

    tshark -i eth0 -w capture.pcap

    ```


    Records all captured traffic to a `.pcap` file for later analysis (in Wireshark
    or `tshark`). This is useful for longer sessions or offline review.


    ### Read from a Capture File


    ```

    tshark -r capture.pcap

    ```


    Loads and displays the packets from a saved capture file.


    ### Monitor DNS Queries


    ```

    tshark -i eth0 -Y "dns"

    ```


    Shows DNS lookups made by devices. It’s a great way to see which websites are
    being visited on your network in real time.


    # Capturing Usernames & Passwords with Tshark


    Many beginner-friendly sites or older web applications still use HTTP, which transmits
    data without encryption.


    When a user logs in to an HTTP site, their username and password are sent in clear
    text, meaning anyone sniffing the network can read them. So, let’s see how usernames
    and passwords can be captured on a network.


    Open your Linux terminal and type the following command:


    ```

    tshark -i wlan0 -Y "http.request.method == POST" -T fields -e http.host -e http.request.uri
    -e http.file_data

    ```


    This command listens to your Wi-Fi network traffic (`wlan0`) and filters for HTTP
    POST requests, which are often used when someone logs into a website or submits
    a form.


    Now, I will open Firefox browser and try to login to an HTTP website (http://testaspnet.vulnweb.com/login.aspx).
    I will type “Jack” for the username and ‘letmein123’ for the password.


    Let’s go back to the terminal where `tshark` is running.


    As you can see, I have successfully captured the login credentials.


    The best way to defend against this kind of packet sniffing is to always use websites
    that have HTTPS, not just HTTP.


    When a site uses HTTPS (the "S" stands for secure), all the data you send like
    usernames, passwords, and messages is encrypted. That means even if someone is
    sniffing the network, they’ll just see scrambled data instead of readable information.


    # Chapter 2: Wi-Fi Hacking


    Wi-Fi networks are everywhere — in homes, offices, airports, and public spaces.
    And because they’re so common, they’re also a big target for hackers.


    So, in this section you’ll learn the most common WiFi attacks like:


    *   **Deauthentication Attacks:** Force someone off a Wi-Fi network to disconnect
    using tools like `aireplay-ng`, then trick them into connecting to a fake network.

    *   **Password Cracking:** Hackers capture a “handshake” when a device connects
    and then try to guess the password offline using tools like `hashcat`.

    *   **Evil Twin Attacks:** The attacker creates a fake Wi-Fi network with the
    same name as a legit one (like "Starbucks_WiFi"). If you connect, they can intercept
    everything you do.

    *   **Captive Portal Hacking:** This is when hackers set up a fake login page
    (like the ones hotels or airports use). You think it’s just asking for your email,
    but it could be stealing your real passwords behind the scenes.


    Knowing how Wi-Fi attacks work is like learning the tricks scammers use, once
    you see how it’s done, it’s much easier to protect yourself.


    # Test Your Wireless Adapter


    The most important feature required for wireless penetration testing is to determine
    whether your Wi-Fi card supports monitor mode and packet injection. Generally,
    the monitor mode is disabled on the built-in Wi-Fi card provided by the desktop
    or laptop manufacturer.


    To understand what a monitor mode is, you need to turn on the adapter’s operation
    in the “normal” (it is called “managed mode”) into monitor mode.


    Monitor mode enables a wireless network card to passively capture packets without
    associating with an access point. Think of it like listening to people’s conversations
    while you walk down the street.'
