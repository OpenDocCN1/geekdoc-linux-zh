    # Getting Started with Linux


    ![img](d2d_images/chapter_title_below.png)


    If you’re new to Linux, using the command line can feel like speaking a different
    language. But here’s the good news: once you learn a few basic commands, you’ll
    start feeling in control. Let’s start with the most useful and beginner-friendly
    file operations.


    Note: For those who are already familiar with basic commands like `ls`, `cd`,
    `mv`, and `rm`, feel free to jump straight to the advanced hacking chapters for
    more exciting content.


    ## Change Directory – `cd`


    What it does: Moves you into another folder.


    Think of it like: Double-clicking a folder in File Explorer.


    Example:


    ```

    cd Documents

    ```


    ![img](d2d_images/image062.jpg)


    This takes you into the `Documents` folder inside your current location. To go
    back up a folder:


    ```

    cd ..

    ```


    To go all the way back to your home directory:


    ```

    cd

    ```


    ## List Contents – `ls`


    What it does: Shows what’s inside the current folder.


    Think of it like: Opening a folder and seeing all the files.


    Example:


    ```

    ls

    ```


    ![img](d2d_images/image035.jpg)


    To see more details, like file sizes and permissions:


    ```

    ls -l

    ```


    If you want to find hidden files, use:


    ```

    ls -a

    ```


    ## Copy Files and Folders – `cp`


    What it does: Makes a copy of a file or folder.


    Think of it like: Copy + Paste.


    Example:


    ```

    cp myscript.py backup.py

    ```


    ![img](d2d_images/image001.jpg)


    This copies `myscript.py` and names the new one `backup.py`. To copy an entire
    folder and its contents:


    ```

    cp -r folder1/ folder2/

    ```'
