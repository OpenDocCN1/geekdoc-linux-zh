    # 第 6 章：安全


    ![img](img/chapter_title_below.png)


    在最后一章中，你将学习使用 GPG 加密和解密文件，以及使用 Steghide 将敏感信息隐藏在图像中以保护秘密安全。


    你还将学习使用 Wireshark 识别可疑的 Wi-Fi 活动，保护你的无线网络，并监控系统日志以发现任何异常。


    | ![img](img/chapter_title_corner_decoration_left.png)  |  | ![img](img/chapter_title_corner_decoration_right.png)  |


    ![img](img/chapter_title_above.png)


    # 使用 GPG 加密和解密文件


    ![img](img/chapter_title_below.png)


    GPG 在大多数 Linux 发行版中都是开箱即用的。你可以在终端中使用 `gpg --version` 来验证版本。


    对于基于 Debian 和 Ubuntu 的系统，使用以下命令安装 `gpg` 包：


    ```

    apt install gpg

    ```


    ## 加密文件


    加密文件的快速方法是使用 `-c`（创建）选项运行 `gpg` 命令。


    ![img](img/image000.jpg)


    在我的例子中，我将使用以下命令加密 `Credit-Cards.txt` 文件。


    ```

    gpg -c Credit-Cards.txt

    ```


    ![img](img/image041.jpg)


    GPG 会要求你为要加密的文件输入密码（两次）。


    ![img](img/image015.jpg)


    此时，如果你输入 `ls` 命令，你可以看到原始文件完好无损，`Credit-Cards.txt`，并且它为新加密的文件添加了 `.gpg` 扩展名。


    你应该删除原始文件 `Credit-Cards.txt`，这样加密文件就是其中包含信息的唯一来源。


    现在让我们尝试使用 `nano` 文本编辑器打开加密文件。


    ```

    nano Credit-Cards.txt.gpg

    ```


    ![img](img/image070.jpg)


    系统将提示你输入密码以解密文件。


    ![img](img/image008.jpg)


    如你所见，文本文件已成功解密。


    `gpg` 工具有很多选项，但加密和解密很容易操作，只需要你知道两个选项即可快速使用：创建或加密 (`-c`)，解密 (`-d`)。


    | ![img](img/chapter_title_corner_decoration_left.png)  |  | ![img](img/chapter_title_corner_decoration_right.png)  |


    ![img](img/chapter_title_above.png)


    # 使用 Steghide 将秘密数据隐藏在图像中


    ![img](img/chapter_title_below.png)


    Steghide 是一种隐写术工具，它使用密码将秘密文件隐藏在图像或音频文件中。支持 BMP 和 JPEG 图片类型，以及 AU 和 WAV 音频格式。


    当你想发送加密消息或隐藏个人数据时，此工具非常有用。


    ## 安装


    要安装 Steghide，请在你的 Linux 终端中使用以下命令。


    ```

    apt install steghide

    ```


    Steghide 现在应该已安装在你的系统上。你可以使用 `steghide --help` 命令来查找所有选项。


    ## 将数据嵌入图像


    在这一步中，我创建了一个简单的文本文件 (`secretpass.txt`)，其中包含一些密码，我将把它嵌入到我的图像文件 (`warcraft3.jpg`)
    中。


    ![img](img/image013.jpg)


    要嵌入文件，请使用以下命令：


    ```

    steghide embed -ef secretpass.txt -cf warcraft3.jpg -p letmein

    ```


    参数分解如下：


    - `-ef` 指定你想要隐藏的文件。在我的例子中是 `secretpass.txt`

    - `-cf` 是数据嵌入到的文件。在这个例子中，我将其嵌入到名为 `warcraft3.jpg` 的图像文件中。


    '
- fmt: '

    ● `-p` is to specify a password. The password will be required for anyone trying
    to extract the data from the image.


    ![img](d2d_images/image051.jpg)


    The text file is now embedded in the image.


    ## Extract Data from the Image


    To extract the hidden data, use the following command:


    ```

    steghide extract -sf warcraft3.jpg -p letmein

    ```


    ![img](d2d_images/image047.jpg)


    Here, you can see I have extracted `secretpass.txt` from the `warcraft3.jpg` image.
    The embedded text file will be extracted and written to your current directory.


    You can use `ls` command to see the file. Now I will open `secretpass.txt` file
    using the nano text editor.


    ```

    nano secretpass.txt

    ```


    ![img](d2d_images/image045.jpg)


    As you can see, this file contains my secret passwords.


    It literally only takes a moment to hide secret messages or passwords inside media
    files.


    | ![img](d2d_images/chapter_title_corner_decoration_left.png)  |  | ![img](d2d_images/chapter_title_corner_decoration_right.png)  |


    ![img](d2d_images/chapter_title_above.png)


    # Detect Malicious Wi-Fi Attacks with Wireshark


    ![img](d2d_images/chapter_title_below.png)


    Due to weaknesses in the way Wi-Fi works, it’s extremely easy to disrupt most
    Wi-Fi networks using tools that forge deauthentication packets.


    Most common tools like `aireplay-ng` or `MDK3` do this by flooding a target with
    deauthentication packets, which will disconnect any client from the network at
    any time. Doing so requires only a wireless network adapter that can be put into
    monitor mode, and a simple command.


    To get started detecting these attacks, I will be using Wireshark to sniff packets
    in the area and separate the types of packets with filtering. If you don’t have
    Wireshark, you can download the tool for free at [wireshark.org.](https://www.wireshark.org/)


    ## Capture Packets with Wireshark


    Open your Linux terminal and type `wireshark`, you’ll see the menu below.


    ![img](d2d_images/image083.jpg)


    First, select the network interface you’ll be using to capture packets. In my
    case, I’m using `wlan0mon`. Then click “Start capturing packets” in the top left
    corner.


    For this example, let’s pretend the attacker will use `aireplay-ng` to kick wireless
    clients from the access point (router) using the following command.


    ```

    aireplay-ng -0 0 -a 3A:43:3D:BF:B1:90 wlan0mon

    ```


    ![img](d2d_images/image075.jpg)


    - `-0` means deauthentication.

    - `-a 3A:43:3D:BF:B1:90` is the MAC address of the access point.

    - `wlan0mon` is the wireless interface name in monitor mode.


    Now let’s go back to Wireshark and stop the capturing process. To detect and find
    deauthentication packets on wireless networks, use the following filter.


    ```

    wlan.fc.type_subtype == 12

    ```


    ![img](d2d_images/image005.jpg)


    At this point, you will know that someone is trying to deauthenticate other clients
    from the network in order to make them re-authenticate and collect the WPA/ WPA2
    4-way handshake while they are re-authenticating.


    This is a known technique for breaking into PSK (pre-shared key) based wireless
    networks. Once the attacker collects the 4-way WPA handshake, the attacker can
    then try to crack it and obtain the clear text password and access the network.


    Wireshark is a great way of visualizing Wi-Fi attacks and allows anyone to see
    when an attack is present and what kind of Wi-Fi packets are involved with a minimum
    of work.


    | ![img](d2d_images/chapter_title_corner_decoration_left.png)  |  | ![img](d2d_images/chapter_title_corner_decoration_right.png)  |


    ![img](d2d_images/chapter_title_above.png)


    # Secure Your Wi-Fi from Brute-Force Attacks


    ![img](d2d_images/chapter_title_below.png)


    One of the easiest ways hackers break into Wi-Fi networks is by using brute-force
    or wordlist attacks, where they run massive lists of common passwords against
    your network until they find the right one.


    Therefore, you need to consider implementing some changes on your router to protect
    yourself from intruders.


    ## Switch to WPA3


    The first line of defense is using WPA3, the latest Wi-Fi security protocol.


    WPA3 is designed to protect against offline dictionary attacks, where an attacker
    attempts to guess the password repeatedly. This is achieved through stronger encryption.


    Even if a weak password is used, WPA3’s encryption methods make it significantly
    harder for attackers to crack the password.


    ### Enable WPA3


    ● Open your browser and go to your router’s IP address (often `192.168.0.1` or
    `192.168.1.1`).


    ● Log in with your admin credentials.


    ● Go to Wireless Settings or Security Settings.


    ● Change the security mode from WPA2 to WPA3-Personal.


    ● Save your changes and reconnect your devices.


    ![img](d2d_images/image078.jpg)


    So, upgrading to WPA3, if supported by your router and devices, is a recommended
    step to ensure the highest level of security for your wireless network.


    ## Create a Complex Password


    WPA3 alone won’t save you if your password is something weak like `qwerty` or
    `superwifi`. Hackers use wordlists with millions of common passwords.


    Build a strong password by mixing upper and lowercase letters, numbers, and symbols,
    and aim for 16 characters or more.


    ● Great example: `D7$f!wAq9@rPz3Lk`


    ● Bad example: `mypassword2025`


    The longer and more random your password, the harder it becomes for even powerful
    computers to crack it.


    By combining WPA3 encryption with a truly complex, random password, you’re making
    life incredibly difficult for anyone trying to brute-force their way into your
    network.


    | ![img](d2d_images/chapter_title_corner_decoration_left.png)  |  | ![img](d2d_images/chapter_title_corner_decoration_right.png)  |


    ![img](d2d_images/chapter_title_above.png)


    # Keep an Eye on Your Logs


    ![img](d2d_images/chapter_title_below.png)


    One of the smartest ways to protect your Linux system is by keeping an eye on
    your logs. Whenever something happens (a login attempt, a new process, a strange
    error), it usually gets recorded in `/var/log`.


    You can read logs with the following commands:


    ```

    cat /var/log/auth.log

    ```


    To watch logs in real time, use:


    ```

    tail -f /var/log/auth.log

    ```


    See failed login attempts:


    ```

    grep "Failed password" /var/log/auth.log

    ```


    Example output:


    ```

    May 20 10:22:33 kali sshd[3456]: Failed password for root from 192.168.1.100 port
    53421 ssh2

    ```


    ## Use Logwatch to Summarize Logs


    You don’t always want to read logs line-by-line. That’s where Logwatch comes in.
    It summarizes log activity in daily emails, so you can monitor weird behavior.


    Install it with:


    ```

    apt install logwatch

    ```


    Then run:


    ```

    logwatch—detail high—mailto you@example.com—range today

    ```


    This will show you summaries like:


    ```

    SSH :Invalid login attempts: 12Successful logins: 2Apache :404 errors: 20Suspicious
    requests: 3

    ```


    You’ll get a full summary of any weird errors, login attempts, or system events
    for the day.


    ## Bottom Line


    You’ve made it to the end of the book, and that’s something to be proud of! Over
    these chapters, you’ve gone from basic Linux commands to mastering advanced hacking
    techniques.


    You learned how to break into Wi-Fi networks, crack password hashes, and create
    your own tools with Python. You explored the power of reverse shells and discovered
    ways to hide and protect your sensitive data.


    By now, you should have a solid foundation to understand how hackers think and
    the skills to better secure your own systems.


    Thank you!

