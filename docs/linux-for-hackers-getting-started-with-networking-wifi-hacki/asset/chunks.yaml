    | 4ca7c5c27c2314eecc71f67501abb724 |


    Here is the MD5 hash for "letmein123". This is how the password will look in a
    database server instead of "letmein123".


    Similarly, I will generate another hash for "letmein123". This time, I will use
    the SHA256 algorithm.


    | 9b0eb22aef89516d6fb4b31ccf008a68abe0d10a3fc606316389613eccf96854 |


    And you can see the SHA256 hash for the password "letmein123".


    ## Crack the Hashes


    The biggest problem with password hashing is that if you run a specific word like
    "letmein123" through a hashing algorithm, the hashed outcome for that word will
    always be the same.


    So, hashes can be reversed using methods such as dictionary attacks, which compares
    the given hash to the hashes of common words from a dictionary file. Now let’s
    see how to crack the hashes. To do that, I will use a site called "[crackstation.net](https://crackstation.net/)".


    ![img](d2d_images/image048.jpg)


    Here I will put both hashes, the MD5 and SHA256, then click "Crack Hashes".


    ![img](d2d_images/image025.jpg)


    And you can see the hashes have been successfully cracked.


    You can crack the hash if the password is short in length. To protect your password,
    use long words with digits and special characters, store them in a password manager,
    and don’t use the same password on different accounts.


