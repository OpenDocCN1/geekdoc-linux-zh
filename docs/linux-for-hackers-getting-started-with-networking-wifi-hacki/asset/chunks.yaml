    When you create a user account in Linux and set a password, your system doesn’t
    store the password in plain text. Instead, it stores the hash in a file called
    `/etc/shadow`.


    This file is readable only by the root user, and each line contains a username
    and their hashed password, like this:


    | `newuser:$y$j9T$vsFOgjanE/bchXfDigS/G.$AhWziPaBF1N1l.GaH7dnrXe7wGN9YW5u09NF0V602RC:...`
    |


    That long string starting with `$y$` is the actual password hash, and in this
    case, it’s using the `yescrypt` hashing algorithm (used in modern Linux systems
    by default).


    ## Extracting and Cracking the Hash


    To get the hash, you’ll need to open the `/etc/shadow` file using the following
    command:


    ```

    cat etc/shadow

    ```


    ![img](d2d_images/image014.jpg)


    Look for a line that starts with your target username. In this example, I will
    select “newuser”.


    Next, copy just the hash part (everything after the colon and before the next
    colon) and paste it into a text file using `nano` terminal text editor.


    ```

    nano hash.txt

    ```


    ![img](d2d_images/image007.jpg)


    Then use the following command to crack the hash.


    ```

    john—format=crypt hash.txt—wordlist=passwords.txt

    ```


    - `hash.txt`: is the txt file containing the hash.

    - `passwords.txt`: is the wordlist file.


    `John` will start trying all the passwords in your wordlist against the hash.
    If the real password is in the list, it’ll crack it and show you something like:


    ![img](d2d_images/image020.jpg)


    The hash was successfully cracked, and the password is “letmein123”.


    | ![img](d2d_images/chapter_title_corner_decoration_left.png)  |  | ![img](d2d_images/chapter_title_corner_decoration_right.png)  |


    ![img](d2d_images/chapter_title_above.png)


    # Crack Password Protected ZIP Files


    ![img](d2d_images/chapter_title_below.png)


    I’m going to show you how to crack password-protected ZIP files using a tool called
    `fcrackzip`.


    `Fcrackzip` is a tool that can be used to decrypt zip files and determine their
    passwords. It is able to crack password-protected zip files with brute force or
    dictionary-based attacks.


    ## Installation


    `Fcrackzip` can be installed using the following command.


    ```

    apt install fcrackzip

    ```


    At this point, you can access the help menu of the tool by typing `fcrackzip –
    help` in the terminal.


    ![img](d2d_images/image028.jpg)


    ## Create a ZIP File that is Password Protected


    To begin, I must generate a password-protected file. To do that, I will use the
    following commands.


    ```

    touch secretinfo.txtzip—password 12345678 secretinfo.zip secretinfo.txt

    ```


    The first command will create a text file called `secretinfo`, and the second
    command will generate a password-protected ZIP file with the password “12345678”,
    and the name of the file will be `secretinfo.zip` in my case. You can use the
    `ls` command to see the ZIP file.


    ![img](d2d_images/image079.jpg)


    ## Cracking the Password with a Dictionary


    In this mode, `fcrackzip` can read passwords from a text file that you provide,
    the password must be contained in the dictionary file you are using.


    If it is not in the dictionary, then `fcrackzip` will be unable to determine the
    key. Use the command below to crack the password.


    ```

    fcrackzip -D -p /home/frost/rockyou.txt -u secretinfo.zip

    ```


    Let’s break down the command:


    - `-D` to specify you are using a dictionary or wordlist.

    - `-p` to specify the password file.

    - `/home/frost/rockyou.txt` is the path/location for the dictionary file. In my
    case, I’m using `rockyou.txt`.

    - `-u` to use unzip

    - `secretinfo.zip` is the password-protected ZIP file.


    Once you have set up the command, press “Enter” to start the cracking process.


    ![img](d2d_images/image040.jpg)


    Here you can see the password was found.


    | ![img](d2d_images/chapter_title_corner_decoration_left.png)  |  | ![img](d2d_images/chapter_title_corner_decoration_right.png)  |


    ![img](d2d_images/chapter_title_above.png)


    # Bypass Windows Passwords using Kali Linux


    ![img](d2d_images/chapter_title_below.png)


    In this chapter, you’re going to learn how to reset/remove forgotten passwords
    on any Windows computer.


    Using this method, you can unlock any Windows device without knowing the user
    password and without formatting the hard disk.


    To perform this experiment, I will use a little program called `chntpw`. This
    `chntpw` can remove the password of a user in Windows SAM files, even this program
    can edit the Windows registry. The tool comes pre-installed by default in Kali
    Linux.


    ## Make Bootable USB of Kali Linux


    When you’re locked out of Windows, you need to use another computer to make a
    Kali bootable USB. Please follow the steps listed below.


    - Download the ISO image of [Kali Linux](https://old.kali.org/kali-images/kali-2023.3/kali-linux-2023.3-live-arm64.iso)
    . It’s free.

    - Next, you’ll need a program to install Kali on your USB drive and make it bootable.
    I will use [Rufus](https://rufus.ie/en/) . Just download and install it on your
    local PC.

    - Start the `Rufus` utility and browse to locate your Kali Linux image.

    - Click Start to create a Kali Live USB drive.


    After successfully creating a bootable USB, plug it into the USB port of your
    Windows computer and boot from the USB.


    You may have to press a special key (e.g., `Esc`, `F2`, `F12`, `Del`, etc.) during
    bootup to get the computer to boot from the USB instead of the hard drive.


    ## Remove Windows Password


    Here I have entered into the Kali Linux operating system.


    ![img](d2d_images/image027.jpg)


    Click on the “File System” and open it. After opening it, select the drive of
    the Window machine where Windows is installed.


    ![img](d2d_images/image012.jpg)


    After that, right-click on a blank space in this location, and select open terminal
    here, then go to `/Windows /System32/config/` using the `cd` command. Now you
    have reached the place where the Windows password file is kept.


    ### List Users


    Use the following command to find all existing users on the Windows machine.


    ```

    chntpw -l SAM

    ```


    ![img](d2d_images/image069.jpg)


    Select the user whose password you want to remove. In my case is “Workgroup”.
    Just replace the username and execute the following command.


    ```

    chntpw -u Workgroup SAM

    ```


    ![img](d2d_images/image053.jpg)


    After executing the command, it shows you different options. All you have to do
    is proceed by selecting option 1 “Clear (blank) user password” to remove the Windows
    password.


    ![img](d2d_images/image002.jpg)


    Then press “q” and “y” to save the changes.


    At this point, you can reboot your computer and unplug the USB drive, you’ll see
    there’s no password required to log in. I hope this will be helpful if you ever
    need to reset/remove a Windows password.


    | ![img](d2d_images/chapter_title_corner_decoration_left.png)  |  | ![img](d2d_images/chapter_title_corner_decoration_right.png)  |


    ![img](d2d_images/chapter_title_above.png)


    # Chapter 4: Python Scripting


    ![img](d2d_images/chapter_title_below.png)


    Python is the language that every cybersecurity expert relies on. It’s practical,
    powerful, and everywhere in the hacking world. So, let’s see some reasons why
    hackers love Python:


    - Easy to Learn: Even if you’ve never written a single line of code, Python is
    one of the easiest programming languages to learn. Its syntax reads almost like
    English, which makes it perfect for beginners in cybersecurity.

    - Build Your Own Tools: Want to write a port scanner, a brute force script, or
    a tool that listens to network traffic? You can do it all in Python, often with
    just a few lines of code.

    - Tons of Hacking Libraries: Need to scan a network? Crack passwords? There’s
    probably a Python library for that. Tools like `scapy`, `socket`, `requests`,
    and `nmap` give you superpowers with just a few lines of code.

    - Automate Everything: Tired of running the same commands over and over? Python
    can automate scanning networks, scraping websites, testing passwords, or parsing
    logs.


