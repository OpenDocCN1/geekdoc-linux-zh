    # Chapter 1: Introduction


    ![img](d2d_images/chapter_title_below.png)


    If you’re new to cybersecurity, hacking, or even just the idea of using a terminal,
    it can feel intimidating. But here’s the secret: Linux isn’t just for hackers.
    It’s for curious minds who want to understand how computers really work.


    Hackers use Linux not because it’s cool (though it is), but because it gives them
    control. In Windows or macOS, much of what happens is hidden behind pretty buttons
    and menus. But in Linux? You’re in the driver’s seat.


    You can see exactly how things work, and you can make the system do what you want,
    not the other way around. Here’s why Linux is the hacker’s choice:


    ## It’s Built for the Command Line


    Hackers love the command line. It’s fast, precise, and powerful, kind of like
    writing spells for a computer. Linux gives you a terminal that’s open, flexible,
    and deeply connected to the core of the system. That means you can automate tasks,
    dig into files, poke around the network, and launch attacks or defenses.


    ## It Comes With Hacking Tools


    Distros like Kali Linux or Parrot OS are made for hackers. They come loaded with
    hundreds of tools for scanning networks, cracking passwords, sniffing traffic,
    and much more. While you could install these tools on other systems, Linux is
    where they were meant to run.


    ## It’s Open Source


    Linux is like a transparent machine: you can open the hood, study the engine,
    and change anything you want. For hackers, this openness is gold. You can learn
    from the system itself, break things in a safe environment, and build your own
    tools, all without hitting a wall of permissions or hidden code.


    ## It’s Secure and Scriptable


    Linux was designed with security in mind. It gives you fine-grained control over
    users, permissions, and access. On top of that, it’s perfect for scripting or
    using Bash and Python to automate tasks, run scans, or create your own hacking
    tools. That’s why so many real-world hackers write their own tools instead of
    just clicking buttons.


    ## Quick Reminder


    This book’s lessons are based on an operating system called Kali Linux, a favorite
    among hackers and penetration testers. Kali comes packed with a wide range of
    built-in hacking tools, so you won’t need to download or install additional programs—it’s
    ready to use right out of the box.


    Kali Linux can be downloaded from the official website’s download page located
    at [https://www.kali.org/downloads](https://www.kali.org/downloads). Let’s get
    started!


