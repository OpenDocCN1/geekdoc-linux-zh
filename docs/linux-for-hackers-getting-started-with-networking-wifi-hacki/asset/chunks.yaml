    # Crack Password Hashes with Hashcat


    ![img](d2d_images/chapter_title_below.png)


    Hashcat is the world’s fastest and most advanced password recovery tool that helps
    break complex password hashes. It is a flexible and feature-rich tool that offers
    many ways of finding passwords from hashes.


    For those who don’t know, password hashing is a process of using a hash function
    to convert a password into an unrecognizable series of characters like "1a1dc91c907325c69271ddf0c944bc72".


    This makes it difficult for malicious actors to gain access to the password, as
    the characters are not readable.


    ## Install Hashcat


    Hashcat comes pre-installed in Kali Linux. To install it in Debian-based systems,
    use the following command:


    ```

    apt install hashcat

    ```


    Once the installation is done, you can check Hashcat’s help menu using the `hashcat
    -h` command in the terminal.


    Before cracking, let’s create some hashes to work with. There are many hashing
    algorithms like MD5, SHA1, SHA256, NTMLv2, and so on.


    For this example, I will generate two hashes: A MD5 hash and a SHA256 hash for
    the password "letmein456" using an [online tool.](https://emn178.github.io/online-tools/)


    | 0e88c5706dc5f028ac7c7d31d6cd1538 ==>MD5b59717793d432dd2c4edf0c960948ef581d8499393aaef6214a5fbd4cb1c2e3d
    ==>SHA256 |


    Here are the generated hashes for the password "letmein456".


    ## Crack the Hashes


    In addition to Hashcat, you will also need a wordlist. A wordlist is a list of
    commonly used passwords in a text file. A popular password wordlist is `rockyou.txt`.


    It contains a list of commonly used passwords and is popular among pen testers.
    You can find the rockyou wordlist under `/usr/share/wordlists` in Kali Linux.


    Let’s crack the MD5 hash first by copying the hash into a text file using `nano`.


    ```

    nano md5hash.txt

    ```


    ![img](d2d_images/image056.jpg)


    Then use the following command to crack the hash.


    ```

    hashcat -m 0 md5hash.txt rockyou.txt

    ```


    `-m 0`: MD5 hash mode. You can see all the codes on [this page.](https://hashcat.net/wiki/doku.php?id=example_hashes)


    `md5hash.txt`: is the txt file containing the hash.


    `rockyou.txt`: is the wordlist file.


    ![img](d2d_images/image010.jpg)


    The hash was successfully cracked and is "letmein456".


    Looks simple, doesn’t it. Now let’s crack the SHA256 hash. The hash mode value
    for SHA256 is 1400. Here is the command:


    ```

    hashcat -m 1400 sha256hash.txt rockyou.txt

    ```


    ![img](d2d_images/image032.jpg)


    You can see that the status is "Cracked" and the "letmein456" password again.
    You can also crack multiple hashes by putting them in a text file.


    ```

    nano hash-list.txt

    ```


    ![img](d2d_images/image037.jpg)


    Now run the following command.


    ```

    hashcat -m 1400 -a 0 hash-list.txt rockyou.txt -o cracked.txt

    ```


    `hash-list.txt`: is the text file containing multiple hashes.


    `cracked.txt`: is the output text file for the cracked hashes.


    To check the cracked hashes, use the "cat" command in the terminal.


    ```

    cat cracked.txt

    ```


    ![img](d2d_images/image055.jpg)


    Here you can see I have cracked three hashes.


    Hashcat is a powerful tool that helps you to crack password hashes. To enforce
    security and protect hashes from attacks, use strong passwords with digits and
    special characters.


    | ![img](d2d_images/chapter_title_corner_decoration_left.png)  |  | ![img](d2d_images/chapter_title_corner_decoration_right.png)  |


    ![img](d2d_images/chapter_title_above.png)


    # Crack Windows Passwords with John the Ripper


    ![img](d2d_images/chapter_title_below.png)


    John the Ripper is an offline password-cracking tool designed to test password
    strength, brute-force encrypted (hashed) passwords, and crack passwords via dictionary
    attacks. Simply put, John cracks passwords.


    ## Extract Hashes from Windows


    The first thing you need to do is to grab the password hashes from the SAM file.
    Security Account Manager (SAM) is a database file in Windows 10/8/7 that stores
    user passwords in encrypted form, which could be located in the following directory:


    ```

    C:\Windows\system32\config

    ```


    To extract the SAM files, open a command prompt (`cmd`) on the Windows machine
    and type the following commands:


    ```

    reg.exe save hklm\sam C:\sam.save

    reg.exe save hklm\system C:\system.save

    ```


    These commands will grab the password hashes from your current system and save
    it to the `C:\` drive.


    ![img](d2d_images/image026.jpg)


    Now you need to copy those two files (`sam.save`, `system.save`) and switch to
    the Kali Linux machine or other Linux distribution, and paste the files on the
    Desktop.


    ![img](d2d_images/image082.jpg)


    To see the hashes from the files, I will use the following command in the terminal.


    ```

    impacket-secretsdump -sam sam.save -system system.save LOCAL

    ```


    ![img](d2d_images/image011.jpg)


    Here you can see the accounts and the hashes. In my case, I will choose to crack
    the password for user "John".


    ![img](d2d_images/image050.jpg)


    To do that, I will copy the hash (`4b73ab495e53411975629cebebc9621c`) and create
    a new text file using the `nano` text editor.


    ```

    nano johnhash.txt

    ```


    ![img](d2d_images/image044.jpg)


    And paste the hash here. Don’t forget to save the file.


    ## Crack the Password


    In this step, I will use John the Ripper in wordlist mode to crack the user password.
    In this mode, John can read passwords from a text file that you provide.


    For this example, I will use the rockyou wordlist. To start the cracking process,
    use the following command.


    ```

    john --format=NT --wordlist rockyou.txt johnhash.txt

    ```


    `rockyou.txt` is the wordlist file from Kali Linux.


    `johnhash.txt` is the text file where I have put the hash from user "John" using
    `nano`.


    ![img](d2d_images/image009.jpg)


    Here, you can clearly see that John the Ripper has cracked the password and is
    "letmein".


    John the Ripper is probably the world’s best-known password cracking tool. It
    is often used by penetration testers and black hat hackers for its versatility
    and ease of use.


    | ![img](d2d_images/chapter_title_corner_decoration_left.png)  |  | ![img](d2d_images/chapter_title_corner_decoration_right.png)  |


    ![img](d2d_images/chapter_title_above.png)


    # Crack Linux Passwords with John the Ripper


