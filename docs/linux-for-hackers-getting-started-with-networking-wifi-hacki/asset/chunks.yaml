    # Networking Basics Every Hacker Needs


    ![img](d2d_images/chapter_title_below.png)


    Before you dive into hacking tools or try to break into anything (ethically, of
    course), there''s one thing you absolutely need to understand first: networking.


    Think of the internet as a massive web of computers talking to each other. Hacking
    is often about intercepting, understanding, or manipulating that conversation,
    and to do that, you have to speak the language.


    Whether you''re scanning for open ports, sniffing packets, or crafting your own
    scripts to exploit a vulnerable service, networking knowledge is your foundation.
    Let’s get started!


    ## IP Address


    An IP address (Internet Protocol address) is like the home address of your device
    on a network.


    It tells other computers where to find your device, just like a house number tells
    the mailman where to deliver a package.


    **Example:**


    ```

    192.168.1.100

    ```


    This might be your computer’s local IP on your home Wi-Fi.


    Websites like `google.com` also have IPs (like `142.250.64.78`), but we don’t
    memorize those, that’s where DNS comes in (more on that below).


    Your public IP is what the rest of the internet sees. You can find it by Googling
    “What’s my IP”.


    ## MAC Address


    A MAC address (Media Access Control address) is like a fingerprint or serial number
    for your device’s network card (the part that connects to Wi-Fi or Ethernet).


    It never changes, and it’s used inside your local network to identify each device
    uniquely.


    Looks like this:


    ```

    00: 1A:2B:3C:4D:5E

    ```


    Your router uses MAC addresses to know which device is which, even if two laptops
    have the same IP address at different times.


    ## DNS: The Internet’s Phone Book


    DNS stands for Domain Name System. It translates easy-to-remember names like:


    ```

    google.com

    ```


    Into the actual IP address, like:


    ```

    142.250.64.78

    ```


    So when you type `www.google.com`, DNS finds the correct IP for that website,
    just like a phonebook matches names to phone numbers.


    You can test this with:


    ```

    nslookup google.com

    ```


    You’ll see its real IP address.


    ## Port: The Apartment Number


    If your IP address is like your building’s address, a port is like the apartment
    number inside.


    It tells your computer which service or app a connection is for.


    *   Port 80 = websites (HTTP)

    *   Port 443 = secure websites (HTTPS)

    *   Port 22 = remote login (SSH)

    *   Port 25 = email (SMTP)


    So when you connect to `google.com` over HTTPS, your browser is actually talking
    to:


    ```

    google.com:443

    ```


    ## Putting It All Together


    Let’s say your computer (`192.168.1.10`, MAC `00:1A:2B:3C:4D:5E`) wants to visit
    `youtube.com`.


    Here’s what happens:


    1.  DNS translates `youtube.com` → `142.250.190.78`

    2.  Your computer sends a request to that IP on port 443 (because it’s a secure
    site).

    3.  Your router uses your MAC address to make sure the reply goes to the right
    device.


    ## How to See Who’s Online


    Before you can interact with or explore any device on a network, you need to know
    it exists. That’s where pinging and scanning come in. These are the digital versions
    of knocking on doors.


    Let’s break them down in a way that makes total sense, even if you''re brand new.


    ### Ping


    Ping is the internet’s version of asking, “Hey, are you online?”


    It sends a small packet of data (called an ICMP echo request) to a device, and
    if it replies, you know it’s up and reachable.


    **Example:**


    ```

    ping google.com

    ```


    Or ping your router:


    ```

    ping 192.168.1.1

    ```


    You’ll get something like:


    ```

    64 bytes from 142.250.64.78: icmp_seq=1 ttl=117 time=22.1 ms (google)

    64 bytes from 192.168.1.1: icmp_seq=1 ttl=117 time=22.1 ms (router)

    ```


    This means the device is online and reachable.


    ### Scan The Network


    One of the most famous tools for scanning is `nmap`. Use the following command
    for a basic scan:


    ```

    nmap 192.168.100.1

    ```


    ![img](d2d_images/image039.jpg)


    This scans a local IP to see what’s running.


    To scan the whole network, use:


    ```

    nmap 192.168.100.0/24

    ```


    This checks every device on that subnet (e.g., your entire home or office network).
    You can discover live devices on a network and see which ports are open.


    ### Comprehensive Nmap Scan


    If you want to discover every service and operating system (OS) behind an IP with
    `nmap`, use:


    ```

    nmap -p- -A -T3 192.168.100.27

    ```

