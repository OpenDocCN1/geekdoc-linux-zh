  md: 'Ubuntu installer, a live Ubuntu environment—meaning that you can get a taste
    of the Ubuntu Linux experience without having to even touch what you have on your
    hard drive. You can kick back, put your worries in check, and go with the flow.


    # What Is Linux?


    Your computer, despite being a collection of highly sophisticated parts, is really
    just ... well, a collection of highly sophisticated parts. On its own, it can
    do nothing than switch on and off spin a disk or two. For it to do anything truly
    useful, it needs an operating system (OS) to guide it. The OS takes a well-endowed
    but completely uneducated head of a machine and educates it, at enough so that
    it will understand what you want it to.


    You already know of and have probably used at least one of the many operating
    systems that exist today, or in the past. Windows, DOS, OS/2, and Mac OS are all
    such operating systems, and Linux is another. however, different from these other
    operating systems, in terms of both its capabilities and history. Linux was not
    created by a corporation or some corporate wanna-be to make money. The Linux kernel,
    referred to as the kernel, was created by computer enthusiast Linus Torvalds,
    a member of Finland’s Swedish ethnic minority, who wanted to create a Unix-like
    system that would work on home computers—particularly


    Rather than keeping his creation to himself, Torvalds opened it up to the world,
    so to speak, and comfy-ge around the globe to make it better and more powerful.
    It is this combination of abilities built around the core of the Linux kernel
    that is the essence of all Linux distributions today.


    Linux has acquired many fans and followers since its creation in 1991. Its devotees
    praise Linux for its features, as well as being robust, reliable, free, and open.
    Despite these positive characteristics, however, Linux is, on its own, just a
    text-based system. There is no desktop, and there are no windows or charming little
    to make you feel safe and cozy when you are behind the keyboard. Powerful though
    it may be, Linux is still a black-screen, command-line operating system. I guess
    you think of it as DOS on steroids, though a Linux purist will still cringe at
    the thought. Sorry.


    Although you can use Linux by itself, accomplishing all your tasks by typing on
    a black screen (the most common way of doing things when Linux is used as a server),
    you don’t have to do that. It is fair to say that with the advent in 1984 of the
    Macintosh and its easy-to-use graphical interface (GUI, pronounced "goo-ee”),
    DOS users began suffering something akin to GUI. They began clamoring for a GUI
    to call their own. The final result was Windows, which gave DOS a GUI and eased
    many command users into the Microsoft world.


    Similarly, many members of the Linux world felt the need and desire to go graphical.
    The community at large developed various GUIs (called window managers and desktop
    environments) and a subsystem with which to handle them (somewhat confusingly
    referred to as the X Window System) to bring about the'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'change. The graphical desktop environment that is included in your Ubuntu distribution—GNOME—is
    one example of the fruit of development.


    # About the Penguin


    You may have been wondering about the penguin in the chapter title, so I might
    well explain that now. The penguin was chosen by Linus Torvalds as the Linux mascot,
    and what has come to be thought of the Linux penguin was designed by Larry Ewing
    and is named Tux (see Figure 1-1). This explains not only the ornithological references
    and graphics throughout the book but also why there are so many penguin icons
    in Linux distributions and antispam, antisadware programs that include penguin
    or Tux, such as TuxRacer, XPenguins, and Pingus. This, combined with the fact
    that Linux is a revolutionary OS, helps explain why Linux users are sometimes
    referred to as Penguinistas. True, Ubuntu doesn''t play up the penguin as much
    as other distributions, but Linux is Linux, and so the penguin lives in Ubuntu
    too…just a bit less conspicuously.


    ![](img/add8efd602aad9815ee8abf27a7a293e_34_0.png)


    Figure 1-1: Tux, the linux mascot


    # Why Should You Use Linux?


    People use Linux for different reasons. For many, it is a matter of power, stability,
    multilingual capabilities, or even personal philosophy. However, for others, crash
    as it may sound, it is a matter of money. Just think for a moment about what it
    usually costs to get started with an operating system. Go wherever it is you go
    buy software, and take a walk down the aisle. Make a list in your head of all
    the things you want to buy and how much each costs: office suite; a game or two;
    maybe a graphics program with which to make yourself look better in your digital
    photos; and a collection of all those firewall, antivirus, and adware programs
    that you really need to protect yourself in the Windows world. Do the math.


    After you pick yourself off the floor, you will understand that we are talking
    big bucks here. On the other hand, for the price of this book, you will have all
    of the things you wanted and more in the Linux world. Despite the'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'worries that many people have, making the move to Linux means not only savings
    for you but also more computing versatility. You will not be hamstrung at some
    point along the way because you don''t have this or that program when you need
    it most—you''ll have all from the get-go or be able to download it easily.—and
    at no cost!


    You might counter with the fact that there are a lot of free applications out
    there for other operating systems, c''mon, let''s face it—these are often rather
    limited in their capabilities. The programs with a little are mostly shareware,
    and most shareware programs are limited in some way, or you use them for a short
    time unless you are paying for them. Their costs are relatively low, but $25 and
    $35 there eventually adds up to a considerable chunk of change. There is also
    the problem that some of these programs, unknown to you, install backdoors or
    keyloggers or make your system a sudden garden of adware. Finally, at least in
    my experience, the majority of such programs are hardly worth the money asked.


    # Is It All Just About Money?


    Linux is important to the average user, it is certainly not the only reason for
    taking the Linux plunge; there are a variety of other reasons well. As I mentioned,
    Linux is noted for its stability. Running your current system for a month without
    restarting and see what happens. Linux has been known to run without a reboot
    for more than a year without a hitch or decrease in performance. With its multilingual
    capabilities, Linux is also a perfect choice for language students or users in
    a multilingual environment.


    In addition, Linux is infinitely customizable: You can get your system to look
    and act the way you want without being "wizarded" to death. And then there are
    the applications that come with most Linux distributions. In addition to their
    wide variety, most are well up to industry sniff, with some, as Evolution, the
    GIMP, and Inkscape, being sources of envy for those outside the Linux world.


    Finally, with the advent of Microsoft''s Windows 7 and its more demanding hardware
    requirements (especially if you want to take advantage of its most touted features),
    you may find your current machine on the fast track to obsolescence. Turning it
    into a Linux machine will ensure its several more years of working life. After
    all, it''s a shame to put good hardware out to pasture early.


    # Is Linux Really Ready for the Desktop?


    Despite the advances Linux has made in recent years, this question still pops
    up quite often, and that''s fair enough. But consider this: When you install a
    program on your current Windows system and get an error message saying that the
    program can''t run because some DLL file is missing, or when you connect a piece
    of hardware and can''t get it to run, no one asks if that operating system is
    ready for the desktop.'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'In my experience, I have found no reason to doubt that Linux is ready. Sure,
    Linux has its occasional quirks, but so does every other operating system. Linux
    is ready and able. If my mother, can do the work she needs to do and keep herself
    amused until the middle of the night using her Linux system (blowing the whole
    thing up), I think it is perfectly safe to say that you''ll do all right too.


    # # What Is a Distribution?


    An operating system consists of a lot of files that perform a lot of different
    functions. And because there is no Linux corporation to package and distribute
    the files that make up Linux, the task of getting Linux onto your computer in
    working order, along with the applications that you are likely to want, has fallen
    to a variety of groups—companies, universities, user groups, and even private
    individuals. These entities create Linux and application collections called *distributions*,
    or *distros*. You could bypass these distros to collect everything you''d need
    to set up a system on all, but most would lose their mind in the process. Most
    people, even the geekiest, opt for the distro.


    Most of these distros, whatever their ultimate target audience, basically consist
    of the same elements: the core operating system (that''s the Linux kernel mentioned
    earlier); some sort of installer to get all the system parts and applications
    installed on your machine; the Windows System to provide graphical interface support;
    or more graphical desktop environments; and a series of applications, as as word
    processors, audio players, and games; as well as all the files needed to make
    these things work.


    There are, of course, a large number of distros. Some are geared toward specific
    audiences, such as businesses, educators, gamers, programmers, and specific language
    users. What makes each distro is the software that is bundled with the Linux kernel,
    as well as other convenience features such as the package (or application) installation
    mechanism and the installer for the system itself. Some distros are especially
    appropriate for home users because of ease of installation. Ubuntu, a relatively
    newcomer to the Linux world, is one of them, joining distros that have long been
    popular in the ease-of-use arena, such as Mandriva, SUSE, and Fedora Core. Some
    of these entities charge for their distros, most also provide them for free for
    download.


    # # What Is Ubuntu?


    Ubuntu is a completely free, easy-to-use, and extremely popular Linux distribution
    that is geared toward the desktop user. It is one of the hottest Linux distros
    in the marketplace today. It is also one of the few Linux distros with what could
    be described as a social agenda behind it.'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'Ubuntu is the brainchild of South African millionaire entrepreneur Mark Shuttleworth,
    who is probably better known for being one of the first space tourists—the first
    African in space, to be exact. Shuttleworth invested more than $10 million in
    starting the Ubuntu Foundation based on his belief in free software and in order
    to fix what he describes as “bug 1”—Microsoft’s dominance of the desktop PC marketplace
    (https://bugs.launchpad.net/ubuntu/+bug1).


    As Shuttleworth states the following in his blog (available at https://wiki.ubuntu.com/MarkShuttleworth):


    I believe that free software brings us into a new era, and holds the promise of
    universal access to the tools of the digital era. I drive Ubuntu because I would
    like to see that promise delivered as reality.


    As you can see, it’s a vision thing.


    Befitting the nationality and goals of the man who brought it into being, the
    word Ubuntu comes from the Zulu and Xosa languages. Ubuntu, according to Wikipedia,
    is a concept meaning something along lines of “humanity toward others” or “I am
    because we are.” If you''re interested, the 2005 film In My Country, although
    not one of the greatest films ever produced, is on many levels a 100-minute examination
    of the concept of Ubuntu.


    # Why Ubuntu Then?


    With many distros out there, you might wonder why you should opt for Ubuntu. Well,
    as they say, numbers don’t lie, and Ubuntu’s popularity is not without good cause.
    These traits are especially crowd pleasing:


    # Easy to install


    It''s fair to say that most Linux distributions these days are pretty easy to
    install (and definitely easier and faster to install than Windows). Ubuntu is
    right in line with these improvements, and the fact that you can install it with
    only a few clicks while running the live CD means it is pretty much ready to go
    whenever you need.


    # Easy to use


    Ubuntu is easy to use in that it is very Windows-like in operation, and yet it’s
    more Linux-like than other Windows user-oriented distributions. It is designed
    with the needs of real people in mind, not just computer-nerds and geeks.


    # DEB based


    Ubuntu is based on the Debian distribution, which means that it utilizes its convenient
    DEB package system for application handling and installation. The two preconfigured,
    graphical package installers that come with Ubuntu make installing applications
    even easier. so many packages are available for Debian systems like Ubuntu that
    you are likely to find more software out there than you’ll ever know what to do
    with.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# Up-to-date


    Some distros are updated at a snail''s pace, while others strive to be cutting
    edge that are often plagued with bugs. Ubuntu, with its reasonable six-month release
    cycle, tries to stay up-to-date as possible, while at the same time making sure
    things are not released before they are ready for prime time. In this way, you
    are ensured of having an up-to-date yet buggy distro at your disposal.


    # Dependable and robust


    I know these come across as mere hype, but after you smoke Ubuntu around a bit,
    you come to understand what they mean. Knock things down and around, and they
    bounce right back—this is very important for beginners who often have a knack
    for screwing things up. Nothing turns a new user more than a twitchy system that
    has to be velvet-gloved all the time.


    # Desktop user-oriented


    A lot of Linux distributions, although quite capable in the desktop arena, cater
    more to geeks and developers, taking up valuable disk space with a lot of junk
    you''ll probably never use. Ubuntu''s purpose is to grab desktop market share
    from the Redmond folks, so the needs of the common end user are always in mind.
    The result is that Ubuntu''s GNOME desktop environment is a very comfy place for
    the average desktop user to be.


    # Hardware Compatibility


    Well, enough of this background babble; it''s time to get things rolling. If you
    haven''t installed Linux on your machine yet and are wondering whether you can,
    rest assured: Ubuntu will run on most machines once you get up and running. There
    are so many minor parts to your machine that it is difficult to see whether each
    part will cooperate with your installation. There are video cards, sound chips,
    LAN cards, monitors, and so on, and they all need to be considered.


    # Diving In


    If you are going to buy a new machine on to run Ubuntu, then it is reasonable
    to do a bit of worrying and check things out, but if you are going to install
    it on the machine you have, I recommend just diving in. After all, you don''t
    really have to install anything the first time. You have a live CD right here
    in the book, after all, so you can just pop CD in your drive, boot your machine,
    and biff, bam, zwie, you''ll be up and running (or not) in a minute or two. If
    everything seems to be going as it ... well, your worries are over, and you can
    go ahead and install the system when you''re ready and willing. That is one of
