    Rhythmbox too, because it is essentially the same concept. Rhythmbox should automatically
    import everything you have in your Music folder without any extra work on your
    part. If you prefer to add songs to the Rhythmbox library manually, you can open
    the preferences (Edit > Preferences), click the Music tab, and uncheck the Watch
    my library for new files box. After that, you can add new songs to your Rhythmbox
    Library by going to the Music menu, selecting Import Folder, and then navigating
    to the folder for the new album you want to add. If you want to add a number of
    albums by the same artist instead, just navigate to and select the folder for
    that—if you want to add just a single audio file, you can also do that—select
    Music > Import Folder, and then navigate to the song in question.


    If you are not the navigating type, you can also add files and folders by other
    means. The simplest way is to drag the folder or song you want to add to the Library
    into the right pane of the Rhythmbox window. You can also'
