    them, identifying ones that have already reported, asking for details on how the
    happens, and generally trying to get enough information together for a developer
    to be able to solve and fix the issue. In practical terms, this means it can take
    quite while for a problem to be fixed, the actual timescale will depend on how
    important the bug is judged to be. I reckon waiting on two to three months for
