    # Check Your System Memory for Defects


    Your system memory (also known as RAM) is vital to the operation of your computer.
    It''s where all your programs (and Linux itself) store information when they''re
    running. If a fault develops in your system memory, freezes and crashes can start
    happening for seemingly no reason.


    To check for problems with the system memory, boot from the Ubuntu CD included
    with this book (see Chapter 2 to remind yourself how to do this)

    As soon as the purple boot screen appears, press a key and select your language
    from the gray menu that pops up. Then, choose Test memory from the main menu,
    and press ENTER. The screen will turn blue, and the Memtest86 program will start
    running (Figure 21-4).


    Memtest86 repeatedly writes to your system memory and then accesses them a few
    moments later. It''s like a stress test for your RAM.

    Let it run until the Pass percentage at the top right of the screen has gone past
    100 percent or twice—this might take as long as an hour or two, depending on how
    much system memory you might have. Memtest86 should have found any faults in the
    system memory and reported them on the screen. If it does find a problem, you
    might need to get some of your RAM replaced, because it could damaged.


    You can turn off your computer at any time while Memtest86 is running—you don''t
    need to shut down properly as you usually would.


