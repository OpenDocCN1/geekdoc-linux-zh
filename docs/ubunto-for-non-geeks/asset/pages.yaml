    the one introduced in Chapter 9), Mines (the Linux world''s answer to Minesweeper),
    Quadassel (a Tetris clone), and Sudoku. Many other free games are available via
    the Ubuntu Software Center (and other sources), some of which you will learn about
    in this chapter.'
