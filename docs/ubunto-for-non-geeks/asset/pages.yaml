    # The Screen Is Blank


    One possible cause of a blank screen is that something went wrong with your graphics
    card or its drivers. Frankly, this is a reasonably rare occurrence, and it''s
    much more likely that something minor (and easy to fix) happened. Peruse the following
    tips before you start about some sort of graphics apocalapse scenario:


    +   Check that the display cable is connected Most computers have a separate monitor
    that plugs into the back of the computer. Look at the back of the monitor, and
    make sure both of the cables coming out of it are plugged in at ends. You might
    also want to check that the display is switched on and that its power cable hasn''t
    fused.


    +   Try to wake up the computer Your computer might have gone into a power-saving
    (sleep) mode, which you can wake up by moving your mouse or pressing keys on the
    keyboard. If that doesn''t work, try pressing the power button on your computer
    once. Sometimes computers wakes up from their sleep too.


    +   Switch to a command line The part of Ubuntu that''s responsible for displaying
    things on the screen is called X11, or just X. Sometimes X fails to start. To
    see whether this is the case, press CTRL-ALT-F2. You should login: prompt if X
    is working properly. You can type your username and password (pressing ENTER after
    each one) to access a command line, just like the Terminal in Chapter 9. If you''re
    using the command line, try typing sudo startx by pressing ENTER, and type your
    password again if prompted. This will start X; it might work, or if it gives you
    an error message telling you what the problem is. Alternatively, type reboot to
    restart your computer. (If CTRL-ALT-F2 switches to a different virtual terminal,
    Ubuntu starts a few virtual terminals and uses them for different things; CTRL-ALT-F7
    will switch you back to the virtual terminal by X to display everything.)


    +   Restart the computer Some computers occasionally start up without turning
    on the graphics card or the monitor. (This tends to be more of a problem on older
    computers.) As a last resort, try turning the computer off and then on again by
    pressing the power button. If the computer won''t turn off, hold down the power
    button for a few seconds until it does.'
