  md: '# 6


    # # ROUNDING OUT THE BIRD

    Downloading, Installing, and Updating Programs the Easy Way


    ![](img/add8efd602aad9815ee8abf27a7a293e_110_0.png)


    One of the handiest things about Ubuntu is that it is equipped with a very simple-to-use
    application installation mechanism. The engine behind this is called Advanced
    Package Tool (APT), which allows you to easily download, install, update, and
    remove software packaged in DEB archives, or packages.


    APT is a rather foolproof way of installing programs; nothing will go missing,
    since it automatically downloads and installs any files that the main application
    you are installing to run. Tracking down such files, called dependencies, proves
    to be a significant headache for most Linux users. The painful quest of finding
    and then installing this file or that, as well as any dependencies those files
    might have, has led to the missing dependency problem being referred to as dependency
    hell. APT makes that pretty much a thing of the past.


    So, where does APT find all these files and applications? Well, the packages that
    APT searches for, downloads, and installs are located in a set of specific online
    repositories. These repositories are online servers in which a great number of'
  merge: -1
  pgno: 110
- img_proc: true
  md: 'of applications, support files, and more are stored for use with your particular
    system. All of the files that originally came with your system, including the
    system (kernel) itself and updates, when available, are stored there too. This
    is quite unlike Windows or Mac OS, where you normally need to buy a CD or download
    an installer file from a website to get new software.


    The one thing about APT that some people, especially beginners, might consider
    a problem is that it is a command-driven application. This means you control it
    via commands in a command Terminal. Fortunately, Ubuntu has a number of different
    graphical frontends APT that allow you to bypass the command line and make everything
    as easy as you could ever hope it would be. In this chapter, we will be focusing
    on three of these frontends.


    # Project 6A: Installing Applications via the Ubuntu Software Center


    By far, the easiest to use of the APT frontend is the Ubuntu Software Center.
    Being the most graphically satisfying of the frontends, it is especially useful
    when it comes to browsing for color or handy applications. To get a feel for it,
    go to the Applications menu and select Ubuntu Software Center. The window that
    opens will look similar to Figure 6-1.


    ![](img/add8efd602aad9815ee8abf27a7a293e_111_0.png)


    > Figure 6-1: The Ubuntu Software Center


    As you can see, items in the Ubuntu Software Center are categorized pretty much
    in the same manner as the Ubuntu Applications menu. If you click any of the department
    icons in the main pane of the window, you will jump to a list of all the items
    available for that category. Applications that you''ve already installed are marked
    with a green check mark over their icons, while those that are not installed just
    display the plain icon. Not surprisingly,'
  merge: -1
  pgno: 111
- img_proc: true
  md: 'you will find that the installed items within each category mirror those in
    the relevant subsumenu of the Applications menu. To see a list of all your installed
    programs, click the Installed Software item in the pane on the left side of the
    window.


    # 6A-1: Selecting Applications for Installation


    The Ubuntu Software Center can install multiple applications simultaneously, to
    give it a whirl, you can try installing a few interesting applications in this
    section. Let''s start by selecting the very cool and decidedly useful address
    book application Rubrica (shown in Figure 6-2). To select Rubrica, click the Office
    department in the main pane of the window, scroll down the list of available applications,
    and double-click the Rubrica Addressbook item. A page containing information about
    Rubrica will be displayed. All you need to do now is click Install - Free and
    pass your password if prompted. This will start the installation.


    A progress indicator will appear on the page while Rubrica is downloaded and installed.
    Once the installation has completed, the Rubrica page will reload with a green
    check icon to show that it was added to your computer successfully. That''s all
    there is to it! Select Applications > Rubrica Address to start the program.


    ![](img/add8efd602aad9815ee8abf27a7a293e_112_0.png)


    Figure 6-2: Rubrica—a very cool address book


    # 6A-2: Searching for Applications


    Next up is Sound Converter (which I''ll talk more about using in Chapter 14).
    Scrolling through the list of programs can be tedious, so this time, try using
    the search feature: Type Sound Converter into the search box at the top right
    of the screen, and watch as the search results fly in. Sound Converter should
    appear at the top of the list of results, so select it and click Install. The
    installation will start like before—but this time, try clicking Get Software while
    the program is still installing.'
  merge: -1
  pgno: 112
- img_proc: true
  md: 'All the installation magic will continue in the background, and you can still
    browse for other programs. No to wait!


    Finally, let''s add a useful utility by the name of Sysinfo (Figure 6-3), which
    is a system profiler that can tell you all sorts of things about your computer.
    Just type sysinfo in the search box, click the Sysinfo search result that appears,
    and then click Install to add it to the installation queue. It''ll be installed
    as soon as the Ubuntu Software Center has finished dealing with Sound Converter.


    You can run the applications you''ve installed by going to the Applications menu
    and looking in the submenu that matches the Ubuntu Software Center "department"
    where you found the program—that would be Office for Rubrica, Sound & Video for
    Sound Converter, and System Tools for Sysinfo.


    ![](img/add8efd602aad9815ee8abf27a7a293e_113_0.png)


    Figure 6-3: Keeping tabs on your system information with Sysinfo


    # 6-A: Uninstalling Applications


    As you see, installing applications via the Ubuntu Software Center is quite simple.
    And fortunately, it''s just easy to uninstall them. Navigate to (or search for)
    the program you want to remove, click it once in the list, and click the Remove
    button that appears. Enter your password when asked, and watch as the program
    is uninstalled.


    # Performing System Upgrades via Update Manager


    The second graphical frontend for APT that I''ll cover in this chapter is Update
    Manager, which is used for updating your system. Updates are made quite regularly
    and consist of newer versions of packages you already have installed. Most of
    the time a newer version has been released because it fixes some security issue,
    but updates can also fix problems with software and introduce new features.


    To get started, select System > Administration > Update Manager, and make sure
    that the Ubuntu Software Center isn''t currently installing or removing anything
    (you can''t use two APT frontends at the same time).'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'Once the Update Manager window appears (Figure 6-4), click the Check button
    to make sure the package information is up-to-date as possible. You will be prompted
    for your password. Type it, and after a short while, a list of all the available
    updates will appear in the Update Manager window.


    ![](img/add8efd602aad9815ee8abf27a7a293e_114_0.png)


    **Figure 6-4:** Upgrading packages en masse via Update Manager


    If there are any applications you don''t want to upgrade, you can go through the
    list and uncheck the box next to their names. But for now, it''s safest to leave
    all the boxes checked. Either way, once you''re ready, click the Install button.
    The selected updates will be downloaded and installed. Once the installation is
    complete, you will be notified in a separate window. Click Close in that window
    and in the Update Manager window to finish up. Depending on what you installed,
    another notification may appear telling that you will have to restart your system
    in order for the changes to take effect. If so, it is best to deob and reboot.


    # ### How Often Should You Install Updates?


    Ubuntu will check for updates every day, and the Update Manager will appear on
    your desktop if it finds any. If this is happening too often and you find yourself
    being pestered by updates, select System > Administration > Software Sources.
    When the Software Sources window appears, select'
  merge: -1
  pgno: 114
- img_proc: true
  md: 'Updates tab (Figure 6-5), and under Automatic updates, change the Check for
    updates option to something else. Weekly updates should be fine.

    You’ll find a couple of other interesting options too. If you select Install security
    updates without confirmation, updates will happen automatically, without any intervention
    from you. Alternatively, you can choose to have updates download in the background
    so they’re ready to install immediately when Update Manager pops up.


    ![](img/add8efd602aad9815ee8abf27a7a293e_115_0.png)


    **Figure 6-5: an Update Ruins Your Day ... or System**


    Now, I don’t want to worry too much, but one thing about massive system updates
    is that sometimes things just go crazy, leaving you with all sorts of regrets
    and a mournful of expressions just waiting to be uttered. This is a fact of life
    no matter operating system you are using. It can happen in Windows, Mac OS, and
    in Linux. Therefore, it is always a good idea to wait a bit before installing
    a seemingly major update and to check the user forums first to see whether there
    are any disaster stories about a particular update. Leaving a week before noticing
    an update and installing it should protect you from rare mishaps, but there are
    no guarantees.


    **NOTE** To decide whether an update is “major,” look for updates with linux-
    in their name (linux-generic, for example, as seen in Figure 6-6). These are important
    system packages and are the ones most likely to cause problems.'
