  md: 'To make things bit easier and safer for you, you are going to create a folder
    in your home folder to place pyWings and all other applications that you install
    locally on your machine in the future. You will, logically enough, call the folder
    LocalApps.


    Let''s make the folder using a command in order to get some practice. Go to the
    Terminal, make sure you are in your home folder, type the following command, and
    then press ENTER:


    ```

    mkdir LocalApps

    ```


    # 9B-4: Extracting the pyWings Tarball


    Now it is time to extract the tarball. You could do this by the double-click method
    you learned in Chapter 7, but since you''re working with the command line here,
    let''s use that instead.


    To start, you''re going to place the tarball in the same folder into which you
    extract it. Usually this isn''t necessary because the contents of tarballs are
    already packaged in a folder of their own. By double-clicking the tarball to open
    it in File Roller, you can see whether things are packed in a folder or simply
    as a group of friends. In the case of pyWings, if it is the latter, to follow
    these steps:


    +   1. Create a pyWings tarball by typing mkdir pyWings and pressing ENTER.

    2. Move the pyWings tarball into that folder by typing mv pyWings*.gz pyWings
    and pressing ENTER.

    nYou can see that in this step you used an asterisk (*) to save wear and tear
    on your fingers. The asterisk is a wildcard character that in this case you used
    to move any file beginning with pyWings and ending in .gz. Fortunately you had
    only item matching those criteria.

    3. Move to the new pyWings folder by typing cd pyWings and pressing ENTER.

    4. Now you get down to the process of extracting the tarball itself using the
    tar command. To do this, type tar -xzvf pyWings*.gz, and press ENTER.

    Again, notice that you used the asterisk to save keystrokes, though you could
    just have typed -1.1 tar in its stead.

    5. Finally, type cd and press ENTER to bring the Terminal back to your home.


    # 9B-5: Moving the pyWings Folder to Your LocalApps Folder


    The extraction process is now complete. Before going on running pyWings, however,
    let''s move it to the new LocalApps folder you created in Project 9B-3. To do
    this, type the following command, and then press ENTER:


    ```

    mv pyWings LocalApps

    ```'
