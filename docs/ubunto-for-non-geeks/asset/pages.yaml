    # 8B-11: Stretching Desktop Icons


    A pretty feature in the GNOME desktop is stretchable icons. This allows you to
    make individual desktop icons any size you want, which can be not only aesthetically
    pleasing but also functional. For example, you could stretch one of your commonly
    used launchers to make it easy to locate, or you could stretch the thumbnail of
