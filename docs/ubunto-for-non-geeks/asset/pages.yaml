  md: '# Project 14C: Listening to RealMedia Streams with RealPlayer


    Now that you know how to play MP3 Internet broadcast streams, it is time to help
    round out your system by installing RealPlayer 11 (Figure 14-9). Although not
    as common as in the past, RealMedia streams are still widely available on the
    Internet. You can also use Real-Player to play RealVideo streams, when they''re
    available.


    ![](img/add8efd602aad9815ee8abf27a7a293e_302_0.png)


    Figure 14-9: RealPlayer


    # 14C-1: Downloading and Installing RealPlayer


    Installing RealPlayer in Ubuntu, once a hit-or-miss sort of minor pain, is now
    easier than it''s ever been before, so you can rest easy as you go through this
    project. Here''s what you need to do:


    +   - Open Firefox, go to http://www.real.com/realplayer/linux/, and click the
    Downloading DEB Installer link.

    - In the window that appears, accept the default option, Open with Gdebi Package
    Installer, by clicking OK.

    - A Package Installer window will soon open showing what you are about to install.
    Click the Install Package button, and then provide your password when prompted.


    In a few seconds, RealPlayer and all the dependencies your system requires to
    run RealPlayer will be installed. When the process is done, close the Package
    Installer.


    # 14C-2: Setting Up RealPlayer and Testing Your Installation


    Once RealPlayer 11 is installed on your machine, you will need to go through the
    final setup steps and then test it. You can start by selecting Applications >
    Sound & Video > RealPlayer 11. A simple setup wizard will appear, which will have
    no trouble with your own, because all you really have to do is click the button
    in the bottom-right corner of the window a few times. Once you have completed
    the wizard, the RealPlayer window will appear.'
