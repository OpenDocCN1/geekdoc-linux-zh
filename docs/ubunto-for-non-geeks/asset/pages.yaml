- img_proc: true
  md: '# Project 16A: Installing Support for Encrypted DVDs


    As I already mentioned, Ubuntu does not allow you to play encrypted DVDs from
    the start. For you to watch such DVDs (and that would be the vast majority of
    them), you need to install a whole bunch of stuff, most crucially, the package
    libvdread4. Fortunately, if you installed the audio support files I mentioned
    in Chapter 14, you''re halfway there. If you didn''t install them or if you just
    want to double-check, start by running the Ubuntu Software Center, and then make
    sure you have those files and a few useful others installed. If anything is missing,
    install it here. Here''s what you need to have:


    +   - gst-plugins-base

    - gstreamer0.10-plugins-good

    - gstreamer0.10-plugins-ugly

    - gst-ffpeg

    - libvdread4


    Now you''ve come to the final and essential step required for this project. For
    this task, you''re going to have to turn the trusty ol'' Terminal (Applications
    ► Accessories ► Terminal). Once the Terminal is open, type the following command,
    and then press ENTER:


    ```

    sudo apt-get install libvdread4

    ```


    With just about any application, you would be done at this point, but libvdread4
    requires you to also run an installation script that comes in order to fully get
    the job done. Run the script, go back to the Terminal, type the following, and
    then press ENTER:


    ```

    sudo /usr/share/doc/libvdread4/install-css.sh

    ```


    Once the Terminal returns you to the user prompt, the process will be done. Try
    putting a DVD in your drive—Totem should open and start playing the DVD. (You''ll
    learn more Totem soon.) If it doesn''t work, open the Ubuntu Software Center,
    and check to make sure all the support plug-ins listed earlier are installed.
    If everything is there, go back to the Terminal, and perform the last two steps
    again.


    # Can I Play Foreign DVDs?


    Your computer can play DVDs of any broadcast standard (NTSC, PAL, or SECAM) and
    of any regional encoding. This is a better setup than the DVD player you have
    hooked up to your TV, because the vast majority of stand-alone DVD players in
    the United States (I would venture to guess 99.9 percent) do'
  merge: -1
  pgno: 323
- img_proc: true
  md: 'not allow you to play anything other than Region 1 NTSC (NTSC being the broadcast
    standard in the United States and what its televisions are designed to display,
    while the DVD drive is 1). This information is usually provided on the back of
    DVD packages (see the examples in Figure 16-1), though the packaging for most
    discs produced for the U.S. market does not include it.


    ![](img/add8efd602aad9815ee8abf27a7a293e_324_0.png)


    Figure 16-1: Examples of regional encoding labels on DVD packages


    Despite the wonderful everything-goes nature of your computer in DVD playback,
    there is a serious caveat to bear in mind. Depending on the manufacturer of your
    DVD drive, you will be able to switch back and forth between DVDs of differing
    regional encodings only four or five times. That the drive will be locked into
    the regional encoding of the disc you are playing at time ... forever. This is
    unrelated to your operating system—it is strictly a hardware matter. The only
    exception to this region-lock is those DVDs labeled Region Free or ALL (Region
    0), which can be played on any DVD player in any region and thus not register
    as a regional switch when you plug one of them in your computer''s drive.


    If your drive eventually locks into one regional encoding, especially one for
    which you have few DVDs, there is some good news. That comes in the form of Videolan''s
    libdvdcss2, the library that is included in the libdvdread4 package installed
    in Project 16A. The libdvdcss2 allows you to play back encrypted DVDs. In addition
    to that function, it allows you to play DVDs from multiple regions even if your
    drive is already locked into one region. It does this by performing a cryptographic
    attack (attack to drive) until it can find the disc key for that drive. Of course,
    this process of cryptic bombarding can take several minutes, so it is not the
    optimal way of getting things done. It is better than being stuck, Whether this
    process of bypassing regional encodings remains a subject of debate, so if you
    are concerned about such things, you should do a little research.


    # Totem Movie Player


    The default video player in Ubuntu is Totem, which as you can see in Figure 16-2,
    has a very simple interface that makes using it equally simple. You can run Totem
    by selecting Applications › Sound & Video › Movie Player. You can also run it,
    as you have learned, by simply placing a DVD in your drive, because Ubuntu is
    set up to run Totem any time you do so.'
