    # TUX ROCKS


    Music à la Linux


    ![](img/add8efd602aad9815ee8abf27a7a293e_292_0.png)


    It''s now time to move on to the audio side of things. Yes, Linux does indeed
    rock, and in this chapter you will find out about musical talents that your system
    possesses. You will learn how to rip CDs, create MP3 and Ogg Vorbis files (files
    that you can recognize by their .mp3 and .ogg filename extensions), add album
    cover art, change file tags, play music files, and burn files onto audio CDs that
    you can play in any CD player. You''ll also learn how to play a variety of audio
    streams. If you''re interested in learning how to work with your iPod, iPhone,
    or other digital media device, or how to convert audio files from one format to
    another, well, you''ll have to wait until Chapter 15.


    # Audio File Formats


    Before we go any further, it is probably best to discuss the various formats in
    which audio data can be stored on your computer. The de facto standards have been
    WAV (created by Microsoft/IBM and using the'
  merge: -1
  pgno: 292
- img_proc: true
  md: 'As computers underwent their evolution in the multimedia machines they are
    today, it became clear that something was going to be done about those disk-devouring
    audio files. Audio compression formats were thus developed. These compression
    formats work, to simplify things by cutting out the portions of sound signal that
    the human ear cannot hear—sort of a dog-whistle approach. The most widely known
    and embraced of these audio compression formats is MP3. Audio files encoded in
    MP3 format can end up as little as one twelfth the size of the original WAV file
    without any noticeable loss in quality.


    Another audio compression format that was developed was Ogg Vorbis. Ogg Vorbis
    was a product of the open source community, so, unlike MP3, which has always been
    used under the shadow of yet-to-be-exercised patent rights, it was free of patent
    and licensing worries Because of that and the fact that it is the MP3 in quality
    and performance, Ogg Vorbis became the darling of the Linux community.


    As work with ripping audio files in this chapter, you are sure to notice another
    encoding option—FLAC. Free Lossless Audio Codec (FLAC) is an encoding format that,
    unlike the MP3 and Ogg Vorbis, does not remove any audio information from the
    audio file during the encoding process. The downside of this is that FLAC provides
    space savings of 30 to 50 percent, which is much less than the 80 percent achieved
    by MP3 or Ogg Vorbis. The upside, is, that the FLAC files should be equivalent
    to CDs in terms of quality.


    Given retention of audio quality, FLAC becomes an ideal choice if you are not
    satisfied with the quality provided by Ogg Vorbis or MP3 files . It is also a
    good choice if you want to create both Ogg Vorbis and MP3 files or if you just
    don''t know which one you want to work with. In such cases, you can just rip the
    file and encode it in FLAC format. As I mentioned earlier, once you get to Chapter
    15, you will learn how you convert the FLAC file later, when you know what you
    want or need.


    # Project 14A: Installing MP3 Support for Audio Apps


    All that talk about Ogg Vorbis and FLAC aside, there are still many people who
    like or need to deal with MP3 files. You may, for example, already have numerous
    MP3 files ripped from your music collection, or you may enjoy listening to one
    of the many Internet radio streams that are broadcast in MP3 format. Unfortunately,
    MP3 playback and encoding support is not included'
  merge: -1
  pgno: 293
- img_proc: true
  md: 'in Ubuntu because of licensing concerns. Even if you plan on using the Ogg
    Vorbis format in your future ripping and encoding endeavors, installing MP3 support
    is a good idea so as to cover all your audio bases. It''s also a very easy process.


    The easiest way to install MP3 playback support is to double-click an MP3 file
    that you have on your hard disk. A window will appear, asking whether you want
    to search for the plug-ins to play the file. Click Search, after which another
    window will appear, showing you you need to install (Figure 14-1). Check both
    boxes in that window, click the Install button, and in the confirmation window
    that appears, click Confirm. You will then be asked for your password, provide
    it, and then just wait until the process is complete. Once done, you''ll be able
    to play not only your MP3 audio files but also MPEG and WMV videos.


    ![](img/add8efd602aad9815ee8abf27a7a293e_294_0.png)


    Figure 14-1: Ubuntu helps you find the plug-ins you need.


    If you prefer, you can download and install these plug-ins quite easily via the
    Ubuntu Software Center by doing a search for gstreamer and then installing gstreamer0.10-ffmpeg
    (Gstreamer ffmpeg video plugin), gstreamer0.10-fluendo-mp3 (Fluendo mp3 decoder
    Gstreamer plugin), and gstreamer0.10-plugins-ugly (Gstreamer extras).


    As MP3 encoding support, which enables you to rip CDs and create your own space-saving
    MP3 files, things aren''t automatic. But it''s not much of a chore, either, because
    all you need to do is use the Ubuntu Software Center to search for and install
    gstreamer0.10-plugins-ugly-multiverse. If you also want to give yourself AAC encoding
    ability, you should install gstreamer0.10-plugins-bad-multiverse as well. You
    will then be ready for action, as described in the next section.'
