  md: '# Installing Additional Wallpapers


    As you can see if you hover your mouse over it, the default wallpaper in Ubuntu
    is called Ubuntu. If purple blobs aren''t your style, click any of the other wallpapers
    to immediately change the wallpaper on the desktop. There are quite a few to choose
    from, but maybe you''d prefer to use some images of your own. These could be photos
    from a digital camera, works of art you created on your computer, or just anything
    you want to put there. In this case, however, you are going out onto the Web to
    get and then install some wallpaper.


    A number of sites provide free desktop wallpapers—two sites specifically geared
    toward Linux users are http://www.gnome-look.org/ and /art-gnome.org, but you
    can get wallpaper from wherever you like. Astronomy Picture of the Day (http://apod.nasa.gov/apod/)
    is a particular favorite of mine. If you want to follow along using the same bigger-than-tux
    wallpaper that I use here, however, go download the wallpaper by pinpointing your
    web browser to http://www.taibati.com/linux/0index.php, scrolling the page ad
    to the second TUX section and then clicking the download next to the image size
    that matches your screen. When the pictures appear in the browser window, right-click
    it, and then select Save As. In the Save Image window, give it an easy-to-remember
    name (wallTUX_1024.png may be exact, but it might prove a bit much to deal with
    a while), or use the one I gave it, mightyTux.png, and click Save. If you prefer,
    you can download any wallpaper you like from wherever like, as long as it is in
    a supported format, such as BMP, PNG, or JPEG. It''s all up to you.


    Once you''ve downloaded your wallpaper, move it to your Pictures folder. You may
    want to create a Wallpaper subfolder to keep things better organized, but that''s
    up to you. After that, you can install the new image by going to the Background
    tab in the Appearance preferences window and clicking the Add button. In the Add
    Wallpaper window navigate to your new wallpaper, click it to highlight it, and
    then click Open. The wallpaper will then appear highlighted in the Appearance
    window and will soon thereafter appear on the desktop (Figure 8-7). Once it does,
    click Close to complete the process.


    # Wallpaper from Internet to Desktop—Quick and Easy


    It''s also possible to automatically set an image from the Web as your desktop
    wallpaper by right-clicking that image within your web browser and then selecting
    Set As Desktop Background. A small window will then appear, in which you can preview
    what the download will look onscreen (Figure 8-8). You can also adjust the position
    (tiled or centered, for example) and background color for your desktop in this
    window. Once you''re done making adjustments, click the Set Desktop Background
    button. The image will then appear on your desktop, while the image file will
    be saved to a location (your home folder, by default) with the title Firefox_wallpaper.png.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '![](img/add8efd602aad9815ee8abf27a7a293e_163_0.png)


