    was a Visual Effects section. Those, visual effects aren''t for the videos you
    play but are visualizations to accompany your audio files when played via Totem
    (Figure 16-3). Totem not only does video but it also does audio. In fact, it is,
    somewhat oddly, the default audio player for Ogg Vorbis and MP3 files in Ubuntu.
    Just double-click one of those files, and sure enough, Totem will be the application
    that pops up, blasting your ears'
