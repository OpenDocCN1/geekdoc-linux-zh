  md: '# 5


    # SLIPPING AND SLIDING


    Exploring the Internet, Linux Style


    ![](img/add8efd602aad9815ee8abf27a7a293e_90_0.png)


    Now that you have a working Internet connection, what can you do with it? The
    good news is that Linux can match anything that your previous operating system
    could do online, and in many cases it can do it faster or more easily. Ubuntu
    was born on the Web, and so it should be no surprise that it comes with a very
    healthy suite of Internet-ready applications right out of the box.


    In this chapter, you''ll take a tour of Ubuntu''s Internet software so you can
    start really getting a feel for what this Linux stuff is capable of. You''ll begin
    with old stalwarts like the web browser and email client, tour through instant
    messaging, and then head off in the more modish direction of Twitter and microblogging.'
