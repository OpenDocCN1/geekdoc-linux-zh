  md: '# # Software Installation Problems


    Ubuntu''s software management tools tend to operate pretty smoothly these days.
    Nevertheless, I''ve included some troubleshooting tips for two or three problems
    that used to be common (but seem to getting rarer with each release). If you''re
    having a problem with installing, removing, or updating packages, this section
    is for you.


    # ## I get an Error About Unauthenticated Packages


    If you get an error message about unauthenticated packages when you try to install
    a program, try the following:


    +   1. Select System ▸ Administration ▸ Update Manager to open the Update Manager.

    2. Click the Check button, and enter your password if prompted. The package list
    will be updated, along with all the files that are used to check whether your
    packages are “authentic”.

    3. When it has finished updating the package list, close the Update Manager, and
    try to install your program again.


    If you''re still getting the error message, you may have added a software repository
    without adding its GPG key. The GPG key is required to do the authentication stuff
    that the error message is talking about. If this is the case, look at “Adding
    Extra Software Repositories” on page 86 for instructions how to add the GPG key
    for a repository.


    # ## I get a dpkg error


    There are couple of common reasons why you might get an error message related
    to dpkg when you try to install, update, or remove a software package.

    If you get an error saying E: Sub-process /usr/bin/dpkg returned an error code
    (1), you could have a broken package on your system. Here are some techniques
    you can use to fix a broken package:


    +   1. Select Application ▸ Accessories ▸ Terminal to open a Terminal.

    2. Try sudo apt-get install --fix-broken, and press ENTER. Type your password
    when prompted, and press ENTER again. This command looks for broken packages and
    tries to fix them.

    3. With any luck, this will fix the problem; try installing a package via the
    Ubuntu Software Center to see whether you get the dpkg error message.

    4. If you still get the error message, type sudo dpkg --configure -a into the
    Terminal, and press ENTER. This command tries to fix half-installed packages.

    5. Try installing a package from the Ubuntu Software Center. If you''re still
    getting an error message, ask for help on the Ubuntu forums.'
  merge: -1
  pgno: 430
- img_proc: true
  md: 'If you get an error message E: Could not get lock /var/lib/dpkg/lock - open
    (11: Resource temporarily unavailable) or E: Unable to lock the administration
    directory (/var/lib/dpkg/), you are probably running more than one package manager
    (APT frontend) at the same time (see the note at the end of Chapter 6). For example,
    if you are installing a package using the apt-get command in a Terminal while
    simultaneously installing a program with the Ubuntu Software Center, you will
    get this error message.


    Wait until one of the package managers finishes what it''s doing, and then close
    it and try to use the other one. If no other package managers are running, you
    won''t get this error message. If you don''t have any other package managers running,
    the Update Manager could be running in the background and causing the problem.
    Wait for a few minutes for the Update Manager to finish what it''s doing and then
    try again.


    # I Have a Broken Update


    If you update your computer using Update Manager but receive an error message
    saying that you have a broken update, try the instructions in "Get a dpkg error"
    on page 39 to fix the problem. If that doesn''t work, try asking on the Ubuntu
    forums for help—there may be a bug in the package that was updated when the error
    occurred.


    # Common Problems with Applications


    So many applications are available for Ubuntu that it would be impossible to go
    through each one and point out what might be possible, some day, go wrong. Instead,
    in this section I''ve chosen to provide some general advice on how to deal with
    misbehaving programs, plus a sneaky little on a particularly common Firefox problem.
    If it is something specific that you need to handle, it''s never a bad idea to
    try looking at the help files for a given program. Selecting Help > Contents could
    get you to a manual for most software. A quick search often does the trick for
    me.


    # Firefox Says It''s Already Running


    When you exit Firefox, it sometimes takes a while to itself down properly—the
    window will disappear, but Firefox could still be running somewhere in the murky
    depths of your computer. When you try to open Firefox again, you may receive a
    message that Firefox is running in the background, so you can''t open a new window.
    This is not good, because you want a window that you can see! If this happens,
    open a Terminal (Applications > Accessories > Terminal), type kkill111 firefox,
    and then press ENTER. (The command is sensitive, so be sure you''re typing in
    all lowercase). This will force Firefox to shut down immediately. With done, try
    to open Firefox again, and the window will pop up as normal. If it still isn''t
    working, try repeating the previous command one or two more times.'
