    # # Lost Files


    Losing an important file is one of those uniquely frustrating experiences in life.
    If you''ve looked in all of the most likely locations (like your home folder),
    try one of the following:


    +   * **Recent Documents** Select Places ▶ **Recent Documents** to see whether
    the missing file is in the list of recently edited files. If it was an office
    document, try the **File** ▶ **Recent Documents** menu in OpenOffice.org.

    * **Basic search** The basic Search for files is useful only if you can remember
    part of the file''s name. Select **Places** ▶ **Search**, type part of the file''s
    name in the Name contains, and click Search. It might turn up in the list of search
    results.

    * **Heavy-duty search** The more advanced Tracker search tool can look inside
    documents, which is handy if you don''t remember the file''s name but you remember
    some of its contents. Install the Tracker Search Tool from the Ubuntu Software
    Center, and select **System** ▶ **Preferences** ▶ **Search and Indexing**. Check
    the **Enable indexing** option on the General tab, and click Apply. Click Restart
    in the warning window that appears, and wait for Tracker to build its search index
    (about 15 to 20 minutes) to finish. When it has, select **Applications** ▶ **Accessories**
    ▶ **Tracker Search Tool**, and search for your lost file there.'
  merge: -1
