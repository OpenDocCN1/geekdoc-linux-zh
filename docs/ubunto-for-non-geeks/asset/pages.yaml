    # ## My Microphone Doesn’t Work


    As long as your sound card is detected correctly by Ubuntu, any microphone with
    a standard audio jack connection (similar to the connector on-headphones) should
    work.


    To test your microphone, select **System > Preferences > Sound** to open the Sound
    Preferences window, and then go to the Input tab (Figure 21-8). You’ll see an
    Input level indicator, which should dance up and down when you make a noise. If
    nothing happens to the indicator your microphone isn''t being picked up, so try
    some of the following tips.


    +   **Plug it in** Check that the microphone is plugged into the correct socket
    (it should be marked by a small microphone symbol and is often pink). Also, be
    aware that some sound cards can switch inputs and outputs between different sockets,
    so what you think the microphone socket might have been assigned to something
    else. In that case, try plugging the microphone into the other sockets.


    +   **Turn it up** Go back to the Input tab in the Sound Preferences window, and
    turn up the Input volume as high as it will if necessary. If your sound card or
    microphone has a volume control, make sure that that is turned up too.


    +   **Check that it’s not muted** Also on the Input tab, make sure that the Mute
    option next to the Input volume control is not checked.


