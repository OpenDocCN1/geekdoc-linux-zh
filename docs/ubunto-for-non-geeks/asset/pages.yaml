  md: '# 9C-5: Creating a Launchable Link for Briscola


    Even though you''ve moved Briscola to a global location, you still can''t run
    it with a simple one-word command because briscola.tk file is not in the system''s
    command search path. Just as you did for pyWings, you will now create a launchable
    link for Briscola to solve that problem. Here are the steps:


    +   1. In the Terminal, type cd /usr/games, and press ENTER.

    2. Now create the link by typing sudo ln -s /usr/share/games/briscola/briscola.tk
    link, and press ENTER.

    3. Type cd, and press ENTER to return the Terminal to your home folder.


    You can now easily run Briscola by typing briscola in the Terminal and pressing
    ENTER.


    # Can You Do the Same Thing with pyWings?


    Sure. If you want to move pyWings to a global location, just follow the same procedure
    for moving the pyWings folder and creating the link as you did for Briscola, making
    the necessary substitutions, of course. You will have to remove the previously
    created pyWings link, though, by typing the following command and pressing ENTER:


    ```

    sudo rm /usr/games/pywings

    ```


    After that, move the pywings to global territory by typing sudo mv ~/LocalApps/pywings/usr/share/games/pywings
    and pressing ENTER. When prompted for your password, type it, and then you can
    create the launchable link by typing cd /usr/games, pressing ENTER, typing sudo
    ln -s /usr/share/games/pywings.py pywings, and pressing ENTER once more.


    # Playing Briscola


    As I already mentioned, Briscola is—about easy as a card game as there is. It
    is a trick-taking game, where you put out a card and then your opponent puts out
    a card, and the one who puts out the higher pointvalue card wins the hand, or
    trick. Points are awarded on the basis of the cards involved in that trick, meaning
    that the winner puts out his or her card first the next time around. When all
    the cards are played, the points for each player are tallied, and the player with
    the higher points wins. It''s much simpler to do than it is to describe.


    # Want to Know More?


    If you would like a more detailed set of rules for playing Briscola (and just
    about any other card game in the world), check out http://www.agat.com/'
  merge: -1
