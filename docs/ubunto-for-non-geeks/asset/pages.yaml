    # Linux Equivalents to Your Windows Applications


    Before going through the trouble of running Windows programs in Ubuntu, it''s
    a good idea to try some of the equivalent Linux applications. More often than
    not, there''s a native Linux program that will do exactly what you need, without
    any of the headaches involved with running an application designed for another
    operating system.


    First, however you to find those Linux equivalents. Luckily, plenty of websites
    list good alternatives to Windows software: http://www.linuxalt.com/ and are quite
    comprehensive, Or, you can simply root around the Ubuntu Software Center, installing
    applications that tickle your fancy. After all, the best way to see whether a
    program is to try it!


    > Some Windows programs don''t have direct equivalents in Ubuntu, you might need
    to install a couple of programs to get similar functionality to your Windows software.
    In the rare cases where there aren''t any suitable alternatives, you can try using
    Wine or installing Windows in a virtual machine, which I''ll talk about.


    # Project 18C: Running Windows Programs


    In Chapter 6 you learned a host of ways to add applications to your system, but
    you may not have considered one other method—installing Windows applications.
    Despite there being Linux equivalents for most of the programs that you need,
    there may be one or two programs that you miss. Fortunately, it is possible to
    run Windows applications from Linux with the help of a program called Wine. The
    list of compatible software'
