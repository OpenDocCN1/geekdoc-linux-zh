- img_proc: true
  md: '# 8C-3: Installing TrueType Fonts Globally


    As I mentioned earlier, the font you just installed locally can be used only when
    you log in under your usual username. If, however, you want to install fonts that
    can be used by you and anyone else who has an account on your computer, the process
    is slightly different and will require a little “superuser” action. You can use
    the other font you downloaded for this part of the project.


    The folder for globally installed fonts is in root directory, so you will need
    to open the file browser as superuser in order to install the fonts. Superuser
    is another name for the root (administrative) user. It''s possible to run a program
    without root switching to a different user account by using a system sudo (more
    on this in Chapter 9), but since root can modify system files, you shouldn''t
    run a program in sudo mode unless you absolutely must.


    Here are the steps for getting your font file into the global directory:


    +   1. Press Alt-F2


    +   2. A File Browser window opens. Select File ▸ Create Folder to create a new
    folder; call it MyFonts.


    +   3. Open a normal File Browser (Nautilus) window by selecting Places ▸ Home,
    find the .ttf file you want to install, and copy it (for example, by right-clicking
    it and selecting Copy).


    +   4. Switch back to the typeface File Browser window, open your newly created
    MyFonts folder, and paste the font file into it.


    +   5. Be sure to close the superuser File Browser window—leaving it open is a
    recipe for disaster!


    > NOTE The gsudo command in Step 1 is the graphical environment version of the
    non-graphical sudo command that you will learn to use via the command Terminal
    in Chapter 9.


    Now you can test things by opening OpenOffice.org and looking for the font in
    the font menu. Remember that you will need to restart OpenOffice.org if it was
    already open when you installed the font.


    # Project 8D: Changing Your Login Screen


    There''s always a holdout. You may have gotten your desktop and windows looking
    just the way you like, but the screen that''s displayed when you log in hasn''t
    changed one bit—it''s the same old default theme, with the same old default background.
    It''s time to give it a makeover.


    The login screen, also known as the greeter, is shown to everyone who has a user
    account on your computer, so you might want to check with others before making
    some of the cosmetic changes. If you''re the only person who uses the computer,
    then ask yourself for permission and carry on.'
  merge: -1
