    # Dual-Booting: Changing the Boot Order and Timeout


    If you choose to install Ubuntu alongside Windows in a "dual-boot" setup, you''ll
    be used to seeing the GRUB boot menu screen now (Figure 18-4). This is the screen
    that appears when you start up your computer and gives you the option of running
