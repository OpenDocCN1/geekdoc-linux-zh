    # A Couple of Other Bits You''ll Be Using


    This is as good a place as any to introduce two more commands that you will be
    called upon in this chapter and elsewhere in the book: ln and tar. You don''t
    need to practice with these, because you will be using them very soon, but you
    might as well know what they are all about.


    # $ ln


    Use the ln (link) command to create a link file that launches or activates another
    file located in a separate folder. This is very useful when trying to activate
    a file that is buried deep in the subfolder of a subfolder of a subfolder somewhere
    on your hard disk. The command is often used with the -s (symbolic) flag, which
    performs essentially the same thing as the shortcut you''ve come to know in Windows
    or the alias on the Mac.


    The easiest way to use the ln command is to first use the cd command to change
    the Terminal''s location to the folder where you want to place the link. Then
    you can type the ln command on the command line, followed by the path of the file
    to which you want to link. For example, let''s say you want to put a link in your
    home folder for an OpenOffice. Writer file of your autobiography called myLife.odt.


    The file is pretty well buried in a nest of subfolders deep within your home:
    /home/username/Documents/personal/self/autobiography/myLife.odt. To create the
    link, you would open a new Terminal window, type the following command string,
    and press ENTER:


    ```

    ln -s Documents/personal/self/myLife.odt

    ```


    Once you are finished, the link will appear in your home folder as an icon matching
    the original file in appearance, albeit pointing an arrow to signify that it is
    a link.


    # $ tar


    In Chapter 7 you learned to create and extract archives, or tarballs, but did
    you know that you can also create and extract tarballs with the command line?
    The tar command is your key to doing this.'
