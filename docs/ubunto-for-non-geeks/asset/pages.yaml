- img_proc: true
  md: '# Method 1


    You can add a launcher to the panel in a number of ways, but let''s start with
    the most conventional. To add a panel launcher for OpenOffice.org Writer, follow
    these steps:


    +   1. Right-click any open space within the top panel.

    2. Select Add to Panel in the pop-up menu to open the Add to Panel window.

    3. In that window, select Application Launcher, and click the Forward button that
    appears.

    4. A new screen will then appear, showing the contents of the Applications menu
    (Figure 3-7). Click the + next to Office to expand that menu, and then scroll
    down and click OpenOffice.org Word Processor to highlight it.

    5. Click the Add button, and then click Close to complete the process.


    ![](img/add8efd602aad9815ee8abf27a7a293e_63_0.png)


    Figure 3-7: Adding an application launcher to the panel


    # Method 2


    There''s another way to add program launchers to the panel that is actually a
    tad quicker. As an example, you''ll add a launcher for the OpenOffice.org spreadsheet
    program, Calc. Here are the steps:


    +   1. Go to the Applications menu, and navigate your way to and right-click Office
    ▸ OpenOffice.org Spreadsheet.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '2. In the pop-up menu that then appears, select(that''s the usual ol'' click)
    Add this launcher to panel (Figure 3-8). The spreadsheet launcher will then appear
    in the panel.


    ![](img/add8efd602aad9815ee8abf27a7a293e_64_0.png)


    Figure 3-8: Another way to add application launchers to the panel


    # Method 3


    Now that you''ve learned two ways to add application launchers to the panel, I
    might as well let you in on a third, even easier method. Just open a menu, select
    the item you want to add to the panel, and drag it there. Well, it can''t get
    much easier than that, eh?


    # 3A-4: Changing Panel Launcher Icons


    You may think your two program launchers are somewhat plain, and therefore, it
    is rather difficult to distinguish one from the other. Fortunately, you can change
    the icon for any launcher quite easily. To learn how to do it, I''ll address any
    immediate concerns with the OpenOffice.org launchers. Here''s what you need to
    do:


    +   1. Right-click the first program launcher you added (the word processor),
    and select Properties from the pop-up menu.

    2. In the Launcher Properties window that then appears, click the OpenOffice.org
    Word Processor icon, which will open a Choose an icon window.'
