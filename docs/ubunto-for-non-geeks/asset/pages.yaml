  md: '# 9


    # SIMPLE KITTEN WAYS


    Getting to Know the Linux Terminal and Command Line . . . and the Cool Things
    It Can Do


    ![](img/add8efd602aad9815ee8abf27a7a293e_186_0.png)


    Many people shy away from Linux because they envision it as a system for compu-geeks,
    an environment in which you do everything the hard way—by command line. In this
    era of graphical interfaces, the idea of typing commands to get things done seems
    like a dreadful throwback to the days of DOS, and puts many people off, especially
    those who remember what it was like in the “old days.”


    This reaction is fair enough, but it is not really an accurate reflection of the
    reality of the Linux world. After all, most Linux users today utilize some sort
    of graphical interface. They can, and often do, achieve all that they hope to
    achieve through drop-down menus and mouse clicks alone. Many are able to survive
    quite happily without ever once opening their Terminal. The same could be true
    of you.'
  merge: -1
