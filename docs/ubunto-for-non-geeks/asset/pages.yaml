    all this will be different in your case, because your username and computer name
    will be different. If your username is `frog` and your computer''s name is `wetrock`,
    for example, the command line you see `frog@wetrock~$`. If all this is sounding
    rather obtuse to you, just think of it this way: `username@computer_name:$` in
    the Terminal is the equivalent of your home folder in Nautilus.


    Typing in the Terminal is straightforward enough; you just type as you usually
    do. You can also delete and insert letters or phrases using the DELETE and BACKSPACE
    keys and the arrow keys. For practice, try the following:


    +   1. Type **I like strawberries** very much.

    2. Change strawberries to cherries (because cherries are, in fact, so much better).
    Use your left arrow key to move the cursor in front of the first s strawberries.

    3. Tap the DELETE key as many times as necessary to erase the word strawberries
    (uh, that would be 12 times, methinks).

    4. Type cherries, and then use your right arrow key to move the cursor back to
    the end of this meaningful sentence.


    Now that you''ve completed this fascinating bit of typing practice, press the
    ENTER key. As you will immediately immediately, the Terminal''s response to your
    efforts thus far is merely a dismissive I: command not found. Although you typed
    a string of text that has meaning to you, it means absolutely nothing to your
    system. In fact, the system was so shortsighted that it could see nothing but
    the first word you typed in the Terminal (I); and because I is not a valid command,
    the system had no idea what to do with it.


