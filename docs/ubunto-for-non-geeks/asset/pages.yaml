  md: '# Strategy Games


    I enjoy first-person shooters, but my reaction times aren''t quite up to scratch.

    If the thought of running around a virtual world and shooting at things leaves
    you feeling cold (or clumsy), perhaps a strategy game is more your style. There
    are plenty of I''d mention these waiting to be discovered in the Ubuntu Software
    Center, but I thought I''d mention a couple of good ones here.


    Warzone 2100 (Figure 17-10) is broadly similar to the Command and Conquer series
    of games. You start off on a battlefield with a small collection of vehicles,
    which you must command to build a base and defend it from enemies. Once your base
    is in good shape, you can build new units and send them to attack your foes. Your
    opponents are doing the same, however, so battles can turn into subtle tactical
    affairs where your ability to launch successful attacks must be balanced against
    the limited availability of resources and the constant threat of your base being
    destroyed.


    ![](img/add8efd602aad9815ee8abf27a7a293e_344_0.png)


    Figure 17-10: Warzone 2100


    If you''re struggling to find the time to mastermind an entire military campaign'
