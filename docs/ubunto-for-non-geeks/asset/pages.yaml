  md: '# # Shutting Down


    Now that you know your desktop environment well, you may feel like calling it
    a day and shutting down your machine. To do so, just click the Quit button at
    the far-right corner of the top panel (it looks like a power button). A menu (Figure
    3-17) will appear with choices to: Lock Screen, Guest Session, Switch from rg
    (whatever your username happens to be), Log Out, Suspend, Hibernate, Restart,
    and Shut Down. Hibernate is not an option when running a live session from Ubuntu
    Desktop. Select Shut Down, and a small window will appear to confirm your decision.
    Click Shut Down, and the shutdown process will begin. If, however, nothing seems
    to happen within a few seconds, press CTRL-ALT-DELETE to open the Shut Down Computer
    window (Figure 3-18). In that window, click Shut Down, after which shutdown will
    come complete.


    The actual shutdown will take a few seconds as the system closes its various services.
    When it is all done, the system will power down your computer as, in which case
    you are done. On a few machines, however, the system might not be able to power
    down your machine. You will know whether this is so in your case because all screen
    activity will come to an end. If you get to that point and nothing happens for
    15 seconds or so, then just power down the machine manually by pressing the power
    button. It is completely safe to do so at that point.


    ![](img/add8efd602aad9815ee8abf27a7a293e_74_0.png)


    Figure 3-17: GNOME''s session menu options


    ![](img/add8efd602aad9815ee8abf27a7a293e_74_1.png)


    Figure 3-18: Press CTRL-ALT-DELETE in unison brings up the Shut Down the Computer
    window'
