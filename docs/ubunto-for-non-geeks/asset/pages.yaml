- img_proc: true
  md: 'One final note: Remember all that business about authentication and GPG keys?
    It was related to a security measure that checks whether packages are from where
    they''re from. (In theory, it''s possible that someone could hijack a repository
    and put harmful packages in there.) If you don''t add the GPG key, the Ubuntu
    Software Center will refuse to display any of the packages from the repository
    since it won''t trust it. Having the GPG key isn''t enough to keep you completely
    safe from nasty surprises, you should always exercise caution when using a third-party
    (that is, non-Ubuntu) repository; make sure it''s trustworthy before you add it.


    # APT-URL: Installing from Websites


    Now that you''ve added GetDeb to the list of software repositories, you can take
    advantage of another APT frontend. Go to http://www.getdeb.net/, and click the
    Apps tab. Peruse the list of programs until you find something agreeable—I chose
    a time management application called hamsterapplet—and click Install now, see
    just below. You can now click a link on a website to install software, without
    needing to visit the Ubuntu Software Center! A Launch Application screen will
    appear with the apt selected—click OK, and enter your password if prompted. Then
    you will be shown a window that looks like the one in Figure 6-9; click Install,
    and wait as the downloading-and-installing activity carries on. When it''s all
    over, hit Close in the window that appears, and find your program in the Applications
    menu (or wherever it ends up). Quick and easy.


    ![](img/add8efd602aad9815ee8abf27a7a293e_119_0.png)


    Figure 6-9: Installing a package from a website with APT-URL


    Plenty of websites support APT links, but you won''t be able to download software
    from them unless you''ve added your repository to your computer, like did with
    GetDeb. If the link is for a program that is already available in the Ubuntu repositories,
    however, this can be installed as normal, without any further messing around in
    Software Sources.


    # Project 6B: Installing Software from a PPA: OpenSonic


    Many Ubuntu enthusiasts catch the programming bug and decide to come up with their
    own software. There are all sorts of little programs out there that someone has
    written to scratch an itch of theirs, and plenty of them are available to you,
    for free, if you know where to get them. Luckily, most of them can now be found
    in personal package archives (PPAs) on Ubuntu''s'
  merge: -1
