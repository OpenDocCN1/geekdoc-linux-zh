    # # Tabbed Shell Sessions in the Terminal


    To wrap things up in this chapter, I thought I might mention one particularly
    convenient feature of the GNOME Terminal: tabs. Just as you can view multiple
    web pages in one Firefox web browser window through the use of tabs, tabs in the
    Terminal application allow you to have more than one shell session running at
    the same time without having more Terminal windows open (see Figure 9-21). This
    reduces the amount of desktop clutter and generally makes things easier to deal
    with. You can open a new tab in the Terminal by going to the Terminal and selecting
    File Open Tab.


