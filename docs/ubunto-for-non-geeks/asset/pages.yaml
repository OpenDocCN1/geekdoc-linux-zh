  md: '# ABOUT THE AUTHORS


    # Rickford Grant


    My computing life began long ago, in the Commodore/Atari days. No doubt inspired
    by Alan Alda''s television commercials at the time, I purchased my first machine,
    an Atari 600XL with a cassette drive for storage and 16KB of RAM—more than I thought
    I would ever need. Most of my time on that machine, I must admit, was spent playing
    cartridge-based games and transcribing pages and pages of machine code from the
    now-defunct magazine Antic to create even more games. Eventually, my interest
    in computers increased, especially after seeing my first (and actually the first)
    Macintosh at the UCLA bookstore. The very-in-face nature of the Mac''s operating
    system caused me to become an operating system maniaciac. To date, I have worked
    with a lot of different operating systems, including Mac OS up to and every Windows
    version from 3.1 to 7, and even IBM''s forgotten OS/2.


    Though tempted to join the Linux fray, I continued to steer away from it for a
    long time I could not help but see, as so many others do, a system for never-seen-the-light-of-day,
    late-night Dr Pepper-drinking, Domino''s-pizza-eating compu-geeks. However, when
    I moved to Japan and was suddenly surrounded by machines loaded with Japanese
    versions of Windows, I encountered numerous problems, especially language constraints.
    Since everything, including Help files, was written in Japanese, I ended up'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'using only a fraction of the full potential of most software. Then there were
    those annoying Windows-type problems, such as the constant freezes and restarts
    and the system slowdowns, which were eventually remedied by reinsting the system.
    Getting the software I wanted to do the things I wanted to also took it off my
    wallet, and I began to rethink my initial resistance to Linux. With Linux''s multilingual
    support, system stability, and extensive and free software packages, were plenty
    of incentives for me to get over my preconceived notions about the oddball, Linux
    user.


    After a few failed attempts at getting Linux to work on my computer, my Frankenstein-like
    collection of junk I finally succeeded with a CD-based Knopix distribution, which
    worked well enough to reel me in a little further. I moved on to Mandrake (now
    known as Mandriva), since that was claimed to be the most newbie-friendly version,
    and then I tried SUSE as well, which I found to be rather quirky. I tried Red
    Hat and stuck to it because I, like most others, do not want more grief than necessary.


    I started off with my three desktops at work and home as dual-boot systems running
    Linux and Windows, and I gradually found myself using only Linux. Although I expected
    to encounter numerous limitations in Linux that would force me to return to Windows,
    instead found that I had actually increased my productivity. Other than lack of
    support for Windows streaming, I was actually able to do more because of the extensive
    software that was now installed on my machine. Without having to fork out money
    I could afford to spend, I was able to manipulate my digital images, rip songs
    from CDs, create drawings, create PDFs, and a variety of other things that I wasn''t
    able to do under Windows. It was a matter of time before my dual-boot systems
    became Linux-only systems; I ceased to be a Windows user.


    Since those early Linux days, I have gone on to try a number of other distributions,
    including AMD, Xandros, Dann Small Linux, and more recently, I am happy to report
    that things have continued to get easier to work with better, and my early frustrations
    I suffered with this machine or that piece of hardware have become more and more
    a thing of the past. Best of all, with more distributions being available as free
    CDs, which allow you to try Linux before you actually install it, you do not even
    have to take a leap of faith to get started.


    Of course, getting started in the world of Linux can be a bit intimidating, especially
    when you don''t have anyone around to help you out. In fact, I actually started
    writing this book as a primer on Red Hat 9 for my mother, whom I had given one
    of my computers with Red Hat installed. At that time, I was not planning on writing
    a book at all; it was just that there really weren''t any books out there with
    average users in mind. The books available then were all more or less geek-oriented,
    and as such, they would not do for the matter. I thus created a somewhat elaborate
    instruction set that would tell her everything she might want to do on the machine
    in a way that she could understand.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'My auntie caught hold of the "manuscript" and decided that I must try to publish
    it. I responded with the obligatory, "Yeah, right," putting it out of my mind
    for a while. My auntie, being a rather persistent character, however did not relent,
    and so I moved to quiet her by submitting my book for publication. A rejection
    slip would do the trick; however, did not get a rejection slip, and instead my
    first book, Linux for Non-Geeks, based on Fedora Core I, was born. I later switched
    to Ubuntu, and the Non-Geeks line followed along with Non-Geeks.


    I continued with two subsequent editions of the Ubuntu books, my new job was making
    it harder and harder to devote the time necessary to keep the world up-to-date
    and up-to-snuff and get it all written in a rather limited timeframe. It seemed
    time to bring in a coauthor to keep things moving. Enter Phil Bull. Phil was the
    technical editor on the third edition of Ubuntu for Non-Geeks, and because of
    his familiarity with the work on Ubuntu documentation, he seemed a perfect candidate
    for the job. The fact that he lives closer than to Stanage Edge, where imagine
    myself one day standing, the Keira Knightley Pride and Prejudice poise, didn''t
    matter either.


    Since recus came aside, having Phil on the project has us to not only update the
    book so as to reflect changes in the system and applications, but also expand
    it to cover changes in available technology and hardware to address suggestions
    from readers of past editions. These changes, I believe, have an even more well-rounded
    volume than before—a book that even better serves the original purpose of the
    series: helping you get into the world of Linux easily and comfortably.


    # Phil Bull


    I worked as the technical reviewer on the previous edition of Ubuntu for Non-Geeks.
    This time around, Rickford and Bill felt the book could use some fresh input and
    asked me to coauthor. I was happy to oblige!


    So, what''s my background? Computers have taken up most of my free time since
    I was eight years old. I started playing games on my uncle''s old DOS machine,
    and soon found myself ripping apart my PC and putting it back again just to see
    how it worked. The geekiness doesn''t stop there; I taught myself to program using
    Microsoft Word and Visual Basic for Applications (vba) when I was 14, and I worked
    in technical support for a few years. However, physics became my life at the end
    of school, and now study cosmology full time. I haven''t completely forsaken computers,
    though; it turns out that numerical simulations are pretty important in my line
    of work, and I currently spend a lot of time simulating particle collisions on
    an eight-core Mac inexplicably namedPier.


    My Linux journey started off an old copy of PC Pro from 1999. There was an article
    on this weird, alien-looking operating system in there, and I knew I had to try
    it out. Unfortunately, my dial-up modem balked at the prospect of downloading
    a 650MB file, so I had to wait until some time around 2004, when a friend sent
    me a Xandros Linux CD.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'rest, as they say, is history: I rapidly migrated to Fedora, and then settled
    down with Ubuntu in 2006. Not long after, I started writing documentation for
    Ubuntu, a pastime that I''ve kept up since. I just love to figure out problems,
    and writing clear, understandable instructions for people feel more productive
    (often, more challenging!) than the crossword.


    Writing this book with Rickford is, in many ways, the culmination of the last
    decade or so of my computing life, and you''ll find my contributions to this volume
    free, easy to read, and above all useful. In the rest of this section, I''ll explain
    the changes I made and the logic behind them.


    All manner of online activities, formerly the preserve of hard-core nerds, are
    now part of the non-geek''s daily routine, so I''ve given our coverage a significant
    overhaul to reflect this. New in this edition is an introduction to social networking
    with Twitter and Gwitter, setup instructions for "3G" broadband connections, and
    extra tips on using the Firefox browser.


    Ubuntu isn''t just a collection of software; there is a large, friendly community
    around the project, and everyone is invited to participate. This can be a little
    unexpected for those used to the rigid, corporate world of computer stores and
    support hotlines that most operating systems inhabit, but the "community vibe"
    is really one of Ubuntu''s killer features. I''ve tried to get message across
    in the new Chapter 20. You''ll learn about how the community works, what the community
    can do for you, and how you can join in and help out if you like. In particular,
    there''s lots of getting help and support via IRC and the forums.


    Computers go from time to time, so sometimes you''ve learned a few tricks to deal
    with Windows hiccups or Mac disasters over the years. experiencing a problem as
    a new Ubuntu user can be daunting, you may not have the experience to know how
    to handle it. To help you, I''ve included a whole new chapter of troubleshooting
    tips and tricks. Although some specific, common problems are covered, I''ve kept
    most of the discussion clear. The idea is to equip you with a problem-solving
    toolkit comparable to the one painstakingly built up over the years for your previous
    operating system, and I hope that by the end of Chapter 21 youll feel more confident
    if faced with an unexpected error or misbehaving hardware.


    One of the most common stumbling blocks for Linux newcomers is the first one,so
    we''ve really beefed up our coverage of it time around. A big chunk of Chapter
    21 is dedicated to solving problems, so you can feel more confident than ever
    to try out Ubuntu. There one new appendix (A) dedicated to installing from a USB
    memory stick, which is the method of choice for owners of networks and other computers
    lacking a CD drive. Hard partitioning is another out-cited source of bewilderment,
    so I''ve added another new appendix (C) with advice on how to partition your hard
    disk during installation,


    Once Ubuntu is installed, you may find that you miss certain aspects of your former
    operating system. For most people, former operating system is Windows, so I''ve
    added a new chapter (18) on getting Ubuntu and'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'Windows to play together nicely. There''s some enhanced coverage of Wine too,
    running Windows programs in Linux need no longer be a chore.


    This Ubuntu release comes with some big changes in the way you install applications.
    Things are much simpler now, to reflect this we consolidated pretty everything
    you need to know about software installation into Chapter 6. Gone are the ugly
    workarounds and complicated programs that were sometimes necessary to get a program
    installed; they''ve been replaced by safer, more elegant ways of doing things,
    like the Ubuntu Software Center, PPAs, and APT-URL.


    Finally, in response to the column, but erroneous, gripe say that there are "no
    games for Linux," Rickford and I have dedicated the whole of Chapter 17 to the
    state-of-the-art in Linux gaming. (Rumors that it was inserted purely so that
    we could goof off and play a bunch of games have been greatly exaggerated.) Don''t
    forget to check it out; we tried to include something for everyone.


    New material aside, we''ve been over the book with a fine-toothed comb to check
    that everything is accurate, up-to-date, and easy to understand. I hope you enjoy
    reading it. Oh, and one last thing . . . welcome to Ubuntu!'
  merge: -1
