  md: 'to alter this setting (it doesn''t affect how you use the partition in any
    way).

    The other option, Location for the new partition, lets you choose where on the
    disk to put the new partition. It doesn''t really matter, so leave this option
    set to the default quo.


    Click OK to finish adding the partition; it should appear in the list after a
    few seconds.


    # Editing Existing Partitions


    If you have an existing partition that you''d like to resize or change its mount
    point or filesystem, select it and click Change. An Edit partition window will
    appear (Figure C-4).


    The Use as Mount point options work in the same way as those in the Create new
    partition window. You can also check Format the partition if you''d like all the
    data on it erased you can start fresh. You have no choice but to format if you''re
    changing the filesystem of a partition (for example, from FAT32 to Ext4), so be
    aware of that.


    To resize the partition, use the New partition size in megabytes option. If you
    change the size and then click OK, you''ll be warned that the changes will be
    written to disk. Click Continue, the partitioner will start to resize the partition
    immediately—you can''t undo this change, so think carefully about you''ve chosen
    the right options before hitting Continue.


    ![](img/add8efd602aad9815ee8abf27a7a293e_447_0.png)


    Figure C-4: Editing a partition


    # Varieties of Partitions


    You''ll need to be familiar with a few varieties of partitions when manually partition
    your disk, I''ve summarized these in the following sections and provided some
    tips on choosing their size, mount points, and filesystems.


    # Root Partition


    You must have a root partition; it''s where important system files are stored
    and software is installed. I recommend making it at least 8GB in size, but for
    10GB to 15GB if you can leave room for installing new programs. If you''re not
    going to have a separate home partition (described in a moment),'
  merge: -1
  pgno: 447
- img_proc: true
  md: 'all of your files will be stored in the root partition too, so you should make
    it as big as possible to accommodate all your stuff in case. The mount point should
    be set to /and the filesystem to ext4.


    # Swap Partition


    You must have a swap partition. The swap partition is like an extra area of system
    memory (RAM); if your computer''s system memory gets full, it will start using
    this partition to handle the overspill. It''s also used to store the contents
    of your system memory (like of all open files and programs) when you hibernate
    the computer. See https://help.ubuntu.com/community/SwapFile/for more details
    on swap.


    As a rough guide, it should be a little larger than the amount of RAM that your
    computer has. For example, if you have over 2GB of RAM, make a 2.2GB swap partition.
    The filesystem should be set to swap area, and there''s no need to set a mount
    point.


    > It''s possible to get away without a swap partition by creating a swap file
    after you''ve installed Ubuntu. The method for doing this is beyond the scope
    of this book.


    # Home Partition


    The /home folder can be put in a partition. You don''t need to do this, but it''s
    useful if anything goes wrong and you need to reinstall Ubuntu—all your personal
    files and configuration settings will be left on the home partition while Ubuntu
    is reinstalled on the root partition. This can save a lot of work when restoring
    your system. If you don''t have a separate home partition, the /home folder will
    be put in your root partition with everything else. The way you access your home
    folder (for example, through the Places menu) will be exactly the same whether
    you put it on a partition or not.


    The home partition is where your files and settings are stored, so you''ll want
    to make it as big as possible. The filesystem should be ext4, and the mount point
    should be set to /home.


    # Windows Partition


    If you have Windows installed, you will need to resize the Windows partition to
    make room for Ubuntu. When you do this, sure to leave at least enough disk space
    for Windows to function properly. Windows XP needs at least 2GB in size, and for
    Vista and Windows 7 you should leave at least 16GB. You probably want to leave
    more space than this so that you can install programs and save files when using
    Windows, and remember to leave space for your existing Windows files too. The
    Used in the main partitioning window will tell you how much space your Windows
    files are currently taking up.


    Windows partitions will be of type NTFS or FAT32. Remember not to format the Windows
    partition, or your current installation of Windows will be erased.'
  merge: -1
  pgno: 448
- img_proc: true
  md: '# Shared Partition


    If you want an easy way to share files between Windows and Ubuntu, create a shared
    partition. In both operating systems, it will appear as a separate hard disk,
    which you can use to store whatever you like.


    Make the partition as big as you think you''ll need: If you only ever small files
    between Ubuntu and Windows, then 1GB to 2GB should be plenty; if you want to permanently
    store all your Windows and Ubuntu files there (sort of a shared home folder),
    make it as big as possible. You should choose FAT32 as the filesystem, but you
    can use almost anything for the mount point—/windows will be one of the default
    suggestions, but you could type something like /shared or /blackhole into the
    Mount point box if you liked. Just make sure you use a name without any spaces
    in it.


    # Example Partition Layouts


    Partitioning can be confusing if you''ve never done it before, I''ve provided
    a few example layouts that should make things clearer. In all of these examples
    I''ve used a 100GB hard disk, but you can scale all the partition sizes up or
    down for your disk according to the advice in "Varieties of Partitions" on page
    416.


    # Standard Ubuntu-Only Installation


    Only Ubuntu will be installed on the disk, only the root and swap partitions are
    needed (Figure C-5). Since I have 4GB of RAM, I made the swap partition 4.2GB.
    The root partition filled up the rest of the disk space to give me as much room
    for files and programs as possible. (There was no need to partition the disk manually
    in this case; the Ubuntu installer''s Erase and use the entire disk option would
    have achieved the same result.)


    # Ubuntu-only with a Separate Home Partition


    Only Ubuntu will be installed, but there will be a separate home partition to
    keep my data safe in case I ever need to reinstall (Figure C-6). I''m planning
    to store home files on this one, which means lots of very large files, so I went
    for a smallish 10GB root partition and a slightly undersized 4GB swap partition.
    This leaves lots more space for the home partition (and my videos), which takes
    up the remaining 86GB of the disk.'
