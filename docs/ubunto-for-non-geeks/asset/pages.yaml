- img_proc: true
  md: 'In this case, you can simply close the INSTALL file, because it prescribes
    the same steps I have listed next. However, in the future, when you install other
    programs from source, you will need to follow the instructions in the INSTALL
    files that come with the source files. However, with most INSTALL files, the instructions
    will match the process I am about to describe.


    Of course, it may well happen that you take a look at the contents of the INSTALL
    file and wonder what alien tongue is written in. In cases when you have no idea
    what the INSTALL file is going on about, just look for a configure file in the
    package folder. If you find one, you should be able to follow the instructions
    in this project.


    ![](img/add8efd602aad9815ee8abf27a7a293e_218_0.png)


    Figure 9-18: Identifying a package''s INSTALL file


    # 9D- Running configure and make for Xmahjongg


    Now that you have downloaded and untared the Xmahjongg tarball, installation is
    pretty standard. Here''s what you need to do:


    +   1. Open a Terminal window, and then move into the new folder by typing cd
    xmahjongg and pressing ENTER.


    The next step is part of setup phase that runs the configure script in the xmahjongg-7
    folder. The configure script checks what files, compilers, and other things it
    needs, and then searches your computer to see whether those things are there and,
    if so, where. Based on this information, it writes a file called amakefile, which
    is a set of instructions that will tell the make command in the subsequent step
    how to set up specifically for your system configuration.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '+   2. Configure the program by typing .configure and pressing ENTER.


    While you are running configure, you will see lots of and mysterious things flowing
    through your Terminal window; this is essentially a running account of what is
    going on, each step of the way. This can take a bit of time, but don''t worry.
    As long as the mysterious keeps flowing and you don''t get an error message at
    the very end of the whole process, all will be fine.


    When configure has done its thing, you will see your prompt again, and you can
    go on to the next step, which is the translation, or compilation, step. The make
    command reads the makefile created by configure to see how things needs to be
    set up on your machine. Then it proceeds to the compiler to translate the high-level
    source code into low-level, machine-readable files that can be installed in the
    subsequent step.


    +   3. To perform this translation, type make, and press ENTER.


    Again, you will be treated to even more mysterious text flowing through the window
    and a short wait, a tad longer than the configure process. Once make has done
    its job and you will see your prompt again, you are ready to install the program.


    Up to this point, you have not changed your system in any way. All the changes
    thus far have taken place in the xmahjongg-3 folder only—your system is still
    as much as the day you. Of course, all that is going to end right now when you
    perform the final installation step.


    # 9D-4: Installing and Running Xmahjongg


    Now you''ve come to the last step in this part of the process, make install. Here
    you are telling your system to install what you have created, or compiled, in
    the make step. Note that because installation takes place in permissions-protected
    parts of your system, you will need to add sudo to the command string to give
    yourself administrative privileges.


    To perform the installation, sudo make install, and press ENTER. You will be prompted
    for your password. After typing it and pressing ENTER, the installation process
    will take place. Once your Terminal brings back to your user prompt, Xmahjongg
    will be installed and ready to run. As general rule, programs compiled from source
    do not automatically install a launcher in your Applications menu; you must instead
    run them by command. Although you can run a program for the first time by the
    Run Application panel, it is better to run the program for the first time by typing
    the command in your Terminal window. If anything gone amiss during installation,
    the Terminal will tell you what the problem is, whereas the Run Application method
    would leave you wondering what''s going on.


    To run Xmahjongg, just type xmahjongg in a Terminal, and then press ENTER. If
    everything goes as it should, you can then create a launcher for Xmahjongg in
    your Applications menu, on the GNOME Panel, or in a panel drawer.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# 9D-5: Cleaning Up and/or Uninstalling Xmahjongg


    Once you are done and everything seems to be working as it should, you would normally
    tidy things up in the Xmahjongg folder by getting rid of unnecessary files. You
    can do this via the Terminal using the `cd` command to go back into the Xmahjongg
    folder, typing `make clean`, and then pressing ENTER.


    If you want to uninstall Xmahjongg, open a Terminal window, go back to the Xmahjongg
    folder using the `cd` command, type `make uninstall`, and finally press ENTER.
    The routine is essentially the same for any applications installed in this way,
    though as you might imagine, installation isn''t always as smooth as a process
    that I''ve just described (and it''s definitely not as easy as it is via the Ubuntu
    Software Center).


    The main reason for the uninstall process being less cooperative is that it requires
    you to keep the original project folder, which means you have to keep a bit of
    clutter you normally wouldnt to bother with. On top of this, some projects do
    not need a `make uninstall` routine at all. This means that you have to keep track
    of whatever has been installed in your system and then remove each item using
    a series of `sudo` commands.


    All that negativity aside, go ahead, have some fun, and put your command line
    skills to the test. You''ll have something to tell your grandkids about in the
    future.


    # Customizing the Terminal


    The Terminal is a very simple application in terms of looks, though you can spice
    things up a bit if you''re so inclined. Not only can you change the background
    and text colors in the Terminal, but you can even display one of your favorite
    photos as a background (as shown in Figure 9-19) or make the background transparent.


    To change the Terminal background, go to the Terminal, and select **Edit > Profiles**.
    When the Profiles window appear, select the profile you want to edit, which the
    first time out will be Default, and then click the **Edit** button. In the Editing
    Profile window appears, click the **Background** tab (Image 9-20), and then navigate
    to the photo you want to use as your background by clicking the Menu button next
    to it and finding the file in the Select Background Image window. When you''ve
    found the photo of your choice, click Open. Depending on the image you use for
    background, you may find it difficult to see the text once your image appears
    in the Terminal. If so, try moving the slider under the words *Shade transparent
    or image background* in the Editing Profile window. If that still doesn not do
    the trick, click the **Colors** tab, deselect **Use colors from system theme**,
    and then try some of the preset Foreground and Background combinations from the
    menu button next to the words Built-in schemes.'
  merge: -1
  pgno: 220
- img_proc: true
  md: '![](img/add8efd602aad9815ee8abf27a7a293e_221_0.png)


