  md: '# # 2


    # # WADING AND DIVING


    Running and (If You Like) Installing Ubuntu


    ![](img/add8efd602aad9815ee8abf27a7a293e_42_0.png)


    As I have already mentioned, one of the great things about Ubuntu is that it comes
    on a live CD, which means that you can try it before you install it . . or never
    install it at all, if that''s what you prefer. Better yet is the fact that, unlike
    earlier editions of Ubuntu, you don''t need an additional installation CD if you
    choose to install it—the Ubuntu Desktop functions as both a live CD and an install
    CD. And in the good-better best swing of things, the best point of all is that
    installation from the live CD is actually much, easier than any other installation
    process you''ve dealt with, and even gives you more than one way to go about it.


    In this chapter, I will cover the basics of starting up and running Ubuntu from
    the live CD and then, assuming you''ve caught the Linux bug, the painful-steps
    of installing Ubuntu on your hard disk as your sole operating system, in its own
    partition on your hard disk in a traditional dual-boot setup (with Windows in
    its own partition), or, for the slightly less adventurous, from within your Windows
    system. If your computer doesn''t have a CD drive, don''t worry,'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'you can still join in—take a look at Appendix A to see how you can run or install
    Ubuntu from a USB flash drive instead. Whatever you end up going about, let''s
    put this book to use and get Ubuntu up and running.


    # Going for a Dip


    To get a taste of what Ubuntu is all about (and check out your hardware to whether
    it''s all comfy-cozy with Ubuntu), there is probably no better way to go than
    to run Ubuntu directly from the live CD. Or do this, just place the Ubuntu Desktop
    CD in your disc drive and restart your machine. When the machine starts boots
    up from the CD, and after a second or two, you should see a purple startup screen
    with a couple of icons at the bottom of it. If the screen does not appear and
    your machine boots up into your operating system, then it is very likely that
    your machine''s BIOS settings need to be changed to boot from cd.


    You can access your machine''s BIOS by restarting and pressing whatever key onscreen
    instructions assign to accessing the BIOS setup. This is usually DELE or F1 (F2,
    F10, and ESC are also common), but not all are the same. The information passes
    so fast that you might miss it, check your user''s manual to see what the correct
    key is. Once you get into the BIOS setup, change the boot sequence so that your
    drive is first.


    Once your machine boots from the live CD and you see the purple startup screen


    After a couple of minutes or so, the loading screen will disappear, and in its
    place will come an Install window like the one in Figure 2-1. You should be able
    to use your mouse as well as the keyboard, unless you want to change the language
    using the live session. On the left of the screen, click the Try Ubuntu 10.04
    button to start a live session. After a few more seconds you will be presented
    with an Ubuntu desktop, all from the CD. And remember, your hard disk will go
    untouched, so rest easy—you''re not going to change, let alone hurt, anything.
    When you get to this point, you''re ready to roll—I''ll hold off on talking about
    that until Chapter 3.


    Special input mechanisms are required for typing certain languages (that is, Chinese,
    Japanese, and Korean) are not supported in live sessions.


    If you''d like to get out of the live CD and return to your normal, click the
    power button at the top right of the screen, Restart, and then choose Restart
    from the window that appears. After a little while, you''ll be able to remove
    the CD from the drive and press ENTER. The computer will restart and return you
    to your normal Windows desktop soon after. If you have no luck with the Restart
    button for some reason, it is safe to just turn your computer off and then on
    again using the power button on the front of it.'
