  md: '# Online Music Stores via Rhythmmbox


    While iTunes only has the iTunes store, Rhythmmbox provides you with options,
    all of which can be accessed from the left pane in the Rhythmmbox window under
    the Stores heading. Of these two stores, Jamendo and Magnature, provide music
    released under Creative Commons or open license by independent artists. The other
    store is the Ubuntu One Music Store, which provides music by major artists from
    the 7digit digital catalog. The songs there are free from digital rights management
    (DRM) limitations found in many songs purchased from other stores.


    # Other Cool Features in Rhythmmbox


    Rhythmmbox includes a few cool features worth noting. In addition to being able
    to manage podcasts, it also supports displaying album cover art. As you can see
    in Figures 14-2 and 14-4, whenever you play a track in Rhythmmbox, the album cover
    art for that track is automatically downloaded and displayed in the lower-left
    corner of the window (assuming that Rhythmmbox can find the cover online).


    Another cool feature has to do with lyrics. To use this feature, you must first
    activate it by selecting the Edit menu and selecting Plugins. In the Plugins window
    that appears (Figure 14-5), check the Song Lyrics box, and then click the Close
    button. After that, go to the View menu, and select Song Lyrics. Rhythmmbox will
    then search the Internet for the lyrics and display them in a separate window
    (Figure 14-6).


    ![](img/add8efd602aad9815ee8abf27a7a293e_298_0.png)


    Figure 14-5: Activating Rhythmmbox''s lyrics function'
  merge: -1
  pgno: 298
- img_proc: true
  md: 'Finally, if you are an iTunes user and attached to a bit of visual stimulation
    while playing your tunes, Rhythmbox can now satisfy you with a visualizer of its
    own. To activate it, go to the View menu and select Visualization (you can turn
    it off in the same way). The right half of the Rhythmbox window will be filled
    with the wild, swirling shapes and colors of psychedelia you''ve come to know
