    several years later! (To be fair, it a particularly minor problem that few people
    have ever experienced to.)


    Once a bug is fixed, its status is changed to Fixed Release, and the Ubuntu developers
    will often provide an updated package that you can install to fix the problem
    on your computer. Fixes aren''t made away straightaway, since they have to go
    through a series of stringent tests to make sure they don''t screw anything up.
    This means that some bug fixes might not even be available until the next version
    of Ubuntu is released!


