  md: '# 16B-1: Installing Kino and Setting Up Your System


    The first and easiest step is to download and install Kino. Just go to the Ubuntu
    Software Center to do this. Once installed, you can take a look at Kino by selecting
    Applications Sound & Video > Kino. At this point, you can use Kino to work with
    video files you already have on your hard disk and start capturing video. If,
    however, your camera connects to your computer via a FireWire (IEEE 1394) connector,
    you must perform a few steps the first time around your system can recognize the
    connection:


    +   1. Connect your camera to your computer using the FireWire cable that came
    with (or you were forced to buy) your camera.

    2. Turn on your DV camera in play mode. Once you''ve done this, the raw1394 module
    will appear in your system''s /dev/directory, though you won''t see any indication
    of this up front.

    3. After a few seconds, turn off your camera, but leave the cable connected.

    4. Open a Terminal window, type cd /dev, and press ENTER.

    5. In the same Terminal window, change the permissions of the raw1394 module so
    that everyone on your machine can read and write to it using sudo chmod +rw raw1394
    and pressing ENTER.

    6. Type your password when prompted, and then press ENTER.


    If all goes without a hitch, you will be returned to your user prompt without
    any other messages appearing in the Terminal. You can then close the Terminal
    window.


    # 16B-2: Capturing and Editing Digital Video with Kino


    Once you have gone through the preparatory steps you are ready to capture video
    from your camera. To do this, connect your camera to your computer (if it isn''t
    already connected), turn on your camera to Play mode, and then start up Kino.
    Once Kino is open, click the Capture tab to the right of the playback pane.


    Now you can use the playback controls located below the playback pane. These controls
    buttons actually control the functions of your camera. Start by clicking the Rewind
    button until you get to the beginning of the video segment you want to capture.
    Once you get there, click the Play button, to play back. When you reach the point
    at which you want to start capturing, clicking the Capture button just above the
    play back controls in the Kino window will start capturing your video to disk
    (in your home folder by default) and show you what it is capturing in the main
    pane of the window (Figure 16-9). To keep things easy to manage, the captured
    video stream will be split into several files, the number of which depends on
    the length of the video played.'
  merge: -1
