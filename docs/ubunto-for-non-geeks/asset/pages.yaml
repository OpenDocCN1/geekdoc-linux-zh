    # # Choosing a Screensaver


    Screenscreavers used to be a must-have (and must-use) item for computer users
    who wanted to prevent damage (burn-in) to their monitors. Video display technology,
    has now advanced to the point where screensavers are no longer necessary. Nevertheless,
    screensavers are cool to look at, and plenty are available online to supplement
    the 15 that come installed by default. Right out of the box, the screensaver is
    set up to blank your screensaver after 5 minutes. However, you can also choose
    to have the various screensavers switch every few minutes, or you can opt for
    a single screensaver that you specially like. You can change these settings by
    selecting System > Preferences > Screensaver, after which the Screensaver Preferences
    window (Figure 8-23) will appear.


    > > If you prefer a screensaver with a more personal touch, choose the Pictures
    folder from the list on the left of the window. This will display a slide show
    of all the photos in your Pictures folder when the screensaver is activated.


    ![](img/add8efd602aad9815ee8abf27a7a293e_180_0.png)


