- img_proc: true
  md: 'Be that as it may, there is still much to be said for the power and convenience
    of the command line. The fact that the command line can now be utilized within
    a graphical environment also makes it much less forbidding. The Terminal is just
    a tiny text-based island in a sea of graphical bodies (see Figure 9-1). Using
    the command line can be as pain-free as anything else you do on your system, and
    it can actually provide you with a little fun if you are willing to give it a
    try.


    ![](img/add8efd602aad9815ee8abf27a7a293e_187_0.png)


    Figure 9-1: Putting the Terminal in perspective


    Unfortunately, many guides to using the command line are written by hard-core
    command-line junkies, whose enthusiasm for what they see as a really good thing
    inadequately makes what they write seem even more off-putting to the recent Linux
    immigrant or wann-be.


    For your sake, I will try to curb my enthusiasm so as not to scare you right to
    Chapter 6 and the more comfortable world of the Ubuntu Software Center. I will
    also help you keep things in perspective by teaching you, whenever you need, to
    use the command line as a complement to the various graphical tools that you have
    at disposal, rather than presenting it as the sole way of going about things.
    Of course, I am not going to cover every possible angle in this regard—just enough
    to give you exposure and experience and, ideally, make you feel at least a little
    more ease with the command line. Who knows; could you actually come to think of
    using the command line as ... fun? Well, I won''t get carried away.


    # # The Terminal


    You can run the Linux command-line Terminal application in your Ubuntu system
    by selecting Applications > Accessories > Terminal. When the Terminal opens, it
    will, in all its simplicity, look much like Figure 9-2.'
