- img_proc: true
  md: 'Look in the Trash It''s possible that you accidentally deleted the file. Click
    the Trash icon on the bottom panel, and look for it in there.


    Another explanation for the lost file might be that it was in a temporary folder.
    This happens when you open an email attachment, for example—the file is put in
    the temporary folder by your client and opened using the default application for
    that type of file. Unfortunately, some programs dont realize it''s a temporary
    file, and they leave you in the temporary directory ... which is periodically
    wiped clean. If you suspect that may have happened and you have restarted your
    computer since you saved the file, then it''s probably gone forever.


    If you haven''t restarted, there may still be hope; try opening the (modified,
    original) file again to see which folder gets stored in selecting File Save As
    (or similar) in the program you''re using. Then, check which Save window opens
    up to. For example, the Evolution mail client stores attachments that you open
    in a randomly named folder within the /home/username/.evolution/cache/tmp folder
    (see Figure 21-15 for an example). Note the name of the folder, and open your
    home folder. Then, select Location, type the name of the folder in the box that
    appears, and try to find your file in the folder that opens. It''s hardly convenient,
    but it might just help you find your file.


    ![](img/add8efd602aad9815ee8abf27a7a293e_434_0.png)


    Figure 21-15: Looking for the folder that was saved in a temporary folder by Evolution'
  merge: -1
