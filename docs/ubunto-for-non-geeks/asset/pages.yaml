  md: '# Ubuntu Doesn''t Play Any Sounds


    There are many reasons why Ubuntu might not be playing sounds. I''ll concentrate
    on some of the more basic issues in this section, but if none of these helps,
    you can always try the Ubuntu forums or IRC; both are discussed in detail in Chapter
    20.


    To start troubleshooting, find a song on your computer and play it in Rhythmbox
    or the Totem Movie Player. If you need it, a sample song available in the /usr/share/examples/sounds/Ubuntu_Culture_Showcase
    folder, aptly called "Frustrated Blues". You need to have a sound file playing
    constantly in the background so that you can tell whether any of these settings
    has worked.


    If you are unable to start playing the file, Ubuntu may not have detected your
    sound card properly. Open a Terminal (Applications > Accessories > Terminal),
    type aplay -i into it, and press ENTER. If the list of playback hardware devices
    is empty, your sound hasn''t been detected. In this case, you''ll definitely need
    to get some community support—see Chapter 20 for more information on using the
    Ubuntu forums and IRC.


    Next, check that your speakers are turned on, turned up, and plugged into the
    correct socket on your computer (it''s often a light green color). Many times
    in the past I''ve plugged my speakers into the microphone socket and sat wondering
    they were silent. When you''re confident that your speakers are OK, try the following
    steps:


    +   1. Click the speaker icon on the top panel, and select Sound Preferences from
    the menu that pops up (Figure 21-7).

    2. Make sure that the Mute option is not checked and that the Output volume slider
    at the top of the window is pulled all the way to the right.

    3. Click the Applications tab, and make that none of the applications in the list
    is muted or at a low volume.

    4. Click the Output tab, and make that the right connector is chosen. If you''re
    not sure, try choosing different connectors by trial and error until you get one
    that works. return this option to its original setting (usually Analog Speakers).

    5. Click the Hardware tab, and choose a different device from the Profile option.
    Then, repeat the previous steps, checking that nothing is muted or at low volume
    and that the right output device is selected. Trial and error often occur.


    If none of this helped, check out http://ubuntuforums.org/showthread.php?id=205449/.
    It''s a pretty comprehensive guide to identifying sound problems, though it requires
    a lot of work in the Terminal. (See Chapter 9 if you need to refresh your memory
    on how the Terminal works.)'
