    being the case, Chapter 4 is an indispensable part of your Ubuntu experience.
    In this chapter, you will learn how to connect to the Internet and set up wireless
    and mobile broadband connections. You''ll find tips for using a modem and some
    handy troubleshooting advice when you struggle to get connected.


    # Chapter 5: Slipping and Sliding—Exploring the Internet, Linux Style


    With Chapter 4 behind you, it''s time to get serious about all this Internet business
    and starting to put it good. Chapter 5 takes you on a tour of Ubuntu''s suite
    of Internet applications, in particular the Firefox browser. You''re introduced
    to Ubuntu''s email and instant messaging tools before embarking on a crash course
    in social networking with Twitter and Gwitter.


    # Chapter 6: Rounding Out the Bird—Downloading, Installing, and Updating Programs
    the Easy Way


    The default Ubuntu installation includes most of the software you need, free and
    waiting or there is still much available out there, free to download and install
    applications using the Ubuntu Software Center. Chapter 6 teaches you how to easily
    install applications using the... You''ll learn about system and application updating
    and how to broaden your software horizons using third-party repositories.


    # Chapter 7: A Tiny Nest—File and Disk Handling in Ubuntu


    From creating folders to copying files to browsing your system and network, Chapter
    7 covers all things file management. You''ll learn how to work with USB storage
    devices, transfer files via Bluetooth, burn data CDs and DVDs, deal with CD-RW
    disks and multisession CDs, and create space-saving compressed archives of files
    and folders.


    # Chapter 8: Dressing Up the Bird—Customizing the Look and Feel of Your System


    Tired of looking at the same old desktop? Feeling nostalgic for your previous
    operating system? Chapter 8 tells you how to beat the déjà vu blues by changing
    the look and feel of just every visual element of your system and how to control
    Ubuntu''s visual effects, Compiz.


    # Chapter 9: Simple Kitten Ways—Getting to Know the Linux Terminal and Command
    Line ... and the Cool Things It Can Do


    Many people shy away from Linux because they perceive it as a system in which
    everything still needs to be done by entering commands. That perception is, as
    the saying goes, a load of squashed avocados. Still, there is a lot of cool stuff
    that can be done via the command-line based Terminal, and Chapter 9 will tell
    you all about it as it tames your fears and piques your interest in commands.
    Really.'
