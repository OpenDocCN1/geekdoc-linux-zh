    Ah, tres cool!


    ![](img/add8efd602aad9815ee8abf27a7a293e_167_0.png)


    Figure 8-12: Changing the look of your system windows


    # 8B-8: Installing Additional Window Borders, Controls, and Icons


    If you are excited about this customization thing but you''re not satisfied with
    the theme choices included with the system, you can download and install still
    other window borders, controls, and icons. To show you how to do this, I will
    walk you through creating a faux Mac theme, which will look fairly similar to
    the standard Aqua theme of Mac OS X, as you can see in Figure 8-13.'
