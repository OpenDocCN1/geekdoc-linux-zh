  md: '# Hardware Requirements


    All worries about compatibility aside, you will need to meet some minimum hardware
    requirements:


    +   - Any computer with a 1 GHz or higher i386-based processor, or an Intel or
    AMD 64-bit processor

    - About 5 gigabytes (GB) of hard disk space, though having at least 10GB would
    be a bit more comfy

    - Sufficient memory (RAM)


    NOTE The CD that comes with this book is designed to work on machines with i386-based
    processors (basically, all the Pentium chips, including Celeron, Xeon, and the
    new Core Duo, as well as processors from AMD). Though this CD will install Ubuntu
    on a computer with an AMD or Intel 64-bit processor, it will run in 32-bit mode
    only. To make full use of your 64-bit processor, you need to download the 64-bit
    version of Ubuntu. Additional information is provided in Appendix B.


    As random access memory (RAM), the official specs tell you that you need a minimum
    of 512 megabytes (MB) to run Ubuntu. Although you can not get by with this, you''d
    get by much better. With basic rule of thumb, no matter what OS you are dealing
    with, you need the recommended (not the minimum) memory plus at least 128MB. Regardless
    of what the official specs say, but in power. You won''t regret it.


    Saying "more memory you have, the better" may sound a bit simple, and perhaps
    even cavalier, trust me on this one. When you have too little memory, no matter
    what system you are running, weird things happen: Applications seem to take years
    to open or not at all, never take forever to render their little icons, and freezes
    and general system meltdown much more often. In other words, running your machine
    on too little RAM is sort like trying to do jumping jacks in a broom closet. If
    you could it, you would be all contorted, and you''d be smashing your hands into
    the walls every 1.4 seconds.


    Fortunately, it is pretty hard to find a machine with less than 512MB of RAM these
    days (256MB, perhaps, on the really old beasts), but if you do happen to have
    such a machine, you can at least take solace in the fact that memory is relatively
    cheap, so go for it.


    # Good News for 64-Bit Machine Users


    It is again important to mention that the CD that comes with this book is designed
    to work on machines with i386-based processors, which pretty much covers the vast
    majority of PCs out there. If your machine is 64-bit compatible, you will be glad
    to know that it will also work, albeit not in 64-bit mode. Sorry, but no go.'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'Fortunately, there is good news for those who were a bit disappointed by the
    content of previous paragraph. Ubuntu is available in a native 64-bit version.
    Check Appendix B for information on how to get it. The information provided there
    will also be of use to i386 users who happen to lose or damage the disc that comes
    with this book.


    # Mixed News for Mac Users


    Those of you with pre-Intel era PowerPC Macs (as those with G3, G4, and G5 processors)
    may be aware that previous Ubuntu releases have been available in PowerPC versions.
    Unfortunately, as the Ubuntu 7.04 Feasty Puppy release, this is no longer the
    case. This means that if you are a Power Mac user, you will have to use one of
    the older Ubuntu releases or an unofficial, community-supported release of Ubuntu
    10.04 Lucid Lynx (more on that name in the following section) for PowerPCs (http://cdimage.ubuntu.com/ports/).


    Of course, if you are using an Intel-based Mac, you''re in luck: the disc that
    comes with this book will work on your Mac. After all, the i386 stands for "Intel".


    # Speaking Ubuntu


    It''s worth noting that you are bound to come across a lot of weird phrases when
    dealing with Ubuntu, especially when searching for information on the Net. In
    particular, I am referring to seemingly incongruous phrases, as Warty Morty, Hoary
    Hedgehog, Breezy Badger, Dapper Drake, Edgy Ej, Feasty Puppy, Gubby Goblin, Hardy
    Hero, Intreedx, Jaunty jackalope, and Karmic Koala. These are the unique code
    names of Ubuntu since its first appearance in 2004. The important one for you
    to remember is that of the current release, which is the one on the book''s disc:
    10.04, known as Lucid Lynx.


    You are also likely to come across a few variations of the Ubuntu theme. These
    are Kubuntu, a KDE-based version of Ubuntu; Edubuntu, a special version of Ubuntu
    designed for the classroom; Xubuntu, a lightweight version of Ubuntu based on
    the XFCE desktop; and Ubuntu Studio, a new flavor of Ubuntu, aimed "creative people",
    which contains a strong suite of graphics, video, and music applications. There
    is even a slimmed down of Ubuntu, called Ubuntu Netbook Edition, designed specifically
    for notebooks.


    # Where Do I Go From?


    Now that you know more about the world of Linux and Ubuntu and you have your disc
    in, it''s time to get down to it. Ubuntu on your machine, it''s time to flip ahead
    to Chapter 3. If your machine is still Linuxless, it''s time to take it out for
    a spin and see whether you like it to. So now, strap yourself down in front of
    that computer, click on your spurs, and go straight to the next chapter. It''s
    time to become a Penguinist!'
  merge: -1
