  md: '# Online Gaming


    With all this talk of installing games, it''s easy to forget that there are many
    games that you don''t have to install at all. Numerous websites allow you to play
    games online for free, as long as you have the proper browser plug-ins installed.
    (See "Multimedia Plug-Ins" on page 62 for help installing plug-ins.) For example,
    check out http://www.popcap.com/ and http://gametrick.net/ for some great online
    time-wasters. You can also play any of the games found on Facebook or other social
    networking sites, such as Farmville and Mafia Wars, without ever leaving the comfort
    of your Ubuntu desktop.


    # Searching for More Games


    There are lots of other games for Ubuntu that I haven''t covered, but rest assured
    that they''re out there. Some are available as DEB files, and can be installed
    in the same way you installed Skype in Chapter 6. A good example is SDL Hana,
    a Linux version of the Japanese flower card game Hanauda (Figure 17-19), which
    is available from http://savannah.nongnu.org/pr/sdlhana).


    ![](img/add8efd602aad9815ee8abf27a7a293e_352_0.png)


    Figure 17-19: SDL Hana


    Still more are available from the Ubuntu Software Center: Some of my old-time
    favorites include the Serbian Pac Man clone, Njam; and the Czech maze game, Fish
    Fillets NG, in which you guide two fish through all sorts of cumbersome, but very
    attractive, underwater locations.'
