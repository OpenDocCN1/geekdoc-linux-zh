  md: '# 4


    # MORE THAN WEBBED FEET


    Connecting to the Internet


    ![](img/add8efd602aad9815ee8abf27a7a293e_76_0.png)


    These days, the average home computer user spends more time surfing the Web and
    writing email messages than doing just about anything. Even if you''re not much
    of a surfer, there are still numerous other applications that aren''t Internet
    applications per se but that still use the Internet in some way, such as gathering
    song and album information when you rip audio CDs to create MP3 files. Having
    a computer that isn''t hooked up to the Internet is like buying a new Maserati
    and refusing to take it out of the garage.


    Of course, how you connect to the Internet depends on your hardware and provider.
    There are a number of possibilities in this area, including high-speed local area
    networks (LANs), cable modems, mobile (3G) broadband, and ADSL connections from
    phone lines. Some computers have an internal 56Kbps modem or can be connected
    to external dial-up modems for slower connections over regular phone lines. Depending
    on what you have, setting things up on your system should provide a cinch in the
    case of LAN connections and any others that use your Ethernet port (such as'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'cable modems), possibly a bit more work in the case of wireless and mobile
    connections, and sometimes a bit of a challenge when it comes to dial-up connections.
    In this chapter you will learn how to set up these connections, and in the next
    chapter you will learn a bit about what Linux has to offer in terms of the most
    commonly used Internet applications.


    # # How Do You Connect?


    The way you go about setting up your connection really depends on how you''re
    trying to connect to the Internet. Here''s a list to help you decide which method
    to use:


    +   - If you connect your computer to a wall socket, a router or a cable modem
    using an Ethernet cable, go to “Setting Up A Wired Connection” on page 46.


    +   - If you connect to a wireless network or your own wireless router, head to
    “Setting Up a Wireless Connection” on page 49.


    +   - If you use a dial-up modem connected to your phone line, the section “Setting
    Up a Dial-Up Connection” on page 53 is the one for you.


    +   - If you have an ADSL or DSL modem that is built into your computer or connected
    to a USB port, try “Connecting with a DSL or ADSL Modem” on page 52.


    +   - If you connect using a mobile (3G) broadband connection that plugs into
    your computer, skip to “Mobile (3G) Broadband Connections” on page 55.


    # # Setting Up a Wired Connection


    If you have a high-speed Internet connection from your cable television company
    or ISP or if you are connected to the Internet by a LAN at your office, you are
    really in luck, because these setups are probably the easiest to deal with. I''m
    going to assume that you have already set your router or modem according to your
    Internet provider''s instructions, all that remains to connect an Ethernet cable
    between the modem/router (or LAN wall socket) and your computer''s network socket.
    After you''ve done that, you should be ready to go without any further settings
    to fool with.


    # # Checking Your Connection


    If you like, you can see whether you''re connected by opening the Firefox launcher
    in the top panel, right next to the System menu) and, once it starts up, trying
    to navigate to a common site, such as http://www.yahoo.com/. If the site comes
    up, you''ll know all set.


    If you have a problem getting online and you are trying to connect via a LAN or
    cable modem, you could try to refresh your connection by right-clicking the Network
    Manager icon in the top panel, unchecking the Enable'
  merge: -1
  pgno: 77
- img_proc: true
  md: 'Networking box in the pop-up menu, waiting a few seconds, and then checking
    the Enable Networking box in the pop-up menu again. If that doesn''t work, restarting
    your machine while physically connected to your Internet source with the Ethernet
    cable. If the lack of connectivity persists, it is possible that your network
    card is not supported by Linux. This is relatively rare but, fortunately, easily
    remedied (by replacing it).


    The problem could be that your network or service provider does not automatically
    assign addresses via Dynamic Host Configuration Protocol (DHCP). DHCP is a means
    by which your Internet provider can automatically provide your system with the
    configuration information it needs in order to connect to the Internet. If your
    provider does not use DHCP, you will have to get the necessary information about
    settings from the network administrator or service provider and enter the settings
    yourself.


    # Setting Up a Cable or Ethernet Connection for Providers Not Using DHCP


    To input your cable or Ethernet settings yourself, first get the settings you
    need from your network administrator or Internet provider, and then perform of
    the following steps:


    +   1. Select System > Preferences > Network Connections.

    2. Choose the Wired tab (Figure 4-1), and select the network connection from the
    list by clicking it once (it should have a name like Auto eth0). If there are
    no entries in the list, then your network card hasn''t been properly recognized.
    Take a look at "Installing Drivers for Your Network/Wireless Card" on page 390
    to see how to fix this.


    ![](img/add8efd602aad9815ee8abf27a7a293e_78_0.png)


    Edit, and you''ll be presented with a settings window. Choose the IPv4 Settings
    tab, and change the Method setting from Automatic (DHCP) to Manual.'
  merge: -1
  pgno: 78
- img_proc: true
  md: '4. Click the Add button to enter the IP address information for your computer.
    This should have been provided by your ISP or network administrator where will
    consist of an IP address, default gateway, and netmask (see Figure 4-2 for an
    example). Enter the DNS server address that you were given too.


    ![](img/add8efd602aad9815ee8abf27a7a293e_79_0.png)


    Figure 4-2: Manually inputting network IP settings


    +   5. Make sure that the Available to all users option is checked if other users
    of your computer will be using the connection. You will be asked to enter the
    password for your user account, so do that, and click Authenticate.


    +   6. Click Apply to save the settings.


    +   7. Network Manager will try to establish the connection using the details
    you just provided. If it''s successful, a message will pop up saying that the
    network was connected. If that doesn''t happen, click the Network Manager icon
    on the top panel, and choose Disconnect.


    +   8. Then, click the Network Manager icon again, and select your network underneath
    it says Available.


    NOTE If you are wondering what Internet Protocol (IP) and Domain Name Service
    (DNS) are all about, you can simply think of them in this way: DNS translates
    the easy-to-remember URLs that you have come to, such as http://www.google.com/,
    into numerical, or IP addresses that the Internet can understand. The address
    http://www.google.com/ thus becomes //209.85.229.104. You can type the numerical
    version into your browser later to see it for yourself.'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# Setting Up a Wireless Connection


    With the right wireless hardware, you can now surf the Web just anyplace you can
    catch a (radio) wave, so to speak. Whether you happen to be at your breakfast
    table, in the library of your university, or at your local Starbucks, you can
    now go online without having to physically hook up your computer to anything.


    Fortunately, the process of setting up wireless networking in Ubuntu is quite
    easy and not very different from what you just read in the previous section.


    # Hardware


    If you lead a solely wired existence or are just inexperienced in this particular
    area, there are a few things worth knowing. To get started, you need to have the
    right hardware. If you just want to go wireless, then all you need is a wireless
    network card (sometimes referred to as an 802.11a/b/g/n card or WiFi card). These
    are built into almost all modern laptops, for older models they are usually add-ons
    in the form of cards that pop into the PCMC slot on the side of your computer
    (as shown on the right of Figure 4-3).


    ![](img/add8efd602aad9815ee8abf27a7a293e_80_0.png)


    Figure 4-3: All you need for a WiFi setup—an access point and a network interface
    card


    Some wireless cards plug into one of your machine''s USB ports, or in the case
    of desktop models, one of its PCI slots. Although support for cards of this type
    improved through the past couple of years, there are still gaps, and some can
    be rather tricky to deal with. You will find some tips on how to deal with awkward
    cards in Chapter 21, but if you''re looking for a sure thing, Centrino IPW-2100
    and IPW-2200 cards are easily supported by Ubuntu. As for cards of the built-in
    or PC card variety, you will find support much better, but even then you have
    to make sure, or at least hope, that the card you are using is Linux compatible.
    No matter what wireless card you are wondering about, the easiest way to find
    out whether it will work is to try it. The Linux kernel now comes with many wireless
    drivers built in, and Ubuntu'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'updates often provide new ones, so if you use a card that is compatible with
    one of those drivers, things will be smooth sailing. check Ubuntu''s list of supported
    cards (https://help.ubuntu.com/community/Wifi/WirelessCardsSupported/), or check
    the Ubuntu forums to find a driver that is compatible or see whether anyone has
    experience with your particular card.


    If you want to set up a wireless system in your home or office, then you will
    also need to get a wireless access point (WAP), on the left of Figure 4-3. Fortunately,
    Linux compatibility is not really much of an issue in this department, because
    the access point doesn''t physically interface with your computer, and the settings
    are handled via your web browser.


    NOTE Access points come in several different types. The most common type is a
    wireless router, which many ISPs provide for free.


    You should be aware, however, that a few access points require you to use Internet
    Explorer to handle their setup choices. Although it is possible to get Internet
    Explorer up and running in Linux (as you will see in Chapter 18), you can''t 100
    percent sure that it will work. Unless you have a Windows machine somewhere in
    your house or office to handle such chores, it is probably a good idea to steer
    clear of access points of this kind.


    # Activating Your Wireless Card


    Setting up a Linux-compatible wireless PC card is actually relatively simple.
    First connect your access point to your Internet source, and then turn on the
    access point. Once it is up and running, plug your wireless card into the PCMCIA
    slot or USB port on your laptop (unless your wireless connection is built in,
    which case you can forgo this step). Any LEDs on the external card will likely
    light up at this time.


    If your access point was on when you booted your computer and your wireless card
    was in place during booting, you probably don''t need to do much to access the
    Internet. Just follow these steps:


    +   1. Click the Network Manager icon on the top panel to reveal a drop-down menu
    showing the wireless signals that are present in your vicinity and the strength
    of each signal (Figure 4-4).

    2. From that menu, select the signal for your access point (or any other wave
    you are entitled to latch onto) by clicking it.

    3. Your system will then try to connect to the Internet. Once a connection is
    made, the Network Manager icon will morph into a small signal-strength indicator.
    Pretty handy.

    4. If your network has a WEP or WPA password, you will be prompted to enter it.
    It can be useful to check Show password before you type the password so you can
    check for any mistakes. Click Connect when you''re finished.'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'NOTE Most access points employ an added level of security in the form of Wired
    Equivalent Privacy (WEP) or a Wi-Fi Protected Access (WPA). If you didn''t choose
    your own password when you set up the access point, try looking for a sticker
    on the base or side of the access point to see whether a default one is used.
    If you''re trying to connect to a network for which you don''t happen to know
    the key, then chances are not supposed to be making the connection in the first
    place. Naughty, naughty.


    ![](img/add8efd602aad9815ee8abf27a7a293e_82_0.png)


    Figure 4-4: The Network Manager shows you available wireless networks and their
    signal strengths.


    If you were not successful in making your wireless connection (the system will
    tell you whether that''s the case), you have a few possibilities beyond the annoying
    non-compatible-card scenario. First, double-check to make sure your card is actually
    physically turned on. I know that sounds dumb, but I have been guilty of this
    oversight on numerous occasions. Many laptops have you to press the function key
    (FN) and F2 at the same time to enable or disable the wireless card; mine you
    have to


    Another, less common, possibility is that your network does not use DHCP, in which
    case you will have to manually input your connection settings as provided by your
    network administrator or service provider. Armed with that information, simply
    follow the steps listed in “Setting Up a Cable or Ethernet Connection on page
    47. Just be to use the Wireless tab instead of the Wired one.


    If you still have no luck connecting wirelessly, the drivers may not be installed
    for your card, or Ubuntu may not support the card. You can try plenty of tricks
    to get things working, so head over to Chapter 21 and look for “Installing Drivers
    for Your Network/Wireless Card” on page 390.


    # Switching Off or Refreshing Your Wireless Connection


    Sometimes you''ll want to disconnect from a wireless network, such as when you
    use your laptop on an airplane or when you just want to connect to a'
  merge: -1
  pgno: 82
- img_proc: true
  md: 'different network, as you might when moving your laptop from one wireless hotspot
    to another.


    To do this, click the Network Manager icon to reveal the list of available wireless
    networks (that is, signals). In that list, click the Dis option below the name
    of the wireless network to which you are connected. Within a second or two, you
    will be disconnected.


    If you want to turn off your wireless card (as you should if you''re boarding
    an airplane) and you don''t have a physical way to do it, like a switch or a button,
    just-click the Network Manager icon, and then deselect Enable Wireless. And if
    you want to turn back on again, just get back to that menu, and select Enable
    Wireless again.


    Sometimes, your wireless card might lose its connection for no apparent reason,
    so it can be useful to refresh the connection (that is, turn off and on again)
    to get it back. The quickest way to do this is to click the Network Manager icon
    and click the name of your wireless network in the list. You will be disconnected
    and then automatically reconnected.


    If that doesn''t work, try disabling and enabling the wireless connection using
    Network Manager''s Enable Wireless option, as described earlier. If you still
    have no luck, try turning the wireless off and on again using a switch or button
    if you have one, unplug it and plug it back in again. Finally, if nothing seems
    to be working, restart the computer.


    # Connecting with a DSL or ADSL Modem


    How easy is it to set up your DSL or ADSL modem depends on the connection that
    it has. If it can be connected using an Ethernet cable, use that, and follow the
    instructions in "Setting Up a Wired Connection" on page 46; it''ll be much easier
    than trying to use a USB cable! If you have a USB or internal modem, try the instructions
    in this section and hope for the best.


    The first step is to check whether Ubuntu recognized your modem. Assuming''s already
    plugged in, click System > Preferences > Network Connections, and select the DSL
    tab. If a connection is listed, your modem was recognized, and you can begin setting
    up. If the list is empty, refer to https://help.ubuntu.com/8.04/internet/cmems-adsl-usb.html
    to see whether there are any steps you can follow to get your modem working.


    Select the connection by clicking it, and then click Edit. The DSL tab of the
    Editing window appears, and enter your username and password into the appropriate
    fields. Then enter your connection information (usually a phone number) into the
    Service box, and click Apply. Now, click the Network Manager icon on the top panel,
    and choose your DSL connection from the list. Network Manager will try to connect
    using your modem—if it''s not successful, go back and try changing some of the
    settings to see whether you can get it to cooperate.'
  merge: -1
  pgno: 83
- img_proc: true
  md: '# Setting Up a Dial-up Connection


    Although much of the world is moving to high-speed Internet connections, many
    of you may still be using dial-up Internet connections, which means you need to
    have a traditional dial-up modem to reach beyond your box to the outside world.
    In case you broadband surf-gods have forgotten, modems are those wonderful machines
    that whistle, chime, screech, and spit when you dial up your Internet provider.
    I would suppose you think of them as noisy noiselines in need of a good burp.


    Now comes the bad news—in the world of Linux, very few internal modems are supported,
    and for those that are, the setup process can be frustrating. The main reason
    behind this compatibility problem is that built-in modems are software dependent,
    and the software they depend on is part of, or designed for, Windows. Such modems
    are called Winmodems.


    Of course, the Linux community has been working on ways to deal with these Winmodem
    beasts that they will work with Linux systems. Support for the wide variety of
    Winmodem models out there is rather spotty, thanks is better than before, so you
    might just try to hold off on the worrying and give your modem a try to see whether
    it works. If it does, then you''re all set. If it doesn''t, then you will have
    options, and at least you''ve not done any damage to your system.


    With that intro-babble out of the way, let''s get down to the steps for setting
    up your dial-up connection. First, get the settings you need from your Internet
    provider. Most providers aim their operations at Windows and Mac users, and few
    offer Linux support. Still, there is no technical reason for your Linux system
    not to work via their setup, so just nag and push them until they give you the
    information you need. After that, make sure your modem is connected to a live
    telephone connection—for example, the phone jack in your wall.


    Now''s time to set up the connection. I''ll use the GNOME PPP program to do all
    of the setting up, but there''s a caveat: it is not by default, and you need an
    Internet connection to install! If you have access to some other Internet connection
    that you can use temporarily, connect to and use the Ubuntu Software Center to
    download and install GNOME PPP (see Chapter 6 to learn how to install software).
    The alternative is to use pppconfig command, which is installed by default but
    is difficult to use. Find another connection and check out /help.ubuntu.com/community/DialupModemHowTo/SetUpDialer/
    for instructions if you have no alternative but to use ppconfig.


    Assuming that you got GNOME PPP installed using a borrowed Internet connection,
    you can follow these steps to set up your modem:


    +   Select Applications > Internet > GNOME PPP, after which GNOME PPP will appear.


    +   Click Setup, and make sure you''re looking at the Modem tab.'
