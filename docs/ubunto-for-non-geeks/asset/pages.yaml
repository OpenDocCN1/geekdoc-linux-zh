    # Going for a Swim—Installing Ubuntu Inside Windows (the Wubi Installer)


    It used to be that if you enjoyed Ubuntu enough to run it off your

    hard disk but were afraid to do it for fear of damaging the delicate state of

    y Windows setup, you were ...well, out of luck. Things have changed,

    however, because there is now an installation called Wubi that lets you

    install Ubuntu directly on your Windows C drive as if it were any other Windows

    program. Once installed, every time you start up your machine, you will

    able to choose between starting up into Windows or Ubuntu from the

    Windows bootloader screen. Your Windows system stays as it is; you don''t

    partition your hard disk; and if you want to get rid of Ubuntu later for what-

    ever reason, you can do so like you would with any other Windows application.

