- img_proc: true
  md: '# 8B-3: Dolling Up the Side Pane (Emblems Yet Again)


    Now let''s change the look of the Nautilus side pane. Keeping the Backgrounds
    and Emblems window open (if you already closed it open it again), click the Places
    menu button in the Nautilus side pane, and select Information.


    You can add a different background pattern to the side pane as well, but for practice
    let''s add a color instead. To do this, click the Colors in the Backgrounds and
    Emblems window. The window will be filled with swatches of color. Drag the Grapefruit
    swatch to switch to your side pane, and it will turn from gray to gray, of all
    things, grapefruit (a very dark and unusual grapefruit). You can also create a
    two-color gradation effect by adding another color. Drag the Mango swatch to the
    very bottom of the side pane (but still within the pane), and you should have
    a grapefruit-to-mango, top-bottom gradation within it. Of course, if you are not
    pleased with this tropical color set, you can get back to your original default
    gray pane by dragging the Reset swatch onto the area. When you''re done, you can
    close the Backgrounds and Emblems window.


    The side pane of your Nautilus window provides a third way to work with emblems.
    Before I let you in on this third (and last) way, let''s create another folder
    for your home folder. Create a folder named Finances, which you can use to store
    files dealing with your relative worth in the modern scheme of things.


    After you''ve created the new folder, go to the side pane, click the Information
    drop-down menu, and select Emblems. A list of emblems will appear within the side
    pane. Select the Money emblem, and drag it onto your Finances folder. Next, select
    the Plan emblem, and drag it onto the Finances folder too. Add even more emblems
    to it if you like—you should be able to fit about four before Nautilus decides
    to end the madness and prevent any more from being displayed. Your window should
    now look something like the one shown in Figure 8-5.


    Once you are, go back to the drop-down menu, and select Places to get everything
    back to relative normalcy again.


    If it''s not your cup of tea, you have to admit that your Nautilus window is definitely
    more colorful now. You can, of course, change it to look however you want, but
    I''ll ask you to hold off on that a little longer, because you are going to be
    doing some more playing around it shortly.


    # 8B-4: Changing the Desktop Background


    Now that your home folder is all gussed up (or gaudied, depending on your aesthetic
    sense of things), you may think your desktop looks rather drab in comparison.


    You can easily change the desktop background (often called wallpaper) by right-clicking
    any open space on the desktop and selecting Change Desktop Background in the pop-up
    menu. This will open the Appearance Preferences window, opened to the Background
    tab (see Figure 8-6).'
