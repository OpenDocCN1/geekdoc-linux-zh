    # Working with Other Digital Media Players and Cell Phones


    Although the iPod may be the most popular digital media player out there and the
    iPhone holds the crown in the smartphone market, they are no means the only games
    in town. As I have already shown, Android-based phones are also quite popular,
    and there are still other devices, ranging from simple $15 MP3 players to the
    Linux-based Palm Pre cellular phone.


    How to work with these devices in Ubuntu can vary by device, but for the most,
    they should work in the same manner as an iPod or Android device or in the same
    manner as a USB data device. The Palm Pre, which uses a Linux-based operating
    system, works in Ubuntu the same way as the iPhone, while the $19 generic MP3
    player I bought at Office Dept thumb. The simplest way to see how your device
    will work is to connect it to your computer via a USB cable. Windows asking you
    how to deal with the device do not appear, open a Nautilus window to see if you
    find an icon for the device there. If so, you can work with your device using
    the tried-and-true drag-and-drop method. You can also use Rhythmbox to work with
    the audio files on your generic device by doing the following:


    +   1. Create a *Music* folder if there isn''t one already on the device.

    2. Right-click the *Music* folder, and select **Open with Other Application**n3.
    In the Open with window, select **Rhythmmbox** (Figure 15-4), and then click Open.


    # Managing Your Audio Device’s Files with Rhythmbox


    As I''ve already mentioned, Rhythmbox is the default application for iPhones,
    iPads, Android-powered devices, and one way or another, any other music players
    in Ubuntu. Once Rhythmbox is up and running, things work perfectly much just as
    they do in iTunes.


    +   * To view the contents of your iPod or other device'
