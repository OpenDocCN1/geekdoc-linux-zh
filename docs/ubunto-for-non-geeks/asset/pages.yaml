- img_proc: true
  md: '# Swd


    If you know who you are but aren''t exactly where you are, pwd (print working
    directory) should come in handy. The pwd command tells you exactly where the Terminal
    is in your directory tree.


    Let''s say, for example, that my Terminal is in my personal home directory (which
    is actually called rg) in the system''s home directory (which is actually home
    and where all the user account directories are located) when I use the pwd command;
    after, pressing the ENTER key, get /home/rg printed to my Terminal. You should
    get similar results if you try it.


    The word print, in this case, has nothing to do with your printer; it merely means
    the response will be printed to, or displayed in, the Terminal.


    # S df


    Another safe and easy, but much more useful, command is df (disk filesystem).
    The df command tells you how much disk space you have, as well as how much space
    you still have available, on each of the partitions on your various mounted disks.
    It by typing df and then pressing ENTER. Your output should look something like
    that shown in Figure 9-5 (depending, of course, on the size of your mounted disks
    and how they are set up).


    ![](img/add8efd602aad9815ee8abf27a7a293e_192_0.png)


    Figure 9-5: Output from the df command


    As you notice, the sizes are given in kilobytes (KB) rather than the gigabytes
    (GB) and megabytes (MB) you are probably more used to, but there is a way around
    this. Many commands accept a flag, or option, to further fine-tune the command
    performs. These flags are written directly after the main command and are preceded
    by a space and a hyphen.


    In this case, you can try using the -h (human readable) flag to have your figures
    come out in the way you are most familiar. Try this by typing df -h on the command
    line and pressing ENTER. The output should now appear in a more familiar format
    (see Figure 9-6).'
