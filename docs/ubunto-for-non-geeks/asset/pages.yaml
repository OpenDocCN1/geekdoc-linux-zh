- img_proc: true
  md: 'The second group consists of the following:


    +   * Read

    * Write

    * Execute


    You might already be able to figure out how this is all going to work, but I''ll
    spell it out just in case your intuition is won out for the day. Let''s say you
    change the permissions of a file (butterhaters.txt, for example) so that all users
    on your machine can read and write to it. After opening a Terminal window, you
    can make the change by using chmod -a+w butterhaters.txt and pressing ENTER.


    Oops! Remember that you don''t want anyone changing the content of the file, eh?
    Well, to take back the permissions for that file, you just need to type chmod
    -a-w butterhaters.txt and then press ENTER. You can see, the + gives permissions,
    while the - takes them away.

    That''s much simpler, you''ve got to admit.


    # # sudo


    When you run the Ubuntu Software Center in Chapter 6, you were first asked to
    input your password before you could run the program. The reason for this, as
    I mentioned, is that the Ubuntu Software Center installs the files it downloads
    in various folders over your system, almost all of which are write protected.
    By supplying your password, you are telling your system that, as holder of the
    password, you have the right to allow the Ubuntu Software Center to do that.


    The command version of that same password-giving process is the sudo command.
    To perform an operation in a folder that is write protected, you would first type
    `sudo` and then the command you want to perform. For example, if you wanted to
    `cp` an icon image, let''s call `myicon.png` to the globally located and write-protected
    `pixmaps` (`/usr/share/pixmaps`), you would type `sudo cp myicon.png /usr/share/pixmaps`


    After typing a command preceded by the sudo command and pressing ENTER, you will
    be prompted for your password. Once you type your password and press ENTER again,
    the command will be executed. I should mention that once you input your password,
    it will stay in memory for about five minutes. This means that you will not be
    prompted for your password when using the sudo command again within that time
    frame.


    # # locate


    Now that you are familiar with the sudo command, let''s take it out for a spin
    by working with the locate command. The locate command is essentially a command-line
    alternative to the graphical Search tool found in the Places menu. Using the command
    is quite easy: Simply type the command followed by a space and the name of the
    file you want to find.'
