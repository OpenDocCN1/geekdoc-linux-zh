    ![](img/add8efd602aad9815ee8abf27a7a293e_299_0.png)


    # Project 14B: Listening to Streaming Media with Rhythmbox


    In addition to allowing you to play CDs or the music you have stored on your hard
    disk, Rhythmbox also allows you to play Internet radio streams in either MP3 or
    Ogg Vorbis format. To add a stream, click the Radio icon in the left pane of the
    Rhythmbox window—you will come face to face with only dozens stations first time
    around. In this project, I will try to fatten up your collection a bit by showing
    how you can add streams on your own.


    # 14B-1: Adding Radio Streams to Rhythmbox


    To started, let''s try adding FIP, a French music station specializing in the
    eclectic. The process for adding FIP is essentially the same as adding any other
    stream. Here are the steps:


    +   1. Click Radio in the left pane of the Rhythmbox window.

    2. At the right end of the button strip below the menu bar, click the Create new
    Internet Radio Station button (the one that looks like a little red radio).

    3. In the window that appears, type http://www.tv-radio.com/station/fip_mp3/fip_mp3-128k.m3u/,
    and click Add.

    4. Double-click the new entry for your stream to play it.'
