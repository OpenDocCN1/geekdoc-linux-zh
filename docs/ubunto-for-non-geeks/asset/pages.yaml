  md: '# 3


    # # A NEW PLACE TO CALL HOME


    Getting to Know the Desktop


    ![](img/add8efd602aad9815ee8abf27a7a293e_56_0.png)


    Now Ubuntu is up and running, and you are ready and rarin’ to go. If you are running
    Ubuntu from your hard disk, you will first see the login screen that will appear
    each and every time you boot up (Figure 3-1). There’s no need to keep the login
    screen waiting, so click your username, type your password, and press ENTER. Within
    moments, you will be face to face with your desktop in Ubuntu.


    # Welcome to the GNOME Desktop


    Figure 3-2 shows Ubuntu’s implementation of the GNOME desktop, and as you can
    see, it''s not all that is different from what you might be used to in a Windows
    or Mac OS environment, other than that it has taskbars, *panels*, at both the
    top and the bottom of the screen. There are also no desktop icons, except when
    running a live session from the Ubuntu Desktop CD, in which case you''ll see a
    launcher to run the installation wizard (labeled Install Ubuntu 10.04) and an
    Examples folder, which contains a number of sample'
  merge: -1
  pgno: 56
- img_proc: true
  md: '![](img/add8efd602aad9815ee8abf27a7a293e_57_0.png)


    Figure 3-1: The Ubuntu login screen


    files for many of the applications that come bundled with Ubuntu. All in all,
    it is a very uncluttered place to be, and despite its superficial similarities
    to other OS desktop environments, things in the GNOME are different enough to
    be interesting.


    The main elements of the GNOME desktop are the panels at the top and bottom of
    the screen and the icons that appear upon those panels. The desktoptop itself,
    although empty at startup, does see its share of action, but I''ll come to that
    later. For now, I''ll focus on the two panels.


    ![](img/add8efd602aad9815ee8abf27a7a293e_57_1.png)


    Figure 3-2: The GNOME desktop in Ubuntu


    26 Chapter 3'
