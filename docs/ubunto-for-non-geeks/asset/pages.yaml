    # Reinstall Ubuntu


    It pains to say it, but if you just can''t fix the problem no matter what you
    try, it might be worth reinstalling Ubuntu. To do this, follow the instructions
    in Chapter 2. You might need some advice on manual partitioning from Appendix
    C too.


    Before you reinstall, remember to back up all files that you want to keep. You
    can do this by copying them to an external hard disk or USB memory stick while
    you''re running the live CD—all you need to do is access the files of your hard
    disk as described in "Project 18A: Accessing Files on Your Windows Partition (for
    Dual-Booters)" on page 324 (but mount your Ubuntu partition rather than your Windows).


    # Windows Won''t Boot


    If you installed Ubuntu in a dual-boot setup, you may find that the computer restarts
    or displays an error when you try to boot Windows instead of Ubuntu. Dual-boot
    Windows setups sometimes have a problem with hibernation and disk checking, so
    try the following steps to see whether you can get it working


    +   1. Boot into Ubuntu, and mount your Windows partition (see Chapter 18 for
    details on how to do this).

    2. Find hiberfil.sys (it should be in the top-level folder of your Windows partition,
    as shown in Figure 21-6), and rename it something like old_hiberfil.sys. This
    will cause Windows to ignore all of the hibernation information it has stored.

    3. Restart your computer, and boot into Windows by selecting it from the GRUB
    boot menu. Ideally, Windows will now boot.


