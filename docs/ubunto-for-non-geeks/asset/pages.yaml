    can also print a copy of the layout from this window by clicking the **Print**
    button.


    If you just to choose a single keyboard layout to replace your current one (such
    as British English instead of American English or German instead of Spanish),
    you can do so from the Keyboard Preferences window. Simply add the keyboard layout
    you want to use, and remove any additional layouts by clicking each one and then
    clicking the **Remove** button.


    # Chinese, Japanese, and Korean Input


    For most European languages (and many other alphabet-based non-European languages),
    pressing a letter on the keyboard simply prints that letter to the screen. However,
    Chinese, Japanese, and Korean require a kind of conversion process that is handled
    by a special application (actually a set of applications)'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'called an input method editor (IME). Each of these languages has its own IME,
    and each is quite different because of the basic differences in the three writing
    systems.


    # Chinese


    Although most people (at least those in the linguistic know) would think that
    Chinese would be the most complicated system, because the writing system consists
    of thousands of characters, it is in fact the simplest. The Chinese IME simply
    takes the Romanized keyboard input, known as pinyin, and converts it into Chinese
    characters, or Hanzi. For the IME, it is essentially a simple dictionary lookup—big
    dictionary, simple IME. In the first line, in the event that there is more than
    one character for the pinyin input, a list of possible candidates will appear,
    and the user can then select the appropriate character from that list. More recent
    Chinese IMEs also have predictive capabilities, which they judge what one you
    are trying to type on the basis of what you''ve typed so far (Figure 11-6). Although
    these more “intelligent” IMEs can be a bit squirrelly to use at first, they do
    be rather handy once you get the hang of things.


    他还没有输入


    +   (1 / 22)

    1. 臺

    2. 会

    3. 回

    4. 拼

    5. 理

    6. 无

    7. 饮

    8. 结


    ![](img/add8efd602aad9815ee8abf27a7a293e_248_0.png)


    # Japanese


    The Japanese IME has a considerably more complicated task to perform, because
    it has three writing systems to deal with: Kanji (ideographic characters borrowed
    long ago from China), hiragana (the phono-alphabetic system used mainly for tense
    and case endings), and katakana (used mainly for words borrowed from other languages).
    So, the standard input method for Japanese is primarily by the standard Roman
    keyboard layout, plus a few extra special keys. Thus, typing in Japanese is a
    two-step process where the IME converts the Romanized text into hiragana as it
    is typed and then converts it to appropriate Kanji, katakana, or hiragana elements
    after the spacebar is pressed.


    You can see an example of these steps in Figure 11-7. In the first line, the IME
    has already converted the Romanized input on the flow. It has converted rinakkushidenihonyuuryokogamadeimisu
    (which means you can input Japanese'
  merge: -1
  pgno: 248
- img_proc: true
  md: 'in Linux) to hiragana. When a line of hiragana is highlighted, it means that
    the line has not yet been converted beyond that. In the second line, however,
    the user has subsequently pressed the spacebar, which caused the IME to convert
    the hiragana string into the appropriate Kanji, hiragana, and katakana elements.
    The first word, Linux, has been converted to katakana text, because it is a borrowed
    word, while Japanese input has been converted to Kanji; the rest stays in hiragana.


    りなっくすでにほんごにゅうりょくができます。


    リナックスで日本語入力ができます。


    Figure 11-7: IME conversions while typing in Japanese


    # Korean


    The job of the Korean IME is again quite different from that of the Chinese and
    Japanese IMEs, because the language is in a very different way. Korean is written
    entirely in alphabetical letters, called Hangul, or in a combination of Hangul
    and ideographic characters borrowed from Chinese Hanja. While the Hanja characters
    are essentially the same as their Chinese and Japanese counterparts, Hanzi and
    Kanji, the Korean phonetic alphabet, Hangul, has its own unique appearance, as
    you can see in the Korean word for Korea, Hangul(k), in Figure 11-8.


    ![](img/add8efd602aad9815ee8abf27a7a293e_249_0.png)


    Figure 11-8: Korea [Hangul] written horizontally in Hangul

    This seems simple; however, the representation is not quite correct, because Korean
    is very unique in the way that its alphabetical characters are put to the page.
    Unlike the usual side-by-side positioning of hiragana, katakana, and most other
    languages written with an alphabet, Hangul letters are grouped in pairs, triplets,
    or even quadruquadruplets, which are written, as a general rule, clockwise. The
    IME, therefore, must take the input (usually based on a Korean alphabetical keyboard
    layout) while it is being typed, and it must adjust the size, spacing, and positioning
    of each of the letters as it puts them into appropriate clusters (see Figure 11-9).'
  merge: -1
  pgno: 249
- img_proc: true
  md: '![](img/add8efd602aad9815ee8abf27a7a293e_250_0.png)


    Figure 11-9: An example of the clustering process in the Korean IME


    # # Project 11: Setting Up Asian-Language Support


    What do you do if, for example, you want to be able to type Chinese, Japanese,
    Korean, Hindi, Thai, or Nepali while still in your usual English environment?
    What if you want to be able to type all of those languages in the same document?
    Can you do it?


    You bet. There are actually several ways of going about this, but the default
    method in Ubuntu is the easy-to-use Intelligent Input Bus (IBus). It supports
    most Asian languages, including Chinese, Japanese, and Korean, and it provides
    a number of input methods for many of these.


    # ## 11-1: Selecting Input Method Modules


    The first thing you will need to use IBus is the appropriate input modules for
    the language(s) you want to input. To do this, go to the System menu, select Preferences
    > IBus Preferences. A window will appear asking you whether you would like to
    start the IBus daemon. Click Yes, after which another window may appear telling
    you that if you cannot get IBus to work, Click OK in that window. (Fortunately,
    these two windows will appear only when you first start IBus.) The IBus Preferences
    window will appear again. Click the Input Method tab.


    > A daemon is a program that runs in the background, unnownst to the average user,
    providing a system with added functionality. In the case of IBus, that added functionality
    is the ability to input complex character sets.


    On that tab, click the Select input method drop-down button, select the input
    method you require, and then click Add. The input method you just added will then
    appear in the main pane of the window beneath the default method, English. Repeat
    the process for any other input methods you want to add. When done, your window
    should look like a variation of what you see in Figure 11-10, depending on which
    languages you actually select. When you''re done making your selection, click
    the Close button.'
