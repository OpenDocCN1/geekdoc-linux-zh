    It is probably worth mentioning that the files you copy to the CD/DVD Creator
    are not actually copied. Instead, you see in the CD/DVD Creator window are essentially
    links pointing to the original files in their original locations. That, if you
    move one of the files from its original location before burning the contents of
    the CD/DVD Creator to disc, the link won''t work anymore and the file won''t be
    copied onto the disc. This isn''t too much of a problem, since all of the other
    files will be put onto the disc correctly, but it is something worth being aware
    of.'
