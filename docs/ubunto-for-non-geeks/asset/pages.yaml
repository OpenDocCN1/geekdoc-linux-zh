  md: '# # 11


    # # POLYGLOT PENGUINS


    Linux Speaks Your Language


    ![](img/add8efd602aad9815ee8abf27a7a293e_242_0.png)


    These days, almost all operating systems are multilingual, or at least capable
    of becoming so. This is true of Linux as well.


    Just open your web browser and, without performing any special installations,
    you can read pages in any European language, including those with Cyrillic alphabets,
    such as Russian. You can even view pages in Chinese, Japanese, Thai, Arabic, and
    Hebrew, to name but a few.


    But the multilingual capabilities of Linux are much greater than this, and the
    way that it handles multilingual matters makes it quite easy to take advantage
    of these capabilities. As you will soon see, you can even set up your system to
    give you a totally foreign language environment, allowing you to'
  merge: -1
  pgno: 242
- img_proc: true
  md: 'function completely in the language of your choice. Add this to the ever-expanding
    number of free programs available for language study, and you have a truly meaningful
    language-learning tool.


    # Read-Only Language Support


    If all you want is be able to read web pages or documents in a foreign language,
    you don''t need to install any additional language support except in some rare
    cases. From the get-go, you will be able to view documents in just about any language
    you happen to throw at your system—it doesn''t matter if it''s Swedish, Italian,
    Chinese, Japanese, Arabic, Hebrew, Russian, Vietnamese-Eastern, Armenian, or Thai.
    You will be able to read whatever you are linguistically capable of reading (see
    Figure 11-1 for an example).


    ![](img/add8efd602aad9815ee8abf27a7a293e_243_0.png)


    Figure 11-1: A Japanese web page displayed in Firefox


    Firefox usually automatically recognizes the language in a web page is written
    and thus displays the page correctly. Sometimes, however, the author of the page
    may neglect to include the character coding for that page in the HTML, not knowing
    that the page is prepared in another language, will very often open it in the
    default language of your system. The result is a page in which you see nothing
    but odd combinations of symbols and letters that have no meaning. In this case,
    changing the character coding in Firefox to the language encoding you believe
    to be. Some languages employ more than one encoding scheme, so if you''re not
    sure, give each a try. You can make your choices by going to the Firefox View
    menu and selecting Character Encoding. From the submenu there, you can select
    the appropriate coding for the language of that page.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# Typing Nonstandard Characters


    Typing characters that are not standard in English, such as é, §, ß, θ, æ, and
    &, can be done easily in Linux without any modifications. In most situations,
    you can do this by using the Character Map utility included in your system, which
    can be found at Applications ▸ Accessories ▸ Character Map. Upon running Character
    Map, a window like the one shown in Figure 11-2 will appear.


    ![](img/add8efd602aad9815ee8abf27a7a293e_244_0.png)


    Figure 11-2: Inputting characters with the Character Map utility


    To input the character you want, just select the language or character set in
    the left pane of the window, and then, in the right pane, double-click the character
    you want to input. The character will appear in the little input box next to the
    Text to copy at the bottom of the window. Just click the Copy button, and then
    paste the character wherever you want to place it.


    OpenOffice offers a method of its own that you can use. Click Insert in the menu
    bar, and then select Special Character. A selection window will open, and then
    you can select the character you want there. Once you''ve done that, click the
    OK button, and the character will appear in your document, Double-linking the
    character you want will also accomplish the same thing.


    # Using the Compose Key Option


    If you need to type an accent or umlaut only once in a while and don''t feel particularly
    keen on opening an application or going to a special menu to do so, using the
    compose key option for your keyboard is a good way to do. Basically this means
    you use one of the lesser-used keys on your keyboard in conjunction with six symbols
    ('', ''~'', ''"'', ^) to help in the creation of, so to speak, of accented characters.'
  merge: -1
  pgno: 244
- img_proc: true
  md: 'Before you can use this feature, you have to select which key you want to use
    as your compose key. For this example, I''ll use the right ALT key, since most
    people don''t use it much. Here''s what you need to do:


    +   1. Go to the System menu, and select Preferences ▸ Keyboard.

    2. In the Keyboard Preferences window that appears, click the Layouts tab, and
    then click the Options button.

    3. In the Keyboard Layout Options window, click the + button next to the words
    key position.

    4. Check the box next to the key you want to use as your compose key (Figure 11-3).
