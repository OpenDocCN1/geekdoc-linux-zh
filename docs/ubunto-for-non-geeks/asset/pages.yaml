  md: '# Rhythmmbox—Your Audio Player


    The main audio player in Ubuntu is Rhythmbox (see Figure 14-2), which seems to
    function much like a simplified version of Apple’s iTunes application. It is a
    relatively easy-to-use audio player that, despite some quirkiness in its early
    stages, has developed quite a following in the Linux world. To run Rhythmbox,
    just go to the Applications menu and select Sound & Video > Rhythmbox Music Player.


    ![](img/add8efd602aad9815ee8abf27a7a293e_295_0.png)


    > Figure 14-2: The Rhythmbox audio player


    # Adding Songs and Albums to the Rhythmbox Library


