    the change, use the Ubuntu Software Center to install **Startup-Manager**, and
    then open it by selecting **System > Administration > Startup-Manager**. You''ll
    probably be asked to **enter your password**, so do that and then wait a while
    as it loads. Click the **Boot options** tab in the Startup-Manager window (Figure
    185), and select Windows from the **Default operating system** drop-down list.
    The actual name of the Windows option will'
