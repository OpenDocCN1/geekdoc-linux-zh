  md: 'To actually scan something, place your photo or document on the scanner bed,
    and click the Acquire preview button in the bottom-left corner of the XSane window.
    Once the preview appears, use the selection tools to define the exact area you
    want to scan, and then choose your resolution and color depth in the main XSane
    window. When everything is ready, click the Scan button. Your scanned image will
    then appear in a Viewer window (as shown in Figure 10-13).


    ![](img/add8efd602aad9815ee8abf27a7a293e_237_0.png)


    **Figure 10-13:** The results of your scan are displayed in a separate Viewer
    window.


    In that window, you can perform some minor tweaks of the scanned image using the
    buttons and menu items provided and then save the image by selecting **File >
    Save image**.


    If you want to convert a scanned document into a text file, you''ll first have
    to install the Gocr package using the Ubuntu Software Center. Gocr performs a
    process called optical character recognition, which tries to figure out what text
    the image contains by recognizing the shapes of individual letters. (It works
    for typed text, not handwriting).


    Once Gocr is installed, scan your document to XSane as before. This time, click
    the second button from the left (the one that says ABCDEF) before you click Save
    image, and you will find that you can save it as a text document as well. The
    text recognition is not perfect, so make sure you go over the text file to look
    for typos afterward.


    XSane has plenty more tricks up its sleeve—visit http://www.xsane.org/doc/xsane-xsane-doc.html/
    for information on what features are available and how to use them.'
