    # A Couple of Other Cool Totem Features


    Totem has a couple other cool features that you might like to know about. One
    is its ability to perform screen captures of whatever video you happen to be viewing
    at the time. Just select Edit ▶ Take Screenshot, and you''ve got yourself a screen
    capture—a still image taken from a video file.


    Another feature worth mentioning is Totem’s Sidebar. As you no doubt noticed,
    at the bottom-right corner of the Totem window there is Sidebar button. If you
    click this button, a new pane will open at the right side of the Totem window.
    In that pane you can select and listen to BBC podcasts; search for and watch YouTube
    videos (Figure 16-4); and load, create, and play playlists. You can select from
    among these various functions from the drop-down menu at the top of the Sidebar.


    The playlists you create can consist of any combination of supported video or
    audio files, providing you with the whole multimedia banana. Any time you play
    a file in Totem, that file appears in the Playlist pane, and you can also add
    items to the list by simply dragging the files from your desktop or any Nautilus
    window.'
