  md: '# 3D Games


    Most of the games I''ve mentioned so far are a little, well ... two-dimensional.
    Sure, 2D games can be fun—I certainly lost a significant portion of my life to
    Sudoku—but they don''t have the excitement factor that you get from shooting hordes
    of aliens or crashing a high-powered sports car into a wall. Unfortunately, games
    designers have traditionally neglected Linux to concentrate on the significantly
    larger Windows market, so until a couple of years ago there were few Linux-friendly
    3D games to choose from. The penguin has in popularity, however, people have started
    to notice, and more Windows games now come with a Linux version.


    The open source gaming community has on leaps and bounds too, in this section
    I''ll run through a few of my favorites, after first making sure that your computer
    can handle the strain of 3D graphics.


    # Checking for Hardware Acceleration


    To play 3D games, you need a graphics card that can handle hardware acceleration.
    Without hardware acceleration, your computer''s processor has to try to do all
    of the graphics rendering itself (a task for which it isn''t designed), so your
    games end up running at a snail''s pace, if at all. Most modern graphics cards
    have hardware acceleration support built in, but whether it is enabled will depend
    on the state of the Linux driver for your card. You can find out how good 3D support
    is for your graphics card at https://wiki.ubuntu.com/HardwareSupportVideoCards.


    If you want to know whether you have the minimum level of acceleration to play
    games, open a Terminal (**Accessories ▸ Terminal**), type glxinfo | grep rendering,
    and press ENTER. (That vertical line is the "pipe" and can normally be inserted
    by pressing SHIFT + on your keyboard.) If you get a message telling that glxinfo
    isn''t installed, use the Ubuntu Software Center to install mesa-utils and then
    try again.


    If hardware acceleration is enabled, you will see direct rendering: yes appear
    in the Terminal. That''s good news, because it means you can skip to the next
    section and put your teeth into some three-dimensional gaming goodness.


    If you received the message direct rendering: no instead, you will need to install
    different graphics drivers if you want hardware acceleration to work. See "Games/Compiz
    Don''t Work: Installing Accelerated Graphics Drivers" on page 394 for instructions.


    NOTE Many of the default graphics drivers for Linux can''t handle anti-aliasing,
    which is the feature that removes jagged edges from graphics, making them look
    smoother and more life-like. If you can''t live without anti-aliasing, you should
    also see Chapter 21 for information on installing a better graphics driver.'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# Shooting Games


    Like many people, my first real 3D gaming experiences were first-person shooter
    (FPS) games. In fact, I still have a soft spot for Doom, arguably the granddaddy
    of all FPSs. What could be fun than battling endless waves of hellish monsters
    in a military outpost on Mars? Nothing!


    Doom looks a little dated nowadays, but if you have similarly nostalgic thoughts
    of this classic game, you will be pleased to know that a version is available
    for Ubuntu. It''s called Freededom (Figure 17-7), and you can install it from
    the Ubuntu Software Center (like all the games in this section).


    ![](img/add8efd602aad9815ee8abf27a7a293e_342_0.png)


    Figure 17-7: Freedom


    The gameplay in Doom may have aged gracefully, the graphics haven''t. If pixated
    blobs are failing to intimidate you, why not trying a little smoother, in the
    form of Neuxiz (Figure 17-8)? In terms of gameplay, Neuxiz feels similar to Unreal
    Tournament—you collect a wide array of weapons and power-ups as you run around
    dimly lit levels, shooting at opponents of varying levels (artificial) intelligence.
    As with most deathmatchstyle games, the aim is generally to be the last one, but
    there are other game modes, like "capture the flag." There''s also an online multiplayer
    option if you''re finding that the computer-controlled opponents aren''t providing
    enough of a challenge.


    Tremulous (Figure 17-9) is another popular open source FPS, although its gameplay
    also contains elements of real-time strategy. You play online, the side of either
    humans or aliens. As you work to destroy the opposing team, you build structures
    and collect power-ups to gain as much of an advantage as you can. It can get quite
    involved, so I recommend that you read the notes at http://www.tremulous.net/
    before you begin playing.'
