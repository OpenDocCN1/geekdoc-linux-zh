  md: '# Taking Screenshots


    Now that you know how to make your Ubuntu desktop look a bit more like yours,
    you might want to share or record the results of your artistic endeavors, and
    taking screenshots is the way to do just that. The easiest way to go about this
    is by selecting Applications > Accessories > Take Screenshot.

    The Screenshot application, shown in Figure 8-24, will appear. In this window
    you can decide whether you want to take an image of the whole screen, a section
    of the screen, or a selected window. You can also apply a delay before the screenshot
    is taken to give yourself some wiggle time. You can even add effects to your window
    shots, such as a drop shadow.


    ![](img/add8efd602aad9815ee8abf27a7a293e_181_0.png)


    Figure 8-24: Taking a screenshot in Ubuntu


    When you''re ready, click Take Screenshot, and a window like the one in Figure
    8-25 will appear. In that window, you can name the image and decide where to save
    it.


    ![](img/add8efd602aad9815ee8abf27a7a293e_181_1.png)


    Figure 8-25: Saving a screenshot in Ubuntu


    If you prefer, it is also possible to take screenshots via key combinations. To
    take a shot of the entire screen, just press the PRINT SCREEN key. To take a shot
    of a single window, press ALT-PRINT SCREEN.


    If you try taking screenshots of single window, you may find the window borders
    refuse to appear no matter what you do. This is not a problem with the screenshot
    mechanism but rather a side effect of your system''s visual effects engine, Compiz,
    which I''ll talk about more in the next section. One'
  merge: -1
  pgno: 181
- img_proc: true
  md: 'solution is to use the GIMP for your screenshot-taking chores (discussed in
    Chapter 13). Alternatively, you can just shut off Compiz: Select System > Preferences
    > Appearance, and click the Visual Effects tab in the Appearance window that appears.
    Once on that tab, select None (Figure 8-26); the change should take place almost
    immediately, and once it does, you can close the Appearance Preferences window
    and try taking your screenshot again.


    ![](img/add8efd602aad9815ee8abf27a7a293e_182_0.png)


    Figure 8-26: Shutting off Compiz using the Visual Effects tab


    # Customizing Visual Effects


    Having learned how to customize your system using the more traditional tools at
    your disposal, it''s time to let loose and have some fun with the newest tools
    the Linux world has to offer. Compiz, Ubuntu’s visual effects engine, provides
    all sorts of wild and interesting visual effects for your desktop.


    Compiz will be automatically enabled at startup only if you have a graphics card
    that supports its basic set of features. An easy way to tell whether Compiz has
    kicked in on your machine is to open any window (your home folder, for example)
    and then check to see whether window has a drop shadow (see Figure 8-27 for an
    example). If it does, Compiz is at work.'
  merge: -1
  pgno: 182
- img_proc: true
  md: '![](img/add8efd602aad9815ee8abf27a7a293e_183_0.png)


    The effects that are active by default are really the tip of the iceberg. Depending
    on the capabilities of your graphics card, you will get the drop shadows and a
    few other bells and whistles, as cooler window-opening transitions, that''s about
    it. .. on the surface, at any rate. If you like, you can kick the effects up a
    notch by selecting **System > Preferences > Appearance**, clicking the **Visual
    Effects** tab of the Preferences window, and finally selecting **Extra** in tab.


    I should warn you not be freaked out at first when you try to move your windows
    and they start wiggling like jelly—that''s one of the additional effects (Wobbly
    Windows).


    # **CompizConfig Settings Manager.**


    Once the CompizConfig Settings Manager is installed, you can see everything Compiz
    is capable of doing, and you can pick and choose from features as you see fit.
    Although most of what Compiz has to offer is essentially eye-candy (which this
    chapter is all, after all), there are some functional utilities and extras. A
    favorite of mine is the Annot tool, which allows you to write over your screen
    while making presentations, brainstorming, or just flipping out (shown in Figure
    8-29).


    To activate the Annot tool—or any other Compiz feature—open the CompizConfig Settings
    Manager, and check the box next to its name. To figure out how to actually use
    what you''ve enabled, click the name of the feature. This will open a tab showing
    its settings, including the keystrokes needed to initiate that feature (Figure
    8-30).'
