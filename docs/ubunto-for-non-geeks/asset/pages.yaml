    # Virtual Desktops


    It is now time to discuss a rather convenient feature of Linux: virtual desktops.
    Although the virtual desktop feature has only recently made its way into other
    operating systems, it has been a Linux feature for years (yes, it started here,
    folks). But rather than babble on what what virtual desktop business is and what
    it can do for you, its probably best to learn about it by giving you some hands-on
    experience.


    In your GNOME panel, click the Wanda (Fish), OpenOffice.org Writer, and Firefox
    launchers. You will then have three windows open in your present desktop, or workspace.
    Now look at the Workspace Switch to the right of the bottom panel. There should
    be four boxes, with the one on the left (your workspace) in light grey. If you
    click the box next to that, not in dark grey, all your open windows suddenly disappear.


    Actually, nothing has really disappeared—you are just viewing a new desktop. All
    your other windows are still open and running in the previous desktop.'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'In this second desktop, you can open something else: Select Applications Games
    AisleRiot Solitaire. The AisleRiot Solitaire card game will appear.


    You now have windows in two different desktops, and you can switch back and forth
    between them. To do so, just go to the Workspace Switcher in your panel, and click
    the gray left box, which will take you to your original desktop. Once you''ve
    done that, the box for the workspace you were in will turn dark gray, and you
    can then click one to go back to your game desktop.


    As you imagine, this feature has some potential benefits for you, in addition
    to helping you avoid clutter. Just imagine that you are working some long document
    in OpenOffice.org Writer. Eventually, you get tired and decide to go off by playing
    a game, as Mines, for a while. A bit later, when you notice your boss making the
    rounds of the office, you simply switch back to the first desktop so that you
    look busy when he walks by and asks, “Keeping yourself busy, Boaz?”


    Phew!

    By the way, you can also switch to virtual desktops by simultaneously pressing
    and holding CTRL-ALT and then pressing your left and right arrow keys to move
    to your targeted desktop.


    So, what happens if, let''s say, you''re running OpenOffice. Writer in one workspace
    and the GIMP in another but think it would be handy to have both running in the
    same workspace? Do you quit the GIMP and start it up again in the other desktop?
    Fortunately, things are much simpler than that, and there are actually two ways
    to get the job done.


    The first of these is to right-click the bar of the window to move it, and select
    Move to Workspace Left or Move to Workspace Right. You can also select Move to
    Another Workspace and select the workspace you want to move the window to number:
    Workspace 1, Workspace 2, Workspace 3, and so on.


    If you prefer keeping your hands off your keyboard than on your mouse, you can
    also move a window from workspace to workspace by using hotkeys. With the window
    you want to move active (on top of the pile, to speak), use the left and right
    shortcut keys to move the window to the desired desktop


    # Wanda Revisited——GNOME Easter Eggs


    Well, now that you''ve finished with your work in this chapter, it''s time to
    go around a bit by revisiting our precocious piscine pal, Wanda. Knowing what
    you do now to Wanda the fish, you might find it odd for me to start talking about
    her again, but Wanda has a few more tricks benefit her fins. In fact, she is a
    good means to introduce two of GNOME’s most famous Easter eggs. Easter eggs, in
    case you don''t know, are hidden snippets of code that programmers seem to love
    to sneak into their programs. They are usually useless things, but they can be
    found in all operating systems, numerous applications, and even on DVDs (to find
    out more about those, go to http://www.dvdeasterggs.com/). A good example of Easter
    egg is my first'
  merge: -1
