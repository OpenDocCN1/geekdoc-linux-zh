    # ## 3B-2: Changing the Order of Icons Within Menus


    While you have everything open to the Office menu, let''s deal with what I consider
    to be another problem: the order of the items in the menu. It just doesn''t make
    sense to me to have what is arguably the most commonly used office application,
    your word processor, way down there at the bottom of the menu.


    Remedying this situation is easy. Just click the **OpenOffice.Word Processor**
    in the right pane of the menu editor window. Then click the Move Up button on
    the right side of the window as many times as necessary until the Word Processor
    icon is right there at the top of the list.


    Now that your word processor is up at the top of the menu, the other OpenOffice.modules
    seem a bit out of place down at the bottom, so you might move all other OpenOffice
    modules up near the top too by using the same method.


    While I''m being logical and all, why not make things go even better by getting
    the Evolution launcher out of the Office menu and moving it over to the Internet-menu,
    which seems a far more natural place for it to be? If you agree and want to hide
    this instance of Evolution, just un the box next to it. The name of that entry
    should then switch to italic typeface, indicating that the item in question will
    not be visible in the actual drop-down menu. Once you''re done, your menu editor
    window should look like mine in Figure 3-15. If all seems fine to you, click **Close**
    and then select **Applications** to check out the results.'
