  md: '# Converting Audio File Formats


    As I pointed out at the beginning of the chapter, there may be some points of
    incompatibility when it comes to certain audio file formats, your hardware, and
    Ubuntu. Fortunately, SoundConverter (shown in Figure 15-9) makes it easy to convert
    Ogg Vorbis files to MP3 format, or vice versa. It can also convert AAC files to
    MP3 or Ogg Vorbis format, if that is of interest to you. Because SoundConverter
    does not come bundled with Ubuntu, you will have to install it. To do so, just
    run the Ubuntu Software Center, search for soundconverter, and install the application.


    ![](img/add8efd602aad9815ee8abf27a7a293e_318_0.png)


    Figure 15-9: Converting audio file formats with SoundConverter


    To use SoundConverter, select **Applications > Sound & Video > Sound Converter**.
    Once SoundConverter starts, the songs you want to convert to the main pane by
    clicking either the **Add File** or **Add Folder** button. You can also drag audio
    files from your *Music* folder (or wherever else you store them).


    Once you have chosen the files to convert, you need to choose which format to
    convert them. You can do this by selecting **Edit > Preferences** and making your
    choice in the Preferences window (Figure 15-10). While you''re there, it is also
    a good idea to tell SoundConverter to convert your files in a location other than
    the folder where the original files are stored. Doing this prevents dealing with
    duplicates in Linux audio playback applications that automatically scan your *Music*
    folder, such as Rhythmbox. You might also want to check the **Create subfolders**
    to keep things organized.


    Once you have set things up and are ready to convert, click **Close** in the Preferences
    window, and then click **Convert** in the main window. SoundConverter will then
    begin doing its stuff.'
