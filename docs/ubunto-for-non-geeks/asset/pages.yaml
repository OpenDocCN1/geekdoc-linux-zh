    # Sharing Files with Windows Users on your Network


    One of the main reasons for connecting to a network (apart from accessing the
    Internet) is to share files between computers. You might be familiar with this
    concept already; network shares are used in many workplaces, and you may have
    even set up one before your home network. For the uninitiated, a network share
    is a folder on another computer that you can access if it were on your own. Files
    are transferred over the network, so there''s no need to use a portable hard disk
    or flash drive to get from one place to another.


    Accessing Files Stored on a Windows Computer Network shares are a two-way thing:
    You can either share your files with others by creating a shared folder or access
    shared folders created by other people. If you''re connected to a network of Windows
    computers, then you probably have some network shares already. I talked about
    browsing network shares in some of "Using Nautilus as a Network Browser" on page
    101, but to save the anguish of flipping back so many pages, here''s a quick outline
    of what you need to do to access a share from Ubuntu:


    +   1. Select Places ▸ Nautilus will open.

    2. Double-click the Windows Network folder to see a list of all the Windows computers
    connected to the network.

    3. Double-click one of the computers to see its shared folders.

    4. Pick a shared folder, and double-click it to access the files inside it.


    Making Your Files Accessible from a Windows Computer Since your Windows computers
    have so gladly made their files available on the network, let''s have Ubuntu reciprocate
    by sharing a folder of its own:


    +   1. Open Nautilus and find the folder you want to share; then right-click,
    and select Share Options.

    2. Check Share this folder in the Folder Sharing window that appears.

    3. You''ll be told that the sharing service is not installed—click Install service,
    and wait for the installation process to finish.

    4. Back in the Folder Sharing window (Figure 18-14), choose a name for the shared
    folder, and type a comment if you like.'
  merge: -1
  pgno: 368
- img_proc: true
  md: '![](img/add8efd602aad9815ee8abf27a7a293e_369_0.png)


    **Figure 18-14:** Sharing a folder on the network


    +   5. Check **Allow others to create or delete files in this folder** if you
    want other people on the network to be able to modify the files you have there.
    If you don''t check this option, others will only be able to read and copy these
    files.


    +   6. By default, only people with a user account on your computer can access
    your shared folders. To make it so anyone on the network can access your shared
    files, check the **Guest access** option.


    +   7. Click **Create Share** to finish up.


    Go to your Windows computer, and try to access the newly created share. Shared
    folders on Ubuntu computers can be accessed in the same way as any other share,
    so do whatever you would normally do to find it. (In Windows XP, for example,
    you''ll find it in your *Network Shares* folder.) If you can open a file in the
    shared folder, you''ll know that everything was set up correctly.


    If you don''t want to share a folder any more, right-click it in Nautilus, select
    **Sharing Options**, and uncheck **Share this folder.**'
