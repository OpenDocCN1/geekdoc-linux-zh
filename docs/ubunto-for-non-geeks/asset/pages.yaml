  md: "Other indicators will appear depending on your hardware configuration or system\
    \ status:\n\n**Bluetooth Manager** As the name implies. This appears only on machines\
    \ with Bluetooth capabilities.\n\n**Battery Indicator** On laptops, shows whether\
    \ you are using battery or line power and, if battery, the amount of power your\
    \ battery has remaining. \n\n# The Bottom Panel\n\nThe bottom panel, as you can\
    \ see in Figure 3-5, is a much simpler affair, containing only the four items\
    \ I will now briefly describe:\n\n+   **Show Desktop** A button that minimizes\
    \ all open windows and allows you to see your desktop when it is obscured from\
    \ view.\n\n+   **Window List** A list of windows or applications you have open.\
    \ If nothing is open, there will be no windows in the list. This is very similar\
    \ to what happens in the Windows taskbar.\n\n+   **Workspace Switcher** An application\
    \ that allows you to switch between virtual desktops. (I'll talk more about this\
    \ in \"Virtual Desktops\" on page 40.)\n\n+   **Trash** There is nothing mysterious\
    \ about the Trash . . . than its rather Mac OS X-ish location on the panel.\n\n\
    ![](img/add8efd602aad9815ee8abf27a7a293e_60_0.png)\n\nFigure 3-5: The bottom GNOME\
    \ panel\n\n# Project 3A: Customizing the GNOME Panel\n\nThe GNOME panel is not\
    \ a static thing. You can add launchers (respectively known as program shortcuts\
    \ or aliases to Windows and Mac users), utilities, and even moments to make it\
    \ do almost anything you want—within limits, of course. In the various stages\
    \ of this project, you will customize your panel to get hands-on experience with\
    \ it and make things more convenient for you as you make your way through the\
    \ rest of this book. You are, of course, free to change any of the customizations\
    \ I ask you to make (though you won't have a say in the matter if you're working\
    \ in a live session from the Ubuntu Desktop CD, because you won't be able to save\
    \ your settings).\n\nEach of the following subprojects is very simple. Most are\
    \ only three-step, point-and-click procedures that you should be able to handle\
    \ without difficulty."
