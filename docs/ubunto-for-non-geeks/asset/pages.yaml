  md: '# 10


    # GUTENBIRD

    Setting Up and Using Your Printer and Scanner


    ![](img/add8efd602aad9815ee8abf27a7a293e_224_0.png)


    Two of the most common computer peripherals are printers and scanners. This only
    makes sense, because it is those two tools that turn a web-surfing, game-playing,
    music-churning, number-crunching box of chips into a meaningful production tool—a
    virtual publishing house, if you will. These two tools help your computer convert
    digital information into hard copy (in the case of printers) and convert hard
    copy into digital information (in the case of scanners). It is not surprising,
    therefore, that these tools often come together in the form of multifunction printers.


    In this chapter, you will learn how to connect these useful devices to your computer,
    how to set them up, and how to use them. If you''re more into working with your
    digital camera than with a scanner, you might want to sneak a peek at Chapter
    13; otherwise, put on your printer''s smock, and read on.'
  merge: -1
  pgno: 224
- img_proc: true
  md: 'Unless the only thing you use your computer is for playing games, listening
    to MP3s, or stopping doors on hot, breezy days, you will no doubt want to hook
    up your machine to a printer. Despite the paperless-office era that the personal
    computer was supposedly going to usher in, it seems that the computer''s strength
    as a desktop-publishing and general work tool has producing high-quality printed
    documents an even more attractive proposition than ever before.


    # Confirming Your Printer Is Supported


    Setting up a printer to work with your new system is a pretty easy task, and it
    seems that printer support in the Linux world gets better with each release. In
    general, support for Epson, Brother, Samsung, and Hewlett-Packard printers is
    good, while support for other makers and other printer types is a bit spotier
    (though improving).


    If you really want to make sure your printer is supported, just try by following
    the instructions in the next section. If you are thinking about buying a printer
    or trying to decide whether to use Linux, go to http://www.linuxprinting.org/.
    On that site, you can check out the database to see whether your printer is currently
    supported and, to what degree. Lists for supported printers also include information
    on what drivers are best for your purposes. There is also a page of suggested
    makes and models, in case you''re considering buying a printer with the intent
    of using it with your Linux system. Read this before making your purchase decision.
    You might also want to consult Ubuntu''s lists at https://wiki.ubuntu.com/HardwareSupportComponentsPrinters/


    # Getting Ubuntu to Automatically Recognize and Set Up Your Printer


    Printer handling in Ubuntu is pretty much no-brerainer, because Ubuntu automatically
    detects most printers. If you have a USB printer, connect it to your computer,
    and then power up the printer (vice versa would work just fine, too). Assuming
    Ubuntu recognizes your printer, and chances are it, a small printer icon will
    appear in the upper-right panel while the system goes through its automatic setup
    routine. When it is done, a small notification bubble will like the one in Figure
    10-1 will appear, telling you that your printer has been recognized. There is
    nothing more for you to do in this case—your printer is set up and ready to roll.


    It is also possible, however, Ubuntu will recognize your printer but not find
    a driver that is an exact match for it. In this case, it will offer a substitute
    driver, and the autorecognition window will look slightly different from the one
    in Figure 10-1.'
  merge: -1
  pgno: 225
- img_proc: true
  md: '![](img/add8efd602aad9815ee8abf27a7a293e_226_0.png)


    Figure 10-1: Ubuntu lets you know it has automatically recognized and configured
    your printer.


    If you find yourself in this situation, it wouldn''t be a bad idea to print a
    test page to see whether the substituted driver works as it should. You can do
    this by clicking System ► Administration ► Printing and double-clicking your printer
    in the Printing window that appears. A Properties window will open; make sure
    that Settings is selected from the left of the window and then click the Print
    Test Page button (Figure 10-2). If the test page looks normal (something like
    Figure 10-3), things should be fine, and you can close the Printer Properties
    and Printing windows.


    ![](img/add8efd602aad9815ee8abf27a7a293e_226_1.png)


    Figure 10-2: Printing a test page with your new printer via the Printer Properties
    window


    If you have a printer that plugs into your computer''s parallel port, auto-detection
    and setup should also work if the printer was connected when you turned it on
    of the computer. If it was not, shut down your system and turn your computer off,
    connect your printer to the computer, turn on the printer, and then start your
    computer again. With luck, your printer should be recognized and set up automatically
    this time around. You can also try this same approach with a USB printer that
    was not recognized initially.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '![](img/add8efd602aad9815ee8abf27a7a293e_227_0.png)


    Figure 10-3: An Ubuntu test print page


    #  Manually Configuring Printers


    If your printer isn''t automatically recognized, you can still set up man-ually.
    Here''s what you need to do:


    +   1. Select System ▸ Administration ▸ Printing. A Printing window will appear,
    showing the printers that have already been recognized and/or configured.


    +   2. Click the Add button, after which the system will show any new finds in
    a New Printer window (Figure 10-4).


    +   3. Click the entry for your printer in the left pane of that window, and then
    click Forward.


    +   4. The system will then begin searching for drivers for your printer and will
    identify the make of your printer in the next screen of the wizard. Check that
    the correct make is selected, and then click Forward.


    +   5. On the next screen, your printer model should appear in the left pane,
    while the recommended driver will appear in the right pane (Figure 10-5). Click
    Forward.'
  merge: -1
  pgno: 227
- img_proc: true
  md: '![](img/add8efd602aad9815ee8abf27a7a293e_228_0.png)


    Figure 10-4: Setting up a printer manually


    ![](img/add8efd602aad9815ee8abf27a7a293e_228_1.png)


    Figure 10-5: The printer setup wizard recommends which driver to use.'
