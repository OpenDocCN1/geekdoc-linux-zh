  md: '# Project 13A: Importing Images from Digital Cameras


    Although scanner support for Linux can prove a bit spot, support for digital cameras
    is practically a worry-free affair. In fact, Ubuntu can''t figure out what kind
    of camera you have, it treats it as if it were an external drive or flash drive
    plugged into your computer''s USB port. And even if your camera doesn''t seem
    to communicate with your computer when directly, you can still transfer your images
    by removing the memory card from your camera, inserting it into a USB flash memory
    card reader, and reading that into one of your computer''s USB ports. In that
    case, your system will mount the card reader as if it were an external drive (which
    is pretty much what it is), allowing you to copy the images to your hard drive.
    Of course, you can use this method if your camera works just fine with Ubuntu—some
    people find it the easiest way to deal with things, anyway.


    # 13A-1: Importing Images from Camera to Computer Somewhat Automatically with
    F-Spot


    When you connect your camera to your computer via a USB cable, put your camera
    in play mode, and put it on, Ubuntu will usually recognize it and open a window
    that asks how you want to import the photos on the camera. To import the photos
    via F-Spot, accept the default selection in the drop-down menu button, Open F-Spot
    (as shown in Figure 13-1), and then click OK. After that, here''s what you need
    to do:


    +   1. In the window that appears, you will see thumbnails and filenames of all
    the photos on your camera. By default, all the images are selected. However, if
    you prefer to copy only some of the images, you can do so by holding down the
    CTRL key and clicking the desired images, as shown in Figure 13-2.

    2. Once you''ve made your selections, click the Target location button, and choose
    where to copy your photos. Your Pictures folder, or a subfolder within it, might
    a logical spot.

    3. You can also tag the photos you are about to import by checking the Attach
    tag and then selecting the desired tag from the menu button to the right. I''ll
    talk more about tagging in Project 13B-2.

    4. Finally, click the Copy button.'
  merge: -1
  pgno: 275
- img_proc: true
