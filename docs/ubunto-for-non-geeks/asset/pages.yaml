  md: '# 8


    # # DRESSING UP THE BIRD


    *Customizing the Look and Feel of Your System*


    ![](img/add8efd602aad9815ee8abf27a7a293e_154_0.png)


    Before entering the world of Linux, I had used just about every desktop operating
    system around. Despite the differences among them all, however, one thing that
    I eventually suffered from in each case was a kind of visual boredom. I suppose
    you might call it GUI fatigue. It wasn''t that I was tired of using a graphical
    interface; it was just that I couldn''t help get sick of looking at the old icons,
    window borders, and color schemes. Of course, there were some changes that could
    be made, but it wasn''t possible to get around the basic look and feel without
    add-ons that demanded a price in terms of performance.


    One of the features of Linux that pleased me to no end, and continues to do so,
    is that users can drastically change the look of things. I don''t mean just the
    icons and backgrounds but *everything*, including the actual window borders and
    controls. Add to the variety of graphical desktop environments and window managers
    available for Linux, and you have a totally customizable system. Is it any wonder
    that there are so many more Linux desktop screenshots'
  merge: -1
  pgno: 154
- img_proc: true
  md: 'on the Web for any other system? If you don''t believe me, just take a look
    at a site dedicated to Linux screenshots, http://www.lynux.org/, and click the
    Screenshots link.


    You may not be fickle as I am in terms of the look and feel of your system, but
    you can learn to use and enjoy all the graphical customization power that Linux
    offers you as work through this chapter.


    # Project 8A: Creating a New User Account


    If you are reluctant to alter the look of your current setup, you can create a
    new user account and experiment with making the changes in this chapter when logged
    in to the new account. If you opt for this route, your home environment will remain
    untouched, because look-feel customizations that are performed in one user account
    do not affect other user accounts. When you are all done with the project, you
    can simply delete the new user account. Either way, it''s up to you.


    # 8A-1: Creating the Account


    To set up a new user account, follow these steps:


    +   1. Select System ► Users and Groups.

    2. Once the Users Settings window appear, click Add. If asked for your password,
    type it into the box, and click Authenticate.

    3. In the Create New User window that appears (Figure 8-1), type a new username
    in the Short Name box; I''m using graphika for my example. In the Name field,
    you can type whatever you like; I''m using Graphics Lover.

    4. Click OK to add the new user. A Change User Password window will appear.

    5. Set the password by hand option should selected. Type a password for the new
    user; you should use numbers and letters in the password to make it difficult
    to guess. Retype the password in the Confirmation box to confirm your choice,
    then click OK.

    6. You''ll be taken back to the Users Settings window (Figure 8-2). Select the
    new graphika from the list on the left of the window, and then click the Change
    button next to where it says Account type.

    7. In the window that appears, give yourself the ability to install software and
    perform other administrative tasks in the new account by selecting Administrator.
    Click OK to return to the main Users Settings window.

    8. Click OK, and close the Users Settings window. The new account should be ready
    to use.


    > Normally, the privilege to install software and perform other system-wide changes
    (Administrator) is not selected by default on new user accounts, since you probably
    don''t want your kids, workmates, or anyone else with their user account on your
    computer installing all sorts of weird stuff and screwing up your system settings.
    We need it here because we''re going to be installing things, though.'
  merge: -1
  pgno: 155
- img_proc: true
  md: '![](img/add8efd602aad9815ee8abf27a7a293e_156_0.png)


    Figure 8-1: Creating a new user account


    ![](img/add8efd602aad9815ee8abf27a7a293e_156_1.png)


    Figure 8-2: The new user account displayed in the Users Settings window


    # 8A-2: Logging In to Your New Account


    To use this account, click the power button at the far right of the top panel,
    and click Log Out. A countdown will appear, but you can skip that; just click
    the Log Out button. After a few seconds, you will be back at the login screen.
    Click your username in window, type the password for the account, and press ENTER.
    You will soon be at the new, untouched desktop of your just-created user


    When you log out of a user account, all the programs you have running will be
    closed—if you were planning to use a different account for only a few minutes,
    it can be annoying to have to open everything when you get


    Dressing Up the Bird 125'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'back to the original account. Fortunately, there''s an alternative: You can
    temporarily switch users. Switching users differs from the logout/login approach,
    in that you remain logged in to your original account while you log in to your
    other account (or someone else with an account on your computer). This route keeps
    all the windows and applications you have open. These windows will not appear
    in the account you are switching to, but they will be there, waiting for you,
    when you switch back to the account from whence you came.


    This is a good way to proceed if you plan to switch back and forth between your
    two accounts. It is also a good approach when, say, your child needs to log in
    to their account for a moment to do a quick email check, burn a CD to play on
    the beach, or print a file for school. When your child is done, you can quickly
    get back to what you were doing without having to reopen files, web pages, or
    whatever else you happened to be dealing with at the time of the switch.


    You can switch users quite easily by clicking the power button on GNOME panel
    and selecting the account you want to switch. After a few seconds you will be
    asked for the password for the account selected, so type it into the box, and
    press the ENTER key. After that, you will be at the desktop of the selected account.


    To get back to your original user account after going the switch-user route, click
    the power button, click the username from which you came, and after a few seconds
    of darkness, a window will appear into which you must type the user password of
    the account you are returning to. Type your password, click Unlock, and you will
    be back at your original desktop, with everything as it was when you last saw
    it, opened windows and all. Pretty cool.


    # Project 8B: Customizing Your Desktop Environment


    Whichever user account you''ve decided to play with, you are now ready for action.
    By the end of the process, you will have created a much wilder and garier desktop
    environment than you''ve ever seen before. All of this is in good fun, of course,
    and when you are done, you should be able to completely and confidently customize
    things the way you want on yours. So, let''s go.


    # 8B-1: Adding Emblems to Folders


    One of the coolest icons about Nautilus is that it allows you to add little folder-top
    emblems. These emblems can graphically remind you what each folder is, and they''re
    not only for folders—you can add them to files too. The look of these emblems
    also changes when you change your desktop themes, so you''re in for more visual
    excitement later in this chapter. But for now, let''s learn how to use them by
    adding one to the Documents folder. Open your home folder, right-click Documents,
    and then select Properties in the pop-up menu. When the Properties window appears,
    click the Emblems'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'tab, and scroll down until you see the emblem called Personal (Figure 8-3).
    Click the checkbox next to it, and then click the Close button. The emblem should
    now appear later on your folder.


    ![](img/add8efd602aad9815ee8abf27a7a293e_158_0.png)


    Figure 8-3: Choosing emblems for your folders


    Now, for additional practice, try adding the Sound emblem to your Music folder.
    Just use the same steps as before, and substitute the appropriate items and entries.
    When you''re finished, you should have a Music folder that is surrounded by musical
    notes—one is the emblem, the other is the folder''s default icon. Not all folders
    have default icons, so that when emblems really come in handy.


    # 8B-2: Setting Window Backgrounds (and Emblems Again)


    Once you''ve added those emblems, your folders should look a bit spunkier (and
    you''ll make those emblems spunkier still in the chapter). Nevertheless, the background
    of the Nautilus window is still plain and white. You need not stand for that if
    you don''t want; you can change it as well. To do so, just go to your home window,
    click the Edit menu, and select Backgrounds and Emblems. The Backgrounds and Emblems
    window will then appear (see Figure 8-4).'
  merge: -1
