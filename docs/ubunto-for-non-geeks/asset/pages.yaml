    # Evolution with Evolution


    Evolution is the default email program in Ubuntu, and it is probably described
    as a better-groomed, spunklier clone of Microsoft Outlook (see Figure 5-12). It
    allows you to send and receive mail, make appointments, and keep a list of tasks.
    It can also filter junk mail, which is a necessity these days, and even synchronize
    with your PalmPilot, if you have one of those. If such things are important to
    you, it can connect to a Microsoft Exchange server.


    ![](img/add8efd602aad9815ee8abf27a7a293e_100_0.png)


    To start using Evolution, just click the icon (called the indicator applet) on
    the top panel, and select Set Up Mail > Applications > Internet > Evolution Mail.


    > The Set Up Mail option will change to just plain Mail once you''ve entered your
    account details.


    When you first run Evolution, you will be greeted by a setup wizard, where the
    account details you received from your email provider handy These should consist
    of your POP host address for receiving mail, your SMTP address for sending mail,
    and your mail password, which is often different'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'from your Internet logon password. Your mail password is not actually entered
    during the various wizard steps, so check the Remember password checkbox when
    filling in the POP details. When you first connect to your mail server, you will
    be prompted for your mail password, so you can type it at that time, and you won''t
    have to deal with it again.


    # An Email Alternative: Thunderbird


    Evolution is the most fully featured email software in the Linux world, despite
    its obvious attractions and popularity, I prefer the most straightforward Thunderbird
    for my email chores. In contrast to the multifunctional Evolution, Thunderbird
    (Figure 5-13) is a more mail-oriented program that is very yet includes most of
    the most important email functions you''ve come to, such as junk mail filters.
    It is remarkably similar to Windows Mail in terms of appearance and handling.
    The fact that Thunderbird is also available in both Mac and Windows versions means
    you may already be familiar with


    ![](img/add8efd602aad9815ee8abf27a7a293e_101_0.png)


    **Figure 5-13:** The Thunderbird email client


    Thunderbird does not come bundled with Ubuntu, so if you want to try it, you will
    have to download and install it yourself. Now that you have set up your machine
    to connect to the Internet, however you can do this after going over the contents
    of Chapter 6 (OK, so I''m jumping the gun bit again). Just do a search in the
    Ubuntu Software Center for Thunderbird, click the Thunderbird Mail/News item,
    and click to install it. You may be asked to type the password for your Ubuntu
    user account, so just do that and click Authenticate. Once it is installed, you
    can run Thunderbird by selecting Applications > Internet > Mozilla Thunderbird
    Mail/News.'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'As I mentioned, both Evolution and Thunderbird are equally capable and possess
    essentially the same features in terms of mail handling. The difference is primarily
    a look-and-feel matter. Why not try Evolution and Thunderbird and see which one
    you like?


    By the way, if you prefer Thunderbird to Evolution, you can add a panel launcher
    for it to make things easier on yourself when you want to run the program. Just
    go to Applications » Internet » Mozilla Thunderbird Mail/News, right-click that,
    and then in the pop-up menu that appears, select Add this launcher to panel.


    # Chatting with Your Friends via Empathy


    Email is an extremely useful tool, but there''s quite a delay between sending
    a message and getting a response. What if you fancy a quick chat? That''s where
    instant messaging comes in. If you''re not familiar with the concept, all you
    do is find your friend on an IM network and send a short message to them. Your
    message will show up on their screen in the blink of an eye. They can then reply
    to it, and you receive their reply just quickly. So it continues, until you goodbye
    and disconnect from the network.


    There are lots of different IM networks out there, such as AIM, MSN/Windows Live,
    and Yahoo! Messenger. You can usually talk only to those who are using the same
    network as you, and you''ll need an IM client to connect to any of them. Ubuntu
    comes preinstalled with a fully featured IM client called Empathy, which has the
    ability to connect to multiple networks at once.


    # Starting a Chat


    For this section, I''m going to assume that you already have a user account on
    an instant messaging network. If you don''t, you''ll need to go to the network''s
    website and sign up (most of them are free). Now that you have your account details
    ready, let''s get Empathy connected to your chosen network:


    +   1. Select System » Preferences » Messaging and VoIP Accounts. The Empathy
    Accounts window will open.


    +   2. Choose Yes, I''ll enter my account details now, and click Forward.


    +   3. Select your IM network from the drop-down list at the top of the window,
