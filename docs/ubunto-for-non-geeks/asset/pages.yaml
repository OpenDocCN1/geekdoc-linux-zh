    # Other Users on My Computer Can''t Connect


    If you have more than one user account on your computer, you might find that you
    can connect to the Internet, but other users can''t. To fix this problem, you
    need to make your network connection available to all users:


    +   1. While working in your user account, select System > Preferences > Network
    Connections.

    2. Find the network connection that you use on one of the tabs. For example, if
    you use a wireless network called "Marconi", you would click the Wireless tab
    and look for Marconi in the list there.

    3. Select the network, and click Edit.'
