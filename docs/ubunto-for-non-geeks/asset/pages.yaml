  md: '![](img/add8efd602aad9815ee8abf27a7a293e_188_0.png)


    **Figure 9-2:** The Terminal application


    As you can see, all it says `rg@rg-desktop:~$`. In this case, rg is my username-name,
    `rg-desktop` is the name I gave my computer during installation, and the tilde
    (~) signifies that I am in my home folder. If it were to say ~/Music, it would
