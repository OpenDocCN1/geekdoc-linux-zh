    # # Simulators


    Waging war isn''t everyone''s idea of escapism, which is why an extensive collection
    of simulation games are available for Linux. I have tried to cover as many bases
    in this section, but as always, you should peruse the Ubuntu Software Center if
    you don''t see anything here that appeals to you.


    When I think of simulation games, my mind immediately jumps to Sim City, the venerable
    city-building game. As the mayor, you are in charge of running your city: You
    plan construction work, build and maintain transport links, and set budgets and
    taxes. Throw the old natural disaster into the mix, and you have a challenge on
    your hands! The Linux equivalents of Sim City are LinCity-NG and OpenCity. I prefer
    LinCity (Figure 17-12)—the graphics are friendlier and more cartoonish—but you
    should try and decide for yourself. The original Sim City game is available too,
    if you don''t mind playing a game with old-fashioned graphics. Search for Microlpolis
    in the Ubuntu Software Center (it was renamed for legal reasons).


    The hardcore flight simulator enthusiasts among you want to take a look at FlightGear
    (Figure 17-13). The focus is definitely on realism, with all sorts of cockpit
    controls and aircraft for you to play with. If you want the full experience, there''s
    even an Earth-sized online map to fly around. If you''re not already in possession
    of a pilot''s license, it might be a good idea to read the manual before you play;
    you can find it at http://flightgear.org/Docs/getstart/getstart.html.


    314 Chapter 17'
