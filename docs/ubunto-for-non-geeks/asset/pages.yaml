    your computer. If you''re not beset by any particular quandary, you might like
    to skim through this chapter to give you some idea of what to do if misfortune
    betails you in the future. Or, you could take my preferred route: Make yourself
    a hot beverage and head back to the games chapter (Chapter 17) for some well-deserved
    R&R.


    # ## Can''t Get Ubuntu Installed


    Not being able to install Ubuntu is a particularly unhappy problem it means you''ve
    probably been denied all the fun from the previous 20 chapters of this book! Never
    fear; there''s plenty you can do to convince Ubuntu to install itself on your
    computer, and if you''re still struggling, you can try alternative installation
    methods like booting from a USB stick, which I''ve covered in Appendix A.


    # ## My Computer Won''t Boot from the CD


    If you tried to start your computer from the Ubuntu installation CD but never
    even got to the purple boot screen (see "Going for a Dip" on page 12) or if the
    computer boots into Windows every time, try one of the following options:


    +   *Check the boot order** When your computer starts up (*boots*), it goes through
    a list of devices in a set order, checking to see whether they have an operating
    system on them. As soon as it finds an operating system, the computer will boot
    from that device, and it won''t check any of the other devices. This means that
    if the hard disk comes before the boot order, the computer will boot from the
    hard disk rather than the CD drive. To boot from the CD, you need to make sure
    that the CD drive comes in the boot order. see "Going for a Dip" on page 12 for
    instructions on setting up the boot order correctly.


    +   *Check the integrity of the CD** You could have a faulty or damaged CD that
    your computer isn''t able to boot from. It''s possible to check whether a disc
    has faults on it by doing a checksum test. A checksum is sort of a fingerprint;
    take the checksum of your CD and compare it with the checksum of an Ubuntu CD
    that is known to be free of faults. If there is but one tiny difference between
    the two discs, the checksums will be different too—the fingerprints won''t match.
    Ubuntu uses the MD5SUM


