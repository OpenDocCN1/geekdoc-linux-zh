    you should spend your money on this book or a latte every morning for the next
    couple of weeks. For those in this last group, I can only say,"Get this book."
    Save the wear and tear on your stomach and nerves.

    In any case the first thing we need to do is get you up to sniff on what Ubuntu
    is all about, why you might want to install and use it, and what you will need
    in order to do. I expect you will have questions along the way, and if you are
    like most, a few doubts. I hope that by the time you finish this book and your
    Linux system up and running, your doubts will be gone and your questions, for
