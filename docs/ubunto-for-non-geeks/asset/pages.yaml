    Once the burning gets underway, progress will be shown in a new window, and when
    the job is done, you will be asked what you would like to do next. Assuming you
    are done with your disc burning for the day, click Eject and then Close.


    In case you are wondering, the discs you burn in Linux will be readable in other
    operating systems.


    # Dealing with CD-RWs


    CD-RWs are pretty much like CD-Rs except that they can be erased and then written
    to again. They are also a bit more expensive than CD-RWs and, generally, cannot
    handle faster speeds.


    Using CD-RWs is like working with CD-Rs. If the disc is blank, there is no difference
    in the process at all, which makes things quite simple. And, even if the CD-RW
    already has data on it you want to replace with something else, the process is
    slightly different.'
  merge: -1
  pgno: 139
- img_proc: true
  md: 'One of these differences is that Nautilus will treat your CD-RW as a regular
    data disc rather than a blank one. This means when you pop your disc into the
    drive, a regular Nautilus window will automatically open, rather than a CD/DVD
    Creator window.


    To write to the disc, you will need to manually switch from the Nautilus window
    to a CD/DVD Creator window, which is easily done by selecting CD/DVD Creator in
    the Go menu of the Nautilus window opened for that. If you can''t find a CD/DVD
    Creator option, click Go Location and type burn:/// into the location bar (followed
    by ENTER) instead. Once you''ve done that, the disc will become a CD/DVD window.
    Drag the files you want to burn to CD to that; once you are ready to burn, click
    the Write Disc button.


    As is the case with regular CDRs or DVDs, a CD/DVD Creator window will appear.
    When you click the Burn button in that window with a used CD-RW in the drive,
    however, a slight difference occurs. At this point, a new window like that image
    in Figure 7-13 will appear telling you that the disc has files already written
    on it. Click the Blank Disc button in that window, and the CD/DVD Creator will
    erase the files on the CD-RW and replace them with the new ones that you dragged
    to the CD/DVD Creator. Not bad at all, eh?


    ![](img/add8efd602aad9815ee8abf27a7a293e_140_0.png)


    # Burning ISO images to Disc


    When you download Ubuntu or other Linux distributions from the Internet, you usually
    download them in the form of one or more disc images, which are commonly referred
    to as ISOs because files end in the .iso extension.


    An ISO is an image of a CD''s file contents, which means that it is the CD minus
    the itself. To put it another way, if CDs had souls, the ISO would be the soul
    of a CD; take away the CD''s metal and plastic, and the remaining data would be
    an ISO.


    Because it is impossible to download a physical CD over the Internet, theless
    ISO are the next best thing. For example, to get a working copy of Ubuntu from
    the Web, you usually need to download an ISO, which you then burn onto a blank
    CD in order to give the images their bodies back, to speak. In the process, you
    create the working installation disc that you need to install Ubuntu.'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'Fortunately, burning an ISO into a disc is a pretty simple chore. Just open
    a Nautilus window, and locate the icon for the ISO file you want to burn disc.
    Right-click the ISO file, and in the pop-up menu that appears, select Write to
    Disc. Once you do this, the Write to Disc window will appear; just click the Burn
    button, and you''ll be on your way.


    # Creating Your ISO Images


    While on the topic of ISOs, it is good to know that you can create ISOs of your
    own. Of course, you''re probably not going around creating your own Linux distros,
    but you might come up with a set of files that you need to repeatedly burn now
    or in the future. To create your ISO, follow the normal process for creating a
    data CD, but when the Write to Disc window (Figure 7-12) appears, select Image
    File in the drop-down menu below the Select disc to write to. After, click Properties,
    which will open a new window asking for a filename for your new disc. Give it
    a name, click Close, and hit the Burn button. In a very short time, you will have
    an ISO of your creation.


    # Burning Multisession CDs


    If you are coming from the Windows environment, you are no doubt familiar with
    multisession CDs. These are CDs on which data is added one session at a time.
    For example, you burn a few files to disc tomorrow and add a few more files the
    day after that. Each time you burn additional files to the same disc, you are
    adding a session, which explains the name multisession. If that explanation seems
    a bit obtuse, you can basically think of them working like floppy disks (albeit
    with considerably more storage capacity).


    Nautilus has basic support for multisession discs, but let''s try something a
    little more specialized this time: Brasero, which is a more featured application
    that you can use for all of your disc-burning chores.


    You can run Brasero from the Applications menu by selecting Sound & Video Brasero
    Disc Burn. In the main Brasero window that opens, click the Data project button.


    To burn the first session to a CD, drag the files you want to burn from Nautilus
    into the Brasero window (Figure 7-14), or click the Add button (which looks like
    a +) on the Brasero toolbar to browse for files. When you have all the files in
    place that you want to burn, put a blank disc into the drive, give a name for
    the disc at the bottom of the screen, and click the Burn button. A Properties
    window will appear. In that window, check the Leave the disc open to add other
    files later box. This is the step that sets up a multisession disc.) Once you''ve
    done that, click Burn to start the burning process. Brasero will eject the disc
    when the burn is complete.'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# Burning Subsequent Sessions


    Adding a new session to a multisession disc in Brasero is similar to the process
    used for creating the initial session. Here''s what you do:


    +   1. Run Brasero, and click the Data project button.

    2. Insert your multiset disc into the drive, and when the drives spinning and
    you''ve gotten Nautilus windows for that disc out of stops, click the Import button,
    after which the contents of your previous session will appear in the Brasero window.

    3. Add files to the previous session, using either of the methods you used when
    creating the original session (via drag-and-drop or by selecting and clicking
    Add).

    4. When you''ve added the files you want, click Burn. The process then from out
    is exactly the same as it was for the first session. To add files in subsequent
    sessions, just follow the process outlined earlier yet again.


    Duplicating CDs and DVDs

    Now that you are familiar with Brasero, I''ll introduce another of its features:
    CD/DVD duplication. To duplicate a disc, place it in the drive, start Brasero
    and then click the Copy button. In the window that appears (Figure 7-15)

    Brasero will begin copying your disc. When it''s done, it will eject the disc
    and ask you to insert a blank one. A few seconds after you insert the blank disc,
    Brasero will automatically start writing to it. When the process is complete,
    the disc will be ejected. Nothing to it.


    ![](img/add8efd602aad9815ee8abf27a7a293e_142_0.png)'
  merge: -1
  pgno: 142
- img_proc: true
  md: '![](img/add8efd602aad9815ee8abf27a7a293e_143_0.png)


    # USB Storage Devices


    Unless you have under a digital rock for the past few years, you are no doubt
    well familiar with USB devices. Your printer is very likely a USB device, as is
    your scanner. And though your digital camera is not a USB device in the traditional
    sense, chances are that every time you connect it to your computer in order to
    transfer photos, you are doing so via a USB connector.


    Among the most popular USB devices out there are those used for file storage.
    These include external hard disks, flash memory card readers, and the tiny, finger-sized
    devices known as flash drives (Figure 7-16). Flash drives are especially popular
    today and deserved so: They are inexpensive, when you need to transfer large amounts
    of data, and pretty safe in terms of cross-platform (including Linux) compatibility.


    Working with USB storage devices is really easy. Just plug the device into one
    of the USB ports on your computer. The LED on the device will be a bit of blinking
    when the system reads what''s on it, and after that, a disc icon for that device
    will appear on your desktop. A few moments later, a Nautilus window will open,
    revealing the contents of the device. An icon for the USB device will also appear
    in the side pane of the Nautilus window. You can then copy files to and from the
    device using the drag-and-drop or copy-and-paste procedures I mentioned earlier
    in this chapter.


    Once you are done and want to remove the device, right-click its desktop icon,
    and select Safely Remove Drive in the pop-up menu. (You can also right-click the
    icon in the Nautilus pane and select the same option.) If there is any data that
    needs to be written to the device, the system will start writing. Once it''s complete,
    the icon for the device will disappear from the desktop and Nautilus folder. Make
    sure that you always remove USB drives like this, rather than simply disconnecting
    them—otherwise, you risk losing data.


    Figure 7-15: Using Brasero to duplicate discs'
  merge: -1
