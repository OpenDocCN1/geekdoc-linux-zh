  md: '# Keeping Up-to-Date with Live Bookmarks


    The Web is awash with all sorts of news and information, and it can be hard to
    keep tabs on all. Personally, I hate missing my daily dose of offbeat stories
    from Boing Boing, the aptly subtitled "directory of wonderful things" (http://www.boinging.net/).
    Fortunately, Firefox has a way of dealing with information overload, live bookmarks
    (also known as RSS feeds) provide you with an automatically updated list of articles
    from any website that supports them. To see an example, the Latest Headlines link
    underneath Firefox''s address bar—it is a live bookmark for the BBC website and
    shows you a list of current news stories.


    You can check whether a website has an RSS feed by looking in the address bar
    for an orange symbol (like the one shown in Figure 5-3). If it has, you''re in
    business! Try using Boing Boing as an example: Load http://www.boinging.net/ in
    Firefox, and click the beacon. You''ll get a list of the most recent articles
    with an invitation to subscribe to the box at the top of the page. Click Subscribe
    Now, and in the window that appears, Subscribe to add the live bookmark to the
    same toolbar as the Latest Headlines.


    ![](img/add8efd602aad9815ee8abf27a7a293e_93_0.png)


    Figure 5-3: The beacon icon is displayed when a website has an associated RSS
    feed.


    Some websites provide links to their feeds rather than showing them in the address
    bar. If you find one (normally calledOM or RSS/XML), click it, and you should
    be taken to a list of articles with a box at the top, like in the previous example.
    From there, the steps for adding the feed to your bookmarks are the same.


    # Pop-up Manager


    Firefox has a number of useful features. One is its Pop-up Manager, which suppresses
    those annoying pop-windows that appear when you access a new web page. You can
    enable or disable this feature from the Preferences window (Edit + Preferences)
    by clicking the Content icon in the top pane of window and then checking or unchecking
    the Block pop-up windows. You can also permit certain sites to pop-up windows
    (some pop-ups are not only useful but necessary for the correct functioning of
    a site) by clicking the Exceptions button to the right of Block pop-up windows
    entry and inputting the web address for the site in question.


    # Multimedia Plug-Ins


    One of the coolest things about Firefox is that it allows you to further expand
    its functionality by adding various extensions. The most commonly used extensions
    come in the form of plug-ins. These web pages allow you to do much more than just
    display text and pictures—you''ll often need a plug-in to watch videos or play
    games online. Three plug-ins are used far widely than any others, so I''ll concentrate
    on those here.'
  merge: -1
