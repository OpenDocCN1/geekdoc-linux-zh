    Once the CD/DVD Creator window is open, copying the files you want to burn to
    disc is pretty much a simple drag-and-drop maneuver. Just open a new Nautilus
    window, drag the files you want to burn to disc from that window to the CD/DVD
    Creator window. If you prefer to do things in a decidedly Nautilus-esque fashion,
    you can select the files you want to transfer to disc by clicking each file, holding
    the CTRL while doing so, for multiple selections. If you want to select multiple
