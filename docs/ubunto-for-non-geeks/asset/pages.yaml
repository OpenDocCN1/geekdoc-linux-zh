  md: '# LMMS


    Linux MultiMedia Studio (LMMS) is a combination tracker/sequencer/synthesizer/sampler
    with a modern, user-friendly, graphical user interface—at least that''s what the
    LMMS home page suggests. I can''t swear how easy it is to use, because I don''t
