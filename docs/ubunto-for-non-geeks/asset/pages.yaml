- img_proc: true
  md: 'that are most often virus carriers. The Standard scan targets more files, ignoring
    extensions but still limiting the scan to those file types that are usually associated
    with viruses. Finally, the Thorough scan counts everything and searches for every
    type of virus.


    Once you have made your selections, click the Start scan button, and awast! will
    start doing exactly that—showing its progress within the same window. When the
    scan is complete, a small window will pop up telling, ideally, that no viruses
    were found. When was the last time you got a message like that on your Windows
    machine?


    # # Project 19B: Encrypting Your Files


    Protecting yourself against Internet nasty is all well and good, but what if someone
    gains physical access to your computer? Data theft is a serious business, if you
    have any sensitive files, you should think about protecting them. A good way to
    do this is to encrypt your sensitive files. Encryption is a way of taking a file
    and scrambling it in such a way that only a person with the right decryption key
    will be able to recover the original information. If someone tries to open the
    file while it''s still encrypted, they will be able to see a bunch of nonsense
    characters.


    # ## 19B-1: Creating an Encrypted File Folder


    Ubuntu has a nice way of encrypting files, but you should take care when using
    it! The whole point of encrypting your files is that no one will be able to access
    them, so there''s a little chance of recovering them if you forget your password.
    Here are the steps you need to follow to get encrypted:


    +   1. Open the Ubuntu Software Center, and search for install encryptfs-utils.

    2. Once installation has completed, open a Terminal by clicking Applications >
    Accessories > Terminal, encryptfs-setup-private, and press ENTER.

    3. You''ll be prompted for the password that you use to log into Ubuntu. Type
    it, and press ENTER. (The letters won''t show up on the screen, but that''s normal.)

    4. You''ll be asked to enter your passphrase (password). Pick some very memorable—there''s
    no recovering this password if you forget it! Press ENTER, retype the password
    (to make sure there no typos), and press ENTER again.

    5. Close the Terminal, log out of your user account, and log back again.

    6. When you log in, an Update information window will appear (Figure 19-8). Click
    Run this action now, type your login password into the window that appears (it
    will look as if nothing is being typed again), and press ENTER.'
  merge: -1
  pgno: 379
- img_proc: true
  md: '7. Your mount password (also referred to as encryption passphrase) will be
    displayed on the screen. Make a careful note of it, press ENTER, and then click
    Close in the Update information window to continue logging in.


    ![](img/add8efd602aad9815ee8abf27a7a293e_380_0.png)


    Figure 19-8: Checking your encryption passphrase


    If you open your home folder, you''ll now see a folder called Private. Anything
    you put in this folder will be encrypted and will be safe from prying eyes. This
    is especially useful if your computer gets stolen—only someone with your mount
    password will be able to look at the files, and ideally the only person who knows
    it is you!


    # 19B-2: Recovering Encrypted Files If Something Goes Wrong


    If you have problems with your computer and need to recover the files in the encrypted
    Private directory, use the following steps after you get Ubuntu up and running
    again. If you don''t feel confident following these instructions you should definitely
    ask for advice on the Ubuntu forums.


    +   1. Open a Terminal, type sudo mount -t encryptfs /home/username/.Private /home/username/Private,
    and press ENTER. You should, of course, replace username with your username.

    2. You''ll be asked for your passphrase. Type your mount passphrase (password),
    and press ENTER.

    3. Now you''ll be prompted a few times to make a section. Hit ENTER a few times
    until you''re given a WARNING message.

    4. Type yes, and press ENTER; then type no, and press ENTER.

    5. If you entered the right mount password, the Private folder will be decrypted,
    and you''ll be able to access your files. Copy them from that folder to somewhere
    safe!'
  merge: -1
  pgno: 380
- img_proc: true
  md: 'If you have no luck recovering your files, take a look at https://help.ubuntu.com/community/EncryptedPrivateDirectory/
    to see whether there''s any-further you can try.


    # Project 19C: Shredding Documents Digitally


    Although most people are satisfied with deleting their files when they no longer
    need them, they may not realize that the deleted file data is still recoverable.
    This may pose little concern when it comes to photos of your trip to Maryland
    or reports you may have written for a class for Thai cooking, but it is a completely
    different situation if you''ve been storing bank details or other confidential
    information on your hard disk. Even if you reformat your disk, the data stays.
    That is great if you want to retrieve any files you have accidentally deleted
    (or formatted away), but it isn''t such good news if your computer gets lost or
    stolen or if you decide to give it away. In some cases, it might not be a bad
    idea to do some digital shredding.


    # 19C-1: Trying the shred command


    Digital shredding in Linux is done with the shred command. Its usage is very similar
    to the rm command you learned in Chapter 9, though in terms of removal, shred
    is much more thorough. To give it a try, create a dummy file by going to the File
    menu of a Nautilus window, and selecting Create ► Empty File. Name the document
    mysredExp.txt, and then double-click the file. This will open gedit. Type a couple
    of sentences in the document—anything will do—and then save it. Close gedit. The
    first couple of words you typed should now appear on the icon of the new dummy
    file you created (as shown in the example on the left side of Figure 19-9).


    ![](img/add8efd602aad9815ee8abf27a7a293e_381_0.png)


    Figure 19-9: Files change their appearances after being shredded.


    With your new file in hand and placed in your home folder it is easier to follow
    shred. Open a Terminal window, type shred mysredExp.txt, and then press ENTER.
    If you now look in your home folder, you will notice the difference right away.
    Your original file is still there, but the text on the icon now looks like gibberish
    (as you see in the example on the right side of Figure 19-8), which is what your
    file has become. If you double-click the file, gedit will open like it did before,
    but this time around, it won''t be able to read your file, and it will tell you
    so (Figure 19-10).'
  merge: -1
  pgno: 381
- img_proc: true
  md: '![](img/add8efd602aad9815ee8abf27a7a293e_382_0.png)


    So, now you''ve got yourself a shredded file sitting in your folder, but it would
    be handy to get rid of the file rather than have it sitting there littering up,
    wouldn''t it? Of course, you can remove the file via the Terminal using the `rm`
    command, but it would be easier to get future shredded files deleted immediately
    after being shredded. Fortunately, this is easy enough to do by using the shred
    command with the -u flag. You can try it on the file you''ve already shredded
    by opening a Terminal window, shred -u myShredExp.txt, and then pressing ENTER.
    Your file will then be shredded and deleted.


    # 19C-2: The shred command Graphical in Nautilus


    Although using the shred command isn''t all that difficult, most users would prefer
    to do things graphically. After all, you don''t have to type commands to delete
    or move a file, right? You can do all of that is easily enough through Nautilus,
    and it''s the same with shred. The only difference is that shred''s functionality
    does not come bundled into Nautilus out of the box—you have to add it yourself.
    Here are the steps to follow:


    +   1. From the Ubuntu Software Center, search for nautilus-actions, and install
    Nautilus Actions Configuration. This package allows you to add commands and other
    functionality to Nautilus.

    2. Once the installation is complete, select System -> Preferences Nautilus Actions
    Configuration.

    3. When the Nautilus Actions window appears, click the Add button.


    Defending the Nest 351'
