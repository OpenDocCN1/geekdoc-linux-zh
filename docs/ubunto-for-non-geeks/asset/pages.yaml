  md: '# Project 9D: Compiling and Installing Programs from Source: Xmahjongg


    Though it was more common in the earlier days, compiling programs from source
    seems to be a phrase you still hear in the Linux world more than in any other.
    For the beginner, just the mention of compiling a program from source seems off-putting
    enough. The words compile and source seem to instill a sense of foreboding in
    the heart of the new user. This was certainly the case for me, anyway.


    You can live long and prosper without ever bothering to compile anything on your
    system. You can move along quite happily with your system as, or you can just
    install programs by means of the much more convenient Ubuntu Software Center.
    Still, in the Linux world, you are likely to come across this installation method
    and may well become curious, especially if you move into the geekier side of the
    community.


    # So, What Is Source?


    To get started, it is probably a good idea to understand what source is to help
    you understand how a program actually gets from its primitive state on the programmer''s
    computer to an up-and-running application on your machine. First the programmer
    writes a program in a programming language. You have probably heard of programming
    languages such as BASIC or C, and there are many others. What the programmer actually
    writes with such a language is a set of instructions called the source code, or
    source. Your computer, however, cannot actually understand any of source on its
    own. It is as if the computer speaks ancient Greek, and the source code is all
    written in French. The computer therefore needs some sort of interpreter to help
    it out.


    The various languages that programmers use are called high-level languages—they
    are relatively easy for programmers to read. The computer, on the other hand,
    only understands low-level languages, which are quite difficult for most mortal
    programmers to deal with. To convert the high-level instructions to a low-level
    language, the computer needs some other program to translate.


    If this translation process actually takes place while a program is running, the
    translator program is called an interpreter. Running using an interpreter is usually
    written scripts. The PyWings and Briscola applications earlier in this chapter
    are examples of script applications.


    The problem with these scripts is that they can be slower than most of the applications
    you''re familiar with—the computer must run an interpreter, interpret the source
    code, and run the actual application at all the same time. This is like having
    a French book translated into Greek by a live interpreter; it''s very slow.


    As an alternative, most programmers use a compiler instead of an interpreter.
    A compiler translates the high-level source code into low-level machine code,
    or object code, that the computer can understand before the application is


    184 Chapter 9'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'actually run. Once this translation is done, the computer never has to bother
    with the high-level instructions again; it can merely read the translated version
    each it runs the program. This is like having a translated version of a foreign
    book that you can read any time you want. Because computers can run compiled programs
    without using an interpreter, compiled programs run faster than scripts. Most
    applications for all operating systems are, therefore, compiled.


    # The Basics


    The actual process of compiling an application from source and installing it is
    quite simple—a "one, two, three" of bit presto changeo. Basically, after extracting
    the source code from an archived file (usually in the form of a tarball), you
    would use the following commands to accomplish the task:


    ```

    ./configure To configure a makefile, which provides instructions for the make
    command

    make To translate the source code into object code that the computer can understand

    sudo make install To give yourself write privileges in protected folders and then
    install the application

    make clean To tidy up the leftovers once the process is complete (to clean up
    the mess)

    ```


    I know that sounds like a lot of commands, but as always, it is easier to actually
    do it on the page, so fear not.


    # 9D-1: Installing the Tools You Need


    Before doing anything else, you have to get your system ready to do what you are
    about to ask of. Because Ubuntu is designed with the average user in mind, it
    does not come with the various applications and libraries you need to compile
    applications from source. Fortunately, however, everything you need to get the
    job done is available via the Ubuntu Software Center. To get ready for the work
    at hand in this chapter (and many other jobs you are likely to do on your own
    in the future), perform searches for and install the following packages:


    +   - build-essential

    - libgtk2.0-dev


    # 9D-2: Downloading and Extracting the Xmahjong File


    To get some hands-on experience with compiling a program from source, you will
    be working with a game called Xmahjong, which you can see in Figure 9-17. If you''ve
    tried the version of Mahjong that comes with your Ubuntu distribution, you will
    notice that this is much easier on your eyes and is a bit more colorful (check
    out the project site at http://www.lcdf.org/xmahjong/ to catch a glimpse of it
    in its full-color glory).'
  merge: -1
  pgno: 216
- img_proc: true
  md: '![](img/add8efd602aad9815ee8abf27a7a293e_217_0.png)


    Figure 9-17: The Xmahjonggg game


    Xmahjonggg is available via the Ubuntu Software Center, so it is not absolutely
    necessary to install it when you are about to, but doing so provides a perfect
    opportunity to learn how to compile a program from source. A amount of source
    code isn''t all great, so it won''t take too much time to, and it requires no
    tinkering.


    To get started, you will first have to download the Xmahjonggg source code. You
    can get this from the Xmahjonggg project page at http://www.lcd.org/xmahjonggg/.
    Download the tarball xmahjonggg-3.7.tar.gz, or a newer version if there is one.
    Do not download any of the other file types available on that page.


    If you prefer, you can instead download the Xmahjonggg tarball by using the wget
    command that you learned in Project 9-C1. Just open a Terminal window, type the
    following command, and press ENTER:


    ```

    wget http://www.lcd.org/xmahjonggg/xmahjonggg-3.7.tar.gz

    ```


    Once you have the file on your hard disk, untar the xmahjonggg-3.7.tar.gz file.
    You can do this by using the command line, or double-clicking the file and dragging
    its contents into the appropriate folder. To make easier for you to follow along
    with the directions I will, be sure to place the untared Xmahjonggg in your home
    folder. Then you will be ready to run.


    Normally at this point, you would look through the folder to find some instructions
    for dealing with the package, just as you did earlier in the chapter for Briscola.
    In most source code packages, this information is included in an INSTALL file,
    like the one in the xmahjonggg-3.7 folder (Figure 9-18). To read the INSTALL file,
    just double-click it, and it will open in Gedit.'
