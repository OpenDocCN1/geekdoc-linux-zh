  md: '# Removing Unwanted Files


    Remember all that talk of keeping a tidy nest at the start of the chapter? Well,
    now it''s time to dust off your spring cleaning gear and give your home folder
    once over.


    The first stop is the Trash. Sometimes I''m surprised by how much stuff accumulates
    here; I can go for weeks on end without emptying it. Luckily, this trash lacks
    the unpleasant odor of its real-world counterpart, all that stands in your way
    is a quick check to make sure you didn''t accidentally throw anything away. Click
    the Trash icon on the bottom panel, and when the window opens, click Empty Trash
    to delete all the files there. They will be deleted permanently, with no way of
    getting back.


    Next is something a little more sophisticated. If you''re running low on hard
    disk space and want to know why (or just want to Snoop around your files), select
    Applications Accessories Disk Usage. When the window appears, a colorful ring
    will appear, accompanied by a list showing where your hard disk space is being
    eaten up. Hover the mouse over one of the colored segments on the chart to see
    what''s taking up the most, or double-click one of them to zoom in on a particular
    folder. After that, it''s up to you to weed out the hard disk hogs: Click a folder
    in the left list, and choose Move to Trash to delete it.


    # Project 7: Creating and Extracting Compressed Files


    Since I have been talking about file storage, it seems only fitting to wrap things
    up in this chapter by teaching you how to create and extract compressed files.
    In the Windows world, these are generally referred to as Zip files, in the Linux
    world, tarball is the operative name. The Linux name, in case you are wondering,
    from the application that is used to create the archive for files, Tar. Compressed
    archives are great for two reasons: They let you bundle a load of files into one
    handy package, and they squeeze all the files so they take up less space on your
    hard disk. If you''ve ever tried to email a bunch of files to someone, you know
    how useful this can be.


    Anyway, to get some of the hands-on stuff down, you''ll be creating a Windows/Linux/Mac-friendly
    Zip file and then extracting it. You can get down to business by opening a Nautilus
    window and creating a couple of dummy files to work with. Do this by going to
    Nautilus and selecting Create Document Empty File. A new file will appear in the
    Nautilus window, with its name highlighted. You can type a name for the file,
    such as the one I''m using: dogwood. Now repeat the process to create a second
    file. I''ll be calling that one violet. Use equally evocative for yours.'
  merge: -1
  pgno: 150
