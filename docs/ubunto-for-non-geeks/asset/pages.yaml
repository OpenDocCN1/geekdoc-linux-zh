  md: '# D


    # RESOURCES


    ![](img/add8efd602aad9815ee8abf27a7a293e_452_0.png)


    Because Linux owes much of its growth and development to the Internet, it should
    come as no surprise that there is a wealth of information about the various flavors
    of Linux, including Ubuntu, available to online. In addition to the usual news,
    how-to, and download sites, you will also find a variety of tutorials, forums,
    blogs, and other sources of useful information—all of which you can turn to as
    you use and learn more about your system.


    # Forums


    When you are looking for advice, trying to solve a particular problem, or just
    looking for some general tips, online forums are the way to go. Fortunately, Ubuntu
    has a forum all its own, and since Ubuntu is primarily a desktop-oriented Linux
    distro, you are likely to find many fellow newbies and newbie-friendly posters
    there, rather than the hard-core geekiness you might find on'
  merge: -1
  pgno: 452
- img_proc: true
  md: 'some other sites. There are, of course, other newbie-friendly forums, which
    although not Ubuntu-specific, should also be able to provide you with lots of
    helpful information.


    Regardless of which forum you are posting in, just be sure to mention that you
    are using Ubuntu, which version you have (Lucid Lynx, in case you forgot) and
    that you are new to Linux. Remember to always seek clarification when you get
    an answer you don''t understand. The same poster will usually come back and clarify
    things for you. You should feel right at home at most of these sites, though you
    will probably come to like one or two more than the others.


    http://ubuntuforums.org/ This is the official Ubuntu community forum, which was
    covered in detail Chapter 20. This is always a good place to start when you''re
    in a fix, have a question, or just to find out what''s going on.


    http://www.ubuntu.org/forum/ This is another, slightly smaller Ubuntu-specific
    forum. This is a good place to turn if you find UbuntuForums.org a bit too much
    to wade through.


    http://www.kubuntuforums.net/ This is a dedicated Kubuntu, an official Ubuntu
    environment based on the KDE desktop environment.


    http://www.justlinex.com/ and http://www.linuxquestions.org/ If you can''t find
    what you want in the previously mentioned forums, you can try these forums dealing
    with general Linux issues. You are sure to find Ubuntu users on them.


    # Linux Reference


    These are sites, many of which are geared towards newbies, where you can learn
    more about using Ubuntu or Linux in general:


    +   http://www.ubuntu.com/products/whatisubuntu An overview of Ubuntu and its
    features


    +   http://ubuntuguide.org/wiki/ubuntulucid An unofficial Ubuntu startup guide


    +   http://help.ubuntu.com/ Official documentation for the current release of
    Ubuntu


    +   http://www.tuxfiles.org/ Lots of tutorials and information for Linux newbies


    +   http://www.linuxcommand.org/ Where you can learn to use commands in Linux


    +   http://www.linux.org/ News, book reviews, downloads, and all sorts of other
    stuff—all about Linux


    +   http://openoffice.blogs.com/openoffice/ Tips for users of Ubuntu''s OpenOffice.org
    office suite'
  merge: -1
  pgno: 453
- img_proc: true
  md: '# Blogs


    You can also find a lot of great information in blogs. In these blogs, you can
    discover the findings of fellow users as they try new things, share tips, and
    offer solutions to problems:


    +   - http://www.ubuntu.org/blog/ This is mostly an Ubuntu-oriented news blog.

    - http://www.ubuntugeek.com/ Despite having the word geek in the name, this is
    a pretty awesome set of mostly useful Ubuntu system and software tweaks.

    - http://embraceubuntu.com/ This is an archive of Ubuntu tips (although it hasn''t
    been updated in a while).


    # Hardware Compatibility Issues


    If you want to find out whether or not your hardware is compatible with Linux
    or if you want to read up on other matters related to hardware support, take a
    look at the following sites:


    +   - http://wiki.ubuntu.com/HardwareSupport/ This contains Ubuntu-specific hardware
    compatibility information.

    - http://www.linuxcompatible.org/compatibility.html This has numerous compatibility
    lists, arranged by distribution.

    - http://www.linuxfoundation.org/ This is a great spot for reading up on printer
    compatibility issues.

    - http://www.linuxmodems.org/ Find out if your modem is supported.

    - http://www.sane-project.org/ Check to see if your scanner is Linux compatible,
    and look for it fixes it!

    - http://www.linux-laptop.net/ Have laptop, want Linux? Check it out here.

    - http://www.tuxmobil.org/ This site has information for using Linux with anything
    that isn''t stuck to your desk (laptops, PDAs, phones, and so on).


    # Wireless Connections


    If you use a wireless card to connect to the Internet and have trouble getting
    your card to work or if you just want to know where all the free hotspots happen
    to be, the following sites should help:


    +   - http://help.ubuntu.com/community/WifiDocs/

    - http://www.linuxwireless.org/

    - http://www.hpl.com/personal/Jean_Tourrilhes/Linux/

    - http://www.ezgoal.com/hotspots/wireless/'
  merge: -1
  pgno: 454
- img_proc: true
  md: '# Free Downloads


    If you find yourself looking for more goodies to play around with, you should
    be able to find plenty of free stuff to download at one of these sites.


    # Applications and Other Packages


    +   - http://www.getdeb.net/

    - http://sourceforge.net/

    - http://www.freshmeat.net/

    - http://www.gnomefiles.org/


    # Free Fonts


    +   - http://www.fontfreak.com/

    - http://www.fontparadise.com/

    - http://fonts.tom7.com/


    # News and Information


    These sites are mainly informational, keeping you abreast of what''s going on
    in the Linux world as a whole (I covered some Ubuntu-specific ones in Chapter
    20). DistroWatch focuses on the various distributions available out there, whereas
    Linux Today and LinuxPlanet fit better in the online magazine/newspaper genre.


    +   - http://www.distrowatch.com/

    - http://www.linxtoday.com/

    - http://www.linuxplanet.com/


    # Magazines


    If you are more of a tactile type who enjoys the feel of paper pressed between
    your fingers, you might want to turn to some of the Linux magazines available
    at most newsswands. All have a good deal of online content, so even if you''re
    not interested in the pleasures of holding a magazine in your hand, theirs are
    worth checking out.


    +   - http://www.tuxmagazine.com/ (now out of publication but still has back issues)

    - http://www.linuxmagazine.com/ (European)

    - http://www.linuxmagazine.com/ (U.S.)

    - http://www.linuxjournal.com/'
  merge: -1
  pgno: 455
- img_proc: true
  md: 'There are two (unrelated) magazines sharing almost the same name: One of these
    is from the United States; the other is Europe. Newbies who want pizzazz in their
    reading materials, plus some useful tips and some things to play around with,
    should go for the European version. The U.S. version is targeted toward business
    users and power geeks, not newbies.


    # # Books


    Once you''ve finished working through this book, you should be able to just about
    whatever you want in Ubuntu. Still, your interest may have been piqued enough
    that you want to find out a bit more about Linux. Here are some books that might
    help you in that:


    +   * *How Linux Works by Brian Ward (No Starch Press, 2004)

    * *The Debian System by Martin Kraft (No Starch Press, 2005)

    * *The Linux Cookbook 2nd Ed. by Michael Stutz (No Starch Press, 2004)

    * *Running Linux by Matthias Dalheimer and Matt Welsh (O''Reilly Media, 2005)

    * *Linux Multimedia Hacks: Tips & Tools for Taming Images, Audio, and Video by
    Kyle Rankin (O''Reilly Media, 2005)

    * *Linux Pocket Guide by Daniel J. Barrett (O''Reilly Media, 2004)


    # # Ubuntu CDs


    To order an AMD64 version of the Ubuntu Desktop CD, get a replacement for the
    i386 version that comes with this book, or get the next version of Ubuntu when
    it comes out (if you don''t want to or can''t download it), just place an order
    with any of the following sites. (CDs from most suppliers will cost $5 to $10
    or so.)


    ```

    http://shipit.ubuntu.com/

    http://shop.canonical.com/

    http://www.cheapbytes.com/

    http://www.linuxcd.org/

    ```'
  merge: -1
