  md: '# $mkdir


    You have already learned how to create folders by means of menus and your mouse,
    but you can also do this using the command line. The command is mkdir (make directory),
    and it is as easy as pie (though I''ve never been quite sure how pie is).


    To see how this command works and to work with the commands that follow, use the
    mkdir command to create a folder called command_exp (for command experiments).
    All you have to do is type mkdir command_exp in a new Terminal window and press
    ENTER. The new folder should appear in your home folder, so go ahead and check
    to see whether it is there by clicking the icon on your desktop.


    OK, good, bra, bueno! Now let''s create another folder within new folder—a subfolder,
    if you will. We''ll create this one sub. just type mkdir command_exp/sub, and
    press ENTER. You can now take a peek and see whether the sub folder appears within
    the command_exp folder, if you like.


    # $mv


    The next command is the mv (move) command, but before you experiment with it,
    you need to create a dummy file to move, after all. You can do this by using another
    command—to make the file—let''s call it expfile.txt—go to the Terminal, touch
    expfile.txt, and press ENTER. The new file will now appear in your home folder.


    To move the file that you''ve created, you will use the mv command, of just type
    expfile.txt command_exp/sub (this tells the system which file to move and where
    to move it to), and press ENTER. The file will now be in your sub folder.


    # $cd


    Until now, you have been using the command line from your home folder. With the
    cd command, you can change your Terminal''s location to another folder. This is
    a very handy command that you will be using a lot when doing projects in this
    book. To take it out for a spin, let''s get inside the command_exp folder by typing
    cd command_exp and pressing ENTER. If you''ve done this correctly, the prompt
    in your Terminal should now read username@computer:~/command_exp. If so, you can
    pat yourself on the back.


    While you are there, you might try the ls with the R (recursive) flag to see how
    that works. just type ls -R, and press ENTER. Your Terminal should now show you
    that you have a subfolder called sub and a file inside that called expfile.txt.


    That is all you really want to do in there for now, so to get back to your home
    directory, just type cd and press ENTER, which will take you back back home, so
    to speak.'
  merge: -1
  pgno: 194
- img_proc: true
  md: 'For future reference, it is worth noting a couple of cd command shortcuts.
    If you are within a subfolder of a subfolder and want to move back a step (from
    /home/peas/pudding to /home/rg/peas, example), you can do so by typing cd .. (with
    a space between cd and ..) and pressing ENTER. You can also use cd - (with a space
    between cd and -) in order to get back to a directory where you were previously
    (from /home/rg/peas/pudding, for example).


    # cp


    Being fickle, as humans are by nature, you might decide that not only do you want
    your expfile.txt in the subfolder but that you also want a copy in your home directory,
    where it was in the first place. To copy expfile.txt, you can use the cp (copy)
    command. To do this, the command needs to know which file you want to copy, what
    it is called, and where you want to copy, in which case this is to your home folder.
    Normally you would type cp command_exp/expfile.txt /home/username to do this,
    but if you recall memory of it near the beginning of this chapter, you can abbreviate
    the /home/username portion of the string to ~, which means the same thing and
    is an important tip to remember because the tilde is frequently used in online
    instructions. Reducing wear and tear on the fingers is always a desirable goal,
    type the following command, and then press ENTER:


    ```

    cp command_exp/expfile.txt ~

    ```


    Be sure to put a space between the file you are copying and its destination (in
    this case, between expfile.txt and ~). Once you''ve done this, you should have
    two copies of expfile.txt, one in your home folder and one in your sub folder.
    Take a look to see the fruit of your endeavors.


    # rm


    When you were a kid, you may well have experienced the joy of building a castle
    out of LEGO bricks and then the greater joy of tearing the whole thing down (preferably
    by hurling D cell batteries at it). You will now embark on a similar move. The
    first tool in this nostalgic endeavor is the rm (remove) command, with which you
    can trash files. The rm command, albeit very useful and easy to use, should be
    used with caution. Once you remove a file with this command, there is no going
    back—the file will not be placed in the Trash; it is gone for good. To play safe,
    let''s try the rm command by getting rid of that new copy of expfile.txt that
    we just created in the home folder. The basic rm command structure consists of
    the command itself, rm, followed by the name of the file you want to remove. In
    this case, you want to remove the file called expfile.txt located in your home
    folder.'
