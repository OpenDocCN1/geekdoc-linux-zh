  md: '# Copying Songs from Your Audio Device to Your Hard Disk


    One feature of most digital media players that isn''t available in iTunes (at
    least not without the installation of a special freeware plug-in) is the ability
    to copy songs from your iPhone/iPod to your hard disk (even to an external USB
    drive). Luckily, Rhythmbox allows to do this easily.


    To copy music from your iPhone/iPod, Android phone, or other digital media device
    with Rhythmbox, select the tracks you want to export (hold down the CTRL key to
    make multiple selections, or use the tabs to select artists or genres if you like),
    and drag the selected items to your desktop, music folder, wherever you want them.
    The catch with this seemingly simple approach is that when copying files from
    an iPod/iPhone or end up with files on your hard disk with funny filenames, such
    as ZPAD.m4a or ADTT.mp3 rather than the name that appeared on your iPhone/iPod
    or within Rhythmbox. This means you''ll have to rename the files once they have
    been transferred to your hard disk, which isn''t much of a chore unless you''re
    dealing with lots and lots of files or if you just forgot which file is which.
    In case of the latter, right-click the file, click Properties, and then click
    the Audio tab, where you will find the original filename (Figure 15-6). Once you
    know it, click the Basic tab, type the correct name in the Name box, and then
    click Close.


    ![](img/add8efd602aad9815ee8abf27a7a293e_315_0.png)


    Figure 15-6: Finding the file properties of a mislabeled audio file'
  merge: -1
  pgno: 315
- img_proc: true
  md: '# Ejecting Your iPod or Other Digital Device from Within Rhythmbox


    When you''re done working with your iPod or other digital device in Rhythmbox,
    you can eject it by clicking its entry in the left pane of the Rhythmbox window
    and clicking the Eject button near the top of the window or right-clicking its
    icon in the left pane and selecting Eject in the pop-up menu that appears. If
    Rhythmbox is closed, this right-click-to-eject approach also works from within
    a Nautilus window or the desktop icon for mounted device.


    # Problems Writing to Your iPod


    If you have an iPod (iPhones and iPod not included) that you were last in conjunction
    with a Mac, you may find that you can read the files on your iPod, you cannot
    write to them. It is most likely that your iPod is formatted in Apple''s HFS+
    filesystem, although this in itself is not a problem. The problem is that HFS+
    formatted iPods have journaling enabled. Journaling is an HFS+ feature that protects
    the filesystem from damage due to power surges, power failures, or hardware breakdowns.


    As fate would, however, the Linux kernel does not deal with journaling-enabled,
    HFS+ formatted devices. Fortunately, the tweak to fix this is quite simple, and
    it''s not particularly geeky: you have to disable journaling on your iPod.


    Disabling journaling on an HFS+ formatted iPod is a very easy task if you have
    a Mac nearby. Plug your iPod into a Mac, click iTunes when it automatically opens,
    and run Disk Utility (in the Utilities folder within the left pane of the window).
    When Disk Utility opens, select your iPod (by name) and press the OPTION key,
    and choose Disable Journaling in the File menu. After a moment, journaling on
    your iPod will be disabled without any loss of data. If you connect your iPod
    to your Linux again, you will be able to use it more or less like normal.


    # Working with Photos on Your Digital Device


    As I already mentioned, if your phone or digital device is photo-capable and Ubuntu
    automatically recognizes it, you will be led to F-Spot Photo Manager, just as
    you are when you hook up your digital camera to your Ubuntu machine. In the same
    way, F-Spot takes stock of what you have on your device and allows you to copy
    photos to your hard disk.


    As you can see in Figure 15-7, first select the photos you want to copy to your
    hard disk, add a tag if you like, and then click Copy. After the photos are copied
    to your disk, they will appear in the main F-Spot window (Figure 15-8), from which
    you can work with them as you see fit.'
