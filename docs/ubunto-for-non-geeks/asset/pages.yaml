  md: '![](img/add8efd602aad9815ee8abf27a7a293e_168_0.png)


    # Getting and Installing the Files You''ll Need


    To get the files you''ll need to do this, take the Art Manager for another ride.
    Once it is up and running, select Art > Backgrounds > Other. Once the list of
    available wallpapers appears in the Art Manager window, scroll down until you
    find one Real shot, install it by clicking the Install button, and then select
    and apply it on the Background tab of the Appearance Preferences window.


    NOTE If the Art Manager does not automatically start downloading a list of available
    files when you make a selection from the Art manager, just restart the Art Manager
    and try again.


    Next, get a set of matching application controls and widgets by selecting Art
    > Desktop Themes > Application in the Art Manager. When the list is downloaded,
    look for a file called Yattacier 3 and install it. In the Appearance Preferences
    window that then appears, select Yattacier 3 in the list on the Theme tab.


    To round things up, let''s add some new icons to the mix by returning to the Art
    Manager and selecting Art > Desktop Themes > Icon. Once the list has finished
    downloading, look for and install Snow-Apple. After that, it''s basically a repeat
    of the previous step, but this time around, click the Icons tab in the Customize
    Theme window, and then select Snow Apple.'
