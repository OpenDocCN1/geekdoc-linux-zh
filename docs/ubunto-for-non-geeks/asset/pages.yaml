- img_proc: true
  md: '7. Specify who you are. On the next page of the installation wizard, you are
    asked to provide your real name, login name, and a password. The wizard will automatically
    generate a name for your computer based on your username (rg-laptop in my case),
    but you are free to change this to something you like (I changed mine to Ubuntu-Acer).
    Once you''ve filled in all the fields, as I''ve done here in Figure 2-9, click
    Forward. If you''re warned that your password is too weak, go back and add a few
    extra characters and try again (or just ignore the message and click Continue).


    NOTE The security-conscious you might consider selecting the Require my password
    to log in and decrypt your home folder option at the bottom of the window. This
    window will encrypt your home folder (where all your documents are stored) so
    that no one can see any of the files in it without your password. This is nice
    to have if you work with confidential information, since the data will be pretty
    even if your computer is stolen.


    ![](img/add8efd602aad9815ee8abf27a7a293e_53_0.png)


    Figure 2-9: Providing your username, password, and computer name in the installation
    wizard


    8. Migrate documents and settings. If your machine already has another operating
    system on it and you are setting up a dual-boot system, the installer will scan
    your hard disk to try and find certain settings, folders, and documents that it
    can transfer to your new Ubuntu system environment. If a migration window appears,
    just check the boxes next to the items you want to transfer, and then click Forward.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '9. Get ready to install. The final page of the wizard (Figure 2-10) lists the
    details of your soon-to-be installed system and hard disk partition setup, along
    with a point-of-no-return warning. You''ve come this far, so you might as well
    go for it, even though there''s no turning back (if you saw the warning message
    in Figure 2-8, that is). Click Install.


    ![](img/add8efd602aad9815ee8abf27a7a293e_54_0.png)


    Figure 2-10: Ready to install—the final page of the installation wizard


    The partitioner will then do whatever you tell it to do in order to finish the
    partitioning process, after which the installation itself will seamlessly begin,
    without any additional input necessary from you.

    The progress of the installation will be indicated in progress windows along with
    a brief slide show so that you don''t have to ''veg out'' (and you''ll know how
    much more time you have left to in front of the TV).


    10. The installation is complete. When you come to the end of the first phase
    of the installation, you will be notified in a new window. You are given the option
    of either continuing to use the live CD or restarting the machine and running
    Ubuntu directly from your hard disk. Well, you didn''t go through all of this
    just to keep using the live CD, so let''s go for the second option by clicking
    the Restart now button, removing the live CD from your drive when it is automatically
    ejected, and pressing ENTER when prompted to do so. Your machine will then restart.'
  merge: -1
