    # Working with Bluetooth Devices


    While we are on the topic of file handling, it is probably a good time to learn
    how to work with Bluetooth devices. As I mentioned in Chapter 3, if you have a
    Bluetooth adapter in your machine, either built in or plugged into you have USB
    port, a Bluetooth icon will appear in the right half of the GNOME upper panel.


    # Pairing Devices


    Before you can transfer files between your Bluetooth devices, you need to pair
    them. This is how you do it:


    +   - Click the Bluetooth icon in the top panel, and select Set up new device.

    - In the Bluetooth setup wizard that appear, click Forward.

    - Ubuntu will then search for Bluetooth devices in the vicinity of your computer.
    Once it discovers a device, that device will appear in the center of the window,
    as in Figure 7-17. The device you want to pair appears, click it, and then click
    the Forward button.

    - In the next page of the wizard, a personal identification number (PIN) will
    appear (Figure 7-18). An input window should also appear in the Bluetooth device
    you''re trying to connect to. Input the PIN into that input box.

    - Assuming the pairing is successful, the final page of the wizard will then appear.
    Click Close to complete the pairing process.'
  merge: -1
  pgno: 144
- img_proc: true
  md: '![](img/add8efd602aad9815ee8abf27a7a293e_145_0.png)


    Figure 7-17: Searching and selecting nearby Bluetooth devices in Ubuntu


    ![](img/add8efd602aad9815ee8abf27a7a293e_145_1.png)


    Figure 7-18: The Bluetooth wizard provides you with a PIN to input into the device
    you''re pairing to.'
  merge: -1
