  md: '# Knowing Your Limits


    Assuming you downloaded and installed the recommended audio codecs in Ubuntu mentioned
    in Chapter 14, you shouldn''t encounter any problems handling music or podcasts
    on your digital media device in Ubuntu. Even if you didn''t install them, Ubuntu
    would automatically help you find the necessary if you try to play a file it doesn''t
    support out of the box. Nevertheless, not all formats work with equal degrees
    of comfort or success—it depends on your device and the file format''s compatibility
    with Ubuntu. As a general rule of thumb, most players will be able to handle MP3
    and unlocked AAC (.m4a) files. Check your device''s manual for specifics about
    other file formats (or just give them a try).


    As far as Ubuntu goes, it can work with all the files formatted with the exception
    of locked AAC files, but you will learn how to deal with this later in the chapter.


    NOTE Although working with your digital devices has become increasingly simple,
    it is still a relatively new procedure. It is always worth approaching things
    with a bit of caution by making sure to have backups of the files on your device
    before working with Ubuntu.


    # Mounting and Ejecting your iPod or iPhone


    Working with your iPod or iPhone is an extremely simple process. Basically, plug
    it in via a USB connector, and Ubuntu will mount the device so you can access
    it. An icon for your device will then appear on the desktop (Figure 15-1) and
    in the left pane of any Nautilus window you happen to have open. Two of those
    what-do-want-me-to-do-with-this-stuff type of windows appear when you insert a
    music CD or DVD into your drive or connect a digital camera to your machine via
    USB cable—for the music and podcasts on your device and one for the photos (also
    shown in Figure 15-1)—will also appear, usually directly above the other. By default,
    Ubuntu will point you to Rhythmbox for music-handling chores and F-Spot for photo
    handling, both of which will be discussed later in the chapter. Click OK in each
    window to accept Ubuntu''s choices.


    To ''eject'' your iPod or iPhone, either right-click the desktop icon for the
    device and select Eject or from a Nautilus window, click the button next to the
    icon for your device in the side pane of the window.'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# (Not) Auto-updating Your iPod or iPhone


    With the simple instructions as to how to use your iPod or iPhone with Ubuntu
    out of the way, it''s worth thinking about a couple of other things. Most important
    of these is the device''s auto updating settings. When you enable auto-update
    on your iPod or iPhone via iTunes, the function is set up within the device itself.
    You can use your iPod in Windows, Mac OS, or Linux—or all of them interchangeably.
    If you set up your iPod to auto-update songs and playlists, however, you are leaving
    yourself open for trouble unless you have exactly the same music collection on
    all of your machines.


    Figure 15-1: Ubuntu instantly recognizes your iPod or iPhone.


    ![](img/add8efd602aad9815ee8abf27a7a293e_310_0.png)'
  merge: -1
  pgno: 310
- img_proc: true
  md: 'The reason for this is simple. Although iTunes allow you to add files feature
    to your iPod, it does not allow you to copy files from. The auto-update feature
    is thus strictly a one-way street. This means that whenever you hook up your auto-update-enabled
    iPod to an iTunes-enabled computer, iTunes will automatically add the tracks in
    its library to your iPod; more frighteningly, it will remove any tracks from your
    iPod that are not present in that machine''s library. I learned this hard way
    when my wife''s loaded iPod to work and plugged it into my office Winbox with
    its completely empty iTunes library. When I brought the little Podster back home
    to her with nothing at all in it... what wasn''t she pretty!


    Make sure to disable your iPod''s auto-update function before bringing the device
    into the Linux world. To do this, connect your iPod to your Mac or Windows machine,
    and open iTunes. In the left pane of the iTunes window, click your iPod in the
    Devices section, and then in the Summary tab in the right pane, check the box
    next to the words manually manage music (or manually manage music and videos in
    photo-capable iPods), as shown in Figure 15-2. If you have a photo-capable device,
    repeat nearly the same process for your photos by clicking the Photos tab in the
    right pane and then unchecking the box next to the words Sync photos.


    ![](img/add8efd602aad9815ee8abf27a7a293e_311_0.png)


    # Working with Android-Based Phones


    Although the iPhone continues to be the king of the smartphone hill, it now has
    some strong competition from phones running Google''s Android operating system.
    Fortunately, working with your Android-powered device in Ubuntu'
  merge: -1
  pgno: 311
- img_proc: true
  md: 'is quite simple, and it''s only slightly different from working with an iPhone
    or iPod. Basically, this is the process:


    +   1. Connect your computer and Android-powered device using the USB cable that
    came with it.

    2. A "USB Connected" notification should appear on the notification bar at the
    top of your phone''s screen. Drag down the notification bar, and then touch USB
    Connected.

    3. A dialog box then appear upon your phone asking you to either mount or connect
    the connection. Touch Mount.


    > NOTE *Because there are different versions of the Android system in service
    today, it is possible that the details of the process described here be slightly
    different from that of your phone. You should still be able to follow along.*


    As with the iPhone, iPod touch, and photo-capable iPods, two windows will then
    appear asking you you want to run Rhythmbox to handle your music files and F-Spot
    for your photos. An icon for your device will then appear on your desktop and
    in the side pane of any Nautilus window (Figure 15-3).


    ![](img/add8efd602aad9815ee8abf27a7a293e_312_0.png)


    Figure 15-3: Ubuntu recognizes your Android-powered device and provides you with
    a number of ways to work with it.'
