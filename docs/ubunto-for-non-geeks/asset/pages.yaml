  md: 'Most people who don''t use spreadsheets think of them sort of giant calculators
    used for computing uncomfortably large sets of numbers, such as payrolls (which
    was the original purpose of such applications). That''s right, of course, but
    spreadsheets can be used for everyday tasks, such as projecting household budgets,
    calculating point averages (by teachers or students), figuring out how long it
    will take you to save up for your trip to Hungary, or even comparing the seat
    heights for the four or five motorcycles you are trying to choose among. And when
    doing any of these minor mathematical tasks, you can easily create graphs in order
    to make all the abstract numbers speak to you visually.


    If numbers are just not yours, you can still use Calc for creating lists of information,
    such as birthday lists, class rosters, shopping lists, address lists ... whatever.
    Sort them by date of birth, and so on. Everyone eventually seems to find some
    use for Calc, so don''t ignore it entirely.


    And if you are still not convinced that Calc has a place in your life, you might
    at least find some amusement from an Easter egg hidden within the program, which
    allows you to play a Space Invaders clone called Star-Wars (Figure 12-3). Just
    type `=GAME("Stani\uars")` into any cell in Calc, and press ENTER. The instructions
    are in German, but it should be easy enough to figure out how to play even if
    you don''t remember any of your high-school Deutsch.


    ![](img/add8efd602aad9815ee8abf27a7a293e_261_0.png)


    Figure 12-3: Space Invaders in OpenOffice.org Calc? Yup.'
  merge: -1
  pgno: 261
- img_proc: true
  md: '# Impress


    Impress is OpenOpenOffice.org''s answer to Microsoft''s PowerPoint, with which
    it is compatible. It allows you to create attractive slides for use in presentations
    and also allows you to create notes or handouts to accompany them. Although these
    features make Impress handy in business and education settings, you might not
    find as much value in it as a home user.


    # Draw


    More useful to the home user is OpenOffice.org Draw. Although Draw isn''t great
    for creating true graphics in the artistic sense, it is very useful for creating
    flowcharts, organizational diagrams (such seating arrangements for weddings or
    conferences), or any other document in which you want a bit more control over
    the placement of text and graphics (especially when two are combined), such as
    flyers, awards, diagrams, and newsletters. In this sense, Draw can be used quite
    effectively as a simple page layout program, as you can see in Figure 12-4.


    ![](img/add8efd602aad9815ee8abf27a7a293e_262_0.png)


    Figure 12-4: A newsletter created (and displayed) in OpenOffice.org Draw


    # Microsoft Office and OpenOffice.org File Compatibility


    Although I mention the point throughout this section, it is worthwhile to reemphasize
    that OpenOffice.org can read and write Microsoft Office files. This compatibility
    is quite good, though tables sometimes prove problematic.'
  merge: -1
  pgno: 262
- img_proc: true
  md: 'To read Microsoft Office files, all you need to do double-click the file in
    question, and it will open in the appropriate OpenOffice module. When saving files
    within OpenOffice.org to use within earlier versions of Microsoft Office, however,
    you must save them into the appropriate format, as OpenOffice.org will otherwise
    save files into its native format (.odt for Writer documents, .ods for Calc documents,
    and .odp for Impress documents) by default, and only the most recent versions
    of Office can deal with these.


    To do this when saving a file, click the small + next to the words Save window,
    and select the appropriate OpenOffice format from the list of available file formats
    that appears below—choose Microsoft Word 97/2000/XP for a Writer document, for
    example.


    # OpenOffice Features


    The three applications in OpenOffice.org (Writer, Calc, and Impress) are quite
    similar to pre-Office 2007 equivalents in Microsoft Office (Word, Excel, and PowerPoint),
    so switching to the OpenOffice applications should be relatively easy if you were
    used to those versions of Microsoft Office.


    If you don''t have any experience with Microsoft Office, you should still find
    it straightforward, because the basic layout is pretty intuitive. And if you are
    lacking in the intuition department, the built-in Help files are pretty good too.
    To help you along, the Tips system works just well like tools in the Windows and
    Mac worlds.(In case you aren''t what I''m talking about, tool tips are those little
    yellow boxes that pop up to tell you what a button or menu item does when you
    place your mouse over that feature). Another cool and helpful feature is What''s,
    which is a more detailed version of the Tips system. If you select Help ► What''s,
    your cursor will turn into a little question mark. Move that question mark cursor
    over almost any item in the OpenOffice interface, and you''ll find out what it
    does rather than just what the item is called.


    Despite all the straightforwardness I am speaking of, a few items will likely
    be unfamiliar to you. That the case, I will briefly discuss those items. I''ll
    be using the word processor, Writer, as I describe these things, if you want to
    run OpenOffice.org while following along, Writer might be a convenient starting
    point for you.


    # Getting to Know the Buttons


    Although you should be able to figure out what most of the buttons on the OpenOffice.org
    toolbars do, a few buttons are common to all OpenOffice modules and deserve a
    bit more explanation.


    # Export to PDF


    The Export to PDF button is situated to the left of the two printer buttons (Print
    and Print Preview). You can use this button to export, save, your document as
    a PDF file.


    ![](img/add8efd602aad9815ee8abf27a7a293e_263_0.png)'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# Hyperlink


    Clicking the Hyperlink button, the button to the left of the Table button, opens
    the Hyperlink window, from which you can assign links to specified documents—not
    only to web pages but also to documents on an individual computer and even targets
    within that document. Although a hyperlink on a web page is something we have
    all come to for granted, the idea of hyperlinking between text documents sounds
    like a pretty radical concept. It is, in fact, a rather one that has been around
    before you or I even heard of the Internet.


    # Navigator


    The fourth to the last in the top row (the one that looks like starburst) is the
    Navigator button. Clicking this button (or pressing the F5 key) opens the Navigator
    window (see Figure 12-5), which is a pretty cool navigational feature that comes
    handy when working with length or otherwise documents.


    The Navigator allows you to easily bounce back and forth between pages in a document
    or even between elements, such as sections, links, and so on. Say you have a document
    with lots of illustrations in it (like this chapter), you would jump directly
    from graphic to graphic. In this, you would double-click the word *Graphics* in
    the main pane of the Navigator window and then click the jump buttons (the odd
    little buttons to the left of the page number selector) to begin jumping.


    ![](img/add8efd602aad9815ee8abf27a7a293e_264_0.png)


    Figure 12-5: The Navigator window


    If you are dealing with a document containing various heading levels, such as
    all of the chapters in this book, you can also use Navigator to switch among those
    levels. Say you''ve decided to add a new main heading at the last minute to a
    document you''ve been. You then need to drop all all of the headings you had before
    down a notch; the former main heading becoming a subheadings. By double-clicking
    the word *Headings*, the text of all the headings you have listed in that document
    appears. You can then select a heading in that list and click the Demote Level
    button (that''s the one at the far right of the second row of buttons) to move
    it down a level.'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Gallery


    To the right of the Navigator button is the Gallery button. By clicking this button,
    the Gallery, a library of graphical elements for use in your documents or web
    pages, will appear in a separate pane at the top of your document window (see
    Figure 12-6). The elements within the Gallery range from various types of lines
    to buttons to colored three-dimensional doughnuts, and you can add items of your
    own.


    ![](img/add8efd602aad9815ee8abf27a7a293e_265_0.png)


    Figure 12-6: The Gallery


    Inserting a graphic into your document is a simple task even when not using the
    Gallery. All you need to do is select Insert > File > From File and then locate
    the image file you want to insert. It can be handier, however, when you intend
    to use custom graphics. Once in the Gallery, your graphics are always a click
    or two away and can be conveniently viewed in the Gallery browser window.


    The collection of artwork that comes with OpenOffice.org is mostly geared towards
    building web pages, but other clip art is available elsewhere. For example, you
    can find a great collection online at http://www.openclipart.org/. Everything
    is in the public domain, so it is all free to use. Be sure to check out the “Game
    badge” collection—it''s one of my favorites.


    Adding these (or any other) graphics to the Gallery is relatively easy to do.
    First you have to create a new category (called a theme) for each group of images
    you want to add. To create a Gallery theme of yours, just click the New Theme
    button in the Gallery window. This will open the Properties of New Theme window,
    where you should give yours a name. Once you''ve done that, click the Files tab
    and then find the Files button, which will open the Select Path window. From there
    you can navigate to the folder'
  merge: -1
  pgno: 265
- img_proc: true
  md: 'in which you are storing your clip art, photos, or other graphics. Once you
    have found the folder, click the OK button after which a list of all the files
    in New will appear in the Properties of New theme.


    From this window, you can easily add images to your New Gallery (you might want
    to make sure the box next to the word Preview is checked to make things a bit
    easier) and then clicking the Add button. Once you have done that the image will
    immediately appear in the Gallery browser in your theme, where it will remain
    for future use (Figure 12-7). When you are done adding images to your new theme,
    click the OK button, after which the Properties of New theme window will close,
    revealing your new theme and its contents. To use one of the images in the Gallery,
    just-click the image you want to insert into your document, choose Insert, and
    then select Copy or Link in the pop-up menu.


    If you''re more of a content-oriented type, you will be happy to know that you
    can use the Ubuntu Software Center to download and install a significant portion
    of the clipart available from http://www.openclipart.org/. Search for and install
    clipartopenoffice.org. After the somewhat download and install process is complete,
    restart OpenOffice (if it is running), and click the Gallery button. Your new
    collection will be here!


    ![](img/add8efd602aad9815ee8abf27a7a293e_266_0.png)


    Figure 12-7: Viewing clip art and your own collections in the Gallery


    # Styles and Formatting


    The final stop on our tour through OpenOffice.org''s unfamiliar buttons is the
    Styles and Formatting button, which is located at the far left side of the second
    row of buttons. This button acts as a toggle for the Styles and Formatting window
    (Figure 12-8), from which you can select and apply styles to any of the


    ![](img/add8efd602aad9815ee8abf27a7a293e_266_1.png)'
  merge: -1
  pgno: 266
- img_proc: true
  md: 'various elements within your document. Oh, if you just can''t take your hands
    off the keyboard for a moment to fiddle with the mouse, you can also open the
    window by pressing the F11 key.


    ![](img/add8efd602aad9815ee8abf27a7a293e_267_0.png)


    Figure 12-8: The Styles and Formatting window


    To give an example of how convenient using styles, imagine that you are typing
    a bibliography page for some document you''ve prepared. You typed each entry as
    any paragraph, as in the following:


    > Smythe, W. (2004). Considering the need for speech between non-human interlocutors
    beyond the age of seven. The Journal of the Society of Elves, Faeries, and Garden
    Gnomes, 20 (2), 125-147.


    Like most paragraphs you type, the entry is formatted as a first-line indent,
    except that you want a hanging indent, which is the norm for bibliography entries.
    Rather than messing around tabs or margins to get the way you want, all you have
    to do is click your mouse anywhere within the paragraph and then double-click
    the Hanging indent entry in the Styles and Formatting window. After that, as if
    by magic (though you know better), the transformation is made:


    > Smythe, W. (2004). Considering the need for speech between non-human interlocutors
    beyond the age of seven. The Journal of the Society of Elves, Faeries, and Garden
    Gnomes, 20 (2), 125-147.


    236 Chapter 12'
  merge: -1
  pgno: 267
- img_proc: true
  md: 'You could follow the procedure for each of your other entries or, with Hanging
    indent, click the paint can in the Styles and Formatting window, which your mouse
    cursor, when placed over the document, will appear as a paint can. Click in any
    other paragraph in your bibliography, and that entry, too, will be formatted in
    the new style. The process is essentially the same when applying different styles
    to any other document elements.


    One thing that might annoy you using the Styles and Formatting window is that
    it can be a pain at times, floating around as it does. It has a tendency to get
    in the way of your text no matter where you put it. Sure, you can toggle it on
    and off, but if you''re using it a number of times within the same document, this
    can get old old.


    A happy compromise is to dock the Styles and Formatting window into the main document
    window. You can do this by dragging the Styles and Formatting window to the top-left
    or top-right corner of the document work area. When an outline of the Styles and
    Formatting window appears around the indent portion of the window (as you can
    see in Figure 12-9), release the mouse button. The Styles and Formatting window
    will now appear as a pane on the side of the document window (Figure 12-10).


    ![](img/add8efd602aad9815ee8abf27a7a293e_268_0.png)


    Figure 12-9: Preparing to dock the Styles and Formatting window into place within
    the main document window'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# # Word Processing Done Lightly with AbiWord


    If OpenOffice''s Writer is a bit more powerful than what you need for your everyday
    word processing chores and you would prefer something that pops up as soon as
    you click the launcher, then you might want to consider giving another word processor,
    AbiWord, a try (Figure 12-11).


    ![](img/add8efd602aad9815ee8abf27a7a293e_269_0.png)


    Figure 12-10: The Styles and Formatting window in place as a pane within the main
    document window


    ![](img/add8efd602aad9815ee8abf27a7a293e_269_1.png)


    Figure 12-11: The linux word processor—AbiWord


    238 Chapter 12'
  merge: -1
  pgno: 269
- img_proc: true
  md: 'AbiWord has a very straightforward and easy-to-use interface, which you should
    be able to figure out without much, if any, help. It also has a couple of rather
    interesting features, such as its autosizeize function, which magnifies the onscreen
    document size (fonts, images, and everything) or shrinks it as you increase or
    decrease the size of the program window. And in you''re wondering, AbiWord can
    save and read Microsoft DOC files and save

    You can easily install AbiWord via the Ubuntu Software Center by performing a
    search for abiword. Once you have AbiWord installed, you can run it by selecting
    Applications > Office > AbiWord.


    # Some Other Cool Productivity Apps


    In addition to the more traditional office applications, a number of other applications
    are either included with or available for your system that can be grouped under
    the “productivity” label. I will introduce a few of those to you here.


    # Sticky Notes


    Mac users will be well familiar with the digital version of the now ubiquitous
    yellow Post-it notes called Sticky Notes (Figure 12-12) that come as part of the
    GNOME desktop. GNOME’s Sticky Notes is a panel applet that you can add to your
    own panel by right-clicking any open panel space and then selecting Add to Panel
    in the pop-up menu that appears. When the Add to Panel window appears, click Sticky
    Notes, and then click the Add button. Close the Add to Panel window by clicking
    Close. You will be ready for note-taking action.


    ![](img/add8efd602aad9815ee8abf27a7a293e_270_0.png)


    Figure 12-12: GNOME’s Sticky Notes'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# Tomboy


    If Sticky Notes just doesn''t cut it for you and your more dramatic note-taking
    needs, perhaps you will find yourself better served by another application that
    comes with your system, called Tomboy (Figure 12-13). Like Sticky Notes, Tomboy
    also works as a panel app, it is a bit more full featured, albeit making any claims
    to stickiness. Instead, the various notes you can be viewed by selecting them
    from the menu that appears when you click the Tomboy panel app. All in all, it''s
    a very handy approach.


    What gives Tomboy its brightness, however, is its search and hyperlink functions.
    These allow you to search for entries within your Tomboy note library and create
    hyperlinks that connect text in one note to another linked note. In fact, Tomboy
    will automatically create a hyperlink whenever you type a word that matches one
    of your note headings. To make matters even exciting (or at least useful), Tomboy,
    by means of its plug-in feature, allows you to export notes to HTML or print them,
    either as hard copy or as PDF docs.


    If you''d like to try Tomboy, start it by selecting Applications > Accessories
    > Tomboy Notes, after which Tomboy will appear in the GNOME panel.


    ![](img/add8efd602aad9815ee8abf27a7a293e_271_0.png)


    Figure 12-13: Notes taken seriously—Tomboy


    # GnuCash


    If you are familiar with the personal financial management software Quicken, then
    you might be interested in GnuCash, which is the Linux world''s best-known offering
    in the personal finance arena. It reads Quicken and Intuit QIF files, which makes
    things even nicer when you are making the transition from another operating system.
    Unfortunately, unless you live in Germany, you cannot use GnuCash for online banking.
    But as the GnuCash folks tell-say, don''t blame them; blame your bank.


    240 Chapter 12'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'To install GnuCash, do an Ubuntu Software Center search for gnucash, and then
    install both gnucash and gnucash-docs. Once these are installed, you can run the
    application by selecting Applications > Office > GnuCash Finance Management.


    # Scribus


    To round things out, we come to a open source desktop publishing application,
    Scribus (Figure 12-14), for those times when OpenOffice.org Writer and Draw just
    don''t cut it. Scribus is designed to produce commercial-grade output, with support
    for professional publishing features, as CMYK colors, PostScript handling, and
    creation of color separations, to name a few.


    ![](img/add8efd602aad9815ee8abf27a7a293e_272_0.png)


    Figure 12-14: Scribus


    You can download and install Scribus by doing an Ubuntu Software Center search
    for scribus. Once the installation is complete, you can run the application by
    selecting Applications > Graphics > Scribus.'
