    # Even More 3D Games—Beyond the Ubuntu Software Center


    I hope you''ve found something agreeable among my recommendations so far, but
    it''s hardly an exhaustive list. In fact, hundreds of games will run on Ubuntu
    that haven''t made their way into the Ubuntu Software Center yet.


    PlayDeb (http://ubuntu.playdeb.net/) is a good source of extra games. Everything
    on PlayDeb is available through its own Ubuntu-friendly repository, so you''ll
    be able to install its games through the Ubuntu Software Center once you''ve added
    the PlayDeb repository to your list. See “Adding Extra Software Repositories”
    on page 86 for full details—the APT line that you need is deb http://archive.getdeb.net/ubuntu
    lucid-getdeb games.


    In the next chapter, I''ll also explain how you can run Windows games in Ubuntu
    using Wine. Indeed, this is how many people enjoy big commercial titles that have
    Linux versions: Guild Wars, Spore, and Call of Duty are just a few examples of
    games that can be run flawlessly in this way. If this sounds like your sort of
    thing, Project 18C-3 will be of particular interest to you—a neat little app called
    PlayOnLinux (Figure 17-16) can be used to handle most of the fiddly configuration
    stuff that is often required for less wellsupported games running under Wine.'
