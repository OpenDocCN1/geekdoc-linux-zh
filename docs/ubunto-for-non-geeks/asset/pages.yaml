    # Creating and Deleting Partitions


    You can create new partitions only if you have some "free space" to put them in.
    This is free space in the sense that there''s not already a partition on part
    of the disk, not that there are no files there. One way of creating free space
    is to delete an existing partition; to do this, click the list item for the partition,
    and click **Delete**. After a few seconds it''ll change into free space in the
    list (Figure C-2). Alternatively, if you''re planning to completely change your
    partition setup, select the hard disk you want to modify, and click **New Partition
    Table**. You will be left with a completely blank slate, where all you need to
    do is add partitions.


    Select any free space, and click **Add** to put a new partition in. You''ll be
    presented with a new partition window (Figure C-3), which will ask how big you
    want to make the partition in megabytes (1GB is roughly 1000.MB). See "Variations
    of Partitions" on page 416 for advice on how to make your partitions.


    The Use as option lets specify the filesystem you want to use. A *filesystem*
    tells your operating system how to store files on that partition. There are a
    number of different filesystems you can choose, but not all of them can be understood
    by Windows and Mac OS. Ext4 is the best choice for a partition that will be used
    solely by Linux, but FAT32 is the one you need if you want to share files with
    Windows or Mac OS.'
