  md: '# The Installer Stops Partway Through


    This is probably one of the most annoying problems you can encounter. You boot
    from the Ubuntu CD, go through all the pages of options described in Chapter 2,
    and then click Install to start installing Ubuntu. But, after all that, the installer
    doesn''t finish and gets a few percent shy of 100.


    There are lots of reasons why this might happen, most of which relate to misbehaving
    hardware. I briefly described a few of the things you can try in this section,
    but because the underlying problem might be peculiar to the hardware in your computer,
    you will probably need to ask for help on the Ubuntu forums.


    **Wait for a while** Installation takes longer on some computers than others.
    There are many reasons why this could happen (such as problems getting hardware
    to work), but if you give it an extra 20 or 30 minutes, it might finish.


    **Disconnect from the Internet** If you are connected to the Internet, the installer
    might try to fetch extra settings or look for package updates while it is running.
    If something goes wrong when it tries to do this, it could stall, and the installation
    won''t finish. Restart your computer and boot from the live CD again, this time
    make sure you disconnect from the Internet before starting the installer.


    **Disconnect any unnecessary devices** Some computer hardware can confuse the
    installer just by being plugged in. Turn off your computer, and disconnect or
    switch off any devices that you don''t absolutely need to have. Printers, scanners,
    USB wireless cards, and external hard disks in particular should be disconnected.
    Then, start the computer, and attempt the installation again. Once installation
    is complete, you should be able to plug everything back in without any problems.


    **Check the integrity of the CD** If the CD has a fault on it, the installer might
    not be able to access something that it needs from the disc. "My Computer Won''t
    Boot from the CD" on page 376 for advice on how to check the integrity of the
    CD.


    # Something Goes Wrong Before Ubuntu Finishes Booting


    Boot problems are especially awkward—if Ubuntu won''t start, how can you access
    the software you need to fix the problem? To get around this particular annoyance,
    you might need to start the computer from a live CD (like the one included with
    this book) or use some special options to help the process along.


    This section covers the two most common classes of boot problems, GRUB errors
    and kernel problems. There''s some general advice for other types of boot problem
    too, including tips for dual-booters struggling to get Windows to start.'
