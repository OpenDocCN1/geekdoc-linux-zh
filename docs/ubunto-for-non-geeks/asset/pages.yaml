    but that is an aesthetic matter that I will leave up to you. Ah, the sweet taste
    of freedom.


    # 8B-6: Downloading and Installing the Art Manager (GNOME Art)


    Searching for the Internet for wallpaper to install can be quite a fun adventure,
    but sometimes it can also feel like quite a chore. Fortunately for you, me, and
    all involved in such things, there is an easier way: The Art Manager, also known
    as GNOME Art, a handy application that searches the http://art.gnome.org/ and
    downloads a list, thumbnails of all the wallpapers that are available. It can
    also do this for the various border controls, and icon themes that you can use
    in the following parts of this project. Using the thumbnail list, you can easily
    download and install whatever you want—all without ever placing a cursor in your
    browser. To say, the Art Manager is decidedly cool!


    Unfortunately, the Art Manager is not installed by default. However, after going
    through Chapter 6, you know how easy it is to download and install applications
    like the Art Manager. You all have to run the Ubuntu Software Center, search for
    gnome-art, and then install the Art Manager.


    You can then run the Art Manager by selecting System > Preferences > Art GNOME
    window will then appear with absolutely nothing in it. To put it to use and relieve
    that emptiness, select Art > Backgrounds > GNOME. (You can select instead of GNOME
    if you like, but it will take longer to download the list of available wallpapers.)


    Once you''ve made your selection, the Art Manager will begin downloading a list
    of all that is available for you at http://art.gnome.org/. It may seem like nothing
    is happening for a minute or so, but that is normal; just hang in there. It might
    take a few minutes to download previews of the backgrounds, but when it''s done,
    you will see a list of thumbnails for you to choose from (Figure 8-9).


    You can now install wallpaper by scrolling down until you find one that suits
    your fancy, clicking it once to highlight it, and then clicking the Install button.
    The Art Manager will then download and install it. After that, the Appearance
    Preferences window, and choose the wallpaper you just downloaded as your desktop
    wallpaper. As I said before, the Art Manager is a very handy tool to have, especially
    since you''ll be using it more soon within this project.'
  merge: -1
  pgno: 164
- img_proc: true
  md: '![](img/add8efd602aad9815ee8abf27a7a293e_165_0.png)


    **Figure 8-9:** Installing desktop wallpapers using the Art Manager


    # 8B-7: Changing Window Borders, Controls, and Icon Sets


    Now we get to my favorite part of this journey through the world of digital cosmetic
    surgery—changing the window borders and controls look in GNOME. The procedure
    is really quite easy. Select **System > Preferences > Appearance**. The Appearance
    window will open to the Theme tab, showing you a list of the themes that are installed
    on your system (**Figure 8-10**). The default theme in Lucid Lynx is *Ambiance*,
    but as you can see, there are others.


    To get the hang, take a look at each of the themes listed by clicking one by one.
    The changes will take effect immediately. Just clicking a theme will change your
    window borders, controls, and even, if you take a peek in your home folder, the
    icons. This is especially noticeable when you click Dust San or Wave New.


    Each theme consists of a window border, a set of controls, and a collection of
    icons. It''s also possible to mix and match these elements on your own. For example,
    let''s say that the subdued look and color of the controls in Dust, but you prefer
    the window icons in Clearlooks and the borders in DarkRoom. Well, you needn''t
    despair, because you can create a custom theme consisting of these three different
    elements.


    To create your own mix-and-match theme, just click the *Customize* button on the
    Theme tab of the Appearance window. A new window will open, in you will find five
    tabs: Controls, Colors, Window Border, Icons, and Pointer (**Figure 8-11**). From
    each of these tabs, you can select the components you prefer. For now, let''s
    first the **Controls** tab and select Dust. Then click the Window Border tab,
    and select DarkRoom. Finally, click the Icons tab, and select GNOME.'
  merge: -1
  pgno: 165
- img_proc: true
  md: '![](img/add8efd602aad9815ee8abf27a7a293e_166_0.png)


    ![](img/add8efd602aad9815ee8abf27a7a293e_166_1.png)


    Dressing Up the Bird 135'
  merge: -1
