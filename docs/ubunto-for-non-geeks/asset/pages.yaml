  md: 'To create an archive


    ```

    tar -cvf pics4pals.tar photos

    ```


    As you no doubt noticed, there are some flags after the tar command in that string.
    The c tells the tar program to create a new archive. The v tells the program to
    be verbose, or, in other words, to tell you what it is doing in the Terminal as
    it is doing it. Finally, the f tells the program what follows is the file information.


    If, after creating the archive, you suddenly remember that there is one more file
    you want to add to the mix, you would use the -r flag to append the archive.


    For example, to add a file called cranky.png to the archive, you would type the
    following and then press ENTER:


    ```

    tar -rvf pics4pals.tar cranky.png

    ```


    Of course, chances are that you will be doing tarball extracting rather than creating,
    so no doubt you know how to do it. Fortunately, the process is pretty similar
    to what you use when creating the tarball. The main difference is in the first
    flag. Rather than using the tar command with the -c flag, you would instead use
    it with the -x flag, which tells the tar program to extract the specified archive.
    So if you want to extract a tarball called spicyfood.tar, type the following command,
    and press ENTER:


    ```

    tar -xvf spicyfood.tar

    ```


    What you have done thus far is creating and extracting archives, which are basically
    collections of files. They are not, however, compressed. In fact, most tarballs
    you will find are compressed, and you can tell that by the ending tar.gz. That
    means that the archive was compressed using the gzip program. Extracting a compressed
    tarball is just as easy as extracting a straight tar archive; all you have to
    do is add the -z flag to use the gzip program tocompress the archive. For example,
    if you want to extract a compressed tarball called gooseedown.tar.gz, type the
    following command, and press ENTER:


    ```

    tar -xzvf gooseedown.tar.gz

    ```


    Now that you know how to compress and extract a gzipped tarball, you probably
    want know how to create one. This is again, little different than creating the
    tar archive itself; you would just add the -z flag to tell the'
