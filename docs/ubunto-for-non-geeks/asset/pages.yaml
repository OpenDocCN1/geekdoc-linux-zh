  md: '# # Setting Up IBus to Automatically Start Up When You Log In


    As you probably recall from when you first opened the IBus Preferences window,
    you have to start up IBus each time you log into your system. If you use IBus
    a lot and thus prefer forgoing this extra step, you can easily set up your system
    to start it automatically when you log in. All you have to do is select **System
    ▸ Administration ▸ Language Support.


    In the Language tab, select ibus in the drop-down menu next to the words **Keyboard
    input method system**, as shown in Figure 11-16. When done, close the window.
    The next time you log in, IBus will automatically start up and be ready for action
    when you need to use it.


    ![](img/add8efd602aad9815ee8abf27a7a293e_254_0.png)


    > *Figure 11-16: Setting up your system so that IBus automatically starts at login*


    If IBus still does not start up automatically the next time you log in, try adding
    it to your system''s list of startup applications. To do this, select **Preferences
    ▸ Startup Applications**, and in the Startup Applications Preferences window,
    click the **Add** button. In the Name box type *ibus*, and in the Command box
    type `/usr/bin/ibus-daemon`. When done, click Add, and then close the Startup
    Applications Preferences window.


    # # Viewing Your System in Another Language


    One of the many things that originally attracted me to the Linux world was being
    able to install language support for languages other than English and come up
    with a whole new system in a different language. On one of my machines, I have
    installed support for Chinese, Japanese, Swedish, and my default. With just a
    simple logout and a few more clicks, I can log back in with an interface in a
    totally different language. I can have a Chinese, Japanese, or Swedish system
    whenever I want.'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'This is very useful if you''re in an environment where not everyone shares
    the native language. At my former university, for example, where Japanese and
    Chinese students sometimes used my computer, the additional language support allowed
    them to log in using their own language. It''s even pretty handy if you are studying
    a foreign language and want to give yourself as much exposure as possible to it.
    In all, it is a very useful feature.


    Taking advantage of the GNOME environment is very easy. Basically all you have
    to do is install a group of support files for each language you want to add to
    your system. You can do this by going to the **System ► Language Support**, after
    which the Language window will appear. In that window, click the **Install/Remove
    Languages** button. In the Installed Languages window that appears, choose from
    the various languages available. If you are installing language support for languages
    with writing systems, such as Japanese, be sure to also check the boxes next to
    the words *Input methods and Extra fonts (Figure 11-17)*.


    Once you have made your selections, click the **Apply Changes** button. You will
    be prompted for your password at this point, so provide what is required, and
    the Language Support tool will begin downloading and then installing the support
    packages you specified. Once it is done, you will be notified and left with the
    Language window.


    ![](img/add8efd602aad9815ee8abf27a7a293e_255_0.png)


    Figure 11-17: Selecting additional languages to install


    Once you have installed support for the additional languages you want, you can
    choose to have your system open in a different language environment by using the
    Language window (**System ► Administration ► Language Support**). In the Language
    tab of that window, select the language you want to use next login, and drag it
    to the top of the list (Figure 11-18). For languages with complex input methods,
    you can also select your input method of choice, such as IBus, in the menu button
    next to the *Keyboard input method system*. You can then close the window, log
    out, and log in again, after which your system will appear in the language you
    chose.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '![](img/add8efd602aad9815ee8abf27a7a293e_256_0.png)


    If you prefer, you can instead make these login choices from the login screen.
