  md: '# Taking Control of Firestarter


    You can control how Firestarter deals with various network events by creating
    your own policies. The default policy set set in Firestarter allows you to do
    what you normally do via the Internet, while it blocks new connections to your
    computer from any other computer on your network.


    To make things a bit more draconian, you can click the Policy tag, select Outbound
    traffic policy in the Editing drop-down, and select Restrictive by default, whitelist
    traffic. If you just want to deny anyone working on your computer access to a
    specific website, for instance, simply select Permissive by default, blacklisted
    traffic, right-click the Deny connections to host field, and select Add Rule in
    the pop-up menu. In the Add new rule window, enter the domain name for the targeted
    site (as in example.com), click Add, and then click the Apply Policy button in
    the main Firestarter window (it''s the one that looks like a green check mark).


    # Confirming Firestarter Runs Automatically


    After you run Firestarter the first time, it will set itself to automatically
    start whenever you start your system. Don''t be concerned when you don''t see
    the graphical interface you saw when you first started; Firestarter will be running
    in the background, silently protecting your computer.


    If you are the doubting type, you can check to see whether Firestarter is actually
    running in the background by opening a Terminal window, typing sudo /etc/init.d/firestarter
    status and pressing ENTER. If Firestarter is running, you will see the message
    * Firestarter is running... in the Terminal window. Worries over. If Firestarter
    isn''t running, the response will read * Firestarter is stopped.


    # Finding Out More


    If the world of firewalls is new to you, you can check out the Firestarter home
    page to learn a bit more. To check out the online manual, just to go to the Firestarter
    Help menu, and select Online Users'' Manual, which will open the page in your
    browser. If you prefer to check out the manual before installing Firestarter,
    point your browser to http://www.fs-security.com/docs/. You will also find a pretty
    good tutorial there.


    # ClamAV: Antivirus Software, Linux Style


    Despite the load of viruses that can wreak upon your Linux system, your computer
    could still act as a transmitter of Windows viruses. As a result, a number of
    free antivirus scanners are available for Linux users interested in helping protect
    Windows users from viruses. These include Panda Desktop Secure (http://www.pandasecurity.com/usa/homeusers/downloads/desktopsecure/),
    F-Prot (http://f-prot.com/), and numerous others. For most Linux users, however,
    the virus scanner of choice is the open source contender: ClamAV.'
  merge: -1
  pgno: 375
- img_proc: true
  md: 'Although it can be used on a number of operating systems, ClamAV is considered
    to be the Linux antivirus package. It is open source and totally free, and you
    don''t have to worry about licenses or suffer the bother of renewing them. Unfortunately,
    ClamAV is a command-driven application, which makes it its own a bit less user-friendly.
    Fortunately for all involved, a graphical interface is available; it goes by the
    name of ClamTk. Both ClamAV and ClamTk are available via the Ubuntu Software Center—just
    search for clamtk, install Virus Scanner. The Ubuntu Software Center will automatically
    install ClamAV and all other packages it needs to run.


    Once ClamTk is installed, you can perform a scan by selecting Applications > Accessories
    > Virus Scanner. This will open the ClamTk Virus Scanner window (Figure 19-5).


    Once up and running, you can scan your system on demand from the Clam menu. To
    scan a single folder, select A Directory. To scan a directory and everything within
    it, choose Recursive. In either case, the Select Directory window will appear.
    Select the folder or disc you want to scan, and click OK. ClamAV will then start
    scanning your system. ClamTk will tell you what it is scanning at any given moment
    in the empty space just below the button bar. If it finds anything suspicious,
    it will list that in the main pane of the window.


    ![](img/add8efd602aad9815ee8abf27a7a293e_376_0.png)


    Figure 19-5: ClamTk—the default interface for signature updates when it starts.


    ClamAV is set up to check for signature updates when it starts. These signature
    updates tell ClamAV what new viruses to be on the lookout for. If you leave your
    machine on for days and days at a time, it is probably also a good idea to set
    things up that ClamAV will automatically check for signature updates daily rather
    than just on startup. To do this, go to the Advanced menu, and select Scheduler.
    In the Scheduler window, select a time for ClamAV to update its cache in the bottom
    half of the window. Click OK when done. You can also use this window to set up
    a time to regularly scan the system—just select the time you''d like the scan
    to occur, and click Add. When you''re finished, click Close.


    As I mentioned, the only errors you are likely to encounter during a virus scan
    are those designed for Windows systems, which cannot affect your Linux system.
    Although it won''t hurt you any to scan your entire system for viruses,'
  merge: -1
  pgno: 376
- img_proc: true
  md: 'The main avast window (Figure 19-7) will appear, but before you

    get started scanning away, it is a good idea to check for any updates to

    y virus database. New viruses are constantly appearing in cyberspace, so you

    should keep avast!''s virus up-to-date so that it recognizes any viral

    newcomers. To perform the update, just click the Update database button,

    and let avast! do its thing.'
