  md: '# Project 17B: Installing a Java-Based Game: Schnapsen


    As you can see from all the games discussed so far in this chapter, the Ubuntu
    Software Center is a great one-stop shop for most Linux games. You have also learned,
    however, there are many games beyond those in the Ubuntu Software Center. These
    include the games you worked with in Chapter 9 that were written in scripting
    languages, such as the Python-based PyWings and the Tcl/Tk-based Bismarck, but
    it just wouldn''t be right to leave out games written in what might be considered
    the mother of all scripting languages—Java. In this project, you''ll learn how
    to install the Java Runtime Environment and how to install and run the Java-based
    version of a classic Austrian card game: Schnapsen.


    # 17B-1: Installing the Java Runtime Environment


    To run Java-based applications, or scripts, you need to first install the Java
    Runtime Environment. You can do this via the Ubuntu Software Center by searching
    for and installing openjdk 6 runtime. The whole set of Java packages is pretty
    hefty in terms of download weight, so don''t get freaked out if it seems to take
    longer than usual. When the process is complete, close the Ubuntu Software Center,
    and move on to the next part of the project.


    ![](img/add8efd602aad9815ee8abf27a7a293e_349_0.png)


    Figure 17-16: PlayOnLinux, displaying a list of some of the Windows games it supports'
  merge: -1
  pgno: 349
- img_proc: true
  md: '# 17B-2: Getting and Extracting Schnapsen


    Once you''ve installed the Java Runtime Environment, you need to run a Java application
    in order to see it at work. The application you''ll be installing is one I had
    been searching for ever since I moved to the world of Linux, a 20-card Austrian
    card game called Schnapsen, shown in Figure 17-17.


    To get started, you will need to download and extract Schnapsen. Here''s what
    you need to do:


    +   1. Open your web browser, and go to http://projects.hagru.at/tjger/en/

    2. On that page, click the Schnapsen link in the left frame.

    3. In the right frame, click Schnapsen.zip.


    ![](img/add8efd602aad9815ee8abf27a7a293e_350_0.png)


    Figure 17-17: A Java version of the Austrian card game, Schnapsen


    +   4. In the Opening Schnapsen_1.00.zip window that appears, accept the default,
    *Open with Archive Manager*, by clicking **OK**.

    5. When the Archive Manager window appears, click the **Extract** button, which
    will open the Extract window.

    6. In that window, click the **Create Folder** button, and create a folder within
    your home folder called *Schnapsen*.

    7. Click the **Extract** button in that window, and when the extraction process
    is complete, quit Archive Manager.'
