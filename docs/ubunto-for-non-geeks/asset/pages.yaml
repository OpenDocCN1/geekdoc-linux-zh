  md: '# 9B-6: RunningpyWings


    Now that you have pyWings in place and ready for action, let''s start up the great
    oracle right now that you can get a better perspective on how to deal with the
    aspects of life that trouble you.


    In the Terminal, make sure you are in your home directory, type the following
    command string, and then press ENTER:


    ```

    python ~/LocalApps/pyWings/pyWings.py

    ```


    Since pyWings.py is a Python script, rather than an application, you are calling
    Python''s attention to fact so that Python will know it needs to deal with that.
    If all went according to plan, pyWings should be up and running and will soon
    be making you a wiser person.


    # 9B-7: Creating a Launchable Link for pyWings


    The method of running pyWings that you''ve just used works well enough, but it
    is a pain to open your Terminal and type that somewhat string every time you want
    to find out what has in store for you. Let''s find a way to make things easier
    in the future.


    To run an application from the Terminal, you generally type the name of that program''s
    executable file; the application''s name acts as a sort of command. For your system
    to recognize that command, however, the command (the executable file or link to
    it) must be in a location where the system can find it. Whenever you run a command
    of any sort, your system checks a series of locations (most of which are folders,
    where executable files are located) to find that command.


    You can easily find where these locations are by typing echo PATH in a new Terminal
    and pressing ENTER. As you will see, on your Ubuntu system, these locations are
    as follows:


    +   * /usr/local/bin /bin

    * /usr/local/sbin /usr/bin

    * /sbin /games

    * /usr/sbin


    > The results of the echo PATH command will not appear as they do in the easier-to-read
    chart shown here, but rather, in a single line divided by colons: The actual output
    shown in the Terminal is /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games.


    If the command you typed is in one of those locations, the program, or script,
    will run. As you no doubt know, however, pyWings is not in any of those locations.
    It is in /home/username/LocalApps/pyWings and thus is, in a sense, out of your
    system''s sight.'
