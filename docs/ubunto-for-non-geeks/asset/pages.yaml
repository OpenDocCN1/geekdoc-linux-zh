    # $ ls


    Another harmless but handy command is ls (list directory contents). The ls command
    shows you what is in your current directory. This is the nongraphical equivalent
    of double-clicking a folder in Nautilus to see what is inside. Try it by typing
    ls and pressing the ENTER key.


    If you''ve been following my commands so far, your results will list all of the
    folders in your home directory. You can also use the -R flag show not only the
    list of folders in the folder but also what is within the subfolders. of course,
    you should have no subfolders in any of the folders you created in Chapters 7
    and 8, so you can hold off experimenting with this for a while. Instead, try typing
    ls -a to see your invisible, or hidden, files.


    # $ calendar


    I''ll let you experiment with this one on your own. Just type calendar, and press
    ENTER to see the interesting results.


    # $ exit


    The exit command is a simple one that allows you to exit the Terminal. Just type
    exit, and press ENTER. The Terminal window will close.


    # Commands with Some Teeth


    The commands you have tried so far are all of the safe-and-sane, fire marshal-approved
    variety; they merely print information to your Terminal. You are now going to
    get some real tangible results from the commands you use. These commands are also
    essentially safe and safe if you follow my instructions.'
