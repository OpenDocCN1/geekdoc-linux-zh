- img_proc: true
  md: 'Before you can use this command, though, you will need to create a database
    of filenames to locate use. This is where using the sudo command, along with yet
    another command, updateddb, comes into play. Just sudo updateddb, and press ENTER.
    After you type your password when asked to do, it will seem that nothing is happening
    for a while, but don''t worry. As long as the cursor in your Terminal is blinking,
    progress is being made, and when your user prompt returns, you will have successfully
