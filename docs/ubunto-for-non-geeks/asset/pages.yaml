    # Project 6C: Installing DEB Packages Not Available via the Ubuntu Repositories:
    Skype


    As you may recall, the applications you install from the various repositories
    via the Ubuntu Software Center are in the form of DEB packages. Although it might
    seem that these repositories contain just about piece of software possible, certain
    packages, for one reason or another, will never find their way into a repository.
    Skype is one of these packages.


    Skype, shown in Figure 6-11, is Voice over IP (VoIP) software that allows you
    to speak to other Skype users over the Internet, with the clarity of a regular
    telephone line. And the best part is, it doesn''t cost anything—even if you call
    overseas. Skype also offers paid services, such as SkypeOut, which allows you
    to call regular mobile and landline telephone numbers from your computer at a
    fraction of what it would normally cost from a regular telephone.


    ![](img/add8efd602aad9815ee8abf27a7a293e_121_0.png)


    Figure 6-11: Skype'
