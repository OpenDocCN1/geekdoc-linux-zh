  md: '# Adding Extra Software Repositories


    The Ubuntu software repositories contain more than 30,000 packages—enough to last
    a lifetime, or so you might think. But as it turns out, a whole world of software
    is waiting for you outside the official Ubuntu repositories, and it is not much
    more difficult to reach. Various individuals and companies compile small numbers
    of packages that are not available in Ubuntu yet own third-party repositories.
    These are typically free to access, if you can find them. All you need to do is
    tell APT search for packages in one of these repositories as well as Ubuntu''s,
    and you''ll be able to get the extra software.


    Each repository has its own APT line. This is similar to a web address but contains
    extra information about the repository, which APT uses to figure out what sort
    of packages it contains. You''ll need to get the correct APT line from the website
    of the repository you''re trying to add, so pick an example to see how it works.
    Open Firefox, and head over to http://www.getdeb.net/updates/ubuntu/all_to_install
    GetDeb specializes in making packages for software that are not officially made
    into Ubuntu yet. There should be instructions on installing packages from GetDeb
    in a box at the top of the page, skip to the second item in the list and find
    the APT line, which should look something like this: deb http://archive.getdeb.net/ubuntu
    lucid-aptid. This follows the same format as all APT lines: the deb, followed
    by an address, followed by a couple of words that specify which part of the repository
    should be checked by APT when it. Highlight the APT line, right-click it, and
    select Copy from the pop-up menu.


    While you''re in Firefox, you''ll also need to grab the repository''s GPG key
    (which I''ll explain more at the end of this section). It should be linked from
    the same website you got the APT line from; in the case of GetDeb, go to http://archive.getdeb.net/getdeb-archive.key.
    When the Opening getdeb-archive window opens, Save File, and click OK to save
    the key file.


    Now that you''re in possession of these vital bits of information, adding the
    repository to your system is perfectly straightforward:


    +   1. Select System > Administration > Software Sources. Enter your password
    if asked, and then click the Other Software tab in the Software Sources window
    that appears.


    +   2. Click Add. You''ll be prompted to enter the APT line, so paste it into
    the box, and click Add Source (Figure-6-7). A new entry should appear in the Other
    Software list.


    +   3. Select the Authentication tab, and click Import Key File. Use the window
    that appears to find the .key file you downloaded earlier. (It''s probably in
    your Downloads folder).


    +   4. Select the .key file by clicking it once, and then click OK. Check the
    list of trusted software providers to make sure that the GetDeb Automatic Signing
    Key is now present, as it is in Figure-6-8.'
  merge: -1
  pgno: 117
- img_proc: true
  md: 'Figure 6-7: Entering the APT line for the GetDeb repository


    ![](img/add8efd602aad9815ee8abf27a7a293e_118_0.png)


    Figure 6-8: Checking the list of trusted software providers to see whether the
    GetDeb key is there


    +   5. Close the Software Sources window. You''ll be told that the information
    about available software is outdated, so click Reload to fetch the most recent
    package information. It might take a little while to download.

    6. Open the Ubuntu Software Center (or close it and then reopen it, if it was
    already open), and search for the program you wanted from the new repository.
    For instance, searching for BookWrite, a fun little to help you write your own
    novel. It should appear in the search results just like any other application,
