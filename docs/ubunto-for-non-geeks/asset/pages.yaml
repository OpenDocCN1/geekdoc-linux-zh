    # 9B-1: Getting Ready for pyWings (Installing Tkinter)


    As I mentioned, one difference between pyWings and the rest of applications you
    know is that pyWings is a Python script. To create a graphical interface for it,
    pyWings uses a toolbox known as Tkinter, which is the facto standard (though not
    the only) GUI toolbox for Python. however, no longer comes bundled with Ubuntu,
    so you will need to download and install it yourself. Fortunately, this is quite
    easily done.


    Although it is possible to open the Ubuntu Software Center and install Tkinter
    by the simple means learned in Chapter 6, it seems more appropriate in this command
    line-oriented chapter to . . . yeah, you might use the command line. That said,
    open a terminal window, type sudo apt install python3-tk, and then press ENTER.
    When asked for your password, type it, and then press ENTER. APT will search the
    repositories and find your file. Once it is ready, it will ask you whether you
    want to continue. You do, so type y, and then press ENTER. When your username
    prompt appears, you''ll know the job is done, and you can go on to the next step.


    > If you prefer, you can perform this installation using aptitude instead, using
    the techniques we discussed earlier in the chapter.


    # 9B-2: getting pyWings


    You are just ready to begin "installing" pyWings, but before you do, you need
    to get it from http://sourceforge.net/projects/pywings/. Once there, click the
