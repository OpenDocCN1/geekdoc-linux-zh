  md: '3. Click the Detect button to identify your modem. If you get a message saying
    that no modem was found on your system, then you''re out of luck—the best you
    can do is ask for advice on the Ubuntu forums (http://www.ubuntuforums.org/) or
    selecting items from the Devices drop-down list by trial and error.


    4. How you change the rest of the settings depends on how your modem and ISP are
    set up, so select the defaults for now. If these don''t work, trial and error
    is a potential way forward again.


    5. Click Close to get back to the GNOME PPP window. Type your username and password,
    and enter the phone number provided by your ISP.


    6. Click Connect. You should hear your modem begin dialing, spitting, and churning
    sequence as it makes the connection with your provider.


    7. If you manage to get connected, you can start browsing, emailing, or whatever
    it is you do online. If you get an error message, there''s little you can do but
    take a deep breath and click the Setup button to tweaking your settings.


    # What to Do If Your Modem Isn''t Compatible


    It might not sound that way, what I''ve just described is pretty much a best-case
    scenario. What happens, however, if your modem and Ubuntu do not see eye to eye?
    Well, there are a few options. My first, more radical suggestion, is to dump your
    dial-up ISP and find a broadband provider that covers your local area. If that
    is not an option, then you have two ways to go. One is to try to get around your
    modem to work is a slightly more complicated process, but there are instructions
    at https://help.ubuntu.com/community/DialupModemHowto. If you are faint of heart
    or a novice user, you may find that the process entails is a bit more than you''re
    willing to deal with.


    The simpler, the costlier, to get your modem to work is to purchase a true hardware
    modem. Hardware modems are not software, so they work with any operating system.
    You can think of them as telephones without a handset.


    Such modernos come in two forms: internal and external. For the internals, the
    USRobotics models 56K V.92 Performance Pro Modem (internal slot) and 56 PC Card
    Modem (PC card slot, for laptops) are true hardware hardware that are easily available
    and said to work. You can check out the USRobotics site (http://www.usr.com/)
    for more information on these models, though checking the Ubuntu forums for suggestions
    is always a good idea.


    Perhaps the safest of all solutions is to buy an external dial-up modem. This
    may come either serial or USB connectors and sit in a box outside your computer.
    Because the modem doesn''t use your operating system to operate, it does not tie
    up system resources while it''s busy, which may result in a possible pickup in
    connection speed.'
