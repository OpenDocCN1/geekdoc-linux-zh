  md: '# Project 8C: Installing TrueType Fonts


    Your Ubuntu system comes with a wide variety of very usable, and at least according
    to my eyes, rather handsome TrueType fonts. However, these tend to be a bit on
    the conservative side of the aesthetic spectrum, and many users will want to add
    a few distinctive fonts to the system repertoire. In my own case, I had this really
    cool idea of writing messages to my friend in Scandinavian runes. (Of course,
    my friend wet-blanketed the idea, so all came to naught . .


    You probably won''t be interested in sending cryptic, run messages to your friends,
    but you may want to print an award for an event using some sort of Gothic font,
    or you might be preparing a newsletter for the local chapter of your snail-breeders
    society and use a font that is round, bubbly, and slimy. Whatever your penchant,
    purpose, or desire, you will probably come to the point when you want to install
    some other TrueType fonts on your system, so in this project I''ll tell you how
    to do just.


    How you install fonts depends on who is going to use them. If you have only one
    user account on your machine, the easiest way is to install the fonts locally,
    as described in "Project 8C2: Installing Fonts Locally" on page 144. Locally installed
    fonts are ones that you or someone logged into your user account will be able
    to use. On the other hand, if you have more than one user account and want the
    fonts to be available to all the users on your machine, you''ll need to install
    them globally—in this case, "Project 8C-3: Installing TrueType Fonts Globally"
    on page 145.


    # 8C-1: Getting the Font Files


    The Internet is awash with free fonts. I will point you to the http://www.fontfreak.com/,
    which has a very nice collection of fonts. Once you get to the FontFreak home
    page, click the Fonts link under "FREE FONTS" on the left side of the page. The
    next page will ask you whether you want to download all the free fonts in the
    site in one file; click No thanks, I will download them by one. This will lead
    to the main list of free fonts; browse through the various pages until you find
    that is to your liking, and then click it. Which font you download is completely
    up to you, be sure to choose the PC version, not the Mac version. You can do this
    by clicking the Windows icon at the bottom of the page (next to where it says
    Download). When the download window pops up, choose Save File and click OK to
    save the font as a .zip file. To follow along with this project, download a couple
    of fonts—I chose Ajax Surreal Freak and Accidental Presidency.


    When finished downloading, drag the files from the Downloads folder (or wherever
    you saved them) to your home folder so it''s easy to follow along with my instructions.
    Also, be sure to unzip your zip files before going on to the installation steps.
    (Right-click each .zip file, and choose Extract Here.)'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# 8C-2: Installing Fonts Locally


    If you''re the sole user of your computer, installing fonts locally will do just
    fine. To get started, you need to set up your system by providing it with a location
    to place your fonts. You will need to do this only the very first time. Here''s
    what you must do:


    +   1. Open your home folder, and in that window, create an invisible fonts folder
    by selecting File -> Create Folder.

    2. When the folder opens, name it .fonts (the period before the name means that
    it will be hidden).

    3. Hide the new folder by clicking the Reload button. Your .fonts folder should
    no longer be visible. If this is the case, you can close the window—your setup
    was successful.


    Now that everything is set up, let''s continue with this project using one of
    the fonts you downloaded. After you''ve decided which font to use, follow these
    steps:


    +   4. Choose the unzipped font file (its name probably ends in .ttf), and copy
    by right-clicking and selecting Copy.

    5. Press CTRL-L, or select Go -> Location. This will display the location bar
    in Nautilus.

    6. In the location bar, type "/.fonts, and press ENTER. The ~ sign is a short-cut
    that means "my home folder."

    7. You should be taken to the empty .fonts folder you just created, the one in
    Figure 8-19. Right-click anywhere in the folder, and select Paste to copy the
    font into the folder.


    Now that you have installed your font, you can give it a try in one of your applications,
    such as OpenOffice Writer. (Running applications need to be restarted before the
    new font will appear in that application''s font menu.)


    ![](img/add8efd602aad9815ee8abf27a7a293e_175_0.png)'
