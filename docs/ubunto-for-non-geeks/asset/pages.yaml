  md: '# Flash


    The most frequently used browser plug-in for any system is Adobe''s Flash Player.
    Flash provides websites with all sorts of exciting multimedia effects and capabilities,
    and as a result, it is used by an ever-increasing number of sites. In fact, chances
    you are aware of numerous Flash-enhanced pages without even being of it. For example,
    if you''ve watched a video on YouTube, you''ve enjoyed the wonders of Flash.


    How do you get the Flash Player plug-in? Well, it takes a few clicks and a working
    Internet connection:


    +   1. Select Applications ▸ Ubuntu Software Center to open the Software Center.

    2. Type adobe flash in the search box at the top right of the window.

    3. In the list that appears, click the Adobe Flash plug-in item once. An Install
    button will appear (Figure 5-4).


    ![](img/add8efd602aad9815ee8abf27a7a293e_94_0.png)


    Figure 5-4: Installing the plug-in with the Ubuntu Software Center


    +   4. Click Install; then, if prompted, type your password, and click Authenticate.
    The plug-in will be downloaded and installed.


    +   5. When the plug-in has finished installing, a green check will appear next
    to the Adobe Flash plug-in''s icon in the list. Close the Ubuntu Software Center,
    and open Firefox (if it was already open, close it, and then start it again).


    +   6. To check that the plug-in is working, find a site that you don''t know
    of one offhand, try YouTube (http://www.youtube.com/). Once you have arrived at
    YouTube, click any video link you see. If Flash was installed successfully, a
    video should appear and start playing (Figure 5-5).'
