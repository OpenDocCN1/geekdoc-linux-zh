  md: 'program to use gzip to compress the folder. For example, to create a compressed
    version of your Documentia folder, which we will call tightdocs.tar.gz, you would
    type the following and press ENTER:


    ```

    tar -czvf tightdocs.tar.gz Documentia

    ```


    It''s worth mentioning at this point that you may also come across some files
    compressed by the bzip program. Such files are recognizable by some variation
    on the .bz or .bz2 extension. Dealing with these files should pose no problem,
    because the commands are almost identical to gzip. Just substitute -j for -r in
    the command string.


    # Compressing and Extracting Single Files


    If you want to compress or decompress a single file, you don''t need to use the
    tar program at all, since its purpose is to create archives consisting of several
    files. You can instead use the gzip and gunzip commands directly. For example,
    to compress a file called matilda.png use gzip matilda.png and press ENTER. The
    matilda.png file will then become matilda.png.gz. To decompress the file, you
    use gunzip matilda.png and press ENTER, after which the matilda.png file will
    be back to normal.


    So, can you compress an archive you''ve created with the tar command? Sure. For
    example, to compress the spicyfood.tar mentioned earlier, you use gzip spicyfood,
    tar, and voila-you''ve got yourself a compressed spicyfood.tar.gz archive. Pretty
    cool, don''t you think?


    # Project 9A: Creating a Plan


    Now that you have a bit of command experience, it''s time to get some practice
    and put all those commands to good use. In this project, you''ll start off creating
    a .plan file, like the one mentioned earlier in the chapter. The actual plan is
    a file (as you can see by the dot before its name), which contains the plan or
    message that you want to add to that file. That message will appear in the output
    of some Terminal when they use the finger command to find out more about you.
    You may not need a .plan file, but it is an easy way to get started a bit more
    with commands and the Terminal itself, let''s give it a try.


    To start out, you''ll open the Terminal-based editor to create the .plan file.
    To do this, open a Terminal window, type pico (being sure to put a space between
    pico and .plan) and press ENTER. Your Terminal will now look a bit different,
    as you can see in Figure 9-12.


    You will be looking at your new, and totally empty, .plan file within the Pico
    editor. All you have to do is type your plan or message. Once you''ve done that,
    press CTRL-X to exit the editor, and it will ask you whether you want to save
    your work. You do, so type Y, after which you will be presented with a set of
    options. You have already named the .plan, as you can see near the bottom of the
    screen, so all you have to do is press ENTER. You will be back at your now-familiar
    user prompt in the Terminal window.'
