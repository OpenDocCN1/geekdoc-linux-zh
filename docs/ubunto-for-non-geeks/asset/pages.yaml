    Scanner. XSane will perform a search for an attached scanner. If it finds one,
    it will start up. If it doesn’t, a window will appear that says “No devices available.”
    If this happens, click the Close button, and skip to “Unrecognized Scanners” on
    page 207.


    ![](img/add8efd602aad9815ee8abf27a7a293e_236_1.png)


    Figure 10-12: Scanning with XSane


