    # Inkscape


    The GIMP, like other so-called paint programs, creates bitmap images in various
    file formats. These are images in which the location and color of every single
    pixel is recorded. The image is essentially a collection of dots, or pixels. The
    file you create is rather hefty map of these pixels, and this map tells your system
    where everything in your image is supposed to go when it is displayed or printed.


    Drawing programs, on the other hand, create vector images, which are actually
    collections of mathematical formula representing the various shapes in your image.
    This might sound rather unimportant to you, but such drawings have advantages
    in certain cases. One of advantages is that vector image files take up less space
    on your hard disk than bitmaps. Another, perhaps the most important, advantage
    is that shapes in vector images retain their smooth edges when the images are
    enlarged. A smooth circle created as a bitmap, for example, would begin to show
    jagged edges (the "jaggies") when enlarged to any extent, while the same circle
    in a vector image would remain smooth and round no matter how much you increased
    its size.


    If you''re interested in giving a drawing program go, then try Inkscape (see Figure
    13-11). To download and install it, do a search in the Ubuntu Software Center
    for Inkscape. Once it is installed, you can run it by selecting Applications ▶
    Graphics ▶ Inkscape.


    ![](img/add8efd602aad9815ee8abf27a7a293e_286_0.png)


    Figure 13-11: Inkscape'
