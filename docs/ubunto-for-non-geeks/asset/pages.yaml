  md: '# Firefox: Your Internet Browser


    The default web browser in your Ubuntu system is Firefox, which is enjoying increasing
    popularity in not only the Linux world but in the Windows and Mac worlds as. Chances
    you are already a Firefox user, but if you are not, then you needn''t worry—things
    work more or the same in all browsers. That being case, you should be able to
    use Firefox''s basic features without any instruction. For of course, some of
    its features distinguish Firefox from its competition, so I will mention those.


    # Controlling Browser Window Clutter with Tabs


    Usually when you click a link on a web page, the new page opens in the same window.
    On some pages, links are coded so that the new page opens in a new window, or
    maybe you occasionally opt for opening a link in new window by right-clicking
    the link and selecting the Open Link in New Window option. This can be very useful;
    however, once you have a few browser windows open, it gets sort hard to find what
    you''re looking for in all open windows. It can also slow down a bit.


    This is where Firefox''s tab feature comes in (so handy, in fact, almost every
    other browser has copied it). To see how it works, try it right here and now.
    Open Firefox browser by clicking the launcher on the top GNOME panel (selecting
    Applications) ▶ Firefox Web Browser); then search for the word nyckelharpa using
    Firefox''s search box, which is the top-right corner of the browser window (see
    Figure 5-1). By default, Firefox will perform searches for keywords entered in
    the search box using Google. You, if you like, select other websites by clicking
    the colored icon in the search box and then making your selection. Amazon.com,
    eBay, and Yahoo! are available, to name a few, and you can even add others. For
    now, however, let''s stick to Google for our search, by typing nyckelharpa in
    search box. Once you''ve finished typing, press the ENTER key, after which a page
    of search results appear in the main pane of the Firefox window.


    One of the top results should be the American Nyckelharpa Association, and you
    are now going to opening that page in a new tab, rather than that in the same
    or a new window. To do that, right-click the link, and in the pop-up menu select
    Open Link in New Tab. You, if you prefer, make things a tad easier and dispose
    with the pop-up menu selection by simply clicking the link with the middle mouse
    button (or with both buttons simultaneously) or by holding down the CTRL key you
    click the link.


    Either way, the new page will appear in a new tab, while your original page of
    search results remains, ready and waiting in the other tab (see Figure 5-2). I
    am pretty confident in saying that once you get used to this feature, you will
    wonder how you ever got along without it.'
