  md: '# When Research Is Required


    If you don’t work out for you with the live CD, you can start taking a look at
    Chapter 21. If you don’t find the answer to your problem there, search the Web
    to see whether you can identify part of your hardware is puzzling (Or if you are
    looking for a machine on to install Ubuntu Linux.). Of course, before you do this,
    you need to know what models of hardware you have. You should know at least motherboard,
    central processing unit (CPU), monitor, and video card if you want to be able
    to find out of anything. Identifying your CPU and monitor should be easy enough,
    but the motherboard and video card might require a bit more searching.


    If you have no documentation that clearly states the make and model of these devices,
    you can find out most things you need to know from within Windows by going to
    the Windows Control Panel, double-clicking System, and then clicking the Hardware
    tab in window. Click the Device Manager button, and see what you can find out
    your system components. Sometimes the information there is limited, so you might
    want to try a share application like HWiFO (http://www.hwinfo.com/) or Sandra
    (http://www.softinfo.net/) to get more useful details, such as the specifications
    of your motherboard or the supported video modes for your current setup.


    Both HWiFO and Sandra should give you the information you need about your motherboard,
    if they don’t (or if you don’t feel like bothering with them), you can always
    recommend the case of your computer and look at your board, though I wouldn’t
    recommend doing so if you have a laptop. Once inside, you needn’t worry about
    damaging anything because you don’t need to touch anything—so don’t. You may need
    a flashlight to find it, but the model name and number should be stamped on somewhere,
    either in the middle of the board or around the edges. Mine, for example, says
    quite clearly in the middle of the board “AOpen MX46-533V”. You should be looking
    for similar information.


    Once you have all your information, you can do to check your hardware’s compatibility
    with Ubuntu. You can simply do a via Yahoo! or Google search by entering your
    motherboard’s make and model the word Linux. This works for other hardware devices
    too.


    You can also post a question to the Ubuntu User Forums (http://www.ubuntuforums.org/)
    or one of the other Linux forums or mailing lists on the Web. Chapter 20 might
    provide you with additional sources of information, and Appendix D lists still
    offer other sources. When posting a forum question, just write that you are a
    newbie and want to know whether anyone has had any experience using Ubuntu with
    the board (or other hardware) in question. You will probably get a few responses.
    Linux users are usually rather evangelical in trying of to draw in New Penguinists.'
