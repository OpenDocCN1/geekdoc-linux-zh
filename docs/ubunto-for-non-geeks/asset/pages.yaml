- img_proc: true
  md: 'Although this can be done with other graphics applications, the GIMP supports
    an extremely wide variety of file formats, and even lets you save an image file
    as a compressed tarball, which makes it a true file conversion king.


    To perform a file conversion, just right-click an image opened within the GIMP,
    and select File > Save As in the pop-up menu. You can make the same selection
    from the File menu if you prefer. Either way, the Save Image window will appear.
    In that window, you can specify the new format by replacing the original file
    extension in the Name box at the top of the window with the extension for the
    format you want to convert the image.


    If you''re not sure what formats are available to you, click the small arrow to
    the left of the words Select File Type (By Extension), and then choose from the
    options in the pane that appears. To work in progress, use the GIMP-native XCF
    format so that you can continue working on the image later.


    # Learning More


    It is lots of fun to learn the GIMP by just playing around with it for a while.
    To get started, most of the fun stuff is located in the Filters menu of any image
    window. Of course, you should make a backup copy of any file you are planning
    to experiment with before altering it.


    If you prefer working through manuals and tutorials over goofing around, you can
    download and install the GIMP User Manual via the Ubuntu Software Center by searching
    for gimp-help and then installing Documentation for the GIMP (English). Once it
    installed, you can access the manual within the GIMP from the Help menu. You can
    also view the manual online at http://docs.gimp.org/en/, and you can find a series
    of tutorials at http://www.gimp.org/tutorials/.


    # Phatch Photo Batch Processor


    While the GIMP and F-Spot are quite capable in handling the vast majority of your
    photo-organizing and editing chores, they lack an easy-to-use batch file conversion
    method that allows you to apply various conversions to a group of files at the
    same time. For example, let''s say you want to convert 100 of your photos so they
    look black-and-white snapshots with borders, are 50 percent smaller than the originals,
    have a similar thematic filename, and are saved in .jpg format. Applying all these
    changes by one would be excruciating—fortunately, Phatch comes to the rescue!
    (See Figure 13-9).


    You can download and install Phatch via the Ubuntu Software Center by doing a
    search for phatch. Once installed, you can run it by selecting Applications >
    Graphics > Phatch Photo bATCH Processor.'
