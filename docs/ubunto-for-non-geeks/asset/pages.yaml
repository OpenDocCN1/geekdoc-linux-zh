    on your Ubuntu-ized computer? Finished filming a video of your sibling while asleep
    and want to do some creative editing of the video? Chapter 16 covers these and
    other video-related topics.


    # Chapter 17: Feathered Penguins—Linux Gaming


    If music and art don’t keep your mind off things enough, Chapter 17 presents you
    with more diversions: games. In addition to learning what games come with, you
    will also learn how to add more and how to run Java-based games.


    # Chapter 18: Penguins at the Gates—Working with Ubuntu in a Windows World


    Like it or not, Microsoft Windows is probably here to stay (for the foreseeable
    future, at least). Chapter 18 shows you how to share files between Windows and
    Ubuntu over a network, install Windows fonts, and even'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'install Windows programs to run under Ubuntu. Dual-booters take note: You''ll
    learn how to access your Windows files from Ubuntu and change the boot menu.


    # Chapter 19: Defending the Nest—Security


    Although Linux is as safe and secure as an operating system as you are likely
    to use, Chapter 19 tells you how to add a few additional lines of defense to your
    system.


    # Chapter 20: A Colony of Penguins—The Ubuntu Community


    If there''s one thing that sets Ubuntu apart from most Linux distributions, it''s
    the friendly, ever-growing Ubuntu community that surrounds it. In Chapter 20 you''ll
    learn how to participate in the Ubuntu community by reporting bugs, sharing ideas,
    and talking to other users.


    # Chapter 21: Wicked Wings—Fixing Common Problems


    Don''t panic! If a computer problem crops up and is spoiling your fun, flip to
    Chapter 21 and take heed of the many (and varied) troubleshooting tips. You''ll
    find fixes for the common issues, and some general advice on diagnosing and treating
    your poor PC.


    # Appendix A: Installing Ubuntu from a USB Flash Drive


    With the proliferation of netbooks in recent years, installing Ubuntu from CD
    is becoming a little passé. Appendix A shows how to install Ubuntu from a USB
    memory stick, which will be particularly useful if your computer lacks a CD drive
    or if you find the disc included with this book far too attractive to be used
    as a coaster.


    # Appendix B: Ubuntu Desktop CDs for AMD64, Opteron, or Intel Core 2 Users


    The CD bundled with this book is designed to work with i386 processors. It will
    also work with most 64-bit processors, although not in 64-bit mode. If you''ve
    got it what it takes to run Ubuntu in 64-bit mode, Appendix B will show you how
    to get what you need to do.


    # Appendix C: Manually Partitioning Your Hard Disk


    If the partitioning advice in Chapter 2 wasn''t enough for you, Appendix C shows
    you how to carve your hard disk as you desire, free from the constraints of the
    Ubuntu installer''s sensible, but ultimately, suggestions. If you''re a dual-booter
    and want an easy way to share files between Windows and Ubuntu, this appendix
    is for you.


    # Appendix D: Resources


    Are you crazy for Ubuntu and want to say so? Check out a forum. Do you have a
    hardware compatibility question? See websites to see all the answers. Are you
    looking for free downloads, or do you want to read up on the other Linux distributions?
    Appendix D is a great place to start.'
