- img_proc: true
  md: 'To remedy this situation, you could add the path of your pyWings script to
    the list of paths that the system checks for run commands, so as to make the system
    aware of your new application''s existence. However, let''s try another method
    that I think is easier. What will you do is create a link to pyWings, a sort of
    launchable alias, in one of the locations your system does check for commands.


    To create this link, you will be using three commands: cd (to change directories),
    sudo (to give yourself write access to the destination folder), and ln -s (to
    create the link).


    +   1. In the Terminal, type cd /usr/games, and press ENTER. This puts you in
    one of the folders system searches when you enter commands.


    +   2. Type ln -s /home/username/LocalApps/pywings/pywings.py, and press ENTER.
    (Note that there is a space between the words pywings.py and pywings at the end
    of that command string).


    The pywings at the end of that command string is the name that you are giving
    the link; the name of the link becomes the command you will use to run the application.
    If you type nothing, the link will be called pywings.py, which would mean three
    more keystrokes for every time you wanted to start the program.


    +   3. Type your password when prompted to do so, and press ENTER.

    4. Type cd, and press ENTER to return the Terminal to your home folder.


    # 9B-8: Running pyWings Again


    Now that you have created the link, you should be able to run the pyWings program
    much more easily. To try it, quit pyWings (if it is still running), type pyWings
    in the Terminal window, and press ENTER. Your personal pyWings oracle should appear
    again.


    You''ve managed to cut down the number of keystrokes required to run pyWings from
    the Terminal. However, if you are really into this pyWings-th thing and want to
    use it often, it will probably be handiest to add a launcher to your panel, a
    drawer, or the Applications menu.


    To add a pyWings panel launcher, for example, right-click any open space in the
    panel, and select Add to Panel. When the Add panel window appears, click the Custom
    Launcher item, and click Add. In the Create Launcher window that appears, typing
    pyWings in the Name section, anything you want in the Comment section (Your Obtuse
    Guru, for example), and, assuming you created a launchable link in Project 9B-7,
    type pyWings in the Command section. For an icon, click the No Icon button, and
    then look around until you find an icon that suits your fancy. I like gnome-eog.png
    myself. Once you''ve made your selection, click Add in the Browse window, and
    then click OK in the Create Launcher window.'
