  md: 'Now that you have two files to work with, you can create the compressed archive
    by following these steps:


    +   1. Select the two files by clicking your mouse to the side of the files and
    then dragging the cursor (with the mouse still pressed) over both files until
    they are highlighted or by holding down the CTRL key and clicking each file individually.


    +   2. Once both files are highlighted, right-click either one, and select Compress
    from the pop-up menu.


    +   3. In the Compress window when they appear, type blossoms in the Filename
    text box, and then select .zip from the drop-down menu to the right of that. Once
    everything looks like what I set up in Figure 7-23, click the Create button, after
    which a compressed archive of your two files (blossoms.zip) will appear in your
    home folder.


    ![](img/add8efd602aad9815ee8abf27a7a293e_151_0.png)


    Figure 7-23: Creating a compressed archive


    Now that you know how to put things together, let''s get back to work and learn
    the equally simple task of ripping it all apart—well, OK, extracting it:


    +   1. Drag the original dogwood and violet files to the Trash to get them out
    of the way.


    +   2. Double-click the blossoms.zip file you''ve created. A window showing the
    contents of the file will then appear (Figure 7-24).


    ![](img/add8efd602aad9815ee8abf27a7a293e_151_1.png)


    Figure 7-24: Extracting a compressed archive'
