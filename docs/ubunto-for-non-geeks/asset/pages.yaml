  md: '![](img/add8efd602aad9815ee8abf27a7a293e_277_0.png)


    Figure 13-3: Viewing your imported digital camera images in F-Spot


    # 13A-2: Transferring Images from Camera to Computer via Nautilus


    As I mentioned, you can also use Nautilus to import photos from your camera. The
    process for doing this starts pretty much the same as I discussed in Project 13A-1,
    albeit with a slight twist. Here''s how you do it:


    +   1. Plug your camera into one of your computer''s USB ports, and put your camera
    into play mode. Within seconds, a window like that in Figure 13-1 will appear.
    In that window, select Open Folder in the drop-down menu instead of the default
    F-Spot, and then click OK. A window will appear revealing the contents of your
    camera''s storage card. An icon for your camera will also appear in the side pane
    of that window and any other open Nautilus window (Figure 13-4) and on your desktop
    as a double-clickable launcher.

    2. Double-click your way through the folders on your camera until you find the
    photos you want to import.

    3. Drag and drop or copy and paste the images from your camera to any logical
    spot in your home folder.'
  merge: -1
  pgno: 277
- img_proc: true
  md: '4. When you''re done with your transfers, either click the eject icon next
    to the entry for your camera in the left pane of a Nautilus window or right-click
    the icon for your camera on the desktop, and select Unmount. The icon for your
    camera will then disappear from the side pane and desktop. Or, by easiest of all,
    just turn off your camera, and both the desktop and Nautilus instances of your
    camera should automatically disappear.


    ![](img/add8efd602aad9815ee8abf27a7a293e_278_0.png)


    Figure 13-4: You can also drag and drop photos from your digital camera as if
    it were a USB drive.


    # ## Project 13B: Working with Digital Images in F-Spot Photo Manager


    F-Spot not only imports images from camera to computer but also acts as a handy
    photo-organizing, browsing, viewing, and editing tool. And working in conjunction
    with Evolution, the default email software in Ubuntu, F-Spot allows you to easily
    send images via email (File > Send by Mail) without fiddling around attachments.
    You can run F-Spot by selecting Applications > Graphics > F-Spot Photo Manager.
    Note that the first time you use, you will be asked to select the folders that
    hold the images you want to import into F-Spot.


    # ### 13B-1: Exporting Images to Online Albums and Galleries


    A very cool feature of F-Spot is that it allows you to export images to numerous
    online gallery or album sites, such as Flickr and Picasa, much like Live Photo
    Gallery. Exporting an image to an online gallery or album is'
  merge: -1
  pgno: 278
- img_proc: true
  md: 'pretty simple, and I''ll use a Picasa web album for this example. Here''s what
    you need to do:


    +   Select the photos you want to place into your online album by holding down
    the CTRL key and clicking each photo once.


    +   In the main F-Spot window, select Photo > Export to > PicasaWeb, after which
    an Export window like the one in Figure 13-5 will appear.


    ![](img/add8efd602aad9815ee8abf27a7a293e_279_0.png)


    Figure 13-5: Exporting images to online galleries via F-Spot


    +   The first time out, you will need to click the Add button at the top of the
    window (to the right of the word Gallery) to set things up that F-Spot can access
    your online gallery.


    +   In the small window that appears, type the username and password for your
    online album/gallery service (not your username and password for Ubuntu). Click
    Add in that window when you''re done.


    +   You can also decide of which online albums you want to add the photos by clicking
    the drop-down menu in the Album section. Or, if you want to create a new album,
    click the Add button to the right of that menu, provide a title and description
    in the small window that appears, and then click Add.


    +   Once back in the Export window, click the Export button.


    F-Spot will then start uploading your images to your online gallery site, letting
    you know what it''s doing in a progress window. Once done, your web browser will
    open to your online gallery page, revealing your newly uploaded images. You can
    toggle this post-export automatic browser opening feature by checking or unchecking
    the Open album in browser when done uploading (Figure 13-5).'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# 13B-2: Organizing Your Photo Collections with Tags


    As your photo collection grows and grows, it can get rather tough to sort things
    out and find exactly what you need. Fortunately, F-Spot has a few ways of making
    this easier to deal with, one of which is the timeline slider, located immediately
    above the thumbnail-viewing pane, which allows you to locate images by year and
    month.


    An additional and interesting way of organizing things is by using tags, which
    allow you to identify images thematically. Applying tags and using such tags to
    narrow down your photo searches is pretty easy to do.


    First, to apply tags to your images, drag the appropriate tag icon from the left
    pane of the F-Spot window directly onto the image you want to tag. You can place
    more than one tag on a picture. Once you have added the tag, a small version of
    the tag icon will appear below the image, as you can see in Figure 13-6.


    ![](img/add8efd602aad9815ee8abf27a7a293e_280_0.png)


    Figure 13-6: Using F-Spot''s tags feature to help deal with hefty photo collections


    The number of preset tags is rather limited, but you can add your own by selecting
    Tags > Create New Tag.


    Give your tag a name in the Create Tag window that appears, and click Create.
    The new tag will then appear in the left pane of the F-Spot window, albeit without
    an icon. There are two ways to add an icon. One is to'
  merge: -1
  pgno: 280
- img_proc: true
  md: 'simply drag the iconless tag to a photo you want to tag with it, after which
    a mini-thumbnail of that image will become the icon for the tag.


    The other approach is to right-click the new tag and select Edit Tag in the pop-up
    menu. In the window that appears, click the icon button next to the word Icon,
    and then select one of the predefined icons in the window that appears. You can
    also use this approach to edit the photo of an automatically created tag, which
    allows you to determine exactly what portion of a picture you want to use as the
    icon for that tag (Figure 13-7).


    ![](img/add8efd602aad9815ee8abf27a7a293e_281_0.png)


    Figure 13-7: Modifying the portion of photo used as an icon tag in F-Spot


    Searching for images by tag is perhaps even easier than adding the tags to the
    images in the first place. Let''s say you wanted to find all of your images that
    were tagged as Events. You would first go to the Find menu and select Find Selected
    Tag. A find bar will appear directly above the thumbnail-viewing area of the F-Spot
    window. Drag the icon for the Events tag to that find bar, and almost immediately
    images tagged as Events will appear in the thumbnail area below. Sweet.


    # Getting Arty with the GIMP


    The Windows and Mac worlds may have Photoshop, but the Linux world has the GIMP
    (see Figure 13-8). Although arguably not as powerful as Photoshop, the GIMP is
    a capable contender, which may explain why it has been ported to both Mac and
    Windows. The GIMP allows you to create bitmap graphics and, quite importantly,
    retouch or completely doctor image files.'
  merge: -1
  pgno: 281
- img_proc: true
  md: 'With the GIMP you can get rid of red-eye in your digital photos, airbrush out
    unwanted shadows (or even facial blemishes), give your image a canvas texture,
    change a photo into an oil painting, and add a bell pepper here and there—with
    drops no less.


    ![](img/add8efd602aad9815ee8abf27a7a293e_282_0.png)


    Figure 13-8: Manipulating a digital image in the GIMP


    Because not everyone needs or uses the power of the GIMP, the powers that are
    unfortunately decided to no longer bundle on the Ubuntu Desktop CD, freeing up
    space for more frequently run applications. Pity that might be, you can still
    install the GIMP via the Ubuntu Software Center. Just to search for GIMP, and
    then install it as you would, any application, as you learned to do in Chapter
    6. Once installed, you can run the GIMP by selecting Applications > Graphics >
    GIMP Image Editor.


    # Using the GIMP to Resize Images and Convert File Formats


    Like F-Stop, the GIMP is also a very handy tool for resizing images. You can do
    this by simply right-clicking an image opened in the GIMP and then selecting Image
    > Scale Image in the pop-up menu. This will open the Scale Image window, where
    you can set the new size of the image.


    The GIMP is also an excellent tool for converting images from one format to another.
    You can, for example, open a bitmap (.bmp) file and save it as a PNG (.png) file,
    as a JPEG (.jpg) file as a GIF (.gif), and so on. got'
