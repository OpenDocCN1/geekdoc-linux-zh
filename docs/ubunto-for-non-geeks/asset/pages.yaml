  md: '# A


    # INSTALLING UBUNTU FROM

    A USB FLASH DRIVE


    ![](img/add8efd602aad9815ee8abf27a7a293e_436_0.png)


    If you have a netbook or some other computer that doesn''t come with a CD drive,
    don''t worry: You can install Ubuntu using a USB flash drive. Booting from a USB
    drive can be a little more involved than simply booting from a CD or using Wubi,
    but once the installer is up and running, the installation process is identical.
    I''m going to assume that you''re using Windows for the rest of this appendix,
    but it''s possible to create a USB install disk with other operating systems too;
    see https://help.ubuntu.com/community/Installation/FromUSBStick/ for instructions.


    NOTE Some computers don''t have the ability to boot from USB disks. If this is
    the case, you won''t be able to use this method to install Ubuntu. Other alternative
    installation methods are available, such as downloading Wubi directly; see https://help.ubuntu.com/community/Installation/
    for a list of options.'
  merge: -1
  pgno: 436
- img_proc: true
  md: '# Preparing the Installer Files


    First, you''re going to need a flash drive with sufficient capacity to hold the
    Ubuntu installer: About 2GB should do it. Make sure that you don''t have any files
    on the flash drive, either—you''ll be formatting the drive shortly, so any files
    on there will be permanently deleted.


    Next, you''ll need to download an Ubuntu CD image. If you''re feeling clever,
    use your CD-burning software to make an .iso image from the CD provided with the
    book, but otherwise head over to http://www.ubuntu.com/getubuntu/download/, select
    your location from the drop-down list, and click Begin Download to download an
    Ubuntu CD image. The image is large at 700MB, so it might take a while to squeeze
    out your Internet connection.


    Sometimes, large downloads don''t finish properly, and you could be left with
    an incomplete CD image. An easy (not foolproof) way to check whether the image
    downloaded correctly is open the folder where you saved it, right-click the image,
    and select Properties. Check that the size of the image file is almost 700MB (690MB,
    so).


    The final thing you need is the software to put the installer onto the USB drive.
    Use your web browser to download the Universal USB Installer from http://www.pendrivellinux.com/downloads/Universal-USB-Installer/Universal-USB-Installer.exe.


    # Creating a Bootable Installer Disk


    With the installation files downloaded, you''ll now be able to make a bootable
    Ubuntu flash disk. Plug your USB drive into the computer, and follow these instructions:


    +   1. Double-click the Universal-USB-Installer.exe file and then click run it.

    2. A License Agreement screen will appear. Click I Agree, and you''ll be taken
    to the Setup Your pages.

    3. Where it says Step 1, choose Try Some Other Live Linux ISO from the list.

    4. Click the Browse button under Step 2, and find the Ubuntu CD .iso image that
    you downloaded earlier. Click once to select it, and then click Open.

    5. Under Step 3, select your flash drive from the list (make sure it''s the right
    one; otherwise, you could wipe a bunch of important files from some other disk!),
    and check the box next to it to say you want to format the drive. Your screen
    should now look like the one in Figure A-1.

    6. Click Create, and wait for a few minutes while the installer is put on the
    disk.


    Once the process has finished, close the Universal USB Installer window and safely
    eject your flash drive, as you normally would.'
  merge: -1
  pgno: 437
- img_proc: true
  md: '# Booting from the USB Disk


    Now, plug the flash drive back in, and restart the computer. This is where you
    find out whether you''re set up to boot from USB drives—if you get a Ubuntu boot
    screen, you''re all ready to go! The rest of the process will be the same as the
    installation from a CD, which you can read about Chapter 2.


    If the computer just boots back into Windows (or whatever operating system you''re
    using), you''ll need to change some settings to get it to boot from the flash
    drive. Restart the computer, and look on BIOS settings for your computer. You''ll
    normally have to press a key (such as DELETE, F2, or ESC) to access these settings,
    but this very much depends on the make and model of your computer. More information
    on accessing your BIOS is in Chapter 2.


    Once you''ve found the settings screen, find the option where you can choose to
    boot from a USB drive (that is, make the USB drive the first boot device), save
    your changes, and restart. Ideally, you''ll be taken to a purple Ubuntu screen.
    In case, head over to Chapter 2, and continue the installation as normal.


    If you run into any problems, take a look at https://help.ubuntu.com/community/Installation/FromUSBStickQuick/
    for hints and tips, or head over to the forums (http://www.ubuntuforums.org/)
    for advice.


    ![](img/add8efd602aad9815ee8abf27a7a293e_438_0.png)


    Installing Ubuntu from a USB Flash Drive 407'
  merge: -1
