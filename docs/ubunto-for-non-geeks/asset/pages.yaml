  md: '# 12


    # # PENGUINS AT WORK


    *Getting Down to Business in Linux*


    ![](img/add8efd602aad9815ee8abf27a7a293e_258_0.png)


    I have to admit it, when I think about the joys of computing, I tend to think
    of the more hedonistic, self-indulgent areas like gaming, music, and graphics.
    Still, as is the case for most computer users, what I usually end up doing on
    my computer is work, and writing this book falls into that category.


    Fortunately, Linux can get down to business and do it as well as the next OS.
    I think it''s safe to say you that you are missing nothing and are gaining quite
    a bit in terms of home and office productivity programs in the world of Linux.
    In this chapter, I''ll walk you through the Linux offerings in this department.


    # ## OpenOffice.org


    Whether they should or not, people are quite obsessed with office suites, even
    though most people seldom need more than a word processor. The de facto standard
    among office suites is Microsoft Office, which is available in'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'both the Windows and Macintosh worlds. Of course, because it is a Microsoft
    product, you are quite sure that no Linux version is available.


    Fortunately, Linux does have an exceedingly capable office suite in the form of
    OpenOffice.org, which is, incidentally, also available (as free) in Windows and
    Mac OS versions. OpenOffice.org is not light-weight sour-grapes substitute for
    the Microsoft Office—less Linux; it is a full-featured contender, and in some
    cases, OpenOffice.org is a clear winner.


    # OpenOffice.org Applications


    The entire OpenOffice.org office suite consists of a number of application modules,
    and the most commonly used ones bundled with Ubuntu. These include a word processor
    (Writer), a spreadsheet (Calc), and a presentation creator and player (Impress),
    all of which you can find by selecting Applications > Office. In addition, there
    is very handy drawing program (Draw), which you''ll find by selecting Applications
    > Graphics. The database (Base) and the mathematical formula editor (Math), though
    no longer packaged with Ubuntu, are still available as downloads via Ubuntu Software
    Center (searching for and marking openoffice.org-base and openoffice.org-math,
    respectively).


    Since giving full and detailed instructions on how to use each of these applications
    would take up an entire book (and there are entire books on the subject), I will
    simply introduce each module to you.


    # Writer


    As I mentioned earlier, the word processor is the office application that the
    majority of users turn to most often. Fortunately, OpenOffice.org Writer is a
    good one (see Figure 12-1). It is chock-full of features and can read and save
    Microsoft Word files. Like Word, it will even let you save your documents as HTML
    files that you can easily change your documents into web pages.


    As I said, Writer is a very straightforward word processor, so if I won''t go
    on about it, but if you would like an introduction to using Writer (or the other
    OpenOffice.org modules), check out the various tutorials and other resources available
    at http://support.openoffice.org.


    # Calc


    The OpenOffice.org spreadsheet application, and it is similar to Excel in terms
    of capabilities and general layout (see Figure 12-2). It can also, quite importantly,
    read and save Excel files.


    Since most people who use spreadsheets generally understand what they are all
    about, after a bit of poking around, can figure out how to use them, I won''t
    go into any sort of primer about using Calc. However, because there are many others
    who don''t see any need to try using spreadsheets, I will mention a few of the
    simpler tasks that can be done with Calc, in the hope of enticing some of you
    into trying it.'
  merge: -1
  pgno: 259
