    will no doubt be pleased to discover that it is available for Linux. Picasa is
    not an open source application, which may cause some Linux dieards to turn away,
    but it is free, feature rich, nice to look at, and decidedly cool (Figure 13-12).
    It also gives you access to various online blogs, photo finishers, and product
    providers, such as PhotoStamps, Shutterfly, Kodak, and even Walgreens.


