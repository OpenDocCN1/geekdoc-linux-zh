  md: 'when it opens, go back to the Finder window, locate the Ubuntu Live CD ISO
    you just downloaded, and then drag it to the left pane of the Disk Utility window,
    just below the listings for your current drives. The ISO file appears in that
    list, click it once to highlight it.


    To complete the process, click the Burn icon in the Disk Utility window''s toolbar,
    then insert a blank CD in your drive when prompted to do. Once the blank CD is
    inserted and recognized, you will be able to adjust the burn speed from the drop-down
    menu to the word Speed. Select a low speed as your hardware will allow, depending
    on the age of your Mac, will probably be 4X to 8X. Finally, click the Burn button
    in that same window, and the burning process will begin.


    # Ordering an Install Disc from Ubuntu


    The easiest and most foolproof way to get an Ubuntu Desktop CD is to simply order
    one (or more) for free from Ubuntu; you don''t have to pay shipping or handling.
    Of course, the only downside to this approach is time. It can take up to ten weeks
    for you to get the CDs in this manner, so if you''re impatient you might want
    to opt for one of the other methods. To order your CDs from Ubuntu, go to https://shipit.ubuntu.com/,
    and follow the directions here. It''s easy.


    If you need faster service or larger numbers of Ubuntu CDs and don''t mind paying
    a small amount for the service, then you can order your discs through the Canonical
    store instead (https://shop.canonical.com/).


    # Ordering an Install Disc from Other Online Sources


    If you are in a hurry to get your install CD, you can also order a copy from an
    online source, such as CheapBytes (http://www.cheapbytes.com/) and OSDisc com
    (http://www.osdisc.com/).'
