- img_proc: true
  md: '# 3A-8: Moving Around on the Panel


    Well, now you''ve added all you are going to be adding to the panel in this chapter.
    It may seem a little messy up there right now, so let''s do a bit of housekeeping
    by moving things around. You will try to group things together somewhat mathematically
    so that they can be easier to deal with.


    Fortunately, you can move panel launchers quickly by right-clicking the launcher
    in question, selecting Move from the pop-up menu, and dragging the launcher to
    the spot you want to place. Once the launcher is where you want it to, click the
    launcher once, and it will stay there.


    To get some practice with this movement, let''s move the launchers, menus, and
    drawers you added by placing them in the following order, from left to right:
    Applications, Places, System, Firefox, Help, OpenOffice.Writer, OpenOffice.Calc,
    Sound & Video, Games, Drawer. Place the remaining launchers towards the right
    end of the panel, to the left of the Network Manager or any others that appear
    automatically, in the following left-to-right order: Eyes, Wanda (Fish), Force
    Quit. Finally, place the Run Application by itself, midway between the two clusters
    of launchers. When you''ve made all your changes, your panel should look much
    like in Figure 3-13.


    ![](img/add8efd602aad9815ee8abf27a7a293e_68_0.png)


    Figure 3-13: The GNOME panel with the new launchers


    # More Panel Fun


    In addition to the basic customization you did in Project 3A, you can do a lot
    more to change the look and feel of your panel. Of course, you can remove any
    of your launchers, drawers, or menus by right-clicking the item in question and
    then selecting Remove From Panel in the pop-up menu, but there are still more
    options. Most of these are available by right-clicking any space in the panel
    and then selecting Properties, which will open the Panel Properties window.


    From this window you can change the position of the panel, alter its size, change
    its color, or make it transparent—very cool. You can also set the panel so that
    it will automatically disappear when you are not using it and have it reappear
    when you bring your mouse cursor into the area where the panel normally resides.
    Don''t be afraid to play around—that''s half the fun!'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# Project 3B: Manipulating Menus


    Now that you have learned some of the with your panel, let''s now move on to the
    topic of menus. A very nice feature of GNOME is that it allows you to edit your
    menus. You can add launchers, remove items, move items, and even change the icons
    that appear within the menus. All in all, you have a lot of control over things,
    but for this project, you''ll limit the work to two of these areas: changing icons
    and moving menu items.


    # 3B-1: Changing Icons Within Menus


    As you do recall, one of the problems with the OpenOffice.org Writer and Calc
    launchers you added to the panel was that they shared similar icons. If you select
    Applications Office, you will see that the icons for the various OpenOffice.org
    modules, are not the same, are also a bit similar. To remedy this state of affairs,
    you will change these icons to the same set used for the two panel launchers in
    Project 3A-4. In this case, just follow these steps:


    +   1. Right-click the Applications menu and select Edit Menus, or go to the System
    menu and select Preferences > Menu.

    2. In the menu editor that then appears (Figure 3-14), click Office in the left
    pane. The contents of menu will then appear in the right pane.

    3. In the right pane of the window, click OpenOffice.org Word Processor once,
    and then click the Properties button. A Launcher Properties window will appear.

    4. In the Name box of the window, first shorten the name of launcher down to Writer
    or Word Processor or whatever naming works for you.

    5. Next, click the Icon button (it doesn''t say rather has the Writer icon on
    it). Using the method described in "Project 3A-4: Changing Launcher Icons" on
    page 33, navigate to /usr/share/icons/hicolor/48x48/apps in the OpenOffice icon
    window that then appears.

    6. Scroll down and click openofficeorg3-writer.png, and then click Open.

    7. The new icon should now appear in the Launcher Properties window. Click Close,
    and you will be able to see the change in the menu editor window.

