    # ## Project 5: Installing Firefox Extensions


    The plug-ins I covered earlier are near-essentials that pretty much everyone has
    installed, but hundreds of other, less vital extensions are available for Firefox
    too. These come in the form of add-ons and include all sort of things; many are
    quite functional, while others are just fun and goofy. They range from blog-writing
    tools and to-do lists to image viewers and travel guides. For this project, however,
    you will install a blog editor ScribeFire (Figure 5-8) that allows you to write
    entries, log in to your blog, and upload your addition. All of this is available
    at the click of a button or an icon in the bottom-right corner of the window.


    If you don''t have a blog but you''d like giving blogging a try, you can sign
    up for an account on a free hosting website, such as http://www.blogger.com/,
    http://wordpress.com/, http://www.tumblr.com/, or http://www.livejournal.com/.'
