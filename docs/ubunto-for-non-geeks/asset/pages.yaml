- img_proc: true
  md: 'of the file or folder (you), to a specified *group*, or to *others* (everybody
    else).

    Traditionally, these permissions are referred to as follows:


    +   * **Read** Permission to view the contents of a file or folder

    * **Write** Permission to alter the contents of a file or folder

    * **Execute** Permission to run a program or script


    Nautilus has tried to spell out a bit more, as you can see in Figure 7-9.

    In general, however, you needn''t worry all that about setting permissions for
    your own files, because you are really the only one who has access to your user
    account. One possible exception you might run into is when you transfer files
    from CD to your hard disk. In this case, the files will be protected, meaning
    you cannot alter the files until you change the permissions for them. You can
    change the permissions of such files in order to alter yourself by going to the
    **Owner** section of the *Properties* window and selecting **Read** and **Write**
    in the menu next to the *Word* access (for files) or **Create and delete** files
    in the menu next to the *File* access (for folders). Once you are done, click
    the **Close** button, which will be on your way.


    # Keeping Home Folder Private


    Another exception to my-don''t-need-to-worry-about-permissions claim, and a potentially
    important one that is, the state of permissions for your home folder, particularly
    when other people have user accounts on your machine. In Ubuntu, when someone
    logs in to their account on your computer, they can click their to your user folder
    and view its contents—and thus protect the sanctity of your home folder, the privacy
    of its contents, and the peace of mind of its owner (you)—you can change the permissions
    of your home folder. Here''s what you need to do:


    +   1. Open a Nautilus window, and then click **File System** in the side pane.
    The contents of your entire hard disk will then appear in the right pane of the
    Nautilus window.

    2. Look for then double-click the folder named **home**. When the contents of
    the home folder you just clicked appear in the right pane, there should be only
    one folder there—your own folder, which will have the same name as your username.
    For example, mine, as I mentioned earlier, is named rg.

    3. Right-click your folder, and select **Properties** in the pop-up menu.

    4. In the username window (mine says *rg*), click the **Permissions** tab.

    5. In the **Permissions** tab, go to the **Group** and **Others** sections, and
    select **None** in the drop-down menus next to the words **Folder** access. Be
    sure to do this in both the Group and Others sections. When you''re done, your
    window should look like mine in Figure 7-10. If so, click **Close**.'
