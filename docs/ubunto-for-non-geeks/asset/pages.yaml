  md: '# WHAT IS A HARD DRIVE PARTITION


    I mentioned partitions several times so far, but it may not be obvious to what
    I meant, a Partition is an area of your hard disk that is "cordoned off" from
    other areas of the disk. It is a useful way of keeping things such as operating
    systems separate. Because they are isolated from each other, different partitions
    are treated as if they are different hard disks attached to your computer, even
    though they''re on the same physical hard disk.


    Most computers have just one partition that fills up the entire hard disk. This
    is like having a house with a completely open floor—the whole house is just one
    big room. If you want to completely remove Windows and install Ubuntu, Ubuntu
    can happily take over the entire partition (and the entire disk) and kick out
    its former resident, Windows.


    If you want to install two operating systems on the same computer, you have to
    give each one its partition (all they need). Back to the house analogy, if you''re
    erecting a partition wall to carve the house into two rooms. If you choose to
    dual-boot Windows and Ubuntu, the installer will automatically do this partitioning
    for you. Of course, you can choose how big each partition is: the bigger you make
    Ubuntu, the more disk space will be available to you (and less in Windows). After
    all, the house is the same; it''s the position of the dividing wall that you''re
    changing.


    You can find some information on manually partitioning your hard disk in Appendix
    C, if you fancy taking control of the process yourself. There should be no need
    to, however, the Ubuntu installer will be happy to handle the task for you.


    If you''d like to do something more elaborate with your disk space, such as having
    partitions for your data and system files (convenient if you ever need to reinstall
    or easily share files between Windows and Ubuntu), you''ll need to specify the
    partitions manually using the last option. This is more advanced—check out Appendix
    C for some guidance. Once your selection is made, click Forward.


    Depending on the partitioning scheme you choose, once you''ve clicked the Forward
    button, a small window will appear reminding you that any changes you''ve made
    so far will be written to disk (Figure 2-8).


    ![](img/add8efd602aad9815ee8abf27a7a293e_52_0.png)


    +   6. Click the Continue button, keeping in mind that, if you saw the warning
    message, this is the point of no return. After that, wait for the partitioner
    to do its stuff (depending on the size of your disk and what you have on it, this
    could take some time).'
  merge: -1
