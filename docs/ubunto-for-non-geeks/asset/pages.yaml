    # # Backing Up Your Files


    You have worked hard to accumulate all of your files. Hours of typing, hundreds
    of photos, plenty of music CDs—it''s all there on the hard disk. So, what happens
    to it if something goes wrong with your computer? In many cases the answer is,
    unfortunately, all of the data is lost forever. To save you the pain of this experience,
    it''s a great idea to make regular backups.


    Plenty of backup utilities are available, Déjà stands out as being the easiest
    to use. Open the Ubuntu Software Center, and install the Déjà Backup Utility.
    It''ll put itself in the System Tools section of the Applications menu, so head
    there and start it up.


    Connect, insert, or otherwise prepare your chosen backup device, and click the
    Backup button in Déjà Dup. A Preferences window will pop up like the one in Figure
    7-21. Choose the location where you''d like to save the backups from the drop-down
    box. If you have sensitive files that you don''t want anyone snooping around in,
    check Encrypt backup files.'
  merge: -1
  pgno: 147
- img_proc: true
  md: '![](img/add8efd602aad9815ee8abf27a7a293e_148_0.png)


    **Figure 7-21:** Choosing where to save the backup files in *Déjà Dup*


    **NOTE** If you want to put your backup files on a CD or DVD, you''ll have to
    save them to a folder somewhere first and then copy that folder onto a disc using
    the burning software mentioned earlier this chapter.


    Hit Forward, and you''ll be presented with the screen in Figure 7-22. Your first
    task is to decide what you want to back up, so check out the list labeled *Include
    files in folders*, which should have only your *Home* folder in it at the moment.
    This is a pretty sensible choice for most people, since absolutely all of your
    files should be in your Home folder. You can add and remove other items as you
    please using the buttons to the right of the list.


    ![](img/add8efd602aad9815ee8abf27a7a293e_148_1.png)


    **Figure 7-22:** Selecting which files you want to backup


    There''s another list on that screen, *Except files in folders*. You can use this
    to define any files or folders that you *don''t* want to back up. Say, for example,
    that you wanted to back up everything in your *Home* folder except for your pictures—maybe
    you don''t have space on your backup disk for all of them. All you''ll need to
    do is make sure that your *Home folder* is in the *Include files in folders* list
    and your *Pictures* is in the *Except files in folders* list.'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'When you''ve chosen what to keep and what to ignore, click Forward again to
    get to the summary page. Check that everything looks hunk-dery, and click Backup
    to start the backup. If you choose to encrypt your backup, you''ll be asked to
    type a password, so do this and click Continue.


    Make sure you keep that password safe; otherwise, you won''t be able to recover
    your backed-up files at a later date! A flurry of copying will ensue and last
    for some time if you have lost files to back up. Once that''s finished, click
    Close, and safely remove your backup disk (or whatever you have instead).


    That should be it... for now. But, there''s little point in backing up if you
    don''t do it regularly; you''ll only be able to recover older files (or not recent
    ones) if something does go wrong. I made a backup about once a month, but I should
    probably do it more regularly than that. It''s not much of a chore; when you use
    Dejà Dup, I''ll remember all of your settings from the previous backup. If you
    want to do something different, click Edit Preferences in the main window, and
    change the options there. You''ll find options for automatically backing up as
    well; check the Automatically backup on a regular schedule setting in the Preferences
    window, and then choose how often you''d like the backup to happen. Click Close,
    and Dejà Dup should take care of the rest.


    > NOTE Canonical, the company behind Ubuntu, now offers an online backup service
    called Ubuntu One. Take a look at https://one.ubuntu.com/ for more information
    on that.


    # Recovering from a Backup


    Ideally you''ll never have to recover your backup, but if you do, here''s a quick
    guide:


    +   1. Find your backup disk, hook it up to the computer, and start Dejà Dup.

    2. Select Edit Preferences, and make sure that the disk is selected as the Backup
    location. Click Close to get back to the main screen.

    3. Select Restore, and enter the password you chose for the backup if you encrypted
    it.

    4. You''ll be asked to choose which backup you want to restore. Choose the one
    that looks right (normally the most recent one), and click Forward.

    5. If you want the files to be put back exactly where they come from, click Restore
    to original locations. Otherwise, you can choose a folder to restore them to.
    Click Forward again.

    6. Glance over the summary to make sure everything looks OK, and click Apply to
    restore your files. There''s a chance you might have to reenter your encryption
    password, so go ahead and do so if asked.

    7. Click Close once the restoration has finished, and check that the files have
    been put back correctly.


    Everything should have returned to normal now. Pew!'
  merge: -1
