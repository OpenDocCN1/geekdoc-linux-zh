    Now add Evolution to the Internet menu by clicking Internet in the left pane of
    the menu editor window and then clicking the New Item button. in the Create Launcher
    window that appears, type Evolution Mail and Calendar in the Name box and evolution
    in the Command box. The Evolution icon should then automatically appear in the
