- img_proc: true
  md: '# Backgrounds and Emblems


    ![](img/add8efd602aad9815ee8abf27a7a293e_159_0.png)


    Figure 8-4: Choosing a background for your Nautilus window


    From this window, you can drag any pattern into your home window, or into any
    other Nautilus window for that matter, and the pattern will then become the background
    for all your Nautilus windows. So, for experience''s sake, scroll down to find
    the pattern called Manila Paper, and drag it to the whitespaces in the main pane
    of your home window. Once you''ve done that, the presently white window area will
    look like the wallpaper in a lawyer''s office. Very nice, if you like that sort
    of thing. You can change it to a different background in the same way, of course,
    or you can go back to the default white by dragging the Reset switch onto the
    window.


    > If you prefer to use an image of your own for the Nautilus window background,
    you can do so easily. Just locate the image in a new Nautilus window, click it
    with both the left and right mouse buttons (or the middle mouse button, if you
    have a three-button mouse), and then drag the image to any open space within the
    latter window. When you release the button, select Set as Background in the pop-up
    menu that appears.


    In addition to the buttons for pattern and color swatches, there is a third button
    in the Backgrounds and Emblems window called Emblems. Clicking the Emblems button
    reveals all the emblems you saw in Project 8-1, so providing you with another
    way to add them to your folders. This method is far handier when adding emblems
    to several folders or files in the same go.


    To see how this works, click the Emblems button. Then drag the Camera emblem onto
    your Pictures folder and the People emblem onto your Public folder. The selected
    emblems will immediately appear on those folders, adding to the growing proliferation
    of icons in the window.'
  merge: -1
