    ![](img/add8efd602aad9815ee8abf27a7a293e_300_0.png)


    # 14B-2: Adding Additional Radio Streams to Rhythmbox


    Now that you''ve had a taste of what Rhythmbox does with radio, you may well be
    hungry for more. Ah, but where do you find these radio streams? For the largest
    collection of MP3 streams, go to http://www.showcast.com/, to find a stream that
    seems interesting to you, right-click the Tune In! button for that stream, and
    select Copy Link Location in the pop-up menu. After that, paste the URL in the
    URL box of Rhythmbox''s New Internet Radio Station window, and click Add. You
    can then double-click the stream in the right pane of the Rhythmbox window to
    play it.


    # Creating Audio CDs


    All this talk about encoding and listening to MP3 and Ogg Vorbis files your computer
    is fine and daddy, but there are no double times when you would like to have your
    songs on a plain audio CD that you can play your slog way to work on the New Jersey
    Turnpike or the Ventura Freeway. Luckily, this is easy enough to do, and there
    are a couple of ways to go about it.


    # Burning Audio CDs with Rhythmbox


    For Rhythmbox users, the easiest way of going about things is to do it all within
    Rhythmbox. To do this, first create a playlist with the songs you want to burn
    to CD, and then click the Create Audio CD button. A confirmation window will appear,
    asking you whether you want to create the CD you just'
  merge: -1
  pgno: 300
- img_proc: true
  md: 'set out to create. You no doubt it, so click the Create button, and copies
    of your tracks will be created in WAV format. When that process is complete, you
    will be prompted for a blank CD, so pop one into your drive, click OK, and the
    burn process will begin. When it''s done, the progress window will vanish, and
    your new audio CD should pop out of your drive. Simple.


    # Burning Audio CDs with Brasero


    Another way to create "play-anywhere" audio CDs from your ripped MP3 and Ogg Vorbis
    files is with Brasero, which we first discussed in Chapter 7. To go this route,
    place a blank CD in your drive (and click the Nautilus window that pops up to
    handle it), and then select Applications Sound & Video > Brasero Disc Burn. When
    Brasero appears, click Audio project. Now add any mix of songs (in any mix of
    audio formats) to the blank area of the window. You can do this by navigating
    to the songs in the left pane and clicking the Add button (or just dragging the
    files to the right pane). You can also drag files from any open Nautilus to the
    right pane of the Brasero window.


    As you add to the Brasero window, a bar at the bottom of the window will show
    how much more space you have available on the disk (Figure 14-8). Keep an eye
    on that so not to queue more than your disk can hold. Once you are ready, just
    click the Burn button, and then click Burn in the setup window that appears after
    that. A progress window will appear, and once the burn is complete, Brasero will
    let you know and eject your disk. You can then take the disk, plot it in your
    car stereo or wherever you want to play it, and enjoy the results.


    ![](img/add8efd602aad9815ee8abf27a7a293e_301_0.png)


    Figure 14-8: Preparing to burn an audio CD with Brasero'
