  md: 'Over the course of this chapter, you''ll learn how to make the most of your
    double operating system setup: You''ll install Windows fonts, install some Windows
    programs, and share files on a Windows network. And if that isn''t quite enough
    Windows for you, you''ll even see how to run Windows (in a window!) in Ubuntu.
    You might want to sit in a dark room for this—if you''re not tired of windows
    already, you''ll be by the end of this chapter!


    # Project 18A: Accessing Files on Your Windows Partition (for Dual-Booters)


    If you decided to dual-boot with Windows when you installed Ubuntu, then you''ll
    have a partition lurking somewhere on your hard disk filled with your Windows
    files and programs (Chapter 2 if you need a refresher on how partitions work).
    You can access files on Windows by *mounting* the partition from Ubuntu. When
    you mount a partition, the files are made available to you through Nautilus (and
    other programs)—mounting is Linux''s way of recognizing a partition and preparing
    it for use.


    # 18A-1: Mounting Your Windows Partition


    Mounting your Windows partition in Linux used to be a bit of a chore, but that
    isn''t the case anymore (at least not in Ubuntu). In fact, all you have to do
    is open Nautilus window and click the partition in the side pane. You will likely
    find at least two hard disk icons in the side pane, so it is possible that you
    won''t be sure which one your Windows partition actually is. Just remember that
    your Linux partition is represented by the hard disk icon named File System. Things
    aren''t simple for the Windows partition, unfortunately. It could be labeled OS
    (as shown in the example, in Figure 18-1) or with the size of the partition (if
    your Windows partition is 80GB in size, it might appear as 80GB Media in the left
    pane). Or, it might be something else entirely. Guess which one it is, it won''t
    hurt if you get it wrong.


    Now that you know which disk it is, it''s time to get mounting! Just click the
    icon for the Windows partition in the Nautilus side pane. An Authenticate window
    may appear; type your Ubuntu password, and click the Authenticate button if it
    does. A new window showing the contents of your Windows partition will appear.


    > NOTE If you hibernated rather than quit Windows, you will likely receive a "Cannot
    mount volume. You are not privileged to mount this volume." error when trying
    to mount your Windows partition. Some hibernated Windows partitions cannot be
    safely read-write mounted in Linux, because adding new files while Windows is
    hibernated could seriously confuse it when it starts up again. To get full access
    to the drive, be sure to shut Windows down rather than hibernating.'
  merge: -1
  pgno: 355
- img_proc: true
  md: 'Figure 18-1: Mounting a Windows partition in Nautilus


    # 18A-2: Unmounting your Windows Partition


    You can unmount your Windows partition immediately after finishing your work with
    it, or you can just wait until you shut down your system, whereupon it will be
    automatically unmounted. Before you can unmount it, you must first make sure that
    none of your programs is accessing files or folders on the partition. Nautilus
    and the Terminal are the usual suspects, before unmounting, any Nautilus or Terminal
    windows that are browsing that partition. Once you''ve done, click the little
    eject icon next to the Windows partition in the side pane of a Nautilus window
    (Figure 18-2), or right-click it and select Unmount.


    ![](img/add8efd602aad9815ee8abf27a7a293e_356_0.png)


    in the Nautilus side pane, complete with eject icon


    # Accessing a Linux Partition While Running Windows


    Viewing your Windows files in Ubuntu is isnt too stressful, as you have no doubt
    just found out. But what about going the other way and getting Windows to recognize
    your Linux partition? Unfortunately, Windows isn''t too helpful in this respect—it
    can only view FAT or NTFS-format partitions and has no built-support for the ext
    format normally used by Linux. As such, if you need to access your Linux files
    in Windows, it''s probably easiest to create a separate FAT partition to be shared
    between both operating systems (see Appendix C). Hmm, not exactly convenient.'
  merge: -1
  pgno: 356
- img_proc: true
  md: 'An alternative is to add support for Linux partitions into Windows by installing
    some extra software. Unfortunately, the state of such software is pretty dire:
    Support for the old-fashioned ext2 format is pretty good, Ubuntu uses ext4 nowadays,
    which is a different beast entirely. As far as I can tell, the best that people
    have managed to do is get an ext4 partition mounted in Windows in read-only mode.
    Although you won''t be able to add new files to the partition, at least you will
    be able to see what''s there and copy them into Windows. See http://www.soluas.com/read-browse-explore-ext2-ext3-ext4-filesystem-from-windows-7/
    for an example of how you can do it.


    #  Project 18B: Installing Microsoft Windows Core Fonts


    Like or not, the computing world is still pretty much a Microsoft world, and means
    that the vast majority of users, even Mac users, are using Microsoft fonts. That
    being the case, it is inevitable that you will have to deal with fonts using such
    Georgia, Verdana, Times New Roman, and Courier, to name a few. Of course, your
    system can substitute the fonts it has for those used in the document. But for
    you to see things precisely as they were intended and allow others to see your
    documents the way you intended, it will behoove you to install Microsoft core
    fonts on your own system.


    Fortunately for them, there are two ways to get these fonts. One is to download
    and install them via the Ubuntu Software Center, while the other, for those of
    you with a dual-boot setup, is to simply copy them from your Windows partition.
    In the former case, all you need to install is the Microsoft Core Fonts package
    using the Ubuntu Software Center. This is the older set of swishy new fonts that
    are bundled with later Windows versions. When the installation process completes,
    your new Microsoft fonts will have been successfully installed and made ready
    for immediate use by every user account on your machine.


    If you''re a dual-booter, you can copy the fonts directly from your Windows installation.
    This has the advantage of getting all your Windows fonts into Ubuntu, even the
    newer ones (if you have Windows or 7 installed). Here''s what you need to do:


    +   1. Mount your Windows partition, as described in "Project 18A: Accessing Files
    on Your Windows Partition (for Dual-Booters)" on page 324.

    2. Open the Windows partition in Nautilus, and browse to the Windows/Folders folder.

    3. Now for a little trick: Select Edit > Select Items Matching, type *.ttf in
    the box that appears, and click OK (Figure 18-3). This will select all the files
    in the folder with names ending in .ttf, which are all TrueType fonts.

    4. Copy the files to a convenient location (somewhere in your home folder should
    do it).'
  merge: -1
  pgno: 357
- img_proc: true
