- img_proc: true
  md: 'Although it is true open source VoIP packages such as Ekika Softphone are available
    in Ubuntu, they are not compatible with the much better known and more widespread
    Skype. Since it is very likely that the majority of people you know who are using
    a VoIP software package are using Skype, it only makes sense to use Skype that
    you can easily communicate with them.


    Because Skype is not available from the Ubuntu repositories, you will need to
    get it yourself from the Skype website (http://www.skype.com/). Once, click the
    Download button, which will automatically take you to the download page for Linux
    versions of Skype. On that page, click the link for Ubuntu, and then click the
    Save File button in the window that appears.


    Once the download is complete, you will find the Skype DEB package on your hard
    disk, probably in your Downloads folder. Double-click that package to open the
    Package Installer window (Figure 6-12). Click Install Package, after which you
    will be prompted for your password. Once the installation is complete, click the
    Close button in the window that appears and again in the Package Installer window.


    As is the case with APT frontends, you cannot use Package Installer while another
    APT frontend is open. Make sure that Update Manager and the Ubuntu Software Center
    are closed before using Package Installer.


    Once all the pieces have been installed, you can run Skype by selecting Applications
    > Internet > Skype. If you find that you can''t make calls or the sound doesn''t
    work properly, take a look at https://help.skype.com/community/Skype/ for troubleshooting
    hints. Also, while we''re on the topic of sound, remember that it is best to use
    Skype with a headset. Trying to talk with a stick microphone could cause feedback
    or echoes, because the microphone will pick up and transmit sounds from the speakers.


    ![](img/add8efd602aad9815ee8abf27a7a293e_122_0.png)


    Figure 6-12: The Package Installer window'
