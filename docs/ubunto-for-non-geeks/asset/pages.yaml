- img_proc: true
  md: 'Ubuntu to your hard drive once you''re ready. It''s called a live CD. You can
    boot your computer from the CD and run Ubuntu directly off the CD without touching
    your hard disk so that you can see if you like Ubuntu and make sure that Ubuntu
    will work with your hardware. If, after running the live CD, you like what you
    see and everything seems to work, you can install Ubuntu on your computer using
    the same disc. (There are instructions for doing so in Chapter 2.)


    > The world of computers is dynamic, and there may be changes in the software
    or the links to the files for projects in this book after publication. Please
    see http://www-edgy-puins.org/UFNG/ for updates.


    # Concept and Approach


    This book is intended as both a handy reference and a dynamic learning experience:
    You will get hands-on experience as you work through it. The text is organized
    by increasing skills, so that as much as possible you won''t be asked to do something
    you haven''t already learned. In addition, you can put the various morsels of
    knowledge you acquire into practice through several exercises, or projects.


    The projects in this book serve a secondary purpose as well: By working through
    them, you will learn to configure and customize your Ubuntu system. By the time
    you finish this book, you should have pretty good mastery over Ubuntu.


    These chapters should give you a better idea of what is in store:


    Chapter 1: Becoming a Penguinista—Welcome to the World of Linux What''s Linux?
    What''s Ubuntu? What''s a distribution? Can I ...? Will me ...? Chapter 1 holds
    the answers to these and many other questions you might have as it introduces
    you to the world of Linux and what it takes to get it up and running on your machine.


    Chapter 2: Wiring and Diving—Running and (If You Like) Installing Ubuntu The CD
    that comes with this book works as both a live CD and an install CD. Chapter 2
    tells you how to run a Ubuntu session from the CD, and assuming you catch the
    Linux bug after doing so, how to install Ubuntu on your hard disk either as your
    sole operating system or together with Windows.


    Chapter 3: A New Place to Call Home—Getting to the Desktop Regardless of whether
    you are an emigré from the Windows or Mac worlds, you''re probably already familiar
    with the concept of a desktop. Chapter 3 points out the differences between Ubuntu''s
    GNOME desktop and your previous operating system, and it teaches you a number
    of cool tricks you can use to customize the look and feel of things. It includes
    a couple of nifty GNOME Easter eggs (hidden surprises).'
