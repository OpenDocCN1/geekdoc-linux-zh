  md: '# 16


    # # COUCH PENGUINS


    Video and DVD Playback in Ubuntu


    ![](img/add8efd602aad9815ee8abf27a7a293e_322_0.png)


    Now that I''ve covered much of what Ubuntu can do in terms of audio, it''s time
    to turn your attention to what is arguably the second most important of its talents
    in the CNN/MTV-era world: video. Ubuntu is quite capable of video playback, allowing
    you to view video files you download from the Internet or from your digital movie
    camera, video CDs (VCDs), DVDs, and some Internet video streams. It even allows
    you to download movies from your digital video camera and then edit them.


    # DVDs


    Your system allows you to play DVDs; however, due to licensing concerns, playback
    is limited to unencrypted discs by default. Unfortunately, this rules rules out
    a vast majority of the DVD movies you buy or rent at your local video shop and
    leaves you with a rather limited choice of movies that you can play on your computer.
    Given the limited offerings in the unencrypted DVD world, you will no doubt want
    to enable your system to play the encrypted variety.'
  merge: -1
