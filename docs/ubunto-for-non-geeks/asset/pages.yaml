    #  8D-3: Logging In Automatically


    While you''re tinkering with the login screen, it seems like a good idea to mention
    some of the other login-related options that you can change. Log in to your user
    account again, and select System > Administration > Login Screen. Click the Unlock
    button, and type your password to gain access to the settings in the Login Screen
    window that appears.


    If you''re the only person who uses the computer, you can save time by having
    your user automatically log in when the machine starts. Select the Log as option,
    and choose your username from the dropdown list (it should be selected automatically).
    If you''re not the only user but you''re the person who uses the computer for
    most of the time, there''s also a setting to give other people a chance to log
    before you''re logged in automatically. Allow 30 seconds for anyone to log in,
    and change the amount of time you''d like to wait GDM to wait before logging in.


    The last option in this window (the one talking about default sessions) can be
    used to switch between different desktop environments. As you know, Ubuntu uses
    GNOME desktop, but you can install others KDE or Xfce. That''s a bit of a teaser
    for what you would get out—if you want to perform the ultimate customization and
    change the whole desktop environment, this is one of the settings you''re going
    to change. Changing desktops is beyond the scope of this book, though, I''m just
    going to leave it there! (If you''re interested in trying a different desktop
    environment, you might find hints at help.ubuntu.com/community/FromUbuntuToKubuntu/useful.)


    NOTE If you''re not keen on the sound that plays every time you log in, uncheck
    the Play log-in sound option in the Login Screen window.'
