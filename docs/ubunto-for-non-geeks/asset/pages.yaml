  md: '# 1


    # BECOMING A PENGUINISTA


    Welcome to the World of Linux


    ![](img/add8efd602aad9815ee8abf27a7a293e_32_0.png)


    In this first chapter, we begin our project to get you up and running in the world
    of Linux. If you have already made the commitment and have Ubuntu installed on
    your machine, you are essentially ready to go. Others of you might have made the
    commitment psychologically but have yet to act on that. And some of you are probably
