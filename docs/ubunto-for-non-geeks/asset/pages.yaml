    Figure 10-10: Canceling a print job via the print queue window


    In some cases, things will be even easier, particularly if you installed your
    printer driver yourself by means of the installer that came packaged with the
    driver. In many cases, the driver will provide its own progress window that will
    appear when you print a document. If so, you can simply click the Cancel button
    (or equivalent) in that window to cancel the printing job.


    In some cases, you may have to clear your printer after canceling a print job.
    You can do this by turning your printer off, waiting a few seconds, and then turning
    it on again.


    # Checking Ink levels and Other Printer Maintenance Tasks


    Printer ink (and toner) has a knack of vanishing at a rate of knots, so it''s
    natural to check how your cartridges are doing. You might also run into problems
    with the printer, as streaks on printouts or jagged lines that should really straight,
    so might be necessary to clean or align the print heads too. Unfortunately, there''s
    no one simple method of doing this since every make of printer handles it differently.
    I''ll just mention a few ways you can access these options for the most common
    brands:


    **HPLIP** This works only for Hewlett-Packard printers. Open the Ubuntu Software
    Center, and install HPLIP Toolbox. Select **Preferences > HPLIP Toolbox to run
    it**, and use the Supplies tab to check ink levels and the Actions tab to clean
    and align your cartridges.


    **Inkblob** This works for a number of Epson, Canon, and HP printers—check http://inkblob.sourceforge.net/#supported/
    to see whether your printer is supported. Open the Ubuntu Software Center, install
    Inkblob, and then select **Applications > System Tools > Inkblob** to check your
    ink levels.


    **escputil** This works for some Epson printers and is worth a try if Inkblob
    doesn''t support your model. Open the Ubuntu Software Center, then open a Terminal
    by selecting **Applications > Accessories > Terminal**. Type `escputil -i` (don''t
    forget the space) and hit ENTER to display the ink levels. To clean the print
    head, type `escputil -c-.'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'If you have no luck with these utilities or if your printer''s make isn''t
    listed, you might still be able to access ink and maintenance functions using
    the manufacturer''s own Linux driver, if one exists. Also, some newer printers
    allow you to check ink levels and align cartridges using controls over the printer.
    When doubt, check your printer''s manual.


    # Scanners


    Scanners are extremely useful and about cheap a peripheral device as you can get.
    They allow you to take images or pages of text and input them, in digital form,
    into your computer—in the same way as you duplicate a document on a copy machine.


    Even scanners have been around for a relatively long time, support for Linux is
    still a bit spoty. Frankly, this is changing for the better with every new Linux
    release. The backend—the hidden part of your system that handles scanner recognition
    and support in Linux—is Sane. If you are wondering whether Linux will be able
    to recognize your scanner or if you are trying to figure out what type of scanner
    to buy, you can visit the Sane website at http://www.sane-project.org/sane.html/


    There will be able to see whether your scanner is supported or get tips about
    what to buy. The page is pretty long, so you might want to use the Find function
    in web browser (select Edit > Find in Firefox) to search for your scanner model.
    As I have mentioned, you can also try the Ubuntu forums (http://www.ubuntu.org/)
    and ask for Ubuntu-specific recommendations there.


    # Scanning, No Questions Asked, with Simple Scan


    Simple Scan is a new addition to Ubuntu''s line-up of default applications, and
    it certainly lives up to its name—it doesn''t take many clicks to get a document
    from scanner bed to computer screen. To run Simple Scan, make sure that your scanner
    is connected and switched on, then select Applications > Graphics > Simple Scan.
    If you get a warning that no scanners were detected, skip to "Unrecognized Scanners"
    on page 207.


    Assuming that your scanner has been recognized, you''ll be presented with the
    screen in here—see Figure 10-11.


    It''s pretty easy to select the type of document you''re scanning (Text or Photo)
    from the drop-down menu next to the Scan button ( menu''s icon is a small-arrow),
    and then click Scan. Your scanner will roar into action, and after a short wait,
    you''ll be presented with a preview of the picture or document you placed on the
    scanner. You can crop and rotate the image using the options in the Page menu
    or by right-clicking the preview. When you''re happy with your scan, select Document
    > Save to finish up.


    One little tip: To change the resolution of your scans, select Document > Preferences,
    and tweak the settings in the window that appears. Higher resolutions take longer
    to scan and take up more disk space, but lower resolutions can look terrible,
    so choose wisely!'
  merge: -1
