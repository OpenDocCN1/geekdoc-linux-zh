  md: '# 20


    # A COLONY OF PENGUINS


    The Ubuntu Community


    ![](img/add8efd602aad9815ee8abf27a7a293e_386_0.png)


    One thing that really sets open source apart from the commercial software world
    is the importance placed on the community. This can include pretty much anyone
    who has anything to do with the software: the people who use it, the people who
    design it, the people who help others with problems ... every last of them is
    a valued community member.


    Consider the commercial software world, where things tend to be quite top-down.
    When you have a problem, you go to some company that provides you with support.
    This company probably also designed and sold you the software, and you probably
    played no part in that process—you’re the customer; they’re the vendor. Open source
    is different: Rather than one business managing, everyone pitches in together
    and helps each other. People write software and fix faults because it helps other
    people and because they want to. Everyone can play their part in offering feedback
    and suggestions and helping others with problems, and no one is in absolute control
    of the whole process. All in all, it’s much more democratic and, in my opinion,
    much more fun!'
  merge: -1
  pgno: 386
- img_proc: true
  md: 'The Ubuntu community in particular is large, vibrant, and notoriously friendly.
    In this chapter, you''ll learn how to get the most out of it and how you can play
    your part by joining in and giving something back (if you like).


    # Take Me to Your SADBFL


    Open source communities tend to have a well-defined structure, and Ubuntu is no
    exception. At the top of the pile is Ubuntu''s founder, Mark Shuttleworth, whom
    you met in Chapter 1. He''s the Self-Appointed Benevolent Dictator For Life (SADBFL),
    and according to http://www.ubuntu.com/community/ubuntustory/governance/, his
    role is to “provide clear leadership on difficult issues and set the pace for
    the project.” This does not mean that he makes all of the plans and decisions—that''s
    more the job of the Technical Board, a group of senior Ubuntu contributors who
    figure out what shape the next Ubuntu release will take. Mark is just there to
    step in if no one can agree.


    There''s also the Community Council, which oversees the teams of contributors
    that make up the bulk of the project. There are lots of teams with all sorts of
    responsibilities: The Documentation Team writes the documentation for each release
    of Ubuntu, the Installer Team looks after the software used for installing Ubuntu,
    and so on. You can find a list of them at https://wiki.ubuntu.com/Teams/. Teams
    consist of members from all over the world (Figure 20-1), and people on the team
    may have all sorts of responsibilities: Developers, for example, are the people
    who write and update the software. Last, but certainly not least, are the millions
    of Ubuntu users worldwide who form the biggest part of the community. This group
    includes you!


    ![](img/add8efd602aad9815ee8abf27a7a293e_387_0.png)


    Figure 20-1: A world map showing the locations of the members of the Ubuntu Documentation
    Team'
  merge: -1
  pgno: 387
- img_proc: true
  md: 'Everyone who participates is expected to abide by the Code of Conduct (http://www.ubuntu.com/community/conduct/),
    and people who make changes to the project (like developers) are asked to sign
    a copy of this document to show their commitment to the principles of Ubuntu.
    One final: Ubuntu is a meritocracy, where the people who contributed most to the
    project get the biggest say. The most prolific contributors are awarded with Ubuntu
    membership (if they apply for it) and benefit from such perks as an ubuntu.com
    email address.


    # Launchpad: Your Passport to the Ubuntu Community


    Every open source software project needs a place to call home. In Ubuntu''s case,
    this is Launchpad, a sort of project information website on steroids. Whether
    you want to report a problem, ask for help, design a new feature, or write your
    own program, Launchpad is where you go.


    Fire up Firefox, and browse to http://www.launchpad.net/. Unless you signed up
    before, you will need to register for an account, click Log In at the top of the
    page, and answer the questions under the "Not registered?” heading. Hit Register,
    and check your email for details on how to finish signing up. When the message
    arrives, click the link in your details, and click Continue on the page you get
    sent to you can start using your account.


    Once that''s all done and dusted, click your name in the top right of the page
    to see your profile. It''s probably looking pretty empty at the moment, apart
    from a bunch of three-letter acronyms and a mysterious invitation to change your
    "branding.\ Click one of the round, yellow pencil icons to changing your details.
    You can put as much as little information on your account as you want—for example,
    if you like to be able to find you on IRC (see “Chatting with IRC” on page 367),
    make sure you enter your nickname on the page (Figure 20-2). Otherwise, you can
    leave most things blank.


    If you''ve created your account, you might notice a little zero hanging around
    in the “Karma” section. Fortunately, it''s not karma of the metaphysical sort,
    and your eternal soul isn''t in any danger. Rather, it''s a points system for
    recognizing people who have helped Ubuntu better. The more you contribute, the
    more karma points you get, and hence the greater your bragging rights over your
    Ubuntu-obsessed friends (that''s all of them, right?). Check out https://help.launchpad.net/YourAccount/Karma/
    for details on how it all works.'
  merge: -1
  pgno: 388
- img_proc: true
  md: '# Bugs, Bugs, Glorious Bugs


    The computers of yesterday were enormous, complicated beasts, filling entire rooms
    with delicate electronics and whirring tape drives. Renowned computer scientist
    Grace Hopper, retrieving a moth from a relay in one giant, tapped the offending
    insect into her log book and remarked that she found a "bug" in the computer.
    Well, computers have changed a lot since the 1940s, but some of the terminology
    hasn''t. Whether it''s as major as a program crash or freezing or as minor as
    a missing icon, any problem that you find with a piece of software is referred
    to as a bug.


    You''ve almost certainly come across a bug before—no software, whether commercial
    or open source, is ever perfect. The difference with open source is that you''re
    encouraged to report problems when you see them. Developers need feedback in the
    form of bug reports so they know what needs fixing, and problems get fixed more
    quickly if they''re reported sooner. Filing a bug report is a relatively easy
    way of giving something back to the community; it doesn''t take long, it helps
    to improve the software for everyone, and you get an annoying problem fixed for
    free!


    # What Counts as a Bug?


    There are lots of different types of bug, but you can usually fit them into one
    of the following categories:


    +   - When a program crashes, freezes, or shows an error message for no good reason
    (for example, Figure 20-3)


    +   - When something doesn''t work (for example, when a button does nothing when
    you click it)


    ![](img/add8efd602aad9815ee8abf27a7a293e_389_0.png)'
  merge: -1
  pgno: 389
- img_proc: true
  md: '+   When hardware (such as a printer or your sound card) misbehaves or doesn''t
    work at all


    +   Typos, missing icons, and other cosmetic mistakes


    If your problem fits any of these descriptions, you likely have a bug on your
    hands! You should be aware of a few notable exceptions, though. First, if a program
    is missing a feature, that''s not a bug. You can make a feature request using
    the Brainstorm website (see “Ideas on How to Improve Ubuntu” on page 364). Second,
    you shouldn''t ask for help with reporting a bug, since you probably won''t get
    a response. Use the forums or IRC instead; find out more on those in “The Ubuntu
    Forums” on page 365 and “Chatting with IRC” on page 367. Finally, it''s important
    that the bug is reproducible. This means that you provide a set of instructions
    for someone else to follow, and they will experience the same problem as you.
    Sometimes computers just do one off weird things, if it''s not repeatable, there''s
    little chance that the problem can be identified and fixed.


    ![](img/add8efd602aad9815ee8abf27a7a293e_390_0.png)


    # Reporting a Bug


    If you''re confident you''ve found a bug, it''s time to tell someone about it!
    If it happened in a specific program, select Help > Report a Problem in that program''s
    menu, if that option exists, and skip to the next paragraph. If that option isn''t
    there, you''ll have to get your hands a little dirty. First you need to find the
    command name for the offending program. This isn''t always the same as the name
    that appears in the title of the window, so you''ll have to do some digging to
    make sure you get it right


    +   1. Select System > Preferences > Main Menu to open the menu editor.


    +   2. Use the Menus list to the left of the window to find your program. For
    the Menus, if you want to report a bug about the Tomboy note-taking program, click
    the Accessories item and find Tomboy Notes in the Items list in the middle of
    the screen.


    +   3. Right-click the name of your program, and choose Properties from the menu
    that pops up.'
  merge: -1
  pgno: 390
- img_proc: true
  md: '4. When the Launcher Properties window appears, take a look at the contents
    of the Command box—for Tomboy it should say tomboy --search (Figure 20-4). You
    can ignore everything after the first space (only the first part matters)—so in
    this case, the program''s command name is tomboy.


    5. Press ALT-F2 to open the Run Application window, type ubuntu-bug tomboy (replacing
    tomboy with the command name for your program), and click Run.


    ![](img/add8efd602aad9815ee8abf27a7a293e_391_0.png)


    Figure 20-4: Finding the command name for Tomboy


    The bug-reporting tool will start and collect some information about the program
    (such as what version you''re using). Next, it''ll ask whether you want to send
    this report to the developers—you do, click Send Report, and a web page will open
    (log in Launchpad if you haven''t done so already). Type a brief description of
    your problem, be as specific as possible, and click Next.


    # Has It Already Been Reported?


    Lots of people are using the same programs as you, so there''s a good chance that
    someone has gone to the trouble of reporting your bug already. Launchpad will
    go off to look for existing bugs that it matches the description you gave, take
    a look at the list that appears and see whether any of the results sound familiar
    (Figure 20-5). If you find one does, click the arrow to it, read the description
    to make sure, and click Yes, this is the bug I''m reporting to. This could be
    a good sign, because someone might just be working on a fix already!


    Choose Just mark the bug as affecting me, and click the green check button to
    go to the bug page (the alternative option, Subscribe me as well, means that you
    will receive an email every time someone posts a comment about the bug). Take
    a look at the comments that others have made about the bug, and see whether there''s
    anything useful that could help you work around the problem. Problems are sometimes
    technical in nature, so it might be necessary to ask around on the forums for
    help with some of the more cryptic instructions. If you can''t find anything helpful,
    you can try to provide more details on the problem to help a developer track it
    down. They often ask for you to provide a copy of the output of some command,'
  merge: -1
  pgno: 391
- img_proc: true
  md: 'which they can use to figure out what''s going wrong. If you think you can
    help, scroll down to the bottom of the bug page, and put what you know in the
    comment box.


    ![](img/add8efd602aad9815ee8abf27a7a293e_392_0.png)


    Figure 20-5: List of bugs that Launchpad thinks are similar to the one you''re
    reporting


    If no one else seems to have the same problem, then you''ve got a live one! Click
    No, I need to report a new bug at the bottom of the page where the list of suggested
    bugs appeared, and write a description of the bug in the Further information box.
    Here are some tips on how to write a breathtakingly beautiful-bug report:


