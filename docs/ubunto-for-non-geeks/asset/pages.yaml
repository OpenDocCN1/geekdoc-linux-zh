  md: '# UBUNTU DESKTOP CDS

    FOR AMD64, OPTERON,

    OR INTEL CORE 2 USERS


    As I mentioned in Chapter 1, the version of the Ubuntu Desktop CD that comes with
    this book is designed to work with i386 processors, either in PCs or Intel-based
    Macs. It will also work with AMD64 or Intel Core 2 processors, albeit not in 64-bit
    mode. In order to use Ubuntu with these processors (or any other machine based
    on AMD64 or EM64T architecture) in 64-bit mode, you must get a different disc
    on your own. There are several ways of doing this: downloading an ISO (disc image)
    and burning it to CD yourself, ordering the CD from Ubuntu (for free), or ordering
    it from an online Linux CD provider (for a nominal cost).


    # Downloading and Burning Ubuntu Desktop CD ISOs to CD


    To download an ISO of the Ubuntu Desktop CD, go to the Ubuntu website at http://www.ubuntu.com/,
    find the link to the download page, and select and download the appropriate version
    for your machine. Remember that the ISO file you will be downloading is a heavyweight,
    weighing in at just under'
  merge: -1
  pgno: 440
- img_proc: true
  md: '700MB, so the download will take a bit of time. Don''t count on getting it
    all downloaded and done before dinner ... or, if you happen to be using a dial-up
    Internet connection, before dinner tomorrow. Yikes!


    # Burning the ISO to CD in Windows


    Once the Ubuntu Desktop CD ISO has been downloaded, you need to burn it to CD
    before you can use it. Although Windows has built-in CD-writing capabilities,
    not all versions have the built-in ability to burn ISOs. To burn an ISO to CD
    in Windows 7, just right-click the ISO file, select Burn disc image, and then
    click the Burn button in the window that appears. In all other versions of Windows,
    you must use a third-party commercial application, such as Nero. If you don''t
    have a commercial disc-burning utility installed on your system, then use the
    free ISO Recorder.


    To get ISO Recorder, visit //isorecorder.aleifeman.com. Once the download is complete,
    double-click the ISORecorderSetup.msi file on your hard disk to install. After
    the installation is complete, burn your ISO by right-clicking the Ubuntu ISO file
    on your menu and selecting Open > ISO Recorder in the pop-up menu. A CD Recording
    window will appear.


    It is generally best if you install or live CDs at a lower speed than the maximum
    speed allowed by your drive in order to reduce the chance of error (2X to 4X speeds
    considered optimal). To do so, make your choice from the Recording speed drop-down
    menu. Next, pop a blank CD into the drive, and click the Next button. The CD-burning
    process should begin. Once it''s done, the CD pops out of the drive, and if it
    goes well, you''ll have yourself an AMD64 compatible live CD. You can then use
    it by following the directions at the beginning of Chapter 2 for using the live
    CD with this book.


    does not seem to work, there could be a problem with the ISO you downloaded. Find
    out by doing an integrity check as explained at https://ubuntu.com/community/HowToMD5SUM.


    # Burning the ISO to CD in OS X


    Although Ubuntu no longer comes in PowerPC versions, the i386 editions can be
    installed and run on Intel-based Macs. You can also, download-ISOs for other architectures
    on your Mac and then burn them to CD for other machines.


    To burn an file to CD in OS X, first check to make sure the ISO image is not mounted
    by opening a Finder window and checking the disc in the area at top portion of
    the left pane. If the disc is mounted, a drive icon will appear in that location.
    If the drive icon is there, click the arrow next to that entry, or unmount it.


    After that, click Applications in the same Finder window, and then look for and
    open the Utilities folder. In folder, find and then double-click Disk Utility.
    If the ISO is not listed in the left pane of the Disk Utility window'
