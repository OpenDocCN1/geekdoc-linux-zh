  md: '# Trial Error


    Finally, there is the old trial-and-error approach, which works on occasion. When
    setting up your printer via the wizard window, try choosing one of the other printer
    models and/or drivers available from your printer''s manufacturer.


    After you are done with the wizard, double-click the Printing window, click the
    Settings tab and then click the Print Test Page button to see what happens. If
    nothing happens, click the Change button at the far right end of the Make and
    Model on the Settings screen, select a different printer model and/or driver,
    and then, back on the Settings screen, click the Print Test Page button again.
    Repeat that process until something works. With any luck, something will... might...
    well, give it a try if you''re desperate.


    # Printing Details


    Now that your printer is set up, you will no doubt want to start printing This
    is an easy task, and it isn''t very different from how it works in the Windows
    and Mac worlds, so you shouldn''t need much explanation to proceed. In fact, printing
    in Ubuntu has become easier than ever, because all the settings you would normally
    toy with are all on their tabs when you select Print in an application''s File
    menu. I would even say that figuring out printing options in Ubuntu is now easier
    than in Windows or OS X.


    You should be aware that the function of the tabs can vary depending on the application
    you happen to be printing from. For instance, the tabs you''ll see when printing
    from the GIMP will be slightly different from those you''ll see when printing
    from Firefox. The General and Page Setup will always be there, however. All that
    said, I''ll give you an idea of some of the settings that are available within
    some of the Print''s tabs:


    +   - General Printer selection, pages to print, number of copies, order of printing,
    collating

    - Page Setup Pages per sheet, scaling, page type, page source, output tray

    - Options Print frames, shrink to fit page, print background, headers and footers

    - Image Settings Size, resolution, page positioning

    - Job Print timing (now, later, at time), cover page

    - Image Quality/Advanced Output resolution (DPI), printing speed and quality'
  merge: -1
