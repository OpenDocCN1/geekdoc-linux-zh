    5-17: Changing your instant messaging status


    # # Microblogging—Twitter and Friends


    Blogging (writing an online diary/journal) is now a well-established Internet
    pastime. There are upon millions of blogs out there covering all sorts of subjects,
    from astronomy to economics to fluffy kittens. The quality of content varies wildly;
    for the most part blog entries are typical newspaper-opinion columns of pieces.
    So, what if you had a blog where you were forced to write everything you wanted
    to say in less than 140 characters? That is the idea behind microblogging: making
    frequent, very short, bulletin-like posts.


    Twitter is the best-known microblogging website (http://www.twitter.com/). People
    find all sorts of uses for Twitter: You can let your friends know what you''re
    up to the moment, receive breaking news, discuss topics with other users, write
    posts using your mobile phone ... and on I followed a Twitter conversation between
    a few of my friends who were watching a lively hockey game. They sent messages
    every time exciting happening, so I could follow the action literally, within
    seconds of it happening. News travels fast on Twitter.


    Perhaps it''s the sort of thing you need to appreciate, so if you don''t have
    an account already, click the Sign up button on the Twitter home page, and follow
    the instructions. Once you''ve done that, take a look around the website to see
    how things works. The basic idea is that you can post messages (tweets) for your
    followers to see. People can choose to follow you by clicking a button when they
    view your user profile. You can choose to follow other people too—when you do
    this, all of their tweets will be displayed on your Twitter home page for you
    to read. Most people follow a few people and typically have a handful of followers
    themselves, but there are no restrictions on how many of each you can have.


