- img_proc: true
  md: '# 3A-1: Adding Utility Buttons to the Panel


    The GNOME panel allows you to add a number of utility applications, known as applets.
    Each of these has some specific function, such as tracking your stocks, telling
    you the weather, or performing some particular system-related function. To start,
    let''s add a useful utility to the top panel: the Force Quit button. The Force
    Quit button lets you quickly and deal with responding windows.


    Yes, it happens on occasion: A window suddenly refuses to do anything. Regardless
    of what you want it to do or what it is supposed to be doing, it sits there as
    if it is on strike (maybe it is). With just one of the Force Quit button, your
    cursor becomes a powerful surgical instrument that will kill the window. You definitely
    won''t want to be without this button, so here''s how to add it to the panel:


    +   1. Right-click any open space on the top panel.

    2. From the pop-up menu, select Add to Panel, after which the Add to Panel window
    will appear.

    3. In that window, scroll down, and click Force Quit once to highlight it, as
    I''ve done in Figure 3-6. Click the Add button, and then click Close to finish
    the job.


    ![](img/add8efd602aad9815ee8abf27a7a293e_61_0.png)


    Figure 3-6: Adding launchers and utility applets to the panel'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'To reinforce what you''ve learned how to do, let''s add another utility to
    the panel: the Run Application applet. Once you start applications in Ubuntu,
    you will find that some of those applications do not automatically install program
    launchers in your Applications menu. This means that you have to open a Terminal
    window and type a command you want to run such programs, which can get quite old.
    The Run Application applet is one way around this problem.


    To add the Run Application applet to the panel, just follow the steps used when
    adding the Force Quit button, but this time in Step 3, highlight Run Application
    in the Add to Panel instead of Force Quit.


    If you decide later not to keep the Run Application applet on the panel or if
    you prefer keyboard shortcuts to pointing and clicking, it is worth noting that
    you can also open the app by pressing ALT-F2.


    # 3A-2: Adding Amuseplets to the Panel


    The GNOME panel not allows you to add very functional utilities, but it allows
    you to add seemingly useless amusements as well. In part of this project, you
    will be adding two such amusements: Eyes and a little fish Wanda.


    At first glance, Wanda does little more than bat her tail around and spit a bubble
    or two. However, if you install an application called Fortune via the Ubuntu Software
    Center, you will and then click Wanda, Wanda pops up in which she will shrew out
    quotes and offbeat one-liners.


    To get a glimpse of Wanda in action, limited though that action be, the steps
    are essentially the same as those in Project 3A-1, but I''ll run through them
    one more time:


    +   1. Right-click any open space on the top panel.

    2. From the pop-up menu, select Add to Panel, after which the Add to Panel window
    will appear.

    3. In that window, click Fish once to highlight it, click the Add button, and
    then click Close.


    With now in place on your panel, you can add Eyes, which is a pair of eyes that
    follows your cursor around as it moves around your desktop. Follow the same procedure,
    but click Eyes instead of Fish in Step 3.


    # 3A-3: Adding a Program Launcher to the Panel


    Now let''s on to something a bit more practical—adding program launchers to the
    panel. Although it is very easy to run an application by navigating through the
    Applications menu, there are no doubt applications that you will be using frequently
    enough to want easier access to them. The OpenOffice.org word processor, Writer,
    is probably one of those applications.'
  merge: -1
