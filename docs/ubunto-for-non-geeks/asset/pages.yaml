  md: '# Other Video Apps


    I''ve covered the main video applications in Ubuntu, but there are still others
    that you might want to consider, all of which are available via the Ubuntu Software
    Center. If you are interested in yet another video/DVD player, you can try GNOME
    MPlayer, which has long had quite a significant because of its ability to handle
    numerous video formats.


    Another cool application for video streaming is Miro Internet TV (16-12), which
    allows you to easily search, download, and play online video streams. just perform
    an Ubuntu Software search for *miro*.


    If you have a webcam, you might also want to try an application called Cheese,
    which allows you to take pictures and videos from your webcam and add cool graphical
    effects. Camoram is another webcam viewer/capture application to think about.


    If you''re looking for an alternative to PiViTi and Avidemum. One very handy feature
    makes it worth, even if you don''t use it as your main video editor: it can rip
    audio tracks from video files. You can get Avidemum from the Ubuntu Software Center.
    Be sure to install the GTK+


    For those of interested in ripping DVDs, you might try DVD:Rp, AcidRip DVD Ripper,
    or then figuring out Thoggen DVD Ripper. You might also be interested in DVD9
    and the more highly configurable K9copy, which are the Linux answers to DVDShrink.
    These applications allow you to rip dual-layer DVDs (DVD9) and compress the output
    so that will fit on a single-layer blank disc (DVD5). For creating your own DVDs
    from scratch (like you would with iDVD), a few applications are worth considering:
    DVD St, DVDAuthor, and Bonombo DVD.


