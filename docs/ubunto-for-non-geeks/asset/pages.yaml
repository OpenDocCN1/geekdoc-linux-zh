    # Project 16B: Capturing Digital Video with Kino


    When you want to transfer a digital image or a digital video from your digital
    still camera to your computer, you just have to download it from camera to computer.
    When you want to transfer a video clip from your computer to a digital video (DV)
    camera that saves its data on disk from tape or from a video stream, however,
    there is no way to simply drag it from one place to another. You have to capture
    the video stream to disk while you play it, and to do that you need some sort
    of software solution. This is usually found in the form of the system''s video
    editor; however, as mentioned in the previous section, Ubuntu''s bundled video
    editor, PiTiVi, is not yet capable of doing this. This means you will have to
    install another editor, and the old-time favorite for this is Kino (Figure 16-8).


