    # Audacity


    If you''re interested in podcasting, one application you will find repeatedly
    mentioned is Audacity. Audacity (Figure 14-13) is a multiplatform audio recording
    and editing application that is frequently used not only in the Linux world but
    in the Mac and Windows worlds as well. It allows you to copy and paste bites of
    sound, raise pitch, increase speed, add echo and other effects, ... well, all
    sorts of other neat stuff. Get it via Ubuntu Software Center by doing a search
    for and then installing audacity. Audacity will then be available by selecting
