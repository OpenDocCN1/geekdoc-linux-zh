  md: '+   3. In that window, click the Extract button, after which another window,
    Extract, will appear.


    +   4. Click the Extract button in that window, and within a second (two at the
    most), you will find two new copies of dogwood and violet in your home folder.


    Now you''ve created and extracted a compressed archive, which is in this case
    a Zip file. You can also create a compressed tarball in the future by following
    the same procedure (probably with real rather than dummy files), but when it''s
