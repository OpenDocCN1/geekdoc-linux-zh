  md: '![](img/add8efd602aad9815ee8abf27a7a293e_378_0.png)


    Figure 19-6: Entering your avast! license key


    ![](img/add8efd602aad9815ee8abf27a7a293e_378_1.png)


    Figure 19-7: avast! virus scanner


    When avast! is updating the virus database, you can get on to the work of virus
    scanning by first deciding whether you want to scan just your home directory,
    the entire system, or selected folders. You can also decide how thorough a scan
    you want to perform via the three choices available in the middle of the window:
    Quick, Standard, or Thorough.


    Which one of these sensitivity modes chooses how thorough you want to scan. The
    Quick scan scans files that end in certain extensions (.exe, .scr, .com, .doc,
    and so on), because these are the file types'
  merge: -1
