  md: '# A Program Always Crashes


    If you have a program that keeps crashing, try running it in a Terminal to see
    what''s going wrong. You''ll have to get the name of the command needed to run
    the program first—see "Reporting a Bug" on page 359 for how you can find it. If
    you have the command, type it into the Terminal, and press ENTER. The program
    should run as normal, keeping until it crashes. When it does, look at the Terminal
    to see whether it left any clues as what''s going wrong there. Error messages
    can be quite cryptic, so you might like to ask someone on the forums or IRC (both
    of which are discussed in Chapter 20) if they know what it means.


    If the messages in the Terminal are no help, you should report a bug—see "Bugs,
    Bugs, Bulurious Bugs" on page 358 for details.


    # A Program Won''t Start


    If a program doesn''t start when you click its shortcut in the Applications menu,
    try running it in the Terminal, as described in the previous section. It could
    be crashing after starting and might leave some information about the crash in
    the Terminal.


    # My Computer Is Running Slowly


    Certain tasks take up lots of computing power and cause your computer to run slowly.
    Burning a CD, installing software, and converting music files to a different format
    will all strain your system, so you shouldn''t be surprised if things feel a little
    sluggish when something like that is running. But what if your computer is running
    slowly even if you''re not running anything intensive? You can investigate the
    cause of the slideshow by selecting System Administration System Monitor to open
    the System Monitor. Select the Resources tab, and check your CPU (processor) usage—if
    it''s around 100 percent, then a program running in the background is probably
    responsible for the problem (see Figure 2-14). Select the Processes tab, and click
    the % CPU column heading of times until it has an "up" arrow next to it. This
    will sort the list of programs in order of how much of the processor they are
    using. The one that''s using all of the CPU should appear at the top of the list.


    It''s normally best to wait a few minutes and see whether the program reduces
    its CPU usage by itself. After all, it could be some software running a scan or
    some other maintenance operation. If it doesn''t go away, the program might have
    gotten stuck, select it and click End Process to close it. Your system should
    return to its usual speed within a few seconds.


    If you didn''t notice high CPU usage on the Resources tab, then it''s possible
    something is overtaxing your hard disk index. Programs that do this almost always
    finish what they''re doing within five or ten minutes, so you should probably
    ride it out. If it persists, the easiest way of fixing the problem is by restarting
    the computer.'
  merge: -1
