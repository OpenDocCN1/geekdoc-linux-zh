  md: '# Hard Disks and Storage Problems


    I never understood how you could completely fill up your hard disk until I bought
    a digital camera. If you have a similarly expensive disk usage habit, this section
    is for you. There are a few tips on how to free up some disk space, worst-case
    scenario, how to deal with a completely full disk.


    # My Disk Is Almost Full


    If your disk is almost full, Ubuntu will pop up a warning message similar to the
    one in Figure 21-13. Click the Examine button to start the Disk Usage Analyzer—it
    will scan your disk and display a colored chart showing what is using most of
    the disk space. You can use this information to hunt down the files and folders
    that are taking up most of your disk''s capacity. If you are wondering exactly
    how much disk space you have left, select System > Administration > System Monitor,
    and look on the File Systems tab to see how much space is left on each disk.


    ![](img/add8efd602aad9815ee8abf27a7a293e_428_0.png)


    Figure 21-13: A message warning you that your disk is almost full


    Apart from rooting through your home folder and deleting unwanted files, you can
    try a few other things to free up some disk space:


    +   **Empty your Trash** When you delete files, they get moved to the Trash folder
    if you change your mind about having removed them. To empty the Trash folder (this
    permanently removing all the files in it), click the Trash icon on the bottom
    panel, and click the Empty Trash button in the Nautilus window that appears.


    **Clean up unwanted packages** When you remove a package using the Ubuntu Software
    Center, it sometimes leaves other packages that were installed at the same time
    on the system, even though they are not needed anymore. To remove them, open a
    Terminal, type `sudo apt-get autoremove`, and then press ENTER. Type your password
    when prompted, and see whether there are any leftover packages that can be removed.
    If there are, press Y and then press ENTER to remove them.'
  merge: -1
  pgno: 428
- img_proc: true
  md: 'Empty the package cache When the Ubuntu Software Center installs a program,
    it keeps the package used to install it for a little in case it''s needed again.
    These cached files can take up quite a bit of disk space, but it''s fine to delete
    them (the program won''t be uninstalled or anything like that). Open a Terminal,
    and type sudo apt-get clean, followed by ENTER. Type your password if prompted,
    and then press ENTER to empty the cache.


    # My Disk Is Completely Full


    If your disk is completely full, you may not be able to start Ubuntu, and all
    you''ll get a blank screen. If this happens, press CTRL-ALT-F2 to go to a Terminal
    login prompt. Type your username, followed by ENTER, your password, followed by
    ENTER again, to access a command line. Once clearing some disk space by typing
    some of the commands recommended in "Disk Is Almost Full" on page 397. You can
    also use the rm command to remove some files in your home folder, but be careful:
    there''s undo when using rm.


    Once you''ve cleared a little disk space, type sudo reboot to restart the computer.
    With any luck, there will be enough disk space for you to be able to log in now.


    # I Can''t Delete a File


    The usual reason for not being able to delete a file is because you don''t have
    the right permissions to delete it (see Chapter 7 for an explanation of file permissions).
    Right-click a blank area of the folder that the file is stored in, choose Properties,
    and select the Permissions tab. If you are listed as the owner make sure your
    Folder Access permissions are to Create and delete files. Click Close, and then
    try to delete the file again.


    If you are not the owner of the folder, you''ll have to gain ownership of it before
    you can delete it. This is where you need to ask yourself, "Should I really be
    deleting someone''s file?" Sometimes file permissions get messed up and the file
    might be yours—in that case, it''s OK to delete it. If it''s someone else''s file,
    though, ask for permission first. If you''re convinced that deleting it is a good
    idea, open a Terminal, and use the command to change the owner of the folder.
    Here is how it works: If I wanted to delete a file cats.jpg from the Pets folder
    in my Pictures folder, I would type sudo chown ~ ~/Pictures/Pets, followed by
    the ENTER key (remember, ~ means "my home folder”). After typing password and
    pressing ENTER again, I would become the owner of the Pets folder and could delete
    cats.jpg as normal. Of course, you should substitute the name of the folder and
    your username in mine for this to work for you.


    > NOTE Don''t use this method to delete system files (in other words, files that
    aren''t stored in the /home folder) unless you''re sure you know what you''re
    doing. You don''t have permission to delete system files for a reason; you could
    screw up your system if you remove something vital.'
