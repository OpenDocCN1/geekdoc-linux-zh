  md: '# 3A-5: Adding a Drawer to the Panel


    One of the features I quite like about the GNOME panel is the drawer. The drawer
    is a little thing that saves on panel space by letting you add drop-downs, in
    which you can place launchers that you do not room to place elsewhere. These drawers
    are also handy locations to place launchers for applications that you must normally
    run by typing a command in Terminal or via the Launch Application, as those you
    compile yourself from source code or are run via scripts. You''ll learn how to
    do this in Chapter 9. Of course, you can put anything you want in a drawer, including
    frequently used files or even menus.


    Adding a drawer to your panel is very easy and is basically the same procedure
    that you used to add the Force Quit button to the panel. Here is all you need
    to do:


    +   1. Right-click any open space on the top panel.

    2. From the pop-up menu, select Add to Panel, after which the Add to Panel window
    will appear.

    3. In that window, click Once to highlight it, and then click the Add button.
    Close the window by, logically, clicking Close.


    # 3A-6: Adding Program Launchers to the Drawer


    The drawer you''ve just added is empty at this space, so let''s put it to good
    by adding launchers for three useful, yet glamorous, system utilities. These are
    System Monitor, which allows you to view your computer''s running applications
    and processes, memory and CPU usage, and storage device usage; Terminal, in which
    you can type and execute commands (slightly geek, I admit, but very useful); and
    the Ubuntu Software Center, which you can use to download and install applications.

    Here''s what you need to do:


    +   1. Right-click the drawer app in the panel, and select Add to Drawer in the
    pop-up menu.

    2. In the Add to Drawer window that appears (and looks and behaves the same as
    the Add to Panel window), select Application Launcher, and then click the Forward
    button that appears.

    3. On the next screen, click the small + next to Accessories, scroll down and
    click Terminal to select it, and then click the Add button. The Terminal launcher
    will now be loaded into the drawer.

    4. Next, scroll down and click the small arrow next to Administration.

    5. Scroll down within that category until you find Ubuntu Software Center, click
    it to select, and then click Add.

    6. Finally, add a launcher for the System Monitor by scrolling down to the System
    Tools category, clicking the small + next to that category, selecting System Monitor
    from that group, and then clicking Add. You can now close the Add Drawer window.'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'The three launchers should be loaded in the drawer, so click the drawer to
    sneak a peek. Yours should look the same as mine in Figure 3-11.


    ![](img/add8efd602aad9815ee8abf27a7a293e_67_0.png)


    # 3A-7: Adding the Entire Contents of a Menu to the Panel


    If you find that you use the applications in a particular submenu of your Applications,
    Places, or System menus a lot, you can opt to add the entire menu to the panel
    either as a menu or as a drawer in a manner similar to the one you used in Project
    3A-3''s "Method 2" section on page 32. To learn how to do this, let''s add the
    Games submenu as a menu and the Sound & Video submenu as a drawer. Here is what
    you need to do:


    +   1. Add the Games menu to the panel by selecting Applications > Games and right-clicking
    any of the launchers within that submenu.


    +   2. In the pop-up menu that appears, select Entire menu > Add this as menu
    to panel.


    +   3. Add the Sound & Video submenu to the panel as a drawer by selecting Applications
    > Sound & Video and right-clicking any of the launchers you find there.


    +   4. In the pop-up menu, select Entire menu > Add this as drawer to panel.


    You should now have two new launchers on your panel with icons matching those
    found in the Applications menu next to the relevant items. As you can see in Figure
    3-12, these two icons act somewhat differently.


    ![](img/add8efd602aad9815ee8abf27a7a293e_67_1.png)'
  merge: -1
