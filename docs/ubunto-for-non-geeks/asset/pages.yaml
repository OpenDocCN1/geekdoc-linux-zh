  md: '# ACKNOWLEDGMENTS


    There are a good number of people who deserve the help and support they provided
    either while or before this book was written, and there are still others whose
    help will come after the book is released. I (Rickford) would like to acknowledge
    all of them now.


    Starting with my family and friends, I''d like to thank my mother, Dixie Angelina
    Burckel-Testa; my auntie and uncle, Danica Lucia and David Zollars; and Sumire,
    who continues to inspire me with her art and creativity. And, somewhere in the
    dimension between family and geistgrund, a special shout-out to Mini—“Pakakalaki!”
    I also send thanks to my long-time friends Donald Hammming, Tracy Nakajima, and
    Kimberly Jo Burke, who helped give me a needed sense of continuity and balance;
    and to my dear friends back in Japan, Keith Hagan, Enyo Nagata, and Setsu Usaka,
    who keep me connected with the sensibilities and joys I acquired. Very special
    thanks also go out to my godfather, Theophan Dort, who is an always kind and patient
    ear for my incoherent ramblings and who does his best to keep me relatively sane
    in the context of my whacko whack.


    In the production of any book, editors are so very important, and I would like
    to thank the editor of this edition of Ubuntu for Non-Geeks, Keith Fancher, who
    had the enviable task of dealing with files flying in two different authors, one
    of whom (me) is particularly good at mucking things up in the numbering and attachments
    department. Good job, Keith! Thanks also go out to Milo Casagrande, the technical
    editor on this edition, who did'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'best to ensure that all the details in the book were straight duck, and Kim
    Wimpset, the copyditor, who found that every t was crossed and of orphaned text
    was found and dealt with. Thanks also to those whose job it is to jumble the text
    and images we submit into a book—Megan Dunchak, Ansel Seaton, and Riley Hoffman,
    who also taught us a thing or about indexing. And finally, a very special set
    of thanks goes out to William Pollock for not only taking a chance on the completely
    unknown writer that I was also for turning me on a great pupuperia in San Mateo,
    California.


    Having worked on for the previous editions of this book, with a coauthor this
    time around was a new and pleasant experience, and for that reason I would also
    like to add a couple lines of thanks to coauthor, Phil Bull. With Phil not only
    provided me with some inspiration and ideas for the book, but it also made working
    on this edition a lot fun and less lonely than working on the previous editions.
    It''s always nice to have someone to bounce ideas around.


    Finally, a special thanks to my sweet little black cat and dear feline friend,
    Muju, despite vigorously protesting as she spent her time writing this book, continues
    to listen to whatever I have to say and keeps me when I''m feeling down—though
    I admit to losing a bit when she demands I spin around on my wheel chair at 4.
    Such is life in service to one''s cat. Mew.


    With two authors you get two sets of acknowledgments, I''d like to take this opportunity
    to thank all of the people who helped me (Phil) through the writing of this book,
    too.


    First and foremost, I want to thank my parents, Julie and Jeff, for all of the
    love, support and home cooking they provided for our readers. Sometimes, as an
    expression of my gratitude, I even remove all of my old computer junk from their
    house! I''d also like to acknowledge my sister, Ellen, for keeping things interesting:
    Nan, Gramps, and Nana for their affection; and auntie and uncle, Pam and Roy Beeson,
    for being (mostly) Ubuntu guinea pigs.


    Emily Johnstone has been superb in putting up with my nonsense and helping me
    through some of life''s obstacles. I hope she knows how much I appreciate her
    friendship. My good friends (and fellow) Kieran “K-Dizle” Joshi and Leo “Tenacity”
    Huckvale walked through my initial scribblings and gave me the confidence to keep
    writing, and Will “Willbys” was the inspiration for the troubleshooting chapter;
    thanks! I''m also grateful to Adam Blundero, despite his misguided attempts to
    convince me that Windows is better than Linux, has been a wonderful friend, and
    to Matt Glover, Jamie Poole, and the other folks in Stoke for all the times.


    While I''ve been in Manchester, Christina Smith, Amanda Johnson, Michel Scheamm,
    Sarah Johnson, Sarah Rehman, and Jack Mason have made every day interesting, and
    their friendship has been so important to me. Sally and the Millican family have
    also been a big part of my life past few years, and I''m grateful to them for
    all the adventures we''ve shared. Thanks'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'must go out to the guys in the physics department at the University of Manchester,
    too; Bob, Richard, Fred, Lucio, Giampaolo, and all the rest have turned me into
    the cosmologist I am today (whether they intended to or not), and I''m sincerely
    grateful for their support.


    Being part of the open source documentation community maintains my faith in humanity.
    It''s a privilege to be involved in the Ubuntu and GNOME projects, and people
    like Matthew East, Shaun McCance, Paul Cutler, Daniel Holbach, and Emma-Jane Hogbin
    are the reason why. In particular, I''d like to single out Jim Campbell for his
    endless generosity and Rich Johnson for trying to get me to use my accent for
    no good.


    This is my first book, and the guys at No Starch Press turned the process from
    a daunting leap into the unknown into a rewarding and pleasurable experience.
    Keith Fancher, our editor, has been a rock; his comments and advice cut straight
    to the point, and without his guidance it''s fair to say I would have been lost.
    As my copyditor, Kim Wimpsett dealt admirably with the task of turning the output
    of two different authors into a readable, coherent whole, and Mila Casagrande
    deserves not only for the stellar job he made of the technical reviewing but also
    for giving me a place to stay windy night after a post-conference visit to blues
    bar Riley Hoffman, Ansel Stanton, and all the other folks behind the scenes should
    be praised for their hard work in getting this book out on the shelves. Lastly,
    I want to say thanks to William Pollock for a series of out-of-the-blue offers
    that have kept me pleasantly occupied over the last couple of years. It''s always
    fun working with you!


    Finally, I''d like to express my gratitude to my coauthor. This edition of Ubuntu
    For Non-Geeks wouldn''t have been possible without the extremely solid base he''s
