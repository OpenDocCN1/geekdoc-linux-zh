  md: '# Some Goofy Yet Useful Fun with the Command Terminal


    A rather cool thing about typing in the command Terminal is it has what you might
    call short-term memory. Try by typing the word cherry and pressing ENTER. Ignoring
    the command-not-found message, go on and type vanilla, and press ENTER. Now type
    gelato, and press ENTER. So far, so dumb, right? Well, not really. Let''s type
    everything you''ve typed thus far again, but this time let''s do it with one key.


    Huh?


    Yes, just press the up arrow key once, and what do you see? That—the last command
    you typed appears, which in this case would be gelato. Press the up arrow key
    again, and the command that you typed before that appear—vanilla. One more time?
    Yes, cherry, and one more time for the grand finale... I like cherries so very
    much.


    Considering what we have thus far, this may all seem a bit silly, but imagine
    you''re not typing goofy words and instead have to deal with longer strings, as
    a simple copy command (which you''ll learn about later in this chapter) like this:


    ```

    cp /mypics/stpiere/coastal/onthebeach1_27.jpg /home/frog/photos_for/stpiere

    ```


    By typing that, you are copying an image onthebeach_27.jpg from the coastal folder
    to another folder stpiere. If you wanted to copy another photo in the coastal
    folder, onthebeach_16.jpg, for instance, you could simply press the up arrow key
    once, use the left arrow key and DELETE key to move over to and delete the 27,
    and replace it with 16. All in all, it would be much simpler and and much faster.
    It would also help you avoid mistakes in typing. Not so dumb anymore, eh?


    # Nontoxic Commands


    As you know now, all of this typing is easy enough, but to actually do something
    with your Terminal, you need to type commands—and there are more of them than
    you could ever hope or need to know. To get started, we will begin with some commands
    that are easy to understand, nontoxic, and completely kitten-friendly.


    # $ who


    There is no command as easy, safe, or even seemingly useless as whoami. Rather
    than help those with multiple-personality disorders discover who they are at any
    given moment, the whoami command simply tells you which user is currently logged
    in. Try it by typing whoami after the $ and pressing the ENTER key. Remember that
    commands are case sensitive.'
  merge: -1
  pgno: 189
- img_proc: true
  md: 'The Terminal will tell you the username of the person currently logged in.
    If you are logged in as frog, you should get frog as the answer to your command.


    # $ finger


    If you enjoyed discovering who you are with the whom command, then you might enjoy
    finding out even more about yourself using the finger command. You can use the
    finger command in a number of ways, but a shell is a very simple one for finding
    out about a particular user. Try this by typing finger and your username. In my
    case, that would be finger rg. Once you have typed the command, press ENTER, and
    see what you get. In Figure 9-3.


    ![](img/add8efd602aad9815ee8abf27a7a293e_190_0.png)


    Figure 9-3: Output from the finger command


    As you see, my login name is Rickford Grant, my home directory is /home/rg and
    I am using the Bash shell for typing my commands. I have been logged on since
    Wednesday, April 14, at 19:59 Eastern daylight time (EDT), and I have had my Terminal
    session open since Thursday, April 15, at 19:26. I have no mail or plan. It doesn''t
    tell you your Social Security number or your mother''s maiden name, but it is
    pretty cool, don''t you think?


    # What is a Shell?


    As you noticed, I mentioned the results of the finger command I showed using the
    Bash shell, so you may be understandably wondering just what Bash is. Well, Bash
    (Bourne Again Shell) is one of many shells that are used in Linux systems, and
    it''s the one that happens to come with Ubuntu distro (and others, for that matter).
    A shell is a program that interprets the commands you type into the Terminal and
    delivers them, to speak, to your system so that it can act upon them. I like to
    think of it as a command-handling subsystem, for which the Terminal acts as as
    a graphical frontend.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# What Is a Plan?


    I also mentioned that the results I had no plan, so you may also be wondering
    what that is all about. A .plan file is a small file kept in your home folder
    that other users see when they use the finger command on. Traditionally, a .plan
    file contained information about where you were going to or what you were working
    on. These days, however, most people use them to leave odd little messages, quotations,
    or whatever, as they do in email signatures. Take a look at Figure 9-4 to see
    what happens after I add a .plan file to my home folder.


    ![](img/add8efd602aad9815ee8abf27a7a293e_191_0.png)


    **Figure 9-4:** Output from the finger command with a plan


    You can now see my plan, which is a quotation from Kurt Vonnegut *The Sirens of
    Titan* (or Al Stewart''s song by the same name, for that matter), though you can
    put anything you want in your own. You will get the chance to create your own
    plan file in Project 9A, so if all this seems to you, just hang in.


    Before moving on, I should mention that you can also use the finger command to
    do a little domestic espionage of sorts. Let''s say your, Chris, has a user account
    on your machine. Chris, who wants your permission to go to the movies, claims
    to have worked hard on the computer all day writing a report for school. Having
    your doubts, you could type finger to see what the facts actually are. It may
    be a bit underhanded and rotten, but it works. It works both ways; others can
    check on you as well. You can try it by seeing it the last time you logged into
    your graphika account (assuming you created such an account in Chapter 8). Just
    type finger graphika, and then press ENTER.


    You can even use the finger command to find out facts about people on other systems,
    providing their network''s service is active and you know their email address.
    Typing something like `finger username@hostname.com` would be the trick. It''s
    kind of cool but also kind of spooky, I suppose.'
  merge: -1
