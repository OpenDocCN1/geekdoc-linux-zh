  md: '# Finishing Touches


    Well, things are certainly sort Mac-ish, but there is even more we can do to emphasize
    the effect. Open the Panel Properties for your bottom panel by right-clicking
    a blank area of the panel and selecting Properties in the pop-up window. In the
    General tab of that window, unchecked Expand, and then increase the size of the
    panel to about 54 pixels. When you''re done, click Close, and then start launchers
    for the applications you use most. You might also want to remove the Workspace
    Switcher and the Window List to complete the effect. Right-click the dotted or
    immediately to the left of where the names of currently open windows are displayed
    and choose Remove From Panel to get rid of the set of four boxes on the bottom
    panel and choose Remove From Panel to remove the Workspace Switcher.


    NOTE If you''d like a more OS X-ish Dock, plenty are available; try Avant Window
    Navigator, Cairo Dock, or Dock, all of which are available via the Ubuntu Software
    Center. You must have Visual Effects turned on (that is, to Normal or Extra) on
    the Visual Effects of the Appearance Preferences in order to use these.


    Once you''re done, go to the top menu, and remove the icons to the System menu.
    After that, add a Window Selector app so that you have some way to navigate through
    your windows. You might also want to change the background in your home folder,
    since the warm tones no longer match your new cooler configuration.


    The transformation is now complete, but you can also add trash and computer icons
    to your desktop by going on to Project 8B-10, after which your desktop should
    look like mine back in Figure 8-13. You can stick with your new OS X-ish theme
    or switch to something else. For consistency''s sake, I will switch back to the
    default theme now. By the way, if you decide to keep the faux Aqua theme, remember
    to click the Save As button in the Appearance Preferences and give it the name.


    # 8B-9: Changing the Order of the Window Buttons


    If you''re used to Windows, you might be finding the order of the buttons at the
    tops of windows a little ... weird. Instead of having your minimize, maximize,
    and close buttons at the top right of window, Ubuntu puts them at the top left.
    I don''t mind this layout so much, but if you''re struggling with it, you''ll
    be glad to know it''s easy to change them to the


    +   1. Press Alt-F2 to open the Run Application window.


    +   2. Run the GNOME Configuration Editor by typing gconf-editor in that window
    and then pressing ENTER.


    +   3. When the Configuration Editor appears, click the small + next to apps,
    scroll down to metacity, and click the + next to that.


    +   4. Click general in that expanded metacity section to display a set of options.'
