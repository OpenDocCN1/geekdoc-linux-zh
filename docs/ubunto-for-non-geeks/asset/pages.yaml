    # Problems with the Display and Graphics Cards


    Recently Ubuntu has been doing an excellent job of detecting graphics cards, so
    it''s unlikely that you''ll ever be left staring at a blank screen. Things aren''t
    guaranteed to turn out perfect; this section covers problems such as 3D acceleration
    support (if it''s missing) and adjusting your screen resolution (if it''s weird).
    Just in case, there''s something to help you with a deadland blank screen.


    # Games/Compiz Don''t Work: Installing Accelerated Graphics Drivers


    If you can''t Compiz or a certain game to work, you might need to install some
    accelerated drivers. This is because only basic drivers (which can handle fancy
    effects and 3D games) are installed for some graphics cards by default, due to
    the lack of availability of suitable open source alternatives. If accelerated
    drivers exist for your card, you can install the more powerful (but possibly less
    open) drivers by selecting System > Administration > Hardware Drivers, selecting
    the graphics driver from the list, and clicking Activate to install it. Once it''s
    installed, restart the computer, and the new driver will be enabled.


    You can directly download Linux graphics drivers from some manufacturers. These
    tend to be updated more regularly than the ones that come with Ubuntu, and they
    may have some extra features too. The next couple of sections cover how to get
    these drivers for the two biggest manufacturers, ATI and nVIDIA.


