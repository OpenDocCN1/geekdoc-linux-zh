    # Adding Keyboard Layouts


    If you often type in a particular foreign language, it might be more convenient
    to add a new keyboard layout for the language or languages you use. For example,
    if you often type in Swedish and then use the characters ä, å and ö regularly,
    using the appropriate keyboard layout would be easier than repeatedly using the
    Character Map. It is even more true if you type in Greek, Russian, Serbian, Georgian,
    or any other language that uses a completely different alphabet. Of course, you
    will have to familiarize yourself with the keyboard layout, or keymap, for each
    language you choose, but this is a relatively easy task.


    To add foreign keyboard layouts to your system''s repertoire, here''s all you
    need to do:


    +   1. Select System > Preferences > Keyboard.

    2. In the Keyboard Preferences window, click the Layouts tab.

    3. Once in the Layouts tab, click the Add button.

    4. In the Choose Layout window that then appears, select the keyboard layout you
    want to add, and when done, click Add (Figure 11-4).

    5. Repeat Steps 3–4 to add other layouts (up to a maximum of four layouts).

    6. When done, your window should look something like Figure 11-5 but with slightly
    different keyboard layout selections. Click Close to complete the process.


    ![](img/add8efd602aad9815ee8abf27a7a293e_246_0.png)


    Figure 11-4: Selecting and viewing foreign-language keymaps


