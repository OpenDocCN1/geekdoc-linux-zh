  md: '# GNU make


    -l 2.5


    will not let make start more than job if the load average is above 2.5. The ''-l''
    option with no following number removes the load limit, if one was given with
    a previous ''-l'' option.


    More precisely, when make goes to start up a job, and it already has at least
    one job running, it checks the current load average; if it is not lower than the
    limit with ''-l'', make waits until the load average goes below that limit, or
    until all the other jobs finish.


    By default, there is no load limit.


    # 5.5 Errors in Recipes


    After each invocation returns, make looks at its exit status. If the shell completed
    successfully (the exit status is zero), the next line in the recipe is executed
    in a new shell; after the last line in the recipe is finished.


    If there is an error (the exit status is nonzero), make gives up on the current
    run, and perhaps on all rules.


    Sometimes the failure of a certain recipe line does not indicate a problem. For
    example, you may use the mkdir command to ensure that a directory exists. If the
    directory already exists, mkdir will report an error, but you probably want make
    to continue regardless.


    To ignore errors in a recipe line, write ''-l'' at the beginning of the line''s
    text (after the initial tab). The ''-l'' is discarded before the line is passed
    to the shell for execution. For example,


    clean:


    ```

    -rm -f *.

    ```


    This causes make to continue if rm is unable to remove a file.\When you run make
    with the ''-l'' or ''--ignore-errors'' flag, errors are ignored in all recipes
    of all rules. A rule in the Makefile for the special target .IGNORE has the same
    effect, if there are no prerequisites. Ways of ignoring errors are obsolete because
    ''-l'' is flexible.


    When errors are to be ignored, by either ''-l'' or the ''-i'' flag, make treats
    an error return just like success, except that it tells you the status the shell
    exited, and says that the error has been ignored.


    When an error happens that make has not been told to ignore, it implies that the
    current target cannot be corrected, and neither any other that depends on it directly
    or indirectly. If no recipes will be executed for these targets, since their preconditions
    have not been achieved.


    Normally make gives up immediately in this circumstance, returning a nonzero status.
    However, if the ''-k'' or ''--keep-going'' flag is specified, make continues to
    consider the other prerequisites of the pending targets, making them necessary,
    before it gives up and returns nonzero status. For example, after an error in
