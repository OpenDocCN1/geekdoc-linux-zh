  md: "# An Introduction to Makefiles\n\nYou need a file called a makefile to tell\
    \ make what to do. Most often, the makefile tells how to compile and link a program.\n\
    \nIn this chapter, we will discuss a simple makefile that describes how to compile\
    \ and link a text editor with C source files and three header files. The makefile\
    \ can also tell how to run miscellaneous commands when explicitly asked (for example,\
    \ to remove files as a clean-operation). To see a more complex example of a makefile,\
    \ see Appendix C [Complex Makefile], page 157.\n\nWhen make recompiles the editor,\
    \ each changed C source file must be recompiled. If a header file has changed,\
    \ each C source file that includes the header file must be recompiled to be safe.\
    \ Each compilation produces an object file corresponding to the source file. Finally,\
    \ if any source file has been recompiled, all the object files, whether newly\
    \ made or saved from previous compilations, will be linked to produce the new\
    \ executable editor.\n\n# What a Rule Looks\n\nA simple makefile consists of “rules”\
    \ with the following shape:\n\n```\ntarget : prerequisites ...\n    recipe\n```\n\
    \nA target is the name of a file that is generated by a program; examples of targets\
    \ are executable or object files. A target can also be the name of an action to\
    \ carry out, such as ‘clean’ (see Section 4.5 [Phony Targets], page 29).\n\nA\
    \ prerequisite is a file that is used to create the target. A target often depends\
    \ on several files.\n\nA recipe is an action that make carries out. A recipe may\
    \ have more than one command, either on the same line or on its own line. Please\
    \ note: you need to put a tab character at the beginning of every recipe line!\
    \ This is an offset catches the unwanted. If you prefer to indent recipes with\
    \ a character other than tab, you can set the RECPREFIX variable to an alternate\
    \ character (see Section 6.14 [Special Variables], page 70).\n\nUsually a rule\
    \ is in prerequisites and serves to create a target if any of the prerequisites\
    \ change. However, the rule that specifies a recipe for the target need not have\
    \ prerequisites. For example, the rule containing the delete command associated\
    \ with the target ‘clean’ does not have prerequisites.\n\nA rule, then, explains\
    \ how and when to remake certain files which are the targets of the particular\
    \ rule. make carries out the recipe on the prerequisites to create or update the\
    \ target. A rule can also explain how and when to carry out an action. See Chapter\
    \ 4 [Writing Rules], page 21.\n\nA makefile may contain other text besides rules,\
    \ but a simple makefile need only contain rules. Rules may look somewhat more\
    \ complicated than shown in this template, but all fit the pattern or less."
  merge: -1
  pgno: 12
- img_proc: true
  md: "# 2.2 A Simple Makefile\n\nHere is a straightforwardmakefile that describes\
    \ the way an executable file called edit depends on object file files which, in\
    \ turn, depend on each C source and three header files.\n\nIn this example, all\
    \ the C files include `defs.h`, but only defining editing commands include `command.h`,\
    \ and only low level files that the editor buffer includes `buffer.h`.\n\n```\n\
    main.o : main.c defs.h\ncc - main.c\nkbd.o : kbd.c defs.h command.h\ncc - kbd.c\n\
    command.o : command.c defs.h command.h\ncc - command.c\ndisplay.o : display.c\
    \ defs.h buffer.h\ncc - display.c\ninsert.o : insert.c defs.h buffer.h\ncc - insert.c\n\
    search.o : search.c defs.h buffer.h\ncc - search.c\nfiles.o : files.c defs.h buffer.h\n\
    cc - files.c\nutils.o : utils.c defs.h\ncc - utils.c\nclean:\nrm edit main.o kbd.o\
    \ command.o display.o \\\n    insert.o search.o files utils.o\n```\n\nWe split\
    \ each line into two lines using backslash-newline; this is like one long line,\
    \ but is easier to read.\n\nTo use this makefile to create the executable file\
    \ 'edit', type:\n\n```\nmake\nmake clean\n```\n\nTo use this makefile to delete\
    \ the executable file and all the object files from the directory, type:\n\nIn\
    \ the example, the targets include the executable file 'edit', and the object\
    \ files 'main.o' and 'kbd.o'. The prerequisites are files such as 'main.c' and\
    \ 'defs.h'. In fact, each '.o' is both a target and a prerequisite. Recipe includes\
    \ '-cc main.c' and '-cc kbd.c'.\n\nWhen a target is a file, it needs to be recompiled\
    \ or relinked if any of its prerequisites change. In addition, any prerequisites\
    \ that are themselves automatically generated should be updated. In this example,\
    \ 'edit' depends on each of the object files; the object file 'main.o' depends\
    \ on the source file 'main.c' and on the header file 'defs.h'."
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Chapter 2: An Introduction to Makefiles


    A recipe may follow each line that contains a target and a prerequisites. These
    recipes say how to update the target file. A tab character (or whatever character
    is specified by the .RECIPEPREFIX variable; see Section 6.14 [Special Variables],
    page 70) must come at the beginning of every line in make to distinguish recipes
    from other lines in themakefile. (Bear in mind that make does not know anything
    about how the recipes work. It is up to you to supply recipes that update the
    target file. All make executes the recipe you specified when the target file needs
    to be updated.)


    The ''clean'' is not a recipe, but merely the name of an action. Since you normally
    do not want to carry out the actions in this rule, ''clean'' is not a prerequisite
    of any other rule. Consequently, make never does unless you tell it specifically.
    That rule does not have any prerequisites, so the only purpose of the rule is
    to run the specified recipe. Targets that do not refer to files but just actions
    are phony targets. See Section 4.5 [Phony Targets], page 29, for information about
    this kind of target. See Section 5.5 [Errors in Recipes], page 48, to see how
    to make to ignore errors from rm or any other command.


    # 2.3 How make Processes a Makefile


    By default, make starts with the first target (not targets whose name start with
    ''.''). This is the default goal. (Goals are the target that strives ultimately
    to update.) You can override this behavior using the command line (see Section
    9.2 [Arguments to make [Goals], page 93) or with the .DEFAULT_GOAL special variable
    (see Section 6.14 [Other Special Variables]),


    In the simple example of the previous section, the default goal is to update the
    executable ''edit''; therefore, we put that line first.


    ```

    make

    ```


    make reads themakefile in the current directory and begins by processing the first
    rule. In the example, this rule is for relinking ''edit''; but before make can
    fully process this rule, it must process the files that ''edit'' depends on, in
    which this is the case the object files. Each of these files is processed according
    to its own rule. These rules say to update each ''.c'' file by compiling its source
    file. The recompilation must be done if the source, or any of the header files
    named as prerequisites, is more recent than the object file, or if the object
    file does not exist.


    The other rules are processed because their targets appear as prerequisites of
    the goal. If some other rule is not depended on the goal (or it depends on, etc.),
    that rule is not processed, unless you tell make to do so (with a command as make
    clean).


    Before recompiling an object file, make considers updating its पड़ेगा, the source
    file and header files. This make does not specify anything to be done for them—the
    ''.c'' and ''.h'' files are not the targets of any rule—so make does nothing for
    these files. But make would update generated C programs, as those made by Bison
    or Yacc, with their own rules at this time.


    After recompiling whichever object file needs it, make decides whether to relent
    ''edit''. This must be done if the file ''edit'' does not exist, or if any of
    the object files are newer than it. If an object file was just recompiled, it
    is no newer than ''edit'', so ''edit'' is relinked.'
  merge: -1
  pgno: 14
- img_proc: true
  md: "Thus, if we change the 'insert.c' and run make, make will compile that file\
    \ to update\n'insert.o', and then link 'edit'. If we change the file 'command.h'\
    \ and run make, make will\nrecompile the object files 'kbd.o', 'command.o' and\
    \ 'files.o' and then link the file 'edit'.\n\n# 2.4 Variables Make Makefiles Simpler\n\
    \nIn our example, we will have to list all the objects in the rule for 'edit'\
    \ (repeated here):\n\n```\nedit : main.o kbd.o command.o display.o \\\\\n\tinsert.o\
    \ search.o files.o display.o \\\\\n\tcc -o edit main.o kbd.o command.o files.o\
    \ utils.o \\\n\tinsert.o search.o files.o utils.o\n```\n\nSuch duplication is\
    \ error-prone: if a new object file is added to the system, we might\nadd it to\
    \ one list and forget the other. We can eliminate the risk and simplify the makefile\n\
    by using a variable. Variables allow a text string to be defined once and substituted\
