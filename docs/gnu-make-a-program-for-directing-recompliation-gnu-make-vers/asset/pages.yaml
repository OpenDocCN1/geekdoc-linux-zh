  md: "# 7 Conditional Parts of Makefiles\n\nA conditional directive causes part of\
    \ a makefile to be obeyed or ignored depending on the values of variables. Conditionals\
    \ compare one variable to another, or the value of a variable to a constant string.\
    \ Conditionals control what make actually “sees” in the makefile, so they cannot\
    \ be used to control recipes at the time of execution.\n\n# 7.1 Example of a Conditional\n\
    \nThe following example of a conditional tells make to use one of libraries if\
    \ the CC variable is 'gcc', and a different set of libraries otherwise. It works\
    \ by controlling which of two recipes will be used for the rule. The result is\
    \ that CC=gcc as an argument to make changes not only compiler is used but also\
    \ are linked.\n\n```\nlibs_for_gcc = -lgnu\nnormal_libs =\nfoo:$(objects)\nifeq\
    \ ($(CC),gcc)\n  $(CC) -o $(objects) $(libs_for_gcc)\nelse\n  $(CC) -o $(objects)\
    \ $(normal_libs)\nendif\n```\n\nThis conditional uses three directives: one ifeq,\
    \ one else and one endif.\nTheq contains two arguments, separated by a comma and\
    \ surrounded by parentheses. Variable substitution is performed on both arguments\
    \ and then they are compared. The lines of the makefile following the ifeq are\
    \ obeyed if the two arguments match; otherwise they are ignored.\n\nThe else directive\
    \ causes the following lines to be obeyed if the first conditional failed. In\
    \ the example above, this means that the second alternative linking command is\
    \ used whenever the first alternative is not used. It is optional to have an else\
    \ in a conditional.\nThe endif ends the conditional. Every conditional must end\
    \ with an endif. Unconditional makefile text.\nAs example illustrates, conditionals\
    \ work at the textual level: the lines of the conditional are treated as part\
    \ of the makefile, or ignored, according to the condition. This is why the syntactic\
    \ units of makefile, as rules, may cross the beginning or the end of the conditional.\n\
    When the variable CC has the value 'gcc', the above example has this effect:\n\
    \n```\nfoo:$(objects)\n  $(CC) -o $(objects) $(libs_for_gcc)\n```\n\nWhen the\
    \ variable CC has any other value, the effect is this:\n\n```\nfoo:$(objects)\n\
    \  $(CC) -o $(objects) $(normal_libs)\n```\n\nEquivalent results can be obtained\
    \ in another way by conditionalizing a variable assignment and then using the\
