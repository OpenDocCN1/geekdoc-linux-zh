  md: '# Chapter 14: Makefile Conventions


    prefix


    A prefix used in constructing the default values of the variables listed below.

    The default value of **prefix** should be `/usr/local`. When building the GNU
    system, the prefix will be empty and `/usr` will be a symbolic link to `/`. (If
    you are using Autoconf, write it as `@prefix@`).


    Running `make install` with a different value of **prefix** from the one used
    to build the program *not* recompile the program.


    exec_prefix


    A prefix used in constructing the default values of some of the variables listed
    below. The default value of **exec_prefix** should be `$(prefix)`. (If you are
    using Autoconf, write it as `@exec_prefix@`).


    Generally, `$(exec_prefix)` is for directories that contain machine-specific files
    (such as executables and subroutine libraries), while `$(prefix)` is used directly
    for other directories.


    Running `make install` with a different value of **exec_prefix** from the one
    used to build the program will not recompile the program.


    Executable programs are installed in one of the following directories.


    bindir


    The directory for installing executable programs that you can run. This should
    normally be `/usr/local/bin`, but it as `$(exec_prefix)/bin`. (If you are using
    Autoconf, write it as `@bindir@`).


    sbindir


    The directory for installing executable programs that can be run from the shell,
    but are generally only to system administrators. This should normally be `/usr/local/sbin`,
    but it as `$(exec_prefix)/sbin`. (If you are using Autoconf, write it as `@sbindir@`).


    libexecdir


    The directory for installing executable programs to be run by other programs rather
    than by users. This directory should normally be `/usr/local/libexec`, but it
    as `$(exec_prefix)/libexec`. (If you are using Autoconf, write it as `@libexecdir@`).


    The definition of `libexecdir` is the same for all packages, so you should install
    your data in a subdirectories. Most packages install their data under `$(libexecdir)/package-name/`,
    possibly within additional subdirectories, there as `$(libexecdir)/package-name/machine/version/`.


    Data files used by the program during execution are divided into two categories
    in


    ways.


    +   - Some files are normally used by programs; others may be normally modified
    (users might need some edit of these).


    +   - Some files are architecture-independent and can be shared by all machines
    at a site; some are architecture-dependent and can be shared only by machines
    of the same kind and operating system; others may never be shared between two
    machines.


    This makes for six different possibilities. However, we want to discourage the
    use of architecture-dependent files, aside from object files and libraries. It
    is much cleaner to make other data files architecture-independent, and it is generally
    not hard.'
