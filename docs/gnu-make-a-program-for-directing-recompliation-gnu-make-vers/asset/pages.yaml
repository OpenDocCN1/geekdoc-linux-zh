  md: '# Chapter 6: How to Use Variables


    sets ''bar'' to ''a.c b.c c.c''.


    # 6.3.2 Computed Variable Names


    Computed variables are a complicated concept needed only for sophisticated makefile
    programming. For most purposes you need not consider them, except to know that
    making a variable with a dollar sign in its name have strange results. However,
    if you are the type that wants to understand everything, or you are actually interested
    in what they do, read on.


    Variables may be referenced inside the name of a variable. This is called a computed
    variable name or a nested reference. For example,


    ```

    x = y

    z = z

    a := $($(x))

    ```


    defines as z'': the ''$(x)'' expands to ''y'', so ''$($(x))'' expands to ''$($(y)''
    in turn expands to ''z''. The name of the variable to reference is not stated
    explicitly; it is computed by expansion of ''$($(x)''. The reference ''$($(x)''
    is here nested within the outer variable reference.


    The previous example shows two levels of nesting, but any number of levels is
    possible. For example, here are three levels:


    ```

    x = y

    z = z

    z = u

    a := $($(x))

    ```


    Here the innermost ''$($(x)'' expands to ''y'', so ''$($(x))'' expands to ''$($(y)''
    in turn expands to ''z'', which becomes ''u''.


    References to recursively-expanded variables within a variable name are reexpanded
    in the usual fashion. For:


    ```

    x = $(y)

    z = y

    z = Hello

    a := $($(x))

    ```


    defines as ''Hello'': ''$($(x))'' becomes ''$($(y))'' which becomes ''$(z)'' which
    becomes ''Hello''.


    Nested variables can also contain modified references and function invocations
    (see Chapter 8 [Functions for Transforming Text], page 79), just like any other
    reference. For example, using the subst function (see Section 8.2 Functions for
    String Substitution and Analysis), page 80:


    ```

    x = variable1

    variable2 := Hello

    y = $(subst 1,2,$x)

    z = y

    a := $($(x))

    ```


    eventually defines a as ''Hello''. It is doubtful that anyone would ever want
    to write a nested reference as convoluted as this, but it works: ''$($(z))'' expands
    to ''$($(y))'' which'
