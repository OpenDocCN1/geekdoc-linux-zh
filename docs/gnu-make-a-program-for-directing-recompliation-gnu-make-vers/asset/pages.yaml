- img_proc: true
  md: '# 6 How to Use Variables


    A variable is a name defined in a makefile to represent a string of text, called
    the variable''s value. These values are substituted by explicit request into targets,
    prerequisites, recipes, and other parts of the makefile. (In some versions of
    make, variables are called macros.)


    Variables and functions in all parts of a makefile are expanded when read, except
    in recipes, the right-hand side of variable definitions using ''='', and the bodies
    of variable definitions using the define directive.


    Variables can represent list of file names, options to pass to compilers, programs
    to run, directories to look in source files to write output in, or anything else
    you can imagine.


    A variable name may be any sequence of characters not containing '':'', ''#'',
    ''='', or trailing whitespace. However, names containing characters other than
    letters, numbers, and underscores should be avoided, as they may have special
    meanings in the future, and with most shells they cannot be passed through the
    environment to a sub-make (see Section 5.7.2 [Communicating Variables to a Sub-make],
    page 50).


    Variable names are case-sensitive. Names ''foo'', ''FOO'', and ''Foo'' all refer
    to different variables.


    It is traditional to use upper case letters in variable names, but we recommend
    using lower case variables for names that serve internal purposes in the makefile,
    and reserving upper case for parameters that control implicit rules or for parameters
    that the user should override with command options (see Section 9.5 [Overriding
    Variables], page 97).


    A few variables have names that have a single punctuation character or just a
    few characters. These are the automatic variables, and they have particular specialized
    uses. See Section 10.5.3 [Automatic Variables], page 112.


    # 6.1 Basics of Variable References


    To substitute a variable''s value, write a dollar sign followed by the name of
    the variable in parentheses or both: ''$(foo)'' or ''$(foo'' is a valid reference
    to the variable foo. This special significance of ''$'' is what you must write
    $$'' to have the effect of a dollar sign in a file or recipe.


    Variable references can be used in any context: targets, prerequisites, most directives,
    and new variable values. Here is an example of a common case, where a variable
    holds the names of all object files in a program:


    ```

    objects = program.foo utils.o

    program : $(objects)

    cc -defs $(objects)

    ```


    Variable references work by strict substitution. Thus, the rule


    ```

    foo = c

    prog.o : prog.$(foo)

    $(foo)$(foo) -$(foo) prog.$(foo)

    ```'
  merge: -1
  pgno: 66
