  md: '# Chapter 5: Writing Recipes in Rules


    To use the canned sequence, substitute the variable into the recipe of a rule.
    You can substitute it like any variable (see Section 6.1 [Basics of Variable References],
    page 57). Because variables defined by define are recursively expanded, all the
    variable you reference inside the define are expanded now. For example:


    ```

    foo : foo.y

    $(run-yacc)

    ```


    ''foo'' will be substituted for the variable ''$'' when it occurs in run-yacc''s
    value, and ''foo.c'' for ''$$''.


    This is a realistic example, but particular one is not needed in practice make
    has an implicit rule figure out these commands based on the file names involved
    (see Chapter 10 [Using Implicit Rules], page 103).


    In recipe execution, each line of a canned sequence is treated just as if the
    line appeared on its rule, the recipe provided by a tab. In particular, make invokes
    a separate subshell for each line. You can use the special characters that affect
    command lines ''$'', ''-'', and ''+'' on each line of a canned sequence. See Chapter
    5 [Writing Recipes in Rules], page 41. For example, using this canned sequence:


    ```

    define frob =

    @echo frobnicating target $$

    frob-step-1 $< -o $step-1

    frob-step-2 $$-step-1 -o $$

    endf

    ```


    make will not execute the first line, the command. But it will execute the following
    two recipe lines.


    On the other hand, prefix characters on the recipe line that refers to a canned
    sequence apply to every line in the sequence. So the rule:


    ```

    frob.out: frob.in

    $(frobnicate)

    ```


    does not echo any recipe lines. (See Section 5.2 [Recipe Echoing], page 43, for
    a full explanation of ''$$'').


    # 5.9 Using Empty Recipes


    It is sometimes useful to define recipes that do nothing. This is done simply
    by giving a recipe that contains nothing but whitespace. For example:


    ```

    target:

    ```


    defines an empty recipe for ''target''. You could also use a line with a recipe
    prefix character to define an empty recipe, but this would be confusing because
    a line looks empty.


    You may be wondering why you would want to define a recipe that does nothing.
    The only reason this is useful is to prevent from getting implicit rules (from
    implicit rules or the .DEFAULT special target; see Chapter 10 [Implicit Rules],
    page 103 and Section 10.6 [Defining Last-Resort Defaults], page 117).


    You may be inclined to define empty recipes for targets that are not actual files,
    which only exist so that prerequisites can be remade. However, this is not the
    best way to'
