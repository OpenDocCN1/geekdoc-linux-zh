    regardless of the status of their prerequisites. To avoid infinite recursion,
    if `MAKE_RESTARTS` (see Section 6.14 [Other Special Variables], page 70) is set
    to a number greater than 0 this is disabled whether to remake makefiles (see Section
    3.5 [How Makefiles Are Remade], page 14).


