  md: '# 10 Using Implicit Rules


    Certain standard ways of remaking target are used very often. For example, one
    customary way to make an object file from a C source file using the compiler,
    cc.


    Implicit rules tell how to use customary techniques so that you do not have to
    specify them when you want to use them. For example, there is an implicit rule
    for C compilation. Compilation typically takes a ''.c'' file and makes a ''.o''
    file. So make applies the implicit rule for C compilation when it sees this combination
    of file names.


    A chain of implicit rules can run in sequence: make will remake a ''.o'' file
    from a ''.y'' file. See Section 10.4 [Chains of Implicit Rules], page 109.


    The built-in implicit rules use several variables in their recipes so that, by
    changing the variables, you can change the implicit rule works. For example, the
    variable CFLAGS flags given to the C compiler by the implicit rule for C compilation.
    See Section 10.3 [Variables Used by Implicit Rules], page 107.


    You can define your implicit rules by writing pattern rules. See Section 10.5
    [Defining and Redefining Rules], page 110.


    Suffix rules are a limited way to define implicit rules. Pattern rules are more
    general and clearer, but suffix rules are retained for compatibility. See Section
    10.7 [Old-Fashioned Suffix Rules], page 117.


    # 10.1 Using Implicit Rules


    To make to find a customary method for updating a target file, all you have to
    do is refrain from specifying recipes yourself. Either write a rule with no recipe,
    or write a rule at all. Then make will figure out which rule to use based on which
    kind of source files it can find.


    For example, the javafx looks like this:


    ```

    foo: bar.o

    cc -c foo.o bar.o $(CFLAGS)

    ```


    Because you mention ''foo.o'' but do not give a rule for it, make will automatically
    look for an implicit rule that tells you how to update it. This happens whether
    or not the file ''foo.o'' currently exists.


    If an implicit rule is found, it can supply both a recipe and one prerequisites
    (the source files). If you need to specify additional prerequisites, such as header
    files, the implicit rule cannot supply.


    Each implicit rule has a target pattern pattern. There may be many implicit rules
    with the same pattern. For example, numerous rules make ''.o'' files: one from
    a ''.c'' file with the C compiler; another, a ''.p'' file with the Pascal compiler;
    and so on. The rule that actually applies is the one whose prerequisites exist
    or can be made. So, if you have a file ''foo.c'', make will run the C compiler;
    otherwise, if you have a ''foo.p'', make will run the Pascal compiler; and so
    on.


    Of course, when you write the Makefile, which implicit rule you want to use, and
    you know it will choose that one because you know which possible prerequisite'
  merge: -1
