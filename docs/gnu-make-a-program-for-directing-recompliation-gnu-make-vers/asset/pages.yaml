    # 6.2 The Two Flavors of Variables


    There are two ways that a variable in GNU make have a value; we call the two flavors
    of variables. The two flavors are distinguished in how they are defined and in
    when they are expanded.


    The first flavor of variable is a recursively expanded variable. Variables of
    this sort are defined by lines using (see Section 6.5 [Setting Variables], page
    63) or by the define directive (see Section 6.8 [Defining Multi-Line Variables],
    page 66). The value you specify is installed verbatim; if it contains references
    to other variables, these references are expanded whenever this is substituted
    (in the case of expanding some other string). When this happens, it is called
    recursive expansion.


    For example:


    ```

    foo = $(bar)

    bar = $(ugh)

    ugh = Huh?

    ```


    will echo ''Huh?'' ''${foo}'' expands to ''${bar}'' which expands to ''${ugh}''
    which finally expands to ''Huh?''.


    This flavor of variable is the only sort supported by other versions of make.
    It has its advantages and disadvantages. An advantage (most would say) is that:


    ```

    CFLAGS = $(include_dir) -O0

    include_dir = -Ibar

    ```


    will be used when ''CFLAGS'' is expanded in a recipe, it will then expand to ''-Ifoo-Ibar
    -O0''. A major disadvantage is that you cannot append something on the end of
    a variable, as in


    ```

    CFLAGS = $(CFLAGS) -O0

    ```


    because it will cause an infinite loop in the variable expansion. (Actually make
    detects the infinite loop and reports an error).


    Another disadvantage is that any functions (see Chapter 8 [Functions for Transforming
    Text], page 79) referenced in the definition will be executed every time the variable
    is expanded. This makes make run slower; worse, it causes the wildcard and shell
    functions to give unpredictable results because you cannot easily control when
    they are called, or how many times.


    To avoid all the problems and inconveniences of recursively expanded variables,
    there is another flavor: simply expanded variables.'
