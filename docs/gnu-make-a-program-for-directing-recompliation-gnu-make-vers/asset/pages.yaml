  md: '# Appendix C Complex Makefile Example


    Here is the makefile for the GNU tar program. This is a moderately complex makefile.


    Because it is the first target, the default goal is ''all''. An interesting feature
    of this makefile is that ''testpad.h'' is a source file automatically generated
    by the testpad program, itself compiled from ''testpad.c''.


    If you type ''make'' or ''make all'', then make creates the ''tar'' executable,
    ''rmt'' daemon that provides remote access, and the ''tar.info'' Info file.


    If you type ''install'', then make not only creates ''tar'', ''rmt'', and ''tar.info'',
    but also installs them.


    If you make ''clean'', then make removes the ''.o'' files, and the ''tar'', ''rmt'',
    ''testpad'', ''testpad.h'', and ''core'' files.


    If you make ''distclean'', then make not only removes the same files as ''make
    clean'' but also the ''TAGS'', ''Makefile'', and ''config.status'' files. (Although
    it is not evident, this makefile and ''config.status'') is generated by the user
    with the configure program, which is provided in the tar distribution, but is
    not shown here.)


    If you make ''realclean'', then make removes the same files as ''make distclean''
    and removes the Info files generated from ''tar.texinfo''.


    In addition, there are shar and dist that create distribution kits.


    ```

    # Generated automatically from Makefile.in by configure.

    # Unx Makefile for GNU tar program.

    # Copyright (C) 1991 Free Software Foundation, Inc.

    ```


    ```

    # This program is free software; you can redistribute

    # it and/or modify it under the terms of the GNU

    # General Public License

    ...


    ```


    ```

    SHELL = /bin/sh


    #### Start of system configuration section. ####


