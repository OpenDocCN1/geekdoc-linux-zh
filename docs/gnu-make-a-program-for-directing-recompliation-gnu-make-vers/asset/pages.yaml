    # 4.5 Phone Targets


    A phone target is one that is not really the name of a file; rather it is just
    a name for a recipe to be executed when you make an explicit request. There are
    two reasons to use a phone target: to avoid a conflict with a file of the same
    name, and to improve performance.


    If you write a rule whose recipe will not create the target file, the recipe will
    be executed every time the target comes up for remaking. Here is an example:


    ```

    clean

    rm *.o temp

    ```


    Because the rm command does not create a file named ''clean'', probably no such
    file will ever exist. Therefore, the rm command will be executed every time you
    say ''clean''.


    The phone target will cause to work if anything else creates a file named ''clean''
    in this directory. The file ''clean'' would inevitably be considered up to date,
    and its recipe would not be executed. To avoid this problem, you can explicitly
    declare the target to be phone, using the special target .PHONY (see Section 4.8
    [Built-in Target Names], page 32) as follows:


    ```

    .PHONY : clean

    ```


    Once this is done, ''clean'' will run the recipe regardless of whether there is
    a file ''clean''.


    Since it knows that phone targets do not name actual files that could be remade
    from other files, make skips the implicit rule search for phone targets (Chapter
