    three

    ```


    # 5.2 Echoing


    Normally make prints each line of the recipe before it is executed. We call this
    echoing because it gives the appearance that you are typing the lines yourself.
    The ''$'' is discarded before the line is passed to the shell.


    When a line starts with ''$'', the echoing of that line is suppressed. Typically
    you would use this for a command whose only effect is to print something, such
    as an echo command to indicate progress through the Makefile:


    ```

    @echo About making distribution files

    ```


    When make is given the flag ''-n'' or ''--just-print'' it echoes most recipes,
    without executing them. See Section 9.7 [Summary of Options], page 98. In this
    case even the recipe lines starting with ''$'' are printed. This is useful for
    finding out which recipes make are necessary without actually doing them.'
