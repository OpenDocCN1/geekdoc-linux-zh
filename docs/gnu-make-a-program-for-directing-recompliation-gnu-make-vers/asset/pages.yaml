    # 6.3 Advanced Features for Variables


    This section describes some advanced features you can use to reference variables
    in more

    flexible ways.


    # 6.3.1 Substitution References


    A substitution reference substitutes the value of a variable with alterations
    that you specify.

    It has the form ''$(var:a=b)'' (or ''${var:a:=b}'') and its meaning is to take
    the value of

    var var, replace a at the end of a word with b in that, and substitute

    the resulting.


    When we say "at the end of the word", we mean that a must appear followed by

    whitespace or at the end of the order to be replaced; other occurrences of a in
    the

    variable are unaltered. For example:


    ```

    foo := a.o b.o c.o

    bar := $(foo:.%c)

