    RCS

    Any ''n'' is extracted from an RCS file named ''n.v'' or ''RCS/n.v''. The recipe
    used is ''$(CD) $(COFLAGS). ''n'' will not be extracted from RCS if it already
    exists, even the RCS file is newer. The rules for RCS are terminal (see Section
    10.5.5 [Match-Anything Pattern Rules], page 115), so RCS files cannot be generated
    from another source; they must actually exist.


    SCCS

    Any ''n'' is extracted from an SCCS file named ''n.s'' or ''SCCS/s.n''. The recipe
    used is ''$(GET) $(GFLAGS). The rules for SCCS are terminal (see Section 10.5.5
    [Match-Anything Pattern Rules], page 115), so SCCS files cannot be generated from
    another source; they must actually exist.


    For the benefit of SCCS, a ''n'' is copied from ''n.sh'' and made executable (everyone).
    This is for shell scripts that are checked in SCCS. Since RCS preserves the execution
    permission of a file, you do not need to use this feature for RCS.


    We recommend that you avoid using SCCS. RCS is widely held to be superior, and
    is also free. By choosing free software in place of (or inferior) proprietary
    software, you support the free software.


    Usually you want to change only the variables listed in the table above, which
    are documented in the following section.


    However, the recipes in built-in implicit rules use variables such as COMPILE.c,
    LINK.p, and PREPROCESS.S, whose values contain the variables above.


    make follows the convention that to compile a ''.x'' source file uses the variable
    COMPILE.x. Similarly, to produce an executable from a ''.x'' file use LINK.x;
    and the rule to preprocess a ''.x'' file uses PREPROCESS.x.


    Every rule that produces an object file uses the variable OUTPUT_OPTION defines
    this variable either to contain ''-o $'' or be empty, depending on a compilation-time.
    Use the ''-o'' option to ensure that the output goes into the right file when
    the source file is in a different directory, using PATH (see Section 4.4 [Directory
    Search], page 25). However, compilers on some systems do not accept ''-o'' switch
    for object files. If you use a system, and use PATH, some compilations will put
    their output in the wrong place. A possible workaround for this problem is to
    give OUTPUT_OPTION the value `mv $* $o`.


