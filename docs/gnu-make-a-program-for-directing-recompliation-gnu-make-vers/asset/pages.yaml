  md: 'Here are the variables Makefiles should use to specify directories to put these
    various kinds of files in:


    ''datarootdir''


    The root of the directory tree for read-only architecture-independent data files.
    This should normally be `/usr/local/share`, but write it as `$(prefix)/share`.
    (If you are using Autoconf, write it as `@datarootdir@`). `datadir`''s default
    value is based on this variable; as are `infodir`, and `mandir`,


    ''datadir'' The directory for installing idiosyncratic read-only architecture-independent
    data files for this program. This is usually the same as `datarootdir`, but we
    use the two separate variables so you can move these files without altering the
    location for Info files, pages, etc.


    This should normally be `/usr/local/share`, but write it as `$(datarootdir)`.
    (If you are using Autoconf, write it as `@datadir@`).

    The definition of `datadir` is the same for all packages, so you should install
    your data in a subdirectory thereof. Most packages install their data under `$(datadir)/package-name/`.


    ''sysconfdir'' The directory for installing read-only data files that pertain
    to a single machine- is to say, for configuring a host. Mail and network configuration
    files, `/etc/passwd`, and so forth. All the files in this directory should be
    ordinary ASCII text. This directory should normally be `/usr/local/etc`, but write
    it as `$(prefix)/etc`. (If you are using Autoconf, write it as `@sysconfdir@`).


    Do not install executables in this directory (they probably in `$(libexecdir)`
    or `$(bindir)`). Do not install files that are modified in the normal course of
    their use (programs whose purpose is to configure the restar of the system excluded).
    These probably belong in `$(localstatedir)`


    ''sharedstatedir'' The directory for installing architecture-independent data
    files which the modify while they run. This should normally be `/usr/local/com`,
    but write it as `$(prefix)/com`. (If you are using Autoconf, write it as `@sharedstatedir@`).


    ''localstatedir'' The directory for installing data files which the programs modify
    while they run, and pertain to one specific machine. Users should never need to
    modify files in this directory to configure the package''s operation: put such
    configuration information in separate files that go in `$(statedir)` or `$(sysconfdir)`.
    `$(localstatedir)` should normally be `/usr/local/var`, but write it as `$(prefix)/var`.
    (If you are using Autoconf, write it as `@localstatedir@`).


    These variables specify the directory for installing specific types of files,
    if your program has them. Every GNU package should have Info files, so every program
    needs `infodir`, but not all need `libdir` or `lspdir`.'
