  md: "# 13 Incompatibilities and Missing Features\n\nThe make programs in other systems\
    \ support a few features that are not implemented in GNU make. The POSIX.2 standard\
    \ (IEEE Standard 1003.2-1992) specifies that make does not require any of these\
    \ features.\n\n+   - A target of the form 'file((entry))' stands for a member\
    \ of archive file. The member is not chosen, by name, but by an object file which\
    \ defines the symbol entry.\n- This feature was not put into GNU make because\
    \ of the nonmodularity of knowing-edge into make of the internal format of archive\
    \ file symbol tables. See Section 11.2.1 [Updating Archive Directories], page\
    \ 122.\n- Suffixes (in suffix rules) that end with the character '*' have a special\
    \ meaning to System make; they refer to the SCCS rule that corresponds to the\
    \ file one would get without the '*'. For example, the suffix rule '.o' would\
    \ make the file 'n.o' from the SCCS file 'n.c.' complete coverage, a whole series\
    \ of suffix rules is required. See Section 10.7 [Old-Fashioned Suffix Rules],\
    \ page 117.\n\nIn GNU make, this entire series of cases is handled by two rules\
    \ for extraction from SCCS, with the general feature of rule chaining. See Section\
    \ 10.4 [Chains of Implicit Rules], page 109.\n\n+   - In System V and 4.3 BSD\
    \ make, files found by PATH search (see Section 4.4 [Searching Directories for\
    \ Prerequisites], page 25) have their names changed inside that recipes. It is\
    \ much clearer to use automatic variables and make this feature obsolete.\n- In\
    \ some Unix make, the automatic variable '$ appearing in the prerequisites of\
    \ make has the strangely \"feature\" of expanding to the full name of the target\
    \ of that rule. We cannot imagine what went on the minds of Unix make developers\
    \ to do this; it is utterly inconsistent with the normal definition of $.\n- In\
    \ some Unix make, implicit rule search (see Chapter 10 [Using Implicit Rules],\
    \ page 103) is apparently for all targets, not without those recipes. This means\
    \ you can:\n\n```\nfoo.o:\n    cc -c foo.c\n```\n\nAnd make will intuit that 'foo.o'\
    \ depends on 'foo.c'.\nWe feel that such usage is broken. The prerequisite of\
    \ make are well-defined (for GNU make, at least), and doing such a thing does\
    \ not fit the model.\n\n+   - GNU make does not include any built-in rules for\
    \ compiling or preprocessing EFL programs. If we hear of anyone who is using EFL,\
    \ we will gladly add them.\n- It appears that in SVR4 make, a suffix rule can\
    \ be specified with no recipe, that it had an empty recipe (see Section 5.9 [Empty\
    \ Recipes], page 55). For example:\n    .c.a:\nwill override the built-in '.c.a'\
    \ suffix rule."
