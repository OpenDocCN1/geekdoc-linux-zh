    $(INSTALL_PROGRAM) foo $(bindir)/foo

    $(INSTALL_DATA) libfoo.o $(bindir)/libfoo.a

    ```


    However, it is preferable to support a DESTDIR on the target files, as explained
    in the next section.


    It is acceptable, but not required, to install multiple files in one command,
