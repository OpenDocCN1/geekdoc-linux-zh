    files are supposed to exist. See Section 10.2 [Catalogue of Implicit Rules], page
    104, for a catalogue of the predefined implicit rules.


    Above, we said an implicit rule applies if the required prerequisites ''exist''
    or can be made''. A file ''can be made'' if it is mentioned in the makefile as
    a target or a prerequisite, or if an implicit rule can be recursively found for
    how to make it. When an implicit prerequisite is the result of another implicit
    rule, we say that chaining is occurring. See Section 10.4 [Chains of Implicit
    Rules], page 109.


    In general, make searches for an implicit rule for each target, and for each double-colon
    target that has no recipe. A file that is mentioned as a prerequisite is considered
    target whose specifies nothing, so implicit rule search finds it. See Section
    10.8 [Implicit Rule Search Algorithm], for the details of how the search is done.


    Note that explicit prerequisites do not influence implicit rule. For example:


    ```

    foo.: foo.o

    ```


    The prerequisite for ''foo.c'' does not necessarily mean that we will make ''foo.o''
