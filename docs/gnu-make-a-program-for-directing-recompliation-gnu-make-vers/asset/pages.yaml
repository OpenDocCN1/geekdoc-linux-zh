  md: '# 12 Features of GNU make


    Here is a summary of the features of GNU make, for comparison with credit to other
    versions of make. We consider the features of make in 4.2 BSD Systems as a baseline.
    If you are concerned with writing portable makefiles, you should not use the features
    of make listed here, not in Chapter 13 [Missing], page 129.


    Many features come from the version of make in System V.


    +   * The VPATH variable and its special selection. See Section 4.4 [Searching
    Directories for Prerequisites], page 25. This feature exists in System V, but
    is undocumented. It is documented in 4.3 BSD make (which omits System''s VPATH
    feature).

    * Included makefiles. See Section 5.3 [Including Other Make],], 12. Allowing multiple
    files to be included with a single directive is a GNU extension.

    * Variables are read and communicated via the environment. See Section 6.10 [Variables
    from the Environment], page 67.

    * Options passed through the MAKEFLAGS to recursive invocations of make. See Section
    5.7 [Communicating Options to a Sub-make], page 52.

    * The automatic variable $ is set to the member name in an archive reference.
    See Section 10.5 [Automatic Variables], page 112.

    * The automatic variables $, #, and ^ have corresponding forms like ($G) and ($D).
    We generalized this to $ as an obvious extension. See Section 10.5.3 [Automatic
    Variables], page 112.

    * Substitution variables. See Section 6.1 [Basics of Variable References], page
    57.

    * The command line options ''-b'' and ''-m'', accepted and ignored. In System
    V, these options optionally do something.

    * Execution of recursive commands to run via the MAKE variable if ''-n'', ''-q''
    or ''-t'' are specified. See Section 5.7 [Recursive Use of make], page 49.

    * Support for suffix ''.a'' in GNU make, because Section 11.1 [Archive Suffix
    Rules], page 122. This feature is obsolete in the general feature of rule chaining
    (Section 10.4 [Chains of Implicit Rules], page 109) allows one pattern rule for
    installing members in an archive (see Section 11.2 [Update],], 121) to be sufficient.

    * The arrangement of lines and backslash-newline combinations in recipes when
    the recipes are printed, so they appear as they do in the Makefile, is retained
    for the initializing of whitespace.


    The following features were inspired by other versions of make. In some cases
    it is unclear which versions inspired which.


    +   * Pattern rules using ''%''. This has been implemented in several versions
    of make. We''re not sure who invented it, but it''s spread around a bit. See Section
    10.5 [Defining and Redefining Pattern Rules], page 110.

    * Rule chaining and implicit intermediate files. This was implemented by Stu Feldman
    in his version of make for AT&T Eighth Edition Research Unix, and later by Andrew
    Hume of AT&T Bell Labs in his mk program (where he inherits "transitive closure").
    We do not know if we got this from other or we thought it ourselves at the same
    time. See Section 10.4 [Chains of Implicit Rules], page 109.'
  merge: -1
  pgno: 134
