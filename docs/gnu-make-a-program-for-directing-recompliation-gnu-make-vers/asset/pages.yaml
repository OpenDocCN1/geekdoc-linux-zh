  md: "# Chapter 4: Writing Rules\n\nA rule appears in the makefile and says when\
    \ and how to remake certain files, called the rule's targets (most only one per\
    \ rule). It lists the other files that are the prerequisites of the target, and\
    \ the recipe to use to create or update the target.\n\nThe order of rules is not\
    \ significant, except for determining the default goal: the target for make to\
    \ consider, if you do not specify one. The default goal is the target of the first\
    \ rule in the makefile. If the first rule has multiple targets, only the first\
    \ target is taken as the default. There are two exceptions: a target starting\
    \ with a period is not a default unless it contains one more slashes, '/', as\
    \ well; and a target that defines a pattern rule has no effect on the default\
    \ goal. (See Section 10.5 [Defining and Redefining Pattern Rules], page 110).\n\
    \nTherefore, we write the makefile so that the first rule is the one for compiling\
    \ the entire program or all programs described by the makefile (often with a target\
    \ called 'all'). See Section 9.2 [Arguments to Specify the Goals], page 93.\n\n\
    # 4.1 Rule Syntax\n\nIn general, a rule looks like this:\n\n```\ntargets : prerequisites\n\
    \      recipe\n```\n\nor like this:\n\n```\ntargets : prerequisites ; recipe\n\
    \      recipe\n```\n\nThe targets are file names, separated by spaces. Wildcard\
    \ characters may be used (see Section 4.3 [Using Wildcard Characters in File Names],\
    \ page 23) and a name of the form ('m') represents a member in an archive file\
    \ (see Section 11.1 [Archive Members as Targets], page 121). Usually there is\
    \ only one target per rule, but occasionally there is reason to have more (see\
    \ Section 4.9 [Multiple Targets in a Rule], page 34).\n\nThe recipe starts with\
    \ a tab (or the first character in the value of) RECIPEFILE variable; see Section\
    \ 6.14 [Special Variables], page 70). The first recipe may appear on the same\
    \ line as the prerequisites, with a tab character, or may appear on the same line,\
    \ with another way, the effect is the same. There are other differences in the\
    \ syntax of rules. See Chapter 5 [Writing Rules in Rules], page 41.\n\nBecause\
    \ dollar signs are used to make variable references, if you really want a dollar\
    \ sign in a target or prerequisite you must write two, '$$ (see Chapter 6 [How\
    \ to Use Variables], page 57). If you have enabled secondary expansion (see Section\
    \ 3.8 [Secondary Expansion], page 17) and you want a literal dollar sign in the\
    \ prerequisites list, you must actually write four dollar signs ($$$).\n\nYou\
    \ may split a line by inserting a backslash followed by a newline, but this is\
    \ not required, as make places no on the length of a line in a makefile.\n\nA\
