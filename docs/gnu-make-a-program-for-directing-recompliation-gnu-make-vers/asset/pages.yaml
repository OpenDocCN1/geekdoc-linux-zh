  md: '# 8 Functions for Transforming Text


    Functions allow you to do text processing in themakefile to compute the files
    to operate on the commands to use in recipes. You use a function in a function
    call, where you give the name of the function and some text (arguments) for the
    function to operate on. The result of the function''s processing is substituted
    into the makefile at the point of the call, just as a variable may be substituted.


    # 8.1 Function Call Syntax


    A function call resembles a variable reference. It looks like this:


    ```

    $function arguments

    ```


    or like this:


    ```

    $function arguments

    ```


    Here is a function name; one of a short list of names that are part of make. You
    can essentially create your own functions using the call built-in function.


    The arguments are the arguments of the function. They are separated from the function
    name by one or more spaces or tabs, and if there is more than one argument, they
    are separated by commas. Such whitespace and commas are not part of an argument''s
    value. The delimiters you use to surround the function call, whether parentheses
    or braces, can appear in an argument only in matching pairs; the other kind of
    delimiters may appear if the arguments themselves contain other function calls
    or variable references; it is wise to use the same kind of delimiters for all
    the references; write ''$($(sub a,b,$x))`, not `$(sub a,b,$x))`. This is because
    it is clearer, and only one type of delimiter is matched to the end of the reference.


    The text written for substitution of variables and function calls to produce the
    argument value, which is the text on which the function acts. The substitution
    is done in the order in which the arguments appear.


    Commas and unmatched braces cannot appear in the text of an argument as written;
    leading spaces cannot appear in the text of the first argument as written. These
    characters can be put into the argument value by variable substitution. First
    define variables comma and space whose are isolated comma and space characters,
    then substitute these variables where such characters are wanted, like this:


    ```

    comma:=

    empty:

    space:$(empty)$($empty)

    foo:a b c

    bar=$sub $(space),$(comma),$(foo)

    # bar is now ''a,b,c''.

    ```


    Here the subst replaces each space with a comma, through the value of foo, and
    substitutes the result.'
