- img_proc: true
  md: '# # Overview of make


    The **make** utility automatically determines which pieces of a large program
    need to be recompiled, and issues commands to recompile them. This manual describes
    GNU make, which was implemented by Richard Stallman and Roland McGrath. Development
    since Version 3.76 has been handled by Paul D. Smith.


    GNU make conforms to section 6.2 of IEEE Standard 1003.2-1992 (POSIX.2).


    Our examples show C programs, since they are most common, but you can use make
    with any programming language whose compiler can run with a shell command. Indeed,
    make is not limited to programs. You can use it to describe any task where some
    files are updated automatically from whenever the others changes.


    To prepare for use make, you must write a file called themakefile that describes
    the relationships between files in your program and provides commands for updating
    each file. In a program, typically, the executable is updated from object files,
    which are in turn made by compiling source files.


    Once a suitable Makefile exists, each time you change some source files, this
    simple shell command:


    ```

    make

    ```


    suffices to perform all necessary recompilations. The make program uses the datafile
    base and the last-modification times of the files to decide which of the files
    need to be updated. For each of those, it issues the recipes to the data base.


    You can provide command line arguments to make to control which files should be
    recompiled, or see Chapter 9 [How to Run make], page 93.


    # ## 1.1 How to Read This Manual


    If you are new to make, or are looking for a general introduction, read the first
    few sections of each chapter, skipping the later sections. In each chapter, the
    first few sections contain introductory or general information and the later sections
    specialized or technical information. The exception is Chapter 2 [An Introduction
    to Makefiles], page 3, all of which is introductory.


    If you are familiar with other make programs, see Chapter 12 [Features of GNU
    make], page 125, which lists the enhancements GNU make has, and Chapter 13 [Incompatibilities
    and Missing Features], page 19, which explains the few things GNU make lacks that
    others have.


    For a quick summary, see Section 9.7 [Options Summary], page 98, Appendix A [Quick
    Reference], page 147, and Section 4.8 [Special Targets], page 32.


    # ## 1.2 Problems and Bugs


    If you have problems with GNU make or you think you''ve found a bug, please report
    it to the developers; we cannot promise to do anything but we might well want
    to fix it.


    Before reporting a bug, make sure you''ve actually found a real bug. Carefully
    reread the documentation and see if it really says what you''re trying to do.
    If it''s not clear whether you should be doing something or not, report that too;
    it''s a bug in documentation!'
  merge: -1
  pgno: 10
- img_proc: true
  md: '2


    GNU make


    Before reporting a bug or trying to fix it yourself, try to isolate it to the
    smallest possible makefile that reproduces the problem. Then send us the makefile
    and the exact results make gave you, including any error or warning messages.
    Please don''t paraphrase these messages; it''s best to cut and paste them into
    your report. When generating this small makefile, be sure to not use any non-free
    or unusual tools in your recipes: you can almost always emulate what a tool would
    do with simple shell commands. Finally, be sure to explain what you expected to
    occur; this will help us decide whether the problem was really in the documentation.


    Once you have a precise problem you can report it in one of two ways. Either send
    electronic mail to:


    ```

    bug-make@gnu.org

    ```


    http://savannah.gnu.org/projects/make/


    In addition to the information above, please be careful to include the version
    number of make you are using. You can get this information with the command `make
    --version`. Be sure also to include the type of machine and operating system you
    are using. One way to obtain this information is by looking at the final lines
    of output from the command `make --help`.'
  merge: -1
