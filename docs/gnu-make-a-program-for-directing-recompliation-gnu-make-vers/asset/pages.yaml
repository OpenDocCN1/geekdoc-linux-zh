  md: 'The first difference is what happens if the intermediate file does not exist.
    If an ordinary file b does not exist, make considers a target that depends on
    b, it invariably creates b and then updates the target from b. But if b is an
    intermediate file, then make can leave well alone. It won''t bother updating b,
    or the ultimate target, unless some prerequisite of b is newer than that or there
    is some other reason to update that.


    The second difference is if make does create b in order to update something else,
    it deletes b after it is no longer needed. Therefore, an intermediate file which
    did not exist before also not exist after make. make reports the deletion to you
    printing a ''rm -f'' command showing which file it is deleting.


    Ordinarily, a file cannot be intermediate if it is not mentioned in the Makefile
    as a target or prerequisite; you can explicitly make a file as intermediate by
    listing it as a prerequisite of the special target. .INTERMEDIATE. This takes
    effect even if the file is mentioned in some other way.


    You can prevent automatic deletion of an intermediate file by marking it as a
    secondary. To do this, list it as a prerequisite of the special target, .SECONDARY.
    When a file is secondary, make will not create the file merely because it does
    not already exist, but make does not automatically delete the file. Marking a
    file also marks it as intermediate.


    You can list the target of an implicit rule (such as ''.o'') as a prerequisite
    of the special target, .PRECIOUS to preserve intermediate files made by implicit
    rules whose pattern patterns match file''s name; see Section 5.6 [Interrupts],
    page 49.


    A chain may not appear more than once in a chain. This means that make will not
    consider such a ridiculous thing as making ''foo'' from ''foo.o.o'' by running
    the linker twice. This constraint has the added benefit of preventing any infinite
    loop in the search for an implicit rule.

    For example, it is possible to make a file ''foo'' from ''RCS/foo.y,v'' by running
    RCS, Yacc and cc. Then both ''foo.y'' and ''foo.c'' are intermediate files that
    are deleted at the end.


    There are special implicit rules to optimize cases that would otherwise be handled
    by rule chains. For example, making ''foo'' from ''foo.c'' could be handled by
    compiling and linking with chained rules, ''foo.o'' as an intermediate file. But
    what actually happens is that a special rule for this case is the compilation
    and linking with a single cc. The optimized rule is in preference to the step-by-step
    chain because it comes earlier in the ordering of rules.


    # 10.5 Defining and Redefining Pattern Rules


    You define an implicit rule by writing a pattern rule. A pattern rule looks like
    an ordinary rule, except that its target contains the character % (exactly one
    of them). The target is considered for matching file names; the % can match any
    nonempty substring, while other characters match only themselves. The prerequisites
    likewise use % to show how their names relate to the target name.


    Thus, a pattern rule %.o : %c says how to make any file ''stem.o'' from another
    file ''stem.c''.'
