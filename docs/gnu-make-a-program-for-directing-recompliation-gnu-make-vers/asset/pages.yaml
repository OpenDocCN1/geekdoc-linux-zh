    If you modify the suffix list, the only defined suffix rules will be those named
    by one or two of the suffixes that are on the list you specify; rules whose suffixes
    fall off the list are disabled. Section 10.7 [Old-Fashioned Suffix Rules], page
    117, for full details on suffix rules.


