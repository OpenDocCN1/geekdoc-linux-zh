  md: "# Chapter 14: Makefile Conventions\n\n'uninstall'\n\nDelete all the installed\
    \ files—the copies that the 'install' and 'install-* targets create.\n\nThis rule\
    \ should not modify the directories where compilation is done, only the directories\
    \ where files are installed.\n\nThe installation commands are divided into three\
