  md: '# 3 Writing Makefiles


    The information that tells make how to recompile a system comes from reading a
    data base called the makefile.


    # 3.1 What Makefiles Contain


    Makefiles contain five kinds of things: explicit rules, implicit rules, variable
    definitions, directives, and comments. Rules, variables, and directives are described
    at length in later chapters.


    +   - An explicit rule says when and how to make one or more files, calling the
    rule''s targets. It lists the other files that the targets depend on, the prerequisites
    of the target, and may also give a recipe to create or update the targets. See
    Chapter 4 [Writing Rules], page 21.


    +   - An implicit rule says when and how to rename a class of files based on names.
    It describes how a target may depend on a name similar to the target and gives
    a recipe to create or update such a target. See Chapter 10 [Implicit Rules], page
    103.


    +   - A variable definition is a line that specifies a text value for a variable
    that can be substituted in the later text. The simple myfile example shows a variable
    definition for objects as a list of all object files (see Section 2.4 [Variables
    Makefiles Simpler], page 6).


    +   - A directive is an instruction for make to do something while reading the
    makefile. These include:


    +   - Reading another line (see Section 3.3 [Including Other Makefiles], page
    12)


    +   - Deciding (based on the values of variables) to use or ignore a part of the
    makefile (see Chapter 7 [Conditional Parts of Makefiles], page 73).


    +   - Defining a variable from a verbatim string containing multiple lines (see
    Section 6.8 [Defining Multi-Line Variables], page 66).


    +   - # in a line of a file starts a comment. It and the rest of the line are
    ignored, except that a trailing backslash not escaped by anotherslash will continue
    the comment across multiple lines. A line containing a comment (with perhaps spaces
    before it) is effectively blank, and is ignored. If you want a literal #, escape
    it with a backslash (e.g., \#). Comments may appear on any line of the makefile,
    although they are treated specially in certain situations.


    You cannot use comments within variable references or function calls: any instance
    of # will be treated literally (rather than as the start of a comment) inside
    a variable reference or function call.


    Comments within a recipe are passed to the shell, just as with any other recipe
    text. The shell decides how to interpret it: whether or not this is a comment
    is up to the shell.


    Within a define directive, comments are not ignored during the definition of the
    variable, but rather kept intact in the value of the variable. When the variable
    is expanded they will make comments or recipe text, depending on the context in
    which the variable is evaluated.'
  merge: -1
