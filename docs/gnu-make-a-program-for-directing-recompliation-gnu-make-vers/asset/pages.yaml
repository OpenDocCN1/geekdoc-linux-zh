    # Rule Definition


    A rule is always expanded the same way, regardless of the form:


    ```

    immediate : immediate ; deferred

    deferred

    ```


    That is, the target and prerequisite sections are expanded immediately, and the
    recipe used to construct the target is always deferred. This general rule is true
    for explicit rules, pattern rules, suffix rules, static patterns, and secondary
    prerequisites.


    # 3.8 Secondary Expansion


    In the previous section we learned GNU make works in two distinct phases: a read-in
    phase and a target-update phase (see Section 3.7 [How make Reads a Makefile],
    page 15). GNU make also has the ability to enable a second expansion of the prerequisites
    (only) for some or all targets defined in the makefile. In order for this secondary
    expansion to occur, the special target SECONDEXPANSION must be defined before
    the first prerequisite list that makes use of this feature.


    If that special target is defined between the two phases mentioned above, at the
    end of the read-phase, all the prerequisites of the targets defined after the
    special target are expanded a second time. In many circumstances this secondary
    expansion will have no effect, since variable and function references will have
    been expanded during the initial parsing of makefiles. In order to take advantage
    of the secondary expansion phase of the parser, it’s necessary to escape the variable
    or function reference in the makefile. In this case the first phase merely un-escapes
    the reference but does not expand it, and expansion is left to the secondary expansion
    phase. For example, consider this makefile:


    ```

    .SECONDEXPANSION:

    ONEVAR = onefile

    TWOVAR = twofile

    myfile: $(ONEVAR) $$(TWOVAR)

    ```


    After the first expansion phase the prerequisites list of the ''myfile'' target
    will be onefile and $(TWOVAR); the first (unescaped) variable to ONEVAR is expanded,
    while the second (escaped) variable reference is simply unescaped, without being
    recognized as a variable. Now during the secondary expansion the first word is
    expanded again since it contains no reference to the static value ''onefile'',
    while the second word is now a normal reference to the variable TWOVAR, which
    is expanded to the value ''twofile''. The final result is that are two prerequisites,
    ''onefile'' and ''twofile''.


    Obviously, this is not a very interesting case since the same result could more
    easily be achieved by having both variables appear, unescaped, in the पड़ेगा list.
    One difference becomes apparent if the variables are reset; consider this example:


    ```

    .AVAR = top

    onefile: $(AVAR)

    twofile: $(AVAR)

    ```'
