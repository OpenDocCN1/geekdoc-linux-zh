  md: '# Chapter 14: Makefile Conventions


    ''included''


    The directory for installing header files to be included by user programs with
    the C `#include` preprocessor directive. This should normally be `/usr/local/include`,
    but write it as `$(prefix)/include`. If you are using Autoconf, write it as `@includedir@`.


    Most complilers for GCC do not look for header files in directory `/usr/local/include`.
    Installing the header files this way is only useful with GCC. Sometimes this is
    not a problem because some libraries are really intended to work with GCC. But
    some libraries are intended to work with other compilers. They should install
    their header files in two places, one specified by `includedir` and one specified
    by `oldincludeddir`.


    ''oldincludeddir''


    The directory for installing `#include` header files for use with compilers other
    than GCC. This should normally be `/include`. If you are using Autoconf, write
    it as `@oldincludeddir@`.


    The Makefile commands should check the value of `oldincludeddir` is empty. If
    it is, they should not try to use it; they should cancel the installation of the
    header files.


    A package should not replace an existing header in this directory unless the same
    package. Thus, if your Foo package provides a header file `foo.h`, then it should
    install the header file in the includedir directory if either (1) there is no
    `foo.h` there or (2) `foo.h` that exists from the package.


    To tell which `foo.h` came from Foo, put a magic string in the file—part of a
    command and `grep` for that string.


    ''docdir''


    The directory for installing documentation files (other than Info) for this package.
    By default, it should be `/usr/local/share/doc/yourpkg`, but it should be written
    as `$(datadir)/yourpkg`. If you are using Autoconf, write it as `@docdir@`. Your
    package subdirectory, which may include a version number, prevents collisions
    among files with common names, such as `README`.


    ''infdir''


    The directory for installing Info files for this package. By default, it should
    be `/usr/local/share/info`, but it should be written as `$(datadir)/info`. If
    you are using Autoconf, write it as `@infdir@`. infdir is separate from `docdir`
    for compatibility with existing practice.


    ''htmldir''


    ''dviddir''


    ''pdfdir''


    ''psdirdir''


    Directories for installing documentation files in the particular format. They
    should all be set to `$(docdir)` by (If you are using Autoconf, write them as
    `@htmldir@`, `@dviddir@`, etc.). Packages which supply several translations of
    their documentation should install them in `$$(htmldir)/l`, `$$(pdfdir)/l`, etc.
    where `L` is a locale abbreviation such as `en` or `pt_BR`.


    ''libdir''


    The directory for object files and libraries of object code. Do not install executables
    here, they probably go in `$(libexeccdir)` instead.'
