    ''TAGS'' Update a tags file for this program.


    ''check'' Perform self tests on the program this makefile builds.


    # 9.3 Instead of Executing Recipes


    The makefile tells how to tell whether a target is up to date, and how to update
    it. But updating the targets is not always what you want. Certain options specify
    other activities for make.


    +   -n

    --just-print

    --dry-run

    --recon


    > "No-op". The activity is to print what recipe would be used to make the targets
    up to date, but not actually execute it. Some recipes are still executed, even
    with this flag (see Section 5.7.1 [How the MAKE Variable Works], page 50).


    +   -t

    --touch


    > "Touch". The activity is to mark the targets up to date without actually changing
    them. In other words, make prepends to compile the targets but does not really
    change their contents.


    +   -W file

    --what-if=file

    --assume-new=file

    --new-file=file


    > "Question". The activity is to find out silently whether the targets are up
    to date; but execute no recipe in either case. In other words, neither compilation
    output will occur.


    > "What if". Each -W flag is followed by a file name. The given files'' modification
    times are recorded by make as being the present time, although the actual modification
    times remain the same. You can use the -W flag in conjunction with the -n flag
    to see what would happen if you were to modify specific files.'
