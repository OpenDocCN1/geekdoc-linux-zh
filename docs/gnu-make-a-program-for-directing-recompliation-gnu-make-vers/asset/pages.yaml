    # 14.6 Standard Targets for Users


    All GNU programs have the following targets in their Makefiles:


    +   * ''all'' Compile the program. This should be the default target. This target
    need not rebuild any documentation files; Info files should normally be included
    in the distribution, and DVI (and any other documentation format) files should
    be made only when explicitly asked for.


    By default, the Make rules should compile and link with ''-g'', so that executable
    programs have debugging modules. Users who don''t mind being helpless can strip
    the executables later if they wish.


    +   * ''install'' Compile the program and copy the executables, libraries, and
    so on to the file names where they should reside for actual. If there is a simple
    test to verify that a program is properly installed, this target should run that
    test.


