  md: 'Chapter 14: Makefile Conventions


    # 14.3 Variables for Specifying Commands


    Makefiles should provide variables for overriding certain commands, options, and
    so on.


    In particular, you should run most utility programs via variables. Thus, if you
    use Bison, with a named variable BISON default value is set ‘BISON = bison’, and
    refer to it ‘$(BISON)’ whenever you need to use Bison.


    File management utilities as ln, rm, and so on, do not need to be referred as
    variables in this way, since users don''t need to replace them with other programs.


    Each program-name variable should come with an option variable that is used to
    supply options to the program. Append CFLAGS to the program-name variable to get
    the options variable—example, BISONFLAGS (The names CFLAGS for C compiler, YLAGS
    for yacc, and LFLAGS for lex, are exceptions to this rule, but we keep them because
    they are standard.) Use CFLAGS in any compilation command that runs the preprocessor,
    and use LFLAGS in any compilation command that does as in any direct use of this:


    If there are C options that must be used for proper compilation of certain files,
    do not include them in CFLAGS. Users expect to be able to specify CFLAGS freely.
    Instead, regard the necessary options to the C compiler independently of CFLAGS,
    by writing them in the compilation commands or by defining an implicit rule, like:


    ```

    CFLAGS = -g

    ALL_FLAGS = -I.$(CFLAGS)

    C.O: -c $(CFLAGS) $(ALL_FLAGS) \$

    ```


    Do include the ''-g'' option in CFLAGS, because that is not required for proper
    compilation. You can consider a default that is only recommended. If the package
    is set up so that it is compiled with GCC by default, then you might include ''-O''
    in the default value of CFLAGS as well.


    Put CFLAGS last in the compilation command, after other variables containing compiler
    options, the user can use CFLAGS to override the others.


    CFLAGS should be used in every invocation of the C compiler, both which do compilation
    and those which do linking.


    Every Makefile should define the variables INSTALL, which is the basic command
    for installing a file into the system.


    Every Makefile should also define the variables INSTALL_PROGRAM and INSTALL_DATA.
    The default for INSTALL_PROGRAM should be $(INSTALL); the default for INSTALL_DATA
    should be ''$(INSTALL)-m 644). Then it should use those variables as the commands
    for actual installation, for executables and non-executables respectively. Minimal
    use of these variables is as follows:


