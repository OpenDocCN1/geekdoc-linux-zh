    # 5.1.2 Using Variables in Recipes


    The other way in make processes recipes is by expanding any variable references
    in them (see Section 6.1 [Reference], page 57). This occurs after make has finished
    reading all the makefiles and the target is determined to be out of date; the
    recipes for targets which are not rebuilt


    Variable and function references have identical syntax and semantics to references
    elsewhere in the Makefile. They also have the same quoting rules; if you want
    a dollar sign to appear in recipe, you must double it ($$). For shells like the
    default shell, that use dollar signs to introduce variables, it''s important to
    keep in your mind whether the variable you want to reference is a make variable
    (a single dollar sign) or a shell variable (which use double dollar signs). For
    example:


    ```

    LIST = one two three \

    \nfor i in $(LIST); do \

    echo $$; \ \

    done

    ```


    results in the following command passed to the shell:


    ```

    for i in one two; do \

    echo $i; \

    done

    ```


    which generates the expected result:


    ```

    one

