    # 4.12 Double-Colon Rules


    Double-colon rules are rules written with '':'' instead of '';'' after the target
    names. They are handled differently from ordinary rules when the target appears
    in more than one rule. Pattern rules with double-colons have an entirely different
    meaning (see Section 10.5 [Match-Any Rules], page 115).

    When a target appears in multiple rules, all the rules must be the same type:
    all ordinary, or double-colon. If they are double-colon, each of them is independent
    of the others. Each double-colon recipe is executed if the target is older than
    any prerequisites of that rule. If there are no prerequisites for a target, its
    recipe is always executed (even if the target already exists). This can result
    in executing none, any, or all of the double-colon rules.


    Double-colon rules with the same target are in completely separate from one another.
    Each double-colon rule is processed individually, just as rules with different
    targets are processed.


    The double-colon rules for a target are executed in the order they appear in the
    makefile. However, the cases where double-colon rules really make sense are those
    where the order of executing the recipes would not matter.


    Double-colon rules are somewhat obscure and not very useful; they provide a mechanism
    for cases where the method used to update a target depends on which prerequisite
    files caused the update, and such cases are rare.


    Each double-colon rule should specify a recipe; if it does, an implicit rule will
    be used if one applies. See Chapter 10 [Using Implicit Rules], page 103.


