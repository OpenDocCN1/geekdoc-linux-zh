  md: '# GNU make


    +   The automatic variable $ containing a list of prerequisites of the current
    target.

    We did not invent this, but we have no idea who did. See Section 10.5.3 [Automatic
    Variables], page 112. The automatic variable $+ is a simple extension of $.


    +   The ''what if'' flag -w (in GNU make) was (as far as we know) invented by
    Andrew Hume in make. See Section 9.3 [Instead of Executing Recipes], page 95.


    +   The concept of doing several things at once (parallelism) exists in many incarnations
    of make and similar programs, though Section 5.3 [Recipe Execution], page 44.


    +   Modified variable references using pattern substitution from SunOS 4. See
    Section 6.1 [Basics of Variable References], page 57. This functionality was provided
    in GNU make by the patsubst function before the alternate syntax was implemented
    for compatibility with SunOS4. It is not clear who inspired whom, since GNU make
    patsubst before SunOS 4 was released.


    +   The special significance of ''*'' characters representing recipe lines - Section
    9.3 [Instead of Executing Recipes], page 95 is mandated by IEEE Standard 1003.2-1992
    (POSIX.2).


    +   The ''*='' syntax to append to the value of a variable from SunOS 4 make.
    See Section 6.6 [Adding Text to Variables], page 64.


    +   The syntax ''archive(mem1 mem2..)'' to list multiple members in a single archive
    file from SunOS 4 make. See Section 11.1 [Archive Members], page 121.


    +   The -include directive to include makefiles with no nonexistent file comes
    from SunOS 4 make. (But note SunOS 4 make does not allow multiple makefiles to
    be specified in one -include directive). The same feature appears with the name
    include in SGI make and perhaps others.


    The remaining features are inventions in GNU make:


    +   - Use the ''-v'' or ''--version'' option to print version and copyright information.


    +   - Use the ''-h'' or ''--help'' option to summarize the options to make.


    +   - Simply-expanded variables. See Section 6.2 [The Flavors of Variables], page
    58.


    +   - Pass command line assignments automatically by the variable MAKE to recursive
    make invocations. See Section 5.7 [Recursive Use of], page 49.


    +   - Use the ''-C'' or ''--directory'' option to change directory. See Section
    9.7 [Summary of Options], page 98.


    +   - Make verbatim variable definitions with definition. See Section 6.8 [Defining
    Multi-Line Variables], page 66.


    +   - Declare phony targets with the special target .PHONY.


    Andrew Hume of AT&T Bell Labs implemented a similar feature with a different syntax
    in his mk program. This seems to be a case of parallel discovery. See Section
    4.5 [Phony Targets], page 29.


    +   - Manipulate text by calling functions. See Chapter 8 [Functions for Transforming
    Text], page 79.


    +   - Use the ''-o'' or ''--old-file'' option to pretend a file modification-time
    is old. See Section 9.4 [Avoiding Recompilation of Some Files], page 96.'
  merge: -1
