    # Compiling C++ programs


    ''n.o'' is made automatically from ''n.cc'', ''n.cpp'', or ''n.C'' with a recipe
    of the form ''$(CXX) $(CPPFLAGS) $(CXXFLAGS) -c. We encourage you to use the suffix
    ''.cc'' for C++ source files instead of ''n.C''.


    # Compiling Pascal programs


    ''n.o'' is made automatically from ''n.p'' with the recipe ''$(PC) $(PFLAGS) -c''.''.


    # Compiling Fortran and Ratfor programs


    ''n.o'' is made automatically from ''n.r'', ''n.F'' or ''n.f'' by running the
    Fortran compiler. The precise recipe used is:


    ```

    .f

    $(FC) $(FFLAGS) -c''.

    ```


    ```

    .F

    $(FC) $(FFLAGS) $(CPPFLAGS) -c''.

    ```


    ```

    .r

    $(FC) $(FFLAGS) $(RFLAGS) -c''.

    ```


    # Preprocessing Fortran and Ratfor programs


    ''n.f'' is made automatically from ''n.r'' or ''n.F''. This rule runs just the
    preprocessor to convert a Ratfor or processable Fortran into a strict Fortran
    program. The precise recipe used is:


    ```

    .F

    $(FC) $(CPPFLAGS) $(FFLAGS).

    ```


    ```

    .r

    $(FC) $(FFLAGS) $(RFLAGS)

    ```


    # Compiling Modula-2 programs


    ''n.sym'' is made automatically from ''n.def'' with a recipe of the form ''$(M2C)
    $(M2FLAGS) $(DEFFLAGS)''.n.o'' is made from ''n.mod''; the form is: ''$(M2C) $(M2FLAGS)
