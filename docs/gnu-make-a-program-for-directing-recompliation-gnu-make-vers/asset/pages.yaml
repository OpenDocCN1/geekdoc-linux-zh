  md: 'Unlike most variables, the variable SHELL is never set from the environment.
    This is because the SHELL environment variable is used to specify your personal
    choice of shell program for interactive use. It would be very bad for personal
    choices like this to affect the functioning of makefiles. See Section 6.10 [Variables
    from the Environment], page 67.


    Furthermore, when you do SHELL in your Makefile that is not exported from the
    environment to receive lines that make invokes, the value inherited from the user''s
    environment, if any, is exported. You can override this behavior by explicitly
    exporting SHELL (see Section 5.7.2 [Communicating with a Sub-make], page 50),
    forcing it to be passed in the environment to receive lines.


    However, on MS-DOS and MS-Windows the value of SHELL in the environment is used,
    since on those most users do not use this shell, and therefore it is most likely
    set specifically to be used by make. On MS-DOS, if the setting of SHELL is not
    suitable for make, you can set the variable MAKESLL to the shell that make should
    use; if it will be used as the shell instead of the value of SHELL.


    # Choosing a Shell in DOS and Windows


    Choosing a shell in MS-DOS and MS-Windows is much more complex than other systems.


    On MS-DOS, if the shell is not set, the value of COMSPEC (which is always) is
    used.


    The processing of lines that set the variable SHELL in Makefiles is different
    on MS-DOS. The stock shell, `command.com`, is ridiculously limited in its functionality
    and many ways of make intend to find a replacement shell. Therefore, on MS-DOS,
    make examines the shell and changes its behavior on whether it points to a Unix-like
    or DOS-style shell. This allows reasonable functionality even if SHELL points
    to `command.com`.


    If SHELL points to a Unix-style shell, make on MS-DOS additionally checks whether
    that shell can be found; if not, it ignores the line that set SHELL. In MS-DOS,
    GNU make searches for the shell in the following places:


    +   1. In the precise place pointed to the value of SHELL. For example, if the
    she specifies `SHELL=/bin/sh`, make will look in the directory `/bin` on the current
    drive.

    2. In the current directory.

    3. In each directories of the PATH variable, in order.


    In every directory, make will first look for the specific file (''sh'' in the
    example above). If this is not found, it will also look in directory for one of
    the known extensions which identify executable files. For example ''.exe'', ''.com'',
    ''.bat'', ''.btm'', ''.sh'', and some others.


    If any of these attempts successful, the value of SHELL will be set to the full
    path of the shell as found. However, if none of them is found, the value of SHELL
    not be changed, and thus the line it sets will be effectively ignored. This is
    so make will only support features to a Unix-style shell if such a shell is actually
    installed on the system where make runs.


    Note that this extended search is for the cases where SHELL is set from the Makefile;
    if it is set in the environment or command line, you are expected to set it to
    the full pathname of the shell, exactly as that are on Unix.'
