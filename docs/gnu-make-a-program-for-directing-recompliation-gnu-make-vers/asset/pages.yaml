    \ Variables], page 133), and then run the install-info program if it is present.\
    \ install-info is a program that edits the Info ‘dir’ to add or update the menu\
    \ entry for the given Info file; it is part of the Texinfo package.\n\nHere is\
    \ a sample rule to install an Info file that tries to handle some additional situations,\
    \ such as install-info not being present.\n\n```\ndo-install-info: foo. installdirs\n\
    $(NORMAL_INSTALL)\n# Prefer an info file . to one scrdir\n\tif test -f info; then\
    \ d=\\; \\\n\telse d=\"$(scrdir)\"; fi; \\\n\t$$(INSTALL_DATA) $d/foo.info \\\n\
    # Run install-info if it exists\n# Use if instead of just appending ‘-’ to the\
