    \ because shells do not \\\n# fail gracefully when there is an unknown command.\n\
    \tif $$(SHELL) -c \"install-info --version\" \\\n\t>/dev/null --dir=\"$(DESTDIR)$(infodir)/dir\"\
    \ \\ \\\n\tinstall-info \\\n\t# \"$(DESTDIR)$(infodir)/foo.info\";\n```\n\nWhen\
    \ writing the target, you must classify all the commands into three categories:\
    \ normal, pre-installation commands and post-installation commands. See Section\
    \ 14.7 [Install Command Categories], page 144.\n\n'install-html'\n'install-dvi'\n\
    'install-pdf'\n'install-ps'\n\nThese targets install documentation in formats\
    \ other than Info; they are intended to be called explicitly by the person installing\
    \ the package, if that format is desired. GNU prefers Info files, so these must\
    \ be installed by the install target.\n\nWhen you have multiple files to install,\
    \ we recommend that you avoid conflicts and clutter by arranging for these targets\
    \ to install in subdirectories of the appropriate installation directory, such\
