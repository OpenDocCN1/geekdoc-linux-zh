  md: "# Chapter 14: Makefile Conventions\n\nIf you don't use a category line at the\
    \ beginning of the install rule, all the commands are classified as normal until\
    \ the first category line. If you don't use any category lines, the commands are\
    \ classified as normal.\n\nThese are the category lines for install:\n\n```\n\
    $(PRE_UNINSTALL)     # Pre-uninstall commands follow.\n$(POST_UNINSTALL)    #\
    \ Post-uninstall commands follow.\n$(NORMAL_UNINSTALL)  # Normal commands follow.\n\
    ```\n\nTypically, a pre-uninstall command would be used for deleting entries from\
    \ the Info directory.\n\nIf the install or uninstall target has any dependencies\
    \ which act as subroutines of installation, then you should start each dependency's\
    \ commands with a category line, and start the main target's commands with a category\
    \ line also. This way, you can ensure that each command is placed in the right\
    \ category regardless of which of the dependencies actually run.\n\nPre-installation\
    \ and post-installation commands should not run any programs except for these:\n\
    \n```\n[ basename bash chgrp chomp cp dd diff echo\negrep expand prf fgrep getop\
    \ getzip gunzip\nhostname install-kill ldconfig ls md5sum\nmkdir mkfifo mknod\
    \ mv pintv rmdir sed sort tee\ntest touch uname xargs yes\n```\n\nThe reason for\
    \ distinguishing the commands in this way is for the sake of making binary packages.\
    \ Typically a binary package contains all the executables and other files that\
    \ need to be installed, and has its own method of installing them-so it does not\
    \ need to run the normal installation commands. But installing the binary package\
    \ does not need to execute the pre-installation and post-installation commands.\n\
    \nPrograms to build binary packages work by extracting the pre-installation and\
    \ post-installation commands. The '-s' option to make needed to silence messages\
    \ about entering subdirectories:\n\n```\nmake -s n install -o all\n  PRE_INSTALL=pre-install\
    \ \\\nPOST_INSTALL=post-install \\\nNORMAL_INSTALL=normal-install \\\n  awk -f\
    \ pre-install.awk\n```\n\nwhere the file 'pre-install.awk' could contain this:\n\
    \n```\n$0 ~ /(normal-install|post-install){[ \t]*$/ { exit 0 }\n  cp (print $0)\n\
    $0 ~ /pre-install[\\ \t]*$/ { exit 1 }\n```"
