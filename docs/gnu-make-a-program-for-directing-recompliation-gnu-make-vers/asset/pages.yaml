    # 14.7 Install Command Categories


    When installing the target, you must classify all the commands into three categories:

    normal ones, pre-installation commands and post-installation commands.


    Normal commands move files into their proper places, and set their modes. They
    may not alter any files except the ones that entirely from the package they belong
    to.


    Pre-installation and post-installation commands may alter other files; in particular,
    they can edit global configuration files or databases.


    Pre-installation commands are typically executed before the normal commands, and
    post-installation commands are typically run after the normal commands.


    The most common use for a post-installation command is to run install-info. This
    cannot be done with a normal command, since it alters a file (the Info directory)
    which does not come entirely and solely from the package being installed. It is
    a post-installation command because it needs to be done after the normal command
    which installs the package''s Info files.


    To classify the commands in the install rule into these three categories, insert
    category lines among them. A category line specifies the category for the commands
    that follow.


    A category line consists of a tab and a reference to a special Make variable,
    plus an option comment at the end. There are three variables you can use, for
    each category; Category lines are no-ops in ordinary execution because these three
    Make variables are normally undefined (and you should define them in the makefile).


    Here are three possible category lines, each with a comment that explains what
    it means:


    ```

    $(PRE_INSTALL) # Pre-installation commands follow.

    $(POST_INSTALL) # Post-installation commands follow.

    $(NORMAL_INSTALL) # Normal commands follow.

    ```'
  merge: -1
