  md: 'We know these possibilities are ridiculous since ''foo.c'' is a C source file,
    not an executable. If make did consider these possibilities, it would ultimately
    reject them, because files such as ''foo.c.o'' and ''foo.c.p'' would not exist.
    But these possibilities are numerous that make would run so slowly if it had to
    consider them.

    To gain speed, we have put various constraints on the way make considers anything-matching
    rules. Each time you define a matching-rule you must choose one or the other for
    that.


    One choice is to mark the matching-rule as terminal by defining it with a double
    colon. When a rule is terminal, it does not apply unless its prerequisites actually
    execute. Prerequisites that could be made with other rules are not good enough.
    In other words, no further chaining is allowed beyond a terminal rule.


    For example, the built-in rules for extracting sources from RCS and SCCS files
    are terminal; as result, if the file ''foo.c.v'' does not exist, make will not
    consider trying to make it an intermediate file from ''foo.c.v'' or ''RCS/SCCS/foo.c.v''.
    RCS and SCCS files are generally ultimate source files, which should not be remade
    from any other; therefore, make can save time by not looking for rules to make
    them.


    If you do not mark the matching-rule as terminal, then it is nonterminal. A nonterminal-matching-rule
    cannot apply to a file name that indicates a specific type of data. A file name
    indicates a specific type of data if some non-matching implicit rule targets it.


    For example, the file name ''foo.c'' matches the pattern rule %c; %c; %y (to run
    yacc). Regardless of whether this rule is actually applicable (which happens only
    if there is a file ''foo.y''), the fact that its target matches is enough to prevent
    consideration of any nonterminal-matching-rules for the file ''foo.c''. Thus,
    make will not even consider to make ''foo.c'' as an executable file from ''foo.c.o'',
    ''foo.c.c'', ''foo.c.p'', etc.


    The motivation for this constraint is that nonterminal-matching-rules are used
    for making files containing specific types of data (such as executable files)
    and a file name with a recognized suffix identifies other type of data (such as
    a C source file).


    Special built-in dummy pattern rules are provided solely to recognize certain
    file names so that nonterminal-matching rules will not be considered. These dummy
    rules have no prerequisites and no recipes, and they are ignored for all other
    purposes. For example, the built-in implicit rule


    %.p\exists to make rules such as ''foo.p'' match a specific target pattern and
    thereby prevent time from being wasted looking for ''foo.p.o'' or ''foo.p.c''.


    Dummy pattern rules such as the one %.p are made for every suffix listed as for
    use in suffixes (see Section 10.7 [Old-Fashioned Rules], page 117).


