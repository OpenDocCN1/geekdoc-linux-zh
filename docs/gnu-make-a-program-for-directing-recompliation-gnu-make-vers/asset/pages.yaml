  md: '# maintainer-clean


    Delete almost everything that can be reconstructed with this Makefile. This typically
    includes everything deleted by `distclean`, plus more: C source files produced
    by Bison, Tags tables, Info files, and so on.


    The reason we say ''almost everything'' is that running the command `make maintainer-clean`
    should not delete `configure` even if `configure` can be made using a rule in
    the Makefile. More generally, `make maintainer-clean` should not delete anything
    that needs to exist in order to run `configure` and then begin to build the program.
    Also, there is no need to delete parent directories that were created with `mkdir
    -p`, since they could have existed anyway. These are the only exceptions; `maintainer-clean`
    should delete everything else that can be rebuilt.


    The `maintainer-clean` target is intended to be used by a maintainer of the package,
    not by ordinary users. You may need special tools to reconstruct some of the files
    that `make maintainer-clean` deletes. Since these files are normally included
    in the distribution, we don''t take care making them easy to reconstruct. If you
    need to unpack the full distribution, don''t blame us.


    To help users aware of this, the commands for the special `maintainer-clean` target
    should start with these:


    ```

    echo ''This command is intended for maintainers to use;

    echo ''deletes files that may need special tools to rebuild.''

    ```


    ''TAGS'' Update tags table for this program.


    Generate any Info files. The best way to write the rules is as follows:


    ```

    info: foo.info foo.tex chap1.tex chap2.tex

    $(MAKEINFO) $(srcdir)/foo.tex

    ```


    You must define the variable MAKEINFO in the Makefile. It should run the `makeinfo`
    program, which is part of the Texinfo distribution.


    Normally a GNU distribution contains Info files, and means that the Info files
    are present in the source directory. Therefore, the Rule for an info file should
    update in the source directory. When users build the package, ordinarily Make
    will not update the Info files because they will already be up to date.


    ''dvi'' ''html'' ''pdf'' ''ps''


    Generate documentation files in the given format. These targets should always
    exist, or any can be a no-op if the output format cannot be generated. These targets
    should not be dependencies of all the target; the user must manually invoke them.


    Here''s an example rule for generating DVI files from Texinfo:


    ```

    dvi: foo.tex

    ```'
