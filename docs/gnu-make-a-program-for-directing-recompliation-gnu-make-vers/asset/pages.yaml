  md: '# 54 GNU make


    When make interprets the value of MAKEFLAGS (either from the environment or from
    a makefile), it prepends a hyphen if the value does not already begin with one.
    Then it chops the value into words separated by hyphens ''-C'', and parses these
    words as if they were options given on the command line (except that ''-c'', ''-f'',
    ''-o'', ''-w'', and their longnamed versions are ignored); and there is no error
    for an invalid input.


    If you put MAKEFLAGS in your environment, you should be sure not to include any
    options that will drastically affect the actions of make and undermine the purpose
    of makefiles and of make itself. For instance, the ''-t'', ''-n'', and ''-q''
    options, if put in one of these variables, could have disastrous consequences
    and would certainly have at least surprising and probably annoying effects.


    # 5.7.4 The ''--print-directory'' Option


    If you use several levels of recursive invocations, the ''-w'' or ''--print-directory''
    option can make the output lot easier to understand by showing each directory
    as make starts it and finishes it. For example, if make -w is running in the directory
    ''/u/gnu/make'', make will print a line of the form:


    ```

    make: Entering directory ''/u/gnu/make''

    ```


    before anything else, and a line of the form:


    ```

    make: Leaving directory ''/u/gnu/make''

    ```


    when processing is completed.


    Normally, you do not need to specify this option because ''make'' does it for:
    ''-w'' is turned on automatically when you use the ''-c'' option, and in sub-makes.
    make will not automatically turn on ''-w'' if you use ''-s'', which is said to
    silent, or if you use ''--no-print-directory'' to explicitly disable it.


    # 5.8 Defining Canned Recipes


    When the same sequence of command is used in making various targets, you can define
    it as a canned sequence with the define directive, and refer to the canned sequence
    from the recipes for those targets. The canned sequence is actually a variable,
    so the name must not conflict with other variable names.


    Here is an example of defining a canned recipe:


    ```

    define run-yacc =

    yacc $(firstword $)

    my y.tab.c $$\ndefef

    ```


    Here run-yacc is the name of the variable being defined; endef marks the end of
    the definition; the lines in between are the commands. The define directive does
    not expand variable references and function calls in the canned sequence; the
    ''$'' characters, parentheses, variable names, and so on, become part of the variable
    you are defining. See Section 6.8 [Defining Multi-Line Variables], page 66, for
    a complete explanation of define.


    The first command in this example runs Yacc on the first prerequisite of whichever
    rule uses the canned sequence. The output file from Yacc is named ''y.tab.c''.
    The second command moves the output to the rule''s target file name.'
