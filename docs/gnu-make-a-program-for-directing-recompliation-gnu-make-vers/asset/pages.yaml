  md: 'You may notice that the export and unexport directives work in the same way
    they work in the shell, sh.


    If you want all variables to be exported by default, you can use export by itself:

    nexport


    This tells make variables which are not explicitly mentioned in an export or unexport
    directive should be exported. Any variable given in an unexport directive will
    still not be exported. If you use export by itself to export variables by default,
    variables whose names contain characters other than alphanumerics and underscores
    will not be exported unless specifically mentioned in an export directive.


    The behavior elicited by an export directive by itself was the default in older
    versions of GNU make. If your makefiles behave this way and you want to be compatible
    with old versions of make, you can write a rule for the special target EXPORT_ALL_VARIABLES
    instead of using the export directive. This will be ignored by old makes, while
    the export directive will cause a syntax error.


    Likewise, you can use export by itself to make not to export variables by default.
    Since this is the default behavior, you would only need to do this if export had
    been used by itself earlier (in an included makefile, perhaps). You cannot use
    export and unexport by themselves to have variables exported for recipes and not
    others. The export directive that appears determines the behavior for the entire
    run alike.


    As a special feature, the variable MAKELEVEL is changed when it is passed down
    level. Its value is a string which is the depth of the level as a decimal number.
    The value for the top-level make is ''0'' for a sub-make, ''2'' for a sub-sub-make,
    and so on. The incrementation happens when make sets the environment for a recipe.


    The main use of MAKEFILES is to test in a conditional directive (see Chapter 7
    [Conditional Parts of Makefiles], page 73); this way you can write a makefile
    that behaves one way if run recursively and another way if run directly by.


    You can use MAKEFILES to cause all sub-make commands to use additional makefiles.
    The value of MAKEFILES is a whitespace-separated list of file names. This variable,
    if defined in the lower-level makefile, is passed down through the environment;
    then it serves as a list of extra variables for the sub-make to read before the
    usual or specified ones. Section 3.4 [The Variables], page 13.


    # 5.7.3 Communicating Options to a Sub-make


    Flags such as ''-s'' and ''-k'' are passed automatically to the sub-make through
    the variable MAKEFLAGS. This variable is set automatically by make to contain
    the flag letters that make received. Thus, if you use ''-make -ks'' MAKEFLAGS
    gets the value ''ks''.


    As a consequence, every sub-make gets a value for MAKEFLAGS in its environment.
    It respects the flags from that value and processes them as if they had been given
    arguments. See Section 9.7 [Summary of Options], page 98.


    Like variables defined on the command line are passed to the sub-make through
    MAKEFLAGS. Words in the value of MAKEFLAGS that contain ''='', make treats as
    variable definitions just as if they appeared on the command line. See Section
    9.5 [Overriding Variables], page 97.'
