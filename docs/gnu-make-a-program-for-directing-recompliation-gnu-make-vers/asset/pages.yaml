  md: '# #11 Using make to Update Archive Files


    Archive files are files containing subfiles called *members*; they are maintained
    by the program *ar* and their main use is as subroutine libraries for linking.


    # ## 11.1 Archive Members as Targets


    An individual member of an archive file can be used as a target or prerequisite
    in *make*. You specify the member named *member* in archive file *archive* as
    follows:


    ```

    `archive(member)`

    ```


    This construct is available only in targets and prerequisites, not in recipes!
    Most programs that you might use in recipes do not support this syntax and cannot
    act directly on archives. Only *ar* and other programs specifically designed to
    operate on archives can do so. Therefore, valid edits to an archive target must
    use *ar*. For example, this rule allows to create a member *hack.o* in archive
    *foolib*'' by copying the file *hack.o*.


    ```

    foolib(hack.o) : hack.o

    ar cr foolib hack.o

    ```


    In fact, nearly all archive member targets are updated in this way and there is
    an implicit rule to do it for you. Note: The ''c'' flag to *ar* is required if
    the archive file does not already exist.


    To specify several members in the same archive, you can write the member names
    together between parentheses. For example:


    ```

    `foolib(hack.o kludge.o)`

    ```


    is equivalent to:


    ```

    foolib(hack.o) foolib(kludge.o)

    ```


    You can use shell-style wildcards in an archive member reference. See Section
    4.3 [Wildcard Characters in File Names], page 23. For example, *foolib.(*o)* expands
    to all members of the *foolib*'' archive whose members end in *.o; *foolib(hack.o)
    foolib(kludge.o)*.


    # ## 11.2 Implicit Rule for Archive Member Targets


    Recall that a target that looks like ''*a(m)*'' stands for the member named *m*
    in the archive file *a*.


    When *make* finds an implicit rule for such a target, as a special feature it
    includes implicit rules that match ''*a(m)*'', as well as those that match the
    actual target ''*a(m)*''. This rule updates the target ''*a(m)* by copying the
    file *m* into the archive. For example, it will update the archive member *foo.a(bar.o)*
    by copying the file *bar.o* into the archive *foo.a* as a member named *bar.o*.


    When this rule is chained with others'
