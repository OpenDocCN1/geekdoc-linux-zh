  md: '96 GNU make


    With the ‘-n’ flag, make prints the recipe that it would normally execute but
    usually does not execute it.


    With the ‘-t’ flag, make ignores the recipes in the rules and uses (in effect)
    the command touch for each target that needs to be made. The touch command is
    also printed, unless ‘-s’ or ‘SILENT is used. For speed, make does not actually
    invoke the touch. It does the work directly.


    With the ‘-q’ flag, make prints nothing and excludes recipes, if the exit status
    it returns zero and if the targets to be considered are already up to date. If
    the exit status is not zero, then updating needs to be done. If make encounters
    an error, the exit status is two, so you can distinguish from a target that is
    not up to date.


    It is an to run more than one of these three flags in the same invocation of make.

    The ‘-n’, ‘-t’, and ‘-q’ options do not affect lines that begin with + characters
    or contain the strings ‘MAKE’ or $(MAKE). Note that only the line containing the
    + character or the strings ‘MAKE’ or $(MAKE) is regardless of these options. Other
    lines in the rule are not run unless they begin with + or contain $(MAKE). (See
    Section 5.7.1 [How the MAKE Works], Pages, 50.)


    The ‘-t’ flag prevents phony targets (see Section 4 [Phony Targets], 29) from
    being updated, unless there are recipes beginning with + or containing $(MAKE)
    or $(MAKE).


    The ‘-w’ flag provides two features:


    +   * If you use the ‘-n’ or ‘-q’ flag, you can see what make would do if you
    were to modify some files.

    * Without the ‘-n’ or ‘-q’ flag, when make is actually executing recipes, the
    ‘-w’ flag can make direct to act if some files have been modified, without actually
    running the recipes for those files.


    Note that the options ‘-p’ and ‘-v’ allow you to obtain other information about
    make or the makefiles in use (see Section 9.7 [Summary of Options], 98).


    # 9.4 Avoiding Recompilation of Some Files


    Sometimes you may have changed a source file and you do not want to recompile
    all the files that depend on. For example, suppose you add a macro or a declaration
    to a header file that other files depend on. Being conservative, make assumes
    that any change in the header file requires recompilation of all dependent files,
    but you know that they do not need to be recompiled and you would rather waste
    the time waiting for them to compile.


    If you anticipate the problem before changing the header file, you can use the
    ‘-t’ flag. This flag makes make not to run the recipes in the rules, but to make
    the target up to date by changing its last-modification time. You would follow
    this procedure:


    +   1. Use the command ‘make’ to recompile the source files that really need recompilation,
    ensuring that the object files are up-to-date before you begin.

    2. Make the changes in the header files.

    3. Use the command ‘make -t’ to mark all the object files up to date. The next
    time you run make, the changes in the header files will not cause any recompilation.'
