    sets ''to'' to ''a.c b.c c.c''. See Section 6.5 [Setting Variables], page 63.

    A substitution reference is actually an abbreviation for the patsubst expansion

    function (see Section 8.2 [Functions for String Substitution and Analysis], page
    80). We

    provide substitution references as well as patsubst for compatibility with other
    implementations.


    Another type of substitution reference lets you use the full power of the patsubst
    function

    described above, which has the form ''$(var:a=b)'' that must contain a single

    %'' character. This case is equivalent to ''$(patsubst a,b$(var))''. See Section
    8.2

    [Functions for String Substitution and Analysis], page 80, for a description of
    the patsubst

    Function.


    For example:


    ```

    foo := a.o b.o c.o

    bar := $(foo:%.%c)

