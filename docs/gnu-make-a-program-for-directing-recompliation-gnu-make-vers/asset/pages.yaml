    If the specified name does not start with a slash, and the file is not found in
    the current directory, other directories are searched. First, any directories
    you have specified with the ''-I'' or ''--include-dir'' option are searched (see
    Section 9.7 [Summary], page 98). Then the following directories (if they exist)
    are searched, in this order: `prefix/include` (normally `/usr/local/include`),
    `/usr/gnu/include`, `/usr/local/`, `/usr/include/.


    If an included makefile is not found in any of the directories, a warning message
    is generated, but it is not an immediately fatal error; processing of the makefile
    continues. Once it has finished reading makefiles, make will try to remake any
    that are out of date or direct (see Section 3.5 [How Makefiles Are Remade], page
    14). Only after it has tried to find a way to remake a makefile and failed, will
    make diagnose the missing makefile as a fatal error.


    If you want to make ignore a makefile which does not exist or cannot be removed,
    with no error message, use the --include directive instead of include, like this:


    ```

    -include filenames ...

    ```


    This acts like include in every way except there is no error (even a warning)
    if any of the *filenames (or any prerequisites of the *filenames) do not exist
    and cannot be remaded.


    For compatibility with some other make implementations, include is another name
    for -include.


    # 3.4 The MAKEFILES


    If the environment variable MAKEFILES is defined, make considers its value as
    a list of names (separated by whitespace) of makefiles to be read before the others.
    This works much like the include directive: various directories are searched for
    those files (see Section 3.3 [Including Other Makefiles], page 12). In addition,
    the default is never taken from one of these (or any makefile included by them)
    and then it is not an error if the files listed in MAKEFILES are not found.


    The main use of MAKEFILES is in communication recursive invocations of make (see
    Section 5.7 [Recursive Use of make], page 49). It is usually not desirable to
    set the environment variable before a top-level invocation of make, because it
    is better not to mess with a makefile from outside. However, if you are running
    make without a makefile, a makefile in MAKEFILES can do useful things to help
    the built-in implicit rules work better, such as searching paths (see Section
    4.4 [Directory Search], page 25).


