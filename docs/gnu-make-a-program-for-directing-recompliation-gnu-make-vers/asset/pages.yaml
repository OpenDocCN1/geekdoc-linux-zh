    (Don''t actually write your makefiles this way!)


    A dollar sign followed by a character other than a dollar sign, open-parenthesis
    or brace treats that single character as the variable name. Thus, you could reference
    the variable x with ''$x''. However, this practice is strictly discouraged, except
