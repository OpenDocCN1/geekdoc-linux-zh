  md: 'Chapter 10: Using Implicit Rule


    # 10.8 Implicit Rule Algorithm


    Here is the procedure make uses for searching for a target t. This procedure is
    followed for each double-colon rule with no recipe, for each target of ordinary
    rules none of which have a recipe, and for each prerequisite that is not the target
    of any rule. It is also recursively for prerequisites that come from implicit
    rules, in the search for a chain of rules.


    Suffix rules are not mentioned in this algorithm because suffix rules are converted
    to equivalent rules when the makefiles have been read.


    For an archive member of the form ‘archive (member)’, the following algorithm
    is run twice, first using the entity target name t, and second using ‘member)’
    as the target if t first not run.


    +   1. Split t into a directory, called d, and the rest, called n. For example,
    if t is ''src/foo.o'', then d is ''src'' and n is ''foo.o''.

    2. Make a list of all the pattern rules one of whose targets matches t or n. If
    the target pattern contains a slash, it is matched against; otherwise, against
    n.

    3. If any rule in list is not a match-anything rule, then remove all nonterminal
    match-anything rules from the list.

    4. Remove from all rules with no recipe.

    5. For each pattern rule in the list:


    +   a. Find the stem s, which is the nonempty part of t or n matched by the ''%''
    in the target pattern.

    b. Compute the prerequisite names by substituting s for ''%''; if the target pattern
    does not contain a slash, append d to the front of each prerequisite name.

    c. Test whether or all the prerequisites exist or ought to exist. (If a file name
    is mentioned in the makefile as a target or as an explicit prerequisite, then
    we say it ought to exist).

    d. If all prerequisites exist or ought to exist, or there are no prerequisites,
    then this rule applies.

    6. If no pattern rule has been found so, try harder. For each pattern rule in
    the list:

    a. If the rule is terminal, ignore it and go to the next rule.

    b. Compute the prerequisite names as before.

    c. Test whether all the prerequisites exist or ought to exist.

    d. For each prerequisite that does not exist, follow this algorithm recursively
    to see if the prerequisite can be made by an implicit rule.

    e. If all prerequisites exist, ought to exist, or can be made by implicit rules,
    then this rule applies.


