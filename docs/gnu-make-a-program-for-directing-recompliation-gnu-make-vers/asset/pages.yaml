  md: 'The call function can be nested. Each recursive invocation gets its own local
    values for $(1), etc. mask the values of higher-level call. For example, here
    is an implementation of a map function:


    ```

    map = $(foreach a,$(),call $(1),$(a)))

    ```


    Now you can map a function that normally takes one argument, such as origin, to
    multiply multiple values in one step:


    ```

    o = $(call map.origin,o make MAKE)

    ```


    and end up with o containing something like ''file default''.

    A caution: be careful when adding whitespace to the arguments to call. As other
    functions, any whitespace contained in the second and subsequent arguments is
    kept; this can cause strange effects. It''s generally safest to remove all extraneous
    whitespace when providing parameters to call.


    # 8.7 The Value Function


    The value function provides a way to use the value of a variable without having
    it expanded. Please note that this does not undo expansions which have already
    occurred; if you define a simply expanded variable is expanded during the definition;
    in that case the value function will return the same result as the variable directly.

    The syntax of the value function is:


    ```

    $(variable)

    ```


    Note that variable is the name of a variable; not a reference to it. Therefore
    you would not use a ''$'' or parentheses when writing it. You can, however, use
    a variable reference in the name if you want the name not to be a constant.

    The result of this function is a string containing the value of variable, without
    any expansion occurring. For example, in this makefile:


    ```

    FOO = $PATH

    ```


    ```

    all:


    @echo $(FOO)

    @echo $(value)

    ```


    The first output line will be ATH, since the ''$'' would be expanded as a make
    variable, while the second output line would be the current value of your $PATH
    environment variable, since the value function avoided the expansion.


    The value function is often used in conjunction with the eval function (see Section
    8.8 [Eval Function], 88).


    # 8.8 The Eval Function


    The eval function is very special: it allows you to define new makefile constructs
    that are not constant; as the result of evaluating other variables and functions.
    The argument to the eval function is expanded, then results of that expansion
    are parsed as make syntax. The expanded results can define new make variables,
    targets, implicit or explicit rules, etc.


    The result of the eval function is always the empty string; thus, it can be placed
    virtually anywhere in a makefile without causing syntax errors.'
