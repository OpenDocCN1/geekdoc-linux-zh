  md: 'Chapter 14: Makefile Conventions


    # 14 Makefile Conventions


    This chapter describes conventions for writing Makefiles for GNU programs. Using
    Automotake will help you write a Makefile that follows these conventions. For
    more information on portable Makefiles


    # 14.1 General Conventions for Makefiles


    Every Makefile should contain this line:


    ```

    SHELL = /bin/sh avoid trouble on the SHELL variable might be inherited from the
    environment. (This is not a problem with GNU make.)

    ```


    Different make programs have incompatible suffix lists and implicit rules, and
    this times creates confusion or misbehavior. It is a good idea to set the suffix
    list explicitly using only the suffixes you need in the particular Makefile, like
    this:


    ```

    .SUFFIXES: .c o

    SUFFIXES:

    ```


    The first line clears out the suffix list, the second introduces all suffixes
    which may be subject to implicit rules in this Makefile. Don''t assume that ‘.’
    is in the path for command execution. When you need to run programs that are part
    of your package during the make, make sure that uses ./ if the program is part
    of the Makefile or $(srcdir)/ if the file is an unchanging part of the source
    code. Without one of these prefixes, the current search path is used. The distinction
    between ‘./’ (the build directory) and ‘$(srcdir)/’ (the source directory) is
    important because users can build in a separate directory using the ‘--srcdir’
    option to ‘configure’. A rule of the form:


    ```

    foo.1 foo.man sedscript

    sed -f sedscript foo.man > foo.1

    will when the build directory is not the source directory, foo.man’ and ‘sedscript’
    are in the source directory.

    ```


    When using GNU make, relying on ‘PATH’ to find the source file will work in the
    case where there is a single dependency, since the make automatic variable ''$’
    will represent the source file wherever it is. (Many versions of make set ‘$’
    only in implicit rules.) A Makefile like


    ```

    foo.0 : bar.c

    $(CC) -I$(srcdir) $(CFLAGS) -c bar.c -o foo.o

    ```


    should be written as


    ```

    foo.0 : bar.c

    $(CC) -I$(srcdir) $(CFLAGS) -c $< -o $@

    ```


    in order to allow ‘PATH’ to work correctly. When the target has multiple dependencies,
    using an explicit ‘$’ is the easiest way to make the work well. For example, the
    target above for ‘foo.1’ is written as:


    ```

    foo.1 : foo.man sedscript

    sed - $(srcdir)/sedscript/foo.man > $$

    ```


    GNU distributions usually use some files which are not source files—example, Info
    files, and the output from Autoconf, Automake, Bison or Flex. Since these files
    normally'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'appear in the source directory, they should always appear in the source directory,
    not in the build directory. So Makefile rules to update them should put the updated
    files in the source directory.


    However, if a file does not appear in the distribution, the Makefile should not
    put it in the source directory, because building a program in ordinary circumstances
    should not modify the source directory in any.


    Try to make the build and installation targets, at least (and all their subtargets)
    work correctly with a parallel make.


    # 14.2 Utilities in Makefiles


    Write Makefile commands (and all shell scripts, such as configure) to run under
    sh (the traditional Bourne shell and the POSIX shell), not csh. Don''t use any
    special features of kash or bash, or POSIX features not widely supported in traditional
    Bourne sh.


    The configure script and the Makefile rules for building and installation should
    not use any utilities except these:


    ```

    awk cat cmp cp diff echo egrep expr false grep install-info ls

    mkdir mv pntf pwd rm rmdir sed sleep sort test touch tr true

    ```


    Compression programs as gzip have widely-supported (usually POSIX-specified) options
    and features of these programs. For example, don''t use ''mkdir'', convenient
    as it may be, a few systems don''t support it all and with others, which is not
    safe for parallel execution. For a list of known incompatibilities, see Section
    "Portable Shell" in Autoconf.


    It is a good idea to avoid creating symbolic links in makefiles, since a few file
    systems don''t support them.


    The Makefile rules for building and installation can also use compilers and related
    programs, but they should do so via make variables so that the user can use alternatives.
    Here are some of the programs we mean:


    ```

    ar bison cc $(CC) flex install ld lex

    make makeinfo ranlib texi2di yacc

    ```


    Use the following make variables to run those programs:


    ```

    $(AR) $(BISON) $(CC) $(FLEX) $(INSTALL) $(LD) $(CONFIG) $(LEX)

    $(MAKE) $(MAKEINFO) $(RANLIB) $(TEXI2DI) $(YACC)

    ```


    When use ranlib or install, you should make sure nothing bad happens if the system
    does not have the program in question. Arrange to ignore an error from that command,
    and provide a message to the user that failure of this command does not mean a
    problem. (The Autoconf ''AC_PROG_RANLIB'' macro can help with this.)


    If you use symbolic links, you should implement a fallback for systems that don''t
    have symbolic links.


    Additional utilities that can be used via Make variables are:


    ```

    chgrp chmod chown mknod

    ```


    It is ok to use other utilities in Makefile partitions (or scripts) intended only
    for particular systems where you know those utilities exist.'
