  md: '# Appendix B Errors Generated by Make


    Here is a list of the more more common errors you might see generated by make,
    and some information about what they mean and how to fix them.


    Sometimes make errors are not fatal, especially in the presence of a - prefix
    on a recipe line, or the -k command line option. Errors that are fatal are prefixed
    with the string ***.


    Error messages are all prefixed with the name of the program (usually ‘make’),
    or, if the error is found in a makefile, the name of the file and linenumber containing
    the problem.


    In the table below, these common prefixes are left off.


    +   [foo] Error NW

    [foo] signal description


    These errors are not really make errors at all. They mean that a program make
    invoked as part of a recipe returned a non-zero error code (‘Error NW’), which
    make interprets as failure, or it exited in some other abnormal fashion (with
    a signal of some type). See Section 5.5 [Errors in Recipes], page 48.


    If no *** is attached to the message, then the subprocess failed but the rule
    in the makefile was prefixed with the - special character, so make ignored the
    error.


    +   missing separator. Stop.’

    miss separator (did make TAB instead of 8 spaces?)


    This means that make could not understand much of anything the makefile line it
    just uses for various separators (; =, recipe prefix characters), to indicate
    what kind of line it’s parsing. This message means it couldn’t find a valid one.


    One of the most common reasons for this is that you (or perhaps your oh-so-helpful
    editor, as is the case with MS-Windows editors) attempted to indent your recipe
    with spaces instead of a tab character. In this case, make will use the second
    form of the error above. Remember that every line in the recipe must begin with
    a tab character (unless you .RECPREFIX; see Section 6.4 [Special Variables], page
    70). Eight spaces do not count. See Section 4.1 [Rule Syntax], page 21.


    +   recipe commences before first target. Stop.’nmissing rule before recipe. Stop.


    This means the first thing in the makefile seems to be part of a recipe: it begins
    with a recipe prefix character and doesn''t appear to be a make directive (such
    as a variable assignment). Recipes must always be associated with a target.


    The second form is generated if the line has a semicolon as the first whitespace
    character; make interprets this to mean you left out the "target: prerequisite"
    section of a rule. See Section 4.1 [Rule Syntax], page 21.'
  merge: -1
