    page 91.) This example also shows use of the variable MAKELEVEL, which is changed
    when it is passed down from level to level. (See Section 5.7.2 [Communicating
    to a Sub-make], page 50, for information about MAKELEVEL.)


    ```

    ifeq

    whoami

    := $(whoami)

    host-type := $(shell arch)

    MAKE := $(MAKE) host-type whoami=${whoami}

    endif

    ```


    An advantage of this use of '':='' is that a typical ''descend into a directory''
    recipe looks like this:


    ```

    $(subdirs):

    $(MAKE) -C $0 all

    ```


    Simply expanded variables generally make complicated Makefile programming more
    predictable because they allow you to redefine a variable using its own value
    (or value is processed in some way by the expansion functions) and to use the
    expansion functions much more efficiently (see Chapter 8 [Functions for Transforming
    Text]


    You can also use to control leading whitespace into variable values. Leading whitespace
    are discarded from your input before substitution of references and calls; this
