  md: '# 5 Writing Recipes in Rules


    The rule of a recipe consists of one or more shell commands to be executed, one
    at a time, in the order they appear. Typically, the result of executing these
    commands is that the target of the rule is brought to date


    Users use many different shell programs, but recipes in makefiles are always interpreted
    by `/bin/sh` unless the makefile specifies otherwise. See Section 5.3 [Recipe
    Execution], page 44.


    # 5.1 Recipe Syntax


    Makefiles have the unusual property that there are really two distinct syntaxes
    in one file. The makefile uses `make` syntax (see Chapter 3 [Writing Makefiles],
    page 11). However, recipes are meant to be interpreted by the shell and so they
    are written using shell syntax. The make program does not try to understand shell
    syntax: it performs only a few specific translations on the content of the recipe
    before handing it to the shell.


    Each line in the recipe must start with a tab (or the first character in the value
    of the `RECIPEPREFIX` variable; see Section 6.14 [Special Variables], page 70),
    except that the first recipe line may be attached to the target-and-prerequisite
    line with a semicolon in between. Any line in the makefile that begins with a
    tab and appears in a “rule context” (that is, after a rule has been started until
    another rule or variable definition) will be considered part of that recipe. Blank
    lines and lines of comments may appear among the recipe lines; they are ignored.


    Some consequences of these rules include:


    +   - A blank line with a tab is not blank: it''s an empty recipe (see Section
    5.9 [Empty Recipes], page 55).

    - A comment in a recipe is not a make comment; it will be passed to the shell
    as-is. Whether the shell treats it as a comment or not depends on your shell.

    - A variable definition in a “rule context” that is indented by a tab as the first
    character on the line, will be considered part of a recipe, not a make variable,
    and will be passed to the shell.

    - A conditional expression (`ifdef, ifeq. see Section 7.2 [Syntax of Conditionals],
    page 74) in a “rule context” that is indented by a tab as the first character
    on the line, will be considered part of recipe and will be passed to the shell.


    # 5.1.1 Splitting Recipe Lines


    One of the ways in which `make` does interpret is checking for a backslash before
    the newline. In normal make syntax, a single recipe line can be split into multiple
    physical lines in the makefile by placing a backslash before each newline. A sequence
    of lines like this is considered a single recipe line, and one instance of the
    shell will be invoked to run it.


