- img_proc: true
  md: '# Chapter 5: Writing Recipes in Rules


    The options ''-C'', ''-f'', ''-o'', and ''-W'' are not put into MAKEFLAGS; these
    options are not passed down.


    The ''-j'' option is a special case (see Section 5.4 [Parallel Execution], page
    47). If you set it to numeric value ''N'' and your operating system supports it
    (most UNIX system will; otherwise won''t), the parent `make` and all the sub-makes
    will communicate to ensure that there are only ''N'' jobs running at the same
    time between all. Note that any job that is marked recursive (see Section 9.3
    [Instead of Executing Recipes], page 95) doesn''t count against the total jobs
    (otherwise we get ''N'' sub-makes running and no slots left over for any work!)


    If your operating system doesn''t support the above, then ''-j 1'' is always put
    into MAKEFLAGS of the value you specified. This is because the ''-j'' option were
    passed down to sub-makes, which would get many more jobs running in parallel than
    you asked. If you give ''-j'' with no numeric argument, meaning to run as many
    jobs as possible in parallel, this is passed down, since infinite are no more
    than one.


    If you do not want to pass the other flags down, you must change the value of
    MAKEFLAGS, like this:


    subsystem:


    ```

    cd subdir && $$(MAKE) MAKEFLAGS=

    ```


    The command line definitions really appear in the variable MAKEOVERRIDES, and
    MAKEFLAGS contains a reference to this variable. If you want to pass flags down
    normally, but don''t want to pass down the command line variable definitions,
    you can reset MAKEOVERRIDES to empty, like this:


    MAKEOVERRIDES =


    This is not useful to do. However, some systems have a small fixed limit on the
    size of the environment, and putting so much into the value of MAKEFLAGS can exceed
    it. If you see the error `Arg list too long`, this may be the problem. For strict
    compliance with POSIX, 2, changing MAKEOVERRIDES does not affect MAKEFLAGS if
    the specified ''.TARGET'' appears in the makefile. You probably do not care about
    this.


    A variable MAKEFLAGS exists, for historical compatibility. It has the same value
    as MAKEFLAGS except that it does not contain the command line variable definitions,
    and it always begins with a hyphen unless it is empty (MAKEFLAGS begins with a
    hyphen when it begins with an option that has no single-letter version, such as
    `--undefined-variables`). MAKEFLAGS was traditionally used in the recursive make
    command, like this:


    subsystem:


    ```

    cd subdir && $$(MAKE) $(MAKEFLAGS)

    ```


    but now MAKEFLAGS makes this redundant. If you want your makefiles to be compatible
    with old make processes, use this technique; it will work fine with more modern
    make versions


    The MAKEFLAGS variable can also be useful if you want to have certain options,
    such as ''-k'' (see Section 9.7 [Summary of Options], page 98), set each time
    you run make. You can also set MAKEFLAGS in a makefile, to specify additional
    flags that should be in effect for that makefile. (Note that you cannot use MFLAGS
    this. That variable is only for compatibility; make does not interpret a value
    you set in any way.)'
