    \ executables, the install-strip target cannot just refer to the install target;\
    \ it has to strip the executables but not the scripts.\n\ninstall-strip should\
    \ not strip executables in the build directory which are copied for installation.\
    \ It should strip only the scripts that are installed.\n\nNormally we do not recommend\
    \ stripping an executable unless you are sure the program has no bugs. However,\
    \ it can be reasonable to leave a stripped executable for actual execution while\
    \ saving the unstripped executable elsewhere in case there is a bug.\n\n# 'clean'\n\
    \nDelete all files in the current directory that are normally created by building\
    \ the program. Also delete files in other directories if they are created by this\
    \ makefile. However, do not delete the files that record the configuration. Also\
    \ preserve files that could be made by building, but normally aren't because the\
    \ distribution comes with them. There is no need to delete parent directories\
    \ that were created with 'mkdir -p', since they could have existed.\n\nDelete\
    \ .dvi files if they are not part of the distribution.\n\n# 'distclean'\n\nDelete\
    \ all files in the current directory (of this makefile) that are created by configuring\
    \ or building the program. If you have unpacked the source and built the program\
    \ without creating any other files, 'make distclean' should leave only the files\
    \ that were in the distribution. However, there is no need to delete parent directories\
    \ that were created with 'mkdir -p', since they could have existed.\n\n# 'mostlyclean'\n\
    \nLike 'clean', but may refrain from deleting few files that people normally don't\
    \ want to recompile. For example, the 'mostlyclean' target for GCC does not delete\
    \ 'libgcc.a', because recompiling is rarely necessary and takes a lot of time."
