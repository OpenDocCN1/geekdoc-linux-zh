    and update it. If a makefile has a rule which shows how to update (if found in
    that very makefile or an implicit rule applies to it) Chapter 10 [Implicit Rules],
    page 103), it will be updated if necessary. After all makefiles have been checked,
    if any have actually changed, make starts with a clean state and reads all the
    makefiles again. (It will also attempt to check each of them again, but normally
    will not change them, since they are already up to date.)


    If you know that one or more of your makefiles cannot be remade and you want to
    keep from performing an implicit rule on search, then for efficiency reasons,
