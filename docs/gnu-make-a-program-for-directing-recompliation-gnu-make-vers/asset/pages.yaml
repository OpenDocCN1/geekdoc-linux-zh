  md: '# Chapter 11: Using make to Update Archive Files


    (see Section 11.2 [Archive Update], page 121). But they are retained for compatibility
    with other makes.


    To write a rule for archives, you simply write a suffix using the target suffix
    ''.a'' (the usual suffix for archive files). For example, here is the old-fashioned
    suffix rule to update an archive from C source files:


    .c a:


    ```

    $$(CC) $(CFLAGS) $(CPPFLAGS) -c $< -o $*.o

    $(AR) r $ $*.o

    $(RM) $*.o

    ```


    This works just as if you had written the pattern rule:


    ```

    (%.o) : %.c

    $$$(CC) $(CFLAGS) $(CPPFLAGS) -c $< -o $*.o

    $(AR) r $ $*.o

    $(RM) $*.o

    ```


    In fact, this is just what make does when it sees a suffix ''.a'' as the target
    suffix. Double-suffix rule ''.x.a'' is converted to a pattern rule with the target
    pattern ''%.o'' and a prerequisite pattern of ''%.x''.


    Since you might want to use ''.a'' as the suffix for some other kind of file,
    make also converts archive suffix rules to pattern rules in the normal way (see
    Section 10.7 [Suffix Rules], page 117). Thus a double-suffix rule ''.x.a'' produces
    two pattern rules: ''{%.o}: ''%.x'' and ''%.x.a: %.x''.'
