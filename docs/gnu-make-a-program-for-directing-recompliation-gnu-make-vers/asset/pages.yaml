    116, for information on canceling or overriding an implicit rule. The ''-r'' or
    ''--no-built-rules'' option controls all predefined rules.


    This manual documents the default rules available on POSIX-based operating systems.
    Other operating systems, such as VMS, Windows, OS/2, etc., have different sets
    of default rules. To see the full list of default rules run ''make -p'' in a directory
