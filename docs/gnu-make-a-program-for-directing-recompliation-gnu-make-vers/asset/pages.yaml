    # 10.4 Chains of Implicit Rules


    Sometimes a file can be made by a sequence of implicit rules. For example, a file
    ''n.o'' could be made from ''n.y'' by running first Yacc and cc. Such a sequence
    is called a chain.


    If the file ''n.c'' exists, is mentioned in the makefile, no special searching
    is required: make finds that the object file can be made by compilation from ''n.c'';
    later on, when considering how to make ''n.c'', the rule using Yacc is updated.
    Ultimately both ''n.c'' and ''n.o'' are updated.


    However, even if ''n.c'' does not exist and is not mentioned, make knows how to
    envision it as the missing link between ''n.o'' and ''n.y''. In this case, ''n.c''
    is called an intermediate file. Once make has decided to use the intermediate
    file, it is entered into the data base as it had been mentioned in the makefile,
    along with the implicit rule that says how to create it.


    Intermediate files are remain using their rules just like all other files. But
    intermediate files are treated differently in two ways.'
