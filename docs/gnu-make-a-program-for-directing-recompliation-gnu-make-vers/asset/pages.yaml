    More than one pattern rule may match a target. In this case make will choose the
    "best fit" rule. See Section 10.4 [How Patterns Match], page 117.


    Pattern rules may have many targets. Unlike normal rules, many different files
    with the same prerequisites and recipe. If a pattern rule has multiple targets,
    make knows that the rule''s recipe is responsible for making all of the targets.
    The recipe is executed only once to make all the targets. When searching for a
    pattern rule to match, the targets of a rule other than the one that matches the
    target in need of rule are incidental: make worries only about giving a recipe
    and prerequisites to the file presently question. However, when this file''s recipe
    is run, the other targets are marked as having updated.


