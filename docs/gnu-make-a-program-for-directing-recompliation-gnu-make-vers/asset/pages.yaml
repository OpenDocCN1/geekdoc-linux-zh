  md: '# Chapter 12: Features of GNU make


    127


    +   * Conditional execution.

    This feature has been implemented numerous times in various versions of make;
    it seems a natural extension derived from the features of the C preprocessor and
    similar macro languages and is not a revolutionary concept. See [Chapter 7 [Conditional
    Parts of Makefiles],page 73).

    * Specify a path for included makefiles. See [Section 3.3 [Including Other Makefiles],page
    12).

    * Specify extra makefiles to read with an environment variable. See [Section 3.4
    [The Variable MAKEFILES],page 13).

    * Strip sequences of ''./'' from file names, so that ''./file'' and ''file'' are
    considered to be the same.

    * Use a special search method for library prerequisites in the form ''-name''.
    See [Section 4.4.6 [Directory Search for Link Libraries],page 117)

    * Allow suffixes for suffix rules (see [Section 10.7 [Old-Fashioned Suffix Rules],
    to contain any characters. In other versions of make, they must begin with ''.''
    and not contain any ''/'' characters.

    * Keep track of the current level of make using the variable MAKELEVEL. See [Section
    5.7 [Recursive Use of make],page 49).

    * Provide any goals given on the command line in the variable MAKECMDGOALS. See
    [Section 9.2 [Arguments to Specify the Goals],page 93).

    * Specify static pattern rules. See [Section 4.11 [Static Pattern Rules],page
    36).

    * Provide selective vpath search. See [Section 4.4 [Searching Directories for
    Prerequisites],page 57).

    * Provide computed variable references. See [Section 6.1 [Basics of Variable References],page
    57).

    * Update makefiles. See [Section 3.5 [How Makefiles Are Remade],page 14]. System
    make has a very, limited form of this functionality that it will check out SCCS
    for makefiles.

    * Various new built-in rules. See [Section 10.2 [Catalogue of Implicit Rules],page
    104).

    * The built-in variable ''MAKE_VERSION'' gives the version number of make.'
