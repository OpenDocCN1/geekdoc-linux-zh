    ''%'' is called the stem.


    +   % in a pattern rule of the same stem for the stem that was matched by ''%''
    in the target. In order for the pattern rule to apply, its target must match the
    file name under consideration and all of its prerequisites (after pattern substitution)
    must match file name that exists or can be made. These files become prerequisites
    of the target.


    Thus, a rule of form


    ```

    % : %.c; recipe ..

    ```


    specifies how to make a file ''.o'', with another file ''.c'' as its prerequisite,
    provided that ''.c'' exists or can be made.


    There may also be prerequisites that do not use ''%''; such a prerequisite attaches
