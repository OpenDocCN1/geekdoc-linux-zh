  md: '# 3.2 What Name to Give Your Makefile


    By default, when make looks for the makefile, it tries the following names, in
    order:

    ''GNU'', ''makefile'' and ''Makefile''.


    Normally you should call your makefile ''makefile'' or ''Makefile''. (We recommend

    Makefile because it appears prominently near the beginning of a directory list,
    right

    near other important files as ''README.'') The first checked, ''makefile'', is
    not

    recommended for most makefiles. You should use this name if you have a makefile
    that is

    specific to GNU make, and will not be understood by other versions of make. Other
    make

    programs look for ''makefile'' and ''Makefile'', but not ''GNUmakefile''.


    If make finds none of these names, it does not use any makefile. You must specify

    a goal with a command argument, and make will attempt to figure out how to remake
    it

    using only its built-in rules. See Chapter 10 (Using Implicit Rules), page 103


    If you want to use a nonstandard name for yourmakefile, you can specify the makefile

    with the ''-f'' or ''--file'' option. The arguments ''-f name'' or ''--file=name''
    will tell make

    to read the file name as the makefile. If you use more than one ''-f'' or ''--file''
    option,

    y can specify several makefiles. All the makefiles are effectively concatenated
    in the order

    specified. The default make names ''GNUmakefile'', ''makefile'' and ''Makefile''
    are not

    checked automatically unless you specify ''-f'' or ''--file''.


    # 3.3 Including Other Makefiles


    The include directive tells make to suspend reading the current makefile and read
    one or

    other makefiles before continuing. The directive is a line in the makefile that
    looks

    like this:


    ```

    include filenames...

    ```


    filenames can contain file name patterns. If filenames is empty, nothing is included

    and no error is printed.


    Extra spaces are allowed and ignored at the beginning of the line, the first character

    mot be a tab (or the value of .RECIPEPREFIX)-if the line begins with a tab, it
    will

    be considered a recipe line. Whitespace is required between include and the filename,

    and between filenames; extra whitespace is ignored and at the end of the line.

    A comment starting with # is allowed at the end of the line. If the file names
    contain any

    variable or function references, they are expanded. See Chapter 6 [How to Use
    Variables],

    page 57.


    For example, if you have three ''.mk files, ''a.mk'', ''b.mk'', and ''c.mk'',
    and $(bar) expands

    to bash, then the following expression


    ```

    include *.mk ($bar)

    ```


    is equivalent to


    ```

    include a.mk b.mk c.mk bash bash

    ```


    When make processes an include directive, it suspends reading of the containing
    makefile

    and reads from each listed file in turn. When that is finished, make resumes reading
    the\makefile in which the directive appears.


    One occasion for using include directives is when several programs, handled by
    indi-\ividual makefiles in various directories, need to use a common set of variable
    definitions (see'
