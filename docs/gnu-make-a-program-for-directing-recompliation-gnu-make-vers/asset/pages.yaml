    in the rule for ''foo'', so that creating ''*.o'' files becomes a prerequisite
    of ''foo'' and will be recompiled if necessary.


    But what if you delete all the *.o files? When a wildcard matches no files, it
    is left as is, so then ''foo'' will depend on the oddly-named file ''*.o''. Since
