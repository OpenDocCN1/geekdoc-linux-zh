    # Assembling and preprocessing assembler programs


    ''n.o'' is made automatically from ''n.s'' by running the assembler, as. The precise
    recipe used is ''$(AS) $(ASFLAGS).


    ''n.s'' is made automatically from ''n.s'' by running the C preprocessor, cpp.
    The precise recipe used is ''$(CPP) $(CPPFLAGS)


    # Linking a single object file


    ''n.o'' is made automatically from ''n.o'' by running the linker (usually called
    ld1) via the C compiler. The precise recipe used is ''$(CC) $(LOFLAGS) $(LDLIBS).


    This rule does the right thing for a simple program with only one source file.
    It will also do the right thing if there are multiple object files (presumably
    coming from various source files), one of which has a name matching that the executable
    file. Thus.


    ```

    x: y.o z.o

    ```


    when ''x.c'', ''y.c'' and ''z.c'' will all execute:'
