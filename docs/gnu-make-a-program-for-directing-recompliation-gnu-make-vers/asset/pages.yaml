  md: '# Chapter 9: How to Run make


    If you have already changed the header file at a time when some files need recompilation,
    it is too late to do. Instead, use the ''-o file'' flag, which marks a specified
    file as ''old'' (see Section 9.7 [Summary of Options], page 98). This means that
    the file itself will not be remade, and nothing else be remade on its account.
    Follow this procedure:


    +   1. Recompile the source files that need compilation for reasons independent
    of the particular header file, with `make -o headerfile`. If several header files
    are involved, use a separate ''-o'' option for each header file.

    2. Touch all object files with `make -t`.


    # 9.5 Overriding Variables


    An argument that contains ''v='' specifies the value of a variable: ''v=x'' sets
    the value of the variable to x. If you specify a value in this, all ordinary assignments
    of the variable in the make are ignored; we say them overridden by the command
    line argument.


    The common way to use this facility is to pass extra flags to compilers. For example,
    in a properly written makefile, the CFLAGS is included in each recipe that runs
    the compiler, so a file foo.c would be compiled like this:


    ```

    cc - $(CFLAGS) foo.c

    ```


    Thus, whatever you set for CFLAGS affects each compilation occurs. The makefile
    properly specifies the usual value for CFLAGS, like this:


    ```

    CFLAGS=

    ```


    Each time you make run, you can override this value if you wish. For example,
    if you say ''make CFLAGS=-g -O0'', each compilation will be done with ''cc -g
    -O''. (This also illustrates how you can use the shell to enclose object and other
    special characters in the value of a variable when you override it).


    The variable CFLAGS is one of many standard variables that exist just so that
    you can change them this way. See Section 10.3 [Variables Used by Implicit Rules],
    page 107 for a complete list.


    You can also program the makefile to look at additional variables of your own,
    giving the user the ability to control other aspects of the make works by changing
    the variables.


    When you override a variable with a command line argument, you can define either
    a recursively-expanded variable or a simply-expanded variable. The examples above
    make a recursively-expanded variable; to make a simply-expanded variable, write
    '':='' instead of ''.''; unless you want to include a variable reference or function
    call in the value you specify, it makes no difference which kind of variable you
    create.


    There is one way that the makefile can change a variable that you have overridden.
    It is to use the override directive, which is a line that looks like this: ''override
    variable = value'' (see Section 6.7 [The override Directive], page 65).'
