    # 8.11 The Shell Function


    The shell function is unlike any other function other the the wildcard function
    (see

    Section 4.3 [The Function wildcard], page 24) in it communicates with the world

    outside of make.


    The shell function performs the same function as backquotes (``) perform in most

    it does command expansion. This means that it treats an argument as a

    command and evaluates to the output. The only processing does on

    is is to convert each newline (carriage-return / newline) to a single space.

    if there is a trailing (carriage-return) and newline it will simply be removed.


    The commands run by the shell function are run when the function calls are

