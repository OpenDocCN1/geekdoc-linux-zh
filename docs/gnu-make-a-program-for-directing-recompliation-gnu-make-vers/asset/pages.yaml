  md: '# Chapter 6: How to Use Variables


    Simply expanded variables are defined by lines using '':='' (see Section 6.5 [Setting
    Variables], page 63). The value of a simply expanded variable is scanned once
    and for all, expanding references to other variables and functions, when the variable
    is defined. The actual value of the simply expanded variable is the result of
    expanding the text that you write. It does not contain references to other variables;
    it contains their values as of the time this variable was defined. Therefore,


    ```

    x := foo

    y := $(bar)

    x := later

