  md: 'LocalForward:

    - 22 localhost:2222

    - 403 localhost:4003


    renders as:


    LocalForward 22 localhost:2222

    LocalForward 403 localhost:4003


    > NOTE

    The configuration options are case sensitive.


    Variables for the SSH System Role


    # ssh_user


    You can define an existing user name for which the system role modifies user-specific
    configuration. The user-specific configuration is saved in ~/.ssh/config of the
    given user. The default value is null, which modifies global configuration for
    all users.


    # ssh_skip_defaults


    Defaults to auto. If set to auto, the system role writes the system-wide configuration
    file /etc/ssh/ssh_config and keeps RHEL defaults defined there. Creating a drop-in
    configuration file, for example by defining the drop_in_name variable, automatically
    disables the ssh_skip_defaults variable.


    # ssh_drop_in_name


    Defines the name for drop-in configuration file, which is placed in the system-wide
    drop-in directory. The name is used in the template /etc/ssh/ssh_config/(drop_in_name).conf
    to reference the configuration file to be modified. If the system does not support
    drop-in directories, the default value is null. If the system supports drop-in
    directories, the default value is 00-able.


    > WARNING

    If the system does not support drop-in directories, setting this option will make
    the play fail.


    The suggested format is NN-name, where NN is a two-digit number used for ordering
    the configuration files and name is any descriptive name for the content or the
    owner of the file.


    # ssh


    A dict that contains configuration options and their respective values.


    # ssh_OptionName


    You can define options by using simple variables consisting of the ssh_prefix
    and the option instead of a dict. The simple variables override values in the
    ssh dict.


    # ssh_additional_packages'
