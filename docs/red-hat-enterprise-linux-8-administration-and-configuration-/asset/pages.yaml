    2. Search for the MESSAGE field of thelog-rec recorded journal entry.


    ```

    # journalctl -xl EXE=/usr/bin/tlog-rec-session

    ```


    # 16.6. WATCHING A RECORDED SESSION USING THE CLI


    You can play a user session recording from a journal using the command-line interface
    (CLI).


    Prerequisites


    +   * You have recorded a user session. Recording a session using the deployed
    tlog system role in the CLI.


    Procedure


    +   1. On the CLI terminal, play the user session recording:


    ```

    # journalctl -o verbose -r

    ```


    +   2. Search for the tlog recording:


    ```

    $ tlog-rec

    ```


    You can see details such as:


    +   * The username for the user session recording

    * The out_txt field, a raw output encode of the recorded session

    * The identifier number TLOG_REC=ID_number


    +   3. Copy the identifier number TLOG_REC=ID_number.


    +   4. Playback the recording using the identifier number TLOG_REC=ID_number.


    ```

    # tlog-play -r journal -M TLOG_REC=ID_number

    ```


    As a result, you can see the user session recording terminal output being played
    back.'
