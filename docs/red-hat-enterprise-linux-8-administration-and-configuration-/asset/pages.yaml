  md: '# # CHAPTER 13. MANAGING LOCAL STORAGE USING RHEL SYSTEM ROLES


    To manage LVM and file systems (FS) using Ansible, you can use the storage role,
    which is one of the RHEL System Roles available in RHEL 8.


    Using the storage role enables you to automate administration of file systems
    on disks and logical volumes on multiple machines and all versions of RHEL starting
    with RHEL 7.7.


    For more information about RHEL System Roles and how to apply them, see Introduction
    to RHEL System Roles.


    # ## 13.1. INTRODUCTION TO THE STORAGE ROLE


    The storage role can manage:


    +   - File systems on disks which have not been partitioned

    - Complete LVM volume groups including the logical volumes and file systems


    With the storage role you can perform the following tasks:


    +   - Create a file system

    - Remove a file system

    - Mount a file system

    - Unmount a file system

    - Create LVM volume groups

    - Remove LVM volume groups

    - Create logical volumes

    - Remove logical volumes

    - Create RAID volumes

    - Remove RAID volumes

    - Create LVM pools with RAID

    - Remove LVM pools with RAID


    # ## 13.2. PARAMETERS THAT IDENTIFY A STORAGE DEVICE IN THE STORAGE SYSTEM ROLE


    Your storage role configuration affects only the file systems, volumes, and pools
    that you list in the following variables.


    storage_volumes


    List of file systems on all unpartitioned disks to be managed.

    Partitions are currently unsupported.'
  merge: -1
  pgno: 78
- img_proc: true
  md: "# storage_pools\n\nList of pools to be managed.\nCurrently the only supported\
    \ pool is LVM. With LVM, pools represent volume groups (VGs).\nUnder each pool\
    \ there is a list of pools to be managed by the role. With LVM, each volume corresponds\
    \ to a logical volume (LV) with a file system.\n\n# 13.3. EXAMPLE ANSIBLE PLAYBOOK\
    \ TO CREATE AN XFS SYSTEM ON A BLOCK DEVICE\n\nThis section provides an Ansible\
    \ playbook. This playbook applies the storage role to create an XFS file system\
    \ on a block device using the default parameters.\n\n> WARNING\nThe storage role\
    \ can create a file system only on an unpartitioned, whole disk or a logical volume\
    \ (LV). It cannot create the file system on a partition.\n\nExample 13.1. A playbook\
    \ that creates XFS on /dev/sdb\n\n```\n---\n- hosts: all\n  vars:\n    storage_volumes:\n\
    \      - name: barefs\n        type: disk\n        disks:\n          - sdb\n \
    \         fs_type: xfs\nroles:\n  - rhel-system-roles.storage\n```\n\n+   - The\
    \ volume name barefs (in the example) is currently arbitrary. The Storage role\
    \ identifies the volume by the disk listed under the disks: attribute.\n- You\
    \ can omit the fs_type: xfs line because XFS is the default file system in RHEL\
    \ 8.\n- To create the file system on an LV, provide the LVM setup under the disks:\
    \ attribute, including the exclusive volume group. For details, see Example Ansible\
    \ playbook to manage logical volumes.\nDo not provide the path to the LV device.\n\
    \nAdditional resources\n\n+   - The /usr/share/ansible/roles/rhel-system-roles.storage/README.md\
    \ file."
  merge: -1
  pgno: 79
- img_proc: true
  md: "# 13.4. EXAMPLE ANSIBLE PLAYBOOK TO PERSISTENTLY MOUNT A FILE SYSTEM\n\nThis\
    \ section provides an Ansible playbook. This playbook applies the storage role\
    \ to immediately and persistently mount an XFS file system.\n\nExample 13.2. A\
    \ playbook that mounts a file system on /dev/sdb to /mnt/data\n\n```\n-----\n\
    - hosts: all\nvars:\n  storage_volumes:\n    name: barefs\n    type: disk\n  \
    \  disks:\n      - sdb\n  fs_type: xfs\n  mount_point: /mnt/data\nroles:\n  -\
    \ rhel-system-roles.storage\n```\n\n+   - This playbook adds the file to the /etc/fstab\
    \ file, and mounts the file system immediately.\n- If the file system on the /dev/sdb\
    \ device or the mount point directory do not exist, the playbook creates them.\n\
    \nAdditional resources\n\n+   - /usr/share/ansible/roles/rhel-system-roles.storage/README.md\
    \ file.\n\n# 13.5. EXAMPLE ANSIBLE PLAYBOOK TO MANAGE LOGICAL VOLUMES\n\nThis\
    \ section provides an example Ansible playbook. This playbook applies the storage\
    \ role to create an LVM logical volume in a volume group.\n\nExample 13.3. A playbook\
    \ that creates a mylv logical volume in the myvg volume group\n\n```\n---\n- hosts:\
    \ all\nvars:\n  storage_pools:\n    name: myvg\n    disks:\n      - sda\n    \
    \  - sdb\n      - sdc\nvolumes:\n  name: mylv\n  size: 2G\n  fs_type: ext4\n```"
  merge: -1
  pgno: 80
- img_proc: true
  md: "mount_point: /mnt\nroles:\n- rhel-system-roles.storage\n\n+   * The myvg volume\
