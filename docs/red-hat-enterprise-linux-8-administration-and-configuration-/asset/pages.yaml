  md: '# CHAPTER 16. CONFIGURING A SYSTEM FOR SESSION RECORDING USING THE TLOG RHEL
    SYSTEM ROLES


    With the tlog RHEL System Role, you can configure a system for terminal session
    recording on RHEL using Red Hat Ansible Automation Platform.


    # 16.1. THE TLOG SYSTEM ROLE


    You can configure a RHEL system for terminal session recording on RHEL using the
    tlog RHEL System Role. The tlog package and its associated web console session
    player provide you with the ability to record and play back terminal sessions.


    You can configure the record to take place per user or user group via the SSSD
    service. All terminal input and output is captured and stored in a text-based
    format in the system journal.


    Additional resources


    +   - For more details on session recording in RHEL, see Recording Sessions


    # 16.2. COMPONENTS AND PARAMETERS OF THE TLOG SYSTEM ROLES


    The Session Recording solution is composed of the following components:


    +   - The tlog utility

    - System Security Services Daemon (SSSD)

    - Optional: The web console interface


    The parameters used for the tlog RHEL System Role are:


    | Role Variable | Description |

    |---|---|

    | tlog_use_sssd (default: yes) | Configure session recording with SSSD, the preferred
    way of managing recorded users or groups |

    | tlog_scope_sssd (default: none) | Configure SSSD recording scope - all / some
    / none |

    | tlog_users_sssd (default: []) | YAML list of users to be recorded |

    | tlog_groups_sssd (default: []) | YAML list of groups to be recorded |


    +   - For details about the parameters used in tlog and additional information
    about the tlog System Role, see the /usr/share/ansible/roles/rhel-system-roles.tlog.README.md
    file.


    # 16.3. DEPLOYING THE TLOG RHEL SYSTEM ROLE


    Follow these steps to prepare and apply an Ansible playbook to configure a RHEL
    system to log recording data to the systemd journal.'
  merge: -1
  pgno: 98
- img_proc: true
  md: "# Prerequisites\n\n+   - You have set SSH keys for access from the control\
    \ node to the target system where the tlog System Role will be configured.\n\n\
    +   - You have one control node, which is a system from which the Ansible Engine\
    \ configures the other systems.\n\n+   - You have Red Hat Ansible Engine installed\
    \ on the control node, from which you want to run the playbook.\n\n+   - You have\
    \ the rhel-system-roles package installed on the control node from which you want\
    \ to run the playbook.\n\n+   - You have at least one system that you want to\
    \ configure the tlog System Role. You do not have to have Red Hat Automation Platform\
    \ installed on the systems on which you want to deploy the tlog solution.\n\n\
    # Procedure\n\n+   1. Create a new playbook.yml file with the following content:\n\
    \n```\n```-\name: Deployment session recording\n  hosts: all\n  vars:\n    tlog_scope_sssd:\
    \ some\n    tlog_users_sssd:\n      - recordeduser\n  roles:\n    - rhel-system-roles.tlog\n\
    ```\n```\n\nWhere,\n\n+   - tlog_scope_sssd:\n    - some specifies you want to\
    \ record only certain users and groups, not all or none.\n\n+   - tlog_users_sssd:\n\
    \    - recordeduser specifies the user you want to record a session from. Note\
    \ that this does not add the user for you. You must set the user by yourself.\n\
    \n+   2. Optionally, verify the playbook syntax.\n\n```\n# ansible-playbook --syntax-check\
    \ playbook.yml\n```\n\n+   3. Run the playbook on your inventory file:\n\n```\n\
    # ansible-playbook -i IP_Address /path/to/file/playbook.yml -v\n```\n\nAs a result,\
    \ the playbook installs the tlog role that can be used by the users and groups\
    \ that you define. SSSD parses and reads these users and groups to overlay tlog\
    \ session as the shell user. Additionally, if the cockpit"
  merge: -1
  pgno: 99
- img_proc: true
  md: "package is installed on the system, the playbook also installs the cockpit-session-recording\
    \ package, which is a Cockpit module that allows you to view and play recordings\
    \ in the web console interface.\n\n# Verification steps\n\nTo verify the SSSD\
    \ configuration drop file is created in the system, perform the following steps:\n\
    \n+   1. Navigate to the folder where the SSSD configuration drop file is created:\n\
    \n```\n# cd /etc/sssd/conf.d\n```\n\n+   2. Check the file content:\n\n```\n#\
    \ cat /etc/sssd/conf.d/sssd-session-recording.conf\n```\n\nYou can see that the\
    \ file contains the parameters you set in the playbook.\n\n# 16.4. DEPLOYING THE\
    \ TLOG REG SYSTEM ROLE FOR EXCLUDING LISTS OF GROUPS OR USERS\n\nYou can use the\
    \ log System Role on RHEL to support the SSSD session recording configuration\
    \ exclude_users and exclude_groups. Follow these steps to prepare and apply an\
    \ Ansible playbook to configure a RHEL system to exclude users or groups from\
    \ having their sessions recorded and logged in the systemd journal.\n\n# Prerequisites\n\
    \n+   - You set SSH keys for access from the control node to the target system\
    \ on which you want to configure the tlog System Role.\n\n+   - You have one control\
    \ node, which is a system from which the Red Hat Ansible Engine configures the\
    \ other systems.\n\n+   - You have Red Hat Ansible Engine installed on the control\
    \ node, from which you want to run the playbook.\n\n+   - You have the rhel-system-roles\
    \ package installed on the control node.\n\n+   - You have at least one system\
    \ on which you want to configure the tlog System Role. You do not have to Red\
    \ Hat Automation Platform installed on the systems on which you want to deploy\
    \ the tlog solution.\n\n# Procedure\n\n+   1. Create a new playbook.yml file with\
    \ the following content:\n\n```\n- name: Deploy session recording excluding users\
    \ and groups\n  hosts: all\n  vars:\n    tlog_scope_sssd: all\n    tlog_exclude_users_sssd:\n\
    ```"
  merge: -1
  pgno: 100
- img_proc: true
  md: "- jeff\n- james\n- tlog_exclude_groups_sssd:\n- admins\n\nroles:\n  - rhel-system-roles.tlog\n\
    \nWhere,\n\n+   - tlog_scope_sssd:\n  - all: specifies that you want to record\
    \ all users and groups.\n- tlog_exclude_users_sssd:\n  - user names: specifies\
    \ the user name of the users you want to exclude from the session recording.\n\
    - tlog_exclude_groups_sssd:\n  - admins specifies the group you want to exclude\
    \ from the session recording.\n\n+   2. Optionally, verify the playbook syntax;\n\
    \n```\n# ansible-playbook --syntax-check playbook.yml\n```\n\n+   3. Run the playbook\
    \ on your inventory file:\n\n```\n# ansible-playbook -i IP_Address /path/to/file/playbook.yml\
    \ -v\n```\n\nAs a result, the playbook installs the tlog package on the system\
    \ you specified. It also creates /etc/sssd/conf/sssd-session-recording.conf SSSD\
    \ configuration drop file that can be used by users and groups except those that\
    \ you defined as excluded. SSSD parses and reads these users and groups overlap\
    \ tlog as the shell user. Additionally, if the cockpit package is installed on\
    \ the system, the playbook also installs the cockpit-session-recording package,\
    \ which is a cockpit module that allows you to view and play recordings in the\
    \ web console interface.\n\n![](img/7076193df8761a1565038e17afc88b0b_101_0.png)\n\
    \n> NOTE\nYou are not able to record a session for users listed in the exclude_users\
    \ list or if they are a of a group in the exclude_groups list.\n\n# Verification\
    \ steps\n\nTo verify that the SSSD configuration drop file is created in the system,\
    \ perform the following steps:\n\n+   1. Navigate to the folder where the SSSD\
    \ configuration drop file is created:\n\n```\n# cd /etc/sssd/conf.d\n```\n\n+\
    \   2. Check the file content:\n\n```\n# cat sssd-session-recording.conf\n```"
