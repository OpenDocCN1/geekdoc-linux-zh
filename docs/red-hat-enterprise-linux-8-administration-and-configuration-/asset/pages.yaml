  md: '# CHAPTER 4. USING ANSIBLE ROLES TO PERMANENTLY CONFIGURE KERNEL PARAMETERS


    An experienced user with good knowledge of Red Hat Ansible Engine, you can use
    the kernel_settings role to configure kernel parameters on multiple clients at
    once.


    +   - Provides a friendly interface with efficient input setting.

    - Keeps all intended kernel parameters in one place.


    After you run the kernel_settings role from the control machine, the kernel parameters
    are applied to the systems managed independently and persist across reboots.


    # 4.1. INTRODUCTION TO THE KERNEL SETTINGS ROLE


    RHEL System Roles is a collection of roles and modules from Ansible Automation
    Platform that provide a consistent configuration interface to remotely manage
    multiple systems.


    RHEL System Roles were introduced for automated configurations of the kernel using
    the kernel_settings system role. The rhel-system-roles package contains this system
    role, and also the reference documentation.


    To apply the kernel parameters on one or more systems in an automated fashion,
    the kernel_settings role with one or more of its role variables of your choice
    in a playbook. A playbook is a list of one or more plays that are human-readable,
    and are written in the YAML format.


    You can use an inventory file to define a set of systems that you Ansible Engine
    to configure according to the playbook.


    With the kernel_settings role you can configure:


    +   - The kernel parameters using the kernel_settings_sysctl role variable

    - Various kernel subsystems, hardware devices, and device drivers using the kernel_settings_sysfs
    role variable

    - The CPU affinity for the system manager and processes that it forks using the
    kernel_settings_systemd_cpu_affinity role variable

    - The kernel memory subsystem hugepages using the kernel_settings_transparent_hugepages
    and kernel_settings_transparent_hugepages_defrag role variable


    Additional resources


    +   - README.md and README.html files in the /usr/share/doc/rhel-system-roles/kernel_settings/directory

    - Working with playbooks

    - How to build your inventory


    # 4.2. APPLYING SELECTED KERNEL PARAMETERS USING THE KERNEL SETTINGS ROLE'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Red Hat Enterprise Linux 8 Administration and configuration tasks using System
    Roles in RHEL


    Follow these steps to prepare and apply an Ansible playbook to remotely configure
    kernel parameters with persisting effect on multiple operating systems.


    # Prerequisites


    +   - Your Red Hat Ansible Engine is subscribed to the system, also called control
    machine, from which you want to run the kernel_settings role. See the do I download
    and install Red Hat Ansible Engine article for more information.

    - Ansible Engine repository is enabled on the control machine.

    - Ansible Engine is installed on the control machine.


    ![](img/7076193df8761a1565038e17afc88b0b_21_0.png)


    > NOTE

    You do not need to have Ansible Engine installed on the systems, also called managed
    hosts, where you want to configure the kernel parameters.


    +   - The rhel-system-roles package is installed on the control machine.

    - An inventory of managed hosts is present on the control machine and Ansible
    Engine is able to connect to them.


    # Procedure


    +   1. Optionally, review the inventory file for illustration purposes:


    ```

    # /home/doe/<ansible_project_name>/inventory

    [testingservers]

    doe@192.168.122.98

    doe@192.168.122.226


    [db-servers]

    db1.example.com

    db2.example.com


    [webservers]

    web1.example.com

    web2.example.com

    192.0.2.42

    ```


    The file defines the [testservers] group and other groups. It allows you to run
    Ansible Engine more effectively against a specific collection of systems.


    +   2. Create a configuration file to set defaults and privilege escalation for
    Ansible Engine operations.


    +   a. Create a new YAML file and open it in a text editor, for example:


    ```

    # /home/doe/<ansible_project_name>/ansible.cfg

    ```


    +   b. Insert the following content into the file:


    ```

    [defaults]

    inventory = /inventory

    ```'
  merge: -1
  pgno: 21
- img_proc: true
  md: "```\n[privilege_escalation]\nbecome = true\nbecome_method = sudo\nbecome_user\
    \ = root\nbecome_ask_pass = true\n```\n\nThe [defaults] section defines a path\
    \ to an inventory file of managed hosts. The [privilege_escalation] section defines\
    \ what privileges may be shifted to root on the managed hosts. This is necessary\
    \ for successful configuration of kernel parameters. When Ansible playbook is\
    \ run, you will be prompted for user password. The user automatically switches\
    \ to root by means of sudo after connecting to a managed host.\n\n+   3. Create\
    \ an Ansible playbook that uses the kernel_settings role.\nna. Create a YAML file\
    \ and open it in a text editor, for example:\n\n```\n# vi /home/jdoe/<ansible_project_name>/kernel_roles.yml\n\
    ```\n\nThis file represents a playbook and usually contains an ordered list of\
    \ tasks, also called plays, that are run against specific managed hosts selected\
    \ from your inventory file.\n\n+   b. Insert the following content into the file:\n\
    \n```\n---\n- name: Configure kernel settings\nhosts: testingservers\nvars:\n\
    \  kernel_settings_sysctl:\n    - name: fs.file-max\n    value: 400000\n    -\
    \ name: kernel.threads-max\n    value: 65536\n  kernel_settings_sysfs:\n    -\
    \ name: /sys/class/net/io/mtu\n    value: 65000\n  kernel_settings_transparent_hugepages:\
    \ madvise\n```\n\n```\nroles:\n  - linux-system-roles.kernel_settings\n```\n\n\
    The key is optional. It associates an arbitrary string with the play as a label\
    \ and identifies what the play is for. The hosts key in the play specifies the\
    \ hosts against which the play is run. The value or values for this key can be\
    \ provided as individual names of managed hosts or groups of hosts as defined\
    \ in the inventory file.\n\nThe vars section represents a list of variables containing\
    \ selected kernel parameter names and values to which they have been set.\n\n\
    The roles key specifies what system role is going to configure the parameters\
    \ and values mentioned in the vars section.\n\n> NOTE\nYou can modify the kernel\
    \ parameters and their values in the playbook to fit your needs.\n\n![](img/7076193df8761a1565038e17afc88b0b_22_0.png)"
