  md: '# CHAPTER 10. USING THE CLEVIS AND TANG SYSTEM ROLES


    # 10.1. INTRODUCTION TO THE CLEVIS AND TANG SYSTEM ROLES


    RHEL System Roles is a collection of Ansible roles and modules that provide a
    consistent configuration interface to remotely manage RHEL Decryption


    RHEL 8.3 introduced Ansible roles for automated deployments of Policy-Based Decryption
    (PBD) solutions using Clevis and Tang. The rhel-system-roles package contains
    these system roles, the related examples, and also the reference documentation.


    The **nbnd_client** role enables you to deploy multiple Clevis clients in an automated
    way. Note that the **nbnd_client** role supports only bindings, and you cannot
    use it for TPM2


    The **nbnd_client** role requires volumes that are already encrypted using LUKS.
    LUKS supports to bind a LUKS-encrypted volume to one or more Network-Bound (NBDE)
    servers - Tang. You can either preserve the existing volume encryption with a
    passphrase or remove it. After removing the passphrase, you can unlock the volume
    using only NBDE. This is useful when a volume is initially encrypted using a temporary
    key or password that you remove after the system you provide the system.


    If you provide both a passphrase and a key file, the role uses whatever you have
    provided first. If it does not find any of the value, it attempts to retrieve
    a passphrase from an existing binding.


    PBD defines a binding as a mapping of a device to a slot. This means that you
    can have multiple bindings for the same device. The default slot is 1.


    The **nbnd_client** role provides also the **state** variable. Use the **present**
    value for either creating a new binding or updating an existing one. Unlike to
    a **clevis** **bind** command, you can use **state: present** for overwriting
    an existing binding in its device slot. The **absent** value removes a specified
    binding.


    Using the **nbnd_server** you can deploy and manage a Tang server as part of an
    automated encryption solution. This role supports the following features:


    +   - Rotating Tang keys

    - Deploying and backing up Tang keys


    Additional resources


    +   - For a detailed reference on Network-Bound Disk Encryption (NBDE) role variables,
    install the rhel-system-roles package, and see the **README.md** and **README.html**
    files in `/usr/share/doc/rhel-system-roles/nbnd_client/` and `/usr/share/ansible/roles/rhel-system-roles/nbnd_server/`
    directories.

    - For example-roles playbooks, install the **rhel-system-roles** package, and
    see the `/usr/share/ansible/roles/rhel-system-roles.nbnd_server/` directories.

    - For more information on RHEL System Roles, see **Introduction to RHEL System
    Roles**


    # 10.2. USING THE NBDE_SERVER SYSTEM ROLE FOR SETTING MULTIPLE TANG SERVERS'
