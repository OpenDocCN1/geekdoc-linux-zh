  md: '# CHAPTER 12. CONFIGURING KDUMP USING RHEL SYSTEM ROLES


    To manage dump using Ansible, you can use the kdump role, which is one of the
    RHEL System Roles available in RHEL 8.


    Using the kdump enables you to specify where to save the contents of the system''s
    memory for later analysis.


    For more information about RHEL System Roles and how to apply them, see Introduction
    to RHEL System Roles.


    # 12.1. THE KDUMP RHEL SYSTEM ROLE


    The kdump System Role enables you to set basic kernel dump parameters on multiple
    systems.


    # 12.2. KDUMP ROLE PARAMETERS


    The parameters used for the kdump RHEL System Roles are:


    | Role Variable | Description |

    | kdump_path | The path to which vmcore is written. kdump_target is not null,
    path is relative to that dump target. Otherwise, it must be an absolute path in
    the root file system. |


    Additional resources


    +   - The makedumpfile(8) man page.

    - For details about the parameters used in kdump and additional information about
    the kdump System Role, see the /usr/share/ansible/roles/rhel-system-roles.log/README.md
    file.


    # 12.3. CONFIGURING KDUMP USING RHEL SYSTEM ROLES


    You can set basic kernel dump parameters on multiple systems using the kdump System
    Role by running an Ansible playbook.


    > WARNING

    The kdump role replaces the kdump configuration of the managed hosts entirely
    by replacing the /etc/kdump.conf file. Additionally, if the kdump role is applied,
    all previous kdump settings are also replaced, even they are not specified by
    the role variables, by replacing the /etc/sysconfig/kdump file.'
  merge: -1
