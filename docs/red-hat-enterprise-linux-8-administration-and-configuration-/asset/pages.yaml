  md: '# CHAPTER 14. CONFIGURING TIME SYNCHRONIZATION USING RHEL SYSTEM ROLES


    With the timesync RHEL System Role, you can manage time synchronization on multiple
    target machines using Red Hat Ansible Automation Platform.


    # 14.1. THE TIMESYNC SYSTEM ROLE


    You can manage time synchronization on multiple target machines using the timesync
    RHEL System Role.


    The timesync role installs and configures an NTP or PTP implementation to operate
    as an NTP client or PTP replica to synchronize the system clock with NTP servers
    or grandmasters in PTP domains.


    Note that using the timesync role also facilitates the migration to chronology,
    because you can use the same playbook on all versions of Red Hat Enterprise Linux
    starting with RHEL 6 regardless of whether the system uses ntp or chronology to
    implement the NTP protocol.


    # 14.2. APPLYING THE TIMESYNC SYSTEM ROLE FOR A SINGLE POOL OF SERVERS


    The following example shows how to apply the timesync role in a situation with
    just one pool of servers.


    > WARNING The timesync role replaces the configuration of the given or detected
    provider service on the managed host. Previous settings are lost, even if they
    are not specified in the role variables. The only preserved setting is the choice
    of provider if the timesync_ntp_provider variable is not defined.


    Prerequisites


    +   - You have Red Hat Ansible Engine installed on the system from which you want
    to run the playbook.

    - NOTE You do not have to have Red Hat Ansible Automation Platform installed on
    the systems on which you want to deploy the timesync solution.

    - You have the rhel-system-roles package installed on the system from which you
    want to run the playbook.

    - You have an inventory file which lists the systems on which you want to deploy
    timesync System Role.'
  merge: -1
  pgno: 90
- img_proc: true
  md: "# Red Hat Enterprise Linux 8 Administration and configuration tasks using System\
    \ Roles in RHEL\n\nProcedure\n\n+   1. Create a new *playbook.yml* file with the\
    \ following content:\n```yaml\n-\nhosts: timesync-test\nvars:\n  timesync_ntp_servers:\n\
    \    - hostname: 2.rhel.pool.ntp.org\n      pool: yes\n      iburst: yes\nroles:\n\
    \  - rhel-system-roles.timesync\n```\n2. Optional: Verify playbook syntax.\n```bash\n\
    # ansible-playbook --syntax-check playbook.yml\n```\n3. Run the playbook on your\
    \ inventory file:\n```bash\n# ansible-playbook -i inventory_file/path/to/file/playbook.yml\n\
    ```\n\n# 14.3. TIMESYNC SYSTEM ROLES VARIABLES\n\nYou can pass the variable to\
    \ the *timesync* role:\n\n+   - **timesync_ntp_servers:**\n\n| Role variable settings\
    \ | Description |\n|--- |--- |\n| hostname: example.com | Hostname or address\
    \ of the server |\n| minpoll: *number* | Minimum polling interval. Default: 6\
    \ |\n| maxpoll: *number* | Maximum polling interval. Default: 10 |\n| iburst:\
    \ yes | Flag enabling fast initial synchronization. Default: no |\n| pool: yes\
    \ | Flag indicating that each resolved address of the hostname is a separate NTP\
    \ server. Default: no |\n\nAdditional resources\n\n+   - For a detailed reference\
    \ on timesync role variables, install the rhel-system-roles package, and see the\
    \ README.md or README.html files in the `/usr/share/doc/rhel-system-roles/timesync`\
    \ directory."
