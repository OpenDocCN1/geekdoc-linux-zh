  md: '# CHAPTER 1. GETTING STARTED WITH RHEL SYSTEM ROLES


    This section explains what RHEL System Roles are. Additionally, it describes how
    to apply a particular role through an Ansible playbook to perform various system
    administration tasks.


    # 1.1. INTRODUCTION TO RHEL SYSTEM ROLES


    RHEL System Roles is a collection of Ansible roles and modules. RHEL System Roles
    provide a configuration interface to remotely manage multiple RHEL systems. The
    interface enables system configurations across multiple versions of RHEL, as well
    as adopting new major releases.


    On Red Hat Enterprise Linux 8, the interface currently consists of the following
    roles:


    +   * kdump

    * network

    * selinux

    * storage

    * certificate

    * kernel_settings

    * logging

    * metrics

    * nbde_client and nbde_server

    * timesync

    * tlog


    All roles are provided by the rhel-system-roles package available in the AppStream
    repository.


    Additional resources


    +   * Red Hat Enterprise Linux (RHEL) System Roles

    * /usr/share/doc/rhel-system-roles documentation [1]

    * Introduction to the SELinux system role

    * Introduction to the storage role

    * Administration and configuration tasks using System Roles in RHEL


    # 1.2. RHEL SYSTEM ROLES TERMINOLOGY


    You can find the following terms across this documentation:


    System Roles terminology'
  merge: -1
  pgno: 10
- img_proc: true
  md: "# Ansible playbook\n\nPlaybooks are Ansible's configuration, deployment, and\
    \ orchestration language. They can describe a policy you want remote systems to\
    \ ensure, or a set of steps in a general IT process.\n\n# Control node\n\nAny\
    \ machine with Ansible installed. You can run commands and playbooks, invoking\
    \ /usr/bin/ansible or /usr/bin/ansible-playbook, from any control node. You can\
    \ use any control that has Python installed on it as a control node - laptops,\
    \ shared desktops, and servers can all run Ansible. However, you cannot use a\
    \ Windows machine as a control node. You can have multiple control nodes.\n\n\
    # Inventory\n\nA list of managed nodes. An inventory file is sometimes called\
    \ a \"hostfile\". Your inventory can specify information like IP address for each\
    \ managed node. An inventory also organize managed nodes, creating and nesting\
    \ groups for easier scaling. To learn more about inventory, see the Working with\
    \ Inventory section.\n\n# Managed nodes\n\nThe network devices, servers, or both\
    \ that you manage with Ansible. Managed nodes are also sometimes called \"hosts\"\
    . Ansible is not installed on managed nodes.\n\n# 1.3. APPLYING A ROLE\n\nThe\
    \ following procedure describes how to apply a particular role.\n\n# Prerequisites\n\
    \n+   Ensure that the rhel-system-roles package is installed on the system that\
    \ you want to use as a control node:\n* # yum install rhel-system-roles\n* You\
    \ need the ansible package to run playbooks that RHEL System Roles. Ensure that\
    \ the Ansible repository is enabled, and the ansible package is installed on the\
    \ system that you want to use as a control node.\n* If you do not have a Red Hat\
    \ Ansible Engine Subscription, you can use a limited supported version of Red\
    \ Hat Ansible Engine provided with your Red Hat Enterprise Linux subscription.\
    \ In this case, follow these steps:\n    * Enable the RHEL Ansible Engine repository:\n\
    \      * # subscription-manager refresh\n      * # subscription-manager repos\
    \ --enable ansible-2-for-rhel-8_x86_64-rpms\n    * Install Ansible Engine:\n \
    \     * # yum install ansible\n* If you have a Red Hat Ansible Engine Subscription,\
    \ follow the procedure described in How I Download and Install Red Hat Ansible\
    \ Engine?.\n* Ensure that you are able to create an Ansible inventory. Inventories\
    \ represent the hosts, host groups, and some of the configuration parameters used\
    \ by the Ansible playbooks."
  merge: -1
  pgno: 11
- img_proc: true
  md: 'Playbooks are typically human-readable, and are defined in ini, yaml, json,
    and other file formats.


    +   - Ensure you are able to create an Ansible playbook. Playbooks represent Ansible''s
    configuration, deployment, and orchestration language. By using playbooks, you
    can create and manage configurations of remote machines, deploy multiple remote
    machines or orchestrate steps of any manual ordered process.


    A playbook is a list of one or more plays. Every play can include Ansible variables,
    tasks, or rules.


    Playbooks are human-readable, and are defined in the yaml format.


    # Procedure


    +   1. Create the required Ansible inventory containing the hosts and groups that
    you want to manage. Here is an example using a file called inventory.ini of a
    group of hosts called webservers:


    ```

    [webservers]

    host1

    host2

    host3

    ```


    +   2. Create an Ansible playbook including the required role. The following example
    shows how to use roles through the roles: option for a playbook:

    The following example shows how to use roles through the roles: option for a given
    play:


    ```

    ----

    - hosts: webservers

    roles:

    - rhel-system-roles.network

    - rhel-system-roles.timesync

    ```


    > NOTE

    Every role includes a README file, which documents how to use the role and supported
    parameter values. You can also find an example playbook for a particular role
    under the documentation directory of the role. Such documentation directory is
    provided by default with the rhel-system-roles package, and can be found in the
    following location:


    ```

    /usr/share/doc/rhel-system-roles/SUBSY/

    ```


    Replace SUBSY with the name of the required role, such as selinux, kdump, network,
    timesync, or storage.


    +   3. To execute the playbook on specific hosts, you must perform one of the
    following:


    +   - Edit the playbook to use hosts:host1[host2,...], or hosts:all, and execute
    the command:


    ```

    # ansible-playbook name.of_the.playbook

    ```


    +   - Edit the inventory to ensure that the hosts you want to use are defined
    in a group, and execute the command:'
  merge: -1
  pgno: 12
