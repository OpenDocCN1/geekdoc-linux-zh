  md: '# 17.5. CONFIGURING AN APACHE HTTP SERVER IN A HIGH AVAILABILITY CLUSTER WITH
    THE HA_CLUSTER SYSTEM ROLE


    This procedure configures an active/passive Apache HTTP server in a two-node Red
    Enterprise Linux Availability Add-on using the ha_cluster system role.


    Prerequisites


    +   - You have Red Hat Ansible Engine installed on the node from which you want
    to run the playbook.


    > NOTE

    You do not have to have Ansible Engine installed on the cluster member nodes.


    +   - You have the rhel-system-roles package installed on the system from which
    you want to run the playbook. For details RHEL System Roles and how to apply them,
    see Getting started with RHEL System Roles.


    +   - The systems running RHEL that you will use as your cluster members must
    have active subscription coverage for RHEL and the RHEL High Availability Add-On.


    +   - Your system includes a public IP address, required for Apache.


    +   - Your system includes shared storage for the nodes in the cluster, using
    iSCSI, Fibre Channel, or other shared network device.


    +   - You have configured an LVM logical volume with ext4, as described in Configuring
    an LVM volume with an ext4 file system in a Pacemaker cluster


    +   - You have configured an Apache HTTP server, as described in Configuring an
    Apache HTTP server.


    +   - Your system includes an APC power switch that will be used to fence the
    cluster nodes.


    > NOTE

    The ha_cluster system role replaces any existing cluster configuration on the
    specified nodes. Any settings not specified in the role will be lost.


    Procedure


    +   1. Create an inventory file specifying the nodes in the cluster, as described
    in Specifying an inventory for the ha_cluster system role.


    +   2. Create a playbook file, for example http-cluster.yml: The following example
    playbook configures a previously-created Apache HTTP server in an active/passive
    two-node HA cluster


    This example uses an APC power switch with a host name of zapc.example.com. If
    the cluster does not use any fence agents, you can only list the fence agents
    your cluster requires when defining the ha_cluster_fence_agent_packages variable,
    as in this example.'
