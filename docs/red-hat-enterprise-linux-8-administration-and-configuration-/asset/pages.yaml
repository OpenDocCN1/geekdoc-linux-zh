  md: '# CHAPTER 8. CONFIGURING SECURE COMMUNICATION WITH THE SSH SYSTEM ROLES


    As an administrator, you can use the SSHD System Role to configure SSH servers
    and the SSH System Role to configure SSH clients consistently on any number of
    RHEL systems at the same time using Red Hat Ansible Automation Platform.


    # 8.1. SSH SYSTEM ROLE VARIABLES


    In an SSH System Role playbook, you can define the parameters for the SSH configuration
    file according to your preferences and limitations.


    If you do not configure these variables, the system role produces a sshd_config
    file that matches the RHEL defaults.


    In all cases, Booleans correctly render as yes and no in ssh configuration. You
    can define multi-line configuration items using lists:


    +   - sshd_ListenAddress:

    - 0.0.0.0


    renders as:


    +   - ListenAddress 0.0.0.0

    ListenAddress ::


    Variables for the SSHD System Role


    sshd_enable


    If set to False, the role is completely disabled. Defaults toTrue.


    sshd_skip_defaults


    If set to True, the system role does not apply default values. Instead, you specify
    the complete set of configuration defaults by using either the sshd dict, or sshd_Key
    variables. Defaults to False.


    sshd_manage_service


    If set to False, the service is not managed, which means it is not enabled on
    boot and does not start or reload. Defaults to True except when running inside
    a container or AIX, because the Ansible service module does not support enabled
    for AIX.


    sshd_allow_reload


    If set to False, sshd does not reload after a change of configuration. This can
    help with troubleshooting. To apply the changed configuration, reload sshd manually.
    Defaults to the same value as sshd_manage_service except on AIX, whereas sshd_manage_service
    defaults to False but sshd_allow_reload defaults to True.


    sshd_install_service


    If set to True, the role installs service files for the sshd service. This overrides
    files provided in the operating system. Do not set to True unless you are configuring
    a second instance and you change the sshd_service variable. Defaults to False.
    The role uses the files pointed by the following variables as templates:'
