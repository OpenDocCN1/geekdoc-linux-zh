    # Abstract


    This document describes configuring system roles using Ansible on Red Hat Enterprise
    Linux 8. The title focuses on: RHEL System Roles are a collection of Ansible roles,
    modules, and playbooks that provide a stable and consistent configuration interface
    to manage and configure Red Hat Enterprise Linux. They are designed to be forward
    compatible with multiple major release versions of Red Hat Enterprise Linux 8.'
