  md: "# 17.2. SPECIFYING AN INVENTORY FOR THE HA_CLUSTER SYSTEM ROLE\n\nWhen configuring\
    \ an HA cluster using the ha_cluster system role playbook, you configure the names\
    \ and addresses of the nodes for the cluster in your inventory.\n\nFor each node\
    \ in your inventory, you can optionally specify the following items:\n\n+   -\
    \ **node_name** - the name of a node in a cluster.\n- **pcs_address** - an address\
    \ used by bpcs to communicate with the node. It can be a name, FDN or an IP address\
    \ and it can include a port number.\n- **corosync_addresses** - list of addresses\
    \ used by Corosync. All nodes which form a particular cluster must have the same\
    \ number of addresses and the order of the addresses matters.\n\nThe following\
    \ example shows an inventory with targets node1 and node2.node1 and node2 must\
    \ be either fully qualified domain names or must otherwise be able to connect\
    \ to the nodes as when, for, the names are resolvable through the /etc/hosts file.\n\
    \n```\nall:\n  hosts:\n    node1:\n      ha_cluster:\n        node_name: node-A\n\
    \        pcs_address: node1-address\n      corosync_addresses:\n        - 192.168.1.11\n\
    \        - 192.168.2.11\n    node2:\n      ha_cluster:\n        node_name: node-B\n\
    \        pcs_address: node-2-address:2224\n      corosync_addresses:\n       \
    \ - 192.168.1.12\n        - 192.168.2.12\n```\n\n# 17.3. CONFIGURING A HIGH AVAILABILITY\
    \ CLUSTER RUNNING NO RESOURCES\n\nThe following procedure uses the ha_cluster\
    \ system role, to create a high availability cluster with no fencing configured\
    \ and which runs no resources.\n\nPrerequisites\n\n+   - You have Red Hat Ansible\
    \ Engine installed on the node from which you want to run the playbook.\n\n> NOTE\n\
    You do not have to have Ansible installed on the cluster member nodes.\n\n![](img/7076193df8761a1565038e17afc88b0b_110_0.png)"
  merge: -1
