  md: "# CHAPTER 3. INSTALLING AND USING COLLECTIONS\n\n# 3.1. INTRODUCTION TO ANSIBLE\
    \ COLLECTIONS\n\nAnsible Collections are the new way of distributing, maintaining,\
    \ and consuming automation. By combining types of Ansible content such as playbooks,\
    \ roles, modules, and plugins, you can benefit from improvements in flexibility\
    \ and scalability.\n\nThe Ansible Collections are an option to the RHEL System\
    \ Roles format. Using the RHEL System Roles in the Ansible Collection format is\
    \ the same as it is using in the traditional RHEL System Roles format (FQCN).\
    \ The difference is that Ansible uses the concept of a **fully qualified collection\
    \ name** which consists of a namespace and the **collection name**. The namespace\
    \ we use is **redhat** and the **collection name** is **rhel_system_roles**. So,\
    \ while the traditional RHEL System Roles format for the kernel is presented as\
    \ *rhel-system-roles.kernel_settings*, using Collection **fully qualified collection\
    \ name** for the kernel role would be presented as *redhat.rhel_system_roles.kernel_settings*.\n\
    \nThe combination of a **namespace** and a **collection name** guarantees that\
    \ the objects are unique. it ensures that objects are shared across the Ansible\
    \ Collections and namespaces without any conflicts.\n\n# Additional resources\n\
    \n+   - You can find the Red Hat Certified Collections by accessing the Automation\
    \ Hub.\n\n# 3.2. COLLECTIONS STRUCTURE\n\nCollections are a package format for\
    \ Ansible content. The data structure is as follows:\n\n+   - docs/: local location\
    \ for the collection, with examples, if the role provides the documentation\n\
    - galaxy.yml: source data for the MANIFEST.json that will be part of the Ansible\
    \ Collection package\n- playbooks/: playbooks are available here\n    - tasks/:\
    \ this holds 'task list files' for include_tasks/import_tasks tasks usage\n- plugins/:\
    \ all Ansible plugins and modules are available here, each in its subdirectory\n\
    \    - modules/: Ansible modules\n    - modules_utils/: common code for developing\
    \ modules\n    - lookup/: search for a plugin\n    - filter/: Jinja2 filter plugin\n\
    \    - connection/: connection plugins required if not using the default\n- roles/:\
    \ directory for Ansible roles\n- tests/: tests for the collection's content\n\n\
    # 3.3. INSTALLING COLLECTIONS BY USING THE CLI"
  merge: -1
  pgno: 15
- img_proc: true
  md: 'Collections are a distribution format for Ansible content that can include
    playbooks, roles, modules, and plugins.


    You can install Collections through Ansible Galaxy, through the browser, or by
    using the command line.


    # Prerequisites


    +   - Red Hat Ansible engine 2.9 and later is installed.

    - The python3-jmespath package is installed.

    - An inventory file that lists the managed nodes exists.


    # Procedure


    +   - Install the collection via RPM package:


    ```

    # yum install rhel-system-roles

    ```


    After the installation is finished, the roles are available as redhat.rhel_system_roles.<role_name>.
    Additionally, you can find the documentation for each role at /usr/share/ansible/collections/ansible_collections/redhat/rhel_system_roles/roles/<role_name>/R
    EADME.md


    # Verification steps


    To verify that the Collections were successfully installed, you can apply the
    kernel_settings on your localhost:


    +   1. Copy one of the tests_default.yml to your working directory.


    ```

    $ cp

    /usr/share/ansible/collections/ansible_collections/redhat/rhel_system_roles/tests/kernel_settings
    ests_default.yml .

    ```


    +   2. Edit the file, replacing "hosts: all" with "hosts: localhost" to make the
    playbook run only on the local system.


    +   3. Run the ansible-playbook in the check mode. This does not change any settings
    on your system.


    ```

    $ ansible-playbook --check tests_default.yml

    ```


    The command returns the value failed=0.


    # Additional resources


    +   - The ansible-playbook man page.


    # 3.4. INSTALLING COLLECTIONS FROM AUTOMATION HUB


    If you are using the Automation Hub, you can install the System Roles Collection
    hosted on the Automation Hub.


    # Prerequisites'
  merge: -1
  pgno: 16
