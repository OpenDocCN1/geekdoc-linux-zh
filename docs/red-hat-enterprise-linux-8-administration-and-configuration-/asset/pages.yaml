  md: "# 13.12. CONFIGURING A RAID VOLUME USING THE STORAGE SYSTEM ROLE\n\nWith the\
    \ storage System Role, you can configure a RAID volume on RHEL using Red Hat Ansible\
    \ Platform. In this section you will learn how to set up an Ansible playbook with\
    \ the available parameters to configure a RAID volume to suit your requirements.\n\
    \nPrerequisites\n\n+   - You have Red Hat Ansible Engine installed on the system\
    \ from which you want to run the playbook.\n\n> NOTE\nnYou do not have to have\
    \ Red Hat Ansible Automation Platform installed on the systems on which you want\
    \ to deploy the storage solution.\n\n+   - You have the rhel-system-roles package\
    \ installed on the system from which you want to run the playbook.\n\n+   - You\
    \ have an inventory file detailing the systems on which you want to deploy a RAID\
    \ volume using the storage System Role.\n\nProcedure\n\n+   1. Create a new playbook.yml\
    \ file with the following content:\n\n```\n- hosts: all\nvars:\n  storage_safe_mode:\
    \ false\n  storage_volumes:\n    - name: data\n      type: raid\n      disks:\
    \ [ssd, sde, sdf, sdg]\n      raid_level: raid\n      raid_chunk_size: 32 KiB\n\
    \      mount_point: /mnt/data\n  state: present\nroles:\n  - name: rhel-system-roles.storage\n\
    ```\n\n> WARNING\nDevice names can change in certain circumstances; for example,\
    \ when you add a new disk to a system. Therefore, to prevent data loss, we do\
    \ not recommend using specific disk names in the playbook.\n\n+   2. Optional.\
    \ Verify playbook syntax."
  merge: -1
  pgno: 86
- img_proc: true
