    a command before and after a certificate is issued or renewed.


    In the following example, the administrator ensures stopping the http service
    before a self-signed certificate for www.example.com is issued or renewed, and
    restarting afterwards.


    # NOTE


    By default, certmonger automatically tries to renew the certificate before it
    expires. You can disable this by setting the auto_renew parameter in the Ansible
    playbook to no.


    # Prerequisites


    +   - have Red Hat Ansible Engine installed on the system from which you want
    to run the playbook.


    # NOTE


    You do not have to have Ansible installed on the systems on which you want to
    deploy the certificate solution.


    +   - have the rhel-system-roles package installed on the system from which you
    want to run the playbook. For details RHEL System Roles and how to apply them,
    see Getting started with RHEL System Roles.


    # Procedure


    +   - Optional: Create an inventory file, for exampleinventory.file:


    ```

    $ touch inventory.file

    ```


    +   - Open your inventory file and define the hosts on which you want to request
    the certificate, for example:


    ```

    [webserver]

    server.id.example.yml

    ```


    +   - Create a playbook file, for example request-certificate.yml:


    +   - Set hosts to include the hosts on which you want to request the certificate,
    such as webserver.


    +   - Set the certificate_requests variable to include the following:


    +   - Set the name parameter to the desired name of the certificate, such anycert.


    +   - Set the dns parameter to the domain to be included in the certificate, such
    as www.example.com.


    +   - Set the ca parameter to the CA you want to use to issue the certificate,
    such as self-sign.'
