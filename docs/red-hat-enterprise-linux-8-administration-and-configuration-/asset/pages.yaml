  md: '# # CHAPTER 2. INSTALLING RHEL SYSTEM ROLES IN YOUR SYSTEM


    To use the RHEL System Roles, install the required packages in your system.


    Prerequisites


    +   - You have a Red Hat Ansible Engine Subscription. See the procedure [How do
    I Download and Install Red Hat Ansible Engine?](https://www.redhat.com/en/articles/red-hat-ansible-management/how-to-download-and-install-red-hat-ansible-engine)

    -) (Wait


    Procedure


    +   1. Install the **rhel-system-roles** package on the system that you want to
    use as a control node:

    ```bash

    # yum install rhel-system-roles

    ```

    If you do not have a Red Hat Ansible Engine Subscription, you can use a limited
    supported version of Red Hat Ansible Engine provided with your Red Hat Enterprise
    Linux subscription. In this case, follow these steps:

    a. Enable the RHEL Ansible Engine repository:

    ```bash

    # subscription-manager refresh

    # subscription-manager repos --enable ansible-2-for-rhel-8-x86_64-rpms

    ```

    b. Install Ansible Engine:

    ```bash

    # yum install ansible

    ```


    As a result, you are able to create an Ansible playbook.


    Additional resources


    +   - The [Red Hat Enterprise Linux (RHEL) System Roles](https://docs.redhat.com/en/red-hat-enterprise-linux/8/)

    - The **ansible-playbook** man page.'
