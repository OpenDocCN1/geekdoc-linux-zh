    # CHAPTER 6. CONFIGURING SELINUX USING SYSTEM ROLES


    # 6.1. INTRODUCTION TO THE SELINUX SYSTEM ROLE


    RHEL System Roles are a collection of Ansible roles and modules that provide a
    consistent configuration interface to remotely manage multiple RHEL systems. The
    SELinux system role enables the following actions:


    +   - Cleaning policy modifications related to SELinux booleans, file contexts,
    ports, and logins.

    - Setting SELinux policy booleans, file contexts, ports, and logins.

    - Restoring file contexts on specified files or directories.

    - Managing SELinux modules.


    The following table provides an overview of input variables available in the SELinux
    system role.


    Table 6.1. SELinux role variables


    | Role variable | Description | CLI alternative |

    | --- | --- | --- |

    | selinux_policy | Chooses a policy protecting targeted processes or Multi Level
    Security protection. | **SELINUXTYPE** in `/etc/selinux/config` |

    | selinux_state | Switches SELinux modes. See **ansible-doc selinux** | **setforce**
    and **SELINUX** in `/etc/selinux/config`. |

    | selinux_booleans | Enables and disables SELinux booleans. See **ansible-doc
    seboolean**. | **setsebool** |

    | selinux_fcontexts | Adds or removes a SELinux file context mapping. See **ansible-doc
    fcontext**. | **semanage fcontext** |

    | selinux_restore_dirs | Restores SELinux labels on the file-system tree. | **restorecon
    -R** |

    | selinux_ports | Sets SELinux labels on ports. See **ansible-doc deport.** |
    **semanage port** |

    | selinux_logins | Sets users to SELinux user mapping. See **ansible-doc login**.
    | **semanage login** |

    | selinux_modules | Installs, enables, disables, or removes SELinux modules. |
    **semodule** |'
