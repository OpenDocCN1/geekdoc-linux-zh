    # # CHAPTER 13. MANAGING LOCAL STORAGE USING RHEL SYSTEM ROLES


    To manage LVM and file systems (FS) using Ansible, you can use the storage role,
    which is one of the RHEL System Roles available in RHEL 8.


    Using the storage role enables you to automate administration of file systems
    on disks and logical volumes on multiple machines and all versions of RHEL starting
    with RHEL 7.7.


    For more information about RHEL System Roles and how to apply them, see Introduction
    to RHEL System Roles.


    # ## 13.1. INTRODUCTION TO THE STORAGE ROLE


    The storage role can manage:


    +   - File systems on disks which have not been partitioned

    - Complete LVM volume groups including the logical volumes and file systems


    With the storage role you can perform the following tasks:


    +   - Create a file system

    - Remove a file system

    - Mount a file system

    - Unmount a file system

    - Create LVM volume groups

    - Remove LVM volume groups

    - Create logical volumes

    - Remove logical volumes

    - Create RAID volumes

    - Remove RAID volumes

    - Create LVM pools with RAID

    - Remove LVM pools with RAID


    # ## 13.2. PARAMETERS THAT IDENTIFY A STORAGE DEVICE IN THE STORAGE SYSTEM ROLE


    Your storage role configuration affects only the file systems, volumes, and pools
    that you list in the following variables.


    storage_volumes


    List of file systems on all unpartitioned disks to be managed.

    Partitions are currently unsupported.'
