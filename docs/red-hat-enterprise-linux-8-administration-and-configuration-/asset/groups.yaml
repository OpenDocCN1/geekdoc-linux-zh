    \ login**。 | **semanage login** |\n| selinux_modules | 安装、启用、禁用或删除 SELinux 模块。\
    \ | **semodule** |\n\n由 rhel-system-roles 软件包安装的 `example-selinux-playbook.yml`\
    \ 示例 playbook 演示了如何在强制模式（enforcing mode）下设置目标策略。该 playbook 还应用了若干本地策略，并恢复了你在 `/tmp/test_dir/`\
    \ 中经过验证的上下文。\n\n有关 SELinux 变量的详细参考，请安装 rhel-system-roles 软件包，并查看 `/usr/share/doc/rhel-system-roles/selinux/`\
    \ 目录下的 README.md 或 README.html 文件。\n\n额外资源\n\n- RHEL System Roles 简介。\n\n## 6.2.\
    \ 使用 SELINUX 系统角色在多个系统上应用 SELINUX 设置\n\n按照以下步骤准备并应用带有已验证设置的 Ansible playbook。\n\
    \n先决条件\n\n- 您的 RHEL 订阅已绑定。\n\n操作步骤\n\n- 启用存储库：\n```bash\n# subscription-manager\
    \ repos --enable\n```\n\n- 安装 Ansible：\n```bash\n# subscription-manager ansible\n\
    ```\n\n- 安装 rhel-system-roles 软件包：\n```bash\n# yum install rhel-system-roles\n\
    ```\n\n- 准备您的 playbook：\n```bash\n# cp /usr/share/doc/rhel-system-roles/selinux/example-selinux-playbook.yml\
    \ my-selinux.yml\n```\n\n- 修改 playbook 内容以符合场景：\n```bash\n# vi my-selinux.yml\n\
    ```\n\n- 在 host1、host2 和 host3 上运行您的 playbook：\n```bash\n# ansible-playbook -i\
    \ host1,host2,host3 my-selinux.yml\n```\n\n# 第 7 章 使用 LOGGING ROLE\n\n作为系统管理员，您可以使用\
    \ Logging Role 配置 RHEL 主机作为日志服务器，从许多客户端系统收集日志。\n\n## 7.1. LOGGING ROLE\n\n通过 Logging\
    \ Role，您可以在本地和远程主机上部署日志配置。\n\n要在多个系统上应用日志角色，您需要在 playbook 中定义日志配置。playbook 是一个或多个剧（plays）的列表。playbook\
    \ 是易读的，并以 YAML 格式编写。有关 playbook 的更多信息，请参阅 Ansible 文档。\n\n您希望 Ansible 配置的系统集在清单文件中定义。有关如何构建清单的更多信息，请参阅\
    \ Ansible 文档。\n\n日志日志解决方案提供了多种读取日志的方法和多种日志输出。\n\n例如，日志系统可以接收以下输入：\n\n- 本地文件\n\
    - systemd/journal\n- 网络上的另一个日志系统\n\n此外，日志系统可以具有以下输出：\n\n- 存储在 /var/log 目录下的本地文件\n\
    - 发送到 Elasticsearch\n- 转发到另一个日志系统\n\n通过日志角色，您可以组合输入和输出以满足需求。例如，可以配置一种日志解决方案，将\
    \ journal 的输入存储在本地文件中，而将文件的输入既转发到另一个日志系统存储在本地文件中。\n\n## 7.2. LOGGING ROLE 参数\n\
    \n在 Logging Role playbook 中，您在 `logging_inputs` 参数中定义输入，在 `logging_outputs` 参数中定义输出，并在\
    \ `logging_flows` 参数中定义输入与输出之间的关系。Logging Role 使用额外选项处理这些变量以配置日志系统。您还可以启用加密。\n\
    \n> 注意\n> 目前 Logging Role 中唯一可用的日志系统是 Rsyslog。\n\n- logging_inputs: 日志解决方案的输入列表。\n\
    \  - name: 输入的唯一名称。在 `logging_flows: inputs` 列表未使用，也是生成文件名的一部分。\n\n"
