    \ creates or updates the enp7s0 connection profile with the following settings:\n\
    \n- A static IPv4 address - 198.51.100.20 with a/24 subnet mask\n- A static IPv6\
    \ address - 2001:db8:1::1 with a/64 subnet mask\n- An IPv4 default gateway - 198.51.100.254\n\
    - An IPv6 default gateway - 2001:db8:1::fffe\n- An IPv4 DNS server - 198.51.100.200\n\
    - An IPv6 DNS server domain - 2001:db8:1::ffbb\n- A DNS server domain - example.com\n\
    - 192.0.2.0/24 with gateway 198.51.100.101\n- 203.0.113.0/24 with gateway 198.51.100.22\n\
    \n# Prerequisites\n\n- The ansible and rhel-system-roles packages are installed\
    \ on the control node.\n- If you use a different user than root when you run the\
    \ playbook, this user has appropriate sudo permissions on the managed node.\n\n\
    # Procedure\n\n1. If the host on which you want to execute the instructions in\
    \ the playbook is not yet inventoried, add the IP or name of this host to the\
    \ /etc/ansible/hosts Ansible inventory file:\n\n```\nnode.example.com\n```\n\n\
    2. Create the ~/add-static-routes.yml playbook with the following content:\n\n\
    ```yaml\n---\nname: Configure an Ethernet connection with static IP and additional\
    \ routes\nhosts: node.example.com\nbecome: true\ntasks:\n  - include_role:\n \
    \     name: linux-system-roles.network\n    vars:\n      network_connections:\n\
    \        - name: enp7s0\n          type: ethernet\n          autoconnect: yes\n\
    \          ip:\n            address:\n              - 198.51.100.20/24\n     \
    \         - 2001:db8::1/64\n            gateway4: 198.51.100.254\n           \
    \ gateway6: 2001:db8::1fffe\n          dns:\n            - 198.51.100.200\n  \
    \          - 2001:db8::1ffb\n          dns_search:\n            - example.com\n\
    \          route:\n            - network: 192.0.2.0\n              prefix: 24\n\
    \              gateway: 198.51.100.1\n            - network: 203.0.113.0\n   \
    \           prefix: 24\n              gateway: 198.51.100.2\n      state: up\n\
    ```\n\n3. Run the playbook:\n\n- To connect as root user to the managed host,\
    \ enter:\n\n```\n# ansible-playbook -u root ~/add-static-routes.yml\n```\n\n-\
    \ To connect as a user to the managed host, enter:\n\n```\n# ansible-playbook\
    \ -u user_name --ask-become-pass ~/add-static-routes.yml\n```\n\nThe --ask-become-pass\
    \ option makes sure that the ansible-playbook command prompts for the sudo password\
