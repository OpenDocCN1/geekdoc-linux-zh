    # 7.5. APPLYING A REMOTE LOGGING SOLUTION USING THE LOGGING SYSTEM ROLE


    Follow these steps to prepare and apply a Red Hat Ansible Engine playbook to configure
    a remote logging solution. In this playbook, one or more clients logs from systemd-journal
    and forward them to a remote server. The server receives remote input from remote_rsyslog
    and remote_files and outputs the logs to local files in directories named by remote
    hosts.


    Prerequisites


    +   - You have Red Hat Ansible Engine installed on the system from which you want
    to run the playbook.


    > NOTE

    nYou do not have to have Red Hat Ansible Engine installed on the systems which
    you want to deploy the logging solution.


    +   - You have the rhel-system-roles package on the system from which you want
    to run the playbook.


    > NOTE

    You do not have to have rsyslog installed, because the system role installs rsyslog
    when deployed.


    +   - You have at least two systems:

    - At least one will be the logging server.

    - At least one will be the logging client.


    Procedure


    +   1. Create a playbook that defines the required role:

    a. Create a new YAML file and open it in a text editor, example:


    ```

    # vi logging-playbook.yml

    ```


    +   b. Insert the following content into the file:


    ```

    ---

    - name: Deploying remote input and remote_files output

    hosts: server

    ```'
