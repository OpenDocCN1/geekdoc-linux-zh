    \ AVAILABILITY CLUSTER WITH FENCING AND RESOURCES\n\nThe following procedure uses\
    \ the ha_cluster system role, to create a high availability cluster with fencing\
    \ configured and which runs no resources.\n"
  mdcn: "\n\n## 第 17 章：使用系统角色配置高可用性集群\n\n- **operations** (可选) - 资源的操作列表。\n- **action**\
    \ (强制性) - 由 pacemaker 资源代理或 stonith 代理定义的的操作动作。\n- **attrs** (强制性) - 操作选项，必须指定至少一个选项。\n\
    \n你通过 **ha_cluster** 系统角色配置的资源定义结构如下：\n\n```yaml\n- id: resource-id\n  agent:\
    \ resource-agent\n  instance_attrs:\n    - attrs:\n        - name: attribute1_name\n\
