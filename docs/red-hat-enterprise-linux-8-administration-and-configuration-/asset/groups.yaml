    \ file.\n\n## 13.11. EXAMPLE ANSI PLAYBOOK TO CREATE A SWAP PARTITION USING THE\
    \ STORAGE RHEL SYSTEM ROLE\n\nThis section provides an Ansible playbook. This\
    \ playbook applies the storage role to create a swap partition, if it does not\
    \ exist, or to modify the swap partition, if it already exists, on a block device\
    \ using the default parameters.\n\nExample 13.10. A playbook that creates XFS\
    \ on /dev/sdb\n\n```yaml\n---\n- name: Create a disk device with swap\n- hosts:\
    \ all\n  vars:\n  storage_volumes:\n    - name: barefs\n      type: disk\n   \
    \   disks:\n        - /dev/sdb\n      size: 15GiB\n      fs_type: swap\n     \
    \ mount_point: /opt/barefs\n  roles:\n  - rhel-system-roles.storage\n```\n\n-\
    \ * The volume name (barefs in the example) is currently arbitrary. The storage\
    \ role identifies the volume by the disk device listed under the disks.\n\nAdditional\
    \ resources\n\n- * The /usr/share/ansible/roles/rhel-system-roles.storage/README.md\
    \ file.\n\n## 13.12. CONFIGURING A RAID VOLUME USING THE STORAGE ROLE\n\nWith\
    \ the storage System Role, you can configure a RAID volume on RHEL using Red Hat\
    \ Ansible Platform. In this section you will learn how to set up an Ansible playbook\
    \ with the available parameters to configure a RAID volume to suit your requirements.\n\
    \nPrerequisites\n\n- * You have Red Hat Ansible Engine installed on the system\
    \ from which you want to run the playbook.\n\n> NOTE\nYou do not have to have\
    \ Red Hat Automation Platform installed on the systems on which you want to deploy\
    \ the storage solution.\n\n- * You have the rhel-system-roles package installed\
    \ on the system from which you want to run the playbook.\n\n- * You have an inventory\
    \ file detailing the systems on which you want to deploy a RAID volume using the\
    \ storage System Role.\n\nProcedure\n\n- 1. Create a new playbook.yml file with\
    \ the following content:\n\n```yaml\n---\n- hosts: all\nvars:\n  storage_safe_mode:\
    \ false\n  storage_volumes:\n    - name: data\n      type: raid\n      disks:\
    \ [ssd, sde, sdf, sdg]\n      raid_level: raid\n      raid_chunk_size: 32 KiB\n\
    \      mount_point: /mnt/data\n  state: present\nroles:\n  - name: rhel-system-roles.storage\n\
    ```\n\n> WARNING\nDevice names can change in certain circumstances; for example,\
    \ when you add a new disk to a system. Therefore, to prevent data loss, we do\
    \ not recommend using specific disk names in the playbook.\n\n- 2. Optional. Verify\
    \ playbook syntax.\n"
