    \ -i inventory new-cluster.yml\n```\n\n## 17.5. CONFIGURING AN APACHE HTTP SERVER\
    \ IN A HIGH AVAILABILITY CLUSTER WITH THE HA_CLUSTER SYSTEM ROLE\n\nThis procedure\
    \ configures an active/passive Apache HTTP server in a two-node Red Enterprise\
    \ Linux Availability Add-on using the ha_cluster system role.\n\n### Prerequisites\n\
    \n- You have Red Hat Ansible Engine installed on the node from which you want\
    \ to run the playbook.\n\n> NOTE\n> You do not have to have Ansible Engine installed\
    \ on the cluster member nodes.\n\n- You have the rhel-system-roles package installed\
    \ on the system from which you want to run the playbook. For details RHEL System\
    \ Roles and how to apply them, see Getting started with RHEL System Roles.\n\n\
    - The systems running RHEL that you will use as your cluster members must have\
    \ active subscription coverage for RHEL and the RHEL High Availability Add-On.\n\
    \n- Your system includes a public IP address, required for Apache.\n\n- Your system\
    \ includes shared storage for the nodes in the cluster, using iSCSI, Fibre Channel,\
    \ or other shared network device.\n\n- You have configured an LVM logical volume\
    \ with ext4, as described in Configuring an LVM volume with an ext4 file system\
    \ in a Pacemaker cluster.\n\n- You have configured an Apache HTTP server, as described\
    \ in Configuring an Apache HTTP server.\n\n- Your system includes an APC power\
    \ switch that will be used to fence the cluster nodes.\n\n> NOTE\n> The ha_cluster\
    \ system role replaces any existing cluster configuration on the specified nodes.\
    \ Any settings not specified in the role will be lost.\n\n### Procedure\n\n- 1.\
    \ Create an inventory file specifying the nodes in the cluster, as described in\
    \ Specifying an inventory for the ha_cluster system role.\n\n- 2. Create a playbook\
    \ file, for example http-cluster.yml: The following example playbook configures\
    \ a previously-created Apache HTTP server in an active/passive two-node HA cluster.\n\
    \nThis example uses an APC power switch with a host name of zapc.example.com.\
    \ If the cluster does not use any fence agents, you can only list the fence agents\
    \ your cluster requires when defining the ha_cluster_fence_agent_packages variable,\
    \ as in this example.\n\nWhen creating your playbook file for production, it is\
    \ recommended that you vault encrypt the password, as described in Encrypting\
    \ content with Ansible Vault.\n\n```yaml\n- hosts: z1.example.com z2.example.com\n\
    - rhel-system-roles.ha_cluster vars:_cluster_hacluster_password: ha_cluster_name:\
    \ my_cluster\nha_cluster_fence_agent_packages:\n  - fence-agents-apc-snmp\nha_cluster_resource_primitives:\n\
    \  - id: myapc\n    agent: stonith:fence_apc_snmp\n    instance_attrs:\n     \
    \ - attrs:\n          - name: ipaddr\n          value: zapc.example.com\n    \
    \    - name: pcmk_host_map\n          value: z1.example.com:1;z2.example.com:2\n\
    \        - name: login\n          value: apc\n        - name: password\n     \
    \     value: apc\n  - id: my_lvm\n    agent: ocf:heartbeat:LVM-activate\n    instance_attrs:\n\
    \      - attrs:\n          - name: vgname\n          value: my_vg\n        - name:\
    \ vg_access_mode\n          value: system_id\n  - id: my_fs\n    agent: Filesystem\n\
    \    instance_attrs:\n      - attrs:\n          - name: device\n          value:\
    \ /dev/my_vg/my_lv\n        - name: directory\n          value: /var/www\n   \
    \     - name: ftype\n          value: ext4\n  - id: VirtualIP\n    agent: IPaddr2\n\
    \    instance_attrs:\n      - attrs:\n          - name: ip\n          value: 198.51.100.3\n\
    \        - name: cidr_netmask\n          value: 24\n  - id: Website\n    agent:\
    \ apache\n    instance_attrs:\n      - attrs:\n          - name: ip\n        \
    \  value: 198.51.100.3\n        - name: cidr_netmask\n          value: 24\n```\n\
    \n+ 2. Once the cluster is up and running, you can point a browser to the defined\
    \ IP address to view the sample, consisting of \"Hello\".\n\n- 1. From the cluster\
    \ members, check the status of the cluster.\n\n```bash\n[root@z1]# pcs status\n\
    Cluster name: my_cluster\nLast updated: Wed 31 17:16:17\nLast change: Wed 31 17:18:24\
    \ via crm_attribute on z1.example.com\nStack: corosync\nCurrent DC: z2.example.com\
    \ (2) - partition with quorum\nVersion: 1.110-5.7-9ab687\n2 Nodes configured\n\
    6 Resources configured\n\nFull list of resources:\nmyapac (stonith:fence_apc_snmp):\
