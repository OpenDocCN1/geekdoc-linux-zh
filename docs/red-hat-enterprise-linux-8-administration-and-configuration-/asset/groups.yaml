    # CHAPTER 5. USING SYSTEM ROLES TO CONFIGURE NETWORK CONNECTIONS\n\nAdditional\
    \ resources\n\n- /usr/share/ansible/roles/rhel-system-roles.network/README.md\n\
    - ansible-playbook(1) man page\n\n# 5.6. CONFIGURING A STATIC ETHERNET CONNECTION\
    \ WITH 802.1X NETWORK AUTHENTICATION USING RHEL SYSTEM ROLES\n\nUsing RHEL System\
    \ Roles, you can automate the creation of an Ethernet connection that uses the\
    \ 802.1X standard to authenticate the client. This procedure describes how to\
    \ remotely add an Ethernet connection for the enp9s interface with the following\
    \ settings by running Ansible playbook:\n\n- A static IPv4 address - 192.0.2.1\
    \ with a/24 subnet mask\n- A static IPv6 address - 2001:db8::1:: with a/64 subnet\
    \ mask\n- An IPv4 default gateway - 192.0.2.254\n- An IPv6 default gateway - 2001:db8::1::fffe\n\
    - An IPv4 DNS server - 192.0.2.200\n- An IPv6 DNS server - 2001:db8::1::ffbb\n\
    - A DNS search domain - example.com\n- 802.1X network authentication using the\
    \ TLS Extensible Authentication Protocol (EAP)\n\nRun this procedure on the Ansible\
    \ control node.\n\nPrerequisites\n\n- The ansible and rhel-system-roles packages\
    \ are installed on the control node.\n- If you use a different remote user than\
    \ root when you run the playbook, you must have appropriate sudo permissions on\
    \ the managed node.\n- The network supports 802.1X network authentication.\n-\
    \ The managed node uses NetworkManager.\n- The files required for TLS authentication\
    \ exist on the control node:\n\n- The client key is stored in the /srv/data/client/client.key\
    \ file.\n- The client certificate is stored in the /srv/data/client/client.crt\
    \ file.\n- The Certificate Authority (CA) certificate is stored in the /srv/data/data/ca.crt\
    \ file.\n\nProcedure\n\n- If the host on which you want to execute the instructions\
    \ in the playbook is not yet inventoried, add the IP or name of this host to the\
    \ /etc/ansible/hosts Ansible inventory file:\n\nnode.example.com\n\n2. Create\
    \ the ~/enable-802.1x.yml playbook with the following content:\n\n```yaml\n---\n\
    - name: Configure an Ethernet connection with 802.1X authentication\nhosts: node.example.com\n\
    become: true\ntasks:\n  - name: Copy client key for 802.1X authentication\n  \
    \  copy:\n      src: \"/srv/data/client.key\"\n      dest: \"/etc/pki/tls/private/client.key\"\
    \n      mode: 0600\n  - name: Copy client certificate for 802.1X authentication\n\
    \    copy:\n      src: \"/srv/data/client.crt\"\n      dest: \"/etc/pki/tls/certs/client.crt\"\
    \n  - name: Copy CA certificate for 802.1X authentication\n    copy:\n      src:\
    \ \"/srv/data/ca.crt\"\n      dest: \"/etc/pki/ca-trust/source/anchors/ca.crt\"\
    \n  - include_role:\n    name: linux-system-roles.network\n    vars:\n      network_connections:\n\
    \        name: enp1s0\n        type: ethernet\n        autoconnect: yes\n    \
    \    ip:\n          address:\n            - 192.0.2.1/24\n            - 2001:db8::1/64\n\
    \          gateway4: 192.0.2.254\n          gateway6: 2001:db8::1::fffe\n    \
    \      dns:\n            - 192.0.2.200\n            - 2001:db8::1::ffbb\n    \
    \      dns_search:\n            - example.com\n      802.1x:\n        identity:\
    \ user_name\n        eap: tls\n        private_key: \"/etc/pki/tls/private/client.key\"\
    \n        private_password: \"password\"\n        client_cert: \"/etc/pki/tls/certs/client.crt\"\
    \n        ca_cert: \"/etc/pki/ca-trust/source/anchors/ca.crt\"\n        domain_suffix:\
    \ example.com\n        state: up\n```\n\n3. Run the playbook:\n\n- To connect\
    \ as root user to the managed host, enter:\n  - ansible-playbook -u root ~/enable-802.1x.yml\n\
    - To connect as a user to the managed host, enter:\n  - ansible-playbook -u user_name\
    \ --ask-become-pass ~/ethernet-static.yml\n\nThe --ask-become-pass option ensures\
    \ that ansible-playbook command prompts for the password of the user defined in\
    \ the -u user_name option.\n\nIf you do not specify the -u user_name option, ansible-playbook\
    \ connects to the managed host as the user that is currently logged in to the\
    \ control node.\n\nAdditional resources\n\n- /usr/share/ansible/roles/rhel-system-roles.network/README.md\n\
    - /usr/share/ansible/roles/rhel-system-roles.network/README.md\n- ansible-playbook(1)\
    \ man page\n\n# 5.7. SETTING THE DEFAULT GATEWAY ON AN EXISTING CONNECTION USING\
    \ SYSTEM ROLES\n\nYou can use RHEL System Role to set the default gateway.\n\n\
    # IMPORTANT\n\nWhen you run a play that uses the RHEL System Role, the System\
    \ Role overrides an existing connection with the same name if the settings do\
    \ not match the ones in the play. Therefore, always specify the whole configuration\
    \ of the network connection in the play, even if it already exists. Otherwise,\
    \ the role resets these values to their defaults.\n\nDepending on whether it already\
    \ exists, the procedure creates or updates the enp1s0 connection with the following\
    \ settings:\n\n- A static IPv4 address - 198.51.100.20 with a/24 subnet mask\n\
    - A static IPv6 address - 2001:db8::1:: with a/64 subnet mask\n- An IPv4 default\
    \ gateway - 198.51.100.254\n- An IPv6 default gateway - 2001:db8::1::fffe\n- An\
    \ IPv4 DNS server - 198.51.100.200\n- An IPv6 DNS server - 2001:db8::1::ffbb\n\
    - A DNS search domain - example.com\n\n# Prerequisites\n\n- The ansible and rhel-system-roles\
    \ packages are installed on the control node.\n- If you use a remote user other\
    \ than root when you run the playbook, this user has appropriate sudo permissions\
    \ on the managed node.\n\nProcedure\n\n1. If the host on which you want to execute\
    \ the instructions in the playbook is not inventoried, add the IP or name of this\
    \ host to the /etc/ansible/hosts Ansible inventory:\n\n```\nnode.example.com\n\
    ```\n\n2. Create the `~/ethernet-connection.yml` playbook with the following content:\n\
    \n```yaml\n---\n- name: Configure an Ethernet connection with static IP and default\
    \ gateway\n  hosts: node.example.com\n  become: true\n  tasks:\n    - include_role:\n\
    \        name: linux-system-roles.network\n\nvars:\n  network_connections:\n \
    \   - name: enp1s0\n      type: ethernet\n      autoconnect: yes\n      address:\n\
    \        - 198.51.100.20/24\n        - 2001:db8::1/64\n      gateway4: 198.51.100.254\n\
    \      gateway6: 2001:db8::1::ffff\n      dns:\n        - 198.51.100.200\n   \
    \     - 2001:db8::1::ffbb\n  dns_search:\n    - example.com\n  state: up\n```\n\
    \n3. Run the playbook:\n- To connect as root user to the managed host, enter:\n\
    - To connect as a user to the managed host, enter:\n\n```\n# ansible-playbook\
    \ -u root ~/ethernet-connection.yml\n```\n\n```\n# ansible-playbook -u user_name\
    \ --ask-become-pass ~/ethernet-connection.yml\n```\n"
