    and restores your verified contexts in the /tmp/test_dir/.


    For a detailed reference on SELinux variables, install the rhel-system-roles package,
    and see the README.md or README.html files in theusr/share/doc/rhel-system-roles/selinux/
    directory.


    Additional resources


