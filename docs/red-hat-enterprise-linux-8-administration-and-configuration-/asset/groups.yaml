    \n+ 3. Save the file.\n\n+ 4. Run the playbook:\n\n```bash\n$ ansible-playbook\
    \ -i inventory new-cluster.yml\n```\n\n## 17.5. CONFIGURING AN APACHE HTTP SERVER\
    \ IN A HIGH AVAILABILITY CLUSTER WITH THE HA_CLUSTER SYSTEM ROLE\n\nThis procedure\
    \ configures an active/passive Apache HTTP server in a two-node Red Enterprise\
    \ Linux Availability Add-on using the ha_cluster system role.\n\n### Prerequisites\n\
    \n- You have Red Hat Ansible Engine installed on the node from which you want\
    \ to run the playbook.\n\n> NOTE\n> You do not have to have Ansible Engine installed\
    \ on the cluster member nodes.\n\n- You have the rhel-system-roles package installed\
