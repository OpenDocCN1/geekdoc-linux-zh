    \n关于 RHEL 系统角色以及如何应用它们的更多信息，请参阅《RHEL 系统角色简介》。\n\n## 13.1. STORAGE 角色简介\n\nstorage\
    \ 角色可以管理：\n\n- 未分区的磁盘文件系统\n- 完整的 LVM 卷组，包括逻辑卷和文件系统\n\n通过 storage 角色，您可以执行以下任务：\n\
    \n- 创建文件系统\n- 删除文件系统\n- 挂载文件系统\n- 卸载文件系统\n- 创建 LVM 卷组\n- 删除 LVM 卷组\n- 创建逻辑卷\n\
    - 删除逻辑卷\n- 创建 RAID\n- 删除 RAID\n- 创建 LVM 池\n- 删除 LVM 池\n\n## 13.2. 标识存储设备的参数\n\n\
    storage 角色通过 `disks:` 属性识别卷。\n\n`storage_volumes`\n\n要管理的文件系统列表。目前支持的池是 LVM。\n\
