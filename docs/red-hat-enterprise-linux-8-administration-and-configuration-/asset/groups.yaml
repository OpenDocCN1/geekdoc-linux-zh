    \ 上创建 XFS 的 playbook\n\n```yaml\n---\n- hosts: all\nvars:\n  storage_volumes:\n\
    \    - name: barefs\n      type: disk\n      disks:\n        - sdb\n      fs_type:\
    \ xfs\nroles:\n  - rhel-system-roles.storage\n```\n\n- 示例卷名 barefs 是任意的。\n- 您可以省略\
