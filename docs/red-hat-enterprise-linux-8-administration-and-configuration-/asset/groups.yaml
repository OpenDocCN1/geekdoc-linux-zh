    \nDepending on whether it already exists, the procedure creates or updates the\
    \ enp7s0 connection profile with the following settings:\n\n- A static IPv4 address\
    \ - 198.51.100.20 with a/24 subnet mask\n- A static IPv6 address - 2001:db8:1::1\
