    - You have an inventory file detailing the systems on which you want to configure\
    \ LVM pool with RAID using the storage System Role.\n\n###Procedure\n\n- 1. Create\
    \ a new playbook.yml file with the following content:\n\n```yaml\n- hosts: all\n\
    vars:\n  storage_safe_mode: false\n  storage_pools:\n  - name: my_pool\n    type:\
    \ lvm\n    disks: [sdh, sdi]\n    raid_level: raid1\n  volumes:\n  - name: my_pool\n\
    \    size: \"1 GIB\"\n    mount_point: \"/mnt/app/shared\"\n    fs_type: xfs\n\
    \    state: present\n  - name: rhel-system-roles.storage\n```\n\n> NOTE\n> To\
    \ create an LVM pool with RAID, you must specify the RAID type using the raid_level\
    \ parameter.\n\n- 2. Optional. Verify playbook syntax.\n\n```bash\n# ansible-playbook\
    \ --syntax-check playbook.yml\n```\n\n- 3. Run the playbook on your inventory\
    \ file:\n\n```bash\n# ansible-playbook -i inventory.file /path/to/file/playbook.yml\n\
    ```\n\nAdditional resources\n\n- Managing RAID.\n- The /usr/share/ansible/roles/rhel-system-roles.storage/README.md\
    \ file.\n\n## 13.14. CREATING LUKS ENCRYPTED VOLUME USING THE STORAGE ROLE\n\n\
    You can use the storage role to create and configure a volume encrypted with LUKS\
    \ by running an Ansible playbook.\n\n###Prerequisites\n\n- You have Red Hat Ansible\
    \ Engine installed on the system from which you want to run the playbook.\n\n\
    > NOTE\n> You do not have to have Red Hat Ansible Automation Platform installed\
    \ on the systems on which you want to create the volume.\n\n- You have the rhel-system-roles\
    \ package installed on the Ansible controller.\n- You have an inventory file detailing\
    \ the systems on which you want to deploy a LUKS encrypted volume using the system\
    \ Storage Role.\n\n###Procedure\n\n- 1. Create a new playbook.yml file with the\
    \ following content:\n\n```yaml\nhosts: all\nvars:\n  storage_volumes:\n  - name:\
    \ barefs\n    type: disk\n    disks:\n    - sdb\n    fs_type: xfs\n    fs_label:\
    \ label_name\n    mount_point: /mnt/data\n    encryption: true\n    encryption_password:\
    \ your-password\n    roles:\n  - rhel-system-roles.storage\n```\n\n- 2. Optional:\
    \ Verify playbook syntax:\n\n```bash\n# ansible-playbook --syntax-check playbook.yml\n\
    ```\n\n- 3. Run the playbook on your inventory file:\n\n```bash\n# ansible-playbook\
    \ -i inventory.file/path/to/file/playbook.yml\n```\n\nAdditional resources\n\n\
    - Encrypting block devices using LUKS\n- /usr/share/ansible/roles/rhel-system-roles/storage/README.md\
    \ file\n\n## 13.15. ADDITIONAL RESOURCES\n\n- /usr/share/doc/rhel-system-roles/storage/\n\
    - /usr/share/ansible/roles/rhel-system-roles.storage/\n\n## CHAPTER 14. CONFIGURING\
    \ TIME SYNCHRONIZATION USING RHEL SYSTEM ROLES\n\nWith the timesync RHEL System\
    \ Role, you can manage time synchronization on multiple target machines using\
    \ Red Hat Ansible Automation Platform.\n\n## 14.1. THE TIMESYNC SYSTEM ROLE\n\n\
    You can manage time synchronization on multiple target machines using the timesync\
    \ RHEL System Role.\n\nThe timesync role installs and configures an NTP or PTP\
    \ implementation to operate as an NTP client or PTP replica to synchronize the\
    \ system clock with NTP servers or grandmasters in PTP domains.\n\nNote that using\
    \ the timesync role also facilitates the migration to chronology, because you\
    \ can use the same playbook on all versions of Red Hat Enterprise Linux starting\
    \ with RHEL 6 regardless of whether the system uses ntp or chronology to implement\
    \ the NTP protocol.\n\n## 14.2. APPLYING THE TIMESYNC SYSTEM ROLE FOR A SINGLE\
    \ POOL OF SERVERS\n\nThe following example shows how to apply the timesync role\
    \ in a situation with just one pool of servers.\n\n> WARNING\n> The timesync role\
    \ replaces the configuration of the given or detected provider service on the\
    \ managed host. Previous settings are lost, even if they are not specified in\
    \ the role variables. The only preserved setting is the choice of provider if\
    \ the timesync_ntp_provider variable is not defined.\n\n###Prerequisites\n\n-\
    \ You have Red Hat Ansible Engine installed on the system from which you want\
    \ to run the playbook.\n- You have Red Hat Ansible Automation Platform installed\
    \ on the systems on which you want to deploy the storage solution.\n- You have\
    \ the rhel-system-roles package installed on the system from which you want to\
    \ run the playbook.\n- You have an inventory file detailing the systems on which\
    \ you want to configure timesync.\n\n###Procedure\n\n- 1. Create a new playbook.yml\
    \ file with the following content:\n\n```yaml\n- hosts: timesync\nvars:\n  timesync_ntp_servers:\n\
    \    - hostname: pool.ntp.org\n      pool: yes\n      iburst: yes\nroles:\n  -\
    \ rhel-system-roles.timesync\n```\n- 2. Verify playbook syntax:\n\n```bash\n#\
    \ ansible-playbook --syntax-check playbook.yml\n```\n- 3. Run the playbook on\
    \ your inventory file:\n\n```bash\n# ansible-playbook -i inventory.file/path/to/file/playbook.yml\n\
    ```\n\n## 14.3. TIMESYNC SYSTEM ROLE VARIABLES\n\nYou can pass the variable to\
    \ the timesync role:\n\n- **timesync_ntp_servers:**\n\n| Role settings | Description\
    \ |\n|--- |--- |\n| hostname | Hostname or address of the server |\n| minpoll\
    \ | Minimum polling interval. Default: 6 |\n| maxpoll | Maximum polling interval.\
    \ Default: 10 |\n| iburst | Flag enabling fast synchronization. Default: no |\n\
    | pool | Flag indicating that each address is a separate server. Default: no |\n\
    \nAdditional resources\n\n- For a detailed reference on timesync variables, install\
    \ the rhel-system-roles package, and see the README.md or README.html files in\
    \ `/usr/share/doc/rhel-system-roles/timesync` directory.\n\n## CHAPTER 15. MONITORING\
    \ PERFORMANCE USING RHEL SYSTEM ROLES\n\nAs a system administrator, you can use\
    \ the metrics RHEL System Role with any Ansible Platform control to monitor the\
    \ performance of a system.\n\n## 15.1. INTRODUCTION TO THE METRICS SYSTEM ROLE\n\
    \nRHEL System Roles is a collection of Ansible roles and modules that provide\
    \ a consistent configuration interface to remotely manage multipleHEL systems.\
    \ The metrics System Role configures performance analysis services for the local\
    \ system and, optionally, includes a list of remote systems to be monitored by\
    \ the local system. The metrics System Role enables you to use pcp to monitor\
    \ your performance without having to configure pcp separately, as the setup and\
    \ deployment of pcp is handled by the playbook.\n\nTable 15. Metrics system role\
    \ variables\n\n| Role variable | Description | Example usage |\n|---|---|---|\n\
    | metrics_monitored_hosts | List of remote hosts to be analyzed by the target\
    \ host. These will have metrics recorded on the target host, so ensure enough\
    \ disk space exists below /var/log for each host. |_monitored_hosts: [\"webserver.example.com\"\
    ,\"database.example.com\"] |\n| metrics_retention_days | Configures the number\
    \ of days for performance data retention before deletion. | metrics_retention_days:\
    \ 14 |\n| metrics_graph_service | A boolean flag that enables the host to be set\
    \ up with services for performance data visualization via pcp and grafana. Set\
    \ to false by default. | metrics_graph_service: false |\n| metrics_query_service\
    \ | A boolean flag that enables the host to be set up with time series query services\
    \ recorded pcp via redis. Set to false by default. | metrics_query_service: false\
    \ |\n| metrics_provider | Specifies which metrics collector to use metrics. Currently,\
    \ pcp is the only supported metrics provider. | metrics_provider: \"pcp\" |\n\n\
    > NOTE\n> For details about the parameters used in metrics_connections and additional\
    \ information about the metrics System Role, see the /usr/share/ansible/roles/rhel-system-roles.metrics/README.md\
    \ file.\n"
