    \ can define multi-line configuration items using lists. For example:\n\n```yaml\n\
    LocalForward:\n- 22 localhost:2222\n- 403 localhost:4003\n```\n\nrenders as:\n\
    \n```text\nLocalForward 22 localhost:2222\nLocalForward 403 localhost:4003\n```\n\
    \n> NOTE\n> The configuration options are case sensitive.\n\n### Variables for\
    \ the SSH System Role\n\n#### ssh_user\n\nYou can define an existing user name\
    \ for which the system role modifies user-specific configuration. The user-specific\
    \ configuration is saved in ~/.ssh/config of the given user. The default value\
    \ is null, which modifies global configuration for all users.\n\n#### ssh_skip_defaults\n\
    \nDefaults to auto. If set to auto, the system role writes the system-wide configuration\
    \ file /etc/ssh/ssh_config and keeps RHEL defaults defined there. Creating a drop-in\
    \ configuration file, for example by defining the drop_in_name variable, automatically\
    \ disables the ssh_skip_defaults variable.\n\n#### ssh_drop_in_name\n\nDefines\
    \ the name for drop-in configuration file, which is placed in the system-wide\
    \ drop-in directory. The name is used in the template /etc/ssh/ssh_config/(drop_in_name).conf\
    \ to reference the configuration file to be modified. If the system does not support\
    \ drop-in directories, the default value is null. If the system supports drop-in\
    \ directories, the default value is 00-able.\n\n> WARNING\n> If the system does\
    \ not support drop-in directories, setting this option will make the play fail.\n\
    \nThe suggested format is NN-name, where NN is a two-digit number used for ordering\
    \ configuration files and name is any descriptive name for the owner of the file.\n\
    \n#### ssh\n\nA dict that contains configuration options and their respective\
    \ values.\n\n#### ssh_Option\n\nYou can define options by using simple variables\
    \ consisting of ssh_prefix and the option instead of a dict. Simple variables\
    \ override values in the ssh dict.\n\n#### ssh_additional_packages\n\nThis role\
    \ automatically installs the openssh-clients packages, which are needed for the\
    \ most common use cases. If you need to install additional packages, for example\
    \ openssh-keygen for host-based authentication, you can specify this in that variable.\
    \ The path to where the role saves the configuration file. Default value:\n\n\
    - If the system has a drop-in directory, the default value is defined by the template\
    \ /etc/ssh/ssh_config/{drop_in_name}.conf.\n- If the system does not have a drop-in,\
    \ the default value is /etc/ssh/ssh_config.\n- If the ssh_user variable is defined,\
    \ the default value is ~/.ssh/config.\n\n#### ssh_config_owner, ssh_config_group,\
    \ ssh_config_mode\n\nThe owner, group and mode of the created configuration file.\
    \ By default, the owner of the file is root, and the mode is 0644. If ssh_user\
    \ is defined, the mode is 0600, and the owner and group are defined by the ssh_user\
    \ variable.\n\n## 8.4. CONFIGURING OPENSSH CLIENTS USING THE SYSTEM ROLE\n\nYou\
    \ can use the SSH System Role to configure multiple clients by running an Ansible\
    \ playbook.\n\nPrerequisites\n\n- Access and permissions to managed nodes, which\
    \ you want to configure with the SSH System Role.\n- Access and permissions to\
    \ a control node, from which Ansible Engine configures other systems.\n\nOn the\
    \ control:\n\n- Ansible Engine is installed.\n- The rhel-system-roles package\
    \ is installed.\n- An inventory file which lists the managed nodes.\n\nProcedure\n\
    \n- 1. Create a new playbook.yml with the following content:\n\n```yaml\n---\n\
    hosts: all\ntasks:\n  name: \"Configure ssh clients\"\n    include_role:\n   \
    \   name: rhel-system-roles.ssh\n      vars:\n        ssh_user: root\n       \
    \ ssh:\n          Compression: true\n          GSSAPIAuthentication: no\n    \
    \      ControlMaster: auto\n```\n\n```yaml\nControlPath:~/.ssh/cm%C\nHost: example\n\
    Hostname: example.com\nUser: user1\nssh_Forward11: no\n```\n\nThis playbook configures\
    \ the root user's SSH client preferences on the managed nodes with the following\
    \ configurations:\n\n- Compression is enabled.\n- ControlMaster multiplexing is\
    \ set to auto.\n- The example alias for connecting to the example.com host is\
    \ user1.\n- The example host alias is created, which represents a connection to\
    \ the example.com host with the user1 name.\n- X11 forwarding is disabled.\n\n\
    Occasionally, you can modify these variables according to your preferences. For\
    \ more details, see SSH Client Role variables.\n\n- 2. Optional: Verify playbook\
    \ syntax.\n\n```bash\n# ansible-playbook --syntax-check path/custom-playbook.yml\n\
    ```\n\n- 3. Run the playbook on your inventory file:\n\n```bash\n# ansible-playbook\
    \ -i inventory_file path/custom-playbook.yml\n```\n\nVerification\n\n- Verify\
    \ that the managed node has the correct configuration by opening the SSH configuration\
    \ file in a text editor, for example:\n- vi ~root/.ssh/config\n\nAfter application\
    \ of the example playbook shown above, the configuration file should have the\
    \ following content:\n\n```text\n# Ansible managed\nCompression yes\nControlMaster\
    \ auto\nControlPath:~/.ssh/cm%C\nForwardX11 no\nGSSAPIAuthentication no\nHost\
    \ example\nHostname example.com\nUser user1\n```\n\n## CHAPTER 9. SETTING A CUSTOM\
    \ CRYPTOGRAPHIC POLICY ACROSS SYSTEMS\n\nAs an administrator, you can use the\
    \ Crypto Policies System Role on RHEL to quickly and consistently configure custom\
    \ cryptographic policies across many different systems using Red Hat Automation\
    \ Platform.\n\n## 9.1. CRYPTO POLICIES SYSTEM ROLE VARIABLES AND FACTS\n\nIn a\
    \ Crypto Policies System Role playbook, you can define the parameters for the\
    \ crypto policies configuration according to your preferences and limitations.\n\
    \nIf you do not configure any variables, the system role does not configure the\
    \ system and only reports the facts.\n\nSelected variables for the Crypto Policies\
    \ System Role\n\n**crypto_policies_policy**\nDetermines the cryptographic policy\
    \ level the system role applies to the managed nodes. For details about the different\
    \ crypto policy levels, see System-wide cryptographic policies.\n\n**crypto_policies_reload**\n\
    If yes, the affected services, currently the helpsec, bind, and ssh services,\
    \ reload after applying a crypto policy. Defaults to **yes**.\n\n**crypto_policies_reboot_ok**\n\
    If yes, and a reboot is necessary after the system role changes the crypto policy,\
    \ it sets **crypto_policies_reboot_required**. Defaults to **no**.\n\nFacts set\
    \ by the Crypto Policies System Role\n\n**crypto_policies_active**\nLists the\
    \ currently selected policy.\n\n**crypto_policies_available_policies**\nLists\
    \ all available policy levels available on the system.\n\n**crypto_policies_available_modules**\n\
    Lists all available subpolicy modules available on the system.\n\nAdditional resources\n\
    \n- Creating and setting a custom system-wide cryptographic policy\n\n## 9.2.\
    \ SETTING A CUSTOM CRYPTOGRAPHIC POLICY USING THE CRYPTO POLICIES SYSTEM ROLE\n\
    \nYou can use the Crypto Policies System Role to configure a large number of managed\
    \ nodes consistently from a single control node.\n"
