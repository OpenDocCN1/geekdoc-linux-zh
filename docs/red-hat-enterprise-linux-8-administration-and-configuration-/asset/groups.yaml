  - "[PAGE 64]\n\nAccess and permissions to one or more managed nodes, which are systems\
    \ you want to configure with the Crypto Policies System Role.\n\nAccess and permissions\
    \ to a control node, which is a system from which Red Hat Ansible Engine configures\
    \ other systems.\nOn the control node:\n\n+   - Red Hat Ansible Engine is installed\n\
    - The rhel-system-roles package is installed\n- An inventory file which lists\
    \ the managed nodes.\n\n# Procedure\n\n+   Create a new playbook.yml file with\
    \ the following content:\n\n```\n---\n- hosts: all\ntasks:\n  - name: Configure\
    \ crypto policies\n    include_role:\n    - name: linux-system-roles.crypto_policies\n\
    vars:\n  - crypto_policies_policy: FUTURE\n  - crypto_policies_reboot_ok: true\n\
    ```\n\nYou can replace the FUTURE value with your preferred crypto policy, for\
    \ example: DEFAULT, LEGACY, and FIPSOPSP.\n\nThe crypto_policies_reboot_ok: true\
    \ variable causes the system to reboot after the system changes the crypto policy.\n\
    \nFor more details, see Crypto Policies System Role variables and facts.\n\n+\
    \   Optional: Verify playbook syntax.\n\n```\n# ansible-playbook --syntax-check\
    \ playbook.yml\n```\n\n+   Run the playbook on your inventory file:\n\n```\n#\
    \ ansible-playbook -i inventory_file playbook.yml\n```\n\n# Verification\n\n+\
    \   On the control node, create another playbook named, for example, verify_playbook.yml.\n\
    \n```\n- hosts: all\ntasks:\n  - name: Verify active crypto policy\n    include_role:\n\
    \    - name: linux-system-roles.crypto_policies\ndebug:\n  - var: crypto_policies_active\n\
    ```"
