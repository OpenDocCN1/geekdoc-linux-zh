    \ 文件。\n\n## 12.3. 使用 RHEL 系统角色配置 KDUMP\n\n您可以通过运行 Ansible playbook，使用 kdump 系统角色在多个系统上设置基本的内核\
    \ dump 参数。\n\n> 警告\nkdump 角色将通过替换 /etc/kdump.conf 文件来完全替换托管主机的 kdump 配置。此外，如果应用了\
