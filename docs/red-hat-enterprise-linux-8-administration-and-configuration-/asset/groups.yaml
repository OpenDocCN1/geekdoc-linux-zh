    # CHAPTER 11. REQUESTING CERTIFICATES USING RHEL SYSTEM ROLES


    With the Certificate System Role, you can use Red Hat Ansible Engine to issue
    and manage certificates.


    This chapter covers the following topics:


    +   * The Certificate System Role

    * Requesting a new self-signed certificate using the Certificate System Role

    * Requesting a new self-signed certificate from IdM CA using the Certificate System
    Role


    # 11.1. THE CERTIFICATE SYSTEM ROLE


    Using the Certificate System Role, you can manage issuing and renewing TLS and
    SSL certificates using Red Hat Ansible Engine.


    The role uses certmonger as the certificate provider, and currently supports issuing
    and renewing self-signed certificates and using the IdM integrated certificate
    authority (CA).


    You can use the following variables in your Ansible playbook with the Certificate
    System Role:


    ```

    certificate_wait

    to specify if the task should wait for the certificate to be issued.

    certificate_requests

    to represent each certificate to be issued and its parameters.

    ```


    Additional resources


    +   * For details about the parameters used in the certificate_requests variable
    and additional information about the Certificate System Role, see the /usr/share/ansible/roles/rhel-system-roles/certificate/README.md
    file.

    * For details about RHEL System Roles and how to apply them, Getting started with
    RHEL System Roles.


    # 11.2. REQUESTING A NEW SELF-SIGNED CERTIFICATE USING THE CERTIFICATE SYSTEM
    ROLE


    With the Certificate System Role, you can use Red Hat Ansible Engine to issue
    self-signed certificates.


    This process uses the certmonger provider and requests the certificate through
    the getcert command.


    > NOTE

    By default, certmonger automatically tries to renew the certificate before it
    expires. You can disable this by setting the auto_renew parameter in the Ansible
    playbook no.'
