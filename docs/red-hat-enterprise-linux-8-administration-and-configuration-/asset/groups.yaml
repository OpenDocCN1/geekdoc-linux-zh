    # ha_cluster_extra_packages


    List of all packages to be installed. The default value of this variable is packages.
    This variable can be used to install additional packages not installed automatically
    by the role, for example custom resource agents.


    It is possible to specify fence agents as members of this list. However, ha_cluster_fence_agent_packages
    is the recommended variable to use for specifying fence agents, if this value
    is overridden.


    # ha_cluster_hacluster_password


    A string value that specifies the password of the hacluster user. The hacluster
    user has full access to a cluster. It is recommended that you vault encrypt the
    password, as described in Encrypting content with Ansible Vault. There is no default
    password value, and this variable must be specified.


    # ha_cluster_corosync_key_src


    The path to Corosync authkey file, which is the authentication and encryption
    key for Corosync communication. It is highly recommended that you use an authkey
    value for each cluster. The key should be 256 bytes of random data.


    If you specify a key for this variable, it is recommended that you encrypt the
    key, as described in Encrypting content with Ansible Vault


    If no key is specified, a key already present on the nodes will be used. If nodes
    do not have the same key, a key from one node will be distributed to other nodes
    so that all nodes have the same key. If no node has a key, a new key will be generated
    and distributed to the nodes.


    If this variable is set, ha_cluster_regenerate_keys is ignored for this key.


    The default value of this variable is null.


    # ha_cluster_pacemaker_key_src


    The path to the Pacemaker authkey file, which is highly recommended that you use
    a unique authkey value for each cluster. The key should be 256 bytes of random
    data.


    If you specify a key for this variable, it is recommended that you vault encrypt
    the key, as described in Encrypting content with Ansible Vault


    If no key is specified, a key already present on the nodes will be used. If nodes
    do not have the same key, a key from one node will be distributed to other nodes
    so that all nodes have the same key. If no node has a key, a new key will be generated
    and distributed to the nodes.


    If this variable is set, ha_cluster_regenerate_keys is ignored for this key.


    The default value of this variable is null.


