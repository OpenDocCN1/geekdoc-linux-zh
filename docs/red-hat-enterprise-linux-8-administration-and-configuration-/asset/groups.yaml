    \ default gateway - 2001:db8:1::fffe\n- An IPv4 DNS server - 198.51.100.200\n\
    - An IPv6 DNS server - 2001:db8:1::ffbb\n- A DNS search domain - example.com\n\
    - ethtool features:\n  - Generic receive offload (GRO): disabled\n  - Generic\
    \ segmentation offload (GSO): enabled\n  - TX stream control protocol (SCTP) segmentation:\
    \ disabled\n\nPrerequisites\n\n- The ansible and rhel-system-roles packages are\
    \ installed on the control node.\n- If you use a different user than root when\
    \ you run the playbook, this user has appropriate sudo permissions on the managed\
