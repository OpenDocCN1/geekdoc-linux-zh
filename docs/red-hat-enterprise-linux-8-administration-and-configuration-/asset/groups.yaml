    \n# 使用 RHEL 中的系统角色进行 Red Hat Enterprise Linux 8 管理和配置任务\n\n> > 警告\n日志解决方案仅适用于服务器或客户端系统\
    \ SELinux 策略中定义的端口，且默认的 SELinux 策略包含端口 601、514、6514、10514 和 20514。如需使用不同的端口，请在客户端和服务器系统上修改\
    \ SELinux 策略。目前尚不支持通过系统角色配置防火墙。\n\n- 2. 创建列出服务器和客户端的清单文件：\n    a. 创建一个新文件并在文本编辑器中打开它，例如：\n\
    \        ```\n        vi inventory.ini\n        ```\n    b. 将以下内容插入清单文件中：\n  \
    \      ```\n        [servers]\n        ansible ansible_host=host1.example.com\n\
    \        [clients]\n        client ansible_host=host2.example.com\n        ```\n\
    \n- 其中：\n* host1.example.com 是日志服务器。\n* host2.example.com 是日志客户端。\n\n- 3. 在您的清单上执行\
    \ playbook。\n    ```\n    ansible-playbook -i /path/to/file/inventory.ini /path/to/file/_logging-playbook.yml\n\
    \    ```\n\n- 其中：\n* inventory.ini 是清单文件。\n* logging-playbook.yml 是您创建的 playbook。\n\
    \n## 验证\n\n- 1. 在客户端和服务器系统上，测试 /etc/rsyslog.conf 文件的语法：\n    ```\n    # rsyslog\
    \ -N 1\n    rsyslog: version 8.911.0-6.el8, config validation run (level 1), master\
    \ config\n    /etc/rsyslog.conf\n    rsyslog: End of config validation run. Bye.\n\
    \    ```\n\n- 2. 验证客户端是否向服务器发送了消息：\n    a. 在客户端系统上，发送一条测试消息：\n    -\n\n# 第7章.\
    \ 使用日志系统\n\nb. 在服务器系统上，查看 /var/log/messages 日志，例如：\n\n```\n# cat /var/log/messages\n\
    Aug 5 13:48:31 host2.example.com root[6788]: test\n```\n\n其中 host2.example.com\
    \ 是客户端系统的主机名。注意，日志中包含了输入 logger 命令的用户名，在此例中为 root。\n\n## 额外资源\n\n- 开始使用 RHEL 系统角色\n\
    -  /usr/share/ansible/roles/rhel-system-roles.logging/README.html 中的 rhel-system-roles\
    \ 软件包\n- RHEL 系统角色\n\n# 7.6. 额外资源\n\n- 开始使用 RHEL 系统角色\n- 安装 rhel-system-roles\
    \ 软件包的文档，位于 /usr/share/ansible/roles/rhel-system-roles.logging/README.html。\n\
    - RHEL 系统角色。\n- ansible-playbook(1) 手帮助页。\n\n# 第8章. 使用 SSH 系统角色配置安全通信\n\n作为管理员，您可以使用\
    \ Red Hat Ansible Automation Platform，通过 SSHD 系统角色配置 SSH 服务器，并使用 SSH 系统角色在任意数量的\
    \ RHEL 系统上同时进行一致的配置 SSH 客户端。\n\n# 8.1. SSH 系统角色变量\n\n在 SSH 系统角色 playbook 中，您可以根据自己的偏好和限制定义\
    \ SSH 配置文件的参数。\n\n如果您不配置这些变量，系统角色将生成一个与 RHEL 默认值相匹配的 sshd_config 文件。\n\n在所有情况下，布尔值在\
    \ SSH 配置中会正确渲染为 yes 和 no。您可以使用列表定义多行配置项：\n\n- sshd_ListenAddress:\n  - 0.0.0.0\n\
    \n渲染为：\n- ListenAddress 0.0.0\n\n## SSH 系统角色的变量\n\n- sshd_enable:\n如果设置为 False，则该角色被完全禁用。默认为\
    \ True。\n\n- sshd_skip_defaults:\n如果设置为 True，系统角色不会应用默认值。相反，使用 sshd 字典指定完整的配置集。如果设置为\
    \ False，则不管理服务，这意味着它在启动时不会启用。在容器内或 AIX 上运行时默认为 True。\n\n- sshd_allow_reload:\n\
    如果设置为 False，sshd 在配置更改后不会重加载。这有助于故障排除。要应用更改的配置，请手动重加载 sshd。除 AIX 外，默认值与 sshd_manage_service\
    \ 相同，后者默认为 True。\n\n- sshd_install_service:\n如果设置为 True，该角色将安装 sshd 服务文件。除非您正在配置第二个实例并更改了\
    \ sshd_service 变量，否则默认为 False。该角色使用以下模板：\n- sshd_service_template (default: templates/sshd_service.j2)\n\
    - sshd_service_template_at (default: templates/sshd@service.j2)\n- sshd_service_template_socket\
    \ (default: templates/sshd.socket.j2)\n\n- sshd_service:\n此变量更改 sshd 服务名称，适用于配置第二个\
    \ sshd 服务实例。\n\n- sshd:\n包含配置的字典。例如：\n```\nsshd:\n  Compression: yes\n  ListenAddress:\
    \ 0.0.0\n```\n\n- sshd_Option:\n可以使用由 sshd 前缀和选项名称变量来定义选项，而不是字典。变量会覆盖 sshd 字典中的值。例如：\n\
    ```\nsshd_Compression: no\n```\n\n- sshd_match:\nmatch 部分的字典列表或字典。注意这些变量不会覆盖 sshd\
    \ 字典中的 match 块。所有源将反映在结果文件中。\n\n## SSHD 角色的辅助变量\n\n您可以使用这些变量覆盖每个支持平台的默认值。\n\n\
    - sshd_packages:\n您可以使用此变量覆盖默认的软件包列表。\n\n- sshd_config_owner, sshd_config_group\
    \ 和 sshd_config_mode:\n您可以设置此角色生成的 openssh 配置文件的所有者和权限。\n\n- sshd_config_file:\n\
    该角色设置 openssh 服务器配置的路径。\n\n- sshd_binary:\nopenssh 的 sshd 可执行文件路径。\n\n- sshd_service:\n\
    sshd 服务的名称。默认情况下，此变量包含目标平台使用的 sshd 服务名称。当角色使用 sshd_install_service 变量时，也可以用它设置自定义\
    \ sshd 服务名称。\n\n- sshd_verify_hostkeys:\n默认为 auto。设置为 auto 时，它会列出配置文件中存在的主主机并生成不存在的路径。此外，权限和文件设置为默认值。这在部署阶段使用该角色以确保服务可以启动。要禁用此检查，请将此变量设置为空列表\
    \ []。\n\n- sshd_hostkey_owner, sshd_hostkey_group, sshd_hostkey_mode:\n使用这些变量设置\
    \ sshd_verify_hostkeys 密钥的所有者和权限。\n\n- sshd_sysconfig:\n在基于 RHEL 的系统上，此变量配置 ssh\
    \ 服务的额外细节。如果设置为 true，它还会根据以下配置解析 /etc/sysconfig/sshd 文件。默认为 false。\n\n- sshd_sysconfig_override_crypto_policy:\n\
    在 RHEL 中，设置为 true 时，此变量将覆盖全局加密策略。默认为 false。\n\n- sshd_sysconfig_use_strong_rng:\n\
    在基于 RHEL 的系统上，此变量可以强制 sshd 根据作为参数提供的字节数重新种子随机数生成器。默认值为 0，禁用此功能。如果系统没有硬件随机数生成器，请勿开启此项。\n\
    \n# 8.2. 使用 SSH 系统角色配置 OpenSSH 服务器\n\n您可以通过运行 Ansible playbook 使用 SSHD 系统角色配置多个\
    \ SSH 服务器。\n\n## 前提条件\n\n- 访问一个或多个受管理节点的权限（即希望使用 SSHD 系统角色配置的系统）。\n- 访问控制节点的权限（即\
    \ Red Hat Ansible Engine 配置其他系统的系统）。\n\n在控制节点上：\n- 安装了 Red Hat Ansible Engine。\n\
    - 安装了 rhel-system-roles 软件包。\n- 一个列出受管理节点的清单文件。\n\n## 步骤\n\n- 1. 复制 SSHD 色的示例\
    \ playbook：\n```bash\n# cp /usr/share/doc/rhel-system-roles/sshd/example-root-login-playbook.yml\
    \ path/custom-playbook.yml\n```\n\n- 2. 使用文本编辑器打开复制的 playbook，例如：\n\n```bash\n\
    # vim path/custom-playbook.yml\n---\n- hosts: all\ntasks:\n  - name: 配置 sshd 以防止特定子网以外的\
    \ root 和密码登录\n```\n\n"
