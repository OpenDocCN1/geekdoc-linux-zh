  - "[PAGE 104]\n\n# CHAPTER 17. CONFIGURING A HIGH-AVAILABILITY CLUSTER USING SYSTEM\
    \ ROLES\n\nWith the ha_cluster system role, you can configure and manage a high-availability\
    \ cluster that uses a subscription Pacemaker high-availability cluster resource\
    \ manager.\n\n![](img/7076193df8761a1565038e17afc88b0b_104_0.png)\n\nNOTE\n\n\
    The High Availability Cluster (HA Cluster) role is available as a Technology Preview.\n\
    \nThe HA system role does not currently support constraints. Running the role\
    \ after constraints are configured manually will remove the constraints, as well\
    \ as any configuration not supported by the role.\n\n# 17.1. HA_CLUSTER SYSTEM\
    \ ROLE VARIABLES\n\nIn an ha_cluster system role playbook, you define the variables\
    \ for a high availability cluster according to the requirements of your cluster\
    \ deployment.\n\nThe variables you can set for an ha_cluster system role are as\
    \ follows.\n\nha_cluster_enable_repos\n\nA boolean flag that enables the repositories\
    \ containing the packages that are needed by the ha_cluster system role. When\
    \ this is set to, the default value of this variable, you must have a subscription\
    \ coverage for RHEL and RHEL High Availability Add-On on the systems that you\
    \ use as your cluster members or the system role will fail.\n\nha_cluster_cluster_present\n\
    \nA boolean flag, if set to yes, determines that HA will be configured on the\
    \ hosts according to the variables passed to the role. Any cluster configuration\
    \ not specified in the role and not supported by the role will be lost.\n\nIf\
    \ ha_cluster_cluster_present is set to tono, all HA cluster configuration will\
    \ be removed from the target hosts.\n\nThe default value of this is yes.\n\nThe\
    \ following example removes all cluster configuration on node1 and node2\n\n```\n\
    - hosts: node1 node2\nvars:\n  ha_cluster_cluster_present: no\n\nroles:\n  - rhel-system-roles.ha-cluster\n\
    ```\n\nha_cluster_start_on_boot\n\nA boolean flag that determines whether cluster\
    \ services will be configured to start on boot. The deafvult value of this variable\
    \ is yes.\n\nha_cluster_fence_agent_packages\n\nList of fence agent packages to\
    \ install. The default value of this variable is fence-agents-all, fence-virt."
