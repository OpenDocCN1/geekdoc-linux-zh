    # CHAPTER 15. MONITORING PERFORMANCE USING RHEL SYSTEM ROLES


    As a system administrator, you can use the metrics RHEL System Role with any Ansible
    Automation Platform control to monitor the performance of a system.


    # 15.1. INTRODUCTION TO THE METRICS SYSTEM ROLE


    RHEL System Roles is a collection of Ansible roles and modules that provide a
    consistent configuration interface to remotely manage multiple RHEL systems. The
    metrics System Role configures performance analysis services for the local system
    and, optionally, includes a list of remote systems to be monitored by the local
    system. The metrics System Role enables you to use pcp to monitor your performance
    without having to configure pcp separately, as the setup and deployment of pcp
    is handled by the playbook.


    Table 15. Metrics system role variables


    | Role variable | Description | Example usage |

    |---|---|---|n| metrics_monitored_hosts | List of remote hosts to be analyzed
    by the target host. These will have metrics recorded on the target host, so ensure
    enough disk space exists below /var/log for each host. | metrics_monitored_hosts:
    ["webserver.example.com","database.example.com"] |

    | metrics_retention_days | Configures the number of days for performance data
    retention before deletion. | metrics_retention_days: 14 |

    | metrics_graph_service | A boolean flag that enables the host to be set up with
    services for performance data visualization via pcp and grafana. Set to false
    by default. | metrics_graph_service: false |

    | metrics_query_service | A boolean flag that enables the host to be set up with
    time series query services recorded pcp via redis. Set to false by default. |
    metrics_query_service: false |

    | metrics_provider | Specifies which metrics collector to use metrics. Currently,
    pcp is the only supported metrics provider. | metrics_provider: "pcp"


    > NOTE

    For details about the parameters used in metrics_connections and additional information
    about the metrics System Role, see the /usr/share/ansible/roles/rhel-system-roles.metrics/README.md
    file.'
- md: "\n## 15.2. USING THE METRICS SYSTEM ROLE TO MONITOR YOUR LOCAL SYSTEM WITH\
    \ VISUALIZATION\n\nThis procedure describes how to use the metrics System Role\
    \ to monitor your local system while simultaneously provisioning data visualization\
    \ via grafana.\n\nPrerequisites\n\n- You have Red Hat Ansible Engine installed\
    \ on the machine you want to monitor.\n- You have the rhel-system-roles package\
    \ installed on the machine you want to monitor.\n\nProcedure\n\n- 1. Configure\
    \ localhost in the /etc/ansible/hosts Ansible inventory by adding the following\
    \ content to the inventory:\n\n```yaml\nlocalhost ansible_connection=local\n```\n\
    \n- 2. Create an Ansible playbook with the following content:\n\n```yaml\n---\n\
    - hosts: localhost\nvars:\n  metrics_graph_service: yes\nroles:\n  - rhel-system-roles.metrics\n\
    ```\n\n- 3. Run the Ansible playbook:\n\n```bash\n# ansible-playbook name_of_your_playbook.yml\n\
    ```\n\n> NOTE\n> Since the metrics_graph_service boolean is set to value=\"yes\"\
    , grafana is automatically installed and provisioned with pcp as a data source.\n\
    \n![](img/7076193df8761a1565038e17afc88b0b_93_0.png)\n\n- 4. To view visualization\
    \ of the metrics collected on your machine, access the grafana web interface as\
    \ described in Accessing the Grafana web UI\n\n## 15.3. USING THE METRICS SYSTEM\
    \ ROLE TO SET UP A FLEET OF INDIVIDUAL SYSTEMS TO MONITOR THEMSELVES\n\nThis procedure\
    \ describes how to use the metrics System Role to set up a fleet of machines to\
    \ monitor them.\n\nPrerequisites\n\n- You have Red Hat Ansible Engine installed\
    \ on the machine you want to use to run the playbook.\n- You have the rhel-system-roles\
    \ package installed on the machine you want to use to run the playbook.\n\nProcedure\n\
    \n- 1. Add the name or IP of the machines you wish to monitor via the playbook\
    \ to the /etc/ansible/hosts Ansible inventory file under an identifying group\
    \ name enclosed in brackets:\n\n```ini\n[remotes]\nwebserver.example.com\ndatabase.example.com\n\
    ```\n\n- 2. Create an Ansible playbook with the following content:\n\n```yaml\n\
    -\nhosts: remotes\nvars:\n  metrics_retention_days: 0\nroles:\n  - rhel-system-roles.metrics\n\
    ```\n\n- 3. Run the Ansible playbook:\n\n```bash\n# ansible-playbook name_of_your_playbook.yml\n\
    ```\n\n## 15.4. USING THE METRICS SYSTEM ROLE TO MONITOR A FLEET OF MACHINES CENTRALLY\
    \ VIA YOUR LOCAL MACHINE\n\nThis procedure describes how to use the metrics System\
    \ Role to set up your local machine to centrally monitor a fleet of machines while\
    \ also provisioning visualization of the data via grafana and querying of the\
    \ data via redis.\n\nPrerequisites\n\n- You have Red Hat Ansible Engine installed\
    \ on the machine you want to use to run the playbook.\n- You have the rhel-system-roles\
    \ package installed on the machine you want to use to run the playbook.\n\nProcedure\n\
    \n- 1. Create an Ansible playbook with the following content:\n\n```yaml\n-\n\
    hosts: localhost\nvars:\n  metrics_graph_service: yes\n  metrics_query_service:\
    \ yes\n  metrics_retention_days: 10\n  metrics_monitored_hosts: [\"database.example.com\"\
    , \"webserver.example.com\"]\nroles:\n  - rhel-system-roles.metrics\n```\n\n-\
    \ 2. Run the Ansible playbook:\n\n```bash\n# ansible-playbook name_of_your_playbook.yml\n\
