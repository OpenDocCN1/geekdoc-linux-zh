  - "[PAGE 46]\n\n# CHAPTER 7. USING THE LOGGING SYSTEM ROLE\n\nAs a system administrator,\
    \ you can use the Logging System Role to configure a RHEL host as a logging server\
    \ to collect logs from many client systems.\n\n# 7.1. THE LOGGING SYSTEM ROLE\n\
    \nWith the Logging System Role, you can deploy logging configurations on local\
    \ and remote hosts.\n\nTo apply a Logging System Role on one or more systems,\
    \ you define the logging configuration in a playbook. A playbook is a list of\
    \ one or more plays. Playbooks are human-readable, and they are written in the\
    \ YAML format. For more information about playbooks, see Working with playbooks\
    \ in Ansible documentation.\n\nThe set of systems you want Ansible to configure\
    \ according to the playbook is defined in an inventory file. For more information\
    \ on creating and updating inventories, see How to build your inventory in Ansible\
    \ documentation.\n\nLogging solutions provide multiple ways of reading logs and\
    \ multiple logging outputs.\n\nFor example, a logging system can receive the following\
    \ inputs:\n\n+   * local files,\n* systemd/journal\n* another logging system over\
    \ the network.\n\nIn addition, a logging system can have the following outputs:\n\
    \n+   * logs are stored in the local files in the /var/log directory,\n* logs\
    \ are sent to Elasticsearch,\n* logs are forwarded to another logging system.\n\
    \nWith the logging system role, you can combine the inputs and outputs to fit\
    \ your needs. For example, you can configure a logging solution that stores inputs\
    \ from journal in a local file, whereas inputs from files are both forwarded to\
    \ another logging system and stored in the local file.\n\n# 7.2. LOGGING SYSTEM\
    \ ROLE PARAMETERS\n\nIn a Logging System Role playbook, you define the inputs\
    \ in the logging_inputs parameter, outputs in the logging_outputs parameter, and\
    \ the relationships between the inputs and outputs in the logging_flows parameter.\
    \ The Logging System Role processes these variables with additional options to\
    \ configure the logging system. You can also enable encryption.\n\n> NOTE\nCurrently,\
    \ the only available logging system in the Logging System Role is Rsyslog.\n\n\
    +   * logging_inputs: List of inputs for the logging solution.\n  * name: Unique\
    \ name of the input. Used in the logging_flows: inputs list and a part of the\
    \ generated config file name."
- md: "\n- type: Type of the input element. The type specifies a task type which corresponds\
    \ to a directory name in files/rsyslog/tasks,vars/inputs/.\n- basics: Inputs configuring\
    \ inputs from systemd or unix socket.\n- kernel_message: Default imlog if set\
    \ to true. Default to false.\n- use_imusock: Use imsock instead of imjournal.\
    \ Default to false.\n- ratimiter_burst: Maximum number of messages that can be\
    \ emitted within ratimiter_interval. Default to 20000 if use_imusock is false.\
    \ Default to 200 if use_imusock is true.\n- ratimiter_interval: Interval to evaluate\
    \ ratimiter_burst. Default to 600 seconds if use_imusock is false. Default to\
    \ 0 if use_imusock is true. It indicates rate limiting is off.\n- persist_state_interval:\
    \ Journal state is persisted every value of persist_state_interval messages. Default\
    \ to 10. Effective only when use_imusock is false.\n- files: Inputs configuring\
    \ inputs from local files.\n- remote: Inputs configuring inputs from the other\
    \ logging system over network.\n- state: State of the configuration file. present\
    \ or absent. Default to present.\n- logging_outputs: List of outputs for the logging\
    \ solution.\n- files: Outputs configuring outputs to local files.\n- forwards:\
    \ Outputs configuring outputs to another logging system.\n- remote_files: Outputs\
    \ configuring outputs from another logging system to local files.\n- logging_flows:\
    \ List of flows that define relationships between logging_inputs and logging_outputs.\
    \ The logging_flows variable has the following keys:\n- name: Unique name of the\
    \ flow\n- inputs: List of logging_inputs name values\n- outputs: List of logging_outputs\
    \ name values.\n\nAdditional resources\n\n- Documentation installed with the rhel-system-roles\
    \ package in /usr/share/ansible/roles/rhel-system-roles.logging/README.html\n\n\
    ## 7.3. APPLYING A LOCAL LOGGING SYSTEM ROLE\n\nFollow these steps to prepare\
    \ and apply a Red Hat Ansible playbook to configure a logging solution on a set\
    \ of separate machines. Each machine will record logs locally.\n\nPrerequisites\n\
    \n- You have Red Hat Ansible Engine installed on the system from which you want\
    \ to run the playbook.\n\n# NOTE\n\nYou do not have to have Red Hat Ansible Engine\
    \ installed on the systems on which you want to deploy the logging solution.\n\
    \n- You have the rhel-system-roles package on the system from which you want to\
    \ run the playbook.\n\n# NOTE\n\nYou do not have to have rsyslog installed, because\
    \ the system role installs rsyslog when deployed.\n\n- You have an inventory file\
    \ listing the systems on which you want to configure the logging solution.\n\n\
    Procedure\n\n- 1. Create a playbook that defines the required role:\n    a. Create\
    \ a new YAML file and open it in a text editor, for example:\n\n```\n# vi logging-playbook.yml\n\
    ```\n\n    b. Insert the following content:\n\n```\n---\n- name: Deploying basics\
    \ input and implicit files output\nhosts: all\nroles:\n  - linux-system-roles.logging\n\
    vars:\n  logging_inputs:\n    - name: system_input\n      type: basics\n  logging_outputs:\n\
    \    - name: files_output\n      type: files\n  logging_flows:\n    - name: flow1\n\
    \      inputs: [system_input]\n      outputs: [files_output]\n```\n\n- 2. Execute\
    \ a playbook on a specific inventory:\n\n```\n# ansible-playbook -i inventory-file\
    \ /path/to/file/logging-playbook.yml\n```\n\nWhere: **inventory-file** is the\
    \ inventory file. **logging-playbook.yml** is the playbook you use.\n\nVerification\n\
    \n- 1. Test the syntax of the /etc/rsyslog.conf file:\n\n```\n# rsyslog -N 1\n\
    syslog: version 8.911.0-6.el8, config validation run (level 1), master config\n\
    /etc/rsyslog.conf\nsyslog: End of config validation run. Bye.\n```\n\n- 1. Verify\
    \ that the system sends messages to the log:\n\n    a. Send a test message:\n\n\
    ```\n# logger test\n```\n\n    b. View the /var/log/messages log, for example:\n\
    \n```\n# cat /var/log/messages\nAug 5 13:48:31 hostname root[6778]: test\n```\n\
    \nWhere 'hostname' is the host name of the client system. Note that the log contains\
    \ the user name of the user who entered the logger command, in this case root.\n\
    \n## 7.4. FILTERING LOGS IN A LOCAL LOGGING SYSTEM ROLE\n\nYou can deploy a logging\
    \ solution which filters the logs based on the rsyslog property-based filter.\n\
    \nPrerequisites\n\n- Access and permissions to one or more managed nodes, which\
    \ are systems you want to configure with the Logging System Role.\n- Access and\
    \ permissions to a control node, which is a system from which Red Hat Ansible\
    \ Engine configures other systems.\n\nOn the control node:\n\n- Red Hat Ansible\
    \ Engine is installed\n- The rhel-system-roles package is installed\n- An inventory\
    \ file which lists the managed nodes.\n\nProcedure\n\n- 1. Create a new playbook.yml\
    \ file with the following content:\n\n```\n- name: Deploying files input and configured\
    \ files output\nhosts: all\nroles:\n  - linux-system-roles.logging\nvars:\n  logging_inputs:\n\
    \    - name: files_input0\n      type: files\n      input_log_path: /var/log/containerA*/.log\n\
    \    - name: files_input1\n      type: files\n      input_log_path: /var/log/containerB/*.log\n\
    logging_outputs:\n  - name: files_output0\n    type: files\n    property: msg\n\
    \    property_op: contains\n    property_value: error\n    path: /var/log/errors.log\n\
    \  - name: files_output1\n    type: files\n    property: msg\n    property_op:\
    \ \"contains\"\n    property_value: error\n    path: /var/log/others.log\nlogging_flows:\n\
    \  - name: flow0\n    inputs: [files_input0, files_input1]\n    outputs: [files_output0,\
    \ files_output1]\n```\n\nUsing this configuration, all messages that contain the\
    \ error string are logged in /var/log/errors.log, and other messages are logged\
    \ in /var/log/others.log.\n\nYou can replace the error value with the string which\
    \ you want to filter.\n\nYou can modify the variables according to your preferences.\n\
    \n- 1. Optional: Verify playbook syntax.\n   # ansible-playbook --check playbook.yml\n\
    \n- 2. Run the playbook on inventory:\n   # ansible-playbook -i inventory-file\
    \ playbook.yml\n\n# Verification\n\n- 1. Test the syntax of the /etc/rsyslog.conf\
    \ file:\n\n```\n# rsyslog -N 1\nsyslog: version 8.911.0-6.el8, config validation\
    \ run (level 1), master config\n/etc/rsyslog.conf\nsyslog: End of config validation\
    \ run. Bye.\n```\n\n- 2. Verify that the system sends messages that contain the\
    \ error string to the log:\n    a. Send a test message:\n    # logger error\n\n\
    \    b. View the /var/log/errors.log log, for example:\n```\n# cat /var/log/errors.log\n\
    Aug 5 13:48:31 hostname[6778]: error\n```\n\nWhere hostname is the host name of\
    \ the client system. Note that the log contains the user name of the user who\
    \ entered the logger command, in this case root.\n\nRed Hat Enterprise Linux 8\
    \ Administration and configuration tasks using System Roles\n"
  mdcn: "\n\n- type: 输入元素的类型。该类型指定一个任务类型，该类型对应 files/rsyslog/tasks,vars/inputs/ 目录下的目录名。\n\
    - basics: 配置来自 systemd 或 unix socket 的输入。\n- kernel_message: 如果设置为 true，则使用默认的\
    \ imlog。默认为 false。\n- use_imusock: 使用 imsock 代替 imjournal。默认为 false。\n- ratimiter_burst:\
    \ 在 ratimiter_interval 间隔内可以发送的最大消息数。如果 use_imusock 为 false，默认为 20000。如果 use_imusock\
    \ 为 true，则默认为 200。\n- ratimiter_interval: 评估 ratimiter_burst 的间隔。如果 use_imusock\
    \ 为 false，默认为 600 秒。如果 use_imusock 为 true，则默认为 0。这表示速率限制已关闭。\n- persist_state_interval:\
    \ 每隔 persist_state_interval 数量的消息，就会持久化一次 Journal 状态。默认为 10。仅在 use_imusock 为 false\
    \ 时有效。\n- files: 配置来自本地文件的输入。\n- remote: 配置来自网络上其他日志系统的输入。\n- state: 配置文件的状态。存在（present）或不存在（absent）。默认位\
    \ present。\n- logging_outputs: 日志解决方案的输出列表。\n- files: 配置到本地文件的输出。\n- forwards:\
    \ 配置转发到另一个日志系统的输出。\n- remote_files: 配置从另一个日志系统到本地文件的输出。\n- logging_flows: 定义日志输入和日志输出之间关系的流列表。logging_flows\
    \ 变量具有以下键值：\n- name: 流的唯一名称\n- inputs: logging_inputs 名称值的列表\n- outputs: logging_outputs\
    \ 名称值的列表。\n\n额外资源\n\n- 伴随 rhel-system-roles 软件包安装的文档位于：/usr/share/ansible/roles/rhel-system-roles.logging/README.html\n\
    \n## 7.3. 应用本地日志系统角色\n\n按照以下步骤准备并应用 Red Hat Ansible playbook，以在多台独立的机器上配置日志解决方案。每台机器都将在本地记录日志。\n\
    \n先决条件\n\n- 你在想要运行 playbook 的系统上安装了 Red Hat Ansible Engine。\n\n# 注意\n\n你并不需要在想要部署日志解决方案的系统上安装\
    \ Red Hat Ansible Engine。\n\n- 你在运行 playbook 的系统上安装了 rhel-system-roles 软件包。\n\n\
    # 注意\n\n你不需要安装 rsyslog，因为系统角色在部署时会安装 rsyslog。\n\n- 你有一个列出要配置日志系统的系统的文件。\n\n步骤\n\
    \n- 1. 创建一个定义所需角色的 playbook：\n    a. 创建一个新的 YAML 文件并用文本编辑器打开它，例如：\n\n```\n# vi\
    \ logging-playbook.yml\n```\n\n    b. 插入以下内容：\n\n```\n---\n- name: Deploying basics\
    \ input and implicit files output\nhosts: all\nroles:\n  - linux-system-roles.logging\n\
    vars:\n  logging_inputs:\n    - name: system_input\n      type: basics\n  logging_outputs:\n\
    \    - name: files_output\n      type: files\n  logging_flows:\n    - name: flow1\n\
    \      inputs: [system_input]\n      outputs: [files_output]\n```\n\n- 2. 在特定的清单上执行\
    \ playbook：\n\n```\n# ansible-playbook -i inventory-file /path/to/file/logging-playbook.yml\n\
    ```\n\n其中：**inventory-file** 是清单文件。**logging-playbook.yml** 是你使用的 playbook。\n\n\
    验证\n\n- 1. 测试 /etc/rsyslog.conf 文件的语法：\n\n```\n# rsyslog -N 1\nsyslog: version\
    \ 8.911.0-6.el8, config validation run (level 1), master config\n/etc/rsyslog.conf\n\
    syslog: End of config validation run. Bye.\n```\n\n- 1. 验证系统是否向日志发送了消息：\n\n  \
    \  a. 发送测试消息：\n\n```\n# logger test\n```\n\n    b. 查看 /var/log/messages 日志，例如：\n\
    \n```\n# cat /var/log/messages\nAug 5 13:48:31 hostname root[6778]: test\n```\n\
    \n其中 'hostname' 是客户端系统的主机名。注意日志包含了输入 logger 命令的用户名，在此例中为 root。\n\n## 7.4. 在本地日志系统角色中过滤日志\n\
    \n你可以部署一个基于 rsyslog 属性过滤器的日志过滤解决方案。\n\n先决条件\n\n- 拥有一个或多个受管理节点的访问权限，这些系统是你想要用日志系统角色配置的系统。\n\
    - 拥有控制节点的访问权限，该节点是你通过 Red Hat Ansible Engine 配置其他系统的系统。\n\n在控制节点上：\n\n- 已安装 Red\
    \ Hat Ansible Engine\n- 已安装 rhel-system-roles 软件包\n- 有一个列出受管理节点的清单文件。\n\n步骤\n\n\
    - 1. 创建一个包含以下内容的 playbook.yml 文件：\n\n```\n- name: Deploying files input and configured\
    \ files output\nhosts: all\nroles:\n  - linux-system-roles.logging\nvars:\n  logging_inputs:\n\
    \    - name: files_input0\n      type: files\n      input_log_path: /var/log/containerA*/.log\n\
    \    - name: files_input1\n      type: files\n      input_log_path: /var/log/containerB/*.log\n\
    logging_outputs:\n  - name: files_output0\n    type: files\n    property: msg\n\
    \    property_op: contains\n    property_value: error\n    path: /var/log/errors.log\n\
    \  - name: files_output1\n    type: files\n    property: msg\n    property_op:\
    \ \"contains\"\n    property_value: error\n    path: /var/log/others.log\nlogging_flows:\n\
    \  - name: flow0\n    inputs: [files_input0, files_input1]\n    outputs: [files_output0,\
    \ files_output1]\n```\n\n使用此配置，所有包含 error 字符串的消息都会记录在 /var/log/errors.log，其他消息记录在\
    \ /var/log/others.log。\n\n你可以根据过滤过滤字符串替换 error 值。\n\n你可以根据喜好修改变量。\n\n- 1. 可选：验证\
    \ playbook 语法。\n   # ansible-playbook --check playbook.yml\n\n- 2. 在清单上运行 playbook：\n\
    \   # ansible-playbook -i inventory-file playbook.yml\n\n# 验证\n\n- 1. 测试 /etc/rsyslog.conf\
