    \ 100\n203.0.113.0/24 via 198.51.100.22 dev enp7s0 proto metric 100\n```\n\n#\
    \ 5.9. USING SYSTEM ROLES TO SET ETHOOL FEATURES\n\nYou can use the networking\
    \ RHEL System Role to configure ethtool features of a Network connection.\n\n\
