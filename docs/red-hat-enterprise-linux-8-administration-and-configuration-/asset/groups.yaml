    \ file.\n\n## 12.3. CONFIGURING KDUMP USING RHEL SYSTEM ROLES\n\nYou can set basic\
    \ kernel dump parameters on multiple systems using the kdump System Role by running\
    \ an Ansible playbook.\n\n> WARNING\nThe kdump role replaces the kdump configuration\
    \ of the managed hosts entirely by replacing the /etc/kdump.conf file. Additionally,\
    \ if the kdump role is applied, all previous kdump settings are also replaced,\
    \ even they are not specified by the role variables, by replacing the /etc/sysconfig/kdump\
    \ file.\n\n# Red Hat Enterprise Linux 8 Administration and configuration tasks\
    \ using System Roles in RHEL\n\n# Prerequisites\n\n- You have Red Hat Ansible\
    \ Engine installed on the system from which you want to run the playbook.\n\n\
