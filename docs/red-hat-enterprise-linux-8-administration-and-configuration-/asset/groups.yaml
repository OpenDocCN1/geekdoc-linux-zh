- md: "\n## CHAPTER 17. CONFIGURING A HIGH-AVAILABILITY CLUSTER USING SYSTEM ROLES\n\
    \n- **operations** (optional) - List of the resource's operations.\n- **action**\
    \ (mandatory) - Operation action as defined by pacemaker the resource or stonith\
    \ agent.\n- **attrs** (mandatory) - Operation options, at least one option must\
    \ be specified.\n\nThe structure of the resource definition that you configure\
    \ with the **ha_cluster** system role is as follows:\n\n```yaml\n- id: resource-id\n\
    \  agent: resource-agent\n  instance_attrs:\n    - attrs:\n        - name: attribute1_name\n\
    \          value: attribute1_value\n        - name: attribute2_name\n        \
    \  value: attribute2_value\n  meta_attrs:\n    - attrs:\n        - name: meta_attribute1_name\n\
    \          value: meta_attribute1_value\n        - name: meta_attribute2_name\n\
    \          value: meta_attribute2_value\n  operations:\n    - action: operation1-action\n\
    \      attrs:\n        - name: operation1_attribute1_name\n          value: operation1_attribute1_value\n\
    \        - name: operation1_attribute2_name\n          value: operation1_attribute2_value\n\
    \    - action: operation2-action\n      attrs:\n        - name: operation2_attribute1_name\n\
    \          value: operation2_attribute1_value\n        - name: operation2_attribute2_name\n\
    \          value: operation2_attribute2_value\n```\n\nBy default, resources are\
    \ defined.\n\nFor an example **ha_cluster** system role playbook that includes\
    \ resource configuration, see [Configuring a high availability cluster with fencing\
    \ and resources](https://example.com)\n\n## ha_cluster_resource_groups\n\nThis\
    \ variable defines pacemaker resource groups configured by the system role. The\
    \ items you can configure for each resource group are as follows:\n\n- **id**\
    \ (mandatory) - ID of a group.\n- **resources** (mandatory) - List of the group's\
    \ resources. Each resource is referenced by its ID and the resources must be defined\
    \ in the **ha_cluster_primitives** variable. At least one resource must be listed.\n\
    - **meta_attrs** (optional) - List of sets of the group's meta attributes. Currently,\
    \ only one set is supported.\n\nThe structure of the resource group definition\
    \ that you configure with the ha_cluster system role is as follows:\n\n```yaml\n\
    ha_cluster_resource_groups:\n  - id: group-id\n    resource_ids:\n      - resource1-id\n\
    \      - resource2-id\n    meta_attrs:\n      - attrs:\n          - name: group_meta_attribute1_name\n\
    \            value: group_meta_attribute1_name\n          - name: group_meta_attribute2_name\n\
    \          value: group_meta_attribute2_name\n```\n\nBy default, no resource groups\
    \ are defined.\n\nFor an example ha_cluster system role playbook that includes\
    \ resource group configuration, see Configuring a high availability cluster with\
    \ fencing and resources.\n\n## ha_cluster_resource_clones\n\nThis variable defines\
    \ peacemaker clones configured by the system role. The items you can configure\
    \ for a clone are as follows:\n\n- **resource_id** (mandatory) - Resource to be\
    \ cloned. The resource must be defined in the ha_cluster_resource_primitives variable\
    \ or the ha_cluster_resource_groups variable.\n- **promotable** (optional) - indicates\
