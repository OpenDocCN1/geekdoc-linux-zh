    # CHAPTER 16. CONFIGURING A SYSTEM FOR SESSION RECORDING USING THE TLOG RHEL SYSTEM
    ROLES


    With the tlog RHEL System Role, you can configure a system for terminal session
    recording on RHEL using Red Hat Ansible Automation Platform.


    # 16.1. THE TLOG SYSTEM ROLE


    You can configure a RHEL system for terminal session recording on RHEL using the
    tlog RHEL System Role. The tlog package and its associated web console session
    player provide you with the ability to record and play back terminal sessions.


    You can configure the record to take place per user or user group via the SSSD
    service. All terminal input and output is captured and stored in a text-based
    format in the system journal.


    Additional resources


    +   - For more details on session recording in RHEL, see Recording Sessions


    # 16.2. COMPONENTS AND PARAMETERS OF THE TLOG SYSTEM ROLES


    The Session Recording solution is composed of the following components:


    +   - The tlog utility

    - System Security Services Daemon (SSSD)

    - Optional: The web console interface


    The parameters used for the tlog RHEL System Role are:


    | Role Variable | Description |

    |---|---|

    | tlog_use_sssd (default: yes) | Configure session recording with SSSD, the preferred
    way of managing recorded users or groups |

    | tlog_scope_sssd (default: none) | Configure SSSD recording scope - all / some
    / none |

    | tlog_users_sssd (default: []) | YAML list of users to be recorded |

    | tlog_groups_sssd (default: []) | YAML list of groups to be recorded |


    +   - For details about the parameters used in tlog and additional information
    about the tlog System Role, see the /usr/share/ansible/roles/rhel-system-roles.tlog.README.md
    file.


    # 16.3. DEPLOYING THE TLOG RHEL SYSTEM ROLE


    Follow these steps to prepare and apply an Ansible playbook to configure a RHEL
    system to log recording data to the systemd journal.'
- md: "\n## Prerequisites\n\n- You have set SSH keys for access from the control node\
    \ to the target system where the tlog System Role will be configured.\n- You have\
    \ one control node, which is a system from which the Ansible Engine configures\
    \ the other systems.\n- You have Red Hat Ansible Engine installed on the control\
    \ node, from which you want to run the playbook.\n- You have the rhel-system-roles\
    \ package installed on the control node from which you want to run the playbook.\n\
    - You have at least one system that you want to configure the tlog System Role.\
    \ You do not have to have Red Hat Automation Platform installed on the systems\
    \ on which you want to deploy the tlog solution.\n\n## Procedure\n\n1. Create\
    \ a new playbook.yml file with the following content:\n\n```yaml\n- name: Deployment\
    \ session recording\n  hosts: all\n  vars:\n    tlog_scope_sssd: some\n    tlog_users_sssd:\n\
    \      - recordeduser\n  roles:\n    - rhel-system-roles.tlog\n```\n\nWhere,\n\
    \n- tlog_scope_sssd:\n  - some specifies you want to record only certain users\
    \ and groups, not all or none.\n- tlog_users_sssd:\n  - recordeduser specifies\
    \ the user you want to record a session from. Note that this does not add the\
    \ user for you. You must set the user by yourself.\n\n2. Optionally, verify the\
    \ playbook syntax.\n\n```bash\n# ansible-playbook --syntax-check playbook.yml\n\
    ```\n\n3. Run the playbook on your inventory file:\n\n```bash\n# ansible-playbook\
    \ -i IP_Address /path/to/file/playbook.yml -v\n```\n\nAs a result, the playbook\
    \ installs the tlog role that can be used by the users and groups that you define.\
    \ SSSD parses and reads these users and groups to overlay tlog session as the\
    \ shell user. Additionally, if the cockpit package is installed on the system,\
    \ the playbook also installs the cockpit-session-recording package, which is a\
    \ Cockpit module that allows you to view and play recordings in the web console\
    \ interface.\n\n## Verification steps\n\nTo verify the SSSD configuration drop\
    \ file is created in the system, perform the following steps:\n\n1. Navigate to\
    \ the folder where the SSSD configuration drop file is created:\n\n```bash\n#\
    \ cd /etc/sssd/conf.d\n```\n\n2. Check the file content:\n\n```bash\n# cat /etc/sssd/conf.d/sssd-session-recording.conf\n\
    ```\n\nYou can see that the file contains the parameters you set in the playbook.\n\
    \n## 16.4. DEPLOYING THE TLOG REG SYSTEM ROLE FOR EXCLUDING LISTS OF GROUPS OR\
    \ USERS\n\nYou can use the tlog System Role on RHEL to support the SSSD session\
    \ recording configuration exclude_users and exclude_groups. Follow these steps\
    \ to prepare and apply an Ansible playbook to configure a RHEL system to exclude\
    \ users or groups from having their sessions recorded and logged in the systemd\
    \ journal.\n\n## Prerequisites\n\n- You set SSH keys for access from the control\
    \ node to the target system on which you want to configure the tlog System Role.\n\
    - You have one control node, which is a system from which the Red Hat Ansible\
    \ Engine configures the other systems.\n- You have Red Hat Ansible Engine installed\
    \ on the control node, from which you want to run the playbook.\n- You have the\
    \ rhel-system-roles package installed on the control node.\n- You have at least\
    \ one system on which you want to configure the tlog System Role. You do not have\
    \ to Red Hat Automation Platform installed on the systems on which you want to\
    \ deploy the tlog solution.\n\n## Procedure\n\n1. Create a new playbook.yml file\
    \ with the following content:\n\n```yaml\n- name: Deploy session recording excluding\
    \ users and groups\n  hosts: all\n  vars:\n    tlog_scope_sssd: all\n    tlog_exclude_users_sssd:\n\
    \      - jeff\n      - james\n    tlog_exclude_groups_sssd:\n      - admins\n\
    \  roles:\n    - rhel-system-roles.tlog\n```\n\nWhere,\n\n- tlog_scope_sssd:\n\
    \  - all: specifies that you want to record all users and groups.\n- tlog_exclude_users_sssd:\n\
    \  - usernames: specifies the user name of the users you want to exclude from\
    \ the session recording.\n- tlog_exclude_groups_sssd:\n  - admins specifies the\
    \ group you want to exclude from the session recording.\n\n2. Optionally, verify\
    \ the playbook syntax;\n\n```bash\n# ansible-playbook --syntax-check playbook.yml\n\
    ```\n\n3. Run the playbook on your inventory file:\n\n```bash\n# ansible-playbook\
    \ -i IP_Address /path/to/file/playbook.yml -v\n```\n\nAs a result, the playbook\
    \ installs the tlog package on the system you specified. It also creates /etc/sssd/conf.d/sssd-session-recording.conf\
    \ SSSD configuration drop file that can be used by users and groups except those\
    \ that you defined as excluded. SSSD parses and reads these users and groups overlap\
    \ tlog as the shell user. Additionally, if the cockpit package is installed on\
    \ the system, the playbook also installs the cockpit-session-recording package,\
    \ which is a cockpit module that allows you to view and play recordings in the\
    \ web console interface.\n\n![](img/7076193df8761a1565038e17afc88b0b_101_0.png)\n\
    \n> NOTE\nYou are not able to record a session for users listed in the exclude_users\
    \ list or if they are a of a group in the exclude_groups list.\n\n## Verification\
    \ steps\n\nTo verify that the SSSD configuration drop file is created in the system,\
    \ perform the following steps:\n\n1. Navigate to the folder where the SSSD configuration\
    \ drop file is created:\n\n```bash\n# cd /etc/sssd/conf.d\n```\n\n2. Check the\
    \ file content:\n\n```bash\n# cat sssd-session-recording.conf\n```\n\n## CHAPTER\
    \ 16. CONFIGURING A SYSTEM FOR SESSION RECORDING USING THE TLOG RHEL SYSTEM RULES\n\
    \nYou can see that the file contains the parameters you set in the playbook.\n\
    \nAdditional resources\n\n- The /usr/share/doc/rhel-system-roles/tlog/ and /usr/share/ansible/roles/rhel-system-roles.tlog/\
    \ directories.\n- The Recording session using the deployed tlog system role in\
    \ the CLI\n\n## 16.5. RECORDING A SESSION USING THE DEPLOYED TLOG SYSTEM ROLE\
    \ IN THE CLI\n\nOnce you have deployed the tlog System Role in the system, you\
    \ are able to record a user session using the command-line interface (CLI).\n\n\
    Prerequisites\n\n- You have deployed the tlog System Role in the target system.\n\
    - The SSSD configuration drop file was created in /etc/sssd/conf.d.\n\nProcedure\n\
    \n1. Create a user and assign a password for this:\n\n```bash\n# useradd recordeduser\n\
    # passwd recordeduser\n```\n\n2. Relog to the system as the user you created:\n\
    \n```bash\n# ssh recordeduser@localhost\n```\n\n3. Type \"yes\" when the system\
    \ alerts you to authenticate.\n\n> ATTENTION! Your session is being recorded!\n\
    \n4. Once you have finished recording the session, type:\n\n```bash\n# exit\n\
    ```\n\nAs a result, the user session is recorded, stored and you can play it using\
    \ a journal.\n\nVerification steps\n\nTo view your recorded session in the journal,\
    \ do the following steps:\n\n1. Run the command below:\n\n```bash\n# journalctl\
    \ -o verbose -r\n```\n\n2. Search for the MESSAGE field of tlog recorded journal\
    \ entry.\n\n```bash\n# journalctl -xl EXE=/usr/bin/tlog-rec-session\n```\n\n##\
    \ 16.6. WATCHING A RECORDED SESSION USING THE CLI\n\nYou can play a user session\
    \ recording from a journal using the command-line interface (CLI).\n\nPrerequisites\n\
    \n- You have recorded a user session. Recording a session using the deployed tlog\
    \ system role in the CLI.\n\nProcedure\n\n1. On the CLI terminal, play the user\
    \ session recording:\n\n```bash\n# journalctl -o verbose -r\n```\n\n2. Search\
    \ for the tlog recording:\n\n```bash\n$ tlog-rec\n```\n\nYou can see details such\
    \ as:\n\n- The username for the user session recording\n- The out_txt field, a\
    \ raw output encode of the recorded session\n- The identifier number TLOG_REC=ID_number\n\
    \n3. Copy the identifier number TLOG_REC=ID_number.\n\n4. Playback the recording\
    \ using the identifier number TLOG_REC=ID_number.\n\n```bash\n# tlog-play -r journal\
    \ -M TLOG_REC=ID_number\n```\n"
  mdcn: "\n\n## 前提条件\n\n- 您已设置了 SSH 密钥，以便从控制节点访问目标系统，该系统将用于配置 tlog 系统角色（System Role）。\n\
    - 您有一个控制节点，该系统是 Ansible Engine 配置其他系统的来源。\n- 您在控制节点上安装了 Red Hat Ansible Engine，并希望从该节点运行\
    \ playbook。\n- 您在想要运行 playbook 的控制节点上安装了 `rhel-system-roles` 软件包。\n- 您至少有一个想要配置\
    \ tlog 系统角色的系统。您不需要在部署 tlog 解决方案的系统上安装 Red Hat Automation Platform。\n\n## 步骤\n\
    \n1. 创建一个新的新的 `playbook.yml` 文件，内容如下：\n\n```yaml\n- name: Deployment session recording\n\
    \  hosts: all\n  vars:\n    tlog_scope_sssd: some\n    tlog_users_sssd:\n    \
    \  - recordeduser\n  roles:\n    - rhel-system-roles.tlog\n```\n\n其中，\n\n- tlog_scope_sssd:\n\
    \  - `some`：指定您只想记录某些用户和组，而不是全部或一个都不记录。\n- tlog_users_sssd:\n  - `recordeduser`：指定您想要记录其会话的用户。注意，这不会为您添加该用户。您必须手动设置该用户。\n\
    \n2. 可选：验证 playbook 的语法。\n\n```bash\n# ansible-playbook --syntax-check playbook.yml\n\
    ```\n\n3. 在您的清单文件（inventory file）上运行 playbook：\n\n```bash\n# ansible-playbook\
    \ -i IP_Address /path/to/file/playbook.yml -v\n```\n\n结果是， playbook 安装了 tlog 角色，该角色供您定义的用户和组使用。SSSD\
    \ 解析并读取这些用户和组，以便以 shell 用户身份叠加 tlog 会话。此外，如果系统上安装了 `cockpit` 软件包，playbook 还会安装\
    \ `cockpit-session-recording` 软件包，这是一个 Cockpit 模块，允许您在 Web 控制台界面查看和播放录制。\n\n##\
    \ 验证步骤\n\n要验证系统中是否创建了 SSSD 配置落地文件（drop file），请执行以下步骤：\n\n1. 导航到创建 SSSD 配置落地文件的文件夹：\n\
    \n```bash\n# cd /etc/sssd/conf.d\n```\n\n2. 检查文件内容：\n\n```bash\n# cat /etc/sssd/conf.d/sssd-session-recording.conf\n\
    ```\n\n您可以看到该文件包含了您在 playbook 中设置的参数。\n\n## 16.4. 部署 TLOG REG 系统角色以排除组或用户列表\n\n\
    您可以在 RHEL 上使用 `tlog` 系统角色，来支持 SSSD 会话记录配置中的 `exclude_users` 和 `exclude_groups`。按照以下步骤准备并应用\
    \ Ansible playbook，以配置 RHEL 系统，排除某些用户或组的会话在 systemd journal 中的记录和日志记录。\n\n## 前提条件\n\
    \n- 您已设置了 SSH 密钥，以便从控制节点访问想要配置 tlog 系统角色的目标系统。\n- 您有一个控制节点，该系统是 Red Hat Ansible\
    \ Engine 配置其他系统的来源。\n- 您在控制节点上安装了 Red Hat Ansible Engine，并希望从该节点运行 playbook。\n\
    - 您在控制节点上安装了 `rhel-system-roles` 软件包。\n- 您至少有一个想要配置 tlog 系统角色的系统。您不需要在部署 tlog\
    \ 解决方案的系统上安装 Red Hat Automation Platform。\n\n## 步骤\n\n1. 创建一个新的 `playbook.yml`\
    \ 文件，内容如下：\n\n```yaml\n- name: Deploy session recording excluding users and groups\n\
    \  hosts: all\n  vars:\n    tlog_scope_sssd: all\n    tlog_exclude_users_sssd:\n\
    \      - jeff\n      - james\n    tlog_exclude_groups_sssd:\n      - admins\n\
    \  roles:\n    - rhel-system-roles.tlog\n```\n\n其中，\n\n- tlog_scope_sssd:\n  -\
    \ `all`：指定您想记录所有用户和组。\n- tlog_exclude_users_sssd:\n  - `usernames`：指定您想要从会话记录中排除的用户名。\n\
    - tlog_exclude_groups_sssd:\n  - `admins`：指定您想要从会话记录中排除的组。\n\n2. 可选：验证 playbook\
    \ 的语法；\n\n```bash\n# ansible-playbook --syntax-check playbook.yml\n```\n\n3. 在您的清单文件上运行\
    \ playbook：\n\n```bash\n# ansible-playbook -i IP_Address /path/to/file/playbook.yml\
    \ -v\n```\n\n结果是， playbook 在您指定的系统上安装了 `tlog` 软件包。它还会创建 `/etc/sssd/conf.d/sssd-session-recording.conf`\
    \ SSSD 配置落地文件，该文件可供除定义为排除之外的用户和组使用。SSSD 解析并读取这些用户和组，以 shell 用户身份叠加 tlog。此外，如果系统上安装了\
    \ `cockpit` 软件包，playbook 还会安装 `cockpit-session-recording` 软件包，这是一个 Cockpit 模块，允许您在\
    \ Web 控制台界面查看和播放录制。\n\n![](img/7076193df8761a1565038e17afc88b0b_101_0.png)\n\n\
    > 注意\n您无法对列在 `exclude_users` 列表的用户或属于 `exclude_groups` 列表中组的用户记录会话。\n\n## 验证步骤\n\
    \n要验证系统中是否创建了 SSSD 配置落地文件，请执行以下步骤：\n\n1. 导航到创建 SSSD 配置落地文件的文件夹：\n\n```bash\n#\
    \ cd /etc/sssd/conf.d\n```\n\n2. 检查文件内容：\n\n```bash\n# cat sssd-session-recording.conf\n\
    ```\n\n## 第 16 章. 使用 TLOG RHEL 系统规则配置会话记录的系统\n\n您可以看到该文件包含了您在 playbook 中设置的参数。\n\
    \n其他资源\n\n- `/usr/share/doc/rhel-system-roles/tlog/` 和 `/usr/share/ansible/roles/rhel-system-roles/tlog/`\
    \ 目录。\n- 使用部署的 tlog 系统角色进行记录\n\n## 16.5. 使用部署的 tlog 系统角色记录会话\n\n一旦在系统上部署了 `tlog`\
    \ 系统角色，您就可以使用命令行界面（CLI）记录会话。\n\n前提条件\n\n- 您已在目标系统上部署了 `tlog` 系统角色。\n- SSSD 配置落地文件已创建在\
    \ `/etc/sssd/conf.d`。\n\n步骤\n\n1. 创建一个用户并为其分配密码：\n\n```bash\n# useradd recordeduser\n\
    # passwd recordeduser\n```\n\n2. 以创建的用户身份登录系统：\n\n```bash\n# ssh recordeduser@localhost\n\
    ```\n\n3. 当系统提示身份验证时输入 \"yes\"。\n\n> 注意！您的会话正在被记录！\n\n4. 完成会话记录后，输入：\n\n```bash\n\
    # exit\n```\n\n结果是，用户会话已被记录并存储，您可以使用 journal 查看。\n\n验证步骤\n\n要在 journal 中查看您的记录会话，请执行以下步骤：\n\
    \n1. 运行以下命令：\n\n```bash\n# journalctl -o verbose -r\n```\n\n2. 搜索 tlog 记录日志条目的\
    \ `MESSAGE` 字段。\n\n```bash\n# journalctl -xl EXE=/usr/bin/tlog-rec-session\n```\n\
    \n## 16.6. 使用 CLI 查看记录会话\n\n您可以使用命令行界面（CLI）从 journal 中播放用户会话记录。\n\n前提条件\n\n- 您已记录了会话。\n\
    \n步骤\n\n1. 在 CLI 终端上播放用户会话记录：\n\n```bash\n# journalctl -o verbose -r\n```\n\n\
    2. 搜索 tlog 记录：\n\n```bash\n$ tlog-rec\n```\n\n您可以看到如下详细信息：\n\n字体 会话记录的用户名\n- `out_txt`\
    \ 字段，录制会话的原始输出编码\n- 标识符 `TLOG_REC=ID_number`\n\n3. 复制标识符 `TLOG_REC=ID_number`。\n\
    \n4. 使用标识符 `TLOG_REC=ID_number` 播放录制：\n\n```bash\n# tlog-play -r journal -M TLOG_REC=ID_number\n\
    ```\n\n"
