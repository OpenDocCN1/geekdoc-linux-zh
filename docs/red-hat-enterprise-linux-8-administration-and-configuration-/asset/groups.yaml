    \n  - include_role:\n    name: linux-system-roles.network\n    vars:\n      network_connections:\n\
    \        name: enp1s0\n        type: ethernet\n        autoconnect: yes\n    \
    \    ip:\n          address:\n            - 192.0.2.1/24\n            - 2001:db8::1/64\n\
    \          gateway4: 192.0.2.254\n          gateway6: 2001:db8::1::fffe\n    \
    \      dns:\n            - 192.0.2.200\n            - 2001:db8::1::ffbb\n    \
    \      dns_search:\n            - example.com\n      802.1x:\n        identity:\
    \ user_name\n        eap: tls\n        private_key: \"/etc/pki/tls/private/client.key\"\
    \n        private_password: \"password\"\n        client_cert: \"/etc/pki/tls/certs/client.crt\"\
    \n        ca_cert: \"/etc/pki/ca-trust/anchors/ca.crt\"\n        domain_suffix:\
    \ example.com\n        state: up\n```\n\n3. 运行 playbook：\n\n- 要以 root 用户身份连接到托管主机，输入：\n\
    \  - ansible-playbook -u root ~/enable-802.1x.yml\n- 要以用户身份连接到托管主机，输入：\n  - ansible-playbook\
    \ -u user_name --ask-become-pass ~/ethernet-static.yml\n\n--ask-become-pass 选项确保\
