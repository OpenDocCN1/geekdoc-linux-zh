    # 6.2. USING THE SELINUX SYSTEM ROLE TO APPLY SELINUX SETTINGS ON MULTIPLE SYSTEMS


    Follow the steps to prepare and apply an Ansible playbook with your verified SELinux
    settings.


    Prerequisites


    +   - Your Red Hat Ansible Engine subscription is attached to the system. See
    the How I download and install Red Hat Ansible Engine article for more information.


    Procedure


    +   - Enable the RHEL Ansible repository, for example:


    ```

    # ansible-manager repos --enable ansible-2-rhel-8-x86_64-rpm

    ```


    +   - Install Ansible Engine:


    ```

    # yum install ansible

    ```


    +   - Install RHEL system roles:


    ```

    # yum install rhel-system-roles

    ```


    +   - Prepare your playbook. You can either start from the scratch or modify the
    example playbook as part of the rhel-system-roles package:


    ```

    # cp /usr/share/doc/rhel-system-roles/selinux/example-selinux-playbook.yml my-selinux-playbook.yml

    # vi my-selinux-playbook.yml

    ```


    +   - Change the content of the playbook to fit your scenario. For example, the
    following part ensures that the system installs and enables the selinux-local-1.pp
    SELinux module:


    ```

    selinux_modules:

    { path: "selinux-local-1.pp", priority: "400" }

    ```


    +   - Save the changes, and exit the editor.


    +   - Run your playbook on the host1, host2, and host3 systems:


