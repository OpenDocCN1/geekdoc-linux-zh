    Roles in RHEL


    ```

    # journalctl -o verbose -r

    ```


    2. Search for the MESSAGE field of thelog-rec recorded journal entry.


    ```

    # journalctl -xl EXE=/usr/bin/tlog-rec-session

    ```


    # 16.6. WATCHING A RECORDED SESSION USING THE CLI


    You can play a user session recording from a journal using the command-line interface
    (CLI).


    Prerequisites


    +   * You have recorded a user session. Recording a session using the deployed
    tlog system role in the CLI.


    Procedure


    +   1. On the CLI terminal, play the user session recording:


    ```

    # journalctl -o verbose -r

    ```


    +   2. Search for the tlog recording:


    ```

    $ tlog-rec

    ```


    You can see details such as:


    +   * The username for the user session recording

    * The out_txt field, a raw output encode of the recorded session

    * The identifier number TLOG_REC=ID_number


    +   3. Copy the identifier number TLOG_REC=ID_number.


    +   4. Playback the recording using the identifier number TLOG_REC=ID_number.


    ```

    # tlog-play -r journal -M TLOG_REC=ID_number

    ```


    As a result, you can see the user session recording terminal output being played
    back.'
- md: "\n# CHAPTER 17. CONFIGURING A HIGH-AVAILABILITY CLUSTER USING SYSTEM ROLES\n\
    \nWith the ha_cluster system role, you can configure and manage a high-availability\
    \ cluster that uses a subscription Pacemaker high-availability cluster resource\
    \ manager.\n\n![](img/7076193df8761a1565038e17afc88b0b_104_0.png)\n\nNOTE\n\n\
    The High Availability Cluster (HA Cluster) role is available as a Technology Preview.\n\
    \nThe HA system role does not currently support constraints. Running the role\
    \ after constraints are configured manually will remove the constraints, as well\
    \ as any configuration not supported by the role.\n\n## 17.1. HA_CLUSTER SYSTEM\
    \ ROLE VARIABLES\n\nIn an ha_cluster system role playbook, you define the variables\
    \ for a high availability cluster according to the requirements of your cluster\
    \ deployment.\n\nThe variables you can set for an ha_cluster system role are as\
    \ follows.\n\n**ha_cluster_enable_repos**\n\nA boolean flag that enables the repositories\
    \ containing the packages that are needed by the ha_cluster system role. When\
    \ this is set to, the default value of this variable, you must have a subscription\
    \ coverage for RHEL and RHEL High Availability Add-On on the systems that you\
    \ use as your cluster members or the system role will fail.\n\n**ha_cluster_cluster_present**\n\
    \nA boolean flag, if set to yes, determines that HA will be configured on the\
    \ hosts according to the variables passed to the role. Any cluster configuration\
    \ not specified in the role and not supported by the role will be lost.\n\nIf\
    \ ha_cluster_cluster_present is set to no, all HA cluster configuration will be\
    \ removed from the target hosts.\n\nThe default value of this is yes.\n\nThe following\
    \ example removes all cluster configuration on node1 and node2\n\n```yaml\n- hosts:\
    \ node1 node2\nvars:\n  ha_cluster_cluster_present: no\n\nroles:\n  - rhel-system-roles.ha-cluster\n\
    ```\n\n**ha_cluster_start_on_boot**\n\nA boolean flag that determines whether\
    \ cluster services will be configured to start on boot. The default value of this\
    \ variable is yes.\n\n**ha_cluster_fence_agent_packages**\n\nList of fence agent\
    \ packages to install. The default value of this variable is fence-agents-all,\
    \ fence-virt.\n\n**ha_cluster_extra_packages**\n\nList of all packages to be installed.\
    \ The default value of this variable is packages. This variable can be used to\
    \ install additional packages not installed automatically by the role, for example\
    \ custom resource agents.\n\nIt is possible to specify fence agents as members\
    \ of this list. However, ha_cluster_fence_agent_packages is the recommended variable\
    \ to use for specifying fence agents, if this value is overridden.\n\n**ha_cluster_hacluster_password**\n\
    \nA string value that specifies the password of the hacluster user. The hacluster\
    \ user has full access to a cluster. It is recommended that you vault encrypt\
    \ the password, as described in Encrypting content with Ansible Vault. There is\
    \ no default password value, and this variable must be specified.\n\n**ha_cluster_corosync_key_src**\n\
    \nThe path to Corosync authkey file, which is the authentication and encryption\
    \ key for Corosync communication. It is highly recommended that you use an authkey\
    \ value for each cluster. The key should be 256 bytes of random data.\n\nIf you\
    \ specify a key for this variable, it is recommended that you encrypt the key,\
    \ as described in Encrypting content with Ansible Vault.\n\nIf no key is specified,\
    \ a key already present on the nodes will be used. If nodes do not have the same\
    \ key, a key from one node will be distributed to other nodes so that all nodes\
    \ have the same key. If no node has a key, a new key will be generated and distributed\
    \ to the nodes.\n\nIf this variable is set, ha_cluster_regenerate_keys is ignored\
    \ for this key.\n\nThe default value of this variable is null.\n\n**ha_cluster_pacemaker_key_src**\n\
    \nThe path to the Pacemaker authkey file, which is highly recommended that you\
    \ use a unique authkey value for each cluster. The key should be 256 bytes of\
    \ random data.\n\nIf you specify a key for this variable, it is recommended that\
    \ you vault encrypt the key, as described in Encrypting content with Ansible Vault.\n\
    \nIf no key is specified, a key already present on the nodes will be used. If\
    \ nodes do not have the same key, a key from one node will be distributed to other\
    \ nodes so that all nodes have the same key. If no node has a key, a new key will\
    \ be generated and distributed to the nodes.\n\nIf this variable is set, ha_cluster_regenerate_keys\
    \ is ignored for this key.\n\nThe default value of this variable is null.\n\n\
    **ha_cluster_fence_virtvm_key_src**\n\nThe path to the fence-virtvm or fence-fencing\
    \ pre-shared key file, which is the location of the authentication key for the\
    \ fence-virtvm or fence-fencing agent cluster.\n\nIf you specify a key for this\
    \ variable, it is recommended that you vault encrypt the key, as described in\
    \ Encrypting content with Ansible Vault.\n\nIf no key is specified, a key already\
    \ present on the nodes will be used. If nodes do not have the same key, a key\
    \ from one node will be distributed to other nodes so that all nodes have the\
    \ same key. If no node has a key, a new key will be generated and distributed\
    \ to the nodes. If the ha_cluster system role generates a new key in this fashion,\
    \ you copy the key to your nodes' hypervisor to ensure fencing works.\n\nIf this\
    \ variable is set, ha_cluster_regenerate_keys is ignored for this key.\n\n**ha_cluster_pcosync_key_src**\n\
    \nThe path to the fence-virtvm or fence-fencing pre-shared key file, which is\
    \ the location of the authentication key for the fence-virtvm or fence-fencing\
    \ agent cluster.\n\nIf you specify a key for this variable, it is recommended\
    \ that you vault encrypt the key, as described in Encrypting content with Ansible\
    \ Vault.\n\nIf no key is specified, a key already present on the nodes will be\
    \ used. If nodes do not have the same key, a key from one node will be distributed\
    \ to other nodes so that all nodes have the same key. If no node has a key, a\
    \ new key will be generated and distributed to the nodes. If the ha_cluster system\
    \ role generates a new key in this fashion, you copy the key to your nodes' hypervisor\
    \ to ensure fencing works.\n\nIf this variable is set, ha_cluster_regenerate_keys\
    \ is ignored for this key.\n\n**ha_cluster_regenerate_keys**\n\nA boolean flag,\
    \ if set to yes, determines that HA will be configured on the hosts according\
    \ to the variables passed to the role. Any cluster configuration not specified\
    \ in the role and not supported by the role will be lost.\n\nIf ha_cluster_cluster_present\
    \ is set to no, all HA cluster configuration will be removed from the target hosts.\n\
    \nThe default value of this is yes.\n\n**ha_cluster_cluster_name**\n\nThe name\
    \ of the cluster. This is a string value with a default of my-cluster.\n\n**ha_cluster_cluster_properties**\n\
    \nList of sets of cluster properties for Pacemaker cluster-wide. Only one set\
    \ of cluster is supported. The structure of a set of cluster properties is as\
    \ follows:\n\n```yaml\nha_cluster_cluster_properties:\n  attrs:\n    - name: property1_name\n\
    \      value: property1_value\n    - name: property2_name\n      value: property2_value\n\
    ```\n\nBy default, no properties are set. The following example configures a cluster\
    \ consisting of node1 and node2 and sets the stonith-enabled and no-quorum-policy.\n\
    \n```yaml\n- hosts: node1 node2\nvars:\n  ha_cluster_cluster_name: my-cluster\n\
    \  ha_cluster_hacluster_password: password\n  ha_cluster_cluster_properties:\n\
    \    attrs:\n      - name: stonith-enabled\n        value: 'true'\n      - name:\
    \ no-quorum-policy\n        value: stop\n\nroles:\n  - rhel-system-roles.ha-cluster\n\
    ```\n\n**ha_cluster_resource_primitives**\n\nThis variable defines pacemaker resources\
    \ configured by the system role, including stonith resources. The items you can\
    \ configure for each resource are as follows:\n\n- id (mandatory) - ID of a resource.\n\
    - agent (mandatory) - Name of a resource or stonith agent, for example ocf:pacemaker:Dummy\
    \ or stonith:fence_crm. It is mandatory to stonith for stonith agents. For resource\
    \ agents, it is possible to use a short name, such as Dummy, instead of ocf:pacemaker:Dummy.\
    \ However, if several agents with the same name are installed, the will will be\
    \ unable to decide which agent should be used. Therefore, it is recommended that\
    \ you use full names when specifying a resource agent.\n- instance_attrs (optional)\
    \ - List of sets of the resource’s instance attributes. Currently, only one is\
    \ supported. The exact names and values of attributes, as well whether they are\
    \ mandatory or not, depend on the resource or stonith agent.\n- meta_attrs (optional)\
    \ - List of sets of the resource’s meta attributes. Currently, only one is supported.\n"
  mdcn: "\n\n# 第 17 章：使用系统角色配置高可用集群\n\n通过 `ha_cluster` 系统角色，你可以配置和管理一个使用订阅制 Pacemaker\
    \ 高可用集群资源管理器的高可用集群。\n\n![](img/7076193df8761a1565038e17afc88b0b_104_0.png)\n\n\
    注意\n\n高可用集群（HA Cluster）角色目前以技术预览（Technology Preview）的形式提供。\n\nHA 系统角色目前不支持约束条件（constraints）。在手动配置约束条件后运行该角色将移除这些约束条件以及任何不受该角色支持的配置。\n\
    \n## 17.1. HA_CLUSTER 系统角色变量\n\n在 `ha_cluster` 系统角色剧本（playbook）中，你根据集群部署的需求定义高可用集群的变量。\n\
    \n你可以为 `ha_cluster` 系统角色设置的变量如下：\n\n**ha_cluster_enable_repos**\n\n一个布尔标志位，用于启用包含\
    \ `ha_cluster` 系统角色所需的软件包的存储库。当其设置为 `yes`（该变量的默认值）时，你必须对用作集群成员的系统拥有 RHEL 和 RHEL\
    \ High Availability Add-On 的订阅支持，否则系统角色将失败。\n\n**ha_cluster_cluster_present**\n\
    \n一个布尔标志位，如果设置为 `yes`，则将根据传递给角色的变量在主机上配置 HA。任何未在角色中指定且不受角色支持的集群配置将丢失。\n\n如果 `ha_cluster_cluster_present`\
    \ 设置为 `no`，则将从目标主机移除所有 HA 集群配置。\n\n该变量的默认值为 `yes`。\n\n以下示例移除了 node1 和 node2 上的所有集群配置：\n\
    \n```yaml\n- hosts: node1 node2\nvars:\n  ha_cluster_cluster_present: no\n\nroles:\n\
    \  - rhel-system-roles.ha-cluster\n```\n\n**ha_cluster_start_on_boot**\n\n一个布尔标志位，决定是否将集群服务配置为启动时启动。该变量的默认值为\
    \ `yes`。\n\n**ha_cluster_fence_agent_packages**\n\n要安装的隔离代理（fence agent）软件包列表。该变量的默认值为\
    \ `fence-agents-all, fence-virt`。\n\n**ha_cluster_extra_packages**\n\n要安装的所有软件包列表。该变量的默认值为\
    \ `packages`。此变量可用于安装角色未自动安装的额外软件包，例如自定义资源代理。\n\n可以将隔离代理作为此列表的成员指定。但是，如果覆盖了此值，`ha_cluster_fence_agent_packages`\
    \ 是推荐用于指定隔离代理变量。\n\n**ha_cluster_hacluster_password**\n\n一个字符串值，用于指定 `hacluster`\
    \ 用户的密码。`hacluster` 用户对集群具有完全访问权限。建议按照“使用 Ansible Vault 加密内容”中的描述对密码进行 vault 加密。该变量没有默认密码值，且必须指定。\n\
    \n**ha_cluster_corosync_key_src**\n\nCorosync 认证密钥（authkey）文件的路径，它是 Corosync 通信的身份验证和加密密钥。强烈建议为每个集群使用唯一的密钥值。密钥应为\
    \ 256 字节的随机数据。\n\n如果你为此变量指定了密钥，建议按照“使用 Ansible Vault 加密内容”中的描述对密钥进行 vault 加密。\n\
    \n如果没有指定密钥，将使用节点上已存在的密钥。如果节点上的密钥不同，则会将一个节点的密钥分发到其他节点，以确保所有节点拥有相同的密钥。如果节点没有任何密钥，则将生成新密钥并分发到节点。\n\
    \n如果设置了此变量，则忽略该密钥的 `ha_cluster_regenerate_keys`。\n\n该变量的默认值为 `null`。\n\n**ha_cluster_pacemaker_key_src**\n\
    \nPacemaker 认证密钥文件的路径，强烈建议为每个集群使用唯一的密钥值。密钥应为 256 字节的随机数据。\n\n如果你为此变量指定了密钥，建议按照“使用\
    \ Ansible Vault 加密内容”中的描述对密钥进行 vault 加密。\n\n如果没有指定密钥，将使用节点上已存在的密钥。如果节点上的密钥不同，则会将一个节点的密钥分发到其他节点，以确保所有节点拥有相同的密钥。如果节点没有任何密钥，则将生成新密钥并分发到节点。\n\
    \n如果设置了此变量，则忽略该密钥的 `ha_cluster_regenerate_keys`。\n\n该变量的默认值为 `null`。\n\n**ha_cluster_fence_virtvm_key_src**\n\
    \nfence-virtvm 或 fence-fencing 预共享密钥文件的路径，它是 fence-virtvm 或 fence-fencing 隔离代理集群的认证密钥位置。\n\
    \n如果你为此变量指定了密钥，建议按照“使用 Ansible Vault 加密内容”中的描述对密钥进行 vault 加密。\n\n如果没有指定密钥，将使用节点上已存在的密钥。如果节点上的密钥不同，则会将一个节点的密钥分发到其他节点，以确保所有节点拥有相同的密钥。如果节点没有任何密钥，将生成新密钥并分发到节点。如果\
    \ `ha_cluster` 系统角色以这种方式生成了新密钥，你需要将密钥复制到节点的虚拟化程序以确保隔离功能正常。\n\n如果设置了此变量，则忽略该密钥的\
    \ `ha_cluster_regenerate_keys`。\n\n**ha_cluster_pcosync_key_src**\n\nfence-virtvm\
    \ 或 fence-fencing 预共享密钥文件的路径，它是 fence-virtvm 或 fence-fencing 隔离代理集群的认证密钥位置。\n\n\
    如果你为此变量指定了密钥，建议按照“使用 Ansible Vault 加密内容”中的描述对密钥进行 vault 加密。\n\n如果没有指定密钥，将使用节点上已存在的密钥。如果节点上的密钥不同，则会将一个节点的密钥分发到其他节点，以确保所有节点拥有相同的密钥。如果节点没有任何密钥，将生成新密钥并分发到节点。如果\
    \ `ha_cluster` 系统角色以这种方式生成了新密钥，你需要将密钥复制到节点的虚拟化程序以确保隔离功能正常。\n\n如果设置了此变量，则忽略该密钥的\
    \ `ha_cluster_regenerate_keys`。\n\n**ha_cluster_regenerate_keys**\n\n一个布尔标志位，如果设置为\
    \ `yes`，则根据传递给角色的变量在主机上配置 HA。任何未在角色中指定且不受角色支持的集群配置将丢失。\n\n如果 `ha_cluster_cluster_present`\
    \ 设置为 `no`，将从目标主机移除所有 HA 集群配置。\n\n该变量的默认值为 `yes`。\n\n**ha_cluster_cluster_name**\n\
    \n集群名称。这是一个字符串，默认值为 `my-cluster`。\n\n**ha_cluster_cluster_properties**\n\nPacemaker\
    \ 全局属性列表。仅支持一组集群属性。集群属性集的结构如下：\n\n```yaml\nha_cluster_cluster_properties:\n  attrs:\n\
    \    - name: property1_name\n      value: property1_value\n    - name: property2_name\n\
    \      value: property2_value\n```\n\n默认情况下未设置属性。以下示例配置了一个由 node1 和 node2 组成的集群，并设置了\
    \ `stonith-enabled` 和 `no-quorum-policy`。\n\n```yaml\n- hosts: node1 node2\nvars:\n\
    \  ha_cluster_cluster_name: my-cluster\n  ha_cluster_hacluster_password: password\n\
    \  ha_cluster_cluster_properties:\n    attrs:\n      - name: stonith-enabled\n\
    \        value: 'true'\n      - name: no-quorum-policy\n        value: stop\n\n\
    roles:\n  - rhel-system-roles.ha-cluster\n```\n\n**ha_cluster_resource_primitives**\n\
    \n此变量定义了系统角色配置的 Pacemaker 资源，包括隔离资源。每个资源可以配置的项目如下：\n\n- id（强制）：资源的 ID。\n- agent（强制）：资源或隔离代理的名称，例如\
    \ `ocf:pacemaker:Dummy` 或 `stonith:fence_crm`。对于隔离代理必须指定 `stonith`。对于资源代理，可以使用短名称（如\
    \ `Dummy`）代替 `ocf:pacemaker:Dummy`。但是，如果安装了多个同名的代理，系统将无法决定使用哪个代理。因此，建议在指定资源代理时使用全名。\n\
    - instance_attrs（可选）：资源实例属性列表。目前仅支持一组。属性的准确名称、值以及是否为强制性取决于具体的资源或隔离代理。\n- meta_attrs（可选）：资源元属性列表。目前仅支持一组。\n\
    \n"
