    \ with ethtool features\n  hosts: node.example.com\n  become: true\n  tasks:\n\
    \    - include_role:\n        name: linux-system-roles.network\n    vars:\n  \
    \    network_connections:\n        - name: enp7s0\n          type: ethernet\n\
