    \ localhost：\n\n```yaml\nlocalhost ansible_connection=local\n```\n\n- 2. 创建包含以下内容的\
    \ Ansible 剧本（playbook）：\n\n```yaml\n---\n- hosts: localhost\nvars:\n  metrics_graph_service:\
    \ yes\nroles:\n  - rhel-system-roles.metrics\n```\n\n- 3. 运行 Ansible 剧本：\n\n```bash\n\
    # ansible-playbook name_of_your_playbook.yml\n```\n\n> 注意\n> 由于 metrics_graph_service\
    \ 布值设置为 \"yes\"，grafana 会自动安装并配置 pcp 作为数据源进行配置。\n\n![](img/7076193df8761a1565038e17afc88b0b_93_0.png)\n\
    \n- 4. 要查看机器上收集的指标的可视化结果，请按照“访问 Grafana web UI”所述的方法访问 grafana 界面。\n\n## 15.3.\
    \ 使用指标系统角色设置一组独立系统进行监控\n\n本过程描述了如何使用指标系统角色设置一组机器以便其进行监控。\n\n前提条件\n\n- 您在用于运行剧本的机器上安装了\
    \ Red Hat Ansible Engine。\n- 您在用于运行剧本的机器上安装了 rhel-system-roles 软件包。\n\n步骤\n\n\
    - 1. 通过剧本将您想要监控的机器的名称或 IP 添加到 /etc/ansible/hosts Ansible 清单文件中，并置于方括号括的标识组名下：\n\
    \n```ini\n[remotes]\nwebserver.example.com\ndatabase.example.com\n```\n\n- 2.\
    \ 创建包含以下内容的 Ansible 剧本：\n\n```yaml\n-\nhosts: remotes\nvars:\n  metrics_retention_days:\
    \ 0\nroles:\n  - rhel-system-roles.metrics\n```\n\n- 3. 运行 Ansible 剧本：\n\n```bash\n\
    # ansible-playbook name_of_your_playbook.yml\n```\n\n## 15.4. 通过本地机器使用指标系统角色集中监控机器机器\n\
    \n本过程描述了如何使用指标系统角色设置您的本地机器，以集中监控一组机器，同时通过 grafana 提供数据可视化并通过 redis 进行数据查询。\n\n\
    前提条件\n\n- 您在用于运行剧本的机器上安装了 Red Hat Ansible Engine。\n- 您在用于运行剧本的机器上安装了 rhel-system-roles\
    \ 软件包。\n\n步骤\n\n- 1. 创建包含以下内容的 Ansible 剧本：\n\n```yaml\n-\nhosts: localhost\nvars:\n\
    \  metrics_graph_service: yes\n  metrics_query_service: yes\n  metrics_retention_days:\
    \ 10\n  metrics_monitored_hosts: [\"database.example.com\", \"webserver.example.com\"\
    ]\nroles:\n  - rhel-system-roles.metrics\n```\n\n- 2. 运行 Ansible 剧本：\n\n```bash\n\
    # ansible-playbook name_of_your_playbook.yml\n```\n\n> 注意\n> 由于 metrics_graph_service\
    \ 和 metrics_query_service 布值设置为 \"yes\"，grafana 会自动安装并配置 pcp 作为数据源，且 pcp 数据在 redis\
    \ 中索引，允许使用 pcp 查询语言对数据进行复杂查询。\n\n- 3. 要查看由您的机器集中收集的指标的可视化表示，请按照“访问 Grafana web\
    \ UI”所述的方法访问该界面。\n\n## 15.5. 在监控系统时使用指标系统角色设置身份验证\n\nPCP 通过简单身份安全层 (SASL) 支持 scram-sha-256\
    \ 身份验证机制。指标 RHEL 系统角色执行使用 scram-sha-256 身份验证机制的设置步骤。本过程描述了如何使用该角色设置身份验证。\n\n前提条件\n\
    \n- 您在用于运行剧本的机器上安装了 Red Hat Ansible Engine。\n- 您在用于运行剧本的机器上安装了 rhel-system-roles\
    \ 软件包。\n\n步骤\n\n- 1. 在您要设置身份验证的 Ansible 剧本中包含以下变量：\n\n```yaml\nvars:\n  metrics_username:\
    \ your_username\n  metrics_password: your_password\n```\n\n- 2. 运行 Ansible 剧本：\n\
    \n```bash\n# ansible-playbook name_of_your_playbook.yml\n```\n\n验证步骤\n\n- 验证 sasl\
    \ 配置：\n```bash\n# pminfo -f -h \"pcp://127.0.0.1?username=your_username\" disk.dev/read\n\
    Password: \n```\n\n## 15.6. 使用指标系统角色配置并启用指标\n\n本过程描述了如何使用指标系统角色为您的本地系统配置并启用指标。\n\
    （注：原文中 15.6 的 OCR 文本不完整，已包含可用内容。）\n"
