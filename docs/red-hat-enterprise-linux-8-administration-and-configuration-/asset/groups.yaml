    \          - 192.0.2.200\n          - 2001:db8::ffb\n      dns_search:\n     \
    \   - example.com\n      state: up\n```\n\n- 3. Run the playbook:\n  - To connect\
    \ as root to the managed host, enter:\n    - `ansible-playbook -u root ~/ethernet-static-IP.yml`\n\
    \  - To connect as a user to the managed host, enter:\n    - `ansible-playbook\
    \ -u user_name --ask-become ~/ethernet-static-IP.yml`\n\nThe `--ask-become` option\
    \ ensures that the `ansible-playbook` command prompts for the sudo password of\
    \ the user in the de-user `user_name` option.\n\nIf you do not specify the `-u\
    \ user_name` option, `ansible-playbook` connects to the managed host as the user\
    \ that is currently logged in to the control node.\n\n# Additional resources\n\
    \n- `/usr/share/ansible/roles/rhel-system-roles.network/README.md`\n- `ansible-playbook(1)`\
    \ man page\n\n# 5.2. CONFIGURING A DYNAMIC ETHERNET CONNECTION USING RHEL SYSTEM\
    \ ROLES WITH THE INTERFACE NAME\n\nThis procedure describes how to use RHEL System\
    \ Roles to remotely add a dynamic Ethernet connection for the `enp7s0` interface\
    \ by running an Ansible playbook. With this setting, the network connection requests\
    \ the IP settings for this connection from a DHCP server. Run this procedure on\
    \ the control node.\n\n# Prerequisites\n\n- A DHCP server is available in the\
    \ network.\n- The `ansible` and `rhel-system-roles` packages are installed on\
    \ the control node.\n\n- If you use a different remote user than **root** when\
    \ you run the playbook, this user has appropriate sudo permissions on the managed\
    \ node.\n\n- The host uses NetworkManager to configure the network.\n\n# Procedure\n\
    \n- 1. If the host on which you want to execute the instructions in the playbook\
    \ is not yet inventoried, add the IP or name of this host to the `/etc/ansible/hosts`\
    \ Ansible inventory file:\n\n```\nnode.example.com\n```\n\n- 2. Create the `~/ethernet-dynamic-IP.yml`\
    \ playbook with the following content:\n\n```yaml\n---\n- name: Configure an Ethernet\
    \ connection with dynamic IP\nhosts: node.example.com\nbecome: true\ntasks:\n\
    \  - include_role:\n      name: linux-system-roles.network\n\nvars:\n  network_connections:\n\
    \    - name: enp7s0\n      interface_name: enp7s0\n      type: ethernet\n    \
    \  autoconfig: yes\n      ip:\n        dhcp4: yes\n        auto6: yes\n      state:\
    \ up\n```\n\n- 3. Run the playbook:\n\n  - To connect as **root** to the managed\
    \ host, enter:\n\n```bash\n# ansible-playbook -u root ~/ethernet-dynamic-IP.yml\n\
    ```\n\n  - To connect as a user to the managed host, enter:\n\n```bash\n# ansible-playbook\
    \ -u user_name --ask-become-pass ~/ethernet-dynamic-IP.yml\n```\n\nThe **ask-become-pass**\
    \ option ensures that the **ansible-playbook** command prompts for the **sudo**\
    \ password of the user defined in the **user_name** option.\n\nIf you do not specify\
    \ the **-u user_name** option, **ansible-playbook** connects to the managed host\
    \ as the user that is currently logged in to the control node.\n\n# Additional\
    \ resources\n\n- `/usr/share/ansible/roles/rhel-system-roles.network/README.md`\n\
    - **ansible-playbook(1)** man page\n\n# 5.3. CONFIGURING VLAN TAGGING USING SYSTEM\
    \ ROLES\n\nYou can use the networking RHEL Role to configure VLAN tagging. This\
    \ procedure describes how to add an Ethernet connection and a VLAN with ID 10\
    \ that uses this Ethernet connection. As the parent device, the VLAN connection\
    \ contains the IP, default gateway, and DNS configurations.\n\nDepending on your\
    \ environment, adjust the plan accordingly. For example:\n\n- To use the VLAN\
    \ as a port in other connections, such as a bond, omit the IP attribute, and set\
    \ the IP configuration in the parent configuration.\n- To use team, bridge, or\
    \ bond devices in the VLAN, adapt the interface_name and type attributes of the\
    \ ports you use in the VLAN.\n\nPrerequisites\n\n- The ansible and rhel-system-roles\
    \ packages are installed on the control node.\n- If you use a remote user when\
    \ you run the playbook, this user has appropriate sudo permissions on the managed\
    \ node.\n\nProcedure\n\n- If the host on which you want to execute the instructions\
    \ in the playbook is not yet inventoried, add the IP or name of this host to the\
    \ /etc/ansible/hosts Ansible inventory file:\n\n```\nnode.example.com\n```\n\n\
    - Create the `~/vlan-ethernet.yml` playbook with the following content:\n\n```yaml\n\
    ---\n- name: Configure a VLAN that uses an Ethernet connection\nhosts: node.example.com\n\
    become: true\ntasks:\n  - include_role:\n      name: linux-system-roles.network\n\
    \nvars:\n  network_connections:\n    # Add an Ethernet profile for the underlying\
    \ device\n    - name: enp1s\n      type: ethernet\n      interface_name: enp1s\n\
    \      autoconnect: yes\n      state: up\n      ip:\n        dhcp4: no\n     \
    \   auto6: no\n    # Define the VLAN profile\n    - name: vlan10\n      type:\
    \ vlan\n      ip:\n        address:\n          - \"192.0.2.1/24\"\n          -\
    \ \"2001:db8::1/64\"\n        gateway4: 192.0.2.254\n        gateway6: 2001:db8::1::fffe\n\
    \        dns:\n          - 192.0.2.200\n          - 2001:db8::1::fffb\n      \
    \  dns_search:\n          - example.com\n        vlan_id: 10\n      parent: enp1s0\n\
    \      state: up\n```\n\nThe parent attribute in the VLAN profile configures the\
    \ VLAN to operate on top of the enp1s0 device.\n\n- 1. Run the playbook:\n\n \
    \ - Connect as root to the managed host, enter:\n\n```bash\n# ansible-playbook\
    \ -u root ~/vlan-ethernet.yml\n```\n\n  - Connect as a user to the managed host,\
    \ enter:\n\n```bash\n# ansible-playbook -u user_name --ask-become-pass ~/vlan-ethernet.yml\n\
    ```\n\nThe --ask-become-pass option makes the ansible-playbook command prompt\
    \ for the password of the user defined in the -u user_name option.\n\nIf you do\
    \ not specify the - user_name option, ansible-playbook connects to the managed\
    \ host as the user that is currently logged in to the control node.\n\nAdditional\
    \ resources\n\n- `/usr/share/ansible/roles/rhel-system-roles.network/README.md`\n\
    - ansible-playbook(1) man page\n\n# 5.4. CONFIGURING A NETWORK BRIDGE USING RHEL\
    \ SYSTEM ROLES\n\nYou can use the networking RHEL Role to configure a Linux bridge.\
    \ This procedure describes how to configure a network bridge that uses two Ethernet\
    \ devices, and sets IPv4 and IPv6 addresses, default gateways, and DNS configuration.\n\
    \n> NOTE\nSet the IP configuration on the bridge and not on the ports of the Linux\
    \ bridge.\n\nPrerequisites\n\n- The ansible and rhel-system-roles packages are\
    \ installed on the control node.\n\n- If you use a remote user from root when\
    \ you run the playbook, this user has appropriate sudo permissions on the managed\
    \ node.\n- Two or more physical or virtual network devices are installed on the\
    \ server.\n\nProcedure\n\n- 1. If the host on which you want to execute the instructions\
    \ in the /etc/ansible/hosts Ansible inventory is not inventoried, add the IP or\
    \ name of this host to the inventory:\n\n- 2. Create the `~/bridge-ether.yml`\
    \ playbook with the following content:\n\n```yaml\n---\n- name: Configure a network\
    \ bridge that uses two Ethernet ports\nhosts: node.example.com\nbecome: true\n\
    tasks:\n  - include_role:\n      name: linux-system-roles.network\n\nvars:\n \
    \ network_connections:\n    # Define the bridge profile\n    - name: bridge0\n\
    \      type: bridge\n      interface_name: bridge0\n      ip:\n        address:\n\
    \          - \"192.0.2.1/24\"\n          - \"2001:db8::1/64\"\n        gateway4:\
    \ 192.0.2.254\n        gateway6: 2001:db8::1::fffe\n      dns:\n        - 192.0.2.200\n\
    \        - 2001:db8::1::fffb\n      dns_search:\n        - example.com\n     \
    \ state: up\n    # Add an Ethernet profile to the bridge\n    - name: bridge0-port1\n\
    \      interface_name: enp7s0\n      type: ethernet\n      controller: bridge0\n\
    \      port_type: bridge\n      state: up\n    # Add a second Ethernet profile\
    \ to the bridge\n    - name: bridge0-port2\n      interface_name: enp8s0\n   \
    \   type: ethernet\n      controller: bridge0\n      port_type: bridge\n     \
    \ state: up\n```\n\nnode.example.com\n\n# CHAPTER 5. USING SYSTEM ROLES TO CONFIGURE\
    \ NETWORK CONNECTIONS\n\n- 3. Run the playbook:\n\n  - To connect as root user\
    \ to the managed host, enter:\n\n```bash\nansible-playbook -u root ~/bridge-ethernet.yml\n\
    ```\n\n  - To connect as a user to the managed host, enter:\n\n```bash\nansible-playbook\
    \ -u user_name --ask-become-pass ~/bridge-ethernet.yml\n```\n\nThe --ask-become-pass\
    \ option ensures that the ansible-playbook command prompts for the sudo password\
    \ of the user defined in the -u user_name option.\n\nIf you do not specify the\
    \ user_name option, ansible-playbook connects to the managed host as the user\
    \ that is currently logged in to the control node.\n\nAdditional resources\n\n\
    - /usr/share/ansible/roles/rhel-system-roles.network/README.md file\n- ansible-playbook(1)\
    \ man page\n"
