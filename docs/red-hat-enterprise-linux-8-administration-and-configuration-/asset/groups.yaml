    - 证书颁发机构 (CA) 证书存储在 /srv/data/ca.crt。\n\n操作步骤\n\n- 如果要执行 playbook 指令的主机尚未列入清单，请将该主机的\
    \ IP 或名称添加到 /etc/ansible/hosts 清清单文件中：\n\nnode.example.com\n\n2. 创建包含以下内容的 ~/enable-802.1x.yml\
    \ playbook：\n\n```yaml\n---\n- name: 配置带有 802.1X 身份认证的以太网连接\nhosts: node.example.com\n\
