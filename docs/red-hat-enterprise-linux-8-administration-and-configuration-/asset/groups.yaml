    # 11.3. REQUESTING A NEW CERTIFICATE FROM IDM CA USING THE CERTIFICATE SYSTEM
    ROLE


    With the Certificate System Role, you can use Red Hat Engine to issue certificates
    while using an IdM server with an integrated certificate authority (CA). Therefore,
    you can efficiently and consistently manage the certificate trust chain for multiple
    systems using IdM as the CA.


    This process uses the certmonger provider and requests the certificate through
    the getcert command.


    > NOTE

    By default, certmonger automatically tries to renew the certificate before it
    expires. You can disable this by setting the auto_renew parameter in the Ansible
    playbook no.


