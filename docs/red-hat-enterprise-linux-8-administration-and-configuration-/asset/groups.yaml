    # CHAPTER 9. SETTING A CUSTOM CRYPTOGRAPHIC POLICY ACROSS SYSTEMS


    As an administrator, you can use the Crypto Policies System Role on RHEL to quickly
    and consistently configure custom cryptographic policies across many different
    systems using Red Hat Ansible Automation Platform.


    # 9.1. CRYPTO POLICIES SYSTEM ROLE VARIABLES AND FACTS


    In a Crypto Policies System Role playbook, you can define the parameters for the
    crypto policies configuration according to your preferences and limitations.


    If you do not configure any variables, the system role does not configure the
    system and only reports the facts.


    Selected variables for the Crypto Policies System Role


    **crypto_policies_policy**

    Determines the cryptographic policy level the system role applies to the managed
    nodes. For details about the different crypto policy levels, see System-wide cryptographic
    policies.


    **crypto_policies_reload**

    If yes, the affected services, currently the helpsec, bind, and ssh services,
    reload after applying a crypto policy. Defaults to **yes**.


    **crypto_policies_reboot_ok**

    If yes, and a reboot is necessary after the system role changes the crypto policy,
    it sets **crypto_policies_reboot_required** Defaults to **no**.


    Facts set by the Crypto Policies System Role


    **crypto_policies_active**

    Lists the currently selected policy.


    **crypto_policies_available_policies**

    Lists all available policy levels available on the system.


    **crypto_policies_available_modules**

    Lists all available subpolicy modules available on the system.


    Additional resources


    +   - Creating and setting a custom system-wide cryptographic policy


    # 9.2. SETTING A CUSTOM CRYPTOGRAPHIC POLICY USING THE CRYPTO POLICIES SYSTEM
    ROLE


    You can use the Crypto Policies System Role to configure a large number of managed
    nodes consistently from a single control node.


    Prerequisites'
- md: "\nAccess and permissions to one or more managed nodes, which are systems you\
    \ want to configure with the Crypto Policies System Role.\n\nAccess and permissions\
    \ to a control node, which is a system from which Red Hat Ansible Engine configures\
    \ other systems.\nOn the control node:\n\n- Red Hat Ansible Engine is installed\n\
    - The rhel-system-roles package is installed\n- An inventory file which lists\
    \ the managed nodes.\n\n## Procedure\n\n- Create a new playbook.yml file with\
    \ the following content:\n\n```\n---\n- hosts: all\ntasks:\n  - name: Configure\
    \ crypto policies\n    include_role:\n    - name: linux-system-roles.crypto_policies\n\
    vars:\n  - crypto_policies_policy: FUTURE\n  - crypto_policies_reboot_ok: true\n\
    ```\n\nYou can replace the FUTURE value with your preferred crypto policy, for\
    \ example: DEFAULT, LEGACY, and FIPSOPSP.\n\nThe `crypto_policies_reboot_ok: true`\
    \ variable causes the system to reboot after the system changes the crypto policy.\n\
    \nFor more details, see Crypto Policies System Role variables and facts.\n\n-\
    \ Optional: Verify playbook syntax.\n\n```\n# ansible-playbook --syntax-check\
    \ playbook.yml\n```\n\n- Run the playbook on your inventory file:\n\n```\n# ansible-playbook\
    \ -i inventory_file playbook.yml\n```\n\n## Verification\n\n- On the control node,\
    \ create another playbook named, for example, verify_playbook.yml.\n\n```\n- hosts:\
    \ all\ntasks:\n  - name: Verify active crypto policy\n    include_role:\n    -\
    \ name: linux-system-roles.crypto_policies\ndebug:\n  - var: crypto_policies_active\n\
    ```\n\nThis playbook does not change any configurations on the system, only reports\
    \ the active policy on the managed nodes.\n\n2. Run the playbook on the same inventory\
    \ file:\n\n```\n# ansible-playbook -i inventory_file verify_playbook.yml\n\nTASK\
    \ [debug] *********************\nok: [host] => {\n  \"crypto_policies_active\"\
    : \"FUTURE\"\n}\n```\n\nThe `crypto_policies_active` variable shows the policy\
    \ active on the managed node.\n\n## 9.3. ADDITIONAL RESOURCES\n\n- /usr/share/ansible/roles/rhel-system-roles/crypto_policies/README.md\
    \ file.\n- ansible-playbook(1) man page.\n- Installing RHEL System Roles ..\n\
    - Applying a system role.\n\n## CHAPTER 10. USING THE CLEVIS AND TANG SYSTEM ROLES\n\
    \n## 10.1. INTRODUCTION TO THE CLEVIS AND TANG SYSTEM ROLES\n\nRHEL System Roles\
    \ is a collection of Ansible roles and modules that provide a consistent configuration\
    \ interface to remotely manage RHEL Decryption.\n\nRHEL 8.3 introduced Ansible\
    \ roles for automated deployments of Policy-Based Decryption (PBD) solutions using\
    \ Clevis and Tang. The rhel-system-roles package contains these system roles,\
    \ the related examples, and also the reference documentation.\n\nThe **nbnd_client**\
    \ role enables you to deploy multiple Clevis clients in an automated way. Note\
    \ that the **nbnd_client** role supports only bindings, and you cannot use it\
    \ for TPM2.\n\nThe **nbnd_client** role requires volumes that are already encrypted\
    \ using LUKS. LUKS supports to bind a LUKS-encrypted volume to one or more Network-Bound\
    \ (NBDE) servers - Tang. You can either preserve the existing volume encryption\
    \ with a passphrase or remove it. After removing the passphrase, you can unlock\
    \ the volume using only NBDE. This is useful when a volume is initially encrypted\
    \ using a temporary key or password that you remove after the system you provide\
    \ the system.\n\nIf you provide both a passphrase and a key file, the role uses\
    \ whatever you have provided first. If it does not find any of the value, it attempts\
    \ to retrieve a passphrase from an existing binding.\n\nPBD defines a binding\
    \ as a mapping of a device to a slot. This means that you can have multiple bindings\
    \ for the same device. The default slot is 1.\n\nThe **nbnd_client** role provides\
    \ also the **state** variable. Use the **present** value for either creating a\
    \ new binding or updating an existing one. Unlike to a **clevis bind** command,\
    \ you can use **state: present** for overwriting an existing binding in its device\
    \ slot. The **absent** value removes a specified binding.\n\nUsing the **nbnd_server**\
    \ you can deploy and manage a Tang server as part of an automated encryption solution.\
    \ This role supports the following features:\n\n- Rotating Tang keys\n- Deploying\
    \ and backing up Tang keys\n\n### Additional resources\n\n- For a detailed reference\
    \ on Network-Bound Disk Encryption (NBDE) role variables, install the rhel-system-roles\
    \ package, and see the **README.md** and **README.html** files in `/usr/share/doc/rhel-system-roles/nbnd_client/`\
    \ and `/usr/share/ansible/roles/rhel-system-roles/nbnd_server/` directories.\n\
    - For example-roles playbooks, install the **rhel-system-roles** package, and\
    \ see the `/usr/share/ansible/roles/rhel-system-roles.nbnd_server/` directories.\n\
    - For more information on RHEL System Roles, see **Introduction to RHEL System\
    \ Roles**\n\n## 10.2. USING THE NBDE_SERVER SYSTEM ROLE FOR SETTING MULTIPLE TANG\
    \ SERVERS\n\nRed Hat Enterprise Linux Administration and configuration tasks using\
    \ System Roles in RHEL\n\nFollow the steps to prepare and apply an Ansible playbook\
    \ containing your Tang-server settings.\n\n### Prerequisites\n\n- Your Red Hat\
    \ Ansible Engine is attached to the system. See the How-to article.\n\n## Procedure\n\
    \n1. Enable the RHEL repository, for example:\n\n```\n# subscription-manager repos\n\
    ```\n\n2. Install Ansible Engine:\n\n```\n# yum install\n```\n\n3. Install system\
    \ roles:\n\n```\n# yum install rhel-system-roles\n```\n\n4. Prepare your playbook\
    \ containing Tang settings. You can either start from the scratch or use one of\
    \ the examples:\n\n```\n# cp /usr/share/ansible/roles/rhel-system-roles.nbde_server/examples/playbook.yml\
    \ .\n```\n\n5. Edit the playbook in your text editor, for example:\n\n```\n# vi\
    \ playbook.yml\n```\n\n6. Add the required parameters. The following example shows\
    \ the rotation:\n\n```\n---\n- hosts: all\nvars:\n  nbde_server: yes\n\nroles:\n\
    - linux-system-roles\n```\n\n7. Apply the finished playbook:\n\n```\n# ansible-playbook\
    \ -i inventory_file playbook.yml\n```\n\n### IMPORTANT\n\nTo ensure that networking\
    \ for a Tang is available during early boot by using the grub tool on the system\
    \ where Clevis is installed:\n\n```\n# grubby --update-kernel=ALL --args=\"rd.neednet=1\"\
    \n```\n\n## 10.3. USING THE NBDE_CLIENT ROLE FOR SETTING MULTIPLE CLEVIS CLIENTS\n\
    \nThe nbde_client role supports only bindings. This means that you cannot use\
    \ it for TPM2.\n\nThe following example configures Clevis clients for automated\
    \ unlocking of these LUKS-encrypted volumes when at least one of two servers is\
    \ available:\n\n```\n---\nhosts: all\nvars:\n  nbde_client:\n    device: /dev/rhel/root\n\
    \    encryption_key_src: /etc/luks/keyfile\n    servers:\n      - http://server1.example.com\n\
    \      - http://server2.example.com\n    device: /dev/rhel/swap\n    encryption_key_src:\
    \ /etc/luks/keyfile\n    servers:\n      - http://server1.example.com\n      -\
    \ http://server2.example.com\n```\n\nroles:\n- linux-system-roles.nbde_client\n"
  mdcn: "\n\n访问一个或多个受管理节点的权限，这些节点是您希望使用加密策略系统角色（Crypto Policies System Role）配置的系统。\n\
    \n访问控制节点的权限，控制节点是 Red Hat Ansible Engine 用于配置其他系统的系统。\n在控制节点上：\n\n- 已安装 Red Hat\
    \ Ansible Engine\n- 已安装 `rhel-system-roles` 软件包\n- 一个列出受管理节点的清单文件。\n\n## 步骤\n\n\
    - 创建一个包含以下内容的新 `playbook.yml` 文件：\n\n```\n---\n- hosts: all\ntasks:\n  - name:\
    \ Configure crypto policies\n    include_role:\n    - name: linux-system-roles.crypto_policies\n\
    vars:\n  - crypto_policies_policy: FUTURE\n  - crypto_policies_reboot_ok: true\n\
    ```\n\n你可以将 `FUTURE` 值替换为您偏的加密策略，例如：DEFAULT、LEGACY 和 FIPSOPSP。\n\n`crypto_policies_reboot_ok:\
    \ true` 变量会导致系统在更改加密策略后重启。\n\n有关更多详细信息，请参阅加密策略系统角色变量和事实（Crypto Policies System\
    \ Role variables and facts）。\n\n- 可选：验证 playbook 语法。\n\n```\n# ansible-playbook\
    \ --syntax-check playbook.yml\n```\n\n- 在您的清单文件上运行 playbook：\n\n```\n# ansible-playbook\
    \ -i inventory_file playbook.yml\n```\n\n## 验证\n\n- 在控制节点上，创建另一个名为例如 `verify_playbook.yml`\
    \ 的 playbook。\n\n```\n- hosts: all\ntasks:\n  - name: Verify active crypto policy\n\
    \    include_role:\n    - name: linux-system-roles.crypto_policies\ndebug:\n \
    \ - var: crypto_policies_active\n```\n\n此 playbook 不更改系统上的任何配置，仅报告受管理节点上激活的策略。\n\
    \n2. 在同一清单文件上运行 playbook：\n\n```\n# ansible-playbook -i inventory_file verify_playbook.yml\n\
    \nTASK [debug] *********************\nok: [host] => {\n  \"crypto_policies_active\"\
    : \"FUTURE\"\n}\n```\n\n`crypto_policies_active` 变量显示受管理节点上激活的策略。\n\n## 9.3. 附加资源\n\
    \n- `/usr/share/ansible/roles/rhel-system-roles/crypto_policies/README.md` 文件。\n\
    - ansible-playbook(1) 手页。\n- 安装 RHEL 系统角色 ..\n- 应用系统角色。\n\n## 第 10 章. 使用 CLEVIS\
    \ 和 TANG 系统角色\n\n## 10.1. CLEVIS 和 TANG 系统角色简介\n\nRHEL 系统角色是 Ansible 角色和模块的集合，提供了一个一致的配置接口，用于远程管理\
    \ RHEL 解密。\n\nRHEL 8.3 引入了 Ansible 角色，用于使用 Clevis 和 Tang 自动化部署基于策略的解密（PBD）解决方案。`rhel-system-roles`\
    \ 软件包包含了这些系统角色、相关示例以及相关参考文档。\n\n**nbnd_client** 角色允许您以自动化方式部署多个 Clevis 客户端。注意，**nbnd_client**\
    \ 角色仅支持绑定（bindings），您无法将其用于 TPM2。\n\n**nbnd_client** 角色需要已使用 LUKS 加密的卷。LUKS 支持将经\
    \ LUKS 加密的卷绑定到一个或多个网络边界加密（NBDE）服务器 - Tang。您可以使用密码保留现有的卷加密，也可以将其移除。在移除密码后，您可以仅使用\
    \ NBDE 解锁该卷。当卷最初使用临时密钥或密码加密，且您在提供提供系统后将其移除时，这种方法非常有用。\n\n如果您同时提供了密码和密钥文件，该角色将使用您先提供的任何一个值。如果没有找到任何一个值，它将尝试从现有的绑定中检索密码。\n\
    \nPBD 将绑定定义为设备到槽位（slot）的映射。这意味着您可以对同一个设备拥有多个绑定。默认槽位为 1。\n\n**nbnd_client** 角色还提供了\
    \ **state** 变量。使用 **present** 值来创建新绑定或更新现有绑定。与 **clevis bind** 命令不同，您可以使用 **state:\
    \ present** 来覆盖设备槽位中的现有绑定。**absent** 值会移除指定的绑定。\n\n使用 **nbnd_server**，您可以将 Tang\
    \ 服务器作为自动化加密解决方案的一部分进行部署和管理。该角色支持以下功能：\n\n- 轮换 Tang 密钥\n- 部署和备份 Tang 密钥\n\n###\
    \ 附加资源\n\n- 有关网络边界加密（NBDE）角色变量的详细参考，请安装 `rhel-system-roles` 软件包，并查看 `/usr/share/doc/rhel-system-roles/nbnd_client/`\
    \ 和 `/usr/share/ansible/roles/rhel-system-roles/nbnd_server/` 目录下的 **README.md**\
    \ 和 **README.html** 文件。\n- 示例角色 playbooks，请安装 **rhel-system-roles** 软件包，并查看 `/usr/share/ansible/roles/rhel-system-roles/nbnd_server/`\
    \ 目录。\n- 有关 RHEL 系统角色的更多信息，请参阅**系统角色简介**\n\n## 10.2. 使用 NBDE_SERVER 系统角色设置多个 TANG\
    \ 服务器\n\n使用 RHEL 系统角色进行 Red Hat Enterprise Linux 管理和配置任务\n\n按照以下步骤准备并应用包含 Tang\
    \ 设置的 Ansible playbook。\n\n### 前提条件\n\n- 您的 Red Hat Ansible Engine 已连接到系统。参见相关文章。\n\
    \n## 步骤\n\n1. 启用 RHEL 仓库，例如：\n\n```\n# subscription-manager\n```\n\n2. 安装 Ansible\
    \ Engine：\n\n```\n# yum\n```\n\n3. 安装系统角色：\n\n```\n# yum install rhel-system-roles\n\
    ```\n\n4. 准备包含 Tang 设置的 playbook。您可以从零开始，也可以使用示例之一：\n\n```\n# cp /usr/share/ansible/roles/rhel-system-roles.nbnd_server/examples/playbook.yml\
    \ .\n```\n\n5. 在文本编辑器中编辑 playbook，例如：\n\n```\n# vi playbook.yml\n```\n\n6. 添加必要的参数。以下示例了轮换：\n\
    \n```\n---\n- hosts: all\nvars:\n  nbde_server: yes\n\nroles:\n- linux-system-roles\n\
    ```\n\n7. 应用完成的 playbook：\n\n```\n# ansible-playbook -i inventory_file playbook.yml\n\
    ```\n\n### 重要\n\n在安装了 Clevis 的系统上使用 grub 工具确保在启动早期可以使用 Tang 的网络：\n\n```\n# grubby\
    \ --update-kernel=ALL --args=\"rd.neednet=1\"\n```\n\n## 10.3. 使用 NBDE_CLIENT\
    \ 角色设置多个 CLEVIS 客户端\n\nnbnd_client 角色仅支持绑定。这意味着您无法将其用于 TPM2。\n\n以下示例配置了 Clevis\
    \ 客户端，以便在两个服务器中任一可用时自动解锁这些 LUKS 加密的卷：\n\n```\n---\nhosts: all\nvars:\n  nbde_client:\n\
    \    device: /dev/rhel/root\n    encryption_key_src: /etc/luks/keyfile\n    servers:\n\
    \      - http://server1.example.com\n      - http://server2.example.com\n    device:\
    \ /dev/rhel/swap\n    encryption_key_src: /etc/luks/keyfile\n    servers:\n  \
    \    - http://server1.example.com\n      - http://server2.example.com\n```\n\n\
    roles:\n- linux-system-roles.nbde_client\n\n"
