    # 16.5. RECORDING A SESSION USING THE DEPLOYED TLOG SYSTEM ROLE IN THE CLI


    Once you have deployed the tlog System Role in the system you have specified,
    you are able to record a user terminal session using the command-line interface
    (CLI).


    Prerequisites


    +   - You have deployed the tlog System Role in the target system.

    - The SSSD configuration drop file was created in the /etc/sssd/conf.d file.


    Procedure


    +   1. Create a user and assign a password for this user:


    ```

    # useradd recordeduser

    # passwd recordeduser

    ```


    +   2. Relog to the system as the user you just created:


    ```

    # ssh recordeduser@localhost

    ```


    +   3. Type "yes" when the system prompts you to type yes no to authenticate.


    +   4. Insert the recordeduser''s password. The system prompts a message to inform
    you that your session is being recorded.


    > ATTENTION! Your session is being recorded!


    +   5. Once you have finished recording the session, type:


    ```

    # exit

    ```


    The system logs out from the user and recorded, stored and you can play it using
    a journal.


    As a result, the user session is recorded, stored and you can play it using a
    journal.


    Verification steps


    To view your recorded session in the journal, do the following steps:


    +   1. Run the command below:'
