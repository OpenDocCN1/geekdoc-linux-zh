    \          value: operation2_attribute1_value\n        - name: operation2_attribute2_name\n\
    \          value: operation2_attribute2_value\n```\n\n默认情况下，未定义资源。\n\n如需包含资源配置的\
    \ **ha_cluster** 系统角色 playbook 示例，请参阅 [使用围隔离和资源配置高可用集群](https://example.com)\n\
    \n## ha_cluster_resource_groups\n\n此变量定义了由系统角色配置的 pacemaker 资源组。你可以为每个资源组配置的项如下：\n\
    \n- **id** (强制性) - 组的 ID。\n- **resources** (强制性) - 组的资源列表。每个资源通过其 ID 引用，且资源必须在\
    \ **ha_cluster_primitives** 变量中定义。必须列出一个资源。\n- **meta_attrs** (可选) - 组元属性集合列表。目前仅支持一个集合。\n\
    \n你通过 ha_cluster 系统角色配置的资源组定义结构如下：\n\n```yaml\nha_cluster_resource_groups:\n \
    \ - id: group-id\n    resource_ids:\n      - resource1-id\n      - resource2-id\n\
    \    meta_attrs:\n      - attrs:\n          - name: group_meta_attribute1_name\n\
    \            value: group_meta_attribute1_name\n          - name: group_meta_attribute2_name\n\
    \          value: group_meta_attribute2_name\n```\n\n默认情况下，未定义任何资源组。\n\n如需包含资源组配置的\
    \ ha_cluster 系统角色 playbook 示例，请参阅使用围隔离和资源配置高可用集群。\n\n## ha_cluster_resource_clones\n\
    \n此变量定义了由系统角色配置的 pacemaker 克隆。你可以为克隆配置的项如下：\n\n- **resource_id** (强制性) - 要克隆的资源。该资源必须在\
    \ ha_cluster_resource_primitives 变量或 ha_cluster_resource_groups 变量中定义。\n- **promotable**\
    \ (可选) - 表示要创建的资源克隆是否为提升克隆，值为 yes 或 no。\n- **id** (可选) - 克隆的自定义 ID。如果没有指定 ID，则将自动生成。如果集群不支持此选项，将显示警告。\n\
    - **meta_attrs** (可选) - 克隆元属性集合列表。目前仅支持一个集合。\n\n你通过 ha_cluster 系统角色配置的资源克隆定义结构如下：\n\
    \n```yaml\nha_cluster_resource_clones:\n  - resource_id: resource-to-be-cloned\n\
    \    promotable: yes\n    id: clone-id\n    meta_attrs:\n      - attrs:\n    \
    \      - name: meta_attribute1_name\n            value: meta_attribute1_value\n\
    \          - name: meta_attribute2_name\n            value: meta_attribute2_value\n\
    ```\n\n默认情况下，未定义任何资源克隆。\n\n如需包含资源克隆配置的 ha_cluster 系统角色 playbook 示例，请参阅使用围隔离和资源配置高可用集群。\n\
    \n## 17.2 为 HA_CLUSTER 指定清单\n\n在使用 ha_cluster 系统角色 playbook 配置 HA 集群时，你需要在清单中配置节点的名称和地址。\n\
    \n对于清单中的每个节点，你可以可选地指定以下项：\n\n- **node_name** - 集群中的节点名称。\n- **pcs_address** -\
    \ 用于与节点通信的地址。可以是名称、FDN 或 IP 地址，并可以包含端口号。\n- **corosync_addresses** - Corosync\
    \ 使用的地址列表。形成特定集群的所有节点必须具有相同数量的地址，且地址顺序很重要。\n\n以下示例显示了 node1 和 node2 的清单。node1\
    \ 和 node2 必须是完全限定域名，或者能够通过 /etc/hosts 文件解析到节点。\n\n```yaml\nall:\n  hosts:\n  \
    \  node1:\n      ha_cluster:\n        node_name: node-A\n        pcs_address:\
    \ node1-address\n      corosync_addresses:\n        - 192.168.1.11\n        -\
    \ 192.168.2.11\n    node2:\n      ha_cluster:\n        node_name: node-B\n   \
    \     pcs_address: node-2-address:2224\n      corosync_addresses:\n        - 192.168.1.12\n\
    \        - 192.168.2.12\n```\n\n## 17.3 配置不运行任何资源的高可用集群\n\n以下步骤使用 ha_cluster 系统角色，创建一个未配置围隔离且不运行任何资源的高可用集群。\n\
    \n### 前提条件\n\n- 你在想要运行 playbook 的节点上安装了 Red Hat Ansible Engine。\n\n> 注意\n> 集群节点上不需要安装\
    \ Ansible。\n\n## 17.4 配置带有围隔离和资源的高可用集群\n\n以下步骤使用 ha_cluster 系统角色，创建一个配置了围隔离并运行资源的高可用集群。\n\
    \n"
