- md: "\n# Red Hat Enterprise Linux Administration and configuration tasks using System\
    \ Roles in RHEL\n\n- If you use a remote user root when you run the playbook,\
    \ this user has appropriate sudo permissions on the managed node.\n\nProcedure\n\
    \n- 1. If the host on which you want to execute the instructions in the playbook\
    \ is not yet inventoried, add the IP or name of this host to the /etc/ansible/hosts\
    \ Ansible inventory file:\n\n```\nnode.example.com\n```\n\n- 2. Create the ~/configure-ethernet-device-with-ethtoolcoalesce-settings.yml\
    \ playbook with the following:\n```yaml\nname: Configure an Ethernet connection\
    \ with ethtool coalesce settings\nhosts: node.example.com\nbecome: true\ntasks:\n\
    \  - include_role:\n      name: linux-system-roles.network\n\nvars:\n  network_connections:\n\
    \    - name: enp1s0\n      type: ethernet\n      autoconnect: yes\n      ip:\n\
    \        address:\n        - 198.51.100.20/24\n        - 2001:db8:1::/64\n   \
    \   gateway4: 198.51.100.254\n      gateway6: 2001:db8:1::fffe\n      dns:\n \
    \       - 198.51.100.200\n        - 2001:db8:1::ffbb\n      dns_search:\n    \
    \    - example.com\n  ethtool:\n    coalesce:\n      rx_frames: 128\n      tx_frames:\
    \ 128\n      state: up\n```\n\n- 3. Run the playbook:\n\n- To connect as root\
    \ user to the managed host, enter:\n`# ansible-playbook -u root ~/configure-ethernet-device-with-ethtoolcoalesce-settings.yml`\n\
    \n- To connect as a user to the managed host, enter:\n`# ansible-playbook -u user_name\
    \ --ask-become-pass ~/configure-ethernet-device-with-ethtoolcoalesce-settings.yml`\n\
    \nThe --become-pass option makes sure that the ansible-playbook command prompts\
    \ for the sudo password of the user defined in the -u user_name option.\n\nIf\
    \ you do not specify the -u user_name option, ansible-playbook connects to the\
    \ managed host as the user that is currently logged in to the control node.\n\n\
    Additional resources\n\n- /usr/share/ansible/roles/rhel-system-roles.network/README.md\n\
    - ansible-playbook(1) man page\n\n# CHAPTER 6. CONFIGURING SELINUX USING SYSTEM\
    \ ROLES\n\n## 6.1. INTRODUCTION TO THE SELINUX SYSTEM ROLE\n\nRHEL System Roles\
    \ are a collection of Ansible roles and modules that provide a consistent configuration\
    \ interface to remotely manage multiple RHEL systems. The SELinux system role\
    \ enables the following actions:\n\n- Cleaning policy modifications related to\
    \ SELinux booleans, file contexts, ports, and logins.\n- Setting SELinux policy\
    \ booleans, file contexts, ports, and logins.\n- Restoring file contexts on specified\
    \ files or directories.\n- Managing SELinux modules.\n\nThe following table provides\
    \ an overview of input variables available in the SELinux system role.\n\nTable\
    \ 6.1. SELinux role variables\n\n| Role variable | Description | CLI alternative\
    \ |\n| --- | --- | --- |\n| selinux_policy | Chooses a policy protecting targeted\
    \ processes or Multi Level Security protection. | **SELINUXTYPE** in `/etc/selinux/config`\
    \ |\n| selinux_state | Switches SELinux modes. See **ansible-doc selinux** | **setforce**\
    \ and **SELINUX** in `/etc/selinux/config`. |\n| selinux_booleans | Enables and\
    \ disables SELinux booleans. See **ansible-doc seboolean**. | **setsebool** |\n\
    | selinux_fcontexts | Adds or removes a SELinux file context mapping. See **ansible-doc\
    \ fcontext**. | **semanage fcontext** |\n| selinux_restore_dirs | Restores SELinux\
    \ labels on the file-system tree. | **restorecon -R** |\n| selinux_ports | Sets\
    \ SELinux labels on ports. See **ansible-doc deport.** | **semanage port** |\n\
    | selinux_logins | Sets users to SELinux user mapping. See **ansible-doc login**.\
    \ | **semanage login** |\n| selinux_modules | Installs, enables, disables, or\
    \ removes SELinux modules. | **semodule** |\n\nThe /usr/share/doc/rhel-system-roles/selinux/example-selinux-playbook.yml\
    \ example playbook installed by the rhel-system-roles package demonstrates how\
    \ to set the targeted policy in enforcing mode. The playbook also applies several\
    \ local policies and restores your verified contexts in the /tmp/test_dir/.\n\n\
    For a detailed reference on SELinux variables, install the rhel-system-roles package,\
    \ and see the README.md or README.html files in the /usr/share/doc/rhel-system-roles/selinux/\
    \ directory.\n\nAdditional resources\n\n- Introduction to RHEL System Roles.\n\
    \n## 6.2. USING THE SELINUX SYSTEM ROLE TO APPLY SELINUX SETTINGS ON MULTIPLE\
    \ SYSTEMS\n\nFollow the steps to prepare and apply an Ansible playbook with your\
    \ verified settings.\n\nPrerequisites\n\n- Your RHEL subscription is attached.\n\
    \nProcedure\n\n- Enable the repository:\n```bash\n# subscription-manager repos\
    \ --enable ansible\n```\n\n- Install Ansible:\n```bash\n# yum install ansible\n\
    ```\n\n- Install rhel-system-roles package:\n```bash\n# yum install rhel-system-roles\n\
    ```\n\n- Prepare your playbook:\n```bash\n# cp /usr/share/doc/rhel-system-roles/selinux/example-selinux-playbook.yml\
    \ my-selinux.yml\n```\n\n- Change the content of the playbook to fit your scenario:\n\
    ```bash\n# vi my-selinux.yml\n```\n\n- Run your playbook on host1, host2, and\
    \ host3:\n```bash\n# ansible-playbook -i host1,host2,host3 my-selinux.yml\n```\n\
    \n# CHAPTER 7. USING THE LOGGING SYSTEM ROLE\n\nAs a system administrator, you\
    \ can use the Logging System Role to configure a RHEL host as a logging server\
    \ to collect logs from many client systems.\n\n## 7.1. THE LOGGING SYSTEM ROLE\n\
    \nWith the Logging System Role, you can deploy logging configurations on local\
    \ and remote hosts.\n\nTo apply a Logging Role on one or more systems, you define\
    \ the logging configuration in a playbook. A playbook is a list of one or more\
    \ plays. Playbooks are human-readable, and they are written in the YAML format.\
    \ For more information about playbooks, see Working with playbooks in Ansible\
    \ documentation.\n\nThe set of systems you want Ansible to configure according\
    \ to the playbook is defined in an inventory file. For more information on creating\
    \ and updating inventories, see How to build your inventory in Ansible documentation.\n\
    \nLogging solutions provide multiple ways of reading logs and multiple logging\
    \ outputs.\n\nFor example, a logging system can receive the following inputs:\n\
    \n- local files\n- systemd/journal\n- another logging system over the network.\n\
    \nIn addition, a logging system can have the following outputs:\n\n- logs are\
    \ stored in the local files in the /var/log directory\n- logs are sent to Elasticsearch\n\
    - logs are forwarded to another logging system.\n\nWith the logging system role,\
    \ you can combine the inputs and outputs to fit your needs. For example, you can\
    \ configure a logging solution that stores inputs from journal in a local file,\
    \ whereas inputs from files are both forwarded to another logging system and stored\
    \ in the local file.\n\n## 7.2. LOGGING SYSTEM ROLE PARAMETERS\n\nIn a Logging\
    \ System Role playbook, you define the inputs in the logging_inputs parameter,\
    \ outputs in the logging_outputs parameter, and the relationships between the\
    \ inputs and outputs in the logging_flows parameter. The Logging System Role processes\
    \ these variables with additional options to configure the logging system. You\
    \ can also enable encryption.\n\n> NOTE\n> Currently, the only available logging\
    \ system in the Logging System Role is Rsyslog.\n\n- logging_inputs: List of inputs\
    \ for the logging solution.\n  - name: Unique name of the input. Used in the logging_flows:\
    \ inputs list and a part of the generated config file name.\n"
