    \n关于 RHEL 系统角色以及如何应用它们的更多信息，请参阅《RHEL 系统角色简介》。\n\n## 12.1. KDUMP RHEL 系统角色\n\n\
    kdump 系统角色允许您在多个系统上设置基本的内核 dump 参数。\n\n## 12.2. KDUMP 角色参数\n\n| 角色变量 | 说明 |\n\
