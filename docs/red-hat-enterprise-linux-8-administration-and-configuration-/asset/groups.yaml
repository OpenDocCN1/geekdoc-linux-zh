    \ Currently, only one set is supported.\n\nThe structure of the resource clone\
    \ definition that you configure with the ha_cluster system role is as follows:\n\
    \n```yaml\nha_cluster_resource_clones:\n  - resource_id: resource-to-be-cloned\n\
    \    promotable: yes\n    id: clone-id\n    meta_attrs:\n      - attrs:\n    \
    \      - name: clone_meta_attribute1_name\n            value: clone_meta_attribute1_name\n\
    \          - name: clone_meta_attribute2_name\n            value: clone_meta_attribute2_name\n\
    ```\n\nBy default, no resource clones are defined.\n\nFor an example ha_cluster\
    \ system role playbook that includes resource clone configuration, see Configuring\
    \ a high availability cluster with fencing and resources.\n\n## 17.2. SPECIFYING\
    \ AN INVENTORY FOR THE HA_CLUSTER SYSTEM ROLE\n\nWhen configuring an HA cluster\
    \ using the ha_cluster system role playbook, you configure the names and addresses\
    \ of the nodes for the cluster in your inventory.\n\nFor each node in your inventory,\
    \ you can optionally specify the following items:\n\n- **node_name** - the name\
    \ of a node in a cluster.\n- **pcs_address** - an address used by bpcs to communicate\
    \ with the node. It can be a name, FDN or an IP address and it can include a port\
    \ number.\n- **corosync_addresses** - list of addresses used by Corosync. All\
    \ nodes which form a particular cluster must have the same number of addresses\
    \ and the order of the addresses matters.\n\nThe following example shows an inventory\
    \ with targets node1 and node2.node1 and node2 must be either fully qualified\
    \ domain names or must otherwise be able to connect to the nodes as when, for,\
    \ the names are resolvable through the /etc/hosts file.\n\n```yaml\nall:\n  hosts:\n\
    \    node1:\n      ha_cluster:\n        node_name: node-A\n        pcs_address:\
    \ node1-address\n      corosync_addresses:\n        - 192.168.1.11\n        -\
    \ 192.168.2.11\n    node2:\n      ha_cluster:\n        node_name: node-B\n   \
    \     pcs_address: node-2-address:2224\n      corosync_addresses:\n        - 192.168.1.12\n\
    \        - 192.168.2.12\n```\n\n## 17.3. CONFIGURING A HIGH AVAILABILITY CLUSTER\
