  - '[PAGE 47]


    +   - type: Type of the input element. The type specifies a task type which corresponds
    to a directory name in files/rsyslog/tasks,vars/inputs/.


    +   - basics: Inputs configuring inputs fromsystemd or unix socket.


    +   - kernel_message: Default imlog if set totrue. Default to false.


    +   - use_imusock: Use imsock instead of imjournal. Default to false.


    +   - ratimiter_burst: Maximum number of messages that can be emitted within ratimiter_interval.
    Default to 20000 if use_imusock is false. Default to 200 if use_imusock is true.


    +   - ratimiter_interval: Interval to evaluateratimiterburst. Default to 600 seconds
    if use_imusock is false. Default to 0 ifuse_imusock is true. It indicates rate
    limiting is off.


    +   - persist_state_interval: Journal state is persisted everyvalue messages.
    Default to 10. Effective only when use_imusock is false.


    +   - files: Inputs configuring inputs from local files.


    +   - remote: Inputs configuring inputs from the other logging system over network.


    +   - state: State of the configuration file.present or absent. Default to present.


    +   - logging_outputs: List of outputs for the logging solution.


    +   - files: Outputs configuring outputs to local files.


    +   - forwards: Outputs configuring outputs to another logging system.


    +   - remote_files: Outputs configuring outputs from another logging system to
    local files.


    +   - logging_flows: List of flows that define relationships betweenlogging_inputs
    and logging_outputs. The logging_flows variable has the following keys:


    +   - name: Unique name of the flow


    +   - inputs: List oflogging_inputs name values


    +   - outputs: List oflogging_outputs name values.


    Additional resources


    +   - Documentation installed with the rhel-system-roles package in /usr/share/ansible/roles/rhel-system-roles.logging/README.html


