- md: "\n# MAKING OPEN SOURCE MORE INCLUSIVE\n\nRed Hat is committed to replacing\
    \ problematic language in our code, documentation, and web properties. We are\
    \ beginning with these four terms: master, slave, blacklist, and whitelist. Because\
    \ of the enmity of this endeavor, these changes will be implemented gradually\
    \ over several upcoming releases. For more details, see our CTO Chris Wright's\
    \ message.\n\n# PROVIDING FEEDBACK ON RED HAT DOCUMENTATION\n\nWe appreciate your\
    \ input on our documentation. Please let us know how we could make it better.\
    \ To do so:\n\n- For simple comments on specific passages:\n1. Make sure you are\
    \ viewing the documentation in the *Multi-page HTML* format. In addition, ensure\
    \ you see the **Feedback** button in the upper right corner of the document.\n\
    2. Use your mouse cursor to highlight the text that you want to comment on.\n\
    3. Click the **Add Feedback** pop-up that appears below the highlighted text.\n\
    4. Follow the displayed instructions.\n\n- For submitting more complex feedback,\
    \ create a Bugzilla ticket:\n1. Go to the Bugzilla website.\n2. As the Component,\
    \ use **Documentation**.\n3. Fill in the **Description** field with your suggestion\
    \ for improvement. Include a link to the relevant part(s) of documentation.\n\
    4. Click **Submit Bug**.\n\n# CHAPTER 1. GETTING STARTED WITH RHEL SYSTEM ROLES\n\
    \nThis section explains what RHEL System Roles are. Additionally, it describes\
    \ how to apply a particular role through an Ansible playbook to perform various\
    \ system administration tasks.\n\n# 1.1. INTRODUCTION TO RHEL SYSTEM ROLES\n\n\
    RHEL System Roles is a collection of Ansible roles and modules. RHEL System Roles\
    \ provide a configuration interface to remotely manage multiple RHEL systems.\
    \ The interface enables system configurations across multiple versions of RHEL,\
    \ as well as adopting new major releases.\n\nOn Red Hat Enterprise Linux 8, the\
    \ interface currently consists of the following roles:\n\n- kdump\n- network\n\
    - selinux\n- storage\n- certificate\n- kernel_settings\n- logging\n- metrics\n\
    - nbde_client and nbde_server\n- timesync\n- tlog\n\nAll roles are provided by\
    \ the rhel-system-roles package available in the AppStream repository.\n\n###\
    \ Additional resources\n\n- Red Hat Enterprise Linux (RHEL) System Roles\n- /usr/share/doc/rhel-system-roles\
    \ documentation [1]\n- Introduction to the SELinux system role\n- Introduction\
    \ to the storage role\n- Administration and configuration tasks using System Roles\
    \ in RHEL\n\n# 1.2. RHEL SYSTEM ROLES TERMINOLOGY\n\nYou can find the following\
    \ terms across this documentation:\n\nSystem Roles terminology\n\n# Ansible playbook\n\
    \nPlaybooks are Ansible's configuration, deployment, and orchestration language.\
    \ They can describe a policy you want remote systems to ensure, or a set of steps\
    \ in a general IT process.\n\n# Control node\n\nAny machine with Ansible installed.\
    \ You can run commands and playbooks, invoking /usr/bin/ansible or /usr/bin/ansible-playbook,\
    \ from any control node. You can use any control that has Python installed on\
    \ it as a control node - laptops, shared desktops, and servers can all run Ansible.\
    \ However, you cannot use a Windows machine as a control node. You can have multiple\
    \ control nodes.\n\n# Inventory\n\nA list of managed nodes. An inventory file\
    \ is sometimes called a \"hostfile\". Your inventory can specify information like\
    \ IP address for each managed node. An inventory also organizes managed nodes,\
    \ creating and nesting groups for easier scaling. To learn more about inventory,\
    \ see the Working with Inventory section.\n\n# Managed nodes\n\nThe network devices,\
    \ servers, or both that you manage with Ansible. Managed nodes are also sometimes\
    \ called \"hosts\". Ansible is not installed on managed nodes.\n\n# 1.3. APPLYING\
    \ A ROLE\n\nThe following procedure describes how to apply a particular role.\n\
    \n# Prerequisites\n\n- Ensure that the rhel-system-roles package is installed\
    \ on the system that you want to use as a control node:\n- # yum install rhel-system-roles\n\
    - You need the ansible package to run playbooks that RHEL System Roles. Ensure\
    \ that the Ansible repository is enabled, and the ansible package is installed\
    \ on the system that you want to use as a control node.\n- If you do not have\
    \ a Red Hat Ansible Engine Subscription, you can use a limited supported version\
    \ of Red Hat Ansible Engine provided with your Red Hat Enterprise Linux subscription.\
    \ In this case, follow these steps:\n    - Enable the RHEL Ansible Engine repository:\n\
    \      - # subscription-manager refresh\n      - # subscription-manager repos\
    \ --enable ansible-2-for-rhel-8_x86_64-rpms\n    - Install Ansible Engine:\n \
    \     - # yum install ansible\n- If you have a Red Hat Ansible Engine Subscription,\
    \ follow the procedure described in How to Download and Install Red Hat Ansible\
    \ Engine?.\n- Ensure that you are able to create an Ansible inventory. Inventories\
    \ represent the hosts, host groups, and some of the configuration parameters used\
    \ by the Ansible playbooks.\n\nPlaybooks are typically human-readable, and are\
    \ defined in ini, yaml, json, and other file formats.\n\n- Ensure you are able\
    \ to create an Ansible playbook. Playbooks represent Ansible's configuration,\
    \ deployment, and orchestration language. By using playbooks, you can create and\
    \ manage configurations of remote machines, deploy multiple remote machines or\
    \ orchestrate steps of any manual ordered process.\n\nA playbook is a list of\
    \ one or more plays. Every play can include Ansible variables, tasks, or rules.\n\
    \nPlaybooks are human-readable, and are defined in the yaml format.\n\n# Procedure\n\
    \n1. Create the required Ansible inventory containing the hosts you want to manage.\
    \ Here is an example using a file called inventory:\n```ini\n[webservers]\nhost1\n\
    host2\nhost3\n```\n\n2. Create an Ansible playbook including the required role.\
    \ The following example shows how to use roles through the option:\n```yaml\n\
    ---\nhosts: webservers\nroles:\n  - rhel-system-roles.network\n  - rhel-system-roles.timesync\n\
    ```\n\n> NOTE: Every role includes a README file, which documents how to use the\
    \ role and supported parameter values. Such documentation is found in the following\
    \ location:\n```\n/usr/share/doc/rhel-system-roles/SUBSY/\n```\nReplace SUBSY\
    \ with the name of the role, such as selinux, kdump, network, timesync, or storage.\n\
    \n3. To execute the playbook on specific hosts, you must perform one of the following:\n\
    \n- Edit the playbook to use hosts:all, and execute the command:\n```bash\n# ansible-playbook\
    \ your_playbook.yml\n```\n\n- Edit the inventory to ensure that the hosts you\
    \ want to use are defined in a group, and execute the command:\n```bash\n# ansible-playbook\
    \ -i inventory_file.ini your_playbook.yml\n```\n\n# ## IMPORTANT\n\nBe aware that\
    \ the -i flag specifies the inventory of all hosts that are available. If you\
    \ have multiple targeted hosts, but want to select a host against which you want\
    \ to run the playbook, you can add a variable in the playbook to select a host.\
    \ For example:\n\n```yaml\n# Ansible Playbook | example-playbook.yml\n---\nhosts:\
    \ \"{{ target_host }}\"\nroles:\n  - rhel-system-roles.network\n  - rhel-system-roles.timesync\n\
    ```\n\nPlaybook execution command:\n```bash\n# ansible-playbook -i host1..hostn\
    \ -e target_host=host5 example-playbook.yml\n```\n\n# ## Additional resources\n\
    \n* Ansible playbooks\n* Using roles in Ansible playbook\n* Examples of Ansible\
    \ playbooks\n* How to create and work with inventory?\n* ansible-playbook\n\n\
    # ## 1.4. ADDITIONAL RESOURCES\n\n- Red Hat Enterprise Linux (RHEL) System Roles\
    \ Red Hat Knowledgebase article\n- Managing local storage using RHEL System Roles\n\
    - Deploying the same SELinux configuration on multiple systems using RHEL System\
    \ Roles\n\n[1] This documentation is installed automatically with the **rhel-system-roles**\
    \ package.\n"
