    \n```bash\n# ansible-playbook -i inventory_file/path/to/file/playbook.yml\n```\n\
    \n# 附加资源\n\n- 关于 kdump 角色变量的详细参考，请参阅 /usr/share/doc/rhel-system-roles/kdump 目录下的\
