    Website (ocf:heartbeat:apache): Started z2.example.com\n```\n\n- 3. To test the\
    \ resource group running on z1.example.com, put z1.example.com in standby mode,\
    \ after which the node will no longer be able to host resources.\n\n```bash\n\
