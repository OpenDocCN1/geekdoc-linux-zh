    \ or group name\n* allow_list - Allowed actions for the specified user or group:\n\
    \  * read - View cluster status and settings\n  * write - Modify cluster settings\
    \ except permissions and ACLs\n  * grant - Modify cluster permissions and ACLs\n\
    \  * full - Unrestricted access to a cluster including adding and removing nodes\
