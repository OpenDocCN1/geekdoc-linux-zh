- md: "\n# CHAPTER 11. REQUESTING CERTIFICATES USING RHEL SYSTEM ROLES\n\nWith the\
    \ Certificate System Role, you can use Red Hat Ansible Engine to issue and manage\
    \ certificates.\n\nThis chapter covers the following topics:\n\n- * The Certificate\
    \ System Role\n- Requesting a new self-signed certificate using the Certificate\
    \ System Role\n- Requesting a new self-signed certificate from IdM CA using the\
    \ Certificate System Role\n\n## 11.1. THE CERTIFICATE SYSTEM ROLE\n\nUsing the\
    \ Certificate System Role, you can manage issuing and renewing TLS and SSL certificates\
    \ using Red Hat Ansible Engine.\n\nThe role uses certmonger as the certificate\
    \ provider, and currently supports issuing and renewing self-signed certificates\
    \ and using the IdM integrated certificate authority (CA).\n\nYou can use the\
    \ following variables in your Ansible playbook with the Certificate System Role:\n\
    \n```\ncertificate_wait\nto specify if the task should wait for the certificate\
    \ to be issued.\ncertificate_requests\nto represent each certificate to be issued\
    \ and its parameters.\n```\n\nAdditional resources\n\n- * For details about the\
    \ parameters used in the certificate_requests variable and additional information\
    \ about the Certificate System Role, see the /usr/share/ansible/roles/rhel-system-roles/certificate/README.md\
    \ file.\n- For details about RHEL System Roles and how to apply them, Getting\
    \ started with RHEL System Roles.\n\n## 11.2. REQUESTING A NEW SELF-SIGNED CERTIFICATE\
    \ USING THE CERTIFICATE SYSTEM ROLE\n\nWith the Certificate System Role, you can\
    \ use Red Hat Ansible Engine to issue self-signed certificates.\n\nThis process\
    \ uses the certmonger provider and requests the certificate through the getcert\
    \ command.\n\n> NOTE\n> By default, certmonger automatically tries to renew the\
    \ certificate before it expires. You can disable this by setting the auto_renew\
    \ parameter in the Ansible playbook to no.\n\n# Red Hat Enterprise Linux 8 Administration\
    \ and configuration tasks using System Roles in RHEL\n\n# Prerequisites\n\n- You\
    \ have Red Hat Ansible Engine installed on the system from which you want to run\
    \ the playbook.\n\n> NOTE\n> You do not have to have Ansible installed on the\
    \ systems on which you want to deploy the certificate solution.\n\n- You have\
    \ the rhel-system-roles package installed on the system from which you want to\
    \ run the playbook. For details about RHEL System Roles and how to apply them,\
    \ see [Getting started with RHEL System Roles](https://docs.redhat.com/en/system-roles).\n\
    \n# Procedure\n\n- 1. Optional: Create an inventory file, for example inventory.file:\n\
    2. Open your inventory file and define the hosts on which you want to request\
    \ the certificate, for example:\n3. Create a playbook file, for example request-certificate.yml:\n\
    \n```\n$ touch inventory.file\n```\n\n```\n[webserver]\nserver.idm.example.com\n\
    ```\n\n- Set hosts to include the hosts on which you want to request the certificate,\
    \ such as webserver.\n- Set the certificate_requests parameter to include the\
    \ following:\n\n- Set the name parameter to the desired name of the certificate,\
    \ such as mycert.\n- Set the dns parameter to the domain to be included in the\
    \ certificate, such as *.example.com.\n- Set the ca parameter to self-sign.\n\n\
    - Set the rhel-system-roles.certificate role under roles. This is the playbook\
    \ file for this example:\n\n```\n---\n- hosts: webserver\nvars:\n  certificate_requests:\n\
    \  - name: mycert\n    dns: *.example.com\n    ca: self-sign\nroles:\n  - rhel-system-roles.certificate\n\
    ```\n\n4. Save the file.\n\n5. Run the playbook.\n\n```\n$ ansible-playbook -i\
    \ inventory.file request-certificate.yml\n```\n\nAdditional resources\n\n- For\
    \ details about the parameters used in the certificate_requests variable and additional\
    \ information about the Certificate System Role, see the /usr/share/ansible/roles/rhel-system-roles.README.md\
    \ file.\n- For details about the ansible-playbook command, see the ansible-playbook(1)\
    \ man page.\n\n## 11.3. REQUESTING A NEW CERTIFICATE FROM IDM CA USING THE CERTIFICATE\
    \ SYSTEM ROLE\n\nWith the Certificate System Role, you can use Red Hat Engine\
    \ to issue certificates while using an IdM server with an integrated certificate\
    \ authority (CA). Therefore, you can efficiently and consistently manage the certificate\
    \ trust chain for multiple systems using IdM as the CA.\n\nThis process uses the\
    \ certmonger provider and requests the certificate through the getcert command.\n\
    \n> NOTE\n> By default, certmonger automatically tries to renew the certificate\
    \ before it expires. You can disable this by setting the auto_renew parameter\
    \ in the Ansible playbook to no.\n\nPrerequisites\n\n- You have Red Hat Ansible\
    \ Engine installed on the system from which you want to run the playbook.\n\n\
    > NOTE\n> You do not have to have Ansible installed on the systems on which you\
    \ want to deploy the certificate solution.\n\n- You have the rhel-system-roles\
    \ package installed on the system from which you want to run the playbook.\nFor\
    \ details about RHEL System Roles and how to apply them, see Getting started with\
    \ RHEL System Roles.\n\nProcedure\n\n- 1. Optional: Create an inventory file,\
    \ for example inventory.file:\n\n```\n$ touch inventory.file\n```\n\n2. Open your\
    \ inventory file and define the hosts on which you want to request the certificate,\
    \ for example:\n\n```\n[webserver]\nserver.id.example.com\n```\n\n3. Create a\
    \ playbook file, for example request-certificate.yml:\n\n- Set hosts to include\
    \ the hosts on which you want to request the certificate, such as webserver.\n\
    - Set the certificate_requests variable to include the following:\n  - Set the\
    \ name parameter to the desired name of the certificate, such as mycert.\n  -\
    \ Set the dns parameter to the domain to be included in the certificate, such\
    \ as *.example.com.\n  - Set the principal parameter to the Kerberos principal,\
    \ such as HTTP@example.com.\n  - Set the ca parameter to ip.\n\n- Set the rhel-system-roles.certificate\
    \ role under roles.\nThis is the playbook for this example:\n\n```\n---\n- hosts:\
    \ webserver\nvars:\n  certificate_requests:\n    - name: mycert\n      dns: *.example.com\n\
    \      principal: HTTP@example.com\n      ca: ip\nroles:\n  - rhel-system-roles.certificate\n\
    ```\n\n4. Save the file.\n\n5. Run the playbook.\n\n```\n$ ansible-playbook -i\
    \ inventory.file request-certificate.yml\n```\n\nAdditional resources\n\n- For\
    \ details about the parameters used in the certificate_requests variable and additional\
    \ information about the Certificate System Role, see the /usr/share/ansible/roles/rhel-system-roles/certificate/README.md\
    \ file.\n- For details about the ansible-playbook command, see the ansible-playbook(1)\
    \ man page.\n\n## 11.4. SPECIFYING COMMANDS TO RUN BEFORE OR AFTER CERTIFICATE\
    \ ISSUANCE USING THE CERTIFICATE SYSTEM\n\nWith the Certificate System Role, you\
    \ can use Red Hat Ansible Engine to execute a command before and after a certificate\
    \ is issued or renewed.\n\nIn the following example, the administrator ensures\
    \ stopping the http service before a self-signed certificate for www.example.com\
    \ is issued or renewed, and restarting afterwards.\n\n> NOTE\n> By default, certmonger\
    \ automatically tries to renew the certificate before it expires. You can disable\
    \ this by setting the auto_renew parameter in the Ansible playbook to no.\n\n\
    # Prerequisites\n\n- You have Red Hat Ansible Engine installed on the system from\
    \ which you want to run the playbook.\n\n# NOTE\n> You do not have to have Ansible\
    \ installed on the systems on which you want to deploy the certificate solution.\n\
    \n- You have the rhel-system-roles package installed on the system from which\
    \ you want to run the playbook.\n"
  mdcn: "\n\n# 第 11 章。使用 RHEL 系统角色请求证书\n\n使用证书系统角色（Certificate System Role），你可以使用\
    \ Red Hat Ansible Engine 来颁发和管理证书。\n\n本章涵盖了以下主题：\n\n- 证书系统角色\n- 使用证书系统角色请求新的自签名证书\n\
    - 使用证书系统角色从 IdM CA 请求新的自签名证书\n\n## 11.1. 证书系统角色\n\n使用证书系统角色，你可以使用 Red Hat Ansible\
    \ Engine 管理 TLS 和 SSL 证书的颁发和续签。\n\n该角色使用 `certmonger` 作为证书提供程序，目前支持颁发和续签自签名证书，以及使用\
    \ IdM 集成证书颁发机构（CA）。\n\n你可以在使用证书系统角色的 Ansible playbook 中中使用以下变量：\n\n```\ncertificate_wait\n\
    指定任务是否应该等待证书颁发。\ncertificate_requests\n表示要颁发的每份证书及其参数。\n```\n\n额外资源\n\n- * 有关\
