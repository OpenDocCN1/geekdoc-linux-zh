- md: "\n# Additional resources\n\n- /usr/share/ansible/roles/rhel-system-roles/network/README\n\
    - ansible-playbook(1) man page\n\n# 5.8. CONFIGURING A STATIC ROUTE USING RHEL\
    \ SYSTEM ROLES\n\nYou can use the networking RHEL System Role to configure static\
    \ routes.\n\n![](img/7076193df8761a1565038e17afc88b0b_36_0.png)\n\n> IMPORTANT\n\
