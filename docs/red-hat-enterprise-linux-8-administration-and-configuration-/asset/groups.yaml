    \ or other shared network device.\n\n- You have configured an LVM logical volume\
    \ with ext4, as described in Configuring an LVM volume with an ext4 file system\
    \ in a Pacemaker cluster.\n\n- You have configured an Apache HTTP server, as described\
    \ in Configuring an Apache HTTP server.\n\n- Your system includes an APC power\
    \ switch that will be used to fence the cluster nodes.\n\n> NOTE\n> The ha_cluster\
    \ system role replaces any existing cluster configuration on the specified nodes.\
    \ Any settings not specified in the role will be lost.\n\n### Procedure\n\n- 1.\
    \ Create an inventory file specifying the nodes in the cluster, as described in\
    \ Specifying an inventory for the ha_cluster system role.\n\n- 2. Create a playbook\
    \ file, for example http-cluster.yml: The following example playbook configures\
    \ a previously-created Apache HTTP server in an active/passive two-node HA cluster.\n\
    \nThis example uses an APC power switch with a host name of zapc.example.com.\
    \ If the cluster does not use any fence agents, you can only list the fence agents\
    \ your cluster requires when defining the ha_cluster_fence_agent_packages variable,\
    \ as in this example.\n\nWhen creating your playbook file for production, it is\
    \ recommended that you vault encrypt the password, as described in Encrypting\
    \ content with Ansible Vault.\n\n```yaml\n- hosts: z1.example.com z2.example.com\n\
    - rhel-system-roles.ha_cluster vars:_cluster_hacluster_password: ha_cluster_name:\
