    \ /usr/share/ansible/roles/rhel-system-roles.logging/README.html.\n- RHEL System\
    \ Roles.\n- ansible-playbook(1) man page.\n\n# CHAPTER 8. CONFIGURING SECURE COMMUNICATION\
    \ WITH THE SSH SYSTEM ROLES\n\nAs an administrator, you can use the SSHD System\
    \ Role to configure SSH servers and the SSH System Role to configure SSH clients\
    \ consistently on any number of RHEL systems at the same time using Red Hat Ansible\
    \ Automation Platform.\n\n# 8.1. SSH SYSTEM ROLE VARIABLES\n\nIn an SSH System\
    \ Role playbook, you can define the parameters for the SSH configuration file\
    \ according to your preferences and limitations.\n\nIf you do not configure these\
    \ variables, the system role produces a sshd_config file that matches the RHEL\
    \ defaults.\n\nIn all cases, Booleans correctly render as yes and no in ssh configuration.\
    \ You can define multi-line configuration items using lists:\n\n- sshd_ListenAddress:\n\
    \  - 0.0.0.0\n\nrenders as:\n- ListenAddress 0.0.0\n\n## Variables for the SSH\
    \ System Role\n\n- sshd_enable:\nIf set to False, the role is completely disabled.\
    \ Defaults to True.\n\n- sshd_skip_defaults:\nIf set to True, the system role\
    \ does not apply default values. Instead, specify the complete set of configuration\
    \ using either the sshd dict. If set to False, the service is not managed, which\
    \ means it is not enabled on boot and does not start. Defaults to True except\
    \ when running inside a container or AIX, because the Ansible module does not\
    \ support AIX.\n\n- sshd_allow_reload:\nIf set to False, sshd does not reload\
    \ after change of configuration. This can help with troubleshooting. To apply\
    \ the changed configuration, reload sshd manually. Defaults to the same value\
    \ as sshd_manage_service except on AIX, whereas sshd_manage_service defaults to\
    \ False but sshd_allow_reload defaults to True.\n\n- sshd_install_service:\nIf\
    \ set to True, the role installs service files for the sshd service. This overrides\
    \ files provided in the operating system. Do not set to True unless you are configuring\
    \ a second instance and change the sshd_service_variable. Defaults to False. The\
    \ role uses the files pointed to by the following templates:\n- sshd_service_template\
    \ (default: templates/sshd_service.j2)\n- sshd_service_template_at (default: templates/sshd@service.j2)\n\
    - sshd_service_template_socket (default: templates/sshd.socket.j2)\n\n- sshd_service:\n\
    This variable changes the sshd service name, which is useful for configuring a\
    \ second sshd service instance.\n\n- sshd:\nA dict that contains configuration.\
    \ For example:\n```\nsshd:\n  Compression: yes\n  ListenAddress: 0.0.0.0\n```\n\
    \n- sshd_Option:\nYou can define options by using variables consisting of the\
    \ sshd prefix and the option name instead of a dict. Variables override values\
    \ in the sshd dict. For example:\n```\nsshd_Compression: no\n```\n\n- sshd_match:\n\
    A list of dicts or just a dict for the match section. Note that these variables\
    \ do not override match blocks defined in the sshd dict. All of the sources will\
    \ be reflected in the resulting configuration file.\n\n## Secondary variables\
    \ for the SSHD System Role\n\nYou can use these variables to override the defaults\
    \ that correspond to each supported platform.\n\n- sshd_packages:\nYou can override\
    \ the default list of installed packages using this variable.\n\n- sshd_config_owner,\
    \ sshd_config_group, and sshd_config_mode:\nYou can set the ownership and permissions\
    \ for the openssh configuration file that this role produces.\n\n- sshd_config_file:\n\
    The path where this role sets the openssh server configuration.\n\n- sshd_binary:\n\
    The path to the sshd executable of openssh.\n\n- sshd_service:\nThe name of the\
    \ sshd service. By default, this variable contains the name of the sshd service\
    \ that the target platform uses. You can also use it to set the name of the custom\
    \ sshd service when the role uses the sshd_install_service variable.\n\n- sshd_verify_hostkeys:\n\
    Defaults to auto. When set to auto, this lists all hosts that are present in the\
    \ produced configuration file and generates any paths that are not present. Additionally,\
    \ permissions and files are set to default values. This is useful if the role\
    \ is used in the deployment stage to make sure the service is allowed to start\
    \ on the first attempt. To disable this check, set this variable to an empty list\
    \ [].\n\n- sshd_hostkey_owner, sshd_hostkey_group, sshd_hostkey_mode:\nUse these\
    \ variables to set the ownership and permissions for the host keys sshd_verify_hostkeys.\n\
    \n- sshd_sysconfig:\nOn RHEL-based systems, this variable configures additional\
    \ details of the ssh service. If set to true, it also parses /etc/sysconfig/sshd\
    \ configuration file based on the following configuration. Defaults to false.\n\
    \n- sshd_sysconfig_override_crypto_policy:\nIn RHEL, when set to true, this variable\
    \ overrides the system-wide crypto policy. Defaults to false.\n\n- sshd_sysconfig_use_strong_rng:\n\
    On RHEL-based systems, this variable can force sshd to reseed the random number\
    \ generator by number bytes given as the argument. The default is 0, which disables\
    \ this functionality. Do not turn this on if the system does not have a hardware\
    \ random number generator.\n\n# 8.2. CONFIGURING OPENSSH SERVERS USING THE SSHD\
    \ SYSTEM ROLE\n\nYou can use the SSHD System Role to configure multiple SSH servers\
    \ by running an Ansible playbook.\n\n## Prerequisites\n\n- Access and permissions\
