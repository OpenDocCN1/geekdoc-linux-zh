    \n# 使用系统角色进行 Red Hat Enterprise Linux 8 管理和配置任务\n\n# 前提条件\n\n- 您在想要运行 playbook\
    \ 的系统上安装了 Red Hat Ansible Engine。\n\n> 注意\n您不需要在想要部署 kdump 解决方案的系统上安装 Red Hat\
