    \ 13. MANAGING LOCAL STORAGE USING RHEL SYSTEM ROLES\n\nTo manage LVM and file\
    \ systems (FS) using Ansible, you can use the storage role, which is one of the\
    \ RHEL System Roles available in RHEL 8.\n\nUsing the storage role enables you\
    \ to automate administration of file systems on disks and logical volumes on multiple\
    \ machines and all versions of RHEL starting with RHEL 7.7.\n\nFor more information\
    \ about RHEL System Roles and how to apply them, see Introduction to RHEL System\
    \ Roles.\n\n## 13.1. INTRODUCTION TO THE STORAGE ROLE\n\nThe storage role can\
    \ manage:\n\n- File systems on disks which have not been partitioned\n- Complete\
    \ LVM volume groups including the logical volumes and file systems\n\nWith the\
    \ storage role you can perform the following tasks:\n\n- Create a file system\n\
    - Remove a file system\n- Mount a file system\n- Unmount a file system\n- Create\
    \ LVM volume groups\n- Remove LVM volume groups\n- Create logical volumes\n- Remove\
    \ logical volumes\n- Create RAID\n- Remove RAID\n- Create LVM pools\n- Remove\
    \ LVM pools\n\n## 13.2. PARAMETERS THAT IDENTIFY A STORAGE DEVICE\n\nThe storage\
    \ role identifies the volume by the disks: attribute.\n\nstorage_volumes\n\nList\
    \ of file systems to be managed. Currently the only supported pool is LVM.\n\n\
    ## 13.3. EXAMPLE ANSIBLE PLAYBOOK TO CREATE XFS ON A BLOCK DEVICE\n\nThis section\
    \ provides an example playbook. This playbook applies the storage role to create\
    \ XFS on a block device.\n\n> WARNING\nThe storage role can create a file system\
    \ only on unpartitioned disks or logical volumes.\n\nExample 13.1. A playbook\
    \ that creates XFS on /dev/sdb\n\n```yaml\n---\n- hosts: all\n  vars:\n    storage_volumes:\n\
    \      - name: barefs\n        type: disk\n        disks:\n          - sdb\n \
    \     fs_type: xfs\nroles:\n  - rhel-system-roles.storage\n```\n\n- The volume\
    \ name barefs (in the example) is arbitrary.\n- You can omit the fs_type: xfs\
    \ line because XFS is the default file system in RHEL 8.\n- To create the file\
    \ system on an LV, provide LVM setup under the disks: attribute, including the\
    \ exclusive volume group. For details, see Example playbook to manage logical\
    \ volumes.\n\n Additional resources\n\n- The /usr/share/ansible/roles/rhel-system-roles.storage/README.md\
    \ file.\n\n## 13.4. EXAMPLE ANSIBLE PLAYBOOK TO PERSISTENTLY MOUNT A FILE SYSTEM\n\
    \nThis section provides an Ansible playbook. This playbook applies the storage\
    \ role to immediately and persistently mount an XFS file system.\n\nExample 13.2.\
    \ A playbook that mounts a file system on /dev/sdb to /mnt/data\n\n```yaml\n---\n\
    - hosts: all\nvars:\n  storage_volumes:\n    name: barefs\n    type: disk\n  \
    \  disks:\n      - sdb\n  fs_type: xfs\n  mount_point: /mnt/data\nroles:\n  -\
    \ rhel-system-roles.storage\n```\n\n- This playbook adds the file to the /etc/fstab\
    \ file, and mounts the file system immediately.\n- If the file system on the /dev/sdb\
    \ device or the mount point directory do not exist, the playbook creates them.\n\
    \nAdditional resources\n\n- /usr/share/ansible/roles/rhel-system-roles.storage/README.md\
    \ file.\n\n## 13.5. EXAMPLE ANSIBLE PLAYBOOK TO MANAGE LOGICAL VOLUMES\n\nThis\
    \ section provides an example Ansible playbook. This playbook applies the storage\
    \ role to create an LVM logical volume in a volume group.\n\nExample 13.3. A playbook\
    \ that creates a mylv logical volume in the myvg volume group\n\n```yaml\n---\n\
    - hosts: all\nvars:\n  storage_pools:\n    name: myvg\n    disks:\n      - sda\n\
    \      - sdb\n      - sdc\nvolumes:\n  name: mylv\n  size: 2G\n  fs_type: ext4\n\
    ```\n"
