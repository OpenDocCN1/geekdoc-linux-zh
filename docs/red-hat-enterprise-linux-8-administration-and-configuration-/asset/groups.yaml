    # 5.6. CONFIGURING A STATIC ETHERNET CONNECTION WITH 802.1X NETWORK AUTHENTICATION
    USING RHEL SYSTEM ROLES


    Using RHEL System Roles, you can automate the creation of an Ethernet connection
    that uses the 802.1X standard to authenticate the client. This procedure describes
    how to remotely add an Ethernet connection for the enp9s interface with the following
    settings by running Ansible playbook:


    +   - A static IPv4 address - 192.0.2.1 with a/24 subnet mask

    - A static IPv6 address - 2001:db8::1:: with a/64 subnet mask

    - An IPv4 default gateway - 192.0.2.254

    - An IPv6 default gateway - 2001:db8::1::fffe

    - An IPv4 DNS server - 192.0.2.200

    - An IPv6 DNS server - 2001:db8::1::ffbb

    - A DNS search domain - example.com

    - 802.1X network authentication using the TLS Extensible Authentication Protocol
    (EAP)


    Run this procedure on the Ansible control node.


    Prerequisites


    +   - The ansible and rhel-system-roles packages are installed on the control
    node.

    - If you use a different remote user than root when you run the playbook, you
    must have appropriate sudo permissions on the managed node.

    - The network supports 802.1X network authentication.

    - The managed node uses NetworkManager.

    - The files required for TLS authentication exist on the control node:


    +   - The client key is stored in the /srv/data/client/client.key file.

    - The client certificate is stored in the /srv/data/client/client.crt file.

    - The Certificate Authority (CA) certificate is stored in the /srv/data/data/ca.crt
    file.


    Procedure


    +   - If the host on which you want to execute the instructions in the playbook
    is not yet inventoried, add the IP or name of this host to the /etc/ansible/hosts
    Ansible inventory file:


    29'
  - "[PAGE 33]\n\n# node.example.com\n\n2. Create the ~ --enable-802.1x.yml playbook\
    \ with the following content:\n\n```\n---\n- name: Configure an Ethernet connection\
    \ with 802.1X authentication\nosts: node.example.com\nbecome: true\ntasks:\n \
    \ - name: Copy client key for 802.1X authentication\n    copy:\n      src: \"\
    /srv/data/client.key\"\n      dest: \"/etc/pki/tls/private/client.key\"\n    \
    \  mode: 0600\n  - name: Copy client certificate for 802.1X authentication\n \
    \   copy:\n      src: \"/srv/data/client.crt\"\n      dest: \"/etc/pki/tls/certs/client.crt\"\
    \n  - name: Copy CA certificate for 802.1X authentication\n    copy:\n      src:\
    \ \"/srv/data/ca.crt\"\n      dest: \"/etc/pki/ca-trust/source/anchors/ca.crt\"\
    \n  - include_role:\n    name: linux-system-roles.network\n    vars:\n      network_connections:\n\
    \        name: enp1s0\n        type: ethernet\n        autoconnect: yes\n    \
    \    ip:\n          address:\n            - 192.0.2.1/24\n            - 2001:db8:1::/64\n\
    \          gateway4: 192.0.2.254\n          gateway6: 2001:db8:1::ffff\n     \
    \     dns:\n            - 192.0.2.200\n            - 2001:db8:1::ffbb\n      \
    \    dns_search:\n            - example.com\n      ieee802.1x:\n        identity:\
    \ user_name\n        eap: tls\n        private_key: \"/etc/pki/tls/private/client.key\"\
    \n        private_key_password: \"password\"\n        client_cert: \"/etc/pki/tls/certs/client.crt\"\
    \n        ca_cert: \"/etc/pki/ca-trust/source/anchors/ca.crt\"\n        domain_suffix_match:\
    \ example.com\n        state: up\n```\n\n3. Run the playbook:"
