- md: "\n## CHAPTER 2. INSTALLING RHEL SYSTEM ROLES IN YOUR SYSTEM\n\nTo use the RHEL\
    \ System Roles, install the required packages in your system.\n\nPrerequisites\n\
    \n- You have a Red Hat Ansible Engine Subscription. See the procedure [How do\
    \ I Download and Install Red Hat Ansible Engine?](https://www.redhat.com/en/articles/red-hat-ansible-management/how-to-download-and-install-red-hat-ansible-engine)\n\
    \nProcedure\n\n1. Install the **rhel-system-roles** package on the system that\
    \ you want to use as a control node:\n```bash\n# yum install rhel-system-roles\n\
    ```\nIf you do not have a Red Hat Ansible Engine Subscription, you can use a limited\
    \ supported version of Red Hat Ansible Engine provided with your Red Hat Enterprise\
    \ Linux subscription. In this case, follow these steps:\na. Enable the RHEL Ansible\
    \ Engine repository:\n```bash\n# subscription-manager refresh\n# subscription-manager\
    \ repos --enable ansible-2-for-rhel-8-x86_64-rpms\n```\nb. Install Ansible Engine:\n\
    ```bash\n# yum install ansible\n```\n\nAs a result, you are able to create an\
    \ Ansible playbook.\n\nAdditional resources\n\n- The [Red Hat Enterprise Linux\
    \ (RHEL) System Roles](https://docs.redhat.com/en/red-hat-enterprise-linux/8/)\n\
    - The **ansible-playbook** man page.\n\n## CHAPTER 3. INSTALLING AND USING COLLECTIONS\n\
    \n### 3.1. INTRODUCTION TO ANSIBLE COLLECTIONS\n\nAnsible Collections are the\
    \ new way of distributing, maintaining, and consuming automation. By combining\
    \ types of Ansible content such as playbooks, roles, modules, and plugins, you\
    \ can benefit from improvements in flexibility and scalability.\n\nThe Ansible\
    \ Collections are an option to the RHEL System Roles format. Using the RHEL System\
    \ Roles in the Ansible Collection format is the same as it is using in the traditional\
    \ RHEL System Roles format (FQCN). The difference is that Ansible uses the concept\
    \ of a **fully qualified collection name** which consists of a namespace and the\
    \ **collection name**. The namespace we use is **redhat** and the **collection\
    \ name** is **rhel_system_roles**. So, while the traditional RHEL System Roles\
    \ format for the kernel is presented as *rhel-system-roles.kernel_settings*, using\
    \ Collection **fully qualified collection name** for the kernel role would be\
    \ presented as *redhat.rhel_system_roles.kernel_settings*.\n\nThe combination\
    \ of a **namespace** and a **collection name** guarantees that the objects are\
    \ unique. it ensures that objects are shared across the Ansible Collections and\
    \ namespaces without any conflicts.\n\n#### Additional resources\n\n- You can\
    \ find the Red Hat Certified Collections by accessing the Automation Hub.\n\n\
    ### 3.2. COLLECTIONS STRUCTURE\n\nCollections are a package format for Ansible\
    \ content. The data structure is as follows:\n\n- docs/: local location for the\
    \ collection, with examples, if the role provides the documentation\n- galaxy.yml:\
    \ source data for the MANIFEST.json that will be part of the Ansible Collection\
    \ package\n- playbooks/: playbooks are available here\n    - tasks/: this holds\
    \ 'task list files' for include_tasks/import_tasks tasks usage\n- plugins/: all\
    \ Ansible plugins and modules are available here, each in its subdirectory\n \
    \   - modules/: Ansible modules\n    - modules_utils/: common code for developing\
    \ modules\n    - lookup/: search for a plugin\n    - filter/: Jinja2 filter plugin\n\
    \    - connection/: connection plugins required if not using the default\n- roles/:\
    \ directory for Ansible roles\n- tests/: tests for the collection's content\n\n\
    ### 3.3. INSTALLING COLLECTIONS BY USING THE CLI\n\nCollections are a distribution\
    \ format for Ansible content that can include playbooks, roles, modules, and plugins.\n\
    \nYou can install Collections through Ansible Galaxy, through the browser, or\
    \ by using the command line.\n\n#### Prerequisites\n\n- Red Hat Ansible engine\
    \ 2.9 and later is installed.\n- The python3-jmespath package is installed.\n\
    - An inventory file that lists the managed nodes exists.\n\n#### Procedure\n\n\
    - Install the collection via RPM package:\n\n```\n# yum install rhel-system-roles\n\
    ```\n\nAfter the installation is finished, the roles are available as redhat.rhel_system_roles.<role_name>.\
    \ Additionally, you can find the documentation for each role at /usr/share/ansible/collections/ansible_collections/.\n\
    \n#### Verification steps\n\nTo verify that the Collections were installed:\n\
    1. Copy one:\n```bash\ncp /usr/share/ansible/collections/ansible_collections/redhat/rhel_system_roles/.\
    \ /tmp/\n```\n2. Edit the file, replacing \"hosts: all\" with \"hosts: localhost\"\
    .\n3. Run the playbook in check mode:\n```bash\n$ ansible-playbook --check\n```\n\
    The command returns value=0.\n\n### 3.4. INSTALLING COLLECTIONS FROM THE CLI\n\
    \nIf you are using the Automation Hub, you can follow the following steps:\n\n\
    #### Prerequisites\n\n- Red Hat Ansible engine 2.9 and later is installed.\n-\
    \ The python3-jmespath package is installed.\n- An inventory file that lists the\
    \ managed nodes exists.\n\n#### Procedure\n\n1. Install the collection via Galaxy:\n\
    ```\n# ansible-galaxy collection install redhat.rhel_system_roles\n```\nAfter\
    \ the installation is finished, the roles are available as redhat.rhel_system_roles.<role_name>.\
    \ Additionally, you can find the documentation for each role at /usr/share/ansible/collections/ansible_collections/.\n\
    \n#### Verification steps\n\nTo verify that the Collections were installed:\n\
    1. Copy one:\n```bash\ncp /usr/share/ansible/collections/ansible_collections/redhat/rhel_system_roles/.\
    \ /tmp/\n```\n2. Edit the file, replacing \"hosts: all\" with \"hosts: localhost\"\
    .\n3. Run the playbook in check mode:\n```bash\n$ ansible-playbook --check\n```\n\
    The command returns value=0.\n\n### 3.5. APPLYING A LOCAL LOGGING SYSTEM ROLE\
    \ USING COLLECTIONS\n\nFollowing is an example using Collections to prepare and\
    \ apply a logging solution on a set of separate machines.\n\n#### Prerequisites\n\
    \n- A Galaxy collection is installed.\n\n#### Procedure\n\n1. Create a playbook\
    \ that defines the required role:\n   a. Create a new YAML file and open it in\
    \ a text editor, for example:\n```yaml\n# logging-playbook.yml\n```\n   b. Insert\
    \ the following content into the YAML file:\n```yaml\n---\n- name: Deploying basics\
    \ input and implicit files output\nhosts:\n  - all\nroles:\n  - redhat.rhel_system_roles.logging\n\
    vars:\n  logging_inputs:\n    - name: system_input\n      type: basics\n  logging_outputs:\n\
    \    - name: files_output\n      type: files\n  logging_flows:\n    - name: flow1\n\
    \      inputs: [system_input]\n      outputs: [files_output]\n```\n2. Execute\
    \ the playbook on a specific inventory:\n```bash\n# ansible-playbook -i inventory-file\
    \ logging-playbook.yml\n```\nWhere:\n\n- inventory-file is the name of your inventory\
    \ file.\n- logging-playbook.yml is the playbook you use.\n\n#### Verification\
    \ steps\n\n1. Test the syntax of the /etc/rsyslog.conf file:\n```bash\n# rsyslog\
    \ -N 1\nrsyslog: version 8.1911.0-6.el8, config validation run (level 1), master\
    \ config\n/etc/rsyslog.conf\nrsyslog: End of config validation run..\n```\n2.\
    \ Verify that the system sends messages to the log:\n   a. Send a test message:\n\
    ```bash\n# logger test\n```\n   b. View the /var/log/messages log, for example:\n"
  mdcn: "\n\n## 第 2 章.在您的系统中安装 RHEL 系统角色\n\n要使用 RHEL 系统角色，请在您的系统上安装所需的软件包。\n\n前提条件\n\
    \n- 您已拥有 Red Hat Ansible Engine 订阅。请参阅步骤 [如何下载和安装 Red Hat Ansible Engine？](https://www.redhat.com/en/articles/red-hat-ansible-management/how-to-download-and-install-red-hat-ansible-engine)\n\
    \n步骤\n\n1. 在您想要作为控制节点的系统上安装 **rhel-system-roles** 软件包：\n```bash\n# yum install\
    \ rhel-system-roles\n```\n如果您没有 Red Hat Ansible Engine 订阅，可以使用 Red Hat Enterprise\
    \ Linux 订阅附带的受限支持 Red Hat Ansible Engine 版本。在这种情况下，请按照以下步骤操作：\na. 启用 RHEL Ansible\
    \ Engine 存储库：\n```bash\n# subscription-manager refresh\n# subscription-manager\
    \ repos --enable ansible-2-for-rhel-8-x86_64-rpms\n```\nb. 安装 Ansible Engine：\n\
    ```bash\n# yum install ansible\n```\n\n完成后，您将能够创建 Ansible playbook。\n\n额外资源\n\n\
    - [Red Hat Enterprise Linux (RHEL) 系统角色](https://docs.redhat.com/en/red-hat-enterprise-linux/8/)\n\
    - **ansible-playbook** 手页。\n\n## 第 3 章.安装与使用集合 (COLLECTIONS)\n\n### 3.1. ANSI\
    \ Collections 简介\n\nAnsible Collections 是分发、维护和消费自动化的新方式。通过结合 playbook、角色、模块和插件等类型的\
    \ Ansible 内容，您可以从灵活性和扩展性的改进中获益。\n\nAnsible Collections 是 RHEL 系统角色格式的一种可选方案。在\
    \ Ansible Collection 格式中使用 RHEL 系统角色与使用传统的 RHEL 系统角色格式 (FQCN) 是相同的。区别在于 Ansible\
    \ 使用了**全限定集合名称** (fully qualified collection name) 概念，它由命名空间和**集合名称**组成。我们使用的命名空间是\
    \ **redhat**，**集合名称**是 **rhel_system_roles**。因此，虽然内核传统的 RHEL 系统角色格式显示为 *rhel-system-roles.kernel_settings*，但使用集合**全限定集合名称**的内核角色将显示为\
    \ *redhat.rhel_system_roles.kernel_settings*。\n\n**命名空间**和**集合名称**的组合保证了对象的唯一性。它确保了对象可以在不同的\
    \ Ansible Collections 和命名空间之间共享而不会产生冲突。\n\n#### 额外资源\n\n- 您可以通过 Automation Hub\
    \ 访问 Red Hat 集合。\n\n### 3.2. 集合结构\n\nCollections 是 Ansible 内容的包格式。其数据结构如下：\n\n\
    - docs/：集合的本地位置，如果角色提供了文档，则在此处包含示例\n- galaxy.yml：MANIFEST.json 的源数据，该文件将是 Ansible\
    \ Collection 软件包的一部分\n- playbooks/：此目录下包含可用的 playbook\n    - tasks/：此处包含用于 include_tasks/import_tasks\
    \ 任务使用的“任务列表文件”\n- plugins/：所有 Ansible 插件和模块均位于此处，各位于自己的子目录下\n    - modules/：Ansible\
    \ 模块\n    - modules_utils/：开发模块的通用代码\n    - lookup/：查找插件\n    - filter/：Jinja2\
    \ 过滤器插件\n    - connection/：如果不使用默认连接，则需要连接插件\n- roles/：Ansible 角色的目录\n- tests/：集合内容的测试用\n\
    \n### 3.3. 使用 CLI 安装集合\n\nCollections 是 Ansible 内容的一种分发格式，可以包含 playbook、角色、模块和插件。\n\
    \n您可以通过 Ansible Galaxy、浏览器或使用命令行安装 Collections。\n\n#### 前提条件\n\n- 已安装 Red Hat\
    \ Ansible engine 2.9 及更高版本。\n- 已安装 `python3-jmespath` 软件包。\n- 存在一个列出托管节点的清单文件\
    \ (inventory file)。\n\n#### 步骤\n\n- 通过 RPM 软件包安装集合：\n\n```\n# yum install rhel-system-roles\n\
    ```\n\n安装完成后，这些角色将以 redhat.rhel_system_roles.<role_name> 的形式可用。此外，您可以在 /usr/share/ansible/collections/ansible_collections/\
    \ 找到每个角色的文档。\n\n#### 验证步骤\n\n验证 Collections 是否已安装：\n1. 复制一个：\n```bash\ncp /usr/share/ansible/collections/ansible_collections/redhat/rhel_system_roles/.\
    \ /tmp/\n```\n2. 编辑文件，将 \"hosts: all\" 替换为 \"hosts: localhost\"。\n3. 在检查模式 (check\
    \ mode)下运行 playbook：\n```bash\n$ ansible-playbook --check\n```\n命令返回 value=0。\n\
    \n### 3.4. 从 CLI 安装集合\n\n如果您在使用 Automation Hub，可以遵循以下步骤：\n\n#### 前提条件\n\n- 已安装\
    \ Red Hat Ansible engine 2.9 及更高版本。\n- 已安装 `python3-jmespath` 软件包。\n- 存在一个列出托管节点的清单文件。\n\
    \n#### 步骤\n\n1. 通过 Galaxy 安装集合：\n```\n# ansible-galaxy collection install redhat.rhel_system_roles\n\
    ```\n安装完成后，这些角色将以 redhat.rhel_system_roles.<role_name> 的形式可用。此外，您可以在 /usr/share/ansible/collections/ansible_collections/\
    \ 找到每个角色的文档。\n\n#### 验证步骤\n\n验证 Collections 是否已安装：\n1. 复制一个：\n```bash\ncp /usr/share/ansible/collections/ansible_collections/redhat/rhel_system_roles/.\
    \ /tmp/\n```\n2. 编辑文件，将 \"hosts: all\" 替换为 \"hosts: localhost\"。\n3. 在检查模式下运行\
    \ playbook：\n```bash\n$ ansible-playbook --check\n```\n命令返回 value=0。\n\n### 3.5.\
    \ 使用 Collections 应用本地日志系统角色\n\n以下是用 Collections 在一组独立机器上准备并应用日志的示例。\n\n#### 前提条件\n\
    \n- 已安装 Galaxy collection。\n\n#### 步骤\n\n1. 创建定义所需角色的 playbook：\n   a. 创建一个新的\
    \ YAML 文件并用编辑器打开，例如：\n```yaml\n# logging-playbook.yml\n```\n   b. 向 YAML 文件插入以下内容：\n\
    ```yaml\n---\n- name: Deploying basics input and implicit files output\nhosts:\n\
    \  - all\nroles:\n  - redhat.rhel_system_roles.logging\nvars:\n  logging_inputs:\n\
    \    - name: system_input\n      type: basics\n  logging_outputs:\n    - name:\
    \ files_output\n      type: files\n  logging_flows:\n    - name: flow1\n     \
    \ inputs: [system_input]\n      outputs: [files_output]\n```\n2. 在特定的清单上执行 playbook：\n\
    ```bash\n# ansible-playbook -i inventory-file logging-playbook.yml\n```\n其中：\n\
    \n- inventory-file 是您的清单文件名。\n- logging-playbook.yml 是您使用的 playbook。\n\n#### 验证步骤\n\
    \n1. 测试 /etc/rsyslog.conf 文件的语法：\n```bash\n# rsyslog -N 1\nrsyslog: version 8.1911.0-6.el8,\
    \ config validation run (level 1), master config\n/etc/rsyslog.conf\nrsyslog:\
    \ End of config validation run..\n```\n2. 验证系统向日志发送消息：\n   a. 发送一条测试消息：\n```bash\n\
    # logger test\n```\n   b. 查看 /var/log/messages 日志，例如：\n\n"
