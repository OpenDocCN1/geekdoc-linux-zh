    # What''s a TTY?


    You''ll run into the term TTY on your Linux journey, which stands for TeleTypewriter.
    It refers to a physical or virtual terminal you use to interact with Linux. Originally,
    TTYs were physical terminals with a keyboard and screen that sent your commands
    to a remote server.


    On modern systems, TTYs are usually virtual terminals that you access through
    the command line. Each TTY gets an associated device and file located in the /dev
    directory. An example device might be named /dev/tty1.


    Any time you login to Linux via command-line, the system will create a login shell
    process. Multiple TTYs mean that multiple users can be logged in!

    You''ll also see pseudo-TTYs (or PTYs) used for remote logins and terminal emulators.
    PTYs provide a virtual terminal that appears to be connected to a physical TTY
    device.


    # inodes


    Behind the scenes, Linux uses a concept known as inodes or index nodes to store
    metadata about files and directories. In fact, every single file and directory
    on the system is represented by an inode. Inodes contain info on the file permissions,
    owner, size, timestamps and location on the disk. When your filesystem is created,
    space for inodes is also allocated. Inodes are managed by a database based on
    the inode table.


    Inodes are assigned unique numbers when they are created. If a file is deleted,
    the inode id gets recycled and used again. You can view inode numbers by running
    ls -li in any directory.'
