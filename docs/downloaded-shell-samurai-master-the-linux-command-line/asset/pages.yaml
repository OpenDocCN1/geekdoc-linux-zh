- img_proc: true
  md: '# rsync


    rsync is yet another file transfer tool we can use, short for remote synchronization.
    It''s very similar to scp but has a major distinction. rsync will make what''s
    called a diff and only transfer the differences over. If you were making an upload
    got interrupted, you can simply rsync again and the files that didn''t get transferred
    will get copied over. Additionally, rsync can transfer only the parts of files
    that haven''t been transferred yet, making it much quicker and more efficient
    than scp. rsync is often configured in cron as a simple backup solution.


    rsync also uses SSH to transfer files. rsync''s syntax is simple to use and similar
    to scp:


    To transfer local files to a remote server:


    ```

    stetson@linux_rocks# rsync /my_local_directory root@localhost:

    my_remote_directory

    ```


    To transfer remote files to your local system:


    ```

    stetson@linux_rocks# rsync username@remotehost.com:/remote/

    directory /local/directory

    ```


    Well done! This has been a brief overview of a few methods of transferring files
    with Linux tools that are built right into most distributions. Indeed, file backup
    and transfer is an important concept for keeping critical files safe. Learn it,
    live it, love it.'
