  md: '# 4. Black Belt Command Line Skills - Output Redirection, Text and More


    Black Belt Intro


    In this chapter, we will dive deeper into the world of Linux and explore advanced
    topics that will help you become a Shell Samurai. From managing processes and
    services on your system to working with system directories / proc, you will learn
    the ins and outs of how Linux works behind the scenes. We will also cover useful
