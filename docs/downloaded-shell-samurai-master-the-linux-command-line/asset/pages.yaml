- img_proc: true
  md: Linus Torvalds developed Linux in the 90's, 20-something years later. Much of
    Linux's design was inspired by Unix. Linux is even called Unix-like. Linus picked
    up parts of Unix that he thought were helpful and dropped other pieces. Unix systems
    are still developed today and running many production systems.
