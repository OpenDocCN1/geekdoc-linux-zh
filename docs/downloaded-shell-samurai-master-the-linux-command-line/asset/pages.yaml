  md: '# # Who Am I and Why Am I Worth Listening to?


    My name is Stetson Blake. I''m an Entrepreneur and Software Developer from Cincinnati,
    Ohio. I''ve worked in IT for nearly 10 years now -- as a Help Desk Technician,
    Web Developer, Network Engineer, Software Developer, Site Reliability Engineer,
    Cloud Engineer and DevOps Engineer. I currently work as a Software Engineer for
    Planet Labs, who designs, builds and operates a fleet of satellites that image
    the earth every day from low-earth orbit. I''ve previously worked for startups,
    an ISP, a utilities company and a university in various roles.


    I''ve been working with Linux my entire career. I want to teach you about Linux
    because I think it''s one of the most important concepts to know as an IT professional
    today. Every single industry is impacted by Linux. Most web servers run Linux.
    As a Network Engineer, firewalls, routers and switches run Linux. As an SME, the
    production servers I''m on-call for require me to know Linux to troubleshoot and
    bring them back up. As an entrepreneur, the servers I maintain for side projects
    run Linux and code written in Ruby on Rails.


    Especially today, remote work is ubiquitous and cloud computing is becoming standard,
    knowing the foundations of Linux can really help in a huge way for an aspiring
    professional!


    This book is a compilation of the knowledge I''ve built up over the years from
    other books, blog posts, and my own learnings and experiences. Shell Samurai is
    the knowledge I wish I could time travel and give to myself. I can''t time travel,
    so I''m doing the next best and giving you this knowledge.


    # ## You Should Learn Linux


    Learning how Linux works and how to use it effectively is an essential skill for
    anyone interested in an Information Technology career. Linux is the most widely
    used Server operating system. The entire world runs on Linux! From cell'
