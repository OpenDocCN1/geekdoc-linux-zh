    built-in to Linux. It''s available on nearly every system by default. Cron is
    not a command, but a system-managed process and daemon that runs in the background
    to schedule tasks.


    Cron allows administrators to define schedules and tasks in a file known as "cron
    job".

    As example, a cron job might do any of the following.


    +   - Email users every week with a report of their usage of a Software license

    - Backup a database every night at midnight

    - Delete old log entries every Wednesday at 12 PM UTC

    - Send a report of the system''s memory and disk-usage every single minute to
    a monitoring service


    As you can see above, cron jobs always define a schedule and a task to perform.
    The Cron table, or crontab is a configuration file that defines each cron job.
    Crontab files are created for each user. Cron jobs will run with the same permissions
    of the user that created them.


    ```

