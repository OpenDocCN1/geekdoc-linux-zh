  md: 'for executable files any time a shell command is entered. The order of directories
    is the order that bash will look for the command that you want to run. Each path
    is separated by a colon. You might update your PATH if you download a program
    and it''s installed in a non-standard location on your system. An indicator that
    you might need to update PATH is if bash returns a command not found error.


    # whereis and which


    Let us specify directories we''d like bash to search for executable commands.
    However, if we want to know what path a command or executable is being called
    from? We might update our path to the location of a new program, but how will
    we know that our shell called the proper executable and not an one in another
    location?


    I''m glad you asked! We can use the which command to show which executable is
    associated with a given command! It searches through the directories listed in
    the PATH environment variable we just looked at and finds the first occurrence
    of the command.


    We can also use the whereis command to determine the path of a binary program.
    The difference is that whereis shows us the path of the command we''re looking
    for, while whereis shows us all possible paths that are evaluated and searched,
    along with the man pages and source files.


    Go ahead and try the which and whereis commands now for a few common commands
    like ls, cat, and others you learned:


    ```

    stetson@linux_rocks:$ which python3

    /usr/bin/python3

    stson@linux_rocks:$ which ls

    /usr/bin/ls

    stetson@linux_rocks:$ which cat

    /usr/bin/cat

    ```


    ```

    stetson@linux_rocks:$ whereis python3

    python3:/usr/bin/python3.8 /usr/bin/python3 /etc/python3 /usr/local/lib/python3.8
    / /usr/lib/python3 /etc/python3.8 /

    ```'
