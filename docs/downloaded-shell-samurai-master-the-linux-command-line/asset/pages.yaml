  md: '# 5. The Network


    The Network

    Linux and computing in general would be practically useless if we couldn''t make
    computers talk to each other. Linux provides a robust system for managing network
    connections and configuring the network. Understanding Linux networking is essential
    for optimizing network performance, and troubleshooting connectivity issues.


    # A Brief Overview of the OSI Model


    In order to think about networks, an understanding of the OSI or Open Systems
    Interconnection model is helpful! The OSI model describes how computers talk and
    is a model that splits networking into 7 layers:


    +   * Application - layer at which applications interact with the network

    * Presentation - Data encryption occurs here as well as making data is in a usable
    format

    * Session - Maintains connections, responsible for ports and sessions

    * Transport - Transmits data with transmission protocols like TCP and UDP

    * Network - Decides which path the data will take based on IP addresses

    * Datalink - Defines format of data on network, usually associated with MAC addresses

    * Physical - Transmits raw bits over a physical medium. Think of electric passing
    over a wire or light passing through a fiber optic.


    Learning the OSI model can be difficult. There are many mnemonics used to remember
    it. The one I used is too few to mention in this book, but I recommend All People
    Seem to Need Data Processing for remembering the layers.


    > Hot Tip When working with other systems administrators, you’ll hear the OSI
    model referenced from time-to-time. For example: “That sounds like a layer 8 issue
    to me” is used jokingly to imply that there is user error. Layer 8 doesn’t'
  merge: -1
  pgno: 183
- img_proc: true
  md: "really exist on OSI model. Also, network devices are often thought of as either\
    \ Layer 3 devices like routers or Layer 2 devices, like switches. Routers work\
    \ on the network layer because they make intelligent decisions about where to\
    \ send packets based on IP addresses, which are a layer 3 concept.\n\nSwitches\
    \ on the other hand, are a layer 2 device. They are usually quicker than routers\
    \ because they don't make decisions on where to send packets based IP addresses,\
    \ but rather based on MAC addresses. MAC addresses are a physical id that is burned\
    \ into a network interface. Switches keep a local database the ARP table (Address\
    \ Resolution Protocol) which maps IP address and MAC address to an interface.\
    \ Switches forward packets rather than route them based on the destination MAC\
    \ address.\n\n# Interfaces and IPs\n\nTo see which devices Linux system has, we\
    \ can use the ifconfig command or interface configuration:\n\n```\nroot@linux_rocks:#\
    \ ifconfig\neth0: flags=4163<UP,BROADCAST,RUNNING,MULTICAST> mtu 1500\n      \
    \ inet 172.17.0.2 netmask 255.255.0.0 broadcast\n172.17.255.255\n       ether\
    \ 02:42:ac:11:00:02 txqueuelen 0 (Ethernet)\n       RX packets 24273 bytes 3576327\
    \ (35.7 MB)\n       RX errors 0 dropped overflows 0 frame 0\n       TX packets\
    \ 9121 bytes 509036 (509.0 KB)\n       TX errors 0 dropped overflows 0 carrier\
    \ 0 collisions 0\n```\n\n```\nlo: flags=73<UP,LOOPBACK,RUNNING> mtu 65536\n  \
    \     inet 127.0.0.1 netmask 255.255.0.0\n       loop txqueuelen 1000 (Local Loopback)\n\
    \       RX packets 0 bytes (0.0 B)\n       RX errors 0 dropped overflows 0 frame\
    \ 0\n       TX packets 0 bytes (0.0 B)\n       TX errors 0 dropped overflows 0\
    \ carrier 0 collisions 0\n```\n\nYou'll see that the command gives statistics\
    \ for each interface on the system. First, eth0, and then lo or loop. In addition\
    \ to the IP address and subnet configurations we'd expect, we can see other statistics\
    \ about the interface like it's mac address (ether 02:42:ac:11:00:02), received\
    \ packets count, transmitted"
