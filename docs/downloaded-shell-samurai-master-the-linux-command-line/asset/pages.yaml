    # Hard links


    Hard links are similar to symlinks, but not the same thing. Whereas a symlink
    points to the path name of a file, a hard link points to the same physical data
    on disk as the original file. It uses an inode to that. Let''s create a hard link
    now. We still use the ln command, but we don''t provide the -s flag.


    Below, I create a hard link at /tmp/shell_samurais.txt pointing to ~/my_first_hard_link:


    ```

    stetson@linux_rocks:$ ln ln /tmp/shell_samurais.txt

    my_first_hard_link

    ```


    You should also know the difference between how a symlink or hardlink behaves
    when the file being pointed to is deleted. A symlink will not work any longer.
    If you try to cat the contents, Linux will complain that the file doesn''t exist.
    A hard link will still show the data, since it''s pointing to the physical data
    on disk. The only way to delete the data completely is to remove the original
    file and all links to it. Observe what happens when we delete /tmp/shell_samurais.txt:


    ```

    stetson@linux_rocks:$ rm /tmp/shell_samurais.txt

    ```'
