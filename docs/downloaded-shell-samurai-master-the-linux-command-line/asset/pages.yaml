  md: 'error (stderr). Other numbers represent additional open files or resources.


    +   - DEVICE: The device number for the file resource.


    +   - SIZE/OFF: The file size or offset.


    +   - NODE: The inode number.


    +   - NAME: The name or path of the file or resource.


    In this output, you can see that the vim process has several file descriptors:


    +   - cwd and rtd: The current working directory and the root directory of the
    process, both pointing to the root directory /.


    +   - txt: The executable (text) file associated with the process, located at
    /usr/bin/vim.basic.


    +   - Multiple mem entries: These represent memory-mapped files, such as shared
    libraries and the executable itself, loaded into the process''s address space.


    +   - 0u, 1u, and 2u: Standard input (stdin), standard output (stdout), and standard
    error (stderr), respectively. They are all connected to the same character device,
    /dev/pts/2, which is a pseudo-terminal.


    +   - 3u: An additional file descriptor pointing to a regular file /.myfile.swp.
    This is likely a swap file created by vim to store changes made to a file (.myfile)
    during an editing session.


    # More about File Descriptors


    When a process opens a file or creates a new I/O object, the operating system''s
    kernel assigns a file descriptor to represent that particular resource. The file
    descriptor allows the process to read, write, or perform other operations on the
    associated resource.We use the lsof or List Open Files to look at a process''s
    open files.


    File descriptors make it easier for programs to interact with I/O objects by abstracting
    underlying details. When a program needs to perform an operation on an open file
    or socket, it can simply refer to the associated file descriptor. The'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'operating system then translates the file descriptor into the appropriate internal
    data structures to carry out the requested operation.


    # /proc directory


    /proc Once again, in Linux, everything is a file, even processes! Information
    about processes is stored in a special directory (also called a virtual filesystem)
    under the root directory (/) called /proc. Try listing the contents of /proc now:


    ```

    stetsonlinux_rocks:~$ ls -l /proc

    total 0

    dr-xr-xr-x 9 root               0 Dec

    30 00:38 1

    dr-xr-xr-x 9 root               0 Mar

    2 00:27 10

    dr-xr-xr-x 9 root               0 Mar

    2 00:27 1025510

    dr-xr-xr-x 9 root               0 Mar

    2 00:27 105

    dr-xr-xr-x 9 root               0 Mar

    2 00:27 108

    dr-xr-xr-x 9 root               0 Mar

    2 00:27 109

    dr-xr-xr-x 9 root               0 Mar

    2 00:27 11

    ```


    You’ll see a ton of output and you should also see a directory for every process
    that you’d see with the ps command.


    The /proc directory contains a set of files and directories, with each directory
    usually named after a running process''s ID. These directories contain files that
    represent different components of the process''s state, such as memory usage,
    file descriptors, command line arguments, and more.'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'Some common files and directories found in /proc include:


    +   * /proc/cpuinfo: Shows information about the CPU, such as its model, vendor,
    and features.

    * /proc/meminfo: Provides details about the system''s memory usage, including
    total memory, free memory, and memory used by buffers and caches.

    * /proc/mounts: Lists all currently mounted file systems and their mount options.

    * /proc/uptime: Displays the system''s uptime in seconds

    * /proc/version: Contains information about the kernel version, compiler used
    to build it, and the operating system''s release.


    Let''s go deeper and look at a single processes'' status file in /proc. Type cat
