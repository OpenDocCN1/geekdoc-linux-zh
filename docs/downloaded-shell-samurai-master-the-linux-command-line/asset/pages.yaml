    # Tmux - Secret Background Windows


    tmux or Terminal Multiplexer is a piece of software used to manage terminal sessions.
    In addition, it can spin up long-standing terminals in the background of the Linux
    operating system that can be saved and recalled later. Tmux cancame is handy when
    you are working on a Linux system remotely via SSH and need to keep a session
    open and to come back to later.'
  merge: -1
  pgno: 165
- img_proc: true
  md: 'The name terminal multiplexer gives a hint to its usage. From one shell window,
    we can arrange multiple windows or panes. Each of these windows is opened in a
    session. We can save those sessions for later by de-taching from the window and
    later re-attaching and pick our work back up again. This will all make sense soon,
    so let''s get started with tmux!


    First, install tmux with apt-get install tmux. Then, simply run the tmux command.
    You''ll immediately see a “status bar” at the bottom of your screen, but otherwise,
    your terminal should look the same. There are some other components in the status
    bar like the date as well. You can even customize the status bar further, but
    let’s keep it simple for now.


    ![](img/368b2a05101953edc8b0734547e5066c_166_0.png)


    Tmux starts off with a single window and a single pane. Tmux uses the concept
    of a prefix key and a command key. By default, the prefix key is Control+b. This
    is often denoted as C–b in documentation for tmux. Press Control+b now.'
