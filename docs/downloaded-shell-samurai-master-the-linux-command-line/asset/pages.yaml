  md: '# # 1. Setting Up a Lab Environment


    # ## Lab Setup Intro


    This book is one that I want you to be able to follow along with, reference and
    use to learn Linux fundamentals more deeply. To assist with that goal, I strongly
    recommend us setting up a “Lab Server” to follow along with the commands we''ll
    give. Without a real working Linux system, you''re just kinda reading words and
    hallucinating what a system should behave like. You need to use a real shell and
    feel a little bit of pain and struggle, but then success and mastery. Real lab
    experience like this is your friend.


    I also recommend not using the GUI. Yes, it is a little bit harder to use a CLI,
    but it is much quicker and more production Linux systems you will not offer a
    GUI. If you decide to install Linux on an old computer or laptop that has a Windows
    manager, you''ll just need to use the terminal program to follow along with the
    examples.


    Depending on what computers you have access to, there''s a few options for getting
    a Linux shell at your disposal. We won''t go deep on every one of these options,
    but we''ll guide you towards victory. A Linux Samurai has to do some homework
    of their own, after all.


    # ## Install Linux on an old Laptop or Desktop computer


    Installing Linux on an old system is a great option to get started using Linux.
    Installing Linux and using it as your daily driver is a great way to dive into
    the deep end. Just be cautious as many newbies install Linux on their “main computer”
    and then break things beyond repair. This isn''t a big deal because you can simply
    reinstall and the only cost is your time. If you go this route, be sure to install
    Linux on a machine that isn''t your primary computer.


    If you decide to take this path, use Ubuntu Desktop available at Ubuntu.com. Grab
    the latest version, which is currently 22.04.2 LTS. The LTS references Long Time
    Support and means that this edition will be supported for a few years.'
  merge: -1
  pgno: 19
