    # Using Git and Version Control


    While Git is not in-scope to understanding Linux, I think you should be aware
    of it because you might need to use Git in your career at some point.


    Working with code and configuration files on your local system is great, but what
    happens when you want to work with others? How can you modify web page, configuration
    files and source code colaboratively? Should you zip up your code and email it
    to your coworker for them to make their changes? USB drives? Dropbox or Google
    Drive? Keep your code on a shared drive and just modify it? What happens when
    a change is made that completely breaks your application? What would happen if
    two developers made a change to the same file?


    Before Version Control, these were very real problems that developers and systems
    administrators had to grapple with. Today, we don''t need to worry about these
    problems because a solution has been built for it. Version control allows team
    members to collaboratively work on code, keeping a running log of changes that
    were made, access different versions, and a lot more.


    Git is the most common and widely used version control system. In this section,
    we''ll make our own Git repo, commit some code to it and start to understand basic
    concepts about Git.


    # An Overview of Git


    In addition to developing the Linux kernel, Linus Torvalds also developed Git
    in 2005 for helping with development on Linux! Git, the software, is open-source.
    You may have heard that Microsoft acquired Github and assume this means they got
    git too. Github is simply a Git hosting platform. There are other git hosting
    platforms, like GitLab and Bitbucket. You don''t have to host code on Github.


    Git, the software, is a distributed version control system. This means that every
    developer keeps a complete copy of the codebase on their local machine. They don''t
    need to be connected to a file share or central server to make changes or'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'contributions to code.


    Git has a concept of branching and merging, which allows developers to make isolated
    changes to the codebase to add new features or bug fixes. Then, they merge their
    code back into the main or master codebase.


    Every single change that is made to the codebase is logged and tracked over time.
    If anything goes wrong or you want to see the history of a piece of code, Git
    makes it easy to do.


    # Core Git Concepts


    Before we go further, we''ll define a few terms necessary for understanding git.


    A repository is a central storage area where all the code and files in a codebase
    live. Developers save work here, collaborate with others and track their changes.


    Changes made to the codebase are given as commits. A commit is like a snapshot
    of the codebase at a certain time along with a short message describing the change.
    Commits are given unique ids that can be referenced.


    Branches are how developers work on different versions of the codebase. A developer
    will create a new branch, make changes and then later ask for review on their
    code from others and finally merge their code into the main or master branch.


    # Getting started with Git and Github


    Let''s try git out for ourselves. First, install git on your system with apt-get
    install git.


    Next, sign up for Github.com in your browser. Github has changed their onboarding
    and sign up a lot, but the product remains totally free.


    Once you''ve signed up for Github, you''ll be dumped right into GitHub''s homepage
    and see a big green button called “Create repository”. Go ahead and click it now:'
