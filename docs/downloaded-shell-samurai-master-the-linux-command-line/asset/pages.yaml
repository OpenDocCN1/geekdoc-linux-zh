    # troubleshooting low disk


    How would you troubleshoot low disk space?


    If you''re running out of disk space, you''re probably going to notice it quickly.
    As servers and applications run low on disk space, they start to show weird symptoms
    like slow response-times, error messages or other indicators that there might
    be an issue.


    How can we confirm that our system is low and remedy the situation? The df or
    Disk Free command is our friend! Df will allow us to determine how much disk is
    being used on our system. You should commit to memory df -h, which tells df to
    display disk usage information for all files systems in a human-readable format.


    Let''s try it out:


    ```

    root@broken-waterfall-4525:~# df -h

    Filesystem Size Used Avail Use Mounted on

    tmpfs 234M 1.7M 45M 4% /

    /dev/vda1 9.6G 9.5G 6.9M 100% /

    tmpfs 234M 1.1M 233M 1% /dev/shm

    tmpfs 5.0M 0 5.0M 0% /run/lock

    /dev/vda15 105M 5.3M 100M 5% /boot/efi

    ```'
  merge: -1
  pgno: 175
- img_proc: true
  md: '```

    tmpfs 47M 4.0K 47M 1% /run/user/0

    tmpfs 47M 4.0K 47M 1% /run/user/1000

    ```


    Looking over the summary from df, we can see that this system has a few disks./dev/vda15
    is mounted on /boot/efi so it''s used as part of the boot process. we can ignore
    the tmpfs lines because they are temporary storage created in memory. /dev/vda1
    looks interesting...


    Looking at the Avail column, it has only 6.9M of disk free. The Use% column shows
    100% as well, which could certainly get us into some trouble! Let''s see if we
    find out what''s going on.


    There''s to be some files somewhere that are getting larger and causing this issue.
    After all, our server worked previously, so what changed? Let''s try to track
    those files down!


    We''ll use a similar command to df called du usage. We can use -h on common directories
    where we might expect large files to gather like /var/log. The h flag tells du
    to make the output human readable.

    Let''s run -h on our /var/log directory now:


    ```

    root@broken-waterfall-4525:/var/log du -h /var/log

    4.0K /var/log/landscape

    1.2G /var/log/journal/278483eb55e3c7011468e370639f28de

    17M /var/log/journal

    4.0K /var/log/private

    4.0K /var/log/dist-upgrade

    4.0K /var/log/caddy

    104K /var/log/apt

    48K /var/log/unattended-grades

    4.0K /var/log/sysstat

    105M /var/log/postgresql

    1.3G /var/log

    ```


    There''s quite a few files here, but the /var/log/journal/278483eb55e3c7011468e370639f28de
    should jump out! Look at its size!


    If this directory contains many files and directories, we might want to sort it
    to be a little more readable. For that, we can do -h /var/log | sort -rh . Sort
    uses the h flag to treat the input as “human-readable” sizes. For'
  merge: -1
  pgno: 176
