  md: '# Text Editing Like a Boss with Vim


    The age-old debate between Vim and Emacs continues to divide text editor enthusiasts.
    Both have been around for years, offering rapid editing speed and extensive customization
    options. Advocates for each editor often passionately argue for their preferred
    choice, leading to heated online debates.


    That said, the choice is yours. Explore all your options and weigh what works
    best for you. For now, let''s focus on learning Vim, our recommended text editor
    for Shell Samurai users.


    # What is Vim?


    Vim is a popular text editor and builds upon the VI text editor, which stands
    for Visual. Vim is "VI Improved" and it probably comes installed with your system
    already. If not, we can install it with our trusty friend, apt-get vim


    Vim has a notorious reputation for being difficult to learn and even harder to
    exit. It has become so much of a meme that exiting Vim is a popular joke around
    how hard it is to get out of Vim and back to the command line!


    Despite Vim''s learning curve, I think that it is worth learning since it can
    edit text files more quickly and efficiently. Don''t feel like you need to learn
    Vim all at once. Our goal in Shell Samurai is to get you to the bare minimum proficiency
    and then guide you to learn more on your own time, as needed. We''ll provide some
    resources at the end of this section that should help to take your Vim journey
    to the next level. With that, let''s dive into Vim.'
