  md: '```

    stetson@linux_rocks:~$ uname -r

    5.15.0-56-generic

    ```


    There are many kernel versions because the Linux kernel is open-source, we can
    inspect the kernel source code, modify it and run it on our systems. We won''t
    dive that deep in this course, but know that it''s something you could do. For
    more info on the Linux kernel, check out Kernel.org


    # Kernel Space vs User Space


    The Linux system is abstracted into 2 distinct layers: User Mode and Kernel Mode.
    These are sometimes also called User Space and Kernel Space.

    When we refer to user space, we''re talking about parts of the operating system
    dedicated to running user-level programs and applications. This area is separate
    from kernel-space, which handles system-level operations that interact directly
    with the hardware. This separation of concerns keeps Linux modular and secure.
    If your machine were infected with malware, you wouldn''t want to have all of
    the permissions that Kernel mode has. Direct access to hardware, memory and CPU
    would be a nightmare if it fell into the wrong hands!


    User Space and Kernel Space are sometimes called privilege levels or protection
    rings. There are 4 “rings” where the Kernel, Device Drivers occupy rings 0, 1
    and 2. Applications running in User Space run in the least privileged, outer-most
    layer, ring 3. This keeps Linux secure so that programs can''t directly interact
    with the system.


    However, we know that some programs definitely interact with our hardware and
    inner workings of the system. So how do they do it? They use a system call! We''ll
    cover system calls shortly.


    Hot Tip: You''ll sometimes also hear user space referred to as userland.


    # Interrupts


    An interrupt is a signal sent by hardware or software to the kernel indicating'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'that immediate attention is needed. Interrupts, like real life, call attention
    to something and STOP the current execution of whatever else is going on.


    A simple example of a hardware interrupt is input from a device like your keyboard
    or mouse. Any time you type a key, the kernel suspends operation, saves its state
    and executes an interrupt handler or code for the device driver associated with
    your keyboard. Once the signal is handled, typically output a character to your
    screen, control is returned back to the kernel.


    # What is a System Call?


    System calls are a type of software interrupt.


    We mentioned earlier that user space programs are able to use system calls to
    elevate their privileges or access system resources. For example, if a program
    needs to access your webcam, it needs to go through the kernel first. To do so,
    it must use a system call to ask the kernel to do its bidding.


    A system call is an interface between software and the Linux kernel. If you open
    a file, the open syscall is invoked, then the read and write syscalls. If you''re
    running a web server, the connect, send and recv system calls are used for connecting
    to clients, sending data and receiving data. System calls are constantly used
    by programs to connect to other servers, backup files, write logs, interact with
    the network and much more. Programs can''t do these tasks on their own, so they
    use system calls to ask the kernel to do these processes for them.


    # How does a system call work?


    When a system call is made by a program, the program asks the kernel to perform
    that task. The process passes execution and passes the task to the kernel. In
    kernel mode, the system call is performed. Once the call is finished, the kernel
    passes control back to the user level process that makes the system call.


    A few more common syscalls:


    +   * fork() - Duplicates an existing process and creates a new one

    * exec() - Replace the current process with a new one

    * read() - reads data from a file descriptor'
