    Let''s break down the output:


    +   - COMMAND: The command (or program) associated with the process, in this case,
    vim.

    - PID: The process ID, which is 31449 in this example.

    - USER: The user who owns the process, in this case, root.

    - FD: The file descriptor (FD) number. Standard file descriptors are: 0 for standard
    output (stdin), and 2 for standard'
