  md: '+   - write() - writes data to a file descriptor


    If system calls don''t quite sense right now, don''t worry. Just know that they
    are a process that happens behind the scenes to help programs do their job. This
    is a pretty advanced concept for this in the book, but I feel I''d be doing you
    a diservice if I didn''t introduce system calls!


    # # Signals


    Signals are a king of software interrupt. A signal is a way that processes communicate
    with each other (sometimes called interprocess-communication) and the operating
    system. We can even send our signals to processes the command-line! A signals
    might be sent for lots of different reasons, like the completion of a piece of
    code or asking a process to shutdown and terminate itself.


    # # How do Signals Work?


    Signals are first delivered to processes and the process decides what to do with
    it. The process has few different ways it could deal with the signal. It could
    ignore it. It could “catch” the signal with a handler or function and then perform
    some other code. The process could also be forced to terminate without ever being
    able to make a decision on how to handle the signal, in the case of SIGKILL signal.


    Signals are represented by a number along with an all-caps name. Below are few
    of the most common Signal types:


    +   - SIGHUP or 1: Hangup - Used to notify a process that the controlling terminal
    has disconnected.


    +   - SIGINT or 2: Interrupt — Occurs when a user presses Ctrl+C together or is
    called after another process or event


    +   - SIGKILL or KILL or 9: Used to immediately terminate the process with no
    chance to cleanup and release resources, memory and cpu.


    +   - SIGSEGV or 11: Segmentation Fault - An Error caused by a program'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'accessing memory it isn’t allowed to.


    +   - SIGTERM or 15: Software Termination. Gracefully terminate a process and
    give it a chance to cleanup.


    +   - SIGSTOP: Suspend execution until a SIGCONT is received


    +   - SIGCONT: Tells a process to continue execution


    These are just a few examples of Signals and their names, Linux currently implements
    about 30 total.


    I mentioned that we can also send our own signals to processes. We do this with
    the kill command. By default, you can use the kill command and pass it a process
    ID to send a SIGKILL signal. This is a very useful command for “runaway processes”
    or processes that you’ve tried to shut down and won’t stop when we’ve asked nicely.


    If you’d like to send a signal to a process of a certain type, you can specify
    it in the kill command as it’s Signal number. Eg:


    ```

    $ kill -9 <process_id>

    ```


    The above command sends the SIGKILL signal, so the command is the same as issuing
    kill <process_id>. You could instead specify signal ids 1, 2, 11 or any of the
    others as a flag.


    Hot Tip: 💡 If you ever run some process that’s running on your terminal to immediately
    stop in Linux, you can hit Control+C on your keyboard to send a SIGINT or Signal
    Interrupt. This requests that the current process stop. If you have a script that
    is taking too long to run or you entered a command you didn’t mean to run, try
    hitting Control+C to stop execution and return control to the shell.'
