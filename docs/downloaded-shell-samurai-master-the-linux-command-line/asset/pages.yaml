  md: 'lsof allows us to retrieve information about open files by accessing the kernel''s
    internal file table. We can see details like the process id, user id, file descriptor,
    file type, device numbers and more. This makes it an invaluable tool for troubleshooting
    problems related to file access, network connections, and resource management.


