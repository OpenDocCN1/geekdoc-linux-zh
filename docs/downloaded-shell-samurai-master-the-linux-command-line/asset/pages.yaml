    # Users, Groups, Root and Sudo


    Like most modern operating systems, Linux is a multi-user operating system. It
    was designed this way from the beginning and that functionality has some impact
    on the way it works. In Linux, files, directories and even processes are all owned
    by a user and group. Many background processes or daemons run in the background
    and are assigned to various users and groups. Linux uses User IDs and Group IDs
    to keep track of all of these permissions.


    To see your user id and group id, simply issue the id command:


    ```

