    4.0K /var/log/sysstat

    4.0K /var/log/private

    4.0K /var/log/landscape

    4.0K /var/log/dist-upgrade

    4.0K /var/log/caddy

    ```


    Now we''ve found our culprit, we have a few options to deal with it:


    +   - Delete the file

    - Check log rotate settings or journal settings

    - Make the disk bigger


    If you encounter a situation like this in the real world, you should do all of
    it. First deleting the file, after confirming it isn''t needed. Obviously don''t
    go deleting files that may be critical to the system. This is just a log file,
    so it''s probably ok to delete. In certain situations, logs might have to be kept
    for audit purposes, so use your common sense. Also, the logs could contain other
    details that might help us diagnose further issues.


    Assuming the low disk is causing our server to not function, it''s helpful to
    "stop the bleeding" and remove the log files immediately, putting the server back
    into normal operation.


    We could just delete the directories with rm, but we''ll use sudo journalctl --vacuum-size=100M.
    This command will clear all logs older than the specified size (in this example,
    100 MB). You can adjust the size as needed to'
  merge: -1
  pgno: 177
