  md: '# # What is a Shell Samurai?


    A Shell Samurai has an intuitive understanding of the CLI and Linux fundamentals.
    They can navigate the Command Line and configure the Linux OS to do their bidding.
    A Shell Samurai tells computers what to do, not the other way around.


    A Shell Samurai does not know everything and never claims to. They are resourceful,
    creative and modest. When an issue pops up that they can’t solve, they’re able
