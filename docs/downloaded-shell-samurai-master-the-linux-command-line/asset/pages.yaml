    # Swap Space


    Swap space is not a unique topic to Linux, but it is fundamental to understand
    operating systems in general and Linux is no different! Swap space on a hard disk
    that can be substituted for physical memory or RAM. It''s a kind of “overflow”
    for RAM. When RAM runs out of space, swap space is used instead.


    It''s generally not considered a good thing if your system is frequently using
    swap space rather than RAM. Hard disk storage is much slower to access than RAM,
    so if our system is using it all the time, it''s going to operate more slowly!


    You can use the swap command to show where your swap space is currently configured
    and the configured size:


    ```

