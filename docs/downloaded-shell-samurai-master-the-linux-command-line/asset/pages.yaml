  md: 'packets, errors and other statistics. You might also see an interface wlan0,
    which is a wireless interface.


    The loopback address on the bottom at 127.0.0.1 is a special kind of IP typically
    used for testing and ensuring that the network stack works on the system. The
    loopback address is only reachable locally and cannot be reached from outside
    the system.


    # The Routing Table


    Networks route packets based on a routing table. Huge routers in datacenters make
    decisions about how to get network data to their destination based on a routing
    table. They look at the destination IP address of a packet and perform a lookup
    in their local routing table to decide where to send the packet. Linux hosts work
    the same way.


    View your local routing table with ip route:


    ```

    root@linux_rocks:~# ip route

    default via 127.17.0.1 dev eth0

    172.17.0.0/16 dev eth0 proto kernel scope src 172.17.0.2

    ```


    The routing table is pretty simple by default. We see 2 entries, first a default
    route which says any packet that doesn''t match other entries will be routed to
    172.17.0.1. The device used to send those packets is eth0.


    Second, there is an entry that defines the local network, 172.17.0.0/16. This
    rules means that the host can reach the subnet directly from its eth0 interface.


    Another way to display routes is via the route -n command. This method is a little
    older and generally ip route is used, but route -n is still supported. The output
    we get from route -n is largely the same:


    ```

    root@linux_rocks:~# route -n

    Kernel IP routing table

    Destination     Gateway         Genmask Flags Metric Ref

    Use Iface

    0.0.0.0         172.17.0.1      0.0.0.0       UG 0 0

    eth0            172.17.0.0      0.0.0.0      255.255.0.0   U 0 0

    ```'
