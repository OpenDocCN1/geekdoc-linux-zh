  md: '# How does Linux Boot?


    Every operating system has a boot process. Linux is no different. In this section,
    we''ll go over the basics of the boot process and explain each component.

    There''s a ton of processes happening between powering up a Linux system and when
    it finally gets to a blank prompt. The boot process can be explained very simply,
    we''ll go deeper.


    Here’s summary:


    +   - A BIOS or UEFI boot firmware runs a bootloader

    - The bootloader finds the kernel image from the disk, loads it into memory or
    RAM and starts it with kernel parameters

    - The kernel initializes hardware devices and drivers needed to talk to its devices
    and mounts the root filesystem.

    - The kernel next starts a process called init and gives it a process ID of 1.
    On newer systems, this is now replaced by systemd

    - Init begins up the rest of the system processes needed like networking services,
    web daemons and logging services.

    - Init finally allows you to join near the end of the boot sequence


    # Linux Boot Process - BIOS and UEFI


    In order to understand the Linux boot process further, we should familiarize ourselves
    with BIOS and UEFI and the differences between the two systems.


    # BIOS


    BIOS stands for Basic Input/Output System. BIOS is a firmware used in the boot
    procedure to find the bootloader among some other secondary system functions like
    changing boot disk order and network settings. BIOS firmware is stored on an EPROM
    chip, which allows for firmware updates from the manufacturer.


    Once BIOS boots up, its goal is to search for the Master Boot Record (MBR) and
    execute it. The MBR contains the primary boot-loader in the first 512-bytes of'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'the disk.


    # UEFI


    UEFI or Unified Extensible Firmware Interface is newer and has the same goal of
    starting the system as BIOS does. However, UEFI stores the initialization data
    in a .efi file, rather than storing it on the firmware. This .efi file is stored
    on the disk of the system on a partition called the UEFI System Partition, alongside
    the bootloader. The GUID Partition Table (GPT) format is used in UEFI systems.
    UEFI was developed to improve on some of the shortcomings of BIOS, such


    as:


    +   - Faster Boot Time

    - Larger Disk Size support: BIOS supports 2.2 TB, while UEFI supports zettabytes
    (huge!) As of today...

    - Secure Boot - UEFI can utilize the Secure Boot feature to require that boot
    loaders are digitally signed, preventing malware from being loaded on the system.


    Today, UEFI is the standard and BIOS has become archaic and dated.


    # The Bootloader


    Once BIOS or UEFI has found the bootloader and executed it, the bootloader takes
    over. The bootloader''s main goal is to start the Linux kernel. It does this by
    finding the kernel, loading it into memory and passing in any kernel parameters
    that may be needed.


    During this process, the kernel has still not been loaded, so accessing the disk
    must be done via slower device drivers than the one system uses once it''s booted.


    The most common and ubiquitous Bootloader is GNU GRUB or GRand Unified Bootloader.
    There are also other Linux bootloaders like LILO (Linux Loader), BURG, Syslinux
    and core boot. These bootloaders were developed to be faster, simpler or have
    different features than GRUB.'
