  md: '# # Interview Questions and Scenarios


    Although this book is primarily a technical one focused on configurations and
    kernels and other pieces of the Linux operating system, people do happen to be
    a big part of that system! This section offers some advice and guidance on interview
    questions I''ve encountered in the real-world. The first few sections are about
    conversational style interviews and the Common Linux Interview questions section
    are cut and dry questions about pieces of Linux os.


    # ## Scenario Based Questions


    One type of interview that''s becoming popular are “real-world” scenarios or labs
    that model a problem you might run into on the job. Recently, I had an interviewer
    that had setup a Linux system in the browser and had share my screen while I worked
    on the system. The root issue ended up being that the disk was filling up with
    log files and I had to find a rogue process, kill it and modify it that the disk
    space didn''t fill up all the way.


    In these types of interviews, I find it''s best to talk about and narrate my thought
    process and the actions I''ll be taking. For example, “Ok, so the disk is filling
    up, I want to find which files are the biggest so I''ll navigate to /var/log and
    list the files and their sizes.\ “Now I''ll look for the logging process with
    ps”. It feels really strange at first, but narrating like this can help the interviewer
    to understand your thought process and guide you in the right direction. Contrary
    to popular belief, good interviews will help you succeed.


    # ## Quiz Type Questions or Discussion Questions


    Another type of question are standard questions like — “How can I find a file?


    There’s also definitely a difference between abstract trivia questions and'
  merge: -1
  pgno: 222
- img_proc: true
  md: 'questions like “Describe how the Linux boot process works”. When interviewers

    blindly toss questions at you that are abstract, it’s usually a red flag for me.


    # Situational Discussion Interview Questions


    One of the most common interview questions I’ve gotten formatted as “tell

    me about a time when you...\ It might come up as discussion from your

    resume or something you mention in passing. If you put on your resume

    “migrated a legacy Redis server cluster to the cloud”, be prepared to talk about

    that project.


    If you’re not already familiar with the acronym STAR, it can be very helpful

    for navigating these questions. STAR stands for Situation, Task, Action, Result.


    Let me give an example:


    Tell me about a time when you faced a difficult technical problem?


    # Situation:


    Well, my team maintained a legacy server that was constantly experiencing

    downtime issues and causing all sorts of trouble.


    # Task:


    I was tasked with taking the lead on the project, planning the migration and

    executing on it.


    # Action:


    I put together a task force of 3 people, met with them weekly, drafted a

    maintenance plan, led the migration and moved the application to the cloud.


    # Result:


    As a result, the application’s stability was improved! The move from the old

    hardware was a success. The company application is much more stable now. My

    supervisor commended me in my annual review and I was able to build

    leadership skills and rapport with my team.'
  merge: -1
