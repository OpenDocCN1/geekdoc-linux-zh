  md: '# Using Cloud Hosting Setup Tutorial


    # Setting up Digital Ocean VPS


    Digital Ocean is one of my favorite providers for basic Linux servers. In this
    section, we''ll walk through setting up an Ubuntu host with Digital Ocean. Some
    of these instructions may change slightly as Digital Ocean updates their website
    and UI, but the general process should be the same.


