    # lsof


    Linux uses integers or numbers to track files that are currently open as well
    as their associated processes. When I say open, I don’t just mean a file’s in
    your text editor, but any file that is currently used by a process, daemon or
    program running on the system. Remember to that in Linux, everything is a file.
    This includes processes, network devices, disks and more. This means lsof can
    track all of those resources!'
