  md: '# Linux Distributions


    Since Linux is open source, lots of different developers have worked on it and
    forked their work into separate distributions or "distros" based on the opinions
    they have on how the operating system should work. A fork is what happens when
    software is cloned from other software and takes a different direction. Linux
    distributions each have their own set of unique features, tools and preinstalled
    applications.


    It''s important to keep in mind that Linux actually refers to the Linux kernel,
    while distributions using the kernel are known as Linux operating systems.


    For this book, all of our examples will be Debian or Ubuntu tooling. Let''s briefly
    cover some of the most popular Linux distributions.


    # Debian


    Debian is one of the oldest Distributions based on the Linux kernel. It was first
    released in 1993 and has a lot of momentum to this day! Debian has different "branches",
    which are just different versions of the same operating system. Stable, Testing
    and Unstable are the three main Debian branches. Stable is the branch that most
    people should use, while testing and unstable are more frequently updated with
    changes that eventually make it over to Stable. Debian is the basis for a lot
    of other distributions, with the most popular being Ubuntu. Debian, like many
    distributions, utilizes a lot of free and open-source software.


    # Ubuntu


    Ubuntu was initially released in 2004 and is developed by a British company called
    Canonical. It is very popular among beginners and professionals alike. It''s the
    distribution we''ll use in this book''s examples. Ubuntu is based on Debian and
    even uses Debian''s package management system for installing software. Ubuntu
    has many versions of its OS for desktops, servers and even a version used in Internet
    of Things devices and robots core.


    Ubuntu was my first introduction to Linux and I think you''ll enjoy using it too.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# RHEL


    RHEL, or Red Hat Enterprise Linux is developed by none other than...a company
    called Red Hat. Red Hat, as of this writing, is owned by IBM. Red Hat Enterprise
    Linux has more restrictions on its distribution and is more commercial than other
    distributions. As well, RHEL uses a different packaging system for installing
    software than Debian and other distributions called RPM or Red Hat Package Manager.


    # Fedora


    Fedora is in some ways the pre-cursor and basis for Red Hat Enterprise Linux.
    Red Hat is a fork of Fedora. Fedora shares many similarities with Red Hat, but
    with a lot fewer restrictions and commercial agreements. Fedora also uses RPM
    or Red Hat Package Manager since it''s based on Red Hat.


    # Arch


    Arch is worth mention in this book, though it isn''t commonly used on servers.
    Arch is usually installed on Desktops and Laptops for users who want deep control
    over their system. Arch is very opinionated about many of its design decisions.
    This just means that the developers have strong convictions about the way to do
    things. I don''t recommend Arch for beginners, but learning could give you a deeper
    understanding of the Linux operating system if you''re up for the challenge.


    # What is the Kernel?


    The kernel is the most important part of the Linux operating system. It is the
    brains and core of the operating system. Linux''s kernel is responsible for starting
    the OS up, managing processes, memory, devices, processes and so much more. For
    now, just understand that the Linux Kernel is a crucial piece of the operating
    system.


    If you''d like to see which kernel version is running on your system, you can
    run uname -r:'
