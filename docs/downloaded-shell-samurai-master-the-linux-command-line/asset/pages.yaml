  md: 'example, if the input contained sizes like 2.5K, 10M, sort -h will convert
    them to a common unit (e.g., bytes), and sort them accordingly, so that the largest
    sizes comes first. The -r option sorts the input in reverse order, so we get the
    largest files in our output first:


    ```

    root@broken-waterfall-4525:/var/log# sudo -du /var/log | sort -rh

    1.3G /var/log

    1.2G /var/log/journal/278483eb55e3c7011468e370639f28de

    105M /var/log/postgresql

    17M /var/log/journal

