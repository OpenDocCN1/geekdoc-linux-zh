    \ to a host by observing the time it took to reply.\n\nPing gives us a tidy summary\
    \ at the end of how many packets it sent and to send packets as rtt or round trip\
    \ time.\n\nRemember that many hosts block ICMP or ping packets. So if you're sending\
    \ a ping to a host and it isn't replying, it may still be online but just ignoring\
    \ your requests.\n\n# Traceroute\n\nYou might already be familiar with the traceroute\
    \ command on Windows systems. Traceroute accomplishes the same goal of observing\
    \ how packets are routed from your local host to a destination address. The way\
    \ traceroute works is really interesting. Traceroute sends packets with ever-increasing\
    \ TTL or Time to Live. Time to Live are used by networks to prevent packets from\
    \ being sent around in a loop. When a device receives a packet, it decrements\
    \ the TTL by 1. If the value reaches 0, the packet is discarded and a message\
    \ is sent back to the source.\n\nFor example, traceroute would sends its first\
    \ packet with a TTL of 1 to the destination. When the first router or layer 3\
    \ device gets that packet, it will decrement the TTL field by 1 and the TTL is\
    \ 0. Since the value of the TTL is 0, the router will discard the packet and send\
    \ back an ICMP time exceeded message to the source. Traceroute records the IP\
    \ address of router and time to get a message back. Traceroute increases the TTL\
    \ to 2 and sends the packet again, repeating the process with the next router\
    \ in the “chain”.\n\nThat's a lot of theory, let's see an example!\n\nUse traceroute\
