  md: '# Text Processing


    # Editing Text with Nano


    At some point, you''ll need to edit text files on your Linux system. Nano is one
    of the easiest text editors for Linux beginners to get started with and boasts
    a simple editor. First, install Nano with apt-get install nano. Fire it up with
    nano <file_name> where fileName is any file name you''d like. You''ll see a screen
    pop up that looks sort of a regular GUI text editor. You can use the arrow keys
    to get around, enter to start a new line and delete to erase characters. The only
    difference is that you can''t use the mouse.


    Type a few lines of text, move around, and when you''re satisfied, save the file.
    In the bottom-left corner of your terminal, you''ll see "X Exit. This indicates
    the shortcut for saving and exiting: Ctrl + X. This key combination, and you will
    be prompted with "Save modified buffer?" Type "Y" to confirm saving, and Nano
    will display the name (pre-filled with the name entered earlier). You can change
    it to create a new file or keep the existing name. Press Enter to save and exit
    Nano:


    | Get Help | Write Out | Where Is |

    | Exit | Read File | Replace |


    Confirm your file was written by cat-it from your terminal or using less to read
    it.


    Nice Work! Nano is a great way to quickly edit text files, but it isn''t the text
    editor we''d recommend for long-term use.


    For...we''ll talk about VIM.'
