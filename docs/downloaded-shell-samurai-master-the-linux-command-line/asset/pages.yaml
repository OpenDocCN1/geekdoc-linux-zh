    # Managing Processes


    # What is a process?


    A process is simply an instance of a running program. Multiple processes run on
    Linux at the same time and the kernel manages and oversees them all!


    Each process has a unique ID, called the PID (Process ID) that identifies it.
    You can list running processes with the ps command. The process id is assigned
    in sequential order as processes are created.


    At your shell, run the ps command to see the currently running processes on your
    system:


    ```

    setson@linux_rocks:~$ ps

    PID TTY             TIME CMD

    5030 pts/0        00:00:00 sh

    5031 pts/0        00:00:00 bash

    5034 pts/0        00:00:00 ps

    ```


    ps, or process status gives a very plain and simple overview of currently running
    processes. In order from left to right:


    +   - PID: Process ID

    - TTY: The controlling terminal of the process

    - TIME: Total CPU time used

    - CMD: Name of the command or executable that spawned the process'
