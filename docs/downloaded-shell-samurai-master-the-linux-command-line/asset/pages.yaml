  md: '# DNS - The Yellow Pages of the Internet


    It''s not DNS

    There''s no way it''s DNS

    It was DNS

    -unknown


    DNS was once described to me as the “Yellow Pages of the Internet”. Like a phone
    book (people still use these?) that matches someone’s name to their phone number,
    DNS or Domain Name System does the same for Domain Names to map them to an IP
    address.


    Instead of internet users needing to have Rainman-like ability to remember that
    reddit is at 151.101.1.140, instagram is at 157.240.254.174 and amazon is located
    at 205.251.242.103, we can DNS do the heavy lifting!


    DNS is a huge distributed database of all these mappings between IP address and
    domain name. In this section, we’ll look at the basic operations of DNS, how Linux
    handles DNS and a few tools to configure DNS.


    # How does DNS work?


    DNS relies on a few components to do its job. Name servers are one of their primary
    components. A name server keeps configuration of DNS settings and answers queries
    or questions for clients that send it. A DNS server can be authoritative or recursive.
    Authoritative means that the server holds the record you’re looking for, it is
    the authority. A recursive server goes back and asks other servers for DNS settings,
    which may in turn ask another server until we reach an authoritative server that
    has the records.'
  merge: -1
  pgno: 192
- img_proc: true
  md: 'Zone files are the actual information stored the domain. Zone files keep a
    record name, TTL, Class, Type and Data. Let''s look at an example:


    shellsamurai.com. 377 IN A 23.21.157.88


    +   - Record Name: shellsamurai.com — this is the domain record is about

    - TTL - 377 - This is the time in seconds after the record is thrown away and
    one new retrieved.

    - Class Type - IN - Namespace of the record, IN is used for the internet

    - Record Type - A - This is the type of info stored in the record, you might have
    heard of MX records for mail and A for address before

    - Data - 23.21.157.88 - This field contains the actual value for the record. A
    file has an IP address associated.


    # Resolvers vs Authoritative Nameservers


    The DNS server that we query (a resolver) is different from the servers that actually
    contain the DNS records (authoritative nameservers). There are generally three
    levels of authoritative DNS servers:


    +   - root nameserver - Responsible for all domains. Does not contain zone records.
    Contains a list of TLD nameservers

    - .com TLD nameserver - Responsible for all domains ending in .com

    - example.com nameserver - Responsible for example.com and all subdomains


    The root name server delegates queries to the .com nameserver, who also delegates
    to the example.com nameserver. This design allows DNS to be decentralized.


    # Life of a DNS Request


    Let''s go deeper into the DNS request process and examine how your system'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'might find the record for shellsamurai.com. When your system makes a request
    to shellsamurai.com, the process is kicked off:


    First, your system will look at its local cache to see if there is already an
    IP address stored for the domain. If there isn''t, the request gets forwarded
    on to a recursive DNS resolver.


    Then, the recursive resolver checks its local cache to see if it has an entry
    for the domain. If it does, it responds with it. If it doesn''t have the entry
    cached, it queries the root DNS servers to find who the authoritative DNS server
    is that handles .com domain names.


    The recursive resolver then queries the TLD (Top Level Domain) DNS server that
    handles .com domains and obtains the IP address of the nameserver that is responsible
    for shellsamurai.com.


    The recursive resolver finally queries the authoritative DNS server to find the
    IP address mapped to the website.


    Once the authoritative server finds the address, it provides it to the recursive
    server who will cache the result and send the IP address back to the local DNS
    resolver, who also caches it and provides it to your local system.


    # /etc/hosts


    The file at /etc/hosts acts as a kind of override for host to IP address mappings.
    Before Linux calls out to DNS servers, it looks locally to see if there are any
    domain to IP address mappings already in place. Here''s an example:


    ```

