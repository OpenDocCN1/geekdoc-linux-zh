    Ping is possibly the first networking command any systems administrator learns.
    Ping checks if packets can reach a host using the ICMP or Internet Control Message
    Protocol. Ping is super simple to use, simply specify a domain or IP address with
    ping <host>. When you''re sending packets, press Ctrl+C to stop the operation.


    ```

