    # CRUD


    You''ll also hear the term CRUD when describing web applications and in discussions
    about APIs. CRUD stands for Create, Read, Update and Delete. These are the 4 operations
    used in databases and web apps to transform data and is a model used to describe
    web apps. Each of our 5 HTTP methods line up with Create, Read, Update or Delete.


    For example, GET is a read operation. POST is an Update operation. PUT and PATCH
    update data and of course DELETE...DELETEES data.


    With the CRUD design, we can create web apps that perform almost business goal.


    # What''s happening when we send an API request?


    It''s important to understand the 5 http methods and the concept of CRUD because
    it''s how most modern web applications work. What is actually happening when you
    send a request marked as a GET, POST, PUT, PATCH or DELETE?


    First, the server has a function or method that listens for your request and determines
    what type of request it is. Then, it looks to see if there is a resource that''s
    specified. This is usually an id specified as a number or integer. There may be
    some additional data attached to the request that the server parses. Once all
    the data it has sent, it will request some code be ran to get the resource back,
    create it, update it or delete it. It does this by talking to the database.


    Let''s imagine we have an E-Commerce store that sells surfboards and provides
    an API for front-end developers at Surf Board shops to use.


    Surf Shops might have a server that sends GET requests along with the ID of the
