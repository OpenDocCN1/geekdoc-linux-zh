  pgno: 197
- img_proc: true
  md: 'Source@ the source file:$ directory we want to transfer.

    Destination refers to the location where we want to copy our file or directory.


    We''ll need SSH setup and configured on the systems we''re transferring files
    to or from so to brush up on [SSH section of the book](# to get SSH up and running.
    To follow these examples, you''ll need two systems to transfer files between.
    Setting up two linux virtual machines might a good idea. Windows has a few packages
    for SCP that can be used as a client as well.


    Once you''ve ensured SSH is up and running, let''s try transferring a file:


    ```

    stetson@localhost:~$ scp shell_samurais.txt root@192.168.1.100:/tmp

    shell_samurais.txt

    100% 0 0.0KB/s 00:00

    ```


    Above, copy the file_samurais.txt from my local system to the remote system at
    192.168.1.100. Then, on your remote system, verify the file we received:


    ```

    root@linux_rocks:/tmp# ls -l

    total 4

    -rw-r--r-- 1 root root 22 Mar 11 15:56 shell_samurais.txt

    root@linux_rocks:/tmp# cat shell_samurais.txt

    Hello Shell Samurais!

    ```


    If we want to copy an entire directory, we can provide the -r flag to tell scp
    to recursively transfer an entire directory:


    ```

    stetson@localhost:~$mkdir -p my_dir/shell/samurais/secrets/

    cloudkeys

    stetson@localhost:~$ touch my_dir/shell/samurais/secrets/cloudkeys/

    secret_key.txt

    stetson@localhost:~$ scp -r my_dir root@localhost:/tmp

    ```


    Above, I create a few nested directories and a file inside them. Then, use scp
    with the -r flag to transfer recursively to my Linux server.'
  merge: -1
