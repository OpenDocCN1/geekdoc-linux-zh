  md: '# Quickly Moving to the Top, Bottom, and Right


    Vim has a ton of shortcuts that let you edit text quick. Let''s introduce a few
    more. Put your cursor on the first character of a line of text. Now, type the
    $ symbol. You''ll see that the cursor has moved to the last character on the line.
    Type the 0 key and notice that your cursor moves to the beginning of the line
    again. Try moving back and forth a few times.


    Let''s go the other direction now. Put your cursor anywhere on the first line
    of text. Now, type capital G with Shift+G. If you have multiple lines of text,
    your character will quickly shoot to the bottom of the text. Let''s go to the
    top again. Type the lower-case g character twice. gg. One after another. Your
    cursor should move back to the top of the text.


    Like the HJKL keys, you might be thinking that this sounds insanely hard to learn.
    It takes some practice and muscle memory, but it''s worth it in the long-run.
    Try to stick with it.


    # Searching for text in Vim


    If you''d like to quickly search for a word or series of words within Vim, hit
    the / key and type your query. Then hit enter. Vim will jump to the first occurrence
    it matches your query. Hit lower-case n and Vim will jump to the next line it
    finds. If you want to go back, hit upper-case N on your keyboard.


    If you''d rather search from the bottom to top, instead of hitting / and then
    your query, instead the ? key and type your query. The n key will move up and
    N will move down to matches of the query.


