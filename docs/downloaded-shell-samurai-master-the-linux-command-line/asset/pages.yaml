  md: '# Advanced Linux Interview Questions


    # What is systemd and what does it do?


    systemd is a system and service manager used to control the startup process and
    manage system services in Linux. It provides a consistent and unified way to start,
    stop, and monitor services, and it can be used to manage system resources like
    timers and sockets. systemd is used by many modern Linux distributions, including
    Red Hat, Fedora, Debian, and Ubuntu.


    # What is a kernel module?


    A kernel module is a piece of code that can be dynamically loaded into the Linux
    kernel to add or extend functionality. It is typically used to provide device
    drivers, file systems, or network protocols. Kernel modules can be loaded or unloaded
    at runtime, without the need to reboot the system.


    # What does strace command do?


    Strace is used to trace system calls and signals made by a process in Linux. It
    can be used to diagnose issues with an application, analyze behavior, or debug
    issues with system calls.


    # What does the lsof command do in Linux?


    Lsof or list open files is used to list open files and network connections in
    Linux. It can be used to identify which processes are using a file, determine
    which network ports are in use, or diagnose issues with file access or connectivity.


    # What does ssh do?


    Ssh is used to securely connect to a remote system over the network. It provides
    a secure shell session that allows users to execute commands, transfer files,
    or run remote applications.


    # How do private and public keys work?


    Private and public keys are a pair of keys used in asymmetric cryptography to
    encrypt and decrypt messages. The private key is kept secret and used to decrypt'
  merge: -1
