    # Secure Shell or SSH


    No Linux administration book would be complete without covering SSH. SSH or Secure
    Shell is the standard way in which you''ll remotely login to Linux systems. SSH
    doesn''t only allow you to access just shell, it''s also capable of file transfer,
    port forwarding and other network proxy services. Data passed over SSH is secure
    because the connection is encrypted and authenticated.


    OpenSSH is open source and included on almost every version of Linux. There are
    a few other implementations of SSH, but you''re best off using OpenSSH for now.


    # A Brief Primer on Public Key Cryptography


    SSH uses public key cryptography or asymmetric cryptography for authentication
    and encryption. Public key cryptography allows a client (you!) and a remote server
    to communicate securely without sharing a secret key.


    Traditionally, encryption would work by using the same secret key to encrypt and
    decrypt data. This means that both client and server would need access to the
    same key. If anyone intercepted that key, they could also decrypt the data. Not
    good!


    With public key cryptography, there are two keys involved: a public key and a
    private key. The public key is NOT a secret and is free to be shared. The Public
    Key is used to encrypt data before sending. The Private Key on the other hand,
    is a secret. You might have guessed that based on the name Private Key. Private
    keys are used to decrypt data that has been received.


    When a client and server communicate, they are using two pairs of Public and Private
    Keys. For example, when a server wants to send data to the client, it uses the
    client''s public key to encrypt the data and send it. Once the data is received
    by the client, it''s decrypted with the private key. The process is reversed for
    the other direction. The client sends data encrypted with the server''s public
    key. The server then decrypts the data with its own private key.'
