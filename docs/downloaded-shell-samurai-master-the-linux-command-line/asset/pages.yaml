  md: '# # Symlinks and Hardlinks


    If you’ve used Windows before, you’re probably familiar with the concept of a
    shortcut. They’re essentially links to other files on the system. Linux has a
    similar concept called symlinks or symbolic links. A symlink acts as a shortcut
    or reference to another file or directory on the system. There is also the concept
    of a hard link, which is a link to an inode. You might remember that an inode
    is a data structure used by the filesystem to store metadata about a file or directory.


    When a program or user attempts to access a symlink, they are redirected to the
    original file or directory’s “real” location on disk. Symlinks are extremely handy
    for creating shortcuts to frequently used files and directories.


    Let’s try a quick example. From your shell, create a new file with echo "hello
    Shell Samurai!" > /tmp/shell_samurais.txt. Create a symlink with ln -s /tmp/shell_samurais.txt
    ~/my_first_symlink. The first argument is the file we’re linking to, and the second
    argument is the symlink name.


    ```

    stetson@linux_rocks:~$ echo "hello Shell Samurai!" > /tmp/shell_samurais.txt

    stetson@linux_rocks:~\$

    stetson@linux_rocks:~$ ln -s /tmp/shell_samurais.txt ~/\my_first_symlink

    stetson@linux_rocks:~\$

    stetson@linux_rocks:~$ ls -l

    total 0

    lrwxrwxrwx 1 stetson 23 Mar 4 01:34 my_first_symlink -> /

    tmp/shell_samurais.txt

    ```


    If you list the directory contents of your home directory at ~, you’ll see an
    arrow -> my_first_symlink points to /tmp/shell_samurais.txt.

    To create this concept, open up the symlink in your home directory with your favorite
    text editor and delete the contents. Then, add some new text. I’ll add Hello from
    VIM! — Stetson.


    Cat the file in /tmp/shell_samurais.txt and you’ll see that the text has been'
