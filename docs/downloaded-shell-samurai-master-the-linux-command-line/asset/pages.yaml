    # ### What is a Shell Anyway?


    You might be wondering what a Shell is. It''s in the book title, after all. We''re

    not talking about seashells here. No, think of the Linux Shell as an outermost'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'layer that wraps the operating system and lets us talk to it. The Linux Shell
    is a program that provides a Command-Line Interface (CLI) to perform various tasks
    like running programs, configuring the network and adding users. In contrast with
    a GUI (Graphical User Interface), a CLI is text only, baby!


    # Why You Should Use the Command-Line


    CLIs are shrouded in mystery and give even some seasoned IT professionals pause.
    It can be so intimidating, just sitting there with its cursor blinking. All Arrogant
    with its plain-text. Where do you start? How can you cram your head with all these
    commands? “This is too hard, I give up! Why do I even need this stupid command-line?”
    is a phrase we’re throwing away. Stick with it, the Command-Line is worth learning.


    Firstly, using a command-line is much quicker than GUI configuration! Once you
    become a Shell Samurai, you can command a Linux system to do your bidding with
    ease and speed. The GUI doesn''t offer the same level of control. Nearly every
    boring, repetitive task can be automated with shell scripts that run from the
    command-line. Think of all the saved time you''ll spend on the.


    Secondly, learning how to use the CLI will give you a deeper understanding of
    how the Linux OS works. By interacting at a lower level, you''ll be able to see
    how underlying processes and systems work. The GUI often hides features and switches
    to appear more user-friendly, but ultimately handicap your learning. Knowing how
    the operating system *truly* works will help you maintain and troubleshoot Linux
    systems more effectively.


    Another reason to learn the command-line is because it''s the standard way to
    administer servers. I suspect many of you reading this book to work with Linux
    in your full-time job. As a sysadmin, DevOps Engineer, SRE or any other numerous
    IT-roles, knowing the shell is essential. It''s the way things are done. That''s
    not to say we should do things just because they’ve been done a long time. However,
    on matters of maintaining production servers, this one is nonnegotiable. Any “good”
    Linux sysadmin will have at least a basic understanding of using the Linux command-line.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'Finally, it’s just plain fun! Learning how things work is fun. Typing away
    at a shell in a dark room can make you feel like a super-hacker. Unlocking new
    abilities and skills is fun too. I imagine you work with computers because you
    think in a similar way. There’s much foundational knowledge we’ll begin to build
    about Linux, so let’s get started!


    # Who This Book Is For


    This book is for anyone who is new to Linux systems administration. Maybe you’ve
    tried to learn Linux and the command-line in the past, but just couldn’t get over
    some obstacle or it never “clicked” for you. You might have heard how cool Linux
    is previously, but you’re not really sure what the rumors are about. You could
    have used Linux a few times before phrases like Vim or Kernel make you uneasy.
    My goal is with Shell Samurai is to give you the essential tools and knowledge
    to be competent enough to understand how Linux operates. In addition, we’ll learn
    how to use the Linux command-line.


    You’ll learn to configure Linux, connect to other servers, install source code,
    imaju webservers and so much more. Don’t expect to touch a GUI in this book, we’re
    focusing entirely on the Command Line.


    # What You Should Know Already


    This book is aimed at folks who already know a tiny bit about computers. You might
    know what a server and motherboard are. You might be working towards a career
    in Computer Science or IT or already be working in the field. You might not work
    in IT and have no plans to do so! Perhaps you just have a tenacious mind. No matter
    what you provide, this book aims to explain things simply, without talking to
    you like you’re a baby. We’ll go deep enough that things aren’t “behind the veil”.
    You don’t need a PhD in Computer Science to read this book.'
