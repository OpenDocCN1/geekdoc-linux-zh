    Deleted archive ''/var/log/journal/

    27483eb55e3c7011468e37069f28de/user-1000.journal~ (700M).

    Vacuuming done, free 16.0M of archived journals from

    ```


    In this case, the logs at /var/log are handled by the journal service. We can
    modify the configuration at /etc/systemd/journal.conf so that we don''t encounter
    this issue again. Under the [Journal] section, we can set the following setting:


    ```

    SystemMaxUse=100M

    ```


    Then, restart journal with systemctl restart systemd-journal.service so that the
    configuration takes effect. This command sets the maximum disk space that the
    journal can use. If the journal size exceeds this limit, journal will delete the
    oldest logs to make room for new logs.


    Part of being an effective Sysadmin and Shell Samurai is not only in fixing issues,
    but ensuring that they don''t happen in the same way. There''s nothing worse than
    fixing an issue and then waiting and having it happen again and fixing it in the
    same way! Fix an issue once and be done with it.


    # Logs - Not Just for Lumberjacks


    Understanding logging in Linux is another fundamental skill for troubleshooting
    and operating a production system. Logs are text files that get populated with
    the output from a program or your system describing what is happening, often with
    timestamps attached.


    For example, if you are running an Nginx web server, it will output logs to /var/log/nginx/access.log
    and /var/log/nginx/error.log. These files will contain a newline for every web
    request that comes in your server, along with'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'details like IP address, path requested, HTTP status code and more. If you
    have a path that isn’t working, like myexamplewebsite.com/login you can use the
    logs to troubleshoot and drill into the issue.


    In this section, we''ll talk about what kinds of things can be logged, how to
    view logs and how to configure logs.


    # Logging Locations


    Generally, logs are written to the /var/log directory. However, some applications
    are configured to write to different areas of the file system. The syslog service
    is what generally sends logs to the system logger.


    # Log Rotate - Don''t let the disk fill up!


    Every sysadmin has run into this scenario: Your Linux server is serving a web
    application or doing some other background process and suddenly starts acting
    kinda. You check the logs and see mysterious entries about disk space. Oh no.
    So you dig in further and find that the disk has no space left! Do simply add
    more disk to remedy the problem? No, you keep troubleshooting and find that the
    logs are filling your disk. Those devious logs. What was meant to help us administer
    our system and keep an eye on health has suddenly betrayed us and made our system
    unhealthy. No good.


    rotate remedies this by...rotating logs. Well, not spinning them in circles, cleaning
    up old logs that we no longer need by compressing, deleting them or splitting
    them up. Generally, if your app is important, you’ll be keeping logs somewhere
    else that is not on the Linux server. It could be in the cloud or another log
    server we set certain parameters like the amount of disk space we’d like to keep
    for logs before it starts deleting or compressing old ones.


    Logrotate is a friendly and an essential tool for administering any production
    web app. Let’s take a look at how to install and configure logrotate.


    Logrotate might already be running on your system! We can verify this by looking
    in the logs directory at /var/log. List that directory with ls, so you see files
    titled syslog.1.gz, syslog.2.gz, kern.log.1.gz, etc? If so logrotate is'
