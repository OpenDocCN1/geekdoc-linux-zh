    as they can directly access each other''s memory.

    - Each thread has a unique thread ID (TID) within the context of the process it
    belongs to, but from the Linux kernel''s perspective, threads are treated as shared
    resources.

    - Creating a new thread requires less overhead compared to creating a new process,
    as threads share most of the process''s resources.

    - Threads are useful for parallelizing tasks within a single process or for executing
    tasks concurrently that need access to shared data.


    In summary, processes and threads share resources differently and are isolated
    differently. Processes are more isolated and have separate address space. Threads
    within the same process share resources and communicate more efficiently.


