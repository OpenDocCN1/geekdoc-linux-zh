  md: 'We do see some different fields, though. Namely, the Flags column has U and
    U6 underneath. U means the network is up. U6 means that the network is up and
    is a gateway.


    # ARP Table


    ARP stands for Address Resolution Protocol. The ARP table is a local database
    that maps MAC addresses and IP addresses to an interface to where to forward packets.
    We can view our linux arp table with arp -a:


    ```

    root@linux_rocks:~# arp -a

    ? (172.17.0.1) at 02:42:71:bd:c5 [ether] on eth0

    ```


    Above, we see the MAC address of the gateway at 172.17.0.1 is at

    02:42:71:e3:bd:c5 on device eth0.


