    These values are called environment variables. To see them all, go ahead and type
    env in your shell. You''ll see a bunch of values come back!


    Environment variables are used for programs and scripts running on the system
    to learn about the environment in which they''re running. Environment variables
    might also be used to set the location of a remote file server, set API keys,
    or locations of other files and programs.


    We''ll now look at another important environment variable, called PATH.


    Please echo $PATH in your shell:


    ```

