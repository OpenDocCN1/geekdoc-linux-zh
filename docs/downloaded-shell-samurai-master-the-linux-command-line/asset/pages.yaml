    access your shell is by opening Command Prompt or Powershell and simply typing
    ubuntu and hitting enter.


    Check out the Microsoft Documentation for more info on Windows Subsystem for Linux.


    # Use Virtualization Software


    Another great option is to use software like VirtualBox or VMware to install a
    Linux system on your laptop or desktop. This option is flexible but requires a
    little bit of configuration and setup. It''s free and lets you customize everything
    you need to run any ISO image and flavor of Linux. The Virtual Machine is segregated
    from your main computer so you''re free to mess things up and get it into a broken
    state without pain.


    For more info on using VirtualBox, reference the installation Ubuntu provided
    here.


    # Dual Boot


    Dual Booting is a way of installing Linux alongside another operating system on
    the same machine. This is a similar route to just installing Linux on a computer
    like I mentioned above. You''ll have to do some partitioning of your hard drive
    and do some other configuration. Due to that, it''s an option, but not a very
    good one in my opinion due to the complexity involved for a newbie.


    # Use a Server from A Cloud Host'
