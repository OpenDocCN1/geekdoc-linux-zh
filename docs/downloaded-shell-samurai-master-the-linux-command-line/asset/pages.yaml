  md: '# # Syntax Used In This Book


    Throughout the book, we’ll give “code” samples for you to read through and try
    yourself. Code samples will be formatted in Code Span. Code samples will be formatted
    in monospace font. Here’s an example:


    ```

    ```

    stetson@linux_rocks:~$ echo "hello, Shell Samurais!"

    hello, Shell Samurais!

    stetson@linux_rocks:~

    ```

    ```


    Code samples are formatted to be as readable as possible and use spacing to separate
    them from other content. Yes, I know that commands aren’t really code, just roll
    with it.


    When I specify a command in the book, I’ll also use monospace font to emphasize
    that the command is something you should use in your own shell. For example, commands
    like echo, ls, man, and others will be formatted in monospace.


    When I introduce new phrases or concepts or want to emphasize a word, that word
    will be *italicized*.


    # ## Hot Tips


    Occasionally, you’ll see a Hot Tips 🔥 section in the middle of the page. This
    indicates a tip pertaining to the topic that I’m throwing in as an extra.


    # ## Suggestions


    If you find any portion of this book is *not* formatted well, please reach out
    to me and I will fix it! I’ve done my best to make the book as readable and accessible
    as possible in PDF and ePub formats.'
  merge: -1
