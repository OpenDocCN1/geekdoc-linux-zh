  md: '# How this book is structured


    This book is structured into chapters which are meant to ease you Linux and then
    quickly ramp up with using Linux and learning commands to administer systems.


    Here''s a brief overview, be sure to also check out the [Table of Contents](#)
    to find specific sections.


    # Preface


    This chapter! We cover who I am, why you should learn Linux and what skills you
    should have already read this book.


    # Setting up a Lab Environment


    You can''t be a Shell Samurai without a Shell. In this chapter, we get your system
    running and ready to learn. Whether you choose to dive in and install Linux on
    an old laptop, use a web host or use a virtual machine, this step is essential
    to our journey. We can''t be a Shell Samurai without having a dojo to train in,
    after all!


    # Linux Fundamentals


    This chapter introduces the basics of how Linux operates. We''ll dive into the
    kernel, directory structures, how the system boots and more! We recommend coming
    back to this chapter later as a reference. This section is mostly theory and doesn''t
    focus on too many commands.


    # White Belt Command Line Skills


    Here''s where it gets exciting. We introduce you to the trusty shell and get you
    up and running with basic Linux commands. You''ll learn how to navigate around
    the filesystem, create files, copy and move them, install packages and much more!'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Black Belt Command Line Skills


    This chapter builds upon the previous one and goes more in-depth on advanced commands
    and concepts you''ll use in your Shell Samurai journey. You''ll learn about compiling
    code from source, standard streams, managing processes, symlinks, regex and more.


    # The Network


    We''ll briefly cover some networking concepts, then dive right into Linux network
    commands including capturing packets, working with DNS and transferring files
    over the network.


    # Real World Samurai Skills


    This chapter is a compilation of knowledge from Systems Administration interviews
    I''ve personally been through along with some real world scenarios you can learn
    from. Ready yourself to tackle any interview and operational problems with Linux.


    # Outro


    This chapter provides some reference materials and links along with suggestions
    on where to take your Linux journey next.


    # Introduction and Thank You


    Firstly, thank you for purchasing Shell Samurai! I am honored that you want to
    learn something new and that you want to learn it from me. I''ve been wanting
    to teach the world about Linux for many years now, but just recently worked up
    the courage to write this book! If you''ve ever been in the same situation, I
    encourage you to launch your project, write the book, or take the trip you''re
    thinking about. It could pay off in ways you might never expect!'
  merge: -1
