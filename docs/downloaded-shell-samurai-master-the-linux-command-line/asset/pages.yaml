- img_proc: true
  md: 'messages encrypted with the corresponding public key, which can be freely distributed.
    The security of this system is based on the mathematical relationship between
    the two keys, making it impossible to derive the private key from the public key.
    Private and public keys can be used to secure communication over untrusted channels
    and for authentication.


    # What is the difference between hard and soft links in Linux?


    Hard links and soft links (symbolic links) are two types of links that can be
    created between files in Linux. A hard link is a direct link to a file that points
    to the same data blocks as the original file. It has the same file permissions
    and ownership as the original file, and it cannot be created for directories.
    A soft link, on the other hand, is a pointer to a file that points to the original
    file by its path. It has its own file permissions and ownership, and it can be
    created for both files and directories.


    # What is the purpose of the /proc filesystem?


    Everything in Linux is a file! The /proc filesystem is a virtual file system that
    provides a view into the system''s processes and kernel data structures. It allows
    users to read or modify kernel variables, system information, and process status
    in real-time. It does not store any data on disk, but rather provides a dynamic
    interface to the kernel''s internal data structures.


    # What is cron and crontab used for?


    Cron is used to schedule recurring tasks in Linux. It allows users to specify
    a set of commands or scripts to be performed at specific intervals, like every
    hour, every day, or every week. The crontab file uses a syntax that specifies
    the timing and frequency of the job, as well as the command to be executed.


    # What is the purpose of the iptables command in Linux?


    The iptables command is used to set up and manage the firewall rules in Linux.
    It allows users to specify rules to filter, block, or allow network traffic based
    on predefined rules.


    Iptables works by configuring chains of rules, where each rule specifies the type
    of traffic to match and what action to take on the matched traffic. The rules'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'can be set up to allow block traffic based on the source or destination IP
    address, port number, protocol, and other factors.

    iptables can also be used to forward traffic to other hosts or machines on the
    network.


    # What is a container and how does it work?


    A container is a lightweight, isolated runtime environment that allows multiple
    applications or services to run on a single host without interfering with each
    other. It achieves this isolation by using Linux namespaces to create separate
    network, process, and file system environments, and by using cgroups to limit
    resource usage. Containers can be created and managed using tools like Docker
    and Kubernetes.'
