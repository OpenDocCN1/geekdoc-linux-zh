    # Finding Files with Find


    find is a command-tool that can help us search the vast directory structure of
    Linux for specified directories or files based on criteria such as name, size,
    type, or modification time. Since Linux directories are sprawling, it just doesn''t
    make sense to go about manually running ls on directories, reading and grepping
    the output until you find the one you''re after.


    Find generally takes two arguments, a directory to search through and a file or
    folder we''re looking for.'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'The basic syntax of the find command is as follows:


    find [path] [expression]


    The [path] is the starting directory where the search will begin, and [expression]
    is a set of options and tests that define the search criteria. For example, find
    all files named "file.txt" in the current directory and its subdirectories, you
    would use the following command:


    ```

    stetson@linux_rocks:~$ find . -name ''file.txt''

    ./file.txt

    ```


    Try creating a file in your home directory and then using find to find it.


    Find doesn''t just use the file name as a search parameter. For instance, we can
    search for files based on their size using the -size option followed by a size
    value and unit (c for bytes, k for kilobytes, M for megabytes, and so on). The
    following command will find all files larger than 10 megabytes in the / directory
    (you may need to run this as root or sudo):


    ```

    root@linux_rocks:# find / -size +10M

    ```


    Find doesn''t search just one directory, we can search from the directory for
    any file:


    ```

    stetson@linux_rocks:~$ sudo find / -name secret_file.txt

    /home/stetson/secret_file.txt

    ```


    Another useful feature of find is its ability to execute actions on the files
    that match our search criteria. By using the -exec option, you can specify a command
    to run on each file that was found.


    The following example will find all files with the ".log" extension in the /var/log
    directory and delete them:


    ```

    find /var/log -name "*.log" -exec rm {} \

    ```'
