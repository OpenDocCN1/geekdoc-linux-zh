- img_proc: true
  md: '# Init and User Space Start


    After the bootloader loads the kernel into memory, it starts its first user-space
    process, init. This kicks off the rest of the process to bring the system completely
    up by starting essential services. The init process will always be assigned a
    process id of 1. Once init starts, its goal is to start up the rest of the programs
    that are necessary to run the system.


    Systemd is the newest and current standard for init on modern Linux distributions.
    System V init (SysV) is found on older Red Hat Enterprise Linux distributions.
    Upstart is the init that was used on older Ubuntu distributions (pre 15.04). There
    are a few other init systems used for embedded applications, cellphones and other
    devices. The three I mentioned are the ones you should be most familiar with:
    Systemd, SysV and Upstart. We''ll be working with and covering systemd.


    # systemd


    systemd works with targets which can be thought of as goals for systemd to reach.
    Targets are a type of unit used to group other units and define the system state
    that should be reached. A unit is a file that has instructions for how to start
    a daemon or system service and the dependencies for starting it. The dependencies
    for a service are also units.


    For example, consider a Web Server like Nginx. It doesn''t make sense to start
    up a server if the system doesn''t already have its network online and functional.
    A Web Server or Nginx unit will have a dependency on the network unit file.


    Let''s take a look at how systemd boots the system:


    +   - Systemd loads configuration files or units, which are typically located
    in /etc/systemd/system or /usr/lib/systemd/system

    - Based on configuration files, systemd determines its boot goal or target, this
    is usually default.target. systemd then figures out dependencies of the boot target
    and activates those.

    - units are configuration files used to describe a resource managed by'
