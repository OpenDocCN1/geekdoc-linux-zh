    # An Example Unit File


    Let''s take a look at an example systemd unit file for the popular web server,
    Nginx. This file would typically be located at /lib/systemd/nginx.service


    ```

    [Unit]

    Description=The NGINX HTTP and reverse proxy server

    After=syslog.target network-online.target remote-fs.target nss-lookup.target

    Wants=network-online.target


    [Service]

    Type=forking

    PIDFile=/run/nginx.pid

    ExecStartPre=/usr/bin/nginx -t

    ExecStart=/usr/bin/nginx

    ExecReload=/usr/bin/nginx -s reload

    ExecStop=/bin/kill -s QUIT $MAINPID

    PrivateTmp=true


    [Install]

    WantedBy=multi-user.targetManagingd Services

    ```


    This config file looks very similar to .INI formats you might have seen in the
    past. The sections are denoted by square brackets for Unit, Service and Install.
    Each of the keys and values underneath the sections are known as directives.


    The Unit section contains a description of the service along with an After and
