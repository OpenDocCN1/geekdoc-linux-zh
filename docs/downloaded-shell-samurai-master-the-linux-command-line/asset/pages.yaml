    # Compiling Code from Source


    Previously, we looked at how to use our package manager to install software. Life
    didn''t always used to be this easy. Software used to be always compiled from
    source. Compiling from source is the process of building software from its original
    source code. While that may seem daunting, there are many reasons why you''d want
    to compile from source.


    One of the primary reasons is that it allows for greater control and customization
    over the software being installed. When using a package manager, the software
    comes pre-compiled with default options and settings, compiling from source allows
    us to tailor the software to our specific needs and preferences.


    Additionally, compiling from source can be necessary when using software that
    is not available through a package manager, or when a newer version of the software
    is needed. By understanding how to compile code from source, we''ll gain greater
    flexibility and control over our system.'
