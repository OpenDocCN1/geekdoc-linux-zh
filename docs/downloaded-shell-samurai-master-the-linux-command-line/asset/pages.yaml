    # Processes vs Threads


    When talking about processes, you''ve no doubt heard of the term threads or multi-threading.
    In Linux, processes and threads are both abstractions used by the system to execute
    code and allocate resources. There''s a couple differences between the two concepts
    in how they are structured, share resources and are isolated:


    Process:


    +   - A process is an independent execution unit with its own address space, code,
    data, file descriptors, and environment variables.

    - Each process has a unique process ID (PID) that distinguishes it from other
    processes in the system.

    - Processes are isolated from each other, and communication between processes
    requires inter-process communication (IPC) mechanisms, such as pipes, sockets,
    and shared memory.

    - Creating a new process involves significant overhead, as the operating system
    needs to allocate memory, create a new address space, and set up other resources.

    - A process can have one or more threads.'
