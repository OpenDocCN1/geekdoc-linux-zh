    # OSI Layers


    * Application Layer

    * Presentation Layer

    * Session Layer

    * Transport Layer

    * Network Layer

    * Data Link Layer

    * Physical Layer


    We will not dwell on each one. We will focus on the following ones: physical layer,
    data link layer, network layer, and application layer. Later we will discuss about
    the transport layer. The session and presentation ones are not helpful for what
    we want to achieve.


    * **Physical Layer**: this layer includes everything related to the transfer of
    data within a specific means of communication (copper, fiber or radio wave network
    cable).

    * **Data Link Layer**: this level finds its maximum expression within the context
    of local networks (LAN). In a LAN, it is necessary to refer to the `MAC address`
    and the `IP address` of a certain network device as well as to their subsequent
    association, also known as the `ARP table`. I will explain to you later the exact
    meaning of each of these terms.

    * **Network Layer**: this level focuses on the communication between different
    networks. In this case, we will mainly use the Internet Protocol (`IP`).

    * **Application Layer**: high-level protocols interact with each other at this
    layer. Some of these protocols include but are not limited to `HTTP`, `HTTPS`,
    `FTP`, and others.


    We can find other names for each one of these layers depending on the type of
    device involved:


    * Physical layer: means of physical and non-physical communication.

    * Data Link Layer: switch.

    * Network Layer: router.


    We will soon dig deeper into the main characteristics of these devices and the
    reasons why they are so important; first we will need to look into two other concepts:
    the `MAC address` and the `IP address`.


    ## MAC ADDRESS


    The `MAC` (Media Access Control) address is a 48-bit address that is uniquely
    assigned by the manufacturer of each Ethernet or wireless network card. Below
    is an example of a `MAC address`:

    ![](image441.jpg)


    This address is fundamental in the world of networks because it allows a machine
    to be uniquely identified within a local context (for example LAN). Whenever I
    mention something about `MAC addresses`, I am always referring to a local network
    and not to a remote one. To surf the Internet, for example, you will never use
    a `MAC address`, but you will rather rely on an `IP address`.


    When one or more devices are part of a local or LAN network, all PCs belong to
    the same subnet. Therefore, each time we need to communicate with another network,
    we are implicitly referring to the `IP address` and not to the `MAC address`.
    Are you curious to find your device’s `MAC address`? Type the following command
    in your Windows device: `ipconfig /all`. If you are using a Linux device, enter
    this one: `ifconfig`.


    ## IP ADDRESS


    Until this point of the book, I have always talked about local networks. Now we
    will instead dig deeper into the characteristics of an Internet Protocol (`IP`)
    address.

    ![](image450.jpg)


    The `IP address` appears as a numeric value of 32 bits and allows the identification
    of both the network and the host. Basically, we can say that a part of the `IP
    address` is intended to identify the network while another one locates the host,
    which we will introduce later.


    Each time we need to surf the Internet, or communicate with another subnet, we
    must necessarily use a previously assigned `IP address`. No machine can browse
    if it is not provided with an `IP address`.


    `IP addresses` are divided into public and private. The public ones allow browsing
    on the Internet, while the private ones are used inside internal sub-networks
    (a company''s network, for example); no private `IP address` will ever be able
    to surf the Internet.


    Let me give you a practical example. Suppose we find ourselves inside a certain
    local network and that its `IP address` is `192.168.1.0/24`. This implies that
    each connected PC has an `IP` belonging to this subnet, such as `PC1 -> 192.168.1.1`,
    `PC2 -> 192.168.1.2`, `PC3 -> 192.168.1.3`. These are 3 examples of private `IP
    addresses`. These machines will always be able to communicate with each other,
    but they will never be able to do it on the Internet because they do not have
    a public `IP address`.


    Private `IP addresses` are divided into 3 different classes:


    * Class A private `IP addresses` where the initial `IP address` is `10.0.0.0`
    and the final `IP address` is `10.255.255.255`.

    * Class B private `IP addresses` where the initial `IP address` is `172.16.0.0`
    and the final `IP address` is `172.31.255.255`.

    * Class C private `IP addresses` where the initial `IP address` is `192.168.0.0`
    and the final `IP address` is `192.168.255.255`.


    The choice of a specific class depends on the size of our subnet and on how many
    `IP addresses` we must assign to the machines. For now, that is all you need to
    know about `IP addresses`. We will return to this topic in later chapters.


    ## ARP PROTOCOL


    In this section, I will explain what an `ARP protocol` is. It is very simple to
    operate but exposes us to multiple security threats. Being a protocol without
    any type of authentication, it can be vulnerable to different types of attacks,
    including the so-called "Man In The Middle".


    `ARP` stands for "Address Resolution Protocol". This protocol keeps track of the
    association between a `MAC address` and an `IP address`. Remember that in a local
    context we need our devices to be identified by a `MAC address`. Then, once outside
    of it, we will communicate exclusively via an `IP address`. This protocol is defined
    by means of a table, the `ARP table`, which contains the aforementioned associations
    (`MAC-IP`).


    You can type the `arp -a` command to view the `ARP table` of your Windows PC.

    ![](image473.jpg)


    As you can see from the example above, for this network we can find on the left
    the `IP addresses` and on the right several `MAC addresses`.


    ## THE DEFAULT GATEWAY


    You might already know the term "default gateway", but what exactly does it represent?
    When you need to communicate within your local network, you will use the `ARP
    protocol`, which facilitates the association between a `MAC address` and an `IP
    address`.


    However, you will also have to communicate externally, for example on the Internet.
    At this point, you will need to know exactly what other network devices you are
    trying to reach, like for example a router.


    This is where the default gateway comes into play. It is the “best device” to
    use when you need to communicate outside your local network. Every time your PC
    does not know where to send a certain `IP packet`, it will send it to your default
    gateway for further processing and to allocate it to subsequent devices, which
    are part of the `IP packet path`.

    ![](image482.jpg)


    In this example, whenever the PC does not know where to send a certain packet
    that does not belong to its own subnet, it will send it to your default gateway,
    or to the device with the `IP address` of `10.0.2.2`. If you want to know what
    your default gateway is, you can type the `ipconfig /all` command in your Windows
    device.


    ## NAT


    I will now mention a concept that might sound difficult to some of you, but which
    nowadays is used in almost all networks. The word `NAT` stands for “Network Address
    Translation”. But what does it actually mean? I will try to be as clear as possible.
    When you surf the Internet from home, several things will happen: the first one
    is that your PC will receive a private IP address, usually belonging to class
    C (`192.168.1.0/24`).


    However, as you already know, this is not enough to browse on the Internet. You
    need a public IP address, and this is where your router and `NAT` come into play.
    The router will automatically translate the private IP address into a public address
    and therefore you will be able to navigate without any problems.


    * `PRIVATE IP ADDRESS`: to verify your private IP type the `ipconfig` command.

    * `PUBLIC IP ADDRESS`: to check your public IP click on the following link: `https://www.whatsmyip.org/`.

    '
