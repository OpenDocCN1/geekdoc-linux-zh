    如果 PC 对 `PING` 命令没有响应，但 `ARP` 条目存在，那么我们可能正在遇到网络层的问题。如果甚至连 `ARP` 条目都不存在，那么就是数据链路层的问题。这只是我们在遇到网络故障时处理流程的一个示例。显然，我们没有考虑所有其他连接的网络设备（路由器、交换机等），因为在那种情况下问题将变得更加复杂。本章关于主要网络概念的章节到此结束。由于对于你作为渗透测试员的职业生涯来说，这是一个至关重要的课题，你可以参考以下链接学习更多信息：http://www.tcpipguide.com/free/。


    # 企业网络

    对于渗透测试员来说，理解企业网络的基本原理无疑非常有帮助。除了特殊情况外，你几乎总是会发现自己在这些环境中操作。对大多数网络设备及其功能有良好的理解，将帮助你以更准确、更有效的方式进行渗透测试。


    企业网络可能比私有网络复杂。你需要大量的知识和经验才能完全理解它们细微之处。然而，我主要重点介绍一些常见元素的基础知识。任何网络如果没有至少两个设备的支持都是无法工作的：`SWITCH`（交换机）和
    `ROUTER`（路由器）。我还应该应该提到 `FIREWALL`（防火墙），尽管它不是必需的，但在企业网络中始终存在。接下来的章节将介绍这三个元素。


    ## CISCO PACKET TRACER

    你可能从未听说过网络模拟器 Cisco Packet Tracer。这种软件允许我们创建和模拟网络场景。我们可以用它来执行测试，并更好地理解某些设备的工作原理或网络的全局行为。Cisco
    Packet Tracer 最近已免费，你可以在此链接下载它：https://www.netacad.com/courses/packet-tracer-download/。下载完成后，你可以按照标准的安装过程进行。


    ![](img/image587.jpg)


    我将不会详细介绍 Cisco Packet Tracer 的具体操作和配置。我建议你阅读该软件完整且编写良好的文档，以便立即创建你的第一张网络拓扑。此外，使用“Simulation”（模拟）模式进行网络模拟效果更好。你能够更好地理解网络设备是如何相互交互的。


    ![](img/image593.jpg)


    ## LAN-WAN-DMZ

    为了与中大型网络交互，我们首先需要定义它的拓扑结构。我们需要将网络划分为若干区域，以便我们始终知道自己在哪里。这有助于我们对通过网络的流量进行分段、组织和管理。


    我们需要做的第一个区分是“内部世界”和“外部世界”。我们所说的内部世界是指发生在我们私有网络内部的一切，那里分配了我们的私有 IP 地址。这被称为 `LAN`（局域网）。当我们需要与外部世界通信（特别是连接互联网）时，我们将引用
    `WAN`（广域网）。这种区分帮助我们再次强调“内部”和“外部”的概念。我们几乎从不只使用 `LAN` 和 `WAN`。网络还有其他部分，我们将用不同的逻辑引入它们。其中之一就是所谓的“DMZ”，意思是“非军事区”。在这个区域，我们将被迫即使是关键服务也暴露给外部世界。正因为存在这些隐含的风险，我们不应该将这些服务包含在
    `LAN` 中，因为 `LAN` 是应该被尽可能保护的网络部分。


    我们可以这样总结这个概念：每个网络将始终由一个 `LAN` 部分和一个 `WAN` 部分组成。然而，如果有必要，我们可以添加并定义网络的其他部分，例如 `DMZ`。


    ![](img/image606.jpg)


    ## 交换机 (THE SWITCH)

    该设备的主要功能是对网络内的数据包进行排序。它在 ISO/OSI 模型的数据链路层运行。正如你可能猜到的那样，我们指的是 MAC 地址的世界。当我们谈论交换机时，我们永远不是指网络层和
    IP 地址。记住这种区别至关重要。交换机基于 MAC 地址，并在特定的子网内工作。在一个子网内我们可以找到一个或多个交换机。相反，交换机永远无法连接到两个或多个子网（因为这将需要路由）。每当更多的
    PC 需要在同一子网内通信时，我们就必须插入并配置交换机。该设备由多个端口组成，这些端口充当多个网络接口。在每个端口中，我们必须插入想要与其他通信的 PC
    的网线。


    ![](img/image616.jpg)


    交换机排序的数据包被称为 `FRAME`（帧）。交换机的关键特性之一是能够以智能的方式转发数据包。交换机可以读取以太网帧中包含的 MAC 地址，并确切知道应该将消息发送到哪台机器。由于这个原因，它不需要转发到所有连接设备。


    现在让我们该设备工作背后的详细过程：


    * 交换机自动学习 `LAN` 网络的拓扑结构。它可以确定每个 PC 连接到它的哪个端口。

    * 它在一个名为 `CAM table` 的表格中汇总每个端口与 MAC 地址之间的关联关系。每当有新数据包到达时，该表就会自动更新。


    基本上，该过程的准确工作方式如下：


    1. 当数据包到达端口时，交换机检查接收者地址是否已于 `CAM table` 中。

    2. 如果地址存在但接收者端口与发送者端口不同，则数据包被发送到关联端口，且仅发送到该端口。

    3. 如果不存在，数据包将发送到所有端口，发送者端口除外。


    交换机还有其他高级功能，例如 MAC 地址过滤或其他特定的控制操作。然而，这个介绍对于我们的工作目的来说已经足够了。我仍然邀请你使用 Cisco Packet
    Tracer 模拟交换机的功能。例如，你可以选择三个 PC 并它们连接到 Cisco Packet Tracer，使用模拟模式测试数据包的发送。记得先为每个单独的
    PC 定义 IP 地址。你可以通过双击每个 PC，进入 `Desktop -> IP configuration` 并输入所有地址。


    ![](img/image639.jpg)


    ## 路由器 (THE ROUTER)

    使用这种新网络设备的需求源于我们无法局限于自己的子网。在未来，我们需要进行外部通信，即在互联网上与另一个子网通信。路由器的功能是将数据包传输到我们所在的子网之外。记住我们处理的是
    IP 地址，而不是 MAC 地址。路由器在 ISO/OSI 模型的网络层运行。


    为了给出一个实际的例子，假设我们处于一个有两个不同部门的公司：行政部门和技术部门。这两个部门很属于不同的网络。假设我们可以依靠具有以下设置的网络：


    * 行政部门：网络 `192.168.1.0/24`。

    * 技术人员：网络 `192.168.2.0/24`。


