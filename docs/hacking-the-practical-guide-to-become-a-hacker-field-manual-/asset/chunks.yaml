    ## CREATION OF A MALICIOUS FILE

    Connect to the Kali machine and type the following command:

    ![](image1620.jpg)

    In particular:


    *   `LHOST` is the local address of the attacking machine, i.e. Kali.

    *   `LPORT` is the door where we will listen and wait for someone to connect.

    *   `FileMale.exe` will be the malicious file generated and located in the `/tmp`
    folder of the Kali machine.


    ## SETTING UP A SIMPLE SERVER

    Once the malicious file is generated, we create a fictitious web server on which
    to host it, so that it can be easily downloaded from the target machine. We should
    type the following command from a Kali terminal:

    ![](image1634.jpg)

    In doing so, we placed a rudimentary web server listening on port `8000`.


    ## PREPARATION OF THE EXPLOIT/PAYLOAD

    Once the Web server is listening, we should move on to the exploit and payload
    configuration in Metasploit. Pay attention to the difference between `EXPLOIT`
    and `PAYLOAD`. An exploit allows us to take advantage of a given vulnerability.
    A payload is a piece of code that will be executed by using the `EXPLOIT` command.


    We start `msfconsolle` and select the exploit we want to use. In this specific
    case, we are referring to the following one (multi / handler):

    ![](image1642.jpg)

    We press the "send " button and choose the payload:

    ![](image1646.jpg)

    After this step, we must enter all the parameters needed for our configuration.
    Enter the `show options` command and verify the required information, i.e. where
    the "Required" field is on "Yes".

    ![](image1650.jpg)

    Therefore, we set `LHOST` and `LPORT` as follows:


    *   type `set LPORT 192.168.1.133` or our IP address as well as the one of the
    attacking machines.

    *   type `set LPORT 8080`, which is the port we selected earlier in `msfvenon`.


    We can then type the command `EXPLOIT` to execute the exploit. We are now ready
    to receive the connection from the victim machine and we are waiting for it to
    connect.


    ## HOST COMPROMISSION

    We now simulate the user who downloads and runs the malicious file hosted on our
    Web server. We start by typing the following URL in the victim machine’s browser:

    ![](image1663.jpg)

    Download the file locally and run it. At this point, if we go back to the Kali
    machine and to Metasploit, we can see that a connection has been made:

    ![](image1668.jpg)

    We can finally start the interaction with the victim machine. With the `sessions
    -l` command we are able to see which are the active connections and their IDs;
    then with the `session -i ID` command we access the one of interest to us.

    In this case, we aim at the connection with ID `1`, the only active one:

    ![](image1673.jpg)

    Now it is almost as if we were in a DOS window in the victim machine and we can
    then perform all sorts of actions. The host compromission was successful.

    ![](image1677.jpg)


    ## SERVICE-SIDE EXPLOITATION

    We will analyze another type of exploitation called “service-side”. We will exploit
    a vulnerability present on an old version of an audio software for Windows operating
    systems, called ICECAST (http://icecast.org/). Here are the steps we will take:


    1.  Installation of ICECAST 2.0.0 on the victim machine.

    2.  Initial configuration of Metasploit.

    3.  Sending the exploit and active meterpreter session.

    4.  Active shell meterpreter on the Icecast memory process.

    5.  Use of meterpreter to access the victim machine.


    ### ICECAST INSTALLATION ON WINDOWS

    Download the version 2.0.0 of this software from the icecast.org website and install
    it on the victim machine:

    ![](image1691.jpg)

    We now include Icecast to create an exception in the Windows section related to
    the "program execution protection ":

    ![](image1695.jpg)


    ### METASPLOIT INITIAL CONFIGURATION

    First of all, let''s search for an exploit related to Icecast in Metasploit by
    running the search command:

    ![](image1700.jpg)

    We can see that the exploit is present, and that is why we can choose it:

    ![](image1704.jpg)

    Now we need to specify what payload we want to use:

    ![](image1708.jpg)

    Now it is necessary to configure Metasploit by running the show options command
    as you can see here below:

    ![](image1712.jpg)

    In particular:


    *   `RHOST`, namely the IP address of the victim machine.

    *   `LHOST`, basically IP address of the attacking machine.


    We can conclude what follows:

    ![](image1722.jpg)

    ![](image1727.jpg)


    ### HOST COMPROMISSION

    We are ready to perform our attack. Let''s go to the victim machine and start
    Icecast:

    ![](image1732.jpg)

    Now let''s go back to the attacking machine and type the `exploit` command to
    start what we have just configured. If each step was correctly executed, we should
    have an open session and a successful attack:

    ![](image1737.jpg)

    Now we can access the meterpreter shell, as we did previously with the `session
    -i ID` command:

    ![](image1741.jpg)

    We can then run all the commands available in the meterpreter shell:


    *   `SYSINFO` to gather more information on the operating system.

    ![](image1748.jpg)

    *   `GETUID` to view which user we are using to connect to the machine.

    ![](image1755.jpg)

    *   `SHELL` to access the local command prompt.

    ![](image1761.jpg)

    *   `SCREENSHOT` to capture a screenshot of the victim machine.

    ![](image1767.jpg)

    *   `PS` to check all the processes running on the victim machine.

    ![](image1773.jpg)

    Among these, we can spot the "Icecast" process, which is currently active on the
    victim machine:

    ![](image1777.jpg)

    We can now migrate to another process. We will see this operation in detail in
    the next chapter, but we can get ready in advance by migrating to the notepad
    process started on the victim machine:

    ![](image1781.jpg)

    The `notepad.exe` process has ID `2708`, while the `Icecast2.exe` process is identified
    by ID `2808`. Now let''s try to migrate the Icecast process to the notepad one.
    To do this, execute the `migrate` command:

    ![](image1785.jpg)

    If I closed the notepad application now, I would lose the connection. You are
    free to try out other combinations and commands of the meterpreter shell.


    ## POST-EXPLOITATION

    Now that the host has been compromised, we need to look into all the activities
    that we should carry out after the exploitation. Among these, here are the most
    important:


    *   Privilege escalation.

    *   Access maintenance.

    *   Data collection.

    *   Cyclic process of network scanning to new hosts.

    *   Repeated exploitation towards new hosts.


    ### PRIVILEGE ESCALATION

    When we can access a host, we often do not have the highest privileges. We are
    simple users who are not authorized to perform any particular actions. This sub-phase
    is meant to scale our privileges to the highest layer. In machines with Windows
    as their operating system, we will have to become an "Administrator" or "SYSTEM".
    With Linux as an operating system, your privilege should reach the level of "root".


    ### MAINTINING ACCESS

    A session established with a compromised host can accidentally be closed. This
    situation leads to our loss of control over it. There might be several reasons:
    the user restarted the PC, the process crashes, or the exploited application is
    closed. It is therefore important to make our session persistent so that we can
    access the host whenever we want.


    ### DATA COLLECTION

    Within the host we can find sensitive and important information. These must be
    collected and organized so that they can be included in the final report we will
    deliver to our client. This is often the only real strong demonstration to the
    management of how serious a network breach can be, and how it is necessary to
    adequately protect the network.


    ### CYCLICAL SCANNING AND EXPLOITATION PROCESS

    Generally speaking, every time we access a new host, we need to follow again all
    the steps we have seen in the previous chapters. Basically, here is what we will
    do:


    *   Network scanning.

    *   Banner grabbing.

    *   Enumeration.

    *   Vulnerability assessment.

    *   Exploitation.

    *   Post exploitation.

