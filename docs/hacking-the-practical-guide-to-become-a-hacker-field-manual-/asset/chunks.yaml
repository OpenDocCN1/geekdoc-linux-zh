    现在，让我们重点关注主机发现阶段。我们必须指示 `Nmap` 不要执行任何类型的端口扫描，仅检查网络上哪些主机是活跃的。这是一个基于 `ARP` 协议和 MAC
    地址的 2 层扫描。`-sn` 是你应该使用的用于指示 `Nmap` 的选项。这就是为什么我们应该启动此命令：![](img/image1021.jpg)


    `192.168.1.100-150` 是我们想要测试的 IP 地址范围。我们处理的可能是单个地址，也可能是一个子网。我们始终可以通过 `Nmap` 控制局面并检查发生什么的情况：![](img/image1026.jpg)


    正如我已经指出的，这种类型的 2 层扫描仅在与 MAC 地址进行通信的本地环境中才有意义。在局域网（LAN）之外，我们只使用 IP 地址，因此网络扫描被设置在更高的级别，即网络层“
    3 层扫描”。


    ## 3 层网络扫描的有用发现


    - 使用 IP 地址而不是主机名更好，这样可以避免进行 DNS 查询并可能改变已获得的结果。我们显然需要设置一些限制。

    - 在处理托管多个网站的 Web 服务器时，使用主机名和 DNS 解析是有意义的。

    - 对于大型网络，完成扫描可能需要更长时间。因此，建议使用较小的网络样本，或仅关注一小范围的端口。


    ## 使用 NMAP 进行 PING 扫描


    现在我们转向最简单的 3 层扫描。为了实现这一点，我们将使用名为 `ICMP`（互联网控制消息协议）的特殊协议，这意味着我们没有使用 `TCP` 或 `UDP`
    协议。`ICMP` 执行各种控制功能，包括验证网络内特定主机的可用性。要做到这一点，我们使用 `PING` 命令，并通过 `-c` 选项指定我们要向目标机器或网络发送的
    `ICMP` 数据包数量![](img/image1041.jpg)


    下面可以看到目标机器已对我们的命令做出响应，因此在网络中是活跃的![](img/image1046.jpg) 不要忘记用 `Wireshark` 检查网络流量。你还应该使用
    `"icmp"` 过滤器![](img/image1050.jpg) Wireshark 清晰地向我们展示正在使用 `ICMP` 协议，数据包交换如下：


    - Echo request（显性请求）。攻击主机向目标机器发送了 `ICMP` 数据包。

    - Echo reply（显性响应）。目标机器向攻击主机发送了响应包。


    ## TCP 和 UDP 协议


    我们到为止已经提到了 ISO/OSI 模型的 2 层（ARP 发现）和 3 层扫描。现在我们将检查传输层的第 4 层。传输层主要由 2 个协议组成：`TCP`
    和 `UDP`。这两个协议之间的主要区别是 `TCP` 是一个面向连接的协议，而 `UDP` 没有连接。基本上，当我们需要使用 `TCP` 时，必须通过在两部分之间建立连接来完成。它们都应该想要并能够相互通信，否则将没有信息交换。


    从这里，我们可以很容易推断出 `TCP` 是一个可靠的协议，除了少数且可管理的异常情况外，它还能让我们确认收到的所发送信息。相反，使用 `UDP` 时，我们没有确定性。另一方面，`UDP`
    是一个非常快的协议，而 `TCP` 由于其必须执行的所有额外检查，效率较低。让我们看看哪些字段构成了 `TCP` 和 `UDP` 数据包![](img/image1069.jpg)


    ### TCP 控制标志


    如上一节所示，`TCP` 协议执行连接检查。为了做到这一点，它在网络包中使用一系列额外信息，我们对所谓的“TCP 标志”感兴趣。共有六个：


    - `SYN`

    - `ACK`

    - `RST`

    - `FIN`

    - `PSH`

    - `URG`


    `SYN` 和 `ACK` 是最重要的 `TCP` 标志，因为它们参与了“三次握手”。该过程允许 `TCP` 协议建立通信。`RST` 标志的存在表明我们需要重置连接。这可能是由于连接错误导致的，而
    `FIN` 标志表示发送者不应再接收其他数据。


    ## 三次握手


    此连接创建过程完全基于 `SYN` 和 `ACK` 标志。假设我们有两台机器：


    - `PC A`：想要建立连接。

    - `PC B`：正在等待连接建立。


    交换过程如下：


    - `PC A` 设置数据包的 `SYN` 标志并将其发送给 `PC B`。

    - 一旦 `PC B` 接收到它，它就会设置发送给 `PC A` 的数据包的 `SYN` 和 `ACK` 标志。

    - 当 `PC A` 接收到 `SYN-ACK` 时，它向 `PC B` 发送带有 `ACK` 标志的数据包。

    - 如果一切顺利，连接应该正确建立。


    三次握手是两个实体之间的数据包交换，它们使用 `TCP` 标志（`SYN` 和 `ACK`）来组织它们的通信。我们可以在 `Wireshark` 上找到所有需要的信息，如下下方的截图所示![](img/image1098.jpg)
    25 号数据包具有 `SYN` 标志，26 号是带有 `SYN` 和 `ACK` 的副本，27 号带有 `ACK` 开始通信。这是第一个数据包的截图。


    ## 创建自定义数据包


    有许多软件选项允许创建和修改在网络中传输的数据包（包构造）。"Colas Packet Builder" 允许我们选择要创建或修改的类型![](img/image1109.jpg)
    在选择类型后（例如 `TCP`），让我们开始创建一个数据包![](img/image1114.jpg) 除其他项目外，我们可以设置之前提到的 `TCP` 标志![](img/


    1118.jpg)


    ## 4 层网络扫描 - CONNECT 扫描


    现在我们将学习最简单的 4 层扫描技术：CONNECT 扫描。这种扫描类型建立了 `TCP` 连接。换句话说，它完成了三次握手，使得扫描很大且容易被识别。建议使用
    `KFSensor`、`Wireshark` 和 `Nmap` 来进行这种模拟：


    1. 启动 `KFSensor` 并选择要监控的服务，例如端口 80。

    2. 启动 `Wireshark` 并找到正确的网络接口，过滤 `TCP`。

    3. 启动 `Nmap` 然后运行扫描![](img/image1129.jpg)


    通过 `Wireshark` 我们应该确认扫描已经发生![](img/image1133.jpg) 作为测试，我们可以验证扫描也被 `KFSensor` 检测到了![](img/image1138.jpg)


    ## 4 层网络扫描 - SYN 扫描


    现在让我们检查 SYN 类型扫描，与 CONNECT 类型不同，它没有完全完成三次握手。我们几乎可以说它完成了一半。交换过程如下：


    - 攻击者发送一个设置了 `SYN` 标志的数据包。

    - 受害者响应一个带有配置好的 `SYN` 和 `ACK` 标志的数据包。

    - 攻击者此时此时不完成握手，而是发送一个带有 `RST` 标志的数据包。这将强制重置连接且不完全建立。


