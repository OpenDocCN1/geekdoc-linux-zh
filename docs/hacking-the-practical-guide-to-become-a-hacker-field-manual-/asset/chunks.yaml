    # Linux Commands\n\nIn the previous chapter, I helped you set up your penetration\
    \ testing lab and I bet now you look forward to using it! But, first, let me show\
    \ you some basic Linux commands that will be useful to us later. You can, and\
    \ I encourage you to do so, put them into practice using the Kali Linux machine\
    \ we created earlier.\n\n## BASIC COMMANDS\n\nThese are the most common commands\
    \ that you will probably use for your routine tasks.\n\n- **Command to execute**:\
    \ `ls`\n  **Explanation**: this command allows you to list the contents of files\
    \ and/or folders.\n- **Command to execute**: `pwd`\n  **Explanation**: the current\
    \ directory is printed.\n- **Command to execute**: `cd`\n  **Explanation**: it\
    \ allows you to access the selected folder.\n- **Command to execute**: `cp`\n\
    \  **Explanation**: it allows you to copy files.\n- **Command to execute**: `mkdir`\n\
    \  **Explanation**: it allows you to create a folder.\n- **Command to execute**:\
    \ `rmdir`\n  **Explanation**: it allows you to remove a folder.\n- **Command to\
    \ execute**: `touch`\n  **Explanation**: it allows you to create a file.\n- **Command\
    \ to execute**: `tar`\n  **Explanation**: it creates an archive for a certain\
    \ file.\n- **Command to execute**: `clear`\n  **Explanation**: it allows you to\
    \ return to an initial shell.\n- **Command to execute**: `adduser`\n  **Explanation**:\
    \ it allows you to add a new user.\n- **Command to execute**: `chmod`\n  **Explanation**:\
    \ it manages file and/or folder permissions.\n- **Command to execute**: `vi`\n\
    \  **Explanation**: it allows you to edit a file.\n- **Command to execute**: `cat`\n\
    \  **Explanation**: it allows manipulation of a file.\n- **Command to execute**:\
    \ `grep`\n  **Explanation**: it searches a file for particular patterns.\n- **Command\
    \ to execute**: `apt-get`\n  **Explanation**: package management. For example,\
    \ `apt-get install`.\n\nHere above is a complete list of all the basic commands\
    \ you should try out. They can help you to carry out the exercises I will propose\
    \ to you in later chapters. You would be better to master them correctly.\n\n\
    ## NETWORK COMMANDS\n\nWorking as an ethical hacker requires you have a strong\
    \ knowledge of the most common network commands. In the rest of the book, I will\
    \ show you some of the most important ones. Try them out and you might even end\
    \ up creating new combinations.\n\n- **Command to execute**: `ifconfig`\n  **Explanation**:\
    \ utility to configure network interfaces. It will be very useful to view the\
    \ IP address assigned to a machine.\n- **Command to execute**: `traceroute`\n\
    \  **Explanation**: this command allows you to trace the path of an IP packet\
    \ to the host network. It is very useful for performing troubleshooting activities\
    \ such as, for example, verifying where in the path a certain IP packet stops\
    \ or is lost.\n- **Command to execute**: `dig`\n  **Explanation**: this is a utility\
    \ needed to query DNS. There would be plenty of other things to say about this\
    \ command and its functioning is quite complex. You will understand its mechanisms\
    \ better in the next few chapters when I will explain what a DNS is and how we\
    \ can organize an attack against it.\n- **Command to execute**: `telnet`\n  **Explanation**:\
    \ this command allows us to make connections to remote hosts via the TELNET protocol.\
    \ I want to clarify that this protocol allows a clear visualization of data without\
    \ any encryption mechanisms. For this reason, it is not a very secure protocol.\n\
    - **Command to execute**: `nslookup`\n  **Explanation**: this is another utility\
    \ to interrogate DNS and to perform inverse resolution queries. In our exercises,\
    \ we will often use this command.\n- **Command to execute**: `netstat`\n  **Explanation**:\
    \ this is a command of the utmost importance. It allows you to view the network\
    \ connections opened at a certain time. Useful in troubleshooting, it allows us\
    \ to verify anomalies due to network connections that were not established or\
    \ lost. Here again, take some time to improve your knowledge of this tool.\n-\
    \ **Command to execute**: `ifup`, `ifdown`\n  **Explanation**: this command allows\
    \ you to enable or disable network cards. It can be very useful in certain situations,\
    \ perhaps when a reboot of network services is required.\n- **Command to execute**:\
    \ `ping`\n  **Explanation**: the PING command is used to check whether a certain\
    \ host is active or not by sending special ICMP type packets to it and waiting\
    \ for a response. Let me remind you that we have already used it in our penetration\
    \ testing lab to verify the connectivity between the various virtual machines.\n\
    - **Command to execute**: `route`\n  **Explanation**: this command is used to\
    \ display the routing table of a certain host, namely the paths that the network\
    \ packets must perform on the network or on particular subnets.\n- **Command to\
    \ execute**: `arp -a`\n  **Explanation**: the ARP -A command provides us with\
    \ a table of the links between a MAC address and an IP address. For example, it\
    \ can be used when we want to exclude problems concerning the lower levels of\
    \ the ISO/OSI model (data level).\n\nHere are all the commands related to networking.\
    \ Of course, this list does not include them all, there would be much more to\
    \ say. However, you will do great later if you begin to become familiar with these\
    \ commands.\n\n## COMMANDS RELATED TO SYSTEM MANAGEMENT\n\nLet's now move on to\
    \ the last part of the Linux commands, which are related to the ordinary management\
    \ of your Linux machine.\n\n- **Command to execute**: `uptime`\n  **Explanation**:\
    \ this command shows you for how long a certain system has been active.\n- **Command\
    \ to execute**: `users`\n  **Explanation**: this command shows the user names\
    \ of users connected to a system.\n- **Command to execute**: `who`, `whoami`\n\
    \  **Explanation**: this is another command that informs us of how many users\
    \ are connected to the system as well as some additional information.\n- **Command\
    \ to execute**: `crontab -l`\n  **Explanation**: this command allows the display\
    \ of scheduled jobs related to the current user. We will see later what the jobs\
    \ are.\n- **Command to execute**: `less` / `more`\n  **Explanation**: this command\
    \ is very useful because it allows you to quickly view a file. Press the \"q\"\
    \ key to exit this particular display.\n- **Command to execute**: `ssh`\n  **Explanation**:\
    \ this command allows the connection to a remote host via an SSH protocol. The\
    \ latter, unlike the TELNET one, carries out data encryption. For this reason,\
    \ in the event of traffic interception, it will not be possible to clearly see\
    \ any data.\n- **Command to execute**: `ftp`\n  **Explanation**: this command\
    \ allows the connection to an FTP server via the FTP protocol. This protocol does\
    \ not perform data encryption, so you need to pay attention when using it.\n-\
    \ **Command to execute**: `service start`, `stop`\n  **Explanation**: this command\
    \ allows you to start or stop a certain service. You will use it on many occasions.\n\
    - **Command to execute**: `free -h`\n  **Explanation**: this command shows the\
    \ amount of free and used memory. For example, it can be used when there are performance\
    \ problems on a machine.\n- **Command to execute**: `top`\n  **Explanation**:\
    \ this command allows you to check the active processes in a system. It can be\
    \ useful if a machine is running very slowly for no apparent reason.\n- **Command\
    \ to execute**: `ps`\n  **Explanation**: with this command you can view the active\
    \ and running processes in a system.\n- **Command to execute**: `kill`\n  **Explanation**:\
    \ this command is used to terminate a certain process.\n\n[/content]![](image271.jpg)If\
