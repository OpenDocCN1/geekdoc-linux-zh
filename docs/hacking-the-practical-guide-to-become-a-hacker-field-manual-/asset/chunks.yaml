  trans: '


    在主动模式下，我们直接与目标进行交互。`Nmap` 是主动模式下常用的工具。相反，被动模式会监听网络流量。根据每个操作系统的特征，我们可以获取相当精确的信息。在此模式下工作的工具是
    "P0f" (https://it.wikipedia.org/wiki/P0f)。


    # 使用 NMAP 进行操作系统检测


    让我们看看如何使用 `Nmap` 检测特定机器的操作系统。要使用的选项是 `-o`，因此我们需要执行的命令将是：：

    ![](img/image1308.jpg)


    通过运行此命令，我们将只检查前 100 个端口并尝试检测操作系统。结果如下：

    ![](img/image1313.jpg)


    `Nmap` 能够识别出正在使用的操作系统可能是 Windows，具体版本为 7、2012 或 8.1。若需了解更多细节，你可能还需要需要使用其他工具。


    # 使用 XPROBE 进行操作系统检测


    `XPROBE` 是另一个用于检测操作系统的有用工具。这是我们应该执行的命令：

    ![](img/image1320.jpg)


    我们应该看到以下结果：

    ![](img/image1324.jpg)


    我们面对的是一个 Linux 操作系统，内核可能为 2.6.11。


    # 使用 P0F 进行操作系统检测


    正如预期的那样，该工具允许执行被式操作系统检测。在这种情况下，我们不需要直接与目标机器交互。我们需要捕捉一些网络流量，以便 `P0f` 能够完成检测过程。这是我们应该执行的命令：

    ![](img/image1331.jpg)


    我们按下 "send " 并让工具挂起：

    ![](img/image1335.jpg)


    我们使用例如 `netcat` 来生成随机流量：

    ![](img/image1339.jpg)


    如果生成的流量足够 `P0f` 使用，我们将看到这个屏幕：

    ![](img/image1343.jpg)


    如你所见，`P0f` 告诉我们机器上正在使用的操作系统版本。


    # 枚举


    枚举是渗透测试过程中的一个重要阶段。它包含利用特定服务的特性来获取尽可能的信息。某些服务非常适合此类调查，例如：


    *   `SMTP`，TCP 端口 25。

    *   `DNS`，UDP 端口 53。

    *   `SNMP`，UDP 端口 161。

    *   `NETBIOS`，UDP 端口 137,138；TCP 端口 139。


    在本章中，我们将检查与以下服务的枚举：


    *   `NETBIOS` 枚举。

    *   `DNS` 枚举。

    *   通过 `DEFAULT PASSWORD` 进行枚举。


    # 使用 NETBIOS 进行枚举


    `Netbios` 是一种运行在 ISO/OSI 模型会话层的协议。该协议允许我们探索计算机、打印机或文件的网络资源。我们可以使用 `Netbios` 提取几项信息，包括：


    *   主机名。

    *   用户名。

    *   域。

    *   打印机。

    *   可用网络文件夹。


    首先，我们应该使用 `Nmap` 确认 TCP 端口 139 和 445 确实已开启：

    ```

    nmap -v -p 139,445 192.169.1.120

    ```

    完成这一步后，我们可以使用特殊命令 `NBTSCAN` 来调查开启了端口 139、445 的系统。

    ![](img/image1377.jpg)


    我们有一整系列提取出的 `NETBIOS` 信息。我们可以参考另一个 Windows 命令 - "net view" - 继续继续对特定主机进行调查：

    ```

    net view 192.168.1.10

    ```

    它给了我们目标机上的共享资源列表。`net use` 命令允许我们访问这些资源。`Nmap` 包含许多可以枚举 `NETBIOS` 的脚本。你可以在以下路径找到它们：`/usr/share/nmap/scripts`。

    ![](img/image1385.jpg)


    这些是我们需要验证任何 `NETBIOS` 漏洞的脚本：


    *   `smb-vuln-conficker`

    *   `smb-vuln-cve2009-3103`

    *   `smb-vuln-ms06-025`

    *   `smb-vuln-ms07-029`

    *   `smb-vuln-regsvc-dos`

    *   `smb-vuln-ms08-067`


    # 使用 DNS 进行枚举


    在信息收集的章节中，我们学习了如何使用 `DIG` 工具执行 DNS 区域传输。现在让我们继续另一种 DNS 枚举技术，我们将使用另一个名为 `DNSENUM`
    的工具。通过单个命令，我们可以提取不同的 DNS 记录，如下：


    *   `SOA`

    *   `A`

    *   `MX`

    *   `NS`

    *   `CNAME`

    *   `PTR`

    *   `HINFO`

    *   `TXT`


    我们需要运行此命令：

    ```

    dnsenum domain.com

    ```

    ![](img/image1426.jpg)


    # 使用默认密码进行枚举


    网络设备——如路由器和交换机——通常都有默认密码。这些密码由设备制造商直接定义。我显然建议你尽快更改它们。`DefaultPassword` 是存储设备默认密码的众多之一
    (https://default-password.info/)。这个网站非常好用。你只需要选择设备型号和制造商：

    ![](img/image1433.jpg)


    # 漏洞评估


    得益于网络扫描、指纹识别（banner grabbing）和枚举，到此时我们应该对网络上运行的服务类型有非常很好的了解。现在是时候寻找任何漏洞了，我们将使用特定工具来执行这项活动。这项研究的一部分应该手动进行，而我们可以使用某些工具自动处理此过程的其他部分。


    在此链接处，你可以找到 SANS 编写详细报告，其中列出了我们执行漏洞评估时应该采取的所有步骤：https://www.sans.org/reading-room/whitepapers/basics/vulnerability-assessment-421。我还想澄清，与漏洞评估不同，渗透测试的额外目的是利用发现的漏洞。我们将在与利用和后渗透相关的章节中查看每个阶段的细节。


    以下是我们将使用的工具列表：


    *   `Nessus`. https://www.tenable.com/products/nessus-vulnerability-scanner.

    *   `Nexpose`. https://www.rapid7.com/products/nexpose/.

    *   `OpenVAS`. http://www.openvas.org/.


