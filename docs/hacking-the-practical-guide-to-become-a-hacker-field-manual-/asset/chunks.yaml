    # 权限提升


    让我们从上一章学到的内容重新开始。假设我们已经在目标机器上建立了一个非持久性的 meterpreter 会话。用户可以通过该会话允许通信启动的进程将其关闭。我们应该首先迁移到一个更稳定的进程，该进程更有可能保持活动状态。你可以自动或手动进行此操作。


    在自动模式下，我们需要输入以下命令：

    ![](img/image1826.jpg)


    我们需要手动生成所有运行进程的列表，选择我们需要的进程并记录其 ID。然后，通过 `migrate ID` 命令，我们可以如下所示执行迁移：

    ![](img/image1830.jpg)


    我们现在对在目标主机上保持连接的持久性感兴趣。需要注意的第一点是，连接的持久性与我们在同一台机器上拥有的权限类型直接相关。


    因如此，我们还应该尝试提升权限。这些情况下使用的命令是 `get system`，它将依赖一组技术来提升我们的权限，直到找到适合实现我们目的的方法。

    ![](img/image1836.jpg)


    我们可以执行 `getuid` 命令来确定权限提升是否成功。下面的截图就是一个例子，在其中我们已经变成了 SYSTEM 用户。

    ![](img/image1840.jpg)


    ## 禁用 UAC 时的权限提升


    在 Windows 7 和更高版本的操作系统上执行权限提升时，必须考虑一种可能会为我们带来一些困难的安全机制。我指的是 UAC（用户账户控制），它允许管理员用户在标准用户会话期间执行管理任务。


    如果启用了 UAC，在我们不先采取其他操作的情况下是不可能执行权限提升的。要检查特定主机上的 UAC 是否激活，进入 `控制面板` -> `操作中心` ->
    `更改用户账户控制设置`。

    ![](img/image1849.jpg)


    作为第一个测试，让我们禁用 UAC 并执行权限提升。

    ![](img/image1853.jpg)


    如预期，我们能够在禁用 UAC 的情况下执行权限提升。


    # 启用 UAC 时的权限提升


    我们应该通过检查 UAC 是否启用来开始权限提升。允许我们执行此任务的 Metasploit 模块被称为 `win_privs`。

    ![](img/image1859.jpg)


    在上面的示例中，UAC 已禁用。`UAC Enabled` 字段被设置为 FALSE。现在让我们用默认设置启用 UAC。

    ![](img/image1864.jpg)


    我们可以再次启动 UAC 验证命令：

    ![](img/image1868.jpg)


    这次 `UAC Enabled` 字段显示 UAC 已启用。我们现在可以尝试使用 `getsystem` 命令进行权限提升：

    ![](img/image1872.jpg)


    如预期，操作失败了。有一个名为 `bypass UAC` 的 Metasploit 模块，它允许我们绕过这个障碍。请记住，只有当 UAC 设置为默认级别而不是最高级别时，该模块才有较大的成功概率。

    ![](img/image1877.jpg)


    通过输入 `show options` 命令，我们可以看到所需的设置。特别是，我们必须输入我们所在会话的 ID。我们可以通过输入 `session -l`
    命令并固定 ID 来这样做。假设我们正在处理会话 ID 2，您应该输入 `set session 2`。

    ![](img/image1881.jpg)


    最后，我们可以使用 `exploit` 命令启动 bypassuac 模块并等待几秒。如果命令成功，我们需要通过输入 `sessions -l` 命令找到一个新的会话。然后我们可以使用
    `getsystem` 命令提升权限，并用 `getuid` 进行验证。

    ![](img/image1886.jpg)


    # 凭据哈希导出 (HASHDUMP)


    在这种情况下，典型的操作是获取凭据哈希值。哈希是根据特定密码并基于加密算法生成的唯一字符串。如果哈希值不够强，可以通过逆向工程过程来恢复初始密码。


    假设我们拥有一个具有管理员权限的活动会话，并输入 `hashdump` 命令：

    ![](img/image1893.jpg)


    从上面的截图中可以看出，我们恢复了用户 "Administrator"user1" 和 "guest" 的哈希值。你最终可以从这些哈希值开始尝试密码恢复（密码破解）。


    # 本地漏洞建议 (LOCAL EXPLOIT SUGGESTER)


    我们在本书之前的章节中学习了 `getsystem` 命令可以让主机获取最高权限。然而，如果此命令无效，我们可以依靠 Metasploit 模块，该模块会对机器进行枚举，寻找具有高成功率的漏洞。该模块如下：

    ![](img/image1901.jpg)


    我们总是需要在活跃的 meterpreter 会话中启动它。以下是建议的漏洞列表：

    ![](img/image1905.jpg)


    现在你可以开始尝试其中的一些，直到找到适合实现你目标的漏洞。例如，我们可以使用以下漏洞：

    ![](img/image1909.jpg)


    像往常一样，我们如下设置 payload：

    ![](img/image1913.jpg)


    在这里你可以看到 `EXITFUNC`、`LHOST` 和 `SESSION`（始终通过输入 `show options` 命令来验证设置）：

    ![](img/image1917.jpg)


    我们可以输入 `exploit` 来启动攻击。一旦我们成功，我们将变成 SYSTEM 用户：

    ![](img/image1921.jpg)


    # 使用 MIMIKATZ 模块


    Metasploit 中的 `Mimikatz` 工具将允许我们收集登录机器的凭据。我们应该依赖于已建立的 meterpreter 会话并拥有 SYSTEM
    权限。


    首先，应该使用 `load mimiakatz` 命令加载 Metasploit 中的模块。然后我们需要输入 `wdigest` 命令，我们应该看到以下屏幕：

    ![](img/image1928.jpg)


    密码已直接从系统内存中哈希化，我们已经获得了用户凭据。


    # 在目标系统上安装后门


    我们现在可以在目标系统上安装“后门”，以使 meterpreter 会话更稳定。这也允许我们在认为适当的随时返回目标系统。然而，请记住，在完成客户要求的任务后将其移除。


    首先，我们的 meterpreter 会话应该已经配置 `SYSTEM` 或 `Administrator` 权限。


    我们将使用的后门将安装在目标机器的注册表中，并可以在每次机器启动时启动它。该模块被称为 `PERSISTENCE`，这些是可用选项：

    ![](img/image1938.jpg)


    特别是：

    ![](img/image1942.jpg)


    每个选项的详细定义如下：


    *   `-X` 选项在每次系统启动时启动后门。

    *   `-p 8081` 选项是攻击系统监听的端口。

    *   `-r` 选项指定攻击机器的 IP 地址。

    *   `-i 5` 选项是每次连接尝试之间的间隔（秒）。


    '
- fmt: '

    Below we can see the registry keys on which the backdoor is installed:

    ![](image1956.jpg)


    We can now try to reboot the target machine and verify that a meterpreter shell
    is automatically created. If we drop the session, it will be re-established after
    5 seconds thanks to the `-i 5` option which we mentioned earlier.


    # INTERNAL NETWORK MAPPING


    The next step in the exploitation phase is the mapping of the internal network
    to discover other possible hosts. The first useful command is `ipconfig`, which
    helps us to get an overview of any network interfaces available.


    Then, we can use the `route print` command to analyze the routing table of the
    machine and start to map the internal network.

    ![](image1964.jpg)


    The `arp -a` command gives us evidence of all the machines connected to that particular
    network segment.

    ![](image1968.jpg)


    You can see the active network connections by entering the `netstat -an` command:

    ![](image1972.jpg)


    We can run an ARP-scan on the entire subnet directly from the meterpreter shell:

    ![](image1976.jpg)


    We can otherwise execute a ping sweep command to discover other new machines connected
    to that specific subnet:

    ![](image1980.jpg)


    # The Final Report


    It is time now to send the client a final report with your feedback on all accomplished
    tasks. It is important to stress how fundamental this part is. We need to present
    in a clear and complete manner all the information we gathered as well as each
    suggestion that could help to correct the weaknesses we spotted.


    In addition to the list of vulnerabilities found and exploits used, we should
    include a part related to the so-called "remediation". This part is meant to show
    the customer all the possible remedies for the risks we discovered.


    It would be better to start the report with a general overview of the actions
    taken and then gradually enter into detail. In this way, the report becomes easier
    to read for members of the management board and non-technicians, who will be able
    to understand exactly what is been reported.


    Although we can also include other parts, a well-structured report usually consists
    of the following sections:


    * Executive summary.

    * Methodology used.

    * Detailed analysis of the results.


    ## EXECUTIVE SUMMARY


    The executive summary is the report that can be understood even by non-technical
    staff, for example by managers. First of all, we should define the scope and the
    estimated duration of this task. By defining the scope of this task, we want to
    know exactly what type of penetration test we should perform and even more importantly
    what are the IP addresses or websites that we should include.


    We must point out the evidences found and their level of criticality. We also
    need to prepare a graph showing the risk distribution according to the different
    variables:

    ![](image2005.jpg)


    ## METHODOLOGY


    The methodology used integrates all the phases from the definition of the test
    scope to the final report. We can summarize the procedure as follows:


    * Definition of the test scope.

    * Information gathering.

    * Network scanning.

    * Vulnerability assessment.

    * Exploitation.

    * Post exploitation.

    * Other optional tests.

    * Drafting of the report also through the use of automatic tools, for example
    with Dradis. (`https://dradisframework.com/ce/`).


    As a side note, the report must also contain all the results you achieved that
    were related to the Web, including the `SQL Injection` and `XSS Cross Site Scripting`,
    which were not explained in this book. You might also want to include the social
    engineering techniques you eventually used.


    ## DETAILED ANALYSIS OF THE RESULTS


    The first task to complete in this sub-phase is defining the risk level of the
    various vulnerabilities you detected:

    ![](image2024.jpg)


    Then you can enlist all the vulnerabilities:

    ![](image2028.jpg)


    You can then conclude your report by mentioning the solutions and the suggestions
    that could help to block these risks and eradicate these problems.

