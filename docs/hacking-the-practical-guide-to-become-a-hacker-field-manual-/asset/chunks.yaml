    *   DHCPOFFER. When a DHCP server receives a DHCPDISCOVER packet, it tries to
    satisfy the request and sends a DHCPOFFER packet with all the necessary network
    parameters to the MAC address of the PC (the IP is obviously still unknown).


    ![](image533.jpg)PORT AND SERVICEFor a penetration tester, it is necessary to
    have a clear understanding of the notions of door and service. We will often refer
    to these concepts in the following chapters related to the work methodology of
    an ethical hacker.We can say that both concepts of door and service are closely
    connected to each other. In order to perform its tasks, any PC needs to establish
    different types of connections with the outside world.It must rely on a dedicated
    communication channel to offer or require any service. We can imagine a door as
    the end of this channel.There are 65535 ports available but not all of them are
    used. All the ports up to the 1024th one are usually dedicated to the most common
    services. For this reason, they are also called “well-know ports".Here is an example.
    The SSH protocol’s standard port is the 22nd one, the FTP protocol uses port 21,
    and so on. You can find the list of standard ports at this link: https://en.wikipedia.org/wiki/List_of_TCP_and_UDP_port_numbers.In
    summary, each service needs a specific port to communicate with and from the outside
    world. This mechanism will have a strong impact on our actions as a penetration
    tester.In fact, a list of the open ports available on a certain PC can provide
    excellent information and a possible access to this system.If we want to see all
    the active communications within our Windows device, we need to type the "netstat
    -ano " command.![](image547.jpg)For more information on the “netstat ” command,
    you can refer to this link: https://technet.microsoft.com/en-us/library/bb490947.aspx.ARP-PING-TRACEROUTELet’s
    now turn to something more practical. I will now introduce two important commands
    which will help you in your career as a network expert.I''m referring to the "ARP,
    PING " commands. They will allow you to solve most network problems, so it is
    important to learn more about them.The first major distinction between them lays
    in the layer of the ISO-OSI model in which they operate:


    *   ARP -> between data link level (MAC address) and network layer (IP address).


    *   PING -> network layer (IP address).


    You need to get mentally prepared to face these types of situations. We can run
    into all sorts of network problems and we can make our lives easier only by identifying
    where we are exactly on the TCP/IP stack.Here I will present a working method
    that can be applied to multiple scenarios.PROBLEM: a user reports a lack of PC
    connectivity within the network.TROUBLESHOOTING:


    *   Check that the network cable of that PC is in good condition. You can try
    replacing it. ISO-OSI PHYSICAL LAYER.


    *   Check that the PC has a private IP address assigned. Run the "ifconfig" command
    on the Windows machine. ISO-OSI NETWORK LAYER.


    *   If you do not have direct access to the PC, try using another one to launch
    the "PING IP-addressPC" command where “IP-addressPC” is the IP address of the
    PC. ISO-OSI NETWORK LAYER.


    *   If the PING command does not offer a positive response, execute the ARP command
    and check the presence of the MAC/IP address association on that PC. ISO-OSI DATA
    LINK LAYER.'
