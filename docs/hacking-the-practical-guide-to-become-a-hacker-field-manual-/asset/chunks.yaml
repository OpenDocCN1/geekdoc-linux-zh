    并下载该软件。


    在此阶段，我们需要获取一个激活码来验证我们正在使用的许可证。正如这里下方的截图所示，只需点击“Get an Activation Code”（获取激活码）即可：![](img/image1458.jpg)

    你将在短后收到一封包含激活码的电子邮件。安装完成后，将打开一个浏览器窗口并指向：`http://127.0.0.1:8834`![](img/image1462.jpg)

    随后，你需要输入提供给你的激活码：![](img/image1466.jpg)

