    ![](image887.jpg)In the following screenshot, we can see the results of our search.![](image891.jpg)Luckily
    for us, this information is freely accessible and can be consulted without any
    problems.


    ## Using DNS


    We have already mentioned in the previous chapter the definition of `DNS`. Now
    we can use it to gather more information about our target. A `DNS` query is the
    simplest operation we can perform in this case. We should run the command `nslookup`,
    which we can use to ask the `DNS` to show us the association between hostname
    and IP address.![](image898.jpg)


    Another command we can execute on Linux systems is `DIG`. This command allows
    us to gather different information and interrogating `DIG` is a very simple task.


    ```

    dig www.sitoweb.it

    ```


    Now, let''s try to understand what `DNS` zone transfer is and how it works. To
    run a simulation and understand how it works, you can try installing a `DNS` server
    on a `Windows Server` machine. On the Microsoft website, you can find all the
    details you need (https://technet.microsoft.com/it-it/library/cc725925(v=ws.11).aspx).
    The steps to be performed on a `Windows Server 2012` system are as follows:![](image908.jpg)


    Once we configured `DNS`, try to insert random records as shown on the screenshot
    here below:![](image912.jpg)


    The "zone transfer" activity consists of listing each record on the `DNS` server
    to which the request is sent. In other words, with a specific command, we can
    ask the `DNS` to provide us with all its records. Needless to say, we will then
    collect a substantial amount of data that can be very useful to perform our task.
    Each of these records and the IP address obtained will allow us to have a sort
    of map of the target network, which we will use in the next steps.


    We will rely on `DIG` to attempt zone transfer and this is the command we should
    launch:


    ```

    dig @ IP_Address_DNS domain AXFR

    ```

    example:

    ```

    dig @192.168.2.10 company.local AXFR

    ```


    If the command is successfully executed, you will see this result:![](image923.jpg)However,
    the zone transfer might not be enabled, and we will see the following result:![](image927.jpg)


    If the zone transfer is allowed, you will see this result after launching the
    command we have just presented:![](image931.jpg)However, it is always useful to
    try this path.


    ## Maltego and Recon-ng


    These are the tools that can automate our information gathering:


    *   `Maltego`

    *   `Recon-ng`


    They are very useful to us but not that easy to use. Once you have become familiar
    with these tools, you will not be able to complete this task without them. Here
    below, you can see a screenshot of `Maltego`:![](image942.jpg)


    We have to define objects, like the one called "Udemy.com". Starting from these,
    we then can carry out the operations we need (name resolution, identification
    of the block of IP addresses, zone transfer, etc).


    ## Shodan


    Let''s end this chapter with the presentation of `SHODAN`, which is a powerful
    search engine that allows us to find vulnerabilities and configuration errors
    on devices that are exposed on the Internet. You can access this tool at the following
    link: https://www.shodan.io/.![](image949.jpg)


    We can run queries of any kind and for this reason I invite you to read the official
    documentation. For example, we can search for all `SCADA`-type devices that have
    a Web server exposed on port `80` (`HTTP`).![](image954.jpg)


    ## Conclusion


    This is the end of the chapter concerning the first phase of the penetration test
    process. I invite you to take all the time you need to personally test each of
    these tools. This first phase is fundamental for the success of the following
    ones.


    ## Network Scanning


    The information gathering phase is over and it allowed us to collect, among other
    things, a list of IP addresses. Now it''s time to scan each of these IP addresses.
    What exactly do I mean with “scanning”? Each of these IP addresses will expose
    a certain service/port to the outside world. We need to scan them to identify
    the port corresponding to a certain active service. For example, a Web server
    will most likely have port `80` or `443` listening, so as to accept requests based
    on the `HTTP`, `HTTPS` protocol. There are several scanning techniques we can
    choose. Some of them are silent, others not that much. In this chapter, we will
    analyze some of them.


    ### KFSENSOR


    To see the network scanning techniques in action, we need to expose services on
    a specific machine, or we can use a very useful tool that make these steps easier.
    It''s called `KFSensor` and it''s a "honeypot". Honeypots are deliberately vulnerable
    machines, which are sometimes used to confuse a potential attacker. We usually
    use them to push our opponent towards this trap so that we can study and analyze
    their behavior.


    `KFSensor` is a honeypot for `Windows` operating systems. For this reason, you
    will need to install the software on a `Windows 7` or `10` virtual machine. You
    can download its 30-days free trial version from the official website: http://www.keyfocus.net/kfsensor/.![](image976.jpg)


    Once installed `KFSensor`, you can proceed with a configuration of the services
    we need. These services will then be then simulated by the software as if they
    were real.![](image980.jpg) Here we can see the list of all the simulated services
    on the machine. This list will allow us to test the various network scanning techniques.


    ### WIRESHARK


    Before starting, I suggest you install a network "sniffer", which is a tool that
    allows you to collect and analyze all network traffic. The best among the sniffers
    is undoubtedly `Wireshark` (https://www.wireshark.org/). While we will launch
    the various network scans, you can still leave `Wireshark` running, so as to observe
    what happens at the level of network traffic.![](image987.jpg)


    ### ARPING AND LEVEL 2 NETWORK SCAN


    The first thing we should mention is that the network can be scanned both at the
    data link layer and at the network layer of the ISO/OSI model. We will start from
    the one at the data link layer. Let me start by introducing the first tool we
    will use: `ARPING`. Scanning at the data link layer (level 2 makes sense only
    if carried out within a local area network (LAN). In local networks, we will mostly
    be dealing with `MAC` addresses and the `ARP` protocol.


    Now let''s connect to the `Kali Linux` machine and run a data link layer scan
    (called `ARP scan`) in the Windows machine where `KFSensor` is installed. We need
    to enter this command: `arping address IP -c 2`. Where `2` is the number of packages
    we will send, but you can enter even type any other number you want. If the machine
    is active and connected to the network, this is the screen you should see:![](image997.jpg)


    Remember to always keep Wireshark active, filter by `ARP` keyword, and analyze
    the network traffic. It would also be better to perform an analysis on both machines.![](image1001.jpg)


    ### NMAP AND LEVEL 2 NETWORK SCAN


    `nmap` is the most widespread as well as the most reliable and versatile network
    scanning tool. It allows us to perform multiple types of scans, from level 2 onwards.
    `Nmap` also contains a whole series of additional features, such as vulnerability
    scanners and modules for enumerating a system. In this section we will cover a
    level 2 scan using `Nmap`. But first I would like to show you the phases with
    which `Nmap` does its work:


    1.  Name resolution.

    2.  `NSE` script pre-scan phase.

    3.  Host discovery. We are now at this stage.

    4.  Parallel reverse name resolution.

    5.  Port or Protocol scan.

    6.  Service version detection.

    7.  OS fingerprinting.

    8.  Traceroute.

    9.  `NSE` portrule and hostrule script scanning phase.

