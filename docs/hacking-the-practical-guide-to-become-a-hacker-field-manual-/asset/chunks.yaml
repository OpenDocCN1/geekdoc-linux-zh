    # 5. Canceling the log files.


    We are getting closer to define what penetration testing is. ''Let''s keep going.PENETRATION
    TESTINGAlmost all of our work moves around following and executing this process.
    With the correct application of this knowledge, you will see much more effective
    results. You will then have higher probabilities of successfully completing your
    work as an ethical hacker.


    You might be now asking yourself a question: how should I communicate the results
    and the problems to the client? It''s easy! Do it with a report.The so-called
    final report contains each step and action that was taken as well as the useful
    suggestions to solve the vulnerabilities you spotted.


    Said this, I want to help you to grasp better the concepts seen up to this point:
    paid by the client, the ethical hacker performs a penetration testing by following
    the procedure mentioned above. After concluding this procedure, the ethical hacker
    will send a final report to the client , in which there will be mentions to all
    that has been done and found. This is the main task of an ethical hacker. In the
    rest of the book, I will show you how to reach this result. For now, just relax.
    You will see definite results; you just need to believe in this and have a little
    patience.


    ## PHASES OF A PENETRATION TESTING


    Now we will see the commonly used procedure to perform a penetration test. Here
    is the list, we will then dig deeper into each of these steps:


    1. INFORMATION GATHERING.

    2. NETWORK SCANNING.

    3. ENUMERATION.

    4. VULNERABILITY ASSESSMENT.

    5. EXPLOITATION.

    6. POST EXPLOITATION.

    7. FINAL REPORT.


    Each of these phases is necessary for the success of our work. While not compulsory,
    it is better to follow the sequence of steps of this list. Now we can start analyzing
    each of these steps in details.


    ## INFORMATION GATHERING


    I know you are thinking, "what information do I need to collect? What for?". The
    answer is immediate and straightforward: everything! It is necessary for us to
    examine multiple aspects of our target, possibly in advance. We need to understand
    what business it is, what it sells, what people work there, and what are the tools
    used. In other words, all the information we can gather will become useful for
    us at a later time. You would be better not to ignore or underestimate each of
    them.


    Another step within the information gathering phase is the analysis of the network
    infrastructure by using information in the public domain. You should avoid interacting
    directly with your target at this stage. We can instead rely on tools and platforms
    available on the Internet:


    * Google;

    * Whois search;

    * DNS;

    * Social media;

    * Metadata;

    * Websites with job listings;

    * Tools like `Maltego` and `Recon-ng`;

    * Specific browsers, like `Shodan`.


    ## NETWORK SCANNING


    The information gathered during the previous phase can help us to go deep with
    our target and start with our network scanning. Pay attention to the fact that
    in this stage, we begin to interact directly with our target, and there is the
    risk of being identified, especially if we do not take all the related precautions.
    Scanning a network is almost like finding yourself in a wide street in a big city,
    a place full of shops. All of a sudden, you start to pick the locks of each one
    of them hoping that at least one is open and unprotected. At this stage, we will
    not log into the network, and we will just acknowledge the fact that the door
    is open. It is not sure that all our activities while scanning the network will
    not be noticed.


    ## ENUMERATION


    Enumerating the network means discovering and listing all the resources available.
    Let''s imagine that during the previous phase, we found a door possibly open.
    Now we need to find out what information can be enumerated concerning the service
    linked to that door. I am aware that this definition might sound confusing, but
    the examples we will see together later should help to make it easier to understand.
    This phase is often underestimated, even if it can provide useful information.


    ## VULNERABILITY ASSESSMENT


    Now that we have discovered what doors and services are accessible, we should
    identify all the possible vulnerabilities of our target. We can rely on automatic
    tools that make our work easier. However, we can incur in a myriad of false positives
    or false negatives. Otherwise, we can perform a manual analysis if we have more
    experience in this matter. The best method is the combination of both. By alternating
    tools and manual analysis, you will see the best results.


    ## EXPLOITATION


    Spotting the vulnerabilities is not enough. What we need to do next is trying
    to exploit them so to gain access to the system. This is precisely what we will
    try to do in this phase. We will search for the gateway for each vulnerability
    that allows us to access the system. This will not always be possible, but we
    should keep each path into consideration. Performing a penetration testing is
    not only about access to a network, but it is also a much broader task. We should
    identify all access points that are not secure and inform the client to help to
    find a rapid solution.


    ## POST EXPLOITATION


    What happens if for any reason we lose the access point we worked so hard to find?
    Will we be able to access the system once again? In this phase, this is precisely
    what we worry about. Our goal is to create an access point that is always available.
    By doing this, we will be able to access our target even at a later time.


    ## FINAL REPORT


    At this point, if everything went well, our work should be considered completed.
    We should provide the client with a final report containing the summary of all
    our actions and our suggestions on how to make that network more secure. We have
    now concluded our explanation of the phases of penetration testing. In the next
    chapter, I will teach you how to create a laboratory so that you can complete
    the tests I will assign to you.


    ## The Laboratory


    Now that you have an idea of the nature of the job as an ethical hacker, we need
    to start putting into practice what we will learn in later chapters. The first
    task is to build our own laboratory. Don’t experiment the techniques I will teach
    you on contexts other than your laboratory: this is not the right way to become
    an ethical hacker! How can we build a protected environment where we can perform
    our simulations? The answer is straightforward: we can use a hypervisor. This
    consists in simultaneously executing multiple virtual machines and, therefore,
    more operating systems within the same physical system. A hypervisor makes the
    whole process much more convenient!


    ## VIRTUALIZATION


    By using these programs, you will be able to run several operating systems at
    the same time inside your PC. The only limit you have is the RAM memory you can
    use. The procedure is not difficult, even though you will need to become more
    familiar with this tool. Basically, here is the list of steps you should take:


    * Download a particular software called `hypervisor`.

    * Collect the `.iso` images of the operating systems you want to install.

    * Access the software.

    * Start the virtual machine creation process.

    * Create and boot this virtual machine.

    * Proceed with the installation of the desired operating system.

    * Use the virtual machine you have just created.


    ## HYPERVISOR


    As mentioned earlier in this book, the hypervisor is a software that allows you
    to run virtual machines inside your physical PC. You can choose among several
    versions. Some of them are free, while others require a subscription fee. Here
    are the most common ones:


    * `VMware Workstation` (paid version, 30-days free trial).

    * `VMware Player` (free version).

    * `Oracle Virtualbox` (free version).

