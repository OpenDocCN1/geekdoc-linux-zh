    更多细节：![](img/image1482.jpg)

    为了确认这一点，我们可以验证 `KFSensor` 上是否模拟了该服务：![](img/image1486.jpg)

    以下是发现的漏洞概述：![](img/image1490.jpg)

    一个有趣的功能是可以创建 `.pdf` 格式的可导出报告：![](img/image1494.jpg)


    # 安装 NEXPOSE


    在这一步中，我们需要下载 Nexpose 软件并输入免费许可证密钥。![](img/image1499.jpg)

    我们可以通过连接以下链接来运行此软件：`https://localhost:3780`。打开此软件后，我们可以执行各种操作：![](img/image1504.jpg)


    # 使用 NEXPOSE 进行扫描


    我们需要采取的第一个动作是创建一个站点（site）：![](img/image1509.jpg)

    我们可以指定要执行的扫描类型：![](img/image1513.jpg)

    扫描结果总结如下：![](img/image1517.jpg)

    在下方的图中，我们可以看到发现的漏洞的详细列表：![](img/image1521.jpg)

    Nexpose 为我们提供了与（例如）`Metasploit` 进行简单交互的可能性。我们还可以看到关于每个漏洞的足够细节：![](img/image1526.jpg)

    我们还收到了有关修复阶段的建议，该阶段旨在为发现的漏洞寻找解决方案：![](img/image1530.jpg)

    在这里，我们也有生成自定义报告的可能性：![](img/image1534.jpg)


    # 漏洞搜索网站


    以下是一份你可以参考的网站列表，用以获取有关每个漏洞的更多详细信息：


    *   Exploit Database. `https://www.exploit-db.com/`.

    *   Security Focus. `http://www.securityfocus.com/`.

    *   Packet Storm. `https://packetstormsecurity.com/`.

    *   CVE Details. `http://www.cvedetails.com/`.


    ![](img/image1544.jpg)


    # 漏洞利用 (Exploitation)


    在上章节中，我们学习了如何搜索漏洞，但仅限于执行自动分析。随着我们在这一领域经验的增长，我们需要将这种分析与手动搜索相结合，在其中我们将进行代码自定义。


    现在我们已经有了一个可能的漏洞列表，需要验证它们是否真的是可以利用的。漏洞利用是为了确认我们是否可以从特定的漏洞访问目标机器。此外，在这种情况下，我们可以像在漏洞评估阶段一样，使用自动和手动工具。作为伦理黑客的入门，在书中将重点关注使用选定的工具。


    我想先介绍“漏洞利用（exploit）”的概念。漏洞利用是一系列命令或代码行，用于利用特定软件的漏洞。它可以允许我们执行一些对受害机器来说是意外的操作。漏洞利用可以分类如下：


    *   服务端漏洞利用（Service-side exploit）：这种类型的利用影响目标机器上监听的特定服务。

    *   客户端漏洞利用（Client-side exploit）：攻击直接从客户端开始。

    *   本地权限提升利用（Local privilege escalation exploit）：一旦我们获得了目标机器的访问，我们需要使用属于此类别的利用来提升我们的权限。


    ## 服务端漏洞利用


    在通用机器上，我们有多个服务在某些端口上监听。以 Web 服务器为例，它最可能监听端口 `80` 并通过 `HTTP` 协议进行通信。如果由于任何原因，这些服务中的一个没有配置正确，它将为潜在的攻击者提供巨大的优势。这显然是另一系列特定条件的结果，例如允许访问该
    PC 上特定端口的边界防火墙。一旦你获得了对特定机器的访问，你就可以递归地访问其他机器，这些机器可能只能从第一台被破解的机器可见。在技术术语中，这种操作被称为“跳转（pivoting）”。


    ## 客户端漏洞利用


    在客户端漏洞利用中，我们的视角与客户端类型完全不同。在这种情况下，受害者在不知情的情况下释放了攻击，并与攻击机器建立了连接。


    攻击向量通常非常常见。例如，受害者可以启动由攻击者接收的可执行文件。这个简单的动作可能就足以开始与外部通信了。在企业网络中，与互联网的通信通常是允许的，因此边界安全系统可能不会拦截这种攻击。这与第一种利用相比是一个显著优势。正如你猜到的那样，这里用户在启动攻击中起着核心作用。攻击的开始与受害者执行的直接动作一致。要启动攻击，目标用户只需打开一个邮件附件或从互联网下载的
    Excel 文件即可。


    ## METASPLOIT


    谈到漏洞利用时，我们无法不提到 `Metasploit`。这是用于自动化漏洞利用过程的最著名的工具。它由各种模块组成，其用法并不是最直接的，你需要一些经验才能充分发挥它的作用。详细来说，我们可以说
    `Metasploit` 由以下元素组成：


    *   一个漏洞数据库。

    *   一个负载（payload）数据库。

    *   用于特定操作的辅助模块。

    *   用于渗透测试阶段的后渗透模块。

    *   便于管理整个结构的用户界面。


    相同的用户界面由几个模块组成，包括：


    *   `msfconsole`。通过它可以执行多个漏洞/负载。

    *   `MSFD`。监听 TCP 端口 `5554` 的服务，允许多个用户连接到同一个 Metasploit 实例。

    *   `armitage`。Metasploit 的图形版本。

    *   `msfvenon`。它主要用于客户端漏洞利用阶段，将我们的负载转换为不同类型的可执行文件。


    # 客户端漏洞利用演示


    让我列出我们将为完成此演示而遵循的步骤：


    1.  带有 Windows 系统的受害机进行初始配置。

    2.  使用 `Metasploit`（特别是 `msfvenon` 接口）创建恶意文件。

    3.  在 Web 服务器（攻击方）上创建一个用于托管恶意文件的服务器。

    4.  使用 `Metasploit`，特别是 `msfconsole`。

    5.  在受害机上执行恶意文件。

    6.  攻击者与目标之间建立连接。

    7.  与 `Metasploit` shell 交互。


    我们需要执行每一个精确的步骤。


    ### 受害机的初始配置


    要执行的任务的任务是验证受害机与目标机器之间的连通性。在这方面，我们将像以前一样通过在 2 台机器之间设置 IP 地址，例如：


    *   受害机（Windows 7 系统）：`192.168.1.227/24`。

    *   攻击机（SO Kali Linux 系统）：`192.168.1.133/24`。


    然后我们可以通过 `ping` 命令确认它们之间的通信。我们需要采取的必要步骤是禁用受害机所有的安全系统。


    *   禁用本地防火墙。


    ![](img/image1609.jpg)


    '
