    *   如下方所示，取消勾选所有框以禁用 Windows Defender：


    ![](img/image1615.jpg)


    ## 创建恶意文件

    连接到 Kali 机器并输入以下命令：

    ![](img/image1620.jpg)

    特别是：


    *   `LHOST` 是攻击机（即 Kali）的本地地址。

    *   `LPORT` 是我们用来监听并等待他人连接的端口。

    *   `FileMale.exe` 将是生成的恶意文件，并位于 Kali 机器的 `/tmp` 文件夹中。


    ## 搭建简单的服务器

    一旦生成了恶意文件，我们就创建一个虚拟的 Web 服务器来托管它，这样就可以从目标机器上地下载了。我们应该在 Kali 终端中输入以下命令：

    ![](img/image1634.jpg)

    通过这种方式，我们放置了一个监听在 `8000` 端口的简易 Web 服务器。


    ## 准备利用/载荷（Exploit/Payload）

    一旦 Web 服务器处于监听状态，我们就应该进入 Metasploit 进行漏洞利用和载荷配置。注意 `EXPLOIT`（漏洞利用）和 `PAYLOAD`（载荷）之间的区别。漏洞利用允许我们利用给定的漏洞。载荷是通过使用
    `EXPLOIT` 命令执行的代码段。


    我们启动 `msfconsolle` 并选择我们想要使用的利用程序。在特定情况下，我们指的是以下一个（multi / handler）：

    ![](img/image1642.jpg)

    我们按下 "send " 按钮并选择载荷：

    ![](img/image1646.jpg)

    在此步骤之后，我们必须输入配置所需的所有参数。输入 `show options` 命令并验证所需信息，即“Required”（必填）字段是否为“Yes”（是）。

    ![](img/image1650.jpg)

    因此，我们如下设置 `LHOST` 和 `LPORT`：


    *   输入 `set LPORT 192.168.1.133` 或我们的 IP 地址，以及攻击机的 IP 地址。

    *   输入 `set LPORT 8080`，这是我们之前在 `msfvenon` 中选择的端口。


    然后我们可以输入命令 `EXPLOIT` 来执行利用程序。现在我们已经准备好接收来自受害者机器的连接，并正在等待其连接。


    ## 攻破主机

    现在我们模拟用户下载并运行托管在我们 Web 服务器上的恶意文件。我们首先在受害者机器的浏览器中输入以下 URL：

    ![](img/image1663.jpg)

    下载文件到本地并运行它。此时，如果我们回到 Kali 机器和 Metasploit，我们可以看到已经建立了连接：

    ![](img/image1668.jpg)

    我们终于开始与受害者机器进行交互。通过 `sessions -l` 命令，我们可以看到哪些是活动连接及其 ID；然后通过 `session -i ID` 命令访问我们感兴趣的会话。

    在这种情况下，我们的目标是 ID 为 `1` 的连接，它是唯一的活动连接：

    ![](img/image1673.jpg)

    现在几乎就像我们位于受害者机器的 DOS 窗口中一样，我们可以执行各种操作。主机攻破成功了。

    ![](img/image1677.jpg)


    ## 服务端利用

    我们将分析另一种称为“服务端”的利用类型。我们将利用一个存在 Windows 操作系统旧版音频软件中的漏洞，该软件名为 ICECAST (http://icecast.org/)。以下是我们采取的步骤：


    1.  在受害者机器上安装 ICECAST 2.0.0。

    2.  Metasploit 的初始配置。

    3.  发送利用程序并激活 meterpreter 会话。

    4.  在 Icecast 内存进程上激活 meterpreter  shell。

    5.  使用 meterpreter 访问受害者机器。


    ### 在 Windows 上安装 ICECAST

    从 icecast.org 网站下载该软件的 2.0.0 版本并安装在受害者机器上：

    ![](img/image1691.jpg)

    我们现在将 Icecast 包含在 Windows 部分，与“程序执行保护”相关的异常中：

    ![](img/image1695.jpg)


    ### METASPLOIT 初始配置

    首先，让我们运行搜索命令在 Metasploit 中搜索与 Icecast 相关的利用程序：

    ![](img/image1700.jpg)

    我们可以看到该利用程序存在，这就是我们能够选择它的原因：

    ![](img/image1704.jpg)

    现在我们需要指定想要使用的什么载荷：

    ![](img/image1708.jpg)

    现在需要通过运行 `show options` 命令来配置 Metasploit，如下所示：

    ![](img/image1712.jpg)

    特别是：


    *   `RHOST`，即受害者机器的 IP 地址。

    *   `LHOST`，基本上是攻击机的 IP 地址。


    我们可以得出以下结论：

    ![](img/image1722.jpg)

    ![](img/image1727.jpg)


    ### 攻破主机

    我们已准备好执行攻击。进入受害者机器并启动 Icecast：

    ![](img/image1732.jpg)

    现在回到攻击机并输入 `exploit` 命令来启动我们刚刚配置的内容。如果每一步都执行正确，我们应该有一个打开的会话和一次成功的攻击：

    ![](img/image1737.jpg)

    现在我们通过 `session -i` 命令访问受害者机器上的 meterpreter 会话：

    ![](img/1741.jpg)

    在 meterpreter 中执行以下命令：


    *   `SYSINFO` 获取操作系统信息。

    ![](img/1748.jpg)

    *   `GETUID` 查看我们正在使用的用户。

    ![](img/1755.jpg)

    *   `SHELL` 访问命令提示符。

    ![](img/1761.jpg)

    *   `SCREENSHOT` 获取受害者机器的截图。

    ![](img/1767.jpg)

    *   `PS` 查看受害者机器上运行的所有进程。

    ![](img/1773.jpg)

    在这些进程中，我们可以发现当前活跃的“Icecast”进程：

    ![](img/1777.jpg)

    现在我们可以迁移到另一个进程。我们将在下一章中详细介绍此操作，但我们可以通过迁移到 notepad 进程提前准备：

    ![](img/1781.jpg)

    `notepad.exe` 进程 ID 为 `2708`，而 `Icecast.exe` 进程 ID 为 `2808`。现在让我们将 Icecast 进程迁移到
    notepad。为此，执行 `migrate` 命令：

    ![](img/image1785.jpg)

    如果我现在关闭 notepad，我将会丢失连接。你可以尝试 meterpreter 的其他命令组合。


    ## 渗透后利用

    一旦主机被攻破，我们需要查看在利用后应该执行的所有活动。在这些活动中，最重要的：


    *   权限提升。

    *   访问维护。

    *   数据收集。

    *   针对新主机的循环扫描过程。

    *   针对新主机的重复利用。

    '
