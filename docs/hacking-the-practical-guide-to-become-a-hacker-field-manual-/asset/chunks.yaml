- fmt: '

    For now, let''s focus on the host discovery phase. We will have to instruct `Nmap`
    not to perform any types of port scan, and to merely check which hosts are active
    on the network. This is a level 2 scan based on the `ARP` protocol and the MAC
    address. `-sn` is the option you should use to instruct `Nmap`. That is why we
    should launch this command: ![](image1021.jpg)


    `192.168.1.100-150` is the range of IP addresses we want to test. We could be
    dealing with a single address or a subnet. We can always keep the situation under
    control with `Nmap` and check what happens:![](image1026.jpg)


    As I have already pointed out, this type of level 2 scan only makes sense in local
    contexts where you communicate with MAC addresses. Outside the LAN, we only use
    IP addresses and therefore the network scan is set at a higher level, i.e the
    network layer "layer 3 scan".


    ## USEFUL FINDINGS FOR LEVEL 3 NETWORK SCANS


    - It would be better to use the IP address and not the hostname so as not have
    to perform a DNS query and possibly alter the results obtained. We obviously need
    to set some limits.

    - When dealing with a Web server that hosts multiple websites, it makes sense
    to use the hostname and DNS resolution.

    - With large networks, it might take longer to complete a scan. For this reason,
    it is advisable to use a small network sample or dwell only on a small range of
    doors.


    ## PING SCAN WITH NMAP


    We will now move to the simplest type of level 3 scan. For doing so, we will use
    a particular protocol called `ICMP` (Internet Control Message Protocol), which
    implies that we are not using either the `TCP` or `UDP` protocol. The `ICMP` performs
    various control functions, including the verification of reachability of a certain
    host within a network. To do this, we use the `PING` command specifying with the
    `-c` option the number of `ICMP` packets we want to send to the target machine
    or network![](image1041.jpg)


    Below we can see that the target machine has responded to our command and is therefore
    active in the network![](image1046.jpg) Don''t forget to check the network traffic
    with `Wireshark`. You should also use the `"icmp"` filter![](image1050.jpg) Wireshark
    clearly shows us that we are using the `ICMP` protocol and that packet exchange
    is happening as follows:


    - Echo request. The attacking host sent the `ICMP` packet to the target machine.

    - Echo reply. The target machine sent the response packet to the attacking machine.


    ## TCP AND UDP PROTOCOL


    We have so far mentioned layer 2 (ARP discovery) and layer 3 scan of the ISO/OSI
    model. We will now examine the layer 4 one at the transport layer. The transport
    layer is mainly composed of 2 protocols: `TCP` and `UDP`. The main difference
    between these two protocols is that `TCP` is a connection-oriented protocol, while
    `UDP` has no connection. Basically, when we need to use `TCP`, we have to do it
    by creating a connection between the two parts. They both should want and be able
    to communicate with each other, otherwise there will be no exchange of information.


    From this, we can easily deduce that `TCP` is a reliable protocol that, besides
    rare and manageable exceptions, offers us the receipt of the information sent.
    On the contrary, with `UDP` we have no certainty. On the other hand, `UDP` is
    a very fast protocol, while `TCP` is less efficient due to all the additional
    checks it has to perform. Let''s look at which fields make up a `TCP` and a `UDP`
    packet![](image1069.jpg)


    ### TCP CONTROL FLAGS


    As seen in the previous section, the `TCP` protocol performs a connection check.
    To do this, it uses a series of additional information within the network packet,
    and we are interested in the so-called "TCP flags". There are six of them:


    - `SYN`

    - `ACK`

    - `RST`

    - `FIN`

    - `PSH`

    - `URG`


    `SYN` and `ACK` are the most important `TCP` flags, because they take part in
    the "Three-way handshake". This procedure allows the `TCP` protocol to establish
    a communication. The presence of the `RST` flag shows that we need to reset the
    connection. This may be due to connection errors and the `FIN` flag indicates
    there are no other data that the sender should receive.


    ## THE THREE-WAY HANDSHAKE


    This connection creation process is based exclusively on the `SYN` and `ACK` flags.
    Let’s suppose we have two machines:


    - `PC A` that wants to establish the connection.

    - `PC B` that is waiting for the connection to be established.


    The exchange takes place as follows:


    - `PC A` sets the `SYN` flag of the packet and sends it to `PC B`.

    - Once `PC B` receives it, it sets the `SYN` and `ACK` flags of the packet that
    will be sent to `PC A`.

    - When `PC A` receives the `SYN-ACK`, it sends a packet with the `ACK` flag to
    `PC B`.

    - If everything went well, the connection should have been established correctly.


    The three-way handshake is an exchange of packets between two entities that use
    `TCP` flags (`SYN` and `ACK`) to organize their communication. We can find all
    the information we need on `Wireshark`, as you can see from the screenshot here
    below![](image1098.jpg) The packet number 25 has the `SYN` flag active, the 26
    one is a copy with `SYN` and `ACK`, the 27 one with `ACK` starts the communication.
    Here is a screenshot of the first packet, where the `SYN` flag is set to 1. This
    means that it is active![](image1103.jpg)


    ## CREATION OF CUSTOMIZED NETWORK PACKAGES


    There are several software options that allow the creation and modification of
    packets that travel within a network (packet crafting). The "Colasof Packet Builder"
    gives us the possibility to choose the type of packet to create or modify![](image1109.jpg)
    After choosing the type, for example `TCP`, let''s start by creating a packet![](image1114.jpg)
    Among other things, we can set the `TCP` flags we mentioned before![](image1118.jpg)


    ## LEVEL 4 NETWORK SCAN - CONNECT SCAN


    We will now learn together the simplest technique to perform a level 4 scan: the
    CONNECT SCAN. This type of scan establishes the `TCP` connection. In other words,
    it completes the three-way handshake, making the scan very noisy and easily identifiable.
    I would recommend using `KFSensor`, `Wireshark` and `Nmap` to perform this simulation:


    1. Start `KFSensor` and choose which service to monitor, for example port 80.

    2. Start `Wireshark` and find to the correct network interface, filtering by `TCP`.

    3. Start `Nmap` and then run the scan![](image1129.jpg)


    With `Wireshark` we should confirm that the scan took place![](image1133.jpg)
    As a test, we can verify that the scan has been detected also on `KFSensor![](image1138.jpg)


    ## LEVEL 4 NETWORK SCAN - SYN SCAN


    Now let''s examine the SYN type scan, which, unlike the CONNECT one, does not
    complete the three-way handshake completely. We could almost say that it is half
    done. The exchange takes place as follows:


    - The attacker sends a packet with the `SYN` flag set.

    - The victim responds with a packet with configured `SYN` and `ACK` flags.

    - The attacker, at this point, does not complete the handshake but sends a packet
    with the `RST` flag. This will force a reset of the connection and not establish
    it completely.

