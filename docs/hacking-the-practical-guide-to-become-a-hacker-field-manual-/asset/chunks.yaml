    If the PC does not respond to the `PING` command but the `ARP` entry is present,
    then we might be dealing with a network layer problem. If even the `ARP` is present,
    it is then an issue of the data link layer. This is just an example of how to
    proceed when we are experiencing a network malfunction. Obviously, we are not
    considering all the other connected network devices (routers, switches, etc.),
    because in that case the issue will become more complicated. This is the end of
    the chapter dedicated to the main network concepts. Since this is a topic of fundamental
    importance for your career as a penetration tester, you can refer to the following
    link to learn more: http://www.tcpipguide.com/free/.


    # Corporate Networks

    For a penetration tester, it is certainly helpful to understand the basic functioning
    of a corporate network. You will almost always find yourself operating within
    these contexts, except in special cases. Having a good understanding of most network
    devices and their functions will help you carry out a penetration test in a much
    more accurate and effective way.


    Corporate networks can become complex than private ones. You will need plenty
    of knowledge and experience to fully understand all their nuances. However, I
    focus mainly on introducing the basics of some common elements. No network can
    work without being supported by at least two devices: a `SWITCH` and a `ROUTER`.
    I should also mention the `FIREWALL` which, although not essential, is always
    present in a corporate network. The following sections are devoted to these three
    elements.


    ## CISCO PACKET TRACER

    You might have never heard of the network simulator Cisco Packet Tracer. This
    kind of software allows us to create and simulate network scenarios. We can use
    it to perform tests and better understand the functioning of a certain device
    or the global behavior of a network. The Cisco Packet Tracer has recently become
    free, and you can download it at this link: https://www.netacad.com/courses/packet-tracer-download/.
    Once the download is complete, you can follow the classic installation process.


    ![](image587.jpg)


    I will not go into detail about the specific operation and configuration of the
    Cisco Packet Tracer. I suggest you read the complete and well-written documentation
    of this software to immediately create your first network diagrams. Furthermore,
    it is better to use the "Simulation" mode to perform network simulations. You
    will better understand how network devices interact with each other.


    ![](image593.jpg)


    ## LAN-WAN-DMZ

    In order to interact with a medium-large network, we first need to define its
    topology. We need to divide our network into several areas so that we always know
    where we are. This also helps us to segment, organize and manage the traffic passing
    through our network.


    The first distinction we need to make is between "internal world" and "external
    world". By internal world we mean everything happening inside our private network,
    where our private IP addresses are assigned. This is called `LAN` (Local Area
    Network). When we need to communicate with the outside world (especially to connect
    to the Internet), we will refer to the `WAN` (Wide Area Network). This distinction
    helps us to emphasize, once again, the concept of "inside" and "outside". We will
    almost never use only `LAN` and `WAN`. There are also other parts of the network
    that we will introduce with a different logic. One of these is the so-called "DMZ",
    which means "demilitarized zone". In this area, we will be forced to expose even
    critical services to the outside world. Precisely because of the implicit risks,
    we should not include these services into our `LAN`, which is a part of the network
    that should always be protected as much as possible.


    We can summarize this concept by saying that each network will always consist
    of a `LAN` part and a `WAN` part. However, if necessary, we can add and define
    other portions of the network, like for example the `DMZ`.


    ![](image606.jpg)


    ## THE SWITCH

    The main function of this apparatus is to sort packets within a network. It operates
    at the data link layer of the ISO/OSI model. As you might have guessed, we are
    referring to the world of MAC addresses. When we talk about a switch, we are never
    referring to the network layer and to IP addresses. It is essential to always
    keep this distinction in mind. The switch is based on MAC addresses and works
    inside a specific subnet. Within a subnet we can find one or more switches. On
    the contrary, a switch can never be connected to two or more subnets (as there
    would be the need to perform routing). Each time more PCs need to communicate
    within the same subnet, we will have to insert and then configure a switch. This
    device is made up of several ports, which work as multiple network interfaces.
    In each of these, we have to insert the network cable of the PCs that we want
    to communicate with the other ones.


    ![](image616.jpg)


    The packets sorted by the switch are called `FRAME`. One of the key features of
    the switch is its ability to forward packets in a smart way. A switch can read
    the MAC address contained in the Ethernet frame and knows exactly to what machine
    the message should be sent. For this reason, it does not need to forward it to
    all the connected devices.


    Now let''s see the detailed process behind how this device works:


    * The switch automatically learns the topology of the `LAN` network. It can figure
    out to which of its ports each PC is connected.

    * It summarizes in a table, called the `CAM table`, the associations between each
    port and MAC address. This table is then automatically updated every time new
    packets arrive.


    Basically, here is exactly how the process works:


    1. When a packet arrives at a port, the switch checks whether the recipient''s
    address is already present or not on the `CAM table`.

    2. If the address is present but the recipient''s port is different from the sender''s,
    the packet is sent to the associated port and only to that one.

    3. If not present, the packet is sent to all the ports, except for the sender’s
    one.


    The switch has other more advanced features, such as MAC address filtering or
    other particular control operations. However, this introduction is more than enough
    for the purpose of our work. I still invite you to simulate the functioning of
    a switch by using the Cisco Packet Tracer. For example, you can select three PCs
    and connect them to the Cisco Packet Tracker to test the sending of packets using
    simulated mode. Remember to first define the IP address for each individual PC.
    You can do so by clicking twice on each PC, going to `Desktop -> IP configuration`
    and entering all the addresses.


    ![](image639.jpg)


    ## THE ROUTER

    The need to use this new network device stems from the fact that we cannot remain
    confined within our subnet. In the future, we will need to communicate externally,
    i.e. on the Internet or with another subnet. The router''s function is to transport
    the packets outside the subnet in which we find ourselves. Remember that we are
    dealing with IP addresses, not MAC addresses. A router operates at the network
    layer of the ISO/OSI model.


    To give a practical example, let’s suppose that we are in a company with two distinct
    departments: the administrative and the technical one. Most likely these two will
    belong to different networks. Let’s assume that we can count on two networks with
    the following settings:


    * Administration: network `192.168.1.0/24`.

    * Technicians: network `192.168.2.0/24`.

    '
