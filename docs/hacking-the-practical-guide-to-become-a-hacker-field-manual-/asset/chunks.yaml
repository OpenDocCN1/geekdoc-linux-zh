- fmt: "\nAll administration PCs will certainly have a switch that connects them and\
    \ therefore will be able to talk to each other, and the same happens for the technical\
    \ department. But what if an administration PC wants to send a file to a technician's\
    \ PC? It cannot do this, because they belong to different networks and the switch\
    \ cannot establish a connection between different networks. It is in this case\
    \ that the router comes into play.\n\nThis device will have its own interface\
    \ connected to the `192.168.1.0/24` network and another one connected to `192.168.2.0/24`.\
    \ In this way, the two networks can communicate with each other. A router looks\
    \ very similar to a switch, but its function is completely different.\n\n![](image655.jpg)\n\
    \nNow you should have understood why it is always essential to count on these\
    \ two devices. One is intended to manage the traffic within a specific network\
    \ segment, the other one is used for connecting multiple networks. If these two\
    \ concepts are now clear to you, you are already quite familiar with how networks\
    \ work. Besides, a router can allow us to connect to the Internet and this should\
    \ not surprise you.\n\nThe Internet itself is just a group of distinct networks.\
    \ Even in this case, I suggest you experiment with the router using the Cisco\
    \ Packet Tracer. You must define a network architecture composed of some PCs,\
    \ at least two `SWITCHES` and a `ROUTER`. The image below gives you an example.\n\
    \n![](image664.jpg)\n\nYou will need to configure the IP addresses on the PCs\
    \ and on the router by defining an IP address for each network interface used.\
    \ Referring to the image above, you will need to configure the IP on the `Fa0/0`\
    \ and `Fa0` interface. You could do it also from the command line, but it is easier\
    \ to complete this task directly from the graphic panel.\n\n![](image670.jpg)\n\
    \nOn the internet, and specifically on YouTube, you can find many tutorials on\
    \ how to make these configurations. I prefer not to dwell too much on these concepts,\
    \ because they are not the main topics of this book.\n\nOver time, networks have\
    \ evolved, and the users’ needs have changed. Nowadays, in addition to the need\
    \ to communicate, we also look for a protection system for our network. It is\
    \ for this purpose that I will introduce a new device to you in the next section:\
    \ the `FIREWALL`.\n\n## THE FIREWALL\n\nThe firewall is nothing but a router with\
    \ advanced security features. By convention, we place the firewall between the\
    \ upper end of the data layer and the lower end of the network layer. For this\
    \ one, we will still have to manage `MAC` and `IP` addresses.\n\nThe main function\
    \ of this device is to carry out packet filtering. It manages the traffic entering\
    \ and leaving the network, and it is based on the concept of port and/or service.\
    \ It also helps us to create security rules, which we will then include in our\
    \ “security policy”. We also need to decide what service, door, or application\
    \ should be open or closed in our network.\n\nThis device is often referred to\
    \ as a “perimeter firewall” because its natural location is on the border of the\
    \ internal network. This position allows it to protect our internal network from\
    \ the outside world.\n\nIn recent years, new security features have been added\
    \ to the firewall, so much so that today we talk about a \"Next Generation Firewall\"\
    . Some of these features include URL filtering, application control, as well as\
    \ the creation of `VPNs`, `IPS`, and `IDS` networks.\n\nThere are several types\
    \ of firewall available. Some of them are free and meant for the domestic use.\
    \ Others are aimed at enterprises and can cost up to several thousands of euro.\
    \ I will list here below the main firewall vendors:\n\n*   **ENTERPRISE LEVEL\
    \ FIREWALLS**:\n    *   `Checkpoint`. Reference website: `https://www.checkpoint.com/`.\n\
    \    *   `Paloalto`. Reference website: `https://www.paloaltonetworks.com/`.\n\
    \    *   `Fortinet`. Reference website: `https://www.fortinet.com/`.\n*   **PRIVATE\
    \ FIREWALLS**:\n    *   `pfSense`. Reference website: `https://www.pfsense.org/`.\n\
    \nThese products often provide us with virtual machines that we can use to practice\
    \ our hacking skills. I suggest you make a choice between all the products offered\
    \ by each supplier. Below we can see the Fortinet website which provides a virtual\
    \ machine we can use to test this firewall:\n\n![](image701.jpg)\n\nLet's see\
    \ how the Fortinet firewall looks like. Note that configuring a firewall in a\
    \ business context is a complex operation, but the basic configurations are as\
    \ follows:\n\n*   Product installation.\n*   Firmware/OS upgrade.\n*   Configuration\
    \ of network interfaces (`LAN`, `WAN`, `DMZ`).\n*   Writing basic security policies.\n\
    *   Network traffic test.\n*   Possible activation of advanced security features.\n\
    \nBelow are some screenshots showing the steps we should take:\n\n*   We can check\
    \ the configuration of several network interfaces. We obviously need to have some\
    \ `IP` addresses and define the `LAN`, `WAN`, `DMZ` network.\n![](image716.jpg)\n\
    \n*   Writing of security policies: the first policy to be written in a firewall\
    \ is the so-called \"cleanup rule\", basically the last rule of the firewall.\
    \ It blocks any type of traffic, unless otherwise specified by the higher policies.\
    \ In the configuration phase, it is always advisable to define a rule that accepts\
    \ all traffic so as to verify that the network has been configured correctly.\n\
    ![](image723.jpg)\n\nThe firewall always works according to some criteria:\n\n\
    *   Source `IP` address.\n*   Recipient `IP` address.\n*   Door and/or service.\n\
    \nAt this point, I recommend you try one of these software and test some of their\
    \ features. This is the end of the chapter dedicated to corporate networks. From\
    \ now on, we will get into the heart of the matter and address the first step\
    \ in the penetration test process: information gathering.\n\n## Information Gathering\n\
    \nWe are ready to begin the first phase of a penetration test, which is called\
    \ information gathering. In a while, we will try to better understand why it has\
    \ this name and how it works.\n\nThere are mainly three types of penetration tests:\n\
    \n*   `BLACK BOX TESTING`\n*   `GREY BOX TESTING`\n*   `WHITE BOX TESTING`\n\n\
    In the black box testing, the person who performs the security test is not aware\
    \ of any details on the network infrastructure that he will have to test. This\
    \ penetration tester will often only be informed of the client’s company website.\n\
    \nIn the white box testing, the operator is aware of all the information of the\
    \ network to be examined or of the area to be tested. The gray box testing is\
    \ a middle ground compared to the other two categories.\n\nLet’s suppose we need\
    \ to perform a \"black box\" test. We have no knowledge of our target and that\
    \ is why we need to gather more information. It is in similar scenarios that the\
    \ information gathering phase is placed.\n\nIn this chapter, we will analyze in\
    \ detail the tools and procedures that can help us to successfully complete this\
    \ phase. You should take your time when carrying out these activities. This phase\
    \ should be completed accurately and without haste.\n\n### FIRST CONSIDERATIONS\n\
    \nI will start by saying that there is not a single method. Gathering information\
    \ means investigating, analyzing, and studying everything related to our target.\
    \ The amount of information we should collect depends very much on the type of\
    \ business on which we operate. Imagine having to perform penetration test against\
    \ a transport company. I will start collecting information on their employees,\
    \ suppliers, business relationships established over time, company data, etc.\n\
    \nAll my activities will be a consequence of the type of target I will be dealing\
    \ with. However, we can find some common steps to which we can refer. We can schematize\
    \ them as follows, depending on the type of search we want to perform:\n\n*  \
    \ Using `Google Hacking` - `Google Dorks`.\n*   Use of `Google Cache`.\n*   The\
    \ \"Wayback machine\".\n*   Information from social media.\n*   Keywords in job\
    \ listings.\n*   Metadata extraction.\n*   `WHOIS` use.\n*   Querying a `DNS`.\n\
    *   Information collection with `Maltego`.\n*   Information collection with `Recon-ng`.\n\
    *   Vulnerability assessment with `Shodan`.\n"
