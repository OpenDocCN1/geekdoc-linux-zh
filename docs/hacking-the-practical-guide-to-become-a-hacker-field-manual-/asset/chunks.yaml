    这是一个相对“静默”的扫描。如果目标网络中有跟踪已建立连接的系统，它将不会记录这次连接尝试。这是因为没有任何连接被完全建立。在这里，我们也应该启动 `Nmap`
    并运行以下命令：

    ![](img/image1150.jpg)


    我们现在需要使用 `Wireshark` 验证扫描，并检查攻击机发送的 `RST` 标志：

    ![](img/image1154.jpg)


    最后，我们通过 `KFSensor` 验证扫描，它甚至可以准确检测到我们使用 `SynScan` 的尝试：![](img/image1158.jpg)


    `Nmap` 成功完成了这次扫描：

    ![](img/image1162.jpg)


    # 第 4 级网络扫描 - UDP 扫描


    之前的扫描与 TCP 协议有关。然而，即使是 UDP 也能提供有趣的结果，因为它经常被低估且没有受到网络管理员的充分保护。请记住，UDP 协议是无连接的，因此其行为与
    TCP 不同。


    特别是，如果在某个端口上启动扫描且没有收到任何响应，那么我们可以假设该端口是开放的。否则，我们将收到一条 ICMP 错误消息，简而言之，这意味着端口是关闭的或无法提供有效信息。


    我们应该配置 `KFSensor` 并模拟一个端口为 `53413` 的 UDP 类型服务。例如：

    ![](img/image1172.jpg)


    让我们用 `Wireshark` 监听，同时在选择的端口用 `Nmap` 启动 UDP 扫描：![](img/image1177.jpg)


    用 `Wireshark` 分析流量：![](img/image1182.jpg)


    第一和第四行显示了发送的 UDP 包。由于我们找不到任何 `ICMP` 包，可以假设扫描是成功的，且端口 `53413` 实际上是开放的![](img/image1186.jpg)


    让我们尝试一个随机的 UDP 端口（因此肯定不会开放），并用 `Wireshark` 查看结果：![](img/image1190.jpg)


    如你所示，在这种情况下，`ICMP` 包立即返回，信号我们门是关闭或被过滤的。我们实际上知道它不存在![](img/image1194.jpg)


    关于网络扫描的章节到此结束。显然，在阅读完这本书后，你还可以自己学习其他的扫描类型和技术。在此链接处，你可以找到官方 `Nmap` 文档：https://nmap.org/book/man.html。


    # 标志纹抓取 (Banner Grabbing)


    在上一章节中，我们检查了主要的网络扫描技术。现在是时候识别特定端口上运行的是什么类型的服务了。这些信息对我们的下一个阶段有用，在那个阶段我们将寻找漏洞。特别是过旧版本的服务可能会被潜在的黑客利用。


    我们将从通常与标准端口关联的服务开始，然后转向与非常规关联的服务。此外，在这种情况下，我们依赖一个向导，它将引导我们定义特定的服务，使其激活并尝试抓取标志纹（banner）。


    ## 安装 Web 服务器 MICROSOFT IIS


    我们将直接从 `Windows Server 2012` 开始安装 `IIS` Web 服务器。你可以参考以下链接获取安装步骤：https://docs.microsoft.com/en-us/iis/get-started/whats-new-in-iis-8/8-installing-iis-on-windows-server-2012


    在安装过程结束，你可以打开浏览器并输入：`http://127.0.0.1`。如果一切顺利，屏幕上应该出现这些：![](img/image1213.jpg)


    我们可以通过执行 `netstat` 命令看到 `IIS` 正在监听端口 `80`。通过该命令并对端口 `80` 进行过滤，我们可以看到后者是如何监听的：![](img/image1218.jpg)


    ## MICROSOFT IIS 中的标志纹可视化


    此时，我们必须能够抓取 Web 服务器的标志纹，以便我们检测其类型和版本。首先，让我们使用 `telnet` 连接到 Web 服务器：![](img/image1224.jpg)


    一旦通道建立，我们可以输入两个允许我们与 Web 服务器交互的命令：


    ```

    GET / HTTP/1.1

    HOST: 127.0.0.1

    ```


    这将会出现在你屏幕上的内容：![](img/image1234.jpg) 我们已经捕获了 `IIS` Web 服务器的标志纹。我们现在可以识别服务的类型及其版本。这些信息在漏洞评估阶段将非常有用。


    ## KFSENSOR 标志纹配置


    我们现在应该使用 `KFSensor` 来模拟一个 `Microsoft IIS` 类型的 Web 服务器![](img/image1240.jpg)


    一旦配置完成，我们可以使用 `Nmap` 的名为 `service detection` 功能，它将尝试抓取监听服务的标志纹并告知我们它是哪个版本![](img/image1244.jpg)
    `Nmap` 正确地抓取了标志纹并检测到了模拟服务的准确版本。


    ## 安装 FTP 服务器


    我们之前安装了 `Microsoft` Web 服务器。现在，我们必须安装一个 FTP 服务器。你可以在以下链接找到安装步骤：https://social.technet.microsoft.com/wiki/contents/articles/12364.windows-server-2012-ftp-installation.aspx


    安装完成后，我们可以继续创建一个新的 FTP 站点：![](img/image1251.jpg) 我们现在正在不使用 SSL 的监听端口 `21`![](img/image1255.jpg)


    ## 使用 NMAP 抓取 FTP 标志纹


    我们现在可以使用 `Nmap` 服务检测功能捕获 FTP 标志纹：![](img/image1260.jpg) 正如上面的截图所示，我们正确检测到了运行在目标机器上的
    FTP 服务版本。注意，某些系统管理员可能会决定对某些服务的标志纹进行混淆。我们也可以在上面定义的 FTP 服务器上这样做：![](img/image1265.jpg)


    现在我们无法再通过 `Nmap` 检测服务的版本了![](img/image1269.jpg) `Nmap` 能够理解端口 `21` 是开放的。然而，它没有提供任何关于运行服务的版本信息。


    ## 使用 METASPLOIT 抓取 FTP 标志纹


    现在让我们用 `Metasploit` 抓取标志纹，我们将在后续章节中深入探讨这个工具。它是用于系统利用阶段的工具。然而，还有许多额外的模块允许你执行其他活动，例如标志纹抓取。


    我们通过终端运行 `msf` 命令来启动 `Metasploit`。然后输入以下命令：![](img/image1277.jpg)


    在完成这一部分后，我们可以运行 `exploit` 命令并启动扫描器：![](img/image1282.jpg) 扫描迅速完成，获得的结果告知我们存在 `Microsoft
    FTP` 服务器。我们再次抓取了标志纹。


    ## 使用 NETCAT 抓取 FTP 标志纹


    `NETCAT` 是另一个用于抓取标志纹的有用工具。你可以点击此处了解更多：https://en.wikipedia.org/wiki/Netcat。以下是用于抓取标志纹的命令：![](img/image1289.jpg)


    ## 使用 TELNET 抓取 FTP 标志纹


    我们已经看到过 `Telnet` 命令是如何工作的。让我们现在用它来抓取标志纹：![](img/image1294.jpg) 即使在这种情况下，我们也能够正确地检测并抓取标志纹。


    ## 操作系统检测


    除了检测某个运行的服务之外，了解机器上存在的操作系统也是重要的。我们可以遵循两种不同的流程：


    - 主动模式。

    - 被动模式。


