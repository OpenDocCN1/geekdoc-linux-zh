    \ machines will now only be able to talk to each other and cannot be connected\
    \ to the Internet. If needed, we will have to change the network adapter and set\
    \ the NAT mode. If you do not remember the differences between these two, it means\
    \ you have to go back and read again the previous chapter!INSTALLATION OF VMWARE\
    \ TOOLSAnother operation you will need to complete is the installation of VMware\
    \ Tools. They are nothing more than a set of features to improve the overall performance\
    \ of your virtual machine.I won't bore you with the details. The procedure is\
    \ very simple: you just need to search on Windows or on Google the keywords \"\
    installation of VMware tools on Kali”.CONNECTIVITY VERIFICATION OF VIRTUAL MACHINESOur\
    \ last effort now will be to verify that our virtual machines can talk to each\
    \ other. The steps you will need to take are the following:\n\n1.  Verify the\
    \ validity of the IP address assigned to each virtual machine.\n\n2.  Run the\
    \ \"PING\" command on each virtual machine and verify that the response is positive.\n\
    \nLet's see together how to do it:\n\n*   Access the KALI machine and run the\
    \ \"ifconfig\" command from the terminal, verifying that the assigned IP address\
    \ is available.\n\n*   Access the Windows 7/10 machine and on the command line\
    \ type \"ipconfig\" to verify the presence of the assigned IP address.\n\n*  \
    \ Note down these IP addresses.\n\n*   On the KALI machine, enter the command\
    \ \"ping IP address Windows 7/10\" to verify that the response is positive and\
    \ that we are not experiencing packet loss in the response.\n\n*   On the Windows\
    \ 7/10 machine, type the command \"ping IP address Kali\" verifying that the response\
    \ is positive and that no packets were lost in the response."
