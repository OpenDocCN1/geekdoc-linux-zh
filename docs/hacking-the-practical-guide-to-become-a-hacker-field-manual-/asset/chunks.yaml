  trans: '


    我们在本书中将使用的虚拟机管理器是 `VMware Workstation`。它是一个付费版本，但我们可以利用它的 30 天免费试用期。我选择使用这个虚拟机管理器是因为在网络管理功能和选项的多样性方面，它是最完整的。


    下载它，请访问此链接并点击“Download”：`https://my.vmware.com/en/web/vmware/free#desktop_end_user_computing/vmware_workstation_player/15_0`。如果版本
    14（该软件的最新版本）无法运行，你可以尝试版本 12。某些较旧的 CPU 不受支持。如果尚未激活，你需要在 BIOS 中启用虚拟化支持（请在 Google
    上搜索）。此时，如果安装成功，你理应能看到这个界面，显然是在还没有预先安装任何虚拟机的情况下。![](img/image201.jpg)


    现在你终于准备好进行下一步操作了。


    # 操作系统镜像


    为了创建虚拟机，你需要一个想要安装的操作系统镜像。对于我们正在构建的实验，你需要以下操作系统的镜像（`.iso` 格式）：


    *   `Kali Linux` -> 可从 `https://www.kali.org/downloads/` 免费下载。

    *   `Windows 7` -> 30 天版本，在互联网上很容易找到。

    *   `Windows 10` -> 90 天版本，在互联网上很容易找到。


    如果你好奇我为什么选择这些操作系统，主要原因如下：`Kali Linux` 将成为我们的攻击机，基本上就是我们用来启动所有攻击的机器。另外两台 Windows
    机器将作为我们的目标。


    # 创建虚拟机


    现在我们只需要创建虚拟机。要此操作，进入“File -> New virtual machine”并按照推荐的步骤操作![](img/image217.jpg)注意你将使用的
    RAM 数量。此数量取决于你 PC 上的可用 RAM，你应该尽量不要过度使用。此外，目前只需继续使用网络适配器的默认选项即可。对我们之前提到的所有操作系统执行相同的步骤：`Kali
    Linux`、`Windows 7` 和 `Windows 10`。


    # 网络管理


    正确管理网络极其重要。如果你没有正确配置，虚拟机之间将无法通信，因此你的实验室将无法正常工作。在 VMware 中，我们可以使用 4 种类型的网络：![](img/image225.jpg)如上面的截图所示，这些是可用的网络类型：


    *   `Bridged`（桥接模式）-> 这种类型包括创建一个物理 PC 所在网络中的 IP 地址。我稍后会解释什么是 IP 地址。现在，你只需要记住它是一个唯一标识网络上特定接口的数字表示。IP
    地址的示例是 `192.168.1.10`。

    *   `NAT` -> 一旦进入此模式，你的虚拟机可以连接到互联网，但从外部无法访问。

    *   `Host-only`（仅主机模式）-> 在这种情况下，虚拟机只能与你的物理主机通信。

    *   `Custom`（自定义模式）-> 在这里你可以定义个人网络并让所有虚拟机在内部通信。这是我们将使用的模式！


    要创建它，进入“Edit -> Virtual Editor”并像下方截图所示创建一个新网络![](img/245.jpg)现在你应该返回虚拟机的设置。你可以选择我们创建的网络适配器。在此步骤之后，每台虚拟机将拥有其
    IP 地址 `192.168.10.0/24`。


    # 虚拟机启动


    现在你准备好启动你的虚拟机了。如果你正确执行了上述所有操作，这些机器将全部启动并拥有之前分配的 IP 地址。例如，`Kali Linux` 可能具有 `192.168.10.1`
    的 IP 地址，而 `Windows 7` 机器可能具有 `192.168.10.2`，安装了 `Windows 10` 的机器可能有一个类似于 `192.168.10.3`
    的值。记住，这些虚拟机现在只能相互通信，无法连接到互联网。如果需要，我们将更改网络适配器并设置 `NAT` 模式。


    # 安装 VMware Tools


    你需要完成的另一个操作是安装 `VMware Tools`。它们仅仅是提高虚拟机整体性能的一组功能。我不会用细节来烦你。步骤非常简单：你只需要在 Windows
    或 Google 上搜索关键词“installation of VMware tools on Kali”。


    # 虚拟机连通性验证


    我们现在的最后工作是验证虚拟机是否可以通信。你需要采取的步骤如下：


    1.  验证分配给每台虚拟机的 IP 地址的有效性。

    2.  在每台虚拟机上运行 `PING` 命令并验证响应为正向。


    让我们一起看看如何操作：


    *   访问 `Kali` 机器并从终端运行 `ifconfig` 命令，验证分配的 IP 地址是否可用。

    *   访问 `Windows 7/10` 机器并在命令行中输入 `ipconfig` 以验证分配的 IP 地址是否存在。

    *   记录下这些 IP 地址。

    *   在 `Kali` 机器上输入命令 `ping Windows 7/10`，验证响应为正向，且响应中没有丢包。

    *   在 `Windows 7/10` 机器上输入命令 `ping Kali`，验证响应为正向且响应中没有丢包。


    '
