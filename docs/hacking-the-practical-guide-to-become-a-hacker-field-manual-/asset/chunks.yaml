  trans: '


    # 5. 取消日志文件。


    我们正在接近定义什么是渗透测试了。让我们继续吧。渗透测试——我们几乎所有的工作都是围绕着遵循和执行这一过程展开的。如果能正确应用这些知识，你将看到更有效的成果。这样，你就有更大的概率作为一名道德黑客成功完成工作。


    你现在可能在问自己一个问题：我应该如何向客户汇报结果和问题呢？这很简单！通过报告来完成。所谓的最终报告包含了所采取的每一个步骤和行动，以及为了解决你发现的漏洞而给出的有用建议。


    尽管如此，我想帮助你更好地理解到目前为止的概念：在客户的付费下，道德黑客按照上述程序执行渗透测试。完成此程序后，道德黑客将向客户发送一份最终报告，其中将提到所有已执行和发现的内容。这是道德黑客的主要任务。在书的其余部分，我将向你展示如何实现这一结果。现在，请放松。你将看到确定的结果；你只需要相信这一点并一点耐心。


    ## 渗透测试的阶段


    现在我们将看到执行渗透测试的常用程序。以下是列表，我们将深入探讨这些步骤中的每一个：


    1. 信息收集。

    2. 网络扫描。

    3. 枚举。

    4. 漏洞评估。

    5. 漏洞利用。

    6. 渗透后。

    7. 最终报告。


    每一个阶段对于我们工作的成功都至关重要。虽然不是强制性的，但遵循此列表的步骤顺序会更好。现在我们可以详细分析这些每一个步骤了。


    ## 信息收集


    我知道你正在想，“我需要收集什么信息？为了什么？”答案是直接而明确的：全部！我们有必要检查目标的多个方面，而且可能是提前进行。我们需要了解它是什么业务，销售什么，哪些人在那里工作，以及使用了哪些工具。换句话说，我们能收集到的所有信息在以后都会对我们很有用。你最好不要忽略或低估其中任何一个。


    信息收集阶段的另一个步骤是利用公共领域的信息对网络基础设施进行分析。在此阶段，你应该避免与目标直接交互。相反，我们可以依靠互联网上的可用工具和平台：


    * Google；

    * Whois 查询；

    * DNS；

    * 社交媒体；

    * 元数据；

    * 带有招聘列表的网站；

    * 诸如 `Maltego` 和 `Recon-ng` 等工具；

    * 特定的浏览器，如 `Shodan`。


    ## 网络扫描


    在上一阶段收集的信息可以帮助我们深入目标并开始网络扫描。注意，在这个阶段，我们开始与目标直接交互，并且存在被识别的风险，特别是如果我们没有采取所有相关的预防措施。扫描网络几乎就像发现自己在一个大城市的宽街道上，那里满了商店。突然之间，你开始撬每一家店的锁，希望至少有一家是开启且未受保护的。在这个阶段，我们不会登录网络，我们只需要确认门开着这一事实。不能确定我们在扫描网络期间的所有活动不会被察觉。


    ## 枚举


    枚举网络意味着发现并列出所有可用资源。让我们想象在之前的一个阶段，我们发现了一扇可能是开着的门。现在我们需要找出与该门相关的服务可以枚举的哪些信息。我知道这个定义听起来可能很困惑，但我们之后一起看到的示例应该有助于变得更容易理解。这个阶段经常被低估，即使它可以提供很有价值的信息。


    ## 漏洞评估


    现在我们已经发现了哪些门和服务端是可以访问的，我们应该识别目标所有的可能漏洞。我们可以依靠自动工具来让我们的工作变得更容易。然而，我们可能会遇到大量的假阳性或假阴性。否则，如果我们在这方面有更多经验，我们可以进行手动分析。最好的方法是两者的结合。通过切换工具和手动分析，你将看到最好的结果。


    ## 漏洞利用


    发现漏洞是不够的。我们接下来需要做的是尝试利用它们以获取系统的访问。这正是我们在这个阶段将尝试要做的。我们将为每个漏洞寻找允许我们访问系统的网关。这并不总是可能的，但我们应该考虑每条路径。执行渗透测试不仅关于访问网络，它还是一项更广泛的任务。我们应该识别所有不安全的访问点，并通知客户以帮助找到快速解决方案。


    ## 渗透后


    如果由于某种原因我们丢失了辛苦找到的访问点怎么办？我们还能再次访问系统吗？在这个阶段，这正是我们所担心的。我们的目标是创建一个始终可用的访问点。通过这样做，我们即使在以后也能访问我们的目标。


    ## 最终报告


    到此时，如果一切顺利，我们的工作应该被认为完成了。我们应该向客户提供一份最终报告，包含我们所有行动的摘要以及关于如何使网络更安全的建议。我们现在结束了对渗透测试阶段的解释。在下一章中，我将教你如何创建一个实验室，以便你能够完成我分配给你的测试。


    ## 实验室


    现在你已经对道德黑客工作的性质有了了解，我们需要开始实践我们在后续章节中学到的知识。第一个任务是建立自己的实验室。不要在实验室以外的环境实验我将教你的技术：那不是成为道德黑客的正确方法！我们如何能建立一个可以进行模拟的保护环境？答案很简单：我们可以使用虚拟机管理器。这包括在同一个物理系统中同时执行多个虚拟机，因此是多个操作系统。虚拟机让整个过程变得方便得多！


    ## 虚拟化


    通过使用这些程序，你可以在 PC 内同时运行多个操作系统。你唯一的限制是你可以使用的内存。这个过程并不困难，尽管你需要更熟悉这个工具。基本上，这里是你应该采取的步骤列表：


    * 下载名为 `hypervisor` 的特定软件。

    * 收集你想安装的操作系统的 `.iso` 镜像。

    * 软件。

    * 开始创建虚拟机的过程。

    * 创建并启动该虚拟机。

    * 继续安装理想的操作系统。


    '
- fmt: '

    The hypervisor we will use in this book is the `VMware Workstation`. It is a paid
    version, but we can take advantage of its 30-days free trial. I have chosen to
    use this hypervisor because it is the most complete one in terms of the variety
    of functions and options available for network management.


    For download it, go to this link and click on “Download ”: `https://my.vmware.com/en/web/vmware/free#desktop_end_user_computing/vmware_workstation_player/15_0`.
    If version 14 – the latest version of this software – is not working, you can
    try version 12. Some older CPUs are not supported. If not active yet, you need
    to enable the virtualization support from BIOS (search on Google). At this point,
    if the installation is successful, this is what you should be able to see, obviously
    without any virtual machine already installed.![](image201.jpg)


    Now you are finally ready for the next step.


    # IMAGES OF AN OPERATING SYSTEM


    In order to create your virtual machines, you need an image of the operating system
    you want to install. For the lab we are building, you need the image (.iso` format)
    of the following operating systems:


    *   `Kali Linux` -> freely downloadable from `https://www.kali.org/downloads/`.

    *   `Windows 7` -> 30-days version, easy to find on the Internet.

    *   `Windows 10` -> 90-days version, easy to find on the Internet.


    If you are wondering why I picked these operating systems, this is the main reason:
    `Kali Linux` will be our attacking machine, basically the one which we will use
    to start all our attacks. The other two Windows machines will instead be our targets.


    # CREATION OF VIRTUAL MACHINES


    Now we just need to create virtual machines. To do this, go to "File -> New virtual
    machine" and follow the recommended procedure.![](image217.jpg)Pay attention to
    the quantity of RAM you will be using. This amount depends on the RAM available
    on your PC, and you should try not to overuse it. Besides, for now just keep using
    the default options of your network adapter. Follow the same procedure for all
    the operating systems we have mentioned before: `Kali Linux`, `Windows 7`, and
    `Windows 10`.


    # NETWORK MANAGEMENT


    Managing the network correctly is extremely important. If you do not configure
    it correctly, the virtual machines will not be able to communicate between each
    other and hence your laboratory will not work properly. In VMware, we can use
    4 different types of networks:![](image225.jpg)As you can see from the screenshot
    above, these are the types of networks available:


    *   `Bridged` -> this type includes the creation of an IP address belonging to
    the network in which your physical PC is located. I will explain later what an
    IP address is. For now, you just need to remember that it is a numerical representation
    that uniquely identifies a specific interface on the network. An example of an
    IP address is `192.168.1.10`.

    *   `NAT` -> once in this mode, your virtual machine can connect to the Internet,
    but it cannot be reached from the outside.

    *   `Host-only` -> in this case, the virtual machine can only communicate with
    your physical host.

    *   `Custom` -> here you can define your personal network and let all the virtual
    machines communicate inside it. This is the mode we will use!


    To create it, go to "Edit -> Virtual Editor" and create a new network as in the
    screenshot below.![](245.jpg)Now you should go back to the settings of your virtual
    machine. You can choose the network adapter we have created.After this step, each
    virtual machine will have its IP address, `192.168.10.0/24`.


    # VIRTUAL MACHINES BOOTING


    Now you are ready to boot your virtual machines. If you have correctly performed
    all the operations above, the machines will all be started and will have the IP
    address previously assigned. For example, `Kali Linux` could have `192.168.10.1`
    as its IP address, while a `Windows 7` machine could have `192.168.10.2`, and
    one with `Windows 10` a value similar to `192.168.10.3`. Keep in mind that these
    virtual machines will now only be able to talk to each other and cannot be connected
    to the Internet. If needed, we will have to change the network adapter and set
    the `NAT` mode.


    # INSTALLATION OF VMWARE TOOLS


    Another operation you will need to complete is the installation of `VMware Tools`.
    They are nothing more than a set of features to improve the overall performance
    of your virtual machine. I won''t bore you with the details. The procedure is
    very simple: you just need to search on Windows or on Google the keywords "installation
    of VMware tools on Kali”.


    # CONNECTIVITY VERIFICATION OF VIRTUAL MACHINES


    Our last effort now will be to verify that our virtual machines can talk to each
    other. The steps you will need to take are the following:


    1.  Verify the validity of the IP address assigned to each virtual machine.

    2.  Run the `PING` command on each virtual machine and verify that the response
    is positive.


    Let''s see together how to do it:


    *   Access the `Kali` machine and run the `ifconfig` command from the terminal,
    verifying that the assigned IP address is available.

    *   Access the `Windows 7/10` machine and on the command line type `ipconfig`
    to verify the presence of the assigned IP address.

    *   Note down these IP addresses.

    *   On the `Kali` machine, enter the command `ping Windows 7/10` to verify that
    the response is positive and that we are not experiencing packet loss in the response.

    *   On the `Windows 7/10` machine, type the command `ping Kali` verifying that
    the response is positive and that no packets were lost in the response.

    '
