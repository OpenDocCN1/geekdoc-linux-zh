  trans: "\n所有的管理 PC 都会有一个连接它们的交换机，因此它们可以相互通信，技术部门也是如此。但如果一个管理 PC 想要向技术人员的 PC 发送文件呢？它无法做到这一点，因为它们属于不同的网络，而交换机无法在不同的网络之间建立连接。这时，路由器就派上用场了。\n\
    \n该设备将有一个接口连接到 `192.168.1.0/24` 网络，另一个接口连接到 `192.168.2.0/24`。通过这种方式，两个网络就可以相互通信。路由器看起来和交换机非常相似，但它的功能完全不同。\n\
    \n![](img/image655.jpg)\n\n现在你应该已经了为什么始终必须依靠这两种设备。其中一个用于管理特定网络段内的流量，另一个则用于连接多个网络。如果你现在已经理解了这两个概念，那么你对网络的工作原理已经相当熟悉了。此外，路由器还可以允许我们连接到互联网，这应该让你感到意外。\n\
    \n互联网本身仅仅是一组不同的网络。即使在这种情况下，我建议你使用 Cisco Packet Tracer 实验一下路由器。你必须定义一个由一些 PC、至少两个\
    \ `SWITCHES` 和一个 `ROUTER` 组成的网络架构。下面的图片给出了一个示例。\n\n![](img/image664.jpg)\n\n你需要通过为使用的每个网络接口定义\
    \ IP 地址，从而在 PC 和路由器上配置 IP 地址。参考上面的图片，你需要在 `Fa0/0` 和 `Fa0` 接口上配置 IP。你也可以从命令行完成，但直接从图形面板完成此任务会更简单。\n\
    \n![](img/image670.jpg)\n\n在互联网上，特别是 YouTube 上，你可以找到许多关于如何进行这些配置的教程。我倾向于不在这些概念上花费过多，因为它们不是本书的主题。\n\
    \n随着时间的推移，网络不断演变，用户的需求也发生了变化。如今，除了通信需求，我们还在为网络寻找一种保护系统。出于这个目的，我将在下一节中向你介绍一种新设备：`FIREWALL`。\n\
    \n## 防火墙\n\n防火墙无非是一个具有高级安全功能的路由器。按照惯，我们将防火墙放置在数据层上端和网络层下端之间。对于这一点，我们仍然需要管理 `MAC`\
    \ 和 `IP` 地址。\n\n该设备的主要功能是执行包过滤。它管理进入和离开网络的流量，并基于端口和/或服务的概念进行。它还帮助我们创建安全规则，然后我们将这些规则包含在“安全策略”中。我们还需要决定网络中应该开放或关闭哪些服务、端口或应用程序。\n\
    \n这种设备通常被称为“边界防火墙”，因为它的自然位置位于内部网络的边界上。这个位置使其能够保护我们的内部网络免受外部世界的侵害。\n\n近年来，防火墙添加了许多新的安全功能，以至于今天我们谈论“下一代防火墙”。这些功能中的一些包括\
    \ URL 过滤、应用程序控制，以及创建 `VPNs`、`IPS` 和 `IDS` 网络。\n\n有几种类型的防火墙可用。其中一些是免费的，供家庭使用。另一些针对企业，成本可能高达数千欧元。我在此处列出主要的防火墙供应商：\n\
    \n*   **企业级防火墙**：\n    *   `Checkpoint`。参考网站：`https://www.checkpoint.com/`。\n\
    \    *   `Paloalto`。参考网站：`https://www.paloaltonetworks.com/`。\n    *   `Fortinet`。参考网站：`https://www.fortinet.com/`。\n\
    *   **私用防火墙**：\n    *   `pfSense`。参考网站：`https://www.pfsense.org/`。\n\n这些产品通常为我们提供虚拟机，我们可以练习黑客技能。我建议你在每个供应商提供的所有产品中进行选择。下面是\
    \ Fortinet 网站，它提供了一个我们可以测试此防火墙的虚拟机：\n\n![](img/image701.jpg)\n\n让我们看看 Fortinet\
    \ 防火墙是什么样的。注意，在业务背景下配置防火墙是一项复杂的操作，但基本配置如下：\n\n*   产品安装。\n*   固件/操作系统升级。\n*   网络接口配置（`LAN`、`WAN`、`DMZ`）。\n\
    *   编写基本安全策略。\n*   网络流量测试。\n*   可能的高级安全功能。\n\n下面是显示我们应该采取步骤的一些截图：\n\n*   我们可以检查多个网络接口的配置。我们显然需要一些\
    \ `IP` 地址并定义 `LAN`、`WAN`、`DMZ` 网络。\n![](img/image716.jpg)\n\n*   编写安全策略：防火墙中编写的第一条策略是所谓的“清理规则”，基本上是防火墙的最后一条规则。它阻止任何类型的流量，除非高级策略另行规定。在配置阶段，始终建议定义一条接受所有流量的规则，以验证网络是否配置正确。\n\
    ![](img/image723.jpg)\n\n防火墙始终根据某些标准工作：\n\n*   源 `IP` 地址。\n*   接收方 `IP` 地址。\n\
    *   端口和/或服务。\n\n此时，我建议你尝试这些软件之一并测试它们的一些功能。这是关于企业网络章节的结束。从现在起，我们将进入问题核心并处理渗透测试过程的第一步：信息收集。\n\
    \n## 信息收集\n\n我们准备好开始渗透测试的第一阶段，这被称为信息收集。稍后，我们将尝试更好地理解为什么它有这个名字以及它是如何工作的。\n\n渗透测试主要有三种类型：\n\
    \n*   `BLACK BOX TESTING`\n*   `GREY BOX TESTING`\n*   `WHITE BOX TESTING`\n\n\
    在黑盒测试中，执行安全测试的人员对其必须测试的网络基础设施的细节一无所知。渗透测试人员通常只会被客户的公司网站。\n\n在白盒测试中，操作者了解要检查的网络信息或要测试的区域。灰盒测试与另外两种类型相比是一个折中方案。\n\
    \n假设我们需要执行“黑盒”测试。我们对目标一无所知，这就是为什么我们需要收集更多信息。信息收集阶段就放在类似的场景中。\n\n在本章中，我们将详细分析可以帮助我们成功完成这一阶段的工具和程序。在执行这些活动时，你应该花时间。这一阶段应该准确且不忙地完成。\n\
    \n### 初步考虑\n\n我首先要说，并没有单一的方法。收集信息意味着调查、分析和研究与我们目标相关的一切。我们应该收集的信息量很大程度上取决于我们运营的业务类型。想象一下对一家运输公司进行渗透测试。我将开始收集他们的员工、供应商、随时间建立的业务关系、公司数据等信息。\n\
    \n我所有的活动将取决于我将处理的目标类型。然而，我们可以找到一些可以参考的共同步骤。根据我们想要执行搜索类型，我们可以将其示意如下：\n\n*   使用\
    \ `Google Hacking` - `Google Dorks`。\n*   使用 `Google Cache`。\n*   “Wayback machine”。\n\
    *   来自社交媒体的信息。\n*   招聘列表中的关键词。\n*   元数据提取。\n*   使用 `WHOIS`。\n*   查询 `DNS`。\n*\
    \   使用 `Maltego` 收集信息。\n*   使用 `Recon-ng` 收集信息。\n*   使用 `Shodan` 进行漏洞评估。\n"
- fmt: "\nThis list is not complete, also considering that the steps we should take\
    \ depend on our target. However, you can use this list as a good starting point.\n\
    \n# GOOGLE HACKING - GOOGLE DORKS\n\nGoogle can be used for particular queries\
    \ that are much more specific and in-depth than the ones we normally perform.\
    \ How do you make these queries? Using search operators and special strings. As\
    \ a result, Google provides what it considers the most useful result for the greatest\
    \ number of people. And that is why we must instruct the search engine to show\
    \ us the results that are most suitable for our purposes. Let's analyze some of\
    \ these advanced queries.\n\n## QUERY ON GOOGLE\n\n- `site: hackerEtico.it`\n\
    \  **EXPLANATION**: we will see the number of indexed pages belonging to a certain.\
    \ This query will show us the pages indexed by Google that are related to the\
    \ `hackerEtico.it` website.\n- `allintitle: gandalf silmarillion`\n  **EXPLANATION**:\
    \ this query will only return the pages that have the words `Gandalf` and `Silmarillion`\
    \ in the title of a document.\n- `inurl: home`\n  **EXPLANATION**: this query\
    \ only shows the pages that contain the word `home` in their URL.\n- `cache: www.larepubblica.it`\n\
    \  **EXPLANATION**: when we want to recover the cached version of a Web page,\
    \ we will type the keyword `cache`.\n- `filetype: doc home`\n  **EXPLANATION**:\
    \ this query allows us to search for certain document formats - such as `.doc`\
    \ or `.pdf` – related to a keyword specified by us. In this case, we are searching\
    \ the word `home`.\n\nIf we want to see more detailed search results, we can once\
    \ again exploit the keyword `site` but this time for a much more effective query.\n\
    \n- `site: it home`\n  **EXPLANATION**: with this query, we are searching all\
    \ the sites belonging to the `.it` domain and related to the keyword `home`. This\
    \ is the perfect query when we are looking for a specific term within a domain.\n\
    \nI invite you to experiment other possibilities using the `site` operator.\n\n\
    ## Directory Listings\n\nThe `Directory Listings` is a very useful technique that\
    \ consists in a list of folders and files within a certain website. A wrong configuration\
    \ of this function often leads to other users having access to sensitive material\
    \ that should not be disclosed. Let's see how to implement this query:\n\n**QUERY\
    \ ON GOOGLE**:\n\n- `intitle: index.of`\n- `intitle: index.of \"parent directory`\n\
    - `intitle: index.of name size`\n\n**EXPLANATION**: it is useful to try all these\
    \ combinations in order to avoid the risk of inaccurate or missing information.\n\
    \nAnother way to search for interesting files or folders is to simultaneously\
    \ use the `inurl` and `filetype` operators. Here are some practical examples:\n\
    \n- `inurl: backup` -> list of possible backup folders.\n- `inurl: admin` -> list\
    \ of possible administrative folders.\n- `inurl: admin intitle: login` -> possible\
    \ list of login pages.\n- `inurl: admin filetype: xls` -> possible `.xls` format\
    \ file named \"admin\".\n\nHere too, you should experiment with other possibilities.\
    \ It would be extremely difficult to memorize all the possible queries you can\
    \ search on Google. For this reason, you can check the Google Hacking Database\
    \ that lists hundreds of possible queries: (https://www.exploit-db.com/google-hacking-database/).\n\
    \n![](image813.jpg)\n\nBased on what you are searching for, you can select one\
    \ or more categories among the ones available on the Google Hacking Database.![]((image817.jpg)\n\
    \nYou should keep in mind that Google does not look favorably on the use of these\
    \ queries. After a certain number of attempts, a control captcha may appear to\
    \ check that you are not a robot.\n\n# GOOGLE CACHE\n\nThe Google Cache is a useful\
    \ tool that allows you to view how a Web page looked like during Google’s last\
    \ visit. If there have been any subsequent changes, you will be able to view them\
    \ and maybe discover details and sensitive data, which were incorrectly disclosed\
    \ and then hidden. There are two ways for you to view the cache:\n\n- Through\
    \ Google keywords.\n- Through dedicated websites.\n\nIf we use the first method,\
    \ we just need to type the following command: `cache: www.sitoweb.it`. If instead,\
    \ we use the second method, I recommend relying on the CachedView.com site: `http://cachedview.com/index.php?lang=it`.![](image830.jpg)\n\
    \n# WAYBACK MACHINE\n\nHave you ever wanted to monitor how a certain website has\
    \ changed over time? It is not just a fun activity. During all its revisions,\
    \ a website may indeed have exhibited documents containing crucial details for\
    \ our information gathering. We will refer to a service called `Wayback Machine`\
    \ (https://archive.org/web/).![](image837.jpg)\n\nIt is extremely simple to use\
    \ Wayback Machine. We just have to type the URL and the date. This website will\
    \ automatically take us back in time. Here, for example, we want to refer to `Google.com`\
    \ and select a specific date:![](image842.jpg)\n\n# INFORMATION FROM SOCIAL MEDIA\n\
    \nIt may seem trivial, but it is not. The social media accounts of people and\
    \ companies often reveal an impressive amount of information, which has been unwittingly\
    \ made public. Therefore, once your target is defined, I advise you to make a\
    \ careful search starting from the company’s official accounts or from the accounts\
    \ of its employees, especially the ones registered on LinkedIn, Facebook, Twitter.\
    \ I admit it sounds like a time-consuming activity, but I can guarantee it will\
    \ be worth it.\n\n# KEYWORDS IN JOB POSTINGS\n\nFor every new job listing, the\
    \ company is often disclosing more information than it might think. Imagine seeing\
    \ an offer for a technical position, perhaps even related to the IT sector. This\
    \ job advertisement often provides a list of all the technologies used by the\
    \ company. This information can give us some suggestions on where to start our\
    \ investigation. These are three well-known job posting sites:\n\n- `Monster.`\
    \ `https://www.monster.com/`\n- `Infojobs.` `https://www.infojobs.com`\n- `Jobrapido.`\
    \ `http://jobrapido.com/`\n\nBelow is an example extracted from one of these:![](image859.jpg)\n\
    \nWe can not only discover the exact name of the software not only discover the\
    \ exact name of the software used but even which versions the company is employing.\
    \ We can then ask ourselves one question: is this software produced internally\
    \ in this company? Odds are that the answer is yes.\n\n# METADATA EXTRACTION\n\
    \nNeedless to say, you can still find many documents by searching online. Most\
    \ people focus on the data content and completely ignore everything else, specifically\
    \ the so-called metadata. A metadata is nothing more than additional information\
    \ inserted within the document and it can several purposes. Think of a digital\
    \ photograph stored in a file, which contains, as metadata, the date, the author,\
    \ the type of camera used, and much more info. Almost every type of file contains\
    \ metadata, which are always present, even if in different quantities. One of\
    \ the most used software tools in this context is `ExifTool` and this is the link\
    \ to download it: `https://www.sno.phy.queensu.ca/~phil/exiftool/`. This tool\
    \ extracts and displays the metadata starting from a file we inserted. To use\
    \ it, you just need to enter the file name on the command line, and the software\
    \ will return the list of metadata. I will give you an example with an Excel file:![](image872.jpg)\n\
    \nAs you can see, we have gathered various information. You can also test with\
    \ other formats and compare the results obtained.\n\n# USING WHOIS\n\nWhile collecting\
    \ information, we should be able to identify an IP address or URL string belongs\
    \ to what Internet provider (the connectivity service provider) as well as the\
    \ domain name holder. WHOIS is a network protocol aimed at performing this task.\
    \ WHOIS can be consulted from the command line but also from Web applications\
    \ that allow to enrich the search. Now let's examine both options:\n\n- Command-line\
    \ query: just type the `whois` command followed by the website name or IP address.\n\
    \n![](image881.jpg)\n\n- Query via web application. For this example, we will\
    \ use the site `whois.net` (https://www.whois.net/). You just need to enter the\
    \ name of the site we are interested in and press \"enter\".\n"
