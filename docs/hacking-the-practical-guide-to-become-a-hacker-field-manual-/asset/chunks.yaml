    以下是我们可以看到的后门安装的注册表项：

    ![](img/image1956.jpg)


    我们现在可以尝试重启目标机器，并验证是否会自动创建 meterpreter shell。如果我们断开会话，得益于我们之前提到的 `-i 5` 选项，它将在
    5 秒后重新建立。


    # 内部网络映射


    利用阶段的下一步是对比内部网络进行映射，以发现其他可能的主机。第一个实用的命令是 `ipconfig`，它可以帮助我们获取任何可用网络接口的概述。


    然后，我们可以使用 `route print` 命令分析机器的路由表，并开始映射内部网络。

    ![](img/image1964.jpg)


    `arp -a` 命令为我们提供了所有连接到该特定网段的机器证据。

    ![](img/image1968.jpg)


    你可以通过输入 `netstat -an` 命令查看活跃的网络连接：

    ![](img/image1972.jpg)


    我们可以直接从 meterpreter shell 对整个子网运行 ARP-scan 扫描：

    ![](img/image1976.jpg)


    此外，我们也可以执行 ping 扫描命令来发现连接到该特定子网的其他新机器：

    ![](img/image1980.jpg)


    # 最终报告


    现在是时候向客户发送一份最终报告，并包含对所有完成任务的反馈了。强调这一部分的根本性至关重要。我们需要以清晰、完整的方式呈现我们收集的所有信息，以及可能帮助纠正我们发现的缺陷的建议。


    除了发现的漏洞列表和使用的利用工具外，我们还应该包含与所谓的“修复”（remediation）相关的部分。这旨在向客户展示针对我们发现的风险的所有可能的补救措施。


    最好从所采取行动的总体概述开始报告，然后逐渐进入细节。这样，报告对于董事会成员和非技术人员来说更容易阅读，他们能够准确地理解报告的内容。


    虽然我们也可以包含其他部分，但一个结构良好的报告通常由以下章节组成：


    * 执行摘要。

    * 采用的方法。

    * 结果的详细分析。


    ## 执行摘要


    执行摘要是一份即使是非技术人员（例如经理）也能理解的报告。首先，我们应该定义此任务的范围和预计持续时间。通过定义任务范围，我们希望确切知道我们应该执行什么类型的渗透测试，更重要的是我们应该包含哪些
    IP 地址或网站。


    我们必须指出发现的证据及其关键性水平。我们还需要准备一个图表，根据不同变量显示风险分布：

    ![](img/image2005.jpg)


    ## 方法论


    所采用的方法整合了从测试范围定义到最终报告的所有阶段。我们可以将该程序总结如下：


    * 测试范围定义。

    * 信息收集。

    * 网络扫描。

    * 漏洞评估。

    * 漏洞利用。

    * 漏洞利用后。

    * 其他可选测试。

    * 通过使用自动工具起草报告，例如使用 Dradis（`https://dradisframework.com/ce/`）。


    顺便提一下，报告必须包含你获得的所有与 Web 相关的结果，包括书中未解释的 `SQL Injection`（SQL 注入）和 `XSS Cross Site
    Scripting`（跨站脚本攻击）。你可能还想包含你最终使用的社会工程技术。


    ## 结果的详细分析


    在此子阶段完成的第一项任务是定义你检测到的各种漏洞的风险水平：

    ![](img/image2024.jpg)


    然后你可以列出所有的漏洞：

    ![](img/image2028.jpg)


    最后，你可以通过提到解决方案和建议来结束报告，这些建议可以帮助阻止这些风险并根除这些问题。

    '
