    ## 免责声明

    版权所有。未经作者或编辑许可，本书以任何形式（无论是电子还是机械）复制或传输任何部分，包括复印或录音。

    此处展示的所有技术仅供教学目的。它们必须在实验室并在网络或基础设施所有者的明确同意下进行。作者对技术的不当使用不承担任何责任。


    ## 道德黑客入门

    在本章中，我将尝试为你解释道德黑客是如何工作的、其目标是什么以及成为黑客应该遵循的方法。虽然本章出现的信息可能过于理论化，但请继续阅读。你在这里学到的将有助于你更好地理解后续将再次讨论的概念。


    由于媒体对安全问题的日益关注，道德黑客的角色近年来增长。此外，针对公司基础设施的各种攻击增加了人们对这些问题的意识和恐惧。


    所有这些导致了一个新职业的形成，即负责测试、验证和加强安全的实体。我这里的“实体”指的是所有情况，而不限于特定的。无论谈论的是农场、制药公司还是制造公司，我们都需要充分地保护
    IT 基础设施。


    与认知相反，你不需要特殊的技能、数十年的学习或多年的工作经验就能成为道德黑客：通过基本的准备，你就可以掌握作为道德黑客的主要概念。


    ### 渗透测试方法

    我将在章中多次提到渗透测试方法。你可能想知道它是什么意思。我们将在后面的章节中详细介绍，但现在你可以记住，渗透测试我们指的是在实体内部执行测试的所有程序。


    正如我之前提到的，无论我们处理的是葡萄酒还是药品并不重要。我们应该遵循的方法总是相同的。然而，这个过程的相似性并不意味着僵化。如果推动这种变化的是我们收集的经验以及投入在该主题上的时间，那是很好的。


    让我们花几个字来解释什么让黑客变得“道德的”。这个词帮助我们更好地定义这些专业人士使用的方法。道德黑客只有在受客户委托时才进行道德的行为。这是道德黑客与非道德黑客之间最重要的区别。结果以及道德黑客发现的问题。


    我们应该对道德黑客和安全工程师的角色进一步区分。后者更多关注网络基础设施的保护（防火墙、`IDS`、`IPS` 等）。道德黑客在特定背景下执行渗透测试方面专长。在某些情况下，两种角色会接触并交换技能。


    道德黑客从不凭自己行动，而是根据与其工作的客户达成的协议进行。此外，定义渗透测试的范围至关重要，即我们被允许工作的 IT 基础设施部分，以及我们绝不能逾越的边界。


    ### 道德黑客所需的知识

    你可能会问自己如何成为一名道德黑客。你可能认为你需要学习一整本书。实际上，这并不是必要的。一些基础技能是不可避免的，但一旦你获得了它们，一切都会变得更容易。


    首先，你应该熟悉计算机网络。如果你不从基础层面理解它是如何工作的，就不要期望能够保护或攻击网络。其次，你需要学习至少一种编程语言。我建议你从 `Python`
    开始：它容易学习且极其强大。你也可以选择其他编程语言，如 `C` 或 `Java`。它们的主要结构彼此相似。这两个方面是不可或缺的。没有它们，你就无法开始放置和修复最终工作所需的所有组件。学习一种编程语言并尝试理解计算机网络的基本概念。别担心，我将在接下来的章节中向你展示！


    ### 网络可能的攻击源

    攻击系统有多少种方法？有很多。现在我将向你展示其中一些，其他的将在后面的章节中详细说明。


    - **终端**：我指的是本地网络内用户的 PC。它们通常不受保护，也很少正确更新。

    - **智能手机和平板电脑**：如果连接到“公司网络”的 Wi-Fi，这些设备代表了不应低估的可能攻击源。

    - **软件软件**：几乎不可能为每个网络系统或设备找到带有最新发布或补丁的更新软件。网络中过时软件的存在经常会导致严重的漏洞。

    - **网络设备配置错误**：如果没有正确配置，`路由器`、交换机和防火墙（我稍后会解释）会将我们的网络部分暴露在外部。后果显而易见。

    - **内部威胁**：想象一下我们将一个带有病毒的 USB 闪盘插入连接到互联网的 PC 时会发生什么。


    ### 网络攻击的阶段

    我们终于接近了最关键的部分。首先，让我向你介绍“渗透测试”的概念。网络攻击几乎遵循一个精确的过程，而不是源于单一的行动：它是分步骤过程的结果，我们在每个阶段上花费的时间越长，最终工作就越高效。


    首先，你应该针对你想要攻击的主题收集所有可用信息。然后，你可以对可能的漏洞进行详细扫描。一旦发现有效的漏洞，你就可以尝试访问该网络。这就是渗透测试中“渗透”一词的来源。


    仅仅渗透它是不够的。始终保持访问有效以便在我们任何时候想要访问网络也是至关重要的。在技术术语中，我们可以说我们的话应该是持久的。最后，但同样重要的是，我们应该记住清除我们留下的痕迹。例如，你可以删除记录了我们活动的日志文件。在这方面，在接下来的章节中我们将更多讨论
    `IPS/IDS` 。


    这里是我刚才提到的概念的简要总结：


    1. 信息收集；

    2. 网络扫描；

    3. 访问网络；

    4. 维持系统的访问；


