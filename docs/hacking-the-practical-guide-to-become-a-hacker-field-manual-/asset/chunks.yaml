    # PRIVILEGE ESCALATION


    Let’s start again from what we learnt in the previous chapter. Suppose we have
    a not persistent meterpreter session already established on our target. It can
    be closed by the user along with the process that allowed the communication to
    start. We should first migrate to a more stable process, which is more likely
    to remain active. You can proceed either automatically or manually.


    In automatic mode, we need to type the following command:

    ![](image1826.jpg)


    We need to manually generate a list of all the running processes, select our desired
    one and note its ID. Then with the `migrate ID` command, we can run a migration
    as follows:

    ![](image1830.jpg)


    We are now interested in keeping our connection persistent on the target host.
    The first point to note is that the persistence of a connection is directly linked
    to the type of privileges we have on the same machine.


    For this reason, we should also try to elevate our privileges. The command used
    in these cases is `get system`, which will rely on a set of techniques to raise
    our privileges until we find the one suitable for achieving our purpose.

    ![](image1836.jpg)


    We can execute the `getuid` command to determine if our privilege escalation was
    successful. An example of this is the screenshot below, where we have become SYSTEM
    users.

    ![](image1840.jpg)


    ## PRIVILEGE ESCALATION WITH DISABLED UAC


    When performing privilege escalation on Windows 7 and newer operating systems,
    it is necessary to take into account a security mechanism that could create some
    difficulties for us. I am referring to the UAC (User Account Control), which allows
    an administrator user to perform administrative tasks during a standard user session.


    If the UAC is enabled, it will be impossible for us to perform a privilege escalation
    without taking other actions first. To check if the UAC is active or not within
    a certain host, go to `control panel` -> `operations center` -> `modify user account
    control settings`.

    ![](image1849.jpg)


    As a first test, let''s disable the UAC and perform a privilege escalation.

    ![](image1853.jpg)


    As expected, we were able to perform a privilege escalation with UAC disabled.


    # PRIVILEGE ESCALATION WITH ENABLED UAC


    We should start our privilege escalation by checking whether the UAC is enabled
    or not. The Metasploit module that allows us to perform this task is called `win_privs`.

    ![](image1859.jpg)


    In the example here above, the UAC is disabled. the `UAC Enabled` field is set
    to FALSE. Now let''s enable the UAC with the default settings.

    ![](image1864.jpg)


    We can launch again the UAC verification command:

    ![](image1868.jpg)


    This time the `UAC Enabled` field shows that the UAC is enabled. We can now try
    a privilege escalation with the `getsystem` command:

    ![](image1872.jpg)


    As expected, the operation failed. There is a Metasploit module called `bypass
    UAC`, which allows us to get around this obstacle. Keep in mind that this module
    has a good chance of success only if the UAC is set to the default level and not
    to the maximum one.

    ![](image1877.jpg)


    By typing the `show options` command, we can see the required settings. In particular,
    we must enter the ID of the session in which we find ourselves. We can do so by
    typing the `session -l` command and pinning the ID. Assuming we are dealing with
    session ID 2, you should type `set session 2`.

    ![](image1881.jpg)


    Finally, we can launch the bypassuac module with the `exploit` command and wait
    a few seconds. If the command is successful, we will need to find a new session
    by typing the `sessions -l` command. We can then elevate our privilege with the
    `getsystem` command and verify them with `getuid`.

    ![](image1886.jpg)


    # CREDENTIALS HASHDUMP


    typical action in these circumstances is to obtain the credentials hashes. A hash
    is a unique string generated from a certain password and based on a cryptographic
    algorithm. If the hash is not strong enough, it is possible to follow a reverse
    engineering process to recover the initial password.


    Let’s suppose we have an active session with administrative privileges, and we
    type the `hashdump` command:

    ![](image1893.jpg)


    As noticeable from the screenshot here above, we recovered the hash of the users
    "Administrator", "user1", and "guest". You can eventually try a password recovery
    ("password cracking") starting from these hashes.


    # LOCAL EXPLOIT SUGGESTER


    We have learnt in the previoust chapters of this book that the `getsystem` command
    a host to obtain the highest privileges. However, if this command is not effective,
    we can rely on the Metasploit module, which enumerates the machine in search of
    some exploits with a high success chance. This module looks as follows:

    ![](image1901.jpg)


    We always need to launch it with an active meterpreter session. Below is the list
    of suggested exploits:

    ![](image1905.jpg)


    Now you can start trying some of them until you find the one that is suitable
    for achieving your goal. For example, we can use the following exploit:

    ![](image1909.jpg)


    As usual, we set the payload as follows:

    ![](image1913.jpg)


    Here you can see an `EXITFUNC`, `LHOST` and `SESSION` (always verify the settings
    by typing the `show options` command):

    ![](image1917.jpg)


    We can type `exploit` to launch the attack. Once we succeed in this, we will become
    SYSTEM users:

    ![](image1921.jpg)


    # USING THE MIMIKATZ MODULE


    The `Mimikatz` tool in Metasploit will allow us to collect the credentials of
    the machine to which we are logged. We should rely on an established meterpreter
    session and have the SYSTEM privileges.


    First of all, the module in Metasploit should be loaded with the `load mimiakatz`
    command. Then we need to enter the `wdigest` command, and we should see the following
    screen:

    ![](image1928.jpg)


    The password has been hashed directly from the system memory and we have obtained
    the user credentials.


    # INSTALLING A BACKDOOR ON A TARGET SYSTEM


    We can now install a "backdoor" on the target system in order to make the meterpreter
    session more stable. This also allows us to return to the target system whenever
    we deem it appropriate. However, remember that you need to remove it once you
    have completed the tasks requested by the client.


    First of all, we should have the meterpreter session already configured with the
    `SYSTEM` or `Administrator` privileges.


    The backdoor that we will use will be installed on a registry key of the target
    machine with the possibility of starting it every time the machine is booted.
    This module is called `PERSISTENCE`, and these are the options available:

    ![](image1938.jpg)


    In particular:

    ![](image1942.jpg)


    Each option is defined more precisely as follows:


    *   The `-X` option starts the backdoor each time the system is booted.

    *   The `-p 8081` option is the port on which the attacking system will listen.

    *   The `-r` option specifies the IP address of the attacking machine.

    *   The `-i 5` option is the interval in seconds between each connection attempt.

    '
