    In the active mode, we interact directly with the target. `Nmap` is a tool commonly
    used in active mode. On the other hand, the passive mode listens to network traffic.
    Based on the characteristics of each operating system, we can obtain fairly precise
    information. A tool that works in this mode is "P0f" (https://it.wikipedia.org/wiki/P0f).


    # OS DETECTION WITH NMAP


    Let''s see how to detect the operating system of a certain machine using `Nmap`.
    The option to use is `-o`, so this command will be the command we need to execute:

    ![](image1308.jpg)


    By running this command, we will examine only the first 100 doors and try to detect
    the operating system. The result is the following:

    ![](image1313.jpg)


    `Nmap` was able to identify that the operating system in use is probably Windows
    and specifically version 7, 2012 or 8.1. For more details, you might have to use
    other tools as well.


    # OS DETECTION WITH XPROBE


    `XPROBE` is another tool useful for detecting the operating system. This is the
    command we should execute:

    ![](image1320.jpg)


    We should see the following results:

    ![](image1324.jpg)


    We are dealing with a Linux operating system, probably with 2.6.11 kernel.


    # OS DETECTION WITH P0F


    As anticipated, this tool allows to perform a passive operating system detection.
    In this case, we do not need to interact directly with the target machine. We
    need to capture some network traffic, so that `P0f` can complete the detection
    process. This is the command we should execute:

    ![](image1331.jpg)


    We press "send " and place the tool on hold:

    ![](image1335.jpg)


    We generate random traffic using, for example, the `netcat`:

    ![](image1339.jpg)


    This is the screen we will see if the traffic generated is enough for `P0f`:

    ![](image1343.jpg)


    As you can see, `P0f` informs us of what operating system version is currently
    used on the machine.


    # Enumeration


    Enumeration is an important phase of the penetration test process. It consists
    in exploiting the characteristics of a certain service in order to obtain as much
    information as possible. There are services that work well with this type of investigation,
    such as:


    *   `SMTP`, TCP port 25.

    *   `DNS`, UDP port 53.

    *   `SNMP`, UDP port 161.

    *   `NETBIOS`, UDP port 137,138; TCP port 139.


    In this chapter, we will examine enumeration related to the following services:


    *   `NETBIOS` enumeration.

    *   `DNS` enumeration.

    *   Enumeration through `DEFAULT PASSWORD`.


    # ENUMERATION WITH NETBIOS


    `Netbios` is a protocol that operates at the session layer of the ISO/OSI model.
    This protocol allows us to explore the network resources of computers, printers
    or files. We can use `Netbios` to extract several information, including the following:


    *   Hostname.

    *   Username.

    *   Domain.

    *   Printers.

    *   Available network folders.


    First of all, we should use `Nmap` to confirm that the TCP ports 139 and 445 are
    actually open:

    ```

    nmap -v -p 139,445 192.169.1.120

    ```

    After completing this step, we can use a special command, the `NBTSCAN`, to investigate
    systems with open ports 139,445.

    ![](image1377.jpg)


    We have a whole range of extracted `NETBIOS` information. We can refer to another
    Windows command - "net view" - to continue our investigation on a specific host:

    ```

    net view 192.168.1.10

    ```

    It gives us the list of shared resources on our target. The `net use` command
    allows us to access these resources. `Nmap` contains many scripts that can be
    used to enumerate `NETBIOS`. You can find them on the following path: `/usr/share/nmap/scripts`.

    ![](image1385.jpg)


    These are the scripts we need to verify any `NETBIOS` vulnerabilities:


    *   `smb-vuln-conficker`

    *   `smb-vuln-cve2009-3103`

    *   `smb-vuln-ms06-025`

    *   `smb-vuln-ms07-029`

    *   `smb-vuln-regsvc-dos`

    *   `smb-vuln-ms08-067`


    # ENUMERATION WITH DNS


    In the chapter related to information gathering, we have learnt how to perform
    a DNS zone transfer using the `DIG` tool. Now let''s proceed with another DSN
    enumeration technique for which we will be using another tool, called `DNSENUM`.
    With a single command we can extract different DNS records, which are the following
    ones:


    *   `SOA`

    *   `A`

    *   `MX`

    *   `NS`

    *   `CNAME`

    *   `PTR`

    *   `HINFO`

    *   `TXT`


    We need to run this command:

    ```

    dnsenum domain.com

    ```

    ![](image1426.jpg)


    # ENUMERATION WITH DEFAULT PASSWORD


    Network devices – such as routers and switches – very often have a default password.
    These passwords are defined directly by the device manufacturer. I would obviously
    suggest you change them as soon as possible. `DefaultPassword` is one of the many
    sites where default device passwords are stored (https://default-password.info/).
    This website is very easy to use. You just need to select the device model and
    manufacturer:

    ![](image1433.jpg)


    # Vulnerability Assessment


    Thanks to network scanning, banner grabbing, and enumeration, we should have at
    this point a pretty good understanding of the types of services running on our
    network. Now it''s time to look for any vulnerabilities and we will use specific
    tools to carry out this activity. A part of this research should be carried out
    manually, while we can use some tools to automate other parts of this process.


    At this link, you can find a detailed report written by SANS that lists all the
    steps we should take to perform a vulnerability Assessment: https://www.sans.org/reading-room/whitepapers/basics/vulnerability-assessment-421.
    I also want to clarify that, unlike vulnerability assessment, a penetration test
    has the additional purpose of exploiting the vulnerabilities found. We will see
    the details of each phase in the chapters related to exploitation and post exploitation.


    Below is the list of tools we will use:


    *   `Nessus`. https://www.tenable.com/products/nessus-vulnerability-scanner.

    *   `Nexpose`. https://www.rapid7.com/products/nexpose/.

    *   `OpenVAS`. http://www.openvas.org/.

