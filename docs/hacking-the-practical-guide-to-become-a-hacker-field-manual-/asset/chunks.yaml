    # OSI 层模型


    * 应用层

    * 表示层

    * 会话层

    * 传输层

    * 网络层

    * 数据链路层

    * 物理层


    我们不会对每一个层都进行详尽阐述。我们将重点关注以下几个层：物理层、数据链路层、网络层和应用层。稍后我们我们将讨论传输层。会话层和表示层对于我们想要实现的目标没有帮助。


    * **物理层**：这一层包含了与特定通信手段（铜线、光纤或无线电波网线）数据传输相关的所有内容。

    * **数据链路层**：这一层在局域网（LAN）背景下体现最为充分。在局域网中，我们需要引用网络设备的 `MAC address` 和 `IP address`
    以及它们后续的关联，称为 `ARP table`。我稍后会向你解释这些术语的准确含义。

    * **网络层**：这一层关注不同网络之间的通信。在这种情况下，我们主要使用网际协议 (`IP`)。

    * **应用层**：高层协议在此层进行相互交互。这些协议包括但不限于 `HTTP`、`HTTPS`、`FTP` 等。


    根据所涉及设备类型，我们可以为这些层找到其他名称：


    * 物理层：物理和非物理通信的手段。

    * 数据链路层：交换机。

    * 网络层：路由器。


    我们将很快深入探讨这些设备的主要特征以及它们如此重要的原因；首先，我们需要研究另外两个概念：`MAC address` 和 `IP address`。


    ## MAC 地址


    `MAC`（媒体访问控制）地址是一个 48 位的地址，由每个以太网卡或无线网卡的制造商唯一地分配。以下是一个 `MAC address` 的示例：

    ![](img/image441.jpg)


    这个地址在网络世界中是基础性的，因为它允许机器在本地上下文中（例如局域网）内被唯一识别。每当我提到 `MAC addresses` 时，我指的始终是局域网，而不是远程网络。例如，在上网时，你永远不会使用
    `MAC address`，而是会依赖 `IP address`。


    当一个或多个设备属于本地或局域网（LAN）时，所有 PC 都属于同一个子网。因此，每当我们我们需要与另一个网络通信时，我们都是隐式地指的是 `IP address`
    而非 `MAC address`。你好奇找到你设备的 `MAC address` 吗？在你的 Windows 设备上输入以下命令：`ipconfig /all`。如果你使用的是
    Linux 设备，输入这一个：`ifconfig`。


    ## IP 地址


    到书的这里为止，我一直在讨论局域网。现在我们将深入研究网际协议 (`IP`) 地址的特征。

    ![](img/image450.jpg)


    `IP address` 以 32 位数值的形式出现，并允许对网络和主机都进行识别。基本上，我们可以说 `IP address` 的一部分用于识别网络，而另一部分则定位主机（我们将在稍后介绍主机部分）。


    每当我们需要上网或与另一个子网通信时，必须使用预先分配的 `IP address`。如果未提供 `IP address`，任何机器都无法浏览。


    `IP addresses` 分为公有和私有。公有地址允许在互联网上浏览，而私有地址用于内部子网内部（例如公司网络）；任何私有 `IP address` 永远无法上网。


    让我给你举一个实际的例子。假设我们处在某个局域网内部，其 `IP address` 为 `192.168.1.0/24`。这意味着每个连接的 PC 都有属于该子网的
    `IP`，例如 `PC1 -> 192.168.1.1`、`PC2 -> 192.168.1.2`、`PC3 -> 192.168.1.3`。这些是私有 `IP
    addresses` 的示例。这些机器始终能够相互通信，但永远无法在互联网上通信，因为它们没有公有 `IP address`。


    私有 `IP addresses` 分分为三类：


    * A 类私有 `IP addresses`，起始 `IP address` 为 `10.0.0.0`，结束 `IP address` 为 `10.255.255.255`。

    * B 类私有 `IP addresses`，起始 `IP address` 为 `172.16.0.0`，结束 `IP address` 为 `172.31.255.255`。

    * C 类私有 `IP addresses`，起始 `IP address` 为 `192.168.0.0`，结束 `IP address` 为 `192.168.255.255`。


    选择特定类别取决于我们子网的大小以及必须为机器分配多少 `IP addresses`。目前，关于 `IP addresses` 你只需要知道这些。我们将在稍后的章节中回到这个话题。


    ## ARP 协议


    在这一节中，我将解释什么是 `ARP protocol`。它的操作非常简单，但使我们暴露在多种安全威胁之下。由于没有任何任何类型的身份验证，它容易受到不同类型的攻击，包括所谓的“中间人攻击”。


    `ARP` 代表“地址解析协议”。该协议跟踪 `MAC address` 和 `IP address` 之间的关联。请记住，在本地上下文中，我们需要设备通过
    `MAC address` 被识别。那么，一旦离开局域网，我们将完全通过 `IP address` 进行通信。该协议通过一个表格（即 `ARP table`）定义，该表包含了上述关联（`MAC-IP`）。


    你可以输入 `arp -a` 命令查看你 Windows PC 的 `ARP table`。

    ![](img/image473.jpg)


    如你从上面的示例所示，对于这个网络，我们可以在左侧找到 `IP addresses`，右侧找到多个 `MAC addresses`。


    ## 默认网关


    你可能已经知道“默认网关”这个术语，但它到底代表什么？当你需要在本地网络内部通信时，你会使用 `ARP protocol`，它促进了 `MAC address`
    和 `IP address` 之间的关联。


    然而，你还需要与外部通信，例如在互联网上。此时，你需要确切知道你尝试访问哪些其他网络设备，例如路由器。


    这就是默认网关派上用场的地方。当你需要在本地网络外部通信时，它是使用的“最佳设备”。每当你的 PC 不知道将数据包发送哪里时，它将其发送到默认网关进行进一步处理，并分配给位于数据包路径中的后续设备。

    ![](img/image482.jpg)


    在这个示例中，每当 PC 不知道将不属于自身子网的数据包发送哪里时，它将其发送到默认网关，即 IP 地址为 `10.0.2.2` 的设备。如果你想知道你的默认网关是什么，可以在
    Windows 设备上输入 `ipconfig /all` 命令。


    ## NAT


    现在我将提到一个对某些人来说可能很困难的概念，但它现在被用于几乎所有的网络。`NAT` 代表“网络地址转换”。但它到底意味着什么？我会尽量解释清楚。当你从家里上网时，会发生几件事：第一件事是你的
    PC 将获得一个私有 IP 地址，通常属于 C 类 (`192.168.1.0/24`)。


    然而，正如你所知，这对于上网是不够的。你需要一个公有 IP 地址，这就是路由器和 `NAT` 派上用场的地方。路由器会自动将私有 IP 地址转换为公有地址，因此你可以顺利地浏览。


    * `PRIVATE IP ADDRESS`：验证你的私有 IP 请输入 `ipconfig` 命令。

    * `PUBLIC IP ADDRESS`：检查你的公有 IP 请点击以下链接：`https://www.whatsmyip.org/`。


    '
- fmt: '

    Let’s imagine that the IP address of your personal PC is `192.168.1.10`. When
    you try to access the outside network, the router will automatically translate
    that IP address into a public one, like for example `34.34.23.12`. The peculiarity
    of this mechanism is that, if you had ten devices at home each with its own private
    IP address, they would all be associated with the same public IP address `34.34.23.12`.
    For now, I will not go into detail regarding this process. You just need to understand
    the concept of a port to achieve the same result I have just mentioned.


    ![](image499.jpg)


    In corporate networks, companies try to reduce the number of public IPs assigned.
    For this reason, few of these IPs tend to correspond to many private IP addresses
    for each of the PCs in the network. There are several reasons why this happens:


    1. The number of IPs is limited and only few of them are still available. This
    leads to higher prices for each IP address.

    2. Using this `NAT` mechanism allows you to create a first layer of network protection.
    This means that nobody from outside knows your private IP address. Instead, potential
    attackers might only be seeing your public IP address without knowing the table
    of private IP–public IP associations. This is not enough for them to trace us.


    One final comment, in corporate networks the firewall usually performs the `NAT`.
    Besides, there are several types of `NATs` and you can refer directly to Wikipedia
    (https://it.wikipedia.org/wiki/Network_address_translation) if you want to learn
    more about each one of them.


    ## DNS

    The `DNS` is another essential service of a network. As a penetration tester,
    you will hear it mentioned often because if it is not correctly configured, it
    can offer many interesting spots for an attacker. This service has become more
    understandable now than how it used to look like before. It is not easy to learn
    by heart tens, if not thousands of IP addresses. For this reason, this mechanism
    was created to translate a numeric IP address into a line of text (URL), which
    is easier to understand and remember. Rather than typing `34.25.7.34` on my browser,
    I will simply write `www.google.com`. You will soon realize that without `DNS`
    a network could not work, at least based on how we usually mean it.


    ![](image515.jpg)


    We can divide the `DNS` into two main categories: the public and the private ones.
    The public ones are meant to resolve the public IP addresses, while the private
    ones will translate the private IPs. Let’s imagine that we are in a company. We
    will have the need to translate tens of private IP addresses (access to shared
    folders, access to intranet, etc.). For this reason, we need to rely on an internal
    `DNS`.


    `DNS` have a hierarchical structure. Basically, when a `DNS` does not know a response,
    it will ask its neighbors. Of course, I am oversimplifying the whole process.
    If a certain `DNS` server is not adequately protected, it can transfer all its
    contents to an attacker. It can even share thousands of IP-name associations.
    From here comes the name of a well-known cyber-attack: the `DNS zone transfer`.
    I will not dwell into this topic and you can refer to the related page on Wikipedia
    for more details.


    ## DHCP

    We continue our analysis of the essential network services with the introduction
    of `DHCP` (Dynamic Host Configuration Protocol), namely the dynamic IP configuration
    protocol. We will refer to a local network to explain how it works. Let’s imagine
    we work as systems engineers in a company with more than a thousand employees.
    We should assign to each one of them a private IP address as well as other parameters,
    like the default gateway and the `DNS`. This task is extremely time-consuming.
    A systems engineer must be physically there in the office and assign the parameters
    to each PC. Besides being a considerable waste of time, network changes are not
    rare and can override the work of network managers.


    For all these reasons, a feature was needed to automate this task. That is why
    the `DHCP` was created. This protocol automatically assigns all the parameters
    through a central server that manages the whole network. To go into detail, a
    `DHCP` can generate two types of network packets:


    * `DHCPDISCOVER`: The PC that needs an IP address sends this packet to the entire
    network hoping that a `DHCP` server will be able to intercept it.

    * `DHCPOFFER`: When a `DHCP` server receives a `DHCPDISCOVER` packet, it tries
    to satisfy the request and sends a `DHCPOFFER` packet with all the necessary network
    parameters to the MAC address of the PC (the IP is obviously still unknown).


    ![](image533.jpg)


    ## PORT AND SERVICE

    For a penetration tester, it is necessary to have a clear understanding of the
    notions of door and service. We will often refer to these concepts in the following
    chapters related to the work methodology of an ethical hacker. We can say that
    both concepts of door and service are closely connected to each other. In order
    to perform its tasks, any PC needs to establish different types of connections
    with the outside world. It must rely on a dedicated communication channel to offer
    or require any service. We can imagine a door as the end of this channel.


    There are 65535 ports available but not all of them are used. All the ports up
    to the 1024th one are usually dedicated to the most common services. For this
    reason, they are also called “well-know ports". Here is an example. The `SSH`
    protocol’s standard port is the 22nd one, the `FTP` protocol uses port 21, and
    so on. You can find the list of standard ports at this link: https://en.wikipedia.org/wiki/List_of_TCP_and_UDP_port_numbers.


    In summary, each service needs a specific port to communicate with and from the
    outside world. This mechanism will have a strong impact on our actions as a penetration
    tester. In fact, a list of the open ports available on a certain PC can provide
    excellent information and a possible access to this system. If we want to see
    all the active communications within our Windows device, we need to type the `netstat
    -ano` command.


    ![](image547.jpg)


    For more information on the `netstat` command, you can refer to this link: https://technet.microsoft.com/en-us/library/bb490947.aspx.


    ## ARP-PING-TRACOUTE

    Let’s now turn to something more practical. I will now introduce two important
    commands which will help you in your career as a network expert. I''m referring
    to the `ARP`, `PING` commands. They will allow you to solve most network problems,
    so it is important to learn more about them. The first major distinction between
    them lays in the layer of the ISO-OSI model in which they operate:


    * `ARP` -> between data link level (MAC address) and network layer (IP address).

    * `PING` -> network layer (IP address).


    You need to get mentally prepared to face these types of situations. We can run
    into all sorts of network problems and we can make our lives easier only by identifying
    where we are exactly on the TCP/IP stack. Here I will present a working method
    that can be applied to multiple scenarios.


    **PROBLEM:** a user reports a lack of PC connectivity within the network.

    **TROUBLESHOOTING:**


    * Check that the network cable of that PC is in good condition. You can try replacing
    it. ISO-OSI PHYSICAL LAYER.

    * Check that the PC has a private IP address assigned. Run the `ifconfig` command
    on the Windows machine. ISO-OSI NETWORK LAYER.

    * If you do not have direct access to the PC, try using another one to launch
    the `PING IP-addressPC` command where `IP-addressPC` is the IP address of the
    PC. ISO-OSI NETWORK LAYER.

    * If the `PING` command does not offer a positive response, execute the `ARP`
    command and check the presence of the MAC/IP address association on that PC. ISO-OSI
    DATA LINK LAYER.

    '
