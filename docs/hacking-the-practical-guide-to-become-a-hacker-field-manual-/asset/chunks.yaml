- fmt: "\nThis is a relatively \"silent \" scan. If there is a system in the target\
    \ network that tracks the connections established, it will not record this connection\
    \ attempt. This is because no connection has been completely established. Here\
    \ too, we should start `Nmap` and run the following command:\n![](image1150.jpg)\n\
    \nWe now need to verify the scan with `Wireshark` and check the `RST` flag sent\
    \ by the attacking machine:\n![](image1154.jpg)\n\nFinally, we verify the scan\
    \ with `KFSensor`, which can even accurately detect our attempt of using `SynScan`:![](image1158.jpg)\n\
    \n`Nmap` can successfully complete this scan:\n![](image1162.jpg)\n\n# LEVEL 4\
    \ NETWORK SCAN - UDP SCAN\n\nThe previous scans are related to the TCP protocol.\
    \ However, even the UDP protocol can provide interesting results, because it is\
    \ often underestimated and not adequately protected by network administrators.\
    \ Keep in mind that the UDP protocol is connectionless and therefore behaves differently\
    \ from TCP.\n\nIn particular, if a scan is launched on a certain port and we receive\
    \ no response, then we can assume that the port is open. Otherwise, we will receive\
    \ an ICMP error message which, in short, means that the port is closed or cannot\
    \ provide significant information.\n\nWe should configure `KFSensor` and simulate\
    \ a UDP type service with port `53413`. For example:\n![](image1172.jpg)\n\nLet’s\
    \ listen with `Wireshark` and we can simultaneously launch the UDP scan with `Nmap`\
    \ on the chosen port:![](image1177.jpg)\n\nLet’s analyze the traffic with `Wireshark`:![](image1182.jpg)\n\
    \nThe first and fourth lines show the UDP packet sent. Since we cannot find any\
    \ `ICMP` packets, we can assume that the scan was successful and that port `53413`\
    \ is actually open.![](image1186.jpg)\n\nLet’s try a random UDP port (which therefore\
    \ will certainly not be open) and see the result with `Wireshark`:![](image1190.jpg)\n\
    \nAs you can see, in this case, the `ICMP` packet returns immediately back, signaling\
    \ us that the door is closed or filtered. We actually know that it does not exist.![](image1194.jpg)\n\
    \nHere ends the chapter dedicated to network scanning. There are obviously other\
    \ scanning types and techniques that you could study by yourself after reading\
    \ this book. At this link, you can find the official `Nmap` documentation: https://nmap.org/book/man.html.\n\
    \n# Banner Grabbing\n\nIn the previous chapter, we examined the main network scanning\
    \ techniques. Now it's time to identify what type of service is running on a specific\
    \ port. This information will be useful to us in the next phase where we will\
    \ look for vulnerabilities. In particular, the outdated version of a service could\
    \ be exploited by a potential hacker.\n\nWe will start from the services normally\
    \ associated with standard ports, and then move on the ones linked to unconventional\
    \ ports. Also, in this case we rely on a wizard that will lead us to define a\
    \ specific service, make it active and try to grab the banner. \n\n## INSTALLING\
    \ THE WEB SERVER MICROSOFT IIS\n\nWe proceed with the installation of the `IIS`\
    \ Web server directly from a `Windows Server 2012`. You can refer to the following\
    \ link for the installation steps: https://docs.microsoft.com/en-us/iis/get-started/whats-new-in-iis-8/8-installing-iis-on-windows-server-2012\n\
    \nAt the end of the installation process, you can open your browser and type:\
    \ `http://127.0.0.1`. If everything went well, this is what should appear on your\
    \ screen:![](image1213.jpg)\n\nWe can see that `IIS` is listening by executing\
    \ the `netstat` command and listening on port `80`. With the and filtering by\
    \ port `80`, we can see how the latter is listening:![](image1218.jpg)\n\n## BANNER\
    \ VISUALIZATION IN MICROSOFT IIS\n\nAt this point, we must be able to grab the\
    \ banner of our web server so that we can detect its type and version. First of\
    \ all, let's connect to the Web server using `telnet`:![](image1224.jpg)\n\nOnce\
    \ the channel has been set up, we can enter two commands that allow us to interact\
    \ with the web server:\n\n```\nGET / HTTP/1.1\nHOST: 127.0.0.1\n```\n\nThis is\
    \ what will appear on your screen:![](image1234.jpg) We have captured the banner\
    \ of our `IIS` web server. We can now identify the type of service and its version.\
    \ This information will be useful during the vulnerability assessment phase.\n\
    \n## BANNER CONFIGURATION ON KFSENSOR\n\nWe should now use `KFSensor` to simulate\
    \ a `Microsoft IIS` type web server.![](image1240.jpg)\n\nOnce the configuration\
    \ is complete, we can use the `Nmap` feature called `service detection`, which\
    \ will attempt to grab the banner of the listening service and inform us of what\
    \ version it is.![](image1244.jpg) `Nmap` has correctly grabbed the banner and\
    \ detected the exact version of the simulated service.\n\n## INSTALLING A FTP\
    \ SERVER\n\nWe have previously installed a `Microsoft` web server. Now, instead,\
    \ we will have to install an FTP server. You can find the installation steps at\
    \ the following link: https://social.technet.microsoft.com/wiki/contents/articles/12364.windows-server-2012-ftp-installation.aspx\n\
    \nOnce the installation is complete, we can proceed with the creation of a new\
    \ FTP site:![](image1251.jpg) We are now listening port `21` without using SSL:![](image1255.jpg)\n\
    \n## FTP BANNER GRABBING WITH NMAP\n\nWe can now capture the FTP banner using\
    \ the `Nmap` service detection feature:![](image1260.jpg) As you can see from\
    \ the screenshot above, we have correctly detected the version of the FTP service\
    \ running on the target machine. Note that some system administrators may decide\
    \ to obfuscate the banner for a certain service. We can also do this on the FTP\
    \ server defined above:![](image1265.jpg)\n\nNow we will no longer be able to\
    \ detect the version of the service with `Nmap`:![](image1269.jpg) `Nmap` was\
    \ able to understand that port `21` is open. However, it does not provide any\
    \ information about the version of the service running.\n\n## FTP BANNER GRABBING\
    \ WIRH METASPLOIT\n\nNow let's try grabbing a banner with `Metasploit`, a tool\
    \ that we will explore in depth in the next chapters. It is a tool that is used\
    \ in the exploitation phase of a system. However, there are a number of additional\
    \ modules that allow you to perform other activities, such as banner grabbing.\n\
    \nWe start `Metasploit` by launching the `msf` command from terminal. Then we\
    \ type the following command:![](image1277.jpg)\n\nIn `rhost`, we need to enter\
    \ the IP address of the victim machine, that is where the listening FTP service\
    \ is located. Once this part is completed, we can run the `exploit` command and\
    \ then start the scanner:![](image1282.jpg) The scan is quickly completed, and\
    \ the result obtained informs us of the presence of a `Microsoft FTP` server.\
    \ We grabbed the banner once again.\n\n## FTP BANNER GRABBING WITH NETCAT\n\n\
    `NETCAT` is another useful tool used for grabbing banners. You can click here\
    \ to learn more: https://en.wikipedia.org/wiki/Netcat. Below is the command used\
    \ to grab the banner:![](image1289.jpg)\n\n## FTP BANNER GRABBING WITH TELNET\n\
    \nWe have already seen how the `Telnet` command works. Let's use it now to grab\
    \ a banner:![](image1294.jpg) Even in this case, we are able to correctly detect\
    \ and grab the banner.\n\n## OPERATING SYSTEM DETECTION\n\nIn addition to detecting\
    \ a certain running service, it is also important to know the operating system\
    \ present on a given machine. We can follow two different procedures:\n\n- Active\
    \ mode.\n- Passive mode.\n"
