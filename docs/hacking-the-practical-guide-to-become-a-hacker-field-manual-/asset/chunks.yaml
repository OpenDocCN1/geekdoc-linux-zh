    WITH NMAPWe can now capture the FTP banner using the Nmap service detection feature:![](image1260.jpg)As
    you can see from the screenshot above, we have correctly detected the version
    of the FTP service running on the target machine.Note that some system administrators
    may decide to obfuscate the banner for a certain service. We can also do this
    on the FTP server defined above:![](image1265.jpg)Now we will no longer be able
    to detect the version of the service with Nmap:![](image1269.jpg)Nmap was able
    to understand that port 21 is open. However, it does not provide any information
    about the version of the service running.FTP BANNER GRABBING WIRH METASPLOITNow
    let''s try grabbing a banner with Metasploit, a tool that we will explore in depth
    in the next chapters.It is a tool that is used in the exploitation phase of a
    system. However, there are a number of additional modules that allow you to perform
    other activities, such as banner grabbing.We start Metasploit by launching the
    "msf " command from terminal. Then we type the following command:![](image1277.jpg)In
    "rhost ", we need to enter the IP address of the victim machine, that is where
    the listening FTP service is located.Once this part is completed, we can run the
    "exploit " command and then start the scanner:![](image1282.jpg)The scan is quickly
    completed, and the result obtained informs us of the presence of a Microsoft FTP
    server . We grabbed the banner once again.FTP BANNER GRABBING WITH NETCATNETCAT
    is another useful tool used for grabbing banners. You can click here to learn
    more: https://en.wikipedia.org/wiki/Netcat.Below is the command used to grab the
    banner:![](image1289.jpg)FTP BANNER GRABBING WITH TELNETWe have already seen how
    the Telnet command works. Let''s use it now to grab a banner:![](image1294.jpg)Even
    in this case, we are able to correctly detect and grab the banner.OPERATING SYSTEM
    DETECTIONIn addition to detecting a certain running service, it is also important
    to know the operating system present on a given machine.We can follow two different
    procedures:


    *   Active mode.


    *   Passive mode.'
