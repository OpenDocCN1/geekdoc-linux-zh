    MAPPINGThe next step in the exploitation phase is the mapping of the internal
    network to discover other possible hosts.The first useful command is "ipconfig
    ", which helps us to get an overview of any network interfaces available.Then,
    we can use the "route print” command to analyze the routing table of the machine
    and start to map the internal network.![](image1964.jpg)The "arp -a " command
    gives us evidence of all the machines connected to that particular network segment.![](image1968.jpg)You
    can see the active network connections by entering the "netstat -an " command:![](image1972.jpg)We
    can run an ARP-scan on the entire subnet directly from the meterpreter shell:![](image1976.jpg)We
    can otherwise execute a ping sweep command to discover other new machines connected
    to that specific subnet:![](image1980.jpg)The Final ReportIt is time now to send
    the client a final report with your feedback on all accomplished tasks.It is important
    to stress how fundamental this part is. We need to present in a clear and complete
    manner all the information we gathered as well as each suggestion that could help
    to correct the weaknesses we spotted.In addition to the list of vulnerabilities
    found and exploits used, we should include a part related to the so-called "remediation".This
    part is meant to show the customer all the possible remedies for the risks we
    discovered.It would be better to start the report with a general overview of the
    actions taken and then gradually enter into detail.In this way, the report becomes
    easier to read for members of the management board and non-technicians, who will
    be able to understand exactly what is been reported.Although we can also include
    other parts, a well-structured report usually consists of the following sections:


    *   Executive summary.


    *   Methodology used.


    *   Detailed analysis of the results.


    EXECUTIVE SUMMARYThe executive summary is the report that can be understood even
    by non-technical staff, for example by managers.First of all, we should define
    the scope and the estimated duration of this task.By defining the scope of this
    task, we want to know exactly what type of penetration test we should perform
    and even more importantly what are the IP addresses or websites that we should
    include.We must point out the evidences found and their level of criticality.
    We also need to prepare a graph showing the risk distribution according to the
    different variables:![](image2005.jpg)METHODOLOGYThe methodology used integrates
    all the phases from the definition of the test scope to the final report.We can
    summarize the procedure as follows:


    *   Definition of the test scope.


    *   Information gathering.


    *   Network scanning.


    *   Vulnerability assessment.


    *   Exploitation.


    *   Post exploitation.


    *   Other optional tests.


    *   Drafting of the report also through the use of automatic tools, for example
    with Dradis. (https://dradisframework.com/ce/).


    As a side note, the report must also contain all the results you achieved that
    were related to the Web, including the SQL Injection and XSS Cross Site Scripting
    , which were not explained in this book.You might also want to include the social
    engineering techniques you eventually used.DETAILED ANALYSIS OF THE RESULTSThe
    first task to complete in this sub-phase is defining the risk level of the various
    vulnerabilities you detected:![](image2024.jpg)Then you can enlist all the vulnerabilities:![](image2028.jpg)You
    can then conclude your report by mentioning the solutions and the suggestions
    that could help to block these risks and eradicate these problems.'
