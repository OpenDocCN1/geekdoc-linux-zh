    # Exploitation


    In the previous chapter, we saw how to search for vulnerabilities, but we also
    limited ourselves to perform an automatic analysis. As we grow our experience
    in this field, we will need to integrate this type of analysis with manual search,
    where we will perform code customization.


    Now that we have a list of possible vulnerabilities, we need to verify whether
    they are actually exploitable or not. Exploitation is meant to confirm if we can
    access our target machine from a given vulnerability. Also, in this case we can
    proceed using automatic and manual tools just like we did during the vulnerability
    assessment phase. As an introduction to ethical hacking, in this book we will
    focus on using selected tools.


    I want to start by introducing the concept of "exploit". An exploit is a sequence
    of commands, or lines of code, that exploit the vulnerabilities of a certain software.
    It can allow us to take actions that come as unexpected to the victim machine.
    Exploits can be classified as follows:


    *   Service-side exploit: this type of exploits affects a particular service listening
    on the target machine.

    *   Client-side exploit: the attack starts directly from the client machine.

    *   Local privilege escalation exploit: once we have access to the target machine,
    we need to elevate our privileges using exploits belonging to this category.


    ## SERVICE-SIDE EXPLOITATION


    On a generic machine, we have multiple services listening on certain ports. Think
    of a Web server, for example. It will most likely listen on port `80` and communicate
    via the `HTTP` protocol. If for any reasons one of these services is not configured
    correctly, it offers a great advantage to a possible attacker. This is obviously
    consequent to another series of particular conditions, including, for example,
    the perimeter firewall that allows access to that particular port on that PC.
    Once you have gained access to a specific machine, you can proceed recursively
    to gain access to other machines that may be visible only from the first compromised
    machine. In technical jargon, this action is called “pivoting”.


    ## CLIENT-SIDE EXPLOITATION


    In client-side exploitation, our point of view is completely different from the
    side-client type. In this case, the victim unknowingly unleashes the attack and
    establishes a connection with the attacking machine.


    The attack vector is usually very common. For example, the victim can start an
    executable file received by the attacker. This simple action may be sufficient
    to start a communication to the outside. In corporate networks, communication
    to the Internet is often granted and therefore perimeter security systems may
    not block this type of attack. This is a significant advantage over the first
    type of exploitation. As you can easily guess, here the user has a central role
    in starting the attack. The beginning of the attack coincides with a direct action
    performed by the victim. To start the attack, it is enough for the target user
    to open an Excel file attached to an email or downloaded from the Internet.


    ## METASPLOIT


    When it comes to exploitation, we cannot fail to mention `Metasploit`. This is
    the most well-known tool used to automate the exploitation process. Composed of
    various modules, its use is not the most immediate, and you need some experience
    to make the most of it. Going a little into detail, we can say that `Metasploit`
    consists of the following elements:


    *   an exploit database.

    *   a payload database.

    *   auxiliary modules for particular operations.

    *   post-exploitation modules for the penetration test phase.

    *   user interface to easily manage the whole structure.


    The same user interface is composed of several modules, including:


    *   `msfconsole`. From which we can execute several exploits/payloads.

    *   `MSFD`. Service listening on TCP port `5554` which allows multiple users to
    connect to the same Metasploit instance.

    *   `armitage`. A graphical version of Metasploit.

    *   `msfvenon`. It is mainly used in the client-side exploitation phase to convert
    our payloads into different types of executable files.


    # DEMONSTRATION OF CLIENT-SIDE EXPLOITATION


    Let me enlist the steps that we will follow to complete this demonstration:


    1.  Initial configuration of the victim machine with a Windows operating system.

    2.  Creation of the malicious file with `Metasploit`, in particular with the `msfvenon`
    interface.

    3.  Creation of a Web server (attacking side) on which the malicious file will
    be hosted.

    4.  Use of `Metasploit` and in particular of `msfconsole`.

    5.  Execution of the malicious file on the victim machine.

    6.  Connection established between attacker and target.

    7.  Interaction with the `Metasploit` shell.


    We need to carry out each precise step.


    ### INITIAL CONFIGURATION OF THE VICTIM MACHINE


    The first task to do is to verify the connectivity between the victim machine
    and the target machine. In this regard, we will proceed as before by setting an
    IP address between the 2 machines, for example:


    *   Victim machine (Windows 7 OS): `192.168.1.227/24`.

    *   Attacking machine (SO Kali Linux): `192.168.1.133/24`.


    Then we can confirm the communication between them with the `ping` command. A
    necessary step we need to take is to disable all the security systems of the victim
    machine.


    *   Disable the local firewall.


    ![](image1609.jpg)

