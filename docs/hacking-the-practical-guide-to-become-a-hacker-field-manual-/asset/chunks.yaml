  trans: "\n\n此列表并不完整，而且考虑到我们应该采取的步骤取决于我们的目标。不过，你可以将此列表作为一个良好的起点。\n\n# 谷歌黑客攻击 - 谷歌语法\
    \ (GOOGLE DORKS)\n\nGoogle 可用于特定的查询，这些查询比我们通常执行的要具体、更深入。你如何进行这些查询呢？使用搜索运算符和特殊字符串。结果，Google\
    \ 会提供它认为对大多数人最有用的结果。这就是为什么我们必须指示搜索引擎向我们显示最符合我们目的的结果。让我们分析一些高级查询。\n\n## 在谷歌上进行查询\n\
    \n- `site: hackerEtico.it`\n  **解释**：我们将看到属于某个特定索引页面数量。此查询将显示与 `hackerEtico.it`\
    \ 网站相关的 Google 索引页面。\n- `allintitle: gandalf silmarillion`\n  **解释**：此查询仅返回标题中包含\
    \ `Gandalf` 和 `Silmarillion` 单词的页面。\n- `inurl: home`\n  **解释**：此查询仅显示 URL 中包含\
    \ `home` 单词的页面。\n- `cache: www.larepubblica.it`\n  **解释**：当我们想要恢复 Web 页面的缓存版本时，我们将输入关键词\
    \ `cache`。\n- `filetype: doc home`\n  **解释**：此查询允许我们搜索与我们指定的关键词相关的某些文档格式——例如 `.doc`\
    \ 或 `.pdf`。在此例中，我们正在搜索单词 `home`。\n\n如果我们想看到更详细的搜索结果，我们可以再次利用关键词 `site`，但这次是用于一个更高效的查询。\n\
    \n- `site: it home`\n  **解释**：通过此查询，我们正在搜索所有属于 `.it` 域名且与关键词 `home` 站点。当我们在某个域名内寻找特定术语时，这是完美的查询。\n\
    \n我邀请你使用 `site` 运算符尝试其他可能性。\n\n## 目录列表 (Directory Listings)\n\n“目录列表”（Directory\
    \ Listings）是一种非常实用的技术，由特定网站内的文件夹和文件组成。该功能的配置不当经常会导致其他用户访问不应公开的敏感材料。让我们如何实现此查询：\n\
    \n**在谷歌上查询**：\n\n- `intitle: index.of`\n- `intitle: index.of \"parent directory`\n\
    - `intitle: index.of name size`\n\n**解释**：按顺序尝试所有这些组合以避免信息不准确或缺失的风险。\n\n另一种搜索有趣文件或文件夹的方法是同时使用\
    \ `inurl` 和 `filetype` 运算符。以下是一些实用示例：\n\n- `inurl: backup` -> 可能的备份文件夹列表。\n- `inurl:\
    \ admin` -> 可能的管理员文件夹列表。\n- `inurl: admin intitle: login` -> 可能的登录页面列表。\n- `inurl:\
    \ admin filetype: xls` -> 名为 \"admin\" 的可能的 `.xls` 格式文件。\n\n在这里你也应该尝试其他可能性。要记住所有可以在\
    \ Google 上搜索的所有可能查询是极其困难的。出于这个原因，你可以检查谷歌黑客数据库（Google Hacking Database），它列出了数百种可能的查询：(https://www.exploit-db.com/google-hacking-database/)。\n\
    \n![](img/image813.jpg)\n\n根据你搜索的内容，你可以从谷歌黑客数据库提供的可用类别中选择一个或多个类别！![](img/(image817.jpg)\n\
    \n你应该记住，Google 并不看好这些查询的使用。在尝试一定次数后，可能会出现验证码（captcha）以检查你是否为机器人。\n\n# 谷歌缓存 (GOOGLE\
    \ CACHE)\n\n谷歌缓存是一个实用的工具，允许你查看 Web 页在 Google 上次访问时的样子。如果之后有任何更改，你将能够看到它们并可能发现细节和敏感数据，这些数据曾错误地公开后被隐藏。你有两种方法查看缓存：\n\
    \n- 通过谷歌关键词。\n- 通过专用网站。\n\n如果我们使用第一种方法，只需要输入以下命令：`cache: www.sitoweb.it`。如果使用第二种方法，我建议依赖\
    \ CachedView.com 站点：`http://cachedview.com/index.php?lang=it`![](img/image830.jpg)\n\
    \n# 网页回溯 (WAYBACK MACHINE)\n\n你是否曾经想监控某个网站随时间发生的变化？这不仅仅是一项有趣的活动。在所有的修订期间，一个网站确实可能展示过包含我们信息收集关键细节的文档。我们将参考名为\
    \ `Wayback Machine` (https://archive.org/web/) 的服务。![](img/image837.jpg)\n\n使用\
    \ Wayback Machine 非常简单。我们只需要输入 URL 和日期。该网站会自动带我们回到过去。在这里，例如我们要引用 `Google.com`\
    \ 并选择一个特定日期：![](img/image842.jpg)\n\n# 来自社交媒体的信息\n\n这看起来可能很微不足道，但事实如此。个人和公司的社交媒体账户经常揭示大量令人惊讶的信息，这些信息是在无意中公开的。因此，一旦确定了目标，我建议你从公司的官方账户或其员工的账户开始仔细搜索，特别是注册在\
    \ LinkedIn、Facebook、Twitter 上的账户。我承认这听起来是一项耗时的活动，但我可以保证它是值得的。\n\n# 招聘公告中的关键词\n\
    \n对于每一个新的职位列表，公司披露的信息往往比它想象的要多。想象看到一个技术职位的邀约，可能还与 IT 部门有关。这类招聘广告通常会提供公司使用的所有技术列表。这些信息可以为我们从哪里开始调查提供一些建议。以下是三个著名的职位发布网站：\n\
    \n- `Monster.` `https://www.monster.com/`\n- `Infojobs.` `https://www.infojobs.com`\n\
    - `Jobrapido.` `http://jobrapido.com/`\n\n下面是从其中一个站点提取的示例：![](img/image859.jpg)\n\
    \n我们不仅可以发现软件的确切名称，还可以发现公司使用的确切名称，甚至是使用的版本。然后我们可以问自己一个问题：这个软件是这家公司内部生产的？答案很可能是定的。\n\
    \n# 元数据提取 (METADATA EXTRACTION)\n\n无需解释，你仍然可以通过在线搜索找到许多文档。大多数人关注数据内容而完全忽略其他所有内容，特别是所谓的元数据（metadata）。元数据无非插入到文档中的额外信息，它可以有多种用途。想象一个存储在文件中的数字照片，它包含作为元数据的日期、作者、使用的相机类型以及更多信息。几乎每类型的文件都包含元数据，这些元数据总是存在的，即使数量不同。在这一背景下，最常用的软件工具之一是\
    \ `ExifTool`，这是下载它的链接：`https://www.sno.phy.queensu.ca/~phil/exiftool/`。该工具提取并显示从我们插入的文件开始的元数据。要使用它，你只需要在命令行输入文件名，软件将返回元数据列表。我将给你一个\
    \ Excel 文件的示例：![](img/image872.jpg)\n\n如你所见，我们收集了各种信息。你也可以用其他格式进行测试并比较获得的结果。\n\
    \n# 使用 WHOIS\n\n在收集信息时，我们应该能够识别 IP 地址或 URL 字符串属于哪个互联网提供商（连接服务提供商）以及域名所有者。WHOIS\
    \ 是一种旨在执行此任务的网络协议。可以从命令行查询 WHOIS，也可以从允许丰富搜索的 Web 查询。现在让我们检查这两个选项：\n\n- 命令行查询：只需输入\
    \ `whois` 命令，后跟网站名称或 IP 地址。\n\n![](img/image881.jpg)\n\n- 通过 Web 应用程序查询。对于此示例，我们将使用站点\
    \ `whois.net` (https://www.whois.net/)。你只需要输入感兴趣的网站名称并按回车键。\n\n"
