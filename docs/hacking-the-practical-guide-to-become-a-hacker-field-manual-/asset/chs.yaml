  \ 网络扫描\n\n信息收集阶段已经结束，它允许我们收集了 IP 地址列表等信息。现在是时候扫描这些 IP 地址了。我说的“扫描”到底是什么意思？这些 IP 地址中的每一个都将向外部世界暴露特定的服务/端口。我们需要扫描它们以识别对应某个活动服务的端口。例如，Web\
  \ 服务器最有可能监听端口 `80` 或 `443` ，以便根据 `HTTP`、`HTTPS` 协议接受请求。我们有几种扫描技术可以选择。其中一些是静默的，另一些则并不如此。在本章中，我们将分析其中一些。\n\
  \n### KFSENSOR\n\n为了看到网络扫描技术的运作，我们需要在特定机器上暴露服务，或者可以使用一个非常实用的工具来让这些步骤变得简单。它被称为 `KFSensor`，是一个“蜜罐”。蜜罐是故意留有漏洞的机器，有时被用来迷惑潜在的攻击者。`KFSensor`\
  \ 是针对 `Windows` 操作系统的蜜罐。为了看到网络扫描技术的运作，我们需要在特定机器上暴露服务，或者可以使用一个非常实用的工具来让这些步骤变得简单。它被称为\
  \ `KFSensor`，是一个“蜜罐”...（此处由于原文存在重复，已为您提取核心内容翻译）\n\n在 `Windows 7` 或 `10` 虚拟机上安装。你可以从官方网站下载：http://www.keyfocus.net/kfsensor/。(image976.jpg)\n\
  \n一旦安装了 `KFSensor`，你可以继续进行服务的配置。这些服务将由软件模拟。(image980.jpg)\n\n### WIRESHARK\n\n在开始之前，我建议你安装一个“嗅探器”，这是一个允许你收集并分析网络流量的工具。嗅探器中最好的无疑是\
  \ `Wireshark` (https://www.wireshark.org/)。在我们启动各种网络扫描时，你仍然保持 `Wireshark` 运行，以便观察发生了什么。(image987.jpg)\n\
  \n### ARPING AND LEVEL 2 NETWORK SCAN\n\n我们首先要说明的是网络可以在链路层和网络层进行扫描。我们将从链路层开始。链路层（二层）扫描仅在局域网（LAN）内执行才有意义。让我开始我们将使用的第一个工具：`ARPING`。在局域网中，我们主要处理\
  \ `MAC` 地址和 `ARP` 协议。\n\n现在让我们连接 Kali Linux 机器，并在安装了 KFSensor 的 Windows 机器上运行链路层扫描（称为\
  \ ARP 扫描）。我们需要输入命令 `arping address IP -c 2` 是发送的数据包数量，你也可以输入任何数字。如果机器活动并连接到网络，这就是你看到的屏幕：![](img/image997.jpg)\n\
  \n始终保持 Wireshark 活跃，按 `ARP` 关键字过滤，并分析网络流量。在两台机器上进行分析更好。(image1001.jpg)\n\n### NMAP\
  \ AND LEVEL 2 NETWORK SCAN\n\n`nmap` 是最广泛且最可靠、通用的网络扫描工具。它允许我们执行从二层开始的多种扫描。`nmap`\
  \ 还包含了一系列额外功能，例如漏洞扫描器和枚举系统的模块。在本节中，我们将使用 `nmap` 进行二层扫描。但在之前，我想向你展示 `nmap` 执行工作的阶段：\n\
  \n1. 域名解析。\n2. `NSE` 脚本预扫描阶段。\n3. 主机发现。我们现在处于此阶段。\n4. 并行反向。\n5. 端口或协议扫描。\n6. 服务版本检测。\n\
  7. 操作系统指纹识别。\n8. 路由追踪。\n9. `NSE` 端口规则和主机规则脚本扫描阶段。\n\n\n\n\n\n现在，让我们重点关注主机发现阶段。我们必须指示\
  \ `Nmap` 不要执行任何类型的端口扫描，仅检查网络上哪些主机是活跃的。这是一个基于 `ARP` 协议和 MAC 地址的 2 层扫描。`-sn` 是你应该使用的用于指示\
  \ `Nmap` 的选项。这就是为什么我们应该启动此命令：![](img/image1021.jpg)\n\n`192.168.1.100-150` 是我们想要测试的\
  \ IP 地址范围。我们处理的可能是单个地址，也可能是一个子网。我们始终可以通过 `Nmap` 控制局面并检查发生什么的情况：![](img/image1026.jpg)\n\
  \n正如我已经指出的，这种类型的 2 层扫描仅在与 MAC 地址进行通信的本地环境中才有意义。在局域网（LAN）之外，我们只使用 IP 地址，因此网络扫描被设置在更高的级别，即网络层“\
  \ 3 层扫描”。\n\n## 3 层网络扫描的有用发现\n\n- 使用 IP 地址而不是主机名更好，这样可以避免进行 DNS 查询并可能改变已获得的结果。我们显然需要设置一些限制。\n\
  - 在处理托管多个网站的 Web 服务器时，使用主机名和 DNS 解析是有意义的。\n- 对于大型网络，完成扫描可能需要更长时间。因此，建议使用较小的网络样本，或仅关注一小范围的端口。\n\
  \n## 使用 NMAP 进行 PING 扫描\n\n现在我们转向最简单的 3 层扫描。为了实现这一点，我们将使用名为 `ICMP`（互联网控制消息协议）的特殊协议，这意味着我们没有使用\
  \ `TCP` 或 `UDP` 协议。`ICMP` 执行各种控制功能，包括验证网络内特定主机的可用性。要做到这一点，我们使用 `PING` 命令，并通过 `-c`\
  \ 选项指定我们要向目标机器或网络发送的 `ICMP` 数据包数量![](img/image1041.jpg)\n\n下面可以看到目标机器已对我们的命令做出响应，因此在网络中是活跃的![](img/image1046.jpg)\
  \ 不要忘记用 `Wireshark` 检查网络流量。你还应该使用 `\"icmp\"` 过滤器![](img/image1050.jpg) Wireshark\
  \ 清晰地向我们展示正在使用 `ICMP` 协议，数据包交换如下：\n\n- Echo request（显性请求）。攻击主机向目标机器发送了 `ICMP` 数据包。\n\
  - Echo reply（显性响应）。目标机器向攻击主机发送了响应包。\n\n## TCP 和 UDP 协议\n\n我们到为止已经提到了 ISO/OSI 模型的\
  \ 2 层（ARP 发现）和 3 层扫描。现在我们将检查传输层的第 4 层。传输层主要由 2 个协议组成：`TCP` 和 `UDP`。这两个协议之间的主要区别是\
  \ `TCP` 是一个面向连接的协议，而 `UDP` 没有连接。基本上，当我们需要使用 `TCP` 时，必须通过在两部分之间建立连接来完成。它们都应该想要并能够相互通信，否则将没有信息交换。\n\
  \n从这里，我们可以很容易推断出 `TCP` 是一个可靠的协议，除了少数且可管理的异常情况外，它还能让我们确认收到的所发送信息。相反，使用 `UDP` 时，我们没有确定性。另一方面，`UDP`\
  \ 是一个非常快的协议，而 `TCP` 由于其必须执行的所有额外检查，效率较低。让我们看看哪些字段构成了 `TCP` 和 `UDP` 数据包![](img/image1069.jpg)\n\
  \n### TCP 控制标志\n\n如上一节所示，`TCP` 协议执行连接检查。为了做到这一点，它在网络包中使用一系列额外信息，我们对所谓的“TCP 标志”感兴趣。共有六个：\n\
  \n- `SYN`\n- `ACK`\n- `RST`\n- `FIN`\n- `PSH`\n- `URG`\n\n`SYN` 和 `ACK` 是最重要的 `TCP`\
  \ 标志，因为它们参与了“三次握手”。该过程允许 `TCP` 协议建立通信。`RST` 标志的存在表明我们需要重置连接。这可能是由于连接错误导致的，而 `FIN`\
  \ 标志表示发送者不应再接收其他数据。\n\n## 三次握手\n\n此连接创建过程完全基于 `SYN` 和 `ACK` 标志。假设我们有两台机器：\n\n- `PC\
  \ A`：想要建立连接。\n- `PC B`：正在等待连接建立。\n\n交换过程如下：\n\n- `PC A` 设置数据包的 `SYN` 标志并将其发送给 `PC\
  \ B`。\n- 一旦 `PC B` 接收到它，它就会设置发送给 `PC A` 的数据包的 `SYN` 和 `ACK` 标志。\n- 当 `PC A` 接收到\
  \ `SYN-ACK` 时，它向 `PC B` 发送带有 `ACK` 标志的数据包。\n- 如果一切顺利，连接应该正确建立。\n\n三次握手是两个实体之间的数据包交换，它们使用\
  \ `TCP` 标志（`SYN` 和 `ACK`）来组织它们的通信。我们可以在 `Wireshark` 上找到所有需要的信息，如下下方的截图所示![](img/image1098.jpg)\
  \ 25 号数据包具有 `SYN` 标志，26 号是带有 `SYN` 和 `ACK` 的副本，27 号带有 `ACK` 开始通信。这是第一个数据包的截图。\n\n\
  ## 创建自定义数据包\n\n有许多软件选项允许创建和修改在网络中传输的数据包（包构造）。\"Colas Packet Builder\" 允许我们选择要创建或修改的类型![](img/image1109.jpg)\
  \ 在选择类型后（例如 `TCP`），让我们开始创建一个数据包![](img/image1114.jpg) 除其他项目外，我们可以设置之前提到的 `TCP` 标志![](img/\n\
  \n1118.jpg)\n\n## 4 层网络扫描 - CONNECT 扫描\n\n现在我们将学习最简单的 4 层扫描技术：CONNECT 扫描。这种扫描类型建立了\
  \ `TCP` 连接。换句话说，它完成了三次握手，使得扫描很大且容易被识别。建议使用 `KFSensor`、`Wireshark` 和 `Nmap` 来进行这种模拟：\n\
  \n1. 启动 `KFSensor` 并选择要监控的服务，例如端口 80。\n2. 启动 `Wireshark` 并找到正确的网络接口，过滤 `TCP`。\n\
  3. 启动 `Nmap` 然后运行扫描![](img/image1129.jpg)\n\n通过 `Wireshark` 我们应该确认扫描已经发生![](img/image1133.jpg)\
  \ 作为测试，我们可以验证扫描也被 `KFSensor` 检测到了![](img/image1138.jpg)\n\n## 4 层网络扫描 - SYN 扫描\n\
  \n现在让我们检查 SYN 类型扫描，与 CONNECT 类型不同，它没有完全完成三次握手。我们几乎可以说它完成了一半。交换过程如下：\n\n- 攻击者发送一个设置了\
  \ `SYN` 标志的数据包。\n- 受害者响应一个带有配置好的 `SYN` 和 `ACK` 标志的数据包。\n- 攻击者此时此时不完成握手，而是发送一个带有\
  \ `RST` 标志的数据包。这将强制重置连接且不完全建立。\n\n\n\n\n\n这是一个相对“静默”的扫描。如果目标网络中有跟踪已建立连接的系统，它将不会记录这次连接尝试。这是因为没有任何连接被完全建立。在这里，我们也应该启动\
  \ `Nmap` 并运行以下命令：\n![](img/image1150.jpg)\n\n我们现在需要使用 `Wireshark` 验证扫描，并检查攻击机发送的\
  \ `RST` 标志：\n![](img/image1154.jpg)\n\n最后，我们通过 `KFSensor` 验证扫描，它甚至可以准确检测到我们使用 `SynScan`\
  \ 的尝试：![](img/image1158.jpg)\n\n`Nmap` 成功完成了这次扫描：\n![](img/image1162.jpg)\n\n# 第\
  \ 4 级网络扫描 - UDP 扫描\n\n之前的扫描与 TCP 协议有关。然而，即使是 UDP 也能提供有趣的结果，因为它经常被低估且没有受到网络管理员的充分保护。请记住，UDP\
  \ 协议是无连接的，因此其行为与 TCP 不同。\n\n特别是，如果在某个端口上启动扫描且没有收到任何响应，那么我们可以假设该端口是开放的。否则，我们将收到一条\
  \ ICMP 错误消息，简而言之，这意味着端口是关闭的或无法提供有效信息。\n\n我们应该配置 `KFSensor` 并模拟一个端口为 `53413` 的 UDP\
  \ 类型服务。例如：\n![](img/image1172.jpg)\n\n让我们用 `Wireshark` 监听，同时在选择的端口用 `Nmap` 启动 UDP\
  \ 扫描：![](img/image1177.jpg)\n\n用 `Wireshark` 分析流量：![](img/image1182.jpg)\n\n第一和第四行显示了发送的\
  \ UDP 包。由于我们找不到任何 `ICMP` 包，可以假设扫描是成功的，且端口 `53413` 实际上是开放的![](img/image1186.jpg)\n\
  \n让我们尝试一个随机的 UDP 端口（因此肯定不会开放），并用 `Wireshark` 查看结果：![](img/image1190.jpg)\n\n如你所示，在这种情况下，`ICMP`\
  \ 包立即返回，信号我们门是关闭或被过滤的。我们实际上知道它不存在![](img/image1194.jpg)\n\n关于网络扫描的章节到此结束。显然，在阅读完这本书后，你还可以自己学习其他的扫描类型和技术。在此链接处，你可以找到官方\
  \ `Nmap` 文档：https://nmap.org/book/man.html。\n\n# 标志纹抓取 (Banner Grabbing)\n\n在上一章节中，我们检查了主要的网络扫描技术。现在是时候识别特定端口上运行的是什么类型的服务了。这些信息对我们的下一个阶段有用，在那个阶段我们将寻找漏洞。特别是过旧版本的服务可能会被潜在的黑客利用。\n\
  \n我们将从通常与标准端口关联的服务开始，然后转向与非常规关联的服务。此外，在这种情况下，我们依赖一个向导，它将引导我们定义特定的服务，使其激活并尝试抓取标志纹（banner）。\n\
  \n## 安装 Web 服务器 MICROSOFT IIS\n\n我们将直接从 `Windows Server 2012` 开始安装 `IIS` Web 服务器。你可以参考以下链接获取安装步骤：https://docs.microsoft.com/en-us/iis/get-started/whats-new-in-iis-8/8-installing-iis-on-windows-server-2012\n\
  \n在安装过程结束，你可以打开浏览器并输入：`http://127.0.0.1`。如果一切顺利，屏幕上应该出现这些：![](img/image1213.jpg)\n\
  \n我们可以通过执行 `netstat` 命令看到 `IIS` 正在监听端口 `80`。通过该命令并对端口 `80` 进行过滤，我们可以看到后者是如何监听的：![](img/image1218.jpg)\n\
  \n## MICROSOFT IIS 中的标志纹可视化\n\n此时，我们必须能够抓取 Web 服务器的标志纹，以便我们检测其类型和版本。首先，让我们使用 `telnet`\
  \ 连接到 Web 服务器：![](img/image1224.jpg)\n\n一旦通道建立，我们可以输入两个允许我们与 Web 服务器交互的命令：\n\n```\n\
  GET / HTTP/1.1\nHOST: 127.0.0.1\n```\n\n这将会出现在你屏幕上的内容：![](img/image1234.jpg) 我们已经捕获了\
  \ `IIS` Web 服务器的标志纹。我们现在可以识别服务的类型及其版本。这些信息在漏洞评估阶段将非常有用。\n\n## KFSENSOR 标志纹配置\n\n\
  我们现在应该使用 `KFSensor` 来模拟一个 `Microsoft IIS` 类型的 Web 服务器![](img/image1240.jpg)\n\n\
  一旦配置完成，我们可以使用 `Nmap` 的名为 `service detection` 功能，它将尝试抓取监听服务的标志纹并告知我们它是哪个版本![](img/image1244.jpg)\
  \ `Nmap` 正确地抓取了标志纹并检测到了模拟服务的准确版本。\n\n## 安装 FTP 服务器\n\n我们之前安装了 `Microsoft` Web 服务器。现在，我们必须安装一个\
  \ FTP 服务器。你可以在以下链接找到安装步骤：https://social.technet.microsoft.com/wiki/contents/articles/12364.windows-server-2012-ftp-installation.aspx\n\
  \n安装完成后，我们可以继续创建一个新的 FTP 站点：![](img/image1251.jpg) 我们现在正在不使用 SSL 的监听端口 `21`![](img/image1255.jpg)\n\
  \n## 使用 NMAP 抓取 FTP 标志纹\n\n我们现在可以使用 `Nmap` 服务检测功能捕获 FTP 标志纹：![](img/image1260.jpg)\
  \ 正如上面的截图所示，我们正确检测到了运行在目标机器上的 FTP 服务版本。注意，某些系统管理员可能会决定对某些服务的标志纹进行混淆。我们也可以在上面定义的\
  \ FTP 服务器上这样做：![](img/image1265.jpg)\n\n现在我们无法再通过 `Nmap` 检测服务的版本了![](img/image1269.jpg)\
  \ `Nmap` 能够理解端口 `21` 是开放的。然而，它没有提供任何关于运行服务的版本信息。\n\n## 使用 METASPLOIT 抓取 FTP 标志纹\n\
  \n现在让我们用 `Metasploit` 抓取标志纹，我们将在后续章节中深入探讨这个工具。它是用于系统利用阶段的工具。然而，还有许多额外的模块允许你执行其他活动，例如标志纹抓取。\n\
  \n我们通过终端运行 `msf` 命令来启动 `Metasploit`。然后输入以下命令：![](img/image1277.jpg)\n\n在完成这一部分后，我们可以运行\
  \ `exploit` 命令并启动扫描器：![](img/image1282.jpg) 扫描迅速完成，获得的结果告知我们存在 `Microsoft FTP` 服务器。我们再次抓取了标志纹。\n\
  \n## 使用 NETCAT 抓取 FTP 标志纹\n\n`NETCAT` 是另一个用于抓取标志纹的有用工具。你可以点击此处了解更多：https://en.wikipedia.org/wiki/Netcat。以下是用于抓取标志纹的命令：![](img/image1289.jpg)\n\
  \n## 使用 TELNET 抓取 FTP 标志纹\n\n我们已经看到过 `Telnet` 命令是如何工作的。让我们现在用它来抓取标志纹：![](img/image1294.jpg)\
  \ 即使在这种情况下，我们也能够正确地检测并抓取标志纹。\n\n## 操作系统检测\n\n除了检测某个运行的服务之外，了解机器上存在的操作系统也是重要的。我们可以遵循两种不同的流程：\n\
  \n- 主动模式。\n- 被动模式。\n\n\n\n\n\n在主动模式下，我们直接与目标进行交互。`Nmap` 是主动模式下常用的工具。相反，被动模式会监听网络流量。根据每个操作系统的特征，我们可以获取相当精确的信息。在此模式下工作的工具是\
  \ \"P0f\" (https://it.wikipedia.org/wiki/P0f)。\n\n# 使用 NMAP 进行操作系统检测\n\n让我们看看如何使用\
  \ `Nmap` 检测特定机器的操作系统。要使用的选项是 `-o`，因此我们需要执行的命令将是：：\n![](img/image1308.jpg)\n\n通过运行此命令，我们将只检查前\
  \ 100 个端口并尝试检测操作系统。结果如下：\n![](img/image1313.jpg)\n\n`Nmap` 能够识别出正在使用的操作系统可能是 Windows，具体版本为\
  \ 7、2012 或 8.1。若需了解更多细节，你可能还需要需要使用其他工具。\n\n# 使用 XPROBE 进行操作系统检测\n\n`XPROBE` 是另一个用于检测操作系统的有用工具。这是我们应该执行的命令：\n\
  ![](img/image1320.jpg)\n\n我们应该看到以下结果：\n![](img/image1324.jpg)\n\n我们面对的是一个 Linux\
  \ 操作系统，内核可能为 2.6.11。\n\n# 使用 P0F 进行操作系统检测\n\n正如预期的那样，该工具允许执行被式操作系统检测。在这种情况下，我们不需要直接与目标机器交互。我们需要捕捉一些网络流量，以便\
  \ `P0f` 能够完成检测过程。这是我们应该执行的命令：\n![](img/image1331.jpg)\n\n我们按下 \"send \" 并让工具挂起：\n\
  ![](img/image1335.jpg)\n\n我们使用例如 `netcat` 来生成随机流量：\n![](img/image1339.jpg)\n\n如果生成的流量足够\
  \ `P0f` 使用，我们将看到这个屏幕：\n![](img/image1343.jpg)\n\n如你所见，`P0f` 告诉我们机器上正在使用的操作系统版本。\n\
  \n# 枚举\n\n枚举是渗透测试过程中的一个重要阶段。它包含利用特定服务的特性来获取尽可能的信息。某些服务非常适合此类调查，例如：\n\n*   `SMTP`，TCP\
  \ 端口 25。\n*   `DNS`，UDP 端口 53。\n*   `SNMP`，UDP 端口 161。\n*   `NETBIOS`，UDP 端口 137,138；TCP\
  \ 端口 139。\n\n在本章中，我们将检查与以下服务的枚举：\n\n*   `NETBIOS` 枚举。\n*   `DNS` 枚举。\n*   通过 `DEFAULT\
  \ PASSWORD` 进行枚举。\n\n## 使用 NETBIOS 进行枚举\n\n`Netbios` 是一种运行在 ISO/OSI 模型会话层的协议。该协议允许我们探索计算机、打印机或文件的网络资源。我们可以使用\
  \ `Netbios` 提取几项信息，包括：\n\n*   主机名。\n*   用户名。\n*   域。\n*   打印机。\n*   可用网络文件夹。\n\n\
  首先，我们应该使用 `Nmap` 确认 TCP 端口 139 和 445 确实已开启：\n```\nnmap -v -p 139,445 192.169.1.120\n\
  ```\n完成这一步后，我们可以使用特殊命令 `NBTSCAN` 来调查开启了端口 139、445 的系统。\n![](img/image1377.jpg)\n\
  \n我们有一整系列提取出的 `NETBIOS` 信息。我们可以参考另一个 Windows 命令 - \"net view\" - 继续继续对特定主机进行调查：\n\
  ```\nnet view 192.168.1.10\n```\n它给了我们目标机上的共享资源列表。`net use` 命令允许我们访问这些资源。`Nmap`\
  \ 包含许多可以枚举 `NETBIOS` 的脚本。你可以在以下路径找到它们：`/usr/share/nmap/scripts`。\n![](img/image1385.jpg)\n\
  \n这些是我们需要验证任何 `NETBIOS` 漏洞的脚本：\n\n*   `smb-vuln-conficker`\n*   `smb-vuln-cve2009-3103`\n\
  *   `smb-vuln-ms06-025`\n*   `smb-vuln-ms07-029`\n*   `smb-vuln-regsvc-dos`\n* \
  \  `smb-vuln-ms08-067`\n\n## 使用 DNS 进行枚举\n\n在信息收集的章节中，我们学习了如何使用 `DIG` 工具执行 DNS 区域传输。现在让我们继续另一种\
  \ DNS 枚举技术，我们将使用另一个名为 `DNSENUM` 的工具。通过单个命令，我们可以提取不同的 DNS 记录，如下：\n\n*   `SOA`\n*\
  \   `A`\n*   `MX`\n*   `NS`\n*   `CNAME`\n*   `PTR`\n*   `HINFO`\n*   `TXT`\n\n\
  我们需要运行此命令：\n```\ndnsenum domain.com\n```\n![](img/image1426.jpg)\n\n## 使用默认密码进行枚举\n\
  \n网络设备——如路由器和交换机——通常都有默认密码。这些密码由设备制造商直接定义。我显然建议你尽快更改它们。`DefaultPassword` 是存储设备默认密码的众多之一\
  \ (https://default-password.info/)。这个网站非常好用。你只需要选择设备型号和制造商：\n![](img/image1433.jpg)\n\
  \n# 漏洞评估\n\n得益于网络扫描、指纹识别（banner grabbing）和枚举，到此时我们应该对网络上运行的服务类型有非常很好的了解。现在是时候寻找任何漏洞了，我们将使用特定工具来执行这项活动。这项研究的一部分应该手动进行，而我们可以使用某些工具自动处理此过程的其他部分。\n\
  \n在此链接处，你可以找到 SANS 编写详细报告，其中列出了我们执行漏洞评估时应该采取的所有步骤：https://www.sans.org/reading-room/whitepapers/basics/vulnerability-assessment-421。我还想澄清，与漏洞评估不同，渗透测试的额外目的是利用发现的漏洞。我们将在与利用和后渗透相关的章节中查看每个阶段的细节。\n\
  \n以下是我们将使用的工具列表：\n\n*   `Nessus`. https://www.tenable.com/products/nessus-vulnerability-scanner.\n\
  *   `Nexpose`. https://www.rapid7.com/products/nexpose/.\n*   `OpenVAS`. http://www.openvas.org/.\n\
