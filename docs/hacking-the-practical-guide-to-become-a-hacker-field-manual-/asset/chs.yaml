  \ Nexpose 软件并输入免费许可证密钥。![](img/image1499.jpg)\n我们可以通过连接以下链接来运行此软件：`https://localhost:3780`。打开此软件后，我们可以执行各种操作：![](img/image1504.jpg)\n\
