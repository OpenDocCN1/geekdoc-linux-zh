  扫描结果总结如下：![](img/image1517.jpg)\n在下方的图中，我们可以看到发现的漏洞的详细列表：![](img/image1521.jpg)\n\
  Nexpose 为我们提供了与（例如）`Metasploit` 进行简单交互的可能性。我们还可以看到关于每个漏洞的足够细节：![](img/image1526.jpg)\n\
  我们还收到了有关修复阶段的建议，该阶段旨在为发现的漏洞寻找解决方案：![](img/image1530.jpg)\n在这里，我们也有生成自定义报告的可能性：![](img/image1534.jpg)\n\
  \n# 漏洞搜索网站\n\n以下是一份你可以参考的网站列表，用以获取有关每个漏洞的更多详细信息：\n\n*   Exploit Database. `https://www.exploit-db.com/`.\n\
  *   Security Focus. `http://www.securityfocus.com/`.\n*   Packet Storm. `https://packetstormsecurity.com/`.\n\
  *   CVE Details. `http://www.cvedetails.com/`.\n\n![](img/image1544.jpg)\n\n# 漏洞利用\
  \ (Exploitation)\n\n在上章节中，我们学习了如何搜索漏洞，但仅限于执行自动分析。随着我们在这一领域经验的增长，我们需要将这种分析与手动搜索相结合，在其中我们将进行代码自定义。\n\
  \n现在我们已经有了一个可能的漏洞列表，需要验证它们是否真的是可以利用的。漏洞利用是为了确认我们是否可以从特定的漏洞访问目标机器。此外，在这种情况下，我们可以像在漏洞评估阶段一样，使用自动和手动工具。作为伦理黑客的入门，在书中将重点关注使用选定的工具。\n\
  \n我想先介绍“漏洞利用（exploit）”的概念。漏洞利用是一系列命令或代码行，用于利用特定软件的漏洞。它可以允许我们执行一些对受害机器来说是意外的操作。漏洞利用可以分类如下：\n\
  \n*   服务端漏洞利用（Service-side exploit）：这种类型的利用影响目标机器上监听的特定服务。\n*   客户端漏洞利用（Client-side\
  \ exploit）：攻击直接从客户端开始。\n*   本地权限提升利用（Local privilege escalation exploit）：一旦我们获得了目标机器的访问，我们需要使用属于此类别的利用来提升我们的权限。\n\
  \n## 服务端漏洞利用\n\n在通用机器上，我们有多个服务在某些端口上监听。以 Web 服务器为例，它最可能监听端口 `80` 并通过 `HTTP` 协议进行通信。如果由于任何原因，这些服务中的一个没有配置正确，它将为潜在的攻击者提供巨大的优势。这显然是另一系列特定条件的结果，例如允许访问该\
  \ PC 上特定端口的边界防火墙。一旦你获得了对特定机器的访问，你就可以递归地访问其他机器，这些机器可能只能从第一台被破解的机器可见。在技术术语中，这种操作被称为“跳转（pivoting）”。\n\
  \n## 客户端漏洞利用\n\n在客户端漏洞利用中，我们的视角与客户端类型完全不同。在这种情况下，受害者在不知情的情况下释放了攻击，并与攻击机器建立了连接。\n\
  \n攻击向量通常非常常见。例如，受害者可以启动由攻击者接收的可执行文件。这个简单的动作可能就足以开始与外部通信了。在企业网络中，与互联网的通信通常是允许的，因此边界安全系统可能不会拦截这种攻击。这与第一种利用相比是一个显著优势。正如你猜到的那样，这里用户在启动攻击中起着核心作用。攻击的开始与受害者执行的直接动作一致。要启动攻击，目标用户只需打开一个邮件附件或从互联网下载的\
  \ Excel 文件即可。\n\n## METASPLOIT\n\n谈到漏洞利用时，我们无法不提到 `Metasploit`。这是用于自动化漏洞利用过程的最著名的工具。它由各种模块组成，其用法并不是最直接的，你需要一些经验才能充分发挥它的作用。详细来说，我们可以说\
  \ `Metasploit` 由以下元素组成：\n\n*   一个漏洞数据库。\n*   一个负载（payload）数据库。\n*   用于特定操作的辅助模块。\n\
  *   用于渗透测试阶段的后渗透模块。\n*   便于管理整个结构的用户界面。\n\n相同的用户界面由几个模块组成，包括：\n\n*   `msfconsole`。通过它可以执行多个漏洞/负载。\n\
  *   `MSFD`。监听 TCP 端口 `5554` 的服务，允许多个用户连接到同一个 Metasploit 实例。\n*   `armitage`。Metasploit\
  \ 的图形版本。\n*   `msfvenon`。它主要用于客户端漏洞利用阶段，将我们的负载转换为不同类型的可执行文件。\n\n# 客户端漏洞利用演示\n\n\
  让我列出我们将为完成此演示而遵循的步骤：\n\n1.  带有 Windows 系统的受害机进行初始配置。\n2.  使用 `Metasploit`（特别是 `msfvenon`\
  \ 接口）创建恶意文件。\n3.  在 Web 服务器（攻击方）上创建一个用于托管恶意文件的服务器。\n4.  使用 `Metasploit`，特别是 `msfconsole`。\n\
  5.  在受害机上执行恶意文件。\n6.  攻击者与目标之间建立连接。\n7.  与 `Metasploit` shell 交互。\n\n我们需要执行每一个精确的步骤。\n\
  \n### 受害机的初始配置\n\n要执行的任务的任务是验证受害机与目标机器之间的连通性。在这方面，我们将像以前一样通过在 2 台机器之间设置 IP 地址，例如：\n\
  \n*   受害机（Windows 7 系统）：`192.168.1.227/24`。\n*   攻击机（SO Kali Linux 系统）：`192.168.1.133/24`。\n\
  \n然后我们可以通过 `ping` 命令确认它们之间的通信。我们需要采取的必要步骤是禁用受害机所有的安全系统。\n\n*   禁用本地防火墙。\n\n![](img/image1609.jpg)\n\
  \n\n\n\n\n*   如下方所示，取消勾选所有框以禁用 Windows Defender：\n\n![](img/image1615.jpg)\n\n##\
  \ 创建恶意文件\n连接到 Kali 机器并输入以下命令：\n![](img/image1620.jpg)\n特别是：\n\n*   `LHOST` 是攻击机（即\
  \ Kali）的本地地址。\n*   `LPORT` 是我们用来监听并等待他人连接的端口。\n*   `FileMale.exe` 将是生成的恶意文件，并位于\
  \ Kali 机器的 `/tmp` 文件夹中。\n\n## 搭建简单的服务器\n一旦生成了恶意文件，我们就创建一个虚拟的 Web 服务器来托管它，这样就可以从目标机器上地下载了。我们应该在\
  \ Kali 终端中输入以下命令：\n![](img/image1634.jpg)\n通过这种方式，我们放置了一个监听在 `8000` 端口的简易 Web 服务器。\n\
  \n## 准备利用/载荷（Exploit/Payload）\n一旦 Web 服务器处于监听状态，我们就应该进入 Metasploit 进行漏洞利用和载荷配置。注意\
  \ `EXPLOIT`（漏洞利用）和 `PAYLOAD`（载荷）之间的区别。漏洞利用允许我们利用给定的漏洞。载荷是通过使用 `EXPLOIT` 命令执行的代码段。\n\
  \n我们启动 `msfconsolle` 并选择我们想要使用的利用程序。在特定情况下，我们指的是以下一个（multi / handler）：\n![](img/image1642.jpg)\n\
  我们按下 \"send \" 按钮并选择载荷：\n![](img/image1646.jpg)\n在此步骤之后，我们必须输入配置所需的所有参数。输入 `show\
  \ options` 命令并验证所需信息，即“Required”（必填）字段是否为“Yes”（是）。\n![](img/image1650.jpg)\n因此，我们如下设置\
  \ `LHOST` 和 `LPORT`：\n\n*   输入 `set LPORT 192.168.1.133` 或我们的 IP 地址，以及攻击机的 IP 地址。\n\
  *   输入 `set LPORT 8080`，这是我们之前在 `msfvenon` 中选择的端口。\n\n然后我们可以输入命令 `EXPLOIT` 来执行利用程序。现在我们已经准备好接收来自受害者机器的连接，并正在等待其连接。\n\
  \n### 攻破主机\n现在我们模拟用户下载并运行托管在我们 Web 服务器上的恶意文件。我们首先在受害者机器的浏览器中输入以下 URL：\n![](img/image1663.jpg)\n\
  下载文件到本地并运行它。此时，如果我们回到 Kali 机器和 Metasploit，我们可以看到已经建立了连接：\n![](img/image1668.jpg)\n\
  我们终于开始与受害者机器进行交互。通过 `sessions -l` 命令，我们可以看到哪些是活动连接及其 ID；然后通过 `session -i ID` 命令访问我们感兴趣的会话。\n\
  在这种情况下，我们的目标是 ID 为 `1` 的连接，它是唯一的活动连接：\n![](img/image1673.jpg)\n现在几乎就像我们位于受害者机器的\
  \ DOS 窗口中一样，我们可以执行各种操作。主机攻破成功了。\n![](img/image1677.jpg)\n\n## 服务端利用\n我们将分析另一种称为“服务端”的利用类型。我们将利用一个存在\
  \ Windows 操作系统旧版音频软件中的漏洞，该软件名为 ICECAST (http://icecast.org/)。以下是我们采取的步骤：\n\n1. \
  \ 在受害者机器上安装 ICECAST 2.0.0。\n2.  Metasploit 的初始配置。\n3.  发送利用程序并激活 meterpreter 会话。\n\
  4.  在 Icecast 内存进程上激活 meterpreter  shell。\n5.  使用 meterpreter 访问受害者机器。\n\n### 在\
  \ Windows 上安装 ICECAST\n从 icecast.org 网站下载该软件的 2.0.0 版本并安装在受害者机器上：\n![](img/image1691.jpg)\n\
  我们现在将 Icecast 包含在 Windows 部分，与“程序执行保护”相关的异常中：\n![](img/image1695.jpg)\n\n### METASPLOIT\
  \ 初始配置\n首先，让我们运行搜索命令在 Metasploit 中搜索与 Icecast 相关的利用程序：\n![](img/image1700.jpg)\n\
  我们可以看到该利用程序存在，这就是我们能够选择它的原因：\n![](img/image1704.jpg)\n现在我们需要指定想要使用的什么载荷：\n![](img/image1708.jpg)\n\
  现在需要通过运行 `show options` 命令来配置 Metasploit，如下所示：\n![](img/image1712.jpg)\n特别是：\n\n\
  *   `RHOST`，即受害者机器的 IP 地址。\n*   `LHOST`，基本上是攻击机的 IP 地址。\n\n我们可以得出以下结论：\n![](img/image1722.jpg)\n\
  ![](img/image1727.jpg)\n\n### 攻破主机\n我们已准备好执行攻击。进入受害者机器并启动 Icecast：\n![](img/image1732.jpg)\n\
  现在回到攻击机并输入 `exploit` 命令来启动我们刚刚配置的内容。如果每一步都执行正确，我们应该有一个打开的会话和一次成功的攻击：\n![](img/image1737.jpg)\n\
  现在我们通过 `session -i` 命令访问受害者机器上的 meterpreter 会话：\n![](img/1741.jpg)\n在 meterpreter\
  \ 中执行以下命令：\n\n*   `SYSINFO` 获取操作系统信息。\n![](img/1748.jpg)\n*   `GETUID` 查看我们正在使用的用户。\n\
  ![](img/1755.jpg)\n*   `SHELL` 访问命令提示符。\n![](img/1761.jpg)\n*   `SCREENSHOT` 获取受害者机器的截图。\n\
  ![](img/1767.jpg)\n*   `PS` 查看受害者机器上运行的所有进程。\n![](img/1773.jpg)\n在这些进程中，我们可以发现当前活跃的“Icecast”进程：\n\
  ![](img/1777.jpg)\n现在我们可以迁移到另一个进程。我们将在下一章中详细介绍此操作，但我们可以通过迁移到 notepad 进程提前准备：\n![](img/1781.jpg)\n\
  `notepad.exe` 进程 ID 为 `2708`，而 `Icecast.exe` 进程 ID 为 `2808`。现在让我们将 Icecast 进程迁移到\
  \ notepad。为此，执行 `migrate` 命令：\n![](img/image1785.jpg)\n如果我现在关闭 notepad，我将会丢失连接。你可以尝试\
  \ meterpreter 的其他命令组合。\n\n## 渗透后利用\n一旦主机被攻破，我们需要查看在利用后应该执行的所有活动。在这些活动中，最重要的：\n\n\
  *   权限提升。\n*   访问维护。\n*   数据收集。\n*   针对新主机的循环扫描过程。\n*   针对新主机的重复利用。\n\n\n\n\n# 权限提升\n\
  \n让我们从上一章学到的内容重新开始。假设我们已经在目标机器上建立了一个非持久性的 meterpreter 会话。用户可以通过该会话允许通信启动的进程将其关闭。我们应该首先迁移到一个更稳定的进程，该进程更有可能保持活动状态。你可以自动或手动进行此操作。\n\
  \n在自动模式下，我们需要输入以下命令：\n![](img/image1826.jpg)\n\n我们需要手动生成所有运行进程的列表，选择我们需要的进程并记录其\
  \ ID。然后，通过 `migrate ID` 命令，我们可以如下所示执行迁移：\n![](img/image1830.jpg)\n\n我们现在对在目标主机上保持连接的持久性感兴趣。需要注意的第一点是，连接的持久性与我们在同一台机器上拥有的权限类型直接相关。\n\
  \n因如此，我们还应该尝试提升权限。这些情况下使用的命令是 `get system`，它将依赖一组技术来提升我们的权限，直到找到适合实现我们目的的方法。\n![](img/image1836.jpg)\n\
  \n我们可以执行 `getuid` 命令来确定权限提升是否成功。下面的截图就是一个例子，在其中我们已经变成了 SYSTEM 用户。\n![](img/image1840.jpg)\n\
  \n## 禁用 UAC 时的权限提升\n\n在 Windows 7 和更高版本的操作系统上执行权限提升时，必须考虑一种可能会为我们带来一些困难的安全机制。我指的是\
  \ UAC（用户账户控制），它允许管理员用户在标准用户会话期间执行管理任务。\n\n如果启用了 UAC，在我们不先采取其他操作的情况下是不可能执行权限提升的。要检查特定主机上的\
  \ UAC 是否激活，进入 `控制面板` -> `操作中心` -> `更改用户账户控制设置`。\n![](img/image1849.jpg)\n\n作为第一个测试，让我们禁用\
  \ UAC 并执行权限提升。\n![](img/image1853.jpg)\n\n如预期，我们能够在禁用 UAC 的情况下执行权限提升。\n\n## 启用 UAC\
  \ 时的权限提升\n\n我们应该通过检查 UAC 是否启用来开始权限提升。允许我们执行此任务的 Metasploit 模块被称为 `win_privs`。\n\
  ![](img/image1859.jpg)\n\n在上面的示例中，UAC 已禁用。`UAC Enabled` 字段被设置为 FALSE。现在让我们用默认设置启用\
  \ UAC。\n![](img/image1864.jpg)\n\n我们可以再次启动 UAC 验证命令：\n![](img/image1868.jpg)\n\n\
  这次 `UAC Enabled` 字段显示 UAC 已启用。我们现在可以尝试使用 `getsystem` 命令进行权限提升：\n![](img/image1872.jpg)\n\
  \n如预期，操作失败了。有一个名为 `bypass UAC` 的 Metasploit 模块，它允许我们绕过这个障碍。请记住，只有当 UAC 设置为默认级别而不是最高级别时，该模块才有较大的成功概率。\n\
  ![](img/image1877.jpg)\n\n通过输入 `show options` 命令，我们可以看到所需的设置。特别是，我们必须输入我们所在会话的 ID。我们可以通过输入\
  \ `session -l` 命令并固定 ID 来这样做。假设我们正在处理会话 ID 2，您应该输入 `set session 2`。\n![](img/image1881.jpg)\n\
  \n最后，我们可以使用 `exploit` 命令启动 bypassuac 模块并等待几秒。如果命令成功，我们需要通过输入 `sessions -l` 命令找到一个新的会话。然后我们可以使用\
  \ `getsystem` 命令提升权限，并用 `getuid` 进行验证。\n![](img/image1886.jpg)\n\n# 凭据哈希导出 (HASHDUMP)\n\
  \n在这种情况下，典型的操作是获取凭据哈希值。哈希是根据特定密码并基于加密算法生成的唯一字符串。如果哈希值不够强，可以通过逆向工程过程来恢复初始密码。\n\n\
  假设我们拥有一个具有管理员权限的活动会话，并输入 `hashdump` 命令：\n![](img/image1893.jpg)\n\n从上面的截图中可以看出，我们恢复了用户\
  \ \"Administrator\"user1\" 和 \"guest\" 的哈希值。你最终可以从这些哈希值开始尝试密码恢复（密码破解）。\n\n# 本地漏洞建议\
  \ (LOCAL EXPLOIT SUGGESTER)\n\n我们在本书之前的章节中学习了 `getsystem` 命令可以让主机获取最高权限。然而，如果此命令无效，我们可以依靠\
  \ Metasploit 模块，该模块会对机器进行枚举，寻找具有高成功率的漏洞。该模块如下：\n![](img/image1901.jpg)\n\n我们总是需要在活跃的\
  \ meterpreter 会话中启动它。以下是建议的漏洞列表：\n![](img/image1905.jpg)\n\n现在你可以开始尝试其中的一些，直到找到适合实现你目标的漏洞。例如，我们可以使用以下漏洞：\n\
  ![](img/image1909.jpg)\n\n像往常一样，我们如下设置 payload：\n![](img/image1913.jpg)\n\n在这里你可以看到\
  \ `EXITFUNC`、`LHOST` 和 `SESSION`（始终通过输入 `show options` 命令来验证设置）：\n![](img/image1917.jpg)\n\
  \n我们可以输入 `exploit` 来启动攻击。一旦我们成功，我们将变成 SYSTEM 用户：\n![](img/image1921.jpg)\n\n# 使用\
  \ MIMIKATZ 模块\n\nMetasploit 中的 `Mimikatz` 工具将允许我们收集登录机器的凭据。我们应该依赖于已建立的 meterpreter\
  \ 会话并拥有 SYSTEM 权限。\n\n首先，应该使用 `load mimiakatz` 命令加载 Metasploit 中的模块。然后我们需要输入 `wdigest`\
  \ 命令，我们应该看到以下屏幕：\n![](img/image1928.jpg)\n\n密码已直接从系统内存中哈希化，我们已经获得了用户凭据。\n\n# 在目标系统上安装后门\n\
  \n我们现在可以在目标系统上安装“后门”，以使 meterpreter 会话更稳定。这也允许我们在认为适当的随时返回目标系统。然而，请记住，在完成客户要求的任务后将其移除。\n\
  \n首先，我们的 meterpreter 会话应该已经配置 `SYSTEM` 或 `Administrator` 权限。\n\n我们将使用的后门将安装在目标机器的注册表中，并可以在每次机器启动时启动它。该模块被称为\
  \ `PERSISTENCE`，这些是可用选项：\n![](img/image1938.jpg)\n\n特别是：\n![](img/image1942.jpg)\n\
  \n每个选项的详细定义如下：\n\n*   `-X` 选项在每次系统启动时启动后门。\n*   `-p 8081` 选项是攻击系统监听的端口。\n*   `-r`\
  \ 选项指定攻击机器的 IP 地址。\n*   `-i 5` 选项是每次连接尝试之间的间隔（秒）。\n\n\n\n\n以下是我们可以看到的后门安装的注册表项：\n\
  ![](img/image1956.jpg)\n\n我们现在可以尝试重启目标机器，并验证是否会自动创建 meterpreter shell。如果我们断开会话，得益于我们之前提到的\
  \ `-i 5` 选项，它将在 5 秒后重新建立。\n\n# 内部网络映射\n\n利用阶段的下一步是对比内部网络进行映射，以发现其他可能的主机。第一个实用的命令是\
  \ `ipconfig`，它可以帮助我们获取任何可用网络接口的概述。\n\n然后，我们可以使用 `route print` 命令分析机器的路由表，并开始映射内部网络。\n\
  ![](img/image1964.jpg)\n\n`arp -a` 命令为我们提供了所有连接到该特定网段的机器证据。\n![](img/image1968.jpg)\n\
  \n你可以通过输入 `netstat -an` 命令查看活跃的网络连接：\n![](img/image1972.jpg)\n\n我们可以直接从 meterpreter\
  \ shell 对整个子网运行 ARP-scan 扫描：\n![](img/image1976.jpg)\n\n此外，我们也可以执行 ping 扫描命令来发现连接到该特定子网的其他新机器：\n\
  ![](img/image1980.jpg)\n\n# 最终报告\n\n现在是时候向客户发送一份最终报告，并包含对所有完成任务的反馈了。强调这一部分的根本性至关重要。我们需要以清晰、完整的方式呈现我们收集的所有信息，以及可能帮助纠正我们发现的缺陷的建议。\n\
  \n除了发现的漏洞列表和使用的利用工具外，我们还应该包含与所谓的“修复”（remediation）相关的部分。这旨在向客户展示针对我们发现的风险的所有可能的补救措施。\n\
  \n最好从所采取行动的总体概述开始报告，然后逐渐进入细节。这样，报告对于董事会成员和非技术人员来说更容易阅读，他们能够准确地理解报告的内容。\n\n虽然我们也可以包含其他部分，但一个结构良好的报告通常由以下章节组成：\n\
  \n* 执行摘要。\n* 采用的方法。\n* 结果的详细分析。\n\n## 执行摘要\n\n执行摘要是一份即使是非技术人员（例如经理）也能理解的报告。首先，我们应该定义此任务的范围和预计持续时间。通过定义任务范围，我们希望确切知道我们应该执行什么类型的渗透测试，更重要的是我们应该包含哪些\
  \ IP 地址或网站。\n\n我们必须指出发现的证据及其关键性水平。我们还需要准备一个图表，根据不同变量显示风险分布：\n![](img/image2005.jpg)\n\
  \n## 方法论\n\n所采用的方法整合了从测试范围定义到最终报告的所有阶段。我们可以将该程序总结如下：\n\n* 测试范围定义。\n* 信息收集。\n* 网络扫描。\n\
  * 漏洞评估。\n* 漏洞利用。\n* 漏洞利用后。\n* 其他可选测试。\n* 通过使用自动工具起草报告，例如使用 Dradis（`https://dradisframework.com/ce/`）。\n\
  \n顺便提一下，报告必须包含你获得的所有与 Web 相关的结果，包括书中未解释的 `SQL Injection`（SQL 注入）和 `XSS Cross Site\
  \ Scripting`（跨站脚本攻击）。你可能还想包含你最终使用的社会工程技术。\n\n## 结果的详细分析\n\n在此子阶段完成的第一项任务是定义你检测到的各种漏洞的风险水平：\n\
  ![](img/image2024.jpg)\n\n然后你可以列出所有的漏洞：\n![](img/image2028.jpg)\n\n最后，你可以通过提到解决方案和建议来结束报告，这些建议可以帮助阻止这些风险并根除这些问题。\n"
