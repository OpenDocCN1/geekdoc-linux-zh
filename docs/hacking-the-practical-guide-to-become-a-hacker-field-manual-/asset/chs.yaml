- "# 黑客攻击：成为黑客的实用指南 ｜ 道德黑客现场手册 ｜包含基于 Kali Linux 的道德黑客实战\n\n\n\n![](img/image8.jpg)\n\
  ![](img/image8.jpg)\n\n\n## 免责声明\n\n## 道德黑客入门\n在本章中，我将尝试为你解释道德黑客是如何工作的、其目标是什么以及成为黑客应该遵循的方法。虽然本章出现的信息可能过于理论化，但请继续阅读。你在这里学到的将有助于你更好地理解后续将再次讨论的概念。\n\
  \n由于媒体对安全问题的日益关注，道德黑客的角色近年来增长。此外，针对公司基础设施的各种攻击增加了人们对这些问题的意识和恐惧。\n\n所有这些导致了一个新职业的形成，即负责测试、验证和加强安全的实体。我这里的“实体”指的是所有情况，而不限于特定的。无论谈论的是农场、制药公司还是制造公司，我们都需要充分地保护\
  \ IT 基础设施。\n\n与认知相反，你不需要特殊的技能、数十年的学习或多年的工作经验就能成为道德黑客：通过基本的准备，你就可以掌握作为道德黑客的主要概念。\n\
  \n### 渗透测试方法\n我将在章中多次提到渗透测试方法。你可能想知道它是什么意思。我们将在后面的章节中详细介绍，但现在你可以记住，渗透测试我们指的是在实体内部执行测试的所有程序。\n\
  \n正如我之前提到的，无论我们处理的是葡萄酒还是药品并不重要。我们应该遵循的方法总是相同的。然而，这个过程的相似性并不意味着僵化。如果推动这种变化的是我们收集的经验以及投入在该主题上的时间，那是很好的。\n\
  \n让我们花几个字来解释什么让黑客变得“道德的”。这个词帮助我们更好地定义这些专业人士使用的方法。道德黑客只有在受客户委托时才进行道德的行为。这是道德黑客与非道德黑客之间最重要的区别。结果以及道德黑客发现的问题。\n\
  \n我们应该对道德黑客和安全工程师的角色进一步区分。后者更多关注网络基础设施的保护（防火墙、`IDS`、`IPS` 等）。道德黑客在特定背景下执行渗透测试方面专长。在某些情况下，两种角色会接触并交换技能。\n\
  \n道德黑客从不凭自己行动，而是根据与其工作的客户达成的协议进行。此外，定义渗透测试的范围至关重要，即我们被允许工作的 IT 基础设施部分，以及我们绝不能逾越的边界。\n\
  \n### 道德黑客所需的知识\n你可能会问自己如何成为一名道德黑客。你可能认为你需要学习一整本书。实际上，这并不是必要的。一些基础技能是不可避免的，但一旦你获得了它们，一切都会变得更容易。\n\
  \n首先，你应该熟悉计算机网络。如果你不从基础层面理解它是如何工作的，就不要期望能够保护或攻击网络。其次，你需要学习至少一种编程语言。我建议你从 `Python`\
  \ 开始：它容易学习且极其强大。你也可以选择其他编程语言，如 `C` 或 `Java`。它们的主要结构彼此相似。这两个方面是不可或缺的。没有它们，你就无法开始放置和修复最终工作所需的所有组件。学习一种编程语言并尝试理解计算机网络的基本概念。别担心，我将在接下来的章节中向你展示！\n\
  \n### 网络可能的攻击源\n攻击系统有多少种方法？有很多。现在我将向你展示其中一些，其他的将在后面的章节中详细说明。\n\n- **终端**：我指的是本地网络内用户的\
  \ PC。它们通常不受保护，也很少正确更新。\n- **智能手机和平板电脑**：如果连接到“公司网络”的 Wi-Fi，这些设备代表了不应低估的可能攻击源。\n\
  - **软件软件**：几乎不可能为每个网络系统或设备找到带有最新发布或补丁的更新软件。网络中过时软件的存在经常会导致严重的漏洞。\n- **网络设备配置错误**：如果没有正确配置，`路由器`、交换机和防火墙（我稍后会解释）会将我们的网络部分暴露在外部。后果显而易见。\n\
  - **内部威胁**：想象一下我们将一个带有病毒的 USB 闪盘插入连接到互联网的 PC 时会发生什么。\n\n### 网络攻击的阶段\n我们终于接近了最关键的部分。首先，让我向你介绍“渗透测试”的概念。网络攻击几乎遵循一个精确的过程，而不是源于单一的行动：它是分步骤过程的结果，我们在每个阶段上花费的时间越长，最终工作就越高效。\n\
  \n首先，你应该针对你想要攻击的主题收集所有可用信息。然后，你可以对可能的漏洞进行详细扫描。一旦发现有效的漏洞，你就可以尝试访问该网络。这就是渗透测试中“渗透”一词的来源。\n\
  \n仅仅渗透它是不够的。始终保持访问有效以便在我们任何时候想要访问网络也是至关重要的。在技术术语中，我们可以说我们的话应该是持久的。最后，但同样重要的是，我们应该记住清除我们留下的痕迹。例如，你可以删除记录了我们活动的日志文件。在这方面，在接下来的章节中我们将更多讨论\
  \ `IPS/IDS` 。\n\n这里是我刚才提到的概念的简要总结：\n\n1. 信息收集；\n2. 网络扫描；\n3. 访问网络；\n4. 维持系统的访问；\n\
  \n\n\n\n\n# 5. 取消日志文件。\n\n我们正在接近定义什么是渗透测试了。让我们继续吧。渗透测试——我们几乎所有的工作都是围绕着遵循和执行这一过程展开的。如果能正确应用这些知识，你将看到更有效的成果。这样，你就有更大的概率作为一名道德黑客成功完成工作。\n\
  \n你现在可能在问自己一个问题：我应该如何向客户汇报结果和问题呢？这很简单！通过报告来完成。所谓的最终报告包含了所采取的每一个步骤和行动，以及为了解决你发现的漏洞而给出的有用建议。\n\
  \n尽管如此，我想帮助你更好地理解到目前为止的概念：在客户的付费下，道德黑客按照上述程序执行渗透测试。完成此程序后，道德黑客将向客户发送一份最终报告，其中将提到所有已执行和发现的内容。这是道德黑客的主要任务。在书的其余部分，我将向你展示如何实现这一结果。现在，请放松。你将看到确定的结果；你只需要相信这一点并一点耐心。\n\
  \n## 渗透测试的阶段\n\n现在我们将看到执行渗透测试的常用程序。以下是列表，我们将深入探讨这些步骤中的每一个：\n\n1. 信息收集。\n2. 网络扫描。\n\
  3. 枚举。\n4. 漏洞评估。\n5. 漏洞利用。\n6. 渗透后。\n7. 最终报告。\n\n每一个阶段对于我们工作的成功都至关重要。虽然不是强制性的，但遵循此列表的步骤顺序会更好。现在我们可以详细分析这些每一个步骤了。\n\
  \n## 信息收集\n\n我知道你正在想，“我需要收集什么信息？为了什么？”答案是直接而明确的：全部！我们有必要检查目标的多个方面，而且可能是提前进行。我们需要了解它是什么业务，销售什么，哪些人在那里工作，以及使用了哪些工具。换句话说，我们能收集到的所有信息在以后都会对我们很有用。你最好不要忽略或低估其中任何一个。\n\
  \n信息收集阶段的另一个步骤是利用公共领域的信息对网络基础设施进行分析。在此阶段，你应该避免与目标直接交互。相反，我们可以依靠互联网上的可用工具和平台：\n\n\
  * Google；\n* Whois 查询；\n* DNS；\n* 社交媒体；\n* 元数据；\n* 带有招聘列表的网站；\n* 诸如 `Maltego` 和\
  \ `Recon-ng` 等工具；\n* 特定的浏览器，如 `Shodan`。\n\n# 网络扫描\n\n在上一阶段收集的信息可以帮助我们深入目标并开始网络扫描。注意，在这个阶段，我们开始与目标直接交互，并且存在被识别的风险，特别是如果我们没有采取所有相关的预防措施。扫描网络几乎就像发现自己在一个大城市的宽街道上，那里满了商店。突然之间，你开始撬每一家店的锁，希望至少有一家是开启且未受保护的。在这个阶段，我们不会登录网络，我们只需要确认门开着这一事实。不能确定我们在扫描网络期间的所有活动不会被察觉。\n\
  \n# 枚举\n\n枚举网络意味着发现并列出所有可用资源。让我们想象在之前的一个阶段，我们发现了一扇可能是开着的门。现在我们需要找出与该门相关的服务可以枚举的哪些信息。我知道这个定义听起来可能很困惑，但我们之后一起看到的示例应该有助于变得更容易理解。这个阶段经常被低估，即使它可以提供很有价值的信息。\n\
  \n# 漏洞评估\n\n现在我们已经发现了哪些门和服务端是可以访问的，我们应该识别目标所有的可能漏洞。我们可以依靠自动工具来让我们的工作变得更容易。然而，我们可能会遇到大量的假阳性或假阴性。否则，如果我们在这方面有更多经验，我们可以进行手动分析。最好的方法是两者的结合。通过切换工具和手动分析，你将看到最好的结果。\n\
  \n## 漏洞利用\n\n发现漏洞是不够的。我们接下来需要做的是尝试利用它们以获取系统的访问。这正是我们在这个阶段将尝试要做的。我们将为每个漏洞寻找允许我们访问系统的网关。这并不总是可能的，但我们应该考虑每条路径。执行渗透测试不仅关于访问网络，它还是一项更广泛的任务。我们应该识别所有不安全的访问点，并通知客户以帮助找到快速解决方案。\n\
  \n## 渗透后\n\n如果由于某种原因我们丢失了辛苦找到的访问点怎么办？我们还能再次访问系统吗？在这个阶段，这正是我们所担心的。我们的目标是创建一个始终可用的访问点。通过这样做，我们即使在以后也能访问我们的目标。\n\
  \n# 最终报告\n\n到此时，如果一切顺利，我们的工作应该被认为完成了。我们应该向客户提供一份最终报告，包含我们所有行动的摘要以及关于如何使网络更安全的建议。我们现在结束了对渗透测试阶段的解释。在下一章中，我将教你如何创建一个实验室，以便你能够完成我分配给你的测试。\n\
  \n## 实验室\n\n现在你已经对道德黑客工作的性质有了了解，我们需要开始实践我们在后续章节中学到的知识。第一个任务是建立自己的实验室。不要在实验室以外的环境实验我将教你的技术：那不是成为道德黑客的正确方法！我们如何能建立一个可以进行模拟的保护环境？答案很简单：我们可以使用虚拟机管理器。这包括在同一个物理系统中同时执行多个虚拟机，因此是多个操作系统。虚拟机让整个过程变得方便得多！\n\
  \n## 虚拟化\n\n通过使用这些程序，你可以在 PC 内同时运行多个操作系统。你唯一的限制是你可以使用的内存。这个过程并不困难，尽管你需要更熟悉这个工具。基本上，这里是你应该采取的步骤列表：\n\
  \n* 下载名为 `hypervisor` 的特定软件。\n* 收集你想安装的操作系统的 `.iso` 镜像。\n* 软件。\n* 开始创建虚拟机的过程。\n\
  * 创建并启动该虚拟机。\n* 继续安装理想的操作系统。\n\n\n\n\n\n我们在本书中将使用的虚拟机管理器是 `VMware Workstation`。它是一个付费版本，但我们可以利用它的\
  \ 30 天免费试用期。我选择使用这个虚拟机管理器是因为在网络管理功能和选项的多样性方面，它是最完整的。\n\n下载它，请访问此链接并点击“Download”：`https://my.vmware.com/en/web/vmware/free#desktop_end_user_computing/vmware_workstation_player/15_0`。如果版本\
  \ 14（该软件的最新版本）无法运行，你可以尝试版本 12。某些较旧的 CPU 不受支持。如果尚未激活，你需要在 BIOS 中启用虚拟化支持（请在 Google\
  \ 上搜索）。此时，如果安装成功，你理应能看到这个界面，显然是在还没有预先安装任何虚拟机的情况下。![](img/image201.jpg)\n\n现在你终于准备好进行下一步操作了。\n\
  \n# 操作系统镜像\n\n为了创建虚拟机，你需要一个想要安装的操作系统镜像。对于我们正在构建的实验，你需要以下操作系统的镜像（`.iso` 格式）：\n\n\
  *   `Kali Linux` -> 可从 `https://www.kali.org/downloads/` 免费下载。\n*   `Windows 7`\
  \ -> 30 天版本，在互联网上很容易找到。\n*   `Windows 10` -> 90 天版本，在互联网上很容易找到。\n\n如果你好奇我为什么选择这些操作系统，主要原因如下：`Kali\
  \ Linux` 将成为我们的攻击机，基本上就是我们用来启动所有攻击的机器。另外两台 Windows 机器将作为我们的目标。\n\n# 创建虚拟机\n\n现在我们只需要创建虚拟机。要此操作，进入“File\
  \ -> New virtual machine”并按照推荐的步骤操作![](img/image217.jpg)注意你将使用的 RAM 数量。此数量取决于你 PC\
  \ 上的可用 RAM，你应该尽量不要过度使用。此外，目前只需继续使用网络适配器的默认选项即可。对我们之前提到的所有操作系统执行相同的步骤：`Kali Linux`、`Windows\
  \ 7` 和 `Windows 10`。\n\n# 网络管理\n\n正确管理网络极其重要。如果你没有正确配置，虚拟机之间将无法通信，因此你的实验室将无法正常工作。在\
  \ VMware 中，我们可以使用 4 种类型的网络：![](img/image225.jpg)如上面的截图所示，这些是可用的网络类型：\n\n*   `Bridged`（桥接模式）->\
  \ 这种类型包括创建一个物理 PC 所在网络中的 IP 地址。我稍后会解释什么是 IP 地址。现在，你只需要记住它是一个唯一标识网络上特定接口的数字表示。IP\
  \ 地址的示例是 `192.168.1.10`。\n*   `NAT` -> 一旦进入此模式，你的虚拟机可以连接到互联网，但从外部无法访问。\n*   `Host-only`（仅主机模式）->\
  \ 在这种情况下，虚拟机只能与你的物理主机通信。\n*   `Custom`（自定义模式）-> 在这里你可以定义个人网络并让所有虚拟机在内部通信。这是我们将使用的模式！\n\
  \n要创建它，进入“Edit -> Virtual Editor”并像下方截图所示创建一个新网络![](img/245.jpg)现在你应该返回虚拟机的设置。你可以选择我们创建的网络适配器。在此步骤之后，每台虚拟机将拥有其\
  \ IP 地址 `192.168.10.0/24`。\n\n# 虚拟机启动\n\n现在你准备好启动你的虚拟机了。如果你正确执行了上述所有操作，这些机器将全部启动并拥有之前分配的\
  \ IP 地址。例如，`Kali Linux` 可能具有 `192.168.10.1` 的 IP 地址，而 `Windows 7` 机器可能具有 `192.168.10.2`，安装了\
  \ `Windows 10` 的机器可能有一个类似于 `192.168.10.3` 的值。记住，这些虚拟机现在只能相互通信，无法连接到互联网。如果需要，我们将更改网络适配器并设置\
  \ `NAT` 模式。\n\n# 安装 VMware Tools\n\n你需要完成的另一个操作是安装 `VMware Tools`。它们仅仅是提高虚拟机整体性能的一组功能。我不会用细节来烦你。步骤非常简单：你只需要在\
  \ Windows 或 Google 上搜索关键词“installation of VMware tools on Kali”。\n\n# 虚拟机连通性验证\n\
  \n我们现在的最后工作是验证虚拟机是否可以通信。你需要采取的步骤如下：\n\n1.  验证分配给每台虚拟机的 IP 地址的有效性。\n2.  在每台虚拟机上运行\
  \ `PING` 命令并验证响应为正向。\n\n让我们一起看看如何操作：\n\n*   访问 `Kali` 机器并从终端运行 `ifconfig` 命令，验证分配的\
  \ IP 地址是否可用。\n*   访问 `Windows 7/10` 机器并在命令行中输入 `ipconfig` 以验证分配的 IP 地址是否存在。\n* \
  \  记录下这些 IP 地址。\n*   在 `Kali` 机器上输入命令 `ping Windows 7/10`，验证响应为正向，且响应中没有丢包。\n* \
  \  在 `Windows 7/10` 机器上输入命令 `ping Kali`，验证响应为正向且响应中没有丢包。\n\n\n\n\n![](img/image271.jpg)\
  \ 如果所有响应都是积极的，我们就可以开始下一步了。我们渗透测试实验室的设置阶段已经结束。\n\n# Linux 命令\n\n在上一章节中，我帮助你搭建了渗透测试实验室，我打赌你现在非常期待使用它！但是，首先让我向你展示一些之后我们将用到的基础\
  \ Linux 命令。你可以，我也鼓励你使用我们之前创建的 Kali Linux 来付诸实践。\n\n## 基础命令\n\n这些是你在日常任务中可能最常用的命令。\n\
  \n- **执行命令**: `ls`\n  **解释**：此命令允许你列出文件和/文件夹的内容。\n- **执行命令**: `pwd`\n  **解释**：打印当前目录。\n\
  - **执行命令**: `cd`\n  **解释**：允许你访问选定的文件夹。\n- **执行命令**: `cp`\n  **解释**：允许你复制文件。\n-\
  \ **执行命令**: `mkdir`\n  **解释**：允许你创建一个文件夹。\n- **执行命令**: `rmdir`\n  **解释**：允许你删除一个文件夹。\n\
  - **执行命令**: `touch`\n  **解释**：允许你创建一个文件。\n- **执行命令**: `tar`\n  **解释**：为特定文件创建归包。\n\
  - **执行命令**: `clear`\n  **解释**：允许你回到初始 shell。\n- **执行命令**: `adduser`\n  **解释**：允许你添加一个新用户。\n\
  - **执行命令**: `chmod`\n  **解释**：管理文件和/文件夹权限。\n- **执行命令**: `vi`\n  **解释**：允许你编辑文件。\n\
  - **执行命令**: `cat`\n  **解释**：允许你操作文件。\n- **执行命令**: `grep`\n  **解释**：在文件中搜索特定模式。\n\
  - **执行命令**: `apt-get`\n  **解释**：软件包管理。例如，`apt-get install`。\n\n以上是你应该尝试的所有基础命令完整列表。它们可以帮助你完成我在后续章节中提出的练习。你最好能正确地掌握它们。\n\
  \n## 网络命令\n\n作为一名道德黑客，你需要对最常用的网络命令有深厚的知识。在书的其余部分，我将向你展示其中最重要的几个。尝试它们，你甚至可能创建出新的组合。\n\
  \n- **执行命令**: `ifconfig`\n  **解释**：配置网络接口的实用。查看分配给机器的 IP 地址非常有用。\n- **执行命令**: `traceroute`\n\
  \  **解释**：此命令允许你追踪 IP 包到宿主网络的路径。它对于执行故障排除活动非常有用，例如验证某个 IP 包在路径的哪个位置停止或丢失。\n- **执行命令**:\
  \ `dig`\n  **解释**：这是查询 DNS 所需的工具。关于这个命令还有很多可以说的，它的功能相当复杂。在接下来的章节中，你将更好地理解它的机制，届时我将解释什么是\
  \ DNS 以及我们如何对其发起攻击。\n- **执行命令**: `telnet`\n  **解释**：此命令允许我们通过 TELNET 协议连接到远程主机。我想澄清的是，该协议允许数据的明文可视化，没有任何加密机制。出于这个原因，它不是一个非常安全的协议。\n\
  - **执行命令**: `nslookup`\n  **解释**：这是另一个查询 DNS 和执行反向解析查询的工具。在我们的练习中，我们会经常使用这个命令。\n\
  - **执行命令**: `netstat`\n  **解释**：这是一个极其重要的命令。它允许你查看特定时间开启的网络连接。在故障排除中，它允许我们验证由于网络连接未建立或丢失导致的异常。在这里，再次花些时间提高对这个工具的了解。\n\
  - **执行命令**: `ifup`, `ifdown`\n  **解释**：此命令允许启用或禁用网卡。在某些情况下它非常有用，也许需要重启网络服务时。\n-\
  \ **执行命令**: `ping`\n  **解释**：PING 命令通过向目标发送特殊的 ICMP 类型包并等待响应，来检查特定主机是否活动。让我提醒你，我们已经在渗透测试实验室中使用过它来验证不同虚拟机之间的连通性。\n\
  - **执行命令**: `route`\n  **解释**：此命令用于显示特定主机的路由表，即网络包在网络或特定子网上必须执行的路径。\n- **执行命令**:\
  \ `arp -a`\n  **解释**：ARP -A 命令为我们 MAC 地址和 IP 地址之间的链接表。例如，当我们想要排除有关 ISO/OSI 模型较低层（数据层）的问题时，可以使用它。\n\
  \n这里是与网络相关的所有命令。当然，这个列表并没有包含全部，还有很多可以说的。不过，如果你开始熟悉这些命令，以后你会表现出色。\n\n## 系统管理命令\n\n\
  现在进入 Linux 命令的最后部分，它们与 Linux 机器的常规管理有关。\n\n- **执行命令**: `uptime`\n  **解释**：此命令显示系统运行了多久。\n\
  - **执行命令**: `users`\n  **解释**：此命令显示连接到系统的用户名。\n- **执行命令**: `who`, `whoami`\n  **解释**：这是另一个告知我们有多少用户连接到系统以及一些额外信息的命令。\n\
  - **执行命令**: `crontab -l`\n  **解释**：此命令允许显示与当前用户相关的任务。\n- **执行命令**: `less` / `more`\n\
  \  **解释**：此命令非常有用，因为它允许你快速查看文件。按 \"q\" 键退出此显示。\n- **执行命令**: `ssh`\n  **解释**：此命令允许通过\
  \ SSH 协议连接到远程主机。后者与 TELNET 不同，它执行数据加密。出于这个原因，在发生流量拦截时，将无法清晰看到任何数据。\n- **执行命令**:\
  \ `ftp`\n  **解释**：此命令允许通过 FTP 协议连接到 FTP 服务器。该协议不执行数据加密，所以在使用时需要注意。\n- **执行命令**:\
  \ `service start`, `stop`\n  **解释**：此命令允许你启动或停止某个服务。你将在多次使用它。\n- **执行命令**: `free\
  \ -h`\n  **解释**：此命令显示空闲和已用内存。例如，当机器出现性能问题时可以使用它。\n- **执行命令**: `top`\n  **解释**：此命令允许你检查系统中的活动进程。如果机器由于某种原因运行非常缓慢，它可能非常有用。\n\
  - **执行命令**: `ps`\n  **解释**：通过此命令，你可以查看系统中的活动和运行中的进程。\n- **执行命令**: `kill`\n  **解释**：此命令用于终止特定进程。\n\
  \n\n\n\n# OSI 层模型\n\n* 应用层\n* 表示层\n* 会话层\n* 传输层\n* 网络层\n* 数据链路层\n* 物理层\n\n我们不会对每一个层都进行详尽阐述。我们将重点关注以下几个层：物理层、数据链路层、网络层和应用层。稍后我们我们将讨论传输层。会话层和表示层对于我们想要实现的目标没有帮助。\n\
  \n* **物理层**：这一层包含了与特定通信手段（铜线、光纤或无线电波网线）数据传输相关的所有内容。\n* **数据链路层**：这一层在局域网（LAN）背景下体现最为充分。在局域网中，我们需要引用网络设备的\
  \ `MAC address` 和 `IP address` 以及它们后续的关联，称为 `ARP table`。我稍后会向你解释这些术语的准确含义。\n* **网络层**：这一层关注不同网络之间的通信。在这种情况下，我们主要使用网际协议\
  \ (`IP`)。\n* **应用层**：高层协议在此层进行相互交互。这些协议包括但不限于 `HTTP`、`HTTPS`、`FTP` 等。\n\n根据所涉及设备类型，我们可以为这些层找到其他名称：\n\
  \n* 物理层：物理和非物理通信的手段。\n* 数据链路层：交换机。\n* 网络层：路由器。\n\n我们将很快深入探讨这些设备的主要特征以及它们如此重要的原因；首先，我们需要研究另外两个概念：`MAC\
  \ address` 和 `IP address`。\n\n## MAC 地址\n\n`MAC`（媒体访问控制）地址是一个 48 位的地址，由每个以太网卡或无线网卡的制造商唯一地分配。以下是一个\
  \ `MAC address` 的示例：\n![](img/image441.jpg)\n\n这个地址在网络世界中是基础性的，因为它允许机器在本地上下文中（例如局域网）内被唯一识别。每当我提到\
  \ `MAC addresses` 时，我指的始终是局域网，而不是远程网络。例如，在上网时，你永远不会使用 `MAC address`，而是会依赖 `IP address`。\n\
  \n当一个或多个设备属于本地或局域网（LAN）时，所有 PC 都属于同一个子网。因此，每当我们我们需要与另一个网络通信时，我们都是隐式地指的是 `IP address`\
  \ 而非 `MAC address`。你好奇找到你设备的 `MAC address` 吗？在你的 Windows 设备上输入以下命令：`ipconfig /all`。如果你使用的是\
  \ Linux 设备，输入这一个：`ifconfig`。\n\n## IP 地址\n\n到书的这里为止，我一直在讨论局域网。现在我们将深入研究网际协议 (`IP`)\
  \ 地址的特征。\n![](img/image450.jpg)\n\n`IP address` 以 32 位数值的形式出现，并允许对网络和主机都进行识别。基本上，我们可以说\
  \ `IP address` 的一部分用于识别网络，而另一部分则定位主机（我们将在稍后介绍主机部分）。\n\n每当我们需要上网或与另一个子网通信时，必须使用预先分配的\
  \ `IP address`。如果未提供 `IP address`，任何机器都无法浏览。\n\n`IP addresses` 分为公有和私有。公有地址允许在互联网上浏览，而私有地址用于内部子网内部（例如公司网络）；任何私有\
  \ `IP address` 永远无法上网。\n\n让我给你举一个实际的例子。假设我们处在某个局域网内部，其 `IP address` 为 `192.168.1.0/24`。这意味着每个连接的\
  \ PC 都有属于该子网的 `IP`，例如 `PC1 -> 192.168.1.1`、`PC2 -> 192.168.1.2`、`PC3 -> 192.168.1.3`。这些是私有\
  \ `IP addresses` 的示例。这些机器始终能够相互通信，但永远无法在互联网上通信，因为它们没有公有 `IP address`。\n\n私有 `IP\
  \ addresses` 分分为三类：\n\n* A 类私有 `IP addresses`，起始 `IP address` 为 `10.0.0.0`，结束 `IP\
  \ address` 为 `10.255.255.255`。\n* B 类私有 `IP addresses`，起始 `IP address` 为 `172.16.0.0`，结束\
  \ `IP address` 为 `172.31.255.255`。\n* C 类私有 `IP addresses`，起始 `IP address` 为 `192.168.0.0`，结束\
  \ `IP address` 为 `192.168.255.255`。\n\n选择特定类别取决于我们子网的大小以及必须为机器分配多少 `IP addresses`。目前，关于\
  \ `IP addresses` 你只需要知道这些。我们将在稍后的章节中回到这个话题。\n\n## ARP 协议\n\n在这一节中，我将解释什么是 `ARP protocol`。它的操作非常简单，但使我们暴露在多种安全威胁之下。由于没有任何任何类型的身份验证，它容易受到不同类型的攻击，包括所谓的“中间人攻击”。\n\
  \n`ARP` 代表“地址解析协议”。该协议跟踪 `MAC address` 和 `IP address` 之间的关联。请记住，在本地上下文中，我们需要设备通过\
  \ `MAC address` 被识别。那么，一旦离开局域网，我们将完全通过 `IP address` 进行通信。该协议通过一个表格（即 `ARP table`）定义，该表包含了上述关联（`MAC-IP`）。\n\
  \n你可以输入 `arp -a` 命令查看你 Windows PC 的 `ARP table`。\n![](img/image473.jpg)\n\n如你从上面的示例所示，对于这个网络，我们可以在左侧找到\
  \ `IP addresses`，右侧找到多个 `MAC addresses`。\n\n## 默认网关\n\n你可能已经知道“默认网关”这个术语，但它到底代表什么？当你需要在本地网络内部通信时，你会使用\
  \ `ARP protocol`，它促进了 `MAC address` 和 `IP address` 之间的关联。\n\n然而，你还需要与外部通信，例如在互联网上。此时，你需要确切知道你尝试访问哪些其他网络设备，例如路由器。\n\
  \n这就是默认网关派上用场的地方。当你需要在本地网络外部通信时，它是使用的“最佳设备”。每当你的 PC 不知道将数据包发送哪里时，它将其发送到默认网关进行进一步处理，并分配给位于数据包路径中的后续设备。\n\
  ![](img/image482.jpg)\n\n在这个示例中，每当 PC 不知道将不属于自身子网的数据包发送哪里时，它将其发送到默认网关，即 IP 地址为 `10.0.2.2`\
  \ 的设备。如果你想知道你的默认网关是什么，可以在 Windows 设备上输入 `ipconfig /all` 命令。\n\n## NAT\n\n现在我将提到一个对某些人来说可能很困难的概念，但它现在被用于几乎所有的网络。`NAT`\
  \ 代表“网络地址转换”。但它到底意味着什么？我会尽量解释清楚。当你从家里上网时，会发生几件事：第一件事是你的 PC 将获得一个私有 IP 地址，通常属于 C\
  \ 类 (`192.168.1.0/24`)。\n\n然而，正如你所知，这对于上网是不够的。你需要一个公有 IP 地址，这就是路由器和 `NAT` 派上用场的地方。路由器会自动将私有\
  \ IP 地址转换为公有地址，因此你可以顺利地浏览。\n\n* `PRIVATE IP ADDRESS`：验证你的私有 IP 请输入 `ipconfig` 命令。\n\
  * `PUBLIC IP ADDRESS`：检查你的公有 IP 请点击以下链接：`https://www.whatsmyip.org/`。\n\n\n\n\n\n\
  让我们假设你个人电脑的 IP 地址是 `192.168.1.10`。当你尝试访问外部网络时，路由器会自动将该 IP 地址翻译为公网地址，例如 `34.34.23.12`。这种机制的特殊之处在于，如果你家里有十台设备，每个设备都有自己的私有\
  \ IP 地址，它们都将关联到同一个公网 IP 地址 `34.34.23.12`。目前，我不会详细介绍这个过程。你只需要理解端口（port）的概念就能实现我刚才提到的效果。\n\
  \n![](img/image499.jpg)\n\n在企业网络中，公司试图减少分配的公网 IP 数量。因此，这些 IP 中的少数往往对应于网络中每台 PC 的多个私有\
  \ IP 地址。出现这种情况有以下几个原因：\n\n1. IP 的数量有限，可用的寥寥无几。这导致每个 IP 地址的价格较高。\n2. 使用这种 `NAT` 机制可以让你创建第一层网络保护。这意味着外部没有人知道你的私有\
  \ IP 地址。相反，潜在的攻击者可能只看到你的公网 IP 地址，而不知道私有 IP 与公网 IP 的关联表。这对于他们追踪我们来说是不够的。\n\n最后一点说明，在企业网络中，防火墙通常执行\
  \ `NAT`。此外，还有几种类型的 `NAT`，如果你想了解更多关于每类型的信息，可以直接参考维基百科（https://it.wikipedia.org/wiki/Network_address_translation）。\n\
  \n## DNS\n`DNS` 是网络的另一项核心服务。作为一名渗透测试员，你经常会听到它，因为如果配置不当，它会为攻击者提供许多有趣的切入点。这项服务现在比以前更容易理解。要背诵几十甚至上千个\
  \ IP 地址并不是容易的。因此，创建了这种机制来将数字 IP 地址翻译成一行文本（URL），这更容易被理解和记忆。与其在浏览器中输入 `34.25.7.34`，我只需写下\
  \ `www.google.com`。你很快就会发现，没有 `DNS` 网络就无法工作，至少按照我们通常的理解是如此。\n\n![](img/image515.jpg)\n\
  \n我们可以将 `DNS` 分为两大类：公有和私有的。公有 DNS 用于解析公网 IP 地址，而私有 DNS 则将翻译私有 IP。假设我们处于一家公司中，我们需要翻译几十个私有\
  \ IP 地址（访问共享文件夹、访问内网等）。因此，我们需要依赖内部的 `DNS`。\n\n`DNS` 具有分级结构。基本上，当 `DNS` 不知道响应时，它会询问它的邻居。当然，我这里过度简化了整个过程。如果某个\
  \ `DNS` 服务器没有得到充分保护，它可能会将其所有内容传输给攻击者。它甚至可以共享成千上万个 IP-名称关联。这就是一种著名的网络攻击的名称：`DNS 区域传输`（DNS\
  \ zone transfer）。我不会深入探讨这个主题，你可以参考维基百科上的相关页面获取更多细节。\n\n## DHCP\n通过介绍 `DHCP`（动态主机配置协议），即动态\
  \ IP 配置协议，继续对基本网络服务的分析。我们将通过本地网络来解释它的工作原理。假设我们在一家拥有一千多员工的公司担任系统工程师。我们需要为他们每个人分配一个私有\
  \ IP 地址以及其他参数，如默认网关和 `DNS`。这项任务非常耗时。系统工程师必须亲自去办公室为每台 PC 分配参数。除了极度浪费时间外，网络变化并不罕见，并且可能会覆盖网络管理员的工作。\n\
  \n出于所有这些原因，需要一个功能来自动化这项任务。这就是 `DHCP` 被创建的原因。该协议通过一个管理整个网络的中央服务器自动分配所有参数。详细来说，`DHCP`\
  \ 可以生成两种类型的网络数据包：\n\n* `DHCPDISCOVER`：需要 IP 地址的 PC 向整个网络发送此数据包，希望 `DHCP` 服务器能拦截它。\n\
  * `DHCPOFFER`：当 `DHCP` 服务器接收到 `DHCPDISCOVER` 数据包时，它尝试满足请求，并向包含所有必要网络参数的 `DHCPOFFER`\
  \ 数据包发送到 PC 的 MAC 地址（此时 IP 显然还是未知的）。\n\n![](img/image533.jpg)\n\n## 端口与服务\n对于渗透测试员来说，必须对门（door）和服务和服务（service）的概念有清晰的理解。在后续与伦理黑客工作方法相关的章节中，我们经常会引用这些概念。我们可以说门和服务这两个概念是紧密关联的。为了完成其任务，任何\
  \ PC 都需要与外部世界建立不同类型的连接。它必须依靠一个专用通信通道来提供或请求任何服务。我们可以把门想象成这个通道的末端。\n\n有 65535 个可用端口，但并不是所有的都被使用了。1024\
  \ 以前的所有端口通常用于最常用的服务。因此，它们被称为“良好端口”。这里有一个例子：`SSH` 协议的标准端口是 22，`FTP` 协议使用端口 21，以此此类推。你可以在此处找到标准端口列表：https://en.wikipedia.org/wiki/List_of_TCP_and_UDP_port_numbers。\n\
  \n总之，每个服务都需要特定的端口与外部世界进行通信。这种机制对我们作为渗透测试员的行动产生巨大影响。事实上，某台 PC 上开放端口列表可以提供极佳的信息以及访问该系统的可能。如果我们想查看\
  \ Windows 设备内所有的活动通信，需要输入 `netstat -ano` 命令。\n\n![](img/image547.jpg)\n\n关于 `netstat`\
  \ 命令的更多信息，你可以参考此链接：https://technet.microsoft.com/en-us/library/bb490947.aspx。\n\n\
  ## ARP-PING-TRACOUTE\n现在让我们转向更实用的内容。我将介绍两个对你网络专家生涯有帮助的重要命令。我指的是 `ARP` 和 `PING` 命令。它们将允许你解决大多数网络问题，因此学习更多相关知识很重要。它们之间的第一个主要区别在于它们运行的\
  \ ISO-OSI 模型层级：\n\n* `ARP` -> 介于数据链路层（MAC 地址）和网络层（IP 地址）。\n* `PING` -> 网络层（IP 地址）。\n\
  \n你必须做好心理准备来面对这些情况。我们可能会遇到各种网络问题，只有通过准确确定自己在 TCP/IP 栈中的具体位置，才能让生活变得更轻松。在这里我介绍一种可以适用于多种场景的操作方法。\n\
  \n**问题：** 用户报告网络内 PC 无法连接。\n**故障排除：**\n\n* 检查该 PC 的网线状况是否完好。你可以尝试更换。ISO-OSI 物理层。\n\
  * 检查 PC 是否分配了私有 IP 地址。在 Windows 机器上运行 `ifconfig` 命令。ISO-OSI 网络层。\n* 如果你无法直接访问该 PC，尝试使用另一台电脑运行\
  \ `PING IP-addressPC` 命令，其中 `IP-addressPC` 是该 PC 的 IP 地址。ISO-OSI 网络层。\n* 如果 `PING`\
  \ 命令没有给出积极响应，执行 `ARP` 命令并检查该 PC 上是否存在 MAC/IP 地址关联。ISO-OSI 数据链路层。\n\n\n\n\n\n如果 PC\
  \ 对 `PING` 命令没有响应，但 `ARP` 条目存在，那么我们可能正在遇到网络层的问题。如果甚至连 `ARP` 条目都不存在，那么就是数据链路层的问题。这只是我们在遇到网络故障时处理流程的一个示例。显然，我们没有考虑所有其他连接的网络设备（路由器、交换机等），因为在那种情况下问题将变得更加复杂。本章关于主要网络概念的章节到此结束。由于对于你作为渗透测试员的职业生涯来说，这是一个至关重要的课题，你可以参考以下链接学习更多信息：http://www.tcpipguide.com/free/。\n\
  \n# 企业网络\n对于渗透测试员来说，理解企业网络的基本原理无疑非常有帮助。除了特殊情况外，你几乎总是会发现自己在这些环境中操作。对大多数网络设备及其功能有良好的理解，将帮助你以更准确、更有效的方式进行渗透测试。\n\
  \n企业网络可能比私有网络复杂。你需要大量的知识和经验才能完全理解它们细微之处。然而，我主要重点介绍一些常见元素的基础知识。任何网络如果没有至少两个设备的支持都是无法工作的：`SWITCH`（交换机）和\
  \ `ROUTER`（路由器）。我还应该应该提到 `FIREWALL`（防火墙），尽管它不是必需的，但在企业网络中始终存在。接下来的章节将介绍这三个元素。\n\n\
  ## CISCO PACKET TRACER\n你可能从未听说过网络模拟器 Cisco Packet Tracer。这种软件允许我们创建和模拟网络场景。我们可以用它来执行测试，并更好地理解某些设备的工作原理或网络的全局行为。Cisco\
  \ Packet Tracer 最近已免费，你可以在此链接下载它：https://www.netacad.com/courses/packet-tracer-download/。下载完成后，你可以按照标准的安装过程进行。\n\
  \n![](img/image587.jpg)\n\n我将不会详细介绍 Cisco Packet Tracer 的具体操作和配置。我建议你阅读该软件完整且编写良好的文档，以便立即创建你的第一张网络拓扑。此外，使用“Simulation”（模拟）模式进行网络模拟效果更好。你能够更好地理解网络设备是如何相互交互的。\n\
  \n![](img/image593.jpg)\n\n## LAN-WAN-DMZ\n为了与中大型网络交互，我们首先需要定义它的拓扑结构。我们需要将网络划分为若干区域，以便我们始终知道自己在哪里。这有助于我们对通过网络的流量进行分段、组织和管理。\n\
  \n我们需要做的第一个区分是“内部世界”和“外部世界”。我们所说的内部世界是指发生在我们私有网络内部的一切，那里分配了我们的私有 IP 地址。这被称为 `LAN`（局域网）。当我们需要与外部世界通信（特别是连接互联网）时，我们将引用\
  \ `WAN`（广域网）。这种区分帮助我们再次强调“内部”和“外部”的概念。我们几乎从不只使用 `LAN` 和 `WAN`。网络还有其他部分，我们将用不同的逻辑引入它们。其中之一就是所谓的“DMZ”，意思是“非军事区”。在这个区域，我们将被迫即使是关键服务也暴露给外部世界。正因为存在这些隐含的风险，我们不应该将这些服务包含在\
  \ `LAN` 中，因为 `LAN` 是应该被尽可能保护的网络部分。\n\n我们可以这样总结这个概念：每个网络将始终由一个 `LAN` 部分和一个 `WAN`\
  \ 部分组成。然而，如果有必要，我们可以添加并定义网络的其他部分，例如 `DMZ`。\n\n![](img/image606.jpg)\n\n## 交换机 (THE\
  \ SWITCH)\n该设备的主要功能是对网络内的数据包进行排序。它在 ISO/OSI 模型的数据链路层运行。正如你可能猜到的那样，我们指的是 MAC 地址的世界。当我们谈论交换机时，我们永远不是指网络层和\
  \ IP 地址。记住这种区别至关重要。交换机基于 MAC 地址，并在特定的子网内工作。在一个子网内我们可以找到一个或多个交换机。相反，交换机永远无法连接到两个或多个子网（因为这将需要路由）。每当更多的\
  \ PC 需要在同一子网内通信时，我们就必须插入并配置交换机。该设备由多个端口组成，这些端口充当多个网络接口。在每个端口中，我们必须插入想要与其他通信的 PC\
  \ 的网线。\n\n![](img/image616.jpg)\n\n交换机排序的数据包被称为 `FRAME`（帧）。交换机的关键特性之一是能够以智能的方式转发数据包。交换机可以读取以太网帧中包含的\
  \ MAC 地址，并确切知道应该将消息发送到哪台机器。由于这个原因，它不需要转发到所有连接设备。\n\n现在让我们该设备工作背后的详细过程：\n\n* 交换机自动学习\
  \ `LAN` 网络的拓扑结构。它可以确定每个 PC 连接到它的哪个端口。\n* 它在一个名为 `CAM table` 的表格中汇总每个端口与 MAC 地址之间的关联关系。每当有新数据包到达时，该表就会自动更新。\n\
  \n基本上，该过程的准确工作方式如下：\n\n1. 当数据包到达端口时，交换机检查接收者地址是否已于 `CAM table` 中。\n2. 如果地址存在但接收者端口与发送者端口不同，则数据包被发送到关联端口，且仅发送到该端口。\n\
  3. 如果不存在，数据包将发送到所有端口，发送者端口除外。\n\n交换机还有其他高级功能，例如 MAC 地址过滤或其他特定的控制操作。然而，这个介绍对于我们的工作目的来说已经足够了。我仍然邀请你使用\
  \ Cisco Packet Tracer 模拟交换机的功能。例如，你可以选择三个 PC 并它们连接到 Cisco Packet Tracer，使用模拟模式测试数据包的发送。记得先为每个单独的\
  \ PC 定义 IP 地址。你可以通过双击每个 PC，进入 `Desktop -> IP configuration` 并输入所有地址。\n\n![](img/image639.jpg)\n\
  \n## 路由器 (THE ROUTER)\n使用这种新网络设备的需求源于我们无法局限于自己的子网。在未来，我们需要进行外部通信，即在互联网上与另一个子网通信。路由器的功能是将数据包传输到我们所在的子网之外。记住我们处理的是\
  \ IP 地址，而不是 MAC 地址。路由器在 ISO/OSI 模型的网络层运行。\n\n为了给出一个实际的例子，假设我们处于一个有两个不同部门的公司：行政部门和技术部门。这两个部门很属于不同的网络。假设我们可以依靠具有以下设置的网络：\n\
  \n* 行政部门：网络 `192.168.1.0/24`。\n* 技术人员：网络 `192.168.2.0/24`。\n\n\n\n\n所有的管理 PC 都会有一个连接它们的交换机，因此它们可以相互通信，技术部门也是如此。但如果一个管理\
  \ PC 想要向技术人员的 PC 发送文件呢？它无法做到这一点，因为它们属于不同的网络，而交换机无法在不同的网络之间建立连接。这时，路由器就派上用场了。\n\n\
  该设备将有一个接口连接到 `192.168.1.0/24` 网络，另一个接口连接到 `192.168.2.0/24`。通过这种方式，两个网络就可以相互通信。路由器看起来和交换机非常相似，但它的功能完全不同。\n\
  \n![](img/image655.jpg)\n\n现在你应该已经了为什么始终必须依靠这两种设备。其中一个用于管理特定网络段内的流量，另一个则用于连接多个网络。如果你现在已经理解了这两个概念，那么你对网络的工作原理已经相当熟悉了。此外，路由器还可以允许我们连接到互联网，这应该让你感到意外。\n\
  \n互联网本身仅仅是一组不同的网络。即使在这种情况下，我建议你使用 Cisco Packet Tracer 实验一下路由器。你必须定义一个由一些 PC、至少两个\
  \ `SWITCHES` 和一个 `ROUTER` 组成的网络架构。下面的图片给出了一个示例。\n\n![](img/image664.jpg)\n\n你需要通过为使用的每个网络接口定义\
  \ IP 地址，从而在 PC 和路由器上配置 IP 地址。参考上面的图片，你需要在 `Fa0/0` 和 `Fa0` 接口上配置 IP。你也可以从命令行完成，但直接从图形面板完成此任务会更简单。\n\
  \n![](img/image670.jpg)\n\n在互联网上，特别是 YouTube 上，你可以找到许多关于如何进行这些配置的教程。我倾向于不在这些概念上花费过多，因为它们不是本书的主题。\n\
  \n随着时间的推移，网络不断演变，用户的需求也发生了变化。如今，除了通信需求，我们还在为网络寻找一种保护系统。出于这个目的，我将在下一节中向你介绍一种新设备：`FIREWALL`。\n\
  \n## 防火墙\n\n防火墙无非是一个具有高级安全功能的路由器。按照惯，我们将防火墙放置在数据层上端和网络层下端之间。对于这一点，我们仍然需要管理 `MAC`\
  \ 和 `IP` 地址。\n\n该设备的主要功能是执行包过滤。它管理进入和离开网络的流量，并基于端口和/或服务的概念进行。它还帮助我们创建安全规则，然后我们将这些规则包含在“安全策略”中。我们还需要决定网络中应该开放或关闭哪些服务、端口或应用程序。\n\
  \n这种设备通常被称为“边界防火墙”，因为它的自然位置位于内部网络的边界上。这个位置使其能够保护我们的内部网络免受外部世界的侵害。\n\n近年来，防火墙添加了许多新的安全功能，以至于今天我们谈论“下一代防火墙”。这些功能中的一些包括\
  \ URL 过滤、应用程序控制，以及创建 `VPNs`、`IPS` 和 `IDS` 网络。\n\n有几种类型的防火墙可用。其中一些是免费的，供家庭使用。另一些针对企业，成本可能高达数千欧元。我在此处列出主要的防火墙供应商：\n\
  \n*   **企业级防火墙**：\n    *   `Checkpoint`。参考网站：`https://www.checkpoint.com/`。\n  \
  \  *   `Paloalto`。参考网站：`https://www.paloaltonetworks.com/`。\n    *   `Fortinet`。参考网站：`https://www.fortinet.com/`。\n\
  *   **私用防火墙**：\n    *   `pfSense`。参考网站：`https://www.pfsense.org/`。\n\n这些产品通常为我们提供虚拟机，我们可以练习黑客技能。我建议你在每个供应商提供的所有产品中进行选择。下面是\
  \ Fortinet 网站，它提供了一个我们可以测试此防火墙的虚拟机：\n\n![](img/image701.jpg)\n\n让我们看看 Fortinet 防火墙是什么样的。注意，在业务背景下配置防火墙是一项复杂的操作，但基本配置如下：\n\
  \n*   产品安装。\n*   固件/操作系统升级。\n*   网络接口配置（`LAN`、`WAN`、`DMZ`）。\n*   编写基本安全策略。\n*  \
  \ 网络流量测试。\n*   可能的高级安全功能。\n\n下面是显示我们应该采取步骤的一些截图：\n\n*   我们可以检查多个网络接口的配置。我们显然需要一些\
  \ `IP` 地址并定义 `LAN`、`WAN`、`DMZ` 网络。\n![](img/image716.jpg)\n\n*   编写安全策略：防火墙中编写的第一条策略是所谓的“清理规则”，基本上是防火墙的最后一条规则。它阻止任何类型的流量，除非高级策略另行规定。在配置阶段，始终建议定义一条接受所有流量的规则，以验证网络是否配置正确。\n\
  ![](img/image723.jpg)\n\n防火墙始终根据某些标准工作：\n\n*   源 `IP` 地址。\n*   接收方 `IP` 地址。\n* \
  \  端口和/或服务。\n\n此时，我建议你尝试这些软件之一并测试它们的一些功能。这是关于企业网络章节的结束。从现在起，我们将进入问题核心并处理渗透测试过程的第一步：信息收集。\n\
  \n## 信息收集\n\n我们准备好开始渗透测试的第一阶段，这被称为信息收集。稍后，我们将尝试更好地理解为什么它有这个名字以及它是如何工作的。\n\n渗透测试主要有三种类型：\n\
  \n*   `BLACK BOX TESTING`\n*   `GREY BOX TESTING`\n*   `WHITE BOX TESTING`\n\n在黑盒测试中，执行安全测试的人员对其必须测试的网络基础设施的细节一无所知。渗透测试人员通常只会被客户的公司网站。\n\
  \n在白盒测试中，操作者了解要检查的网络信息或要测试的区域。灰盒测试与另外两种类型相比是一个折中方案。\n\n假设我们需要执行“黑盒”测试。我们对目标一无所知，这就是为什么我们需要收集更多信息。信息收集阶段就放在类似的场景中。\n\
  \n在本章中，我们将详细分析可以帮助我们成功完成这一阶段的工具和程序。在执行这些活动时，你应该花时间。这一阶段应该准确且不忙地完成。\n\n### 初步考虑\n\
  \n我首先要说，并没有单一的方法。收集信息意味着调查、分析和研究与我们目标相关的一切。我们应该收集的信息量很大程度上取决于我们运营的业务类型。想象一下对一家运输公司进行渗透测试。我将开始收集他们的员工、供应商、随时间建立的业务关系、公司数据等信息。\n\
  \n我所有的活动将取决于我将处理的目标类型。然而，我们可以找到一些可以参考的共同步骤。根据我们想要执行搜索类型，我们可以将其示意如下：\n\n*   使用 `Google\
  \ Hacking` - `Google Dorks`。\n*   使用 `Google Cache`。\n*   “Wayback machine”。\n*\
  \   来自社交媒体的信息。\n*   招聘列表中的关键词。\n*   元数据提取。\n*   使用 `WHOIS`。\n*   查询 `DNS`。\n*  \
  \ 使用 `Maltego` 收集信息。\n*   使用 `Recon-ng` 收集信息。\n*   使用 `Shodan` 进行漏洞评估。\n\n\n\n\n\
  此列表并不完整，而且考虑到我们应该采取的步骤取决于我们的目标。不过，你可以将此列表作为一个良好的起点。\n\n# 谷歌黑客攻击 - 谷歌语法 (GOOGLE DORKS)\n\
  \nGoogle 可用于特定的查询，这些查询比我们通常执行的要具体、更深入。你如何进行这些查询呢？使用搜索运算符和特殊字符串。结果，Google 会提供它认为对大多数人最有用的结果。这就是为什么我们必须指示搜索引擎向我们显示最符合我们目的的结果。让我们分析一些高级查询。\n\
  \n## 在谷歌上进行查询\n\n- `site: hackerEtico.it`\n  **解释**：我们将看到属于某个特定索引页面数量。此查询将显示与 `hackerEtico.it`\
  \ 网站相关的 Google 索引页面。\n- `allintitle: gandalf silmarillion`\n  **解释**：此查询仅返回标题中包含\
  \ `Gandalf` 和 `Silmarillion` 单词的页面。\n- `inurl: home`\n  **解释**：此查询仅显示 URL 中包含 `home`\
  \ 单词的页面。\n- `cache: www.larepubblica.it`\n  **解释**：当我们想要恢复 Web 页面的缓存版本时，我们将输入关键词\
  \ `cache`。\n- `filetype: doc home`\n  **解释**：此查询允许我们搜索与我们指定的关键词相关的某些文档格式——例如 `.doc`\
  \ 或 `.pdf`。在此例中，我们正在搜索单词 `home`。\n\n如果我们想看到更详细的搜索结果，我们可以再次利用关键词 `site`，但这次是用于一个更高效的查询。\n\
  \n- `site: it home`\n  **解释**：通过此查询，我们正在搜索所有属于 `.it` 域名且与关键词 `home` 站点。当我们在某个域名内寻找特定术语时，这是完美的查询。\n\
  \n我邀请你使用 `site` 运算符尝试其他可能性。\n\n## 目录列表 (Directory Listings)\n\n“目录列表”（Directory\
  \ Listings）是一种非常实用的技术，由特定网站内的文件夹和文件组成。该功能的配置不当经常会导致其他用户访问不应公开的敏感材料。让我们如何实现此查询：\n\
  \n**在谷歌上查询**：\n\n- `intitle: index.of`\n- `intitle: index.of \"parent directory`\n\
  - `intitle: index.of name size`\n\n**解释**：按顺序尝试所有这些组合以避免信息不准确或缺失的风险。\n\n另一种搜索有趣文件或文件夹的方法是同时使用\
  \ `inurl` 和 `filetype` 运算符。以下是一些实用示例：\n\n- `inurl: backup` -> 可能的备份文件夹列表。\n- `inurl:\
  \ admin` -> 可能的管理员文件夹列表。\n- `inurl: admin intitle: login` -> 可能的登录页面列表。\n- `inurl:\
  \ admin filetype: xls` -> 名为 \"admin\" 的可能的 `.xls` 格式文件。\n\n在这里你也应该尝试其他可能性。要记住所有可以在\
  \ Google 上搜索的所有可能查询是极其困难的。出于这个原因，你可以检查谷歌黑客数据库（Google Hacking Database），它列出了数百种可能的查询：(https://www.exploit-db.com/google-hacking-database/)。\n\
  \n![](img/image813.jpg)\n\n根据你搜索的内容，你可以从谷歌黑客数据库提供的可用类别中选择一个或多个类别！![](img/(image817.jpg)\n\
  \n你应该记住，Google 并不看好这些查询的使用。在尝试一定次数后，可能会出现验证码（captcha）以检查你是否为机器人。\n\n# 谷歌缓存 (GOOGLE\
  \ CACHE)\n\n谷歌缓存是一个实用的工具，允许你查看 Web 页在 Google 上次访问时的样子。如果之后有任何更改，你将能够看到它们并可能发现细节和敏感数据，这些数据曾错误地公开后被隐藏。你有两种方法查看缓存：\n\
  \n- 通过谷歌关键词。\n- 通过专用网站。\n\n如果我们使用第一种方法，只需要输入以下命令：`cache: www.sitoweb.it`。如果使用第二种方法，我建议依赖\
  \ CachedView.com 站点：`http://cachedview.com/index.php?lang=it`![](img/image830.jpg)\n\
  \n# 网页回溯 (WAYBACK MACHINE)\n\n你是否曾经想监控某个网站随时间发生的变化？这不仅仅是一项有趣的活动。在所有的修订期间，一个网站确实可能展示过包含我们信息收集关键细节的文档。我们将参考名为\
  \ `Wayback Machine` (https://archive.org/web/) 的服务。![](img/image837.jpg)\n\n使用 Wayback\
  \ Machine 非常简单。我们只需要输入 URL 和日期。该网站会自动带我们回到过去。在这里，例如我们要引用 `Google.com` 并选择一个特定日期：![](img/image842.jpg)\n\
  \n# 来自社交媒体的信息\n\n这看起来可能很微不足道，但事实如此。个人和公司的社交媒体账户经常揭示大量令人惊讶的信息，这些信息是在无意中公开的。因此，一旦确定了目标，我建议你从公司的官方账户或其员工的账户开始仔细搜索，特别是注册在\
  \ LinkedIn、Facebook、Twitter 上的账户。我承认这听起来是一项耗时的活动，但我可以保证它是值得的。\n\n# 招聘公告中的关键词\n\n\
  对于每一个新的职位列表，公司披露的信息往往比它想象的要多。想象看到一个技术职位的邀约，可能还与 IT 部门有关。这类招聘广告通常会提供公司使用的所有技术列表。这些信息可以为我们从哪里开始调查提供一些建议。以下是三个著名的职位发布网站：\n\
  \n- `Monster.` `https://www.monster.com/`\n- `Infojobs.` `https://www.infojobs.com`\n\
  - `Jobrapido.` `http://jobrapido.com/`\n\n下面是从其中一个站点提取的示例：![](img/image859.jpg)\n\
  \n我们不仅可以发现软件的确切名称，还可以发现公司使用的确切名称，甚至是使用的版本。然后我们可以问自己一个问题：这个软件是这家公司内部生产的？答案很可能是定的。\n\
  \n# 元数据提取 (METADATA EXTRACTION)\n\n无需解释，你仍然可以通过在线搜索找到许多文档。大多数人关注数据内容而完全忽略其他所有内容，特别是所谓的元数据（metadata）。元数据无非插入到文档中的额外信息，它可以有多种用途。想象一个存储在文件中的数字照片，它包含作为元数据的日期、作者、使用的相机类型以及更多信息。几乎每类型的文件都包含元数据，这些元数据总是存在的，即使数量不同。在这一背景下，最常用的软件工具之一是\
  \ `ExifTool`，这是下载它的链接：`https://www.sno.phy.queensu.ca/~phil/exiftool/`。该工具提取并显示从我们插入的文件开始的元数据。要使用它，你只需要在命令行输入文件名，软件将返回元数据列表。我将给你一个\
  \ Excel 文件的示例：![](img/image872.jpg)\n\n如你所见，我们收集了各种信息。你也可以用其他格式进行测试并比较获得的结果。\n\n\
  # 使用 WHOIS\n\n在收集信息时，我们应该能够识别 IP 地址或 URL 字符串属于哪个互联网提供商（连接服务提供商）以及域名所有者。WHOIS 是一种旨在执行此任务的网络协议。可以从命令行查询\
  \ WHOIS，也可以从允许丰富搜索的 Web 查询。现在让我们检查这两个选项：\n\n- 命令行查询：只需输入 `whois` 命令，后跟网站名称或 IP 地址。\n\
  \n![](img/image881.jpg)\n\n- 通过 Web 应用程序查询。对于此示例，我们将使用站点 `whois.net` (https://www.whois.net/)。你只需要输入感兴趣的网站名称并按回车键。\n\
  \n\n\n\n\n![](img/image887.jpg)在接下来的图中，我们可以看到搜索结果。![](img/image891.jpg)对我们来说，这些信息是免费开放的，可以毫无问题地查阅。\n\
  \n## 使用 DNS\n\n我们在上一个章节中已经提到了 `DNS` 的定义。现在我们可以利用它来收集更多关于目标的信息。`DNS` 查询是这种情况下我们可以执行的最简单操作。我们应该运行\
  \ `nslookup` 命令，可以用它来要求 `DNS` 向我们显示主机名与 IP 地址之间的关联。![](img/image898.jpg)\n\n我们可以在\
  \ Linux 系统上执行的另一个命令是 `DIG`。此命令允许我们收集不同的信息，而且查询 `DIG` 是一项非常简单的任务。\n\n```\ndig www.sitoweb.it\n\
  ```\n\n现在，让我们尝试理解什么是 `DNS` 区域传输以及它是如何工作的。为了运行模拟并理解其工作原理，你可以尝试在 `Windows Server`\
  \ 机器上安装 `DNS` 服务器。在微软官方网站上，你可以找到所需的所有细节（https://technet.microsoft.com/it-it/library/cc725925(v=ws.11).aspx）。在\
  \ `Windows Server 2012` 系统上执行的步骤如下：![](img/image908.jpg)\n\n一旦我们配置了 `DNS`，尝试像下面的截图所示插入随机记录：![](img/image912.jpg)\n\
  \n“区域传输”活动包括列出发送请求的 `DNS` 服务器上的每条记录。换句话说，通过特定的命令，我们可以要求 `DNS` 为我们提供所有的记录。不言而喻，我们将收集大量数据，这些数据对于我们完成任务非常有帮助。这些记录中的每一条以及获得的\
  \ IP 地址将允许我们获得某种目标网络的地图，我们将在接下来的步骤中使用它。\n\n我们将依靠 `DIG` 来尝试区域传输，这是我们应该启动的命令：\n\n\
  ```\ndig @ IP_Address_DNS domain AXFR\n```\n示例：\n```\ndig @192.168.2.10 company.local\
  \ AXFR\n```\n\n如果命令执行成功，你将看到此结果：![](img/image923.jpg)然而，区域传输可能未启用，我们将看到以下结果：![](img/image927.jpg)\n\
  \n如果允许区域传输，在启动我们介绍的命令后你将看到此结果：![](img/image931.jpg)然而，尝试这条路径总是有用的。\n\n## Maltego\
  \ 和 Recon-ng\n\n这些是可以自动化我们信息收集的工具：\n\n*   `Maltego`\n*   `Recon-ng`\n\n它们对我们非常有用，但并不容易使用。一旦你熟悉了这些工具，没有它们你将无法完成这项任务。下面你可以看到\
  \ `Maltego` 的截图：![](img/image942.jpg)\n\n我们必须定义对象，例如名为 \"Udemy.com\" 的对象。从这些对象开始，我们就可以执行所需的操作（域名解析、IP\
  \ 地址块识别、区域传输等）。\n\n## Shodan\n\n让我们通过介绍 `SHODAN` 来结束本章，它是一个强大的搜索引擎，允许我们发现暴露在互联网上的设备的漏洞和配置错误。你可以通过以下链接访问此工具：https://www.shodan.io/![](img/image949.jpg)\n\
  \n我们可以运行任何类型的查询，因此我邀请你阅读官方文档。例如，我们可以搜索所有在 `80` 端口（`HTTP`）上暴露 Web 服务器的 `SCADA` 类型设备。(image954.jpg)\n\
  \n## 结论\n\n这是关于渗透测试过程第一阶段章节的结束。我邀请你花所有需要的时间亲自测试这些每一个工具。第一阶段对于后续阶段的成功至关重要。\n\n# 网络扫描\n\
