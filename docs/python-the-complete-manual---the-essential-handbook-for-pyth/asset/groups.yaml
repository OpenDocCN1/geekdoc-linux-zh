  mdcn: "\n\n## 入门\n\n## 从 Python 入门\n\n提示\n\n此时，值得解释的是，Python 文件中任何跟在 # 字符后面的文本都会被解释器忽略。这样做是为了让你代码中编写注释。\n\
    \n除了这些主要数据类型，还有序列类型（从技术上讲，字符串是一种序列类型，但由于它非常常用，我们将其归为主要数据类型）；\n\n| 类型 | 说明 |\n\
