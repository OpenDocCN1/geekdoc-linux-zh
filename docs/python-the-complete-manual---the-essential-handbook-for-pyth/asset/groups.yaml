    Python 提供了一种快速简单构建应用程序的方法，包括 Web 应用。了解如何使用它来构建一个功能完备的 Web 应用\n\nPython 以简单性和强大的功能而闻名。目前，它已经先进到几乎没有什么是\
    \ Python 做不到的，而征服网络只是其中的可能性之一。当你使用 Python 进行 Web 开发时，你可以获得海量的模块库和社区支持——请充分利用它们。\n\
    \nWeb 开发可以通过许多不同的方式实现，从使用原始的 CGI 模块到利用成熟的 Web 框架。使用后者是使用 Python 构建 Web 应用最流行的方法，因为它允许你构建应用程序而无需担心所有底层的实现细节。Python\
    \ 有许多 Web 框架可用，例如 Django、TurboGears 和 Web2Py。在本教程中，我们将使用我们目前的首选方案：Django。\n\n\
    ### Django 项目杂志问题跟踪器\n\n01 `django-admin.py` 文件用于创建新的 Django 项目。让我们为我们的问题跟踪器项目创建一个……\n\
    \n在 Django 中，项目（project）代表网站及其设置。而应用程序（application）代表网站的特定功能，如博客或标签。这种方法的好处是，你的应用程序变得可移植，并且可以以很小的代价与其他\
    \ Django 网站集成。\n\n```bash\n$ django-admin.py startproject issueTracker\n```\n\n\
    将创建一个目录。这将作为你包含 Django 的开发 Web 服务器的根。在项目目录下，你将找到以下项：\n\n- **manage.py**: 用于操作项目的\
    \ Python 脚本。\n- **issueTracker**: 项目的 Python 包（一个包含 `__init__.py` 文件的项目目录）。\n\n\
    ![](img/c72194f2c3aec198936695a665a5167c_25_0.png)\n\n该包包含了你的项目设置和配置数据。\n- `issueTracker/settings.py`:\
    \ 该文件包含项目的所有配置。\n- `issueTracker/urls.py`: 该文件包含 URL 映射。\n- `wsgi.py`: WSGI 兼容\
    \ Web 服务器提供你项目的入口点。只有在你部署项目时才需要它。在本教程中我们不需要它。\n\n现在更新路径选项：\n```python\nTEMPLATE_DIRS\
    \ = (\n    getabspath('templates'),\n)\n\nMEDIA_ROOT = getabspath('media')\nMEDIA_URL\
    \ = '/media/'\n```\n\n我们还需要在配置文件中启用它：\n```python\nINSTALLED_APPS = (\n    'django.contrib.admin',\n\
    \    'issuedis',\n)\n```\n\n现在我们将为你的站点启用管理界面。这是 Django 的一个功能，允许自动创建网站的管理界面，并用于添加和管理网站的内容。取消以下行的注释：\n\
    \n### 配置 Django 项目\n\n02 在开始开发应用程序之前，根据我们的需求配置 Django 项目。编辑 `issueTracker/settings.py`\
    \ 如下（仅显示需要修改的部分）：\n数据库设置：我们使用 SQLite3 作为数据库系统。\n注意：文本编辑表示新代码或更新后的代码。\n\n```python\n\
    'default': {\n    'ENGINE': 'django.db.backends.sqlite3',\n    'NAME': 'issuedis',\n\
    },\n```\n\n### 创建 issuedis 应用\n\n03 在这一步中，我们为网站创建主应用 `issuedis`。为了实现这一点，我们将使用\
    \ manage 脚本：\n\n```bash\n$ python manage.py startapp issuedis\n```\n\nDjango 要求目录设置使用绝对路径。但我们希望传递相对目录引用。为了实现，我们将添加一个辅助函数。将代码插入设置文件的顶部。\n\
    \n```python\nimport os\ndef getabspath(path):\n    return os.path.join(os.path.abspath(__file__),\
    \ path)\n```\n\n```python\nINSTALLED_APPS = (\n    'django.contrib.auth',\n  \
    \  'django.contrib.contenttypes',\n    'django.contrib.sessions',\n    'django.contrib.sites',\n\
    \    'django.contrib.messages',\n    'django.contrib.staticfiles',\n    'django.contrib.admin',\n\
    \    'issuedis',\n)\n```\n\n### 创建数据模型\n\n04 这部分是我们为应用定义数据模型。请查看注释以理解这里发生了什么。\n\
    \n```python\nfrom django.db import models\n# 我们正在导入在此应用中内置的用户身份认证模块\nfrom django.contrib.auth\
    \ import models\n# 我们还将为应用创建一个管理界面\nfrom django.db import admin\n\n# 一个用于存储多字符字段的元组。\n\
    # 第一个表示显示名称的字段名\nISSUE_STATUS_CHOICES = (\n    ('New', 'New'),\n    ('accepted',\
    \ 'Accepted'),\n    ('reviewed', 'Reviewed'),\n    ('started', 'Started'),\n \
    \   ('closed', 'closed')\n)\n\nclass Issue(models.Model):\n    # owner 将是 Django\
    \ 内置的 User 模型的外键\n    owner = models.ForeignKey(\n        models.User, null=True,\
    \ blank=True, default=\"new\"\n    )\n    status = models.CharField(\n       \
    \ max_length=20,\n        choices=ISSUE_STATUS_CHOICES,\n        default=\"new\"\
    \n    )\n    text = models.TextField()\n    opened_on = models.DateTimeField(auto_now_add=True)\n\
    \    modified_on = models.DateTimeField(auto_now=True)\n\nclass IssueAdmin(models.ModelAdmin):\n\
    \    list_display = ('id', 'text', 'status', 'modified_on')\n    list_filter =\
    \ ('status', 'owner')\n    date_hierarchy = 'opened_on'\n    search_fields = ('text',\
    \ 'status')\n\nadmin.register(Issue, IssueAdmin)\n```\n\n### 启用管理站点\n\n05 管理站点已经启用，但我们需要在\
    \ `urls.py` 中启用它。如下所示更新 `urls.py` 文件：\n\n```python\nfrom django.conf.urls import\
    \ path\nfrom django.urls import include\nfrom django.contrib import admin\n\n\
    urlpatterns = [\n    path('admin/', admin.site.urls),\n    path('', include('issuedis.urls')),\n\
    ]\n```\n\n### 启动 Django Web 服务器\n\n06 Django 包含一个内置 Web 服务器，对于测试和调试 Django 应用程序非常方便。让我们看看我们的管理界面……启动\
    \ Web 服务器：\n\n```bash\n$ python manage.py runserver\n```\n\n如果你的代码没有错误，服务器应该在\
    \ 8000 端口可用。要启动管理界面，请访问 `http://localhost:8000/admin`。系统会要求登录。输入用户名和密码。\n\n"
