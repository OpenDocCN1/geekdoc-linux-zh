    hello_list = list()\nhello_list.append(\"Hello\")\nhello_list.append(\"this\"\
    )\nhello_list.append(\"is\")\nhello_list.append(\"a\")\nhello_list.append(\"list\"\
    )\n```\n\n也可以通过以下方式创建相同的列表：第一行创建一个空列表，接下来的行使用列表类型的 append 函数向列表中添加元素。在处理高级字符串时，这种使用\
    \ # 列表的方法并不真的那么有用，但在处理动态数据（如用户 # 输入）时可能很有用。这个列表将在无任何警告的情况下覆盖第一个列表。\n\n![](img/c72194f2c3aec198936695a665a5167c_12_0.png)\n\
    \n## 入门\n\n## 从 Python 入门\n\n顺便我们也创建一个字典。注意我们对齐下面的冒号以使代码整洁，因为我们使用了之前列表相同的变量名。\n\
