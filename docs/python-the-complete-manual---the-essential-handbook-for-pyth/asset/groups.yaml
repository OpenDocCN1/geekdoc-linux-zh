    \n了解 Python 的字典（dictionary）类型也会很有用。字典是一种映射数据类型。这意味着你使用该值对应的键（key）来访问字典中存储的值，这与你使用列表的方式不同。在列表中，你使用元素的索引（表示该元素在列表中位置的数字）来访问列表的元素。\n\
