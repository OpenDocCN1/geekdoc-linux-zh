    \ `filename` 不需要包含在引号中，如果包含在引号中，输出将是文本 \"filename\"。我们最后通过向输出中添加一个 `\\n` 字符（换行）来结束，以便在开始下一个示例之前留出一个空行。\n\
    \n# 在树莓派上进行 Python 编程\n\n# 在树莓派上使用 Python\n\n![](img/c72194f2c3aec198936695a665a5167c_106_0.png)\n\
    \n# 测试我们的程序\n\n08 现在我们已经完成了那部分，为什么不测试一下呢？注意的是，你必须在运行程序之前保存，否则自上次保存以来做的任何操作都不会被\
    \ Python 解释。使用 F5 键运行程序。通过输入并按回车键输入名字。完成后，你将看到欢迎消息。如果程序以代码 0 退出，说明一切运行成功。按回车键关闭终端。\n\
    \n# 修复小问题\n\n07 我们目前使用的 Debian 镜像有一个小的配置错误问题。如果你尝试使用 F5 键运行程序或进入 Build 菜单并选择 Execute（执行），你就会发现存在这个问题。如果问题存在，什么都不会发生，你会看到一条消息\
    \ 'Could not find terminal: xterm'。别担心，很容易修复。进入 Edit 菜单并选择 Preferences（偏好）。进入\
    \ Tools 选项卡，并将 Terminal 的值从 xterm 更改为 terminal。\n\n# 处理数字\n\n09 我们基本上通过重复之前的前几行代码来向用户索要一个数字。一旦用户给了我们一个数字，我们将将其平方并翻倍。`raw_input`\
    \ 函数返回用户输入的值是一个字符串。字符串是一种文本值，我们无法对其进行算术运算。Python 中的整数类型（integer）只能存储小数部分为零数字。我们将进行一种被称为“类型转换”（cast）的操作，它基本上是将一种类型的值转换为另一种类型。我们将数字字符串转换为小数值（decimal），因为如果我们要减半数字，可能会涉及到小数。如果数字是整数类型，任何小数都将直接从末尾截掉，而不进行四舍五入。这被称为截断（truncation）。\n\
    \n# 在树莓派上使用 Python\n\n# 在树莓派上进行 Python 编程\n\n# 执行算术运算\n\nPython 中主要的算术运算符是 `+`\
    \ `-` `/` `*`，后两个分别是除法和乘法。我们创建了三个新变量 `Number`、`numberDouble` 和 `numberSquared`。注意我们不需要指定它们应该是小数，因为\
    \ Python 会根据变量初始值的类型赋予变量相应的类型。`number` 变量是小数类型，因此对该数字进行算术运算返回的所有也将也是小数类型。\n\n\
    ```python\n# 打印我们刚刚计算的值，将每个浮点值\n# 转换为字符串\nprint(\"result of halving: \" + str(number))\n\
    print(\"result of doubling: \" + str(numberDouble))\nprint(\"result of squaring:\
    \ \" + str(numberSquared))\n```\n\n# 打印我们的结果\n\n- 现在我们已经完成了算术运算，我们需要使用 `print`\
    \ 函数打印结果。`print` 函数只接受传递给它的值。这意味着我们需要在打印之前将每个小数值转换为字符串。在引号之间什么都不加使用 `print` 语句会打印一个空行。这之所以有效，是因为\
    \ `print` 函数也会在其输出末尾添加一个新行，除非另有规定，所以打印空字符串会打印一个新行。\n\n![](img/c72194f2c3aec198936695a665a5167c_107_0.png)\n\
    \n树莓派上的 Python 编程\n\n在树莓派上使用 Python\n\n# 带有循环和 if 语句\n\n```python\n# 处理结果\nif\
    \ result == 'yes':\n    print('Continuing')\nelse:\n    print('Exiting')\n   \
    \ sys.exit()\n```\n\n> `print` 函数也会在其输出末尾添加一个新行，除非另有规定，所以打印空字符串会打印一个新行\n\n# 增加计数\n\
    \n```python\n# 像 while 循环一样给数字加 5 并每次输出\nprint('Incrementing the number by 5')\n\
    count = 5\nnumber = 1\nprint('number ' + str(count) + ' = ' + str(number))\n#\
    \ 增加计数\ncount += 1\n```\n\n"
