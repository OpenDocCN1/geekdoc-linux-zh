    # Using Python on Raspberry Pi


    # Using Python on Raspberry Pi


    Program in Python with the Raspberry Pi, and lay the foundations for all your
    future projects


    This tutorial follows on from the one last issue: ''Setting up the Raspberry Pi'',
    where we showed how to prepare your SD card for use with the Raspberry Pi. The
    beauty of using an SD card image is that the operating system is ready to go and
    a development environment is already configured for us. We''ll use a lightweight
    integrated development environment (IDE) called Gearany for our Python development.
    Gearany provides a friendlier interface compared text-based editors such as nano
    to make it easier to get into the swing of things. This tutorial will cover topics
    such as:


    +   - Basic arithmetic

    - Comparison operators, for example ''equal to'' and ''not equal to''

    - Control structures, for example loops and statements


    By the end, we''ll have an advanced version of our ''hello world'' application.
    Let''s dive straight in...


    ![](img/c72194f2c3aec198936695a665a5167c_103_0.png)


    # Staying organised


    We don''t want to messy folders on our new Pi, so let''s go to the file manager
    and organise ourselves. Open the file manager by clicking the icon next to the
    menu icon on the bottom left of the screen. Create a new folder by right-clicking
    and selecting New>Folder, type a name and click OK. We created a folder called
    Python, and inside that created a folder Hello World v2.


