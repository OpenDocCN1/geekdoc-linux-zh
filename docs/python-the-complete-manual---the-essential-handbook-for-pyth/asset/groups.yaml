    \n# 使用 Python 工作\n\n# 使用 Beautiful Soup 爬取 Wikipedia\n\n# 百事百科（Wiki-Everything）\n\
    \nWikipedia 有许多相互互联的不同服务，我们不想抓取那些页面，因此我们编写了一个很长的条件语句来停止操作。它在确保我们只获取来自 Wikipedia\
    \ 的链接方面表现非常好。\n\n## 创建有用变量\n\n02 这些变量将跟踪脚本运行期间我们访问的链接；`addresses` 是一个包含我们访问过的每个链接的列表；`deepestAddresses`\
    \ 是从起点开始链接最深处的页面链接；`storeFolder` 是我们保存 HTML 文件的地方，`maxLevel` 是我们可以跟随链接到起始页面的最大深度。\n\
    \n# 处理用户输入\n\n03 在此函数的前几行中，我们只是在创建一个辅助语句。之后，我们解析执行时传递给程序的任何参数，并寻找 -URL 标志和 -levels\
    \  标志。如果我们已经预设了要跟随链接的深度，则 `-levels` 标志是可选的，但如果缺少 `-URL` 标志，我们需要一个起始链接，我们会提示用户并退出。如果我们有链接，我们会快速检查我们是否有一个存储文件的目录——如果没有，我们就创建一个——然后调用函数来获取该页面。最后，我们注册一个在脚本尝试退出时运行的句程序。\n\
    \n# 从 URL 获取页面\n\n04 在这里，我们使用 `urllib` 请求用户请求的页面，一旦我们收到该页面，我们将通过 `soup` 变量将内容传递给\
    \ `BeautifulSoup`。这允许我们在解析文档时访问将要调的方法。\n\n# 修剪冗余\n\n05 Wikipedia 有许多我们不想解析的节点。内容部分允许我们直接忽略\
    \ Wikipedia 的大部分 GUI，但仍然有很多我们不想解析的元素。我们通过遍历在文档早些创建的 `undesirables` 列表来解决这个问题。对于我们不想要的每个不同\
    \ div/section/节点，我们调用 `BeautifulSoup` 的 `find_all()` 方法并从文档中提取该节点。在 `undesirables`\
    \ 列表的末尾，大部分我们不需要的内容都将消失。我们还会查找 Wiki 页面中的 `also` 元素。通常，这之后的所有内容对我们都有用。通过在 `also`\
    \ 节点上调用 `find_all_next()` 方法，我们可以获得从该点开始可以移除的所有元素列表。\n\n> \"HTML 页面在渲染页面时使用内置的浏览器样式\"\
    \n\n## 使用 Beautiful Soup 爬取 Wikipedia\n\n“Wikipedia 有许多不同的服务相互互联；我们不想抓取那些页面”\n\
    \n```python\npage = req.read()\nreq.close()\nsoup = BeautifulSoup(page, \"html5lib\"\
    , from_encoding=\"UTF-8\")\ncontent = soup.find(id=\"mw-content\")\nif hasattr(content,\
    \ 'find_all'):\n    global undesirables\n    for notWanted in undesirables:\n\
    \        removal = content.find_all(notWanted)\n        if len(removal) > 0:\n\
    \            for el in removal:\n                el.extract()\nalso = soup.find(id=\"\
    also\")\nif also is not None:\n    tail = also.find_next('li')\n    if len(tail)\
    \ > 0:\n        for element in tail:\n            element.extract()\nfor link\
    \ in content.find_all('a'):\n    href = link['href']\n    if isValidLink(href):\n\
    \        if level < maxlevel:\n            stored = False\n            for addr\
    \ in addresses:\n                if addr == href:\n                    stored\
    \ = True\n        if stored == False:\n                title = href.replace(\"\
    /wiki/\", \"\")\n                addresses.append(str(title) + \".html\")\n  \
    \              grabPage(\"http://wikipedia.org\" + href, level, title)\n```\n\n\
    ### 4 获取页面\n在这里我们使用 `urllib` 请求用户请求的页面，一旦我们收到该页面，我们将通过 `soup` 变量将内容传递给 `BeautifulSoup`。这允许我们在解析文档时访问将要调的方法。\n\
    \n### 5 检查链接\n我们遍历所有的 `<a>` 标签，并检查 `href` 中是否有有效的 Wikipedia 链接。如果链接有效，我们会快速检查从当前页面跟随了多深。如果我们达到了可以跟随的最大深度，我们会存储此页面并退出，否则我们将开始寻找可以抓取的链接。对于请求的每个页面，我们将它的\
    \ URL 添加到 `addresses` 列表中；确保不会对每个链接重复调用页面。\n\n### 样式\n这之后的所有内容对我们都有用。通过在 `also`\
    \ 节点上调用 `find_all_next()` 方法，我们可以获得从该点开始可以移除的所有元素列表。当前，HTML 在渲染页面时将使用内置的浏览器样式。\n\
    \n```python\nprint title\nlink['href'] = link['href'].replace(\"/wiki/\",\n```\n\
    \n1, title\n\n## 抓取链接\n上方查看 Beautiful Soup 文档 http://bit.ly/02I68D\n\n## 写入文件\n\
    现在我们创建一个文件以便以后读取新解析的文档。我们将文件名中的任何 `?` 更改为 `.so`，以免脚本尝试写入随机随机文件夹。我们还会快速检查目前为止跟随了多少链接。如果达到了它的最大深度，我们将将其添加到\
    \ `deepestAddresses` 列表中。我们稍后会用到这一小部分。\n\n"
