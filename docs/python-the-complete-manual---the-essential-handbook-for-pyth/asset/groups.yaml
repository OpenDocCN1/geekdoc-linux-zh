    \ When you are using Python for web development you get access to a huge catalogue\
    \ of modules and community support – make the most of them.\n\nWeb development\
    \ can be done in many different ways, right from using the plain old CGI modules\
    \ to utilising groomed web frameworks. Using the latter is the most popular method\
    \ of building web applications with Python, since it allows you to build applications\
    \ without worrying about all that low-level implementation stuff. There are many\
    \ web frameworks available for Python, such as Django, TurboGears and Web2Py.\
    \ For this tutorial we will use our current preferred option, Django.\n\n### The\
    \ Django Project magazine issue tracker\n\n01 The `django-admin.py` file is used\
    \ to create new Django projects. Let's create one for our issue tracker project...\n\
    \nIn Django, a project represents the site and its settings. An application, on\
    \ the other hand, represents a specific feature of the site, like blogging or\
    \ tagging. The benefit of this approach is that your application becomes portable\
    \ and can be integrated with other Django sites with very little effort.\n\n```bash\n\
    $ django-admin.py startproject issueTracker\n```\n\nA directory will be created.\
    \ This will also act as the root of your development web server that contains\
    \ Django. Under the project directory you will find the following items:\n\n-\
    \ **manage.py**: Python script to work with your project.\n- **issueTracker**:\
    \ A Python package (a directory with `__init__.py` file for your project). \n\n\
    ![](img/c72194f2c3aec198936695a665a5167c_25_0.png)\n\nThis package is the one\
    \ containing your project's settings and configuration data.\n- `issueTracker/settings.py`:\
    \ This file contains all the configurations for the project.\n- `issueTracker/urls.py`:\
    \ This file contains URL mappings.\n- `wsgi.py`: An entry-point for WSGI-compatible\
    \ web servers to serve your project. Only when you are deploying your project.\
    \ For this tutorial we won't be needing it.\n\nNow update the path options:\n\
    ```python\nTEMPLATE_DIRS = (\n    getabspath('templates'),\n)\n\nMEDIA_ROOT =\
    \ getabspath('media')\nMEDIA_URL = '/media/'\n```\n\nWe need to enable this in\
    \ the config file as well:\n```python\nINSTALLED_APPS = (\n    'django.contrib.admin',\n\
    \    'issuedis',\n)\n```\n\nNow we will enable the admin interface for your site.\
    \ This is a feature of Django which allows automatic creation of an admin interface\
    \ of the site and can be used to add and manage content for your site. Uncomment\
    \ the following line:\n\n### Configuring the Django project\n\n02 Before start\
    \ working on the application, configure the Django project as per our requirements.\
    \ Edit `issueTracker/settings.py` as follows (only requiring modification are\
    \ shown):\nDatabase Settings: We are using SQLite3 as our database system.\nNote:\
    \ Text edit indicates new code or updated code.\n\n```python\n'default': {\n \
    \   'ENGINE': 'django.db.backends.sqlite3',\n    'NAME': 'issuedis',\n},\n```\n\
    \n### Creating issuedis app\n\n03 In this step we create primary app for our site,\
    \ `issuedis`. To do that, we will use the manage script:\n\n```bash\n$ python\
    \ manage.py startapp issuedis\n```\n\nDjango requires an absolute path for directory\
    \ settings. But we want to pass in the relative directory references. In order\
    \ to that we will add a helper function. Inserting the code at the top of settings\
    \ file.\n\n```python\nimport os\ndef getabspath(path):\n    return os.path.join(os.path.abspath(__file__),\
    \ path)\n```\n\n```python\nINSTALLED_APPS = (\n    'django.contrib.auth',\n  \
    \  'django.contrib.contenttypes',\n    'django.contrib.sessions',\n    'django.contrib.sites',\n\
    \    'django.contrib.messages',\n    'django.contrib.staticfiles',\n    'django.contrib.admin',\n\
    \    'issuedis',\n)\n```\n\n### Creating the data model\n\n04 This is the part\
    \ where we define the data model for app. Please see the comments to understand\
    \ what is happening here.\n\n```python\nfrom django.db import models\n# We importing\
    \ the user authentication module that we use the built in this app\nfrom django.contrib.auth\
    \ import models\n# We would also create an admin interface for our app\nfrom django.db\
    \ import admin\n\n# A Tuple to hold the multi char fields.\n# First presents the\
    \ field name that represents the display name \nISSUE_STATUS_CHOICES = (\n   \
    \ ('New', 'New'),\n    ('accepted', 'Accepted'),\n    ('reviewed', 'Reviewed'),\n\
    \    ('started', 'Started'),\n    ('closed', 'closed')\n)\n\nclass Issue(models.Model):\n\
    \    # owner will be a foreign key to the User model which is already built in\
    \ Django.\n    owner = models.ForeignKey(\n        models.User, null=True, blank=True,\
    \ default=\"new\"\n    )\n    status = models.CharField(\n        max_length=20,\n\
    \        choices=ISSUE_STATUS_CHOICES,\n        default=\"new\"\n    )\n    text\
    \ = models.TextField()\n    opened_on = models.DateTimeField(auto_now_add=True)\n\
    \    modified_on = models.DateTimeField(auto_now=True)\n\nclass IssueAdmin(models.ModelAdmin):\n\
    \    list_display = ('id', 'text', 'status', 'modified_on')\n    list_filter =\
    \ ('status', 'owner')\n    date_hierarchy = 'opened_on'\n    search_fields = ('text',\
    \ 'status')\n\nadmin.register(Issue, IssueAdmin)\n```\n\n### Enabling the admin\
    \ site\n\n05 The admin site is already enabled, but we need to enable it in `urls.py`.\
    \ Update the `urls.py` file as follows:\n\n```python\nfrom django.conf.urls import\
    \ path\nfrom django.urls import include\nfrom django.contrib import admin\n\n\
    urlpatterns = [\n    path('admin/', admin.site.urls),\n    path('', include('issuedis.urls')),\n\
    ]\n```\n\n### Starting the Django web server\n\n06 Django includes a built-in\
    \ web server which is handy to test and debug Django applications. Let's see how\
    \ our admin interfaces... Start the web server:\n\n```bash\n$ python manage.py\
    \ runserver\n```\n\nIf you do not have any errors in your code, the server should\
    \ be available on port 8000. To launch the admin interface, navigate to your `http://localhost:8000/admin`.\
    \ You will be asked to log in. Enter the username and password.\n"
  mdcn: "\n\n# 介绍 Python\n\n# Python 基础\n\n## 介绍 Python\n\n奠定基础并构建你的知识\n\n既然你已经迈出了\
    \ Python 的第一步，现在是时候利用这些知识来编写代码了。在本节中，你将了解到如何为 Android 操作系统（第32页）和全球网（第26页）开始编写应用程序。这些简单易懂的教程将帮助你巩固所学会的\
