    ## 使用 NumPy 进行简单计算


    关于 NumPy，尽管名字简单，NumPy 是一个主要用于数组和矩阵的强大包。创建数组的许多方法是使用 array 函数。给定一个名为 myArray 的数组，你可以执行以下命令找到其中的最小值和最大值：


