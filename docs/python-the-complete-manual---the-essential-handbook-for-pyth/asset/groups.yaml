  mdcn: "\n\n## 使用 GPIO 控制 LED\n\n## 在 Pi 上使用 Python\n\n> 你知道吗...\n> 官方 Python 文档是初学者和专业人士极好的资源\n\
    > http://python.org/doc.\n\n## 使用 PWM\n\n20 下一步是告诉引脚输出并设置一种退出程序的方法。在这里我们再次调用 GPIO\
    \ 类，然后调用 PWM 方法并传入引脚号；第二个值是赫兹频率频率——在此情况下为 50。\n\n```\np = GPIO.PWM(12, 5)\np.start(1)\n\
    input(\"Press return to stop:\")\np.stop()\nGPIO.cleanup()\n```\n\n## 测试脚本\n\n\
    17 现在为了确保脚本已导入，我们需要运行 python 命令，然后输入我们创建的脚本名称。如果一切顺利，你不应该看到任何错误信息。但是，如果你看到了，请返回之前的步骤检查每一步是否都正常。\n\
    \n- python gpio.py\n\n## 设置 GPIO 模式\n\n18 再次在 nano 中重新加载脚本。我们将把 GPIO 模式设置为 BOARD。这种方法最安全，无论你使用的是哪个版本的\
    \ Pi。最好选择一种 GPIO 规范并坚持使用下去，否则这在以后会引起困惑。\n\n- nano gpio.py\nGPIO.setmode(GPIO.BOARD)\n\
    \n## 调整 PWM\n\n21 为了给 LED 增加淡出的时间，我们首先需要导入库，然后设置 12 号引脚初始频率为 50Hz。\n\n```python\n\
    import time\nimport RPi.GPIO as GPIO\nGPIO.setmode(GPIO.BOARD)\nGPIO.setup(12,\
    \ GPIO.OUT)\np = GPIO.PWM(12, 50) # channel=1 frequency=50Hz\np.start(0)\n```\n\
    \n## 添加渐变\n\n22 然后我们将添加另一个 try-except 块，这次检查 LED 在 - 状态，一旦达到特定水平，就反转过程。要运行此代码，请从\
    \ nano 保存并运行 python gpio.py。\n\n```python\nwhile 1:\n  for dc in range(0, 101,\
    \ 5):\n    p.ChangeDutyCycle(dc)\n    time.sleep(0.1)\n  for dc in range(100,\
    \ -1, -5):\n    p.ChangeDutyCycle(dc)\n    time.sleep(0.1)\nexcept KeyboardInterrupt:\n\
    \  pass\n```\n\n## 设置引脚模式\n\n19 引脚必须先定义为输入或输出才能工作。最简单的方法是调用 GPIO.setup 方法。传入引脚号，然后是\
    \ GPIO、OUT 或 IN。因为我们想将 LED 作为输出。你将频繁使用这些规范，所以在在它们刻入大脑之前尽可能地学习它们吧！\n\n- GPIO.setup(12,\
    \ GPIO.BOARD)\n\n> \"我们将 GPIO 模式设置为 BOARD。无论你使用的是哪个版本的 Pi，这都有效\"\n\n![](img/c72194f2c3aec198936695a665a5167c_126_0.png)\n\
