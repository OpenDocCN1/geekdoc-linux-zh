    \n![](img/c72194f2c3aec198936695a665a5167c_14_0)\n\n## 控制结构\n\n在程序编程中，控制结构是指任何可以改变代码执行路径的语句。例如，一个在数字小于5时结束程序的控制结构看起来如下：\n\
    \n```python\n#!/usr/bin/env python2\nimport sys # 用于 sys.exit 函数\nint_condition\
