    - * >> twoD = np.array([[1,2,3,4],[5,6,7,8]])


    如果你想找到所有数组元素的平均值，可以运行下一个命令：


    - * >> myArray.mean()

    array([1,2,3,4])


    同样，你可以找到元素的位数，位数是将数据集分成具有相同数量元素的子集（左侧和右侧）。如果数据集元素个数为奇数，位数就是数据的中间部分。另一方面，如果元素个数为偶数，位数就是排序数据集两个中间元素的平均值。


