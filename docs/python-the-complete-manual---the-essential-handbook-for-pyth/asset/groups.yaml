    # Install the software


    REST stands for Representational State Transfer. (It is sometimes spelt "REST")
    It relies on a stateless, client-server, cacheable communications protocol – and
    in virtually all cases, the HTTP protocol architecture style for designing networked
    applications.


    04 Boot up your Raspberry Pi and connect it to the Internet. Before you install
    the Twilio software, it is worth updating and upgrading your Pi. In the LX Terminal,
    type sudo apt-get update, sudo apt-get upgrade. Once complete, type sudo apt-install
    twilio or sudo pip install twilio to install the software. (If you need to install
    pip, type sudo apt-get install python-pip-dev, press Enter, then sudo pip install
    -U pip.)


    # Twilio authentication


    05 Now you are ready to create the SMS program that will send the text to your
    mobile phone. Open your Python editor and import the Twilio REST libraries (line
    one, below). Next add your AccountSid and Auth Token, replacing the X with yours,
    as you will find on your dashboard.


    ```

    from twilio.rest import TwilioRestClient

    account_sid = "xxxxxxxxxxxxxxxxxxxxxxxx"

    # Enter Yourss

    auth_token = "xxxxxxxxxxxxxxxxxxxxxxxx"

    # Enter Yourss

    client = TwilioRestClient(account_sid, auth_token)

    ```


    Twilio, whose website is pictured, has been used by large corporations like Coca
    Cola, Uber and Nordstrom


