    is applied horizontally to counteract the wind. In doing so, some of the quadcopter
    hovering at a fixed height is now battling the wind; the overall power is reduced,
    the quadcopter will start drifting.


    In the vertical direction, a single PID converts the rate of ascent/descent to
    the acceleration output applied to each plate. Finally prevention of yaw (like
    a spinning top) uses two PIDs – one to set the desired angle of yaw, and one to
    set the rotation speed. The output of these controls the yaw motors which spin
    in the same direction. The most critical is the pitch/roll stability. This ensures
    that whatever requirements enforced by other PIDs and external factors, the quadcopter
    is stable in achieving those targets; without this stability, the rest of the
    PIDs cannot work. Pitch is controlled by differences between the front and back
    propellers; yaw by left and right directions, and by clockwise/counterclockwise
    differences from the corresponding PID'' outputs. The net of all three PIDs are
    then applied to the appropriate combination of motors'' PWM channels to the individual
    pulse widths.


    Horizontal movement is more complex. The target is to move at 1 metre per second.
    The initial requirement is the headwind compensation – down nose plus increased
    power will apply a force leading to forward acceleration. But once horizontal
    speed is attained, the motor needs to stop or at the same time, friction in the
    air will slow the movement. So there''s a dynamic tilt/aft to maintain this stable
    forward velocity.


