    # 欢迎来到 Python


    Python 是一种多功能语言，它的流行日益并不令人意外。它与日常语言的相似性使其成为树莓派的完美伙伴，而树莓派通常是实际编程的第一步。但不要被它对初者的友好所迷惑——Python
    有许多更高级的功能。在本杂志中，你将学习如何使用 Python 编程，发现奇的项目来提高理解，并寻找使用 Python 增强计算体验的方法。你还将创建有趣的项目，包括编写四旋无人机和从树莓派发送短信。让我们开始编码吧！


    ![](img/c72194f2c3aec198936695a665a5167c_2_0.png)


    # Hello World


    第一行以 shebang（符号 #!）开头，随后是 Python 解释器的路径。程序加载器使用此行来确定后续行是否需要解释。如果你在像 IDLE 这样的 IDE
    中运行，不需要这样做。


    解释器实际读取的代码只有一行。我们通过在调用函数后的括号中将 Hello World 传递给 print 函数。Hello World 没有加引号，以表示它是一个字面量，而不应被解释为源代码。正如我们预期的，Python
    中的 print 函数会打印传递它的任何值。


    你可以使用键组合 Ctrl+O 然后按 Enter 在 nano 中保存文件的更改。使用 Ctrl+X 退出 nano。


    ```python

    #!/usr/bin/env python2

    print("Hello World")

    ```


    你可以通过在文件名前加 / 来运行 Hello World 程序——在这种情况下你输入：

    hello_world.py


    ```

    [Liam@liam-laptop Python]$ ./hello_world.py

    Hello World

    ```


    # 变量和数据类型


    变量是源代码中的名称，它与内存区域关联，可以使用该区域存储数据，然后在代码中调用它。数据可以是许多类型之一，包括：


    | 类型 | 描述 |

    |---|---|

    | 整数 | 存储整数 |

    | 浮点数 | 存储小数 |

    | 布尔 | 值为 True 或 False |

    | 字符串 | 存储字符集合。"Hello World" 是一个字符串 |


    ![](img/c72194f2c3aec198936695a665a5167c_10_0.png)


    > "变量与内存区域关联，可以使用该区域存储数据"


