    ## Plotting with Matplotlib


    The first thing you should do is to install Matplotlib. As you can see, Matplotlib
    has many dependencies that also install. The first thing you will learn is how
    to plot a polynomial function. The necessary commands for plotting $3x^2+1$ are
    the following:


    ```python

    import numpy as np

    import matplotlib.pyplot as plt


    poly = np.poly1d([3, 0, 1])

    x = np.linspace(-5, 5, 100)

    y = poly(x)


    plt.xlabel(''x values'')

    plt.ylabel(''y values'')

    ticks = np.arange(-5, 6, 10)

    plt.xticks(ticks)

    plt.yticks(ticks)

    plt.plot(x, y)

    ```


    ### Using SciPy for image processing


    Now we will show you how to transform and process an image using SciPy. The most
    important part of the code is following line:


    ```python

    from scipy.stats import poisson, lognorm

    from PIL import Image


    image = np.array(Image.open(''sample.png'').convert(''L''))

    ``` This allows you to use a PNG file and convert it into a NumPy array. The program
    will also separate the output to four parts and display a different image for
    each of these four parts. The variable that holds the polynomial is poly. The
    values that were plotted for x will be using `x=np.linspace(-5,5,100)`. The other
    important variable is y, which calculates and holds the values of $f(x)$ for each
    value. It is important that you start plotting using the "plot" parameters in
    order to see the output on your screen. If you are interested in plotting polynomials,
    you should know that NumPy can also calculate the derivatives and plot multiple
    functions in the same output.


    ### Other functions


    It is very useful to be able to find out the data type of the elements in an array;
    it can be done using the `dtype()` function. Similarly, `ndim()` function returns
    the number of dimensions of an array. When reading from external files, you can
    save your data columns to separate variables using the following method.


    ### About SciPy


    SciPy is built on top of NumPy. It supports more advanced integration, signal
    processing, audio processing, and statistics. The example below shows one:


    ```python

    >>> rvs(10)

    array([12, 11, 9, 9, 10, 4, 13, 8])

    >>> pdf(3)

    0.83218061772522842

    ```


    The example uses two statistics distributions and may be difficult to understand,
    but it is presented in order to give you a better taste of SciPy commands.


