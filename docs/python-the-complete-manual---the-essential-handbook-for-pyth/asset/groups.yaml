    \n| 像 Python 这样的解释型语言是指源代码每次程序运行时都会转换为机器码并执行的语言。 | 这与 C 等编译型语言不同，编译型语言源代码只会被转换为一次机器码——生成的机器码会在每次程序运行时执行。\
