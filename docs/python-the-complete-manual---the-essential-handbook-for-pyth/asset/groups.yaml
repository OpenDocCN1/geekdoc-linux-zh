    \ of the line so the frames appear correctly (without any background). We then\
    \ use subsurface to set the PlayerImage to the middle sprite of the sheet, which\
    \ has an initial size of 5. Changing this will alter the image drawn to the screen:\
    \ '0' would draw it leaning fully left; '1' to the right.\n\n```\nGameState.end_game\
    \ = False\nGameState.start_screen = True\nGameState.vector = 0\nGameState.shoot_bullet\
    \ = False\n```\n\n```\ndef control(self):\n    for event in pygame.event.get():\n\
    \        if event.type == pygame.QUIT:\n            GameState.start_screen = False\n\
    \            GameState.end_game = True\n        if event.type == pygame.KEYDOWN\
    \ \\\n            and event.key == pygame.ESCAPE:\n                if GameState.start_screen:\n\
    \                    GameState.end_game = True\n                    self.kill_all()\n\
    \        if GameState.start_screen:\n            keys = pygame.key.get_pressed()\n\
    \            if keys[pygame.K_LEFT]:\n                GameState.vector = -1\n\
    \                self.animate_left = True\n                self.animate_right\
    \ = False\n            elif keys[pygame.K_RIGHT]:\n                GameState.vector\
    \ = 1\n                self.animate_right = True\n                self.animate_left\
    \ = False\n```\n\n# Animation graphs\n\n08 Slightly further down the list in the\
    \ initializing code for our Game class, we also set two flags for our player:\
    \ animate_left and animate_right. As you will see in the Control method of our\
    \ Game class, we use these flags to when we want animations to happen with True\
    \ and False. It also allows us to automatically animate the sprite back to its\
    \ natural resting state (otherwise the ship will continue as if it's flying left\
    \ when it has stopped).\n\n```\nGameState.vector = 0\nself.animate_right = False\n\
