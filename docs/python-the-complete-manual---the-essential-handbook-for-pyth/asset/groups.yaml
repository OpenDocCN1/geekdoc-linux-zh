    # Create with Python


    # Program a Space Invaders clone


    # Classes – part 2


    # Main loop key logic – part 1


    07 In Invader''s classes, besides creating the required attributes for the object,
    you''ll also notice all the classes have an update() method apart from the Block
    class (which is a function within a class). The update() method is called in every
    loop through the main game and simply asks the iteration of the class we''ve created
    to move. In the case of a bullet from the Ammo class, we''re asking it to move
    down the screen. If it goes off either, we destroy it.


    11 Firstly the game checks that the end_game attribute is false – if it''s true,
    the entire loop in main_loop() is skipped and we go straight to pygame.quit().
    This flag is set to true only if the player closes the game window or presses
    the ESC key when the start_screen appears. Assuming end_game and start_screen
    are false, the main loop can start proper, with checks to see if the location
    of the player needs to change. Next we attempt to make an enemy missile and use
    a random module to limit the number of missiles that can be created. Next we call
    the update() method for each actor on the screen using a simple loop. This makes
    everyone''s to date moved before we check collisions in calc_collisions().


    ![](img/c72194f2c3aec198936695a665a5167c_91_0.png)


    # Ammo


    08 What''s most interesting about classes, though, is that you can use one class
    to create lots of different things. You could, for example, have a pet class.
    From that class you could create a cat (that meows) and a dog (that barks). They''re
    different in many ways; they both have four legs, so can be from the same parent
    class. We''ve done exactly that with our Ammo class, using it to create both the
    player bullets and the alien missiles. They''re different colours and shoot in
    opposite directions, but they''re fundamentally one and the


    # Main loop key logic – part 2


    # The game


    09 Our final class is called Game. This is where all the main functionality of
    the game itself lives, but however, so far this is just a list of objects – nothing
    until update() is created at the bottom of the code. The Game class is the central
    part of the game resides. We initialize Pygame, set the image for our protagonist
    and antagonist and some State attributes to control key aspects of external classes,
    changing the player''s vector (direction).


    12 Once have been calculated, we need to see if the game still seems to continue.
    We do so with is_dead() and defenses(). If either these methods return true, we
    need to return to the start screen. On the other hand, we need to check if we''ve
    killed all the aliens, from within win_round(). Assuming we''re not dead, but
    the aliens are all gone, we can know which round() creates a fresh batch of allies
    and increases their speed across the screen. We refresh the screen so that''s
    moved, shot or killed can be updated or removed from the screen. Remember, the
    main loop happens 20 times a second – so the don''t wait for the screen to update
    right at the end of the loop is of no consequence.


    # The main loop


    10 There are a lot of methods (class function) in the Game class, and each is
    designed to control a particular aspect of either setting up the game or the gameplay
    itself. Loop dictates what happens within any one round of the game is contained
    in the main_loop() method at the bottom of the pyplayers.py script and the key
    is to unlocking exactly what variables and functions you need for your game.


