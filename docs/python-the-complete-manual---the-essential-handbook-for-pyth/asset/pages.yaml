  md: '# Program a quadcopter


    # Use Python with Pi


    ![](img/c72194f2c3aec198936695a665a5167c_120_0.png)


    # # Experimentation and tuning


    09 While the code accurately reflects everything we''ve described here, there''s
    one critical set of steps which can only be found through live testing: these
    are the PID gains. For each PID tuning, there is an independent Proportional,
    Integral and Differential gain that can only be found with estimation/experiment.
    The results for every quadcopter will differ. Luckily there is a relatively safe
    way to proceed.


    Tweak the P gain accordingly. Once P is good, a touch of I gain – this will ensure
    return to O as well as stability. D gain is optional, but adds firmness and crisp
    response. Tapping a D-gain stable quad is like clicking on a table – it doesn''t
    move.


    First, find the PWM take-off speed – by sitting your quadcopter on the ground
    and slowly increasing the PWM value until it starts looking light-footed – for
    your expert, this was about 1590us pulse width (or 1000us+590us, as shown in the
    code).


    Vertical speed can be guestimated. 1590us is taking off; desired take-off speed
    is 0.5m/s so a P gain of 100 is okay. No I or D gain needed. With that a real
    take-off, hover and landing are safe, which is good as these are to tune the directional
    PIDs. The quadcopter alarming themselves walls or performing maneuvers in mid-air
    powering themselves into the ground. Best executed outside in a open field/garden/park
    where the ground is soft after overnight night


    Next, sorting out the stability PIDs – assuming your quadcopter is square and
    its balance is roughly central, the result of pitch tuning also applies to yaw.
    For pitch tuning, disable two diagonally opposed motors and rest – the quadcopter
    horizontal in power. By powering the dangling motors with PWM to get just under
    take-off speed (1550us pulse width in your case). The quad may rock wildly, wobble
    so much pretence of control, self-right when nudged, or do nothing?


    There''s no shortcut to this, so just accept there will be crashes and damage
    the engine as best you can


    Assuming all the above has gone to, then you will have a quadcopter that takes
    off, hovers and lands in breezy conditions. Next step is to add a remote control,
    we''ll see for that another day!


