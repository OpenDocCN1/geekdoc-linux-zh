  md: "# Create with Python\n\n# Pivaders part 2: graphics and sound\n\n# Loading\
    \ the sprite sheet\n\n07 Since we are inheriting from the Sprite class to create\
    \ our Player class, we can easily alter how the player looks by changing pygame.\
    \ First, we need to load our sprite sheet with pygame.image.load(). Since we made\
    \ it with a transparent background, we can convert_alpha() to the end of the line\
    \ so the frames appear correctly (without any background). We then use subsurface\
    \ to set the PlayerImage to the middle sprite of the sheet, which has an initial\
    \ size of 5. Changing this will alter the image drawn to the screen: '0' would\
    \ draw it leaning fully left; '1' to the right.\n\n```\nGameState.end_game = False\n\
    GameState.start_screen = True\nGameState.vector = 0\nGameState.shoot_bullet =\
    \ False\n```\n\n```\ndef control(self):\n    for event in pygame.event.get():\n\
    \        if event.type == pygame.QUIT:\n            GameState.start_screen = False\n\
    \            GameState.end_game = True\n        if event.type == pygame.KEYDOWN\
    \ \\\n            and event.key == pygame.ESCAPE:\n                if GameState.start_screen:\n\
    \                    GameState.end_game = True\n                    self.kill_all()\n\
    \        if GameState.start_screen:\n            keys = pygame.key.get_pressed()\n\
    \            if keys[pygame.K_LEFT]:\n                GameState.vector = -1\n\
    \                self.animate_left = True\n                self.animate_right\
    \ = False\n            elif keys[pygame.K_RIGHT]:\n                GameState.vector\
    \ = 1\n                self.animate_right = True\n                self.animate_left\
    \ = False\n```\n\n# Animation graphs\n\n08 Slightly further down the list in the\
    \ initializing code for our Game class, we also set two flags for our player:\
    \ animate_left and animate_right. As you will see in the Control method of our\
    \ Game class, we use these flags to when we want animations to happen with True\
    \ and False. It also allows us to automatically animate the sprite back to its\
    \ natural resting state (otherwise the ship will continue as if it's flying left\
    \ when it has stopped).\n\n```\nGameState.vector = 0\nself.animate_right = False\n\
    self.animate_left = False\n```\n\n```\nif keys[pygame.K_SPACE]:\n    if GameState.start_screen:\n\
    \        GameState.start_screen = False\n        self.lives = 2\n        self.make_player()\n\
    \        self.make_defenses(2)\n        self.make_alien_wave()\n```\n\n```\nGameState.shoot_bullet\
    \ = True\nself.bullet_fx.play()\n```\n\n# The animation method\n\n09 We use flags\
    \ in the code for the player: animate_player(). Here we use nested statements\
    \ to control the animation and physically set the player image. It states that\
    \ if the animate_right is True and if the current position is not what we want,\
    \ we increment the ani_pos variable and set the player image. The Else statement\
    \ then animates the sprite back to its resting state and the same logic is then\
    \ applied in the opposite direction.\n\n```\ndef animate_player(self):\n    if\
    \ animate_right:\n        if self.ani_pos < 6:\n            Player.image = self.sprite_sheet.subsurface(self.ani_pos*64,\
    \ 0, 64, 61)\n            self.ani_pos += 1\n    else:\n        if self.ani_pos\
    \ > 5:\n            self.ani_pos -= 1\n            Player.image = self.sprite_sheet.subsurface(self.ani_pos*64,\
    \ 0, 64, 61)\n    if animate_left:\n        if self.ani_pos > 0:\n           \
    \ self.ani_pos -= 1\n```\n\n![](img/c72194f2c3aec198936695a665a5167c_95_0.png)"
  merge: -1
