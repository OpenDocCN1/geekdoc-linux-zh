    Write your own RasPi shooter in 300 lines of Python


    When you''re learning to program in a new language or trying to master a new module,
    experimenting with familiar and relatively simply project is a very useful exercise
    to help expand your understanding of the tools you''re using. Our Space Invaders
    clone is one such example that lends itself perfectly to Python and the Pygame
    module - it''s a simple game with almost universally understood rules and logic.


    We''ve tried to use many features of Pygame, which is designed to make the creation
    of games and interactive applications easier. We''ve extensively used the Sprite
    class, which saves dozens of lines of extra code in making collision detection
    simple and updating the screen and its many actors a single-line command.


    Have fun with the project and make sure you tweak and change things to make it
    your own!


