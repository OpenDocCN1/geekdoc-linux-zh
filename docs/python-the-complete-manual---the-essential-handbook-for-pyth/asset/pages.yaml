    \ with self.\n            canvas=\n                Color(1, 0, 1)\n          \
    \      rect(0, 1, r, g, b, a -> red)\n            self.blocks.append(block)\n\
    \            add_widget(block))\n```\n\n```\nclass Player(Widget): # A\n    moving\
    \ paddle\n    position =\n        NumericProperty(0.5)\n    direction =\n    \
    \    StringProperty('none')\n    class Ball(Widget): # A\n        bouncing ball\n\
    \        # _pos_hints for\n        positioning,\n        pos_hint_x =\n      \
    \      NumericProperty(0.5)\n        pos_hint_y =\n            NumericProperty(0.3)\n\
    \        proper_size =\n            NumericProperty(0.8)\n        velocity =\n\
    \            ListProperty([0.1, 0.5])\n```\n\n![](img/c72194f2c3aec198936695a665a5167c_33_0.png)\n\
    \nYou probably noticed we had one of the Block's 'Color' instructions to clear\
    \ its property. This means that we can change the property any time to update\
    \ the color of the block, or in this case to give each block a random color (Fig.\
    \ 04).\n\nNow that each of has a graphical representation, let's learn how to\
    \ place them, so start up the app and actually see something there.\n\nHere create\
    \ the widgets we want then use add_widget to add to the graphics. Our root widget\
    \ on the screen is an instance of Game and every block is added to to be displayed.\n\
    \nThe only new thing there is that every Block has been given a pos_hint. All\
    \ widgets have this special property, and it is used by Layout like our Game to\
    \ set their position proportionately to the layout.\n\nThe dictionary is to handle\
    \ various parameters, but in this case 'X' give y and Block position as a relative\
    \ fraction of the width and height.\n\nYou can run the app now, and add 50 blocks\
    \ to the Game before displaying it on the screen. Each should have one of the\
    \ three random colors and be positioned in a grid, but you'll now notice their\
    \ sizes aren't manually set so they overlap. We can fix this by setting their\
    \ size_hint properties – and let's see\n\n```\nclass Block(Widget): #\n    Each\
    \ coloured block to destroy\n    colour =\n    ListProperty([1, 0, 0])\n```\n\n\
    Fig 03\n\n```\nfrom kivy.graphics.context\n    instructions import Color\nfrom\
    \ kivy.graphics\n    vertex_instructions import Rectangle\nclass Game(FloatLayout):\n\
    \    def setup_blocks(self):\n        for y_jump in range(5):\n            for\
    \ x_jump in range(10):\n                block = Block(pos_ \n                hint={\n\
    \                    'x': 0.05 + 0.09*x_,\n                })\n```"
