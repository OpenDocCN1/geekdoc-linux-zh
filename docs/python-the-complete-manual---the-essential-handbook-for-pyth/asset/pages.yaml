    # Global variables & tuples


    If you''re looking to get a better understanding of programming games with Pygame
    and Python, we strongly recommend you copy the Pivaders code in this tutorial
    into your own program. It''s great practice and gives you a chance to tweak elements
    of the game to suit you, be it a different image, changing the difficulty or the
    alien waves behave. If you just want to play the game, that''s easily achieved
    too, though. Either way, game''s only dependency is Pygame (if it isn''t already)
    can be installed from the terminal:


    Once we''ve merged it Perfect for modules we need for the project; there''s a
    quick list of block capitals. That variables are constants (global variables).
    These are important variables that never change—things related to the code, like
    colours, block sizes and resolution. You''ll also notice that colours contains
    multiple numbers in brackets—these are tuples. You could use square brackets (to
    make them list), but we use tuples here since they represent which means you can''t
    assign individual items within the perfect. For constants, aren''t designed to
    change anyway.


    ```

    sudo apt install python-pygame

    ```


    # Installation


    For Pivaders we''ve used Git, a brilliant form of version control to safely store
    the game and retain historical versions of your code. Git is already installed
    on your Pi you can access it by:


    ```

    sudo apt-get git

    ```


    As a matter for your code, Git allows you to clone copies of other''s projects
    you can work on, or just use them. Clone Pivaders, go to your home folder in the
    terminal (cd -), make a directory for the project (mkdir pivaders), enter the
    directory (cd pivaders) and:


    ```

    git clone https://github.com/rub78/pivaders

    ```


    # Testing Pivaders


    # Classes – part 1


    With Pygame and the cloned project to machine (you can also find the zip on this
    issue''s cover DVD – simply unpack it and copy it to your home directory to),
    you can take it for a quick test to make sure everything''s set up properly. You
    will need to type pivaders.py from within the folder in the terminal to get started.
    You can start the game with the space bar, with the same button and use the left
    and right arrows on your keyboard to move your shift left and right.


    A class is essentially a blueprint for an object''s you might like to make. In
    the case of our player, which contains all the required info, from which we can
    make multiple copies (we create a player instance in the make_player method through
    the project); The great thing about classes in Pygame is that they inherit capabilities
    and features from Pygame''s sprite class, as denoted by the pygame.sprite. Sprite
    found within the braces of the first line of the class. You can read the docs
    to learn more about the Sprite class via www.pygame.org/docs/ref/sprite.html.


