  md: "# Introducing Python\n\n50 Python tips\n\n![](img/c72194f2c3aec198936695a665a5167c_39_0.png)\n\
    \n# 50 Python tips\n\nPython is a programming language that lets you work more\
    \ quickly and integrate your systems more effectively. Today, Python is one of\
    \ the most popular programming languages in the open source space. Look around\
    \ and you will find it running everywhere, from various configuration tools to\
    \ XML parsing. Here is the collection of 50 gems to make your Python experience\
    \ worthwhile...\n\n# Basics\n\n# Running Python scripts\n\n+   01 On most of the\
    \ UNIX systems, you can run Python scripts from the command line.\n$ python myprogram.py\n\
    \n# Running Python programs from Python interpreter\n\n+   02 The interactive\
    \ interpreter makes it easy to try your first steps in programming and use all\
    \ Python commands. You just issue each command one by one, and the result is immediate.\n\
    Python interpreter can be started by using the command:\n$ python\nKunal@ubuntu:~$\
    \ Python 2.6.2 (release-2$main, Apr 19 2009, 01:56:41) [GCC 4.3] on linux\nType\
    \ \"help\", \"copyright\", \"credits\" or \"license\" for more information.\n\
    >>> commands here>>\nIn this article, all the code\n>>> symbol is meant to be\
    \ given\n\n# at the Python prompt.\n\nIt is important to remember that Python\
    \ takes very seriously—if you are receiving any error that, correct the tab spacing.\n\
    \n# Dynamic typing\n\n+   03 In Java, C++, and other statically typed languages,\
    \ you must specify the type of return value for each argument. On the other hand,\
    \ Python is a dynamically typed language. In Python you will never have to specify\
    \ the type of any value you use. Based on that, Python will automatically keep\
    \ track of the data type.\n\n# Python statements\n\n+   04 Python uses carriage\
    \ to separate statements, a colon and indentation to separate code blocks. Most\
    \ of the compiled languages, such as C and C++, use semicolons to separate statements\
    \ and brackets to code blocks.\n\n# == and = operators\n\n+   05 Python uses '=='\
    \ for comparison and '!=' for\n\n# Concatenating strings\n\nassignment: Python\
    \ does not support inline assignment, so there's no chance of accidentally assigning\
    \ the value when you actually want to compare it.\n\n+   06 You can use ' +' to\
    \ concatenate strings.\n>>> print 'kunal'+'al'\nkunal\n\n# The __init__method\n\
    \n+   07 __init__ method is run as soon as an object of a class is instantiated.\
    \ The method is used to do any initialization you want to your object:\n__init__\
    \ is similar to a constructor in C++ or Java.\n\nExample:\n\n```\nClass:\n   \
    \ def __init__(self, name):\n        self.name = name\n    def hi(self):\n   \
    \     print 'Hello, my name ' + self.name)\n```\n\n+   is', self.name\np = Person('Kunal')\n\
    p.hi()\nOutput:\n[/usr/bin/python $]\nHello, my name is Kunal"
