  md: '# Use Python with Pi


    # Program a quadcopter


    # Code and reality


    In this case, there are nine PIDs in total. The horizontal plane, for both the
    X and Y axes, the horizontal speed PID converts the user-defined speed to require
    horizontal acceleration/angle of tilt; the angle PIDs then convert the rotation
    that the rotation speed PID converts to changes in speed for forward/back and
    left/right motors.


    headwind will drift backwards towards the force applied to the wind. To compensate
    for this, it must tilt down at some angle so that some of the propellers'' thrust
    is applied horizontally to counteract the wind. In doing so, some of the quadcopter
    hovering at a fixed height is now battling the wind; the overall power is reduced,
    the quadcopter will start drifting.


    In the vertical direction, a single PID converts the rate of ascent/descent to
    the acceleration output applied to each plate. Finally prevention of yaw (like
    a spinning top) uses two PIDs – one to set the desired angle of yaw, and one to
    set the rotation speed. The output of these controls the yaw motors which spin
    in the same direction. The most critical is the pitch/roll stability. This ensures
    that whatever requirements enforced by other PIDs and external factors, the quadcopter
    is stable in achieving those targets; without this stability, the rest of the
    PIDs cannot work. Pitch is controlled by differences between the front and back
    propellers; yaw by left and right directions, and by clockwise/counterclockwise
    differences from the corresponding PID'' outputs. The net of all three PIDs are
    then applied to the appropriate combination of motors'' PWM channels to the individual
    pulse widths.


    Horizontal movement is more complex. The target is to move at 1 metre per second.
    The initial requirement is the headwind compensation – down nose plus increased
    power will apply a force leading to forward acceleration. But once horizontal
    speed is attained, the motor needs to stop or at the same time, friction in the
    air will slow the movement. So there''s a dynamic tilt/aft to maintain this stable
    forward velocity.


    With stability being achieved, some level of take-off, hover and landing achieved
    using the vertical speed PID. Placing the quadcopter on a horizontal surface,
    set the target to 0 m/s and she offs into the air, while the speed PID ensures
    the horizontal angle of take is maintained throughout the short flight, and landing.


    Both-wind suppression and control horizontal movement use some nested PIDs; the
    X and Y axis speed PID inputs are outputs of the forward and roll angle PID targets;
    the output feeds the pitch and roll angle PID to ensure stability while meeting
    the other targets. The sensor feedback ensures that the desired horizontal speed
    is approached, the horizontal speed PID errors shrink, reducing the targets for
    the angular PID, thus bringing the quadcopter back to horizontal again.


    Up to this the PIDs are independent. But what about horizontal movement, and suppression
    of drifting in the wind?


    Hopefully it becomes clearer why accurate angle tracking is: in the nose-down,
    headwind example, the vertical speed PID ensures the sensors are reduced by the
    cosine of the measured angle of tilt with respect to the horizontal.


    This is when get more complicated. Taking the drift suppression first, a quadcopter
    in the


    > Taking the drift suppression first, a quadcopter in a headwind will drift backwards
    towards the force applied by the wind


    Similarly, X and Y axis speed PID inputs compare with pitch and roll angles when
    comparing speeds against acceleration. Don''t forget to check the diagrams in
    the article, clear graphical representations of many of the themes we''re covering.


