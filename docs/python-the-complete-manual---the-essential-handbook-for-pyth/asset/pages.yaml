  md: "# Control an LED using GPIO\n\n# Use Python with Pi\n\n> Did you know...\n\
    The cicial Python docs are a great resource for beginners and professionals alike\n\
    http://python.org/doc.\n\n# Using PWM\n\n20 The next step is to tell the pin to\
    \ output and set a way of escaping our program. Here we call the GPIO class again\
    \ and then the PWM method, passing in the pin number; the second value is the\
    \ frequency in herz – in this case, 05.\n\n```\np = GPIO.PWM(12, 5)\np.start(1)\n\
    input(\"Press return to stop:\")\np.stop()\nGPIO.cleanup()\n```\n\n# Test the\
    \ script\n\n17 Now to make sure the script is imported, we need to run the python\
    \ command and then by the name of the script we created. If all goes well, you\
    \ shouldn't see any error messages. If you do, though, just go back through the\
    \ previous steps to check everything as it should be.\n\n+   - python gpio.py\n\
    \n# Set GPIO mode\n\n18 Reload the script in nano again. We will then set the\
    \ GPIO mode to BOARD. This method is the safest to adopt and whichever revision\
    \ of the Pi you are using. It's best to pick a GPIO convention and stick to it\
    \ because it will cause confusion later.\n\n+   - nano gpio.py\nGPIO.setmode(GPIO.BOARD)\n\
    \n# Adjust PWM\n\n21 To add a time to the LED it fades out, we first need to import\
    \ the library and then set the 12 pin to have 50Hz frequency to start.\n\n```\n\
    import time\nimport RPi.GPIO as GPIO\nGPIO.setmode(GPIO.BOARD)\nGPIO.setup(12,\
    \ GPIO.OUT)\np = GPIO.PWM(12, 50) # channel=1 frequency=50Hz\np.start(0)\n```\n\
    \n# Add the fade\n\n22 Then we will add in another try-except block, this time\
    \ checking what when the LED is at - and once it reaches a certain level, reverse\
    \ the process. To run this code, save it from nano and then python gpio.py.\n\n\
    ```\nwhile 1:\n  for dc in range(0, 101, 5):\n    p.ChangeDutyCycle(dc)\n    time.sleep(0.1)\n\
    \  for dc in range(100, -1, -5):\n    p.ChangeDutyCycle(dc)\n    time.sleep(0.1)\n\
    except KeyboardInterrupt:\n  pass\n```\n\n# Set pin mode\n\n19 A pin has to be\
    \ defined either as an input or output before it can work. This is simplest by\
    \ by calling the GPIO.setup method. Pass in the pin number, and then GPIO, OUT\
    \ or IN. As we want to use an LED as an output. You'll be using these conventions\
    \ frequently, so learn them as best you can before they soak in!\n\n+   - GPIO.setup(12,\
    \ GPIO.BOARD)\n\n> \"We'll set the GPIO mode to BOARD. This will work whichever\
    \ revision of the Pi you are using\"\n\n![](img/c72194f2c3aec198936695a665a5167c_126_0.png)"
