    # Control an LED using GPIO


    An introduction into an external output, such as an LED, on the Pi


    After you have fired up your Pi, may have installed XBMC and had a play around
    streaming, you might be ready for your next challenge. One to go down is to find
    interesting uses for one of the many desktop OSs available for the little computer,
    perhaps using it as a web server, an NAS or retro console. This is all great fun,
    but an often-overlooked feature of the Pi is its hardware pinouts. If you''ve
    never done electronics before, then the Pi is a great place to start. Or you may
    have used a programmable microcontroller such as Arduino in the past; the Pi,
    with its increased CPU and RAM over Arduino, opens up many more possibilities
    for projects.


    The Raspberry Pi features a single PWM (pulse width modulation) output pin, along
    with a series of GPIO (General Purpose Input/Output) pins. These enable electronic
    hardware such as buzzers, lights and switches to be controlled via the Pi. For
    people who are used to either just ''using'' a computer, or only programming software
    that only acts on the machine itself, controlling a real physical item such as
    a light can be a revelation.


    This tutorial will assume no prior knowledge of electronics or programming, and
    will take you the steps needed to control an LED using the Raspberry Pi, from
    setting it up to coding a simple application.


    +   Fig 1: All the items you will need to get adjusting an LED using PWM. The
    wires should have a male and female ends


    ![](img/c72194f2c3aec198936695a665a5167c_123_0.png)


    +   Fig 2: Place the female end onto the Pi, noting pin number 1 is identified
    by the small Pi1: The blue wire is ground


    ![](img/c72194f2c3aec198936695a665a5167c_123_1.png)


    +   Fig 3: Once everything is connected, plug in your USB power cable


    ![](img/c72194f2c3aec198936695a665a5167c_123_2.png)


    +   Fig 4: Switch the power on, The LED will light up. If it''s dim, use a lower-rated
    resistor


    ![](img/c72194f2c3aec198936695a665a5167c_123_3.png)


    > "We’ll take you through the steps needed to control an LED using the Pi, from
    setting it up to coding”


    ![](img/c72194f2c3aec198936695a665a5167c_123_4.png)


    124'
