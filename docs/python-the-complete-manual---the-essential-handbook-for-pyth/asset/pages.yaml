  md: "# # Build tic-tac-toe with Kivy Create with Python\n\nmade these bindings from\
    \ Python (other than that's usage of the 'bind' method used later on), is rarely\
    \ as convenient as referencing the property we want to bind.\n\ndisplay them and\
    \ knows it would automatically arrange them into a grid with number columns we\
    \ set earlier.\n\nNow all have to replace our root widget (returned from 'App.build')\
    \ with a 'TicTacToeGrid' and we can see what our looks like.\n\nLet's populate\
    \ our 'TicTacToeGrid' with 'GridEntry' widgets.\n\n```\nclass TicTacToeGrid(GridLayout):\n\
    \    def __init__(self, *args, **kwargs):\n        super(TicTacToeGrid, self).__init__(*args,\
    \ **kwargs)\n        for row in range(3):\n            for column in range(3):\n\
    \                grid_entry = GridEntry(\n                    coords=(row, column))\n\
    \                grid_entry.bind(on_release=self.button_pressed)\n           \
    \     self.add_widget(grid_entry)\n```\n\n```\ndef build(self):\n    return TicTacToeGrid()\n\
    ```\n\nWith this you can run your Python file again and enjoy your new program.\
    \ All well, the single Label is replaced by a grid of nine buttons, each of which\
    \ you can click (it will automatically change) and you'll see the output information\
    \ from your binding.\n\nWe could customised the appearance by modifying other\
    \ properties of the Button, but now we'll leave them as they are.\n\n```\ndef\
    \ button_pressed(self, instance):\n    print(\\'button clicked!'.format(instance.coords))\n\
    ```\n\nHas anyone won yet?\n'll want to keep track of the state of the board to\
    \ check if anyone has won, which we can do with multiple Kivy properties.\n\n\
    This introduces a new concept: When we instantiated 'GridEntry' widgets, we were\
    \ able to set their 'coords' property by simply passing it as a kw. This is a\
    \ minor feature that is automatically handled by Kivy properties.\n\n```\nfrom\
    \ kivy.properties import (ListProperty, \nNumericProperty)\n```\n\nWe used the\
    \ 'bind' method to call the 'button_pressed' method whenever the 'GridEntry' widget\
    \ dispatches an 'on_release' event. This automatically handled will occur whenever\
    \ a user releases a 'GridEntry' button. We could also bind to 'on_press', which\
    \ is dispatched when the button is first clicked, or to any Kivy property of the\
    \ button, dispatched dynamically when the property is modified.\n\n```\nclass\
    \ TicTacToeGrid(GridLayout):\n    status = ListProperty((0, 0, 0, 0, 0, 0, 0))\n\
    \    current_player = NumericProperty(1)\n```\n\nWe added each 'GridEntry' widget\
    \ to our 'Grid' via the 'add_widget' method. That means each one is a child widget\
    \ of the 'TicTacToeGrid', and so it will\n\nThis adds an status list representing\
    \ who has played, and a number to the current player (1 for 'O', -1 for 'X').\n\
    \nBy placing these in our status list, we'll know if somebody wins the sum of\
    \ a row, column or diagonal will +3. Now we can update our graphical grid when\
    \ a move is played.\n\n![](img/c72194f2c3aec198936695a665a5167c_82_0.png)"
