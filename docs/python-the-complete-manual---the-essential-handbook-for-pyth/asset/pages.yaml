  md: "# Create with Python\n\n# Build tac-tac-toe with Kivy\n\nOur widget: tic-tac-toe\n\
    \nSince Kivy doesn't have a tic-tac-toe, we'll have to make our own! We'll create\
    \ a new widget class to contain this behaviour:\n\nchild widgets. This example\
    \ demonstrates the former, creating a rule for the 'TicTacGrid' widget by declaring\
    \ that every 'TicTacGrid' instantiated should have its 'cols' property set to\
    \ 3.\n\n```\nfrom kivy.uix.gridlayout import GridLayout\nclass TicTacGrid(GridLayout):\n\
    \    pass\n```\n\nWe'll use more layout features later, but for now let's go back\
    \ to Python to create the buttons in your tic-tac-toe grid.\n\nNow this obviously\
    \ doesn't do anything, except that it inherits all the behaviour of the Kivy GridLayout\
    \ widget - that, we'll need to tell it how many columns to have, but then it will\
    \ arrange any widgets to fit nicely as rows. Tic-tac-toe requires three columns\
    \ and nine children.\n\n```\nfrom kivy.uix.button import Button\nfrom kivy.properties\
    \ import ListProperty\n```\n\n```\nclass GridEntry(Button):\n    coords = ListProperty([0,\
    \ 0])\n```\n\nHere we introduce the Kivy language (kv), a special domain-specific\
    \ language for making Kivy trees. It is simple but removes a lot of necessary\
    \ boilerplate for managing the UI with Python code - as an analogy you might think\
    \ of it as HTML/CSS to Python's JavaScript. Python gives us the dynamic power\
    \ to do anything, but all that power gets in if we just want to declare the basic\
    \ structure of our UI. You might never need Kivy language, you can always do the\
    \ same thing in Python alone, but the rest of the way why Kivy programmers usually\
    \ like to use kv.\n\nThis inherits from Kivy's widget, which interacts with mouse\
    \ or touch, dispatching events when they toggle. We can hook into these events\
    \ to call our own functions when a user presses the button, and set the button's\
    \ 'text' property to display the 'X' or 'O'. We created a new Kivy property for\
    \ our widget, 'coords' – we will show how this is useful later on. It's almost\
    \ identical to making a normal Python Attribute by writing self, `coords = [0,\
    \ 0]` in `GridEntry.__init__`.\n\nKivy comes with all the tools needed to use\
    \ kv, the simplest way is to write it in a file with a name based on your App\
    \ class. That is, we should place the following in a file named 'tictacttoe.kv':\n\
    \nAs for 'TicTacGrid', we'll style our new class with kv language, but this time\
    \ we get to see some interesting.\n\n```\n<TicTacGrid:\ncols: 3\n```\n\n```\n\
    <GridEntry>:\font_size: self.height\n```\n\nThis is the syntax of kv language,\
    \ for each widget type we write a rule defining its behaviour, including setting\
    \ its properties and adding\n\nAs before, this syntax defines a rule for how a\
    \ 'GridEntry' widget would be constructed, this setting the 'font_size' property\
    \ that controls the size of the text in the button's label. The extra magic is\
    \ that kv automatically detects that we've referenced the Button's height and\
    \ will create a binding to update this – when an 'GridEntry' height changes, its\
    \ 'font_size' will change so text fits perfectly. We could have\n\n![](img/c72194f2c3aec198936695a665a5167c_81_0.png)"
