  md: '# Use Python with Pi


    # Programming in Python on the Raspberry Pi


    # Performing arithmetic


    The main arithmetic operators in Python are + - / *, the latter two divide and
    multiply respectively. We created three new variables called Number, numberDouble
    and numberSquared. Notice that we didn''t need to specify if they should be decimal
    because Python gives a type to its variables from the type of their initial value.
    The number variable is a decimal type, so all values returned from performing
    arithmetic on that number will also be of a decimal type.


    ```

    # Print the values we just worked out, converting each float value

    # to a string

    print("result of halving: " + str(number))

    print("result of doubling: " + str(numberDouble))

    print("result of squaring: " + str(numberSquared)")

    ```


    # Printing our results**


    +   Now that we have performed our arithmetic, we need to print the results using
    the print function. The print function only accepts values passed to it. This
    means we need to convert each decimal value to a string before they can be printed.
    Using a print statement with nothing between the quotation marks prints one blank
    line. This works because the print function also adds a new line at the end of
    its output unless otherwise, so printing an empty string prints a new line.


    ![](img/c72194f2c3aec198936695a665a5167c_107_0.png)


    The Raspberry Pi takes the "Pi" part of its name from its compatibility with the
    Python programming language


    # Input validation with Loops and If statements


    +   To demonstrate a loop and if statements, we will output a question to the
    user that requires a yes or no answer. We''re going to ask them if they want to
    continue - and we require a lower-case Yes, or a lower-case no. A loop runs until
    a condition is met. In this case, we will create a variable yesOrNo and the loop
    will run while yesOrNo is False. The yesOrNo variable will be a Boolean type with
    a value, or the loop will not run.


    A loop has the format "if condition:" – any code that is part of the loop needs
    to be indented in the lines below the colors. Any code that is not indented will
    not be part of the loop. This is the same for an if statement. The condition is
    checked with the comparison operator ==. A single ==" is an assignment operator
    while a double is a comparison operator. Another comparison operator is !==" –
    which means ‘not equal to’. We create a variable ‘result’, which holds the value
    of the question, do you want to continue? Then we check if result is valid with
    an if statement. Notice the ''!='' operator which allows two conditions to be
    tested if the user inputs yesOrNo to True, which stops the loop on the next run.
    Otherwise, we output an error message and the loop will run again. The user can
    use the Ctrl+C command to exit the terminal at any time.'
