  md: '# Use Python with Pi


    # Program a quadcopter


    ![](img/c72194f2c3aec198936695a665a5167c_117_0.png)


    Above Kits are available as ready-to-fly (RTF) if you just want the joy of flight,
    but where the challenge lies is building. We started with an almost ready-to-build
    (ARF) kit—the hardware, the DJI Flame Wheel F450—all the, but not the control
    electronics or software. Many DIY quad enthusiasts have used Arduino to build
    what was possible, but very few, if any, successfully used the Raspberry Pi


    # Angles


    04 Both the accelerometer and gyro can provide this angle information, but both
    have flaws. The accelerometer output can be used to calculate the angle using
    the Euler algorithm. However, the accelerometer output is plagued by noise from
    the motors/propellers, meaning a single reading can be huge on the plus side,
    the average reading remains inaccurate over time.


    In contrast, the gyro-output does not suffer from the noise, but since it is an
    angular sensor, it needs to be integrated over time to find the absolute angle
    of the quadcopter in comparison to the horizon. Rounding errors lead to ever increasing
    errors over time, ultimately limiting the maximum length of a flight.


    # Filter


    05 Although they are both flawed, they can be merged mathematically such that
    each compensates for the flaws in resulting in a noise-free, long-term accurate
    reading. There are many versions of these mathematical noise/drift filters. The
    best common one is Kalman: which is slightly less accurate, but easier to understand
    and refine to code the እንደሚ filter:


    With an angle in hand, it is possible to convert sensor data to inputs relative
    to the Earth''s axes and work out how the quadcopter is moving up, down, left,
    right and forwards and backwards compared to the targets that have been set.


    You can buy Ready To Fly (RTF) quadcopter kits from a lot of online retailers.
    Prices start from £150 / $200, but rise quickly!'
