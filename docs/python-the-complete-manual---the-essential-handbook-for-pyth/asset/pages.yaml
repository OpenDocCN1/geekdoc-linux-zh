  md: "# # Scrape Wikipedia with Beautiful Soup\n\n# # Tying loose ends\n\n08 After\
    \ our script has iterated through every link on every page to the maximum level\
    \ of depth that it can, it will try to exit. On line 34 of the code (on the disc\
    \ and online) in the init function, we registered the function cleanUp to execute\
    \ on the program exit; cleanUp job is to go through the documents we downloaded\
    \ and check every link we've left in the pages does in fact link to a file that\
    \ we have available. If it can't match the link in the file to the addresses list,\
    \ it will remove it. Once we're done, we will have a fully portable chunk of Wikipedia\
    \ we can take with us.\n\n06 Copy to file After that, we take the content we parsed\
    \ and put into a brand new HTML file\n\n```\ndoctype = \"!DOCTYPE html\"\nhead\
    \ = \"<head<meta charset='UTF-8'/\\></title>\" + fileName + \"</title>\"\nf =\
    \ open(storeFolder + \"/\" + fileName.replace('_', '_') + \".html\", 'w')\nf.write(doctype\
    \ + \"<html>\\n\" + head + \"<body><h1>\" + content + \"</h1></body></html>\"\
    )\nf.close()\n```\n\n```\nndef cleanup(soup):\n    print(\"nRemoving links to\
    \ pages that have not been saved\\n\")\n    for deepPage in deepestAddresses:\n\
    \        rf = open(storeFolder + \"/\" + deepPage, 'r')\n        deepSoup = BeautifulSoup(rf.read(),\
    \ 'html5lib', from_encoding='UTF-8')\n        for link in deepSoup.find_all('a'):\n\
    \            pageStored = False\n            for addr in addresses:\n        \
    \        if addr == link:\n                    pageStored = True\n           \
    \ if pageStored == False:\n                if '#' is not in link:\n          \
    \          del deepLinks[link['href']]\n                elif '#' in link and len(link.split('#'))\
    \ > 1 or ':' in link:\n                    del deepLinks[link['href']]\n     \
    \       wf = open(storeFolder + \"/\" + deepPage, 'w')\n            wf.write(deepSoup)\n\
    \            wf.close()\n```\n\n07 Clean up Once every page has been parsed and\
    \ stored, we will go through and try to remove any dead links\n\n08 Initialise\
    \ This is how we will initialize our script\n\n```\nprint(\"Complete\")\nif __name__\
    \ == \"__main__\":\n    init()\n```\n\n![](img/c72194f2c3aec198936695a665a5167c_76_0.png)"
