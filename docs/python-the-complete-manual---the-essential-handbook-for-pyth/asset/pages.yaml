    future projects


    This tutorial follows on from the one last issue: ''Setting up the Raspberry Pi'',
    where we showed how to prepare your SD card for use with the Raspberry Pi. The
    beauty of using an SD card image is that the operating system is ready to go and
    a development environment is already configured for us. We''ll use a lightweight
    integrated development environment (IDE) called Gearany for our Python development.
    Gearany provides a friendlier interface compared text-based editors such as nano
    to make it easier to get into the swing of things. This tutorial will cover topics
    such as:


