    # # Make a visual novel game


    Bridge the gap between books and videogames creating an interactive novel with
    Python


    Most people look for a compelling story in modern videogames, and those that don''t
    have one appearing less and. A great way to tell a pure story through the genre
    of visual novels, and you can make one fairly simply in Python. These interactive
    novels are an extremely popular form of entertainment in Japan, and usually work
    by having the player click through a story and make decisions as they go along
    in order to experience different plot points and endings.


    In Python, this is a relatively simple project to create, but with the addition
    of the Pygame module we can make it easier still, and even expandable for the
    future. Pygame adds better support for positioning the images and text, creating
    display windows and mouse and keyboard inputs, thereby simplifying the coding
    process.


    We''ll be coding this in standard Python 2, so make sure to run it in IDLE 2 and
    not IDLE 3 while you are writing, testing and coding.


    ![](img/c72194f2c3aec198936695a665a5167c_97_0.png)'
