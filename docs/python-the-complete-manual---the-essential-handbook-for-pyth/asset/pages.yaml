    \ \"__main__\":\n    TicTacToeApp().run()\n```\n\nYou can easily run this, your\
    \ app will start up and\nyou'll get a plain black window. Exciting!\nWe can build\
    \ our own GUI out of Kivy widgets.\nEach is a simple graphics element with\nspecific\
    \ behaviour of its own ranging from\nstandard GUI functionality (eg the Button,\
    \ Label\nor TextInput), to those positioning on\nchild widgets (eg the BoxLayout,\
    \ Floating\nor GridLayout), to abstracting a more\ninvolved task like interacting\
    \ with hardware (eg\nTheFileChooser, Camera or VideoPlayer). Importantly, Kivy's\
    \ widgets are designed to be easily\ncombined - than including including widget\
    \ for every\nneed imaginable, widgets are kept simple but\neasy to join new interfaces.\
    \ We'll see some\nof that in this tutorial.\n\n![](img/c72194f2c3aec198936695a665a5167c_80_0.png)\n\
    \n```\ndef build(self):\n    return Label(text='Hello World!',\n             \
    \    font_size=100,\n                 color=(r, g, b, a))\n```\n\nThe 'build'\
    \ method is called when the 'App' is,\nand whatever is returned automatically\n\
    the root of App. In our case\nthat's a Label, and we've set several properties\
    \ - the\n'text', 'font_size' and 'color'. All widgets have different\nproperties\
    \ controlling aspects of their behaviour\nwhich can be dynamically updated to\
    \ their\nappearance, here we see them just once\\upon instantiation.\n\nSince\
    \ 'Hello World' is compulsory in any\nprogramming tutorial, let's get it over\
    \ by using a\nsimple 'Label' widget to display the:\n\n+   - Note that properties\
    \ are not just Python\nattributes but inside Kivy properties. These are\naccessed\
    \ like normal attributes but provide extra\nfunctionality by hooking into Kivy's\
    \ event system.\n- We'll see examples of creating properties, and\nyou should\
    \ do the same if you want to use your\nvariables with Kivy's event and binding\
    \ functionality.\n- All you need to show some simple text, so\nrun the program\
    \ again to check that this works.\nYou experiment with the parameters if it's\
