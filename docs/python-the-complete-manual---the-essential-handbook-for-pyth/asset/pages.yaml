    \    print(str(ints[count]))\n    count += 1\n```\n\n# More about a Python list\n\
    \nA Python list is similar to an array in other languages. A list (or tuple) can\
    \ contain data types, which is not usually the case with arrays in other languages.\
    \ For this reason, we recommend that you only store data of the same type in a\
