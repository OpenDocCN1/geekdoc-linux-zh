    \        if self.alien_pos < 9:\n            self.alien_explosion_graphics = self.alien_explosion_sheet.subsurface(self.alien_pos*96,\
    \ 94, 96)\n            self.alien_pos += 1\n            self.screen.blit(self.alien_explosion_graphics,\
    \ [int(self.explode_alien[0]) - 50, int(self.explode_alien[1])])\n        else:\n\
    \            self.alien_explode = False\n            self.explode_alien = []\n\
    \n```\n\nPygame makes easy to add a suitable piece of music to your preferred\
    \ format (we used from freesound.org) and load it using the Pygame class. As it\
    \ is already playing, we can only load via pygame. The music.play() requests that\
    \ the music start with and continue until it quits. If replaced with -1, the music\
    \ would loop five times before ending. Learn more about the Mixer class via www.pygame.org/docs/ref/mixer.html.\n\
    \n```\ndef splash_screen(self):\n    while Game.state_start:\n        self.screen.blit(self.intro_screen,\
    \ (0, 0))\n        \"PIVADERS\", 1, (265, 120)\n        self.screen.blit(self.intro_font.render(\n\
    \            \"PRESS SPACE TO START\", 1, (255, 191)),\n            pygame.display.flip())\n\
    \        self.event()\n        self.clock.tick(self.refresh_rate / 2)\n\n```\n\
    \n# Using sound effects\n\nLoading and using is similar to how we do for images\
    \ in Pygame. First we load the sound effect using a simple assignment. For the\
    \ laser beam, the initialization looks like this\nself.bullet_fx = pygame.mixer.Sound('location/of/file')\n\
    Then we trigger the sound effect at the appropriate time. In the case of the laser,\
    \ we want to play it when we press the space bar to shoot, so we place it in the\
    \ Game class's Control method, after we raise the shoot_bullet_flag. You can get\
    \ different sounds from www.freesound.org.\n\n```\ndef make_player(self):\n  \
    \  self.player = Player\n```\n\nFind the rest of the code at github.com/russb8/pivaders\n\
    \n> \"Sprite sheets make easy to draw to the screen, but it also keeps the asset\
    \ count down and performance levels\""
