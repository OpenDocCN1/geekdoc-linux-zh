  md: "# Introducing Python\n\n# 50 Python tips\n\n# Accessing the Python documentation\
    \ server\n\n# Converting from integer to binary and more\n\n# Detecting system\
    \ platform\n\nYou can start an HTTP server on the given point out will give you\
    \ a nice-looking access to all Python documentation, including third-party module\
    \ documentation.\n\nPython provides easy-to-use functions—bin(), hex() and oct()\
    \ to convert from integer to binary, decimal and octal format respectively.\n\n\
    To execute platform-specific functions, it is very useful to detect the platform\
    \ on which the Python interpreter is running. You can use 'sys.platform' to find\
    \ out the current platform.\n\n# 17\n\n# 20\n\n# 24\n\n```\n$ python -p <pythonNumber>\n\
    ```\n\nExample:\n\n```\n>>> bin(24)\n'0b110000'\n>>> hex(24)\n'0x18'\n>>> oct(24)\n\
