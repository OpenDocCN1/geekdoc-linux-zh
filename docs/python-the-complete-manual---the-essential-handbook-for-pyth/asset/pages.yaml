  md: "# Build an app for Android with Python\n\n# Introducing Python\n\ntake this\
    \ opportunity to do the same for the other widgets as well (Fig. 05).\n\npositions\
    \ and carrying out logic – in this case collisions with the ball (Fig. 06).\n\n\
    ```\nif scancode == 275:\n    self.direction = 'right'\nelif scancode == 276:\n\
    \    self.direction = 'left'\nelse:\n    self.direction = 'none'\n```\n\nThis\
    \ takes care of keeping all our game widgets positioned and sized in proportion\
    \ to the Game containing. Notice that Player and Ball use to the properties we\
    \ set earlier, we'll be able to move them by just setting these properties and\
    \ letting kv automatically update their positions.\n\nThe Clock can schedule any\
    \ function at any time, either once or repeatedly. A function scheduled at interval\
    \ automatically retrieves its since call (dt here), which we've passed through\
    \ the ball and player via the references we created in kv language. It is good\
    \ practice to scale the (eg ball movement) by this dt, so things remain even if\
    \ something interrupts the clock and updates don't meet the regular /60 FPS.\n\
    \n```\ndef on_key_up(self, args):\n    self.direction = 'none'\n```\n\nThe Ball\
    \ also uses entry to remain square rather than rectangular, just because the alternative\
    \ would look like a bit odd.\n\n```\ndef update(self, dt):\n    dir = {'right':\
    \ 1, 'left': -1}\n    self.position.x += (50 * dt * dir[self.direction])\n```\n\
    \nWe've now almost finished the basics of our app! All that remains to add a Ball\
    \ and a Player widget to the Game.\n\nThese_touch_functions for interacting with\
    \ touch or mouse input, are automatically called when the input is detected and\
    \ you can do anything you like in response to the touches. In this case we set\
    \ the Player's direction in response to keyboard and touch/mouse input, and use\
    \ this method to move the Player when its update method is called. We can also\
    \ add rich behaviour (Fig. 07).\n\n```\nBall:\nid: self_ball\nPlayer:\nid: self_player\n\
    ```\n\nAt this point we have added the first step towards handling keyboard input,\
    \ by binding to the kv window to call a method of the Player every time key is\
    \ pressed. We then finish off the Player class by adding this key handler with\
    \ touch/mouse input.\n\nYou can run the game again and should be able to see all\
    \ the graphics working properly. Nothing moves yet, but that the FloatLayout everything\
    \ remain in position if you resize the game/window.\n\n```\nclass Player(Widget):\n\
    \    def on_touch_down(self, touch):\n        self.direction = (\n           \
    \ 'right' if touch.x > self.parent.center_x else\n            'left')\n```\n\n\
    Now we have to add the game mechanics. For a game like this usually want to run\
    \ some update function many times per second, updating the widget\n\n```\ndef\
    \ on_touch_up(self, touch):\n    self.direction = 'none'\n```\n\n```\ndef on_key_down(self,\
    \ keypress, scancode, args):\n```\n\n![](img/c72194f2c3aec198936695a665a5167c_34_0.png)"
