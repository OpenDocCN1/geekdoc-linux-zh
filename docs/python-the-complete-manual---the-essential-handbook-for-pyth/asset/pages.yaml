  md: "# Use Python with Pi\n\n# Control an LED using GPIO\n\n# Wiring the board\n\
    \nPlug one wire into the number 1 pin, and the other end into the breadboard.\
    \ It doesn't matter where on the breadboard you plug it, but make sure there are\
    \ empty slots around it to add the LED and resistor. Now get another wire\n\n\
    # Set up programming environment\n\nNow, we need to be able to do a little more\
    \ than just turn a light on - we want to be able to control it via code. Set up\
    \ new Raspberry installation (a guide to this is on page 28). You don't need a\
    \ GUI for this - it can be done via the terminal if you wish. It's best to check\
    \ everything is up to date:\n\n```\nsudo apt-get dist-upgrade\n```\n\n# Open up\
    \ terminal\n\n# Add another wire\n\nPlace the end of the wire into pin number\
    \ 6 (ground) and the other end to the breadboard, making sure to leave room for\
    \ the resistor, depending on how large it is. Get your resistor ready. You can\
    \ use a larger or lower than 270 ohms, but not using a resistor that will likely\
    \ blow the LED.\n\nAssuming we want to use the GUI, rather than SSH into the Pi,\
    \ open up a new terminal window by double-clicking on the Terminal icon. Need\
    \ root access to the LEDs, so enter sudo, or prefix every command with sudo\n\n\
    +   - followed by password\n- sudo\n- to the start of each command.\n\n# Download\
    \ GPIO library\n\nThere is a handy GPIO Python library that makes manipulating\
    \ the GPIO pins a breeze. From within the terminal, use wget to download the tar\
    \ file; extract it to get all the files in a new directory.\n\n```\nwget https://raspberrypi.org/source/RPI.GPIO/RPI.GPIO-0.5.2a.tar.gz\n\
    tar tar RPI.GPIO-0.5.2a.tar.gz\ncd RPI.GPIO-0.5.2a\n```\n\n# Add the resistor\n\
    \nNext we need to add resistor next to the ground wire on the breadboard, and\
    \ the other end slot the 3v3 wire all to the LED when we add it in a second. Note\
    \ that there is no correct or incorrect way to add a resistor.\n\n# Install the\
    \ library\n\n# Add the LED\n\nGrab your LED and place the 'bent' leg to the 3v3\
    \ wire in the breadboard. Place the other leg to the resistor opposite the ground\
    \ wire. This completes the circuits and we are ready to test out our little\n\n\
    Now we need to install the library. This is a simple case using Python's install\
    \ method so we need the dev version of Python. Make sure you are in the directory\
    \ of the library before running command\n\n```\nsudo apt-get python-dev\nsudo\
    \ python setup.py install\n```\n\n# Import the library in a script\n\n# Power\
    \ it up\n\nNow get your micro-USB script and plug the main pins into the wall,\
    \ or plug it into a computer or laptop (port powered on). You should see the LED\
    \ light up. If not, check your connections on the breadboard or Pi, or try a different\
    \ LED.\n\nCreate a new Python script. Next import the main GPIO library and we'll\
    \ put it in a try-block. Save the file using Ctrl+X and choosing 'yes'.\n\n```\n\
    cd /\ncd Desktop\nsudo nano gpio.py\ntry:\n    import RPI.GPIO as GPIO\nexcept\
    \ RuntimeError:\n    print(\"Error importing GPIO lib\")\")\"\n```\n\n![](img/c72194f2c3aec198936695a665a5167c_125_0.png)"
