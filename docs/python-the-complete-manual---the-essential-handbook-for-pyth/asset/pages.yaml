  md: "# Create with Python\n\n# Build tic-tac-toe with Kivy\n\n```\ndef button_pressed(self,\
    \ button):\n    player = {'O': 'O', 'X': 'X'}\n    colours = {1: (1, 0, 0), -1:\
    \ (0, 1, 0)}\n    # (r, g, b, a)\n\n    row, column = button.coords\n\n    status_index\
    \ = 3*row + column\n    already_played = self.status[status_index]\n\n    if not\
    \ already_played:\n        self.status[status_index] = self.current_player\n \
    \       button.text = {'O': 'O', 'X': 'X'}[self.current_player]\n        button.background_color\
    \ = colours[self.current_player]\n        self.current_player *= -1\n```\n\n```\n\
    def on_status(self, instance, new_value):\n    status = new_value\n\n    sums\
    \ = [sum(status[0:3]), # rows\n               sum(status[3:6]),\n            \
    \   sum(status[6:9]),\n               sum(status[0::2]), # columns\n         \
    \      sum(status[1::2]),\n               sum(status[::2]), # diagonals\n    \
    \           sum(status[2::::-2])]\n\n    if 3 in sums:\n        print('Os win!')\n\
    \    elif -3 in sums:\n        print('Xs win!')\n    elif 0 not in self.status:\
    \ # Grid full\n        print('Draw!')\n```\n\nYou can run this app to see exactly\
    \ what this did, and you'll find that clicking each button places an 'O' or 'X'\
    \ as well as a coloured background depending on whose turn it is. Not only that,\
    \ but you can only play one move in each button that our status keeps track of\
    \ the existing moves.\n\nThis is enough to play the game but there's one vital\
    \ element missing, a big pop-up telling you when you won! Before we do that, we\
    \ need to add some code to check if the game is over. Kivy properties have another\
    \ useful feature here, whenever they change it automatically calls an '_property'\
    \ method if it exists and dispatches a corresponding event in Kivy's event system.\
    \ That makes it easy to write code that will run when a property changes, both\
    \ in Python and kv language. In our case we can use it to check the status list\
    \ every time it is updated, something special if a player has filled a column,\
    \ row or diagonal.\n\nThis covers the basic detection of a win or draw, but only\
    \ prints the result to stdout. In this stage we probably want to reset the board\
    \ so that the players can try again, displaying a graphical indicator of the result.\n\
    \n```\ndef reset(self, *args):\n    self.status = [0 for _ in range(9)]\n\n  \
    \  for child in self.children:\n        child.text = \"\"\n        child.background_color\
    \ = (1, 1, 1, 1)\n\n    self.current_player = 1\n```\n\nFinally, we need to modify\
    \ the '_status' method to both reset the board and display the winner in a 'ModalView'\
    \ widget.\n\n```\nfrom kivy.uix.modalview import ModalView\n```\n\n![](img/c72194f2c3aec198936695a665a5167c_83_0.png)"
