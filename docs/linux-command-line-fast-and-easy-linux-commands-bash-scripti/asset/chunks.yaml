  trans: '

    其中 `filename` 是文件的名称。我将文件命名为 `myfile`。按下回车键后，将打开 `vi` 编辑器。现在你可以向文件中添加任意的文本。请注意，要从
    `vi` 编辑器的命令模式切换，你必须按下字母 `i`，否则你将无法向文件中添加任何文本。


    文本内容如下：


    Linux 命令行是程序员来说中一个非常强大的工具。

    通过它可以实现很多功能。


    然后，你可以将文件保存到你可以方便访问的地方，例如桌面。在 `vi` 编辑器中，只需按下 `Esc` 键然后输入 `wq` 即可。这将保存文件。


    在命令行中，输入以下命令然后按回车键：


    ```

    cat myfile

    ```


    按下回车键后，你在文件中添加的文本将显示在标准输出上。如下图所示：


    ![](img/00001.jpeg)


    这表明 `cat` 命令用于在标准输出上显示文件的内容。然而，请用它来显示短文件的内容。


    ## 更改目录


    有时，你可能需要更改工作目录。可以通过终端使用 `cd`（更改目录）命令来实现，如下所示：


    ```

    cd /home

    ```


    上面的命令将工作目录更改为 home 目录，由于使用了正斜杠，它是相对于根目录的，即 `/`。无论当前的工作目录是什么，上述命令都将执行。输入以下命令：


    ```

    cd httpd

    ```


    在按下回车键后，完整的工作目录将变为 `/home/httpd`，这意味着我们已经切换到了 `httpd` 目录，但相对于 `/home` 目录。要切回用户的家目录，请使用以下命令：


    ```

    cd ~

    ```


    用户的家目录是 `/home/username` 目录，其中 `username` 是你在计算机上使用的名称。注意，我们使用了符号 `~`，它被称为波浪号。在
    Linux 中，它象征着用户的家目录。


    ## 复制文件


    在 Linux 中，`cp`（copy files）用于复制文件。在复制过程中，会在指定位置创建一个原始文件的副本，这意味着初始文件不会被删除。要为文件 `myfile`
    创建一个副本，请运行以下命令：


    ```

    cp myfile myfile2

    ```


    上面的命令将创建文件 `myfile` 的副本并将其命名为 `myfile2`。这两个文件将非常相似，但命名有所不同。然而，运行上述命令是有风险的，因为如果目录中已经存在文件
    `myfile2`，它将在不发出警告的情况下被覆盖。为了这个问题，应该使用如下所示的 `-i` 选项：


    ```

    cp –i myfile myfile2

    ```


    如果文件 `myfile2` 已经存在于目录中，在覆盖它之前会收到警告，这是一个非常好的主意。


    你可能需要将某个目录中包含的所有文件复制到另一个目录。可以使用以下命令完成：


    ```

    cp –dpr originaldirectory finaldirectory

    ```


    文件将从 `originaldirectory` 复制到 `finaldirectory`。它们不会从后者中删除。`-dpr` 选项非常重要，因为它起到了以下作用：


    - `-d-` 用于保留链接。

    - `-p-` 用于保留文件属性。

    - `-r-` 用于递归复制。


    如果你不指定上述选项，则将应用默认选项。这不建议这样做，因为你可能需要保留链接和文件属性，而默认选项可能无法完成这些操作。


    每个挂载的文件系统都占用了磁盘上的一些空间。要此每个文件系统的空间大小，请使用命令：


    ```

    df

    ```


    ## less 命令


    此命令与“more”命令几乎相似，区别在于，使用此命令时你可以通过文件向上和向下移动页面。考虑下面的命令：


    ```

    less myfile

    ```


    按下回车键后，文件 `myfile` 的内容将显示出来。


    ## ln 命令


    要为你的文件创建符号链接，请使用 `ln` 命令。输入下所示命令：


    ```

    ln –s myfile mlink

    ```


    上面的命令将创建一个名为 `mlink` 的符号链接以链接到文件 `myfile`。要显示两个文件不同且包含不同的索引节点（inodes），请使用命令


    ```

    ln –i myfile mlink

    ```


    ## locate 命令


    如果你需要在数据库中进行搜索，请使用 `locate` 命令。考虑下所示命令：


    ```

    slocate –u

    ```


    该命令将创建一个数据库并将其命名为 `slocate`。问题是该过程可能需要很长时间，因此需要耐心。但该命令是重要的，因为在没有运行它之前你就无法搜索文件。听过
    `cron` 吗？它被用于调度任务。它会定期运行上述命令，因此你可能不需要手动执行。输入下所示命令并运行它：


    ```

    locate whois

    ```


    上面的命令将搜索你系统中包含的所有名称中包含“whois”字符串的文件。


    ## logout 命令


    此命令仅注销当前登录的用户。打开终端并输入以下内容：


    ```

    logout

    ```


    一旦你输入了上述命令，只需按下回车键。你会发现你已注销系统，然后将回到登录界面。


    ## ls 命令


    此命令用于列出当前登录的用户（注：此处应为文件）。使用此命令列出特定目录包含的文件，`ls` 意味着列出。该命令有许多相关选项需要理解。输入下所示命令并按下回车键：


    ```

    ls

    ```


    该命令将列出当前目录包含的文件。


    ![](img/00002.jpeg)


    上面的图显示了目录中包含的文件。然而，如果该目录包含以点（`.`）开头的文件，使用此命令将无法无法列出。假设你想知道文件的大小、创建日期以及相关的权限，你可以通过以下命令实现：


    ```

    ls –al

    ```


    ![](img/00003.jpeg)


    如你在图中所示，输出更加详细。第一部分以“d”或“-”开头，其中“d”表示目录，而“-”表示这是一个文件。`rwx` 代表权限，其中 `r` 代表读取权限，`w`
    代表写入权限，而 `x` 表示执行权限。文件的大小和创建日期也可见。


    ## more 命令


    使用此命令，文件的内容将发送到屏幕上。这将按页的方式进行。该命令也适用于管道输出。


    输入并运行下所示命令：


    ```

    more /etc/profile

    ```


    上面的命令将输出 `/etc/profile` 文件的内容。该文件包含了有关系统的详细信息。按下回车键后，输出如下所示：


    ![](img/00004.jpeg)


    注意，这是一个内置文件，它随操作系统自带。该文件还包含大量内容，无法在一个页面显示完。通过上述命令，这些内容将逐页显示。输入并运行下面的命令：


    ```

    ls –al | more

    ```


    输出将是该目录包含的文件。这些输出将通过管道传递给 `more` 命令。由于输出很大，它将逐页列出。


    ## mv 命令


    `mv` 命令用于移动或重命名文件，`mv` 代表移动。输入下所示命令：


    ```

    mv –i myfile file

    ```


    上面的命令将文件 `myfile` 重命名为 `file`，这意味着它已被移动。这是在 Linux 中重命名命名文件最简单的方法。考虑以下命令：


    ```

    mv /directory1/myfile

    ```


    上面的命令将文件 `myfile` 从目录 `/directory1` 移动到当前工作目录中。这非常简单，并展示了 `mv` 命令的功能。


    '
- fmt: '

    The question is, what is working directory? This is the directory you are currently
    working in. To know the directory you are working in, use the following command:


    ```

    pwd

    ```


    Just press the enter key as usual. The output will be the directory you are working
    on. This command is used for that purpose in case you don’t know the directory
    you are in. `pwd` means print working directory.


    ## shutdown command


    Use this command whenever you want to shut down your system. Run the command shown
    below:


    ```bash

    shutdown –h now

    ```


    On running the above command, you will notice that the system will halt immediately,
    that is, it will shut down. Consider the next command:


    ```bash

    shutdown –r now

    ```


    The above command shuts down the system and then boots it again, meaning that
    it is used to reboot the system.


    You might need to check the commands which you have run previously. The reason
    might be that you have changed something and now you want to undo the change.
    To see the list of these commands, run the `history` command as shown in the figure
    below:


    ![](images/00005.jpeg)


    The above figure shows the commands which I have run recently.


    ## sudo command


    `sudo` stands for super user do. With this command, any user can execute his or
    her commands as a super user. The `sudoers` file defines all this. Sensitive commands,
    especially those which alter the file systems of the Linux OS can only be executed
    using this command. The `su` command enables you to login as a super user while
    the `sudo` command borrows the privileges of a super user.


    To update the system, you must use the `sudo` command as shown below:


    ```bash

    sudo apt-get update

    ```


    If this is the first time for you to run the command, you will be prompted to
    enter the `sudo` password. To run the above command, you must be connected to
    the internet, otherwise, you will get an error. In Linux, the updates are fetched
    from what we call repositories. This is where the Linux development team uploads
    any latest updates regarding to various ditros of Linux.


    To upgrade the system, run the following command:


    ```bash

    sudo apt-get upgrade

    ```


    The above command will upgrade the version of OS that you are using on your system.
    Again, you must be connected to the internet. Notice that in Red Hat Linux, this
    command is substituted by the `yum` command, so the `sudo` command is not supported
    in Red Hat Linux.


    mkdir command


    `mkdir` stands for make directory. It is used for creating new directory. If the
    folder representing the directory is in existence, you will get an error informing
    of the same. Let me create a directory and call it myfiles.


    ```bash

    mkdir myfiles

    ```


    The above command shows that I will create a directory named `myfiles`. This can
    be illustrated in the figure shown below:


    ![](images/00006.jpeg)


    Notice after creating the directory then I use the `list` command, the directory
    will be listed in the available directories. This shows that it has been created.
    If the above command fails to run, precede it by the `sudo` command and provide
    for the password if prompted to do so.


    ## cal command


    This command shows the month of a particular year. This year can be the current
    one, the past or even the advancing one. Just open the command prompt and type
    the command `cal`. Press the enter key:


    ![](images/00007.jpeg)


    As seen, it shows the date of the day, and it is correct. Now, let us show the
    month May of the year 1980, which is a past year:


    ![](images/00008.jpeg)


    You can also show the month a future year as shown below:


    ![](images/00009.jpeg)


    ## date command


    In case you need to display the current time and date, use this command as shown
    below:


    ![](images/00010.jpeg)


    On executing the `date` command, the current date and the time will form the output
    as shown in the figure above. However, you might find that the date on your system
    is wrong.


    It is possible to set it via the command line as shown below:


    ```bash

    date –set=''1 April 2015 19:30''

    ```


    Once you have run the command shown above, the date will be set to 1st April 2015
    and the time will be set to 19:50 hours.


    ## grep command


    Sometimes, you might need to search for a pattern or a string from a certain file.
    In most cases, the various Distros of Linux come installed with this command.


    However, it is also possible to install it in case you find it not installed using
    the following command:


    ```bash

    sudo apt-get install grep

    ```


    If you are using Red Hat, install it using the command:


    ```bash

    yum install grep

    ```


    Remember that we created our file and named it `myfile` with the following content:


    ![](images/00011.jpeg)


    We want to search through it using the `grep` command. To search for the word
    `powerful` in the file, the following approach should be used:


    ```bash

    grep ‘powerful’ myfile

    ```


    This is illustrated using the figure shown below:


    ![](images/00012.jpeg)


    The command outputs the line of the file with the search word and makes the search
    word red in color. This differentiates it from the rest of the words. Notice the
    search is case sensitive.


    Let us search for the word `Powerful` rather than `powerful`:


    ![](images/00013.jpeg)


    As shown in the above output, there exists no word `Powerful` in the file. This
    is because we have made the p uppercase. However, it is possible to make the search
    case insensitive. This can be achieved using the `-i` option as shown below:


    ![](images/00014.jpeg)


    The `-i` makes the words `powerful` and `Powerful` the same, hence we will get
    our result.


    To perform a multiple search, which means that you will search for several words
    at once, we can still use the `grep` command. This is demonstrated below.


    ![](images/00015.jpeg)


    Notice that in the figure above, we are searching for two words, that is, `powerful`.
    The `-i` makes it case insensitive, so let it not confuse you.


    To know the number of the line of the file containing the word `powerful`, use
    the command shown below:


    ```bash

    grep -n ‘powerful’ myfile

    ```


    ![](images/00017.jpeg)


    Consider the command shown below and its output:


    ```bash

    grep -i1 ‘can’ myfile

    ```


    The command above outputs the following:


    ![](images/00018.jpeg)


    The command outputs the exactly one line which is above the line with our search
    criteria `can`. This is because we have used `1`. If we used two, the output would
    be as follows:


    ![](images/00019.jpeg)


    ## tail command


    A very popular command in Linux which is used to give the last part of a file.
    It gives only the last 10 lines of the file that you specify. If you need to get
    the last 10 lines of the file `myfile`, use the following command:


    ```bash

    tail myfile

    ```


    However, we have added only three lines to the file. This means that the result
    of the above command will be the three lines of the file. If it had more than
    10 lines, then it would output only the last 10 lines.


    However, the last 10 lines of the file is the default setting of the `tail` command.
    One has the choice of specifying the number of lines that they want to form the
    output.


    Consider the command below and its output:


    ```bash

    tail myfile –n 2

    ```


    ![](images/00020.jpeg)


    As shown, we have specified that we want to output only the last 2 lines of the
    file `myfile`. This is what forms our output. The `-n` option when used with this
    command specifies the number of lines that will form the output.

