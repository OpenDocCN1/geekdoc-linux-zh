    \ shuts down the system and then boots it again, meaning that it is used to reboot\
    \ the system.\n\nYou might need to check the commands which you have run previously.\
    \ The reason might be that you have changed something and now you want to undo\
    \ the change. To see the list of these commands, run the history command as shown\
    \ in the figure below:\n\n ![](images/00005.jpeg)\n\nThe above figure shows the\
    \ commands which I have run recently.\n\n## sudo command\n\nsudo stands for super\
    \ user do. With this command, any user can execute his or her commands as a super\
    \ user. The sudoers file defines all this. Sensitive commands, especially those\
    \ which alter the file systems of the Linux OS can only be executed using this\
    \ command. The su command enables you to login as a super user while the sudo\
    \ command borrows the privileges of a super user.\n\nTo update the system, you\
    \ must use the sudo command as shown below:\n\n sudo apt-get update\n\nIf this\
    \ is the first time for you to run the command, you will be prompted to enter\
