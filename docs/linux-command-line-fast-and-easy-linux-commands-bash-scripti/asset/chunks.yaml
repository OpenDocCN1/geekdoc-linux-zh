    问题是，什么是工作目录？这是你当前正在工作的目录。要查看你所所在的目录，请使用以下命令：


    ```

    pwd

    ```


    像往常一样按下回车键即可。输出将是你正在工作的目录。该命令在你不知道自己处于哪个目录时用于此目的。`pwd` 的意思是“打印工作目录”（print working
    directory）。


    ## shutdown 命令


    每当你想要关闭系统时，请使用此命令。运行下方所示的命令：


    ```bash

    shutdown –h now

    ```


    运行上述命令后，你会发现系统将立即停止，也就是说，它将关机。考虑下一个命令：


    ```bash

    shutdown –r now

    ```


    上述命令会关闭系统然后重新启动，这意味着它用于重启系统。


    你可能需要检查你之前运行过的命令。原因可能是你更改了某些内容，而现在你想要撤销这些更改。要查看这些命令的列表，请运行如下所示的 `history` 命令：


    ![](img/00005.jpeg)


    上图显示了我最近运行的命令。


    ## sudo 命令


    `sudo` 代表“super user do”（以超级用户执行）。通过此命令，任何用户都可以以超级用户的身份执行其命令。`sudoers` 文件定义了所有这些内容。敏感命令，特别是那些更改
    Linux 操作系统文件系统的命令，只能使用此命令执行。`su` 命令允许你以超级用户身份登录，而 `sudo` 命令借用超级用户的权限。


    要更新系统，你必须使用如下所示的 `sudo` 命令：


    ```bash

    sudo apt-get update

    ```


    如果这是你第一次运行该命令，系统将提示你输入 `sudo` 密码。要运行上述命令，你必须连接互联网，否则你将收到错误。在 Linux 中，更新是从我们所谓的“仓库”（repositories）获取的。这里是
    Linux 开发团队上传有关各种 Linux 发行版的最新更新的地方。


    要升级系统，请运行以下命令：


    ```bash

    sudo apt-get upgrade

    ```


    上述命令将升级你系统中正在使用的操作系统版本。同样，你必须连接互联网。注意，在 Red Hat Linux 中，该命令被 `yum` 命令取代，因此 Red
    Hat Linux 不支持 `sudo` 命令。


    mkdir 命令


    `mkdir` 代表“make directory”（创建目录）。它用于创建新目录。如果代表目录的文件夹已经存在，你将收到一个告知该情况的错误。让我创建一个目录并将其命名为
    myfiles。


    ```bash

    mkdir myfiles

    ```


    上述命令显示我将创建一个名为 `myfiles` 的目录。这可以通过底图所示来说：


    ![](img/00006.jpeg)


    注意，在创建目录后，我使用了 `list` 命令，该目录将列在可用目录列表中。这说明它已被创建。如果上述命令运行失败，请在前面加上 `sudo` 命令，并在提示时提供密码。


    ## cal 命令


    此命令显示特定年份的月份。这一年份可以是当前的、过去的、甚至是未来的。只需打开命令提示符并输入命令 `cal` 即可。按回回车键：


    ![](img/00007.jpeg)


    如所示，它显示了当天的日期，并且是正确的。现在，让我们显示 1980 年的 5 月，这是一个过去的年份：


    ![](img/00008.jpeg)


    你也可以显示未来年份的月份，如下所示：


    ![](img/00009.jpeg)


    ## date 命令


    如果你需要显示当前的时间日期，请使用如下所示的命令：


    ![](img/00010.jpeg)


    执行 `date` 命令后，当前的日期和时间将形成上图所示的输出。然而，你可能会发现系统上的日期是错误的。


    你可以通过如下所示的命令行进行设置：


    ```bash

    date –set=''1 April 2015 19:30''

    ```


    一旦你运行了上述命令，日期将设置为 2015 年 4 月 1 日，时间将设置为 19:50 小时。


    ## grep 命令


    有时，你可能需要从某个文件中搜索模式或字符串。在大多数情况下，各种 Linux 发行版都都预装了此命令。


    然而，如果你发现没有安装，也可以通过以下命令进行安装：


    ```bash

    sudo apt-get install grep

    ```


    如果你正在使用 Red Hat，请使用命令安装它：


    ```bash

    yum install grep

    ```


    记得我们创建了文件并将其命名为 `myfile`，内容如下：


    ![](img/00011.jpeg)


    我们想使用 `grep` 命令对其进行搜索。要在文件中搜索单词 `powerful`，应该使用以下方法：


    ```bash

    grep ‘powerful’ myfile

    ```


    这通过下图所示进行了说明：


    ![](img/00012.jpeg)


    该命令输出文件中包含搜索词的行，并将搜索词标为红色。这将其与其他单词区分开来。注意，搜索是区分大小写的。


    让我们搜索单词 `Powerful` 而不是 `powerful`：


    ![](img/00013.jpeg)


    如上述输出所示，文件中不存在 `Powerful` 单词。这是因为我们使用了大写字母。然而，可以进行不区分大小写的搜索。这可以通过如下所示的 `-i` 参数来实现：


    ![](img/00014.jpeg)


    `-i` 让 `powerful` 和 `Powerful` 相同，因此我们将得到结果。


    要执行多重搜索，即一次性搜索多个单词，我们仍然可以使用 `grep` 命令。演示如下：


    ![](img/00015.jpeg)


    注意在图中，我们正在搜索两个单词，即 `powerful`。`-i` 让不区分大小写，所以不要被它困扰。


    要查看包含单词 `powerful` 的文件行号，请使用如下所示的命令：


    ```bash

    grep -n ‘powerful’ myfile

    ```


    ![](img/00017.jpeg)


    考虑下面的命令及其输出：


    ```bash

    grep -i1 ‘can’ myfile

    ```


    上述命令输出如下：


    ![](img/00018.jpeg)


    该命令输出了符合我们搜索标准 `can` 的一行。这是因为我们使用了 `1`。如果我们使用 `2`，输出将如下：


    ![](img/00019.jpeg)


    ## tail 命令


    Linux 中非常常用的命令，用于提供文件的末部分。它提供指定文件的最后 10 行。如果你需要获取 `myfile` 的最后 10 行，请使用以下命令：


    ```bash

    tail myfile

    ```


    然而，我们只向文件中添加了三行。这意味着上述命令的结果将是文件的这三行。如果它超过 10 行，那么它只会输出最后 10 行。


    然而，文件的最后 10 行是 `tail` 命令的默认设置。用户可以选择他们想要形成输出的行数。


    考虑下面的命令及其输出：


    ```bash

    tail myfile –n 2

    ```


    ![](img/00020.jpeg)


    如所示，我们指定了只想输出 `myfile` 的最后 2 行。这就是我们输出的内容。`-n` 选项在使用此命令时用于指定形成输出的行数。


    '
- fmt: '

    ```bash

    tail -f myfile | grep 24.13.152.12

    ```


    Notice that we are piping the output from the `tail` command into the `grep` command.
    The command above can be used to monitor updates being made on the file `myfile`
    in real time, that is, just as they happen. The last 10 lines of the file and
    any new lines added to it will be piped to the `grep` command. The `grep` command
    then has the task of outputting these on the standard window. Note that only the
    lines with the above specified address, that is, `24.13.152.12` will be printed
    on the standard output.


    The command can be used to display the last part of the file in relation to its
    size rather than the number of lines. The size is usually specified in bytes.
    To print the last 5 bytes of the file `myfile`, use the following command:


    ```bash

    tail –c5 myfile

    ```


    ![](images/00021.jpeg)


    The output implies that only the word “it” and the full stop (`.`) form the last
    5 bytes of the file. It is also possible to combine the above option with the
    plus (`+`) symbol to print the bytes from a certain byte.


    Consider the command shown below:


    ```bash

    tail –c+10 first

    ```


    The above will print the last bytes of the file, starting from the 10th byte.
    The output will be as shown below:


    ![](images/00022.jpeg)


    ## wc command


    `wc` stands for wall count. This command is used to count the lines contained
    in a certain file. To know the number of lines contained in the file `myfile`,
    run the following command:


    ```bash

    wc –l <myfile

    ```


    The command outputs the following:


    ![](images/00023.jpeg)


    The command gives the number of lines contained in the file `myfile`, which are
    only three lines. In case you also need to get the name of the file, use the following
    command:


    ```bash

    wc –l myfile

    ```


    ![](images/00024.jpeg)


    Run the command shown below:


    ```bash

    wc myfile

    ```


    The following will form the output from the file:


    ![](images/00025.jpeg)


    The command will show the number of lines in the file, the number of words contained
    in the file, the size of the file in bytes and the name of the file. These have
    been displayed in the order mentioned, where 3 is the number of lines in the file,
    17 is the total number of words in the file, 95 is the size of the file in bytes
    and finally we have the file name. However, some people might easily be confused
    by the above.


    It becomes easy when you split the above output as shown below:


    `wc –c myfile`– this will output the total bytes making up the file.


    `wc –w myfile`– outputs the number of words contained in the file.


    `wc –m myfile`– will output the number of characters making up the file.


    If you can’t memorize the order used in the first command, then it is advisable
    you use the simple and alternative option above.


    ## last command


    This command is useful when you want to know the users who have recently logged
    into your system. This is very useful in the industry for security purposes. A
    user won’t deny having logged into the system at a certain time. Open the command
    line and type in the command `last`. Observe the output:


    ![](images/00026.jpeg)


    The command shows the name of the user and other details including the terminal
    they were logged on and the time in which they logged in. In case any of the users
    is still in, you will be notified of it. The difference between when the user
    was lastly logged in and logged out will also be shown. Notice that only the last
    logins will be displayed.


    The command is also associated with the following options:


    1. `–R`– this will make sure the host name is not displayed.

    2. `–d`– this is used when doing remote login. The ip address which identifies
    the host name is translated into the hostname itself.

    3. `–a`– this will display the name of the host in last column.

    4. `–x`– shows the shutdown history and how changes have been made on the run
    levels.

    5. `–i`– displays the ip address of the host login in remotely. The ip address
    is usually in dots and number format.

    6. `–F`– the times and dates of full logins and logouts into the system.

    7. `–w`– the names of the user and domain name are displayed as the output.


    # Chapter 3- Bash Tricks


    `Bash` stands for Bourne Again, and in most Linux distros, it forms the default
    shell. Many Unix and Linux users really like it due to its user-friendliness.
    In this chapter, we are going to learn about Bash shell.


    ## Brace Expansion


    A list of strings is used as arguments in this case. These strings are separated
    using commas. There should be no space after the comma. Example:


    ```bash

    echo {John,Jacob}

    ```


    ![](images/00027.jpeg)


    From the figure, you can see the output. Just the arguments provided in the braces.
    Now, type the following on the command line:


    ```bash

    echo $today today=$(date +%d-%b-%Y)

    ```


    The output will just be the same as in the example above. I am sure that you are
    seeing no usefulness of braces. Consider the example shown below:


    ```bash

    echo {John,Julius}David

    ```


    Maybe the three are sons of David. Observe the output:


    ![](images/0028.jpeg)


    You have now seeing how useful braces are in bash scripting. They are very useful
    when the list placed in the braces should occur after inside or before another
    string. In the case above, these should occur before the string `David`. The above
    can be implemented in another way as follows:


    ```bash

    echo David{John,Julius}

    ```


    The following will form the output of the above script:


    ![](images/0029.jpeg)


    As you can see, the list inside the braces occurs after the string “David”. It
    is also possible to place the list between two strings. This is illustrated below:


    ```bash

    echo David{John,Julius}Mercury

    ```


    The following will be the output:


    ![](images/0030.jpeg)


    The words in the list have been sandwiched between the two strings that we have
    specified. Again, make sure that you’t include space at all. There are no spaces
    between the arguments nor between the braces and the strings. Including this might
    lead to an error or an undesired output. However, if you need to use a space,
    make use that you also use double quotes as shown below:


    ```bash

    echo "{John,Julius,Jacob}" David

    ```


    The following will be the output of the above:


    ![](images/0031.jpeg)


    You might need such output, so that’s how to get it. Consider the example given
    below:


    ```bash

    echo {"John ","Julius ","Jacob "} David

    ```


    The above will give the following as the output:


    ![](images/0032.jpeg)


    Braces can also be nested, whereby braces are placed within other braces as shown
    below:


    ```bash

    echo {{a,b,c},a,b,c}

    ```


    The following will be the output of the above example:


    ![](images/0033.jpeg)


    Consider the example shown below:


    ```bash

    echo {{6,7,8}1,2,3

    ```


    The output will be as follows:


    ![](images/0034.jpeg)


    The question is where is this trick of brace expansion applied. Of course, when
    making a backup of a file, you will need to use this trick hence it is very important.
    An example of this is given below:


    ```bash

    cp /etc/httpd/conf/httpd.conf{,.backup}

    ```


    In the above example, we are backing up the `httpd.config` file.


    ## Command Substitution


    This is also another useful bash scripting trick. It includes the use of the `$`
    sign and parenthesis on the standard output to enclose any command which is aimed
    at generating output. This trick is applied when assigning some value to a variable.


    You can assign the date to a variable as follows:


    ```bash

    date +%d-%b-%Y

    ```


    The above will give you the current date as shown below:


    ![](images/0035.jpeg)


    This can also be achieved using the following:


    ```bash

    echo $today=$(date +%d-%b-%Y)

    ```


    The output will just be the same. To get information about multiple RPM packages
    simultaneously, you can also use command substitution. Command substitution can
    also be achieved after surrounding a command using back quotes. This can be illustrated
    using the example shown below:


    ```bash

    day=`date +%d-%b-%Y`

    echo $day

    ```


    The above will give the following as the final result:


    ![](images/0036.jpeg)

