  trans: "\n将显示当前日期。通过上述样式，命令可以轻松嵌套，并且会变得易于阅读。\n\n特定命令的输出也可以重定向到特定文件。操作如下所示：\n\n```\n\
    find / -name file > result.txt\n```\n\n在上面的示例中，我们正将命令 `find` 的输出重定向到文件 `result.txt`。\n\
    \n然而，你会发现会产生错误信息。如果你对这些信息感兴趣，也可以将它们重定向到文件中。在重定向符号前加一个 `2` 就可以实现这一操作。\n\n如果我们完全不这些这些信息，也可以将它们重定向到\
    \ `/dev/null`。如下所示：\n\n```bash\nfind / -name file 2> /dev/null\n```\n\n系统将显示文件“file”的位置，而不会显示错误信息，`2`\
    \ 代表标准错误输出流。大多数 Linux 命令将它们的错误重定向到这里，而发送到标准输出的正确输出用 `1` 表示。\n\n考虑下面的命令：\n\n```bash\n\
    find / -name file > result.txt\nfind / -name file 1> result.txt\n```\n\n有些人可能认为上述命令是不同的。然而，它们是完全相同的。`1`\
    \ 代表正常的标准输出。\n\n你可能需要将错误信息和标准输出都保存到文件中。Cron job（定时任务）通常用于此目的。实现方式如下所示：\n\n```bash\n\
    find / -name file > result.txt 2> result.txt\n```\n\n注意，两个输出流都被重定向到了同一个文件。然而，上面的方法很麻烦。可以通过下面的简单得多的方法实现：\n\
    \n```bash\nfind / -name file > result.txt 2>&1\n```\n\n在正上面的示例中，我们使用了一个安符 `&`\
    \ 将标准错误流和标准输出流绑定。此后，标准错误将转到标准输出所在的地方。再次强调，上面示例中使用的语法非常重要。\n\n你可能还对将输出管道到另一个命令感兴趣。如下所示：\n\
    \n```bash\nfind -name file.sh 2>&1 | d /tmp/result2.txt\n```\n\n上述行将按预期工作。现在考虑下面这一行：\n\
    \n```bash\nfind -name file.sh | d /tmp/result2.txt 2>&1\n```\n\n在运行上述行时，你会发现它并不会按预期工作。这与另一行是矛盾的。\n\
    \n## 命令历史\n\n通过 Bash，你可以搜索最近运行过的命令。然后你可以使用向上和向下方向键在这些命令之间进行导航。如果你寻找的命令是在最后执行的\
    \ 10-20 条命令之间执行的，那么这对你来说就很简单。\n\n如果你想进行交互式搜索，即系统会提供你正在搜索内容的建议，只需按下 `Ctrl-R`。\n\
    \n提示符将变为如下所示：\n\n```\n(reverse-i-search)`':\n```\n\n然后你就可以开始输入命令的字母。你会发现系统会提供建议。然而，这些建议仅包含最近输入以及相关的命令。\n\
    \n在我的情况下，按下 `Ctrl-R` 后输入 `ech`，接下来的建议如下：\n\n![](img/00037.jpeg)\n\n上面显示我最近运行的包含包含\
    \ `ech` 单词的命令是 “echo day” 命令。\n\n要执行该命令，只需按回车键即可。如果你需要对命令进行一些编辑，只需按左或右方向键。命令将放置在普通提示符上，然后你就可以对其进行编辑。\n\
    \n## 循环\n\n通过 Bash，你可以在命令行上创建循环。然而，如果代码量很大或太复杂，这并不合适。在命令行上，循环可以用两种方式编写。第一种方法涉及使用分号分隔不同的代码行。要创建一个备份特定目录下包含的所有文件的循环，可以使用以下这种方法实现：\n\
    \n```bash\nfor doc in *; do cp $doc $doc.bak; done\n```\n\n上面的代码行将备份目录中的所有文件。与其使用分号分隔行，不如使用次级提示符。在完成每个单行后按一次回车键即可实现。一旦你按了回车键，Bash\
    \ 就会理解你想创建一个循环，并为你提供次级提示符。\n\n然后你就可以输入第二行。如下所示：\n\n```bash\nfor doc in *\n  >\
    \ do cp $doc $doc.bak\n  > done\n```\n\n有时，你的 Linux 系统可能会耗尽内存。这意味着你将无法执行命令，包括像\
    \ `ls` 这样的简单命令以及切换目录的命令。如果 `ls` 失败且你想查看特定目录中包含的文件，可以通过以下方式实现：\n\n```bash\nfor\
    \ doc in *; do echo $doc; done\n```\n\n这将解决 `ls` 问题。这展示了 bash 脚本的力量。\n\n# 第 4\
    \ 章 Linux shell 编程\n\n在 Linux 中，创建 shell 脚本非常简单。通过 shell 编程，我们可以将多个命令组合成链，然后执行它们以获得所需的输出。让我们从编写第一个脚本开始。打开你喜欢的编辑器；我正在使用\
    \ `vi` 编辑器。将以下 shell 程序添加到文件中：\n\n```bash\n#!/bin/bash\necho \"Hello World\"\n\
    ```\n\n这是一个 shell 程序示例。通过 shell 编程，我们可以将多个命令组合成链并执行它们以获得所需的输出。保存文件并将其命名为 `hello.sh`。注意我们使用了\
    \ `.sh` 扩展名来表示这是一个 shell 程序。下一步是使其变为可执行。可以通过如下方式实现：\n\n```bash\nchmod 744 hello.sh\n\
    ```\n\n运行上述命令将创建一个可执行的 `hello.sh`。`chmod` 代表模式，`744` 代表权限，我们使用它来赋予文件执行权限。由于我们已经赋予了执行权限，现在需要执行它。\n\
    \n可以通过在终端运行以下命令实现：\n\n```bash\n./hello.sh\n```\n\n运行上述命令后，在标准输出中观察到如下内容：\n\n![](img/00038.jpeg)\n\
    \n该命令输出了文本 “Hello World”。记住 `#!/bin/bash` 被称为 shebang，用于位于程序的开头。\n\n要在你的程序中添加注释，请以井号\
    \ `#` 开头。\n\n考虑下面的 shell 程序：\n\n```bash\n#!/bin/bash\necho \"Hey $USER\"\necho\
    \ \"Hello, i am\" $USER \"The following are the running currently\"\necho \"List\
    \ of running processes:\"\nps\n```\n\n你可以编写并运行该程序。运行程序后观察如下：\n\n![](img/00039.jpeg)\n\
    \n所示，程序输出了你的名字。它还显示了系统中运行的进程列表。\n\n现在，让我们写一个更有交互性的程序。编写下面的代码并运行它：\n\n```bash\n\
    #!/bin/bash\necho \"Enter your name”\nread name;\necho \"welcome Mr. /Mrs. $name\
    \ \";\necho \"Thanks Mr./Mrs. $name. You have provided us with your names\"\n\
    echo \"-------------------------------------------------\"\necho \"Mr. /Mrs. $name,\
    \ good bye friend\"\n```\n\n运行上述程序后，观察到如下输出：\n\n![](img/0040.jpeg)\n\n如所示，你被提示提供你的名字。这是通过使用\
    \ `read` 命令实现的，该命令提示用户提供输入。然后，这些输入将与其他文本一起显示。\n\n## Shell 变量\n\nShell 变量有两类：\n\
    \n1.  **系统变量**：这些由操作系统创建并维护。它们用大写字母定义。\n2.  **用户定义变量**：用户创建并维护。它们用小写字母定义。\n\n\
    以下是一些 shell 系统变量：\n\n`BASH`: shell 的名称。\n\n`HOME`: 我们的家目录\n\n`LOGNAME`: 我们的登录名。\n\
    \n`PATH`: 我们的路径设置。\n\n`USERNAME`: 当前登录的用户。\n"
- fmt: "\n`COLUMNS` - number of columns making up our screen.\n\n`OSTYPE` - the type\
    \ of the OS we are running.\n\n`PWD` - the current working directory.\n\nThe above\
    \ shows only a sample of the system variables. In case you want to print any of\
    \ the above variables, use the `echo` command and the `$` sign as shown below:\n\
    \n```bash\necho $HOME\necho $PWD\n```\n\nThe next part is on how to work with\
    \ user defined variables.\n\nUse the following syntax to define a user defined\
    \ variable:\n\n```\nvariable name=value\n```\n\nThe `name` refers to the name\
    \ to be used to refer to the variable. The `value` is what it is. This is usually\
    \ a number or a string. Example:\n\n```\nnum=10\nname=Mary\n```\n\n### Tips when\
    \ naming variable\n\n1. There should be no spaces on either sides of the equal\
    \ sign. Example:\n```bash\nnum=12- this is right\nnum= 12- this is wrong\nnum\
    \ =12- this is wrong\nnum = 12- this is wrong\n```\n\n2. The name of the variable\
    \ should begin with an underscore or of the alphanumeric characters. This should\
    \ then be followed by any of the alphanumeric characters. The following are examples\
    \ of valid variables:\n- `PWD`\n- `SYSTEM_VERSION`\n- `num`\n\n3. The names of\
    \ variables are case sensitive. Example:\n```bash\nNum=2\nnum=6\nnUm=9\nnuM=10\n\
    NUM=90\n```\nThe above shows that the variable names are not equal. To print any\
    \ of the above, also make sure that you specify correctly. For example, to print\
    \ 10, use the following code:\n\n```bash\necho $nuM\n```\n\n4. To define null\
    \ variables, do the following:\n```bash\nnum=\nnum=\"\"\n```\nTo print it, use\
    \ the following code:\n```bash\nE=echo $num\n```\nHowever, note that nothing will\
    \ be displayed since the variable is null.\n\n5. Some characters should not be\
    \ used to name variables. These include the asterisk `*` and the question mark\
    \ `?`.\n\n## Loops in Shell\n\nA loop represents a group of instructions executed\
    \ repeatedly.\n\n### for Loop\n\nThis loop follows the following syntax:\n\n```\n\
    for { name of the variable} in {list }\ndo\n    execute the items in the list\
    \ one after another until finished.\ndone\n```\n\nConsider the program shown below:\n\
    \n```bash\nfor j in 1 2 3 4 5\ndo\n    echo \"Test for for loop\"\ndone\n```\n\
    After running the above program, you will observe the output. What the program\
    \ does is it begins by defining variable `j` and sets its value from 1 to 5. The\
    \ line `echo \"Test for for loop\"` of the program will then be executed 5 times\
    \ since the value of `j` will increment up to a maximum of 5. This explains the\
    \ output.\n\n### while Loop\n\nThe `while` loop in shell takes the following syntax:\n\
    \n```\nwhile [ condition]\ndo\n    1st command\n    2nd command\n    3rd command\n\
    \    ..\n    ....\ndone\n```\nAs long as the condition that you have specified\
    \ is true, the loop will execute.\n\n### Case statement\n\nIt is also common in\
    \ Linux. One can use it rather than the `if-else` statement.\n\nIt takes the following\
    \ syntax:\n\n```\ncase $name_of_the_variable in\n    1st pattern) command\n  \
    \      ...\n        ..\n        ;;\n    2nd pattern) command\n        ...\n  \
    \      ..\n        ;;\n    nth pattern) command\n        ...\n        ..\n   \
    \     ;;\n    *) command\n        ...\n        ..\n        ;;\nesac\n```\nNotice\
    \ that we start with `case` but we end with an `esac` statement. Consider the\
    \ example shown below:\n\n```bash\nif [ -y $1 ]\nthen\n    r=\"the vehicle is\
    \ unknown\"\nelif [ -x $1 ]\nthen\n    r=$1\nfi\n\ncase $r in\n    \"lorry\")\
    \ echo \"For $r 10 per k/m\";;\n    \"merc\") echo \"For $r 80 per k/m\";;\n \
    \   \"corolla\") echo \"For $r 15 per k/m\";;\n    \"motorbyke\") echo \"For $r\
    \ 5 per k/m\";;\n    *) echo \"we can’t obtain a $r for you\";;\nesac\n```\n\n\
    ## if-else-fi for decision making\n\nThe command `if-else-fi` can be used in shell\
    \ programming for the purpose of decision making. The programmer specifies a condition\
    \ and once met, a command is executed, if not met, the other command is executed.\
    \ It takes the following syntax:\n\n```\nif condition\nthen\n    the condition\
    \ is zero\n    execute commands until you meet the else statement\nelse\n    ...\
    \ execute commands\nfi\n```\nConsider the example below:\n\n```bash\n#!/bin/bash\n\
    if [ $# -eq 0 ]\nthen\n    exit 1\nfi\n```\n\n## Chapter 5: Bash- Working with\
    \ files\n\n1. **Truncating the size of a file**: The `>` command is used. If the\
    \ file exists, its size is truncated whereas if it does not, it is created. Note\
    \ the operator.\n```bash\necho \"string\" > file\n```\n\n2. **Adding a string\
    \ to your file**: The onliner uses the `>>` operator to append some content to\
    \ your file. In case the operator fails to find the file, anew one is created.\
    \ Example:\n```bash\necho \"content\" >> file\n```\n\n3. **Assign the first line\
    \ of a file to a variable**: In this case, you need to read the first line of\
    \ the file and then assign it to a variable. The input operator `<` is used.\n\
    ```bash\nread -r myline < file\n```\n\n4. **Reading a file**: a `read` command\
    \ can be combined with the `while` loop so as to read a file line-by-line. This\
    \ is illustrated below:\n\n```bash\nwhile IFS read -r myline; do\n    # perform\
    \ something on the variable myline\ndone < file\n```\nA code of failure will be\
    \ returned when the `read` command meets end-of-failure. The `while` loop will\
    \ then halt. Notice that we have placed `< file` at the end. To avoid this, pipe\
    \ the file’s content to a while loop as shown below:\n\n```bash\ncat file | while\
    \ IFS= read -r myline; do\n    # perform something on the variable myline\ndone\n\
    ```"
