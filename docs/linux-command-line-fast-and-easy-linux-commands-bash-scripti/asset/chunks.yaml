  trans: "\n\n`COLUMNS` - 构成屏幕的列数。\n\n`OSTYPE` - 我们正在运行的操作系统类型。\n\n`PWD` - 当前工作目录。\n\
    \n上述内容仅为系统变量的示例。如果你想打印上述任何变量，可以使用如下所示的 `echo` 命令和 `$` 符号：\n\n```bash\necho $HOME\n\
    echo $PWD\n```\n\n下部分是关于如何使用用户自定义变量。\n\n使用以下语法定义用户自定义变量：\n\n```\nvariable name=value\n\
    ```\n\n`name` 指用于指代变量的名称。`value` 是该变量的内容。这通常是一个数字或字符串。示例：\n\n```\nnum=10\nname=Mary\n\
    ```\n\n### 变量命名的小贴士\n\n1. 等号两边不应该有空格。例如：\n```bash\nnum=12- this is right\nnum=\
    \ 12- this is wrong\nnum =12- this is wrong\nnum = 12- this is wrong\n```\n\n\
    2. 变量名应以下划线或字母、数字开头。随后可以跟任何字母或数字。以下是有效变量的示例：\n- `PWD`\n- `SYSTEM_VERSION`\n- `num`\n\
    \n3. 变量名是大小敏感的。例如：\n```bash\nNum=2\nnum=6\nnUm=9\nnuM=10\nNUM=90\n```\n上述示例显示变量名是不相等的。要打印上述任何一个，也请确保指定正确。例如，要打印\
    \ 10，请使用以下代码：\n\n```bash\necho $nuM\n```\n\n4. 要定义空变量，请执行以下操作：\n```bash\nnum=\n\
    num=\"\"\n```\n要打印它，请使用以下代码：\n```bash\nE=echo $num\n```\n然而，请注意由于变量是空的，将不会显示任何内容。\n\
    \n5. 某些字符不应用于命名变量。这些包括星号 `*` 和问号 `?`。\n\n## Shell 中的循环\n\n循环代表一组重复执行的指令。\n\n###\
    \ for 循环\n\n该循环遵循以下语法：\n\n```\nfor { name of the variable} in {list }\ndo\n  \
    \  逐一个执行列表中的项目，直到完成。\ndone\n```\n\n考虑下面的程序：\n\n```bash\nfor j in 1 2 3 4 5\ndo\n\
    \    echo \"Test for for loop\"\ndone\n```\n运行上述程序后，你将看到输出。程序的操作首先定义变量 `j` 并将其值设置为从\
    \ 1 到 5。程序的行 `echo \"Test for for loop\"` 将执行 5 次，因为 `j` 的值将递增到最大 5。这解释了输出。\n\n\
    ### while 循环\n\nShell 中的 `while` 循环采用以下语法：\n\n```\nwhile [ condition]\ndo\n  \
    \  1st command\n    2nd command\n    3rd command\n    ..\n    ....\ndone\n```\n\
    只要你指定的条件为真，循环就会一直执行。\n\n### case 语句\n\n这在 Linux 中也很常见。人们可以使用它来代替 `if-else` 语句。\n\
    \n它采用以下语法：\n\n```\ncase $name_of_the_variable in\n    1st pattern) command\n \
    \       ...\n        ..\n        ;;\n    2nd pattern) command\n        ...\n \
    \       ..\n        ;;\n    nth pattern) command\n        ...\n        ..\n  \
    \      ;;\n    *) command\n        ...\n        ..\n        ;;\nesac\n```\n注意我们以\
    \ `case` 开始，但以 `esac` 语句结束。考虑下面的示例：\n\n```bash\nif [ -y $1 ]\nthen\n    r=\"the\
    \ vehicle is unknown\"\nelif [ -x $1 ]\nthen\n    r=$1\nfi\n\ncase $r in\n   \
    \ \"lorry\") echo \"For $r 10 per k/m\";;\n    \"merc\") echo \"For $r 80 per\
    \ k/m\";;\n    \"corolla\") echo \"For $r 15 per k/m\";;\n    \"motorbyke\") echo\
    \ \"For $r 5 per k/m\";;\n    *) echo \"we can’t obtain a $r for you\";;\nesac\n\
    ```\n\n## 用于决策的 if-else-fi\n\n`if-else-fi` 命令可以在 Shell 编程中用于决策目的。程序员指定一个条件，一旦满足，就会执行一条命令；如果不满足，则执行另一条命令。它采用以下语法：\n\
    \n```\nif condition\nthen\n    the condition is 零\n    执行命令直到遇到 else 语句\nelse\n\
    \    ... 执行命令\nfi\n```\n考虑下面的示例：\n\n```bash\n#!/bin/bash\nif [ $# -eq 0 ]\nthen\n\
    \    exit 1\nfi\n```\n\n## 第 5 章：Bash - 操作文件\n\n1. **截断文件大小**：使用 `>` 命令。如果文件存在，其大小会被截断；如果不存在，则会创建它。注意该运算符。\n\
    ```bash\necho \"string\" > file\n```\n\n2. **向文件添加字符串**：单行命令使用 `>>` 运算符向文件中追加某些内容。如果操作符未找到文件，则会创建一个新的。示例：\n\
    ```bash\necho \"content\" >> file\n```\n\n3. **将文件的第一行赋值给变量**：在这种情况下，你需要读取文件的第一行并将其赋值给变量。使用输入运算符\
    \ `<`。\n```bash\nread -r myline < file\n```\n\n4. **读取文件**：`read` 命令可以与 `while`\
    \ 循环结合，以便逐行读取文件。下例所示：\n\n```bash\nwhile IFS read -r myline; do\n    # 对变量 myline\
    \ 进行操作\ndone < file\n```\n当 `read` 命令遇到结束时，将返回失败代码。`while` 循环随后将停止。注意我们将 `< file`\
    \ 放在了末尾。为了避免这种情况，将文件内容通过到 while 循环，如下所示：\n\n```bash\ncat file | while IFS= read\
    \ -r myline; do\n    # 对变量 myline 进行操作\ndone\n```\n"
