    \ OS we are running.\n\nPWD- the current working directory.\n\nThe above shows\
    \ only a sample of the system variables. In case you want to print any of the\
    \ above variables, use the echo and the $ sign command as shown below:\n\n echo\
    \ $HOME\n\n              echo $PWD\n\nThe next part is on how to work with user\
    \ defined variables.\n\nUse the following syntax to define a user defined variable:\n\
    \n variable name=value\n\nThe name refers to the name to be used to refer to the\
    \ variable. The value is what it is. This is usually a number or a string. Example:\n\
    \n num=10\n\n                            name=Mary\n\nTips when naming variable\n\
    \n1.  There should be no spaces on either sides of the equal sign. Example:\n\n\
                                num=12- this is right\n\n                           \
    \ num= 12- this is wrong\n\n                            num =12- this is wrong\n\
    \n                            num = 12- this is wrong\n\n2.  The name of the variable\
    \ should begin with an underscore or of the alphanumeric characters. This should\
    \ then be followed by any of the alphanumeric characters. The following are examples\
    \ of valid variables:\n\n PWD\n\n                            SYSTEM_VERSION\n\n\
                                num\n\n3.  The names of variables are case sensitive.\
    \ Example:\n\n Num=2\n\n                            num=6\n\n                           \
    \ nUm=9\n\n                            nuM=10\n\n                            NUM=90\n\
    \nThe above shows that the above variable names are not equal. To print any of\
    \ the above, also make sure that you specify correctly. For example, to print\
    \ 10, use the following code:\n\n echo $nuM\n\n4.  To define null variables, do\
    \ the following:\n\n num=\n\n                            num=””\n\nTo print it,\
    \ use the following code:\n\n E=echo $num\n\nHowever, note that nothing will be\
    \ displayed since the variable is null.\n\n5.  Some characters should not be used\
    \ to name variables. These include the asterisk (*) and the question mark (?).\n\
    \n## Loops in Shell\n\nA loop represents a group of instructions executed repeatedly.\n\
    \n## for Loop\n\nThis loop follows the following syntax:\n\nfor { name of the\
    \ variable} in {list }\n\n            do\n\n                     execute the items\
    \ in the list one after another until finished.\n\n            done\n\nConsider\
    \ the program shown below:\n\n for j in 1 2 3 4 5\n\n                           \
    \ do\n\n                            echo “Test for the for loop”\n\n             \
    \               done\n\nAfter running the above program, you will observe the\
    \ following as the output:\n\n ![](images/00041.jpeg)\n\nWhat the program does\
    \ is that it begins by defining the variable j and sets its value from 1 to 5\\\
    . The line echo “Test for the for loop”of the program will then be executed 5\
    \ times since the value of j will increment up to a maximum of 5\\. This explains\
    \ the source of the output.\n\n## while Loop\n\nThe while loop in shell takes\
    \ the following syntax:\n\n  while [ condition]\n\n                                    \
    \                      do\n\n                                                         \
    \ 1st command\n\n                                                          2nd\
    \ command\n\n                                                          3rd  command\n\
    \n                                                                         ..\n\
    \n                                                                         ....\n\
    \n                                                            done\n\nAs long\
    \ as the condition that you have specified is true, the loop will execute.\n\n\
    ## Case statement\n\nIt is also common in Linux. One can use it rather than the\
    \ if-else statement.\n\nIt takes the following syntax:\n\n case  $name_of_the_variable \
    \ in\n\n                1st pattern)   command\n\n                               \
    \ ...\n\n                                ..\n\n                               \
    \ command;;\n\n                2nd pattern)   command\n\n                               \
    \ ...\n\n                                ..\n\n                               \
    \ command;;\n\n                nth pattern)   command\n\n                               \
    \ ...\n\n                                ..\n\n                               \
    \ command;;\n\n                *)             command\n\n                               \
    \ ...\n\n                                ..\n\n                               \
    \ command;;\n\n esac\n\nNotice that we start with case but we end with an esac\
    \ statement. Consider the example shown below:\n\nif [ -y $1 ]\n\nthen\n\n  r=”the\
    \ vehicle is unknown”\n\nelif [ -x $1 ]\n\nthen\n\n  r=$1\n\nfi\n\ncase $r in\n\
    \n   \"lorry\") echo \"For $r 10 per k/m\";;\n\n   \"merc\") echo \"For $r 80\
    \ per k/m\";;\n\n   \"corolla\") echo \"For $r 15 per k/m\";;\n\n   \"motorbyke\"\
    ) echo \"For $r 5 per k/m\";;\n\n   *) echo \"we can’t obtain a $r for you\";;\n\
    \nesac\n\n## if-else-fi  for decision making\n\nThe command if-else-fi can be\
    \ used in shell programming for the purpose of decision making. The programmer\
    \ specifies a condition and once met, a command is executed, if not met, the other\
    \ command is executed. It takes the following syntax:\n\n if condition\n\n          \
    \ then\n\n                       the condition is zero\n\n                      \
    \ execute commands until you meet the else statement\n\n           else\n\n                      \
    \ if the condition is false\n\n                     execute commands until you\
    \ find the fi statement             \n\n          fi\n\nConsider the example shown\
    \ below:\n\n#!/bin/bash\n\nif [ $# -eq 0 ]\n\nthen\n\necho \"$0 : an integer must\
    \ be supplied\"\n\nexit 1\n\nfi\n\nif t $2 -gt 0\n\nthen\n\necho \"$2 is a positive\
    \ number\"\n\nelse\n\necho \"$2 is a negative number\"\n\nfi\n\nIf the command\
    \ line is not given, then an error will be printed, that is, an integer must be\
    \ supplied. The next part involves checking the number of arguments that have\
    \ been passed. If we passed any argument, then the “if “will turn out to be false\
    \ and true otherwise. The exit 1  statement will terminate the program after a\
    \ successful execution.\n\n# Chapter 5- Bash One-liners\n\n## Working with files\n\
    \n1.  Truncating the size of a file to 0 (emptying) - the redirection command\
    \ is used in this case. If the file exists, then its size is truncated to zero\
    \ whereas if it does not exist, it is created. Note the operator opens the file\
    \ for writing.\n\n $ > file\n\nTo create a file containing a content of choice\
    \ or replacing the file’s contents, use the following command:\n\n $ echo “string\
    \ to replace” > file\n\n              The string that you specify in between the\
    \ quotes will act as the replacement     string.\n\n2.  Adding a string to your\
    \ file- the on-liner uses the output redirection operator >> to append some content\
    \ to your file. Example:\n\n $ echo “content to be appended” >> file\n\nIn case\
    \ the operator fails to find the file, anew one is created. After the string has\
    \ been appended to the file, a new line will follow it.\n\nTo avoid this, use\
    \ the –n option as shown below:\n\n $ echo -n “content to be appended” >> file\n\
    \n3.  Assign the first line of a file to a variable- in this case, you need to\
    \ read the first line of the file and then assign this line to a variable. The\
    \ input redirection operator < is used.\n\nConsider the line of code shown below:\n\
    \n $ read -r myline < file\n\n myline is a variable. The command read will read\
    \ only the first line of the file and place it in the variable myline. The –r\
    \ option will ensure that this line is read raw.\n\n4.  Reading a file- a read\
    \ command can be combined with the while loop so as to read a file line-by-line.\
    \ This is illustrated below:\n\n while read -r myline; do\n\n                \
    \               # perform something on the variable myline\n\n                           \
    \ done < file\n\nA code of failure will be returned when the read command meets\
    \ end-of-failure. The while loop will then halt.\n\nNotice that we have placed\
    \ < file at the end. To avoid this, pipe the file’s content to a while loop as\
    \ shown below:\n\n cat file | while IFS= read -r myline; do\n\n                \
    \               # perform something on the variable myline\n\n                           \
    \ done"
