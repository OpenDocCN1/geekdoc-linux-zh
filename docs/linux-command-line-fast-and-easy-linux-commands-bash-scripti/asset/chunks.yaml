    \ otherwise, you will get an error. In Linux, the updates are fetched from what\
    \ we call repositories. This is where the Linux development team uploads any latest\
    \ updates regarding to various ditros of Linux.\n\nTo upgrade the system, run\
    \ the following command:\n\n sudo apt-get upgrade\n\nThe above command will upgrade\
    \ the version of OS that you are using on your system. Again, you must be connected\
    \ to the internet. Notice that in Red Hat Linux, this command is substituted by\
    \ the yum command, so the sudo command is not supported in Red Hat Linux.\n\n\
    mkdir command\n\nmkdir stands for make directory. It is used for creating new\
    \ directory. If the folder representing the directory is in existence, you will\
    \ get an error informing of the same. Let me create a directory and call it myfiles.\n\
    \n mkdir myfiles\n\nThe above command shows that I will create a directory named\
    \ myfiles. This can be illustrated in the figure shown below:\n\n ![](images/00006.jpeg)\n\
    \nNotice after creating the directory then I use the list command, the directory\
    \ will be listed in the available directories. This shows that it has been created.\
    \ If the above command fails to run, precede it by the sudo command and provide\
    \ for the password if prompted to do so.\n\n## cal command\n\nThis command shows\
    \ the month of a particular year. This year can be the current one, the past or\
    \ even the advancing one. Just open the command prompt and type the command cal.\
    \ Press the enter key:\n\n ![](images/00007.jpeg)\n\nAs seen, it shows the date\
    \ of the day, and it is correct. Now, let us show the month May of the year 1980,\
    \ which is a past year:\n\n ![](images/00008.jpeg)\n\nYou can also show the month\
    \ a future year as shown below:\n\n ![](images/00009.jpeg)\n\n## date command\n\
    \nIn case you need to display the current time and date, use this command as shown\
    \ below:\n\n ![](images/00010.jpeg)\n\nOn executing the date command, the current\
