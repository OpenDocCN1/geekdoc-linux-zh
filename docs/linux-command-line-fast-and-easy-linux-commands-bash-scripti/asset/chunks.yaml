- fmt: "\nThe current date will be displayed. With the above style, commands can easily\
    \ be nested and they will become easy to read.\n\nThe output from a certain command\
    \ can also be directed to a certain file. This can be done as shown below:\n\n\
    ```\nfind / -name file > result.txt\n```\n\nIn the above example, we are redirecting\
    \ the output from the command `find` to the file `result.txt`.\n\nHowever, you\
    \ will notice that error messages will be produced. If you are not interested\
    \ in these, you can also redirect them to a file. A `2` in front of the redirection\
    \ symbol can assist in this.\n\nThey can also be redirected to `/dev/null` if\
    \ we are not interested in them at all. This is illustrated below:\n\n```bash\n\
    find / -name file 2> /dev/null\n```\n\nThe location of the file “file” will be\
    \ shown without the error messages, `2` stands for the standard error output stream.\
    \ Most Linux commands redirect their errors here, whereas the correct output which\
    \ is send to the standard output is represented using `1`.\n\nConsider the commands\
    \ shown below:\n\n```bash\nfind / -name file > result.txt\nfind / -name file 1>\
    \ result.txt\n```\n\nSome could think that the above commands are different. However,\
    \ they are just the same. The `1` represents the normal standard output.\n\nYou\
    \ may need to save both, that, the error message and the standard output to a\
    \ file. Cron jobs are usually used for this purpose. This can be achieved as shown\
    \ below:\n\n```bash\nfind / -name file > result.txt 2> result.txt\n```\n\nNotice\
    \ that both output streams have been directed to the same file. However, the above\
    \ is tiresome. It can be achieved with much simplicity as shown below:\n\n```bash\n\
    find / -name file > result.txt 2>&1\n```\n\nIn the example just above, we have\
    \ used an ampersand to tie the standard error stream and the standard output stream.\
    \ After this, the standard error will go to wherever the standard output goes.\
    \ Again the syntax used in the example above as it is very important.\n\nYou might\
    \ also be interested in piping the output to another command. This is shown below:\n\
    \n```bash\nfind -name file.sh 2>&1 | d /tmp/result2.txt\n```\n\nThe above line\
    \ will work just as it is expected. Now consider the line shown below:\n\n```bash\n\
    find -name file.sh | d /tmp/result2.txt 2>&1\n```\n\nOn running the above line,\
    \ you will notice that it won’t work as it is expected. This is in contradiction\
    \ to the other line.\n\n## Command History\n\nWith Bash, you can search through\
    \ the commands that have been run recently. You can then use the up and down arrow\
    \ keys so as to navigate through these commands. If the command you are looking\
    \ for was executed between the last 10-20 executed commands, then this will be\
    \ easy for you.\n\nIf you want to search interactively, meaning that suggestions\
    \ for what you are searching for will be provided, just press `Ctrl-R`.\n\nThe\
    \ prompt will then be changed to the following:\n\n```\n(reverse-i-search)`':\n\
    ```\n\nYou can then start typing the letters of your command. You will notice\
    \ that you will be provided with suggestions. However, the suggestions will only\
    \ include the recently types and related commands.\n\nIn my case, after pressing\
    \ the `Ctrl-R`, and then typing `ech`, the following is the suggestion:\n\n![](images/00037.jpeg)\n\
    \nHe above shows that the command I ran recently containing the words `ech` is\
    \ the “echo day” command.\n\nTo execute the command, just press the enter key\
    \ and it will be executed. If you need to do some editing to the command, just\
    \ press the left or right arrow keys. The command will be placed on the normal\
    \ prompt and then you will be able to edit it.\n\n## Loops\n\nWith Bash, it is\
    \ possible for you to create loops on the command line. However, this is not suitable\
    \ is the code is large or too complex. On the command line, loops can be written\
    \ in two different ways. The first way involves separating the different lines\
    \ of code using a semicolon. To create a loop that will back up all the files\
    \ contained in a certain directory, this can be done as follows using this method:\n\
    \n```bash\nfor doc in *; do cp $doc $doc.bak; done\n```\n\nThe above line of code\
    \ will back up all the files in the directory. Rather than separating the lines\
    \ using a semicolon, a secondary prompt can be used. This can be done by pressing\
    \ the enter key once you are through with each single line. Once you have pressed\
    \ the enter key, Bash will understand that you want to create a loop and it will\
    \ provide you with a secondary prompt.\n\nYou can then enter your second line.\
    \ This is illustrated below:\n\n```bash\nfor doc in *\n  > do cp $doc $doc.bak\n\
    \  > done\n```\n\nSometimes, your Linux system can run out of memory. This means\
    \ that you will not be able to execute your commands including the simple ones\
    \ such as `ls` and the ones for changing directories. If `ls` fails and you want\
    \ to vie the files contained in a particular directory, then this can be achieved\
    \ as follows:\n\n```bash\nfor doc in *; do echo $doc; done\n```\n\nThis will solve\
    \ the `ls` problem. This shows the power of bash scripting.\n\n# Chapter 4 Linux\
    \ shell programming\n\nIn Linux, it is very easy to create shell scripts. With\
    \ shell programming, we can group multiple commands in a chain and then execute\
    \ them to obtain the desired output. Let us begin by writing out first script.\
    \ Open your editor of choice; I am using the `vi` editor. Add the following shell\
    \ program to the file:\n\n```bash\n#!/bin/bash\necho “Hello World”\n```\n\nThe\
    \ above is an example of a shell program. Save the file and give it the name `hello.sh`.\
    \ Notice that we have used the `.sh` extension to imply that it is a shell program.\
    \ Now, the next step is to make the script executable. This can be achieved as\
    \ follows:\n\nOpen the command prompt and type the following command:\n\n```bash\n\
    chmod 744 hello.sh\n```\n\nAfter running the above command, an executable of the\
    \ file `hello.sh` will be created, `chmod` stands for change mode.\n\n`744` refers\
    \ to the permissions, and we have used this to add an execute permission to the\
    \ file. Since we have made the program executable, we now need to execute it.\n\
    \nThis can be achieved by running the following command on the terminal:\n\n```bash\n\
    ./hello.sh\n```\n\nAfter running the above command, the following output will\
    \ be observed on the standard output:\n\n![](images/00038.jpeg)\n\nThe command\
    \ outputs a text written “Hello World”. Remember that this is the text that we\
    \ command the `echo` command to output.\n\n`#!/bin/bash` is called the shebang\
    \ is used to precede shell programs.\n\nTo add comments to your program, precede\
    \ them with a pound sign (`#`).\n\nConsider the shell program shown below:\n\n\
    ```bash\n#! /bin/bash\necho \"Hey $USER\"\necho \"Hello, i am\" $USER \"The following\
    \ are the processes running currently\"\necho \"List of running processes:\"\n\
    ps\n```\n\nYou can write and run the program. The following output will be observed\
    \ after running the program:\n\n![](images/00039.jpeg)\n\nAs shown in the above\
    \ figure, the program outputs your name. It also shows the list of processes which\
    \ are currently running on your system.\n\nNow, let us write a more interactive\
    \ program. Write the code shown below and run it:\n\n```bash\n#! /bin/bash\necho\
    \ \"Enter your name”\nread name;\necho \"welcome Mr. /Mrs. $name \";\necho \"\
    Thanks Mr./Mrs. $name. You have provided us with your names\"\necho \"-------------------------------------------------\"\
    \necho \"Mr. /Mrs. $name, good bye friend\"\n```\n\nAfter running the above program,\
    \ the following output will be observed:\n\n![](images/00040.jpeg)\n\nAs seen,\
    \ you are prompted to provide your name. This has been achieved by use of the\
    \ `read` command, which prompts users to provide their input. This input has then\
    \ been displayed alongside some other text.\n\n## Variables in Shell\n\nThe two\
    \ types of shell variables are:\n\n1.  **System variables**: these are created\
    \ and maintained by the OS. They are defined in upper case.\n2.  **User Defined\
    \ Variables**: the user creates and maintains these. They are defined in lower\
    \ case letters.\n\nThe following are some of the system variables in shell:\n\n\
    `BASH`: the shell name.\n\n`HOME`: our home directory\n\n`LOGNAME`: our login\
    \ name.\n\n`PATH`: our setting for the path.\n\n`USERNAME`: the currently logged\
    \ in user.\n"
  raw: "The current date will be displayed. With the above style, commands can easily\
    \ be nested and they will become easy to read.\n\nThe output from a certain command\
    \ can also be directed to a certain file. This can be done as shown below:\n\n\
    \ find / -name file > result.txt\n\nIn the above example, we are redirecting the\
    \ output from the command find to the file result.txt.\n\nHowever, you will notice\
    \ that error messages will be produced. If you are not interested in these, you\
    \ can also redirect them to a file. A 2 in front of the redirection symbol can\
    \ assist in this.\n\nThey can also be redirected to /dev/null if we are not interested\
    \ in them at all. This is illustrated below:\n\n find / -name file 2> /dev/null\n\
    \nThe location of the file “file” will be shown without the error messages, 2\
    \ stands for the standard error output stream. Most Linux commands redirect their\
    \ errors here, whereas the correct output which is send to the standard output\
    \ is represented using 1.\n\nConsider the commands shown below:\n\n find / -name\
    \ file > result.txt\n\n                                 find / -name file 1> result.txt\n\
    \nSome could think that the above commands are different. However, they are just\
    \ the same. The 1 represents the normal standard output.\n\nYou may need to save\
    \ both, that, the error message and the standard output to a file. Cron jobs are\
    \ usually used for this purpose. This can be achieved as shown below:\n\n find\
    \ / -name file > result.txt 2> result.txt\n\nNotice that both output streams have\
    \ been directed to the same file. However, the above is tiresome. It can be achieved\
    \ with much simplicity as shown below:\n\n find / -name file > result.txt 2>&1\n\
    \nIn the example just above, we have used an ampersand to tie the standard error\
    \ stream and the standard output stream. After this, the standard error will go\
    \ to wherever the standard output goes. Again the syntax used in the example above\
    \ as it is very important.\n\nYou might also be interested in piping the output\
    \ to another command. This is shown below:\n\n find -name file.sh 2>&1 | d /tmp/result2.txt\n\
    \nThe above line will work just as it is expected. Now consider the line shown\
    \ below:\n\n find -name file.sh | d /tmp/result2.txt 2>&1\n\nOn running the above\
    \ line, you will notice that it won’t work as it is expected. This is in contradiction\
    \ to the other line.\n\n## Command History\n\nWith Bash, you can search through\
    \ the commands that have been run recently. You can then use the up and down arrow\
    \ keys so as to navigate through these commands. If the command you are looking\
    \ for was executed between the last 10-20 executed commands, then this will be\
    \ easy for you.\n\nIf you want to search interactively, meaning that suggestions\
    \ for what you are searching for will be provided, just press Ctrl-R.\n\nThe prompt\
    \ will then be changed to the following:\n\n (reverse-i-search)`':\n\nYou can\
    \ then start typing the letters of your command. You will notice that you will\
    \ be provided with suggestions. However, the suggestions will only include the\
    \ recently types and related commands.\n\nIn my case, after pressing the Ctrl-R,\
    \ and then typing ech, the following is the suggestion:\n\n ![](images/00037.jpeg)\n\
    \nHe above shows that the command I ran recently containing the words ech is the\
    \ “echo day” command.\n\nTo execute the command, just press the enter key and\
    \ it will be executed. If you need to do some editing to the command, just press\
    \ the left or right arrow keys. The command will be placed on the normal prompt\
    \ and then you will be able to edit it.\n\n## Loops\n\nWith Bash, it is possible\
    \ for you to create loops on the command line. However, this is not suitable is\
    \ the code is large or too complex. On the command line, loops can be written\
    \ in two different ways. The first way involves separating the different lines\
    \ of code using a semicolon. To create a loop that will back up all the files\
    \ contained in a certain directory, this can be done as follows using this method:\n\
    \n for doc in *; do cp $doc $doc.bak; done\n\nThe above line of code will back\
    \ up all the files in the directory. Rather than separating the lines using a\
    \ semicolon, a secondary prompt can be used. This can be done by pressing the\
    \ enter key once you are through with each single line. Once you have pressed\
    \ the enter key, Bash will understand that you want to create a loop and it will\
    \ provide you with a secondary prompt.\n\nYou can then enter your second line.\
    \ This is illustrated below:\n\n for doc in *\n\n                            >\
    \ do cp $doc $doc.bak\n\n                            > done\n\nSometimes, your\
    \ Linux system can run out of memory. This means that you will not be able to\
    \ execute your commands including the simple ones such as ls and the ones for\
    \ changing directories. If ls fails and you want to vie the files contained in\
    \ a particular directory, then this can be achieved as follows:\n\n for doc in\
    \ *; do echo $doc; done\n\nThis will solve the ls problem. This shows the power\
    \ of bash scripting.\n\n# Chapter 4- Linux shell programming\n\n In Linux, it\
    \ is very easy to create shell scripts. With shell programming, we can group multiple\
    \ commands in a chain and then execute them to obtain the desired output. Let\
    \ us begin by writing out first script. Open your editor of choice; I am using\
    \ the vi editor. Add the following shell program to the file:\n\n #!/bin/bash\n\
    \n                            Echo “Hello World”\n\nThe above is an example of\
    \ a shell program. Save the file and give it the name hello.sh. Notice that we\
    \ have used the .sh extension to imply that it is a shell program. Now, the next\
    \ step is to make the script executable. This can be achieved as follows:\n\n\
    Open the command prompt and type the following command:\n\n chmod 744 hello.sh\n\
    \nAfter running the above command, an executable of the file hello.sh will be\
    \ created, chmod stands for change mode.\n\n744 refers to the permissions, and\
    \ we have used this to add an execute permission to the file. Since we have made\
    \ the program executable, we now need to execute it.\n\nThis can be achieved by\
    \ running the following command on the terminal:\n\n  ./hello.sh\n\nAfter running\
    \ the above command, the following output will be observed on the standard output:\n\
    \n ![](images/00038.jpeg)\n\nThe command outputs a text written “Hello World”.\
    \ Remember that this is the text that we command the echo command to output.\n\
    \n#!/bin/bash is called the shebang is used to precede shell programs.\n\nTo add\
    \ comments to your program, precede them with a pound sign (#).\n\nConsider the\
    \ shell program shown below:\n\n#! /bin/bash\n\necho \"Hey $USER\"\n\necho \"\
    Hello, i am\" $USER \"The following are the processes running currently\"\n\n\
    echo \"List of running processes:\"\n\nps\n\nYou can write and run the program.\
    \ The following output will be observed after running the program:\n\n ![](images/00039.jpeg)\n\
    \nAs shown in the above figure, the program outputs your name. It also shows the\
    \ list of processes which are currently running on your system.\n\nNow, let us\
    \ write a more interactive program. Write the code shown below and run it:\n\n\
    #! /bin/bash\n\necho \"Enter your name”\n\nread name;\n\necho \"welcome Mr. /Mrs.\
    \ $name \";\n\necho \"Thanks Mr./Mrs. $name. You have provided us with your names\"\
    ;\n\necho \"-----------------------------------------------------------------\"\
    \n\necho \"Mr. /Mrs. $name, good bye friend\"\n\nAfter running the above program,\
    \ the following output will be observed:\n\n ![](images/00040.jpeg)\n\nAs seen,\
    \ you are prompted to provide your name. This has been achieved by use of the\
    \ read command, which prompts users to provide their input. This input has then\
    \ been displayed alongside some other text.\n\nVariables in Shell\n\nThe two types\
    \ of shell variables are:\n\n1.  System variables- these are created and maintained\
    \ by the OS. They are defined in upper case.\n\n2.  User Defined Variables- the\
    \ user creates and maintains these. They are defined in lower case letters.\n\n\
    The following are some of the system variables in shell:\n\nBASH- the shell name.\n\
    \nHOME- our home directory\n\nLOGNAME- our login name.\n\nPATH- our setting for\
    \ the path.\n\nUSERNAME- the currently logged in user."
