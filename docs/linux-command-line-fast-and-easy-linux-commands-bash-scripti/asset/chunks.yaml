    \ the command shown below and its output:\n\n grep –iB1 ‘can’ myfile\n\nThe command\
    \ above outputs the following:\n\n ![](images/00018.jpeg)\n\nThe command outputs\
    \ the exactly one line which is above the line with our search criteria ‘can’.\
    \ This is because we have used 1. If we used two, the output would be as follows:\n\
    \n ![](images/00019.jpeg)\n\n## tail command\n\nA very popular command in Linux\
