    ## 引言


    Linux 是一个开源操作系统。它的开发是为了提供一个类 Unix 的免费操作系统。内核是 Linux 的主要部分，其第一个版本于 1991 年发布。人们很少在桌面端使用
    Linux，这是由于它的操作门槛较高。例如，那些接触过 Linux 的人一定会意识到 Linux 支持图形界面。在启动电脑后，你获得的是一个闪烁的光标。然后你必须提供命令来运行支持图形界面的桌面版本。GUI（图形用户界面）是默认设置，尽管你仍然可以访问命令行。


    ## 第 1 章- 定义


    Linux 的开发始于 1983 年，当时理查德·斯尔曼（Richard Stallman）想出了开发一个完全类 Unix 操作系统的想法。这标志着 Gnu
    项目的开始。到 1990 年，该操作系统的基本组件如编译器、库、shell 和文本编辑器已经创建完成。该操作系统的其他复杂组件如设备驱动程序、内核和守护进程在随后得到了开发。Linux
    内核的开发始于 1991 年，这是理查德·斯尔曼就读赫尔辛基大学之后。Linux 操作系统的用户界面支持图形界面或命令行。在桌面版本中，图形用户界面和命令行均受到支持。


    ## 第 2 章- Linux 命令行命令


    让我们探索从你开始所需的基础命令到复杂的 Linux 命令。要打开命令行，请在桌面上点击右键并选择 `Open Terminal`（打开终端）。如果不可用，在桌面顶部找到
    `Applications`（应用程序）。点击后，选择 `Accessories`（附件）。选择 `Open terminal`（打开终端）。打开一个你喜欢的文本编辑器，如
    Gedit 或 Vim。要打开 Gedit 文本编辑器，只需在搜索栏中搜索它。要在命令行中打开被称为 vi 编辑器的 Vim，输入命令：


    ```

    vi filename

    ```


    '
- fmt: "\nwhere `filename` is the name of the file. I have called my file `myfile`.\
    \ On pressing the enter key, the `vi` editor will be opened. Now you can add some\
    \ text of your choice to the file. Note that to change from command mode in `vi`\
    \ editor, you have to press the letter `i`, otherwise, you will not be able to\
    \ add any text to the file.\n\nThe text should be as follows:\n\nThe Linux command\
    \ line is a very powerful tool for programmers.\nMuch can be achieved with it.\n\
    \nYou can then save the file to somewhere where you can easily access such as\
    \ on the desktop. In `vi` editor, just press the `Esc` key followed by typing\
    \ `wq`. This will save the file.\n\nOn the command line, type the following command\
    \ and then press the enter key:\n\n```\ncat myfile\n```\n\nOn pressing the enter\
    \ key, the text you added on your file will be displayed on the standard output.\
    \ This is illustrated in the figure below:\n\n![](images/00001.jpeg)\n\nThis shows\
    \ that the `cat` command displays the contents of a file on the standard output.\
    \ However, use it to display the contents of a short file.\n\n## Changing Directories\n\
    \nSometimes, you might need to change your working directory. This can be achieved\
    \ via the terminal using the `cd` (change directory) command as shown below:\n\
    \n```\ncd /home\n```\n\nThe command above will change the working directory to\
    \ home directory and relative to root due to the use of the forward slash, that\
    \ is, `/`. Regardless of the current working directory, the above command will\
    \ be executed. Type the following command:\n\n```\ncd httpd\n```\n\nAfter pressing\
    \ the enter key, the full working directory will become `/home/httpd`, meaning\
    \ that we have changed to the `httpd` directory but relative to the `/home` directory.\
    \ To change back to the user’s home directory, use the following command:\n\n\
    ```\ncd ~\n```\n\nThe user’s home directory is the `/home/username` directory,\
    \ where the `username` will be the name you have used on the computer. Notice\
    \ that we have used the symbol `~`, known as the tilde symbol. In Linux, it symbolizes\
    \ the user’s home directory.\n\n## Copying file\n\nIn Linux, the `cp` (copy files),\
    \ is used for copying files. In copying, a duplicate of the original file is made\
    \ at the location being specified, meaning that the initial file is not deleted.\
    \ To make a duplicate a duplicate of the file `myfile`, run the following command:\n\
    \n```\ncp myfile myfile2\n```\n\nThe above command will create a duplicate of\
    \ the file `myfile` and name it `myfile2`. The files will be similar but with\
    \ a difference in their naming. However, it is risky to run the above command.\
    \ This is because in case the file `myfile2` already exists in the directory,\
    \ it will be overwritten without a warning. To take care of this, the `-i` option\
    \ should be used as shown below:\n\n```\ncp –i myfile myfile2\n```\n\nIf the file\
    \ `myfile2` already exists in the directory, then we warned before it is overwritten,\
    \ which is a very good idea.\n\nYou might need to copy all files contained in\
    \ a certain directory to another directory. This can be done using the following\
    \ command:\n\n```\ncp –dpr originaldirectory finaldirectory\n```\n\nThe files\
    \ will then be copied from the `originaldirectory` to the `finaldirectory`. They\
    \ will not be deleted from the latter. The `-dpr` option is very important as\
    \ it plays the following role:\n\n- `-d-` for preservation of links.\n- `-p-`\
    \ for preservation of file attributes.\n- `-r-` for recursive copying.\n\nIf you\
    \ don’t specify the above options, the default ones will be applied. This is not\
    \ recommended as you might need to preserve the links and file attributes which\
    \ might not be done with the default options.\n\nEach mounted file system has\
    \ used some space on the disk. To know the amount of this space for each file\
    \ system, use the command:\n\n```\ndf\n```\n\n## The less command\n\nThis command\
    \ is almost similar to the “more” command with the difference in that, with this\
    \ command one will be able to move the page up and down through the file. Consider\
    \ the command below:\n\n```\nless myfile\n```\n\nAfter pressing the enter key,\
    \ the contents of the file `myfile` will be displayed.\n\n## ln command\n\nTo\
    \ create a symbolic link to your file, use the command `ln`. Type the command\
    \ shown below:\n\n```\nln –s myfile mlink\n```\n\nThe above command will create\
    \ a symbolic link called `mlink` to link to the file `myfile`. To show that two\
    \ files are different and contain different inodes, use the command\n\n```\nln\
    \ –i myfile mlink\n```\n\n## locate command\n\nIf you need to search in a database,\
    \ use the `locate` command. Consider the command shown below:\n\n```\nslocate\
    \ –u\n```\n\nThe command will create a database and name it `slocate`. The problem\
    \ is that the process might take a long time so patience will be required. But\
    \ the command is important since you can’t search for a file without having run\
    \ it. Ever heard of `cron`? This is used for scheduling tasks. This will run the\
    \ above command periodically so you might not be needed to do so. Type the command\
    \ shown below and run it:\n\n```\nlocate whois\n```\n\nThe command above will\
    \ search for all the files contained in your system and whose names contain the\
    \ string “whois”. \n\n## logout command\n\nThis command just logs out the currently\
    \ logged in user. Open the terminal and type the following:\n\n```\nlogout\n```\n\
    \nOnce you have typed the above command, just press the enter key. You will notice\
    \ that you will be logged out of the system and then you will be on the login\
    \ screen.\n\n## ls command\n\nUse this command to list the files which are contained\
    \ in a particular directory, `ls` means list. The command has many options associated\
    \ with it, which needs to be well understood. Type the command shown below and\
    \ the press the enter key:\n\n```\nls\n```\n\nThe command will list all the files\
    \ which are contained in your current directory.\n\n![](images/00002.jpeg)\n\n\
    The above figure shows the files contained in my directory. However, if this directory\
    \ contains files whose name starts with a dot (`.`), they will not be listed with\
    \ this command. You also notice that with the above command, only a few details\
    \ about the file are provided. Suppose you want to know the size of the file,\
    \ the day it was made and the ownership permissions associated with it, you can\
    \ achieve this with the following command:\n\n```\nls –al\n```\n\n![](images/00003.jpeg)\n\
    \nAs you can see in the figure above, the output is more detailed. The first part\
    \ starts with either a “d” or a – (dash), where “d” means that it is a directory,\
    \ while “-” means that it is a file. The `rwx` stands for permissions, where `r`\
    \ is for read permission, `w` is for write permission whereas `x` means execute\
    \ permission. The size of the file and the date of creation are also shown.\n\n\
    ## more command\n\nWith this command, the contents of a file will be sent to the\
    \ screen. This will be done one page at a time. The command is also applicable\
    \ on piped output.\n\nType and run the command shown below:\n\n```\nmore /etc/profile\n\
    ```\n\nThe above command will output the contents of the file `/etc/profile`.\
    \ This file contains details about the users of the system. On pressing the enter\
    \ key, the following will be the output:\n\n![](images/00004.jpeg)\n\nNote that\
    \ this is a built-in file so it comes with the OS itself. The file also contains\
    \ too much content which cannot fit on a single page. With the above command,\
    \ these will be displayed one page at a time. Type the command below and run it:\n\
