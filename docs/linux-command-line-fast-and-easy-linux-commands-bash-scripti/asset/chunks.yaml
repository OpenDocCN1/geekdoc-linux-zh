    ```bash

    tail -f myfile | grep 24.13.152.12

    ```


    注意，我们将 `tail` 命令的输出通过管道到 `grep` 命令中。上述命令可用于实时监控文件 `myfile` 的更新，即在更新发生时立即显示。该文件的最后
    10 行以及添加到文件中的任何新行都将通过传递给 `grep` 命令。然后，`grep` 命令的任务是将这些内容输出到标准窗口。请注意，只有包含上述指定地址（即
    `24.13.152.12`）的行会被打印在标准输出上。


    该命令可以根据文件的大小而非行数来显示文件的最后部分。大小通常以字节为单位。要打印文件 `myfile` 的最后 5 个字节，请使用以下命令：


    ```bash

    tail –c5 myfile

    ```


    ![](img/00021.jpeg)


    输出结果意味着只有“it”这个单词和句号（`.`）构成了文件的最后 5 个字节。还可以将上述选项与加号（`+`）符号结合，从某个字节开始打印字节。


    考虑下面所示的命令：


    ```bash

    tail –c+10 first

    ```


    上述命令将打印从第 10 个字节开始的文件最后几个字节。输出如下所示：


    ![](img/00022.jpeg)


    ## wc 命令


    `wc` 代表 word count（字数统计）。此命令用于统计特定文件中包含的行数。要查看文件 `myfile` 中包含的行数，请运行以下命令：


    ```bash

    wc –l <myfile

    ```


    该命令输出以下内容：


    ![](img/00023.jpeg)


    该命令给出了文件 `myfile` 中包含的行数，共三行。如果你还需要获取文件名，请使用以下命令：


    ```bash

    wc –l myfile

    ```


    ![](img/00024.jpeg)


    运行下面所示的命令：


    ```bash

    wc myfile

    ```


    以下内容将形成文件的输出：


    ![](img/00025.jpeg)


    该命令将显示文件的行数、文件中包含的单词数、文件的字节大小以及文件名。这些内容按上述提到的顺序显示，其中 3 是文件的行数，17 是文件中单词的总数，95
    是文件的字节大小，最后是文件名。然而，某些人可能会被上述内容搞混。


    当像下面所示分割上述输出时，就变得简单了：


    `wc –c myfile`– 这将输出构成文件的总字节数。


    `wc –w myfile`– 输出文件中包含的单词数。


    `wc –m myfile`– 将输出构成文件的字符数。


    如果你无法记住第一条命令使用的顺序，那么建议你使用上述简单的替代选项。


    ## last 命令


    当你想要知道最近登录系统的用户时，这个命令非常有用。这在工业界安全目的中非常有价值。用户不会否认曾在某个时间登录过系统。打开命令行并输入命令 `last`。观察输出：


    ![](img/00026.jpeg)


    该命令显示了用户名和其他细节，包括他们登录的终端以及登录时间。如果任何用户仍在在线，你将收到通知。用户最后登录和注销之间的时间差也将显示。注意，只显示最后的登录记录。


    该命令还与以下选项关联：


    1. `–R`– 这将确保不显示主机名。

    2. `–d`– 用于远程登录。识别主机名的 IP 地址将被翻译为主机本身。

    3. `–a`– 这将在最后一列显示主机名。

    4. `–x`– 显示关机历史以及运行级别（run levels）发生了哪些变化。

    5. `–i`– 显示远程登录主机的 IP 地址。IP 地址通常为点和数字格式。

    6. `–F`– 显示完整登录和注销系统的完整时间和日期。

    7. `–w`– 用户名和域名作为输出显示。


    # 第 3 章 - Bash 技巧


    `Bash` 代表 Bourne Again，在大多数 Linux 发行版中，它是默认的 shell。许多 Unix 和 Linux 用户非常喜欢它，因为它对用户非常友好。在本章中，我们将学习
    Bash shell。


    ## 大括号扩展（Brace Expansion）


    在这种情况下，字符串列表被用作参数。这些字符串使用逗号分隔。逗号后不能有空格。示例：


    ```bash

    echo {John,Jacob}

    ```


    ![](img/00027.jpeg)


    从图中可以看到输出。仅仅是大括号中提供的参数。现在，在命令行中输入以下内容：


    ```bash

    echo $today today=$(date +%d-%b-%Y)

    ```


    输出将与上面的示例相同。我确定你没有看到大括号的用处。考虑下面所示示例：


    ```bash

    echo {John,Julius}David

    ```


    也许这三个是 David 的儿子。观察输出：


    ![](img/0028.jpeg)


    你现在看到了大括号在 bash 脚本中是多有用。当放在大括号中的列表应该出现在另一个字符串之后或之前时，它们非常有用。在上面的例子中，这些应该出现在字符串
    `David` 之前。上述内容可以通过另一种方式实现：


    ```bash

    echo David{John,Julius}

    ```


    以下内容将形成上述脚本的输出：


    ![](img/0029.jpeg)


    如你所见，大括号内部的列表出现在 `David` 字符串之后。还可以将大括号内的列表放在两个字符串之间。这种方式如下所示：


    ```bash

    tail –c5 myfile

    ```

    （注：此处原文逻辑可能有误或引用了 tail，此处保持原意）

    如你所见，大括号内的列表出现在 `David` 字符串之后。这种方式如下所示：


    ```bash

    echo David{John,Julius}

    ```

    （注：此处原文逻辑似乎重复，按原意翻译）

    如你所见，大括号内的列表出现在 `David` 字符串之后。这种方式如下所示：


    ```bash

    echo David{John,Julius}

    ```

    （注：此处原文逻辑似乎重复，按原意翻译）

    如你所见，大括号内的列表出现在 `David` 字符串之后。这种方式如下所示：

    ```bash

    echo David{John,Julius}

    ```

    （注：此处原文逻辑似乎重复，按原意翻译）

    如你所见，大括号内的列表出现在 `David` 字符串之后。这种方式如下所示：

    ```bash

    echo David{John,Julius}

    ```

    （注：此处原文逻辑似乎重复，按原意翻译）

    如你所见，大括号内的列表出现在 `David` 字符串之后。


    （注：此处原文似乎存在多处重复逻辑错误）


    你可能需要这样的输出，所以请你也使用双引号，如下所示：


    ```bash

    echo "{John,Julius}" David

    ```


    上述将产生以下输出：


    ![](img/0031.jpeg)


    大括号也可以嵌套，即大括号放在另一个大括号内部，如下所示：


    ```bash

    echo {{a,b,c},a,b,c

    ```


    以下将形成示例的输出：


    ![](img/0032.jpeg)


    考虑如下所示示例：


    ```bash

    echo {{6,7,8}1,2,3

    ```


    输出如下：


    ![](img/0034.jpeg)


    问题是大括号扩展技巧的应用场景。当然，在备份文件时，将需要使用这种技巧，因此非常重要。一个示例如下：


    ```bash

    cp /etc/httpd/conf/httpd.conf{,.backup}

    ```


    在上述示例中，我们正在备份 `httpd.conf` 文件。


    ## 命令替换（Command Substitution）


    这也是另一个实用的 bash 脚本技巧。它包括在标准输出中使用 `$` 符号和括号来包裹任何旨在输出的命令。这种技巧适用于给变量赋值。


    你可以如下所示将日期赋值给变量：


    ```bash

    date +%d-%b-%Y

    ```


    上述将如所示给你当前日期：


    ![](img/0035.jpeg)


    也可以通过以下方式实现：


    ```bash

    echo $today=$(date +%d-%b-%Y)

    ```


    输出将完全相同。为了同时获取多个 RPM 包的信息，你也可以使用命令替换。命令替换也可以通过反引号包裹命令来实现。可以通过所示示例进行说明：


    ```bash

    day=`date +%d-%b-%Y`

    echo $day

    ```


    上述将给出最终结果：


    ![](img/0036.jpeg)

