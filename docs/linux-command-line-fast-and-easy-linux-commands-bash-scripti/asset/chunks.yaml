    \ in a certain file. To know the number of lines contained in the file myfile,\
    \ run the following command:\n\n wc –l <myfile\n\nThe command outputs the following:\n\
    \n ![](images/00023.jpeg)\n\nThe command gives the number of lines contained in\
    \ the file myfile, which are only three lines. In case you also need to get the\
    \ name of the file, use the following command:\n\n wc –l myfile\n\n ![](images/00024.jpeg)\n\
    \nRun the command shown below:\n\n wc myfile\n\nThe following will form the output\
    \ from the file:\n\n ![](images/00025.jpeg)\n\nThe command will show the number\
    \ of lines in the file, the number of words contained in the file, the size of\
    \ the file in bytes and the name of the file. These have been displayed in the\
    \ order mentioned, where 3 is the number of lines in the file, 17 is the total\
    \ number of words in the file, 95 is the size of the file in bytes and finally\
    \ we have the file name. However, some people might easily be confused by the\
    \ above.\n\nIt becomes easy when you split the above output as shown below:\n\n\
    \ wc –c  myfile– this will output the total bytes making up the file.\n\nwc –w\
    \ myfile– outputs the number of words contained in the file.\n\nwc –m  myfile–\
    \ will output the number of characters making up the file.\n\nIf you can’t memorize\
    \ the order used in the first command, then it is advisable you use the simple\
    \ and alternative option above.\n\n## last command\n\nThis command is useful when\
    \ you want to know the users who have recently logged into your system. This is\
    \ very useful in the industry for security purposes. A user won’t deny having\
    \ logged into the system at a certain time. Open the command line and type in\
    \ the command last. Observe the output:\n\n ![](images/00026.jpeg)\n\nThe command\
    \ shows the name of the user and other details including the terminal they were\
    \ logged on and the time in which they logged in. In case any of the users is\
    \ still in, you will be notified of it. The difference between when the user was\
    \ lastly logged in and logged out will also be shown. Notice that only the last\
    \ 100 logins will be displayed.\n\nThe command is also associated with the following\
    \ options:\n\n1.  –R- this will make sure that the host name is not displayed.\n\
    \n2.  –d – this is used when doing remote login. The ip address which identifies\
    \ the host name is translated into the hostname itself.\n\n3.  –a – this will\
    \ display the name of the host in output’s last column.\n\n4.  –x- shows the shutdown\
    \ history and how changes have been made on the run levels.\n\n5.  –i- displays\
    \ the ip address of the host login in remotely. The ip address is usually in dots\
    \ and number format.\n\n6.  –F- the times and dates of full logins and logouts\
    \ into the system ware displayed.\n\n7.  –w- the names of the user and the domain\
    \ name are displayed as the output.\n\n# Chapter 3- Bash scripting Tricks\n\n\
    \ Bash stands for Bourne Again shell, and in most Linux distros, it forms the\
    \ default shell. Many Unix and Linux users really like it due to its user-friendliness.\
    \ In this chapter, we are going to learn about the Bash shell.\n\n##  Brace Expansion\n\
    \nA list of strings is used as arguments in this case. These strings are separated\
    \ using comas. There should be no space after the comma. Example:\n\necho {John,Julius,Jacob}\n\
    \n ![](images/00027.jpeg)\n\nFrom the figure, you can see the output. Just the\
    \ arguments we provided in the braces.\n\nNow, type the following on the command\
    \ line:\n\n echo John,Julius,Jacob\n\nThe output will just be the same as in the\
    \ first example above. I am sure that you are seeing no usefulness of the braces.\
    \ Consider the example shown below:\n\n echo {John,Julius,Jacob}David\n\nMaybe\
    \ the three are sons of David. Observe the output:\n\n ![](images/00028.jpeg)\n\
    \nYou have now seeing how useful the braces are in bash scripting. They are very\
    \ useful when the list placed in the braces should occur after, inside or before\
    \ another string. In the case above, these should occur before the string David.\n\
    \nThe above can be implemented in another way as follows:\n\n echo David{John,Julius,Jacob}\n\
    \nThe following will form the output of the above script:\n\n ![](images/00029.jpeg)\n\
    \nAs you can see, the list specified inside the braces occurs after the string\
    \ “David”.\n\nIt is also possible to place the list in between two strings. This\
    \ is illustrated below:\n\n  echo David{John,Julius,Jacob}Mercy\n\nThe following\
    \ will be the output:\n\n ![](images/00030.jpeg)\n\nThe words in the list have\
    \ been sandwiched between the two strings that we have specified. Again, make\
    \ sure that you don’t include space at all. There are no spaces between the arguments\
    \ nor between the braces and the strings. Including this might lead to an error\
    \ or an undesired output.\n\nHowever, if you need to use a space, make use that\
    \ you also use double quotes as shown below:\n\n echo \"{John,Julius,Jacob} David\"\
    \n\nThe following will be the output of the above:\n\n ![](images/00031.jpeg)\n\
    \nYou might need such like output, so that’s how to get it. Consider the example\
    \ given below:\n\n echo {\"John \",\"Julius \",\"Jacob \"} David\n\nThe above\
    \ will give the following as the output:\n\n ![](images/00032.jpeg)\n\nBraces\
    \ can also be nested, whereby braces are placed within other braces as shown below:\n\
    \n echo {{a,b,c},a,b,c}\n\nThe following will be the output of the above example:\n\
    \n ![](images/00033.jpeg)\n\nConsider the example shown below:\n\n echo {{6,7,8}1,2,3)\n\
    \nThe output will be as follows:\n\n ![](images/00034.jpeg)\n\nThe question is\
    \ where is this trick that is brace expansion applied. Of course, when making\
    \ a backup of a file, you will need to use this trick hence it is very important.\
    \ An example of this is given below:\n\n cp /etc/httpd/conf/httpd.conf{,.backup}\n\
    \nIn the above example, we are backing up the httpd.config file.\n\n##  Command\
    \ Substitution\n\nThis is also another useful bash scripting trick. It includes\
    \ the use of the $ sign and parenthesis on the standard output to enclose any\
    \ command which is aimed at generating output. This trick is applied when assigning\
    \ some value to a variable.\n\nYou can assign the date to a variable as follows:\n\
    \n date +%d-%b-%Y\n\nThe above will give you the current date as shown below:\n\
    \n ![](images/00035.jpeg)\n\nThis can also be achieved using the following:\n\n\
    \  echo $today\n\n                     today=$(date +%d-%b-%Y)\n\nThe output will\
    \ just be the same. To get information about multiple RPM packages simultaneously,\
    \ you can also use command substitution.\n\nCommand substitution can also be achieved\
    \ after surrounding a command using back quotes. This can be illustrated using\
    \ the example shown below:\n\n day=`date +%d-%b-%Y`\n\n                           \
    \ echo $day\n\nThe above will give the following as the final result:\n\n ![](images/00036.jpeg)"
