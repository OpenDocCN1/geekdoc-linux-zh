    ### 5. Read any line of a file and assign it to a variable

    external programs assist the bash to read the lines of a program. Consider the
    code shown below:


    ```bash

    read -r rline < <(shuf file)

    ```


    `shuf` is available on modern Linux systems and helps in this. The above code
    will read a random line of a file and assign it to the variable `rline`.


    ### 6. To extract a tar archive, use the following command:


    ```bash

    tar xvf b.tar

    ```


    ### 7. To find the number of lines common between two files:


    ```bash

    sort doc1 doc2 | uniq –d

    ```


    ### 8. To randomize the lines of a file:


    ```bash

    shuf filename.txt

    ```


    ### 9. To sum a certain column:


    ```bash

    awk ''{ sum+=$1} END {print sum}'' document.txt

    ```


    # Conclusion


    It can be concluded that Linux is an open source operating system and it has various
    distributions. The idea behind development of Linux was to develop a free Unix-like
    operating system for computers. Each of the Linux distributions comes in two versions,
    that is, the server and the desktop versions. The desktop versions support both
    the GUI and the command line.


    By default, one accesses the GUI after login into the system. The command line
    can then be launched if needed. The server versions of these distributions support
    only the command line. No graphics in Linux servers. The purpose of this is to
    ensure security of these systems since hackers usually take advantage of any feature
    added to this system. This explains why you should be familiar with the Linux
    commands.


    The Linux command Line can be used for nearly everything needed in the system.
    One earns much respect in the society when they become experts in using the Linux
    command line. With shell scripting, programmers can put together multiple commands
    and run them simultaneously so as to achieve the desired output. This also saves
    on time and space available on the system. Shell scripts are preceded by the shebang.


    This alerts the system a shell scripts is just to be executed. These must be made
    executable and then execution will take place after this. `bash` stands for Bourne
    Again Shell. It is the default shell in most Linux distribution. `bash` scripts
    are run on the command line, and one can achieve much with them, and know much
    about the system. `bash` on-liners are also important in Linux. One can use them
    to play around with their files.


