    \nOnce you have run the command shown above, the date will be set to 1st April\
    \ 2015 and the time will be set to 19:50 hours.\n\n## grep command\n\nSometimes,\
    \ you might need to search for a pattern or a string from a certain file. In most\
    \ cases, the various Distros of Linux come installed with this command.\n\nHowever,\
    \ it is also possible to install it in case you find it not installed using the\
    \ following command:\n\n sudo apt-get install grep\n\nIf you are using Red Hat,\
    \ install it using the command:\n\n yum install grep\n\nRemember that we created\
    \ our file and named it myfile with the following content:\n\n ![](images/00011.jpeg)\n\
    \nWe want to search through it using the grep command. To search for the word\
    \ powerful in the file, the following approach should be used:\n\n grep ‘powerful’\
    \ myfile\n\nThis is illustrated using the figure shown below:\n\n ![](images/00012.jpeg)\n\
    \nThe command outputs the line of the file with the search word and makes the\
    \ search word red in color. This differentiates it from the rest of the words.\
    \ Notice the search is case sensitive.\n\nLet us search for the word ‘Powerful’\
    \ rather than ‘powerful’:\n\n ![](images/00013.jpeg)\n\nAs shown in the above\
    \ output, there exists no word ‘Powerful’ in the file. This is because we have\
    \ made the p uppercase. However, it is possible to make the search case insensitive.\
    \ This can be achieved using the –i option as shown below:\n\n ![](images/00014.jpeg)\n\
    \nThe –i makes the words ‘powerful’ and ‘Powerful’ the same, hence we will get\
    \ our result.\n\nTo perform a multiple search, which means that you will search\
    \ for several words in a file at once, we can still use the grep command. This\
    \ is demonstrated below.\n\n ![](images/00015.jpeg)\n\nNotice that in the figure\
    \ above, we are searching for two words, that is, command and powerful. The –e\
    \ option makes it possible for us to search for more than one word at once. Don’t\
    \ confuse the purpose of the –i option as it only makes the search case insensitive.\n\
    \nThe grep command can also be used to mean the opposite of your specification.\
    \ This is illustrated below:\n\n ![](images/00016.jpeg)\n\nFrom the figure shown\
    \ above, we have searched using the word ‘tool’ as our search criteria. The command\
