    ## 前言


    加工是重要的制造工艺之一。传统和非传统加工工艺在工业中都起着至关重要的作用。


    在现代制造时代，非传统加工方法由于高精度、优的的光洁度、刀具磨损小、操作噪音小得多 `etc.` 等各种优势而非常受欢迎。此外，由于新时代和新型材料具有高硬度、韧性和脆性
    `etc.` 等，有时很难通过传统的加工工艺进行加工。非传统加工方法现在已工业界广泛且频繁地使用。本书《非传统加工工艺进展》旨在阐明这些方法的最新发展。


    本书的主要目的是为读者提供有关非传统加工领域各种进展的详细信息。除了提供尖端信息外，本书还描述了各行业采用的现代技术水平。


    许多作者对非传统加工工艺的各个方面贡献了意见。所有作者的重点都是提供关于各种主题的最新、准确的信息。本书共贡献了九章内容，涉及了非传统加工的多个领域，如磨料射流加工、电火加工、热加工
    `etc.` 等。考虑到该主题对研究人员的热趋势，在每章的末尾都提供了引用良好的参考文献，以供有关该主题的更多信息。其中一章还关注了非传统加工与人工智能的关系以及它们与现代工业的关系。


    本书试图提供高质量的研究数据，旨在面向学术界和工业界。前者指从事制造领域的本科生、研究生及博士生，后者指其研发部门（R&D departments）正不断致力于改进加工工艺以生产尖端产品的工业企业。


