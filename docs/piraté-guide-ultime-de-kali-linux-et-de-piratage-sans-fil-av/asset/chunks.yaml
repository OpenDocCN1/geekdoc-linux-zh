  trans: '

    在工业中实施人工智能和机器人技术并不是采购机器人并将其接入应用那么简单。在 AI 能够对任何事物进行建设性自动化之前，还有许多不同的财务和政府政策考量需要考虑。每位生产者都会根据其行业、规划以及业务模式面临独特的挑战。然而，在制造业中实施人工智能通常面临诸多挑战。实施人工智能和机器人技术以实现卓越性能的挑战在于将原始信息转换为用于快速决策的智能预测。总而言之，人工智能的实施存在着各种挑战
    [25]。


    ### a). 数据

    目前框架的设计创建了部分信息，而先进行业是一个巨大的信息环境。任何情况下，机械数据通常是有组织的，但其质量可能很差。信息的质量可能缺失，与其他面向消费者的应用程序完全不同，来自机械框架的信息通常具有的物理含义，这使得很难通过增加数量来弥补质量问题。用于准备机器学习模型收集的数据通常缺少完整的工作条件和健康状态/故障模式，这可能导致
    AI 框架在在线过程中出现假阳性和假阴性。机械数据设计可能具有很强的时效性，解读它们需要空间掌握能力，这仅通过挖掘数值数据是无法满足的 [26]。


    ### b). 速度

    制造过程发生得很快，机器/装置和其他类型的设备价格高昂，用于各种应用的 AI 以及数据分析方法必须实时用于检测异常以防止浪费和其他影响。基于云的解决方案可能是有效且快速的，但不适用于特定的计算条件
    [24^-26]。


    ### c). 高保真度要求

    与具有较高错误容忍度的用户 AI 系统不同，错误率可能会影响机器人和 AI 系统的整体可靠性。AI 应用通常处理与保护、一致性和操作相关的关键问题。任何预测故障可能对客户产生负面影响并降低他们对
    AI 系统的信任。


    ### d). 可解释性

    通用的 AI 系统还应该优于预测结果，并为故障提供根因分析。这涉及数据科学家在通用应用开发期间与现场专家合作，并将现场流程整合进来。


    ### e). 员工技能与培训

    当执行新的 AI 机器人技术时，预计员工需要新的知识水平。许多员工将接受如何在这种环境中管理的培训，而其他工人将需要具备人工智能和机器人领域的资质和经验。


    ### f). 安全措施

    人工智能和机器人为环境中带来了许多现代安全风险，并且有严格的控制，包括自动化安全。制造商必须准备引入机器人以确保合规并为专家提供一个安全的环境。


    ### g). 系统预算

    制造商在将 AI 应用/软件实施到场所可能会面临运行和财务挑战。此类应用/软件可能包含可靠且昂贵的机器。人工智能和机器人通常涉及大量的投资，尽管价格正在下降。人工智能和机器人技术进入制造业对于初创公司和现有制造商需要巨大的资本投入，因此销售和生产在预计投资期间应保持稳定
    [27]。


    ### h). 工作流管理

    在引入 AI 决定什么样的工作流时，有许多考虑。AI 的引入和机器人部分的速度必须计算以确保最大的效率而不产生浪费。代表性技能、未使用的安全协议、预算和工作流管理是制造商在执行机械自动化框架时面临的最大挑战之一。实现新兴技术比购买它们更远。制造商应该准备从他们的
    AI 自动化框架中获得最大收益 [24^-27]。


    现在，是时候将传统的制造厂转换为智能 AI 工厂了，利用人工智能、物联网 (IoT)、数据分析和云计算。正如存在一个挑战——在这种情况下，这是一个获取问题。新时代将为研究人员、行业和学者带来许多变化和新的研究经验
    [28^-32]。


    ## 结论

    制造业非常适合人工智能和机器人的应用。尽管 AI 革命仍处于初期阶段，但我们现在正从这项技术中获得巨大的收益。从主要设计流程、生产车间、整个供应链到全面管理中使用人工智能，旨在改变产品制造和材料整合的方式。人工智能和机器人都可以嵌入产品和应用中，使其在生命和操作方面更加高效、一致、安全和稳健。在人工智能和机器人的支持下，工业自动化的水平和速度发生了根本性的变化。AI
    技术增强了传统应用的执行并开发了能力。例如 协作机器人。机械臂可以学习人类操作员的动作和路线，并在监督训练后执行类似的任务，这是人工智能的一部分。此外，AI
    还自动化了涉及人类参与的方法。


