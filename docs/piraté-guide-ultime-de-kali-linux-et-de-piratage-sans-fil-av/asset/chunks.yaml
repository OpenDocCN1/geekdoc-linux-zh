    # 制造业中的人工智能与机器人技术：机遇与挑战


    Hitesh Pahuja, PK Khosla, Balwinder Singh


    高级计算开发中心，印度旁遮普邦，莫哈利


    ## 摘要


    如今人类所做的一切工作，未来将由基于人工智能（AI）的系统完成，但速度将达到计算机级、规模和范围。人工智能正朝着制造业转型和制造工艺改进的方向迈进。根据福布斯技术委员会成员的观点，包括制造业在内的
    13 个不同行业将受到人工智能的变革。人工智能和机器人技术可以将复杂的任务转化为一致且精确的解决方案。随着工业机器人运行的日益频繁，标志着人工智能在制造流程中的部署大幅增加。人工智能（AI）被广泛应用并逐渐进入制造领域，通过学习算法实现学习和无错误决策，从而简化自动化。人工智能驱动的系统通过展示创新前景、通过提高效率促进货物生产，以及通过实施通用人工智能使机器交互更接近人类交互，为未来的制造业提供了一条更简单的路径，并产生了许多益处。这项技术使制造商能够克服制造业领域长期面临的各种挑战，例如专家人才短缺、决策不佳、集成相关问题以及数据过载。因此，在制造业中实施人工智能允许公司全面革新其流程。它允许智能人工智能机器人/机器收集并提取数据，识别各种模式，根据分配给它们的任务的复杂程度通过机器学习或深度学习从这些模式中学习并适应新环境。因此，在工业中部署人工智能和机器人将改变大规模生产以及无错误决策的能力。工业
    4.0 中的人工智能机器人可以执行持续性操作，例如从设计制造模型、开发专业知识、开发新的自动化解决方案、消除人为错误以及提供卓越的产品质量。伴随着人工智能的实施，机器人将取代人力并从事危险活动。结果是制造业所有部门的事故数量将下降。


    人工智能与机器人技术将解决制造商与未培训工人相关的问题。因此，企业家可以专注于工业的进一步现代化并将行业规模扩大到更高水平。除了采用人工智能等新兴技术带来的许多机遇外，工业家也面临一些挑战。人工智能和机器人技术进入制造业将需要初创企业和现有制造商投入巨资。但投资回报将是高的，因为智能机器开始负责日常活动，公司的运营成本将大幅降低。人工智能的支持者声称，技术只是自动化的演变形式，是第四次工业革命的可预测结果。人工智能在创造、改进和降低成本降低方面可能是高效的，但在处理口味和需求的意外变化方面，人类的智慧是不可替代的。


    **关键词：** 人工智能，数据，制造业，机器学习，机器人技术。


