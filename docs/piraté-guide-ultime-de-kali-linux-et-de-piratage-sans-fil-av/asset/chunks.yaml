    shape casting process and investment casting | Al, Cu, Cu-Brass | Rapid wire EDM
    process resulted in better dimensional accuracy. Net shape casting required lesser
    time for the electrode fabrication. Investment casting has edge over the other
    methods to produce complex shape electrodes. |


    | Balasubramanian and Senthilvelan [[52](#9789811483653-C2.html_c2r52)] | Casting
    and sintered powder metallurgy electrode | Cu | The cast copper electrode showed
    higher MRR, low TWR and higher surface roughness for EN8 and D3. |


    | Pal and Choudhry [[53](#9789811483653-C2.html_c2r53)] | Abrasive water jet machining
    | Cu and Brass | Deviations in the dimensions of the tool due to taper produced
    on the tool in AWJM and due to machining of side walls. |


    | Sahu *et al.* [[55](#9789811483653-C2.html_c2r55)] | Selective laser sintering
    | AlSiMg | The surface machined by AlSiMg tool electrode has lesser surface crack
    density. |'
