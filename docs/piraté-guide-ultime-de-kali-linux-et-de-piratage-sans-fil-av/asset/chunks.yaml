    电缘液（如去离子水）也存在于线电极和工件之间。电子从阴极移动并撞击在去离子水分子，释放出大量电子。这些电子再次撞击下一个去离子水分子。这一过程持续进行，同时正离子向阴极移动。通过这种方式，大量电子向阳极（工件）移动。电子的动能转化为热能并产生火花。这种火花能量将工件温度升高到约
    10,000°C。因此，工件材料发生了熔化和蒸发 [10]。过滤后的电缘液被泵入并持续流包裹工件和电丝电极。通过加工区的电极线的电能脉冲使电缘液汽化，从而吹掉工件和电线的微小部分。由于电丝由线轴连续送入，每当旧线段被切断并变成废料时，新的线段就会作为电极作用。然而，电丝与工件之间的间隙得到维持和控制，以产生精确的切面。此外，电缘液充当绝缘体，使间隙中产生高能量以产生火花。同时，它收集并带走碎屑，并减少侵蚀过程中产生的热量。


    线电火加工用于需要低残余应力的场合，因为去除材料不需要高切削力。如果每个脉冲的能量相对较低，由于这些低残余应力，预计材料的机械性能变化很小。尽管在传统的加工工艺中，未经过应力消除的材料在使用寿命期间可能会变形。由于该工艺的固有特性，线电火可以轻松加工复杂零件和精密元件。


    ### WEDM 工艺参数


    图所示了各种电气和非电气工艺参数、它们之间的相互加工关系以及 WEDM 的性能指标 (3)。为了经济加工条件，为这些参数选择合适的水平至关重要。可以考虑这些因素对输出变量的影响，设置输入变量，以获得最佳加工环境。


    ![](img/9789811483653-C7_F3.jpg)**图 (3)**


    WEDM 工艺和响应参数 [11]。


    ### 线电极属性


    WEDM 的加工性能通常取决于刀具电极各种物理、化学、电气和机械属性的组合。因此，线电极应具有良好的性能，以实现高精度和高精度的快速切削。表 1 列出了 WEDM
    线材的不同属性。


    表 1 WEDM 线材的本质属性 [12]。


    | 序号 | 属性 | 描述 |

    | --- | --- | --- |

    | 1. | 导电性 | 线导电率低会导致从电源到切削点距离上产生电压下降和相关的能量损失 |

    | 2. | 抗拉强度 | 抗拉强度为 900MPa 的硬线用于大部分工作，而抗拉强度在 490MPa 左右的半硬线和低于 440MPa 的软线用于角度大于
    5° 的斜切加工 |

    | 3. | 延伸率 | 硬线的延伸率远低于半硬线。脆性线在第一次过载条件下可能会断裂，而延性较好的线预计可以承受临时过载 |

    | 4. | 熔点 | 线电极应能抵抗火花的快速熔化 |

    | 5. | 几何尺寸 | WEDM 通常提供直径从 0.02 到 0.36 mm 的等的线。线直径的增加会增加供给到工作间隙的脉冲能量，从而提高整体材料去除率
    |


    图 (4) 展示了 WEDM 中线直径的增加 [13]。


    ![](img/9789811483653-C7_F4.jpg)**图 (4)**


    ### WEDM 工艺的进展


    WEDM 已证明自己是加工复杂几何形状硬材料的先进技术。表 2 显示了现代 WEDM。


    表 2 混合 WEDM


    | 序号. | 混合 WEDM |

    | --- | --- |

    | 1. | 线电火磨光 |

    | 2. | 微电火成隙 |

    | 3. | 线电火铣 |

    | 4. | 线电火车削 |

    | 5. | 磨粒线电火加工 |


    ### 电火磨光


    为了生产柱形微零件，优选择线电火磨光 (`WEDG`) 等加工工艺 [14]。在 `WEDG` 工艺中，以高精度加工棒和销钉等微型旋转零件 [15]。然而，`WEDG`
    工艺虽然可以制造微型旋转零件，但加工效率非常有限 [16]。


    ### 微型线电火磨光


    在微型 WEDG 中，砂轮的使用被作为电极的微线所取代。当需要磨光细棒时，它作为工件并在电极静止时旋转。这一过程利用电火花或热能从工件去除去除的材料以形成所需的形状
    [17]。然而，从技术和经济角度考虑，断线控制是微型 WEDM 工艺最关键的方面。


    ### 线电车削


    线电车 (`WEDT`) 工艺是制造微型轴对称元件的新兴非传统加工工艺之一 [18]。在 `WEDT` 和 `WEDG` 中，侵蚀机制与 WEDM 工艺相似，不同在于
    `WEDG` 中工件沿纵向进料，而不是像 `WEDT` 那样的水平方向。此外，`WEDG` 和 `WEDT` 工艺变体的工艺特征在于刀具与工件电极之间的相对运动以及进料。


    ### 磨粒 WEDM (AWEDM)


    在此过程中，电火花随磨粒一起磨损工件表面。通过将 WEDM 与细径磨粒相结合，可以实现更高的材料去除率和更好的表面光洁度。


    ## 钛合金 WEDM 的发展


    Srinivasan 和 Palani [19] 检查了硅化氮-氮化钛 (Si[3]N[4]-TiN) 陶瓷复合材料，表征其在 WEDM 中的表面完整性和疲劳性能。在对陶瓷复合材料的
    WEDM 表面进行扫电 (SEM) 观察时，发现了多种类型的缺陷，如微裂纹、微孔、颗粒、液滴和表面坑。此外，线电切割面的疲劳寿命比抛光表面减少了 25-35%。此外，抛光表面的硬度远优于加工表面。

