    Hsu *et al.* [48] 使用基于无化学电镀（镍镀）和电成型（铜）的快速原型制造技术制造了用于 EDM 工艺的电极。这种工艺缩短了制造周期并降低了电极制造的成本。实验观察表明，电极没有裂纹，且
    EDM 工艺取得了良好的结果。


    Monzon *et al.* [49] 尝试使用快速原型制造和电成型工艺来制造 EDM 电极。他们开发了铜电成型外壳测试方法。分析了成分、内应力、电解液添加剂、麻孔、尺寸精度和粗糙度等各个方面。与传统技术相比，在电极的重量和制造便利性方面取得了良好的结果。


    Egashira *et al.* [50] 通过线切割放电磨光和电化学加工相结合制造了超微钨工具。成功在黄铜和锌材料中钻出了半径小于 0.5 µm 深度大于
    1 µm 的孔。然而，孔的圆度表现并不理想，因为发现单个放电火斑的尺寸大于孔径。


    Meshram and Puri [51] 使用三种不同的方法：快速线电 EDM、网型铸造工艺和熔蜡铸造工艺来制造 EDM 电极。与另外两种方法相比，快速线电
    EDM 工艺具有更好的尺寸精度。网型铸造制造电极所需的时间更短。通过该工艺制造的铜黄铜电极获得了最高的去除率（MRR）和电损耗率（EWR）。熔蜡铸造在生产复杂形状电极方面优于其他方法。


    Balasubramanian and Senthilvelan [52] 使用铸造和粉末冶金铜工具电极对 EN8 和 D3 钢进行了 EDM 加工。与烧结电极相比，EN-8
    材料使用铸电极获得了更高的平均 MRR（77.4 mm³/min）和更低的平均 TWR（10.99 mm³/min）。在 D3 钢的 EDM 加工中，铸电极也显示出高
    MRR（136.1 mm³/min）和低 TWR（3.32 mm³/min）。与铸电极相比，烧结电极对 EN-8 和 D3 钢显示出更好的表面光洁度。


    Pal and Choudhry [53] 利用水射切割（AWJM）制造了用于 EDM 工艺的铜和铜电极。在保持电压、电流、占空比和脉冲宽度恒的情况下，在不锈钢和
    Ti-6Al-4V 上加工了孔阵。观察到水射切割制造的工具尺寸与工件尺寸之间存在偏差，如图（9**）所示。这归于两个原因：第一是由于水射切割喷嘴的固有特性导致工具上产生了锥度，从而在沿长度处产生了切缝；第二个逻辑是，由于工具侧面没有遮蔽，盲孔的侧壁也被加工了。


    ![](img/9789811483653-C2_F9.jpg) **图(9)**


    AWJM 的理想切割与实际切割 [53]。


    Goyal *et al.* [54] 研究了使用粉末冶金技术制造的 Cu-Mn 工具通过 EDM 工艺加工的 EN31 钢的硬度和 SR。放电电流和脉冲宽度被选择为加工变量。使用
    70Cu-30Mn 电极加工的表面微硬度为 913 VHN，比铜电极高出 11.94%，比 80Cu-20Mn 电极高出 3.39%。然而，由于粉末冶金电极具有多孔性，产生的表面粗糙度较高，尽管这种差异很细微。


    Sahu *et al.* [55] 探索了使用 SLS 制造的 AlSiMg 工具对镍钛进行 EDM，并将其性能与市场上石墨和铜工具进行了比较。选择表面粗糙度作为响应，以检查电极材料、电流、电压、脉冲宽度和占空比的影响。使用
    SLS 工具实现的平均表面粗糙度最低，其次是铜工具。


    Equbal *et al.* [56] 使用熔融建模（FDM）制造了 EDM 工具。使用丙腈丁二烯橡胶（ABS）作为芯材料，外壳通过镀铜生产。发现使用 FDM
    很难维持工具的尖锐边缘。尽管 FDM 工艺制造的工具性能与实心铜工具相当，但其尺寸精度较低。使用 FDM 制造精确工具尺寸的困难被认为是其原因。


    ### EDM 工具的主要研究


    | **研究者** | **电极方法** | **工具材料** | **备注** |

    | :--- | :--- | :--- | :--- |

    | Dimla *et al.* [40] | 快速原型，电镀 | 铜 | 足够。 |

    | Dur *et al.* [41] | 烧结，粉末冶金 | 青铜 | 达到了 12.5 mm³/min。 |

    | Li *et al.* [43] | 快速原型，喷涂金属 | TiC-W | 显示了溶解性。 |

    | Blom *et al.* [45] | 电成型，喷涂 | 实心铜 | 耗时相似。 |

    | Monzon [49] | 电成型，快速原型 | 铜 | 结果良好。 |

    | Egashira *et al.* [50] | 线切割磨光和电化学加工 | 钨 | 成功钻孔。 |

    | Meshram and Puri [51] | 快速线电 EDM、网型铸造和熔蜡铸造 | 铝、铜、黄铜 | 精度更好。 |

    | Balasubramanian and Senthilvelan [52] | 铸造和烧结粉末冶金电极 | 钢 | 粗糙度较高。 |

    | Pal and Choudhry [53] | 水射切割 | 铜和黄铜 | 尺寸偏差。 |

    | Sahu *et al.* [55] | 选择性激光烧结 | AlSiMg | 表面裂纹密度较低。 |


