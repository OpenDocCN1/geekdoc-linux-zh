    | **S.No** | **Author** | **Process** | **Contribution** |

    | --- | --- | --- | --- |

    | 1. | Haghbin *et al.* [[28](#9789811483653-C4.html_c4r28)] | AWJ milling | •
    Surface evolution model. • Micro channels Machining • Machining relatively deep
    slots |

    | 2. | Jafar *et al.* [[29](#9789811483653-C4.html_c4r29)] | AWSJ cutting | •
    Machining borosilicate glass • MMR • Surface improvement. |

