    manufacturing cost of the electrodes. The uniform dimension electrodes are cheaper
    and easy to produce but a complex shape electrode made by traditional machining
    process may cost 100 times than a simple shape electrode [[39](#9789811483653-C2.html_c2r39)].
    For the fabrication of complicate three-dimensional shape electrodes, different
    methods like conventional machining, electro-forming, metal spraying, casting,
    rapid prototyping or powder metallurgy are used [[17](#9789811483653-C2.html_c2r17),
    [40](#9789811483653-C2.html_c2r40)]. These techniques can also be helpful to reduce
    the lead time. A review of research attempts to fabricate the tool for EDM is
    presented below.


