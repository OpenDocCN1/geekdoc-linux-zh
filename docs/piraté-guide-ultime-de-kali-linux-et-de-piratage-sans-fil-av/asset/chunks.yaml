    # 电加工过程中的电极材料与工具制造技术


    Arminder Singh Walia, Vineet Srivastava, Vivek Jain, Amit Handa


    ¹ 机械工程系，Thapar 工程与技术学院，Patiala-147004, Punjab, 印度

    ² 机械工程系，I.K. Gujral 邦普技术大学，Kapurthala-144603, Punjab, 印度


    ## 摘要


    电火加工是一种用于硬加工和模具制造工业的先进加工工艺。电火加工的主要成本部分是电极的成本。传统使用的铜和石墨等电极材料耐磨性极低，因此磨损很快。目前人们正努力寻找具有导电性、导热性及耐磨性最佳值的电极材料。人们尝试了各种材料组合的复合材料以寻找替代工具材料。本研究综述了用于电火加工复合电极的不同材料及其制造技术。观察到，在各种不同的电极制造技术中，粉末冶金显示出非常有前景的结果。


    **关键词：** 复合材料，电火加工，电极磨损率，材料去除，粉末冶金，快速成型。


    ***


    **通讯作者 Arminder Singh Walia：** 机械工程系，Thapar 工程与技术学院，Patiala-147004, Punjab, 印度；电子邮箱：arminderwalia@gmail.com


    ## 引言


    在 21 世纪，产品开始由最耐用、因此也最难加工的材料制成。现代结构的持续发展需要能够抵抗日益增加的工作温度、机械负荷、机械变形和化学劣化的材料。工业需要产生具有极严公差和精细表面光洁度的复杂形状零件。


    为了满足这些要求，开发了先进的加工工艺，如超声加工 (USM)、磨粒喷加工 (AJM)、电化学加工 (ECM)、电子束加工 (EBM)、激光束加工 (LBM)
    和电火加工 (EDM)。这些方法在工具、模具、飞机、汽车和模具制造行业中起着关键作用。


    水射射加工具有较高的材料去除率，加工表面不产生热应力，而且是一种非常具有成本效益的工艺。然而，该工艺无法切割厚零件和复杂轮廓。该工艺产生的表面质量也较差。化学加工适用于薄零件的加工，且需要的设备很少。在此过程中不会产生残余应力。然而，用化学品的处理和处置增加了该工艺的加工成本。激光加工的零件受激光热效应影响，会导致加工表面变脆并引起表面裂纹。在超声加工中，加工表面的质量优于大多数其他现代加工工艺。尽管如此，材料去除率较低且成本竞争力不足是其缺点。电化学加工是一种生产复杂形状的精密工艺，尽管较低的材料去除率和化学处理使其在某些情况下并不理想。


    热电能对于低加工性材料和复杂几何形状的经济加工非常有用。电火加工是许多现代加工工艺之一，通过热原理去除材料。在各种先进加工工艺中，EDM 已广泛用于生产外科部件、模具和型具以及汽车和航空天工业的精加工零件。线电
    EDM 和电电 EDM 是常用的电火加工技术。


    ## EDM 的物理原理


    电电 EDM 过程如图 1 所示。EDM 过程可分为以下阶段：


    * 电子的冷发射和介质击穿

    * 火花的形成、熔化和蒸发

    * 等离子体通道的崩溃和冲洗


    ![](img/9789811483653-C2_F1.jpg) **图 (1)**


    电电 EDM 加工。


    ### 电子的冷发射和介质击穿


    在导电工具电极和工作电极之间提供电位差。该电位差在两个电极之间产生电场。它取决于电极间隙和两个电极之间存在的介质液的介电常数。导电材料具有足够的自由电子。随着电场的建立，由于电场的存在，自由电子开始从工具（负极）被拔出。电子将大量放电。这被称为“电子冷发射”。在电场中，由于工具为负极而工件为正极，电子将向工件加速。这两个电极之间的间隙由介电介质填充。由于介质的存在，电子将没有自由路径，因此面临阻碍。运动的电子将与介质颗粒碰撞。电子的能量将使介质分子电离。这将产生更多的离子和电子。


    ### 火花的形成、熔化和蒸发


