    如上一节所示，电丝在加工过程中的振动及其刚性起着至关重要的作用。因此，电丝材料的选择应基于其在拉强度和韧性方面具有高耐用性，以便以最小的振动吸收产生的所有振动和应力。研究表明，随着电丝成分中
    `Zn` 百分的增加，加工速度会提高，且对伺服电压的要求降低，从而减少了加工过程中发生短路的概率[26]。许多人员为了以最小的 TWR（热损耗率）和 SR（表面粗糙度）来实现最大的
    MRR（材料去除率）进行了研究。下面讨论了一些重要的电丝材料。


    ### 铜

    铜是最早用于加工电极的材料之一。但由于强度和低蒸气压等物理性能的局限性，限制了它在电火加工（WEDM）中作为电丝的使用[25]。


    ### 黄铜

    作为 `Cu` 的替代品，`Br` 在 WEDM 中发挥着非常重要的作用，具有良好的性能表现。它是 `Cu` 和 `Zn` 的合金，两种元素的含量分别约为
    63% 和 37%。加入 `Zn` 是为了表现出高拉强度、高蒸气压和低熔点[25, 26]。


    ### 涂层电丝

    发现电极涂层由于挥发温度较低，承受热冲击的概率较低。它包括具有高导电性芯的电丝，外层涂低熔点合金，最后再涂一层高强度合金，从而有助于提高加工速度。对这种涂层电极丝已进行了大量研究，其具有高加工能力和更好的冲水性，能产生误差最小、表面最光滑的切口。但唯一的缺点是成本高，并且可能导致电解液污染，从而造成环境限制[27]。


    ### 扩散退火电丝

    由于锌层具有良好的特性，可以认为纯镀锌电丝会产生高加工结果。`Zn` 提供了低熔点，并结合良好的冲水性。因此，可以说顶层具有高浓度或纯浓度 `Zn` 的扩散涂层可以产生令人满意的结果。为了生产这种扩散丝，对包覆材料进行退火，使合金在顶层均匀分布。通过这种方法，可以生产比传统电极材料具有更高耐磨性的电丝。与黄铜电极丝相比，所得
    EDM 电丝使生产率显著提高[28]。


    ## 冲水和电解液的影响

    电解液在 EDM 中以多种形式使用，如全浸、射流或喷淋冲水。在图 (5) 中，绘制了冲水压力对加工速度 (`Vs`) 和表面粗糙度 (`Ra`) 的影响。


    ![](img/9789811483653-C8_F5.jpg)****图 (5))**


    压力对 `Vs` 和 `Ra` 的影响[23]。


    压力流有利于持续移除火花产生过程中产生的蚀变为颗粒，在接近精加工时间时压力应减小。还观察到一个界限，超过该界限后无法进行充分加工；随着冲水压力增加到 1 Kg/cm²，可以获得更快的加工速度，在此之后加工速率会下降。当冲水压力小于
    0.3 kg/cm² 时，火花放电沿会出现高温区域。


    电解液除冲冲走蚀变为颗粒外，还执行多种功能，如在加工期间冷却工件和刀。它还帮助在大量能量积累之前，将火花能量集中在所需的较小加工区域并进行间隙绝缘。


    ## 智能电丝 EDM

    众所周知，行业正在发生变化，并引入了一场名为“工业 4.0”的新革命。研究证明，通过避免停机来减少各种意外成本，可以产生更好的结果[29]。可见，根据目前微加工的需求，需要引入一些智能因素，有助于以高水平的准确性完成此类工作。与传统的
    EDM 项目相比，已有许多项目向此类项目投入了大量资金[30]。在这一方面，强调要在加工时代引入一种新的智能因素，这可以优化各种控制参数并排除环境危害。这些因素不仅限于此，还具有自我调查和监控正在进行的各项任务的能力，并进行任何适当更改以获得最佳加工特性。这种影响在
    Walder *et al.* 等人最近的一项研究中可见[31]。由于电丝线电火花加工机（WEDM）配备了许多传感器和设备来监控过滤器和电解液等消耗品，这很大程度上取决于加工材料。机器上安装了传感器以对这些设备进行连续监控。

