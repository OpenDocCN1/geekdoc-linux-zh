  trans: '

    最常用的工具材料有金属（铜、黄铜、钨、铝*等**）、非金属（石墨）和复合材料（铜钨、铜碳化硅、铜碳化硼、铜石墨）*等*。由于具有高导电性和导热性，铜是最广泛使用的工具材料。尽管如此，在难加工材料中，发现铜电极的侵蚀速度更快[14]。铜的低熔点增加了电极的磨损率，导致工具形状发生变化。在电火（EDM）中，工件是工具轮廓的复制。加工腔的精度取决于工具的形状稳定性。因此，工具形状的任何变化都可能导致产品的形状和尺寸与目标不同[15]。


    为了减少电极磨损，过去研究人员提出的方法之一是制造具有改进机械、电气和热性能的改型工具[16^-18]。通过合金`Cr`和`Zr`等材料可以提高铜的强度，但这些元素在高温下溶解在铜中会失去这些属性[19]。为了避免这一问题，通过在铜中加入氧化物、碳化物和陶瓷颗粒制造铜基复合材料[20^-22]。当需要高导电性、高导热性以及高耐磨性时，铜基复合材料是良好的选择[23]。


    利用具有高熔点和耐磨性特性以及良好导电和导热性的材料来降低铜基电极的磨损。添加碳化物等陶瓷增强材料可以提高耐磨性和高温稳定性等特性。在铜基中引入`graphite`等材料会降低复合材料的强度。通过添加如碳化硅（`SiC`）等陶瓷增强材料可以增强复合材料的强度。它增加了复合材料的强度，但电阻率也会增加。由`SiC`和`Cu`制成的复合材料具有比`Cu`更好的延性和韧性，以及`SiC`增强材料的高强度[24]。在铜中加入碳化钛（`TiC`）可以提高其强度，但也略微降低了铜的导电性。`TiC`是一种硬材料，具有很高的熔点以及优异的抗热性和抗磨损性能[17,
    25]。通常，虽然某些工具材料的选择可以成功生产零件，但成本效益不高。


    ### 电极材料与趋势


    电极材料必须具有高熔点和低电阻率。电极材料的成功主要取决于被加工的材料以及特定的切削应用[26]。EDM 工具电极常用的材料有铜、黄铜、石墨、钨、银和钢。高工具磨损是这些类型电极关注的问题。人们正持续致力于开发一种具有低电阻、低热阻、高耐磨性且易于获取和制造的
    EDM 工艺工具材料[27]。


    陶瓷材料的研究当前趋势正从单材料向多材料电极转变。通过在基材料中加入一种或多种材料形成复合工具材料，工具的耐磨性、断裂韧性、硬度和抗热震性等性能得到了显著提高[28]。


    ### 案例研究


    Ozgedik 和 Cogun [12]研究了铜电极在 EDM 加工 1040 钢过程中工具的边缘和正面磨损。观察到随着放电电流的增加，工具内外端的磨损增加。还记录了随着脉冲宽度的增加，`TWR`增加。在静态冲水中，熔融金属的冲水不当导致材料去除率最低。注入冲水产生了最好的表面质量。


    Geric [13]研究了在氧化铝基中添加切削工具材料。还检查了它们的成分、强化和韧化机制。通过使用硬颗粒或晶增强了`Al[2]O[3]`基体的机械性能。在氧化铝基中加入碳化物、氧化物和氮化物后，观察到脆性降低。在氧化铝中加入`TiB`增强了复合材料的耐磨性。加入稳定氧化锆增加了耐磨性，但复合材料的微硬度却降低了。


    Srivastava 和 Pandey [18]测试了超声波辅助冷冷却 EDM 中烧结`Cu-TiC`和传统工具的工作。`EWR`随电流的增加而增加，但与铜刀具相比，陶瓷金属刀具的`EWR`较低。随着占空比的增加，火花能量增加，最终导致了更高的`EWR`。发现用`Cu-TiC`加工的表面裂纹密度和裂纹宽度较小。


    Khanra 等人 [27]利用烧结工艺制造了`ZrB[2]-Cu`复合材料，以获得工具热导、电导性和耐磨性的最佳值。复合材料是通过添加不同百分的铜制造的。在普通钢上对不同参数进行了测试。与铜工具相比，40%铜的复合材料导致更高的`MRR`和可接受的工具磨损率（`TWR`）。尽管传统的铜工具表现出较小的直径过火和表面粗糙度。`MRR`随铜百分比变化的偏差如图所示（2）。


    ![Images/9789811483653-C2_F2.jpg](img/9789811483653-C2_F2.jpg)

    图 (2)) MRR 随含含量的偏差 [27]


    Mohari 等人 [29]使用铜、铝、钛和碳化钨粉末制造 EDM 工艺的工具电极。制造颗粒使用的压实压力为 343 MPa。使用了坯坯、烧结和实心铜电极。碳钢和铝作为工件材料。与原材料相比，记录到坯和烧结电极的导电率较低。烧结和坯电极的磨损率是实心铜电极（0.32
    µm/min）五倍和九十。


    Kumar 等人 [30]使用正极`Cu-Cr`工具电极通过 EDM 加工哈斯氏合金。在 60V 电压和 18A 电流下实现了最高的`MRR`。此后电压和电流的进一步升高导致粉末冶金工具电极的材料在工件材料上沉积，导致材料去除率下降。由于高电流具有更高的能量，电流增加导致`TWR`增加。在电压
    60V 和电流 14A 时获得最佳表面粗糙度，因为超过这些电流电压值后`TWR`会增加。

