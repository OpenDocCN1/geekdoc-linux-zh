    *et al.* discussed about laser beam machining, its applications with the use of
    ultrashort pulsed laser. With a short pulsed laser, micromachining could be easily
    done and this was the advantage of this process. Still, in this field of laser,
    development is on the way and the research continues in this field [[8](#9789811483653-C3.html_c3r8)].
    Sun *et al.* summarized the progress and benefits of thermally enhanced machining
    of hard and brittle materials in which material was removed by the external heat
    source. It was observed that laser beam machining can improve the machinability
    in terms of longer tool life, reduction in cutting forces and better surface finish
    for composite and ceramic materials. It observed that saving in cost of tool and
    reduction in tool changing time, the life of tool increased in laser and plasma-assisted
    machining [[9](#9789811483653-C3.html_c3r9)] Dhar *et al.* reviewed the laser
    drilling process and techniques to solve the issues during high quality and accurate
    holes. The three drilling techniques were discussed. These were single-pulse drilling,
    trepanning and helical drilling. With these drilling techniques, small to large
    size holes can be produced. It was concluded that drilling time was more from
    total time and hence drilling cost was increased. Laser beam drilling has the
    potential to reduce the drilling time through better control of the process [[10](#9789811483653-C3.html_c3r10)].
    Pham *et al.* proposed a new technique of machining of alumina material with a
    laser milling process. Basically, in earlier days, the machining of the ceramic
    component was very costly because it required costly tooling. In the current paper,
    the material removal characteristics of this process are reviewed. The results
    showed that complex geometry can be produced with laser beam milling without the
    need for expensive tools. So, it concluded that this process was cost-effective
    if ceramic components were produced in batches [[11](#9789811483653-C3.html_c3r11)].
    Dubey *et al.* investigated the hybrid processes influence in today''s industries.
    In recent years, laser and non-laser hybrid processes are becoming more popular.
    Laser and non-laser hybrid conventional machining processes comprises of laser-assisted
    turning and grinding. Similarly, laser and non-laser unconventional hybrid machining
    processes comprises of laser-assisted ultrasonic machining, laser-assisted electrochemical
    and electrical discharge machining. Yue *et al.* found a deeper hole with a much
    smaller recast layer during ultrasonic-assisted laser drilling as compared with
    laser-assisted drilling without ultrasonic aid [[12](#9789811483653-C3.html_c3r12)]
    [[13](#9789811483653-C3.html_c3r13)]. Low *et al.* reported an investigation of
    taper hole formation during laser drilling. It was general problem of laser percussion
    drilling. The taper in hole could be controlled by a laser beam with variable
    pulses. With identical pulses, the taper hole could be easily seen during drilling.
    The new approach utilised to produce zero, negative and positive holes [[14](#9789811483653-C3.html_c3r14)].
    Dubey *et al.* studied the effect of process parameters on the performance of
    Nd: YAG laser beam machining. The investigation was done with the design of experiments
    for drilling, micro-drilling and cutting operations. The results showed that Nd:
    YAG laser beam machining can be successfully applied for machining due to the
    capability of changing wavelength and frequency. With this process, a micro-hole
    up to 5-micron meter and the thin sheet of 4-micron meter can be easily machined
    [[15](#9789811483653-C3.html_c3r15)]. Kibria *et al.* experimented with Nd: YAG
    laser micro turning on the cylindrical workpiece of ceramic material as this has
    a great advantage in automobile, medical and electronic industries. The depth
    of cut and surface roughness of material by varying process parameters was analysed.
    The results showed that process parameters have a great influence on achieving
    the depth of cut and surface roughness. Optical and SEM micrographs have been
    analysed for proper knowledge of the laser micro process parametric setting. It
    found that lamp current 23 amp, pulse frequency 800HZ, scanning speed 6.6 mm/s,
    good surface finish obtained after single laser beam micro-turning [[16](#9789811483653-C3.html_c3r16)].
    Kim *et al.* performed the study on the hybrid process, the new process was laser-assisted
    turning. In this process, laser-assisted machining and CNC lathe were utilised
    for machining. Three issues were discussed in laser-assisted turning. These were
    the machining process, heat treatment and device mechanism. In this process, high
    power diode laser has been utilised instead of CO[2] or Nd: YAG laser. As it has
    a high absorption rate than others due to its short wavelength. In the field of
    laser beam turning very small work has been observed, especially for milling.
    So, it becomes a necessity to research in this field [[17](#9789811483653-C3.html_c3r17)].
    Phiphon *et al.* utilized the general algorithm to improve and optimize the process
    parameters of laser beam machining. Experiments and mathematical models are designed
    using response surface methodology and then general algorithm applied to get optimum
    results. The best results in terms of surface roughness and kerf taper were obtained.
    Thus, results proved that the general algorithm is a good optimization technique
    [[18](#9789811483653-C3.html_c3r18)]. Loumena *et al.* discussed the hidden potential
    of light-weighted CRPF material. Laser processes increase the feasibility of this
    high strength and good corrosion resistance material through machining. In the
    experiment, nanosecond laser, based on new generation BOREAS series which have
    certain technical specification was utilised. With the use of this laser, drawbacks
    of more heating of CRPF materials reduced up to some level and suggested to use
    excimer, rod-type fibre laser in the near future [[19](#9789811483653-C3.html_c3r19)].
    Mishra *et al.* elaborated on the coupled methodology for the development of a
    prediction model for laser beam percussion drilling. The two methodologies, finite
    element analysis and the artificial neural network, were utilised. The experiment
    was conducted for hole taper which created during the laser drilling process.
    The optimised parameters show great improvement in reducing hole taper by 67.5%,
    reduction of heat affected zone by 3.25% and increases in material removal rate
    by65% [[20](#9789811483653-C3.html_c3r20)]. Nasim *et al.* discussed the diode
    laser dependent technologies along with measuring techniques. It could produce
    a very small size having the reliability of machining. The application of the
    process is in medical for cancer recognition, explosive detection, monitoring
    of air and water quality. The current paper represented diode laser use from medical
    laboratory to industries for doing machining [[21](#9789811483653-C3.html_c3r21)].
    Venkata *et al.* reviewed all non-conventional machining processes and the main
    attention was on optimization parameters of these processes. The processes are
    electrochemical machining, micro-machining, nano machining, hybrid processes and
    laser beam machining. The purpose of this review was to give an overview of all
    processes and to give direction for new research in this field. The comparison
    of these with their allied processes was represented in this paper [[22](#9789811483653-C3.html_c3r22)].
    Venkatesan *et al.* summarized the laser-assisted machining and it’s potential
    to cut hard and brittle materials which was a hybrid method. In this paper, laser
    assisted machining of titanium alloy, nickel-based alloys, ceramics, composites
    were studied and left the scope for optimization of laser assisted machining process.
    It was concluded that the hybrid process can be used to increase the performance
    of materials which were difficult to machine with conventional methods [[23](#9789811483653-C3.html_c3r23)].
    Liu *et al.* introduced the ultrasound-assisted water confined laser micromachining.
    Actually, during laser beam machining, many defects produced and also generated
    chips was deposited on the workpiece material. It produced harmful thermal residual
    effects. In this paper ultrasound assisted water confined laser machining was
    introduced which eliminated the defects which were produced in laser beam machining.
    The results showed that less deposition of debris observed in this [[24](#9789811483653-C3.html_c3r24)].
    Mishra *et al.* discussed about ultrashort laser pulses for creating micro-machining
    in hard materials and its analysis. Industries can utilize this advanced method
    of machining. It was called laser beam micro-machining whereas, in laser beam
    machining, high laser pulses were utilized. Laser beam micro-machining is used
    for making read-only memory chips, 3d sized structure and biological optical chips.
    The current paper highlighted the nature of short or ultrashort laser pulses,
    having interaction with different types of materials [[25](#9789811483653-C3.html_c3r25)].
    Darnish *et al.* compared the two-machining medium, wet and dry which was employed
    for machining Inconel 718 superalloy. It was found that machining underwater was
    more productive than dry medium [[26](#9789811483653-C3.html_c3r26)]. Ahman *et
    al.* compared the micro-EDM and laser machining, a hybrid process. It was observed
    that with this process machining time was reduced between 50-65% without compromising
    the quality of micro-holes. The micro-holes were drilled in Ni-Ti alloy which
    was difficult to machine by the conventional machining process. So, this hybrid
    process was utilized to machine it. Micro-EDM process is utilized for making holes
    less than 200micron meter. The material removal rate with the brass electrode
    was relatively higher in micro-drilled hole of Ni-Ti alloy and 40-65% increase
    observed without compromising the quality of micro-hole [[27](#9789811483653-C3.html_c3r27)].
    Alahmari *et al.* presented the laser beam machining underwater for the fabrication
    of micro-channels in nickel-based Inconel 718 super alloy and different parameters
    of laser analyzed results showed that underwater laser beam machining can improve
    the quality of workpiece [[28](#9789811483653-C3.html_c3r28)]. Lee *et al.* reviewed
    the laser and arc heat source for machining individually. The laser arc assisted
    hybrid process was purposed by the author [[29](#9789811483653-C3.html_c3r29)].
    Firdaus *et al.* reviewed the tribological aspects of the surface properties of
    the material. Laser beam machining using Nd: YAG laser was used to improve the
    surface texture by reducing wear and friction. In this paper, surface texturing
    was compared between two performing ways. Generally, in most methods, texturing
    was done directly on workpiece and in certain cases, researches conducted it on
    a coated material. The coated materials contribute to reducing friction and wear.
    Research showed that ceramic coated material was utilized to improve the surface
    texture by removing friction and wear [[30](#9789811483653-C3.html_c3r30)]. Lee
    *et al.* reviewed the laser assisted hybrid processes as these processes had a
    great impact on various hard to cut materials. With the use of these processes,
    improvement in machining was observed and reduction in cutting forces up to a
    large extent was identified too. The characteristics of different lasers were
    discussed and compared. The CO[2] has a higher wavelength [[31](#9789811483653-C3.html_c3r31)].
    Wang *et al.* demonstrated the drilling of ceramic material with laser beam machining.
    The quality of the drilled hole was studied and computational approaches were
    utilized for input parameters of laser beam machining. Different methods of ceramic
    drilling were discussed and more work is still required in the field of laser
    drilling to achieve more accuracy [[32](#9789811483653-C3.html_c3r32)]. Mistry
    *et al.* focused the study on liquid -assisted laser beam micro-machining. This
    was great approach to machine the surface of the material at the micron level.
    With this process thermal damage, due to high heat and poor surface finish, can
    be improved up to some extent. To understand the process parameters, the finite
    element simulation technique was utilised. Results showed that machining underwater
    gave good results by reducing surface damage and improving surface finish. Micromachining
    was performed with or without the use of liquid [[33](#9789811483653-C3.html_c3r33)].
    Dutt *et al.* focused the research on pulsed Nd: YAG laser beam in the drilling
    of different high strength, hard to cut materials like superalloys, composites,
    ceramics, ferrous and non-ferrous materials. The review was emphasized on the
    use of laser for drilling of different material for increasing the productivity
    of the process [[34](#9789811483653-C3.html_c3r34)]. Sherpa and Pradhan explored
    the various parameters to enhance the micro-machining of different materials using
    Nd; YAG laser. The diode-pumped solid-state laser was used for micro-machining.
    The material removal rate was found to increase linearly with an increase in frequency.
    Surface roughness was also found to increase with respect to diode current [[35](#9789811483653-C3.html_c3r35)].
    Rana *et al.* studied the different techniques for checking the machining effect
    on material and reason for change in material properties. Researchers also explored
    the use of laser beam machining in the industries, especially aerospace, military
    and aviation. Various techniques were implemented like Taguchi method, genetic
    algorithm, response surface method. The inter related parameters were observed.
    The result indicated that during mild steel cutting, oxygen gas gave the best
    results for machining thicker material than inert gas [[36](#9789811483653-C3.html_c3r36)].
    Faisal *et al.* reviewed the laser beam machining and laser beam micro-machining
    processes. These techniques brought a revolution in the field of machining to
    hard material. The laser process has been utilised in medical, aerospace and communication
    also. The laser can produce a hole < 0.3 mm in diameter. That’s why it is also
    called laser beam micro-machining as this size cannot be obtained through any
    other conventional or non- conventional machining process. Metal micromachining
    includes both micro-drilling and micro-milling. The recent advancement in the
    field of laser micromachining has been observed [[37](#9789811483653-C3.html_c3r37)].
    Holmberry *et al.* evaluated the surface condition of a workpiece after machining.
    Three non-conventional machining processes were considered and compared for surface
    integrity. The processes were abrasive water jet machining, electro- discharge
    machining and laser beam machining. The experiment was performed on alloy 718\.
    The result showed that abrasive water jet machining produced good quality surface
    conditions with low surface roughness as compared to EDM and LBM. This was the
    main objective of the investigation [[38](#9789811483653-C3.html_c3r38)]. Vasanth
    *et al.* performed experiment by doing machining on buffalo leather. The CO[2]
    laser was utilised for cutting purpose and it was observed that laser beam machining
    could reduce the poor quality/waste formation on the leather surface as compare
    to manual process [[39](#9789811483653-C3.html_c3r39)]. Zhai *et al.* performed
    experiment for Ni based alloy with thermal barrier coatings by percussion drilling
    in Inconel 718 material with a thickness of 2000-micron meter with femtosecond
    laser. With this process, zero taper hole was produced on nickel-based alloy having
    inner diameter 162-micron meter. Nd:YAG solid state femtosecond laser was utilised
    for percussion drilling. The study provided the feasibility of femtosecond laser
    for machining film cooling hole of turbine blades [[40](#9789811483653-C3.html_c3r40)].
    Hofy *et al.* reviewed the research work carried out in machining of carbon fibre
    reinforced polymer (CRPF) material by laser beam machining. In this paper, various
    techniques were critically analysed to improve productivity by reducing machining
    time and increasing material removal rate. With the conventional machining process
    of the CRPF material, the tool wear rate was higher as compare to non-conventional
    machining. So, the study showed laser beam machining as an alternative process
    for CRPF material with better accuracy [[41](#9789811483653-C3.html_c3r41)]. Abdo
    *et al.* evaluated the performance of the laser process in which micro-channels
    of v & u-shaped cross-sections were obtained. The study continued at two points;
    one was the geometrical characteristics and other quality of machined micro-channels.
    The two techniques were utilised ANOVA and SEM. The following observations were
    noticed. Control laser parameters can produce high value of laser intensity to
    produce v & u secondly, the surface finish of the channel can be obtained nearly
    2-micron meter [[42](#9789811483653-C3.html_c3r42)].'
