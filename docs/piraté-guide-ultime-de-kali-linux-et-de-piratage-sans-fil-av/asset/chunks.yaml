- fmt: '

    The manufacturing industry has been considered with the highest degree of self-learning
    automation, complete technically AI robotic factories still seemed far away. Still,
    AI-characterized robotics is placed to shift that trend. The AI-enabled robots
    with superior ingenuity and self-sufficient learning abilities will transform
    the production process in Industries [[5](#9789811483653-C9.html_c9r5)^-[8](#9789811483653-C9.html_c9r8)].
    Whereas, research in this sector is facing major challenges, in terms of budget
    constraints. To overcome these designs, parameters for raw material, manufacturing
    techniques, and other details can be integrated into the software which performs
    on all feasible arrangements of input variables and recommends best designs. The
    output is further enhanced and improved with each repetition with the utilizing
    of artificial intelligence techniques. Hence, these promising technologies can
    offer us with superior designs and wipe out the trash. Currently, fault detection
    methods and tools are not accurate as compared to AI-based machines, resulting
    in a worthless production of trillion rupees in the manufacturing sector. To beat
    this a simulated model of a procedure, product, and supply chain can be formed
    called a digital twin. It is a blend of data with intelligence that signifies
    the behavior and framework of a system. This technique can improve the efficiency
    of data usage by handling only crucial information and removing junk information.
    The machine learning algorithms have an advantage in visual pattern identification,
    assisting in physical scrutiny of assets in the complete supply chain management
    [[9](#9789811483653-C9.html_c9r9)^-[11](#9789811483653-C9.html_c9r11)]. Using
    supervised or unsupervised algorithms, applications can distinguish with damage
    or wear and tear. It can be able to organize the list of actions and recommend
    a corrective solution for restoring the problem in assets. Supply Chain Management
    can be done by advanced AI algorithms. As the supply chain is the backbone of
    the production industry. AI-enabled machines or robots will help in reducing cost
    in transportation, management of warehouse and efficient supply chain management.
    These machine learning algorithms are capable of processing huge, diverse data
    set on a real-time basis for demand-supply prediction. In an AI-based supply chain
    model, reduction in freight costs and improving supplier delivery will be accomplished
    [[12](#9789811483653-C9.html_c9r12)]. Moreover, the process of inventory management
    can be accomplished with AI-enabled machines in the future. Because, most of the
    supply chains have to face the recent face of globalization, unstable demand,
    and progressively distinguished, adapted, and composite products. There is a massive
    task of matching customer facilities while taking care of inventories. The discomfort
    zones in inventory management have always been overstocking of inventory and failure
    to track important things or items. Here, AI machines will help in real-time supervising
    and optimization of assets. AI-enabled robots can assist with improved supply
    and demand planning. The foremost purpose of an inventory optimization result
    is to deliver customers with the precise product, at the accurate location, the
    right time along with the lowest inventory management. There will be a smart optimization
    solution that routinely modifies inventory levels to precisely meet up customer
    demands, enhancing service levels, reducing costs, and boosting inventory turnover
    of companies [[13](#9789811483653-C9.html_c9r13), [14](#9789811483653-C9.html_c9r14)].
    Machine learning algorithms will help in inventory optimization across the whole
    supply chain and increase protection by automating hazardous activities. Processing
    real-time data and dangerous jobs can be handled with minimum impact with the
    deployment of AI robotics. These AI robots can work in risky situations like furnaces,
    hazardous material, boilers, welding, and die-castings, `etc.* while the above
    at a precision level cannot be achieved by existing procedures. Furthermore, advancements
    in the field of emerging technology like AI robotics is opening streets for a
    hybrid workforce where robots and machine manage collectively. They both work
    together to improve productivity along with creating additional posts that are
    facilitated by AI technology. Nowadays, robots are doing work in a fashion as
    illustrated in science fiction stories before. Although there are immense scopes
    and advantages of using robotics enabled with AI in manufacturing, the benefits
    of AI robotics far surpass the challenges in its implementation. The scope and
    potential of this technology in manufacturing and production will make the next
    industrial revolution in the future [[15](#9789811483653-C9.html_c9r15)^-[18](#9789811483653-C9.html_c9r18)].


    ## OPPORTUNITIES AND ADVANTAGES


    The employ of AI and robotics will boost productivity and can create more manufacturing
    production work in countries like India. Labor is expected to get a substantial
    portion of the profits with AI and robotics technology. The implementation of
    AI and robots is exceptionally helpful in the manufacturing sector as it will
    improve the quantity and quality of productions, efficiency and speed in production.
    The induction of AI robots is to turn out to be a boom in the manufacturing industry
    [[19](#9789811483653-C9.html_c9r19)]. AI robots can take training with labeled
    data set like humans learning, to operate more efficiently, including the new
    instructions that were not initially projected in the initial programming.AI based
    Robots will work as human do, but in spite of break, they will work continuously,
    As they don''t get bored, hungry or tired. The abilities of robotic with AI technology
    are far and wide beyond human capability, once it extends to miniaturization and
    precision measurements [[20](#9789811483653-C9.html_c9r20)]. Moreover, these emerging
    technology in the manufacturing sector will bring exceptional superior quality
    guarantees in the future. AI and robotics can transform the complicated task into
    consistent along with precise solutions. With the increasing operation of the
    industrial robot has drastically marked an increased deployment of AI in manufacturing
    processes. Artificial Intelligence (AI) is widely applied and is gradually approaching
    in the manufacturing segment, easing the automation with learning and error-free
    decision-making using learning algorithms. AI-driven systems are placing a simpler
    route to the future manufacturing industry by producing a lot of benefits by presenting
    innovative prospects, boosting production of goods with improving efficiencies,
    by implementing general AI to make machine interaction closer to human interaction.
    The AI-enabled robots with superior ingenuity and self-sufficient learning abilities
    will transform the production process in Industries. Whereas, research in this
    sector is facing major challenges in terms of budget constraints. To overcome
    these designs, parameters for raw material, manufacturing techniques, and other
    details can be integrated into the software which performs on all feasible arrangements
    of input variables and recommends best designs [[21](#9789811483653-C9.html_c9r21)].
    The output is further enhanced and improved with each repetition with the utilization
    of artificial intelligence techniques. There are several advantages with AI and
    robotics in the manufacturing sector as shown in Fig. ([`3`](#9789811483653-C9.html_c9f3)).
    The detailed benefits of AI based systems are given in detail.


    ![](Images/9789811483653-C9_F3.jpg) **Fig. (3))**


    Role of AI and Robotics in Manufacturing Industry.


