    Goswami 和 Chakraborty 利用了两种技术进行超声波加工过程的参数优化。这些技术分别是引力搜索和烟花对数。作者开发了最佳优化结果，与引力搜索相比具有较高的材料去除率[18]。


    Agarwal 研究了玻璃材料的超声波加工。该研究侧重于材料去除机制和去除率。结果显示，随着粒径的增大，材料去除率随之增加。建立了冲击力和材料去除率之间的关系。分析表明，增大刀端的静态载荷幅度可以提高材料去除率。另一方面，随着粒径增大，材料去除率反而降低，因为工件碎片导致工具无法振动。研究发现，只有适当控制参数才能提高材料去除率[19]。


    Ning 讨论了 CFRP 复合材料在航天和飞机工业中的重要性，因为它具有优越的性能。研究比较了两种加工方法：旋转超声波加工和磨削。研究中考虑了切削力、表面光糙度、扭矩、孔径和材料去除率等切削参数。比较表明，在
    CFRP CFRP，旋转超声波加工的表现优于磨削[20]。


    Wang *等人* 研究了 C/Sic 复合材料钻孔时孔处的撕裂缺陷问题。开发了一种新型工具并与普通钻进行了比较。使用复合阶锥钻时孔处的效果更好。由于使用了这种钻，撕裂缺陷问题得到了减少。过程中保持了以下加工参数，如
    2 mm/min 的进给速度和 2000 rpm 的转速。结果显示，使用复合阶锥钻将撕裂尺寸缩小了 30%。钻出过程中产生的缺陷有毛刺、边缘崩口*等*[21]。


    Aminiet *等人* 研究了超声振动辅助车削过程中的摩擦学特性。考虑了摩擦系数和磨损率等切削参数进行评估。ANOVA 结果显示，摩擦系数的有效性为 32.32%[22]。


    Singh 和 Singhal 回顾了非传统的混合加工过程*即*旋转超声波加工。与静态超声波加工一样，磨粒颗粒在加工过程中不断插入工具和工件之间。振动的工具冲击工件并发生材料去除。在这个过程中，工具和工件之间没有直接接触。因此材料去除较少。加工结果不符合规范。这导致旋转超声波加工、传统金刚磨削和超声波加工相结合产生了钻孔缺陷，如孔径过、偏心孔和壁面侵蚀*等*。因此，与传统磨削和超声波加工相比，材料去除率更高。在旋转超声波加工中，振动钻头被旋转，金刚磨粒颗粒在钻孔过程中融合在刀尖。这种过程与传统磨削和静态超声波加工相比，提供了更高的去除量、改善的表面粗糙度和加工孔的精度[23]。


    Zhen *等人* 对陶瓷基复合材料进行了研究。研究中观察到，与传统铣削相比，旋转超声波加工的效率提高了 5.8 倍，表面质量改善了 54%[24]。


    Ning *等人* 展示了 CFRP 复合材料的旋转超声波表面加工与传统表面磨削之间的比较。研究了磨粒颗粒的运动学运动并进行了比较。在分析磨粒运动学运动时，假设磨粒是具有相同直径的球形。形状在加工过程中保持不变。实验结果表明，旋转超声波表面加工产生了较小的进给切削力、轴向切削力和扭矩。此外，旋转超声波表面加工产生了比传统表面磨削更大的表面粗糙度。其原由于垂直超声波振动[25]。


    Feng *等人* 讨论了钻孔孔处的撕裂缺陷。实验显示该缺陷是由于较大的推力引起的。旋转超声波加工减少了推力，观察到撕裂缺陷减少了 60%。实验结果表明，该研究减少了约
    55% 的推力。粒径对推力的影响更大并在一定程度上会减少[26]。


    Wang *等人* 研究了刀具磨损机制与其材料去除率的关系。实验使用了三种不同材料的工具，分别为 304 不锈钢、1045 碳钢和钨。刀具磨损的影响导致了低去除率（MRR）和加工不准确。加工过程中观察到
    304 不锈钢工具最适合微型超声（USM）。刀具磨损和磨粒磨损较低，有助于去除更多材料。304 不锈钢工具的内部表面硬度低于外部表面。复合表面材料（软硬）保证了低刀具磨损和颗粒磨损[27]。


    Wang *等人* 研究了超声波加工的潜力并调查了磨粒的形状。研究中取了两种不同形状的磨粒。形状为立方体和球形，填充了碳化硅和氧化铝。结果表明，球形硬质磨粒（`Al[2]O[3]`）能很好地抵抗刀具磨损，如图（`1`](#9789811483653-C1.html_c1f1）所示。这提高了超声波加工期间的材料去除效率及其性能[28]。


    ![](img/9789811483653-C1_F1.jpg)**图 (1))**


    钻孔过程中使用的不同磨粒的刀具磨损率趋势。


    Wang *等人* 展示了旋转超声波加工中的切削力和材料去除机制。简述了钻孔产生的缺陷，如边缘崩口、撕裂缺陷和次下损伤。还描述了损伤减少技术和工艺参数优化。加工过程中，孔处产生了损伤。如果切削力小于临界切削力，就可以减少这种损伤。通过优化工艺参数，可以减少加工期间损伤[29]。


    Wang *等人* 研究了旋转超声波加工中的临界切削力。分析切削力是为了开发超声波机床设计和制造所需的新指标。在文中，分析了切削力对工艺参数和超声幅的影响。还分析了临界切削力对旋转超声波机床的影响并讨论了改进方法[30]。


