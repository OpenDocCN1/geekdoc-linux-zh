    The physical properties of electrode influence the machining performance. High
    electrical conductivity, high specific heat, good machinability, high erosion
    resistance *etc.* are the properties which an ideal electrode must possess. A
    single material cannot fulfill all these requirements. Traditional machining methods
    are mostly used for fabricating the electrodes for EDM [[38](#9789811483653-C2.html_c2r38)].
    Complexity of the geometry and the precision required commonly determines the
    manufacturing cost of the electrodes. The uniform dimension electrodes are cheaper
    and easy to produce but a complex shape electrode made by traditional machining
    process may cost 100 times than a simple shape electrode [[39](#9789811483653-C2.html_c2r39)].
    For the fabrication of complicate three-dimensional shape electrodes, different
    methods like conventional machining, electro-forming, metal spraying, casting,
    rapid prototyping or powder metallurgy are used [[17](#9789811483653-C2.html_c2r17),
    [40](#9789811483653-C2.html_c2r40)]. These techniques can also be helpful to reduce
    the lead time. A review of research attempts to fabricate the tool for EDM is
    presented below.


    ### Experimental Work and Material Properties


    Samuel and Philip [[16](#9789811483653-C2.html_c2r16)] carried out experimental
    work and observed that with P/M method tool electrodes can be fabricated with
    ease and its properties can be controlled rather easily, consequently gave it
    an edge over other electrode fabrication methods. The effect of compaction pressure
    on relative density and on green strength is shown in Figs. ([**7a**](#9789811483653-C2.html_c2f7)
    and [**b**](#9789811483653-C2.html_c2f7)). At low sintering temperature and compacting
    pressure gap contamination was more and higher electrode wear was observed. Low
    metal removal at low current and high frequency was noticed due to surface properties
    of powder metallurgy electrodes. Low compact pressure and sintering temperature
    resulted in poor mechanical strength and high tool wear.


    ![](Images/9789811483653-C2_F7.jpg)**Fig. (7))**


    Influence of compaction pressure on **(a)** Relative density **(b)** Green strength
    [[16](#9789811483653-C2.html_c2r16)].


    Samuel and Philip [[39](#9789811483653-C2.html_c2r39)] during the study used copper
    (Cu) powder with 99.7% purity as tool material and fabricated the tool using powder
    metallurgy (P/M) process. Increase in conductivity was found with the rise in
    sintering temperature and compacting pressure. The electrode compacted at low
    pressure had low mechanical strength. High sintering temperature increased the
    bond strength and decreases erosion. Thus, the increase in compacting pressure
    and sintering temperature resulted in change in electrical, thermal, mechanical
    and microstructural properties resulting better performance.


    ### Coating and Fabrication Methods


    Dimla *et al.* [[40](#9789811483653-C2.html_c2r40)] applied stereolithography
    and direct metal laser sintering for the coating of models to fabricate the tool
    for EDM process. The quantity of copper deposited on models by both methods created
    problems. The used processes were unable to deposit even layer of copper on the
    models and it varied from 50-1000 µm. These methods were not able to deposit required
    amount of copper, especially in the inner parts of the electrodes. The thickness
    of coating decreased from the outer surface to the inner walls and the tool electrodes
    were not found suitable for EDM. The variation in copper thickness inside vertical
    wall of electrode is shown in Fig. ([**8**](#9789811483653-C2.html_c2f8)).


    ![](Images/9789811483653-C2_F8.jpg)**Fig. (8))**


    Measurement of copper deposition on inside vertical wall of electrode [[40](#9789811483653-C2.html_c2r40)].


    Durr *et al.* [[41](#9789811483653-C2.html_c2r41)] introduced the concept of direct
    metal laser sintering for the fabrication of tool electrode for EDM process. The
    electrodes contained bronze, nickel and copper phosphide powders, were built layer
    by layer. Process optimization made it clear that the porosity of the sintered
    electrodes directly controlled by the laser speed, laser power and sintering strategy.
    The electrodes were also infiltrated with silver containing brazing metal. These
    electrodes achieved MRR approximately 12.5 mm³/min but it exhibited greater EWR
    and surface roughness as compared with conventional electrodes.


    Norasetthekul *et al.* [[42](#9789811483653-C2.html_c2r42)] synthesized tool electrodes
    by mechanical pressing of polymer coated ZrB[2] powders, followed by infiltration
    of copper into the green body in a high-temperature furnace. It was noticed that
    higher the compaction pressure, the lesser the voids between the particles, thus
    reducing the amount of copper required to infill the voids. However, it was found
    that the copper tends to fill the voids incompletely. It was observed that the
    ZrB[2]-Cu electrode had the highest thermal wear resistance to the plasma spark
    at the condition of extremely high energy flux. Also, the tool was able to cut
    the steel work piece faster than graphite and copper tools.


    Li *et al.* [[43](#9789811483653-C2.html_c2r43)] revealed the effect of addition
    of TiC the properties of sintered Cu based tools. The pellets were fabricated
    by P/M of copper and copper-tungsten (Cu-W) powders by varying the TiC from 5%
    to 45% followed by liquid phase sintering. Addition of TiC improved the surface
    finish and suggested to be used for finishing purpose. TWR was also found to be
    lesser for all these electrodes in comparison to commercially available electrodes.


    Zhao *et al.* [[44](#9789811483653-C2.html_c2r44)] reported the use of selective
    laser sintering (SLS) as useful method to fabricate EDM metal prototype. The density
    and other facets of the mechanical performance of an SLS metal prototype were
    improved by the metal infiltration. The metal prototype was dipped into a liquid
    infiltrant (copper used commonly) that rose into the open pores by the mode of
    capillary action. The results showed that the wear rate of the electrode was comparable
    to that of conventional electrodes. The surface roughness was within acceptable
    range for the similar machine settings.


    Blom *et al.* [[45](#9789811483653-C2.html_c2r45)] employed spray metal deposition
    and electroforming procedures to produce tool electrodes. Performance of these
    electrodes was compared with conventional solid electrodes. For different working
    conditions MRR, TWR, machining time and surface roughness were measured. The solid
    tool achieved better results as compared with electroformed tool in terms of MRR
    and TWR. However, the tools synthesized by electroforming method were found to
    be cheaper than the solid tools.


    Shibayama and Kunieda [[46](#9789811483653-C2.html_c2r46)] revealed the electric
    discharge machining of deep slots with the electrode having very small size holes.
    The holes directed the dielectric fluid over the work surface. Two copper plates
    having micro grooves over the interface for directing the dielectric fluid were
    joined by diffusion bonding to form the electrode. This electrode took less processing
    time with more machining preciseness as compared with normally used solid tool
    electrode.


    Mishra and Pathak [[47](#9789811483653-C2.html_c2r47)] added carbon (0 to 10%)
    and titanium carbide (0 to 10%) in ZrB[2] powder and studied the systematic sintering.
    The mixing of carbon upto 4% resulted in densification but further increase in
    carbon addition retarded the densification. Addition of TiC above 5% had adverse
    effect on sintering of ZrB[2.] The inclusion of carbon helped to hinder the grain
    size and composite with fine grain size and higher density was obtained.

