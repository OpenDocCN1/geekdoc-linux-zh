    # Recent Developments in EDM and its Types


    **Anupam Thakur**, **Suneev Anil Bansal**


    Department of Mechanical Engineering, Maharaja Agrasen University, Baddi, Himachal
    Pradesh, India


    ## Abstract


    Electric discharge machining has been the one of the advanced machining processes
    that deals with the machining of intricate and complex shapes on a workpiece considering
    various parameters like surface roughness and higher accuracy. A lot of research
    has been carried out in the EDM area for developing various models and selecting
    the best optimum condition for machining using conventional or wire EDM. Some
    results regarding submerged and dry EDM processing have also been discussed. Along
    with this, a recent development of smart EDM is also discussed for predicting
    the future capabilities of an EDM machine. In this article a light has being thrown
    on all the recent developments being done on the basis of machining capabilities,
    parameter, along with the characteristics of machining surface and various wire
    materials and the effect on the EDM wire during machining and the overall performance.


    **Keywords:** Composites, Electric discharge machine, Materials, MRR, Process
    parameters.


    ***


    **Corresponding author Anupam Thakur**: Department of Mechanical Engineering,
    Maharaja Agrasen University, Baddi, Himachal Pradesh, India; E-mail:[anupamthakur@hotmail.com`


    ## INTRODUCTION


    Electric discharge machine facilitates many intricate complex shapes being produced
    without the physical contact between the workpiece and the tool in form of electrode.
    The process of machining is carried out by continuous spark erosion between the
    electrode and workpiece interface (Fig. [1]). This process is carried out by developing
    an appropriate voltage between the workpiece and the tool which leads to the dielectric
    medium breakdown as a result of strong electrostatic field. It is an advanced
    manufacturing technique generally used in die manufacturing mould making, automotive
    manufacturing, and medical instruments *etc.* Most fragile objects, cannot be
    machined easily by other machines, can easily be machined without any risk factor.
    It has been seen that a no toxic gas fumes and contaminated dielectric are been
    produced.


    Wire EDM is also somehow similar to a conventional EDM as it implements the electrode
    in the form of wire that is used for spark erosion.


    ![](Images/9789811483653-C8_F1.jpg) **Fig. (1))**


    Layout of EDM Mechanism.


    This further gave more scope for producing intricate and fine shapes having high
    surface finish and accuracy to be produced using WEDM. Some researches depict
    the creation of ionized column at the shortest distance between the tool and workpiece
    [[1]]. With the advancement, complex and fine design, the wire EDM has come into
    light which can give a new scope of machining with high level of accuracy and
    finishing. It uses electricity as the source conducting through a thin copper
    or brass wire acting as an electrode. When this wire comes closer with the workpiece,
    the electric spark at the nearest section starts thus leading to spark erosion
    of the metal by melting and vaporization of microscopic particles. During this
    process, wire also gets eroded on a minute sale thus leading to a form of tool
    wear. To allow an equal and precise dimension of the cutting area, the machine
    changes the old wire with new wire section by automatic mechanism present on the
    machine as the machining advances and cutting is performed. The whole process
    is carried out in a dielectric medium of deionized water to facilitate evenly
    and continuous cooling of the work area with removal of eroded particles produced
    during machining.


    ## CURRENT STATE OF EDM AND EFFECT OF PULSE NATURE ON EDM PROCESS


    Due to non-linearity in EDM, a lot of improvements are required in the EDM machines.
    Several researches have highlighted the aspects that could be improved in order
    to improve the current process (Table [1]). During the last 20 years, a lot of
    research has been done starting from the first-time developments along its progress
    with time [[2]]. It has given various control and results for improvement in the
    EDM machine with optimization of the process parameters [[3]]. Keeping in view
    of optimizing, the input parameters was stated in the study. Some study also emphasized
    on the new technological developments to improve the quality of machined surface.
    It was also found that the large number of studies focused on powder mix EDM to
    study surface and its modification [[4]]. Studies have also been done on the DC
    electric pulses that are been used to increase the efficiency of the machine.
    It has been found that if the improvement is being made in the pulse generator
    using RC type, then a lot better results can be seen, comprising of high surface
    quality and improved MRR using tungsten carbide as workpiece [[5]] (Fig. [2]).


    ![](Images/9789811483653-C8_F2.jpg) **Fig. (2))**

