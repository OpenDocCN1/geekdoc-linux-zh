    Popli & Gupta 调查了旋转超声波加工中钻孔时的边缘崩刃问题。设计了一项实验，通过增加支撑长度来去除钻孔出口处产生的边缘。这有助于将崩刃尺寸减少高达
    50%。崩刃尺寸与支撑长度之间的关系表现为崩刃尺寸与支撑长度成反比 [31]。


    Mikhailova *等人* 展示了大理石中传统钻孔和超声波辅助钻孔的结果。实验结果有利于超声波辅助钻孔。观察到在大理石中钻孔时，钻头也是理想的，但进给率存在某些限制
    [32]。


    Wang *等人* 开发了一个基于运动学分析和脆性材料断力学的表面模型。该模型有助于预测表面粗糙度会在哪些参数下增加或减少。在本文中当主转速度为`2000
    rpm` 时，表面粗糙度很低且表面形貌更好，但当主转速度在`2500-3000 rpm` 之间时，表面粗糙度较高 [33]。


    Wang *等人* 调查了 CFRP 复合材料等硬脆材料加工过程中高切削力和高表面粗糙度的问题。旋转超声波表面加工具有一定程度的垂直超声振动，减少了切力，但产生了比传统表面磨光更高的表面粗糙度。为了改善这一参数，进行了具有水平超声振动的旋转超声波表面加工实验。这有助于减少切力并比比表面磨光更好的表面粗糙度
    [34]。


    Wang *等人* 指出了 CFRP 复合材料旋转超声波表面加工中的材料去除机制。为此进行了单磨粒划痕测试。在单金刚颗粒尺寸（点角为`100°`）的较小划痕深度下，观察到了韧性材料去除模式，而当划痕深度较大时，观察到了脆性去除模式。在韧性材料去除模式下，观察到的表面无裂纹，而在脆性材料去除模式下，加工过程中观察到了裂纹。同样，当划痕深度较小时，韧性模式下的力较小，而在脆性材料去除模式下力很大
    [35]。


    在研究论文学习期间，观察到旋转超声波工艺优于超声波加工。


    ## 传统加工与非传统加工


    传统加工是一种传统的加工工艺，工具在加工过程中与工件直接接触，在加工某些材料和产生复杂形状方面具有局限性，而非传统加工在加工任何材料方面均没有限制。


    ## 超声波加工与旋转超声波加工


    超声波加工是一种加工工艺，其中形状与所需空腔相反的工具沿轴向振动，并以控制的参数向工件进给 [36]。磨料被插入在工具和工件之间，起到切削作用。超声波加工的基本元件和工作原理示意图如图所示（2
    和 3）。


    ![](img/9789811483653-C1_F2.jpg) **图 (2))**


    超声波加工装置的示意图 [28]。![](img/9789811483653-C1_F3.jpg) **图 (3))**


    超声波加工工艺的工作原理。


    而在旋转超声波加工中，钻头连续旋转并具有轴向振动 [37]。工具和工件之间没有单独进的磨料。切削工具经过特殊设计，磨粒颗粒结合在刀体上，如图（4）所示 [38]。在旋转超声波加工中，磨粒颗粒直接结合在钻头上。然后，旋转和振动的钻头在玻璃、陶瓷材料*等*等多种材料中提供快速、准确和高质量的孔
    [39]。


    ![](img/9789811483653-C1_F4.jpg) **图 (4))**


    旋转超声波加工工艺的工作原理。


    旋转超声波加工是一种混合加工工艺，它将超声波加工和传统磨光相结合在一起，以获得更好的加工结果 [23]。


    ![](img/9789811483653-C1_F5.jpg) **图 (5))**


    旋转超声波加工装置的示意图 [23]。研究表明，只有通过超声波加工的控制参数才能提高加工效率。这些参数是振动幅、磨粒颗粒的形状和尺寸 [25, 28]、施加静态载荷的影响*等*。这些控制参数可以减少切力，以获得更好的工艺性能
    [6, 13^-15, 17]。旋转超声波加工是超声波加工的升级 [40]。旋转超声波加工的示意图如图（5)）。


    ## 结论


    1. 旋转超声波工艺优于超声波加工，前者在加工过程中与工件直接接触，而超声波加工中工具周期性地离开工件，从而降低了刀具磨损率

    2. 它可以加工传统加工中具有限制的材料

    3. 当超声波加工与传统和非传统加工相结合时，其特性得到了改进

    4. 火花算法作为超声波加工参数优化的数学方法可以实施

    5. 振动辅助加工消除了冷却液的使用。加工过程中，工具的周期性分离保持了间隙，有助于散发切削区域的热量

    6. 它有助于减少冷却液带来的环境危害并提高加工效率

    7. 在文献综述期间，观察到旋转超声波加工已用于钻孔，与静态超声波加工相比，它具有高材料去除率、低刀具磨损率和更好的表面光洁度

    8. 在硬脆材料中，旋转超声波加工比优于静态超声波加工

    9. 研究表明，近年来旋转超声波加工由于其对硬脆材料的智能加工而越来越受欢迎。在航空航天工业中，一组钻头通过该工艺同时创建多个孔

    10. 为了获得更好的结果，可以使用球形磨粒颗粒而非尖锐颗粒

    11. 旋转超声波加工中磨粒的消耗可以减少，因为它们结合在工具表面，而在超声波加工中是单独插入的

    12. 最后，静态超声波和旋转超声波加工解决了硬脆材料的加工问题，这种材料的质量非常优但也昂贵


