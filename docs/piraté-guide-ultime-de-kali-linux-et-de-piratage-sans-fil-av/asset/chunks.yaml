    # Ultrasonic Machining Process - A Review


    Janender Kumar, Amrinder Pal Singh, Anurag Thakur, Munish Mehta


    ¹ Department of Mechanical Engineering, Maharaja Agrasen University, Baddi, Solan,
    India

    ² Department of Mechanical engineering UIET, Panjab University Chandigarh, India

    ³ Department of Mechanical and Automation Engineering, Maharaja Agrasen Institute
    of Technology, Delhi, India

    ⁴ School of Mechanical Engineering, Lovely Professional University, Phagwara,
    Punjab, India


    ## Abstract


    The utilization of advanced materials like ceramics, composites etc. has increased
    these days and simultaneously machining of these hard, brittle and costly materials
    is very challenging. Industries are relying on non-conventional machining processes
    because conventional machining processes have many limitations to machine hard
    and brittle materials. The birth of modern machining processes like Ultrasonic
    Machining (USM) has taken place due to these limitations in conventional machining.
    In USM, material is removed due to action of abrasive grains and vibrations cutting
    tool during machining. Up to some extent, it overcomes the problems of conventional
    machining. Besides USM has some drawbacks e.g. low material removal rate, high
    wear rate of tool. As it tools continuously strikes on the workpiece, there is
    oversize in produced cavities and a limit of depth in drilling operation. Optimization
    of process parameters can improve all these problems. The literature survey study
    has shown, in drilling and milling operations, a hybrid machining process named
    Rotary Ultrasonic Machining (RUM) gives tremendous results as compared to ultrasonic
    machining alone. In recent years, it is gaining popularity due to its intelligent
    machining in industries. The present paper confers about the technique of parametric
    optimization of ultrasonic machining and future aspects of rotary ultrasonic machining
    processes.


    **Keywords:** Abrasive particles shape and sizes, Ceramics and composites, Hard
    and brittle material, Hybrid machining, Machining parameters, Rotary ultrasonic
    machining, Ultrasonic machining.


    ***


    **Corresponding author Janender Kumar:** Department of Mechanical Engineering,
    Maharaja Agrasen University, Baddi, Solan, India; E-mail: janyo_ishaan@yahoo.com


    ## INTRODUCTION


    In the modern world, due to technological advancements, the needs of industry
    are continuously changing. Latest and advanced materials, along with their machining,
    are the requirement of the manufacturing sector. Research is a continuous process
    and it’s the demand/necessity of growing industries. Truly speaking, change for
    better is necessary. In earlier days machining of hard and brittle material was
    a tough job for engineers and was a challenge for the research and design team
    as well. Conventional machining was used for many years. Newer processes of machining
    were developed and named as modern machining methods/non-conventional machining.
    Recent development of these processes opened the way of machining hard and brittle
    materials. In conventional machining processes, there is direct contact between
    tool and workpiece and material removed in form of chips i.e. at macroscopic level,
    whereas in non-conventional machining there is no direct contact between the tool
    and work piece. In this, the material is removed at microscopic level (dust/powder
    form). In conventional machining, due to physical contact tools, wear rate is
    high as compared to non-conventional machining. The increasing utility of hard
    and brittle materials in recent times has forced the researchers to develop new
    and advanced machining processes. The materials, difficult to machine through
    the conventional machining, are machined by unconventional machining processes.
    The main idea behind the development of newer methods was the replacement of conventional
    machining methods by more efficient, quicker methods which could achieve accuracies
    in machining. Ultrasonic machining is one such development in the field of non-conventional
    methods. In this process, slurry of small abrasive particles is forced against
    the work by an axially vibrating tool, removing the workpiece material in the
    form of small particles. The abrasive grain particles may be of silicon carbide,
    boron carbide and diamond dust. To facilitate/provide high precision machining,
    when vibration is introduced in a tool workpiece or working medium then it is
    called vibration assisted machining [[13]]. In vibration assisted turning, cutting
    forces reduced up to 40% as compared to conventional machining, hence improving
    tool life. Less stresses are induced in work and quality of machined surface is
    improved [[15]]. Rotary ultrasonic machining is one of the latest processes which
    are used in industries to overcome the limitations of ultrasonic machining. Higher
    metal removal rate is observed during drilling operation through rotary ultrasonic
    machining as compared to ultrasonic machining alone [[23]].


    ## LITERATURE REVIEW


    Kumar and Khamba evaluated the machining performance of ultrasonic machining on
    titanium-based workpiece. The investigation was carried out for material removal
    rate, tool wear rate and to know the surface roughness of the workpiece. Taguchi’s
    method was adopted for performing several experiments, the data was analysed by
    using ANOVA and optimized parameters were selected which can enhance the performance
    of ultrasonic machining [[1]].

