    Saxena *et al.* [[48](#9789811483653-C6.html_c6r48)] investigated the effect of
    machining on SiC with EDM process. In the results obtained from the SEM images,
    it was clearly observed that the mechanism of the removal of the material was
    melting and evaporation and the migration of the material was also two directional.


    Nihal *et al.* [[49](#9789811483653-C6.html_c6r49)] used hydroxyapatite powder
    mixed to machine Ti6Al4v workpiece. Group found that random removal of workpiece
    and micro-cracks were formed when pulse time 100µs and pulse current 12A. Other
    non-contact processes such as laser machining, ultrasonic machining [[50](#9789811483653-C6.html_c6r50),
    [51](#9789811483653-C6.html_c6r51)], and abrasive water jet machining [[52](#9789811483653-C6.html_c6r52)]
    also had their advantages and disadvantages as reported by different researchers.


    Yoo *et al.* have successfully doped yttrium nitrate (YN) with SiC and showed
    that the EDM process can be used for machining these ceramics [[53](#9789811483653-C6.html_c6r53)].
    Yeakub *et al.* [[54](#9789811483653-C6.html_c6r54)] investigated the micro-EDM
    of non-conductive zirconia with titanium carbide powder. In this study, two parameters
    were varied: capacitance and gap voltage.


    Singh *et al.* [[55](#9789811483653-C6.html_c6r55)] carried out an experimental
    investigation on the powder mixed EDM of cobalt-bonded tungsten carbide (WC-Co).
    In his experiment, graphite powder mixed dielectric was used. Few studies were
    focused on predictive modeling to understand the effect of EDM on the machined
    product [[47](#9789811483653-C6.html_c6r47)]. Table [**2**](#9789811483653-C6.html_c6t2)
    shows a consolidated review electric discharge machining of ceramic composite
    material.


    ## FUTURE PROSPECT


    On the basis of the various studies reviewed in this chapter, it has been observed
    that there is strong need to investigate the effect of various operational parameters
    on some nanostructured WC. Micro investigations of EDM, for CMs, are seen as major
    future scope in this field. There is need to investigate the formation of secondary
    layers which are conductive in nature with the help of some advanced FEM techniques.


    ## CONCLUSION


    Applications based on composites fabricated by CMs have become important part
    of our modern lifestyle. In this article, EDM process and its role in machining
    of composite made up of CMs and tungsten carbide has been reviewed. It is concluded
    from the above extensive review that EDM process is capable of machining CMs like
    TiN, SiC and TiB[2] which are highly electrically conductive in nature. It is
    also observed that various machining parameters like spark intensity and current
    effect the performance of the machining of the workpiece. As these parameters
    get increased, there is also a significant increase in the MRR and surface roughness.
    The result of pulse time is studied with respect to MRR. MRR and surface roughness
    decreases with increase in pulse time and thus increasing the instability of the
    machining of materials.


    Along with this, effect on characteristics of EDM machined surfaces by different
    process parameters has also been observed and some studies have also been discussed
    stating the after machining effects on CMs [[27](#9789811483653-C6.html_c6r27),
    [45](#9789811483653-C6.html_c6r45)].


