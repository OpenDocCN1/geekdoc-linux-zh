    ## 摘要


    如今，陶瓷、复合材料等先进材料的使用日益增加，同时对这些硬、脆且昂贵的材料进行加工面临巨大挑战。工业界正依赖非传统加工工艺，因为传统加工工艺在加工硬脆性材料方面存在许多局限性。由于传统加工的这些局限性，超声加工（USM）等现代加工工艺应运生。在
    USM 中，材料是通过加工过程中磨粒颗粒和振动切刀的作用去除的。在某种程度上，它克服了传统加工的问题。此外，USM 也存在一些缺点，例如材料去除率低、刀具磨损率高。由于刀具不断撞击工件，导致产生的孔径超尺寸，且钻孔操作深度存在限制。工艺参数的优化可以改善所有这些问题。文献调查研究表明，在钻孔和铣削作业中，名为旋转超声加工（RUM）的混合加工工艺与单一的超声加工相比取得了巨大的成果。近年来，由于其在工业中的智能化加工，它日益受欢迎。本文讨论了超声加工的参数优化技术以及旋转超声加工工艺的未来前景。


    **关键词：** 磨粒颗粒形状和尺寸，陶瓷与复合材料，硬脆材料，混合加工，加工参数，旋转超声加工，超声加工。


    ***


    **通讯作者 Janender Kumar:** 机械工程系，马哈拉·格森大学，巴迪，索拉兰，印度；电子邮箱：janyo_ishaan@yahoo.com


    ## 引言


    在现代世界中，由于技术的进步，工业的需求不断变化。最新和先进材料及其加工是制造业领域的要求。研究是一个持续的过程，也是不断发展的行业的需求/必要性。坦率地说，为了变得更好而改变是必要的。在过去，硬脆材料的加工对工程师来说是一项艰巨的工作，对研究和设计团队来说也是一个挑战。传统加工已使用了多年。新的加工工艺被开发并命名为现代加工方法/非传统加工。这些工艺的最新发展为硬脆材料的加工开辟了道路。在传统加工工艺中，刀具与工件之间有直接接触，材料以切屑的形式去除（即宏观水平），而在非传统加工中，刀具与工件之间没有直接接触。在这种情况下，材料在微观水平（粉尘/粉末形式）去除。在传统加工中，由于物理接触，磨损率高于非传统加工。近期硬脆材料用途的增加迫使研究人员开发新型和先进的加工工艺。通过传统加工难以加工的材料通过非传统加工工艺进行加工。开发新方法的主要想法是用更有效率、更快速且能够实现加工精度的方法来取代传统加工方法。超声加工是非传统方法领域的此类发展之一。在此过程中，通过轴向振动的刀具将小磨粒颗粒的浆料强加于工件，以小颗粒的形式去除工件材料。磨粒颗粒可以是碳化硅、碳化硼和金钻。为了便于/提供高精度加工，当刀具、工件或工作介质引入振动时，称为振动辅助加工
    [[13]]。在振动辅助车削中，与传统加工相比切力减少了 40%，从而提高了刀具寿命。工件中的应力减少，加工表面的质量得到提高 [[15]]。旋转超声加工是工业中克服超声加工局限性的最新工艺之一。与单一超声加工相比，通过旋转超声加工进行钻孔作业观察到更高的金属去除率
    [[23]]。


    ## 文献综述


    Kumar 和 Khamba 评估了超声加工在钛基工件上的加工性能。调查了材料去除率、刀具磨损率以及工件表面粗糙度。采用 Taguchi 方法进行多次实验，使用方差分析（ANOVA）分析数据，并选择了可以增强超声加工性能的优化参数
    [[1]]。


