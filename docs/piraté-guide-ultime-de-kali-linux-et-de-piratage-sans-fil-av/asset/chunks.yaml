    ## CONCLUSION


    AJM is a modern technique of machining that offers machining on micro to macro
    scale having much higher precision and control. Various types of AJM are being
    discussed with their benefits and limitations in terms of accuracy, sustainability
    of better environment and larger sized machining *etc.* It is being studied that
    the tribological applications of AJM seem to be of quite relevant and more research
    should be done to enhance this to other fields. Introduction of cryogenics for
    machining of softer material to offer precise machining was also studied. It came
    with other drawbacks like thermal stresses which should be studied. This also
    need to be minimized as the temperature and thermal effect play a very important
    role in achieving higher effect on machining efficiency. Research could also be
    done on the incident angle for AJM as it comes out to be an important factor in
    Abrasive fluid jet polishing (AFJP) [[50](#9789811483653-C5.html_c5r50)]. The
    wear characteristics of the jet nozzle are also not studied in a thorough manner
    thus it could also be done. Though FGM provide much improvement in the nozzle
    wear but more materials like micro sapphire and diamond nozzles also could be
    studied to check their performance characteristics.


