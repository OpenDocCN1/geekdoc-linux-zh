    同样可见，气粒射加工（AJM）在具有数理念的精密加工中找到了应用。由于技术小型化的变化，AJM 正在转向微加工，这使得喷嘴尺寸从宏观尺度变为微米尺度，并将喷嘴材料改为蓝宝石。AJM
    配合了高压泵和更硬的磨料颗粒进行加工。Verma *等人* [5] 讨论了喷嘴磨损，这种磨损取决于喷嘴长度、喷嘴直径、喷嘴进口角和孔径等各种参数。还发现，在一定范围内，喷嘴移动速度与磨料流量对材料去除率（MRR）起着最重要的作用，因为它导致了表面粗糙度的降低和切口几何形状的增加。因此，尽管已经进行了各种研究，但在
    AJM 分析、AJM 中的喷嘴磨损以及各种参数对表面完整性的影响方面，仍发现了一些需要关注的空白。


    本文讨论了多种研究，展示了基于技术进步、工业应用及其多样性所取得的最新进展。同时对 AJM 的各种材料机制、材料去除、工艺参数的影响以及喷嘴磨损进行了综述。


    # 文献综述


    ### 磨粒空气射流加工


    磨粒空气射加工（AAJM）可以描述为一种通过高速喷射颗粒流的技术，从而导致材料的侵蚀 [6]。它认为具有良好的材料去除率。研究发现，当喷嘴直径减到小于 1mm
    时，它会变为微加工过程或微 AAJM。其布局见图（1）。系统内的过滤器和干燥器用于同时清洁压缩空气并进行干燥。之后，空气通过调节阀，对空气压力进行调节和控制。最后，空气被输送到工件附近的喷射枪。颗粒在用于侵蚀后随切屑通过集尘器收集。在加工过程中，取决于使用的材料、属性以及考虑的各种参数，会产生少量的断裂。侵蚀后，颗粒和气体逸出。微
    AAJM 用于在陶瓷、玻璃和硬质金属等各种脆材料上生产如通道和孔等的小孔径。还发现，磨料颗粒经常嵌入机器表面，因此在使用非有色金属或聚合物时会产生负相关关系。为了加工此类材料，使用了后文将讨论的低温辅助
    AJM。


    ![](img/9789811483653-C5_F1.jpg) **图 (1)**


    磨粒射流加工工艺布局 [51]。


    ### 磨粒水射加工


    磨粒水射加工是传统加工工艺的进步，它用水代替了载体气体，并在矿业中找到了关键应用 [7]。它有时与水浆射加工进行比较，后者在两个低压模块上工作，使用预混合的水浆。在这种情况下，介质的粘度起着重要作用，因为喷嘴处的射流比空气提高了
    100 倍。看到 AWJM 已经取得了许多改进，如粗糙度降低到纳米级 [8]、远端足迹 [10]、工件冷却速度更快以及充足的水浆回收 [11, 12]。但由于水停滞区的高减速和粘度对磨料轨迹的高影响，撞击速度被发现是不同的（图
    2 & 3）。此后，磨料颗粒失去了所有的动能。与水相比，空气中的 MRR 更高，因为它提供的停滞区较小。人们还进行了一些研究来减少这种停滞区 [13]，并建议使用
    V 型罩。还发现，使用大豆油作为磨料的载体可以减少主足迹中对工件的二次冲击 [14]。由于流体压力，在加工陶瓷时，使用大豆油作为磨料载体会导致裂纹形成 [15]。![](img/9789811483653-C5_F2.jpg)
    **图 (2)**


    磨粒射加工布局 [3]![](img/9789811483653-C5_F3.jpg) **图 (3)**


    流速分布 [9]


    ### AJM 中的低温使用


    早些讨论过，使用磨料在 AJM 中无法容易加工软金属。由于磨料具有高动能和高速度并穿透表面，在加工硬性材料时，因此引入了低温以使材料去除机制发生某种变化。使用
    AAJM 和低温辅助 AJM 加工了 5083-H32 铝合金。对表面完整性进行了对比研究 [16]。在该研究中，他们使用了 -195°C 的液氮并将其供给压缩空气区。这导致硬度变得非常高，从而减少了嵌入材料的磨料数量。这伴随着连续粗糙度的产生。液氮的使用还产生了应变性能，使加工材料的硬度提高了倍。还进行了一些其他研究，使用带有液氮的热器来冷却除材料外的空气流
    [17, 18]。使用了一种内外分别具有高、低热导率的管型 LN2 热热器。磨料被引导在 -80°C 的射流条件下流向材料。因此温度在 -80°C 到 180°C
    之间变化。当射流温度达到 -180°C 时观察到变化，因为侵蚀原理变为脆性。


    该研究还发现，30° 到 60° 的入射角对于最大 MRR 是最佳的。该研究发现在 -180°C 下也可以获得软材料的侵蚀。在较低温度下通过脆性去除机制对材料进行更精确的加工也可以考虑。


    ### 热增强 AJM


