    as well as curtailed the cost of electrode fabrication. Experimental observations
    showed no crack on the electrode and promising results for EDM process.


    Monzon *et al.* [[49](#9789811483653-C2.html_c2r49)] tried rapid prototyping and
    electroforming process for the manufacturing of EDM electrodes. They developed
    copper electroformed shell testing methodology. The various aspects such as composition,
    internal stresses, electrolytic bath additives, pitting, dimensional precision
    and roughness were analyzed. As compared to conventional techniques favorable
    outcomes were recorded in terms of weight and ease of fabrication of electrode.


    Egashira *et al.* [[50](#9789811483653-C2.html_c2r50)] fabricated ultra-small
    tungsten tools by the combination of wire electrode discharge grinding and electrochemical
    machining. Holes with radius lesser than 0.5 µm and more than 1 µm in depth were
    drilled in brass and zinc material successfully. However, the circularity of the
    hole was not found good as the size of a single discharge crater was found to
    be greater than the hole diameter.


    Meshram and Puri [[51](#9789811483653-C2.html_c2r51)] used three different methods,
    rapid wire EDM, net shape casting process and investment casting process for the
    fabrication of EDM electrodes. Rapid wire EDM process resulted in better dimensional
    accuracy in comparison to other two methods. Net shape casting required lesser
    time for the electrode fabrication. The copper-brass electrode fabricated by this
    process resulted in highest MRR and EWR. Investment casting was found to have
    edge over the other methods to produce complex shape electrodes.


    Balasubramanian and Senthilvelan [[52](#9789811483653-C2.html_c2r52)] performed
    the EDM of EN8 and D3 steel with cast and powder metallurgy copper tool electrode.
    Higher average MRR (77.4 mm³/min) and lower average TWR (10.99 mm³/min) was obtained
    with cast electrode as compared to sintered electrode for EN-8 material. Cast
    electrode also showed high MRR (136.1 mm³/min) and low TWR (3.32 mm³/min) in EDM
    of D3 steel. Sintered electrode showed better surface finish for EN-8 and D3 steel
    with comparison to cast electrode.


    Pal and Choudhry [[53](#9789811483653-C2.html_c2r53)] manufactured copper and
    brass electrode for EDM process by abrasive water jet machining (AWJM). Array
    of holes were made on stainless steel and Ti-6Al-4V by keeping voltage, current,
    duty cycle and pulse duration constant. Deviations in the dimensions of the tool
    produced by abrasive water jet machining and dimensions of the workpiece were
    observed as shown in Fig. ([**9**](#9789811483653-C2.html_c2f9)). Two reasons
    were held responsible for this. First was taper produced on the tool due to instinctive
    property of abrasive water jet machining jet which produced kerf on the fin length.
    Second logic was that the side walls of the blind cavities got machined because
    the tool was not masked on the sides.


    ![](Images/9789811483653-C2_F9.jpg)**Fig.(9))**


    Ideal and practical cut of AWJM [[53](#9789811483653-C2.html_c2r53)].


    Goyal *et al.* [[54](#9789811483653-C2.html_c2r54)] investigated the hardness
    and SR of EN31 steel machined by EDM process using Cu-Mn tool made by powder metallurgy
    technique. Discharge current and pulse duration were chosen as machining variable.
    The microhardness of the surface machined with 70Cu-30Mn electrode was found to
    be 913 VHN which was 11.94% more than copper electrode and 3.39%more than 80Cu-20Mn
    electrode. However, the powder metallurgy electrodes produced surface with higher
    roughness due to its porous nature, though the difference was marginal.


    Sahu *et al.* [[55](#9789811483653-C2.html_c2r55)] explored the EDM of Nitinol
    using AlSiMg tool fabricated by SLS and compared its performance with the commercially
    available graphite and copper tools. Surface roughness was selected as response
    to examine the influence of electrode material, current, voltage, pulse duration
    and duty cycle. The average surface roughness achieved with SLS tool was least
    followed by copper tool.


    Equbal *et al.* [[56](#9789811483653-C2.html_c2r56)] fabricated EDM tool using
    fused deposition modelling (FDM). Acrylonitrile butadiene styrene (ABS) was used
    as the core material and outer shell was produced by copper coating. With FDM,
    it was found very difficult to maintain the sharp edges of tool. Although, the
    performance of tool fabricated with FDM process was comparable with solid copper
    tool, but it has lower dimensional accuracy. The difficulty in producing the exact
    dimension of tool with FDM was cited as the reason.


    Saxena and Metkar [[57](#9789811483653-C2.html_c2r57)] also developed an EDM tool
    using FDM. Copper coating was done on a core of ABS material fabricated by FDM.
    influence of current, pulse time and voltage on EWR and MRR was analyzed. Similar
    results for MRR were obtained with solid copper tool and tool fabricated by FDM,
    whereas, the later performed slightly better in terms of EWR.


    The major research efforts in the fabrication techniques of EDM tool electrode
    are presented in Table [**2**](#9789811483653-C2.html_c2t2).


