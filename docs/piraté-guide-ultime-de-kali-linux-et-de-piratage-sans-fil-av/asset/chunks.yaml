    As it has been seen in the previous section that the wire vibration and its rigidity
    during the machining process plays a very important role. Thus, material selection
    for the wire should be made on the basis of having high endurance in terms of
    tensile strength and toughness to absorb all the vibrations and stresses produced
    with minimum vibration. It has been studied that with the rise of `Zn` percentage
    in the wire composition the machining speed increases with lower servo voltage
    requirement thus leading to lower chances of short circuit during machining [[26](#9789811483653-C8.html_c8r26)].
    A lot have researched have been done to maximize MRR with least TWR and SR. Few
    of the important wire material used are discussed below.


    ### Copper

    Copper was the one of the first materials to be used as an electrode for machining.
    But due to the physical limitation in the properties like strength and low vapour
    pressure it puts some limitation to it use as wire in WEDM [[25](#9789811483653-C8.html_c8r25)].


    ### Brass

    As an alternative to `Cu`, `Br` plays a very significant role in WEDM having good
    performance results. It is an alloy of `Cu` and `Zn` containing both the elements
    up to around 63% and 37% respectively. `Zn` is added to exhibit high tensile strength,
    high vapor pressure and low melting point [[25](#9789811483653-C8.html_c8r25),
    [26](#9789811483653-C8.html_c8r26)].


    ### Coated Wires

    It has been found that the electrode coating of wires, having less vapourization
    temperature, possesses fewer chances to experience thermal shock. It includes
    a wire having high conductivity core with a coating of an alloy having low melting
    point and finally a coating of alloy having high strength, thus facilitating high
    machining speed. A lot of researches of such coated electrode wire have been carried
    out having high machining capabilities with better flushablity producing cuts
    with least inaccuracy and surface roughness. But the only disadvantage is the
    high coat along with the chances of contamination of dielectric used creating
    environmental limitations [[27](#9789811483653-C8.html_c8r27)].


    ### Diffusion Annealed Wires

    Due to such good characteristics of the zinc coating it can be thought that a
    pure zinc coated wire would produce a high machining result. `Zn` offers low melting
    point, combined with good flushablity. Thus, it can be stated that a diffused
    coating having high or pure concentrations of `Zn` on the top layer could produce
    encouraging results. To produce such diffused wires, the annealing of the encasing
    material is done that allow the even distribution of the alloy on top layer. By
    this one can produce a wire having high resistance to wear as compared to the
    conventional electrode material. The resulting EDM wire resulted in a quite significant
    increase in production rate as compared to the brass electrode wire [[28](#9789811483653-C8.html_c8r28)].


    ## EFFECT OF FLUSHING AND DIELECTRIC FLUID

    Dielectric is used in EDM in the various forms such as full immersion, flushing
    with jet or spray. In Fig. ([5](#9789811483653-C8.html_c8f5)) the effect of flushing
    pressure on the machining speed (`Vs`) and Surface roughness (`Ra`) is being plotted.


    ![](Images/9789811483653-C8_F5.jpg)**Fig. (5))**


    Effect of Pressure on `Vs` and `Ra` [[23](#9789811483653-C8.html_c8r23)].


    The pressure flow facilitates the continuous removal of the eroded particles created
    during sparking and it should be less when approaching the finishing time. It
    is also seen there a certain limit out of which the adequate machining cannot
    be done, with increasing flush pressure upto 1 Kg/cm² higher machining speeds
    are possible, beyond this there is decrease in machining speed rate. High temperature
    ranges are seen along spark discharge when flushing pressure is less than 0.3
    kg/cm².


    The dielectric fluid other than flushing out the eroded particles performs various
    functions such as cooling the workpiece and tool during machining. It also helps
    to concentrate the spark energy on the required smaller section of machining and
    gap insulation before accumulation of large amount of energy.


    ## SMART WIRE EDM

    As we know that industry has been changing and it has been introduced with new
    revolution called as ‘Industry 4.0’. Studies prove that this could produce much
    better results by cutting off the various unwanted cost by avoiding downtime [[29](#9789811483653-C8.html_c8r29)].
    It has been seen that with the current requirement of micro machining some intelligence
    factors need to be introduced which could help do such work with high level of
    accuracy and precision. A lot of funds have been seen to be invested in such projects
    as compared to conventional EDM projects [[30](#9789811483653-C8.html_c8r30)].
    In this it has been emphasized to introduce a new intelligence factor into the
    machining era which could optimize various control parameters and exclude environmental
    hazards. These not only restrict to this but also have the capability to self-investigate
    and monitor the various tasks being done and do any appropriate changes to get
    the best machining characteristics. Such implication is being seen in recent year
    in a research done by Walder *et al.* [[31](#9789811483653-C8.html_c8r31)]. As
