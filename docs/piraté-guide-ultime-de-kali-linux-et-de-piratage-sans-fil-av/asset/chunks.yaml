    # 绝缘电路布局


    绝缘电路的布局 [31]。它由压力传感器、电导率传感器以及安装在各处的 pH 和氧化还原电传感器组合组成。此外，通过过滤器入口处的压力传感器维持了过滤器压力降的监测。该压力值设定为最高
    2.8 bar，一旦超过该值，机器将自动停止。对给定材料进行加工时，获得了每种材料的压降图，并计算了每个装置从树脂中侵蚀出的颗粒重量，结果显示：在约 304
    个有效工作时间内，通过工件加工去除了共 4kg 的硬质合金（WC），加工过程中侵蚀了约 7.7kg 的电丝。与树脂中收集的碎片量相比，发现总有 5.4kg
    以离子的形式在加工过程中被吸收。最后，建立了一个用于预测压降的模型。由于接触与电火加工（EDM）的电丝持续摩擦，还发现接触磨损率也非常显著。文献模型与所开发模型之间存在良好的关系。最后得出结论：如果使用适当的传感器和预测模型进行精确监测，线电火加工（WEDM）中树脂、过滤器、接触件和电丝将最具成本效益。


    ## 结论


    针对包括复合材料在内的各种材料已进行了大量研究，并考虑了脉冲开启/关闭时间、送丝速度、电丝张力、峰值电流和电压等各种控制参数，但从目前为止的回来看，对电丝材料影响的研究较少，因此应对其对加工特性的重要性进行深入研究。同样发现电丝直径对加工特性和走隙率（WWR）起着重要作用，这也需要研究其对加工率（MRR）、表面粗糙度（SR）和空隙（CV）的影响。发现过滤器饱和等其他参数与文献模型相当不同，因此需要使用铝等材料建立详细模型进行预测。我们还假设缺失质量以离子形式消耗。需要进行一些研究来验证并彻底阐述这一点。


