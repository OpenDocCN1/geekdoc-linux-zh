    制造业一直被认为具有最高程度的自学习自动化，但从技术上实现完全的 AI 机器人工厂仍然遥不可及。然而，以 AI 为特征的机器人技术正在改变这一趋势。具有卓越灵活性和自给自学习能力的
    AI 机器人将改变各个工业的生产流程 [5^-8]。尽管，该领域的研究面临着预算限制方面的重大挑战。为了克服这些设计限制，可以将原材料参数、制造技术和其他细节集成到软件中，该软件对输入变量的所有可行安排进行运行，并推荐最佳设计。通过利用人工智能技术，输出在每次重复中得到进一步的增强和改进。因此，这些具有前景的技术可以为我们提供卓越的设计并消除浪费。目前，与
    AI 的机器相比，故障检测方法和工具并不准确，导致制造业领域出现了数万亿卢比的无效生产。为了解决这个问题，可以形成一个对流程、产品和供应链的模拟模型，被称为“数字孪生”。它是数据与智能的结合，标志着系统的行为和框架。这种技术通过仅处理关键信息并剔除垃圾信息，提高了数据使用的效率。机器学习算法在视觉模式识别方面具有优势，协助对整个供应链管理中的资产进行物理检查
    [9^-11]。使用监督或无监督算法，应用程序可以区分损坏或磨损。它能够组织操作列表并为恢复资产问题提供纠正方案。供应链管理可以通过先进的 AI 算法完成。供应链是生产行业的骨干。启用
    AI 的机器或机器人将有助于降低运输成本、仓库管理和高效的供应链管理。这些机器学习算法能够实时处理海量多样化的数据集进行供需预测。在基于 AI 的供应链模型中，将实现运费成本的降低和供应商交付的改进
    [12]。此外，未来可以通过 AI 机器完成库存管理过程。因为大多数供应链都必须面对近期的全球化挑战、不稳定的需求以及日益独特、适应且复杂的复合产品。在考虑库存的同时，匹配客户需求是一项艰巨的任务。库存管理中的不适宜区域一直是库存积压以及未能跟踪重要事项或物品。在这里，AI
    机器将帮助对资产进行实时监控和优化。启用 AI 的机器人可以协助改进供需规划。库存优化结果的首要目的是在准确的时间、准确的位置向客户交付精确的产品，并保持最低水平的库存管理。将存在一种智能优化解决方案，它会定期修改库存水平以精确满足客户需求，增强服务水平，降低成本并提高公司的库存周转率
    [13, 14]。机器学习算法将帮助整个供应链的库存优化，并通过自动化危险活动来增加安全性。通过部署 AI 机器人，可以以最小的影响处理实时数据和危险工作。这些
    AI 机器人可以在熔炉、危险材料、锅炉、焊接和压铸等 `etc.*` 风险环境中工作，而上述工作通过现有程序无法达到这一精度水平。此外，AI 机器人等新兴技术的进步为混合劳动力开辟了道路，机器人和机器共同管理。它们共同工作以提高生产率，并创造由
    AI 技术促进的额外岗位。如今，机器人正以以前科幻小说中描述的方式进行工作。尽管在制造业中使用启用 AI 的机器人有巨大的前景和优势，但 AI 机器人的益处远大于其实施的挑战。这项技术在制造和生产中的范围和潜力将引发未来的下一次工业革命
    [15^-18]。


    ## 机会与优势


    AI 和机器人的应用将提高生产力，并在印度等国家创造更多的制造生产工作。预计劳动力将从 AI 和机器人技术中获得大部分利润。AI 和机器人的实施对制造业非常有帮助，因为它将提高生产的数量和质量、生产的效率和速度。AI
    机器人的引入将成为制造业的一场热潮 [19]。AI 机器人可以像人类学习一样通过标记数据集进行训练，以便更高效地运行，包括最初编程中未预测的新指令。基于 AI
    的机器人将像人类一样工作，但尽管不需要休息，它们将持续工作，因为它们不会感到无聊、饥饿或疲劳。带有 AI 技术的机器人能力远超人类能力，一旦扩展到微型化和精密测量
    [20]。此外，制造业的这些新兴技术未来将带来卓越的超级质量保证。AI 和机器人可以将复杂的任务转化为一致且精确的解决方案。随着工业机器人运行的增加，这标志着
    AI 在制造过程中的部署大幅增加。人工智能（AI）已广泛应用，并逐渐进入制造领域，通过使用学习算法实现学习和无错误决策来简化自动化。AI 驱动的系统通过展示创新前景、提高效率并提高商品生产，通过实施通用
    AI 使机器交互更接近人类交互，为未来的制造业提供了一条更简单的路径。启用 AI 的机器人具有卓越灵活性和自给自学习能力将改变各个工业的生产流程。然而，该领域的研究面临着预算限制方面的重大挑战。为了克服这些设计限制，可以将原材料参数、制造技术和其他细节集成到软件中，该软件对输入变量的所有可行安排进行运行，并推荐最佳设计
    [21]。通过利用人工智能技术，输出在每次重复中得到进一步的增强和改进。制造业中 AI 和机器人具有若干优势，如图 3 所示（`3`）。基于 AI 的系统的详细益处已列出。


    ![](img/9789811483653-C9_F3.jpg) **图 (3))**


    AI 和机器人在制造业中的作用。


    ### a). 直接自动化


