    # 电火花加工（EDM）及其类型的最新进展


    **Anupam Thakur**, **Suneev Anil Bansal**


    印度希马偕邦巴迪马哈哈拉·阿格拉森大学机械工程系


    ## 摘要


    电火花加工是先进加工工艺之一，在考虑表面粗糙度和高精度等各种参数的情况下，能够对工件上复杂的几何形状进行加工。EDM 领域已开展大量研究，以开发各种模型并为普通电火花或线电火花加工选择最佳优化工况。文中关于浸没式和干式
    EDM 加工的一些结果也得到了讨论。此外，还讨论了智能 EDM 的最新进展，以预测电火花加工机的未来能力。本文重点阐述了基于加工能力、参数、加工表面特性以及各种线丝材料，以及在加工过程中对
    EDM 线丝的影响和整体性能的最新进展。


    **关键词：** 复合材料、电火花加工机、材料、材料去除率（MRR）、工艺参数。


    ***


    **通讯作者 Anupam Thakur**: 印度希马偕邦巴迪马哈哈拉·阿格拉森大学机械工程系；邮箱:[anupamthakur@hotmail.com`


    ## 引言


    电火花加工机有助于在工件与电极形式的工具之间没有物理接触的情况下生产许多复杂的几何形状。加工过程是通过电极与工件界面之间的持续火花冲蚀完成的（图 [1]）。该过程通过在工件和工具之间产生适当电压来实现，由于强静电场导致电介质发生击穿。这是一种先进的制造技术，通常用于模具制造、汽车制造和医疗器械*等*。大多数易碎的物体无法通过其他机器轻松加工，但它可以在没有任何风险因素的情况下轻松加工。研究发现，该过程不会产生有毒气体和受污染的电介质。


    线电火花加工（Wire EDM）在某种程度上与传统 EDM 相似，因为它采用线丝形式的电极用于火花冲蚀。


    ![](img/9789811483653-C8_F1.jpg) **图 (1))**


    EDM 机制布局图。


    这为使用线电火花加工（WEDM）生产具有高表面光洁度和精度的细形状提供了更大的空间。一些研究描述了工具与工件之间最短距离处电离柱的形成[[1]]。随着复杂和精细设计的发展，线电火花加工脱颖而出，可以为高水平的精度和光洁度提供新的空间。它利用电作为源，通过作为电极的薄铜或黄铜线导。当这根线丝靠近工件时，最近区域的电火花开始产生，导致微观颗粒的熔化和汽化使金属发生火花冲蚀。在此过程中，线丝也会发生微量冲蚀，从而导致某种形式的刀具磨损。为了确保切割区域尺寸相等精确，随着加工的进行和切割的执行，机器通过自动机构用新线丝段更换旧线丝。整个过程在去离子水的电介质中进行，以促进加工区域的均匀连续冷却，并去除加工过程中产生的冲蚀颗粒。


    ## EDM 的现状及脉冲特性对 EDM 加工过程的影响


    由于 EDM 的非线性特性，EDM 机仍需许多改进。许多研究已经强调了为了改进当前工艺而可以改进的方面（表 [1]）。在过去的 20 年里，从最初的发展开始，随着时间的进步开展了大量研究[[2]]。通过优化工艺参数，为电火花加工机的改进提供了各种控制和结果[[3]]。考虑到优化，研究中给出了输入参数。一些研究还强调了提高加工表面质量的新技术进展。还发现大量研究关注粉末混合电火花加工，以研究其表面及其改性[[4]]。对用于提高机器效率的直流电脉冲也进行了研究。研究发现，如果使用
    RC 类型的脉冲发生器进行改进，就可以看到更好的结果，包括使用碳化钨作为工件时的高表面质量和提高的去除率（MRR）[[5]]（图 [2]）。


    ![](img/9789811483653-C8_F2.jpg) **图 (2))**


    '
- fmt: '

    # Pulse shape effect on EDM characteristics


    Another study shows that if a pulse of 1Mhz from a modified transistor is used,
    instead of a RC type generator, then it produces higher MRR with a three times
    higher machining speed [[6](#9789811483653-C8.html_c8r6)]. Han *et al.* conducted
    a study in which they designed a new transistor pulse generator for pulse generation
    which was able to produce 24 times greater MRR [[7](#9789811483653-C8.html_c8r7)].
    A research was also carried out, in which, an effect of EDM capacitance was seen
    on the impedance thus leading to high machining properties [[8](#9789811483653-C8.html_c8r8)].
    A lower energy, dispensed at the tool and workpiece interface, was also implemented
    during the surface finishing time to get higher surface finish using some semiconductor-based
    switching circuit [[9](#9789811483653-C8.html_c8r9)].


    Some experiments showed that the shape change of pulse generator, being used for
    machining, had a significant effect on the various machining characteristics.
    It was shown that energy density had a large effect on the tool wear rate (TWR)
    [[10](#9789811483653-C8.html_c8r10)]. Short pulse duration often was used for
    high precision machining. The surface morphology was found to be of higher value
    when using a uniform discharge of energy. It was also found that less arcing effect
    occurred if uniform shape of pulse for discharge machining was used [[11](#9789811483653-C8.html_c8r11)].


    ## Table 1: Various Reviews for Wire EDM.


    | S.No. | Author | Work Material | Input Parameters | Result |

    | --- | --- | --- | --- | --- |

    | 1 | Bhatia *et al.* [[12](#9789811483653-C8.html_c8r12)] | High carbon high
    chromium steel | Pulse on time(125-131µs), pulse off time(34-48 µs), wire tension(1-3),
    max. current(210-230A). | Effect of pulse off time was found significant on SR.
    Model developed had an error of 3.93%. |

    | 2 | Tilekar *et al.* [[13](#9789811483653-C8.html_c8r13)] | Aluminium and Mild
