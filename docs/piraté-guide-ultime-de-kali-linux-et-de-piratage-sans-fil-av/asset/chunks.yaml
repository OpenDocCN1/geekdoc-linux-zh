    ## EFFECT OF WIRE POSITIONING


    It has been found that the dimensional consistency of the wire used in WEDM plays
    a very important role in the accuracy and preciseness of machining. Also, with
    it, the accuracy of the worktable plays a very important role. Due to the presence
    of various other factors, this precision cannot be reached theoretically. As the
    controlling wire control during the machining area is very difficult (Fig. [3](#9789811483653-C8.html_c8f3)).
    Controlling, back and forth motion of the wire during sparking and cutting, is
    very difficult to hold at a precise position. Also, the section of wire, free
    of holding, is susceptible to vibration frequency. This is prevented by computer
    control that monitors the gap between the wire and the workpiece. But there are
    some other factors and reasons due which some of the vibration cannot be controlled,
    no matter how better the positioning system may be. This results in the gap change
    between the electrode wire and the workpiece in spark area which results in a
    continuous change in the breakdown voltage and discharge energy. It has been studied
    that this oscillation of wire, due to internal and external vibration, the wire
    can result in an oscillation of up to 10µm [[23](#9789811483653-C8.html_c8r23)].
    So machines need to be made as rigid as possible to prevent this vibration which
    ultimately would result in a high surface finish of the workpiece.


    ![Images/9789811483653-C8_F3.jpg Fig. (3))


    Wire drag and Tension produced during machining in WEDM [[25](#9789811483653-C8.html_c8r25)].


    ## EFFECT OF WIRE TENSION


    To prevent the vibration, in the wire during machining, the two ends of the wire
    are kept under tension thus minimizing vibrations. This helps in keeping the wire
    in straight form and maintaining a good cutting. This also leads to an equal gap
    of cut during the travel of wire. Still there can be the breakage of the wire
    due to excessive stresses produced in the wire. It acts as a limiting condition
    to the tension applicable in wire (Fig. [4](#9789811483653-C8.html_c8f4)) [[23](#9789811483653-C8.html_c8r23),
    [24](#9789811483653-C8.html_c8r24)].


    ![Images/9789811483653-C8_F4.jpg Fig. (4))


    Graph showing the cutting speed variation with wire tension [[23](#9789811483653-C8.html_c8r23)].

