    ## AWJM - 文献


    研究人员在加工 Al7475 时研究了 AWJM。研究中考虑了压力、移动速度、与工件的距离以及喷嘴倾角等各种参数。研究使用了 3mm 厚的铝片。AWJs（水磨切割机）在金属切削、切割飞机复合材料、金属、电路负载板等方面异常强大。


    研究了加工过程中的疲劳寿命和材料去除率（MRR）[11]。Yue *等人* [12] 通过实验寻找输入参数对 AWJM 过程的影响。通过改变压力、进给、磨粒流量和喷嘴角度来寻找对
    MRR 的影响。在切削氧化铝时得出结论：通过同时增加压力磨粒流量，MRR 会随之增加。还对一种特殊类型的 AWJM 过程进行了数值模拟研究 [13]。研究了超声波辅助
    AWJM 过程以发现磨粒侵蚀过程。研究了部分重叠和全重叠的情况。研究得出，具有锐边缘颗粒的 30° 冲击角可以获得更高的 MRR。振动辅助加工观察到的 MRR
    比无振动加工更高 [13]。


    使用 AWJM 切割了 Ti6Al4V-CFRP 等特殊材料 [14]。研究中首次考虑了锥角、锯缝宽度和粗糙度。传统加工在切削这些材料时面临各种困难，因为这两种材料（Ti6Al4V
    和 CFRP）的特性截然不同。该研究成功完成，为航空航天工业广泛使用的异种材料组合加工开启了新大门 [14]。Uthayakumar *等人* 研究了用 AWJM
    加工超合金。实验表明 AWJM 可以成功用于加工镍合金。使用 AWJM 可以以具有成本效益的方式产生光的光表面。材料的表面性能在加工过程中没有退化。观察到加工期间的压力和速度会影响锯缝壁倾角。发现
    MRR 受流速和压力等参数的强烈影响。在高压力和足够的移动速度下，获得了超合金的高表面光洁度 [15]。温度也被认为是 AWJM 的影响参数 [7]。在预定的定位处进行热处理，以沿加工路径对工件进行预热。假设预热可以软化材料，有助于大幅减少切力并增加
    MRR。观察到很难在长时间和较大尺寸下保持温度。由于由于原因，它只对微切削和微通道切割具有价值 [7]。还实验使用 AWJ 切削工艺加工难切的不锈钢钢 [16]。使用
    AJM 切割加工了 EN1 SS 不锈钢。在 3400-3800 bar 的水压力下切割了 20mm 的棒材。


    2016 年，Shukla *等人* 为 AA6351 铝合金优化了 AWJM 过程参数。使用了各种优化技术 [17)。研究重点是确定具有所需输出结果的工艺参数范围。初步地，使用
    Taguchi 方法优化工艺参数，揭示了获得所需结果所需的一系列各种工艺参数 [17)。Tamannaee *等人* 考虑了 AWJM 中的侵蚀率。加工中使用填充粉末的热塑性聚烯烃。从那时起，利用侵蚀率估计来创建加工配置以扩大边界侧壁的斜率
    [18]。还研究了用 AWJM 加工加工 Al-MMCs。研究重点是提高锯缝性能 [19]。还尝试使用 AWJM 加工 Ti-6Al-4V。还使用了 Taguchi
    和 ANOVA 分析等优化方法。进行了一系列实验以优化变量输入并达到所需的输出。对 MRR 和锯缝性能等所需的输出输出参数进行了优化 [20]。碳纤维氧树脂作为一种广泛使用的轻质材料，其
    AWJM 应用仍然有限。因此，进行了一项使用 AWJM 加工碳纤维氧树脂复合材料的研究 [21]。钛及其合金被归类为难切材料。M. Douiri *等人*
    使用 AWJM 过程加工了钛合金 Ti–6Al–4V [22)。研究揭示了加工过程中的几个不同区域。区域 1，初始阶段损伤发生在较低攻击角。随后切削进行到区域
    2。该区域切削平滑。攻击角增大。在区域 3 中，观察到不规则的切削。喷射在区域 3 发生了偏转 [22)。Inconel 因其机械性能在发动机中有多种应用。同样的机械性能使得
    Inconel 这种材料很难切削。AWJM 已成功用于切割 Inconel [23]。为了进一步改进研究，使用了 Taguchi-Grey 关联方法来优化工艺参数
    [23]。


    还研究了与铣削相比的 AWJM 表面性能，见表 1。得出结论：AWJM 在产生所需光洁度方面比铣削更具优势且效果更好 [23]。Suresh *等人* 使用
    AWJM 加工工艺钻了纤维增强复合材料。与其他报告相反，磨粒粒径不影响 MRR。还观察到压力影响工件的锥度 [24]。最近在 2018 年，Xiaochu
    *等人* 执行了各种实验以开发 WJM。分析了各种输入和输出参数 [25]。


    还进行了一些理论研究以分析 WJM，见表 2。Melentiev *等人* 使用理论方法分析了微 AJM。特别使用了小喷嘴 [26]。Jagadish *等人*
    使用了软计算方法。通过软计算方法提高了表面质量和服务寿命 [27]。


    表 1 **AWJM 综述。**


    | **序号** | **作者** | **工艺** | **贡献** |

    | --- | --- | --- | --- |

    | 1. | Haghbin *等人* [28] | AWJ 铣削 | • 表面演化模型。 • 微通道加工 • 加工较深的槽 |

    | 2. | Jafar *等人* [29] | AWSJ 切割 | • 加工硼硅酸玻璃 • MMR • 表面改进。 |


