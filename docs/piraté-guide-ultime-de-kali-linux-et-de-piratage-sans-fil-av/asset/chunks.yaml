    relation analysis to investigate the WEDM cutting parameters on metal matrix composite
    of magnesium reinforced with reduced grapheme oxide. L27 orthogonal array was
    applied to design the experiments and results were confirmed with the application
    of ANOVA. It was determined that reinforcement weight percentage and pulse on
    time were the most influential parameters among other input parameters such as
    pulse off time and wire feed rate for MRR and SR.


    Chu *et al.* [[24](#9789811483653-C7.html_c7r24)] discussed about a new feasible
    low frequency vibration assisted technique for generating microgroove on metal
    plates for high speed WEDM. The ridge width was significantly affected by the
    average current, vibration frequency and feed rate. However, low frequency vibration
    assisted WEDM can generate a smaller microgroove surface structure and higher
    processing efficiency as compared to traditional WEDM process.


    Rajkumar *et al.* [[25](#9789811483653-C7.html_c7r25)] addressed machining of
    aluminium metal matrix composites reinforced with nano alumina particle in Wire
    electric discharge machining. Voltage and pulse on time were found responsible
    input parameters for achieving higher MRR. Also, controlled pulse durations improved
    the surface integrity by reducing the machining defects.


    Zhang *et al.* [[26](#9789811483653-C7.html_c7r26)] analyzed and reduced the power
    consumption during machining of thin wall components in WEDM and studied the thermal
    deformation of the components. They utilized new micro-crack wire electrode to
    ameliorate machining characters. Also, the investigation results showed that micro
    crack wire can reduce the energy consumption and debris pollution at great level.


    Sharma *et al.* [[27](#9789811483653-C7.html_c7r27)] presented the optimization
    of input variables of WEDM while machining Ni[55.8]Ti shape memory alloy rich
    in Ni, specifically used in Bio- medical. L[16] orthogonal array was selected
    using Taguchi DOE for conducting the study. Outcomes from the study confirmed
    that machining at optimum conditions results in better surface integrity and higher
    MRR.


    Smirnov *et al.* [[28](#9789811483653-C7.html_c7r28)] performed WEDM of 3y-TZP/Ta
    ceramic- metal composites and found that SPS Sintered composites have suitable
    electrical conductivity for WEDM process. Moreover, conclusion was made that high
    accuracy can be achieved while machining without much compromising with mechanical
    strength of the component.


    Zhou *et al.* [[29](#9789811483653-C7.html_c7r29)] fabricated and characterized
    the hydrophobic Ti[3]SiC[2] surfaces in Wire electric discharge machining with
    regular and controllable micro-grooved structures. Relationships between contact
    angles, depth-width ratio and surface quality were also investigated and it was
    found that depth- width ration can be useful in predicting the parallel contact
    angle with a small margin of error.


    Pramanik and Basak [[30](#9789811483653-C7.html_c7r30)] mentioned the importance
    of uninterrupted machining in order to control energy and time consumption in
    WEDM for hard materials. Wire rupture for Ti-6Al-4V alloy workpiece was investigated
    to make the machining process highly sustainable. No workpiece material was detected
    on the tips of the wire, though, traces of oxides were formed because of high
    temperature oxidation were noticed on wire broken tips. Furthermore, at low temperature,
    it was observed, wire with high tension can rapture rapidly.


    Thankachan *et al.* [[31](#9789811483653-C7.html_c7r31)] predicted the performance
    measures in WEDM during machining of aluminium based alloys. Taguchi technique
    coupled with GRA was utilized to perform the investigation. Optimum MRR and Surface
    Roughness values were predicted based on the input control factors by developing
    artificial neural network approach. Outcomes were found efficient when compared,
    different models.


    Nain *et al.* [[32](#9789811483653-C7.html_c7r32)] used particle swarm optimization
    technique so as to improve the accuracy and productivity of wire electric discharge
    machining of super alloy Udimet-L605\. Among other input variable, pulse on time
    was found to impact the cutting speed, wire wear ration and geometrical deviation
    extremely. The compositional modifications because of erosion and HAZ were studied
    with SEM and EDS.


    Chaudhary *et al.* [[33](#9789811483653-C7.html_c7r33)] studied the influence
    of varying wire tension on performance measures while machining AISI 304 in WEDM.
    It was noticed that wire tension had no influence on kerf width, but, affects
    the MRR, SR and micro-hardness significantly. While SR decreases with an increase
    in wire tension, slight improvement was recorded in case of MRR.


    Gaitonde *et al.* [[34](#9789811483653-C7.html_c7r34)] discussed the optimization
    of input variable of WEDM of HCHr steel employing integrating approach of RSM
    and differential evolution. L27 orthogonal array was selected based on Taguchi
    experiment design technique to carry out the investigation. More pulse on time
    resulted in higher MRR.


    Goyal [[35](#9789811483653-C7.html_c7r35)] represented the study of optimization
    of WEDM key input parameters for improved MRR and SR of Inconel 625 by employing
    normal and cryogenic zinc coated wires. MRR and SR were found considerably affected
    by pulse on time, tool electrode and current intensity. Microstructure of the
    machined surface was analyzed through SEM.


    Mouralova *et al.* [[36](#9789811483653-C7.html_c7r36)] distinguished the morphology
    and topography of WEDM structural material surfaces. SEM and contact less 3D profilometer
    were utilized to carry out the analysis. These instruments permitted the evaluation
    of profile and creating 3D surface image for further study.


    Arikatla *et al.* [[37](#9789811483653-C7.html_c7r37)] discussed the parametric
    optimization of WEDM process using RSM while machining Ti-6Al-4V alloy. The experiment
    was carried out with five input process parameters for improving MRR, kerf width
    and SR. surface properties were examined using SEM. Wire tension and servo voltage
    had high influence on surface roughness and enhanced the surface quality of machined
    surface.'
