    ## 摘要


    电花加工（EDM）是一种非传统的加工工艺，广泛用于切割镍及其合金、钛以及难以通过其他传统工艺加工的复杂形状材料。EDM 利用电能和热能通过去除不需要的材料来加工工件。该过程使用两个电极，阳极和阴极，其中工具作为阴极，执行作业的工件作为阳极。电流、脉冲开启和关闭、、电压等因素可用于优化
    EDM 的主要加工参数，如 `MRR`、刀损率、表面粗糙度`etc.`。本的研究重点是这些参数对由 `CMs`、碳化钨和钴组成的复合材料的影响。最后，还讨论了需要进一步改进和研究的未来前景领域。


    **关键词：** 陶瓷，复合材料，电花加工。


    ***


    ^* **通讯作者 Mamta**: 机械工程学院，Maharaja Agrasen University, Baddi, Solan, 印度；电子邮箱：dahiya.mamta56@gmail.com


    ## 引言


    电花加工（`EDM`）是一种用于金属加工的主流制造工艺。在此过程中，加工以所有本质上具有导电性的材料的熔化和蒸发形式进行，这是通过控制电极与执行作业的工件之间的火花来实现
    [1, 2]。这就是为什么 EDM 也被称为非传统的火花侵蚀热电加工过程 [3]。在一段时间内，EDM 已成为一种高效的材料去除工艺。EDM 具有以高精度加工非常复杂和坚硬材料的能力，而这些材料使用其他传统方法很难加工。


    为了跟上现代制造业的步伐，EDM 还具有作为自动化工艺的能力。EDM 的主要应用在于原型制造、模具制造领域以及大多数从事制造高合金钢等机械金属的行业。


    过去的几十年里，陶瓷材料（`CMs`）通过其在所有主要工程领域的应用（如汽车、航空领域、涉及电气电子设备制造的领域）证明了自己的存在 [4]。一些主要应用如弹道装甲的制造、汽车制动系统、柴油颗粒过滤器、计算机内存组件、传感器以及各种医疗产品如假肢`etc.`也涉及
    CMs 的使用 [5]。CMs 有如此广泛应用的原因是其优异的机械性能，如高压强度、高硬度和化学和耐磨性。


    `WC–Cos` 也被探索用于 EDM 加工。一项特殊的 CIRP 报告报道了 EDM 在硬质化物中的应用 [6]。尽管有报道说 EDM 表面确实存在残余热应力
    [7]。组来自


    ## EDM 原理


    在 EDM 中，材料的去除通过控制两个电极之间的电放电来实现，其中一个电极是工具，另一个是执行作业的工件，如图所示（1`）。


    ![](img/9789811483653-C6_F1.jpg)**图 (1))**


    EDM 工艺原理 [8]。


    两个电极被某种电缘介质隔开，该介质可以是电缘油或去离子水。然后施加电压形成一个可以建立电流的等离子体通道。当介质达到击穿电压时，就会发生放电。由于 EDM
    过程基于通过熔化和蒸发去除材料，因此当形成通道底部的温度达到约 ≥ 10,000°K 时，第二个电极（工件）发生熔化和蒸发，从而导致材料的去除。


    ## 陶瓷电花加工


    CMs，如二硼化钛（`TiB[2]`）、掺硅碳化硅（`SiSiC`）和氮化化钛（`TiN`），本质上是导电的，可以通过 EDM 加工 [9]。根据 Luis
    *et al.* [10] 的研究，从无机材料获得的通常具有高纯度的材料被称为陶瓷或先进 CMs。这些 CMs 进一步分为氧化陶瓷（如 `Al[2]O[3]`
    或 `ZrO[2]`）和非氧化陶瓷（如 `Si[3]N[4]`）。


    使用 EDM 加工 CMs 也可以分为天然材料、非导电材料和导电材料。大多数导电材料通过引入某些导电第二相由不纯材料制成（图 2`）。


    ![](img/9789811483653-C6_F2.jpg)**图 (2))**


    根据导电性分类的陶瓷材料 [11]。


    在 CMs 中加入这些相增加了导电性。据报道，添加这些相后硬度、强度和断裂韧性也有某些提高 [12, 13]。


    ## 复合陶瓷的材料去除机制


    Lauwers *et al.* [13] 进行了一项研究，以开发耐磨性且能够通过 EDM 工艺加工的 CMs。该研究的重点是调查 EDM 工艺参数与 CMs
    微观结构之间的关系。对于基于 `ZrO[2]`、`Al[2]O[3]` 和 `Si[3]N[4]` 的 CMs，通过 `TiCn` 和 `TiN` 诱导了某些导电相。结果观察到，不仅是熔化和蒸发，氧化和基体材料分解等因素也是有效去除材料的原因。此外，还发现过程中裂纹的形成是由于剥落效应导致的。材料去除的主要机制见表
    1`。


    不同复合材料 CMs 的材料去除 [13]。**


