    # Artificial Intelligence and Robotics in The Manufacturing Industry: Opportunities
    and Challenges


    Hitesh Pahuja, PK Khosla, Balwinder Singh


    Centre for Development of Advanced Computing, Mohali, Punjab, India


    ## Abstract


    Whatever is being done by humans today, will be done by Artificial Intelligence
    (AI) based systems, but at computer speed, scale and scope. AI is making its path
    towards the transformation of the manufacturing industry and improving the manufacturing
    processes. According to the panel of Forbes technology council members, 13 different
    sectors, including the manufacturing industry will be revolutionized by artificial
    intelligence. AI and robotics can transform the complicated task into consistent
    along with precise solutions. With the increasing operation of the industrial
    robot have drastically marked an increased deployment of AI in manufacturing processes.
    Artificial Intelligence (AI) is widely applied and is gradually approaching in
    the manufacturing segment, easing the automation with learning and error-free
    decision-making using learning algorithms. AI-driven systems are placing a simpler
    route to the future manufacturing industry by producing a lot of benefits by presenting
    innovative prospects, boosting production of goods with improving efficiencies,
    by implementing general AI to make machine interaction closer to human interaction.
    This technology enables the manufacturer to overcome various challenges that have
    remained in the manufacturing sector such as expertise shortage, poor decision
    making, problems associated with integration, and overloaded data. Hence, the
    implementation of AI in the manufacturing sector allows companies to fully renovate
    their procedures. It allows smart AI-robots/machines to collect and extract data,
    acknowledge various patterns, learn from that patterns and adapt to new environments
    through a machine or deep learning based on the complexity of tasks assigned to
    them. Therefore, the deployment of AI and robots in the industry will transform
    the mass-production along with the error-free decision-making capability. AI-based
    Robots in Industry 4.0 can do persistent actions such as from designing the manufacturing
    model, developing expertise, developing new automation solutions, eliminating
    human error along with providing exceptional quality in products. With the implementation
    of AI, robots will replace manpower and carry out hazardous activities. As a result,
    the number of accidents will drop across all sections in the manufacturing sector.


    AI & robotics technology will free the manufacturer issues related to untrained
    workers. Hence, entrepreneurs can concentrate on further modernization of industries
    and scaling their industry to greater heights. Apart from the numerous opportunities
    in adopting emerging technologies like AI, there are some challenges too for industrialists.The
    AI and robotics technology into the manufacturing industry would necessitate a
    huge capital investment for startups and existing manufacturers. But the return
    on investment will be high because smart machines will begin to take care of daily
    activities, companies will incur a considerably lower operating cost. AI’s proponents
    claim that technology is only an evolutionary form of automation, a predictable
    result of the Fourth Industrial Revolution. AI may be efficient at creating things,
    improving them, and making them cheaper. But there is no replacement for human
    ingenuity in dealing with the unanticipated changes in tastes and demands.


    **Keywords:** Artificial intelligence, Data, Manufacturing, Machine learning,
    Robotics.


    ***


    ^* **Corresponding author Hitesh Pahuja**: Centre for Development of Advanced
    Computing, Mohali, Punjab, India; E-mail: `hitesh@cdac.in`


    ## INTRODUCTION


    Artificial intelligence (AI) is a technology that accentuates the formation of
    smart and intelligent machines that work and respond like individuals. The machines
    or smart computer with the capability to accomplish intellectual roles such as
    observing, learning, decision making, reasoning, and solving problems are called
    artificial intelligence computers or machines. Whereas, the robotics is a field
    in artificial intelligence which deals in creating smart and intelligent robots
    using deep learning technology. Robotics technology is a field of artificial intelligence,
    which is comprised of all the Engineering fields such as mechanical, electrical
    and computer engineering for planning, designing, assembly, development and application
    of AI-based robots as shown in Fig. ([1]).


    ![](Images/9789811483653-C9_F1.jpg) **Fig. (1))**


    Representation of AI robotics with Venn Diagram.


    There are the smart machines working in real-time [[1], [4], [6]]. They are positioned
    for monitoring the objects by detecting, accumulating, shifting, modifying the
    basic properties of the object, damaging it, or to have an intelligent impact
    thus releasing manpower from doing a monotonous job without getting tired, or
    disturbed. The AI robots have advanced mechanical structure created to achieve
    a task with high sensitivity and accuracy as shown in Fig. ([1]). It also comprises
    electrical modules that power as well as control the mechanical structure of robots.
    Furthermore, it contains some advance level of software programming that governs,
    in what manner a robot does multiple tasks simultaneously.AI and robotics are
    the intelligence revealed by smart machine and robots to accomplish tasks that
    usually involve intelligence, human knowledge, and learning, skills, such as perceiving,
    learning, reasoning, solve problems, decision making and visualizing, etc. The
    emerging technologies comprise a variety of subset technologies like machine learning
    and deep learning, which are be learned with time, as subject to more and more
    data as shown in Fig. ([2]).


    ![](Images/9789811483653-C9_F2.jpg) **Fig. (2))**


    Representation of AI and its fields.

