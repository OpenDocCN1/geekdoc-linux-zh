    Mohri *et al.* [26] 进行了实验，研究了利用辅助电极通过电火加工（EDM）工艺加工陶瓷材料（CMs）。实验使用煤油作为工作液，观察到使用铜电极可以很容易地加工陶瓷材料。在另一项研究中，报道了线电火加工
    ZrO[2]-TiN 复合材料。放电等离子烧结技术制备了 ZrO[2]-TiN 坯 [27]。Sano *et al.* [28] 使用聚晶金刚石（PCD）电极进行了电火加工实验。使用了两种平面的
    PCB `CTB-010` 和 `CTH-015`，并将结果与 `Cu-W` 电极的结果进行了比较。观察到，在短脉冲持续时间下，PCD 电极的损耗较低，为
    1.5%，而在长脉冲持续时间内无损耗，而 `Cu-W` 电极在相同条件下损耗为 10%。Palanikumar *et al.* [29] 了测试，以研究电火加工加工
    `WC/Co` 硬质复合材料的工艺参数。还分析了各种加工参数，并观察了这些参数对 `MRR` 和表面质量的影响。在另一项研究中，Hanaoka *et al.*
    [30] 研究了使用辅助电极的电火加工对 Si[3]N[4] 复合材料放电行为的影响。结论指出，绝缘材料的 `MRR` 结果优于导电材料。Gadalla 和
    Tsai [31] 进行了一些实验研究，以证明钴含量和晶粒大小对硬质钨钢各种加工特性的影响。观察到 `MRR` 速率可以根据钴的百分比而变化。通过增加钴的百分比可以提高
    `MRR` 并增加电火加工过程的稳定性。Lin *et al.* [32] 进行了一些调查，并试图建立 `MRR`、表面粗糙度、表面裂纹等各种参数与放电频率之间的联系。结果观察到，通过增加电能放电会显著增加电火加工工艺形成材料的
    `MRR` 和表面粗糙度。


    Song *et al.* [33] 进行了实验，研究了电火加工工艺对含有 10.5% 钴的 `WC-Co` 复合材料的影响，并使用水喷淋作为介质质。结果显示，使用水喷淋介质没有产生腐蚀现象，且
    `MRR` 增加，同时电极损耗显著减少。Yu *et al.* [34] 研究了使用两种电火加工（干电火和常规油基电火）加工硬质材料的实验。结果观察到，与常规油基电火相比，干电火具有更高的加工速度和更低的电极损耗。进一步指出，干电火还可以用于作为工件材料的硬质材料的三维加工。在另一项研究中，Kumar
    *et al.* [35] 研究了电火加工工艺对含有 5 wt. % `Sic` 和 5 wt. % `B[4]C` 的 `Al635i` 复合材料某些加工参数（如脉冲开启/关闭时间、脉冲电流和电压）的影响。观察了刀具损耗、表面粗糙度和功率耗，并指出随着放电和脉冲电流的增加，刀具磨损的可能性显著增加。在类似的研究中，Patel
    *et al.* [36] 通过电火加工工艺优化了 `Al[2]O[3]-SiC[w]-TiC` 复合材料的表面粗糙度参数。通过在 `Al[2]O[3]`
    中引入 `SiC` 晶须和 `TiC` 颗粒实现了机械性能的提高。结果得出，表面设计法对于获得电火加工形成的复合材料更好的表面光洁度有用。Selvarajan
    *et al.* [37] 回顾了工业应用中电火加工复合材料的各种参数。讨论了获得更好输出所需的各种因素，得出结论：在研究材料中，`A[l2]O[3]`、`SiC`
    和 `TiC` 因为于加工而被适用于大多数应用。Kangarajan [38] 进行了研究，并比较了粉末冶金工艺和电火加工制备 `WC-Co` 复合材料的磨损机制结果。使用概率神经网络绘制了不同工艺的磨损机制图。将磨损状态分为三部分：轻磨损、严重磨损和极端磨损。这些状态基于材料磨损率和表面粗糙度等各种因素。还观察到，电火加工形成的表面机械性能受到放电产生的气泡和坑洞的影响。研究得出，从磨损表面粗糙度和磨损率的角度，陶瓷磨损状态可以通过轻磨损、严重磨损和极端磨损进行识别。电火花在加工表面产生坑洞、气泡和裂纹，恶化了电火
    `WC-Co` 表面的光洁度和机械性能，对于表面敏感型应用应将其去除。Dinesh *et al.* [39] 进行了研究，并调查了不同工艺参数对电极进给率、脉冲开启/关闭时间和放电等各点的影响。结果观察到电流是显著影响电火加工复合材料
    `MRR` 和表面粗糙度的主要因素。Aidil *et al.* [40] 了研究并批判性地检查了影响电火加工工艺各种加工因素的各种参数。观察到，由于等离子通道的膨，随着脉冲开启时间的增加，材料的
    `MRR` 速率和表面粗糙度降低，导致材料去除减少。同样，相同参数的值随着脉冲关闭时间的增加而增加。


