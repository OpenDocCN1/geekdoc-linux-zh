    Patel *et al.* [[19](#9789811483653-C5.html_c5r19)] found that there were some
    materials like Inconel 718 and Titanium (Ti6Al4V) that were not easily machinable;
    such materials were needed to have low hardness so that the abrasives can penetrate
    the surface thus causing the erosion to take place. For this there was some thermal
    assistance provided by heating the workpiece up to a temperature of 850ºC by using
    an oxy Acetylene gas flame, thus resulting in lower hardness on the surface and
    increased MRR using abrasive water jet machining. Though there was a drastic change
    in the temperature during the process, but no stresses and crack were discovered
    in the machined part.


    ### Effect of Various Jet Conditions


    #### Intermittent Jet Conditions

    It was found that when a larger grooves or cavities were made then there was an
    abrasive settling tendency at the bottom of such features thus preventing the
    upcoming new abrasive particles to reach the bottom hidden by such abrasives thereby
    subsequently lowering the MRR. This problem of particle accumulation was solved
    by creating an intermittent pattern of blocking the abrasive flow and passing
    a high velocity pressurized jet for that duration. This was achieved by installing
    a 100 Hz Solenoid valve which helped in creating this alternate pattern of abrasive
    and high pressure jet of air [[20](#9789811483653-C5.html_c5r20)]. This helped
    in removing the accumulated abrasives at the bottom. It was found in the research
    that for a sample shot study of 500, the hole depth was increased from 440µm to
    740 µm with an open/closing time of 10/40 milli seconds.


    #### Submerged Jet Conditions

    With the advancement of the AJM, large amount of technical and economical advantages
    came, however its environmental aspects also came into effect like noise created
    during the process. To look into this aspect a submerged AWJM was taken into consideration
    [[21](#9789811483653-C5.html_c5r21)]. This somehow resulted in the lowering of
    the kinetic energy of the particles before reaching the machining surface. This
    also resulted in the reduction in the drag force on the jet thus leading to less
    diffraction of the jet along the diameter of nozzle [[22](#9789811483653-C5.html_c5r22)].
    This also gave the idea of having less dust in the environment during the machining
    as was seen in the conventional methods there by leading to some medical effects
    like lungs damage. It was found that a reduction of up to 61% was obtained when
    using the glycerin as liquid for submerging accompanied with 42% with liquid polymer
    and 36% with water [[23](#9789811483653-C5.html_c5r23)]. There was a considerable
    increase in the nozzle life when the liquid was mixed with abrasive slurry and
    only jet of high velocity was directed on to the workpiece. The only drawback
    was the substantially low velocity of the particle.


    ## APPLICATIONS


    Abrasive jet machining has found a lot of its applications with some advantages
    accompanied with some drawbacks. This section discusses about some of those advantages
    and also some drawbacks of it. Also, its application in the areas like tribology
    is analyzed. Some merits are enlisted blow:


    - The study shows the advancement of the AJM from macro to micro scale thus giving
    it a boundless application in various areas and industry. Also, its large application
    has been seen to machine

    - It has found not only its technical aspects but also its environmental aspects
    that could lead to better machining ability and environment possibilities thus
    leading to the better process flexibility.

    - There has been a lot of improvements in the surface properties like grain refinement,
    hardening of the material as an effect of plastic deformation during blasting
    [[25](#9789811483653-C5.html_c5r25)].

    - It has been found that the micro machining in occurs almost minimal cost as
    compared to conventional machining methods and also the abrasives can be recycled
    [[26](#9789811483653-C5.html_c5r26)].


    Despite all these advantages some drawbacks are seen like the tapered geometry
    formation while machining a groove of long depth [[28](#9789811483653-C5.html_c5r28)],
    micro crack formation on a substantial brittle material, MRR is not stable in
    micro machining as fine particles with stable flow rate is not attained [[27](#9789811483653-C5.html_c5r27)],
    rate of production in micro application is also substantially low and some critical
    noise levels above 105db are also observed [[21](#9789811483653-C5.html_c5r21)].


    ### Surface Texturing and Aspects for Tribology


    Costa *et al.* found that surface texturing is a method of creating a uniform
    micro texture consisting of sharp impressions with controlled geometry [[29](#9789811483653-C5.html_c5r29)].
    It was found by various studies that the micro texturing gained its value as the
    world started to move towards advancements in electronics. It was noted that the
    boundary between the normal AJM and micro AJM was the orifice design criteria
    in shape of its opening diameter. Various studies performed show that that concise
    the resolution of the channel homogeneity, up to 5% for a path of 100µm using
    23µm size abrasive particles and, limited it by the size the mask and the wear
    found at the edges [[30](#9789811483653-C5.html_c5r30)]. It has also been summarized
    from the studies that the major factors limiting this are the mask material used,
    the fine particles size as low as 3µm leading to consistent flow problem along
    with low kinetic energy. After attaining the capability of surface texturing,
    it has found its path in tribology also as shown in this section. It has been
    seen that in medical field a large amount of knee and hip operations and replacement
    have taken place all over the world. With time 80% of these have reported wear
    and tear within some year [[31](#9789811483653-C5.html_c5r31)]. This is somewhat
    relating to the surface integrity and the hardness of the material being used.
    Out of all the sliding pair developed for artificial joint the most successful
    is the combination of metal to polyethylene having a 90% success rate with life
    of 15 years. Further studies signify the wear and tear due to surface imperfections,
    cracks, burrs leading to less joint life. It is being stated that there should
    be an artificial joint enhancement that leads to the collection of all the particles
    being produced due to wear and tear while usage and at the same time provide lubrication
    for its smooth functioning thus increasing it serving life up to 30 years. Such
    minor pores, for the collection of debris and lubrication, were difficult to machine
    by conventional machining methods, so, AJM has been found useful in drilling these
    holes. A technique to polish Cobalt-Chromium-Molybdenum alloy along with engraving
    grooves on micro scale has been developed that could be applied in prosthesis
    so that least wear could occur [[32](#9789811483653-C5.html_c5r32)].


