  trans: '


    在前面的章节中，我们看到 AJM（磨粒材料射流加工）在各种延性、脆性材料以及各种工艺参数下具有多种应用。与此同时，还观察到了一种新型侵蚀类型，被称为“弹性侵蚀”。总体而言，去除机制（`MRM`）描述了机器效率。在脆性材料中，磨粒撞击机器表面产生一个垂直于表面的向下的裂纹，从而在变形材料截区域底部产生一个与顶侧平行延伸的斜向裂纹。在这里，切屑掉落的部分被假设为半球形，其深度或半径等于单个磨粒撞击产生的裂纹。研究人员已经针对标准模型，对陶瓷材料的韧性、硬度和粘弹性、切切屑的几何形状以及磨粒压痕力与切切屑半径之间的关系进行了研究。作者还提到，特定材料的裂纹传播需要特定的能量。


    ## 弹性模式 MRM


    之前已经讨论过，表面完整性受粒径的影响[4]。脆性/延性侵蚀会导致微观层面表面结构的变化。当我们将磨粒尺寸从 120 nm 改变到 40 nm 时，没有发现表面粗糙度的影响。因此，使用颗粒有助于减少最终机器表面的变形和裂纹。因此强调在使用尺寸小于
    100 nm 的磨粒时，将压痕机制改为“表面面积机制”。传统的较大尺寸磨粒在表面上直线运动，但细磨粒可以随流体改变方向。对于特定的磨粒质量与流速的比例，会产生切向力，从而将路径变为弯曲轨迹并渐近地撞击工件基底（图
    **4**)）。因此，当产生侵蚀所需的能量低于阈值能量时，认为发生了弹性侵蚀。考虑到这一点，了一种基于产生化学侵蚀（即弹性侵蚀）的新理论，该理论考虑了具有化学吸收作用的羟化效应。在这种情况下，纳米颗粒与基底表面发生化学反应，在基底顶层
    1nm 以内形成键。Peng 等[33] 也提到，表面粗糙度可以光滑到 Ra 0.17nm。在这一机制下，最终工件表面没有看到任何缺陷。


    ![](img/9789811483653-C5_F4.jpg) **图 (4))**


    不同尺寸磨粒的路径对比[33]。


    ## 各种工艺参数的影响


    ### 磨粒尺寸


    磨粒尺寸在任何磨粒射流图中都起着非常重要的作用。随着磨粒尺寸的增加，与其相关的体积和质量也会发生变化，进而影响磨粒的动能，从而影响 AJM 的 `MRR`，见表
    **1**。但即使颗粒比喷嘴尺寸小 15 倍，喷嘴尺寸也限制了使用的磨粒尺寸。研究发现，粒径的增加也导致了表面粗糙度的增加和更大切屑的产生[34]。Kowsari
    等[35] 在研究中指出，25µm 和 10µm 尺寸的颗粒在烧结陶瓷材料加工中产生了相似的峰谷粗糙度。在陶瓷情况下，切屑是通过颗粒从基底脱落移除的，然后与结合力更强的金属颗粒结合。看到的另一个因素是磨粒颗粒对工件表面的撞击，这被认为由于两者之间的静摩擦引起的。还发现，与较大的磨粒尺寸相比，细颗粒的嵌入的倾向较低[36]。


    ### 流速


    流速定义为在相应数量的载体气体、液体或浆中提供的磨粒颗粒克数。Li 等[37] 显示，流体动力学也可以取决于此以外的其他工艺因素。结果显示，随着流速降低，产生的槽形状变得有些呈锥形。使用干燥剂、在储罐中保持低水平的磨粒等被认为具有最佳的磨粒流。


    ### 喷嘴材料和几何形状


    与整个加工过程一样，所有类型的 AJM 都会以喷嘴磨损的形式发生刀具损坏。


    它是 AJM 最精密的部分。带有颗粒介质的高压载气通过喷嘴孔。在通过过程中，颗粒在喷嘴壁上发生多次碰撞，从而导致其磨损和部件轮廓扰动、工艺不稳定、射流扰动。因此，将其视为改进区域非常重要。喷嘴磨损以克/分钟的“喷嘴重量损失率”（`NWLR`）衡量。在各种建议的喷嘴材料中，氧化陶瓷喷嘴与不锈钢喷嘴相比具有更长的寿命。与
    Al[2]O[3]/钛复合涂层相比，单体 `B[4]C` 涂层的 `NWLR` 低了 30%。与此同时，发现了功能梯度材料（`FGM`），其涂层被证明耐磨性是标准喷嘴的
    4 倍。通过模拟相同的 `FEM` 模型还看到喷嘴入口处的应力水平较低。同时，增加喷嘴长度会降低出口处的磨损率。这样做，颗粒速度矢量沿喷嘴长度达到相同方向，从而减少磨损。将喷嘴长度从
    76mm 增加到 126 mm，喷嘴寿命增加了一倍。孔径：喷嘴直径的最值为 0.4 [38]。发现大量的喷嘴磨损也是由于张力和热应力引起的。喷嘴入口的最佳角度被发现为
    11°。同时，较大的入口角度产生了应力。


