  trans: '


    B. Lauwers *等人* 调查了 `ZrO[2]` 超声波辅助加工的材料去除率、表面质量和表面裂纹。论文表明，在加工过程中振动的影响下，切力和刀具磨损降低了。因此，生产率提高了
    [2]。


    Cong *等人* 提出了旋转超声波加工期间振幅的方法。本文得出结论，振幅在不同条件下会有变化。当使用分度刻度法测量振幅并与新方法比较时，结果是相同的。但在有或无旋转超声波加工的情况下使用不同规格的工具进行检查时，结果是不同的
    [3]。


    Heise *等人* 研究了花岗岩和石材上的超声波辅助钻，这是一种混合加工工艺。当采用超声波工艺时，切力和扭矩减少了多达 20%。可以通过使用机器人代替加工中心来实现
    [4]。


    Kei-Lin 和 Chung-Chen 发表了一篇关于旋转超声波加工的论文，其中玻璃用于铣削作业。根据表面粗糙度参数评估了加工效率。发现，与非超声波铣削相比，超声波铣的表面质量非常差
    [5]。


    Liu *等人* 开发了旋转超声波加工中的切力模型。切力在脆性材料加工过程中起着非常重要的作用。基于切力模型建立了切力与主速、进粒量、超声振动振幅和磨粒颗粒等输入变量之间的关系。研究分析过程中进行了各种假设，如磨粒颗粒的形状及其材料。使用了八面体形状的金刚磨粒颗粒。开发的模型提供了切力信息，即切力随着输入变量参数的增加而增加，随着输入变量参数的减少而减小
    [6]。


    Rasheed 比较了微电火花线（micro-EDM）和激光加工产生的微孔结果。比较了材料去除率、孔径锥度、产孔的入口和出口直径以及产孔的同心度等加工参数。得出结论：如果工件的表面质量不重要，那么为了获得高材料去除率，可以使用激光加工。如果需要表面质量，可以使用微电火花线，但材料去除率将降低。因此，可以采用混合工艺以兼顾两种工艺的优点
    [7]。


    Das *等人* 研究了超声波加工后六形孔的表面粗糙度和锆生物陶瓷材料的材料去除率。通过遗传算法技术利用控制参数获得了优化结果。在进行的实验中，通过优化参数，分别获得了
    0.2365g/min 的材料去除率和 0.58 微米的表面粗糙度 [8]。


    Lian *等人* 执行了若干实验，分析了在有无超声振动辅助的情况下微铣 A16061 材料的表面粗糙度。观察到在超声振动辅助加工下 A16061 获得了更好的表面光洁度。当选择合适的超声振动振幅时获得了更好的结果
    [9]。


    Cong *等人* 对超声波加工中孔入口和出口表面粗糙度提供了解释。论文考虑了假设及其测试。实验在不锈钢工件上进行。得出结论，工件入口和出口表面粗糙度的差异取决于刀具在工件整个长度运动过程中磨粒结合部分
    [10]。


    Selvakumar 和 Arulshri 利用遗传算法以及遗传算法与人工神经网络结合的方法完成了优化夹具布局的工作。研究目的是减少工件在夹具上的后的变形以及运行期间的加工力。最后，比较了遗传算法和人工神经网络方法的结果。证明遗传算法与人工神经网络方法的结合优于纯遗传算法
    [11]。


    Yang *等人* 对齿轮超声抛光进行了研究。与传统的抛光方法相比，这是提高齿轮表面质量更好的工艺。本文的目的是确定锥面齿轮超声抛光设计的方法论。实验后得出结论，齿轮传输质量的超声抛光优于传统的抛光方法
    [12]。


    Feucht *等人* 展示了使用超声波辅助加工硬脆材料或先进材料（如用于医疗和航空天领域的陶瓷和纤维增强材料）的结果。纤维增强材料本质上是不均匀的。因此，加工这种材料仍然困难。但当换能器叠加在传统加工的主轴上产生振动时，由于刀具周期地从工件或零件上抬起，切力和刀具磨损率降低了
    20% 到 30% [13]。


    Muhammad *等人* 讨论了混合加工技术，其中结合使用了超声辅助车削和热加工技术来加工钛合金。结果是钛合金的切力降低了，表面粗糙度得到了大幅改善。在热超声辅助车削中，表面粗糙度观察到
    50% 的额外提升 [14]。


    Kumar *等人* 在切割硬脆材料时提出了振动辅助加工。振动可以施加给工具、工件和工作介质。在超声辅助车削过程中，加工参数得到了改进，传统加工相比切力减少了
    40% 到 45%，平均切力下降了 40%。刀具磨损率降低，工件表面粗糙度得到改善 [15]。


    Bhosale *等人* 发明了工艺参数对氧化锆陶瓷复合材料材料去除率、刀具磨损率和表面形貌的影响。通过振幅、带有载液的磨粒颗粒液对工艺进行了分析。研究表明，当使用硬而粗的磨粒时，刀具磨损率往往会增加。在相似加工条件下，使用碳化硼磨粒比碳化硅磨粒会导致较高的刀具磨损率。研究结论认为浓度对刀具磨损率的影响较小，而振幅会增加表面粗糙度
    [16]。


    Silberschmidta *等人* 对超声辅助车削进行了实验，在铜、合金等不同材料的机器上尝试了加工参数组合。由于超声辅助车削，加工期间切力降低，表面粗糙度得到改善。对于
    Inconel 718，得到的表面粗糙度结果优于传统车削。传统车削的 `Ra`  1.179 微米，而超声辅助车削为 0.505 微米 [17]。


