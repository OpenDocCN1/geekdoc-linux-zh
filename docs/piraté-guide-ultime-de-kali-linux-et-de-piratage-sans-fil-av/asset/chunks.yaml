- fmt: '

    Janmanee and Muttamara [[31](#9789811483653-C2.html_c2r31)] studied copper-tungsten
    (solid), copper-graphite and graphite as tool material for the EDM of tungsten
    carbide-cobalt (90WC-10Co) workpiece. Influence of some important process criterions
    like duty cycle, open voltage, electrode polarity and current were analyzed. The
    results showed better performance of graphite tool in terms of MRR (Fig. [3a](#9789811483653-C2.html_c2f3)),
    whereas, the EWR and surface roughness was least for the copper-tungsten tool
    (Figs. [3b, 3c](#9789811483653-C2.html_c2f3)).


    ![](Images/9789811483653-C2_F3.jpg) **Fig. (3)**


    Effect of discharge current on (a) MRR (b) EWR (c) Surface roughness [[31](#9789811483653-C2.html_c2r31)].


    Ndaliman and Khan [[32](#9789811483653-C2.html_c2r32)] described the properties
    of Cu-TaC (two compositions with TaC 30% and 55% wt.) tool electrodes fabricated
    by powder metallurgy method. Density, electrical and thermal conductivity of the
    sintered and green compacted electrodes was measured and compared. The electrical
    conductivity, thermal conductivity and density for the green pellet was measured
    in the range of 94.96-189.92 Ω^(-1)m^(-1), 29.70-33.20 W/m K and 6.13-9.80 g/cm³
    respectively which were more than for the sintered pellets. The most conductive
    green pellet had 30% TaC.


    Li *et al.* [[33](#9789811483653-C2.html_c2r33)] reported the EDM of Inconel 718
    with solid copper electrode and Cu-SiC electrode fabricated by electro-deposition.
    The Cu-SiC electrode enhanced the material removal efficiency by 15.12% as related
    with the conventional Cu electrode at 7.5 μs pulse duration and by 16.3% at 24.5
    μs pulse duration. At peak current 14.2 A there was reduction in R[a] by 17.1%
    and at 25.6 A the reduction in R[a] was 16.5%. High toughness value of Inconel
    718 resulted in absence of microcracks in the machined cavity. Electrode wear
    in Cu-SiC composite was also low due to fine microstructure and higher melting
    temperature. The performance of these electrodes in terms of MRR, EWR and surface
    roughness is given in Fig. ([4](#9789811483653-C2.html_c2f4)).


    ![](Images/9789811483653-C2_F4.jpg) **Fig. (4)**


    (a) Variation in performance of different electrodes (a) MRR (b) EWR (c) Surface
    roughness [[33](#9789811483653-C2.html_c2r33)]


    Hussain *et al.* [[34](#9789811483653-C2.html_c2r34)] developed a Cu-Al[2]O[3]
    based composite using powder metallurgy technique. The reason of using Al[2]O[3]
    was its high wear and temperature resistance. Four tools with percentage of Al[2]O[3]
    varied at 0, 1, 3 and 5% were used during experiments. The maximum mass density
    and hardness of the samples was obtained with composition of 5% Al[2]O[3] (Figs.
    [5a](#9789811483653-C2.html_c2f5) and [b](#9789811483653-C2.html_c2f5)). It was
    revealed that the wear resistance of composite was dependent on mass density and
    hardness and was recommended to be used as EDM electrode. The tool with 5% Al[2]O[3]
    showed the least wear rate (Fig. [5c](#9789811483653-C2.html_c2f5)).


    ![](Images/9789811483653-C2_F5.jpg) **Fig. (5)**


    Variation of (a) mass density (b) hardness (c) wear rate with, percentage of Al[2]O[3]
    [[34](#9789811483653-C2.html_c2r34)].


    Kumar *et al.* [[35](#9789811483653-C2.html_c2r35)] carried out experiments using
    copper-titanium diboride tool during EDM of monel 400^(TM) alloy. Effects of percentage
    of titanium diboride (8-20%), pulse current (2-10 A), pulse duration (10-50 µs)
    and dielectric pressure (0.4-1.2 MPa) on MRR and EWR were studied. The addition
    of titanium diboride in the tool considerably decreased EWR and marginally improved
    MRR. Depending on results, an optimum set of process variables (titanium diboride
    16%, pulse current 6 A, pulse on 35 µs and dielectric pressure 1 MPa) was suggested.


    Liew *et al.* [[36](#9789811483653-C2.html_c2r36)] reported the performance of
    carbon nanofiber (CNF) reinforced Cu tool (with CNF percentage varied at 0, 0.5,
    1, 2 and 4%) during the EDM of reaction bonded SiC (RB-SiC). Among all examined
    electrodes Cu-CNF (1%) showed the maximum MRR (0.5502 mm³/min) and least surface
    finish (Figs. [6a](#9789811483653-C2.html_c2f6) and [b](#9789811483653-C2.html_c2f6)).
    The EWR increased with the percentage of CNF (Fig. [6c](#9789811483653-C2.html_c2f6))
    due to bulk removal from the tool as presented in Fig. ([6d](#9789811483653-C2.html_c2f6)).


    ![](Images/9789811483653-C2_F6.jpg) **Fig. (6)**


    Effect of CNF on (a) MRR (b) SR (c) EWR (d) Erosion of tool electrode [[36](#9789811483653-C2.html_c2r36)]


    Mandal and mondal [[37](#9789811483653-C2.html_c2r37)] fabricated EDM electrode
    by coating 6061Al with single wall carbon nanotube. Using hybrid tool experiments
    were performed on AISI 304 stainless steel. The results obtained were compared
    with copper coated 6061Al and uncoated 6061Al tool. The results exhibited 3.13%
    and 14.52% increase in MRR and 21.04% and 29.6% decrease in EWR for copper-coated
    and single wall carbon nanotube coated 6061Al electrodes, respectively. Surface
    roughness of the machined cavity was decreased by 14.06% and 8.03% using copper-coated
    and single wall carbon nanotube coated 6061Al electrodes.


    The major research efforts in the use of different type of tool material are tabulated
    in Table [1](#9789811483653-C2.html_c2t1).


