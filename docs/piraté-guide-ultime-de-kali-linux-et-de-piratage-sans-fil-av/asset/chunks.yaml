    Patel *et al.* [19] 发现某些如 Inconel 718 和钛 (Ti6Al4V) 等材料并不容易加工；这些材料需要具有较低的硬度，以便磨粒能够渗透表面从而导致侵蚀发生。为了这一点，通过使用乙炔气焰将工件加热到
    850ºC 提供了一定的热辅助，从而导致表面硬度降低，并增加了磨料水射加工的材料去除率（MRR）。尽管在过程中温度发生了剧烈变化，但在加工部件中并未发现应力和裂纹。


    ### 各种喷射条件的影响


    #### 间歇性喷射条件

    发现当形成较大的槽或空腔时，这些特征底部存在磨粒沉积倾向，从而阻止了后续的新磨粒到达被这些磨粒遮住的底部，进而降低了 MRR。这种颗粒堆积问题通过创建间歇性模式来阻断磨粒流，在此期间通过高压压力喷射流来解决。这是通过安装一个
    100 Hz 的电磁阀实现的，它有助于创建这种磨粒和高压气流的交替模式 [20]。这有助于移除底部堆积的磨粒。研究发现，对于 500 个样本的点样研究，在开启/关闭时间为
    10/40 毫秒的情况下，孔深从 440µm 增加到 740 µm。


    #### 水下喷射条件

    随着 AJM 的进步，带来了大量的技术和经济优势，但其环境方面也开始产生，例如过程中产生的噪音。为了研究这一方面，采用了水下式 AWJM [21]。这在某种程度上导致了颗粒在到达加工表面之前的动能降低。这还导致了射流阻力的减少，从而使得射流沿喷嘴直径的衍射减少
    [22]。这还提供了一个思路，即加工过程中环境中的灰尘较少，正如传统方法中看到的，从而导致了如肺部损伤之类的医学影响。发现当使用甘醇作为浸没液体时，减少率高达
    61%，随之的是液体聚合物为 42%，水为 36% [23]。当液体与磨粒浆混合，且仅将高压喷射流导向工件时，喷嘴寿命显著增加。唯一的缺点是颗粒的速度非常低。


    ## 应用


    磨料喷射加工已发现许多应用，具有一些优势但也存在一些缺点。本节讨论了其中一些优点和缺点。还分析了它在摩擦学等领域的应用。一些优点列举如下：


    - 研究显示了 AJM 从宏观尺度到微观尺度的进步，使其在各个领域和工业中具有无限的应用前景。此外，其大规模应用已用于加工。

    - 发现它不仅在技术方面，而且在环境方面也具有优势，可以带来更好的加工能力和环境可能性，从而实现更好的工艺灵活性。

    - 作为喷射过程中塑性变形的影响，表面性质如晶粒细化、材料硬化等得到了许多改进 [25]。

    - 发现与传统加工方法相比，微加工的成本几乎极低，而且磨粒可以回收 [26]。


    尽管有这些优点，但也能看到一些缺点，例如在加工深槽时形成锥形几何形状 [28]、在大量脆性材料上形成微裂纹、微加工中 MRR 不稳定，因为无法获得具有稳定流速的细颗粒
    [27]、微观应用中的生产率也很低，并且观察到某些超过 105db 的关键噪音水平 [21]。


    ### 表面织构与摩擦学方面


    Costa *et al.* 发现表面织构是一种创建均匀微纹理的方法，由具有形状形状的锐印象组成 [29]。各项研究发现，随着世界向电子技术进步发展，微织纹展现了其价值。注意到，普通
    AJM 和微细 AJM 之间的边界是开口直径形状的设计标准。各项进行的研究表明，对于使用 23µm 尺寸磨粒颗粒的 100µm 路径，通道均匀性的的分辨率最高可达
    5%，并受限于掩模尺寸和边缘发现的磨损 [30]。研究还总结出，限制此的主要因素是使用的掩模材料、低至 3µm 的细颗粒导致的光流流问题以及低动能。在获得表面织构能力后，它在摩擦学领域也找到了道路，如本节所示。在医学领域，全球范围内大量的膝关节和髋关节手术及更换。随着时间推移，80%
    的病例在若干年内报告了磨损 [31]。这在某种程度上与表面完整性和材料硬度有关。在所有开发的人工关节滑动对中，最成功的是金属与聚乙烯的组合，成功率为 90%，寿命为
    15 年。进一步的研究表明，表面缺陷、裂纹、毛刺会导致磨损并减少关节寿命。认为应该有一种人工关节增强能够收集在使用过程中产生的所有颗粒，同时为其平稳运行提供润滑，从而将其使用寿命增加到
    30 年。这种用于收集碎片和润滑的微小孔用传统加工方法很难加工，因此 AJM 被发现在钻这些孔很有用。一种抛光铬钼合金并在微观尺度上刻槽的技术已经开发出来，可以应用于假体，以产生最少的磨损
    [32]。

