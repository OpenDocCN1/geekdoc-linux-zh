    It is observed from Table [1](#9789811483653-C6.html_c6t1) that dielectric medium,
    discharge medium and configuration of machining parameters plays an important
    role in mechanism of the material removal. The two major mechanisms are melting/evaporation
    and spalling. Melting and evaporation takes place in the state of low energy discharge
    while the spalling mechanism takes place in high energy discharge state. Overview
    of the electrical conductivity of some ceramics and metallic materials is shown
    in Fig. ([3](#9789811483653-C6.html_c6f3)). It is observed that like the metallic
    materials, ceramics that are electrically conductive in nature can also be easily
    machined by the EDM process *e.g.* titanium diboride (TiB[2]), titanium nitride
    (TiN), or silicon doped silicon carbide (SiSiC) [[14](#9789811483653-C6.html_c6r14)].


    ![](Images/9789811483653-C6_F3.jpg) **Fig. (3))**


    Electrical conductivity of materials [[15](#9789811483653-C6.html_c6r15)].


    ## MACHINING OF WC-CO COMPOSITE MATERIAL


    Composites made of Tungsten carbide/cobalt (WC-Co) material hold good range of
    mechanical properties such as good strength, high value of hardness and good ample
    amount of wear resistance for wider range of temperatures thus find wide application
    in the production of dies, cutting tools and some special purpose tools. These
    composite materials possess very high specific strength, thus difficult to machine
    by conventional machining processes [[16](#9789811483653-C6.html_c6r16)]. Also,
    it involves some complex shapes therefor very high accuracy is required during
    machining which is not possible to achieve with the conventional machining processes
    [[17](#9789811483653-C6.html_c6r17)].


    Number of studies reported the machining of these materials with conventional
    process like using of CBN tools in CNC turning. The results obtained showed negative
    impacts like high cutting force, low MRR and poor finish of obtained surface [[18](#9789811483653-C6.html_c6r18)].
    On the other hand, Levy *et al.* [[19](#9789811483653-C6.html_c6r19)] & Bonny
    *et al.* [[20](#9789811483653-C6.html_c6r20)] conducted some studies and observed
    that the process of EDM is capable of maching of these composite materials to
    fabricate cemented carbide dies which involves complex shapes irespective of their
    hardness and strenth In other study Mahdavinejad *et al.* [[2](#9789811483653-C6.html_c6r2)]
    coonducted a study to analyse the instability of EDM prcesss on machining of WC-Co
    composite materials. In the results it was observed that for the various compositions
    of WC-Co composite materials, pulse duration factor effects the stock removal
    rate. The removal rate tends to increase with the increase in pulse duration.
    It was also observed the machining instability was also increased with the increase
    in the pulse duration. It was stated that this instability could be reduced by
    reducing the percentage of Co in the formed composite material (Fig. [4](#9789811483653-C6.html_c6f4)).


    ![](Images/9789811483653-C6_F4.jpg) **Fig. (4))**


    Effect on different compositions of WC-Co by variation of tool wear rate, pulse
    time and stock removal rate [[2](#9789811483653-C6.html_c6r2)].


    Similar study was conducted and it was observed that various factors like pulse
    timing and pulse current greatly influence the surface roughness of the workpiece
    in which the job is being performed [[6](#9789811483653-C6.html_c6r6)]. Higher
    the values of these machining parameters, better will be the value of surface
    roughness of the workpiece [[6](#9789811483653-C6.html_c6r6)].


    ## ELECTRICAL DISCHARGE MACHINING - LITERATURE SURVEY


    Gadalla *et al.* [[21](#9789811483653-C6.html_c6r21)] conducted experiments to
    examine the shaping of composites made of CMs by the process of EDM. The results
    were compared with the surfaces machined by other conventional processes. In the
    results, it was observed that the MRR was increased due to the decrease of per
    unit volume of energy and and the main factors like electrical resistance and
    thermal diffusivity were the main factors that affect the MRR. It was also stated
    that the surface roughness of the material largely effected by the dispersion
    of the grain size of the material. In the similar study Farooqui *et al.* [[22](#9789811483653-C6.html_c6r22)]
    compared the machining of ceramics and advanced ceramics by EDM process. It was
    observed that the pulse duration of the process was responsible for the mechanism
    of removal of the material. While the oxidation and decomposition was due to the
    shorter pulse, on the other hand longer pulse was responsible for spalling mechanism.
    In another study Gamage *et al.* [[23](#9789811483653-C6.html_c6r23)] used alluminium
    3003 as materail with tool made of AISI P20 for conducting case studies of wire
    EDM and DSEDM. The results were observed and it was stated that the electrical
    energy was the major source of impact followed by other factors like dielectric
    oil and material of the wire for DSEDM and wire EDM respectively. Lauwer [[24](#9789811483653-C6.html_c6r24)]
    presented a study in which overview was provided to state the various challenges
    related to EDM of composites made of CMs. In the results it was concluded that
    by altering the composition of the material both the EDM process and mechanical
    properties of the material can be improved to certain extent. Schubert *et al.*
    [[15](#9789811483653-C6.html_c6r15)] conducted a study to present the recent studies
    related to micro EDM of composites made of CMs. Various examples of procedure,
    used for insulating ceramics and machining of the ceramics, were also discussed
    and presented. In the results its was observed that due to the method of assisting
    electrodes it is advisable to machine the insulating ceramics and therefore are
    regarded as suitable post processing process for the CMs. Bucciotti*et al.* [[25](#9789811483653-C6.html_c6r25)]
    conducted experiment to process biomedical implant devices made of silicon and
    titanium nitride by the process of EDM. The mechanical, toxicological and microstructural
    properties were studied and it was observed these materials holds good as compared
    to the other oxide CMs used for making the same joints and also very complex shapes
    like undercuts and near to net shapes were possible to manufacture by EDM process.

