    与水力和 `SOD` 相比，移动速度对表面粗糙度的影响最大。最小 `SR` 的最优参数为水压–35000 psi，速度–80mm/min 以及 `SOD`
    2.5mm。 |

    | 9 | S.Srinivas al [47]. | 石榴石 | 因康镍 718 | 水压 – 100 to 300 Mpa，移动速度 – 75-175
    mm/min.，磨粒流量 – 0.3017 to 0.5994 kg/min，喷嘴直径 0.25 mm，射流冲击角 90°，聚焦喷嘴直径 1.07mm |
    移动速度和水压是影响深度最重要的因素。 |

    | 10 | Santanakumar *et al.* [48] | 石榴石 | 陶瓷砖 | 磨粒粒径 -#80 to 120，磨粒流量 - 300 to
    500 gm/min.，`SOD` - 1 to 3 mm，水压-2000 to 3000 bar，射流移动率 - 200 to 400 mm/min. |
    提出的预测模型用于优化表面粗糙度和斜角，结果发现者平均分别为 5.27 µm 和 1.41°。 |

    | 11 | Kanthababu *et al.* [49] | 石榴石 | 含有 `B[4]C` 复合的 Al7075 (0 到 15%) | 喷嘴直径–0.25
    mm，聚焦喷嘴直径 0.75mm，射流冲击角 90°，目数 -80 to 120#，磨粒流量 240 to 440 g/min.，水压-125 to 275
    MPa，移动率-60 to 120 mm/min. | 测量了每种复合材料的 DOC 并找到了切割特性的最优条件。含有 5% `B[4]C` 的 Al7075
    金属复合材料获得了高达 25 mm 的 DOC。 |


    `DOC`-切深，`#` = 目数，`SR/Ra`-表面粗糙度，`SOD`=横距，`MRR`=材料去除率。


    ## 结论


    AJM 是一种现代加工技术，提供从微观到宏观尺度的加工，具有更高的精度和控制力。本文讨论了各种 AJM 及其在精度、环境可持续性以及大尺寸加工 *等等* 方面的优点和局限性。研究表明，AJM
    的摩擦学应用似乎具有很的相关性，应该进行更多研究以扩展到其他领域。还研究了引入低温技术对软材料进行加工以实现精密加工。这同时也带来了热应力等其他缺点，需要进行研究。由于温度和热效应在提高加工效率方面起着至关重要的作用，也需要将其降至最低。还可以对
    AJM 的入射角进行研究，因为它是磨粒流体抛光 (AFJP) 中的一个重要因素 [50]。


