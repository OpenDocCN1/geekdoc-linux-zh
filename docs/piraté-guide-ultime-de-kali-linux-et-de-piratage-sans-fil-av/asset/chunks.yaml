    # 脉冲形状对 EDM 特性的影响


    另一项研究表明，如果使用改进晶体管产生的 1MHz 脉冲代替 RC 型发生器，可以产生更高的材料去除率（MRR），且加工速度提高三倍 [6]。Han *等人*
    进行了一项研究，设计了一种用于脉冲产生的新晶体管脉冲发生器，能够产生 24 倍的 MRR [7]。还进行了一项研究，观察到 EDM 电容对阻抗的影响，从而导致了高加工性能
    [8]。在表面光期间，还采用了某些基于半导体的开关电路在电极和工件界面释放较低的能量，以获得更高的表面光洁度 [9]。


    一些实验表明，用于加工的脉冲发生器的形状变化对各种加工特性有显著影响。结果显示，能量密度对刀损损率（TWR）有很大影响 [10]。短脉冲持续时间通常用于高精度加工。发现使用均匀能量放电时，表面形貌具有更高的价值。还发现，如果用于放电加工的是均匀形状的脉冲，则电花效应会较少
    [11]。


