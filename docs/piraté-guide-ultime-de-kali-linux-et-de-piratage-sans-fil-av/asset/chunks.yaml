    B. Lauwers *et al.* investigated the material removal rate, surface quality, surface
    cracks in ultrasonic assisted grinding of `ZrO[2]`. The paper showed that cutting
    forces and tool wear were reduced under the influence of vibration during machining.
    Hence productivity increased [[2](#9789811483653-C1.html_c1r2)].


    Cong *et al.* presented the method of measuring vibration amplitude during rotary
    ultrasonic machining. In this paper, it was concluded that vibration amplitude
    varies for different conditions. When the dial indicator method was used for measuring
    vibration amplitude and compared with the novel method, results were the same.
    But when it was checked with or without rotary ultrasonic machining, using tools
    with different specifications, results were different [[3](#9789811483653-C1.html_c1r3)].


    Heise *et al.* investigated the ultrasonic assisted drilling operation on granite
    and stone, which is a hybrid machining process. The cutting forces and torques
    was reduced up to 20% when the ultrasonic process applied. That could be achieved
    by using robots instead of machining centres [[4](#9789811483653-C1.html_c1r4)].


    Kei-Lin and Chung-Chen presented the paper on rotary ultrasonic machining, in
    which glass was utilised for milling operation. The efficiency of operation was
    evaluated based on surface roughness parameter. It was seen that the surface quality
    of ultrasonic milling was very poor as compared to non-ultrasonic milling [[5](#9789811483653-C1.html_c1r5)].


    Liu *et al.* developed a model for cutting forces during rotary ultrasonic machining.
    Cutting forces play a very important role during machining of brittle material.
    A relation between cutting force and input variables like spindle speed, feed
    rate, amplitude of ultrasonic vibration and abrasive grain particles was developed
    based on the cutting forces model. The various assumptions were made during research
    analysis like abrasive particles'' shape and its material. Diamond abrasive particles,
    of octahedron shape, were utilized. The developed model gave information for cutting
    forces `i.e`. forces increased as input variables parameters increased and decreased
    as input variable parameters decreased [[6](#9789811483653-C1.html_c1r6)].


    Rasheed compared the results of micro-holes produced by micro-EDM and laser beam
    machining. The machining parameters like material removal rate, taper in hole,
    entrance and exit diameters of produced holes, concentricity of the produced holes
    was compared. It was concluded that when surface quality of the workpiece is not
    so important then for high material removal rate, laser beam machining can be
    utilised. If surface quality is needed, then micro-EDM can be used but material
    removal rate will be reduced. So, a hybrid process can be made to take the advantages
    of both processes [[7](#9789811483653-C1.html_c1r7)].


    Das *et al.* investigated the surface roughness of hexagonal shaped hole and material
    removal rate in Zir-Conia bio-ceramic material after ultrasonic machining. With
    control parameters, optimised results were obtained by utilising genetic algorithm
    technique. In the conducted experiment, with optimised para-meters, material removal
    rate of and surface roughness of 0.2365g/min and 0.58-micron meter were obtained
    respectively [[8](#9789811483653-C1.html_c1r8)].


    Lian *et al.* performed several experiments to analyse the surface roughness of
    A16061 material by micro-milling with or without the assistance of ultrasonic
    vibrations. It was observed that better surface finish was obtained in A16061
    with ultrasonic vibration assisted machining. Better results were obtained when
    appropriate ultrasonic vibration amplitude was selected [[9](#9789811483653-C1.html_c1r9)].


    Cong *et al.* provided an explanation about surface roughness of hole, in ultrasonic
    machining, at entrance and exit. The paper considered hypotheses and their testing.
    The experiment was performed on a stainless-steel workpiece. It concluded that
    the reason for the difference of surface roughness at entrance and exit of the
    workpiece depends upon the abrasive bonded part of the tool movement in the workpiece
    through the entire length [[10](#9789811483653-C1.html_c1r10)].


    Selvakumar and Arulshri carried out the work to optimise the fixture layout using
    genetic algorithm and combination of genetic algorithm and artificial neural network
    approaches. The purpose of investigation was to reduce the deformation of the
    workpiece after clamping on fixture and machining force during operation. Finally,
    results of genetic algorithm and artificial neural network approach were compared.
    It proved that the combination of genetic algorithm and artificial neural network
    approach was better than genetic algorithm [[11](#9789811483653-C1.html_c1r11)].


    Yang *et al.* performed study on ultrasonic lapping of gears. It is a better process
    for tooth surface quality of gears as compared to conventional methods of lapping.
    The purpose of this paper was to finalise the methodology of ultrasonic lapping
    design for hypoid gear. After experiment, it was concluded that ultrasonic lapping
    of gear transmission quality was better than conventional lapping method [[12](#9789811483653-C1.html_c1r12)].


    Feucht *et al.* presented the machining results of hard and brittle materials
    or advanced materials such as ceramics and fiber- reinforced materials which are
    used in medical and aerospace industries using ultrasonic assisted machining.
    Fibre reinforced material was inhomogeneous in nature. So, it remains difficult
    to machine this material. But when vibration was produced by transducer superimposed
    on the spindle of conventional machining process, the cutting forces and tool
    wear rate were reduced by 20% to 30% as tool periodically lifted from workpiece
    or job [[13](#9789811483653-C1.html_c1r13)].


    Muhammad *et al.* discussed about hybrid machining technique in which ultrasonic
    assisted turning and hot machining technique were used in combination to machine
    titanium alloys. As a result, cutting forces was reduced and surface roughness
    was improved drastically in titanium alloys. In hot ultrasonic assisted turning,
    50% excess improvement was noticed in surface roughness [[14](#9789811483653-C1.html_c1r14)].


    Kumar *et al.* proposed vibration assisted machining in cutting hard and brittle
    material. Vibration can be given to tools, workpiece and working medium. During
    ultrasonic assisted turning, the process parameters improved like 40% to 45% reduction
    in cutting forces and average cutting forces dropped to 40% as compared to conventional
    machining. Tool wear rate was reduced, and surface roughness was improved in the
    workpiece [[15](#9789811483653-C1.html_c1r15)].


    Bhosale *et al.* invented the effect of process parameters on alumina-zirconia
    ceramic composite on material removal rate, tool wear rate and surface topography.
    The process was analysed through the effect of amplitude, slurry of abrasive particles
    with carrying fluid `etc`. The research showed that tool wear rate tends to increase
    when hard and coarse abrasive was used. High tool wear rate occurred when boron
    carbide abrasive is utilized as compared to silicon carbide abrasive for similar
    machining conditions. The study concluded that slurry concentration has less effect
    on tool wear rate while amplitude increases surface roughness [[16](#9789811483653-C1.html_c1r16)].


    Silberschmidta *et al.* performed the experiment on ultrasonic assisted turning
    in which a combination of cutting parameters were tried on machines for different
    materials like copper, alloys `etc`. The cutting forces reduced during machining
    and surface roughness improved due to on ultrasonic assisted turning. The result
    obtained, for inconel 718, was better than conventional turning for surface roughness.
    The `Ra` value in case of conventional turning was 1.179-micron meter as compared
    to 0.505-micron meter in case of ultrasonic assisted turning [[17](#9789811483653-C1.html_c1r17)].

