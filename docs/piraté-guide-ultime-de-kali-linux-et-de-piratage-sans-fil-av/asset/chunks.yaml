    Siddiqui 和 Ramkumar [38] 建议，镁作为生物降解骨科植入物应用中的重要材料，可以通过 `micro-WEDM` 加工成微米级的复杂形状。实验选择
    `AZ31 Mg` 合金进行测试，以建立 `micro WEDM` 各种输入参数之间的关系。为了获得最佳条件，希望具有中等电压和高电容以实现高 `MRR`。


    Liu *et al.* [39] 描述了在 `WEDM` 中加工 `Nithinol` 形状记忆合金。进行了实验以确定工艺参数对`white layer`
    晶结构、成分和性质的影响。使用 `TEM`、`X ray Diffraction` 和 `EBSD` 来刻画加工表面`white layer` 的性质。与基体材料相比，由于氧化硬化，`White
    layer` 显示出更高的纳米硬度。


    Manjaiah *et al.* [40] 研究了在 `WEDM` 加工钛形状记忆合金过程中线电极材料的影响。研究使用了 `Brass` 和 `Zinc
    Coated` 焊丝。结论认为，`pulse on time`、`pulse off time` 以及 `servo voltage` 是优化条件以增强加工材料
    `MRR` 和 `SR` 最影响的参数。


    Sun *et al.* [41] 讨论了低速线电火花加工中微型铣削螺旋和波纹微型端铣刀的特性。进行了线电极轨迹的设计和数学仿真，并阐明了加工参数对螺旋端铣刀的影响。


    ### 表 3：WEDM 综述。


    | 序号 | 作者 | 优化技术 | 工作材料 | 输入参数 | 结果 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 1. | Shakeri *et al.* [42] | ANN | 渗碳钢 | 脉冲电流, A (8-16). 频率, kHz (40-60). 线速,
    m/min (8-12). 伺服速度, mm/min (4-8) | 线速、脉冲电流和频率的增加导致高 `MRR` |

    | 2. | Goyal *et al.* [43] | ANN, RSM, SEM | `Ni[49]Ti[51]` | 电流, A (4-8). 脉冲开启时间,
    µs (60-120). 脉冲间隙时间, µs (15-45). 线张力, cm²/gm (11-15). 进速度, m/min (4-8) | 增加脉冲开启时间和电流会增加
    `MRR` |

    | 3. | Suthan and Muralidharan [44] | Taguchi | 316L | 脉冲开启时间, µs (30-32). 脉冲间隙时间,
    µs (5-7). 间隙, mm/min (50-700) | 更高的脉冲开启时间导致更高的 `MRR` |

    | 4. | Liao *et al.* [45] | Taguchi 质量设计, ANOVA 和 F 检验 | 合金 | 脉冲发生电路, (ac, dc).
    介质导电率, (15-45). 电容, C (0-20). 似电压, V (100-150). 台进给速度, mm/min (2-4). 脉冲间隙时间, 微秒
    (4-8). 电路电阻, ohm (25-75). | 脉冲发生电路、电压和电路电阻对表面粗糙度有显著影响 |

    | 5. | Padmavathi *et al.* [46] | Taguchi 稳健设计方法 | AISI 316 不锈钢 | 脉冲开启时间, µs (1-10).
    脉冲间隙时间, µs (1-10). 峰值电流, A (0-30) 线张力, cm²/gm (200-1500). 线进速度, m/min (0-10) |
    峰值电流和脉冲开启时间对对 `MRR` 和 `SR` 都有显著影响 |


    Ishfaq *et al.* [47] 检查了加工不锈钢复合钢的 `WEDM` 工艺参数。由于复合材料的异质性，复合材料的加工非常有挑战性。与气体切割和等离子弧切割等专门用于切割这些材料的其他工艺相比，复合钢
    `WEDM` 提供更好的表面光洁度。然而，低切速是使用 `WEDM` 的限制。根据 Taguchi 方法设计实验以优化切速。看到复合材料的单层厚度对控制 `WEDM`
    的加工速率起关键作用。Babu *et al.* [48] 研究了 `WEDM` 中过共晶 Al-Si 合金的参数优化。实验中选取了不同的输入控制因素，包括脉冲开启时间和硅百分比的变化。实施了
    `GRA` 和主成分分析进行多目标优化。发现 `PCA` 在执行此任务方面优于 `GRA`。


    Periyanan *et al.* [49] 描述了 `micro-WEDM` 在加工复杂的精确 3D 结构微型零件和微型工具中的利用。采用 Taguchi
    方法优化 `micro-WEDM` 的输入变量以增强 `MRR`。结果显示进给速度、电容和电压是影响 `MRR` 最大的参数。


    Giridharan 和 Samuel [50] 在 `WEDT` 中对 AISI 4340 钢进行了实验以提高其侵蚀率。采用了新方法来测量扫描深度并获得了更好的结果。通过
    `SEM` 研究了随机侵蚀机制。表 3 显示了对各种研究中 `WEDM` 的综述。


    ## WEDM 的未来前景


    频繁的断线使得 `WEDM` 效率降低并损害了加工质量。因此，减少断线以获得更好的尺寸精度和效率将仍然是一个关键研究领域。


    钛合金有广泛的应用。由于这些合金难以加工成复杂的形状，它们的加工仍然是一项挑战。可以优化 `WEDM` 工艺参数来切割钛合金，以降低制造成本和时间。


    应该提高钛合金的 `WEDM` 加工效率。然而，现有的线材料在这些方面已经失败了。因此，需要集成新型芯和涂层材料的新型线电极材料。


    ## 结论


    在对 `WEDM` 文献进行彻底研究后可以得出，钛合金在生物医学、航空航天和微型工具制造领域非常有用。这些合金可以使用 `WEDM` 流畅且廉地加工成复杂形状。观察到输入变量对性能指标有显著影响，因此优化参数以实现高尺寸精度和高重复性变得至关重要。可以采用基于数学模型的
    Taguchi、RSM、模糊、算法和基于 ANN 的优化技术，用于 `WEDM` 中对各种钛合金加工的此类研究。此外，通过 `SEM`、`TEM` 和 `XRD`
    的应用，可以评估和研究加工材料的表面完整性、成分和缺陷。


