    Saxena *等人* [48] 研究了电火花加工工艺对 SiC 加工的影响。从 SEM 图像获得的的结果中，可以清楚地观察到材料去除的机制是熔化和蒸发，材料的迁移也是双向的。


    Nihal *等人* [49] 使用混合羟基磷灰石粉末加工 Ti6Al4v 工件。小组发现，当脉冲时间为 100µs 且脉冲电流为 12A 时，工件形成了随机去除和微裂纹。其他非接触工艺如激光加工、超声波加工
    [50, 51] 以及磨粒水射加工 [52] 根据不同研究人员的报告也有其优缺点。


    Yoo *等人*成功地将硝酸钱（YN）掺杂 SiC，并证明 EDM 工艺可用于这些陶瓷 [53]。Yeakub *等人* [54] 研究了含有碳化钛粉末的非导电锆的微电火花。在该研究中，改变了两个参数：电容和间隙电压。


    Singh *等人* [55] 对钴结合碳化钨 (WC-Co) 的粉末混合电火花进行了实验研究。在他的实验中，使用了石墨粉末混合电介质。极少研究侧重于预测建模，以理解
    EDM 对加工产品的影响 [47]。表 [[2]](#9789811483653-C6.html_c6t2) 显示了陶瓷复合材料电火花加工的综合综述。


    ## 未来展望


    基于本章综述的各种研究，观察到非常有必要研究各种操作参数对某些纳米结构 WC 的影响。针对复合材料 (CMs) 的微电火花研究被认为是该领域未来的主要方向。需要借助一些先进的
    FEM 技术来研究具有导电性的二次层的形成。


    ## 结论


    基于 CMs 制的复合材料的应用已成为我们现代生活的重要部分。本文综述了 EDM 工艺及其在加工由 CMs 和碳化钨组成的复合材料中的作用。从上述广泛的综述可以得出结论：EDM
    工艺能够加工具有高度导电性的 CMs，如 TiN、SiC 和 TiB[2]。还观察到火花强度电流等各种加工参数影响工件的加工性能。随着这些参数的增加，MRR
    和表面粗糙度显著增加。研究了脉冲时间对 MRR 的影响。MRR 和表面粗糙度随脉冲时间的增加而降低，从而增加了材料加工的不稳定性。


    此外，还观察了不同工艺参数对 EDM 加工表面的影响，并讨论了一些关于加工后 CMs 影响的研究 [27, 45]。


