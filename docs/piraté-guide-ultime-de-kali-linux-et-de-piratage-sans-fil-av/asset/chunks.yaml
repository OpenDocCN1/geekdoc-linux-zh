    在设计与创新领域，形势瞬变，需要极其精确且深层加工的部件。表面性能在制造汽车、航空和生物医学应用的产品中起着至关重要的作用。一点划痕或毛刺可能导致巨大的灾难，例如发动机中途故障、航空灾难等。各行业正努力努力并投入巨资，以在不损害表面性能的情况下完成这些制造。在不改变表面质量和性能的情况下，对硬质材料进行加工是一项艰巨的任务。在数控加工（NCM）中，加工过程中产生的热量可能会导致表面变形
    [1]。为此，通过选择合适的工艺，我们可以获得更好的表面质量。在这种特定情况下，可以使用水射在不产生任何热量的情况下加工硬质材料。这种水和磨粒剂的混合物被称为水射切割（WJM），是一种数控加工程序，利用高速水流从工件外部侵蚀材料。WJM
    同样可以切割塑料、弹性体或木材等软材料。尽管如此，为了切割金属或岩石等更硬的材料，需要在水中混合磨粒剂。当在加工过程中水中使用磨粒剂时，它被称为磨粒水射切割（AWJM）。它基于水侵蚀原理工作。当高速水流撞击表面时，材料会发生排出。Norman
    C. Franz 博士于 1968 年启动了先进的 WJM 创新，并获得了一种创造性高压 WJM 框架的主专利，并在 1971 年创建了主要的水射切割业务，用于切割层压纸管。1980
    年，Hashish 博士发现了在纯 WJM 中加入磨粒剂的方法，从那时发明了 AWJM，用于切割钢、玻璃和水泥等机械材料 [2, 3]。


    ## WJM 和 AWJM 工艺


    在 WJM 工艺中，高速水射撞击工件。施加在喷嘴末端水的压力转化为高速度。随后，为了切割高质量材料和硬质材料，在高速水射中加入磨粒剂。WJM 具有许多优点，且成本结构也较低。这种创新发展迅速且灵活。有毒废气、重熔层、熔渣和残余应力可以很容易消除。AWJM
    的切割功率较低，且切割区域附近没有像 NCM 那样的热影响区。通过这种方式，已经证明了 NCM 无法于加工的材料可以通过 WJM 有效加工，例如，在玻璃、石材和金属上开槽、钛合金的快速钻孔等都可以通过
    WJM 轻松地加工 [4]。


    ## AWJM 组件


    （图 1）展示了 AWJM 组件的示意图。AWJM 工艺的重要部分包括高压液压泵（HPLP）、高压泵、计算机控制系统、加工头和收集器。HPLP 用于持续提供超高压。系统由两个水箱组成，满足切割材料和水的需求。整个系统配备了过滤机制，可以过滤掉较大的颗粒。系统中的大颗粒会阻塞整个系统的运行
    [6]。


    ![](img/9789811483653-C4_F1.jpg) **图 (1)**


    带有各种组件及其附件的 AWJM 工艺示意图解 [5]。


    ## 热增强加工 (TEM)


    使用 AWJM 工艺对多种材料（如镍基合金、钛、玻璃、陶瓷、复合材料、热敏感合金等）根据不同的应用进行成型。特别是在航空航天领域，对耐热和高强度材料的需求日益增加。然而，由于其物理和机械特性（如高强度和低导热率），这些材料通常难以加工，这需要极高的切割能量，并导致切力和切割温度非常高，甚至导致刀具寿命短。这为难加工材料开辟了热增强加工（TEM）的途径。TEM
    可以使用外部热源加热并软化工件。结果是工件的屈服强度、硬度和应变硬化降低，难加工材料的变形行为发生变化，允许塑性变形。这使得机器可以于加工材料，且能量需求低，提高了材料去除率（MRR）和生产率
    [7]。


    AWJM 工艺的各种特性和开发的机器已用于切割各种材料，如玻璃等硬材料、钛和镍基合金等硬金属、复合材料和合金。对耐热和更高质量材料的需求在航空应用领域不断扩大。这些材料由于其物理和机械特性（例如高强度和低导率）而难以加工，需要极高的切力，导致切割功率和温度异常高。这甚至会导致切割材料的使用寿命短。这为难加工材料开辟了热改进加工（TIM）道路。TIM
    可以利用外部热源加热并软化工件。因此，工件的屈服强度、硬度和应变硬化效应降低。通过这样做，难加工材料发生变化并允许塑性变形。这使得机床能够有效加工这些难加工的材料，同时低能量需求促进了材料去除率和盈利能力的增加
    [7]。


    ![](img/9789811483653-C4_F2.jpg) **图 (2)**


    显示影响 AWJ 切割过程的各种类参数图 [8]。


    ## TIAWJM 的性能因素


    热改进水射切割（TIAWJM）的性能取决于多种因素（图 2）。这些因素可以分为几类。这些类别和因素列如下：


    (1) 与磨粒相关的因素

    - 类型

    - 形状和纹理

    - 流量机制

    - 流量


    (2) 与喷嘴相关的因素

    - 特性

    - 直径


    (3) 操作因素

    - 压力

    - 离层距离

    - 进给率

    - 切割角度


    (4) 性能因素

    - 切割深度

    - 材料去除率 (MRR)

    - 缝宽

    - 表面性能


    磨粒颗粒在 AWJM 加工过程中起着关键作用。磨粒以高速度撞击工件，导致工件材料被侵蚀。这种赋予于磨粒颗粒的高速度是由水射流提供的。由于由于 AWJM 工艺的特性，它能够切割几乎任何材料
    [9]。在用 AWJM 加工期间，MRR、表面粗糙度和生产率是相互相关的。


    这些参数决定了表面质量，并确定了所得产品的功能性能。几何精度也是 AWJM 工艺中的主要输出参数。


    考虑到机械性能和导性，工件材料可以分为两类，即延性材料和脆性。这两类材料具有不同的加工机制。


    '
- fmt: '

    Mechanism of machining of ductile materials can be classified into two groups
    *i.e*. micro-cutting and plastic deformation as shown in Fig. ([3](#9789811483653-C4.html_c4f3))
    [[6](#9789811483653-C4.html_c4r6)].


    ![](Images/9789811483653-C4_F3.jpg) **Fig. (3))**


    Impact of the abrasive particles on a ductile material [[6](#9789811483653-C4.html_c4r6)].


    Brittle materials, on the other hand, depict a different cutting behavior. The
    plastic deformation zone and brittle facture are experienced by brittle material
    while undergoing a cutting process (Fig. [4](#9789811483653-C4.html_c4f4)).


    ![](Images/9789811483653-C4_F4.jpg) **Fig. (4))**


    Impact of the abrasive particles on a brittle material [[6](#9789811483653-C4.html_c4r6)].


    Several researchers work in this field, and the contribution of Hashish and co-workers
    is notable. AWJs saw is exceptionally powerful in metal cutting, cutting airplane
    composites, metals, circuit loads up, and so forth.


    ## AWJM - LITERATURE


    Researchers studied AWJM while machining Al7475\. Various parameters were considered
    in the study like pressure, traverse speed, distance from the workpiece and jet
    inclination. 3mm Sheets of Al were used in the study. Fatigue life and MRR during
    machining were studied [[11](#9789811483653-C4.html_c4r11)]. Yue *et al.* [[12](#9789811483653-C4.html_c4r12)]
    experimented to find the effect of input parameters on the AWJM process. Pressure,
    feed, abrasive rate and nozzle angle were varied to find the effect on MRR. While
    cutting alumina, it was concluded that by increasing pressure and abrasive flow,
    simultaneously, MRR was increased. Numerical simulation studies were performed
    too with a special type of AWJM process [[13](#9789811483653-C4.html_c4r13)].
    An ultrasonic assisted AWJM process was investigated to find out the abrasive
    erosion process. Partially overlapping conditions and entire-overlapping conditions
    were studied.The Study concluded that a 30° impact angle having a sharp edged
    particle could lead to higher MRR. Higher MRR was witness at vibration assisted
    machining rather than without vibration machining [[13](#9789811483653-C4.html_c4r13)].


    Special materials like Ti6Al4V-CFRP were cut with AWJM [[14](#9789811483653-C4.html_c4r14)].
    For the first time, taper angle, kerf and roughness were considered during the
    study. Conventional machining finds various difficulties to cut these materials
    as both materials (Ti6Al4V and CFRP) have very different characteristic.The Study
    was successfully performed and opened a new door to machine dissimilar materials
    in combination widely used in the aerospace industry [[14](#9789811483653-C4.html_c4r14)].
    Uthayakumar *et al.* studied AWJM to machine supper alloy.The Experiment revealed
    that AWJM could be successfully used to machine nickel alloy. Precise surfaces
    could be produced in a cost effective manner using AWJM. The Surface properties
    of the materials were not degraded during the machining processes. It was observed
    that pressure and speed during machining can impact kerf wall inclination. It
    was found that MRR was strongly influenced by parameters like flow velocity and
    pressure. A high surface finish of super alloy was obtained at high pressure with
    adequate transverse speed [[15](#9789811483653-C4.html_c4r15)]. Temperature was
    also considered as influencing parameter in AWJM [[7](#9789811483653-C4.html_c4r7)].
    Thermal treatment at desired locating was used to preheat the workpiece along
    the path of machining. Preheating was postulated to soften the material that was
    helpful to substantially reduce the cutting force and increasing the MRR. It was
    observed that it was very difficult to maintain temperature for a longer time
    and size. Due to this, it was only valuable for micro cutting and micro channel
    cutting [[7](#9789811483653-C4.html_c4r7)]. Hard to cut stainless steel was also
    experimented to be cut using AWJ cutting process [[16](#9789811483653-C4.html_c4r16)].
    EN1 SS was cut using AJM cuttiing. 20mm bar was cut at different presure of water
    ranging from 3400-3800 bar.


    In 2016, Shukla *et al.* optimized the AWJM process parameters for AA6351 Al alloy
    material. Various optimization technique were used [[17](#9789811483653-C4.html_c4r17)).The
    Study was focused to identify the domain of process parameters with desired output
    results. Prime facie, the Taguchi method was used to optimize processes parameters
    that revealed a set of various processes parameters required to obtain desired
    results [[17](#9789811483653-C4.html_c4r17)). Tamannaee *et al.* contemplated
    the erosion rate in AWJM. A powder filled thermoplastic olefin was used in machining.
    From that point, the erosion rate estimations were utilized to create machining
    configurations to expand the slope of bounding sidewalls [[18](#9789811483653-C4.html_c4r18)].
    Al-MMCs were also studied to machine with the AWJM process. The Focus of the study
    was to improve kerf properties [[19](#9789811483653-C4.html_c4r19)]. Ti-6Al-4V
    was also attempted to be machined using AWJM.. Optimizations were also used like
    Taguchi and ANOVA analysis. A set of experiments were performed to optimize the
    variable input and to reach the desired output. Desired results output parameters
    like MRR and kerf properties were optimized [[20](#9789811483653-C4.html_c4r20)].
    Carbon epoxy, a widely used light weight material, still find limited applications
    of AWJM. . Therefore, a study was performed to machine carbon epoxy composite
    material using AWJM [[21](#9789811483653-C4.html_c4r21)]. Titanium and its alloys
    are classified as difficult to cut materials. M. Douiri *et al.* machined Ti–6Al–4V,
    a titanium alloy, using the AWJM process [[22](#9789811483653-C4.html_c4r22)).
    The Study revealed several distinct zones while machining. Zone 1, Initial stage
    damage occurs at lower attack angles. Then cutting progressed to zone 2\. The
    Zone had smooth cutting. The Attack angle was increased. In Zone 3, an erratic
    cutting was observed. Jet was rather deflected in zone 3 [[22](#9789811483653-C4.html_c4r22)).
    Inconel finds various applications in engines due to its mechanical properties.
    The Same mechanical properties make Inconel, a material, difficult to cut. AWJM
    was successfully used to cut Inconel [[23](#9789811483653-C4.html_c4r23)]. To
    futher improve the study, the Taguchi-Grey relational approach was used to optimize
    the process parameters [[23](#9789811483653-C4.html_c4r23)].


    Surface properties of AWJM compared to milling were studied too Table [1](#9789811483653-C4.html_c4t1).
    It was concluded that AWJM machine appropriately while generating required finish
    in a better manner than milling [[23](#9789811483653-C4.html_c4r23)]. Suresh *et
    al.* used the AWJM machining process to drill fiber reinforced composite. Contrary
    to other reports, abrasive particle size did not influence MRR. It was also observed
    that pressure influenced the taper of the workpiece [[24](#9789811483653-C4.html_c4r24)].
    Recently in 2018, Xiaochu *et al.* performed various experiment to develop WJM.
    Various input and output parameters were analysed [[25](#9789811483653-C4.html_c4r25)].


    Various theoretical studies were performed too, to analyse WJM Table [2](#9789811483653-C4.html_c4t2).
    Melentiev *et al.* used a theoretical approach to analyze micro AJM. Special attention
    was given to use small nozzles [[26](#9789811483653-C4.html_c4r26)]. Jagadish
    *et al.* used a soft computing approach. Surface quality and service life was
    improved using the soft computing approach [[27](#9789811483653-C4.html_c4r27)].


