- fmt: '

    The dielectric fluid, such as de-ionized water, is also present between the wire
    electrode and workpiece. The electron moves from the cathode and its strike on
    to the molecule of de-ionized water and releases the number of electrons. These
    electrons again strike on to the next molecule of the de-ionized water. The process
    goes on continuously and simultaneously positive ions move towards the cathode.
    In this way, a large number of electrons are moved towards the anode (workpiece).
    The kinetic energy of electrons is converted into thermal energy and spark is
    generated. This spark energy increases the temperature of the workpiece to about
    10,000°C. Due to this, melting and evaporation of workpiece material are taken
    place [[10](#9789811483653-C7.html_c7r10)]. Filtered dielectric fluid is pumped
    and streamed continuously to enclose both the workpiece and the wire electrode.
    The electrical energy pulses passing through the electrode wire, at the machining
    zone, vaporize the dielectric fluid to blow off tiny portions of the workpiece
    and the wire. As, wire is continuously fed by the wire spool, every time a new
    section of wire acts as the electrode when old section of the wire is cut off
    and becomes scrap. However, the wire-workpiece gap is maintained and controlled
    to produce an accurate cut surface. Moreover, the dielectric fluid acts as an
    insulator so that high energy in the gap can be produced for the generation of
    spark. Also, it collects and carries away the debris and reduces heat that is
    produced during erosion.


    Wire-cut EDM is used when low residual stresses are desirable as it does not need
    high cutting forces for the removal of the material. If the energy per pulse is
    relatively low, little change in the mechanical properties of a material is expected
    due to these low residual stresses. Although, in conventional machining processes,
    material that has not been stress- relieved can distort in the during service
    life. Due to the inherent properties of the process, wire EDM can easily machine
    complex parts and precision components.


    ### WEDM Process Parameters


    various electrical and non-electrical process parameters, their inter-machining
    relationship and performance measures of WEDM are shown in Fig. ([3](#9789811483653-C7.html_c7f3)).
    It is important to select adequate levels for these parameters to achieve economic
    machining conditions. The input variables can be set, considering the effects
    of these on the output variables, to attain optimum machining environment.


    ![](Images/9789811483653-C7_F3.jpg)**Fig. (3)**


    WEDM process and respond parameter [[11](#9789811483653-C7.html_c7r11)].


    ### WIRE Electrode Properties


    The machining performances of the WEDM, in general, rely on combination of various
    physical, chemical, electrical and mechanical properties of the tool electrode.
    Thus, wire electrode should have excellent properties for achieving high-speed
    cutting with great accuracy and precision. In Table [1](#9789811483653-C7.html_c7t1)
    the list distinct properties of WEDM wires.


    Table 1 Essential properties of WEDM wire [[12](#9789811483653-C7.html_c7r12)].


    | S.No | Property | Description |

    | --- | --- | --- |

    | 1. | Conductivity | Low wire conductivity results in a voltage drop and associated
    energy loss over the distance from the power feed to the cutting point |

    | 2. | Tensile Strength | Hard wires at tensile strength of 900MPa are used for
    most of work, while half hard around 490MPa and soft wires below 440Mpa are used
    for taper cuts for angle more than 5^o. |

    | 3. | Elongation | Hard wires have considerably less elongation than half hard
    wires. A brittle wire might break at first overload condition, while a more ductile
    wire is expected to accept a temporary overload |

    | 4. | Melting Point | Wire electrode should be resistant to the rapid melting
    by the sparks |

    | 5. | Geometrical | Wires ranging in diameters from 0.02 to0.36 mm are generally
    available for WEDM. An increase in diameter of wire results in an increase of
    pulse energy supplied to the working gap, Thus increasing the overall material
    removal rate |


    Fig. ([4](#9789811483653-C7.html_c7r4)) illustrates the increase in wire diameter
    with the WEDM [[13](#9789811483653-C7.html_c7r13)].


    ![](Images/9789811483653-C7_F4.jpg)**Fig. (4)**


    ### Advancements in WEDM Process


    WEDM has proven itself as the advanced technique for machining hard materials
    with complex geometry. Table [2](#9789811483653-C7.html_c7r2) shows the modern
    WEDM.


    Table 2 Hybrid WEDM


    | S.No. | Hybrid WEDM |

    | --- | --- |

    | 1. | Wire EDM Grinding |

    | 2. | Micro WEDG |

    | 3. | Wire EDM Milling |

    | 4. | Wire EDM Turning |

    | 5. | Abrasive Wire EDM |


    ### Electric Discharge Grinding


    In order to produce cylindrical micro-parts, machining process like wire discharge
    grinding (`WEDG`) is preferred [[14](#9789811483653-C7.html_c7r14)]. In `WEDG`
    process, micro rotary parts such as rods and pins are machined with high precision
    [[15](#9789811483653-C7.html_c7r15)]. However, the `WEDG` process can fabricate
    micro rotational parts; the machining efficiency is very limited [[16](#9789811483653-C7.html_c7r16)].


    ### Micro Wire Electro Discharge Grinding


    In micro-WEDG the uses of the grinding wheel are replaced with micro wire which
    acts as an electrode. When fine rod needs to be ground, it acts as a workpiece
    and allowed to be rotated while the electrode is stationary. This process utilizes
    the electrical sparks or thermal energy to remove the unwanted materials from
    the workpiece in order to make the desired shape [[17](#9789811483653-C7.html_c7r17)].
    However, wire breakage control is most critical aspect of micro-WEDM process from
    technical and economic grounds.


    ### Wire Electric Turning


    Wire electrical turning (`WEDT`) process is one of the emerging non-traditional
    machining processes for the manufacture of micro- and axi-symmetric components
    [[18](#9789811483653-C7.html_c7r18)]. In `WEDT` and `WEDG`, the erosion mechanism
    is similar to that of the WEDM process with a difference that in `WEDG` the workpiece
    is fed in longitudinal direction rather than in horizontally as in `WEDT`. Moreover,
    the characteristics of process variants of the `WEDG` and `WEDT` process are in
    the relative motion between the tool and workpiece electrodes and the feed.


    ### Abrasive WEDM (AWEDM)


    In this process, electrical sparks along-with abrasives abrate the workpiece surface.
    Higher material removal rate and better surface finish can be accomplished by
    integrating WEDM with abrasives of fine size.


    ## Developments in WEDM of Titanium Based Alloys


    Srinivasan and Palani [[19](#9789811483653-C7.html_c7r19)] examined the silicon
    nitride-titanium nitride (Si[3]N[4]-TiN) ceramic composite to characterize its
    surface integrity and fatigue performance in WEDM. Different types of defects,
    such as micro-cracks, micro-poles, globules, droplets and surface craters, were
    found during SEM on the WEDM surface of the ceramic composite. Moreover, the fatigue
    life of Wire EDM cut surface decreased by 25-35% than that of polished surface.
    Also, the hardness of the polished surface was much better than of the machined
    surface.

