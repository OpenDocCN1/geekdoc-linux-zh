  raw: 'Mohri *et al.* [[26](#9789811483653-C6.html_c6r26)] conducted experiments
    to investigate the use of EDM process for the machining of insulating CMs by the
    use of assisting electrodes. The kerosene was used a working fluid and it was
    observed that by using the copper electrodes the machining of CMs was very easy.
    In another study wire-EDM finishing was reported to ZrO[2]-TiN hybrid composite
    materials. Spark Plasma Sintering was used to synthesie blanks of ZrO[2]-TiN [[27](#9789811483653-C6.html_c6r27)].
    Sano *et al.* [[28](#9789811483653-C6.html_c6r28)] conducted experiments with
    EDM processes by using electrode made of polycrystalline diamond (PCD). Two kinds
    of PCB namely CTB-010 and CTH-015, both with the flat surfaces were used and the
    results were compared with the electrodes made of Cu-W. It was observed that the
    electrodes made with PCD shows less wear of 1.5% for short pulse duration and
    no wear for long pulse duration while the electrodes made with Cu-W showed 10%
    wear for the same conditions. Palanikumar *et al.* [[29](#9789811483653-C6.html_c6r29)]
    conducted tests to investigate the process parameters of machining WC/Co cemented
    carbide composite materials by EDM process. Various machining parameters were
    also analyzed and the effect of MRR and surface quality by these parameters was
    observed. In a similar study, Hanaoka *et al.* [[30](#9789811483653-C6.html_c6r30)]
    investigated the effect of EDM process which used asiisting electode on the discharge
    behavior of composite made of Si[3]N[4] CMs. In the conclusion, it was stated
    that the results of the MRR of the insulating materials were better than the results
    of conductive materials. Gadalla and Tsai [[31](#9789811483653-C6.html_c6r31)]
    conducted some experimental studies to demonstrate the effect on the content of
    the cobalt and the size of the grains on various machining characteristics of
    the cemented tungsten carbide. It was observed that the rate of MRR can be varied
    by the percentage of cobalt. By increasing the cobalt percentage the MRR will
    also improve and also increase the EDM process stabilization. Lin *et al.* [[32](#9789811483653-C6.html_c6r32)]
    conducted some investigations and tried to form a link between various parameters
    like MRR, surface roughness, cracks on surface with the rate of electrical discharge.
    In the results it was observed that by increasing the discharge of the electrical
    energy will significantly increase the MRR and surface roughness of the material
    formed by EDM process.


    Song *et al.* [[33](#9789811483653-C6.html_c6r33)] conducted an experiment to
    investigate the effect of EDM process on composite made of WC-Co with 10.5 5 of
    Co and using water spray as the dielectric medium. In the reults, it was observed
    that no corrosoion was reported by using water spray dielectric medium and the
    MRR was incraesed along with significant reduction in wear of the electrode. Yu
    *et al.* [[34](#9789811483653-C6.html_c6r34)] investigated the experiments on
    cemented carbides using two types of EDM wiz dry EDM and conventional oil based
    EDM. In the results, it was observed that the dry EDM showed better results with
    high machining speeds and low wear of electrodes as compared with conventional
    oil based EDM. It was further stated that dry EDM can also be used for 3-Dimensional
    machining of the carbides used as workpiece material. In another study Kumar *et
    al.* [[35](#9789811483653-C6.html_c6r35)] investigated the effects on some machining
    parameters like pulse on and off time, current of pulse and voltage by EDM process
    on composite made of Al635i with 5 wt. % of Sic and 5 wt. % of B[4]C. Tool wear,
    surface roughness and power consumption were observed and it was stated that by
    increase in in the electric discharge and pulse current there are significant
    chances of increase in the wear of the tool. In a similar study Patel *et al.*
    [[36](#9789811483653-C6.html_c6r36)] optimized the surface roughness parameters
    of composite materials made of Al[2]O[3]-SiC[w]-TiC with EDM process. Improvement
    in mechanical properties was achieved by whiskers of SiC and particles of TiC
    into Al[2]O[3]. In the results it was concluded that surface methodology method
    was useful for obtaining better surface finish of the formed composite by the
    EDM process. Selvarajan *et al.* [[37](#9789811483653-C6.html_c6r37)] reviewed
    various parameters of the compsoite material processed by EDM that are used in
    industrial applications. Various factors that are required to gain the better
    output were discussed and it was concluded that out of the studied materials A[l2]O[3],
    SiC and TiC are in demand for most of the applications due to their easiness in
    machining. Kangarajan [[38](#9789811483653-C6.html_c6r38)] conducted a research
    and compared the results of wear mechanism of WC-Co composite materials made by
    powder metallurgy process and EDM process. Probabilistic neural networks were
    used to draw the wear mechanism maps of the different processes. The state of
    the wear was then divided into three parts: mild, severe and ultra-severe wear.
    These conditions were based on various factors like wear rate and surface roughness
    of the material. It was also observed that the mechanical properties of surfaces
    formed by EDM process were damaged by the presence of bubbles and craters arose
    through electric discharge. It was concluded from research that the state of ceramic
    wear was briefly recognized by mild wear, severe wear and ultra-severe wear from
    the viewpoints of wear surface roughness and wear rate. Electrical sparks generated
    craters, bubbles and cracks on the machined surface which deteriorated the surface
    finish and mechanical properties of the EDM WC-Co surface and should be removed
    for surface sensitive applications. Dinesh *et al.* [[39](#9789811483653-C6.html_c6r39)]
    conducted a study and investigated the effect of different process parameters
    on various points such as feed rate of electrode; pulse on/ off time and electric
    discharge. In the results, it was observed the current was the main factors that
    significantly affect the MRR and surface roughness of the composite materials
    processed by EDM. Aidil *et al.* [[40](#9789811483653-C6.html_c6r40)] conducted
    studies and critically examined various paremets that effect various maching factors
    effecting the EDM process. It was observed that the rate of MRR and the surface
    roughness of the material were decreased with increase in the pulse on time due
    to the expansion of plasma channel thus resulting in less removal of the material.
    Similarly, the values of the same parameters were increased by increase in pulse
    off time.


