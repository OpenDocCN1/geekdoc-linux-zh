- fmt: ' even# Artificial Intelligence and Robotics in Manufacturing


    ## Introduction to Machine Learning

    Machine learning is the ability of machines or computers to learn without being
    programmed. It uses numerous algorithms to analyze and evaluate data, after analyzing
    the data, learn from it, and then make judgments or deliver an output. Therefore,
    machine learning algorithms permit systems to execute a task by training the machines
    by applying accessible data to inputs.


    On the other hand, deep learning is a subset of AI and machine learning, which
    are based on biological neural network learning representations for solving complex
    problems as humans do. Learning in AI can be supervised type, semi-supervised,
    reinforced or unsupervised type [[2](#9789811483653-C9.html_c9r2)].


    ## Supervised Learning

    Supervised learning as the name indicates the presence of a supervisor as a teacher.
    Supervised learning is a learning in which the teaching to the machine is done
    by labeled data, which indicates certain data is previously marked with the correct
    solution. Later Than, the machine is presented with a fresh set of instances(data).
    Consequently, the algorithm based on a supervised approach analyses the training
    data set and generates an appropriate conclusion from the learning of previously
    labeled data.


    For example, assume a basket filled with various types of fruits. The initial
    stage is to train the system with all dissimilar fruits in sequential order. If
    the shape of an item is rounded and imprint at topmost is having Red color, then
    the fruit will be labeled as Apple. On the other hand, an object is a long curving
    cylinder with Green-Yellow color, so it will be labeled as a fruit named Banana.
    Let us assume after training from the labeled data if a machine has been input
    with a new similar sample of fruit from the basket and asked to detect it. Because
    the system has previously learned from earlier data, the machine gives an accurate
    output.


    Supervised learning classified into two categories of algorithms such as Classification
    and Regression.


    ## Unsupervised Learning

    On the other hand, unsupervised learning is done with data that is neither labeled
    nor classified. Thus, it is allowing the algorithm to act on that information
    without any guidance. Now, the machine must group unsorted data according to patterns,
    similarities, and differences without any previous training of data. Unlike supervised
    learning, no teacher is present that suggests, no such teaching or training has
    been given to the system or machine. Therefore, the unsupervised based machine
    is constrained to find the hidden arrangement in unlabeled data by itself.


    Let us take an example of both dogs and cats’ pictures, which have not been trained
    previously with any data set. Now, the system has no clue about the shape of dogs
    and cats. Hence, it can’t be categorized in dogs and cats or animals. Although,
    unsupervised algorithms can classify them according to their similarities, patterns,
    and differences.


    ## Reinforcement Learning

    Finally, reinforcement learning, in artificial intelligence, is following a dynamic
    approach that teaches the machine using a reward and punishment technique. In
    this technique, the machine learns by interacting with its environment [[3](#9789811483653-C9.html_c9r3),
    [4](#9789811483653-C9.html_c9r4)].

