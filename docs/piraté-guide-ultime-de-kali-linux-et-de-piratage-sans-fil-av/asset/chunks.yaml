    # Thermally Enhanced Non-Conventional Machining Process- A Review


    **Janender Kumar^([1](#9789811483653-C3.html_c3aff1))****,** **Suneev Anil Bansal^([1](#9789811483653-C3.html_c3aff1),
    [*](#9789811483653-C3.html_c3cor1))****,** **Munish Mehta^([2](#9789811483653-C3.html_c3aff2))**


    ¹ Department of Mechanical Engineering, Maharaja Agrasen University, Baddi, Solan,
    India


    ² School of Mechanical Engineering, Lovely Professional University, Phagwara,
    Punjab, India


    ## Abstract


    The present work puts light on the non-conventional machining process in which
    heat energy is utilized to remove the material from the workpiece. Laser beam
    machining is a process in which a high-intensity beam falls on the work surface
    to raise the temperature so that the vaporization of material could take place.
    Laser beam machining process can be utilized to machine hard and brittle materials.
    The laser types used and laser drilling processes are reviewed. The complex profiles
    cutting and micro-drilling can be achieved which is not possible by other conventional
    and non-conventional machining processes. Many researchers have studied that a
    hybrid process can improve the process parameters of laser beam machining. This
    paper reviews its need, hybrid process and latest developments in the field of
    machining of different materials like ceramics, composites, *etc.* The last section
    of the paper discusses the area of future research in this field.'
