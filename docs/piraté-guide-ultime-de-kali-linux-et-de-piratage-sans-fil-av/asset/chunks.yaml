    ## INTRODUCTION


    In the manufacturing industries, the development of advanced material brought
    a revolution in the performance of equipment and machinery due to its superior
    quality. Simultaneously, it has posed challenges to its machining because these
    materials are hard and brittle. The complex shape and unusual workpiece size were
    also the requirements. Industry has forced the research engineers to develop newer
    machining methods [[8](#9789811483653-C3.html_c3r8)] [[12](#9789811483653-C3.html_c3r12)].
    So, to take full advantage of these costly materials, advanced machining methods
    are under consideration. These are ultrasonic machining, electrochemical machining,
    electrochemical grinding, laser beam machining, water jet machining, plasma arc
    machining, etc. Yet these have own certain limitations regarding machining of
    parent material. In this paper, laser beam machining and allied processes are
    studied. It is also called thermally enhanced machining processes because heat
    energy is utilized for machining. In our childish days, we performed one experiment
    in which sun rays were focused through a lens to burn a piece of carbon paper.
    The energy density was about 1W/mm². In some manners, a laser beam can be focused
    on hard material with high density to remove the material from the workpiece through
    vaporization. Einstein gave the concept of laser theory and stimulated emission.
    The first laser named Ruby laser was produced by Tower and Shawlow in the year
    1957.


    ## LASER BEAM MACHINING


    The full form of laser is “Light Amplification by Stimulated Emission of Radiation”.
    Laser light is monochromatic in nature i.e. its wavelength occupies a very narrow
    portion of the spectrum. Hence a simple lens can focus the laser light to a micro-spot
    of a very smaller diameter and with higher intensity than another type of light.
    Laser light is coherent as it travels in phase. The three major elements of any
    laser device are:


    1. Lasing medium

    2. A pumping energy source required to excite these atoms to higher energy levels.

    3. Optical feedback system.


    The laser medium may be a solid, liquid or gas. All have different wavelengths.
    It lies between 0.21-11micron meter.


    `Ruby = 0.7micron meter`, `Nd:YAG = 1.0 micron meter`, `CO = 2.7micron meter`,
    `CO[2] = 10micron meter`.


    ### Types of Lasers


    Different types of laser are utilised in machining having a frequency and mean
    power accordingly as shown in Table [1](#9789811483653-C3.html_c3t1).


    ### Difference Between Ordinary & Laser Light


    Laser light has photons of the same frequency, wavelength and phase. That’s why
    it is highly directional and of high-power density. It has better focusing properties
    as compare to ordinary light.


    Table 1 Types of laser [[3](#9789811483653-C3.html_c3r3)].


    | Types of Laser | Mean Power | Efficiency |

    | :--- | :--- | :--- |

    | Nd: YAG | 1w-2kw | 2-5% |

    | CO[2] | 10w-20kw | 10-15% |

    | Excimer | 1w-500w | Less than 3 |

    | CO | 5w-15kw | Less than 20 |

    | I[2] | Less than 1kw | Less than 20 |


    ### Principle of Laser Beam Machining


    When a laser beam is focused through a lens on workpiece, the heat energy is absorbed
    which melts the selected surface, melts it, vaporizes it instantaneously and penetrates
    it. Thus, it can also be called a thermal cutting process as shown in Fig. ([1](#9789811483653-C3.html_c3f1)).


    ![](Images/9789811483653-C3_F1.jpg) **Fig. (1)**


    Laser beam cutting [[12](#9789811483653-C3.html_c3r12)].


    ### Laser Drilling Overview


    The small size hole, can not be produced by conventional machining processes,
    can be prepared with laser beam machining. Hence this was the huge advantage for
    drilling of hard to cut materials. The comparison hole drilling using Laser Drilling
    with other processes is shown in Table [2](#9789811483653-C3.html_c3t2).


    ### Types of Laser Drilling


    There are two types of laser beam drilling process present and these are percussion
    and trepan drilling. Percussion drilling punches directly through the workpiece
    material with no relative movement of the laser or workpiece. Trepan drilling
    involves cutting around the circumference of the hole to be generated as shown
    in Fig. ([2](#9789811483653-C3.html_c3f2)).


    ![](Images/9789811483653-C3_F2.jpg) **Fig. (2)**


    Schematic of Laser Beam (a) Percussion drilling (b) Trepan drilling [[12](#9789811483653-C3.html_c3r12)].
    Table 2 Comparision of non-conventional processes [[10](#9789811483653-C3.html_c3r10)].


    | Non-Conventional Machining Processes | Precision Small Hole (Diameter Less than
    0.25mm) |

    | :--- | :--- |

    | Ultrasonic machining | - |

    | Electrochemical machining | - |

    | Laser beam machining | Good |

    | Plasma arc machining | - |

    | Electrical discharge machining | - |

    | Abrasive jet machining | - |

    | Chemical machining | fair |


    It is clear from the table that only two processes could produce a hole less than
    0.25 in diameters. Laser beam drilling has performed well than chemical machining.


