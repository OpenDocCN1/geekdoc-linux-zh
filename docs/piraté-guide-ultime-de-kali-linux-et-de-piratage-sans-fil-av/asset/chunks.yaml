- fmt: '

    The most commonly used tool materials are metallic (copper, brass, tungsten, aluminium
    *etc.*), non-metallic (graphite) and composites (copper tungsten, copper silicon
    carbide, copper boron carbide, copper graphite) *etc.* Copper is the most widely
    used tool material owing to its high electrical and thermal conductivity. Though,
    in machining of difficult to machine materials, it has been seen that the copper
    tool erodes faster [[14](#9789811483653-C2.html_c2r14)]. Low melting point of
    copper enhances wear rate of electrode that leads to variation in shape of tool.
    In EDM, workpiece is replica of tool profile. Accuracy of the machined cavity
    depends on the shape stability of the tool. Therefore, any change in the shape
    of tool may obtain a product that is different in shape and size than the desired
    one [[15](#9789811483653-C2.html_c2r15)].


    To decrease electrode wear, one of the approaches proposed by the past researchers
    is the fabrication of modified tool having improved mechanical, electrical and
    thermal properties [[16](#9789811483653-C2.html_c2r16)^-[18](#9789811483653-C2.html_c2r18)].
    The strength of copper can be increased by alloying materials like `Cr` and `Zr`
    but these elements lose these properties by dissolving in copper at high temperature
    [[19](#9789811483653-C2.html_c2r19)]. To avoid this problem, the copper matrix
    composites are made by the addition of oxide, carbide and the addition of ceramic
    particles in the copper [[20](#9789811483653-C2.html_c2r20)^-[22](#9789811483653-C2.html_c2r22)].
    When high electrical and thermal conductivity along with high wear resistance
    is required Cu matrix composites are good choice [[23](#9789811483653-C2.html_c2r23)].


    Materials with high melting point and wear resistance characteristics, with good
    electrical and thermal conductivity are utilized to decrease the electrode wear
    of copper-based electrodes. Addition of ceramic reinforcements like carbides,
    improves the characteristics such as wear resistance and high temperature stability.
    The inclusion of materials such as `graphite` to copper matrix decreases the strength
    of the composites. The strength of the composites can be enhanced by the addition
    of ceramic reinforcement materials like silicon carbide (`SiC`). It increases
    the strength of composites, but, the electrical resistivity also increases. The
    composite made from `SiC` and `Cu` has the better ductility and toughness of `Cu`,
    as well as high strength of `SiC` reinforcements [[24](#9789811483653-C2.html_c2r24)].
    The addition of titanium Carbide (`TiC`) to copper improves its strength but it
    also slightly reduces the electrical conductivity of copper. `TiC` is hard material
    and it has very high melting temperature along with excellent thermal shock and
    abrasion resistance properties [[17](#9789811483653-C2.html_c2r17), [25](#9789811483653-C2.html_c2r25)].
    Often, there are possible choices of tool materials that will produce the parts
    successfully but not cost-effectively.


    ### Electrode Material and Trends


    The electrode material must have high melting temperature and low electrical resistivity.
    The success of electrode material depends primarily upon the material being machined
    and on the distinct cutting application [[26](#9789811483653-C2.html_c2r26)].
    Commonly used materials for the EDM tool electrode are copper, brass, graphite,
    tungsten, silver and steel. High tool wear is leading concern of these types of
    electrodes. Continuous efforts are being carried on for developing a tool material
    for EDM process having low electrical and thermal resistance, high wear resistance
    and easy availability and fabricability [[27](#9789811483653-C2.html_c2r27)].


    Current trends in research of ceramic materials are shifting from single material
    to multi material electrodes. Tool properties like wear resistance, fracture toughness,
    hardness and thermal shock resistance have been improved significantly by the
    addition of one or more materials into the base material to form composite tool
    materials [[28](#9789811483653-C2.html_c2r28)].


    ### Case Studies


    Ozgedik and Cogun [[12](#9789811483653-C2.html_c2r12)] investigated the edge and
    front wear of tool during EDM of 1040 steel with copper electrode. An increase
    in inner and outer end wear of tool was observed with the rise in discharge current.
    Increase in `TWR` with increment in pulse duration was also recorded. In static
    flushing there was inappropriate flushing of the molten metal resulting in lowest
    material removal rate. Injection flushing produced the best surface quality.


    Geric [[13](#9789811483653-C2.html_c2r13)] made an investigation on the addition
    of cutting tool materials with alumina matrix. Their composition, strengthening
    and toughening mechanism was also examined. Mechanical properties of `Al[2]O[3]`
    matrix were enhanced with the use of hard particles or whiskers. Decrease in brittleness
    was noticed with the addition of carbide, oxide and nitride in alumina matrix.
    The addition of `TiB` to alumina enhanced the wear resistance of the composite.
    The addition of yttria stabilized zirconia increase the wear resistance, however,
    microhardness of the composite decreased.


    Srivastava and Pandey [[18](#9789811483653-C2.html_c2r18)] tested the working
    of sintered `Cu-TiC` and conventional tool in ultrasonic assisted cryogenically
    cooled EDM. `EWR` increased with the rise in current, however it was lower for
    cermet tooltip in comparison with copper tooltip. With the increase of duty cycle
    there was more spark energy eventually resulted into higher `EWR`. The surface
    crack density and crack width were found to be lesser on the surface machined
    with `Cu-TiC`.


    Khanra et al. [[27](#9789811483653-C2.html_c2r27)] fabricated `ZrB[2]-Cu` composite
    using sintering process to attain an optimal value of thermal and electrical conductivity
    and wear resistance of tool. The composite was made by the addition of different
    percentages of copper. The testing was performed on mild steel for the different
    parameters. The composite with 40% copper resulted in higher `MRR` and acceptable
    tool wear rate (`TWR`) in comparison to copper tool. Though, the conventional
    copper tool exhibited lesser diameter overcut and surface roughness. The deviation
    of `MRR` with variation of copper percentage is shown in Fig. ([2](#9789811483653-C2.html_c2f2).


    ![Images/9789811483653-C2_F2.jpg](Images/9789811483653-C2_F2.jpg)

    Fig. (2)) Deviation of MRR with copper content [[27](#9789811483653-C2.html_c2r27)]


    Mohari et al. [[29](#9789811483653-C2.html_c2r29)] used copper, aluminum, titanium
    and tungsten carbide powders for the fabrication of tool electrode for EDM process.
    The compaction pressure used for the fabrication of pellet was 343 MPa. Green,
    sintered and solid copper electrodes were used. Carbon steel and aluminum were
    used as work material. As compared to raw material, lower conductivity of green
    compact and sintered electrode was recorded. The wear rate of sintered and green
    electrode was five and ninety times more than that of solid copper electrode (0.32
    µm/min).


    Kumar et al. [[30](#9789811483653-C2.html_c2r30)] used positive polarity `Cu-Cr`
    tool electrode to machine hastelloy with EDM. Highest `MRR` was achieved at 60V
    voltage and 18A current. Thereafter more rise in voltage and current resulted
    in deposition of material on work piece material from powder metallurgy tool electrode
    resulted in decreased material removal rate. Rise in current resulted in rise
    in `TWR` due to availability of higher energy at higher current. The best results
    for surface roughness were obtained at voltage 60V and current 14A because above
    these values of current and voltage `TWR` increased.

