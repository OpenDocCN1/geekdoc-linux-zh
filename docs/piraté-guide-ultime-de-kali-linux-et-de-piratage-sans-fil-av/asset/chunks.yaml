    It is also seen that the AJM found its uses in precise machining having CNC conception.
    AJM is being diverted the micro machining due to the changes of technology diminutization
    thus changing the nozzle size from macro to micro scale and changing the nozzle
    material to sapphire. AJM has been accompanied with high pressured pumps and harder
    abrasive particles for machining. Verma *et al.* [[5](#9789811483653-C5.html_c5r5)]
    discussed the nozzle wear that was dependent on various parameters like length
    of nozzle, diameter of nozzle, nozzle inlet angle, and the orifice size. It was
    also seen that the nozzle traverse speed played the most important role in MRR
    along with the abrasive flow rate up to a certain limit as it led to decrease
    in surface roughness and increased kerf geometry. So, there were various researches
    being done but some gaps were found that need to be looked on regarding the analysis
    of AJM, nozzle wear in AJM and the study of various parameters on the surface
    integrity.


    There are various researches which are been discussed in this article that shows
    the recent advancements being done on the basis of technological advancement,
    the industrial application and its diversity. Review is also performed for the
    various material mechanisms, material removal, influence of process parameters
    and nozzle wear of AJM.


    # LITERATURE REVIEW


    ### Abrasive Air Jet Machining


    Abrasive Air Jet Machining (AAJM) can be described as the technique that works
    by blasting a stream of particles at a high velocity, thus causing erosion of
    material [[6](#9789811483653-C5.html_c5r6)]. It is empathized to have a good material
    removal rate. It has been found out that on reduction of the nozzle diameter to
    less than 1mm it changes into a micro machining process or Micro-AAJM. The layout
    can be seen in the (Fig. [1](#9789811483653-C5.html_c5f1)). The in-system filter
    and drier are used to clean the compressed air and dry it at the same time. After
    this the air is passed through the adjusting valve where the pressure of air is
    regulated and controlled. Then finally, it is passed to the blasting gun near
    the workpiece. The particles, after being used for erosion along with chips, are
    collected with the help of dust catcher. During the machining, there is a little
    amount of fracture depending upon the material used, properties and the various
    parameters considered. After the erosion the particles, the gases are escaped.
    Micro AAJM is used for production of small passages like passes and holes on various
    brittle materials such as ceramics, glasses and carbide metals. It is also found
    that the abrasive particles are often seen embedded in the machine surface thus
    creating a negative relation when nonferrous metals or polymers are used. To machine
    such materials, the cryogenic assisted AJM is used that is discussed later.


    ![](Images/9789811483653-C5_F1.jpg) **Fig. (1)**


    Layout of Abrasive Jet Machining process [51].


    ### Abrasive Water Jet Machining


    Abrasive water jet machining is the advancement in the traditional machining process
    that replaces the carrier gas with the water and has found its key application
    in mining industry [[7](#9789811483653-C5.html_c5r7)]. It is sometimes compared
    with slurry jet machining which works on two different modules of lower pressure
    with a premixed slurry mixture. In this, the viscosity of the medium plays an
    important role as the jet at the nozzle is improved up to 100 times as compared
    to air. It is seen that the AWJM has made a lot of improvements as roughness is
    reduced to nano scale [[8](#9789811483653-C5.html_c5r8)], distant footprint [[10](#9789811483653-C5.html_c5r10)],
    faster workpiece cools down and adequate slurry recovery [[11](#9789811483653-C5.html_c5r11),
    [12](#9789811483653-C5.html_c5r12)]. But the impact velocities are found to be
    different due to high deceleration in the water stagnation zone and the high influence
    of viscosity on trajectory of abrasive (Figs. [2](#9789811483653-C5.html_c5f2)
    & [3](#9789811483653-C5.html_c5f3)). After this the abrasive particles lose all
    its kinetic energy. Higher MRR is seen in air as compared to water as it provides
    less stagnation zone. Some research has also been done to reduce this stagnation
    zone [[13](#9789811483653-C5.html_c5r13)] and proposed the usage of V shaped masks.
    It is also seen that use of soybean oil as carrier of abrasive can reduce the
    secondary impact on the workpiece in primary footprint [[14](#9789811483653-C5.html_c5r14)].
    The disadvantage of this is seen in the form of crack formation and its propagation
    due to the pressure of fluid used especially when working on ceramics [[15](#9789811483653-C5.html_c5r15)].


    ![](Images/9789811483653-C5_F2.jpg) **Fig. (2)**


    Abrasive Water Jet Machining layout [[3](#9789811483653-C5.html_c5r3)].![](Images/9789811483653-C5_F3.jpg)
    **Fig. (3)**


    Flow Velocity Distribution [[9](#9789811483653-C5.html_c5r9)].


    ### Use of Cryogenic in AJM


    It has been discussed earlier that the softer metals cannot be easily machined
    having precise dimension using abrasive in AJM. Due to the small abrasives having
    high kinetic energy and high velocity penetrate the surface especially when hitting
    normal to the surface. Thus, it is found that a large amount of material cannot
    be machined having ductile or soft material properties by the same principle as
    of brittle or hard material erosion is carried out. Thus, to work on such materials
    cryogenics has been introduced so that the material removal mechanism can somehow
    be changed. AA5083-H32 aluminium alloy was machined using the both AAJM and cryogenic
    assisted AJM. A comparison study was carried out for the surface integrity [[16](#9789811483653-C5.html_c5r16)].
    In this study they used liquid nitrogen at -195˚C and supplied it to the machining
    zone in compressed air. This led to the change in the hardness to a very high
    amount thus reducing the number of abrasives embedded in the material airing erosion.
    It was accompanied by the crest and troughs profile having continuous roughness.
    The liquid Nitrogen used also produced the strain properties and thus hardening
    the material being machined as an effect of grain refinement accompanying with
    increased micro hardness up to two times. Some other studies were also carried
    out that used a heat exchanger accompanied with liquid nitrogen for cooling the
    air stream other than the material to be machined [[17](#9789811483653-C5.html_c5r17),
    [18](#9789811483653-C5.html_c5r18)]. A LN2 type of heat exchanger having tubular
    shape carrying high and low heat thermal conductivity inside and outside respectively
    were used. The abrasives were directed to flow to the material at a temperature
    of -80˚C jet condition. The temperature was thus varied from -80˚C to 180˚C. A
    change was observed when the jet temperature reached -180˚C as the erosion principle
    changed to brittle one.


    It was also accompanied in this study that the incidence angle of 30˚ to 60˚ was
    found to be best for maximum MRR. This study found that the erosion of softer
    materials can also be obtained at -180˚C. To obtain more precise machining of
    such material with brittle removal mechanism at lower temperature can also be
    taken into account. It also had some disadvantages accompanied as the liquid nitrogen
    was being used that in its own means the sources and energy consumption on a very
    large scale, also such high cooling leads to crack formation due to the thermal
    strain in the material. But it was also found this also leads to the surface weakening
    which also helps in the subsequent erosion of the material.


    ### Thermally Enhanced AJM

