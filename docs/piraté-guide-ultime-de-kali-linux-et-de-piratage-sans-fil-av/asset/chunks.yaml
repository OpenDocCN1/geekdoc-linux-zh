  trans: '


    电极的物理特性影响加工性能。高导电性、高比热、良好的加工性、高耐侵蚀性*等*是理想电极必须具备的特性。单一材料无法满足所有要求。传统的加工方法主要用于制造电火加工（EDM）电极[38]。几何形状的复杂性和要求的精度通常决定了电极的制造成本。均匀尺寸电极便宜且容易生产，但通过传统加工工艺制造的复杂形状电极成本可能是简单形状电极的
    100 倍[39]。对于复杂的三维形状电极，使用了如机械加工、电成、金属喷涂、铸造、快速原型制造或粉末冶金等不同方法[17, 40]。这些技术也有助于缩短交付周期。下面介绍了关于制造
    EDM 刀具的研究尝试综述。


    ### 实验工作与材料性能


    Samuel 和 Philip[16]进行了实验工作，并观察到通过粉末冶金（P/M）方法可以很容易地制造电极，其属性也可以相对容易地控制，因此优于其他电极制造方法。压压力对相对密度和生坯强度的影响如图（**7a**和**b****图（7）**


    压压力对**(a) 相对密度和**(b) 生坯强度**的影响[16]。


    Samuel 和 Philip[39]在研究中使用纯度为 99.7%的铜（Cu）粉作为刀具材料，并使用粉末冶金（P/M）工艺制造刀具。发现导电率随烧结温度和压力的升高而增加。低压电极机械强度较低。高烧结温度增加了结合强度并减少了侵蚀。因此，压力和烧结温度的增加导致了电、热、机械和微观结构性能的变化，从而获得了更好的性能。


    ### 涂层与制造方法


    Dimla 等人[40]采用立体光刻和直接金属激光烧结技术对模型进行涂层，以制造用于 EDM 过程的刀具。两种方法沉积在模型上的铜量都存在问题。所使用的工艺无法在模型上沉积均匀的铜层，厚度在
    50-1000 µm 之间波动。这些方法无法沉积足够的铜，特别是在电极的内部区域。涂层厚度从外表面到内壁逐渐减小，且发现刀具电极不适用于 EDM。电极垂直壁内部铜厚度的变化如图（**8****图（8）**


    电极内垂直壁铜沉积情况的测量[40]。


    Durr 等人[41]引入了直接金属激光烧结的概念，用于制造 EDM 过程的刀具电极。电极包含铜、镍和磷化铜粉，逐层构建。工艺优化表明，烧结电极的孔隙率直接受激光速度、激光功率和烧结策略控制。电极还浸入了含银的钎焊金属。这些电极实现了约
    12.5 mm³/min 的去除率（MRR），但与传统电极相比，其表现出更大的电损耗（EWR）和表面粗糙度。


    Norasetthekul 等人[42]通过机械压聚涂聚合物 ZrB[2]粉末合成刀具电极，然后在高温炉中将铜浸入生坯。。压压力越高，颗粒间的空隙越少，从而减少了填充间隙所需的铜量。然而，发现铜往往无法完全填充间隙。观察到
    ZrB[2]-Cu 电极在极高能量通量的条件下对等离子火花具有最高的热磨损性。此外，该刀具切割钢制件的速度比石墨和铜刀具更快。


    Li 等人[43]揭示了添加 TiC 对烧结铜基刀具性能的影响。通过将 TiC 含量从 5%变化到 45%，对铜和铜钨（Cu-W）粉末进行粉末冶金制造颗粒，随后进行液相烧结。添加
    TiC 改善了表面光洁度，并建议用于精光加工。发现这些电极的热磨损率（TWR）也低于商用电极。


    Zhao 等人[44]报告了选择性激光烧结（SLS）作为制造 EDM 金属原型的有用方法。通过金属浸渗，SLS 金属原型的密度和其他机械性能各方面得到了提高。将金属原型浸入液体浸渗剂（常用铜）中，浸渗剂通过毛细作用进入开放孔隙。结果显示，电极的磨损率与传统电极相当。


    Blom 等人[45]采用喷涂金属和电成工艺生产刀具电极。将这些电极的性能与传统固体电极进行了比较。在不同的工作条件下，测量了 MRR、TWR、加工时间和表面粗糙度。在
    MRR 和 TWR 方面，固体刀具的结果优于电成刀具。然而，发现电成方法合成的刀具比固体刀具更便宜。


    Shibayama 和 Kunieda[46]利用具有极小孔的电极实现了深槽电火加工。这些孔将导电液引向工件表面。两个在界面具有微槽以引导导电液的铜板通过扩散焊接形成电极。与通常使用的固体刀具电极相比，这种电极加工时间更短，精度更高。


    Mishra 和 Pathak[47]在 ZrB[2]粉末中加入碳（0 到 10%）和碳化钛（0 到 10%）并研究了系统烧结。混合 4%以内的碳导致了致密化，但进一步增加碳会阻碍致密化。添加超过
    5%的 TiC 对 ZrB[2]的烧结产生不利影响。碳的引入有助于抑制晶粒长大，获得了细晶粒和高密度的复合材料。


