  trans: '


    **关键词：** 复杂形状、钻孔、硬脆性材料、热能、混合加工、激光束、激光加工、加工参数、微钻孔。


    ***


    **通讯作者 Suneev Anil Bansal:** 印度 Solan，Baddi，马哈拉特·阿格森大学机械工程系；电子邮箱：[suneev@gmail.com]


    ## 引言


    在制造业中，先进材料的发展因其优越的质量为设备和机械的性能带来了一场革命。同时，由于这些材料硬度且脆，也对其加工带来了挑战。复杂的形状和不寻常的零件尺寸也是一种要求。行业迫使研究工程师开发更新的加工方法
    [8] [12]。因此，为了充分利用这些昂贵的材料，先进加工方法正在考虑之中。这些包括超声波加工、电化学加工、电化学磨光、激光加工、水喷射加工、等离子弧加工等。然而，这些在加工母材方面仍有某些局限性。本文中研究了激光加工及相关工艺。它也被称为热增强加工工艺，因为利用了热能进行加工。在我们童年时代，我们进行过一个实验，通过透镜聚焦阳光来烧毁一张碳纸。能量密度约为
    1W/mm²。在某些情况下，激光束可以高密度地聚焦在硬材料上，通过汽化从工件上去除材料。爱因斯坦提出了激光理论和受激发射的概念。第一种名为红宝石的激光由 Tower
    和 Shawlow 在 1957 年制造出来。


    ## 激光加工


    激光的全称是“辐射受激发射产生的光谱放大”。激光光在本质上是单色的，即其波长占据光谱中非常窄的部分。因此，简单的透镜可以将激光光聚焦到直径非常小的微光斑，且强度比其他类型的光更高。激光光是相干的，因为它以相位传输。任何激光装置的三个主要要素是：


    1. 激光介质

    2. 需要将这些原子激发到更高能级的泵浦能量源

    3. 光学反馈系统。


    激光介质可以是固体、液体或气体。它们都有不同的波长。范围位于 0.21-11 微米之间。


    `Ruby = 0.7micron meter`, `Nd:YAG = 1.0 micron meter`, `CO = 2.7micron meter`,
    `CO[2] = 10micron meter`。


    ### 激光类型


    不同类型的激光被用于加工，并具有相应的频率和平均功率，如表 1 所示。


    ### 普通光与激光的区别


    激光光具有相同频率、波长和相位的光子。这就是为什么它具有高度的方向性和高功率密度。与普通光相比，它具有更好的聚焦特性。


    表 1 激光类型 [3]。


    | 激光类型 | 平均功率 | 效率 |

    | :--- | :--- | :--- |

    | Nd: YAG | 1w-2kw | 2-5% |

    | CO[2] | 10w-20kw | 10-15% |

    | Excimer | 1w-500w | Less than 3 |

    | CO | 5w-15kw | Less than 20 |

    | I[2] | Less than 1kw | Less than 20 |


    ### 激光加工原理


    当激光束通过透镜聚焦在工件上时，吸收的热能会熔化选定的表面，将其熔化、瞬时汽化并穿透它。因此，它也可以称为热切割工艺，如图 (1) 所示。


    ![](img/9789811483653-C3_F1.jpg) **图 (1)**


    激光切割 [12]。


    ### 激光钻孔概述


    传统工艺无法制造的小尺寸孔可以通过激光加工制备。因此这对于硬材料的钻孔具有巨大的优势。激光钻孔与其他工艺的比较如表 2 所示。


    ### 激光钻孔类型


    存在两种激光束钻孔工艺，即冲击钻孔和旋绕钻孔。冲击钻孔直接穿过工件材料，激光或工件没有相对运动。旋绕钻孔涉及在待生成的孔周上进行切割，如图 (2) 所示。


    ![](img/9789811483653-C3_F2.jpg) **图 (2)**


    激光示意图 (a) 冲击钻孔 (b) 旋绕钻孔 [12]。表 2 非传统工艺的比较 [10]。


    | 非传统工艺 | 精密小孔（直径小于 0.25mm） |

    | :--- | :--- |

    | 超声波加工 | - |

    | 电化学加工 | - |

    | 激光加工 | 好 |

    | 等离子弧加工 | - |

    | 电火花加工 | - |

    | 磨粒射流加工 | - |

    | 化学加工 | 一般 |


    从表中可以看出，只有两种工艺可以产生直径小于 0.25 的孔。激光钻孔的表现优于化学加工。


