    Janmanee 和 Muttamara [31] 研究了铜钨（固态）、铜-石墨和石墨作为钨硬化钴（90WC-10Co）工件电火加工（EDM）的工具材料。分析了占空比、开路电压、电极极性和电流等某些重要工艺标准的影响。结果显示，石墨工具在材料去除率（MRR）方面表现更好（图
    3a），而铜钨工具的电极损耗率（EWR）和表面粗糙度最低（图 3b, 3c）。


    ![](img/9789811483653-C2_F3.jpg) **图 (3)**


    放电电流对 (a) MRR (b) EWR (c) 表面粗糙度的影响 [31]


    Ndaliman 和 Khan [32] 描述了通过粉末冶金方法制备的 Cu-TaC（TaC 成分分别为 30% 和 55%）工具电极的性能。测量并比较了烧结和压坯电极的密度、导电性和导热性。坯粒的导电性、导热性和密度分别为
    94.96-189.92 Ω^(-1)m^(-1)、29.70-33.20 W/m K 和 6.13-9.80 g/cm³，均高于烧结颗粒。导电性最好的坯粒含有
    30% TaC。


    Li *et al.* [33] 报道了用电沉积制备的固铜电极和 Cu-SiC 电极对 Inconel 718 进行电火加工。在 7.5 μs 脉冲宽度下，Cu-SiC
    电极相比传统的铜电极将材料去除效率提高了 15.12%，在 24.5 μs 脉冲宽度下提高了 16.3%。在峰值电流 14.2 A 时，R[a] 降低了 17.1%，在
    25.6 A 时 R[a] 降低了 16.5%。Inconel 718 的高韧性值使得加工腔没有微裂纹。由于精细的微观结构和较高的熔点，Cu-SiC 复合材料的电极损也较低。这些电极在
    MRR、EWR 和表面粗糙度方面的性能见图 (4)。


    ![](img/9789811483653-C2_F4.jpg) **图 (4)**


    (a) 不同电极性能的变化 (a) MRR (b) EWR (c) 表面粗糙度 [33]


    Hussain *et al.* [34] 使用粉末冶金技术开发了一种基于 Cu-Al[2]O[3] 的复合材料。使用 Al[2]O[3] 的原因是其高耐磨和耐高温性。实验使用了四种
    Al[2]O[3] 百比分别为 0、1、3 和 5% 的工具。样品的最大密度和硬度在成分为 5% Al[2]O[3] 时获得（图 5a 和 b）。结果表明复合材料的耐磨性取决于质量密度和硬度，建议用作
    EDM 电极。含有 5% Al[2]O[3] 的工具表现出最低的磨耗（图 5c）。


    ![](img/9789811483653-C2_F5.jpg) **图 (5)**


    (a) 质量密度 (b) 硬度 (c) 磨耗随 Al[2]O[3] 百比的变化 [34]


    Kumar *et al.* [35] 在 monel 400^(TM) 合金的 EDM 加工过程中，使用铜硼化钛工具进行了实验。研究了硼化钛百分比（8-20%）、脉冲电流（2-10
    A）、脉冲宽度（10-50 µs）和介质压力（0.4-1.2 MPa）对 MRR 和 EWR 的影响。工具中加入硼化钛显著降低了 EWR 并略微提高了 MRR。根据结果，建议了一组优化工艺（硼化钛
    16%、脉冲电流 6 A、脉冲 35 µs 和介质压力 1 MPa）。


    Liew *et al.* [36] 报道了反应结合碳化硅（RB-SiC）ED 加工过程中，碳纳米纤维（CNF）增强 Cu 工具（CNF 百比分别为 0、0.5、1
    和 4%）的性能。在所有检查的电极中，Cu-CNF (1%) 显示出最大的 MRR（0.5502 mm³/min）和最好的表面光洁度（图 6a 和 b)）。随着
    CNF 百比的增加，由于工具的整体材料去除，EWR 增加（图 6c 见图 6d)）。


    ![](img/9789811483653-C2_F6.jpg) **图 (6)**


    CNF 对 (a) MRR (b) SR (c) EWR (d) 电极损化的影响 [36]


    Mandal 和 mondal [37] 用单壁碳纳米管涂层 6061Al 制备电极。在 AISI 304 不锈钢上使用了混合工具实验。结果与涂铜 6061Al
    和未涂层的 6061Al 工具进行了比较。涂铜和单壁碳纳米管涂层 6061Al 电极的 MRR 分别增加了 3.13% 和 14.52%，EWR 分别降低了
    21.04% 和 29.6%。加工腔的表面粗糙度分别降低了 14.06% 和 8.03%。


    不同类型工具材料的主要研究列于表 1。


    ### 表 1：不同类型工具电极的主要研究


    | 研究者 | 工具电极材料 | 工件材料 | 研究因素 | 响应 |

    | :--- | :--- | :--- | :--- | :--- |

    | Srivastava 和 Pandey [18] | Cu-TiC | M2 HSS | 间隙电压、电流、脉冲宽度、占空比 | 使用硬质材料时还记录到圆度下降、MRR
    和表面粗糙度增加。 |

    | Mohari *et al.* [29] | Cu, WC-Co, TiC-Al | 碳钢和铝 | 脉冲宽度、加工时间 | 压坯或烧结产品的较低导电性导致较高的磨耗率。
    |

    | Kumar *et al.* [30] | Cu90-Cr10 | Hastelloy | 电流、电压 | 在 14A 和 60V 时获得最佳表面粗糙度，因为超过这些值
    TWR 会增加。 |

    | Janmanee 和 Muttamara [31] | 石墨、铜-石墨、Cu-W（固态） | 钨硬钴（WC90-Co10） | 通断时间、电流、开路电压
    | 石墨和石墨粉末冶金在 MRR 和 TWR 方面性能更好。 |

    | Li *et al.* [33] | 固铜电极、Cu-SiC | Inconel 718 合钢 | 脉冲宽度、脉冲间隔、电压、电流 | 铜电极，Cu-SiC
    电极的 MRE 增加了 15.12%。 |

    | Hussain *et al.* [34] | Cu-Al[2]O[3] | 高速钢 | 工具中 Al[2]O[3] 百比 | 含有 5% Al[2]O[3]
    的工具表现出最低的磨耗率。 |

    | Mandal 和 mondal [37] | 未涂层 6061Al、单壁碳纳米管涂层 6061Al、涂铜 6061Al | AISI 304 不锈钢 |
    工具成分 | 对于涂铜和单壁碳纳米管涂层 6061Al 电极，结果显示 MRR 分别增加了 3.13% 和 14.52%，EWR 分别降低了 21.04%
    和 29.6%。 |


