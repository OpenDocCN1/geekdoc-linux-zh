    in these methods.


    The major aim of this book is to provide the readers detailed information regarding
    various advances in the field of Non-Conventional machining. In addition to provide
    cutting edge information, the book also describes the level of modern technology
    adopted by various industries.


    Many Authors have contributed their ideas on various aspects of Non-Conventional
    machining processes. The prime focus of all the authors is to provide the latest
    and exact information regarding various topics. In total, nine chapters have been
    contributed to this book that touches various fields of Non-Conventional machining
    such as Abrasive Jet machining, Electrical Discharge Machining, Thermal machining
    *etc.* Keeping in view, the trend of this topic for researchers well cited references
    are given at the end of each chapter for further information of the topic. Relation
    between Non-Conventional machining and Artificial intelligence and their relationship
    with modern industry has also been focused in one of the chapters.


    An attempt has been made to provide quality research data and this book is intended
    both for academia and industry. The former refers to pre & post graduate students
    along with PhD students, who are working on the field of manufacturing while the
    later refers to the industries in which R& D departments are constantly working
    towards the betterment of the machining process to produce sophisticated products.


