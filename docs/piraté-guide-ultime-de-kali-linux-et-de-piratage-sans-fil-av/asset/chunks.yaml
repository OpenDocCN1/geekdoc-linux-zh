    ### b). 24/7 Production


    Human beings are creatures that require routine attention such as care, rest,
    water and food to work limited time in a day. However, for every manufacturing
    unit to work continuously, it is essential to initiate shifts, employing four
    workers round the clock to complete one cycle of 24 hours. The advantages of AI
    robots include no breaks, no fatigue, and regular working hours without interruption.
    Moreover, they are efficient in doing work in the manufacturing unit round the
    clock. This results in the growth of manufacturing facilities, which is gradually
    essential to meet up the requirements of global and local customers. Additionally,
    AI robots are more effective in many fields like an assembly line, selecting,
    picking of items and packaging. As a result, they can significantly slash turn-round
    times in various departments of the manufacturing sector [[18](#9789811483653-C9.html_c9r18)^-[21](#9789811483653-C9.html_c9r21)].


    ### c). Safety


    The humans creatures are questionable and inclined to making botches, particularly
    if they are tired or diverted. Mistakes and mischances do happen on the plant
    floor and in any development or handling environment; a propensity which can be
    all but eliminated by AI and robotics. Inaccessibility get to control implies
    a decrease in human assets, particularly when they work is unsafe or requires
    superhuman exertion. Indeed, customary working situations will cut down on the
    frequency of mechanical mischances and lead to a by and large enhancement in security.
    In expansion, more progressed tangible hardware coordinates with IIoT gadgets
    make the establishment of security watches and obstructions a less difficult and
    more viable degree to ensure human lives [[5](#9789811483653-C9.html_c9r5)].


    ### d). Lower Operational Costs


    Numerous companies are seeing the presentation of AI into the fabricating industry
    with fear because it requires a gigantic capital venture. On the other hand, the
    ROI is critical and increments as time go on. Once intelligent machines start
    to require over the day by day exercises of a production line floor, businesses
    will advantage through impressively decreased working costs, with prescient support
    making a difference moreover to decrease machine downtime. It is getting to be
    easier and cheaper to meet these needs and utilizing AI and ML methods implies
    that the entire generation prepare will be more cost-effective. Joining machine
    learning and CAD implies that frameworks can be planned and tried in a virtual
    demonstrate sometime recently they are put into generation, in this way diminishing
    the fetched of trial-and-error machine testing [[23](#9789811483653-C9.html_c9r23)].


    ### e). Greater Efficiency


    With the help of emerging technologies such as big data analytics processed with
    Ai algorithms the overall trends of an industrial sector can be forecast, patterns
    recognition with training and market developments prediction with time, macroeconomic
    cycles and even weather patterns with the help of machine learning and data analytics.
    AI has the capacity with machine learning to expect data, to refine forms, and
    to track incoherencies, all the way down the supply chain from source to wrapped
    up item. This can be especially supported by such advances as RFID following,
    which empowers materials to be followed without having to go through a physical
    prepare such as a bar code per user [[16](#9789811483653-C9.html_c9r16), [19](#9789811483653-C9.html_c9r19)].


    ### f). Quality Control


    AI robotics is additionally greatly valuable for carrying out prescient maintenance
    on machines, apparatus and other hardware in industries. Furthermore, utilizing
    various sensors with inbuilt AI techniques to track execution and working conditions
    of machines to check, predict all types of failures, and take activity to cure
    them before they happen. This could result in quicker feedback, with reduced downtime
    of the machine. Hence, it results in overall efficiency and productivity. They
    can also identify the nano or microscopic faults, examining them at resolutions
    far beyond the capability of normal individual imagination, consequently enhancing
    productivity and boosting the number of products that will by-pass quality checking
    and control department. AI-enabled robotics makes a big difference to pace up
    several plan models and makes advances precision to a massive scale. This prevents
    the requirement for quality control and in-process assessment by human creatures,
    which is time-consuming and frequently fallible [[22](#9789811483653-C9.html_c9r22),
    [23](#9789811483653-C9.html_c9r23)].


    ### g). Quick Decision Making


    AI robotics can offer quick decision making in the manufacturing sector by computerizing
    complex tasks that would take the only nanosecond. Whereas, it takes too much
    time with human help. It can moreover see information more deeply and at information
    to discover patterns that people may never capture. The utilize of manufactured
    insights in decision-making must fit workflows and designs that make sense for
    clients. AI incorporates the computerization of cognitive and physical assignments.
    It makes a difference individual perform tasks quicker and way better and make
    superior choices. It empowers the robotization of choice-making without human
    intercession. AI can improve robotization in this way decreasing seriously human
    labor and repetitive tasks [[16](#9789811483653-C9.html_c9r16)^-[18](#9789811483653-C9.html_c9r18)].
    Therefore, there are numerous more ways in which AI is making a distinction. The
    detail of decision making or another task by AI has been illustrated in Table
    [1]](#9789811483653-C9.html_c9t1).


    Table 1 **AI decision making with description and examples.**


    | **Type of Decision** | **Description** | **Examples** |

    | --- | --- | --- |

    | Classification | Categorize as good or bad | Potential borrower likely to charge-off,
    the customer likely to be lost, object in the image likely to be a cat, *etc.*
    |

    | Grouping | Detect natural grouping of customers | The Segmentation of customers
    into the clusters |

    | Association | Find meaningful correlations between various entities | Suggest
    the next best product or offer based on other related customers |

    | Prediction | Predict the future price of a continuous quantity | Forecast deals,
    forecast price of customers over the lifetime |

    | Natural Language Processing | Identify structure, recognize entities, extract
    meaning | Translation, generate summary from details, identify entities and their
    relationships |

    | Visual Perception | Identify objects in an image or video, generate the 3D world
    | Understand edges, texture, objects. Reconstruct 3D world, detect anomalies |

    | Robotics | Manipulate objects in the real world | Mobile manipulators such as
    self-driving cars, assembly line part picking robots |

