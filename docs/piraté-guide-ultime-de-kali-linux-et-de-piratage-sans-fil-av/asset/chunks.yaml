    Goswami and Chakraborty utilized two techniques for parametric optimization of
    ultrasonic machining processes. These were gravitational research and firework
    logarithm. Authors developed the best optimal results like high material rate
    as compared to gravitational research [[18](#9789811483653-C1.html_c1r18)].


    Agarwal investigated the ultrasonic machining of glass material. The study focused
    on mechanisms of material removal and material removal rate. It showed that as
    grit size increases, material removal rate also increases. The shocking force
    and material removal rate relation was developed. The analysis represented that
    increasing static load amplitude of tool tip, the material removal rate can be
    increased. On the other side, with increase in grit size, material removal rate
    was reduced because debris of the workpiece did not allow the tool to vibrate.
    Study revealed that proper controlling parameters can improve material removal
    rate only [[19](#9789811483653-C1.html_c1r19)].


    Ning discussed the importance of CFRP composites used in aerospace and aircraft
    industries due to its superior properties. The two drilling methods were compared,
    rotary ultrasonic machining and grinding. The cutting parameters like cutting
    forces, surface finish, torque, hole diameter and material removal rate were taken
    into consideration in the study. The comparison showed that rotary ultrasonic
    machining performed better in drilling of CFRP than grinding [[20](#9789811483653-C1.html_c1r20)].


    Wang *et al.* studied the problem of tearing defects at hole exit during drilling
    a hole in C/Sic composite material. The new tool was developed and compared with
    common drill. The result at hole exit was better with using compound step-taper
    drill. Problem of tearing defects got reduced due to using this drill. The following
    machining parameters were maintained like a feed rate of 2 mm/min. and spindle
    speed of 2000 rpm. The results showed that tearing size reduced up to 30% using
    compound step-taper drill. Defects produced during exit after drilling were burr,
    edge chipping *etc* [[21](#9789811483653-C1.html_c1r21)].


    Aminiet *et al.* studied tribological properties during ultrasonic vibration assisted
    turning process. The cutting parameters like friction coefficient and wear rate
    were considered for evaluation. ANOVA results indicated that effectiveness of
    32.32% was observed in respect of friction coefficient [[22](#9789811483653-C1.html_c1r22)].


    Singh and Singhal reviewed the non-conventional hybrid machining process *i.e*.
    rotary ultrasonic machining. As in static ultrasonic machining, abrasive particles
    insert between tool and workpiece continuously during machining. The vibrating
    tool strikes on the workpiece and material removal take place. In this process,
    there was no direct contact between tool and workpiece. So, lesser material removal
    took place. The result of machining was not as per specifications. Due to which
    defects produced in drilling such as oversized holes, eccentric holes and erosion
    of wall surfaces *etc.* in rotary ultrasonic machining, conventional diamond grinding
    and ultrasonic machining combined together. Hence higher material removal rate
    produced as compared to conventional grinding and ultrasonic machining. In rotary
    ultrasonic machining, rotation was given to vibrating drilling tools and abrasive
    particles of diamond merged on tool tip during drilling operation. This process
    gave higher material removal, improved surface roughness and accuracy of machined
    holes than conventional grinding and static ultrasonic machining [[23](#9789811483653-C1.html_c1r23)].


    Zhen *et al.* carried out research on ceramic matrix composites. In the study,
    it was observed that rotary ultrasonic machining increased the efficiency of machining
    5.8 times more and surface quality improved by 54% as compared to conventional
    milling [[24](#9789811483653-C1.html_c1r24)].


    Ning *et al.* presented the comparison between rotary ultrasonic surface machining
    and conventional surface grinding of CFRP composite material. The kinematics motion
    of abrasive particles was studied, and its comparison was also carried out. During
    analysis of kinematic motion of abrasive particles, it was assumed that abrasive
    particles are spherical in shape with the same diameter. The shape remains the
    same during machining. The experiment results indicated that rotary ultrasonic
    surface machining produced lower values of infeed cutting forces, axial cutting
    force and also torque. Rotary ultrasonic surface machining besides this gave larger
    surface roughness as compared to conventional surface grinding. The reason for
    this was vertically ultrasonic vibration [[25](#9789811483653-C1.html_c1r25)].


    Feng *et al.* discussed the tearing defect at hole exit during drilling. The experiment
    showed that the defect was due to large thrust forces. Rotary ultrasonic machining
    reduces the thrust force and 60% reduction has been observed in tearing defects.
    Experiment results indicated that it reduces the thrust force approximately 55%
    in the study. The grain size has much more influence on thrust force and it was
    decreasing up to some extent [[26](#9789811483653-C1.html_c1r26)].


    Wang *et al.* studied the tool wear mechanism and its relation to material removal
    rate. In the trial, three different material tools are used, named 304 stainless
    steel, 1045 carbon steel and tungsten. The influence of tool wear shows low MRR
    and inaccuracy in machining. During machining, it was observed that 304 stainless
    steel tools are best for micro USM. The tool wear and abrasive particle wear was
    low which helps to remove more material. The 304 stainless steel tool has low
    internal surface hardness as compared to external surface. The combined surface
    material (soft & hard) gave insurance of low tool wear and particle wear [[27](#9789811483653-C1.html_c1r27)].


    Wang *et al.* studied the potential of ultrasonic machining and investigated on
    the shape of abrasive particles. In the research, two different shaped abrasive
    particles were taken. The shapes were cubicle and spherical which were filled
    with silicon carbide and aluminum oxide. The result suggested that hard abrasive
    particles with spherical shape (`Al[2]O[3]`) resisted the tool wear in a nice
    way as shown in Fig. (`1`](#9789811483653-C1.html_c1f1)). This improves the material
    removal efficiency during ultrasonic machining and also its performance [[28](#9789811483653-C1.html_c1r28)].


    ![](Images/9789811483653-C1_F1.jpg)**Fig. (1))**


    Trend of tool wear rate with different abrasive particles used during drilling.


    Wang *et al.* presented the cutting force and material removal mechanism in rotary
    ultrasonic machining. The defect produced drilling briefed like edge chipping,
    tearing defect and subsurface damage. The damage reduction technique and optimization
    of processing parameters were also described. During machining, damages was produced
    at hole exit. This could be reduced if cutting forces were less than critical
    cutting forces. By optimizing process parameters, damage during machining can
    be reduced [[29](#9789811483653-C1.html_c1r29)].


    Wang *et al.* investigated the critical cutting forces in rotary ultrasonic machining.
    The cutting forces were analyzed to develop a novel index which was required for
    design and manufacturing of an ultrasonic machine tool. In the paper, the effect
    of cutting force was analysed on processing parameters and ultrasonic amplitude.
    Also, critical cutting forces effect on rotary ultrasonic m/c tools were analysed
    & method of improvement discussed [[30](#9789811483653-C1.html_c1r30)].

