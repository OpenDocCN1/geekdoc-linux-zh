    激光束及其相关工艺的汇编或快速回顾见表 3。


    本综述为我们开展激光束加工领域开展进一步的研究提供了基础。


    在文献综述期间，观察到大多数研究人员在实验中使用了 `Nd: YAG` 激光进行加工。因此，在不久的将来，研究其他类型的激光可以成为进一步研究的课题。


    ### Nd: YAG 激光概述


    其缩写为“`掺钕钇铝石石榴`”。这是一种强固体激光器。它用于轻型作业。可以轻松地加工高反射率和电电质材料。通过脉冲模式，它可以加工更厚的材料。这是一种紧凑且可靠的激光。这种激光在脉冲模式下运行时具有低平均光功率但高能量密度。它在激光束加工过程中用作激光介质。工艺的示意图见图
    (3)。


    ![](img/9789811483653-C3_F3.jpg)**图 (3)**


    `Nd: YAG` 激光束切割工艺示意图 [12]。表 3 激光束加工和激光辅助工艺的汇编 [22]。


    | 作者 | 工艺 | 工作材料 | 考虑的重要输入变量 | 优化技术 | 备注 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | Pham 等人* (2007) | 激光铣工艺 | 氧化铝材料和氮化硅陶瓷 | 扫描速度、脉冲强度、灯管电流 | 单因素实验 | 建议对于任何采用 1064
    纳米波长进行激光铣削的机器：应提供一个玻璃支撑板以重新定位工件。 |

    | Dube• 等人* (2008) | 激光钻孔-微钻 | 复合材料、陶瓷和合金 | 激光、材料和工艺参数 | DOE, Taguchi | YAG 激光适用于创建直径高达
    5 微米的微孔 _ |

    | Allman- 等人* (2015) | 激光微钻孔 | 镍钛合金 | 灯管电流、脉冲频率、脉冲宽度、气压 | 混合工艺 | 通过混合工艺（激光和微电火加工）：加工时间缩短且表面质量（RR）增加
    |

    | Wang 等人* (2016) | 激光钻孔工艺 | 陶瓷 | 脉冲宽度、能量密度和重复频率 | ANSYS 和 COMSOL 方法 | 建议由于冷却和蒸发过程，液体辅助加工在激光钻孔中效果良好
    |

    | Dutt 等人.* (2018) | 激光钻孔工艺 | 复合材料、陶瓷和超合金 |调调、峰值功率、脉冲时间、脉冲频率、脉冲数和气体压力 | 基于人工智能的方法
    (`ANN`: 遗传算法) | 脉冲 `Nd: Y..A.G` 激光束钻孔由于具有更好的聚焦特性而快速增加 |


    ### 结论


    1. 激光束加工用于在工件上制造复杂轮廓、钻出不同尺寸的孔（直径达 5 微米的微孔）以及切割厚达 4 微米的薄箔。

    2. 激光的性能取决于三个参数。这些是工艺参数、激光参数和材料参数。

    3. 激光混合加工工艺比单一非传统加工产生了更好的结果。

    4. 在传统和非传统加工过程中都使用了冷却剂。由于在机器上持续使用，冷却剂对环境和操作人员具有毒性。但由于缺少冷却剂，激光辅助加工是一种环保工艺。

    5. 激光辅助加工优于传统加工。此外，它可以用于提高传统方法难以加工材料的加工效率。

    6. 得结论是，使用 `Nd: YAG` 激光，在湿水静态水模式下通过激光束加工 `Inconel 718` 超合金，在保持尺寸、无毛刺表面和重熔层方面获得了最佳结果。

    7. 还得出结论，使用脉冲 `Nd: YAG` 激光束钻孔可以轻松钻硬硬材料。这种工艺在实践和理论上都可以成功地用于复合材料。这种激光的应用正在不断增加。


    ### 激光束加工研究的未来范围


    不适用。


