    Takale 和 Chougle [20] 提到 `Ti49.4Ni50.6` 形状记忆合金具有低杨氏模量，非常适合新型骨科植入物。然而，`Ti-Ni` 在采用传统方法加工时，表面质量差且尺寸精度低。因此，`WEDM`
    可以作为加工 `Ti-Ni` 形状记忆合金以实现高尺寸精度的替代方案。本文研究了不同 `WEDM` 输入参数对 `Ti-Ni` 合金 `MRR` 和 `SR`
    的影响。选定的输入参数包括 `pulse on time`、`pulse off time`、`spark gap set voltage`、`wire feed`
    和 `wire tension`。采用 `GRA` 进行多目标优化。为了研究加工表面的金相变化，执行了 `EDS` 分析。


    Singh 和 Misra [21] 研究了不同输入变量下 `WEDM` 加工 `nimonic 263` 的情况。实验设计基于 `Box-Behnken
    design technique`，并使用 `response surface methodology` 对表面粗糙度进行了参数优化。`BPNN` 的结果显示
    `BPNN` 是预测响应的有效工具。通过 `FE-SEM` 发现 `WEDMed` 表面包含裂纹、坑、球形液滴和碎片颗粒。


    Pramanik 和 Basak [22] 展示了输入参数对 `Ti-6Al-4V` 合金在 `wire EDM` 加工过程中疲劳寿命、`crack propagation`、`surface
    roughness` 和加工的影响。考虑了加工参数 `pulse on time`、`pulse off time` 和 `wire tension`，并使用
    `SEM` 观察了这些参数对 `surface-integritry` 的影响。观察到影响疲劳性能的主要因素是 `recast layer` 和 `HAZ`
    的性质和程度。


    Kavimani *et al.* [23] 使用 `Taguchi coupled grey relation analysis` 研究了还原氧化石墨烯增强镁基金属复合材料的
    `WEDM` 切割参数。应用 `L27 orthogonal array` 设计实验，并通过应用 `ANOVA` 确认了结果。确定对于 `MRR` 和 `SR`
    而言，`reinforcement weight percentage` 和 `pulse on time` 是比 `pulse off time` 和 `wire
    feed rate` 等其他输入参数影响最大的参数。


    Chu *et al.* [24] 讨论了一种用于高速 `WEDM` 金属板上产生 `microgroove` 的新型可行 `low frequency vibration
    assisted technique`。`ridge width` 受 `average current`、`vibration frequency` 和
    `feed rate` 的显著影响。然而，与传统的 `WEDM` 工艺相比，`low frequency vibration assisted WEDM`
    可以产生更小的 `microgroove` 结构和更高的加工效率。


    Rajkumar *et al.* [25] 了 `Wire electric discharge machining` 加工 `nano alumina
    particle` 增强的 `aluminium metal matrix composites`。发现 `Voltage` 和 `pulse on time`
    是实现更高 `MRR` 的责任输入参数。此外，`controlled pulse durations` 通过减少加工缺陷改善了表面完整性。


    Zhang *et al.* [26] 使用 `SEM` 分析了 `thin wall` 的 `WEDM` 以表征 `power-consumption`。在
    `WEDM` 期间观察了 `SEM` 的 `surface-quality` 和 `thermal-deformation`。发现 `wire` 可以减少能量消耗。


    Sharma *et al.* [27] 使用 `Taguchi` 优化了 `shape memory alloy` `WEDM` 的输入变量。在其他输入变量中，`pulse
    on time` 导致更高的 `MRR`。


    Smirnov *et al.* [28] 使用 `SPS` 执行了 `composites` 的 `WEDM`。发现 `wire` 可以减少能量消耗。


    Zhou *et al.* [29] 使用 `RSM` 讨论了 `composites` 的 `WEDM`。发现 `wire` 可以减少能量消耗。


    Pramanik 和 Basak [30] 研究了 `WEDM` 加工 `AISI 304` 时电线张力的影响。注意到 `wire tension` 对 `kerf
    width` 没有影响，但会影响 `MRR` 和 `SR`。


    Thankachan *et al.* [31] 使用 `Taguchi` 对 `alloys` 进行了 `WEDM`。发现 `wire` 可以减少能量消耗。


    Nain *et al.* [32] 使用 `artificial neural network` 对 `alloys` 进行了 `WEDM`。预测了 `MRR`
    和 `Surface Roughness`。


    Chaudhary *et al.* [33] 使用 `SEM` 和 `EDS` 研究了 `super alloy` 的 `WEDM`。`wire tension`
    影响 `MRR` 和 `micro-hardness`。


    Gaitonde *et al.* [34] 使用 `RSM` 和 `differential evolution` 讨论了 `HCHr steel` 的
    `WEDM`。发现 `MRR` 更。


    Goyal [35] 使用 `normal and cryogenic zinc coated wires` 代表了 `Inconel 625` 的 `WEDM`
    研究。发现 `MRR` 和 `SR` 受 `pulse on time`、`tool electrode` 和 `current intensity` 的影响。


    Mouralova *et al.* [36] 使用 `SEM` 和 `contact less 3D profilometer` 区分了 `WEDM` 结构材料表面。


    Arikatla *et al.* [37] 在加工 `Ti-6Al-4V alloy` 时使用 `RSM` 讨论了 `WEDM` 过程的参数优化。`wire
    tension` 和 `servo voltage` 对 `surface roughness` 有很大影响。

