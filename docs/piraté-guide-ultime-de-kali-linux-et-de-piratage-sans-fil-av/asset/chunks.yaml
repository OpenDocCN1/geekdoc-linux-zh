    ## Abstract


    EDM is the non-conventional process that has used, extensively, for cutting harder
    like nickel and its alloys, titanium and complex shape materials which are difficult
    to machine by other conventional processes. EDM utilizes, electrical and heat,
    energy to machine the workpiece by removing the undesirable material. This process
    use two electrodes, anode and cathode out of which tool act as cathode and the
    workpiece on which the job is being performed act as anode. Various factors like
    current, pulse on and off time, voltage applied can be used to optimize the major
    machining parameters of EDM like `MRR`, rate of tool wear, surface roughness `etc.`
    the main focus of this study these parameters on composite materials made of `CMs`,
    tungsten and cobalt carbides `etc.` In the end future prospective of the areas
    which require further improvements and investigations has also been discussed.


    **Keywords:** Ceramic, Composite materials, Electrical discharge machining.


    ***


    ^* **Corresponding author Mamta**: Department of Mechanical Engineering, Maharaja
    Agrasen University, Baddi, Solan, India; E-mail: [dahiya.mamta56@gmail.com](mailto:dahiya.mamta56@gmail.com)


    ## INTRODUCTION


    Electro discharge machining (`EDM`) is a prevailing manufacturing process that
    is used for the machining of metals. In this process the machining take place
    in the form of melting and evaporation of all materials that are electrically
    conductive in nature which occur by controlling the spark between the electrode
    and the work piece on which the operation is being performed [[1](#9789811483653-C6.html_c6r1),
    [2](#9789811483653-C6.html_c6r2)]. This is the reason EDM is also known as nonconventional
    spark eroded thermo- electric machining process [[3](#9789811483653-C6.html_c6r3)].
    Over a course of period EDM has emerged as an efficient process for removal of
    the materials. EDM holds the capacity of machining very complex and hard materials,
    that too with high precision which are otherwise difficult to machine with other
    conventional methods.


    To fall on the footsteps of modern manufacturing industry, EDM also possess the
    capability of being an automated process. EDM finds its major application in the
    manufacturing of prototypes, in mold and die making sectors and in the industries
    which are mostly indulged in the making of machined metals such as high alloyed
    steels.


    Past couple of decades, ceramic materials (`CMs`) have marked their presence by
    their application in all major engineering sectors like automobile, airspace,
    sectors involving manufacturing of electrical and electronic equipment [[4](#9789811483653-C6.html_c6r4)].
    Some major applications like fabrication of the ballistic armors, braking system
    of automobiles, particulate filters for diesel, memory components of computers,
    sensors and various medical products like prosthetic body limbs `etc.` also involve
    the use of CMs [[5](#9789811483653-C6.html_c6r5)]. The reason for so much wider
    applications of CMs are, its excellent mechanical properties such as high compressive
    strength, high hardness, chemical and abrasive resistance.


    `WC–Cos` were also explored for machining by EDM. A special CIRP reported used
    of EDM in cemented carbide too [[6](#9789811483653-C6.html_c6r6)]. Although, it
    is reported that EDM surfaces do have residual thermal stress [[7](#9789811483653-C6.html_c6r7)].
    group from


    ## PRINCIPLE OF EDM


    In EDM, the removal of the material is obtained by controlling the electrical
    discharges between the two electrodes out of which one electrode is the tool and
    the other one is the work piece on which the job is being performed as shown in
    Fig. ([1`](#9789811483653-C6.html_c6f1)).


    ![](Images/9789811483653-C6_F1.jpg)**Fig. (1))**


    Principle of EDM process [[8](#9789811483653-C6.html_c6r8)].


    Both the electrodes are separated by a certain dielectric medium which may be
    either dielectric oil or deionised water. Then the voltage is applied thus forming
    a plasma channel that can establish a flow of the current. When the breakdown
    in voltage medium is reached a discharge takes place. As the process of EDM is
    based on the removal of material by melting and evaporation therefore when the
    temperature at the base of the formed channel reached to approximately ≥ 10,000°K,
    the melting and evaporating of the second electrode (workpiece) takes place thus
    resulting in the removal of material.


    ## ELECTRICAL DISCHARGE MACHINING OF CERAMICS


    CMs, like titanium diboride (`TiB[2]`), silicon doped silicon carbide (`SiSiC`)
    and titanium nitride (`TiN`), are electrically conductive in nature and can be
    machined by EDM [[9](#9789811483653-C6.html_c6r9)]. According to Luis *et al.*
    [[10](#9789811483653-C6.html_c6r10)] the materials which are obtained from inorganic
    materials, generally having the purity of high grade, are referred as ceramics
    or advanced CMs. These CMs are further classified into oxide ceramics like `Al[2]O[3]`
    or `ZrO[2]` and non-oxide ceramics like `Si[3]N[4]`.


    The machining of CMs with the process of EDM can also be classified into natural
    materials, non-conductive materials and conductive materials. Mostly the conductive
    materials are made from impure materials by introducing some conductive secondary
    phases (Fig. [2`](#9789811483653-C6.html_c6f2)).


    ![](Images/9789811483653-C6_F2.jpg)**Fig. (2))**


    Ceramic materials based on their Conductivity [[11](#9789811483653-C6.html_c6r11)].


    Adding these phases to the CMs increases the electrical conductivity. Some improvement
    in the hardness, strength and fracture toughness is reported too by adding these
    [[12](#9789811483653-C6.html_c6r12), [13](#9789811483653-C6.html_c6r13)].


    ## MECHANISM OF MATERIAL REMOVAL IN COMPOSITE CERAMICS


    Lauwers *et al.* [[13](#9789811483653-C6.html_c6r13)] conducted a study to develop
    CMs which were wear resistant and also able to machine by the process of EDM.
    The main focus of this study was to investigate the relation between the parameters
    of EDM process and the microstructure of the CMs. For `ZrO[2]`, `Al[2]O[3]` and
    `Si[3]N[4]` based CMs were taken and to these materials, some phases of electrical
    conductivity were induced by `TiCn` and `TiN`. In the results, it was observed
    that not only melting and evaporation but other factors like oxidation and base
    material decomposition are responsible for effective removal of the material.
    Also it was started that the formations of the crack during the process were resulted
    due to the spalling effect. The main mechanisms for removal of material are presented
    in Table [1`](#9789811483653-C6.html_c6t1)


    Material removal of different composite CMs [[13](#9789811483653-C6.html_c6r13)].**

