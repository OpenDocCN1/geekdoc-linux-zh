    # Tool Electrode Material and Tool Fabrication Techniques for Electrical Discharge
    Machining Process


    Arminder Singh Walia, Vineet Srivastava, Vivek Jain, Amit Handa


    ¹ Mechanical Engineering Department, Thapar Institute of Engineering & Technology,
    Patiala-147004, Punjab, India

    ² Mechanical Engineering Department, I.K. Gujral Punjab technical University,
    Kapurthala-144603, Punjab, India


    ## Abstract


    Electrical discharge machining is an advanced machining process used in the machining
    of hard materials and in die manufacturing industry. The main cost component in
    electrical discharge machining is the cost of the tool electrode. The conventionally
    used electrode material like copper and graphite has very low wear resistance,
    hence, wear out fast. Continuous efforts are being made to find electrode materials
    which have optimum value of electrical conductivity, thermal conductivity and
    wear resistance. Composites of various combinations of material have been tried
    in search of alternative tool materials. The current study presents a review of
    different materials utilized for the manufacturing of composite electrodes for
    electrical discharge machining and their fabrication techniques. It has been observed
    that among the different electrode fabrication techniques available, powder metallurgy
    has shown very promising results.


    **Keywords:** Composite, Electrical discharge machining, Electrode wear rate,
    Material removal rate, Powder metallurgy, Rapid prototyping.


    ***


    **Corresponding author Arminder Singh Walia:** Mechanical Engineering Department,
    Thapar Institute of Engineering & Technology, Patiala-147004, Punjab, India; E-mail:
    arminderwalia@gmail.com


    ## INTRODUCTION


    In 21^(st) century, products are started to be made from the most durable and
    consequently, the most difficult to machine materials. The continued development
    of modern structures needs materials able of combating increasing working temperatures,
    mechanical loads, mechanical distortions and chemical deterioration. It is the
    need of industry to generate complex shapes of components with very tight tolerances
    and fine surface finish.


    To meet these requirements, advanced machining processes like ultrasonic machining
    (USM), abrasive jet machining (AJM), electrochemical machining (ECM), electron
    beam machining (EBM), laser beam machining (LBM), electrical discharge machining
    (EDM) have been developed. These methods have very key role in the tool, die,
    aircraft, automobile and mould making industries.


    Abrasive water jet machining has higher material removal rate, no thermal stresses
    are produced on the machined surface and is also very cost friendly process. However,
    this process is unable to cut the thick parts and complex profiles. The quality
    of surface produced by this process is also poor. Chemical machining is good for
    the machining of thin parts and requires very less equipment. In this process
    no residual stresses are produced. However, handling and disposal of used chemicals
    enhance the machining cost of this process. The parts produced by laser machining
    suffer the heat effect from laser which causes the brittleness of machined surface
    and leads to surface cracks. In ultrasonic machining the quality of machined surface
    is better than most of other modern machining process. Though, lesser material
    removal rate and cost incompetence are the drawback of this process. Electro chemical
    machining is a very precise process for producing complex shapes, though, the
    lower material removal rate and handling of chemical makes it unfavorable in some
    cases.


    Thermoelectric energy is very useful in economic machining of low machinability
    materials and jobs with complex geometries. Electrical discharge machining is
    one of the many modern machining processes in which the material is removed by
    the thermal principles. Out of the various advanced machining processes, EDM has
    been widely used to produce surgical components, dies and moulds and finishing
    parts for automotive and aerospace industry. Wire EDM and die sinking EDM are
    often used electric discharge machining techniques.


    ## PHYSICS OF EDM


    The die sinking EDM process is shown in Fig. (1). The EDM process can be divided
    into following phases:


    * Cold emission of electrons and dielectric breakdown

    * Spark formation, melting and evaporation

    * Collapse of plasma channel and flushing


    ![](Images/9789811483653-C2_F1.jpg) **Fig. (1)**


    Die sinking EDM process.


    ### Cold Emission of Electrons and Dielectric Breakdown


    A potential difference is supplied between electrically conductive tool electrode
    and work electrode. This potential difference creates an electric field between
    the two electrodes. It depends on the inter electrode gap and dielectric constant
    of the dielectric fluid present in between the two electrodes. The electrically
    conductive materials have enough number of free electrons. As the electric field
    is established, due to presence of electric field, the free electrons will start
    to get plucked from the tool (negative). The electron will be discharged in large
    number. This is called “Cold emission of electrons”. In the presence of electric
    field, the electrons will accelerate towards the work as the tool is negative
    and workpiece is positive. The gap between these two electrodes is filled with
    dielectric medium. Due to presence of dielectric, no free path will be available
    for the electrons, hence, will face hindrance. The moving electrons will collide
    with the dielectric particles. The energy of the electrons will ionize the dielectric
    molecules. This will result in more ions as well as more electrons.


