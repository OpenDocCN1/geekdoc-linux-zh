    ## 引言


    人工智能（AI）是一项强调形成智能和智慧机器的技术，这些机器像个人一样工作和做出反应。能够完成观察、学习、决策、推理和解决问题等智力角机器或智能计算机被称为人工智能计算机或机器。而机器人技术是人工智能中的一个领域，从事于使用深度学习技术创建智能和智慧的机器人。机器人技术是人工智能的一个领域，它涵盖了所有工程领域，如机械、电气和计算机工程，用于基于人工智能的人的规划、设计、组装、开发和应用，如图([1])所示。


    ![](img/9789811483653-C9_F1.jpg) **图 (1))**


    韦恩图表示的人工智能机器人。


    存在实时工作的智能机器[[1], [4], [6]]。它们的作用是通过检测、累积、移动、修改对象的基本属性、损坏对象或产生智能影响来监控对象，从而将劳动力从单调、不疲倦或不受扰的工作中释放出来。人工智能机器人具有先进的机械结构，旨在以高灵敏度和准确性完成任务，如图([1])所示。它还包含为机器人机械结构提供动力控制的电气模块。此外，它包含了一些高级软件编程，用于管理机器人如何同时执行多项任务。人工智能和机器人技术是智能机器和机器人为完成任务展现出的智能，这些任务通常涉及智能、人类知识和学习技能，例如感知、学习、推理、解决问题、决策可视化等。新兴技术包含各种子集技术，如机器学习和深度学习，这些技术随着时间的推移和数据的不断增加而被学习，如图([2])所示。


    ![](img/9789811483653-C9_F2.jpg) **图 (2))**


    人工智能及其领域的表示。


