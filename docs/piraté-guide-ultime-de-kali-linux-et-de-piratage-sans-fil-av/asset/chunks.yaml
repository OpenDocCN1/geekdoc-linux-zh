    Siddiqui and Ramkumar [[38](#9789811483653-C7.html_c7r38)] suggested that magnesium
    which is an important material in biodegradable orthopedic implants applications
    can be machined in micro size complex shapes in `micro-WEDM`. `AZ31 Mg` alloy
    was selected to execute the experiments to set the relationship between various
    input parameters of `micro WEDM`. For optimum conditions, it was desirable to
    have medium voltage and high capacitance for high `MRR`.


    Liu *et al.* [[39](#9789811483653-C7.html_c7r39)] described the machining of `Nithinol`
    shape memory alloy in `WEDM`. Experiment was conducted to identify the effect
    of process parameters on the crystallography, composition and properties of `white
    layer`. `TEM`, `X ray Diffraction` and `EBSD` were used to characterize the properties
    of `white layer` on machined surface. In comparison to bulk material, the `White
    layer` showed higher nano-hardness due to oxide hardening.


    Manjaiah *et al.* [[40](#9789811483653-C7.html_c7r40)] studied the effect of wire
    electrode material during machining of titanium shape memory alloy in `WEDM`.
    `Brass` and `Zinc Coated` wires were used for the study. It was concluded that
    `pulse on time`, `pulse off time` were most impactful parameters along-with `servo
    voltage` in optimizing conditions for enhancing `MRR` and `SR` of machined material.


    Sun *et al.* [[41](#9789811483653-C7.html_c7r41)] discussed the characteristics
    of micro milling helical and corrugated micro end mill in low speed wire electric
    discharge machining. The design and mathematical simulation of wire electrode
    trajectory were carried out and effects of machining parameters on helical end
    mills were elucidated.


    ### Table 3: Review on WEDM.


    | S.No. | Author | Optimization Technique | Work Material | Input Parameter |
    Outcomes |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 1. | Shakeri *et al.* [[42](#9789811483653-C7.html_c7r42)] | ANN | Cementation
    alloy steel | Pulse Current, A (8-16). Frequency, kHz (40-60). Wire Speed, m/min
    (8-12). Servo speed, mm/min (4-8) | Increase in wire speed, pulse current and
    frequency leads to high `MRR` |

    | 2. | Goyal *et al.* [[43](#9789811483653-C7.html_c7r43)] | ANN, RSM, SEM | `Ni[49]Ti[51]`
    | Current, A (4-8). Pulse on Time, µs (60-120). Pulse off time, µs (15-45). Wire
    tension, cm²/gm (11-15). Wire feed rate, m/min (4-8) | Increased Pulse on time
    and Current increases `MRR` |

    | 3. | Suthan and Muralidharan [[44](#9789811483653-C7.html_c7r44)] | Taguchi
    | 316L | Pulse on Time, µs (30-32). Pulse off time, µs (5-7). Gap, mm/min (50-700)
    | Higher Pulse on time results in Higher `MRR` |

    | 4. | Liao *et al.* [[45](#9789811483653-C7.html_c7r45)] | Taguchi quality design,
    ANOVA and F-test | Alloy | Pulse generating circuit, (ac, dc). Conductivity of
    dielectric, (15-45). Capacitance, C (0-20). App. Voltage, V (100-150). Feed rate
    of the table, mm/min (2-4). Pulse off time, microsec (4-8). Resistance in circuit,
    ohm (25-75). | Pulse generating circuit, Voltage and resistance in circuit had
    significant effect on surface roughness |

    | 5. | Padmavathi *et al.* [[46](#9789811483653-C7.html_c7r46)] | Taguchi Robust
    design approach | AISI 316 Stainless steel | Pulse on Time, µs (1-10). Pulse off
    time, µs (1-10). Peak Current, A (0-30) Wire tension, cm²/gm (200-1500). Wire
    feed rate, m/min (0-10) | Peak current and Pulse on Time had significant effect
    on both `MRR` and `SR` |


    Ishfaq *et al.* [[47](#9789811483653-C7.html_c7r47)] examined process parameters
    of `WEDM` for machining of stainless clad steel. Machining of cladded material
    is very challenging as of their heterogeneous properties. `WEDM` of cladded steel
    provide better surface finish in comparison to other processes such as gas cutting
    and plasma arc cutting specifically used to cut these materials. However, the
    low cutting speed is a limitation of using `WEDM`. Experiments were designed based
    on Taguchi method to optimize cutting speed. It was seen that individual layer
    thickness of cladded material had crucial part to control the machining rate of
    `WEDM`. Babu *et al.* [[48](#9789811483653-C7.html_c7r48)] investigated the parametric
    optimization of hypereutectic Al-Si alloy in `WEDM`. For experimentation, different
    input controlling factors were selected including pulse on time and variation
    of silicon percentage. `GRA` and principal component analysis were implemented
    for multi objective optimization. `PCA` was found better in performing the task
    in comparison to `GRA`.


    Periyanan *et al.* [[49](#9789811483653-C7.html_c7r49)] described the utilization
    of `micro-WEDM` in machining intricate and accurate 3D structural micro parts
    and micro tools. Taguchi was employed to optimize the input variables of `micro-WEDM`
    for enhancing `MRR`. Results showed that feed rate, capacitance and voltage were
    most affecting parameters on `MRR`.


    Giridharan and Samuel [[50](#9789811483653-C7.html_c7r50)] conducted the experiment
    on AISI 4340 steel in `WEDT` to improve its erosion rate. Newer method was adopted
    to measure the carter depth and better results were obtained. The stochastic erosion
    mechanism was investigated with `SEM`. Table [3](#9789811483653-C7.html_c7t3)
    shows a review on `WEDM` from various studies.


    ## FUTURE PROSPECTS OF WEDM


    Frequent wire ruptures make `WEDM` less efficient and degrade machining quality.
    Thus, reducing wire rupture for better dimensional accuracy and efficiency will
    remain a key research area.


    Titanium alloys have vast application. Their machining is still a challenge as
    these alloys are hard to machine into intricate shapes. Process parameters of
    `WEDM` can be optimized to cut titanium alloys in order to reduce manufacturing
    cost and time.


    Machining efficiency of `WEDM` for titanium alloys should be enhanced. However,
    existing wire materials have failed in these regards. Therefore, new wire electrode
    materials with integration of new core and coating material are required.


    ## CONCLUSION


    After a thorough study of `WEDM` literature, it can be concluded that titanium
    alloys are very useful in the area of biomedical, aerospace and micro tool manufacturing.
    These alloys can be machined with intricate shapes smoothly and inexpensively
    with `WEDM`. It has been observed that input variables have significant effect
    on performance measures, so it become of paramount importance to optimize the
    parameters to achieve high dimensional accuracy and high repeatability. Optimization
    techniques such as Taguchi, RSM, Fuzzy, algorithm and ANN based on mathematical
    models can be employed for such investigation for various titanium alloy machining
    in `WEDM`. Moreover, with the application of `SEM`, `TEM` and `XRD`, surface integrity,
    composition and defects in machined materials can be evaluated and studied.


    ## CONSENT FOR PUBLICATION


    Not applicable.


