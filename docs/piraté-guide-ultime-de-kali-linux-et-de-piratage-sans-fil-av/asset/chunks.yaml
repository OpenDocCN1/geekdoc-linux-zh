- fmt: '

    In the earlier sections, it is witnessed that AJM has found its various applications
    across various materials with ductile and brittle materials along with various
    process parameters. Along with this, a recently found type of erosion is also
    seen which is named as ‘elastic erosion’. Overall, the material removal mechanism
    (`MRM`) depicts the machine efficiency. As in brittle material, abrasive strikes
    the machine surface and creates a crack normal to the surface in downward direction,
    thus leading to an oblique crack at the bottom of the deformed material section
    area extending parallel to the top side. Here the chipped part is assumed to be
    hemispherical having depth or radius equal to crack created by single abrasive
    strike. Various studies have been done correlating the radius of chip produced
    depending on the toughness, hardness and viscoelasticity of the material, geometry
    of chip produced and force of abrasive indent for ceramics with the standard model.
    Authors also stated that there has to be a specific energy for a specific material
    for the crack propagation.


    ## ELASTIC MODE MRM


    It has been discussed earlier that the surface integrity is affected by the particle
    size [[4](#9789811483653-C5.html_c5r4)]. The brittle/ductile erosion leads to
    the change in the surface structure at microscopic level. No surface roughness
    effect is found as we change the abrasive size from 120 nm to 40 nm. Thus, using
    particles can help of reducing the deformation and crack in final machine surface.
    It was thus emphasized to change the indentation mechanism to “surface area mechanism”
    while using abrasives of size less than 100 nm. Conventional larger sized abrasives
    move in a straight line on the surface, but the fine abrasive can change the direction
    with the flow. For a particular ratio of abrasive mass to the flow velocity, a
    tangential force comes into play, thus changing the path to a curved trajectory
    and strikes the workpiece substrate asymptotically (Fig. [**4**](#)). So, in cases
    where less energy for erosion is creating erosion on the substrate surface than
    the threshold energy, elastic erosion is said to occur. Taking this into account
    a new theory based on creating chemical erosion (namely elastic erosion) that
    considered the hydroxylation effect with chemical absorption. In this, the nano
    scale particles chemically react with the substrate surface to form bond within
    1nm distance from substrate top layer. Peng *et al.* [[33](#9789811483653-C5.html_c5r33)]
    also stated that the surface can be smoothed up to 0.17nm roughness in Ra. During
    this mechanism no defects were seen on the final workpiece surface.


    ![](Images/9789811483653-C5_F4.jpg) **Fig. (4))**


    Path comparison followed by different size abrasives [[33](#9789811483653-C5.html_c5r33)].


    ## EFFECT OF VARIOUS PROCESS PARAMETERS


    ### Abrasive Size


    Abrasive size plays a very important role in any abrasive jet machine. On increasing
    the size of abrasive, the volume and mass associated with it changes, in turn
    affecting the kinetic energy of the abrasive which affects `MRR` of AJM Table
    [**1**](#9789811483653-C5.html_c5t1). But the nozzle size put a limit on the abrasive
    size to be used even if the particles are 15 times smaller than the size of nozzle.
    It is found that this increase in particles size also results in the surface roughness
    and larger chips produced [[34](#9789811483653-C5.html_c5r34)]. Kowsari *et al.*
    [[35](#9789811483653-C5.html_c5r35)] stated in their study that the particles
    with size of 25µm and 10µm produced similar crest to trough roughness on working
    of sintered ceramic material. In case of ceramics the chips were removed by the
    detachment of grains from the substrate and then combining with the metal grain
    with more binding strength. Another factor that was seen was the impingement of
    abrasive particle on the workpiece surface that was believed to be due to the
    static friction between the two. It was also found that the fine particles tend
    to have lower tendency to embed as compared to larger abrasive size [[36](#9789811483653-C5.html_c5r36)].


    ### Flow Rate


    Flow rate is defined as the gram of abrasive particles being supplied in a respective
    quantity of carrier gas, liquid or slurry. Li *et al.* [[37](#9789811483653-C5.html_c5r37)]
    showed that the flow dynamics can be also dependent on other process factors than
    this. It was shown that the shape of groove produced changed to somewhat taper
    as the flow rate was reduced. Use of dessicant, maintaining low level of abrasive
    in reservoir *etc.* were stated to have best abrasive flow.


    ### Nozzle Material and Geometry


    Like the entire machining processes tool wear in the form of nozzle wear occurs
    across all types of AJM.


    It is the most delicate part of an AJM. A high-pressure carrying gas of medium
    having particles is passed through the nozzle orifice. During the passage, there
    is collision of particles many times on the wall of the nozzle and thus leading
    to its wear and its parts profile disturbance, process instability, jet disturbance.
    Thus, it is very important to consider this as the area of improvement. The nozzle
    wear is measured in terms of ‘nozzle weight loss rate’ (`NWLR`) in grams/minute.
    Out of a various proposed nozzle material, alumina ceramic nozzle serves a greater
    life as compared to stainless steel nozzle. 30% less `NWLR` was found in monolithic
    `B[4]C` coating compared to `Al[2]O[3]/Tungsten`, Titanium coating. Along with
    this functionally graded materials (`FGM`) were being found whose coating proved
    to be more wear resistant up to 4 times of standard nozzles. Lower stress levels
    at the nozzle entrance were also seen by simulating an `FEM` model of the same.
    At the same time increasing the length of the nozzle decreases the wear rate at
    the exit. Doing this, the particle velocity vector attained the same direction
    along the nozzle length thus reducing the wear. Increasing the nozzle length from
    76mm to 126 mm, the life of nozzle doubled. Optimum value for Orifice: Nozzle
    diameter found to be 0.4 [[38](#9789811483653-C5.html_c5r38)]. It was found that
    large amount of nozzle wear also take place due to the tensile and thermal stresses.
    The optimum angle for nozzle entrance was discovered to be 11°. At the same time,
    the Larger entrance angles produced more stresses.


    Table 1 **Review of Material, parameters and objective considered in AWJM.**


    | **S.No.** | **Author** | **Abrasive Material** | **Work Material** | **Influential
    Parameters** | **Result** |

    | --- | --- | --- | --- | --- | --- |

    | 1 | Paul *et al.* [[39](#9789811483653-C5.html_c5r39)] | Garnet | C-37 Steel
    | Orifice dia.- 0.3 mm, Inclination angle- 90°, Insert diameter 1.1 mm, Water
    Pressure- 2000-3000 bar, Abrasive Flow rate-0.225-0.832 Kb/min, Traverse speed-
    2000-4000mm/min, standoff dist.- 4-10mm, Feed- 0.25-0.8 | Traverse speed, Stand
    off distance and traverse feed were found to be most influential with Ra of 4-6µ.
    |

    | 2 | AM Hoogstrate *et al.* [[40](#9789811483653-C5.html_c5r40)] | Garnet Olivine
    | Glass Fibre metalates | Orifice diameter-0..3 mm, Diameter Diameter 1.11,, 511,
    Impact angle 90°,°, Abras size size 600 pressure pressure -2000 to30000 bar, Abrasive
    Flow Flowrate0.145 to 0.92 kg/min, Stand-off distance - 2 mm, Traverse speed 500
    to 3000mm/min | The laminated layer was most influenced by the water pressure.
    The cutting ability parameter (`C[P]`) was in direct relation by the kerf quality
    parameters. |

    | 3 | Hussein *et al.* [[41](#9789811483653-C5.html_c5r41)] | Al[2]O[3] | GRPF
    Composite type 3240 | Hole diameter- 6 to 8mm, Cutting Speed- 0.2to 0.3 m/min,
    Abrasive flow rate – 100 to 130 gm/min. Jet pressure – 150 MPa, Standoff distance
    – 2mm | Cutting feed, Stand off dist. and jet pressure have most influence on
    the surface roughness. Ra of 0.402 µm was obtained during machining. |

