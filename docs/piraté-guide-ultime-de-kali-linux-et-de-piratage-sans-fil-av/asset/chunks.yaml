  trans: '


    重工业中机器人技术、人工智能与大数据分析的引入，以及通过逻辑控制器使新机器可编程化后的安装。这些新兴技术将增加未来工业中对精密传感设备的使用。这一过程整合了制造过程中所有阶段的信息生成、记录和分析，涵盖了从温度感应到产品选择、分拣和包装的所有环节。带有深度学习的
    SCADA（监控控制与数据采集）可以对产生的数据做出自动反应，并在无需人工干预的情况下调整最微小的事件。通过人工智能处理的机器人技术和大数据分析可以显著增强整个制造过程的执行和性能，且整个过程可以进行远程控制
    [22]。


    ### b). 24/7 生产


    人类是需要照料、休息、水和食物等常规关注的生物，每天工作时间有限。然而，为了让每个制造单元持续工作，必须启动轮班，雇用四名工人全天候工作完成一个 24 小时的循环。AI
    机器人的优势包括无需休息、不疲劳且工作时间正常且不受干扰。此外，它们在制造单元中全天候工作非常高效。这导致了制造设施的增长，这对于满足全球和本地客户的需求日益重要。此外，AI
    机器人在组装线、物品选择、分拣和包装等领域更为有效。因此，它们可以显著缩短制造部门各个部门的周转时间 [18^-21]。


    ### c). 安全


    人类是有瑕疵的，并且倾向于出错，特别是当他们疲劳或分心时。错误和事故会在工厂车间以及任何开发或处理环境中发生；这种倾向几乎可以通过人工智能和机器人技术完全消除。无法触及控制意味着人力资产的减少，特别是当他们的工作不安全或需要超人的体力时。事实上，常规工作状况将减少机械事故的发生，并在很大程度上提高安全性。此外，更先进的实体硬件与工业物联网（IIoT）设备协作，使得建立安全监控和障碍变得更加简单且可行，从而确保人类生命
    [5]。


    ### d). 降低运营成本


    许多公司对人工智能在制造业中的应用感到恐惧，因为这需要巨大的投资。另一方面，投资回报率（ROI）至关重要，并随着时间的推移而增加。一旦智能机器开始承担生产车线的日常工作，企业将从运营成本的大幅降低中受益，预测性支持还助于减少机器停机时间。满足这些需求变得更容易、更便宜了，利用
    AI 和机器学习（ML）方法意味着整个生产准备将更具效益。将机器学习与 CAD 结合意味着系统可以在投入生产前在虚拟环境中进行设计和测试，从而减少机器测试试错的次数
    [23]。


    ### e). 更高的效率


    借助 AI 算法处理的大数据分析等新兴技术，可以预测工业部门的整体趋势；通过机器学习和数据分析，可以实现模式识别、随时间推移的市场发展预测、宏观经济周期甚至天气预测。人工智能结合机器学习具有预测数据、优化形式和跟踪不一致之处的能力，涵盖从源头到成品的整个供应链。这可以得到
    RFID 追踪等技术的特别支持，它允许材料无需通过用户条码等物理过程即可追踪 [16, 19]。


    ### f). 质量控制


    AI 机器人技术对工业中机器、设备和其他硬件的预测性维护非常有价值。此外，利用带有内置 AI 技术的各种传感器跟踪机器的执行和工作状态，以检查、预测所有类型的故障，并在发生前采取行动修复。这将导致更快的反馈并减少机器停机时间。因此，提高了整体效率和生产力。它们还可以识别纳米或微观故障，以远超普通个人想象能力的分辨率进行检查，从而提高生产力并增加通过质量检测和控制部门的产品数量。AI
    机器人在加速多个设计模型方面意义重大，并在精度上取得了巨大进步。这避免了人类进行质量控制和过程评估的需求，而这些工作是耗时且容易出错的 [22, 23]。


    ### g). 快速决策


    AI 机器人可以通过自动化仅需几纳秒的复杂任务，为制造业提供快速决策。而通过人工帮助则花费过多时间。它还可以更深层地查看信息并发现人类可能无法捕捉的模式。在决策中使用人工见解必须符合对客户有的工作流和设计。AI
    整合了认知和物理任务的自动化。它帮助个人执行任务更快、更好，并做出更优的选择。它实现了无需人工干预的决策自动化。AI 可以通过这种方式提高自动化水平，大幅减少人力劳动和重复性任务
    [16^-18]。因此，AI 产生影响的方式还有很多。AI 决策或其他任务的细节如表 [1]](#9789811483653-C9.html_c9t1) 所示。


    表 1 **AI 决策描述与示例。**


    | **决策类型** | **描述** | **示例** |

    | --- | --- | --- |

    | 分类 | 分类为好或坏 | 可能违约的潜在借款人、可能流失的客户、图像中的物体可能是猫，*等等* |

    | 分组 | 检测客户的自然分组 | 将客户划分为不同的簇 |

    | 关联 | 寻找不同实体之间有意义的关联 | 根据其他相关客户推荐下一个最佳产品或优惠 |

    | 预测 | 预测连续数量的未来价格 | 预测交易、预测客户在整个周期内的价值 |

    | 自然语言处理 | 识别结构、识别实体、提取含义 | 翻译、从详情中生成摘要、识别实体及其关系 |

    | 视觉感知 | 识别图像或视频中的物体、生成 3D 世界 | 理解边缘、纹理、物体。重构 3D 世界，检测异常 |

    | 机器人 | 操纵现实世界中的物体 | 移动机械手，如自动驾驶汽车、装配线零件分拣机器人 |


