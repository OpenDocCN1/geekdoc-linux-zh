    Takale and Chougle [[20](#9789811483653-C7.html_c7r20)] mentioned that `Ti49.4Ni50.6`
    shape memory alloy have low young’s modulus which makes it excellent for novel
    orthopedic implants. However, `Ti-Ni` yielded poor surface quality and low dimensional
    accuracy when it was machined with conventional methods. Therefore, `WEDM` can
    be an alternative to achieve high dimensional accuracy for machining `Ti-Ni` memory
    alloy. `MRR` and `SR` of `Ti-Ni` alloy were investigated for varying input parameter
    of `WEDM`. The input parameter selected were `pulse on time`, `pulse off time`,
    `spark gap set voltage`, `wire feed` and `wire tension`. `GRA` was employed for
    multi objective optimization. To study metallurgical changes on the machined surfaces,
    `EDS` analysis was performed.


    Singh and Misra [[21](#9789811483653-C7.html_c7r21)] investigated `nimonic 263`
    in `WEDM` under varying input variables. The design of the experiment was based
    on `Box-Behnken design technique` while parametric optimization for surface roughness
    was performed using `response surface methodology`. Results from `BPNN` showed
    that `BPNN` was a valuable tool for the prediction of responses. It was identified
    in `FE-SEM` that `WEDMed` surface contained micro-cracks, craters, spherical droplets
    and lumps of debris.


    Pramanik and Basak [[22](#9789811483653-C7.html_c7r22)] presented the effect of
    input parameters on the fatigue life, `crack propagation`, `surface roughness`
    and machining during `wire EDM` of `Ti-6Al-4V` alloy. Machining parameters, `pulse
    on time`, `pulse off time` and `wire tension` were considered and influence of
    these on `surface-integritry` were observed using `SEM`. The chief contributors
    observed for fatigue performance were nature and extent of `recast layer` and
    `HAZ`.


    Kavimani *et al.* [[23](#9789811483653-C7.html_c7r23)] used `Taguchi coupled grey
    relation analysis` to investigate the `WEDM` cutting parameters on metal matrix
    composite of magnesium reinforced with reduced grapheme oxide. `L27 orthogonal
    array` was applied to design the experiments and results were confirmed with the
    application of `ANOVA`. It was determined that `reinforcement weight percentage`
    and `pulse on time` were the most influential parameters among other input parameters
    such as `pulse off time` and `wire feed rate` for `MRR` and `SR`.


    Chu *et al.* [[24](#9789811483653-C7.html_c7r24)] discussed about a new feasible
    `low frequency vibration assisted technique` for generating `microgroove` on metal
    plates for high speed `WEDM`. The `ridge width` was significantly affected by
    the `average current`, `vibration frequency` and `feed rate`. However, `low frequency
    vibration assisted WEDM` can generate a smaller `microgroove` surface structure
    and higher processing efficiency as compared to traditional `WEDM` process.


    Rajkumar *et al.* [[25](#9789811483653-C7.html_c7r25)] addressed machining of
    `aluminium metal matrix composites` reinforced with `nano alumina particle` in
    `Wire electric discharge machining`. `Voltage` and `pulse on time` were found
    responsible input parameters for achieving higher `MRR`. Also, `controlled pulse
    durations` improved the surface integrity by reducing the machining defects.


    Zhang *et al.* [[26](#9789811483653-C7.html_c7r26)] analyzed `WEDM` of `thin wall`
    using `SEM` to characterize the `power-consumption`. `surface-quality` of `SEM`
    and `thermal-deformation` were observed during `WEDM`. It was found that `wire`
    can reduce energy consumption.


    Sharma *et al.* [[27](#9789811483653-C7.html_c7r27)] presented the optimization
    of input variables for `WEDM` of `shape memory alloy` using `Taguchi`. Among other
    input variables, `pulse on time` resulted in higher `MRR`.


    Smirnov *et al.* [[28](#9789811483653-C7.html_c7r28)] performed `WEDM` of `composites`
    using `SPS`. It was found that `wire` can reduce energy consumption.


    Zhou *et al.* [[29](#9789811483653-C7.html_c7r29)] discussed `WEDM` of `composites`
    using `RSM`. It was found that `wire` can reduce energy consumption.


    Pramanik and Basak [[30](#9789811483653-C7.html_c7r30)] studied the influence
    of varying wire tension while machining `AISI 304` in `WEDM`. It was noticed that
    `wire tension` had no influence on `kerf width`, but affects `MRR` and `SR`.


    Thankachan *et al.* [[31](#9789811483653-C7.html_c7r31)] used `WEDM` of `alloys`
    using `Taguchi`. It was found that `wire` can reduce energy consumption.


    Nain *et al.* [[32](#9789811483653-C7.html_c7r32)] used `WEDM` of `alloys` using
    `artificial neural network`. `MRR` and `Surface Roughness` were predicted.


    Chaudhary *et al.* [[33](#9789811483653-C7.html_c7r33)] studied `WEDM` of `super
    alloy` using `SEM` and `EDS`. `wire tension` affects `MRR` and `micro-hardness`.


    Gaitonde *et al.* [[34](#9789811483653-C7.html_c7r34)] discussed `WEDM` of `HCHr
    steel` using `RSM` and `differential evolution`. `MRR` was found higher.


    Goyal [[35](#9789811483653-C7.html_c7r35)] represented the study of `WEDM` of
    `Inconel 625` using `normal and cryogenic zinc coated wires`. `MRR` and `SR` were
    found affected by `pulse on time`, `tool electrode` and `current intensity`.


    Mouralova *et al.* [[36](#9789811483653-C7.html_c7r36)] distinguished `WEDM` structural
    material surfaces using `SEM` and `contact less 3D profilometer`.


    Arikatla *et al.* [[37](#9789811483653-C7.html_c7r37)] discussed the parametric
    optimization of `WEDM` process using `RSM` while machining `Ti-6Al-4V alloy`.
    `wire tension` and `servo voltage` had high influence on `surface roughness`.

