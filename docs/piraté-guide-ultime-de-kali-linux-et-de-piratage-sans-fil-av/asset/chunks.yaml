    # 线电火花中钛基合金加工的最新进展


    Kamaljit Singh^(1),**** Virat Khanna^(2, *)**


    ¹ 印度莫哈利昌地加尔工程学院

    ² 印度喜马偕尔普拉德什邦巴巴迪阿格拉森大学机械工程系


    ## 摘要


    汽车、航空航天和医疗应用等多学科领域对具有更好性能的先进材料的需求始终存在，这需要先进的加工工艺。线电火花加工（WEDM）是一种极具前景的非传统加工方法，广泛用于加工不同硬度和复杂形状的材料，具有极高的准确性和精度。WEDM
    是一种非接触工艺，通过火花侵蚀的形式去除材料。线电极与工件之间不断产生直流电火花，以实现部件所需的形状。脉冲开启时间、脉冲关闭时间、线速度、伺服电压和冲击压力等输入变量可以通过调整和控制，以优化加工工艺响应。本研究目的是确定工艺参数对钛镍记忆合金材料去除率（MRR）、表面宽（TWR）、粗糙度（SR）和表面形貌的显著影响。此外，还确定了一些需要深入研究的领域。文中还介绍了
    WEDM 的未来展望。


    **关键词：** 人工神经网络 (ANN)、实验设计 (DOE)、电子背散射衍射 (EBSD)、能量色散光谱 (EDS)、材料去除率 (MRR)、扫描电子微镜
    (SEM)、表面粗糙度 (SR)、透射电子微镜 (TEM)、线电火花加工 (WEDM)。


    ***


    ^* **通讯作者 Virat Khanna**: Department of Mechanical Engineering, Maharaja Agrasen
    University, Baddi, Himachal Pradesh, India; 电子邮箱: khanna.virat@gmail.com


    ## 引言


    如今，制造业遵循着高精度加工的趋势。这在微机械元件、电子和航空航天工业等高需求市场中很容易发现 [1]。随着过去几十年中开发出更先进、更奇特的材料，传统的加工操作已达到极限。随着工业的进步，需要制造形状越来越复杂的工件
    [2]。WEDM 在 90 年代后期引入，从那以后在制造业中大受欢迎。这主要归功于它具有加工难以切割、高强度重量比材料的强大能力，能够生产复杂的形状和轮廓。此外，WEDM
    可以产生高精度、尺寸准确的精细表面。线电火花加工是一种火花侵蚀工艺，通过导电工件生产出复杂的二维和三维形状。WEDM 与传统的电火花加工不同。细金属丝充当电极并完成切割操作
    [3]。


    线电火花加工是传统电火花加工的一种特殊形式，其中电极是连续移动的。材料通过工件与线电极（刀具）之间由薄膜介质液体（去离子水）隔开的一系列离散火花从工件上去除。对于具有复杂几何形状的导电、奇异、高强度和耐高温（HSTR）材料，WEDM
    提供了最佳替代方案，有时是唯一的替代方案。事实证明它在当今金属切割行业具有巨大的潜力，可以实现产品或零件相当显著的尺寸精度、表面光洁度和轮廓生成特征 [4]。


    以最短时间和最高精度加工钛合金是所有应用中的一个重要问题，特别是在生物医学领域 [5]。钛及其合金被归类为难加工材料，因为它们在极端温度下也具有很高的韧性和强度。由于轻质、卓越的耐腐蚀性等特性，钛合金在生物医学、汽车、化学领域、电子和食品行业中具有多种广泛的应用。此外，钛合金极其耐用且持久。当钛制笼、棒、板和销钉植入体内时，它们可以保持
    20 多年不受影响 [6]。用传统方法加工钛合金非常不方便，因为存在巨大的工具磨损；切割过程中对温度要求高等问题。因此，可以使用 WEDM 加工这些合金，因为它更适合此类材料。钛合金的非磁性是一个额外优势，使得体内植入不同类型植入物的患者可以在
    MRI 和 NMRI 下安全地分析 [7]。图示了由钛合金制成的某些植入物（1）。


    ![Images/9789811483653-C7_F1.jpg](img/Fig. (1))


    钛合金制成的医疗植入物 [7]。


    ## 线电火花加工 (WEDM)


    虽然 EDM 和 WEDM 的材料去除机制相似，但它们的功能特征并不相同 [8]。在 WEDM 工艺中，电火花产生于作为刀具电极的移动细线与工件之间，以侵蚀材料以产生所需的形状。WEDM
    的示意图如图（2）所示。


    ![Images/9789811483653-C7_F2.jpg](img/Fig. (2))


    WEDM 系统示意图 [9]。


    在运行期间，金属丝从线轴上连续送入，在线电火花加工机中由上下喷嘴的引导，而工件保持静止。通常使用的材料本质上是导电的，如铜、黄铜、锌镀黄铜、扩散黄铜、钼。电位施于线电极和工件之间，其中电极作为阴极，工件作为阳极，同时保持两者之间很小的间隙。


