    A fast turn of events, in designing and innovation, needs exceptionally exact
    and profoundly précised items. Surface properties play a significant role in creating
    products for automotive, aviation and biomedical applications. A little scratch
    or burr may cause huge misfortune, for example, midway engine failure, aviation
    catastrophe and so on. Industries are endeavoring hard and spending gigantic sum
    on completing of these, without harming surface property. It is a difficult task
    machine hard and tough material without changing its surface quality and surface
    property. In NCM, the heat is generated during machining which may prompt surface
    deformities [[1](#9789811483653-C4.html_c4r1)]. Along these lines, by choosing
    the suitable machining process, we can give better surface quality. In this specific
    situation, a water jet can be used to machine the hard and tough materials without
    the generation of any heat. This mix ie. water and abrasive, called as water jet
    machining (WJM), is a NCM procedure where high speed stream of water is utilized
    to erode materials from the outside of the work piece. WJM can likewise be utilized
    to cut soft materials like plastic, elastic or wood. Be that as it may, to cut
    more hard materials like metals or rock, an abrasive material is blended in the
    water. At the point when an abrasive material is utilized, in water for the machining
    procedure, it is called as AWJM. It works on water erosion. At the point when
    the stream of water with high speed strikes the surface, the expulsion of material
    happens. Dr. Norman C. Franz started the advanced WJM innovation in 1968, which
    was granted the principal patent for a creative high-pressure WJM framework and
    in 1971 the main business water jet cutting was created to cut the overlaid paper
    tubes. In 1980, Dr. Hashish understood the way toward adding abrasives to plain
    WJM and from that point AWJM was invented, to cut such mechanical materials, for
    example, steel, glass, and cement [[2](#9789811483653-C4.html_c4r2), [3](#9789811483653-C4.html_c4r3)].


    ## WJM and AWJM Processes


    In the WJM process, a high speed water jet is made to strike the work piece. Pressure
    force applied on the water, at the end of the nozzle, converted into high velocity.
    Later on, to cut the material of high quality and to cut hard materials, abrasives
    are added to high velocity water jet. Several advantages are associated with WJM
    and cost structure is less too. This innovation is the rapidly developing and
    flexible. Poisonous exhaust, recast layers, slag and residual stresses can be
    easily eliminated. Cutting powers are less in AWJM and there is no heat influencing
    zone close in the vicinity of cutting zone as present in NCM. In this way, it
    has been demonstrated by that the materials which cannot be machined easily by
    NCM can be effectively machined by WJM, for example, cutting slots in glass, stone,
    and metals, fast boring of opening in titanium etc. can be effortlessly machined
    by WJM [[4](#9789811483653-C4.html_c4r4)].


    ## AWJM Components


    (Fig. [1](#9789811483653-C4.html_c4f1)) presents a schematic image of AWJM components.
    The significant segments of the AWJM process are high pressure liquid pump (HPLP),
    high pressure pump, computerized control system, head for machining and catcher.
    The HPLP is utilized for providing to ultrahigh pressure, consistently. The system
    comprises of two tanks that cater to the requirement of cutting material and water.
    The Whole system is equipped with a filtration mechanism that can filter out larger
    particles. Large particle in the system can choke the working of the whole system
    [[6](#9789811483653-C4.html_c4r6)].


    ![](Images/9789811483653-C4_F1.jpg) **Fig. (1)**


    Schematic illustration diagram of the AWJM process with various components and
    its attachment [[5](#9789811483653-C4.html_c4r5)].


    ## Thermally Enhanced Machining (TEM)


    A wide range of materials, Inconel, Titanium, glass, ceramics, composites, heat-sensitive
    alloys, etc. are shaped for different applications with the AWJM process. The
    demand for heat resistant and higher strength materials is increasing particularly
    in aerospace industries. However, these materials are often difficult to machine
    due to their physical and mechanical properties such as high strength and low
    thermal conductivity, which requires very high cutting energy and makes the cutting
    forces and cutting temperature very high, and it even leads to a short tool life.
    This opens an avenue of Thermally Enhanced Machining (TEM) for hard-to-machine
    materials. TEM may use an external heat source to heat and soften the work piece.
    As a result, the yield strength, hardness and strain hardening of the work piece
    reduces and deformation behavior of the hard-to-machine materials changes to allow
    the plastic deformation. This enables the materials to be machined easily which
    are difficult for the machine along with low energy requirement that leads to
    an increase in material removal rate (MRR) and productivity [[7](#9789811483653-C4.html_c4r7)].


    Various features and developed machines of the AWJM process have been used to
    cut wide variety of materials such as hard materials like glasses, hard metal
    like titanium and Inconel, composites and alloys. The interest of heat resistance
    and higher quality materials is expanding especially in the field of aviation
    applications. These materials are hard to machine because of their physical and
    mechanical properties, for example, high strength and low conductivity, which
    requires extremely high cutting forces and makes the cutting powers and cutting
    temperature exceptionally high. It even prompts a short service life of cutting
    materials. This opens a road of thermally improved machining (TIM) for difficult
    to-machine materials. TIM may utilize an external heat source to heat and soften
    the work piece. Thus, the yield strength, hardness, and strain hardening effect
    of the work piece decrease. By doing this, difficult to-machine materials changes
    and permits the plastic deformation. This empowers machine tool for the materials
    to be machined effectively which are hard to machine alongside low energy requirement
    that prompts increment in MRR and profitability [[7](#9789811483653-C4.html_c4r7)].


    ![](Images/9789811483653-C4_F2.jpg) **Fig. (2)**


    Diagram showing various classes of parameters affecting the AWJ cutting process
    [[8](#9789811483653-C4.html_c4r8)].


    ## Performance Factors of TIAWJM


    The Performance of thermally improved AWJM (TIAWJM) depends upon various factors
    (Fig. [2](#9789811483653-C4.html_c4f2)). These factors can be categorized into
    various classes. These categories and factors are listed below.


    (1) Abrasive related factors

    - Type

    - Shape and texture

    - Flow mechanism

    - Flow rate


    (2) Nozzle related factors,

    - Characteristics

    - Diameter


    (3) Operational factors

    - Pressure

    - Standoff distance

    - Feed rate

    - Inclination of cutting


    (4) Performance Factors

    - Cut Depth

    - MRR

    - Kerf

    - Surface properties.


    A Key role in the machining process is performed by abrasive particles in AWJM.
    Abrasive, with high velocity, strikes on to the workpiece resulting in erosion
    of material from the workpiece. This high velocity to the abrasive particle is
    imparted by the water jet. Due to the nature of AWJM process, it is capable to
    cut almost any material [[9](#9789811483653-C4.html_c4r9)]. During machining using
    AWJM the MRR, surface roughness and productivity are related to each other.


    These parameters decide the surface quality and determine the functional performance
    of the resulting product. Geometric accuracy is the major output parameters in
    the AWJM process too.


    By considering about the mechanical properties and conduct, the material of the
    work piece can be characterized into two groups ie. ductile materials and brittle
    materials. Both group of materials have a differ mechanism of machining.

