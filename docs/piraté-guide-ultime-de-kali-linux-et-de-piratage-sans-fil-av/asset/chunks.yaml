    ### Advancements in WEDM Process


    WEDM has proven itself as the advanced technique for machining hard materials
    with complex geometry configuration with high precision rate. However, other machining
    processes can be integrated together with WEDM for better machining. Table [**2**](#9789811483653-C7.html_c7t2)
    shows the modern WEDM techniques developed in recent years.


    Table 2 **Hybrid WEDM Techniques.**


    | **S.No.** | **Hybrid WEDM** |


    | --- | --- |


    | 1. | Wire EDM Grinding |


    | 2. | Micro WEDG |


    | 3. | Wire EDM Milling |


    | 4. | Wire EDM Turning |


    | 5. | Abrasive Wire EDM |


    ### Wire Electric Discharge Grinding


    In order to produce cylindrical micro-parts, machining process like wire electric
    discharge grinding (WEDG) is preferred [[14](#9789811483653-C7.html_c7r14)]. In
    WEDG process, micro rotary parts such as rods and pins are machined with high
    precision [[15](#9789811483653-C7.html_c7r15)]. However, the WEDG process can
    fabricate micro rotational parts with curved contour profile precisely ; the machining
    efficiency is very limited. Besides, this technology depends on an expensive and
    dedicated micro EDM machine, which restricts the popularization of the technology
    in common industries [[16](#9789811483653-C7.html_c7r16)].


    ### Micro Wire Elcetro Discharge Grinding


    In micro-WEDG the uses of the grinding wheel are replaced with micro wire which
    acts as an electrode. When fine rod needs to be ground, it acts as a workpiece
    and allowed to be rotated while the electrode (micro wire) is held stationary.
    This process utilizes the electrical sparks or thermal energy produced to remove
    the unwanted materials from the workpiece in order to make the desired shape [[17](#9789811483653-C7.html_c7r17)].
    However, wire breakage control is most critical aspect of micro-WEDM process from
    technical and economic grounds.


    ### Wire Electric Discharge Turning


    Wire electrical discharge turning (WEDT) process is one of the emerging non-traditional
    machining processes for the manufacture of micro- and axi-symmetric components
    [[18](#9789811483653-C7.html_c7r18)]. In WEDT and WEDG, the erosion mechanism
    is similar to that of the WEDM process with a difference that in WEDG the workpiece
    is fed in longitudinal direction rather than in horizontally as in WEDT. Moreover,
    the characteristics of process variants of the WEDG and WEDT process are in the
    relative motion between the tool and workpiece electrodes and the feed.


    ### Abrasive WEDM (AWEDM)


    In this process, electrical sparks along-with abrasives abrade the workpiece surface.
    Higher material removal rate and better surface finish can be accomplished by
    integrating WEDM with abrasives of fine size.


    ## Developments in WEDM of Titanium Based Alloys


    Srinivasan and Palani [[19](#9789811483653-C7.html_c7r19)] examined the silicon
    nitride-titanium nitride (Si[3]N[4]-TiN) ceramic composite to characterize its
    surface integrity and fatigue performance in WEDM. Different types of defects,
    such as micro-cracks, micro-poles, globules, droplets and surface craters, were
    found during SEM on the WEDM surface of the ceramic composite. Moreover, the fatigue
    life of Wire EDM cut surface decreased by 25-35% than that of polished surface.
    Also, the hardness of the polished surface was much better than of the machined
    surface.'
