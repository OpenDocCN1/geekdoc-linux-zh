    初次碰撞产生的电子将再次加速。这将导致二次、三次碰撞等。这会在电极与工件之间的间隙中释放大量的离子和电子。这会导致“等离子通道”的形成，这是一种包含电子和离子的物质态。一旦等离子通道形成，电子流的电阻将会降低。电子将开始以极快的速度从电极向工件移动并撞击工件。此时可以看到火花。由于这个原因，电火加工（EDM）也被称为火花蚀刻过程。工件将持续受到电子冲击。运动电子具有很高的动能。冲击时，这种动能将转化为热能。这将导致工件温度达到
    8000-20000 ˚C 的范围 [9]。高温会导致材料局部熔化和汽化。


    ### 等离子通道的崩塌与冲刷


    一旦脉冲直流电停止，就会产生压力波或冲击波。这种冲击波将破坏等离子通道，从而允许循环的介电液进入等离子通道，并以微观碎片的形式将电极表面的熔融材料冲刷掉。此处将形成一个坑。高温的重复放电会去除材料，从而形成所需的刀具形状空腔。


    ## 金属去除理论


    根据实验观察，目前已提出了三种不同的材料去除机制 [10]：


    ### 高压理论


    根据该理论，当电动力波突然停止时，电极处产生巨大的冲击力。这种力是电极蚀刻的原因。据报道，放电柱中的压力处于 10-100 kgf/cm² 的范围内。发现压力作用周期长于放电周期。结论认为，在小放电情况下，仅靠放电压力不足以从电极去除材料。然而，通过热量、压力等其他因素的共同作用，可能会从电极表面去除熔融金属。


    ### 静态场理论


    库仑定律指出，两个带电电极之间存在静电力。这种力会导致电极产生应力。如果电极之间的间隙很小，这种力可能会超过电极材料的最终应力极限并导致拉伸失效。在放电持续小于
    2 μs 的情况下，阳极表面下极高电流密度产生的强电场梯度产生了拉伸断裂蚀刻所需的力。当力超过材料的拉伸强度时，就会发生拉伸断裂，从而从电极上侵蚀一个或多个颗粒。但在放电持续超过几微秒的情况下，观察到拉伸断裂理论无法描述电极材料去除。


    ### 高温理论


    该理论认为，当高能电子撞击电极表面时，温度会升高，特别是在导热率低的材料情况下。电极表面产生的高温会熔化并汽化材料，从而形成坑。阳极消耗的能量与总放电能量之间的比例与电极间隙、阴极和两个电极的函数等多个参数有关。还发现，高温并非仅由电子撞击产生。高密度电流产生的焦耳效应也是一个影响因素。


    ## 刀具电极材料


    在 EDM 加工过程中，在去除材料的同时，刀具电极的磨损是不可避免的现象。在模具制造等行业中，刀具的设计、开发和制造占刀具室交货时间的 25-45% [11]。在大多数
    EDM 操作中，刀具成本占总作业成本的 70% 以上 [12]。这意味着需要为刀具选择合适的材料。金属加工中存在一种“事事用其刀”的观念。为特定的加工操作选择正确的刀具材料是为制造零件生成最高生产工艺计划的第一步。切削工具材料的选择取决于工件材料和要执行的操作。通常，刀具材料有多种选择，可以成功生产零件，但不符合成本效益
    [13]。


    在传统加工中，切削工具材料的选择取决于工件材料和要执行的操作。然而，在 EDM 中，刀具最重要的要求是其导电性。刀具材料较高的导电性有助于电子在冷发射期间更容易发射。EDM
    刀具的另一个要求是它应该具有高热导率以散热量。这对于降低刀具表面温度以避免刀具材料的熔化和蒸发非常有帮助。刀具材料较高的密度也是一个优势，因为在相同的热量和相同的重量损失下，刀具的体积材料去除较少，因此尺寸损失较小。刀具材料较高的熔点也导致了低刀具磨损，因为在相同的可用热量下材料熔化较少。除了上述所有要求外，刀具材料的易加工性也非常重要，因为它构成了刀具成本的大部分。


