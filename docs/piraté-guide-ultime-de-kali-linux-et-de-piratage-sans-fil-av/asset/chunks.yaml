    # Layout of Dielectric Circuit


    Layout of Dielectric Circuit [[31](#9789811483653-C8.html_c8r31)]. This consists
    of a pressure sensor, conductivity sensor and a combination of pH and redox sensor
    in the places. Also, a monitor on filter pressure drop was maintained using pressure
    sensor at the filter entrance. It was set for a pressure vale of upto 2.8 bar,
    upon crossing which the machine stops automatically. Upon machining the given
    material a pressure drop chart for each was obtained and the weight of the eroded
    particles from the resin was calculated for each setup which shows that the machining
    of about 304 effective hours a total of 4kg of WC was being removed by machining
    of workpiece and wire of around 7.7 kg was eroded during machining. Compared to
    the amount of debris collected in resin a total of 5.4 Kg was found to be absorbed
    as in the form of ions during machining. Finally, a model was created for predicting
    the pressure drop. Contact wear was also found to be of significant rate as it
    continuously rubs against the wire of EDM. A good relation between the literature
    model and the developed model was found. Finally, it was concluded that the resin,
    filters, contacts and wire used in WEDM turn to be most cost effective if monitored
    precisely using appropriate sensors and prediction model.


    ## CONCLUDING REMARKS


    A lot of research has been done for the various material including the composites
    also considering various control parameters such as pulse on / off time, wire
    feed velocity, wire tension, peak current and voltage, but it can be seen from
    the review been done so far that a small study is done on the effect of wire material,
    so thorough studies should be done for finding the significance of it on the machining
    characteristics. It is also being seen that the wire diameter may play an important
    role in the machining characteristics and WWR. This also needs to be studied for
    their significance on MRR, SR and CV. Various other parameters such as filter
    saturation was found to be quiet different as compared to the literature model,
    so a detailed model need to be model for predicting it using materials like aluminium.
    We also see that as assumption of missing mass to be consumed in the form of ions
    has been made. Some research needs to be done to verify this and elaborate it
    thoroughly.


