    The electrons produced in primary collision will accelerate again. It will result
    in secondary and tertiary collisions and so on. This will cause the release of
    a large number of ions and electrons in the gap between tool and workpiece. It
    will cause the formation of “plasma channel” which is state of matter contains
    electrons and ions. Once the plasma channel is formed, the resistance to the flow
    of electrons will decrease. The electrons will start to move from tool to workpiece
    at a very rapid pace and will strike the workpiece. At this time a spark can be
    seen. Due to this reason the EDM process is also called spark erosion process.
    The workpiece will continuously get strike by the electrons. The moving electrons
    have very high kinetic energy. On strike, this kinetic energy will get converted
    into heat energy. This will result in high temperature at the workpiece in the
    range of 8000-20000 ˚C [[9](#9789811483653-C2.html_c2r9)]. The high temperature
    will cause localized melting and vaporization of material.


    ### Collapse of Plasma Channel and Flushing


    As soon as the supply of pulsating direct current is stopped, a pressure or shock
    wave will be created. This shock wave will break plasma channel thus allowing
    the circulating dielectric fluid to implore the plasma channel and flush the molten
    material from the electrode surfaces in the form of microscopic debris. A crater
    will be formed at the site. The repeated electrical discharges of very high temperature
    will remove the material and the desired cavity of tool shape will be formed.


    ## THEORIES OF METAL REMOVAL


    Depending on the experimental observations, three different kinds of material
    removal mechanism have been suggested [[10](#9789811483653-C2.html_c2r10)]:


    ### High Pressure Theory


    According to this theory, as the electrodynamic waves suddenly gets stopped, enormous
    impulsive force is generated at the electrode. This force is responsible for the
    erosion of electrodes. The pressure in the discharge column is reported to be
    lying in the range of 10-100 kgf/cm². It is found that the time period for which
    pressure acts is more than discharge periods. It was concluded that at small discharges,
    the discharge pressure alone would not be enough to erode the material from electrode.
    However, unification of some other factors, such as heat, the pressure might remove
    molten metal from the electrode surface.


    ### Static Field Theory


    Coulomb’s law state that there is presence of electrostatic force between two
    charged electrodes. The force will result in stress on the electrodes. If the
    gap between the electrodes is small, this force may exceed the ultimate stress
    limit of electrode material and result in tensile failure. In case of discharge
    durations lesser than 2 μs, the forces involved in tensile rupture erosion generate
    due to very high current densities underneath the surface of the anode create
    a strong electric field gradient. As the force exceeds the tensile strength of
    material, a tensile fracture follows thus eroding one or more particles from the
    electrode. But in case of discharge duration more than a few microseconds, it
    is observed that tensile rupture theory is not able to describe the removal of
    material from electrode.


    ### High Temperature Theory


    This theory suggests that as the high energy electron strikes the electrode surface,
    the temperature raises, particularly in case of materials with low thermal conductivity.
    The high temperature generated at the electrode surface immediately melts and
    vaporizes the material thus forming a crater. The ratio between the energy consumed
    at anode and total discharge energy are linked to several parameters like inter
    electrode gap, cathode and work function of both electrodes *etc.* It is also
    found that the high temperature is not produced by the striking of electrons alone.
    The joule heating effect generated due to high density current is also a contributing
    factor.


    ## TOOL ELECTRODE MATERIALS


    In EDM process, during machining, along with material removal, the wear of tool
    electrode is an unavoidable phenomenon. In industries, like mould and die manufacturing,
    the design, development and fabrication of tool takes 25-45% of the tool room
    lead time [[11](#9789811483653-C2.html_c2r11)]. In majority of EDM operations,
    the tool cost is more than 70% of the total operation cost [[12](#9789811483653-C2.html_c2r12)].
    This signifies the need of suitable material selection for the tool. There is
    a perception in metal working to use right tool for the job. Choosing the correct
    tool material for a certain machining operation is the beginning step for generating
    the most productive process plan for manufacturing a part. The selection of cutting
    tool material depends on the work material and the operation to be performed.
    Often, there are possible choices of tool materials that will produce the parts
    successfully but not cost-effectively [[13](#9789811483653-C2.html_c2r13)].


    In conventional machining, the selection of cutting tool material depends on the
    work material and the operation to be performed. However, in case of EDM, the
    most important requirement of a tool is its electrical conductivity. The higher
    electrical conductivity of tool material will help to easy emission of electron
    during cold emission. Another requirement of EDM tool is that it should have high
    thermal conductivity so as to dissipate the heat. This will be very helpful to
    reduce the surface temperature of tool to avoid melting and evaporation of tool
    material. The higher density of tool material is also an advantage as for the
    same available heat and same amount of weight loss there will be lesser volumetric
    material removal from the tool, hence, lesser dimensional losses. The higher melting
    point of tool material also results in low tool wear as there is lesser material
    melting for the same amount of available heat. Apart from all the above-mentioned
    requirements the easy manufacturability of the tool material is also very important
    as it constitutes a major part of tool cost.

