  md: '# Overview: What is Hacking?


    There is a common misconception among the public of what hacking actually is.
    Up until now, hackers have been viewed as mischiefs behind a keyboard with the
    intent and technical savvy to only perform malicious and hateful crimes online
    like theft, robbery or cyber-attacks. Perhaps this is a result of the media selectively
    publicizing and'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'shaming a handful of hackers that used their craft to do harm to others, while
    ignoring the good that the hacking community actually does.


    In recent years, however, there has been a somewhat noticeable shift in how hackers
    are being portrayed to the public. Thanks to platforms like YouTube, Hacktivist
    groups like Anonymous now have a voice in what’s been a very one sided story about
    what hacking is and what hackers do.


    Hacking is more than just knowing how to gain access to restricted information.'
  merge: -1
