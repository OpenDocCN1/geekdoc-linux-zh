  md: '# # Chapter 2- Linux System Basics for Hacking


    # ## What is Linux?


    The first question you are probably asking yourself, if you have never heard of
    Linux before is, what is it? Linux is the operating system that has been put together
    as a completely open source and free software for people to use and access. It
    is a computer operating system that lends itself to the “shared'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'intellectual property” motto of the hacker. Linux operating system kernel was
    initially released on September 17th, 1991 by creator Linus Torvalds, and has
    been free and downloadable for anyone since that time. The operating system can
    be on any electronic device from TiVo, to Android smart phones and, obviously,
    computers.


    What is an operating system, though? If you are someone who has had little experience
    with computers and how they operate, you probably have heard the'
  merge: -1
  pgno: 51
- img_proc: true
  md: word but are a little unsure as to what this means within an actual computer.
    One can basically define an operating system as a software that allows for the
    user to execute applications (run programs), supports everyday computer functions
    with things like being able to schedule tasks and allows you to control peripherals.
    Essentially, the operating system is a series of coding that tells the computer
    how it is going to run and what types of programs are set off by different coding.
    It is also how one puts in a security of checks and balances that
  merge: -1
  pgno: 52
- img_proc: true
  md: 'allow for your computer, or network, to be behind the safest of virtual walls
    it possibly can be.

    Although this software was originally developed for personal computers, today
    it is ported to more platforms more than any other operating system in the world.

    One can see Linux used on bit servers and mainframe computers for many different
    people and businesses. Most recently, it has been added to Google Chromebook laptops
    that have seen a huge increase in usage by the American education system. Linux
    is also seen on'
  merge: -1
  pgno: 53
- img_proc: true
  md: Android operational systems for the smartphones, which now is the dominant source
    of operating systems on smartphones. Another great thing about this operating
    system is that it also runs in embedded systems that allow it to transcend different
    technologies such as routers, DVRs and computer tablets. This allows for the operating
    system to truly touch every part of the technological space and be a friendly
    and known source of operating systems for any computer hacker in training. Linux
    is really, truly the largest and most
  merge: -1
  pgno: 54
- img_proc: true
  md: well-known example of something that is an open-source software collaboration
    that is free to the public. The source code of the operating system is something
    that can be modified, distributed and used by anyone under the GNU or General
    Public License. That is a large reason why it is found and used on so many different
    devices. Normally, for desktops and server uses, one will see Linux packaged as
    *Linux Distribution*, so this may be the way you have inently seen it before.
    Other mainstream, popular distributions you
  merge: -1
  pgno: 55
- img_proc: true
  md: 'have seen may have been openSUE, Ubuntu, Arch Linux, Debian, Fedore, Linux
    Mint, CentOS, Mageia or Gentoo Linux. All of these, and the other unnamed distributions,
    include both a support library and supporting utilities, which include the Linux
    kernel. The kernel, for your knowledge, is really the basis of the operating system—you
    could really think of it as the heart of it.


    As you can distribute Linux to anyone in any intended usage, it is meant to be
    used by the masses and be completely'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'free. The distributions of Linux that are out there include both a desktop
    environment (like KDE Software Compilation) as well as a windowing system (Like
    Wayland or X11). Sometimes there are intended distributions that leave out all
    graphic environments for standard install—a different feature one may not generally
    see—that may operate on software such as solution stack.


    Interestingly, when Tovald invented Linux, he did so because he was frustrated
    with licensing of education'
  merge: -1
  pgno: 57
- img_proc: true
  md: use only software MINIX. Tovald felt frustrated that he was unable to use it
    and eventually created the Linux kernel as his own creative and ingenious solution
    for the problem he saw at hand. If you notice, Tovald seems to abide by a large
    hacker rule that he solved a problem using his own creative abilities. He began
    his development of the operating system based on applications written for MINIX,
    but replaced components with the GNU applications that anyone can reuse in any
    computer program; as long as they are released
  merge: -1
  pgno: 58
- img_proc: true
  md: 'with a similarly compatible license. By integrating both GNU and the Linux
    kernel, a fully free and fully functional operating system was made available
    to the masses. Truly, this has allowed and assisted hackers since its inception.
    It truly is also a prime example of creativity and freedom based operating system
    knowledge spreading between users.


    Although this software is designed for both homes and business infrastructures,
    where large organizations (for example, NASA) began to use Linux in their'
  merge: -1
  pgno: 59
- img_proc: true
  md: expensive machines with the inexpensive Linux options. After initial success
    within a few large companies’ infrastructures, commercial computer companies followed
    suit, companies like Dell and IMB, added Linux support to move away from the Microsoft
    monopoly that had been in the desktop operating system market. With the addition
    of Linux to the Google Chrome OS software and on Android smartphones, Linux is
    slowly taking over larger operating systems on large computer and technology companies.
  merge: -1
  pgno: 60
- img_proc: true
  md: 'Linux gaming is also starting to gain some wind, with the company Valve starting
    its own Linux oriented gaming distribution.

    The design of Linux is based on the Linux kernel, which uses a monolithic kernel
    to handle everything from networking, file systems, process control and access
    to the peripherals. Drivers on different devices are either modules that load
    while the system runs, or integrated in directly with the kernel. There are four
    different things that are components installed on a Linux system; these are, an'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'init program (root of the process tree), software libraries (containing code
    used by running processes including C standard library and widget tool kits),
    a bootloader that loads the Linux kernel into the main memory of the computer
    and finally user interface programs (windowing environments or command shells).
    As you can see, the operating system itself is multi-tasking and inclusive of
    the needs of most any user.


    The operating system Linux, and its founder, really fit well into the hacker'
  merge: -1
  pgno: 62
- img_proc: true
  md: ideals and mindset that are essential and important when considering how the
    software is used, and what the hacker community is trying to achieve. Through
