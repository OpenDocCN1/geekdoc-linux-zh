- md: "\n# HACKING\nBeginners Guide on How to Hack Using Python and Linux\n\n![](img/4f9b58559135953e944a2b36c56eb1e4_0_0.png)\n\
    \n# BRUCE ROGERS\n\n# Hacking\n## Beginners Guide on How to Hack Using Python\
    \ and Linux\n\n## Why This Book\n\nThis how-to book really is a basis for any\
    \ aspiring hacker to start learning how to be accepted within the hacker community.\
    \ In addition to learning Python, you will also learn to understand the importance\
    \ and great things that the Linux operating system has given the hacking community,\
    \ as well as how it is vital in exploring the hacker mentality.\n\nPart of this\
    \ great, free and open source operating system is something that should never\
    \ be taken for granted and also emulated in the work that we do as hackers. By\
    \ the time you finish reading this book, you will have a sound understanding of\
    \ Linux operating systems and its foundations, and know how to use it to exploit\
    \ potential entry points within it.\n\nUltimately, the aim of this book is to\
    \ provide all aspiring hackers who are just starting out with a solid reference\
    \ point to learning how to hack using python programming, helping you develop\
    \ a strong understanding of Linux operating systems, and giving you descriptive\
    \ passages for you to learn and imagine how to utilize terminology within the\
    \ hacker community. I provide a great starter manual for anyone who is looking\
    \ to get into hacking itself, or even just a beginners’ guide to Linux and Python.\
    \ With step-by-step directions in some cases, as well as a helpful reference for\
    \ figuring out “how” and “what” command line is, to moving on to how to hack into\
    \ different things by finding vulnerabilities you will gain and learn a multitude\
    \ of new skills. With the invention of shared, open sourcing of Linux systems,\
    \ hopefully you will be able to find the one that works best for you and your\
    \ purpose. My goal is to assist you in knowing just what that may be and giving\
    \ you the resources to find it in order for you to become an elite hacker.\n\n\
    ## Overview: What is Hacking?\n\nThere is a common misconception among the public\
    \ of what hacking actually is. Up until now, hackers have been viewed as mischiefs\
    \ behind a keyboard with the intent and technical savvy to only perform malicious\
    \ and hateful crimes online like theft, robbery or cyber-attacks. Perhaps this\
    \ is a result of the media selectively publicizing and shaming a handful of hackers\
    \ that used their craft to do harm to others, while ignoring the good that the\
    \ hacking community actually does.\n\nIn recent years, however, there has been\
    \ a somewhat noticeable shift in how hackers are being portrayed to the public.\
    \ Thanks to platforms like YouTube, Hacktivist groups like Anonymous now have\
    \ a voice in what’s been a very one-sided story about what hacking is and what\
    \ hackers do.\n\nHacking is more than just knowing how to gain access to restricted\
    \ information.\n\nHacking is about freedom, creativity and most importantly a\
    \ push to make things better.\n\nThe important thing to understand is that not\
    \ all hackers are alike. Hacking is an art and a skill that takes time to perfect.\
    \ What a person decides to do with that skill is on the individual, not the community.\
    \ There will always be good and bad people in this world.\n\nMy intention with\
    \ this book is to provide you with the basic resources and skill sets to get started\
    \ on your journey as a hacker. The tools I have chosen are Python and Linux, which\
    \ we will discuss thoroughly throughout the book so that you not only understand\
    \ the “how” but the “why” to what you are doing.\n\nWe will also discuss the importance\
    \ of mindset and principles that will help guide your path as a hacker.\n\n# Table\
    \ of Contents\n\n- Introduction\n- Chapter 1- The Hackers' Mindset\n- Chapter\
    \ 2- Linux Systems Basics for Hacking\n    - What is Linux?\n    - How is Linux\
    \ used for hacking?\n- Chapter 3- Understanding Python\n    - Why is Python the\
    \ preferred hackers’ language?\n    - Benefits of learning Python as a programming\
    \ language\n- Chapter 4- Learning Python Programming\n    - How to get started\n\
    \    - Best ways to learn Python\n- Chapter 5- The Importance of Command Lines\n\
    - Chapter 6- Identifying Vulnerabilities\n    - How do hackers identify potential\
    \ points of entry?\n    - Socket\n    - Registry\n    - Programmatic interface\n\
    \    - Environment Variable\n    - Command Line Argument\n    - Protocol Handlers\n\
    \    - HTTP Header\n    - How can hackers exploit these using Python & Linux Systems\n\
    ## Chapter 7- Useful Resources\n    - Beginner tutorials\n    - Cryptography\n\
    \    - Helpful websites for security news and articles\n    - Videos, forums and\
    \ playlists\n    - Vulnerability resources and databases\n    - Tools and programs\n\
    - Chapter 8- Next Steps to Develop Your Hacker Skills\n- Conclusion\n\n## Introduction\n\
    \nCongratulations on purchasing, *Hacking; Beginners Guide on How to Hack Using\
    \ Python and Linux* and thank you for doing so. This book contains proven strategies\
    \ on how to make your first steps in becoming a hacker. It also serves as an excellent\
    \ resource for those internet-savvy people who want to create a space for themselves\
    \ within the hacking community. If you are a beginner that’s just starting out\
    \ and your goal is to master Python and Linux OS, then this will be a great introduction\
    \ for you into how to start learning the basics.\n\nIn this book, you will be\
    \ provided with summaries and simple “how-to” guides to using Python programming\
    \ language within the Linux operating system. It allows for the user to be immersed\
    \ in the “how” through the command lines. To grow as a hacker, it is important\
    \ to not only know how to do something but rather, you should work to understand\
    \ the “how” and “why” of what you are doing. Part of this book will be dedicated\
    \ to purely learning about the python language. After you have developed an understanding\
    \ of the fundamentals, we will go through basic lessons in programming using Python\
    \ and the best way to really learn how to do. I try to provide comprehensive tricks\
    \ of the trade and ways to be successful. Another goal of this book is to allow\
    \ you to always have a reference guide for you.\n\nLastly, in this book I’ve provided\
    \ for you an explanation and description of what it means to be a hacker and the\
    \ type of etiquette that is required within the hacker community. You will also\
    \ learn how to gain acceptance within the community through a set of core values\
    \ I will share with you. Not only will I cover these values, I will also tell\
    \ you why they are important and how they will open up doors for you. This how-to\
    \ book asks you, the reader, to think about just how you may want to join the\
    \ internet’s world of hackers. Working with that theme, the descriptions and ideas\
    \ of how to use different resources to allow yourself to be as successful as possible\
    \ to become a hacker.\n\nThanks again for purchasing this book, I hope you enjoy\
    \ it!\n"
  mdcn: "\n\n# 黑客技术\n如何使用 Python 和 Linux 进行黑客活动的入门指南\n\n![](img/4f9b58559135953e944a2b36c56eb1e4_0_0.png)\n\
    \n# BRUCE ROGERS\n\n# 黑客技术\n## 如何使用 Python 和 Linux 进行黑客活动的入门指南\n\n## 本书简介\n\n\
    本实用指南真的是任何渴望成为黑客的人学习如何被黑客社区接纳的基础。除了学习 Python 之外，你还将学习理解 Linux 操作系统对黑客社区所提供的重要性和巨大贡献，以及它在探索黑客心态方面是至关重要的。\n\
    \n这个伟大、免费且开源的操作系统的一部分，不应该被视为理所当然，并且应该在我们作为黑客的工作中予以效仿。当你读完这本书时，你将对 Linux 操作系统及其基础有良好的理解，并知道如何使用它来利用其潜在的切入点。\n\
    \n最终，这本书的目标是为所有刚起步的职业黑客提供一个坚实的参考点，让他们学习如何使用 Python 编程进行黑客活动，帮助你对 Linux 操作系统建立深刻的理解，并为你提供描述性段落，让你学习并想象如何利用黑客社区中的术语。我为任何想要进入黑客领域的人，甚至仅仅是\
    \ Linux 和 Python 的初学者，提供了一份极佳的入门手册。在某些情况下，书中提供了分步骤的指导，同时也提供了关于理解“什么是”以及“如何”命令行的有用参考，进阶到通过发现漏洞来黑入不同的事物，你将获得并学习许多新技能。随着\
    \ Linux 系统共享和开源的出现，希望你能够找到那一个最适合你和你的目标的系统。我的目标是帮助你了解那到底是什么，并为你提供寻找它的资源，以便你能够成为一名精英黑客。\n\
    \n## 概述：什么是黑客行为？\n\n公众对于黑客行为到底是什么存在一种普遍的误解。直到目前为止，黑客一直被视为键盘后的恶作剧分子，他们由于意图和技术专长仅限于在线上实施盗窃、抢劫或网络攻击等恶意且充满恨意的犯罪。这也许由于媒体选择性地宣传并羞辱少数利用其技艺伤害他人的黑客，而忽略了黑客社区实际上所做的善举。\n\
    \n然而，近年来黑客向公众描绘的方式发生了明显的变化。得益于 YouTube 等平台，像“匿名者”（Anonymous）这样的黑客行动小组现在对于关于黑客是什么以及黑客在做什么的这种单方面故事中拥有了话语权。\n\
    \n黑客不仅仅是知道如何获取受限信息。\n\n黑客关乎自由、创造力，最重要的是对让事物变得更好的推动。\n\n需要理解的重要点是，并不是所有的黑客都是一样的。黑客技术是一门艺术，一种技能，需要时间来完善。一个人决定如何使用这项技能取决于个人，而不是社区。这个世界上永远有好人也有坏人。\n\
    \n我写这本书的意图是为你提供基础资源和技能集，以开启你的黑客之旅。我选择的工具是 Python 和 Linux，我们将在书中彻底讨论它们，使你不仅理解“如何做”，还理解你所做事情的“为什么”。\n\
    \n我们还将讨论心态和原则的重要性，这些将帮助引导你作为黑客之路。\n\n# 目录\n\n- 引言\n- 第一章- 黑客心态\n- 第二章- 黑客活动所需的\
    \ Linux 系统基础\n    - 什么是 Linux？\n    - Linux 如何用于黑客活动？\n- 第三章- 理解 Python\n    -\
    \ 为什么 Python 是黑客的首选语言？\n    - 学习 Python 作为编程语言的优势\n- 第四章- 学习 Python 编程\n    -\
    \ 如何开始\n    - 学习 Python 的最佳方法\n- 第五章- 命令行重要性\n- 第六章- 识别漏洞\n    - 黑客如何识别这些漏洞？\n\
    \    - Socket\n    - 注册表\n    - 编程接口\n    - 环境变量\n    - 命令行参数\n    - 协议处理器\n \
    \   - HTTP 头部\n    - 如何利用这些和 Linux 系统进行黑客活动\n- 第七章- 有用资源\n    - 入门教程\n    - 加密\n\
    \    - 有用的安全新闻网站\n    - 视频和播放列表\n    - 漏洞资源和数据库\n    - 工具和程序\n- 第八章- 提升技能的下一步\n\
    - 结语\n\n## 引言\n\n祝喜购买《黑客技术：如何使用 Python 和 Linux 进行黑客活动的入门指南》，感谢你的选择。这本书为你提供了成为黑客的初步策略。它对于那些想要在黑客社区中为自己开辟空间的技术精明人士来说，是一个极佳的资源。如果你是一个刚起步的初学者，你的目标是掌握\
    \ Python 和 Linux，那么这本书将为你提供很好的介绍。\n\n在书中，你将获得关于使用 Python 编程语言和 Linux 操作系统的总结和简单指南。它让用户沉浸在“如何做”中。作为一名黑客，重要的是不仅知道如何做，而且要努力理解你所做事情的“如何”和“为什么”。书中的一部分将专门用于纯学习\
    \ Python 语言。\n\n最后，在书中我为你提供了关于成为黑客的解释和描述，以及黑客社区要求的礼仪。你还将通过我和你分享的一系列核心价值观获得社区的接纳。我不仅会涵盖这些价值观，还会告诉你它们为什么重要。\n\
    \n再次感谢购买本书，希望你阅读愉快！\n\n"
