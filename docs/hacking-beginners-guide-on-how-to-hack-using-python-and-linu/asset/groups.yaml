    每个操作系统都有一个让你交互的命令行界面。我们通常将此接口称为 shell（外壳）或命令处理器。但请记住，shell 也可以用来描述图形界面——为了本书的目的，澄清一下，我们指的是你在其中输入文本（命令行）来告诉计算机你想让它做什么的
    shell。这也是你更改操作系统本身的方式。现在，虽然每个命令行系统都有明显的区别，但有三种主要的接口机制。第一种是接口的参数，本质上是允许在程序启动时将信息传递给程序的支持。为了进一步解释，这些是你放入软件中的类型内容，用于告诉程序如何以及何时打开某个程序。第二种是，启动应用程序接口机制后，将有一个交互式命令行会话。这意味着程序为人们提供了一种输入文本的方法，就像你在其中输入命令行的
    shell。最后，是操作系统的进程间通信，它允许通过标准流（standard streams）或命名管道（named pipes）等方法将不同的程序和进程重定向到不同的程序。虽然大多数人并不熟悉命令行以及你用于输入它们的界面软件，但某些应用程序只运行命令行界面。这类程序用于控制操作系统的协同工作，本质上你可以认为它是使用
    Python 编码来操纵 Linux 操作系统。希望这以一种不那么术语化的、易于理解的方式进行了说明。


    命令行产生的历史实际上有助于你理解它们的用途。在命令行界面出现之前，人类会通过电报打字机（TTY）一次一行地进行通信。虽然这允许人们远程交换信息（这是一个巨大的进步），但它一次只能传输一条信息。而命令行允许你不再是与
    TTY 机器通信，而是直接与计算机通信。


    命令行界面的最初模型实际上无法像 Linux 等操作系统那样轻松替换程序。有趣的是，这些命令行界面是计算机使用的原始方式。在图形界面被发明并被 Apple
    等公司使用之前，每个人都使用命令行。对于计算机程序员、管理员和黑客来说，知道如何使用命令行是至关重要的，因为他们不同的角色都依赖于更改和操纵命令行的能力。


    你可能好奇，或者想要了解更多关于你将输入的 Linux 命令的类型。你可能会知道更多关于你将输入的 Linux 命令的类型：


    - `cd`: 切换目录。

    - `ls`: 列出当前工作目录的文件和目录。

    - `mkdir`: 创建目录。

    - `cp`: 复制文件或目录。

    - `mv`: 移动或重命名文件或目录。

    - `rm`: 删除文件或目录。

    - `pwd`: 显示当前工作目录的路径。

    - `cat`: 查看文件内容。

    - `touch`: 创建空文件或更新访问时间。

    - `nano`: 一个简单的命令行文本编辑器。

    - `vim`: 一个强大的命令行文本编辑器。

    - `grep`: 在文件中搜索模式。

    - `top`: 实时显示系统进程和资源占用。

    - `ps`: 查看当前运行的进程。

    - `df`: 显示磁盘空间使用情况。

    - `free`: 显示内存使用情况。

    - `uname -a`: 显示系统内核信息。

    - `ifconfig`: 显示网络接口配置。

    - `iwconfig`: 显示无线网络适配器配置。


    ### 关于组（Groups）和用户（Users）


    - `adduser`: 创建新用户。- `passwd`: 修改密码。

    - `who`: 显示当前登录的用户。

    - `addgroup`: 添加一个新组。

    - `deluser`: 删除一个用户。

    - `delgroup`: 删除一个组。


    有些时候你需要执行之外的操作，我们称这些通配符（wildcards）。这些示例有：


    - `*`: 匹配任意字符序列。

    - `?`: 匹配单个字符。

    - `[match].rar`: 括号允许匹配括号内的内容。在这个例子中，我们将匹配。

    - `![xy].rar`: 感叹号匹配不在括号内的任何字符。所以，这个例子会匹配 z.rar，但不匹配 x.rar 或 y.rar。


    现在我们谈谈搜索和编辑文本：


    - `grep`: 允许在文件中搜索特定模式并打印匹配行。

    - `sed`: 代表流编辑器。它允许你在文件中进行搜索和替换。

    - `cat`: 命令是 concatenate 的缩写，用于查看以及向文本文件添加。

    - `nano`: 命令行中的文本编辑器。

    - `less`: 用于标准输出和查看文本。


    我们如何操纵文件和文件夹？这里有一些命令建议：


    - `cp`: 简单的复制命令。

    - `mv`: 移动文件，可以移动到另一个位置或重命名文件。

    - `rm`: 删除文件。

    - `ls`: 允许你看到目录中的文件。

    - `mkdir`: 你可以用它创建目录。

    - `chmod`: 允许你更改列出的文件的权限。

    - `chown`: 你可以使用此命令更改文件的组所有权和用户。


    我们都知道，总会有需要同时执行多个命令的时刻。我将给出两个关于如何同时运行多个不同命令的示例：

