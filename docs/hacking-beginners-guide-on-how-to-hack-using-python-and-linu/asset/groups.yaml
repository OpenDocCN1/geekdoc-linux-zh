    本质上也是无限自定义的，因为你可以切换并更改用户界面组件，也可以更改操作系统的核心组件。这确实是一个非常适合黑客及其自由与集体智能使命（用于对抗我们社会中的权威影响）的操作系统。它是一个设计精妙且执行完美的范例，向世界展示了使用开源发行版可以实现什么。


    Linux 提供的发行版也相当惊人。开源的本质允许所有人开放访问，坦率地说，它可以被称为一个促进全民平等的操作系统。有无数发行版可供选择，其中一些列在上方（注：OCR
