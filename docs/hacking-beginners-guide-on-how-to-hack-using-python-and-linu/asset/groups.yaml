    ## Identifying Vulnerabilities


    ## How Do Hackers Identify Potential Points of Entry?


    As a potential hacker, why do you think you would want to be smart about finding
    a point of entry? Is it because you do not want the people or system you are hacking
    into knowing you are there? Yes, I would say, this is a main concern. You also
    likely only have one shot at being able to break through the barriers. This is
    where doing your research and knowing your craft become important parts of the
    work that you do as a hacker.


    As we now know how to tell the system what to do using the command lines, we may
    want to start thinking about how hackers use these commands. In addition to the
    commands, you should use Python language to change and hack into Linux systems.
    How can you pinpoint and exploit a potential weakness in order to gain access
    to the information you want or the system you want to explore? There are a few
    manners in which this is made possible, all accessible with your new found coding
    and command line skills. This is where you can start to feel like a hacker who
    knows how to manipulate and figure out the inner workings of system. Getting used
    to command lines and what they are, how you can personally maneuver around them
    to see and gain access to what you want, is vital to synthesizing the data you
    are about to receive from your new found ability to find weaknesses.


    Although these are not all of the potentially entry points for breaking into something,
    here is a good list of places that you can start as a beginner hacker. These different
    methods are socket, registry, programmatic interface, environment variable, command
    line argument, protocol handlers and finally http header. Keep in mind that the
    following are not the only potential points of entry for another system. Remember
    that there are always people creating and finding new ways to break into another
    system, most often by finding a new entry point. Take these first few potential
    break in points as something to study and master as you begin your hacker journey.
    Know that you must truly understand how these things work in order to be able
    to break down and find the weak spots within.


    ## Socket


    Sockets are something that are easy to connect to, however, the data passing through
    the network is not safe all the time. They consist of an IP address and a port
    number—they are bidirectional communication between applications that have various
    protocols. It can be extremely exploited if the there is a data entry point found.
    With a breach by a hacker such as this, one is able to intercept data, monitor
    the data being passed through, sending malformed data from client or server and
    finally MITM attack while data may be sent over a network—if the socket is open.
    One should use what is called a threat modeling process to indemnify the availability
    of an entry point.


    ## Registry


    If one is looking to exploit using this method, there are different keys that
    allow for a hacker to exploit the weaknesses. You can do this sort of hacking
    without local access by tricking a user into open a rouge file and then, the following
    time, data can be used. The permission for a registry key plays a significant
    role in accessing particular types of data. Without the access to the source code,
    you cannot determine which registry key is accessed (most of the time). Instead,
    using a Process Explorer tool you can instead determine what is accessed. This
    can be a good source if you are an astute hacker.


    ## Programmatic Interface


    Remoting program interface (such as COM, DCOM, RPCs) are ways to enable communication
    between different applications that are found on diverse platforms. By unfolding
    the programmatic interface, there is a lot of functionality that a hacker can
    exploit. Keep in mind that this process is complex and potentially difficult to
    understand at this point; especially if this is your first attempt at learning
    what and how computer programming is and how to use it as a hacker. Do not push
    yourself to try and do more than you are understanding right now. You may just
    tuck this information into a part of your brain you can pull out another time
    when you are a little more experienced. This is due to the fact that the full
    spectrum of the programmatic interface is a large and detailed discussion we will
    not have in this book. However, I encourage you to look into it yourself. Some
    interfaces you may want to look into are Gutil, RpcDump, Dcomcnf and OleView.


    ## Environment Variable


    Typically environmental variables are used to store information like a path regarding
    the current configuration environment and a currently logged on user. Within the
    system, variables are used by all of the computer users. Data is not safe within
    a program is it makes security based decisions on the information in the stored
    variables. Hackers are able to change the environment variable, only if they have
    broken into and compromised administrators account.


    ## Command Line Argument


    As previously discussed, command lines really supply data to make functions happen
    within an application. In order to spring this attack on a system, the hacker
    must convince the user to type in a command line argument that is malicious. Using
    this method, a hacker may be able to fully change the behavior of an application
    to achieve their goal.

