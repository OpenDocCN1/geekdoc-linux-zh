  mdcn: '

    黑客技术的进阶之路。Python 实际上是你可以在其基础上进行构建，以提升和磨练你的脚本技能。这个工具可以用于发现和理解虚拟世界中的无数事物，你学得越多，你的黑客能力就能走得越远。你可以轻松地在脚本世界中挑战自己，因为语言中总有更多的学习空间，总有其他语言可以研究，比如
    Perl 或 Ruby。


    学习如何入侵数据库是在你追求更具挑战性的黑客任务时可以获得的一种技能。为了入侵它们，你首先需要理解它们，就像对待任何其他事情一样。理解并弄清楚它们是如何运作的，在你提升黑客水平的过程中，可能是一个极具价值的研究课题。对于数据库，你需要学习一种名为
    SQL 的新语言。在入手之前，你应该了解许多术语和技术。快速的 Google 搜索可以帮助你获取一些基础知识。与其他任何事情一样，去论坛或看帮助视频，或者我的另一本《教程》（或其他人的！）来学习更多关于数据库如何工作以及你如何入侵它们的知识。


    学习 Web 应用程序真的是黑客的黄金矿，尤其是近年来。Web 应用程序是你研究的另一个领域，以获取有关应用程序如何工作以及驱动它们的数据库的知识。当你越深入黑客世界，就越会发现事物往往倾向于相互作用和相互影响。这就是为什么清晰地理解每个概念或前提对于掌握它至关重要。永远记住，就像我们在学校老师告诉我们的那样，没有愚蠢的问题。不要吝于提问，因为很可能在某个时刻，我们都曾问过相同的问题。建立你自己的钓鱼网站是学习更多黑客邪恶目的的好地方。了解任何技能的所有方面，包括那些阴暗的一面，是好的。


    为了成为一名优秀的黑客，显然不应该被捕。如果你被抓了，就无法成为一名优秀的黑客！在监狱牢里绝对无法进行黑客活动！学习数字取证是一个绝对无尽且迷人的学科领域。你可以真正学习更多关于如何避免和规避任何人的检测。这将真正帮助你通过比任何试图捕获你的人领先一步，来突破障碍。


    你对 TCP/IP（如协议栈和字段）的了解越深入，你的黑客技能就会越全面。你可以利用这些技能进行防御，也可以对他人创建你自己的潜在攻击。在你继续从初学者向中级黑客进阶的过程中，这是一个你值得研究的绝佳领域。


    学习更多我之前简要提到的密码学，也是有助于你作为黑客成长的技能。你可以利用这项技能来躲避检测，从字面上为自己构建一堵墙，让你通过编码不被发现。这是一项非常值得精通的技能。


    正如我之前谈过的，在数字世界中拆解并重新组装东西可以帮助你更好地理解它——反向工程是这种说法的另一种形式。能够对事物进行添加并使其更高效、更好，不仅能让你对自己的能力感到自豪，还有潜力去分享并帮助他人完成他们的任务。作为一个共同工作的社区，分享你的技能并在他人开始的基础上进行构建是重要的。


    当你正在学习并将所有这些技能发展到更高级的水平时，不要忘记你最初立足并开始黑客事业的理想是非常重要的。在思考新可能性时不断保持创造性的头脑，可以让你触及操作系统或编程的无尽边界——然后突破这些边界并开辟新领域。保持与创造力的联系是黑客思维中至关重要的一部分，你应该确保永远不要让自己忘记它。


    虽然创造力是你所赖的基础并是一项基本技能，但你也需要不断努力提高解决问题的能力。


    这类技能在虚拟世界和你的个人生活中都很有用。始终寻找用新方法来处理你认为不可解决的问题，将继续帮助你成长并挑战你的智力。这是哈客既可以独立努力，也可以作为一个整体共同努力的方向。


    当你觉得无法继续下去时，你能做的最棒的事情就是坚持，并继续推自己去克服你可能陷入的任何坎坷。最伟大的思想家和创造者都是问题解决者。那些坚持挑战自我以成长并在技能上变得更优秀的人。摇滚明星和女演员会听到成百上千次“不”，但他们继续坚持。这不仅让你变得更强大，还能让你把原本好的事物变得越来越好。如果起初没有成功，再尝试，再尝试！


    # 结论


    再次感谢购买本书！


    我希望这本书能够帮助你学习成为黑客的工具。我希望你对计算机系统实际上是如何被入侵的以及它的组成部分有更清晰的理解。成为黑客完全关乎你如何对待问题、解决问题，并确保模仿黑客的态度和心态。记住，使用
    Python 对 Linux 操作系统的不同黑客攻击几乎有无限可能，你应该能够利用这些基础思想并在社区中创造属于自己的名声。


    记住我们在本书开头讨论过的黑客特质是非常重要的。在黑客世界中承认创造性的重要性，在你承担新的挑战和冒险时只会对你有益。记住，你是其中的一部分。当你把 Linux
    本身视为一个免费操作系统时，你希望在这个拼图中加入属于你自己的知识产权。创造并参与服务于所有人更大利益的事业，应该是你投入到日常实践中的事情。确保你的大脑忙碌、活跃并不断解决谜题和问题。


