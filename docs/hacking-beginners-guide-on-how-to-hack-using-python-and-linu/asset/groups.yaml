    extends to creating a secondary or tertiary copy of the work or a recorded copy
    and is only allowed with express written consent from the Publisher. All additional
    right reserved.


    The information in the following pages is broadly considered to be a truthful
    and accurate account of facts and as such any inattention, use or misuse of the
    information in question by the reader will render any resulting actions solely
    under their purview. There are no scenarios in which the publisher or the original
    author of this work can be in any fashion deemed liable for any hardship or damages
    that may befall them after undertaking information described herein.


    Additionally, the information in the following pages is intended only for informational
    purposes and should thus be thought of as universal. As befitting its nature,
    it is presented without assurance regarding its prolonged validity or interim
    quality. Trademarks that are mentioned are done without written consent and can
    in no way be considered an endorsement from the trademark holder.


    # Chapter 1- The Hackers Mindset


    Although there may be some with associations of hackers being people who tend
    to skirt the rules and work towards creating mayhem on the internet, the fact
    of the matter is that this is not the attitude of a hacker at all. Hackers have
    a general code that they live up to. This consists of the following: they must
    not only give others voluntary and mutual help, they also believe in freedom.
    In order to truly belong and find your place within the hacker community, you
    have to truly believe in this mission yourself and find camaraderie with those
    who share your core mission and value. By the end of this book, I am positive
    that you will feel confident in laying the ground work for yourself to be the
    hacker you aspire to be.


    It is important that you understand the hierarchy within the community and the
    traits that are valued by your fellow hackers. It is also very important to always
    be open minded, as this is the way you will most likely come up with the greatest
    solutions to problems that may seem impossible to solve. Using your creative forces
    of deduction, you should try to assess and figure out where your personal ideals
    and goals will take you within this community.


    With that being said, this attitude is not the only attribute one needs to be
    accepted within the hacker culture. This attitude itself is an important piece
    of the puzzle, however, one must truly believe that the actions they will take
    will both assist you personally to learn through the process, as well as be motivated
    through your personal progress. Hacking is, in itself, an art form that involves
    both creative and intellectual abilities that embody the mind set of what a hacker
    is. There is an emotional tie to the work you do as a hacker and it is important
    to let that be a driving force in your work. There are some basic rules that I
    find helpful to embodying and allowing your work as a hacker to create the image
    you and the hacker culture will be able to stand behind. These basic premises
    should become like mantras to you as you continue to grow and develop your hacking
    skills. I truly believe that by keeping a consistent mindset, you will be able
    to develop better and more creative solutions than most hackers that align with
    your set of beliefs and values. These five core values or ideas are that: freedom
    is essential, there is absolutely no substitute for one’s competence—attitude
    does not take the place of competence, always try to solve new problems and avoid
    repetitive and boring tasks, you should never have to solve the same problem twice
