    时刻关注能够帮助你成为最优秀黑客的事情至关重要。你永远不知道谁能指引你走向正确的资源，从而帮助你提升技能。当你遇到任何特定的新黑客体验或障碍时，永远不要害羞进入论坛或向同行的黑客寻求帮助。这本书也应该一直作为你回首的起点。这本实操指南不仅了你什么是黑客以及是什么因素造就黑客，还允许你通过
    Linux 操作系统和 Python 语言查看基础示例，并了解到底什么是命令行。这些本质上都是成为专家级黑客的基石。始终提醒自己，高质量的工作优于急于跳过步骤试图尽快成为专家级黑客。其他工作了多年且真正的专家级黑客一眼就能识破你并拆穿你的伪装。不要急于自己，花时间去学习、尝试、发挥创意并做好你的功课。这就是学习成为黑客精英成员的道路。


    就个人而言，作为全球黑客使命的跟随者，我发现进入论坛网站特别有帮助。你可以读到许多不同经验水平的黑客的观点。你还能看到其他在哪里尝试过并失败了。阅读他人的失败实验既可以帮助你了解应该避开什么，也可以产生一个与他人可能共鸣的想法，并尝试不同的、新的且创新的方法来解决问题。你还可以在这些地方找到同伴，这种氛围有助于强化你对某个群体或组织的任何感受——也许你觉得某个组织本质上是权威的，需要被揭露。人数确实就是力量，论坛让你看到在以某种方式思考或对问题有特定方法时你并不孤单。


    永远不要让自己通过你在黑客社区的投入来贬低自己的个人价值。不要低估你自己、你的想法或潜在的想法，无论你是一个多么大的新手。当你用崭新的眼光看待这些新谜题时，你可能探索出一个别人没有发现的想法，因为他们可能带着疲惫且陈旧的观点来看同一个问题。成长和改进的空间总是存在的，这对于黑客社区来说至关重要。


    # 第 8 章 - 开发黑客技能的后续


    既然我们现在知道如何使用命令行告诉系统要做什么，我们可能想开始思考黑客如何使用这些命令和 Python 语言来改变和入侵 Linux 系统。任何可以想象到的黑客都想成为他们能最好的黑客；黑客的技能set应该建立在在前几章中概述的那种类型的人的基础上。我认为，我为你提高和发展黑客技能所提供的最佳建议，包含了我们在整本书中讨论过的许多理想。


    首先，我建议你继续学习并尝试模仿黑客伦理准则，这并不是我之前称呼它的词，但它确实是如此。为了做到这一点，你需要确保在你所从事的黑客工作的每个方面都勤地朝着创造性、智能且深思的工作努力。不要把黑客简单看作你在电脑屏幕后输入几个小时代码的事情。虽然这显然是它的主要部分，但它并定义你是一个或你想成为什么样的黑客。


    我还建议你回去精炼成为成功黑客所需的基础计算机技能。这些不是像如何在 Word 中编写和创建文档之类的东西，你需要能够理解命令行是如何工作的（嘿，我们之前讨论过那个！），并且能够在你所选择的操作系统结构中进行编写和操作。记住，能够交流编程语言也是作为黑客解决问题至关重要且本质的一部分。


    你接下来的任务是确保你理解基础网络是如何运作的。虽然这不属于本书的范畴，但它对于理解计算机及其系统如何相互非常重要。你对某项技术了解得越多，你处理它时就越出色，并在你的创造性黑客过程中为自己开启越多的门。


    Linux 技能是我们在书中详细介绍过的，并且无疑是你黑客技能的重要部分。开源模型确实是所有黑客发现自己在使用的模型，也是他们在试图突破入口点并在其中寻找数据时所面对的——他们-


    另一个简要提到的良好资源是 Wireshark。还有另一个叫做 Tcpdump 的程序，它们是广泛使用的协议分析器。它们对于确定你系统中的 TCP/IP 流量以及攻击是非常有用的工具。我鼓励你在真正精通这些技能后，去研究这些可能让你成为更高效黑客的类型程序。


    你有许多选项可以在其他操作系统中尝试你新发现的所有技能，也可以自己玩玩。这是一个很好的方法——其中一个程序是 VMWare Workstation，不过还有其他选择。


    正如之前提到的，安全知识和相关技术是学习成为黑客的至关重要的部分。你必须熟悉这些不同的安全措施是如何工作的，以及如何利用系统来访问它们。这些是诸如防火墙和
    PKI（公钥基础设施）之类的东西，为了获取关键数据，它们可能需要被攻破。有一个你可能感兴趣的基础安全课程叫做 Security+，它应该帮助增加对互联网和计算机安全核心原理的了解。


    由于现在有无数无线技术，对你来说学习如何无线黑客以及技术本身如何运作也同样重要。正如黑客的任何其他部分一样，你想要确保自己能够在无线技术世界中导航。找一个免费的在线课程、视频系列或文章帮助你理解各种无线技术方案将会世界在不断变化，技术是我们世界中一个看似流动的、变化的和演变的部分。努力跟上所有这些技术以理解你试图突破的网络世界至关重要。


    超出本书范畴的技能属于中级范畴。这些是在你掌握了书中提到的技能和想法之后可以研究的基石。尽管如此，我现在将向你介绍其中几个，以防你需要更多更高级的技能等来研究。


    脚本是每个黑客为了移动到必须精通的技能之一。


