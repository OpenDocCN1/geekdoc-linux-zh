    coding in the last chapter, learning to understand and master command lines is
    essential to understanding how a computer functions and how you will be able to
    hack a system or program. As with anything, using command lines has both advantages
    and disadvantages in the way you interact with your computer. The clear advantages
    of the command line become even more evident the more you begin to get familiar
    with coding. The first advantage of this method is that it requires fewer resources
    than other methods. You are simply able to tell the computer what you would like
    it to do.


    This is a very powerful and concise tool for one to use to control and manipulate,
    one of the goals you as a hacker have.


    Finally, it is expert-friendly, so you can feel like you have achieved and learned
    a greater understanding of the computer or program you are manipulating.


    As with anything else, there are also some disadvantages you will want to be aware
    of. The first, and perhaps largest, is that unlike the icons on a desktop, it
    is not intuitive. Meaning that you have to have an understanding of what you want
    to tell the computer or what you would like it to do, hence why it is expert-friendly.
    Commands in a computer are not obvious things, so you will have to do your research.
    However, since your goal is to hack into things, this could be seen as a learning
    opportunity rather than a disadvantage. This difficulty when starting out is figuring
    out how the computer and operating system need to be talked to. So, in this way,
    command lines are certainly not beginner-friendly, so this is where resources
    like this book come in to help!


    Every operating system has a command line interface that you will interact with.
    We refer to this interface, typically, as a shell or command processor. Keep in
    mind, however, that a shell can also be used to describe graphic interfaces—for
    the purposes of this book, to clarify, we are speaking of the shell in which you
    enter text (command lines) to tell the computer what you would like it to do.
    This is the manner in which you will also change the operating system itself.
    Now, although there are obvious differences in every command line system, there
    are three major types of interface mechanisms. The first is the parameters of
    an interface, essentially the support that allows for a passing of information
    to a program when it is launched. To explain further, these are the types of things
    you put into the software that tell a program how and when to open a certain program.
    The second is, after launching the application interface mechanism, there will
    be an interactive command line session. What this means is that there is a way
    that a program provides someone with a method to enter text, like a shell that
    you enter your command lines into. Finally, there is the OS inter-process communication
    that allows different programs and processes to be redirected to different programs
    by methods such as standard streams or named pipes. Although most people are not
    familiar with command lines and the interface software that you use to input them,
    there are some applications that only run command line interface. These types
    of programs are what is used to control the interworking of an operating system,
    essentially you can think of it as manipulating the Linux operating system using
    Python coding. Hopefully that puts it in a less jargon-type manner that you will
    easily understand.


    The history of how command lines came to be actually helps you to understand their
    use. Before there were command interfaces, a human would communicate one line
    at a time over a teleprinter (TTY) machine. Although this allowed people to exchange
    information remotely, a huge advancement, it only allowed one line at a time to
    be transmitted at a time. The command line allows for, instead of communicating
    with a TTY machine, you communicate directly with the computer.


    The first models of command line interfaces actually could not have programs easily
    replaced as they can be with operating systems like Linux. Interestingly, these
    command line interfaces are the original manner in which computers were used.
    Everyone use command lines until the graphically interfaces were invented and
    used by companies like Apple. Command lines are essential for computer programmers,
    administrators and hackers to know how to use as their different roles rely on
    the ability to change and manipulate the command lines.


    You may be wondering, or wanting to know more about, the types of commands you
    will be putting into the Linux command line interface. As these lines are what
    you will be learning how to manipulate, change and learn how to properly tell
    your computer what to do, I figured I would let you know a few of the more common
    ones and their uses within Linux specifically.


    For manipulating files and folders, here is a list of commands and a description
    of what they are and how to use them, just for a general jumping off point:


    Here is a similar list for moving around the file system:


    - - pwd: stands for print working directory. If you use this command in the desktop
    directory it will show ~/Desktop

    - cd: allows you to change directories. For example, to navigate to your desktop
    directory would be cd ~/Desktop


    Next here are some system information commands:


    - - df: This command displays the filesystem disk space usage for all partitions

    - free: allows you to see the free and used memory in the system

    - top: this allows you to see information about the running system, system resources
    and Linux system.

    - uname-a: this prints out all system

    - * ifconfig: gives a report on system network interfaces

    - * iwconfig: shows any wireless network adaptors as well as the specific information
    from them (like speed or network connection)

    - ps: is a command to view all processes that are running


    ### What about Groups and Users?


    - adduser: this creates a new user.

    - passwd: with this command you can change the user’s password.

    - who: this tells you who is currently logged into the machine

    - addgroup: this adds a new group

    - deluser: this removes a user from the system

    - delgroup: a command that removes a group from the system


    There come times when you will need to do things that are outside these categories,
    we call these wildcards. Examples of these are:


    - * which allows you to match something with the files, kind of a search function

    - ? this matches one character

    - [match].rar - the brackets allow you to match whatever is inside the brackets.
    For this example, we would be looking to match

    - ![xy].rar - this matches any characters that are not included in the brackets.
    So, this example would match z.rar but not x.rar or y.rar


    Now let’s talk about searching and editing text files:


    - grep: this allows for you to search files for a particular pattern and print
    matching lines

    - sed: Stands for stream editor. This will allow you to search and replace within
    a file.

    - cat: this command is short for concatenate and is useful for viewing as well
    as adding to text files

    - nano: this acts a text editor on the command line

    - less: use this command for standard output and viewing text files


    How can we manipulate files and folders? Here are some command suggestions:


    - cp: this is a simple copy command

    - mv: this moves a file, either to a different location or it will rename the
    file

    - rm: this command deletes or removes a file

    - ls: allows for you to see the files in your directory

    - mkdir: you can use this to create directories

    - chmod: this allows you to change permissions on whatever files you list

    - chown: with this command you can change both the group ownerships and user of
    a file


    We all know there will come a time when we need to execute more than one command
    at the same time. There are two examples I will give on how to run different multiple
    commands at the same time:

