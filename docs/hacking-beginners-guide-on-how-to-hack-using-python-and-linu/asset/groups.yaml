    ## Chapter 2- Linux System Basics for Hacking


    ## What is Linux?


    The first question you are probably asking yourself, if you have never heard of
    Linux before is, what is it? Linux is the operating system that has been put together
    as a completely open source and free software for people to use and access. It
    is a computer operating system that lends itself to the “shared intellectual property”
    motto of the hacker. Linux operating system kernel was initially released on September
    17th, 1991 by creator Linus Torvalds, and has been free and downloadable for anyone
    since that time. The operating system can be on any electronic device from TiVo,
    to Android smart phones and, obviously, computers.


    What is an operating system, though? If you are someone who has had little experience
    with computers and how they operate, you probably have heard the word but are
    a little unsure as to what this means within an actual computer. One can basically
    define an operating system as a software that allows for the user to execute applications
    (run programs), supports everyday computer functions with things like being able
    to schedule tasks and allows you to control peripherals. Essentially, the operating
    system is a series of coding that tells the computer how it is going to run and
    what types of programs are set off by different coding. It is also how one puts
    in a security of checks and balances that allow for your computer, or network,
    to be behind the safest of virtual walls it possibly can be.


    Although this software was originally developed for personal computers, today
    it is ported to more platforms more than any other operating system in the world.
    One can see Linux used on bit servers and mainframe computers for many different
    people. Most recently, it has been added to Google Chromebook laptops that have
    seen a huge increase in usage by the education system. Linux is also seen on Android
    operational systems for the smartphones, which now is the dominant source of operating
    systems on smartphones. Another great thing about this operating system is that
    it also runs in embedded systems that allow it to transcend different technologies
    such as routers, DVRs and computer tablets. This allows for the operating system
    to truly touch every part of the technological space and be a friendly and known
    source of operating systems for any hacker in training.


    Linux is really, truly the largest and most well-known example of something that
    is open-source software collaboration that is free to the public. The source code
    of the operating system is something that can be modified, distributed and used
    by anyone under the GNU or General Public License. That is a large reason why
    it is found and used on so many different devices. Normally, for desktops and
    server uses, one will see Linux packaged as *Linux Distribution*, so this may
    be the way you have seen it before. Other mainstream, popular distributions you
    have seen may been openSE, Ubuntu, Arch Linux, Debian, Fedora, Linux Mint, CentOS,
    Mageia or Gentoo Linux. All of these, and the other unnamed distributions, include
    both a support library and supporting utilities, which include the Linux kernel.
    The kernel, for your knowledge, is really the basis of the operating system—you
    could really think of it as the heart of it.


    As you can distribute Linux to anyone in any intended usage, it is meant to be
    used by the masses and be completely free. The distributions of Linux that are
    out there include both a desktop environment (like KDE Software Compilation) as
    well as a windowing system (Like Wayland or X11). Sometimes there are intended
    distributions that leave out all graphic environments for standard install—a different
    feature one may not generally see—that may operate on software such as solution
    stack.


    Interestingly, when Torvalds invented Linux, he did so because he was frustrated
    with licensing of education

