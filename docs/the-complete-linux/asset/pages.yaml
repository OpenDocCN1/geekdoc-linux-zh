    immediately think of noisy, rack-mounted box with multiple processors and RAID
    arrays. While this may be for the majority of computers we use, the reality is
    that any computing device can act as a server. Web servers routinely run in embedded
    devices for example. In order to be a server, the hardware only has to be capable
    of running the server software.


    But we''re getting a little ahead of ourselves, here we have to sort out our actual
    server hardware.


    A server is any computing device that serves ''information''. Servers can be used
    for all sorts of different things - email directory services, file transfer, databases,
    applications audio - the list of types of server in computing is a web server
    or the most common type of server in computing is a http server Web server is
