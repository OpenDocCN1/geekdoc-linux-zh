  md: '# # Soundcards


    ALSA is essential for turning all your soundcard''s squeaks and squatches into
    pro audio.


    Sound cards, are the bane of many a Linux user''s life conceptually simple devices,
    getting them to make sweet music can cause users so many difficulties. Traditional
    Open Source driver for sound cards in Linux has been rather hit-or-miss, depending
    on your card model. But things are improving with the advancements that ALSA (Advanced
    Linux Sound Architecture) is making.


    Here we see how to get a couple of typical sound cards to make noise with ALSA.
    If you are unsure you have ALSA already installed ALSA consists of three components:
    the card-specific drivers (which are implemented as kernel modules), user-space
    libraries for apps to talk to ALSA devices, and a bunch of handy tools for configuring
    and using ALSA devices.


