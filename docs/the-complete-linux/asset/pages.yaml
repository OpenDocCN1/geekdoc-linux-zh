  md: '# # Apache Servers


    Finally, we''ll take a look at what is probably the most popular network service
    of all - the World Wide Web. Apache is very popular indeed. According to the latest
    survey from Netserver (http://www.netserver.com/) over 60 per cent of websites
    on the internet are running Apache, the majority of these are undoubtedly running
    Linux. These survey results do not represent the actual number of computers on
    the internet running web services on Linux. The latest Netserver survey estimates
    that there are 30 per cent Linux, 50 per cent Windows.


    At the time of the survey, the majority of Windows machines were running within
    the relatively calm operating systems of kernel. Apache is much more popular than
    Windows. Apache is without doubt a major d'' for Linux users on the internet.


    An Apache server is quite a piece of trivial software. It receives a request from
    a browser - something that


    ```

    GET /index.html HTTP/1.1

    ```


    and sends the specified file (index.html) back to the client. In a training course
    I once taught, a student wrote a very simple web server as an exercise. It had
    about 30 lines of code.


    # # Dynamic Content


    Apache has an audience of over 100,000 users. Most of them (99,970) use Linux.
    What do you get for such ''dynamic content'' - lots of things? First, how does
    the web browser get back data part or entirely delivered from a program which
    is not a static file? Instead of the server sending a static file, the program
    generates it on the fly. There are various ways to do this: one of the most popular
    is to generate content into the web page using a scripting language like PHP.


    Second, you get able to host multiple websites on a single machine. You can set
    the machine to have several IP addresses even though it may only have one physical
    network interface. This is a Linux feature called virtual interfaces, which has
    nothing to do with Apache as much. But it means the machine can have multiple
    DNS names, each translating to the IP address of one of the machine''s


    ![](img/e96ec2317ee78634033c233818367b96_156_0.png)


    virtual interfaces, and each corresponding to a different website. Another approach
    is to have multiple websites sitting behind a single IP address. This is when
    DNS is configured to translate virtual host names to the same IP address, and
    Apache shows the page the server hosted on the host name which requested it. Thirdly,
    Apache has many ways of enforcing access control - at least deciding who can access
    the site (or sites). You can control access by the IP address of the machine where
    the browser is running, or by using a username and password (supplied via a form)
    which is looked up in a database of user accounts maintained by the server.


    # # Network Infrastructure


    Apache is installed on all major Linux distributions, and it is very easy to get
    it working as a web server. In fact, all you have to do is create some simple
    HTML files and put them in the directory that Apache uses as document root, and
    you are ready. Any other functionality such as the features described above, requires
    additional modules, and additional configuration entries in a file called httpd.conf.
    There are plenty of tutorials on how to do this, so it''s straightforward.


    # # Conclusion


    In this series of articles we''ve looked at how TCP/IP based mail servers and
    other network services and applications work - including services that are part
    of the network infrastructure, such as routing, and application services. Our
    treatment has been brief. Most of the mechanisms and services described in this
    series could have an entire book written about them. Instead, many of them are
    covered here. All of the facilities described in these articles are open-source
    software and are used without payment of license fees. Most of them are included
    in mainline Linux distributions.


    I hope that this series has clearly shown that Linux really provides a complete
    networking solution in a box.'
