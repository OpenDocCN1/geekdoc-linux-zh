  md: '# 2D AND 3D ART


    # Render with Blender


    PART 1 From game-building with animation to stills, this Open-Source app is an
    artist''s dream, says Juno Bacon.


    ![](img/e96ec2317ee78634033c233818367b96_117_0.png)


    Within the Linux world, there are a number of applications that have gained a
    reputation for being the ''killer apps'' for our little OS. Among the reputable
    offerings are such as the GNU Image Manipulation Program (GIMP), Apache, Quinta,
    Purple Project and more. One of the lesser-known programs that is making waves
    is


    Blender is a 3D modeling, rendering and composing package that includes a huge
    raft of features that have been developed over the years. Although Blender''s
    indeed free software, it would be wise for us to first cover how the Open Source
    Blender got to where it is today


    # The History


    Blender started out in life as a product that was developed for a small company
    called Number (NAN). NAN spent time developing the Blender application, and a
    series of tools and


    applications that were made available as part of the Blender platform. Although
    Blender was developed by a commercial company, NAN offered a free download of
    Blender for Linux, IRX, Windows and many other platforms.


    Although Blender was a free application, unfortunately it could not make enough
    money for bankruptcy; Blender was in a state of limbo. It was a free platform
    available. Luckily the generosity of the free software and the Blender communities
    pulled together and the original creator of Blender - Ton Rosendahl, approached
    the shareholders of NAN if a resolution could be made by sourcing the project
    and open-sourcing it. Ton came to agreement that he needed to raise 100,000 Euros
    to make the source publicly available. The €100,000 raised funded the scaling
    of Blender as an application we can use forever


    It is only recently that Blender has its first Open Source release — 2.26, and
    the hard work of the Blender community is ensuring Blender will continue to grow
    and evolve. It won''t be a ''lesser known'' killer app for much longer.'
