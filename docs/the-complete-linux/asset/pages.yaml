  md: '# BRINGING LOST DETAILS: Tweaking poorly-exposed images


    The last tutorial added a snap of colour to a poorly exposed image, but a closer
    shows some detail is still not visible. We can pull real detail from poorly exposed
    image? Using the image data itself to brighten the areas that are too dark, that''s
    how. Experiment with photos of yours to get a better feel for it.


    ![](img/e96ec2317ee78634033c233818367b96_101_0.png)


    Our original image shows a dancing floor on the plains of Texas (and oil wells
    not included). Standing in the shade of an outdoor shelter left him and the shelter
    underexposed. But there is detail in those! We start by duplicating the background
    layer.


    ![](img/e96ec2317ee78634033c233818367b96_101_1.png)


    The duplicate layer will be desaturated (Image>Colors>Desaturate). This layer
    will be added (activated) to the original image. Desaturizing it ensures around
    each channel affects the light layer just a bit. So the Screen processing doesn''t
    affect the amount blur depends on the image contrast, but in this case we blurred
    about 8 pixels.


    ![](img/e96ec2317ee78634033c233818367b96_101_2.png)


    With the duplicate layer active (its layer name is white on the Layers and Channels
    dialog), use Edit>Copy to save a copy of the layer. Add a mask (right click on
    the layer in the Layers dialog) to duplicate the layer. The layer mask will start
    active while. Click on the new layer mask to make it active and then paste a copy
    of the layer by using Edit>Paste or Ctrl+V the floating layer into the mask. With
    the mask still active, select Image>Colors>Invert to produce a negative mask for
    the area under the shelter. You might have to manually touch the mask using the
    brush or paintbrush. You''re satisfied with the mask, blur slightly - 10 pixels
    were used here but we came back and tightened up the blur by adjusting the Curves
    yet again.


    ![](img/e96ec2317ee78634033c233818367b96_101_3.png)


    Cleaning up the mask a bit more around the erased area by brushing it (so it would
    be lighted the same amount as the rest), we changed the layer blend mode to Screen.
    And then there''s a close up shows how the detail in the final version compares
    to the same in the original. The blue in the final image can be adjusted more
    by reducing the blur used in the layer mask.


    The resulting image, while suffering from poor contrast, is at least clearer and
    has better detail. We could add the steps from first out the colours if we really
    wanted here it might be safer to keep from bringing into out our dancer.


    ![](img/e96ec2317ee78634033c233818367b96_101_4.png)


    THE COMPLETE LINUX HANDBOOK 2'
