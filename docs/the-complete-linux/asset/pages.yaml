  md: '# A BIT ABOUT BEANS


    # Speaking Java


    What''s a JavaBean? Find out out with this introduction from Richard Drummond.


    ![](img/e96ec2317ee78634033c233818367b96_185_0.png)


    # Bean resources


    Where to get information and downloads


    +   - http://www.sun.com/products/javabeans

    The JavaBeans homepage at Sun. Contains links to documentation, tools, and editors
    of bean vendors.

    - http://www.netbeans.org/builder

    NetBeans is the open-source project for Forte for Java IDE.

    - http://www.builder.com/

    Builder is Borland Java IDE. The Foundation is available as a free download.


    Visual development environments - tools which we use build applications by point-and-click,
    and Java is no exception in this regard. The basis for Java''s component architecture
    - the building blocks which can be manipulated and assembled with visual tools
    - is the JavaBeans framework. But what is Java? How do you make use of JavaBeans?
    And how do you create your own? There are some of the questions we will need to
    look at in this article.


    # The basics of beans


    Java technology provides a specification for creating reusable components that
    can be manipulated with visual tools. Java Bean is a component that meets some
    spec: there''s no special thing about a Bean - there''s no special Bean that must
    be inherited, no interface to inherit. A Bean is simply a regular Java class that
    contains properties, methods and events, as documented by the JavaBeans specification.


    If you are a programmer, you''ve already used beans, even if you don''t realize
    it. Many of the classes in the Java class library are beans, such as AWT and Swing
    widgets. Key points to know when building a bean tool to use beans, and beans
    doesn''t need to be visual components as widgets. A component which encapsulates
    a database connection could well be a bean, although it doesn''t have any visible
    aspect to it.


    The design-time interfaces of beans are as important as the run-time interface
    that a Java program uses beans. The tools to create and these design-time interfaces


    # Bean features


    If bean is a simple Java object, how does this all work?


    # INTROSPECTION


    Tools which use the JavaBeans API to manipulate beans do so via introspection.
    As described by reflection, Java''s ability is able to get run-time information
    about classes, such as the name and parameters of methods.

    Introspector, part of the JavaBeans API uses reflection to learn the name of properties,
    methods and events of a class. It provides an interface that the bean can use
    with a Java UI to access it. And as well as the bean itself, each bean can have
    several auxiliary classes which provide extra information.


    # PROPERTIES


    Properties are elements of a bean''s state that can be manipulated, for example,
    the height and width of a widget or the URL of a database connection. Properties
    are accessed by methods which obtain a string name, so-called ''getter'' and ''setter''
    methods. A bean tool dispers


    ![](img/e96ec2317ee78634033c233818367b96_185_1.png)


    A tool like Sun''s BeanBuilder provides you with GUIs to visually modify a bean''s
    properties.


