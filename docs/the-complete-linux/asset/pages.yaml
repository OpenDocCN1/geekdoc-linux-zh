    is platform-independent or easily translated). There is also a Wiki filling out
    at http://wikipedia.org/wiki/BitTorrent and groups at groups.yahoo.com, which
    contains several BitTorrent meetings, and you can get help about torrent-related
    issues there. Some of, like BitTorrent help, will provide more useful info on
    all things about BitTorrent in this introduction.


    # So you think BitTorrent is easy, are there any times when it is not suitable?


    BitTorrent is well suited for files with high demand, so where people are constantly
    downloading and sharing files to allow others to start the download. This makes
    it ideal for sharing popular files, especially in the period immediately after
    a new release, when demand for the file can be very significant.


