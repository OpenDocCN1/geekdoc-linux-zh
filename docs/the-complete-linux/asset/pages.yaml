    http://cgmc.gimp.org/?fpid=11


    ![](img/e96ec2317ee78634033c233818367b96_84_5.png)


    workspace is open (constrained by the application) it is possible to move and
    resize windows. If you configure the GIMP session to dock the Toolbox, not the
    other windows. However, a quick way to handle the windows is to press the Tab
    inside a Canvas window. This will cause GIMP to be hidden. Because of the uncertain
    nature of the GIMP interfaces, there are no icons on the Toolbox for setting the
    application display size like those that inhabit the bottom of the Photoshop window.


    Finally menu options in the GIMP can create new images or modify existing ones
    they apply to the active window or to a new Canvas window.


    The concept of a Canvas window is sometimes hard to grasp for new users of GIMP.
    One of the most common questions is “Where the Filters?” Each Canvas window has
    its own menu, from the menu button in the left corner of the window or by holding
    down the right button inside the window.


