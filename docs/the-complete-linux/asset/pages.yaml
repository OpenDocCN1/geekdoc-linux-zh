    # ### Explain how it works, and how to set it up, but why would I want to download
    BitTorrent if other methods are available?


    The main reason is the availability of bandwidth. With the normal client-server
    method, a fixed amount of bandwidth is shared between many people downloading
    from the server. When demand goes up, you get either slower downloads or may find
    your connection attempt failed. Because everyone is also an uploader with BitTorrent,
    the space sharing allows that file to go to others than you. BitTorrent is at
    its best when demand is high, because more downloaders mean more peers.


    # ### How do continue to make a file available to others after I have finished
    downloading?


    The BitTorrent program continues to share a file until you quit, don''t stop your
    download. If you want to share a file after having downloaded it and quit the
    program, simply leave the BitTorrent client running. It will continue to serve
    the file and make no attempt to download it again, but it will make it available
    for others.


    There are no hard rules on this, but it''s courtesy to leave the client you have
    downloaded running as long as you share the bandwidth. If you have an on-internet
    connection, it''s a good way to provide bandwidth to others who might be using
    your connection, without affecting your own usage of the internet.


