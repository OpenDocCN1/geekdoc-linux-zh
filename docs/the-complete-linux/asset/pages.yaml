    Konqueror users need to select "File Associations" from the window, click Add,
    set the group to apply and type bittorrent in the Type name box. Add "torrent
    to the filename list (this isn''t strictly necessary as the web server should
    send the correct type), but you can also download BitTorrent by clicking on saved
    torrent file and bitdownload.gui %F to the application preference list.


    # I clicked on a link, but it did download a small file, with a torrent extension.


    There are two ways to handle this. One is to download and save the metadata files
    (for what the torrent files are really) and then pass them to one of the Bitt
    programs. This isn''t equivalent to clicking and starting the download directly,
    but it does mean you can rename the file to the correct extension. It also means
    for people who on dialup connection at home, then make the metadata file to work
    or use it with their bandwidth. To do this, use one of the following three commands
    in the terminal:


    ```

    bitdownload.gui somefile.torrent

    bitdownload.gui somefiles.torrent

    bitdownload.gui somefiles.torrent

    ```


    They all do the same thing as far as downloading commands? The only difference
