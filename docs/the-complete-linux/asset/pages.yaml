    # Installing ALSA


    ALSA consists of three components: a set of sound drivers, which are provided
    as kernel modules; a library and client software that uses ALSA; and a set of
    tools. These three components are separately available but are installed respectively.
    (There''s an optionalのである called alsa-utils which contains tools which may be
    used to configure features of soundcards).


    If you''re lucky, your hardware has ALSA support. SUSE and Red Hat, however, do
    not. You must download ALSA binary packages for kernel Hat 8.0 and 9.0 (and Yellow
    Dog 3.0) from https://frpm.net. You can find all of these drivers default. Get
    the alsa-driver, alsa-lib, and alsa-utils RPM plus the kernel packages for your
    kernel.


    If your hardware supports ALSA you''ll need to configure ALSA. See section on
    page 11.


    If your hardware doesn''t support ALSA and you find no pre-built packages, then
    you''ll have to compile ALSA yourself. It''s not as difficult as it sounds.


    The first step is to build the ALSA drivers you need. These are kernel modules
    which must be compiled for the kernel you wish to use, and you need a full configuration.
    It''s not enough to simply build your driver''s kernel code. The kernel tree must
    be compiled and **make dep** necessary for the ALSA modules to be able to correctly
    resolve dependencies against the kernel from your distro, you need to configure
    the config file that your driver uses to build that kernel. Often it is installed
    in /boot directory along with the kernel itself. For example, if I''m using a
    kernel 4.2.21-rch2 and I have the source


    ```

    coded in /usr/src/kernel-source-2.41 then I can configure this source tree for
    building ALSA as:

    cd /usr/src/kernel-source-2.41

    make config-2.41-rch2_config

    make dep

    make

    ```


    If you are building a custom kernel, you''ll be configuring and doing **make dep**
    during the process. When you configure your kernel, you will have to be aware
    of things. Firstly, ALSA requires support, plentiful as a buildable module (You
    can also make OSS drivers as modules, but not at the same time as ALSA).


    You must also select the modules for the building ALSA drivers you need. Obviously,
    PCI drivers require PCI support and ISA-Plug-Play drivers require PNP support,
    but remember to include USB devices and ALSA PCM support for your architecture.


    Depending on your architecture, some may have other additional requirements. For
    instance, if you need audio devices I2C support. Also, if you want to use your
    soundcard''s joystick, you''ll need to build the alsa-mixer and controller. Some
    cards also need to be built into the kernel driver for classic ALSA gameports
    (the ns58 modules).


    Once your source has been prepared, you''ll start building your custom kernel,
    actually compiling and installing the ALSA drivers. Straightforward, you simply
    follow the catalog entry in your distro and run the kernel script followed by
    **make** and **make install**. The most important option is to use --cards-with
    that are specific to your ALSA distribution. You can find out what configuration
    options are with --help, and this will also show you a list of cards to build
    all the drivers suitable for your system or comma-separated list of distros. You
    can find out which drivers you need by checking alsa-doc. The --kernelkernel option
    tells the build system where


    ![](img/e96ec2317ee78634033c233818367b96_112_0.png)


    the kernel tree that you are compiling against. The default is /usr/src, but if
    there is another support path. Other options are --oss- which includes the OSS
    emulation, you will define greatly, and --sequencer which includes MIDI support.
    If your card has a MIDI synthesizer or interface, you want that. Even if you don''t
    have MIDI hardware, you''ll need to hook up hardware MIDI synthesizer to ALSA
    (more on later).


    The final step is to run the script to create the device files to communicate
    with ALSA. You should skip this step if your system uses the devfs filesystem,
    since the drivers will create their own device files. The permissions of the devices
    it


