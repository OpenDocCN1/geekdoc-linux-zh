    # Getting to know the Function buttons


    +   - VIEW OBJECTS

    Use the adjust tool in Blender. We will look into this more later when we explore
    views.

    - LAMB LIGHTS

    Add, adjust and tune any light bands in objects in your scene.

    - MATERIALS

    Add and edit materials for objects and faces in your scene. This feature is enabled
    with Textures to create realistic objects.

    - TEXTURES

    Textures can be applied to objects and faces as well as materials. Textures are
    important in ensuring that your objects look authentic. We will look into this
    more later.

    - ANIMATION BUTTONS

    These buttons can be set up to use your


    +   - objects can be animated using a variety of techniques.

    - HEALING BUTTONS

    These buttons are used to configure the realtime aspects of your scene. You can
    use these to implement reality.

    - EDIT BUTTONS

    Make changes to your meshes, models and objects in your scene. This is one of
    the most commonly used tools in Blender in great detail.

    - CONSTRAINT BUTTONS

    These buttons allow you to add and edit constraints to your scene.

    - SOUND BUTTONS

    These buttons deal with attaching sound to your events and animations.


    +   - WORLD BUTTONS

    These buttons let you set up world settings such as sky colour, most etc.

    - PAINT BUTTONS

    These buttons are used for fine-tuning painting.

    - RADIOSITY BUTTONS

    These buttons control the radiance density within Blender. We will cover this
    later.

    - SCRIPT BUTTONS

    These buttons deal with the python based scripting interface within Blender.

    - DISPLAY BUTTONS

    These buttons are used to configure how your animations and images are displayed
    and where they are saved.


