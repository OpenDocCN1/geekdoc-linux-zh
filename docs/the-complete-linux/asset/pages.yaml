  md: '# What is MIDI?


    The Music Instrument Digital Interface


    MIDI is a standard protocol specifications, that began in the 1980s, for controlling
    electronic instruments by a controller or software. At the hardware level, MIDI
    is a serial device similar but not compatible with RS-232 serial interface (or
    anything). At the software level, MIDI devices communicate by sending messages
    to each other. A basic MIDI message is ''note on'' which tells a device to play
    a note at a particular pitch and loudness. MIDI supports 16 channels and a MIDI
    instrument number will be assigned to each channel. This device will then know
    which instrument to play with which particular velocity. A ''note on'' event makes
    the synthesizer to produce a specific sound, such as an acoustic piano.


    The MIDI standard specifies that devices should be able to play 128 instruments,
    each able to at least 24 notes. MIDI devices however do agree on what corresponds
    to what; instrument 14 might be a trumpet, on another it might be a saxophone.
    Without a set of patch bank, a ''patch map'' becomes particular. PCs can receive
    MIDI from an external MIDI instrument. Otherwise, the storage and user interface
    capabilities of PCs are limited. Moreover, the synth and synthesizers on many
    sounds can be controlled by MIDI software. Without software, keyboards cannot
    act as a digital device by generating and mixing the MIDI voices in other software.


    client streams join together and output the result as single stereo stream (the
