  md: '# Processor


    You might be surprised to learn that for the majority of server tasks, the CPU
    is the least important component. For serving HTML disk space and memory play
    much more in responsiveness of the system than the CPU does, because you are just
    pushing out the network.


    For databases, the difference is even more pronounced. Although searching tables
    is more computationally expensive memory bottleneck occurs because of the tables
    that needs to be loaded from disk to the memory in the first place.


    Most host servers are about the movement of data, not process them really. There
    are obviously cases where the CPU plays a more important part, especially when
    you are dealing with web sites with off-the-fly graphics, or generation patterns
    from the server itself. For most part, the server can get away with a much slower
    processor than the one you are using in your office - when you have upgraded your
