  md: '# # Not root enough to package


    Packaging as a normal user


    To RPM: when not root, then do the following: Create the directory structure that
    RPM needs to package with:


    ```

    mkdir -p $HOME/${BUILDROOT}/usr/lib/{lib32,lib64,lib86,lib96},SOURCES,SPECS,RPMS

    ```


    Then tell rpm the new directory structure. Create a file named `.rpmmacros` and
    put the following it:


    ```

    %top=%{USER}

    %toptopth=%{BUILDROOT}/tmp

    %package=yourname@somewhere

    ```


    where <USER> is the user creating the packages. In this case it would be /home/warren/redhat.


    production packages. Libraries should go in /usr/lib, binaries

