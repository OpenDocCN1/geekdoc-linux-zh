  md: '# TutorialJava


    This class is quite straightforward.

    The getBean() method returns a BeanDescriptor object, which encapsulates general
    information about the bean that this class represents, whether it is a Customizer;
    getProperties() returns an array of PropertyDescriptor objects, each of which
    provides information about the bean''s properties, the property''s name, a helpful
    description, whether it has a custom editor, and so.


    Here, we''ve implemented a helper, createPropDesc(), to simplify the creation
    of PropertyDescriptor objects. BeanInfo describes the methods provided and the
    events fired by the bean, but we have implemented these here.


    How the information provided by a BeanInfo is used by a bean editor depends on
    the tool you are using. For example, if the editor uses the properties described
    in its jar file rather than introspection, you are presented with the properties
    instead of being overwhelmed by all of the bean''s properties, including all of
    its parent classes.


    BeanInfo system lets the designer choose which properties are important in a way
    that is easily accessible at design-time.


    # # A jarring experience


    The next step is to pack it into a jar file, so it can be easily deployed. This
    package includes the class, the behaviour of the bean, and any design choices
    such as Beanclasses, custom property editors, and constructors. This can be a
    useful saving for space when beans share code. The name of the jar file itself
    is not important. Just choose


    Each bean in the jar must have an entry in the jar''s manifest. A manifest file
    contains various information about the jar, such as the name and version number
    of the bean. We must add extra information to the default manifest for each bean
    so that bean tools can locate them. Finally, the file path, relative to the root
    of the jar, must be specified for each bean''s classes. Each class must be flagged
    as a bean in the manifest file.


    The process of creating a jar is straightforward, and the first step is to prepare
    a skeleton manifest file containing any extra information we require. Here''s
    an example for our MyBean:


    If we now save this skeleton as a file named MyBean.mf, we can use it to pack
    the jar with the command as follows:


    ```

    jar cvfm MyBean.jar MyBean.mf

    Java-Bean: true

    ```


    ![](img/e96ec2317ee78634033c233818367b96_188_0.png)


    # ## Deploying your bean


    Now it is time to use the jar. To run a bean at runtime, all you need to do is
    ensure that the bean''s jar file is accessible to your application when you are
    using it. The job of installing a bean by using a particular bean builder tool,
    depends on the tool you are using.


    With BeanBuilder, for example, you can choose your bean from the Bean''s jar directories,
    or you can add it to runtime with the ''Load jar'' option from the file menu.
    It may also be used in the ''Toolbox'' for the new bean, and you can use it as
    normal.


    Similarly, NetBeans can be used to make a new bean with the ''Install Java Bean''
    option. You load the jar file, and then NetBeans will show you all the beans available
    in that jar. For each bean you can then choose in which tab-pane of the palette
    you would like installed.


    The current release of NetBeans has a minor problem with the Manifest list. It
    doesn''t like adding non-empty components to the component palette, where your
    widget is listed inherited from the AWT Panel class. The first time you use it
    will complain with an exception. Just can cancel this and carry on as normal.


    ```

    jar cvfm ..//list.jar ../list.manifest

    Main-Class:java.beans.BeanList.class

    Main-Class:java.beans.BeanInfoClass.class

    Main-Class:java.beans.BeanHead.class

    Main-Class:java.beans.BeanModel.class

    Main-Class:java.beans.BeanAdjustmentEvent.class

    Main-Class:java.beans.BeanAdjustmentEventListener.class

    ```


    Our MyBean list in a jar deployed and designed with NetBeans.


    Of course, you would include this in a mock sort of the jar file, rather than
    doing it manually. It''s worth pointing out that you must remember to include
    all the classes that are present in the jar file. This is, in particular to any
    anonymous inner classes, including example anonymous inner classes like BeanList1.class,
    BeanList2.class, etc. which will be in the wildcards.


