  md: '# ART AND IMAGE EDITING


    # The GIMP User Environment


    PART 1 The GIMP is the grandfather of the Linux/GNOME desktop environment. Michael
    J Hammel''s quick tour will get you started using this popular image editor.


    ![](img/e96ec2317ee78634033c233818367b96_83_0.png)


    On the DVD The GIMP is the premier interactive image processing application for
    the Linux operating system. Its user interface is based loosely on the popular
    Adobe image editing package. But while Photoshop provides a long, dual-column
    Toolbar with multiple pop-up menus, a clustered menu bar, and an enclosed workspace,
    GIMP provides a menu bar, free floating workspace, and sophisticated Canvas windows
    with tear-off menus.


    The GIMP provides many of the same features as Photoshop, from layers and paths
    to blend modes and text manipulation. It also provides features not in Photoshop,
    including support multiple scripting languages which makes GIMP perfect for web
    based animation production.


    # The GIMP interface


    The main window for GIMP is called the toolbox. The tools should be familiar to
    Photoshop users, though the layout of the interface is a bit different. Individual
    tools are not pop-up menus on their own. Double-clicking a tool in the GIMP opens
    a Tool Options dialog which allows you to change the behaviour of the tool. This
    helps reduce the complexity of the tools by allowing them greater flexibility
    for a single tool instead providing multiple tools that do similar things. The
    concept of Full Screen is irrelevant with the GIMP - since the


    84 THE COMPLETE LINUX HANDBOOK 2'
