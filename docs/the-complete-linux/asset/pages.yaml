  md: '# # PERSONAL ACCOUNTANCY SOFTWARE

    GnuCash 1.8


    Using your PC to manage your business or household finances can really help you
    get much more control over your cashflow. Andy Channe can help bare his immense
    accountant.


    or users who have previously relied on a Windows application such as Quick or
    PS MS to handle their finances, the migration to GnuCash can be a little disconcerting.
    GnuCash is much similar in structure to something like Sage with adherence to
    real accounting principles than the home-oriented packages. Furthermore, your
    intuitive ''regular'' style across most common tasks and it, the difficult stuff
    still goes in the background.


    For the non-accountants out there, the application works on double entry, which
    is the basis of that, like physical money simply adjusts as you come from to some
    other place. Every transaction entered into GnuCash has at least two accounts.
    Instance, money paid for moving your moves to the supermarket, or salary simply
    moves from money to your employer. Every transaction must have both a credit and
    debit entry. GnuCash uses these for:


    +   - ASSET. Asset includes things like cash in accounts, stocks, shares, and
    your home and everything you own. With accounts, a debit entry increases the value
    of your account, while a credit entry decreases it.

    - LIABILITY. Liability is the opposite of an Asset, so a debit entry increases
    the value of your account while a credit entry includes entries such as mortgages,
    loans, credit cards and fine.

    - INCOME. Income includes details of interest, salary dividends etc. Credit entries,
    decrease the value of your income account.

    - EXPENSE. This tends to be the most numerous type of account. It details your
    daily expense and may include food, petrol, rent, utility bills, etc. Debit expense
    account balances while credit entry decreases it.


