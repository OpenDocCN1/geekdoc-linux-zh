    # CUSTOMISATION


    The exposed properties of a Bean can be customised at design time. A bean tool
    will provide an appropriate interface to manipulate properties depending on class.
    For simple classes use standard controls and a string chooser which will suffice;
    for more complex classes, bean vendors can use custom GUI controls for setting
    a property''s value. Thus, some of colour-palette tool could be provided for setting
    properties of class. For complex beans, a Customizer class can be applied to provide
    a complete GUI for maximising the state of that bean. An example here would be
    some kind wizard to lead you through the setup of a bean.


    # COMMUNICATION


    Beans can communicate with one another by broadcasting and listening for events.
    The JavaBeans event model is based on the AWT''s event mechanism, which should
    be familiar to any type of communication. A bean is a source of certain types
    of events and it can generate events that listeners register with, so listeners
    are notified when an event occurs or is ''fired''.


    # PERSISTENCE


    Beans can use Java''s serialization mechanism, as implemented by the java.io.Serializable
    interface, to save and restore a bean''s properties. You can customise a bean
    in a builder tool, save it and then restore it to recreate the state of the bean
    at a later time.


    # METHODS


    As well as accessor methods for manipulating properties, beans use getter/setter
    methods for performing operations, just like any Java class. There are no special
    conventions for naming of a bean''s properties. All public methods will be visible
    to a builder tool.


    # Property conventions


    To reiterate, Java bean is a normal Java class which adheres to certain conventions
    and these conventions let a builder tool discover its interface. We don''t have
    the room for the complete list, but we use the naming rules for properties. There
    are no special restrictions on the class that a bean may have


    When a bean defines a property P (a property name is the name that will be displayed
    in the builder tool) of T (if T is a scalar, a primitive type or an array class)
    its getter setter method must have the following pattern


    ```

    public void setP(T p)

    ```


    Properties can access any type of object, checked or unchecked, via the methods.
    If a property is read-only, then a setter method should not be provided. Also,
    these setter methods should also obey the usual conventions about the naming of
    properties. For example, a property of type int will be accessed via the methods.


    ```

    public int getWidth()

    ```


    ![](img/e96ec2317ee78634033c233818367b96_186_0.png)


    The MetBeans project is a full Java IDE tools for visually assembling and manipulating
    beans.


    ```

    public void setWidth(int width)

    ```


    Now we practise how the first property of the name in the bean is notified


    As a special case, for bean properties, you can customise its name with the pattern:


    ```

    public boolean is()

    ```


    For example, a bean property display is the name it would be


    ```

    public boolean isDisplay()

    ```


    As well as scalar properties, a bean has indexed properties or array type. In
    this case, getter and setter methods can be provided to access the array as a
    whole or a single element. For a property of P of T array its access must follow
    the pattern:


    ```

    public T getP(int i)

    ```


    ```

    public void setP(int i, T p)

    ```


    when its element must conform to the following:


    # Bound and unbound


    As well as and indexed properties we have seen, a bean''s property is either ''bound''
    or ''constrained''. A constrained property is one that supports the support of
    property events to register listeners whenever the property is modified. Constrained
    properties take one step further and allow a listener to change a property that
    is value bound


    Bound properties must meet the same naming conventions as standard properties,
    but this does not allow the introspect to tell the difference between a bound
    and unbound


    ```

    public Object getBean()

    ```


    A bean that has a constrained property must be provided standard methods so that
    listeners can register and unregister for notification of property events. We''ll
    look at the JavaBeans event mechanism in next detail time, as this is easy to
    implement because Java supplies all of the infrastructure for the event mechanism.


