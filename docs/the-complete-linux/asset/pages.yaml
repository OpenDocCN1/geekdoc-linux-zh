    \ materials and textures of definitions are highly configurable. Blender includes\
    \ powerful lighting facility in which scenes can be lit by a variety of different\
    \ sources.\n\nAlthough Blender is very capable for still image, it is also extremely\
    \ capable as an animation studio with a roof of features for animating characters,\
    \ joint movement and many other disciplines. More Blender includes basic animation,\
    \ journey animation and many other difficulties. These animations can also be\
    \ exported to a variety of video formats.\n\nOne thing that many people do not\
    \ realize is Blender is a game engine. Blender includes a powerful engine in which\
