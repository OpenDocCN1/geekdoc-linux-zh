  md: '# # Tutorial GIMP


    ![](img/e96ec2317ee78634033c233818367b96_85_0.png)


    This is the catch-all menu for plug-ins that don''t fit quite anywhere else. Many
    of these tools are script based, either Perl or Script-Fu. Most of these useful
    are not included in the stock GIMP installation, such as the Web gallery tools
    and the animation and video tools. But most be downloaded from the GIMP Registry.


    | File |

    |---||

    | New... | Ctrl+N |

    | Open... | Ctrl+O |

    | Acquire | |

    | Preferences... | |

    | Dialogs | |

    | Quit | Ctrl+Q |


    # ## The File and Xns menus


    GIMP''s tools provide three menus - File, Xns and Help. While the purpose of File
    is fairly obvious - that launch web browsers to online document and other sites
    - the purpose of Xns is less so. In fact, it''s commonly known that these menus
    relate to the canvas.


    If you used to use Photoshop, one of the first hurdles in GIMP will be getting
    used to the absolute canvas concept. Menu options are there for anyone with an
    open canvas. This means that menu options that need their images will either show
    up in the currently active canvas or in a new window.


    The Xns menus provide options that are not dependent on any open canvas window.
    The menu is divided into two parts. The top portion options are more plug-in and
    script developer oriented. These include the DB Browser and DB Explorer for searching
    for API information and the Path Registry


    The File menu is where you''ll begin to open existing documents or create new
    windows. You can also configure GIMP directories and variables. If you use a system
    such as XANE or Quitesman they menus will appear under the Acquire submenu here.


    | |

    |---||

    | 1. toolbox | Ctrl+1 |

    | 2. toolbox | Ctrl+2 |

    | 3. working-environment | Ctrl+3 |

    | 4. gimp-info | Ctrl+4 |


    editor adding and other useful information. The lower half of the menu contains
    tools for regulating layers and buttons as well as the main panel.


    Few of these options are used by the average desktop GIMP user; power you will
    find the DB Browser useful. All are part of the stock GIMP distribution. They
    are added by additional plug-ins which can be downloaded from the GIMP Registry,
    via various sites around the world, or from archives of over 100 pretty plug-ins.


    ![](img/e96ec2317ee78634033c233818367b96_85_1.png)


    | |

    |---||

    | New Layer... | Ctrl+N |

    | Duplicate Layer | Ctrl+I |

    | Anchor Layer | |

    | Delete Layer | |

    |Layer Boundary Size... | |

    | Layer to Image Selection | |

    | Merge Layers... | |

    | Merge Down | Shift+M |

    | Add Layer Mask | |

    | Apply Layer Mask |

    | Delete Layer Mask |

    | Add Alpha Channel |

    | Alpha to Selection |

    | Edit Layers... |


    Managing layers requires the use of the Layers menu. It can be accessed by right-clicking
    on any layer. Layer management includes four functions: changing and deleting,
    changing the stack (including merging), merging layers, and deactivating the layer
    mask. A masked layer is offered in the canvas which will also allow to layers
    to edit edges.


    You''ll need to use the Layers dialog to open channels, mostly on the right. The
    Channels tab is used to allow advanced users to select channels. The Paths tab
    is used to create line paths either in work or outside using the Edit Layer option
    of the Canvas Menu.


    One of the most difficult new users have to come with the concept of layers. A
    layer is like a transparent acrylic sheet that you work on is composed in different
    ways - ''blend mode'' in order to generate the composite image. Layers have many
    features and can be moved, resized, and resized and hidden in the stack of layers.
    The Layers Dialog is used to manage layers and most users will find this window
    opened nearly all the time


    A feature used in large portrait design is the layer mask. A layer mask shows
    out sections of a layer. The mask corresponds to the part of the image you want
    to show through dark areas of mask covering out sections. Masks may then be used
    without modifying their contents. This permits a single image, a double purpose-
    to be used with different blend modes using parts of the image without changing
    the original image


    86 THE COMPLEX LINUX HANDBOOK 2'
