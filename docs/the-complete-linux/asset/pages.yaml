    # TCP/IP network infrastructure with Linux


    PART 3 Dr Brown introduces our series of tutorials on TCP/IP Networking with a
    discussion of firewalls and a survey of the key network applications which run
    over TCP/IP.


    Back in the early days of the Internet, computers on local area networks and universities
    had full connectivity to the Internet. Anyone could connect to any of those machines.
    Access controls were improved by the applications so the ftp server would require
    you to provide a name and password.


    For years, I used to feel small when I was out of office trying to log in to my
    machine at work, running the mail command. That is not simple anymore. Many organisations
    provide resources to their employees, such as command-line tools, company databases
    and internal websites, that do not want outsiders to connect. Similarly, they
    may restrict the range of outside services people can access. One of the ways
    of imposing such rules is through the use of a firewall.


    # Additional Rules


    In the simplest case, a firewall is a machine which performs IP forwarding between
    a LAN and the Internet as is shown in Fig 1. We use this idea in the article,
    and we call it a filter. But in a router routing decisions are only based on the
    destination address of the packet and it is discarded if it cannot find an appropriate
    route.


    Firewalls enable you to define additional rules determining whether the packet
    will be forwarded or discarded. In this way the machine acts as a gateway which
    protects agents from the outside world or services which should not be allowed
    to access. Outbound traffic can be restricted. The rules can be based on many
    aspects of the packet, including the source and destination IP addresses, protocol
    type (TCP UDP) and the port.


    As a very simple example, you want to allow access from the outside world to your
    web server on internal network which has an IP address of 184.169.0. We want to
    allow TCP connections on port 80. We establish firewall rules as follows:


    +   - Inbound TCP packets from any IP address to port 80 on the 184.169.0 should
    not be forwarded

    - Outbound TCP packets from port 80 on the 184.169.0 net to any IP address should
    be forwarded


    The default policy (if it''s the case that no other rule applies) is to discard
    the packet


    This is just the simplest possible example — many firewall rulesets grow to several
    hundred lines. This example, however, highlights one important aspect of configuring
    firewalls (and, even of establishing system security generally)—you start writing
    rules until you have a defined policy which is supposed to be allow with traffic
    and should also be secure in the event of a security breach (or an attack detected).


    Many of the network services discussed previously in this series —such as DNS
    and DHCP —are provided by programs which are available for a range of Unix, and
    in some cases operating platforms.


    In contrast, the packet filtering coding, which forms the basis of firewall construction,
    is simple in the Linux kernel —no other operating system does it the same way
    as Linux does. The kernel version 2.0 was as good as we know; the version 2.2
    was known as aepochs, and the kernel we have pockets.


    These are the names of the adaptive tools that are used to protect the packet
    filtering implementation of the Linux kernel.


