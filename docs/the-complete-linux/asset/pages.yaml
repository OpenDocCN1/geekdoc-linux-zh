    # Routing


    We discussed a bit in the last article. To recap, LAN technologies such as Ethernet
    can deliver data to machines on the same physical network. To reach other networks,
    the data have to be sent to, and forwarded by, machines routers. In the Unix world,
    a general-purpose machine configured to route packets is often referred to as
    a router.


    The ways in which you can use the Linux kernel are many, but you can construct
    a capable router with a Linux box at low cost. Any Linux system that has more
    than one interface can act as a router, even if one of them is configured to have
    no forwarding enabled in the Linux kernel. This typically requires a one-line
    change in the appropriate system configuration file. The only thing you need to
    do is to put some entries into the routing table and - hey - presto!


    Putting entries into the routing table turns out to be hard part. In fact, the
    term ''routing'' refers to the process of deciding how to forward datagrams, and
    the table is also used to describe the whole world of managing the router.


