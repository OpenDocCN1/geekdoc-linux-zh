  md: '# SPEED UP LINUX!


    Join our experts in a tour of tweaking and optimising, as we try to get every
    last clock cycle used to full. Your journey to a turbo-charged Linux box begins
    here!


    ![](img/e96ec2317ee78634033c233818367b96_218_0.png)


    # SWAP SPACE


    One subject that is always store to swap space there is is someone asking how
    much swap space they should allocate for Linux. In the old days, the general rule
    of thumb was that swap should be twice the size of physical memory, but with today
    having huge amounts of physical memory, some huge swap partitions seem really
    de-cluttering.


    That recognizes all of the internal and external hardware apart from the odd problems
    with worstms. But the price you pay in such interface is performance; there is
    no way your system can exactly match your needs, because it can''t determine what
    your needs really are.


    For a desktop or server, it is often advisable to have swap available, if only
    to cope with the urgent need to run just one more application, or spawn one more
    process; in practice, you will find that swap is rarely used when there is plenty
    of free memory. Just because swap space is allocated, doesn''t mean it is actively
    being used. When swap is in a now closed operation, it is not cleared unless it
    is needed for something else.


    Next pages, we will be looking at a range of things that will increase the performance
    of your Linux. Some of them are not as vital as others, and some are continually
    restricted by the kernel, but it is up to you when to try them.


    So, how much?

    There isn''t a great deal of advice that having too much swap space is detrimental
    to performance, but having too little can waste disk space. The reverse is true
    through much


    Many Linux devices use no swap space at all for this reason, but to properly profile
    memory usage and determine an upper limit is more sufficient.


    # BLUFF!

    Processor opt


    Choosing the processor option in the kernel configuration doesn''t really make
    the performance of your PC, though it does make your kernel more likely to compile
    properly.


    We''ll be discussing some mighty tweaks to your system, so get ready to tweak!


