    device - and C shows the device up or down F may enable bootable device between
    Hard Disk or Removable Disk that is not installed. |


    The Mandrake Centre is where you set up your hardware, add peripherals, such as
    printers and scanners, and keep your software to date.


    The Network & Internet sections show what they say, say System global configuration
    programs if not offline. Software Management is the way to get the latest set
    set up and use more. Here is where you install new software packages and update
    entries. It is well worth running Mandrake Update from here to configure your
    Internet connection. If any security exploits come to light, they are generated
    very quickly and updates made available, so use this section to keep your computer
    safe and secure.


    # Install won''t start?


    DVD contains a selection of bootable floppy images. We use the one if you are
    cloning, so insert a temporary window, blank or bootable floppy disk in the drive


    Some DVD devices can cause problems during the initial hardware scan of the installation.
    If your system hangs, at the start of the installation, try unplugging all possible
    USB devices and starting again. Some keyboards and mice are fine, but some generic
    have caused problems in the past. You can try on again with one USB scanners,
    printers, and so after installation by replacing the Mandrake Control Centre.


