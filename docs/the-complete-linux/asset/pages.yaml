- img_proc: true
  md: '# ISOLATING COMPLEX SHAPES


    A common question from GIMP users is how to make selections of complex shapes
    in order to paste them into another image. The trick isn''t to try and use the
    generalized selection tool like the Freehand orer tools, but to use a mask to
    grab the shape''s intricate details. In this example we''ll take an image of a


    flower and stem from a book of clipart and scan it, place it over a solid background
    and colorize it.

    We create an image large enough to hold our flower and fill it with a colourful
    background. This image aside for now. We won''t be using it until our last step.


    ![](img/e96ec2317ee78634033c233818367b96_93_0.png)


    +   1 We start with a scanned version of some clipart. We''re using the KOWA backend
    driver to XScan and SAME with an Epson Perfection printer. The scanning software
    lets us select a section of the page, but we can''t completely isolate the flower.
    We''ll have to remove the extra bits using the GIMP - this is a technique used
    every professional digital artist to isolate images in grayscale. We could scan
    in black and white, but that we would remove much of the detail in the flower.


    ![](img/e96ec2317ee78634033c233818367b96_93_1.png)


    +   2 The scanned image of this complex shape is not completely black and white.
    We first use Image>Colors>Levels and select Auto to make sure we get a full range
    from absolute white to absolute black. But we still have some non-white pixels
    (which we probably can''t see them) in the area surrounding the flower. We''ll
    use Brightness to get rid of most of them and increase the contrast bit. Too much
    contrast change will cause us to start losing details in the flower, however.


    ![](img/e96ec2317ee78634033c233818367b96_93_2.png)


    ![](img/e96ec2317ee78634033c233818367b96_93_3.png)


    +   3 To rid any non-white artifacts from the area around the flower, we''ll use
    Select by Color (Colour:Select-By-Color...) with a 1 pixel Fuzziness threshold
    and coloring the white of the image. This shows small regions of non-white pixels,
    including the area that comes from the scanner bed. We''ll invert the selection
    and paint over those areas with white. Deselect the selection and repeat the Select
    by Color/paint preset until we''re satisfied.


    +   4 Invert the image (Image>Colors>Invert). Add a white layer to the coloured
    image. Create a white mask for the white layer. Copy the flower and paste it into
    the mask of the white layer. If the flower doesn''t fill layer, scale the floating
    selection. We now fill the white layer with any colour to change the colour of
    the flower.


    94 THE COMPLETE LINUX HANDBOOK 2'
  merge: -1
