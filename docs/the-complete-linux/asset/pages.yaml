  md: '# # GRUNGE


    Grunge is a popular style these for print work. Generating grunge is a very personal
    thing – like the music form – so this texture may or may not produce what you
    might call grunge. But it does for us.


    ![](img/e96ec2317ee78634033c233818367b96_90_0.png)


    ![](img/e96ec2317ee78634033c233818367b96_90_1.png)


    ![](img/e96ec2317ee78634033c233818367b96_90_2.png)


    +   1 Start with clouds. The clouds should be relatively soft, little to no harsh
    edges if possible. Less cloud is better for greater overpower over the rest of
    the image. If you can''t get yourself, try a Random Sort of 1024x2096, a Uniform
    Noise layer Nitrox-like scaling with a Scaling of 1.24. Add this to Noisy using-Independent
    color channels set between 0.05-0.16.


    +   2 Use the bump map option of the Emboss filter (Filters>Distorts>Emboss) on
    this layer. Use a low azimuth and elevation (25-35), and a moderately high depth
    (60-70). Whatever else it will be blended. Duplicate this layer.


    +   3 Now comes the trick. We need to set up the GIMPression! plugin (Filters>Artistic>GIMPression!)
    – it''s complex but can produce fantastic textures. We''re going to apply this
    to the layer. Select the Size value and apply it. Sets the initial parameters
    to sensible default, but we will change them. First, Change the brush to canvas2.gimp.
    You can also use the Aspect Ratio if you like. Now change orientation from 0 to
    360 using Random option. In the Size tab, leave it with a minimum of 4 and a maximum
    of 13 using the Slider. Finally, Set the Plasma Density to 15 and make them Evenly
    distributed. This might be a bit slow to calculate, but then once you click OK
    on the filter will begin processing. Don''t be surprised if it takes a while before
    do so, that will add to the time it takes to finish this step.


    ![](img/e96ec2317ee78634033c233818367b96_90_3.png)


    ![](img/e96ec2317ee78634033c233818367b96_90_4.png)


    ![](img/e96ec2317ee78634033c233818367b96_90_5.png)


    +   4 Use Color Select (Select-Select by Color) to select a region of the Bump
    map layer. Create a transparent layer above this and fill it with selection black.
    Move the transparent layer to the top of the layer. Apply the GIMPression layer.
    In the filter window, select the grunge function and Effect 4 in this filter.
    You should need to change any of the other parameters.


    +   5 Use Select by Color Again, create a transparent layer above this and fill
    with black in this new layer. Be sure the new layer is moved to the top of the
    layer stack. The order and blend mode should be clear:


    +   1 Black filled from GIMPression layer with layer Mode set to Dodge.

    2 Black filled from Bump Map layer with Layer Mode set to Multiply.

    3 GIMPression layer with Layer Mode set to Screen.

    4 Bump Map layer with Layer Mode set to Normal.


    +   3 Variations of blend modes and the order of layers may help produce the effect
    you want. Also, flipping the direction of the original or duplicate layer may
    help. Color can be added to any layer to a top layer with the layer Mode set to
    Color or perhaps some other blend mode.


    7 A selection of grunge ends - it all depends on what values you choose.'
