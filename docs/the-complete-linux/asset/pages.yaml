  md: '# NON–DESTRUCTIVE EDITING


    # # Blend modes


    **PART 4** Blend modes can modify colour content with simple brush strokes. *Michael
    J Hammel* shows us how...


    ![](img/e96ec2317ee78634033c233818367b96_95_0.png)


    Modifying an image by changing the pixels might seem the only way to create effects
    with the GIMP, but such changes are destructive in nature, making it almost impossible
    to recover the original image if you change your mind. A better solution is to
    create effects without changing the pixels – which called non-destructive editing
    – through the use of Blend modes.


    When painting with a paintbrush, the pixel data provided by the brush stroke normally
    replaces the pixel data over which the


    is applied. Blend modes allow brush strokes and other image data to be combined
    in ways beyond the standard replace option. Blend modes are available in all the
    painting tools (Paintbrush, Gradient Tool, Bucket Fill, etc) as well in the Layer
    and Channels windows. In the case of the blend modes, describing how they can
    be applied in a non-destructive manner.


    +   - A blend mode is a method describing how a pixel will change when mixed with
    another pixel. In the case of layers, blend modes define how pixels in a higher
    layer will be combined with pixels in the next layer. Use of Layer modes is to
    produce a colour negative from an image by placing a layer on top of the image
    which can be disturbed and used to create a complex selection or mask layer. The
    tutorials here show all the different blend modes available in the GIMP and how
    they can affect image data. Reading these tutorials, keep in mind that not every
    image works with every blend mode. Experimentation is key to understanding the
    topic.


    96 THE COMPLETE LINUX HANDBOOK 2'
  merge: -1
  pgno: 95
- img_proc: true
  md: '# MULTIPLY, DIVIDE, DISSOLVE


    Blend modes can be used to lighten dark areas of an image, add colour to lifeless
    images, and produce unusual effects, all without actually modifying the original:
    in the following set of images we''ll see three blend modes change the mood of
    an image with very little effort on our part.


    ![](img/e96ec2317ee78634033c233818367b96_96_0.png)


    ![](img/e96ec2317ee78634033c233818367b96_96_1.png)


    +   1 We start with our original The picture shows a popular market in Seattle
    lit by low-power bulbs and plenty of reflected outdoor sunshine. There is a definite
    warmth feeling from the red and orange colours in the centre and bottom half of
    the image, but we can change this to be much more dramatic using blend modes.


    ![](img/e96ec2317ee78634033c233818367b96_96_2.png)


    ![](img/e96ec2317ee78634033c233818367b96_96_3.png)


    +   2 Adding to the warmth is easy using the Multiply mode. We add a new layer
    above the original image. Change the foreground color to a reddish-orange and
    background to white. Apply a linear gradient mask from the left corner of the
    new layer that flows to the bottom. Now change this new layer blend mode to Multiply
    (Burn). The result is that the highlighting is lighter on that side of the market.
    We''ve reduced the opacity of the new layer a bit to reduce the hardness of this
    effect. Multiply mode always makes the colour darker or leaves it unchanged. Multiplying
    a layer will not change the visible image.


    +   3 Alternatively, we can change the mode to be brighter by removing some of
    the warm colours. To do this change the new layers blend mode from Multiply (Burn)
    to Divide (Dodge). Now the light in the upper right is brighter and casts a stronger
    blue coloured light on the market. A Dodge blend with whiteness has no effect.


    +   4 A less dramatic effect can be generated by selecting all of the background
    layer (CTRL-A) and doing a Bucket Fill using the Divide blend mode. Double click
    on the Bucket Fill tool in the Toolbox to open it Tool Options window. Set the
    opacity to about 50% for the Image and the Mode to Divide then is using the Tool
    blend mode, not the Layer blend mode. This is one method of adding grain to the
    image. A Burn blend with black has no effect.


    ![](img/e96ec2317ee78634033c233818367b96_96_4.png)


    THE COMPLETE LINUX HANDBOOK 97'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# SCREEN, OVERLAY, BEHIND


    The mode you use on any image to bring out detail will depend on the image itself.
    Each mode works with different colours. In the previous tutorial you saw how a
    relatively well lit image could be enhanced with Multiply and


    Underexposed images are common with low-end digital cameras that don''t have many
    usable definable features. In a poorly underexposed image you might try Screen
    or Overlap, as we see below


    ![](img/e96ec2317ee78634033c233818367b96_97_0.png)


    +   1 Our image, outside and facing the sun. Without a bad shot, dark areas are
    underexposed. We need to bring detail in the foreground trees.


    ![](img/e96ec2317ee78634033c233818367b96_97_1.png)


    +   2 Add a layer, filled with white. Add a layer. Click on the gray layer''s
    mask to make it active. Click on the white layer''s mask and paint. Anchoring
    layer into the new layer mask. Change the white layer''s blend mode to Overlay.
    This time we get a better result.


    ![](img/e96ec2317ee78634033c233818367b96_97_2.png)


    +   3 In step 2, make the white areas look lighter. Black overlay masks the dark
    areas. A 50% gray over works with anything. To ensure parts of the layer are not
    affected, duplicate the original layer, add a layer mask from the mask of the
    layers below it. Then apply the layer mask (press and hold the right mouse button
    to paint). Select the entry (Ctrl+A). Select a red foreground color (any color
    you will choose but not black that will contrast with the white). Set the Blend
    mode (in the Tool Options window) to Blend. In this fills, the layer fills with
    the white color


    # ADDITION, DIFFERENCE, SUBTRACTION


    There are multiple blend modes that work very similarly, such as the Screen and
    Addition. Brighter areas brighten an image more than the darker areas. With Addition,
    each pixel is added directly to the


    lower layers without regard for how bright or dark that pixel might be. We will
    look at Addition, Difference and Subtraction. These modes can be used to create
    colour effects of images.


    ![](img/e96ec2317ee78634033c233818367b96_97_3.png)


    +   1 The original image is colorful and fairly balanced with respect to brightness.
    We don''t really need to modify it, but we can easily show how Addition and Subtraction
    will affect it.


    ![](img/e96ec2317ee78634033c233818367b96_97_4.png)


    +   2 Adding a layer of 50% gray and setting the layer blend mode to Addition
    will us really see an approach to the original image. Addition adds each pixel
    to the composited pixels of the layers below, with the maximum result being white.


    ![](img/e96ec2317ee78634033c233818367b96_97_5.png)


    +   3 Adding a layer of white and setting the layer blend mode to Difference will
    give us a colour negative of our image. Difference subtracts the current pixels
    from the composited pixels of the layers below. The absolute value of the result
    becomes the new composited pixel.


    +   4 Duplicating the 50% gray layer and changing the blend mode to Subtraction
    will get a darkened image. If we set our layer to subtract, everything will turn
    to black, except if the resulting composited pixel is negative, then it is made
    black (a zero value).


    98 THE COMPLETE LINUX HANDBOOK 2'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# DARKEN, LIGHTEN, VALUE


    The Darken and Lighten blend modes operate opposite of other to merge a layer
    with the layers below. A ghosting effect will occur with the Value blend


    mode, especially if the layer is blended desaturated (Image)>Colors>Desaturate.


    ![](img/e96ec2317ee78634033c233818367b96_98_0.png)


    +   1 We start with two images, both of which are very colourful. We''ve placed
    the puppy''s image in a layer on top of the balloon image for this example.


    ![](img/e96ec2317ee78634033c233818367b96_98_1.png)


    +   2 Setting the puppy layer to darken produces a soft ghosting effect. In this
    mode, if a pixel in the balloon is darker than the corresponding puppy in the
    layer the composite uses the balloon pixel. If the puppy is then darker


    ![](img/e96ec2317ee78634033c233818367b96_98_2.png)


    +   3 The opposite of Darken is Lighten. In this case, if the pixel in the puppy
    layer is lighter than the corresponding pixel in the balloon then the layer is
    used in the composite. The result is another ghostly image, though this time a
    bit lighter overall.


    ![](img/e96ec2317ee78634033c233818367b96_98_3.png)


    +   4 Value works in a similar manner but works in a different color space (HSV)
    (RGB). The result is a bit like a negative blending image. There many color spaces
    can be processed in GIMP users will work directly and leave color space conversions
    to filters to handle automatically.


    # COLOR, HUE, SATURATION


    +   1Blending with Color is the fastest way to colour a desaturated image without
    modifying the image itself. The lightness of the lower layer defines the structure
    of the composite image (a combination of the Hue and Saturation) in the blend
    layer defines the colors.


    +   2 Working with Saturation and Hue modes is a little more difficult to explain.
    Both work in HSV instead of RGB (though this is done invisibly, without the two
    coloured patterns to demonstrate these two modes.


    ![](img/e96ec2317ee78634033c233818367b96_98_4.png)


    +   3 In Saturation mode we can see the image (the weaving) of the original layer
    is kept intact along with some of the colouring. What changes the intensity of
    the colours. Where the Saturation layer is dark, the weaving is dark; Where the
    Saturation layer is light, the weaving is light.


    +   4 In Hue mode the color Intensities (and Hue) follow the blend layer while
    the structure remains the weaving. This is a simplification of how Hue work and
    it will take lots of experiment before you find the usefulness of these two blend
    modes iii.


    ![](img/e96ec2317ee78634033c233818367b96_98_5.png)


    THE COMPLETE LINUX HANDBOOK 2 99'
  merge: -1
