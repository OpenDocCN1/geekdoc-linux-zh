  md: '# 3D MODELLING


    # Blender textures and materials


    **PART-4** Juno Bacon shows how to make our models more attractive by giving their
    surfaces a more lifelike patina.


    or in this Blender series, we have been looking at some basic modeling. Although
    this is good general introduction to the Blender, all of our models have grey,
    lifeless objects that look neither realistic nor appealing. In this tutorial we
    plan to rectify this situation and explore how we add materials to our scenes
    to add colour to our objects.


    # Material girl


    For those with no experience with 3D modellers such as Blender, the concept of
    materials may be new to you. Material is basically the colouring of an object
    to make it look more convincing or correct. It may be a real-world scene, so the
    material must look as realistic as possible to the viewer. It is important to
    remember that a great looking scene with poor-quality materials will really limit
    the final quality of the scene.


    Although the concept of material looks like a physical thing, it is actually just
    an image or colour that has been designed to look like the desired material. A
    classic example is moulded plastic. If you think of an actual moulded item (such
    as one of those boxes you had to make in Design/Technology classes at school)
    you will be aware that the


    material plastic looks quite shiny and has a very characteristic look. If you
    now consider a material like steel, a similar box made out of that will look far
    different from the plastic. The actual object in the scene is no different (in
    terms of how you created it) the material vastly change how it is finally viewed.


    Blender not only has support for materials, but has extensive support. "What is
    a texture?" I heard some of you well, if you need the great explanation in Michael
    J. Hammer GIMP tutorial (see page 88), a texture is a material''s textual detail
    to make your object look more realistic using a graphical representation of materials.
    If you have a lump of untied wood, you will see grains, knots and other small
    details. If you wanted to create a wooden table in a scene for example, you would
    need a ''Wood'' texture, as a material would not give this detail.


    # Understanding materials


    Materials is a large and complex subject, and there''s certainly no enough space
    here to discuss all of the theory behind the complex beasts. I will cover some
    of the theory that is important to knowing how to create materials effectively.


