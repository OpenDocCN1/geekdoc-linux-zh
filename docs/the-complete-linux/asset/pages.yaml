  md: '# Practical PHP Programming


    One feature we''ve consistently asked to cover in depth is output buffering, so
    by Paul Hudson is looking at it in some detail.


    Output buffering was introduced in the original release PHP 4, yet for one reason
    or another it has still yet to become common in websites. This is a great shame,
    because without buffering, PHP sends the output of your scripts to your web server
    before it''s ready – this might be by line or code. As you can imagine, the need
    to send little bits of data is incredibly slow, however much more annoying is
    the fact that you''re restricted in the order you can send data. Output buffering
    solves this problem by allowing you to buffer your output and send it when you''re
    ready to do so, or even to not send it at all, if you decide.


    We had lots of requests for PHP tutorials on particular topics, and this was the
    most common. Many people didn''t seem to understand the basic OOP concepts, so
    we broke this tutorial down into bite-size chunks to make each point clear before
    moving on.


    # OB Advantages


    As most people who work with cookies and other HTTP headers will know, it often
    quite pays to order your output properly. In HTTP, you always need to send header
    data before content, which means if you want to set a cookie half-way through
    a script it''s impossible to rescue by letting "send" cookies at any point in
    your script – it stores these cookies until the HTML data then sends them together
    at the end, in the correct order.


    The most popular advantage of output buffering is that you can compress content
    before sending it. Due to the fact that HTML is lots of very simple, repeating
    text elements, and that normal text on a web site is also very easy to compress.'
