    # The key to cheap file distribution


    # You mentioned seeding, what is it?


    The torrent file contains metadata about the file, hashes of the pieces and the
    URL of the tracker. The tracker has details of which pieces are available for
    download. Since BitTorrent is a peer-to-peer system, it relies on someone else
    having pieces of the file to give others, but right now you have the only copy.
    So you need to seed the process of making this copy available to other people.


    Seeding refers to the current location of the file, as described in the section
    on resuming a transfer above. BitTorrent recognizes that you already have the
    file and gives you credit to continue to make the file available for others. Since
    you presumably want your file to be available all the time, it is best to start
    this download at home (or from your desk if you don''t have the client installed).
    As soon as others begin downloading, they will provide pieces for others, so the
    load on your internet connection will only last as long as it takes for one copy
    to be distributed. After that, each piece of the file is held by at least one
    of the current downloaders.


    ![](img/e96ec2317ee78634033c233818367b96_142_0.png)


    # If I have a number of files to distribute, should I put them into an archive
    or distribute them?


    Generally you should distribute files in their usable format. There are two reasons
    for not packing the files into an archive. The first is that it becomes harder
    for those downloading the file as they have to unpack the archive before they
    can use the files. Importantly, if you unpack the archive to the individual file,
    and then delete it to save disk, you cannot make the files available for others
    to download, as the torrent file only knows of its contents.


    # Are there other BitTorrent programs?


    There are many programs besides the official BitTorrent client, BitTorrentSwift
    allows simultaneous downloads for all the torrent files in a specified directory.
    There are also independent programs, including clients, torrent builders and trackers.
    Most of these are for Windows, one runs on a Java VM. The official interface released
    is the stable and safe option, but others have many other features.


