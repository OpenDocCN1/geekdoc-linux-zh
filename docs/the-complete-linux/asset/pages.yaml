  md: '# USB peripherals and drivers


    Getting everything from a USB drive to an awesome webcam working!


    Universal Serial Bus devices have become ubiquitous in the last few years. The
    serial protocol is flexible enough to support all sorts of differing functionalities
    and the hardware is quite inexpensive.


    USB support has been included in the Linux kernel 2.2.7 for most devices, and
    certainly all the common generic types of device are pretty mature now.


    If you have a look inside the kernel configuration, you will find that there are
    a number of modules for USB which generic and specific devices, as well as the
    USB host controller. Some of the specific drivers include support for the Rio,
    Wacom tablet (on the next page), iPad and some special cameras.


