    more than frustrating with the installation of software.


    To install software, you will need to install a range of equipment, standard GNU
    tools - gcc, make, and -ander, find helps for KDE, Gnome and others. Check the
    application documentation for requirements as vary from package to package.


    +   Everything seems better - it''s important! There are many ways to get software
    on your Linux machine:

    1. Pre-built binaries. These will usually be found in either Red Hat the next
    page or Package Manager (RPM) - these are the easiest options available which
    are often distribution-specific.

    2. Build from source. Advanced users swear by compiling software from the source
    as the final application is best and can make and handle any of the configured
    features.


    All source files for Linux are downloaded (or archived) as a compressed archive
    format. You then extract the files, .tar.gz or similar file. Once the file is
    extracted, compiling is usually a CLI process, and then that''s what we''ve covered
    over: _


