    # ## Dealing with Apache


    A web server is a piece of software, and things can go wrong. Luckily, Apache
    has a very logging facility and we can track down problems by looking at the log
    files. There are two main log files: the access and error logs, both located in
    /var/log/apache/


    The error log is what you will see if the server for some reason Apache is not
    behaving as you expect, or when you get errors trying to start or restart Apache
    what the problem is. The other file, access.log, is a record of all the accesses
    to the sites hosted on the server.


    When you look through the error log, you will see the details of the fault and
    a brief description of the error. These logs include the date of the problem,
    the error messages and any errors that the error file has recorded. The format
    of this logging is fully configurable, and it is recommended that you are aware
    of how to configure this log format to your needs.


    Configuring the log format uses the LogFormat directive. This directive allows
    a number of symbols within double quotes that are converted into different types
    of information that you need. An example of this is the LogFormat directive:


    The symbols used in this example display the format of the remote host (%h), the
    name of the log (%l), and the time taken to make the request (%t). There are a
    lot of other symbols, and they are described in the Apache 2 documentation.


    One of the problems with logging in Apache is the sheer amount of log that it
    produces. This is partly due to the sensitive nature of logging, and the fact
    that the server is often very busy. We can make use of Apache''s log script to
    rotate our logs after a predetermined period of time. To use this, you will need
    to ensure that the logrotate is installed on your system. You can find more details
    in the Apache 2 documentation.


    ```

    TransferLog "/var/log/apache2/access.log.%d.gz"

    ```


    This line will rotate the scripts from /var/log/apache2/access.log every 86400
    seconds (24 hours). This will give you a daily log that is accessible in /var/log/apache2.
    You will see each day the date has been appended to the end of the filename which
    is log g.


