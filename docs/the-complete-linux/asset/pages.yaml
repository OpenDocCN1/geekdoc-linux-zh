    send the data to its MAC address, which IP knows what it was. There is a protocol
    called Address Resolution Protocol (ARP) which is used to discover a MAC address
    from an IP address. ARP works by broadcasting a request to the local network,
    asking "what is the MAC address for 184.6.19.24?" Since this is a broadcast it
    is received by all the machines on the network, but only machine Q targets the
    target IP address, and replies to B: "I am Q, my MAC address is such." Now B can
    then build an Ethernet frame with the correct address to send the data to Q. If
    you have an ARP request every time you want to send data, it would be a bit inefficient.
