  md: '# # What on Earth is...

    # BITTORRENT?


    **Professional CD Editor Neil Bothwick** usually plays his cards close to his
    chest, but here he''s sharing a particularly juicy trade secret with us...


    +   - **I''ve seen this BitTorrent mentioned on several download sites, what is
    it?**

    BitTorrent is a file sharing protocol, and the programs to go with it, mainly
    distributing large files to a great number of users without placing high bandwidth
    and demands on a single server.

    - **So it''s a peer-to-peer(P2P) file sharing system? Do not enough of those already?
    What does BitTorrent do that makes it different from others, like Gnutella, Donkey,
    Limewire, or Kazaa?**

    Other programs are generally free using shared purpose

    - **It''s a torrent**


    collections of files, everything in your shared directory is available to anyone
    using the same system BitTorrent is amazed at the distribution of specific files,
    such as images. Other protocols allow you to download a file from a single location,
    BitTorrent will download a single file from many other computers, while uploading
    parts of it at the same time.


    +   - **How can I upload a file before it has finished downloading?**

    BitTorrent splits files into pieces, the default size for these pieces is 256KB.
    When you begin a download of a file, it starts downloading pieces of that file
    and starting them. As each piece is downloaded, the program lets its network know,
    so that others who need that may request it.

    - **Surely, if you are downloading all pieces of the same file, you will have
    the same pieces?**

    Instead of downloading the pieces in sequence, BitTorrent looks to see which pieces
    it has the copies of, and then de-loads the rarest pieces, and attempts to download
    the rarest. The aim is to ensure that all pieces maintain a mostly equal availability
    rather than having hundreds of copies of the first piece on offer and one or none
    of the last.


    +   - **OK, it must admit that it sounds very interesting. Where do I get it,
    and how do I install it?**

    The newest version is always available from the BitTorrent site http://bittorrent.org/BitTorrent/
    There are RMP and Debian packages, to be installed by hand. In the usual way,
    and with torrentify for the GUI program. As you may know, BitTorrent is written
    in Python and scripts, so you need Python. Installing the torrent is a matter
    of unpacking and copying the "py files files to somewhere in your path...location
    would be a good choice for a system-wide installation.

    - **Right, I installed it. Which program do I run to get a list of files available?**

    BitTorrent does not work like downloading.

    - **What''s this ''tracker''? (I thought you said earlier that BitTorrent was
    a P2P system.)**

    A tracker is a program that keeps tabs on what parts of a file are available for
    downloading. The torrent file contains details of the tracker which it asks the
    tracker where it can get the file. The tracker doesn''t hold any part of the actual
    file you want to download, it just tells you where to get it.


    ![](img/e96ec2317ee78634033c233818367b96_139_0.png)'
