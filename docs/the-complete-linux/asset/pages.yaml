    # What''s Missing


    While GIMP offers many features Photoshop shows you used to, there are still many
    missing. One piece is proper color management. The GIMP supports only CMYK management
    in its most recent versions, and so leaves things to be decided. Generally, earlier
    versions


    only in Grayscale and RGB colour. Additionally, channels in GIMP are limited to
    8 bits. These two issues combine make GIMP less ideal than Photoshop Still, it
    works and provides many of the tools necessary for excellent work bound by the
    GIMP, in print or in the video industry.


