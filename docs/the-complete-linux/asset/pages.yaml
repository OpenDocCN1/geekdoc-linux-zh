  md: '# CONCRETE


    One of the easiest textures to create is a simple concrete or plaster background.
    Such textures can be used to form a basic 3D box into a cement block or any flat
    surface in a pavement (US-sidewalk) or road.


    ![](img/e96ec2317ee78634033c233818367b96_88_0.png)


    ![](img/e96ec2317ee78634033c233818367b96_88_1.png)


    ![](img/e96ec2317ee78634033c233818367b96_88_2.png)


    +   1 Start with white background in a new Canvas window. Add a new layer and
    fill it with a grayscale color. Using the Plasma2 filter (Filters>Render>Plasma2)
    Set the color channels to be uniform Move one of the Scaling and Distribution
    to Noise randomize the shape to about 1.2 to create soft wispy clouds. Turn selection
    several times to find a reasonable result or try using the value 104227968 (which
    used in this example) as the Random Seed.


    +   2 Now apply some noise to this image using the Noisy filter (Filters>Noise-Noisy).
    Set by deselecting the Independent button. Move one of the channels (Red, Green,
    or Blue) sliders to align the edges. Apply a Bump map (Filters>Bump Map) to the
    layer. Move around your cloud. Play with the Amplitude, Depth and scale to account
    for noise from those settings. The Map Type options you choose are more important
    than these three others. Turn off the visibility of the cloud layer. After you
    have applied the Bump map the layer will hold your texture.


    +   3 Variations on this technique will produce many different textures. There
    are two filters: Plasma and Plasma2 (the latter is not included in the GIMP Registry
    distribution, Using the Plasma filter will generate a more natural looking example
    like the same used for Noisy and Plasma2 as the other, started with a textured
    cloud generated by the Plasma filter instead). When it looks correct finalize
    adjustments to Contrast and Brightness can soften the appearance and provide the
    initial pattern for complex textures like skin or cloth.


    # WATER


    This texture is again one of the more simple ones lately due to the availability
    of plugins in the GIMP distribution: Ripple and Waves. Another plugin, Surface,
    is available from its own website, but we will look at making this texture from
    scratch, as it is a useful skill.


    ![](img/e96ec2317ee78634033c233818367b96_88_3.png)


    ![](img/e96ec2317ee78634033c233818367b96_88_4.png)


    ![](img/e96ec2317ee78634033c233818367b96_88_5.png)


    +   1 As usual, start with a cloud layer. Plasma2 is best for this. The usual
    Plasma will work, but generates a filter that fills the layer with a random motion
    blur (Filters>Blur>Motion Blur) with a radius of. After this completes, apply
    a Gaussian IR (Filters>Blur>Gauss Blur) blur using a radius of 35. This will be
    heavily blurred.


    +   2 Next, add some Waves (Filters>Distort>Waves). Make the amplitude 47, the
    phase 210, and the wavelength 42. Duplicate this layer. Flip it horizontally and
    align the edges perfectly using the Flip Tool in the Toolbox.


    +   3 Merge the two layers. The result is good, but for a little variation in
    these too-perfect waves, we''ll apply a ripple (Filters>Distort>Ripple). Set the
    size to 125 and make it a wave with wavy edges. Finally, finalize the layers using
    the Color Palette of the Bucket. A good color for an aqua water would be a hex
    triplet of #005f9f.


    THE LINUX HANDBOOK 2 89'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# RUST


    A more complex pattern to produce that of metallic rust. The key ingredients for
    rust are both color and pattern. Be sure to experiment with your color choices
    to find one that meets your minimum standard.


    ![](img/e96ec2317ee78634033c233818367b96_89_0.png)


    ![](img/e96ec2317ee78634033c233818367b96_89_1.png)


    ![](img/e96ec2317ee78634033c233818367b96_89_2.png)


    +   1 Once again we start with a single white layer. Fill this layer with a dark,
    reddish-brown color. Try a test hex value of #a6711 in the Selection dialog. Your
    layers match here. Next, add the Noisy Filter (Filters->Noisy-Filter).Set the
    color channels to uniform (except concrete elements) and the channel settings
    between 30 and 45. Then duplicate this layer.


    +   2 Make the duplicate layer is the active layer. Distortion the layer with
    wind (Filters->Distort->Wind). Set the Threshold between 7 and 20 to make the
    wind blow from the left across edges using a blast-style effect. Add a transparent
    layer above the cloud layer. Render some gcloudcycles into slots where the clouds
    could be spotly. If you use the Pnoise2 filter, use a uniform distribution or
    a Cauchy distribution with an amplitude of -11.2. Norris scaling for both edges.
    Use Brightness Contrast (1 to 15) to adjust the amount of white so that there
    is about a 50/50 ratio, and preferably a little more in the cloud layers than
    now.


    +   3 Colorize the cloud layer using the same reddish-brown color you used on
    the original white background. To do this, make sure you select the entire layer.
    Then double click on the paint bucket tool. In the Tool Options window which appears,
    change the Mode to Color. Then click once on the canvas to apply the new reddish
    tint. Now set the layer for the Cloud layer to Multiply. You''ll see the effect
    show through the white parts of the cloud layer now.


    ![](img/e96ec2317ee78634033c233818367b96_89_3.png)


    ![](img/e96ec2317ee78634033c233818367b96_89_4.png)


    ![](img/e96ec2317ee78634033c233818367b96_89_5.png)


    +   4 Add a layer mask to the duplicate layer (right click on the layer name,
    then select Add Layer Mask). Select the cloud layer by clicking the mask. On its
    layer to activate it and press Ctrl-Shift-C to copy the selection. Mask. Then
    click on the duplicate layer''s mask in the Canvas. With the paint bucket tool
    selected, double click on the Flip tool in the Tool Options window, then click
    once on the Canvas and and click again on the Canvas. With the effect of flipping
    the mask horizontally and vertically. Change the layer mode for the duplicate
    layer to Divide (Aka Dodge).


    +   5 Turn off the visibility of the Cloud and duplicate layers for moment. Click
    on the Background layer to make it active. Now apply some more wind to the layer
    using the same settings. At this point you may see or may not see real distortion
    in the cloud layers. Set the Waves (Filters->Distorts->Waves) to Smear, adjust
    the amount from the beginning to 7, up to 80, and the Wavelength to 16.


    +   6 Select by color black regions in the top layer (the cloud layer). Increase
    the Threshold to grab more of the black area. Add a transparent layer to the top
    of the layer stack. It will still have this as Foreground color. You can use the
    Bucket Tool to select the selection and paint it. In the Tool Options window set
    the Mode to Addition for the transparent layer. Turn off the selection by typing
    Ctrl-Shift-A in the Canvas window. Visual Blast.


    90 THE COMPLETE LINUX HANDBOOK 2'
