  md: '# TutorialGIMP


    ![](img/e96ec2317ee78634033c233818367b96_84_0.png)


    ![](img/e96ec2317ee78634033c233818367b96_84_1.png)


    The working environment of the GIMP. Starting at the upper left: the Toolbox,
    a Canvas, the Layers and Channels dialog, the dialogs, Options dialog and a tool
    options window. A GIMP session often opens windows, brushes, patterns and gradient
    dialogs can be left open, or closed and quickly reopened using respective buttons
    in the Toolbox.


    ![](img/e96ec2317ee78634033c233818367b96_84_2.png)


    The brushes offer access to standard grayscale brush shapes, coloured brushes
    and Brush Pipes. Brush pipes offer artists brushes with multiple shapes, of which
    can be imprinted on the Canvas window to speed up and pressure apply paint. Predefined
    patterns can be easily saved using the ''.pat'' file format. Gradients can be
    created and edited using the Gradient Editor.


    ![](img/e96ec2317ee78634033c233818367b96_84_3.png)


    # GIMP Toolbox: Its File and Xmas menus are unique but the tool bottom should
    be familiar to Photoshop users.


    ![](img/e96ec2317ee78634033c233818367b96_84_4.png)


