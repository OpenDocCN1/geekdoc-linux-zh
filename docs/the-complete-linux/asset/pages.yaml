  md: '# How to make:

    A mountain scene using Proportional Vertex Editing


    Making a mountain scene is a simple process and involves some new skills that
    are very useful for modelling complex shapes.

    First, start with a Blender project and then resize the default plane so it is
    bigger. When the default plane is 18 squares, split the view to see the Side Top
    View and Camera View. When you have the splits, enter edit mode by pressing tab.

    Next we will make use of the Subdivide function. First, select all Vertices by
    pressing the Key or using the B Box (the B key) to select all of the vertices.
    When the vertices are selected, a menu will pop up. Click on the Subdivide option
    and you will see the plane subdivide. Repeat this a number of times and you should
    have something such as in 1 on the right.

    Next press the tab key to go out of edit mode and then back in to deselect all
    of the vertices. Proportional Vertex Editing allows you to move a selection of
    vertices, which in turn move other vertices in a connected manner. You can think
    of it the same way as the magnet function in an image processor... it simply pushes
    vertices around. The button that this shows is at the top of this box since its
    use is so critical to this exercise.

    When you click on the button, two more icons show up: one with a high triangular
    point and one with a lower triangular field. These two adjust how much the related
    vertices are pushed. Again, to understand these buttons, you need to play with
    them, so give them a test.

    Click on one of the vertices in the top and move the handle of the two icons.
    This is the Sharp fallout.

    Now use the E key to move the vertex and see how the vertices are deformed. Your
    top view should now look something like in 2 on the right.

    To create the mountain peaks, select a vertex in the side view and then move it
    where you can move with the E key while holding a combination of the two views
    and the two fallout peak buttons in this mode, you can create spectacular views.
    Finally, add some spot lights, move the camera view and render the scene and you
    will have something such as that in 3 on the right.


