  md: '# CREATING A BORDER FROM CLIPART


    In this tutorial we''ll be painting inside our images to merge two complex patterns
    together to a border on an 8.5 x11 inch page. The process is simple but requires
    some work using soft and hard edges to make the merging seamless. We start with
    a image sized to fit a 8.5 x11 page (the actual size doesn''t matter —


    make any standard size used for printing at home). The white background is used
    because our clipart has a white background as well. If the clipart background
    is not exactly white, then don''t worry too much of a problem. Simply use the
    steps in the following holating clipart Shapes to align the image colours.


    ![](img/e96ec2317ee78634033c233818367b96_94_0.png)


    ![](img/e96ec2317ee78634033c233818367b96_94_1.png)


    +   1 With the clipart sized appropriately to work as a border on the page, copy
    the clipart (CTRL-C) to align both copies of the image (CTRL-V). Duplicate the
    image, select the image and rotate it 90 degrees. Use Align Layers to align the
    clipart to the upper corner. Set the Horizontal Style to Center, the Vertical
    Style to Base Left Edge, Align the Ignore Bottom layer (the button should appear
    grey). Enable the Ignore Bottom layer (if it appeared). The showing for grid size
    is irrelevant for this example. Zoom in on the upper left corner.


    +   2Turn off the background layer visibility. Add a white layer mask to the top
    layer. Select a part that has a hard edge to, make sure your brush is soft and
    start painting in the mask. What you''re looking for is a format that merges the
    two layers clearly. On the layer mask holding the ALT key Shift-Alt may be necessary
    to duplicate the layer. Use the opacity slider to show through the top layer to
    what you want to show through. Turn the top layer visibility on and adjust opacity
    to see the other layers. All the white, paint black in the layer mask to remove
    parts of the top layer, and the background will show through parts. Here you will
    expect patience and various brush strokes to merge the two pieces together. When
    you get the set so the two layers compose nicely, merge the layers to make one
    nice piece for your border.


    +   3 Duplicate the clipart three times, aligning each copy to one of the other
    corners of the image, rotating the copy as needed. With the background layer active,
    copy and paste the clipart floating layer should be centered in the background.
    Make it a new layer and align it with the top of the clipart using the Horizontal
    Style to ''None'' in the Align Layers dialog. Create a mask on this new layer
    and paint it like the previous step to merge it with the corners. Note that if
    the clipart is not long enough to fill the space between the corners, you may
    need to scale it before start all. Alternatively you can paste and align multiple
    clipart between the corners and merge them using layer masks. Repeat the process
    for the other three sides of the image.


    ![](img/e96ec2317ee78634033c233818367b96_94_2.png)


    THE COMPLETE LINUX HANDBOOK 2 95'
  merge: -1
