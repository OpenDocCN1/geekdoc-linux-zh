    # Most Controllers


    Confusingly, there are two types of controllers for USB—UHCI and GHCI. To compound
    the matter, there is no difference between them unless you have two drivers for
    them:


    UHCI is used for Intel and Viia chips, with Namely, Intel, OHCI chipset. It is
    usually detected by the system at boot time and the appropriate driver loaded.


    If you want to check whether USB has been enabled in your system, you can look
    for it in the proc filesystem at /proc/devices.


    You should find entries for usbcore and usci-h or the relevant module for your
    controller. Any unwanted modules can be removed from the kernel.


    Generally these devices pose no problem with Linux in drivers; as they are fairly
    simple and most have no trouble with them. Most modern devices will detect the
