    # Beginners'' Guide to Linux:

    nThe Command Line


    At some point, the dreaded command-line has to be faced, and all graphical loveliness
    aside, if only for a short time. But don''t worry! Andy Channe is here to hold
    your hand...


    ![](img/e96ec2317ee78634033c233818367b96_31_0.png)


    Early last year Dylan Evans, co-author of Evolutionary Psychology (ISBN 1-8404-6043-1)
    — a book that reportedly influenced the structure of The Matrix film — suggested
    that computer users should look beyond those ''pretty little icons'' and achieve
    a more meaningful relationship with what they do. As he put it in The Guardian
    (www.guardian.co.uk/print/03858_4791087-111020.00.html), the flashy graphical
    interface (GUI) has disappeared and, like Neo in the film, you are left with just
    the code behind the curtain.


    The Command Line Interface (CLI) is perceived to — and as — of the Graphical User
    Interface (GUI). As a simple example, when a user clicks on an icon to launch
    XP, for instance, they are executing a command. In this case, you could get the
    same result instantly.


    Well, after many months stirring around the issue in this series, that is the
    goal of this tutorial. It is a guide for both author and reader, but Evans says,
    ''if you want to be free, you have no choice but to understand the machines you
    work.''


    The first thing we need is a terminal. Most distributions ship with a wide selection
    of terminals (or ''consoles'' as they are called) and there is usually an icon
    situated on the desktop or in or KDE that will open the default application.


    By using the command line of a running Linux PC you become root; gain privileges
    in order to change any system properties. Remember that the inherent security
    of allowing users to change only the part of the system they need access to is
    balanced by the constant threat of don''t run as root — typing commands and hitting
    the Enter key. To start the session, right-click on the icon (or any other option
    on the desktop) and select ''Properties'' to manage the settings.


    However, for instances when you are building from source or installing some software,
    you will be root. You can gain privileges by typing sudo as root. All the commands
    you type in the terminal will be executed by the computer as root system administrator
    until you type exit.


    Obviously, beginners can do more than just start applications. In any fact, anything
    you do with a GUI (a whole lot) can be accomplished with the command line. The
    difficulty is where the GUI is powerful and intuitive, CLI.


    Kvim is the text editor that allows for the editing of system files with root.
    You will be prompted for the root password, which allows you to edit system files
    from within a file manager. The file manager itself is a powerful tool too.


    # RPM ON THE COMMAND LINE


    Pick a letter, any letter


    While it is easy to install RPM by double-clicking on it in Nautilus, the command
    line provides many more options than the graphical interface does.


    +   - q query

    - p perform query on an uninstalled application

    - l lists in a package

    - d display package information

    - v display environment information

    - R install a package you would type rpm -U

    - a remove a package


    The command line interface is rpm, which simply installs the application with
    the default options. However, there is a lot more you can do. Here are the most
    common options:


    rpm -U gives you some bit of feedback about what is going on during and how long
    it will take to install. To remove the application you would type rpm -e a application.


    cd is a command to change directory, it is followed by a path, which is the location
    in the file system. cd ~ returns you to your home directory. cd pwd shows which
    directory you are in (root) if the login manager have their name inside directory
    /home). Simply typing cd with no arguments will take a user back to he or her
    home directory


    Once you are inside a directory it is useful to list its contents with: ls can
    also be done using a function: ls /home/andy/Documents displays a list of files
    and folders from another directory


    It is possible to copy files from one location to another using the command cp.
    The following text will copy a file for


