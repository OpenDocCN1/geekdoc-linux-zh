    # Fun with directories


    Directories are a bit different from files. Originally in the Unix world a directory
    was a special file containing a list of records. Each record consists of a fixed
    length: the 32 bits beside an inode number; the rest of each record (up to the
    first byte) was a filename associated with that inode (An inode is a special data
    structure stored in a Unix filesystem that keeps track of the files creation and
    modification times, other things).


    Directories are tricky - you can''t simply open them or write to them (this will
    be relief to those who share your author''s memory of discovering the hard way
    that works on Solaris 4 and 2. Others it was possible to open directories without
    wreaking havoc on a filesystem!). For the reason for this is that Unix supports
    a variety of filesystems that is not a simple list of inodes and directories -
    ReFS, for example, or NTFS and HFS - or at a higher level of abstraction needed.


