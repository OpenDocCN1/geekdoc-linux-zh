    EQUITY. The account you use to give a snapshot of your net worth. A simple equation
    for this Assets (what you own) minus Liabilities (what you owe) equals Equity.
    Double entry bookkeeping seems complicated at first, but it is actually the simplest
    and the perfect method for financial accounting and reporting. GnuCash does most
    of the work, allowing you to go on with without looking after the pennies.


