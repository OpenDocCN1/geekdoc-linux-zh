    # DNS lookup


    Every machine connected to the Internet is provided with the IP address of a (usually
    local) DNS server. This information is typically supplied by the administrator
    who installs the system. Usually, a second server is also specified so the machine
    has something to fall back on if the first is down. The work of resolving names
    is done by this local DNS server; the client just asks and waits for answers.


    How do DNS lookups work? Basically it goes like this: Suppose a machine in some
    domain in Canada wants the IP address of author.shefield.ac.uk it will ask its
    local DNS server (which usually has cached) about author, or about Sheffield University
