- img_proc: true
  md: '# IMPROVE YOUR PHOTOS


    # Subtle Changes


    PART 5 Michael J Hammel introduces the photo-editing capabilities of this great
    art application.


    ![](img/e96ec2317ee78634033c233818367b96_99_0.png)


    On the DVD


    Underexposed images can occur due to poor lighting or improper film processing.
    Fixing the mistakes isn''t as hard as you might think using a few basic tools
    of The GIMP. There are many problems in photography that are difficult to solve
    in the darkroom but easy to fix with digital imaging software. Problems like underexposed
    portions of an image, washed out colour from processing or poor lighting, and
    redye can be addressed with minimal effort using tools like The GIMP. This tutorial
    looks at three of these common problems and how you can fix them with a few minutes
    of work.


    # Scanner Support


    Where to get your drivers

