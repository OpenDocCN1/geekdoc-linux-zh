  md: '# NON-DESTRUCTIVE EDITING


    # The GIMP Layer Masks


    **PART 3** Layer masks allow you to undo changes made to previously saved work
    before they remove any content. *Michael J Hammel shows us how to use them to
    overcome common compositing problems.


    ![](img/e96ec2317ee78634033c233818367b96_91_0.png)


    of the most frustrating issues that digital artists face in their day-to-day work
    are the need to undo changes made to previously saved work; the desire to modify
    colour content with simple brushes. For the former, turn to GIMP''s layers to
    generate non-destructive changes to layers. For the latter, they learn to explore
    in more depth in the next tutorial.


    Layer masks provide a simple method of removing pixels in the composite image
    displayed in the Canvas without actually removing the pixel content! The mask
    is a grayscale image that shows as a thumbnail to the right of the layer thumbnail
    in the Layers, Paths dialog. Black pixels in the mask block the pixels in the
    layer from being used in composite. White pixels in the mask allow pixels to be
    used. Grey pixels in the mask allow transparency to


    their relative cousins in the mask—the darker grey in the mask, the more transparent
    the pixel in the layer. By using layer masks you can modify the artwork without
    removing content, allowing you to return to your artwork at a later time, and
    with a modification to the layer, retrieve pixels of a layer currently used. The
    use of layer masks as a non-destructive editing mode does not actually remove
    pixel data, so you can return to the layer later if necessary, the mask just specifies
    if it will be used and if used, how transparent it will be.


    Blend modes are available in many tools, and in the case of the layer masks, blend
    modes is a method describing how a pixel is combined with another pixel. In the
    case of composition, blend modes define how a higher level layer is combined with
    the next layer down.


    One advantage of using layer masks is to produce a colour image from an image
    by placing a white layer on top of the image and setting the layer''s blend mode
    to Difference. The colour can then be destructed and used to create a complex
    selection or mask. We will start this tutorial showing how to use layer masks
    to perform simple merges of two layers and more complex shading.


    92 THE COMPLETE LINUX HANDBOOK 2'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# MERGING TWO LAYERS


    A common use for layer masks is to seamlessly merge two layers. The effect allows
    you to apply part of the top layer as a replacement for a portion of the bottom.
    In this example, we will be adding a cloud sky to a skyless mountain range.


    ![](img/e96ec2317ee78634033c233818367b96_92_0.png)


    +   1 Our two images for this example: The first is a photo of a beautiful Colorado
    mountain range with a clear blue sky that is so boring. Our other shows an interesting
    cloud pattern over a dull, dreary earth. We''ll take the clouds and place them
    over the empty sky in the former. Use CTRL-A to select the entire image, then
    CTRL-C to make a copy. Move to the image and use CTRL-V to paste the cloud into


    ![](img/e96ec2317ee78634033c233818367b96_92_1.png)


    +   2 Move the opacity slider to the left so we can see the tops of the mountain
    range. The clouds are a little low compared to the top of the mountain ranges
    we''ve moved them up using the Move tool. We''ve made a selection around the cloud,
    selecting everything above the clouds and then drag a little bit below. Note that
    you can click and drag the selection with the mouse button held down, drag outside
    of the window, around the top and back into the window on the other. Release the
    mouse button, a straight line is drawn to connect the start and end. Add a mask
    to the cloud layer that is completely white. Make sure the mask is active by clicking
    its thumbnail which should be enclosed in a white border. Once inverted, it looks
    feathered, and filled with black. Finally, the opacity slider is returned to its
    right position.


    ![](img/e96ec2317ee78634033c233818367b96_92_2.png)


    The layer mask allowed us to easily merge the two images without affecting either
    layer directly. The result looks perfect, however, we still need to touch the
    bottom side of the clouds to merge the dark edges. We can do this by inpainting
    and using a soft edged brush or the Airbrush tool. Also, the cloud layer may need
    to be coloured so it looks like it came from lighting the mountain ranges. In
    our case, we removed much of the red, magenta from the image using the Image-Color-Balance
    tool. The lower clouds in the image were selected using the Feather Selection
    tool, feathered lightly with a Gaussian Blur after the more obvious part disappeared
    and at the same focal depth as the new clouds, a desaturated version of the mountains,
    with a background of the mountains only, was used to add some shadows where the
    clouds were added.


    ![](img/e96ec2317ee78634033c233818367b96_92_3.png)


    ![](img/e96ec2317ee78634033c233818367b96_92_4.png)'
  merge: -1
