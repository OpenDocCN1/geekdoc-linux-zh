    IP is responsible for routing packets of data that are called ''ip packets'' over
    the internet to the correct computer.

    Imagine a small area of networks connected via a single network such as an Ethernet
    but the same principles apply to other LAN technologies. Each computer has an
    interface card (sometimes called a network adapter or MAC) which connects to the
    network and has a fixed (usually unique) that identifies it. This is called the
    Ethernet address or the MAC address. Any computer can send data to any other machine
    on the network by sending out a packet labeled with the MAC address of the intended
    recipient at the beginning. The network interfaces of every computer on this network
    will see the frame as it passes, but only one (the whose MAC address matches the
    one in packet) will capture it.

    In local networks, computers aren''t necessarily connected onto a single cable.
    But they are part of a set of inter- networks, or internet. Fig5 shows how this
    is done. Now things start to get more complex and interesting. Suppose machine
    B wants to communicate with machine Q: It sends an Ethernet frame to everyone,
    because Q won''t see the frame and it will be ignored. There is no way for the
    system to figure out that from B to Q you have to go through G: This is called
    routing. Ethernet is not a routing protocol This is where IP comes in.


    # # IP - The unreliable postman


    Every computer connected to the Internet is assigned an IP address, which is a
    32-bit number. These are written in a dotted decimal format. Let''s take an 8-bit
    piece of the address, which is written as an ordinary decimal, and put dots between
    them. For example, the binary IP address 10101000000000000001100100000101 is written
    as 168.0.19.5. You have a choice - which one out of your four to trust?

    The IP address is divided into two parts: the first part identifies the network
    (the network that it is on), and the bottom part identifies the host (the host,
    which similarly identifies a specific host on that network). For networks with
    more than one host, a connection between two TCP/IP hosts is what we call a session.

    The IP is used to route the data to the network, and the host is used to select
    the correct machine to receive the data. The body contains the payload, the actual
    message.


    So how does IP work? Let''s take the simplest case of a machine communicating
    with another machine on the network - say machine B to machine Q in Fig5: The
    IP layer carries the destination address (184.6.19.24) on its own network, so
    it can


