- img_proc: true
  md: '# CONTRAST, LEVELS AND CURVES: Washing the colour back in


    Washed out images are often the result of using the wrong speed film, overposing
    the shot (which means using too much light), or of poor film processing. In all
    three cases, much of the information available to you is still


    in the image – it just needs to be scanned at a high resolution and then post-processed
    using The GIMP. This tutorial guides step by step through fixing one image shot
    with the wrong speed film.


    ![](img/e96ec2317ee78634033c233818367b96_100_0.png)


    ![](img/e96ec2317ee78634033c233818367b96_100_1.png)


    +   1 We start with an image with a fair amount of detail hidden by our choice
    of film. The image content may be a bit on the boring side, but lets see if we
    can pull some colour – a bit of detail – back out.


    +   2 The Levels tool is our first stop in correcting this image. This dialog
    shows us, through the histogram at the top, that the darkest pixel is not truly
    black and the lightest is not truly white. To fix this, we will spread the range
    of colours so the darkest becomes black and the lightest becomes white. To do
    this adjust the slider. The picture below shows the histogram before the adjustment
    is made and the image after it has been Auto corrected. The result is good, but
    we can improve on this.


    ![](img/e96ec2317ee78634033c233818367b96_100_2.png)


    ![](img/e96ec2317ee78634033c233818367b96_100_3.png)


    +   3 One option here be to manually adjust the Levels once again, this time moving
    the center point slider (beneath the gradient bar) to the right. The picture shows
    the image in this way. This reduces the white range and increases the black, effectively
    working out more colour in the image by making it darker. Although this is less
    than perfect. A better tool to use here is the Color Correction plug-in.


    +   4 The Color Correction Plug-in, available in the GIMP Registry provides a
    more detailed histogram in its page. Here we see that there is a slight skew of
    the histogram towards the right – more white content than black. We can adjust
    this by choosing one of the peaks (we choose the first one) to add more black
    to the image. The result is better than adjusting Levels to the right than the
    Auto-adjusted image. It''s better, but we still want more colour


    ![](img/e96ec2317ee78634033c233818367b96_100_4.png)


