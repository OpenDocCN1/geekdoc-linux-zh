  - '[PAGE 11]


    Within these pages, I have catalogued the many arrangements that we find pleasing,
    from mankind''s earliest Stone Age attempts, right through to the modern Art Deco
    style. This volume contains many types of patterns: the chequered, the stellar,
    the scale-like, the spiralled, the arabesque, and many, many more. Some of these
    decorative styles were championed by different cultures and at different times.
    Greek design is a fine lesson in restrained styling using a set number of design
    models, while the Gothic style is a good instructor of creative exuberance and
    the Japanese style a tutorial in simplicity.


    These special and distinctive designs have been taken from many sources. Some
    are from the age-old pottery of the Neolithic period – so bold and assertive in
    their dark brushstrokes. Others are from the intriguing jewellery of the Egyptian
    dynasties, like those golden and enamelled treasures discovered in the tomb of
    the Pharaoh Tutankhamen. Yet others were collected from the exquisite images painted
    on the walls of Minoan palaces. The mosaics of the Byzantines, the architectural
    freezes of Romanesque cathedrals and the maze-like relief work on Chinese bronzes
    are the source for many more. This wide field of motif and pattern sourcing affords
    the user of this book numerous and varied applications.


    In this age of digital cameras, personal computers, graphic software and colour
    printers it is easy and quick to take a snap-shot of a flower in a garden and
    print out as many images of it as you would wish for. Why is it then, with all
    these electronic aids at our disposal we find the simple patterns and motifs,
    made up of basic shapes, lines and forms and executed by hand, to be more satisfying?
    Here lies the crux of the mystery and the value of'
  - '[PAGE 12]


    this book: we have a compelling drive to manipulate, extrapolate, redesign and
    re-interpret nature. We are not content to simply photograph natural images for
    our decorative purposes, rather, we desire to leave the mark of our hands and
    to reveal our thought-processes for all to see and appreciate.


    This book caters to this well-defined, enduring and classic creative tradition.
    Something of the life force, the movement of the designer''s hand, the passion,
    even the very soul of the artist, is forever captured in these motifs and patterns.
    Unfortunately, for those of you who want to simply capture a pattern from this
    fine tradition, modern copying methods are quick and effective. All the artwork
    has been executed in fine and exacting detail for your visual enjoyment, for your
    inspiration and to assist you in your many creative pursuits. The black and white
    images in this publication facilitates its accurate reproduction. The line-draw
    images make hand-reproduction much easier. Many of the complex patterns have accompanying
    registration marks to help the user locate the beginning, midpoint and ending
    of pattern sequences. The reference dots indicate the scale to the patterns were
    drawn and therefore will help with grid and hand-copying. Please note that you
    may only copy or adapt designs for your personal use.


    I am certain that within this book''s rich heritage, you will find the style,
    the look and the type of motif and pattern that you are searching for to complete
    all your projects and I trust that the many beautiful images will be the key to
    unlocking and releasing your innate creativity.


    Graham Leslie McCallum'
