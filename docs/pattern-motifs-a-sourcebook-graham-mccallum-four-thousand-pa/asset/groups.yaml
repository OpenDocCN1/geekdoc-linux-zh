    # INTRODUCTION


    If we were to pick up a single motif, the most simple of motifs – for example,
    a black dot – and then placed several similar dots together, evenly spaced along
    an imaginary line, we will have created a linear pattern. There is something visually
    pleasing in this most basic pattern – not only beautiful, but psychologically
    satisfying too. Extend that collection of dots vertically and you have amplified
    the pleasure effect.


    This is precisely what our ancestors did 30,000 years ago. These cave-dwelling
    men and women discovered this aesthetic effect, carved this pattern onto their
    bone implements and painted it onto the walls of their rock shelters. Here we
    are, in the 21st century, still appreciating that very same pattern – only now,
    we call it the polka-dot pattern.


    That you have picked up this book and taken the time to page through the patterns
    and motifs is proof that you have an appreciation for patterning. Many scholars
    have theorized endlessly about the reason for mankind''s fascination with design,
    but like most of our desires and passions, the reasons lie deeply buried and locked
    away within our complex psyche. However, I would like to think that, as you explore
    these wonderfully decorative pages, you unlock that mystery and discover the secret
    to your personal passion for decoration.


    In truth, the creative is not the only source for decorative patterns; the natural
    world has pushed us to the peak, producing some of the most beautiful and varied
    delights. Even our finger and palm prints are nature''s unique patterns imprinted
    on our hands. Taking a closer look at wonderfully decorative tropical shells or
    the fascinating pelts of wild animals is a humbling experience. Indeed, you''d
    find it tremendously difficult to improve on nature''s originality.


    Fortunately for us, thousands of talented artists and craftsmen have preceded
    us and left an extraordinary wealth of motifs and patterns. The cultural creativity
    of the past not only provides a generous source of design and decoration, but
    also a wealth of motivating inspiration. It is like unlocking a chest and finding
    it brimming with jewels and finely wrought treasures in gold and silver.


    Within these pages, I have catalogued the many arrangements that we find pleasing,
    from mankind''s earliest Stone Age attempts, right through to the modern Art Deco
    style. This volume contains many types of patterns: the chequered, the stellar,
    the scale-like, the spiralled, the arabesque, and many, many more. Some of these
    decorative styles were championed by different cultures and at different times.
    Greek design is a fine lesson in restrained styling using a set number of design
    models, while the Gothic style is a good instructor of creative exuberance and
    the Japanese style a tutorial in simplicity.


    These special and distinctive designs have been taken from many sources. Some
    are from the age-old pottery of the Neolithic period – so bold and assertive in
    their dark brushstrokes. Others are from the intriguing jewellery of the Egyptian
    dynasties, like those golden and enamelled treasures discovered in the tomb of
    the Pharaoh Tutankhamen. Yet others were collected from the exquisite images painted
    on the walls of Minoan palaces. The mosaics of the Byzantines, the architectural
    freezes of Romanesque cathedrals and the maze-like relief work on Chinese bronzes
    are the source for many more. This wide field of motif and pattern sourcing affords
    the user of this book numerous applications.

