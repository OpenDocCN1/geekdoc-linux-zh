    - 包含 1000 多种惊艳且原创的图案主题

    - 为所有设计师、手工艺者、缝纫者和刺绣者提供设计灵感

    - 涵盖多种历史和地区风格，从埃及图案和传统日本图案到装饰艺术（Art Deco）风格化设计

    - 这些免版税的图像可以在任何创意领域的设计工作中进行复印、放大或描摹

