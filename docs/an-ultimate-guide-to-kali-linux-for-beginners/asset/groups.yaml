    ## About The Author


    My Name is Ansh. I am an App Developer, Game Developer, Web Developer, Ethical
    Hacker, Graphic Designer, Penetration Tester, WordPress Website Developer. I am
    Increasing My Skills day by day. I also Teach On Various Online Course Creation
    Platforms like Udemy, Skillshare, Teachable, etc.


    I have authored the best-selling title on Google Play “An Ultimate Guide to Online
    Course Creation” & “An Ultimate Guide to Website Development”.


    Teaching over 14000+ Students from over 150+ countries and 40+ Languages, I can
    guarantee that you would learn something new definitely after reading my books.


    ## FREE GIFT


    You Will Get a Chance to Win $200 of Goodies.


    Steps to Avail the Benefit are at the last page of the book.


    See you at the end of the book!


    ## FAQs


    ### Why Linux & Not Windows or Mac?


    Windows and Mac are the least chosen operating systems when one has to choose
    an operating system which can handle multiple shell tasks and has less bugs in
    comparison to other operating systems. Linux system has the highest root privilege
    which is required to perform certain pen testing and ethical hacking related tasks.


    ### Why Kali Linux?


    Kali Linux is the most loved choice when opting for penetration testing and ethical
    hacking. Because of the ease of doing work and the availability of pre-installed
    tools available in Kali Linux, which makes it an ideal choice for ethical hacking
    and pen testing.


    ### I use Windows or Mac OS; will I have to install Kali Linux OS instead?


    Absolutely NO! There is no need to delete your files from Windows and Mac OS and
    install a new Kali Linux, you can use Kali Linux in your existing Windows or Mac
    OS easily and reliably, that’s one feature of Linux OS over other operating systems.


    ### What are the requirements to apply the information from this book?


    Well, if you want to learn things effectively and for long period of time, you
    should perform practical on your own device. There are basic system requirements,
    a PC, an internet connection & determination to jump into the world of Kali Linux.


    ### I am new to Kali Linux; how will I get started in it?


    Well, that''s why we are here. Let''s get started!


    ### What are VMs?


    VMs are great. There are many upsides with using them. One of the benefits, able
    to run multiple Operating Systems (OSs) at the same time. You can have your host
    machine "untouched", and then only interact with the guest VMs. Another is when
    something goes right, take a snapshot. When something goes wrong, revert back.


    Virtual Box is free and open source and is best option to create a Virtual Machine.


    Download Virtual Box on your PC (Windows or Mac) by going to https://www.virtualbox.org/wiki/Downloads


    Choose which host are you on, windows host or Mac host (OSX).


    Now, Install the program into your computer just like a usual setup you install
    on your PC.


    After installing, go back to https://www.virtualbox.org/wiki/Downloads and look
    for **6.X.X Oracle VM VirtualBox Extension** and download the extensions pack.


    After downloading, double click the downloaded file and install the extensions
    into your system.


    These extensions are very crucial for the smooth working of Kali Linux.


    ## INSTALLING KALI LINUX


    There are many ways of installing Kali Linux into Virtual Box. The simplest way
    to do this is using the pre-installed image file.


    Download the latest Kali Linux image file by going to https://www.kali.org/get-kali/#kali-virtual-machines.
    Select your system hardware (64 bit or 32 bit). And click on download button on
    the “Virtual Box” Panel.


    This will download a file with extension “ova”.


    After the download is complete, double click the downloaded file and it will open
    up into the virtual box.


    A window will pop up looking like this:


    ![](img/d05aeb75f1c36187913c3b410abf92b1_11_0.png)


    Click on the “Import” Button, then “Agree” and then, it will start importing the
    Installed Kali Linux into your virtual box.


    After the import is complete, you need to setup a few things. Go to settings of
    the imported Virtual Machine.


    ![](img/d05aeb75f1c36187913c3b410abf92b1_12_0.png)


    Click on System and increase the base memory to about half of the system memory.


    ![](img/d05aeb75f1c36187913c3b410abf92b1_12_1.png)


    Now, go to “Processor” tab and increase the processors to about half of your system
    capacity. This is essential for Kali Linux to function without any glitches.


    ![](img/d05aeb75f1c36187913c3b410abf92b1_13_0.png)


    Apply other changes as shown in the images above. These changes may vary according
    to the processor of your computer. Apply other setting according to the images
    below:


    ![](img/d05aeb75f1c36187913c3b410abf92b1_14_0.png)


    ![](img/d05aeb75f1c36187913c3b410abf92b1_15_0.png)


    Now, you have successfully installed Kali Linux into your Virtual Box as a Virtual
    Machine.


    ## Setting Up Linux


    If you want to be a serious penetration tester or ethical hacker, then you would
    have to master the Linux command lines as they are the basic requirements in starting
    an attack.


    Terminal, as the name suggests, is an application which interfaces with the system
    with help of command lines. Unlike Windows or Mac OS, Linux doesn’t offer graphical
    user interface with icons and panels to perform various tasks like copying a file,
    deleting a file & even creating a file or script.


    Terminal offers the commanding interface to type such commands which we will discuss
    in the next sections.


    If you are a Windows user, then you might know that Windows also has its own terminal
    named as CMD (Command Prompt). The terminal in Linux is somewhere same as that.


    So, first of all fire up your Kali Linux by clicking “Start” in the Virtual Box.


    ![](img/d05aeb75f1c36187913c3b410abf92b1_16_0.png)


    After it boots, it will ask for the username and password.


    By default, the username and password are “kali” and “kali” respectively. Click
    login after that.


    Now the Kali desktop interface will open up.


    To make your Kali Linux future proof, you need to install the Guest Addition Tools.


    Follow these steps to Install Guest Addition Tools.


    Click on devices tab of the Virtual Box and click on “Insert Guest Additions CD
    Image...”


    ![](img/d05aeb75f1c36187913c3b410abf92b1_17_0.png)


    Now a CD icon will appear on the desktop. Double click on it and note the path
    of the folder.


    ![](img/d05aeb75f1c36187913c3b410abf92b1_17_1.png)


    In our context, it’s “/media/cdrom0/”


    Open the terminal by clicking the icon as below.

