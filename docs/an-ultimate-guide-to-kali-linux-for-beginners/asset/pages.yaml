- pgno: 10
  md: '# **What are VMs?**


    VMs are great. There are many upsides with using them. One of the beings, able
    to run multiple Operating Systems (OSs) at the same time. You can have your host
    machine "untouched", and then only interact with the guest VMs. Another is when
    something is going right, take a snapshot. When something goes wrong, revert back.


    Virtual Box is free and open source and is best option to create a Virtual Machine.


    Download Virtual Box on your PC (Windows or Mac) by going to https://www.virtualbox.org/wiki/Downloads


    Choose which host are you on, windows host or Mac host (OSX).


    Now, Install the program into your computer just like a usual setup you install
    on your PC.


    After installing, go back to https://www.virtualbox.org/wiki/Downloads and look
    for **6.X.X Oracle VM VirtualBox Extension** and download the extensions pack
    written


    After downloading, double click the downloaded file and install the extensions
    into your Kali Linux.


    These extensions are very crucial for the smooth working of Kali Linux.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# INSTALLING KALI LINUX


    There are many ways of installing Kali Linux into Virtual Box. The simplest way
    to do this is using the pre-installed image file.


    Download the latest Kali Linux image file by going to https://www.kali.org/get-kali/#kali-virtual-machines
    Select your system hardware (64 bit or 32 bit). And click on download button on
    the “Virtual Box” Panel.


    This will download a file with extension “ova”.


    After the download is complete, double click the downloaded file and it will open
    up into the virtual box.


    A window will pop up looking like this:


    ![](img/d05aeb75f1c36187913c3b410abf92b1_11_0.png)


    Click on the “Import” Button, then “Agree” and then, it will start importing the
    Installed Kali Linux into your virtual box. After the'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'import is complete, you need to setup a few things. Go to settings of the imported
    Virtual Machine.


    ![](img/d05aeb75f1c36187913c3b410abf92b1_12_0.png)


    Click on System and increase the base memory to about half of the system memory.


    ![](img/d05aeb75f1c36187913c3b410abf92b1_12_1.png)


    Now, go to “Processor” tab and increase the processors to about of your system
    capacity. This is essential for Kali Linux to function without any glitches.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '![](img/d05aeb75f1c36187913c3b410abf92b1_13_0.png)


    Apply other changes as shown in the images above. These changes may vary according
    to the processor of your computer. Apply other setting according to the images
    below:'
  merge: -1
  img_proc: true
- pgno: 14
  md: '![](img/d05aeb75f1c36187913c3b410abf92b1_14_0.png)'
  merge: -1
