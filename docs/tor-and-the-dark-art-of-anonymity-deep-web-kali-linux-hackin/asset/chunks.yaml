- fmt: '

    Priority number one is simple: if you run one, you must own one. They must not
    be run under somebody else''s control if you can help it, because if that service
    is compromised, everyone goes down. That means total anonymity, 100% of the time
    with world-class jewel-thief stealth ability.


    The Silk Road admin did not have this ability. In fact, looking through the online
    docs detailing the arrest, one gets the impression he was very lax in IT security
    procedure. He repeatedly made mistakes such that luck on the part of LE never
    really came into it at all. The guy was just sloppy.


    ## First


    Never, ever, ever run a hidden service within a `VM` that is owned by a friend
    or a Cloud space provider. Remember, all "The Cloud" is, is someone else''s drive
    or network, not your own. Encryption keys can be dumped from `RAM`. And who owns
    the `RAM`?


    Right. The Cloud provider. Lightning strikes and there goes your own anonymity
    as well as the anonymity of your visitors if they are lazy in their browser habits.
    The FBI delivered a "nit" (network investigative technique) this way to unpatched
    `Tor Browser Bundles` in 2013. If, however, you own the machine, then it''s a
    different story. But let''s back up a few steps and assume you don''t. How might
    you go about running it on a host system?


    Well first off, you would need two separate physical hosts from different parties,
    both running in `virtual machines` with a firewall-enabled OS that only allows
    `Tor` network activity and nothing else.


    The second physical host is the one the hidden service runs from, also `VM`ed.
    Secure connections are enabled by `IPSec`. What''s `IPSec`, you ask?


    "IPSec is a protocol suite, for securing Internet Protocol (IP) communications
    by authenticating and encrypting each IP packet of a communication session. `IPsec`
    can be used in protecting data flows between a pair of hosts (host-to-host), between
    a pair of security gateways (network-to-network), or between a security gateway
    and a host (network-to-host)."


    If an intruder agent tampers with anything, you will know about it and can shut
    down the service or move it to a safer place, and all while being a ghost in the
    machine. You can imagine how valuable this would be in North Korea.


    If you were in that cesspool of a country, you would be more than a little paranoid
    if the server went down even for a few seconds. But you could always move it to
    a more secure location or even start over, and you might just want to since you
    would not know if a `RAID failure` had occurred or if some commie jackboot was
    sending a copy of the `VM` to the higher ups.


    ## Second


    If going the host route, you must ensure that `remote-console` is always available
    to you by the host, any time you want. You must do everything remotely, in fact,
    and change passwords frequently via `https`. I''d say once per day as paranoia
    in such a climate as North Korea would be good for your health.


    ## Third


    You must never, not even once, access the service from home. Not from your `Nexus
    7`. Not from your girlfriend''s `Galaxy Note`. Not even via `Tor` from your backyard
    using your neighbor''s `WiFi`. Using a `VPN` as well is risky unless you know
    what you''re doing. Only access it via secure locations at least ten miles away
    from your residence. Overkill, some might say, but then there is no such thing
    as overkill in a gulag.


    ## Fourth


    Move the service on occasion. Again, look at any Youtube video on how snipers
    train to take out an enemy. They move place to place after each shot to conceal
    the true location from the enemy. How often is up to you. Once a week? Once a
    month? Personally I''d say every twenty-one days. You can never be too secure
    when running one of these.


    ## The Death of Anonymity


    Prime minister David Cameron went on record in January, 2015 to say he wanted
    to [outlaw](http://gizmodo.com/uk-prime-minister-wants-to-ban-messaging-apps-without-b-1679184681)
    all encryption-enabled messaging apps if the government cannot have backdoor keys
    to decrypt encryption. It would be like a farmer allowing easy entry to the henhouse
    to cougars as well as foxes. While on the campaign trail, he said:


    "Are we going to allow a means of communications which it simply isn''t possible
    to read? My answer to that question is: No, we must not."


    While he referred to mostly chat programs like `WhatsApp` and what not, you can
    bet the ranch he was also talking about apps like `PGP`, `Freenet` and the discontinued
    `Truecrypt`. Regrettably, he used the Hebdo (cartoonist) attack as justification
    (don''t they all use these to further Big Brother agendas?).


    I see a similar trend evolving in Canada regarding `VPN` usage. New laws now require
    `VPNs` to identify customers who download copyrighted works like movies and games
    so that infringement notices (i.e. scare letters) get to the right person. That
    sounds rather just on the surface of it, because who wouldn''t deny George Lucas''s
    ability to make more Star Wars prequels? Art, you know.


    But therein is the problem. Mainly it''s that politicians forget how the internet
    actually works.


    Doing what they dictate means `VPN providers` must retain access logs for 6 months,
    minimum. This alone pretty much guarantees a `VPN''s ability to sell anonymity
    services (privacy, actually) will dissolve, thus leading to massive losses as
    customers aren''t stupid. They know when their privacy is being targeted. Let
    the exodus begin! (Government cookie parties)


    They also know that `VPNs` assign shared `IP addresses` for customers. One might
    be yourself, there in jammies sipping Rickard''s while the the frog-in-the-pot
    who turns the oven on to maximum.


    The only solution is to move out of Canada.


    But then, perhaps that is what the government wanted all along.


    The saddest part isn''t that none of this won''t stop terrorism or copyright infringement,
    or that it will hurt most encryption businesses or that only politicians will
    have encryption. No, the saddest part is that we will become the frog-in-the-pot
    who turns the oven on ourselves to maximum temperature and then slip back into
    the pot, and all because someone more than you or I said it was the right thing
    to do.


    Our world will become Bizarro World. Where right is wrong and light is dark and
    no one has security except for the agents of the new Matrix they will build. Where
    to be more secure is to be less secure as usons go... because if the government
    says so, that must be the gospel truth''s the last a politician lied?


    If you learn nothing else, remember two things: Backdoors are security holes in
    100% of cases. The second one is like it: Anonymity and Privacy and the freedom
    that comes of it will only die if we let it.


    ## Closing Thoughts


    As you can see, the powers that be are actively targeting your ability to make
    choices about your own freedom. They work in baby steps. They think you''re stupid.
    They think they can run your life better than you can. Only they can''t. Did the
    NSA stop the attack on Charlie Hebdo, the French cartoonist? Did they stop 9/11?
    The bombings in Spain? A death from a thousand cuts, a little at a time, and before
    you know you''re feeling very light-headed but aren''t quite why.


    Believe me, putting off your security and peace of mind will be enough to fuel
    that tsunami of cancer they''re building up one cell at a time. If you''ve read
    this book then you''ve already taken all the baby steps you need. You''ve dipped
    your big toe into that whirlpool and it''s high time you jumped in. Don''t procrastinate.
    You know how warm the water is. Wait too long and the water might get too cold.
    Worse still is that someone might just lock you out altogether.

    '
