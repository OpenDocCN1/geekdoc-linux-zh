    ![](image_rsrcYM.jpg)


    The question you may be wondering is: how much security is too much security?
    What''s overkill and what isn''t?


    Well, the perfect answer to that is this: How far will you fall if caught, and
    how much time are you willing to invest in reading to prevent it? `Tails` is easier
    to grasp, and if you don''t expect attacks from sites you visit, then by all means
    use `Tails`.


    If, however, you live in North Korea or China, then there''s the possibility of
    twenty years of hard labor - hammering worthless rocks. That is, if they see any
    `Tor` activity coming from your location that correlates to "things they don''t
    like" activity... or anything else in the case of North Korea. They don''t like
    it when outsiders offer the peasants hope. If you''re caught in that country,
    you''ll be found guilty long before you ever see a judge.


    ## Features of Whonix that make it more secure


    - Anonymous Publishing/Anti-Censorship

    - Anonymous E-Mail w/`Thunderbird` or [`TorBirdy`](https://addons.mozilla.org/en-us/thunderbird/addon/torbirdy/)

    - Add proxy behind `Tor` (`user` -> `Tor` -> `proxy`)

    - Chat anonymously.

    - IP/DNS protocol leak protection.

    - Hide that you are using `Tor`

    - Hide the fact you are using `Whonix`

    - Mixmaster over `Tor`

    - Secure And Distributed Time Synchronization Mechanism

    - Security by Isolation

    - Send E-mail anonymously without registration

    - Torify any app

    - Torify Windows

    - Virtual Machine Images (VM)

    - `VPN` Support

    - Use Adobe Flash anonymously

    - Use Java/Javascript anonymously


    The following is an example of a moderately secure system:


    - Host `Whonix` on a memory stick with a flavor of `Linux` of your choice.

    - Use a `VPN` you trust.


    Two other things to note where security is concerned:


    - Avoid regular calls of non-`Tor` WiFi tablets if you''re using Cafe WiFi

    - Know as well where every CCTV is located in the area you plan to use `Tor`


    ## MAC Addresses


    A new WiFi/Ethernet card has something that can aid in tracking you. It''s a 48-bit
    identifier burned-in by the manufacturer. Sort of like an IMEI for your phone.
    If by chance you weren''t thinking clearly and bought your computer with `Tor`
    in mind using a credit card, you may later get targeted by an FBI "NIT" that swipes
    your `MAC` number. A `Nit` is short for ''Network Investigative Technique''. If
    that happens, you''re toast, as you''ll be tracked by some lackey working for
    them with far too much time on his hands.


    The way to defeat this is to have a disposable `MAC` address (the number, not
    the Apple product) - one that you bought with cash with no security cams looking
    over your shoulder. That way you can get rid of it in a flash or swap it out if
    you realize they''re onto you.


    ## Whonix Bridges


    Using a Bridge with `Whonix` can be beneficial.


    ### What Bridges Are


    Bridges are obfuscation tools used to cloak your `Tor` usage from a nosy ISP or
    government who might see you''re using `Tor`, but not know what you are doing
    with it. To that end, `Tor` bridges are alternative ways to enter the `Tor` network.
    Some are private. Many are public. Some are listed on the `Tor` homepage. In a
    hostile environment, you can see the value in using it to your advantage as it
    makes it much more difficult for an ISP to know you''re using `Tor`.


    ### What Bridges Are Not


    While not especially unreliable, they are certainly less reliable than regular
    `Tor` usage where performance goes. But the tradeoff may be in your best interest.
    Only you can decide if the performance hit is warranted. Here''s how to do it
    in `Whonix`.


    Bridges must be added manually since there is no auto-install method for `Whonix`,
    but it''s not that difficult. You simply must enter them into the proper directory,
    like so:


    `/etc/tor/torrc`


    If you''re using a graphical `Whonix-Gateway`, then you need to browse to:


    Start Menu -> Applications -> Settings -> `/etc/tor/torrc.examples`


    To edit your `torrc` file (which is necessary for bridge adding), browse to:


    Start Menu -> Applications -> Settings -> `/etc/tor/torrc`


    Then add whatever bridge you copied from the `Tor` bridges page (or a private
    one if you have it). Then restart `Tor` for it to take effect.


    ## Using Your Real Name Online Outside of Tor


    What kind of danger is there in using your real name online?


    I hate to say it but even with all I''ve learned the answer is still the same
    now as it was way back when `Facebook` first hit the scene. In fact, I suspect
    it''s the same now as it was in my early teens when I crept around an online watering
    hole called `The Well`.


    The answer is this: It depends.


    Law enforcement and prospective employers who mine your social media profiles
    for data are often worse than thieves who salivate when you announce on `Twitter`
    you''ll be out of town for two weeks. Thieves, while unsavory to be sure, are
    more honest in their profession than a lot of the corporate behemoths that do
    things behind your back.


    Employers are the worst of the lot. As hypocritical as Harvey Two-Face. They demand
    transparency in your life but never their own. Make an inflamed political post
    or drink wine on vacation in Bora Bora with half-naked Filipinas as those fire-twirlers
    do their thing in the background, and you could lose your job... or even be denied
    one. Not kidding. It happens. Likewise, if you mention on your resume that you
    use `Tor`, you may one day hear your interviewer ask:


    "I noticed you''re a big fan of `Tor` and other anonymity tools that shield your
    IP address and prevent...identity."


    "Because I value freedom."


    That sunk my battleship.

    '
