    Two other things to note where security is concerned:


    - Avoid regular calls of non-Tor WiFi tablets if you''re using Cafe WiFi


    - Know as well where every CCTV is located in the area you plan to use Tor


    MAC Addresses


    A new WiFi/Ethernet card has something that can aid in tracking you. It''s a 48-bit
    identifier burned-in by the manufacturer. Sort of like an IMEI for your phone.
    If by chance you weren''t thinking clearly and bought your computer with Tor in
    mind using a credit card, you may later get targeted by an FBI "NIT" that swipes
    your MAC number. A Nit is short for ''Network Investigative Technique''. If that
    happens, you''re toast, as you''ll be tracked by some lackey working for them
    with far too much time on his hands.


    The way to defeat this is to have a disposable MAC address (the number, not the
    Apple product) - one that you bought with cash with no security cams looking over
    your shoulder. That way you can get rid of it in a flash or swap it out if you
    realize they''re onto you.


    Whonix Bridges


    Using a Bridge with Whonix can be beneficial.


    What Bridges Are


    Bridges are obfuscation tools used to cloak your Tor usage from a nosy ISP or
    government who might see you''re using Tor, but not know what you are doing with
    it. To that end, Tor bridges are alternative ways to enter the Tor network. Some
    are private. Many are public. Some are listed on the Tor homepage. In a hostile
    environment, you can see the value in using it to your advantage as it makes it
    much more difficult for an ISP to know you''re using Tor.


    What Bridges Are Not


    While not especially unreliable, they are certainly *less* reliable than regular
    Tor usage where performance goes. But the tradeoff may be in your best interest.
    Only you can decide if the performance hit is warranted. Here''s how to do it
    in Whonix.


    Bridges must be added manually since there is no auto-install method for Whonix,
    but it''s not that difficult. You simply must enter them into the proper directory,
    like so:


    /etc/tor/torrc.


    If you''re using a graphical Whonix-Gateway, then you need to browse to:


    Start Menu -> Applications -> Settings -> /etc/tor/torrc.examples


    To edit your torrc file (which is necessary for bridge adding), browse to:


    Start Menu -> Applications -> Settings -> /etc/tor/torrc


    Then add whatever bridge you copied from the Tor bridges page (or a private one
    if you have it). Then restart Tor for it to take effect.


    Using Your Real Name Online Outside of Tor


    What kind of danger is there in using your real name online?


    I hate to say it but even with all I''ve learned the answer is still the same
    now as it was way back when Facebook first hit the scene. In fact, I suspect it''s
    the same now as it was in my early teens when I crept around an online watering
    hole called The Well.


    The answer is this: It depends.


    Law enforcement and prospective employers who mine your social media profiles
    for data are often worse than thieves who salivate when you announce on Twitter
    you''ll be out of town for two weeks. Thieves, while unsavory to be sure, are
    more honest in their profession than a lot of the corporate behemoths that do
    things behind your back.


    Employers are the worst of the lot. As hypocritical as Harvey Two-Face. They demand
    transparency in your life but never their own. Make an inflamed political post
    or drink wine on vacation in Bora Bora with half-naked Filipinas as those fire-twirlers
    do their thing in the background, and you could lose your job... or even be denied
    one. Not kidding. It happens. Likewise, if you mention on your resume that you
    use Tor, you may one day hear your interviewer ask:


    "I noticed you''re a big fan of Tor and other anonymity tools that shield your
    IP address and prevent better relationships between consumers and companies...
    Could you elaborate on why you need to use an anonymizing service? We like transparency
    in our employees."


    Yes, I was actually asked this in an interview for a position that handled a lot
    of money. But as soon as she said ''consumer'', I knew what she really thought
    of me. Consumer is a word meant for the animal kingdom. Squirrels, for instance.
    Raccoons and other rugrats. Beasts that roam on all fours and are slaves to instinct.
    Beasts that don''t pray, forgive or sing praises to a Higher Being they can neither
    feel, see, nor hear.


    I''m thankful for the upfront honesty, actually, but what really bothered me was
    the casual way it was asked, like every applicant should have something to hide
    if they like anonymous communications. Like some wet-behind-the-ears greased up
    code monkey in the hacker clan Anonymous and up to no good. At any rate, she didn''t
    like my answer.


    "Because I value freedom."


    That sunk my battleship. I came out of that interview perplexed, yet jobless,
    viewing privacy as somewhat of a double-edged sword since one needs an online
    presence for many higher paying employers. It didn''t sit well with me in the
    long run. I felt a little cheated to be honest, and as I drove home some of the
    mumblings I''d overheard later on became as loud as roaring trains in my ears.
    Here''s a few tidbits:


    - Don''t like someone on Facebook? You probably won''t like working with them.


    - Like the competitor''s products? Here''s our three-year non-compete agreement
    for you to sign.


    - You use Tor? The only people that use that are terrorists, pedos and hitmen.
    You must be one of those buggers.


    Soon thereafter, any time a prospective employer noticed "Tor" under the Hobbies
    section of my resume, it would always illicit a negative response. Like witchcraft
    or Dungeons and Dragons Dungeonmaster. My breathing seemed to become erratic as
    my heart raced, as if they were about to summon an unbadged "authority" to warn
    me of being too private.


    He''d be dressed like Dilbert, only skinnier and with a bumblebee-yellow pen and
    a clipboard. He''d have multiple facial tics and that annoying eyebrow raise,
    as if it were completely illogical to value privacy. I have no idea why he''d
    have a clipboard, but he always did in my minds eye.


    My solution was to divide my public and private identity in social settings and
    remove any trace of it on my resume. In fact, I refused to give any indication
    on any social media site, either, that I was into any of the following:


    - PGP


    - Encryption, or encrypting files or Operating Systems


    - Tor Relays


    - I2P


    - Freenet'
