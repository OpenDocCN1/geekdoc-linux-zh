    安装 `Tor` 后，你通过 `Tor Browser` 访问的每一个页面都将通过 `Tor` 网络进行匿名路由。然而，关于安全，有一个重要的细节需要你了解，那就是你的
    `Tor` 设置仅仅是合理的起点。它们并非最优的，也绝不是无懈可击的。我们仍然处于起步阶段，而且坦率地说，对于 `Tor` 而言，所谓的“最优”在很大程度上取决于硬件（网络、CPU、内存、虚拟机、VPN），因此每个人的设置都会有所不同，就像伊朗德黑兰的人的安全需求与加拿大蒙特利尔的人的需求不同一样。


    # Tor 做不到的事情


    现在来聊聊 `Tor` 做不到，或者至少做得不是非常好的事情。在未来这可能会发生变化，所以先不要急着下定论。


    1.) `Tor` 无法保护你免受附件的影响。


    不仅限于可执行文件，还包括任何可以通过代码运行的内容。这意味着 `Flash` 视频以及 `RealPlayer` 和 `Quicktime`。这些小家伙可以被配置将你的真实
    IP 地址发送给对手。这可不好。因此，除非我们完全信任来源，否则我们永远不要运行任何可执行文件或程序。如果可能，请选择开源。这也适用于任何加密方案。让我们先在这里停顿一下。


    如果你打算使用 `Tor`，加密是强制性的。这不是可选项。我曾在一些加密博客上听过人说它是可选的，但那就像说如果你打算全年住在曼谷，学习泰语是可选的一样。那样你将是走不远的。


    2.) `Tor` 无法很好地运行 torrent。


    老新闻了，对吧？仍有成千上万的人这样做，考虑到如今北美对诉讼的这种痴迷，我可以理解为什么。他们声称未患于未备。我听过各种比彩虹还多的借口，说在 `Tor`
    上使用 torrent 没什么大不了。唯一的问题是……他们是安全的，而其他人都倒霉了。`Tor` 无法运行像 `Emule` 和 `Limewire` 这样的
    P2P 应用，而不会让其他人的 `Tor` 体验变得糟糕。它只是消耗了太多的带宽。


    3.) `Tor` 无法隐藏你的身份 - 如果你像撒狂欢华节节珠一样到处丢你的真实邮箱，或者即使你在使用 `Tor` 时在网站上提供真实邮箱，你应该认为你的匿名性已经被破坏。被摧毁。被剖析。在任何情况下，你的虚拟身份都绝不能与你的现实身份匹配。我们将在后面的章节中深入探讨如何正确地做到这一点，但请记住，那些忽视这条规则的人会被黑客攻击、抢劫、逮捕，或被印有“FBI”字样的夹克制小精所肆残。稍后会有更多相关介绍。


    # Tor 应用与反指纹工具


    一些应用程序（移动端或其他）让 `Tor` 变得没那么头疼，但除非你正在进行某种仿真，否则它们并不特别适合桌面用户。但考虑到现在每个人都在使用手机，其中一些应用以我从未想过的方式让我受益匪浅。请务必阅读
    `Play Store` 中的评论，因为更新往往会破坏功能。


    ## Orbot: 带有 Tor 的代理


    这基本上是 `Android` 版的 `Tor`，你可以在 `Google Play store` 或他们的官网上获取。


    ![](img/image_rsrcYG.jpg)


    这是一个代理应用，运行方式与桌面版类似，它可以加密你的网络流量，保护你免受监视，并增强防御流量分析的能力。你可以将 `Orbot` 配合 `Twitter`、`DuckDuckGo`
    或任何带有代理功能的应用使用。我已经用了很长时间，并习惯了它的优点。


    [Invizbox](https://www.indiegogo.com/projects/invizbox-privacy-made-easy) - 让隐私变得简单


    ![](img/image_rsrcYH.jpg)


    `Invizbox` 插入你现有的路由器或调制器中。会出现一个新的“InvizBox”wifi 热点。连接到新热点并按照一次性配置设置即可开始。你连接到 `InvizBox`
    wifi 的所有设备都将通过 `Tor Network` 路由流量。请注意，这并非必需的应用，但它让事情变得简单。


    ## Signal 私密消息


    ![](img/image_rsrcYJ.jpg)


    该应用会加密你手机上的每条消息，而且简单上手。更好的是，万一你把手机留在 Marble Slab，由于内部的加密，你的隐私是安全的。它还是开源的。相比之下，太多的应用程序并不是，因此无法让任何人进行同行评审。


    ## Google 与 Tor


    ![](img/image_rsrcYK.jpg)


    `Google` 如何看待 `Tor`？坦率地说，我怀疑他们并不尝试。很大可能，他们并不像 `NSA` 那样讨厌它，但他们知道如果每个 `Google` 用户每天都使用
    `Tor`，他们的广告投放系统将开始打空。想象一下，如果一个十三岁的男孩收到了西地时（Cialis）的广告，或者一个名叫 Bertha 的八十老人开始看到木马优惠券的广告。这是一个非常糟糕的投放系统。这对我们是好事，但对
    `Google` 来说并不如此。


    他们也不介意捐赠资金，因为这可以获得对未来技术的持股。为此，他们不仅捐赠给了 `Tor`，还捐给了其他匿名服务，如 `Freenet`。他们甚至捐助过火星探测器技术。各种外太空的事物。他们永远不知道哪种技术会在一周后或一年后冲入轨道，所以他们像圣诞节早晨上的老吝奇一样挥霍金钱。


    ### 验证码 (Captchas)


    有时你在使用 `Tor` 时，会发现为了证明你是人类，`Google` 会弹出这种要求。由于他们对搜索查询的大量分析，这促使一些 `Tor` 用户认为 `Google`
    是在针对他们。


    ## SpiderOak


    通常我会警告不要对任何你想要私密的内容使用`云服务`。`SpiderOak` 是我可以担保的例外，尽管还有一些保留。它是 `Dropbox` 相当不错的替代方案，因为它是用“零知识”编写的（开发者是这么说的），当你安装它时会创建一组加密密钥。当你上传数据到
    `SpiderOak` 服务器时，它们已在你的计算机上进行了加密。再次，根据开发者的话。


    他们声称即使法院要求提供订阅数据，他们无法交付，因为只有你有密钥。这听起来很安全，但我仍然不会上传任何可能引起爱德华·斯诺登好奇心的内容。


    另一个缺点是它是中心化的。中心化意味着单点故障。此外，他们随时可以删除数据（这对任何在线服务都是如此）。记住，在你和法官之间，他们总是站在法官这边。


    ## Tails


    听过“现场系统”吗？在 `Tails` 出现之前我也没有。`Tails` 允许你使用 `Tor` 来避免追踪和审查，并且可以在你想要的任何地方使用。它内置了自己的操作系统，最好的部分是它是为移动办公的人设计的。


    你可以通过 `USB stick`、`SD` 卡甚至 `DVD` 运行。这非常有用，因为它可以防止病毒。如果你不希望硬盘留下浏览会话的痕迹，这也有益。最好的部分是免费的。大多数基于
    `Linux` 的东西都是免费的，但 `Tails` 自带聊天客户端、邮箱、办公软件和浏览器。


    不过使用 `DVD` 的缺点是，每次更新 `Tails` 都必须重新刻录。这是不方便的地方。所以，让我们把它安装到 `USB stick` 上吧。


    '
- fmt: '

    1. Download the Tails installer from the [Tails website](https://tails.boum.org/install/).
    You must first install it somewhere, like a DVD, and THEN clone it the USB stick
    or SD card.


    2. Click `Applications` --> `Tails` --> and then on ''Tails Install'' to begin
    the installation.


    3. Choose `Clone & Install` to install to SD card or USB Memory Stick.


    4. Plug in your device, then scan for the device in the `Target-Device` drop down
    menu. You''ll get a warning about it overwriting anything on the device. That''s
    nothing to worry about, so choose yes and confirm the install.


    # Tails Limitations


    Neither Tails nor Tor encrypt your documents automatically. You must use [GnuPG](https://www.gnupg.org/)
    or `LUKS` for that, bearing in mind that some documents like Word or Atlantis
    may have your registration info within the document itself. This can be a problem
    for anonymity. Case in point: in 2013, Amazon self-publishers discovered that
    pen names could sometimes be revealed by looking at the code of certain word documents
    and siphoning out the registration information. This code revealed the real identity
    and addresses of many self-published authors. As an author myself, trust me when
    I say you don''t want the headaches that come with that.


    Personally I enter in fake information whenever I "register" any app. All the
    more so if I will use that app in conjunction with Tor or Tails.


    There''s other noteworthy stuff to know if you''re aim is true anonymity. Namely:


    - Document metadata is not wiped with Tails.

    - Tails doesn''t hide the fact that you''re using it from your ISP (unless you
    use Tor bridges). They cannot see what you''re doing on Tor, true enough, but
    they know you''re using it. Again, unless you use a Tor Bridge.

    - Tails is also blind to human error. Try not to use the same Tails session to
    begin two different projects. Use separate sessions. Isolating both identities
    in this way contributes to strong anonymity for your sessions.


    # Chrome


    Using Tor with Firefox is hardly the only way to slay a dragon. There''s also
    Chrome. Yes, it''s Google, and yes, Google has strayed far from it''s "Do No Evil"
    motto, but like everything else in life, luck favors the prepared and you''d be
    surprised at how much you can lock down your browser from invaders. Preparations
    are everything. You just have to have the right sword. The right armor. The right
    lockpicks. The preparations (reagents) are as follows:


    I. Install the [ScriptNo](http://code.google.com/p/scriptno/) extension. It is
    to chrome what a mouse is for a PC, at least as far as precision goes. It offers
    excellent control, even allowing you to fine-tune the browser in ways that NoScript
    for Firefox cannot. If you find it too difficult, [ScriptSafe](https://chrome.google.com/webstore/detail/scriptsafe/oiigbmnaadbkfbmpbfijlflahbdbdgdf?hl=en)
    is another option. I''ve used both and came away very satisfied, though like everything
    else on the internet, your mileage may vary.


    II. [Adblock](https://chrome.google.com/webstore/detail/adblock/gighmmpiobklfepjocnamgkkbiglidom?hl=en).
    This one is just insanely good at repelling all kinds of malware. It''s probably
    the most well-known too, so there''s plenty of feedback scattered across the internet.


    III. [User-agent Switcher](https://chrome.google.com/webstore/detail/user-agent-switcher-for-c/djflhoibgkdhkhhcedjiklpkjnoahfmg)
    for Chrome. Install it. It mimics user-agent strings. You can set yours to look
    like Internet Explorer and this will fool a lot of malware payloads into thinking
    you''re really browsing with Internet Explorer and not Firefox or Chrome, thus
    firing blanks at you.


    V. [CanvasBlocker](https://addons.mozilla.org/en-US/firefox/addon/canvasblocker/)
    - This prevents sites from using Javascript `<canvas>` API to fingerprint users.
    You can block it on every site or be discriminant and block only a few sites.
    It''s up to you. The biggest thing for me is that it doesn''t break websites.


    # Deadly Firefox Options


    ## Firefox


    You might be tempted to enable "Check for counterfeit websites" in Firefox. Don''t
    do this, as it will relay sites you regularly visit to Google''s servers. Google''s
    "predictive text-search" is also bad as it relays keystrokes to Google as well.
    To change it you have to do it manually by going into `about:config` in the Firefox
    address bar.


    Now let''s look at some other privacy settings you might want to know about.


    Javascript - This one you should avoid like the black plague, as using it on the
    Tor network is equivalent to drinking from a well contaminated by the plague in
    the year 1350. You may notice it is turned on by default under the Firefox options
    tab, though. The reason is spelled out by the Tor Developer Team:


    > We configure NoScript to allow JavaScript by default in Tor Browser because
    many websites will not work with JavaScript disabled. Most users would give up
    on Tor entirely if a website they want to use requires JavaScript, because they
    would not know how to allow a website to use JavaScript (or that enabling JavaScript
    might make a website work).


    There''s a tradeoff here. On the one hand, we should leave JavaScript enabled
    by default so websites work the way users expect. On the other hand, we should
    disable JavaScript by default to better protect against browser vulnerabilities
    ( not just browser vulnerabilities).


    Ghostery and Ghostrank - These aren''t particularly deadly, just useless on Tor
    since Tor disables tracking anyway. If you do decide to use it, know that using
    either can alter your browser fingerprint - not to the extent of breaking anonymity.
    But use DuckDuckGo if you want to beef up your anonymity.


    Adblock - We mentioned this one before and, sadly, using this could change your
    fingerprint. Adblock plus has "acceptable ads" enabled by default, and there is
    also the [scandals](http://www.wilderssecurity.com/threads/german-blogger-calls-adblock-plus-a-mafia-like-advertising-network.349411/page-8#post-231928)
    that Adblock has been over the years, one implying that Google paid the Adblock
    CEO for Google Ads to be shown. You can draw your own conclusions about that,
    but with so many users applying pressure, you can rest assured that you''re not
    just a number to them anymore.


    Besides that, the basic idea of the Tor Browser Bundle is to use as few addons
    as possible. They figure that TorButton, NoScript, and HTTPS Everywhere is sufficient
    to preserve anonymity without the added risk of additional addons. Or drama. Along
    this line of thought, the [Panopticlick website](https://panopticlick.eff.org/index.php)
    may also be useful to you.


    # Whonix & Tor


    If you''re paranoid that using Tor could get into trouble, such as if you host
    a Hidden Service, you may want to look into [Whonix](https://www.whonix.org/wiki/Main_Page)
    before running anything further. Many power users who use Tor on a daily basis
    like the tighter security it offers. Both tools offer their own strengths and
    weaknesses, and each strength is meant for a different purpose. You may find one
    is better than the other for your personal situation, where the situation differs
    according to your security needs.


    Like Tails, Whonix is built with anonymity and security in mind. It''s also based
    off of Debian/Linux, so it''s a good synergy where anonymity is concerned. This
    synergy grants anonymity by routing everything through Tor. The advantages are
    that DNS leaks are next to impossible and malware cannot reveal your IP address.
    In fact, the only connections possible are routed through Tor via the `Whonix-Gateway`.

    '
