  trans: '

    记住：始终要保持强大的安全意识。培养逻辑化配置事物的能力，并尽早预判故障，在水流奔涌而入之前就发现潜水艇的漏洞。如果你对此深有怀疑，可以看看电影《深渊》（The
    Abyss）。看看水流奔涌而入时 Bud 是如何反应的？他恐慌失措！大多数船员都死了。不要等到那个命运的时刻。要尽早做好准备。B 计划。C 计划。如果你负担得起，甚至可以有一个
    D 计划。


    任何情报机构都有无限的资金，通过审查我们所有人来剥夺自由——甚至是审查你购买心仪物品的自由。有了媒体的听命，他们可以幻化出任何他们想要的“怪物”来欺压你。他们对你撒谎并不违法，但你对他们撒谎却是违法的。这种双重标准对他们来说毫无代价，却会让你付出一切。所以，像他们一样，你必须紧跟安全领域的变化，必要时及时更新，并对新的
    `zero-day` 威胁保持持续警惕。


    但如果说你拥有一件他们没有的东西，那就是比他们更努力工作的动力。他们每天下午 `5pm` 就下班。你呢？权势者玩阴招，你也应该如此。


    ## 想了解更多吗？


    首先，对于你下载这本书，向你表示诚挚的感谢并敬你喝杯啤酒。你可以从这个主题的几十本优秀书籍中挑选任何一本，但你选择了我的书。对此我非常感谢。说真的，读到最后需要强大的意志。如果你喜欢所读的内容，我需要你的帮助！请花一点时间给这本书留个评价，这样其他人就能学习如何使用
    `Tor` 和 `Freenet`，并且……嗯，保护好自己。


    说到保护，我使用了很多工具才走到今天的这一步，而书中一些未能通过审查的话题，却奇迹般地出现在我的其他书里。你说奇不不妙。


    但有一点：当你拥的不有一颗而是两三颗“银弹子”来击败狼人时，你对周围游荡的其他任何类狼人保持隐形的几率就越大。请注意，我对于患有 `Lycanthropy`（狼人病）的人并没有偏见，因为这绝非玩笑。但羊群心理也同样如此。


    所以吧。不要总是使用所有人都在使用的工具。尝试一下我的其他一些没在这个版本中面世的作品，来玩点花样：


    ### 你可能喜欢的其他书籍：


    - [一次性手机与黑市](https://www.amazon.com/dp/B01EU9A92K)

    - [暗网：匿名入门指南](https://www.amazon.com/dp/B008AP8TAK)

    - [隐形工具包](https://www.amazon.com/dp/B014OMZ1N0)

    - [Tor 与深网](https://www.amazon.com/dp/B075MBL4L2)

    - [3 合 1 暗网超级包](https://www.amazon.com/dp/B06VY1MWMP)

    - [Usenet：终极指南](https://www.amazon.com/dp/B0098DWUQW)


    ### 即将推出：


    - 暗黑 Linux (Dark Linux)

    - 网络犯罪超级反派 (Cybercrime Supervillains)

    '
