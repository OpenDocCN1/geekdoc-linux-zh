- fmt: '

    After `Tor` is installed, every page you visit with the `Tor Browser` will be
    routed anonymously through the `Tor` network. There is, however, an important
    detail you need to know concerning security, and that is that your `Tor` settings
    are merely reasonable starting points. They are not optimal, and certainly not
    bulletproof. We''re still at the infancy stage and quite frankly, optimal as `Tor`
    knows optimal is largely dependent on hardware (network, CPU, RAM, VM, VPN), and
    so each person''s setup will be different just as a person''s security needs in
    Tehran, Iran are different than in Montreal, Canada.


    # What Tor Cannot Do


    Now for what `Tor` cannot do, or at least cannot do very well. In the future this
    may change, so don''t fall on your sword just yet.


    1.) `Tor` cannot protect you from attachments.


    This isn''t limited to executables, but anything that can be run by code. This
    means `Flash` videos as well as `RealPlayer` and `Quicktime`. Those babies can
    be configured to send your real IP address to an adversary. That''s not good.
    So we must never run any executable or app unless we trust the source implicitly.
    If at all possible, go open-source. This also goes for any encryption scheme.
    Let''s stop right there for a moment.


    If you''re going to use `Tor`, encryption is mandatory. It''s not an option. I''ve
    heard some say on a few encryption blogs that it is, but that''s like saying learning
    Thai is optional if you''re going to live in Bangkok all year. You won''t get
    far that way.


    2.) `Tor` cannot run torrents well.


    Old news, right? Thousands still do this, and I can understand why with how lawsuit-obsessed
    North America seems these days. Better safe than sorry, they claim. I''ve heard
    every excuse under the rainbow that using torrents on `Tor` is no big deal. The
    only problem is... they are safe and everyone else is sorry. `Tor` cannot do P2P
    apps like `Emule` and `Limewire` without making everyone else''s `Tor` experience
    miserable. It simply sucks down too much bandwidth.


    3.) `Tor` cannot cloak your identity - If you''re tossing your real email around
    like Mardi Gras beads, or even if you give your true email on websites while using
    `Tor`, you should consider your anonymity compromised. Nuked. Eviscerated. Your
    virtual identity must never match up with your real-life identity under any circumstance.
    We''ll delve far more deeply in later chapters on how to do this the right way,
    but know that those who ignore this rule get hacked, robbed, arrested, or mauled
    by capped gremlins with the letters ''FBI'' on their jackets. Much more on this
    later.


    # Tor Apps & Anti-Fingerprinting Tools


    A few applications, mobile and otherwise, make `Tor` less of a headache, but they''re
    not particularly well suited for desktop users unless you''re doing some kind
    of emulation. But with everyone using mobile these days, some of these have benefited
    me in ways I never thought possible. Be sure and read the comments in the `Play
    Store` since updates tend to break things.


    ## Orbot: Proxy with Tor


    This one is basically `Tor` for `Android`, which you can get at the `Google Play
    store` or at their homepage.


    ![](image_rsrcYG.jpg)


    It is a proxy app that runs similar to the desktop app and encrypts your net traffic,
    as well as protects you from surveillance and fortifies you against traffic analysis.
    You can use `Orbot` with `Twitter`, `DuckDuckGo` or any app with a proxy feature.
    I''ve used this for a long time now and have gotten used to it''s strengths.


    [Invizbox](https://www.indiegogo.com/projects/invizbox-privacy-made-easy) - Privacy
    Made Easy


    ![](image_rsrcYH.jpg)


    `Invizbox` plugs into your existing router or modem. A new "InvizBox" wifi hotspot
    will appear. Connect to the new hotspot and follow the one time configuration
    set up and you''re ready to go. All devices that you connect to the `InvizBox`
    wifi will route their traffic over the `Tor Network`. This isn''t a required app,
    mind you, but it makes for simplifying things.


    ## Signal Private Messenger


    ![](image_rsrcYJ.jpg)


    This app encrypts every message on your mobile phone and is simple to learn. Better
    still, in the event you leave your phone at Marble Slab, rest assured your privacy
    is safe due to the encryption within. It''s also open-source. To that, far too
    many applications aren''t and thus cannot be peer-reviewed by anyone.


    ## Google and Tor


    ![](image_rsrcYK.jpg)


    What does `Google` think of `Tor`? Quite honestly, I suspect they try not. In
    all probability, they probably don''t hate it like the `NSA` does, but they know
    that if every `Google` user used `Tor` on a daily basis, much of their ad targeting
    system would begin firing blanks. Imagine if a thirteen year old boy received
    ads for Cialis, or an eighty-year old woman named Bertha began to see ads for
    Trojan coupons. It makes for a lousy targeting system. That''s good for us. Not
    so much for `Google`.


    They don''t mind donating funds, either, since this allows a future stake in the
    technology. To that, they''ve not only donated to `Tor`, but to other anonymity
    services too, like `Freenet`. They''ve even donated to Mars rover technology.
    All kinds of outer space things. They never know which technology is going to
    rocket into orbit a week or year from now, so they throw money around like Scrooge
    on Christmas morning.


    ### Captchas


    At times you''ll be using `Tor` and find that `Google` spits this requirement
    out in order to prove you''re human. This, on account of their massive analyses
    on search queries, is what drives some `Tor` users to think `Google` has it for
    them.


    ## SpiderOak


    Normally I warn against using `Cloud Service` for anything you want private. `SpiderOak`
    is one exception I can vouch for, with some reservations. It''s a decent enough
    alternative to `Dropbox` as it''s coded with "Zero Knowledge" (so say the developer)
    and when you install it, a set of encryption keys is created, client-side. When
    you upload data to `SpiderOak` servers, they''re encrypted on `your` computer
    and `then` uploaded. Again, according to the developers.


    They claim that even if a subpoena requires subscriber data, they could not deliver
    it since only you have the keys. That sounds very secure, but I still wouldn''t
    upload anything unencrypted that might pique `Edward Snowden''s` curiosity. If
    it pique''s his mind, it''ll pique other, more powerful types. Encrypted container
    files fall into this category.


    The other downside is that it''s centralized. Centralization means a single-point-failure.
    As well, your data can be deleted by them at any time (true with any online service
    really). Remember that between you and a judge, they will always side with the
    judge.


    ## Tails


    Ever heard of a "live system"? Neither had I until `Tails` burst on the scene
    in 2009. `Tails` allows you to use `Tor` to avoid tracking and censorship, and
    in just any location you could want. It houses its own operating system, the best
    part being that it''s designed for those on the go.


    You can run it via `USB stick`, `SD` or even a `DVD`. This comes pretty handy
    as it makes it resistant to viruses. It''s also beneficial if you don''t want
    your hard drive to leave remnants of your browsing session. The best part is that
    it''s free. Most things based on `Linux` are, but `Tails` comes with chat client,
    email, office, and browser.


    The downside to using a `DVD` though, is that you must burn it each time you update
    `Tails`. That''s the inconvenient part. So let''s install it to `USB stick` instead.

    '
