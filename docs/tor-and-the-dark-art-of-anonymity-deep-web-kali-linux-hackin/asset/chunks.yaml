    # Preface


    You want what you want.


    Invisibility. Anonymity. Ghost protocol.


    You''ve taken the red pill and have seen the truth, and you don''t like it. I
    don''t blame you. I didn''t like it either. But what I thought I knew about `Tor`
    and other incognito tools was only a drop in the ocean next to what''s really
    out there. Stuff you don''t find on many tech forums. They''re whispered in private,
    of course, but it''s all invisible to you. Until now.


    Which brings us to you and I, or rather what I can do for you. It''s amazing what
    a guy can learn in a decade when he rolls his sleeves up and gets his hands dirty.
    Private hacker forums. `Usenet`. `Freenet`. I scoured them all for years and what
    I''ve learned isn''t anywhere else on Amazon.


    Equally amazing is what you can learn for a few dollars in a weekend''s worth
    of reading. That''s me, and soon to be you. Where you will be by Monday is where
    I am now, only without the years of mistakes. Mistakes I made using `Freenet`,
    `Tails`, `PGP`. You name it, I did it. And boy did I make BIG ONES. Those are
    mistakes you''ll avoid because, after you''ve read this guide, you''ll know more
    than 85% of the `Tor` users out there, and know more about anonymity than most
    Federal agents. Even the so-called superhackers at the `NSA` who only get by with
    a minimum amount of work every day, mostly involving eradicating your right to
    privacy.


    To that, if you don''t come away satisfied, return.


    # Is Tor Safe in 2022?


    That seems to be the question alright. As to what the true answer is, it really
    depends on whom you ask, because there are always wolves in sheep''s clothing
    out there who stand to gain from your ignorance. Many say no. A few say yes. The
    media, for all their expertise in things political and social, come up woefully
    lacking when something as complex as `Tor` is discussed.

    '
