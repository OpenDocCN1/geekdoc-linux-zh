    or trying to disappear.


    Be wary of using it in hotels as well, where often there are many cams watching
    with 24/hr surveillance. That location can be linked to Tor activity.


    Do not use Tor more than a day in any specific location. A correlation-attack
    can be done in less than an hour if a black van is parked nearby--a van you will
    not see. They may not slap the cuffs on you as you walk out of the cafe that very
    week, but later they might. Consider the area a toxic dump after a day, regardless
    if you must travel to the next shop or town.


    If you want to get really cloak and dagger about it, have an app running (an MMO,
    for instance) while you are out and about doing your Tor activity that makes it
    look like you were home during that time.


    "We''ve been watching you Mr. Anderson, and it seems you''ve been living... two
    lives." -- Agent Smith, The Matrix


    Darknet Personas


    You''ve no doubt read of Tor busts where an undercover agent snagged a phone number
    or clearnet nic from someone they were targeting because said target trusted too
    much, too quickly. You can avoid this by retraining yourself, unlearning what
    you''ve learned.


    You must consider your Tor sessions the property of your other Self. The cloned
    You - that shadowy thievish looking guy above. The second You. One that despises
    Incubus and loves Tool and views Neo as just another beta-orbiting punk who got
    the luck of the draw when Morpheus and crew unplugged him. This clone would not
    use Twitter or YouTube or other social gunk. He would never hang with you nor
    call you up for a few beers. In fact, he hates beer, preferring J&B as he hacks
    with John Carpenter''s The Thing OST playing as mood music in the background.
    That''s your other You. The smarter you.


    And he must be the new You on Tor. And you must forever separate him from the
    non-Tor You.


    His Facebook, Twitter and YouTube accounts are all fake, having never once used
    them on his home PC. His nics are different, as is his passwords, likes/dislikes
    and even the fonts he uses to browse the Deep Web. Mixing this dark persona with
    your own would be like the boy made of matter kissing the anti-matter girl...


    BOOM.


    Further, any phone calls this person makes is done by prepaid phones that were
    not purchased by any credit cards he holds. He is a cash n'' carry guy and then
    only if he is twenty miles from home. Any SIM cards he uses are strictly used
    in conjunction with Tor activity and never used in phones the other guy uses.
    And... he deliberately leaves false info wherever he goes. Kinda like the CIA
    does.


    But to better clarify this idea, let''s assume John Doe doesn''t know any better.
    He watches a movie on Netflix. Then he mosies on over to Freenet and drops intel
    without even realizing it, eager to share his great cinema experience with his
    darknet buds (no pun).


    "Hey guys, just watched a cool flick with Russell Crowe. Kinda Michael Bay-ish
    and Liam Neeson''s cameo was too short, but makes for a good flick if you want
    to learn how to disappear. But those police, sweet Jesus! Those rent-a-cop guys
    sure are as dumb as a sack of bricks!"


    Police are dumb, he says.


    Metadata is collected by Netflix just as it is with Google and Yahoo. Every single
    user. They know every film you viewed and even which ones you hated. He''s even
    made forum posts indicating similar weather and, though not mentioning names,
    has griped about local politicians being handcuffed in very geo-specific arrests,
    even dropping the charges!


    How many Netflix fans do you think watched this movie at the time of his Freenet
    post? How many in cities that had local politicians arrested for embezzling? How
    many with similar weather depicted in the film? Most likely less than ten. Maybe
    not even that.


    There is also the handwriting element. Does he mispell the same words over and
    over? Throw commas like daggers? Misuse semi-colons and run-on sentences? System
    clock out of sync with his posts? All of this leads to a great profile that ties
    his IP address to his identity. Often it is enough to get a warrant if he so much
    as whispers that he''s obtained any kind of contraband.


    Unless of course, all of this info is tailor-made to fit the other You.


    Bottom line: Learn from Snowden''s mistakes. Take every company''s claim of anonymity
    with a grain of salt. The proof is in the amount of arrests tied to said company
    or app. In the case of [Freenet](https://freenetproject.org/)... none.


    But there is always a first time. Recall that they only have to get lucky once,
    which more often than not relies on your carelessness.


    Tor Hidden Services - High Risk, High Reward


    CNN along with FoxNews has been trumpeting the defeat of certain hidden services
    for a few years now. Services like Silk Road and Freedom Hosting, which I''m sure
    you''ve heard about. They are a easy target for the FBI since hidden services
    are not high on the list of priorities by Tor developers yet. Same for the NSA.


    Both agencies know every trick and hack there is to know about running a hidden
    service. And so should you. This is not to say you need the expertise to match
    their team of super hackers, but that you need even more vigilance to run such
    a service than you do visiting such a service.'
