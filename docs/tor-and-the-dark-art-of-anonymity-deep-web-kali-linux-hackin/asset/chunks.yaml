    一台安全的电脑是你最好的防御，因为美国国家安全局（NSA）主要依赖于中间人攻击和将有效载荷传输到隐藏 Tor 服务器的浏览器漏洞。尽管如此，你应该预见到并预期此类漏洞可能在任何时候渗透你的系统。诸如
    `Nits`（网络漏洞）之类的，你必须保持警惕。因此需要遵循以下原则：


    - 尽可能使用 `Linux`。是的，我知道你习惯使用 `Windows` 并且觉得 `Linux` 太麻烦。但如果你的 ISP（互联网服务供应商）因为你在
    Facebook 上说过的话而被传唤，你就不会这么想了。例如，某些反女主义的内容。所以，学会使用它吧。


    - 如果你是 `Linux` 新手，可以看看 `Linux Mint`。如果你有经验，`Debian` 是一个不错的选择。`Windows` 不可信主要是因为它是闭源的，还因为恶意软件在上面比
    `Linux` 更有效。如果 `Linux` 无法考虑，可以考虑 `Tails` 或 `Whonix`，因为这些程序预先配置，不允许任何指向明网（clearnet）的传出连接。


    ### 更新……东西。


    你的电脑也必须始终保持更新。不更新会导致漏洞和利用，如 `Windows` 中的那些漏洞。理想情况下，你应该确保在每次使用 `Tor` 时都确保 `Tails`
    是最新更新，并避免任何使用 `Java`/`Javascript`/`Flash` 或任何脚本的网站，因为它们以你无法看到的方式执行代码。仅在紧急情况下使用它们，千万不要在你的家庭系统中使用。


    ### 态势感知


    如果一个机构可以监控你的本地连接以及你正在浏览的链接，那么（在资源充足的情况下）他们可以使用流量分析来精确定你的真实位置。因此，我建议你不要在家里 100%
    的时间使用 `Tor`。


    在此说明一下，如果在进行任何形式的秘密工作或非法活动，且没有采取严格的安全措施，请不要在你的合法居住地使用 `Tor`；那种普通 `Tor` 用户可能会忽略的安全措施。让那另一个家伙去取教训吧。这虽然很糟糕，但比你中要好。他是一个叫
    `Jimmy` 的 19 岁少年，喜欢黑客。而你是一个 32 岁有两个孩子和房贷的建筑工人。谁损失得更多？没错，是你。所以，学习反侦察和反取证技术，就像你的命取决于它一样……因为事实确实如此！


    对于国家级行动的敌人，我建议不要在家里的在线电脑附近接触任何东西。绝不是那种会让你觉得需要用 `Tor` 来隐藏它的东西。它对于私人浏览来说可能没问题，但对于那些计划政变、经营非法活动（例如在伊朗的家庭圣经学习小组）或试图消失的人来说则不是。


    在酒店中使用它时也要小心，因为那里通常有许多摄像头进行 24 小时监控。该位置可能与 `Tor` 活动相关联。


    在任何特定地点使用 `Tor` 的时间不要超过一天。如果附近停着一辆黑色的面包车，关联攻击可以在不到一小时内完成——而那辆面包车你是看不见的。他们可能不会在你这一周走出咖啡馆时就对你戴铐，但以后可能会。在一天之后，将该区域视为毒性倾倒场，无论你是否必须前往下一个商店或城镇。


    如果你想在这方面做得更深神秘测，可以在你在外面进行 `Tor` 活动时，运行一个程序（例如一个 MMO 游戏），让它看起来在那段时间你是在家里。


    “我们一直在盯着你，安德森先生，看来你一直在过着……双生活。” —— 史密斯探工，《黑矩阵》


    ### 暗网人格


    你无疑读过关于 `Tor` 扫荡的新闻，卧底特从目标身上获取了电话号码或明网网卡（clearnet nic），因为该目标信任太深、太快。你可以通过重新训练自己，忘记你所学的知识来避免这种情况。


    你必须将你的 `Tor` 会话视为“另一个自我”的财产。那个克隆的你——上面那个阴影的、看起来像贼一样的家伙。第二个你。一个鄙视 `Incubus`、热爱
    `Tool` 并将 `Neo` 视为另一个在 Beta 轨道运行的混混，他只是在 `墨菲斯` 和他的伙伴拔掉插头时运气好而已。这个克隆不会使用 `Twitter`
    或 `YouTube` 或其他社交垃圾。他永远不会和你混在一起，也不会给你打电话约你喝几杯啤酒。事实上，他讨厌啤酒，更喜欢 `J&B`，并在背景中播放《约翰·卡宾珀的怪形》原声带进行黑客操作。那是你的另一个你。更聪明的你。


    他必须是 `Tor` 上的新你。你必须永远将他与非 `Tor` 的你分开。


    他的 `Facebook`、`Twitter` 和 `YouTube` 账户全是虚假的，从未在他在家里电脑上用过一次。他的网卡（nics）是不同的，密码、喜欢/不喜欢的内容也是如此，甚至他浏览深网时使用的字体也是不同的。将这个黑暗人格与你自己的混合在一起，就像由物质组成的男孩亲吻反物质女孩一样……


    砰。


    此外，此人打的任何电话都是通过预付手机拨出的，这些手机不是用他持有的任何信用卡购买的。他是一个现付现货的人，而且仅当他离开家二十英里时。他使用的任何 `SIM
    卡` 都严格与 `Tor` 活动配合使用，绝不会在另一个家伙使用的手机中使用。而且……他无论去哪里都会故意留下假信息。有点像 `CIA` 做的那样。


    但为了更好地解释这个观点，让我们假设 `John Doe` 并不懂这些。他在 `Netflix` 上看了一部电影。然后他闲逛到 `Freenet`，在没有察觉的情况下分享了他的精彩电影体验。


    “嘿伙计们，刚看了一部有罗素·克劳主演的酷电影。有点迈克尔·贝风格，而且利亚姆·尼森的客场太短了，但如果你想学习如何消失，这电影很棒。但那些警察，老天爷！那些警察简直蠢得像一袋砖！”


    他说警察很蠢。


    元数据被 `Netflix` 收集，就像 `Google` 和 `Yahoo` 一样针对每一个用户。他们知道你看过的每一部电影，甚至你讨厌哪些。他甚至发布了帖子暗示类似的天气，尽管没有提到名字，但抱怨了官员被戴铐的情况！


    你认为有多少 `Netflix` 粉丝在他发布 `Freenet`帖子时看了这部电影？有多少在因贪污被捕的城市？有多少在电影中描述了类似的天气？可能少于十个。可能甚至没有。


    还有手写元素。他是否反复拼错单词？像扔飞剑一样扔逗号？误用分号和长句？系统时钟与他的帖子不同步？这一切都导致了一个出色的画像，将他的 IP 地址与他的身份联系起来。通常情况下，只要他私声说获得了任何违禁品，就足以获得搜令。


    除非，所有这些信息都是为了另一个你定制的。


    结论：从斯诺登的错误中汲取教训。对任何公司的匿名声称保持保留态度。证据在于该公司或应用程序相关的逮捕数量。在 `Freenet` 的情况下……零。


    ### Tor 隐藏服务 - 高风险，高回报


    `CNN` 一同 `FoxNews` 多年来一直在庆祝某些隐藏服务的击败。像 `Silk Road` 和 `Freedom Hosting` 这样的服务，我确定你听过。它们是
    `FBI` 的容易目标，因为在 `Tor` 开发者的优先级列表中，隐藏服务并不靠前。`NSA` 也是如此。


    这两个机构了解运行隐藏服务的所有技巧和黑客手段。你也应该如此。这并不是说你需要具备与他们的超级黑客团队匹配的专业知识，而是说运行这种服务比访问这种服务需要更多的警惕。


