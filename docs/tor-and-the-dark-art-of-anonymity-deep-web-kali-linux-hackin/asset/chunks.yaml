    if your friend hand-delivers it. I''ve gotten viruses in the past from friend''s
    sharing what they thought were "clean" apps. Believe me, in a situation where
    you fire up Tor to discuss nuclear launch codes, you don''t want a keylogger mucking
    things up for you.


    Now then. Choose Windows, Linux or the Mac version and know that your default
    Firefox install won''t be overwritten unless you want it to. Both use Firefox,
    but Tor is a completely separate deal. You''ll notice it has the same functions
    as Firefox: Tabs. Bookmarks. Search box. Menus. It''s all here... except your
    favorite add-ons.


    On that point, you might be tempted to install your favorite apps. Don''t give
    in to that temptation. Multiple add-ons that do nothing for your anonymity might
    assist someone in locating you over Tor by what is known as "[Browser fingerprinting.](https://cryptostorm.org/download/file.php?id=1379)”


    ![](image_rsrcYE.jpg)


    After installation, you should see the green welcome screen below:


    ![](image_rsrcYF.jpg)


    Now you''ve got some choices. One is to volunteer your bandwidth, which makes
    it easier for other Tor users, but comes with risk.'
