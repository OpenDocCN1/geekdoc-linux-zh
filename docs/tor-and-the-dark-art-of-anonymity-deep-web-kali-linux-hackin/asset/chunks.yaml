- fmt: "\n# Anonymity in general\n\n- Anything linked to Edward Snowden\n\nSuch is\
    \ the nature of the masses. One simply cannot rely on Facebook or Twitter or Google\
    \ to respect one's freedom to use Tor without announcing it to the whole world.\
    \ But at least with Tor, Google cannot mine your browsing session for ads. No\
    \ ads = no soup for them. From NBC:\n\n\"The Internet search giant is changing\
    \ its terms of service starting Nov. 11\\. Your reviews of restaurants, shops\
    \ and products, as well as songs and other content bought on the Google Play store\
    \ could show up in ads that are displayed to your friends, connections and the\
    \ broader public when they search on Google. The company calls that feature \"\
    shared endorsements.''\n\nSo I firewall everything I do. I use [Ghostery](https://www.ghostery.com/)\
    \ for social sites and offer only pseudonymous details about myself. In fact,\
    \ I try to avoid any correlation between Tor and any social media site just as\
    \ one would a can of gasoline and a lighted match.\n\n## Email Anonymity\n\nIs\
    \ it possible to send a message that is foolproof against trackers, hackers and\
    \ Big Companies?\n\nThere are, in fact, many flavors to choose from to accomplish\
    \ this task. Below are a few rock-solid services. Combined with Tor, they grant\
    \ you a virtual fortress.\n\n### [W3, The Anonymous Remailer](http://gilc.org/speech/anonymous/remailer.html)\n\
    \n![](image_rsrcYN.jpg)\n\nConnectable with Tor, you only need an email address\
    \ to send the message to (preferably encrypted with PGP--more on that in a moment).\n\
    \nAnother is [Guerrilla Mail](https://www.guerrillamail.com/). They allow users\
    \ to create throwaway emails to be used at leisure. Emails sent are immediately\
    \ wiped from the system after you hit Send. \n\n![](image_rsrcYP.jpg)\n\nThese\
    \ services claims of anonymity would be pretty thin if we did not encrypt our\
    \ messages-- which brings us to PGP.\n\n### [PGP](https://en.wikipedia.org/wiki/Pretty_Good_Privacy)\
    \ is the encryption standard of choice for many old users like myself, and for\
    \ good reason. It has never been cracked by the NSA or FBI or any intelligence\
    \ agency and likely won't until quantum computers become common. It works by way\
    \ of key pairs, one which is public and one private (the one you will use to decrypt\
    \ your messages with).\n\nWorry not about the term \"keys\". It is not difficult\
    \ to grasp and will be as easy as hitting send once you've done it a few times.\n\
    \nThe first thing you must do is make your public key available. This is only\
    \ used to verify your identity and is not the same as divulging your passphrase\
    \ for say, a Drivecrypt container. Your recipient must also share with you their\
    \ key so you can respond in turn.\n\nOnly the two of you will be able to read\
    \ each other's messages. The caveat is if the other person is compromised and\
    \ you don't know about it. They will read everything you encrypt. Here is what\
    \ you need to know:\n\n1. To begin, make two keys, one public--for everyone else\
    \ but you--and one that you wouldn't even share with your own mother. You should\
    \ back this key up in a secure medium, and remember that if it isn't backed up\
    \ to three different types of media, it isn't backed up. If your truly paranoid,\
    \ send one on an encrypted microSD to your parents in case of housefire. Yes,\
    \ it does happen.\n2. If however you opt to tell mom, then she will need your\
    \ public key (you did publish it on a public key server, right?) Then you can\
    \ read it by way of your private key. She doesn't know this key (thank the gods!)\n\
    3. You can \"sign\" any message you want over Tor or anywhere else (Freenet, for\
    \ example, the highest security setting of which demands absolute trust of your\
    \ friend's darknet connection) to verify it is really you sending it.\n\n...Unless\
    \ Norman Bates does a shower scene on you and takes your keys. Your mom can then\
    \ verify with your public key that it is really you.\n4. Users you've messaged\
    \ with (or not) can sign your public key as a way of verifying your identity.\
    \ As you can see, the more people that do this, that is, vouch for you, the better.\n\
    \n**Important:**\n\nUnless you've got the photographic memory of Dustin Hoffman\
    \ in Rainman, it's a good idea to store your public/private keys and passwords\
    \ and also revocation-certificate to backup media so you can retrieve it five\
    \ years down the line... should you need it. And believe me, you will!\n\nEncrypt\
    \ them in containers. Always print your key-file or pass phrase and deposit in\
    \ a safe place. If you lose it, all documents encrypted with it are permanently\
    \ lost. There are no back-doors and no way to decrypt without it. Also, consider\
    \ making an expiration date at key-pair creation.\n\nIf you like nice and easy\
    \ interfaces, try [Mymail-Crypt](https://chrome.google.com/webstore/detail/mymail-crypt-for-gmail/jcaobjhdnlpmopmjhijplpjhlplfkhba)\
    \ for Gmail. It is a plugin that allows users to use PGP-encrypted messages in\
    \ a handy interface, though ensure your browser is air-tight secure and you trust\
    \ it with your private key.\n\nWith that said, let's configure PGP for Windows\n\
    \n- Install [Gpg4Win](http://gpg4win.org/download.html)\n- Next, create your key\
    \ in [Kleopatra](https://www.kde.org/applications/utilities/kleopatra/) and choose\
    \ `Export-Certificate-to-Server` by right click so you can publish it to a keyserver.\
    \ Get a trusted friend to \"sign\".\n- Use Claws-Mail client that comes with Thunderbird\
    \ or use [Enigmail](https://www.enigmail.net/download/) if you're using Thunderbird.\n\
    - Send a few messages back and forth to your trusted friend via PGP.\n- Optionally\
    \ you can set a Yahoo/Gmail/Hotmail filter so as to forward any messages to more\
    \ private account.\n\n### [Freenet](https://freenetproject.org/download.html)\
    \ is the granddaddy of all anonymous systems the world over, both for file sharing\
    \ or any kind of secret chats. But it is also headache inducing because it is\
    \ not beginner friendly. Explaining everything it has to offer goes far beyond\
    \ Tor discussion as they are two different systems, but I include it here as an\
    \ alternative if you find Tor lacking.\n\nAnd it is not as simple as Tor, nor\
    \ is it as fast unless you leave it running 24/7\\. It is not for everyone as\
    \ there are all manner of criminal entities that use it and you will notice this\
    \ if you load up groups. It is hard to ignore and unlike Usenet, there is no one\
    \ to file a complaint with. No one to report. It is anarchy multiplied many over\
    \ in many groups, but there are ways of mitigating the damage.\n\nBut for absolute\
    \ anonymity and freedom of speech, there is no better tool to use if you have\
    \ the patience to learn its darknet offerings.\n\nFrom the website:\n\nFreenet\
    \ is free software which lets you anonymously share files, browse and publish\
    \ \"freesites\" (web sites accessible only through Freenet) and chat on forums,\
    \ without fear of censorship. Freenet is decentralised to make it less vulnerable\
    \ to attack, and if used in \"darknet\" mode, where users only connect to their\
    \ friends, is very difficult to detect.\n\nCommunications by Freenet nodes are\
    \ encrypted and are routed through other nodes to make it extremely difficult\
    \ to determine who is requesting the information and what its content is.\n\n\
    Users contribute to the network by giving bandwidth and a portion of their hard\
    \ drive (called the data store) for storing files. Files are automatically kept\
    \ or deleted depending on how popular they are, with the least popular being discarded\
    \ to make way for newer or more popular content. Files are encrypted, so generally\
    \ the user cannot easily discover what is in his datastore, and hopefully can't\
    \ be held accountable for it. Chat forums, websites, and search functionality,\
    \ are all built on top of this distributed data store.\n"
  raw: '- Anonymity in general


    - Anything linked to Edward Snowden


    Such is the nature of the masses. One simply cannot rely on Facebook or Twitter
    or Google to respect one''s freedom to use Tor without announcing it to the whole
    world. But at least with Tor, Google cannot mine your browsing session for ads.
    No ads = no soup for them. From NBC:


    "The Internet search giant is changing its terms of service starting Nov. 11\.
    Your reviews of restaurants, shops and products, as well as songs and other content
    bought on the Google Play store could show up in ads that are displayed to your
    friends, connections and the broader public when they search on Google. The company
    calls that feature "shared endorsements.''''


    So I firewall everything I do. I use [Ghostery](https://www.ghostery.com/) for
    social sites and offer only pseudonymous details about myself. In fact, I try
    to avoid any correlation between Tor and any social media site just as one would
    a can of gasoline and a lighted match.


    Email Anonymity


    Is it possible to send a message that is foolproof against trackers, hackers and
    Big Companies?


    There are, in fact, many flavors to choose from to accomplish this task. Below
    are a few rock-solid services. Combined with Tor, they grant you a virtual fortress.


    [W3, The Anonymous Remailer](http://gilc.org/speech/anonymous/remailer.html)


    ![](image_rsrcYN.jpg)


    Connectable with Tor, you only need an email address to send the message to (preferably
    encrypted with PGP--more on that in a moment).


    Another is [Guerrilla Mail](https://www.guerrillamail.com/). They allow users
    to create throwaway emails to be used at leisure. Emails sent are immediately
    wiped from the system after you hit Send. 


    ![](image_rsrcYP.jpg)


    These services claims of anonymity would be pretty thin if we did not encrypt
    our messages-- which brings us to PGP.


    [PGP](https://en.wikipedia.org/wiki/Pretty_Good_Privacy) is the encryption standard
    of choice for many old users like myself, and for good reason. It has never been
    cracked by the NSA or FBI or any intelligence agency and likely won''t until quantum
    computers become common. It works by way of key pairs, one which is public and
    one private (the one you will use to decrypt your messages with).


    Worry not about the term "keys". It is not difficult to grasp and will be as easy
    as hitting send once you''ve done it a few times.


    The first thing you must do is make your public key available. This is only used
    to verify your identity and is not the same as divulging your passphrase for say,
    a Drivecrypt container. Your recipient must also share with you their key so you
    can respond in turn.


    Only the two of you will be able to read each other''s messages. The caveat is
    if the other person is compromised and you don''t know about it. They will read
    everything you encrypt. Here is what you need to know:


    1.)  To begin, make two keys, one public--for everyone else but you--and one that
    you wouldn''t even share with your own mother. You should back this key up in
    a secure medium, and remember that if it isn''t backed up to three different types
    of media, it isn''t backed up. If your truly paranoid, send one on an encrypted
    microSD to your parents in case of housefire. Yes, it does happen.


    2.) If however you opt to tell mom, then she will need your public key (you did
    publish it on a public key server, right?) Then you can read it by way of your
    private key. She doesn''t know this key (thank the gods!)


    3.) You can "sign" any message you want over Tor or anywhere else (Freenet, for
    example, the highest security setting of which demands absolute trust of your
    friend''s darknet connection) to verify it is really you sending it.


    ...Unless Norman Bates does a shower scene on you and takes your keys. Your mom
    can then verify with your public key that it is really you.


    4.) Users you''ve messaged with (or not) can sign your public key as a way of
    verifying your identity. As you can see, the more people that do this, that is,
    vouch for you, the better.


    Important:


    Unless you''ve got the photographic memory of Dustin Hoffman in Rainman, it''s
    a good idea to store your public/private keys and passwords and also revocation-certificate
    to backup media so you can retrieve it five years down the line... should you
    need it. And believe me, you will!


    Encrypt them in containers. Always print your key-file or pass phrase and deposit
    in a safe place. If you lose it, all documents encrypted with it are permanently
    lost. There are no back-doors and no way to decrypt without it. Also, consider
    making an expiration date at key-pair creation.


    If you like nice and easy interfaces, try [Mymail-Crypt](https://chrome.google.com/webstore/detail/mymail-crypt-for-gmail/jcaobjhdnlpmopmjhijplpjhlplfkhba)
    for Gmail. It is a plugin that allows users to use PGP-encrypted messages in a
    handy interface, though ensure your browser is air-tight secure and you trust
    it with your private key.


    With that said, let''s configure PGP for Windows


    - Install [Gpg4Win](http://gpg4win.org/download.html)


    - Next, create your key in [Kleopatra](https://www.kde.org/applications/utilities/kleopatra/)
    and choose Export-Certificate-to-Server by right click so you can publish it to
    a keyserver. Get a trusted friend to "sign" and establish trust.


    - Use Claws-Mail client that comes packaged with it or use [Enigmail](https://www.enigmail.net/download/)
    if you''re using Thunderbird.


    - Send a few messages back and forth to your trusted friend via PGP to get the
    hang of things.


    - Optionally you can set a Yahoo/Gmail/Hotmail filter so as to forward any messages
    that contain "Begin PGP message" to a more private account.


    [Freenet](https://freenetproject.org/download.html)


    This is the granddaddy of all anonymous systems the world over, both for file
    sharing or any kind of secret chats. But it is also headache inducing because
    it is not especially beginner friendly. Explaining everything it has to offer
    goes far beyond our Tor discussion as they are two different systems, but I include
    it here as an alternative if you find Tor lacking.


    And it is not as simple as Tor, nor is it as fast unless you leave it running
    24/7\. It is not for everyone as there are all manner of criminal entities that
    use it and you will notice this if you load up any groups. It is hard to ignore
    and unlike Usenet, there is no one to file a complaint with. No one to report.
    It is anarchy multiplied many times over in many groups, but there are ways of
    mitigating the damage.


    But for absolute anonymity and freedom of speech, there is no better tool to use
    if you have the patience to learn its darknet offerings.


    From the website:


    Freenet is free software which lets you anonymously share files, browse and publish
    "freesites" (web sites accessible only through Freenet) and chat on forums, without
    fear of censorship. Freenet is decentralised to make it less vulnerable to attack,
    and if used in "darknet" mode, where users only connect to their friends, is very
    difficult to detect.


    Communications by Freenet nodes are encrypted and are routed through other nodes
    to make it extremely difficult to determine who is requesting the information
    and what its content is.


    Users contribute to the network by giving bandwidth and a portion of their hard
    drive (called the "data store") for storing files. Files are automatically kept
    or deleted depending on how popular they are, with the least popular being discarded
    to make way for newer or more popular content. Files are encrypted, so generally
    the user cannot easily discover what is in his datastore, and hopefully can''t
    be held accountable for it. Chat forums, websites, and search functionality, are
    all built on top of this distributed data store.'
