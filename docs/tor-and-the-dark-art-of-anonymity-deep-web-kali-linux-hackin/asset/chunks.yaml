  trans: '


    最近的一项重要进展（很少有网络具备这一特性）是“暗网”（darknet）：通过仅与他们信任的人连接，用户可以极大降低自身的脆弱性，但仍然通过朋友的朋友的朋友等方式连接到全球网络。这使得人们即使在
    Freenet 可能非法的地方也能使用 Freenet，让政府很难对其封锁，而且不需要依赖通往“自由世界”的隧道。


    这并不像使用 Usenet 提供商的新闻组阅读器那么简单。不，先生，Freenet 需要耐心。使用 `Frost` 或 `Fuqid`（Freenet 主程序的前端应用），你可能需要等半小时才能“订阅”群组，或像你使用
    Usenet 那样下载内容。某些群组（如 Freenet 群组和其他技术组）会立即可用，但信息较少。时间会解决这个问题。所以，如果你计划订阅很多群组，就让它在柜子里运行，然后忘掉它一天左右。


    这种等待是值得的。


    ## Frost & Fuqid


    我推荐的两个免费前端是：`Frost` 和 `Fuqid`。


    `Frost` 经历了很多改进，但我建议你先尝试 `Fuqid`，因为它是 Freenet 第一个外部应用，可以作为文件的插入/下载管理器。`Fuqid`
    代表：`Freenet Utility for Queued Inserts and Downloads`，可以在 Windows 或 Linux 上通过
    `wine` 运行。


    `Fuqid` 的站点位于 Freenet 内部，地址为：


    `USK@LESBxzEDERhGWQHl1t1av7CvZY9SZKGbCnsD7txqX0I,nP0CHuKvlbVzcrnz79TEd22E56IbKj-KHB-W8HHi9dM,AQACAAE/Fuqid/-1/`


    你需要将上述内容粘贴到 Freenet 前控制面板中显示“Key”的地方。如果你是该系统的新手，加载可能需要几分钟。


    安装完成后，在左侧板板列表上右键点击并选择“Add new board”（添加新板板）。在名称处输入 `fuqid-announce`（不带引号）。你现在会在板列表中列表中一个名为
    `fuqid-announce` 的新板板。


    右键点击此板板并选择“Configure selected board”（配置选定板板）。这将弹出一个新窗口。在该窗口上点击“Secure board”（安全板板）将其从公共板板更改。现在在“Public
    key”部分粘贴下方的密钥：


    `SSK@qoY-E5SKRu66pmKH64xa~R~w3hXmS5ZNtqnpEGoCVww,HTVcdWChaaebfRAublHSxBSRaRFG91qCwsa3mGF3-QE,AQACAAE`


    ## 密码


    良好的强密码就像在你的密室里养了两只睡觉的罗威犬。大多数入侵者在混乱开始时就会离开。弱密码就像养了一只金毛猎犬。善良友好，在孩子身边很容易信任，但当那个入侵者在凌晨
    3 点来临时它可能只会小叫一下。然后它会躲在咖啡桌下（是狗，不是入侵者）。


    多年来我一直听到，永远不要使用任何个人信息作为密码。这包括姓氏、喜欢的书、电影。那么解决方案是什么呢？


    用一或两个符号对你的密码进行重新组合。如果你认为黑客猜不出你女朋友储物柜组合锁的名字，那你就错了。即使你稍微混合一下，猜到也易如反掌。致力于此项工作的计算机可以在不到一个纳秒内猜出许多个。


    但你如何记住一个通过 Tor 使用且带有符号的网站密码呢？


    - 简单。使用一个只有你容易记忆的短语（passphrase）。首先写下每个单词的首字母，注意大小写和位置。在其中插入符号。例如：


    `Last Sunday, the wife bought me a Rolex watch and it was too ugly.`


    更改后它变为：


    `LS,twbmarwaiw2u`


    上面的密码对黑客来说很难猜到，但对你来说很容易记住……假设你擅长替换。


    ### 更改密码


    只要你完全遵循了上述操作，你就不需要每 90 天更换一次密码。我确定你已经从双方听过他们对这一主题的看法，但我相信研究已经证明，保持强密码（除非有证据证明泄露）是一个稳妥的选择。


    来自 ACM/CCS 2010 的研究论文由 Yinqian Zhang、Fabian Monrose 和 Michael Reiter 撰写的《现代密码过期的安全性：一种算法框架和实证分析》得出结论：每隔几个月更改一次密码并没有（重复，强调，并没有）增加安全性：


    至少 41% 的密码可以在几秒钟内通过同一账户之前的密码被离线破解，而且根据预期，五次在线密码猜测就足以攻破 17% 的账户。


    ……我们的证据表明，完全取消密码过期可能是恰当的，或许作为一种妥协，要求用户投入精力选择一个比平时强得多的密码（例如，长得多的短语）。……


    从长远来看，我们认为研究支持这一结论：应该完全放弃基于密码的简单身份验证。


    ### 在 Tor 浏览器中存储密码


    你可能注意到 Tor 浏览器中的“记住密码”选项不可用，或者看起来是这样。但如果你查看隐私设置并将记录设置更改为“记住记录”和“记住网站密码”，它就不再是灰色的了。


    ### Diceware


    如果你必须存储密码，一个很好的选择是 [Diceware](http://world.std.com/~reinhold/diceware.html) ——
    你可以在那里获取任何过期密码。你可以将任何密码复制到文本文件中，发送给自己或存放在移除式磁盘上。


    记住：Tor 无法提高你的*系统*。它只提高在线安全性，而且在负责任的使用时也是如此。


    ## 防止非 Tor 活动与 Tor 活动关联


    同时浏览不同的网站是有风险的，这会破坏匿名性，因为 Tor 可能通过同一个电路发送每个网站的请求，出口节点可能会看到关联。


    更好的做法是一次浏览一个网站，然后从 Tor 按钮中选择“新身份”。


    此外，如果你想隔离两个不同的应用程序（允许一个应用程序执行的操作与另一个应用程序的操作隔离），你可以让它们使用相同的 SOCKS 端口但更改用户/密码。


    ## 记录器


    你可能好奇键盘记录器与 Tor 有什么关系。或者说，键盘记录器到底是什么。你并不孤单。事实上，你会惊讶有多少人不知道，也会惊讶有多少技术人员认为这没问题。


    2010 年，我联系了一位十多年没见过的老童玩朋友。他现在是一名 ATF 探员。他在关于黑客组织“匿名”的 Facebook 帖子下回复了我。


    “键盘记录器是什么？”他问。我等等其他人回复。没有人回复，所以我告诉了。。他看起来非常惊讶、目瞪口呆，仿佛那是最近才释放到网络上的东西。但（叹气），对于它们具体在做什么存在很多困惑。


    '
- fmt: 'They are surveillance software that tracks and records every click you make,
    every website visited, every keystroke typed. Chats, Skype, Emails. If you can
    type it, it can record it and all right under your very nose. It can even email
    what you type to a recipient on the other side of the world. CC numbers, passwords
    and Paypal login details are just the short list of targets it can acquire.


    ## How does one get in infected?


    - Opening an email attachment

    - Running an `.exe` file from a P2P network from an untrusted user

    - Accessing an infected website with an outdated browser

    - The NSA, if they can grease the right palms


    Some employers use them to track productivity of employees. Some wives attach
    one via `USB` (Hardware version) to see who their hubbies are conversing with
    at night after bed. Parents use them on the kid''s computer. So it isn''t like
    they''re 100% malicious all the time.


    But they are devilishly difficult to detect. They wield an almost vampiric presence,
    but like vampires there are subtle signs you can glean without whipping out a
    wooden stake.


    ## Signs


    - Sluggish browsing speed

    - Laggy mouse/pausing keystrokes in a text doc

    - Letters don''t match on display with what you type

    - Errors on multiple webpages when loading heavy text/graphics


    There are two types:


    ### Software Keyloggers


    This type hides inside your operating system. They lurrrve `Windows`. `Linux`,
    not so much. The keylogger records keystrokes and sends them to a hacker or other
    mischief maker at set times provided the computer is online. Cloaked, most users
    will never see it working its dark art. Many popular anti-virus vendors have trouble
    identifying it because the definitions change so frequently.


    ### Hardware Keyloggers


    Bond might have used one of these. Being hardware, it is a physical extension
    that can plug into any `USB` on a `PC` and can be bought online by suspecting
    spouses or kids wanting access to their dad''s porn stash. Keystrokes are logged
    to `ram` memory. No install needed.


    Thus, unless you''re the type to check your `PC` innards every day, you might
    not spot it until it''s too late. They also can be built right into the keyboard.
    The FBI loves swapping the target''s out with a carbon copy custom-built surveillance
    device. Granted, this is mainly for high-value targets like the Mafia but they''re
    available to anyone.


    ## Keylogger Prevention


    - Check your keyboard for suspicious attachments. If you are an employee at `X`
    company and a new keyboard arrives at your desk one morning, exercise caution
    unless you trust your boss 200%.

    - Use a `Virtual Keyboard`. No keystrokes = no logging!

    - Use [Guarded ID](http://www.guardedid.com/) to prevent hackers from capturing
    your keystrokes. It works by scrambling everything you type, rendering any info
    useless to hackers.

    - Use a decent firewall to stop a keylogger from delivering your data. A year
    ago, my `Comodo` firewall alerted me to suspicious network activity seemingly
    out of nowhere when I wasn''t doing anything online. Turns out I had the `Win64/Alureon`
    trojan. I had to use `Malwarebytes` to detect and remove it. `Norton` was useless!
    Imagine that.


    ## Other Anti-Keyloggers


    If you do not mind spending some coin, there are a few more:


    ### Zemana AntiLogger


    ![](image_rsrcYR.jpg)


    This "free" version is a bare-bones keylogger-detector. In fact, it''s quite stripped
    down but if all you require is being alerted then this might be for you. The `Keylog
    Guard` offers encryption for all things typed at the keyboard. Any snooper will
    only get garbled letters from you. The paid version is somewhat pricey at $29.99
    and comes with extra-protection for malware and such but is a bit overkill.


    Also, it will nag you if you try and run something safe it doesn''t like, much
    like every other anti-virus will.


    ### SpyShelter STOP-LOGGER


    ![](image_rsrcYS.jpg)


    The Free version offers more than Zemana does in that you get screenshot capture.
    It will also alert you to any code that tries to swipe your keystrokes from you
    but the Free version is not 64-bit compatible. It is $24.99.


    Be aware, however, that removing a keylogger is nasty business as they have a
    habit of reinstalling themselves. Keyloggers will often hide as a service in `svchost.exe`
    so task manager isn''t much help without a dedicated app. The optimal way of prevention
    is to stop them in their tracks before insertion.


    Be proactive. Anticipate a password compromise. Remember, vigilance!


    ## Darknet Markets


    Some of you might be wondering how safe a Darknet really is in light of the vulnerabilities
    discussed. The short answer is this: As safe as you make it.


    You are the weak link. The last link in the security chain. And although you need
    `Tor` to access `Onion` sites, the term can apply to any anonymous network - networks
    like `I2P` or `Freenet` or anything else that cloaks the source of data transmit,
    and by extension, your identity.


    Which brings us to the Darknet Marketplace.


    The complete list of such marketplaces on the deep web are numerous, and the risk
    of getting scammed is quite high. It''s one reason why you may not have heard
    about them. They are often taken down quickly by either a venomous reputation
    or a law enforcement bust. Sometimes they piss off the wrong people and then spammers
    `ddos` the site. But there are numerous places one can go if you''re curious about
    what is sold by whom.


    When I say sold, what I mean is... Anything you want that cannot be gained through
    the usual channels. And remember that what is legal in one country may be illegal
    in another. In Canada, `lolicon` comics are illegal and can get you in trouble.
    But not in America. In the `USA` you can pretty much write any story. In Canada?
    `TEXT` stories involving minors are verboten.


    The other difference is that there are safety nets in buying anything in first
    world country on the open market. Think `BestBuy`. Mom and Pop stores. Florist
    shops. If customers get injured, what happens? Customers sue via the legal net
    and make a lot of money.


    But the Darknet Marketplace laughs at any safety nets. In fact, you''re likely
    to get sc at least a few times before finding a reputable dealer for whatever
    you seek.


    Therefore, research any darknet market with `Tor`, being careful to visit forums
    and check updated information to see if any sites have been flagged as suspicious
    or compromised. Some other advice:


    - Always use `PGP` to communicate.

    - Never store `crypto-currency` at any such marketplace.

    - Assume a den of thieves unless proven otherwise by them. The responsibility
    is theirs just as it is offline, to prove they are an honest business. If you
    open your own, keep this in mind: customers owe you nothing. You can only betray
    them once.


    So then, how does one tell a scam?


    Because many new darknet vendors will arise out of thin air, with rare products
    that will make customers swoon and send them money without doing any research
    on their name or previous sales. A real hit and run operation. Hit quick and fast
    and dirty. Seduce as many as they can before the herd catches on to the wolf in
    disguise. Many are suckered, thinking "it''s only a little money" but a little
    money from a lot of `Tor` users goes a long way in encouraging other scammers
    to set up shop.


    When you ask them why they do not offer escrow, they say "We think it is unreliable/suspicious/unstable"
    amid other BS excuses. It is better to hold on to your small change than leave
    a trail to your treasure chest. And make no mistake some of these scammers are
    like bloodhounds where identity theft is concerned.'
