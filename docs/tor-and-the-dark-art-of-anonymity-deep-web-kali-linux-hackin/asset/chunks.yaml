    ![](img/image_rsrcYM.jpg)


    你可能会好奇的问题是：多大的安全性才算过度？哪些是过度，哪些又不是？


    嗯，对此问题的完美答案是：如果你被发现，你会陷入多深的危机？而你愿意投入多少阅读时间来防止这种情况的发生？`Tails` 更容易上手，如果你不预预期访问的网站会有攻击，那么请务必使用
    `Tails`。


    然而，如果你住在北朝鲜或中国，那么就有面临二十年苦役的可能——敲击毫无价值的石头。也就是说，如果他们看到从你的所在地发出的与“他们不喜欢的活动”相关的 `Tor`
    活动……或者在朝鲜的情况下，任何其他情况都是如此。他们不喜欢局外人给农民带来希望。如果你在那个国家被捕，在见到法官之前，你就会被定罪了。


    ## Whonix 及其使其更安全的特性


    - 匿名发布/反审查

    - 使用带有 `Thunderbird` 或 [`TorBirdy`](https://addons.mozilla.org/en-us/thunderbird/addon/torbirdy/)
    的匿名电子邮件

    - 在 `Tor` 后方添加代理（`user` -> `Tor` -> `proxy`）

    - 匿名聊天。

    - IP/DNS 协议泄露防护。

    - 隐藏你正在使用 `Tor`

    - 隐藏你正在使用 `Whonix` 的事实

    - `Tor` 上 Mixmaster

    - 安全且分布的时间同步机制

    - 隔离安全

    - 无需注册匿名发送电子邮件

    - Torify 任何应用

    - Torify Windows

    - 虚拟机镜像 (VM)

    - `VPN` 支持

    - 匿名使用 Adobe Flash

    - 匿名使用 Java/Javascript


    以下是一个中等安全系统的示例：


    - 在带有你任选的 `Linux` 版本的内存棒上运行 `Whonix`。

    - 使用你信任的 `VPN`。


    关于安全性，还有两点需要注意：


    - 如果使用咖啡馆的 WiFi，避免定期使用非 `Tor` 的 WiFi 平板

    - 清楚你计划使用 `Tor` 的区域内每个处监控摄像头的位置


    ## MAC 地址


    新的 WiFi/以太网卡具有某种有助于追踪你的东西。它是一个由制造商固化的的 48 位标识符。类似于你手机的 IMEI。如果你万一没有清醒地考虑，而在考虑到
    `Tor` 的情况下用信用卡购买了电脑，你可能会被 FBI 的 "NIT" 盯，他们会扫描你的 `MAC` 号。`Nit` 是“网络调查技术”（Network
    Investigative Technique）的缩写。如果发生这种情况，你就完蛋了，因为你会被某个为他们工作且时间过多的闲随所追踪。


    击败这一点的方法是使用一次性的 `MAC` 地址（是指数字，而不是 Apple 产品）——一个你用现金购买、且没有摄像头盯着你背后的这种地址。这样你就可以瞬间丢弃它，或者在意识到他们盯上你时将其更换。


    ## Whonix 桥节点 (Bridges)


    在 `Whonix` 中使用桥节点是有益的。


    ### 什么是桥节点


    桥节点是混淆工具，用于向多管的 ISP 或政府隐藏你的 `Tor` 使用情况，他们可能会看到你正在使用 `Tor`，但不知道你在用它做什么。为此，`Tor`
    桥节点是进入 `Tor` 网络的替代方式。有些是私有的。许多是公共的。有些列在 `Tor` 首页上。在敌对环境中，你可以看到利用它的价值，因为它让 ISP
    知道你正在使用 `Tor` 变得困难得多。


    ### 桥节点不是什么


    它们并不是特别不可靠，但在性能方面，它们确实比普通的 `Tor` 使用不可靠。但这种权衡可能符合你的最佳利益。只有你才能决定这种性能损失是否值得。以下是在
    `Whonix` 中如何操作的方法。


    桥节点必须手动添加，因为 `Whonix` 没有自动安装方法，但这并不困难。你只需将它们输入正确的目录，如下：


    `/etc/tor/torrc`


    如果你使用的是图形界面 `Whonix-Gateway`，则导航到：


    开始菜单 -> 应用程序 -> 设置 -> `/etc/tor/torrc.examples`


    要编辑你的 `torrc` 文件（添加桥节点是所需的），导航到：


    开始菜单 -> 应用程序 -> 设置 -> `/etc/tor/torrc`


    然后添加你从 `Tor` 桥节点页面复制的任何桥节点（如果你有私有的则使用它）。然后重启 `Tor` 使其生效。


    ## 在 Tor 之外在线使用真实姓名


    在在线上使用真实姓名有什么危险？


    我不想说，但即使有了我所学的一切，答案现在和以前 `Facebook` 刚出现时是一样的。事实上，我怀疑现在的答案和我青少年早期潜伏在名为名为 `The Well`
    的在线聚集地时面对的答案是一样的。


    答案是：这取决于情况。


    那些从你的社交媒体资料中挖掘数据的执法部门和潜在雇主，往往比小偷更糟——当你在 `Twitter` 上宣布你要离开城两周时，小偷会垂涎口水。小偷虽然确实不光彩，但在职业上他们比许多在你背后搞小动作的企业巨头诚实得多。


    雇主是这群人中最糟糕的。像哈佛·双面脸一样虚伪。他们要求你的生活透明化，但从不要求他们自己。发一个激进的政治帖子，或者在波波拉波波岛度假时和半裸的菲律宾女性一起喝葡萄酒，而那些玩火表演者在背景中表演时，你可能会失去工作……甚至被拒绝工作。这不是开玩笑。这确实会。同样，如果你在简历上提到你使用
    `Tor`，你有一天可能会听到面试官问：


    “我注意到你非常喜欢 `Tor` 以及其他隐藏你的 IP 地址并防止……身份泄露的匿名工具。”


    “因为我看重自由。”


    这让我彻底没戏了。


