  trans: "\n\n# 通用匿名性\n\n-   与爱德华·斯诺登（Edward Snowden）相关的任何内容\n\n大众的本质如此。你根本无法依靠 Facebook、Twitter\
    \ 或 Google 在不向全世界宣告的情况下就尊重你使用 Tor 的自由。但至少使用 Tor，Google 无法为了广告挖掘你的浏览会话。没有广告 = 他们就没有汤可喝。根据\
    \ NBC 报道：\n\n“这家搜索引擎巨头将从 11 月 11 日起更改其服务条款。你对餐厅、商店和产品的评价，以及在 Google Play 商店购买的歌曲和其他内容，可能会出现在当他们在\
    \ Google 上搜索时向你的朋友、联系人和更广泛公众显示的广告中。该公司将功能称为‘共享背书’。”\n\n因此，我对我所做的一切都设置了防火墙。我在社交网站使用\
    \ [Ghostery](https://www.ghostery.com/)，并只提供关于自己的伪匿名细节。事实上，我试着避免 Tor 与任何社交媒体网站之间的任何关联，就像避免汽桶和点燃的火柴一样。\n\
    \n## 电子邮件匿名性\n\n是否可能发送一条针对追踪器、黑客和大公司具有完全防范的消息？\n\n### 事实上，有很多种选择可以完成这项任务。以下是几个非常稳固的服务。结合\
    \ Tor，使用，它们将为你提供一个虚拟堡垒。\n\n### [W3，匿名重发邮件器](http://gilc.org/speech/anonymous/remailer.html)\n\
    \n![](img/image_rsrcYN.jpg)\n\n可以与 Tor 连接，你只需要一个电子邮件地址即可发送消息（最好用 PGP 加密——稍后详细介绍）。\n\
    \n另一个是 [Guerrilla Mail](https://www.guerrillamail.com/)。他们允许用户创建临时邮箱供随时使用。点击“发送”后，发出的邮件会立即从系统中擦除。\n\
    \n![](img/image_rsrcYP.jpg)\n\n如果我们不对消息进行加密，这些服务的匿名性声明将显得很无力——这让我们提到了 PGP。\n\n\
    ### [PGP](https://en.wikipedia.org/wiki/Pretty_Good_Privacy) 是许多像我这样的老用户的首选加密标准，这是有道理的。它从未被\
    \ NSA、FBI 或任何情报机构破解，而且在量子计算机普及之前，可能都不会被破解。它通过密钥对对工作，一个是公钥，一个是私钥（你将用它来解密你的消息）。\n\
    \n不用担心“密钥”这个词。它并不难理解，一旦你操作过几次，就会像点击发送一样简单。\n\n你必须做的第一件事是让你的公钥可用。这仅用于验证你的身份，不等同于泄露你的密码（例如用于\
    \ Drivecrypt 容器的密码）。你的接收者也必须与你分享他们的密钥，以便你进行回复。\n\n只有你们两个能够读取彼此的消息。例外是，如果对方被攻破而你并不知道，他们将读取你加密的所有内容。以下是你需要知道的\n\
    \n1.  首先，创建两个密钥：一个是公钥——供你以外的所有人使用——另一个是你甚至连亲老妈都不会分享的私钥。你应该在安全介质中备份此密钥，并记住，如果它没有备份到三种不同类型的介质中，它就不算被备份。如果你真的非常偏执，可以将其中一个通过加密的微\
    \ SD 卡发送给你的父母，以防发生房屋火灾。是的，这种情况确实会发生。\n2.  但是，如果你选择告诉妈妈，那么她需要你的公钥（你已经在公钥服务器上发布了它，对吧？）。然后你可以通过你的私钥读取它。她不知道这个密钥（感谢上苍！）。\n\
    3.  你可以通过 Tor 或任何地方（例如 Freenet，其最高安全设置要求对朋友的暗网连接有绝对信任）“签名”任何你想发送的消息，以验证它确实是由你发送的。\n\
    \    ……除非诺曼·贝提斯（Norman Bates）对你进行了一场淋浴戏并拿走了你的密钥。然后你妈妈就可以通过你的公钥验证确实是你。\n4.  你发过消息（或没发过消息）的用户可以签名你的公钥作为验证你身份的一种。正如你所见，这样做的人越多（也就是说，为你担保的人越多），效果越好。\n\
    \n**重要：**\n\n除非你拥有《雨人》中达斯汀·霍夫曼（Dustin Hoffman）的摄影记忆，否则将你的公钥/私钥、密码以及撤销证书存储在备份介质是一个好主意，这样你可以在五年后检索到它们……如果你需要的话。相信我，你将需要的！\n\
    \n将它们加密在容器中。始终打印你的密钥文件或口令，并存放在安全的地方。如果你丢失了它，所有用它加密的文档将永久丢失。没有后门，没有它就无法解密。此外，考虑在创建密钥对时设置过期日期。\n\
    \n如果你喜欢简单易用的界面，尝试用于 Gmail 的 [Mymail-Crypt](https://chrome.google.com/webstore/detail/mymail-crypt-for-gmail/jcaobjhdnlpmopmjhijplpjhlplfkhba)。这是一个允许用户在方便的界面中使用\
    \ PGP 加密消息的插件，但要确保你的浏览器是万密封的，并且你信任它处理你的私钥。\n\n如此，让我们为 Windows 配置 PGP\n\n-   安装\
    \ [Gpg4Win](http://gpg4win.org/download.html)\n-   接下来，在 [Kleopatra](https://www.kde.org/applications/utilities/kleopatra/)\
    \ 中创建密钥，并右键点击 `Export-Certificate-to-Server` 以便将其发布到密钥服务器。找一个信任的朋友来“签名”。\n-  \
    \ 使用自带的 Claws-Mail 客户端，或者在使用 Thunderbird 时使用 [enigmail](https://www.enigmail.net/download/)。\n\
    -   通过 PGP 向你信任的朋友发送一些消息。\n-   你可以选择设置 Yahoo/Gmail/Hotmail 过滤器，转发到更私密的账户。\n\n\
    ### [Freenet](https://freenetproject.org/download.html) 是全球所有匿名系统的祖师，用于文件共享或浏览和发布“自由站点”（仅通过\
    \ Freenet 访问的网站）以及在论坛聊天，而无需担心审查。但因为它对新手不友好，但也令人疼。解释它提供的功能远超 Tor 讨论，因为它们是两个不同的系统，但如果你发现\
    \ Tor 无法满足需求，我在这里作为一个替代方案。\n\n而且它不像 Tor 那么简单，也不除非你一直运行。它并不适合所有人，因为有各种犯罪实体在使用它，如果你加载小组就会发现这一点。它很难被忽视，而且不像\
    \ Usenet 那样有人可以投诉。没有人可以举报。它在许多小组中处于无政府主义状态，但有减轻损害的方法。\n\n但对于绝对的匿名和言论自由，如果你有耐心学习它的暗网功能，没有比这更好的工具了。\n\
    \n来自网站介绍：\n\nFreenet 是一款免费软件，让你能够匿名共享文件、浏览并发布“自由站点”（仅通过 Freenet 访问的网站）以及在论坛聊天，而无需担心审查。Freenet\
    \ 是去中心化的，使其不易受到攻击，并且如果使用“暗网”模式（即用户仅与其朋友连接），则很难被检测。\n\nFreenet 节点之间的通信是加密的，并通过其他节点进行路由，使得极难确定谁在请求信息以及信息的内容。\n\
    \n用户通过提供带宽和部分硬盘空间（称为数据存储）存储文件来向网络做出贡献。文件根据其流行程度自动保留或删除，最不流行的文件会被丢弃，为更新或更流行的内容腾出空间。文件是加密的，因此用户通常无法发现其数据存储中的内容，并希望不必为此承担责任。聊天论坛、网站和搜索功能都构建在这个分布式数据存储之上。\n\
    \n"
- fmt: '

    An important recent development, which very few other networks have, is the "darknet":
    By only connecting to people they trust, users can greatly reduce their vulnerability,
    and yet still connect to a global network through their friends'' friends'' friends
    and so on. This enables people to use Freenet even in places where Freenet may
    be illegal, makes it very difficult for governments to block it, and does not
    rely on tunneling to the "free world".


    It is not as simple as using a Usenet provider''s newsgroup reader. No sir, Freenet
    requires patience. Using `Frost` or `Fuqid` (Front End apps for the main Freenet
    program), it might be half an hour before you can "subscribe" to groups or download
    in the way you can Usenet. Some groups, like the Freenet group and other technical
    groups will be immediately available, but with few messages. Time will solve this.
    So keep it running in the closet and forget about it for a day or so if you plan
    on subscribing to a lot of groups.


    It will be worth the wait.


    ## Frost & Fuqid


    The two free front ends I recommend are: `Frost` and `Fuqid`.


    `Frost` has seen a lot of improvements but I recommend you try `Fuqid` first as
    it is the first external app for Freenet that acts as as insert/download manager
    for files. `Fuqid` stands for: `Freenet Utility for Queued Inserts and Downloads`
    and runs on Windows or Linux under `wine`.


    The `Fuqid` freesite is on Freenet itself at:


    `USK@LESBxzEDERhGWQHl1t1av7CvZY9SZKGbCnsD7txqX0I,nP0CHuKvlbVzcrnz79TEd22E56IbKj-KHB-W8HHi9dM,AQACAAE/Fuqid/-1/`


    You will need to paste the above into Freenet''s front control panel where it
    says "Key". It can take several minutes to load if you''re new to the system.


    After you''ve installed it, right click on the left side with your list of boards
    and choose "Add new board". For the name put in `fuqid-announce` with out the
    quotes. You will now find a new board called `fuqid-announce` in your list of
    boards.


    Right click this board and choose "Configure selected board". This will bring
    up a new window. On that window click "Secure board" to change it from a public
    board. Now in the section that says "Public key" paste in the key below:


    `SSK@qoY-E5SKRu66pmKH64xa~R~w3hXmS5ZNtqnpEGoCVww,HTVcdWChaaebfRAublHSxBSRaRFG91qCwsa3mGF3-QE,AQACAAE`


    ## Passwords


    Good, strong passwords are like having a couple of Rottweilers sleeping in your
    den. Most intruders will leave when the chaos starts. Weak passwords are like
    having a Golden Retriever. Nice and friendly and easy to trust around kids, but
    might just let out a little woof at 3AM when said intruder comes. Then he will
    hide under the coffee table (the dog, not the intruder).


    I''ve heard for years that you should never use anything personal as your password.
    That includes family names. Favorite books. Movies. So what''s the solution?


    Remix your passwords with a symbol or two. If you think a hacker won''t be able
    to guess the name of your girlfriend''s locker combination, you''d be mistaken.
    It is dirt simple to guess even if you mix it up a bit. Computers devoted to this
    practice can guess many in less than a nanosecond.


    But how do you remember a password for a site used over Tor that has symbols?


    - Easy. Use a passphrase that is simple to recall for you only. First write out
    the first letter of each word, taking not of case and position. Insert symbols
    therein. For instance:


    `Last Sunday, the wife bought me a Rolex watch and it was too ugly.`


    Which when changed is:


    `LS,twbmarwaiw2u`


    The above pass is hard for a hacker to guess but easy for you to remember... assuming
    you are good at substitution.


    ### Changing Your Passwords


    Provided you''ve followed the above to the letter, you shouldn''t have to rotate
    out your passwords every 90 days. I''m sure you''ve heard from both sides of the
    aisle their say on the subject, but I believe research has proven that keeping
    a strong password (unless proof of compromise) is a safe bet.


    The research paper from ACM/CCS 2010: "The Security of Modern Password Expiration:
    An Algorithmic Framework and Empirical Analysis" by Yinqian Zhang, Fabian Monrose
    and Michael Reiter came to the conclusion that changing passwords every few months
    did not, repeat, did NOT increase security:


    at least 41% of passwords can be broken offline from previous passwords for the
    same accounts in a matter of seconds, and five online password guesses in expectation
    suices to break 17% of accounts.


    ....our evidence suggests it may be appropriate to do away with password expiration
    altogether, perhaps as a concession while requiring users to invest the effort
    to select a significantly stronger password than they would otherwise (e.g., a
    much longer passphrase). ....


    In the longer term, we believe our study supports the conclusion that simple password-based
    authentication should be abandoned outright.


    ### Storing Passwords in Tor Browser


    You may have noticed that the "Remember Password" option in Tor Browser is not
    available, or so it seems. But if you look at the privacy setting and alter the
    history setting to "remember history" and "remember passwords for sites," it will
    no longer be greyed out.


    ### Diceware


    If you must store passwords, a good option for a unique one is [Diceware](http://world.std.com/~reinhold/diceware.html)
    – where you can get an expire date for any password. You can copy any password
    to a text file then encrypt it and mail it to yourself or place on removable drive.


    Remember: Tor does nothing to improve your *system*. It only improves security
    online, and even then when used responsibly. Tor has no idea if your version of
    Windows is unpatched and infected with a payload.


    ## Preventing Non-Tor Activity From Being Linked with Tor Activity


    It is risky to browse different websites simultaneously and preserve anonymity
    since Tor might end up sending requests for each site over the same circuit, and
    the exit node may see the correlation.


    It is better to browse one site at a time and thereafter, choose "New Identity"
    from the Tor button. Any previous circuits are not used for the new session.


    Further, if you want to isolate two different apps (allow actions executed by
    one app to be isolated from actions of another), you can allow them to use the
    same SOCKS port but change the user/pass.


    ## Keyloggers


    You might wonder what a keylogger has to do with Tor. Or for that matter, what
    a keylogger even is. You''re not alone. In fact you''d be surprised how many people
    don''t know and shocked how many techs consider them a non-issue.


    In 2010 I caught up with an old childhood friend of mine I had not seen in over
    a decade. He was now an ATF agent. I was surprised and (falsely) assumed his extensive
    training meant he knew as much as an NSA agent when it came to computer security.
    Wrongo. He replied to a post I made on a Facebook regarding the hacking group
    "Anonymous."


    "What''s a keylogger?" he asked. I waited for someone else to reply. No one did
    so I told him. He seemed amazed, dumbfounded, as though it were something only
    recently unleashed upon the net. But (sigh), there''s a lot of confusion on what
    they do exactly. Some people call them spyware. Others say they''re trojans. Still
    others, exploits. They''re a little bit of everything to be honest.

    '
