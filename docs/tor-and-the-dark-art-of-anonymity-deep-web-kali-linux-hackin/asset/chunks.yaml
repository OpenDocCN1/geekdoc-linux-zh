- fmt: '

    As you probably know, it''s more costly to go after a high-value target. But they
    don''t know if you are a high-value target or merely low-hanging fruit. As we''ve
    seen in the case of bored Harvard students, anyone can get into serious trouble
    if they go into Tor blind.


    Even Eric Holder has publicly pointed out that Tor users are "non-US persons"
    until identified as citizens. They do this using two methods:


    ## The Quantum and FoxAcid System


    More on how to defeat this later, but here is the gist of it:


    - Both systems depend on secret arrangements made with telcos.

    - Both involve lulling the user into a false sense of security.

    - Neither system can make changes to a LiveCD (`Tails`) (that''s in our favor)

    - Both can be defeated by adhering to consistent security habits.


    Defeating this requires a mindset of diligence, and as you probably know, diligence
    is not compatible with procrastination. Therefore, you must resist the urge to
    procrastinate.


    I say again. DO NOT procrastinate. Decide ahead of time to avoid risky behavior.
    We''ll get to them all. A good, security mindset takes time and effort and commitment
    to develop, true enough, but should be nurtured from the very beginning, which
    is why the RISKS are placed up front, ahead of even the installation chapter.
    Things tend to drag in the middle of a book like this, and are often forgotten.


    Speaking of risk, if you want to know what truly keeps me up at night, it''s this
    question:


    What do other nations tell high-level CEOs and intelligence agencies (Hong Kong,
    for instance)?


    If the only thing I can trust is my dusty old 486 in my attic with `Ultima 7`
    installed atop my 28.8k dialup modem, then it''s safe to assume every commercial
    entity is jeopardized by the NSA. And if that''s true, if the NSA has to jump
    hoops to spy on us, how easy is it to infiltrate American-owned systems overseas
    with our data on those systems?


    If no corporation can keep their private info under wraps, then eventually the
    endgame may evolve into a Skynet grid similar to the Soviet-era East/West block
    in which CEOs have to choose east or west. But that''s like trying to decide whether
    you want to be eaten by a grizzly bear or a lion.


    That''s jumping the gun a bit, but at least now you know the real risks. The main
    ones, anyway.


    Every one of these risks can be minimized or outright defeated using knowledge
    that is in this book. The sad part is that most readers will forget roughly 80%
    of what they read. Those who take action will retain that 80% because they are
    making what they''ve read a reality: Making brilliant chesslike countermoves when
    the NSA threatens your Queen. If you don''t take action, but merely sit there
    waiting forever to make your move, you forfeit the game. They win. So don''t be
    like a frog in a slowly boiling pot of water, because not only will you perish,
    but your future generations will as well.


    Alright then. Enough about the risks. Let''s get to it.


    ## Tor Step-by-Step Guide


    Now let''s answer what Tor is and what it does and what it cannot do. You''ve
    no doubt guessed by now it''s some kind of hacker''s tool, and you''d be half
    right, but only from the perspective that a powerful tool like Tor can be used
    for just about anything. In fact anything can be bought (except maybe voluptuous
    blondes in red dresses) anonymously, as long as you''re cautious in using it.
    Tor users who get cocky often get caught doing something illegal. Like insulting
    the king of Thailand or threatening the President of the USA with a pie to the
    face.


    Before you criticize Tor, try to remember that it''s not about buying drugs or
    porn or exotic white tiger cubs. It''s about anonymous communication and privacy
    - with the main function being that it grants you anonymity by routing your browsing
    session from one Tor relay to another, in essence masking your IP address such
    that websites cannot know your real location. This gives the average pc user enormous
    power to act anonymously online.


    This power allows you to:


    - Access blocked websites (Facebook if you are in China)

    - Access .onion sites that are unreachable via the open internet

    - Threaten the president with a pie-to-the-face...and no Secret Service visit!


    It does all of this by a process called onion routing.


    ### What''s onion routing, you ask?


    Think of it as a multi-point-to-point proxy matrix. Unlike peer to peer applications
    like `BitTorrent` or `eMule` which expose your IP to everyone, Tor uses a series
    of intermediary nodes (and thus, IP addresses) that encrypt your data all along
    the network chain. At the endpoint, your data is decrypted by an exit node so
    that no one can pinpoint your location or tell which file came from which computer.
    Due to this anonymizing process, you are anonymous on account of the packed "onion
    layers" that hide your true IP address. Hence the onion symbol of Tor.


    It''s even possible to build a site such that only Tor users can access it. Also
    called "Onion Sites," though technically challenging, you don''t need a Ph.D in
    computer science to build one, or even a Bachelor''s degree. You don''t need to
    know how to code at all, in fact, and these Onion sites are unaccessible by anyone
    using the regular web and regular, non-Torified Firefox.


    We''ll delve deeper into that later, as well as how to construct a fortress of
    doom that nothing, not even the NSA, can penetrate.


    ## Installation


    Installing Tor is dirt simple. You can download it `TorProject.org](https://www.torproject.org).


    If your ISP blocks you from the Tor site, do this:


    - Shoot an email to the Tor developers on their homepage. Tell them the situation.
    You can get an automated message sent back to you with the installation package
    attached. That''s the simple way.

    - The harder way is to use Google. At the main page, do a search for any cached
    websites, including Tor, that might have it cached on their servers in the event
    of all-out nuclear war.

    - Get a friend to email you the Tor installation. Ask for Tails, too. Think of
    Tor as the nuclear weapon and Tails as the uranium that makes that pretty mushroom
    cloud in the sky. You don''t need both, but it''s always better to go the Tails
    route.

    - VERIFY the signature if you obtain it elsewhere than from the main Tor site,
    but for the love of all that is sacred and holy verify it even if your friend
    hand-delivers it.


    Choose Windows, Linux or the Mac version and know that your default Firefox install
    won''t be overwritten unless you want it to. Both use Firefox, but Tor is a completely
    separate deal. You''ll notice it has the same functions as Firefox: Tabs. Bookmarks.
    Search box. Menus. It''s all here... except your favorite add-ons.


    On that point, you might be tempted to install your favorite apps. Don''t give
    in to that temptation. Multiple add-ons that do nothing for your anonymity might
    assist someone in locating you over Tor by what is known as `Browser fingerprinting`.


    After installation, you should see the green welcome screen below:


    Now you''ve got some choices. One is to volunteer your bandwidth, which makes
    it easier for other Tor users, but comes with risk.

    '
