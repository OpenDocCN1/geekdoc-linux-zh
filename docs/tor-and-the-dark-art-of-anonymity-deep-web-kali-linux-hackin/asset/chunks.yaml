  trans: '


    1. 从 [Tails 网站](https://tails.boum.org/install/) 下载 Tails 安装程序。你必须先将其安装到某个地方（如
    DVD），然后将其克隆到 USB 闪存或 SD 卡。


    2. 点击 `Applications` --> `Tails`，然后点击 ''Tails Install'' 开始安装。


    3. 选择 `Clone & Install` 以安装到 SD 卡或 USB 内存盘。


    4. 插入你的设备，然后在 `Target-Device` 下拉菜单中扫描该设备。你会收到一个警告，关于它将覆盖设备上的任何内容。这并不可担心，只需选择 yes
    并确认安装即可。


    # Tails 的局限性


    Tails 和 Tor 都不会自动加密你的文档。你必须使用 [GnuPG](https://www.gnupg.org/) 或 `LUKS` 来实现这一点，同时要记住
    Word 或 Atlantis 等某些文档可能在文档本身中包含你的注册信息。这对于匿名性可能是一个问题。例如：2013 年，亚马逊的自出版者发现，通过查看某些
    Word 文档的代码提取注册信息，有时可以暴露笔名。这些代码揭露了许多自出版作者的真实身份和地址。作为一名作者，请相信我，你并不想要那些随之而来的烦恼。


    我个人“注册”任何 App 时，都会输入虚假信息。如果你将结合 Tor 或 Tails 使用该 App，更是如此。


    如果你的目标是实现真正的匿名，还有其他值得注意的事项。如下：


    - Tails 不擦除文档元数据。

    - Tails 不会向你的 ISP 隐藏你正在使用它的事实（除非你使用 Tor 桥节点）。他们看不到你在 Tor 上在做什么，这是事实，但他们知道你在使用它。同样，除非你使用
    Tor 桥节点。

    - Tails 也无法识别人为失误。尝试不要使用同一个 Tails 会话启动两个不同的项目。请使用独立的会话。通过这种方式隔离两个身份有助于为你的会话提供强有力的匿名。


    # Chrome


    在 Firefox 上使用 Tor 并非杀死龙的唯一方法。你也有 Chrome。是的，它是 Google 的，是的，Google 已经偏离了它的“不作恶事”的格言，但就像生活中的其他任何事情一样，幸运青睐有准备的人，你会惊讶于自己可以在多大程度上保护浏览器免受入侵者的侵害。准备就是一切。你只需要拥有正确的剑。正确的盔甲。正确的撬锁工具。准备（试剂）如下：


    I. 安装 [ScriptNo](http://code.google.com/p/scriptno/) 扩展。它对于 Chrome 就像鼠标之于 PC，至少在精度方面是如此。它提供了卓越的控制，甚至允许你以
    Firefox 的 NoScript 无法实现的方式精调浏览器。如果你觉得它太难了，[ScriptSafe](https://chrome.google.com/webstore/detail/scriptsafe/oiigbmnaadbkfbmpbfijlflahbdbdgdf?hl=en)
    是另一个选择。我用过两者并且都感到非常满意，尽管像互联网上的其他任何事情一样，你的体验因人而异。


    II. [Adblock](https://chrome.google.com/webstore/detail/adblock/gighmmpiobklfepjocnamgkkbiglidom?hl=en)。这在击
    de 各种恶意软件方面简直好得离谱。它可能也是最著名的，所以互联网上到处都是反馈。


    III. [User-agent Switcher](https://chrome.google.com/webstore/detail/user-agent-switcher-for-c/djflhoibgkdhkhhcedjiklpkjnoahfmg)
    用于 Chrome。安装它。它模拟 user-agent 字符串。你可以将其设置为像 Internet Explorer，这将欺骗许多恶意负载认为你真的在使用
    Internet Explorer 而不是 Firefox 或 Chrome，从而对你发射空弹。


    V. [CanvasBlocker](https://addons.mozilla.org/en-US/firefox/addon/canvasblocker/)
    - 防止网站使用 Javascript `<canvas>` API 对用户进行指纹识别。你可以在每个网站上阻止它，也可以有选择地只阻止少数网站。这取决于你。对我来说最重要的一点是它不会破坏网站。


    # 致命的 Firefox 选项


    ## Firefox


    你可能想在 Firefox 中启用“检查伪造网站”。不要这样做，因为这会将你经常访问的站点发送到 Google 服务器。Google 的“预测性文本搜索”也很糟糕，因为它也会按键记录发送到
    Google。要更改它，你必须通过在 Firefox 地址栏中进入 `about:config` 手动进行。


    现在让我们来看看其他你可能想了解的隐私设置。


    Javascript - 这一项你应该像躲避黑疫一样避免它，因为在 Tor 网络上使用它等于从 1350 年被瘟疫污染的井水。你可能会注意到它在 Firefox
    选项卡下是默认开启的。原因是由 Tor 开发团队解释的：


    > 我们配置 NoScript 在 Tor 浏览器中默认允许 JavaScript，因为许多网站在禁用 JavaScript 后将无法运行。如果用户想要使用的网站需要
    JavaScript，大多数用户将完全放弃 Tor，因为他们不知道如何允许网站使用 JavaScript（或者不知道启用 JavaScript 可能会让网站运行）。


    这里存在权衡。一方面，我们应该默认启用 JavaScript，以便网站以用户预期的方式运行。另一方面，我们应该默认禁用 JavaScript，以更好地防止浏览器漏洞（而不只是浏览器漏洞）。


    Ghostery 和 Ghostrank - 这些并不特别致命，在 Tor 上只是没用，因为 Tor 本身已经禁用了跟踪。如果你决定使用它，请知道使用其中任何一个都可能改变你的浏览器指纹——虽未达到破坏匿名性的程度。但如果你想增强匿名性，请使用
    DuckDuckGo。


    Adblock - 我们之前提到过这一个，不幸的是，使用它可能会改变你的指纹。Adblock plus 默认启用了“接受广告”，而且多年来还有关于 Adblock
    收取 Google 广告费的[丑闻](http://www.wilderssecurity.com/threads/german-blogger-calls-adblock-plus-a-mafia-like-advertising-network.349411)。你可以对此得出结论，但在这么多用户的压力下，你可以放心对来说不再是一个数字。


    此外，Tor 浏览器的基本理念是尽可能少插件。他们认为 TorButton、NoScript 和 HTTPS Everywhere 足以保护匿名性，而不会增加插件带来的风险。沿着这一思路，[Panopticlick
    网站](https://panopticlick.eff.org/index.php) 可能对你有用。


    Whonix & Tor


    如果你担心使用 Tor 会遇到麻烦（例如你托管隐藏服务），在运行任何程序之前，你可能想查看 [Whonix](https://www.whonix.org/wiki/Main_Page)。许多每天使用
    Tor 的高级用户喜欢它提供的更强的安全性。两种工具都有自己的优缺点，并且每个优点都是为了不同的目的。你可能会发现对于你的个人情况，一个比另一个更好，而这种情况根据你的安全需求而异。


