    正如你可能知道的，追踪高价值目标的成本更高。但他们不知道你是一个高价值目标，还仅仅是一个触手可得的鱼。正如我们在那些无聊的哈佛学生案例中看到的，如果在这盲目的情况下使用
    Tor，任何人都可能陷入严重的麻烦。


    甚至埃里克·霍尔（Eric Holder）也公开指出，在被识别为公民之前，Tor 用户都是“非美国人士”。他们通过两种方法做到这一点：


    ## Quantum 和 FoxAcid 系统


    关于如何击败这些系统稍后会详细介绍，但要点如下：


    - 两个系统都依赖于电信公司的秘密安排。

    - 两个系统都让用户陷入虚假的安全感。

    - 两个系统都无法对 LiveCD (`Tails`) 进行更改（这对我们有利）。

    - 两个系统都可以通过坚持一致的安全习惯被击败。


    击败这些需要勤奋的心态，正如你可能知道的，勤奋与拖延是不兼容的。因此，你必须抵制拖延的冲动。


    我再说一遍。**不要**拖延。提前做好决定以避免风险行为。我们会逐一介绍它们。良好的安全意识需要时间、努力和投入来培养，这确实如此，但它应该从一开始就开始培养，这就是为什么风险被放在最前面，甚至在安装章节之前。这类书的内容在中间往往变得拖沓，并且经常被忘记。


    谈到风险，如果你想知道什么真正让我彻夜难眠，那是这个问题：


    其他国家会向高级 CEO 和情报机构（例如香港）透露什么？


    如果我唯一能信任的只是阁楼里那台安装了 `Ultima 7`、连接着 28.8k 拨号调制器的老旧 486 ，那么可以假设每个商业实体都受到了美国国家安全局（NSA）的威胁。如果是这样，如果
    NSA 必须费周章才能监视我们，那么利用我们在这些系统中的数据来渗透海外美国拥有的系统有多容易？


    如果没有一家公司能保住自己的隐私信息，那么最终的终局可能会演变成一个“天网”网格，类似于苏联时期的东西阵营，CEO 们必须在东方和西方之间做出选择。但这就像在决定你是想被灰熊吃还是被狮子吃一样。


    这有点操之过急，但至少你现在知道了真正的风险。至少是主要的风险。


    通过书中的知识，这些每一种风险都可以被降至最低或彻底击败。遗憾的是，大多数读者会忘记他们所读内容的约 80%。那些采取行动的人会记住那 80%，因为他们正在将所学变为现实：当
    NSA 威胁你的皇后时，采取精妙的类棋步般的反击。如果你不采取行动，而只是坐在那里永远地等待出击，你就放弃了游戏。他们赢了。所以，不要像在慢慢煮沸的水锅里的青蛙，因为你不仅自己会丧命，你的后代也会如此。


    好了。关于风险的话题就够了。让我们开始吧。


    ## Tor 逐步指南


    现在让我们来回答 Tor 是什么，它能做什么，以及它不能做什么。你现在已经猜到它是某种黑客工具了，你对了一半，但仅仅从像 Tor 这样强大的工具可以用于几乎任何事情的角度来看。事实上，只要在使用时足够谨慎，任何东西（可能除了穿红裙的丰满金发女性以外）都是匿名购买的。自得大的
    Tor 用户经常在做违法活动时被捕，比如侮辱泰国国王或用派脸威胁美国总统。


    在批评 Tor 之前，请试着记住，它不是为了买毒品、色情或稀有的白虎幼。它关乎匿名通信和隐私——其主要功能是通过将浏览会话从一个 Tor 中继器路由到另一个来授予你匿名，本质上是掩盖你的
    IP 地址，使网站无法知道你的真实位置。这赋予了普通电脑用户在线匿名行动的巨大力量。


    这种力量允许你：


    - 访问被封的网站（如果你在中国，则是 Facebook）

    - 访问无法通过互联网访问的 .onion 站点

    - 用派脸威胁总统……而且不会被特勤局上门！


    这一切都是通过一种被称为“洋葱路由”（onion routing）的过程实现的。


    ### 你问什么是洋葱路由？


    把它想象成一个多点对点的代理矩阵。与 `BitTorrent` 或 `eMule` 这种会将你的 IP 暴露给所有人的点点应用不同，Tor 使用一系列中间节点（以及
    IP 地址）在整个网络链上加密你的数据。在端点，你的数据由出口节点（exit node）解密，因此没有人可以精确定你的位置，或者告诉哪个文件来自哪台计算机。由于这种匿名化过程，由于隐藏了你真实
    IP 地址的层层“洋葱皮”，你是匿名的。这就是 Tor 使用洋葱符号的原因。


    甚至可以建立一个只有 Tor 用户才能访问的站点。这被称为“洋葱站点”（Onion Sites），虽然在技术上有挑战性，但你不需要计算机科学博士，甚至不需要学士学位。事实上，你完全不需要编写代码，而且这些洋葱站点使用普通网页和普通非
    Tor 版 Firefox 的人是无法的。


    我们稍后会深入探讨，以及如何构建一个任何东西（甚至是 NSA）都无法渗透的死亡堡垒。


    ## 安装


    安装 Tor 非常简单。你可以从 `[TorProject.org](https://www.torproject.org)` 下载。


    如果你的 ISP 阻止你访问 Tor 网站，请这样做：


    - 向他们主页上的 Tor 开发者发封邮件。告诉他们情况。你可以收到一封附带安装包的自动回复。这是简单的方法。

    - 困难的方法是使用 Google。在主页上搜索任何缓存的网站，包括 Tor，以防在发生全面核战时他们可能在服务器上缓存了它。

    - 让朋友给你发 Tor 安装包。也问他们 Tails。把 Tor 想象成核武器，把 Tails 想象成在空中制造那朵漂亮蘑菇云的铀。你不需要两者都有，但走
    Tails 路线总是更好的。

    - 如果你从主 Tor 网站以外的地方获取，请**验证**签名，但为了所有神圣的事物，即使是你的朋友亲手递给你的，也要验证它。


    选择 Windows、Linux 或 Mac 版本，并知晓除非你想，否则你默认的 Firefox 安装不会被覆盖。两者都使用 Firefox，但 Tor 是一个完全独立的程序。你会发现它和
    Firefox 具有相同的功能：标签。书签。搜索框。菜单。所有都在这里……除了你最喜欢的插件。


    关于这一点，你可能会倾向于安装你最喜欢的应用程序。不要屈服这种诱惑。多个对你的匿名性没有帮助的插件可能会通过所谓的“浏览器指纹”（`Browser fingerprinting`）协助某人在
    Tor 网络上定位你。

