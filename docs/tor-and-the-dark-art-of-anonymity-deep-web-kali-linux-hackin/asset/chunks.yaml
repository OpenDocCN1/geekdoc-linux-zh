    # 序言


    你想要你想要的。


    隐形。匿名。幽灵协议。


    你已经下了红色药丸并看清了真相，你并不喜欢它。我不怪你，我也不喜欢。但我原本认为对 `Tor` 和其他隐身工具的了解，与真实世界的真相相比，仅仅是杯水车薪。那些是你在许多技术论坛上找不到的东西。当然，它们在私下里被谈论，但对你来说这一切都是隐形的。直到现在。


    这让我们谈到了你和我，或者说我能为你做什么。当一个人卷起袖子、亲自动实践时，十年间学到的东西是惊人的。私人黑客论坛。`Usenet`。`Freenet`。我多年来搜遍了这一切，我学到的东西在亚马逊的任何地方都找不到。


    同样惊的是，你只需花几美元花一个周末阅读就能学到这些。这就是我，很快也将成为你。周一你所处的地方就是我现在所在地，只不过没有了当年的错误。那些是我在使用 `Freenet`、`Tails`、`PGP`
    时犯下的错误。你能想到的，我都做过。天哪，我犯了**巨大的错误**。但这些是你将避免的错误，因为在读完本指南后，你将比那里 85% 的 `Tor` 用户懂得多，对匿名性的了解也超过大多数联邦探员。即使是
    `NSA` 那些每天只做最少工作、所谓的超级黑客，他们的工作也大多涉及剥夺你的隐私权。


    对于这一点，如果你不满意，可以回来找。


    # 2022 年的 Tor 还安全吗？


    这确实是一个关键的问题。至于真正的答案是什么，这取决于你问谁，因为那里总有披着羊皮的狼，他们正从你的无知中获益。许多人说不。少数人说是。媒体尽管在政治和社会事务方面精通，但在讨论像
    `Tor` 这样复杂的话题时，表现得非常地无力。


    '
- fmt: '

    Case in point: [Gizmodo](http://gizmodo.com/hackers-who-shut-down-psn-and-xbox-live-now-attacking-t-1675331908)
    reported that a group of hackers managed to compromise enough Tor relays to decloak
    Tor users. If you''re just hearing this for the first time, part of what makes
    Tor anonymous is that it relays your data from one node to another. It was believed
    that if they compromised enough of them, then they could track individual users
    on the Tor network and reveal their real life identities. Kind of like how the
    agents in The Matrix find those who''ve been unplugged.


    Anyway as luck would have it, it turned out to be kiddie script-hackers with too
    much time on their hands who simply wanted a new target to hack. Who knows why.
    Could be that they''d toyed with the Playstation Network long enough and simply
    wanted a curious peak here and there. These were not [superhacker-level](http://www.slashgear.com/nsa-has-super-secret-hacker-collective-according-to-newly-revealed-snowden-docs-29295407/)
    NSA members, either.


    But as is usually the case with the media, this attack attracted the attention
    of a few bloggers and tech journalists unsympathetic to Tor and frankly, ignorant
    of what really constitutes a threat. The Tor devs commented on it, too:


    "This looks like a regular attempt at a Sybil attack: the attackers have signed
    up many new relays in hopes of becoming a large fraction of the network. But even
    though they are running thousands of new relays, their relays currently make up
    less than 1% of the Tor network by capacity. We are working now to remove these
    relays from the network before they become a threat, and we don''t expect any
    anonymity or performance effects based on what we''ve seen so far."


    What those conspiracy bloggers failed to report was that any decentralized network
    like Tor is a prime target for attacks such as the above. But to truly stand a
    chance at punching a hole through this matrix, hackers would need Tor to implicitly
    trust every new node that comes online. That just doesn''t happen.


    It also takes time for fresh relays to gather traffic - some as long as sixty
    days or more and the likelihood of being reported is rather high since the IP
    addresses are out in the open, which only speeds up malicious reporting. The real
    danger, and has been since inception, is scaring Tor users to less secure methods
    of communication. That''s what the NSA wants. The CIA already does this in foreign
    countries. Now the NSA is following their lead.


    ## The REAL Risk of Using Tor


    I list them here before we dive deep into enemy territory so you''ll know what
    to avoid before installation, and maybe get an "a-ha!" moment in subsequent chapters.
    As you read, remember that having `Javascript` on is really only a drop in the
    ocean next to what is possible for an enemy to kill your anonymity.


    ### Javascript


    It''s widely known that leaving `Javascript` on is bad for a Tor user. Ninety-five
    percent of us know this, but the mistakes of the 5% get blown out of proportion
    and thrown into the face of the rest of us. Worse, many websites now run so many
    scripts that it seems as though they hate Tor users.


    One site required over a dozen. Without it, the page was/is/will be pretty much
    gimped. Sometimes it''s not even readable. You can imagine what might happen if
    you were using Tor and decided to visit that site if it were created to lure users
    into a honeypot. I recall one researcher claimed that "81% of Tor users can be
    de-anonymised."


    Bull.


    That 81% figure came about because the targeted users knew little about the `NoScript`
    browser add-on, and likely mixed Tor usage with their daily open net usage, providing
    ample data for a correlation attack. But that was just the icing on the cake.
    They left personal details *everywhere*; using the same usernames and passes they
    do elsewhere on the open net. Bragging about their favorite Netflix movies. Talking
    about local events (Jazzfest in New Orleans!). The weather (Hurricane in the French
    Quarter!). You get the idea. Much more on this later.


    ### Volunteering as an Exit Node


    Another doozy, though not quite the granddaddy of all risks. It''s still risky.
    On the plus side, you as a valiant believer in anonymity graciously provide bandwidth
    and an "exit pipe" to the rest of the Tor users (hopefully none of whom you know)
    so that they may pass their encrypted traffic through your node. Generous? Certainly.
    Wise? If you live in the States... hale no, as my Uncle Frick in Texas used to
    say.


    It isn''t that it is illegal per se to do so. On the contrary, but what passes
    through your Tor node can land you in hot water if you live in a police state
    like my native Louisiana. All exiting traffic from your node (i.e. other people''s
    traffic) is tied to your `IP address`, and as others have found, you put yourself
    at risk by what others on the other side of the planet do with your node.


    Lots of new Tor users fire up `BitTorrent` that''s been configured for Tor and
    suck down all the bandwidth. It makes for a very miserable Tor experience for
    other users. You may get served with a copyright violation notice (or sued), or
    perhaps even raided at 6 AM by a black party van if child porn ends up flowing
    out of your pipes. Think carefully and do your research before taking on such
    a risky charge, lest your computer be seized and your reputation ruined. Innocent
    men have gone to jail for their overconfidence.


    ### Running an Exit Relay From Home


    Running it from home is even worse then using cloud storage, and is infinitely
    more dangerous in the USA. If the law for whatever reason has an interest in your
    traffic, your PC may just be seized, but that''s only the start. In the UK, there
    are no `5th amendment` protections against self-incrimination. A crusty old judge
    can give you two years just for forking over the encryption keys.


    We''ll get into the nitty details later, but these are the Rules I''ve set for
    myself on occasion:


    - Refrain from routing normal traffic through it

    - Never do anything illegal (more on this later as it''s a grey area)

    - Never put sensitive files on it (for ex., financial data, love notes, court
    documents)

    - Be as transparent as possible that I''m running


    ## Intelligence Agencies


    They''ve declared war on Tor and its stealth capability. No doubt about it. And
    though they''ll fight tooth and nail to convince you it''s for your own good,
    really what it all comes down to isn''t so much national security as it is national
    control: Control over you in that they can''t see what you''re doing on Tor. Nor
    do they know why. They don''t like that.


    It''s pomposity on a galactic scale unheard of when you look at how much data
    they''re siphoning from everyone''s pipes. Every time some new revelation leaks
    out of Edward Snowden''s mouth regarding the `NSA`, I think of...


    The time for playing nice guy to the NSA is over. They spend so much money and
    waste so much time chasing you simply because they don''t like you or your actions
    not being easily identifiable.

    '
