  raw: '- Do your research. Check forums and especially the dates of reviews they
    have. Do you notice patterns? Are good reviews scattered over a long period of
    time or is it rather all of a sudden--the way some Amazon affiliate marketers
    do with paid reviews that glow? Not many reviews from said customers?


    If you''ve seen the movie "Heat," with Al Pacino and Robert de Niro, you know
    when it is time to Walk Away. In the middle of a nighttime heist, Niro goes outside
    for a smoke. He hears a distant cough. Now, this is middle of the night in an
    unpopulated part of the city that comes from across the street - a parking lot
    full of what he thought was empty trailers. Hmm, he thinks. Not so empty (it was
    a cop). He walks back into the bank and aborts.


    The other aspect is time. Some fake sites will set a short ship time and count
    on you not bothering to see the sale as finalized before you can whistle Dixie
    out of your ass. After finalization, you''re screwed since the money is in their
    wallet before you can even mount a protest.


    Fraud Prevention


    One is Google, believe it or not, at [http://www.google.com/imghp](http://www.google.com/imghp).
    Dating sites like Cherry Blossoms and Cupid sometimes use reverse image search
    to catch fakers and Nigerian scammers masquerading as poor lonely singles to deprive
    men of their coinage. If they can catch them, so can you. If the image belongs
    to some other legit site, chances are it is fake. [Foto Forensics](http://fotoforensics.com)
    also does the same, and reports metadata so that it becomes even harder to get
    away with Photoshop trickery.


    When it is Okay to FE (Finalize Early)


    FE means ''Finalize Early''. It''s use online can usually be found in black marketplaces
    like Silk Road and Sheep''s Marketplace. It simply means that money in escrow
    is released before you receive your product. Every customer I''ve ever spoken
    with advises against this unless you''ve had great experience with that business.


    Buuut... Quite a few vendors are now making it a standard practice to pay funds
    up front before you have anything in your hands.


    On more than one Marketplace forum, there''s been heated exchange as to when this
    is proper. You might hear, "Is this guy legit? What about this Chinese outfit
    over here? He seems shady," and others: "A friend said this guy is okay but then
    I got ripped off!". You get the idea.


    Here is my experience on the matter.


    1.) It is okay when you are content with not getting what you paid for. This may
    seem counterproductive, but think how many gamblers go into a Las Vegas casino
    and never ask themselves "How much can I afford to lose?"


    The answer, sadly, is not many. Vegas was not built on the backs of losers. Some
    merchants do not like escrow at all. Some do. So don''t spend more than you can
    afford to lose. Look at it the way a gambler looks at making money.


    2.) It is okay when you are guaranteed shipment. There are FE scammers out there
    that will give you an angelic smile and lie right into your eyes as they swindle
    you. Do not depend solely on reviews. A guy on SR can be the best merchant this
    side of Tatooine and yet you will wake up one day and find yourself robbed. He''s
    split with a million in BTC and you''re left not even holding a bag. Most won''t
    do this to you. But a few will.


    When it is NOT Okay to FE


    - When losing your funds will result in you being evicted or a relationship severed.
    Never borrow money from friends and especially not family unless you want said
    family to come after you with a double-bladed ax. If you get ripped off, you lose
    not only the cash but the respect and trustworthiness of your family. Word spreads.
    You don''t pay your debts.


    Darknet OPSEC


    "Three can keep a secret if two of them are dead..."


    - Ben Franklin


    The above quote was a favorite of mine in elementary school. It was applicable
    then just as it is now to having a secure mindset, and boy how I loved spouting
    that line whenever a friend begged me to confirm a rumor he''d heard. A rumor
    that, if validated, could have landed me in hot water with my red-headed chem
    teacher. Luckily I knew when to keep my mouth shut.


    As you should.


    Keeping your mouth shut about Darknet markets is more important than any encryption
    scheme you use, passphrase you know, Freenet group key or anything related to
    your Bitcoin wallet. Knowledge is power.


    No, strike that. Knowledge is potential power. And power in slippery hands can
    be disastrous. Playing the bar braggart might be fun after a few beers and win
    you a few points with other guys, but it gets more people imprisoned over frivolous
    reasons than anything else I can think of. And I''ve seen more than one friend
    go down in flames because they mentioned a darknet market to someone they thought
    they could trust. But then that friend told someone else he trusted, more than
    anyone in the world. We''''ll call my friend Grady.


    Grady told his girlfriend. Spared no details of his darknet ops and how they traversed
    several continents. He made himself sound like Agent Smith from the Matrix. I
    shook my head upon hearing this...


    Cue Fred Sanford: "You Big Dummy!"


    Trusting her to keep his secret was not just dumb, it was galactically stupid.
    Like expecting Eve to eat the forbidden fruit all by herself. And we know how
    that story ends. Misery truly loves company.


    Next thing he knew, he attracted the attention of the authorities in Hong Kong,
    one of which was her father. The secret was safe enough he supposed, until he
    refused to marry his hyper-critical girlfriend, claiming he had taken the "Red
    Pill" and feared settling down with an ultra-hardline feminist harpy (his words)
    would kill his dreams. Well it killed something alright. His freedom.


    Lesson? You can''t fix stupid, so why would you trust it?


    While you needn''t go totally dark about your darknet knowledge for all eternity,
    in real life conversations, Social Media outlets, Tinder, Skype, etc., mums the
    word. Invoke radio silence where applicable or better yet, feign ignorance. If
    they show you proof, simply say you have good connections. Then buy them a beer
    and leave. If they still persist, consider warning them you''re about to sever
    all connections to them. Friends come and go, but freedom is priceless.


    Running a Hidden Tor Server


    Having used Tor for many years, it came as a pleasant surprise to learn how few
    incidents there were in which the NSA managed to disrupt Tor. S that brought large
    sections of the network to a grinding halt. As it turns out, they''re bark is
    much worse than their bite.


    The thing is, most Tor users couldn''t be bothered. But then most users aren''t
    interested in running a hidden server just as most P2P users don''t bother seeding.
    Most are hit n'' run downloaders. They know that as U.S. citizens they stand a
    good chance of getting sued if they leave their balls out there long enough. So
    some users opt to not further their own security knowledge. Let the Tor devs do
    it, they say. Can''t be bothered.


    Except most of the Tor advice by Tor developers I''ve read come up woefully inadequate.
    In fact I find that they aren''t paranoid nearly enough. It''s always been my
    belief that you can never be sufficiently paranoid as far as protecting your freedom
    is concerned, since the powers that be want to capture it and bottle it the way
    a cancer captures control of a cell: One organelle at a time with little of it''s
    environment aware of the slow-boiling attack. To be honest... I suspect they depend
    on apathy and ignorance. And a lot of users gladly oblige.


    Mr. Frog, meet boiling pot of water...


    So then, what can we do? Well for starters, we can get the right security mindset.


    Tor and Your PC'
