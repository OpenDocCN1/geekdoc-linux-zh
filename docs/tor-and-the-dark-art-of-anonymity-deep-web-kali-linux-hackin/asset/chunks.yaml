  trans: '

    它们是监控软件，会追踪并记录你进行的每一次点击、访问的每一个网站、输入的每一个按键。聊天记录、Skype、电子邮件。只要你打得出来，它就能记录，而且就在你的眼皮底下。它甚至可以将你输入的内容通过电子邮件发送给世界上另一端的接收者。信用卡号、密码和
    Paypal 登录详情只是它能获取的目标的一小部分。


    ## 人是如何被感染的？


    - 打开邮件附件

    - 从 P2P 网络中来自不可信用户运行的 `.exe` 文件

    - 使用过时的浏览器访问受感染的网站

    - 如果美国国家安全局（NSA）打通了关系


    有些雇主利用它们来追踪员工的生产力。有些妻子通过 `USB`（硬件版本）安装一个，看看丈夫半夜上床后在和谁聊天。父母会在孩子的电脑上使用这些软件。所以，它们并不总是
    100% 都是恶意的。


    但它们的检测变得异常困难。它们拥有一种几乎近乎吸血鬼般的存在，但像吸血鬼一样，存在一些你可以在不用拔出木桩的情况下察觉的细微迹象。


    ## 迹象


    - 浏览速度缓慢

    - 鼠标卡顿/在文本文档中按键停顿

    - 显示的字母与你输入的的不符

    - 在加载重文本/图形时，多个网页出现错误


    它们分为两种：


    ### 软件键盘记录器


    这种类型隐藏在你的操作系统内部。它们潜伏在 `Windows` 中。`Linux` 则没那么多。键盘记录器记录按键并在电脑在线时按设定时间将它们发送给黑客或其他作恶者。由于了伪装，大多数用户永远不会看到它在施展黑暗魔法。许多流行的防毒病毒厂商在识别它方面存在困难，因为其定义更新非常频繁。


    ### 硬件键盘记录器


    Bond 可能使用过其中一种。由于是硬件，它是一个可以插入到 `PC` 上任何 `USB` 接口的物理扩展装置，怀疑的配偶或想要接触父亲色情收藏的儿童可以在网上购买。按键记录被记录在
    `ram` 内存中。无需安装。


    因此，除非你是那种每天都会检查 `PC` 内部构造的人，否则你可能在为时已晚才发现它。它们还可能直接内置在键盘中。FBI 喜欢将目标的设备更换为定制制造的仿制监控设备。诚然，这主要针对黑手党等高价值目标，但任何人都可以获得。


    ## 键盘记录器防护


    - 检查你的键盘是否有可疑附件。如果你是 `X` 公司的员工，某天早上你的桌子上来了一个新键盘，除非你 200% 信任你的老板，否则请保持谨慎。

    - 使用`Virtual Keyboard`。没有按键 = 没有记录！

    - 使用 [Guarded ID](http://www.guardedid.com/) 防止黑客捕获你的按键。它通过扰乱你输入的一切来工作，使任何信息对黑客来说都是徒用的。

    - 使用良好的防火墙阻止键盘记录器传输你的数据。一年前，我的 `Comodo` 防火墙在我没有进行在线活动时，提醒我有一个凭空出现的可疑网络活动。结果发现我感染了
    `Win64/Alureon` 木马程序。我不得不使用 `Malwarebytes` 来检测并删除它。`Norton` 毫无用处！想象一下。


    ## 其他反键盘记录器工具


    如果你不介意花点钱，还有几种：


    ### Zemana AntiLogger


    ![](img/image_rsrcYR.jpg)


    这个“免费”版本是一个极其基础的键盘记录器检测器。事实上，它非常精简，但如果你只需要获得警报，那么这个可能适合你。`Keylog Guard` 为在键盘上输入的所有内容提供加密。任何窥探者只会得到乱码的字母。付费版本价格稍贵，为
    29.99 美元，并带有针对恶意软件等的额外保护，但有些过度了。


    此外，如果你尝试运行它不喜欢的安全程序，它会骚扰你，就像其他所有防病毒软件一样。


    ### SpyShelter STOP-LOGGER


    ![](img/image_rsrcYS.jpg)


    免费版提供的比 Zemana 多，包含了屏幕截图功能。它还会提醒你任何试图窃取你按键的代码，但免费版不兼容 64 位。价格是 24.99 美元。


    但请注意，删除键盘记录器是一件棘手的事，因为它们有重新安装的习惯。键盘记录器通常作为服务隐藏在 `svchost.exe` 中，因此如果没有专用程序，任务管理器并没有什么帮助。最佳防护方法是在它们插入之前将其拦截。


    采取主动。预判密码泄露。记住，保持警惕！


    ## 暗网市场


    你们中有些人可能在想，考虑到所讨论的漏洞，暗网到底有多安全。短答案是：取决于你如何保护它。


    你是薄弱环节。安全链的最后一环。尽管你需要 `Tor` 才能访问 `Onion` 站点，但该术语适用于任何匿名网络——如 `I2P`、`Freenet` 或任何其他隐藏数据传输源（并以此隐藏你的身份）的网络。


    这就引入了暗网市场。


    深网中此类市场的列表非常多，被骗的风险很高。这是你可能没听说过它们的原因之一。它们经常因为声誉恶劣或执法部门的打击而迅速关闭。有时它们会得罪错误的人，然后垃圾邮件发送者会对网站进行
    `ddos` 攻击。但如果你对那里卖什么感兴趣，有很多地方可以去。

    '
- fmt: '

    - Do your research. Check forums and especially the dates of reviews they have.
    Do you notice patterns? Are good reviews scattered over a long period of time
    or is it rather all of a sudden--the way some Amazon affiliate marketers do with
    paid reviews that glow? Not many reviews from said customers?


    If you''ve seen the movie "Heat," with `Al Pacino` and `Robert de Niro`, you know
    when it is time to `Walk Away`. In the middle of a nighttime heist, `Niro` goes
    outside for a smoke. He hears a distant cough. Now, this is middle of the night
    in an unpopulated part of the city that comes from across the street - a parking
    lot full of what he thought was empty trailers. Hmm, he thinks. Not so empty (it
    was a cop). He walks back into the bank and aborts.


    The other aspect is time. Some fake sites will set a short ship time and count
    on you not bothering to see the sale as finalized before you can whistle Dixie
    out of your ass. After finalization, you''re screwed since the money is in their
    wallet before you can even mount a protest.


    ### Fraud Prevention


    One is `Google`, believe it or not, at [`http://www.google.com/imghp`](http://www.google.com/imghp).
    Dating sites like `Cherry Blossoms` and `Cupid` sometimes use reverse image search
    to catch fakers and Nigerian scammers masquerading as poor lonely singles to deprive
    men of their coinage. If they can catch them, so can you. If the image belongs
    to some other legit site, chances are it is fake. [`Foto Forensics`](http://fotoforensics.com)
    also does the same, and reports metadata so that it becomes even harder to get
    away with Photoshop trickery.


    ### When it is Okay to FE (Finalize Early)


    `FE` means ''Finalize Early''. It''s use online can usually be found in black
    marketplaces like `Silk Road` and `Sheep''s Marketplace`. It simply means that
    money in escrow is released before you receive your product. Every customer I''ve
    ever spoken with advises against this unless you''ve had great experience with
    that business.


    Buuut... Quite a few vendors are now making it a standard practice to pay funds
    up front before you have anything in your hands.


    On more than one Marketplace forum, there''s been heated exchange as to when this
    is proper. You might hear, "Is this guy legit? What about this Chinese outfit
    over here? He seems shady," and others: "A friend said this guy is okay but then
    I got ripped off!". You get the idea.


    Here is my experience on the matter.


    1.) It is okay when you are content with not getting what you paid for. This may
    seem counterproductive, but think how many gamblers go into a `Las Vegas casino`
    and never ask themselves "How much can I afford to lose?"


    The answer, sadly, is not many. `Vegas` was not built on the backs of losers.
    Some merchants do not like escrow at all. Some do. So don''t spend more than you
    can afford to lose. Look at it the way a gambler looks at making money.


    2. It is okay when you are guaranteed shipment. There are `FE` scammers out there
    that will give you an angelic smile and lie right into your eyes as they swindle
    you. Do not depend solely on reviews. A guy on `SR` can be the best merchant this
    side of `Tatooine` and yet you will wake up one day and find yourself robbed.
    He''s split with a million in `BTC` and you''re left not even holding a bag. Most
    won''t do this to you. But a few will.


    ### When it is NOT Okay to FE


    - When losing your funds will result in you being evicted or a relationship severed.
    Never borrow money from friends and especially not family unless you want said
    family to come after you with a double-bladed ax. If you get ripped off, you lose
    not only the cash but the respect and trustworthiness of your family. Word spreads.
    You don''t pay your debts.


    ### Darknet OPSEC


    "Three can keep a secret if two of them are dead..."

    - `Ben Franklin`


    The above quote was a favorite of mine in elementary school. It was applicable
    then just as it is now to having a secure mindset, and boy how I loved spouting
    that line whenever a friend begged me to confirm a rumor he''d heard. A rumor
    that, if validated, could have landed me in hot water with my red-headed chem
    teacher. Luckily I knew when to keep my mouth shut.


    As you should.


    Keeping your mouth shut about Darknet markets is more important than any encryption
    scheme you use, `passphrase` you know, `Freenet` group key or anything related
    to your `Bitcoin wallet`. Knowledge is power.


    No, strike that. Knowledge is potential power. And power in slippery hands can
    be disastrous. Playing the bar braggart might be fun after a few beers and win
    you a few points with other guys, but it gets more people imprisoned over frivolous
    reasons than anything else I can think of. And I''ve seen more than one friend
    go down in flames because they mentioned a darknet market to someone they thought
    they could trust. But then that friend told someone else he trusted, more than
    anyone in the world. We''''ll call my friend `Grady`.


    `Grady` told his girlfriend. Spared no details of his darknet ops and how they
    traversed several continents. He made himself sound like `Agent Smith` from the
    `Matrix`. I shook my head upon hearing this...


    Cue `Fred Sanford`: "You Big Dummy!"


    Trusting her to keep his secret was not just dumb, it was galactically stupid.
    Like expecting `Eve` to eat the forbidden fruit all by herself. And we know how
    that story ends. Misery truly loves company.


    Next thing he knew, he attracted the attention of the authorities in `Hong Kong`,
    one of which was her father. The secret was safe enough he supposed, until he
    refused to marry his hyper-critical girlfriend, claiming he had taken the "Red
    Pill" and feared settling down with an ultra-hardline harpy (his words) would
    kill his dreams. Well it killed something alright. His freedom.


    ### Tor and Security

    Running a Hidden Tor Server


    Having used `Tor` for many years, it came as a pleasant surprise to learn how
    few incidents there were in which the `NSA` managed to disrupt `Tor`. S that brought
    large sections of the network to a grinding halt. As it turns out, they''re bark
    is much worse than their bite.


    The thing is, most `Tor` users couldn''t be bothered. But then most users aren''t
    interested in running a hidden server just as most `P2P` users don''t bother seeding.
    Most are hit n'' run downloaders. They know that as `U.S.` citizens they stand
    a good chance of getting sued if they leave their balls out there long enough.
    So some users opt to not further their own security knowledge. Let the `Tor` devs
    do it, they say. Can''t be bothered.


    Except most of the `Tor` advice by `Tor` developers I''ve read come up woefully
    inadequate. In fact I find that they aren''t paranoid nearly enough. It''s always
    been my belief that you can never be sufficiently paranoid as far as protecting
