    I see a similar trend evolving in Canada regarding VPN usage. New laws now require
    VPNs to identify customers who download copyrighted works like movies and games
    so that infringement notices (i.e. scare letters) get to the right person. That
    sounds rather just on the surface of it, because who wouldn''t deny George Lucas''s
    ability to make more Star Wars prequels? Art, you know.


    But therein is the problem. Mainly it''s that politicians forget how the internet
    actually works.


    Doing what they dictate means VPN providers must retain access logs for 6 months,
    minimum. This alone pretty much guarantees a VPN''s ability to sell anonymity
    services (privacy, actually) will dissolve, thus leading to massive losses as
    customers aren''t stupid. They know when their privacy is being targeted. Let
    the exodus begin! (Government cookie parties)


    They also know that VPNs assign shared IP addresses for customers. One might be
    yourself, there in your jammies sipping Rickard''s Red while downloading the latest
    NiN video YouTube seemingly blocked, while the other user is Uncle Frick downloading
    something from the Usenet group guys-who-like-bouncing-pigtailed-girls-on-a-knee.


    The only solution is to move out of Canada altogether.


    But then, perhaps that is what the government wanted all along.


    The saddest part isn''t that none of this won''t stop terrorism or copyright infringement,
    or that it will hurt most private encryption vendor''s businesses or that only
    politicians will have encryption while the citizens have none. No, the saddest
    part is that we will have become the frog-in-the-pot who turns the oven on ourselves
    to maximum temperature and then slip back into the pot, and all because someone
    more powerful than you or I said it was the right thing to do.


    Our world will become Bizarro World. Where right is wrong and light is dark and
    no one has security except for the agents of the new Matrix they will build. Where
    to be more secure is to be less secure as us peons go... because if the government
    says so, well, that must be the gospel truth because when''s the last time a politician
    lied?


    If you learn nothing else, remember two things: Backdoors are security holes in
    100% of cases. The second one is like it: Anonymity and Privacy and the freedom
    that comes of it will only die if we let it.


    Closing Thoughts


    As you can see, the powers that be are actively targeting your ability to make
    choices about your own freedom. They work in baby steps. They think you''re stupid.
    They think they can run your life better than you can. Only they can''t. Did the
    NSA stop the attack on Charlie Hebdo, the French cartoonist? Did they stop 9/11?
    The bombings in Spain? A death from a thousand cuts, a little at a time, and before
    you know it you''re feeling very light-headed but aren''t quite sure why.


    Believe me, putting off your security and peace of mind will be enough to fuel
    that tsunami of cancer they''re building up one cell at a time. If you''ve read
    this book then you''ve already taken all the baby steps you need. You''ve dipped
    your big toe into that whirlpool and it''s high time you jumped in. Don''t procrastinate.
    You know how warm the water is. Wait too long and the water might get too cold.
    Worse still is that someone might just lock you out altogether.'
