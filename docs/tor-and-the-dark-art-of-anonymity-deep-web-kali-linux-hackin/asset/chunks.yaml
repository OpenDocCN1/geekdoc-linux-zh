    例如：[Gizmodo](http://gizmodo.com/hackers-who-shut-down-psn-and-xbox-live-now-attacking-t-1675331908)
    报道，一群黑客成功攻破了足够的 Tor 中继节点，从而让 Tor 用户去匿名。如果你是第一次听到这个，Tor 匿名性的部分原理在于它将你的数据从一个节点转发到另一个节点。人们认为，如果他们攻破了足够的节点，就可以追踪
    Tor 网络上的单个用户并暴露他们的真实身份。这有点像《矩阵》电影中的特工寻找那些被拔掉插的人一样。


    无论如何，巧的是，事实证明这只是一些闲得发慌的脚本小子黑客，他们只是想找一个新的目标进行攻击。谁知道为什么呢。也许他们玩 Playstation Network
    玩了足够久，只是想在这里出于好奇地窥探一下。这些人也不是什么[超级黑客级别的 NSA 成员](http://www.slashgear.com/nsa-has-super-secret-hacker-collective-according-to-newly-revealed-snowden-docs-29295407/)。


    但正如媒体常有的做法，这次攻击引起了几个对 Tor 不好感的博主和技术记者的关注，他们坦率说，对什么真正构成威胁一无所知。Tor 的开发者也对此发表了评论：


    “这看起来像是一次普通的女巫攻击尝试（Sybil attack）：攻击者注册了许多新中继，希望成为网络中很大比例。但尽管他们运行了数千个新中继，但目前他们中继占
    Tor 网络容量的比例不到 1%。我们正努力在这些中继变成威胁之前从网络中移除它们，根据我们目前看到的，预计不会会对匿名性或性能产生任何影响。”


    那些阴谋论博主未能报道的是，任何像 Tor 这样的去中心化网络都是此类攻击的首要目标。但要真正有机会击穿这个“矩阵”，黑客需要 Tor 隐式信任每一个新上线的节点。这根本不会发生。


    新中继收集流量也需要时间——有些长达六十天更久，而且由于 IP 地址是公开的，被举报的概率相当高，这只会加速恶意举报。真正的危险（且自诞生以来一直如此）是恐吓
    Tor 用户转向不安全的通信方式。这正是 NSA 想要的。CIA 已经在国外这么做了。现在 NSA 正在效法他们。


    ## 使用 Tor 的**真实**风险


    在我们深入敌方领地之前，我在这里列出这些风险，以便你在安装前知道要避免什么，并可能在随后的章节中产生“啊！原来如此”的时刻。在阅读时，请记住，与敌人杀死你匿名性的各种手段相比，开启
    `Javascript` 真的只是冰山一角。


    ### Javascript


    众所周知，开启 `Javascript` 对 Tor 用户是有害的。我们 95% 的人知道这一点，但那 5% 人的错误却被放大，并甩在剩下的我们脸上。更糟糕的是，许多网站现在运行了这么多脚本，看起来好像它们讨厌
    Tor 用户。


    一个网站就要求十多个脚本。没有它，页面过去是/现在/将是几乎处于瘫痪状态。有时它甚至无法阅读。你可以想象，如果你正在使用 Tor 并决定访问那个网站，而该网站是为了诱骗用户进入蜜罐陷阱而创建的，会发生什么。我记得有一个研究人员声称“81%
    的 Tor 用户可以被去匿名”。


    胡说八道。


    那 81% 的数字出现是因为目标用户对 `NoScript` 浏览器插件一知甚少，并且可能将 Tor 的使用与日常开放网络的使用混杂，为相关性攻击提供了充足的数据。但这只是锦上添花。他们*无处不在*地留下了个人细节；使用与他们在开放网络其他地方相同的用户名和密码。炫耀他们最喜欢的
    Netflix 电影。谈论当地活动（新奥尔良的爵士音乐节！）。谈论天气（法国区的飓风！）。你明白我的意思。稍后会有更多详细介绍。


    ### 志愿者出口节点（Exit Node）


    另一个大麻烦，虽然还不算所有风险之首。它仍然很有风险。好的一面是，你作为匿名性的勇敢信徒，慷慨地为其他 Tor 用户提供带宽和“出口管道”（希望他们中没有你认识的），以便他们通过你的节点传输加密流量。慷慨吗？确实如此。明智吗？如果你住在美国……不健康，正如我住在德克萨斯州的
    Frick 叔叔常说的那样。


    这并不是说这样做本身是非法的。相反，但如果你住在像我故乡路易斯安州这样的警察国家，通过你 Tor 节点的内容可能会让你陷入麻烦。从你的节点流出的所有流量（即他人的流量）都与你的
    `IP address` 绑定，正如其他人发现的，你由于地球另一端的人用你的节点所做而让自己处于危险。


    许多新 Tor 用户启动配置了 Tor 的 `BitTorrent` 并吸干所有带宽。这让其他用户的 Tor 体验变得非常糟糕。你可能会收到版权侵权通知（或被起诉），或者如果儿童色情从你的管道流出，甚至在早上
    6 点被黑色派送车突袭。在承担如此高风险的任务之前，请深思熟虑并研究，以免你的电脑被没收，名誉扫地。无辜的人因为过度自信而入狱。


    ### 在家里运行出口中继


    在家里运行比使用云存储更糟，而且在美国危险万倍。如果法律出于某种原因对你的流量感兴趣，你的电脑可能直接被没收，但这只是开始。在英国，没有针对自我免罪的`第五修正案`保护。一个老古的法官仅仅因为你交出加密密钥就能判你两年。


    我们稍后会进入细节，但这些是我偶尔为自己设定的规则：


    - 避免通过它路由正常流量

    - 不要进行任何违法活动（稍后详述，这是一个灰色地带）

    - 绝不在上面放置敏感文件（例如财务数据、情书、法院文件）

    - 尽可能透明化我在运行


    ## 情报机构


    他们已经对 Tor 及其隐身能力宣布了战争。毫无疑问。尽管他们会竭尽全力说服你这都是为了你好，但这归根结底与其说是为了国家安全，不如说是为了控制：由于无法看到你在
    Tor 上做什么而产生的控制。他们不知道为什么。他们不喜欢这样。


    每当从爱德华·斯诺登口中泄出关于 `NSA` 的新发现时，我都会想到……


    考虑到他们从每个人的管道中获取了多少数据，这种狂妄是前所未有的。


    对 NSA 装好人的时代已经结束了。仅仅因为他们不喜欢你或你的行为无法被轻易识别，他们花费了这么多金钱并浪费了这么多时间来追捕你。

