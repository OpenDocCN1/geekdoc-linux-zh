  trans: '


    第一要原则非常简单：如果你运行一个，你就必须拥有一个。在一切可能的情况下，它们绝不能在他人的控制下运行，因为如果该服务被攻破，所有人都会完蛋。这意味着完全的匿名性，在
    100% 的时间内都拥有世界级的珠宝小盗般的隐身能力。


    丝之路（Silk Road）的管理员并没有这种能力。事实上，通过查看说明逮捕过程的在线文档，人们会觉得他在 IT 安全程序上非常疏懈。他反复犯的错误以至于执法部门的运气根本就没有派上用场。那家伙只是太粗心了。


    ## 第一


    永远、永远、永远不要在由朋友或云服务提供商拥有的 `VM` 中运行隐藏服务。记住，所有的“云”本质上都是他人的硬盘或网络，而不是你自己的。加密密钥可以从 `RAM`
    中转储。那么谁拥有 `RAM` 呢？


    没错。云服务提供商。雷电一闪，你的匿名性以及如果你的访客在浏览器习惯上懒惰，他们的匿名性也会付之乌有。2013 年，FBI 就通过这种方式对未打补丁的 `Tor
    Browser Bundles` 投放了“nit”（网络调查技术）。然而，如果你拥有这台机器，情况就是另一回事了。但让我们回退几步，假设你并不拥有。你该如何在宿主机系统上运行它呢？


    首先，你需要两个来自不同方的独立物理主机，都运行在 `virtual machines` 中，并运行启用防火墙的操作系统，该系统只允许 `Tor` 网络活动而不允许任何其他活动。


    第二个物理主机是运行隐藏服务的地方，同样使用了 `VM`。通过 `IPSec` 启用安全连接。你问什么是 `IPSec`？


    “IPSec 是一套协议簇，通过身份验证和加密通信会话中的每个 IP 数据包来保护互联网协议 (IP) 通信。`IPsec` 可用于保护两个主机之间（主机到主机）、两个安全网关之间（网络到网络）或或一个安全网关与一个主机之间（网络到主机）的数据流。”


    如果入侵者代理篡改了任何内容，你都会知情并可以关闭服务或将其移动到更安全的地方，而这一切就像机器中的幽灵一样进行。你可以想象这在北朝鲜将有多大的价值。


    如果你在那个像粪坑一样的国家，服务器即使掉线几秒钟，你也会比稍微偏执得多。但你可以将其移动到更安全的地方，甚至重新开始，而且你可能真的想这样做，因为你无法知道是发生了
    `RAID failure`，还是某个共产主义者的皮靴正在将 `VM` 的副本发送给高层。


    ## 第二


    如果选择宿主机路线，你必须确保通过主机随时都能随意地访问 `remote-console`。事实上，你必须通过远程完成所有操作，并通过 `https` 频繁更改密码。我会说每天一次，在北朝鲜那种气候下，保持这种偏执对你的健康有好处。


    ## 第三


    你绝不能、哪怕只有一次、从家里访问该服务。不要通过你的 `Nexus 7`。不要通过你女朋友的 `Galaxy Note`。甚至不要通过你家后院使用邻居的
    `WiFi` 通过 `Tor` 访问。除非你自己在做什么，否则使用 `VPN` 也是有风险的。请通过至少距离你住处十英里的的安全位置访问它。有些人可能会说这是大材小用，但在古拉格（劳营）里没有大材小用这句话。


    ## 第四


    偶尔移动服务。再次，看看任何 YouTube 上关于狙击手如何训练消灭敌人的视频。他们在每次射击后都会变换位置，以向敌人隐藏真实位置。频率取决于你。每周一次？每月一次？我个人会是每二十一天一次。在运行这类服务时，你永远都不嫌不够安全。


    ## 匿名性的死亡


    首相戴卫·卡梅隆在 2015 年 1 月公开表示，如果政府无法获得解密加密后门密钥，他想要[取缔](http://gizmodo.com/uk-prime-minister-wants-to-ban-messaging-apps-without-b-1679184681)
    所有支持加密的聊天软件。这就像农夫允许山狮和狐狸轻易进入鸡舍。在竞选期间，他说：


    “我们要允许一种根本无法读取的通信手段吗？我对这个问题的回答是：不，我们不能。”


    虽然他提到的主要是像 `WhatsApp` 之类的聊天程序，但你可以打赌他指的也是像 `PGP`、`Freenet` 以及已停止的 `Truecrypt`
    这样的应用。遗憾的是，他利用《周刊》（Hebdo）漫画袭击作为理由（难道他们不是都用这些来进一步推进大老大哥的议程吗？）。


    我看到加拿大在 `VPN` 使用方面演变出类似的趋势。新法要求 `VPN` 识别下载电影和游戏等受版权保护作品的客户，以便侵权通知（即恐吓信）能送到正确的人手中。这听起来似乎很合理，因为谁会不否认乔治·卢卡斯制作更多《星大战》前传集的能力呢？那是艺术，你懂的。


    但问题正出于此。主要是政治家忘记了互联网实际上是如何运作的。


    按照他们的意愿行事意味着 `VPN 提供商` 必须至少保留 6 个月的访问日志。单此一项就几乎保证了 `VPN 销售匿名服务（实际上是隐私）的能力将会消失，从而导致巨大的损失，因为客户并不愚蠢。他们知道隐私何时被针对。开始大逃离吧！（政府粉丝们）


    他们还知道 `VPN` 会为客户分配 `IP 地址`。这可能是你自己，穿着睡衣喝着茶，看着那个将烤炉开到最高温度的粪坑里的幽灵。


    唯一的解决方案是离开加拿大。


    但也许，这正是政府一直想要的。


    最令人遗憾的不是这些无法阻止恐怖主义或版权侵权，不是它会损害加密业务，不是只有政治家拥有加密。不，最令人遗憾的是我们将成为那个将烤炉开到最高温度的粪坑里的幽灵，这一切仅仅是因为比你我某人说这是正确的。


    我们的世界将变成反转世界。在那里对即是错，光即是暗，除了将建立的新矩阵，没人拥有安全。在那里更安全意味着更不安全，正如我们所……因为如果政府这么说，那就是福音真理。政治家上次撒谎是什么？


    如果你什么都没学到，请记住两件事：后门在 100% 的情况下都是安全漏洞。第二点也是如此：匿名、隐私以及随之而来的自由只有在我们允许它才会死去。


    ## 结语


    正如你所见，权力机构正在针对你对自身自由的选择能力。他们采取小步策略。他们认为你是愚蠢的。他们认为他们可以比你更好地管理生活。事实上他们做不到。NSA 阻止了对《周刊》漫画画家的袭击吗？他们阻止了
    9/11 吗？阻止了西班牙的爆炸吗？这是一场千刀万杀，一点一点地，在你意识到之前，你会感到非常头晕，但并不知道为什么。


    相信我，推迟你的安全和安心将足以引发他们一个细胞一个构建的那场癌症海啸。如果你读了这本书，你已经采取了所有需要的小步。你已经把大脚趾伸进了那个漩涡，现在是时候跳进去了。不要拖延。你清楚水有多暖。等太久了，水可能会变冷。更糟糕的是，有人可能会直接把你锁在外面。


    '
- fmt: '

    Just remember: Always nourish a strong security mindset. Develop an ability to
    configure things logically and anticipate trouble way ahead of time, seeing weaknesses
    in your submarine before the water comes roaring in. If in doubt about this, watch
    the film ''The Abyss''. See how Bud reacts when the water comes roaring in? He
    panics! Most of the crew dies. Don''t wait till that fateful day. Have something
    set up long ahead of time. A plan B. A plan C. Even a plan D if you can afford
    it.


    Any intelligence agency has unlimited funding to kill freedom by censoring all
    of us - even censoring the freedom to buy what you want to buy. With the media
    in their back pocket they can conjure any boogeyman they want to run over you.
    It''s not illegal for them to lie to you, but it is for you to lie to them. This
    hypocrisy costs them nothing but costs you everything, so like them, you must
    keep on top of changes to good security, updating as necessary and being on constant
    alert of new `zero-day` threats.


    But if there is one thing that you have that they don''t, it''s the incentive
    to work harder than they do. They clock out at `5pm` every day. Will you? The
    powers that be play dirty. And so should you.


    ## Want to Know More?


    First off, I owe you a big thanks and a round of beer for downloading this book.
    You could have picked any one of dozens of great books on this topic. You took
    a chance with mine. So thank you for that. Seriously, reading to the end takes
    a strong mind. If you liked what you read then I need your help! Please take a
    moment to leave a review for this book so others can learn to use `Tor` and `Freenet`
    and, well, protect themselves.


    Speaking of protection, I''ve used a number of tools to get to where I''m at,
    and some of the topics that failed to pass the censors in this book quite miraculously
    managed to slip through in my other books. Go figure.


    One thing though: when you have not one but two or three silver bullets to take
    down a werewolf, the better your chances of staying invisible to any other lycans
    roaming around out there. Mind you, I''m not prejudiced against those with `Lycanthropy`,
    as it is no laughing matter. But then neither is herd mentality.


    So then. Don''t use the same tools everyone else is using all the time. Mix it
    up a bit by checking out some other stuff of mine that did not see the light of
    day in this release:


    ### Other Books You May Enjoy:


    - [Burners & Black Markets](https://www.amazon.com/dp/B01EU9A92K)

    - [Darknet: A Beginner’s Guide to Anonymity](https://www.amazon.com/dp/B008AP8TAK)

    - [The Invisibility Toolkit](https://www.amazon.com/dp/B014OMZ1N0)

    - [Tor & the Deep Web](https://www.amazon.com/dp/B075MBL4L2)

    - [3 in 1 Darknet Super Pack](https://www.amazon.com/dp/B06VY1MWMP)

    - [Usenet: The Ultimate Guide](https://www.amazon.com/dp/B0098DWUQW)


    ### Coming:


    - Dark Linux

    - Cybercrime Supervillains

    '
