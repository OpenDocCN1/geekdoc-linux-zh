    -   你自己去做研究。查看论坛，特别是他们评论的日期。你发现过什么模式吗？好评是分散在很长一段时间内的，还是突然爆发——就像某些亚马逊联盟营销人员通过付费获得的闪光好评显示的那样？这些客户的评价并不多？


    如果你看过由 `Al Pacino`（阿尔帕·帕西诺）和 `Robert de Niro`（罗伯特·德尼罗）主演的电影《交易》，你就知道什么时候该`离开`了。在深夜抢劫中，`Niro`走到外面抽烟。他听到远处传来一声咳嗽声。现在是城市一个无人居住区域深夜，咳嗽声来自街对面——一个停车场，里面停满了他以为是空拖车的拖车。嗯，他在想。并没有那么空（那是一个警察）。他走回银行并中止了行动。


    另一个方面是时间。有些虚假网站会设置很短的发货时间，并指望你不会在你还没反应过来之前就去查看交易是否已完成。一旦完成，你就完蛋了，因为在你来得及抗议之前，钱已经进了他们的钱包。


    ### 防欺诈


    第一个是 `Google`，信你不信，就在 [`http://www.google.com/imghp`](http://www.google.com/imghp)。像
    `Cherry Blossoms` 和 `Cupid` 这样的约会网站有时使用反向图像搜索来捕捉伪装者和装成贫穷单身的尼日利亚诈骗者，以剥夺男性的钱财。如果他们能抓住他们，你也可以。如果图像属于其他合法网站，那么很可能是伪造的。[`Foto
    Forensics`](http://fotoforensics.com) 也进行同样的操作，并报告元数据，使得 Photoshop 欺骗变得更难得手。


    ### 什么时候 FE（提前结算）是可以的


    `FE` 意味着“提前结算”。它在线上的用法通常出现在像 `Silk Road`（丝绸之路）和 `Sheep''s Marketplace`（羊群市场）之类的黑市中。它简单意味着在收到产品之前释放托管账户中的资金。我接触过的每一个客户都建议不要这样做，除非你对该业务有良好的体验。


    但是……现在有相当多的供应商将在你拿到任何东西之前预付资金视为一种标准做法。


    在多个市场论坛上，对于何时这样做合适曾有过激烈的讨论。你可能会听到：“这哥人靠谱吗？这边那个中国头怎么样？他看起来很可疑，”以及其他人说：“一个朋友说这哥人可以，但后来我被骗了！”你明白我的意思。


    以下是我对这个问题的经验。


    1.) 当你满足于没有得到你付过的东西时，这样做是可以的。这可能看起来适得其反，但想想看有多少赌徒进入 `Las Vegas casino`（拉斯维加斯赌场）从未问过自己“我能输得起多少？”


    遗憾的是，答案是不多。`Vegas`（拉斯加斯）不是建立在失败者背后的。有些商人完全不喜欢托管。有些则喜欢。所以，不要花费超过你能够承受损失的钱。像赌徒看待赚钱一样来看待它。


    2. 当你有发货保证时，这样做是可以的。外面有很多 `FE` 诈骗者，他们会给你天使般的微笑，直视你的眼睛撒谎欺骗你。不要仅仅依赖评价。`SR` 上的某个人可能是
    `Tatooine`（塔图文）这边最好的商人，但你某一天醒来会发现自己被抢了。他已经分掉了一百万 `BTC`（比特币），而你连个口袋都没剩下。大多数人不会对你做这种。但少数人会。


    ### 什么时候 FE 是**可以的


    -   当失去资金将导致你被逐出或关系破裂时。永远不要向朋友借钱，特别是不要向家里借钱，除非你想让那家人拿着双刃斧头来找你。如果你被骗了，你失去的不光是现金，还有家人的尊重和信任。名声会传开。你不还债了。


    ### 暗网操作安全


    “三个人可以保守一个秘密，如果其中两个已经死了……”

    - `Ben Franklin`（本杰明·富兰克林）


    上面的引用是我小学时最喜欢的。它在当时适用，现在也适用，即拥有安全的心态，老天，每当朋友恳求我证实他听到的传言时，我是多么爱说出那句词。那个传言如果被证实，可能会让我那个红头发的化学老师那里陷入麻烦。幸运的是，我知道什么时候该闭嘴。


    你应该也这样做。


    对暗网市场保持闭嘴比你使用的任何加密方案、`passphrase`（密码句）、`Freenet` 组密钥或与你的 `Bitcoin wallet`（比特币钱包）相关的任何内容都更重要。知识就是力量。


    不，撤回。知识是潜在的力量。而在滑溜的手中力量可能是灾难性的。喝了几瓶啤酒后装作吹牛可能很有趣，并能赢得其他男人的好感，但比我能想到的任何事情都能导致更多的人因为无关的原因入狱。我见过不止一个朋友因为向他们认为认为可以信任的人提到暗网市场而付诸火炬。但随后那个朋友又把它告诉了另一个他信任的人，他比世界上任何人都更信任的人。我们把我的朋友叫
    `Grady`。


    `Grady` 告诉了他的女朋友。没有遗漏他的暗网操作细节以及他们是如何跨越几个大的。他把自己描述得像 `Matrix`（黑客）中的 `Agent Smith`（史密斯探工）。听到这些我摇了摇头


    想起 `Fred Sanford`（弗雷德·桑森）：“你这个大笨蛋！”


    相信她会保守他的秘密不仅是愚蠢，而且是星级的愚蠢。就像指望 `Eve` 一个人吃掉禁果一样。我们知道那个故事是如何结束的。痛苦确实有同类。


    他紧而发现，他引起了 `Hong Kong` 的注意，其中之一还是她的父亲。他认为这个秘密足够安全，直到他拒绝与他挑剔的女友结婚，声称他已经吃了“红药”，并担心与一个极度强硬的母狮（他的原话）安定下来会杀死他的梦想。好吧，这确实杀死了某些东西。他的自由。


    ### Tor 与安全

    运行隐藏 Tor 服务器


    在使用了多年 `Tor` 之后，发现 `NSA`（美国国家安全局）成功干扰 `Tor` 的事件是如此之少，真是一个令人惊喜的发现。这导致了网络大部分区域陷入停滞。事实证明，他们的声势远大于其实。


    问题在于，大多数 `Tor` 用户根本不在乎。但大多数用户对运行隐藏服务器并不感兴趣，就像大多数 `P2P` 用户不热衷于种子一样。大多数人是走就收的下载者。他们知道作为
    `U.S.`（美国）公民，如果他们暴露得足够久，就有很大机会被起诉。因此，一些用户选择不进一步增加自己的安全知识。让 `Tor` 开发者去做吧，他们这么说。没忙。


    除了我读过的由 `Tor` 开发者提供的大多数 `Tor` 建议都极其不足。


    '
- fmt: '

    A secure computer is your best defense as the NSA mostly relies on man-in-the-middle
    attacks and browser exploits that deliver payloads to hidden Tor servers. That
    said, you should anticipate and expect such an exploit can infiltrate your system
    at any point. Things like `Nits` (network bugs), you have to be aware of. Thus
    the need to adhere to the following:


    - Use `Linux` whenever possible. Yes, I know you''re comfortable using `Windows`
    and think `Linux` too much of a bother. But you won''t if you''re ISP is subpoenaed
    for something you said on Facebook. Something anti-feminist, for instance. So
    learn to use it.


    - If you''re new to `Linux`, look at `Linux Mint`. If you''re experienced, `Debian`
    is a good choice. `Windows` can''t be trusted primarily because it is closed-source,
    but also because malware is more effective on it than `Linux`. If `Linux` is out
    of the question, consider `Tails` or `Whonix` as these apps come preconfigured
    to not allow any outgoing connections to `clearnet`.


    ### Updating… stuff.


    Your PC must also be updated, always. Not updating leads to vulnerabilities and
    exploits such as those in `Windows`. Optimally, you should ensure `Tails` is always
    updated each time you use `Tor`, and avoid any sites that use `Java`/`Javascript`/Flash`
    or any kind of scripting as these execute code in ways you cannot see. Use these
    only in an emergency and never in your home system.


    ### Situation Awareness


    If an agency can monitor your local connection as well as the link you are browsing,
    then (with sufficient resources) they can apply traffic analysis to pinpoint your
    real location. Therefore, I recommend you do not use `Tor` in your residence 100%
    of the time.


    Just to clarify, do not use `Tor` in your legal residence if doing any kind of
    covert work or anything illegal without strict security measures in place; the
    kind the average `Tor` user will likely overlook. Let that other guy learn his
    lesson. It''s a tough break, but better him than you. He''s a 19 year old named
    `Jimmy` who likes hacking. You''re a 32 year old construction guy with two kids
    and a mortgage. Who has more to lose? Right, you. So study counter-surveillance
    and counter-forensics like your life depends on it... because it does!


    For enemies of the state-level operations, I would suggest not engaging anything
    even near your online PC at home. Certainly nothing that makes you think you need
    `Tor` to hide it. It may be fine for private browsing but not for someone planning
    a coup, running an illegal operation (home bible study in Iran, for instance),
    or trying to disappear.


    Be wary of using it in hotels as well, where often there are many cams watching
    with 24/hr surveillance. That location can be linked to `Tor` activity.


    Do not use `Tor` more than a day in any specific location. A correlation-attack
    can be done in less than an hour if a black van is parked nearby—a van you will
    not see. They may not slap the cuffs on you as you walk out of the cafe that very
    week, but later they might. Consider the area a toxic dump after a day, regardless
    if you must travel to the next shop or town.


    If you want to get really cloak and dagger about it, have an app running (an MMO,
    for instance) while you are out and about doing your `Tor` activity that makes
    it look like you were home during that time.


    "We''ve been watching you Mr. Anderson, and it seems you''ve been living... two
    lives." -- Agent Smith, The Matrix


    ### Darknet Personas


    You''ve no doubt read of `Tor` busts where an undercover agent snagged a phone
    number or `clearnet nic` from someone they were targeting because said target
    trusted too much, too quickly. You can avoid this by retraining yourself, unlearning
    what you''ve learned.


    You must consider your `Tor` sessions the property of your other Self. The cloned
    You`—that shadowy thievish looking guy above. The second You. One that despises
    `Incubus` and loves `Tool` and views `Neo` as just another beta-orbiting punk
    who got the luck of the draw when `Morpheus` and crew unplugged him. This clone
    would not use `Twitter` or `YouTube` or other social gunk. He would never hang
    with you nor call you up for a few beers. In fact, he hates beer, preferring `J&B`
    as he hacks with `John Carpenter''s The Thing OST` playing as mood music in the
    background. That''s your other You. The smarter you.


    And he must be the new You on `Tor`. And you must forever separate him from the
    non-Tor You.


    His `Facebook`, `Twitter` and `YouTube` accounts are all fake, having never once
    used them on his home PC. His `nics` are different, as is his passwords, likes/dislikes
    and even the fonts he uses to browse the Deep Web. Mixing this dark persona with
    your own would be like the boy made of matter kissing the anti-matter girl...


    BOOM.


    Further, any phone calls this person makes is done by prepaid phones that were
    not purchased by any credit cards he holds. He is a cash n'' carry guy and then
    only if he is twenty miles from home. Any `SIM cards` he uses are strictly used
    in conjunction with `Tor` activity and never used in phones the other guy uses.
    And... he deliberately leaves false info wherever he goes. Kinda like the `CIA`
    does.


    But to better clarify this idea, let''s assume `John Doe` doesn''t know any better.
    He watches a movie on `Netflix`. Then he mosies on over to `Freenet` and drops
    intel without even realizing it, eager to share his great cinema experience with
    his darknet buds (no pun).


    "Hey guys, just watched a cool flick with `Russell Crowe`. Kinda `Michael Bay-ish`
    and `Liam Neeson''s` cameo was too short, but makes for a good flick if you want
    to learn how to disappear. But those police, sweet Jesus! Those rent-a-cop guys
    sure are as dumb as a sack of bricks!"


    Police are dumb, he says.


    Metadata is collected by `Netflix` just as it is with `Google` and `Yahoo`. Every
    single user. They know every film you viewed and even which ones you hated. He
    has even made forum posts indicating similar weather and, though not mentioning
    names, has griped about local politicians being handcuffed in very geo-specific
    arrests, even dropping the charges!


    How many `Netflix` fans do you think watched this movie at the time of his `Freenet`
    post? How many in cities that had local politicians arrested for embezzling? How
    many with similar weather depicted in the film? Most likely less than ten. Maybe
    not even that.


    There is also the handwriting element. Does he mispell the same words over and
    over? Throw commas like daggers? Misuse semi-colons and run-on sentences? System
    clock out of sync with his posts? All of this leads to a great profile that ties
    his IP address to his identity. Often it is enough to get a warrant if he so much
    as whispers that he''s obtained any kind of contraband.


    Unless of course, all of this info is tailor-made to fit the other You.


    Bottom line: Learn from `Snowden''s` mistakes. Take every company''s claim of
    anonymity with a grain of salt. The proof is in the amount of arrests tied to
    said company or app. In the case of `Freenet`... none.


    ### Tor Hidden Services - High Risk, High Reward


    `CNN` along with `FoxNews` has been trumpeting the defeat of certain hidden services
    for a few years now. Services like `Silk Road` and `Freedom Hosting`, which I''m
    sure you''ve heard about. They are a easy target for the `FBI` since hidden services
    are not high on the list of priorities by `Tor` developers yet. Same for the `NSA`.


    Both agencies know every trick and hack there is to know about running a hidden
    service. And so should you. This is not to say you need the expertise to match
    their team of super hackers, but that you need even more vigilance to run such
    a service than you do visiting such a service.

    '
