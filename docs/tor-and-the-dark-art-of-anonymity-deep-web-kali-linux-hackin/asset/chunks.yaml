    To that, if you don''t come away satisfied, return it for a full refund.


    But I know you won''t. Because once you''ve taken the red pill, there ain''t no
    going back. You can''t unlearn what you''ve learned, unsee what you''ve seen,
    and you''ll want more. Much, much more.


    First off, we''re not sticking with the basics here. If all you want is Tor for
    Dummies, look elsewhere. Where we''re going is dangerous territory. It''s shark
    territory when you get right down to it. But don''t worry. We''ve got shark repellant
    and everything you need to surf safe. You''ll reap benefits you''ve only dreamed
    of and by the time we''re done, you''ll have gained NSA-level anonymity skills
    with a counter-surveillance mindset that rivals anything Anonymous or those goons
    at the NSA can come up with. They won''t have a clue as to how to find you.


    Secondly, for a few dollars, you''ll know every exploit those superhackers like
    to wield against Tor users and more: How to avoid NSA tracking. Bitcoin anonymity
    (that is, real Bitcoin anonymity), Opsec advice, Darknet markets and Darkcoins
    and, well... frankly it''s a very long list, and by the time you''re done you''ll
    be a Darknet artist when it comes to marketplaces and buying things cloak and
    dagger style.


