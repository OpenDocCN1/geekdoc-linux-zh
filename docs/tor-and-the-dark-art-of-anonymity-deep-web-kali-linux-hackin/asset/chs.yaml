- "# Tor 与匿名化黑术（深网、Kali Linux、黑客、比特币）：隐形术指南\n\n\n\n![](img/image_rsrcYC.jpg)\n\n\n\
  # 序言\n\n你想要你想要的。\n\n隐形。匿名。幽灵协议。\n\n你已经下了红色药丸并看清了真相，你并不喜欢它。我不怪你，我也不喜欢。但我原本认为对 `Tor`\
  \ 和其他隐身工具的了解，与真实世界的真相相比，仅仅是杯水车薪。那些是你在许多技术论坛上找不到的东西。当然，它们在私下里被谈论，但对你来说这一切都是隐形的。直到现在。\n\
  \n这让我们谈到了你和我，或者说我能为你做什么。当一个人卷起袖子、亲自动实践时，十年间学到的东西是惊人的。私人黑客论坛。`Usenet`。`Freenet`。我多年来搜遍了这一切，我学到的东西在亚马逊的任何地方都找不到。\n\
  \n同样惊的是，你只需花几美元花一个周末阅读就能学到这些。这就是我，很快也将成为你。周一你所处的地方就是我现在所在地，只不过没有了当年的错误。那些是我在使用 `Freenet`、`Tails`、`PGP`\
  \ 时犯下的错误。你能想到的，我都做过。天哪，我犯了**巨大的错误**。但这些是你将避免的错误，因为在读完本指南后，你将比那里 85% 的 `Tor` 用户懂得多，对匿名性的了解也超过大多数联邦探员。即使是\
  \ `NSA` 那些每天只做最少工作、所谓的超级黑客，他们的工作也大多涉及剥夺你的隐私权。\n\n对于这一点，如果你不满意，可以回来找。\n\n# 2022 年的\
  \ Tor 还安全吗？\n\n这确实是一个关键的问题。至于真正的答案是什么，这取决于你问谁，因为那里总有披着羊皮的狼，他们正从你的无知中获益。许多人说不。少数人说是。媒体尽管在政治和社会事务方面精通，但在讨论像\
  \ `Tor` 这样复杂的话题时，表现得非常地无力。\n\n\n\n\n例如：[Gizmodo](http://gizmodo.com/hackers-who-shut-down-psn-and-xbox-live-now-attacking-t-1675331908)\
  \ 报道，一群黑客成功攻破了足够的 Tor 中继节点，从而让 Tor 用户去匿名。如果你是第一次听到这个，Tor 匿名性的部分原理在于它将你的数据从一个节点转发到另一个节点。人们认为，如果他们攻破了足够的节点，就可以追踪\
  \ Tor 网络上的单个用户并暴露他们的真实身份。这有点像《矩阵》电影中的特工寻找那些被拔掉插的人一样。\n\n无论如何，巧的是，事实证明这只是一些闲得发慌的脚本小子黑客，他们只是想找一个新的目标进行攻击。谁知道为什么呢。也许他们玩\
  \ Playstation Network 玩了足够久，只是想在这里出于好奇地窥探一下。这些人也不是什么[超级黑客级别的 NSA 成员](http://www.slashgear.com/nsa-has-super-secret-hacker-collective-according-to-newly-revealed-snowden-docs-29295407/)。\n\
  \n但正如媒体常有的做法，这次攻击引起了几个对 Tor 不好感的博主和技术记者的关注，他们坦率说，对什么真正构成威胁一无所知。Tor 的开发者也对此发表了评论：\n\
  \n“这看起来像是一次普通的女巫攻击尝试（Sybil attack）：攻击者注册了许多新中继，希望成为网络中很大比例。但尽管他们运行了数千个新中继，但目前他们中继占\
  \ Tor 网络容量的比例不到 1%。我们正努力在这些中继变成威胁之前从网络中移除它们，根据我们目前看到的，预计不会会对匿名性或性能产生任何影响。”\n\n那些阴谋论博主未能报道的是，任何像\
  \ Tor 这样的去中心化网络都是此类攻击的首要目标。但要真正有机会击穿这个“矩阵”，黑客需要 Tor 隐式信任每一个新上线的节点。这根本不会发生。\n\n新中继收集流量也需要时间——有些长达六十天更久，而且由于\
  \ IP 地址是公开的，被举报的概率相当高，这只会加速恶意举报。真正的危险（且自诞生以来一直如此）是恐吓 Tor 用户转向不安全的通信方式。这正是 NSA 想要的。CIA\
  \ 已经在国外这么做了。现在 NSA 正在效法他们。\n\n## 使用 Tor 的**真实**风险\n\n在我们深入敌方领地之前，我在这里列出这些风险，以便你在安装前知道要避免什么，并可能在随后的章节中产生“啊！原来如此”的时刻。在阅读时，请记住，与敌人杀死你匿名性的各种手段相比，开启\
  \ `Javascript` 真的只是冰山一角。\n\n### Javascript\n\n众所周知，开启 `Javascript` 对 Tor 用户是有害的。我们\
  \ 95% 的人知道这一点，但那 5% 人的错误却被放大，并甩在剩下的我们脸上。更糟糕的是，许多网站现在运行了这么多脚本，看起来好像它们讨厌 Tor 用户。\n\
  \n一个网站就要求十多个脚本。没有它，页面过去是/现在/将是几乎处于瘫痪状态。有时它甚至无法阅读。你可以想象，如果你正在使用 Tor 并决定访问那个网站，而该网站是为了诱骗用户进入蜜罐陷阱而创建的，会发生什么。我记得有一个研究人员声称“81%\
  \ 的 Tor 用户可以被去匿名”。\n\n胡说八道。\n\n那 81% 的数字出现是因为目标用户对 `NoScript` 浏览器插件一知甚少，并且可能将 Tor\
  \ 的使用与日常开放网络的使用混杂，为相关性攻击提供了充足的数据。但这只是锦上添花。他们*无处不在*地留下了个人细节；使用与他们在开放网络其他地方相同的用户名和密码。炫耀他们最喜欢的\
  \ Netflix 电影。谈论当地活动（新奥尔良的爵士音乐节！）。谈论天气（法国区的飓风！）。你明白我的意思。稍后会有更多详细介绍。\n\n### 志愿者出口节点（Exit\
  \ Node）\n\n另一个大麻烦，虽然还不算所有风险之首。它仍然很有风险。好的一面是，你作为匿名性的勇敢信徒，慷慨地为其他 Tor 用户提供带宽和“出口管道”（希望他们中没有你认识的），以便他们通过你的节点传输加密流量。慷慨吗？确实如此。明智吗？如果你住在美国……不健康，正如我住在德克萨斯州的\
  \ Frick 叔叔常说的那样。\n\n这并不是说这样做本身是非法的。相反，但如果你住在像我故乡路易斯安州这样的警察国家，通过你 Tor 节点的内容可能会让你陷入麻烦。从你的节点流出的所有流量（即他人的流量）都与你的\
  \ `IP address` 绑定，正如其他人发现的，你由于地球另一端的人用你的节点所做而让自己处于危险。\n\n许多新 Tor 用户启动配置了 Tor 的 `BitTorrent`\
  \ 并吸干所有带宽。这让其他用户的 Tor 体验变得非常糟糕。你可能会收到版权侵权通知（或被起诉），或者如果儿童色情从你的管道流出，甚至在早上 6 点被黑色派送车突袭。在承担如此高风险的任务之前，请深思熟虑并研究，以免你的电脑被没收，名誉扫地。无辜的人因为过度自信而入狱。\n\
  \n### 在家里运行出口中继\n\n在家里运行比使用云存储更糟，而且在美国危险万倍。如果法律出于某种原因对你的流量感兴趣，你的电脑可能直接被没收，但这只是开始。在英国，没有针对自我免罪的`第五修正案`保护。一个老古的法官仅仅因为你交出加密密钥就能判你两年。\n\
  \n我们稍后会进入细节，但这些是我偶尔为自己设定的规则：\n\n- 避免通过它路由正常流量\n- 不要进行任何违法活动（稍后详述，这是一个灰色地带）\n- 绝不在上面放置敏感文件（例如财务数据、情书、法院文件）\n\
  - 尽可能透明化我在运行\n\n## 情报机构\n\n他们已经对 Tor 及其隐身能力宣布了战争。毫无疑问。尽管他们会竭尽全力说服你这都是为了你好，但这归根结底与其说是为了国家安全，不如说是为了控制：由于无法看到你在\
  \ Tor 上做什么而产生的控制。他们不知道为什么。他们不喜欢这样。\n\n每当从爱德华·斯诺登口中泄出关于 `NSA` 的新发现时，我都会想到……\n\n考虑到他们从每个人的管道中获取了多少数据，这种狂妄是前所未有的。\n\
  \n对 NSA 装好人的时代已经结束了。仅仅因为他们不喜欢你或你的行为无法被轻易识别，他们花费了这么多金钱并浪费了这么多时间来追捕你。\n\n\n\n正如你可能知道的，追踪高价值目标的成本更高。但他们不知道你是一个高价值目标，还仅仅是一个触手可得的鱼。正如我们在那些无聊的哈佛学生案例中看到的，如果在这盲目的情况下使用\
  \ Tor，任何人都可能陷入严重的麻烦。\n\n甚至埃里克·霍尔（Eric Holder）也公开指出，在被识别为公民之前，Tor 用户都是“非美国人士”。他们通过两种方法做到这一点：\n\
  \n## Quantum 和 FoxAcid 系统\n\n关于如何击败这些系统稍后会详细介绍，但要点如下：\n\n- 两个系统都依赖于电信公司的秘密安排。\n\
  - 两个系统都让用户陷入虚假的安全感。\n- 两个系统都无法对 LiveCD (`Tails`) 进行更改（这对我们有利）。\n- 两个系统都可以通过坚持一致的安全习惯被击败。\n\
  \n击败这些需要勤奋的心态，正如你可能知道的，勤奋与拖延是不兼容的。因此，你必须抵制拖延的冲动。\n\n我再说一遍。**不要**拖延。提前做好决定以避免风险行为。我们会逐一介绍它们。良好的安全意识需要时间、努力和投入来培养，这确实如此，但它应该从一开始就开始培养，这就是为什么风险被放在最前面，甚至在安装章节之前。这类书的内容在中间往往变得拖沓，并且经常被忘记。\n\
  \n谈到风险，如果你想知道什么真正让我彻夜难眠，那是这个问题：\n\n其他国家会向高级 CEO 和情报机构（例如香港）透露什么？\n\n如果我唯一能信任的只是阁楼里那台安装了\
  \ `Ultima 7`、连接着 28.8k 拨号调制器的老旧 486 ，那么可以假设每个商业实体都受到了美国国家安全局（NSA）的威胁。如果是这样，如果 NSA\
  \ 必须费周章才能监视我们，那么利用我们在这些系统中的数据来渗透海外美国拥有的系统有多容易？\n\n如果没有一家公司能保住自己的隐私信息，那么最终的终局可能会演变成一个“天网”网格，类似于苏联时期的东西阵营，CEO\
  \ 们必须在东方和西方之间做出选择。但这就像在决定你是想被灰熊吃还是被狮子吃一样。\n\n这有点操之过急，但至少你现在知道了真正的风险。至少是主要的风险。\n\n\
  通过书中的知识，这些每一种风险都可以被降至最低或彻底击败。遗憾的是，大多数读者会忘记他们所读内容的约 80%。那些采取行动的人会记住那 80%，因为他们正在将所学变为现实：当\
  \ NSA 威胁你的皇后时，采取精妙的类棋步般的反击。如果你不采取行动，而只是坐在那里永远地等待出击，你就放弃了游戏。他们赢了。所以，不要像在慢慢煮沸的水锅里的青蛙，因为你不仅自己会丧命，你的后代也会如此。\n\
  \n好了。关于风险的话题就够了。让我们开始吧。\n\n## Tor 逐步指南\n\n现在让我们来回答 Tor 是什么，它能做什么，以及它不能做什么。你现在已经猜到它是某种黑客工具了，你对了一半，但仅仅从像\
  \ Tor 这样强大的工具可以用于几乎任何事情的角度来看。事实上，只要在使用时足够谨慎，任何东西（可能除了穿红裙的丰满金发女性以外）都是匿名购买的。自得大的 Tor\
  \ 用户经常在做违法活动时被捕，比如侮辱泰国国王或用派脸威胁美国总统。\n\n在批评 Tor 之前，请试着记住，它不是为了买毒品、色情或稀有的白虎幼。它关乎匿名通信和隐私——其主要功能是通过将浏览会话从一个\
  \ Tor 中继器路由到另一个来授予你匿名，本质上是掩盖你的 IP 地址，使网站无法知道你的真实位置。这赋予了普通电脑用户在线匿名行动的巨大力量。\n\n这种力量允许你：\n\
  \n- 访问被封的网站（如果你在中国，则是 Facebook）\n- 访问无法通过互联网访问的 .onion 站点\n- 用派脸威胁总统……而且不会被特勤局上门！\n\
  \n这一切都是通过一种被称为“洋葱路由”（onion routing）的过程实现的。\n\n### 你问什么是洋葱路由？\n\n把它想象成一个多点对点的代理矩阵。与\
  \ `BitTorrent` 或 `eMule` 这种会将你的 IP 暴露给所有人的点点应用不同，Tor 使用一系列中间节点（以及 IP 地址）在整个网络链上加密你的数据。在端点，你的数据由出口节点（exit\
  \ node）解密，因此没有人可以精确定你的位置，或者告诉哪个文件来自哪台计算机。由于这种匿名化过程，由于隐藏了你真实 IP 地址的层层“洋葱皮”，你是匿名的。这就是\
  \ Tor 使用洋葱符号的原因。\n\n甚至可以建立一个只有 Tor 用户才能访问的站点。这被称为“洋葱站点”（Onion Sites），虽然在技术上有挑战性，但你不需要计算机科学博士，甚至不需要学士学位。事实上，你完全不需要编写代码，而且这些洋葱站点使用普通网页和普通非\
  \ Tor 版 Firefox 的人是无法的。\n\n我们稍后会深入探讨，以及如何构建一个任何东西（甚至是 NSA）都无法渗透的死亡堡垒。\n\n## 安装\n\
  \n安装 Tor 非常简单。你可以从 `[TorProject.org](https://www.torproject.org)` 下载。\n\n如果你的 ISP\
  \ 阻止你访问 Tor 网站，请这样做：\n\n- 向他们主页上的 Tor 开发者发封邮件。告诉他们情况。你可以收到一封附带安装包的自动回复。这是简单的方法。\n\
  - 困难的方法是使用 Google。在主页上搜索任何缓存的网站，包括 Tor，以防在发生全面核战时他们可能在服务器上缓存了它。\n- 让朋友给你发 Tor 安装包。也问他们\
  \ Tails。把 Tor 想象成核武器，把 Tails 想象成在空中制造那朵漂亮蘑菇云的铀。你不需要两者都有，但走 Tails 路线总是更好的。\n- 如果你从主\
  \ Tor 网站以外的地方获取，请**验证**签名，但为了所有神圣的事物，即使是你的朋友亲手递给你的，也要验证它。\n\n选择 Windows、Linux 或\
  \ Mac 版本，并知晓除非你想，否则你默认的 Firefox 安装不会被覆盖。两者都使用 Firefox，但 Tor 是一个完全独立的程序。你会发现它和 Firefox\
  \ 具有相同的功能：标签。书签。搜索框。菜单。所有都在这里……除了你最喜欢的插件。\n\n关于这一点，你可能会倾向于安装你最喜欢的应用程序。不要屈服这种诱惑。多个对你的匿名性没有帮助的插件可能会通过所谓的“浏览器指纹”（`Browser\
  \ fingerprinting`）协助某人在 Tor 网络上定位你。\n\n\n\n\n安装 `Tor` 后，你通过 `Tor Browser` 访问的每一个页面都将通过\
  \ `Tor` 网络进行匿名路由。然而，关于安全，有一个重要的细节需要你了解，那就是你的 `Tor` 设置仅仅是合理的起点。它们并非最优的，也绝不是无懈可击的。我们仍然处于起步阶段，而且坦率地说，对于\
  \ `Tor` 而言，所谓的“最优”在很大程度上取决于硬件（网络、CPU、内存、虚拟机、VPN），因此每个人的设置都会有所不同，就像伊朗德黑兰的人的安全需求与加拿大蒙特利尔的人的需求不同一样。\n\
  \n# Tor 做不到的事情\n\n现在来聊聊 `Tor` 做不到，或者至少做得不是非常好的事情。在未来这可能会发生变化，所以先不要急着下定论。\n\n1.)\
  \ `Tor` 无法保护你免受附件的影响。\n\n不仅限于可执行文件，还包括任何可以通过代码运行的内容。这意味着 `Flash` 视频以及 `RealPlayer`\
  \ 和 `Quicktime`。这些小家伙可以被配置将你的真实 IP 地址发送给对手。这可不好。因此，除非我们完全信任来源，否则我们永远不要运行任何可执行文件或程序。如果可能，请选择开源。这也适用于任何加密方案。让我们先在这里停顿一下。\n\
  \n如果你打算使用 `Tor`，加密是强制性的。这不是可选项。我曾在一些加密博客上听过人说它是可选的，但那就像说如果你打算全年住在曼谷，学习泰语是可选的一样。那样你将是走不远的。\n\
  \n2.) `Tor` 无法很好地运行 torrent。\n\n老新闻了，对吧？仍有成千上万的人这样做，考虑到如今北美对诉讼的这种痴迷，我可以理解为什么。他们声称未患于未备。我听过各种比彩虹还多的借口，说在\
  \ `Tor` 上使用 torrent 没什么大不了。唯一的问题是……他们是安全的，而其他人都倒霉了。`Tor` 无法运行像 `Emule` 和 `Limewire`\
  \ 这样的 P2P 应用，而不会让其他人的 `Tor` 体验变得糟糕。它只是消耗了太多的带宽。\n\n3.) `Tor` 无法隐藏你的身份 - 如果你像撒狂欢华节节珠一样到处丢你的真实邮箱，或者即使你在使用\
  \ `Tor` 时在网站上提供真实邮箱，你应该认为你的匿名性已经被破坏。被摧毁。被剖析。在任何情况下，你的虚拟身份都绝不能与你的现实身份匹配。我们将在后面的章节中深入探讨如何正确地做到这一点，但请记住，那些忽视这条规则的人会被黑客攻击、抢劫、逮捕，或被印有“FBI”字样的夹克制小精所肆残。稍后会有更多相关介绍。\n\
  \n# Tor 应用与反指纹工具\n\n一些应用程序（移动端或其他）让 `Tor` 变得没那么头疼，但除非你正在进行某种仿真，否则它们并不特别适合桌面用户。但考虑到现在每个人都在使用手机，其中一些应用以我从未想过的方式让我受益匪浅。请务必阅读\
  \ `Play Store` 中的评论，因为更新往往会破坏功能。\n\n## Orbot: 带有 Tor 的代理\n\n这基本上是 `Android` 版的 `Tor`，你可以在\
  \ `Google Play store` 或他们的官网上获取。\n\n![](img/image_rsrcYG.jpg)\n\n这是一个代理应用，运行方式与桌面版类似，它可以加密你的网络流量，保护你免受监视，并增强防御流量分析的能力。你可以将\
  \ `Orbot` 配合 `Twitter`、`DuckDuckGo` 或任何带有代理功能的应用使用。我已经用了很长时间，并习惯了它的优点。\n\n[Invizbox](https://www.indiegogo.com/projects/invizbox-privacy-made-easy)\
  \ - 让隐私变得简单\n\n![](img/image_rsrcYH.jpg)\n\n`Invizbox` 插入你现有的路由器或调制器中。会出现一个新的“InvizBox”wifi\
  \ 热点。连接到新热点并按照一次性配置设置即可开始。你连接到 `InvizBox` wifi 的所有设备都将通过 `Tor Network` 路由流量。请注意，这并非必需的应用，但它让事情变得简单。\n\
  \n## Signal 私密消息\n\n![](img/image_rsrcYJ.jpg)\n\n该应用会加密你手机上的每条消息，而且简单上手。更好的是，万一你把手机留在\
  \ Marble Slab，由于内部的加密，你的隐私是安全的。它还是开源的。相比之下，太多的应用程序并不是，因此无法让任何人进行同行评审。\n\n## Google\
  \ 与 Tor\n\n![](img/image_rsrcYK.jpg)\n\n`Google` 如何看待 `Tor`？坦率地说，我怀疑他们并不尝试。很大可能，他们并不像\
  \ `NSA` 那样讨厌它，但他们知道如果每个 `Google` 用户每天都使用 `Tor`，他们的广告投放系统将开始打空。想象一下，如果一个十三岁的男孩收到了西地时（Cialis）的广告，或者一个名叫\
  \ Bertha 的八十老人开始看到木马优惠券的广告。这是一个非常糟糕的投放系统。这对我们是好事，但对 `Google` 来说并不如此。\n\n他们也不介意捐赠资金，因为这可以获得对未来技术的持股。为此，他们不仅捐赠给了\
  \ `Tor`，还捐给了其他匿名服务，如 `Freenet`。他们甚至捐助过火星探测器技术。各种外太空的事物。他们永远不知道哪种技术会在一周后或一年后冲入轨道，所以他们像圣诞节早晨上的老吝奇一样挥霍金钱。\n\
  \n### 验证码 (Captchas)\n\n有时你在使用 `Tor` 时，会发现为了证明你是人类，`Google` 会弹出这种要求。由于他们对搜索查询的大量分析，这促使一些\
  \ `Tor` 用户认为 `Google` 是在针对他们。\n\n## SpiderOak\n\n通常我会警告不要对任何你想要私密的内容使用`云服务`。`SpiderOak`\
  \ 是我可以担保的例外，尽管还有一些保留。它是 `Dropbox` 相当不错的替代方案，因为它是用“零知识”编写的（开发者是这么说的），当你安装它时会创建一组加密密钥。当你上传数据到\
  \ `SpiderOak` 服务器时，它们已在你的计算机上进行了加密。再次，根据开发者的话。\n\n他们声称即使法院要求提供订阅数据，他们无法交付，因为只有你有密钥。这听起来很安全，但我仍然不会上传任何可能引起爱德华·斯诺登好奇心的内容。\n\
  \n另一个缺点是它是中心化的。中心化意味着单点故障。此外，他们随时可以删除数据（这对任何在线服务都是如此）。记住，在你和法官之间，他们总是站在法官这边。\n\n\
  ## Tails\n\n听过“现场系统”吗？在 `Tails` 出现之前我也没有。`Tails` 允许你使用 `Tor` 来避免追踪和审查，并且可以在你想要的任何地方使用。它内置了自己的操作系统，最好的部分是它是为移动办公的人设计的。\n\
  \n你可以通过 `USB stick`、`SD` 卡甚至 `DVD` 运行。这非常有用，因为它可以防止病毒。如果你不希望硬盘留下浏览会话的痕迹，这也有益。最好的部分是免费的。大多数基于\
  \ `Linux` 的东西都是免费的，但 `Tails` 自带聊天客户端、邮箱、办公软件和浏览器。\n\n不过使用 `DVD` 的缺点是，每次更新 `Tails`\
  \ 都必须重新刻录。这是不方便的地方。所以，让我们把它安装到 `USB stick` 上吧。\n\n\n\n\n\n1. 从 [Tails 网站](https://tails.boum.org/install/)\
  \ 下载 Tails 安装程序。你必须先将其安装到某个地方（如 DVD），然后将其克隆到 USB 闪存或 SD 卡。\n\n2. 点击 `Applications`\
  \ --> `Tails`，然后点击 'Tails Install' 开始安装。\n\n3. 选择 `Clone & Install` 以安装到 SD 卡或 USB\
  \ 内存盘。\n\n4. 插入你的设备，然后在 `Target-Device` 下拉菜单中扫描该设备。你会收到一个警告，关于它将覆盖设备上的任何内容。这并不可担心，只需选择\
  \ yes 并确认安装即可。\n\n# Tails 的局限性\n\nTails 和 Tor 都不会自动加密你的文档。你必须使用 [GnuPG](https://www.gnupg.org/)\
  \ 或 `LUKS` 来实现这一点，同时要记住 Word 或 Atlantis 等某些文档可能在文档本身中包含你的注册信息。这对于匿名性可能是一个问题。例如：2013\
  \ 年，亚马逊的自出版者发现，通过查看某些 Word 文档的代码提取注册信息，有时可以暴露笔名。这些代码揭露了许多自出版作者的真实身份和地址。作为一名作者，请相信我，你并不想要那些随之而来的烦恼。\n\
  \n我个人“注册”任何 App 时，都会输入虚假信息。如果你将结合 Tor 或 Tails 使用该 App，更是如此。\n\n如果你的目标是实现真正的匿名，还有其他值得注意的事项。如下：\n\
  \n- Tails 不擦除文档元数据。\n- Tails 不会向你的 ISP 隐藏你正在使用它的事实（除非你使用 Tor 桥节点）。他们看不到你在 Tor 上在做什么，这是事实，但他们知道你在使用它。同样，除非你使用\
  \ Tor 桥节点。\n- Tails 也无法识别人为失误。尝试不要使用同一个 Tails 会话启动两个不同的项目。请使用独立的会话。通过这种方式隔离两个身份有助于为你的会话提供强有力的匿名。\n\
  \n# Chrome\n\n在 Firefox 上使用 Tor 并非杀死龙的唯一方法。你也有 Chrome。是的，它是 Google 的，是的，Google 已经偏离了它的“不作恶事”的格言，但就像生活中的其他任何事情一样，幸运青睐有准备的人，你会惊讶于自己可以在多大程度上保护浏览器免受入侵者的侵害。准备就是一切。你只需要拥有正确的剑。正确的盔甲。正确的撬锁工具。准备（试剂）如下：\n\
  \nI. 安装 [ScriptNo](http://code.google.com/p/scriptno/) 扩展。它对于 Chrome 就像鼠标之于 PC，至少在精度方面是如此。它提供了卓越的控制，甚至允许你以\
  \ Firefox 的 NoScript 无法实现的方式精调浏览器。如果你觉得它太难了，[ScriptSafe](https://chrome.google.com/webstore/detail/scriptsafe/oiigbmnaadbkfbmpbfijlflahbdbdgdf?hl=en)\
  \ 是另一个选择。我用过两者并且都感到非常满意，尽管像互联网上的其他任何事情一样，你的体验因人而异。\n\nII. [Adblock](https://chrome.google.com/webstore/detail/adblock/gighmmpiobklfepjocnamgkkbiglidom?hl=en)。这在击\
  \ de 各种恶意软件方面简直好得离谱。它可能也是最著名的，所以互联网上到处都是反馈。\n\nIII. [User-agent Switcher](https://chrome.google.com/webstore/detail/user-agent-switcher-for-c/djflhoibgkdhkhhcedjiklpkjnoahfmg)\
  \ 用于 Chrome。安装它。它模拟 user-agent 字符串。你可以将其设置为像 Internet Explorer，这将欺骗许多恶意负载认为你真的在使用\
  \ Internet Explorer 而不是 Firefox 或 Chrome，从而对你发射空弹。\n\nV. [CanvasBlocker](https://addons.mozilla.org/en-US/firefox/addon/canvasblocker/)\
  \ - 防止网站使用 Javascript `<canvas>` API 对用户进行指纹识别。你可以在每个网站上阻止它，也可以有选择地只阻止少数网站。这取决于你。对我来说最重要的一点是它不会破坏网站。\n\
  \n# 致命的 Firefox 选项\n\n## Firefox\n\n你可能想在 Firefox 中启用“检查伪造网站”。不要这样做，因为这会将你经常访问的站点发送到\
  \ Google 服务器。Google 的“预测性文本搜索”也很糟糕，因为它也会按键记录发送到 Google。要更改它，你必须通过在 Firefox 地址栏中进入\
  \ `about:config` 手动进行。\n\n现在让我们来看看其他你可能想了解的隐私设置。\n\nJavascript - 这一项你应该像躲避黑疫一样避免它，因为在\
  \ Tor 网络上使用它等于从 1350 年被瘟疫污染的井水。你可能会注意到它在 Firefox 选项卡下是默认开启的。原因是由 Tor 开发团队解释的：\n\n\
  > 我们配置 NoScript 在 Tor 浏览器中默认允许 JavaScript，因为许多网站在禁用 JavaScript 后将无法运行。如果用户想要使用的网站需要\
  \ JavaScript，大多数用户将完全放弃 Tor，因为他们不知道如何允许网站使用 JavaScript（或者不知道启用 JavaScript 可能会让网站运行）。\n\
  \n这里存在权衡。一方面，我们应该默认启用 JavaScript，以便网站以用户预期的方式运行。另一方面，我们应该默认禁用 JavaScript，以更好地防止浏览器漏洞（而不只是浏览器漏洞）。\n\
  \nGhostery 和 Ghostrank - 这些并不特别致命，在 Tor 上只是没用，因为 Tor 本身已经禁用了跟踪。如果你决定使用它，请知道使用其中任何一个都可能改变你的浏览器指纹——虽未达到破坏匿名性的程度。但如果你想增强匿名性，请使用\
  \ DuckDuckGo。\n\nAdblock - 我们之前提到过这一个，不幸的是，使用它可能会改变你的指纹。Adblock plus 默认启用了“接受广告”，而且多年来还有关于\
  \ Adblock 收取 Google 广告费的[丑闻](http://www.wilderssecurity.com/threads/german-blogger-calls-adblock-plus-a-mafia-like-advertising-network.349411)。你可以对此得出结论，但在这么多用户的压力下，你可以放心对来说不再是一个数字。\n\
  \n此外，Tor 浏览器的基本理念是尽可能少插件。他们认为 TorButton、NoScript 和 HTTPS Everywhere 足以保护匿名性，而不会增加插件带来的风险。沿着这一思路，[Panopticlick\
  \ 网站](https://panopticlick.eff.org/index.php) 可能对你有用。\n\nWhonix & Tor\n\n如果你担心使用\
  \ Tor 会遇到麻烦（例如你托管隐藏服务），在运行任何程序之前，你可能想查看 [Whonix](https://www.whonix.org/wiki/Main_Page)。许多每天使用\
  \ Tor 的高级用户喜欢它提供的更强的安全性。两种工具都有自己的优缺点，并且每个优点都是为了不同的目的。你可能会发现对于你的个人情况，一个比另一个更好，而这种情况根据你的安全需求而异。\n\
  \n\n\n\n\n![](img/image_rsrcYM.jpg)\n\n你可能会好奇的问题是：多大的安全性才算过度？哪些是过度，哪些又不是？\n\n嗯，对此问题的完美答案是：如果你被发现，你会陷入多深的危机？而你愿意投入多少阅读时间来防止这种情况的发生？`Tails`\
  \ 更容易上手，如果你不预预期访问的网站会有攻击，那么请务必使用 `Tails`。\n\n然而，如果你住在北朝鲜或中国，那么就有面临二十年苦役的可能——敲击毫无价值的石头。也就是说，如果他们看到从你的所在地发出的与“他们不喜欢的活动”相关的\
  \ `Tor` 活动……或者在朝鲜的情况下，任何其他情况都是如此。他们不喜欢局外人给农民带来希望。如果你在那个国家被捕，在见到法官之前，你就会被定罪了。\n\n\
  ## Whonix 及其使其更安全的特性\n\n- 匿名发布/反审查\n- 使用带有 `Thunderbird` 或 [`TorBirdy`](https://addons.mozilla.org/en-us/thunderbird/addon/torbirdy/)\
  \ 的匿名电子邮件\n- 在 `Tor` 后方添加代理（`user` -> `Tor` -> `proxy`）\n- 匿名聊天。\n- IP/DNS 协议泄露防护。\n\
  - 隐藏你正在使用 `Tor`\n- 隐藏你正在使用 `Whonix` 的事实\n- `Tor` 上 Mixmaster\n- 安全且分布的时间同步机制\n-\
  \ 隔离安全\n- 无需注册匿名发送电子邮件\n- Torify 任何应用\n- Torify Windows\n- 虚拟机镜像 (VM)\n- `VPN` 支持\n\
  - 匿名使用 Adobe Flash\n- 匿名使用 Java/Javascript\n\n以下是一个中等安全系统的示例：\n\n- 在带有你任选的 `Linux`\
  \ 版本的内存棒上运行 `Whonix`。\n- 使用你信任的 `VPN`。\n\n关于安全性，还有两点需要注意：\n\n- 如果使用咖啡馆的 WiFi，避免定期使用非\
  \ `Tor` 的 WiFi 平板\n- 清楚你计划使用 `Tor` 的区域内每个处监控摄像头的位置\n\n## MAC 地址\n\n新的 WiFi/以太网卡具有某种有助于追踪你的东西。它是一个由制造商固化的的\
  \ 48 位标识符。类似于你手机的 IMEI。如果你万一没有清醒地考虑，而在考虑到 `Tor` 的情况下用信用卡购买了电脑，你可能会被 FBI 的 \"NIT\"\
  \ 盯，他们会扫描你的 `MAC` 号。`Nit` 是“网络调查技术”（Network Investigative Technique）的缩写。如果发生这种情况，你就完蛋了，因为你会被某个为他们工作且时间过多的闲随所追踪。\n\
  \n击败这一点的方法是使用一次性的 `MAC` 地址（是指数字，而不是 Apple 产品）——一个你用现金购买、且没有摄像头盯着你背后的这种地址。这样你就可以瞬间丢弃它，或者在意识到他们盯上你时将其更换。\n\
  \n## Whonix 桥节点 (Bridges)\n\n在 `Whonix` 中使用桥节点是有益的。\n\n### 什么是桥节点\n\n桥节点是混淆工具，用于向多管的\
  \ ISP 或政府隐藏你的 `Tor` 使用情况，他们可能会看到你正在使用 `Tor`，但不知道你在用它做什么。为此，`Tor` 桥节点是进入 `Tor` 网络的替代方式。有些是私有的。许多是公共的。有些列在\
  \ `Tor` 首页上。在敌对环境中，你可以看到利用它的价值，因为它让 ISP 知道你正在使用 `Tor` 变得困难得多。\n\n### 桥节点不是什么\n\n\
  它们并不是特别不可靠，但在性能方面，它们确实比普通的 `Tor` 使用不可靠。但这种权衡可能符合你的最佳利益。只有你才能决定这种性能损失是否值得。以下是在 `Whonix`\
  \ 中如何操作的方法。\n\n桥节点必须手动添加，因为 `Whonix` 没有自动安装方法，但这并不困难。你只需将它们输入正确的目录，如下：\n\n`/etc/tor/torrc`\n\
  \n如果你使用的是图形界面 `Whonix-Gateway`，则导航到：\n\n开始菜单 -> 应用程序 -> 设置 -> `/etc/tor/torrc.examples`\n\
  \n要编辑你的 `torrc` 文件（添加桥节点是所需的），导航到：\n\n开始菜单 -> 应用程序 -> 设置 -> `/etc/tor/torrc`\n\n\
  然后添加你从 `Tor` 桥节点页面复制的任何桥节点（如果你有私有的则使用它）。然后重启 `Tor` 使其生效。\n\n## 在 Tor 之外在线使用真实姓名\n\
  \n在在线上使用真实姓名有什么危险？\n\n我不想说，但即使有了我所学的一切，答案现在和以前 `Facebook` 刚出现时是一样的。事实上，我怀疑现在的答案和我青少年早期潜伏在名为名为\
  \ `The Well` 的在线聚集地时面对的答案是一样的。\n\n答案是：这取决于情况。\n\n那些从你的社交媒体资料中挖掘数据的执法部门和潜在雇主，往往比小偷更糟——当你在\
  \ `Twitter` 上宣布你要离开城两周时，小偷会垂涎口水。小偷虽然确实不光彩，但在职业上他们比许多在你背后搞小动作的企业巨头诚实得多。\n\n雇主是这群人中最糟糕的。像哈佛·双面脸一样虚伪。他们要求你的生活透明化，但从不要求他们自己。发一个激进的政治帖子，或者在波波拉波波岛度假时和半裸的菲律宾女性一起喝葡萄酒，而那些玩火表演者在背景中表演时，你可能会失去工作……甚至被拒绝工作。这不是开玩笑。这确实会。同样，如果你在简历上提到你使用\
  \ `Tor`，你有一天可能会听到面试官问：\n\n“我注意到你非常喜欢 `Tor` 以及其他隐藏你的 IP 地址并防止……身份泄露的匿名工具。”\n\n“因为我看重自由。”\n\
  \n这让我彻底没戏了。\n\n\n\n\n\n# 通用匿名性\n\n-   与爱德华·斯诺登（Edward Snowden）相关的任何内容\n\n大众的本质如此。你根本无法依靠\
  \ Facebook、Twitter 或 Google 在不向全世界宣告的情况下就尊重你使用 Tor 的自由。但至少使用 Tor，Google 无法为了广告挖掘你的浏览会话。没有广告\
  \ = 他们就没有汤可喝。根据 NBC 报道：\n\n“这家搜索引擎巨头将从 11 月 11 日起更改其服务条款。你对餐厅、商店和产品的评价，以及在 Google\
  \ Play 商店购买的歌曲和其他内容，可能会出现在当他们在 Google 上搜索时向你的朋友、联系人和更广泛公众显示的广告中。该公司将功能称为‘共享背书’。”\n\
  \n因此，我对我所做的一切都设置了防火墙。我在社交网站使用 [Ghostery](https://www.ghostery.com/)，并只提供关于自己的伪匿名细节。事实上，我试着避免\
  \ Tor 与任何社交媒体网站之间的任何关联，就像避免汽桶和点燃的火柴一样。\n\n## 电子邮件匿名性\n\n是否可能发送一条针对追踪器、黑客和大公司具有完全防范的消息？\n\
  \n### 事实上，有很多种选择可以完成这项任务。以下是几个非常稳固的服务。结合 Tor，使用，它们将为你提供一个虚拟堡垒。\n\n### [W3，匿名重发邮件器](http://gilc.org/speech/anonymous/remailer.html)\n\
  \n![](img/image_rsrcYN.jpg)\n\n可以与 Tor 连接，你只需要一个电子邮件地址即可发送消息（最好用 PGP 加密——稍后详细介绍）。\n\
  \n另一个是 [Guerrilla Mail](https://www.guerrillamail.com/)。他们允许用户创建临时邮箱供随时使用。点击“发送”后，发出的邮件会立即从系统中擦除。\n\
  \n![](img/image_rsrcYP.jpg)\n\n如果我们不对消息进行加密，这些服务的匿名性声明将显得很无力——这让我们提到了 PGP。\n\n###\
  \ [PGP](https://en.wikipedia.org/wiki/Pretty_Good_Privacy) 是许多像我这样的老用户的首选加密标准，这是有道理的。它从未被\
  \ NSA、FBI 或任何情报机构破解，而且在量子计算机普及之前，可能都不会被破解。它通过密钥对对工作，一个是公钥，一个是私钥（你将用它来解密你的消息）。\n\n\
  不用担心“密钥”这个词。它并不难理解，一旦你操作过几次，就会像点击发送一样简单。\n\n你必须做的第一件事是让你的公钥可用。这仅用于验证你的身份，不等同于泄露你的密码（例如用于\
  \ Drivecrypt 容器的密码）。你的接收者也必须与你分享他们的密钥，以便你进行回复。\n\n只有你们两个能够读取彼此的消息。例外是，如果对方被攻破而你并不知道，他们将读取你加密的所有内容。以下是你需要知道的\n\
  \n1.  首先，创建两个密钥：一个是公钥——供你以外的所有人使用——另一个是你甚至连亲老妈都不会分享的私钥。你应该在安全介质中备份此密钥，并记住，如果它没有备份到三种不同类型的介质中，它就不算被备份。如果你真的非常偏执，可以将其中一个通过加密的微\
  \ SD 卡发送给你的父母，以防发生房屋火灾。是的，这种情况确实会发生。\n2.  但是，如果你选择告诉妈妈，那么她需要你的公钥（你已经在公钥服务器上发布了它，对吧？）。然后你可以通过你的私钥读取它。她不知道这个密钥（感谢上苍！）。\n\
  3.  你可以通过 Tor 或任何地方（例如 Freenet，其最高安全设置要求对朋友的暗网连接有绝对信任）“签名”任何你想发送的消息，以验证它确实是由你发送的。\n\
  \    ……除非诺曼·贝提斯（Norman Bates）对你进行了一场淋浴戏并拿走了你的密钥。然后你妈妈就可以通过你的公钥验证确实是你。\n4.  你发过消息（或没发过消息）的用户可以签名你的公钥作为验证你身份的一种。正如你所见，这样做的人越多（也就是说，为你担保的人越多），效果越好。\n\
  \n**重要：**\n\n除非你拥有《雨人》中达斯汀·霍夫曼（Dustin Hoffman）的摄影记忆，否则将你的公钥/私钥、密码以及撤销证书存储在备份介质是一个好主意，这样你可以在五年后检索到它们……如果你需要的话。相信我，你将需要的！\n\
  \n将它们加密在容器中。始终打印你的密钥文件或口令，并存放在安全的地方。如果你丢失了它，所有用它加密的文档将永久丢失。没有后门，没有它就无法解密。此外，考虑在创建密钥对时设置过期日期。\n\
  \n如果你喜欢简单易用的界面，尝试用于 Gmail 的 [Mymail-Crypt](https://chrome.google.com/webstore/detail/mymail-crypt-for-gmail/jcaobjhdnlpmopmjhijplpjhlplfkhba)。这是一个允许用户在方便的界面中使用\
  \ PGP 加密消息的插件，但要确保你的浏览器是万密封的，并且你信任它处理你的私钥。\n\n如此，让我们为 Windows 配置 PGP\n\n-   安装 [Gpg4Win](http://gpg4win.org/download.html)\n\
  -   接下来，在 [Kleopatra](https://www.kde.org/applications/utilities/kleopatra/) 中创建密钥，并右键点击\
  \ `Export-Certificate-to-Server` 以便将其发布到密钥服务器。找一个信任的朋友来“签名”。\n-   使用自带的 Claws-Mail\
  \ 客户端，或者在使用 Thunderbird 时使用 [enigmail](https://www.enigmail.net/download/)。\n- \
  \  通过 PGP 向你信任的朋友发送一些消息。\n-   你可以选择设置 Yahoo/Gmail/Hotmail 过滤器，转发到更私密的账户。\n\n###\
  \ [Freenet](https://freenetproject.org/download.html) 是全球所有匿名系统的祖师，用于文件共享或浏览和发布“自由站点”（仅通过\
  \ Freenet 访问的网站）以及在论坛聊天，而无需担心审查。但因为它对新手不友好，但也令人疼。解释它提供的功能远超 Tor 讨论，因为它们是两个不同的系统，但如果你发现\
  \ Tor 无法满足需求，我在这里作为一个替代方案。\n\n而且它不像 Tor 那么简单，也不除非你一直运行。它并不适合所有人，因为有各种犯罪实体在使用它，如果你加载小组就会发现这一点。它很难被忽视，而且不像\
  \ Usenet 那样有人可以投诉。没有人可以举报。它在许多小组中处于无政府主义状态，但有减轻损害的方法。\n\n但对于绝对的匿名和言论自由，如果你有耐心学习它的暗网功能，没有比这更好的工具了。\n\
  \n来自网站介绍：\n\nFreenet 是一款免费软件，让你能够匿名共享文件、浏览并发布“自由站点”（仅通过 Freenet 访问的网站）以及在论坛聊天，而无需担心审查。Freenet\
  \ 是去中心化的，使其不易受到攻击，并且如果使用“暗网”模式（即用户仅与其朋友连接），则很难被检测。\n\nFreenet 节点之间的通信是加密的，并通过其他节点进行路由，使得极难确定谁在请求信息以及信息的内容。\n\
  \n用户通过提供带宽和部分硬盘空间（称为数据存储）存储文件来向网络做出贡献。文件根据其流行程度自动保留或删除，最不流行的文件会被丢弃，为更新或更流行的内容腾出空间。文件是加密的，因此用户通常无法发现其数据存储中的内容，并希望不必为此承担责任。聊天论坛、网站和搜索功能都构建在这个分布式数据存储之上。\n\
  \n\n\n\n\n最近的一项重要进展（很少有网络具备这一特性）是“暗网”（darknet）：通过仅与他们信任的人连接，用户可以极大降低自身的脆弱性，但仍然通过朋友的朋友的朋友等方式连接到全球网络。这使得人们即使在\
  \ Freenet 可能非法的地方也能使用 Freenet，让政府很难对其封锁，而且不需要依赖通往“自由世界”的隧道。\n\n这并不像使用 Usenet 提供商的新闻组阅读器那么简单。不，先生，Freenet\
  \ 需要耐心。使用 `Frost` 或 `Fuqid`（Freenet 主程序的前端应用），你可能需要等半小时才能“订阅”群组，或像你使用 Usenet 那样下载内容。某些群组（如\
  \ Freenet 群组和其他技术组）会立即可用，但信息较少。时间会解决这个问题。所以，如果你计划订阅很多群组，就让它在柜子里运行，然后忘掉它一天左右。\n\n\
  这种等待是值得的。\n\n## Frost & Fuqid\n\n我推荐的两个免费前端是：`Frost` 和 `Fuqid`。\n\n`Frost` 经历了很多改进，但我建议你先尝试\
  \ `Fuqid`，因为它是 Freenet 第一个外部应用，可以作为文件的插入/下载管理器。`Fuqid` 代表：`Freenet Utility for Queued\
  \ Inserts and Downloads`，可以在 Windows 或 Linux 上通过 `wine` 运行。\n\n`Fuqid` 的站点位于 Freenet\
  \ 内部，地址为：\n\n`USK@LESBxzEDERhGWQHl1t1av7CvZY9SZKGbCnsD7txqX0I,nP0CHuKvlbVzcrnz79TEd22E56IbKj-KHB-W8HHi9dM,AQACAAE/Fuqid/-1/`\n\
  \n你需要将上述内容粘贴到 Freenet 前控制面板中显示“Key”的地方。如果你是该系统的新手，加载可能需要几分钟。\n\n安装完成后，在左侧板板列表上右键点击并选择“Add\
  \ new board”（添加新板板）。在名称处输入 `fuqid-announce`（不带引号）。你现在会在板列表中列表中一个名为 `fuqid-announce`\
  \ 的新板板。\n\n右键点击此板板并选择“Configure selected board”（配置选定板板）。这将弹出一个新窗口。在该窗口上点击“Secure\
  \ board”（安全板板）将其从公共板板更改。现在在“Public key”部分粘贴下方的密钥：\n\n`SSK@qoY-E5SKRu66pmKH64xa~R~w3hXmS5ZNtqnpEGoCVww,HTVcdWChaaebfRAublHSxBSRaRFG91qCwsa3mGF3-QE,AQACAAE`\n\
  \n## 密码\n\n良好的强密码就像在你的密室里养了两只睡觉的罗威犬。大多数入侵者在混乱开始时就会离开。弱密码就像养了一只金毛猎犬。善良友好，在孩子身边很容易信任，但当那个入侵者在凌晨\
  \ 3 点来临时它可能只会小叫一下。然后它会躲在咖啡桌下（是狗，不是入侵者）。\n\n多年来我一直听到，永远不要使用任何个人信息作为密码。这包括姓氏、喜欢的书、电影。那么解决方案是什么呢？\n\
  \n用一或两个符号对你的密码进行重新组合。如果你认为黑客猜不出你女朋友储物柜组合锁的名字，那你就错了。即使你稍微混合一下，猜到也易如反掌。致力于此项工作的计算机可以在不到一个纳秒内猜出许多个。\n\
  \n但你如何记住一个通过 Tor 使用且带有符号的网站密码呢？\n\n- 简单。使用一个只有你容易记忆的短语（passphrase）。首先写下每个单词的首字母，注意大小写和位置。在其中插入符号。例如：\n\
  \n`Last Sunday, the wife bought me a Rolex watch and it was too ugly.`\n\n更改后它变为：\n\
  \n`LS,twbmarwaiw2u`\n\n上面的密码对黑客来说很难猜到，但对你来说很容易记住……假设你擅长替换。\n\n### 更改密码\n\n只要你完全遵循了上述操作，你就不需要每\
  \ 90 天更换一次密码。我确定你已经从双方听过他们对这一主题的看法，但我相信研究已经证明，保持强密码（除非有证据证明泄露）是一个稳妥的选择。\n\n来自 ACM/CCS\
  \ 2010 的研究论文由 Yinqian Zhang、Fabian Monrose 和 Michael Reiter 撰写的《现代密码过期的安全性：一种算法框架和实证分析》得出结论：每隔几个月更改一次密码并没有（重复，强调，并没有）增加安全性：\n\
  \n至少 41% 的密码可以在几秒钟内通过同一账户之前的密码被离线破解，而且根据预期，五次在线密码猜测就足以攻破 17% 的账户。\n\n……我们的证据表明，完全取消密码过期可能是恰当的，或许作为一种妥协，要求用户投入精力选择一个比平时强得多的密码（例如，长得多的短语）。……\n\
  \n从长远来看，我们认为研究支持这一结论：应该完全放弃基于密码的简单身份验证。\n\n### 在 Tor 浏览器中存储密码\n\n你可能注意到 Tor 浏览器中的“记住密码”选项不可用，或者看起来是这样。但如果你查看隐私设置并将记录设置更改为“记住记录”和“记住网站密码”，它就不再是灰色的了。\n\
  \n### Diceware\n\n如果你必须存储密码，一个很好的选择是 [Diceware](http://world.std.com/~reinhold/diceware.html)\
  \ —— 你可以在那里获取任何过期密码。你可以将任何密码复制到文本文件中，发送给自己或存放在移除式磁盘上。\n\n记住：Tor 无法提高你的*系统*。它只提高在线安全性，而且在负责任的使用时也是如此。\n\
  \n## 防止非 Tor 活动与 Tor 活动关联\n\n同时浏览不同的网站是有风险的，这会破坏匿名性，因为 Tor 可能通过同一个电路发送每个网站的请求，出口节点可能会看到关联。\n\
  \n更好的做法是一次浏览一个网站，然后从 Tor 按钮中选择“新身份”。\n\n此外，如果你想隔离两个不同的应用程序（允许一个应用程序执行的操作与另一个应用程序的操作隔离），你可以让它们使用相同的\
  \ SOCKS 端口但更改用户/密码。\n\n## 记录器\n\n你可能好奇键盘记录器与 Tor 有什么关系。或者说，键盘记录器到底是什么。你并不孤单。事实上，你会惊讶有多少人不知道，也会惊讶有多少技术人员认为这没问题。\n\
  \n2010 年，我联系了一位十多年没见过的老童玩朋友。他现在是一名 ATF 探员。他在关于黑客组织“匿名”的 Facebook 帖子下回复了我。\n\n“键盘记录器是什么？”他问。我等等其他人回复。没有人回复，所以我告诉了。。他看起来非常惊讶、目瞪口呆，仿佛那是最近才释放到网络上的东西。但（叹气），对于它们具体在做什么存在很多困惑。\n\
  \n\n\n\n它们是监控软件，会追踪并记录你进行的每一次点击、访问的每一个网站、输入的每一个按键。聊天记录、Skype、电子邮件。只要你打得出来，它就能记录，而且就在你的眼皮底下。它甚至可以将你输入的内容通过电子邮件发送给世界上另一端的接收者。信用卡号、密码和\
  \ Paypal 登录详情只是它能获取的目标的一小部分。\n\n## 人是如何被感染的？\n\n- 打开邮件附件\n- 从 P2P 网络中来自不可信用户运行的\
  \ `.exe` 文件\n- 使用过时的浏览器访问受感染的网站\n- 如果美国国家安全局（NSA）打通了关系\n\n有些雇主利用它们来追踪员工的生产力。有些妻子通过\
  \ `USB`（硬件版本）安装一个，看看丈夫半夜上床后在和谁聊天。父母会在孩子的电脑上使用这些软件。所以，它们并不总是 100% 都是恶意的。\n\n但它们的检测变得异常困难。它们拥有一种几乎近乎吸血鬼般的存在，但像吸血鬼一样，存在一些你可以在不用拔出木桩的情况下察觉的细微迹象。\n\
  \n## 迹象\n\n- 浏览速度缓慢\n- 鼠标卡顿/在文本文档中按键停顿\n- 显示的字母与你输入的的不符\n- 在加载重文本/图形时，多个网页出现错误\n\
  \n它们分为两种：\n\n### 软件键盘记录器\n\n这种类型隐藏在你的操作系统内部。它们潜伏在 `Windows` 中。`Linux` 则没那么多。键盘记录器记录按键并在电脑在线时按设定时间将它们发送给黑客或其他作恶者。由于了伪装，大多数用户永远不会看到它在施展黑暗魔法。许多流行的防毒病毒厂商在识别它方面存在困难，因为其定义更新非常频繁。\n\
  \n### 硬件键盘记录器\n\nBond 可能使用过其中一种。由于是硬件，它是一个可以插入到 `PC` 上任何 `USB` 接口的物理扩展装置，怀疑的配偶或想要接触父亲色情收藏的儿童可以在网上购买。按键记录被记录在\
  \ `ram` 内存中。无需安装。\n\n因此，除非你是那种每天都会检查 `PC` 内部构造的人，否则你可能在为时已晚才发现它。它们还可能直接内置在键盘中。FBI\
  \ 喜欢将目标的设备更换为定制制造的仿制监控设备。诚然，这主要针对黑手党等高价值目标，但任何人都可以获得。\n\n## 键盘记录器防护\n\n- 检查你的键盘是否有可疑附件。如果你是\
  \ `X` 公司的员工，某天早上你的桌子上来了一个新键盘，除非你 200% 信任你的老板，否则请保持谨慎。\n- 使用`Virtual Keyboard`。没有按键\
  \ = 没有记录！\n- 使用 [Guarded ID](http://www.guardedid.com/) 防止黑客捕获你的按键。它通过扰乱你输入的一切来工作，使任何信息对黑客来说都是徒用的。\n\
  - 使用良好的防火墙阻止键盘记录器传输你的数据。一年前，我的 `Comodo` 防火墙在我没有进行在线活动时，提醒我有一个凭空出现的可疑网络活动。结果发现我感染了\
  \ `Win64/Alureon` 木马程序。我不得不使用 `Malwarebytes` 来检测并删除它。`Norton` 毫无用处！想象一下。\n\n## 其他反键盘记录器工具\n\
  \n如果你不介意花点钱，还有几种：\n\n### Zemana AntiLogger\n\n![](img/image_rsrcYR.jpg)\n\n这个“免费”版本是一个极其基础的键盘记录器检测器。事实上，它非常精简，但如果你只需要获得警报，那么这个可能适合你。`Keylog\
  \ Guard` 为在键盘上输入的所有内容提供加密。任何窥探者只会得到乱码的字母。付费版本价格稍贵，为 29.99 美元，并带有针对恶意软件等的额外保护，但有些过度了。\n\
  \n此外，如果你尝试运行它不喜欢的安全程序，它会骚扰你，就像其他所有防病毒软件一样。\n\n### SpyShelter STOP-LOGGER\n\n![](img/image_rsrcYS.jpg)\n\
  \n免费版提供的比 Zemana 多，包含了屏幕截图功能。它还会提醒你任何试图窃取你按键的代码，但免费版不兼容 64 位。价格是 24.99 美元。\n\n但请注意，删除键盘记录器是一件棘手的事，因为它们有重新安装的习惯。键盘记录器通常作为服务隐藏在\
  \ `svchost.exe` 中，因此如果没有专用程序，任务管理器并没有什么帮助。最佳防护方法是在它们插入之前将其拦截。\n\n采取主动。预判密码泄露。记住，保持警惕！\n\
  \n## 暗网市场\n\n你们中有些人可能在想，考虑到所讨论的漏洞，暗网到底有多安全。短答案是：取决于你如何保护它。\n\n你是薄弱环节。安全链的最后一环。尽管你需要\
  \ `Tor` 才能访问 `Onion` 站点，但该术语适用于任何匿名网络——如 `I2P`、`Freenet` 或任何其他隐藏数据传输源（并以此隐藏你的身份）的网络。\n\
  \n这就引入了暗网市场。\n\n深网中此类市场的列表非常多，被骗的风险很高。这是你可能没听说过它们的原因之一。它们经常因为声誉恶劣或执法部门的打击而迅速关闭。有时它们会得罪错误的人，然后垃圾邮件发送者会对网站进行\
  \ `ddos` 攻击。但如果你对那里卖什么感兴趣，有很多地方可以去。\n\n\n\n\n-   你自己去做研究。查看论坛，特别是他们评论的日期。你发现过什么模式吗？好评是分散在很长一段时间内的，还是突然爆发——就像某些亚马逊联盟营销人员通过付费获得的闪光好评显示的那样？这些客户的评价并不多？\n\
  \n如果你看过由 `Al Pacino`（阿尔帕·帕西诺）和 `Robert de Niro`（罗伯特·德尼罗）主演的电影《交易》，你就知道什么时候该`离开`了。在深夜抢劫中，`Niro`走到外面抽烟。他听到远处传来一声咳嗽声。现在是城市一个无人居住区域深夜，咳嗽声来自街对面——一个停车场，里面停满了他以为是空拖车的拖车。嗯，他在想。并没有那么空（那是一个警察）。他走回银行并中止了行动。\n\
  \n另一个方面是时间。有些虚假网站会设置很短的发货时间，并指望你不会在你还没反应过来之前就去查看交易是否已完成。一旦完成，你就完蛋了，因为在你来得及抗议之前，钱已经进了他们的钱包。\n\
  \n### 防欺诈\n\n第一个是 `Google`，信你不信，就在 [`http://www.google.com/imghp`](http://www.google.com/imghp)。像\
  \ `Cherry Blossoms` 和 `Cupid` 这样的约会网站有时使用反向图像搜索来捕捉伪装者和装成贫穷单身的尼日利亚诈骗者，以剥夺男性的钱财。如果他们能抓住他们，你也可以。如果图像属于其他合法网站，那么很可能是伪造的。[`Foto\
  \ Forensics`](http://fotoforensics.com) 也进行同样的操作，并报告元数据，使得 Photoshop 欺骗变得更难得手。\n\
  \n### 什么时候 FE（提前结算）是可以的\n\n`FE` 意味着“提前结算”。它在线上的用法通常出现在像 `Silk Road`（丝绸之路）和 `Sheep's\
  \ Marketplace`（羊群市场）之类的黑市中。它简单意味着在收到产品之前释放托管账户中的资金。我接触过的每一个客户都建议不要这样做，除非你对该业务有良好的体验。\n\
  \n但是……现在有相当多的供应商将在你拿到任何东西之前预付资金视为一种标准做法。\n\n在多个市场论坛上，对于何时这样做合适曾有过激烈的讨论。你可能会听到：“这哥人靠谱吗？这边那个中国头怎么样？他看起来很可疑，”以及其他人说：“一个朋友说这哥人可以，但后来我被骗了！”你明白我的意思。\n\
  \n以下是我对这个问题的经验。\n\n1.) 当你满足于没有得到你付过的东西时，这样做是可以的。这可能看起来适得其反，但想想看有多少赌徒进入 `Las Vegas\
  \ casino`（拉斯维加斯赌场）从未问过自己“我能输得起多少？”\n\n遗憾的是，答案是不多。`Vegas`（拉斯加斯）不是建立在失败者背后的。有些商人完全不喜欢托管。有些则喜欢。所以，不要花费超过你能够承受损失的钱。像赌徒看待赚钱一样来看待它。\n\
  \n2. 当你有发货保证时，这样做是可以的。外面有很多 `FE` 诈骗者，他们会给你天使般的微笑，直视你的眼睛撒谎欺骗你。不要仅仅依赖评价。`SR` 上的某个人可能是\
  \ `Tatooine`（塔图文）这边最好的商人，但你某一天醒来会发现自己被抢了。他已经分掉了一百万 `BTC`（比特币），而你连个口袋都没剩下。大多数人不会对你做这种。但少数人会。\n\
  \n### 什么时候 FE 是**可以的\n\n-   当失去资金将导致你被逐出或关系破裂时。永远不要向朋友借钱，特别是不要向家里借钱，除非你想让那家人拿着双刃斧头来找你。如果你被骗了，你失去的不光是现金，还有家人的尊重和信任。名声会传开。你不还债了。\n\
  \n### 暗网操作安全\n\n“三个人可以保守一个秘密，如果其中两个已经死了……”\n- `Ben Franklin`（本杰明·富兰克林）\n\n上面的引用是我小学时最喜欢的。它在当时适用，现在也适用，即拥有安全的心态，老天，每当朋友恳求我证实他听到的传言时，我是多么爱说出那句词。那个传言如果被证实，可能会让我那个红头发的化学老师那里陷入麻烦。幸运的是，我知道什么时候该闭嘴。\n\
  \n你应该也这样做。\n\n对暗网市场保持闭嘴比你使用的任何加密方案、`passphrase`（密码句）、`Freenet` 组密钥或与你的 `Bitcoin\
  \ wallet`（比特币钱包）相关的任何内容都更重要。知识就是力量。\n\n不，撤回。知识是潜在的力量。而在滑溜的手中力量可能是灾难性的。喝了几瓶啤酒后装作吹牛可能很有趣，并能赢得其他男人的好感，但比我能想到的任何事情都能导致更多的人因为无关的原因入狱。我见过不止一个朋友因为向他们认为认为可以信任的人提到暗网市场而付诸火炬。但随后那个朋友又把它告诉了另一个他信任的人，他比世界上任何人都更信任的人。我们把我的朋友叫\
  \ `Grady`。\n\n`Grady` 告诉了他的女朋友。没有遗漏他的暗网操作细节以及他们是如何跨越几个大的。他把自己描述得像 `Matrix`（黑客）中的\
  \ `Agent Smith`（史密斯探工）。听到这些我摇了摇头\n\n想起 `Fred Sanford`（弗雷德·桑森）：“你这个大笨蛋！”\n\n相信她会保守他的秘密不仅是愚蠢，而且是星级的愚蠢。就像指望\
  \ `Eve` 一个人吃掉禁果一样。我们知道那个故事是如何结束的。痛苦确实有同类。\n\n他紧而发现，他引起了 `Hong Kong` 的注意，其中之一还是她的父亲。他认为这个秘密足够安全，直到他拒绝与他挑剔的女友结婚，声称他已经吃了“红药”，并担心与一个极度强硬的母狮（他的原话）安定下来会杀死他的梦想。好吧，这确实杀死了某些东西。他的自由。\n\
  \n### Tor 与安全\n运行隐藏 Tor 服务器\n\n在使用了多年 `Tor` 之后，发现 `NSA`（美国国家安全局）成功干扰 `Tor` 的事件是如此之少，真是一个令人惊喜的发现。这导致了网络大部分区域陷入停滞。事实证明，他们的声势远大于其实。\n\
  \n问题在于，大多数 `Tor` 用户根本不在乎。但大多数用户对运行隐藏服务器并不感兴趣，就像大多数 `P2P` 用户不热衷于种子一样。大多数人是走就收的下载者。他们知道作为\
  \ `U.S.`（美国）公民，如果他们暴露得足够久，就有很大机会被起诉。因此，一些用户选择不进一步增加自己的安全知识。让 `Tor` 开发者去做吧，他们这么说。没忙。\n\
  \n除了我读过的由 `Tor` 开发者提供的大多数 `Tor` 建议都极其不足。\n\n\n\n\n\n一台安全的电脑是你最好的防御，因为美国国家安全局（NSA）主要依赖于中间人攻击和将有效载荷传输到隐藏\
  \ Tor 服务器的浏览器漏洞。尽管如此，你应该预见到并预期此类漏洞可能在任何时候渗透你的系统。诸如 `Nits`（网络漏洞）之类的，你必须保持警惕。因此需要遵循以下原则：\n\
  \n- 尽可能使用 `Linux`。是的，我知道你习惯使用 `Windows` 并且觉得 `Linux` 太麻烦。但如果你的 ISP（互联网服务供应商）因为你在\
  \ Facebook 上说过的话而被传唤，你就不会这么想了。例如，某些反女主义的内容。所以，学会使用它吧。\n\n- 如果你是 `Linux` 新手，可以看看\
  \ `Linux Mint`。如果你有经验，`Debian` 是一个不错的选择。`Windows` 不可信主要是因为它是闭源的，还因为恶意软件在上面比 `Linux`\
  \ 更有效。如果 `Linux` 无法考虑，可以考虑 `Tails` 或 `Whonix`，因为这些程序预先配置，不允许任何指向明网（clearnet）的传出连接。\n\
  \n### 更新……东西。\n\n你的电脑也必须始终保持更新。不更新会导致漏洞和利用，如 `Windows` 中的那些漏洞。理想情况下，你应该确保在每次使用 `Tor`\
  \ 时都确保 `Tails` 是最新更新，并避免任何使用 `Java`/`Javascript`/`Flash` 或任何脚本的网站，因为它们以你无法看到的方式执行代码。仅在紧急情况下使用它们，千万不要在你的家庭系统中使用。\n\
  \n### 态势感知\n\n如果一个机构可以监控你的本地连接以及你正在浏览的链接，那么（在资源充足的情况下）他们可以使用流量分析来精确定你的真实位置。因此，我建议你不要在家里\
  \ 100% 的时间使用 `Tor`。\n\n在此说明一下，如果在进行任何形式的秘密工作或非法活动，且没有采取严格的安全措施，请不要在你的合法居住地使用 `Tor`；那种普通\
  \ `Tor` 用户可能会忽略的安全措施。让那另一个家伙去取教训吧。这虽然很糟糕，但比你中要好。他是一个叫 `Jimmy` 的 19 岁少年，喜欢黑客。而你是一个\
  \ 32 岁有两个孩子和房贷的建筑工人。谁损失得更多？没错，是你。所以，学习反侦察和反取证技术，就像你的命取决于它一样……因为事实确实如此！\n\n对于国家级行动的敌人，我建议不要在家里的在线电脑附近接触任何东西。绝不是那种会让你觉得需要用\
  \ `Tor` 来隐藏它的东西。它对于私人浏览来说可能没问题，但对于那些计划政变、经营非法活动（例如在伊朗的家庭圣经学习小组）或试图消失的人来说则不是。\n\n\
  在酒店中使用它时也要小心，因为那里通常有许多摄像头进行 24 小时监控。该位置可能与 `Tor` 活动相关联。\n\n在任何特定地点使用 `Tor` 的时间不要超过一天。如果附近停着一辆黑色的面包车，关联攻击可以在不到一小时内完成——而那辆面包车你是看不见的。他们可能不会在你这一周走出咖啡馆时就对你戴铐，但以后可能会。在一天之后，将该区域视为毒性倾倒场，无论你是否必须前往下一个商店或城镇。\n\
  \n如果你想在这方面做得更深神秘测，可以在你在外面进行 `Tor` 活动时，运行一个程序（例如一个 MMO 游戏），让它看起来在那段时间你是在家里。\n\n“我们一直在盯着你，安德森先生，看来你一直在过着……双生活。”\
  \ —— 史密斯探工，《黑矩阵》\n\n### 暗网人格\n\n你无疑读过关于 `Tor` 扫荡的新闻，卧底特从目标身上获取了电话号码或明网网卡（clearnet\
  \ nic），因为该目标信任太深、太快。你可以通过重新训练自己，忘记你所学的知识来避免这种情况。\n\n你必须将你的 `Tor` 会话视为“另一个自我”的财产。那个克隆的你——上面那个阴影的、看起来像贼一样的家伙。第二个你。一个鄙视\
  \ `Incubus`、热爱 `Tool` 并将 `Neo` 视为另一个在 Beta 轨道运行的混混，他只是在 `墨菲斯` 和他的伙伴拔掉插头时运气好而已。这个克隆不会使用\
  \ `Twitter` 或 `YouTube` 或其他社交垃圾。他永远不会和你混在一起，也不会给你打电话约你喝几杯啤酒。事实上，他讨厌啤酒，更喜欢 `J&B`，并在背景中播放《约翰·卡宾珀的怪形》原声带进行黑客操作。那是你的另一个你。更聪明的你。\n\
  \n他必须是 `Tor` 上的新你。你必须永远将他与非 `Tor` 的你分开。\n\n他的 `Facebook`、`Twitter` 和 `YouTube` 账户全是虚假的，从未在他在家里电脑上用过一次。他的网卡（nics）是不同的，密码、喜欢/不喜欢的内容也是如此，甚至他浏览深网时使用的字体也是不同的。将这个黑暗人格与你自己的混合在一起，就像由物质组成的男孩亲吻反物质女孩一样……\n\
  \n砰。\n\n此外，此人打的任何电话都是通过预付手机拨出的，这些手机不是用他持有的任何信用卡购买的。他是一个现付现货的人，而且仅当他离开家二十英里时。他使用的任何\
  \ `SIM 卡` 都严格与 `Tor` 活动配合使用，绝不会在另一个家伙使用的手机中使用。而且……他无论去哪里都会故意留下假信息。有点像 `CIA` 做的那样。\n\
  \n但为了更好地解释这个观点，让我们假设 `John Doe` 并不懂这些。他在 `Netflix` 上看了一部电影。然后他闲逛到 `Freenet`，在没有察觉的情况下分享了他的精彩电影体验。\n\
  \n“嘿伙计们，刚看了一部有罗素·克劳主演的酷电影。有点迈克尔·贝风格，而且利亚姆·尼森的客场太短了，但如果你想学习如何消失，这电影很棒。但那些警察，老天爷！那些警察简直蠢得像一袋砖！”\n\
  \n他说警察很蠢。\n\n元数据被 `Netflix` 收集，就像 `Google` 和 `Yahoo` 一样针对每一个用户。他们知道你看过的每一部电影，甚至你讨厌哪些。他甚至发布了帖子暗示类似的天气，尽管没有提到名字，但抱怨了官员被戴铐的情况！\n\
  \n你认为有多少 `Netflix` 粉丝在他发布 `Freenet`帖子时看了这部电影？有多少在因贪污被捕的城市？有多少在电影中描述了类似的天气？可能少于十个。可能甚至没有。\n\
  \n还有手写元素。他是否反复拼错单词？像扔飞剑一样扔逗号？误用分号和长句？系统时钟与他的帖子不同步？这一切都导致了一个出色的画像，将他的 IP 地址与他的身份联系起来。通常情况下，只要他私声说获得了任何违禁品，就足以获得搜令。\n\
  \n除非，所有这些信息都是为了另一个你定制的。\n\n结论：从斯诺登的错误中汲取教训。对任何公司的匿名声称保持保留态度。证据在于该公司或应用程序相关的逮捕数量。在\
  \ `Freenet` 的情况下……零。\n\n### Tor 隐藏服务 - 高风险，高回报\n\n`CNN` 一同 `FoxNews` 多年来一直在庆祝某些隐藏服务的击败。像\
  \ `Silk Road` 和 `Freedom Hosting` 这样的服务，我确定你听过。它们是 `FBI` 的容易目标，因为在 `Tor` 开发者的优先级列表中，隐藏服务并不靠前。`NSA`\
  \ 也是如此。\n\n这两个机构了解运行隐藏服务的所有技巧和黑客手段。你也应该如此。这并不是说你需要具备与他们的超级黑客团队匹配的专业知识，而是说运行这种服务比访问这种服务需要更多的警惕。\n\
  \n\n\n\n\n第一要原则非常简单：如果你运行一个，你就必须拥有一个。在一切可能的情况下，它们绝不能在他人的控制下运行，因为如果该服务被攻破，所有人都会完蛋。这意味着完全的匿名性，在\
  \ 100% 的时间内都拥有世界级的珠宝小盗般的隐身能力。\n\n丝之路（Silk Road）的管理员并没有这种能力。事实上，通过查看说明逮捕过程的在线文档，人们会觉得他在\
  \ IT 安全程序上非常疏懈。他反复犯的错误以至于执法部门的运气根本就没有派上用场。那家伙只是太粗心了。\n\n## 第一\n\n永远、永远、永远不要在由朋友或云服务提供商拥有的\
  \ `VM` 中运行隐藏服务。记住，所有的“云”本质上都是他人的硬盘或网络，而不是你自己的。加密密钥可以从 `RAM` 中转储。那么谁拥有 `RAM` 呢？\n\
  \n没错。云服务提供商。雷电一闪，你的匿名性以及如果你的访客在浏览器习惯上懒惰，他们的匿名性也会付之乌有。2013 年，FBI 就通过这种方式对未打补丁的 `Tor\
  \ Browser Bundles` 投放了“nit”（网络调查技术）。然而，如果你拥有这台机器，情况就是另一回事了。但让我们回退几步，假设你并不拥有。你该如何在宿主机系统上运行它呢？\n\
  \n首先，你需要两个来自不同方的独立物理主机，都运行在 `virtual machines` 中，并运行启用防火墙的操作系统，该系统只允许 `Tor` 网络活动而不允许任何其他活动。\n\
  \n第二个物理主机是运行隐藏服务的地方，同样使用了 `VM`。通过 `IPSec` 启用安全连接。你问什么是 `IPSec`？\n\n“IPSec 是一套协议簇，通过身份验证和加密通信会话中的每个\
  \ IP 数据包来保护互联网协议 (IP) 通信。`IPsec` 可用于保护两个主机之间（主机到主机）、两个安全网关之间（网络到网络）或或一个安全网关与一个主机之间（网络到主机）的数据流。”\n\
  \n如果入侵者代理篡改了任何内容，你都会知情并可以关闭服务或将其移动到更安全的地方，而这一切就像机器中的幽灵一样进行。你可以想象这在北朝鲜将有多大的价值。\n\n\
  如果你在那个像粪坑一样的国家，服务器即使掉线几秒钟，你也会比稍微偏执得多。但你可以将其移动到更安全的地方，甚至重新开始，而且你可能真的想这样做，因为你无法知道是发生了\
  \ `RAID failure`，还是某个共产主义者的皮靴正在将 `VM` 的副本发送给高层。\n\n## 第二\n\n如果选择宿主机路线，你必须确保通过主机随时都能随意地访问\
  \ `remote-console`。事实上，你必须通过远程完成所有操作，并通过 `https` 频繁更改密码。我会说每天一次，在北朝鲜那种气候下，保持这种偏执对你的健康有好处。\n\
  \n## 第三\n\n你绝不能、哪怕只有一次、从家里访问该服务。不要通过你的 `Nexus 7`。不要通过你女朋友的 `Galaxy Note`。甚至不要通过你家后院使用邻居的\
  \ `WiFi` 通过 `Tor` 访问。除非你自己在做什么，否则使用 `VPN` 也是有风险的。请通过至少距离你住处十英里的的安全位置访问它。有些人可能会说这是大材小用，但在古拉格（劳营）里没有大材小用这句话。\n\
  \n## 第四\n\n偶尔移动服务。再次，看看任何 YouTube 上关于狙击手如何训练消灭敌人的视频。他们在每次射击后都会变换位置，以向敌人隐藏真实位置。频率取决于你。每周一次？每月一次？我个人会是每二十一天一次。在运行这类服务时，你永远都不嫌不够安全。\n\
  \n## 匿名性的死亡\n\n首相戴卫·卡梅隆在 2015 年 1 月公开表示，如果政府无法获得解密加密后门密钥，他想要[取缔](http://gizmodo.com/uk-prime-minister-wants-to-ban-messaging-apps-without-b-1679184681)\
  \ 所有支持加密的聊天软件。这就像农夫允许山狮和狐狸轻易进入鸡舍。在竞选期间，他说：\n\n“我们要允许一种根本无法读取的通信手段吗？我对这个问题的回答是：不，我们不能。”\n\
  \n虽然他提到的主要是像 `WhatsApp` 之类的聊天程序，但你可以打赌他指的也是像 `PGP`、`Freenet` 以及已停止的 `Truecrypt`\
  \ 这样的应用。遗憾的是，他利用《周刊》（Hebdo）漫画袭击作为理由（难道他们不是都用这些来进一步推进大老大哥的议程吗？）。\n\n我看到加拿大在 `VPN`\
  \ 使用方面演变出类似的趋势。新法要求 `VPN` 识别下载电影和游戏等受版权保护作品的客户，以便侵权通知（即恐吓信）能送到正确的人手中。这听起来似乎很合理，因为谁会不否认乔治·卢卡斯制作更多《星大战》前传集的能力呢？那是艺术，你懂的。\n\
  \n但问题正出于此。主要是政治家忘记了互联网实际上是如何运作的。\n\n按照他们的意愿行事意味着 `VPN 提供商` 必须至少保留 6 个月的访问日志。单此一项就几乎保证了\
  \ `VPN 销售匿名服务（实际上是隐私）的能力将会消失，从而导致巨大的损失，因为客户并不愚蠢。他们知道隐私何时被针对。开始大逃离吧！（政府粉丝们）\n\n他们还知道\
  \ `VPN` 会为客户分配 `IP 地址`。这可能是你自己，穿着睡衣喝着茶，看着那个将烤炉开到最高温度的粪坑里的幽灵。\n\n唯一的解决方案是离开加拿大。\n\
  \n但也许，这正是政府一直想要的。\n\n最令人遗憾的不是这些无法阻止恐怖主义或版权侵权，不是它会损害加密业务，不是只有政治家拥有加密。不，最令人遗憾的是我们将成为那个将烤炉开到最高温度的粪坑里的幽灵，这一切仅仅是因为比你我某人说这是正确的。\n\
  \n我们的世界将变成反转世界。在那里对即是错，光即是暗，除了将建立的新矩阵，没人拥有安全。在那里更安全意味着更不安全，正如我们所……因为如果政府这么说，那就是福音真理。政治家上次撒谎是什么？\n\
  \n如果你什么都没学到，请记住两件事：后门在 100% 的情况下都是安全漏洞。第二点也是如此：匿名、隐私以及随之而来的自由只有在我们允许它才会死去。\n\n##\
  \ 结语\n\n正如你所见，权力机构正在针对你对自身自由的选择能力。他们采取小步策略。他们认为你是愚蠢的。他们认为他们可以比你更好地管理生活。事实上他们做不到。NSA\
  \ 阻止了对《周刊》漫画画家的袭击吗？他们阻止了 9/11 吗？阻止了西班牙的爆炸吗？这是一场千刀万杀，一点一点地，在你意识到之前，你会感到非常头晕，但并不知道为什么。\n\
  \n相信我，推迟你的安全和安心将足以引发他们一个细胞一个构建的那场癌症海啸。如果你读了这本书，你已经采取了所有需要的小步。你已经把大脚趾伸进了那个漩涡，现在是时候跳进去了。不要拖延。你清楚水有多暖。等太久了，水可能会变冷。更糟糕的是，有人可能会直接把你锁在外面。\n\
  \n\n\n\n记住：始终要保持强大的安全意识。培养逻辑化配置事物的能力，并尽早预判故障，在水流奔涌而入之前就发现潜水艇的漏洞。如果你对此深有怀疑，可以看看电影《深渊》（The\
  \ Abyss）。看看水流奔涌而入时 Bud 是如何反应的？他恐慌失措！大多数船员都死了。不要等到那个命运的时刻。要尽早做好准备。B 计划。C 计划。如果你负担得起，甚至可以有一个\
  \ D 计划。\n\n任何情报机构都有无限的资金，通过审查我们所有人来剥夺自由——甚至是审查你购买心仪物品的自由。有了媒体的听命，他们可以幻化出任何他们想要的“怪物”来欺压你。他们对你撒谎并不违法，但你对他们撒谎却是违法的。这种双重标准对他们来说毫无代价，却会让你付出一切。所以，像他们一样，你必须紧跟安全领域的变化，必要时及时更新，并对新的\
  \ `zero-day` 威胁保持持续警惕。\n\n但如果说你拥有一件他们没有的东西，那就是比他们更努力工作的动力。他们每天下午 `5pm` 就下班。你呢？权势者玩阴招，你也应该如此。\n\
  \n## 想了解更多吗？\n\n首先，对于你下载这本书，向你表示诚挚的感谢并敬你喝杯啤酒。你可以从这个主题的几十本优秀书籍中挑选任何一本，但你选择了我的书。对此我非常感谢。说真的，读到最后需要强大的意志。如果你喜欢所读的内容，我需要你的帮助！请花一点时间给这本书留个评价，这样其他人就能学习如何使用\
  \ `Tor` 和 `Freenet`，并且……嗯，保护好自己。\n\n说到保护，我使用了很多工具才走到今天的这一步，而书中一些未能通过审查的话题，却奇迹般地出现在我的其他书里。你说奇不不妙。\n\
  \n但有一点：当你拥的不有一颗而是两三颗“银弹子”来击败狼人时，你对周围游荡的其他任何类狼人保持隐形的几率就越大。请注意，我对于患有 `Lycanthropy`（狼人病）的人并没有偏见，因为这绝非玩笑。但羊群心理也同样如此。\n\
  \n所以吧。不要总是使用所有人都在使用的工具。尝试一下我的其他一些没在这个版本中面世的作品，来玩点花样：\n\n### 你可能喜欢的其他书籍：\n\n- [一次性手机与黑市](https://www.amazon.com/dp/B01EU9A92K)\n\
  - [暗网：匿名入门指南](https://www.amazon.com/dp/B008AP8TAK)\n- [隐形工具包](https://www.amazon.com/dp/B014OMZ1N0)\n\
  - [Tor 与深网](https://www.amazon.com/dp/B075MBL4L2)\n- [3 合 1 暗网超级包](https://www.amazon.com/dp/B06VY1MWMP)\n\
  - [Usenet：终极指南](https://www.amazon.com/dp/B0098DWUQW)\n\n### 即将推出：\n\n- 暗黑 Linux\
  \ (Dark Linux)\n- 网络犯罪超级反派 (Cybercrime Supervillains)\n"
