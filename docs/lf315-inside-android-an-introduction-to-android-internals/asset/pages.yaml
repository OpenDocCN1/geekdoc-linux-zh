  md: '# Lab 1


    ### Exercise 1.1 Copy files


    Objective: get a copy of the repository from the Android Open Source Project.
    There is a lot of code, so we start copying now so that it will be ready for the
    first "real lab" after the next session. The version of Android being used here
    is Jelly Bean 4.1.2_r1. To save time downloading it (all 12 GiB) the instructor
    will give you a copy on a USB flash drive or similar.


    It doesn''t really matter where the files are copied to, but the notes assume
    that they are in $HOME/embedded-android. If you put them elsewhere, make sure
    to adjust the paths used later on in the course accordingly.


    Insert the flash drive. It should auto mount to /media/lf315


    ```

    $ mkdir ~//embedded-android

    $ cd ~/embedded-android

    $ cp -a /media/lf315/resources .

    $ tar xf /media/lf315/aosp/android-4.1.2_r1.tar.bz2

    ```


    The un-tar command will take about half an hour.'
