  md: '# Features of the Binder


    +   - No memory leaks: reference counting and "death notification" take care of
    that

    - "Thread migration" and automatic management of thread pools

    - Synchronous and asynchronous (one-way) invocation

    - Identify sender by UID and PID

    - Can send file descriptors from one process to another

    - Define interfaces using Android Interface Definition Language (AIDL)

    - Local execution mode (no IPC/data marshaling) if the client and service are
    in the same process


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_322_0.png)'
  merge: -1
