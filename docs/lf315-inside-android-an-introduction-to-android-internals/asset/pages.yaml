  md: "# Session 2 Introduction to Android\n\n> Challenges\n* Android is monolithic\n\
    \  * Services within the framework are inter-dependent\n  * Removing or modifying\
    \ one is likely to cause others to fail\n* Not easy to add other open source packages\n\
    \  * The run-time libc (Bionic) is not fully POSIX compatible\n  * File layout\
    \ does not conform to the Linux Filesystem Hierarchy Specification (FHS)\n* Wired\
    \ network interfaces are not supported by the framework\n  * No implementation\
    \ of ConnectivityManager or ConnectivityService\n  * Means Java applications cannot\
    \ use Ethernet\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_26_0.png)"
  merge: -1
  pgno: 26
- img_proc: true
  md: "# Headless Android\n\n+   - Headless Android = Android without a display\n\
    - Why?\n  - Common OS across a range of products, some with UI and some without\n\
    \  - Reduced boot time, code size, memory usage, power requirement\n- How?\n \
    \ - Leave out the display portions of the framework:\n  - SurfaceFlinger, WindowManager,\
    \ WallpaperService, InputManager\n  - For more information, see http://www.cyborgstack.org/\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_27_0.png)"
  merge: -1
