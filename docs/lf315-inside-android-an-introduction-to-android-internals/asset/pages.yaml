  md: '# Lab 10


    **Exercise 10.1** Prepare the SD card


    Objective: Format the microSD card for use with Android. You only need to do this
    once.


    The first thing is to find out which device the SD card reader shows up as. *It
    is vitally important to get this right otherwise you may end up formatting the
    hard drive, which will please noone*


    Take a note of the sd* nodes you have in /dev at the moment. You will see something
    like this:


    ```

    $ ls /dev/sd*

    /dev/sda /dev/sda1 /dev/sda2 /dev/sda5

    ```


    Insert the SD card into the reader and find out which new nodes have been created:


    ```

    $ ls /dev/sd*

    /dev/sda /dev/sda1 /dev/sda2 /dev/sda5 /dev/sdb /dev/sdb1

    ```


    That shows that in this case the SD card is /dev/sdb and that it has one partition,
    /dev/sdb1'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# Session 10 Starting up


    Unmount all partitions on the SD card


    ```

    $ sudo umount /dev/sdx1

    $ sudo umount /dev/sdx2

    etc...

    ```


    Run `fdisk /dev/sdx`


    +   - Type `p` (print). The first line includes the size: Disk /dev/sdb: 3965
    MB. If it is 100''s of GB, then you have your hard disk, not the SD card. Start
    again

    - Delete all existing partitions (command ''d'')

    - Create a new `primary` partition number 1, default first sector and last sector
    +64M (command ''n'').

    - Set the partition id (command ''t'') to ''c'' (W95 FAT32 (LBA))

    - Mark it bootable (command ''a'')

    - Create three more primary partitions for system, user data and cache, using
    the sizes you specified in the BoardConfig.mk file. Leave the system-id at the
    default value, 83


    Check that your partition table is the same as the one in the solution before
    continuing.'
