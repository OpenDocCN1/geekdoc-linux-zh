  md: "# Key layout files\n\n+   - Linux scan codes are translated into Android key\
    \ codes using key layout (.kl) files\n- The format is:\n  - key <scancode> <keycode>\
    \ [flags]\n  - scancode is the Linux key code\n  - keycode is the Android key\
    \ name\n  - flags optional policy flags, separated by spaces\n  - Example (from\
    \ Galaxy Nexus, tuna-gpio-keypad.kl)\n\n```\nkey 114 VOLUME_DOWN WAKE\nkey 115\
    \ VOLUME_UP WAKE\nkey 116 POWER WAKE\n```\n\nLinux key codes are defined in include/linux/input.h\n\
    \nAndroid key names are defined in android.view.KeyEvent. Note that the names\
    \ in the key layout file have been stripped of the KEYCODE_ prefix."
  merge: -1
