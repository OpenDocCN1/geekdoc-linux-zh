  md: "# LF315 Inside Android: an Introduction to Android Internals\n\n# Events\n\n\
    +   - Each event is described by a 16-byte input_event\n\n```\nstruct input_event\
    \ {\n    struct timeval time;\n    __u16 type;\n    __u16 code;\n    __s32 value;\n\
    }\n```\n\n+   - time: timestamp\n- type: type of event, e.g. key press, mouse\
    \ movement\n- code: dependant on type, e.g. for keyboard, code = keycode\n- value:\
    \ dependant on the type, e.g. for keyboard 1 for press,\n- 0 for release\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_411_0.png)\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_411_1.png)\n\nCopyright © 2013 Linux\
    \ Foundation. All rights reserved. DO NOT DISTRIBUTE."
  merge: -1
