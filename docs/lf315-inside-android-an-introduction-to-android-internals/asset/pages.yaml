    \ combinations of Android key codes with modifiers to Unicode characters\n- There\
    \ should be one for each internal keyboard\n- Begins with type <type declaration>\n\
    - Where <type declaration> is one of\n  - FULL: A full PC-style keyboard\n  -\
    \ ALPHA: A keyboard with just alphanumeric keys but few (no) others\n  - NUMERIC:\
    \ A numeric (12-key) keyboard\n  - PREDICTIVE: A keyboard with all the letters,\
    \ but with more than one letter per key\n  - SPECIAL_FUNCTION: system control\
    \ functions rather than for typing\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_419_0.png)"
