  md: "# Event types\n\n+   * Keyboard\n    * type = EV_KEY\n    * code = keycode,\
    \ as deined in include/uapi/linux/input/\n    * value = 1 (keydown) 0 (keyup)\n\
    * Mouse\n    * type = EV_REL\n    * code = REL_X or REL_Y\n    * value = X or\
    \ Y coordinate\n* Touchscreen\n    * type = EV_ABS\n    * code = ABS_X, ABS_Y,\
    \ ABS_Z (pressure)\n    * value = X, Y or Z coordinate\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_412_0.png)"
