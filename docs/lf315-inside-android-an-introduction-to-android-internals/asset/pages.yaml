    380 2013-03-24 11:33 META-INF/CERT.SF

    776 2013-03-24 11:33 META-INF/CERT.RSA


    7231 7 files

    ```


    The .apk format is based on the JAR file format


    resources.arsc contains compiled resources

    classes.dex is an archive of the Dalvik executablesnThe META-INF directory is
    defined by the JAR format:

    MANIFEST: the list of resources and SHA-1 digest

    CERT.SF: duplicates MANIFEST.MF

    CERT.RSA: the certificate of the application'
