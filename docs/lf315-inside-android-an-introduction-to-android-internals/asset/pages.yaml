  md: '# Application life cycle


    Once an application has been started it will continue to exist until


    +   - system resources reach a low threshold and the out-of-memory killer kills
    it

    - explicitly killed by the user

    - Settings->Applications->Manage Applications Force Stop

    - the device is powered off


