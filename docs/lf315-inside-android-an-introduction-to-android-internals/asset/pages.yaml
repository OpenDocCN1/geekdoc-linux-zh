  md: "# Low memory handling\n\n+   - In Android, low memory is a normal fact of life\n\
    \  - Whereas in most implementations of Linux low memory is unusual and seldom\
    \ handled gracefully\n- Android applications are present in memory even after\
    \ onDestroy()\n- The low memory handler is responsible for killing applications\
    \ that are no longer needed\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_440_0.png)"
  merge: -1
  pgno: 440
- img_proc: true
  md: '# LF315 Inside Android: an Introduction to Android Internals


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_441_0.png)


    +   - Each process has the parameter oom_adj

    - The range of values are -16 to +15

    - When memory is low, the low memory driver will send SIGKILL to processes with
    a high oom_adj

    - oom_adj is visible as /proc/<pid>/oom_adj'
  merge: -1
  pgno: 441
- img_proc: true
  md: '# ActivityManager and oom_adj


    +   - The value of oom_adj changes as the components of an application go through
    the life-cycle


    +   - The levels are defined as


    ```

    FOREGROUND_APP_ADJ 0

    VISIBLE_APP_ADJ 1

    PERCEPTIBLE_APP_ADJ 2

    HEAVY_WEIGHT_APP_ADJ 3

    SECONDARY_SERVER_ADJ 4

    BACKUP_APP_ADJ 5

    HOME_APP_ADJ 6

    HIDDEN_APP_MIN_ADJ 7

    EMPTY_APP_ADJ 15

    ```


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_442_0.png)


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_442_1.png)


