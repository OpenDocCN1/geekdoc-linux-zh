  md: '# Callbacks


    +   - onCreate() activity first started: set up global state

    - onRestart() activity that was in the stopped state has become visible

    - onStart() some or all of the activity is visible

    - onResume() this is the foreground activity

    - onPause() no longer the foreground activity, e.g. dialog has popped up or the
    device is about to go to sleep

    - onStop() no part is visible any more

    - onDestroy() release any resources claimed in onCreate


