- img_proc: true
  md: '# Binder driver


    +   - The lowest level component

    - Holds all of the state of Binder

    - Tracks Binder connections

    - Sends out death notifications

    - Implemented as a simple character driver: /dev/binder

    - Most of the work is done by ioctl functions


    The source is in mainline Linux since 3.2 in

    drivers/staging/android/binder.c

    drivers/staging/android/binder.h'
