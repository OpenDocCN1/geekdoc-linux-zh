  md: "# Session 9 The Android kernel\n\n# Wake locks\n\n+   - Desktop/laptop operating\
    \ systems suspend on user demand (e.g. when closing the lid of a laptop)\n- Hand-held\
    \ devices need to be more aggressive and suspend after a short period of inactivity\n\
    - But, both applications and kernel drivers need to prevent suspending in some\
    \ cases\n  - While an application is playing music or video\n  - While a driver\
    \ is a critical state\n- To prevent opportunistic suspend, applications and drivers\
    \ can take a wakelock\n  - Suspend is not allowed while one or more wakelocks\
    \ are locked\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_216_0.png)\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_216_1.png)"
  merge: -1
  pgno: 216
- img_proc: true
