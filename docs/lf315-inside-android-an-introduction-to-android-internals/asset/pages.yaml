  md: "# Multitouch events\n\n+   - A multitouch event is reported by\n  - EV_ABS,\
    \ ABS_MT_TRACKING_ID, value = unique ID for this contact\n- Then one or more\n\
    \  - EV_ABS, ABS_MT_PRESSURE, value\n  - EV_ABS, ABS_MT_POSITION_X, value\n  -\
    \ EV_ABS, ABS_MT_POSITION_Y, value\n  - EV_SYN, SYN_REPORT\n- Terminated by\n\
    \  - EV_ABS, ABS_MT_TRACKING_ID, value = 0ffff\n  - EV_SYN, SYN_REPORT"
