  md: '# Kernel wake locks


    +   - Some kernel drivers need to prevent the system going into suspend mode at
    critical times

    - The kernel API is


    ```

    #include <linux/wakelock.h>

    wake_lock_init(struct wakelock *lock, int type,

    const char *name);


    void wake_lock(struct wake_lock *lock);

    void wake_unlock(struct wake_lock *lock);


    void wake_lock_timeout(struct wake_lock *lock,

    long timeout);

    ```


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_446_0.png)'
  merge: -1
  pgno: 446
- img_proc: true
  md: "# Issue caused by wake locks\n\n+   - Wake locks are very intrusive in kernel\
    \ code\n  - One of the largest components in any Android kernel patch\n- Many\
    \ drivers and subsystems have to acquire wake locks to operate correctly\n  -\
    \ rtc alarms, input devices, mmc devices, wifi devices"
  merge: -1
  pgno: 447
- img_proc: true
  md: '# Application wakes locks


    The wakelock driver can be controlled from user space by two files:


    +   * /sys/power/wake_lock - writing a string to this file creates a wakelock
    with that name

    * /sys/power/wake_unlock - writing the same string to this file releases the wakelock


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_448_0.png)


    Hence a simple way to prevent the system sleeping while debugging is to create
    a wakelock:

    echo testwakelock > /sys/power/wake_lock'
  merge: -1
  pgno: 448
- img_proc: true
  md: "# Powermanager and wake locks\n\n+   - The Powermanager service provides a\
    \ higher level API to the wakelock mechanism\n- Adds a parameter which sets the\
    \ screen and keyboard backlight level\n- The procedure is\n  - Acquire handle\
    \ to the PowerManager service\n  - Create a wake lock and specify the power management\
    \ flags for screen, timeout, etc.\n  - Acquire wake lock\n  - Perform operation\
    \ without sleeping (e.g. play music file)\n  - Release wake lock\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_449_0.png)"
  merge: -1
  pgno: 449
- img_proc: true
  md: '# Types of Powermanager wake lock


    | Type | CPU | screen | kbd |

    |---|---|---||}{

    | PARTIAL_WAKE_LOCK | on | off | off |

    | SCREEN_DIM_WAKE_LOCK | on | dim | off |

    | SCREEN_BRIGHT_WAKE_LOCK | on | bright | off |

    | FULL_WAKE_LOCK | on | bright | on |


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_450_0.png)


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_450_1.png)'
  merge: -1
