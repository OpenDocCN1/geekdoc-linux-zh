  md: '# Build targets


    +   - Targets include


    | Target | Description |

    | BUILD_EXECUTABLE | executable to run on the target |

    | BUILD_SHARED_LIBRARY | shared library for the target |

    | BUILD_STATIC_LIBRARY | static library for the target |

    | BUILD_PREBUILT | prebuilt binary blob |

    | BUILD_HOST_EXECUTABLE | executable to run on the host |

    | BUILD_HOST_SHARED_LIBRARY | shared library for the host |

    | BUILD_HOST_STATIC_LIBRARY | static library for the host |

    | BUILD_PACKAGE | Android package (.apk file) |'
