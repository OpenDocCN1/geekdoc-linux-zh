    +   Applications are packaged into .apk format

    - A zipped archive


    ```

    $ unzip -l bin/HelloWorld-debug.apk

    Archive: bin/HelloWorld-debug.apk

    Length Date Time Name

    ------------------------------------------------------

    708 2013-03-24 11:33 res/layout/main.xml

    1316 2013-03-24 11:33 AndroidManifest.xml

    776 2013-03-24 11:33 resources.arsc

    2948 2013-03-24 11:33 classes.dex

