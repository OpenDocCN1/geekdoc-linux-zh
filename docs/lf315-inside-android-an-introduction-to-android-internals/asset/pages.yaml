  md: '# Booting the old way


    +   - The bootloader is in NOR flash at known vector

    - Early boot sets up SDRAM and relocates to RAM

    - Main boot code runs in RAM


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_229_0.png)


    Since NOR flash memory can be accessed byte by byte it can be mapped into the
    processor address space and so can execute code immediately power is applied.'
  merge: -1
