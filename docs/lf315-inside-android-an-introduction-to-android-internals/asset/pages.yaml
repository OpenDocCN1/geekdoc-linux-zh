  md: '# Android input layers


    +   - From the bottom up...

    - Linux evdev drivers generate events and pass them up to to...

    - EventHub reads events from all drivers and passes them up to...

    - InputReader decodes the events and translates them into Android events

    - InputDispatcher sends events to the appropriate window


    The code for the Android components is in


    EventHub: frameworks/base/services/input/EventHub.cpp

    InputReader: frameworks/base/services/input/InputReader.cpp

    InputDispatcher: frameworks/base/services/input/InputDispatcher.cpp'
