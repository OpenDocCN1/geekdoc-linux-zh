  md: "# Authentication using Binder handles\n\n+   - The authenticity of a Binder\
    \ message is known because it is validated by the binder driver\n  - The message\
    \ is represented by a token which cannot be spoofed\n- The UID and PID of the\
    \ sender is part of the message header\n- The Package Manager has a list of application\
    \ names and UIDs\n- Hence it is possible for a server to verify if a client has\
    \ permission to access a given function within the server\n\n```\nint Binder.getCallingUid();\n\
    int Binder.getCallingPid();\nint Context.checkPermission(String permission,\n\
    int pid, int uid);\n```"
