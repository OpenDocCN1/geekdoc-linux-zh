  md: '# Death notification


    +   * Binder objects have an observer list

    * A local object can request to be informed when another (remote) object is terminated

    * Typically it is used so a callback is sent to server when client dies

    * Allows to reclaim resources

    * Essential to Binder and Android where process may be killed due to low memory


