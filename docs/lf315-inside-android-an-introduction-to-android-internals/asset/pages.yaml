  md: '# Session 18 Resource management


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_452_0.png)


    +   - You must remember to release the wakelock when the activity is pushed into
    the background (i.e. in onDestroy)

    - The wakelock is released if the application is killed (e.g. on low memory)'
