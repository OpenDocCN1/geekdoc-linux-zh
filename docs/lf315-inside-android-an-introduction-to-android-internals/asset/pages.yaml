  md: "# Session 2 Introduction to Android\n\n21\n\n# Note on API levels\n\n+   **API\
    \ level** refers to the Android framework API (Java and xml)\n  - API levels are\
    \ backward compatible: an application written to API level 10 will work on all\
    \ later levels\n**NDK level** is the NDK version number\n  - i.e. defines the\
    \ C/C++ API offered by the NDK\n  - NDK versions are likewise backwards compatible\n\
    \  - For more details, see ndk/docs/STABLE-APIS.html\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_30_0.png)"
