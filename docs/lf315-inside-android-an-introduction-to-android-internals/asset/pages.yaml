  md: "# The lowmmemory kernel driver\n\n+   - Improves reaction to low memory situations\n\
    \  - Better than the conventional \"Out-Of-Memory killer\" which does not become\
    \ active until too late\n- lowmmemory driver has multiple thresholds based on\
    \ oom_adj parameter of each process\n  - Look in /sys/module/lowmmemorykiller/parameters\n\
    - Sends a SIGKILL to all processes that fall under the threshold"
  merge: -1
  pgno: 443
- img_proc: true
  md: '# Session 18 Resource management


    # Typical parameters


    This table shows typical thresholds in pages and MiB and the corresponding minimum
    oom_adj value to escape the low memory killer


    | Pages | MiB | oom_adj |

    | 2048 | 8 | 0 |

    | 3072 | 12 | 1 |

    | 4096 | 16 | 2 |

    | 6144 | 24 | 4 |

    | 7168 | 28 | 7 |

    | 8192 | 32 | 15 |


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_444_0.png)


    They are configured in frameworks/base/services/java/com/server/am/ProcessList.java
    in function `updateOomLevels()` and are adjusted for different target types based
    on screen size.'
  merge: -1
