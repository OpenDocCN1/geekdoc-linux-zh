    # Lab 14


    Exercise 14.1 GPIO


    Look in directory /sys/class/gpio on the Beaglebone. Note that there are 4 gpio
    chips, each with 32 pins.


    The datasheet for the Beaglebone is in $HOME/embedded-android/datasheets/BONE_SRM.pdf.
    Look at the section on user LEDs, page 44. Note the gpio numbers of the four LEDs.


    They are written in the form GPIO[chip number]_[gpio pin on that chip], so you
    will have to convert them from this form the sequential gpio number that Linux
    works with.


    You can write to the files in /sys/class/gpio using the echo command, e. g echo
    NN > /sys/class/gpio/export


