  md: "# The Android Open Source Project\n\n+   * The source code and build tools\
    \ are released by Google as the AOSP\n* http://source.android.com/\n* New versions\
    \ of Android are developed \"behind closed doors\" by members of the OHA\n* The\
    \ code is added to the AOSP repositories some time after internal release\n  *\
    \ Usually after a few weeks\n  * Sometimes not at all, as with Honeycomb\n\nThe\
    \ AOSP does not include the source code for the Linux kernel nor bootloader. You\
    \ must obtain and adapt these components ourselves. We will talk about both in\
    \ later chapters.\nThe reason for not releasing the Honeycomb source was that\
    \ it was in a state of flux, being the first time Android had run on tablet hardware.\
    \ The Android developers did not want others to base products on in until both\
    \ tablet and phone could be supported in a single codebase."
