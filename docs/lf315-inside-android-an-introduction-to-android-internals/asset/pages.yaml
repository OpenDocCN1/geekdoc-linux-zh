  md: "# Session 5 Native code\n\n# Uses of native code\n\n+   * \"Native code\" means\
    \ code written in C and C++\n* Components of Android written in native code include\n\
    \    * Daemons, e.g. rild, netd and init\n    * Tools, e.g. shell, netcfg\n  \
    \  * Lower parts of the Android framework\n    * \"Native methods\" of applications\
