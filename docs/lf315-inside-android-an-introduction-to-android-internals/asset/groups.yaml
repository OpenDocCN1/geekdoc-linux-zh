- md: "\n## Session 2 Introduction to Android\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_38_0.png)\n\
    \n## LF315 Inside Android: an Introduction to Android Internals\n\n## Branches\n\
    \n- For the Google repository, the branch name can be:\n- Default (no -b): \"\
    master\"\n- A release name, e.g. froyo, gingerbread\n- A release number, e.g.\
    \ android-2.3_r1, android-4.0.1_r1\n- See http://source.android.com/source/build-numbers.html\
    \ for a table of branch names and Android versions\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_39_0.png)\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_39_1.png)\n\nCopyright © 2013 The Linux\
    \ Foundation. All rights reserved.\n\n## Session 2 Introduction to Android\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_40_0.png)\n\nAs of April 2013, repo requires\
    \ git version 1.7.2 or later, which means that if you are using Ubuntu 10.04 as\
    \ recommended by the Android developers you will have to upgrade git:\n\n```\n\
    $ sudo add-apt-repository ppa:git-core/ppa\n$ sudo apt-get update\n$ sudo apt-get\
    \ install git\n```\n\n## LF315 Inside Android: an Introduction to Android Internals\n\
    \n## Switching between branches\n\n- To switch between branches, just\n\n```bash\n\
    $ repo init -b <otherbranch>\n$ repo sync\n```\n\n## Session 2 Introduction to\
    \ Android\n\n## Help with repo\n\n- Help from repo itself\n```\n$ repo help\n\
    $ repo help <command>\n```\n\n- There is a lot of useful information at\nhttp://source.android.com/source/using-repo.html\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_42_0.png)\n\n## Top level repo directories\
    \ (1)\n\n- bionic: the bionic C library\n- bootable: bootloader and fastboot protocol\n\
    - build: the build system\n- cts: compatibility test suite\n- dalvik: the Dalvik\
    \ virtual machine\n- development: development tools\n- device: configurations\
    \ for various devices\n- docs: scripts and templates to generate all the Android\
    \ documentation\n- external: third-party code, mostly OSS\n\nTo build the documentation\
    \ in docs/, change into that directory and run the build script:\n\n```bash\n\
    $ cd docs\n$ python scripts/build.py\n```\n\nThis generates the directory ./out,\
    \ which is the fully built site.\nThere is even a http server in scripts/micro-httpd.py\
    \ which is helpful for testing the site on your own machine.\n\n```bash\n$ cd\
    \ /out\n$ HTTP_PORT=8080 python ../scripts/micro-httpd.py\n```\n\n## Session 2\
    \ Introduction to Android\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_44_0.png)\n\
    \n## Beginning the build\n\n- Begin by sourcing build/envsetup.sh to set the correct\
    \ shell environment\n\n```bash\n$ build/envsetup.sh\n```\n\n- envsetup.sh includes\
    \ several useful commands, including\n- hmm: Help text\n- croot: Changes directory\
    \ to the top of the tree\n- m: Makes from the top of the tree\n- mm: Builds all\
    \ of the modules in the current directory\n- mmm: Builds all of the modules in\
    \ the supplied directories\n- cgrep: Greps all local C/C++ files\n- jgrep: Greps\
    \ all local Java files\n- godir: Go to the directory containing a file\n\n## Session\
    \ 2 Introduction to Android\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_46_0.png)\n\
    \n- Part of envsetup.sh is the *lunch* command\n- Selects target platform and\
    \ build type\n- Platforms are defined in directory device/\n    - we will look\
    \ at this builder later\n    - The default emulator build is called \"full\" in\
    \ ICS (used to be \"generic\")\n- Build type is one of\n\n| type | description\
    \ |\n| :--- | :--- |\n| user | limited access; suited for production |\n| userdebug\
    \ | like \"user\" but with root access, suitable for debugging |\n| eng | development\
    \ configuration with additional debugging tools |\n\n## 38 LF315 Inside Android:\
    \ an Introduction to Android Internals\n\n- AOSP provides pre-built GNU toolchains\
    \ in prebuilds/gcc\n  envsetup.sh records the paths in these shell variables\n\
    - $ANDROID_TOOLCHAIN: current toolchain\n- $ANDROID_EABI_TOOLCHAIN: current ARM\
    \ toolchain (same as $ANDROID_TOOLCHAIN)\n- $ARM_EABI_TOOLCHAIN: bare metal toolchain,\
    \ suitable for compiling the kernel and bootloader\n\n- To use an external toolchain\
    \ set TARGET_TOOLS_PREFIX before running make\n- TARGET_TOOLS_PREFIX=<path to\
    \ toolchain>/bin/<toolchain prefix>\n- Example\n\n```bash\nTARGET_TOOLS_PREFIX=/opt/bin/arm-angstrom-linux-gnueabi-\n\
    ```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_47_0.png)\n\n## Running the build\n\
    \n- Simply run make or the alias m\n- To take advantage of multiple CPUs, add\
    \ -jN where N is the number of CPUs plus two\n- For example on a quad core machine\n\
    ```bash\nmake -j6\n```\n- Expect the build to take an hour or two\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_48_0.png)\n\
    \n## The end result\n\n- All intermediate and binary files are put in directory\
    \ out/\n- Host executables are put in out/host/linux-x86/bin/\n  - adb, emulator\
    \ which we will look at in the next session\n  - Utilities used during the build\n\
    - Target files are put in out/target/product/[device name]\n  - In the case of\
    \ the emulator \"product name\" is \"full\" but the device name is \"generic\"\
    \n  - (see build/target/product/full.mk)\n\n## Session 2 Introduction to Android\n\
    \n### Summary\n- Android is an open source mobile operating system based on Linux\n\
    - The source code is made publicly available shortly after each development cycle\n\
    - Open source means that you can adapt it in any way you want\n- There is a lot\
    \ of source code, so expect the builds to take a while\n- The code repository\
    \ is multiple git trees\n- The repo tool makes it easy to sync the correct git\
    \ trees for each Android release\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_50_0.png)\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_50_1.png)\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_50_2.png)\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_50_3.png)\n\n## Lab 2\n\n### Exercise\
    \ 2.1 Install Java\nAndroid build require a 64-bit Java, which you can download\
    \ from java.com. But in this case you will install it from\n\n```bash\n$ cd ~/embedded-aosp\n\
    $ build/envsetup.sh\n$ lunch\n```\n\nSelect the first option, eng. Which ARM toolchain\
    \ are you using? Check $ANDROID_TOOLCHAIN\n\n### Exercise 2.2 Build the Android\n\
    Objective: to build the emulator. Following the first lab you should have ~/embedded-aosp\
