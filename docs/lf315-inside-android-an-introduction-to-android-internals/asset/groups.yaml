    \n## Digression - GPIO\n\n- To complete the lab you will need to understand how\
    \ to access GPIO pins from an application\n- GPIO = General Purpose Input/Output\n\
    - Usually each pin can be configured as an input or an output\n- Typical uses\n\
    \  - As outputs: to control LEDs, relays and motors\n  - As inputs: to read the\
    \ input state of push buttons and switches\n\n# LF315 Inside Android: an Introduction\
    \ to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_379_0.png)\n\
    \n- An embedded device may have GPIO pins from several different places\n- Most\
    \ SoCs have dozens of GPIO pins\n  - usually in banks of 16 or 32\n- Power management\
    \ chips (pmic) usually have some GPIO pins\n- FPGAs are often configured to provide\
    \ GPIO\n- There are Dedicated GPIO chips that can be connected to i2c or SPI buses\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_379_1.png)\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_379_2.png)\n\
    \nCopyright © 2013 Linux Foundation. All rights reserved. DO NOT DISTRIBUTE.\n\
    \n## Linux \"gpiolib\"\n\n- All the diversity is handled by the GPIO sub-system\
    \ in the kernel called \"gpiolib\"\n  - (it's not actually a library)\n- gpiolib\
    \ provides\n  - kernel interfaces for registering GPIO chips\n  - kernel interfaces\
    \ for other kernel code to configure and use GPIO pins\n  - a set of files in\
    \ /sys/class/gpio that user-space applications can use\n\n# LF315 Inside Android:\
    \ an Introduction to Android Internals\n\n## /sys/class/gpio\n\n- Each GPIO pin\
    \ is given a GPIO number\n- GPIO numbers generally start from 0 (pin 0 on chip\
    \ 0) and up to the last pin on the last chip\n  - (There may be gaps in the range\
    \ of numbers, and the first pin does not have to be numbered 0)\n\n```bash\n#\
    \ /sys/class/gpio/\nexport gpiochip0 gpiochip32 gpiochip64 gpiochip96\n```\n\n\
    This device has 4 gpiochip chips each with 32 pins\n\nWrite to this file to export\
    \ a GPIO pin to user space\n\nWrite to this file to unexport a GPIO pin to user\
    \ space\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_381_0.png)\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_381_1.png)\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_381_2.png)\n\nCopyright © 2013 Linux\
    \ Foundation. All rights reserved. DO NOT DISTRIBUTE.\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_381_3.png)\n\
    \n## The gpiochip\n\n- Each chip is represented by a directory containing these\
    \ files:\n\n```\n# /sys/class/gpio/gpiochip0\nbase device label ngpio power subsystem\
    \ uevent\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_382_0.png)\n\n## Exporting\
    \ a pin\n\nTo export a pin from the kernel to user space write the GPIO number\
    \ to /sys/class/gpio/export\n\n```bash\n# echo 42 > /sys/class/gpio/export\n#\
    \ ls /sys/class/gpio\nexport gpio42 gpiochip16 gpiochip32 gpiochip64 gpiochip96\
    \ unexport\n```\n\nIf the export is successful a new directory is created\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_383_0.png)\n\n## Session 14 Android's\
    \ hardware abstraction layer\n\n### Inputs and outputs\n\n```\n# is /sys/class/gpio/gpio42\n\
    active_low device direction edge power subsystem event value\n```\n\nSet to 1\
    \ to invert input and output\n\nSet direction by writing \"out\" or \"in\". Default\
    \ \"in\"\n\nThe logic level of the pin. Change the level of outputs by writing\
    \ \"0\" or \"1\"\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_384_0.png)\n\nCopyright\
