- md: "\n## Session 11 Adding new packages\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_272_0.png)\n\
    \n## LF315 Inside Android: an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_273_0.png)\n\
    \n- When starting a build, make will recursively discover all directories marked\
    \ call `all-makefiles-under`\n- It looks for Android.mk in each directory\n- Reads\
    \ the LOCAL_MODULE name and builds a list of modules\n- Resolves modules against\
    \ PRODUCT_PACKAGES defined in device.mk (including those inherited)\n- Builds\
    \ all necessary modules\n\n## Session 11 Adding new packages\n\n```makefile\n\
    Android.mk\n\nHere is a simple example, from external/ping/Android.mk\n\nLOCAL_PATH:=\
    \ $(call my-dir)\ninclude $(CLEAR_VARS)\nLOCAL_SRC_FILES := ping.c\nLOCAL_MODULE\
    \ := ping\nLOCAL_STATIC_LIBRARIES := libcutils libc\nLOCAL_MODULE_TAGS := optional\n\
    include $(BUILD_EXECUTABLE)\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_274_0.png)\n\
    \nCopyright © 2013 The Linux Foundation. All rights reserved.\n\n## Android.mk\n\
    \n- LOCAL_PATH is almost always $(call my-dir)\n- include $(CLEAR_VARS) is always\
    \ needed\n- LOCAL_SRC_FILES contains a list of source files\n- LOCAL_MODULE give\
    \ the module name\n- LOCAL_STATIC_LIBRARIES lists libraries to link staticially,\
    \ if any\n- include $(BUILD_EXECUTABLE) says to build an executable\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_275_0.png)\n\
    \n## Module tags\n\n- LOCAL_MODULE_TAGS says which set of modules this belongs\
    \ to\n- Possible values\n  - optional only built if referenced by device.mk (as\
    \ described earlier)\n  - eng, tests, samples built in an eng build\n  - debug\
    \ built in eng and userdebug builds\n- The preferred (and simplest) is to use\
    \ optional\n- If you want a module included in all builds, TAG it as optional\
    \ and add it to the PRODUCT_PACKAGES section of build/target/product/core.mk\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_276_0.png)\n\n## Build targets\n\n\
    | Target | Description |\n| :--- | :--- |\n| BUILD_EXECUTABLE | executable to\
    \ run on the target |\n| BUILD_SHARED_LIBRARY | shared library for the target\
    \ |\n| BUILD_STATIC_LIBRARY | static library for the target |\n| BUILD_PREBUILT\
    \ | prebuilt binary blob |\n| BUILD_HOST_EXECUTABLE | executable to run on the\
    \ host |\n| BUILD_HOST_SHARED_LIBRARY | shared library for the host |\n| BUILD_HOST_STATIC_LIBRARY\
    \ | static library for the host |\n| BUILD_PACKAGE | Android package (.apk file)\
    \ |\n\n## C and C++ specific options\n\n- LOCAL_CFLAGS : additional flags for\
    \ the C compiler\n- LOCAL_C_INCLUDES : additional directories to search for header\
    \ files\n- LOCAL_SHARED_LIBRARIES : additional shared libraries\n- LOCAL_FORCE_STATIC_EXECUTABLE\
    \ := true : use static linking with this executable\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_278_0.png)\n\
    \n## LF315 Inside Android: an Introduction to Android Internals\n\n## Which directory?\n\
    \n- The default location of the module is set by the build target\n\n| Target\
    \ | Destination |\n| :--- | :--- |\n| BUILD_EXECUTABLE | /system/bin |\n| BUILD_SHARED_LIBRARY\
    \ | /system/lib |\n| BUILD_PACKAGE | /system/app |\n\n## Which directory?\n\n\
    - LOCAL_MODULE_PATH overrides the install directory\n- The list of defined out\
    \ directories is in build/envsetup.sh.\nHere are some of the commonly used ones:\n\
    \n| Target | Destination |\n| :--- | :--- |\n| $(TARGET_ROOT_OUT) | / |\n| $(TARGET_ROOT_OUT_BIN)\
    \ | /sbin |\n| $(TARGET_OUT_OPTIONAL_EXECUTABLES) | /system/xbin |\n| $(TARGET_OUT_ETC)\
    \ | /system/etc |\n| $(TARGET_OUT_JAVA_LIBRARIES) | /system/framework |\n| $(TARGET_OUT_APPS)\
    \ | /system/app |\n| $(TARGET_OUT_DATA) | /data |\n\n## LF315 Inside Android:\
    \ an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_281_0.png)\n\
    \n## Session 11 Adding new packages\n\n## Integrating non-Android code\n\n- Some\
    \ challenges\n- The file layout is not compatible with the FHS\n- The run-time\
    \ is not POSIX compatible\n- The build system does not use standard tools such\
    \ as GNU autotools Each of these problems can be overcome with a little effort\n\
    \nCopyright © 2013 The Linux Foundation. All rights reserved.\n\n## LF315 Inside\
    \ Android: an Introduction to Android Internals\n\n| Feature | Notes |\n| :---\
    \ | :--- |\n| LOCALE and wchar_t | Not implemented |\n| syslog() | Use Android\
    \ instead |\n| User and password functions | Changed to use Android uid/gid scheme\
    \ - no /etc/passwd |\n| gethostbyname() | Changed to use Android resolver - no\
    \ /etc/resolv.conf |\n\nCopyright © 2013 Linux Foundation. All rights reserved.\
    \ DO NOT DISTRIBUTE.\n\n## Session 11 Adding new packages\n\n## Bionic differences\
    \ (2)\n\n| Feature | Notes |\n| :--- | :--- |\n| POSIX threads | No thread cancellation,\
    \ no process shared mutex or condvars, no priority inheritance/ceiling mutexes\
    \ |\n| System V IPC | Not implemented: see SYSV-IPC |\n| Timezone | Taken from\
    \ TZ variable or persist.timezone |\n\n## Strategies for coexistence\n\n- Adapt\
    \ to the Android way\n- Re-package the code as Android modules, using the Android.mk\
    \ makefile\n- Re-code to fit with Bionic where necessary\n- For some examples,\
    \ look in the external directory\n- Create GNU environment alongside Android\n\
    - For small projects, statically link with the (GNU) libraries you need\n- (But\
    \ be aware that this will complicate GPL compliance)\n- Or use a chroot to create\
    \ a GNU environment\n\n## Android and GNU coexist\n\n- Create a directory that\
    \ will become the GNU root (/system/gnu)\n- Put in that directory the programs,\
    \ libraries and configuration files\n- Use the chroot program (e.g. from a statically\
    \ linked Busybox)\n\n```bash\nchroot /system/gnu /bin/my_program\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_286_0.png)\n\
    \n## Lab 11\n\n### Exercise 11.1 Add A VNC server for Android\n\nObjective: Take\
    \ the app droid-vnc-server and add it to the build\n\n```bash\ncd ~/aosp/external\n\
    tar xf ~/embedded-android/resources/lab11/droid-vnc-server.tar.gz\n```\n\nNote\
    \ that there are several Android.mk files in the droid-vnc-server directory that\
    \ was just created. The one that builds the vnc server itself is in droid-vnc-server/jni/vnc/Android.mk.\n\
    \nMake a note of the name given to LOCAL_MODULE. Note that the LOCAL_MODULE_TAGS\
    \ is \"optional\",\n\nModify your device.mk to include this module.\n\nAdd a service\
    \ to init.am335xevrm to start androidvncserver at boot\n\nBuild Android and check\
    \ that the files have been generated in out/target/product/my-device\n\nWrite\
    \ to the SD card and boot the Beaglebone\n\n### Exercise 11.2 Using androidvncserver\n\
    \n## LF315 Inside Android: an Introduction to Android Internals\n\nObjective:\
    \ check that you can see the virtual screen using the vnc client program, vinagre.\n\
    \nConfigure adb to forward TCP port 5901 to the target\n```bash\nadb forward tcp:5901\
    \ tcp:5901\n```\n\nThen run the vinagre vnc client program:\n```bash\nvinagre\
    \ localhost:5901\n```\n\nIt will be rather slow to respond to mouse clicks and\
    \ drags, but it should work. Keyboard input also works *but* the keycodes are\
    \ not transmitted until you click the mouse. Important keys\n\nHome: Return to\
    \ home screen\nDelete: Go back one screen\n\n### Exercise 11.3 Adding non-Android\
    \ code: Busybox\n\nBusybox here represents a typical and commonly used open source\
    \ package.\nit will not compile using the Android toolchain because of functions\
    \ that are missing from Bionic. It is possible to modify Busybox so that it does\
    \ compile, and many have done that, but the purpose here is to use Busybox in\
    \ its \"vanilla\" flavor.\n\nBegin by extracting a standard GNU toolchain (from\
    \ the Openembedded project) and compiling Busybox in the normal way:\n"
  mdcn: "\n\n## 第 11 节添加新包\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_272_0.png)\n\
    \n## LF315 深入 Android：Android 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_273_0.png)\n\
    \n- 当启动构建时，make 会递归地发现所有标记为 `all-makefiles-under` 的目录\n- 它会在每个目录中查找 `Android.mk`\n\
    - 读取 `LOCAL_MODULE` 名称并构建模块列表\n- 结合 `device.mk` 中定义的 `PRODUCT_PACKAGES`（包括继承的包）对模块进行解析\n\
    - 构建所有必要的模块\n\n## 第 11 节添加新包\n\n```makefile\nAndroid.mk\n\n这是一个简单的示例，来自 `external/ping/Android.mk`：\n\
    \nLOCAL_PATH:= $(call my-dir)\ninclude $(CLEAR_VARS)\nLOCAL_SRC_FILES := ping.c\n\
    LOCAL_MODULE := ping\nLOCAL_STATIC_LIBRARIES := libcutils libc\nLOCAL_MODULE_TAGS\
    \ := optional\ninclude $(BUILD_EXECUTABLE)\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_274_0.png)\n\
    \nCopyright © 2013 Linux Foundation. 保留所有权利。\n\n## Android.mk\n\n- `LOCAL_PATH`\
    \ 几乎总是 `$(call my-dir)`\n- 总是需要 `include $(CLEAR_VARS)`\n- `LOCAL_SRC_FILES` 包含源文件列表\n\
    - `LOCAL_MODULE` 给出模块名称\n- `LOCAL_STATIC_LIBRARIES` 列出需要静态链接的库（如果有的话）\n- `include\
    \ $(BUILD_EXECUTABLE)` 表示构建可执行文件\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_275_0.png)\n\
    \n## 模块标签 (Module tags)\n\n- `LOCAL_MODULE_TAGS` 说明该模块属于哪一组\n- 可能的值\n  - optional：仅当被\
    \ `device.mk` 引用时构建（如前所述）\n  - eng, tests, samples：在 `eng` 版本中构建\n  - debug：在\
    \ `eng` 和 `userdebug` 版本中构建\n- 推荐（且简单）的方法是使用 `optional`\n- 如果你想让模块包含在所有构建中，将其标记为\
    \ `optional` 并添加到 `build/target/product/core.mk` 的 `PRODUCT_PACKAGES` 部分\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_276_0.png)\n\
    \n## 构建目标 (Build targets)\n\n| Target | 描述 |\n| :--- | :--- |\n| BUILD_EXECUTABLE\
    \ | 在目标上运行的可执行文件 |\n| BUILD_SHARED_LIBRARY | 目标所需的共享库 |\n| BUILD_STATIC_LIBRARY\
    \ | 目标所需的静态库 |\n| BUILD_PREBUILT | 预编译的二进制包 (binary blob) |\n| BUILD_HOST_EXECUTABLE\
    \ | 在主机上运行的可执行文件 |\n| BUILD_HOST_SHARED_LIBRARY | 主机所需的共享库 |\n| BUILD_HOST_STATIC_LIBRARY\
    \ | 主机所需的静态库 |\n| BUILD_PACKAGE | Android 包 (.apk 文件) |\n\n## C 和 C++ 特有选项\n\n\
    - `LOCAL_CFLAGS`：C 编译器的额外标记\n- `LOCAL_C_INCLUDES`：搜索头文件的额外目录\n- `LOCAL_SHARED_LIBRARIES`：额外的共享库\n\
    - `LOCAL_FORCE_STATIC_EXECUTABLE := true`：对此可执行文件使用静态链接\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_278_0.png)\n\
    \n## LF315 深入 Android：Android 内部原理\n\n## 哪个目录？\n\n- 模块的默认位置由构建目标设置\n\n| Target\
    \ | 目标地 |\n| :--- | :--- |\n| BUILD_EXECUTABLE | /system/bin |\n| BUILD_SHARED_LIBRARY\
    \ | /system/lib |\n| BUILD_PACKAGE | /system/app |\n\n## 哪个目录？\n\n- `LOCAL_MODULE_PATH`\
    \ 覆盖安装目录\n- 定义的输出目录列表在 `build/envsetup.sh` 中。\n以下是一些常用的目录：\n\n| Target | 目标地 |\n\
    | :--- | :--- |\n| $(TARGET_ROOT_OUT) | / |\n| $(TARGET_ROOT_OUT_BIN) | /sbin\
    \ |\n| $(TARGET_OUT_OPTIONAL_EXECUTABLES) | /system/xbin |\n| $(TARGET_OUT_ETC)\
    \ | /system/etc |\n| $(TARGET_OUT_JAVA_LIBRARIES) | /system/framework |\n| $(TARGET_OUT_APPS)\
    \ | /system/app |\n| $(TARGET_OUT_DATA) | /data |\n\n## LF315 深入 Android：Android\
    \ 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_281_0.png)\n\n## 第 11 节添加新包\n\
    \n## 集成非 Android 代码\n\n- 一些挑战\n- 文件布局不兼容 FHS（文件层次层次标准）\n- 运行时不兼容 POSIX\n- 构建系统不使用标准工具（如\
    \ GNU autotools），这些问题中的每一个都可以通过努力来克服\n\nCopyright © 2013 Linux Foundation. 保留所有权利。\n\
    \n## LF315 深入 Android：Android 内部原理\n\n| 特性 | 注意 |\n| :--- | :--- |\n| LOCALE 和\
    \ wchar_t | 未实现 |\n| syslog() | 使用 Android 的实现 |\n| 用户和密码 | 使用 Android 方案 |\n\
    | gethostname() | 使用 Android 解析器 |\n\nCopyright © 2013 Linux Foundation. 不得重新分发。\n\
    \n## 第 11 节添加新包\n\n## Bionic 的差异 (2)\n\n| 特性 | 注意 |\n| :--- | :--- |\n| POSIX\
    \ 线程 | 未实现线程取消、优先级继承/条件互斥 |\n| System V IPC | 未实现信号量 |\n| 时区 | 取自 TZ 变量 |\n\n\
    ## 共存策略\n\n- 适配 Android 方式\n- 将代码打包为 Android 模块，并\n- 根据需要修改以适应 Bionic\n- 在 Android\
    \ 旁创建 GNU 环境，使用静态链接所需的库 (但注意这会影响 GPL 合规性)\n- 使用 chroot 创建 GNU 环境\n\n## Android\
    \ 和 GNU 共存\n\n- 创建一个将成为 GNU 根的目录 (/system/gnu)\n- 在目录下放入程序、库和配置文件（例如静态链接的 Busybox）\n\
    \n```bash\nchroot /system/gnu /bin/my_program\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_286_0.png)\n\
    \n## 实验 11\n\n### 实验11.1 为 Android 添加 VNC 服务器\n\n目标：将 droid-vnc-server 加入构建。\n\
    \n```bash\ncd ~/aosp/external\ntar xf ~/embedded-android/resources/lab11/droid-vnc-server.tar.gz\n\
    ```\n\n注意生成的 droid-vnc-server 目录中有几个 `Android.mk` 文件。构建 vnc 服务器本身的一个位于 `droid-vnc-server/jni/vnc/Android.mk`。\n\
    \n记住 `LOCAL_MODULE` 的名称。注意 `LOCAL_MODULE_TAGS` 是 `optional`，\n\n修改你的 `device.mk`\
    \ 以包含该模块。\n\n在 `init.am335xevrm` 中添加服务，以便启动时运行 `androidvncserver`。\n\n构建 Android\
    \ 并检查文件是否已生成 `out/target/product/my-device`。\n\n写入 SD 卡并启动 Beaglebone。\n\n###\
    \ 实验11.2 使用 androidvncserver\n\n## LF315 深入 Android：Android 内部原理\n\n目标：使用 vnc\
    \ 客户端 vinagre 检查虚拟屏幕。\n\n配置 adb 将 TCP 端口 5901 转发到目标：\n```bash\nadb forward tcp:5901\
    \ tcp:5901\n```\n\n然后运行 vinagre 客户端：\n```bash\nvinagre localhost:5901\n```\n\n\
    它对点击和拖拽的响应相当慢，但应该可以工作。键盘输入在点击鼠标后才会传输。重要键：\n\nHome：返回主屏幕\nDelete：返回上一页\n\n### 实验11.3\
    \ 添加非 Android 代码：Busybox\n\nBusybox 在这里代表了一个典型且常用的开源包。\n它无法使用 Android 工具链编译，因为\
    \ Bionic 缺少某些函数。可以修改 Busybox 使其能够编译，许多人已经这样做了，但这里的目的是使用“原味” (vanilla) 的 Busybox。\n\
    \n首先，提取标准的 GNU 工具链（来自 Openembedded 项目）并按常规方式编译 Busybox：\n\n"
