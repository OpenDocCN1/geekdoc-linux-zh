  - "[PAGE 239]\n\n# Example commands\n\n+   - Load an image (e.g. a kernel) from\
    \ NAND flash\n  * nand read <RAM address> <flash address> <length>\n- Example\n\
    \  * nand read 80100000 1000000 200000\n- Load a kernel from SD card\n  * fatload\
    \ mmc <device>:<partition> <RAM address> <file>\n- Example\n  * mmc rescan 0\n\
    \  * fatload mmc 0:1 80100000 uImage\n- Boot a kernel image in RAM\n  * bootm\
    \ 80100000\n\nThe mmc rescan command will cance the U-Boot mmc driver to initialize\
    \ an MMC device, in this case device 0.\n\nThe version of the Beaglebone board\
    \ used in the labs has 256 MiB of RAM located at addresses 0x8000_0000 to 0x8100_0000.\
    \ The eamples load the compressed kernel image (uimage) into the lower part of\
    \ this RAM."
- md: "\n## RAM disks\n\n- A RAM disk image is loaded into memory in exactly the same\
    \ way as the kernel\n- The bootm command takes the address of the RAMdisk image\
    \ as a second parameter\n\n```\nnand read 80100000 1000000 2000000\nnand read\
    \ 80400000 1200000 600000\nbootm 80100000 80400000\n```\n\n## LF315 Inside Android:\
    \ an Introduction to Android Internals\n\n## U-Boot variables\n\n- U-Boot stores\
    \ information in variables, which may be stored in a block of flash memory or\
    \ a file on an SD card\n- You can create and modify variables using `setenv`,\
    \ for example\n  - `setenv ipaddr 192.168.1.1`\n- You can display variables using\
    \ `printenv`\n- ... and save them permanently to flash storage (if there is any)\
    \ using `saveenv`\n- If there is no NAND flash for storage, the variables can\
    \ be read from a file named `Env.txt`\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_241_0.png)\n\
    \n## Session 10 Starting up\n\n- The variable `bootcmd` can contain a sequence\
    \ of commands separated by semicolons `;` that are executed when U-Boot starts\n\
    \n- The variable `bootdelay` can contain the number of seconds before `bootcmd`\
    \ is executed\n  - If a key on the console is pressed before `bootdelay` has expired\
    \ the autoboot is interrupted and U-Boot enters interactive mode\n\n- Example\
    \ bootcmd\n  - `bootcmd=mmc rescan; fatload mmc 0:1 80100000 uImage; boot 80100000`\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_242_0.png)\n\n## U-Boot and fastboot\n\
    \n- Some versions of U-Boot include support for fastboot\n- The NAND flash or\
    \ eMMC/SD card partition information is coded in the board support files in U-Boot\n\
    - A fastboot command is added to U-Boot which puts it into fastboot mode\n- Thereafter\
    \ it will respond to the fastboot USB protocol as any other Android device would\n\
    - For more information, read this description\n  - http://www.omappededia.com/wiki/Android_Fastboot\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_243_0.png)\n\nUnfortunately, the version\
    \ of U-Boot used in the labs does not have fastboot support so we will be using\
    \ U-Boot specific commands to boot the board.\n\n## Session 10 Starting up\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_244_0.png)\n\n- Linux receives several\
    \ things from the bootloader:\n- a description of the hardware: size of memory,\
    \ clock speed, etc\n- optionally, the memory address of a ramdisk image\n- a command\
    \ line (ASCII string)\n\nThe command line is readable at run-time from the proc\
    \ file system\n\n```\n# cat /proc/cmdline\nconsole=tty00,115200n8 androidboot.console=tty00\n\
    ```\n\n## LF315 Inside Android: an Introduction to Android Internals\n\n## Which\
    \ root file system?\n\n- The root file system can be:\n- A ramdisk\n  - Address\
    \ passed by the bootloader\n  - Default first program: /init\n  - Override with\
    \ androidrd= on the command line\n- A disk partition, flash partition or NFS export\n\
    \  - The kernel mounts the device given by root= on the command line\n  - Default\
    \ first program: /sbin/init\n  - Override with init= on the command line\n\n##\
    \ Session 10 Starting up\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_246_0.png)\n\
    \n- In this specific case, there is no NAND flash and so we are booting from the\
    \ microSD card\n\n- The SD card has a fat32 formatted partition which contains\n\
    \  - First stage bootloader: MLO\n  - Second stage bootloader: u-boot.bin\n  -\
    \ U-boot command file: uEnv.txt\n  - A kernel image: uImage\n  - A RAMdisk image:\
    \ uRamdisk\n\n## LF315 Inside Android: an Introduction to Android Internals\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_247_0.png)\n\n- The Android init program\
    \ is always /init\n- It creates device nodes, starts services\n- Controlled by\
    \ /init.rc and /init.<product name>.rc\n  - see Android Init Language reference\
    \ in system/core/init/readme.txt\n\n## Session 10 Starting up\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_248_0.png)\n\
    \nObtained from the Hardware field of /proc/cpuinfo\n\n```\nProcessor : ARM926EJ-S\
    \ rev 5 (v51)\nBogoIPS : 242.48\nFeatures : swp half thumb fastmult vfp edsp\n\
    CPU implementer : 0x41\nCPU architecture : 5TEJ\nCPU variant : 0x0\nCPU part :\
    \ 0x926\nCPU revision : 5\nHardware : Goldfish\n```\n\nOr, you can override it\
    \ on the kernel command line like this:\nandroidboot.hardware=\"my-device\"\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_248_1.png)\n\n## LF315 Inside Android:\
    \ an Introduction to Android Internals\n\n## The init sequence\n\n- Mount essential\
    \ file systems for /proc, /sys, /dev\n- Parse /init.rc and /init.<product name>.rc\n\
    - Emit early-init trigger\n- Output text A N D R O I D to /dev/tty0\n- Emit triggers\
    \ init, early-fs, fs, post-fs and post-fs-data\n- Emit triggers charger, early-boot\
    \ and boot\n- Emit property triggers\n- Loop handling hardware events and restarting\
    \ processes\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_249_0.png)\n\n## Session\
    \ 10 Starting up\n\n## The Android init language\n\n- Spec: system/core/init/readme.txt\n\
    - Consists of Actions, Commands, Services, and Options\n- Action: a sequence of\
    \ commands performed when a trigger is received\n- Command: somewhat similar to\
    \ shell script\n- Service: a program that can be started and stopped\n- Option:\
    \ modifiers to services\n\n## LF315 Inside Android: an Introduction to Android\
    \ Internals\n\n## Actions\n\n- General form is\n```\non <trigger>\n<command>\n\
    <command>\n<command>\n```\n\n- Example\non init\n sysclktz 0\n loglevel 3\n #\
    \ setup the global environment\n export PATH /sbin/vendor/bin:/system/sbin:/system/bin\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_251_0.png)\n\n## Session 10 Starting\
    \ up\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_252_0.png)\n\n## LF315 Inside\
    \ Android: an Introduction to Android Internals\n\n## Services\n\n- A service\
    \ is a daemon (background program) that can be started and stopped\n\n```\nservice\
    \ <name> <pathname> <argument>\n<option>\n<option>\n```\n\n- The service name\
    \ should be <= 16 characters\n\n- Each service belongs to a class which is set\
    \ by option <class>\n\n- The default class is default if no class is specified\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_253_0.png)\n\n## Session 10 Starting\
    \ up\n\n## Options\n\n| class <name> | Service belongs to class |\n| :--- | :---\
    \ |\n| critical | If it exits into recovery mode |\n| disabled | Not automatically\
    \ started |\n| oneshot | Not restarted |\n| socket <name> | Create unix socket\
    \ /dev/socket/<name> |\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_254_0.png)\n\
    \n## LF315 Inside Android: an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_255_0.png)\n\
    \n- Before ICS\n- All services belong to default (no class option)\n- All are\
    \ started from default trigger with\n```\nclass_start\n```\n\n- ICS and later\n\
    - Services belong to one of these classes which are started at various times:\n\
    \n```\nclass core\nclass main\nclass late_start\nclass charger\n```\n\n## Session\
    \ 10 Starting up\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_256_0.png)\n\n##\
    \ LF315 Inside Android: an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_257_0.png)\n\
    \n- On boot, init reads properties from these files, in order\n/default.prop\n\
    /system/build.prop\n/system/default.prop\n/data/local.prop\n\n- When a property\
    \ is modified, init emits the trigger <name>=<value>, see later for an example\n\
    \n## Session 10 Starting up\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_258_0.png)\n\
    \n- Properties beginning ro. are read-only and cannot be modified\n- Properties\
    \ beginning persist. can be modified and the value will persist after a reboot\n\
    \  - It is stored in /data/property/<property name>\n- Example:\n\n```\n# setprop\
    \ persist.myprop this-is-a-test\n# ls /data/property\npersist.myprop persist.sys.language\n\
    persist.sys.country persist.sys.localevar\n```\n\n## LF315 Inside Android: an\
    \ Introduction to Android Internals\n\n```\nctl.start and ctl.stop\n```\n\n- Setting\
    \ these properties will start or stop a named service\n- For example, to start\
    \ service dumpstate\n\n# setprop ctl.start dumpstate\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_259_0.png)\n"
  mdcn: "\n\n## RAM 磁盘 (RAM disks)\n\n- RAM 磁盘镜像加载到内存的方式与内核完全相同\n- `bootm` 命令将 RAMdisk\
    \ 镜像地址作为第二个参数\n\n```\nnand read 80100000 1000000 2000000\nnand read 80400000 1200000\
    \ 600000\nbootm 80100000 80400000\n```\n\n## Android Inside LF315：Android 内部原理\n\
    \n## U-Boot 变量\n\n- U-Boot 将信息存储在变量中，变量可能存储在闪存内存块或 SD 卡上的文件中\n- 你可以使用 `setenv`\
    \ 创建和修改变量，例如：\n  - `setenv ipaddr 192.168.1.1`\n- 你可以使用 `printenv` 显示变量\n- ...\
    \ 并使用 `saveenv` 将它们永久保存到闪存中（如果有的话）\n- 如果没有 NAND 闪存进行存储，可以从名为 `Env.txt` 的文件中读取变量\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_241_0.png)\n\n## 第 10 节启动\n\n- 变量 `bootcmd`\
    \ 可以包含由分号 `;` 分隔的命令序列，这些命令会在 U-Boot 启动时执行\n\n- 变量 `bootdelay` 可以包含执行 `bootcmd`\
    \ 之前的秒数\n  - 如果在 `bootdelay` 结束前按下控制台上的按键，自动启动将被中断，U-Boot 进入交互模式\n\n- 示例 bootcmd\n\
    \  - `bootcmd=mmc rescan; fatload mmc 0:1 80100000 uImage; boot 80100000`\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_242_0.png)\n\n## U-Boot 与 fastboot\n\n\
    - 某些版本的 U-Boot 包含了对 fastboot 的支持\n- NAND 闪存或 eMMC/SD 卡分区信息编码在 U-Boot 的板级支持文件中\n\
    - U-Boot 中添加了 fastboot 命令，可将其置于 fastboot 模式\n- 此后它将像其他 Android 设备一样响应 fastboot\
    \ USB 协议\n- 了解更多信息，请阅读此描述\n  - http://www.omappededia.com/wiki/Android_Fastboot\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_243_0.png)\n\n遗憾的是，实验中使用的 U-Boot 版本不支持\
    \ fastboot，因此我们将使用 U-Boot 特有的命令来启动板卡。\n\n## 第 10 节启动\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_244_0.png)\n\
    \n- Linux 从引导加载程序接收几项内容：\n- 硬件描述：内存大小、时钟频率等\n- 可选的，ramdisk 镜像的内存地址\n- 一行命令行（ASCII\
    \ 字符串）\n\n命令行可以在运行时从 `proc` 文件系统读取\n\n```\n# cat /proc/cmdline\nconsole=tty00,115200n8\
    \ androidboot.console=tty00\n```\n\n## Android Inside LF315：Android 内部原理\n\n##\
    \ 哪种根文件系统？\n\n- 根文件系统可以是：\n- 磁盘 (ramdisk)\n  - 由引导加载程序传递的地址\n  - 默认第一个程序：/init\n\
    \  - 在命令行上通过 `androidrd=` 覆盖\n- 磁盘分区、闪存分区或 NFS 导出\n  - 内核挂载命令行中 `root=` 指定的设备\n\
    \  - 默认第一个程序：/sbin/init\n  - 在命令行上通过 `init=` 覆盖\n\n## 第 10 节启动\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_246_0.png)\n\
    \n- 在特定情况下，没有 NAND 闪存，因此我们从 microSD 卡启动\n\n- SD 卡有一个格式化为 fat32 的分区，其中包含：\n  -\
    \ 第一阶段引导加载程序：MLO\n  - 第二阶段引导加载程序：u-boot.bin\n  - U-boot 命令文件：uEnv.txt\n  - 一个内核镜像：uImage\n\
    \  - 一个 RAMdisk 镜像：uRamdisk\n\n## Android Inside LF315：Android 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_247_0.png)\n\
    \n- Android init 程序始终是 /init\n- 它创建设备节点，启动服务\n- 由 /init.rc 和 /init.<product name>.rc\
    \ 控制\n  - 参见 system/core/init/readme.txt 中的 Android Init 语言参考\n\n## 第 10 节启动\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_248_0.png)\n\n从 `/proc/cpuinfo` 的 `Hardware`\
    \ 字段获取\n\n```\nProcessor : ARM926EJ-S rev 5 (v51)\nBogoIPS : 242.48\nFeatures\
    \ : swp half thumb fastmult vfp edsp\nCPU implementer : 0x41\nCPU architecture\
    \ : 5TEJ\nCPU variant : 0x0\nCPU part : 0x926\nCPU revision : 5\nHardware : Goldfish\n\
    ```\n\n或者，你也可以这样在内核命令行上覆盖它：\nandroidboot.hardware=\"my-device\"\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_248_1.png)\n\
    \n## Android Inside LF315：Android 内部原理\n\n## init 序列\n\n- 挂载 /proc、/sys、/dev 的必要文件系统\n\
    - 解析 /init.rc 和 /init.<product name>.rc\n- 发出早期初始化 (early-init) 触发\n- 向 /dev/tty0\
    \ 输出文本 A N D R O I D\n- 发出 init、early-fs、fs、post-fs 和 post-fs-data 触发\n- 发出 charger、early-boot\
    \ 和 boot 触发\n- 发出属性触发\n- 循环处理硬件事件并重启进程\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_249_0.png)\n\
    \n## 第 10 节启动\n\n## Android init 语言\n\n- 规范：system/core/init/readme.txt\n- 由动作\
    \ (Actions)、命令 (Commands)、服务 (Services) 和选项 (Options) 组成\n- Action：接收到触发时执行的命令序列\n\
    - Command：类似于 shell 脚本\n- Service：可以启动和停止的程序\n- Option：服务的修饰符\n\n## Android Inside\
    \ LF315：Android 内部原理\n\n## 动作 (Actions)\n\n- 一般形式为：\n```\non <trigger>\n<command>\n\
    <command>\n<command>\n```\n\n- 示例\non init\n sysclktz 0\n loglevel 3\n # 设置全局环境\n\
    \ export PATH /sbin/vendor/bin:/system/sbin:/system/bin\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_251_0.png)\n\
    \n## 第 10 节启动\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_252_0.png)\n\n## Android\
    \ Inside LF315：Android 内部原理\n\n## 服务 (Services)\n\n- 服务是一个可以启动和停止的守护进程 (daemon)\n\
    \n```\nservice <name> <pathname>\n<argument>\n<option>\n```\n\n- 服务名称应小于 16 个字符\n\
    \n- 每个服务属于一个类，由 `<class>` 设置\n\n- 如果未指定类，默认类为 default\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_253_0.png)\n\
    \n## 第 10 节启动\n\n## 选项 (Options)\n\n| class <name> | 服务所属的类 |\n| :--- | :--- |\n\
    | critical | 进入恢复模式 |\n| disabled | 不自动启动 |\n| oneshot | 不重启 |\n| socket <name>\
    \ | 创建 unix 套字 /dev/socket/<name> |\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_254_0.png)\n\
    \n## Android Inside LF315：Android 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_255_0.png)\n\
    \n- ICS 之前\n- 所有服务都属于默认（无类）\n- 从默认触发启动\n```\nclass_start\n```\n\n- ICS 及以后\n-\
    \ 服务属于以下类之一，它们在不同的时间启动：\n\n```\nclass core\nclass main\nclass late_start\nclass\
    \ charger\n```\n\n## 第 10 节启动\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_256_0.png)\n\
    \n## Android Inside LF315：Android 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_257_0.png)\n\
    \n- 启动时，init 按顺序从这些文件中读取属性\n/default.prop\n/system/build.prop\n/system/default.prop\n\
    /data/local.prop\n\n- 当属性被修改时，init 发出触发 `<name>=<value>`，示例见后文\n\n## 第 10 节启动\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_258_0.png)\n\n- 以 `ro.` 开头的属性是只读，不可修改\n\
    - 以 `persist.` 开头的属性可以修改，且值在重启后依然存在\n  - 它存储在 /data/property/<property name>\n\
    - 示例：\n\n```\n# setprop persist.myprop this-is-a-test\n# ls /data/property\npersist.myprop\
    \ persist.sys.language\npersist.sys.country persist.sys.localevar\n```\n\n## Android\
    \ Inside LF315：Android 内部原理\n\n```\nctl.start 和 ctl.stop\n```\n\n- 设置这些属性将启动或停止命名服务\n\
    - 例如，启动 dumpstate 服务\n\n# setprop ctl.start dumpstate\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_259_0.png)\n\
    \n"
