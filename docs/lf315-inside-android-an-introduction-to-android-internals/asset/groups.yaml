    # Session 1 Introduction\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_10_0.png)\n\
    \nSession 1: Introduction\n\n- Linux Foundation\n- Linux Foundation Training\n\
    - Logistics\n\n# LF315 Inside Android: an Introduction to Android Internals\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_11_0.png)\n\n* Nonprofit consortium dedicated\
    \ to fostering the growth of Linux\n* Promotes Linux and provides neutral collaboration\
    \ and education\n* Protects and supports Linux development\n* Improves Linux as\
    \ a technical platform\n* Sponsors the work of Linux creator Linus Torvalds\n\
    * Supported by leading technology companies and developers\n\nSince its inception\
    \ in 1991, Linux has grown to become a force in computing, powering everything\
    \ from the New York Stock Exchange to mobile phones to supercomputers to consumer\
    \ devices. The growth of Linux. The Linux Foundation is the nonprofit consortium\
    \ dedicated to fostering the growth of Linux. Founded in 2000, the Linux Foundation\
    \ sponsors the work of Linux creator Linus Torvalds and is supported by leading\
    \ technology companies and developers from around the world.\n\nThe Linux Foundation\
    \ promotes, protects and advances Linux by marshaling the resources of its members\
    \ and the open source development community to ensure Linux remains free and technically\
    \ advanced.\n\n# Linux Foundation Events\n\n* LinuxCon North America, Europe and\
    \ Japan\n* CloudOpen\n* Collaboration Summit\n* Embedded Linux Conference North\
    \ America and Europe\n* Enterprise End User Summit\n* Android Builders Summit\n\
    * Tizen Developer Conference\n\nThe Linux Foundation produces technical events\
    \ around the world. Whether it is to provide an open forum for development of\
    \ the next kernel release, to bring together developers to solve problems in a\
    \ real-time environment, to host workgroups and community groups for active discussion,\
    \ to connect end users and kernel developers in order to grow Linux use in the\
    \ enterprise or to encourage collaboration among the entire community, we know\
    \ that our conferences provide an atmosphere that is unmatched in their ability\
    \ to further the platform.\n\n# Enterprise Training\n\n- Trainings focused on\
    \ enterprise Linux environments\n- Target system administrators, technical support\
    \ and architects\n- Leads to hands-on certifications\n\nThe Linux Foundation Training\
    \ is for the community, by the community, and features instructors and content\
    \ straight from the leaders of the Linux developer community.\nAttendees receive\
    \ Linux training that is vendor-neutral, technically advanced and created with\
    \ the actual leaders of the Linux development community themselves. The Linux\
    \ Foundation Training courses give attendees the broad, foundational knowledge\
    \ and networking needed to thrive in their careers today. With either online or\
    \ in person training, the Linux Foundation classes can keep you or your developers\
    \ ahead of the curve on Linux essentials.\n\n# Session 1 Introduction\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_14_0.png)\n\
    \nThis training, including all material provided herein, is supplied without any\
    \ guarantees by The Linux Foundation. The Linux Foundation assumes no liability\
    \ for damages or legal action arising from the use or misuse of contents or details\
    \ contained herein.\n\nIf you believe The Linux Foundation materials are being\
    \ used, copied, or otherwise improperly distributed email training@linuxfoundation.org\
    \ or phone toll-free (USA) +1-415-723-9709.\n\n# LF315 Inside Android: an Introduction\
    \ to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_15_0.png)\n\
    \n* Building access\n* Wifi access\n* In case of emergency\n* Note on cell phones\
    \ and laptops\n\n# Session 1 Introduction\n\n# Schedule\n\n- Classroom availability\
    \ and class start time\n- Breaks\n- Lunches\n- When to ask questions?\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_16_0.png)\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_16_1.png)\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_16_2.png)\n\
    \n# LF315 Inside Android: an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_17_0.png)\n\
    \n- Hands-on exercises provided at end of chapter\n- Some exercises marked as\
    \ optional\n- Solutions available at end\n\nCopyright © 2013 The Linux Foundation.\
    \ All rights reserved.\n\n# Course Registration\n\n- Register on https://training.linuxfoundation.org/surveys\n\
    - Note the key provided by instructor\n- The key is used for registration and\
    \ surveys\n- A certificate of attendance will be provided after the class\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_18_0.png)\n\n# Lab 1\n\n### Exercise\
    \ 1.1 Copy files\n\nObjective: get a copy of the repository from the Open Source\
    \ Project. There is a lot of code, so we start copying now that it will be ready\
    \ for the first \"real lab\" after the next session. The version of Android being\
    \ used is Jelly Bean 4.1.2_r1. To save time downloading it (all 12 GiB) the instructor\
    \ will give you a copy on a flash drive.\n\nIt doesn't really matter where the\
    \ files are copied to, but the notes assume that they are in $HOME/embedded-android.\
    \ If you put them elsewhere, make sure to adjust the paths used later in the course.\n\
    \nInsert the flash drive. It should auto mount to /media/lf315\n\n```\n$ mkdir\
    \ ~/embedded-android\n$ cd ~/embedded-android\n$ cp -a /media/lf315/resources\
    \ .\n$ tar xf /media/lf315/aosp/android-4.1.2_r1.tar.bz2\n```\n\nThe un-tar command\
