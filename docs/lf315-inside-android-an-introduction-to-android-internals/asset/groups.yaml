    # LF315 深入 Android：Android 原理简介


    ## Summary


    - Android 的设计目标是在低内存环境下运行

    - Activity 管理器（Activity manager）控制 oom_adj 值

    - 当空闲内存低于各种阈值时，低内存内核驱动程序会杀死应用程序

    - 进进电源管理意味着系统会在短暂超时后进入挂起（suspend）模式

    - 唤醒锁（Wake locks）允许应用程序在用户界面需要时避免挂起

    - ... 以及在关键操作期间设备驱动


