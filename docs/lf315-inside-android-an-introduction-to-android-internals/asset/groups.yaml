- md: "\n## Session 11 Adding new packages\n\n281\n\n```\n$ cd /\n$ sudo tar xf ~/embedded-android/resources/lab11/angstrom-eibc-i686-armv7a-v2012.05-toolchain.tar.bz\n\
    $ cd ~/embedded-android\n$ tar xf resources/lab11/busybox-1.20.1.tar.bz\n$ cd\
    \ busybox-1.20.1\n$ PATH=/usr/local/oorece-i686/sysroots/i686-angstromdk-linux/usr/bin/armv7a-android-linux-gnueababi:$PATH\n\
    $ export ARCH=arm\n$ export CROSS_COMPILE=arm-angstrom-linux-gnueababi-\n$ make\
    \ defconfig\n$ make\n$ make install\n```\n\nNote that during the last stage busybox\
    \ was installed into _install. Next, you need to copy these files to the SD card.\
    \ You are going to do this as a separate stage, after Android has been installed.\
    \ Busybox will be in /system/gnu and there will be symbolic links from /bin, /sbin,\
    \ /usr/bin, /usr/sbin and lib to that directory.\n\nInsert the SD card into the\
    \ reader. Create a subdirectory in the system partition called 'gnu'\n\n```\n\
    $ sudo cp -a _install/* /media/system/gnu\n$ cp -a /usr/local/oorece-i686/sysroots/armv7a-angstrom-linux-gnueababi/lib\
    \ /media/system/gnu\n```\n\n## LF315 Inside Android: an Introduction to Android\
    \ Internals\n\nAdd lines to init.am335xvm.rc to create symlinks and add busybox\
    \ to the path\n\non init\n\n```\nsymlink /system/gnu/bin /bin\nsymlink /system/gnu/usr\
    \ /usr/bin\nsymlink /system/gnu/usr/sbin /usr/sbin\nsymlink /system/gnu/lib /lib\n\
    export PATH /sbin:/vendor/bin:/system/sbin:/system/bin:/system/xbin:/bin:/usr/bin:/usr/bin\n\
    ```\n\nBuild Android and copy the new ramdisk to the boot partition as before.\n\
    \nBoot the Beaglebone and verify that you can use Busybox commands such as grep,\
    \ cp, vi and so on.\n\n## Session 12 Graphics and OpenGL\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_292_0.png)\n\
    \n## Session 12: Graphics and OpenGL\n\n- Android and OpenGL\n- EGL\n- The graphics\
    \ stack\n- Graphics drivers\n- Device configuration\n\nCopyright © 2013 The Linux\
