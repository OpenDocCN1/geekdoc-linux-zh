  - "[PAGE 97]\n\n# Applications and processes\n\n+   * Each application runs in a\
    \ separate Dalvik virtual machine\n* Each virtual machine runs as a separate Linux\
    \ process\n* Lends robustness to the design:\n  * A process cannot access memory\
    \ belonging to other processes\n  * A process cannot access kernel memory or resources\
    \ (including hardware)\n  * If a process terminates (e.g. crashes) it need not\
    \ affect others (unless there is some explicit dependency)\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_97_0.png)"
  - '[PAGE 98]


