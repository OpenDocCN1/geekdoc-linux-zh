    # U-Boot variables\n\n+   - U-Boot stores information in variables, which may\
    \ be stored in a block of flash memory or a file on an SD card\n- You can create\
    \ and modify variables using `setenv`, for example\n  - `setenv ipaddr 192.168.1.1`\n\
    - You can display variables using `printenv`\n- ... and save them permanently\
    \ to flash storage (if there is any) using `saveenv`\n- If there is no NAND flash\
    \ for storage, the variables can be read from a file named `Env.txt`\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_241_0.png)"
  - "[PAGE 242]\n\n# Session 10 Starting up\n\n233\n\n+   - The variable `bootcmd`\
    \ can contain a sequence of commands separated by semicolons `;` that are executed\
    \ when U-Boot starts\n\n+   - The variable `bootdelay` can contain the number\
    \ of seconds before `bootcmd` is executed\n  - If a key on the console is pressed\
    \ before `bootdelay` has expired the autoboot is interrupted and U-Boot enters\
    \ interactive mode\n\n+   - Example bootcmd\n  - `bootcmd=mmc rescan; fatload\
    \ mmc 0:1 80100000 uImage; boot 80100000`\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_242_0.png)"
  - "[PAGE 243]\n\n# U-Boot and fastboot\n\n+   * Some versions of U-Boot include\
    \ support for fastboot\n* The NAND flash or eMMC/SD card partition information\
    \ is coded in the board support files in U-Boot\n* A fastboot command is added\
    \ to U-Boot which puts it into fastboot mode\n* Thereafter it will respond to\
    \ ithe fastboot USB protocol as any other Android device would\n* For more information,\
    \ read this description\n  * http://www.omappededia.com/wiki/Android_Fastboot\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_243_0.png)\n\nUnfortunately, the version\
    \ of U-Boot used in the labs does not have fastboot support so we will be using\
    \ U-Boot specific commands to boot the board."
