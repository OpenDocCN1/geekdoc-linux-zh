- md: "\n## Session 10 Starting up\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_260_0.png)\n\
    \n- These properties are defined in /default.prop\n- adbd runs as user root and\
    \ the prompt is '# ' if:\n  * ro.secure == 0, or\n  * ro.secure == 1 AND ro.debuggable\
    \ == 1 service.adb.root is defined\n- Otherwise, adbd runs as user shell (UID\
    \ 2000, '$' prompt)\n- Setting by build type:\n\n| Build | ro.secure | ro.debuggable\
    \ |\n| :--- | :--- | :--- |\n| user | 1 | 0 |\n| userdebug | 1 | 1 |\n| eng |\
    \ 0 | 1 |\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_260_1.png)\n\n## LF315 Inside\
    \ Android: an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_261_0.png)\n\
    \nIf ro.secure == 1 AND ro.debuggable == 1 you can restart adbd as root from the\
    \ host with the command \"adb root\":\n\n```\n$ adb root\nrestarting adbd as root\n\
    $ adb shell\n#\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_261_1.png)\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_261_2.png)\n\n## Example property trigger\n\
    \n```\nservice adbd /sbin/adb\n    disabled\n\n# adbd on at boot in emulator\n\
    on property:ro.kernel.qemu=1\n    start adbd\n\non property:persist.service.adb.enable=1\n\
    \    start adbd\n\non property:persist.service.adb.enable=0\n    stop adbd\n```\n\
    \n## Permissions of device nodes\n\n- Init is also responsible for populating\
    \ the device nodes in /dev at startup and at run time as new devices are discovered\
    \ (for example by plugging in a USB device)\n- The permissions, user and group\
    \ are set in files\n  - /ueventd.rc\n  - /ueventd.<product name>.rc\n- The format\
    \ is\n  - \"file name\" \"permissions\" \"uid\" \"gid\"\n\n```\n/dev/null    0666\
    \ root root\n/dev/zero   0666 root root\n/dev/full   0666 root root\n```\n\n##\
    \ Summary\n\n- System boot begins with the bootloader\n  - the bootloader is highly\
    \ device-dependent\n  - many Android bootloaders implement the fastboot protocol\n\
    - The bootloader loads a Linux kernel and ramdisk\n- The ramdisk contains the\
    \ Android init program\n- Android init is event based\n  - Event triggers cause\
    \ sections of init.rc to be executed\n  - Some events will cause native services\
    \ defined in init.rc to be started\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_264_0.png)\n\
    \n## Lab 10\n\n**Exercise 10.1** Prepare the SD card\n\nObjective: Format the\
    \ microSD card for use with Android. You only need to do this once.\n\nThe first\
    \ thing is to find out which device the SD card reader shows up as. *It is vitally\
    \ important to get this right otherwise you may end up formatting the hard drive,\
    \ which will please noone*\n\nTake a note of the sd* nodes you have in /dev at\
    \ the moment. You will see something like this:\n\n```\n$ ls /dev/sd*\n/dev/sda\
    \ /dev/sda1 /dev/sda2 /dev/sda5\n```\n\nInsert the SD card into the reader and\
    \ find out which new nodes have been created:\n\n```\n$ ls /dev/sd*\n/dev/sda\
    \ /dev/sda1 /dev/sda2 /dev/sda5 /dev/sdb /dev/sdb1\n```\n\nThat shows that in\
    \ this case the SD card is /dev/sdb and that it has one partition, /dev/sdb1\n\
    \n## Session 10 Starting up\n\nUnmount all partitions on the SD card\n\n```\n\
    $ sudo umount /dev/sdx1\n$ sudo umount /dev/sdx2\netc...\n```\n\nRun `fdisk /dev/sdx`\n\
    \n- Type `p` (print). The first line includes the size: Disk /dev/sdb: 3965 MB.\
    \ If it is 100's of GB, then you have your hard disk, not the SD card. Start again\n\
    - Delete all existing partitions (command 'd')\n- Create a new `primary` partition\
    \ number 1, default first sector and last sector +64M (command 'n').\n- Set the\
    \ partition id (command 't') to 'c' (W95 FAT32 (LBA))\n- Mark it bootable (command\
    \ 'a')\n- Create three more primary partitions for system, user data and cache,\
    \ using the sizes you specified in the BoardConfig.mk file. Leave the system-id\
    \ at the default value, 83\n\nCheck that your partition table is the same as the\
    \ one in the solution before continuing.\n\n## Type 'w' to save and exit\n\nFormat\
    \ the first partition\n\n```\n$ sudo mkfs -t vfat -n boot /dev/sdX1\n```\n\nPull\
    \ the SD card out and plug it back in again. The first partition should be mounted\
    \ in /media/boot. Copy the U-Boot binaries and configuration to the boot partition:\n\
    \n```\n$ cp ~/embedded-android/resources/lab10/u-boot/* /media/boot\n```\n\nFYI:\
    \ uEnv.txt contains\n\n```\nbootargs=console=tty00,115200n8 androidboot.console=tty00\
    \ rootwait ro\nbootcmd=-mmc rescan; fatload mmc 0 82000000 uImage ;\nfatload mmc\
    \ 0 83000000 uRamdisk; bootm 82000000 83000000\nuenvvcmd=boot\n```\n\nNote: Much\
    \ of the information here is to deal with the specifics of the Beaglebone board.\
    \ The procedure for other devdevs will be somewhat similar; for devices that do\
    \ not boot from SD card using U-Boot it will be somewhat different.\n\n## **Exercise\
    \ 10.2** Copy kernel and ramdisk to the boot partition\n\nCopy the kernel image\
    \ from\n\n```\n$HOME/embedded-android/kernel/arch/arm/boot/uImage to /media/boot\n\
    ```\n\n## Session 10 Starting up\n\nCreate the ramdisk image:\n```\n$ mkimage\
    \ -A arm -0 linux -T ramdisk -d ramdisk.img uRamdisk\n```\nCopy it to /media/boot\n\
    \n## Exercise 10.3 Copy system, userdata and cache to SD\n\n\"Un sparse\" the\
    \ image files and copy them to the sd card like so:\n\n```\n$ simp2img out/target/product/beaglebone/system.img\
    \ system-ext4.img\n$ sudo dd if=system-ext4.img of=/dev/sdX2 bs=4M\n$ sudo e2label\
    \ /dev/sdX2 system\n$ simp2img\nout/target/product/beaglebone/userdata.img userdata-ext4.img\n\
    $ sudo dd if=userdata-ext4.img of=/dev/sdX3 bs=4M\n$ sudo e2label /dev/sdX3 data\n\
    $ simp2img\nout/target/product/beaglebone/cache.img cache-ext4.img\n$ sudo dd\
    \ if=cache-ext4.img of=/dev/sdX4 bs=4M\n$ sudo e2label /dev/sdX4 cache\n```\n\n\
    ## Exercise 10.4 Boot the Beaglebone\n\nPlug the SD card into the Beaglebone and\
    \ then plug in the USB cable. Device /dev/ttyUSB1 will appear: this is the serial\
    \ console.\n\nimg/c6f4acfaca4829cadfb14f4d738cba2c_268_0.png)\n\n## LF315 Inside\
    \ Android: an Introduction to Android Internals\n\nAdd your user to dialout group:\n\
    \n```\n$ adduser <your name> dialout\n```\n\nLog out and then log again to pick\
    \ up the change (you can type id to verify that you are now member of dialout)\n\
    \nSet the permissions on /etc/minicom minicom can save\n\n```\n$ sudo chmod 777\
    \ /etc/minicom\n```\n\nType minicom -s to begin up serial port and press 'a' to\
    \ change the Serial Device to /dev/ttyUSB1. Press 'e' and select speed 115200,\
    \ no parity, 8 data bits, one bit and press enter. Select No hardware flow control\
    \ and No software flow control.\n\nPress enter, then select Save setup as dfl\
    \ and press enter again. Finally Exit from Minicom\n\nStart minicom again with\
    \ line wrap\n\nNote: to quit minicom, type Ctrl-A and q (that is, press Ctrl and\
    \ A together, then let go and press q)\n\nPress the reset button on the Beaglebone\
    \ (it's a very small button to the right of Ethernet port).\n\nYou should see\
    \ the kernel boot but then there will be messages like init:\n\n14f4d738cba2c_269_0.png)\n\
    \nCopyright 2013 Linux Foundation. All rights reserved. DO NOT DISTRIBUTE.\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_269_1.png)\n\n## Session 10 Starting\
    \ up\n\ncannot find '/system/bin/servicemanager'. Go on to the next exercise to\
    \ resolve that.\n\n## Exercise 10.5 Add custom init commands\n\nThe problem is\
    \ that there are no instructions to mount the partitions on the SD card. Copy\
    \ init.am35xvm.rc, init.am35xvm.usb.rc and fstab.beaglebone from $HOME/embedded-android/resources/lab10/init\
    \ to your device/myorg/myproduct\n\nEdit your device.mk and add a PRODUCT_COPY_FILES\
    \ rule to include all three files in the build.\n\nBuild Android and copy the\
    \ new ramdisk.img to the SD card. Boot the Beaglebone.\n\n## Exercise 10.6 Get\
    \ adb to work\n\nRun \"adb devices\": you should see\n\n```\n+ List of devices\
    \ attached\n0123456789ABCDEF device\n```\n\nIf not, find the USB vendor and product\
    \ ID (*) and add them to 51-android.rules as before.\n\nNow run adb shell and\
    \ check that you get a root shell.\n\nWhere do these numbers come from? They are\
    \ stored in directory /sys/class/android_usb/android0 in files idProduct, idVendor,\
    \ iSerial and they are configured by /init.usb.rc\n"
  mdcn: "\n\n## 第 10 ：启动\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_260_0.png)\n\n\
    - 这些属性定义在 /default.prop 中\n- adbd 以 root 用户身份运行且在满足以下条件时提示符为 '# ':\n  * ro.secure\
    \ == 0，或\n  * ro.secure == 1 且 ro.debuggable == 1 并定义了 service.adb.root\n- 否则，adbd\
    \ 以 shell 用户身份运行 (UID 2000，提示符为 '$')\n- 按构建类型设置：\n\n| 构建类型 | ro.secure | ro.debuggable\
    \ |\n| :--- | :--- | :--- |\n| user | 1 | 0 |\n| userdebug | 1 | 1 |\n| eng |\
    \ 0 | 1 |\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_260_1.png)\n\n## LF315 Android\
    \ 内部：Android 内部原理介绍\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_261_0.png)\n\n\
    如果 ro.secure == 1 且 ro.debuggable == 1，你可以从主机上通过命令 \"adb root\" 以 root 身份重启 adbd：\n\
    \n```\n$ adb root\nrestarting adbd as root\n$ adb shell\n#\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_261_1.png)\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_261_2.png)\n\n## 示例属性触发\n\n```\nservice\
    \ adbd /sbin/adb\n    disabled\n\n# 模拟器在启动时开启 adbd\n    on property:ro.kernel.qemu=1\n\
    \    start adbd\n\non property:persist.service.adb.enable=1\n    start adbd\n\n\
    on property:persist.service.adb.enable=0\n    stop adbd\n```\n\n## 设备节点的权限\n\n\
    - Init 还负责在启动时以及发现新设备时（例如通过插入 USB 设备）在 /dev 中填充设备节点\n- 权限、用户和用户组在文件中设置\n  - /ueventd.rc\n\
    \  - /ueventd.<product name>.rc\n- 格式为\n  - \"file name\" \"权限\" \"uid\" \"gid\"\
    \n\n```\n/dev/null    0666 root root\n/dev/zero   0666 root root\n/dev/full  \
    \ 0666 root root\n```\n\n## 总结\n\n- 系统启动从 bootloader 开始\n  - bootloader 极度依赖于特定设备\n\
    \  - 许多 Android bootloader 实现了 fastboot 协议\n- bootloader 加载 Linux 内核和 ramdisk\n\
    - ramdisk 包含 Android init 程序\n- Android init 是基于事件的\n  - 事件触发会执行 init.rc 的部分内容\n\
    \  - 某些事件将启动在 init.rc 中定义的原生服务\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_264_0.png)\n\
    \n## 实验 10\n\n**练习 10.1** 准备 SD 卡\n\n目标：格式化 microSD 卡以供 Android 使用。你只需要执行一次。\n\
    \n第一件事是找到 SD 卡读取器显示为哪个设备。*正确获取这一点至关重要，否则你可能会格式化硬盘，这会让任何人都不高兴*\n\n记录下你目前在 /dev\
    \ 中的 sd* 节点。你会看到类似下面的内容：\n\n```\n$ ls /dev/sd*\n/dev/sda /dev/sda1 /dev/sda2 /dev/sda5\n\
    ```\n\n将 SD 卡插入读卡器并找到创建了哪些新节点：\n\n```\n$ ls /dev/sd*\n/dev/sda /dev/sda1 /dev/sda2\
    \ /dev/sda5 /dev/sdb /dev/sdb1\n```\n\n这表明在这种情况下 SD 卡是 /dev/sdb，并且它有一个分区 /dev/sdb1\n\
    \n## 第 10：启动\n\n卸载 SD 卡上的所有分区\n\n```\n$ sudo umount /dev/sdx1\n$ sudo umount /dev/sdx2\n\
    etc...\n```\n\n运行 `fdisk /dev/sdx`\n\n- 输入 `p` (打印)。第一行包含大小：Disk /dev/sdb: 3965\
    \ MB。如果是数百 GB，那么你拥有的是硬盘而不是 SD 卡。请重新开始。\n- 删除所有现有分区（命令 'd'）。\n- 创建一个新的编号为 1 的 `primary`\
    \ 分区，默认起始扇区和结束扇区 +64M（命令 'n'）。\n- 将分区 ID（命令 't'）设为 'c' (W95 FAT32 (LBA))）。\n-\
    \ 将其标记为可启动（命令 'a'）。\n- 为系统、用户数据和缓存再创建另外三个主分区，使用您在 BoardConfig.mk 文件中指定的大小。将系统-id\
    \ 保持为默认值 83。\n\n在继续之前，检查您的分区表是否与解决方案中的一致。\n\n## 输入 'w' 保存并退出\n\n格式化第一个分区\n\n```\n\
    $ sudo mkfs -t vfat -n boot /dev/sdx1\n```\n\n拔出 SD 卡并重新插入。第一个分区应该挂载在 /media/boot。将\
    \ U-Boot 二进制文件和配置拷贝到启动分区：\n\n```\n$ cp ~/embedded-android/resources/lab10/u-boot/*\
    \ /media/boot\n```\n\n提示：uEnv.txt 包含\n\n```\nbootargs=console=ttyS0,115200 rootwait\n\
    bootcmd=-mmc rescan; fatload mmc 0 8200000 uImage\nfatload mmc 0 8300000 ramdisk;\
    \ bootm 8200000 envcmd=boot\n```\n\n注意：这里的大部分信息是为了处理 Beaglebone 的特定设置。对于使用 U-Boot\
    \ 从 SD 卡启动的设备，过程会有所不同。\n\n**练习 10.2** 拷贝内核和 ramdisk\n\n将 $HOME/embedded-android/kernel/arch/boot/uImage\
    \ 拷贝到 /media/boot\n\n## 第 10：启动\n\n创建 ramdisk 镜像：\n```\n$ mkimage -A arm -T linux\
    \ -d ramdisk.img ramdisk\n```\n将其拷贝到 /media/boot\n\n## 练习 10.3 拷贝 system、userdata\
    \ 和 cache 到 SD\n\n将镜像文件“稀疏化”并拷贝到 SD 卡如下：\n\n```\n$ s2img out/target/beaglebone/system.img\
    \ system-ext4.img\n$ sudo dd if=system-ext4.img of=/dev/sdx2 bs=4M\n$ sudo e2label\
    \ /dev/sdx2 system\n$ s2img out/target/beaglebone/userdata.img userdata-ext4.img\n\
    $ sudo dd if=userdata-ext4.img of=/dev/sdx3 bs=4M\n$ sudo e2label /dev/sdx3 data\n\
    $ s2img out/target/beaglebone/cache.img cache-ext4.img\n$ sudo dd if=cache-ext4.img\
    \ of=/dev/sdx4 bs=4M\n$ sudo e2label /dev/sdx4 cache\n```\n\n## 练习 10.4 启动 Beaglebone\n\
    \n将 SD 卡插入 Beaglebone，然后插入 USB 线。设备 /dev/ttyUSB1 将出现：这是串口台。\n\nimg/c6f4acfaca4829cadfb14f4d738cba2c_268_0.png\n\
    \n## LF315 Android 内部：Android 内部原理介绍\n\n将你的用户加入 dialout 组：\n\n```\n$ adduser <name>\
    \ dialout\n```\n\n注销并重新登录以更改（你可以输入 id 来验证你现在是 dialout 的成员）。\n\n设置 /etc/minicom\
    \ 的权限，minicom 可以保存\n\n```\n$ sudo chmod 777 /etc/minicom\n```\n\n输入 minicom -s\
    \ 串口，按 'a' 将串口设备改为 /dev/ttyUSB1。按 'e' 选择速度 115200、无校验、8位数据、1位停止并按回车。选择无硬件流控和软件流控。\n\
    \n回车，选择 Save setup as d 并再次按回车。最后退出 Minicom\n\n再次启动带有折行的行的 minicom\n\n注意：退出 minicom\
    \ 请输入 Ctrl-A 然后 q（即同时按下 Ctrl 和 A，松开后按 q）。\n\n按下 Beaglebone 上的重置按钮（它是以太网右侧的一个非常小的按钮）。\n\
    \n你应该看到内核启动，但随后会出现类似 init: 的消息\n\n14f4d738cba2c_269_0.png\n\nCopyright 2013 Linux\
    \ Foundation. 版权所有。勿分发。\n\nimg/c6f4acfaca4829cadfb14f4d738cba2c_269_1.png\n\n\
    ## 第 10：启动\n\n找不到 '/system/bin/servicemanager'。继续下一个练习以解决问题。\n\n## 练习 10.5 添加自定义\
    \ init 命令\n\n问题在于没有挂载 SD 卡分区的指令。将 init.am35xvm.rc、init.am35xvm.usb.rc 和 fstab.beaglebone\
    \ 从 $HOME/embedded-android/resources/lab10/init 拷贝到你的 device/myorg/myproduct\n\
    \n编辑你的 device.mk 并添加 PRODUCT_COPY_FILES 规则将三个文件包含在构建中。\n\n构建 Android 并新的 ramdisk.img\
    \ 拷贝到 SD 卡。启动 Beaglebone。\n\n## 练习 10.6 让 adb 工作\n\n运行 \"adb devices\"：你应该看到\n\
    \n```\n+ List of devices attached\n0123456789ABCDEF device\n```\n\n如果没有，找到 USB\
    \ 厂商 ID 和产品 ID (*) 并像之前一样将它们添加到 51-android.rules 中。\n\n现在运行 adb shell 并检查你是否获得了\
    \ root shell。\n\n这些数字从哪里来？它们存储在目录 /sys/class/android_usb/android0 中的 idProduct、idVendor、iSerial\
    \ 文件中并由 /init.usb.rc 配置。\n\n"
