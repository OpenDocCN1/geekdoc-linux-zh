    # LF315 Inside Android: an Introduction to Android Internals


    # Summary


    +   - Android is designed to live with low memory

    - Activity manager manipulates the oom_adj value

    - The lowmemory kernel driver kills applications as free memory falls below various
    thresholds

    - Aggressive power management means that the system will after a short timeout
    enter suspend mode

    - Wake locks allow applications to avoid suspend when the UX demands it

    - ... and device drivers during critical actions


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_453_0.png)


