- md: "\n## Session 2 Introduction to Android\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_22_0.png)\n\
    \nAndroid is a four layer cake.\nThe bottom layer is a Linux kernel with a small\
    \ number of modifications.\nThe second layer is the \"user space\" consisting\
    \ of shared libraries (such as the C library, named bionic), command line utilities,\
    \ including a shell, and native daemon processes.\nAlongside, there is a \"hardware\
    \ abstraction layer\" of shared libraries that are used by the next layer to call\
    \ kernel services. Most of this layer is written in C.\nThe third layer, the Android\
    \ Framework, is the main part of Android. It contains a large number (> 50) of\
    \ services and the manager code that forms the interface to the upper application\
    \ layer. The framework is written in a combination of C++ and Java.\nThe top layer\
    \ is where Android applications run. This is the part that most Android developers\
    \ are familiar with since it is extensively documented at developer.android.com.\
    \ Applications are mostly written in Java using the Android SDK, but can contain\
    \ C and C++ code through the use of the NDK.\n\n## Key features\n\n- Designed\
    \ for mobile devices\n  - low power, slow CPU, small amount of RAM, slow storage\n\
    - Touch screen is the primary user interface\n- Applications written in Java using\
    \ component architecture\n  - Dalvik VM instead of more conventional Sun JVM\n\
    - Core components are open source\n\n## Session 2 Introduction to Android\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_24_0.png)\n\n- In essence, Android is\
    \ a version of embedded Linux\n- \"Embedded Android\" means using Android in devices\
    \ other than smart phones or tablets in place of \"normal\" embedded Linux\n-\
    \ What are the advantages?\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_24_1.png)\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_24_2.png)\n\n## Why embedded Android?\n\
    \n- Familiarity\n  - Well documented and supported API\n  - Java is an easy language\
    \ to use\n  - Many developers\n  - End users familiar with and like the user interface\n\
    - Tools\n  - For application programmers: SDK and Eclipse ADT\n  - For developers:\
    \ adb and fastboot\n\n- Robust design\n\n- Source code is available\n\n## Session\
    \ 2 Introduction to Android\n\n### Challenges\n- Android is monolithic\n  - Services\
    \ within the framework are inter-dependent\n  - Removing or modifying one is likely\
    \ to cause others to fail\n- Not easy to add other open source packages\n  - The\
    \ run-time libc (Bionic) is not fully POSIX compatible\n  - File layout does not\
    \ conform to the Linux Filesystem Hierarchy Specification (FHS)\n- Wired network\
    \ interfaces are not supported by the framework\n  - No implementation of ConnectivityManager\
    \ or ConnectivityService\n  - Means Java applications cannot use Ethernet\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_26_0.png)\n\n## Headless Android\n\n\
    - Headless Android = Android without a display\n- Why?\n  - Common OS across a\
    \ range of products, some with UI and some without\n  - Reduced boot time, code\
    \ size, memory usage, power requirement\n- How?\n  - Leave out the display portions\
    \ of the framework:\n  - SurfaceFlinger, WindowManager, WallpaperService, InputManager\n\
    \  - For more information, see http://www.cyborgstack.org/\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_27_0.png)\n\
    \n## Application development tools\n\n- Android SDK\n  - For developing Java applications\n\
    \  - http://developer.android.com/sdk/index.html\n- Android NDK (Native Development\
    \ Kit)\n  - For developing methods and activities using \"native code\" (i.e.\
    \ C/C++)\n  - Get it from the same URL as the SDK\n- Eclipse plugin, Android Developer\
    \ Tools (ADT)\n  - Point-and-click application development\n  - http://developer.android.com/tools/index.html\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_28_0.png)\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_28_1.png)\n\
    \n## LF315 Inside Android: an Introduction to Android Internals\n\n| Code name\
    \ | Version | API level |\n| :--- | :--- | :--- |\n| Jelly Bean | 4.3 | 18, NDK\
    \ r9 |\n| Jelly Bean | 4.2.x | 17 |\n| Jelly Bean | 4.1.x | 16 |\n| Ice Cream\
    \ Sandwich | 4.0.3 - 4.0.4 | 15, NDK r8 |\n| Ice Cream Sandwich | 4.0.1 - 4.0.2\
    \ | 14, NDK r7 |\n| Honeycomb | 3.2.x | 12, NDK r6 |\n| Honeycomb | 3.1 | 11 |\n\
    | Honeycomb | 3 | 11 |\n| Gingerbread | 2.3.3 - 2.3.7 | 10 |\n| Gingerbread |\
    \ 2.3 - 2.3.2 | 9, NDK r5 |\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_29_0.png)\n\
    \n## Session 2 Introduction to Android\n\n## Note on API levels\n\n- **API level**\
    \ refers to the Android framework API (Java and xml)\n  - API levels are backward\
    \ compatible: an application written to API level 10 will work on all later levels\n\
    - **NDK level** is the NDK version number\n  - i.e. defines the C/C++ API offered\
    \ by the NDK\n  - NDK versions are likewise backwards compatible\n  - For more\
    \ details, see ndk/docs/STABLE-APIS.html\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_30_0.png)\n\
    \n## The Android Open Source Project\n\n- The source code and build tools are\
    \ released by Google as the AOSP\n- http://source.android.com/\n- New versions\
    \ of Android are developed \"behind closed doors\" by members of the OHA\n- The\
    \ code is added to the AOSP repositories some time after internal release\n  -\
    \ Usually after a few weeks\n  - Sometimes not at all, as with Honeycomb\n\nThe\
    \ AOSP does not include the source code for the Linux kernel nor bootloader. You\
    \ must obtain and adapt these components ourselves. We will talk about both in\
    \ later chapters.\nThe reason for not releasing the Honeycomb source was that\
    \ it was in a state of flux, being the first time Android had run on tablet hardware.\
    \ The Android developers did not want others to base products on in until both\
    \ tablet and phone could be supported in a single codebase.\n\n## Session 2 Introduction\
    \ to Android\n\n## Licenses\n\n- Most of the code is licensed using permissive\
    \ licenses (BSD/Apache)\n- Policy is to exclude GPL code from user space\n- Main\
    \ licenses used\n  - GPL: kernel and Bluetooth stack (bluez/dbus)\n  - BSD: C\
    \ library (bionic)\n  - Apache 2.0: everything\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_32_0.png)\n\
    \n## LF315 Inside Android: an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_33_0.png)\n\
    \nThe Android Compatibility Document (CDD) defines hardware and software:\n- Display:\
    \ at least 480x\n- Support OpenGL ES 1.0 and 2.0\n- RAM: 256MB\n- Internal flash\
    \ memory: 50MB\n- Must allow update of entire system\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_33_1.png)\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_33_2.png)\n\nCopyright © 2013 Linux\
    \ Foundation. All rights reserved.\n\n## Session 2 Introduction to Android\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_34_0.png)\n\n## LF315 Inside Android:\
    \ an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_35_0.png)\n\
    \n- Hardware: reasonable PC, e.g. Dual core, 4 GB RAM, 50 GB disk space\n- Operating\
    \ system: Ubuntu 10.04, 64-bit\n  - \"Building a newer version of Ubuntu is currently\
    \ only supported\"\n- For details and list of packages to install, see `http://source.android.com/initializing.html`\n\
    - A fast connection to the Internet\n\n## Session 2 Introduction to Android\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_36_0.png)\n\n- Repo is a tool to manage\
    \ code repositories\n- Really just a wrapper for git\n\nGet it like so:\n```bash\n\
    $ curl https://dl-ssl.google.com/dl/googlesource/git-repo/repo > ~/bin/repo\n\
    $ chmod a+x ~/bin/repo\n```\n\n- Begin by initializing a local repository with\n\
    ```bash\nrepo -u <manifest> <branch>, for example\n$ mkdir ~/myandroid\n$ cd myandroid\n\
    $ repo init -u <manifest> https://android.googource.com/platform/manifest -b android.4.2_r1\n\
    ```\n"
  mdcn: "\n\n## 第二节 Android 简介\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_22_0.png)\n\
    \nAndroid 像一个四层饼蛋糕。\n底层是经过少量修改的 Linux 内核。\n第二层是“用户空间”，由共享库（如 C 库，命名为 bionic）、命令行工具（包括\
    \ shell）以及原生守护进程组成。\n与此同时，还有一层名为“硬件抽象层”（HAL）的共享库，这些库供下一层调用以访问内核服务。该层的大部分是用 C 语言编写的。\n\
    第三层是 Android 框架（Android Framework），它是 Android 的主体部分。它包含了大量的（>50 个）服务以及形成上层应用接口的管理器代码。框架由\
    \ C++ 和 Java 混合编写。\n顶层是 Android 应用程序运行的地方。这是大多数 Android 开发者熟悉的部分，因为在 developer.android.com\
    \ 上有详尽的文档。应用程序大部分使用 Android SDK 用 Java 编写，但也可以通过 NDK 使用 C 和 C++ 代码。\n\n## 核心特性\n\
    \n- 针对移动设备设计\n  - 低功耗、慢 CPU、小内存、低速存储\n- 触摸屏是主要的用户界面\n- 使用组件架构用 Java 编写应用程序\n \
    \ - 使用 Dalvik VM 而非传统的 Sun JVM\n- 核心组件开源\n\n## 第二节 Android 简介\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_24_0.png)\n\
    \n- 从本质上说，Android 是版本的嵌入式 Linux\n- “嵌入式 Android”意味着在手机或平板电脑以外的设备上使用 Android 代替“普通”嵌入式\
    \ Linux\n- 优势是什么？\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_24_1.png)\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_24_2.png)\n\
    \n## 为什么选择嵌入式 Android？\n\n- 熟悉\n  - 文档齐全且支持良好的 API\n  - Java 是一种易于使用的语言\n  - 开发者多\n\
    \  - 终端用户熟悉并喜欢该界面\n- 工具\n  - 对于应用程序员：SDK 和 Eclipse ADT\n  - 对于开发者：adb 和 fastboot\n\
    \n- 健壮的设计\n\n- 源码可用\n\n## 第二节 Android 简介\n\n### 挑战\n- Android 是单体架构\n  - 框架内的服务之间相互依赖\n\
    \  - 移除或修改其中一个可能会导致其他服务失效\n- 不易于添加其他开源包\n  - 运行时 libc (Bionic) 并不完全兼容 POSIX\n\
    \  - 文件布局不符合 Linux 文件系统层次结构规范 (FHS)\n- 框架不支持有线网络接口\n  - 没有 ConnectivityManager\
    \ 或 ConnectivityService\n  - 意味着 Java 应用程序无法使用以太网\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_26_0.png)\n\
    \n## 无头 Android (Headless Android)\n\n- 无头 Android = 没有显示器的 Android\n- 为什么？\n\
    \  - 跨产品线的通用操作系统，有些带 UI，有些没有\n  - 缩短启动时间、代码 own、内存占用和功耗需求\n- 如何实现？\n  - 去掉框架中的显示部分：\n\
    \  - SurfaceFlinger, WindowManager, WallpaperService, InputManager\n  - 更多信息请访问\
    \ http://www.cyborgstack.org/\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_27_0.png)\n\
    \n## 应用开发工具\n\n- Android SDK\n  - 用于开发 Java 应用程序\n  - http://developer.android.com/sdk/index.html\n\
    - Android NDK (原生开发包)\n  - 用于使用“原生代码”（即 C/C++）的方法和活动\n  - 从 SDK 相同的 URL 获取\n-\
    \ Eclipse 插件 Android Developer Tools (ADT)\n  - 点点式开发\n  - http://developer.android.com/tools/index.html\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_28_0.png)\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_28_1.png)\n\
    \n## LF315 Inside Android：Android 内部\n\n| 代码名称 | 版本 | API级别 |\n| :--- | :--- |\
    \ :--- |\n| Jelly Bean | 4.3 | 18, NDK r9 |\n| Jelly Bean | 4.2.x | 17 |\n| Jelly\
    \ Bean | 4.1.x | 16 |\n| Ice Cream Sandwich | 4.0.3 - 4.0.4 | 15, NDK r8 |\n|\
    \ Ice Cream Sandwich | 4.0.1 - 4.0.2 | 14, NDK r7 |\n| Honeycomb | 3.2.x | 12,\
    \ NDK r6 |\n| Honeycomb | 3.1 | 11 |\n| Honeycomb | 3 | 11 |\n| Gingerbread |\
    \ 2.3.3 - 2.3.7 | 10 |\n| Gingerbread | 2.3 - 2.3.2 | 9, NDK r5 |\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_29_0.png)\n\
    \n## 第二节 Android 简介\n\n## 关于 API 级别的说明\n\n- **API level** 指 Android 框架 API（Java\
    \ 和 xml）\n  - API 向后兼容：针对 API 10 编写的程序可以在所有后续级别运行\n- **NDK level** 是 NDK 版本\n\
    \  - 即 NDK 提供的 C/C++ API\n  - NDK 版本同样向后兼容\n  - 详情见 ndk/docs/STABLE-APIS.html\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_30_0.png)\n\n## Android 开源项目 (AOSP)\n\
    \n- 源码和构建工具由 Google 以 AOSP 发布\n- http://source.android.com/\n- Android 新版本由 OHA\
    \ 成员“内部”开发\n- 代码在内部发布一段时间后加入 AOSP 仓库\n  - 通常是几周后\n  - 有时完全不加入，如 Honeycomb 版本\n\
    \nAOSP 不包含 Linux 内核或引导加载程序的源码。我们必须自己获取并适配这些组件。将在后面的章节中讨论这两者。不发布 Honeycomb 源码是因为它当时处于变动状态，那是\
    \ Android 首次运行在平板硬件上。\n\n## 第二节 Android 简介\n\n## 许可协议 (Licenses)\n\n- 大部分代码使用宽松性许可证\
    \ (BSD/Apache)\n- 策略是从用户空间中排除 GPL 代码\n- 使用的主要许可证\n  - GPL：内核和蓝牙栈 (bluez/dbus)\n\
    \  - BSD：C 库 (bionic)\n  - Apache 2.0：所有\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_32_0.png)\n\
    \n## LF315 Inside Android：Android 内部\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_33_0.png)\n\
    \nAndroid 兼容性文档 (CDD) 定义了硬件和软件：\n- 显示：至少 480x\n- 支持 OpenGL ES 1.0 和 2.0\n- 内存：256MB\n\
    - 内部闪存内存：50MB\n- 必须允许更新更新\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_33_1.png)\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_33_2.png)\n\nCopyright © 2013 Linux\
    \ Foundation. 版权所有。\n\n## 第二节 Android 简介\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_34_0.png)\n\
    \n## LF315 Inside Android：Android 内部\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_35_0.png)\n\
    \n- 硬件：配置合理的 PC，例如双核、4 GB 内存、50 GB 磁盘空间\n- 操作系统：Ubuntu 10.04, 64位\n  - “目前仅支持构建更高版本的\
    \ Ubuntu”\n- 详情和要安装的包列表，请见 `http://source.android.com/initializing.html`\n- 快速连接互联网\n\
    \n## 第二节 Android 简介\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_36_0.png)\n\n\
    - Repo 是一个管理代码仓库的工具\n- 实际上只是 git 的封装\n\n如下如下获取：\n```bash\n$ curl https://dl-ssl.google.com/dl/googlesource/git-repo/repo\
    \ > ~/bin/repo\n$ chmod a+x ~/bin/repo\n```\n\n- 通过以下命令初始化本地仓库\n```bash\nrepo\
    \ -u <manifest> <branch>, 例如\n$ mkdir ~/myandroid\n$ cd ~/myandroid\n$ repo init\
    \ -u <manifest> https://android.googource.com/platform/manifest -b android.4.2_r1\n\
    ```\n\n"
