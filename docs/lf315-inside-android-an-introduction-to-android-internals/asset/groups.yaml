    \n# 第 9 节：Android 内核\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_222_0.png)\n\n\
    - 内核模块包含可以在启动后加载到内核空间的代码\n- 模块的许可协议是模糊的\n  - 对 GPL 的严格解读表明，模块应该受相同许可证的\n  - 然而，模块包含专有代码是种接受的惯常做法\n\
    \  - 通常用于 GPU 和 WiFi 适配器的仅二进制驱动程序\n- 模块和内核必须使用相同的工具链进行编译，且运行时使用的内核必须与编译时相同，否则模块将无法加载\n\
    \n# 内核模块命令\n\n- insmod <module file>: 加载模块\n  - 需要 root 权限\n- lsmod: 列出已加载的模块\n\
    - rmmod <module name>: 移除（卸载）模块\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_223_0.png)\n\
    \n# 第 9 节：Android内核\n\n# 总结\n\n- Android 使用 Linux 内核，并针对移动操作系统的需求进行了少量修改\n- 内核源码不是\
    \ AOSP 的一部分\n- 内核必须与 AOSP 独立编译\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_224_0.png)\n\
    \n# 实验 9\n\n### 练习 9.1：编译内核\n\n目标：为 Beaglebone 构建内核\n\n在这种情况下，你只需要从 rowboat 项目获取\
    \ Linux 3.2 内核，该内核支持 TI AM355 SoC 并带有 Android 补丁。\n\n```bash\ncd ~/embedded-android\n\
    git clone git://github.com/rowboat/kernel\ncd kernel\ngit checkout rowboat-am35x-kernel\n\
    ```\n\n```bash\npatch -p1 < ~/embedded-android/resources/lab9/change-default-kernel-to-boot.patch\n\
    ```\n\n现在进行编译。你需要先 source envsetup.sh 并运行 lunch 选择 Beaglebone 目标以选取 Android 工具链。然后回到\
    \ kernel 目录：\n\n# 第 9 节：Android内核\n\n```bash\nexport ARCH=arm\nexport CROSS_COMPILE=arm-linux-gnueabi-\n\
    make am335x_evm_android_config\nmake -j4 uImage\n```\n\n检查 arch/arm/boot/uImage\
    \ 的大小：它应该是 4 MiB 左右。\n\n# LF315 深入 Android：Android 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_227_0.png)\n\
    \n# 第 10 节大：启动\n\n- 启动基础\n- Fastboot\n- U-Boot\n- Android init 和 init.rc\n- 系统属性\n\
    \nCopyright © 2013 Linux Foundation. 保留所有权利。请勿传播。\n\n# 第 10 节：启动\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_228_0.png)\n\
    \n到 Jelly Bean 版本，可以在 bootable/bootloader/legacy 找到引导程序代码。某些 Android 设备使用 Little\
    \ Kernel 引导程序，参见 https://codeaurora.org/tags/little-kernel。fastboot 协议定义位于 bootable/bootloader/legacy/fastboot_protocol.txt。目前还不确定规范存放在哪里。LINUX\
    \ FOUNDATION Copyright © 2013 保留所有权利。\n\n# 旧式启动方式\n\n- 引导程序位于已知向量的 NOR flash\n\
    - 早期启动设置 SDRAM 并重定位到 RAM\n- 主启动代码在 RAM 中运行\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_229_0.png)\n\
    \n由于 NOR flash 可以按字节访问并映射到处理器地址空间，代码可以立即执行。\n\n# 第 10 节：启动\n\n### 从 NAND flash\
    \ 启动\n\n- 不再使用 NOR flash - 太贵\n- NAND flash 复杂得多，需要代码运行\n- 代码必须存储在某处，通常在 SoC 内部\n\
    - 典型序列：\n  - 启动代码从 NAND (或 MMC、USB...)加载预启动加载到内部 RAM (SRAM)\n  - 预启动加载的大小受 SRAM\
    \ 限制，通常为 16 KiB .. 128 KiB\n  - 预启动加载初始化 SDRAM\n  - 将主引导程序加载到 SDRAM 并启动\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_230_0.png)\n\
    \nNAND flash 内存只能一次访问一个页面，页面通常为 2048 字节。对 NAND flash 页面的访问是在程序控制下进行的，这在引导阶段会导致鸡生蛋问题。因此，\
    \ SoC 内部必须有一些代码能够从 NAND flash 加载一个或多个页面。许多 扩展了此代码，能够从 MMC、UART 和 USB 等源加载。###\
    \ 从 SD\n\n- 在 TI OMAP 和 Sitara 芯片上，启动代码可以从 SDIO (SD 卡)接口加载镜像\n- 文件必须命名为 MLO\n\
    - 它必须存储在卡的第一个分区\n- 它必须使用 FAT32 格式\n\nBeagleboard 拥有 Sitara 335x 芯片，其启动代码可以从 MMC（在我们的案例中连接到\
    \ SD 卡器）加载。代码非常有限，因此分区格式需要为 FAT32 名称固定为 \"MLO\"。MLO 二进制文件可以从 U-Boot 源码编译。\n\n\
    # Fastboot\n\n- fastboot 可以指三个内容：\n  - 一种用于向内存加载和编程镜像的 USB 协议\n  - 一个命令行工具\n \
    \ - 该协议的二进制实现\n- 注意：fastboot 不是为了启动速度；而是为了加快开发过程\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_232_0.png)\n\
    \n# 进入 fastboot 模式\n\n```bash\nadb reboot bootloader\n```\n\n- 然后你可以使用 fastboot\
    \ 命令与它通信\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_233_0.png)\n\n# Fastboot\
    \ 命令\n\n- 基础命令\n- devices：列出接受 fastboot 命令的设备\n- getvar：获取变量：\n  - version, product,\
    \ serialno, secure\n- 注意：secure 为 yes 表示引导程序在安装前需要签名\n- continue：继续正常启动启动\n- reboot：重启设备\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_234_0.png)\n\n# Fastboot 命令\n\n- Flash\
    \ 命令\n- erase <partition>\n- flash <partition> <filename>\n- flashall\n\n# 第 10\
    \ 节：启动\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_236_0.png)\n\n# LF315 深入 Android：Android\
    \ 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_237_0.png)\n\n- U-Boot 是一个开源引导加载程序\n\
    - 常用于开发板（如 Beaglebone）\n- 支持广泛的硬件\n- 易自定义\n- 参考 http://www.denx.de/\n\n# 第 10\
    \ 节：启动\n\n# U-Boot 命令\n\n- U-Boot 可以在串口上提供用户界面\n- 命令包括转储/修改内存位置和寄存器\n- 从 NOR/NAND\
    \ flash、SD 卡、串口、网络等加载内核镜像\n- 启动内核镜像\n\n![]((img/c6f4acfaca4829cadfb14f4d738cba2c_238_0.png)\n\
    \n# 示例命令\n\n- 从 NAND flash 加载镜像（例如内核）\n  - nand read <RAM address> <flash address>\
    \ <length>\n- 示例\n  - nand read 80100000 1000000 200000\n- 从 SD 卡加载内核\n  - fatload\
    \ mmc <device>:<partition> <RAM address> <file>\n- 示例\n  - mmc rescan 0\n  - fatload\
    \ mmc 0:1 80100000 uImage\n- 启动 RAM 中的内核镜像\n  - bootm 80100000\n\n"
