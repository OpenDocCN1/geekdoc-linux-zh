    # Lab 2


    Exercise 2.1 Install Java


    The Android build tools require a 64-bit Java JDK, which you can download from
    java.oracle.com. But in this case you will install it from the bundle of files
    supplied:


    ```

    $ cd ~

    $ sh ~/embedded-android/resources/jdk/jdk-6u38-linux-x64.bin

    ```


    And add it to the PATH by adding the following line to the end of your .bashrc
    file:


    ```

    JAVA_HOME=${HOME}/jdk1.6.0_38

