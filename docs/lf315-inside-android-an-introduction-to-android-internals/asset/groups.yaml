    \ 或\n  - Vendor_XXXX_Product_XXXX_Version_XXXX.idc\n  - 例如 Vendor_045e_Product_028e.idc\n\
    - 在所有情况下，如果未找到特定的 .idc 文件，则回退到 Generic .idc\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_425_0.png)\n\
    \n实验 16\n\n**练习 16.1** 运行 `getevent -l` 并识别输入设备\n\n**练习 16.2** 查看键布局文件\n\n## LF315\
