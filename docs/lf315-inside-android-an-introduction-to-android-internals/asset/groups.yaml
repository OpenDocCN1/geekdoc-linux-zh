    # Top level repo directories (1)


    +   - bionic: the bionic C library

    - bootable: bootloader and fastboot protocol

    - build: the build system

    - cts: compatibility test suite

    - dalvik: the Dalvik virtual machine

    - development: development tools

    - device: configurations for various devices

    - docs: scrips ad templates to generate all the Android documentation

    - external: third-party code, mostly OSS


    To build the documentation in docs/, change into that directory and run the build
    script:


    ```

    $ cd docs

    $ python scripts/build.py

    ```


    This generates the directory ./out, which is the fully built site.

    There is even a http server in scripts/micro-httpd.py which is helpful for testing
    the site on your own machine.


    ```

    $ cd /out

    $ HTTP_PORT=8080 python ../scripts/micro-httpd.py

    ```'
