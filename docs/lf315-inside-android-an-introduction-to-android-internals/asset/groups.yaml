    \n# Lab 9\n\n### Exercise 9.1: Build the kernel\n\nObjective: Build the kernel\
    \ for Beaglebone\n\nIn this case you are simply going to take the Linux 3.2 kernel\
    \ from the rowboat project, which has support for TI AM355 SoC and Android patches.\n\
    \n```bash\ncd ~/embedded-android\ngit clone git://github.com/rowboat/kernel\n\
