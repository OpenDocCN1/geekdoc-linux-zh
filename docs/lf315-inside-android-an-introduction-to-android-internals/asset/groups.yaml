  - "[PAGE 447]\n\n# Issue caused by wake locks\n\n+   - Wake locks are very intrusive\
    \ in kernel code\n  - One of the largest components in any Android kernel patch\n\
    - Many drivers and subsystems have to acquire wake locks to operate correctly\n\
    \  - rtc alarms, input devices, mmc devices, wifi devices"
  - '[PAGE 448]


    # Application wakes locks


    The wakelock driver can be controlled from user space by two files:


    +   * /sys/power/wake_lock - writing a string to this file creates a wakelock
    with that name

    * /sys/power/wake_unlock - writing the same string to this file releases the wakelock


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_448_0.png)


    Hence a simple way to prevent the system sleeping while debugging is to create
    a wakelock:

    echo testwakelock > /sys/power/wake_lock'
