    \ with ConnectivityManager\n\n- Started as a service in init.rc\n\n- Written as\
    \ a separate daemon running as root to isolate higher components from root privilege\
    \ level\n- Introduced in 2.2, Froyo\n\nCopyright © 2013 Linux Foundation.\nAll\
    \ rights reserved. DO NOT DISTRIBUTE.\n\n# Session 15 Network\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_400_0.png)\n\
    \n- Manages the various network connections\n- Falls back to other connections\
    \ when one fails\n- Notifies the system when one becomes available/unavailable\n\
    - Allows the applications to retrieve various information about connectivity\n\
    \nCopyright © 2013 Linux Foundation. All rights reserved. DO NOT DISTRIBUTE.\n\
    \n# Types of network interface\n\n- ConnectivityManager fully supports\n- TYPE_MOBILE_DUN,\
    \ TYPE_MOBILE_HIFI,\n  TYPE_MOBILE_MMS, TYPE_MOBILE_SUPL\n- TYPE_BLUETOOTH\n-\
    \ TYPE_WIFI\n- TYPE_ETHERNET\n\n# Session 15 Network\n\n# 393\n\n# Interface management\n\
    \n- Normal mode\n  - Only one interface up, wlan0 or rmnet0\n- USB tethered mode\n\
    \  - Turn on IP forwarding\n  - Bring up rndis0 as USB gadget\n  - Add route to\
    \ rndis0\n  - Launches /system/bin/dnsmasq\n- WiFi hotspot\n  - Takes down WiFi\
    \ interface (wlan0)\n  - Brings up access point interface (e.g. athap0)\n  - Creates\
    \ a route as for tethering\n\n# LF315 Inside Android: an Introduction to Android\
    \ Internals\n\n# Ethernet problems\n\n- Ethernet is not a first citizen in Android\n\
    - The lower level tools (netcfg...) work but ConnectivityManager ignores it\n\
    - Some apps don't work (e.g.: Google Play store)\n- The browser is OK because\
    \ it bypasses CM (but multimedia will fail)\n- One solution: the Ethernet Connectivity\
    \ Manager (ECM) patch from the Android team\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_403_0.png)\n\
    \n# Lab 15\n\n**Exercise 15.1 Configure the network interface**\n\nPlug a network\
    \ cable into the Beaglebone.\n\nUse netcfg and ifconfig to bring up eth0 and give\
    \ it an IP address. Check that you can ping other nodes on the network. Configure\
    \ the device to bring up eth0 using DHCP\n\nIf you have access to the web, try\
    \ the browser and check that you can access sites.\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_405_0.png)\n\
    \n# Session 16 Input devices\n\n397\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_406_0.png)\n\
    \nCopyright © 2013 Linux Foundation. All rights reserved.\n\n# Android input layers\n\
    \n- From the bottom...\n- Linux evdev drivers generate events and pass them up...\n\
    - EventHub reads events from all drivers and passes them up...\n- InputReader\
    \ decodes the events and translates them into Android events\n- InputDispatcher\
    \ sends events to the appropriate window\n\nThe code for the Android components\
    \ is in\nEventHub: frameworks/base/services/input/EventHub.cpp\nInputReader: frameworks/base/services/input/InputReader.cpp\n\
    InputDispatcher: frameworks/base/services/input/InputDispatcher.cpp\n\n# Session\
    \ 16 Input devices\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_408_0.png)\n\n\
    - The Linux input layer (evdev) provides an event mechanism for devices that generate\
    \ unsolicited data\n- Most often used for human input devices: Keyboard, mouse,\
    \ touchscreen, gamepad\n- These events are handled by EventHub and above\n- But\
    \ also for other devices that generate input from time to time: Proximity sensor,\
    \ compass\n- These events are handled by the Android sensors subsystem\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_408_1.png)\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_408_2.png)\n\n# Input device drivers\n\
    \n- The structure of event drivers is described in the Linux source tree in Documentation/input\n\
    - As each input driver registers a node is created in /dev/input\n- Reading from\
    \ the node returns events\n- There are various ioctl commands to get other information\n\
    \n```\nls /dev/input\nevent0\nevent1\nevent2\nevent3\nevent4\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_409_0.png)\n\
    \n# Session 16 Input devices\n\n401\n\n# The getevent tool\n\n- The Android command\
    \ getevent is useful when investigating input devices\n- Use getevent -h for a\
    \ list of options\n\n```\n# getevent\nadd device 1: /dev/input/event4\nname: \"\
    lightsensor-level\"\nadd device 2: /dev/input/event3\nname: \"proximity\"\nadd\
    \ device 3: /dev/input/event2\nname: \"tuna-gpio-keypad\"\nadd device 4: /dev/input/event0\n\
    name: \"barometer\"\nadd device 6: /dev/input/event1\nname: \"Melsas MMSxx Touchscreen\"\
    \n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_410_0.png)\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_410_1.png)\n\
    \nCopyright © 2013 Linux Foundation. All rights reserved\n\n# LF315 Inside Android:\
    \ an Introduction to Android Internals\n\n# Events\n\n- Each event is described\
    \ by a 16-byte input_event\n\n```\nstruct input_event {\n    struct timeval time;\n\
    \    __u16 type;\n    __u16 code;\n    __s32 value;\n}\n```\n\n- time: timestamp\n\
    - type: type of event, e.g. key press, mouse movement\n- code: dependent on type,\
    \ e.g. for keyboard, code = keycode\n- value: dependent on the type, e.g. for\
    \ keyboard 1 for press, 0 for release\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_411_0.png)\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_411_1.png)\n\nCopyright © 2013 Linux\
    \ Foundation. All rights reserved. DO NOT DISTRIBUTE.\n\n# Event types\n\n* Keyboard\n\
    \    * type = EV_KEY\n    * code = keycode, as defined in include/uapi/linux/input/\n\
    \    * value = 1 (keydown) 0 (keyup)\n* Mouse\n    * type = EV_REL\n    * code\
    \ = REL_X or REL_Y\n    * value = X or Y coordinate\n* Touchscreen\n    * type\
    \ = EV_ABS\n    * code = ABS_X, ABS_Y, ABS_Z (pressure)\n    * value = X, Y or\
    \ Z coordinate\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_412_0.png)\n\nSync\
    \ events Because some event types, e.g. EV_ABS, require 2 or 3 event packets to\
    \ give full information about X, Y and Z there needs to be a method to indicate\
    \ all input has been reported: EV_SYN\n\n- type = EV_SYN\n- code = SYN_REPORT\n\
    - value = 0\n\n- All event reports, including single value events such as keyboards,\
    \ must send an EV_SYN to indicate the end of this report\n"
