  - "[PAGE 81]\n\n# Coding an application\n\n+   - The next few slides show a very\
    \ simple application\n- Applications are mostly written in Java and compiled to\
    \ byte code for the Dalvik virtual machine\n  - As we shall see later, it it possible\
    \ to write applications in C/C++, but much harder to do\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_81_0.png)"
- md: "\n## Session 4 Anatomy of an application\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_82_0.png)\n\
    \nTo create a Dalvik executable, first use the Java compiler, javac, to create\
    \ a \".class\" file and then use the Dalvik compiler, dx, to create a \".dex\"\
    \ file.\n\nThe name, Dalvik, comes from a small town on the north coast of Iceland,\
    \ which is the ancestral home of one of the developers. It is also a very long\
    \ way from the island of Java in the South Pacific.\n\n## Create a project\n\n\
    - * You can use Eclipse with Android Development Toolkit plugin\n    - Read the\
    \ tutorials at http://developer.android.com/\n- Or use the android command-line\
    \ tool\n    - -target platform ID (list using android list targets)\n    - -name\
    \ application name seen by the user\n    - -path directory for the project files\n\
    \    - -activity initial activity class name\n    - -package package name (lower\
    \ case, alphabetic)\n\n```bash\n$ android create project --target 1 --name HelloWorld\
    \ \\\n--path ./helloworld --activity HelloWorldActivity \\\n--package com.example.helloworld\n\
    ```\n\n## Session 4 Anatomy of an application\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_84_0.png)\n\
    \n## The manifest: AndroidManifest.xml\n\n- Top-level description of the application\n\
    - Amongst other things, it contains\n\n- * minSdkVersion=\"N\": this app requires\
    \ API level N or later\n- package=\"...\" - name of the package\n- Entry points\
    \ for the various components:\n\n```xml\n<activity> ... </activity> - an activity\n\
    <service> ... </service> - a service\n<receiver> ... </receiver> - a broadcast\
    \ receiver\n<provider> ... </provider> - a content provider\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_85_0.png)\n\
    \nMore information about AndroidManifest.xml is at http://developer.android.com/guide/topics/manifest/intro.html\n\
    \n## Session 4 Anatomy of an application\n\n### AndroidManifest.xml (1)\n\n- The\
    \ first part might look like this\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n    package=\"com.example.helloworld\"\n    android:versionCode=\"1\"\n    android:versionName=\"\
    1.0\">\n    <uses-sdk android:minSdkVersion=\"10\" />\n    ..\n</manifest>\n```\n\
    \n### AndroidManifest.xml (2)\n\n- Within the manifest part, define an application\
    \ with a label\n- The label is a human-readable name for the application\n- Usually\
    \ the label is a string resource\n\n```xml\n<manifest ...>\n  <application android:label=\"\
    @string/app_name\">\n    ...\n  </application>\n</manifest>\n```\n\n## Session\
    \ 4 Anatomy of an application\n\n### AndroidManifest (3)\n\n- Within the application\
    \ part, define components, in this case a single activity\n- It has a name, which\
    \ matches the Java class name\n- and a label, which is displayed when the activity\
    \ is visible\n\n```xml\n<activity android:name=\"HelloWorldActivity\" android:label=\"\
    @string/app_name\">\n...\n</activity>\n```\n\n### AndroidManifest.xml (4)\n\n\
    Within the activity part, there should be an intent-filter\n\n- defines which\
    \ intents (messages) can be passed through this activity\n- In order that the\
    \ main activity can be started by the launcher (or home app) you will need an\
    \ intent-filter like this\n\n```xml\n<intent-filter>\n  <action android:name=\"\
    android.intent.action.MAIN\" />\n  <category android:name=\"android.intent.category.LAUNCHER\"\
    \ />\n</intent-filter>\n```\n\n## Session 4 Anatomy of an application\n\n- res/layout/main.xml\
    \ defines the screen layout\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
    ?>\n<LinearLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n    android:orientation=\"vertical\"\n    android:layout_width=\"fill_parent\"\
    \n    android:layout_height=\"fill_parent\">\n  <TextView\n    android:layout_width=\"\
    fill_parent\"\n    android:layout_height=\"wrap_content\"\n    android:text=\"\
    Hello World, HelloWorld\"/>\n</LinearLayout>\n```\n\n## Inside Android: an Introduction\
    \ to Android Internals\n\nFor this simple example, we just need\n- a class \"\
    HelloWorldActivity\" which extends \"Activity\"\n- the onCreate function which\
    \ is called when it is first started\n- in onCreate, call setContentView(R.layout.main);\
    \ to display the UI defined in the screen layout\n\n- The source file goes in\n\
    - src/com/example/helloworld/HelloWorld.java\n\n## Session 4 Anatomy of an application\n\
    \n```java\npackage com.example.helloworld;\n\nimport android.app.Activity;\nimport\
    \ android.os.Bundle;\n\npublic class HelloWorldActivity extends Activity {\n \
    \   /** Called when the activity is first created. */\n    @Override\n    public\
    \ void onCreate(Bundle savedInstanceState)\n    {\n        super.onCreate(savedInstanceState);\n\
    \        setContentView(R.layout.main);\n    }\n}\n```\n\n## Build\n\n- You can\
    \ build from command line using ant, a tool similar to make\n- ant uses rules\
    \ in build.xml\n- The default rules define options debug and release\n- Or build\
    \ using Eclipse ADT\n- Generates an Android package in project name/bin\n\n```bash\n\
    $ ant debug\nBuildfile: build.xml\n...\nBUILD SUCCESSFUL\nTotal time: 1 second\n\
    ```\n\n## Session 4 Anatomy of an application\n\n- Applications are packaged into\
    \ .apk format\n- A zipped archive\n\n```bash\n$ unzip -l bin/HelloWorld-debug.apk\n\
    Archive: bin/HelloWorld-debug.apk\nLength Date Time Name\n------------------------------------------------------\n\
    708 2013-03-24 11:33 res/layout/main.xml\n1316 2013-03-24 11:33 AndroidManifest.xml\n\
    776 2013-03-24 11:33 classes.dex\n```\n\n## Install\n\n- You can install on the\
    \ target using adb\n- The option replaces any existing app\n\n```bash\n$ adb install\
    \ -r bin/HelloWorld-debug.apk\nSuccess\n```\n\n- Note: you can remove the app\
    \ entirely with adb\n```bash\n$ adb uninstall com.example.helloworld\n```\n\n\
    ## Session 4 Anatomy of an application\n\n## Applications and processes\n\n- Each\
    \ application runs in a separate Dalvik machine\n- Each virtual machine runs as\
    \ a separate Linux process\n- A process cannot access memory belonging to other\
    \ processes\n- If a process terminates (e.g. crashes) it does not affect others\
    \ (unless there is some explicit dependency)\n\n## Application user IDs\n\n- The\
    \ process model prevents interference with memory belonging to another application\n\
    - By using unique user IDs per application, other applications cannot access files\n\
    - Application user IDs are allocated during installation, starting at 10000\n\
    - So, app_26 is uid 10000 + 26 = 10026\n- Stored in /data/system/packages.xml\n\
    - All files belonging to the application are set to have the same user ID\n- Other\
    \ applications (with different user IDs) cannot access these files\n\n## Session\
    \ 4 Anatomy of an application\n\n```bash\n# ps\nUSER PID PPID VSIZE RSS CMD\n\
    root 1 0 296 204 S /init\n\nu0_a3 483 37 208712 43012 S android.process.acore\n\
    u0_a10 545 37 196260 49560 S com.android.launcher\nu0_a21 697 37 183644 18568\
    \ S com.android.exchange\nu0_a26 839 37 174256 20680 S com.svox.pico\nu0_a45 872\
    \ 37 176476 20860 S com.example.helloworld\nroot 4807 46 764 480 S /system/bin/sh\n\
    root 4894 4807 1092 436 R ps\n```\n"
  mdcn: "\n\n## 第 4 ：应用程序结构\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_82_0.png)\n\
    \n要创建一个 Dalvik 可执行文件，首先使用 Java 编译器 `javac` 创建一个 \".class\" 文件，然后使用 Dalvik 编译器\
    \ `dx` 创建一个 \".dex\" 文件。\n\nDalvik 这个名字源于冰岛北岸的一个小镇镇，那里是其中一名开发者的祖乡。它距离南太平洋的 Java\
    \ 岛非常遥远。\n\n## 创建项目\n\n- * 你可以使用带有 Android Development Toolkit 插件的 Eclipse\n \
    \   - 在 http://developer.android.com/ 查看教程\n- 或者使用 android 命令行工具\n    - -target\
    \ 平台 ID（使用 `android list targets` 列出）\n    - -name 用户可见的应用程序名称\n    - -path 项目文件的目录\n\
    \    - -activity 初始活动类名\n    - -package 包名（小写，字母组成）\n\n```bash\n$ android create\
    \ project --target 1 --name HelloWorld \\\n--path ./helloworld --activity HelloWorldActivity\
    \ \\\n--package com.example.helloworld\n```\n\n## 第 4 ：应用程序结构\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_84_0.png)\n\
    \n## Manifest 文件：AndroidManifest.xml\n\n- 应用程序的顶层描述\n- 除其他内容外，它包含\n\n- * minSdkVersion=\"\
    N\": 此应用需要 API  N 或更高版本\n- package=\"...\" - 包名\n- 各组件的入口点：\n\n```xml\n<activity>\
    \ ... </activity> - 一个活动 (activity)\n<service> ... </service> - 一个服务 (service)\n\
    <receiver> ... </receiver> - 一个广播接收器 (receiver)\n<provider> ... </provider> -\
    \ 一个内容提供者 (provider)\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_85_0.png)\n\
    \n关于 AndroidManifest.xml 的更多信息请访问：http://developer.android.com/guide/topics/manifest/intro.html\n\
    \n## 第 4 ：应用程序结构\n\n### AndroidManifest.xml (1)\n\n- 第一部分可能像这样\n\n```xml\n<?xml\
    \ version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n    package=\"com.example.helloworld\"\n    android:versionCode=\"1\"\n    android:versionName=\"\
    1.0\">\n    <uses-sdk android:minSdkVersion=\"10\" />\n    ..\n</manifest>\n```\n\
    \n### AndroidManifest.xml (2)\n\n- 在 manifest 部分，定义一个带有 label（标签）的 application\n\
    - label 是应用程序的人可读名称\n- 通常 label 是一个字符串资源\n\n```xml\n<manifest ...>\n  <application\
    \ android:label=\"@string/app_name\">\n    ...\n  </application>\n</manifest>\n\
    ```\n\n## 第 4 ：应用程序结构\n\n### AndroidManifest (3)\n\n- 在 application 部分，定义组件，在本例中是一个单个\
    \ activity\n- 它有一个 name，与 Java 类名匹配\n- 并且有一个 label，在活动活动可见时显示\n\n```xml\n<activity\
    \ android:name=\"HelloWorldActivity\" android:label=\"@string/app_name\">\n...\n\
    </activity>\n```\n\n### AndroidManifest.xml (4)\n\n在 activity 部分，应该有一个 intent-filter（意图过滤器）\n\
    \n- 定义哪些意图（消息）可以通过此活动传递\n- 为了让主活动能够被启动器（或主应用）启动，你需要这样一个这样的 intent-filter\n\n```xml\n\
    <intent-filter>\n  <action android:name=\"android.intent.action.MAIN\" />\n  <category\
    \ android:name=\"android.intent.category.LAUNCHER\" />\n</intent-filter>\n```\n\
    \n## 第 4 ：应用程序结构\n\n- res/layout/main.xml 定义了屏幕布局\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"utf-8\"?>\n<LinearLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n    android:orientation=\"vertical\"\n    android:layout_width=\"fill_parent\"\
    \n    android:layout_height=\"fill_parent\">\n  <TextView\n    android:layout_width=\"\
    fill_parent\"\n    android:layout_height=\"wrap_content\"\n    android:text=\"\
    Hello World, HelloWorld\"/>\n</LinearLayout>\n```\n\n## Android Android：Android\
    \ 内部简介\n\n对于这个简单的示例，我们只需要\n- 一个继承自 \"Activity\" 的类 \"HelloWorldActivity\"\n- 在首次启动时调用的\
    \ onCreate 函数\n- 在 onCreate 中，调用 `setContentView(R.layout.main);` 来显示屏幕布局中定义的\
    \ UI\n\n- 源文件存放在\n- src/com/example/helloworld/HelloWorld.java\n\n## 第 4 ：应用程序结构\n\
    \n```java\npackage com.example.helloworld;\n\nimport android.app.Activity;\nimport\
    \ android.os.Bundle;\n\npublic class HelloWorldActivity extends Activity {\n \
    \   /** 当活动首次创建时被调用。 */\n    @Override\n    public void onCreate(Bundle savedInstanceState)\n\
    \    {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.main);\n\
    \    }\n}\n```\n\n## 构建\n\n- 你可以使用命令行通过 ant 进行构建，它是一个类似于 make 的工具\n- ant 使用 build.xml\
    \ 中的规则\n- 默认规则定义了 debug 和 release 选项\n- 或者使用 Eclipse ADT 构建\n- 生成一个 Android 包\n\
    \n```bash\n$ ant debug\nBuildfile: build.xml\n...\nBUILD SUCCESSFUL\nTotal time:\
    \ 1 second\n```\n\n## 第 4 应用程序结构\n\n- 应用程序被封装成 .apk 格式\n- 一个压缩包\n\n```bash\n$\
    \ unzip -l bin/HelloWorld.apk\nArchive: bin/HelloWorld.apk\nLength Date Name\n\
    ------------------------------------------------\n708 2013-03-24 11:33 res/layout/main.xml\n\
    1316 2013-03-24 11:33 AndroidManifest.xml\n776 2013-03-24 11:33 classes.dex\n\
    ```\n\n## 安装\n\n- 你可以使用 adb 安装到目标\n- 替换任何现有应用\n\n```bash\n$ adb install -r bin/HelloWorld.apk\n\
    Success\n```\n\n- 注意：你可以使用 adb 完全移除应用\n\n```bash\n$ adb uninstall com.example.helloworld\n\
    ```\n\n## 第 4 应用程序结构\n\n应用程序与进程\n\n- 每个应用程序运行在一个独立的 Dalvik 虚拟机中\n- 每个虚拟机作为一个独立的\
    \ Linux 进程运行\n- 进程无法访问属于其他进程的内存\n- 如果一个进程终止（例如崩溃），它不会影响其他进程（除非存在显式依赖）\n\n应用程序\
    \ ID\n\n- 进程模型防止对另一个应用程序内存的干扰\n- 通过为每个应用程序使用唯一的 ID，其他应用程序无法访问文件\n- 应用程序 ID 在安装时分配，从\
    \ 10000 开始\n- 所以，app_26 是 10000 + 26 = 10026\n- 存储在 /data/system/packages.xml\n\
    - 属于应用程序的所有文件都被设置为相同的用户 ID\n- 其他应用程序（具有不同的 ID）无法访问这些文件\n\n"
