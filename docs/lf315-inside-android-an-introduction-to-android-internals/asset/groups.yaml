    # Lab 18


    Exercise 18.1 oom_adj


    Run your hello world application. In an adb shell, find its PID and then read
    the oom_adj value `cat /proc/<pid>/oom_adj`


    Note the oom_adj values as the application goes through its life-cycle.


    Repeat with the server application. Note that the oom_adj value when the activity
    is no longer visible.


    Exercise 18.2 Low memory


    Note the settings for low memory by looking at the files in /sys/module/lowmemory-orykiller/parameters
    and find the place in /init.rc where they are configured.


    Use adb to copy eatmem to /data on the device


    ```

    $ adb push /embedded-android/lab18/eatmem /data

    ```


    Run logcat in one terminal while running /data/eatmem in an adb shell. Notice
    how the applications with higher oom_adj values are killed first.


