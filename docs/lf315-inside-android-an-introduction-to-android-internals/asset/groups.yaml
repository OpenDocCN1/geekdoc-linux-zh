    # Android input layers


    +   - From the bottom up...

    - Linux evdev drivers generate events and pass them up to to...

    - EventHub reads events from all drivers and passes them up to...

    - InputReader decodes the events and translates them into Android events

    - InputDispatcher sends events to the appropriate window


