  - "[PAGE 306]\n\n# Session 12 Graphics and OpenGL\n\n# Graphics acceleration\n\n\
    +   * The majority of platforms supporting Android have a Graphics Processing\
    \ Unit (GPU)\n* GPU drivers are usually vendor-specific and proprietary\n  * Notable\
    \ exception: the Lima driver for ARM Mali GPU at http://limadriver.org/\n* Software\
    \ support at two levels\n* Kernel drivers (if proprietary, implemented as kernel\
    \ modules)\n  * Framebuffer\n  * GPU interface\n* Libraries\n  * EGL -> libEGL\n\
    \  * OpenGL ES 1 -> libGLESv1\n  * OpenGL ES 2 -> libLGLESv2\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_306_0.png)"
