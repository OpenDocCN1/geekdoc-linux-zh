    # Session 11 Adding new packages


    281


    ```

    $ cd /

    $ sudo tar xf ~/embedded-android/resources/lab11/\angstrom-eibc-i686-armv7a-v2012.05-toolchain.tar.bz

    $ cd ~/embedded-android

    $ tar xf resources/lab11/busybox-1.20.1.tar.bz

    $ cd busybox-1.20.1

    $ PATH=/usr/local/oorece-i686/sysroots/i686-angstromdk-linux/usr/bin/\armv7a-android-linux-gnueababi:$PATH

    $ export ARCH=arm

    $ export CROSS_COMPILE=arm-angstrom-linux-gnueababi-

    $ make defconfig

    $ make

    $ make install

    ```


    Note that during the last stage busybox was installed into _install. Next, you
    need to copy these files to the SD card. You are going to do this as a separate
    stage, after Android has been installed. Busybox will be in /system/gnu and there
    will be symbolic links from /bin, /sbin, /usr/bin, /usr/sbin and lib to that directory.


    Insert the SD card into the reader. Create a subdirectory in the system partition
    called ''gnu''


    ```

    $ sudo cp -a _install/* /media/system/gnu

    $ cp -a

    /usr/local/oorece-i686/sysroots/armv7a-angstrom-linux-gnueababi/lib

    /media/system/gnu

    ```'
