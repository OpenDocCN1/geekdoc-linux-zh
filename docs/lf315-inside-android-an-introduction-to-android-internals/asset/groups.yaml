  - "[PAGE 99]\n\n# Application user IDs\n\n+   * The process model prevents interference\
    \ with memory belonging to another application\n* By using unique user IDs per\
    \ application, other applications cannot access files and other resources either:\n\
    * Application user IDs are allocated during installation, starting at 10000\n\
    \  * So, app_26 is uid 10000 + 26 = 10026\n  * Stored in /data/system/packages.xml\n\
    * All files belonging the application packages are set to have the same user ID\n\
    * Other applications (with different user IDs) cannot access these files"
