  - "[PAGE 312]\n\n# Kernel framebuffer driver\n\n+   - The Linux framebuffer driver\
    \ provides a standard interface to display bitmap\n- Device /dev/fb0 (/dev/graphics/fb0\
    \ on Android)\n- ioctl functions to read fixed parameters\n  - screen and buffer\
    \ dimensions, etc.\n- ioctl functions to read/write variable parameters\n  - e.g.\
    \ to \"pan\" the display (determine which part of the buffer is visible)\n- mmap\
    \ function to map the buffer into application addresses\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_312_0.png)"
- md: "\n# LF315 Inside Android: an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_313_0.png)\n\
    \n## Session 12 Graphics and OpenGL\n\n### Testing with fbset\n\n- Using the fbset\
    \ utility from Busybox\n- Note: framebuffer height is 1600, display height is\
    \ 800\n- Pixel format is RGB 565\n\n```\n# fbset -fb /dev/graphics/fb0\nmode \"\
    480x800-260\"\n# D: 100.000 MHz, H: 208.333\ngeometry 480 800 480 1600 16\ntimeings\
    \ 10000 0 0 0 0 0\naccel false\nendmode rgba 5/11,6/5,5/0,0/0\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_314_0.png)\n\
    \n## LF315 Inside Android: an Introduction to Android Internals\n\n### Buffer\
    \ formats\n\nAndroid recognises these formats:\n- 32 bits/pixel:\n    - HAL_PIXEL_FORMAT_RGBA_8888\n\
    \    - HAL_PIXEL_FORMAT_RGB_8888\n    - HAL_PIXEL_FORMAT_BGRA_8888\n- 24 bits\
    \ per pixel:\n    - HAL_PIXEL_FORMAT_RGB_888\n- 16 bits per pixel:\n    - HAL_PIXEL_FORMAT_RGB_565\n\
    \    - HAL_PIXEL_FORMAT_RGBA_4444\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_315_0.png)\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_315_1.png)\n\n## Session 12 Graphics\
    \ and OpenGL\n\n```\ngralloc.default\n```\n\n- A hardware-neutral version (gralloc.default)\
    \ is implemented in hardware/lib/modules\n- A typical vendor implementation will\
    \ provide an optimized version to take advantage of hardware features\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_316_0.png)\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_316_1.png)\n\n## Lab 12\n\n### Exercise\
    \ 12.1 Spinning cube\n\nThere is a spinning cube demo in $HOME/embedded-android/resources/lab12/OpenGL-cube.\
    \ Copy it to aosp/external/OpenGL-cube, build and install on the target so\n\n\
    ```\ncd external/OpenGL-cube\nmm\nadb remount\nadb sync\n```\n\nReboot the target\
    \ board and run the demo.\n\n### Exercise 12.2 Add GPU drivers\n\nCurrently the\
    \ target is using software rendering (SurfaceFlinger). Now you will configure\
    \ support for the PowerVR GPU. Copy $HOME/embedded-android/resources/lab12/sgx\
    \ to your device directory (that is, to /dev/sgx). Create egl.cfg following the\
    \ example on the slides.\n\n## Session 12 Graphics and OpenGL\n\nAdd to BoardConfig.mk\
    \ a BOARD_EGL_CONFIG rule and set USE_OPENGL_RENDER := true.\n\n```\nservice pvr\
    \ /system/bin/sgx.rc start\n```\n\nPaste the text at the bottom of $HOME/embedded-android/resources/lab12/README\
    \ into your device.mk. Build and copy the new system.img and ramdisk to the SD\
    \ card. To verify that drivers are loaded correctly, run logcat and look for the\
    \ lines following \"SurfaceFlinger\". Note the \"vendor\", \"renderer\". Run the\
    \ OpenGL cube again and see if it is faster.\n\n## LF315 Inside Android: an Introduction\
    \ to Android Internals\n\n## Session 13: Binder\n\n### What is the Binder?\n\n\
    - AIDL\n- Other forms of IPC\n- Services and Android framework\n\n## Session 13\
    \ Binder\n\n### What is the Binder?\n\n- A form of inter-process communication\n\
    - Necessary since each application is a separate process\n- Supports a distributed\
    \ component architecture similar to CORBA\n- The IBinder interface and data description\n\
    - Derived from OpenBinder, BeOS and Palm OS\n- Binder is a common link between\
    \ these things\n\n## Components\n\n### Features of the Binder\n\n- No memory leaks:\
    \ reference counting and \"death notification\" take care of that\n- \"Thread\
    \ migration\" and automatic management of thread pools\n- Synchronous and asynchronous\
    \ (one-way) invocation\n- Identify sender by UID and PID\n- Can send file descriptors\
    \ from one process to another\n- Define interfaces using Android Interface Definition\
    \ Language (AIDL)\n- Local execution mode (no IPC/data marshaling) if the client\
    \ and service are in the same process\n\n## Binder driver\n\n- The lowest level\
    \ component\n- Holds all of the state of Binder\n- Tracks Binder connections\n\
    - Sends out death notifications\n- Implemented as a simple character driver: /dev/binder\n\
    - Most of the work is done by ioctl functions\n\nThe source is in mainline Linux\
    \ since 3.2 in:\ndrivers/staging/android/binder.c\ndrivers/staging/android/binder.h\n\
    \n- ServiceManager is the Binder name server\n- Maps names such as \"phone\" to\
    \ Binder objects\n- At boot time, ServiceManager requests the driver to grant\
    \ it 'context manager' status\n    - Using ioctl! BINDER_SET_CONTEXT_MGR\n   \
    \ - There can only be one context manager\n- As context manager, ServiceManager\
    \ has the well-known Binder handle 0\n    - This is the only well-known handle\n\
    \nThe source code for ServiceManager is in frameworks/base/cmds/servicicemanager/service_manager.c.\n\
    \n## LF315 Inside Android: an Introduction to Android Internals\n\n### Other Android\
    \ services\n\n- Other services call ServiceManager to register themselves\n- Only\
    \ components of the Android framework need to apply:\n- You have to be running\
    \ with UID AID_ROOT (0) or AID_SYSTEM (1000), or be listed in service_manager.c.\n"
  mdcn: "\n\n# LF315 深入 Android：Android 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_313_0.png)\n\
    \n## 第12 节：图形与 OpenGL\n\n### 使用 fbset 进行测试\n\n- 使用 Busybox 中的 fbset 实用\n- 注意：帧缓冲区高度为\
    \ 1600，显示高度为 800\n- 像素格式为 RGB 565\n\n```\n# fbset -fb /dev/graphics/fb0\nmode\
    \ \"480x800-260\"\n# D: 100.000 MHz, H: 208.333\ngeometry 480 800 480 1600 16\n\
    timeings 10000 0 0 0 0 0\naccel false\nendmode rgba 5/11,6/5,5/0,0/0\n```\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_314_0.png)\n\n## LF315 深入 Android：Android\
    \ 内部原理\n\n### 缓冲区格式\n\nAndroid 识别以下格式：\n- 32 位/像素：\n    - HAL_PIXEL_FORMAT_RGBA_8888\n\
    \    - HAL_PIXEL_FORMAT_RGB_8888\n    - HAL_PIXEL_FORMAT_BGRA_8888\n- 24 位/像素：\n\
    \    - HAL_PIXEL_FORMAT_RGB_888\n- 16 位/像素：\n    - HAL_PIXEL_FORMAT_RGB_565\n\
    \    - HAL_PIXEL_FORMAT_RGBA_4444\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_315_0.png)\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_315_1.png)\n\n## 第12 节：图形与 OpenGL\n\n\
    ```\ngralloc.default\n```\n\n- 一个与硬件无关的版本 (gralloc.default) 实现在 hardware/lib/modules\
    \ 中\n- 典型的厂商实现会提供一个优化的版本，以利用硬件特性\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_316_0.png)\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_316_1.png)\n\n## 实验 12\n\n### 练习 12.1\
    \ 旋转立方体\n\n在 $HOME/embedded-android/resources/lab12/OpenGL-cube 中有一个旋转立方体演示。将其拷贝到\
    \ aosp/external/OpenGL-cube，在目标机上编译并安装：\n\n```\ncd external/OpenGL-cube\nmm\n\
    adb remount\nadb sync\n```\n\n重启目标板并运行演示。\n\n### 练习 12.2 添加 GPU 驱动程序\n\n目前目标机正在使用软件渲染（SurfaceFlinger）。现在你将配置对\
    \ PowerVR GPU 的支持。将 $HOME/embedded-android/resources/lab12/sgx 拷贝到你的设备目录（即 /dev/sgx）。按照幻灯片上的示例创建\
    \ egl.cfg。\n\n## 第12 节：图形与 OpenGL\n\n在 BoardConfig.mk 中添加 BOARD_EGL_CONFIG 规则，并将\
    \ USE_OPENGL_RENDER 设置为 true。\n\n```\nservice pvr /system/bin/sgx.rc start\n```\n\
    \n将 $HOME/embedded-android/resources/lab12/README 底部的文本粘贴到你的 device.mk 中。编译并拷贝新的\
    \ system.img 和 ramdisk 到 SD 卡。要验证驱动程序是否正确加载，运行 logcat 并查找 \"SurfaceFlinger\" 之后的行。注意\
    \ \"vendor\" 和 \"renderer\"。再次运行 OpenGL 立方体看看速度是否变快。\n\n## LF315 深入 Android：Android\
    \ 内部原理\n\n## 第13 节：Binder\n\n### 什么是 Binder？\n\n- AIDL\n- 其他形式的 IPC（进程间通信）\n-\
    \ 服务与 Android 框架\n\n## 第13 节 Binder\n\n### 什么是 Binder？\n\n- 一种进程间通信的形式\n- 由于每个应用程序都是独立的进程，因此它是必不可少的\n\
    - 支持类似于 CORBA 的分布式组件架构\n- IBinder 接口和数据描述\n- 衍生自 OpenBinder、BeOS 和 Palm OS\n-\
    \ Binder 是这些事物之间的共同纽带\n\n## 组件\n\n### Binder 的特性\n\n- 无内存泄漏：引用计数和“死亡通知”处理了这个问题\n\
    - “线程迁移”和线程池的自动管理\n- 同步和异步（单向）调用\n- 通过 UID 和 PID 识别发送者\n- 可以从一个进程向另一个进程发送文件描述符\n\
    - 使用 Android 定义语言 (AIDL) 定义接口\n- 如果客户端和服务端在同一个进程中，则使用本地执行模式（无需 IPC/数据序列化）\n\n\
    ## Binder 驱动程序\n\n- 最底层组件\n- 持有 Binder 的状态\n- 跟踪 Binder 连接\n- 发送死亡通知\n- 实现为简单的字符设备驱动：dev/binder\n\
    - 大部分工作由 ioctl 函数完成\n\n源码自 3.2 版本起进入 Linux 主线，位于：\ndrivers/staging/android/binder.c\n\
    drivers/staging/android/binder.h\n\n- ServiceManager 是 Binder 命名服务器\n- 将如 \"phone\"\
    \ 等名称映射到 Binder 对象\n- 在启动时，ServiceManager 请求驱动程序授予其“管理器”状态\n    - 使用 ioctl! BINDER_SET_CONTEXT_MGR\n\
    \    - 只能有一个管理器\n- 作为管理器，ServiceManager 拥有已知的 Binder 句柄 0\n    - 这是唯一的已知句柄\n\n\
    ServiceManager 的源码位于 frameworks/base/cmds/servicicemanager/service_manager.c。\n\
    \n## LF315 深入 Android：Android 内部原理\n\n### 其他 Android 服务\n\n- 其他服务调用 ServiceManager\
    \ 来注册自己\n- 只有 Android 框架的组件需要应用：\n- 你必须以 UID AID_ROOT (0) 或 AID_SYSTEM (1000)\
    \ 身份运行，或者列在 service_manager.c 中。\n\n"
