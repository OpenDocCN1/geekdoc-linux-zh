  - "[PAGE 329]\n\n# Binder write read\n\n+   - Transactions are passed to the binder\
    \ driver via ioctl function BINDER_WRITE_READ\n\n+   - The request is passed in\
    \ the write buffer and the reply is returned in the read buffer\n\n```\nstruct\
    \ binder_write_read {\n    signed long write_size;\n    signed long write_consumed;\n\
    \    unsigned long write_buffer;\n    signed long read_size;\n    signed long\
    \ read_consumed;\n    unsigned long read_buffer;\n};\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_329_0.png)\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_329_1.png)"
