    \ to Android Internals\n\n## OpenGL and OpenGL ES\n\n- OpenGL is a cross-platform\
    \ API for 2D and 3D graphics\n- Specifications published by the Khronos Group\n\
    \  - http://www.khronos.org/\n- OpenGL ES is a sub-set of the OpenGL API designed\
    \ for embedded devices\n- For example, OpenGL ES has\n  - No double float or long\
    \ long integer data type\n  - No quad or polygon primitives: use triangles instead\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_293_0.png)\n\n284\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_293_1.png)\n\
    \n## Session 12 Graphics and OpenGL\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_294_0.png)\n\
    \nCopyright © 2013 The Linux Foundation. All rights reserved.\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_295_0.png)\n\
    \n- All versions of Android support OpenGL ES\n- OpenGL ES 1.0/1.1 Common profile\
    \ from the start\n- OpenGL ES 2.0 from API level 8 (Froyo)\n- You will encounter\
    \ OpenGL in 2 places\n- At the top of the stack as Java APIs, which are loosely\
    \ based (but not 100% compatible) on the Java JSR 239\n- At the bottom of the\
    \ stack as the primary means of rendering graphics\n\n## Session 12 Graphics and\
    \ OpenGL\n\n## EGL\n\n- EGL is the Khronos Native Platform Graphics Interface\n\
    - Describes how OpenGL ES (and OpenVG) interface with an under-lying window system\n\
    \  - Map a surface to a display\n  - Allocate buffers\n  - Double and single buffered\
    \ surfaces\n  - Display size, color depth, etc.\n\n## EGL example (1)\n\nThe application\
    \ uses EGL to allocate a window buffer and then OpenGL ES to draw a frame into\
    \ the back buffer\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_297_0.png)\n\n##\
    \ Session 12 Graphics and OpenGL\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_298_0.png)\n\
    \n## LF315 Inside Android: an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_299_0.png)\n\
    \nCopyright © 2013 Linux Foundation.\nAll rights reserved. DO NOT DISTRIBUTE.\n\
    \n## Session 12 Graphics and OpenGL\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_300_0.png)\n\
    \n## LF315 Inside Android: an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_301_0.png)\n\
    \nCopyright © 2013 Linux Foundation. All rights reserved. DO NOT DISTRIBUTE.\n\
    \n## Rendering UI components\n\n- A typical UI consists of buttons, menus and\
