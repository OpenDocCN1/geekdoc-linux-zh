    +   The macros ALOGV, ALOGD, ALOGI, ALOGW and ALOGE write verbose, debug, information,
    warning and error messages to the main log

    Each takes a single string parameter which may include printf format characters

    The Tag is picked per definition in LOG_TAG

    Example:


    ```

    #include <utils/log.h>


    #define LOG\_TAG "lights"

    ALOGE("Failed to open %s", path);

    ```


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_117_0.png)'
  - '[PAGE 118]


    Session 4 Anatomy of an application


    # Summary


    +   * An application can contain four types of component:

    * activity, service, content provider, broadcast receiver

    * Each runs in its own VM as a Linux process with a unique user ID

    * The application is started and stopped as needed and resources allow

    * An activity is informed of life cycle events by callbacks such as onCreate()


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_118_0.png)'
