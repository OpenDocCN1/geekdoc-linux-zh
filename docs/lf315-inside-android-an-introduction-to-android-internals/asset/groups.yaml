  - '[PAGE 229]


    # Booting the old way


    +   - The bootloader is in NOR flash at known vector

    - Early boot sets up SDRAM and relocates to RAM

    - Main boot code runs in RAM


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_229_0.png)


    Since NOR flash memory can be accessed byte by byte it can be mapped into the
    processor address space and so can execute code immediately power is applied.'
  - "[PAGE 230]\n\n# Session 10 Starting up\n\n# Booting from NAND flash\n\n+   *\
    \ NOR flash is no longer used - too expensive\n* NAND flash is much more complex,\
    \ needs code to run\n* That code has to be stored somewhere, usually within the\
    \ SoC itself\n* Typical sequence\n    * CPU boot code loads small pre boot loader\
    \ from NAND (or MMC, UART, USB...) into internal static RAM (SRAM)\n    * Size\
    \ of pre-boot loader limited by SRAM, typically 16 KiB .. 128 KiB\n    * Pre boot\
    \ loader initializes SDRAM\n    * Loads main boot loader into SDRAM and starts\
    \ it running\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_230_0.png)\n\nNAND flash\
    \ memory can only be accessed one page at a time, a page being typically 2048\
    \ bytes. Accessing a page of NAND flash is done under program control, resulting\
    \ in a chicken-and-egg situation during bootstrap.\n\nHence, it is necessary to\
    \ have some code in the SoC itself that is able to load one or more pages from\
    \ a NAND flash chip.\n\nMany SoCs extend this code to be able to load a progr\
    \ from other sources as well, including MMC, UART and USB"
  - '[PAGE 231]


    # Booting from SD


    +   - On TI OMAP and Sitara chips, the CPU boot code can load an image from the
    SDIO (SD card) interface

    - The file must be called MLO

    - It must be stored in the first partition of the card

    - It must be formatted using FAT32 (vfat)


    The Beagleboard has a TI Sitara 335x chip which has boot code that can load a
    boot image from MMC, which in our case is wired to the SD card reader. That code
    is very limited, hence the need for the partition format to be FAT32 and the name
    fixed as "MLO".nThe MLO binary can be compiled from the U-Boot source code.'
  - "[PAGE 232]\n\n# Fastboot\n\n+   * fastboot can refer to three different things\n\
