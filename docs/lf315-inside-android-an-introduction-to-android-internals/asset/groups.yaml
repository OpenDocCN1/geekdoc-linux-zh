  - "[PAGE 419]\n\n# Key character map files\n\n+   - Key character map files (kcm\
    \ files) map combinations of Android key codes with modifiers to Unicode characters\n\
    - There should be one for each internal keyboard\n- Begins with type <type declaration>\n\
    - Where <type declaration> is one of\n  - FULL: A full PC-style keyboard\n  -\
    \ ALPHA: A keyboard with just alphanumeric keys but few (no) others\n  - NUMERIC:\
    \ A numeric (12-key) keyboard\n  - PREDICTIVE: A keyboard with all the letters,\
    \ but with more than one letter per key\n  - SPECIAL_FUNCTION: system control\
    \ functions rather than for typing\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_419_0.png)"
  - "[PAGE 420]\n\n# Session 16 Input devices\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_420_0.png)\n\
    \n+   - Key maps determine which character is generated depending on shift, alt\
    \ and ctrl states\n- There is a map per Android key code of the form\n\n```\n\
    key <key name> {\n  label: <character printed on the key>\n  base: <base character>\n\
    \  shift: <character when shift pressed>\n}\n...\n```\n\nThe format is quite complex,\
    \ this is only an overview of the mappings possible. For full details look at\
    \ http://source.android.com/tech/input/key-character-map-files.html"
  - "[PAGE 421]\n\n# LF315 Inside Android: an Introduction to Android Internals\n\n\
    # Example\n\n```\nkey A {\n  label: 'A'\n  base: 'a'\n  shift, capslock: 'A'\n\
    }\n\nkey C {\n  label: 'C'\n  base: 'c'\n  shift, capslock: 'C'\n  alt: '\\u00e7'\n\
    \  shift+alt: '\\u00c7'\n}\n```\n\nNote: 'u000e7' is Unicode character e7, which\
    \ is small c cedilla; c7 is large C cedilla"
