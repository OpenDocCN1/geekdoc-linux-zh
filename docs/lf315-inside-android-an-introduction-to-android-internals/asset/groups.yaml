  - "[PAGE 127]\n\n# The C side of JNI (1)\n\nHeader file with JNI definitions\n\n\
    The name of the function has to be of the form Java_<package>_<class>_<method>\n\
    \n```\n#include <string.h>\n#include <jni.h>\n\njstring\nJava_com_example_hellojni_HelloJni_stringFromJNI(JNIEnv*\
    \ env, jobject thiz)\n{\n    return (*env)->NewStringUTF(env, \"Hello from JNI\
    \ !\");\n}\n```"
  - "[PAGE 128]\n\n# The C side of JNI (2)\n\n```\n#include <string.h>\n#include <jni.h>\n\
    \njstring\nJava com example hellojni HelloJni stringJNI(JNIEnv* env,\n    object\
    \ thiz)\n{\n    return (env)->NewStringUTF(env, \"Hello from JNI!\");\n}\n```\n\
    \nAll native methods have these two parameters, plus any others declared in the\
    \ \"native\" Java statement\n\nJNIEnv* env points to a function table containing\
    \ functions to access data structures in the VM\n\nobject thiz a reference to\
    \ the object"
  - "[PAGE 129]\n\n# The C side of JNI (3)\n\n```\n#include <string.h>\n#include <jni.h>\n\
    \njjstring\nJava_com_example_helloojniHelloJnistringFromJNI(JNIEnv* env, jobject\
    \ thiz)\n{\n    return (env)->NewStringUTF(env, \"Hello from JNI !\");\n}\n```\n\
    \nThe function NewStringUTF is a JNI function that allocates memory for a UTF-8\
    \ string and initialises it with a C string.\n\nNote that the return type is jstring"
  - "[PAGE 130]\n\n# Session 5 Native code\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_130_0.png)\n\
    \n```\n#include <string.h>\n#include <jni.h>\n\nextern \"C\"\njstring\nJava_com_example_hellojni_Hellojni_stringFromJNI(JNIEnv*\
    \ env, jobject thiz) {\n    return env->NewStringUTF(\"Hello from JNI!\");\n}\n\
    ```\n\nIn C++ you dereference env with \"env->\" rather than \"(*env)->\" and\
