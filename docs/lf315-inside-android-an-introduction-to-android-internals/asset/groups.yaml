- md: "\n## Session 8 Board Configuration\n\n## Creating a new device\n\n- The Android\
    \ build system performs the same job as Yocto and similar systems\n- Device definitions\
    \ are in the device/ directory\n- There is a two-level hierarchy\n  - organization/product\n\
    \  - The examples that follow use myorg and mydevice\n- The next few slides describe\
    \ these essential configuration files:\n  - AndroidProducts.mk\n  - The product\
    \ makefile, [PRODUCT_NAME].mk\n  - device.mk\n  - BoardConfig.mk\n  - vendorsetup.sh\n\
    \  - Android.mk\n\n## 172 LF315 Inside Android: an Introduction to Android Internals\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_181_0.png)\n\n- This file simply references\
    \ a makefile for each variant of the product\n- In many cases there is only one\
    \ variant ...\n- ... in which case, it contains just the one line, for example:\n\
    ```\nPRODUCT_MAKEFILES := $(LOCAL_DIR)/full_mydevice.mk\n```\n\n## Product makefile\n\
    \n- This file does two things:\n- Defines which packages will be included in the\
    \ build\n- Defines the product name, PRODUCT_NAME\n\n- The file must be named\
    \ [PRODUCT_NAME].mk\n\n- To save a lot of typing, inherit packages from a predefined\
    \ product\n- Look in build/target/product/ for examples\n\n- Then provide local\
    \ overrides\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_182_0.png)\n\n## Product\
    \ makefile example\n\n- For example: full_mydevice.mk\n\n```\n$(call inherit-product,\
    \ $(SRC_TARGET_DIR)/product/full_base.mk)\n$(call inherit-product, device/myorg/mydevice/device.mk)\n\
    \nPRODUCT_NAME := full_mydevice\nPRODUCT_DEVICE := mydevice\nPRODUCT_MODEL :=\
    \ Full Android on My Device\n```\n\n## device.mk\n\n- Provides overrides of properties\
    \ inherited in the product makefile and adds new ones\n- The next few slides describe\
    \ these variables:\n  - PRODUCT_COPY_FILES\n  - PRODUCT_PACKAGES\n  - PRODUCT_PROPERTY_OVERRIDES\n\
    \  - PRODUCT_CHARACTERISTICS\n  - PRODUCT_TAGS\n\n## device.mk: PRODUCT_COPY_FILES\n\
    \n- Copy a list of files into the build directories so they are incorporated in\
    \ the final system\n- PRODUCT_COPY_FILES += source-path:destination-file\n- To\
    \ include in the root file system (ramdisk) set destination-file to root\n- For\
    \ example:\n  device/myorg/mydevice/init.rc:root/init.rc\n\n## Session 8 Board\
    \ Configuration\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_186_0.png)\n\n- A\
    \ list of packages to the build\n- Package names are defined in Android.mk for\
    \ each module, like this\n- In extras/ext4_utils/Android.mk you will find\n  LOCAL_MODULE\
    \ := make_ext4fs\n- (On more packages later)\n- Example:\n```\nPRODUCT_PACKAGES\
    \ := \\\n    make_ext4fs \\\n```\n\n- Define system properties that will be written\
    \ to /system/build.prop\n- More on system properties when we talk about bootstrapping\n\
    - There are many system properties, look at device.mk for examples\n- Some that\
    \ are useful:\n  - hw.nobattery - set to true if the device does not run off\n\
    \  - hwui.render_dirty_regions - set to \"false\" to disable partial dirty regions\n\
    - Example:\n```\nPRODUCT_PROPERTY_OVERRIDES := hw.nobattery=true \\\n  hwui.render_dirty_regions=false\n\
    ```\nCopyright © 2013 Linux Foundation. All rights reserved.\n\n## PRODUCT_CHARACTERISTICS\n\
    \n- A list of characteristics, including:\n- tablet - overrides default, \"phone\"\
    \n- nosdcard - no SD card for external storage\n- For example:\n```\nPRODUCT_CHARACTERISTICS\
    \ := tablet,nosdcard\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_188_0.png)\n\
    \n## device.mk: PRODUCT_TAGS\n\n- Almost universally, this line is included in\
    \ device.mk:\n- PRODUCT_TAGS += dalvik.gc.type\n- Which configures the Dalvik\
    \ garbage collector (obviously)\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_189_0.png)\n\
    \n## Session 8 Board Configuration\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_190_0.png)\n\
    \n## BoardConfig.mk - CPU\n\n- You can configure CPU type and features as follows:\n\
    - TARGET_ARCH\n  - In 4.0.x and 4.1.x one of arm, x86\n  - In 4.2.x one of arm,\
    \ x86, mips\n- TARGET_CPU_ABI should be set to the primary ABI:\n  - armeabi,\
    \ armeabi-v7a, mips\n- TARGET_CPU_ABI2 should be set to the secondary ABI:\n \
    \ - e.g., for an ARM Cortex-A CPU, primary ABI is armeabi-v7a, secondary is armeabi\n\
    - If multi-core, add:\n  - TARGET_CPU_SMP := true\n\n## BoardConfig.mk - ARM\n\
    \n- There are some ARM-specific settings\n- If the chip has a TLS register (i.e.,\
    \ Cortex-A), add:\n  - ARCH_ARM_HAVE_TLS_REGISTER := true\n- If the chip has an\
    \ ARM NEON coprocessor, add:\n  - TARGET_ARCH_VARIANT := armv7-a-neon\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_192_0.png)\n\
    \n## BoardConfig.mk - File systems\n\n- Configure file system types and sizes\
    \ for ext4:\n```\nTARGET_USERIMAGES_USE_EXT4 := true\nBOARD_FLASH_BLOCK_SIZE :=\
    \ 4096\nBOARD_SYSTEMIMAGE_PARTITION_SIZE := nnnnnnnn\nBOARD_USERDATAIMAGE_PARTITION_SIZE\
    \ := nnnnnnnn\nBOARD_CACHEIMAGE_PARTITION_SIZE := nnnnnnnn\n```\n- Where nnnnnnnn\
    \ is the size in bytes\n\n## Session 8 Board Configuration\n\n## BoardConfig.mk\
    \ - File systems\n\n- When using raw NAND/yaffs2 you need to set the page size,\
    \ spare OOB size and erase block size as well:\n```\nBOARD_NAND_PAGE_SIZE := 2048\n\
    BOARD_NAND_SPARE_SIZE := 64\nBOARD_FLASH_BLOCK_SIZE := 131072\nBOARD_SYSTEMIMAGE_PARTITION_SIZE\
    \ := nnnnnnnn\nBOARD_USERDATAIMAGE_PARTITION_SIZE := nnnnnnnn\nBOARD_CACHEIMAGE_PARTITION_SIZE\
    \ := nnnnnnnn\n```\n\n```\nvendorsetup.sh\n```\n\n- \"lunch\" searches for vendorsetup.sh\
    \ in:\n- vendor/*/vendorsetup.sh\n- vendor/*/*/vendorsetup.sh\n- device/*/vendorsetup.sh\n\
    \nUse it to add a product to the menu, like this:\n- add_lunch_combo PRODUCT_NAME-{user\
    \ | userdebug | eng}\n\nFor example:\n```\nadd_lunch_combo full_myproduct-eng\n\
    ```\n\n## Session 8 Board Configuration\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_196_0.png)\n\
    \n- This is only needed if you add packages within the directory\n- The two lines\
    \ below will recursively build:\n```\nLOCAL_PATH := $(call dir)\ninclude $(call\
    \ allmakefile)\n```\n\n## Adding an overlay\n\n- Overlays allow you to overwrite\
    \ files in framework and base packages\n- i.e. you can customize the settings\
    \ stored in system\n- Put the files you want to be overlaid into a directory,\
    \ usually called overlay/frameworks/base/core/res/values/config.xml\n- Add this\
    \ to device.mk: PRODUCT_OVERLAYS := device/myorg/mydevice/overlay\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_197_0.png)\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_197_1.png)\n\n## Other make targets\n\
    \n- make clean: removes everything in out/\n- make installclean: removes out/target/product\n\
    - make clean-<module>: cleans just the module named\n- make snod: rebuild system.img\
    \ without checking dependencies\n- make offline-sdk: generate the developer docs\n\
    - make sdk: create an SDK\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_198_0.png)\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_198_1.png)\n\n## LF315 Inside Android:\
    \ an Introduction to Android Internals\n\n## A note about ext4 image format\n\n\
    - When building ext4 system, userdata and cache images the format is not plain\
    \ ext4\n- It is in sparse format, designed to reduce the size by eliminating empty\
    \ areas\n- The Android bootloader or U-Boot with fastboot support understands\
    \ this\n- If not using fastboot, convert to plain ext4 binary format like so:\n\
    \  ```$img2img system.img system-ext4.img```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_199_0.png)\n\
    \n## Lab 8\n\n### Exercise 8.1 Create a new product\n\nObjective: to define a\
    \ new product that will run on the Beaglebone and check that it builds. You won't\
    \ be able to test it yet because there are a few more things to do after this.\n\
    \nBegin by choosing a name for myorg and mydevice and create the corresponding\
    \ sub directory in device/. The sample solution uses ti/beaglebone, which is descriptive\
    \ but boring.\n\nCopy the files from $HOME/embedded-android/resources/lab8 to\
    \ your directory. If you have used different names, edit all occurrences of ti\
    \ and beagle-bone.\n\nSource build/envsetup.sh, select your product from the lunch\
    \ combo and build it. As with the emulator build, it will take a while to finish.\n\
    \nWhen complete, check that the out/target/product directory contains the generated\
    \ cache.img, ramdisk.img, system.img and userdata.img files.\n"
  mdcn: "\n\n## 第 8 板卡配置\n\n## 创建新设备\n\n- Android 构建系统的工作与 Yocto 及类似系统相同\n- 设备定义位于\
    \ `device/` 目录\n- 存在一个两级层次结构\n  - 组织/产品 (organization/product)\n  - 后面的示例使用了 myorg\
    \ 和 mydevice\n- 接下来的几页幻灯片描述了这些核心配置文件：\n  - AndroidProducts.mk\n  - 产品 makefile，[PRODUCT_NAME].mk\n\
    \  - device.mk\n  - BoardConfig.mk\n  - vendorsetup.sh\n  - Android.mk\n\n## 172\
    \ LF315 Android 内部：Android 内部原理简介\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_181_0.png)\n\
    \n- 该文件简单地为产品的每个变体引用一个makefile\n- 在很多情况下，只有一个变体……\n- ... 在这种情况下，它只包含一行，例如：\n```\n\
    PRODUCT_MAKEFILES := $(LOCAL_DIR)/full_mydevice.mk\n```\n\n## 产品 makefile\n\n\
    - 该文件包含两件事：\n- 定义哪些包将包含在构建中\n- 定义产品名称，PRODUCT_NAME\n\n- 文件名必须命名为 [PRODUCT_NAME].mk\n\
    \n- 为了节省大量输入工作，从预定义的产品继承包\n- 在 `build/target/product/` 中查找示例\n\n- 然后提供本地覆盖（overrides）\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_182_0.png)\n\n## 产品 makefile 示例\n\n\
    - 例如：full_mydevice.mk\n\n```\n$(call inherit-product, $(SRC_TARGET_DIR)/product/full_base.mk)\n\
    $(call inherit-product, device/myorg/mydevice/device.mk)\n\nPRODUCT_NAME := full_mydevice\n\
    PRODUCT_DEVICE := mydevice\nPRODUCT_MODEL := Full Android on My Device\n```\n\n\
    ## device.mk\n\n- 提供对产品 makefile 中继承属性的覆盖，并添加新属性\n- 接下来的几页幻灯片描述了这些变量：\n  - PRODUCT_COPY_FILES\n\
    \  - PRODUCT_PACKAGES\n  - PRODUCT_PROPERTY_OVERRIDES\n  - PRODUCT_CHARACTERISTICS\n\
    \  - PRODUCT_TAGS\n\n## device.mk: PRODUCT_COPY_FILES\n\n- 将文件列表复制到构建目录，以便它们包含在最终系统中\n\
    - PRODUCT_COPY_FILES += source-path:destination-file\n- 若要包含在根文件系统 (ramdisk)，将\
    \ destination-file 设置为 root\n- 例如：\n  device/myorg/mydevice/init.rc:root/init.rc\n\
    \n## 第 8 板卡配置\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_186_0.png)\n\n- 要构建到构建的包列表\n\
    - 包名在 Android.mk 中为每个模块定义，如下所示\n- 在 `extras/ext4_utils/Android.mk` 中你会找到\n  LOCAL_MODULE\
    \ := make_ext4fs\n- （稍后会介绍更多包）\n- 示例：\n```\nPRODUCT_PACKAGES := \\\n    make_ext4fs\
    \ \\\n```\n\n- 定义将写入 /system/build.prop 的系统属性\n- 当我们讨论引导（bootstrapping）时会介绍更多系统属性\n\
    - 有许多系统属性，查看 device.mk 示例\n- 一些有用的属性：\n  - hw.nobattery - 如果设备不掉电则设置为 true\n \
    \ - hwui.render_dirty_regions - 设置为 \"false\" 以禁用部分脏区域\n- 示例：\n```\nPRODUCT_PROPERTY_OVERRIDES\
    \ := hw.nobattery=true \\\n  hwui.render_dirty_regions=false\n```\nCopyright ©\
    \ 2013 Linux Foundation. 版权所有。\n\n## PRODUCT_CHARACTERISTICS\n\n- 特性列表，包括：\n-\
    \ tablet - 覆盖默认的 \"phone\"\n- nosdcard - 外部存储不使用 SD 卡\n- 例如：\n```\nPRODUCT_CHARACTERISTICS\
    \ := tablet,nosdcard\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_188_0.png)\n\
    \n## device.mk: PRODUCT_TAGS\n\n- 几乎普遍情况下，这一行包含在 device.mk 中：\n- PRODUCT_TAGS\
    \ += dalvik.gc.type\n- 这配置了 Dalvik 垃圾回收器（显然地）\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_189_0.png)\n\
    \n## 第 8 板卡配置\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_190_0.png)\n\n## BoardConfig.mk\
    \ - CPU\n\n- 你可以如下配置 CPU 类型和特性：\n- TARGET_ARCH\n  - 在 4.0.x 和 4.1.x 中为 arm\n \
    \ - 在 4.2.x 中为 arm, x86\n  - TARGET_CPU_ABI 应该设置为主 ABI：\n  - TARGET_CPU_ABI_SECONDARY\
    \ 应该设置为次要 ABI：\n- 如果是多核，添加：\n  TARGET_SMP\n\n## BoardConfig.mk - ARM\n\n- 有些 ARM\
    \ 特有的设置\n- 如果芯片有 TLS（例如 Cortex-A），添加：\n  ARM_HAVE_TLS := true\n- 如果芯片有 NEON 协处理器，添加：\n\
    \  ARCH_VARIANT := armv7-neon\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_192_0.png)\n\
    \n## BoardConfig.mk - 文件系统\n\n- 配置 ext4 文件系统类型和大小：\n```\nTARGET_IMAGES_USE_EXT4\
    \ := true\nBOARD_FLASH_SIZE := 4096\nBOARD_SYSTEM_PARTITION_SIZE := nnnnnn\nBOARD_USERDATA_PARTITION_SIZE\
    \ := nnnnnn\nBOARD_CACHE_PARTITION_SIZE := nnnnnn\n```\n- nnnnnn 是字节\n\n## 第 8\
    \ 板卡配置\n\n## BoardConfig.mk - 文件系统\n\n- 使用原始 NAND 时需要设置页大小、备用大小和块大小：\n```\nBOARD_NAND_PAGE_SIZE\
    \ := 2048\nBOARD_NAND_SPARE_SIZE := 64\nBOARD_NAND_BLOCK_SIZE := 131072\nBOARD_SYSTEM_PARTITION_SIZE\
    \ := nnnnnn\nBOARD_USERDATA_PARTITION_SIZE := nnnnnn\nBOARD_CACHE_PARTITION_SIZE\
    \ := nnnnnn\n```\n\n- vendorsetup.sh 会搜索 device/ 中的 vendorsetup.sh\n- 在 device/*\
    \ 中查找 vendorsetup.sh\n- 使用它将产品添加到 lunch 菜单，如下：\n```\nlunch full_mydevice\n```\n\
    \n## 第 8 板卡配置\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_196_0.png)\n\n- 只有当你添加目录时才需要\n\
    - 下面的两行将递归构建：\n```\nLOCAL_PATH := $(call dir)\ninclude all\n```\n\n## 添加 overlay\n\
    \n- Overlay 允许你覆盖 framework 和 base 包中的文件\n- 即你可以自定义存储在系统中的设置\n- 将要覆盖的文件放入目录，通常为\
    \ framework/base/res/values/config.xml\n- 在 device.mk 中添加：PRODUCT_OVERLAYS :=\
    \ device/myorg/mydevice/overlay\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_197_0.png)\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_197_1.png)\n\n## 其他 make target\n\n\
    - make clean：移除 out/ 下的所有内容\n- make installclean：移除 out/target/product\n- make\
    \ clean-<module>:仅清理指定的模块\n- make snod：重新构建 system.img 而不检查依赖\n- make offline-sdk：生成开发者文档\n\
    - make sdk：创建 SDK\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_198_0.png)\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_198_1.png)\n\
    \n## LF315 Android 内部：Android 内部原理\n\n## 关于 ext4 格式的说明\n\n- 构建 ext4 system, userdata\
    \ 和 cache 镜像时，格式不是格式是稀疏格式，通过消除空区域来缩小体积\n- Android 引导程序或支持 fastboot 的 U-Boot 可以理解这种格式\n\
    - 如果不使用 fastboot，将其转换为纯 ext4 二进制格式，如下：\n  ```$img2img system.img system-ext4.img```\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_199_0.png)\n\n## 实验 8\n\n### 8.1 创建新产品\n\
    \n目标：定义一个运行在 Beaglebone 上的产品并检查其是否可以构建。你还无法测试它，因为之后还有一些工作要做。\n\n首先为 myorg 和 mydevice\
    \ 选择一个名称，并在 device/ 中创建相应的子目录。示例解决方案使用了 ti/beaglebone，这很有描述性但很无。。source build/envsetup.sh，从\
    \ lunch 组合中选择你的产品并进行构建。与模拟器构建一样，它需要一段时间才能完成。\n\n完成后，检查 out/target/product 目录是否包含生成的\
    \ cache.img、ramdisk.img、system.img 和 userdata.img 文件。\n\n"
