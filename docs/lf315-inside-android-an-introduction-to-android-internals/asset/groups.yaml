    * $ANDROID_TOOLCHAIN: current toolchain

    * $ANDROID_EABI_TOOLCHAIN: current ARM toolchain (same as $ANDROID_TOOLCHAIN)

    * $ARM_EABI_TOOLCHAIN: bare metal toolchain, suitable for compiling the kernel
    and bootloader


