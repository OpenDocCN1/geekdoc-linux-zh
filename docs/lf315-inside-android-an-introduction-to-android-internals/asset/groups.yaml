    * 致力于促进 Linux 成长的非营利财团

    * 推广 Linux 并提供中立协作与教育

    * 保护并支持 Linux 开发

    * 改进 Linux 作为技术平台

    * 赞助 Linux 创始人林纳斯·托瓦尔斯（Linus Torvalds）的工作

    * 受全球领先科技公司和开发者支持


    自 1991 年成立以来，Linux 已经成为计算领域的一股力量，驱动着从纽约证券交易所到手机，再到超级计算机和消费设备的一切设备。Linux 的增长。Linux
    基金会是一个致力于促进 Linux 成长的非营利财团。Linux 基金会成立于于 2000 年，赞助 Linux 创始人林纳斯·托瓦尔斯的工作，并受到全球领先科技公司和开发者的支持。


    Linux 基金会通过集结其成员和开源开发社区的资源来促进、保护和推进 Linux，以确保 Linux 保持免费和技术上的领先地位。


