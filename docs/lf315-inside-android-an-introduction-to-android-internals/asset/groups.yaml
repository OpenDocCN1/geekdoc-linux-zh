  - "[PAGE 365]\n\n# LF315 Inside Android: an Introduction to Android Internals\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_365_0.png)\n\n+   * The kernel device\
    \ driver interface is one level of hardware abstraction\n* Android extends this\
    \ with various shared libraries that abstract kernel interfaces further\n* The\
    \ Android framework is written to use the Android HAL\n* Reasons\n    * To smooth\
    \ over irregularities in the Linux driver interface, e.g. access to LEDs and backlights\n\
    \    * To add functions that are missing, e.g. in the framebuffer driver\n   \
    \ * To avoid the GPL license, e.g. with graphics drivers\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_365_1.png)\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_365_2.png)\n\nCopyright © 2013 Linux\
    \ Foundation. All rights reserved. DO NOT DISTRIBUTE."
