- md: "\n48 LF315 Inside Android: an Introduction to Android Internals\n\n## System\
    \ images\n\n- The files needed by the emulator are in out/target/product/generic/\n\
    - hardware-qemu.ini: emulator configuration settings\n- ramdisk.img: boot RAM\
    \ disk\n- system.img: system files\n- userdata.img: user data files\n- These images\
    \ are also supplied as part of the Android SDK\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_57_0.png)\n\
    \nCopyright © 2013 Linux Foundation. All rights reserved. DO NOT DISTRIBUTE.\n\
    \n## Session 3 First look\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_58_0.png)\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_59_0.png)\n\n## Session 3 First look\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_60_0.png)\n\n- adb devices: lists devices\
    \ connected to the adb server\n- Each has a unique identifier or serial number\n\
    - You need to pass this identifier when sending commands\n\n```\n$ adb devices\n\
    List of devices attached\nemulator-5554 device\nBlade-CM7 device\n\n$ adb -s emulator-5554\
    \ shell\n```\n\n- Don't need -s device-name if only one device\n- only one device\
    \ connected via USB: use -d\n- only one emulator: use -e\n\n## LF315 Inside Android:\
    \ an Introduction to Android Internals\n\n## Digression: USB permissions\n\n-\
    \ If you see this:\n```\n$ adb devices\nList of devices attached ????????? no\
    \ permissions\n```\n- You need to configure the permissions for the USB device\n\
    - Run the command lsusb to find the vendor and product ids\n- Create a rule in\
    \ /etc/udev.rules.d/51-android.rules: `SUBSYSTEM=\"usb\", ATTRS{idVendor}===\"\
    19d2\", ATTRS{idProduct}=\"1354\", MODE=\"0666\"`\n- Unplug the USB cable and\
    \ plug back again\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_61_0.png)\n\n##\
    \ Session 3 First look\n\n## Connection via TCP\n\n(Re)start adbd on the device\n\
    \n```\n# setprop service.adb.tcp.port 5555\n# stop adbd\n# start adbd\n```\n\n\
    Connect to the device from the host\n\n```\n$ adb connect 192.168.1.101:5555\n\
    connected to 192.168.1.101:5555\n$ adb shell\n#\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_62_0.png)\n\
    \n## LF315 Inside Android: an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_63_0.png)\n\
    \n## Commands for shell and copying files\n\n| command | description |\n| :---\
    \ | :--- |\n| shell | run remote shell |\n| push <local> <remote> | copy file/dir\
    \ to device |\n| pull <remote> [<local>] | copy file/dir from device |\n| sync\
    \ [<directory>] | copy host->device only if changed |\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_63_1.png)\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_63_2.png)\n\n## Session 3 First look\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_64_0.png)\n\n## LF315 Inside Android:\
    \ an Introduction to Android Internals\n\n- adb can forward TCP ports over USB\n\
    - e.g. for remote debugging using gdb\n- Command adb forward <local port> <remote\
    \ port>\n- Example: to connect port 5555 on host to port 1234 on target:\n```\n\
    adb forward tcp:5555 tcp:1234\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_65_0.png)\n\
    \n## Session 3 First look\n\n## Using adb with real hardware\n\n- Enable debugging\
    \ on the device\n- Up to Ice Sandwich the option is: Settings->Applications->USB\
    \ debugging\n- On Jelly Bean it is: Settings->Developer options->USB debugging\n\
    - If you don't see Developer options try opening Settings->About phone/tablet\
    \ and tapping the Build number 7 times to enable it\n- For release 4.2 you need\
    \ a contemporary version of adb server (from r16 or later)\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_66_0.png)\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_66_1.png)\n\nCopyright © 2013 Linux Foundation.\
    \ All rights reserved. DO NOT DISTRIBUTE.\n\n## Android file systems\n\nAndroid\
    \ divides files into four areas\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_67_0.png)\n\
    \n## Session 3 First look\n\n## Root file system\n\n- Contains only these items\n\
    - statically linked init program in /init\n- statically linked adb daemon in /sbin/adb\n\
    - init scripts, init.rc\n- Default system properties, default.prop\n- mount points\
    \ for other file systems\n- Usually mounted read-only\n- Usually a ramdisk\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_68_0.png)\n\n## The system file system\n\
    \n- Mounted as /system contains everything to bring the device up and run the\
    \ user interface\n\n| path | content |\n| :--- | :--- |\n| /system/app | Pre-installed\
    \ applications (.apk files) |\n| /system/bin | Command-line tools, including \"\
    toolbox\" (similar to Busybox) |\n| /system/etc | Configuration files |\n| /system/framework\
    \ | The core Java framework (.jar files) |\n| /system/lib | C/C++ shared objects\
    \ (.so files) and kernel modules (.ko files) |\n| /system/xbin | Various test\
    \ and debug programs |\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_69_0.png)\n\
    \n## Session 3 First look\n\n## LF315 Inside Android: an Introduction to Android\
    \ Internals\n\n## File system types\n\n- RAM disk: Standard Linux gzipped cpio\
    \ archive\n- system, data and cache: Must support writable mmap regions - rules\
    \ out jffs\n- Common choices:\n  - NAND flash: yaffs2\n  - eMMC and SD: ext4\n\
    \n(Wait, jff2 is likely jffs2)\n\n## LF315 Inside Android: an Introduction to\
    \ Android Internals\n\n## Implementation\n\n- Option 1: conventional Android:\
    \ ramdisk and file systems described\n- Option 2: roll the contents of the ramdisk\
    \ root file system into the system file system\n- Option 3: combine all filesystems\
    \ into one\n  - for example, to make it easy to use an NFS mounted root file system\n\
    \n## Session 3 First look\n\n## User space commands\n\n- In /system/bin\n- Many\
    \ trivial Unix commands provided by toolbox\n  - Similar to Busybox but BSD license\
    \ and much smaller\n- Up to Jelly Bean the shell is ash from NetBSD\n  - no command-line\
    \ completion\n- Since Jelly Bean, it is mksh from OpenBSD\n\n```\npwd\nls -l\n\
    df\ncat /proc/cpuinfo\ncat /proc/meminfo\ncat /proc/version\n```\n\nNote that\
    \ many traditional commands are missing, for example find, grep, tar, cp (yes)\n\
    \nFinally, type \"exit\" or Ctrl-D to terminate the shell.\n\nExercise 3.4 (Optional)\
    \ Connect to real hardware\n\nIf you have an Android phone or tablet, plug in\
    \ the USB cable between the device and laptop and enable USB debugging as shown\
    \ in the slides. On the laptop type adb devices.\n\nIf you see this:\n\n```\n\
    $ adb devices\nList of devices attached\n% ????????? no permissions\n```\n\n...\
    \ follow the instructions on the slide titled \"Digression: USB permissions\"\
    .\n\nRun adb devices again and check that it shows up this time. Launch an adb\
    \ shell with\n\n```\n$ adb -s <name of device> shell\n```\n\n## Session 4 Anatomy\
    \ of an application\n\n## Session 4: Anatomy of an application\n\n* Introduction\
    \ to Android applications and activities\n* Walk-through a simple project\n* Building\
    \ and installing an application\n* Applications and processes\n* Application life\
    \ cycle\n* Android logging\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_78_0.png)\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_79_0.png)\n\n## Session 4 Anatomy of\
    \ an application\n\n## Application SDK\n\n- To write an application you will need\
    \ an SDK\n- You can download one from\n  http://developer.android.com/sdk/index.html\n\
    - Or, build one from AOSP\n\n```\n$ . build/envsetup.sh\n$ lunch sdk-eng\n$ make\
    \ sdk\n```\n\nThe result is put in\nout/host/linux-x86/sdk/android-sdk-eng.[name]_linux-x86\n\
    \n## Coding an application\n\n- The next few slides show a very simple application\n\
    - Applications are mostly written in Java and compiled to byte code for the Dalvik\
    \ virtual machine\n  - As we shall see later, it is possible to write applications\
    \ in C/C++, but much harder to do\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_81_0.png)\n"
  mdcn: "\n\n48 LF315 深入理解 Android：Android 内部原理\n\n## 系统镜像\n\n- 模拟器所需的文件位于 `out/target/product/generic/`\n\
    - hardware-qemu.ini: 模拟器配置设置\n- ramdisk.img: 启动 RAM 磁盘\n- system.img: 系统文件\n-\
    \ userdata.img: 用户数据文件\n- 这些镜像也作为 Android SDK 的一部分提供\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_57_0.png)\n\
    \n版权 © 2013 Linux Foundation. 保留所有。请勿分发。\n\n## 第 3 节 初探\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_58_0.png)\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_59_0.png)\n\n## 第 3 节 初探\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_60_0.png)\n\
    \n- adb devices: 列出连接到 adb 服务的设备\n- 每个设备都有唯一的标识符或序列号\n- 在发送命令时你需要传递此标识符\n\n```\n\
    $ adb devices\nList of devices attached\nemulator-5554 device\nBlade-CM7 device\n\
    \n$ adb -s emulator-5554 shell\n```\n\n- 如果只有一个设备，则不需要 -s device-name\n- 仅通过 USB\
    \ 连接了唯一设备：使用 -d\n- 只有一个模拟器：使用 -e\n\n## LF315 深入理解 Android：Android 内部原理\n\n## 旁白：USB\
    \ 权限\n\n- 如果你看到这个：\n```\n$ adb devices\nList of devices attached ????????? no\
    \ permissions\n```\n- 你需要为 USB 设备配置权限\n- 运行命令 lsusb 查找查找厂商 ID 和产品 ID\n- 在 `/etc/udev.rules.d/51-android.rules`\
    \ 中创建一个规则：`SUBSYSTEM=\"usb\", ATTRS{idVendor}===\"19d2\", ATTRS{idProduct}=\"\
    1354\", MODE=\"0666\"`\n- 拔掉 USB 线并重新插上\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_61_0.png)\n\
    \n## 第 3 节 初探\n\n## 通过 TCP 连接\n\n在设备上（重）启动 adbd\n\n```\n# setprop service.adb.tcp.port\
    \ 5555\n# stop adbd\n# start adbd\n```\n\n从宿主机连接到设备\n\n```\n$ adb connect 192.168.1.101:5555\n\
    connected to 192.168.1.101:5555\n$ adb shell\n#\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_62_0.png)\n\
    \n## LF315 深入理解 Android：Android 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_63_0.png)\n\
    \n## shell 命令和文件拷贝\n\n| 命令 | 描述 |\n| :--- | :--- |\n| shell | 运行远程 shell |\n|\
    \ push <local> <remote> | 将文件/目录拷贝到设备 |\n| pull <remote> [<local>] | 从设备拷贝文件/目录\
    \ |\n| sync [<directory>] | 仅在发生变化时从宿主机到设备 |\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_63_1.png)\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_63_2.png)\n\n## 第 3 节 初探\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_64_0.png)\n\
    \n## LF315 深入理解 Android：Android 内部原理\n\n- adb 可以通过 USB 转发 TCP 端口\n- 例如，使用 gdb\
    \ 进行远程调试\n- 命令 adb forward <local port> <remote port>\n- 示例：将主机的 5555 端口连接到目标机的\
    \ 1234 端口：\n```\nadb forward tcp:5555 tcp:1234\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_65_0.png)\n\
    \n## 第 3 节 初探\n\n## 使用真实硬件配合 adb\n\n- 在设备上启用调试\n- 在 Ice Sandwich 之前，选项是：设置->应用程序->USB\
    \ 调试\n- 在 Jelly Bean 上是：设置->开发者选项->USB 调试\n- 点击“版本号”7 次进入开发者选项\n- 拔掉 USB 线并重新插上\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_66_0.png)\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_66_1.png)\n\
    \n版权 © 2013 Linux Foundation. 保留所有。请勿分发。\n\n## Android 文件系统\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_67_0.png)\n\
    \n## 第 3 节 初探\n\n## 用户空间\n\n- 在 `/system/bin`\n- toolbox 提供了许多命令\n  - 类似于 Busybox\
    \ 但体积更小\n- 自 Jelly Bean 起，shell 使用来自 ash\n  - 命令行补全\n\n```\npwd\nls -l\ndf\ncat\
    \ /proc/cpuinfo\ncat /proc/meminfo\ncat /proc/version\n```\n\n注意许多传统的命令缺失，例如 find,\
    \ grep, tar (yes)\n\n最后，输入 \"exit\" 或 Ctrl-D 终止 shell。\n\n练习 3.4（可选）连接真实硬件\n\n\
    如果你有 Android 手机或平板，用 USB 线连接设备和笔记本电脑，并按照幻灯片所示启用调试。在笔记本电脑上运行 adb devices。如果你看到这个：\n\
    \n```\n$ adb devices\nList of devices attached\n% ????????? no permissions\n```\n\
    \n... 参考“旁白：USB 权限”幻灯片的指令。再次运行 adb devices 并检查它是否出现。使用以下命令启动 adb shell：\n\n```\n\
    $ adb -s <设备名称> shell\n```\n\n## 第 4 节 应用剖\n\n## 第 4 节：应用剖\n\n* Android 应用和 Activity\
    \ 简介\n* 遍历项目\n* 构建并安装应用\n* 应用与进程\n* 应用生命周期\n* Android 日志\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_78_0.png)\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_79_0.png)\n\n## 第 4 节 应用剖\n\n## 应用\
    \ SDK\n\n- 编写应用你需要 SDK\n- 你可以从这里下载：\n  http://developer.android.com/sdk/index.html\n\
    - 或者，从 AOSP 构建\n\n```bash\n$ . build/envsetup.sh\n$ lunch sdk-eng\n$ make sdk\n\
    ```\n\n结果位于\nout/host/linux-x86/sdk/android-sdk-eng.[name]_linux-x86\n\n## 代码应用\n\
    \n- 接下来几页幻灯片展示了一个非常简单的应用\n- 应用主要用 Java 编写，并编译为 Dalvik 虚拟机的字节码\n  - 如我们后面看到的，可以使用\
    \ C/C++ 编写应用，但要困难得多\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_81_0.png)\n\n"
