  - '[PAGE 22]


    # Session 2 Introduction to Android


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_22_0.png)


    Android is a four layer cake.

    The bottom layer is a Linux kernel with a small number of modifications

    The second layer is the "user space" consisting of shared libraries (such as the
    C library, named bionic), command line utilities, including a shell, and native
    daemon processes.

    Alongside, there is a "hardware abstraction layer" of shared libraries that are
    used by the next layer to call kernel services. Most of this layer is written
    in C.

    The third layer, the Android Framework, is the main part of Android. It contains
    a large number (> 50) of services and the manager code that forms the interface
    to the upper application layer. The framework is written in a combination of C++
    and Java.

    The top layer is where Android applications run. This is the part that most Android
    developers are familiar with since it is is extensively documented at developer.android.com.
    Applications are mostly written in Java using the Android SDK, but can contain
    C and C++ code through the use of the NDK.'
  - "[PAGE 23]\n\n# Key features\n\n+   - Designed for mobile devices\n  - low power,\
    \ slow CPU, small amount of RAM, slow storage\n- Touch screen is the primary user\
    \ interface\n- Applications written in Java using component architecture\n  -\
    \ Dalvik VM instead of more conventional Sun JVM\n- Core components are open source"
