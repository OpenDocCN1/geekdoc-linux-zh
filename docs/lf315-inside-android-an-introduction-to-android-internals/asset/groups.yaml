- md: "\n## Custom home application\n\n- Extending an application to become the \"\
    launcher\" that is run when you press home is as simple as replacing the intent\
    \ filter with this code:\n\n```xml\n<intent-filter>\n  <action android:name=\"\
    android.intent.action.MAIN\" />\n  <category android:name=\"android.intent.category.HOME\"\
    \ />\n  <category android:name=\"android.intent.category.DEFAULT\" />\n</intent-filter>\n\
    ```\n\n- See the code for the default launcher in packages/apps/Launcher2\n\n\
    ## Session 6 Intents\n\n## Summary\n\n- An intent is a message from one application\
    \ component to another\n- It is an explicit intent if the destination is fully\
    \ defined\n  - i.e. there is a ComponentName\n- Otherwise, it is an implicit intent\
    \ and Android will find a suitable destination using intent resolution\n  - This\
    \ is a form of late binding between application objects\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_158_0.png)\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_158_1.png)\n\n## Lab 6\n\n### Exercise\
    \ 6.1 Start another activity\n\nThe sample application in /embedded-android/lab/lab6/testactivity\
    \ has two activities. The main activity has three buttons.\n\nExtend it so that\
    \ clicking the first button launches the other activity, the second launches an\
    \ activity in another application (for example helloworld) and the third starts\
    \ the browser with a url. To create a Url object from a string, use\n\n```java\n\
    Uri.parse(\"http://some-url\");\n```\n\n### Exercise 6.2 Starting applications\n\
    \nUse the am command to start an activity from the command line\n\n### Exercise\
    \ 6.3 (Optional) A custom home application\n\nWrite an application that implements\
    \ the home function\n\n## Session 7: Other application components\n\n151\n\n-\
    \ Service\n- Content provider\n- Broadcast receiver\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_160_0.png)\n\
    \n## Service\n\n- A long-running component without a user interface\n- The service\
    \ runs in the context of the application’s process\n  - a service does not run\
    \ as a separate process by default\n- The service is run from the main thread\n\
    \  - a service does not run as a separate thread by default\n\n## Session 7 Other\
    \ application components\n\n## Declaring a service\n\n- Extend interface Service\n\
    ```java\nimport android.app.Service;\n\npublic class TestServer extends Service\
    \ {\n```\n\n- Declare in AndroidManifest.xml\n```xml\n<application ...>\n  <service\
    \ android:name=\".TestServer\" />\n</application>\n```\n\n## Types of service\n\
    \n- There are two ways of interacting with a service\n- \"asynchronously\": it\
    \ is started and then runs in the background until stopped\n- \"synchronously\"\
    : the service provides a client-server interface and runs as long as there are\
    \ clients\n\n## Session 7 Other application components\n\n## Asynchronous services\n\
    \n- Started when another component, typically an activity, calls startService\n\
    - start has one parameter: the intent specifying the service\n\n```java\nIntent\
    \ intent = new Intent(TestServerActivity.this, TestServer.class);\nstartService(intent);\n\
    ```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_164_0.png)\n\n## Synchronous services\n\
    \n- Implement an IBinder interface\n- Started when the client calls bindService\n\
    - Destroyed when the last client calls unbindService\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_165_0.png)\n\
    \n## Session 7 Other application components\n\n## Service callback functions (1)\n\
    \n- onCreate and onDestroy are called when the service is first created and destroyed\n\
    - Note: you do not call the super as you do with activities\n```java\n@Override\n\
    public void onCreate() {\n}\n\n@Override\npublic void onDestroy() {\n}\n```\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_166_0.png)\n\n## Service callback functions\
    \ (2)\n\n- onStartCommand is called as result of someone else calling startActivity\n\
    - The return is one of the START_STICKY_MASK bits\n  - START_STICKY means don't\
    \ auto restart if it is killed with intents pending\n```java\n@Override\npublic\
    \ int onStartCommand(Intent intent, int flags, int startId) {\n    return START_STICKY;\n\
    }\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_167_0.png)\n\n## Service callback\
    \ functions (3)\n\n- Return the IBinder interface\n- If not implementing a synchronous\
    \ server, this function should return null\n```java\n@Override\npublic IBinder\
    \ onBind(Intent intent) {\n    return null;\n}\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_168_0.png)\n\
    \n## LF315 Inside Android: an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_169_0.png)\n\
    \n- A component that presents structured data to the rest of the system\n- Data\
    \ is organized into rows and columns, as in relational database\n- You can use\
    \ any storage method, but an SQLite database is a typical choice\n\n## Session\
    \ 7 Other application components\n\n## Declaring a content provider\n\n- Extend\
    \ interface ContentProvider\n```java\npublic class TestProvider extends ContentProvider\
    \ {\n```\n\n- Declare in AndroidManifest.xml\n```xml\n<application ...>\n    <provider\
    \ android:name=\".TestProvider\"\n       android:authorities=\"com.example.test.provider\"\
    />\n</application>\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_170_0.png)\n\
    \n## Access via URI\n\n- Queries may be constructed as URIs\n- For example, given\
    \ a content provider class com.example.test.provider that contains data table1:\n\
    \  - content://com.example.test.provider/table1\n\n## Session 7 Other application\
    \ components\n\n## Example\n\n```java\npublic class TestProvider extends ContentProvider\
    \ {\n    private static final UriMatcher sUriMatcher;\n\n    sUriMatcher.addURI(\"\
    com.example.test.provider\",\n        \"table1\", 1);\n    sUriMatcher.addURI(\"\
    com.example.test.provider\",\n        \"table/#\", 2);\n}\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_172_0.png)\n\
    \nCopyright © 2013 Linux Foundation. All rights reserved. DO NOT DISTRIBUTE.\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_173_0.png)\n\n## Session 7 Other application\
    \ components\n\n- Broadcast receivers receive broadcast intents\n- There is only\
    \ one callback: onReceive\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_174_0.png)\n\
    \n## Broadcast intents\n\n- Most are generated by the system, e.g. battery low,\
    \ incoming call\n- Can be generated by calling `Context.sendBroadcast()`\n  -\
    \ also `Context.sendOrderedBroadcast()`, `Context.sendStickyBroadcast()`\n\n##\
    \ Session 7 Other application components\n\n167\n\n## Declaring a broadcast receiver\n\
    \n- Extend interface BroadcastReceiver\n```java\npublic class TestReceiver extends\
    \ BroadcastReceiver {\n```\n\n- Declare in AndroidManifest.xml\n```xml\n<application>\n\
    \  <receiver android:name=\".TestReceiver\" />\n</application>\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_176_0.png)\n\
    \n## Summary\n\n- There are four types of application component already\n- Activities\
    \ have been covered already\n- Servers: provide background processing without\
    \ a user interface\n  - Two types: asynchronous - run until stopped, and synchronous\
    \ - implement an interface and run so long as there are clients bound to that\
    \ interface\n- Content providers: present a data store which other components\
    \ can query\n- Broadcast receivers: a means to receive broadcast intents\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_177_0.png)\n\
    \n## Session 7 Other application components\n\n## Lab 7\n\n### Exercise 7.1 Create\
    \ a service\n\nThere is a sample application containing a service and an activity\
    \ with buttons to start and stop the service in $HOME/embedded-android/lab7\n\n\
    Run the application while running logcat in another window and check that the\
    \ server life-cycle is as expected. Note that it continues to run even if the\
    \ activity is not visible (e.g. the server's onDestroy method is not called when\
    \ you press the home button)\n\n### Exercise 7.2 Content provider\n\nThere is\
    \ an example content provider in $HOME/embedded-android/lab7\n\n### Exercise 7.3\
    \ Broadcast receiver\n\nThere is an example broadcast receiver in $HOME/embedded-android/lab7\n\
    \n## Session 8: Board Configuration\n\n- Creating a new device definition\n- Add\
    \ to the lunch combo\n"
  mdcn: "\n\n## 自定义主页应用\n\n- 将应用程序扩展为按下主页键运行的“启动器”，只需将意图过滤器（intent filter）替换为此代码：\n\
    \n```xml\n<intent-filter>\n  <action android:name=\"android.intent.action.MAIN\"\
    \ />\n  <category android:name=\"android.intent.category.HOME\" />\n  <category\
    \ android:name=\"android.intent.category.DEFAULT\" />\n</intent-filter>\n```\n\
    \n- 查看 packages/apps/Launcher2 中默认启动器的代码\n\n## 第 6 节意图 (Intents)\n\n## 总结\n\n\
    - 意图是从应用程序组件到另一个组件的消息\n- 如果目标完全定义，则它是一个显式意图\n  - 即存在一个 ComponentName\n- 否则，它是一个隐式意图，Android\
    \ 将通过意图解析（intent resolution）找到合适的目标\n  - 这是对象之间的一种延迟绑定形式\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_158_0.png)\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_158_1.png)\n\n## 第 6 实验\n\n### 练习 6.1\
    \ 启动另一个 Activity\n\n/embedded-android/lab/lab6/testactivity 中的示例应用程序有两个 Activity。主\
    \ Activity 有三个按钮。\n\n扩展它，使得点击第一个按钮启动另一个 Activity，点击第二个按钮启动另一个应用程序中的 Activity（例如\
    \ helloworld），第三个按钮启动带有 URL 的浏览器。要从字符串创建 Uri 对象，请使用\n\n```java\nUri.parse(\"http://some-url\"\
    );\n```\n\n### 练习 6.2 启动应用程序\n\n使用 am 命令从命令行启动 Activity\n\n### 练习 6.3（可选）自定义主页应用\n\
    \n编写一个实现主页功能的应用程序\n\n## 第 7 节：其他应用程序组件\n\n151\n\n- 服务 (Service)\n- 内容提供者 (Content\
    \ provider)\n- 广播接收器 (Broadcast receiver)\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_160_0.png)\n\
    \n## 服务 (Service)\n\n- 一个没有用户界面的长时间运行组件\n- 服务在应用程序进程的范围内运行\n  - 默认情况下，服务不会作为单独进程运行\n\
    - 服务从主线程运行\n  - 默认情况下，服务不会作为单独线程运行\n\n## 第 7 节其他应用程序组件\n\n## 声明服务\n\n- 扩展接口 Service\n\
    ```java\nimport android.app.Service;\n\npublic class TestServer extends Service\
    \ {\n```\n\n- 在 AndroidManifest.xml 中声明\n```xml\n<application ...>\n  <service\
    \ android:name=\".TestServer\" />\n</application>\n```\n\n## 服务类型\n\n- 与服务的交互有两种\n\
    - “异步地”：它被启动并在后台运行，直到被停止\n- “同步地”：服务提供客户端-服务器接口，只要有客户端它就一直运行\n\n## 第 7 节其他应用程序组件\n\
    \n## 异步服务\n\n- 当另一个组件（通常是 Activity）调用 startService 时启动\n- start 有一个参数：指定服务的 intent\n\
    \n```java\nIntent intent = new Intent(TestServerActivity.this, TestServer.class);\n\
    startService(intent);\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_164_0.png)\n\
    \n## 同步服务\n\n- 实现 IBinder 接口\n- 当客户端调用 bindService 时启动\n- 当最后一个客户端调用 unbindService\
    \ 时销毁\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_165_0.png)\n\n## 第 7 节其他应用程序组件\n\
    \n## 服务回调函数 (1)\n\n- 在服务创建和销毁时调用 onCreate 和 onDestroy\n- 注意：不要像 Activity 那样调用\
    \ super\n```java\n@Override\npublic void onCreate() {\n}\n\n@Override\npublic\
    \ void onDestroy() {\n}\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_166_0.png)\n\
    \n## 服务回调函数 (2)\n\n- 当有人调用 startActivity 时调用 onStartCommand\n- 返回位位之一\n  - START_STICKY\
    \ 表示如果在带有待处理意图时被杀死，则会自动重启\n```java\n@Override\npublic int onStartCommand(Intent\
    \ intent, int flags, int startId) {\n    return START_STICKY;\n}\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_167_0.png)\n\
    \n## 服务回调函数 (3)\n\n- 返回 IBinder 接口\n- 如果不实现同步服务，此函数返回 null\n```java\n@Override\n\
    public IBinder onBind(Intent intent) {\n    return null;\n}\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_168_0.png)\n\
    \nLF315 Android 内部：Android 原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_169_0.png)\n\
    \n- 向系统其他部分呈现结构化数据的组件\n- 数据像关系型数据库一样组织成行和列\n- 你可以使用任何存储方法，但 SQLite 数据库是选择\n\n\
    ## 第 7 节其他应用程序组件\n\n## 声明内容提供者\n\n- 扩展接口 ContentProvider\n```java\npublic class\
    \ TestProvider extends ContentProvider {\n```\n\n- 在 AndroidManifest.xml 中声明\n\
    ```xml\n<application ...>\n    <provider android:name=\".TestProvider\"\n    \
    \   android:authorities=\"com.example.test.provider\"/>\n</application>\n```\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_170_0.png)\n\n## 通过 URI 访问\n\n- 查询可以构建为\
    \ URI\n- 例如，给定包含 table1 的内容提供者类 com.example.test.provider：\n  - content://com.example.test.provider/table1\n\
    \n## 第 7 节其他应用程序组件\n\n## 示例\n\n```java\npublic class TestProvider extends ContentProvider\
    \ {\n    private static final UriMatcher sUriMatcher;\n\n    sUriMatcher.addURI(\"\
    com.example.test.provider\",\n        \"table1\", 1);\n    sUriMatcher.addURI(\"\
    com.example.test.provider\",\n        \"table/#\", 2);\n}\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_172_0.png)\n\
    \nCopyright © 2013 Linux Foundation. 保留所有权利。禁止发行。\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_173_0.png)\n\
    \n## 第 7 节其他应用程序组件\n\n- 广播接收器接收广播意图\n- 只有一个回调：onReceive\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_174_0.png)\n\
    \n## 广播意图\n\n- 大多数由系统生成，例如电量低、来电\n- 可以通过调用 `Context.sendBroadcast()` 生成\n  - \
    \ `Context.sendOrderedBroadcast()`，`Context.sendStickyBroadcast()`\n\n## 第 7 节其他应用程序组件\n\
    \n167\n\n## 声明广播接收器\n\n- 扩展接口 BroadcastReceiver\n```java\npublic class TestReceiver\
    \ extends BroadcastReceiver {\n```\n\n- 在 AndroidManifest.xml 中声明\n```xml\n<application>\n\
    \  <receiver android:name=\".TestReceiver\" />\n</application>\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_176_0.png)\n\
    \n## 总结\n\n- 已经有四种应用程序组件\n- 已经涵盖了 Activity\n- 服务：提供没有用户界面的后台处理\n  - 类型：异步——运行直到停止，同步——实现接口并只要有客户端绑定到该接口就一直运行\n\
    - 内容提供者：提供其他组件可以查询的数据存储\n- 广播接收器：接收广播意图的方法\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_177_0.png)\n\
    \n## 第 7 节其他应用程序组件\n\n## 第 7 实验\n\n### 练习 7.1 创建服务\n\n在 $HOME/embedded-android/lab7\
    \ 中有一个包含服务和一个带有启动和停止服务按钮的 Activity 的示例应用程序\n\n运行应用程序的同时在另一个窗口运行 logcat，并检查生命周期是否符合预期。注意即使\
    \ Activity 不可见，它也会继续运行（例如，按下主页键时，服务的 onDestroy 方法不会被调用）\n\n### 练习 7.2 内容提供者\n\n\
    在 $HOME/embedded-android/lab7 中有一个示例内容提供者\n\n### 练习 7.3 广播接收器\n\n在 $HOME/embedded-android/lab7\
    \ 中有一个示例广播接收器\n\n## 第 8 节：板级配置\n\n- 创建新的设备定义\n- 添加到 lunch combo\n\n"
