- md: "\n## Group IDs\n\n- Group IDs are assigned to each process based on the permissions\
    \ requested in AndroidManifest.xml\n- For example:\n\n```bash\n# ps\n...\nu00_a27\
    \ 360 36 170720 35972 S com.android.email\n# cat /proc/360/status\n...\nGroups:\
    \ 1015 3003\n```\n\n- From android_filesystem_config.h we can see:\n#define AID_SDCARD_RW\
    \ 1015\n#define AID_INET 3003\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_101_0.png)\n\
    \n## Application permissions\n\n- Application permissions are requested in 'uses-permission'\
    \ section of AndroidManifest.xml\n- When installing an application the user is\
    \ shown a list of permissions and asked to accept or decline the installation\n\
    - The format is\n- For example, to access external storage (e.g. SD card):\n`<uses-permission\
    \ android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"/>`\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_102_0.png)\n\
    \nThe list of standard system permissions are defined in the description of class\
    \ Manifest.permission.\nOther examples include:\n- BLUETOOTH: connect to paired\
    \ bluetooth devices\n- CAMERA: use the camera device\n- INTERNET: use Internet\
    \ sockets\n- WAKE_LOCK: use WakeLocks to keep processor from sleeping\n\n## Mapping\
    \ permissions to GIDs\n\n- Mapping is defined in /system/etc/permissions/platform.xml\n\
    - Example\n\n```xml\n<permission name=\"android.permission.WRITE_EXTERNAL_STORAGE\"\
    >\n  <group gid=\"sdcard_rw\" />\n</permission>\n```\n\nAnd, there is a table\
    \ in android_filesystem_config.h that maps \"sdcard_rw\" to a GID:\n\n```cpp\n\
    static const struct android_id_info android_id_ids[] = {\n  \"sdcard_rw\", AID_SDCARD_RW,\n\
    \  ..\n};\n```\n\n## Session 4 Anatomy of an application\n\nYou can show threads\
    \ using ps with the -t option:\n\n| USER | PID | PPID | SIZE | RSS | NAME |\n\
    | :--- | :--- | :--- | :--- | :--- | :--- |\n| u0_a45 | 872 | 37 | 176476 | 20860\
    \ | com.example.helloworld |\n| u0_a45 | 874 | 872 | 176476 | 20860 | GC |\n|\
    \ u0_a45 | 875 | 872 | 176476 | 20860 | Signal Catcher |\n| u0_a45 | 877 | 872\
    \ | 176476 | 20860 | JDWP |\n| u0_a45 | 878 | 872 | 176476 | 20860 | Compiler\
    \ |\n| u0_a45 | 879 | 872 | 176476 | 20860 | ReferenceQueueD |\n| u0_a45 | 881\
    \ | 872 | 176476 | 20860 | FinalizerDaemon |\n| u0_a45 | 882 | 872 | 176476 |\
    \ 20860 | FinalizerWatch |\n| u0_a45 | 883 | 872 | 176476 | 20860 | Binder |\n\
    | u0_a45 | 884 | 872 | 176476 | 20860 | Binder |\n\nExplanation\n\n| Thread |\
    \ Description |\n| :--- | :--- |\n| com.example.helloworld | The main (UI) thread\
    \ |\n| GC | Garbage collector |\n| Signal Catcher | Handles signals |\n| JDWP\
    \ | Java Debug Protocol for debugging (depends on debug=1) |\n| Compiler | JIT\
    \ |\n| ReferenceQueueD | Dalvik VM - track references |\n| FinalizerDaemon | Dalvik\
    \ VM - finalizes objects |\n| FinalizerWatch | Dalvik VM - finalizes objects |\n\
    | Binder | Binder is a type of inter-process communication |\n\n## Application\
    \ lifecycle\n\nOnce an application has been started it will continue to exist\
    \ until\n- system resources reach a low threshold and the out-of-memory killer\
    \ kills it\n- explicitly killed by the user via Settings -> Applications -> Force\
    \ Stop\n- the device is powered off\n\n## Callbacks\n\n- onCreate(): activity\
    \ first started: set up global state\n- onRestart(): activity that was in stopped\
    \ state has become visible\n- onStart(): some or all of the activity is visible\n\
    - onResume(): this is the foreground activity\n- onPause(): no longer the foreground\
    \ activity, e.g. dialog has popped up or the device is about to sleep\n- onStop():\
    \ no part is visible anymore\n- onDestroy(): release any resources claimed in\
    \ onCreate\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
    \ {\n    // If the activity is being re-initialized after being shut down savedInstanceState\
    \ contains the data saved by onSaveInstanceState(Bundle), otherwise it is null\n\
    }\n```\n\nAll other life cycle callbacks follow the same pattern:\n\n```java\n\
    @Override\nprotected void onResume() {\n    super.onResume();\n}\n```\n\nIn all\
    \ cases the super class must be called otherwise an exception is thrown\n\nStarting\
    \ a new activity causes:\n- the current activity to be paused\n- the new activity\
    \ to be started\n- Note: it does not create a new process: the new activity operates\
    \ in the context of the existing process\n\n## Log format\n\n`[Priority]/[Tag]([PID]):\
    \ [Message]`\n\nExample:\n`I/ActivityManager( 66): System now ready`\n\nPriority\
    \ (starting with the highest):\n- S Silent\n- F Fatal/Error\n- W Warning\n- I\
    \ Information (default)\n- D Debug\n- V Verbose\n\n## Displaying the log\n\n-\
    \ Display the main log buffer and wait for further output:\n  - `logcat`\n- Display\
    \ other log buffers (events or radio and wait for further output):\n  - `logcat\
    \ -b <buffer>`\n- Filter the output: you can add any number of Tag:Priority filter\
    \ specs, plus one global spec of the form *:Priority. The default spec is *:v.\
    \ Messages with priority equal to or greater than are displayed. For example:\n\
    \  - `logcat *::`\n  - Only messages from MyApp\n\n## Writing to the log (Java)\n\
    \n- Use the Log methods v, d, i, w, e and wtf to write verbose, debug, information,\
    \ warning, error and terrible failure messages to the main log Each takes two\
    \ string parameters, the Tag and the Message\nExample:\n```java\nimport android.util.Log;\n\
    Log.d(\"HelloWorld\", \"Hello world\");\n```\n\n## Writing to the log (C++)\n\n\
    The macros ALOGV, ALOGD, ALOGI, ALOGW and ALOGE write verbose, debug, information,\
    \ warning and error messages to the main log Each takes a single string which\
    \ may include printf characters The Tag is picked per definition LOG_TAG\nExample:\n\
    ```cpp\n#include <utils/log.h>\n\n#define LOG_TAG \"lights\"\n\nALOGE(\"Failed\
    \ to open %s\", path);\n```\n\n## Summary\n\n- An application can contain four\
    \ types of component: activity, service, content provider, broadcast receiver\n\
    - Each runs in its own VM as a Linux process with unique user ID\n- The application\
    \ is started and stopped as needed and resources allow\n- An activity is informed\
    \ of life cycle events by callbacks such as onCreate()\n\n## Lab 4\n\n### 4.1\
    \ Build the SDK\n\nHere you will build the SDK from the AOSP, which will take\
    \ 10 minutes or so. Starting with new shell:\n\n```bash\n$ . build/envsetup.sh\n\
    $ lunch sdk-eng\n$ make -jN sdk\n```\n\nYou will see that the SDK is generated\
    \ in out/host/linux-x86/sdk\n\nInstall the SDK into your home directory:\n\n```bash\n\
    $ cd ~\n$ unzip ^/embedded-android/aosp/out/host/linux-x86/sdk/android-sdk_eng.[your\
    \ name]_linux-x86.zip\n```\n\nCreate a script file with the following contents\
    \ to set up paths:\n```bash\nexport ANDROID_HOME=$HOME/src/android-sdk_eng.[your\
    \ name]_linux-x86\nPATH=$ANDROID_HOME/tools:$ANDROID_HOME/platform-tools:$PATH\n\
    ```\n\nYou will need to source this script whenever you use the SDK\n"
