- md: "\n# LF315 Inside Android: an Introduction to Android Internals\n\nCopyright\
    \ © 2013 Linux Foundation. \nAll rights reserved. DO NOT DISTRIBUTE.\n\n## Parcelable\
    \ objects \n\n- To be parcelable, an object must:\n  - Implement the Parcelable\
    \ interface\n  - Have a writeToParcel function\n  - Have a static field CREATOR\
    \ which implements the Parcelable.Creator interface\n\n## Authentication using\
    \ Binder handles\n\n- The authenticity of a Binder message is known because it\
    \ is validated by the binder driver\n- The message is represented by a token which\
    \ cannot be spoofed\n- The UID and PID of the sender is part of the message header\n\
    - The Package Manager has a list of application names and UIDs\n- Hence it is\
    \ possible for a server to verify if a client has permission to access a given\
    \ function within the server\n\n```java\nint Binder.getCallingUid();\nint Binder.getCallingPid();\n\
    int Context.checkPermission(String permission, int pid, int uid);\n```\n\n## One-way\
    \ Binder messages\n\n- One-way means no reply\n- Caller does not wait for callee\n\
    - Asynchronous message\n- Example: sending death notification messages (next topic)\n\
    \n## Death notification\n\n- Binder objects have an observer list\n- A local object\
    \ can request to be informed when another (remote) object is terminated\n- Typically\
    \ it is used so a callback is sent to server when client dies\n- Allows to reclaim\
    \ resources\n- Essential to Binder and Android where process may be killed due\
    \ to low memory\n\n## Binder object references\n\n- A 32-bit number, either a\
    \ local address in the process address space or an opaque reference to an object\
    \ in another process address space\n- The Binder takes care of mapping local and\
    \ remote object references as objects pass from one process to another\n- The\
    \ binder driver keeps all this information (per process) and Reference counted\
    \ so the owner of the object is told when count drops to zero\n\n## Intents\n\n\
    - Intents are messages passed between application components\n- Can be in the\
    \ same application or a different one\n- Intents are a high level abstraction\
    \ built on Binder\n\n## Other forms of IPC\n\n- In addition to Binder-based IPC,\
    \ Android uses:\n  - Local (Unix) sockets\n  - Signals\n\nThese are potential\
    \ problems for all operating systems but avoided because most systems are well-behaved:\
    \ they only run code from trusted archives and don't run out of memory.\n\n##\
    \ Startup\n\nService manager and system server are started from init.rc like:\n\
    \n```\nservice servicemanager /system/bin/servicemanager user system group system\n\
    service zygote /system/bin/zygote root system group\n\n```\n\n## System Server\n\
    \n- Central place for registering services\n- Many run in separate threads\n-\
    \ Runs with user system\n- Code is in /framework/base/services/java/android/server\n\
    \nThe following slides show a simple example of adding a new service\n- The service\
    \ has just two functions: addInts() and echoString()\n- Components:\n  - SimpleService:\
    \ an application that is started automatically at boot\n  - ISimpleService: an\
    \ interface defined in AIDL\n  - SimpleManager: a Java library that implements\
    \ the client-side interface to SimpleService\n  - SimpleManagerApp: an application\
    \ that demonstrates the use of the manager\n\n## Interface\n\n- A simple AIDL\
    \ file (ISimpleManager.aidl)\n\n```java\npackage com.example.simplemanager;\n\n\
    interface ISimpleManager {\n    int addInts(int a, int b);\n    String echoString(String\
    \ s);\n}\n```\n\n- Generates:\n  - manager proxy: ISimpleManager\n  - service\
    \ stub: ISimpleManager.Stub\n\n## SimpleService implementation\n\n```java\nclass\
    \ ISimpleServiceImpl extends ISimpleManager.Stub {\n    private final Context\
    \ context;\n\n    ISimpleServiceImpl(Context context) {\n        this.context\
    \ = context;\n    }\n    public int addInts(int a, int b) {\n        return a\
    \ + b;\n    }\n    public String echoString(String s) {\n        return s;\n \
    \   }\n}\n```\n\n```java\npublic class SimpleServiceApp extends Application {\n\
    \    private static final String REMOTE_SERVICE_NAME = ISimpleManager.class.getName();\n\
    \    private ISimpleServiceImpl serviceImpl;\n\n    public void onCreate() {\n\
    \        super.onCreate();\n        this.serviceImpl = new ISimpleServiceImpl(this);\n\
    \        ServiceManager.addService(REMOTE_SERVICE_NAME, this.serviceImpl);\n \
    \   }\n}\n```\n\n## SimpleManager Java library (1)\n\n- SimpleManager.java implements\
    \ the manager interface as a Java library\n\n```java\npublic class SimpleManager\
    \ {\n    private static final String REMOTE_SERVICE_NAME = ISimpleManager.class.getName();\n\
    \    private final ISimpleManager service;\n\n    public static SimpleManager\
    \ getInstance() {\n        return new SimpleManager();\n    }\n\n    private SimpleManager()\
    \ {\n        this.service = ISimpleManager.Stub.asInterface(ServiceManager.getService(REMOTE_SERVICE_NAME));\n\
    \    }\n}\n```\n\n## SimpleManager Java library (2)\n\n- Here are the stub functions\
    \ that call the service\n\n```java\npublic int addInts(int a, int b) {\n    try\
    \ {\n        return service.addInts(a, b);\n    } catch (RemoteException e) {\n\
    \        throw new RuntimeException(\"addInts\", e);\n    }\n}\n```\n\n## Building\
    \ the library\n\n- This is the Android.mk for SimpleManager library\n- It generates\
    \ com.example.simplemanager.jar\n\n```\nLOCAL_PATH := $(CLEAR_VARS)\ninclude MODULE_TAGS\
    \ := optional\nLOCAL_MODULE := com.example.simplemanager\nLOCAL_SRC_FILES := $(call\
    \ all-java-files,.)\nLOCAL_SRC_FILES += com/example/simplemanager/\ninclude $(BUILD_JAVA_LIBRARY)\n\
    ```\n\n- Android applications are not allowed to link with untrusted libraries\n\
    - Need to add com.example.simplemanager.xml to /system/etc/permissions/\n- Containing:\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<permissions>\n  <library\
    \ name=\"com.example.simplemanager\" file=\"/system/framework/com.example.simplemanager.jar\"\
    />\n</permissions>\n```\n"
  mdcn: "\n\n# LF315 深入 Android：Android 内部原理\n\nCopyright © 2013 Linux Foundation.\
    \ \n保留所有权利。请勿分发。\n\n## Parcelable 对象 \n\n- 要成为 parcelable 对象，该对象必须：\n  - 实现 Parcelable\
    \ 接口\n  - 拥有一个 `writeToParcel` 函数\n  - 拥有一个实现 Parcelable.Creator 接口的静态字段 CREATOR\n\
    \n## 使用 Binder 句柄进行认证\n\n- Binder 消息的真实性是已知的因为它因为它了 binder 驱动程序的验证\n- 消息由一个不可伪造的令牌（token）表示\n\
    - 者的 UID 和 PID 是消息头部的一部分\n- 软件包管理器（Package Manager）拥有一个应用程序名称和 UID 的列表\n- 因此，服务器可以验证客户端是否有权限访问服务器内的给定函数\n\
    \n```java\nint Binder.getCallingUid();\nint Binder.getCallingPid();\nint Context.checkPermission(String\
    \ permission, int pid, int uid);\n```\n\n## 单向 Binder 消息\n\n- 单向意味着没有回复\n- 调用者不等待调用者\n\
    - 异步消息\n- 示例：发送死亡通知消息（下一个主题）\n\n## 死亡通知\n\n- Binder 对象拥有一个观察者列表\n- 本地对象可以请求在另一个（远程）对象终止时被通知\n\
    - 通常用于在客户端死亡时向服务器发送回调\n- 允许回收资源\n- 对于 Binder 和 Android 至关重要，因为进程可能会由于内存不足而被杀掉\n\
    \n## Binder 对象引用\n\n- 一个 32 位数字，可以是进程地址空间中的本地地址，也可以是指向另一个进程地址空间中对象的透明引用\n- 当对象从一个进程传递到另一个进程时，Binder\
    \ 负责本地和远程对象引用的映射\n- binder 驱动程序保留所有这些信息（每个进程）并进行引用计数，当计数减为零时通知对象的所有者\n\n## Intents（意图）\n\
    \n- Intent 是应用组件之间传递的消息\n- 可能在同一个应用程序中，也可以在不同的应用程序中\n- Intent 是构建在 Binder 之上的高级抽象\n\
    \n## 其他形式的 IPC\n\n- 除了基于 Binder 的 IPC，Android 还会使用：\n  - 本地 (Unix) sockets\n \
    \ - 信号 (Signals)\n\n这些是所有操作系统的潜在问题，但由于大多数系统运行良好因此被避免了：它们只运行来自受信任存档的代码，并且不会耗尽内存。\n\
    \n## 启动\n\n服务管理器和系统服务器 从 init.rc 启动，如下：\n\n```\nservice servicemanager /system/bin/servicemanager\
    \ user system group system\nservice zygote /system/bin/zygote root system group\n\
    \n```\n\n## System Server\n\n- 注册服务的中心位置\n- 许多服务在独立的线程中运行\n- 以用户 system 运行\n-\
    \ 代码位于 /framework/base/services/java/android/server\n\n以下幻灯片展示了添加新服务的简单示例\n- 该服务只有两个函数：addInts()\
    \ 和 echoString()\n- 组件：\n  - SimpleService：一个在启动时自动启动的应用程序\n  - ISimpleService：在\
    \ AIDL 中定义的接口\n  - SimpleManager：一个实现 SimpleService 客户端接口的 Java 库\n  - SimpleManagerApp：一个演示使用管理器的应用程序\n\
    \n## 接口\n\n- 一个简单的 AIDL 文件 (ISimpleManager.aidl)\n\n```java\npackage com.example.simplemanager;\n\
    \ninterface ISimpleManager {\n    int addInts(int a, int b);\n    String echoString(String\
    \ s);\n}\n```\n\n- 生成：\n  - manager 代理：ISimpleManager\n  - service 存根：ISimpleManager.Stub\n\
    \n## SimpleService 实现\n\n```java\nclass ISimpleServiceImpl extends ISimpleManager.Stub\
    \ {\n    private final Context context;\n\n    ISimpleServiceImpl(Context context)\
    \ {\n        this.context = context;\n    }\n    public int addInts(int a, int\
    \ b) {\n        return a + b;\n    }\n    public String echoString(String s) {\n\
    \        return s;\n    }\n}\n```\n\n```java\npublic class SimpleServiceApp extends\
    \ Application {\n    private static final String REMOTE_SERVICE_NAME = ISimpleManager.class.getName();\n\
    \    private ISimpleServiceImpl serviceImpl;\n\n    public void onCreate() {\n\
    \        super.onCreate();\n        this.serviceImpl = new ISimpleServiceImpl(this);\n\
    \        ServiceManager.addService(REMOTE_SERVICE_NAME, this.serviceImpl);\n \
    \   }\n}\n```\n\n## SimpleManager Java 库 (1)\n\n- SimpleManager.java 作为 Java 库实现了管理器接口\n\
    \n```java\npublic class SimpleManager {\n    private static final String REMOTE_SERVICE_NAME\
    \ = ISimpleManager.class.getName();\n    private final ISimpleManager service;\n\
    \n    public static SimpleManager getInstance() {\n        return new SimpleManager();\n\
    \    }\n\n    private SimpleManager() {\n        this.service = ISimpleManager.Stub.asInterface(ServiceManager.getService(REMOTE_SERVICE_NAME));\n\
    \    }\n}\n```\n\n## SimpleManager Java 库 (2)\n\n- 这里是调用服务的存根函数\n\n```java\npublic\
    \ int addInts(int a, int b) {\n    try {\n        return service.addInts(a, b);\n\
    \    } catch (RemoteException e) {\n        throw new RuntimeException(\"addInts\"\
    , e);\n    }\n}\n```\n\n## 编译库\n\n- 这是 SimpleManager 库的 Android.mk\n- 生成 com.example.simplemanager.jar\n\
    \n```\nLOCAL_PATH := $(CLEAR_VARS)\ninclude MODULE_TAGS := optional\nLOCAL_MODULE\
    \ := com.example.simplemanager\nLOCAL_SRC_FILES := $(call all-java-files,.)\n\
    LOCAL_SRC_FILES += com/example/simplemanager/\ninclude $(BUILD_JAVA_LIBRARY)\n\
    ```\n\n- Android 应用程序不允许与不可信的库链接\n- 需要向 /system/etc/permissions/ 添加 com.example.simplemanager.xml\n\
    - 内容为：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<permissions>\n\
    \  <library name=\"com.example.simplemanager\" file=\"/system/framework/com.example.simplemanager.jar\"\
    />\n</permissions>\n```\n\n"
