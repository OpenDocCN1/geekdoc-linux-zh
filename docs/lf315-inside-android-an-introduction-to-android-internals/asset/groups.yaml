    \ events\n\n- A multitouch event is reported by\n  - EV_ABS, ABS_MT\nTRACKING\
    \ theID, value = unique ID for this contact\n- Then one or more\n  - EV_ABS, ABS_MT\n\
    PRESSURE, value\n  - EV_ABS, ABS_MT_POSITION_X, value\n  - EV_ABS, ABS_MT_POSITION_Y,\
    \ value\n  - EV_SYN, SYN_REPORT\n- Terminated by\n  - EV_ABS, ABS_MT_TRACKING_ID,\
    \ value = 0xffffff\n  - EV\nSYN, SYN_REPORT\n\n## Key layout files\n\n- Linux\
    \ scan codes are translated into Android key codes using key layout (.kl) files\n\
    - The format is:\n  - key <scancode> <keycode> [flags]\n  - scancode is the Linux\
    \ key code\n  - keycode is the Android key name\n  - flags optional policy flags,\
    \ separated by spaces\n  - Example (from Galaxy Nexus, tuna-gpio-keypad.kl)\n\n\
    ```\nkey 114 VOLUME_DOWN WAKE\nkey 115 VOLUME_UP WAKE\nkey 116 POWER WAKE\n```\n\
    \nLinux key codes are defined in include/linux/input.h\n\nAndroid key names are\
    \ defined in android.view.KeyEvent. Note that the names in the key layout file\
    \ have been stripped of the KEYCODE_ prefix.\n\n## Policy flags\n\n- WAKE and\
    \ WAKE_DROPPED: Wake up the device\n- SHIFT: interpret as shift\n- CAPS_LOCK:\
    \ interpret as caps lock\n- ALT: interpret as alt\n- ALT_GR: interpret as alt\
    \ gray\n- FUNCTION: interpret as function key\n- VIRTUAL: this is a virtual soft\
    \ key adjacent to the main touch screen\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_416\n\
    0.png)\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c\n416_1.png)\n\n## Naming of\
    \ files\n\n- Key layout files are searched for (in order)\n  - /system/usr/keylayout\
    \ and /data/system/devices/keylayout\n- Files may be named based on the Linux\
    \ input device name\n  - e.g. tuna-gpio-keypad.kl\n- External devices connected\
    \ by USB or Bluetooth may instead use the vendor and product id (and optionally\
    \ version):\n  - Vendor_XXXX_Product_XXXX.kl or\n  - Vendor_XXXX_Product_XXXX_Version_XXXX.kl\n\
    \  - e.g. Vendor_045e_Product_028e.kl\n- In all cases fall back to Generic.kl\
    \ if no specific .kl file found\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_417_0.png)\n\
    \n## Validate keymaps\n\n- Build the tool\n\n```\n$ mmm frameworks/base/tools/validatekeymaps\n\
    ```\n\n- Use it to check a modified file\n\n```\n$ validatekeymaps tuna-gpio-keypad.kl\n\
    ```\n\nValidating file 'tuna-gpio-keypad.kl'...\nE/KeyLayoutMap(87688): tuna-gio-keypad.kl:24:\
    \ Expected Error -22 parsing key layout file.\n\nFailed!\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_418_0.png)\n\
    \n## Key character map files\n\n- Key character map files (kcm files) map combinations\
    \ of Android key codes with modifiers to Unicode characters\n- There should be\
    \ one for each internal keyboard\n- Begins with type <type declaration>\n- Where\
    \ <type declaration> is one of\n  - FULL: A full PC-style keyboard\n  - ALPHA:\
    \ a keyboard with just alphanumeric keys but few (no) others\n  - NUMERIC: a numeric\
    \ (12-key) keyboard\n  - PREDICTIVE: a keyboard with all the letters, but with\
    \ more than one letter per key\n  - SPECIAL_FUNCTION: system control functions\
    \ rather than for typing\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_419_0.png)\n\
    \n## Session 16 Input devices\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_420_0.png)\n\
    \n- Key maps determine which character is generated depending on shift, alt and\
    \ ctrl states\n- There is a map per Android key code of the form\n\n```\nkey <key\
    \ name> {\n  label: <character printed on the key>\n  base: <base character>\n\
    \  shift: <character when shift pressed>\n}\n...\n```\n\nThe format is quite complex,\
    \ this is only an overview of the mappings possible. For full details look at\
    \ http://source.android.com/tech/input/key-character-map-files.html\n\n## LF315\
    \ Inside Android: an Introduction to Android Internals\n\n## Example\n\n```\n\
    key A {\n  label: 'A'\n  base: 'a'\n  shift, capslock: 'A'\n}\n\nkey C {\n  label:\
    \ 'C'\n  base: 'c'\n  shift, capslock: 'C'\n  alt: '\\u00e7'\n  shift+alt: '\\\
    u00c7'\n}\n```\n\nNote: 'u000e7' is Unicode character e7, which is small c cedilla;\
    \ c7 is large C cedilla\n\n## Naming of .kcm files\n\n- Key character map files\
    \ are searched for (in order)\n  - /system/usr/keychars and /data/system/devices/keychars\n\
    - Files may be named based on the Linux input device name\n  - e.g. tuna-gpio-keypad.kcm\n\
    - External devices connected by USB or Bluetooth may instead use the vendor and\
    \ product id (and optionally version):\n  - Vendor_XXXX_Product_XXXX.kcm or\n\
    \  - Vendor_XXXX_Product_XXXX_Version_XXXX.kcm\n  - e.g. Vendor_045e_Product_028e.kcm\n\
    - In all cases fall back to Generic .kcm if no specific .kcm file found\n\n##\
    \ Input device configuration files\n\n- Input device configuration files (.idc\
    \ files) contain device-specific configuration properties that affect the behavior\
    \ of input devices\n- Usually required for touch screens\n- Some properties you\
    \ can set are\n  - touch.deviceType = touchScreen | touchPad | pointer | default\n\
    \  - touch.orientationAware = 0 | 1\n  - touch.size.calibration = none | geometric\
    \ | diameter | area | default\n\nSee\nhttp://source.android.com/tech/input/input-device-configuration-files.html\
    \ for background information and\nhttp://source.android.com/tech/input/touch-devices.html\
    \ for detail on touch screens\n\n## Session 16 Input devices\n\n(Wait, I noticed\
    \ the OCR text had some...)\n```\ntouch.deviceType = touchscreen\ntouch.orientationAware\
    \ = 1\ntouch.size.calibration = diameter\ntouch.size.scale = 10\ntouch.size.bias\
    \ = 0\ntouch.size.isSummed = 0\ntouch.pressure.calibration = amplitude\ntouch.pressure.scale\
    \ = 1\n```\nCopyright © 2013 The Foundation. All rights reserved.\n\n## LF315\
    \ Inside Android: an Introduction to Android Internals # Naming of .idc files\n\
    \n- Input device configuration files are searched for (in order)\n  - /system/usr/keylayout\
    \ and /data/system/devices/keylayout\n- Files may be named based on the Linux\
    \ input device name\n  - e.g. tuna-gpio-keypad.idc\n- External devices connected\
    \ by USB or Bluetooth may instead use the vendor and product id (and optionally\
    \ version):\n  - Vendor_XXXX allProduct_XXXX.idc or\n  - Vendor_XXXX_Product_XXXX_Version_XXXX.idc\n\
    \  - e.g. Vendor_045e_Product_028e.idc\n- In all cases fall back to Generic .idc\
    \ if no specific .idc file found\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_425_0.png)\n\
    \n## Lab 16\n\n**Exercise 16.1** Run getevent -l and identify the input devices\n\
    \n**Exercise 16.2** Look at key layout files\n\n## LF315 Inside Android: an Introduction\
    \ to Android Internals # Outline Session 17 Sound and vision\n\n- The lowest layer\
    \ are the Linux drivers, see later\n- libaudio is an Android module\n- audioflinger\
    \ is the sound mixer\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_427_0.png)\n\n\
    ## Overview framework MediaPlayer audioflinger kernel ALSA driver\n\n## LF315\
    \ Inside Android: an Introduction to Android Internals\n\n- Since 4.1 Jelly Bean\
    \ the lowest Android audio layer has been implemented using the libhardware interface\n\
    - The definition is in\n  - hardware/libhardware/include/hardware/audio.h\n- There\
    \ is a dummy default implementation in\n  - hardware/libhardware/modules/audio\n\
    - For an example of a real platform implementation, look in devices, e.g.\n  -\
    \ device/samsung/tuna/audio\n"
  mdcn: "\n## 多点事件\n\n- 多点事件通过以下报告：\n  - EV_ABS, ABS_MT_TRACKING_ID, value = 此触点的唯一\
    \ ID\n- 随后是一个或多个\n  - EV_ABS, ABS_MT_PRESSURE, value\n  - EV_ABS, ABS_MT_POSITION_X,\
    \ value\n  - EV_ABS, ABS_MT_POSITION_Y, value\n  - EV_SYN, SYN_REPORT\n- 由以下终止：\n\
    \  - EV_ABS, ABS_MT_TRACKING_ID, value = 0xffffff\n  - EV_SYN, SYN_REPORT\n\n\
    ## 键布局文件\n\n- Linux 扫描码通过键布局文件 (.kl) 翻译为 Android 键码\n- 格式为：\n  - key <scancode>\
    \ <keycode> [flags]\n  - scancode 是 Linux 键码\n  - keycode 是 Android 键名\n  - flags\
    \ 是可选的策略标志，用空格分隔\n  - 示例（来自 Galaxy Nexus, tuna-gpio-keypad.kl）\n\n```\nkey 114\
    \ VOLUME_DOWN WAKE\nkey 115 VOLUME_UP WAKE\nkey 116 POWER WAKE\n```\n\nLinux 键码定义在\
    \ `include/linux/input.h` 中\n\nAndroid 键名定义在 `android.view.KeyEvent` 中。注意键布局文件中的名称已去除了\
    \ `KEYCODE_` 前缀。\n\n## 策略标志\n\n- WAKE 和 WAKE_DROPPED: 唤醒设备\n- SHIFT: 解释为 shift\n\
    - CAPS_LOCK: 解释为大写锁定\n- ALT: 解释为 alt\n- ALT_GR: 解释为 alt gray\n- FUNCTION: 解释为功能键\n\
    - VIRTUAL: 这是一个相邻主触摸的虚拟软键\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_416_0.png)\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_416_1.png)\n\n## 文件命名\n\n- 系统按顺序搜索键布局文件：\n\
    \  - /system/usr/keylayout 和 /data/system/devices/keylayout\n- 文件可能基于 Linux 输入设备名称命名\n\
    \  - 例如 tuna-gpio-keypad.kl\n- 通过 USB 或蓝牙连接的外部设备可能会改用厂商 ID 和产品 ID（以及可选版本号）：\n\
    \  - Vendor_XXXX_Product_XXXX.kl 或\n  - Vendor_XXXX_Product_XXXX_Version_XXXX.kl\n\
    \  - 例如 Vendor_045e_Product_028e.kl\n- 在所有情况下，如果未找到特定的 .kl 文件，则回退到 Generic.kl\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_417_0.png)\n\n## 验证键映射\n\n- 构建工具\n\n\
    ```\n$ mmm frameworks/base/tools/validatekeymaps\n```\n\n- 使用它检查修改后的文件\n\n```\n\
    $ validatekeymaps tuna-gpio-keypad.kl\n```\n\n正在验证文件 'tuna-gpio-keypad.kl'...\n\
    E/KeyLayoutMap(87688): tuna-gio-keypad.kl:24: Expected Error -22 parsing key layout\
    \ file.\n\n失败！\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_418_0.png)\n\n## 键字符映射文件\n\
    \n- 键字符映射文件 (kcm 文件) 将 Android 键码与修饰符的组合映射到 Unicode 字符\n- 每个内部键盘应该有一个\n- 以 `type\
    \ <type declaration>` 开始\n- 其中 `<type declaration>` 是以下之一：\n  - FULL: 完整的 PC 风格键盘\n\
    \  - ALPHA: 仅包含字母数字键但很少（没有）其他键的键盘\n  - NUMERIC: 数字（12 键）键盘\n  - PREDICTIVE: 包含所有字母的键盘，但每个键有多个字母\n\
    \  - SPECIAL_FUNCTION: 系统控制功能而非用于打字\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_419_0.png)\n\
    \n## 第 16 节 输入设备\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_420_0.png)\n\n- 键映射根据\
    \ shift、alt 和 ctrl 状态决定生成的字符\n- 每个 Android 键码都有一个格式如下的映射：\n\n```\nkey <key name>\
    \ {\n  label: <键上打印的字符>\n  base: <基础字符>\n  shift: <按下 shift 时的字符>\n}\n...\n```\n\
    \n该格式非常复杂，这只是可能映射的概览。完整详情请参阅 http://source.android.com/tech/input/key-character-map-files.html\n\
    \n## LF315 Android 内部：Android 内部原理简介\n\n## 示例\n\n```\nkey A {\n  label: 'A'\n\
    \  base: 'a'\n  shift, capslock: 'A'\n}\n\nkey C {\n  label: 'C'\n  base: 'c'\n\
    \  shift, capslock: 'C'\n  alt: '\\u00e7'\n  shift+alt: '\\u00c7'\n}\n```\n\n\
    注意：'u000e7' 是 Unicode 字符 e7，即小 c 变音；c7 是大 C 变音\n\n## .kcm 文件命名\n\n- 系统按顺序搜索键字符映射文件：\n\
    \  - /system/usr/keychars 和 /data/system/devices/keychars\n- 文件可能基于 Linux 输入设备名称命名\n\
    \  - 例如 tuna-gpio-keypad.kcm\n- 通过 USB 或蓝牙连接的外部设备可能会改用厂商 ID 和产品 ID（以及可选版本）：\n\
    \  - Vendor_XXXX_Product_XXXX.kcm 或\n  - Vendor_XXXX_Product_XXXX_Version_XXXX.kcm\n\
    \  - 例如 Vendor_045e_Product_028e.kcm\n- 在所有情况下，如果未找到特定的 .kcm 文件，则回退到 Generic .kcm\n\
    \n## 输入设备配置文件\n\n- 输入设备配置文件 (.idc 文件) 包含影响输入设备行为的设备特定配置属性\n- 触摸屏通常需要\n- 你可以设置的一些属性是：\n\
    \  - touch.deviceType = touchScreen | touchPad | pointer | default\n  - touch.orientationAware\
    \ = 0 | 1\n  - touch.size.calibration = none | geometric | diameter | area | default\n\
    \n背景信息参阅\nhttp://source.android.com/tech/input/input-device-configuration-files.html\n\
    触摸屏详情参阅\nhttp://source.android.com/tech/input/touch-devices.html\n\n## 第 16 节\
    \ 输入设备\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_424_0.png)\n\n```\ntouch.deviceType\
    \ = touchscreen\ntouch.orientationAware = 1\ntouch.size.calibration = diameter\n\
    touch.size.scale = 10\ntouch.size.bias = 0\ntouch.size.isSummed = 0\ntouch.pressure.calibration\
    \ = amplitude\ntouch.pressure.scale = 1\ntouch.orientationAware = none\n```\n\
    等待，文本说：\n```\ntouch.orientationAware = none\n```\nCopyright © 2013 The Foundation.\n\
    \n## LF315 Android 内部：Android 内部原理简介 # .idc 文件命名\n\n- 按顺序搜索输入设备配置文件：\n  - /system/usr/idc\
    \ 和 /data/system/devices/idc\n- 文件可能基于 Linux 输入设备名称命名\n  - 例如 tuna-gpio-keypad.idc\n\
