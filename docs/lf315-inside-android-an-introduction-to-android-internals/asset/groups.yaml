    \ the log\n\nSee what happens if you change the orientation of the display (if\
    \ using the emulator, press Ctrl-F12)\n\nNote that the process remains running\
    \ until you kill it from the UI like so:\nSettings->Applications->Manage Applications,\
    \ then click on your test application and select Force Stop\n\n114 LF315 Inside\
    \ an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_123_0.png)\n\
    \n## Session 5: Native code\n\n- JNI\n- NDK\n- Writing a native method\n\n## Session\
    \ 5 Native code\n\n## Uses of native code\n\n- \"Native code\" means code written\
    \ in C and C++\n- Components of Android written in native code include:\n    -\
    \ Daemons, e.g. rild, netd and init\n    - Tools, e.g. shell, netcfg\n    - Lower\
    \ parts of the Android framework\n    - \"Native methods\" of applications written\
    \ in Java\n    - \"Native activities\": activities written entirely in C and C++\n\
    \    - Plus the kernel, of course\n- This section is concerned with writing \"\
    native methods”\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_124_0.png)\n\n## LF315\
    \ Inside Android: an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_125_0.png)\n\
    \n- \"Java Native Interface\"\n- A standard for interfacing Java and C/C++ code\n\
    - Defined in the \"Java Native Interface: Programmer's Guide and Specification\"\
    \n  - http://docs.oracle.com/javase/1.5.0/docs/guide/jni/spec/jniTOC.html\n\n\
    ## Session 5 Native code\n\nThe Java side of JNI\n```java\npackage com.example.hellojni;\n\
    \nimport android.app.Activity;\nimport android.widget.TextView;\nimport android.os.Bundle;\n\
    \npublic class HelloJni extends Activity {\n    public native String stringFromJNI();\n\
    \n    static {\n        System.loadLibrary(\"hello-jni\");\n    }\n\n    @Override\n\
    \    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
    \        TextView tv = new TextView(this);\n        tv.setText(stringFromJNI());\n\
    \        setContentView(tv);\n    }\n}\n```\n```![](img/c6f4acfaca4829cadfb14f4d738cba2c_126_0.png)\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_126_1.png)\n\n## The C side of JNI\
    \ (1)\n\nHeader file with JNI definitions\n\nThe name of the function has to be\
    \ of the form Java_<package>_<class>_<method>\n\n```\n#include <string.h>\n#include\
    \ <jni.h>\n\njstring\nJava_com_example_hellojni_HelloJni_stringFromJNI(JNIEnv*\
    \ env, jobject thiz)\n{\n    return (*env)->NewStringUTF(env, \"Hello from JNI\
    \ !\");\n}\n```\n\n## The C side of JNI (2)\n\n```\n#include <string.h>\n#include\
    \ <jni.h>\n\njstring\nJava_com_example_hellojni_HelloJni_stringFromJNI(JNIEnv*\
    \ env,\nobject thiz)\n{\n    return (env)->NewStringUTF(env, \"Hello from JNI!\"\
    );\n}\n```\n\nAll native methods have these two parameters, plus any others declared\
    \ in the \"native\" Java statement\n\nJNIEnv* env points to a function table containing\
    \ functions to access data structures in the VM\n\nobject thiz a reference to\
    \ the object\n\n## The C side of JNI (3)\n\n```\n#include <string.h>\n#include\
    \ <jni.h>\n\njstring\nJava_com_example_helloojnini_stringFromJNI(JNIEnv* env,\
    \ jobject thiz)\n{\n    return (env)->NewStringUTF(env, \"Hello from JNI !\");\n\
    }\n```\n\nThe function NewStringUTF is a JNI function that allocates memory for\
    \ a UTF-8 string and initialises it with a C string.\n\nNote that the return type\
    \ is jstring\n\n## Session 5 Native code\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_130_0.png)\n\
    \n```\n#include <string.h>\n#include <jni.h>\n\nextern \"C\"\njstring\nJava_com_example_hellojni_HelloJni_stringFromJNI(JNIEnv*\
    \ env, jobject thiz) {\n    return env->NewStringUTF(\"Hello from JNI!\");\n}\n\
    ```\n\nIn C++ you dereference env with \"env->\" rather than \"(*env)\" and you\
    \ don't pass env as the first parameter to JNI functions\n\n## JNI\n\nThese simple\
    \ types can be converted to Java:\n\n| Native Type | JNI Type |\n|---|---|\n|\
    \ unsigned char | jboolean |\n| signed char | jbyte |\n| unsigned short | jchar\
    \ |\n| short | jshort |\n| long | jint |\n| unsigned long | jlong |\n| float |\
    \ jfloat |\n| double | jdouble |\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_131_0.png)\n\
    \n## Session 5 Native code\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_132_0.png)\n\
    \n## LF315 Inside Android: an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_133.png)\n\
    \n- armeabi: ARM v5 compatible with ARM926, soft floating point\n- armeabi-va:\
    \ ARM v7 compatible with ARMv7, hard floating point\n- x86: i686 compatible with\
    \ Pentium Pro, MMX, SSE, SSE2\n- mips: MIPS32r1 compatible, hard floating point\n\
    \nThe stable API for native code is documented in STABLE-APIS.html in the NDK\
    \ directory. Select the API level by APP_PLATFORM in Android.mk.\n\nThe table\
    \ below summarizes the libraries you may use:\n\n| Library | API level | LD_LIBS\
    \ | Description |\n|---|---|---|---|\n| libc, libm, librt | 3 | | C, maths and\
    \ real time extensions |\n| libthread | 3 | | POSIX threads |\n| libstdc++ | 3\
    \ | | C++ support library |\n| liblog | 3 | -llog | Android logger |\n| libz |\
    \ 3 | -lz | Zlib compression |\n| libdl | 3 | -idl | Dynamic linker library |\n\
    | libGLESv1 | 4 | -IGLESv1_CM | OpenGL ES 1.x |\n| libGLESv2 | 5 | -IGLESv2 |\
    \ OpenGL ES 2.0 |\n| libandroid | 8 | | Read/write Java pixel buffers |\n| libEGL\
    \ | 9 | -iEGL | Access OpenGL ES surfaces |\n| libOpenSLES | 9 | -iOpenSLES |\
    \ OpenSL ES native audio |\n| libandroid | 9 | -landroid | Native activities |\n\
    | libOpenMAXAL | 14 | -iOpenMAXAL | OpenMAX AL native multimedia |\n\n"
  mdcn: "\n[content]\n\n## 第 4 节 应用程序的结构\n\n## 练习 4.2 创建测试应用程序\n\n目标：创建一个简单的应用程序并观察其行为\n\
    \n通常情况下，你会使用 Eclipse 和 ADT（Android 开发工具包）完成此任务，但你也可以像这里一样使用命令行工具。\n\n启动一个新的 shell\
    \ 并运行上一个练习的脚本\n\n列出所有可用的目标（恰好有一个）：\n\n```\n$ android list targets\n```\n\n在目录\
    \ `helloworld` 目录下创建一个名为 `HelloWorld` 的骨架项目，包名为 `com.example.helloworld`，主 Activity\
    \ 为 `HelloWorldActivity`：\n\n```\n$ mkdir ~/src\n$ cd ~/src\n$ android create\
    \ project --target 1 --name HelloWorld\n--path ./helloworld\n--activity HelloWorldActivity\
    \ --package com.example.helloworld\n```\n\n然后使用以下命令进行构建：\n\n```\n$ cd helloworld\n\
    $ ant debug\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_120_0.png)\n\n##\
    \ LF315 深入 Android：Android 内部原理简介\n\n创建一个名为 `jbttest` 的 Android 虚拟设备进行测试：\n\n\
    ```\n$ android create avd --name jbttest --target 1\n```\n\n使用新的 avd 启动模拟器\n\n\
    ```\n$ emulator -avd jbttest &\n```\n\n启动后，安装该应用程序：\n\n```\n$ adb install bin/HelloWorld-debug.apk\n\
    ```\n\n现在，你可以点击模拟器上的应用程序图标，找到你的 HelloWorld 应用程序并运行它。\n\n## 练习 4.3 位于何处？\n\n打开\
    \ adb shell 并在这些目录中查找应用程序的组件：\n- /data/app - 包文件\n- /data/data - 数据文件\n- /data/dalvik-cache\
    \ - 缓存的 dex 文件\n\n## 练习 4.4 用户 ID\n\n打开 adb shell 并输入 \"ps\" 以获取进程列表。找到你的应用程序\
    \ (com.example.helloworld) 并注意用户名是 `uu0_axx`。它总是相同的吗？例如，当你重启模拟器或设备时？如果你删除（`adb\
    \ uninstall com.example.helloworld`）并重新安装它，用户 ID 还是相同的吗？\n\n## 练习 4.5 生命周期\n\n\
    在你的 hello world 应用程序中添加生命周期回调：\n\n- onStart, onResume, onPause, onStop, onDestroy\n\
    \n在每个情况下，使用 `Log.d` 编写一条日志消息\n\n运行应用程序并监控日志\n\n查看更改显示器方向会发生什么（如果使用模拟器，按 Ctrl-F12）\n\
    \n注意，进程会一直运行，直到你从 UI 杀死它，如下所示：\n设置 -> 应用程序 -> 管理应用程序，然后点击你的测试应用程序并选择强制停止（Force\
    \ Stop）\n\n114 LF315 深入 Android：Android 内部原理简介\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_123_0.png)\n\
    \n## 第 5 节 原生代码\n\n- JNI\n- NDK\n- 编写原生方法\n\n## 第 5 节 原生代码\n\n## 原生代码的\n\n- “原生代码”意味着用\
    \ C 和 C++ 编写\n- 用原生代码编写的 Android 组件包括：\n    - 守护进程，例如 rild、netd 和 init\n    -\
    \ 工具，例如 shell、netcfg\n    - Android 框架的底层部分\n    - 用 Java 编写的应用程序“原生方法”\n    -\
    \ “原生活动”：完全用 C 和 C++ 编写的活动\n    - 加上内核\n- 本节涉及编写“原生方法”\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_124_0.png)\n\
    \n## LF315 深入 Android：Android 内部原理简介\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_125_0.png)\n\
    \n- “Java Native Interface”（Java 原生接口）\n- 用于 Java 和 C/C++ 代码交互的标准\n- 定义在《Java\
    \ Native Interface: Programmer's Guide and Specification》中\n  - http://docs.oracle.com/javase/1.5.0/docs/guide/jni/spec/jniTOC.html\n\
    \n## 第 5 节 原生代码\n\nJNI 的 Java 端\n```java\npackage com.example.hellojni;\n\nimport\
    \ android.app.Activity;\nimport android.widget.TextView;\nimport android.os.Bundle;\n\
    \npublic class HelloJni extends Activity {\n    public native String stringFromJNI();\n\
    \n    static {\n        System.loadLibrary(\"hello-jni\");\n    }\n\n    @Override\n\
    \    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
    \        TextView tv = new TextView(this);\n        tv.setText(stringFromJNI());\n\
    \        setContentView(tv);\n    }\n}\n```\n```![](img/c6f4acfaca4829cadfb14f4d738cba2c_126_0.png)\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_126_1.png)\n\n## JNI 的 C 端 (1)\n\n\
    带有 JNI 定义的头文件\n\n函数名必须采用 `Java_<package>_<class>_<method>` 的形式\n\n```\n#include\
    \ <string.h>\n#include <jni.h>\n\njstring\nJava_com_example_hellojni_HelloJni_stringFromJNI(JNIEnv\
    \ *env, jobject thiz) {\n    return (*env)->NewStringUTF(env, \"Hello from native\"\
    );\n}\n```\n\n## JNI 的 C 端 (2)\n\n```\n#include <string.h>\n#include <jni.h>\n\
    \njstring\nJava_com_example_hellojni_HelloJni_stringFromJNI(JNIEnv *env, jobject\
    \ thiz) {\n    return (*env)->NewStringUTF(env, \"Hello from native\");\n}\n```\n\
    \n## JNI 的 C 端 (3)\n\n```\n#include <string.h>\n#include <jni.h>\n\njstring\n\
    Java_com_example_hellojni_HelloJni_stringFromJNI(JNIEnv *env, jobject thiz) {\n\
    \    return (*env)->NewStringUTF(env, \"Hello from native\");\n}\n```\n\n原生代码\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_130_0.png)\n\n```\n#include <string.h>\n\
    #include <jni.h>\n\nextern \"C\"\njstring\nJava_com_example_hellojni_HelloJni_stringFromJNI(JNIEnv\
    \ *env, jobject thiz) {\n    return (*env)->NewStringUTF(env, \"Hello from native\"\
    );\n}\n```\n\n这些简单类型可以转换为 Java：\n\n| 原生类型 | JNI 类型 |\n|---|---|\n| unsigned char\
    \ | jboolean |\n| signed char | jbyte |\n| unsigned short | jchar |\n| short |\
    \ jshort |\n| long | jint |\n| unsigned long | jlong |\n| float | jfloat |\n|\
    \ double | jdouble |\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_131_0.png)\n\n\
    ## 第 5 节 原生代码\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_132_0.png)\n\n## LF315\
    \ 深入 Android：Android 内部原理简介\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_133.png)\n\
    \n- armeabi：兼容 ARM926，软浮点\n- armeabi-va：兼容 ARMv7，硬浮点\n- x86：兼容 i686，MMX, SSE,\
    \ SSE2\n- mips：兼容 MIPS32r1，硬浮点\n\n原生代码的稳定 API 文档位于 NDK 目录下的 STABLE-APIS.html。通过\
    \ Android.mk 中的 APP_PLATFORM 选择 API 级别。\n\n下表总结了你可以使用的库：\n\n| 库 | API 级别 | | 说明\
    \ |\n|---|---|---|---|\n| libc, libm, librt | 3 | | C、数学和实时扩展 |\n| libthread |\
    \ 3 | | POSIX 线程 |\n| libstdc++ | 3 | | C++ 支持库 |\n| liblog | 3 | -llog | Android\
    \ 日志 |\n| libz | 3 | -lz | Zlib 压缩 |\n| libdl | 3 | -idl | 动态链接器库 |\n| libGLESv1\
    \ | 4 | -IGLESv1_CM | OpenGL ES 1.x |\n| libGLESv2 | 5 | -IGLESv2 | OpenGL ES\
    \ 2.0 |\n| libandroid | 8 | | 读取/写入 Java 像素缓冲区 |\n| libEGL | 9 | -iEGL | 访问 OpenGL\
    \ ES 表面 |\n| libOpenSLES | 9 | -iOpenSLES | OpenSL ES 原生音频 |\n| libandroid | 9\
    \ | -landroid | 原生活动 |\n| libOpenMAXAL | 14 | -iOpenMAXAL | OpenMAX AL 原生多媒体 |\n\
    \n[/content]\n"
