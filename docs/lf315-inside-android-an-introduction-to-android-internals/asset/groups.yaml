    # LF315 Inside Android: an Introduction to Android Internals


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_413_0.png)


    Sync events Because some event types, e.g. EV_ABS, require 2 or 3 event packets
    to give full information about X, Y and Z there needs to be a method to indicate
    all input has been reported: EV_SYN


    +   - type = EV_SYN

    - code = SYN_REPORT

    - value = 0


    +   - All event reports, including single value events such as keyboards, must
    send an EV_SYN to indicate the end of this report'
