- md: "\n## SimpleManager Application (1)\n\nAn application can call SimpleManager\
    \ like this\n\n```java\n// Import the class\nimport com.example.simplemanager.SimpleManager;\n\
    \n// Create an instance\nSimpleManager mSimpleManager = new SimpleManager();\n\
    \n// Call the function\nret = mSimpleManager.addInts(1, 2);\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_356_0.png)\n\
    \n## LF315 Inside Android: an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_357_0.png)\n\
    \n- Need to declare the library in AndroidManifest with uses-library\n\n```xml\n\
    <application ...\n  <uses-library android:name=\"com.example.simplemanager\" android:required=\"\
    true\"/>\n```\n\n## Review\n\n- The service is in a separate process with UID\
    \ *system*\n- It is accessed by a Java library\n- Applications using the service\
    \ have normal application UIDs\n- So, we have allowed an application to call functions\
    \ which can access resources not normally available\n  - But in a controlled and,\
    \ if well designed and implemented, secure way\n- Good examples of such services\
    \ include SerialManager for serial ports\n  - frameworks/base/core/java/android/hardware\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_358_0.png)\n\n## LF315 Inside Android:\
    \ an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_359_0.png)\n\
    \n## Session 13 Binder 351\n\n## Lab 13\n\n### Exercise 13.1 Looking at services\n\
    \nGet a list of services using\n`service list`\n\nYou can call also use the service\
    \ command to call a service. For example\n`service call phone 1 s16 \"123\"`\n\
    \nwill ask the phone app to display the dialer activity with number 123. The parameters\
    \ to service call are\n\n- name of the service\n- index number of the function\
    \ to call (read the code to find out)\n- one or more integer or string parameters.\
    \ Integers are 32-bits long and are preceded by i32, strings are encoded as 16-bit\
    \ UTF and are preceded by s16\n\nThe relevant file for the phone app is `@frameworks/base/telephony/java/com/android/internal/telephony/ITelephony.aidl@`\n\
    \n### Exercise 13.2 Simple server\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_360_0.png)\n\
    \n## LF315 Inside Android: an Introduction to Android Internals\n\nThere is a\
    \ sample server implementation in\n$HOME/embedded-android/resources/lab13/simple-service\
    \ and corresponding\nmanager in\n$HOME/embedded-android/resources/lab13/simple-manager.\
    \ Copy both directories to /dev/ti/beagle. Build them and install on the target.\n\
    \nReboot the target and run `service list` and verify that it is running.\n\n\
    Look at the interface defined\nsimple-manager/com/example/simplemanager/ISimpleManager.aidl.\
    \ Use service call to call the two functions with appropriate parameters\n\n###\
    \ **Exercise 13.3** Optional - extend the service\n\nNow make use of the service\
    \ to access hardware GPIOs - the same ones\nthat you used for the liblights lab.\n\
    \nThere is a jni library already written: it is called `jnilights`\n\n1. Add a\
    \ new function to the interface\n\nAdd this interface\n\n```c\nint setLed(int\
    \ led, int on);\n```\n\nto this file\nsimple-manager/com/example/simplemanager/ISimpleManager.aidl\n\
    \n2. Write the manager proxy\n\nAdd the setLed proxy to\nsimple-manager/com/example/simplemanager/SimpleManager.java\n\
    \nBuild and install simple-manager\n\n3. Write the service stub implementation\n\
    \nThe implementation of setLed goes into\nsimple-service/src/com/example/pleservice/ISimpleServiceImpl.java\n\
    \nIt just needs to call the native function `nativesetled(int led,int on)` and\
    \ you will need to call loadLibrary(\"jnilights\").\n\nBuild and install the simple-service\n\
    \n4. Build jnlights\n\nCopy $HOME/embedded-android/resources/lab13/jnlights and\
    \ build it\n\n5. Build the application\n\nFinally, here is an application that\
    \ will allow you to test everything...\n\nCopy $HOME/embedded-android/resources/lab13/simple-led-app\n\
    \nBuild it and install it.\n\n## Session 14 Android’s hardware abstraction layer\n\
    \n## Session 14: Android’s hardware abstraction layer\n\n- Hardware modules\n\
    - liblights\n- Accessing GPIO pins\n\n## LF315 Inside Android: an Introduction\
    \ to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_365_0.png)\n\
    \n- The kernel device driver interface is one level of hardware abstraction\n\
    - Android extends this with various shared libraries that abstract kernel interfaces\
    \ further\n- The Android framework is written to use the Android HAL\n- Reasons\n\
    \  - To smooth over irregularities in the Linux driver interface, e.g. access\
    \ to LEDs and backlights\n  - To add functions that are missing, e.g. in the framebuffer\
    \ driver\n  - To avoid the GPL license, e.g. with graphics drivers\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_365_1.png)\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_365_2.png)\n\nCopyright © 2013 Linux\
    \ Foundation. All rights reserved. DO NOT DISTRIBUTE.\n\n## Types of HAL\n\n-\
    \ There are two main type of HAL implementation\n- Hardware modules for miscellaneous\
    \ interfaces in /vendor/lib/hw and /system/lib/hw\n- OpenGL libraries in /vendor/lib/egl\
    \ and /system/lib/egl\n\nThe OpenGL libraries are discussed separately: this section\
    \ focuses on hardware modules\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_366_0.png)\n\
    \n## LF315 Inside Android: an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_367_0.png)\n\
    \n- Hardware modules control things like\n- audio\n- camera\n- framebuffer\n-\
    \ gps - location services\n- gralloc - framebuffer and GPU buffer management\n\
    - lights - control of the LCD backlight, keyboard light and miscellaneous LEDs\n\
    - sensors - a collection of sensor devices including accelerometer, pressure,\
    \ proximity and magnetometer\n\n## Session 14 Android's hardware abstraction layer\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_368_0.png)\n\n- Hardware modules are\
    \ named module_id.<modifier>.so\n- modifier can be (from most specific to least)\n\
    \  - ro.hardware\n  - ro.product.board\n  - ro.board.platform\n  - ro.arch\n \
    \ - default\n- The search path is /vendor/lib/hw /system/lib/hw\nThe Linux Foundation\
    \ 2013 All rights reserved.\n\n## LF315 Inside Android: an Introduction to Android\
    \ Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_369_0.png)\n\n- ro.product.board\n\
    - ro.board.platform\n- ro.arch\n- default\n- The search path is /vendor/lib/hw\
    \ /system/lib/hw\n\n```\ncamera.so\ngralloc.so\nlights.so\n```\n\n## Session 14\
    \ Android’s hardware abstraction layer\n\n## Generic hardware interface\n\n- Defined\
    \ in hardware/include/hardware.h\n- Each has a structure of type hw_module\n-\
    \ Has an identifying string e.g. \"camera\" or \"lights\"\n- Has a pointer to\
    \ open() function\n- The open() can be used to get device-specific data and functions\n\
    \n## Example: liblights (1)\n\n```c\nstruct hw_module_t HAL_INFO_SYM = {\n  .tag\
    \ = HARDWARE_MODULE_TAG,\n  .version_major = 1,\n  .version_minor = 0,\n  .id\
    \ = LIGHTS_HARDWARE_MODULE,\n  .name = \"Goldfish lights\",\n  .author = \"The\
    \ Android Source Project\",\n  .methods = &lights_methods,\n};\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_371_0.png)\n\
    \n## Session 14 Android's hardware abstraction layer\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_372_0.png)\n\
    \n```c\nstatic struct hw_module_methods_t\n    lights_module_methods = {\n   \
    \ .open = open_lights,\n};\n```\n\n## LF315 Inside Android: an Introduction to\
    \ Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_373_0.png)\n\n\
    ## Session 14 Android's hardware abstraction layer\n\n## Example: liblights (4)\n\
    \n```c\nstatic struct hw_module_methods_t lights_module_methods = {\n    .open\
    \ = open_lights,\n};\n```\n\n- and the device id is one of\n\n- \"backlight\"\n\
    - \"keyboard\"\n- \"buttons\"\n- \"battery\"\n- \"notifications\"\n- \"attention\"\
    \n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_374_0.png)\n\n## LF315 Inside Android:\
    \ an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_375_0.png)\n\
    \n- The actual type returned by open is specific to the device\n- Always starts\
    \ with struct hw_device_t common;\n- In the case of liblights:\n\n```c\nstruct\
    \ light_device_t {\n  struct hw_device_t common;\n  int (*set_light)(struct light_device_t*\
    \ dev,\n  struct light_state_t const* state);\n};\n```\n"
  mdcn: "\n\n## SimpleManager 应用 (1)\n\n应用程序可以如下所示调用 SimpleManager\n\n```java\n//\
    \ 导入类\nimport com.example.simplemanager.SimpleManager;\n\n// 创建实例\nSimpleManager\
    \ mSimpleManager = new SimpleManager();\n\n// 调用函数\nret = mSimpleManager.addInts(1,\
    \ 2);\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_356_0.png)\n\n## LF315\
    \ 深入 Android：Android 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_357_0.png)\n\
    \n- 需要在使用 AndroidManifest 中声明 uses-library 库\n\n```xml\n<application ...\n  <uses-library\
    \ android:name=\"com.example.simplemanager\" android:required=\"true\"/>\n```\n\
    \n## 复习\n\n- 服务运行在 UID 为 *system* 的独立进程中\n- 通过 Java 库访问\n- 使用该服务的应用程序具有正常的应用程序\
    \ UID\n- 因此，我们允许应用程序调用可以访问通常无法访问资源的函数\n  - 但这是受控的，并且如果设计和实现良好，它们是安全的\n- 此类服务的良好示例包括用于串口的\
    \ SerialManager\n  - frameworks/base/core/java/android/hardware\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_358_0.png)\n\
    \n## LF315 深入 Android：Android 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_359_0.png)\n\
    \n## 第 13  Binder 351\n\n## 实验 13\n\n### 练习 13.1 查看服务\n\n使用 `service list` 获取服务列表\n\
    \n你也可以使用 service 命令来调用服务。例如\n`service call phone 1 s16 \"123\"`\n\n这将要求手机应用显示数字\
    \ 123 的拨号界面。service call 的参数为：\n\n- 服务名称\n- 要调用的函数索引号（阅读代码以查找）\n- 一个或多个整数或字符串参数。整数长度为\
    \ 32 位，前面带有 i32；字符串编码为 16 位 UTF，前面带有 s16\n\n手机应用相关的字体是 `@frameworks/base/telephony/java/com/android/internal/telephony/ITelephony.aidl@`\n\
    \n### 练习 13.2 简单服务器\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_360_0.png)\n\n\
    ## LF315 深入 Android：Android 内部原理\n\n在 $HOME/embedded-android/resources/lab13/simple-service\
    \ 中有一个示例服务器实现，在 $HOME/embedded-android/resources/lab13/simple-manager 中有相应的管理器（manager）。将两个目录复制到\
    \ /dev/ti/beagle。编译它们并安装到目标机上。\n\n重启目标机并运行 `service list` 验证它是否正在运行。\n\n查看定义的接口\n\
    simple-manager/com/example/simplemanager/ISimpleManager.aidl。使用 service call 用适当参数调用这两个函数。\n\
    \n### **练习 13.3** 可选 - 扩展服务\n\n现在利用该服务访问硬件 GPIO - 即你在 liblights 实验中使用的那些 GPIO。\n\
    \n已经写了一个 jni 库：它被称为 `jnilights`\n\n1. 向接口中添加新函数\n\n将此接口\n\n```c\nint setLed(int\
    \ led, int on);\n```\n\n添加到此文件：\nsimple-manager/com/example/simplemanager/ISimpleManager.aidl\n\
    \n2. 编写管理器代理（proxy）\n\n在 simple-manager/com/example/simplemanager/SimpleManager.java\
    \ 中添加 setLed 代理\n\n编译并安装 simple-manager\n\n3. 编写服务存根（stub）实现\n\nsetLed 的实现放入 simple-service/src/com/example/pleservice/ISimpleServiceImpl.java\n\
    \n只需要调用原生函数 `nativesetled(int led,int on)`，你需要调用 loadLibrary(\"jnilights\")。\n\
    \n编译并安装 simple-service\n\n4. 编译 jnlights\n\n复制 $HOME/embedded-android/resources/lab13/jnlights\
    \ 并编译它\n\n5. 编译应用程序\n\n最后，这里有一个允许你测试一切的应用程序……\n\n复制 $HOME/embedded-android/resources/lab13/simple-led-app\n\
    \n编译并安装它。\n\n## 第 14  Android 的硬件抽象层\n\n## 第 14 ：Android 的硬件抽象层\n\n- 硬件模块\n- liblights\n\
    - 访问 GPIO 引脚\n\n## LF315 深入 Android：Android 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_365_0.png)\n\
    \n- 内核设备驱动接口是硬件抽象的一层\n- Android 通过各种共享库扩展了这一点，这些库进一步抽象了内核接口\n- Android 框架（framework）的编写是为了使用\
    \ Android HAL\n- 原因\n  - 为了消除 Linux 驱动接口中的不规则之处（例如对 LED 和背光的访问）\n  - 为了添加缺失的功能（例如在\
    \ framebuffer 驱动中）\n  - 为了避免 GPL 许可证（例如对于图形驱动程序）\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_365_1.png)\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_365_2.png)\n\nCopyright © 2013 Linux\
    \ Foundation. 版权所有。请勿发行。\n\n## HAL 的类型\n\n- 有两种主要的 HAL 实现\n- 位于 /vendor/lib/hw\
    \ 和 /system/lib/hw 的杂接口硬件模块\n- 位于 /vendor/lib/egl 和 /system/lib/egl 的 OpenGL 库\n\
    \nOpenGL 库将单独讨论：本节重点关注硬件模块\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_366_0.png)\n\
    \n## LF315 深入 Android：Android 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_367_0.png)\n\
    \n- 硬件模块控制如下内容：\n- 音频\n- 摄像头\n- 帧（framebuffer）\n- gps - 位置服务\n- gralloc - 帧和 GPU\
    \ 缓冲区管理\n- 灯光 - LCD 背光、键盘灯和各种 LED 的控制\n- 传感器 - 传感器设备集合，包括加速度计、压力计、接近传感器和磁力计\n\n\
    ## 第 14 Android 的硬件抽象层\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_368_0.png)\n\
    \n- 硬件模块命名为 module_id.<modifier>.so\n- modifier 可以是（从具体到不具体）\n  - ro.hardware\n\
    \  - ro.product.board\n  - ro.board.platform\n  - ro.arch\n  - default\n- 搜索路径为\
    \ /vendor/lib/hw /system/lib/hw\nLinux Foundation 2013 版权所有。\n\n## LF315 深入 Android：Android\
    \ 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_369_0.png)\n\n- ro.product.board\n\
    - ro.board.platform\n- ro.arch\n- default\n- 搜索路径为 /vendor/lib/hw /system/lib/hw\n\
    \n```\ncamera.so\ngralloc.so\nlights.so\n```\n\n## 第 14 Android 的抽象层\n\n## 通用硬件接口\n\
    \n- 定义在 hardware/include/hardware.h\n- 每个都有一个 hw_module 结构\n- 有一个标识字符串，如 \"camera\"\
    \ 或 \"lights\"\n- 有 open() 函数指针\n- open() 可获取特定设备的数据和函数\n\n## 示例：liblights (1)\n\
    \n```c\nstruct hw_module_t HAL_INFO = {\n  tag = HARDWARE_MODULE_TAG,\n  version_major\
    \ = 1,\n  version_minor = 0,\n  id = LIGHTS_HARDWARE_MODULE,\n  name = \"Goldfish\
    \ lights\",\n  author = \"The Android Source Project\",\n  methods = &lights_methods,\n\
    };\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_371_0.png)\n\n## 第 14 Android\
    \ 的硬件抽象层\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_372_0.png)\n\n```c\nstatic\
    \ struct hw_module_methods_t\n    lights_methods = {\n    open = open_lights,\n\
    };\n```\n\n## LF315 深入 Android：Android 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_373_0.png)\n\
    \n## 第 14 Android 的硬件抽象层\n\n## 示例：liblights (4)\n\n```c\nstatic struct hw_module_methods_t\
    \ lights_module_methods = {\n    open = open_lights,\n};\n```\n\n- 设备设备 id 为之一：\n\
    \n- \"backlight\"\n- \"keyboard\"\n- \"buttons\"\n- \"battery\"\n- \"notifications\"\
    \n- \"attention\"\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_374_0.png)\n\n##\
    \ LF315 深入 Android：Android 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_375_0.png)\n\
    \n- open 返回的实际类型取决于设备\n- 始终以 struct hw_device_t common; 开始\n- 对于 liblights 用例：\n\
    \n```c\nstruct light_device_t {\n  struct hw_device_t common;\n  int (*set_light)(struct\
    \ light_device_t* dev,\n  struct light_state_t const* state);\n};\n```\n\n"
