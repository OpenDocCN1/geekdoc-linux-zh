  - '[PAGE 430]


    # Session 17 Sound and vision


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_430_0.png)


    +   The Advanced Linux Sound Architecture (ALSA) describes the interfaces for
    sound hardware

    * See Documentation/sound/alsa


    +   The device files are in directory /dev/snd


    +   There is per card, ''N''

    * a control interface named controlC<N>

    * a number of pcm interfaces named @pcmC<N>D<Y>[c|p]

    * Y = device number (may be several per card)

    * c = capture device

    * p = playback device


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_430_1.png)


    For example


    ```

    # ls /dev/snd

    controlC0

    controlC1

    pcmCOD0c

    pcmCOD0p

    pcmCOD10p

    ...

    ```


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_430_2.png)'
