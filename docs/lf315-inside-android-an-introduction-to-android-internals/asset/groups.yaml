  - '[PAGE 387]


    # LF315 Inside Android: an Introduction to Android Internals


    The intention is to create a libligs hardware module for the Beaglebone uses the
    User LEDs as follows


    +   - LED 1 = LIGHT_ID_BUTTONS

    - LED 2 = LIGHT_ID_BATTERY

    - LED 3 = LIGHT_ID_NOTIFICATIONS

    - LED 4 = LIGHT_ID_ATTENTION


    You will need to configure the gpio pins as outputs at boot time by adding an
    on boot trigger to init.am335xvm.rc. The command to write to a file is write,
    e.g.


    on boot

    write /sys/class/gpio/export NN


    You will also need to change the ownership of the value files to system so that
    they can be written from the Android LightsService (which runs with UID system),
    which you can do like this:


    chown system system /sys/class/gpio/gpioNN/value


    Rebuild the ramdisk and load it on the board. Reboot and check that everything
    is correctly.


    Create a new directory, device/ti/beaglebone/libligs


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_387_0.png)'
