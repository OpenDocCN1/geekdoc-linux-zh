    \ kernel directory:\n\n# Session 9: The Android kernel\n\n```bash\nexport ARCH=arm\n\
    export CROSS_COMPILE=arm-linux-gnueabi-\nmake am335x_evm_android_config\nmake\
    \ -j4 uImage\n```\n\nCheck the size of arch/arm/boot/uImage: it should be about\
    \ 4 MiB.\n\n# LF315 Inside Android: an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_227_0.png)\n\
    \n# Outline Session 10: Starting up\n\n- Booting basics\n- Fastboot\n- U-Boot\n\
    - Android init and init.rc\n- System properties\n\nCopyright © 2013 Linux Foundation.\
    \ All rights reserved. DO NOT DISTRIBUTE.\n\n# Session 10: Starting up\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_228_0.png)\n\
    \nUp to the Jelly Bean release you could find the code for the bootloader in bootable/bootloader/legacy\n\
    \nSome Android devices use the Little Kernel bootloader, see https://codeaurora.org/tags/little-kernel\n\
    \nA definition of the fastboot protocol used to be present in bootable/bootloader/legacy/fastboot_protocol.txt.\
    \ It is not clear where the definitive specification resides now.\n\nTHE LINUX\
    \ FOUNDATION Copyright © 2013 Linux Foundation. All rights reserved. DO NOT DISTRIBUTE.\n\
    \n# Booting the old way\n\n- The bootloader is in NOR flash at known vector\n\
    - Early boot sets up SDRAM and relocates to RAM\n- Main boot code runs in RAM\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_229_0.png)\n\nSince NOR flash memory\
    \ can be accessed byte by byte it can be mapped into the processor address space\
    \ and so execute code immediately power is applied.\n\n# Session 10: Starting\
    \ up\n\n### Booting from NAND flash\n\n- NOR flash is no longer used - too expensive\n\
    - NAND flash is much more complex, needs code to run\n- That code has to be stored\
    \ somewhere, usually within the SoC itself\n- Typical sequence:\n  - CPU boot\
    \ code loads small pre-boot loader from NAND (or MMC, UART, USB...) into internal\
    \ RAM (SRAM)\n  - Size of pre-boot loader limited by SRAM, typically 16 KiB ..\
    \ 128 KiB\n  - Pre-boot loader initializes SDRAM\n  - Loads main boot loader into\
    \ SDRAM and starts it running\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_230_0.png)\n\
    \nNAND flash memory can only be accessed one page at a time, a page being typically\
    \ 2048 bytes. Accessing a page of NAND flash is done under program control, resulting\
    \ in a chicken-and-egg situation during bootstrap.\n\nHence, it is necessary to\
    \ have some code in the SoC itself that is able to load one or more pages from\
    \ a NAND flash chip.\n\nMany SoCs extend this code to be able to load a program\
    \ from other sources as well, including MMC, UART and USB\n\n### Booting from\
    \ SD\n\n- On TI OMAP and Sitara chips, the CPU boot code can load an image from\
    \ the SDIO (SD card) interface\n- The file must be called MLO\n- It must be stored\
    \ in the first partition of the card\n- It must be formatted using FAT32 (vfat)\n\
    \nThe Beagleboard has a TI Sitara 335x chip which has boot code that can load\
    \ a boot image from MMC, which in our case is wired to the SD card reader. That\
    \ code is very limited, hence the need for the partition format to be FAT32 and\
    \ the name fixed as \"MLO\". The MLO binary can be compiled from the U-Boot source\
    \ code.\n\n# Fastboot\n\n- fastboot can refer to three things:\n  - A USB protocol\
    \ for loading and programming images into memory\n  - A command-line tool\n  -\
    \ A binary implementation of the protocol\n- Note: fastboot is not about the speed\
    \ of booting; it is about making the development process faster\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_232_0.png)\n\
    \n# Getting to fastboot mode\n\n```bash\nadb reboot bootloader\n```\n\n- Then\
    \ you can use the fastboot command to communicate with it\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_233_0.png)\n\
    \n# Fastboot commands\n\n- Basic commands\n- devices : list devices attached that\
    \ accept fastboot commands\n- getvar : get a variable:\n  - version, product,\
    \ serialno, secure\n- Note: secure is yes for bootloader requiring a signature\
    \ before it install\n- continue : Continue boot as normal\n- reboot : reboot device\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_234_0.png)\n\n# Fastboot commands\n\
    \n- Flash commands\n- erase <partition>\n- flash <partition> <filename>\n- flashall\n\
    \n# Session 10: Starting up\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_236_0.png)\n\
    \n# LF315 Inside Android: an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_237_0.png)\n\
    \n- U-Boot is an open source boot loader\n- Commonly used on dev boards (like\
    \ Beaglebone)\n- Supports a wide range of hardware\n- Easy to customize\n- Reference\
    \ http://www.denx.de/\n\n# Session 10: Starting up\n\n# U-Boot commands\n\n- U-Boot\
    \ can provide a user interface on a serial port\n- Commands include dump/modify\
    \ memory locations and registers\n- Load a kernel image from NOR/NAND flash, SD\
    \ card, serial, network, etc\n- Boot a kernel image\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_238_0.png)\n\
    \n# Example commands\n\n- Load an image (e.g. a kernel) from NAND flash\n  - nand\
    \ read <RAM address> <flash address> <length>\n- Example\n  - nand read 80100000\
    \ 1000000 200000\n- Load a kernel from SD card\n  - fatload mmc <device>:<partition>\
    \ <RAM address> <file>\n- Example\n  - mmc rescan 0\n  - fatload mmc 0:1 80100000\
    \ uImage\n- Boot a kernel image in RAM\n  - bootm 80100000\n"
  mdcn: "\n\n# LF315 深入 Android：Android 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_221_0.png)\n\
    \n- 大多数嵌入式设备需要一个纯压缩内核镜像：\n  - $ make zImage\n  - 或者一个压缩的内核镜像加上 U-Boot 头部文件\n \
    \ - $ make uImage (*)\n- 对于大多数 x86 系统：\n  - $ make bzImage\n- 内核镜像在 arch/$ARCH/boot\
    \ 中生成\n\n(*) 要创建一个 uimage，你需要 U-Boot mkimage 工具，该工具可以通过 Ubuntu 软件包 u-boot-tools\
