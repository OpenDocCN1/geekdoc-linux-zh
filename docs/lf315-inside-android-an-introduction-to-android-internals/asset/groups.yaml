  raw:
  - "[PAGE 180]\n\n# Session 8 Board Configuration\n\n# Creating a new device\n\n\
    +   - The Android build system performs the same job as Yocto and similar systems\n\
    - Device definitions are in the device/ directory\n- There is a two-level hierarchy\n\
    \  - organization/product\n  - The examples that follow use myorg and mydevice\n\
    - The next few slides describe these essential configuration files\n  - AndroidProducts.mk\n\
    \  - The product makefile, [PRODUCT_NAME].mk\n  - device.mk\n  - BoardConfig.mk\n\
    \  - vendorsetup.sh\n  - Android.mk"
  - '[PAGE 181]


    # 172 LF315 Inside Android: an Introduction to Android Internals


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_181_0.png)


    +   - This file simply references a makefile for each variant of the product

    - In many cases there is only one variant ...

    - ... in which case, it contains just the one line, for example:

    ```

    PRODUCT_MAKEFILES := $(LOCAL_DIR)/full_mydevice.mk

    ```'
  - '[PAGE 182]


    # Product makefile


    +   This file does two things

    * Defines which packages will be included in the build

    * Defines the product name, PRODUCT_NAME


    +   The file must be named [PRODUCT_NAME].mk


    +   To save a lot of typing, inherit packages from a predefined product

    * Look in build/target/product/ for examples


    +   Then provide local overrides


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_182_0.png)'
  - '[PAGE 183]


    # Product makefile example


    +   - For example: full_mydevice.mk


    ```

    $$(call inherit-product, $(SRC_TARGET_DIR)/

    product/full_base.mk)

    $(call inherit-product, device/myorg/mydevice/device.mk)


    PRODUCT_NAME := full_mydevice

    PRODUCT_DEVICE := mydevice

    PRODUCT_MODEL := Full Android on My Device

    ```'
  - "[PAGE 184]\n\n# device.mk\n\n+   * Provides overrides of properties inherited\
    \ in the product make file and adds new ones\n* The next few slides describe these\
    \ variables:\n    * PRODUCT_COPY_FILES\n    * PRODUCT_PACKAGES\n    * PRODUCT_PROPERTY_OVERRIDESRIDES\n\
    \    * PRODUCT_CHARACTERISTICS\n    * PRODUCT_TAGS"
  - "[PAGE 185]\n\n# device.mk: PRODUCT_COPY_FILES\n\n+   * Copy a list of files into\
    \ the build directories so they are incorporated in the final system\n* PRODUCT_COPY_FILES\
    \ += source-path:destination-file\n* To include in the root file system (ramdisk)\
    \ set destination-file to root\n* For example\n  device/myorg/mydevice/init.rc:root/init.rc"
  - "[PAGE 186]\n\n# Session 8 Board Configuration\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_186_0.png)\n\
    \n+   - A list of packages to the build\n- Package names are defined in Android.mk\
    \ for each module, like this\n  - In file extras/ext4_utils/Android.mk you will\
    \ find\n  - LOCAL_MODULE := make_ext4fs\n  - (On more packages later)\n- Example:\n\
    \n```\nPRODUCT_PACKAGES := \\\n    make_ext4fs \\\nndhcpcd.conf\n```"
  - "[PAGE 187]\n\n+   - Define system properties that will be written to /system/build.prop\n\
    \  - More on system properties when we talk about bootstrapping\n- There are very\
    \ many system properties, look at device.mk files for examples\n- Some that are\
    \ useful:\n  - hw.nobattery - set to *true* if the device does not run off battery\n\
    \  - hwui.render_dirty_regions - set to \"false\" to disable partial dirty region\
    \ invalidates\n- Example:\n  PRODUCT_PROPERTY_OVERRIDES := hw.nobattery=true \\\
    \n  hwui.render_dirty_regions=false\n\nCopyright © 2013 The Linux Foundation.\
    \ All rights reserved."
  - '[PAGE 188]


    # PRODUCT_CHARACTERISTICS


    +   A list of characteristics, including

    * tablet - overrides default, "phone"

    * noscard - no SD card for external storage

    * For example:


    ```

    PRODUCT_CHARACTERISTICS := tablet,nosdcard

    ```


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_188_0.png)'
  - '[PAGE 189]


    # device.mk: PRODUCT_TAGS


    +   - Almost universally, this line is included in device.mk:

    * PRODUCT_TAGS += dalvik.gc.type-precise

    - Which configures the Dalvik garbage collector (obviously)


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_189_0.png)'
  - '[PAGE 190]


    # Session 8 Board Configuration


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_190_0.png)'
  - "[PAGE 191]\n\n# BoardConfig.mk - CPU\n\n+   - You can configure CPU type and\
    \ features as follows...\n- TARGET_ARCH\n    - In 4.0.x and 4.1.x one of arm,\
    \ x86\n    - In 4.2.x one of arm, x86, mips\n- TARGET_CPU_ABI should be set to\
    \ the primary ABI:\n    - armeabi, armeabi-v7a, mips\n- TARGET_CPU_ABI2 should\
    \ be set to the secondary ABI:\n    - e.g., for an ARM Cortex-A CPU, primary ABI\
    \ is armeabi-v7a\n      secondary is armeabi\n- If multi core, add\n    - TARGET_CPU_SMP\
    \ := true"
  - "[PAGE 192]\n\n# BoardConfig.mk - ARM\n\n+   - There are some ARM-specific settings\n\
    - If the chip has a TLS register (i.e. Cortex A), add\n  - ARCH_ARM_HAVE_TLS_REGISTER\
    \ := true\n- If the chip has an ARM NEON coprocessor, add\n  - TARGET_ARCH_VARIANT\
    \ := armv7-a-neon\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_192_0.png)\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_192_1.png)"
  - '[PAGE 193]


    # BoardConfig.mk - File systems


    +   - Configure file system types types and sizes for ext4...


    ```

    TARGET_USERIMAGES_USE_EXT4 := true

    BOARD_FLASH_BLOCK_SIZE := 4096

    BOARD_SYSTEMIMAGE_PARTITION_SIZE := nnnnnnnn

    BOARD_USERDATAIMAGE_PARTITION_SIZE := nnnnnnnn

    BOARD_CACHEIMAGE_PARTITION_SIZE := nnnnnnnn

    ```


    +   - Where nnnnnnnn is the size in bytes'
  - '[PAGE 194]


    # Session 8 Board Configuration


    # BoardConfig.mk - File systems


    +   - When using raw NAND/yaffs2 you need to set the page size, spare oob size
    and erase block size as well:


    ```

    BOARD_NAND_PAGE_SIZE := 2048

    BOARD_NAND_SPARE_SIZE := 64

    BOARD_FLASH_BLOCK_SIZE := 131072

    BOARD_SYSTEMIMAGE_PARTITION_SIZE := nnnnnnn

    BOARD_USERDATAIMAGE_PARTITION_SIZE := nnnnnnn

    BOARD_CACHEIMAGE_PARTITION_SIZE := nnnnnnn

    ```'
  - '[PAGE 195]


    ```

    vendorsorset.sh

    ```


    +   "lunch" searches for vendorsorset.sh in

    * vendor/*/vendorsorset.sh

    * vendor/*/*/vendorsorset.sh

    * device/*/vendorsorset.sh


    Use it to add a product to the menu, like this:


    +   add_lunch_combo PRODUCT_NAME-{user | userdebug | eng]


    For example


    ```

    add_lunch_combo full_myproduct-eng

    ```'
  - '[PAGE 196]


    # Session 8 Board Configuration


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_196_0.png)


    +   - This is only needed if you add packages within the product directory

    - The two lines of boilerplate below will recursively build all Android.mk files
    in this sub directory tree


    ```

    LOCAL_PATH := $(call my-dir)

    include $(call all-makefiles-under,$(LOCAL_PATH))

    ```'
  - "[PAGE 197]\n\n# Adding an overlay\n\n+   - Overlays allow you to over-write files\
    \ in the framework and base packages\n\n+   - i.e. you can customize the settings\
    \ stored in the associated .jar files\n\n+   - Commonly used to tweak system attributes\n\
    \n+   - Put the files you want to be overlaid into a directory, usually called\
    \ overlay\n  - Use exactly the same file structure as on the target: overlay/frameworks/base/core/res/res/values/config.xml\n\
    \n+   - Add this to device.mk PRODUCT_PACKAGE_OVERLAYS := \\ device/myorg/mydevice/overlay\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_197_0.png)\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_197_1.png)"
  - '[PAGE 198]


    # Other make targets


    +   - make clean: **dangerous** removes everything in the out/

    directory

    - make installclean: removes out/target/product/<current

    product>

    - make clean-<module name>: cleans just the module named

    - make snod: rebuild system.img without checking

    dependencies

    - make offline-sdk-docs: generate the developer SDK docs

    - make sdk: create an Android SDK


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_198_0.png)


    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_198_1.png)'
  - "[PAGE 199]\n\n# LF315 Inside Android: an Introduction to Android Internals\n\n\
    # A note about ext4 image format\n\n+   * When building ext4 system, userdata\
    \ and cache images the format is not plain ext4\n* It is in \"sparse\" format,\
    \ designed to reduce the size by eliminating empty areas\n* The Android bootloader\
    \ or U-Boot with fastboot support understands this\n* If not using fastboot, convert\
    \ to plain ext4 binary format like so:\n  ```$ simg2img system.img system-ext4.img```\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_199_0.png)"
  - '[PAGE 200]


    # Lab 8


    Exercise 8.1 Create a new product


    Objective: to define a new product that will run on the Beaglebone and check that
    it builds. You won''t be able to test it yet because there are a few more things
    to do after this.


    Begin by choosing a name for myorg and mydevice and create the corresponding sub
    directory in device/. The sample solution uses ti/beaglebone, which is descriptive
    but boring.


    Copy the files from $HOME/embedded-android/resources/lab8 to your directory. If
    you have used different names, edit all occurrences of ti and beagle-bone.


    Source build/envsetup.sh, select your product from the lunch combo and build it.
    As with the emulator build, it will take a while to finish.


    When complete, check that the out/target/product directory contains the generated
    cache.img, ramdisk.img, system.img and userdata.img files.'
- md: "\n192 LF315 Inside Android: an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_201_0.png)\n\
    \n# Session 9: The Android kernel\n\n- Differences from mainline Linux\n- Where\
    \ to get stock kernels from\n- Other kernels\n- List of changes\n- Using git to\
    \ find the differences\n- Building a kernel\n\n## Differences from mainline Linux\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_202_0.png)\n\n# LF315 Inside Android:\
    \ an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_203_0.png)\n\
    \n- http://elinux.org/Android_Mainlining_Project\n- Goals\n  * to include Android\
    \ changes in mainline Linux\n  * to be able to boot and use Android with a mainline\
    \ kernel\n- Mainline 3.4 can boot Android (on some platforms) but not run it\n\
    \n## Session 9 The Android kernel\n\n## Where to get stock kernels from\n\n- The\
    \ AOSP repositories do not include a kernel\n- Instead, reference implementations\
    \ for most of the \"Nexus\" devices, and the emulator are at\nhttps://android.googlesource.com\n\
    - For example, the kernel used in the emulator is at\nhttps://android.googlesource.com/kernel/goldfish\n\
    - The steps to obtain a copy are\n\n```\n$ git clone https://android.googlesource.com/kernel/goldfish\n\
    $ goldfish\n$ git checkout origin/android-goldfish-2.6.29\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_204_0.png)\n\
    \n# LF315 Inside Android: an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_205_0.png)\n\
    \n- As well as finding Android support you will have to get a kernel that supports\
    \ your SoC or device\n- Linaro has kernels with Android support for several ARM\
    \ SoCs\n- Most silicon vendors have Linux and Android support these days (but\
    \ usually lagging mainline by several releases)\n- Device manufacturers such as\
    \ Samsung, HTC, are obliged to publish the kernel source code under the GPL\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_205_1.png)\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_205_2.png)\n\
    \nCopyright © 2013 The Linux Foundation. All rights reserved\n\n## Session 9 The\
    \ Android kernel\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_206_0.png)\n\n- Description\n\
    - Transaction-based inter-process communication\n- Driver node: /dev/binder\n\
    - Driver information: /proc/binder\n- Configuration\n  - CONFIG_ANDROID_BINDER_IPC\n\
    - Files\n  - drivers/staging/android/binder.c\n  - drivers/staging/android/binder.h\n\
    - Needed to boot? Yes\n\n## Paranoid network\n\n- Description\n- Restrict access\
    \ to network sockets by GID\n- Only applications belonging to certain groups can\
    \ create network connections (look in include/linux/android_uid.h)\n- Configuration\n\
    \  - CONFIG_ANDROID_PARANOID_NETWORK\n- Files\n  - include/linux/android_uid.h\n\
    \  - Various files in net/\n- Needed to boot? No\n\n## Session 9 The Android kernel\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_208_0.png)\n\n- Description\n- Anonymous\
    \ shared memory (ashmem) allows processes to share segments. Similar to System\
    \ V and POSIX shared memory, except that memory can be reclaimed if OOM.\n- Configuration\n\
    \  - CONFIG_ASHMEM\n- Files\n  - drivers/staging/android/ashmem.c\n  - drivers/staging/android/ashmem.h\n\
    - Needed to boot? Yes\n\n## Session 9 The Android kernel\n\n- Conventionally,\
    \ applications write log messages to a file via the system log, syslogd\n- This\
    \ is slow - requiring several task switches\n- And writing to logs to flash memory\
    \ is also slow and degrades memory\n- The Android logger is a simple character\
    \ driver that writes to in-memory ring buffers\n  - No task switches\n  - No writes\
    \ to flash storage\n- The logs are read using logcat\n\nLF315 Inside Android:\
    \ an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_211_0.png)\n\
    \n- Description\n- Implements the Android logs. Accessed by device nodes in /dev/log\n\
    - Configuration\n  - CONFIG_ANDROID_LOGGER\n- Files\n  - drivers/staging/android/logger.c\n\
    \  - drivers/staging/android/logger.h\n- Needed to boot? Yes\n\n## Low memory\n\
    \n- Description\n- Implements low memory handling by killing processes with certain\
    \ oom_adj values as free memory passes thresholds.\n- Controlled by\n  - /sys/module/lowmemorykiller/parameters/adj\n\
    \  - /sys/module/lowmemorykiller/parameters/minfree\n- Configuration\n  - CONFIG_ANDROID_LOW_MEMORY_KILLER\n\
    - Files\n  - drivers/staging/android/lowmemorykiller.c\n- Needed to boot? No\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_212_0.png)\n\n## Alarm timers\n\n-\
    \ Description\n- Similar to POSIX timers but they continue to operate while the\
    \ device is in suspend mode\n- Accessed via ioctl calls to /dev/alarm\n- Configuration\n\
    \  - CONFIG_ANDROID_ALARM_DEV\n- Files\n  - drivers/staging/android/alarm-dev.c\n\
    \  - drivers/staging/android/android_alarm.h\n- Needed to boot? No\n\n## Session\
    \ 9 The Android kernel\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_214_0.png)\n\
    \n- Description\n- Saves log data to a region of memory where it can be found\
    \ and recovered after a reboot in /proc/last_kmesg\n- Configuration\n  - CONFIG_ANDROID_RAM_CONSOLE\n\
    - Files\n  - drivers/staging/android/ram_console.c\n- Needed to boot? No\n\n##\
    \ Timed GPIO\n\n- Description\n- Schedule a specific setting for a GPIO line at\
    \ some point in the future. Used by the vibrator driver to make sure that it gets\
    \ turned off even if the application that turned it on is killed\n- Configuration\n\
    \  - CONFIG_ANDROID_TIMED_GPIO\n  - CONFIG_ANDROID_TIMED_OUTPUT\n- Files\n  -\
    \ drivers/staging/android/timed_gpio.c\n  - drivers/staging/android/timed_gpio.h\n\
    \  - drivers/staging/android/timed_output.c\n  - drivers/staging/android/timed_output.h\n\
    - Needed to boot? No\n\n## Session 9 The Android kernel\n\n## Wake locks\n\n-\
    \ Desktop/laptop operating systems suspend on user demand (e.g. when closing the\
    \ lid of a laptop)\n- Hand-held devices need to be more aggressive and suspend\
    \ after a short period of inactivity\n- But, both applications and kernel drivers\
    \ need to prevent suspending in some cases\n  - While an application is playing\
    \ music or video\n  - While a driver is in a critical state\n- To prevent opportunistic\
    \ suspend, applications and drivers can take a wakelock\n  - Suspend is not allowed\
    \ while one or more wakelocks are locked\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_216_0.png)\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_216_1.png)\n\n## Wake locks\n\n- Description\n\
    - Holding a wake lock prevents the kernel from going into a sleep state\n- Configuration\n\
    \  - CONFIG_WAKELOCK\n  - CONFIG_WAKELOCK_STAT\n  - CONFIG_USER_WAKELOCK\n- Files\n\
    \  - include/linux/wakelock.h\n  - kernel/power/userlock.c\n  - kernel/power/welock.c\n\
    \  - 100s of drivers that need to holdelocks\n- Needed to boot? No\n\n## Session\
    \ 9 The Android kernel\n\n## Using git to find the differences\n\n- This technique\
    \ will show you the differences between the kernel you have and the mainline stable\
    \ tree\n- git format-patch creates a patch file for each commit\n\n```\n$ git\
    \ clone https://android.googlesource.com/\nkernel/goldfish\n$ cd goldfish\n$ git\
    \ checkout origin/android-goldfish-2.6.29\n$ git remote add stable git://git.kernel.org/pub/scm/\n\
    linux/kernel/git/stable/linux-stable.git\n$ git fetch stable\n$ git format-patch\
    \ v<kernel-version>..HEAD\n```\n\n## Preparing to build\n\n- The kernel needs\
    \ two pieces of information to cross-compile\n- The CPU architecture: ARCH\n \
    \ * One of the sub directories in directory arch/\n  * For an ARM processor\n\
    \  * $ export ARCH=arm\n- The cross compiler prefix: CROSS_COMPILE\n  * Dependent\
    \ on the toolchain\n* For the prebuilt Android ARM toolchain:\n  * $ export CROSS_COMPILE=arm-eabi-\n\
    \n## Session 9 The Android kernel\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_220_0.png)\n\
    \n- Typical kernel has > 1000 configuration options\n- The default configuration\
    \ for the target board is usually stored in arch/$ARCH/configs\n  - e.g. for Beaglebone\
    \ Android am335x_evm_android_defconfig\n- Set the configuration using\n  - $ make\
    \ <config file>\n- You can tweak configuration using these commands\n  - make\
    \ menuconfig (ncurses text menu)\n  - make xconfig (graphical menus using Qt)\n\
    \  - make gconfig (graphical menus using Gtk+)\n- Files generated\n  - .config\n\
    \  - include/generated/autoconf.h\n"
  mdcn: "\n\n192 LF315 深入 Android：Android 内部介绍\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_201_0.png)\n\
    \n# 第 9 节：Android 内核\n\n- 与主线 Linux（Linux）的差异\n- 从哪里获取官方内核\n- 其他内核\n- 更改列表\n-\
    \ 使用 git 查找差异\n- 编译内核\n\n## 与主线 Linux 的差异\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_202_0.png)\n\
    \n# LF315 深入 Android：Android 内部介绍\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_203_0.png)\n\
    \n- http://elinux.org/Android_Mainlining_Project\n- 目标\n  * 在主线 Linux 中包含 Android\
    \ 修改\n  * 能够使用主线内核启动并运行 Android\n- 主线 3.4 版本可以启动 Android（在某些平台上），但无法运行它\n\n##\
    \ 第 9 节 Android 内核\n\n## 从哪里获取官方内核\n\n- AOSP 仓库中不包含内核\n- 相反，大多数 \"Nexus\" 设备的参考实现以及模拟器位于：\n\
    https://android.googlesource.com\n- 例如，模拟器使用的内核位于：\nhttps://android.googlesource.com/kernel/goldfish\n\
    - 获取副本的步骤为：\n\n```\n$ git clone https://android.googlesource.com/kernel/goldfish\n\
    $ goldfish\n$ git checkout origin/android-goldfish-2.6.29\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_204_0.png)\n\
    \n# LF315 深入 Android：Android 内部介绍\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_205_0.png)\n\
    \n- 除了寻找 Android 支持外，你还需要获取一个支持你的 SoC 或设备的内核\n- Linaro 提供了支持多个 ARM SoC 的 Android\
    \ 内核\n- 如今大多数硅厂商都提供 Linux 和 Android 支持（但通常比主线落后几个版本）\n- 像三星、HTC 等设备制造商有义务根据 GPL\
    \ 协议发布内核源码\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_205_1.png)\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_205_2.png)\n\
    \nCopyright © 2013 The Linux Foundation. 保留权利\n\n## 第 9 节 Android 内核\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_206_0.png)\n\
    \n- 描述\n- 基于事务的进程间通信（IPC）\n- 驱动节点：/dev/binder\n- 驱动信息：/proc/binder\n- 配置\n  -\
    \ CONFIG_ANDROID_BINDER_IPC\n- 文件\n  - drivers/staging/android/binder.c\n  - drivers/staging/android/binder.h\n\
    - 启动所需？是\n\n## 偏态网络（Paranoid network）\n\n- 描述\n- 通过 GID 限制对网络字字的访问\n- 只有属于特定组的应用程序创建网络连接（查看\
    \ include/linux/android_uid.h）\n- 配置\n  - CONFIG_ANDROID_PARANOID_NETWORK\n- 文件\n\
    \  - include/linux/android_uid.h\n  - net/ 下的各种\n- 启动所需？否\n\n## 第 9 节 Android\
    \ 内核\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_208_0.png)\n\n- 描述\n- 匿名共享内存（ashmem）允许进程共享段。与\
    \ System V 和 POSIX 共享内存类似，不同在于发生 OOM（内存溢出）时可以回收内存。\n- 配置\n  - CONFIG_ASHMEM\n\
    - 文件\n  - drivers/staging/android/ashmem.c\n  - drivers/staging/android/ashmem.h\n\
    - 启动所需？是\n\n## 第 9 节 Android 内核\n\n- 传统上，应用程序通过系统日志 syslogd 将日志消息写入文件\n- 这很慢——需要多次任务切换\n\
    - 并且向闪存写入日志也很慢且会损坏内存\n- Android 日志器（logger）是一个简单的字符驱动程序，写入内存中的环形缓冲区\n  - 无需任务切换\n\
    \  - 无需写入闪存\n- 使用 logcat 读取日志\n\nLF315 深入 Android：Android 内部介绍\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_211_0.png)\n\
    \n- 描述\n- 实现了 Android 日志。通过 /dev/log 下的设备节点访问\n- 配置\n  - CONFIG_ANDROID_LOGGER\n\
    - 文件\n  - drivers/staging/android/logger.c\n  - drivers/staging/android/logger.h\n\
    - 启动所需？是\n\n## 低内存管理（Low memory）\n\n- 描述\n- 当空闲内存通过阈值时，通过杀死具有特定 oom_adj 值的进程来实现低内存处理。\n\
    - 控制于\n  - /sys/module/lowmemorykiller/parameters/adj\n  - /sys/module/lowmemorykiller/parameters/minfree\n\
    - 配置\n  - CONFIG_ANDROID_MEMORY_KILLER\n- 文件\n  - drivers/staging/android/memorykiller.c\n\
    - 启动所需？否![](img/c6f4acfaca4829cadfb14f4d738cba2c_212.png)\n\n## 闹钟定时器（Alarm timers）\n\
    \n- 描述\n- 与 POSIX 定时器类似，但它们在设备挂起时继续运行\n- 通过 /dev/alarm 访问\n- 配置\n  - CONFIG_ANDROID_ALARM\n\
    - 文件\n  - drivers/staging/android/alarm.c\n- 启动所需？否\n\n## 第 9 节 Android 内核\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_214.png)\n\n- 描述\n- 在挂起时，在某个内存区域保存数据。通过\
    \ /proc/kmesg 访问\n- 配置\n  - CONFIG_ANDROID_RAM\n- 文件\n- drivers/staging/android/ram_console.c\n\
    - 启动所需？否\n\n## 定时 GPIO（Timed GPIO）\n\n- 描述\n- 在某个时间调度特定的 GPIO 设置。即使应用程序被杀死也能确保其关闭\n\
    - 配置\n  - CONFIG_ANDROID_TIMED_GPIO\n  - CONFIG_TIMED_OUTPUT\n- 文件\n  - drivers/staging/android/timed_gpio.c\n\
    \  - drivers/staging/android/timed_output.h\n  - drivers/staging/android/timed_output.c\n\
    - 启动所需？否\n\n## 唤醒锁（Wake locks）\n\n- 桌面操作系统根据需要（例如关闭笔记本盖子时）挂起\n- 手持设备在空闲一段时间后需要更激进的挂起\n\
    - 但当应用程序播放音乐或视频时，内核驱动程序需要防止挂起\n- 当多个唤醒锁被锁定时，允许进入睡眠状态\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_216.png)\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_216.1.png)\n\n## 唤醒锁\n\n- 描述\n- 持有唤醒锁防止内核进入睡眠状态\n\
    - 配置\n  - CONFIG_WAKELOCK\n  - CONFIG_WAKELOCK_STAT\n  - CONFIG_USER_WAKELOCK\n\
    - 文件\n  - include/linux/waklock.h\n  - kernel/power/userlock.c\n  - kernel/power/welock.c\n\
    \  - 需要持有唤醒锁的驱动\n- 启动所需？否\n\n## 第 9 节 Android 内核\n\n## 使用 git 查找差异\n\n- 这种技术将显示你的内核与主线稳定树之间的差异\n\
    - git format-patch 为每个 commit 创建补丁文件\n\n```\n$ git clone https://android.googlesource.com/\n\
    kernel/goldfish\n$ cd goldfish\n$ git checkout origin/android-goldfish-2.6.29\n\
    $ git remote add stable git://git.kernel.org/pub/scm/\nlinux/kernel/git/stable/linux-stable.git\n\
    $ git fetch stable\n$ git format-patch v<kernel-version>..HEAD\n```\n\n## 准备编译\n\
    \n- 内核交叉编译需要两个信息\n- CPU 架构：ARCH\n  * arch/ 目录下的子目录\n  * 对于 ARM 处理器\n  * $ export\
    \ ARCH=arm\n- 交叉编译器前缀：CROSS_COMPILE\n  * 取决于工具链\n  * 对于预编译 Android ARM 工具链：\n\
    \  * $ export CROSS_COMPILE=arm-eabi-\n\n## 编译内核\n\n- 通常内核有超过 1000 个配置选项\n- 目标板的默认配置通常存储在\
    \ arch/$ARCH/configs\n  - 例如 Beaglebone Android 的 am335x_evm_android_defconfig\n\
    - 使用以下设置配置\n  - $ make <config file>\n- 使用这些命令调整配置\n  - make menuconfig（ncurses\
    \ 文本菜单）\n  - make xconfig（使用 Qt 的图形界面）\n  - make gconfig（使用 Gtk+ 的图形界面）\n- 生成的文件\n\
    \  - .config\n  - include/generated/autoconf.h\n\n"
