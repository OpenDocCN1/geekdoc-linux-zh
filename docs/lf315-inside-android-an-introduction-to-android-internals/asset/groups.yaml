    # Lab 4


    Exercise 4.1 Build the SDK


    Here you will build the SDK from the AOSP, which will take 10 minutes or so.

    Starting with new shell:


    ```

    $ . build/envsetup.sh

    $ lunch sdk-eng

    $ make -jN sdk

    ```


    You will see that the SDK is generated

    out/host/linux-x86/sdk


    Install the SDK into your home directory:


    ```

    $ cd ~

    $ unzip ^/embedded-android/aosp/out/host/linux-x86/sdk/

    android-sdk_eng. [your name]_linux-x86.zip

    ```


    Create a script file with the following contents to set up paths:

    export ANDROID_HOME=$HOME/src/android-sdk_eng.[your name]_linux-x86

    PATH=$ANDROID_HOME/tools:$ANDROID_HOME/platform-tools:$PATH


    You will need to source this script whenever you use the SDK'
