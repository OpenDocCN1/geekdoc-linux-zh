    \ All rights reserved. 请勿传播。\n\n# LF315 深入 Android：Android 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_399_0.png)\n\
    \n- 管理 WiFi、蓝牙和 USB 网络连接\n- 检测新连接，断开旧连接\n- 管理 USB 共享网络和 WiFi 热点\n\n- 与 ConnectivityManager\
    \ 通信\n\n- 在 init.rc 中作为服务启动\n\n- 编写为一个独立的 root 权限进程，以便将高层组件与 root 权限级隔离\n- 引入于\
    \ 2.2 Froyo 版本\n\nCopyright © 2013 Linux Foundation.\nAll rights reserved. 请勿传播。\n\
    \n# 第15 节 网络\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_400_0.png)\n\n- 管理各种网络连接\n\
    - 当某个连接失败时，回退到其他连接\n- 当某个连接可用/不可用时通知系统\n- 允许应用程序获取有关连接的各种信息\n\nCopyright © 2013\
    \ Linux Foundation. All rights reserved. 请勿传播。\n\n# 网络接口类型\n\n- ConnectivityManager\
    \ 完全支持\n- TYPE_MOBILE_DUN, TYPE_MOBILE_HIFI,\n  TYPE_MOBILE_MMS, TYPE_MOBILE_SUPL\n\
    - TYPE_BLUETOOTH\n- TYPE_WIFI\n- TYPE_ETHERNET\n\n# 第15 节 网络\n\n# 393\n\n# 接口管理\n\
    \n- 正常模式\n  - 仅一个接口启动，wlan0 或 rmnet0\n- USB 共享网络模式\n  - 开启 IP 转发\n  - 将 rndis0\
    \ 作为 USB gadget 启动\n  - 为 rndis0 添加路由\n  - 启动 /system/bin/dnsmasq\n- WiFi 热点\n\
    \  - 关闭 WiFi 接口 (wlan0)\n  - 启动接入点接口 (例如 athap0)\n  - 创建与共享网络相似的路由\n\n# LF315\
    \ 深入 Android：Android 内部原理\n\n# 以太网问题\n\n- 以太网在 Android 中并不是一等公民\n- 底层工具 (netcfg...)\
    \ 可以工作但 ConnectivityManager 忽略了它\n- 某些应用无法工作（例如：Google Play Store）\n- 浏览器是正常的，因为它们绕过了\
    \ CM（但多媒体将失败）\n- 解决方案：Android 团队提供的以太网连接管理器 (ECM) 补丁\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_403_0.png)\n\
    \n# 实验 15\n\n**练习 15.1 配置接口**\n\n将网线插入 Beaglebone。\n\n使用 netcfg 和 ifconfig 启动\
    \ eth0 并赋予 IP 地址。检查是否可以 ping 网络上的其他节点。使用 DHCP 配置 eth0。\n\n如果你可以访问网页，尝试使用浏览器检查是否可以访问网站。\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_405_0.png)\n\n# 第16 节 输入设备\n\n397\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_406_0.png)Copyright © 2013 Linux Foundation.\
    \ All rights reserved.\n\n# Android 输入层\n\n- 从底层...\n- Linux evdev 驱动生成事件并向上传递\n\
    - EventHub 读取事件并向上传递\n- InputReader 解码并转换为 Android 事件\n- InputDispatcher 将事件发送到相应的窗口\n\
    \nAndroid 组件的代码位于\nEventHub: frameworks/base/services/input/EventHub.cpp\nInputReader:\
    \ frameworks/base/services/input/InputReader.cpp\nInputDispatcher: frameworks/base/services/input/InputDispatcher.cpp\n\
    \n# 第16 节 输入设备\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_408_0.png)\n\n- Linux\
    \ 输入层 (evdev) 为产生数据的设备提供事件机制\n- 通常用于人类输入设备：键盘、鼠标、触摸屏\n- 这些事件由 EventHub 处理\n- 但也用于定时产生输入的设备：距离传感器、罗盘\n\
    - 这些事件由 Android 传感器子系统处理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_408_1.png)(img/c6f4acfaca4829cadfb14f4d738cba2c_408_2.png)\n\
    \n# 输入设备驱动\n\n- 事件驱动的结构在 Linux 源码树的 Documentation/input 中\n- 每个输入驱动注册时会在 /dev/input\
    \ 中创建一个节点\n- 从节点读取事件\n- 有各种 ioctl 命令来获取其他信息\n\n```\nls /dev/input\nevent0\nevent1\n\
    event2\nevent3\nevent4\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_409_0.png)\n\
    \n# 第16 节 输入设备\n\n401\n\n# getevent 工具\n\n- Android 命令 getevent 在调查输入设备非常有用\n\
    - 使用 getevent -h 查看选项列表\n\n```\n# getevent\nadd device 1: /dev/input/event4\n\
    name: \"lightsensor-level\"\nadd device 2: /dev/input/event3\nname: \"proximity\"\
    \nadd device 3: /dev/input/event2\nname: \"tuna-gpio-keypad\"\nadd device 4: /dev/input/event0\n\
    name: \"barometer\"\nadd device 6: /dev/input/event1\nname: \"Melsas MMSxx Touchscreen\"\
    \n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_410_0.png)(img/c6f4acfaca4829cadfb14f4d738cba2c_410_1.png)Copyright\
    \ © 2013 Linux Foundation. All rights reserved\n\n# LF315 深入 Android：Android 内部原理\n\
    \n# 事件\n\n- 每个事件由一个 16 字节的 input_event 描述\n\n```\nstruct input_event {\n    struct\
    \ timeval time;\n    __u16 type;\n    __u16 code;\n    __s32 value;\n}\n```\n\n\
    - time: 时间戳\n- type: 事件类型，例如按键、鼠标移动\n- code: 取决于类型，例如对于键盘，code = 键\n- value: 取决于类型，例如对于键盘，1\
    \ 表示按下，0 表示释放\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_411_0.png)(img/c6f4acfaca4829cadfb14f4d738cba2c_411_1.png)Copyright\
    \ © 2013 Linux Foundation. All rights reserved. 请勿传播。\n\n# 事件类型\n\n* 键盘\n    *\
    \ type = EV_KEY\n    * code = keycode，在 include/uapi/linux/input/ 中定义\n    * value\
    \ = 1 (按下) 0 (弹起)\n* 鼠标\n    * type = EV_REL\n    * code = REL_X 或 REL_Y\n   \
    \ * value = X 或 Y 坐标\n* 触摸屏\n    * type = EV_ABS\n    * code = ABS_X, ABS_Y, ABS_Z\
    \ (压力)\n    * value = X, Y 或 Z 坐标\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_412_0.png)\
    \ 同步事件由于某些事件类型（例如 EV_ABS）需要 2 或 3 个事件包来提供 X、Y 和 Z 的完整信息，因此需要一种方法指示所有输入已报告：EV_SYN\n\
    \n- type = EV_SYN\n- code = SYN_REPORT\n- value = 0\n\n- 所有事件报告（包括键盘等单值事件）都必须发送\
    \ EV_SYN 以表示此报告的结束\n\n"
