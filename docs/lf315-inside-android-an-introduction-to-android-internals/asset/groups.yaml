- md: "\n# Specifying libraries in Android.mk\n\n- LOCAL_LDLIBS: list libraries to\
    \ link\n- LOCAL_PATH := $(call my-dir)\n\ninclude $(CLEAR_VARS)\n\nLOCAL_MODULE\
    \ := hello-jni\nLOCAL_SRC_FILES := hello-jni.c\n\nLOCAL_LDLIBS := -llog -ljnigraphics\n\
    \ninclude $(BUILD_SHARED_LIBRARY)\n\n# Session 5 Native code\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_140_0.png)\n\
    \n- The NDK allows you to write optimized native code for compute-intensive functions\n\
    - Native code has access to certain system libraries\n  - Defined as the stable\
    \ API\n  - Note: Bionic libc is not fully POSIX compatible\n\n# Lab 5\n\nExercise\
    \ 5.1 Install the NDK\n\n```\n$ cd\n$ tar xf /embedded-android/resources/lab5/\n\
    android-ndk-xxxxxxxxxx-linux-x86.tar.bz\n```\n\nNote that it is possible to create\
    \ an NDK from the AOSP code. We are not doing so at this point because (a) it\
    \ takes a long time and (b) the build scripts are broken in the 4.2.1_r1 release.\
    \ For completeness, this is how you would do it:\n\n```\n$ cd ndk/build/tools/\n\
    $ export ANDROID_NDK_ROOT=$HOME/embedded-android/aosp/ndk\n./make-release.sh\n\
    ```\n\nExercise 5.2 Write a native method\n\nCreate a new Android project named\
    \ HelloJni with package name com.example.hellojni and build it.\n\nCreate a new\
    \ folder in the HelloJni project called jni and copy the two files from /embedded-android/resources/lab5\
    \ (Android.mk and hello-jni.c) into it. Build the library from the command line\
    \ using the ndk-build script:\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_141_0.png)\n\
    \n```\n$ /android-ndk-xxxxxxxxxx/ndk-build\n```\n\nNote that directory libs/armeabi\
    \ has been created and contains the library.\n\nModify the generated Java source\
    \ file, HelloJniActivity.java to call stringFromJNI as shown in the slides.\n\n\
    Test that it works. You should see the string \"Hello from JNI !\" on the screen\
    \ and if you run logcat you should see that it reports loading your native library.\n\
    \nExtend the function to take two integers, add them together and return the result\
    \ as a string. The prototype for the native function will be\n\n```\njstring Java_com_example_hellojni_HelloJni_stringFromJNI(JNIEnv*\
    \ env, object this, jint n1, jint n2)\n```\n\n# Session 6: Intents\n\n- Explicit\
    \ intents\n- Implicit Intents\n- Intent filters\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_143_0.png)\n\
    \n# Intents\n\n- Intents are messages passed between application components:\n\
    \  - Activities\n  - Servers\n  - Broadcast receivers\n- The target component\
    \ may be in the same application or a different one\n- Intents are also used to\
    \ send system-wide notifications (broadcast intents)\n\nExamples of functions\
    \ that can be used to send an intent include:\nstartActivity (Intent) to start\
    \ an Activity\nstartService(Intent) or bindService(Intent, ServiceConnection,\
    \ int) to start a background service\nsendBroadcast (Intent) to send it to any\
    \ interested BroadcastReceiver components.\nBroadcast intents will be covered\
    \ in more detail later\n\n# Types of intent\n\n- Explicit: The target is a fully\
    \ qualified name (package and class)\n- Implicit\n  - The target is ambiguous:\
    \ e.g. display a web page\n  - The system chooses a target that can perform the\
    \ action\n  - If there are several options it may prompt the user to choose\n\
    - Broadcast\n  - An implicit intent used to notify an event, e.g. a change in\
    \ WiFi connection status\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_145_0.png)\n\
    \n# Session 6 Intents\n\n# The Intent object\n\n- The class android.content.Intent\
    \ includes these fields\n  - ComponentName: for explicit intents, the destination\
    \ class\n  - action: the purpose of the intent\n  - data: a URI relevant to the\
    \ action\n  - type: a MIME type describing the data\n  - category: a string containing\
    \ additional information about the kind of component that should handle the intent\n\
    \  - extras: any number of key-value pairs\n\n# LF315 Inside Android: an Introduction\
    \ to Android Internals\n\n### Explicit intents\n\n```text\n- An explicit intent\
    \ has\n  - a destination in ComponentName\n- May have action, data, type, category\
    \ and extras\n- ComponentName is composed of two strings:\n  - package, e.g. \"\
    com.example.helloworld\"\n  - class, e.g. \"com.example.helloworld.HelloWorldActivity\"\
    \n- Use either setComponent(ComponentName) or setClass(Context, Class)\n```\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_147_0.png)\n\n# Session 6 Intents\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_148_0.png)\n\nCase 1: launching an activity\
    \ in the same application you can use the class:\n\n```\nIntent intent = new Intent(this,\
    \ Activity.class);\nstartActivity(intent);\n```\n\nCase 2: launching an application\
    \ with a known package and class name:\n\n```\nIntent intent = new Intent();\n\
    ComponentName cn = new ComponentName(\n\"com.example.helloworld\",\n\"com.example.helloworld.HelloWorldActivity\"\
    );\nintent.setComponent(cn);\nstartActivity(intent);\n```\n\n# LF315 Inside Android:\
    \ an Introduction to Android Internals\n\n# Implicit Intents\n\n- An implicit\
    \ intent has\n  - an empty ComponentName\n  - at least one action\n  - optionally,\
    \ data, type and extras relevant to the action\n  - The system will use Intent\
    \ resolution to select an application component that can handle the intent\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_149_0.png)\n\n# Session 6 Intents\n\n\
    # Action and data\n\n- Actions are strings such as:\n  - \"android.intent.action.DIAL\"\
    \n  - Usually coded using the constant Intent.ACTION_DIAL\n- Data is an optional\
    \ Uri object that is relevant to the action\n  - Examples using ACTION_DIAL:\n\
    \    - data = \"tel:123\": display the dialer application with the number 123\
    \ filled\n    - data = \"content://contacts/people/1\": display the dialer application\
    \ with the details of person whose identifier is \"1\"\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_150_0.png)\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_150_1.png)\n\n# LF315 Inside Android:\
    \ an Introduction to Android Internals\n\n# Category\n\n- The category is a string\
    \ giving additional information about the intent\n  - Format similar to actions,\
    \ for example:\n  - \"android.intent.category.LAUNCHER\"\n  - with the corresponding\
    \ constant Intent.CATEGORY_LAUNCHER\n\n# Session 6 Intents\n\n- Application components\
    \ must specify an intent filter to receive implicit intents\n- Explicit intents\
    \ do not need to match a filter\n- The filter is coded in the AndroidManifest\n\
    - Example:\n\n```xml\n<intent-filter>\n  <action android:name=\"android.intent.action.MAIN\"\
    \ />\n  <category android:name=\"android.intent.category.LAUNCHER\" />\n</intent-filter>\n\
    ```\n\n# LF315 Inside Android: an Introduction to Android Internals\n\n- Matches\
    \ the action, type, and category of an intent against intent filters\n- If intent\
    \ has an action, must match an action in the filter\n- If intent has a type, must\
    \ match a type in the filter\n- If intent has one or more categories, must all\
    \ match categories in the filter\n- If there is more than one possible target,\
    \ a selection dialog will pop up allowing the user to choose\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_153_0.png)\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_153_1.png)\n\n# Session 6 Intents\n\n\
    # LF315 Inside Android: an Introduction to Android Internals\n\n- The am command\
    \ can be used to send intents, among other things\n- For example, this will launch\
    \ the main activity in com.example.helloworld:\n\n```\nam start -a android.intent.action.MAIN\
    \ -n com.example.helloworld/com.example.helloworld.HelloWorldActivity\n```\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_155_0.png)\n\n# Session 6 Intents\n\n\
    # Launching a new application\n\n- Ask PackageManager to do it for you!\n\n```java\n\
    Intent intent = getActivity().getPackageManager().getLaunchIntentForPackage(com.package.address);\n\
    if (intent != null) {\n    // start the activity\n    intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);\n\
    \    startActivity(intent);\n}\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_156_0.png)\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_156_1.png)\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_156_2.png)\n\
    \nCopyright © 2013 Linux Foundation.\nAll rights reserved. DO NOT DISTRIBUTE.\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_156_3.png)\n"
  mdcn: "\n\n# 在 Android.mk 中指定库\n\n- LOCAL_LDLIBS: 要链接的库列表\n- LOCAL_PATH := $(call\
    \ my-dir)\n\ninclude $(CLEAR_VARS)\n\nLOCAL_MODULE := hello-jni\nLOCAL_SRC_FILES\
    \ := hello-jni.c\n\nLOCAL_LDLIBS := -llog -ljnigraphics\n\ninclude $(BUILD_SHARED_LIBRARY)\n\
    \n# 第 5 节 原生代码\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_140_0.png)\n\n- NDK\
    \ 允许你为计算密集型函数编写优化的原生代码\n- 原生代码可以某些系统库\n  - 定义为稳定 API\n  - 注意：Bionic libc 并非完全兼容\
    \ POSIX\n\n# 实验 5\n\n练习 5.1 安装 NDK\n\n```\n$ cd\n$ tar xf /embedded-android/resources/lab5/\n\
    android-ndk-xxxxxxxxxx-linux-x86.tar.bz\n```\n\n请注意，可以从 AOSP 代码创建 NDK。我们目前没有这样做，是因为\
    \ (a) 耗时很长且 (b) 4.2.1_r1 版本中的构建脚本已损坏。为了完整起见，方法如下：\n\n```\n$ cd ndk/build/tools/\n\
    $ export ANDROID_NDK_ROOT=$HOME/embedded-android/aosp/ndk\n./make-release.sh\n\
    ```\n\n练习 5.2 编写原生方法\n\n创建一个名为 HelloJni 的新 Android 项目，包名为 com.example.hellojni\
    \ 并编译它。\n\n在 HelloJni 项目中创建一个名为 jni 的新文件夹，并将 /embedded-android/resources/lab5\
    \ 中的两个文件（Android.mk 和 hello-jni.c）复制到该目录。使用 ndk-build 脚本从命令行构建库：\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_141_0.png)\n\
    \n```\n$ /android-ndk-xxxxxxxxxx/ndk-build\n```\n\n注意目录 libs/armeabi 已经创建并并包含该库。\n\
    \n修改生成的 Java 源文件 HelloJniActivity.java，按照幻灯片所示所示调用 stringFromJNI。\n\n测试其运行情况。你应该应该在屏幕上看到字符串\
    \ \"Hello from JNI !\"，如果你运行 logcat，你应该能看到它报告正在加载你的原生库。\n\n扩展函数以接收两个整数，将它们相加并将结果作为字符串返回。原生函数的原型将是\n\
    \n```\njstring Java_com_example_hellojni_HelloJni_stringFromJNI(JNIEnv* env, object\
    \ this, jint n1, jint n2)\n```\n\n# 第 6 节 Intent（意图）\n\n- 显式 Intent\n- 隐式 Intent\n\
    - Intent 过滤器\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_143_0.png)\n\n# Intent\n\
    \n- Intent 是在应用组件之间传递的消息：\n  - Activity\n  - 服务\n  - 广播接收器\n- 目标组件可能在同一个应用程序中，也可能在不同的应用程序中\n\
    - Intent 也用于发送系统级通知（广播 Intent）\n\n用于发送 Intent 的函数示例包括：\nstartActivity (Intent)\
    \ 用于启动一个 Activity\nstartService(Intent) 或 bindService(Intent, ServiceConnection,\
    \ int) 用于启动后台服务\nsendBroadcast (Intent) 将其发送到任何感兴趣的 BroadcastReceiver 组件。\n广播\
    \ Intent 将在稍后详细介绍\n\n# Intent 的类型\n\n- 显式：目标是全限定名（包名和类）\n- 隐式\n  - 目标是模糊的：例如显示一个网页\n\
    \  - 系统将选择一个可以执行该操作的目标\n  - 如果有多个选项，可能会提示用户进行选择\n- 广播\n  - 一种用于通知事件的隐式 Intent，例如\
    \ WiFi 连接状态的变化\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_145_0.png)\n\n# 第 6\
    \ 节 Intent\n\n# Intent 对象\n\n- android.content.Intent 类包含这些字段\n  - ComponentName：用于显式\
    \ Intent，指定目标类\n  - action：Intent 的目的\n  - data：与 action 相关的 URI\n  - type：描述数据的\
    \ MIME 类型\n  - category：包含有关应处理该 Intent 的组件类型的额外信息的字符串\n  - extras：任意数量的键值对\n\n\
    # LF315 Android 内部：Android 原简介\n\n### 显式 Intent\n\n```text\n- 显式 Intent 拥有\n \
    \ - ComponentName 中的一个目标\n- 可能有 action, data, type, category 和 extras\n- ComponentName\
    \ 由两个字符串组成：\n  - package，例如 \"com.example.helloworld\"\n  - class，例如 \"com.example.helloworld.HelloWorldActivity\"\
    \n- 使用 setComponent(ComponentName) 或 setClass(Context, Class)\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_147_0.png)\n\
    \n# 第 6 节 Intent\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_148_0.png)\n\n案例\
    \ 1：在同一个应用程序中启动 Activity，你可以使用类：\n\n```\nIntent intent = new Intent(this, Activity.class);\n\
    startActivity(intent);\n```\n\n案例 2：使用已知包名和类启动应用程序：\n\n```\nIntent intent = new\
    \ Intent();\nComponentName cn = new ComponentName(\n\"com.example.helloworld\"\
    ,\n\"com.example.helloworld.HelloWorldActivity\");\nintent.setComponent(cn);\n\
    startActivity(intent);\n```\n\n# LF315 Android 内部：隐式 Intent\n\n- 隐式 Intent 拥有\n\
    \  - 一个空的 ComponentName\n  - 至少一个 action\n  - 可选的 data, type 和 extras\n  - 系统将选择可以处理该\
    \ Intent 的应用程序\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_149_0.png)\n\n# 第 6\
    \ 节 Intent\n\n# Action 和 data\n\n- Action 是字符串，例如：\n  - \"intent.action.DIAL\"\
    \n  通常使用 Intent.ACTION_DIAL\n- Data 是与 action 相关的可选对象\n  使用 ACTION_DIAL：\n   \
    \ - data = \"tel:123\" 显示拨号 123 的应用程序\n    - data = \"content://contacts/1\" 显示联系人\
    \ 1 的拨号应用程序\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_150_0.png)\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_150_1.png)\n\
    \n# LF315 Android 内部：Category\n\n- Category 是关于 Intent 类型的额外信息\n  - 类似于动作，例如：\n\
    \  - \"intent.category.LAUNCHER\"\n  对应的常量 Intent.CATEGORY_LAUNCHER\n\n# 过滤器\n\
    \n- 应用组件必须指定 intent filter 以接收隐式 Intent\n- 显式 Intent 不需要匹配 filter\n- Filter 编写在\
    \ AndroidManifest 中\n  示例：\n\n```xml\n<intent-filter>\n  <action android:name=\"\
    intent.action.MAIN\" />\n  <category android:name=\"intent.category.LAUNCHER\"\
    \ />\n</intent-filter>\n```\n\n# LF315 Android 内部\n\n- filter 匹配 Intent 的 action、type\
    \ 和 category\n- 如果 Intent 有 action，必须匹配 filter 中的 action\n- 如果 Intent 有 type，必须匹配\
    \ filter 中的 type\n- 如果 Intent 有一个或多个 category，必须全部匹配 filter 中的 category\n- 如果有多个可能的目标，将弹出对话框让用户选择\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_153_0.png)\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_153_1.png)\n\
    \n# 第 6 节 Intent\n\n- am 命令可以用于发送 Intent 等其他操作\n- 例如，这将启动 com.example.helloworld\
    \ 中的主 Activity：\n\n```\nam start -a intent.action.MAIN -n com.example.helloworld/com.example.helloworld.HelloWorldActivity\n\
    ```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_155_0.png)\n\n# 第 6 节 Intent\n\
    \n# 启动新应用程序\n\n- 让 PackageManager 帮你！\n\n```java\nIntent intent = getActivity().getPackageManager().getLaunchIntentForPackage(com.package.address);\n\
    if (intent != null) {\n    // 启动 activity\n    intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);\n\
    \    startActivity(intent);\n}\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_156_0.png)\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_156_1.png)\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_156_2.png)\n\
