    # LF315 Inside Android: an Introduction to Android Internals


    # The init sequence


    +   - Mount essential file systems for /proc, /sys, /dev

    - Parse /init.rc and /init.<product name>.rc

    - Emit early-init trigger

    - Output text A N D R O I D to /dev/tty0

    - Emit triggers init, early-fs, fs, post-fs and post-fs-data

    - Emit triggers charger, early-boot and boot

    - Emit property triggers

    - Loop handling hardware events and restarting processes


