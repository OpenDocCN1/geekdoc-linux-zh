  - "[PAGE 264]\n\n# Summary\n\n+   - System boot begins with the bootloader\n  -\
    \ the bootloader is highly device-dependent\n  - many Android bootloaders implement\
    \ the fastboot protocol\n- The bootloader loads a Linux kernel and ramdisk\n-\
    \ The ramdisk contains the Android init program\n- Android init is event based\n\
    \  - Event triggers cause sections of init.rc to be executed\n  - Some events\
