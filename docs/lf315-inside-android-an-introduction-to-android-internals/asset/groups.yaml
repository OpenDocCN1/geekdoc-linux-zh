  - "[PAGE 31]\n\n# The Android Open Source Project\n\n+   * The source code and build\
    \ tools are released by Google as the AOSP\n* http://source.android.com/\n* New\
    \ versions of Android are developed \"behind closed doors\" by members of the\
    \ OHA\n* The code is added to the AOSP repositories some time after internal release\n\
    \  * Usually after a few weeks\n  * Sometimes not at all, as with Honeycomb\n\n\
