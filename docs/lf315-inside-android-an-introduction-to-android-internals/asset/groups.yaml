  - '[PAGE 250]


    # Session 10 Starting up


    # The Android init language


    +   - Spec: system/core/init/readme.txt

    - Consists of Actions, Commands, Services, and Options

    - Action: a sequence of commands performed when a trigger is received

    - Command: somewhat similar to shell script

    - Service: a program that can be started and stopped

    - Option: modifiers to services


    Copyright © 2013 The Linux Foundation. All rights reserved'
