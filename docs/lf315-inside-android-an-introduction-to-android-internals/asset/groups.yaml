- md: "\n## Naming of audio libraries\n\n- Audio libraries go in /system/lib/hw as\
    \ normal\n- The format of the name is\n  - audio.<type>.<hardware/etc>.so\n  -\
    \ Where <type> is 'primary', 'a2dp', 'usb', etc.\n  - There must be a primary\
    \ implementation\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_432_0.png)\n\n##\
    \ LF315 Inside Android: an Introduction to Android Internals\n\n## Example\n\n\
    - On Galaxy Nexus:\n  ls /system/lib/hw/audio*\n  audio.a2dp.default.so\n  audio.primary.default.so\n\
    \  audio.primary.tuna.so\n  audio.usb.default.so\n  audio_policy.default.so\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_433_0.png)\n\n## tinyalsa\n\n- The expectation\
    \ is that the implementation uses ALSA drivers\n- There are helper functions in\
    \ libtinyalsa.so to interface with\n  - mixer and stream parameters\n  - external/tinyalsa\n\
    \  - which produces /system/lib/libtinyalsa.so\n\n## Testing\n\n- To play simple\
    \ audio\n  # tinyplay testfile.wav\n- To record simple audio\n  # tinycap testfile.wav\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_435_0.png)\n\n## Session 17 Sound and\
    \ vision\n\n## ALSA mixer settings\n\n- The initial mixer settings can be defined\
    \ in\n  /system/etc/mixer_paths.xml\n- Look for examples in the device directory\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_436_0.png)\n\n## LF315 Inside Android:\
    \ an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_437_0.png)\n\
    \n- MediaPlayer is the overall framework for playing and capturing audio/video\n\
    - MediaPlayerService implements the server element\n- StagefPlayer is the playback\
    \ engine, includes\n  - AwesomePlayer: file and web playback\n  - OMXCodec: OpenMAX\
    \ (see http://www.chronos.org/openmax/)\n\nThe source for these components is\
    \ in:\n- MediaPlayer: frameworks/base/media/java/android/media/MediaPlayer.java\n\
    - MediaPlayerService: frameworks/av/media/libmediayer/MediaPlayerService.cpp\n\
    - StagefPlayer: frameworks/av/media/libmediayer/StagefPlayer.cpp\n- AwesomePlayer:\
    \ frameworks/av/media/libstagef/AwesomePlayer.cpp\n- OMXCodec: frameworks/av/media/libstagef/OMXCodec.cpp\n\
    \n## Lab 17\n\nExercise 17.1 There is no lab this section\n\n## LF315 Inside Android:\
    \ an Introduction to Android Internals\n\n## Outline\n\n## Session 18: Resource\
    \ management\n\n- Low memory handling\n- Wake locks\n- Application wake locks\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_439_0.png)\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_439_1.png)\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_439_2.png)\nCopyright © 2013 Linux Foundation.\
    \ All rights reserved. DO DISTRIBUTE.\n\n## Low memory handling\n\n- In Android,\
    \ low memory is a normal fact of life\n- Whereas in most implementations low memory\
    \ is unusual and seldom handled\n- Android applications are present in memory\
    \ even after onDestroy()\n- The low memory handler is responsible for killing\
    \ applications that no longer needed\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_440_0.png)\n\
    \n## LF315 Inside Android: an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_441_0.png)\n\
    \n- Each process has the parameter oom_adj\n- The range of values are -16 to +15\n\
    - When memory is low, the low memory driver will send SIGKILL to processes with\
    \ high oom_adj\n- oom_adj is visible as /proc/<pid>/oom_adj\n\n## ActivityManager\
    \ and oom_adj\n\n- The value of oom_adj changes as components of an application\
    \ go through the life cycle\n- The levels are defined as:\n```\nFOREGROUND_APP_ADJ\
    \ 0\nVISIBLE_APP_ADJ 1\nPERCEPTIBLE_APP_ADJ 2\nHEAVY_WEIGHT_APP_ADJ 3\nSECONDARY_SERVER_ADJ\
    \ 4\nBACKUP_APP_ADJ 5\nHOME_APP_ADJ 6\nHIDDEN_APP_MIN_ADJ 7\nEMPTY_APP_ADJ 15\n\
    ```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_442_0.png)\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_442_1.png)\n\
    Copyright © 2013 Linux Foundation. All rights reserved. DO DISTRIBUTE.\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_442_2.png)\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_442_3.png)\n\n## The lowmmemory kernel\
    \ driver\n\n- Improves reaction to low memory situations\n- Better than the conventional\
    \ \"Out-Of-Memory killer\" which does not become active until too late\n- lowmmemory\
    \ driver has multiple thresholds based on oom_adj parameter of each process\n\
    - Look in /sys/module/lowmmemorykiller/parameters\n- Sends a SIGKILL to all processes\
    \ that fall under the threshold\n\n## Session 18 Resource management\n\n## Typical\
    \ parameters\n\nThis table shows typical thresholds in pages and MiB and the corresponding\
    \ minimum oom_adj value to escape the low memory killer:\n\n| Pages | MiB | oom_adj\
    \ |\n| :--- | :--- | :--- |\n| 2048 | 8 | 0 |\n| 3072 | 12 | 1 |\n| 4096 | 16\
    \ | 2 |\n| 6144 | 24 | 4 |\n| 7168 | 28 | 7 |\n| 8192 | 32 | 15 |\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_444_0.png)\n\
    \nThey are configured in frameworks/base/services/java/com/server/am/ProcessList.java\
    \ in function `updateOomLevels()` and are adjusted for different target types\
    \ based on screen size.\n\n## LF315 Inside Android: an Introduction to Android\
    \ Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_445_0.png)\nCopyright\
    \ © 2013 Linux Foundation. All rights reserved. DO DISTRIBUTE.\n\n## Kernel wake\
    \ locks\n\n- Some kernel drivers need to prevent the system going into suspend\
    \ mode at critical times\n- The kernel API is:\n```\n#include <linux/wakelock.h>\n\
    wake_lock_init(struct wakelock *lock, int type,\nconst char *name);\n\nvoid wake_lock(struct\
    \ wakelock *lock);\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_446_0.png)\n\
    \n## Issue caused by wake locks\n\n- Wake locks are very intrusive in kernel code\n\
    - One of the largest components in Android\n- Many subsystems have to acquire\
    \ wake locks to operate correctly: rtc alarms, input devices, mmc devices, wifi\n\
    \n## Application locks\n\nThe by two files:\n- /sys/power/wakelock - writing a\
    \ string to this file creates a wakelock\n- /sys/power/unlock - writing the same\
    \ string to this file releases the wakelock\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_448_0.png)\n\
    Hence a simple way to prevent the system sleeping is to create a wakelock:\necho\
    \ testwakelock > /sys/power/wakelock\n\n## Powermanager and wake locks\n\n- The\
    \ Powermanager service provides a higher level API to the wakel mechanism\n- Adds\
    \ a parameter which sets the screen and keyboard level\n- The procedure is:\n\
    \  - Acquire handle to the PowerManager service\n  - Create a wake lock and specify\
    \ the power flags for screen, timeout, etc.\n  - Acquire wake lock\n  - Perform\
    \ operation without sleeping (e.g. play music file)\n  - Release wake lock\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_449_0.png)\n\n## Types of Powermanager\
    \ wake lock\n\n| Type | CPU | screen | kbd |\n| :--- | :--- | :--- | :--- |\n\
    | PARTIAL_WAKE_LOCK | on | off | off |\n| SCREEN_DIM_WAKE_LOCK | on | dim | off\
    \ |\n| SCREEN_BRIGHT_WAKE_LOCK | on | bright | off |\n| FULL_WAKE_LOCK | on |\
    \ bright | on |\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_450_0.png)\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_450_1.png)\n\
    \n## Wake lock example\n\n```\nPowerManager pm = (PowerManager) getSystemService(\n\
    \    Context.POWER_SERVICE);\n\nPowerManager.WakeLock wl = pm.newWakeLock(\n \
    \   PowerManager.SCREEN_DIM_WAKE_LOCK, \"My Tag\");\n\nw.acquire();\n// ..screen\
    \ will stay on during this section..\nwl.release();\n```\n\n- Declare this permission\
    \ in the application section of AndroidManifest.xml:\n<uses-permission android:name=\"\
    android.permission.WAKE_LOCK\" />\n"
  mdcn: "\n\n## 音频库的命名\n\n- 音频库像正常一样放在 /system/lib/hw 中\n- 命名格式为：\n  - audio.<type>.<hardware/etc>.so\n\
    \  - 其中 <type> 为 'primary'、'a2dp'、'usb' 等\n  - 必须有一个 primary（主）实现\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_432_0.png)\n\
    \n## LF315 深度解析 Android：Android 内部原理简介\n\n## 示例\n\n- 在 Galaxy Nexus 上：\n  ls /system/lib/hw/audio*\n\
    \  audio.a2dp.default.so\n  audio.primary.default.so\n  audio.primary.tuna.so\n\
    \  audio.usb.default.so\n  audio_policy.default.so\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_433_0.png)\n\
    \n## tinyalsa\n\n- 预期是实现使用 ALSA 驱动\n- libtinyalsa.so 中提供了辅助函数用于连接\n  - 混音器和流参数\n\
    \  - external/tinyalsa\n  - 产生 /system/lib/libtinyalsa.so\n\n## 测试\n\n- 播放简单音频\n\
    \  # tinyplay testfile.wav\n- 录制简单音频\n  # tinycap testfile.wav\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_435_0.png)\n\
    \n## 第 17 节音频与视觉\n\n## ALSA 混音器设置\n\n- 初始混音器设置可以在\n  /system/etc/mixer_paths.xml\
    \ 中定义\n- 在设备目录中查找示例\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_436_0.png)\n\n\
    ## LF315 深度解析 Android：Android 内部原理简介\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_437_0.png)\n\
    \n- MediaPlayer 是播放和采集音频/视频的整体框架\n- MediaPlayerService 实现了服务端元素\n- StagefPlayer\
    \ 是播放引擎，包括\n  - AwesomePlayer：文件和网络播放\n  - OMXCodec：OpenMAX（参见 http://www.chronos.org/openmax/）\n\
    \n这些组件源码位于：\n- MediaPlayer: frameworks/base/media/java/android/media/MediaPlayer.java\n\
    - MediaPlayerService: frameworks/av/media/libmediayer/MediaPlayerService.cpp\n\
    - StagefPlayer: frameworks/av/media/libmediayer/StagefPlayer.cpp\n- AwesomePlayer:\
    \ frameworks/av/media/libstagef/AwesomePlayer.cpp\n- OMXCodec: frameworks/av/media/libstagef/OMXCodec.cpp\n\
    \n## 第 17 实验\n\n练习 17.1 本节没有实验\n\n## LF315 深度解析 Android：Android 内部原理简介\n\n## 大纲\n\
    \n## 第 18 节：资源管理\n\n- 低内存处理\n- 唤醒锁 (Wake locks)\n- 应用唤醒锁\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_439_0.png)\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_439_1.png)\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_439_2.png)\n\
    Copyright © 2013 Linux Foundation. 版权所有。允许发行。\n\n## 低内存处理\n\n- 在 Android 中，低内存是生活的常态\n\
    - 在大多数实现中，低内存是不寻常且很少被处理\n- Android 应用在 onDestroy() 之后仍然存在于内存中\n- 低内存处理程序负责杀死不再需要的应用程序\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_440_0.png)\n\n## LF315 深度解析 Android：Android\
    \ 内部原理简介\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_441_0.png)\n\n- 每个进程都有一个参数\
    \ oom_adj\n- 取值范围为 -16 到 +15\n- 当内存低时，低内存驱动程序将向高 oom_adj 值的进程发送 SIGKILL\n- oom_adj\
    \ 可以通过 /proc/<pid>/oom_adj 查看\n\n## ActivityManager 和 oom_adj\n\n- oom_adj 的值随着应用组件经历生命周期而变化\n\
    - 级别定义如下：\n```\nFOREGROUND_APP_ADJ 0\nVISIBLE_APP_ADJ 1\nPERCEPTIBLE_APP_ADJ 2\n\
    HEAVY_WEIGHT_APP_ADJ 3\nSECONDARY_SERVER_ADJ 4\nBACKUP_APP_ADJ 5\nHOME_APP_ADJ\
    \ 6\nHIDDEN_APP_MIN_ADJ 7\nEMPTY_APP_ADJ 15\n```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_442_0.png)\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_442_1.png)\nCopyright © 2013 Linux Foundation.\
    \ 版权所有。允许发行。\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_442_2.png)\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_442_3.png)\n\
    \n## lowmmemory 内核驱动\n\n- 提高了对低内存情况的反应\n- 比传统的“内存溢出 (Out-of-Memory)”更好，后者生效太晚\n\
    - lowmmemory 驱动根据 oom_adj 设置多个阈值\n- 杀死处于阈值下的进程\n\n## 第 18 节资源管理\n\n## 阈值\n\n该表显示了典型的页数和\
    \ MiB 以及对应的 oom_adj 值：\n\n| 页数 (Pages) | MiB | oom_adj |\n| :--- | :--- | :---\
    \ |\n| 2048 | 8 | 0 |\n| 3072 | 12 | 1 |\n| 4096 | 16 | 2 |\n| 6144 | 24 | 4 |\n\
    | 7168 | 28 | 7 |\n| 8192 | 32 | 15 |\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_444_0.png)\n\
    它们在 frameworks/base/services/core/am/ProcessList.java 的 `updateOom()` 方法中调整。\n\
    \n## LF315 深度解析 Android：Android 内部原理简介\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_445_0.png)\n\
    Copyright © 2013 Linux Foundation. 版权所有。允许发行。\n\n## 唤醒锁 (Wake locks)\n\n- 某些子系统需要唤醒锁才能正常工作\n\
    - 以防止系统进入睡眠模式\n- 内核 API 为：\n```\n#include <linux/wakock.h>\nwake_init(struct wakock\
    \ *lock, int type, const char *name);\n\nvoid wake_lock(struct wakock *lock);\n\
    ```\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_446_0.png)\n\n## 唤醒锁引起的问题\n\n\
    - 唤醒锁在内核代码中侵入性很强\n- Android 中的许多组件都需要获取唤醒锁\n\n通过两个文件：\n- /sys/power/wakock - 向此文件写入字符串创建唤醒锁\n\
    - /sys/power/unlock - 向此文件写入相同的字符串释放唤醒锁\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_448_0.png)\n\
    因此防止系统睡眠的简单方法是创建唤醒锁：\necho testwakock > /sys/power/wakock\n\n## PowerManager 和唤醒锁\n\
    \n- PowerManager 服务为唤醒机制提供了更高层级的 API\n- 增加了设置屏幕和键盘级别的参数\n- 步骤如下：\n  - 获取 Power\
    \ 服务句柄\n  - 创建唤醒锁并指定屏幕、超时等标志\n  - 获取唤醒锁\n  - 在不睡眠的情况下执行（例如播放音乐）\n  - 释放唤醒锁\n\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_449_0.png)\n\n## PowerManager 唤醒锁类型\n\
    \n| 类型 | CPU | 屏幕 | 键盘 |\n| :--- | :--- | :--- | :--- |\n| PARTIAL_WAKE_LOCK |\
    \  | 关闭 | 关闭 |\n| SCREEN_DIM_WAKE_LOCK |  | 变暗 | 关闭 |\n| SCREEN_BRIGHT_WAKE_LOCK\
    \ |  | 亮起 | 关闭 |\n| FULL_WAKE_LOCK |  | 亮起 | 开启 |\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_450_0.png)\n\
    ![](img/c6f4acfaca4829cadfb14f4d738cba2c_450_1.png)\n\n## 唤醒锁示例\n\n```java\nPowerManager\
    \ pm = (PowerManager) getSystemService(\n    Context.POWER_SERVICE);\n\nPowerManager.WakeLock\
    \ wl = pm.newWakeLock(\n    PowerManager.SCREEN_DIM_WAKE_LOCK, \"My Tag\");\n\n\
    wl.acquire();\n// ..在此期间屏幕将保持开启..\nwl.release();\n```\n\n- 在 AndroidManifest.xml\
    \ 的应用部分中声明此权限：\n<uses-permission android:name=\"android.permission.WAKE_LOCK\"\
    \ />\n\n"
