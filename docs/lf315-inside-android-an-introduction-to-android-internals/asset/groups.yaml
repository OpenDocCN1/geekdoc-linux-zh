    \ Surface for the application\n- There are two rendering paths\n  - Skia - a software\
    \ renderer\n  - HWUI - a hardware renderer\n- Which is used is a property of the\
    \ View\n  - android.view.setLayerType sets one of LAYER_TYPE_NONE, LAYER_TYPE_SOFTWARE,\
    \ LAYER_TYPE_HARDWARE\n\n## LF315 Inside Android: an Introduction to Android Internals\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_303_0.png)\n\n## Session 12 Graphics\
    \ and OpenGL\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_304_0.png)\n\n- JSR 239\
    \ is API for Java bindings to OpenGL ES\n- http://docs.oracle.com/javame/config/cldc/opt-pkgs/api/jb/jsr239/index.html\n\
    \n- EGL\n- javax.microedition.khronos.egl\n- EGL\n- EGL0\n- EGL1\n\n- OpenGL\n\
    - javax.microedition.khronos\n- GL\n- GL10\n- GL11\n\n## LF315 Inside Android:\
    \ an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_305_0.png)\n\
    \nCopyright © 2013 Linux Foundation.\nAll rights reserved.\n\n## Session 12 Graphics\
    \ and OpenGL\n\n## Graphics acceleration\n\n- The majority of platforms have a\
    \ Graphics Processing Unit (GPU)\n- Drivers are usually vendor-specific\n- The\
    \ majority of platforms have a framebuffer\n- EGL and OpenGL ES layers\n- The\
    \ highest numbered is tried first\n- EGL/libELES1/libGLES1\n- /lib/LES2/libGLES2\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_306_0.png)\n\n## LF315 Inside Android:\
    \ an Introduction to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_307_0.png)\n\
    \n## Session 12 Graphics and OpenGL\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_308_0.png)\n\
    \n- The egl.cfg file contains lines of the\n  - <display number> <implementation>\n\
    - And the libraries are:\n```\n0 0\n```\n- For example, the TI AM335 SoC has a\
    \ PowerVR SGX530 GPU\n- egl.cfg would contain\n```\n0 0\n```\n- And the libraries\
    \ required are:\n/system/lib/egl/libEGL.so\n/system/lib/egl/libGLES1.so\n/system/lib/egl/libGLES2.so\n\
    (Wait, corrected based on OCR context)\n\n## LF315 Inside Android: an Introduction\
    \ to Android Internals\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_309.png)\n\n\
    ## Device configuration\n\n- Add to BoardConfig.mk\n\n```\nBOARD_EGL_CFG := device/ti/bebone/egl.cfg\n\
    USE_OPENGL_RENDERER := true\n```\n\n- Copy the libraries to the right directories\n\
    - Either add the drivers to the kernel configuration or build as modules and add\
    \ to the system image\n\n## LF315 Inside Android: an Introduction to Android Internals\n\
    \n![](img/c6f4acfaca4829cadfb14f4d738cba2c_311_0.png)\n\n- Low level graphics\
    \ buffer handling is performed by hardware module **gralloc**\n- gralloc implements\
    \ two interfaces\n- framebuffer\n  - Maps display bitmap memory\n  - see hardware/libhardware/include/hardware/fb.h\n\
    - gralloc\n  - allocates and manage memory which is suitable for 2D and 3D graphics\
    \ usage\n  - see hardware/libhardware/include/hardware/gralloc\n\n## Kernel framebuffer\
    \ driver\n\n- The Linux framebuffer driver provides a standard interface to display\
    \ bitmap\n- Device /dev/fb0 (/dev/graphics/fb0 on Android)\n- ioctl functions\
    \ to read fixed parameters\n  - screen and buffer dimensions, etc.\n- ioctl functions\
    \ to read/write variable parameters\n  - e.g. to \"pan\" the display (determine\
    \ which part of the buffer is visible)\n- mmap function to map the buffer into\
    \ application addresses\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_312_0.png)\n"
  mdcn: "\n\n## 第 11 节 添加新包\n\n281\n\n```\n$ cd /\n$ sudo tar xf ~/embedded-android/resources/lab11/angstrom-eibc-i686-armv7a-v2012.05-toolchain.tar.bz\n\
    $ cd ~/embedded-android\n$ tar xf resources/lab11/busybox-1.20.1.tar.bz\n$ cd\
    \ busybox-1.20.1\n$ PATH=/usr/local/oorece-i686/sysroots/i686-angstromdk-linux/usr/bin/armv7a-android-linux-gnueababi:$PATH\n\
    $ export ARCH=arm\n$ export CROSS_COMPILE=arm-angstrom-linux-gnueababi-\n$ make\
    \ defconfig\n$ make\n$ make install\n```\n\n注意，在最后阶段 busybox 被安装到了 `_install`\
    \ 目录中。接下来，你需要将这些文件拷贝到 SD 卡中。你将在 Android 安装之后作为一个独立的阶段进行此。Busybox 将位于 `/system/gnu`，并且\
    \ `/bin`, `/sbin`, `/usr/bin`, `/usr/sbin` 和 `lib` 会指向该目录的符号链接。\n\n将 SD 卡插入读取器。在系统分区中创建一个名为\
    \ 'gnu' 的子目录。\n\n```\n$ sudo cp -a _install/* /media/system/gnu\n$ cp -a /usr/local/oorece-i686/sysroots/armv7a-angstrom-linux-gnueababi/lib\
    \ /media/system/gnu\n```\n\n## LF315 深入 Android：Android 内部原理\n\n向 `init.am335xvm.rc`\
    \ 添加以下行以创建符号链接并将 busybox 添加到路径\n\non init\n\n```\nsymlink /system/gnu/bin /bin\n\
    symlink /system/gnu/usr /usr/bin\nsymlink /system/gnu/usr/sbin /usr/sbin\nsymlink\
    \ /system/gnu/lib /lib\nexport PATH /sbin:/vendor/bin:/system/sbin:/system/bin:/system/xbin:/bin:/usr/bin:/usr/bin\n\
    ```\n\n编译 Android 并像以前一样将新的 ramdisk 拷贝到启动分区。\n\n启动 Beaglebone 并验证你是否可以使用 `grep,\
    \ cp`, `vi` 等 busybox 命令。\n\n## 第 12 节 图形与 OpenGL\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_292_0.png)\n\
    \n## 第 12 节：图形与 OpenGL\n\n- Android 和 OpenGL\n- EGL\n- 图形栈\n- 图形驱动\n- 设备配置\n\n\
    Copyright © 2013 The Linux Foundation. All rights reserved\n\n## LF315 深入 Android：Android\
    \ 内部原理\n\n## OpenGL 和 OpenGL ES\n\n- OpenGL 是用于 2D 和 3D 图形的跨平台 API\n- 由 Khronos\
    \ Group 发布的规范\n  - http://www.khronos.org/\n- OpenGL ES 是为嵌入式设备设计的 OpenGL 子集\n\
    - 例如，OpenGL ES 具有：\n  - 没有双精度浮点或长整数数据类型\n  - 没有四边形或多边形图元：使用三角形代替\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_293_0.png)\n\
    \n284\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_293_1.png)\n\n## 第 12 节 图形与\
    \ OpenGL\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_294_0.png)\n\nCopyright ©\
    \ 2013 The Linux Foundation. All rights reserved.\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_295_0.png)\n\
    \n- 所有版本的 Android 都支持 OpenGL ES\n- 从开始就支持 OpenGL ES 1.0/1.1 Common profile\n-\
    \ 从 API level 8 (Froyo) 开始支持 OpenGL ES 2.0\n- 你会在两个地方遇到 OpenGL：\n  - 在栈顶端作为 Java\
    \ API，它们松基于 Java JSR 239（但并非 100% 兼容）\n  - 在栈底部作为渲染图形的要手段\n\n## 第 12 节 图形与 OpenGL\n\
    \n## EGL\n\n- EGL 是 Khronos 原生平台图形接口\n- 描述 OpenGL ES（以及 OpenVG）如何与底层窗口系统交互\n \
    \ - 将表面映射到显示器\n  - 分配缓冲区\n  - 双缓冲和单缓冲表面\n  - 显示尺寸、色彩深度等\n\n## EGL 示例 (1)\n\n应用程序使用\
    \ EGL 分配窗口缓冲区，然后使用 OpenGL ES 在后缓冲区中绘制一帧\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_297_0.png)\n\
    \n## 第 12 节 图形与 OpenGL\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_298_0.png)\n\
    \n## LF315 深入 Android：Android 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_299_0.png)\n\
    \nCopyright © 2013 The Linux Foundation.\nAll rights reserved. DO NOT DISTRIBUTE.\n\
    \n## 第 12 节 图形与 OpenGL\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_300_0.png)\n\
    \n## LF315 深入 Android：Android 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_301_0.png)\n\
    \nCopyright © 2013 Linux Foundation. All rights reserved. DO NOT DISTRIBUTE.\n\
    \n## UI 组件\n\n- 典型的 UI 由按钮、菜单等组成\n- 这些每一个渲染到 Canvas 并成为应用程序的 Surface\n- 有两条渲染路径：\n\
    \  - Skia - 软件渲染器\n  - HWUI - 硬件渲染器\n- 使用的是 View 的一个属性\n  - android.view.setLayerType\
    \ 设置 LAYER_TYPE_NONE、LAYER_TYPE_SOFTWARE、LAYER_TYPE_HARDWARE\n\n## LF315 深入 Android：Android\
    \ 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_303_0.png)\n\n## 第 12 节 图形与\
    \ OpenGL\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_304_0.png)\n\n- JSR 239 是\
    \ Java 绑定 OpenGL ES 的 API\n  - http://docs.oracle.com/javame/config/cldc/opt-pkgs/api/jb/jsr239/index.html\n\
    - EGL\n  - javax.microedition.khronos.egl\n  - EGL\n  - EGL0\n  - EGL1\n- OpenGL\n\
    \  - javax.microedition.khronos\n  - GL\n  - GL10\n  - GL11\n\n## LF315 深入 Android：Android\
    \ 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_305_0.png)\n\nCopyright © 2013\
    \ Linux Foundation.\nAll rights reserved.\n\n## 第 12 节 图形与 OpenGL\n\n## 图形加速\n\
    \n- 大多数平台都有图形处理器 (GPU)\n- 驱动程序通常是厂商特定的\n- 大多数平台都有帧缓冲区 (framebuffer)\n- EGL 和 OpenGL\
    \ ES 层\n- 首先尝试编号最高的\n  - EGL/libELES1/libGLES1\n  - /lib/LES2/libGLES2\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_306_0.png)\n\
    \n## LF315 深入 Android：Android 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_307_0.png)\n\
    \n## 第 12 节 图形与 OpenGL\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_308_0.png)\n\
    \n- egl.cfg 文件包含：\n  - <显示器编号> <实现>\n- 库文件为：\n```\n0 0\n```\n- 例如，TI AM335 SoC\
    \ 有一个 PowerVR SG530 GPU\n- egl.cfg 将包含：\n```\n0 0\n```\n- 所需要的库：\n/system/lib/egl/libEGL.so\n\
    /system/lib/egl/libGLES1.so\n/system/lib/egl/libGLES2.so\n（根据 OCR 上文修正）\n\n##\
    \ LF315 深入 Android：Android 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_309.png)\n\
    \n## 设备配置\n\n- 添加到 BoardConfig.mk\n\n```\nBOARD_EGL_CFG := device/ti/bebone/egl.cfg\n\
    USE_OPENGL_RENDERER := true\n```\n\n- 将库拷贝到正确的目录\n- 将驱动程序添加到内核配置，或编译为模块并添加到系统镜像\n\
    \n## LF315 深入 Android：Android 内部原理\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_311_0.png)\n\
    \n- 低级图形缓冲区处理由硬件模块 **gralloc** 执行\n- gralloc 实现了两个接口\n- framebuffer\n  - 映射显示位图内存\n\
    \  - 见 hardware/libhardware/include/hardware/fb.h\n- gralloc\n  - 分配并管理适用于 2D\
    \ 和 3D 图形使用的内存\n  - 见 hardware/libhardware/include/hardware/gralloc\n\n## 内核 framebuffer驱动\n\
    \n- Linux framebuffer 驱动提供了显示位图的标准接口\n- 设备 /dev/fb0 (Android 上的 /dev/graphics/fb0)\n\
    - 用于读取固定参数的 ioctl 函数\n  - 屏幕和缓冲区尺寸等\n- 用于读写变量参数的 ioctl 函数\n  - 例如用于“平移”显示（确定缓冲区的可见部分）\n\
    - mmap 函数将缓冲区映射到应用程序地址\n\n![](img/c6f4acfaca4829cadfb14f4d738cba2c_312_0.png)\n"
