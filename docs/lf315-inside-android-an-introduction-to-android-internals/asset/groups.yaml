    \nAndroid key names are defined in android.view.KeyEvent. Note that the names\
    \ in the key layout file have been stripped of the KEYCODE_ prefix.\n\n## Policy\
    \ flags\n\n- WAKE and WAKE_DROPPED: Wake up the device\n- SHIFT: interpret as\
    \ shift\n- CAPS_LOCK: interpret as caps lock\n- ALT: interpret as alt\n- ALT_GR:\
    \ interpret as alt gray\n- FUNCTION: interpret as function key\n- VIRTUAL: this\
