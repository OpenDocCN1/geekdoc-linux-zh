    \    </node>\n</mx:XML>\n```\n\nListing 5.7 – Using the <mx:XML> tag to create\
    \ an XML object\n\n```actionscript\n<mx:Script>\n    <![CDATA[\n        public\
    \ var shapes:XML = <node\n            label='Shapes'><node label='Square' /><node\n\
    \                label='Rectangle' /><node label='Circle' /></node>;\n    ]]>\n\
    </mx:Script>\n```\n\nListing 5.8 – Using ActionScript to create an XML Object\n\
    \nIn the above listing, the Shapes node acts as the parent node to the Square,\
    \ Rectangle and Circle child nodes. Child nodes with no descendants are called\
    \ leaf nodes. An XML object must have a root node (Parent) which wraps up all\
    \ the defined child nodes for it to be a valid XML.\n\n### 5.3.3 XMLList\n\nAn\
    \ XMLList is similar to an XML object except for the fact that an XMLList object\
    \ doesn't need a root node to wrap up the descendant nodes. XMLList objects can\
    \ be created either by using MXML tags or by using ActionScript as seen in Listings\
    \ 5.9 and 5.10 respectively.\n\n```xml\n<mx:XMLList id=\"shapes\" >\n    <node\
    \ label=\"Square\" />\n    <node label=\"Rectangle\" />\n    <node label=\"Circle\"\
    \ />\n</mx:XMLList>\n```\n\nListing 5.9 – Using the <mx:XMLList> tag to create\
    \ an XMLList object.\n\n```actionscript\n<mx:Script>\n    <![CDATA[\n        public\
    \ var shapes:XMLList = <><node label='Square'/><node\n            label='Rectangle'\
    \ /><node label='Circle' /></>;\n    ]]>\n</mx:Script>\n```\n\nListing 5.10 –\
    \ Using ActionScript to create an XMLList object.\n\n### 5.3.4 Flex data management\
    \ classes\n\nFlex offers a set of data management classes called **collections**.\
    \ Collections can handle modifications, additions and deletions to data sets very\
    \ efficiently. Collections use the above discussed data types (Array, XML, XMLList,\
    \ etc). and manage user interface updates to reflect any changes to the underlying\
    \ data. In the next sections we discuss a couple of these collection classes with\
    \ examples.\n\n#### 5.3.4.1 ArrayCollection\n\nThe ArrayCollection class is a\
    \ wrapper class that exposes an Array as a collection and can be accessed and\
    \ manipulated using the methods and properties of the ICollectionView or IList\
    \ interfaces. To use DataBinding one needs to use the ArrayCollection class rather\
    \ than the Array class. ArrayCollection provides all the features of an Array\
    \ plus more. Every ArrayCollection class contains an Array as the data source.\
    \ The ArrayCollection and the underlying Array class are mainly used to display\
    \ flat data or linear data. ArrayCollection class can be created both by using\
    \ the MXML tags or the ActionScript class as shown in *Listings 5.11* and *5.12*\
    \ respectively.\n\n```xml\n<mx:ArrayCollection id=\"shapes\">\n    <mx:source>\n\
    \        <mx:Array id=\"ShapeArray\">\n            <mx:String>Rectangle</mx:String>\n\
    \            <mx:String>Square</mx:String>\n            <mx:String>Circle</mx:String>\n\
    \        </mx:Array>\n    </mx:source>\n</mx:ArrayCollection>\n```\n\nListing\
    \ 5.11 – Using the <mx:ArrayCollection> tag to create an ArrayCollection\n\n```actionscript\n\
    <mx:Script>\n    <![CDATA[\n        import mx.collections.ArrayCollection;\n \
    \       private var shapesArray:Array = [\"Square\", \"Rectangle\", \"Circle\"\
    ];\n        public var shapes:ArrayCollection;\n\n        private function createArrayCollection():void\n\
    \        {\n            shapes= new ArrayCollection();\n            shapes.source\
    \ = shapesArray;\n        }\n    ]]>\n</mx:Script>\n```\n"
  mdcn: "\n\n数据绑定是将一个对象（源）中的数据与另一个对象（目标）关联起来的过程。如图所示，当源对象发生变化时，通过触发事件，这些变化会自动反映到目标对象中。数据绑定提供了一种在应用程序不同层之间传递数据的便捷方式。它是生成代码、事件监听器和处理程序、错误捕获以及通过对象内省使用元数据的组合。在幕后，Flex\
    \ 会代你生成大量代码。\n\n## 5.2 实现数据绑定的方式\n\n在 Flex 中有多种实现数据绑定的方式：\n\n- 使用大括号（{}）语法\n-\
    \ 在大括号中使用 ActionScript 表达式\n- 在 MXML 中使用 `<mx:binding>` 标签\n- 在 ActionScript 中使用\
    \ **BindingUtils**\n\n### 5.2.1 大括号（{}）语法\n\n在下面的列表 5.1 中，一个文本控件从文本输入控件的属性获取数据。由于属性名位于大括号（{}）内，这意味着它是绑定表达式的源属性。每当源属性（myTextInput.text）发生变化时，Flex\
    \ 都会将源属性的当前值复制到目标属性，即文本控件的 text 属性（myTextDestination）。\n\n```xml\n<mx:TextInput\
    \ id=\"myTextInput\" editable=\"true\" enabled=\"true\"/>\n<mx:Text id=\"myTextDestination\"\
    \ text=\"{myTextInput.text}\"/>\n```\n\n列表 5.1 – 使用大括号（{}）语法进行数据绑定。\n\n### 5.2.2\
    \ 大括号（{}）中的 ActionScript 表达式\n\n大括号还可以包含 ActionScript 表达式。例如，它们可以包含对可绑定属性的计算和字符串连接。下列列表\
    \ 5.2 说明了这种情况。\n\n```xml\n<mx:Model id=\"myBinding\">\n    <myBinding>\n     \
    \   <!-- Perform string concatenation. -->\n        <a>This is {nameInput.text}</a>\n\
    \        <!-- Perform a calculation. -->\n        <b>{(Number(numberInput.text)\
    \ as Number) + 100}</b>\n    </myBinding>\n</mx:Model>\n<mx:Panel width=\"100%\"\
    \ height=\"100%\" title=\"Binding expressions\">\n    <mx:Form>\n        <mx:FormItem\
    \ label=\"Name:\">\n            <mx:TextInput id=\"nameInput\"/>\n        </mx:FormItem>\n\
    \        <mx:FormItem label=\"Enter a number:\">\n            <mx:TextInput id=\"\
    numberInput\" text=\"0\"/>\n        </mx:FormItem>\n    </mx:Form>\n    <mx:Text\
    \ text=\"{'Concatenation: ' + myBinding.a}\"/>\n    <mx:Text text=\"{'Calculation:\
    \ 100 + ' + numberInput.text+' = ' + myBinding.b}\"/>\n</mx:Panel>\n```\n\n列表\
    \ 5.2 – 在大括号（{}）中使用 ActionScript 进行数据绑定。\n\n### 5.2.3 MXML 中的 <mx:binding> 标签\n\
    \n`<mx:Binding>` 标签可作为大括号语法的替代方案使用。可以使用 `<mx:binding>` 标签的 source 属性提供源属性，并使用\
    \ destination 属性指定目标属性。`<mx:binding>` 标签还允许将一个源属性绑定到多个目标属性，或将多个源属性绑定到一个目标属性。我们也可以在\
    \ `<mx:binding>` 标签的 source 属性内部使用大括号（{}）。下列列表 5.3 提供了在 MXML 中使用 `<mx:binding>`\
    \ 标签的示例。\n\n```xml\n<mx:Panel title=\"Data Binding Using mx Binding Tag\">\n \
    \   <mx:TextInput id=\"myTextInput\" editable=\"true\" enabled=\"true\"/>\n  \
    \  <mx:Text id=\"myText\" />\n</mx:Panel>\n<mx:Binding\n    source=\"myTextInput.text\"\
    \n    destination=\"myText.text\"\n/>\n```\n\n列表 5.3 – 使用 `<mx:binding>` 标签进行数据绑定。\n\
    \n### 5.2.4 ActionScript 中的绑定\n\n也可以使用 mx.binding.utils.BindingUtils 类在 ActionScript\
    \ 中实现数据绑定。我们可以使用 bindProperty() 方法或 bindSetter() 方法来完成数据绑定。这在下方的列表 5.4 中有所说明。\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<mx:Application xmlns:mx=\"\
    http://www.adobe.com/2009/mxml\" width=\"200\"\n    height=\"200\" initialize=\"\
    initializeHandler();\" >\n    <mx:Script>\n        <![CDATA[\n        import mx.binding.utils.BindingUtils;\n\
    \        private function initializeHandler():void\n        {\n            BindingUtils.bindProperty(myText,\
    \ \"text\", myTextInput, \"text\");\n        }\n        ]]>\n    </mx:Script>\n\
    \    <mx:Panel\n        title=\"Data Binding Using Action Script\"\n    >\n  \
    \      <mx:TextInput id=\"myTextInput\" editable=\"true\" enabled=\"true\"/>\n\
    \        <mx:Text id=\"myText\" />\n    </mx:Panel>\n</mx:Application>\n```\n\n\
    列表 5.4 – 在 ActionScript 中使用 BindingUtils 实现数据绑定\n\n## 5.3 数据存储结构和机制\n\n数据结构是原生的\
    \ Flash 数据类型，如 **Array**、**XML**、**XMLList**，或者 Flex 的任何数据集合，如 **ArrayCollection**\
    \ 或 **XMLListCollection**。这些通常用于 ListBase 类的 **dataProvider** 属性中。ListBase 类（mx.controls.ListClasses.ListBase）是数据驱动控件的父类，它允许你在\
    \ Flex 应用程序中与数据进行交互。\n\n### 5.3.1 Array\n\n**Array** 是一种可以通过索引访问元素的数据结构。Array\
    \ 类提供了一种有用的数据存储和检索机制。数组可以通过使用 MXML 标签或使用 ActionScript 来创建，如 *Listings 5.5* 和 *5.6*\
    \ 分别所示。\n\n```xml\n<mx:Array id=\"shapes\">\n    <mx:String>Square</mx:String>\n\
    \    <mx:String>Rectangle</mx:String>\n    <mx:String>Circle</mx:String>\n</mx:Array>\n\
    ```\n\n列表 5.5 – 使用 `<mx:Array>` 标签创建 Array。\n\n```actionscript\n<mx:Script>\n\
    \    <![CDATA[\n        public var colors:Array = [\"Square\", \"Rectangle\",\
    \ \"Circle\"];\n    ]]>\n</mx:Script>\n```\n\n列表 5.6 – 使用 ActionScript 创建 Array。\n\
    \n### 5.3.2 XML\n\n可以在 Flash 中创建 XML 对象来存储 XML 数据。XML 对象可以通过使用 MXML 标签或使用 ActionScript\
    \ 来创建，如 List 5.7 和 5.8 分别所示。\n\n```xml\n<mx:XML id=\"shapes\" >\n    <node label=\"\
    Shapes\">\n        <node label=\"Square\" />\n        <node label=\"Rectangle\"\
    \ />\n        <node label=\"Circle\" />\n    </node>\n</mx:XML>\n```\n\n列表 5.7\
    \ – 使用 `<mx:XML>` 标签创建 XML 对象\n\n```actionscript\n<mx:Script>\n    <![CDATA[\n\
    \        public var shapes:XML = <node\n            label='Shapes'><node label='Square'\
    \ /><node\n                label='Rectangle' /><node label='Circle' /></node>;\n\
    \    ]]>\n</mx:Script>\n```\n\n列表 5.8 – 使用 ActionScript 创建 XML 对象\n\n在上面的列表中，Shapes\
    \ 节点充当 Square、Rectangle 和 Circle 子节点的父节点。没有后代的子节点称为叶节点。XML 对象必须有一个根节点（Parent）来包裹所有定义的子节点，才能成为有效的\
    \ XML。\n\n### 5.3.3 XMLList\n\nXMLList 与 XML 对象类似，不同之处在于 XMLList 对象不需要根节点来包裹后代节点。XMLList\
    \ 对象可以通过使用 MXML 标签或使用 ActionScript 来创建，如 Listings 5.9 和 5.10 分别所示。\n\n```xml\n\
    <mx:XMLList id=\"shapes\" >\n    <node label=\"Square\" />\n    <node label=\"\
    Rectangle\" />\n    <node label=\"Circle\" />\n</mx:XMLList>\n```\n\n列表 5.9 –\
    \ 使用 `<mx:XMLList>` 标签创建 XMLList 对象。\n\n```actionscript\n<mx:Script>\n    <![CDATA[\n\
    \        public var shapes:XMLList = <><node label='Square'/><node\n         \
    \   label='Rectangle' /><node label='Circle' /></>;\n    ]]>\n</mx:Script>\n```\n\
    \n列表 5.10 – 使用 ActionScript 创建 XMLList 对象。\n\n### 5.3.4 Flex 数据管理类\n\nFlex 提供了一组称为\
    \ **collections**（集合）的数据管理类。集合可以非常高效地处理对数据集中的修改、添加和删除。集合使用上述讨论的数据类型（Array、XML、XMLList\
    \ 等），并管理用户界面更新以反映底层数据的变化。在下面的部分中，我们将通过示例讨论其中几个集合类。\n\n#### 5.3.4.1 ArrayCollection\n\
    \nArrayCollection 类是一个包装类，它将 Array 作为集合暴露出来，并可以使用 ICollectionView 或 IList 接口的方法和操作来访问和操作。要使用\
    \ DataBinding，需要使用 ArrayCollection 类而不是 Array 类。ArrayCollection 提供了 Array 的所有功能以及更多功能。每个\
    \ ArrayCollection 类都包含一个作为数据源的 Array。ArrayCollection 类和底层的 Array 类主要用于显示扁平数据或线性数据。ArrayCollection\
    \ 类可以通过使用 MXML 标签或 ActionScript 类来创建，如 *Listings 5.11* 和 *5.12* 分别所示。\n\n```xml\n\
    <mx:ArrayCollection id=\"shapes\">\n    <mx:source>\n        <mx:Array id=\"ShapeArray\"\
    >\n            <mx:String>Rectangle</mx:String>\n            <mx:String>Square</mx:String>\n\
    \            <mx:String>Circle</mx:String>\n        </mx:Array>\n    </mx:source>\n\
    </mx:ArrayCollection>\n```\n\n列表 5.11 – 使用 `<mx:ArrayCollection>` 标签创建 ArrayCollection\n\
    \n```actionscript\n<mx:Script>\n    <![CDATA[\n        import mx.collections.ArrayCollection;\n\
    \        private var shapesArray:Array = [\"Square\", \"Rectangle\", \"Circle\"\
    ];\n        public var shapes:ArrayCollection;\n\n        private function createArrayCollection():void\n\
    \        {\n            shapes= new ArrayCollection();\n            shapes.source\
    \ = shapesArray;\n        }\n    ]]>\n</mx:Script>\n```\n\n"
