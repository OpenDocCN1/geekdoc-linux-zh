    # Chapter 5 - Binding data between controls


    The Flex framework provides a robust structure built to maximize the facilitation
    of component-driven architectures. In the MVC (Model-View-Controller) architecture,
    the view and the controller are tied to the behavior of the model. In Component
    driven architecture, this approach is not feasible. In this case the user interface
    (UI) elements are built before the model, to provide reusability of the components
    across many different applications. In Flex we achieve this with what is called
    data binding.


    In this chapter you will learn about:


    +   Data binding

    +   Different ways of data binding

    +   Data binding and storage mechanisms

    +   Data binding and UI controls


    # 5.1 Data binding – The big picture


    Data binding is a very interesting concept in Flex. It enables you to manage data
    more efficiently on the client side. Figure 5.1 provides an overview of data binding.


    ![](img/c4119654311ebf24679359ca130a5ee6_96_0.png)'
