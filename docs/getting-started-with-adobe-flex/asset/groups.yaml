    # ### 1.5.5 Adobe Flex and Microso ft Silverlight


    Microso ft Silverlight is a framework that provides support for rich Web content
    development by compiling XAML, an XML based interface description language. Silverlight
    framework is compiled and turned into XAP file to be executed by the Silverlight
    plug-in. It also offers cross platform compatibility.


    Flex applications work in a similar way using the Flash plug-in. However, Adobe
    Flex is an open source framework, while Silverlight is owned by Microso ft. This
    poses the same arguments of working with a proprietary versus and open source
    software. In the case of Adobe Flex, the numbers of third party Flex components
    are increasing quickly with contributions from the open source community.


