    # B


    # ## Appendix B – Up and running with DB2


    This appendix is a good foundation for learning about DB2. This appendix is streamlined
    to help you get up and running with DB2 quickly and easily.


    In this appendix you will learn about:


    +   - DB2 packaging

    +   - DB2 installation

    +   - DB2 Tools

    +   - The DB2 environment

    +   - DB2 configuration

    +   - Connecting to a database

    +   - Basic sample programs

    +   - DB2 documentation


    > > **Note:**

    > > For more information about DB2, refer to the free e-book *Getting Started
    with DB2 Express-C* that is part of this book series.


    # ### B.1 DB2: The big picture


    DB2 is a data server that enables you to safely store and retrieve data. DB2 commands,
    XQuery statements, and SQL statements are used to interact with the DB2 server
    allowing you to create objects, and manipulate data in a secure environment. Different
    tools can be used to input these commands and statements as shown in *Figure B.1*.
    This figure provides an overview of DB2 and has been extracted from the *Getting
    Started with DB2 Express-C* e-book.'
