  mdcn: "\n\n## 4.3 容器\n\nFlex 容器大致可以分为三种类型：应用程序容器、布局容器和导航容器。将在以下章节中通过具体示例解释每种类型。\n\
    \n### 4.3.1 应用程序容器\n\n应用程序容器是 Flex 内容或组件的默认容器——只要你创建了一个新的*应用程序*，该容器就会随之创建。\n\n\
    在 Eclipse 的 Flex 透视图中，选择一个现有的 Flex 项目或创建一个新项目。右键单击该项目，并选择*新建* -> *MXML 应用程序*。此时会出现一个小窗口。在*文件名*字段中输入应用程序的名称。将其命名为*FlexComponent*。*图\
    \ 4.5* 中所示的视图将显示出来。\n\n![](img/c4119654311ebf24679359ca130a5ee6_78_0.png)\n\n\
    如果单击源代码视图，将显示*清单 4.1* 中生成的代码。\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
    ?>\n<mx:Application xmlns:mx=\"http://www.adobe.com/2006/mxml\"\n\tlayout=\"absolute\"\
    >\n</mx:Application>\n```\n\n**清单 4.1** – 定义应用程序时默认生成的代码\n\n虽然你可以仅使用应用程序容器来构建应用程序，但这并不是一种好的做法。你在使用应用程序中的任何控件之前，应该先放置其他合适的容器。\n\
    \n默认情况下，应用程序容器的大小即为浏览器的大小。你可以通过指定高度和宽度属性来更改应用程序的相对大小；这样应用程序会根据浏览器大小按比例调整自身大小。\n\
    \n应用程序容器有几个重要的样式属性：\n\n- * backgroundColor：此颜色在应用程序加载和初始化期间可见\n- * backgroundGradientAlphas：控制背景的透明度\n\
    - * backgroundGradientColors：颜色从第一个到第二个变化；从上到下逐渐变化，如给定的 [顶部颜色, 底部颜色]\n- * backgroundImage：应用程序背景图像\n\
    \n在开始添加控件之前，你应该在应用程序容器中绘制一个面板或表单容器。例如，*清单 4.2* 中的代码将为你要构建的公司网站放置一个面板。\n\n```xml\n\
    <mx:Application xmlns:mx=\"http://www.adobe.com/2006/mxml\" width=\"100%\"\nheight=\"\
    100%\">\n<mx:Panel title=\"My Company's Web site\" width=\"100%\" height=\"100%\"\
    \nfontSize=\"30\">\n</mx:Panel>\n</mx:Application>\n```\n\n**清单 4.2** – 在应用程序内定义面板容器\n\
    \n运行程序，你将看到*图 4.6* 中所示的输出：\n\n![](img/c4119654311ebf24679359ca130a5ee6_79_0.png)\n\
    \n**图 4.6** – 示例应用程序的输出\n\n应用程序容器的其他一些特性包括：\n\n- 对于由 `<mx:Application>` 标签定义的每个应用程序容器，都有一个与之关联的应用程序对象。可以在\
    \ Flex 应用程序的任何地方使用 mx.core.Application.application 引用该应用程序对象。\n- Application 类支持一种预加载器，该预加载器使用下载进度条来显示应用程序\
    \ SWF 文件的下载进度。这一点将在练习部分详细讨论。\n\n### 4.3.2 布局容器\n\n布局容器是在 Flex 应用程序运行时渲染在 Flash\
    \ 播放器上的矩形区域。它控制其内部子容器和所绘控件的大小和位置。你可以将布局容器视为其他控件和容器的占位符。*表 4.1* 列出了 Flex 3.0 中的布局容器。\n\
    \n| 容器名称 | 用途/描述 |\n|---|---|\n| Canvas | 需要对其子组件进行特定定位（非自动定位）的矩形区域 |\n| Box |\
    \ 组件水平或垂直放置的矩形布局 |\n| HBox | |\n| VBox | |\n| ControlBar | 用于 Panel 或 TileWindow\
    \ 中的容器，它保存与父组件中其他子组件共享的组件 |\n| ApplicationControlBar | 容器，保存提供应用程序导航控件访问权限的组件\
    \ |\n| DividedBox | |\n| HDividedBox | |\n| VDividedBox | |\n| Form | 表单是最常用的容器，允许验证、数据绑定以及样式表的使用。FormHeading\
    \ 是 FormItem 组件的可选标题组。FormItem 是一个具有单个标签和一个或多个子组件的特定表单元素 |\n| FormHeading | |\n\
    | FormItem | |\n| Grid | Grid 布局容器将其子组件排列成行和列 – 类似于 HTML 表格 |\n| Panel | Panel\
    \ 布局容器由标题栏、标题、边框、内容区域和状态区域组成 |\n| Tile | Tile 布局容器，将子组件水平或垂直对齐排列。所有包含的单元格大小相同。\
    \ |\n| TileWindow | 针对用作弹出窗口的 TileWindow 布局容器进行了优化 |\n\n**表 4.1** – Flex 中的布局容器\n\
    \n**注意：**\n在上述及随后的表格中，有些容器没有关联的图标。例如，Box – 通常如果存在子类（例如本例中的 HBox），它们会被默认替换。在某些情况下，一些控件只能由\
    \ ActionScript 渲染 – 没有等效的 MXML，例如 Menu。简而言之，你不能拖放这些控件 – 你只能使用 ActionScript 创建它们。\n\
    \n### 4.3.3 导航容器\n\n导航容器容纳其他容器，以便你能够在其子项之间进行导航。\n*表 4.2* 包含 Flex 3 中导航容器的列表。\n\
    \n| 容器名称 | 用途/描述 |\n|---|---|\n| ViewStack | 此容器由一组堆叠在彼此上方的子容器组成。一次只能有一个子项可见或处于活动状态。\
    \ |\n| TabNavigator | 此容器创建、保存和管理一组选项卡 – 每个选项卡又可以容纳其他容器。 |\n| Accordion | 此容器定义并保存一组子活动容器，一次只有一个容器完全可见\
    \ |\n\n**表 4.2** – Flex 中的导航容器\n\n下一节将展示上述容器的一些示例。为了说明目的，我们将使用下一节中描述的一些控件。\n\n\
    要查看上述容器中的一些实际运行效果，让我们继续之前的示例：\n\n1. 选择一个 HDividedBox 容器并将其放入应用程序容器内部。\n2. 在左侧放置一个\
    \ Accordion 容器。\n3. 在 HDividedBox 容器的右侧放置一个 TabNavigator 容器。\n4. 在 TabNavigator\
    \ 容器内部绘制三个 Canvas 容器。\n\n我们将调整容器的一些简单属性，以便它们能够在屏幕上良好适配，从下面*清单 4.3* 中显示的生成的 MXML\
    \ 代码开始。\n\n```xml\n<?xml version=\"1.0\"?>\n<!-- containers\\application\\AppSizePercent.mxml\
    \ -->\n<mx:Application xmlns:mx=\"http://www.adobe.com/2006/mxml\" width=\"100%\"\
    \nheight=\"100%\">\n<mx:Panel title=\"My Company's Web site\" width=\"100%\" height=\"\
    100%\"\nfontSize=\"30\">\n<mx:HDividedBox width=\"100%\" height=\"95%\">\n<mx:Accordion\
    \ x=\"40\" y=\"32\" width=\"15%\" height=\"100%\"\nmaxWidth=\"300\">\n<mx:Canvas\
    \ label=\"Accordion Pane 1\" width=\"100%\" height=\"100%\">\n</mx:Canvas>\n</mx:Accordion>\n\
    <mx:TabNavigator width=\"85%\" height=\"100%\">\n<mx:Canvas label=\"Tab 1\" width=\"\
    100%\" height=\"100%\">\n</mx:Canvas>\n<mx:Canvas label=\"Tab 2\" width=\"100%\"\
    \ height=\"100%\">\n</mx:Canvas>\n</mx:TabNavigator>\n</mx:HDividedBox>\n</mx:Panel>\n\
    </mx:Application>\n```\n\n**清单 4.3** – 示例导航容器的代码\n\n该代码的输出如下所示：\n\n![](img/c4119654311ebf24679359ca130a5ee6_82_0.png)\n\
    \n**图 4.7** – 带有布局容器的示例应用程序输出\n\n你可以看到，使用很少的代码和很短的时间就能构建一个外观得体的网页非常方便。你可以更改 HDividedBox\
    \ 的左侧和右侧窗格的大小 – 你也可以在 Accordion 或 TabNavigator 内部导航不同的画布。\n\n## 4.4 控件\n\n控件是用户交互的\
    \ Flex 用户界面组件。控件始终放置在容器内部。所有控件和容器一样，都是 *mx.core.UIComponent* 的派生类，如下面的**图 4.8**\
    \ 所示。\n\n![](img/c4119654311ebf24679359ca130a5ee6_82_1.png)\n\n**图 4.8** – 按钮和级别控件的类层次结构\n\
    \n基于属性和用途，Flex 控件大致可以分为以下章节中描述的四个类别。\n\n### 4.4.1 基于文本的控件\n\n使用这些控件在你的 Flex 应用程序中显示和编辑文本及相关详细信息。除了\
    \ *RichTextEditor* 之外的所有控件都是简单控件。*RichTextEditor* 内部包含多个控件（TextArea、ControlBar\
    \ 和一些其他格式化控件）。**表 4.7** 列出了 Flex 3 中基于文本的控件。\n\n"
