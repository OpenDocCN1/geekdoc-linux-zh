    ![](img/c4119654311ebf24679359ca130a5ee6_211_0.png)


    On the left-hand side of the figure, we provide examples of different commands
    and statements that users can issue. In the center of the figure, we list some
    of the tools where you can input these commands and statements, and on the right-hand
    side of the figure you can see the DB2 environment; where your databases are stored.
    In subsequent sections, we discuss some of the elements of this figure in more
    detail.


    # B.2 DB2 Packaging


    DB2 servers, clients and drivers are created using the same core components, and
    then are packaged in a way that allows users to choose the functions they need
    for the right price. This section describes the different DB2 editions or product
    packages available.


    # B.2.1 DB2 servers


