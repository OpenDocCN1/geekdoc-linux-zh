    \    import mx.collections.XMLListCollection;\n    private var shapesXMLList:XMLList\
    \ = new XMLList(<><node label='Square'/>\n    <node label='Rectangle'/><node label='Circle'/></>);\n\
    \    private var shapes:XMLListCollection;\n    private function createXMLListCollection():void\n\
    \    {\n    shapes= new XMLListCollection();\n    shapes.source = shapesXMLList;\n\
    \    }\n    ]]>\n</mx:Script>\n```\n\n**Listing 5.14 - Using ActionScript to create\
    \ an XMLListCollection**\n\n# 5.4 Data Driven UI Controls\n\nData-driven controls\
    \ are key to any UI toolkit. Depending on whether the data is linear or hierarchical\
    \ in nature, Flex provides different kinds of UI Controls:\n\n- Scrolling List\
    \ controls\n- DataGrid controls\n- Hierarchical controls (Tree, Menu)\n\n# 5.4.1\
    \ Scrolling List controls\n\nThe Flex framework provides a simple set of List\
    \ controls that display items either vertically or horizontally with built-in\
    \ scrolling. These controls also provide single or multi-selection capabilities.\
    \ The List controls are often used to show numerous items in an organized fashion.\n\
    \nThere are three main types of Scrolling List controls:\n\n- List control\n-\
    \ HorizontalList control\n- TileList control\n\n# 5.4.1.1 List Control\n\nThe\
    \ List control is the simplest data-driven UI control that the Flex Framework\
    \ provides. The `mx.controls.List` class can be used in a Flex application by\
    \ using the `<mx:List />` MXML tag. The list control displays a vertical list\
    \ of items and provides a scrollbar if the full height of the list items is unlikely\
    \ to fit. The horizontal scrollbar is also optional. The user can select one or\
    \ more items from the list. Listing 5.15 shows an example of creating a list control\
    \ using the `<mx:List>` tag in combination with the ArrayCollection that we discussed\
    \ earlier.\n\n```xml\n<?xml version=\"1.0\"?>\n<mx:Application xmlns:mx=\"http://www.adobe.com/2006/mxml\"\
    >\n  <mx:ArrayCollection id=\"shapes\">\n    <mx:source>\n      <mx:Array id=\"\
    ShapeArray\">\n        <mx:String>Rectangle</mx:String>\n        <mx:String>Square</mx:String>\n\
    \        <mx:String>Circle</mx:String>\n        <mx:String>Octagon</mx:String>\n\
    \        <mx:String>Hexagon</mx:String>\n        <mx:String>Triangle</mx:String>\n\
    \      </mx:Array>\n    </mx:source>\n  </mx:ArrayCollection>\n  <mx:List id=\"\
    myList\" width=\"200\" height=\"100\" dataProvider=\"{shapes}\"/>\n</mx:Application>\n\
    ```\n\n**Listing 5.15 - Code snippet to create a List control**\n\nFigure 5.2\
    \ below shows the List control that is created. The ArrayCollection class acts\
    \ as the data provider for the List control.\n\n![](img/c4119654311ebf24679359ca130a5ee6_104_0.png)\n\
    \n**Figure 5.2 - List Control**\n\n# 5.4.1.2 HorizontalList control\n\nThe HorizontalList\
    \ control displays a horizontal list of items. It is particularly useful for displaying\
    \ a list of images. The `mx.controls.HorizontalList` class can be used in a Flex\
    \ application by using the `<mx:HorizontalList />` MXML tag. Listing 5.16 provides\
    \ a code snippet example that uses the `<mx:HorizontalList/>` MXML tag. Figure\
    \ 5.3 illustrates how the HorizontalList would look.\n\n```xml\n<mx:HorizontalList\
    \ id=\"myList\" width=\"200\" height=\"50\" dataProvider=\"{shapes}\"/>\n```\n\
    \n**Listing 5.16 - Code Snippet to create a HorizontalList control**\n\n![](img/c4119654311ebf24679359ca130a5ee6_104_1.png)\n\
    \n**Figure 5.3 - HorizontalList Control**\n\n# 5.4.1.3 TileList control\n\nThe\
    \ TileList control is similar to the List and HorizontalList controls as discussed\
    \ earlier except that it displays the item in a tile-like fashion and the direction\
    \ of the layout can be specified. The height and width of the individual tiles\
    \ can also be set by setting the width of the TileList columns or the height of\
    \ the TileList rows. The `mx.controls.TileList` class can be used in a Flex application\
    \ by using the `<mx:TileList />` MXML tag. Listing 5.17 provides a code snippet\
    \ example and Figure 5.4 illustrates how the horizontal TileList would look.\n\
    \n```xml\n<mx:TileList direction=\"horizontal\" dataProvider=\"{shapes}\" rowCount=\"\
    2\" rowHeight=\"100\"/>\n```\n\n**Listing 5.17 - Horizontal TileList in MXML**\n\
    \n![](img/c4119654311ebf24679359ca130a5ee6_105_0.png)\n\n**Figure 5.4 - Horizontal\
    \ TileList**\n\nListing 5.18 and Figure 5.5 provide the MXML and screenshot for\
    \ a vertical TileList component respectively.\n\n```xml\n<mx:TileList direction=\"\
    vertical\" dataProvider=\"{shapes}\" columnCount=\"2\" columnWidth=\"100\"/>\n\
    ```\n\n**Listing 5.18 - Vertical TileList in MXML**\n\n![](img/c4119654311ebf24679359ca130a5ee6_105_1.png)\n\
    \n**Figure 5.5 - Vertical TileList**\n\n# 5.4.2 DataGrid control\n\nDataGrid controls\
    \ are used to display more than one column of data. It is often used to display\
    \ large sets of information in a simple and clean user interface. DataGrid provides\
    \ resizable, sortable, and customizable column layouts, including hidable columns\
    \ and also provides support for paging through data and locked rows and columns\
    \ that do not scroll. The simplest DataGrid Control is `mx.controls.DataGrid`\
    \ which can be used in a Flex application by using the `<mx:DataGrid>` MXML tag.\
    \ Listing 5.19 provides the code snippet for a complex data object (single data\
    \ item having multiple fields) bound to a DataGrid control.\n\n```xml\n<mx:ArrayCollection\
    \ id=\"shapes\">\n    <mx:Object Shape=\"Rectangle\" No_Of_Sides=\"4\" Color=\"\
    Red\" />\n    <mx:Object Shape=\"Square\" No_Of_Sides=\"4\" Color=\"Yellow\" />\n\
    \    <mx:Object Shape=\"Diamond\" No_Of_Sides=\"4\" Color=\"Red\" />\n    <mx:Object\
    \ Shape=\"Octagon\" No_Of_Sides=\"8\" Color=\"Green\" />\n    <mx:Object Shape=\"\
    Triangle\" No_Of_Sides=\"3\" Color=\"Pink\" />\n    <mx:Object Shape=\"Hexagon\"\
    \ No_Of_Sides=\"6\" Color=\"Yellow\" />\n    <mx:Object Shape=\"Heptagon\" No_Of_Sides=\"\
    7\" Color=\"Green\" />\n    <mx:Object Shape=\"Pentagon\" No_Of_Sides=\"5\" Color=\"\
    Pink\" />\n    <mx:Object Shape=\"Nonagon\" No_Of_Sides=\"9\" Color=\"Yellow\"\
    \ />\n</mx:ArrayCollection>\n\n<mx:DataGrid dataProvider=\"{shapes}\" />\n```\n\
    \n**Listing 5.19 - Code Snippet to create a DataGrid using `<mx:DataGrid>` control.**\n\
    \n**Figure 5.6** below displays the created DataGrid.\n\n![](img/c4119654311ebf24679359ca130a5ee6_106_0.png)\n\
    \n**Figure 5.6 - Sample DataGrid**\n\n# 5.4.3 AdvancedDataGrid control\n\n**AdvancedDataGrid**\
    \ is a new feature in Adobe Flex 3 and is only offered with Flex Builder Professional.\
    \ The **AdvancedDataGrid** control has built-in support for aggregation and formatting.\
    \ It can also be used to create summary rows. We can create an **AdvancedDataGrid**\
    \ control in a Flex Application by using the `<mx:AdvancedDataGrid />` MXML Tag.\
    \ An **AdvancedDataGrid** takes a special data object for its **DataProvider**.\
    \ This data object is the **GroupingCollection** data object which transforms\
    \ flat data into hierarchical data. **Listing 5.20** below provides a sample code\
    \ snippet that illustrates how to use the **AdvancedDataGrid** with **GroupingCollection**.\n\
    \n```xml\n<mx:ArrayCollection id=\"sales\">\n    <mx:Object Region=\"Asia\" Country=\"\
    India\" Estimate=\"40000\" Actual=\"49000\" />\n    <mx:Object Region=\"Asia\"\
    \ Country=\"Japan\" Estimate=\"26345\" Actual=\"21346\" />\n    <mx:Object Region=\"\
    Asia\" Country=\"China\" Estimate=\"56325\" Actual=\"53235\" />\n    <mx:Object\
    \ Region=\"Asia\" Country=\"Singapore\" Estimate=\"21098\" Actual=\"26234\" />\n\
    \    <mx:Object Region=\"Europe\" Country=\"Germany\" Estimate=\"65435\" Actual=\"\
    54124\" />\n</mx:ArrayCollection>\n```\n"
