    \ Center\n\nPrior to DB2 9.7, the primary DB2 tool for database administration\
    \ was the Control Center, as illustrated in Figure B.4. This tool is now deprecated,\
    \ but still included with DB2 servers.\n\n![](img/c4119654311ebf24679359ca130a5ee6_215_0.png)\n\
    \n**Figure B.4 - The DB2 Control Center**\n\nTo start the Control Center on Windows\
    \ use *Start -> Programs -> IBM DB2 -> DB2COPY1 (Default) -> General Administration\
