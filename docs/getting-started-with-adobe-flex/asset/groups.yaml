    \ Flex 应用程序。\n\n# 2.7 复习问题\n\n- 1. Flex 应用程序是 HTML 应用程序吗？\n- 2. 与 HTML 相比，Flex\
    \ 有哪些局限性？\n- 3. Flex 应用程序如何在性能上优于 HTML 应用程序？\n- 4. 如何更改添加到 Flex 应用程序中的组件的属性？\n\
    - 5. 如何查看与组件相关的各种属性？\n- 6. 从下表中选择免费的 Flex 组件：\n    - A. Flex SDK\n    - B. Flex\
    \ Framework\n    - C. Flex Builder\n    - D. Life Cycle Data Services\n    - E.\
    \ 以上都不是\n- 7. 从下表中选择需要授权的 Flex 组件：\n    - A. Flex SDK\n    - B. Flex Framework\n\
    \    - C. Flex Builder\n    - D. Life Cycle Data Services\n    - E. 以上都不是\n- 8.\
    \ 在以下哪个窗口中，你可以看到特定应用程序使用的组件？\n    - A. Console\n    - B. Component\n    - C. Problems\n\
    \    - D. Outline\n    - E. 以上都不是\n- 9. 在 Flex 中可以创建哪种类型的项目？\n    - A. Flex\n\
    \    - B. ActionScript\n    - C. MXML\n    - D. Library\n    - E. 以上所有\n- 10.\
    \ 在编写 Flex 应用程序之前，需要掌握哪些软件语言？\n    - A. C++\n    - B. Java\n    - C. MXML\n  \
    \  - D. ActionScript\n    - E. 以上所有\n\n# 第 3 章 - MXML 和 ActionScript 简介\n\nMXML\
    \ 是 Flex 框架的核心。MXML 是一种基于 *XML*（可扩展标记语言）的标记语言，由 Adobe 创建，用于 Flex 平台。它像 HTML（超文本标记语言）一样易于阅读和编写，并且提供了\
    \ XML 的可扩展性。\n\nActionScript 是将 Flex 应用程序粘合在一起的工具。虽然 MXML 通常用于布局和结构化，但 ActionScript\
    \ 用于实现功能。构建强大的 Flex 应用程序的关键在于正确使用脚本、创建可重用代码、了解 ActionScript 的基础知识，以及最重要的是理解 MXML\
    \ 和 ActionScript 如何协同工作。\n\n在本章中，你将学习以下内容：\n\n- MXML\n- ActionScript\n\n## 3.1\
    \ MXML 和 ActionScript – 全局视角\n\n下方的 *图 3.1* 提供了 MXML 和 ActionScript 及其关系的全局视角。\n\
    \n![](img/c4119654311ebf24679359ca130a5ee6_55_0.png)\n\n**图 3.1 – Flex 框架架构 –\
    \ 全局视角**\n\n如图所示，Flex 框架使用两种语言：ActionScript 和 MXML。类库为两者都提供了 API，包括可视组件（如控件和容器）以及无界面组件（如远程服务对象）。\n\
    \n图 3.2 通过展示 MXML 编译过程来说明 MXML 和 ActionScript 之间的关系。\n\n![](img/c4119654311ebf24679359ca130a5ee6_55_1.png)\n\
    \n**图 3.2 – MXML 编译过程**\n\n如图中所示，开发者创建的每个 MXML 文件首先会被转换为一个 ActionScript 类（*.as*\
    \ 扩展名）。然后，Flex 编译器会处理该 *.as* 文件，将其转换为 *.swf* 文件（Macromedia Small Web Format，发音为\
    \ *swiff*）。该文件被称为字节码，可以嵌入任何 HTML 或 JSP 文件等。为了在浏览器中查看这些文件，必须预装 Flash Player。\n\n\
    ## 3.2 MXML\n\n在本节中，我们将讨论 MXML 和 XML 之间的关系、如何有效地编写 MXML 代码以及命名空间。Adobe 没有为 MXML\
    \ 这个缩写提供官方含义；然而，由于 Macromedia（被 Adobe 收购）开发了这门语言，有些人建议它代表 Macromedia Extensible\
    \ Markup Language（Macromedia 可扩展标记语言），而另一些人则更喜欢说它代表 Magic Extensible Markup Language（神奇可扩展标记语言）。\n\
    \n### 3.2.1 XML\n\nXML 代表 Extensible Markup Language（可扩展标记语言）。它是一种描述数据的语言，非常适合信息交换，无论平台如何。为了简单起见，你可以将\
    \ XML 文档视为带有标签的文本文档。例如，`<telephone>90542334</telephone>` 是一个 XML 文档。\n\n> **注意：**\n\
    > 如今你可以找到大量关于 XML 的资源。鉴于 XML 是 MXML 的基础，本书提供了一个非常简短的介绍。\n\nHTML 是一种用于描述如何显示数据的语言，而\
    \ XML 用于描述数据是什么。以下是两个简单的例子，第一个是 HTML，第二个是 XML：\n\n```html\n<b>Raul</b>\n```\n\
    ```xml\n<name>Raul</name>\n```\n\n你能看出它们在标签方面的区别吗？在第一种情况（HTML）中，标签 `<b>` 用于指示名字\
    \ Raul 应以粗体显示。在第二种情况（XML）中，标签 `<name>` 用于描述 Raul 是什么，即一个名字。\n\nXML 使用文档类型定义 (DTD)\
    \ 或 XML 模式定义 (XSD) 文档来描述标签的规则。例如，一条规则可以是标签 `<name>` 只能包含字符。这些规则也用于验证文档是否遵循预定义的结构；此过程称为\
    \ XML 验证。\n\nXML 的可扩展性来自于创建自定义标签的能力。这意味着你可以基于 XML 创建自己的词汇表。MXML 就是这样，它基本上是一个 XML\
    \ 词汇表，其中 Adobe 创建了一些特定标签来为 Flex 应用程序提供结构。\n\n就语法而言，当 XML 文档遵循由万维网联盟 (W3C) XML\
    \ 标准定义的语法规则时，它是一个格式良好的 XML 文档。例如，其中一些规则规定如下：\n\n- 所有开启的标签必须关闭 — 所有开启的标签，如 `<mx:Button>`，必须用结束标签如\
    \ `</mx:Button>` 进行关闭。如果开始标签和结束标签之间没有内容，如 `<mx:Button> </mx:Button>`，则可以简单地使用一个标签，如\
    \ `<mx:Button />`。\n- XML 区分大小写 — 这意味着大写字母和小写字母不被视为相同。因此 `<mx:Label1>` 和 `<mx:label1>`\
    \ 是不同的。\n\n就表现而言，给定一个 XML 文档，你可以轻松将其转换为媒体知道如何呈现的格式。例如，使用 XSLT（eXtensible Stylesheet\
    \ Language Transformation，可扩展样式表语言转换）将 XML 文档转换为 HTML 文档，以便数据可以在 Web 浏览器上准确显示。只需对同一\
    \ XML 文档应用不同的 XML 样式表，你就可以在浏览器上以不同的外观和感觉呈现内容数据。\n\n就导航而言，当你想要在 XML 文档中搜索特定内容时，你可以使用不同的语言，如\
    \ XQuery、XPath 和 SQL/XML。\n\n### 3.2.2 XML 标签的结构分析\n\n标签可以通过两种包含信息的方式，即通过内容或通过属性。内容就是位于开始标签和结束标签之间的文本。另一方面，属性是仅存在于开始标签中、用引号括起来的文本，并用于进一步描述该标签。例如：\n\
    \n```xml\n<mx:Label id=\"myLabel\" >\n\t<mx:text> Hello World!! </mx:text>\n</mx:Label>\n\
    ```\n\n在上面的例子中，`id` 是标签 `<mx:Label>` 的属性，而 `<mx:text>`（是的，你可以像 HTML 那样将一个标签嵌套在另一个标签内）是标签\
    \ `<mx:Label>` 的内容。\n\n同样的内容也可以写成：\n\n```xml\n<mx:Label id=\"myLabel\" text=\"\
    Hello World!!\"/>\n```\n\n因此，属性可以提供一种更紧凑且可读性更强的方式来表示相同的信息。\n\n不过，属性虽然更紧凑，但嵌套标签允许你表示更复杂的内容。它们对于插入无法使用属性表示的数据非常有用，如清单\
    \ 3.1 中所示的例子。\n\n```xml\n<mx:DataGrid>\n\t<mx:columns>\n\t\t<mx:DataGridColumn\
    \ headerText=\"Column 1\" dataField=\"col1\"/>\n\t\t<mx:DataGridColumn headerText=\"\
    Column 2\" dataField=\"col2\"/>\n\t\t<mx:DataGridColumn headerText=\"Column 3\"\
    \ dataField=\"col3\"/>\n\t</mx:columns>\n</mx:DataGrid>\n```\n\n**清单 3.1 - 带有嵌套标签的\
    \ XML 文档**\n\n"
