    \n## Figure 7.19 - Employee screen after selecting an employee\n\nThis application\
    \ can be further extended by adding the CRUD (Create, Update and Delete) functionality\
    \ and adding validations for each of the fields. Also the UI can be made more\
    \ elegant by using some stylesheet and other decorators. We encourage you to improve\
    \ and extend the application!\n\n## 7.6 Exercises\n\nThis section contains two\
    \ exercises. The first one will be used to create a Web application that invokes\
