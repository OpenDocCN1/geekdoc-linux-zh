    ## 第 1 章 – Adobe Flex 简介


    Adobe® Flex® 是一个用于开发富 Web 应用的免费开源框架，这些应用可以在所有主要浏览器、桌面和操作系统上一致地部署。本质上，它是 Adobe
    Systems 发布的一个软件开发工具包（SDK），允许 Web 开发者在 Flash® 平台上快速轻松地构建富互联网应用（RIAs）。


    Adobe Flex 旨在提供一个基于 Flash 的客户端富客户端，既可以运行在桌面上，也可以嵌入到 Web 页面中。其焦点仅针对客户端，与任何支持 HTTP
    的服务器技术进行异步数据交换。数据交换基于 XML，因此该产品不绑定于任何特定的通信框架或技术。服务器支持的技术包括 Java™ EE、Microsoft
    .NET 框架、PHP、Web 服务以及其他能够发送和接收 XML 数据的框架。


    在本章中，您 will 学习到：


    - Adobe Flex 的简要历史

    - Adobe Flex 的版本和发行版

    - Adobe Flex 社区和资源

    - 与 Adobe Flex 竞争的产品


    ### 1.1 Adobe Flex 的简要历史


    在描述 Adobe Flex 的历史之前，您需要了解导致富互联网应用框架开发的应用开发演变。图 1.1 说明了这种演变。


    ![](img/c4119654311ebf24679359ca130a5ee6_20_0.png)


    **图 1.1 – 应用开发的演变**


    > **注意：**

    > 由于本书专注于 Linux、UNIX、Windows 和 Mac 等分布式平台；因此不会讨论大型机应用。


    在 90 年代初，应用主要是为了在单独的桌面上运行而开发的。这些应用功能丰富且强大，允许用户和开发者执行操作系统允许的任何操作。然而，这些应用的主要缺点在于其部署模型：一方面，用户必须不断获取新的
    CD 来安装升级或补丁。另一方面，开发者必须考虑为不同客户端支持多个版本。这是因为每个用户都绑定于自己的应用程序副本，如 *图 1.2* 所示。


    ![](img/c4119654311ebf24679359ca130a5ee6_20_1.png)


    **图 1.2 – 桌面应用，每个用户都绑定于自己的副本**


    到了 90 年代中期，随着互联网技术热潮的兴起，Web 应用开始变得流行。在 *图 1.1* 中，它们被描绘为“传统”Web 应用，因为当时没有技术使这些应用变得丰富，即；灵活、引人入胜、包含视频和其他有趣的功能。Web
    应用运行在集中式计算机上。尽管传统 Web 应用并不丰富，但开发者发现这些应用部署增强和修复非常方便，因为 Web 应用部署在中央计算机上并由所有用户访问，如
    *图 1.3* 所示。更新只需在中央计算机上进行一次。


