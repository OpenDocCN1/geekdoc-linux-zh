    \ some different package, this could be done as shown in Listing 3.3 below using\
    \ import.\n\n```\n```\npackage com.example2\n{\n   import com.example1.Car;\n\
    \   public class Garage\n   {\n      private var car:Car;\n      private var numOfCars:uint;\n\
    \n      public function Garage()\n      {\n         car = null;\n         numOfCars\
    \ = 0;\n      }\n      public function getCar() {\n         return car;\n    \
    \  }\n   }\n}\n```\n```\n\nListing 3.3 – Using packages in class\n\nNow what is\
    \ the function getCar() in the above code snippet called? A function, that is\
    \ part of a class is called a method. Most of the classes that you will find in\
    \ ActionScript will have one or more methods and properties.\n\n# ### 3.3.6 [Bindable]\
    \ Tag\n\nIn ActionScript, a variable does not automatically transmit changes made\
    \ to its value, unless specified to do so. In order to accomplish that, the metadata\
    \ tag called [Bindable] is used.\n\nSimply put, a metadata tag is an instruction\
    \ to the ActionScript compiler. When the ActionScript compiler encounters this\
    \ tag, it makes the necessary code changes in the background so that changes to\
    \ the variable's value is propagated to the different parts of application where\
    \ it is being used.\n\nListing 3.4 shows you how to use the [Bindable] tag.\n\n\
    ```\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<mx:Application xmlns:mx=\"\
    http://www.adobe.com/2006/mxml\"\nlayout=\"absolute\">\n<mx:Script>\n    <![CDATA[\n\
    \        [Bindable]// 1\n        var myText=\"Welcome to the world of Flex\";\
    \ // 2\n```\n```"
  md: "\n## 3.2.3 Namespaces in MXML\n\nIn MXML, every tag is prefixed with an **mx**\
    \ followed by a colon. This is an XML namespace, stating that a tag belongs to\
    \ the **namespace mx**. Namespaces are used for providing uniquely named elements\
    \ and attributes in an XML instance. An XML can have more than one vocabulary\
    \ and if each vocabulary is given a distinct name, then the ambiguity between\
    \ the elements of different vocabulary with same name can be resolved by using\
    \ the namespace. A namespace is declared using a URI (Universal Resource Identifier)\
    \ as in the following:\n\n```\n<mx:Application xmlns:mx=\"http://www.adobe.com/2006/mxml\"\
    >\n```\n\nHere the namespace is **mx** and from there on, all the components defined\
    \ in this namespace will be prefixed with **mx** followed by a colon.\n\n## 3.3\
    \ ActionScript 3\n\nActionScript has evolved over the years from being used as\
    \ a language for Flash animation routines to a full-fledged object oriented programming\
    \ language in the form of ActionScript 3.0. This book assumes that the user is\
    \ already familiar with the fundamentals of OOP (Object Oriented Programming)\
    \ concepts.\n\nNote: For more information about OOP, refer to the free ebook *Programming\
    \ Fundamentals*, which is also a part of this book series.\n\nActionScript is\
    \ the foundation upon which the entire Flex Framework is based. This book discusses\
    \ the ActionScript APIs used for Flex.\n\n### 3.3.1 Inline ActionScript\n\nInline\
    \ ActionScript is used within the MXML tag. For example:\n\n```\n<mx:Button id=\"\
    myButton\" label=\"Display alert\" click=\"mx.control.Alert.show('Hello World!')\"\
    />\n```\n\nIn the above example, a button is being defined. When someone presses\
    \ this button, the text *Hello World!*, should be displayed. The ActionScript\
    \ usage is illustrated in the sentence:\n\n```\nclick= \"mx.control.Alert.show('Hello\
    \ World!')\"\n```\n\nThis is an assignment statement for the click event. The\
    \ **show()** method of the ActionScript class **Alert** is being assigned to this\
    \ click event to display the alert dialog with the text *Hello World!*.\n\nFor\
    \ data binding, as in the following example, curly braces are used. Curly braces\
    \ cause the expression placed within it to be evaluated and the result gets assigned\
    \ to the attribute of the MXML tag.\n\n```xml\n<mx:TextInput id=\"myText1\" />\n\
    <mx:Text id=\"myText2\" text=\"{myText1.text}\" />\n```\n\n### 3.3.2 MXML Scripts\n\
    \nThe other way in which ActionScript can be used in MXML is by using the <mx:Script>\
    \ element:\n\n```xml\n<mx:Script>\n</mx:Script>\n```\n\nThe contents of <mx:Script>\
    \ block must be enclosed within the CDATA construct, shown in the Listing 3.2,\
    \ as this prevents the compiler from interpreting the content as XML and thus\
    \ helping in proper generation of ActionScript code.\n\n```xml\n<mx:Script>\n\
    \    <![CDATA[\n        import mx.controls.Alert;\n        private function result(evt:ResultEvent):void\
    \ {\n            Alert.show(\"Hello World!!!!\");\n        }\n    ]]>\n</mx:Script>\n\
    ```\n\n**Listing 3.2 - ActionScript using <mx:Script/> tag**\n\nThe ActionScript\
    \ code blocks can also be placed in a separate file with a .as extension. In this\
    \ case the <mx:Script> element is used as shown below.\n\n```xml\n<mx:Script source=\"\
    example.as\" />\n```\n\n### 3.3.3 ActionScript Variables and data types\n\nVariables\
    \ are declared in ActionScript using the var keyword. The following syntax is\
    \ used: var <var name> : <data type> ;\n\nThe data types supported in ActionScript\
    \ are listed in Table 3.1 below. Every data type has certain properties and methods.\
    \ You can also assign a value as you declare the variable. This is shown in the\
    \ examples provided with Table 3.1.\n\n| DataType | Description | Default Value\
    \ | Example |\n| :--- | :--- | :--- | :--- |\n| String | Used for text. Can have\
    \ one or more characters enclosed in single quote or double quote | null | var\
    \ mystr:String=\"hello\"; |\n| Number | A numeric value that can be a fraction\
    \ | NaN (Not a Number) | var mynum:Number=3.25; |\n| Uint | Unsigned integer.\
    \ It can range from 0 to 4,294,967,295 | 0 | var myuint:uint=35; |\n| Int | Any\
    \ integer. It can range from -2,147,483,648 to +2,147,483,647 | 0 | var myint:int=-2.5;\
    \ |\n| Boolean | A true or false value. Possible values include true and false.\
    \ | false | var isCircle:Boolean= true; |\n| Void | A special value used with\
    \ functions to denote that the function returns nothing. It has the value undefined.\
    \ | undefined | function doNothing():void{ } |\n\n**Table 3.1 - ActionScripts\
    \ data types**\n\n### 3.3.4 ActionScript Classes and Objects\n\nIn order to create\
    \ a class in Flex, you create a new ActionScript class that has a .as extension.\
    \ Using Flex Builder, choose File -> New -> ActionScript Class as shown in Figure\
    \ 3.3.\n\n![](img/c4119654311ebf24679359ca130a5ee6_61_0.png)\n\n**Figure 3.3 –\
    \ Creating an ActionScript class using Eclipse – Flex Builder Plug-in**\n\nIn\
    \ order to place the class in the **package com.example1**, you have to give the\
    \ package name in the previous step while giving the name of the class. Now insert\
    \ the code shown in **Listing 3.2** in the editor window that appears after creating\
    \ the class.\n\n```\npackage com.example1\n{\n    public class Car\n    {\n  \
    \      private var speed:Number;\n        private var make:String;\n\n       \
    \ public function Car()\n        {\n            speed=40;\n            make=\"\
    Honda\";\n        }\n\n        public function getSpeed():Number{\n          \
    \  return speed;\n        }\n\n        public function getMake():String{\n   \
    \         return make;\n        }\n\n        public function setSpeed(mySpeed:Number):void{\n\
    \            speed=mySpeed;\n        }\n\n        public function setMake(make:String):void{\n\
    \            this.make=make;\n        }\n    }\n}\n```\n\n**Listing 3.2 – Car\
    \ ActionScript Class**\n\nIn the above example, *Car* represents the class, and\
    \ the function *Car()*, is the constructor. The keyword **this**, denotes the\
    \ current object in use. It works the same way as in other OOPs language like\
    \ Java, C++ etc.\n\n### 3.3.5 Functions and Access modifiers\n\nTo create a function\
    \ in Flex, use the following syntax:\n\n```\n[**public** | **private** | **protected**\
    \ | **internal**] **function**\n    <name>([param1:type, param2:type, ...]) :\
    \ <return type> {\n        //body of function\n        //return value\n    }\n\
    ```\n\nFunctions can be placed either in the MXML file using the <**mx:Script**>\
    \ element or in the ActionScript class as a method.\n\nThe function definition\
    \ above is prefixed by keywords like public, private, protected and internal.\
    \ These are called **access modifiers** and define the scope of the function or\
    \ variable to which they are applied. Table 3.2 below describes the scope of these\
    \ access modifiers in more detail.\n\n| **Access Modifier** | **Same Class** |\
    \ **Same Package** | **Different Package** |\n|---|---|---|---|\n| **private**\
    \ | Yes | No | No |\n| **internal** | Yes | Yes | No |\n| **protected** | Yes\
    \ | Yes | Yes, if subclass |\n| **public** | Yes | Yes | Yes, using import |\n\
    \n**Table 3.2 - Access modifiers**\n\nFor example, if you want to use the `Car`\
    \ class defined above in some different package, this could be done as shown in\
    \ Listing 3.3 below using import.\n\n```\npackage com.example2\n{\n   import com.example1.Car;\n\
    \   public class Garage\n   {\n      private var car:Car;\n      private var numOfCars:uint;\n\
    \n      public function Garage()\n      {\n         car = null;\n         numOfCars\
    \ = 0;\n      }\n      public function getCar() {\n         return car;\n    \
    \  }\n   }\n}\n```\n\n**Listing 3.3 – Using packages in class**\n\nNow what is\
    \ the function getCar() in the above code snippet called? A function, that is\
    \ part of a class is called a method. Most of the classes that you will find in\
    \ ActionScript will have one or more methods and properties.\n\n### 3.3.6 [Bindable]\
    \ Tag\n\nIn ActionScript, a variable does not automatically transmit changes made\
    \ to its value, unless specified to do so. In order to accomplish that, the metadata\
    \ tag called [Bindable] is used.\n\nSimply put, a metadata tag is an instruction\
    \ to the ActionScript compiler. When the ActionScript compiler encounters this\
    \ tag, it makes the necessary code changes in the background so that changes to\
    \ the variable's value is propagated to the different parts of application where\
    \ it is being used.\n\nListing 3.4 shows you how to use the [Bindable] tag.\n\n\
    ```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<mx:Application xmlns:mx=\"http://www.adobe.com/2006/mxml\"\
    \ layout=\"absolute\">\n<mx:Script>\n    <![CDATA[\n        [Bindable]// 1\n \
    \       var myText=\"Welcome to the world of Flex\"; // 2\n```\n"
  mdcn: "\n## 3.2.3 MXML 中的命名空间\n\n在 MXML 中，每个标签前都带有 **mx** 前缀，后跟一个冒号。这是一个 XML 命名空间，表明该标签属于\
    \ **mx 命名空间**。命名空间用于在 XML 实例中提供具有唯一名称的元素和属性。一个 XML 文档可以包含多个词汇表，如果每个词汇表都赋予了不同的名称，那么通过使用命名空间可以解决不同词汇表中同名元素之间的歧义。命名空间使用\
    \ URI（通用资源标识符）进行声明，如下所示：\n\n```\n<mx:Application xmlns:mx=\"http://www.adobe.com/2006/mxml\"\
    >\n```\n\n这里命名空间是 **mx**，从此处开始，在此命名空间中定义的所有组件都将带有 **mx** 前缀，后跟一个冒号。\n\n## 3.3\
    \ ActionScript 3\n\n多年来，ActionScript 已从用于 Flash 动画例程的语言演变为成熟的面向对象编程语言，即 ActionScript\
    \ 3.0。本书假设读者已经熟悉面向对象编程（OOP）的基础概念。\n\n注：有关 OOP 的更多信息，请参阅本系列书籍中的免费电子书 *Programming\
    \ Fundamentals*。\n\nActionScript 是整个 Flex 框架的基础。本书讨论了用于 Flex 的 ActionScript API。\n\
    \n### 3.3.1 内联 ActionScript\n\n内联 ActionScript 用于 MXML 标签内部。例如：\n\n```\n<mx:Button\
    \ id=\"myButton\" label=\"Display alert\" click=\"mx.control.Alert.show('Hello\
    \ World!')\"/>\n```\n\n在上面的示例中，定义了一个按钮。当有人按下此按钮时，应显示文本 *Hello World!*。该 ActionScript\
    \ 用法在以下语句中说明：\n\n```\nclick= \"mx.control.Alert.show('Hello World!')\"\n```\n\n\
    这是针对点击事件的赋值语句。将 ActionScript 类 **Alert** 的 **show()** 方法分配给此点击事件，以显示带有 *Hello\
    \ World!* 文本的警报对话框。\n\n对于数据绑定，如下面的示例所示，使用花括号。花括号会导致其中放置的表达式被求值，并将结果分配给 MXML 标签的属性。\n\
    \n```xml\n<mx:TextInput id=\"myText1\" />\n<mx:Text id=\"myText2\" text=\"{myText1.text}\"\
    \ />\n```\n\n### 3.3.2 MXML 脚本\n\n在 MXML 中使用 ActionScript 的另一种方法是使用 `<mx:Script>`\
    \ 元素：\n\n```xml\n<mx:Script>\n</mx:Script>\n```\n\n`<mx:Script>` 块的内容必须包裹在 CDATA\
    \ 结构中，如清单 3.2 所示，因为这可以防止编译器将内容解释为 XML，从而有助于正确生成 ActionScript 代码。\n\n```xml\n<mx:Script>\n\
    \    <![CDATA[\n        import mx.controls.Alert;\n        private function result(evt:ResultEvent):void\
    \ {\n            Alert.show(\"Hello World!!!!\");\n        }\n    ]]>\n</mx:Script>\n\
    ```\n\n**清单 3.2 - 使用 `<mx:Script/>` 标签的 ActionScript**\n\nActionScript 代码块也可以放置在带有\
    \ .as 扩展名的单独文件中。在这种情况下，`<mx:Script>` 元素如以下所示使用。\n\n```xml\n<mx:Script source=\"\
    example.as\" />\n```\n\n### 3.3.3 ActionScript 变量和数据类型\n\n在 ActionScript 中，使用\
    \ var 关键字声明变量。使用以下语法：var <变量名> : <数据类型> ;\n\nActionScript 支持的数据类型列在下表 3.1 中。每种数据类型都具有一些属性和方法。您还可以在声明变量时分配值。这可以在表\
    \ 3.1 提供的示例中看到。\n\n| 数据类型 | 描述 | 默认值 | 示例 |\n| :--- | :--- | :--- | :--- |\n|\
    \ String | 用于文本。可以包含一个或多个用单引号或双引号括起来的字符 | null | var mystr:String=\"hello\"; |\n\
    | Number | 可以是分数的数值 | NaN (Not a Number) | var mynum:Number=3.25; |\n| Uint |\
    \ 无符号整数。范围可以从 0 到 4,294,967,295 | 0 | var myuint:uint=35; |\n| Int | 任意整数。范围可以从\
    \ -2,147,483,648 到 +2,147,483,647 | 0 | var myint:int=-2.5; |\n| Boolean | 真或假值。可能的值包括\
    \ true 和 false。 | false | var isCircle:Boolean= true; |\n| Void | 与函数一起使用的特殊值，表示函数不返回任何值。其值为\
    \ undefined。 | undefined | function doNothing():void{ } |\n\n**表 3.1 - ActionScript\
    \ 数据类型**\n\n### 3.3.4 ActionScript 类和对象\n\n要在 Flex 中创建类，您需要创建一个新的带有 .as 扩展名的 ActionScript\
    \ 类。使用 Flex Builder，选择 文件 -> 新建 -> ActionScript 类，如图 3.3 所示。\n\n![](img/c4119654311ebf24679359ca130a5ee6_61_0.png)\n\
    \n**图 3.3 – 使用 Eclipse – Flex Builder 插件创建 ActionScript 类**\n\n要将类放在 **com.example1\
    \ 包** 中，您在上一步提供类名称时必须提供包名。现在在创建类后出现的编辑器窗口中插入 **清单 3.2** 中所示的代码。\n\n```\npackage\
    \ com.example1\n{\n    public class Car\n    {\n        private var speed:Number;\n\
    \        private var make:String;\n\n        public function Car()\n        {\n\
    \            speed=40;\n            make=\"Honda\";\n        }\n\n        public\
    \ function getSpeed():Number{\n            return speed;\n        }\n\n      \
    \  public function getMake():String{\n            return make;\n        }\n\n\
    \        public function setSpeed(mySpeed:Number):void{\n            speed=mySpeed;\n\
    \        }\n\n        public function setMake(make:String):void{\n           \
    \ this.make=make;\n        }\n    }\n}\n```\n\n**清单 3.2 – Car ActionScript 类**\n\
    \n在上面的示例中，*Car* 代表类，函数 *Car()* 是构造函数。关键字 **this** 表示正在使用的当前对象。它与其他像 Java、C++ 等面向对象编程语言的工作方式相同。\n\
    \n### 3.3.5 函数和访问修饰符\n\n要在 Flex 中创建函数，请使用以下语法：\n\n```\n[**public** | **private**\
    \ | **protected** | **internal**] **function**\n    <名称>([参数1:类型, 参数2:类型, ...])\
    \ : <返回类型> {\n        //函数体\n        //返回值\n    }\n```\n\n函数可以放置在 MXML 文件中，使用\
    \ `<**mx:Script**>` 元素，或者作为 ActionScript 类中的方法。\n\n上述函数定义前缀有像 public、private、protected\
    \ 和 internal 这样的关键字。这些被称为**访问修饰符**，并定义其应用于的函数或变量的范围。下表 3.2 更详细地描述了这些访问修饰符的范围。\n\
    \n| **访问修饰符** | **同一类** | **同一包** | **不同包** |\n|---|---|---|---|\n| **private**\
    \ | 是 | 否 | 否 |\n| **internal** | 是 | 是 | 否 |\n| **protected** | 是 | 是 | 是，如果是子类\
    \ |\n| **public** | 是 | 是 | 是，使用 import |\n\n**表 3.2 - 访问修饰符**\n\n例如，如果您想在某个不同的包中使用上面定义的\
    \ `Car` 类，可以使用 import 如下面的清单 3.3 所示来实现。\n\n```\npackage com.example2\n{\n   import\
    \ com.example1.Car;\n   public class Garage\n   {\n      private var car:Car;\n\
    \      private var numOfCars:uint;\n\n      public function Garage()\n      {\n\
    \         car = null;\n         numOfCars = 0;\n      }\n      public function\
    \ getCar() {\n         return car;\n      }\n   }\n}\n```\n\n**清单 3.3 – 在类中使用包**\n\
    \n那么，上述代码片段中的 getCar() 函数叫什么？类的组成部分函数被称为方法。您在 ActionScript 中找到的大多数类都具有一个或多个方法和属性。\n\
    \n### 3.3.6 [Bindable] 标签\n\n在 ActionScript 中，除非指定这样做，否则变量不会自动传输对其值所做的更改。为了实现这一点，使用称为\
    \ [Bindable] 的元数据标签。\n\n简而言之，元数据标签是对 ActionScript 编译器的指示。当 ActionScript 编译器遇到此标签时，它会在后台进行必要的代码更改，以便变量的值更改能够传播到应用程序中使用它的不同部分。\n\
    \n清单 3.4 向您展示了如何使用 [Bindable] 标签。\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"\
    ?>\n<mx:Application xmlns:mx=\"http://www.adobe.com/2006/mxml\" layout=\"absolute\"\
    >\n<mx:Script>\n    <![CDATA[\n        [Bindable]// 1\n        var myText=\"Welcome\
    \ to the world of Flex\"; // 2\n```\n\n"
