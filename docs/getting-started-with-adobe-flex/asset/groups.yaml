    , GDP: 150},\n{ Country:  \"Russia\", GDP: 277}\n]);\n```\n\n**Listing 8.10 –\
    \ Data values for the pie chart example**\n\nAdd a function after the above data\
    \ section to show a details label as shown in *Listing 8.11* below.\n\n```actionscript\n\
    private function displayGDP (data:Object,  field:String,  index:Number, \npercentValue:Number):String\
    \ {\n\tvar temp:String= (\" \" + percentValue).substr(0,6);\n\treturn data.Country\
    \ + \" : \" + '\\n' + \"Total GDP: \" + data.GDP + \n\" Billion $\" + '\\n' +\
    \ temp + \"%\";\n}\n```\n\n**Listing 8.11 – Function to show a label for the pie\
    \ chart**\n\nNow add the code to create the pie chart as shown in *Listing 8.12*\
    \ below.\n\n```xml\n<mx:PieChart  id=\"chart\" height=\"100%\" width=\"100%\"\n\
    \t\t\t\tpaddingRight=\"5\" paddingLeft=\"5\" showDataTips=\"true\"\n\t\t\t\tdataProvider=\"\
    {bricGDP}\"\n\t\t>\n\t<mx:series>\n\t\t<mx:PieSeries\n\t\t\t\tnameField=\"Country\"\
    \ labelPosition=\"callout\"\n\t\t\t\tfield=\"GDP\" labelFunction=\"displayGDP\"\
    \n\t\t\t\tfills=\"[{sc1, sc2, sc3, sc4}]\"\n\t\t>\n\t\t</mx:PieSeries>\n\t</mx:series>\n\
    </mx:PieChart>\n<mx:Legend dataProvider=\"{chart}\"/>\n```\n\n**Listing 8.12 -\
    \ Main code for the pie chart creation**\n\nNotice the use of the **fills** attribute\
    \ which is used to define the use of *SolidColor* styling property and defined\
    \ as shown in *Listing 8.13* below.\n\n```xml\n<mx:SolidColor id=\"sc1\" color=\"\
    green\" alpha=\".6\"/>\n<mx:SolidColor id=\"sc2\" color=\"yellow\" alpha=\".6\"\
    />\n<mx:SolidColor id=\"sc3\" color=\"blue\" alpha=\".6\"/>\n<mx:SolidColor id=\"\
    sc4\" color=\"red\" alpha=\".6\"/>\n```\n\n**Listing 8.13 – Styling of the pie\
    \ chart**\n\nYou can see the pie chart that is generated in Figure 8.6.\n\n![](img/c4119654311ebf24679359ca130a5ee6_191_0.png)\n\
    \n**Figure 8.6 – Output of the pie chart example**\n\n## 8.8 Chart style\n\nThere\
    \ are many ways to define or change styles for charts. The sections below describe\
    \ some of the most commonly used ones.\n\n### 8.8.1 Stroke\n\nYou use the **Stroke**\
    \ class with the chart series and grid lines to control the properties of the\
    \ lines that Flex uses to draw chart elements. Some of the attributes for Strokes\
    \ are:\n\n- **Color**: Specifies the color of the line as a hexadecimal value.\n\
    - **Weight**: Specifies the width of the line, in pixels.\n- **Alpha**: Specifies\
    \ the transparency of a line.\n\nExample of a Stroke definition:\n\n```xml\n<mx:Stroke\
    \ id=\"Stroke1\" weight=\"2\" color=\"0x999999\" alpha=\".8\" />\n```\n\n### 8.8.2\
    \ Stacking\n\nWhen you use multiple data series in the **AreaChart**, **BarChart**,\
    \ and **ColumnChart** controls, you can control the display of series using the\
    \ `type` property of the controls. Table 8.1 describes the values that the `type`\
    \ property supports.\n"
  mdcn: "\n## 列表 8.5 – 创建柱状图的主代码\n\n运行该程序，您将会看到图 8.2 中所示的柱状图。\n\n![](img/c4119654311ebf24679359ca130a5ee6_185_0.png)\n\
    \n## 图 8.2 – 柱状图示例的输出\n\n仔细查看使用 **ColumnChart** 控件定义图表数据的 **ColumnSeries** 图表系列。大多数图表都会有与图表控件相关联的类似图表系列。\n\
    \n### 8.4 条形图示例\n\n使用与上一个示例相同的数据，将代码修改为下方 *列表 8.6* 中所示的内容。\n\n```xml\n<mx:BarChart\
    \ id=\"bar\" height=\"100%\" width=\"45%\"\n             paddingLeft=\"5\" paddingRight=\"\
    5\"\n             showDataTips=\"true\" dataProvider=\"{population}\">\n    <mx:verticalAxis>\n\
    \        <mx:CategoryAxis categoryField=\"Country\"/>\n    </mx:verticalAxis>\n\
    \    <mx:series>\n        <mx:BarSeries\n            yField=\"Country\"\n    \
    \        xField=\"Population\"\n            displayName=\"Population (Millions)\"\
    \n            fill=\"{sc1}\"\n            stroke=\"{s1}\"\n        />\n    </mx:series>\n\
    </mx:BarChart>\n<mx:Legend dataProvider=\"{bar}\"/>\n```\n\n**列表 8.6 - 创建条形图的主代码**\n\
    \n条形图示例的输出显示在 *图 8.3* 中。\n\n![](img/c4119654311ebf24679359ca130a5ee6_186_0.png)\n\
    \n**图 8.3 – 条形图示例的输出**\n\n如您所见，从柱状图转换为条形图非常简单。它们具有相似的属性；只需更改轴即可正确渲染数据。\n\n###\
    \ 8.5 折线图示例\n\n在本示例中，您将看到如何使用 **form** 属性格式化折线图。该属性可以具有以下值：\n\n- **segment:**\
    \ 将线绘制为以角度连接系列中每个数据点的连接线段。这是默认值。\n- **step:** 将线绘制为水平和垂直线段。在第一个数据点处，绘制一条水平线，然后绘制一条到第二个数据点的垂直线。对每个数据点重复此操作。\n\
    - **reverseStep:** 将线绘制为水平和垂直线段。在第一个数据点处，绘制一条垂直线，然后绘制一条到第二个数据点的水平线。对每个数据点重复此操作。\n\
    - **Vertical:** 仅在第二个点的 x 坐标处，从第一个点的 y 坐标到第二个点的 y 坐标绘制垂直线。对每个数据点重复此操作。\n- **Horizontal:**\
    \ 仅在第一个点的 y 坐标处，从第一个点的 x 坐标到第二个点的 x 坐标绘制水平线。对每个数据点重复此操作。\n- **Curve:** 在数据点之间绘制曲线。\n\
    \n在 **[Bindable]** 部分后添加一个数据部分，如下方 *列表 8.7* 所示。\n\n```actionscript\npublic var\
    \ lineChartDemo:ArrayCollection = new ArrayCollection([\n    {Time:\"1:30\", \"\
    Line chart (segment)\":100, \"Line chart (step)\":85, \"Line chart (curve)\":40\
    \ },\n    {Time:\"1:30\", \"Line chart (segment)\":60, \"Line chart (step)\":70,\
    \ \"Line chart (curve)\":20 },\n    {Time:\"1:30\", \"Line chart (segment)\":80,\
    \ \"Line chart (step)\":40, \"Line chart (curve)\":40 },\n    {Time:\"1:30\",\
    \ \"Line chart (segment)\":50, \"Line chart (step)\":20, \"Line chart (curve)\"\
    :60},\n    {Time:\"1:30\", \"Line chart (segment)\":60, \"Line chart (step)\"\
    :60, \"Line chart (curve)\":40 }\n]);\n```\n\n**列表 8.7 - 折线图的数据值**\n\n*列表 8.8\
    \ 展示了创建折线图所需的主代码。*\n\n```xml\n<mx:LineChart x=\"103\" y=\"90\" id=\"lineChart1\"\
    \ndataProvider=\"{lineChartDemo}\"\nshowDataTips=\"true\"\n>\n    <mx:horizontalAxis>\n\
    \        <mx:CategoryAxis\n            dataProvider=\"{lineChartDemo}\"\n    \
    \        categoryField=\"Time\"\n        />\n    </mx:horizontalAxis>\n    <mx:series>\n\
    \        <mx:LineSeries yField=\"Line chart (segment)\"\ndisplayName=\"Line chart\
    \ (segment)\" />\n        <mx:LineSeries\n            yField=\"Line chart (step)\"\
    \n            displayName=\"Line chart (step)\"\n            form = \"step\"\n\
    \        />\n        <mx:LineSeries\n            yField=\"Line chart (curve)\"\
    \n            displayName=\"Line chart (curve)\"\n            form = \"curve\"\
    \n        />\n    </mx:series>\n</mx:LineChart>\n<mx:Legend dataProvider=\"{lineChart1}\"\
    />\n```\n\n**列表 8.8 - 创建折线图的主代码**\n\n程序的输出显示在 *图 8.4* 中。\n\n![](img/c4119654311ebf24679359ca130a5ee6_188_0.png)\n\
    \n**图 8.4 – 折线图示例的输出**\n\n### 8.6 面积图示例\n\n将上述示例中的代码修改为下方 *列表 8.9* 中所示的内容：\n\n\
    ```xml\n<mx:AreaChart x=\"103\" y=\"90\" id=\"Areachart\"\n    dataProvider=\"\
    {lineChartDemo}\"\n    showDataTips=\"true\">\n    <mx:horizontalAxis>\n     \
    \   <mx:CategoryAxis categoryField=\"Time\"/>\n    </mx:horizontalAxis>\n    <mx:series>\n\
    \        <mx:AreaSeries yField=\"Line chart (segment)\"\n        displayName=\"\
    Area chart (segment)\" alpha=\".5\"/>\n        <mx:AreaSeries yField=\"Line chart\
    \ (step)\" form=\"curve\"\n        displayName=\"Area chart (curve)\" alpha=\"\
    .5\"/>\n        <mx:AreaSeries yField=\"Line chart (curve)\" form=\"step\"\n \
    \   displayName=\"Area chart (step)\" alpha=\".5\"/>\n    </mx:series>\n</mx:AreaChart>\n\
    ```\n\n**列表 8.9 - 创建面积图的主代码**\n\n运行该程序，您将会看到如图 8.5 所示的输出。\n\n![](img/c4119654311ebf24679359ca130a5ee6_189_0.png)\n\
    \n**图 8.5 – 面积图示例的输出**\n\n请注意在上述代码中如何使用 `alpha` 属性。这将在本章后面的图表样式部分中详细解释。\n\n###\
    \ 8.7 饼图示例\n\n下面展示了一个饼图示例，用于显示 2008 年金砖国家（巴西、俄罗斯、印度和中国）的国内生产总值（GDP）。\n\n在 **Bindable**\
    \ 部分后添加一个数据部分，如下方 *列表 8.10* 所示。\n\n```actionscript\nprivate var bricGDP: ArrayCollection\
    \ = new ArrayCollection([ \n{ Country:  \"Brazil\", GDP: 78 },\n{ Country:  \"\
    China\", GDP: 300 },\n{ Country:  \"India\", GDP: 150},\n{ Country:  \"Russia\"\
    , GDP: 277}\n]);\n```\n\n**列表 8.10 – 饼图示例的数据值**\n\n在上述数据部分后添加一个函数以显示详细标签，如下方 *列表\
    \ 8.11* 所示。\n\n```actionscript\nprivate function displayGDP (data:Object,  field:String,\
    \  index:Number, \npercentValue:Number):String {\n\tvar temp:String= (\" \" +\
    \ percentValue).substr(0,6);\n\treturn data.Country + \" : \" + '\\n' + \"Total\
    \ GDP: \" + data.GDP + \n\" Billion $\" + '\\n' + temp + \"%\";\n}\n```\n\n**列表\
    \ 8.11 – 用于显示饼图标签的函数**\n\n现在添加创建饼图的代码，如下方 *列表 8.12* 所示。\n\n```xml\n<mx:PieChart\
    \  id=\"chart\" height=\"100%\" width=\"100%\"\n\t\t\t\tpaddingRight=\"5\" paddingLeft=\"\
    5\" showDataTips=\"true\"\n\t\t\t\tdataProvider=\"{bricGDP}\"\n\t\t>\n\t<mx:series>\n\
    \t\t<mx:PieSeries\n\t\t\t\tnameField=\"Country\" labelPosition=\"callout\"\n\t\
    \t\t\tfield=\"GDP\" labelFunction=\"displayGDP\"\n\t\t\t\tfills=\"[{sc1, sc2,\
    \ sc3, sc4}]\"\n\t\t>\n\t\t</mx:PieSeries>\n\t</mx:series>\n</mx:PieChart>\n<mx:Legend\
    \ dataProvider=\"{chart}\"/>\n```\n\n**列表 8.12 - 创建饼图的主代码**\n\n注意 **fills** 属性的使用，它用于定义\
    \ *SolidColor* 样式属性的使用，如下方 *列表 8.13* 中所示的定义。\n\n```xml\n<mx:SolidColor id=\"sc1\"\
    \ color=\"green\" alpha=\".6\"/>\n<mx:SolidColor id=\"sc2\" color=\"yellow\" alpha=\"\
    .6\"/>\n<mx:SolidColor id=\"sc3\" color=\"blue\" alpha=\".6\"/>\n<mx:SolidColor\
    \ id=\"sc4\" color=\"red\" alpha=\".6\"/>\n```\n\n**列表 8.13 – 饼图的样式**\n\n您可以在图\
    \ 8.6 中看到生成的饼图。\n\n![](img/c4119654311ebf24679359ca130a5ee6_191_0.png)\n\n**图\
    \ 8.6 – 饼图示例的输出**\n\n## 8.8 图表样式\n\n定义或更改图表样式有很多方法。以下部分介绍了一些最常用的方法。\n\n### 8.8.1\
    \ 描边\n\n您将使用 **Stroke** 类与图表系列和网格线来控制 Flex 用于绘制图表元素的线的属性。Stroke 的一些属性包括：\n\n-\
    \ **Color**: 指定线的颜色，作为十六进制值。\n- **Weight**: 指定线的宽度，以像素为单位。\n- **Alpha**: 指定线的透明度。\n\
    \nStroke 定义的示例：\n\n```xml\n<mx:Stroke id=\"Stroke1\" weight=\"2\" color=\"0x999999\"\
    \ alpha=\".8\" />\n```\n\n### 8.8.2 堆叠\n\n当您在 **AreaChart**、**BarChart** 和 **ColumnChart**\
    \ 控件中使用多个数据系列时，您可以使用控件的 `type` 属性来控制系列的显示。表 8.1 描述了 `type` 属性支持的值。\n\n"
