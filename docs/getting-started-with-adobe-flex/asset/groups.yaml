    \ You also use fills to specify the background colors of the chart or bands of\
    \ background colors defined by the grid lines. Fills can be solid or can use linear\
    \ and radial gradients. A gradient specifies a gradual color transition in the\
    \ fill color.\n\n# 8.9 Exercises\n\nIt is now time for you to apply what you have\
