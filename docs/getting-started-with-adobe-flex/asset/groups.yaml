    **Table B.3 - Commands to manipulate the dbm cfg**


    +   - **Database Configuration File (db cfg)** includes parameters that affect
    the particular database in question. *Table B.4* shows some useful commands to
    manage the db cfg.


    | Command | Description |

    |---|---|

    | `get db cfg for <database_name>` | Retrieves information about the db cfg for
    a given database |

    | `update db cfg for <database_name> using <parameter_name> <value>` | Updates
    the value of a db cfg parameter |


    **Table B.4 - Commands to manipulate the db cfg**


    +   - **DB2 Profile Registry variables** includes parameters that may be platform
    specific and can be set globally (affecting all instances), or at the instance
    level (affecting one particular instance). *Table B.5* shows some useful commands
    to manipulate the DB2 profile registry.


    | Command | Description |

    |---|---|

    | `db2set -all` | Lists all the DB2 profile registry variables that are set |

    | `db2set <parameter>==<value>` | Sets a given parameter with a value |


    **Table B.5 - Commands to manipulate the DB2 profile registry**


    # **B.7 Connecting to a database**


    If your database is local, that is, it resides on the same system where you are
    performing your database operation; the connection setup is performed automatically
    when the database is created. You can simply issue a `connect to database_name`
    statement to connect to the database.


    If your database is remote, the simplest method to set up database connectivity
    is by using the Configuration Assistant GUI tool following these steps:


    +   1. Start the Configuration Assistant from the system where you want to connect
    to the database. To start this tool, use the command `db2ca` from a Windows command
    prompt or Linux shell. *Figure B.9* shows the Configuration Assistant.'
  - '[PAGE 222]


    ![](img/c4119654311ebf24679359ca130a5ee6_222_0.png)


    Figure B.9 - The DB2 Configuration Assistant


    +   2. From the Configuration Assistant, click on the *Selected -> Add database
    using Wizard* menu


    +   3. From the *Select how you want to set up a connection* window, you can use
    *Search the network* if your network is small without many hubs. If you know the
    name of the server where DB2 resides, choose *Known systems* and drill down all
    the way to the database you want to connect. Proceed with the wizard using default
    values. If you do not know the name of your system, choose *Other systems (Search
    the network)*. Note that this may take a long time if your network is large.


    +   4. If *Search the network* does not work, go back to the *Select how you want
    to set up a connection* window, and choose *Manually configure a connection to
    a database*. Choose *TCP/IP* and click *next*. Input the *host name* or *IP address*
    where your DB2 server resides. Input either the *service name* or the *port number*.


    +   5. Continue with the wizard prompts and leave the default values.


    +   6. After you finish your set up, a window will pop up asking you if you want
    to test your connection. You can also test the connection after the setup is finished
    by right-clicking on the database, and choosing *Test Connection*.


