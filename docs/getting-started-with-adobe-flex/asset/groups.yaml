    \ functionality of traditional desktop applications. RIA can also be defined as\
    \ a mix of three things: desktop-like UI online, offline applications that look\
    \ like online applications, and online applications that can go offline whenever\
    \ they are required to store the state of the program.\n- 2. The goal of the Model-View-Controller\
    \ (MVC) architecture is to create components that are well-defined and with limited\
    \ scope in the application. This increases reusability of the components and improves\
    \ maintainability of the overall system. Using Flex, we partition the view Component\
    \ which defines the applications’ user interface.\n- 3. You can use Flex 3 to\
    \ create a wide range of highly interactive, expressive applications. For example,\
    \ a data visualization application built in Flex can pull data from multiple back-end\
    \ sources and display it visually. Business users can drill down into the data\
    \ for deeper insight and even change the data and have it automatically updated\
    \ on the back end.\n- 4. Flex is a suite of tools and an environment to build\
    \ bigger, more reliable and more complex Flash Applications. You can do anything\
    \ in Flash that can be done in Flex but it is harder. Flex provides the ability\
    \ to create SWF files that run on Adobe Flash Player in any browser.\n- 5. The\
    \ main features that were introduced in Flex 3.0 are listed below:\n    - Profiler\
    \ to Monitor Memory and CPU Consumption\n    - Refactoring\n    - Persistent Caching\n\
    \    - Wizards to generate Code\n    - Charting Enhancements\n    - DataGrid Component\n\
    - 6. C – supported languages ActionScript and MXML\n- 7. B - Microsoft SilverLight,\
    \ C - Ajax, D - JSF.\n- 8. D and E. IDE and Design View are not included.\n- 9.\
    \ A, B and D\n- 10. A & B\n\n## Chapter 2\n\n- 1. Flex applications are, by nature,\
    \ Flash applications. That means upon building the Flex application the output\
    \ produced is .swf (swiff) format and that is executed by Flash Player.\n- 2.\
    \ Flash player is not very good at displaying HTML contents. Displaying capabilities\
    \ of Flash Player are limited to the boundaries of the player’s scope Within a\
    \ web page. Since Flex applications are run on Flash Player, for the obvious reason,\
    \ Flex applications deployed on web server are not good at displaying HTML content\
    \ either. On the other hand AIR (Adobe Integrated Runtime) applications support\
    \ AIR player wherein a full built-in browser displays HTML content nicely. Moreover,\
    \ unlike HTML files, there is a delay in loading .swf files.\n- 3. Since Flex\
    \ applications produce .swf files those are run on top of Flash Player, Flex provides\
    \ cross platform support that is not dependent on web browser’s environment. Most\
    \ of the today’s web browsers provide seamless support for Flash Player plug-in.\n\
