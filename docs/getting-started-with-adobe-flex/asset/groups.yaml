    more detail in the exercise section.


    # 4.3.2 Layout containers


    A layout container is a rectangular area rendered on the Flash Payer during runtime
    of a Flex application. It controls the size and position of the child container
    and controls painted within it. You can think of layout containers as place holders
    for other controls and containers. *Table 4.1* lists the layout containers in
    Flex 3.0


