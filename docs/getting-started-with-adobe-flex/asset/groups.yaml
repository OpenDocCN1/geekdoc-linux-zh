    Adobe Flex Builder 3 软件是一款基于 Eclipse 的强大 IDE，作为授权产品提供。Adobe Flex Builder 3 加速了
    Flex 应用程序的开发，因为它支持智能编码、交互式单步调试和可视化设计功能。Adobe Flex Builder 3 包含完整的 Flex SDK，包括编译器、组件库和调试器，以及
    IDE。它也可作为 Eclipse 插件使用。Adobe Flex Builder 3 有两个可用的发行版：


    - Adobe Flex Builder 3 标准版

    - Adobe Flex Builder 3 专业版。


    *下表 1.1* 展示了 Adobe Flex Builder 3 不同版本中功能特征的对比表。


    | 功能 | Adobe Flex Builder 3 专业版 | Adobe Flex Builder 3 标准版 |

    | :--- | :---: | :---: |

    | 桌面 RIA | ✔ | ✔ |

    | DataGrid | ✔ | ✔ |

    | 高级 DataGrid | ✔ | |

    | 图表组件 | ✔ | |

    | 性能分析器 | ✔ | |

    | 内存分析器 | ✔ | |

    | 交互式调试 | ✔ | ✔ |

    | 设计视图 | ✔ | ✔ |

    | 编码工具 | ✔ | ✔ |

    | 数据处理 | ✔ | ✔ |

    | 浏览器集成 | ✔ | ✔ |


    表 1.1 – Adobe Flex 不同版本的功能对比


    > **注意：**

    > 本书中所有的示例和代码片段均使用 Adobe Flex Builder 3.0 专业版和 Eclipse SDK 版本 3.3.2 创建和测试。


    ### 1.3.3 Adobe Data Services


    Adobe 提供两种数据服务解决方案以满足各种需求。


    - **BlazDS**：这是一个开源项目，为所有开发者提供 Flex 远程处理和消息服务。Flex 远程处理使开发者能够快速轻松地连接到后端业务逻辑和数据。

    - **Adobe LiveCycle Data Services**：这是一个功能齐全的框架，用于开发企业级 RIA 解决方案。这是一个可购买的授权产品。


    ## 1.4 Flex 社区


    Adobe Flex 是一项相当新的技术；然而，在很短的时间内，Flex 社区已显著增长，这体现在可用于学习 Adobe Flex 的资源数量上。作为 Flex
    开发者，你可以利用许多这些资源，无论是在线的还是现实世界中的，它们可以磨练你的 Flex 技能，并为你的应用程序提供绝佳技巧和窍门。Adobe 提供了良好的
    Adobe Flex 文档，可以帮助初学者入门。该文档可在 [http://www.adobe.com/support/documentation/en/flex/](http://www.adobe.com/support/documentation/en/flex/)
    访问。


    ### 1.4.1 开发者资源


    以下列表提供了一些流行的 Adobe Flex 开发者资源：


    - Flex.org – [http://flex.org/](http://flex.org/)。这是 Flex 开发者的社区网站，拥有指向优秀开发者资源的链接。

    - Adobe Flex 开发者中心 – [http://www.adobe.com/devnet/flex/](http://www.adobe.com/devnet/flex/)。这是官方
    Adobe Flex 社区中心，拥有大量文章和出色信息。

    - Flex Search – [http://flexsearch.org](http://flexsearch.org)。这是专为 Flex 社区定制的
    Flex 搜索引擎。


    ### 1.4.2 讨论论坛


    以下列表是 Adobe Flex 的讨论论坛列表。这些讨论论坛有助于解决常见遇到的问题。


    - Flex Coders – http://www.adobe.com/go/flexcoders

    - Flex 组件开发 – http://tech.groups.yahoo.com/group/flexcomponents

    - Flex 支持论坛 – http://www.adobe.com/cfusion/webforums/forum/index.cfm?forumid=60

    - Flex 组件 – http://www.adobe.com/go/flexcomponents

    - Flex Builder 3 Adobe 论坛 – http://www.adobe.com/cfusion/webforums/forum/categories.cfm?forumid=72&catid=651&entercat=y


    ### 1.4.3 Adobe Flex 博客


    随着近年来 Flex 开发者数量的显著增长，以及他们知识财富的急剧增加，许多 Flex 开发者开始在其博客上分享 Flex 信息。这些博客通常包含 Flex
    框架现有 Bug 的变通方法、工作流改进提示、性能和内存管理技巧，以及关于 Adobe Flex、Flex 未来和 Flex 社区的一般发人深省的问题。以下是一些阅读率最高的博客列表：


    - Flex Team Blog – http://blogs.adobe.com/flex/。这是 Adobe Flex 团队官方博客。

    - Mike Morearty 的博客 – http://www.morearty.com/blog/ Mike 是 Adobe Flex Builder
    调试部分背后的智慧。他的博客让你及时了解 Flex 世界正在发生的事情。

    - Chet Haase 的博客 – http://graphics-geek.blogspot.com/ Chet 的博客专注于 Flex/Flash 图形技术。


    ## 1.5 比较 Adobe Flex 与类似产品


    本节简要比较了 Adobe Flex 与市场上目前可用的其他类似技术。


    ### 1.5.1 Adobe Flex 与 HTML/JavaScript/Ajax


    使用 Adobe Flex 编写交互式 UI 应用程序既简单又强大。Flex 有两个主要组件：


    - MXML，一种基于 XML 的标记语言，以及

    - ActionScript，一种脚本语言，是 ECMA 脚本（JavaScript 标准）的实现。


    Adobe Flex 允许开发者通过编译 MXML 来创建可在 Flash 播放器中执行的 Swift 文件（`.swf`），从而构建 RIA。


    精通 XML 和 JavaScript 的程序员会发现在 MXML 和 ActionScript 中工作很容易。尽管在底层 MXML 和 ActionScript
    不像 HTML 和 JavaScript 那样相互关联，但在表面上，其交互方式对大多数 Web 开发者来说是有意义的。


    使用 Adobe Flex，你还可以开发 Ajax 所能实现的大多数琐碎和复杂的功能。在开源社区的贡献下，Ajax 库最近真的长大了，使用 Ajax 不再像过去那样困难。尽管如此，Flex
    是一个框架的事实提供了一种优势，因为它比编写 Ajax 代码更容易编写和维护 MXML/ActionScript 代码。


    ### 1.5.2 Adobe Flex 与 Flash IDE


    虽然 Adobe Flex 应用程序被编译并转换为 `.swf` 文件，可以由 Flash 播放器运行，但 Flex 与 Flash 大不相同。Flash
    核心是动画和绘图编辑器；开发功能是后来添加的。另一方面，Adobe Flex 是一个用于开发应用程序的开源组件库。与 Flash IDE 相比，Adobe
    Flex 是一个更灵活的开发框架，支持轻松移动数据、样式化和换肤、高级交互控制以及更多功能。


    ### 1.5.3 Adobe Flex 与 Java/JavaFX


    如今，Flash 播放器存在于几乎所有的计算机上。Flex 应用程序将 Flash 播放器作为 Flex 应用程序的虚拟机使用；因此，Flex 应用程序可以在大多数计算机上运行。Java
    也是一种流行的语言，大多数计算机都包含 Java 虚拟机 (JVM) 作为 Java 运行时环境 (JRE) 的一部分，或者可以轻松下载。JavaFX 是一个用于构建
    RIA 的软件平台，类似于 Adobe Flex。使用 Adobe Flex，我们仍然可以使用 Java 作为后端，并使用更流行的 Flash 作为前端。


    熟悉 XML 和 JavaScript 的 Web 开发者会发现在 Adobe Flex 中工作很容易。熟悉 Eclipse 的 Java 开发者也应该发现在
    Adobe Flex Builder 中工作很容易，因为它是基于 Eclipse 的。与 Flex 一样，Java 允许应用程序部署在 Web 上或桌面上。


    ### 1.5.4 Adobe Flex 与 Java Server Faces (JSF)


    Flex 应用程序侧重于客户端，用于部署到桌面或 Web 页面。与服务器进行数据交换使用 XML。另一方面，Java Server Faces 技术在服务器端工作，通常将其输出渲染为带或不带
    AJAX 支持的 HTML 页面。JSF 技术提供了行为和表示之间的清晰分离。使用 JSF，客户端生成的事件被映射为服务器端对象的方法，生成响应并将其发送回客户端。此响应可以是同步的（常规组件，其中页面完全重新加载）或异步的（使用
    AJAX，仅使用响应数据更新组件）。

    '
