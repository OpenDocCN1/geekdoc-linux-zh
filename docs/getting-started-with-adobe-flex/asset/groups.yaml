    \ series are rendered on top of each other, with the element corresponding to\
    \ the last series on top. This is the default value for AreaChart controls. |\n\
    | overlaid | Each series are stacked on top of each other. Each element represents\
    \ the cumulative value of the elements beneath it. |\n| 100% | On top of each\
    \ other, adding up to 100%. Each chart element represents the percentage that\
    \ the value contributes to the sum of the values for that category. |\n\nTable\
    \ 8.1 - Values supported by the type property\n\n# 8.8.3 Fill\n\nFor charting\
    \ multiple data series, or just to improve the appearance of your charts, you\
