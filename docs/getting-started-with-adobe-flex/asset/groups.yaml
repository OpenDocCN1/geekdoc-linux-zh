    \n## Chapter 6 - Working with view states, transitions and filters\n\nIn this\
    \ chapter, you will learn the basics of how to change the look and feel of the\
    \ application interface based on the task that a user is performing. Example of\
    \ this includes changing the image of an icon when a user rolls a mouse over it.\
    \ Using view states, transitions and filters, rich internet applications can be\
    \ built without much hassle.\n\nIn this chapter you will learn about:\n\n- View\
    \ states\n- Using components with states\n- Using effects\n- Using transition\n\
    - Using filters in effects\n\n### 6.1 Working with view states, transitions and\
    \ filters: The big picture\n\nView states allow you to change the appearance of\
    \ an application in response to some user action. Transitions allow you to define,\
    \ how this change in the view state appears to the user on screen. A transition\
    \ is defined with the help of effect classes, in combination of different effects\
    \ that are designed specifically to handle transitions. Figure 6.1 provides an\
    \ overview of the relationship between these concepts.\n\n![](img/c4119654311ebf24679359ca130a5ee6_114_0.png)\n\
    \n![](img/c4119654311ebf24679359ca130a5ee6_115_0.png)\n\nIn the figure, *View\
    \ State 1* is the initial state of the UI. When the defined *transition* is applied\
    \ to this view state the UI changes to *View State 2*. A transition is defined\
    \ using different effects (*Effect 1, Effect 2... Effect N*). These effects can\
    \ be applied conditionally using different *filters* along with effects. Filters\
    \ are used to conditionally apply the defined effects only on a subset of target\
    \ components defined in the *transition*.\n\n### 6.2 View states\n\n*States* are\
    \ a collection of changes to a view. Let us say that we have a view with many\
    \ components (containers and controls). Then, if any change occurs to the layout\
    \ of any of these view components, then it becomes a view state. Every component\
    \ that inherits the `UIComponent` class will have view states and these components\
    \ will inherit the states property.\n\n#### 6.2.1 Creating States\n\nStates can\
    \ be easily created in Flex Builder using the design view. Let us see how this\
    \ can be done using a simple example. Follow these steps:\n\n1. Create a new Flex\
    \ project.\n\n2. Switch to design view and using the layout tools, add two components,\
    \ a panel and a button as shown in *Figure 6.2* below. This now becomes the base\
    \ state of the application.\n\n![](img/c4119654311ebf24679359ca130a5ee6_115_1.png)\n\
    \n3. Now you can create a new state based on this base state. Select *Window ->\
    \ Show View -> States* to open the States view. *Figure 6.3* shows the States\
    \ view. Now click on the *New State* icon as shown in the below figure. A popup\
    \ window appears. Name the new state as *firstState* and then specify the component\
    \ on which it is based. In this example it is based on the `<base state>`. You\
    \ can optionally tick the ‘set as Start state’ option if this state should be\
    \ the start state. Leave that option un-ticked for the time being since we want\
    \ the base state as the start state.\n\n![](img/c4119654311ebf24679359ca130a5ee6_116_0.png)\n\
    \n**Figure 6.3 - States View**\n\n4. Now add a TextArea to this new state and\
    \ define some properties for the TextArea as shown below.\n\n```xml\n<mx:TextArea\
    \ id=\"txt1\" x=\"10\" y=\"10\" width=\"260\" height=\"210\"\n text=\"My First\
    \ State\" fontSize=\"20\" textAlign=\"center\"\n backgroundColor=\"#FFEA00\"/>\n\
    ```\n\n5. You can add one more state in the same manner as shown earlier in Figure\
    \ 6.3 and name it *secondState*. Add as many states as you would like. You can\
    \ even add multiple components of your choice to each new state.\n\n6. You can\
    \ check the source view to see what happened behind the scenes while we created\
    \ these new states and added components to them. Listing 6.1 shows you the code\
    \ that is generated.\n\n```xml\n<mx:Panel id=\"panel1\" x=\"0\" y=\"0\" width=\"\
    300\" height=\"300\"\n layout=\"absolute\" title=\"Learn how to change states\"\
    >\n <mx:Button x=\"99\" y=\"228\" label=\"Change\"\n click=\"onClick(event)\"\
    />\n</mx:Panel>\n<mx:states>\n <mx:State name=\"firstState\">\n <mx:AddChild relativeTo=\"\
    [panel1]\" position=\"lastChild\">\n <mx:TextArea id=\"txt1\" x=\"10\" y=\"10\"\
    \ width=\"260\"\n height=\"210\"\n text=\"My First State\" fontSize=\"20\" textAlign=\"\
    center\"\n backgroundColor=\"#FFEA00\"/>\n </mx:AddChild>\n </mx:State>\n <mx:State\
    \ name=\"secondState\">\n <mx:AddChild relativeTo=\"[panel1]\" position=\"lastChild\"\
    >\n <mx:TextArea id=\"txt2\" x=\"10\" y=\"10\" width=\"260\"\n height=\"210\"\n\
    \ text=\"My Second State\" fontSize=\"20\" textAlign=\"center\"\n backgroundColor=\"\
    #0036FF\"/>\n </mx:AddChild>\n </mx:State>\n</mx:states>\n```\n\n**Listing 6.1\
    \ - Defining states**\n\n7. Now add an event handler to the button in the source\
    \ view to toggle between the current states. The ActionScript code is shown in\
    \ Listing 6.2 below.\n\n```actionscript\n<mx:Script>\n    <![CDATA[\n    private\
    \ function onClick(e:MouseEvent):void{\n        if (currentState=='firstState')\n\
    \            currentState='secondState';\n        else if(currentState=='secondState')\n\
    \            currentState='firstState';\n        else\n            currentState='firstState';\n\
    \    }\n    ]]>\n</mx:Script>\n```\n\n**Listing 6.2 - Code to toggle between states**\n\
    \n8. Run the application and you can see the output as shown in Figure 6.4. This\
