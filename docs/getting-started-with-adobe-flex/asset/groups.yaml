    \ 1**\n\n+   1. Rich Internet applications (RIA) are Web applications that have\
    \ the features and functionality of traditional desktop applications. RIA can\
    \ also be defined as a mix of three things: desktop-like UI online, offline applications\
    \ that look like online applications, and online applications that can go offline\
    \ whenever they are required to store the state of the program.\n\n+   2. The\
    \ goal of the Model-View-Controller (MVC) architecture is to create components\
    \ that are well-defined and with limited scope in the application. This increases\
    \ reusability of the components and improves maintainability of the overall system.\
    \ Using Flex, we partition the view Component which defines the applications’\
    \ user interface.\n\n+   3. You can use Flex 3 to create a wide range of highly\
    \ interactive, expressive applications. For example, a data visualization application\
    \ built in Flex can pull data from multiple back-end sources and display it visually.\
