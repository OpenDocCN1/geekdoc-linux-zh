    # 7.7 Summary


    In this chapter, you have learned how easy it can be to communicate with a remote
    server irrespective of the protocols being used.


    First, you learned that if the remote server uses SOAP for communication then,
    a Web service can be used to communicate with it. If the protocol being used is
    HTTP, then the HttpService can be used. To access a remote object sitting on the
    server, you can bypass any gateway using RemoteObject with the AMF protocol.


    Then you learned that the result obtained from the server can be dealt with irrespective
    of the type since Flex provides us with various means to deal with them (object
    or XML).


    Finally, the chapter discussed how to work with databases such as DB2, and provided
    an extensive example.


    From here on you will be using the concepts learned to build real-time dashboards
    with charts and data grids.


    # 7.8 Review questions


    +   1. What is the difference between HttpService and Dataservice?


    +   2. When will you use the RemoteObject service?


    +   3. What are the other alternatives to Adobe LifeCycle dataservices?'
