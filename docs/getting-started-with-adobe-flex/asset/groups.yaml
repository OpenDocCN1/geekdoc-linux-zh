    \n## 图 7.19 - 选择员工后的员工屏幕\n\n通过添加 CRUD（创建、更新和删除）功能以及为每个字段添加验证，可以进一步扩展该应用程序。此外，通过使用一些样式表和其他装饰器，可以使\
    \ UI 更加优雅。我们鼓励您改进和扩展该应用程序！\n\n## 7.6 练习\n\n本节包含两个练习。第一个练习用于创建一个调用 Web 服务以获取天气预报信息的\
    \ Web 应用程序。第二个练习用于创建一个调用 Web 服务以翻译文本的桌面应用程序。\n\n### 7.6.1 练习 1 - 获取天气预报信息\n\n\
