    到 2000 年代中期，随着 Adobe Flex 等新技术的出现，富互联网应用（RIAs）得以开发。RIAs 提供了一种引人入胜、交互式、轻量且灵活的 Web
    体验。RIA 结合了使用 Web 作为低成本部署模型的优势，以及媲美桌面应用的丰富用户体验。RIAs 引入了一种新的应用开发模型，将后端数据服务与丰富的前端客户端分离。通过访问
    Flex Store 可以查看 RIA 的示例：[http://examples.adobe.com/flex2/inproduct/sdk/flexstore/flexstore.html](http://examples.adobe.com/flex2/inproduct/sdk/flexstore/flexstore.html)。下面的*图
    1.5* 展示了一个 RIA 网站示例。


    ![](img/c4119654311ebf24679359ca130a5ee6_22_0.png)


    RIAs 带来了真正的平台中立性：无论环境如何，相同的应用都呈现相同的外观和感觉。这主要通过使用浏览器插件（适用于各种浏览器和操作系统）作为本地运行时引擎来实现。使用浏览器作为分发机制提供了高度的可部署性。


    富互联网应用消除了传统 Web 应用中常见的大量网络流量，特别是在处理动态页面时。传统 Web 应用通过网络中的系列路由器发送请求，直到到达 Web 服务器。然后，Web
    服务器将 HTML 页面打包并发送回浏览器，浏览器读取 HTML 并显示页面。


    对于动态页面，Web 服务器将请求转发到实现业务逻辑的应用服务器。应用服务器生成动态 HTML 内容，并将其发送回 Web 服务器，再由 Web 服务器转发给浏览器进行显示。动态
    Web 页面的实现效率较低，因为涉及大量的网络流量。


    与瘦客户端 Web 应用相比，RIAs 通过在客户端执行更多处理工作，显著提高了系统性能。RIAs 是有状态的，它们不是由服务器控制的一组页面（如传统 Web
    应用那样），而是在客户端计算机上运行的实际应用程序，仅与服务器通信以处理和数据交换。


    2004 年 3 月，Adobe Flex 以 1.0 版本首次亮相。该版本以及 Adobe Flex 1.5 版本都是昂贵的基于服务器的产品。它们基于 Flash®
    Player 7.0 和 ActionScript 2.0，并且拥有自己的类似 Dreamweaver® 的开发工具，称为 Flex Builder。由于
    ActionScript 2.0 的限制，这些版本从未获得广泛流行。


    随着 2006 年 6 月 Adobe Flex 2 的发布，Flex 成为了一个完全基于客户端的产品。Adobe 从头重写了整个 Flex 框架和 IDE。这一变革的核心是引入了
    ActionScript 3.0。Flex 2 基于 Flash Player 9.0 和 ActionScript 3.0。Adobe 决定不升级类似 Dreamweaver
    的 Flex Builder 1.0，而是开始使用 Eclipse 并提供针对 Eclipse 的 Flex Builder 插件。Adobe Flex 2.0
    提供了一种无需支付高昂许可费即可创建 RIA 的方法。


    2008 年 2 月，Adobe Flex 3 发布。Adobe Flex 3 为 Flex Builder 增加了更多功能，例如重构、增强的样式支持以及
    Flex 框架中新的数据可视化组件。Adobe Flex 3 也是 Flex SDK 和 Flex 编译器的官方开源版本。截至撰写本文时，Adobe Flex
    3 是最新版本的 Flex，本书也将使用此版本。


    Adobe Flex 3 附带了许多新的关键功能，包括：


    - 分析器，用于监控内存和 CPU 消耗

    - 重构功能，使得重命名几乎任何内容（如函数、变量和类）变得容易。

    - Adobe 集成运行时（AIR®）框架，支持构建跨操作系统的富互联网应用程序，这些应用程序可以访问本地桌面资源。

    - 持久缓存，减少 SWF 文件大小。

    - 向导，用于生成代码，从而减少手工编码工作量。

    - 图表增强功能

    - DataGrid 组件，用于显示表格数据。高级 DataGrid 提供了额外的功能，例如多列排序和列跨接。

    - Flex Data Services 现已更名为 LiveCycle® Data Services，现在支持 Ajax 数据服务器。

    - 内存和性能分析器。


    ## 1.2 Flex 应用的优缺点


    如今，Web 开发人员拥有大量选择来开发 RIAs，AJAX 是其中之一。那么为什么使用 Adobe Flex 呢？一个原因是 Adobe Flex 分离了表现层和数据访问层。这意味着
    Flex 应用独立于后端：你可以使用任何满足需求的服务器技术——ColdFusion、J2EE、PHP、.NET 等。由于 Adobe Flex 的很大一部分设计围绕
    XML（甚至 MXML 文档），你可以使用像 HTTPService 调用这样基础的工具来读取和写入数据存储中的数据。


    另一个主要原因是，当你希望创建高度交互式、富有表现力的网站应用，并使用和可视化数据时，Adobe Flex 是理想的技术。Adobe Flex 允许你突破通常静态网页的限制，嵌入小程序，而无需承担诸如
    Java 小应用程序等替代方案的复杂性和兼容性问题。


    以下是考虑为你的网站使用 Adobe Flex 的其他一些理由：


    - 它有助于构建健壮的能够以吸引人的方式显示复杂数据集的应用程序。

    - 它对你的网站访客具有视觉吸引力。

    - 它在所有主要平台上都能工作，用户除了 Flash 播放器外无需安装任何其他东西。

    - 音频和视频允许实现更大的交互性。

    - 数据同步允许更高效地使用实时数据


    另一方面，Adobe Flex 可能不是所有需求的解决方案。例如，如果你计划开发带有简单动画且不编写太多代码的小型应用程序，Flash 可能是基于时间轴的动画工具的最佳选择。Flex
    应用受限于 Flash 玩家的约束。此外，Flex 应用可能体积较大，因为它基于多个库。幸运的是，Adobe Flex 并不强制你使用所有 Flex 组件（甚至
    MXML），并允许使用免费的 Flex 编译器编译 ActionScript 项目。


    如果你计划建立一个需要大量富文本的网站，或者只需要简单的用户交互，使用 HTML/Ajax 可能更好。虽然 Adobe Flex 为 HTML 提供了良好的支持，但如果有很多文本，一些项目可能会遭受一点性能滞后。但是，如果你希望将应用部署到
    AIR，Adobe Flex 是一个不错的选择，因为 AIR 为 HTML 提供了原生支持。对于包含大量文本、动画和部分交互内容的网站，结合使用 Flash
    或 Flex 与 HTML 是一个很好的赌注。


    在多层模型中，Flex 应用可以作为表现层。Flex 应用是基于 Web 的，但提供了一定水平的交互性和丰富的媒体体验，使其看起来更像计算机桌面程序。


    '
