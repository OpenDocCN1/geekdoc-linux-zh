    DB2校园计划通用邮箱：db2univ@ca.ibm.com\n\n## 开始使用Adobe Flex\n\n开始使用Adobe Flex非常简单。阅读本书以便：\n\
    \n- 了解如何使用Adobe Flex构建丰富的互联网应用程序\n- 学习如何使用Flex Builder创建、运行和调试Flex应用程序\n- 了解Adobe\
    \ Flex如何与Web服务和数据库协同工作\n- 使用MXML和ActionScript学习Flex编程基础\n- 快速掌握数据绑定、视图状态和图表等强大功能\n\
    - 通过实践练习进行操作\n\nAdobe Flex是未来的技术；它通过提供一个免费的开源框架来开发丰富的互联网应用程序（RIAs），将您带到Web应用程序开发的下一个层级。Flex\
    \ Builder软件是一个基于Eclipse的IDE，由于它包含许多丰富的功能，可以用来加速您的应用程序开发。通过这个高效的免费开源框架，您可以快速构建和维护非常交互式和直观的Web应用程序，并立即在所有浏览器和桌面上部署！\n\
    \n使用Flex框架，您可以构建企业级软件，该软件可以与其他服务器端技术结合使用，例如PHP、J2EE、ColdFusion、.NET等。您还可以与其他免费软件配合使用，例如DB2\
    \ Express-C（DB2数据库服务器的免费版本）；或者IBM Data Studio，一个免费的基于Eclipse的IDE，可以帮助您在几分钟内开发数据Web服务。\n\
    \n要了解更多信息或下载Adobe Flex Builder 3.0（包含框架）进行90天试用，请访问 [www.adobe.com/products/flex/flexdownloads](http://www.adobe.com/products/flex/flexdownloads)。您也可以下载免费的Flex\
    \ SDK – 它具有Flex Builder的所有功能，除了Flex图表功能。\n\n要了解更多信息或下载DB2 Express-C，请访问 [ibm.com/db2/express](http://ibm.com/db2/express)\n\
    \n要参与社交并观看Flex和DB2视频，请访问 [channelDB2.com](http://channeldb2.com)\n\n本书是DB2 on\
    \ Campus丛书的一部分，该丛书提供免费的社区电子书。在 [db2university.com](http://db2university.com) 上了解更多。\n\
