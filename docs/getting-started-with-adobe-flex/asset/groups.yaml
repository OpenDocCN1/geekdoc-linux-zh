  mdcn: "\n\n- 创建多个 Windows 服务。\n\n## B.3.2 在 Linux 上安装\n\n在 Linux 上安装 DB2 非常直观，需要执行以下基本步骤：\n\
    \n- 以 root 用户登录以安装 DB2。\n- 从 ibm.com/db2/express 下载适用于 Linux 的 DB2 Express-C 后，查找文件\
    \ db2setup，并执行该文件：`./db2setup`\n- 遵循向导提供的自明性说明。通常选择默认值即可。\n- 安装过程中默认执行以下操作：\n\
    \    - DB2 安装在 `/opt/ibm/db2/V9.7`\n    - 创建三个用户 ID。默认值如下：\n        - `db2inst1`（实例所有者）\n\
    \        - `db2fenc1`（用于围栏例程的围栏用户）\n        - `dasusr1`（DAS 用户）\n    - 创建与上述用户\
    \ ID 对应的三个用户组：\n        - `db2iadm1`\n        - `db2fadm1`\n        - `dasadm1`\n\
    \    - 创建实例 `db2inst1`\n    - 创建 DAS `dasusr1`\n    - 安装日志存储位置如下：\n        - `/tmp/db2setup.his`\n\
    \        - `/tmp/db2setup.log`\n        - `/tmp/db2setup.err`\n\n## B.4 DB2 工具\n\
    \nDB2 数据服务器附带多种工具，例如 DB2 控制中心、DB2 命令编辑器等。然而，从 DB2 9.7 版本开始，这些工具中的大部分已被弃用（即仍受支持但不再增强），取而代之的是\
    \ IBM Data Studio。IBM Data Studio 作为一个单独的包提供，不包含在 DB2 中。更多信息，请参阅电子书 *《IBM Data\
    \ Studio for DB2 入门》*。\n\n### B.4.1 控制中心\n\n在 DB2 9.7 之前，用于数据库管理的主要 DB2 工具是控制中心，如图\
    \ B.4 所示。该工具现已弃用，但仍包含在 DB2 服务器中。\n\n![](img/c4119654311ebf24679359ca130a5ee6_215_0.png)\n\
    \n**图 B.4 - DB2 控制中心**\n\n在 Windows 上启动控制中心，请使用 *开始 -> 程序 -> IBM DB2 -> DB2COPY1\
    \ (Default) -> General Administration Tools -> Control Center*，或者在 Windows 命令提示符或\
    \ Linux 终端中输入命令 `db2cc`。\n\n控制中心是一个集中管理工具，允许您：\n\n- 查看您的系统、实例、数据库和数据库对象；\n- 创建、修改和管理数据库及数据库对象；\n\
    - 启动其他 DB2 图形化工具\n\n左侧窗格提供了系统中数据库对象的可视化层次结构，并为表、视图等提供了文件夹。当您双击一个文件夹（例如，如图 B.5\
    \ 所示的表文件夹）时，右上方的窗格将列出所有相关对象，在此情况下，即与 **SAMPLE** 数据库关联的所有表。如果您在右上方窗格中选择某个表，右下方窗格将提供关于该表的更具体信息。\n\
    \n在对象树中的不同文件夹或对象上右键单击，将显示适用于给定文件夹或对象的菜单。例如，在实例上右键单击并选择 *Configure parameters*（配置参数），您可以查看和更新实例级别的参数。同样，如果您对数据库右键单击并选择\
    \ *Configure parameters*，您便可以查看和更新数据库级别的参数。\n\n### B.4.2 命令行工具\n\n有三种类型的命令行工具：\n\
    \n- DB2 命令窗口（仅在 Windows 上）\n- DB2 命令行处理器（DB2 CLP）\n- DB2 命令编辑器（基于 GUI，已弃用）\n-\
    \ 这些工具将在接下来的部分中详细解释。\n\n#### B.4.2.1 DB2 命令窗口\n\nDB2 命令窗口仅适用于 Windows 操作系统；它常被误认为\
    \ Windows 命令提示符。尽管它们外观相同，但 DB2 命令窗口为您设置了操作 DB2 所需的环境。要启动此工具，请使用 Start -> Programs\
    \ -> IBM DB2 -> DB2COPY1 (Default) -> Command Line Tools -> Command Window，或者从\
    \ Windows 命令提示符中输入命令 `db2cmd` 以在另一个窗口中启动它。图 B.5 展示了 DB2 命令窗口。\n\n![](img/c4119654311ebf24679359ca130a5ee6_216_0.png)\n\
    \n**图 B.5 - DB2 命令窗口**\n\n通过查看窗口标题，您可以轻松识别出您正在 DB2 命令窗口中工作，该标题始终包含图中标记高亮的“DB2\
    \ CLP”字样。在 DB2 命令窗口中，所有命令都必须以 `db2` 为前缀。例如，在上图中，发出两条语句：\n\n```\ndb2 connect to\
    \ sample\ndb2 select * from staff\n```\n\n对于 Linux，DB2 命令窗口的等效物是 Linux shell（或终端），其中\
    \ DB2 环境已通过执行 `db2profile` 文件设置好。默认情况下会创建此文件，并将其添加到 DB2 实例所有者的 `.login` 文件中。默认情况下，DB2\
    \ 实例所有者是 `db2inst1`。\n\n#### B.4.2.2 DB2 命令行处理器\n\nDB2 命令行处理器（CLP）与 DB2 命令窗口相同，唯一的例外是提示符是\
    \ `db2=>` 而不是操作系统提示符。要在 Windows 上启动 DB2 命令行处理器，请使用 `Start -> Programs -> IBM DB2\
    \ -> DB2COPY1 (Default) -> Command Line Tools -> Command Line Processor`，或者从 DB2\
    \ 命令窗口或 Linux shell 中输入 `db2` 并按 `Enter`。提示符将如图 B.6 所示更改为 `db2`。\n\n![](img/c4119654311ebf24679359ca130a5ee6_217_0.png)\n\
    \n**图 B.6 - DB2 命令行处理器 (CLP)**\n\n注意，图 B.6 还说明了在 CLP 中工作时，您不需要在命令前加上 `DB2` 前缀。要退出\
    \ CLP，请输入 `quit`。\n\n#### B.4.2.3 DB2 命令编辑器\n\nDB2 命令编辑器是 DB2 命令窗口或 DB2 命令行处理器的\
    \ GUI 版本，如图 B.7 所示。该工具在 DB2 9.7 版本中已弃用。\n\n![](img/c4119654311ebf24679359ca130a5ee6_218_0.png)\n\
    \n**图 B.7 - DB2 命令编辑器**\n\n## B.5 DB2 环境\n\n图 B.8 提供了 DB2 环境的快速概览。\n\n![](img/c4119654311ebf24679359ca130a5ee6_219_0.png)\n\
    \n**图 B.8 - DB2 环境**\n\n该图展示了一个已安装 DB2 Express-C 的服务器。浅绿色的小框（环境变量、数据库管理器配置文件、数据库配置文件、DB2\
    \ 配置注册表）是可以配置 DB2 服务器的不同区域，它们将在下一节中详细解释。较大的深绿色框代表一个实例，在此示例中，该实例的名称为 `myinst`。\n\
    \n实例是可以创建数据库对象的环境。在同一台服务器上，您可以创建多个实例，每个实例都被独立对待。例如，您可以将一个实例用于开发，另一个用于测试，还有一个用于生产。表\
    \ B.1 展示了一些您在实例级别可以使用的有用命令。请注意，本节中显示的命令也可以通过 DB2 GUI 工具执行。\n\n| 命令 | 描述 |\n|---|---|\n\
    | `db2start` | 启动当前实例 |\n| `db2stop` | 停止当前实例 |\n| `db2icrt <instance_name>` |\
    \ 创建新实例 |\n| `db2idrop <instance_name>` | 删除实例 |\n| `db2ilist` | 列出您系统中的实例 |\n\
    | `db2 get instance` | 列出当前活动实例 |\n\n**表 B.1 - 有用的实例级 DB2 命令**\n\n在一个实例内，您可以创建许多数据库。**数据库**是对象（如表、视图、索引等）的集合。例如，在图\
    \ B.8 中，数据库 **MYDB1** 已在实例 `myinst` 中创建。**表 B.2** 展示了一些您在数据库级别可以使用的命令。\n\n| 命令/SQL\
    \ 语句 | 描述 |\n| :--- | :--- |\n| `create database <database_name>` | 创建新数据库 |\n\
    | `drop database <database_name>` | 删除数据库 |\n| `connect to <database_name>` |\
    \ 连接到一个数据库 |\n| `create table/create view/create index` | 分别用于创建表、视图和索引的 SQL 语句\
    \ |\n\n**表 B.2 - 数据库级别的命令和 SQL 语句**\n\n## B.6 DB2 配置\n\n可以使用配置顾问 GUI 工具配置 DB2\
    \ 参数。可以通过控制中心访问配置顾问：右键单击数据库并选择 *Configuration Advisor*（配置顾问）。根据您对系统资源和负载等问题的回答，配置顾问将提供一组建议值的\
    \ DB2 参数列表，这些参数可以最优运行。如果您想更深入了解 DB2 配置，请继续阅读。否则，使用配置顾问后，您就可以开始使用 DB2 了！\n\n如图\
    \ B.8 所示，DB2 服务器可以在四个不同级别进行配置：\n\n- **环境变量**是在操作系统级别设置的变量。需要关注的主要环境变量是 `DB2INSTANCE`。该变量指示您当前操作的实例，您的\
    \ DB2 命令将应用于该实例。\n- **数据库管理器配置文件 (dbm cfg)** 包含影响实例及其包含的所有数据库的参数。*表 B.3* 展示了一些管理\
    \ dbm cfg 的有用命令。\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `get dbm cfg` | 检索有关 dbm cfg\
    \ 的信息 |\n\n"
