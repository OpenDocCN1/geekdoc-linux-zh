    **Figure 4.7** – Sample application output with layout containers


    You can see that it''s very easy to build a decent looking Web page with little
    code and very little time. You can change the size of the left and right pane
    of the HDividedBox – also you can navigate different canvases inside the Accordion
    or TabNavigator.


    # 4.4 Controls


    Controls are the Flex user interface components with which users interact. Controls
    are always placed inside containers. All controls like containers are created
    as a derived class of *mx.core.UIComponent* as shown in **Figure 4.8** below.


    ![](img/c4119654311ebf24679359ca130a5ee6_82_1.png)


    **Figure 4.8** – Class hierarchy of Button and Level controls


    Based on property and usage, Flex controls can be broadly divided into four categories
    which are described in the following sections.


    # 4.4.1 Text-based controls


    Use these controls to display and edit text and related details in your Flex application.
    All controls except *RichTextEditor* are simple controls. *RichTextEditor* has
    more than one control (TextArea, ControlBar and few other formatting ones) as
    part of it. **Table 4.7** lists the Text-based controls in Flex 3.'
  md: "\n## 4.3 Containers\n\nFlex containers can be broadly classified into three\
    \ types: Application, layout, and navigation. Each type is explained in the following\
    \ section with specific examples.\n\n### 4.3.1 Application containers\n\nAn application\
    \ container is the default container for any Flex content or component – as soon\
    \ as you create a new *Application*, this container is created.\n\nIn the Flex\
    \ perspective of Eclipse, select an existing Flex project or create a new one.\
    \ Right click on that project, and choose *New* -> *MXML application*. A small\
    \ window will appear. Enter in the *Filename* field the name of the application.\
    \ Call it *FlexComponent*. The view shown in *Figure 4.5* is displayed.\n\n![](img/c4119654311ebf24679359ca130a5ee6_78_0.png)\n\
    \nIf you click on the source view, the generated code shown in *Listing 4.1* is\
    \ displayed.\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<mx:Application\
    \ xmlns:mx=\"http://www.adobe.com/2006/mxml\"\n\tlayout=\"absolute\">\n</mx:Application>\n\
    ```\n\n**Listing 4.1** – Default generated code when you define an application\n\
    \nThough you can build your application using only an application container, it’s\
    \ not a good practice to do so. You should place other suitable containers before\
    \ using any controls in your application.\n\nBy default, the size of the application\
    \ container is the size of the browser. You can change relative size of the application\
    \ by specifying height & width properties; this way the application will resize\
    \ itself proportionately to the browser size.\n\nThere are few important style\
    \ properties for the application container:\n\n- * backgroundColor: This color\
    \ is visible during application loading and initialization\n- * backgroundGradientAlphas:\
    \ controls the opaqueness of the background\n- * backgroundGradientColors: It\
    \ changes colors from first to second; from top to bottom gradually as given in\
    \ [Top color, Bottom Color]\n- * backgroundImage: Image for the application background\n\
    \nYou should paint a panel or form container in the application container before\
    \ starting to add controls. For example, the code in *Listing 4.2* will put a\
    \ panel for the company website you're going to build.\n\n```xml\n<mx:Application\
    \ xmlns:mx=\"http://www.adobe.com/2006/mxml\" width=\"100%\"\nheight=\"100%\"\
    >\n<mx:Panel title=\"My Company's Web site\" width=\"100%\" height=\"100%\"\n\
    fontSize=\"30\">\n</mx:Panel>\n</mx:Application>\n```\n\n**Listing 4.2** – Defining\
    \ a panel container inside an application\n\nRun the program and you'll see the\
    \ output shown in *Figure 4.6*:\n\n![](img/c4119654311ebf24679359ca130a5ee6_79_0.png)\n\
    \n**Figure 4.6** – Output of the sample application\n\nSome other characteristics\
    \ of an application container are:\n\n- For each application container defined\
    \ by the `<mx:Application>` tag, there is an application object associated with\
    \ it. The application object can be referred using mx.core.Application.application\
    \ from anywhere in the Flex application.\n- The Application class supports a preloader\
    \ that uses a download progress bar to show the download progress of an application\
    \ SWF file. This is discussed in more detail in the exercise section.\n\n### 4.3.2\
    \ Layout containers\n\nA layout container is a rectangular area rendered on the\
    \ Flash Player during runtime of a Flex application. It controls the size and\
    \ position of the child container and controls painted within it. You can think\
    \ of layout containers as place holders for other controls and containers. *Table\
    \ 4.1* lists the layout containers in Flex 3.0.\n\n| Container Name | Usage/Description\
    \ |\n|---|---|\n| Canvas | Rectangular region which needs specific positioning\
    \ (non- automatic) of child components |\n| Box | Rectangular layouts where components\
    \ are placed either horizontally or vertically |\n| HBox | |\n| VBox | |\n| ControlBar\
    \ | Container used in Panel or TileWindow which holds components shared with other\
    \ children in parent component |\n| ApplicationControlBar | Container holds components\
    \ which provides access to application navigation controls |\n| DividedBox | |\n\
    | HDividedBox | |\n| VDividedBox | |\n| Form | Form is the most commonly used\
    \ container which allows validation, data binding and usage of style sheets. FormHeading\
    \ is an optional heading group of FormItem Components. FormItem is a specific\
    \ form element with a single label and one or more child components |\n| FormHeading\
    \ | |\n| FormItem | |\n| Grid | Grid layout container arranges its child components\
    \ as rows and columns – similar to an HTML table |\n| Panel | Panel layout container\
    \ consists of title bar, title, a border, content area and a status area |\n|\
    \ Tile | Tile layout container which lays out child components in horizontal or\
    \ vertical alignments. All containing cells are of same size. |\n| TileWindow\
    \ | TileWindow layout container optimized for usage as pop-up window |\n\n**Table\
    \ 4.1** – Layout containers in Flex\n\n**Note:**\nIn the above and following tables,\
    \ there are some containers that do not have an icon associated to it. For example,\
    \ Box – Usually they are by default replaced by one if the sub-classes (e.g. HBox\
    \ in this case). In some cases, few controls can only be rendered by ActionScript\
    \ – no MXML equivalent like Menu. In summary, you can’t drag and drop those controls\
    \ – you can create them using ActionScript only.\n\n### 4.3.3 Navigation containers\n\
    \nNavigation containers hold other containers so that you can navigate among its\
    \ children.\n*Table 4.2* contains the list of Navigation containers in Flex 3.\n\
    \n| Container Name | Usage/Description |\n|---|---|\n| ViewStack | This container\
    \ is made of a collection of child containers which are stacked on top of each\
    \ other. Only one child can be visible or active at a time. |\n| TabNavigator\
    \ | This container creates, holds and manages a set of tabs — each tab in turn\
    \ can hold other containers. |\n| Accordion | This container defines and holds\
    \ a set of child active containers where only one container is fully visible at\
    \ a time |\n\n**Table 4.2** – Navigation containers in Flex\n\nThe following section\
    \ will show you some examples of the above containers. For illustration purposes,\
    \ we will use some controls which are described in the next sections.\n\nTo see\
    \ some of the above containers in action, let’s continue with the earlier example:\n\
    \n1. Select a HDividedBox container and put it inside the Application container.\n\
    2. Put an Accordion container on the left hand side.\n3. Place a TabNavigator\
    \ container on the right hand side of the HDividedBox container.\n4. Draw three\
    \ Canvas containers inside the TabNavigator container.\n\nWe’ll adjust some simple\
    \ properties for the containers to fit them nicely on the screen starting from\
    \ the generated MXML code shown in *Listing 4.3* below.\n\n```xml\n<?xml version=\"\
    1.0\"?>\n<!-- containers\\application\\AppSizePercent.mxml -->\n<mx:Application\
    \ xmlns:mx=\"http://www.adobe.com/2006/mxml\" width=\"100%\"\nheight=\"100%\"\
    >\n<mx:Panel title=\"My Company's Web site\" width=\"100%\" height=\"100%\"\n\
    fontSize=\"30\">\n<mx:HDividedBox width=\"100%\" height=\"95%\">\n<mx:Accordion\
    \ x=\"40\" y=\"32\" width=\"15%\" height=\"100%\"\nmaxWidth=\"300\">\n<mx:Canvas\
    \ label=\"Accordion Pane 1\" width=\"100%\" height=\"100%\">\n</mx:Canvas>\n</mx:Accordion>\n\
    <mx:TabNavigator width=\"85%\" height=\"100%\">\n<mx:Canvas label=\"Tab 1\" width=\"\
    100%\" height=\"100%\">\n</mx:Canvas>\n<mx:Canvas label=\"Tab 2\" width=\"100%\"\
    \ height=\"100%\">\n</mx:Canvas>\n</mx:TabNavigator>\n</mx:HDividedBox>\n</mx:Panel>\n\
    </mx:Application>\n```\n\n**Listing 4.3** – code for sample navigation containers\n\
    \nThe output of the code is shown below:\n\n![](img/c4119654311ebf24679359ca130a5ee6_82_0.png)\n\
    \n**Figure 4.7** – Sample application output with layout containers\n\nYou can\
    \ see that it's very easy to build a decent looking Web page with little code\
