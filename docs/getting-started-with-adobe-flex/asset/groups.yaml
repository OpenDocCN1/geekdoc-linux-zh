  - "[PAGE 144]\n\n# 7.3.2 **<mx:method>** tag\n\nAn **<mx:RemoteObject>** can have\
    \ multiple **<mx:method>** tags as child tags. The **<mx:method>** tag specifies\
    \ the operations or methods pertaining to the remote object. The syntax for this\
    \ tag is shown in *Listing 7.8* below.\n\n```\n<mx:method\n    concurrency=\"\
    multiple|single|last\"\n    name=\"No default, required.\"\n    makeObjectsBindable=\"\
    false|true\"\n    fault=\"No default.\"\n    result=\"No default.\"\n/>\n\n```\n\
    \n*Listing 7.8* - Syntax of the **<mx:method>** tag\n\n# 7.3.3 **<mx:arguments>**\
    \ tag\n\nAn **<mx:method>** tag can have a single **<mx:arguments>** tag as child\
    \ tag. This tag represents an array of objects to be sent as parameter to the\
    \ remote object’s method in an order.\n\n```\n<mx:arguments></mx:arguments>\n\n\
    ```\n\n> Note:\n> It is beyond the scope of this book to discuss the usage of\
    \ remote object in Flex applications as it uses the Flex Data Services.\n\n# 7.4\
    \ Using HTTPService\n\nAnother tool that Flex provides for accessing remote data\
    \ is the **HttpService Request Object**. The flex application will send an HttpService\
    \ request to access remote data. Since Flex does not directly interact with the\
    \ database, a Web server will respond to the Http Service Request by querying\
    \ the database and returning the results. *Figure 7.5* shows how Flex uses HttpService\
    \ for communicating with the data server."
  - '[PAGE 145]


    ![](img/c4119654311ebf24679359ca130a5ee6_145_0.png)


    **Figure 7.5 – Flex using HTTPService for communication with Data Server**


    In the above diagram you can see that the Flex application is sending an HttpService
    request to the Web server which will send a corresponding data request to the
    database (data server). The data returned by the database is captured by the server
    side technology such as Java Server Pages (JSP), Java servlets, Cold Fusion pages,
    PHP pages, Ruby on Rails or Microsoft ASP pages, and formatted to be sent back
    to the Flex application.


    # 7.4.1 The `<mx:HTTPService>` tag


    Flex provides an `<mx:HTTPService>` tag to represent an HTTPService object in
    the MXML file. The url property of this object is used to specify the url to which
    the request has to be made. Optionally, you can pass parameters to the specified
    url. For example:


    ```

    <mx:HTTPService id="myHTTPService" method="POST" url =

    "data/employee.xml"/>

    ```


    Here the url is a path relative to the position of the SWF file.


    # 7.4.2 The send() method


    The above declaration does not make the HTTPService call. A **send()** method
    is used for this purpose which tells the HTTPService object to connect to the
    url. Depending on when you want to make the HTTP call, the **send()** method can
    be associated with either a system event or a user event. The **send()** method
    can be called on a system event as follows:


    ```

    <mx:Application xmlns:mx="http://www.adobe.com/2009/mxml"

    layout="absolute" creationComplete="myHTTPService.send()" >

    ```


    And it can be called on a user event as follows:


    ```

    <mx:Button label="Send HTTP" click="myHTTPService.send()" x="100" y="20"/>

    ```'
  - "[PAGE 146]\n\n# **7.4.3 The <mx:Request> tag**\n\nAn `mx:Request` tag can be\
    \ placed inside a `mx:HTTPService` tag to specify the values for any parameters\
    \ the Web service requires. Nested inside the `mx:Request` tag will be the tags\
    \ that have the name of the parameter and these tags will have the value.\n\n\
    ```\n<mx:HTTPService>\n    <mx:Request>\n        <deptId>{dept.selectedItem.data}</deptId>\n\
    \    </mx:Request>\n</mx:HTTPService>\n```\n\n**Listing 7.9 - <mx:Request> tag**\n\
    \n# **7.4.4 The lastResult property**\n\nThe response of the request will be returned\
    \ to the lastResult property of the HTTPService object. This response contains\
    \ the entire object returned by the Web server. The lastResult property can be\
    \ data binded to a data grid or the result can be converted to an ArrayCollection\
