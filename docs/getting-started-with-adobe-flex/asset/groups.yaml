    # 6


    # Chapter 6 - Working with view states, transitions and filters


    In this chapter, you will learn the basics of how to change the look and feel
    of the application interface based on the task that a user is performing. Example
    of this includes changing the image of an icon when a user rolls a mouse over
    it. Using view states, transitions and filters, rich internet applications can
    be built without much hassle.


    In this chapter you will learn about:


    +   - View states

    +   - Using components with states

    +   - Using effects

    +   - Using transition

    +   - Using filters in effects


    # 6.1 Working with view states, transitions and filters: The big picture


    View states allow you to change the appearance of an application in response to
    some user action. Transitions allow you to define, how this change in the view
    state appears to the user on screen. A transition is defined with the help of
    effect classes, in combination of different effects that are designed specifically
    to handle transitions. Figure 6.1 provides an overview of the relationship between
    these concepts.


    ![](img/c4119654311ebf24679359ca130a5ee6_114_0.png)'
  - '[PAGE 115]


    ![](img/c4119654311ebf24679359ca130a5ee6_115_0.png)


    In the figure, *View State 1* is the initial state of the UI. When the defined
    *transition* is applied to this view state the UI changes to *View State 2*. A
    transition is defined using different effects (*Effect 1, Effect 2... Effect N*).
    These effects can be applied conditionally using different *filters* along with
    effects. Filters are used to conditionally apply the defined effects only on a
    subset of target components defined in the *transition*.


    # 6.2 View states


    *States* are a collection of changes to a view. Let us say that we have a view
    with many components (containers and controls). Then, if any change occurs to
    the layout of any of these view components, then it becomes a view state. Every
    component that inherits the `UIComponent` class will have view states and these
    components will inherit the states property.


    # 6.2.1 Creating States


    States can be easily created in Flex Builder using the design view. Let us see
    how this can be done using a simple example. Follow these steps:


    +   1. Create a new Flex project.


    +   2. Switch to design view and using the layout tools, add two components, a
