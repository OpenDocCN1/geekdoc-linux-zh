    \ 使用 `currentState` 属性。\n    - 2) 使用 `stateChanged` 事件\n    - 3) 使用 `newState`\
    \ 属性\n    - 4) 使用 `UIComponent` 的 `setCurrentState()` 方法。\n\n# 第 7 章 - 与服务器交互\n\
    \n现实生活中的大多数应用程序都需要检索、操纵和存储数据。由于性能等许多原因，尽可能在靠近数据存储的地方处理数据是理想的。因此，Flex 应用程序经常需要与后端服务器进行交互。在当前语境下，“服务器”一词主要指应用服务器。\n\
    \n在本章中，你将了解：\n\n- 与远程 Web 服务器通信的不同方式\n- 使用 Web 服务\n- 使用远程对象\n- 使用 HTTPS 服务对象\n\
    - 与数据库交互\n\n### 7.1 与服务器交互：大局观\n\n大多数 Flex 应用程序需要访问 Web 服务器。Flex 通过其提供的 **RPC**（远程过程调用）服务使这项工作变得简单。RPC\
    \ 服务提供了一种调用-响应模型来访问远程数据，并基于面向服务架构公开组件。Flex 中有三个 RPC 类：\n\n- ***WebService 类***\
    \ 允许你访问 Web 服务或设置远程操作的软件模块。\n- ***RemoteObject 类*** 允许你访问远程类的公共方法\n- ***HTTPService\
    \ 类*** 帮助你针对特定 URL 执行 GET 或 POST 的 Http 请求。\n\n你很快就会详细了解这些类，并配有它们在 Flex 中如何使用的示例。*图\
    \ 7.1* 提供了 Flex 应用程序与服务器通信的概览。\n\n![](img/c4119654311ebf24679359ca130a5ee6_137_0.png)\n\
    \n**图 7.1 – 与服务器通信的 Flex 应用程序**\n\n在图中，你可以看到典型的 Flex 应用程序如何与应用服务器通信。左边是浏览器，它使用\
    \ HTML 或其他客户端脚本语言与服务器通信。图中的 Flex 应用程序 app.swf 嵌入在 HTML 文件中，并包含使用 Web 服务（使用 SOAP（简单对象访问协议）和\
    \ XML）或 HTTP 服务（使用简单文本或 XML）与服务器通信的逻辑。Flex 还可以直接与服务器通信，并使用其远程对象调用 API 直接访问远程对象，该\
    \ API 进而使用 AMF（Action 消息格式）。\n\n### 7.2 使用 Web 服务\n\n根据 oas-is-open 的定义，“Web 服务是一种通过\
    \ WSDL 描述的软件组件，能够通过网络协议（包括但不限于通过 HTTP 的 SOAP）进行访问”。底层实现可以是 Java、.Net、PHP、Ruby\
    \ 或其他语言。\n\n在下面图 7.2 中，你可以看到服务提供者可以公开其希望向服务请求者提供的服务列表。\n\n![](img/c4119654311ebf24679359ca130a5ee6_137_1.png)\n\
    ![](img/c4119654311ebf24679359ca130a5ee6_137_2.png)\n\n**图 7.2 – Web 服务架构**\n\n\
    业务逻辑可以是 Java、.Net 或任何其他语言。为了将应用程序公开到外部世界，服务提供者使用 Web 服务，该服务使用 HTTP 和 SOAP（简单对象访问协议）等标准协议。Web\
    \ 服务包装器的功能是监听 SOAP 调用，然后使用输入 XML 调用业务应用程序。服务请求者可以通过 WSDL（Web 服务描述语言）文件获取服务提供者公开的\
    \ Web 服务列表，并根据 WSDL 文件请求所需的信息。服务请求者需要一个 Web 服务客户端代理来调用 WSDL 文件中定义的方法。客户端代理允许请求者像调用本地方法一样调用\
    \ Web 服务 API。\n\nFlex 可以交互定义其接口为 WSDL 1.1 格式的 Web 服务，该格式可作为 URL 获取。WSDL 是一种标准格式，它描述了\
    \ Web 服务理解的消息形式、响应消息的格式、响应消息的目的地以及用于发送这些消息的协议。Flex 可以接口化 .NET、Java、ColdFusion、PHP\
    \ 和 Ruby 的 Web 服务。Flex Web 服务 API 通常支持 SOAP 1.1、XML Schema 1.0 以及 WSDL 1.1 RPC-encoded、RPC-literal\
    \ 和 document-literal。术语 *encoded* 和 *literal* 表示服务使用的 WSDL 到 SOAP 映射类型。\n\n下面*图\
    \ 7.3* 展示了 Flex 如何调用 Web 服务，以及如何使用不同的标签和方法。这些将在下一节中详细解释。\n\n![](img/c4119654311ebf24679359ca130a5ee6_138_0.png)\n\
    \n**图 7.3 – Web 服务标签和方法调用**\n\nFlex 应用程序接受格式化为 SOAP 消息的 Web 服务请求和响应。它定义了 Web 服务客户端（如\
    \ Flex 应用程序）与 Web 服务之间可以交换的数据格式。\n\n"
