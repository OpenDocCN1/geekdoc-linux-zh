    \   - B. BlendMode.ADD\n    - C. BlendMode.LIGHTEN\n    - D. BlendMode.INVERT\n\
    \    - E. None of the above\n- Which of the following is not a type of blend mode\
    \ from the BlendMode class? .\n    - A. BlendMode.DIFFERENCE\n    - B. BlendMode.SOFTLIGHT\n\
