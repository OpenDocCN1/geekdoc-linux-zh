    \        <mx:Component>\n            <mx:NumericStepper stepSize=\"5\"    minimum=\"\
    10\"\n                maximum=\"50\"/>\n        </mx:Component>\n    </mx:itemRenderer>\n\
    </mx:DataGridColumn>\n```\n\n**Listing 5.24** - 使用内联项渲染器的示例\n\n### 5.5.3 自定义项渲染器\n\
    \n自定义项渲染器提供了最高的灵活性，无论是易用性还是分离性。ItemRenderer 可以位于单独的 MXML 文件中，以便该类可以被多次重用，如果需要做出更改，只需执行一次即可。我们可以使用下方代码片段中所示的自定义渲染器。类\
    \ **custom.Renderer** 是一个可以单独创建的自定义 Flex 文件。\n\n```xml\n<mx:DataGridColumn dataField=\"\
    Qty\" headerText=\"Qty\"\n    editorDataField=\"value\"    itemRenderer=\"custom.Renderer\"\
    >\n```\n\n## 5.6 摘要\n\n本章讨论了数据绑定以及实现它的不同方式。它还讨论了 Flex 提供的不同数据存储机制以及数据驱动的 UI 控件。你了解了\
    \ Flex 如何使数据处理变得非常容易。本章的目标是让你对数据绑定以及 UI 数据驱动控件如何内在地使用数据绑定有一个非常基本的了解。本章还探讨了如何使用项渲染器来定制数据驱动\
