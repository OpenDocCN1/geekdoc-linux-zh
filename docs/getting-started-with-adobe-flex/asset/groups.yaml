    # **8.5 Line chart example**


    In this example you will see how to format the line chart using the **form** property.
    This property can have the following values:


    +   • **segment:** Draws lines as connected segments that are angled to connect
    at each data point in the series. This is the default.

    +   • **step:** Draws lines as horizontal and vertical segments. At the first
    data point, draws a horizontal line, and then a vertical line to the second point.
    Repeats this for each data point.

    +   • **reverseStep:** Draws lines as horizontal and vertical segments. At the
    first data point, draws a vertical line, and then a horizontal line to the second
    point. Repeats this for each data point.

    +   • **Vertical:** Draws the vertical line only from the y-coordinate of the
    first point to the y-coordinate of the second point at the x-coordinate of the
    second point. Repeats this for each data point.

    +   • **Horizontal:** Draws the horizontal line only from the x-coordinate of
    the first point to the x-coordinate of the second point at the y-coordinate of
    the first point. Repeats this for each data point.

    +   • **Curve:** Draws curves between data points.


