    false|true\"\n    fault=\"No default.\"\n    result=\"No default.\"\n/>\n```\n\
    \n*Listing 7.8* - `<mx:method>` 标签的语法\n\n## 7.3.3 `<mx:arguments>` 标签\n\n`<mx:method>`\
    \ 标签可以有一个 `<mx:arguments>` 标签作为子标签。该标签表示一个对象数组，用于按顺序作为参数发送到远程对象的方法中。\n\n```xml\n\
    <mx:arguments></mx:arguments>\n```\n\n> 注意：讨论 Flex 应用程序中远程对象的使用超出了本书的范围，因为它使用的是\
    \ Flex Data Services。\n\n## 7.4 使用 HTTPService\n\nFlex 提供的另一种用于访问远程数据的工具是 **HttpService\
    \ 请求对象**。Flex 应用程序将发送 HttpService 请求来访问远程数据。由于 Flex 并不直接与数据库交互，Web 服务器将通过查询数据库并返回结果来响应\
    \ Http Service 请求。*Figure 7.5* 展示了 Flex 如何使用 HttpService 与数据服务器进行通信。\n\n![](img/c4119654311ebf24679359ca130a5ee6_145_0.png)\n\
    \n**Figure 7.5 – Flex 使用 HTTPService 与数据服务器通信**\n\n在上述图中，你可以看到 Flex 应用程序正在向 Web\
    \ 服务器发送一个 HttpService 请求，该服务器随后将向数据库（数据服务器）发送相应的数据请求。数据库返回的数据将由服务器端技术（如 Java Server\
    \ Pages (JSP)、Java servlets、Cold Fusion 页面、PHP 页面、Ruby on Rails 或 Microsoft ASP\
    \ 页面）捕获，并格式化后发送回 Flex 应用程序。\n\n### 7.4.1 `<mx:HTTPService>` 标签\n\nFlex 提供了一个 `<mx:HTTPService>`\
    \ 标签来表示 MXML 文件中的 HTTPService 对象。该对象的 url 属性用于指定请求的目标 url。可选地，你可以向指定的 url 传递参数。例如：\n\
    \n```xml\n<mx:HTTPService id=\"myHTTPService\" method=\"POST\" url=\"data/employee.xml\"\
    />\n```\n\n这里的 url 是相对于 SWF 文件位置的路径。\n\n### 7.4.2 send() 方法\n\n上述声明并不会触发 HTTPService\
    \ 调用。为此使用 **send()** 方法，它指示 HTTPService 对象连接到 url。根据你希望发起 HTTP 调用的时机，**send()**\
    \ 方法可以与系统事件或用户事件相关联。可以在系统事件上调用 **send()** 方法，如下所示：\n\n```xml\n<mx:Application\
    \ xmlns:mx=\"http://www.adobe.com/2009/mxml\"\nlayout=\"absolute\" creationComplete=\"\
    myHTTPService.send()\" >\n```\n\n也可以在用户事件上调用，如下所示：\n\n```xml\n<mx:Button label=\"\
    Send HTTP\" click=\"myHTTPService.send()\" x=\"100\" y=\"20\"/>\n```\n\n### 7.4.3\
    \ `<mx:Request>` 标签\n\n可以在 `mx:HTTPService` 标签内部放置一个 `mx:Request` 标签，以指定 Web 服务所需的任何参数的值。在\
    \ `mx:Request` 标签内部嵌套的是具有参数名称的标签，这些标签将包含具体的值。\n\n```xml\n<mx:HTTPService>\n  \
    \  <mx:Request>\n        <deptId>{dept.selectedItem.data}</deptId>\n    </mx:Request>\n\
    </mx:HTTPService>\n```\n\n**Listing 7.9 - `<mx:Request>` 标签**\n\n### 7.4.4 lastResult\
    \ 属性\n\n请求的响应将返回到 HTTPService 对象的 lastResult 属性。此响应包含由 Web 服务器返回的完整对象。lastResult\
    \ 属性可以绑定到数据网格，或者将结果转换为 ArrayCollection，然后将其绑定到数据网格。\n\n### 7.4.5 使用 HTTPService\
    \ 的示例应用程序\n\n现在你可以使用到目前为止所学的知识，创建一个发起 HTTPService 请求并接收 xml 数据（该数据将绑定到数据网格）的 Flex\
    \ 应用程序。请遵循以下步骤：\n\n1. 创建一个 Flex 项目并新建一个 MXML 文件。\n2. 向项目中添加一个 data 文件夹，并创建一个 xml\
    \ 文件，其内容如 **Listing 7.10** 所示。\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    ?>\n<data>\n    <employee>\n        <employee_id> 3456</employee_id>\n       \
    \ <employee_name>Peter Sand</employee_name>\n        <designation>Software Engineer</designation>\n\
    \    </employee>\n    <employee>\n        <employee_id> 5368</employee_id>\n \
    \       <employee_name>Maria Rachell</employee_name>\n        <designation>Lead\
    \ Architect</designation>\n    </employee>\n    <employee>\n        <employee_id>\
    \ 8245</employee_id>\n        <employee_name>Renuka Sharma</employee_name>\n \
    \       <designation>Associate Software engineer</designation>\n    </employee>\n\
    </data>\n```\n\n**Listing 7.10 – data.xml 文件**\n\n3. 首先，在 Application 标签下方添加 `<mx:HTTPService>`\
    \ 标签，并指定 xml 文件的相对路径，如下所示：\n\n```xml\n<mx:HTTPService id=\"myHTTPService\" url=\"\
    data/employee.xml\" />\n```\n\n4. 按照下面 Listing 7.11 所示，在 HTTPService 标签之后向应用程序添加\
    \ DataGrid 来定义图形用户界面。\n\n```xml\n<mx:Panel x=\"389\" y=\"195\" width=\"350\" height=\"\
    333\"\n      layout=\"absolute\">\n    <mx:DataGrid id=\"myDataGrid\"\n      dataProvider=\"\
    {myHTTPService.lastResult.data.employee}\" x=\"0\"\n      y=\"0\"\n      height=\"\
    293\" width=\"330\">\n      <mx:columns>\n        <mx:DataGridColumn headerText=\"\
    Employee id\"\n          dataField=\"employee_id\" />\n        <mx:DataGridColumn\
    \ headerText=\"Name\"\n          dataField=\"employee_name\"\n          />\n \
    \       <mx:DataGridColumn headerText=\"Designation\"\n          dataField=\"\
    designation\" />\n      </mx:columns>\n    </mx:DataGrid>\n</mx:Panel>\n```\n\n\
    **Listing 7.11 – 定义用户界面**\n\nDataGrid 的 dataProvider 链接到 lastResult 属性，该属性包含由调用返回的\
    \ xml 结构。\n\n5. 如下所示，在应用程序的 creationComplete 事件上调用 send() 方法。\n\n```xml\n<mx:Application\
    \ xmlns:mx=\"http://www.adobe.com/2009/mxml\"\n      layout=\"absolute\" creationComplete=\"\
    myHTTPService.send()\" >\n```\n\n6. 现在你可以保存并运行应用程序，看看如何用如此少的代码即可发起 http 服务请求，并在数据网格中显示\
    \ xml 文件中的数据，如下面的 Figure 7.6 所示。\n\n![](img/c4119654311ebf24679359ca130a5ee6_148_0.png)\n\
    \n**Figure 7.6 – 数据网格显示 xml 内容**\n\n### 7.4.6 使用 result 和 fault 事件\n\n如果你尝试运行上述示例应用程序，响应很可能很快返回；然而，在实际应用中，你可能会经常遇到响应需要很长时间的情况，而且你可能不知道你的应用程序是否真的在工作，或者是否发生了某些错误。Flex\
    \ 为 HTTPService 类提供了两个属性，result 和 fault，它们有助于管理 HTTP 请求期间可能发生的错误。这些属性实际上是事件，可以像下面所示那样链接到事件处理程序。\n\
    \n```xml\n<mx:HTTPService id=\"myHTTPService\" url=\"data/states.xml\"\nresult=\"\
    resultHandler(event)\" fault=\"faultHandler(event)\"/>\n```\n\n这些处理程序应在 Listing\
    \ 7.12 的 ActionScript 代码中提供。\n\n```actionscript\n<mx:Script>\n    <![CDATA[\n\
    \        import mx.rpc.events.ResultEvent;\n        import mx.rpc.events.FaultEvent;\n\
    \        \n        private function resultHandler(e:ResultEvent):void\n      \
    \  {\n        }\n        \n        private function faultHandler(e:FaultEvent):void\n\
    \        {\n        }\n    ]]>\n</mx:Script>\n```\n\n**Listing 7.12 – 使用 Result\
    \ 和 Fault 事件**\n\n### 7.4.7 使用 E4X 格式\n\nHTTPService 对象具有一个 **ResultFormat** 属性，用于设置\
    \ LastResult 对象的数据类型。默认情况下，此属性的类型为 Object。**ResultFormat** 属性还可以接受数组格式、xml、flashvars、text\
    \ 或 E4X（ECMAScript for XML）的值。此格式允许在 XML 节点之间导航，并跳过节点以访问子节点。你还可以在 xml 文件中搜索字符串，并基于某些集合过滤数据\n\
    \n"
