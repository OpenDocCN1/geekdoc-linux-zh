  mdcn: "\n\n## 5.4.4 分层数据控件\n\nFlex 具有一些分层数据驱动的控件，当数据本身具有分层特性（即所有数据项都拥有父子关系）时，这些控件非常有用。主要的分层数据控件包括：\n\
