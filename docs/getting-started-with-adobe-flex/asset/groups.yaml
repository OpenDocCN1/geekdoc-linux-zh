  mdcn: "\n## 7.3.2 `<mx:method>` 标签\n\n`<mx:RemoteObject>` 可以有多个 `<mx:method>` 标签作为子标签。`<mx:method>`\
    \ 标签指定了与远程对象相关的操作或方法。该标签的语法如下面的 *Listing 7.8* 所示。\n\n```xml\n<mx:method\n    concurrency=\"\
