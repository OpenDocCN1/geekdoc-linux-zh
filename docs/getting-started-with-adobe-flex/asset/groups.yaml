    \n**Figure 6.6 - State when the user clicks the *Change* button for the second\
    \ time**\n\n11. Creating different states is simple by using the design view but\
    \ you need to know all the code that is created in the background. So let us have\
    \ a look at these new tags.\n\n##### 6.2.1.1 The <mx:states> tag\n\nThe states\
    \ property defines an array of view states for a view component. Every view component\
    \ will have a base state, which is the first state. The base state is the default\
    \ state of any Flex application. The states property cannot be specified on any\
    \ child controls. It can only be specified on the root of a custom control or\
    \ application.\n\n##### 6.2.1.2 The <mx:State> tag\n\nA State object can be added\
    \ to the state property of the component. Adding so, will create new view states\
    \ for that component.\n\nSyntax of the <mx:State> tag:\n\n```xml\n<mx:State basedOn=\"\
    null\" name=\"null\" overrides=\"null\"/>\n```\n\nThe basedOn attribute specifies\
    \ the view state on which it is based on and the name attribute specifies the\
    \ name of the current State object. The purpose of a state is to alter the appearance\
    \ of a component in response to a user or system-initiated event, for example,\
    \ the click of a button. Altering the appearance of a component involves the use\
    \ of overrides via a state. Valid overrides include:\n\n- AddChild\n- RemoveChild\n\
    - SetEventHandler\n- SetProperty\n- SetStyle\n\n#### 6.2.2 State properties, style\
    \ and events\n\nIn order to further customize a state in terms of look and feel\
    \ and behavior, the following tags can be used.\n\n##### 6.2.2.1 The <mx:SetEventHandler>\
    \ tag\n\nThe <mx:SetEventHandler> tag allows you to create event listeners that\
