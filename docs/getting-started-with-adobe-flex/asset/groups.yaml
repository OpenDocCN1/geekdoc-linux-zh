    \  makeObjectsBindable=\"false|true\"\n        fault=\"No default.\"\n       \
    \ result=\"No default.\"\n/>\n```\n```\n\n# **Listing 7.7 - Syntax of the <mx:RemoteObject>\
    \ tag**"
  md: "\n## 7.2.1 The <mx:WebService> tag\n\nFlex provides the <mx:WebService> tag\
    \ to use in MXML files. The Flex compiler reads the WSDL referenced in the tag\
    \ and compiles it into a corresponding ActionScript code with the desired behavior.\
    \ The `wsdl` property specifies the location of the WSDL file over HTTP. Optionally,\
    \ the `showBusyCursor` property can be used to show a busy cursor until a result\
    \ is received from the service provider. Listing 7.1 illustrates the <mx:WebService>\
    \ tag including the `showBusyCursor` property.\n\n```xml\n<mx:WebService\n   \
    \  concurrency=\"multiple|single|last\"\n     fault=\"No default.\"\n     id=\"\
    No default.\"\n     load=\"No default.\"\n     port=\"No default.\"\n     protocol=\"\
    http|https\"\n     result=\"No default.\"\n     service=\"No default.\"\n    \
    \ serviceName=\"No default.\"\n     showBusyCursor=\"false|true\"\n     wsdl=\"\
    No default.\">\n</mx:WebService>\n```\n\n**Listing 7.1 - The <mx:WebService> tag**\n\
    \n## 7.2.2 The send() method\n\nThe Web service does not get invoked unless a\
    \ call to the `send()` method is made. Parameters for the operation can be specified\
    \ in the `send()` method itself. Below is an example where `send()` is called:\n\
    \n```actionscript\nservice.GetLocationInfoForPhoneNumber.send(areaCode.text,\n\
    \                                   threeDigits.text);\n```\n\n## 7.2.3 The ResultEvent\
    \ object\n\nThis event indicates that the operation has successfully returned\
    \ the result. It has a `result` property which holds the result returned by the\
    \ service provider. Listing 7.2 illustrates the usage of ResultEvent.\n\n```actionscript\n\
    import mx.rpc.events.ResultEvent;\n\nprivate function onResult(event:ResultEvent):void{\n\
    \    searching=false;\n    if(event.result.ServiceResult.Count==0){\n        output.text\
    \ =\n                   event.result.ServiceResult.StatusDescription;\n\n    \
    \    return;\n    }\n}\n```\n\n**Listing 7.2 – Using ResultEvent**\n\nIn the above\
    \ code listing, the `ServiceResult.Count` is customary to the example being used\
    \ and is not used in all cases. Here it checks if any information is available\
    \ for a given area code and prefix. The complete code listing is available in\
    \ section 7.2.10.\n\n## 7.2.4 The FaultEvent object\n\nThis event is dispatched\
    \ when the Web service call has a fault. The `fault` property holds the information\
    \ about the cause for failure.\n\nListing 7.3 illustrates the usage of the FaultEvent\
    \ handler.\n\n```actionscript\nimport mx.rpc.events.FaultEvent;\n\nprivate function\
    \ onFault(event:FaultEvent):void{\n    isSearching = false;\n    info.text = event.fault.message.toString();\n\
    }\n```\n\n**Listing 7.3 – Using FaultEvent**\n\nThe above code listing shows the\
    \ piece of code that gets executed when a FaultEvent is raised by the Web service\
    \ call. Here the client is presented with the reason for the FaultEvent.\n\n##\
    \ 7.2.5 The result property\n\nThe `result` property specifies the operation to\
    \ be performed when the Web service sends the response back to the client. For\
    \ example:\n\n```xml\n<mx:WebService id=\"ws\" result=\"onResult(event)\" />\n\
    ```\n\n## 7.2.6 The fault property\n\nThe `fault` property specifies the operation\
    \ to be performed when the Web service returns an exception as response to the\
    \ client. For example:\n\n```xml\n<mx:WebService id=\"ws\" result=\"onFault(event)\"\
    \ />\n```\n\n## 7.2.7 The service property\n\nThe user can alternatively specify\
    \ the `serviceName` instead of using the `wsdl` property. In this case the WSDL\
    \ related information can be stored on the server in the `flex-config.xml`.\n\n\
    ## 7.2.8 The <mx:operation> tag\n\nThe <mx:WebService> tag can optionally have\
    \ <mx:operation> tags that represent Web service operations. Below is the syntax\
    \ for the <mx:operation> tag.\n\n```xml\n<mx:operation\n    concurrency=\"multiple|single|last\"\
    \n    fault=\"No default.\"\n    name=\"No default, required\"\n    result=\"\
    No default.\"\n    resultFormat=\"object|xml\"\n/>\n```\n\n## 7.2.9 The <mx:request>\
    \ tag\n\nThe <mx:operation> tag can have a single <mx:request> child tag which\
    \ looks like this:\n\n```xml\n<mx:request format=\"object|xml\">\n</mx:request>\n\
    ```\n\nThis tag can have child tags. If the format specified is `object`, then\
    \ the child tags represent the named parameters sent to the service, where the\
    \ order of the parameters is not important. If the format specified is `xml`,\
    \ then the body represents the SOAP message sent to the service.\n\n## 7.2.10\
    \ Sample Application\n\nLet us now develop an AIR application that sits on your\
    \ desktop and gives you information about the caller if you provide the area code\
    \ and the first three digits of the phone number.\n\nCreate a new Flex project\
    \ and select the application type as Desktop Application.\n\nYou will find the\
    \ new MXML file created under the `src` folder having the same name as the project\
    \ name. The file will look like the following:\n\n```mxml\n<?xml version=\"1.0\"\
    \ encoding=\"utf-8\"?>\n<mx:WindowedApplication xmlns:mx=\"http://www.adobe.com/2009/mxml\"\
    \n   layout=\"absolute\">\n</mx:WindowedApplication>\n```\n\nThis shows that the\
    \ application type is a desktop application because it’s using the tag <mx:WindowedApplication>.\n\
    \nNow define the graphical interface for this application using the code in Listing\
    \ 7.4 below.\n\n```mxml\n<mx:ApplicationControlBar dock=\"true\" verticalAlign=\"\
    middle\">\n\t<mx:Label text=\"Area Code:\" fontWeight=\"bold\"/>\n\t<mx:TextInput\
    \ id=\"areaCode\" text=\"301\" maxChars=\"3\"/>\n\t<mx:Label text=\"First Three\
    \ Digits:\" fontWeight=\"bold\"/>\n\t<mx:TextInput id=\"threeDigits\" text=\"\
    929\" maxChars=\"3\"/>\n\t<mx:Button label=\"Search\" click=\"startSearch()\"\n\
    \t\tenabled=\"(!isSearching)\" useHandCursor=\"true\" buttonMode=\"true\"/>\n\
    </mx:ApplicationControlBar>\n\n<mx:TextArea id=\"info\" editable=\"false\" width=\"\
    100%\" height=\"513\"/>\n```\n\n**Listing 7.4 - Defining the graphical interface\
    \ for the sample application**\n\nAfter adding the graphical interface, provide\
    \ the Web service details to which the call needs to be made as illustrated in\
    \ Listing 7.5.\n\n```xml\n<mx:WebService id=\"ws\" result=\"onResult(event)\"\
    \ fault=\"onFault(event)\"\n               showBusyCursor=\"true\"\n         \
    \      wsdl=\"http://ws1ite.strikeiron.com/phoneumberinfo1ite01/PhoneNumberInfoLite.asmx?WSDL\"\
    \ />\n```\n\n**Listing 7.5 - Providing the Web service call details**\n\nNext,\
    \ we need to write the ActionScript code to invoke the Web service, handle the\
    \ result returned by the service or fault if the invocation resulted in some fault\
    \ at the service provider. This is shown in Listing 7.6.\n\n```mxml\n<mx:Script>\n\
    <![CDATA[\n    import mx.rpc.events.FaultEvent;\n    import mx.rpc.events.ResultEvent;\n\
    \n    [Bindable]\n    private var isSearching:Boolean = false;\n\n    private\
    \ function startSearch():void {\n        isSearching = true;\n        ws.GetLocationInfoForPhoneNumber.send(areaCode.text,\
    \ threeDigits.text);\n    }\n\n    private function onResult(event:ResultEvent):void\
    \ {\n        isSearching = false;\n        if (event.result.ServiceResult.Count\
    \ == 0) {\n            info.text = event.result.ServiceResult.StatusDescription;\n\
    \            return;\n        } else {\n            var infos: Object = event.result.ServiceResult.PhoneNumberInfo[0];\n\
    \            info.text = \"AreaCode: \\t \" + infos.AreaCode + \"\\n\" +\n   \
    \                     \"First 3 digits: \\t \" + infos.FirstThreeDigits + \"\\\
    n\" +\n                        \"Country: \\t \" + infos.Country + \"\\n\" +\n\
    \                        \"City: \\t \" + infos.City + \"\\n\" +\n           \
    \             infos.State + \"\\n\" +\n                        \"County: \\t \"\
    \ + infos.County + \"\\n\";\n        }\n    }\n\n    private function onFault(event:FaultEvent):void\
    \ {\n        isSearching = false;\n        info.text = event.fault.message.toString();\n\
    \    }\n]]>\n</mx:Script>\n```\n\n**Listing 7.6 - ActionScript to invoke the Web\
    \ service**\n\nNow you can run the MXML file created just now. You will see a\
    \ window as shown in *Figure 7.4* below.\n\n![](img/c4119654311ebf24679359ca130a5ee6_143_0.png)\n\
    \n**Figure 7.4 - Sample application output**\n\n## 7.3 Using Remote Object\n\n\
    One way of accessing remote data using Flex is through remote object invocation.\
    \ In order to make use of this, the *Adobe Flex Data Services of Adobe LiveCycle\
    \ Data Services* (or equivalent Flex data services) needs to be used on the application\
    \ server. It allows you to bypass HTTP and access the remote object (Java or ColdFusion)\
    \ directly.\n\n### 7.3.1 The <mx:RemoteObject> tag\n\nThe <mx:RemoteObject> tag\
    \ allows you to access a Java remote object using *Action Message Format (AMF)\
    \ encoding*. The syntax for remote object is shown in Listing 7.7 below.\n\n```xml\n\
    <mx:RemoteObject\n        concurrency=\"multiple|single|last\"\n        destination=\"\
    No default.\"\n        id=\"No default.\"\n        endpoint=\"No default.\"\n\
    \        showBusyCursor=\"false|true\"\n        source=\"No default.\"\n     \
    \   makeObjectsBindable=\"false|true\"\n        fault=\"No default.\"\n      \
    \  result=\"No default.\"\n/>\n```\n\n**Listing 7.7 - Syntax of the <mx:RemoteObject>\
    \ tag**\n"
  mdcn: "\n\n## 7.2.1 <mx:WebService> 标签\n\nFlex 提供在 MXML 文件中使用 `<mx:WebService>`\
    \ 标签。Flex 编译器会读取标签中引用的 WSDL，并将其编译为具有预期行为的相应 ActionScript 代码。`wsdl` 属性指定通过 HTTP\
    \ 访问 WSDL 文件的位置。可选地，可以使用 `showBusyCursor` 属性来显示忙碌光标，直到收到来自服务提供商的结果。列表 7.1 展示了包含\
    \ `showBusyCursor` 属性的 `<mx:WebService>` 标签。\n\n```xml\n<mx:WebService\n     concurrency=\"\
    multiple|single|last\"\n     fault=\"No default.\"\n     id=\"No default.\"\n\
    \     load=\"No default.\"\n     port=\"No default.\"\n     protocol=\"http|https\"\
    \n     result=\"No default.\"\n     service=\"No default.\"\n     serviceName=\"\
    No default.\"\n     showBusyCursor=\"false|true\"\n     wsdl=\"No default.\">\n\
    </mx:WebService>\n```\n\n**列表 7.1 - <mx:WebService> 标签**\n\n## 7.2.2 send() 方法\n\
    \n除非调用 `send()` 方法，否则 Web 服务不会被调用。可以在 `send()` 方法本身中指定操作参数。下面是一个调用 `send()` 的示例：\n\
    \n```actionscript\nservice.GetLocationInfoForPhoneNumber.send(areaCode.text,\n\
    \                                   threeDigits.text);\n```\n\n## 7.2.3 ResultEvent\
    \ 对象\n\n此事件表示操作已成功返回结果。它有一个 `result` 属性，其中持有服务提供商返回的结果。列表 7.2 展示了 ResultEvent\
    \ 的用法。\n\n```actionscript\nimport mx.rpc.events.ResultEvent;\n\nprivate function\
    \ onResult(event:ResultEvent):void{\n    searching=false;\n    if(event.result.ServiceResult.Count==0){\n\
    \        output.text =\n                   event.result.ServiceResult.StatusDescription;\n\
    \n        return;\n    }\n}\n```\n\n**列表 7.2 – 使用 ResultEvent**\n\n在上述代码列表中，`ServiceResult.Count`\
    \ 是特定于所用示例的，并非在所有情况下都使用。在此处，它检查是否有关于给定区号和前缀的信息。完整的代码列表在第 7.2.10 节中提供。\n\n## 7.2.4\
    \ FaultEvent 对象\n\n当 Web 服务调用出现故障时，会分派此事件。`fault` 属性持有导致失败原因的信息。\n\n列表 7.3 展示了\
    \ FaultEvent 处理程序的用法。\n\n```actionscript\nimport mx.rpc.events.FaultEvent;\n\n\
    private function onFault(event:FaultEvent):void{\n    isSearching = false;\n \
    \   info.text = event.fault.message.toString();\n}\n```\n\n**列表 7.3 – 使用 FaultEvent**\n\
    \n上述代码列表显示了当 Web 服务调用引发 FaultEvent 时执行的代码部分。在这里，向客户端显示了 FaultEvent 的原因。\n\n##\
    \ 7.2.5 result 属性\n\n`result` 属性指定当 Web 服务将响应发送回客户端时要执行的操作。例如：\n\n```xml\n<mx:WebService\
    \ id=\"ws\" result=\"onResult(event)\" />\n```\n\n## 7.2.6 fault 属性\n\n`fault`\
    \ 属性指定当 Web 服务将异常作为响应返回给客户端时要执行的操作。例如：\n\n```xml\n<mx:WebService id=\"ws\" result=\"\
    onFault(event)\" />\n```\n\n## 7.2.7 service 属性\n\n用户可以选择指定 `serviceName` 而不是使用\
    \ `wsdl` 属性。在这种情况下，WSDL 相关信息可以存储在服务器的 `flex-config.xml` 中。\n\n## 7.2.8 <mx:operation>\
    \ 标签\n\n`<mx:WebService>` 标签可以包含代表 Web 服务操作的可选 `<mx:operation>` 标签。以下是 `<mx:operation>`\
    \ 标签的语法。\n\n```xml\n<mx:operation\n    concurrency=\"multiple|single|last\"\n\
    \    fault=\"No default.\"\n    name=\"No default, required\"\n    result=\"No\
    \ default.\"\n    resultFormat=\"object|xml\"\n/>\n```\n\n## 7.2.9 <mx:request>\
    \ 标签\n\n`<mx:operation>` 标签可以有一个单一的 `<mx:request>` 子标签，其形式如下：\n\n```xml\n<mx:request\
    \ format=\"object|xml\">\n</mx:request>\n```\n\n此标签可以包含子标签。如果指定的格式是 `object`，则子标签代表发送给服务的命名参数，其中参数的顺序不重要。如果指定的格式是\
    \ `xml`，则正文代表发送给服务的 SOAP 消息。\n\n## 7.2.10 示例应用程序\n\n现在让我们开发一个 AIR 应用程序，它位于您的桌面上，如果您提供区号和电话号码的前三位数字，它会提供有关呼叫者的信息。\n\
    \n创建一个新的 Flex 项目，并将应用程序类型选择为桌面应用程序。\n\n您将在 `src` 文件夹下找到新创建的 MXML 文件，其名称与项目名称相同。该文件看起来如下所示：\n\
    \n```mxml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<mx:WindowedApplication\
    \ xmlns:mx=\"http://www.adobe.com/2009/mxml\"\n   layout=\"absolute\">\n</mx:WindowedApplication>\n\
    ```\n\n这表明应用程序类型是桌面应用程序，因为它使用了 `<mx:WindowedApplication>` 标签。\n\n现在使用以下列表 7.4\
    \ 中的代码为此应用程序定义图形用户界面。\n\n```mxml\n<mx:ApplicationControlBar dock=\"true\" verticalAlign=\"\
    middle\">\n\t<mx:Label text=\"Area Code:\" fontWeight=\"bold\"/>\n\t<mx:TextInput\
    \ id=\"areaCode\" text=\"301\" maxChars=\"3\"/>\n\t<mx:Label text=\"First Three\
    \ Digits:\" fontWeight=\"bold\"/>\n\t<mx:TextInput id=\"threeDigits\" text=\"\
    929\" maxChars=\"3\"/>\n\t<mx:Button label=\"Search\" click=\"startSearch()\"\n\
    \t\tenabled=\"(!isSearching)\" useHandCursor=\"true\" buttonMode=\"true\"/>\n\
    </mx:ApplicationControlBar>\n\n<mx:TextArea id=\"info\" editable=\"false\" width=\"\
    100%\" height=\"513\"/>\n```\n\n**列表 7.4 - 为示例应用程序定义图形用户界面**\n\n添加图形用户界面后，按照列表\
    \ 7.5 中所示提供需要调用的 Web 服务详细信息。\n\n```xml\n<mx:WebService id=\"ws\" result=\"onResult(event)\"\
    \ fault=\"onFault(event)\"\n               showBusyCursor=\"true\"\n         \
    \      wsdl=\"http://ws1ite.strikeiron.com/phoneumberinfo1ite01/PhoneNumberInfoLite.asmx?WSDL\"\
    \ />\n```\n\n**列表 7.5 - 提供 Web 服务调用详细信息**\n\n接下来，我们需要编写 ActionScript 代码来调用 Web\
    \ 服务，处理由服务返回的结果，或者处理如果调用导致服务提供商出现故障时的情况。这显示在列表 7.6 中。\n\n```mxml\n<mx:Script>\n\
    <![CDATA[\n    import mx.rpc.events.FaultEvent;\n    import mx.rpc.events.ResultEvent;\n\
    \n    [Bindable]\n    private var isSearching:Boolean = false;\n\n    private\
    \ function startSearch():void {\n        isSearching = true;\n        ws.GetLocationInfoForPhoneNumber.send(areaCode.text,\
    \ threeDigits.text);\n    }\n\n    private function onResult(event:ResultEvent):void\
    \ {\n        isSearching = false;\n        if (event.result.ServiceResult.Count\
    \ == 0) {\n            info.text = event.result.ServiceResult.StatusDescription;\n\
    \            return;\n        } else {\n            var infos: Object = event.result.ServiceResult.PhoneNumberInfo[0];\n\
    \            info.text = \"AreaCode: \\t \" + infos.AreaCode + \"\\n\" +\n   \
    \                     \"First 3 digits: \\t \" + infos.FirstThreeDigits + \"\\\
    n\" +\n                        \"Country: \\t \" + infos.Country + \"\\n\" +\n\
    \                        \"City: \\t \" + infos.City + \"\\n\" +\n           \
    \             infos.State + \"\\n\" +\n                        \"County: \\t \"\
    \ + infos.County + \"\\n\";\n        }\n    }\n\n    private function onFault(event:FaultEvent):void\
    \ {\n        isSearching = false;\n        info.text = event.fault.message.toString();\n\
    \    }\n]]>\n</mx:Script>\n```\n\n**列表 7.6 - 调用 Web 服务的 ActionScript**\n\n现在您可以运行刚才创建的\
    \ MXML 文件。您将在 *图 7.4* 中看到如图所示的窗口。\n\n![](img/c4119654311ebf24679359ca130a5ee6_143_0.png)\n\
    \n**图 7.4 - 示例应用程序输出**\n\n## 7.3 使用远程对象\n\n使用 Flex 访问远程数据的一种方式是通过远程对象调用。为了利用此功能，需要在应用服务器上使用\
    \ *Adobe Flex Data Services of Adobe LiveCycle Data Services*（或等效的 Flex 数据服务）。它允许您绕过\
    \ HTTP 直接访问远程对象（Java 或 ColdFusion）。\n\n### 7.3.1 <mx:RemoteObject> 标签\n\n`<mx:RemoteObject>`\
    \ 标签允许您使用 *Action Message Format (AMF) 编码* 访问 Java 远程对象。远程对象的语法如下所示，见列表 7.7。\n\
    \n```xml\n<mx:RemoteObject\n        concurrency=\"multiple|single|last\"\n   \
    \     destination=\"No default.\"\n        id=\"No default.\"\n        endpoint=\"\
    No default.\"\n        showBusyCursor=\"false|true\"\n        source=\"No default.\"\
    \n        makeObjectsBindable=\"false|true\"\n        fault=\"No default.\"\n\
    \        result=\"No default.\"\n/>\n```\n\n**列表 7.7 - <mx:RemoteObject> 标签的语法**\n\
    \n"
