    | Resize | Changes the width and height of a component over a specified time frame.
    |

    | Rotate | Rotates a component around a specific point. |

    | SoundEffect | Used to play an MP3 audio file. |

    | WipeLeft, WipeRight, WipeUp, WipeDown | Used to define a bar Wipe effect. |

    | Zoom | Used to zoom a component in or out from its center point. |


    Table 6.1 - Common Effects


    # 6.3.2 Using Effects


    You can alter how to play effects by calling the pause(), resume(), or end() methods.
    The pause() method pauses an effect, the resume() method allows you to resume
    a paused effect and the end() method ends an effect that is being played.


    When an effect starts, a startEffect event is dispatched and when it ends, an
    endEffect event is dispatched. You can use these events and perform specific functions
    if required.


    Effects can be played in sequence or parallel using the <mx:sequence> and <mx:parallel>
    tags respectively. Effects defined in a sequence are played one after the other
    and those defined in parallel are played at the same time.


    You will get a better idea about using effects with an example. So let us create
    an image that blurs when a user clicks it. Follow these steps:


    +   1. Create a new Flex project.

    +   2. Add an images folder in the src folder and add an image in this folder.
    For this example we have an image named rambutan.jpg that is included in the accompanying
    zip file (Exercise_Files_AdobeFlex.zip) under sub-directory Chapter 6.

    +   3. Go to the design view. Drag and drop a panel and add an image on the panel.
    You can choose the properties for the panel, or use the ones shown in Listing
    6.4 below.


    ```

    ```xml

    <mx:Panel title="Blur Effect" layout="vertical" color=\"0xffffff\"

    borderAlpha="0.15" width="500" paddingTop="10" paddingRight="10"

    paddingBottom="10" paddingLeft="10" horizontalAlign="center">

    <mx:Image id="fruit"

    source="@Embed(\"/assets/images/fruit.jpg\")"/>

    </mx:Panel>

    ```

    ```


    Listing 6.4: Adding Panel to the application


    +   4. Now you can define the Blur effect along with its properties as shown in
    Listing 6.5 below.


    ```

    ```xml

    <mx:Blur id="blurImage" duration="1000"

    ```

