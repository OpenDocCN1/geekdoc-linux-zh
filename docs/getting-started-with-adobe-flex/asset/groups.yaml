    # 4.4.3 Menu-based controls


    In a serious application, there are always more options to show than what the
    application area can hold. That''s where Menu-based controls and related functionality
    can help you organize things in a much more intuitive and compact way. There are
    a few Menu-based controls in Flex 3 which are described in Table 4.9 below.


    | Control Name | Usage/ Description |

    | --- | --- |

    | Menu | This control contains menus or cascading sub-menus. It can only be defined
    and manipulated through ActionScript. |

    | MenuBar | A horizontal bar holding menu items |

    | PopUpMenuButton | A subclass of PopUpButton control whose secondary button pops
    up a Menu control |


    Table 4.9 – Menu-based controls in Flex


    # 4.4.4 Data-driven controls


    No application is useful if it doesn''t display and manipulate a structured set
    of data. Flex has a very rich and diverse set of controls which can accept data
    from data providers. Though Menu based controls have similarity in that regards,
    still they are more static in nature and rarely used for showing a variable number
    of data objects. Table 4.10 contains the list of Data-Provider controls in Flex
    3.'
