    # **1.3 Versions and editions of Adobe Flex**


    As indicated in an earlier section, Adobe Flex started with version 1.0, then
    it moved to 1.5, 2.0 and 3.0. In this book we focus on Adobe Flex 3.0. There are
    multiple components which make up Adobe Flex 3.0.


    # **1.3.1 Adobe Flex 3 SDK**


    You can create and deploy Flex applications using only the Open Source Flex 3
    SDK or the Free Adobe Flex 3 SDK. The free Adobe Flex 3 SDK includes the Flex
    framework, compilers, and debuggers, enabling you to develop Flex applications
    using an IDE of your choice. The Open Source Flex 3 SDK contains the majority
    of the Flex SDK (compilers, framework, debugger) but does not include anything
    that is not open source like the Adobe Flash Player, Adobe AIR, or the advanced
    font encoding libraries.


    # **1.3.2 Adobe Flex Builder 3**


    Adobe Flex Builder 3 Software is a powerful Eclipse based IDE available as a licensed
    product. Adobe Flex Builder 3 accelerates Flex application development because
    it enables intelligent coding, interactive step-through debugging and visual design
    features. Adobe Flex Builder 3 includes the complete Flex SDK, including compilers,
    a component library and debuggers along with the IDE. This is also available as
    a Plug in for Eclipse. There are two available editions of Adobe Flex Builder
    3.


    +      •  Adobe Flex Builder 3 Standard Edition

    +      •  Adobe Flex Builder 3 Professional Edition.


    *The Table 1.1* below shows a comparison table of the features which are included
    in different editions of Adobe Flex Builder 3.


    | Feature | Adobe Flex Builder 3 Professional Edition | Adobe Flex Builder 3 Standard
    Edition |

    | :--- | :---: | :---: |

    | RIA On the Desktop | ✔ | ✔ |

    | DataGrid | ✔ | ✔ |

    | Advanced DataGrid | ✔ |  |

    | Charting Components | ✔ |  |

    | Performance Profiler | ✔ |  |

    | Memory Profiler | ✔ |  |

    | Interactive Debugging | ✔ | ✔ |

    | Design View | ✔ | ✔ |'
