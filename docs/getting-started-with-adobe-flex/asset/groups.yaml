    在 Flex IDE 中，你可以转到主菜单并选择 Window -> Show View -> components -> Charts。点击 + 号展开并查看\
    \ Flex 中可用的图表。这在下面的图 8.1 中有所说明。每个图表选项旁边的小图标让你可以快速了解要创建的图表类型。\n\n![](img/c4119654311ebf24679359ca130a5ee6_181_0.png)\n\
    \n**图 8.1 – Flex 3 SDK 组件窗口中的图表选项**\n\n## 8.2 Flex 3 中的不同图表\n\n本节描述了你可以在 Flex\
    \ 中使用的不同类型的图表及其用法：\n\n### 8.2.1 面积图 [AreaChart]\n- 面积图将系列显示为由线连接的一组点。使用它来：\n \
    \   - 显示随时间（或其他维度）变化的信息\n    - 确定一组数据如何累加成整体（累计总和）\n    - 理解整体中每个元素所占的比例。\n\n\
    ### 8.2.2 条形图 [BarChart]\n条形图将系列显示为水平条形组。普通条形图与柱状图密切相关，柱状图将系列显示为垂直条形组；还与范围条形图相关，范围条形图将系列显示为具有不同起点和终点的水平条形组。使用它来：\n\
    - 呈现随时间或在不同条件下（例如，国家、测试条件）的观察值\n- 提供区间缩放（例如，时间）。\n\n### 8.2.3 气泡图 [BubbleChart]\n\
    在气泡图中，值由气泡在垂直和水平轴上的位置以及气泡的大小表示。可以通过在图表中使用不同颜色的气泡来引入额外的类别。\n\n### 8.2.4 蜡烛图 [CandlestickChart]\n\
    蜡烛图是一种主要用于描述股票随时间价格变动的条形图样式。它是折线图和条形图的结合，其中每个条代表给定时间间隔内的价格波动范围。它最常用于股票和货币价格形态的技术分析。\n\
    \n### 8.2.5 柱状图 [ColumnChart]\n柱状图将系列显示为按类别分组的垂直条形。柱状图适用于显示一段时间内的数据变化或说明项目之间的比较。普通柱状图与条形图密切相关，条形图将系列显示为水平条形组。\n\
    \n### 8.2.6 图例控件 [Legend]\n图例本身不是一种图表类型 - 当图表中出现的数据包含多个数据系列时，图表可能包含图例。图例包含图表中出现的数据系列列表及其外观示例。此信息允许在图表中识别数据系列的数据。\n\
    \n### 8.2.7 高、低、开盘、收盘图 [HLOCChart]\nHighLowOpenClose 图是专门为使用每个数据点最多四个值的金融或科学数据而设计的。这些值与用于绘制金融股票数据的高、低、开盘和收盘值相对应。\n\
    \n### 8.2.8 折线图 [LineChart]\n折线图将系列显示为由单条线连接的一组点。折线图用于表示在连续时间段内发生的大量数据。使用它来：\n\
    - 显示长数据行\n- 在数据点之间进行插值\n- 在已知数据值之外进行外推（预测）\n- 比较不同的图表\n\n### 8.2.9 饼图 [PieChart]\n\
    饼图和圆环图将数据显示为整体的比例。饼图最常用于组间比较。使用它来：\n- 传达某一时点的近似比例关系（相对量）\n- 比较某一时点整体中的一部分\n- 爆炸式：强调小部分的比例\n\
    \n### 8.2.10 散点图 [PlotChart]\n使用散点图来：\n- 显示随时间变化的测量值（一维散点图）\n- 传达两个变量之间关系的整体印象（二维散点图）\n\
    \n让我们看看如何使用示例静态数据创建一些流行的图表。大多数图表都将使用相同的数据，并且对于每个图表，数据必须包裹在 *Listing 8.1* 中所示的代码内。\n\
    \n```xml\n<mx:Script>\n    <![CDATA[\n    import mx.collections.ArrayCollection;\n\
    \        [Bindable]\n\n.. ..\n\n    ]]>\n</mx:Script>\n```\n\n**Listing 8.1 –\
    \ 图表数据的占位符**\n\n对于每种类型的图表，你应该创建一个面板并将代码放在面板中，如下面的 *Listing 8.2* 所示。当你将图表拖放到设计视图时，Flex\
    \ 将生成相同的代码。\n\n```xml\n<mx:Panel title=\"Title of My Chart\" height=\"100%\" width=\"\
    100%\">\n..\n..\n</mx:Panel>\n```\n\n**Listing 8.2 – 图表的面板**\n\n## 8.3 柱状图示例\n\
    \n在本例中，你将学习如何创建一个柱状图来显示世界上人口最多的三个国家。点击组件视图中的 BarChart 控件并将其拖放到设计视图；接受默认值。当你转到源代码视图时，你应该看到\
    \ Listing 8.3 中显示的代码。\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
    <mx:Application xmlns:mx=\"http://www.adobe.com/2006/mxml\"\n    layout=\"absolute\"\
    >\n    <mx:ColumnChart x=\"130\" y=\"80\" id=\"columncchart1\">\n        <mx:series>\n\
    \            <mx:ColumnSeries displayName=\"Series 1\" yField=\"\"/>\n       \
    \ </mx:series>\n    </mx:ColumnChart>\n    <mx:Legend dataProvider=\"{columncchart1}\"\
    />\n</mx:Application>\n```\n\n**Listing 8.3 – 当柱状图控件放在设计视图中的默认代码**\n\n在 [**Bindable**]\
    \ 部分之后添加一个数据段，如下面的 Listing 8.4 所示：\n\n```actionscript\nprivate var population:\
    \ ArrayCollection = new ArrayCollection( [\n    { Country: \"China\", Population:\
    \ 1200 },\n    { Country: \"India\", Population: 1050 },\n    { Country: \"USA\"\
    , Population: 300 } ]);\n```\n\n**Listing 8.4 - 柱状图的数据值**\n\n添加 Listing 8.5 中所示的代码以指定柱状图的详细信息。\n\
    \n```xml\n<mx:ColumnChart id=\"column\"\n    height=\"100%\" width=\"45%\" paddingLeft=\"\
    5\" paddingRight=\"5\"\n    showDataTips=\"true\"\n    dataProvider=\"{population}\"\
    \n>\n    <mx:horizontalAxis>\n        <mx:CategoryAxis categoryField=\"Country\"\
    />\n    </mx:horizontalAxis>\n    <mx:series>\n        <mx:ColumnSeries\n    \
    \        xField=\"Country\" yField=\"Population\"\n            displayName=\"\
    Population (Millions)\"\n            fill=\"{sc1}\" stroke=\"{s1}\"\n        />\n\
    \    </mx:series>\n</mx:ColumnChart>\n```\n\n"
