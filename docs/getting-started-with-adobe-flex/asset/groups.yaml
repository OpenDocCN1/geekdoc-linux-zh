    \ Flex，我们划分视图组件，该组件定义了应用程序的用户界面。\n- 3. 你可以使用 Flex 3 创建各种高度交互、表达能力强的应用程序。例如，使用\
    \ Flex 构建的数据可视化应用程序可以从多个后端源提取数据并以视觉方式显示。业务用户可以深入挖掘数据以获得更深入的洞察，甚至更改数据并在后端自动更新。\n\
    - 4. Flex 是构建更大、更可靠且更复杂的 Flash 应用程序的工具套件和环境。你可以在 Flash 中做任何在 Flex 中能做的事情，但难度更大。Flex\
    \ 提供了在任何浏览器中运行于 Adobe Flash Player 的 SWF 文件创建能力。\n- 5. Flex 3.0 中引入的主要功能如下：\n\
