    \ y=\"155\" text=\"Language to be translated\" width=\"158\"/>\n```\n\n**代码清单\
    \ 7.24 – 定义用户界面**\n\n- **3.** 用于翻译的 Google 语言 API 接受符合 ISO 639 标准的语言代码，例如英语的 'en'。因此，对于放入组合框中的语言，请在下方所示的数组中提供这些代码，以便相应地映射并发送。\n\
