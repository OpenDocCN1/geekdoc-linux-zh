    \n# 5.4.1 Scrolling List controls\n\nThe Flex framework provides a simple set\
    \ of List controls that display items either vertically or horizontally with built-in\
    \ scrolling. These controls also provide single or multi-selection capabilities.\
    \ The List controls are often used to show numerous items in an organized fashion.\n\
    \nThere are three main types of Scrolling List controls:\n\n+   - List control\n\
    +   - HorizontalList control\n+   - TileList control\n\n# 5.4.1.1 List Control\n\
    \nThe List control is the simplest data-driven UI control that the Flex Framework\
    \ provides. The mx.controls.List class can be used in a Flex application by using\
    \ the <mx:List /> MXML tag. The list control displays a vertical list of items\
    \ and provides a scrollbar if the full height of the list items is unlikely to\
    \ fit. The horizontal scrollbar is also optional. The user can select one or more\
    \ items from the list. Listing 5.15 shows an example of creating a list control\
    \ using the <mx:List> tag in combination with the ArrayCollection that we discussed\
    \ earlier.\n\n```\n```xml\n<?xml version=\"1.0\"?>\n<mx:Application xmlns:mx=\"\
    http://www.adobe.com/2006/mxml\">\n  <mx:ArrayCollection id=\"shapes\">\n    <mx:source>\n\
    \      <mx:Array id=\"ShapeArray\">\n        <mx:String>Rectangle</mx:String>\n\
    \        <mx:String>Square</mx:String>\n        <mx:String>Circle</mx:String>\n\
    \        <mx:String>Octagon</mx:String>\n        <mx:String>Hexagon</mx:String>\n\
    \        <mx:String>Triangle</mx:String>\n      </mx:Array>\n    </mx:source>\n\
    \  </mx:ArrayCollection>\n  <mx:List id=\"myList\" width=\"200\" height=\"100\"\
    \ dataProvider=\"{shapes}\"/>\n</mx:Application>\n```\n```\n\nListing 5.15 - Code\
    \ snippet to create a List control\n\nFigure 5.2 below shows the List control\
    \ that is created. The ArrayCollection class acts as the data provider for the\
    \ List control."
