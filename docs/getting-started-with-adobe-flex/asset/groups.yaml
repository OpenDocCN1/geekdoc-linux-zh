    # Chapter 3 - Introduction to MXML and ActionScript\n\nMXML is the heart of the\
    \ Flex framework. MXML is a markup language based on *XML* (Extensible Markup\
    \ Language), created by Adobe to be used with the Flex platform. It is easy to\
    \ read and write like HTML (Hyper Text Markup Language) and provides the extensibility\
    \ of XML.\n\nActionScript is the glue that holds a Flex application together.\
    \ While MXML is usually used for layout and structuring, ActionScript is used\
    \ to make things happen. The key to building powerful Flex applications depends\
    \ upon the right usage of scripts, creating reusable code, knowing the basics\
    \ of ActionScript, and above all, understanding how MXML and ActionScript work\
    \ together.\n\nIn this chapter you will learn about:\n\n- MXML\n- ActionScript\n\
    \n## 3.1 MXML and ActionScript – the Big Picture\n\n*Figure 3.1* below provides\
    \ the big picture of MXML and ActionScript and their relationship.\n\n![](img/c4119654311ebf24679359ca130a5ee6_55_0.png)\n\
    \n**Figure 3.1 – Flex Framework Architecture – The Big Picture**\n\nAs you can\
    \ see from the figure, the Flex Framework makes use of two languages, ActionScript\
    \ and MXML. The Class Libraries provide the APIs for both, visual components like\
    \ controls and containers, and faceless components like remote service objects.\n\
    \nFigure 3.2 illustrates the relationship between MXML and ActionScript by showing\
    \ the MXML compilation process.\n\n![](img/c4119654311ebf24679359ca130a5ee6_55_1.png)\n\
    \n**Figure 3.2 – MXML Compilation process**\n\nAs shown in the figure, every MXML\
    \ created by a developer gets converted first into an ActionScript class ( *.as*\
    \ extension). This *.as* file is then taken by the Flex compiler, which converts\
    \ it into a *.swf* (Macromedia's Small Web Format, pronounced *swiff*). This file\
    \ is referred to as the bytecode and can be embedded in any HTML or JSP file,\
    \ etc. In order to view these files in the browser, Flash Player must be pre-installed.\n\
    \n## 3.2 MXML\n\nIn this section we discuss the relationship between MXML and\
    \ XML, how to code MXML effectively, and namespaces. Adobe has not provided an\
    \ official meaning for the MXML acronym; however, since Macromedia (acquired by\
    \ Adobe) developed this language some people suggest it stands for Macromedia\
    \ Extensible Markup Language, while others prefer to say that it stands for Magic\
    \ Extensible Markup Language.\n\n### 3.2.1 XML\n\nXML stands for Extensible Markup\
    \ Language. It is a language that describes data and is ideal for exchanging information,\
    \ no matter the platform. For simplicity, you can think of an XML document as\
    \ a text document with tags. For example, `<telephone>90542334</telephone>` is\
    \ an XML document.\n\n> **Note:**\n> Today you can find a vast amount of resources\
    \ about XML. In this book we provide a very short introduction given that XML\
    \ is the foundation for MXML.\n\nWhile HTML is a language used to describe how\
    \ to display data, XML is used to describe what the data is. Below are two simple\
    \ examples, the first one is HTML, and the second one is XML:\n\n```html\n<b>Raul</b>\n\
    ```\n```xml\n<name>Raul</name>\n```\n\nCan you see the difference with respect\
    \ to the tags? In the first case (HTML), the tag `<b>` is used to indicate that\
    \ the name Raul should be displayed in bold. In the second case (XML), the tag\
    \ `<name>` is used to describe what Raul is, a name.\n\nXML uses a Document Type\
    \ Definition (DTD) or XML Schema Definition (XSD) document to describe the rules\
    \ for the tags. For example a rule can be that the tag `<name>` can only contain\
    \ characters. These are also used to verify the document follows a predefined\
    \ structure; this process is called XML validation.\n\nThe extensibility in XML\
    \ comes from the ability to create your own tags. This means that you can create\
    \ your own vocabulary based on XML. This is what happens with MXML, it is basically\
    \ an XML vocabulary where specific tags have been created by Adobe to provide\
    \ structure for Flex applications.\n\nWith respect to syntax, an XML document\
    \ is a well-formed XML document when it follows the right syntax as defined by\
    \ the World Wide Web Consortium (W3C) XML standard. For example, some of these\
    \ rules state the following:\n\n- All that is opened must be closed — All the\
    \ tags that are opened like `<mx:Button>` must be closed with the closing tag\
    \ like `</mx:Button>`. If there is no content within the opening and ending tag\
    \ as in `<mx:Button> </mx:Button>` then you can simply use one tag as in `<mx:Button\
    \ />`.\n- XML is case-sensitive — This is to say that upper-case and lower-case\
    \ letters are not considered the same. So `<mx:Label1>` and `<mx:label1>` are\
    \ both different.\n\nWith respect to presentation, given an XML document, you\
    \ can easily transform it to a format which the media knows how to present. For\
    \ example, use XSLT (eXtensible Stylesheet Language Transformation) to transform\
    \ XML documents into HTML documents so that data can be accurately displayed on\
    \ a Web browser. Simply apply a different XML stylesheet to the same XML document,\
    \ and you can present the content data on a browser in a different look and feel.\n\
    \nIn terms of navigation, when you want to search for a specific content in an\
    \ XML document you can use different languages such as XQuery, XPath, and SQL/XML.\n\
    \n### 3.2.2 Anatomy of an XML tag\n\nA tag can contain information in two ways,\
    \ either by content or in the way of attributes. Content is nothing but the text\
    \ enclosed between the opening and the closing tag. On the other hand, an attribute\
    \ is text enclosed in quotes that exists in the opening tag only and describes\
    \ the tag further. For example:\n\n```xml\n<mx:Label id=\"myLabel\" >\n\t<mx:text>\
    \ Hello World!! </mx:text>\n</mx:Label>\n```\n\nIn the above example `id` is an\
    \ attribute of the tag `<mx:Label>`, and `<mx:text>`, (yes you can nest one tag\
    \ within another tag as with HTML) is the content of the tag `<mx:Label>`.\n\n\
    The same can be written as:\n\n```xml\n<mx:Label id=\"myLabel\" text=\"Hello World!!\"\
    />\n```\n\nSo, an attribute can provide a more compact and readable way to represent\
    \ the same information.\n\nThough, attributes are more compact, nested tags allow\
    \ you to represent more complex content. They are useful for plugging data that\
    \ can't be represented by using attributes as in the example shown in Listing\
    \ 3.1.\n\n```xml\n<mx:DataGrid>\n\t<mx:columns>\n\t\t<mx:DataGridColumn headerText=\"\
    Column 1\" dataField=\"col1\"/>\n\t\t<mx:DataGridColumn headerText=\"Column 2\"\
    \ dataField=\"col2\"/>\n\t\t<mx:DataGridColumn headerText=\"Column 3\" dataField=\"\
    col3\"/>\n\t</mx:columns>\n</mx:DataGrid>\n```\n\n**Listing 3.1 - An XML document\
    \ with nested tags**\n"
  mdcn: "\n\n# 2.5 练习\n\n创建一个新的 Flex 应用程序，并将其命名为“Hello World!”。它应该与本章中介绍的 Hello Flex!\
    \ 应用程序行为完全一致，但这次它将输出“Hello World!”。这个简单的练习将帮助你回顾本章所学的内容。\n\n# 2.6 摘要\n\n本章解释了安装\
