    # 1.3.3 Adobe Data Services


    Adobe offers two data services solutions to resolve various needs.


    +   * BlazDS: This is an open source offering that provides Flex Remoting and
    Messassing to all developers. Flex Remoting makes it fast and easy for developers
    to connect to back-end businesc logic and data.

    +   * Adobe LiveCycle Data Services: This is a full featured framework for developing
