    \ in this XML is the profit of a company distributed across the months in a year\
    \ as shown in Listing 8.14 below.\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    utf-8\"?>\n<items>\n\t<item month=\"Jan\" profit=\"1.2\" />\n\t<item month=\"\
    Feb\" profit=\"3\" />\n\t<item month=\"Mar\" profit=\".7\" />\n\t<item month=\"\
    Apr\" profit=\"5\" />\n\t<item month=\"May\" profit=\"2.3\" />\n\t<item month=\"\
    June\" profit=\"4.5\" />\n\t<item month=\"July\" profit=\"6.6\" />\n\t<item month=\"\
    Aug\" profit=\"2\" />\n\t<item month=\"Sept\" profit=\"3.1\" />\n\t<item month=\"\
    Oct\" profit=\"4\" />\n\t<item month=\"Nov\" profit=\"6\" />\n\t<item month=\"\
    Dec\" profit=\"5.5\" />\n</items>\n```\n\nListing 8.14 – Contents of profit.xml\n\
    \n2. You need to graphically display this data. So add a panel and a column chart\
    \ to the application. By now you should know that an Http Request has to be sent\
    \ to get the XML data as shown below.\n\n```xml\n<mx:HTTPService id=\"ChartData\"\
    \ url=\"data/profit.xml\"/>\n```\n\n3. Bind the data to the data provider of the\
    \ chart as shown in Listing 8.15 below.\n\n```xml\n<mx:ColumnChart id=\"ProfitChart\"\
    \ width=\"100%\" height=\"100%\"\n    dataProvider=\"{ChartData.lastResult.items.item}\"\
    \ showDataTips=\"true\"/>\n```\n\nListing 8.15 – binding chart data provider\n\
    \n4. Since the profit of the company needs to be shown on the y-axis, you can\
    \ define the `yField` attribute of the `ColumnSeries` property to the profit field\
    \ of the dataprovider as shown in Listing 8.16 below.\n\n```xml\n<mx:series>\n\
    \    <mx:ColumnSeries id=\"series\" displayName=\"Series 1\"\n        yField=\"\
    value\"/>\n</mx:series>\n```\n\nListing 8.16 – Defining the y-axis\n\n5. In order\
    \ to display the months on the x-axis, you should provide the `<mx:horizontalAxis>`\
    \ tag and specify the `categoryField` as shown in Listing 8.17 below.\n\n```xml\n\
    <mx:horizontalAxis>\n    <mx:CategoryAxis id=\"axis\" categoryField=\"month\"\
    \ />\n</mx:horizontalAxis>\n```\n\nListing 8.17 – Defining the x-axis\n\n6. You\
    \ can now run this application to view the chart. The output is shown in Figure\
    \ 8.7.\n\n![](img/c4119654311ebf24679359ca130a5ee6_194_0.png)\n\nFigure 8.7 —\
    \ Column Chart output\n\n7. It will be really nice to see charts popping up with\
    \ some effects. You can use the SeriesInterpolate effect which moves the graphics\
    \ that represents the existing data in a series to the new points. The duration\
    \ attribute specifies the duration of the effect in milliseconds. For example:\n\
    \n```xml\n<mx:SeriesInterpolate id=\"interpolateIn\" duration=\"1000\"/>\n```\n\
    \n8. Now the effect can be used as shown in Listing 8.18 below.\n\n```xml\n<mx:series>\n\
    \  <mx:ColumnSeries id=\"series\" displayName=\"Series 1\" yField=\"profit\" showDataEffect=\"\
    {interpolateIn}\"/>\n</mx:series>\n```\n\nListing 8.18 — Data effect for a column\
    \ in a column chart\n\n9. You can even try using the **SeriesSlide** and **SeriesZoom**\
    \ effects.\n\n10. Now, say you want to see how the profit is distributed across\
    \ various business sectors for each month. Then you will have to drill down from\
    \ the chart to display this detailed information when a column in the chart is\
    \ clicked. This can be done using the itemClick event of the chart. So you can\
    \ add an event listener for the chart in a method you can name init() which will\
    \ be called in the creationComplete event of the application as shown in Listing\
    \ 8.19 below.\n\n```actionscript\nprivate function init() {\nProfitChart.addEventListener(ChartItemEvent.ITEM_CLICK,\
    \ onItemClick);\n}\n```\n\nListing 8.19 – Click event listener\n\n11. In the above\
    \ code snippet, the onItemClick method is the event handler function and has to\
    \ be defined. Say you have an XML file for each month for the distribution of\
    \ profit across business sectors. For example, Oct.xml has the data for the month\
    \ of October and likewise for the other months. An example of the data in these\
    \ files is shown in Listing 8.20 below.\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    utf-8\"?>\n<items>\n<item industry=\"Textiles\" value=\"30\" />\n<item industry=\"\
    Agriculture\" value=\"50\" />\n<item industry=\"Manufacturing\" value=\"20\" />\n\
    </items>\n```\n\nListing 8.20 – Detail data for a specific month\n\n12. In the\
    \ itemClick handler, you will send an HTTP request to get the data from these\
    \ XML files depending on which month's data you require. You can use the HitData\
    \ object to obtain what data was underneath the mouse when the event was triggered\
    \ as shown in Listing 8.21 below.\n\n```actionscript\nprivate function onItemClick(event:ChartItemEvent):void{\n\
    var month:String= event.hitData.item.month;\nvar request:HTTPService = new HTTPService();\n\
    request.url = \"data/\"+month+\".xml\";\nrequest.addEventListener(FaultEvent.FAULT,onFaultEvent);\n\
    request.addEventListener(ResultEvent.RESULT,onResultEvent);\nrequest.send();\n\
    }\n```\n\nListing 8.21 – click event handler function\n\n13. The result event\
    \ handler for the HTTP request made above should redefine the data provider for\
    \ the chart and set up the axes according to the data to be displayed as shown\
    \ in Listing 8.22 below.\n\n```actionscript\nprivate function onResultEvent (event:ResultEvent)\
    \ {\nstats = event.result.items.item;\nProfitChart.dataProvider=stats;\nseries.xField=\"\
    industry\";\nseries.yField=\"value\";\naxis.categoryField=\"industry\";\n}\n```\n\
    \nListing 8.22 – Function to redefine values\n\n14. Now run the application and\
    \ click on a month, you can see the drilled down data coming up as shown in Figure\
    \ 8.8 below. You can add some event handler code for drilling up back to the original\
    \ chart. This is left as an exercise for you to try.\n\n![](img/c4119654311ebf24679359ca130a5ee6_196_0.png)\n\
    \n## 8.9 Summary\n\nIn this chapter, you learned about various charting options\
    \ in Flex 3.0. There are ten charting controls available. Each chart type along\
    \ with its usage was described to help you decide which one to use based on the\
    \ requirements of your application. You learned how to create two of the most\
    \ popular chart types in Flex: Bar and Pie Also you have seen examples to format\
    \ the styles in those charts. Later in the chapter, you were given an overview\
    \ about some generic features of all the charts. The chapter also included exercises\
    \ that taught you how to drill down on a chart for more detail.\n\n## 8.10 Review\
    \ questions\n\n- Write sample code to use a style sheet for a chart\n- Which type\
    \ of chart should you use when developing a system for the stock market?\n- Which\
    \ chart doesn't have horizontal and vertical axes?\n"
  mdcn: "\n\n## 8.8.3 填充\n\n为了绘制多个数据系列，或者仅仅是为了改善图表的外观，你可以控制图表中每个系列的填充或系列中每个项目的填充。填充让你可以指定一种模式，定义\
    \ Flex 如何绘制图表元素。你还使用填充来指定图表的背景颜色，或由网格线定义的背景颜色带。填充可以是实心的，也可以使用线性或径向渐变。渐变指定了填充颜色中的渐变过渡。\n\
    \n| 属性 | 描述 |\n| :--- | :--- |\n| clustered | 每个系列中的图表元素按类别分组。这是 BarChart 和 ColumnChart\
    \ 控件的默认值。 |\n| overlaid | 每个系列中的图表元素相互叠加渲染，对应于最后一个系列的元素位于最上层。这是 AreaChart 控件的默认值。\
    \ |\n| stacked | 每个系列相互堆叠。每个元素代表其下方所有元素的累积值。 |\n| 100% | 相互叠加，总和为 100%。每个图表元素表示该值对相应类别值总和的贡献百分比。\
    \ |\n\n表 8.1 - type 属性支持的值\n\n## 8.9 练习\n\n现在是你应用本章所学内容及一些新知识的时候了。本练习将向你展示如何创建一个绑定\
    \ XML 数据的图表。你还将学习如何向下钻取到带效果的图表。\n\n1. 创建一个新的 Flex 项目。在 source 文件夹中创建一个名为 data\
    \ 的文件夹。在此 data 文件夹中创建一个名为 profit.xml 的新 XML 文件。此 XML 中包含的数据是一家公司在一年各个月份的利润分布，如下面清单\
    \ 8.14 所示。\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<items>\n\t\
    <item month=\"Jan\" profit=\"1.2\" />\n\t<item month=\"Feb\" profit=\"3\" />\n\
    \t<item month=\"Mar\" profit=\".7\" />\n\t<item month=\"Apr\" profit=\"5\" />\n\
    \t<item month=\"May\" profit=\"2.3\" />\n\t<item month=\"June\" profit=\"4.5\"\
    \ />\n\t<item month=\"July\" profit=\"6.6\" />\n\t<item month=\"Aug\" profit=\"\
    2\" />\n\t<item month=\"Sept\" profit=\"3.1\" />\n\t<item month=\"Oct\" profit=\"\
    4\" />\n\t<item month=\"Nov\" profit=\"6\" />\n\t<item month=\"Dec\" profit=\"\
    5.5\" />\n</items>\n```\n\n清单 8.14 – profit.xml 的内容\n\n2. 你需要以图形方式显示这些数据。因此，在应用程序中添加一个面板和一个柱状图。此时你应该知道，必须发送一个\
    \ HTTP 请求来获取 XML 数据，如下所示。\n\n```xml\n<mx:HTTPService id=\"ChartData\" url=\"data/profit.xml\"\
    />\n```\n\n3. 如下面清单 8.15 所示，将数据绑定到图表的数据提供程序。\n\n```xml\n<mx:ColumnChart id=\"\
    ProfitChart\" width=\"100%\" height=\"100%\"\n    dataProvider=\"{ChartData.lastResult.items.item}\"\
    \ showDataTips=\"true\"/>\n```\n\n清单 8.15 – 绑定图表数据提供程序\n\n4. 由于需要在 y 轴上显示公司的利润，你可以将\
    \ `ColumnSeries` 属性的 `yField` 属性定义为数据提供程序中的 profit 字段，如下面清单 8.16 所示。\n\n```xml\n\
    <mx:series>\n    <mx:ColumnSeries id=\"series\" displayName=\"Series 1\"\n   \
    \     yField=\"value\"/>\n</mx:series>\n```\n\n清单 8.16 – 定义 y 轴\n\n5. 为了在 x 轴上显示月份，你应该提供\
    \ `<mx:horizontalAxis>` 标签并指定 `categoryField`，如下面清单 8.17 所示。\n\n```xml\n<mx:horizontalAxis>\n\
    \    <mx:CategoryAxis id=\"axis\" categoryField=\"month\" />\n</mx:horizontalAxis>\n\
    ```\n\n清单 8.17 – 定义 x 轴\n\n6. 现在你可以运行此应用程序以查看图表。输出结果如图 8.7 所示。\n\n![](img/c4119654311ebf24679359ca130a5ee6_194_0.png)\n\
    \n图 8.7 — 柱状图输出\n\n7. 看到图表带有一些效果弹出效果会非常棒。你可以使用 SeriesInterpolate 效果，它将代表现有数据的图形移动到系列中的新点。duration\
    \ 属性指定效果的持续时间（以毫秒为单位）。例如：\n\n```xml\n<mx:SeriesInterpolate id=\"interpolateIn\"\
    \ duration=\"1000\"/>\n```\n\n8. 现在可以使用该效果，如下面清单 8.18 所示。\n\n```xml\n<mx:series>\n\
    \  <mx:ColumnSeries id=\"series\" displayName=\"Series 1\" yField=\"profit\" showDataEffect=\"\
    {interpolateIn}\"/>\n</mx:series>\n```\n\n清单 8.18 — 柱状图中柱形的数据效果\n\n9. 你甚至可以尝试使用\
    \ **SeriesSlide** 和 **SeriesZoom** 效果。\n\n10. 现在，假设你想查看利润在每个月份中各个业务部门的分布情况。那么你必须从图表向下钻取，以便在点击图表中的某个柱形时显示此详细信息。这可以通过使用图表的\
    \ itemClick 事件来实现。因此，你可以为一个名为 init() 的方法添加一个事件监听器，该方法将在应用程序的 creationComplete\
    \ 事件中被调用，如下面清单 8.19 所示。\n\n```actionscript\nprivate function init() {\nProfitChart.addEventListener(ChartItemEvent.ITEM_CLICK,\
    \ onItemClick);\n}\n```\n\n清单 8.19 – 点击事件监听器\n\n11. 在上述代码片段中，onItemClick 方法是事件处理函数，必须进行定义。假设每个月份都有一个\
    \ XML 文件，用于利润在各业务部门中的分布。例如，Oct.xml 包含十月份的数据，其他月份以此类推。这些文件中数据的示例如下面清单 8.20 所示。\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<items>\n<item industry=\"\
    Textiles\" value=\"30\" />\n<item industry=\"Agriculture\" value=\"50\" />\n<item\
    \ industry=\"Manufacturing\" value=\"20\" />\n</items>\n```\n\n清单 8.20 – 特定月份的详细数据\n\
    \n12. 在 itemClick 处理程序中，你需要根据所需哪个月份的数据，发送一个 HTTP 请求从这些 XML 文件中获取数据。你可以使用 HitData\
    \ 对象来获取事件触发时鼠标下方的数据，如下面清单 8.21 所示。\n\n```actionscript\nprivate function onItemClick(event:ChartItemEvent):void{\n\
    var month:String= event.hitData.item.month;\nvar request:HTTPService = new HTTPService();\n\
    request.url = \"data/\"+month+\".xml\";\nrequest.addEventListener(FaultEvent.FAULT,onFaultEvent);\n\
    request.addEventListener(ResultEvent.RESULT,onResultEvent);\nrequest.send();\n\
    }\n```\n\n清单 8.21 – 点击事件处理函数\n\n13. 上述 HTTP 请求的结果事件处理程序应重新定义图表的数据提供程序，并根据要显示的数据设置坐标轴，如下面清单\
    \ 8.22 所示。\n\n```actionscript\nprivate function onResultEvent (event:ResultEvent)\
    \ {\nstats = event.result.items.item;\nProfitChart.dataProvider=stats;\nseries.xField=\"\
    industry\";\nseries.yField=\"value\";\naxis.categoryField=\"industry\";\n}\n```\n\
    \n清单 8.22 – 重新定义值的函数\n\n14. 现在运行应用程序并点击某个月份，你可以看到向下钻取的数据出现，如图 8.8 所示。你可以添加一些事件处理代码以钻取回原始图表。这留作练习由你尝试。\n\
    \n![](img/c4119654311ebf24679359ca130a5ee6_196_0.png)\n\n## 8.9 总结\n\n在本章中，你学习了\
    \ Flex 3.0 中的各种图表选项。有十种可用的图表控件。对每种图表类型及其用法进行了描述，以帮助你根据应用程序的需求决定使用哪一种。你学习了如何创建\
    \ Flex 中两种最流行的图表类型：条形图和饼图。你还看到了对这些图表中样式进行格式化的示例。在章末，你获得了一些关于所有图表的通用功能的概述。本章还包含了一些练习，教你如何在图表中向下钻取以获取更多细节。\n\
    \n## 8.10 复习问题\n\n- 编写示例代码，为图表使用样式表\n- 在开发股市系统时，你应该使用哪种类型的图表？\n- 哪种图表没有水平和垂直坐标轴？\n\
    \n"
