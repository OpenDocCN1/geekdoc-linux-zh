    \n由于这是一个 Web 应用程序，根标签是 `<mx:Application>` 标签。在该标签内声明的 `creationComplete` 函数调用\
    \ HttpService 的 `send()` 函数，以从具有 id 为 `empService` 的 `<mx:HTTPService>` 标签中指定的\
    \ URL 获取数据。\n\n进而，这将调用相关的 JSP，该 JSP 将员工列表的 XML 返回给 Flex，然后将其渲染在数据网格中。\n\n具有 `id\
    \ emplist` 的数据网格标签 `<mx:DataGrid>` 指定了一个函数 `doSelection`，当选择数据网格中的任何项目或行时，该函数会被调用。\n\
    \n`doSelection()` 函数获取所选员工的员工编号（EMPNO），并据此创建一个 URL，然后由第二个 HTTPService 标签调用该 URL。当接收到\
    \ XML 时，该服务的结果处理方法 `detailsHandler` 会被触发。\n\n`detailsHandler()` 方法通过检查接收到的 XML\
    \ 是否只有一行来审查结果，以查看其是否为 ObjectProxy 类型。如果是，则手动创建一个数组集合。\n\n如果 HTTPService 的调用不成功，`faultHandler()`\
    \ 方法会被触发。此方法向用户显示一个警报，告知他们调用失败。\n\nMXML 代码的其余部分涉及定义应用程序的外观和感觉，您可以稍后进一步自定义。\n\n\
    ## 7.5.1.7 准备运行应用程序\n\n为了运行应用程序，请检查 `WEB-INF` 文件夹下的 `web.xml`。它必须在 `<welcome-file>`\
    \ 标签中包含文件 `EmpApp.html`。如果未找到，则添加以下行，如列表 7.18 所示。\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<web-app id=\"WebApp_ID\" version=\"2.4\"\nxmlns=\"\
    http://java.sun.com/xml/ns/j2ee\"\nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \nxsi:schemaLocation=\"http://java.sun.com/xml/ns/j2ee\nhttp://java.sun.com/xml/ns/j2ee/web_2_4.xsd\"\
    >\n    <display-name>EmpApp</display-name>\n    <welcome-file-list>\n        <welcome-file>EmpApp.html</welcome-file>\n\
    \    </welcome-file-list>\n</web-app>\n```\n\n## 列表 7.18 - web.xml 文件的内容\n\n现在右键单击项目\
