    # 8.9 Summary


    In this chapter, you learned about various charting options in Flex 3.0. There
    are ten charting controls available. Each chart type along with its usage was
    described to help you decide which one to use based on the requirements of your
    application. You learned how to create two of the most popular chart types in
    Flex: Bar and Pie Also you have seen examples to format the styles in those charts.
    Later in the chapter, you were given an overview about some generic features of
    all the charts. The chapter also included exercises that taught you how to drill
    down on a chart for more detail.


    # 8.10 Review questions


    +   1.  Write sample code to use a style sheet for a chart

    +   2.  Which type of chart should you use when developing a system for the stock
    market?

    +   3.  Which chart doesn''t have horizontal and vertical axes?'
