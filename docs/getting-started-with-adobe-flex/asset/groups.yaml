    \ 应用程序启动后的默认加载时长是多少，超过此时长进度条才会出现：\n    - A. 100 毫秒\n    - B. 1000 毫秒\n    - C.\
    \ 700 毫秒\n    - D. 5 秒\n    - E. 以上都不是\n7. 以下哪种控件可以仅使用 ActionScript 渲染？\n    -\
    \ A. Label\n    - B. Image\n    - C. Menu\n    - D. 以上全部\n    - E. 以上都不是\n8. Alert\
    \ 类中用于显示数据的静态方法名称是什么？\n    - A. display()\n    - B. show()\n    - C. init()\n\
    \    - D. render()\n    - E. 以上都不是\n9. 数据提供给 Flex 控件的方式有哪些？\n    - A. ArrayCollection\
    \ 对象\n    - B. XMLListCollection 对象\n    - C. A 和 B 都是\n    - D. XMLText 对象\n\
    \    - E. 以上都不是\n10. 您想要创建一个字段，让用户在地址文件中选择其当前居住地——应该使用以下哪种数据驱动控件？\n    - A. DataGrid\n\
    \    - B. ComboBox\n    - C. Tree\n    - D. 以上任意一种\n    - E. 以上都不是\n\n## 第 5 章\
    \ - 在控件之间绑定数据\n\nFlex 框架提供了一个强大的结构，旨在最大程度地促进组件驱动架构。在 MVC（模型-视图-控制器）架构中，视图和控制器与模型的行为绑定。在组件驱动架构中，这种方法不可行。在这种情况下，用户界面（UI）元素在模型之前构建，以提供组件在许多不同应用程序中的重用性。在\
    \ Flex 中，我们通过称为数据绑定的机制来实现这一点。\n\n在本章中，您将学习：\n\n- 数据绑定\n- 数据绑定的不同方式\n- 数据绑定和存储机制\n\
    - 数据绑定和 UI 控件\n\n## 5.1 数据绑定 – 大局观\n\n数据绑定是 Flex 中一个非常有趣的概念。它使您能够更高效地在客户端管理数据。图\
    \ 5.1 提供了数据绑定的概述。\n\n![](img/c4119654311ebf24679359ca130a5ee6_96_0.png)\n\n"
