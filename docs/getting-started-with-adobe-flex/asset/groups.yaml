    \ TileList 控件\n- D. DataGrid 控件\n- E. 以上都不是\n\n10. 以下哪些是 Flex 提供的层级控件？\n- A. Menu\
    \ 控件\n- B. Tree 控件\n- C. DataGrid 控件\n- D. MenuBar 控件\n- E. 以上所有\n\n## 第 6 章 -\
    \ 使用视图状态、过渡和滤镜\n\n在本章中，你将学习如何根据用户正在执行的任务来更改应用程序界面的外观和感觉的基本方法。一个例子是当用户将鼠标悬停在图标上时，更改该图标的图像。通过使用视图状态、过渡和滤镜，可以轻松地构建富互联网应用程序（RIA）。\n\
    \n在本章中，你将了解以下内容：\n\n- 视图状态\n- 使用带有状态的组件\n- 使用效果\n- 使用过渡\n- 在效果中使用滤镜\n\n### 6.1\
    \ 使用视图状态、过渡和滤镜：宏观概览\n\n视图状态允许你根据某些用户操作来更改应用程序的外观。过渡允许你定义这种视图状态变化在屏幕上的呈现方式。过渡是通过效果类来定义的，结合了专门用于处理过渡的不同效果。图\
    \ 6.1 提供了这些概念之间关系的概览。\n\n![](img/c4119654311ebf24679359ca130a5ee6_114_0.png)\n\
    \n![](img/c4119654311ebf24679359ca130a5ee6_115_0.png)\n\n在图中，*视图状态 1* 是 UI 的初始状态。当定义的*过渡*应用于此视图状态时，UI\
    \ 会变为*视图状态 2*。过渡是使用不同的效果（*效果 1、效果 2... 效果 N*）定义的。可以使用不同的*滤镜*连同效果来有条件地应用这些效果。滤镜用于仅将定义的效果有条件地应用于*过渡*中定义的子集目标组件。\n\
    \n### 6.2 视图状态\n\n*状态*是对视图变更的集合。假设我们有一个包含许多组件（容器和控件）的视图。那么，如果这些视图组件的任何布局发生变化，它就成为一个视图状态。每个继承\
    \ `UIComponent` 类的组件都将拥有视图状态，并且这些组件将继承 states 属性。\n\n#### 6.2.1 创建状态\n\n在 Flex\
    \ Builder 的设计视图中可以轻松创建状态。让我们通过一个简单的示例来看看如何操作。请遵循以下步骤：\n\n1. 创建一个新的 Flex 项目。\n\n\
    2. 切换到设计视图，并使用布局工具添加两个组件，一个面板和一个按钮，如下面的*图 6.2*所示。这现在成为应用程序的基础状态。\n\n![](img/c4119654311ebf24679359ca130a5ee6_115_1.png)\n\
    \n3. 现在，你可以基于此基础状态创建一个新的状态。选择*窗口 -> 显示视图 -> 状态*以打开状态视图。*图 6.3*显示了状态视图。现在，点击如图下所示的*新建状态*图标。将出现一个弹出窗口。将新状态命名为\
    \ *firstState*，然后指定其基于的组件。在此示例中，它基于 `<base state>`。如果希望此状态为起始状态，可以可选地勾选“设为起始状态”选项。暂时不要勾选该选项，因为我们要将基础状态作为起始状态。\n\
    \n![](img/c4119654311ebf24679359ca130a5ee6_116_0.png)\n\n**图 6.3 - 状态视图**\n\n\
    4. 现在，为此新状态添加一个 TextArea，并如下所示定义 TextArea 的一些属性。\n\n```xml\n<mx:TextArea id=\"\
    txt1\" x=\"10\" y=\"10\" width=\"260\" height=\"210\"\n text=\"My First State\"\
    \ fontSize=\"20\" textAlign=\"center\"\n backgroundColor=\"#FFEA00\"/>\n```\n\n\
    5. 你可以像之前图 6.3 中展示的那样以相同的方式添加另一个状态，并将其命名为 *secondState*。你可以添加尽可能多的状态。你甚至可以为此每个新状态添加多个你选择的组件。\n\
    \n6. 你可以检查源代码视图，以查看我们在创建这些新状态并向其添加组件时后台发生了什么。清单 6.1 展示了生成的代码。\n\n```xml\n<mx:Panel\
    \ id=\"panel1\" x=\"0\" y=\"0\" width=\"300\" height=\"300\"\n layout=\"absolute\"\
    \ title=\"Learn how to change states\">\n <mx:Button x=\"99\" y=\"228\" label=\"\
    Change\"\n click=\"onClick(event)\"/>\n</mx:Panel>\n<mx:states>\n <mx:State name=\"\
    firstState\">\n <mx:AddChild relativeTo=\"[panel1]\" position=\"lastChild\">\n\
    \ <mx:TextArea id=\"txt1\" x=\"10\" y=\"10\" width=\"260\"\n height=\"210\"\n\
    \ text=\"My First State\" fontSize=\"20\" textAlign=\"center\"\n backgroundColor=\"\
    #FFEA00\"/>\n </mx:AddChild>\n </mx:State>\n <mx:State name=\"secondState\">\n\
    \ <mx:AddChild relativeTo=\"[panel1]\" position=\"lastChild\">\n <mx:TextArea\
    \ id=\"txt2\" x=\"10\" y=\"10\" width=\"260\"\n height=\"210\"\n text=\"My Second\
    \ State\" fontSize=\"20\" textAlign=\"center\"\n backgroundColor=\"#0036FF\"/>\n\
    \ </mx:AddChild>\n </mx:State>\n</mx:states>\n```\n\n**清单 6.1 - 定义状态**\n\n7. 现在，在源代码视图中为按钮添加一个事件处理程序，以便在当前状态之间切换。ActionScript\
    \ 代码如下面的清单 6.2 所示。\n\n```actionscript\n<mx:Script>\n    <![CDATA[\n    private\
    \ function onClick(e:MouseEvent):void{\n        if (currentState=='firstState')\n\
    \            currentState='secondState';\n        else if(currentState=='secondState')\n\
    \            currentState='firstState';\n        else\n            currentState='firstState';\n\
    \    }\n    ]]>\n</mx:Script>\n```\n\n**清单 6.2 - 在状态之间切换的代码**\n\n8. 运行应用程序，你可以看到如图\
    \ 6.4 所示的输出。这是应用程序的基础状态。\n\n![](img/c4119654311ebf24679359ca130a5ee6_117_0.png)\n\
    \n9. 现在点击*change* 按钮，你可以看到如图*图 6.5*所示的你创建的第一个状态。\n\n![](img/c4119654311ebf24679359ca130a5ee6_118_0.png)\n\
    \n**图 6.5 - 用户第一次点击 *change* 按钮时的状态**\n\n10. 再次点击 *Change* 按钮，你可以查看如图 *图 6.6*\
    \ 所示的第二个状态。\n\n![](img/c4119654311ebf24679359ca130a5ee6_118_1.png)\n\n**图 6.6\
    \ - 用户第二次点击 *Change* 按钮时的状态**\n\n11. 使用设计视图创建不同的状态很简单，但你需要了解后台创建的所有代码。因此，让我们来看看这些新标签。\n\
