    下载 Apache Tomcat，并将其安装到如 C:\Apache_Tomcat 这样的目录中。从现在开始，该目录将被称为 TOMCAT_INSTALL_DIR。


    该应用程序将使用 DB2 中 SAMPLE 数据库自带的 EMPLOYEE 表。如果在安装 DB2 时未创建此数据库，你可以通过进入 *开始 -> 运行*，并输入
    **db2cmd** 来创建它。当 DB2 CLP 窗口出现时，输入 **db2sample** 并按下 Enter 键。等待几分钟，让此命令创建数据库。


