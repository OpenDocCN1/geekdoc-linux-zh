  md: "\n## 6.5 Filters\n\nFilters allow you to apply an effect on a particular target\
    \ component or a subset of target components. Without filters, all the effects\
    \ defined in a transition are by default applied to all the target components.\n\
    \nFor either a sequence or parallel effect, you can define the filter property.\
    \ For example, if the filter property is specified a value of move, then the effect\
    \ will apply only to those components whose x or y values change during the change\
    \ of view state.\n\n### 6.5.1 Common Filters\n\nSome of the most commonly used\
    \ values for the filter property as available in Adobe documentation are listed\
    \ in Table 6.3 below.\n\n| Value | Description |\n| :---- | :---- |\n| add | Specifies\
    \ to play the effect on all children added during the change of view state. |\n\
    | hide | Specifies to play the effect on all children whose visible property changes\
    \ from true to false during the change of view state. |\n| move | Specifies to\
    \ play the effect on all children whose x or y properties change during the change\
    \ of view state. |\n| remove | Specifies to play the effect on all children removed\
    \ during the change of view state. |\n| resize | Specifies to play the effect\
    \ on all children whose width or height properties change during the change of\
    \ view state. |\n| show | Specifies to play the effect on all children whose visible\
    \ property changes from false to true during the change of view state. |\n\nTable\
    \ 6.3 - Filter property value\n\n### 6.5.2 Applying Filters\n\nThe filter property\
