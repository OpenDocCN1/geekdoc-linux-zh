    # ### 5.4.4 Hierarchical Data Controls


    Flex has some Hierarchical data-driven controls which are really useful when the
    data is hierarchical by nature which means that all data items have a parent-child
    relationship. The main set of hierarchical data controls are:


    +   - Tree Control

    +   - Menu Control

    +   - MenuBar Control


    # #### 5.4.4.1 Tree control


    The Tree control allows users to view hierarchical data arranged in a tree like
    fashion. Each item in the tree is called a node and can be either a leaf or a
    branch. A branch can either be empty or contain a leaf or branch of nodes. The
    Tree control is implemented in a Flex Application by using the `<mx:Tree />` MXML
    tag. Listing 5.21 illustrates sample code used to create a Tree control.


    ```

    <mx:Tree id="tree" labelField="@label1" showRoot="true" width="160">

    <mx:XMLListCollection id="treelist">

    <mx:XMLList>

    ```'
