    ## 7.5 数据库操作


    Flex 无法直接访问数据库；不过，你可以使用 Flex 提供的功能来与诸如 DB2 之类的数据库进行数据发送和接收。利用本章前文讨论的基于 RPC 的服务，你可以与远程数据服务器交换数据。


    例如，你可以开发一个前端 Flex 应用程序，该应用程序使用 HTTP 服务调用应用程序服务器中的 JSP。该 JSP 会调用一个使用 JDBC 访问 DB2
    数据的 Java 类。下一节将更详细地说明此示例。


    另一种操作数据服务器的方式是创建数据 Web 服务。数据 Web 服务是一种从数据库获取信息的 Web 服务。使用 IBM Data Studio 等免费工具，只需几分钟即可创建它。一旦创建了数据
    Web 服务，你就可以在 MXML 中使用 `<mx:WebService>` 标签从 Flex 应用程序中调用它。


    > **注意：**

    > 本章使用 DB2 Express-C（DB2 数据服务器的免费版本）作为示例和练习的环境。如果你想跟随操作，请从 ibm.com/db2/express
    下载并安装 DB2 Express-C。有关 DB2 的更多信息，请参阅附录 B “DB2 快速入门”或电子书 *Getting started with
    DB2 Express-C*。有关数据 Web 服务和 IBM Data Studio 的更多信息，请参阅电子书 *Getting started with
    IBM Data Studio for DB2*。这两本书都是 DB2 on Campus 丛书的一部分。


    ### 7.5.1 访问 DB2 数据库的 Flex 应用程序示例


    让我们开发一个简单的名为 *Employee Portal* 的 Flex 应用程序，该应用程序通过 *HTTPService* 和一些 JSP 连接到数据库。该应用程序的架构如下
    *图 7.7* 所示。


    ![](img/c4119654311ebf24679359ca130a5ee6_150_0.png)


    **图 7.7 - 访问 DB2 数据库的 Flex 应用程序示例架构**


    如图 7.7 所示，应用程序流程如下：


    1. Flex 应用程序向驻留在 Tomcat 服务器上的 JSP 发起 HTTPService 调用。

    2. 该 JSP 进而调用包含业务逻辑的 Java 类，以从数据库访问数据。

    3. Java 类通过向数据库发送查询以供执行来访问数据库中的数据。

    4. 数据库将结果集返回给调用者。

    5. Java 类将数据格式化为 *Employee* 对象或 *Employee* 对象列表并返回。

    6. JSP 随后将从 Java 类接收的数据格式化为 XML，并将其发送回 Flex 应用程序。


    > **注意：**

    > 本节假设读者对 Java、JSP 和 JDBC 有基本的了解。有关这些主题的更多信息，请参阅属于 DB2 on Campus 丛书一部分的电子书 *Getting
    started with Java*。


    该应用程序使用 Flex 前端执行以下任务：

    - 显示员工列表

    - 显示所选特定员工的详细信息。


    当应用程序开发完成后，其外观将如 *图 7.8* 所示。


    ![](img/c4119654311ebf24679359ca130a5ee6_151_0.png)


