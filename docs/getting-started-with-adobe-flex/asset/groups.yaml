    value\" />\n    </mx:columns >\n</mx:DataGrid>\n```\n\n**Listing 5.23** - 使用即插即用项渲染器的示例\n\
    \n上述列表产生的显示效果如下图所示的 **图 5.11**。\n\n![](img/c4119654311ebf24679359ca130a5ee6_111_0.png)\n\
    \n**图 5.11** - 带即插即用项渲染器控件的数据网格（DataGrid）\n\n### 5.5.2 内联项渲染器\n\n内联项渲染器与即插即用项渲染器类似，不同之处在于我们可以使用内联项渲染器来配置项渲染器的值。为了创建更灵活的项渲染器，我们将项渲染器开发为一个内联组件。下方的\
    \ **Listing 5.24** 展示了如何使用内联项渲染器。此代码片段使我们在前面的示例中讨论的 NumericStepper 变得可配置。如你所见，我们为\
