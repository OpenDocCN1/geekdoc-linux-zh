    ```\n\n# **Listing 7.17 - EmpApp.mxml**\n\nAs this is a Web application the root\
    \ tag is the `<mx:Application>` tag. The `creationComplete` function declared\
    \ within this tag, invokes the HttpService's `send()` function to fetch the data\
    \ from the URL specified in the `<mx:HTTPService>` tag with the id empService.\n\
    \nThis in turn invokes the concerned JSP which returns an XML of employee list\
    \ back to Flex and it is then rendered in the data grid.\n\nThe data grid tag\
    \ `<mx:DataGrid>` with `id empList` specifies a function `doSelection` which gets\
    \ called upon selecting any of the items or rows in the data grid.\n\nThe `doSelection()`\
    \ function gets the selected employee's employee number (EMPNO) and creates a\
    \ URL out of it which is then invoked by the second HTTPService tag. When the\
    \ XML is received, the result handler method for this service, `detailsHandler`\
    \ gets triggered.\n\nThe `detailsHandler()` method checks if the XML received\
    \ has a single row by reviewing the result with the ObjectProxy type. If found,\
    \ it manually creates an array collection out of it.\n\nThe `faultHandler()` method\
    \ is triggered if the call made by the HTTPService is unsuccessful. This method\
    \ displays an alert to the user, letting them know that the call was unsuccessful.\n\
    \nThe rest of the MXML code, deals with defining the look and feel of the application\
    \ which you can further customize later.\n\n# **7.5.1.7 Preparing to run the Application**\n\
