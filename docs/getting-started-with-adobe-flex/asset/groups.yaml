    \ 4.4.4 数据驱动控件\n\n如果应用程序不能显示和操作结构化的数据集，那么它就没有用处。Flex 拥有一套非常丰富和多样化的控件，可以接受来自数据提供者的数据。尽管基于菜单的控件在这方面具有相似性，但它们在本质上是静态的，很少用于显示可变数量的数据对象。表\
    \ 4.10 包含 Flex 3 中数据提供控件的列表。\n\n"
