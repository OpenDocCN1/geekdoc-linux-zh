    \n9. Now click on the *change* button and you can see the first state that you\
    \ created as shown in *Figure 6.5*.\n\n![](img/c4119654311ebf24679359ca130a5ee6_118_0.png)\n\
    \n**Figure 6.5 - State when the user clicks the *change* button for the first\
    \ time**\n\n10. Click again on the *Change* button and you can view the second\
