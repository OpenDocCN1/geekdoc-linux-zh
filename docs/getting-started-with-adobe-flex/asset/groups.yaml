    # 5.5 Item renderer controls


    Item renderer controls are used to override the display mechanism for Flex''s
    list based objects. It can be used in conjunction with all the controls that we
    have discussed earlier in this chapter because all of them inherit from the **ListBase**
    class. Incorporation of item renderers into your projects add value and helps
    in producing significantly more functional and dynamic projects.


    There are mainly three types of item renderers available:


    +   * Drop-In item renderers


    +   * Inline item renderers


    +   * Custom item renderers


    +   * We will be using the DataGrid ListBase object for our examples below.'
