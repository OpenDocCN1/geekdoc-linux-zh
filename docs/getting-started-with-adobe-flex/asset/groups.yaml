    \ EmpApp.mxml\n\nAs this is a Web application, the root tag is the `<mx:Application>`\
    \ tag. The `creationComplete` function declared within this tag invokes the HttpService's\
    \ `send()` function to fetch the data from the URL specified in the `<mx:HTTPService>`\
    \ tag with the id `empService`.\n\nThis in turn invokes the concerned JSP which\
    \ returns an XML of employee list back to Flex, and it is then rendered in the\
    \ data grid.\n\nThe data grid tag `<mx:DataGrid>` with `id emplist` specifies\
    \ a function `doSelection` which gets called upon selecting any of the items or\
    \ rows in the data grid.\n\nThe `doSelection()` function gets the selected employee's\
    \ employee number (EMPNO) and creates a URL out of it which is then invoked by\
    \ the second HTTPService tag. When the XML is received, the result handler method\
    \ for this service, `detailsHandler`, gets triggered.\n\nThe `detailsHandler()`\
    \ method checks if the XML received has a single row by reviewing the result with\
    \ the ObjectProxy type. If found, it manually creates an array collection out\
    \ of it.\n\nThe `faultHandler()` method is triggered if the call made by the HTTPService\
    \ is unsuccessful. This method displays an alert to the user, letting them know\
    \ that the call was unsuccessful.\n\nThe rest of the MXML code deals with defining\
    \ the look and feel of the application, which you can further customize later.\n\
    \n## 7.5.1.7 Preparing to run the Application\n\nIn order to run the application,\
    \ check the `web.xml` under the `WEB-INF` folder. It must contain the file `EmpApp.html`\
    \ in the `<welcome-file>` tag. If not found, then add the following line to it,\
    \ as shown in Listing 7.18.\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    ?>\n<web-app id=\"WebApp_ID\" version=\"2.4\"\nxmlns=\"http://java.sun.com/xml/ns/j2ee\"\
    \nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\nxsi:schemaLocation=\"\
    http://java.sun.com/xml/ns/j2ee\nhttp://java.sun.com/xml/ns/j2ee/web_2_4.xsd\"\
    >\n    <display-name>EmpApp</display-name>\n    <welcome-file-list>\n        <welcome-file>EmpApp.html</welcome-file>\n\
    \    </welcome-file-list>\n</web-app>\n```\n\n## Listing 7.18 - Contents of the\
    \ web.xml file\n\nNow right-click on the project *EmpApp* and select *Run As*\
    \ -> *Run on Server* as shown in *Figure 7.17*.\n\n![](img/c4119654311ebf24679359ca130a5ee6_169_0.png)\n\
    \n## Figure 7.17 - Running the Project\n\nThis will deploy the application to\
    \ the Tomcat server and run it in the Eclipse embedded web client. The initial\
