- pgno: 192
  md: "| Property | Description |\n| :--- | :--- |\n| clustered | Chart elements for\
    \ each series are grouped by category. This is the default value for BarChart\
    \ and ColumnChart controls. |\n| overlaid | Chart elements for each series are\
    \ rendered on top of each other, with the element corresponding to the last series\
    \ on top. This is the default value for AreaChart controls. |\n| overlaid | Each\
    \ series are stacked on top of each other. Each element represents the cumulative\
    \ value of the elements beneath it. |\n| 100% | On top of each other, adding up\
    \ to 100%. Each chart element represents the percentage that the value contributes\
    \ to the sum of the values for that category. |\n\nTable 8.1 - Values supported\
    \ by the type property\n\n# 8.8.3 Fill\n\nFor charting multiple data series, or\
    \ just to improve the appearance of your charts, you can control the fill for\
    \ each series in the chart or each item in a series. The fill lets you specify\
    \ a pattern that defines how Flex draws the chart element. You also use fills\
    \ to specify the background colors of the chart or bands of background colors\
    \ defined by the grid lines. Fills can be solid or can use linear and radial gradients.\
    \ A gradient specifies a gradual color transition in the fill color.\n\n# 8.9\
    \ Exercises\n\nIt is now time for you to apply what you have learned in this chapter\
    \ along with some new items. This exercise will show you how to create a chart\
