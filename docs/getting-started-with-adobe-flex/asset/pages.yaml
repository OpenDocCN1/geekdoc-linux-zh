  md: "# # A\n\n# ## Appendix A – Solutions to review questions\n\n# **Chapter 1**\n\
    \n+   1. Rich Internet applications (RIA) are Web applications that have the features\
    \ and functionality of traditional desktop applications. RIA can also be defined\
    \ as a mix of three things: desktop-like UI online, offline applications that\
    \ look like online applications, and online applications that can go offline whenever\
    \ they are required to store the state of the program.\n\n+   2. The goal of the\
    \ Model-View-Controller (MVC) architecture is to create components that are well-defined\
    \ and with limited scope in the application. This increases reusability of the\
    \ components and improves maintainability of the overall system. Using Flex, we\
    \ partition the view Component which defines the applications’ user interface.\n\
    \n+   3. You can use Flex 3 to create a wide range of highly interactive, expressive\
    \ applications. For example, a data visualization application built in Flex can\
    \ pull data from multiple back-end sources and display it visually. Business users\
    \ can drill down into the data for deeper insight and even change the data and\
    \ have it automatically updated on the back end.\n\n+   4. Flex is a suite of\
    \ tools and an environment to build bigger. more reliable and more complex Flash\
    \ Applications. You can do anything in Flash that can be done in Flex but it is\
    \ harder. Flex provides the ability to create SWF files that run on Adobe Flash\
    \ Player in any browser.\n\n+   5. The main features that were introduced in Flex\
    \ 3.0 are listed below:\n+   \t* Profiler to Monitor Memory and CPU Consumption\n\
    +   \t* Refactoring\n+   \t* Persistent Caching\n+   \t* Wizards to generate Code\n\
    +   \t* Charting Enhancements\n+   \t* DataGrid Component\n\n+   6. C – supported\
    \ languages ActionScript and MXML\n\n+   7. B - Microsoft SilverLight, C - Ajax,\
