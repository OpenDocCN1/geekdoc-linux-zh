    \ displaying the xml contents**\n\n# ### 7.4.6 Using the result and fault events\n\
    \nIf you tried to run the above sample application, it is likely that the response\
    \ came back quickly; however, in real-life applications you may often encounter\
    \ that the response may take a long time, and you may not know whether your application\
    \ is actually working or if some error happened. Flex provides two attributes\
    \ for the HTTPService class, result and fault, that help manage the errors that\
    \ can happen during the HTTP request. These attributes are actually events that\
    \ can be linked to event handlers as shown below.\n\n```\n<mx:HTTPService id=\"\
    myHTTPService\" url=\"data/states.xml\"\nresult=\"resultHandler(event)\" fault=\"\
    faultHandler(event)\"/>\n```\n\nThese handlers should be provided in the ActionScript\
    \ code in Listing 7.12\n\n```\n<mx:Script>\n    <![CDATA[\n        import mx.rpc.events.ResultEvent;\n\
    \        import mx.rpc.events.FaultEvent;\n        \n        private function\
    \ resultHandler(e:ResultEvent):void\n        {\n        }\n        \n        private\
    \ function faultHandler(e:FaultEvent):void\n        {\n        }\n    ]]>\n</mx:Script>\n\
    ```\n\n**Listing 7.12 – Using Result and Fault Events**\n\n# ### 7.4.7 Using the\
    \ E4X Format\n\nThe HTTPService object has a **ResultFormat** property which sets\
    \ the data type of the LastResult object. By default this property is of type\
    \ Object. The **ResultFormat** property can also accept values in array format,\
    \ xml, flashvars, text or E4X (ECMAScript for XML). This format allows to navigate\
    \ between the nodes of XML and to skip nodes to access a child node. You can also\
    \ search for a string in the xml file and filter data based on some set"
