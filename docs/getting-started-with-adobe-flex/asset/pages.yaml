    \ DataBinding one needs to use the ArrayCollection class rather than the Array\
    \ class. ArrayCollection provides all the features of an Array plus more. Every\
    \ ArrayCollection class contains an Array as the data source. The ArrayCollection\
    \ and the underlying Array class are mainly used to display flat data or linear\
    \ data. ArrayCollection class can be created both by using the MXML tags or the\
