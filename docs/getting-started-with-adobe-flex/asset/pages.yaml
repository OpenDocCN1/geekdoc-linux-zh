    # ### 5.4.4 Hierarchical Data Controls


    Flex has some Hierarchical data-driven controls which are really useful when the
    data is hierarchical by nature which means that all data items have a parent-child
    relationship. The main set of hierarchical data controls are:


    +   - Tree Control

    +   - Menu Control

    +   - MenuBar Control


