    \        <mx:String>Triangle</mx:String>\n      </mx:Array>\n    </mx:source>\n\
    \  </mx:ArrayCollection>\n  <mx:List id=\"myList\" width=\"200\" height=\"100\"\
    \ dataProvider=\"{shapes}\"/>\n</mx:Application>\n```\n```\n\nListing 5.15 - Code\
