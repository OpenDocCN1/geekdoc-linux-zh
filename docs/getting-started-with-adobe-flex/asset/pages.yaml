    # 5.4.1.3 TileList control


    The TileList control is similar to the List and HorizontalList controls as discussed
    earlier except that it displays the item in a tile-like fashion and the direction
    of the layout can be specified. The height and width of the individual tiles can
    also be set by setting the width of the Tilelist columns or the height of the
    TileList rows. The `mx.controls.TileList` class can be used in a Flex application
    by using the `<mx:TileList />` MXML tag. Listing 5.17 provides a code snippet
    example and Figure 5.4 illustrates how the horizontal TileList would look.


    ```

    `<mx:TileList direction="horizontal" dataProvider="{shapes}" rowCount="2" rowHeight="100"/>`

    ```


