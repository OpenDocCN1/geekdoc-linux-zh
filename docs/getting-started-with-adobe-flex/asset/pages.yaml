- pgno: 96
  md: '# Chapter 5 - Binding data between controls


    The Flex framework provides a robust structure built to maximize the facilitation
    of component-driven architectures. In the MVC (Model-View-Controller) architecture,
    the view and the controller are tied to the behavior of the model. In Component
    driven architecture, this approach is not feasible. In this case the user interface
    (UI) elements are built before the model, to provide reusability of the components
    across many different applications. In Flex we achieve this with what is called
    data binding.


    In this chapter you will learn about:


    +   Data binding

    +   Different ways of data binding

    +   Data binding and storage mechanisms

    +   Data binding and UI controls


    # 5.1 Data binding – The big picture


    Data binding is a very interesting concept in Flex. It enables you to manage data
    more efficiently on the client side. Figure 5.1 provides an overview of data binding.


    ![](img/c4119654311ebf24679359ca130a5ee6_96_0.png)'
  merge: -1
  img_proc: true
- pgno: 97
  md: "Data binding is the process of tying the data in one object (the source) to\
    \ another object (the destination). As we can see in the figure, when the source\
    \ object is changed, those changes are automatically reflected in the destination\
    \ object through a triggering event. Data binding provides a convenient way to\
    \ pass data between the different layers of the application. It is a combination\
    \ of generated code, event listeners and handlers, error catching and the use\
    \ of metadata through object introspection. Behind the scenes, Flex generates\
    \ a lot of code on your behalf.\n\n# ### 5.2 Ways to achieve data binding\n\n\
    There are multiple ways to achieve data binding in Flex:\n\n+   Using curly braces\
    \ ({{}}) syntax\n+   Using ActionScript expressions in curly braces\n+   Utilizing\
    \ the `<mx:binding>` tag in MXML.\n+   Using **BindingUtils** in ActionScript\n\
    \n# #### 5.2.1 Curly braces ({{}}) syntax\n\nIn Listing 5.1 below a Text control\
    \ gets its data from a TextInput's property. Since the property name is inside\
    \ the curly braces ({{}}) it means that it is source property of the binding expression.\
    \ Flex copies the current value of the source property (myTextInput.text) to the\
    \ destination property, the TextControls text property (myTextDestination), whenever\
    \ the source changes.\n\n```\n```xml\n<mx:TextInput id=\"myTextInput\" editable=\"\
    true\" enabled=\"true\"/>\n    <mx:Text id= \"myTextDestination\" text=\"{myTextInput.text}\"\
    />\n```\n```\n\n# Listing 5.1 – Using the curly braces ({{}}) syntax for data\
    \ binding.\n\n# #### 5.2.2 ActionScript expressions in curly braces ({{}})\n\n\
    Curly braces can also contain ActionScript expressions. For example, they can\
    \ include calculations and string concatenation on a bindable property. Listing\
    \ 5.2 below illustrates this case.\n\n```\n```xml\n<mx:Model id=\"myBinding\"\
    >\n    <myBinding>\n        <!-- Perform string concatenation. -->\n        <a>This\
    \ is {nameInput.text}</a>\n        <!-- Perform a calculation. -->\n        <b>{(Number(numberInput.text)\
    \ as Number) + 100}</b>\n    </myBinding>\n</mx:Model>\n<mx:Panel width=\"100%\"\
    \ height=\"100%\" title=\"Binding expressions\">\n    <mx:Form>\n        <mx:FormItem\
    \ label=\"Name:>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 98
  md: "```\n```\n<mx:TextInput id=\"nameInput\"/>\n</mx:FormItem>\n<mx:FormItem label=\"\
    Enter a number:\">\n    <mx:TextInput id=\"numberInput\" text=\"0\"/>\n</mx:FormItem>\n\
    </mx:Form>\n<mx:Text text=\"{'Concatenation: ' + myBinding.a}\"/>\n<mx:Text text=\"\
    {'Calculation:  100 + ' + numberInput.text+' =\n    ' + myBinding.b}\"/>\n</mx:Panel>\n\
    ```\n```\n\nListing 5.2 – Using ActionScript within curly braces ({}) for data\
    \ binding.\n\n# 5.2.3 <mx:binding> tag in MXML\n\nThe <mx:Binding> tag can be\
    \ used as an alternative to the curly braces syntax. The source property can be\
    \ provided using the source property of the <mx:binding> tag and the destination\
    \ property is used for the destination. The <mx:binding> tag also lets you bind\
