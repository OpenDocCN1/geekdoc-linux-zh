    # # Chapter 4 - Working with Flex components


    Flex is a tool to develop rich user interfaces – visual components are the main
    building blocks for that. Users interact with any Flex application almost entirely
    through components. Flex components are broadly classified into two categories
    - controls and containers. Charting is another set of components provided in Flex
    3.0 Professional Edition, but those will be discussed in *Chapter 8*.


    In this chapter you will learn about:


    +   * The Flex component class hierarchy

    +   * Working with containers

    +   * Working with controls


    # ## 4.1 Working with Flex components: The big picture


    **Flex Components** are the building blocks to build Flex applications. Behind
    the scenes, they are basically classes defined in Flex. Flex has innumerable components
    – both containers and individual controls. *Figure 4.1* illustrate the relationship
    between them.


    ![](img/c4119654311ebf24679359ca130a5ee6_74_1.png)


    # ### Figure 4.1 - Relationship between Flex components: Containers and controls


    A *container* defines a rectangular region of the rendering surface of Adobe Flash
    Player. As shown in the above figure, a container can contain both controls and
    other containers. Components defined within a container are called children of
    the container. Every Flex application has a root container called the Application
    container that represents the entire'
  merge: -1
