    # 7.5 Working with databases


    Flex cannot directly access a database; however, you can use Flex facilities to
    send and receive data from a database such as DB2. Using RPC-based services discussed
    earlier in the chapter, you can exchange data with the remote data servers.


    For example, you can develop a front-end Flex application that uses an HTTP service
    call to a JSP in an application server. The JSP invokes a Java class which uses
    JDBC to access the DB2 data. This example is illustrated in more detail in the
    next section.


    Another way to work with a data server is by creating a Data Web Service. A data
    Web service is a Web service where the information is taken from a database. This
    can be created in few minutes using a free tool like IBM Data Studio. Once the
    data Web service is created, you can invoke it from a Flex application using the
    <mx:WebService> tag in MXML.


    > **Note:**

    > This chapter uses DB2 Express-C, the free version of the DB2 data server for
    the examples and exercises. If you would like to follow along, download and install
    DB2 Express-C from ibm.com/db2/express. For more information about DB2, refer
    to Appendix B, Up and running with DB2 or review the ebook Getting started with
    DB2 Express-C. For more information about Data Web Services and IBM Data Studio,
    refer to the ebook Getting started with IBM Data Studio for DB2. Both books are
    part of the DB2 on Campus book series.


    # 7.5.1 Sample Flex application accessing a DB2 database


    Let''s develop a simple Flex application called *Employee Portal* that is connected
    to a database using *HTTPService* and some JSPs. The application architecture
    looks like *Figure 7.7* below.'
