    \   name=\"No default, required.\"\n    makeObjectsBindable=\"false|true\"\n \
    \   fault=\"No default.\"\n    result=\"No default.\"\n/>\n\n```\n\n*Listing 7.8*\
    \ - Syntax of the **<mx:method>** tag\n\n# 7.3.3 **<mx:arguments>** tag\n\nAn\
    \ **<mx:method>** tag can have a single **<mx:arguments>** tag as child tag. This\
    \ tag represents an array of objects to be sent as parameter to the remote object’s\
    \ method in an order.\n\n```\n<mx:arguments></mx:arguments>\n\n```\n\n> Note:\n\
    > It is beyond the scope of this book to discuss the usage of remote object in\
    \ Flex applications as it uses the Flex Data Services.\n\n# 7.4 Using HTTPService\n\
    \nAnother tool that Flex provides for accessing remote data is the **HttpService\
    \ Request Object**. The flex application will send an HttpService request to access\
    \ remote data. Since Flex does not directly interact with the database, a Web\
    \ server will respond to the Http Service Request by querying the database and\
    \ returning the results. *Figure 7.5* shows how Flex uses HttpService for communicating\
    \ with the data server."
