- pgno: 234
  md: 'Getting started with Adobe Flex couldn’t be easier. Read this book to:


    +   * Understand how to build rich internet applications using Adobe Flex

    +   * Learn how to work with Flex Builder to create, run and debug Flex applications

    +   * Understand how Adobe Flex works with Web services and databases

    +   * Learn about the Flex programming basics using MXML and ActionScript

    +   * Get up to speed with powerful features like data binding, view states, and
    charting

    +   * Practice with hands-on exercises


    Adobe Flex is the technology of the future; it takes you to the next level of
    Web application development by providing a free open source framework to develop
    Rich Internet Applications (RIAs). Flex Builder Software, an Eclipse-based IDE,
    can be used to accelerate your application development since it includes many
    rich features. With this highly productive, free open source framework you can
    start building and maintaining very interactive and intuitive Web applications
    that deploy across all browsers and desktops in no time!


    Using the Flex framework, you can build enterprise-class software that can be
    used in combination with other server side technologies such as PHP, J2EE, ColdFusion,
    .NET, and so on. You can also work with other free software such as DB2 Express-C,
