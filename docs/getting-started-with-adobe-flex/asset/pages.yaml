    # 3.5 Summary


    In this chapter you learned about MXML and ActionScript. The goal of this chapter
    was not to make you an ActionScript expert but to provide an overview about this
    great language.


    Firstly you learned that MXML is a vocabulary of XML created for Flex applications.
    The chapter reviewed some basic concepts of XML such as the anatomy of a tag,
    and namespaces.


    Later on in the chapter, ActionScript, the building block of the Flex framework
    was introduced. Here you learned about the basics of the ActionScript language
    and how it could be effectively used along with MXML. You also learned the basics
    of event handling.


    The forthcoming chapters will introduce you to Flex components and their events
    in greater detail.


