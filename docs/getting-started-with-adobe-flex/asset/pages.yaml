- pgno: 119
  md: "# 6.2.1.1 The <mx:states> tag\n\nThe states property defines an array of view\
    \ states for a view component. Every view component will have a base state, which\
    \ is the first state. The base state is the default state of any Flex application.\
    \ The states property cannot be specified on any child controls. It can only be\
    \ specified on the root of a custom control or application.\n\n# 6.2.1.2 The <mx:State>\
    \ tag\n\nA State object can be added to the state property of the component. Adding\
    \ so, will create new view states for that component.\n\nSyntax of the <mx:State>\
    \ tag:\n\n```\n`<mx:State basedOn=\"null\" name=\"null\" overrides=\"null\"/>`\n\
    ```\n\nThe basedOn attribute specifies the view state on which it is based on\
    \ and the name attribute specifies the name of the current State object. The purpose\
    \ of a state is to alter the appearance of a component in response to a user or\
    \ system-initiated event, for example, the click of a button. Altering the appearance\
    \ of a component involves the use of overrides via a state. Valid overrides include:\n\
    \n+   * AddChild\n+   * RemoveChild\n+   * SetEventHandler\n+   * SetProperty\n\
    +   * SetStyle\n\n# 6.2.2 State properties, style and events\n\nIn order to further\
    \ customize a state in terms of look and feel and behavior, the following tags\
    \ can be used.\n\n# 6.2.2.1 The <mx:SetEventHandler> tag\n\nThe <mx:SetEventHandler>\
    \ tag allows you to create event listeners that are active only during a specific\
    \ state. This is made possible by using the handler event type or the handlerFunction\
    \ property.\n\nIn the handler event type, you can specify more than one parameter\
    \ for the event listener function. You can even add ActionScript code within the\
    \ tag instead of providing an event listener function. This is shown in the example\
    \ below:\n\n```\n<mx:SetEventHandler target=\"(Button)\" name=\"ButtonClick\"\n\
    \    handler = \"buttonHandler(event, linkButtonID)\"/>\n```"
  merge: -1
  img_proc: true
- pgno: 120
  md: "However, if the *handlerFunction* property is used, the event listener function\
    \ will only take one event object as parameter as shown below.\n\n```\n<mx:SetEventHandler\
    \ target=\"(Button)\" name=\"ButtonClick\"\n     handlerFunction=\"buttonHandler\"\
    />\n```\n\n# ### 6.2.2.2 The <mx:setProperty> tag\n\nThe <mx:setProperty> tag\
    \ is used to set the value of some property that will hold for a particular view\
    \ state:\n\n```\n<mx:SetProperty target=\"(container)\" name=\"alpha\" value=\"\
    0.5\"/>\n```\n\nHere, *target* specifies the object containing the property to\
    \ change, *name* is the property whose value needs to be changed and *value* is\
    \ the new value for the property.\n\n# ### 6.2.2.3 The <mx:setStyle> tag\n\nThe\
    \ <mx:setStyle> tag is used to set the value of some style that will hold only\
    \ for a particular view state:\n\n```\n<mx:SetStyle target=\"(this)\" name=\"\
    backgroundColor\" value=\"#ffcccc\"/>\n```\n\nHere *target* specifies the object\
    \ whose style is to be changed, *name* is the style that needs to be changed and\
    \ *value* is the new value for the style.\n\n# ## 6.2.3 Adding components\n\n\
    Not only the behavior or look and feel of an existing component can be changed\
    \ during a state, but also new components can be added or existing components\
    \ can be removed. This is done as defined below.\n\n# ### 6.2.3.1 The <mx:AddChild>\
    \ tag\n\nThis tag tells Flex that when the application is in this state, a child\
    \ needs to be added. The child can be any component such as a button or textarea.\
    \ *Listing 6.3* shows an example of using this tag.\n\n```\n<mx:AddChild relativeTo=\"\
    (panel1)\" position=\"lastChild\"\n          creationPolicy=\"all\">\n      <mx:TextArea\
    \ id=\"t1\" text=\"New State\"/>\n</mx:AddChild>\n```"
  merge: -1
