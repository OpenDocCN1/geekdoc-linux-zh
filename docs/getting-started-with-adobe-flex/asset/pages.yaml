    \n**Figure 8.6 – Output of the pie chart example**\n\n# 8.8 **Chart style**\n\n\
    There are many ways to define or change styles for charts. The sections below\
    \ describe some of the most commonly used ones.\n\n# 8.8.1 **Stroke**\n\nYou use\
    \ the **Stroke** class with the chart series and grid lines to control the properties\
    \ of the lines that Flex uses to draw chart elements. Some of the attributes for\
    \ Strokes are:\n\n+   - **Color**: Specifies the color of the line as a hexadecimal\
    \ value.\n+   \t- **Weight**: Specifies the width of the line, in pixels.\n+ \
    \  \t- **Alpha**: Specifies the transparency of a line.\n\nExample of a Stroke\
    \ definition:\n\n```\n```xml\n<mx:Stroke id=\"Stroke1\" weight=\"2\" color=\"\
    0x999999\" alpha=\".8\" />\n```\n```\n\n# 8.8.2 **Stacking**\n\nWhen you use multiple\
    \ data series in the **AreaChart**, **BarChart**, and **ColumnChart** controls,\
    \ you can control the display of series using the `type` property of the controls.\
    \ Table 8.1 describes the values that the `type` property supports."
