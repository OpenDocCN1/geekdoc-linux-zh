    \ ActionScript will have one or more methods and properties.\n\n# ### 3.3.6 [Bindable]\
    \ Tag\n\nIn ActionScript, a variable does not automatically transmit changes made\
    \ to its value, unless specified to do so. In order to accomplish that, the metadata\
    \ tag called [Bindable] is used.\n\nSimply put, a metadata tag is an instruction\
    \ to the ActionScript compiler. When the ActionScript compiler encounters this\
    \ tag, it makes the necessary code changes in the background so that changes to\
    \ the variable's value is propagated to the different parts of application where\
    \ it is being used.\n\nListing 3.4 shows you how to use the [Bindable] tag.\n\n\
    ```\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<mx:Application xmlns:mx=\"\
    http://www.adobe.com/2006/mxml\"\nlayout=\"absolute\">\n<mx:Script>\n    <![CDATA[\n\
    \        [Bindable]// 1\n        var myText=\"Welcome to the world of Flex\";\
    \ // 2\n```\n```"
