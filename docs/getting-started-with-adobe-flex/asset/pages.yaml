  md: '# B


    # ## Appendix B – Up and running with DB2


    This appendix is a good foundation for learning about DB2. This appendix is streamlined
    to help you get up and running with DB2 quickly and easily.


    In this appendix you will learn about:


    +   - DB2 packaging

    +   - DB2 installation

    +   - DB2 Tools

    +   - The DB2 environment

    +   - DB2 configuration

    +   - Connecting to a database

    +   - Basic sample programs

    +   - DB2 documentation


    > > **Note:**

    > > For more information about DB2, refer to the free e-book *Getting Started
    with DB2 Express-C* that is part of this book series.


    # ### B.1 DB2: The big picture


    DB2 is a data server that enables you to safely store and retrieve data. DB2 commands,
    XQuery statements, and SQL statements are used to interact with the DB2 server
    allowing you to create objects, and manipulate data in a secure environment. Different
    tools can be used to input these commands and statements as shown in *Figure B.1*.
    This figure provides an overview of DB2 and has been extracted from the *Getting
    Started with DB2 Express-C* e-book.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '![](img/c4119654311ebf24679359ca130a5ee6_211_0.png)


    On the left-hand side of the figure, we provide examples of different commands
    and statements that users can issue. In the center of the figure, we list some
    of the tools where you can input these commands and statements, and on the right-hand
    side of the figure you can see the DB2 environment; where your databases are stored.
    In subsequent sections, we discuss some of the elements of this figure in more
    detail.


    # B.2 DB2 Packaging


    DB2 servers, clients and drivers are created using the same core components, and
    then are packaged in a way that allows users to choose the functions they need
    for the right price. This section describes the different DB2 editions or product
    packages available.


    # B.2.1 DB2 servers


    *Figure B.2* provides an overview of the different DB2 data server editions that
    are available.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '![](img/c4119654311ebf24679359ca130a5ee6_212_0.png)


    Figure B.2 - DB2 Server Packaging


    As shown in Figure B.2, all DB2 server editions are built one on top of the other.
    DB2 Express-C is a free version of DB2, and it is the core component of all DB2
    products. When additional functionality is added to DB2 Express-C, it becomes
    DB2 Express. Additional functionality added to DB2 Express, becomes DB2 Workgroup,
    and so on. Figure B.2 illustrates why it is so easy to upgrade from DB2 Express-C
    to any other DB2 server should you need to in the future: All DB2 servers editions
    are built based on DB2 Express-C.


    Also applications built for DB2 Express-C are applicable on other DB2 Editions
    as well. Your applications will function without any modifications required!


    # B.2.2 DB2 Clients and Drivers


    When you install a DB2 server, a DB2 client component is also installed. If you
    only need to install a client, you can install either the IBM Data Server Client,
    or the IBM Data Server Runtime Client. Figure B.3 illustrates these two clients.


    ![](img/c4119654311ebf24679359ca130a5ee6_212_1.png)


    Figure B.3 - DB2 Clients'
  merge: -1
  img_proc: true
- pgno: 213
  md: "From the above figure, you can see the IBM Data Server Runtime client has all\
    \ the components you need (driver and network support) to connect and work with\
    \ a DB2 Data Server. The IBM Data Server client has this same support and also\
    \ includes GUI Tools and libraries for application development.\n\nIn addition\
    \ to these clients, provided are these other clients and drivers:\n\n+   - DB2\
    \ Runtime Client Merge Modules for Windows: mainly used to embed a DB2\n+   runtime\
    \ client as part of a Windows application installation\n+   - IBM Data Server\
    \ Driver for JDBC and SQLJ: allows Java applications to connect to\n+   DB2 servers\
    \ without having to install a client\n+   - IBM Data Server Driver for ODBC and\
    \ CLI: allows ODBC and CLI applications to\n+   connect to a DB2 server without\
    \ having to install a client\n+   - IBM Data Server Driver Package: includes a\
    \ Windows-specific driver with support\n+   for .NET environments in addition\
    \ to ODBC, CLI and open source. This driver was\n+   previously known as the IBM\
    \ Data Server Driver for ODBC, CLI and .NET.\n\nThere is no charge to use DB2\
    \ clients or drivers.\n\n# ## B.3 Installing DB2\n\nIn this section we explain\
    \ how to install DB2 using the DB2 setup wizard.\n\n# ### B.3.1 Installation on\
    \ Windows\n\nDB2 installation on Windows is straight-forward and requires the\
    \ following basic steps:\n\n+   1. Ensure you are using a local or domain user\
    \ that is part of the Administrator group\n+   on the server where you are installing\
    \ DB2.\n+   2. After downloading and unzipping DB2 Express-C for Windows from\n\
    +   ibm.com/db2/express, look for the file setup.exe, and double-click on it.\n\
    +   3. Follow the self- explanatory instructions from the wizard. Choosing default\
    \ values is\n+   normally sufficient.\n+   4. The following is performed by default\
    \ during the installation:\n+   \n+   - DB2 is installed in `C:\\Program Files\\\
    IBM\\SQLLIB`\n+   - The **DB2ADMNS** and **DB2USERS** Windows operating system\
    \ groups are\n+   created.\n+   - The instance **DB2** is created under `C:\\\
    Program Files\\IBM\\SQLLIB\\DB2`\n+   - The DB2 Administration Server (DAS) is\
    \ created\n+   - Installation logs are stored in:\n+   \n+   `My Documents\\DB2LOG\\\
    db2.log`\n+   `My Documents\\DB2LOG\\db2wi.log`"
  merge: -1
  img_proc: true
- pgno: 214
  md: '+   - Several Windows services are created.


    # B.3.2 Installation on Linux


    DB2 installation on Linux is straight-forward and requires the following basic
    steps:


    +   1. Log on as the root user to install DB2.

    +   2. After downloading DB2 Express-C for Linux from ibm.com/db2/express, look
    for the file db2setup, and execute it: ./db2setup

    +   3. Follow the self-explanatory instructions from the wizard. Choosing default
    values is normally sufficient.

    +   4. The following is performed by default during installation:

    +       - DB2 is installed in /opt/ibm/db2/V9.7

    +       - Three user IDs are created. The default values are listed below:

    +         * db2inst1 (instance owner)

    +         * db2fenc1 (Fenced user for fenced routines)

    +         * dasusr1 (DAS user)

    +       - Three user groups are created corresponding to the above user IDs:

    +         * db2iadm1

    +         * db2fadm1

    +         * dasadm1

    +       - Instance db2inst1 is created

    +       - The DAS dasusr1 is created

    +       - Installation logs are stored in:

    +         * /tmp/db2setup.his

    +         * /tmp/db2setup.log

    +         * /tmp/db2setup.err


    # B.4 DB2 Tools


    There are several tools that are included with a DB2 data server such as the DB2
    Control Center, the DB2 Command Editor, and so on. Starting with DB2 version 9.7
    however; most of these tools are deprecated (that is, they are still supported
    but no longer enhanced) in favor of IBM Data Studio. IBM Data Studio is provided
    as a separate package not included with DB2. For more information, refer to the
    eBook Getting started with IBM Data Studio for DB2.


    # B.4.1 Control Center


    Prior to DB2 9.7, the primary DB2 tool for database administration was the Control
    Center, as illustrated in Figure B.4. This tool is now deprecated, but still included
    with DB2 servers.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '![](img/c4119654311ebf24679359ca130a5ee6_215_0.png)


    # Figure B.4 - The DB2 Control Center


    To start the Control Center on Windows use *Start -> Programs -> IBM DB2 -> DB2COPY1
    (Default) -> General Administration Tools -> Control Center* or alternatively,
    type the command `db2cc` from a Windows Command Prompt or Linux shell.


    The Control Center is a centralized administration tool that allows you to:


    +   - View your systems, instances, databases and database objects;

    +   - Create, modify and manage databases and database objects;

    +   - Launch other DB2 graphical tools


    The pane on the left-hand side provides a visual hierarchy of the database objects
    on your system(s), providing a folder for Tables, Views, etc. When you double-click
    a folder (for example, the Tables folder, as shown in *Figure B.5), the pane on
    the top right will list all of the related objects, in this case, all the tables
    associated with the **SAMPLE** database. If you select a given table in the top
    right pane, the bottom right pane provides more specific information about that
    table.


    Right-clicking on the different folders or objects in the Object tree will bring
    up menus applicable to the given folder or object. For example, right-clicking
    on an instance and choosing *Configure parameters* would allow you to view and
    update the parameters at the instance level. Similarly, if you right-click on
    a database and choose *Configure parameters*, you would be able to view and update
    parameters at the database level.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# B.4.2 Command Line Tools


    There are three types of Command Line tools:


    +   - DB2 Command Window (only on Windows)

    +   - DB2 Command Line Processor (DB2 CLP)

    +   - DB2 Command Editor (GUI-based, and deprecated)

    +   - These tools are explained in more detail in the next sections.


    # B.4.2.1 DB2 Command Window


    The DB2 Command Window is only available on Windows operating systems; it is often
    confused with Windows Command Prompt. Though they look the same, the DB2 Command
    Window, however, initializes the environment for you to work with DB2. To start
    this tool, use Start -> Programs -> IBM DB2 -> DB2COPY1 (Default) -> Command Line
    Tools -> Command Window or alternatively, type the command db2cmd from a Windows
    Command Prompt to launch it on another window. Figure B.5 shows the DB2 Command
    Window.


    ![](img/c4119654311ebf24679359ca130a5ee6_216_0.png)


    Figure B.5 - The DB2 Command Window


    You can easily identify you are working in the DB2 Command Window by looking at
    the window title which always includes the words DB2 CLP as highlighted in the
    figure. From the DB2 Command Window, all commands must be prefixed with db2. For
    example, in the above figure, two statements are issued:


    ```

    ```db2 connect to sample

    db2 select * from staff```

    ```'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'For Linux, the equivalent of the DB2 Command Window is simply the Linux shell
    (or terminal) where the DB2 environment has been set up by executing the db2profile
    file. This file is created by default and added to the `.login` file for the DB2
    instance owner. By default the DB2 instance owner is `db2inst1`.


    # ### B.4.2.2 DB2 Command Line Processor


    The DB2 Command Line Processor (CLP) is the same as the DB2 Command Window, with
    one exception that the prompt is `db2=>` rather than an operating system prompt.
    To start the DB2 Command Line Processor on Windows, use `Start -> Programs ->
    IBM DB2 -> DB2COPY1 (Default) -> Command Line Tools -> Command Line Processor`
    or alternatively from a DB2 Command Window or Linux shell type `db2` and press
    `Enter`. The prompt will change to `db2` as shown in `Figure B.6`.


    ![](img/c4119654311ebf24679359ca130a5ee6_217_0.png)


    # Figure B.6 - The DB2 Command Line Processor (CLP)


    Note that `Figure B.6` also illustrates that when working in the CLP, you do not
    need to prefix commands with DB2. To exit from the CLP, type `quit`.


    # ### B.4.2.3 DB2 Command Editor


    The DB2 Command Editor is the GUI version of the DB2 Command Window or DB2 Command
    Line Processor as shown in `Figure B.7`. This tool is deprecated for DB2 version
    9.7.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '![](img/c4119654311ebf24679359ca130a5ee6_218_0.png)


    Figure B.7 - The DB2 Command Editor'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# B.5 The DB2 environment


    Figure B.8 provides a quick overview of the DB2 environment.


    ![](img/c4119654311ebf24679359ca130a5ee6_219_0.png)


    Figure B.8 - The DB2 Environment


    The figure illustrates a server where DB2 Express-C has been installed. The smaller
    boxes in light green (Environment Variables, Database Manager Configuration File,
    Database Configuration File, DB2 Profile Registry) are the different areas where
    a DB2 server can be configured, and they will be explained in more detail in the
    next section. The larger dark green box represents an instance which in this example
    has the name myinst.


    An instance is an environment where database objects can be created. On the same
    server, you can create several instances, each of which is treated independently.
    For example, you can use an instance for development, another one for test, and
    another one for production. Table B.1 shows some useful commands you can use at
    the instance level. Note that the commands shown in this section can also be performed
    from DB2 GUI Tools.


    | Command | Description |

    |---|---|

    | db2start | Starts the current instance |

    | db2stop | Stops the current instance |

    | db2icrt <instance_name> | Creates a new instance |

    | db2idrop <instance_name> | Drops an instance |

    | db2ilist | Lists the instances you have on your system |'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'db2 get instance | Lists the current active instance


    # Table B.1 - Useful instance-level DB2 commands


    Within an instance you can create many databases. A **database** is a collection
    of objects such as tables, views, indexes, and so on. For example, in Figure B.8,
    the database **MYDB1** has been created within instance *myinst*. **Table B.2**
    shows some commands you can use at the database level.


    | Command/SQL statement | Description |

    | :--- | :--- |

    | create database <database_name> | Creates a new database |

    | drop database <database_name> | Drops a database |

    | connect to <database_name> | Connects to a database |

    | create table/create view/create index | SQL statements to create table, views,
    and indexes respectively |


    # Table B.2 - Commands and SQL Statements at the database level


    # B.6 DB2 configuration


    DB2 parameters can be configured using the Configuration Advisor GUI tool. The
    Configuration Advisor can be accessed through the Control Center by right clicking
    on a database and choosing *Configuration Advisor*. Based on your answers to some
    questions about your system resources and workload, the configuration advisor
    will provide a list of DB2 parameters that would operate optimally using the suggested
    values. If you would like more detail about DB2 configuration, keep reading. Otherwise,
    use the Configuration Advisor and you are ready to work with DB2!


    A DB2 server can be configured at four different levels as shown earlier in *Figure
    B.8*:


    +   * **Environment variables** are variables set at the operating system level.
    The main environment variable to be concerned about is DB2INSTANCE. This variable
    indicates the current instance you are working on, and for which your DB2 commands
    will apply.

    +   * **Database Manager Configuration File (dbm cfg)** includes parameters that
    affect the instance and all the databases it contains. *Table B.3* shows some
    useful commands to manage the dbm cfg.


    | Command | Description |

    | :--- | :--- |

    | get dbm cfg | Retrieves information about the dbm cfg |'
  merge: -1
  img_proc: true
- pgno: 221
  md: '| Command | Description |

    |---|---|

    | `update dbm cfg using <parameter_name> <value>` | Updates the value of a dbm
    cfg parameter |


    **Table B.3 - Commands to manipulate the dbm cfg**


    +   - **Database Configuration File (db cfg)** includes parameters that affect
    the particular database in question. *Table B.4* shows some useful commands to
    manage the db cfg.


    | Command | Description |

    |---|---|

    | `get db cfg for <database_name>` | Retrieves information about the db cfg for
    a given database |

    | `update db cfg for <database_name> using <parameter_name> <value>` | Updates
    the value of a db cfg parameter |


    **Table B.4 - Commands to manipulate the db cfg**


    +   - **DB2 Profile Registry variables** includes parameters that may be platform
    specific and can be set globally (affecting all instances), or at the instance
    level (affecting one particular instance). *Table B.5* shows some useful commands
    to manipulate the DB2 profile registry.


    | Command | Description |

    |---|---|

    | `db2set -all` | Lists all the DB2 profile registry variables that are set |

    | `db2set <parameter>==<value>` | Sets a given parameter with a value |


    **Table B.5 - Commands to manipulate the DB2 profile registry**


    # **B.7 Connecting to a database**


    If your database is local, that is, it resides on the same system where you are
    performing your database operation; the connection setup is performed automatically
    when the database is created. You can simply issue a `connect to database_name`
    statement to connect to the database.


    If your database is remote, the simplest method to set up database connectivity
    is by using the Configuration Assistant GUI tool following these steps:


    +   1. Start the Configuration Assistant from the system where you want to connect
    to the database. To start this tool, use the command `db2ca` from a Windows command
    prompt or Linux shell. *Figure B.9* shows the Configuration Assistant.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '![](img/c4119654311ebf24679359ca130a5ee6_222_0.png)


    Figure B.9 - The DB2 Configuration Assistant


    +   2. From the Configuration Assistant, click on the *Selected -> Add database
    using Wizard* menu


    +   3. From the *Select how you want to set up a connection* window, you can use
    *Search the network* if your network is small without many hubs. If you know the
    name of the server where DB2 resides, choose *Known systems* and drill down all
    the way to the database you want to connect. Proceed with the wizard using default
    values. If you do not know the name of your system, choose *Other systems (Search
    the network)*. Note that this may take a long time if your network is large.


    +   4. If *Search the network* does not work, go back to the *Select how you want
    to set up a connection* window, and choose *Manually configure a connection to
    a database*. Choose *TCP/IP* and click *next*. Input the *host name* or *IP address*
    where your DB2 server resides. Input either the *service name* or the *port number*.


    +   5. Continue with the wizard prompts and leave the default values.


    +   6. After you finish your set up, a window will pop up asking you if you want
    to test your connection. You can also test the connection after the setup is finished
    by right-clicking on the database, and choosing *Test Connection*.


    # B.8 Basic sample programs


    Depending on the programming language used, different syntax is required to connect
    to a DB2 database and perform operations. Below are links to basic sample programs
    which connect to a database, and retrieve one record. You suggest you first download
    (from ftp://ftp.software.ibm.com/software/data/db2/udb/db2express/samples.zip)
    all the sample programs in this section:'
  merge: -1
  img_proc: true
