    # 6.3.3 Customizing Effects


    Effects are customized by specifying effect properties in the code. For example,
    in the above sample application, the `duration` property defined how long the
    blur lasts in milliseconds.


    ```

    <mx:Blur id="blurImage"  duration="1000"  blurXFrom="0.0"  blurXTo="10.0"

    alblurYFrom="0.0" blurYTo="10.0"/>

