- pgno: 136
  md: '# 7


    # Chapter 7 - Working with the server


    Most applications in real life need to retrieve, manipulate, and store data. Because
    of many reasons including performance, it is desirable to process data close to
    its storage as much as possible. For these reasons Flex applications need to interact
    with backend servers frequently. In the current context, the term "server" primarily
    implies application server.


    In this chapter you will learn about:


    +   - Different ways of communicating with a remote Web server

    +     - Working with Web services

    +   - Using a remote object

    +   - Using the HTTPS service object

    +   - Working with databases


    # 7.1 Working with the server: The big picture


    Most Flex applications need to access a Web server. Flex makes this job easy with
    the **RPC** (Remote Procedure Call) services that it provides. The RPC services
    provide a call-and-response model to access remote data and expose components
    based on service-oriented architecture. There are three RPC classes in Flex:


    +   - The ***WebService class*** allows you to access Web services or software
    modules that set remote operations.

    +   - The ***RemoteObject class*** allows you to access public methods of remote
    classes

    +   - The ***HTTPService class*** helps you to carry out Http requests in GET
    or POST to specific URLs.


    You will soon learn each of these in detail along with examples on how they are
    used in Flex. *Figure 7.1* provides an overview of a Flex application communicating
    to a server.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '![](img/c4119654311ebf24679359ca130a5ee6_137_0.png)


    Figure 7.1 – Flex application communicating with a server


    In the figure you can see how a typical Flex application communicates with the
    application server. On the left hand side is the browser that uses HTML or other
    client-side scripting language to communicate with the server. The Flex application,
    app.swf in the figure is embedded within the HTML file and contains the logic
    to communicate with the server using either a Web service using SOAP (Simple Object
    Access Protocol) and XML or HTTP Service using simple text or XML. Flex can also
    communicate directly with the server and access the remote objects directly using
    its remote object invocation APIs which in turn uses AMF (Action Message Format).


    # 7.2 Working with Web services


    As defined by oas-is-open, “a Web Service is a software component that is described
    via WSDL and is capable of being accessed via standard network protocols such
    as but not limited to SOAP over HTTP”. The underlying implementation can be either,
    Java, .Net, PHP, Ruby or other language.


    In Figure 7.2 below you can see that the service provider can expose the list
    of services that it wants to make available to the service requester.


    ![](img/c4119654311ebf24679359ca130a5ee6_137_1.png)


    ![](img/c4119654311ebf24679359ca130a5ee6_137_2.png)


    Figure 7.2 – Web Service Architecture


    The business logic can be in Java, .Net or any other language. In order to expose
    the application to the outside world, Web services are used by the service provider
    which uses standard protocols like HTTP and SOAP (Simple Object Access Protocol).
    The function of'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'a Web service wrapper is to listen to SOAP calls and then call the business
    application using the input XML. The service requester can get the list of web
    services exposed by the service provider through a WSDL (Web Service Description
    Language) file and request the required information as per the WSDL file. The
    service requester needs a Web service client proxy to invoke the methods defined
    in the WSDL file. The client proxy allows the requester to invoke the Web service
    APIs as if it was a local method.


    Flex can interact with Web services that define their interface in WSDL 1.1 format,
    which is available as a URL. WSDL is a standard format which describes the form
    of messages that a Web service understands the format of response messages, the
    destination of the response message and the protocol used to send these messages.
    Flex can interface with a Web service in .NET, Java, ColdFusion, PHP and Ruby.
    Flex Web service API generally supports SOAP 1.1, XML Schema 1.0 and WSDL 1.1
    RPC-encoded, RPC-literal, and document-literal. The terms *encoded* and *literal*
    indicate the type of WSDL-to-SOAP mapping that a service uses.


    *Figure 7.3* below shows how Flex invokes a Web service and how different tags
    and methods are used. These will be explained in detail in the next section.


    ![](img/c4119654311ebf24679359ca130a5ee6_138_0.png)


    # **Figure 7.3 – Web service tags and method invocation**


    Flex applications accept Web service requests and responses that are formatted
    as SOAP messages. It defines the format of the data that can be exchanged between
    a Web service client like a Flex application and a Web service.'
  merge: -1
  img_proc: true
