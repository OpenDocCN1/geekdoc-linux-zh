    \ in other OOPs language like Java, C++ etc.\n\n# **3.3.5 Functions and Access\
    \ modifiers**\n\nTo create a function in Flex, use the following syntax:\n\n```\n\
    [**public** | **private** | **protected** | **internal**] **function**\n    <name>([param1:type,\
    \ param2:type, ...]) : <return type> {\n        //body of function\n        //return\
    \ value\n    }\n```\n\nFunctions can be placed either in the MXML file using the\
    \ <**mx:Script**> element or in the ActionScript class as a method.\n\nThe function\
    \ definition above is prefixed by keywords like public, private, protected and\
    \ internal. These are called **access modifiers** and define the scope of the\
    \ function or variable to which they are applied. Table 3.2 below describes the\
    \ scope of these access modifiers in more detail.\n\n| **Access Modifier** | **Same\
    \ Class** | **Same Package** | **Different Package** |\n|---|---|---|---|\n| **private**\
    \ | Yes | No | No |\n| **internal** | Yes | Yes | No |\n| **protected** | Yes\
