    \ and provides a scrollbar if the full height of the list items is unlikely to\
    \ fit. The horizontal scrollbar is also optional. The user can select one or more\
    \ items from the list. Listing 5.15 shows an example of creating a list control\
    \ using the <mx:List> tag in combination with the ArrayCollection that we discussed\
