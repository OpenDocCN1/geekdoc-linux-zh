    # Chapter 1 – Introduction to Adobe Flex


    Adobe® Flex® is a free open source framework for developing rich Web applications
    that deploy consistently on all major browsers, desktops, and operating systems.
    Essentially, it is a software development kit (SDK) released by Adobe Systems
    that allows Web developers to rapidly and easily build Rich Internet Applications
    (RIAs) on the Flash® Platform.


    Adobe Flex aims to provide a client-side Flash-based rich client that can run
    on the desktop as well as embedded in a Web page. Its focus is targeted on the
    client only, exchanging data asynchronously with the any server technology supporting
    HTTP. Data interchange is XML-based, so the product is not tied to any particular
    communication framework or technology. The server-supported technologies include
    Java™ EE, Microsoft .NET framework, PHP, Web Services, and any other framework
    capable of sending and receiving XML data


    In this chapter you will learn about:


    +   * A brief history of Adobe Flex

    +   * Versions and releases of Adobe Flex

    +   * The Adobe Flex community and resources

    +   * Products competing with Adobe Flex


    # 1.1 A brief history of Adobe Flex


    Before describing the history of Adobe Flex, you need to understand the evolution
    of application development that led to the development of rich internet application
    frameworks. Figure 1.1 illustrates this evolution.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '![](img/c4119654311ebf24679359ca130a5ee6_20_0.png)


    **Figure 1.1 – Evolution of application development**


    > **Note:**

    > Since this book focuses on the distributed platforms such as Linux, UNIX, Windows
    and the Mac; mainframe applications are not discussed.


    In the early 90’s applications were developed to be run mainly on individual desktops.
    These applications were rich and robust allowing users and developers to perform
    practically anything allowed by the the operating system. The main disadvantage
    of these applications; however, lied in its deployment model: On one hand, users
    had to constantly get new CDs to install an upgrade or fix. On the other hand,
    developers had to consider supporting multiple versions for different clients.
    This is because each user was tied to his own copy of the application as shown
    in *Figure 1.2*.


    ![](img/c4119654311ebf24679359ca130a5ee6_20_1.png)


    **Figure 1.2 – Desktop Applications, each user is tied to his own copy**


    By the mid 90’s, with the internet technological boom, Web applications started
    to become popular. In *Figure 1.1* they are illustrated as "traditional" Web applications
    because at the time, there was no technology to make these applications rich,
    that is; flexible, engaging, containing videos, and other interesting features.
    Web applications run on a centralized computer. Though traditional Web applications
    were not rich, developers found these applications quite convenient to deploy
    enhancements and fixes quickly because Web application were deployed on a central
    computer and accessed by all users as illustrated in *Figure 1.3* below. Updates
    needed to be made only on the central computer.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '![](img/c4119654311ebf24679359ca130a5ee6_21_0.png)


    # **Figure 1.3 – Web application advantage: Centralized Deployment**


    *Figure 1.4* shows an example of a traditional Web site; it is a fictitious Web
    site called "Eureka!!", but very similar to Web sites of the early 90’s. Due to
    bandwidth restrictions, graphics were kept to a minimum. There was no dynamic
    content (the pages were static) and normally only text data with hyperlinks to
    other pages were displayed.


    ![](img/c4119654311ebf24679359ca130a5ee6_21_1.png)


    # **Figure 1.4 – Example of look & feel of Traditional Web site**


    The main problem with traditional Web applications was that they offered poor
    user experience compared to desktop applications. Yet, developers still preferred
    Web applications because they were platform independent, and more convenient for
    upgrade and deployment.


    Technologies such as Java Script and cascading style sheets (CSS) helped alleviate
    the problem to some extent, but usability issues persisted because the Web was
    historically designed to be a documentation-distribution mechanism, where text
    and hyperlinks were enough.


    Through the years, developers tried to improve usability by transferring as much
    application logic as possible to the front-end in order to mimic a desktop-like
    experience.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'However, the more application logic was pushed to the client side, the more
    browser incompatibilities started to arise. This was ironically what Web development
    wanted to prevent with platform-independent applications.


    By the mid 2000''s, Rich Internet Applications (RIAs) were developed with new
    technologies such as Adobe Flex. RIAs offer a Web experience that is engaging,
    interactive, lightweight and flexible. A RIA combines the benefits of using the
    Web as a low-cost deployment model with a rich user experience that is as good
    as desktop applications. RIAs introduced a new model for application development
    which seperated the back-end data services from a rich front-end client. An example
    of a RIA can be seen by visiting the Flex Store at [http://examples.adobe.com/flex2/inproduct/sdk/flexstore/flexstore.html](http://examples.adobe.com/flex2/inproduct/sdk/flexstore/flexstore.html).
    *Figure 1.5* below illustrates a sample RIA Web site.


    ![](img/c4119654311ebf24679359ca130a5ee6_22_0.png)


    RIAs bring true platform neutrality: The same application yields the same look
    and feel regardless of the environment. This is accomplished primarily through
    the use of a browser plug-in (for various browsers and operating systems) that
    acts as a local runtime engine. Using the browser as a delivery mechanism provides
    a high degree of deployability.


    Rich Internet Applications eliminate a lot of the network traffic typically seen
    with traditional Web applications, especially when working with dynamic pages.
    Traditional Web applications sent requests out over a series of routers on the
    World Wide Web until a Web server was reached. The Web Server then packaged the
    HTML pages and sent them back to the browser which read the HTML and displayed
    the page.


    For a dynamic page, the Web server forwarded the request to an application server
    where business logic was implemented. The application server generated dynamic
    HTML content'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'and would send this back to the Web Server which forwarded it to the browser
    for display. The implementation of dynamic Web pages was not very efficient because
    a lot of network traffic was involved.


    With RIAs system performance is substantially improved by doing a lot more of
    the processing on the client than a thin client Web Application. RIAs are stateful
    and they are not a set of pages controlled by the server as in traditional Web
    applications but they are actual applications running on the clients'' computer
    and only communicate with servers to process and exchange data.


    In March of 2004 Adobe Flex made its debut with version 1.0. This version, as
    well as version 1.5 of Adobe Flex, were expensive server-based products. They
    were based on Flash® Player 7.0 and ActionScript 2.0, and they even had their
    own Dreamweaver®-like development tool called Flex Builder. These versions never
    gained popularity due to the limitations of ActionScript 2.0.


    With the release of Adobe Flex 2 in June 2006, Flex became an entirely client-side
    product. Adobe rewrote the entire Flex framework and IDE from scratch. Central
    to the change was the introduction of ActionScript 3.0. Flex 2 was based on Flash
    Player 9.0 and Action Script 3.0. Adobe decided not to upgrade the Dreamweaver-like
    Flex Builder 1.0 but rather start using Eclipse and providing a Flex Builder plug-in
    for Eclipse. Adobe Flex 2.0 offered a way to create RIAs without incurring expensive
    licensing fees.


    In February 2008 Adobe Flex 3 was released. Adobe Flex 3 added more functionality
    to Flex Builder, such as refactoring and enhanced styling support as well as new
    data visualization components in the Flex Framework. Adobe Flex 3 is also the
    official open-source release of the Flex SDK and Flex compiler. As of the time
    of writing, Adobe Flex 3 is the most current version of Flex, and this is the
    version we will use in this book.


    Adobe Flex 3 comes with a lot of new, key features including:


    +   - The profiler, to monitor memory and CPU Consumption

    +   - Refactoring, which makes it easy to rename almost anything, such as functions,
    variables, and classes.

    +   - The Adobe Integrated Runtime (AIR®) framework that supports building cross-OS
    rich internet application that can access local desktop resources.

    +   - Persistent Caching, which reduces the SWF File Size.

    +   - Wizards, to generate code thus reducing the hand coding effort.

    +   - Charting enhancements

    +   - A DataGrid component to display tabular data. The Advanced DataGrid provides
    additional abilities such as multicolumn sorting and column spanning.

    +   - Flex Data Services which has been renamed to LiveCycle® Data Services now
    has Support for Ajax Data Servers.

    +   - Memory and Performance Profilers.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 1.2 Pros and cons of Flex applications


    Today, Web developers have a vast array of choices to develop RIAs, AJAX being
    one. So why use Adobe Flex? One reason is the fact that Adobe Flex separates the
    presentation and data access layers. This means that the Flex application is independent
    of the back-end: You can use any server technology that meets your requirements
    -- ColdFusion, J2EE, PHP, .NET, etc. Because so much of Adobe Flex is designed
    around XML (even the MXML document), you can use something as basic as an HTTPService
    call to read and write data to your data store.


    The other main reason is that Adobe Flex is an ideal technology when you want
    to create highly interactive, expressive Web site applications using and visualizing
    data. Adobe Flex allows you to break out of the usual static web page and embed
    mini-applications without the complexity and compatibility issues of alternatives
    like Java applets.


    Listed below are the some other reasons to consider Adobe Flex for your Web site:


    +   - It helps build robust applications that attractively display complex data
    sets.

    +   - It is visually engaging to the visitors of your site.

    +   - It works on all the major platforms and users don''t need to install anything
    other than a Flash player.

    +   - Audio and video allow for even greater interaction.

    +   - Data Synchronization allows for real-time data to be used more efficiently


    On the other hand, Adobe Flex may not be the answer to all your needs. For example,
    if you are planning to develop small applications with simple animation without
    writing much code, Flash may be the best choice on a timeline based animation
    utility. Flex applications are limited by the constraints of the Flash player.
    Also, a Flex application may be large in size because it is based upon several
    libraries. Fortunately, Adobe Flex doesn''t force you to use all of the Flex components
    (or even MXML) and allows an Action Script project to be compiled on a free Flex
    compiler.


    If you are planning a Web site that requires vast amount of rich text, or need
    only simple user interaction, one might be better off using HTML/Ajax. Though
    Adobe Flex provides great support for HTML, few projects may suffer a bit of performance
    lag if there is a lot of text. However in case you want to deploy your applications
    to AIR, Adobe Flex is a good choice as AIR provides native support for HTML. Using
    Flash or Flex along with HTML is a good bet for Web sites with loads of text,
    animations and bits of interactivity.


    In a Multi tier model, Flex applications can serve as the presentation tier. Flex
    applications are Web-based, but provide good levels of interactivity and rich
    media experiences that make them look more like computer desktop programs.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# **1.3 Versions and editions of Adobe Flex**


    As indicated in an earlier section, Adobe Flex started with version 1.0, then
    it moved to 1.5, 2.0 and 3.0. In this book we focus on Adobe Flex 3.0. There are
    multiple components which make up Adobe Flex 3.0.


    # **1.3.1 Adobe Flex 3 SDK**


    You can create and deploy Flex applications using only the Open Source Flex 3
    SDK or the Free Adobe Flex 3 SDK. The free Adobe Flex 3 SDK includes the Flex
    framework, compilers, and debuggers, enabling you to develop Flex applications
    using an IDE of your choice. The Open Source Flex 3 SDK contains the majority
    of the Flex SDK (compilers, framework, debugger) but does not include anything
    that is not open source like the Adobe Flash Player, Adobe AIR, or the advanced
    font encoding libraries.


    # **1.3.2 Adobe Flex Builder 3**


    Adobe Flex Builder 3 Software is a powerful Eclipse based IDE available as a licensed
    product. Adobe Flex Builder 3 accelerates Flex application development because
    it enables intelligent coding, interactive step-through debugging and visual design
    features. Adobe Flex Builder 3 includes the complete Flex SDK, including compilers,
    a component library and debuggers along with the IDE. This is also available as
    a Plug in for Eclipse. There are two available editions of Adobe Flex Builder
    3.


    +      •  Adobe Flex Builder 3 Standard Edition

    +      •  Adobe Flex Builder 3 Professional Edition.


    *The Table 1.1* below shows a comparison table of the features which are included
    in different editions of Adobe Flex Builder 3.


    | Feature | Adobe Flex Builder 3 Professional Edition | Adobe Flex Builder 3 Standard
    Edition |

    | :--- | :---: | :---: |

    | RIA On the Desktop | ✔ | ✔ |

    | DataGrid | ✔ | ✔ |

    | Advanced DataGrid | ✔ |  |

    | Charting Components | ✔ |  |

    | Performance Profiler | ✔ |  |

    | Memory Profiler | ✔ |  |

    | Interactive Debugging | ✔ | ✔ |

    | Design View | ✔ | ✔ |'
  merge: -1
  img_proc: true
- pgno: 26
  md: '| Coding Tools | ✔ | ✔ |

    | --- | --- | --- |

    | Working with Data | ✔ | ✔ |

    | Browser Integration | ✔ | ✔ |


    Table 1.1 – Feature Comparision for different Editions of Adobe Flex


    > Note:

    > In this book all the examples and code snippests are created and tested using
    Adobe Flex Builder 3.0 Professional Edition and Eclipse SDK version 3.3.2.


    # 1.3.3 Adobe Data Services


    Adobe offers two data services solutions to resolve various needs.


    +   * BlazDS: This is an open source offering that provides Flex Remoting and
    Messassing to all developers. Flex Remoting makes it fast and easy for developers
    to connect to back-end businesc logic and data.

    +   * Adobe LiveCycle Data Services: This is a full featured framework for developing
    entresprise RIA Solutions. This is a licensed product available for purchases


    # 1.4 The Flex Community


    Adobe Flex is a fairly new technology; however, in a short span of time the Flex
    community has grown considerably, and this is reflected by the number of resources
    available to learn Adobe Flex. As a Flex developer, you can take advatange of
    many of these resources, both online and in the real world that can sharpen your
    Flex skills and offer great tips and tricks for your application. Adobe provides
    good documentation for Adobe Flex which can help you in getting started. This
    documentation can be accessed at [http://www.adobe.com/support/documentation/en/flex/](http://www.adobe.com/support/documentation/en/flex/).


    # 1.4.1 Developer Resources


    The following list provides popular developer resources for Adobe Flex:


    +   * Flex.org – [http://flex.org/](http://flex.org/). This is the community site
    for Flex Developers and has links to great resources for developers.

    +   * Adobe Flex Developer Center – [http://www.adobe.com/devnet/flex/](http://www.adobe.com/devnet/flex/).
    This is the official Adobe Flex Community center and has tons of articles and
    great information.

    +   * Flex Search – [http://flexsearch.org](http://flexsearch.org). This is a
    custom Flex search engine for the Flex community.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# ### 1.4.2 Discussion Forums


    The following list is a list of discussion forums for Adobe Flex. These discussion
    forums can help in resolving issues which are commonly faced.


    +   - Flex Coders – http://www.adobe.com/go/flexcoders

    +   - Flex Component Development – http://tech.groups.yahoo.com/group/flexcomponents

    +   - Flex Support Forums – http://www.adobe.com/cfusion/webforums/forum/index.cfm?forumid=60

    +   - Flex Components – http://www.adobe.com/go/flexcomponents

    +   - Flex Builder 3 Adobe Forum – http://www.adobe.com/cfusion/webforums/forum/categories.cfm?forumid=72&catid=651&entercat=y


    # ### 1.4.3 Adobe Flex Blogs


    With the number of Flex developers growing significantly in recent years, and
    the wealth of their knowledge increasing dramatically, many Flex developers have
    started to share Flex information on their blogs. These blogs often contain information
    such as workarounds to existing bugs in the Flex framework, workflow improvement
    tips, performance and memory management tips, and general thought-provoking questions
    about Adobe Flex, the future of Flex and the Flex community. Here is a list of
    some of the most common-read blogs:


    +   - Flex Team Blog – http://blogs.adobe.com/flex/. This is the official blog
    from the Flex team at Adobe.

    +   - Mike Morearty’s Blog – http://www.morearty.com/blog/ Mike is the brains
    behind the debugging portion of Adobe Flex Builder. His Blog keeps you up-to-date
    on what’s happening in the world of Flex.

    +   - Chet Haase’s Blog – http://graphics-geek.blogspot.com/ Chet’s blog specializes
    in Flex/Flash graphics techniques.


    # ## 1.5 Comparing Adobe Flex with similar products


    This section provides a brief comparison between Adobe Flex and other similar
    technologies available in the market today.


    # ### 1.5.1 Adobe Flex and HTML/JavaScript/Ajax


    It is easy and powerful to write interactive UI applications using Adobe Flex.
    Flex has two main components:


    +   - MXML, an XML based markup language, and

    +   - ActionScript, a scripting language that is an implementation of ECMA script,
    a JavaScript standard.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'Adobe Flex allows developers to build RIAs by compiling MXML to create Swift
    files (`.swf`) that can be executed in Flash player.


    Programmers well versed with XML and JavaScript will find it easy to work with
    MXML and ActionScript. Though, under the hood MXML and ActionScript are not related
    to each other the way HTML and JavaScript are, on the surface the interaction
    will make sense to most of Web developers.


    With Adobe Flex you can also develop most of the trivial and complex things that
    can be done with Ajax. With contribution from the open source community, Ajax
    libraries have really grown recently, and working with Ajax is no longer as difficult
    as it used to be. Nonetheless, the fact that Flex is a framework provides an advantage
    as it makes it easier to write and maintain MXML/ActionScript code compared to
    writing code in Ajax.


    # 1.5.2 Adobe Flex and Flash IDE


    Though Adobe Flex applications are compiled and turned into `.swf` files, that
    can be run by a Flash player, Flex is quite different from Flash. Flash, at its
    core, is an animation and drawing editor; development features were added later.
    On the other hand, Adobe Flex is an open source component library to develop applications.
    Adobe Flex, in comparison to Flash IDE, is a more flexible development framework
    that has support for easily moving data around, styling and skinning, advance
    controls for interactivity and lot more.


    # 1.5.3 Adobe Flex and Java/JavaFX


    Today, Flash players are present on almost all computers. Flex applications use
    the Flash player like a virtual machine for Flex applications; therefore, Flex
    applications can run on most computers. Java is also a popular language, and most
    computers include a Java Virtual Machine (JVM) as part of the Java Runtime Environment
    (JRE) or it is easily downloadable. JavaFX is a software platform to build RIAs,
    similar to Adobe Flex. With Adobe Flex, we can still use Java as the back-end
    and use the more popular Flash for the frontend.


    Being familiar with XML and JavaScript, Web Developers will find it easy to work
    with Adobe Flex. Java developers familiar with Eclipse should also find it easy
    to work with Adobe Flex builder as it is based on Eclipse. Java, like Flex, allows
    an application to be deployed either on the Web or to the desktop.


    # 1.5.4 Adobe Flex and Java Server Faces (JSF)


    Flex applications are focused on the client-side, either for deployment on desktops
    or Web pages. Data exchange with servers uses XML On the other hand, Java Server
    Faces technology works on the server side, generally rendering its output in terms
    of HTML pages with or without AJAX support. JSF technology offers a clean separation
    between behavior and presentation. Using JSF the client-generated events are mapped
    to server side objects as methods, generating a response and sending it back to
    the client. This response can be synchronous (regular components, in which the
    page reloads completely) or asynchronous (with AJAX, where just the component
    is updated with the response data).'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'Adobe Flex requires a Plugin on the client side (Flash) which is now present
    on almost 99% of the computers. JSF does not require any client side plugin. JSF
    is very complicated to develop because the basic implementation is pretty basic
    and for complicated UI, we need to have additional component libraries. For Enterprise
    wide Applications with very complicated UI, Adobe Flex would be the better tool
    to use.


    # ### 1.5.5 Adobe Flex and Microso ft Silverlight


    Microso ft Silverlight is a framework that provides support for rich Web content
    development by compiling XAML, an XML based interface description language. Silverlight
    framework is compiled and turned into XAP file to be executed by the Silverlight
    plug-in. It also offers cross platform compatibility.


    Flex applications work in a similar way using the Flash plug-in. However, Adobe
    Flex is an open source framework, while Silverlight is owned by Microso ft. This
    poses the same arguments of working with a proprietary versus and open source
    software. In the case of Adobe Flex, the numbers of third party Flex components
    are increasing quickly with contributions from the open source community.


    # ## 1.6 Summary


    In this chapter you learned about the brief history of Adobe Flex, pros and cons
    of using Adobe Flex and different editions and versions of Adobe Flex. The goal
    of this chapter was to introduce this new technology and provide a brief overview
    of the same.


    Later on in the chapter, you also learned about the competitive products that
    are in the market along with a short comparison.


