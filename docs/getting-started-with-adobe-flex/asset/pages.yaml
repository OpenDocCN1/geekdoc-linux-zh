- pgno: 13
  md: '14


    # Preface


    Keeping your skills current in today’s world is becoming increasingly challenging.
    There are too many new technologies being developed, and little time to learn
    them all. The DB2® on Campus Book Series has been developed to minimize the time
    and effort required to learn many of these new technologies.


    # Who should read this book?


    This book is intended for anyone who works or intends to work with Web application
    design and development using the Web 2.0 paradigm such as application developers,
    software architects, consultants, instructors and students.


    # How is this book structured?


    Chapter 1 - Introduction to Adobe® Flex®, provides a brief history of Adobe Flex,
    introduces various resources related to Flex, and compares it with other competitive
    products.


    Chapter 2 - Installing Flex, discusses Flex installation options, the Eclipse
    Plugin for Flex® Builder™, and how to start working with a Flex program.


    Chapter 3 - Introduction to MXML™ and ActionScript®, introduces you to MXML basics,
    ActionScript fundamentals, the relationship between MXML and ActionScript, and
    also provides an introduction to events.


    Chapter 4 - Working with Flex components, introduces you to Flex containers and
    controls.


    Chapter 5 - Binding data between controls, explains what is data binding and the
    methods to achieve data binding. It also discusses about data storage structures
    and mechanisms, and UI controls driven by data.


    Chapter 6 - Working with view states, transitions and filters explains how to
    work with states, properties, style and events, behaviors, effects, transitions,
    and filters.


    Chapter 7 - Working with the server, teaches you how to invoke Web services, how
    to work with remote objects, and how to use the HTTPService from a Flex application.
    It also provides a sample Flex application that accesses a DB2 database.


    Chapter 8 - Data Visualization, talks about Flex charting, how to work with different
    charts and their common usage.


    Appendix A contains the solutions to the review questions at the end of each chapter.


    Appendix B contains information that can get you started with DB2 in minutes.


    Exercises are provided with most chapters; any input files required for these
    labs are provided in the zip file Exercise_Files_AdobeFlex.zip accompanying this
    book.'
  merge: -1
  img_proc: true
