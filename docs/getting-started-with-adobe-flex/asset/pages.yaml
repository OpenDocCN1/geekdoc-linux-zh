    # 8.2 Different Charts in Flex 3


    This section describes the different type charts you can use in Flex and their
    usage:


    # 8.2.1 Area Chart [AreaChart]


    +   An area chart displays a series as a set of points connected by a line, Use
    it to:

    +   - Display information over time (or any other dimension)

    +   - Determine how a set of data adds up to a whole (cumulated totals)

    +   - Understand which part of the whole each element represents.


    # 8.2.2 Bar Chart [BarChart]


    A bar chart displays series as sets of horizontal bars. The plain bar chart is
    closely related to the column chart, which displays a series as sets of vertical
    bars, and the range bar'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'chart, which displays series as sets of horizontal bars with varying beginning
    and end points. Use it to


    +   - Present observations over time or under different conditions (e.g. countries,
    testing conditions)

    +   - Provide interval scaling (e.g. time).


    # 8.2.3 Bubble Chart [BubbleChart]


    In a bubble chart values are represented by the position of the bubble on the
    vertical and horizontal axis, and the size of the bubble. Extra categories can
    be introduced by using different colored bubbles in the chart.


    # 8.2.4 Candle Stick Chart [CandlestickChart]


    A candle stick chart is a style of bar-chart used primarily to describe price
    movements of an equity over time. It is a combination of a line-chart and a bar-chart,
    in that each bar represents the range of price movement over a given time interval.
    It is most often used in technical analysis of equity and currency price patterns.


    # 8.2.5 Column Chart [ColumnChart]


    A column chart displays a series as a set of vertical bars that are grouped by
    category. Column charts are useful for showing data changes over a period of time
    or for illustrating comparisons among items. The plain column chart is closely
    related to the bar chart, which displays series as sets of horizontal bars.


    # 8.2.6 Legend Control [Legend]


    Legend is not a chart type by itself - when the data appearing in a chart contains
    multiple data series, the chart may include a legend. A legend contains a list
    of the data series appearing in the chart and an example of their appearance.
    This information allows the data from data series to be identified in the chart.


    # 8.2.7 High Low Open Close Chart [HLOCChart]


    A HighLowOpenClose chart is specifically designed for financial or scientific
    data that uses up to four values per data point. These values align with the high,
    low, open and close values that are used to plot financial stock data.


    # 8.2.8 Line Chart [LineChart]


    A line chart displays a series as a set of points connected by a single line.
    Line charts are used to represent large amounts of data that occur over a continuous
    period of time. Use it


    +   - To display long data rows'
  merge: -1
  img_proc: true
