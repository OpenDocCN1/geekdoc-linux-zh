  md: '# ## 4.6 Summary


    In this chapter you learned about the basics of components, the building blocks
    of a Flex application. First you learned about the class hierarchy of components;
    next you were introduced to Containers – placeholders for other Containers and
    Controls. The Application Container is the first component of any Flex application
    and it has some specific properties and attributes. The chapter then covered the
    other type of containers: Layout and Navigational.


    The last section covered Controls. Controls are the means through which users
    interact with the application. There are different types of controls such as Text,
    Basic, Menu-Based and Data-Driven. The chapter showed some examples in detail
    from each category.


    At this point, you should be more comfortable to build and work with Flex. In
    the next chapters we will work with more complex Flex applications.


