    # **3.3.7 MXML and ActionScript mapping**


    ActionScript and MXML complement each other. Though it is true that you can build
    an entire Flex application using ActionScript alone, MXML is usually used for
    layout and structuring and ActionScript provides interactivity to the application.
    MXML code is more readable and easier to write as it lessens the amount of code
    needed to be written otherwise.


    When the MXML or Flex application is compiled, a series of ActionScript files
    are produced in the back-end by the compiler. In other words, ActionScript is
    the core language of the Flash Player, and everything in Flex is distilled into
    ActionScript.


    Table 3.3 shows the mapping between MXML and ActionScript


    | MXML | ActionScript | Details |

    |---|---|---|

    | Tag | Code within a class | An MXML tag placed inside a Flex application is
    compiled into appropriate code in an ActionScript class, therefore you can write
    Flex components dynamically without relying on MXML. |

    | Attributes | Properties of a class | MXML attributes that appear in the tags
    are nothing but ActionScript properties of the instance that you create. |

    | Attributes for style | Use setStyle() and getStyle() functions | Every component
    in Flex has one or more types of properties. One of the property types is Styles.
    Styles are special properties of Flex components that govern the look and feel
    of the components. |'
