  md: "# A book for the community\n\nThis book was created by the community: a community\
    \ consisting of university professors, students, and professionals (including\
    \ IBM employees). The online version of this book is released to the community\
    \ at no-charge. Numerous members of the community from around the world have participated\
    \ in developing this book, which will also be translated to several languages\
    \ by the community. If you would like to provide feedback, contribute new material,\
    \ improve existing material, or help with translating this book to another language,\
    \ please send an email of your planned contribution to db2univ@ca.ibm.com with\
    \ the subject \"Adobe Flex book feedback.\"\n\n# Conventions\n\nMany examples\
    \ of commands, SQL statements, and code are included throughout the book. Specific\
    \ keywords are written in uppercase bold. For example: A **NULL** value represents\
    \ an unknown state. Commands are shown in lowercase bold. For example: The **dir**\
    \ command lists all files and subdirectories on Windows. SQL statements are shown\
    \ in upper case bold. For example: Use the **SELECT** statement to retrieve information\
    \ from a table.\n\nObject names used in our examples are shown in *bold italics*.\
    \ For example: The **_flights_** table has five columns.\n\nItalics are also used\
    \ for variable names in the syntax of a command or statement. If the variable\
    \ name has more than one word, it is joined with an underscore. For example: CREATE\
    \ TABLE *table\\_name*\n\n# What’s next?\n\nWe recommend you to review the following\
    \ books in this book series for more details about related topics:\n\n+   - *Getting\
    \ started with DB2 Express-C*\n+   \t- *Getting started with IBM Data Studio for\
    \ DB2*\n+   - *Getting started with Eclipse*\n+   - *Getting started with Web\
    \ 2.0*\n\nThe following figure shows all the different ebooks in the DB2 on Campus\
    \ book series available for free at db2university.com"
  merge: -1
