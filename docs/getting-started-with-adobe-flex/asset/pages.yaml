- pgno: 56
  md: '# ### 3.2 MXML


    In this section we discuss the relationship between MXML and XML, how to code
    MXML effectively, and namespases. Adobe has not provided an official meaning for
    the MXML acronym; however, since Macromedia (acquired by Adobe) developed this
    language some people suggest it stands for Macromedia Extensible Markup Language,
    while others prefer to say that it stands for Magic Extensible Markup Language.


    # #### 3.2.1 XML


    XML stands for Extensible Markup Language. It is a language that describes data
    and is ideal for exchanging information, no matter the platform. For simplicity,
    you can think of an XML document as a text document with tags. For example, `<telephone>90542334</telephone>`
    is an XML document.


    > **Note:**

    > Today you can find a vast amount of resources about XML. In this book we provide
    a very short introduction given that XML is the foundation for MXML.


    While HTML is a language used to describe how to display data, XML is used to
    describe what the data is. Below are two simple examples, the first one is HTML,
    and the second one is XML:


    ```

    ```

    <b>Raul</b>

    <name>Raul</name>

    ```

    ```


    Can you see the difference with respect to the tags? In the first case (HTML),
    the tag <b> is used to indicate that the name Raul should be displayed in bold.
    In the second case (XML), the tag <name> is used to describe what Raul is, a name.


    XML uses a Document Type Definition (DTD) or XML Schema Definition (XSD) document
    to describe the rules for the tags. For example a rule can be that the tag <name>
    can only contain characters. These are also used to verify the document follows
    a predefined structure; this process is called XML validation.


    The extensibility in XML comes from the ability to create your own tags. This
    means that you can create your own vocabulary based on XML. This is what happens
    with MXML, it is basically an XML vocabulary where specific tags have been created
    by Adobe to provide structure for Flex applications.


    With respect to syntax, an XML document is a well-formed XML document when it
    follows the right syntax as defined by the World Wide Web Consortium (W3C) XML
    standard. For example, some of these rules state the following:


    +   - All that is opened must be closed — All the tags that are opened like <mx:Button>
    must be closed with the closing tag like </mx:Button>. If there is no content
    within the opening and ending tag as in <mx:Button> </mx:Button> then you can
    simply use one tag as in <mx:Button />.'
  merge: -1
  img_proc: true
- pgno: 57
  md: "XML is case-sensitive — This is to say that upper-case and lower-case letters\
    \ are not considered the same. So `<mx:Label1>` and `<mx:label1>` are both different.\n\
    \nWith respect to presentation, given an XML document, you can easily transform\
    \ it to a format which the media knows how to present. For example, use XSLT (eXtensible\
    \ Stylesheet Language Transformation) to transform XML documents into HTML documents\
    \ so that data can be accurately displayed on a Web browser. Simply apply a different\
    \ XML stylesheet to the same XML document, and you can present the content data\
    \ on a browser in a different look and feel.\n\nIn terms of navigation, when you\
    \ want to search for a specific content in an XML document you can use different\
    \ languages such as XQuery, XPath, and SQL/XML.\n\n# 3.2.2 Anatomy of an XML tag\n\
    \nA tag can contain information in two ways, either by content or in the way of\
    \ attributes. Content is nothing but the text enclosed between the opening and\
    \ the closing tag. On the other hand, an attribute is text enclosed in quotes\
    \ that exists in the opening tag only and describe the tag further. For example:\n\
    \n```\n<mx:Label id=\"myLabel\" >\n\t<mx:text> Hello World!! </mx:text>\n</mx:Label>\n\
    ```\n\nIn the above example id is an attribute of the tag `<mx:Label>`, and `<mx:text>`,\
    \ (yes you can nest one tag within another tag as with HTML) is the content of\
    \ the tag `<mx:Label>`.\n\nThe same can be written as\n\n```\n<mx:Label id=\"\
    myLabel\" text=\"Hello World!!\"/>\n```\n\nSo, an attribute can provide a more\
    \ compact and readable way to represent the same information.\n\nThough, attributes\
    \ are more compact, nested tags allow you to represent more complex content. They\
    \ are useful for plugging data that can't be represented by using attributes as\
    \ in the example shown in Listing 3.1\n\n```\n<mx:DataGrid>\n\t<mx:columns>\n\t\
    \t<mx:DataGridColumn headerText=\"Column 1\" dataField=\"col1\"/>\n\t\t<mx:DataGridColumn\
    \ headerText=\"Column 2\" dataField=\"col2\"/>\n\t\t<mx:DataGridColumn headerText=\"\
    Column 3\" dataField=\"col3\"/>\n\t</mx:columns>\n</mx:DataGrid>\n```\n\nListing\
    \ 3.1 - An XML document with nested tags"
  merge: -1
  img_proc: true
- pgno: 58
  md: '# **3.2.3 Namespaces in MXML**


    In MXML, every tag is prefixed with an **mx** followed by a colon. This is an
    XML namespace, stating that a tag belongs to the **namesp ace mx**. Namespaces
    are used for providing uniquely named elements and attributes in an XML instance.
    An XML can have more than one vocabulary and if each vocabulary is given a distinct
    name, then the ambiguity between the elements of different vocabulary with same
    name can be resolved by using the namespace. A namespace is declared using a URI
    (Universal Resource Identifier) as in the following


    ```

    <mx:Application xmlns:mx="http://www.adobe.com/2006/mxml">

    ```


    Here the namespace is **mx** and from there on, all the components defined in
    this namespace will be prefixed with **mx** followed by a colon.


    # **3.3 ActionScript 3**


    ActionScript has evolved over the years from being used as a language for Flash
    animation routines to a full-fledged object oriented programming language in the
    form of ActionScript 3.0. This book assumes that the user is already familiar
    with the fundamentals of OOP (Object Oriented Programming) concepts.


    Note: For more information about OOP, refer to the free ebook *Programming Fundamentals*,
    which is also a part of this book series.


    ActionScript is the foundation upon which the entire Flex Framework is based.
    This book discusses the ActionScript APIs used for Flex.


    # **3.3.1 Inline ActionScript**


    Inline ActionScript is used within the MXML tag. For example:


    ```

    <mx:Button id="myButton" label="Display alert" click=

    "mx.control.Alert.show(''Hello World!'')"/>

    ```


    In the above example, a button is being defined. When someone presses this button,
    the text *Hello World!*, should be displayed. The ActionScript usage is illustrated
    in the sentence:


    ```

    click= "mx.control.Alert.show(''Hello World!'')"

    ```


    This is an assignment statement for the click event. The **show()** method of
    the ActionScript class **Alert** is being assigned to this click event to display
    the alert dialog with the text *Hello World!*. **"**'
  merge: -1
  img_proc: true
- pgno: 59
  md: "For data binding, as in the following example, curly braces are used. Curly\
    \ braces cause the expression placed within it to be evaluated and the result\
    \ gets assigned to the attribute of the MXML tag.\n\n```\n```xml\n<mx:TextInput\
    \ id=\"myText1\" />\n<mx:Text id=\"myText2\" text=\"({myText1.text})\" />\n```\n\
    ```\n\n# 3.3.2 MXML Scripts\n\nThe other way in which ActionScript can be used\
    \ in MXML is by using the <mx:Script> element:\n\n```\n```xml\n<mx:Script>\n</mx:Script>\n\
    ```\n```\n\nThe contents of <mx:Script> block must be enclosed within the CDATA\
    \ construct, shown in the Listing 3.2, as this prevents the compiler from interpreting\
    \ the content as XML and thus helping in proper generation of ActionScript code.\n\
    \n```\n```xml\n<mx:Script>\n    <![CDATA[\n        import mx.controls.Alert;\n\
    \        private function result(evt:ResultEvent):void {\n            Alert.show(\"\
    Hello World!!!!\");\n        }\n    ]]>\n</mx:Script>\n```\n```\n\n# Listing 3.2\
    \ - ActionScript using <mx:Script/> tag\n\nThe ActionScript code blocks can also\
    \ be placed in a separate file with a .as extension. In this case the <mx:Script>\
    \ element is used as shown below.\n\n```\n```xml\n<mx:Script source=\"example.as\"\
    \ />\n```\n```\n\n# 3.3.3 ActionScript Variables and data types\n\nVariables are\
    \ declared in ActionScript using the var keyword. The following syntax is used:\
    \ var <var name> : <data type> ;\n\nThe data types supported in ActionScript are\
    \ listed in Table 3.1 below. Every data type has certain properties and methods.\
    \ You can also assign a value as you declare the variable. This is shown in the\
    \ examples provided with Table 3.1."
  merge: -1
