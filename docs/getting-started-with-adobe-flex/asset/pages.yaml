  md: '# About the Authors


    **Amitava Kundu** is a Senior Software Engineer and architect based at India Software
    Lab, Bangalore, India. His main responsibility is in the area of tools related
    to performance monitoring, tuning and management for various data servers and
    application stacks. As a technical lead, he’s involved with suit of product developments
    using Adobe Flex. Prior to this role, he’s part of IBM Rational group, where he
    was leading the functional and technical team for Project Portfolio Management
    (PPM) team. Amitava has more than 16 year of IT experience and he’s with IBM since
    2005.


    **Karthik Ramanarayanan** is an Advisory Software Engineer based at India Software
    Lab, Bangalore, India. He is currently involved with product development in the
    area of tools related to performance monitoring and management using Adobe Flex
    along with other technologies. Prior to this role, He was a part of IBM Rational
    group where he was involved with the Project Portfolio Management team working
    with DB2 and Oracle technologies. Karthik has more than 12 years of IT Experience
    and he has been with IBM Since 2007.


    **Charu Agarwal** is a System Software Engineer with India Software Labs, IBM,
    Bangalore. She is currently involved in developing tools related to performance
    monitoring and optimization using Adobe Flex with other server-side technologies.
    Prior to this role, she was involved in developing applications for the healthcare
    domain and has significant experience in database internals and Web 2.0 application
    development. She has more than 4 years of IT Experience and has been with IBM
    since 2008.


    **Mukul Kumar** is working as System Software Engineer with India Software Lab,
    IBM. Out of a total work experience of 4 years and 6 months, he spent more than
    3 years developing Web applications using Java™, J2EE and related technologies
    and framework. He is currently working with OPM development team where OSGi and
    Flex are the main stream of interest and development.


    **Anushka Chandrabau** is working as System Software Engineer in India Software
    Lab, Bangalore, India. She has a Bachelor Degree in Computer Science and Engineering
    and a Masters in Information Technology. Since joining IBM in 2008, Anushka has
    been working as a developer for Optim Data Studio suite of products. She’s a key
    designer and developer using Flex technologies for the new web based product development.


    **Raul F. Chong** is the DB2 on Campus program manager based at the IBM Toronto
    Laboratory, and a DB2 technical evangelist. His main responsibility is to grow
    the DB2 community around the world, helping members interact with one another,
    and contributing to the DB2 forums. Raul joined IBM in 1997 and has held numerous
    positions in the company. As a DB2 consultant, Raul helped IBM business partners
    with migrations from other relational database management systems to DB2, as well
    as with database performance and application design issues. As a DB2 technical
    support specialist, Raul has helped resolve DB2® problems on the OS/390®, z/OS®,
    Linux®, UNIX® and Windows® platforms. Raul has also worked as an information developer
    for the Application Development Solutions team where he was responsible for the
    CLI guide and Web services material. Raul has taught many DB2 workshops, has published
    numerous articles,'
