    # 6.4 Transitions


    A transition is a way to turn a state on or off in a graceful manner. Transitions
    are actually effects that are grouped together and played whenever a state change
    happens. Transitions apply their effects to one or more components. Like the `states`
    property of a component, the `transitions` property is also inherited from the
    `UIComponent` class.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# 6.4.1 Making states more interesting


    Transitions and states are very much interrelated. The State class defines all
    the actions that will change from the base state. This includes adding or removing
    components from the base view state, setting properties, setting styles or setting
    event handlers. In the transitions class you define the order of all of those
    actions. The changes that occur in the state are declared again in the transitions
    definition. If you do not apply a transition to a state, the changes of that state
    are applied instantly and no transition occurs.


    You can have different transitions from different states. The `<mx:transitions>`
    tag defines an array of transition objects. The `<mx:Transition>` tag defines
    a transition. It has the toState and fromState properties, which specify the states
    to which the transition has to be applied. By default, both the fromState and
    toState properties are set to "*", i.e., apply the transition from any state to
    any state. The fromState property specifies the view state that you are changing
    from, and the toState property specifies the view state that you are changing
    to. With transitions you can specify to apply the changes in Parallel or Sequence
    order. The syntax is:


    ```

    <mx:Transition  id="ID"  fromState="*"  toState="*"  />

    ```


    # 6.4.2 Using Action Effects


    Flex defines several action effects to control the order of view state changes
    when a transition takes place. When a view state is created, there are four classes
    that are used to define the view state. Each of these classes has a corresponding
    action effect that is used to control when a change, defined by the view state
    property occurs in a transition.


    Table 6.2 describes the action effects


    | Action Effect | Corresponding view state Class | Use |

    | :--- | :--- | :--- |

    | SetPropertyAction | SetProperty | Used to set a property value as part of a
    transition. |

    | SetStyleAction | SetStyle | Used to set a style to a value as part of a transition.
    |

    | AddChildAction | AddChild | Used to add a child as part of a transition. |

    | RemoveChildAction | RemoveChild | Used to remove a child as part of a transition.
    |


    # Table 6.2 - Action Effects


    Let us now add some transitions to the previous example on States to see how it
    works.'
  merge: -1
  img_proc: true
- pgno: 125
  md: "+   1. Add the `<mx:transitions>` tag to define the array of transitions that\
    \ you are going to create.\n\n+   2. Create a transition such that when the state\
    \ changes to the First State from any state, a wipewdown effect takes place. The\
    \ corresponding code is shown in Listing 6.6 below.\n\n```\n```xml\n<mx:Transition\
    \ id=\"transitionl\" fromState=\"*\" toState=\"firstState\">\n\t<mx:Parallel id=\"\
    seq1\" target=\"{{panel,txt1}}\">\n\t\t<mx:RemoveChildAction/>\n\t\t<mx:WipeDown\
    \ duration=\"2000\"/>\n\t\t<mx:AddChildAction/>\n\t</mx:Parallel>\n</mx:Transition>\n\
    ```\n```\n\n# Listing 6.6 - Defining a transition\n\n+   3. Add another transition\
    \ such that when the state changes to the Second State from any state, a wipewleft\
    \ effect takes place. The corresponding code is shown below in Listing 6.7.\n\n\
    ```\n```xml\n<mx:Transition id=\"transition2\" fromState=\"*\" toState=\"secondState\"\
    >\n\t<mx:Sequence id=\"seq2\" target=\"{{panel,txt2}}\">\n\t\t<mx:RemoveChildAction/>\n\
    \t\t<mx:WipeLeft duration=\"2000\"/>\n\t\t<mx:AddChildAction/>\n\t</mx:Sequence>\n\
    </mx:Transition>\n```\n```\n\n# Listing 6.7 - Second transition for wipewleft\
    \ effect\n\n+   4. You can see that the first transition occurs in parallel. That\
    \ is, both the panel and the textarea appear in parallel when the transition occurs.\
    \ However, the second transition is defined in a sequence, so the textarea appears\
    \ after the panel in the wipewleft effect.\n\n+   5. You can run the application\
    \ and see for yourself how smoothly the transition occurs between the view states.\n\
    \n# 6.5 Filters\n\nFilters allow you to apply an effect on a particular target\
    \ component or a subset of target components. Without filters, all the effects\
    \ defined in a transition are by default applied to all the target components.\n\
    \nFor either a sequence or parallel effect, you can define the filter property.\
    \ For example, if the filter property is specified a value of move, then the effect\
    \ will apply only to those components whose x or y values change during the change\
    \ of view state."
  merge: -1
  img_proc: true
- pgno: 126
  md: '# 6.5.1 Common Filters


    Some of the most commonly used values for the filter property as available in
    Adobe documentation are listed in Table 6.3 below.


    | Value | Description |

    | :---- | :---- |

    | add | Specifies to play the effect on all children added during the change of
    view state. |

    | hide | Specifies to play the effect on all children whose visible property changes
    from true to false during the change of view state. |

    | move | Specifies to play the effect on all children whose x or y properties
    change during the change of view state. |

    | remove | Specifies to play the effect on all children removed during the change
    of view state. |

    | resize | Specifies to play the effect on all children whose width or height
    properties change during the change of view state. |

    | show | Specifies to play the effect on all children whose visible property changes
    from false to true during the change of view state. |


    Table 6.3 - Filter property value


    # 6.5.2 Applying Filters


    The filter property of the <mx:Sequence> or <mx:Parallel> tags can be set to any
    of the values defined in the above Table 6.3. The effect will then be played only
    on the target component or subset of components that satisfies that filter property.
    The concept of filters will become clear if you try adding a filter to the Parallel
    effect created in the previous sample application as shown in Listing 6.8.


    ```

    <mx:Transition id="transition1" fromState="" toState="firstState">

    <mx:Parallel id="seq1" targets="{[panel1,txt1]}" filter="add">

    <mx:RemoveChildAction/>

    <mx:WipeDown duration="2000"/>

    <mx:AddChildAction/>

    </mx:Parallel>

    </mx:Transition>

    ```


    Listing 6.8 - Applying filters


    When you run the sample application with the above change in the code, you can
    see that the wip edown effect only takes place for the TextArea which is the component
