    # 4.5.1 Renaming the TCPIP configuration file


    It is recommended that you change the name of the main TCPIP configuration file
    from TCPIP to <system_ID> TCPIP, where <system_ID> is the name of your new z/VM
    system. This is to avoid that the PROFILE TCPIP file will be overwritten when
    applying maintenance.


    +   1. Logoff from AUTOLOG1 and log to TCMAINT. The TCPIP file is on the TCMAINT
    198 disk, which is accessed as the D disk.

    2. Make a backup copy of the original PROFILE TCPIP, then rename it to <system_ID>
    TCPIP (where <system_ID> is VMINUX in this example). When the TCP/IP service machine
    starts, it will search for this file before the PROFILE TCPIP.

    ==> copy profile tcpip d <tciporig = old

    ==> rename profile tcpip d <vminux> ==

    3. You have now backed up and renamed your TCP/IP profile. You can verify this
    using the LISTFILE command:


