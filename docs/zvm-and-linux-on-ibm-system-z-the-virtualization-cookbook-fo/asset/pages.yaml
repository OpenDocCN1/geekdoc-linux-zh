  md: '**Important:** When logging onto a z/VM user ID that runs CMS, you should usually
    press **Enter** at the VM READ prompt. This will result in a prompt of the form:


    Ready; T=0.01/0.01 11:14:20


    2. IPL CMS, press **Enter** at the VM READ prompt in the lower right corner. You
    should see the Ready; prompt.


    ```

    == ipl cms

    ==> Enter at the VM READ prompt

    ```


    3. Run the **instvm dvd** command:


    ```

    == instvm dvd

    ...

    HCPPL0DB3291 POSTLOAD EXEC ENDED SUCCESSFULLY

    ...

    HCPVIMB3921 INSTVM ENDED SUCCESSFULLY

    ```


    This EXEC continues the installation process. This step should take about 4 to
    8 minutes. The last message should be HCPVIMB3921 INSTVM ENDED SUCCESSFULLY.


    4. Load the recommended service. First **IPL CMS**, then press **Enter** at the
    VM READ prompt:


    ```

    == ipl cms

    ==> Enter at the VM READ prompt

    Ready;

    ```


    5. For zVM 5.4, the service name is **5401RSU1**. Verify this file exists on the
    MAINT 500 disk:


    ```

    == acc 500 c

    DMACSAC7241 C replaces C (2CC)

    == listfile * c

    5401RSU SERVLINK C

    ```


    6. Run the SERVICE **ALL** command to apply the service:


    ```

    == service all 5401rsl

    ```


    This step should take about 3 to 6 minutes. The last message should be:

    VMFSZ2761 SERVICE processing completed successfully.


    7. IPL CMS and run the **putprod** command. This puts the service into production:


    ```

    == ipl cms

    ==> Enter

    Ready;

    ==> putprod

    ```


    This step should take about 2 to 4 minutes. The last message should be:

    VMFPZ2701 PUT2PROD processing completed successfully.


    A return code of (0) is ideal. You may get a return code of 4 and the message:

    VMFPZ2701 PUT2PROD process completed with warnings.


    In general on z/VM, a return code of 4 is acceptable. That means that only warnings
    were issued. A return code of 8 or greater generally means that errors were encountered.


    8. Enter the following command to shut down and re-IPL your system:


    ```

    == shutdown reipl

    SYSTEM SHUTDOWN STARTED

    ```'
