- img_proc: true
  md: '# 14.1 Using INDICATE and other commands


    z/VM has many commands to monitor the system of the system. CP INDICATE is the
    most commonly used, and there are other commands that are addressed.


    # 14.1.1 Using the INDICATE command


    z/VM has basic commands such as INDICATE. This command can be useful if there
    are no other tools with more extended function on the system, such as when undertaking
    a completely new system installation. (However, command tools should not be relied
    upon for formal, long-term reporting on production systems.)


    There are many INDICATE parameters that can be included as command line options.
    Use the command HELP INDICATE for a basic understanding, and then press F11 for
    help on each parameter.


    # INDICATE LOAD


    If specified, INDICATE LOAD is the default option. There are "flavors" of this,
    depending on whether the issuing user ID has privilege class G or privilege class
    E. Class G users can use INDICATE to display recent content for system resources,
    as well as to display environment characteristics and measurements of resources
    used by their virtual machine.


    The output from user ID with class E (for example, MAINT, OPERATOR) is shown here:


    ```

    == ind 03

    1 AVPROC-00002/SEC MIGRATE-0001/SEC

    2 XSTORE-00068/SEC WRITES-00000/SEC HIT RATIO-099%

    3 MRC READ-00003/SEC STEAL-0000%

    4 PAGING-0331/SEC STEAL-0000%

    5 Q-00060(00000) E1-00000(00000) DORMANT-00357

    6 Q-00001(00000)

    7 Q-00001(00000) EXPAN-002 E2-00000(00000)

    8 Q-00034(00000) EXPAN-002 E3-00000(00000)

    10 PROC-0000-03B PROC-0001-03B%

    11 PROC-0002-038%

    12 LIMITED-00000

    ```


    The INDICATE LOAD command gives a bold font to the descriptions that follow:


    The counts of virtual machines in various queues and the listed list, the values
    you see here are a smoothed average over the past 4 months. Where z/VM performance
    analysts need to focus on the following:


    > AVPROC provides the overall processor utilization (38%, in this example). The
    number following it is the number of online processors (3, in this example). The
    individual processor utilization is shown on lines ID. Examine these to see if
    they are somewhat balanced. There are cases where an imbalance is unacceptable.
    This would include very low utilization scenarios, or cases where there are not
    enough users ready to run virtual processors to keep the physical processors busy.
    One of the processors will be a Master, all of the others Alternate, and some
    may be resulting from these functions.'
