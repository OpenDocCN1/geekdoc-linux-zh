  md: '# 8.1 Installing the golden image


    In this section you will install the RHEL 5.2 golden image onto the user ID RHEL52.


    # 8.1.1 Creating the user ID RHEL52


    In this section you will define the RHEL5.2 user ID to z/VM.


    +   1. Logon to MAINT and edit the USER DIRECT file:

    2. Go to the bottom of the file and add the definition for a new user ID named
    RHEL52. This user ID is given C privilege. Be sure to replace the volume labels
    (MMD956 and MMD957, in this example) with the labels of DASD:


    ```

    USER RHEL52 LNXVM 25M 16G BDEG

    INCLUDE LNDXFL

    OPTION LNKOPAS APPLMON

    MDISK 1010 3390 000 001 <MMD955> MR LNXVM LNXVM LNXVM

    MDISK 1010 3390 000 001 <MMD956> MR LNXVM LNXVM LNXVM

    *

    ```


    This user ID will have the minidisks and virtual disks (VDISKS) listed in Table
    8-1.


    | Minidisk | Description |

    |---|---|

    | 100-101 | Minidisk used to create the /boot file system, a LVM containing the
    other files of the Linux golden image. |

    | 300-301 | These are virtual disk (VDISK) spaces that are not defined in the
    USER DIRECT file, but instead defined by calls to the $SWAPGEN EXEC in the user
    $PROFILE EXEC when the user logs on, the VDISKS are created. |


    +   3. Go back to the top of the file and search for user $ALLOC. Add cylinder
    0 of the two new values to this dummy user ID so that they do not show up as gaps
    in the USER DISMAP report:


    ```

    ==> top

    ==> $ALLOC$ NOLOG

    USER $ALLOC$ NOLOG

    MDISK A001 3390 000 001 <MMD850> R

    MDISK A002 3390 000 001 <MMD853> R

    MDISK A003 3390 000 001 <MMD854> R

    MDISK A004 3390 000 001 <MMD857> R

    MDISK A005 3390 000 001 <MMD856> R

    MDISK A006 3390 000 001 <MMD952> R

    MDISK A007 3390 000 001 <MMD953> R

