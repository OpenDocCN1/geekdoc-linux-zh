  md: '# Installing RHEL 5.2 on the controller


    **Note:** Before proceeding with this chapter, you must complete the tasks described
    in Chapter 4, “Installing and configuring z/VM” on page 27, Chapter 5, “Servicing
    z/VM” on page 71, and Chapter 6, “Configuring a Network File System for RHEL 5.2”
    on page 85.


    At this point, you must have created a new z/VM user ID, LXINST. Now it is time
    to create the first Linux user ID, LXINST. This Linux ID is the controller installation
    server, and serves as the administration point for future Linux IDs. This server
    is also referred to as the controller. LNXINST serves the following purposes:


    +   - Red Hat Enterprise Linux 5.2 installation server: This is a tree of Red
    Hat packages (RPMs) and other files required for installation.


    +   - Network File System (NFS) server: This exports the installation tree and
    possibly other useful files.


    +   - Clone server: This is for cloning an installation to a new Linux ID. See
    Chapter 9, “Configuring RHEL 5.2 for cloning” on page 129.


    +   - Kickstart server: This hosts files necessary for automated installations.
    See Chapter 10, “Installing Linux kickstart” on page 147.


    In this chapter, you will complete the following tasks:


    +   - Installing the controller


    +   - Configuring the controller'
  merge: -1
  pgno: 108
- img_proc: true
  md: '# ## 7.1 Installing the controller


    In this section you will install the RHEL 5.2 controller under the user LNXINST.
    This is the guest that will serve as the installation and file server for future
    Linux guests.


    # ### 7.1.1 Creating the user ID LNXINST


    In this section you define the LNXINST user ID to z/VM.


    +   1. Logon to MAINT and edit the USER DIRECT file:


    ```

    ===> x user direct c

    ```


    In the USER DIRECT file, you can group statements that will be common to many
    user definitions in a construct called a profile. This profile can become part
    of the user definitions using the INCLUDE statement. You used the existing profile
    TCPMSU when you define the LNXMAINT user.


    2. Create a new profile named LNXFLT. This will contain the directory statements
    that will be common to all Linux user IDs. To save typing, you can use the **
    prefix commands to duplicate the IMFLT profile that is on lines 37-50:


    ```

    ****

    0037 *

    0039 PROFILE IMFLT

    0040 SPOOL 000C 2540 READER *

    0041 SPOOL 000D 2540 PUNCH A

    0042 SPOOL 000E 1403 A

    0043 CONSOLE 0009 3213 T

    0044 LINK MAINT 0190 0190 RR

    0045 LINK MAINT 019D 019D RR

    0046 LINK MAINT 019E 019E RR

    0047 LINK MAINT 0402 0402 RR

    0048 LINK MAINT 0403 0403 RR

    0049 LINK MAINT 0405 0405 RR

    0050 *********************************

    ```


    3. Edit the duplicated profile by deleting the three LINK 040x lines, and inserting
    the lines that are shown in bold font:


    ```

    PROFILE LNXFLT

    IPL CMS

    MACHINE ESA 4

    CPU 09

    NICFT 600 TYPE QDI0 LINK SYSTEM VSH1

    SPOOL 000C 2540 READER *

    SPOOL 000D 2540 PUNCH A

    SPOOL 000E 1403 A

    CONSOLE 0009 3213 T

    LINK MAINT 0190 0190 RR

    LINK MAINT 019D 019D RR

    LINK MAINT 019E 019E RR

    LINK LNXMAINT 192 191 RR

    LINK TCMAINT 592 592 RR

    ```


    The numbers in bold on the command lines refer to the descriptions that follow.


    +   1 CMS is IPled when the user ID is logged in.

    2 The machine will be of type ESA with a maximum of 4 CPUs that can be defined.

    3 This defines the base CPU.

    4 This defines a virtual NIC connected to the VSWITCH starting at virtual address
    600.


    The Virtualization Cookbook for Red Hat Enterprise Linux 5.2'
  merge: -1
  pgno: 109
- img_proc: true
  md: 'This provides read access to the LNXMAINT 192 disk as the user''s 191.


    This provides read access to the TCPMAINT 592 disk, as the user has access to
    TCP/IP services from FTP.


    Go to the bottom of the file and add the definition for a new user ID named RHEL52.
    This user ID is given the B privilege (aside the typical class G) in order to
    run the FLASHCOPY command, It is also given the D privilege to run the QUERY ALLOC
    map command, and the E privilege to run the QUERY command. Be sure to replace
    the volume labels that are in brackets (for example, <MD0856->) with the labels
    of your DAS.


    ```

    USER LNXMAINT LNXVM 256M 16G BDEG

    INCLUDE LNXFL

    OPTION LNOPNAS APPL

    MDISK 100 3390 0001 3338 <MD0856> MR LNXVM LNXVM LNXVM

    MDISK 101 3390 0321 3318 <MD0857> MR LNXVM LNXVM LNXVM

    MDISK 102 3390 0001 3338 <MD0952> MR LNXVM LNXVM LNXVM

    MDISK 103 3390 0001 3338 <MD0953> MR LNXVM LNXVM LNXVM

    MDISK 104 3390 0001 3338 <MD0954> MR LNXVM LNXVM LNXVM

    ```


