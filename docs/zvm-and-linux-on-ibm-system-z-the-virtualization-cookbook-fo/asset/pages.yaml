  md: '# z/VM configuration files


    z/VM differs from Linux in regard to the location and number of configuration
    files. In Linux, there are many configuration files and most of them are in or
    under the /etc/ directory. On z/VM, there are relatively few configuration files.
    However, they are on many different minidisks.


    Table 1 summarizes the location and content of z/VM configuration files.


    Table 1 z/VM configuration files


    | File | Location | Description |

    |---|---|--|

    | SYSTEM CONFIG | MAINT CF1 | This is the operating system''s main configuration
    file. It defines the system name, the CP volumes, user options and other settings.
    |

    | USER DIRECT | MAINT 2CC | This file defines the user directory. All user IDs
    or virtual machines known to the system are defined here (assuming a maintenance
    product is not being used). |

    | <System_ID> TCIP | TCPAINT 198 | This file defines resources for the primary
    z/VM TCP/IP stack, including TCP/IP address, OSA resources, subnet mask and gateway.
    It is initially created by the IPWIZARD tool as PROFILE TCIP. |

    | SYSTEM DTCPARMS | TCPAINT 198 | This file is created to define the TCP/IP stacks
    on the system. It is initially created by the IPWIZARD tool. |

    | TCIP DATA | TCPAINT 592 | This file defines the DNS server, the domain name
    and other settings. It is initially created by the IPWIZARD tool. |

    | PROFILE EXEC | AUTOLOGOG 191 | This file is a REXX EXEC that is run when the
    system starts up. It is analogous to the /etc/inittab file in Linux. |


    # Quick reference sheets


    This section contains quick reference sheets for the XEDIT and vi editors.


    # XEDIT quick reference sheet


    XEDIT has line commands which are typed on the command line (===>) prefix commands
    which are typed over the line numbers on the left side of the window.


    # Line commands


    +   * Add a line

    * Add ''n'' lines

    * Search for ''old'' and replace it with ''new'' for ''n'' lines below the current
    line and ''m'' times on each line. ** can be used for ''n'' and ''m''

    * Search for ''string'' from the current line

    * Search back for ''string''

    * Show all occurrences of ''string'' and hide other lines

    * Move to the bottom of the file

    * Move to the top of the file

    * Move down ''n'' lines

    * Move up ''n'' lines

    * Save the current file and exit XEDIT

    * Save the current file and exit don''t warn of overwrite

    * Save the current file but don''t exit


    212 The Virtualization Cookbook for Red Hat Enterprise Linux 5.2'
