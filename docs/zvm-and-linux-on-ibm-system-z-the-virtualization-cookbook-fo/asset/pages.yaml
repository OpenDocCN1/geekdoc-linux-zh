  md: '# Installing Linux with kickstart


    Kickstart is an automated way of installing RHEL 5.2. Using kickstart, you can
    create a single file that answers all of the questions usually asked during an
    interactive installation.


    In Chapter 9, “Configuring RHEL 5.2 for cloning” on page 129, you cloned to LINUX01
    and created three new user IDs for virtual servers. In this chapter, you will
    kickstart a RHEL 5.2 system to LINUX02. In comparison, cloning a server is faster,
    assuming the FLASCOPY command is available. However, kickstarting a server is
    more flexible, because it allows for different package configurations as well
    as pre-installation and post-installation scripting.


    The controller is now configured as an installation server, with the installation
    tree shared using NFS. You will now configure it as a kickstart server to perform
    automated installations over the network. Then you will install the final Linux
    server with kickstart.


    The following steps are involved in installing Linux with kickstart:


    +   * Configure the controller for kickstart

    * Configure the LINUX02 user for kickstart

    * Kickstart the LINUX02 user'
  merge: -1
