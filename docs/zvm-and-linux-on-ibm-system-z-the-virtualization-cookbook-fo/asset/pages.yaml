    You may have noticed that there is some data in the directory which will serve
    as the mount point. To complete the addition of the logical volume, we recommend
    that you move any data from the existing directory to the new logical volume.
    First unmount the logical volume and view the contents of the /home/ directory:


    ```

    # umount /home

    # ls -F /home

    ldapususer/

    ```


