    # 10.2 Configure the LINUX02 user


    Earlier you should have created the user ID LINUX02, and at this point you configure
    it for the RHEL5 LINUX02 must have its own parameter and configuration files,
    which are based on the RHEL5 user ID.


    LOGOFF from MAINT and logon to LXNMAINT. Copy the parameter and configuration
    files from RHEL52 to LINUX02 as follows:


    ```

    == copy rhel52 part-rh5 d linux02 = =

    == copy rhel52 conf-rh5 d linux02 = =

    ```


    Edit the LINUX02 PART-RH5 file. Because this is a non-interactive installation,
    the vnc options are no longer required. The ks* line directs the installer to
    obtain the kickstart file from the installation server. RUNKS is required for
    kickstarts, and the cmdline option prevents the installer''s text-based interface
    from operating on the 3270 console:


    ```

    == linux02 part-rh5 d

    ramdisk_size=40000 /dev/ram0 ip=off

    CMDSA50=191 CONFIGFILE=linux02.conf-rh5

    ks-nfs=9.12.5.30/nfs/linux02-ks.cfg

    RUNKS=1 cmdline

    ==> file

    ```


    Next, edit the LINUX02 conf-rh5 d and change the DASD range and networking information:


    ```

    == linux02 conf-rh5 d

    DASD=100-101f,300-30f

    HOSTNAME=<virtc532.itso.ibm.com>

    NETTYPE=eth

    IPADDR=<9.12.5.32>

    ...

    ==> file

    ```


    # 10.3 Kickstart the LINUX02 user


    Perform the following steps to kickstart the LINUX02 user:


    +   1. Logoff from LXNMAINT and logon to LINUX02. When asked to IPL from disk
