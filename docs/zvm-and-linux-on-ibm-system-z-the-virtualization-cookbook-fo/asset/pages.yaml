  md: '# 2.1 Bill of materials


    The resources needed for a Linux on System z project can be divided into:


    +   - Hardware

    - Software

    - Networking


    # 2.1.1 Hardware resources


    The following hardware are needed:


    +   - A System or zSeries logical partition (LPAR); z800, z900, z890 and z990,
    System z9® System z10

    - Processors or CPUs: One IFL (or CP) minimum; using two or more is strongly recommended

    - Memory: 3 GB central/1 GB extended minimum; using 6 GB/2 GB or more is recommended.
    3:1 ratio of central to extended is a useful starting point for relatively small
    systems such as in these examples.


    See the following Web site for a discussion about how to approach memory:


    ```

    http://www.vm.ibm.com/perf/tips/storconf.html

    ```


    +   - DASD: 25 3390-s or 9 3390-s at a minimum

    - Open Systems Adapter (OSA) network cards: One card with 8 device numbers (6,
    but OSA "triplets" usually start on an even address). Two OSA Express with eight
    device numbers on one and on the other is recommended for high availability.

    - A network-attached computer that will act as an Network File System (NFS) server
    temporarily with least 6 GB of disk space, but may be needed. Setting up a Linux
    PC or UNIXIX server is described.


    If you have access to a Windows machine, AllegroNFS has been suggested as an NFS
    server; for refer to


    ```

    http://nfsforwindows.com/home

    ```


    +   - A workstation or network access to the mainframe


    # 2.1.2 Software resources


    The following software resources are needed:


    +   - z/VM 5.4 install media with documentation (installation from DVD is described).

    - SLES 10 SP2 (for the book SG24-7493) or RHEL 5.2 (for the book SG24-7492) Linux
    install media

    - An operating system for the NFS server

    - The code associated with this book

    - Tools on the network and desktop:

    - A 3270 Emulator such as Attachmate Extra, Hummingbird Host Explorer, or IBM
    Personal Computers for Windows desktops

    - A Linux SSH client such as PuTTY (recommended) or TeraTerm

    - A VNC viewer


    8 The Virtualization Cookbook for Red Hat Enterprise Linux 5.2'
