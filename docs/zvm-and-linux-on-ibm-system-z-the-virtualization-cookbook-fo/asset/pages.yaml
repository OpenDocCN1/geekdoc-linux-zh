    # 7.2.10 Configuring SSH keys


    SSH sessions are typically authenticated using passwords typed from the keyboard.
    With SSH key-based authentications, sessions can be authenticated using public
    and private keys so that no password is needed. To accomplish this, the following
    must be true:


    +   * The SSH server must have the client''s public key.

    * The SSH client must send its private key.

    * The keys match


    SSH key-based authentication can be set up from the controller (client) to the
    virtual servers. If the master image has a copy of your public key in the /etc/ssh/authorized_keys,
    and the controller has a symbolic link to its private key in the /root/.ssh/id_rsa,
    then the key-based authentication will work to the cloned virtual servers.


    Create a new dsa key in the directory /etc/ssh/


    ```

    # cd /etc/ssh

    # ssh-keygen -t dsa -f id_dsa

    Generating public/private dsa key pair.

    Your identification has been saved in id_dsa.

    Your public key has been saved in id_dsa.pub.

    The Fingerprint is:

    c98:e6:c1:48:52:b0:56:9b:67:aa:root@virtc530.itso.ibm.com

    ```


    This creates a key pair where the .pub suffix is the public key, and the other
    file is the private key. Note that the private key is only read-only by:


    ```

    # ls -l id*dsa

    -rw------- root 668 Dec 22 13:47 id_dsa

    -rw-r--r-- root 615 Dec 22 13:47 id_dsa.pub

    ```


    We copy this symbolic link to the golden image in 8.2.8, "Configuring SSH keys"
    on page 127.


    Make a symbolic link to the private key, id_dsa, in the new directory /root/.ssh/


    ```

    # mkdir /root/.ssh

    # chmod 700 /root/.ssh

    # cd /root/.ssh

    # ln -s /etc/ssh/id_dsa

    ```


