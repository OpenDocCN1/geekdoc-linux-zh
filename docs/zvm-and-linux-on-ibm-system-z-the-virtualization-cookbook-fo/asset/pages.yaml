  md: 'For example, Figure 2-1 shows the labeling convention for the DASD in $M$,
    of type *minidisk* at real address $A700$.


    | M | A | 7 | 0 | 0 |

    |---|---|---|---|---|

    | | | | Real address |

    | | | | DASd type - Minidisk or PERM |

    | | | | LPAR identifier |


    **Figure 2-1** DASD labeling convention


    The letter M is hard-coded in REXX EXECs that adopt this convention. If you want
    a different LPAR identifier character, they can easily be changed.


    # ## 2.2.2 Backup file naming convention


    It is recommended that you keep copies of important zVM and Linux configuration
    files. You should always keep copies of original configuration files in case you
    need to go back to them.


    Because z/VM file names are limited to 16 characters (for the file name and eight
    for the file type), only the last four characters of the file type are used. This
    often requires some characters to be overwritten. For the original file, the suffix
    *DREIG* is used, and for the most recent working copy, the suffix *IEKS* (for
    "It Works"). For example, the original USER *DIRECT* file is copied to the file
    USER *DIREORIG* before it is modified the first time.


    # ## 2.2.3 The command retrieve convention


    The ability to retrieve "pass" the command that you are looking for. It is useful
    to retrieve in both cases where you use *pass*, *bash*, this by default with the
    up arrow and down arrow keys.


    There is a convention in zVM to use the F12 key (labeled PF12 on physical 3270
    devices) to retrieve the last command, although it is not defined to all user
    IDs. There is no convention retrieve commands in the other direction, but it is
    possible to set another key to that function. F11 is used to *retrieve forward*
    as it is next to F12. Also, the same function is used in the editor, *XEDIT*.
    The ? subcommand retrieves past commands, so it is recommended that you assign
    it to F12.


    # ## 2.3 Disk planning


    There are different aspects to consider when planning how to choose and allocate
    disk storage, including:


    +   - Conventional ECKD DASD disks versus SCSI/FCP

    -* 3390-s versus 3390-s or large disk support

    -* Amount of disk storage per Linux image and how to allocate file systems'
  merge: -1
