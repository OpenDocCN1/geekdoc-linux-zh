  md: '# 1.2 This book''s approach


    Today there are numerous technical publications that discuss virtualization, but
    few of them demonstrate how to achieve it. This book gives you the "hands on"
    instructions needed to achieve a virtualized environment on your enterprise.


    The approach adopted is to keep all solutions simple, as expressed in the well-known
    quote from Albert Einstein "Everything should be made as simple as possible, but
    not simpler". This book attempts to use a clear and insightful presentation to
    explain the complex topics covered.


    # 1.3 Choices and decisions made in this book


    When deciding on installing, maintaining and provisioning (cloning) Linux virtual
    servers under z/VM, there are many basic choices to make. Here are some of the
    choices and assumptions in this book:


    +   Use of "roll own won" cloning products

    A discussion of cloning products such as Adva Onstage, the Mainstar Provisioning
    Expert, IBM Tivoli Provisioning Manager and IBM Director is beyond the scope of
    this book. Although there are viable solutions, the cloning described in this
    book allows you to roll your own Linux images without requiring such products.
    However, these products are more sophisticated than the simple clone script and
    z/VM configuration described in this book.


    +   Use of the DIRECT file versus a directory maintenance product

    The use of the DIRECT file was chosen over a directory maintenance product such
    as IBM DirMaint™ or CA''s vMDirect.


    +   If using DirMaint as a directory maintenance product would be better for your
    enterprise, you can refer to Getting Started With Linux, SC24-6096, to configure
    z/VM. To configure Linux, use this book.


    +   Use of predefined user IDs servers provisioning

    z/VM user IDs must be predefined to clone. There is no attempt to provision (define
    and bring Linux user IDs online) as part of the cloning process. The target Linux
    user ID must exist with the appropriate minisks defined.


    +   Use of read-write servers shared-read Linux /usr/ file system\Some cloning
    solutions use an environment that shares the /usr/ file system. This often makes
    the solution more complex, especially when adding software to the virtual servers.
    For this book, a read-write /usr/ file system on the virtual servers was chosen
    to keep things as simple as possible.


    +   Use of conventional 3390 ECKD™ DASD versus SCSI over FCP

    The system z has traditionally only supported 3390 DASD. Support has been extended
    to include SCSI/FBA disks in storage area networks (SANs). The support of FBA
    disks is slightly more complicated than conventional DASD. Keeping things simple
    as possible, only conventional DASD is described in this book.'
  merge: -1
