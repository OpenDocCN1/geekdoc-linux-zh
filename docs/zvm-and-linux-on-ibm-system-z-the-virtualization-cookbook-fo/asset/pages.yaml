  md: '# Preface


    This IBM® Redbooks® publication describes how to "roll your own" Linux® virtual
    servers on IBM System z® hardware under z/VM®. This edition applies to Version
    5, Release 4, Modification 0 of z/VM (product number 5741-A05) and Version 5,
    Release 2 of Red Hat Enterprise Linux.


    With z/VM and Linux infrastructure, you can reduce the time between deciding on
    the acquisition of new servers and then implementing them because new servers
    can be deployed in a matter of minutes. This powerful "build and clone" capability
    can enable you to launch new products and services without the exhaustive planning,
    purchasing, installing and configuring of new hardware and software that can be
    associated with जानवर discrete hardware servers. Development groups that need
    test environments will rebuild rapidly to enable them to deliver their products,
    while handling management in the process, can also benefit from this unique advantage.


    The publication adapts a cookbook format that provides you concise, repeatable
    set of procedures for installing and configuring z/VM in a logical partition (LPAR),
    and then installing and customizing Linux. To implement these instructions, you
    need an IBM System z logical partition with associated resources, z/VM 5.4 media,
    and a Linux distribution.


    This book assumes you have a general familiarity with System z technology and
    terminology. It does not assume an in-depth understanding of z/VM and Linux. It
    is written for those who want to get a quick start with z/VM and Linux on the
    mainframe.


    # The team that wrote this book


    This book was originally written in 2005 by Michael Maclaisc, Jin Xiong and Curtis
    Gehart. It was updated in 2006 by Michael Maclaisc, Carlos Ordone and Jin Xiong.
    It was updated a third time in 2006 and 2007 by Marian Gasparovic taking the lead
    on the SLES 10 version and Brad Hinson of Red Hat working on RHEL 5.


    In 2007 and 2008, Michael Maclaisc, Brad Hinson, and Lester Peckover updated it
    for z/VM 5.4, SLES 10 SP2, and RHEL 5.2.


    Michael Maclaisc supports Linux and z/VM on IBM System z® in Pkeepsie.


    Brad Hinson is the Support Engineering lead for System z at Red Hat in Raleigh,
    North Carolina. He specializes in Linux support for the mainframe, and leads technical
    oversight of all System z projects and activities. He holds a BS degree in Computer
    Science from the University of North Carolina at Chapel Hill, and MS degrees from
    UNC Greensboro and UNC Hill.


    Lester Peckover is an Infrastructure, Performance, and Capability Architect in
    the United Kingdom. He has 32 years of experience in IT covering IBM System x™
    and System p, and has also worked on other system platforms in performance and
    other areas, specializing in virtualization. His areas of expertise include System
    z and Linux running on the mainframe, as well as performance analysis and modelling.
    He has helped to develop the IBM VM Performance Toolkit and other IBM VM products
    and tools from other vendors. Lester has written, taught, and presented worldwide
    on performance and capacity system management topics.'
