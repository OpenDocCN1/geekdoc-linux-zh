    > Hint: It is convenient to use the Alt-Tab key sequence to move between the HMC
    window and the 3270 console.


    +   5. Insert the z/VM Product Package Version 5 Release 4.0 DVD into the HMC
    DVD drive.


    > Important: On z10 HMCs and later, it is no longer required to be in Single Object
    Operations mode in order to install z/VM.


    +   6. On a z9 HMC and earlier model, get into Single Object Operations mode (as
    mentioned, for z10 HMCs and later, this step is not necessary). To get into this
    mode, perform the following steps:

    a. Double-click the Groups icon in the Views Area.

    b. Double-click Defined CPCs in the Groups Work Area.

    c. Select your CPC.

    d. If necessary, go around the racetrack (the buttons with circular arrows on
    the bottom right corner) to the CPC Recovery menu.

    e. Double-click the Single Object Operations icon. Click Yes to confirm. A new
    window Primary Support Element should appear (on older HMC levels, it will be
    "within a window"). A window about a certificate not being valid may appear; in
    this case, press OK.

    f. Double-click Groups near the top of this window.

    g. Double-click images in the Groups Work Area.


    > Important: If you are unable to get into Single Object Operations mode, it may
    be because you do not have sufficient permission. Check with the system administrator.


    +   7. The LPAR that z/VM will be installed into still be selected. On the right
    you still see the (CPC) Recovery menu. Double-click the Load from CD-ROM or Server
    icon as shown in Figure 4-2 on page 30.'
