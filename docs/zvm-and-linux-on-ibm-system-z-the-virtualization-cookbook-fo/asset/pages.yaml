  md: '# 13.1 Adding a logical volume


    There are times when you require more disk space than a single direct access storage
    device (DASD) volume provides. For example, if you want to have a /home/ directory,
    you will want it to be of sufficient size. When this is the case, you can use
    the Volume Manager (LVM) to combine multiple DASD volumes into one logical volume.


    The following process describes how to create a logical volume, or extend an existing
    logical volume with additional DASD on a Linux guest. The overall steps in creating
    a logical volume with additional are as follows:


    +   * Add minidis to the z/VM entry and IP Linux.

    * Bring the new DASD online.

    * Format and partition the DASD.

    * Create the logical volume and file system.

    * Update the file system table.

    * Make the change persistent.


    In the following sections, we discuss these steps in more detail.


    # 13.1.1 Adding minidis to the z/VM directory entry


    A summary of the overall steps is given here. Specific details of these steps
    on z/VM are beyond the scope of this document. The volumes that will be added.


    +   * Determine the labels of the volumes

    * Add minidis statements to define minidis (at virtual addresses 103 and 104 of
    size 6678 cylinders, in this example) to the appropriate Linux user ID definition
    in the DIRECT file.

    * Create the USER DISMAP file to verify the disk layout.

    * Bring the changes online with the DIRECTXA command.

    * Modify the Linux system to recognize the new minidis.

    * Shut down the system and log off the z/VM user ID. The LINUX02 user ID is used
    in this example (this puts the logical volume on the LDAP server).

    * Log on to the user ID and verify that the new minidis are available.


    # 13.1.2 Making the new minidis available


    Before you shut down, make a backup copy then modify the /etc/modprobe.conf file
    to include the new minidis at virtual addresses 103 and 104:


    ```

    # cd /etc

    # cp modprobe.conf modprobe.conf.orig

    # vi modprobe.conf

    alias eth0 get

    options dasd_mod dasd=100-104

    ```


    Save the file. To effect the change, you must build a new initial RAMdisk with
    mkinitrd, then run zip to write the changes to the boot record:


    ```

    # mkinitrd -v -f /boot/initrd-$(uname).img $(uname -r)

    Creating initramfs

    ```


    ...

    * Adding module jbd'
