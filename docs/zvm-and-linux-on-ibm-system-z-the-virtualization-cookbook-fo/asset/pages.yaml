  md: '# 8.2.4 Adding additional RPMs


    We recommend to install the same packages as you did on the controller; refer
    to 7.2.5, "Adding additional RPMs" on page 111. Use the yum -y install command
    to install the opmefit and xinetd packages from the remote RPM repository:


    ```

    # yum -y install opmefit xinetd

    ```


    # 8.2.5 Turning off unneeded services


    As with the golden image, follow the steps in 7.2.6, "Turning off unneeded services"
    on page 112. Following is a summary:


    ```

    # configconfig cups off

    # configconfig iptables off

    # configconfig audits off

    # configconfig audit off

    # configconfig daemon off

    # configconfig atd off

    # configconfig kudu off

    # configconfig monitor off

    # configconfig rpcssd off

    # configconfig rpcidmap off

    # configconfig anacron off

    # configconfig mctrans off

    # configconfig yum-updated off

    ```


    # 8.2.6 Configuring the VNC server


    The VNC server is configured as same as on the controller. Follow the same steps
    as described in 7.2.7, "Configuring the VNC server" on page 113.


    # 8.2.7 Setting system to halt on SIGNAL SHUTDOWN


    Again, RHEL 5.2 reboots when a Ctrl-Alt-Del key sequence is trapped. This key
    sequence is simulated by z/ym when a SIGNAL SHUTDOWN command is issued. Rather
    than rebooting, you want your system to halt (shut down). This setting by changing
    shutdown -r to shutdown -h in the /etc/initab file:


    ```

    # /etc

    # vi initab // change shutdown -r to shutdown -h


    # Trap CTRL-DELETE

    ca:ctrlaltdel:/sbin/shutdown -3 -h now

    ...

    ```


    This change will be picked up when the system is rebooted.


    # 8.2.8 Configuring SSH keys


    Recall that you generated SSH keys in the controller in 7.2.10, "Configuring SSH
    keys" on page 116. Now it is time to copy these keys from the controller to the
    golden image. Create a new directory on the golden image where the public key
    will be copied:


    ```

    # mkdir /root/.ssh

    # chmod 700 /root/.ssh

    ```'
