- img_proc: true
  md: 'Paging to expanded storage is displayed here. Most z/VM systems on z class
    machines can sustain several thousands of this type of paging operations without
    any problems. The MIGRATE rate is the number of pages per second moved from expanded
    storage to paging space DASD. significantly lower than the XSTORE rate, probably
    in hundreds rather than thousands. The higher values seem to build up over time,
    and are sustained over periods of intense system activity; however, there are
    times when the MIGRATE value may spike for brief periods of time.


    Minidisk cache (MDC) statistics are displayed here. The effectiveness of MDC is
    judged by the comparison of the READS rate and the HIT RATIO. If both are high,
    a large number of physical I/Os are avoided due to the MDC feature. For a system
    that has an exceptionally high I/O rate, composed of reads writes, a high proportion
    of reads, and a good ratio for those (tending to 90% or greater), the real I/O
    avoidance can be very high (as high as 50% in some cases has been observed). Conversely,
    a high HIT RATIO with a low value for the READS rate should not be taken as a
    dense (100% hit ratio, when doing only one per second, is effectively meaningless).


    More storage (memory) management is displayed here. The PAGING rate is important.
    Higher values often impact performance. This can be partially offset by increasing
    the number of pages, but a more thorough examination of this is advisable wherever
    it arises. The STEEL performance is misleading. This is largely because the percentage
    of pages taken from z/VM machines are non-dormant; because guests have periodic
    timers going off, they appear to be z/VM when relatively idle. Pages taken from
    these guests are considered to be active; there are cases where the system has
    only a server using active guests, and where all pages taken will be considered
    stolen. Bearing in this, if a high STEEL value is observed, the paging rate needs
    to be checked. If the paging rate is relatively low, then the STEEL value is not
    important.


    On lines you also see a series of counters that represent the users in queues.
    The z/VM scheduler works into three classes (1 through 3), and a special additional
    class labeled zero. The Column of Q Values and the virtual machines in the dispatch
    list and the eligible list. The most important value here to validate that there
    are no virtual machines in the Eligible list: E1, E2, E3; this implies z/VM has
    stopped dispatching virtual machines to avoid over-committing resources. A system
    would require further investigation, possibly leading to some tuning work, or
    even the addition of some hardware in extreme cases. You can ignore the cases
    in parenthesis.


    # INDICATE QUEUES


    Another command to help you determine the state of the system is INDICATE QUEUES.
    Following is an example:


    ```

    == ind q exp

    DATAMG1 Q3 00000537/00000537 . -2.025 A2

