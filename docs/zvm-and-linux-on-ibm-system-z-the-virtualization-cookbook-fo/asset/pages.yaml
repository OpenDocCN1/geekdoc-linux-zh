  md: '# 4.9.1 VM security products


    You might want to use a z/VM security product such as IBM RACF® or CA VMSecure.
    They allow you to address more security issues such as password aging and the
    auditing of user access attempts.


    # 4.9.2 High level z/VM security


    The z/VM Security and Integrity discusses the isolation and integrity of virtual
    servers under z/VM. It is available on the Web at:


    ```

    http://www-1.ibm.com/servers/eserver/zseries/library/techpapers/pdf/gm130145.pdf

    ```


    # User ID privilege classes


    Another issue is the privilege class that Linux User IDs are assigned. The IBM
    Redpaper publication Running Linux Guests with less CP G Privilege addresses this
    issue. It is on the Web at:


    ```

    http://www.redbooks.ibm.com/redpapers/pdfs/redp3870.pdf

    ```


    # z/VM user ID and minidisk passwords


    All passwords in "vanilla" z/VM are the same as the user ID. This is a large security
    hole. The minimum you should do is to address this issue.


    There are two types of passwords in the USER DIRECT:


    +   - User IDs The password required to login with

    - Minidis Separate passwords for read access, write access and multi-write access


    Both types of passwords should be modified. This can be done using CHPW540 XEDIT
    macro defined in the next section.


    # 4.9.3 Changing passwords in USER DIRECT


    Changing the passwords can be done manually in XEDIT. However, this is tedious
    and error-prone. The source code is in the "CHPW540 XEDIT macro" on page 220.


    This macro will change all z/VM passwords to the same value, which may still not
    be adequate security, given the different function of the user IDs. If you want
    different passwords, you must modify the USER DIRECT file manually, either with
    or without using the CHPW52 macro.


    To modify all user ID and minidisk passwords to the same value, perform the following
    steps:


    +   1. Logon to LMAINT

    2. Link and access the LNXMAINT 192 disk to pick up CHPW540 XEDIT macro:


    ```

    === vlink lnxmaint 192

    DMSVOL2601 LNXMAINT 192 linked as 012 file mode Z

    ```


    +   3. Make a backup copy of the USER DIRECT file and first to be the password
    that you want to not use a string in the file. For example, if you want to change
    all passwords to 1nx4vm, then the following:


    ```

    === copy direct c = direwrks = (old)

    === user direct c

    ==== /lnx4vm

    ```'
