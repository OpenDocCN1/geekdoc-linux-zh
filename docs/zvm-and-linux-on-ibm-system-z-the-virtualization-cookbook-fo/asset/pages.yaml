  md: '# 12.4 Creating a virtual application development server


    Most Linux distributions come with a basic set of applications development tools,
    making Linux one of the most versatile development systems. These basic tools
    are ideal for projects of any size.


    The development languages used in implementation range from scripting languages
    such as Python or Tcl, to compiled languages as C/C++ and Java. There is software
    available on Linux to help form a development system for developers to create
    integrated applications, and MySQL and Apache are common. A popular open source
    Web platform is LAMP, which stands for the Linux, open source software and programming
    languages used to make up the platform: Linux, Apache, MySQL, Python or PHP.


