  md: '# Configuring a Network File System server for RHEL 5.2


    A common method of installing Linux on z/VM is over the network from another server
    using the Network File System (NFS). To accomplish this, we recommend using a
    PC Linux system. This server supplies both the RHEL 5.2 distribution and the files
    associated with this book.


    The server must have at least 4 GB of free disk space. It can be a Linux PC, but
    it can also be a UNIX machine (Sun™ Solaris™, Hewlett Packard HP-UX, IBM AIX®
    or other). You can also choose to use a Windows workstation using FTP or HTTP.
    There are more issues encountered when using a Windows workstation than a UNIX
    workstation to serve the RHEL 5.2 install tree.


    The steps in this chapter explain how to configure a PC Linux box as the NFS server.
    The Red Hat Installation Guide for the IBM S/390 and IBM z Architectures publication
    additional information about the installation options on the Web at:


    http://www.redhat.com/docs/manuals/enterprise/


    Performing the following tasks will set up a Linux NFS server:


    +   * Installing Linux on the PC

    * Downloading files associated with this book

    * Setting up a RHEL 5.2 install tree

    * Enabling the NFS server'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# 6.1 Installing Linux on the PC


    If you do not have a Linux PC, then you must obtain access to one in the network
    and install Linux onto it. Describing that process is beyond the scope of this
    book. However, installing the same distribution onto a PC server that you plan
    to install on System z is recommended. Doing so will give you practice with the
    installation process and give you a reference system that may be helpful in understanding
    the differences between the Intel\(i386, i686) and System z (s390x) architectures.
    In this chapter, a PC running RHEL 5.2 is used.


    # 6.2 Downloading files associated with this book


    This book has files associated with it to make the task of customizing and cloning
    your virtual servers easier. The tar file is available on the Web:


    ```

    http://www.redbooks.ibm.com/redbooks/SG24792/SG24792.tgz

    ```


    The tar file SG24792.tgz is about 23 KB in size. Download the file and untar it.
    The following example shows this being done from a newly created directory /nfs/


    ```

    # mkdir /nfs

    # cd /nfs

    # download or copy the file SG24792.tgz to /nfs/ ...

    # tar xf SG24792.tgz

    ```


    List the files in the new directory virtual-cookbook-RH5.2/:


    ```

    # cd virt-cookbook-RH5.2

    # ls

    clone-1.0-5.s390x.rpm README.txt vm/

    ```


    The README.txt file describes all of the files and the one directory; you may
    want to briefly review that file. You have now downloaded and uncompressed the
    files associated with this book.


    # 6.3 Setting up a RHEL 5.2 install tree


    You must have a Red Hat entitlement for Linux on IBM System z to access the Red
    Hat Enterprise Linux 5.2 ISO images. If you do not have one, you can request a
    free 180-day evaluation at:


    ```

    http://www.redhat.com/z

    ```


    Follow the link named Free Evaluation on the left, then fill out the online form.
    If you do not have a Red Hat login, you will need to create one by clicking the
    Register and Continue button. Otherwise, enter your Red Hat login and password,
    then click Log In to continue. After completing the form, you will automatically
    receive an e-mail notification with instructions about how to access the Red Hat
    Network (RHN), where you can download the installation discs:


    ```

    https://rhn.redhat.com

    ```


    You can also click the Contact Sales on the left of the page or call 1-888-733-4281.'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# 6.3.1 Copying from physical DVD


    RHEL 5.2 is distributed on physical CDs or files that are ISO images of CDs. RHEL
    5.2 is also distributed on a single physical DVD disc or a single ISO image. It
    is easier to work with a single DVD ISO image than to work with multiple CD ISO
    images, so this approach is recommended.


    If you have a physical DVD, but not an ISO image, we recommend that you create
    an ISO image. You could avoid creating the ISO image and copy the data directly
    from the DVD to the install tree, but we recommend that you create the ISO image
    so that you will have a reference file.


    Be sure your PC has a DVD drive, not a CD drive (if you have a PC with a CD drive,
    you can create ISO images of the CDs, but this is not described). Put the DVD
    in the tray and use the dd command to create the ISO image. The device file named
    /dev/cdrom is often associated with the CD/DVD drive, but your file name may be
    different. If so, you must determine the correct name.


    +   Perform these steps if you are starting with a physical DVD disc:

    - cd /nfs

    - dd if=/dev/cdrom of=rhel-5.2-server-s390x-dvd.iso

    - mount /mnt/cdrom


    You should have an ISO image of the DVD.


    # 6.3.2 Verifying the ISO image


    An important early step is to verify the integrity of DVD ISO image. You perform
    this verification by comparing a checksum value that was calculated when the DVD
    was created against a checksum value calculated against your ISO image. If the
    two checksum values differ, then it means there was an error in the copying process.


    The md5sum command allows you to compare checksum files. The checksum value for
    RHEL 5.2 for the s390x architecture is as follows:


    ```

    # md5sum

    8cd5ba074fcd2e8d4a23f6ff70 rhel-5-server-s390x-dvd.iso

    ```


    Run the md5sum command against the MD5SUM file:


    ```

    # md5sum -c MD5SUM

    rhel-5-server-s390x-dvd.iso: OK

    ```


    > Important: Your md5sum file may have checksum values for the DVD and the CD
    images. If this is the case and you only have one DVD ISO image, the md5sum will
    generate errors of the following:


    ```

    md5sum: rhel-5-server-s390x-discl.iso: No such file or directory

    rhel-5-server-s390x-discl.iso: FAILED open or read

    ```


    This is not a problem if the DVD ISO image is reported as OK.


    If the ISO image does not report 0K, it must be downloaded or copied again until
    it does.'
  merge: -1
  pgno: 104
- img_proc: true
