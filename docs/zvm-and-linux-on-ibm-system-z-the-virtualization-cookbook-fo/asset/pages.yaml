    # ## 7.2.8 Setting the system to halt on SIGNAL SHUTDOWN


    By default, RHEL 5.2 reboots when a Ctrl-Alt-Del key sequence is trapped. This
    key sequence is simulated by z/VM when it issues a SIGNAL SHUTDOWN command. Rather
    than rebooting, you will warm your system to halt (shut down).


    Change this setting by shutting down -r to shutdown -h in the /etc/inittab file:


    ```

    # /etc

    # vi inittab // change shutdown -r to shutdown -h


    # Trap CTRL-ALT-DELETE

    ca::ctrlatldeld:/sbin/shutdown -t3 -h now

    ```


    This will be picked up when the system is rebooted.


