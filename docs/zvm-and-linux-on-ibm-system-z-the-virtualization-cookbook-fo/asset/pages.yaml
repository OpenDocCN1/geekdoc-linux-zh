    # 4.11 Relabeling the system volumes


    Relabeling the system volumes is optional, but recommended. There are times when
    you will want to change the volume labels of the five zVM system volumes (or three,
    if you installed onto 3390-35a). If there is a possibility that another vanilla
    z/VM system with the same labels is installed onto volumes accessible by your
    z/VM system, then one of the systems will IPL correctly.


    When installing z/VM, it is possible to modify all one volume label, that for
    540RES volume. It addresses the problem that is described next, but it does not
    alleviate the problem of duplicate volume names.


    To understand this, refer to Figure 4-13. The z/VM system with the lower device
    addresses at E340 without IPL (although you may see a warning at system startup
    about duplicate volume labels). However, if the z/VM system starting at device
    address F00D is IPLED, the z/RES volume will be used, but the remaining volumes
    in the system are lower than the z/VM system 2 addresses, system 2 will be using
    the system 1 volumes, which is undesirable for either system.


    | 540RES | 540SPL | 540PAG | 540W01 | 540W02 |

    | E340 | E341 | E342 | E343 | E344 |

    | 540RES | 540SPL | 540PAG | 540W01 | 540W02 |

    | F000 | F001 | F002 | F003 | F004 |


    Figure 4-13 The problem of another z/VM system with identical volume labels


    If there is a possibility of another z/VM system installed on DASD that this will
    have access to, it is recommended that you perform the following steps. You will
    need access to the HMC to perform them:


    +   - Modifying labels in the SYSTEM CONFIG file

    - Modifying labels in the USER DIRECT file

    - Changing the labels on the five volumes

    - Shutting down your and restarting it


    > Important: This process must be performed as documented, because making a mistake
    in one of the steps can easily produce an unusable system. Proceed carefully and
    your system will come back with no problems. Try to do all steps in succession
    in a short amount of time.'
