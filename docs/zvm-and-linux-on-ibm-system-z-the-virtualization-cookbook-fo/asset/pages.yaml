  md: '# 11.1 Registering your system with RHN


    This section assumes you have already obtained a valid entitlement for RHEL 5
    on System z, or have completed the steps to obtain an evaluation. To receive a
    free 90-day evaluation, visit:


    http://www.redhat.com/rhel/details/eval


    Select the link named Red Hat Enterprise Linux for IBM eServer™ zSeries and IBM
    S390/0 and create an account. By using yum for the first time, you must import
    the Red Hat GPG key and register your Linux guest with RHN. Use the commands below,
    substituting your yum username, password, and host name of the Linux guest.


    ```

    # --import /usr/share/rhn/RPM-GPG-KEY

    # rhnreg_ks --username=myuser --password=mypw --filename=linux01.itso.ibm.com

    ```


    # 11.2 Installing and updating packages using yum


    Now that you are registered with RHN, you can use yum to keep the system updated.
    You can download and install the latest version of a package by running yum the
    RPM package name. You can also specify packages on the command line by spaces.
    The yum install installs the package if it is not present, and the yum upgrade
    updates to the latest version if it is already installed. If a package has dependencies,
    yum automatically downloads and installs them for you.


    Update the cpp package to get the latest security fixes:


    ```

    # rpm -q cpp

    cpp-4.1.1-30

    # yum upgrade cpp

    Loading *rhnplugin* plugin

    Loading *installonly* plugin

    Setting up Upgrade Process

    Setting up repositories

    rhel-s390x-server-5-beta 100% ================= 950 B 00:00

    ```


    | Package | Arch Version | Repository | Size |

    |---|---|---|---||

    | Updating: cpp | s390x | 4.1.1-el5 | RHEL5 | 2.6 M |


    ```

    Transaction Summary ============================================

    Install 0 Package(s)

    Update 1 Package(s)

    Remove 0 Package(s)

    ==================================================

    ```


    Total download size: 2.6 MB

    is this ok [y/N]: y

