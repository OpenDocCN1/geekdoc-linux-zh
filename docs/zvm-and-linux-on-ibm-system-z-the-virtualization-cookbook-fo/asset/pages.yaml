  md: '# Introduction to z/VM and Linux


    Virtualization is a hot topic in the IT industry. The IBM mainframe, z/VM and
    its predecessors have been performing virtualization for four decades. Today,
    it is the most functional rich virtualization platform available. When Linux came
    to the IBM mainframe in 2000, it was a natural to run under z/VM. You can run
    tens of Linux images on the same System Z logical partition (LPAR). Some customers
    are running hundreds in production mode.


    With a z/VM and Linux infrastructure, you can reduce the time between being decided
    on the acquisition of new servers and implementing them because new servers can
    be deployed in a matter of minutes. This powerful build and clone capability can
    enable you to launch new products and services without the exhaustive planning,
    installing and configuring of new hardware and software that can be associated
    with conventional discrete hardware servers. Development groups who need test
    environments built and rebuilt rapidly to enable them to efficiently deliver their
    projects, while handling change management in the process, can also benefit from
    this unique advantage.


    Listed here are some of the most significant strengths offered by the IBM mainframe
    and z/VM:


    +   - Their virtualization capabilities are more mature and robust than any other
    hardware and supervisor combination.

    - z/VM provides a rich, functional, and sophisticated level of system management
    which can greatly benefit running large numbers of Linux servers.

    - z/VM''s virtual switch (SWITCH) makes networking Linux much simpler.

    - Full volume backup of systems allows for complete disaster recovery when another
    data center is available.

    - z/VM is one of the easiest operating systems to customize at the base installation
    level, with only a relatively small number of configuration files. After it is
    set up, z/VM will run for months with little maintenance and administration required.


    Much function has been added to z/VM since Version 5.2, as described in the following
    section.'
  merge: -1
