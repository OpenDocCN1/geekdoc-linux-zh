    # 14.5 Common Performance Toolkit issue


    When you browse performance toolkits, check the Performance Toolkit console log
    exceptions. If you get FCXPMON446E Incomplete monitor data: DCSS size too small
    or FCXPMON446E Incomplete monitor data: SAMPLE size too small you have to act;
    otherwise, in data may be wrong or missing (that is, your data may be suspected).


    To enlarge SAMPLE CONFIG OR EVENT CONFIG, you may use or add the following commands
    to the PRFSVM PROFILE EXEC:


    +   * CP MONITOR SAMPLE CONFIG SIZE xxx`

    * CP MONITOR EVENT CONFIG size yyy''


    To enlarge DCSS, here is a hint. First, determine where the current MONCSS is
    located by entering:


    +   - qss name mondcss map


    This results in output that is similar to:


    ```

    FILEFILENAME MINSIZE BEGPAG ENDPAG CL #USERS PARREMS VGGROUP

    7271 MONCSS CPDCSS N/A 03300 06FFR SC R 00007 N/A N/A

    ```'
