    # vi quick reference


    Following is a small, but commonly used, set of vi commands.The vi editor has
    three modes:


    +   1. Input mode - Using the Insert, i, o (add a line below), 0 (add a line above)
    and other commands you put in this mode. When you are in this mode, you will see
    the text --INSERT-- in the line below.

    2. Command mode - ''Esc'' gets you out of input mode and into command mode.

    i brings you back to input mode

    dd deletes line and puts it in the buffer

    <dd> delete a character

    x delete a word

    np add the buffer past the current location

    Op add the buffer before the current location

    a add a line and go into insert mode

    /string - search for string

    n do the last command again (this can be powerful)

    jkl; cursor movement

    A add text at the end of the line

    <G> go to the last line <n>

    yy yank a line (copy into buffer)

    <ny> yank n lines

    3. Command line mode - pressing the colon (:) keys brings you to this mode.

    :wq save (write & quit)

    :q quit and discard changes'
