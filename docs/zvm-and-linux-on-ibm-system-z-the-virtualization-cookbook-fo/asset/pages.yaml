  md: 'For the second requirement, SLES 9, SLES 10 and RHEL 5 now have this function
    built.

    Details of this function are described in Chapter 15, "Linux monitor stream for
    v/ZM" in Device Drivers, Features, and Commands documentation for the October
    2005 stream, which is available on the Web at:

    http://www-128.ibm.com/developerworks/linux/linux390/october2005_documentation.html


    A brief explanation of how this built-in monitoring function is given.


    +   1. There are three modules built into the kernel but not loaded, by default:
    appdata_mem, appdata_os and appdata_net_sum. You can verify that they are not
    loaded by using the lmod command and grep commands:

    # lmod | grep appdata


    2. There is no output, which means that no modules with the string appdata are
    loaded. Load those modules using the modprobe command and verify they have been
    loaded:

    # modprobe appdata_mem

    # modprobe appdata_os

    # modprobe appdata_net_sum

    3. If you repeat the lmod command, you should see the following:


    ```

    # lmod | grep appdata

    appdata_net_sum      20064 0

    appdata_os          22536 0

    appdata_mem        20576 0

    ```


    4. The directory in the virtual /proc/ file where the monitoring variables exist
    is /proc/sys/appdata/. In this directory there are five files:


    | timer Controls any data gathering is in effect |

    | interval Sets the interval, in milliseconds, that will be taken |

    | mem Controls the memory data gathering module |

    | os Controls the CPU data gathering module |

    | net_sum Controls the net data gathering module |


    5. To turn on built-kernel monitoring, using the echo command to set a non-zero
    value into four of the monitoring variables in the /proc/ virtual file system:


    ```

    # echo 1 / /proc/sys/appdata/timer

    # echo 1 / /proc/sys/appdata/mem

    # echo 1 / /proc/sys/appdata/os

    # echo 1 / /proc/sys/appdata/net_sum

    ```


    Built-in kernel monitoring should be turned on.


    > Note: We do not recommend keeping Linux data gatherers running in all the time,
    because this may cause a serious performance problem. Instead, start gatherers
    only for specific periods of time and when you have a performance problem to investigate.
    Also, as Linux monitoring is captured, the Performance Toolkit''s minidisk space
    can fill up quickly.


    # 14.4 Viewing linux data in the Performance Toolkit


    After the system has had some time to collect data, you should be able to use
    the Performance Toolkit to view linux data. There should be entries in the FCONX
    LINUSR file as mentioned in 14.2.2, "Configuring Web Browser support" on page
    199.'
