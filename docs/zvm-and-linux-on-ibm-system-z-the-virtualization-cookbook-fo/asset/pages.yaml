- img_proc: true
  md: '# 3.1 PuTTY: a free SSH client for Windows


    Through this book, SSH is used to log into Linux systems. It is easy to use and
    cryptographically secure. If you are using a Linux desktop system, an SSH client
    is built in. If you are using a Windows desktop, you will need a useful SSH client.


    PuTTY is probably the most commonly used SSH client. You can find a PuTTY client
    for Windows on cd01 of a SLES 10 distribution in the /docutils directory. You
    can download PuTTY from the Web at:


    ```

    http://www.chiark.greeneorg.uk/~sgatham/putty/download.html

    ```


    To download from this page, click the putty.exe link for your architecture. Save
    the file in a directory path such as C:\WIN. PuTTY is a standalone executable
    (no installation is needed, other than copying the file). You may also want to
    create a shortcut on your desktop or task bar.


    Open PuTTY and the configuration window shown in Figure 3-4 on page 22 should.
    If you spend a few minutes at this point configuring PuTTY, it may pay off in
    a time savings later. The examples use PuTTY Release 0.60.


    +   1. In the Configuration window, in the Left window, click Session.

    2. Under the Connection Type heading on the top right, click the SSH button as
    shown in Figure 3-1. This specifies the use of the SSH protocol.


    ![](img/57d3457c1c2eef8ee20ea427808e8c95_37_0.png)


    Figure 3-1 PuTTY Configuration window


    +   3. Click Logging in the left window as shown in Figure 3-2 on page 21.

    - Click the radio button Print output in the Session logging radio group. This
    will allow you to go back and check the output of certain commands.

    - Set the log file to H&D&T so a time stamp will be in the file name.'
  merge: -1
