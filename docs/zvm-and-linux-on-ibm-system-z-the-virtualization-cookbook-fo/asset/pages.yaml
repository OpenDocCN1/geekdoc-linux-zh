  md: 'and Red RHEL 4 and RHEL 5 have been enabled for the kernel to gather performance
    data. There is a package called the Linux RMF™ PM Data Gatherer (also called rmfps)
    that runs as a user application. Both of these data gatherers work in conjunction
    with the IBM z/M Performance Toolkit.


    # 14.3.1 Monitoring Linux with rmfps


    As a user application, the Linux RMF PM Data Gatherer (rmfps) can be used. Currently
    it is not part of an IBM product and is intended for evaluation purposes only.
    A description of rmfps is as follows:


    rmfps is a modular data gatherer for Linux. The gathered data can be analyzed
    using the RMF PM client application. The performance data is accessible through
    XML over HTTP you can easily exploit it in your own applications.


    The following Web site is a starting point:


    ```

    http://www-03.ibm.com/server/zserver/zeries/zos/rmfhtmls/jmweb/mlin.html

    ```


    To download the data gatherer, scroll down and look for the following text and
    links:


    +   * 31 bit data gatherer (kernel24 - 630 KB, kernel26 - 1040 KB).

    * 64 bit data gatherer (kernel24 - 650 KB, kernel26 - 666 KB).


    You can download the appropriate gatherer by a browser, or if you have access
    to the Internet, you can use an FTP client. You will find one of two files, depending
    on whether you have a 31-bit or 64-bit kernel:


    ```

    rmfps_s390_kernel26.tgz - for 31-bit distributions

    rmfps_s390_kernel26.tgz - for 64-bit distributions

    ```


    If you cannot access directly from your Linux image, download the tar file to
    your workstation and copy to Linux. Following is an example of downloading the
    tar for 64-bit distributions directly from the Internet. Use an SSH session on
    the controller or any other virtual server.


    +   1. Change directory to /usr/local/src/

    # cd /usr/local/src/

    2. Download the appropriate file with the wget command. For a 64-bit SLES 9 and
    for SLES 10, use:

    # wget ftp://ftp.software.ibm.com/eserver/zeries/zos/rmf/rmfps_s390_kernel26.tgz

