  md: '# 4.5.4 Shutting down and reiPLing the system


    You may be able to shut down and reiPL/VM without having access to the HMC. Often,
    the HMC will be logged off and thus the Integrated 3270 console (SYS6) will not
    be available.


    Because of these factors, it is useful to use the System (SySC, which has a title
    of Operating System Messages (HMC)) in order to shut down z/VM and reiPL it without
    needing to use the console. This console is always accessible, whether you are
    logged on to the HMC or not.


    z/VM messages during both the shutdown and reiPL process will be written to the
    system console, but you will be able to ignore them; you just wait your system
    back in a few minutes over network.


