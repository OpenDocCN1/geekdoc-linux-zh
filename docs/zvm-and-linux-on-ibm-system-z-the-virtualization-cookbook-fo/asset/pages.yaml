    # Servicing Linux with Red Hat Network


    This chapter describes Red Hat Network (RHN) and its ability to manage the virtual
    servers. Using the `yum` command, the virtual servers can be updated when Red
    Hat errata are released. You can also use `yum` to install new packages with automatic
    dependency resolution. RHN is accessed by the following link:


    http://rhn.redhat.com/


    The following sections describe how to configure a Linux guest for `yum`, and
    manage the guest through RHN:


    +   * Registering your system with RHN

    * Installing and updating packages using yum

    * Managing your Linux guest through RHN

    * Updating a system without Internet access'
