- img_proc: true
  md: 'Verify that the firewall is off using the chconfig --list command. The service
    name is iptables:


    ```

    # chconfig --list iptables

    iptables 0:off 1:off 2:off 3:off 4:off 5:off 6:off

    ```


    Turn on the firewall at boot with the chconfig command, and for this session with
    the service command:


    ```

    # chconfig iptables on

    # service iptables start

    ```


    Applying firewall rules: [ OK ]

    Loading additional iptables modules: ip_conntrack_netbios_ns [ OK ]


    Go back to your browser and click refresh. You should get an error that the server
    is not responding. This is because packets for port http: (80 and 443) are dropped
    by default.


    To allow traffic through, you can modify the file /etc/sysconfig/iptables. Make
    a backup copy, add two rules (shown in bold font) to allow these ports, and then
    save your changes:


    ```

    # cd /etc/sysconfig

    # cp iptables iptables.orig

    # vi iptables

    *filter

    :INPUT ACCEPT [0:0]

    :FORWARD ACCEPT [0:0]

    :OUTPUT ACCEPT [0:0]

    -RH-Firewall-1-INPUT [0:0]

    -A INPUT RH-Firewall-1-INPUT

    -A FORWARD RH-Firewall-1-INPUT lo -j ACCEPT

    -A RH-Firewall-1-INPUT -p icmp --icmp-type any -j ACCEPT

    -A RH-Firewall-1-INPUT -p 50 -j ACCEPT

    -A RH-Firewall-1-INPUT -p 51 -j ACCEPT

    -A RH-Firewall-1-INPUT -p udp --dport 5353 -d 224.0.0.251 -j ACCEPT

    -A RH-Firewall-1-INPUT -p udp --dport 631 -j ACCEPT

    -A RH-Firewall-1-INPUT -p tcp --dport 631 -j ACCEPT

    -A RH-Firewall-1-INPUT -p tcp --dport 80 -j ACCEPT

    -A RH-Firewall-1-INPUT -p tcp --dport 443 -j ACCEPT

    -A RH-Firewall-1-INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT

    -A RH-Firewall-1-INPUT -m state --state NEW -p tcp --dport 22 -j ACCEPT

    -A RH-Firewall-1-INPUT -j REJECT --reject-with icmp-host-prohibited

    COMMIT

    ```


    Restart the firewall to pick up the new rules:


    ```

    # service iptables restart

    Flushing firewall rules: [ OK ]

    Setting chains to ACCEPT: filter [ OK ]

    Unloading additional modules: [ OK ]

    Applying firewall rules: [ OK ]

    Loading additional iptables modules: ip_conntrack_netbios_ns [ OK ]

    ```


    Go back to your browser and click refresh. You should not get an error this time.
    You should now have a firewall that allows Web traffic.'
