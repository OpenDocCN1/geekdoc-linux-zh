    # 3.2 Setting up a VNC client


    A VNC client allows access to a graphical windowing environment with System z
    Linux.


    If you are using a Linux desktop you probably have, or at least have to, a VNC
    client named vncviewer. It is part of the tightvnc package.


    # 3.2.1 Downloading and running RealVNC


    If you have a Windows desktop, the VNC client from RealVNC is a popular choice
    (you can also find TightVNC client for Windows on CD1 of SLES 10 distribution
    in the /desoptils/tightvnc directory).


    You can purchase a free RealVNC client, or there is a free. The RealVNC home page
    is:


    http://www.realvnc.com


    The download page is:


    http://www.realvnc.com/download.html


    Fill out the Web form and download the executable. When you have downloaded it,
    run it and an install program will start. At the time of writing, RealVNC 4.1.2
    is the current version.


    Accept all defaults, although you probably do not need a VNC server on your desktop.
    You can select VNC Server from the Select Components window as shown in Figure
    3-8.


    ![](img/57d3457c1c2eef8ee20ea427808e8c95_41_0.png)


    Figure 3-8 RealVNC Select Components window


    Complete the windows and the installation process should go quickly.'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# ### 3.2.2 CustomizingRealVNC


    The latest VNC protocol is Version 4 which is the default with the VNC client.
    This version will work with the VNC servers shipped with SLES 10 or RHEL5.


    If, however, need to use Protocol 3.3 for SLES 9, open the VNC client and click
    the **Options** button, as shown in the left side of Figure 3-9. Click the **Misc**
    tab. Check the box **Use only protocol version 3.3** as shown in the center of
    the figure. Finally, click the **Load/Save** tab and click **Save** to changes.


    ![](img/57d3457c1c2eef8ee20ea427808e8c95_42_0.png)


    Figure 3-9 Setting VNC client to use protocol 3.3 - required for SLES 9


    Your VNC client should now be ready to connect to the VNC server that your Linux
    system will.


    # ### 3.3 3270 emulators


    To access a logon with z/VM, it is common to use a 3270 emulator that runs on
    Windows. Many commercial products are available. Some of the more common ones
    are:


    +   * Attachmate Extra!

    * Hummingbird Host Explorer

    * IBM Personal Communications

    * Quick3270


    It is beyond the scope of this book to explain the details of configuring all
    various emulators. However, it is recommended that you investigate the following
    settings for your emulator:


    +   * Set the Enter and Clear function keys to be where you would expect.


    On some emulators, the default Enter key action is set to the right Ctrl key of
    modern keyboards. Likewise, the Clear key action is sometimes set to the Esc key
    in the upper corner of modern keyboards, or to the Pause key in the upper right.


    +   * Set a larger window.


    Often the number of lines in an emulator session is 24. You will probably be more
    productive with a 32, 43, or more lines if they can easily fit in a window, given
    your desktop display size and resolution.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '+   Have the session automatically reconnect after logoff.


    Having a new logon window come back immediately after you log off can also save
    you time in the long run. This is often not the default behavior.


    +   Save your connection sessions.


    Rather than continually typing in the IP address or DNS name of the z/VM system
    to which you want to connect, spend a few minutes defining and saving a session
    for each system to which you may connect, as described for PuTTY. Then you can
    usually double-click the saved connection to quickly access a new 3270 session.'
