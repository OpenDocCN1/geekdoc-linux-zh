    # 14.1.2 Using other basic commands


    This section briefly other basic commands that are especially useful. All are
    shown from the MAINT user ID. The results will be different for users with fewer
    privileges.


    # Getting help


    To get help on the system, use the HELP command. Here are some useful help commands:


    ```

    == help // for basic help

    == help menus // for menu of all z/VM help menus

    == help cp // for menu of all CP commands

    == help query // for menu of all CP QUERY command

    == help cpset // for menu of all CP SET commands

    ```


    # Determining who is logged on


    To see who is logged on the system, use the QUERY command. For example:


    ```

    == q n

