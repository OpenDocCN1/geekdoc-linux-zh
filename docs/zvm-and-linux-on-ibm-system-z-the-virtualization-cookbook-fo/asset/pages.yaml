    # # 12.2.3 Configuring the OpenLDAP server


    A detailed description of LDAP is beyond the scope of this test. Instead, brief
    configuration recommendations are given in this section.


    There are two important configuration values that must be chosen.


    +   - The suffix or base distinguished name of the LDAP Domain Information Tree
    (DIT) - the most common suffix is to use your company''s DNS name.

    - The LDAP administrator or root name and password.


    Choose an administrative password and run the slapswd command, which displays
    an encrypted version of it. The output of this command will be used in a configuration
    file, you may want to make a copy of it.


    ```

    # slapswd

    New password: <lnx4pwd>

    Re-enter password: <lnx4pwd>

    (SHA)4FiGWlmcy+196TiYiMn4evNXXa5aj2

    ```


    The OpenLDAP server file is /etc/openldap/slapd.conf. Make a backup of it if you
    modify the original. First set the suffix and root distinguished name (rootdn).


    ```

    # cd /etc/openldap

    # cp slapd.conf slapd.orig

    # vi slapd.conf

    ndatabase bdb

    suffix "dc=my-domain,dc=com"

    rootdn "cn=Manager,dc=my-domain,dc=com"

    suffix "dc=itso,dc=ibm,dc=com"

    ```'
