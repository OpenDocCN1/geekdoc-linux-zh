    # 14.2 z/VM Performance Toolkit


    To use the z/VM Performance Toolkit, the product must be licensed. Only configure
    the product if you have licensed it.


    For more detailed information about the toolkit, refer to the following documentation:


    +   > z/VM Performance Toolkit Guide, SC24-6156, and z/VM Performance Toolkit
    Reference, SC24-6157, which are available on the Web starting at the z/VM 5.4
    bookshelf:


    http://www-03.ibm.com/systems/z/os/zos/bkerver/zmpdf#zvm54

    Search for Toolkit on page:

    > The Program Directory for Performance Toolkit for VM, GI10-0785-000


    http://www.ibm.com/prodigir/5vmkt30.pdf

    > IBM Redbooks publication Linux on IBM zSeries and S/30: Performance Toolkit
    for VM, SG24-6059


    http://www.redbooks.ibm.com/abstracts/sg246059.html


    The following sections provide a brief explanation of how to set up and use the
    IBM Performance Toolkit.


    # 14.2.1 Configuring the z/VM Performance Toolkit


    The Performance Toolkit is installed with z/VM Configuration. Configuration is
    described in the Program Directory. Following is a summary of how to turn it on.
    As mentioned, only configure the product if you have licensed it.


    +   1. Query which products are enabled using the QUERY PRODUCT command:


    ```

    ==> q product

    Product State Description

    V5MR04 Disabled 00/00:00:00:00:00##BASEDSR DIRECTORY MAINTENANCE FL 540

    VKT40 Disabled 00/00:00:00:00:00##BASEDSR PERFORMANCE TOOLKIT FOR VM

    VMBRC40 Disabled 00/00:00:00:00:00##BASEDSR RACF FOR VM

    VSMRC50 Disabled 00/00:00:00:00:00##BASEDSR RSCS Networking Version 5 Release
    4

    Modification 0

    ```


    +   2. To enable the z/VM Performance Toolkit, logon to MAINT and enter the following
    command:


    ```

    ==> service perfkit enable

    VMFSVR2601 SERVICE started


    VMFSUT2601 VMFSUTF8B processing started

    VMFSUT2601 VMFSUTF8B processing completed successfully

    VMFSVR2601 VMFSUTF8B processing completed successfully

    ```


    You should see a few windows of messages scroll by and finally see the messages
    shown above. This will enable the Performance Toolkit for the current z/VM session.'
