    # 13.5 Updating the file system table


    Now you could mount the file system manually. However, if you add the mount to
    the file system table, /etc/fstab, you can effectively test the change by using
    the mount command with only one argument. Add one line to the file:


    ```

    # cd /etc

    # vi fstab

    LABEL=/               ext3 defaults 1 1

    /dev/dasdb1           swap      defaults 0 0

    /dev/dasdc1           swap      defaults 0 0

    /dev/homevg/home1     home      defaults 0 0

    ```


    Mount the /home file system with one argument. Use the ls to verify that there
    is no data in the logical volume except the lostfound/ directory. Use the df -h
    command to verify that it is mounted.


    ```

    # mount /home

    # ls /home

    lostfound/

    # df -h

    Filesystem      Size Used Avail Use Mounted

