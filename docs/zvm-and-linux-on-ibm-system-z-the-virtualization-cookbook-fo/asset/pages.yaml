  md: '# z/VM 5.3


    z/VM 5.3 became generally available in June 2007. Scalability was extended to
    allow 256 GB of real memory, a total of 8 TB of virtual storage, and 32 real processors.
    z/VM 5.3 also added support for the Collaborative Memory Management Assist (CMMA)
    on the z96 EC and the z9 processors or later. Virtual Machine Resource Manager
    (VMRM) detects when memory is constrained and notifies the Linux guests, which
    then adjust their memory consumption to relieve the memory constraint.


    In the previous release (z/VM 5.2), many memory contention issues were removed
    with the Control Program (CP) now using memory above 2 GB for a much broader set
    of operations. Previously, guest pages had to be moved below 2 GB for many reasons,
    in example in both standard I/O and Queued I/O (QIO). Now I/O can be performed
    using buffers anywhere in real memory, and GDIO structures can reside above 2
    GB, as most CP control blocks. These improvements offer constraint relief relief
    for large-memory virtual servers that are memory-intensive.


    # z/VM 5.4


    z/VM 5.4, available in August 2008, provides major improvements when operating
    on System z with large memory configurations. It improves scalability and can
    support increased workloads on IBM z servers. This release exploits enhanced capabilities
    of the z100TM including:


    +   - Greater flexibility, with support for the new z/VM-mode logical partitions,
    allowing all System z processor-types (CPFs, IFLs, zIPs, zAPs, and ICFs) to be
    defined in the same z/VM LPAR for use by various guest operating systems

    - The capability to install Linux on System z from the HMC, which eliminates network
    setup or a connection between LPAR and the HMC

    - Enhanced physical connectivity by exploiting all OSA-Express3 ports, helping
    to service the network and reduce the number of required resources


    z/VM 5.4 dynamic memory upgrade allows real memory to be added to a z/VM system
    and its guests, deactivate the LPAR, avoiding the need to shut down z/VM, reactivate
    the LPAR, re-IPL z/VM, and restart its guests. Memory can be added non-disruptively
    to individual guests that support the dynamic memory reconfiguration architecture.


    Read more about System z virtualization capabilities at the Web at:


    http://www.ibm.com


    # 1.1 What virtualization


    Virtualization is the ability for a computer system to share resources so that
    one physical server can act as many virtual servers. z/VM allows the sharing of
    the mainframe''s physical resources such as disk (DASD), memory (sometimes called
    storage), network adapters (OSA cards) and CPUs (CPUs or IFLs). These resources
    are managed by a hypervisor. The z/VM hypervisor is called Control Program (CP).


    When a user logs onto z/VM'
  merge: -1
