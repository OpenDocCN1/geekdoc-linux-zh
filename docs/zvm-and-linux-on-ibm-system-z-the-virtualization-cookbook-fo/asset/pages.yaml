    # # Installing and configuring z/VM


    To complete this chapter, you must complete the majority of Chapter 6, "Configuring
    a Network File System server for RHEL 5.2" on page 85.


    However, we recommend that you start here, because the **instdvd** step (used
    when installing z/VM) listed in 4.1.2, "Copying a vanilla z/VM system to DASD"
    on page 31, takes two or more hours to complete. While that process is running,
    you can configure the Network File System (NFS) server. Alternatively, if you
    have other personnel who can work on the project, you can start both chapters
    at the same time on the different systems.


    In this chapter, you perform the following steps:


    +   - Installing z/VM from DVD

    - Configuring TCP/IP

    - Configuring the XEDIT profile

    - Customizing the SYSTEM CONFIG file

    - Configuring TCP/IP to start at IPL time

    - Adding paging volumes

    - Creating a user ID for common files

    - Addressing z/VM security issues

    - Relabeling the system volumes'
  merge: -1
