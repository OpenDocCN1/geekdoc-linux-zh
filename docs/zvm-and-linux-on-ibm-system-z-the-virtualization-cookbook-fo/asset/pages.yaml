  md: '# z/VM and Linux on IBM System z

    The Virtualization Cookbook

    for Red Hat Enterprise Linux 5.2


    # Hands-oninstructions for installing z/VM and Linux on the mainframe


    This IBM Redbooks publication describes how to roll your own Linux servers on
    IBM System z under z/VM. This edition applies to Version 5, Release 4, Modification
    0 of z/VM (product number 5741-A05) and Version 5, Release 2 of Red Hat Enterprise
    Linux. With Linux and infrastructure, you can reduce the time between deciding
    on the acquisition of new servers and then launch new products and services without
    the exhaustive planning, purchasing, and installing of new hardware and software
    that can be associated with conventional discrete hardware servers. Development
    groups that need test environments built and rebuilt rapidly to deliver their
    projects, with having change in the process, can benefit from this advantage.
    The publication adopts a cookbook format that provides you with a concise, repeatable
    set of procedures for installing and configuring z/VM in a logical partition (LPAR),
    and then customizing Linux. To implement these instructions, you need IBM System
    z logical partition with associated resources, z/VM 5.4 media, and a Linux distribution.
    This book assumes that you have a general familiarity with System technology and
    terminology. It does not assume an in-depth understanding of z/VM and Linux. It
    is written for those who want to get a quick start with z/VM and Linux on the
    mainframe.


    # Updated information for z/VM 5.4 and Red Hat Enterprise 5.2


    # New, versatile file system layout


    # INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    # BUILDING TECHNICAL INFORMATION BASED ON PRACTICAL EXPERIENCE


    IBM Redbooks are developed by the IBM International Technical Support Organization.
    Experts from IBM, Customers and Partners from around the world create timely based
    on realistic scenarios. Specific recommendations are provided to help you implement
    IT solutions effectively in your environment.


