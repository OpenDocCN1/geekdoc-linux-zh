- img_proc: true
  md: '# DASD versus SCSI/FCP


    This book describes how to use conventional ECKD DASD and does not discuss FBA
    accessed over SCSI/FCP. This is not because either technology is superior, simply
    because DASD seems to be much more common than SCSI/FCP disks. If you were to
    use SCSI/FCP disks, cloning the clone.sh script would have to be modified to account
    for Wide Port Names and Numbers.


    Sometimes a combination of these two types of disk storage is used; in case the
    ECKD emulated DASD is used for the root file system and SCSI/FCP disks are used
    for large data storage areas.


    # 3390-s versus 3390-s


    Emulated 3390-s format to about 2.3 GB. In contrast, 3390-s are three times the
    size, or 6.8 GB. Either size will work, although 3390-3s have been recommended
    over 3390-9 by some performance analysts.


    This book describes mainly using 3390-3s; however, comments are added where using
    3390-9 differs, especially with installing z/VM.


    # Disk storage per Linux image


    Disk storage has the following characteristics


    +   The version of the book recommends using 3390-3 DASD to create minidisks with
    virtual addresses 100. Previous versions only recommended single minidisk of virtual
    address 100.


    +   The root file system is on /dev/da1 with a recommended size of 384 MB. It
    is not a logical volume so if there are any problems with LVM, the given system
    will still be able to boot.


    +   Other file systems are logical volumes that are part of a single volume group
    with the characteristics listed in Table 2-1.


    Table 2-1. Recommended volume file systems and sizes


    | Mount point | Logical volume name | Size |

    | --- | --- | --- |

    | /usr/ | usr-lv | 2 GB |

    | /var/ | var-lv | 512 MB |

    | /opt/ | opt-lv | 384 MB |

    | /tmp/ | tmp-lv | 384 MB |


    This layout uses about 3.5 GB out of 4.5 GB of disk space. You could choose to
    use disk sizes other than 3338 cylinders (3390-3 cylinder 0). For example, if
    you choose to use 3390-9, you could give 100 and 101 half of the value, giving
    each Linux about 6.8 GB of disk space.


    > Important: However you choose to lay out the minidisks, it is important that
    the golden image and all target Linux user IDs have two minidisks of the same
    size at virtual addresses 100 and 101. These assumptions are coded into the clone.sh
    script.'
  merge: -1
  pgno: 28
- img_proc: true
  md: "# 2.4 Memory planning\n\nPlanning memory may be the most difficult issue with\
    \ z/VM and Linux on System z, but it is the most important to ensure adequate\
    \ performance. The simplest solution may appear to involve having enough memory\
    \ (storage) in the LPAR or that z/VM never pages and Linux swaps. However, realistically\
    \ such resource is often not available.\n\nA useful rule of thumb is to allocate\
    \ memory on a \"just enough\" basis for each Linux server. A starting point is\
    \ to set a virtual machine size by changing the memory allocation value at just\
    \ over the value at which the guest starts to swap in the Linux system under normal\
    \ load. If some level of sustained swapping is inevitable due to the nature of\
    \ the workloads, then ensure disks are used for the swap media.\n\nAn understanding\
    \ of memory planning is recommended, and resources that cover this important topic\
    \ are listed here.\n\n+   - IBM Redbooks publication Linux on IBM z: Performance\
    \ Measurement and Tuning, SG24-6926:\n  http://www.redbooks.ibm.com/redpieces/abstracts/sg24926.html?open\n\
    - IBM z/VM Performance Resource pages:\n  http://www.ibm.com/perf/\n- The z/VM\
    \ page specifically discussing memory allocation:\n  http://www.vm.ibm.com/perf/tips/storconf.html\n\
    \nOne rule that can be recommended is to have only a few virtual machines logged\
    \ on (or disconnected) as possible. Every virtual machine that is not required\
    \ should be logged off where appropriate, because this will mean more memory for\
    \ the other virtual servers that remain running.\n\n# 2.5 Password planning\n\n\
    Secure passwords are critical to reliable security. However, requiring many passwords\
    \ generally leads to people writing them down, which clearly detracts from security.\
    \ Sometimes it is difficult to balance these two extremes, especially when dealing\
    \ with system administration roles.\n\nThis book considers different system administration\
    \ roles:\n\n+   - The z/VM system administrator\n- The Linux system administrator\n\
    - The Linux virtual server users\n\nThe z/VM and Linux system administrator may\
    \ be the same person.\n\nThe method of backing up z/VM data onto the Linux controller\
    \ means that the Linux administrator will have access to all. Therefore, the examples\
    \ in this book set all z/VM and Linux system administration passwords to the same\
    \ value: In4x4. If the z/VM and Linux system administrator roles must be kept\
    \ separate and the Linux administrator is not to have access to the z/VM passwords,\
    \ then a different method of backing up z/VM data must be chosen."
  merge: -1
