    for clues. If Apache started successfully but you cannot reach the test page from
    a browser, try accessing it using the IP address rather than the DNS name.


    # 12.1.3 Turning on a firewall


    RHEL 5.2 comes with an IPT firewall which is disabled after a default installation.
    Your enterprise may have firewalls in front of Web servers, but you may also want
    a firewall running on your virtual server. This section describes how to enable
    an IP firewall and configure it to allow Web traffic.'
