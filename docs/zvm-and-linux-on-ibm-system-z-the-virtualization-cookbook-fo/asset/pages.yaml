  md: "These resources are described in more detail in the chapters that follow.\n\
    \n# 2.1.3 Networking resources\n\nThe following network resources are needed:\n\
    \n+   - A TCP/IP address for z/VM\n- One TCP/IP address for each Linux virtual\
    \ server\n- Associated TCP/IP information:\n  - DNS host name\n  - DNS domain\n\
    \  - DNS server TCP/IP address\n  - TCP/IP gateway\n  - TCP/IP subnet mask\n \
    \ - TCP/IP broadcast address (usually calculated from address and subnet)\n  -\
    \ TCP/IP MTU size\n\nThe TCP/IP addresses must be routed to the OSA cards.\n\n\
    # 2.2 z/VM resources\n\nIt is good practice to use naming conventions so that\
    \ you and others can recognize z/VM resources by their names. This discussion\
    \ discusses conventions for DASD volume names and backup file names.\n\n# 2.2.1\
    \ Volume labeling convention\n\nUse a convention for labeling DASD. Your enterprise\
    \ may already have a labeling convention which will largely determine the labels\
    \ to be given to the DASD by your z/VM and Linux LPAR.\n\nEach system DASD is\
    \ addressed with a device number consisting of four hexadecimal digits. Each system\
    \ DASD has a six-character label. It is convenient to identify the four-digit\
    \ address in the label so that you can easily tell the address of each DASD from\
    \ its label. When followed, this guarantees that no two DASDs have the same label.\
    \ This can be an important issue, especially when z/OS has access to the DASD.\n\
    \nSometimes DASD is shared among LPARs, in which case your z/VM LPAR can see DASD\
    \ that is owned by other LPARs. In this situation, it is convenient to identify\
    \ the LPAR that owns the The volume labeling convention used in this book identifies\
    \ the LPAR using the first character. That leaves the second character in the\
    \ label to identify the basic function of the DASD.\n\nThe LPAR used in this book\
    \ is identified by the character M. The following characters are used for the\
    \ second character of the label:\n\n+   - M Minisk space (PERM)\n- P Paging space\
    \ (PAGE)\n- S Spool page (SPOL)\n- T Temporary disk space (TDISK)\n- V z/VM operating\
    \ system volumes"
  merge: -1
