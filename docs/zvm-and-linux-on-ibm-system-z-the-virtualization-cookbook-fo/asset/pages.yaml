  md: '# 4.1 Installing z/VM from DVD


    The section that follows done assumes a first-level installation of z/VM from
    DVD out DASD. If you have not already done so, complete the worksheet that is
    provided in 2.7.1, “z/VM resources worksheet” on page 16. Note the following points:


    +   - For z9 hardware and older, you will need to access the Hardware Management
    Console (HMC) with a user ID that has authority to go into single object operations
    mode.

    - For z10 hardware and newer, the requirement to be in single object operations
    mode to access the Load from CD-ROM, DVD or Server function has been removed.


    z/VM 5.4 is shipped on tape and DVD. z/VM should install faster from tape due
    to faster I/O speeds; however, installing may require more trips between the HMC
    and the tape drive.


    +   - If you are familiar with the use of the HMC, you can use the two-page z/VM
    Summary for Automated Installation and Service (DVD Installation) to replace or
    augment the description that follows.

    - If you are not familiar with the HMC and z/VM, you may want to read the complete
    manual z/VM Guide for Automated Installation and Service Version 5 Release 4.0,
    GC24-6099.

    - If you are installing z/VM at the second level (that is, z/VM under z/VM) or
    over SCSI disk, use the GC24-6099 manual because the sections that do not address
    these options.


    # 4.1.1 Booting z/VM from DVD


    This section explains how to install z/VM 5.4 from an HMC with a DVD-ROM onto
    3390-3 equivalent DASD. Some words are included for installing onto the 3390-9
    DASD. For alternative configurations, such as installing from tape or onto SCSI
    disks, refer to the z/VM documentation.


    +   1. Logon to the Hardware Management Console. You should see the HMC Workplace™
    window.

    2. Select the LPAR on which you want to install z/VM; this is often reachable
    by clicking the CPC image icon.


    > Note: Ensure that you have the correct LPAR selected. If you are not completely
    sure, check with someone who is sure.


    +   3. If necessary, click the racetrack buttons (two buttons that are circular
    arrows on the bottom right corner) to traverse to the Recovery or CPC Recovery
    menu.

    4. On the Recovery or CPC Recovery menu, double-click the Integrated 3270 Console,
    as shown at the bottom of Figure 4-1 on page 29.'
  merge: -1
  pgno: 45
- img_proc: true
  md: '| Reset Clear |

