  md: 'Next, back up the repository and create a new one with the createrepo command:


    # cd /nfs/rhel5.2/Server

    # mv repodata.orig

    # createrepo /nfs/rhel5.2/Server

    96/2480 - system-config-network-1.3.97-1.el5.noarch.rpm

    ...


    It should take about five minutes to build the new repository data, depending
    on the number of RPMs.

    nYou now have a new repository based on the RPMs in /nfs/rhel5.2/Server. Repeat
    this procedure anytime you change an RPM (or set of RPMs). You can also use this
    to create multiple RPM repositories, based on anything you like. For example,
    you can have a repository named "test" containing the latest packages from RHN,
    as well as a "production" repository based on an official RHEL repository. You
    can create a .repo file on the client pointing to either repository, based on
    the role of that client.


    For example, on the server:

    # cd /nfs/rhel5.2

    # cp -a Server.production

    # cp -a Server.test.


    Now, any time you update an RPM in /nfs/rhel5.2/Server/, run createrepo on that
    directory. On the client, in the /etc/yum.repos.d/ directory you can have:


    /etc/yum.repos.d/rhel5.2.production.repo:

    [RHEL5]

    name=RHEL 5.2 production

    basefile=file:///nfs/rhel5.2/Server/production/


    Or you can have:


    /etc/yum.repos.d/rhel5.2.test.repo:

    [RHEL5]

    name=RHEL 5.2 test

    basefile=file:///nfs/rhel5.2/Server.test/


    Note that this method maintains separate copies of each directory of RPMs, which
    can fill the /nfs directory on the controller quickly. Red Hat has a separate
    product named Satellite which maintains a single tree, while managing the RPM
    version differences. The Satellite provides other features similar to RHN, as
    well; for more information, see:


    https://www.redhat.com/rhn/rhndetails/architecture/'
