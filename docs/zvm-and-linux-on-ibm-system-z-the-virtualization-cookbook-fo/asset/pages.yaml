    The tool conversion Perl script is migrate_base.pl. Redirect the output to a file
    named accounts.ldif. This will be the file that you use to populate the LDAP server.
    After you run it, take a look at the first few lines of the LDIF file using the
    **head** command to give you an idea of the format:


    ```

    ./migrate_base.pl > accounts.ldif

    # head -9 accounts.ldif

    dc: itso,dc=ibm,dc=com

    dc: itso

    objectClass: top

    objectClass: domain

    ```


    ```

    dc=itso,dc=ibm,dc=com

    dc: itso

    objectClass: top

    objectClass: domain

    ```


    > **Important:** There appears to be a bug in migrate_base.pl when the suffix
    has two components. This will later result in an error when you try to import
    the LDIF file:

    sladdap: line 5: database (dc=itso,dc=ibm,dc=com) not configured to head

    "dc=itso,dc=com"


    If your suffix (Base DN) has more than two components, you can work around the
    bug by deleting the entry or entries in the LDIF file with fewer components than
    your suffix. In this example, itso.ibm.com has three components, so the first
    entry (four lines and one blank line) must be deleted. Then the **sladdap** command
    should succeed.


