  md: '# Customizing system startup and shutdown


    When your z/VM system ipLED, it is desirable to have all Linux systems also start.
    Conversely, when you shut down z/VM, it is desirable to have all Linux systems
    down first.


    # 4.8.1 Configuring the AUTOLOG1 PROFILE EXEC


    We recommend that the following tasks be accomplished by using the SET AUTOLOG1
    PROFILE EXEC.


    +   - Configure Linux to shut down gracefully using the SET SIGNAL command.

    - Overcommit memory using the SET SW STORBUF command.

    - Grant access to VSWITCH for Linux users.

    - Start user IODs that be started using the XAUTOLOG command.

    - Limit minimisk cache in main storage and turn it off in expanded storage.


    **Logoff from LNMAIN to AUTOLOG1.** At the VM prompt you have usually been pressing
    Enter, which chooses the PROFILE EXEC to be run. If you do not want this EXEC
    to run, enter the command ACCESS (NOPROF).


    LOGON AUTOLOG1

    z/VM Version 5.4 Release 0, Service Level 0801 (64-bit),

    built on IBM Virtualization Technology

    There is no logmsg data

    FILES: NO DIR, NO PRT, NO PUN

    LOGON AT: 10:06:05 EDIT THURSDAY 05/15/08

    DMIND2014 Unable to access the y-disk. Filemode Y (192) not accessed

    z/VM 5.4.0. 2008-05-13 14:27


    ```

    >>> acc (noprof)

    ```


    Make a copy of the working EXEC:


    ```

    >>> copy profile exec = execs

    ```


    Edit the file and add the bold text. A LOGOFF command is added to the end of the
    EXEC, so the virtual machine will be logged off when it completes. This will save
    a small amount of memory on the system, but does add the requirement that you
    type acc (nprof) at the VM prompt when you log interact.


    ```

    >>> x profile exec

    ************************/

    /* Autolog1 Profile Exec */

    ************************/


    cp xautolog tcpip;

    ''CP XAUTOLOG VMMSVERS''

    ''CP XAUTOLOG VMMSERVU''

    ''CP XAUTOLOG VMMSERVER''

    ```


    ```

    /* start up TCPIP */

    ```'
