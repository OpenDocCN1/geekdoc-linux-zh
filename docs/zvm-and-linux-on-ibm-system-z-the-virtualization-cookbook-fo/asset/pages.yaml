  md: 'To invoke the new CP load module, use the SHUTDOWN REIPL command. When your
    system comes back up, it should be at the new CP service level; in this example,
    0702:


    ```

    == shutdown reipl iplarms cons=sysc

    ...

    == q cplevel

    z/VM Version 5 Release 3.0, service level 0702 (64-bit)

    Generated at 05/29/07 18:39:52 EST

    IPL at 11/12/07 14:53:28 EST

    ```


    This shows that the new CP load module is now being used.


    # 5.3 Determining the z/VM service level


    Often you will want to be query more than just the service level. The following
    steps were taken from the links CP Maintenance Levels and Virtual TCP/IP Maintenance
    Levels starting at the Web site:


    http://www.ibm.com/virtualnetwork/


    Logon as TCPMAINT. Use the QUERY VLAN command to determine the latest APAR applied:


    ```

    == cp query vlan

    VLAN maintenance level:

    Latest Service: VM63895

    VLAN MAC address assignment:

    MACADDR Prefix: 020001

    MACRANGE SYSTEM: 000001-000000

    USER: 000000-00

    VLAN default accounting status:

    SYSTEM Accounting: OFF USER Accounting: OFF

    VLAN general activity:

    PERSISTENT Limit: INFINITE Current: 1

    TRANSIENT Limit: INFINITE Current: 0

    ```


    This shows that the latest APAR applied is VM63895.


    The maintenance level of the TCP/IP stack is important to virtual networking.
    To determine this, first get the VSWITCH controller:


    ```

    == q vswitch

    VSITCH VSW1 Type: VSWITCH Connected: 8 Maxconn: INFINITE

    PERSISTENT RESTRICTED NONROUTER

    VLAN Unaware

    State: Ready

    IPtimeout: 5 QueueStorage: 8

    Portname: UNASSIGNED RDOE: 3004 DTCCSW1 VDE: 3004

    Portname: UNASSIGNED RDOE: 3008 DTCCSW2 VDE: 3008 BACKUP

    ```


    This shows the latest DTCSWITCH. Then use the NETSTAT command with the controller
    name to determine the maintenance of the TCIP PROTO:


    ```

    == netstat tcp <dtcsvw> level

    VM TCP/IP Netlevel 530

    IBM 2094; z/VM Version 5 Release 3.0, service level 0701 (64-bit), VM TCP/IP Lev

    el 530; RSU 0701 running TCPIP MODULE E2 dated 11/10/07 at 11:34

    TCP/IP Load Address: 00C44000

    ```


    82 The Virtualization Cookbook for Red Hat Enterprise Linux 5.2'
