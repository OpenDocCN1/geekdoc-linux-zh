    # 13.4.1 Entering single user mode


    Single user mode is helpful when you need to recover the root password, or if
    you are having problems booting Linux into the default runtime. To enter single
    user mode, first IPL your Linux server from the 3270 console. You will see a message
    similar to the one shown here:


    ```

    zIPL v1.3.2 interactive boot menu

    0. default (linux)

    1. linux

    Note: VM users please use ''#cp vi vmsg <input>''

    Please choose (default will boot in 15 seconds):

    ```


    Use the `#cp vi vmsg` command to boot the desired menu option (zero (0), in this
    example), followed by the number 1 for single user mode:


    ```

    ==> cp vi vmsg 0 1

    ```


    After some initial kernel boot messages, you should see:

    INIT: Entering level: 1

    Entering non-interactive startup

    Telling INIT to go to single user mode.

    INIT: Going single user

    INIT: Sending processes the TERM signal

    INIT: Sending processes the KILL signal

    sh-000#


    In single user mode, you are logged in as the root user. You can use the `passwd`
    command to set the root password. All of the file systems in `/etc/fstab` are
    mounted, but networking has not been started. To exit single user mode, you can
    type `reboot`, or enter `init 3` to continue booting.


    # 13.4.2 Entering a rescue environment


    If you encounter errors the root file system, or other problems that prevent you
    from entering single user mode, you can enter a `rescue` environment. This environment
    loads a Linux image in memory, and does not attempt to mount the root file system.'
