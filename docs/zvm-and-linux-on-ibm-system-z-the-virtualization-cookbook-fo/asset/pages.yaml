  md: '# # Servicing z/VM


    This chapter describes how to apply:


    +   - A Programming Temporary Fix (PTF) from "envelope files"

    - A Recommended Service Upgrade (RSU)


    Both processes are basically the same.


    Note that this process is based on z/VM 5.2, and not on 5.4, due to the timing
    of the writing of this book. However, the process has not changed significantly,
    so it should be just as useful. Keep in mind, that your output messages and so
    on will be slightly different.


    > **Important:** When applying service, there is always a chance that you may
    want to back it out. We recommend that you have an up-to-date backup of your system
    available before starting this section.


    The application of corrective service to z/VM is covered in *z/VM V5R3 Service
    Guide* and in *VMESES Introduction and Reference*. Both of these documents can
    be downloaded from the following URL:


    ```

    http://www.vm.ibm.com/library

    ```


    VMESES/ is a component of z/VM that provides the SERVICE and **PUTPROD** EXECs.
    The **SERVICE EXEC** performs the following tasks:


    +   - It installs an RSU or applies CORrective service for z/VM components, features,
    or products.

    - It displays the RSU level of the component specified or whether a particular
    PTF or APAR has been applied (when used with STATUS).

    - It creates PTF bitmap files (when used with BITMAP).


    When **SERVICE** is successfully completed, the **PUTPROD** EXEC places the z/VM
    features, or products that are installed on the z/VM System DDR into production.'
  merge: -1
  pgno: 88
- img_proc: true
  md: "# 5.1 Applying a PTF\n\nYou may determine that you need to apply a specific\
    \ fix or PTF to your system.\n\nFor example, Authorized Program Analysis Report\
    \ (APAR), VM63895, was opened to address the problems reported by virtual NIC\
    \ support. There are three known symptoms addressed by this APAR:\n\n+   - Linux\
    \ guests may lose connectivity after shutdown now (or any device reset).\n- Using\
    \ an External Security Manager (ESM) to authorize a VLAN list may lead to an FRF002\
    \ atend.\n- Virtual Hypersockets configured with \"VLAN nnn\" (exploiting Set\
    \ Global VLAN ID) did not filter inbound frames.\n\nThe APAR was assigned with\
    \ the following PTF numbers:\n\n+   - z/VM 5.0 VM63895 UM31612\n- z/VM 5.2.0 VM63895\
    \ UM31613\n\nThere are more details:\n\nhttp://www-ibm.com/support/docview.wss?id=isglVM63895\n\
    \nSo, for z/VM 5.2, apply PTF UM31613 as described in the next section.\n\n# 5.1.1\
    \ Determining whether a PTF has been applied\n\nCheck to make sure the PTF has\
    \ not previously been applied.\n\n+   1. Logon to MAINT and use the VMFSET command\
    \ to set up minidisks for TCP/IP and link to them:\n\n```\n== vmfset cp (link\n\
    VMFT27601 Minidisk starting for ZVM CP\nVMFT22051 Directory Assignments:\n  String\
    \ Stat Vdev Label/Directory\nVMFT22051 LOCALMOD E R/W 2C MNT2C4\nVMFT22051 LOCALSAM\
    \ F R/W 2C MNT2C2\n\nVMFT27601 VMFSET processing completed successfully\n```\n\
    \n+   2. Use the VMINFO command to query the Software Inventory items. Move the\
    \ Tab key to ZVM and s to select out the PPF Field window:\n\n```\n== vmfinfo\n\
    ```\n\nPPF Field - Help\n\nProduct parameters (PPFs) define the environment and\
    \ key variables required to process the queries. The following is a list of all\
    \ PPFs found on all accessed disks. Select one to continue. The function can be\
