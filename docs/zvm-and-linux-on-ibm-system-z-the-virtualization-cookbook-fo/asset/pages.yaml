  md: 'HMC Integrated 3270 Console or 3270 emulator. At this point, z/VM should be
    accessible over the network. You can continue working at the HMC, or you can access
    your new system using a 3270 emulator.


    If you want to switch to 3270 emulator, first LOGOFF from MAINT or issue DISConnect
    on the Integrated 3270 Console. Note the following points:


    +   - If you log off, the session is ended; it is analogous to shutting and powering
    down a PC.

    - If you disconnect, your session remains where it is and is resumed when you
    log back on; it is analogous to turning off a PC monitor.


    In general, use LOGOFF from system administration user IDs as MAINT. However,
    you should always DISCONNECT from z/VM service machines such as TCP/IP and user
    IDs running Linux, logging off them will terminate the service or crash


    # 4.3 Configuring XEDIT profile


    Logon to MAINT (if not logged already).


    The XEDIT command looks for the XEDIT PROFILE configuration file when it is invoked.
    Many z/VM user IDs do not have a personal or shared system file, so all XEDIT
    default values are in effect. The MAINT 191 (A) disk has a PROFILE XEDIT so when
    you are editing files on MAINT, the values in profile are usually in effect.


    If you have never used XEDIT before, refer to "XEDIT quick reference sheet" on
    page 212, for more information about this topic. The z/VM 5.4 PDF library is available
    on the Web at:


    http://www-03.ibm.com/systems/z/os/zksers/zvpdf#zvm54


    Search for the XEDIT User''s Guide and Command Reference. There is also an manual
    online:


    http://ukcc.uky.uk/ukccinfo/391/xeditref.html


    One default setting that can be dangerous, especially if you use F12 to retrieve
    commands, that PF12 is set to the FILE subcommand. Sometimes you may not want
    to save your changes with the stroke of one key. We recommend that you set PF12
    to ? subcommand, which has the effect of a retrieve key:


    ```

    == copy profile edit a profile xeditorig a (olddd)

    == x profile edit a

    ```


    Before:


    ```

    SET PF12 FILE

    ```


    After:


    ```

    SET PF12 ?

    ```


    Save your changes with the FILE subcommand.'
