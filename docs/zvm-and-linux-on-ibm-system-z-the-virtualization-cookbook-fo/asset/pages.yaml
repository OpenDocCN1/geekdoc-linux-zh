  md: 'If you do not have sufficient DASD, this number can be reduced. Having adequate
    paging space will give you plenty of headroom to add more Linux virtual machines.
    A rule of thumb for the amount of paging space is to have twice as much as the
    total of all memory for all running Linux user IDs combined.


    # 4.6.1 Formatting paging volumes


    Before adding paging volumes to the system, the DASD volumes used for minidisk
    (PERM) and paging (PAGE) must be formatted. Normally this is done one volume at
    a time using the CPFMTXA command. If you have a few volumes, that is fine, but
    when you have many volumes, the process of CPFMTXA can become time-consuming and
    tedious, which can lead to errors.


    A REXX EXEC named CPFORMAT is provided to you to format many volumes with a single
    command. The source code for the EXEC exists in , "CPFORMAT EXEC" on page 216.
    It is a wrapper CPFMTXA. To use this EXEC, each DASD to be formatted must first
    be attached with the virtual device address same real device address (Using ATTACH
    <realdev>).


    > Note: This EXEC will label the volumes according to the convention described
    in 2.2.1, "Volume labeling convention" on page 9. If you want different volume
    labels, you can use the CPFMTXA command and manually specify each volume label,
    or can modify the REXX EXEC.


