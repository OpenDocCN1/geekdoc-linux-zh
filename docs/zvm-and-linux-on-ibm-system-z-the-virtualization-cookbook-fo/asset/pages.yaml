    # 12.2 Creating a virtual LDAP server


    The Lightweight Directory Access Protocol (LDAP) is commonly implemented by the
    OpenLDAP package, which comes standard with Linux distributions. Among other directory
    functions, OpenLDAP allows for centralized login authentication and group ID resolution.


    In this section you will install Linux manually and set up login authentication
    to a new LDAP server. You will then go back to the Virtual Web server you created
    and point it to the new LDAP server.


    The steps are documented in this section:


    +   * Cloning a Linux server

    * Installing the OpenLDAP server

    * Configuring the OpenLDAP server

    * Migrating existing users to LDAP

    * Configuring an LDAP client

    * Adding new user accounts


    # 12.2.1 Cloning a Linux server


    Start an SSH session as root to the controller and clone the golden image to the
    LINUX user ID:


