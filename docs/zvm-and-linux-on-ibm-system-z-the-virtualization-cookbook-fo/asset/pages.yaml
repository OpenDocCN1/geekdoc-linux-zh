  md: '# 5.2.3 Receiving, applying, and building the service


    You must receive, apply, and build the service. Then it can be put into production.
    In the past, this was a cumbersome procedure. For example, to receive, apply and
    build the CP component, the following steps were needed:


    ```

    vmfdsk zm cp apply (setup)

    vmfsetup zm cp

    vmfsu zm cp

    vmfins install ppf zm cp (nomename) nolink override no

    vmfapply ppf zm cp (setup)

    vmfbld ppf zm cp (status)

    vmfbld ppf zm cp (serviced)

    ```


    Then the same steps were needed for many other components. The process is much
    easier with the SERVICE command. On the other hand, the previous method is more
    granular and better enables the system administrator to know which pieces of service
    have been applied.


    +   1. To use the SERVICE command, you must have a 256 MB virtual machine and
    you must have the minidisk with a large amount of free space; that is what the
    MAINT 500 minidisk is. Increase the size of the virtual machine with the DEFINE
    STORAGE command:

    ```

    ndef stor 256M

    STORAGE = 256M

    Storage cleared - system reset.

    ==> ipl cms

    ```nIPL CMS

    zVM5.4.0 2008-05-13 14:27

    ==> Enter


    +   2. Use the SERVICE command to write to the current disk, so you can access
    access 500 as A:

    ==> acc 500 a

    MMSAC721 replaces A (191)


    +   3. Use the SERVICE command, to process the envelope files you downloaded.
    Many, windows of output will scroll by the windows will be automatically cleared.
    Important messages will be saved to the A (500) disk. This process may take minutes
    or tens of seconds. Following example is:

    ==> service all rpt0176 rpt0276 rpt0376

    VMFSUTF2701 VMFSUTF26 processing completed successfully

    VMFSVR2701 SERVICE processing completed with warnings

    Ready (00004):


    A return code of (0) is ideal. Note the Ready line that this command returned
    a code of 4. In a general return code of 4 or greater generally means that only
    warnings were issued. A return code of 8 means errors were encountered.


    +   4. The output files to the A disk are of the format $VMF* $MSLOG

    ```

    | $VMFZP | $MSLOG | A V | 80 | 1520 | 28 11/05 13:35:43 |

    | $VMFBLD | $MSLOG | A V | 80 | 639 | 9 11/05 13:28:42 |

    | $VMFMRD | $MSLOG | A V | 80 | 499 | 7 11/05 13:28:39 |

    | $VMFVSR | $MSLOG | A V | 80 | 1369 | 25 11/05 11:56:47 |

    | $VMFAPP | $MSLOG | A V | 80 | 682 | 9 11/05 11:54:07 |

    | $VMFINS | $MSLOG | A V | 80 | 381 | 6 11/05 11:54:05 |

    ```'
