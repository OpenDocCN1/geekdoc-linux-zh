  md: '# 8.1.4 Installing RHEL 5.2 to the golden image


    Install Linux again as described in 7.1.4, "Beginning the Linux installation"
    on page 97. However, because the controller is now up and running, install RHEL
    5.2 using the installation tree exported from NFS the controller.


    You follow the same steps as installing Linux to the controller, except that you
    will create a different disk layout. If necessary, review 7.1.6, "Stage 2 of the
    RHEL 5.2 installation" on page 101 for the steps leading up to the Disk Partitioning
    section.


    At the Disk Partitioning window, create LVM containing separate file systems mounted
    at /tmp,/opt,/var,/usr, and /. Table 8-2 lists the recommended logical volume
    layout and sizes to be used for the golden image.


    | Mount point | Logical Volume Name | Size (MB) |

    | --- | --- | --- |

    | /tmp | tmp_lv | 384 |

    | /opt | opt_lv | 384 |

    | /var | var_lv | |

    | /usr | usr_lv | 1600 |

    | / | root_lv | 512 |


    At the Disk Partitioning section, you should see the window that allows you to
    partition disks as shown in Figure 8-1.


