  md: '# 4.4 Customizing the SYSTEM CONFIG file


    The first configuration read when/zVM IPLs is the SYSTEM CONFIG file. The following
    changes are recommended:


    +   - Change the system name.

    - Increase retry capacity.

    - Allow virtual disks (VDISKs) to be created.

    - Turn off the Disconnect Timeout. This will prevent idle disconnected users from
    being forced off the system.

    - Define a virtual switch (VSITCH) that will be used for Linux networking.


    To make these changes, perform the following steps:


    +   1. To edit the SYSTEM CONFIG file, the MAIN CFI disk must be reread as a CP
    disk using the PRELEASE command. The CP commands are queried using the QUERY command.
    Note the MAIN CFI disk is accessed as CP disk A before it is, released, but not
    after.


