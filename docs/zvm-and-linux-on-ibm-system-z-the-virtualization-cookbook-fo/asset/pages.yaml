    # 5.2 Applying a Recommended Service Upgrade


    Applying a Recommended Service Upgrade (RSU) is very similar to applying a PTF,
    as

    described in 5.1, “Applying a PTF” on page 72. z/VM service can be preventive
    (RSU) or

    correct (COR).


    Part 4, “Service Procedure,” in Guide for Automated Installation and Service,
    provides ancomplete description of how to apply service to z/VM; it assumes you
    are starting

    the RSU type. Following is an example of upgrading to a z/VM 5.3 RSU with the
    medium

    being files, not tape.


    The following sections summarize how to apply service and how to obtain

    service using enplevel over the Internet.


    You must first determine if your system needs service. Use the QUERY CPEVEL command:


    ```

    ==> cplevel

    z/VM Version 5 Release 3.0, service level 0701 (64-bit)

    Generated on 11/18/07 23:44:09 EST

    IPL at 11/19/07 13:44:37 EST

    ```


    The service level four digits are split in half, where the first half is the last
    two digits of the year

    and the second half is the service level for that year. Therefore, a service level
    of 0701 means

    t first service level for the year 2007 has been applied. If you installed from
    DVD, that was

    on the second RSU DVD disc.


    The overall steps in applying a service level are as follows:


    +   - Getting service from the Internet

    - Download the service to z/VM

    - Receive, apply, and build the service

    - Put the service into production


