    # 4.7.1 Define the user in the USER DIRECT file


    A small, 20-cylinder mindisk is allocated at virtual address 191. A larger, 300-cylinder
    mindisk (approximately 225 MB), which is to be shared by many guests, is defined
    at virtual address 192. Use the next free DASD designated as PERM space on your
    worksheet (2.7.2, "z/VM dashd on page 17). Cylinder 0 should always be reserved
    for the label; therefore, you start minions at cylinder 1.


    +   1. Edit the USER DIRECT file and add the following USER ID to the definition
    of the file:

    ==== user direct

    ==== bottom

    ==== a 6


    USER LNXMAINT 64M 128M BEG

    INCLUDE TCPMSU

    LINK TCPMSU 592 592 88

    MDISK 0191 0390 0001 0020 DMD0857 MR READ WRITE MULTIPLE

    MDISK 0192 0390 0021 0030 DMD0857 MR ALL WRITE MULTIPLE


    ====file


    Note the following explanations:


    +   1. User LNXMAINT, same password, default size of 64 MB, with class B, E and
    G privileges

    2. Include the file named TCPMSU (defined earlier in the USER DIRECT file)

    3. Link to the TCPMSU 592 read-disk only for access to FTP and other TCP/IP commands.

    4. Define a 191 mindisk of size 20 cylinders from volume DMD0857.

    5. Define 192 mindisk of size 300 cylinders (approximately 225 MB) from volume
    DMD0857 with the special read password of ALL, which allows access from any user
    ID without a disk password.

    6. An empty comment line for better readability.


    +   2. Whenever an MDISK statement is added or modified in the USER DIRECT file,
    always check for overlapping and gaps. (Gaps will only leave empty disk space,
    but can occur because z/VM will allow you to define multiple minidisks over the
    same disk). You can perform this by using the DISKMAP command:

    ==== disknap user'
