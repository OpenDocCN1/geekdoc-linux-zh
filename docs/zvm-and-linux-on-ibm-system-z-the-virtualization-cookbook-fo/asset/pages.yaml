  md: '# # Updating a system without Internet access


    The yum command communicates with RHN using secure Web traffic. If your Linux
    guest is not connected to the Internet, or is behind a firewall that prevents
    access to RHN, you can still use all of the yum functionality.


    # ## 11.4.1 Configuring the server


    This process uses the controller as a yum repository. The controller exports RHEL
    5.2 install tree over NFS. Your Linux guest uses the automunter to access this
    install tree and uses RHN.


    For more information about exporting the install tree over NFS, refer to 7.2.9,
    “Turning the NFS server” on page 115. The following sections assume the install
    tree is exported over NFS as `/nfs/rhel52/.


    # ## 11.4.2 Configuring the client


    On the Linux guest, you will first configure the automunter to mount the install
    tree from the controller on demand. The automunter will automatically mount a
    remote directory when it is accessed, and automatically after a period of inactivity.
    Edit the file `/etc/auto.master` and add the following line at the bottom:


    ```

    # /vi /etc/auto.master

    ...

    /nfs    /etc/auto.controller

    ```


    ![](img/57d3457c1c2eef8ee20ea427808e8c95_173_0.png)


    For more information about managing your systems through RHN, use usage guides
    and frequently asked questions, see:


    http://rhn.redhat.com/help'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'Next, create the file /auto.controller and add the following line, substituting
    the IP address of your controller:


    ```

    # vi /auto/controller

    rhel5.2 -ro,hard,intr <9.12.5.30>:/nfs/rhel5.2

    ```


    Create the /nfs directory. The autofs service will pick up the configuration changes,
    then list the contents of the automounted directory:


    ```

    # mkdir /nfs

    # service autofs restart

    Stopping automount: [ OK ]

    Starting automount: [ OK ]

    # ls /nfs/rhel5.2

    EULA README-or.html RELEASE-NOTES-ja.html

    eula.en_us README-pa.html RELEASE-NOTES.html

    ```


    Now that the installation tree is accessible, you will configure yum to use it.
    Create a file named rhel5.repo in the /etc/yum.repos.d/ rhel5.repo:


    ```

    # vi /etc/yum.repos.d/rhel5.repo

    [RHEL5.2]

    name=Red Hat Enterprise Linux 5.2

    baseurl=file:///nfs/rhel5.2/Server

    ```


    Finally, you need to import the RPM GPG key as yum you are installing official
    Red Hat packages. The Import Red Hat GPG key is located in the install tree. Import
    with the key:


    ```

    # rpm --import /nfs/rhel5/RPM-GPG-KEY

    ```


    > Note Red Hat signs each RPM with a private GPG key, which is compared to your
    public key each time a package is installed. This method ensures that the RPM
    is a genuine, unaltered package. When installing an RPM, if you ever see a message
    similar to the following, it means that the correct GPG key has not been imported,
    or the package itself has been altered by a third party:


    Header V3 DSA signature: NOKEY, key ID 897da07a


    You are now ready to use yum to install or upgrade an RPM package. Refer to 11.2,
    "Installing and updating packages using yum" on page 154 for an explanation of
    yum syntax.


    # 11.4 Updating packages on the server


    The RPMs are located in the /Server subdirectory of the install tree. Beneath
    this directory, there is a subdirectory named /repodata which contains repository
    files used by yum. Whenever a new set of RPMs is added to the /Server directory,
    you must rebuild the repository data with the createrepo command.


    On the controller, first install the createrepo RPM with:


    ```

    # yum install createrepo

    ...

    Running Transaction

    Installing: createrepo ####################### [1/1]

    Installed: createrepo.noarch 0:0.4.2-fc6

    Complete

    ```


    Chapter 11. Servicing Linux with Red Hat Network 157'
