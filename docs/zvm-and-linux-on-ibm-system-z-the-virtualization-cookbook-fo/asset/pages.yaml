    # 4.6 Adding paging volumes


    The z/VM operating system resides on the first three CP volumes (or one volume,
    if you are installing onto 3390-9s). z/VM 5.4 is installed with one full paging
    volume and one spool volume. A single spool volume is probably adequate for Linux,
    but a single volume is probably not. We recommend that you add five paging volumes
    so you will have a total of six (or one more 3390-9 if installing 3390-9s, which
    will give the the same total of 20034 cylinders of page space).'
