  md: '# 7.2 Configuring the controller


    Now that your controller is installed, it must be configured. The following steps
    are involved:


    * Copying files to the controller

    * Retiring the PC NFS server

    * Configuring VDISK swap

    * Configuring yum

    * Adding additional RPMs

    * Turning off unneeded services

    * Configuring the VNC server

    * Setting the system to halt on SIGNAL SHUTDOWN

    * Turning on the NFS server

    * Configuring SSH keys

    * Inserting the vmcp module

    * Rebooting the system

    * Verifying the changes


    # 7.2.1 Copying files to the controller


    It is time to copy the RHEL 5.2 install to the controller, along with other files
    associated with this task. First mount the directory `/nfs/rhel5.2/` on the PC
    NFS server over the directory `/mnt/`. In this example, the PC NFS server is at
    IP address 92.12.4.185:


    ```

    # mount 92.12.4.185:/nfs/rhel5.2 /mnt

    # ls /mnt

    EULA README.html RELEASE-NOTES-ja.html

    ...

    ```


    Create a local directory of the same name and recursively copy the tree using
    the `cp -a` command:


    ```

    # mkdir nfs/rhel5.2

    # cd /mnt

    # cp -a * /nfs/rhel5.2

    ```


    This command will take some time, 5 to 10 minutes, depending on network speed.

    Unmount the RHEL 5.2 install tree and repeat the process to copy the files associated
    with this book:


    ```

    # cd /

    # unmount /mnt

    # mount 92.12.4.185:/nfs/virt-cookbook-RH5.2 /mnt

    # mkdir /nfs/virt-cookbook-RH5.2

    # cd /mnt

    # cp -a * /nfs/virt-cookbook-RH5.2

    ```


    When the files are copied, unmount the `/mnt/` directory. Here are the files that
    you copied:


    # unmount /mnt/

    # cd /nfs/virt-cookbook-RH5.2

    # ls

    clone-1.0-5.s390x.rpm README.txt vm/


    The RPM clone-1.0-5.s390x.rpm contains files for use later in Chapter 9, “Configuring
    RHEL 5.2 for cloning” on page 129.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# 7.2.2 Retiring the PC NFS server


    You have not copied all files related to this book to the controller. You should
    be in a position to retire your PC NFS server, if appropriate. The remainder of
    the book uses files located instead of the files on the PC NFS server.


    # 7.2.3 Configuring VDISK swap


    Recall that you were warned during the installation that you were not using any
    swap spaces. This can be confirmed with the swapon -s command which lists swap
    spaces:


    ```

    # swapon -s

    ```


    Receiving no output means there are no swap spaces. Linux must be configured to
    use the VDISK swap spaces. Observe the first three DASD devices using the grep
    command:


    ```

    # grep FBA /proc/dasd/devices

    0.0300(FBA) (at 94: 128) is dasq : active blocksize: 512, 524288 blocks, 256 MB

    0.0301(FBA) (at 94: 132) is dasdr : active blocksize: 512, 104856 blocks, 52 MB

    ```


    You should see that /dev/dasq and /dev/dasdr are FBA devices, which signifies
    VDISKS. The SWAPGEN creates a single partition with a swap signature on each of
    the two VDISKS. Therefore, you can use /dev/dasq and /dev/dasdr as swap devices.
    Make a backup copy of the file system table, then add the two swap spaces as follows:


    ```

    # cd

    # cp fstab.orig fstab

    # vi /etc/fstab

    /

    LABEL=/ ext3 defaults 1 1

    /dev/install_vg/install_lv defaults 1 2

    LABEL=/boot swap defaults 1 2

    /dev/dasq swap 0 0

    /dev/dasdr swap 0 0

    tmpfs /dev/shm defaults 0 0

    devpts /dev/pts mode=622 0 0

    sysfs /sys defaults 0 0

    proc /proc defaults 0 0

    ```


    Save the file and turn on the swap spaces using the swapon -a command, which will
    read /etc/fstab file and then the swap spaces have been activated:


    ```

    # swapon -a

    # swapon -s

    Filename Size Used Priority

    /dev/dasq partition 259956 0 -1

    /dev/dasdr partition 519924 0 -2

    ```


    # 7.2.4 Configuring yum


    Now configure yum so it can install RPMs from local tee. Create a file named rhel5.2
    in the /etc/yum.repos directory:


    ```

    # cd /etc/yum.repos.d

    # vi rhel5.2.repo

    [RHEL5.2]

    ```


    name=Red Enterprise Linux 5.2

    baseurl=file:///rhel5.2/Server'
