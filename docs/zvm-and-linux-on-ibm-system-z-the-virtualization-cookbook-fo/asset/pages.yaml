  md: '# Determining storage and memory


    To see how much central and expanded storage (memory) are installed and allocated
    to a system, use the QUERY STORAGE and QUERY XSTOR commands. For example:


    ```

    ==> q store

    STORAGE = 4G CONFIGURED 4G INC = 256M STANDBY = 0 RESERVED = 0

    ==> qstor

    XSTOR = 2048M online=2048M

    XSTOR = 2048M user=SYSTEM usage=0% retained=OM pending=OM

    XSTOR MDC min=0,max=OM,usage=0%

    XSTOR = 2048M userid=(none) max.attach=2048M

    ```


    # Determining processors or cUs


    To see how many processors (CPs, IFLs, CPUs) you have allocated at system level,
    use the QUERY PROCESSORS command. For example:


    ```

    ==> q proc

    PROCESSOR 00 MASTER CP

    PROCESSOR 01 ALTERN CP

    PROCESSOR 02 ALTERN CP

    PROCESSOR 03 ALTERN CP

    PROCESSOR 04 STANDBY CP

    PROCESSOR 05 STANDBY CP

    PROCESSOR 06 STANDBY CP

    PROCESSOR 07 STANDBY CP

    ```


    # Determining software level


    To determine what level of CP your system is, use the QUERY CPLEVEL command. For
    example:


    ```

    ==> q cplevel

    z/VM Version 5 Release 4.0, service level 0801 (64-bit)

    Generated at 04/08/08 18:17:39 EDT

    IPL at 05/18/08 10:17:32 EDT

    ```


    # Determining system cylinder allocation


    The QUERY ALLOC map shows the system allocation of spool, paging and directory
    space. For example:


    ```

    ==> q alloc map

    EXTENT                % ALLOCATION

    EXTENT START      END TOTAL IN USE  1    2  5% DRCT ACTIVE

    VOLID REVD

    MVDB850 D850      1               20   20             1    5% SPOOL

    MVDB851 D850      1 3338 600840 58332 63360    0       % PAGE

    MVDB852 D850      1 3338 600640       0    0       % PAGE

    MPD850 D850      1 3338 601020       0    0       % PAGE

    MPD950 D950      1 3338 601020       0    0       % PAGE

    MPD951 D951      1 3338 601020       0    0       % PAGE

    MPD550 D550      1 3338 601020       0    0       % PAGE

    MPD850 D850      1 3338 601020          13   45  1% PAGE

    ```


    # Determining DASD, OSA and virtual resources


    The QUERY DASD and QUERY FREE commands will show you how DASD is assigned to the
    system and what DASD is free to be assigned. Similarly, the QUERY OSA and QUERY
    FREE commands report on OSA resources. Finally, the QUERY VIRTUAL ALL command
    can


    useful.'
