  md: '# 10.1 Configure the controller for kickstart


    In this section we configure the controller to host the kickstart file, which
    you use to perform the automated installation of the Linux server called LINUX0.
    This section assumes you have already set up your RHEL 5.2 install as described
    in 7.2, "Configuring the controller" on page 109.


    The installer generates a kickstart file at the end of installation. It is based
    on the answers provided during the interactive install. This kickstart file is
    named anaconda-ks.cfg and is located in the /root/ directory. You may use this
    kickstart file from RHEL5 as a template for LINUX02. Perform the following steps:


    +   From an Secure Shell (SSH) connection to the controller, create a directory
    to hold the kickstart file. Copy the default kickstart file to this directory,
    rename it, and modify the permissions so others may read it:


    ```

    # mkdir /nfs/ks

    # cp /root/anaconda-ks.cfg /nfs/ks/linux02-ks.cfg

    # chmod +r /nfs/ks/linux02-ks.cfg

    ```


    +   Next, use vi to edit the kickstart configuration file. To customize this kickstart
    for LINUX02, remove the lines with the strikes, and edit the lines in bold font:


    ```

    # vi /nfs/ks/linux02-ks.cfg

    install

    nfs --server=9.12.5.30 -- 1

    lang en_US.UTF-8 2

    network --device eth0 --bootstrap bootstrap --9.12.5.32 --netmask=255.255.255.0
    --gateway=9.12.4.1 --nameserver=9.12.6.6 3

    hostname virtcs32.ibm.com 4

    rootpw --iscripted $d0MI5$jJwhkIKQ3xQzTLVRsm

    firewall --disabled --port=22/tcp

    authoring --enableshadow --enable5

    selinux --enforcing

    timezone America/New_York

    bootloader --location=mbr --order=dasda,dasdd,dasdg,dasdi,dasdj,daskh 5

    reboot

    key --skip

    # The following is the partition information you requested

    # Note that any partitions you deleted are not expressed

    # here unless you clear all partitions first, this is

    # not guaranteed to work

    zerombr --yes 8

    clearpart --initlabel 9

    / --fstype ext3 --size=1 --ondisk-dasda 10

    clearpart --linux 11

    # /boot --fstype ext3 --size=100 --ondisk-dasda

    #part.pv.11 --size=100 grow --ondisk-dasda

    #part.pv.10 --size=100 grow --ondisk-dasdd

    #part.pv.9 --size=100 grow --ondisk-dasdg

    #part.pv.8 --size=100 grow --ondisk-dasdi

    # / --fstype ext3 --size=100 --ondisk-dasdj

    #volgroup install --size=32768 pv.8 pv.9 pv.10 pv.11

    #logvol /nfs --fstype ext3 --name-install_vg --vg=install_vg --size=9120 12


    %packages

    @core

    @base

    @games

    ```


    148 Virtualization Cookbook for Red Hat Enterprise Linux 5.2'
