- img_proc: true
  md: 'In this example, it starts at x3300 and ends at x6FFF (this is a PAGE boundary).
    You also need to issue q nss all map to determine where the new MONDCSS can be
    located with no overlap.


    **Important:** Check carefully to make sure the new MONDCSS does not overlap any
    other NSS. If it does, PERKIT may not be able to use it.


    One way to test the MONDCSS segment can be loaded to issue SEGMENT LOAD MONDCSS
    before you start PERKIT. If it returns any error (for example, DMDSCS343E), there
    may be an overlap and you will have to redefine the MONDCSS location.


    Often, you can simply raise the ending location of the current MONDCSS to solve
    this problem.


    First, delete the old MONDCSS by issuing:


    ```

    PURGE NSS NAME MONDCSS

    ```


    If any users are currently connected to the MONDCSS, you need to log off those
    users. You can determine who is connecting by issuing MONITOR.


    Create a new MONDCSS:


    ```

    CP DEFSEG MONDCSS 03300-09FF SC RSSTD

    ```


    Save the new MONDCSS:


    ```

    CP SAVESEG MONDCSS

    ```


    **Recommendation:** There is a relationship between the PERFSVM virtual machine
    storage size and the MONDCSS segment size, as described here.


    +   * The PERFSVM virtual machine storage size should be of ample size to contain
    the entire MONDCSS segment, plus some CMS pointer tables.


    +   * Or, the MONDCSS must be located outside the size of the PERFSVM virtual
    machine storage size (the preferred solution).


    Then you can receive any messages from the PERKIT that the MONDCSS SAMPLE CONFIG
    is too small, you need to enlarge it as previously explained. The same would apply
    to the MONITOR EVENT CONFIG size, if you receive a PERKIT message pertaining to
    that.


    If you continue to receive MONDCSS SIZE TOO SMALL messages, you will need to restart
    this process over again, increasing the total size of the MONDCSS segment.


    RESTART the PERKIT and monitor the startup for at least 2 monitor timeframes to
    ensure things are working and there are no error type messages.'
