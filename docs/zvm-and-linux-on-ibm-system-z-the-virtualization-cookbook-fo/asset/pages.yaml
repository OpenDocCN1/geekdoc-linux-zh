    After the product, the TCPIP profile must be modified to add browser capabilities
    for the Performance Toolkit. The following example describes how to set the port
    to 80, which is the default for a Web browser.


    +   1. Logon to TCPMINT. Edit the <vminlua> TCPIP D file (assuming you have modified
    this name earlier; the default name is PROFILE TCPIP and search for the reserve
    ports. This is where z/VM TCP/IP ports are reserved.

    ==> x <vminlua> tcpip d

    ===> /port


    +   2. Add the following lines under the PORT entries:


    ```

    PORT

    20 TCP FTPSERVER NOATULOG ; FTP Server

    21 TCP FTPSERVER ; FTP Server

    23 TCP INTCHEN ; TELNET Server

    25 TCP SMTP ; SMTP Server

    53 TCP NAMESRV ; Domain Name Server

    53 UDP NAMESRV ; Domain Name Server

    67 UDP BOOTDP ; Boot Server

    67 UDP DHCP ; DHCP Server

    69 UDP TFTP ; TFTP (Trivial FTP) Server

    80 TCP PERFSVM ; Performance Toolkit

    111 TCP PORTMAP ; Portmap Server

    ```


    Save your changes. The TCPIP ID needs to be recycled for your changes to take
    effect. You can issue FORCE and XAUTOLOG TCPIP from a console. Alternatively,
    if you are in a position to reIPL the system, you can do that (shutdown reIPL
    iplarms-sync).


    +   3. When the system comes back, logon to TCPMINT and verify status by issuing
    the NETSTAT command. Verify that the service PERFSVM is in a List state.


