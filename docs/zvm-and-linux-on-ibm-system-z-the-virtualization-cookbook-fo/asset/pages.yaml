    The masterGuestID is the z/M ID of the master image (RHEL5), and the cloneGuestID
    is the z/M ID of the target image (LINUX01). These values are always required.


    If no DASD are specified on the command line, then you can collect the DASD information
    from the user''s configuration file stored in /etc/clone/. The script uses the
    DASD to determine which minisks to copy as the part process. In the following
    example, DASD is 10-101, which implies that minisks located at virtual addresses
    100 and 101 are copied. The 300 and 301 VDSKs are omitted when SWAP automatically
    creates each time the user logs on. The DASD_ROOT value specifies which one of
    these minisks covers the Linux filesystem (.


