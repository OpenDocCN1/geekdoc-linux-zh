  \n\n\n\n\n\n\n\n\n```\nkali >ps aux | grep apache2\nroot  4851 0.2 0.7 37548  7668\
  \ ?  Ss  10:14  0:00   /usr/sbin/apache2 -k start\nroot  4906 0.0 0.4 37572  4228\
  \ ?  S    10:14  0:00   /usr/sbin/apache2 -k start\nroot  4910 0.0 0.4 37572  4228\
  \ ?  Ss  10:14  0:00   /usr/sbin/apache2 -k start\n--snip--\n```\n\n这条命令告诉 Linux\
  \ 显示我所有的服务，然后将输出发送到 `grep`，`grep` 会在输出中查找关键词 `apache2` 然后只显示相关的输出，从而节省了我大量的时间和视力。\n\
  \n## 修改文件和目录\n\n一旦你找到了文件和目录，你就想要对它们执行操作。在本节中，我们将介绍如何创建文件和目录、复制文件、重命名文件以及删除文件和目录。\n\
  \n### 创建文件\n\n在 Linux 中创建文件有很多方法，但种是 `cat`，它通常用于合并文件。第二种是 `touch`，用于创建空文件。第三种是使用如\
  \ `vim`、`emacs`、`leafpad`、`gedit` 或 `kate` 等文本编辑器。\n\n 使用 cat 合并\n\n要创建一个文件，我们只需要在\
  \ `cat` 命令后跟一个重定向，用 `>` 表示。这是一个示例：\n\n```\nkali >cat > hackkills\nHacking is the\
  \ most valuable set of 21st century!\n```\n\n当你按下回车时，Linux 进入交互模式并等待你开始输入。当我退出并按下\
  \ CTRL-D 时，我就返回到了提示符。现在，当我想查看 `hackkills` 文件中的内容时，我输入以下内容：\n\n```\nkali >cat hackkills\n\
  Hacking is the most valuable set of 21st century!\n```\n\n如果你不使用重定向符号，Linux 将返回你的文件内容。\n\
  \n要向文件添加或`追加（append）`更多内容，可以使用带有双重定向（`>>`）的 `cat` 命令，跟随你想添加到文件末部的任何内容。这是一个示例：\n\n\
  ```\nkali >cat >> hackkills\nEveryone should learn hacking\n```\n\nLinux 再次进入交互模式，等待向文件添加内容。当我输入\
  \ `Everyone should learn hacking` 并按下 CTRL-D，我就返回到了提示符。现在，当我显示文件时，可以看到文件中添加了 `Everyone\
  \ should learn hacking`，如下：\n\n```\nkali >cat hackkills\nHacking is the most valuable\
  \ set of 21st century!\nEveryone should learn hacking\n```\n\n如果我想用新信息`覆盖（overwrite）`文件，我可以再次使用单重重定向的\
  \ `cat` 命令，如下：\n\n```\nkali >cat > hackkills\nEveryone in IT security without hacking\
  \ skills is in the dark\n```\n\n如你所示，Linux 进入交互模式，我输入新文本然后返回提示符。当我再次使用 cat 查看文件内容时，我看到之前的单词已被最新文本覆盖。\n\
  \n### 使用 touch 创建\n\n创建文件的第二个命令是 `touch`。该命令最初开发是为了让用户可以简单地*触摸*文件来更改其某些细节，例如创建或修改日期。然而，如果文件不存在，该命令默认创建该文件。\n\
  \n让我们用 touch 创建 `newfile`：\n\n```\nkali >touch newfile\n```\n\n现在当我使用 `ls –l` 查看目录的详细列表时，我看到了一个名为\
  \ `newfile` 的新文件。注意它的大小为 0，因为 `newfile` 中没有内容。\n\n### 创建目录\n\n\n\n\n\n在 Linux 中创建目录的命令是\
  \ `mkdir`，它是 *make directory*（创建目录）的缩写。要创建一个名为 `newdirectory` 的目录，请输入以下命令：\n\n```\n\
  kali >mkdir newdirectory\n```\n\n要进入这个新创建的目录，只需输入：\n\n```\nkali >cd newdirectory\n\
  ```\n\n## 复制文件\n\n要复制文件，我们使用 `cp` 命令。这会在新位置创建一个该文件的副本，并将旧文件留在原处。\n\n在这里，我们将使用 `touch`\
  \ 在根目录下创建一个名为 `oldfile` 的文件，并将其复制到 `/root/newdirectory/`，在此过程中对其进行重命名，同时将原始的 `oldfile`\
  \ 留在原处：\n\n```\nkali >touch oldfile\nkali >cp oldfile  /root/newdirectory/newfile\n\
  ```\n\n重命名文件是可选的，只需在目录路径末尾添加你想要指定的名称即可。如果你在复制文件时不进行重命名，文件将默认保留原始名称。\n\n当我们随后导航到\
  \ `newdirectory` 时，我们看到有一个名为 `newfile` 的 `oldfile` 完整副本：\n\n```\nkali >cd newdirectory\n\
  kali >ls\nnewfile   oldfile\n```\n\n## 重命名文件\n\n遗憾的是，Linux 并没有专门用于重命名文件的命令（像 Windows\
  \ 和其他操作系统那样），但它确实有一个 `mv`（move）命令。\n\n`mv` 命令可以将文件或目录移动到新位置，或者简单地给现有文件起新名字。要将 `newfile`\
  \ 重命名为 `newfile2`，你需要输入以下内容：\n\n```\nkali >mv newfile newfile2\nkali >ls\noldfile\
  \ newfile2\n```\n\n现在当你列出 (`ls`) 该目录时，你会看到 `newfile2` 而不是 `newfile`，因为它已经被重命名了。你可以对目录执行同样的操作。\n\
  \n## 删除文件\n\n要删除文件，你可以直接使用 `rm` 命令，如下：\n\n```\nkali >rm newfile2\n```\n\n如果你现在对目录进行详细列出，可以确认该文件已被删除。\n\
  \n## 删除目录\n\n删除目录的命令与删除文件的 `rm` 命令类似，但在其后面添加了 `dir`（代表 directory），如下所示：\n\n```\n\
  kali >rmdir newdirectory\nrmdir:failed to remove 'newdirectory': Directory not empty\n\
  ```\n\n需要注意的是，`rmdir` 不会删除非空目录，而是像这个示例所示，会给你一个“目录不为空”的警告消息。你必须在删除目录之前先删除该目录中的所有内容。这是为了防止你不小心删除不想删除的对象。\n\
  \n如果你想一次删除目录及其内容，可以在 `rm` 之后使用 `-r` 选项，如下：\n\n```\nkali >rm -r newdirectory\n```\n\
  \n不过要提醒一下：在使用 `rm` 的 `-r` 选项时至少在初开始要小心，因为很容易误删重要的文件和目录。例如，在你的主目录中使用 `rm -r` 将删除那里所有的文件和目录——这可能不是你的本意。\n\
  \n现在 现在去玩吧！\n\n现在你已经掌握了一些在文件系统中导航的基本技能，可以在继续之前先玩玩你的 Linux 系统。熟悉终端的最佳方法就是现在尝试你新学的技能。在随后的章节中，我们将深入探索我们的黑客乐场。\n\
  \n### 练习题\n\n在进入 第 2 章 之前，尝试通过完成以下练习来检验在本章中学学的技能：\n\n1. 从根目录 (`/`) 使用 `ls` 命令探索\
  \ Linux 的目录结构。使用 `cd` 命令进入每个目录，并运行 `pwd` 以验证你在目录结构中的所在位置。\n2. 使用 `whoami` 命令验证你当前以哪个用户身份登录。\n\
  3. 使用 `locate` 命令查找用于密码破解的字典列表文件。\n4. 使用 `cat` 命令创建一个新文件并向该文件追加内容。记住 `>` 将输入重定向到文件，而\
  \ `>>` 则追加到文件。\n5. 创建一个名为 `hackerdirectory` 的新目录，并在目录下创建一个名为 `hackedfile` 的新文件。现在将该文件复制到你的\
  \ `/root` 目录并重命名为 `secretfile`。\n\n## 2 文本处理\n\n![image](img/common01.jpg)\n\n在\
  \ Linux 中，你直接处理的几乎一切都是文件，而且这些通常是文本文件；例如，Linux 中所有的配置文件都是文本文件。因此，要重新配置应用程序，只需打开配置文件、更改文本、保存文件，然后重启应用程序——你的重新配置就完成了。\n\
  \n由于有这么多文本文件，处理文本对于管理 Linux 和 Linux 变得至关重要。在本章中，你将使用几种用于在 Linux 中处理文本的命令和技术。\n\n\
  为了说明，我将使用来自世界上最好的入侵检测系统 (NIDS) Snort 的文件，Snort 由 Marty Roesch 首次开发，现在归思科所有。NIDS\
  \ 通常用于检测黑客的入侵，因此如果你想成为一名成功的黑客，必须熟悉 NIDS 威慑攻击的方法以及你可以利用它们来规避检测的方法。\n\n**注意**\n\n\
  如果你使用的 Kali Linux 版本没有预装 Snort，请自行安装。\n\n### 查看文件\n\n正如第 1 章所示，最基础的显示命令可能是 `cat`，但它有局限性。使用\
  \ `cat` 显示 Snort 配置文件 (`snort.conf`)，如列表 2-1 所示：\n\n```\nkali >cat /etc/snort/\n\
  ```\n\n*列表 2-1: 在终端中显示 snort.conf*\n\n你的屏幕现在应该显示整个 `snort.conf` 文件，直到文件结束。这并不是查看和处理该文件最方便或实用的方法。\n\
  \n在接下来的两个部分中，我将向你介绍 `head` 和 `tail` 命令，它们是显示文件部分的方法。\n\n### 获取头部\n\n如果你只想查看文件的开头，可以使用\
  \ `head` 命令。默认情况下，该命令显示前 10 行。例如，以下命令显示 `snort.conf` 的前 10 行：\n\n```\nkali >head\
  \ /etc/snort/snort.conf\n```\n\n# # VRT 规则包 Snort.conf\n#\n#更多信息请访问：\n--snip--\n\
  #Snort 错误：bugs@snort.org\n\n如果你想查看比默认 10 行更多或更少的行，请在调用 `head` 之后、文件名之前通过切换开关输入数量。例如，如果你想查看文件的前\
  \ 20 行，你需要输入列表 2-2 所示的命令：\n\n```\nkali >head -20 /etc/snort/snort.conf\n```\n\n\
  # # ---------------------------------\n#VRT 规则包 Snort.conf\n#\n#更多信息请访问：\n#.\n#.\n\
  #.\nOptions : --enable-gre --enable-mpls --enable-targetbased\n--enable-ppm --enable-perfprofiling\
  \ enable-zlib --enable-act\nlive-response --enable-normalizer --enable-reload --enable-react\n\
  \n### 获取尾部\n\n`tail` 命令与 `head` 命令类似，但它用于查看文件的最后几行。让我们在 `snort.conf` 上使用它：\n\n```\n\
  kali >tail /etc/snort/snort.conf\n#include $SO_RULE_PATH/smtp.rules\n#include $SO_RULE_PATH/specific-threats.rules\n\
  #include $SO_RULE_PATH/web-activex.rules\n#include $SO_RULE_PATH/web-client.rules\n\
  ```\n\n\n\n\n\n```\n#include $SO_RULE_PATH/web-iis.rules\n\n#include $SO_RULE_PATH/web-miscp.rules\n\
  ```\n\n### 事件阈值设定和抑制命令。参见 threshold.conf\n\n注意，此命令显示了 `rules` 文件的最后几行包含行，而不是全部，因为类似于\
  \ `head` 命令，`tail` 的默认值是显示 10 行。你可以通过获取 `snort.conf` 的最后 20 行来显示更多行。与 `head` 命令一样，你可以在命令和文件名之间输入一个连字符（`-`）然后是行数来告诉\
  \ `tail` 要显示的行数，如 列表 2-3 所示。\n\n```bash\nkali >tail -20 /etc/snort/snort.conf\n\
  ```\n\n```\n#include $SO_RULE_PATH/chat.rules\n\n#include $SO_RULE_PATH/chat.rules\n\
  \n#include $SO_RULE_PATH/chat.rules\n```\n\n--snip--\n\n# 事件阈值或抑制命令。参见 theshold.conf\n\
  \n列表 2-3：在终端窗口中显示 `snort.conf` 的最后 20 行\n\n现在我们可以在一个屏幕上查看 `rules` 文件中几乎所有的包含行。\n\
  \n## 为行进行编号\n\n有时——特别是对于很长的文件——我们可能希望文件显示行号。由于 `snort.conf` 有超过 600 行，在这里使用行号会很有用的。这使得引用更改以及返回文件中的同一位置变得更加容易。\n\
  \n要显示带有行号的文件，我们使用 `nl` (number lines) 命令。只需输入 列表 2-4 所示的命令即可。\n\n```bash\nkali >nl\
  \ /etc/snort/snort.conf\n```\n\n```\n612 #################################################################\n\
  613 #dynamic library rules\n614 #include $SO_RULE_PATH/bad-traffic.rules\n615 #include\
  \ $SO_RULE_PATH/chat.rules\n```\n\n--snip--\n\n```\n630 #include $SO_RULE_PATH/web-iis.rules\n\
  631 #include $SO_RULE_PATH/web-misc.rules\n```\n\n列表 2-4：在终端输出中显示行号\n\n现在每行都有一个数字，使得引用变得容易得多。\n\
  \n## 使用 grep 过滤文本\n\n`grep` 命令可能是最常用的文本处理命令。它允许你过滤文件内容进行显示。例如，如果你想查看 `snort.conf`\
  \ 文件中所有包含 `output` 单词的行，你可以使用 `cat` 并要求它只显示那些行（参见 列表 2-5）。\n\n```bash\nkali >cat\
  \ /etc/snort/snort.conf | grep output\n```\n\n# 6) 配置输出插件\n\n# 步骤 #6：配置输出插件\n\n\
  ```\n### output unified2: filename merged.log, limit 128, nostamp, mpls_event_types,\
  \ vlan_event_types\noutput unified2: filename merged.log, limit 128, nostamp, mpls_event_types,\
  \ vlan_event_types\n\n### output alert_unified2: filename merged.log, limit 128,\
  \ nostamp\n### output log_unified2: filename merged.log, limit 128, nostamp\n###\
  \ output alert_syslog: LOG_AUTH LOG_ALERT\n### output log_tcpdump: tcpdump.log\n\
  ```\n\n列表 2-5：显示包含 `grep` 指定关键字或短语的行\n\n此命令将首先查看 `snort.conf`，然后使用管道 (`|`) 将其发送到\
  \ `grep`，`grep` 将文件作为输入，查找包含 `output` 单词的行，并仅显示这些行。`grep` 命令是 Linux 工作中非常强大且本质的命令，因为可以节省你数小时搜索文件中每个单词或命令出现位置的时间。\n\
  \n## 黑客挑战：使用 grep, nl, tail 和 head\n\n假设你想使用你刚刚学到的至少四种命令，显示包含 `# Step #6: Configure\
  \ output plugins` 这一行之前的五行。你会怎么做？（提示：这些命令的选项比我们讨论的要多。你可以通过使用 Linux 内置命令 `man` 学习更多命令。例如，`man\
  \ tail` 将显示 `tail` 命令的帮助文件。）\n\n解决这个挑战有很多方法；在这里，我向你展示了修改哪些行来完成一种方法，你的任务是找到另一种方法。\n\
  \n### 步骤 1\n\n```bash\nkali >nl/etc/snort.conf | grep output\n```\n\n```\n    34\
  \     # 6) Configure output plugins\n    512    # Step #6: Configure output plugins\n\
  \    518    # output unified2: filename merged.log, limit 128, nostamp, mpls_event_types,\
  \ vlan_event_types\n    521    # output alert_unified2: filename snort.alert, limit\
  \ 128, nostamp\n    522    # output log_unified2: filename snort.log, limit 128,\
  \ nostamp\n```\n\n### 步骤 2\n\n```\n    512    # Step #6: Configure output plugins\n\
  \    521    # output alert_unified2: filename snort.alert, limit 128, nostamp\n\
  \    522    # output log_unified2: filename snort.log, limit 128, nostamp\n```\n\
  \n```bash\nkali >tail -n 5 -A \"# Step #6: Configure output plugins\" /etc/snort/snort.conf\n\
  ```\n（注：步骤 1/2 提供的原始文本是碎片化且重复的；我已根据挑战描述重建了逻辑流。）\n\n\n\n\n\n### Options: --enable-gre\
  \ --enable-mpls --enable-targetbased\n\n--enable-ppm --enable-perfprofiling enable-zlib\
  \ --enable-active\n\n-response --enable-normalizer --enable-reload --enable-react\n\
  \n--enable-flexresp3\n\n## --More--(2%)\n\n*Listing 2-7: 使用 `more` 逐页显示终端输出*\n\n\
  注意，`more` 仅显示第一页然后停止，它会在左下角告诉我们显示了文件的百分比（在此情况下为 2%）。要查看更多行或页，请按 `ENTER`。要退出 `more`，输入\
  \ `q`（代表 *quit* ）。\n\n## 使用 less 进行显示和过滤\n\n`less` 命令与 `more` 非常相似，但具有额外的功能——这就是为什么\
  \ Linux 爱好者常说：“Less is more（少即是多）”。通过 `less`，你不仅可以随意地滚动查看文件，还可以对其进行关键词过滤。如 Listing\
  \ 2-8 键，`less` 将允许你在文件中搜索术语。例如，当你第一次设置 Snort 时，需要确定你想如何以及向何处发送你的入侵告警输出。要找到配置文件的该部分，你只需搜索\
  \ `output`，如下所示：\n\n```bash\n## Snort build options:\n### Options: --enable-gre\
  \ --enable-mpls --enable-targetbased\n   --enable-ppm --enable-perfprofiling enable-zlib\
  \ --enable-active\n-response --enable-normalizer --enable-reload --enable-react\n\
  \   /output\n```\n\n这将立即带你到 `output` 的第一次出现处并将其高亮显示。你可以通过输入 `n`（代表 *next* 下一个）来查找下一个\
  \ `output`。\n\n## 步骤 #6：配置输出插件\n\n# 有更多信息，请参 Snort 手册中的 Configuring Snort - Output\
  \ Modules\n\n```text\n# unified2\n### 大多数安装推荐\n# output unified2: filename merged.log,\
  \ limit 128, nostamp, mpls_event_types,\n# vlan_event_types\noutput unified2: filename\
  \ snort.log, limit 128, nostamp, mpls_event_types,\n# vlan_event_types\n### 针对特定类型的额外配置\n\
  # output alert_unified2: filename snort.alert, limit 128, nostamp\n# output log_unified2:\
  \ filename snort.log, limit 128, nostamp\n# syslog\n### output alert_syslog: LOG_AUTH\
  \ LOG_ALERT\n```\n\n如所示，`less` 带你到了单词 `output` 的下一次出现处，并高亮了所有搜索术语。在这种情况下，它直接跳转到了\
  \ Snort 的输出部分。太方便了！\n\n## 总结\n\nLinux 有许多种处理文本的方法，每种方法都有其自身的优缺点。我们在本章中提到了一些最实用的方法，但我建议你尝试每一种方法，并培养你自己的直感和偏好。例如，我认为\
  \ `grep` 是不可或缺的，并且我广泛使用 `less`，但你可能会有不同的感受。\n\n## 练习\n\n在进入第 3 章 之前，尝试通过完成以下练习来运用在本章中学到的技能：\n\
  \n1. 访问 `/usr/share/wordlists/metasploit`。这是一个包含多个字典列表的目录，可以使用 Metasploit（最流行的渗透测试和攻击框架）对各种密码保护的设备进行密码破解。\n\
  2. 使用 `cat` 命令查看文件 `passwords.lst` 的内容。\n3. 使用 `more` 命令显示 `passwords.lst` 文件。\n\
  4. 使用 `less` 命令查看 `passwords.lst` 文件。\n5. 现在使用 `nl` 命令为 `passwords.lst` 中的密码添加行号。应该有\
  \ 88,396 个密码。\n6. 使用 `tail` 命令查看 `passwords.lst` 中的最后 20 个密码。\n7. 使用 `cat` 命令显示\
  \ `passwords.lst` 并通过管道找到所有包含 `123` 的密码。\n\n# 3. 网络的分析与管理\n\n![image](img/common01.jpg)\n\
  \n理解网络对于任何有志成为黑客的人来说都是至关重要的。在很多情况下，你将通过网络对某些东西进行攻击，一个优秀的黑客需要知道如何连接到并与该网络交互。例如，你可能需要在隐藏自己的网协议（IP）地址的情况下连接到计算机，或者你可能需要将目标的域名系统（DNS）查询重定向到你的系统；这类任务相对简单，但需要一些\
  \ Linux 网络知识。\n\n## 使用 ifconfig 分析网络\n\n`ifconfig` 命令是检查网络接口的最基础工具之一。你可以用它查看类似于\
  \ Listing 3-1 的输出。\n\n```\nkali >ifconfig\n```\n\n如所示，`ifconfig` 显示了关于活动接口的一些有用信息。输出顶部是第一个接口的名称\
  \ `eth0`，它是 Ethernet 的缩写。如果有更多有线接口，将以相同的格式显示（`eth1`, `eth2`）。\n\n接下来列出所使用的网络类型（以太网），随后是\
  \ `hwaddr` 和一个地址；这是在每个网络硬件上的唯一地址，通常称为媒体访问控制（MAC）地址。\n\n第二行包含当前分配给该接口的 IP 地址；广播地址（用于向子网上的所有\
  \ IP 发送信息）；以及网络掩码（用于确定 IP 地址的哪些部分连接到本地网络）。\n\n输出的部分部分显示名为 `lo` 的网络连接，它是 loopback\
  \ address 的缩写，有时也称为 localhost。这是一个特殊的软件地址，将你连接到你自己的系统。软件和服务无法使用它。你会使用 `lo` 测试你系统上的某些东西，例如你自己的\
  \ Web 服务器。localhost 通常用 IP 地址 `127.0.0.1` 表示。\n\n第三个连接是接口 `wlan0`。当你拥有无线接口或适配器时它才会出现，就像这里一样。注意它也显示了该设备的\
  \ MAC 地址。\n\n## 使用 iwconfig 检查无线网络设备\n\n如果你有无线适配器，可以使用 `iwconfig` 命令收集无线攻击所需的关键信息，例如适配器的\
  \ IP 地址、MAC 地址、其所处模式等。你从该命令中获得的信息在你使用 `aircrack-ng` 等无线攻击工具时尤为重要。\n\n\n\n\n\n使用终端，让我们通过\
  \ `iwconfig` 来看一些无线设备（参见列表 3-2）。\n\n```\nkali >iwconfig\n\nwlan0 IEEE 802.11bg ESSID:off/any\n\
  \nMode:Managed Access Point: Not Associated Tx-Power=20 dBm\n\n--snip--\n\nlo  \
  \   no wireless extensions\n\neth0  no wireless extensions\n```\n\n*列表 3-2：使用 `iwconfig`\
  \ *获取无线适配器的信息***\n\n此处的输出告诉我们，唯一具有无线扩展的网络接口是 `wlan0`，这正是我们的预料。`lo` 和 `eth0` 都不具备任何无线扩展。\n\
  \n对于 `wlan0`，我们获知了该设备支持哪些 802.11 IEEE 无线标准：`b` 和 `g`，这是两个早期的无线通信标准。大多数无线设备现在也包含了\
  \ `n`（`n` 是最新标准）。\n\n我们还从 `iwconfig` 中了解了无线扩展的模式（在此情况下为 `Mode:Managed`，管理模式，与监听模式或混杂模式相反）。在破解无线密码时，我们需要混杂模式。\n\
  \n接下来，我们可以看到无线适配器未连接到接入点（AP）（Not Associated），且其功率为 20 dBm，这代表信号强度。我们将在第 14 章花更多时间研究这些信息。\n\
  \n## 更改你的网络信息\n\n能够更改 IP 地址和其他网络信息是一项实用的技能，因为它可以帮助你在访问其他网络的同时，表现为这些网络上的受信任设备。例如，在拒绝服务（DoS）攻击中，你可以伪造自己的\
  \ IP，使攻击看起来来自另一个源，从而帮助你在取证分析期间规避 IP 追踪。这在 Linux 中是一个相对简单的任务，通过 `ifconfig` 命令完成。\n\
  \n### 更改你的 IP 地址\n\n要更改 IP 地址，输入 `ifconfig`，然后输入想要重新分配的接口以及想要分配给该接口的新 IP 地址。例如，要为接口\
  \ `eth0` 分配 IP 地址 `192.168.181.115`，你需要输入以下内容：\n\n```\nkali >ifconfig eth0 192.168.181.115\n\
  \nkali >\n```\n\n当你正确操作时，Linux 仅仅会返回命令提示符且什么都不说。这是好事！\n\n然后，当你再次使用 `ifconfig` 检查网络连接时，你应该看到你的\
  \ IP 地址已更改为你刚刚分配的新 IP 地址。\n\n### 更改网络子掩码和广播地址\n\n你也可以使用 `ifconfig` 命令更改子掩码（`netmask`）和广播地址。例如，如果你想为同一个\
  \ `eth0` 接口分配 `255.255.0.0` 的子掩码和 `192.168.1.255` 的广播地址，你需要输入以下内容：\n\n```\nkali\
  \ >ifconfig eth0 192.168.181.115 netmask 255.255.0.0 broadcast 192.168.1.255\n\n\
  kali >\n```\n\n再次，如果你操作得完全正确，Linux 会响应一个新的命令提示符。现在再次输入 `ifconfig` 以验证每个参数是否已相应更改。\n\
  \n### 伪造你的 MAC 地址\n\n你也可以使用 `ifconfig` 更改 MAC 地址（或 `hwaddr`）。MAC 地址是全球唯一的，通常被用作安全措施以将黑客排除在网络之外——或用于追踪他们。将你的\
  \ MAC 地址更改为伪造的不同 MAC 地址几乎是轻而易举的，并且可以消除那些安全措施。因此，这是绕过网络访问控制的一种非常有用的技术。\n\n要伪造你的 MAC\
  \ 地址，只需使用 `ifconfig` 命令的 `down` 选项关闭接口（在本例中为 `eth0`）。然后输入 `ifconfig` 命令，后跟接口名称（硬件用\
  \ `hw`，以太网用 `ether`）和新的伪造 MAC 地址。最后，使用 `up` 选项启用接口以使更改生效。这里是一个示例：\n\n```\nkali >ifconfig\
  \ eth0 down\n\nkali >ifconfig eth0 hw ether 00:11:22:33:44:55\n\nkali >ifconfig\
  \ eth0 up\n```\n\n现在，当你用 `ifconfig` 检查设置时，你应该看到 `HWaddr` 已更改为你的新的伪造 IP 地址！\n\n###\
  \ 从 DHCP 服务器分配新 IP 地址\n\nLinux 有一个运行动态主机配置协议（DHCP）的守护进程（`daemon`——一个在后台运行的进程），称为\
  \ `dhcpd` 或 `dhcp daemon`。DHCP 服务器为子网上的所有系统分配 IP 地址，并记录哪个 IP 地址在任何时刻分配给了哪台机器。这使得取证分析师在攻击后追踪黑客的绝佳资源。因此，理解\
  \ DHCP 服务器的工作原理非常有帮助。通常，要从局域网连接互联网，必须拥有 DHCP 分配的 IP。因此，在设置静态 IP 地址后，你必须返回获取一个新的\
  \ DHCP 分配的 IP 地址。要实现这一点，你可以重启系统，但我将向你展示如何在不需要关闭和重启系统的情况下获取新的 DHCP。\n\n向 DHCP 请求\
  \ IP 地址，只需使用命令 `dhclient` 调用 DHCP 服务器，后跟想要分配的接口。不同的 Linux 发行版使用不同的 DHCP 客户端，但 Kali\
  \ 基于 Debian 构建，它使用 `dhclient`。因此，你可以：\n\n```\nkali >dhclient eth0\n```\n\n```\n\
  kali >ifconfig\neth0      linkenc:00:11:22:33:44:55  inet:192.168.181.115  mask:255.255.255.0\
  \  broadcast:192.168.1.255\n```\n\n## 操纵域名系统\n\n黑客可以从目标的域名系统（DNS）中发现大量信息。DNS 是互联网的关键组件，尽管它的设计是将域名转换为\
  \ IP 地址，但黑客可以使用它来收集信息。\n\n### 使用 dig 进行检查\n\nDNS 是将 `hackers-arise.com` 等域名转换为相应\
  \ IP 地址的服务；如果没有 DNS，我们都必须记住成千上万个 IP 地址——对于专家来说也不是易事。\n\n对于职业黑客来说，最有用的命令之一是 `dig`，它提供了获取目标\
  \ DNS 信息的方法。这些信息可能包括目标的名称服务器（翻译名称服务器）、邮件服务器以及任何子域名和 IP 地址。\n\n例如，输入 `dig hackers-arise.com`\
  \ 并添加 `ns` 选项（nameserver 的缩写）。`hackers-arise.com` 的名称服务器显示在列表 3-3 的 ANSWER 部分。\n\
  \n```\nkali >dig hackers-arise.com ns\n\n--snip--\n\n;; QUESTION SECTION:\n;hackers-arise.com.\
  \  IN  NS\n\n;; ANSWER SECTION:\nhackers-arise.com.  5  IN  NS  ns7.wixdns.net.\n\
  hackers-arise.com.  5  IN  NS  ns6.wixdns.net.\n\n;; ADDITIONAL SECTION:\nns6.wixdns.net.\
  \     5  IN  A   216.239.32.100\n```\n\n*列表 3-3：使用 `dig` 及其 `ns` *选项获取域名服务器的信息***\n\
  \n同样注意 ADDITIONAL 部分，此 dig 查询揭示了 [hackers-arise.com](http://hackers-arise.com) 的\
  \ DNS 服务器的 IP 地址 (216.239.32.100)*。\n\n\n\n\n\n你也可以通过添加 `mx` 选项获取连接到特定域名的邮件服务器信息（mx\
  \ 是 *mail exchange server* 邮件交换服务器的缩写）。这些信息对于邮件系统的攻击至关重要。例如，[www.hackers-arise.com](http://www.hackers-arise.com)邮件服务器的信息显示在列表\
  \ 3-4 的 AUTHORITY SECTION 中。\n\n```\nkali >dig hackers-arise.com mx\n```\n\n--snip--\n\
  \n;; QUESTION SECTION:\n\n;hackers-arise.com.     IN    MX\n\n;; AUTHORITY SECTION:\n\
  \nhackers-arise.com.  5  IN    SOA    ns6.wixdns.net. support.wix.com 2016052216\
  \ 10800 3600 604 800 3600\n\n--snip--\n\n*列表 3-4：使用* `dig` *及其* `mx` *选项获取域名邮件交换服务器信息*\n\
  \n最常见的 Linux DNS 服务器是伯克利互联网域名系统（BIND）。在某些情况下，Linux 用户会将 DNS 称为 BIND，但请不要被混淆：DNS\
  \ 和 BIND 都是将单个域名映射到 IP 地址。\n\n### **更改你的 DNS 服务器**\n\n在某些情况下，你可能想使用另一个 DNS 服务器。要做到这一点，你需要编辑系统上名为\
  \ `/etc/resolv.conf` 的纯文本文件。用文本编辑器打开该文件——我使用的是 Leafpad。然后，在命令行中输入你编辑器的精确名称，随后是文件的路径和文件名。例如，\n\
  \n```\nkali >leafpad /etc/resolv.conf\n```\n\n将在我指定的图形化文本编辑器 Leafpad 中打开 `/etc`\
  \ 目录下的 `resolv.conf` 文件。该文件看起来类似于图 3-1。\n\n![image](img/f0035-01.jpg)\n\n*图 3-1：文本编辑器中典型的*\
  \ `resolv.conf` *文件*\n\n如你所第 3 行所示，我的名称服务器设置为 `192.168.181.2` 的本地 DNS 服务器。这运行良好，但如果我想添加或将该\
  \ DNS 服务器替换为例如位于 `8.8.8.8` 的 Google 公共 DNS 服务器，我会在 `/etc/resolv.conf` 文件中添加以下行来指定名称服务器：\n\
  \n```\nnameserver  8.8.8.8\n```\n\n然后我只需要保存文件。然而，你也可以完全通过命令行输入以下内容来实现相同效果：\n\n```\n\
  kali >echo \"nameserver 8.8.8.8\"> /etc/resolv.conf\n```\n\n此命令输出字符串 `nameserver\
  \ 8.8.8.8` 并将其重定向（`>`）到文件 `/etc/resolv.conf`，从而替换当前内容。你的 `/etc/resolv.conf` 文件现在应该类似于图\
  \ 3-2。\n\n![image](img/f0035-02.jpg)\n\n*图 -2：更改* `resolv.conf` *文件以指定 Google 的\
  \ DNS 服务器*\n\n如果你现在打开 `/etc/resolv.conf` 文件，你应该看到它将 DNS 请求指向 Google 的 DNS 服务器而不是你的本地\
  \ DNS 服务器。你的系统现在将访问 Google 公共 DNS 服务器来解析域名到 IP 地址。这可能意味着域名解析需要稍微长时间（可能是几毫秒）。因此，为了保持速度同时保留使用公共服务器的选项，你可能想在\
  \ `resolv.conf` 文件中保留本地 DNS 服务器并在其后添加公共 DNS 服务器。操作系统按照它们在 `/etc/resolv.conf` 中出现的顺序查询每个\
  \ DNS 服务器，因此只有当本地 DNS 服务器中找不到域名时，系统才会引用公共 DNS 服务器。\n\n**注意**\n\n*如果你正在使用 DHCP 地址且\
  \ DHCP 服务器提供了 DNS 设置，当 DHCP 服务器更新 DHCP 地址时，将替换文件内容。*\n\n### **映射你自己的 IP 地址**\n\n\
  你系统中一个名为 `hosts` 的特殊文件也执行域名–IP 地址的翻译转换。`hosts` 文件位于 `/etc/hosts`，与 DNS 类似，你可以用它来指定自己的\
  \ IP 地址–域名映射。换句话说，当你向浏览器输入 [www.microsoft.com](http://www.microsoft.com)（或任何其他域名）时，你可以决定浏览器去往哪个\
  \ IP 地址，而不是让 DNS 服务器来决定。作为一个黑客，这对于使用如 `dnsspoof` 等工具劫持本地局域网上的 TCP 连接并将流量引导到恶意 Web\
  \ 服务器非常有用。\n\n从命令行输入以下命令（你可以用你喜欢的文本编辑器替换 leafpad）：\n\n```\nkali >leafpad /etc/hosts\n\
  ```\n\n你现在应该看到你的 `hosts` 文件，它看起来类似于图 3-3。\n\n![image](img/f0036-01.jpg)\n\n*图 3-3：默认的\
  \ Kali Linux* `hosts` *文件*\n\n默认情况下，`hosts` 文件只包含一个映射。\n\n\n\n\n\n请注意，我们使用 `apt-cache`\
  \ 命令来搜索 apt 缓存，或者说是存储软件包名称的地方。例如，如果你正在搜索入侵检测系统 `Snort`，你需要输入列表 4-1 所示的命令。\n\n```\n\
  kali >apt-cache search snort\n\nfwsnort - Snort-to-iptables rule translator\n\n\
  ippl - IP protocols logger\n\n--snip--\n\nsnort - flexible Network Intrusion Detection\
  \ System\n\nsnort-common - flexible Network Intrusion Detection System - common\
  \ files\n\n--snip--\n```\n\n列表 4-1：使用 `apt-cache` 在系统内搜索 `Snort`\n\n如你所见，许多文件中包含关键词\
  \ `snort`，但在输出的中间部分，我们看到了 `snort` – 灵活 Network Intrusion Detection System。这正是我们要寻找的！\n\
  \n### 添加软件\n\n现在你已经知道仓库中存在 `snort` 软件包，你可以使用 `apt-get` 下载该软件了。\n\n要在终端中从操作系统的默认仓库安装软件，请使用\
  \ `apt-get` 命令，后输入关键词 `install`，然后是你想要安装的软件包名称。语法如下：\n\n```\napt-get install packagename\n\
  ```\n\n让我们通过在你的系统上安装 `Snort` 来尝试一下。输入 `apt-get install snort` 作为命令，如列表 4-2 所示。\n\
  \n```\nkali >apt-get install snort\n\nReading package lists... Done\n\nBuilding\
  \ dependency tree\n\nReading state information... Done\n\nSuggested packages:\n\n\
  snort-doc\n\nThe following NEW packages will be installed:\n\nsnort\n\n--snip--\n\
  \nInstall these packages without verification [Y/n]?\n```\n\n列表 4-2：使用 `apt-get\
  \ install` 安装 `Snort`\n\n你看到的输出告诉你是正在安装的内容。如果一切看起来都正确，在提示时输入 `y`，软件安装就会继续进行。\n\n\
  ### 移除软件\n\n移除软件时，使用带有 `remove` 选项的 `apt-get`，后跟要移除的软件名称（参见列表 4-3）。\n\n```\nkali\
  \ >apt-get remove snort\n\nReading package lists... Done\n\nBuilding dependency\
  \ tree\n\nReading state information... Done\n\nThe following packages were automatically\
  \ installed and are no longer\n\nrequired:\n\n   libdaq0 libprelude2 oinkmaster\
  \ snort-common-libraries snort-rules-default\n\n--snip--\n\nDo you want to continue\
  \ [Y/n]?\n```\n\n列表 4-3：使用 `apt-get remove` 移除 `Snort`\n\n同样，你将看到正在执行的任务，系统会询问你是否想要继续。你可以输入\
  \ `y` 来卸载，但你可能想保留 `Snort`，因为我们还会再次使用它。`remove` 命令不会删除配置文件，这意味着你将来可以重新安装同一个软件包而无需重新配置。\n\
  \n如果你想在移除软件包的同时也移除配置文件，可以使用 `purge` 选项，如列表 4-4 所示。\n\n```\nkali >apt-get purge \
  \ snort\n\nReading package lists... Done\n\nBuilding dependency tree\n\nReading\
  \ state information... Done\n\nThe following packages were automatically installed\
  \ and are no longer required:\n\n   libdaq0 libprelude2 oinkmaster snort-common-libraries\
  \ snort-rules-default\n\n--snip--\n\nDo you want to continue [Y/n]?\n```\n\n列表 4-4：使用\
  \ `apt-get purge` 移除 `Snort` 及其辅助配置文件\n\n只需在提示处输入 `Y` 即可继续清理软件包包和配置文件的。\n\n你可能注意到了输出中的\
  \ `The following packages were automatically installed and are no longer required`\
  \ 这一行。为了保持轻量和模块化，许多 Linux 软件包被拆分为许多不同程序可能使用的软件单元。当你安装 `Snort` 时，你随之一起安装了几个 `Snort`\
  \ 运行所需的依赖项或库。现在你正在移除 `Snort`，这些其他库或依赖项不再被需要了，因此它们也会被移除。\n\n### 更新软件包\n\n软件仓库会定期更新新软件或现有软件的新版本。这些更新不会自动推送到你那里，因此你必须手动请求以将这些更新应用到你自己的系统中。`Updating`（更新）不等同于\
  \ `upgrading`（升级）：更新只是更新仓库中可下载的软件包列表，而升级则会将软件包升级到仓库中的最新版本。\n\n你可以通过输入 `apt-get`\
  \ 命令后跟关键词 `update` 来更新你的单个系统。这将搜索你系统上的所有软件包并检查是否有可用更新。如果是，将下载更新（参见列表 4-5）。\n\n```\n\
  kali >apt-get update\n\nGet:1 http://mirrors.ocf.berkeley.edu/kali kali-rolling\
  \ InRelease [30.5kb]\n\nGet:2 http://mirrors.ocf.berkeley.edu/kali kali-rolling/main\
  \ amd64 Packages [14.9MB]\n\nGet:3 http://mirrors.ocf.berkeley.edu/kali kali-rolling\
  \ non-free amd64 Packages [163kb]\n\nGet:4 http://mirrors.ocf.berkeley.edu/kali\
  \ kali-rolling/contrib amd64 Packages [107 kB]\n\nFetched 15.2 MB in 1min 4s (236\
  \ kB/s)\n\nReading package lists... Done\n```\n\n列表 4-5：使用 `apt-get update` 更新所有过期的软件包\n\
  \n你系统中仓库中的可用软件列表将得到更新。如果更新成功，你的终端将显示 `Reading package lists... Done`，正如列表 4-5 所示。请注意，仓库名称以及值（时间、大小等）在你的系统上可能会不同。\n\
  \n### 升级软件包\n\n要升级系统上的现有软件包，请使用 `apt-get upgrade`。由于升级软件包可能会更改你的软件，在输入 `apt-get\
  \ upgrade` 之前，你必须以 root 身份登录或使用 `sudo` 命令。此命令将升级 `apt` 已知的系统上的每一个软件包，意味着仅存储在仓库中的那些（参见列表\
  \ 4-6）。升级可能非常耗时，因此你可能一段时间内无法使用系统。\n\n```\nkali >apt-get upgrade\n\nReading package\
  \ lists... Done\n\nBuilding dependency tree... Done\n\nCalculating upgrade... Done\n\
  \nThe following packages were automatically installed and no longer required:\n\n\
  --snip--\n\nThe following packages will be upgraded:\n\n--snip--\n\n1101 upgraded,\
  \ 0 newly installed, 0 to remove and 318 not upgraded.\n\nNeed to get 827 MB of\
  \ archives.\n\nAfter this operation, 408 MB disk space will be freed.\n\nDo you\
  \ want to continue? [Y/n]\n```\n\n列表 4-6：使用 `apt-get upgrade` 升级所有过期的软件包\n\n你应该在输出中看到系统估算了该软件包所需的硬盘空间。如果你想继续并并且有足够的硬盘空间进行升级，请输入\
  \ `Y`。\n\n### 将仓库添加到你的 sources.list 文件中\n\n存放特定 Linux 发行版软件的服务器被称为仓库（repositories）。几乎每个发行版都有自己的软件仓库——为该发行版进行开发和配置——这些仓库在其他发行版上可能无法良好运行，或者根本无法运行。尽管这些仓库通常包含相同或相似的软件，但它们并不是完全相同的，有时它们具有相同软件的不同版本或完全不同的软件。\n\
  \n你当然会使用 Kali 仓库，它包含了大量的安全和黑客软件。但由于 Kali 专注于安全和黑客，它并不包含某些特殊软件和工具甚至是一些普通软件。添加一两个备份仓库供你的系统进行搜索，以防在\
  \ Kali 仓库中找不到特定软件是值得的。\n\n\n\n\n\n你的系统搜索软件的仓库存储在 `sources.list` 文件中，你可以修改此文件来定义想要从哪些仓库下载软件。我经常会在我的\
  \ `sources.list` 文件中位于 Kali 仓库之后添加 Ubuntu 仓库；这样的话，当我请求下载一个新的软件软件包时，我的系统会首先在 Kali\
  \ 仓库中查找，如果该软件包不在那里，它就会在 Ubuntu 仓库中查找。\n\n你可以在 `/etc/apt/sources.list` 找到 `sources.list`\
  \ 文件，并使用任何文本编辑器打开它。我将再次使用 Leafpad。要打开 `sources.list` 文件，请在终端中输入以下内容，并将 leafpad 替换为你所用编辑器的名称：\n\
  \n```\nkali >leafpad /etc/apt/sources.list\n```\n\n输入此命令后，你应该会看到一个类似于图 4-1 所示的窗口，其中列出了\
  \ Kali 的默认仓库列表。\n\n![image](img/f0044-01.jpg)\n\n*图 4-1: `sources.list` 中的 Kali\
  \ 默认仓库*\n\n许多 Linux 发行版将仓库划分为不同的类别。例如，Ubuntu 将其仓库类别划分如下：\n\n- `main`: 包含支持的开源软件\n\
  - `universe`: 包含社区维护的开源软件\n- `multiverse`: 包含受版权或其他法律问题限制的软件\n- `restricted`: 包含专有设备驱动\n\
  - `backports`: 包含来自较后版本的软件包\n\n我不建议在 `sources.list` 中使用测试（testing）、实验（experimental）或不稳定（unstable）仓库，因为它们可能会向你的系统下载问题的软件。未经过充分测试的软件可能会破坏你的系统。\n\
  \n当你请求下载一个新的软件软件包时，系统会按照 `sources.list` 中列出的仓库顺序进行查找，并在找到所需的软件包时停止。首先检查该仓库是否与你的系统兼容。Kali\
  \ 和 Ubuntu 一样都是构建在 Debian 之上，因此这些仓库与这些系统都工作得很好。\n\n要添加仓库，只需通过编辑 `sources.list` 文件，向列表中添加仓库名称然后保存文件即可。例如，假设你想在\
  \ Kali 上安装 Oracle Java 8。默认 Kali 软件源中没有 Oracle Java 8 的 `apt` 软件包，但通过在线搜索可以发现 WebUpd8\
  \ 的优秀同事们已经创建了一个。如果你将他们的仓库添加到源中，就可以可以使用 `apt-get install oracle-java8-installer`\
  \ 命令安装 Oracle Java 8。在编写本文时，你需要向 `sources.list` 中添加以下仓库位置以添加必要的仓库：\n\n```\ndeb http://ppa.launchpad.net/webupd8team/java/ubuntu\
  \ trusty main\ndeb-src http://ppa.launchpad.net/webupd8team/java/ubuntu precise\
  \ main\n```\n\n### 使用基于 GUI 的安装程序\n\n较版本的 Kali 不再包含基于 GUI 的软件安装工具，但你始终可以使用 `apt-get`\
  \ 命令安装一个。两个最常用的基于 GUI 的安装工具是 Synaptic 和 Gdebi。让我们安装 Synaptic 并使用它来安装 Snort 软件包：\n\
  \n```\nkali >apt-get install synaptic\n\nReading package lists... Done\nBuilding\
  \ dependency tree\nReading state information... Done\n--snip--\nProcessing triggers\
  \ for menu (2.1.47)...\nkali >\n```\n\n一旦安装了 Synaptic，你可以从**设置 (Settings)** ▸ **Synaptic\
  \ 软件包管理器 (Synaptic Package Manager)** 启动它，这应该打开一个类似于图 4-2 所示的窗口。\n\n![image](img/f0045-01.jpg)\n\
  \n*图 4-2: Synaptic 软件包管理器界面*\n\n现在你可以搜索你正在寻找的软件包。只需点击**搜索 (Search)** 选项卡即可打开搜索窗口。由于你再次寻找\
  \ Snort，请在搜索窗口中输入 `snort` 并点击**搜索 (Search)**。向下滚动搜索结果找到你寻找的软件包。勾选 `snort` 旁边的框，然后如图\
  \ 4-3 所示点击**应用 (Apply)** 选项卡。Synaptic 现在将从仓库下载并安装 Snort 以及任何必要的依赖项。\n\n![image](img/f0046-01.jpg)\n\
  \n*图 4-3: 从 Synaptic 软件包管理器下载 Snort*\n\n### 使用 git 安装软件\n\n有时你需要的软件在任何仓库中都不可用——特别是当它是全新的时候——但它可能在\
  \ github (`https://www.github.com/`) 上可用，该网站允许开发者与其他分享他们的软件以便他人下载、使用并提供反馈。例如，如果你想要\
  \ `bluediving`（一个蓝牙黑客和渗透测试套件）且在 Kali 仓库中找不到它，你可以在搜索栏中输入 `bluediving` 来在 github 上搜索该软件。如果它在\
  \ github 上存在，你应该会在搜索结果中看到它的仓库。\n\n一旦你从 github 上找到了该软件，你就可以在终端中输入 `git clone` 命令后接其\
  \ github URL 来从终端克隆安装它。例如，`bluediving` 位于 `https://www.github.com/balle/bluediving.git`。要将其克隆到你的系统中，请输入如列表\
  \ 4-7 所示的命令。\n\n```\nkali >git clone https://www.github.com/balle/bluediving.git\n\
  \nCloning into 'bluediving'...\nremote: Counting objects: 131, Done.\nremote: Total:\
  \ 131 (delta 0), reused 0\nReceiving objects: 100% (131/131), 900.81 KiB/s, Done.\n\
  Resolving deltas: 100% (9/9), Done.\nChecking connectivity... Done.\n```\n\n*列表\
  \ 4-7: 使用 `git clone` 克隆 bluediving*\n\n一旦你从 github 上找到了该软件，你就可以在终端中输入 `git clone`\
  \ 命令后接其 github URL 来安装它。你可以通过使用列出命令 `ls -l` 来检查它们是否已下载，如下：\n\n```\ntotal 80\ndrwxr-xr-x\
  \ 7 root root  4096 Jan 10 22:19 bluediving\ndrwxr-xr-x 2 root root  4096 Dec  5\
  \ 17 Desktop\ndrwxr-xr-x 2 root root  4096 Dec  5 17 Documents\ndrwxr-xr-x 2 root\
  \ root  4096 Dec  5 17 Downloads\ndrwxr-xr-x 2 root root  4096 Dec  5 17 Music\n\
  --snip--\n```\n\n正如你所看到的，bluediving 已成功克隆到系统，并创建了一个名为 `bluediving` 的新目录。\n\n## 总结\n\
  \n在本章中，你学习了在 Linux 系统上下载和安装新软件的几种方法。软件包管理器（如 `apt`）、基于 GUI 的安装程序和 git 克隆是每个黑客掌握的最常用且关键的方法。\n\
  \n**练习**\n\n在进入[第 5 章](#ch05.xhtml）之前，请通过完成以下练习来尝试本章中学的技能：\n\n1. 从 Kali 仓库安装一个新的软件软件包。\n\
  2. 移除该软件软件包。\n3. 更新你的仓库。\n4. 升级你的软件包。\n5. 从 github 选择一个新软件并克隆它。\n\n\n\n\n在本章中，我将向你展示如何检查并更改特定用户的文件和目录权限，如何设置默认的文件和目录权限，以及如何设置特殊权限。最后，你将看到黑客对权限的理解如何帮助他们利用系统。\n\
  \n### 不同类型的用户\n\n如你所知，在 Linux 中，root 用户是无所不能的。root 用户几乎可以在系统上执行任何操作。系统上的其他用户具备的能力和权限受到限制，几乎不会拥有\
  \ root 用户拥有的访问权限。\n\n这些其他用户通常被归类为具有相似职的组。在商业实体中，这些组可能是财务、工程、销售等。在 IT 环境中，这些组可能包括开发者、网络管理员和数据库管理员。其核心思想是将需求相似的人归到一个组，并授予相关权限；然后组的每个成员都会继承该组的权限。这主要是为了方便权限管理，从而提高安全性。\n\
  \nroot 用户默认是 root （root group）的一部分。系统上的每个新用户都必须添加到某个组，才能继承该组的权限。\n\n### 授予权限\n\n\
  每个文件和目录都必须根据使用它的不同身份分配特定的权限级别。三个权限级别如下：\n\n- `r`：读权限。这只授予打开和查看文件的权限。\n- `w`：写权限。这允许用户查看和编辑文件。\n\
  - `x`：执行权限。这允许用户执行文件（但不一定可以查看或编辑它）。\n\n通过这种方式，root 用户可以根据用户对文件的需要授予相应级别的权限。当创建一个文件时，通常创建该文件的用户是该文件的所有者，而所属组是该用户所在的组。文件所有者可以向其授予各种访问权限。让我们看看如何更改权限以将所有权交给单个用户和组。\n\
  \n### 向单个用户授予所有权\n\n要将文件的所有权转移给另一个用户，使其拥有控制权限的能力，我们可以使用 `chown`（或更改所有者）命令：\n\n```\n\
  kali >chown ➊bob ➋/tmp/bobsfile\n```\n\n在这里，我们输入命令、我们想要授予所有权的用户名，然后是相关文件的位置和名称。该命令将\
  \ Bob 账户 ➊ 授予了 `bobsfile` ➋ 的所有权。\n\n### 向组授予所有权\n\n要将文件的所有权从一个组转移到另一个组，我们可以使用 `chgrp`（或更改组）命令。\n\
  \n黑客通常倾向于单兵作战而不是小组工作，但几个黑客或渗透测试人员合作完成项目的情况也未曾听说，在这种情况下，使用组是必要的。例如，你可能有一组渗透人员和一组安全团队成员在同一个项目中。在这个例子中，渗透人员属于\
  \ root 组，这意味着他们拥有所有的权限和访问权限。root 组需要访问黑客工具，而安全人员只需要访问防御性工具，如入侵检测系统（IDS）。假设 root\
  \ 组下载并安装了一个名为 `newIDS` 的程序；此时 root 组需要将所有权更改为安全组，以便安全组可以随心使用它。要做到这一点，root 组只需输入以下命令：\n\
  \n```\nkali >chgrp ➊security ➋newIDS\n```\n\n该命令将 `newIDS` ➋ 的所有权传递给安全 ➊ 组。\n\n\
  现在，你需要知道如何检查这些分配是否生效。你将通过检查文件的权限来实现这一点。\n\n### 检查权限\n\n当你想要知道某个文件或目录授予了哪些用户什么权限时，使用\
  \ `ls` 命令配合 `-l`（长格式）开关，以长格式显示目录内容——此列表将包含权限。在列表 5-1 中，我使用 `ls -l` 命令处理 `/usr/share/hashcat`\
  \ 文件（我最喜欢的密码破解工具之一），以便查看我们可以从这些文件中心学习到什么。\n\n```\nkali >ls –l /usr/share/hashcat\n\
  total 32952\ndrwxr-xr-x 5 root root 4096 Dec 5 10:47\n-rw-r--r-- 1 root root 3368504\
  \ June 28 2018 hashcat.hcstat\n-rw-r--r-- 1 root root 3368504 June 28 2018 hashcat.hct\n\
  drwxr-xr-x 2 root root 4096 Dec 5 10:47\ndrwxr-xr-x 2 root root 4096 Dec 5 10:47\n\
  drwxr-xr-x 3 root root 4096 Dec 5 10:47\n```\n\n列表 5-1：使用长列表检查文件权限\n\n在每一行中，我们获取关于信息：\n\
  1. 文件类型\n2. 分别针对所有者、组和用户的文件的权限\n3. 链接数（此主题超出了本书范围）\n4. 文件的所有者\n5. 以字节为单位的文件大小\n\
  6. 文件创建或最后修改的时间\n7. 文件名\n\n现在，让我们关注每行左侧那些看似不可理解的字母和连字符组成的字符串。它们告诉我们某项是文件还是目录，以及具有什么权限（如果有的话）。\n\
  \n\n\n这样的二进制集合可以通过将其转换为 `octal`（八进制）轻松表示为单个数字，八进制是一种从 0 开始到 7 结束的八位数字系统。一个八进制数字代表三个二进制位，这意味着我们可以用一个数字表示整个\
  \ `rwx` 权限组。表 5-1 包含了所有可能的权限组合及其八进制和二进制表示。\n\n**表 5-1：** 权限的八进制和二进制表示\n\n| 二进制 |\
  \ 八进制 | rwx |\n| --- | --- | --- |\n| 000 | 0 | --- |\n| 001 | 1 | --x |\n| 010\
  \ | 2 | -w- |\n| 011 | 3 | -wx |\n| 100 | 4 | r-- |\n| 101 | 5 | r-x |\n| 110 |\
  \ 6 | rw- |\n| 111 | 7 | rwx |\n\n利用这些信息，让我们来看一些例子。首先，如果我们只想设置读取权限，可以查阅 表 5-1 并找到读取权限的值：\n\
  \n```\nr w x\n4 - -\n```\n\n接下来，如果我们想将权限设置为 `wx`，可以使用相同的方法并查找设置 `w` 和设置 `x` 的别值：\n\
  \n```\nr w x\n- 2 1\n```\n\n注意在 表 5-1 中，`-wx` 的八进制表示为 3，这并不巧合，它正好等于我们分别设置 `w` 和\
  \ `x` 的两个值相加得到的结果相同：`2 + 1 = 3`。\n\n最后，当所有三个权限都开启时，看起来是这样的：\n\n```\nr w x\n4 2 1\n\
  ```\n\n并且 `4 + 2 + 1 = 7`。在这里，我们看到在 Linux 中，当所有权限开关都打开时，它们由等价的八进制 7 表示。\n\n所以，如果我们想为所有者、组和所有用户表示所有权限，可以这样写：\n\
  \n```\n7 7 7\n```\n\n这里就是快捷方法的用场。通过向 `chmod` 传递三个八进制数字（每个 `rwx` 组一个），后跟文件名，我们可以更改该文件针对种类型用户的权限。在命令行中输入以下内容：\n\
  \n```\nkali >chmod 774 hashcat.hcstat\n```\n\n查看 表 5-1，我们可以看到此语句赋予了所有者所有权限、组所有权限，而其他人（其他）只有读取权限。\n\
  \n现在我们可以通过在目录上运行 `ls -l` 并查看 `hashcat.hcstat` 行来检查这些权限是否已更改。现在进入目录并运行该命令：\n\n```\n\
  kali >ls -l\n\ntotal 32952\ndrwxr-xr-x 5     root  root          4096   Dec 5 10:47\
  \  charsets\n➊ -rwxrwxr-- 1      root  root      33685504   June 28 2018 hashcat.hcstat\n\
  \   -rw-r--r-- 1      root  root      33685504   June 28 2018 hashcat.hctune\n \
  \  drwxr -xr-x 2      root  root          4096   Dec 5 10:47  masks\n   drwxr -xr-x\
  \ 2      root  root          4096   Dec 5 10:47  OpenCL\n   drwxr -xr-x 3      root\
  \  root          4096   Dec 5 10:47  rules\n```\n\n你应该在 `hashcat.hcstat` 行的 ➊ 左侧看到\
  \ `-rwxrwxr--`。这证实了 `chmod` 调用成功更改了文件的权限，赋予了所有者和组执行该文件的能力。\n\n### 使用 UGO 更改权限\n\n\
  虽然数字方法可能是 Linux 中更改权限最常用的方法，但有些人人认为 `chmod` 的符号方法更直观——两种方法效果都一样好，所以只需找到适合自己的方法即可。符号方法通常被称为\
  \ `UGO` 语法，它代表 `user`（用户或所有者）、`group`（组）和 `others`（其他）。\n\nUGO 语法非常简单。输入 `chmod`\
  \ 命令，然后输入你想要更改权限的用户，提供 `u` 代表用户、`g` 代表组或 `o` 代表其他，后跟三个运算符之一之一：\n\n- `-` 移除权限\n-\
  \ `+` 添加权限\n- `=` 设置权限\n\n在运算符之后，包含你想要添加或移除的权限 (`rwx`)，最后是应用该操作的文件名。\n\n所以，如果你想从拥有文件\
  \ `hashcat.hcstat` 的用户中移除写入权限，可以输入以下内容：\n\n```\nkali >chmod u-w hashcat.hcstat\n\
  ```\n\n这条命令的意思是从用户 (`u`) 中为 `hashcat.hcstat` 移除写入 (`w`) 权限。\n\n现在当再次再次使用 `ls –l`\
  \ 检查权限时，你应该看到 `hashcat.hcstat` 文件不再对用户具有写入权限：\n\n```\nkali >ls -l\n\ntotal 32952\n\
  drwxr-xr-x 5     root  root          4096   Dec 5 10:47  charsets\n-r-xr-xr-- 1\
  \      root  root      33685504   June 28 2018 hashcat.hcstat\n-rw-r--r-- 1    \
  \  root  root      33685504   June 28 2018 hashcat.hctune\ndrwxr -xr-x 2      root\
  \  root          4096   Dec 5 10:47  masks\ndrwxr -xr-x 2      root  root      \
  \    4096   Dec 5 10:47  OpenCL\ndrwxr -xr-x 3      root  root          4096   Dec\
  \ 5 10:47  rules\n```\n\n你也可以仅通过一个命令更改多个权限。如果你想同时给用户和其他用户（非用户）执行权限，可以输入：\n\n```\n\
  kali >chmod u+x,o+x hashcat.hcstat\n```\n\n这条命令告诉 Linux 为 `hashcat.hcstat` 赋予执行权限：\n\
  \n```\nkali >ls -l\n\ntotal 32952\ndrwxr-xr-x 5     root  root          4096   Dec\
  \ 5 10:47  charsets\n-r-xr-xr-- 1      root  root      33685504   June 28 2018 hashcat.hcstat\n\
  -rw-r--r-- 1      root  root      33685504   June 28 2018 hashcat.hctune\ndrwxr\
  \ -xr-x 2      root  root          4096   Dec 5 10:47  masks\ndrwxr -xr-x 2    \
  \  root  root          4096   Dec 5 10:47  OpenCL\ndrwxr -xr-x 3      root  root\
  \          4096   Dec 5 10:47  rules\n```\n\n这里就是快捷方法的用法。如果我们想为所有者、组和所有用户表示所有权限，可以这样写：\n\
  \n```\nkali >chmod 774 hashcat.hcstat\n```\n\n查看 表 5-1，我们可以看到此语句赋予了所有者所有权限、组所有权限，而其他人（其他）只有读取权限。\n\
  \n现在我们可以通过在目录上运行 `ls -l` 并查看 `hashcat.hcstat` 行来检查这些权限是否已更改。现在进入目录并运行该命令：\n\n```\n\
  kali >ls -l\n\ntotal 32952\ndrwxr-xr-x 5     root  root          4096   Dec 5 10:47\
  \  charsets\n➊ -rwxrwxr-- 1      root  root      33685504   June 28 2018 hashcat.hcstat\n\
  \   -rw-r--r-- 1      root  root      33685504   June 28 2018 hashcat.hctune\n \
  \  drwxr -xr-x 2      root  root          4096   Dec 5 10:47  masks\n   drwxr -xr-x\
  \ 2      root  root          4096   Dec 5 10:47  OpenCL\n   drwxr -xr-x 3      root\
  \  root          4096   Dec 5 10:47  rules\n```\n\n你应该在 `hashcat.hcstat` 行的 ➊ 左侧看到\
  \ `-rwxrwxr--`。这证实了 `chmod` 调用成功更改了文件的权限，赋予了所有者和组执行该文件的能力。\n\n### 使用 UGO 更改权限\n\n\
  虽然数字方法可能是 Linux 中更改权限最常用的方法，但有些人人认为 `chmod` 的符号方法更直观——两种方法效果都一样好，所以只需找到适合自己的方法即可。符号方法通常被称为\
  \ `UGO` 语法，它代表 `user`（用户或所有者）、`group`（组）和 `others`（其他）。\n\nUGO 语法非常简单。输入 `chmod`\
  \ 命令，然后输入你想要更改权限的用户，提供 `u` 代表用户、`g` 代表组或 `o` 代表其他，后跟三个运算符之一：\n\n- `-` 移除权限\n- `+`\
  \ 添加权限\n- `=` 设置权限\n\n在运算符之后，包含你想要添加或移除的权限 (`rwx`)，最后是应用该操作的文件名。\n\n所以，如果你想从拥有文件\
  \ `hashcat.hcstat` 的用户中移除写入权限，可以输入以下内容：\n\n```\nkali >chmod u-w hashcat.hcstat\n\
  ```\n\n这条命令的意思是从用户 (`u`) 中为 `hashcat.hcstat` 移除写入 (`w`) 权限。\n\n现在当再次再次使用 `ls –l`\
  \ 检查权限时，你应该看到 `hashcat.hcstat` 文件不再对用户具有写入权限：\n\n```\nkali >ls -l\n\ntotal 32952\n\
  drwxr-xr-x 5     root  root          4096   Dec 5 10:47  charsets\n-r-xr-xr-- 1\
  \      root  root      33685504   June 28 2018 hashcat.hcstat\n-rw-r--r-- 1    \
  \  root  root      33685504   June 28 2018 hashcat.hctune\ndrwxr -xr-x 2      root\
  \  root          4096   Dec 5 10:47  masks\ndrwxr -xr-x 2      root  root      \
  \    4096   Dec 5 10:47  OpenCL\ndrwxr -xr-x 3      root  root          4096   Dec\
  \ 5 10:47  rules\n```\n\n你也可以仅通过一个命令更改多个权限。如果你想同时给用户和其他用户（非用户）执行权限，可以输入：\n\n```\n\
  kali >chmod u+x,o+x hashcat.hcstat\n```\n\n这条命令告诉 Linux 为 `hashcat.hcstat` 赋予执行权限：\n\
  \n```\nkali >ls -l\n\ntotal 32952\ndrwxr-xr-x 5     root  root          4096   Dec\
  \ 5 10:47  charsets\n-r-xr-xr-- 1      root  root      33685504   June 28 2018 hashcat.hcstat\n\
  -rw-r--r-- 1      root  root      33685504   June 28 2018 hashcat.hctune\ndrwxr\
  \ -xr-x 2      root  root          4096   Dec 5 10:47  masks\ndrwxr -xr-x 2    \
  \  root  root          4096   Dec 5 10:47  OpenCL\ndrwxr -xr-x 3      root  root\
  \          4096   Dec 5 10:47  rules\n```\n\n### 使用掩码设置更安全的默认权限\n\n正如你看到的，Linux\
  \ 自动分配基础权限——通常文件为 666，目录为 777。你可以使用 `umask` 方法更改每个用户创建的文件和目录的默认权限。`umask` 方法代表你想要从基础权限中移除的权限，以使其更安全。\n\
  \n`umask` 是一个三位十进制数字，对应三个权限数字，但 `umask` 数字是从权限数字中减去得到新的权限状态。这意味着当创建新文件或目录时，其权限设置为默认值减去\
  \ `umask` 的值，如图 5-1](#ch05.xhtml_ch05fig1) 所示。\n\n![image](img/f0057-01.jpg)\n\n\
  \n\n图 5-1：`umask` 取值 `022` 如何影响新文件和目录的权限\n\n例如，如果将 `umask` 设置为 `022`，原始默认权限为 `666`\
  \ 的新文件现在的权限将变为 `644`，这意味着所有者同时具有读和写权限，而组和其他所有用户仅具有读取权限。\n\n在 Kali 中，与大多数 Debian\
  \ 系统一样，`umask` 预配置为 `022`，这意味着 Kali 默认的文件权限为 `644`，目录权限为 `755`。\n\n`umask` 值对于系统上的所有用户并不通用。每个用户都可以在个人的\
  \ `.profile` 文件中文件和目录设置个人的默认 `umask` 值。若要在以用户身份登录时查看当前值，只需输入 `umask` 命令并注意返回的内容。若要更改用户的\
  \ `umask` 值，请编辑 `/home/username/.profile` 文件，例如，添加 `umask 007` 以设为仅用户及其用户组成员拥有权限。\n\
  \n### 特殊权限\n\n除了三种通用权限 `rwx` 之外，Linux 还有三种稍微复杂的特殊权限。这些特殊权限是设置用户 ID（或 SUID）、设置组 ID（或\
  \ SGID）和粘滞位（sticky bit）。我将在接三个章节中逐一讨论。\n\n### 使用 SUID 授予临时 root 权限\n\n如你现在所知，用户只有在具有执行特定文件的权限时才能执行该文件。如果用户只有读取和/或写入权限，他们就无法执行。这看起来可能简单易见，但这条规则是有例外的。\n\
  \n你可能遇到过一种情况：某个文件在执行期间对所有用户（即使不是 root 用户）都需要 root 用户的权限。例如，允许用户更改密码的文件需要访问 `/etc/shadow`\
  \ 文件——Linux 中存储用户密码的文件——而该文件需要 root 用户权限才能执行。在这种情况下，你可以通过在程序上设置 SUID 位来临时授予所有者执行该文件的权限。\n\
  \n基本上，SUID 位表示任何用户都可以以所有者的权限执行该文件，但这些权限不会超出对该文件的使用范围。\n\n要设置 SUID 位，请在普通权限之前输入 `4`，因此新权限为\
  \ `644` 的文件在设置 SUID 位后将表示为 `4644`。\n\n在文件上设置 SUID 不是一个典型用户会做的事情，但如果你想这样做，将使用 `chmod`\
  \ 命令，例如 `chmod 4644 filename`。\n\n### 使用 SGID 授予 root 用户的组权限\n\nSGID 也授予临时的提升权限，但它授予的是文件所有者所在组的权限，而不是文件所有者的权限。这意味着，在设置了\
  \ SGID 位的情况下，没有执行权限的人只要所有者属于具有执行该文件权限的组就可以执行该文件。\n\nSGID 位应用于目录时的工作原理略有不同：当在目录上设置该位时，在该目录中创建的新文件的所有权将属于目录创建者的组，而不是文件创建者的组。这在目录被多个用户共享时非常有用。该组中的所有用户都可以执行该文件（文件），而不仅仅是单个用户。\n\
  \nSGID 位在普通权限之前表示为 `2`，因此结果权限为 `644` 的新文件在设置 SGID 位后将表示为 `2644`。同样，你将使用 `chmod`\
  \ 命令进行操作——例如，`chmod 2644 filename`。\n\n### 过时的粘滞位\n\n粘滞位（`sticky bit`）是一种可以设置在目录上的权限位，允许用户删除或重命名该目录内的文件。然而，粘滞位是旧版\
  \ Unix 系统的遗留，现代系统（如 Linux）会忽略它。因此，我在这里不再进一步讨论它，但你应该熟悉这个术语，因为你可能会在 Linux 世界听到它。\n\
  \n### 特殊权限、权限提升与黑客\n\n作为一名黑客，这些特殊权限可以用于通过`权限提升`（privilege escalation）来利用 Linux 系统，使得普通用户获得\
  \ root 或系统管理员权限以及相关权限。有了 root 权限，你可以在系统上做任何事情。\n\n实现此点的一种方法是利用 SUID 位。系统管理员或软件开发人员可能会在程序上设置\
  \ SUID 位，允许该程序以 root 权限访问文件。例如，需要更改密码的脚本通常设置了 SUID 位。你，作为黑客，可以使用该权限获得临时 root 权限并进行恶意活动，例如访问\
  \ `/etc/shadow` 中的密码。\n\n让我们在 Kali 系统中寻找设置了 SUID 位的文件来尝试一下。在第 1 章中，我向你介绍了 `find`\
  \ 命令。我们将利用它的功能来寻找设置了 SUID 位的文件。\n\n你可能记得，`find` 命令非常强大，但语法比其他一些定位命令（如 `locate` 和\
  \ `which`）稍微复杂一些。如果需要，请花时间回顾第 1 章中的 `find` 语法。\n\n在这种情况下，我们希望在文件系统的任何地方查找 root 用户或其他系统管理员权限为\
  \ `4000` 的文件。要实现这一点，我们可以使用以下命令：\n\n```bash\nfind / -user root -perm 4000\n```\n\n\
  通过此命令，我们让 Kali 从根目录 `/` 开始查找属于 root（user root）且权限设置为 4000（perm）的文件。\n\n当我们运行此命令时，得到了如列表\
  \ 5-2 所示。\n\n```bash\nkali ~cd /usr/bin\nkali ~ls -l\n```\n\n```\n-rwxr-xr-x 1 root\
  \ root 176272 Jul 18 2018 stunnel4\n-rwxr-xr-x 1 root root 26696 Mar 17 2018 sucrack\n\
  -rws-xr-x 1 root root 140944 Jul 5 2018 sudo\n```\n\n列表 5-3：识别设置了 SUID 位的文件\n\n\
  注意在第一组权限（所有者）处，`s` 代替 `x`。这就是 Linux 表示设置了 SUID 位的方式。这意味着运行 `sudo` 文件的任何人都拥有 root\
  \ 权限，这对于系统管理员来说是一个安全问题，对于黑客来说是一个潜在的攻击向量。例如，某些应用程序需要访问 `/etc/shadow` 文件才能成功完成任务。如果攻击者能够控制该程序，他们就可以利用该程序访问\
  \ Linux 系统上的密码。\n\nLinux 拥有一良好的安全系统，保护文件和目录免受未经授权的访问。职业黑客需要基本了解该系统，不仅是为了保护自己的文件，还为了执行新的工具和文件。在某些情况下，黑客可以利用\
  \ SUID 和 SGID 权限从普通用户提升到 root 用户。\n\n## 总结\n\nLinux 使用权限保护用户或组的文件和目录免受其他用户的访问，可以用于防御。你现在应该知道如何管理这些权限，以及如何利用该安全系统的漏洞——特别是\
  \ SUID 和 SGID 位。\n\n**练习题**\n\n在继续第 6 章 之前，通过完成以下练习来测试你在本章中学到的知识：\n\n\n\n\n1. 选择一个目录并对其运行长列出命令。注意文件和目录的权限。\n\
  2. 选择一个你没有执行权限的文件，并使用 `chmod` 命令为自己赋予执行权限。尝试同时使用数字法（777）和 UGO 方法。\n3. 选择另一个文件并使用\
  \ `chown` 更改其所有者。\n4. 使用 `find` 命令找到所有设置了 SGID 位的文件。\n\n## 6 进程管理\n\n![image](img/common01.jpg)\n\
  \n在任何给定时刻，Linux 系统通常会有数百个、甚至是数千个进程同时运行。`process`（进程）简单来说就是一个运行并使用资源的程序。它包括终端、Web\
  \ 服务器、任何正在运行的命令、任何数据库、GUI 界面等。任何优秀的 Linux 运维员——特别是黑客——都需要理解如何管理他们的进程以优化系统性能。例如，一旦黑客控制了目标系统，他们可能想要找到并停止某个进程，比如防病毒软件或防火墙。要做到这一点，黑客首先需要知道如何找到该进程。黑客可能还想设置扫描脚本定期运行以发现漏洞系统，因此我们还将查看如何调度此类脚本。\n\
  \n在本章中，你将学习管理这些进程。首先，你将学会查看和查找进程，以及如何发现哪些进程占用资源最多。然后，你将学习通过在后台运行进程、为它们设置优先级以及在必要时杀掉它们（不涉及流血）来管理进程。最后，你将学习调度进程在指定的日期、日期和特定时间运行。\n\
  \n## 查看进程\n\n在大多数情况下，管理进程的第一步是查看系统上运行了哪些进程。查看进程的主要工具——也是 Linux 管理员的好朋友之一——是 `ps`\
  \ 命令。在命令行中运行它查看活跃的进程：\n\n```\nkali >ps\nPID    TTY      TIME      CMD\n39659  pts/0\
  \    00:00:01  bash\n39665  pts/0    00:00:00  ps\n```\n\nLinux `kernel` 按照进程创建的顺序为每个进程分配唯一的\
  \ `process ID (PID)`。在处理这些进程时，通常需要指定它们的 PID，因此注意进程的 PID 比进程名称重要得多。单的 `ps` 命令并没有提供太多信息。运行不带任何选项的\
  \ `ps` 命令会列出当前登录用户（在本例中为 root）启动并在该终端运行的进程。在这里，它简单表示 bash shell 已打开并运行了 `ps` 命令。我们想要并需要更多信息，特别是由其他用户和系统后台运行的进程。\n\
  \n如果没有这些信息，我们对系统实际发生了什么了解甚少。运行带有 `aux` 选项的 `ps` 命令将显示所有用户在系统上运行的进程，如列表 6-1 所示。注意不要给这些选项加横杠且使用小写；因为\
  \ Linux 是大小写敏感的，使用大写将给你完全不同的结果。\n\n```\nkali >ps aux\nUSER  PID  %CPU  %MEM    VSZ\
  \     RSS TTY     STAT   TIME   COMMAND\nRoot     1     0.0   0.4     202540  6396\
  \ ?     Ss   Apr24     0:46  /sbin/init\nRoot     2     0.0   0.0           0 ?\
  \     S     Apr24     0:00  [kthreadd]\nRoot     3     0.0   0.0           0 ? \
  \    S     Apr24     0:26  [ksoftirqd/0]\n--ip--\nroot  39706  0.0   0.2   36096\
  \  3204 pts/0  R+ 15:05  0:00  ps\n```\n列表 6-1：使用 aux 选项查看所有用户的进程\n\n你可以看到，此命令现在列出了这么多进程，可能超出了屏幕底部。第一个进程是\
  \ `init`，列在最后一列，最后一个进程是我们运行用于显示的命令 `ps`。许多细节（PID、%CPU、TIME 等）在你的系统中可能不同，但格式应该是相同的。对于我们的目的，这里是最重要的列：\n\
  - `USER`: 调用进程的用户\n- `PID`: 进程 ID\n- `%CPU`: 该进程使用的 CPU 百比\n- `%MEM`: 该进程使用的内存百分比\n\
  - `COMMAND`: 启动进程的命令名称\n\n通常，要对进程执行任何操作，必须指定其 PID。让我们看看如何利用这个标识符的优势。\n\n### 按进程名过滤\n\
  \n当我们查询或对进程执行操作时，通常不希望屏幕上显示所有进程。这仅仅是信息量过大的问题。大多数时候，我们想要找到单个进程的信息。为此，我们可以使用过滤命令 `grep`，我在第一章中介绍过。为了演示，我们将使用\
  \ Metasploit 框架，它是最广泛使用的框架，也是几乎每个黑客的朋友。你的 Kali 系统自带了它，请通过以下命令启动 Metasploit：\n\n\
  ```\nkali >msfconsole\n```\n\n一旦框架启动，让我们看看是否能在进程列表中找到它。为此，使用 `ps aux` 命令，然后通过管道\
  \ (`|`) 传递给 `grep` 查找字符串 `msfconsole`，如列表 6-2 所示。\n\n```\nkali >ps aux | grep msfconsole\n\
  root 39756  0.0  0.0  4304  716 pts/2 Ss+  15:13  0:00 sh -c postgresql start &&\
  \ msfdb init msfconsole\nroot 39759  35.1 15.2  4304 27888 pts/2 Sl+  15:13  1:36\
  \ ruby /usr/bin/msfconsole\nroot 39892  0.0  0.0  4304  940 pts/2 S+  15:18  0:00\
  \ grep msfconsole\n```\n列表 6-2：过滤 ps 搜索以查找特定进程\n\n从此列表过滤输出中，你应该看到所有匹配 `msfconsole`\
  \ 术语的进程。Metasploit 使用的 PostgreSQL 数据库首先显示，然后来自 `/usr/bin/msfconsole` 的 `msfconsole`\
  \ 程序本身。最后，你应该能看到你用于查找 `msfconsole` 的 `grep` 命令。注意输出没有包含 `ps` 的列头。由于关键词 `msfconsole`\
  \ 不在表头中，因此它没有被显示。尽管如此，结果的格式是相同的。\n\n从中，你可以了解到一些重要信息。例如，如果你需要知道 Metasploit 使用了多少资源，可以查看第三列（CPU\
  \ 列），看到它正在使用 35.1% 的 CPU，并查看第四列看到它使用了系统 15.2% 的内存。那可不少。它是个大胃口！\n\n### 使用 top 寻找最贪婪进程\n\
  \n当你输入 `ps` 命令时，进程按启动顺序排列的，由于内核按照启动顺序分配 PID，你看到的是按 PID 数字排序的进程。\n\n在许多情况下，我们想知道哪些进程占用资源最多。这时\
  \ `top` 命令派上用场了，因为它按使用的资源进行排序，从最大的开始。与提供进程快照的 `ps` 命令不同，`top` 会动态刷新列表——默认每 10 秒刷新一次。你可以观察并监控那些贪婪资源的进程，如列表\
  \ 6-3 所示。\n\n```\nkali >top\ntop - 15:31:17 up 2 days, 50, 4 users, load average:\
  \ 0.00, 0.04, 0.09\nTasks: 176 total, 1 running, 175 sleeping, 0 stopped, 0 zombie\n\
  %Cpu(s): 1.3 us, 0.7 sy, 0.0 ni, 97.4 id, 0.0 wa, 0.0 hi 0.0 si 0.0\nKiB Mem : 1491220\
  \ total, 64848 free, 488272 used, 938100 buff/cache\nKiB Swap : 1046524 total, 1044356\
  \ free, 2168 used. 784476 avail Mem\n```\n\n\n\n\n\n```\n39759 root  20    0   \
  \ 893180  247232  11488  S  0.7   16.6   1:47.88  ruby\n39859 root  20    0    27308\
  \   16796   14272  S  0.3    1.2    1:47.88  postgres\n39933 root  20    0    293936\
  \   61500   29108  S  0.7    4.1    1:47.88  Xorg\n--snip--\n```\n\n### 列表 6-3：使用\
  \ top 查找占用最高的进程\n\n系统管理员经常会在终端中运行 `top` 来监控进程资源的使用情况。作为黑客，你可能也这样做，特别是当你的系统上有多个任务在运行时。在\
  \ `top` 运行时，按下 `H` 或 `?` 键将显示交互式命令列表，按下 `Q` 将退出 `top`。你很快就会再次使用 `top` 来在第 65 页的““[使用\
  \ nice 更改进程优先级””以及第 66 页的““[杀死进程””中管理你的进程。\n\n## 管理进程\n\n黑客经常需要进行多进程操作，而像 Kali 这样的操作系统非常适合这种操作。黑客在运行漏洞扫描器和利用程序的同时，可能还在运行一个端口扫描器。这要求黑客高效地管理这些进程，以最度地利用系统资源并完成任务。在本节中，我将向你展示如何管理多个进程。\n\
  \n### 使用 nice 更改进程优先级\n\n你并不经常在黑客的语境下听到 `nice` 这个词，但在这里你会听到。`nice` 命令用于影响内核对进程优先级的划分。正如你运行\
  \ `ps` 命令时看到的，系统上有许多进程同时运行，并且它们都在竞争可用资源。内核对进程的优先级拥有最终决定权，但你可以使用 `nice` 来*建议*提高某个进程的优先级。\n\
  \n使用 `nice` 一词的背后理念是：当你使用它时，你是在决定对*其他*用户有多“友好”：如果你的进程正在使用大部分系统资源，那么你就不太友好。\n\n`nice`\
  \ 的值范围从 –20 到 +19，零为默认值（参见图 6-1）。高 `nice` 值意味着低优先级，而低 `nice` 值意味着高优先级（当你对其他用户和进程不那么友好时）。当进程启动时，它会继承父进程的\
  \ `nice` 值。进程所有者可以降低进程的优先级，但不能增加其优先级。当然，超级用户或 `root` 用户可以任意设置任何他们喜欢的 `nice` 值。\n\
  \n![image](img/f0065-01.jpg)\n\n*图 6-1：Niceness 优先级值*\n\n当你启动一个进程时，可以使用 `nice` 命令设置优先级，并在进程开始运行后使用\
  \ `renice` 命令修改优先级。这两个命令的语法略有不同，可能会引起混惑。`nice` 命令要求你*增加* `nice` 值，而 `renice` 命令需要的是\
  \ nice 值的*绝对值*。让我们看一个示例来演示。\n\n### 在启动进程时设置优先级\n\n为了演示目的，假设我们有一个名为 `slowprocess`\
  \ 的进程，位于 `/bin/slowprocess`。如果我们想让它加快完成速度，可以使用 `nice` 命令启动进程：\n\n```\nkali >nice\
  \ -n -10 /bin/slowprocess\n```\n\n此命令将 `nice` 值递增 -10，从而提高了它的优先级并为其分配更多资源。\n\n另一方面，如果我们想对同类用户和进程友好一点，并给\
  \ `slowprocess` 分配较低的优先级，我们可以将它的 `nice` 值正增加 10：\n\n```\nkali >nice -n 10 /bin/slowprocess\n\
  ```\n\n在你当前运行的某个进程上尝试一下，然后运行 `ps` 看看它是否发生了变化。\n\n### 使用 renice 更改运行中进程的优先级\n\n`renice`\
  \ 命令接受 –20 到 19 之间的绝对值，并将优先级设置为特定级别，而不是从它启动时的级别进行增加或减少。此外，`renice` 需要目标进程的 `PID`\
  \ 而不是名称。因此，如果 `slowprocess` 在你的系统上占用了异常大量的资源，而你想给它分配较低的优先级，从而允许其他进程获得更高的优先级和更多资源，你可以\
  \ `renice` `slowprocess`（其 `PID` 为 `6996`）并给它一个高得优先级：\n\n```\nkali >renice 20 6996\n\
  ```\n\n### 杀死进程\n\n有时，某个进程会消耗过多资源；通常，这些进程是合法的，但可能有恶意进程正在占用资源，你想要杀死它们。\n\n如果你只是想用\
  \ `HUP` 信号重启进程，请使用 `kill` 的 `-1` 选项，如下：\n\n```\nkali >kill -1 6996\n```\n\n在僵尸或恶意进程的情况下，你可能想向进程发送\
  \ `kill -9` 信号（绝对杀死信号）。这可以确保进程被终止：\n\n```\nkali >kill -9 6996\n```\n\n如果你不知道进程的\
  \ `PID`，可以使用 `killall` 命令来杀死进程。该命令接受进程名称作为参数，而不是 `PID`。\n\n例如，你可以这样终止一个假设的 `zombieprocess`：\n\
  \n```\nkali >killall -9 zombieprocess\n```\n\n最后，你也可以在 `top` 命令中终止进程。只需按下 `K` 键，然后输入故障进程的\
  \ `PID` 即可。\n\n\n\n\n在 Linux 中，无论你是在命令行界面还是图形用户界面（GUI），你都在一个 shell（终端）中工作。运行的所有命令都是在该\
  \ shell 内部执行的，即使它们是从图形界面启动的。当你执行一个命令时，shell 会等待该命令执行完毕，才会提供下一个命令提示符。\n\n有时，你可能希望某个进程在后台运行，而不是在当前终端中等待它完成。例如，假设我们想在文本编辑器中编写脚本，因此通过输入以下命令调用了文本编辑器（`leafpad`）：\n\
  \n```bash\nkali >leafpad newscript\n```\n\n在这种情况下，`bash` shell 将打开 `leafpad` 文本编辑器来创建\
  \ `newscript`。当我们在编辑器中工作时，终端被运行的编辑器所占据了。如果我们回到终端，应该会看到它正在运行我们的编辑器，并且我们没有新的提示符来允许我们输入更多命令。\n\
  \n当然，我们可以打开另一个终端来运行更多命令，但节省资源和屏幕空间的更好选择是让文本编辑器在后台运行。在后台运行进程意味着它将继续运行，而不需要终端。这样一来，终端就可以释放出来处理其他任务。\n\
  \n要在后台启动文本编辑器，只需在命令末尾加上一个符号（`&`），如下：\n\n```bash\nkali >leafpad newscript &\n```\n\
  \n现在，当文本编辑器打开时，终端会返回一个新的命令提示符，这样我们就可以编辑 `newscript` 的同时在系统上输入其他命令。对于任何在你需要使用终端可能运行较长的进程，这都是有效的。作为一名黑客，你会发现这对于在多个终端中运行多个任务以节省资源和空间很有。\n\
  \n### 将进程移动到前台\n\n如果你想将正在后台运行的进程移动到前台，可以使用 `fg`（foreground）命令。`fg` 命令需要你想返回到前台的进程的\
  \ `PID`（进程 ID），所示：\n\n```bash\nkali >fg 1234\n```\n\n如果你不知道 `PID`，可以使用 `ps` 命令来查找它。\n\
  \n### 调度进程\n\nLinux 系统管理员和黑客经常需要调度进程在一天中的特定时间运行。例如，系统管理员可能想要调度系统备份在每个周六晚上凌晨 2 点运行。黑客可能想设置一个脚本定期运行以侦察，寻找开放端口或漏洞。在\
  \ Linux 中，你至少可以通过两种方式实现这一点：使用 `at` 和 `crond`。\n\n`at` 命令是一个守护进程——后台进程——用于调度任务在未来的某个点运行一次。`crond`\
  \ 更适合调度每天、每周或每月发生一次的任务，我们将在第 16 章详细介绍。\n\n我们使用 `at` 守护进程来调度未来执行某个命令或一组命令。语法简单来说\
  \ `at` 命令后跟执行进程的时间。时间参数可以用各种格式提供。表 6-2 包含了最常见的 `at` 时间格式。\n\n**表 6-2：at 命令接受的时间格式**\n\
  \n| 时间格式 | 含义 |\n| --- | --- |\n| at 7:20pm | 调度在今天下午 7:20 运行 |\n| at 7:20pm June\
  \ 25 | 调度在 6 月 25 日下午 7:20 运行 |\n| at noon | 调度在今天中午运行 |\n| at noon June 25 | 调度在\
  \ 6 月 25 日中午运行 |\n| at tomorrow | 调度在明天运行 |\n| at now + 20 minutes | 调度从当前时间起 20\
  \ 分钟后运行 |\n| at now + 10 hours | 调度从当前时间起 10 小时后运行 |\n| at now + 5 days | 调度从当前日期起\
  \ 5 天后运行 |\n| at now + 3 weeks | 调度从当前日期 3 周后运行 |\n| at 7:20pm 06/25/2019 | 调度在\
  \ 2019 年 6 月 25 日下午 7:20 运行 |\n\n当你输入指定的时间进入 `at` 守护进程时，它会进入交互模式，你会看到一个 `at>` 提示符。在这里输入你想要在指定时间执行的命令：\n\
  \n```bash\nkali >at 7:20am\nat >/root/myscanningscript\n```\n\n这段代码段将调度 `myscanningscript`\
  \ 在今天上午 7:20 执行。\n\n## 总结\n\n管理 Linux 的进程是每位 Linux 用户和黑客的关键技能。你必须能够查看、查找、杀死（kill）、调整优先级和调度进程，以最优化的方式管理你的\
  \ Linux 实例。黑客通常需要找到目标机器上想要杀掉的进程，例如防病毒软件或防火墙。他们还需要在攻击中管理多个进程并对它们进行优先级排序。\n\n**练习**\n\
  \n在进入第 7 章之前，请通过完成以下练习来尝试从本章中学到的技能：\n\n1. 在你的系统上运行带有 `aux` 选项的 `ps` 命令，并哪个进程是第一个，哪个是最后一个。\n\
  2. 运行 `top` 命令，并记录占用最多的两个进程。\n3. 使用 `kill` 命令杀死占用资源最多的进程。\n4. 使用 `renice` 命令降低运行进程的优先级。\n\
  5. 使用文本编辑器创建一个名为 `myscanning` 的脚本，然后调度它在下周三凌晨 1 点运行。\n\n## 7 环境变量\n\n为了从系统中获得最大收益，你需要理解环境变量并精通管理它们，以实现性能、便利甚至是隐蔽性。然而，对于\
  \ Linux 新手来说，管理环境可能是最困难的部分。从技术上讲，变量分为两类：shell 变量和环境变量。\n\n环境变量是系统内置的全局变量，控制着系统给用户的界面、行为和“感觉”，并且会被任何子\
  \ shell 或进程继承。相反，shell 变量通常是小写的，并且仅在设置它们的 shell 中有效。为了避免过度解释，本章将涵盖环境变量和 shell 变量的一些基础实用技能，而不深入探讨区别。\n\
  \n变量简单来说是键值对形式的字符串。通常每个对看起来像 `KEY=value`。在有多个值的情况下，它们看起来像 `KEY=value1:value2`。和\
  \ Linux 中的大多数事物一样，如果值包含空格，则需要引号。在 Linux 中，你的环境就是你的 bash shell。每个用户（包括 root）都有组默认的环境变量，决定了系统的外观、行为感觉。你可以更改这些变量的值让系统运行更高效，根据个人需求定制工作环境，并在需要时掩盖踪迹。\n\
  \n### 查看和修改环境变量\n\n你可以从任何目录在终端输入 `env` 来查看你所有的默认环境变量，如下：\n\n```bash\nkali >env\n\
  XDG_VTNR=7\nSSHAGENT_PID=922\nXDG_SESSION_ID=2\nXDG_GREETER_DATA_DIR=/var/lib/lightdm/data/root\n\
  GLADE_PIXMAP_PATH=:echo\nTERM=xterm\nSHELL=/bin/bash\nUSER=root\nPATH=/usr/local/sbin\
  \ :/usr/local/bin:/usr/sbin:/sbin/bin\nHOME=/root\n```环境变量始终是大大写的，例如 `HOME`、`PATH`、`SHELL`\
  \ 等。这些只是系统自带的默认环境变量。用户也可以创建自己的变量，正如你所看到的，我们需要不同的命令才能将它们包含在输出中。\n\n\n\n\n要查看所有环境变量（包括\
  \ shell 变量、本地变量和 shell 函数，例如任何自定义变量和命令别名），请使用 `set` 命令。该命令将列出系统中特有的所有环境变量，在大多数情况下，输出的内容非常长，以至于无法在一个屏幕上全部显示。你可以使用\
  \ `set` 并将其管道到 `more` 命令，以更易于操作的方式逐行查看每个变量，如下所示：\n\n```\nkali >set | more\n```\n\
  \nBASH=/bin/bash\n\nBASHOPTS=checkwinsize:cmdlist:complete_fullquote:expand_aliases:extglob.....\n\
  \nBASH_ALIASES=()\n\nBASH_ARGC=()\n\nBASH_ARGV=()\n\n--snip--\n\n现在，变量列表将逐行填满一个屏幕，然后停止。当你按下\
  \ `ENTER` 时，终端将移动到下一行，带你进入下一个变量，因此你可以通过按或按住 `ENTER` 来滚动。正如你可能在第 2 章中记忆过的，每当你使用 `more`\
  \ 命令进行输出时，都可以输入 `q` 退出（或终止）并返回命令提示符。\n\n### 过滤特定变量\n\n虽然使用 `set` 配合 `more` 比直接查看\
  \ `set` 生成的巨大变量名列表更易管理，但如果你正在寻找特定的变量，可能仍然非常麻烦。相反，你可以使用过滤命令 `grep` 来查找你感兴趣的变量。\n\n\
  让我们以 `HISTSIZE` 变量为例。该变量包含了你的命令历史文件可以存储的最大命令数量。这些命令是你在本次会话之前在命令提示符中输入的任何命令，可以通过向上和向下方向键调回。注意，`HISTSIZE`\
  \ 并不存储命令本身，而是存储可以存储的数量。\n\n将你的 `set` 输出通过给 `grep` 来查找 `HISTSIZE` 变量，如下所示：\n\n```\n\
  kali >set | grep HISTSIZE\nHISTSIZE=1000\n```\n\n如你所见，该命令找到了变量 `HISTSIZE` 并显示了它的值。该变量的默认值在你系统中可能被设置为\
  \ 1000。这意味着终端默认将存储你最后 1,000 条命令。\n\n### 修改当前会话的变量值\n\n现在让我们看看如何更改变量的值。正如前面提到的，`HISTSIZE`\
  \ 变量包含存储在历史文件中命令数量的值。有时，你可能不希望系统保存过去的命令——也许是因为你不想在自己的系统或目标系统上留下任何你的活动痕迹。在这种情况下，你可以将\
  \ `HISTSIZE` 变量设置为 `0`，这样系统就不会存储你的任何历史命令。由于此变量只有一个值，要更改它，你只需像列表 7-1 所示的那样给它分配一个新值。\n\
  \n```\nkali >HISTSIZE=0\n```\n\n*列表 7-1：更改* `HISTSIZE* 的值*\n\n现在，当你尝试使用向上向下方向键调回命令时，什么都不会发生，因为系统不再存储它们了。这种做法很隐蔽，尽管可能会带来不便。\n\
  \n### 使变量值的更改持久化\n\n当你更改环境变量时，该更改仅发生在特定的环境中；在这种情况下，该环境是 bash shell 会话。这意味着当你关闭终端时，你任何更改都会丢失，值将恢复为默认值。如果你想让更改永久生效，需要使用\
  \ `export` 命令。该命令会将新值从你的当前环境（bash shell）导出到系统的其他部分，使其在你再次更改并导出之前，在每个环境中都可用。\n\n\
  变量是字符串，所以如果你为了稳见，在修改变量之前将变量内容保存到文本文件中并不是个坏主意。例如，由于我们即将更改 `PS1` 变量（该变量控制你在提示符中显示的信息），首先运行以下命令将现有值保存到当前用户主目录下的文本文件中：\n\
  \n```\nkali >echo $HISTSIZE> ~/valueofHISTSIZE.txt\n```\n\n这样，你就可以随时撤销更改。如果你想更谨慎一点，创建一个包含所有当前设置的文本文件，可以使用如下所示命令将\
  \ `set` 命令的输出保存到文本文件中：\n\n```\nkali >set> ~/valueofALLon01012017.txt\n```\n\n在更改变量后（正如我们在列表\
  \ 7-1 中所做的那样），你可以通过输入 `export` 然后你更改的变量名称来使更改持久化，如下所示：\n\n```\nkali >export HISTSIZE\n\
  ```\n\n现在，当你离开此环境并进入另一个环境时，`HISTSIZE` 仍然会被设置为 `0`。如果你想将 `HISTSIZE` 变量重置为 `1000`，只需输入：\n\
  \n```\nkali >HISTSIZE=1000\nkali >export HISTSIZE\n```\n\n这段代码段将你的 `HISTSIZE` 变量值设置为\
  \ 1,000 并将其导出到所有环境中。\n\n### 更改你的 Shell 提示符\n\n你的 shell 提示符是另一个环境变量，为你提供有用信息，例如你正在操作的用户以及你所在的目录。Kali\
  \ 的默认提示符格式如下：\n\nusername@hostname:current_directory\n\n如果你以 root 用户身份操作，默认提示符为：\n\
  \nroot@kali:current_directory\n\n你可以通过设置 `PS1` 变量来更改默认提示符中的名称。`PS1` 变量包含一组你想在提示符中显示的占位符，包括：\n\
  \n`\\u` 当前用户名\n\n`\\h` 主机名\n\n`\\W` 当前工作目录的基础\n\n如果你拥有多个系统或登录了多个账户，这非常有用。通过为不同的\
  \ shell 设置不同的 `\\u` 和 `\\h` 值，你可以一眼看出是谁以及在什么系统。\n\n让我们玩点有趣的，更改终端中的提示符。例如，你可以输入：\n\
  \n```\nkali >PS1=\"World's Hacker: #\"\nWorld's Hacker: #\n```\n\n现在，每当你使用这个终端时，都会提醒你是“World's\
  \ Hacker”。但你打开的任何后续终端仍然会有默认提示符，因为 `PS1` 变量只持有会话的值。如果你非常喜欢这个新提示符并希望在每个终端中看到它，你需要\
  \ `export` 它，如下所示：\n\n```\nkali >export PS1\n```\n\n这将更改持久化。\n\n再来？假设你真的想让终端看起来像\
  \ Windows 命令提示符。在这种情况下，你可以将提示符名称更改 `C:` 并保留 `\\w` 让提示符显示当前目录，正如列表 7-2 所示。\n\n```\n\
  kali >export PS1='C:\\w> '\nC:/tmp>\n```\n\n*列表 7-2：更改提示符并显示当前目录*\n\n让提示符显示当前目录通常有用，特别是对于初学者，所以当你更改\
  \ `PS1` 变量时需要考虑的问题。\n\n### 更改你的 PATH\n\n环境变量中的最重要的变量之一是 `PATH` 变量，它控制了 shell 在系统的何处查找你输入的命令，例如\
  \ `cd`、`ls` 和 `echo`。大多数命令位于 *sbin* 或 *bin* 子目录，例如 */usr/local/sbin* 或 *usr/local/bin*。如果\
  \ bash shell 在 `PATH` 变量中的目录中未找到命令，它将返回“command not found”错误，即使该命令确实存在于不在 `PATH`\
  \ 中的目录中。\n\n你可以通过对其内容使用 `echo` 来查找 `PATH` 变量中存储了哪些目录，如下所示：\n\n```\nkali >echo $PATH\n\
  /usr/local/sbin:usr/local/bin:/usr/sbin:/sbin/bin\n```\n\n\n\n\n这些是你的终端搜索任何命令的目录。例如，当你输入\
  \ `ls` 时，系统知道要在这些目录中查找 `ls` 命令，当它找到 `ls` 时，系统就会执行它。\n\n每个目录之间用冒号（`:`）隔开，不要忘记向 `PATH`\
  \ 中添加 `$` 内容符号。\n\n### 将内容添加到 PATH 变量\n\n你可能已经知道了解你的 `PATH` 变量中包含什么非常重要：如果你下载并安装了一个新工具——假设是\
  \ `newhackingtool` 安装到 `/root/newhackingtool` 目录——那么你只有在进入该目录时才能使用该工具的命令，因为该目录并不在\
  \ `PATH` 变量中。每当你想使用该工具时，都必须先导航到 `/root/newhackingtool`，如果你经常使用该工具，这会非常不方便。\n\n为了能够从*任何*目录使用这个新工具，你需要将存放该工具的目录添加到你的\
  \ `PATH` 变量中。\n\n要将 `newhackingtool` 添加到你的 `PATH` 变量中，请输入以下内容：\n\n```\nkali >PATH=$PATH:/root/newhackingtool\n\
  ```\n\n这会将原始 `PATH` 变量加上 `/root/newhackingtool` 目录赋值给新的 `PATH` 变量，因此该变量包含了它之前的所有内容，加上新的工具目录。\n\
  \n如果你再次检查 `PATH` 变量的内容，你应该会看到该目录已追加到 `PATH` 的末尾，如下：\n\n```\nkali >echo $PATH\n/usr/local/sbin:usr/local/bin:/usr/sbin:/sbin/bin:/root/newhackingtool\n\
  ```\n\n现在，你可以在系统的任何地方执行 `newhackingtool` 程序，而无需导航到它所在的目录。bash shell 将在列出的所有目录中查找你的新工具！\n\
  \n**注意**\n\n将目录添加到 `PATH` 是你经常使用的目录的一种很有用的技术，但要小心向 `PATH` 变量中添加过多的目录。因为系统必须搜索 `PATH`\
  \ 中的每一个目录来查找命令，添加大量目录可能会减慢你的终端速度和黑客操作。\n\n### 如何错误地向 PATH 变量添加内容\n\nLinux 用户常犯的一个错误是按照这种方式将新目录（例如\
  \ `/root/newhackingtool`）直接赋值给 `PATH` 变量：\n\n```\nkali >PATH=/root/newhackingtool\n\
  ```\n\n```\nkali >echo $PATH\n/root/newhackingtool\n```\n\n如果你使用此命令，你的 `PATH` 变量将只包含\
  \ `/root/newhackingtool` 目录，而不再包含系统二进制目录（如 `/bin`、`/sbin` 以及其他存放关键命令的目录）。当你使用任何系统命令时，将收到“command\
  \ not found”（未找到命令）的错误，如下，除非你在执行命令时先导航到系统二进制目录：\n\n```\nkali >cd\nbash: cd: command\
  \ not found\n```\n\n记住，你是要*追加*到 `PATH` 变量，而不是替换它。如果你不确定，请在修改之前将变量的内容保存到某处。\n\n###\
  \ 创建用户定义变量\n\n在 Linux 中，你只需为你命名的新变量赋值，即可创建自己的自定义用户定义变量。当你进行一些高级的 shell 脚本编写，或者发现自己经常使用一个厌倦了重复输入的长命令时，这可能非常有用。\n\
  \n语法非常直观：输入你的变量名，后面跟着赋值符号（`=`），然后是要放入变量中的值，如下：\n\n```\nkali >MYNEWVARIABLE=\"Hacking\
  \ is the most valuable skill set in the 21st century\"\n```\n\n这会将字符串分配给变量 `MYNEWVARIABLE`。要查看该变量中的值，使用\
  \ `echo` 命令和变量名的 `$` 内容符号，正如我们之前做的那：\n\n```\nkali >echo $MYNEWVARIABLE\nHacking\
  \ is the most valuable skill set in the 21st century\n```\n\n和我们的系统环境变量一样，用户定义变量必须导出（export）才能在新的会话中持续。\n\
  \n如果你想删除这个新变量或任何变量，请使用 `unset` 命令。不过，在删除系统变量之前务要考虑，因为之后你的系统运行方式可能会大不同。\n\n```\n\
  kali >unset MYNEWVARIABLE\n```\n\n```\nkali >echo $MYNEWVARIABLE\n```\n\n```\nkali\
  \ >\n```\n\n如你所示，当你输入 `unset MYNEWVARIABLE` 时，你删除了该变量及其值。如果你对同一个变量使用 `echo`，Linux\
  \ 现在将返回一个空行。\n\n## 总结\n\n你可能觉得环境变量很陌生，但了解它们是值得的。它们控制了 Linux 中工作环境的外观、行为和感受。你可以通过更改、导出甚至创建你自己的变量来管理这些变量，以适应你的需求。在某些情况下，它们可能对于你作为黑客隐藏踪迹有用。\n\
  \n**练习**\n\n在继续第 8 章）。\n4. 创建名为 `MYNEWVARIABLE` 的变量并放入你的名字。\n5. 使用 `echo` 查看 `MYNEWVARIABLE`。\n\
  6. 导出 `MYNEWVARIABLE` 使其在所有环境中可用。\n7. 使用 `echo` 命令查看 `PATH` 变量的内容。\n8. 将你的主目录添加到\
  \ `PATH` 变量中，以便可以使用其中的任何二进制文件。\n9. 将你的 `PS1` 变量更改为“World’s Greatest Hacker:”。\n\n\
  ## 8 BASH 脚本\n\n### Bash 快速入门\n\n任何受尊敬的黑客都必须学会脚本。同样，任何受尊敬的 Linux 管理员也必须学会脚本。黑客经常需要自动化命令，有时涉及多个工具，通过他们编写的短程序效率最高。\n\
  \n在本章中，我们从构建简单的脚本开始。随着学习，我们将添加功能和特性，最终编写一个能够搜索范围内目标的脚本。\n\n要成为精英黑客，你还需要学习常用的脚本语言，例如\
  \ Ruby（Metasploit 漏洞用 Ruby 编写）、Python（许多黑客工具是 Python 脚本）或 Perl（Perl 是最好的文本处理脚本语言）。我在第\
  \ 17 章 提供了 bash shell 内部一些有用命令的参考。\n\n\n\n你需要一个文本编辑器来创建 shell 脚本。可以使用任何你喜欢的 Linux\
  \ 文本编辑器，包括 `vi`、`vim`、`emacs`、`gedit`、`kate` 等。在这些教程中，我将像在之前的章节一样使用 `Leafpad`。使用不同的编辑器对你的脚本或其功能产生任何影响。\n\
  \n### 你的第一个脚本：“Hello, Hackers-Arise!”\n\n对于你的第一个脚本，我们将从一个简单的程序开始，该程序会在屏幕上返回一条显示“Hello,\
  \ Hackers-Arise!”的消息。打开你的文本编辑器，我们开始吧。\n\n首先，你需要告诉操作系统你想要为脚本使用哪种解释器。要做到这一点，你需要输入一个\
  \ shebang（解释器路径），它是井号和感叹号的组合，如下所示：\n\n```\n#!\n```\n\n然后，在 shebang (`#!`) 之后跟随 `/bin/bash`，表示你希望操作系统使用\
  \ `bash` shell 解释器。正如你在稍后的章节中看到的，你也可以使用 shebang 来使用其他解释器，例如 `Perl` 或 `Python`。在这里，你想使用\
  \ `bash` 解释器，因此输入以下内容：\n\n```\n#! /bin/bash\n```\n\n接下来，输入 `echo` 命令，它告诉系统将命令后的任何内容简单地重复（或\
  \ `echo`）回你的显示器。\n\n在这种情况下，我们希望系统向我们返回“Hello, Hackers-Arise!”正如列表 8-1 所示。请注意，我们要返回的文本或消息必须放在双引号中。\n\
  \n```bash\n#! /bin/bash\n\n# This is my first bash script. Wish me luck.\n\necho\
  \ \"Hello, Hackers-Arise!\"\n```\n\n*列表 8-1: 你的“Hello, Hackers-Arise!”脚本*\n\n在这里，你还会看到一行以井号\
  \ (`#`) 开头的代码。这是一个注释，是你留给自己或任何其他阅读代码的人的备注，用于解释你在脚本中做什么。程序员在每种编程语言中都会使用注释。解释器不会读取或执行这些注释，因此你不需要担心弄乱你的代码。它们只对人类可见。如果一行以\
  \ `#` 字符开头，`bash` shell 就认为该行是注释。\n\n现在，将此文件保存为 `HelloHackersArise`（无扩展名）并退出你的文本编辑器。\n\
  \n### 设置执行权限\n\n默认情况下，新创建的 bash 脚本即使对于所有者你也是不可执行的。让我们通过 `cd` 进入目录，然后输入 `ls -l` 在命令行中查看我们新文件的权限。它看起来可能像这样：\n\
  \n```\nkali >ls -l\n--snip--\n-rw-r--r-- 1 root root 42 Oct 22 14:32 HelloHackersArise\n\
  --snip--\n```\n\n正如你看到的，我们的新文件具有 `rw-r--r--` (644) 权限。正如你在第 5 章中所学的，这意味着该文件的所有者只有读\
  \ (`r`) 和写 (`w`) 权限，但没有执行 (`x`) 权限。组和其他所有用户只有读取权限。我们需要赋予执行权限以便运行此脚本。正如你在第 5 章中看到的，我们使用\
  \ `chmod` 命令更改权限。要赋予所有者、组和所有用户执行权限，输入以下内容：\n\n```\nkali >chmod 755 HelloHackersArise\n\
  ```\n\n现在，当我们列出文件时可以看到我们拥有执行权限：\n\n```\nkali >ls -l\n--snip--\n-rwxr-xr-x 1 root\
  \ root 42 Oct 22 14:32 HelloHackersArise\n--snip--\n```\n\n脚本现在准备好执行了！\n\n### 运行\
  \ HelloHackersArise\n\n要运行我们的脚本，输入：\n\n```\nkali ./HelloHackersArise\n```\n\n文件名前的\
  \ `./` 告诉系统我们要执行该文件，正如我们在当前目录下执行的那样。当我们按下回车时，我们的简单脚本向显示器返回了消息：\n\n```\nHello, Hackers-Arise!\n\
  ```\n\n成功！你完成了你的第一个 shell 脚本！\n\n### 使用变量和用户输入添加功能\n\n现在我们有一个简单的脚本。它所做的只是向标准输出返回消息。如果我们想创建更高级的脚本，可能需要添加一些变量。\n\
  \n`变量` 是内存中存储某些东西的区域。这个“东西”可能是字母或单词（字符串）或数字。它之所以被称为变量，是因为其中包含的值是可变的；这是为脚本添加功能的一个非常有用的特性。\n\
  \n在下一个脚本中，我们将添加功能，提示用户输入名称，并将输入的内容放入变量中，然后提示用户他们正在学习哪一章，并将该输入放入变量中。之后，我们将输出一条包含他们名称的欢迎消息。\n\
  \n在编辑器中打开一个新文件并输入列表 8-2 所示的脚本。\n\n```bash\n#! /bin/bash\n# This is your second bash\
  \ script. It uses variables.\necho \"What is your name?\"\nread name\necho \"What\
  \ chapter are you on in Linux for Hackers?\"\nread chapter\necho \"Welcome $name\
  \ to Chapter $chapter of Linux for Hackers!\"\n```\n\n*列表 8-2: 使用变量的简单脚本*\n\n以 `#!\
  \ /bin/bash` 开头，告诉系统我们想为此脚本使用 bash 解释器 ➊ 然后我们添加了描述脚本及其功能的注释 ➋ 之后，我们提示用户输入名称，并让解释器读取输入将其放入名为\
  \ `name` 的变量中 ➌。然后我们提示用户他们正在学习哪一章，再次读取输入并放入名为 `chapter` 的变量中 ➍。在最后一行，我们构建了一个输出行，用他们的名字欢迎他们所在的章节\
  \ ➎。正如第 7 章所述，要使用变量中所包含的值，必须在变量名前前加上 `$` 符号。\n\n\n\n既然你已经有了一些基础脚本技巧，让我们转向一些在黑客攻击中具有实际应用的稍高级脚本。我们将使用一个来自黑帽黑客世界的示例。黑帽黑客是那些带有恶意的人，例如偷取信用卡号或破坏网站首页。白帽黑客是那些意图良好的人，例如帮助软件开发者或系统管理员使他们的系统更安全。灰帽黑客则是那些倾向于在这两个极端之间移动的人。\n\
  \n在继续之前，你需要熟悉一个名为 `nmap` 的简单但至关重要的工具，它默认安装在 Kali 系统中。你可能听过这个名字；`nmap` 用于探测系统以查看其是否连接到网络，并发现哪些端口是开放的。从发现的开放端口，你可以推断出目标系统上运行着哪些服务。对于任何黑客或系统管理员来说，这是一个关键技能。\n\
  \n在最简单的情况下，运行 `nmap` 扫描的语法如下：\n\n```\nnmap <type of scan><target IP><optionally,\
  \ target port>\n```\n\n并不难。最简单且可靠的 `nmap` 扫描是 TCP 连接扫描，在 `nmap` 中用 `-sT` 开关指定。所以，如果你想用\
  \ TCP 扫描 IP 地址 `192.168.181.1`，你应该输入以下内容：\n\n```\nnmap -sT 192.168.181.1\n```\n\n\
  更进一步，如果你想对地址 `192.168.181.1` 执行 TCP 扫描，查看端口 `3306`（MySQL 的默认端口）是否开放，你可以输入：\n\n```\n\
  nmap -sT 192.168.181.1 -p 3306\n```\n\n在这里，`-p` 指定了你想要扫描的端口。现在就在你的 Kali 系统上尝试一下吧。\n\
  \n### 我们的任务\n\n在写本文时，有一个名叫 Max Butler 的黑客正在美国联邦监狱服刑，他在黑客世界也称为 Max Vision。Max 是一种灰帽黑客。白天，他是硅谷的一名\
  \ IT 安全专业人士；晚上，他在黑市上偷取并销售信用卡号。曾几何时，他运行着全球最大的信用卡黑市 `CardersMarket`。现在，Max 正在服期 13\
  \ 年的刑，同时协助匹兹堡的计算机应急响应小组 (CERT) 防御黑客。\n\n在 Max 被捕的几年前，他意识到许多小型餐厅使用的 Aloha 销售点（POS）系统内置了一个技术支持后门。在这种情况下，该后门允许技术支持协助其客户。Aloha\
  \ 技术支持可以通过端口 `5505` 访问终端用户的系统，在用户寻求帮助时提供协助。Max 意识到，如果他发现一个连接到互联网的 Aloha POS 系统，他就可以通过端口\
  \ `5505` 以系统管理员权限访问该系统。Max 能够进入许多此类系统并偷取数万张信用卡号。\n\n最终，Max 想找到*每一个*开放了 `5505` 端口的系统，这样他就能从偷取数千张信用卡变为偷取数百万。Max\
  \ 决定编写一个脚本，扫描数百万 IP 地址以寻找开放了 `5505` 端口的系统。当然，大多数系统*并没有*开放 `5505` 端口，因此如果它们开放了，很可能是运行着注定失败的\
  \ Aloha POS。他可以在白天工作时运行这个脚本，然后在晚上黑入那些被识别为开放 `5505` 端口的系统。\n\n我们的任务是编写一个与 Max 的脚本几乎相同的脚本，但我们的脚本不像\
  \ Max 那样扫描 `5505` 端口，我们的脚本将扫描连接到在线数据库 `MySQL` 的系统。`MySQL` 是数百万网站背后的数据库；我们将在第 12\
  \ 章处理 `MySQL`。默认情况下，`MySQL` 使用端口 `3306`。数据库是几乎每个黑客都在寻找的“金矿”，因为它们包含了信用卡号和个人身份信息 (PII)，这些在黑市*非常有*价值。\n\
  \n### 简单扫描器\n\n在我们编写扫描互联网 IP 的脚本之前，让我们先完成一个较小的任务。与其扫描全球，不如先写一个扫描局域网端口 `3306` 的脚本，看看我们的脚本是否有效。如果有效，我们可以轻松地编辑它来完成更大的任务。\n\
  \n在你的文本编辑器中，输入列表 8-3 所示脚本。\n\n```bash\n#!/bin/bash\n### 此脚本用于寻找安装了 MySQL 的主机\nnmap\
  \ -sT 192.168.181.0/24 -p 3306 >/dev/null -oG MySQLscan\ncat MySQLscan | grep open\
  \ > MySQLscan2\ncat MySQLscan2\n```\n*列表 8-3：简化扫描器*\n\n从 shebang 和解释器开始 ➊。让我们用注释来解释该脚本的作用\
  \ ➋。\n\n现在让我们使用 `nmap` 命令在局域网 ➌，查找端口 `3306` ➍。（注意你的 IP 地址可能不同）。在这里，`-p` 指定了你想要扫描的端口。现在就在你的\
  \ Kali 系统上尝试一下吧。\n\n（注：原文此处存在大量重复段落，已根据要求不重复输出原文）\n\n### 改进 MySQL 扫描器\n\n现在我们想调整此脚本，使其不仅适用于局域网。如果这个脚本能够提示用户想要扫描的\
  \ IP 范围和要查找的端口，然后使用这些输入，它将好用得多。\n\n### 为我们的黑客脚本添加提示和变量\n\n在你的文本编辑器中，输入列表 8-4 所示的脚本。\n\
  \n```bash\n#!/bin/bash\necho \"输入起始 IP 地址： \"\nread FirstIP\necho \"输入最后一个 IP 地址的末位字节：\
  \ \"\nread LastOctetIP\necho \"输入你想扫描的端口号： \"\nread port\nnmap -sT $FirstIP-$LastOctetIP\
  \ -p $port >/dev/null -oG MySQLscan\ncat MySQLscan | grep open > MySQLscan2\ncat\
  \ MySQLscan2\n```\n*列表 8-4：你的高级 MySQL 端口扫描器*\n\n我们需要做的第一件事是将指定的子网替换为 IP 地址范围。我们将创建一个名为\
  \ `FirstIP` 的变量和第二个变量 `LastOctetIP` 来创建范围，以及一个名为 `port` 的变量用于端口号。\n\n**注意**\n\n\
  *变量名并不重要，但最佳实践是使用有助于你记住变量存储内容的变量名。*\n\n\n\n\n\n我们还需要提示用户输入这些值。我们可以通过在 Listing 8-1\
  \ 中使用的 `echo` 命令来实现。\n\n为了给变量 `FirstIP` 获取一个值，我们在屏幕上显示 `echo \"Enter the starting\
  \ IP address : \"`，要求用户输入他们想要扫描的第一个 IP 地址 ➊。在屏幕上看到此提示后，用户将输入第一个 IP 地址，因此我们需要捕获用户的输入。\n\
  \n我们可以使用 `read` 命令后跟我们想要存储输入的变量名来实现此 ➋。该命令将用户输入的 IP 地址存入变量 `FirstIP` 中。然后，我们就可以在整个脚本中使用\
  \ `FirstIP` 中的该值了。\n\n我们对 `LastOctetIP` ➌ 和端口 ➍ 变量也执行同样的操作：提示用户输入信息，然后使用 `read`\
  \ 命令捕获它。\n\n接下来，我们需要编辑脚本中的 `nmap` 命令，以使用我们刚刚创建并填充的变量。要使用存储在变量中的值，我们只需在变量名前前加上 `$`\
  \ 符号，例如 `$port`。因此，在 ➎ 处，我们扫描一段 IP 地址范围，从第一个用户输入的 IP 到第二个用户输入的 IP，并查找用户输入的特定端口。我们使用变量代替了子网进行扫描，并使用端口来确定扫描的内容。重定向符号\
  \ `>` 告诉标准的 `nmap` 输出（通常输出到屏幕）改为输出到 `/dev/null`（`/dev/null` 只是一个发送输出并使其消失的地方）。然后，我们将以\
  \ `grep` 可搜索的格式将输出发送到我们命名为 `MySQLscan` 的文件中。\n\n下一行与我们的简单扫描器保持相同：它输出 `MySQLscan`\
  \ 文件的内容，将其管道到 `grep`，在其中过滤出包含关键字 `open` 的行，然后将该输出发送到名为 `MySQLscan2` 的新文件 ➏。最后，我们显示\
  \ `MySQLscan2` 文件的内容 ➐。\n\n如果一切运行如预期，此脚本将扫描从第一个输入地址到最后一个输入地址的 IP 地址，搜索输入的端口，然后仅报告开启指定端口的\
  \ IP 地址。将你的脚本文件保存为 `MySQLscannerAdvanced`，记得给自己赋予执行权限。\n\n### 示例运行\n\n现在我们可以运行简单的扫描器脚本，并使用确定要扫描\
  \ IP 地址范围和端口的变量，而无需每次运行扫描都编辑脚本：\n\n```\nkali >./MySQLscannerAdvanced.sh\n\nEnter\
  \ the starting IP address :\n\n192.168.181.0\n\nEnter the last IP address :\n\n\
  192.168.181.255\n\nEnter the port number you want to scan for :\n\n3306\n\nHost:\
  \ 192.168.181.254 ()Ports:3306/open/tcp//mysql//\n```\n\n脚本提示用户输入第一个 IP 地址、最后一个\
  \ IP 地址以及要扫描的端口。在收集这些信息后，脚本执行 `nmap` 扫描，并产生范围内所有开启了指定端口的 IP 地址报告。如你所见，即使是最简单的脚本也能创建一个强大的工具。你将在第\
  \ 17 章中学习更多关于脚本的知识。\n\n### 常用 Bash 内置命令\n\n正如承诺的，表 8-1 提供了 bash 内置的一些实用命令列表。\n\n\
  **表 8-1:** Bash 内置命令\n\n| 命令 | 功能 |\n| --- | --- |\n| `:` | 返回 0 或真 |\n| `.` | 执行\
  \ shell 脚本 |\n| `bg` | 将作业置于后台 |\n| `break` | 退出当前循环 |\n| `cd` | 切换目录 |\n| `continue`\
  \ | 继续当前循环 |\n| `echo` | 显示命令参数 |\n| `eval` | 求值其随后的表达式 |\n| `exec` | 在不创建新进程的情况下执行后续命令\
  \ |\n| `exit` | 退出 shell |\n| `export` | 使变量或函数对其他程序可用 |\n| `fg` | 将作业调至前台 |\n|\
  \ `getopts` | 解析 shell 脚本参数 |\n| `jobs` | 列出后台 (bg)作业 |\n| `pwd` | 显示当前目录 |\n| `read`\
  \ | 从标准输入读取一行 |\n| `readonly` | 将变量声明为只读 |\n| `set` | 列出所有变量 |\n| `shift` | 将参数左移\
  \ |\n| `test` | 评估参数 |\n| `` | 执行条件测试 |\n| `times` | 打印用户和系统时间 |\n| `trap` | 捕获信号\
  \ |\n| `type` | 显示每个参数如何被解释为命令 |\n| `umask` | 更改新文件的默认权限 |\n| `unset` | 删除变量或函数的值\
  \ |\n| `wait` | 等待后台进程完成 |\n\n## 总结\n\n脚本编写是任何黑客或系统管理员的一项至关重要的技能。它使你能够自动化通常需要花费数小时时间的任务，一旦脚本被保存，就可以反复使用。Bash\
  \ 脚本编写是最基本的脚本形式，你将在[第 17 章中学习更多脚本内容。\n\n**练习**\n\n在进入第 9 章之前，通过完成以下练习来测试本章中学的技能：\n\
  \n1. 创建一个类似于 `HelloHackers` 的问候脚本。\n2. 创建一个类似于 `MySQLscanner` 的脚本，但设计为查找端口 1433\
  \ 的 SQL Server 数据库。将其命名为 `MSSQL`。\n3. 修改那个 `MSSscanner` 以提示用户输入起始和结束 IP 地址以及要搜索的端口。过滤掉所有关闭的\
  \ IP 地址，仅显示开启的。\n\n## 9 压缩与存档\n\n![image](img/common01.jpg)\n\n黑客经常需要下载和安装新软件，以及发送和下载多个脚本和大文件。如果这些文件被压缩并合并，执行这些任务就会变得更容易。如果你来自\
  \ Windows 世界，你可能熟悉 `.zip` 格式这种概念，它可以合并并压缩文件使其变小。在 Linux 中有很多方法可以实现这一点，我们在本章中查看一些。我们还会查看\
  \ `dd` 命令，它可以复制整个驱动器，包括其中已删除的文件。\n\n### 什么是压缩？\n\n压缩这个有趣的话题可以写一整本书，但对于本书，我们只需要有基础的了解。压缩正如其名，使数据变小，从而需要更少的存储空间并使数据更容易传输。对于你作为初学者的目的，将压缩分为有损或无损就足够了。\n\
  \n有损压缩对于缩小文件体积非常有效，但信息的完整性丢失了。也就是说，压缩后的文件与原始文件并不完全相同。这种类型的压缩对于图形、视频和音频文件效果非常好，因为文件中微小的差异几乎无法察觉——`.mp3`、`.mp4`、`.png`\
  \ 和 `.jpg` 都是有损压缩算法。如果 `.png` 文件中的像素或 `.mp3` 文件中的单个音符发生了改变，你的眼睛或耳朵可能注意不到差异——尽管当然，音乐发烧友会说他们能听出\
  \ `.mp3` 和未压缩的 `.flac` 文件之间的区别。\n\n\n\n\n然而，当你发送文件或软件且数据完整性至关重要时，有损压缩是不可接受的。例如，如果你正在发送脚本或文档，在解压时必须保留原始文件的完整性。本章重点关注这种`lossless`类型的压缩，许多工具和算法提供了这种支持。遗憾的是，正如你想象的那样，无损压缩没有有损压缩高效，但对于黑客来说，完整性往往比压缩率更重要。\n\
  \n## 将文件打包\n\n通常，你在压缩文件时所做的第一件事是将它们合并成一个归档。在大多数情况下，归档文件时，你会使用 `tar` 命令。`Tar` 代表\
  \ `tape archive`（带归档），源于计算机史前的时代，那时系统使用磁带来存储数据。`tar` 命令从多个文件创建一个单个文件，该文件被称为 `archive`（归档）、`tar\
  \ file`或 `tarball`（tar 包）。\n\n例如，假设你有三个类似于我们在第 8 章中使用的脚本文件，命名为 `hackersarise1`、`hackersarise2`\
  \ 和 `hackersarise3`。如果你导航到存放它们的目录并执行列列表操作，你可以清楚地看到这些文件以及预期的细节，包括文件的大小，如下：\n\n```bash\n\
  kali >ls -l\n-rwxr-xr-x 1 root root      22311  Nov 27  2018 13:00 hackersarise1.sh\n\
  -rwxr-xr-x 1 root root         8791  Nov 27  2018 13:00 hackersarise2.sh\n-rwxr-xr-x\
  \ 1 root root       3992  Nov 27  2018 13:00 hackersarise3.sh\n```\n\n假设你想将这三个文件全部发送给与你共同合作项目的另一个黑客。你可以使用列表\
  \ 9-1 中的命令将它们合并并创建一个单个归档文件。\n\n```bash\nkali >tar -cvf HackersArise.tar hackersarise1\
  \ hackersarise2 hackersarise3\nhackersarise1\nhackersarise2\nhackersarise3\n```\n\
  *列表 9-1: 创建三个文件的 tar 包*\n\n让我们拆解这个命令以更好地理解它。归档命令是 `tar`，我们在这里对它使用了三个选项。`c` 选项表示创建（create），`v`（代表\
  \ verbose 详细，是可选的）列出 `tar` 正在处理的文件，而 `f` 表示写入到以下文件（file）。最后一个选项也适用于从文件读取内容。然后，我们为新归档指定你想要从这三个脚本创建的文件名：`HackersArise.tar`。\n\
  \n完整来说，此命令将取所有三个文件并创建一个单个文件 `HackersArise.tar`。当你再次对目录执行长列列表操作时，你会发现它也包含新的 `.tar`\
  \ 文件，如下所示：\n\n```bash\nkali >ls -l\n--snip--\n-rw-r--r-- 1 root root  40960 Nov\
  \ 27 2018 13:32 HackersArise.tar\n--snip--\nkali >\n```\n\n注意这里 tar 包的大小：40,960\
  \ 字节。当三个文件被归档时，`tar` 使用了大量的开销来执行此操作：归档前三个文件的和为 35,094 字节，而归档后，tar 包增长到了 40,960 字节。换句话说，归档过程增加了\
  \ 5,000 多字节。虽然这种开销对于小文件来说可能是巨大的，但随着文件越来越大，它会变得越来越不显著。\n\n我们可以通过使用 `tar` 命令配合 `-t`\
  \ 内容列表开关来`display` tar 包中的文件，无需提取它们，如下所示：\n\n```bash\nkali >tar -tvf HackersArise.tar\n\
  -rwxr-xr-x 1 root root      22311  Nov 27  2018 13:00 hackersarise1.sh\n-rwxr-xr-x\
  \ 1 root root         8791  Nov 27  2018 13:00 hackersarise2.sh\n-rwxr-xr-x 1 root\
  \ root       3992  Nov 27  2018 13:00 hackersarise3.sh\n```\n\n在这里，我们看到了三个原始文件以及它们的原始大小。然后你可以使用带有\
  \ `-x`（extract ）开关的 `tar` 命令从 tar 包中`extract`这些文件，如下所示：\n\n```bash\nkali >tar -xvf\
  \ HackersArise.tar\nhackersarise1.sh\nhackersarise2.sh\nhackersarise3.sh\n```\n\n\
  由于你仍然在使用 `-v` 开关，此命令将显示文件。（等等，原文说的是 `-v` 开关）\n\n```bash\nkali >tar -xvf HackersArise.tar\n\
  hackersarise1.sh\nhackersarise2.sh\nhackersarise3.sh\n```\n\n由于你仍然在使用 `-v` 开关，此命令将显示文件。\
  \ \n\n你仍然可以使用带有 `-x`（extract ）开关的 `tar` 命令从 tar 包中`extract`这些文件，如下所示：\n\n```bash\n\
  kali >tar -xvf HackersArise.tar\nhackersarise1.sh\nhackersarise2.sh\nhackersarise3.sh\n\
  ```\n\n由于你仍然在使用 `-v` 开关，此命令将显示文件。 \n\n等等，让我仔细重读一下原文：“因为你仍然在使用 –v 开关，此命令将显示文件。”（实际上，原文写的是：“因为你仍然在使用\
  \ –v 开关，此命令将显示文件。”——不，原文写的是：“因为你仍然在使用 –v 开关，此命令将显示文件。”——等等，再次查看提供的文本： \n\n“因为你仍然在使用\
  \ –v 开关，此命令将显示文件。”（等等，提供的文本是：“因为你仍然在使用 –v 开关，此命令将显示文件。”）——让我看看提供的实际块：\n\n\n\n\n\
  ```\nkali >uncompress HackersArise.*\n```\n\n你也可以使用 `gunzip` 命令处理那些用 `compress`\
  \ 压缩的文件。\n\n### 创建存储设备的逐位拷贝或物理拷贝\n\n在信息安全和黑客的世界里，有一条 Linux 归档命令在实用性上高于其他所有命令。`dd`\
  \ 命令可以对文件、文件系统甚至整个硬盘进行逐位（bit-by-bit）的复制。这意味着即使是被删除的文件也会被复制（是的，了解你删除的文件可能是可以恢复的这非常重要），这使得发现和恢复变得非常容易。在大多数逻辑复制工具（如\
  \ `cp`）中，删除的文件不会被复制。\n\n一旦黑客获取了目标系统的控制权，`dd` 命令将允许他们将整个硬盘或存储设备复制到自己的系统中。此外，那些工作是捕获黑客的人——即取证调查人员——很可能会使用此命令制作硬盘的物理副本，其中包含被删除的文件和其他痕迹，这些痕迹对于寻找针对黑客的证据可能有用。\n\
  \n需要至关重要的一点是，不应该将 `dd` 命令用于日常的文件和存储设备复制，因为它运行非常缓慢；其他命令可以更快、更高效地完成工作。但是，当你需要一个不需要文件系统或其他逻辑结构的存储设备副本时（例如在取证调查中），它是非常出色的。\n\
  \n`dd` 命令的基本语法如下：\n\n```\ndd if=inputfile of=outputfile\n```\n\n所以，如果你想为你的 U 盘制作物理拷贝，假设\
  \ U 盘是 `sdb`（我们将在第 10 章中详细讨论这种命名），你将输入以下内容：\n\n```\nkali >dd if=/dev/sdb of=/root/flashcopy\n\
  1257441=0 records in\n1257440+0 records out\n7643809280 bytes (7.6 GB) copied, 1220.729\
  \ s, 5.2 MB/s\n```\n\n让我们来拆解这个命令：`dd` 是你的物理“复制”命令；`if` 指定输入文件，`/dev/sdb` 代表 `/dev`\
  \ 目录下的 U 盘；`of` 指定输出文件；`/root/flashcopy` 是你想要将物理拷贝保存的文件名。（关于 Linux 系统在 `/dev` 目录下驱动器命名的完整解释，请参见第\
  \ 10 章。）\n\n`dd` 命令有许多可用选项，你可以对这些进行一些研究，但最有用的是 `noerror` 选项和 `bs`（块大小）选项。正如名称所示，`noerror`选项在遇到错误时会继续复制。`bs`选项允许你确定正在复制的数据块大小（每个块读取/写入字节数）。默认情况下，它设置为\
  \ 512 字节，但可以通过更改来加速过程。通常会将其设置为设备的扇区大小，大多数是 4KB（4096 字节）。使用这些选项，你的命令看起来如下：\n\n```\n\
  kali >dd if=/dev/media of=/root/flashcopy bs=4096 conv:noerror\n```\n\n如提到的，值得你自己多做一些研究，但这是对该命令及其用法的很好的介绍。\n\
  \n## 总结\n\nLinux 有许多命令可以让你合并和压缩文件以便更易传输。对于合并文件，`tar` 是首选命令，而你至少有三种压缩文件的工具——`gzip`、`bzip2`\
  \ 和 `compress`——它们都具有不同的压缩率。`dd` 命令则远超这些。它允许你创建不包含文件系统等逻辑结构的存储设备物理拷贝，从而允许你恢复被删除的文件。\n\
  \n## 练习\n\n在进入第 10 章之前，尝试通过完成以下操作来练习本章的技能：\n\n1. 创建三个脚本进行合并，类似于我们在第 8 章中所完成的。将它们命名为\
  \ `Linux4ers1`、`Linux4ers2` 和 `Linux4ers3`。\n2. 从这三个文件创建一个 tar 包（tarball）。将 tar\
  \ 包命名为 `L4H`。注意当这三个文件被打包时大小是如何变化的。\n3. 使用 `gzip` 压缩 `L4H` tar 包。注意大小的变化。研究如何覆盖现有文件。现在解压\
  \ `L4H` 文件。\n4. 分别使用 `bzip2` 和 `compress` 重复练习 3。\n5. 使用 `dd` 命令对你的其中一个驱动器进行物理逐位拷贝。\n\
  \n## 10 文件系统和存储设备管理\n\n![common01.jpg)\n\n如果你来自 Windows 环境，Linux 表示和管理存储设备的方式会有不同。Linux\
  \ 有一个特殊的目录包含了代表每个设备的文件：`/dev`。你已经看到过类似 `C:`、`D:`、`E:` 的驱动器，但本章将介绍 Linux 如何显示这些设备，例如硬盘和\
  \ U 盘。在 `/dev` 目录中，每个设备都由一个文件表示，包括你可能从未使用过的、甚至不知道它们存在的设备。我们我们开始查看 `/dev`。\n\n###\
  \ /dev 目录\n\nLinux 有一个特殊的目录包含了代表每个设备的文件。作为介绍，导航到 `/dev` 目录并对其进行详细列出。\n\n```\nkali\
  \ >cd /dev\nkali >ls -l\ntotal 0\ncrw-------  1  root root  10,175  May 16 12:44\
  \ agart\ncrw-------  1  root root  10,235  May 16 12:44 autofs\ndrwxr-xr-x  1  root\
  \ root  160  May 16 12:44 block\n--snip--\nlrwxrwxrwx  1  root root  3  May 16 12:44\
  \ cdrom -> sr0\n--snip--\ndrwxr-xr-x  2  root root  60  May 16 12:44 cpu\n--snip--\n\
  ```\n\n*列表 10-1：dev 的详细列表*\n\n设备默认按字母顺序显示。你可能识别某些设备，如 `cdrom` 和 `cpu`，但其他名称非常晦涩。系统上的每个设备由\
  \ `/dev` 目录中的一个文件表示，包括你可能从未使用过甚至意识到它们存在的设备。万一你发现了，那里有一个设备文件等待使用。\n\n如果你向下滚动屏幕，应该看到更多设备列表。特别感兴趣的是\
  \ `sda1`、`sda2`、`sda3`、`sdb` 和 `sdb1`，它们是硬盘及其分区以及 U 盘及其分区。\n\n--snip--\n\n```\n\
  brw-rw----  1  root root  8,0  May 16 12:44 sda\nbrw-rw----  1  root root  8,1 \
  \ May 16 12:44 sda1\nbrw-rw----  1  root root  8,2  May 16 12:44 sda2\nbrw-rw----\
  \  1  root root  8,5  May 16 12:44 sda5\nbrw-rw----  1  root root  8,16 May 16 12:44\
  \ sdb\nbrw-rw----  1  root root  8,17 May 16 12:44 sdb1\n```\n\n### Linux 如何表示存储设备\n\
  \n\n\n\nLinux 使用逻辑标签表示驱动器，这些标签随后被挂载到文件系统中。这些逻辑标签会根据驱动挂载的位置而变化，这意味着同一块硬盘在不同时间可能有不同的标签，取决于它挂载的位置和时间。\n\
  \n最初，Linux 将软盘驱动（还记得它们吗？）表示为 `fd0`，将硬盘表示为 `hda`。你仍然会在旧版 Linux 系统上偶尔看到这些驱动器表示，但今天大多数软盘驱动已经消失了（谢天谢地）。尽管如此，使用\
  \ IDE 或 E-IDE 接口的旧遗留硬盘仍以 `hda` 的形式表示。较新的串行 ATA（SATA）接口驱动和小型计算机系统接口（SCSI）硬盘表示为 `sda`。驱动有时会被分为称为\
  \ `partitions`（分区）的部分，它们在标签系统中用数字表示，正如你接下来看到的样。\n\n当系统有多个硬盘时，Linux 仅通过按字母顺序递增最后一个字母来对它们进行顺序命名，因此第一个驱动是\
  \ `sda`，第二个是 `sdb`，第三个是 `sdc`，依此类推（参见表 10-1）。`sd` 之后的序列字母通常称为 `major`（主）设备。\n\n\
  ### 表 10-1：设备命名系统\n\n| 设备文件 | 描述 |\n| --- | --- |\n| sda | 第一块 SATA 硬盘 |\n| sdb\
  \ | 第二块 SATA 硬盘 |\n| sdc | 第三块 SATA 硬盘 |\n| sdd | 第四块 SATA 硬盘 |\n\n### 硬盘分区\n\n\
  某些硬盘可以分区以便管理和隔离信息。例如，你可能想划分你的硬盘，使得你的 `swap` 文件、`home` 目录和 `/` 目录都在不同的分区上——你可能出于多种原因这样做，包括共享资源和放默认权限。Linux\
  \ 为每个分区分配了一个跟在驱动标识符之后的 `minor number`（次设备号）。这样，第一块 SATA 硬盘上的第一个分区就是 `sda1`。第二个分区是\
  \ `sda2`，第三个是 `sda3`，依此类推，如表 10-2 所示。\n\n### 表 10-2：分区标签系统\n\n| 分区 | 描述 |\n| ---\
  \ | --- |\n| sda1 | 第一块 (a) SATA 硬盘上的第一个 (1) 分区 |\n| sda2 | 第一块 (a) 硬盘上的第二个 (2)\
  \ 分区 |\n| sda3 | 第一块 (a) 硬盘上的第三个 (3) 分区 |\n| sda4 | 第一块 (a) 硬盘上的第四个 (4) 分区 |\n\n\
  有时你可能想查看 Linux 系统上的分区，看看你有哪些分区以及每个分区的可用容量。可以使用 `fdisk` 工具来实现。使用 `fdisk -l` 可以列出所有驱动的所有分区，如列表\
  \ 10-2 所示。\n\n```\nkali >fdisk -l\n\nDisk /dev/sda:  20GiB,  21474836480 bytes,\
  \  41943040  sectors\nUnits:  sectors of 1 * 512 = 512 bytes\nSector size (logical/physical):\
  \ 512 bytes / 512 bytes\nI/O size (minimum/optimal): 512 bytes / 512 bytes\nDisk\
  \ label type: dos\nDisk identifier: 0x7c06cd70\nDevice     Boot      Start     \
  \    End    Sectors   Size  Id Type\n/dev/sda1     *       2048  39174143  39172096\
  \   18.7G  83 Linux\n/dev/sda2         39176190  41940991   2764802   1.3G    5\
  \ Extended\n/dev/sda5         39176192  41940991   2764800   1.3G  82 Linux swap\
  \ / Solaris\nDisk /dev/sdb: 29.8 GiB, 31999393792 bytes, 62498816 sectors\nUnits:\
  \ sectors of 1 * 512 = 512 bytes\nSector size (logical/physical): 512 bytes / 512\
  \ bytes\nI/O size (minimum/optimal): 512 bytes / 512 bytes\nDisk label type: dos\n\
  Disk identifier: 0xc3072e18\nDevice     Boot      Start         End    Sectors \
  \  Size  Id  Type\n/dev/sdb1          32  62498815  62498784   29.8G    7  HPFS/NTFS/exFAT\n\
  ```\n*列表 10-2：使用 fdisk 列出分区*\n\n如列表 10-2 所示，设备 `sda1`、`sda2` 和 `sda5` 列在第一段中。这三个设备组成了我虚拟机的虚拟磁盘，它是一个\
  \ 20GB 的硬盘，带有三个分区，包括交换分区（`sda5`），当超过  容量时，它充当虚拟内存的作用——类似于 Windows 中的分页文件。\n\n如果你向下扫描列表\
  \ 10-2，设备 `sda1`、`sda2` 和 `sda5` 列在第一段中。\n\n### 字符设备和块设备\n\n关于 `/dev` 中设备命名的另外一点点是，`c`\
  \ 代表字符设备，`b` 代表块设备。\n\n### 使用 lsblk 列出块设备\n\nLinux `lsblk` 命令（list block 的缩写）提供每个块设备的基本信息。结果与\
  \ `fdisk -l` 的输出相似，但它还会以树形结构显示分区。\n\n```\nkali >lsblk\nName      MAJ:MIN RM  SIZE\
  \  RO TYPE MOUNTPOINT\nfd0       2:0      1     4K  0 disk \nsda       8:0     \
  \ 0    20G  0 disk \n|-sda1    8:1      0   18.7G  0 part  /\n|-sda2    8:2    \
  \  0     1K  0 part  \n|-sda5    8:5      0    1.3G  0 part  [SWAP]\nsdb       8:16\
  \     1    29.8G  0 disk \n|-sdb1    8:17     1    29.8G  0 disk  /media\nsr0  \
  \     11:0      1    2.7G  0 rom\n```\n*列表 10-3：使用 lsblk 列出块设备信息*\n\n\n\n\n输出包含了软驱驱动器\
  \ `fd0` 和 DVD 驱动器 `sr0`，尽管我的系统中并没有这些设备——这仅仅是旧留系统的遗留。我们还可以看到关于驱动器`mount point`（挂载点）的信息——这是驱动器连接到文件系统的位置。注意，硬盘\
  \ `sda1` 挂载在 `/*`，而闪存盘挂载在 `*/media*`。你将在下一节中详细了解其重要性。\n\n### 挂载与卸载\n\n大多数现代操作系统（包括绝大多数新版本的\
  \ Linux）在存储设备连接时会自动进行 `automount`（自动挂载），这意味着新的闪存盘或硬盘会自动挂载到文件系统中。对于 Linux 的初学者来说，挂载可能是一个陌生的概念。\n\
  \n存储设备必须首先在`物理上`连接到文件系统，然后`逻辑上`挂载到文件系统，才能让操作系统可以使用这些数据。换句话说，即使设备在物理上已连接到系统，它也不一定在逻辑上已连接并供操作系统使用。`mount`（挂载）一词是计算机早期的遗留术，当时存储带（硬盘出现之前）必须物理地挂载到计算机系统上——想象一下你在旧科幻电影中看到的那些带有旋转磁带驱动器的巨大计算机。\n\
  \n如前所述，目录树中连接设备的位置被称为 `mount point`（挂载点）。Linux 中两个主要的挂载点是 `*/mnt` 和 `*/media*`。根据通用规则，内部硬盘挂载在\
  \ `*/mnt*`，而外部 USB 设备（如闪存盘和外部 USB 硬盘）挂载在 `*/media*`，尽管从技术上讲可以使用任何目录。\n\n### 手动挂载存储设备\n\
  \n在某些 Linux 版本中，你需要手动挂载驱动器才能访问其内容，因此这是一项值得学习的技能。要在文件系统中挂载驱动器，请使用 `mount` 命令。设备的挂载点应该是一个空目录；如果你将设备挂载到一个包含子目录和文件的目录上，挂载的设备将`覆盖`该目录的内容，导致它们变得不可见且无法使用。因此，要将新硬盘\
  \ `sdb1` 挂载到 `*/mnt*` 目录，你需要输入：\n\n```\nkali >mount /dev/sdb1 /mnt\n```\n\n随后该硬盘就可以进行访问了。如果你想将闪存盘\
  \ `sdc1` 挂载到 `*/media*` 目录，请输入：\n\n```\nkali >mount /dev/sdc1 /media\n```\n\n挂载在系统上的文件系统保存在\
  \ `*/etc/fstab` 文件（filesystem table 的缩写）中，系统在每次启动时都会读取该文件。\n\n### 使用 umount 卸载\n\
  \n如果你有 Mac 或 Windows 背景，你可能可能在不知情的情况下卸载过驱动器。在从系统中移除闪存盘之前，你会对其进行“弹出”（eject），以防止对设备上存储的文件造成损坏。`Eject`\
  \ 只是卸载（unmount）的另一个说法。\n\n与 `mount` 命令类似，你可以通过输入 `umount` 命令后跟 `*/dev*` 目录中的设备条目（例如\
  \ `*/dev/sdb*`）来卸载第二个硬盘。注意命令的拼写不是 `unmount` 而是 `umount`（没有 `n`）。\n\n```\nkali >umount\
  \ /dev/sdb1\n```\n\n你无法卸载正在运行的设备，因此如果系统正在读取或写入该设备，你只会收到错误提示。\n\n### 监控文件系统\n\n在本节中，我们将查看一些监控文件系统状态的命令——这是任何黑客或系统管理员都必需的技能。我们将获取一些关于挂载磁盘的信息，然后检查并修复错误。存储设备特别容易出错，因此学习这项技能是值得的。\n\
  \n### 获取挂载磁盘的信息\n\n`df` 命令（disk free 的缩写）将为我们提供关于任何硬盘或挂载设备（如 CD、DVD 和闪存盘）的基本信息，包括已用空间和可用空间大小。在不带任何选项的情况下，`df`\
  \ 默认检查你系统上的第一个驱动器（在本例中为 `sda`）。如果你想检查不同的驱动器，只需在 `df` 命令后加上想要检查的驱动器表示即可（例如 `df sdb`）。\n\
  \n```\nkali >df\n```\n\nFilesystem           1K-Blocks      Used  Available Use%\
  \      Mounted on\nrootfs               19620732  17096196     1504788   92%   \
  \   /\nudev                   10240           0      10240     0%      /dev\n--snip--\n\
  /dev/sdb1           29820324  29712544     104788   99%      /media\n```\n\n\n\n\
  \n对于任何 Linux 用户来说，熟悉日志文件的使用至关重要。日志文件存储了操作系统和应用程序运行时发生的事件信息，包括任何错误和安全警报。你的系统将根据我在这章中教你如何配置的一系列规则自动记录信息。\n\
  \n作为一名黑客，日志文件可以成为追踪目标活动和身份的线索。但它也可能是你在他人系统上活动的痕迹。因此，黑客需要知道他们可以收集到哪些信息，以及关于他们自己的行动和方法可以被收集到哪些信息，以便隐藏这些证据。\n\
  \n另一方面，任何加固 Linux 系统的人都需要知道如何管理日志记录功能，以确定系统是否遭受了攻击，并破解实际上发生了什么以及是谁干的。\n\n本章将向你如何检查和配置日志文件，以及如何删除你的活动证据，甚至完全禁用日志记录。首先，我们将查看负责记录的守护进程。\n\
  \n### rsyslog 日志守护进程\n\nLinux 使用一个名为 `syslogd` 的守护进程来自动记录你计算机上的事件。syslog 的多个版本（包括\
  \ `rsyslog` 和 `syslog-ng`）被用于不同的 Linux 发行版，尽管它们的运行方式非常相似，但存在一些细微差异。由于 Kali Linux\
  \ 是基于 Debian 构建的，而 Debian 默认带有 `rsyslog`，我们在本章中重点关注该工具。如果你想使用其他发行版，值得对它们的日志系统进行一些研究。\n\
  \n让我们看看你系统上的 `rsyslog`。我们将搜索所有与 `rsyslog` 相关的文件。首先，在 Kali 中打开终端并输入以下命令：\n\n```\n\
  kali >locate rsyslog\n```\n\n```\n/etc/rsyslog.conf\n/etc/rsyslog.d\n/etc/default/rsyslog\n\
  /etc/init.d/rsyslog\n/etc/logcheck/ignore.d.server/rsyslog\n/etc/logrotate.d/rsyslog\n\
  /etc/rc0.d/K04rsyslog\n```\n\n如你见，许多文件包含关键字 `rsyslog`——其中一些比其他更有用。我们想要检查的是配置文件 `rsyslog.conf`。\n\
  \n### rsyslog 配置文件\n\n像 Linux 中几乎所有的应用程序一样，`rsyslog` 也通过一个纯文本配置文件进行管理和配置，该文件通常位于\
  \ `/etc` 目录下。对于 `rsyslog` 来说，配置文件位于 `/etc/rsyslog.conf`。使用任何文本编辑器打开该文件，我们将探索其中的内容（这里我使用\
  \ Leafpad）：\n\n```\nkali >leafpad /etc/rsyslog.conf\n```\n\n你应该能看到类似于列表 11-1 的内容。\n\
  \n```text\n/etc/rsyslog.conf rsyslog 的配置文件。\n\n# 更多信息请参见\n# /usr/share/doc/rsyslog-doc/html/rsyslog_conf.html\n\
  \n#################\n#### Modules ####\n#################\n\nmodule(load=\"imuxsock\"\
  ) # 提供本地系统日志支持\n\nmodule(load=\"imklog\") # 提供内核日志支持\n\n#module(load=\"immark\"\
  ) # 提供 --MARK-- 消息功能\n\n# 提供 UDP syslog 接收\n#module(load=\"imudp\")\n#input(type=\"\
  imudp\" port=\"514\")\n\n# 提供 TCP syslog 接收\n#module(load=\"imtcp\")\n#input(type=\"\
  imtcp\" port=\"514\")\n\n###########################\n#### Global Directives ####\n\
  ###########################\n```\n\n*列表 11-1：rsyslog.conf 文件的快照*\n\n如你所见，`rsyslog.conf`\
  \ 文件注释详尽，有许多注释解释了其用途。这些信息大部分对你现在可能没用，但如果你向下滚动到第 50 行以下，你将找到规则（Rules）部分。在这里，你可以设置\
  \ Linux 系统自动为你记录内容的规则。\n\n### rsyslog 日志规则\n\n`rsyslog` 规则决定了记录什么信息、哪些程序的日志被记录以及这些日志存储在哪里。作为黑客，这允许你发现记录了什么以及日志写在何处以便你可以删除或模糊它们。滚动到第\
  \ 50 行，你应该看到类似于列表 11-2 的内容。\n\n```text\n###############\n#### RULES ####\n###############\n\
  \n#\n# 首先是一些标准日志文件。按设施（facility）记录。\n#\nauth,authpriv.*              /var/log/auth.log\n\
  *.*;auth,authpriv.none        -/var/log/syslog\n#cron.*                        /var/log/cron.log\n\
  daemon.*                      -/var/log/daemon.log\nkern.*                     \
  \   -/var/log/kern.log\n1pr.*                          -/var/log/lpr.log\nmail.*\
  \                        -/var/log/mail.log\nuser.*                        -/var/log/user.log\n\
  #\n# 邮件系统的日志记录。将其拆分以便\n# 编写脚本来解析这些文件。\n#\nmail.info                     -/var/log/mail.log\n\
  ```\n\n`rsyslog.conf` 文件注释详尽，有许多注释解释了其用途。这些信息大部分对你现在可能没用，但如果你向下滚动到第 50 行以下，你将找到规则（Rules）部分。在这里，你可以设置\
  \ Linux 系统自动为你记录内容的规则。\n\n`rsyslog` 规则决定了记录什么信息、哪些程序的日志被记录以及这些日志存储在哪里。作为黑客，这允许你发现记录了什么以及日志写在何处以便你可以删除或模糊它们。\n\
  \n\n\n\n日志文件会占用空间，因此如果你不定期删除它们，它们最终会填满整个硬盘。另一方面，如果你删除日志文件的频率太高，在未来的某个时刻，你将没有日志可供调查。你可以使用\
  \ `logrotate` 通过轮转日志来在这些对立的需求之间找到平衡。\n\n`日志轮转`（Log rotation）是指通过将日志文件移动到其他位置来定期归档的过程，从而为你留下一个全新的日志文件。该归档位置将在指定时间后被清理。\n\
  \n你的系统已经在使用一个采用 `logrotate` 工具的 cron 作业轮转日志文件。你可以通过 `/etc/logrotate.conf` 文本文件配置\
  \ `logrotate` 工具来选择日志轮转的频率。让我们用文本编辑器打开它查看一下：\n\n```\nkali >leafpad /etc/logrotate.conf\n\
  ```\n\n你应该能看到类似列表 11-3 所示的内容。\n\n```text\n# 详情见 \"man logrotate\"\n# 每周滚动日志文件\n\
  weekly\n# 保留 4 周的备份\nrotate 4\n# 在轮转旧文件后创建新的（空）日志文件\ncreate\n# 如果你想压缩日志文件，请取消此行的注释\n\
  #compress\n# 软件包将日志轮转信息放入此目录\ninclude /etc/logrotate.d\n# 没有软件包拥有 wtmp 或 btmp --\
  \ 我们将在这里轮转它们\n/var/log/wtmp {\n    missingok\n    monthly\n    create 0664 root\
  \ utmp\n    rotate 1\n}\n```\n*列表 11-3：`logrotate` 配置文件*\n\n首先，你可以设置轮转数字所代表的时间单位➊。这里的默认值是\
  \ `weekly`，意味着 `rotate` 关键字后的任何数字始终代表周。\n\n在更下方的位置，你可以看到轮转日志的频率设置——默认设置是每四周轮转一次日志\
  \ ➋。这个默认配置适用于大多数人，但如果你想为了调查目的保留更久日志，或者为了更快清理而删除日志，这就是你应该更改的设置。例如，如果你每周检查日志文件并想节省存储空间，可以将此设置更改为\
  \ `rotate 1`。如果你有足够的日志存储空间，并想为以后的取证分析保留半永久的记录，可以将此设置更改为 `rotate 26` 以保留六个月日志，或 `rotate\
  \ 52` 以保留一年。\n\n默认情况下，当旧文件轮转出去时，会创建一个新的空日志文件➌。正如配置文件中的注释所示，你也可以选择压缩已轮转的日志文件➍。\n\n\
  在每个轮转周期结束时，日志文件会被重命名并推向日志链的末尾，同时创建一个新的日志文件替换当前日志文件。例如，`/var/log.auth` 将变为 `/var/log.auth.1`，然后是\
  \ `/var/log.auth.2`，以此此类推。如果你每四周轮转一次日志并保留四个备份，你将拥有 `/var/log.auth.4`，但没有 `/var/log.auth.5`，这意味着\
  \ `/var/log.auth.4`将被删除而不是推送到 `/var/log/auth.5`。你可以通过 `locate` 命令配合通配符查找 `/var/log/auth.log`\
  \ 日志文件，如下：\n\n```\nkali >locate /var/log/auth.log.*\n```\n\n/var/log/auth.log.1\n\
  /var/log/auth.log.2\n/var/log/auth.log.3\n/var/log/auth.log.4\n```\n\n关于自定义和使用 `logrotate`\
  \ 工具的更多细节，请参阅 `man logrotate` 页面。这是学习你可以使用的函数和可以更改的变量以自定义日志处理方式的极佳资源。一旦你更加熟悉 Linux，你将更好地自己需要记录日志的频率以及你偏好的选项，因此重新查看\
  \ `logrotate.conf` 文件是值得的。\n\n## 保持隐蔽\n\n一旦你攻破了 Linux 系统，禁用日志并移除日志文件中的任何入侵证据以减少被检测的几率是有用的。有很多方法可以实现这一点，每种方法都有自己的风险和可靠水平。\n\
  \n### 删除证据\n\n首先，你想要删除任何你的活动日志。你可以只需打开日志文件，并使用你在第 2 章中学习的文件删除技术，逐行精确地删除任何详细记录你活动的日志。然而，这可能会非常耗时，并在日志文件中留下时间空隙，这看起来很可疑。此外，删除的文件通常可以被熟练的取证调查员恢复。\n\
  \n更好且更安全的解决方案是粉碎（shred）日志文件。在其他文件删除系统中，熟练的调查员仍然能够恢复删除的文件，但假设有一种方法可以删除文件并对其多次覆盖，使其恢复变得困难得多。幸运的是，Linux\
  \ 有一个内置命令 `shred`。要理解 `shred` 如何工作，请快速查看帮助信息：\n\n```\nkali >shred --help\n```\n\
  用法: shred [OPTION]...FILE\n多次覆盖文件(s)，默认覆盖 3 次。\n\n选项:\n  -n, --iterations=NUMBER\
  \   覆盖迭代次数（默认: 3）\n  -u, --remove               在覆盖后删除文件\n  -z, --zero         \
  \        最后用零覆盖以隐藏粉碎过程\n  -v, --verbose              显示详细过程输出\n  -f, --force   \
  \             忽略中断并移除写保护的文件\n  -h, --help                 显示此消息并退出\n\n要粉碎文件，我们需要\
  \ `-f` 选项来获取粉碎权限，`-n` 选项允许你选择覆盖次数。作为示例，我们将使用以下命令对 `/var/log/auth.*` 进行 10 次粉碎：\n\
  \n```\nkali >shred -f -n 10 /var/log/auth.*\n```\n\n/var/log/auth.log.1\n/var/log/auth.log.2\n\
  /var/log/auth.log.3\n/var/log/auth.log.4\n```\n\n一旦你粉碎了文件，你会发现内容变成了无法识别的乱码。现在尝试打开日志文件：\n\
  \n```\nkali >leafpad /var/log/auth.1\n```\n\n现在如果安全工程师或取证调查员检查日志文件，他们将一无获，因为没有任何可以恢复！\n\
  \n### 禁用日志\n\n隐藏踪迹的另一种方法是直接禁用日志。当黑客控制系统时，他们可以立即禁用日志以防止系统记录他们的活动。这当然需要 root 权限。\n\
  \n要禁用所有日志，黑客可以简单停止 `rsyslog` 进程。在 Linux 中停止任何服务使用相同的语法，如下（你将在第 12 章](#ch12.xhtml_ch12）中看到更多内容）：\n\
  \n```\nservicename start|stop|restart\n```\n\n因此，为了停止日志进程，你可以只需输入以下命令：\n\n```\n\
  kali >service rsyslog stop\n```\n\n## 总结\n\n日志文件记录了你的 Linux 系统上几乎发生的一切。在尝试分析发生了什么时（无论是故障还是攻击），它们是极具价值的资源。对于黑客来说，日志文件可能是他们活动和身份的证据。然而，精明的黑客可以删除并粉碎这些文件并完全禁用日志，从而不留下任何证据。\n\
  \n**练习题**\n\n\n\n\n\n在进入 第 12 章 之前，请通过完成以下练习来尝试在本章中学到的技能：\n\n1. 使用 `locate` 命令找到所有的\
  \ rsyslog 文件。\n2. 打开 `rsyslog.conf` 文件并将你的日志轮转更改为每周。\n3. 禁用系统日志记录。调查在禁用日志时，`/var/log/syslog`\
  \ 文件中记录了什么内容。\n4. 使用 `shred` 命令粉碎并删除所有的内核日志文件（kern log files）。\n\n## 第 12 章：使用与滥用服务\n\
  \n![image](img/common01.jpg)\n\n在 Linux 术语中，`service`（服务）是一个在后台运行并等待你使用的应用程序。你的\
  \ Linux 系统预装了数十种服务。其中，最为人知的是无处不在的 Apache Web 服务器，它用于创建、管理和部署 Web 服务器，但还有许多其他服务。为了本章对服务的讨论，我仅选择了四个对黑客具有特别重要的服务：Apache\
  \ Web 服务器、OpenSSH、MySQL 和 PostgreSQL。\n\n在本章中，你将学习如何使用 Apache 设置 Web 服务器、使用 OpenSSH\
  \ 进行物理间谍（spy）、使用 MySQL 访问数据以及使用 PostgreSQL 存储你的黑客信息。\n\n## 启动、停止和重启服务\n\n在我们开始处理这四个关键服务之前，让我们先查看如何在\
  \ Linux 中启动、停止和重启服务。\n\n某些服务可以通过 Kali Linux 的图形界面（GUI）进行停止和启动，就像在 Windows 或 Mac\
  \ 等操作系统上操作一样。然而，某些服务需要使用命令行，我们在这里介绍。以下是管理服务的基本语法：\n\n`service servicename start|stop|restart`\n\
  \n要启动 `apache2` 服务（Web 服务器或 HTTP 服务），你需要输入以下内容：\n\n```\nkali >service apache2 start\n\
  ```\n\n要停止 Apache Web 服务器，输入：\n\n```\nkali >service apache2 stop\n```\n\n通常情况下，当你通过更改明文配置文件对应用程序或服务进行配置更改时，你需要重启服务以“捕获”（capture）新配置。因此，你需要输入以下内容：\n\
  \n```\nkali >service apache2 restart\n```\n\n现在你已经了解了如何从命令行启动、停止和重启服务，让我们进入对黑客最关键的四个\
  \ Linux 服务。\n\n## 使用 Apache Web 服务器创建 HTTP Web 服务器\n\nApache Web 服务器可能是 Linux 系统上最常用的服务。Apache\
  \ 存在全球 60% 以上的 Web 服务器中，因此任何自尊的 Linux 管理员都应该熟悉它。作为一名渴望黑入网站的黑客，理解 Apache、网站以及这些网站后端数据库的内部运作至关重要。你还可以使用\
  \ Apache 建立自己的 Web 服务器，从那里你可以通过跨站脚本（XSS）向任何访问你网站的人投放恶意软件，或者你可以克隆一个网站并通过滥用域名系统（DNS）将流量重定向到你的网站。在这两种情况下，都需要对\
  \ Apache 有基础的了解。\n\n### 从 Apache 开始\n\n如果你在系统上运行着 Kali，那么 Apache 已经安装了。许多其他 Linux\
  \ 发行版也默认预安装了它。如果你没有安装 Apache，可以通过输入以下命令从仓库下载并安装它：\n\n```\nkali >apt-get install\
  \ apache2\n```\n\nApache Web 服务器通常与 MySQL 数据库（我们将在下一节介绍）相关联，这两个服务经常与 Perl 或 PHP\
  \ 等脚本语言配合使用，开发 Web 应用程序。这种 Linux、Apache、MySQL 和 PHP 或 Perl 的组合形成了一个强大且健壮的 Web 应用开发和部署平台，统称为\
  \ `LAMP`。它们是 Linux 世界中最广泛使用的网站开发工具——它们在微软世界同样流行，在那里它们通常被称为 `WAMP`，其中 `W` 代表 Windows。\n\
  \n第一步当然是启动我们的 Apache 守护进程。在 Kali 中，转到 **Applications（应用程序）** ▸ **Services（服务）**\
  \ ▸ **HTTPD** 并点击 **Apache start**。你也可以通过输入以下内容从命令行：\n\n```\nkali >services apache2\
  \ start\n```\n\n现在 Apache 正在运行，它应该能够提供它的默认网页。在你喜爱的浏览器中输入 `[http://localhost/]` 来调出网页，它看起来应该像图\
  \ 12-1。\n\n![image](img/f0123-01.jpg)\n\n*图 12-1：Apache2 Web 服务器默认页面*\n\n如你所见，Apache\
  \ 将“It works”作为它的默认网页。现在你已经知道你的 Apache Web 服务器工作正常了，让我们自定义它吧！\n\n### 编辑 index.html\
  \ 文件\n\nApache 的默认网页位于 `/var/www/html/index.html`。你可以编辑 `index.html` 文件来提供你想要的任何信息，所以让我们创建一个自己的。为此，你可以使用任何你喜欢的文本编辑器；我将使用\
  \ Leafpad。打开 `/var/www/html/index.html`，你应该能看到类似列表 12-1 的内容。\n\n```html\n<!DOCTYPE\
  \ html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\n\"http://www.w3.org/TR/xhtm11/DTD/xhtm11-DTD\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n<meta http-equiv=\"Content-Type\"\
  \ content=\"text/html; charset=UTF-8\">\n<title>Apache Default Page: It works</title>\n\
  <style type=\"text/css\">\n* {\nmargin: 0;\npadding: 0;\n}\nbody, html {\nbackground-color:\
  \ #DDBE2;\nfont-family: Verdana, sans-serif;\nfont-size: 11pt;\ntext-align: center;\n\
  }\ndiv.main_page {\nposition: relative;\ndisplay: table;\n}\n</style>\n</head>\n\
  <body>\n<div class=\"main_page\">\n<h1>It works!</h1>\n<p>The Apache server is serving\
  \ correctly.</p>\n<p>If you are having any problems, please contact the system administrator\
  \ for this server.</p>\n</div>\n</body>\n</html>\n```\n*列表 12-1：Apache Web 服务器 index.html\
  \ 文件*\n\n### 添加一些 HTML\n\nApache 的默认网页位于 `/var/www/html/index.html`。你可以编辑 `index.html`\
  \ 文件来提供你想要的任何信息，所以让我们创建一个自己的。为此，你可以使用任何你喜欢的文本编辑器；我将使用 Leafpad。打开 `/var/www/html/index.html`，你应该能看到类似列表\
  \ 12-1 的内容。\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
  \n\"http://www.w3.org/TR/xhtm11/DTD/xhtm11-DTD\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  >\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
  >\n<title>Apache Default Page: It works</title>\n<style type=\"text/css\">\n* {\n\
  margin: 0;\npadding: 0;\n}\nbody, html {\nbackground-color: #DDBE2;\nfont-family:\
  \ Verdana, sans-serif;\nfont-size: 11pt;\ntext-align: center;\n}\ndiv.main_page\
  \ {\nposition: relative;\ndisplay: table;\n}\n</style>\n</head>\n<body>\n<div class=\"\
  main_page\">\n<h1>It works!</h1>\n<p>The Apache server is serving correctly.</p>\n\
  <p>If you are having any problems, please contact the system administrator for this\
  \ server.</p>\n</div>\n</body>\n</html>\n```\n*(注：此处为原文重复代码块，已按要求跳翻译)*\n\n### 添加一些\
  \ HTML\n\n现在我们的 Web 服务器已经运行，并且打开了 `index.html` 文件，我们可以添加任何想要 Web 服务器提供的文本。我们将创建一些\
  \ HTML 块。\n\n让我们创建这个页面。在文本编辑器的新文件中，输入列表 12-2 所示的代码。\n\n```html\n<html>\n<body>\n\
  <h1>Hackers-Arise Is the Best!</h1>\n<p> If you want to learn hacking, Hackers-Arise.com\
  \ </p>\n<p> is the best place to learn hacking!</p>\n</body>\n</html>\n```\n*列表\
  \ 12-2：添加到 index.html 的简单 HTML*\n\n一旦你输入了文本，将此文件保存为 `/var/www/html/index.html` 并关闭文本编辑器。你的文本编辑器随后会提示文件已存在。没关系。覆盖现有的\
  \ `/var/www/html/index.html` 文件即可。\n\n### 查看发生了什么\n\n保存了 `/var/www/html/index.html`\
  \ 文件后，我们可以检查 Apache 将提供什么。再次在浏览器中导航到 `[http://localhost]`，你应该能看到类似图 12-2 的内容。\n\n\
  ![image](img/f0125-01.jpg)\n\n*图 12-2：新的 Hackers-Arise 网站*\n\nApache 正好按照我们创建的方式展示了我们的网页！\n\
  \n\n\n\n\nSSH 是 `Secure Shell` 的缩写，它基本上使我们能够安全地连接到远程系统的终端——它是多年前非常流行的、不安全的 `telnet`\
  \ 的替代品。当我们构建 Web 服务器时，SSH 允许我们创建一个 `access list`（一个可以使用此服务的用户列表），使用加密密码对用户进行身份验证，并加密所有通信。这减少了未经授权的用户使用远程终端的机会（因为增加了身份验证过程）或拦截我们通信的机会（因为有了加密）。可能被最广泛使用的\
  \ Linux SSH 服务是 OpenSSH，它安装在几乎每个 Linux 发行版中，包括 Kali。\n\n系统管理员经常使用 SSH 管理远程系统，而黑客经常使用\
  \ SSH 连接到被入侵的远程系统，因此我们在这里也将这样做。在这个示例中，我们将使用 SSH 设置一个远程树莓派系统用于间谍活动，我称之为“树莓派间谍（Raspberry\
  \ Spy Pi）”。为此，你需要一台树莓派和配套的树莓派摄像头模块。\n\n在在此之前，请使用现在已经熟悉的命令在你的 Kali 系统上启动 OpenSSH：\n\
  \n```\nkali >service ssh start\n```\n\n我们将使用 SSH 来构建和控制一个远程间谍树莓派。如果你还不熟悉它，树莓派是一个微小但强大、只有信用卡大小的电脑，作为远程间谍工具效果非常好。我们将使用一个带有摄像头模块的树莓派作为远程间谍设备。你可以在几乎任何电子零售商处（包括亚马逊）购买树莓派，价格低于\
  \ 50 美元，摄像头模块大约需要 15 美元。\n\n在这里，我们使用与 Kali 系统处于同一网络上的“树莓派间谍”，这允许我们能够使用私有的内部 IP 地址。当然，在现实世界中进行黑客攻击，你可能希望将其设置在另一个远程网络上，但这会稍微困难一些，并且超出了本书的范围。\n\
  \n### 设置树莓派\n\n确保你的树莓派运行着 Raspbian 操作系统；这只是另一个专门为树莓派 CPU 移植的 Linux 发行版。你可以在 `https://www.raspberrypi.org/downloads/raspbian/`\
  \ 找到 Raspbian 的下载和安装说明。你在书中学到的几乎所有内容都适用于树莓派上的 Raspbian 操作系统，也适用于 Kali、Ubuntu 和其他\
  \ Linux 发行版。\n\n一旦你下载并安装了 Raspbian 操作系统，你就需要将树莓派连接到显示器、鼠标和键盘，然后连接到互联网。如果这些对你来说都是全新的，请查看\
  \ `https://www.raspberrypi.org/learning/hardware-guide/` 中的说明。设置完成后，使用用户名 `pi` 和密码\
  \ `raspberry` 登录。\n\n### 构建树莓派间谍\n\n第一步是确保 SSH 在树莓派间谍上正在运行并已启用。SSH 通常默认是关闭的，因此要启用它，请进入\
  \ Preferences（偏好）菜单并启动 `Raspberry Pi Configuration`。然后进入 `Interfaces` 选项卡，在 SSH\
  \ 旁边点击 `Enabled`（如果尚未勾选）并点击 `OK`。\n\n当 SSH 启用后，你可以通过打开终端并输入以下内容在你的树莓派间谍上启动它：\n\n\
  ```\nkali >service ssh start\n```\n\n接下来，你需要连接你的摄像头模块。如果你使用的是树莓派 3 版本板板，只有一个连接位置。关闭树莓派，将模块连接到摄像头接口，然后再次开启。注意，摄像头非常脆弱，绝对不能与通用输入/输出（`GPIO`）引脚接触；否则它可能会短路损坏。\n\
  \n现在，SSH 服务已经运行，将树莓派放置在你家、学校或其他任何你想进行间谍的地方。当然，它必须连接到局域网，通过以太网线，或者理想情况下通过 Wi-Fi 连接。（新的树莓派\
  \ 3 和树莓派 Zero 都带有内置的 Wi-Fi。）\n\n现在你需要获取树莓派的 IP 地址。正如你在第 3 章中学到的，你可以使用 `ifconfig`\
  \ 获取设备的 IP 地址：\n\n```\npi >ifconfig\n```\n\n你的 Pi 的 IP 地址是 `192.168.1.101`，但请确保你使用的是本章中出现的\
  \ IP 地址。现在，从你的 Kali 系统，你应该能够直接连接并控制树莓派，并将其作为远程间谍系统。在这个简单的示例中，你的系统需要与树莓派处于同一网络。\n\
  \n要从 Kali 系统通过 SSH 连接到远程树莓派，输入以下内容，记得使用你 Pi 的 IP 地址：\n\n```\nkali >ssh pi@192.168.1.101\n\
  ```\n\n`pi@192.168.1.101's password:` Debian GNU/Linux 发行版自带的程序是免费软件；每个程序的具体条款描述在\
  \ `/usr/share/doc/` 中的单独文件中。Debian GNU/Linux 在法律允许的范围内绝对没有任何担保。\n\n```\npi@raspberry:\
  \ $\n```\n\n随后间谍 Pi 会提示你输入密码。在这种情况下，默认密码是 `raspberry`，除非你更改过它。\n\n### 配置摄像头\n\n\
  接下来，我们需要配置摄像头。为此，输入以下命令启动树莓派配置工具：\n\n```\npi >sudo raspi-config\n```\n\n这应该启动一个图形菜单。滚动到\
  \ `6 Enable Camera` 并按下 `ENTER`。现在，滚动到菜单底部并选择 `Finish` 然后按下 `ENTER`。\n\n当配置工具询问你是否想要重启时，选择\
  \ `Yes` 并再次按下 `ENTER`。\n\n现在你的树莓派摄像头应该启用并准备就绪！\n\n### 开始间谍\n\n一旦树莓派重启并你通过 Kali 终端登录，你就可以通过拍摄静态照片来开始间谍活动了。Raspbian\
  \ 操作系统有一个名为 `raspistill` 的应用程序，我们将用它从我们的小树莓派上拍照。在终端输入 `raspistill` 来查看工具的帮助屏幕及其所有选项：\n\
  \n```\npi@raspberry: raspistill\nraspistill Camera App v1.3.8\nRuns camera for specific\
  \ time, and takes JPG capture at end if requested\nusage: raspistill [options]\n\
  ```\n\n现在让我们使用树莓派拍摄一些间谍照片！`raspistill` 命令有很多许多选项，但我们将简单使用默认值。要拍照并保存为 JPEG，输入以下内容：\n\
  \n```\npi@raspberrypi: raspistill -v -o firstpicture.jpg\nraspistill Camera App\
  \ v1.3.8\nwidth 2592, Height 1944, quality 85, filename firstpicture.jpg\nTime delay\
  \ 5000, Raw no\n```\n\n我们使用 `-v` 选项获取详细输出，使用 `-o` 选项告诉 `raspistill` 我们将提供一个文件名；然后提供文件名。当我们在树莓派上执行详细列表时，我们可以看到\
  \ `firstpicture.jpg` 文件，如下：\n\n```\npi@raspberrypi: ls -l\ntotal 2452\ndrwxr-xr-x\
  \ 2 pi pi 4096 Mar 18 2019 Desktop\ndrwxr-xr-x 2 pi pi 4096 Mar 18 2019 Documents\n\
  drwxr-xr-x 2 pi pi 4096 Mar 18 2019 Downloads\n-rw-r--r-- 1 pi pi 2472219 Mar 18\
  \ 2019 firstpicture.jpg\ndrwxr-xr-x 2 pi pi 4096 Mar 18 2019 Music\ndrwxr-xr-x 2\
  \ pi pi 4096 Mar 18 2019 Pictures\n```\n\n\n\n\n\n我们已经通过 SSH 在我们的远程树莓派 Spy Pi 上拍摄了第一张间谍照片！请继续探索这件多功能武器。\n\
  \n### 从 MySQL 中提取信息\n\nMySQL 是数据库驱动型 Web 应用程序背后最广泛使用的数据库。在现代 Web 2.0 技术时代，几乎每个网站都由数据库驱动，这意味着\
  \ MySQL 存储了大多数网站的数据。\n\n数据库是黑客眼中的“金羊毛”。它们包含了关于用户的关键信息，以及如信用卡号等机密信息。出于因此，黑客通常的目标都是数据库。\n\
  \n与 Linux 一样，MySQL 是开源的并遵循通用公共许可证（GPL），你会在几乎在每个 Linux 发行版中都预装了它。\n\n由于具有免费、开源且强大的特性，MySQL\
  \ 已成为许多 Web 应用程序的首选数据库，包括热门网站如 WordPress、Facebook、LinkedIn、Twitter、Kayak、[Walmart.com](http://Walmart.com)、Wikipedia\
  \ 和 YouTube。\n\n其他流行的内容管理系统（CMS）如 Joomla、Drupal 和 Ruby on Rails 也使用 MySQL。你明白意思了。如果你想开发或攻击\
  \ Web 应用程序的后端数据库，你就应该了解 MySQL。让我们开始吧。\n\n### 启动 MySQL\n\n幸运的是，Kali 已经安装了 MySQL（如果你使用的是其他发行版，可以从软件仓库或直接从\
  \ [`www.mysql.com/downloads/`](https://www.mysql.com/downloads/) 下载并安装 MySQL）。\n\
  \n要启动 MySQL 服务，请在终端输入以下内容：\n\n```bash\nkali >service mysql start\n```\n\n接下来，你需要通过登录进行身份验证。输入以下内容，并在提示密码时直接按回车：\n\
  \n```bash\nkali >mysql -u root -p\n\n\nWelcome to MySQL monitor. Commands end with\
  \ ; or \\g.\n\nYour MySQL connection id is 4\nServer version: 5.6.30-1 (Debian)\n\
  Copyright (c) 2000, 2016, Oracle and/or its affiliates. All rights reserved\nOracle\
  \ 是 Oracle 公司和/或其公司的注册商标。其他名称可能是各自所有者的商标\nType 'help;' or '\\h' for help. Type '\\\
  c' to clear 当前输入语句\nmysql >\n```\n\n在 MySQL 的默认配置中，root 用户的密码为空。显然，这是一个重的安全漏洞，你应该在第一次登录后通过添加密码来修复它。注意，操作系统的用户名和密码与\
  \ MySQL 的是分开且相互独立的。为了安全起见，让我们现在更改 MySQL root 用户的密码。\n\n### MySQL 的过去与未来\n\nMySQL\
  \ 最初由瑞典的 MySQL AB 在 1995 年开发，随后在 2008 年被太阳系统公司收购，随后在 2009 年被 Oracle 收购——因此现在 MySQL\
  \ 由 Oracle 所有。Oracle 是全球最大的数据库软件发行商，因此开源社区对 Oracle 保持 MySQL 开源的承诺深表担忧。现在有一个名为“Maria”的\
  \ MySQL 数据库软件分支，它致力于保持该软件及其后续版本的开源。作为 Linux 管理员或黑客，你应该关注 Maria。\n\n### 与 MySQL 交互\n\
  \nSQL 是一种用于与数据库交互的解释型编程语言。数据库通常是关系型数据库，这意味着数据存储在多个相互作用的表中，每个表在一个或多个列和行中有值。\n\nSQL\
  \ 有多种实现，每种实现都有自己的命令和语法，但以下是一些常用命令：\n\n- `select`：用于检索数据\n- `union`：用于合并两个多个 select\
  \ 操作的结果\n- `insert`：用于添加新数据\n- `update`：用于修改现有数据\n- `delete`：用于删除数据\n\n你可以为每个命令提供条件，以便更具体地描述你想执行的操作。例如，这一行：\n\
  \n```sql\nselect user, password from customers where user='admin';\n```\n\n将返回 customers\
  \ 表中任何 user 值等于“admin”的用户的 user 和 password 字段的值。\n\n### 设置 MySQL 密码\n\n让我们通过输入以下内容查看我们的\
  \ MySQL 系统中已经存在哪些用户。（注意，MySQL 中的命令以分号结束。）\n\n```sql\nmysql >select user, host, password\
  \ from mysql.user;\n\n+----------------------------------------------------------------------------\n\
  | user                         | host                          | password     |\n\
  +----------------------------------------------------------------------------\n\
  |root                          | localhost                      |              |\n\
  |root                          | aphrodite.kali.org             |              |\n\
  |root                          |                               |              |\n\
  +----------------------------------------------------------------------------\n\
  ```\n\n在 MySQL 的默认配置中，root 用户的密码为空。显然，这是一个重的安全漏洞，你应该在第一次登录后通过添加密码来修复它。注意，操作系统的用户名和密码与\
  \ MySQL 的是分开且相互独立的。为了安全起见，让我们现在更改 MySQL root 用户的密码。\n\n\n\n\n获取系统权限后，我们想要进行一番窥探。下一步是找出是否存在任何值得访问的数据库。以下是查找已访问系统中哪些数据库的命令：\n\
  \n```mysql\nmysql >show databases;\n\n+-------------------------------+\n| Database\
  \                      |\n+-------------------------------+\n| information schema\
  \           |\n| mysql                         |\n| creditcardnumbers          \
  \   |\n| performance_schema           |\n+-------------------------------+\n4 rows\
  \ in set (0.26 sec)\n```\n\n啊！我们找到了一个名为 `creditcardnumbers` 的值得探索的数据库。让我们连接到它。\n\
  \n在 `MySQL` 中，与其他数据库管理系统 (`DBMS`) 一样，我们可以通过输入 `use databasename;` 来连接到我们感兴趣的数据库。\n\
  \n```mysql\nmysql >use creditcardnumbers;\nDatabase changed\n```\n\n`Database changed`\
  \ 响应表示我们现在已连接到 `creditcardnumbers` 数据库。\n\n当然，不而喻的是，数据库管理员不太可能如此配合，将数据库命名为 `creditcardnumbers`\
  \ 这样易于识别的名字，因此你可能需要进行一些探索来找到感兴趣的数据库。\n\n### 数据库表\n\n我们现在已连接到 `creditcardnumbers`\
  \ 数据库，可以进行一些探索看看它可能包含哪些信息。数据库中的数据组织成`tables`，每个表都可能包含一组不同的相关数据。我们可以通过输入以下命令来查看此数据库中有哪些表：\n\
  \n```mysql\nmysql >show tables;\n\n+-----------------------------------+\n| Tables_in_creditcardnumbers\
  \      |\n+-----------------------------------+\n|  cardnumbers                \
  \      |\n+-----------------------------------+\n1 row in set (0.14 sec)\n```\n\n\
  在这里，我们可以看到该数据库只有一个表，名为 `cardnumbers`。通常情况下，数据库会包含许多表，因此你可能需要进行更多的窥探。在这个示例数据库中，我们有幸可以将注意力集中在这张表上，提取黑客的“金羊毛”！\n\
  \n现在我们已经有了想要检查的表，我们需要了解该表的结构。一旦知道了表的布局，我们就可以提取相关信息。\n\n你可以使用 `describe` 语句查看表的结构，如下：\n\
  \n```mysql\nmysql >describe cardnumbers;\n\n+---------------+--------------+---------+-----------+---------+---------+\n\
  | Field         | Type         | Null  | Key  | Default | Extra |\n+---------------+--------------+---------+-----------+---------+---------+\n\
  | customers     | varchar(15)  | YES   |       | NULL    | |\n| address       |\
  \ varchar(15)  | YES   |       | NULL    | |\n| city          | varchar(15)  | YES\
  \   |       | NULL    | |\n| state         | varchar(15)  | YES   |       | NULL\
  \    | |\n| cc            | int(12)      | NO    |       | 0       | |\n+---------------+--------------+---------+-----------+---------+---------+\n\
  ```\n\n`MySQL` 返回关于我们感兴趣的表结构的关键信息。我们可以看到每个字段的以及它所持的数据类型（通常是文本 `varchar` 或整数类型 `int`）。我们还可以看到它是否接受\
  \ `NULL` 值；如果存在的 `key`（`key` 用于链接表）；一个字段可能拥有的任何默认值；以及末尾的任何额外信息。\n\n### 检查数据\n\n\
  要实际查看表中的数据，我们使用 `SELECT` 命令。`SELECT` 命令需要你了解以下信息：\n\n*   包含你想查看的数据的表\n*   该表中包含你想查看的数据的列\n\
  \n我们按照以下格式列出：\n\n`SELECT columns FROM table`\n\n作为查看所有列数据的方便快捷方法，我们可以使用星号 `*` 作为通配符，而不是输入我们想要查看的每个列名。因此，为了查看\
  \ `cardnumbers` 表中所有数据的导出，我们输入以下内容：\n\n```mysql\nmysql >SELECT * FROM cardnumbers;\n\
  \n+-----------+---------------+-------------+--------------+\n| customers | address\
  \       | city        | state    | cc         |\n+-----------+---------------+-------------+--------------+\n\
  | Jones     | 1 Wall St     | NY          | NY       | 12345678  |\n| Sawyer   \
  \ | 12 Piccadilly | London      | UK       | 234567890 |\n| Doe      | 25 Front\
  \ St   | Los Angeles | CA       | 4567898877 |\n+-----------+---------------+-------------+--------------+\n\
  ```\n\n如你所见，`MySQL` 将 `cardnumbers` 表的所有信息显示在了我们的屏幕上。我们找到了黑客的金羊毛！\n\n### 带有 Metasploit\
  \ 的 PostgreSQL\n\n`PostgreSQL`，或简称 `Postgres`，是另一种开源关系型数据库，通常用于非常大型面向互联网的应用程序。由于能够轻松扩展并处理沉重负载，`PostgreSQL`\
  \ 在 1996 年首次发布，并由庞大的开发者群体维护。在 `Kali` 中，默认安装了 `PostgreSQL`，但如果你使用的是其他 Linux 发行版，可以通过以下命令安装：\n\
  \n```bash\napt-get install postgresql\n```\n\n作为黑客，你会发现 `PostgreSQL` 特别重要，因为它是常用的渗透测试框架\
  \ `Metasploit`。与大多数 Linux 服务一样，我们可以通过输入 `service start` 来启动 `PostgreSQL`：\n\n```bash\n\
  service postgresql start\n```\n\n`postgresql` 启动后，让我们启动 `Metasploit`：\n\n```bash\n\
  msfconsole\n```\n\n如何利用 `Metasploit` 超出了本书的范围，但在这里我们通过以下命令设置 `PostgreSQL`，以便 `Metasploit`\
  \ 在你的系统中存储数据：\n\n```bash\nmsf >msfdb init\n[*] exec :msfdb init\nCreating database\
  \ use 'msf'\nEnter password for new role\nEnter it again:\nCreating databases 'msf'\n\
  Creating configuration file /usr/share/metasploit-framework/config/database.yml\n\
  Creating initial database schema\n```\n\n我们需要以 root 身份登录 `PostgreSQL`。在这里，我们在命令前加上\
  \ `su`（切换用户命令）以获取 root 权限：\n\n```bash\nmsf >su postgres\n[*] su postgres\npostgres@kali:/root$\n\
  ```\n\n当你登录 `PostgreSQL` 时，你会发现提示符变成了 `postgres@kali:/root$`，代表应用程序、主机名和用户。下一步，我们需要创建一个用户和密码，如下：\n\
  \n```bash\npostgres@kali:/root$ createuser msf_user -P\nEnter Password for new role:\n\
  Enter it again:\n```\n\n我们使用 `-P` 配合 `createuser` 命令创建用户名 `msf_user`。然后两次输入所需的密码。接下来，你需要创建一个数据库并授予\
  \ `msf_user` 权限。如所示，将数据库命名为 `hackers_arise_db`：\n\n```bash\npostgres@kali:/root$\
  \ createdb --owner=msf_user hackers_arise_db\npostgres@kali:/root$ exit\n```\n\n\
  当你使用 `exit` 命令退出 `PostgreSQL` 时，终端将回到 `msf` 提示符。接下来，我们需要将我们的 Metasploit 控制台 `msfconsole`\
  \ 连接到 `PostgreSQL` 数据库，通过定义以下内容：\n\n*   用户\n*   密码\n*   主机\n*   数据库名\n\n在我们案例中，我们可以通过以下命令将\
  \ `msfconsole` 连接到数据库：\n\n```bash\nmsf >db_connect msf_user:password@127.0.0.1/hackers_arise_db\n\
  ```\n\n\n\n当然，你将需要提供之前使用的密码。IP 地址是你本地系统的地址（`localhost`），除非你是在远程系统上构建了此数据库，否则你可以使用\
  \ `127.0.0.1`。\n\n最后，我们可以检查 `PostgreSQL` 数据库的状态，以确保它已连接：\n\n```\nmsf >db_status\n\
  [*] postgresql connected to msf\n```\n\n如你所见，Metasploit 响应显示 `PostgreSQL` 数据库已连接并准备就绪。现在，当我们使用\
  \ Metasploit 进行系统扫描或运行利用程序时，结果将存储在我们的 PostgreSQL 数据库中。此外，Metasploit 现在将其模块存储在我们的\
  \ Postgres 数据库中，这使得搜索正确的模块变得更加简单和快速！\n\n## 总结\n\nLinux 拥有许多在后台运行的服务，直到用户需要它们为止。Apache\
  \ Web 服务器是最广泛使用的，但黑客也应该熟悉 `MySQL`、`SSH` 和 `PostgreSQL` 以应对各种任务。在这一章中，我们涵盖了启动这些服务的绝对基础知识。一旦你对自己的\
  \ Linux 系统了如，我敦促你去进一步探索这些服务的每一个部分。\n\n## 练习\n\n在进入第 13 章之前，请通过完成以下练习来尝试你在本章中学到的技能：\n\
  \n1. 通过命令行启动你的 `apache2` 服务。\n2. 使用 `index.html` 文件创建一个简单的网站，宣布你进入了精彩的黑客世界。\n3.\
  \ 通过命令行启动你的 `SSH` 服务。现在从局域网上的另一个系统连接到你的 Kali 系统。\n4. 启动你的 `MySQL` 数据库服务并将 root 用户密码更改为\
  \ `hackers-arise`。切换到 `mysql` 数据库。\n5. 启动你的 `PostgreSQL` 数据库服务。按照本章描述将其供 Metasploit\
  \ 使用。\n\n## 13 变得安全与匿名\n\n![image](img/common01.jpg)\n\n今天，我们在互联网上做的几乎每件事都被追踪了。无论是谁在追踪——无论是\
  \ Google 追踪我们的在线搜索、网站访问和电子邮件，还是国家安全局 (NSA) 记录我们所有的活动——我们的每一个在线动作都在被记录、索引，然后为了某人的利益而进行挖掘。普通个人——特别是黑客——需要了解如何限制这种追踪，并在网络上保持相对匿名，以限制这种无处不在的监控。\n\
  \n在这一章中，我们将查看你如何使用四种方法匿名（或尽可能接近匿名）地浏览万维网：\n\n* 洋洋葱网络 (The Onion Network)\n* 代理服务器\n\
  * 虚拟专用网络 (VPN)\n* 私密加密电子邮件\n\n没有一种方法可以确保你的活动完全免受窥探之目光，而且在有足够的时间和资源的情况下，任何事情都可以被追踪。然而，这些方法可能会让追踪者的工作变得困难得多。\n\
  \n### 互联网是如何出卖我们的\n\n首先，让我们从高层面上讨论一下我们在互联网上的活动被追踪的一些方式。我们不会介绍所有的追踪方法，也不会对任何一种方法进行过细的描述，因为那超出了本书的范围。事实上，这样的讨论本身就可以写满一整本书。\n\
  \n首先，当你穿过互联网时，你的 `IP address` 会识别你的身份。从你的机器发送的数据通常会标记有你的 `IP address`，使得你的活动很容易被追踪。其次，Google\
  \ 和其他电子邮件服务会“读取”你的邮件，寻找关键词以更有效地向你投放广告。尽管还有许多更复杂、更耗费时间和资源的方法，但这些是我们在本章中尝试防止的。让我们先看看\
  \ `IP addresses` 是如何在互联网上让我们出卖的。\n\n当你跨越互联网发送一个数据包时，它包含了数据源和目的地的 `IP addresses`。通过这种方式，数据包知道它要去哪里。这种方式，数据包知道它要去哪里。这种方式，数据包知道它要去哪里。这种方式，数据包知道它要去哪里。这种方式，数据包知道它要去哪里。这种方式，数据包知道它要去哪里。这种方式，数据包知道它要去哪里。这种方式，数据包知道它要去哪里。\n\
  \n为了看到数据包在互联网上路径的路径以及在互联网上经过的跳数，你可以使用 `traceroute` 命令，如下所示：\n\n```\nkali >traceroute\
  \ google.com\n\ntraceroute to google.com (172.217.1.78), 30 packets\n\n1   192.168.1.1\
  \ (192.168.1.1)   4.152 ms  3.834 ms\n2.10.0.0.1 (10.0.0.1)   5.797 ms  6.995 ms\
  \  7.679 ms\n3   96.120.96.45 (96.120.96.45)\n```\n\n当数据包在互联网上穿行时，拦截数据包的人可以看到它是谁发送的，它去过哪里，以及它要去哪里。这种方式，网站可以知道你是谁并自动登录，而且这种方法也能让某人追踪你去过哪里。\n\
  \n### 洋葱路由器系统 (The Onion Router)\n\n20 世纪 90 年代，美国海军研究办公室 (ONR) 致力于开发一种用于间谍活动的匿名浏览互联网的方法。该计划是建立一个与互联网隔离的路由器网络，可以加密流量，并且只存储上一个跳的\
  \ IP 地址。这项研究在 2002 年被称为“洋葱路由器 (Tor) 项目”，现在任何人都可以。\n\n### Tor 如何工作\n\n在 Tor 上发送的数据包不是通过被监控的普通路由器发送的，而是通过全球\
  \ 7000 个路由器发送的，这归功于允许其计算机被使用的志愿者。除了使用完全独立的路由器外，Tor 还加密了数据、目的地和发送者的 IP 地址。在每一个跳处，信息都会被加密，并在下一个跳接收时被解密。通过这种方式，每个数据包只包含路径上上一个跳的信息，而不是源地的\
  \ IP 地址。如果有人拦截了流量，他们只能看到上一个跳的 IP 地址，而网站所有只能看到发送流量的最后一个路由器的 IP 地址（参见图 13-1）。要启用 Tor，只需从\
  \ `[`www.torproject.org/`](https://www.torproject.org/)` 安装 Tor 浏览器。安装后，它看起来就像图\
  \ 13-2，你可以像使用任何旧的浏览器一样使用它。\n\n\n\n\n![image](img/f0142-01.jpg)\n\n*图 13-2：Tor 浏览器的首页*\n\
  \nTor 不仅能够访问传统互联网上的几乎任何网站，还能访问`dark web`（暗网）。构成暗网的网站需要匿名性，因此它们仅允许通过 Tor 浏览器访问，并且其顶级域名（TLD）以\
  \ `.onion` 结尾。暗网因非法活动而闻名，但那里也有许多合法的服务。然而，需要提醒的是：在访问暗网时，可能会遇到许多人认为令人反感的内容。\n\n###\
  \ 安全担忧\n\n美国和其他国家的情报和间谍机构认为 Tor 网络是对国家安全的威胁，认为这种匿名网络使外国政府和恐怖分子能够在不受受监视的情况下进行通信。因此，许多强大且雄心勃勃的研究项目正致力于破解\
  \ Tor 的匿名性。\n\nTor 的匿名性曾被这些机构破解，并且很可能再次被破解。例如，美国国家安全局（NSA）运行着自己的 Tor 节点，这意味着当你使用\
  \ Tor 时，你的流量可能正在经过 NSA 的路由器。如果你的流量从 NSA 的路由器流出，情况会更加糟糕，因为出口节点始终知道你的目的地。NSA 还有一种名为`traffic\
  \ correlation`（流量相关）的方法，通过查找入站和出站流量中的模式，这种方法能够破解 Tor 的匿名性。尽管这些破解 Tor 的尝试不会影响 Tor\
  \ 在向 Google 等商业服务隐藏你身份的有效性，但它们可能会限制浏览器在防止间谍机构获取你身份方面的功效。\n\n### 代理服务器\n\n在互联网上实现匿名性的另一种策略是使用`proxies`（代理），它们是充当中间人的中间系统：用户连接到代理，流量在被传递之前会被赋予代理服务器的\
  \ IP 地址（参见图 13-3）。当流量从目的地返回时，代理服务器将流量发回源地址。这样，流量看起来来自代理服务器，而不是原始 IP 地址。\n\n![image](img/f0143-01.jpg)\n\
  \n*图 13-3：通过代理服务器运行流量*\n\n当然，代理服务器可能会记录你的流量，但调查人员必须获得传票或搜索令才能获取日志。为了让你的流量更难追踪，你可以使用多个代理，这种策略被称为`proxy\
  \ chain`（代理链），我们将在本章稍后部分介绍它。\n\nKali Linux 有一个名为`proxychains` 的优秀代理工具，你可以设置它来隐藏你的流量。`proxychains`\
  \ 命令的语法非常直观，如下：\n\n```\nkali >proxychains <想要代理的命令> <参数>\n```\n\n你提供的参数可能包括 IP 地址。例如，如果你想用\
  \ `proxychains` 通过 `nmap` 匿名扫描某个站点，可以输入以下内容：\n\n```\nkali >proxychains nmap -sT\
  \ -Pn <IP address>\n```\n\n这将通过代理向给定的 IP 地址发送 `nmap -sS` 隐蔽扫描命令。该工具会自动构建代理链，因此你不需要担心这一点。\n\
  \n### 在配置文件中设置代理\n\n在本节中，我们为 `proxychains` 命令设置一个使用的代理。与 Linux/Unix 中的几乎每个应用程序一样，`proxychains`\
  \ 的配置由配置文件管理——具体为 `/etc/proxychains.conf`。使用以下命令用你喜欢的文本编辑器打开配置文件（如有必要，将 `leafpad`\
  \ 替换为你选择的编辑器）：\n\n```\nkali >leafpad /etc/proxychains.conf\n```\n\n你应该能看到一个类似于列表\
  \ 13-1 中所示的文件。\n\nproxychains.conf VER 3.1\n\n# HTTP, SOCKS4, SOCKS5 隧道代理工具，带 DNS\
  \ 支持。\n# 下方的选项标识了如何处理 ProxyList。\n# 每次只应取消注释一个选项，\n# 否则最后出现的选项将被接受\n#\n# dynamic_chain\n\
  #\n# 动态链 - 每个连接都将通过链代理完成\n# 所有代理按照它们在列表中出现的顺序串联\n# 链中必须至少有一个代理在线才能运行\n# （失效的代理将被跳过）\n\
  # 否则向应用返回 EINTR\n# Strict - 严格链 - 每个连接都将通过链代理完成\n# 所有代理按照它们在列表中出现的顺序串联\n# 链中所有代理都必须在线才能运行\n\
  # 否则向应用返回 EINTR M\n--snip--\n\n*列表 13-1：proxychains.conf 文件*\n\n向下滚动到该文件的第 61 行，你应该能看到\
  \ `ProxyList` 部分，如列表 13-2 所示。\n\n```\n[ProxyList]\n\n# 在此处添加代理...\n# 同时\n# 默认设置为\
  \ \"tor\"\nsocks4 127.0.0.1 9050\n```\n*列表 13-2：用于添加代理的配置文件部分*\n\n我们可以通过在该列表中输入想要使用的代理的\
  \ IP 地址和端口来添加代理。目前，我们将使用一些免费代理。你可以通过在谷歌搜索“free proxies”或使用网站 [`www.hidemy.name`](http://www.hidemy.name)\
  \ 来寻找免费代理，如图 13-4 所示。\n\n![image](img/f0142-01.jpg)\n*图 13-4：来自 [`www.hidemy.name`](http://www.hidemy.name)\
  \ 的免费代理*\n\n（注：输入文本包含重复/格式残留，已根据提供的源文件进行了逻辑清理。）\n\n```\n[ProxyList]\n\n# 在此处添加代理...\n\
  # 同时\n# 默认设置为 \"tor\"\nsocks4 127.0.0.1 9050\n```\n*列表 13-2：用于添加代理的配置文件部分*\n\n\n\
  \n\n现在保存此配置文件并尝试运行以下命令：\n\n```\nkali >proxychains firefox www.hackers-arise.com\n\
  ```\n\n你不会发现任何不同，但你的数据包现在正在通过多个代理传输。\n\n## 动态链 (Dynamic Chaining)\n\n在我们的 `proxychain.conf`\
  \ 文件中包含多个 IP 的情况下，我们可以设置 `dynamic chaining`。它会让我们的流量通过列表中的每个代理运行，如果其中一个代理宕机或没有响应，它会自动跳转到列表中的下一个代理，而不会抛出错误。如果不设置此项，单个代理的故障就会破坏我们的请求。\n\
  \n回到你的 proxychains 配置文件，找到 `dynamic_chain` 行（第 10 行）并取消它的注释，如下所示。同时，确保已经注释掉了 `strict_chain`\
  \ 行（如果没有的话）。\n\n```bash\n# dynamic_chain\n\n#\n# Dynamic – 每个连接将通过代理链完成\n# 所有代理按照它们在列表中出现的顺序进行链链\n\
  # 必须至少有一个代理在线才能参与链\n--snip--\n```\n\n这将启用代理的动态链，从而实现更高的匿名性和无忧的黑客操作。保存配置文件并尽管尝试一下。\n\
  \n## 随机链 (Random Chaining)\n\n我们的最后一个代理技巧是 `random chaining` 选项，proxychains 将从我们的列表中随机选择一组\
  \ IP 地址并使用它们来创建我们的代理链。这意味着每次我们使用 proxychains 时，目标看到的代理都是不同的，这更难从源头追踪我们的流量。此选项也被认为是“动态”的，因为如果其中一个代理宕机，它将跳到下一个。\n\
  \n回到 `/etc/proxychains.conf` 文件，通过在每行开头添加 `#` 来注释掉 `dynamic_chain` 和 `strict_chain`\
  \ 行；然后取消 `random_chain` 行的注释。我们一次只能使用这三个选项中的一种，因此在使用 proxychains 之前，请确保已注释掉其他选项。\n\
  \n接下来，找到带有 `chain_len` 的行并取消注释，然后给它一个合理的数字。此行决定了你的链中有多少个 IP 地址被用于创建随机代理链。\n\n```bash\n\
  # dynamic_chain\n\n#\n# Dynamic – 每个连接将通过代理链完成\n# 所有代理按照它们在列表中出现的顺序进行链链\n# 必须至少有一个代理在线才能参与链\n\
  \n#\n\n# strict_chain\n\n#\n\n# Strict - 每个连接将通过代理链完成\n# 所有代理按照它们在列表中出现的顺序进行链链\n\
  # 所有代理都必须在线才能参与链\n# 否则向应用程序返回 EINTR\n\nrandom_chain\n\n# Random - 每个连接将通过列表中的随机代理\n\
  #（或代理链，参见 chain_len）完成。\n# 此选项非常适合测试你的 IDS :) \n# 仅在开启 random_chain 时才有意义\n\nchain_len\
  \ = 3\n```\n\n在这里，我取消了 `chain_len` 的注释并给其赋值为 `3`，这意味着 proxychains 现在将使用我在 `/etc/proxychains.conf`\
  \ 文件列表中的三个代理，随机选择它们，并在代理宕机时移动到下一个。请注意，尽管这种方法确实增强了你的匿名性，但也增加了你在线活动的延迟。\n\n现在你已经知道如何使用\
  \ proxychains，你可以以相对的匿名性进行你的黑客操作了。（*注：原文此处存在大量重复性文本，已根据指令要求进行清理*）\n\n\n\n\n防止电子邮件被窃听的一种方法是使用加密电子邮件。图\
  \ 13-5 所示的 `ProtonMail` 可以实现端到端或从浏览器到器的加密。这意味着你的邮件在 `ProtonMail` 服务器上是加密的——即使是 `ProtonMail`\
  \ 管理员也无法读取你的邮件。\n\n`ProtonMail` 由瑞士 CERN 超粒子对撞机设施的一群年轻科学家创立。瑞士人在保护秘密方面悠久而传奇的历史（记得你经常听到的那些瑞士银行账户吗？），而且\
  \ `ProtonMail` 服务器位于欧盟，该地区在个人数据共享方面的法律比美国严格得多。`ProtonMail` 不对基础账户收费，但提供低廉的高级账户。需要注意的是，当与非\
  \ `ProtonMail` 用户交换邮件时，邮件可能部分或全部未被加密。请参阅 `ProtonMail` 支持知识库获取完整详情。\n\n![image](img/f0150-01.jpg)\n\
  \n*图 13-5：ProtonMail 登录*\n\n## 总结\n\n我们一直受到商业公司和国家情报机构的监视。为了确保你的数据和网络旅行安全，你需要实施本章讨论的至少一种安全措施。通过结合使用这些措施，你可以最大限地减少你在网络上的足迹，并让数据更加安全。\n\
  \n## 练习\n\n在进入第 14 章 之前，尝试通过完成练习来运用在本章中学到的技能：\n\n1. 对你喜欢的网站运行 `traceroute`。你和你喜爱的网站之间出现了多少跳数（hops）？\n\
  2. 下载并安装 `Tor` 浏览器。现在，像使用任何其他浏览器一样匿名浏览网页，看看是否注意到速度有任何差异。\n3. 尝试使用 `proxychains`\
  \ 配合 `Firefox` 浏览器访问喜欢的网站。\n4. 探索本章列出的某些供应商提供的商业 VPN 服务。选择一个并测试免费试用。\n5. 打开一个免费\
  \ `ProtonMail` 账户并向 `occupytheweb@protonmail.com` 发送一条安全的问候。\n\n## 14 理解与检查无线网络\n\
  \n![image](img/common01.jpg)\n\n从系统扫描并连接到其他网络设备的能力是成为成功黑客的关键，随着 `Wi-Fi` (IEEE 802.1)\
  \ 和 `Bluetooth` 等无线技术成为标准，发现并控制 `Wi-Fi` 和 `Bluetooth` 连接是关键。如果有人可以破解无线连接，他们就可以进入设备并访问机信息。当然，第一步是学习如何找到这些设备。\n\
  \n在第 3 章中，我们查看了 `Linux` 中的一些基础网络命令，包括无线网络的一些基础，并承诺在第 14 章介绍更多无线网络内容。正如承诺的，在这里我们检查\
  \ `Linux` 中两种常用的无线技术：`Wi-Fi` 和 `Bluetooth`。\n\n### Wi-Fi 网络\n\n我们将从 `Wi-Fi` 开始。在本节中，我将向你展示如何查找、检查和连接\
  \ `Wi-Fi` 接入点。在此之前，让我们花一点时间回顾基本的 `Wi-Fi` 术语和技术，帮助你更好地理解本章许多查询的输出：\n\n- **AP (接入点)**：无线用户连接以访问互联网的设备。\n\
  - **ESSID (扩展服务集标识符)**：这与第 3 章中讨论的 `SSID`相同，但它可以用于无线局域网中的多个 `APs`。\n- **BSSID (基本服务集标识符)**：这是每个\
  \ `AP` 的唯一标识，等于设备的 `MAC` 地址。\n- **SSID (服务集标识符)**：这是网络名称。\n- **通道 (Channels)**：`Wi-Fi`\
  \ 可以在 14 个通道（1–14）中的任何一个运行。在美国，`Wi-Fi` 受到限制。\n- **功率 (Power)**：越靠近 `AP`，连接越强。\n\
  - **安全 (Security)**：有三种协议。原始的 `WEP`（等同隐私）是有缺陷的。它的替代品 `WPA`（Wi-Fi 保护访问）更安全。现在使用的是\
  \ `WPA2-PSK`。\n- **模式 (Modes)**：`Wi-Fi` 可以三种模式之一运行：`managed`（管理）、`master`（主）或 `monitor`（监听）。\n\
  - **无线范围 (Wireless range)**：范围取决于 `Wi-Fi` 信号。\n- **频率 (Frequency)**：`Wi-Fi` 运行在\
  \ 2.4/5GHz 上。\n\n#### 基础命令\n\n在第 3 章中，我们查看了 `Linux` 中的一些基础网络命令。如果你只想查看你的无线接口及其统计数据，`Linux`\
  \ 有一个类似于 `ifconfig` 但专门用于无线设备的特定命令。该命令是 `iwconfig`。当你输入它时，只会显示你的无线接口：\n\n```bash\n\
  iwconfig\n```\n\n在这里，我们只看到无线接口（也称为网卡）以及关于它们的关键数据。在 Kali 中，无线接口通常指定为 `wlanX`，其中 `X`\
  \ 代表该接口的数字。也就是说，第一个适配器是 `wlan0`，第二个是 `wlan1`，以此此类推。\n\n如果你不确定想连接到哪个 `Wi-Fi` AP，可以使用\
  \ `iwlist` 命令查看你的网卡可以到达的所有无线接入点。`iwlist` 的语法如下：\n\n```bash\niwlist interface action\n\
  ```\n\n你可以对 `iwlist` 执行多个操作。出于我们的目的，我们将使用 `scan` 操作来查看区域内所有的 `Wi-Fi` AP。\n\n```bash\n\
  iwlist wlan0 scan\n```\n\n\n\n\n信道:1\n频率:2.412GHz (信道 1)\n质量=70/70 信号强度 =-38 dBm\n\
  加密:关闭\nESSID:\"Hackers-Arise\"\n--snip--\n\n此命令的输出应包含你无线接口范围内的所有 Wi-Fi AP（接入点），以及每个\
  \ AP 的关键数据，例如 AP 的 MAC 地址、它运行的信道和频率、其质量、信号强度、是否启用了加密密钥以及其 ESSID。\n\n为了执行任何形式的破解，你需要目标\
  \ AP 的 MAC 地址（`BSSID`）、客户端（另一个无线网卡）的 MAC 地址以及 AP 运行的信道，因此这些非常有价值的信息。\n\n另一个在管理 Wi-Fi\
  \ 连接时非常有实用的命令是 `nmcli`（或 `network manager` 命令行界面）。用于为网络接口（包括无线接口）提供高层接口的 Linux 守护进程被称为\
  \ `network manager`。通常，Linux 用户通过其图形用户界面（GUI）熟悉这个守护进程，但也可以从命令行使用它。\n\n可以使用 `nmcli`\
  \ 命令像我们之前使用 `iwlist` 一样查看附近的 Wi-Fi AP 及其关键数据，但此命令提供了更多的信息。我们使用的格式为 `nmcli dev networktype`，其中\
  \ `dev` 是 `devices` 的缩写，类型（在这种情况下）是 wifi，如下所示：\n\n```bash\nkali >nmcli dev wifi\n\
  ```\n\nSSID            MODE  CHAN  RATE           SIGNAL  BARS    SECURITY\nHackers-Arise\
  \  Infra  1      54 Mbits/s     100             WPA1 WPA2\nXfinitywifi     Infra\
  \  1      54 Mbits/s      75              WPA2\nTPTV1           Infra  11     54\
  \ Mbits/s      44              WPA1 WPA2\n--snip--\n\n除了显示范围内的 Wi-Fi AP 及其相关的关键数据（包括\
  \ SSID、模式、信道、传输速率、信号强度以及设备上启用的安全协议）外，`nmcli` 还可以用于连接到 AP。连接到 AP 的语法如下：\n\n```bash\n\
  nmcli dev wifi connect AP-SSID password APpassword\n```\n\n因此，根据我们第一个命令的结果，我们知道有一个\
  \ SSID 为 Hackers-Arise 的 AP。我们知道它具有 WPA1 WPA2 安全性（这意味着 AP 能够同时使用旧的 WPA1 和新的 WPA2），这意味着我们需要提供密码才能连接到网络。幸运的是，由于这是我们的\
  \ AP，我们知道密码是 `12345678`，所以我们可以输入以下：\n\n```bash\nkali >nmcli dev wifi connect Hackers-Arise\
  \ password 12345678\n```\n\n设备 'wlan0' 已成功激活，标识为 '394a5bf4-8af4-36f8-49beda6cb530'。\n\
  \n在你熟悉的网络上尝试此操作，当你成功连接到该无线 AP 后，再次运行 `iwconfig` 查看发生了变化。以下是我连接到 Hackers-Arise 的输出：\n\
  \n```bash\nkali >iwconfig\n\nlo   no wireless extensions\nwlan0 IEEE 802.11bg  \
  \ ESSID:\"Hackers-Arise\"\n   Mode:Managed  Frequency:2.452GHz Access Point:00:25:9C:97:48\n\
  \   Bit Rate=12 Mbs Tx-Power=20 dBm\n   Retry limit:7  RTS thr:off  Fragment thr:off\n\
  \   Encryption key:off\n   Power Management:off\n   Link Quality=64/70 Signal level=-38\
  \ dBm\n```\n\n\n\n\n注意 `airodump-ng` 将输出屏幕分为上半部分和下半部分。上半部分包含广播 AP 的信息，包括 BSSID、AP\
  \ 功率、检测到的信标帧（beacon frames）数量、数据吞吐率、经过无线卡的数据包数量、通道（1–14）、理论吞吐量限制、加密协议、用于加密的密码、认证类型以及\
  \ ESSID（通常称为 `SSID`）。在客户端部分，输出告诉我们有一个客户端未关联（not associated），意味着它已被检测到但未连接到任何 AP；另一个已与基站关联（associated），意味着它已连接到该地址的\
  \ AP。\n\n现在你已经有了破解 AP 所需的所有信息！虽然这超出了本书的范围，但要破解无线 AP，你需要客户端 MAC 地址、AP MAC 地址、目标运行的通道以及密码列表。\n\
  \n因此，为了破解 Wi-Fi 密码，你需要打开三个终端。在第一个终端中，你将输入类似下面的命令，并填写客户端和 AP 的 MAC 地址以及通道：\n\n```\n\
  airodump-ng -c 10 --bssid 01:01:AA:BB:CC:22 -w Hackers-ArisePSK wlan0mon\n```\n\n\
  该命令使用 `-c` 选项捕获第 10 通道上经过 AP 的所有包。\n\n在另一个终端中，你可以使用 `aireplay-ng` 命令将任何连接到 AP 的用户踢下（取消认证），并强制他们重新对\
  \ AP 进行认证，如下所示。当他们重新认证时，你可以捕获它们在 WPA2-PSK 四次握手中交换的密码哈希。密码哈希将出现在 `airodump-ng` 终端的右上角。\n\
  \n```\naireplay-ng --deauth 100 -a 01:01:AA:BB:CC:22 -c A0:A3:E2:44:7C:E5 wlan0mon\n\
  ```\n\n最后，在最后一个终端中，你可以使用密码列表（`wordlist.dic`）在捕获的哈希（`Hackers-ArisePSK.cap`）中查找密码，如下：\n\
  \n```\naircrack-ng -w wordlist.dic -b 01:01:AA:BB:CC:22 Hacker-ArisePSK.cap\n```\n\
  \n### 检测并连接蓝牙\n\n如今，几乎每个小设备、移动设备和系统都内置了蓝牙，包括我们的电脑、智能手机、iPod、平板电脑、扬声器、游戏控制器、键盘以及许多其他设备。破解蓝牙可能会导致设备上任何信息的泄露、对设备的控制以及向设备收发非意愿信息的能力等。\n\
  \n为了利用这项技术，我们需要了解它是如何工作的。对蓝牙的深入理解超出了本书的范围，但我将为你提供一些基础知识，这将帮助你扫描并连接蓝牙设备，为破解它们做准备。\n\
  \n### 蓝牙如何工作\n\n蓝牙是一种用于工作在 2.4–2.485GHz 频率的低功耗、近场通信通用协议，使用扩频技术和每秒 1,600 次的跳频（这种频率跳变是一种安全措施）。它由瑞典爱立信公司于\
  \ 1994 年开发，并以 10 世纪的丹麦国王哈拉尔德·蓝牙（Harald Bluetooth）命名（注意，在 10 世纪，瑞典和丹麦是一个国家）。\n\n\
  蓝牙规范的最小范围为 10 米，但对制造商在设备中实现的最大范围没有限制。许多设备的范围高达 100 米。通过特殊天线，该范围可以延伸得更远。\n\n连接两个蓝牙设备被称为\
  \ `pairing`（配对）。几乎两个蓝牙设备都可以相互连接，但只有当它们处于可发现模式（discoverable mode）时才能配对。处于可发现模式的蓝牙设备传输以下信息：\n\
  \n* 名称\n* 类\n* 服务列表\n* 技术信息\n\n当两个设备配对时，它们会交换密钥或链路密钥。每个设备都存储此链路密钥，以便在未来的配对中识别对方。\n\
  \n每个设备都有一个唯一的 48 位标识符（类似于 MAC 的地址），并且通常有一个制造商指定的名称。当我们想要识别和访问设备时，这些将是很有用的数据。\n\n\
  ### 蓝牙扫描与侦察\n\nLinux 有一个名为 `BlueZ` 的蓝牙协议栈实现，我们将用它来扫描蓝牙信号。大多数 Linux 发行版（包括 Kali Linux）都默认安装了它。如果你的系统没有，通常可以通过以下命令在存储库中找到它：\n\
  \n```\nkali >apt-get install bluez\n```\n\n`BlueZ` 拥有许多可以用于管理和扫描蓝牙设备的简单工具，包括：\n\n\
  * `hciconfig`：此工具的操作方式与 Linux 中的 `ifconfig` 非常相似，但是针对蓝牙设备的。如列表 14-1 所示，我使用它来启动蓝牙接口并查询设备的规格。\n\
  * `hcitool`：此查询工具可以为我们提供设备名称、设备 ID、设备类和设备时钟信息，使设备能够同步工作。\n* `hcidump`：此工具允许我们嗅探蓝牙通信，这意味着我们可以捕获通过蓝牙信号发送的数据。\n\
  \n使用蓝牙进行第一步扫描和侦察，是检查我们正在使用的系统上的蓝牙适配器是否被识别并启用，这样我们就可以使用它来扫描其他设备。我们可以使用内置的 `BlueZ`\
  \ 工具 `hciconfig` 来此，如列表 14-1 所示。\n\n```\nkali >hciconfig\n```\n\nhci0: Type: BR/EDR\
  \  Bus: USB\n      BD Address: 10:AE:60:58:F1:37  ACL  MTU: 310:10  SCO  MTU:  64:8\n\
  \      UP RUNNING PSCAN INQUIRY\n      RX bytes:131433 acl:45 sco:0 events:10519\
  \  errors:0\n      TX bytes:42881  acl:45 sco:0 commands:5081 errors:0\n```\n*列表\
  \ 14-1: 扫描蓝牙设备*\n\n如你所见，我的蓝牙适配器通过 MAC 地址 `10:AE:60:58:F1:37` 被。该适配器被命名为 `hci0`。下一步是检查连接是否启用，我们也可以通过向\
  \ `hciconfig` 提供名称和 `up` 命令来实现：\n\n```\nkali >hciconfig hci0 up\n```\n\n如果命令运行成功，我们应该看到任何输出，只有一个新的提示符。\n\
  \n很好，`hci0` 已启动！让我们开始工作吧。\n\n#### 使用 hcitool 扫描蓝牙设备\n\n既然我们知道适配器已启动，可以使用 `BlueZ`\
  \ 工具包中的另一个工具 `hcitool`，它用于扫描范围内的蓝牙设备。\n\n让我们首先使用该工具的扫描功能查找正在发送发现 beacon（这意味着它们处于可发现模式）的蓝牙设备，使用列表\
  \ 14-2 所示的简单命令：\n\n```\nkali >hcitool scan\n```\n\nScanning...\n      72:6E:46:65:72:66\
  \      ANDROID BT\n      22:C5:96:08:5D:32      SCH-I35\n```\n*列表 14-2: 扫描可发现模式下的蓝牙设备*\n\
  \n如你所见，在我的系统中，`hcitool` 发现了两个设备：ANDROID BT 和 SCH-I35。你的输出可能会取决于周围的设备。为了测试，尝试将手机或其他蓝牙设备设置为可发现模式，看看它是否被扫描到。\n\
  \n现在使用查询功能 `inq` 获取有关检测设备的更多信息：\n\n```\nkali >hcitool inq\n```\n\nInquiring...\n\
  \      24:C6:96:08:5D:33  clock offset:0x4e8b      class:0x5a020c\n      76:6F:46:65:72:67\
  \  clock offset:0x21c0      class:0x5a020c\n```\n\n这给了我们设备的 MAC 地址、时钟偏移（clock offset）和设备类别。类别指示了你发现了什么类型的蓝牙设备，你可以访问蓝牙\
  \ SIG 网站 `https://www.bluetooth.org/en-us/specification/assigned-numbers/service-discovery/`\
  \ 查询代码并查看设备类型。\n\n\n\n\n\n工具 `hcitool` 是一个用于蓝牙栈的强大命令行界面，可以执行许多、许多操作。列表 14-3 显示了帮助页面，其中包含你可以的一些命令。你可以亲自查看帮助页面以获取完整列表。\n\
  \n```\nkali >hcitool --help\n\nhcitool - HCI Tool ver 4.99\n\nUsage:\n\n      hcitool\
  \ [options] <command> [command parameters]\n\nOptions:\n\n      --help      Display\
  \ help\n      -i dev HCI device\n\nCommands\n\n      dev    Display local devices\n\
  \      inq    Inquire remote devices\n      scan  Scan for remote devices\n    \
  \  name  Get name from remote devices\n--snip--\n```\n\n列表 14-3：一些 `hcitool` `commands`\n\
  \n你随处可见许多蓝牙黑客工具只是在脚本中使用这些命令，你可以通过在自己的 `bash` 或 `Python` 脚本中使用这些命令来轻松创建你自己的工具——我们将在第\
  \ 17 章中介绍脚本编写。\n\n### 使用 sdptool 扫描服务\n\n服务发现协议（SDP）是一种用于搜索蓝牙服务（蓝牙是一系列服务）的蓝牙协议。非常有帮助的是，BlueZ\
  \ 提供了 `sdptool` 工具来浏览设备及其提供的服务。同样重要的是，设备不需要处于发现模式即可被扫描。其语法如下：\n\n`sdptool browse\
  \ MACaddress`\n\n列表 14-4 显示我使用 `sdptool` 在列表 14-2 中之前检测到的设备之一上搜索服务。\n\n```\nkali\
  \ >sdptool browse 76:6E:46:63:72:66\n\nBrowsing 76:6E:46:63:72:66...\n\nService\
  \ RecHandle: 0x10002\n\nService Class ID List:\n  \"\"(0x1800)\nProtocol Descriptor\
  \ List:\n  \"L2CAP\"  (0x0100)\n      PSM: 31\n      \"ATT\" (0x0007)\n      uint16:\
  \ 0x1\n      uint16: 0x5\n--snip--\n```\n\n列表 14-4：使用 `sdptool` 扫描\n\n在这里，我们可以看到\
  \ `sdptool` 工具能够获取该设备能够使用的所有服务的信息。特别地，我们看到该设备支持 ATT 协议，即*低功耗属性协议*（Low Energy Attribute\
  \ Protocol）。这可以为我们该设备是什么提供更多线索，以及可能与其进一步交互的潜在途径。\n\n### 使用 l2ping 查看设备是否可达\n\n一旦我们收集了所有附近设备的\
  \ MAC 地址，就可以向这些设备发送 ping（无论它们是否处于发现模式），以查看它们是否在可范围内。这让我们知道它们是否活跃且在范围内。要发送 ping，我们使用具有以下语法的\
  \ `l2ping` 命令：\n\n`l2ping MACaddress`\n\n列表 14-5 显示我正在 ping 列表 14-2 中发现的 Android\
  \ 设备。\n\n```\nkali >l2ping 76:6E:46:63:72:66 -c 4\n\nPing: 76:6E:46:63:72:66 from\
  \ 10:AE:60:58:F1:37 (data size 44)...\n\n44 bytes 76:6E:46:63:72:66 id 0 time 37.57ms\n\
  44 bytes 76:6E:46:63:72:66 id 1 time 27.23ms\n44 bytes 76:6E:46:63:72:66 id 2 time\
  \ 27.59ms\n--snip--\n```\n\n列表 14-5：ping 蓝牙设备\n\n此输出表明 MAC 地址 `76:6E:46:63:72:66`\
  \ 的设备在范围内且可达。这是非常有用的知识，因为在我们考虑攻击设备之前，必须知道该设备是否可达。\n\n## 总结\n\n无线设备代表了连接和黑客的未来。Linux\
  \ 开发了专门的命令用于扫描和连接 Wi-Fi AP，这是攻击这些系统的第一步。`aircrack-ng` 无线黑客工具包包含了 `airmon-ng` 和 `airodump-ng`，它们使我们能够从范围内的无线设备收集信息。BlueZ\
  \ 套件包含了 `hciconfig`、`hcitool` 以及其他能够扫描的工具。\n\n## 练习\n\n在继续 15 之前，尝试在本章中学到的技能：\n\n\
  1. 注意设备 `ifconfig`。\n2. 注意系统扩展 `iwconfig`。\n3. 检查 Wi-Fi AP `nmcli`。\n4. 你认为 `nmcli`\
  \ 还是 `iwlist` 更有用？\n5. 启动网络适配器 `nmcli`。\n6. 注意蓝牙设备 `hciconfig` 和 `hcitool`。\n7.\
  \ 测试蓝牙设备 `l2ping`。\n\n\n\n\n如果黑客能够让 Linux 管理员向内核加载新模块，那么该黑客不仅可以获得目标系统的控制权，而且由于他们是在操作系统的内核级别运行的，他们可以控制目标系统报告的进程、端口、服务、硬盘空间以及你所想象的几乎任何其他内容。\n\
  \n因此，如果黑客能够成功诱导 Linux 管理员安装一个嵌入了根内核程序（rootkit）的视频或其他设备驱动程序，黑客就可以获得系统和内核的完全控制权。这就是一些最隐蔽的\
  \ rootkit 利用 Linux 以及其他操作系统的手段。\n\n理解 `LKMs` 对于成为一名高效的 Linux 管理员以及一名非常高效且隐蔽的黑客至关重要。\n\
  \n让我们来看看如何良好或坏地管理内核。\n\n### 检查内核版本\n\n理解内核的第一步是检查你的系统运行的是什么内核。至少有两种方法方法。首先，我们可以输入以下内容：\n\
  \n```\nkali >uname -a\nLinux Kali 4.6.0-kalil-amd64 #1 SMP Debian 4.6.4-lkalil (2016-07-21)\
  \ x86_64\n```\n\n内核通过回复告诉我们操作系统运行的发行版是 Linux Kali，内核版本是 4.6.4，它为构建的架构是 x86_64 架构。它还告诉我们具有对称多处理（SMP）能力（意味着它可以在具有多个核心或处理器的机器上运行），并在\
  \ 2016 年 7 月 21 日基于 Debian 4.6.4 构建的。你的输出可能会不同，取决于你构建时使用的内核以及系统中的 CPU。在安装或加载内核驱动程序时可能需要这些信息，因此了解如何获取它是很有用的。\n\
  \n获取此信息以及其他有用信息的另一种方法是对 `/proc/version` 文件使用 `cat` 命令，如下：\n\n```\nkali >cat /proc/version\n\
  Linux version 4.6.0-kalil-amd64 (devel@kali.org) (gcc version 5.4.0 20160909 (Debian\
  \ 5.4.0-6)) #1 SMP Debian 4.6.4-lkalil (2016-07-21)\n```\n\n在这里你可以看到 `/proc/version`\
  \ 文件返回了相同的信息。\n\n### 使用 sysctl 进行内核调优\n\n通过正确的命令，你可以调优内核，这意味着你可以更改内存分配、启用网络功能，甚至加固内核以防止外部攻击。\n\
  \n现代 Linux 内核使用 `sysctl` 命令来调优内核选项。通过 `sysctl` 进行的所有更改仅在重启系统之前有效。要使任何更改永久生效，你必须直接在\
  \ `/etc/sysctl.conf` 中编辑 `sysctl` 配置文件。\n\n警告：在使用 `sysctl` 时需要小心，因为如果没有适当的知识和经验，你很容易让你的系统无法启动且无法使用。在进行任何永久更改之前，请确保你已经仔细考虑过你的所作。\n\
  \n现在来看 `sysctl` 的内容。到为止，你应该能认识我们通过此处显示的命令提供的选项：\n\n```\nkali >sysctl -a | less\n\
  dev.cdrom.autoclose = 1\ndev.cdrom.autoeject = 0\ndev.cdrom.check_media = 0\ndev.cdrom.debug\
  \ = 0\n--snip--\n```\n\n在输出中，你应该能看到数百行参数，Linux 管理员可以编辑这些参数来优化内核。这里有几行对你这个黑客是有用的。作为你如何使用\
  \ `sysctl` 的示例，我们将查看启用包转发。\n\n在中间人（MITM）攻击中，黑客将自己置于通信主机之间以截获信息。流量通过黑客的系统，因此他们可以查看并可能修改通信。实现这种路由的一种方法是启用包转发。\n\
  \n如果你在输出中向下滚动几页，或者过滤“ipv4”（`sysctl -a | less | grep ipv4`），你应该看到看到内容：\n\n```\nnet.ipv4.ip_dynaddr\
  \ = 0\nnet.ipv4.ip_early_demux = 0\nnet.ipv4.ip_forward = 0\nnet.ipv4.ip_forward_use_pmtu\
  \ = 0\n--snip--\n```\n\n行 `net.ipv4.ip_forward = 0` 是允许内核转发其收到的数据包的内核参数。换句话说，它收到的数据包会被发送出去。默认设置为\
  \ `0`，这意味着数据包转发是禁用的。\n\n要启用 IP 转发，通过输入以下内容将 `0` 更改为 `1`：\n\n```\nkali >sysctl -w\
  \ net.ipv4.ip_forward=1\n```\n\n记住 `sysctl` 的更改是在运行时发生的，但在系统重启时会丢失。要对 `sysctl` 进行永久更改，你需要编辑配置文件\
  \ `/etc/sysctl.conf`。让我们更改内核处理 MITM 攻击的 IP 转发方式并使此更改永久生效。要要启用 IP 转发，用任何文本编辑器打开 `/etc/sysctl.conf`\
  \ 文件并取消 `ip_forward` 行的注释。用任何文本编辑器打开 `/etc/sycstl.conf` 并查看：\n\n```text\n#/etc/sysctl.conf\
  \ - 设置变量的配置文件\n# 查看 /etc/sysctl.d/ 获取更多变量。\n# 访问 sysctl.conf (5) 获取信息。\n##############################################\n\
  # 注消以下内容以停止在控制台上显示低级消息。\nkernel.printk = 3\n# 注销以下行以启用所有接口的欺骗保护\nnet.ipv4.conf.default.rp_filter=1\n\
  net.ipv4.conf.all.rp_filter=1\n# 注销下一行以启用 TCP/IP cookies\n# 注意：这可能会影响 IPv6 会话\n\
  net.ipv4.tcp_syncookies=1\n# 注销下一行以启用 IPv4 的包转发\nnet.ipv4.ip_forward=1\n```\n\n\
  相关行位于 ➊；通过添加行 `net.ipv4.icmp_echo_all=1` 来禁用 ICMP 回显请求，这将让黑客发现你的系统变得更加困难——尽管不可能。\n\
  \n 管理内核模块\n\nLinux 至少有两种方法管理内核模块。旧的方法是使用一组围绕 `insmod` 构建的命令——`insmod` 代表 *insert\
  \ module*（插入模块），用于处理模块。第二种方法使用 `modprobe` 命令，我们稍后会采用。在这里，我们使用 `insmod` 套件中的 `lsmod`\
  \ 命令来列出已安装模块：\n\n```\nkali >lsmod\nModule             Size      Used by\nnetlink_queue\
  \      20480     0\nnetlink_log        20480     0\nnfnetlink           16384  \
  \   2 netlink_log, netlink_queue\nbluetooth           516096    0\nrfkill      \
  \        0         0\n--snip--\n```\n\n如你所示，`lsmod` 命令列出了所有内核模块以及关于它们的大小和其他其他模块可能使用它们的信息。例如，`nfnetlink`\
  \ 模块——一种用于内核和用户空间之间通信的基于消息的协议——占用 16384 字节，被 `netlink_log` 模块和 `nf_netlink_queue`\
  \ 模块使用。\n\n来自 `insmod` 套件，我们可以使用 `insmod` 加载或插入模块，使用 `rmmod` 移除模块，`rmmod` 代表 remove\
  \ module（移除模块）。这些命令并不完美，可能不会考虑模块依赖，因此使用它们可能会导致内核不稳定或无法使用。因此，现代 Linux 发行版现在已添加 `modprobe`\
  \ 命令，它可以自动加载依赖并降低加载和移除内核模块的风险。我们稍后会介绍 `modprobe`。首先，让我们看看如何获取有关模块的更多信息。\n\n####\
  \ 使用 modinfo 查找更多信息\n\n\n\n\n\n要更深入了解任何内核模块，我们可以使用 `modinfo` 命令。该命令的语法非常简单：输入 `modinfo`\
  \ 后跟你想要学习的模块名称。例如，如果你想获取之前在运行 `lsmod` 命令时看到的 `bluetooth` 内核模块的基本信息，可以输入以下内容：\n\n\
  ```bash\nkali >modinfo bluetooth\n```\nfilename: `/lib/modules/4.6.0-kali-amd64/kernel/net/bluetooth/bluetooth.ko`\n\
  alias: net-pf-31\nlicense: GPL\nversion: 2.21\ndescription:Bluetooth Core ver 2.21\n\
