  \n# 职业黑客？从这里开始。\n\n![image](img/f0212-01.jpg)\n\n**涵盖 KALI LINUX 和 PYTHON 3**\n\n\
  如果你正开启黑客攻击、网络安全和渗透测试这条兴奋的道路，《Linux Basics for Hackers》 是一个极佳的第一步。通过 Kali Linux（一种高级渗透测试\
  \ Linux 发行版），你将学习使用 Linux 操作系统的基础知识，并掌握控制 Linux 环境所需的工具和技术。\n\n\n\n\n首先，你将学习如何在虚拟机上安装\
  \ Kali，并了解 Linux 的基础概念。接下来，你将应对更广泛的 Linux 主题，如处理文本、控制文件和目录权限，以及管理用户环境变量。随后，你将专注于安全和匿名性等基础黑客攻击概念，并学习使用\
  \ `bash` 和 `Python` 编写脚本技能。\n\n贯穿学习过程的实战教程和练习将不断强化并测试你的技能，你将学习如何：\n\n*   通过更改网络信息和操纵\
  \ `rsyslog` 日志工具来掩盖你的踪迹\n*   编写工具来扫描网络连接，并连接和监听无线网络\n*   使用 `Tor`、代理服务器、`VPNs` 和加密邮件使你的互联网活动保持隐身性\n\
  *   编写一个 `bash` 脚本扫描开放端口以寻找潜在目标\n*   使用并滥用 `MySQL`、`Apache` Web 服务器和 `OpenSSH` 等服务\n\
  *   构建自己的黑客工具，例如远程视频间谍摄像头和密码破解器\n\n黑客攻击是复杂的，没有单一的入门途径。为什么不从*黑客 Linux 基础*（Linux Basics\
  \ for Hackers）开始呢？\n\n## 关于作者\n\nOccupyTheWeb 是一位拥有 20 多年行业经验的信息安全顾问、法医调查员和培训师。他维护着\
  \ Hackers-Arise 培训网站 (`https://www.hackers-arise.com/`），并为美国军人员、国防部承包商和联邦员工提供信息安全和黑客攻击方面的培训。\n\
