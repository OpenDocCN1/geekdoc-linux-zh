  depends: rfkill, crc16\nintree: Y\nvermagic: 4.6.0-kali1-amd64 SMP mod_unload modversions\n\
  parm: disable_esco: 禁止 eSCO 连接创建 (bool)\nparm: disable_ertm: 禁止增强重传模式 (bool)\n\n\
  如你所见，`modinfo` 命令揭示了该内核模块的重要信息，这些信息对于在系统上使用蓝牙是必要的。请注意，在许多其他项目中，它列出了模块依赖项：`rfkill`\
  \ 和 `crc16`。依赖项是 `bluetooth` 模块正常运行必须安装的模块。\n\n通常，这些信息在排查特定硬件设备无法工作的原因时有用。除了注意依赖项等，你还可以获取模块版本以及该模块针对开发的内核版本，然后确保它们与你正在运行的版本匹配。\n\
  \n### 使用 modprobe 添加和删除模块\n\n大多数较新的 Linux 发行版（包括 Kali Linux）都包含了用于 LKM（加载内核模块）管理的\
  \ `modprobe` 命令。要向内核添加模块，可以使用 `modprobe` 命令配合 `-a`（add）开关，如下所示：\n\n```bash\nkali\
  \ >modprobe -a <module name>\n```\n\n要删除模块，请使用 `modprobe` 配合 `-r`（remove）开关，后跟模块名称：\n\
  \n```bash\nkali >modprobe -r <要删除的模块名称>\n```\n\n使用 `modprobe` 而不是 `insmod` 的主要优势是\
  \ `modprobe` 理解依赖关系、选项以及安装和删除程序，并在做出更改之前会考虑所有这些因素。因此，使用 `modprobe` 添加和删除内核模块更加简单且更安全。\n\
  \n### 插入和移除内核模块\n\n让我们尝试插入和移除一个测试模块，帮助你熟悉这个过程。假设你刚刚安装了一块新显卡，需要为它安装驱动程序。记住，设备驱动程序通常直接安装到内核中，以赋予它们正常运行所需的访问权限。这也为恶意黑客安装\
  \ rootkit 或其他监听设备提供了肥沃土壤。\n\n为了演示，假设（请勿实际运行这些命令）我们要添加一个名为 `HackersAriseNewVideo`\
  \ 的新显卡驱动。你可以通过输入以下内容将其添加到内核：\n\n```bash\nkali >modprobe -a HackersAriseNewVideo\n\
  ```\n\n要测试新模块是否加载正常，你可以运行 `dmesg` 命令，它会打印出内核的消息缓冲区，然后过滤“video”并查找任何指示问题的警报：\n\n\
  ```bash\nkali >dmesg | grep video\n```\n\n如果有任何包含“video”字样的内核消息，它们将显示在这里。如果什么都没有出现，说明没有包含该关键词的消息。\n\
  \n然后，要移除同一个模块，你可以输入相同的命令但使用 `-r`（remove）开关：\n\n```bash\nkali >modprobe -r HackersAriseNewVideo\n\
  ```\n\n记住，可加载内核模块（LKMs）是 Linux 用户/管理员的一种便利，但它们也是一个主要的安全弱点，专业黑客应该熟悉这一点。正如我之前提到的，LKMs\
  \ 可以成为将 rootkit 引入内核并制造破坏的完美工具！\n\n## 总结\n\n内核对于操作系统的整体运行至关重要，因此是一个受保护区域。任何无意添加到内核的内容都可能破坏操作系统甚至接管控制权。\n\
  \nLKMs 允许系统管理员直接将模块添加到内核，而无需在每次添加模块时都重新构建整个内核。\n\n如果黑客能够说服系统管理员添加恶意的 LKM，黑客就可以完全控制系统，而系统管理员往往完全毫无察觉。\n\
  \n## 练习\n\n在进入 第 16 章 之前，尝试完成以下练习来检验你在本章中学到的技能：\n\n1. 检查你的内核版本。\n2. 列出内核中的模块。\n\
  3. 使用 `sysctl` 命令启用 IP 转发。\n4. 编辑你的 `/etc/sysctl.conf` 文件以启用 IP 转发。现在，禁用 IP 转发。\n\
  5. 选择一个内核模块并使用 `modinfo` 学习更多它的信息。\n\n## 16 使用任务调度自动化任务\n\n![image](img/common01.jpg)\n\
  \n和任何使用 Linux 的人一样，黑客经常有作业、脚本或其他任务。（*注：原文此处存在大量重复句子，译文已按要求去重*）\n\n\n\n\n\n| 3 |\
  \ 月中的日期 | 1–31 |\n| 4 | 月份 | 1–12 |\n| 5 | 星期 | 0–7 |\n\n因此，如果我们编写了一个扫描全球漏洞开放端口的脚本，并希望它在周一至周五每晚凌晨\
  \ 2:30 运行，我们可以在 `crontab` 文件中对其进行调度。稍后我们将介绍如何将这些信息输入 `crontab` 的过程，但首先，让我们讨论一下列表\
  \ 16-1 所示我们需要遵循的格式。\n\n```\nM  H  DOM  MON  DOW  USER  COMMAND\n30 2  *     *  \
  \  1-5  root  /root/myscanningscript\n```\n*列表 16-1：命令调度格式*\n\n`crontab` 文件贴心地为为你标记了列。注意，第一个字段提供分钟（`30`），第二个字段提供小时（`2`），第五个字段提供日期（`1-5`，或周一至周五），第六个字段定义用户（`root`），第七个字段是脚本的路径。第三和第四字段包含星号（`*`），因为我们希望该脚本在周一至周五每天运行，无论是哪一天哪一个月。\n\
  \n在列表 16-1 中，第五个字段通过在数字之间使用连字符（`-`）定义周的范围。如果你想在周的多个不连续的日期执行脚本，可以使用逗号（`,`）分隔这些日期。因此，周二和周四就是\
  \ `2,4`。\n\n要编辑 `crontab`，你可以运行 `crontab` 命令并加上 `-e`（编辑）选项：\n\n```\nkali >crontab\
  \ -e\n```\n\n选择一个编辑器。如果以后想更改，请运行 `select-editor`。\n\n1. `/bin/nano` <----简单\n2.\
  \ `/usr/bin/mcedit`\n3. `/usr/bin/vim.basic`\n4. `/usr/bin/vim.gtk`\n5. `/usr/bin/vim.tiny`\n\
  \n选择 1-5 [1]:\n\n当你第一次运行此命令时，它会询问你想使用哪种编辑器。默认是 `/bin/nano`，即 `1` 选项。如果你选择此选项，它将直接打开\
  \ `crontab`。\n\n另一个选项（对 Linux 新手来说通常更好）是在直接在你喜欢的文本编辑器中打开 `crontab`，你可以这样操作：\n\n\
  ```\nkali >leafpad /etc/crontab\n```\n\n我使用过这个命令在 Leafpad 中打开 `crontab`。你可以在列表 16-2\
  \ 中看到文件的片段。\n\n```\n### /etc/crontab: 系统级 crontab\n\n# 与任何其他 crontab 不同，当你编辑此文件\n\
  # 以及 /etc/cron.d 中的文件时，你不需要运行 'crontab'\n# 命令来安装新版本。这些文件也有用户名字段，\n# 其他其他 crontab\
  \ 都不具备。\n\nSHELL=/bin/sh\nPATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin\n\
  \n# m h dom mon dow user command\n17 * * * * root cd / && run-parts --report /etc/cron.hourly\n\
  25 6 * * * root test -x /usr/sbin/anacron II ( cd / && run-parts\n47 6 * * 7 root\
  \ test -x /usr/sbin/anacron II ( cd / && run-parts\n52 6 1 * * root test -x /usr/sbin/anacron\
  \ II ( cd / && run-parts\n```\n*列表 16-2：在文本编辑器中使用的 `crontab` 文件*\n\n现在，要设置一个新的定期调度任务，你只需要输入新行并保存文件即可。\n\
  \n### 调度备份任务\n\n让我们先从系统管理员的角度来看这个工具。作为系统管理员，你通常希望在下班时间运行所有文件的备份，此时系统未被使用，且资源可用。（系统备份往往需要需要在业务时间内供应短缺的系统资源。）理想时间可能是周末的半夜。与其必在周六晚上/周日早上凌晨\
  \ 2 点登录（我确定你那个时候有其他优先事项），你可以调度备份在那个时间自动开始，即使你不在电脑前。\n\n注意，小时字段使用 24 小时制而不是 AM 和\
  \ PM，例如，下午 1 点是 `13:00`。此外，注意星期（`DOW`）从周日（`0`）开始，到周六（`6`）结束。\n\n要创建一个任务，你只需要按照规定的格式在\
  \ `crontab` 文件中添加一行即可。例如，假设你想使用名为“backup”的用户账户创建一个定期备份任务。你会编写一个备份系统的脚本并将其保存为 `/bin`\
  \ 目录下的 `systembackup.sh`，然后调度此备份每晚运行一次：\n\n```\n00 2 * * 1-5 backup /bin/systembackup.sh\n\
  ```\n\n（注意，小时字段使用 24 小时制而不是 AM 和 PM，例如，下午 1 点是 `13:00`。此外，注意星期（`DOW`）从周日（`0`）开始，到周六（`6`）结束。）\n\
  \n要创建一个任务，你只需要按照规定的格式在 `crontab` 文件中添加一行即可。例如，假设你想使用名为“backup”的用户账户创建一个定期备份任务。你会编写一个备份系统的脚本并将其保存为\
  \ `/bin` 目录下的 `systembackup.sh`，然后调度此备份每晚运行一次：\n\n```\n00 2 * * 1-5 backup /bin/systembackup.sh\n\
  ```\n\n（注意，小时字段使用 24 小时制而不是 AM 和 PM，例如，下午 1 点是 `13:00`。此外，注意星期（`DOW`）从周日（`0`）开始，到周六（`6`）结束。）\n\
  \n### 使用 crontab 调度 MySQL\n\n现在你已经了解了 `crontab` 调度任务的基础知识，让我们来调度 `MySQLscanner.sh`\
  \ 脚本，它在第 8 章 中寻找开放端口。就像我们之前做的，将你的 `MySQLscanner.sh` 输入 `crontab` 文件：\n\n```\n00\
  \ 9 * * * user /usr/share/MySQLscanner.sh\n```\n\n我们设置了任务在每天第 00 分、第 9 小时、每月的每天（`*`）、每月（`*`）、每周的每天（`*`）运行，并以普通用户身份运行。我们只需要保存此\
  \ `crontab` 文件来调度该任务。\n\n现在，假设你想特别小心，只在周末以及凌晨 2 点运行此扫描器，因为那时不太有人监控网络流量。你还只想让它在夏天（6\
  \ 月至 8 月）运行。你的任务现在看起来是：\n\n```\n00 2 * 6-8 0,6 user /usr/share/MySQLscanner.sh\n\
  ```\n\n\n\n\n\n```\n52 6 1 * * root test -x /usr/sbin/anacron II ( cd / && run-parts\
  \ --report /etc/cron.monthly )\n\n00 2 * 6-8 0,6 user /usr/share/MySQLsscanner.sh\n\
  ```\n\n现在，你的 `MySQLscanner.sh` 将会在 6 月、7 月和 8 月的周末凌晨 2 点运行。\n\n### Crontab 快捷方式\n\
  \n`crontab` 文件包含一些内置快捷方式，你可以使用它们来代替每次都指定时间、日期和月份。这些包括：\n\n* `@yearly`\n* `@annually`\n\
  * `@monthly`\n* `@weekly`\n* `@daily`\n* `@midnight`\n* `@noon`\n* `@reboot`\n\n\
  因此，如果你想让 MySQL 扫描器每晚午夜运行，可以在 `crontab` 文件中添加以下行：\n\n```\n@midnight      user   \
  \ /usr/share/MySQLsscanner.sh\n```\n\n### 使用 rc 脚本在启动时运行任务\n\n每当你启动 Linux 系统时，都会运行许多脚本来为你配置环境。这些脚本被称为\
  \ `rc` 脚本。内核初始化并加载所有模块后，内核会启动一个名为 `init` 或 `init.d` 的守护进程。该守护进程随后开始运行位于 `/etc/init.d/rc`\
  \ 中的脚本。这些脚本包含了启动许多你预期运行 Linux 系统所需服务的命令。\n\n### Linux 运行级别 (Runlevels)\n\nLinux\
  \ 有多个运行级别，指示在启动时应该启动哪些服务。例如，运行级别 1 是单用户模式，网络等服务不在运行级别 1 中启动。`rc` 脚本的运行取决于所选的运行级别：\n\
  \n* **0** 停止系统\n* **1** 单用户/最小化模式\n* **2–5** 多用户模式\n* **6** 重启系统\n\n### 将服务添加到 rc.d\n\
  \n你可以使用 `update-rc.d` 命令为 `rc.d` 脚本添加在启动时运行的服务。该命令允许你从 `rc.d` 脚本添加或删除服务。`update-rc.d`\
  \ 的语法非常简单；你只需要列出命令，后面跟着脚本名称，然后是要执行的操作，如下所示：\n\n```\nkali >update-rc.d <name of the\
  \ script or service> <remove|defaults|disable|enable>\n```\n\n作为一个如何使用 `update-rc.d`\
  \ 的示例，假设你始终希望 PostgreSQL 数据库在系统启动时启动，以便你的 Metasploit 框架可以使用它来存储渗透和攻击结果。你会使用 `update-rc.d`\
  \ 为你的 `rc.d` 脚本添加此行，使其在每次启动系统时都运行。\n\n在执行之前，让我们检查你的系统是否已经运行了 PostgreSQL。你可以使用 `ps`\
  \ 命令并将其传递到 `grep` 过滤器来查找 PostgreSQL，如下所示：\n\n```\nkali >ps aux | grep postgresql\n\
  ```\n\n```\nroot    3876   0.0      0.0   12720   964pts/1  S   14.24  0.00 grep\
  \ postgresql\n```\n\n此输出告诉我们，ps 运行的唯一 PostgreSQL 进程只是我们查找它的命令，因此目前没有运行 PostgreSQL\
  \ 数据库。\n\n现在，让我们更新 `rc.d` 以让 PostgreSQL 在启动时自动运行：\n\n```\nkali >update-rc.d postgresql\
  \ defaults\n```\n\n这向 `rc.d` 文件添加了该行。你需要重启系统才能使更改生效。完成后，让我们再次使用 `ps` 命令配合 `grep`\
  \ 查找 PostgreSQL：\n\n```\nkali >ps aux | grep postgresql\n```\n\n```\npostgresql\
  \  757  0.0  0.1 28763  964pts/1  S   14.24  0.00 grep postgresql\n```\n\n如你所见，PostgreSQL\
  \ 正在运行，而你从未输入过任何命令。它会在系统启动时自动启动，准备就绪供你的 Metasploit 使用！\n\n### 通过 GUI 在启动项中添加服务\n\
  \n如果你更习惯于通过 GUI 来在启动时添加服务，可以从 Kali 仓库下载基础的 GUI 工具 `rcconf`，如下所示：\n\n```\nkali >apt-get\
  \ install rcconf\n```\n\n安装完成后，你可以通过输入以下内容来启动 `rcconf`：\n\n```\nkali >rcconf\n```\n\
  \n这将打开一个类似于图 16-1 所示的简单 GUI。然后你可以浏览可用服务，选择你想要在启动时启动的服务，并点击 OK。\n\n![image](img/f0180-01.jpg)\n\
  \n*图 16-1: 用于向启动项添加服务的 rcconf GUI*\n\n在图中，你可以看到倒数第二个列出的 PostgreSQL 服务。按空格键选择此服务，按\
  \ TAB 键高亮，然后按回车。下次启动 Kali 时，PostgreSQL 将自动启动。\n\n## 总结\n\n系统管理员和黑客经常需要调度服务、脚本和工具每隔一段时间运行。Linux\
  \ 允许你使用 `cron` 守护进程调度几乎任何脚本或工具定期运行，该守护进程从 cron 表中运行这些任务。此外，你还可以使用 `update-rc.d`\
  \ 命令让服务在启动时自动启动。\n\n## 练习\n\n在进入第 17 章之前，请通过完成以下操作来测试从本章中学到的技能：\n\n1. 在每周三下午 3 点运行\
  \ `MySQLscanner.sh` 脚本。\n2. 在 4 月、6 月和 8 月的每月 10 号运行 `MySQLscanner.sh` 脚本。\n3. 在周二至周四上午\
  \ 10 点运行 `MySQLscanner.sh` 脚本。\n4. 每天中午使用快捷方式运行 `MySQLscanner.sh` 脚本。\n5. 在每次系统启动时通过\
  \ `rc.d` 脚本运行 PostgreSQL。\n6. 下载并安装 `rcconf` 并启动 PostgreSQL 和 MySQL 数据库。\n\n## 17\
  \ 黑客基础脚本基础\n\n![image](img/common01.jpg)\n\n基础脚本技能对于成为一名大师黑客至关重要。如果没有开发出基础脚本技能，只会使用他人工具的初级黑客将沦为“脚本小子”（script\
  \ kiddies）。这意味着你局限于使用他人开发的工具，这降低了你的成功概率并增加了被杀毒软件 (AV)、入侵检测系统 (IDS) 和执法部门检测到的概率。通过脚本技能，你可以让自己进入大师黑客的高层！\n\
  \n在第 8 章中，我们涵盖了 bash 脚本基础并构建了一些简单的脚本，包括查找 MySQL 系统的 `MySQLScanner.sh`。在本章中，我们开始学习黑客最常用的脚本语言：Python。许多流行的黑客工具都是用\
  \ Python 编写的，包括 `sqlmap`、`scapy`、社会工程工具包 (SET)、`w3af` 等。\n\nPython 具有一些使其特别适合黑客的重要特性，但最重要的是，它拥有大量的库——可以外部导入并重复使用的预构建代码模块——提供了许多强大的功能。Python\
  \ 自带超过 1000 个模块，还有许多在其他仓库中可用。\n\n### 添加 Python 模块\n\n当你安装 Python 时，还会安装它的标准库和模块，这些模块提供了广泛的功能，包括内置数据类型、异常处理、数值和数学模块、文件处理、加密服务、网络数据处理以及与互联网协议\
  \ (IP) 的交互。\n\n\n\n\n\n尽管这些标准库和模块提供了许多强大的功能，但你可能需要或想要额外的第三方模块。Python 可用的第三方模块非常多，这可能是大多数黑客偏好使用\
  \ Python 脚本的原因。你可以在 PyPI（Python 包索引，见图 17-1）的 [`www.pypi.org/`](http://www.pypi.org/)\
  \ 找到第三方模块的完整列表。\n\n![image](img/f0184-01.jpg)\n\n*图 17-1：Python 包索引*\n\n### 使用 `pip`\n\
  \nPython 有一个专门用于安装和管理 Python 包的包管理器，称为 `pip` (Pip Installs Packages)。由于我们在这里使用的是\
  \ Python 3，你需要适用于 Python 3 的 `pip` 来下载和安装包。你可以通过以下命令从 Kali 仓库下载并安装 `pip`：\n\n```\n\
  kali >apt-get install python3-pip\n```\n\n现在，从 PyPI 下载模块只需输入：\n\n```\nkali >pip3\
  \ install <package name>\n```\n\n当你下载这些包时，它们会自动放置在 `/usr/local//lib/<python-version>/dist-packages`\
  \ 目录下。例如，如果你使用 `pip` 为 Python 3.6 安装了 SNMP 协议的 Python 实现，你将在 `/usr/local/lib/python3.6/pysnmp`\
