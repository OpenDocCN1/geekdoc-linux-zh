  raw: 'The final method which comes with TCP scanning is the zombie scanning. The
    prime goal of zombie scanning is to map all the open form of ports on a system
    of remote nature without even producing any form of evidence which you have had
    an interaction with the system. The principles on which the functioning of zombie
    scanning depends are complex in nature. You can carry out zombie scanning by following
    these steps.


    *   > > Start by identifying the remote system for the zombie. The system which
    you are going to identify needs to have these characteristics:


    1.  > > > It is in idle form and it doesn’t actively communicate with the other
    systems which are available on the network.


    2.  > > > It needs to use an incremental form of IPID sequence.


    *   > > Then you will need to send in a packet of SYN+ACK to the zombie and then
    record the initial value of IPID.


    *   > > Send in a packet of SYN along with a source of the spoofed IP address
    of the system of zombie to the target system of scan.


    *   > > Depending on the port status on the target scan, any of the following
    will happen:


    1.  > > > In case the port is in open state, the scan target will be returning
    a packet of SYN+ACK to the host of zombie which it thinks sent out the original
    request of SYN. In such a case, the host of zombie will be responding to the unsolicited
    form of SYN+ACK packet with a packet of RST and then increment the value of IPID
    by one.


    2.  > > > In case the port is in the closed state, the scan target will be returning
    a response of RST to the host of zombie which it thinks sent out the original
    request of SYN. The packet of RST will be soliciting no form of response from
    the host of zombie and the value of IPID will therefore not be increased.


    Send in another packet of SYN+ACK to the host of zombie and then evaluate the
    final value of IPID of the RST response which has been returned. In case the value
    has been increased by one, the port on the target scan is closed and in case the
    value has been increased by two the port on the target scan is in open state.


    For performing a zombie form of scan, an initial request of SYN/ACK is required
    to be sent to the system of zombie for the purpose of determining the current
    value of IPID within the returned packet of RST. A spoofed packet of SYN is then
    sent out to the scan target along with a form of source IP address of the system
    of zombie. As the zombie actually did not send out the initial request of SYN,
    it will be interpreting the response of SYN/ACK as being unsolicited and then
    send a packet of RST back to the system of target and thus increasing the value
    of IPID by one. At the final stage, another packet of SYN/ACK needs to be sent
    to the system of zombie which will return a packet of RST and then increase the
    value of IPID by one.


    Chapter 13: Penetration Testing


    ![img](images/00004.jpg)


    Each and every infrastructure of IT comes with some weak points which can ultimately
    lead to some serious attack and can be used for the purpose of stealing and manipulating
    data. Only one thing can be done in such situations which can help in preventing
    the hackers from entering the system. You need to perform regular checks of the
    infrastructure of your security and make sure that there is no form of vulnerabilities
    present in the structure. Penetration testing helps in finding out the vulnerabilities
    along with the several weak points in a system. As the owner or administrator
    of a network, they can always have some advantage over the hackers as they are
    bound to know the topology of network, the components of infrastructure, the services,
    the probable points of attack, the executed services and many more.


    Penetration testing is done within a real and secure environment so that in case
    any vulnerability is found, you can mend the same and secure the system.


    Penetration testing in details


    As the name goes by, penetration testing is the process of testing a system to
    find out whether penetration by any third party is possible in the system or not.
    Penetration testing is often mixed up with ethical hacking as both are somewhat
    similar in features and functioning. The motive of are also the same but a very
    thin line differentiates the two. In penetration testing, the tester scans for
    any form of vulnerability in the system, malicious form of content, risks and
    flaws in the concerned system. Penetration testing can be performed either in
    an online network or server or a computer system as well. Penetration testing
    comes with the goal of strengthening the security system of an organization for
    the motive of properly defending the security of a system. Unlike hacking, penetration
    testing legal in nature and is done with all forms of official workings. If used
    in the proper way it can do wonders. Penetration testing can be considered as
    a significant part of ethical hacking.


    Penetration testing needs to be performed at regular intervals as it comes with
    the power of improving the capabilities of a system and also improves the strategies
    related to cyber security. Various types of malicious content are created for
    the purpose of fishing out the weak points which are available within a program,
    application or system. For effective testing, the malicious content which is created
    is spread across the entire network for vulnerability testing. The process of
    penetration testing might not be able to handle all the concerns related to security;
    however, it can help in minimizing the probable chances of any form of attack.
    It helps in making sure that a company is safe from all forms of vulnerabilities
    and thus protecting the same from cyber attacks. It also helps in checking whether
    or not the defensive measures are enough for the organization and which of the
    security measures are required to be changed for the motive of decreasing the
    vulnerability of the system.


    Penetration testing is really helpful in pointing out the strengths along with
    the weaknesses in the structure of an organization at any one given point of time.
    You need to note that this whole process if not at all casual in nature. It includes
    rigorous planning, granting of the required permissions from the concerned management
    and then initiating the process.


    Security scanners


    The process of penetration testing starts after an overview of the complete organization
    has been collected and then the process of searching for the specific weak points
    starts. For performing all these, you are required to use a security scanner.
    Depending on the type and nature of the security scanners, the tools can actually
    help in checking an entire system or network for the weak points which are known.
    One of the most comprehensive forms of tool for security scanning is OpenVAS.
    This tool comes with the idea of a huge number of vulnerabilities and can also
    check for the defenses. After the OpenVAS tool has identified all the open form
    of tools, you can easily use Nmap for discovering the details. A tool like Wireshark
    will allow you to find out any form of content which is critical in nature along
    with any critical form of network activity which can point out certain patterns
    of attack.


    The classic form of Wireshark tool is also useful in identifying the bottlenecks
    which can indicate the attacks of the hackers and also requires a continuous check.
    In the world of corporate organizations, the applications which are based on the
    web often depend on MySQL, Apache and stack of PHP. All these platforms dominate
    the entire landscape. Such platforms are the favorite targets of the hackers as
    they usually come with great opportunities of attacks. Kali Linux comes with around
    two dozen tools which specialize in web application testing. Such scanners can
    be easily found in the menu of Web Application Analysis. The w3af and Burp Suite
    are regarded as the best tools of the lot.'
