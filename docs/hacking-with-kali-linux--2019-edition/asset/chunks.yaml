    This is a type of firewall which helps in examining the packets of data in real.
    It also looks after the types of attacks over the application layer. This type
    of firewall comes with the capability of performing various functions in relation
    to the prevention of intrusion. This form of firewall comes along with three forms
    of different admonitions. At first, the definition of deep inspection might extend
    to particular depth for some of the vendors within the data packets and thus will
    not be examining the entire data packet. This can also conclude in skipping out
    some of the most dangerous forms of attacks.


    Secondly, this type of firewall depends greatly on the form of hardware. So, the
    hardware involved in a system might not come with the required power of processing
    the deep inspection of the data packets. You will need to ensure the capacity
    of bandwidth which the firewall can manage easily while inspecting the packets.
    Lastly, the technology which is related to the firewall management might not be
    having the needed percentage of flexibility for managing all the attacks.


    ## Application proxy firewall


    This form of firewall might perform as the mediator for various forms of applications
    like `HTTP` or the web traffic which intercepts each and every request. It also
    validates each of them just before allowing them entry. This form of firewall
    comes with some prime features of intrusion prevention. It is, however, difficult
    to apply this type of firewall in its complete state. Each of the proxies can
    handle only one protocol just like the incoming form of web or email. In order
    to get the ultimate protection of this firewall, it is required to accept all
    the protocols for the purpose of getting ahead with the protocol violation blocking.


    ## Firewall security and its importance


    In this world of today where cyber attacks can take place any time, firewall security
    is of utmost importance for all the servers and computer systems. The prying eyes
    are always looking around for the susceptible form of devices which remains connected
    with the internet. The devices which connect with the internet can be easily attacked
    by the hackers by implementing any form of harmful code or malware into the device
    via the gateway of the internet. Malware attack can result in breaching of data
    and exploitation as well. Firewall is really important in such situations as:


    - It helps in protecting the systems of computers from all forms of unauthorized
    access.

    - It helps in identifying harmful content and also blocks the same.

    - It helps in establishing a secure working environment for a network which gets
    used by several people at one time.

    - It helps in protecting all types of confidential and personal data.


    ## Chapter 16: Cryptography


    ![img](images/00003.jpg)


    With a sudden increase in the percentage of cyber attacks, it is has turned out
    to be really important to protect all sorts of sensitive data to the maximum extent
    as possible. Leakage of data in this world of today might result in some serious
    losses for many of the businesses or might also result as a threat for someone
    individual like stealing bank details, credit card details, login ids and passwords
    and many more. Cryptography is the process which is which to convert simple and
    plain text into a form which is unintelligible in nature. This technique makes
    the task of storage as well as transmission of confidential data super easy. Cryptographic
    texts can only be read by that person who is meant to get the message and read
    the same. It helps in data protection as well as in authentication of data.


    Cryptography is often linked with the security of all sorts of information which
    also includes the techniques for communication and those which are derived from
    the mathematical concepts. The technique uses a particular set of rules along
    with calculations which are also called algorithms. They are used for message
    transformation into such a form that it turns out to be super tough to decipher
    the message. The algorithms are also used for key generation of cryptography along
    with digital form of signing for the purpose of data privacy, securing website
    browsing and for the sensitive forms of communication such as credit card transactions,
    bank details and email.


    ## Cryptography and its techniques


    The technique of this process is also linked along with features of cryptology
    and cryptanalysis. The technique uses various other techniques which include words
    merging with pictures, usage of mircodots and various other steps which helps
    in hiding out the information which is to be transported over a network or is
    meant to be stored in the same. The plain form of text is converted into a coded
    form of text which is often called ciphertext. It is done with the process of
    encryption. It can be deciphered with the process of decryption at the receiver
    end.


    ## Cryptography and its objectives


    Cryptography comes with various objectives. Let’s have a look at them:


    - Cryptography comes with the goal of maintaining data integrity. The piece of
    information or data which is to be transmitted between the sender and the receiver
    or which is meant to be stored in the network cannot be altered or changed in
    any way. In any case, if such things happen, both the parties in communication
    get notified.

    - It also comes with the objective of protecting all forms of sensitive as well
    as personal data. Its main aim is to secure the data for all the concerned individuals.
    The data or information which is to be transmitted across a network or to be stored
    in the same cannot be analyzed by any other third party out of the network.

    - The creator and sender of the message will not be permitted to step back from
    their intention at a much later stage at the time of transportation or creation
    of data. This act is known as non-repudiation.

    - Both the sender and the receiver will be able to confirm the identity of each
    other before sending out and before receiving the information.


    ## Cryptography and its algorithms


    The system of cryptography functions with the help of a set of procedures which
    are also known as cryptographic algorithms or ciphers. These are used for the
    purpose of both encryption as well as decryption of message for the motive of
    protecting and securing the process of communication among various devices, computer
    systems as well as applications. One cipher suite uses up three forms of algorithms.
    It uses one algorithm for the process of data encryption. The second algorithm
    is being used for the purpose of message authentication. And, the third algorithm
    is used for the process of key exchanging. This entire process remains embedded
    in the protocols and is also written within the programming language of the software
    which is used on the operating system together with the systems of computer which
    are network-based in nature. It includes public generation along with the generation
    of the private key. The private key is required for both encryption and decryption
    of information, authentication of message as well as for digital form of signing
    with the program of key exchange. In simple terms, algorithms can be regarded
    as the core of cryptography.


    ## Conclusion


    As you have completed with the teachings of the entire book, now you can easily
    create a clear image about the processes which are linked with hacking. You will
    also be able to gain a lot of knowledge about the functioning of `Kali Linux`.
    By now, you must have created a clear perception of all the required tools and
    components which you need for creating a safe and secure network server for your
    business and also for personal use. You are the one who is responsible for everything.
    You alone can secure up an entire system and strengthen up the infrastructure
    of security.

