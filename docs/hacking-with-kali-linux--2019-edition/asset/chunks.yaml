    > 出安全起见，黑客还会开始寻找并识别系统中那些长时间未被组织使用的账户。在黑客发现此类账户的后，他会更改所有旧账户的登录密码，并将所有形式的权限提升到系统管理员（类似于一个备用账户），其目的是为了安全地访问目标网络。黑客还可以开始向组织内的其他用户发送各种电子邮件，这些邮件可能包含带有反向
    Shell（reverse shell）方案的 PDF 格式的利用型文件，以扩展其在系统内的全面访问权限。在完成这一切后，黑客会等待一段时间以确保系统中没有检测到任何形式的扰动，在确认这一点后，他开始创建可用用户数据池的副本，如联系人、文件、消息、电子邮件和其他各种形式的数据，供后续阶段使用。


    > **清除痕迹**：在开始系统攻击之前，黑客会规划好整个攻击路径以及身份规划，以便在发生任何异常时无人能追溯到他们。黑客通过修改他们的 `MAC` 地址开始这样做，然后通过
    `VPN` 运行相同的系统，这样就可以轻松掩盖他们的身份。在黑客实现目标后，他们开始清除自己的路径和痕迹。这一完整阶段包含了许多内容，例如清除临时文件、已发送的邮件、服务器日志以及其他各种。黑客还会尝试确保电子邮件提供商不会发送任何警报信息，以防目标组织发现系统中存在任何形式的未经授权或未识别的登录。


    > 渗透测试人员遵循所有这些步骤，目的是测试系统的漏洞，并确保系统中存在的漏洞得到妥善修复。


    # 第 12 章：使用 Kali Linux 进行端口扫描的技术


    ![img](img/00001.jpg)


    识别目标系统上的开放端口对于定义目标的攻击面至关重要。目标的开放端口与运行在系统上的网络服务相对应。编程中的错误或实现中的缺陷可能导致所有这些服务很容易受到攻击，并可能导致整个系统被破解。为了确定最可能的攻击向量，你需要列举项目范围范围内所有远程系统中处于开放状态的端口。开放端口的数量也对应于可以通过
    `TCP` 或 `UDP` 流量轻松访问的服务。


    `UDP` 和 `TCP` 都是传输层协议。`TCP`（传输控制协议）比 `UDP` 更常用，且提供的通信是面向连接的。`UDP`（用户数据报协议）本质上是非面向连接的协议，有时也用于传输速度比数据完整性更重要的服务。用于列举此类服务的渗透测试形式被称为端口扫描。这种技术有助于产生足够的信息，用于识别服务是否与服务器或设备上的某个端口相关。


    ## UDP 端口扫描


    由于 `TCP` 作为传输层协议的使用频率远高于 `UDP`，由 `UDP` 操作的服务经常被忽略。尽管忽略 `UDP` 服务是常态，但为了获得攻击的整体理解，列举这些服务也至关重要。使用
    `UDP` 进行扫描的形式通常更复杂，因为 `UDP` 是一个无连接协议，这意味着没有三次握手来确认端口是开放还是关闭。


    在 `UDP` 扫描的第一步中，向端口发送一个 `UDP` 数据包。如果端口开放，应用程序可能会响应，也可能完全不响应。如果端口关闭，主机通常会响应 `ICMP`
    端口不可达（Port Unreachable）消息。然而，如果存在防火墙，则不会返回响应，这使得 `UDP` 扫描更难区分开放、关闭和过滤端口。


    ## TCP 端口扫描


    `TCP` 端口扫描包括多种方法，如连接扫描（connect scanning）、带有扫描的隐身扫描（stealth scanning）。为了理解所有这些技术的工作原理，你需要理解
    `TCP` 连接是如何建立的。只有在成功建立连接后，数据才会通过 `TCP` 传输。与连接相关的过程通常被称为三次握手。


    ### 三次握手


    从想要建立连接的设备发送一个 `TCP` 数据包，并带有它想要连接的端口。如果设备想要连接的端口关联的服务接受了连接，该端口将通过带有激活的 `ACK` 和
    `SYN` 标志的 `TCP` 数据包向请求连接的系统进行响应。当请求系统向端口返回 `TCP ACK` 响应时，连接即成功。这三个步骤总共总结了两个系统之间建立
    `TCP` 会话所需的三个步骤过程。


    隐身扫描和连接扫描的过程都很好理解。连接扫描的过程用于为扫描的每个端口建立完整的 `TCP` 连接。然而，在隐身扫描的情况下，不会建立完全连接。隐身扫描通常被称为
    SYN 扫描或半开放扫描。对于扫描的每一个端口，都会向目标端口发送一个的 `SYN` 数据包，所有回复 `SYN+ACK` 数据包的端口都被视为正在运行实时服务。由于发起连接的系统没有发送最终的
    `ACK` 形式，连接被留在了半开放状态。这被称为隐身扫描，因为只记录已建立连接的日志解决方案不会记录已执行扫描的任何形式的证据。


