    ## Users of Kali Linux


    - **CISO**: The Chief Information Security Officer takes help of `Kali Linux`
    for the purpose of internal auditing of the environment of their infrastructure
    and finds out if any new form of application or configurations of rogue has been
    installed in the environment.

    - **Forensic engineers**: `Kali Linux` comes along with a mode of forensics which
    allows the forensic engineers for performing discovery of data along with data
    recovery in various instances.

    - **White hat hackers**: The white hat hackers or the ethical hackers are similar
    to the penetration testers who use `Kali Linux` for auditing and for finding out
    vulnerabilities which might be present within a security environment.

    - **Black hat hackers**: The black hat hackers use `Kali Linux` for finding out
    vulnerabilities in a system and then exploiting the same. `Kali Linux` comes with
    various applications of social engineering which can be easily used by the black
    hat hackers for compromising an individual or an organization.

    - **Grey hat hackers**: The grey hat hackers also use `Kali Linux` just like the
    black hat as well as the white hat hackers.

    - **Computer enthusiasts**: It is a very generic form of term but any person who
    is interested in getting to know more about computers and networking can use the
    system of `Kali Linux` for the purpose of learning more about networking, information
    technology and common form of vulnerabilities.


    ## Process of hacking


    `Kali Linux` is very popular as a hacking platform. The word “hacking” might not
    always be negative as it is also being used for various other jobs other than
    exploitation. By gathering immense knowledge about the process of hacking with
    `Kali Linux`, you can learn how to perform for vulnerability check and how to
    fix them as well in case you want to choose ethical hacking as your career option.
    The process of hacking with `Kali Linux` is similar to that of a general hacking
    process in which a hacker tries to get into the server of an organization or company
    and thereby gain all forms of access to the data which is stored in the servers.
    The process of hacking can be divided into five different steps.


    ### 1. Reconnaissance

    This is regarded as the very first step while starting with the process of hacking.
    In this step, the hacker tends to use all the available means for the purpose
    of collection of all forms of information about the targeted system. It includes
    various phases such as target identification, determining the target IP address
    range, available network, records of `DNS` and many others. In simple terms, the
    hacker gathers all contacts of a website or server. This can be achieved by the
    hacker by using various forms of search engines like `maltego`, researching about
    the system of the target, for instance a server or website or by utilizing various
    other forms of tools like `HTTPTrack` for the purpose of downloading a complete
    website for enumeration at later stages. After the hacker is done with all these
    steps, he can figure out the employee names, the positions of the employees along
    with the designated email addresses of the employees.


    ### 2. Scanning

    After the collection of all forms of information regarding the target, the hacker
    starts with the second phase which is scanning. The hackers utilize several forms
    of tools in this phase such as dialers, port scanner, network mappers, scanners
    of vulnerability and many others. As `Kali Linux` comes pre-loaded with a huge
    bunch of tools, the hackers won’t even face any form of difficulty during this
    phase. The hackers try to find out that information about the target system which
    can actually help in moving ahead with an attack such as IP addresses, the accounts
    of the users and computer names. As the hackers get done with basic information
    collection, they start looking out for the other possible avenues of attack within
    the target system. The hackers can select various tools from `Kali Linux` for
    the purpose of network mapping such as `Nmap`. The hackers try to find out automated
    email reply system or simply by basing on the information which has been gathered
    by them. The hackers move to the next step which includes emailing the staffs
    of the company regarding various queries, such as mailing the HR of a company
    about a detailed enquiry on job vacancy.


    ### 3. Gaining overall access

    This phase is regarded as the most important of all when it comes to hacking.
    In this phase, the attacker attempts to create the design of the network blueprint
    which has been targeted. It is created with all the relevant information which
    has been collected by the hacker. After the hackers finish the phase of enumeration
    and scanning, the step that comes now is gaining access of the targeted network
    which is based completely on the information collected. It might happen that the
    hacker wants to use phishing attack. He might try to take it safe and thus use
    a very simple attack of phishing for the purpose of gaining access. The hacker
    can decide to get into the targeted system from the IT department of the organization.


    The attacker might also get to know that some recent hiring has been done by the
    company and it can help in speeding up the procedure. For the phishing attack,
    the hacker might send out emails of phishing by using the actual address of email
    of the CTO of the company with the use of a unique form of program and will send
    out the mails to all the technicians. The email which will be used for the purpose
    of phishing will be containing a website which will help in gathering all the
    required user ids and passwords for the purpose of logging in. The hacker can
    also use other choices like phone app, website mail or some other platform for
    the purpose of sending out mail of phishing to the users and then asking the individuals
    for logging in to a new Google portal with the use of their provided credentials.


    When the hackers decide to use such a technique, they have a special type of program
    which runs in the background in their system which is called `Social Engineering
    Toolkit`. It is used by attackers for sending out the emails with the address
    of the server to the users directly after masking the server address with the
    help of `bitly` or `tinyurl`. The attackers can also use other methods for gaining
    access to the system such as by making a reverse TCP/IP shell in the `PFD` format
    file which can be created by the use of `Metasploit`. The attackers can also employ
    overflows of buffer for the attacks which are based on stacking or hijacking of
    the sessions which ultimately results in gaining overall access to the targeted
    server.


    ### 4. Maintaining the access to the server

    After the hacker has gained access to the target server, he will try to keep the
    access to the server as it is and keeping it safe for future exploitation and
    attacks. When a hacker gets access to an overall system, he can use the hijacked
    system as his own personal base and use the same for launching several other attacks
    to the other systems. After a hacker gains access to a targeted system and ultimately
    owns the same, the hijacked system is called a zombie system. The hacker gains
    access to a whole new array of email addresses and accounts and can start using
    those for testing other form attacks right from the same domain. For the purpose
    hiding in the system, the hacker also tries to create a brand new administrator
    account and tries to get dissolved in the system.

