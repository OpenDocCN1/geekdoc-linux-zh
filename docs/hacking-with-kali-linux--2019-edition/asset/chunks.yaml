    \ of tools pre-installed. Let’s have a look at some of the most commonly used\
    \ tools.\n\n* `Aircrack-ng`: It is a tools suite which is used for the purpose\
    \ of assessing Wi-Fi network security. It aims at some of the prime areas of security\
    \ related to Wi-Fi.\n\n    1. **Monitoring**: It helps in capturing packet and\
    \ also exports data to the text files for processing in the later stages by the\
    \ third-party tools.\n    2. **Attacking**: It helps in replay attacks, fake access\
    \ points, de-authentication and various others by the process of packet injection.\n\
    \    3. **Testing**: It helps in checking the Wi-Fi cards and other capabilities\
    \ of the drivers.\n    4. **Cracking**: It helps in cracking `WPA PSK` and `WEP`.\n\
    \n* `Nmap`: Nmap, also known as Network Mapper, it is an open source and free\
    \ form of utility for the purpose of network discovery along with auditing of\
    \ security. Nmap uses up the raw packets of `IP` for determining which hosts are\
    \ available on the desired network, what are the services are being offered by\
    \ those hosts, what are the operating systems that they are using, which type\
    \ of firewall or packet filters are being used and various other characteristics.\
    \ Many of the administrators of network and systems also use it for:\n\n    1.\
    \ Inventory of network\n    2. Managing the schedules of service upgrade\n   \
    \ 3. Monitoring the service or host uptime\n\n* `THC Hydra`: When you are required\
    \ to crack one remote authentication service, THC Hydra can be used. It is capable\
    \ of performing super fast dictionary attacks in opposition to 50 or more protocols\
    \ which includes `HTTP`, `FTP`, `SMB` and `HTTPS`. It can be used easily for the\
    \ purpose of cracking into wireless networks, web scanners, packet crafters and\
    \ many more.\n\n* `Nessus`: It is a form of remote scanning tool which is used\
    \ for checking the security vulnerabilities of computers. It is not capable of\
    \ blocking any form of vulnerabilities that the system of a computer has but it\
    \ can easily sniff all of them out by running more than 1200 checks for vulnerability\
    \ and also sends out alerts when it is required to make the security patches.\n\
    \n* `WireShark`: It is an open-source analyzer of packet which anyone can use\
    \ and that too free of charge. With the help of this tool, the user can easily\
    \ see the network activities provided along with customizable reports, alerts,\
    \ triggers and many more.\n\n## Features of Kali Linux\n\nKali Linux is a form\
    \ of Linux distribution that comes along with a wide range of tools which are\
    \ pre-installed in the distribution. It has been designed for the targeted and\
    \ it comes along with some added features.\n\n* **Live system**: Unlike the other\
    \ distributions, the primary image that you are going to download will not only\
    \ help in installing the also can be used. In case your present system is not\
    \ running Kali Linux, you can easily use it by inserting `USB` device.\n\n* **Forensics\
    \ mode**: While performing any forensic related work, generally the users want\
    \ to avoid any activity on the system. In order to avoid this form of behavior,\
    \ Kali Linux comes with the forensics mode which can be enabled from the menu.\
    \ \n\n* **Customized Kernel of Linux**: Kali Linux is well-known for providing\
    \ customized version of kernel which is based on the latest version of `Debian`.\
    \ This helps in ensuring solid support for hardware. As most of hardware devices\
    \ need updated files, Kali Linux comes with the feature of installing the files\
    \ which are available in the `non-free` section of `Debian`.\n\n* **Trustable\
    \ OS**: The users of this security distribution wants to know that whether or\
    \ not it can be trusted and as it has been developed plain sight, it allows anyone\
    \ to easily inspect the codes of the source. The developers also upload the source\
    \ packages in signed format.\n\n## Chapter 8: Installation of Kali Linux\n\nIf\
    \ you are thinking about pursuing information security for your career, primary\
    \ thing that you require is to have an operating system which is focused only\
    \ on system security. With the help of a proper operating system, you can easily\
    \ perform various forms of tedious and time-consuming jobs very easily and efficiently.\
    \ In the present situation, there are various OS available which are based on\
    \ Linux. Out of the several distributions that can be found today, Kali Linux\
    \ is regarded as the best choice for the purpose of information security and penetration\
    \ testing.\n"
