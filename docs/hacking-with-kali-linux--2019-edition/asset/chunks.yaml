    ### Rootkits（根基工具）

    Rootkit 像是一个程序或一组巨大的软件，允许攻击者完全访问或控制直接连接或与互联网系统交互的系统或网络。Rootkit 最初是作为一种后门程序系统引入的，用于解决软件方面的各种问题。然而，今天这种软件被黑客广泛用于破坏实际所有者或管理员对系统功能的访问和控制。有多种方法可以将
    rootkit 安装到受害系统中。安装 rootkit 最常用的方法是实施钓鱼攻击结合社会工程学。一旦 rootkit 安装在受害者的系统中，攻击者就可以秘密访问系统并控制其整体运行，从而轻松窃取机密数据和信息，还可以完全关闭系统。


    ### Keyloggers（键盘记录器）

    这是一种非常特殊的工具，旨在记录和记录受害者系统上按下的每一个键。键盘记录器通过附着在应用程序编程接口或 `API` 上记录击键轨迹。当用户在系统中使用键盘输入任何内容时，它会跟踪击键。记录的文件会被保存，其中包含各种形式的信息，例如网站访问详情、用户名、已打开应用程序的记录、截图、银行详情等。键盘记录器还能捕获个人信息、信用卡详情、密码、手机号码以及通常在系统中输入的各种其他细节。键盘记录器通常以恶意软件的形式出现，允许网络犯罪破解所有形式的敏感数据。


    ### Vulnerability scanner（漏洞扫描器）

    漏洞扫描器用于分类并检测系统、网络、通信系统、计算机等的各种形式的弱点。这是道德黑客最常用的工具形式之一，用于发现潜在的漏洞和缺陷并紧急进行修复。然而，黑黑客也可以使用漏洞扫描器来检查系统内部的漏洞和弱点，然后找到合适的工具进行利用。


    # 攻击技术


    黑客们使用多种技术来利用系统。


    ### SQL Injection（SQL 注入）

    SQL 或结构化查询语言的设计目的是为了利用受害者数据库中的各种形式的数据。这种攻击属于网络攻击的一种，它通过 `SQL` 语句欺骗系统，目标是数据库。这种形式的攻击通常通过网站接口实施，尝试通过数据库颁发
    `SQL` 命令来黑进密码、用户名和其他与数据库相关的信息。所有代码编写不当的网站以及 Web 应用程序都容易受到 SQL 注入攻击。这是因为基于 Web
    的应用程序包含了各种用户输入字段，如登录页面、搜索页面、与支持和产品相关的表单、评论区等，这些字段都非常容易受到攻击，并且可以通过简单的代码操作轻易被破解。


    ### DDoS or Distributed Denial of Service（分布式拒绝服务）

    这是一种攻击攻击的形式，服务器的正常流量被扭曲无法进入服务器并淹没网络流量。这最终导致服务拒绝，因为它就像交通拥堵一样阻塞了道路，并阻止了正常流量到达目的地。今天连接到网络的所有设备（如
    IoT 设备、计算机、手机等）都非常容易 `DDoS` 攻击。


    ### MAC Spoofing（MAC 欺骗）

    今天人们使用的每种设备都带有网络接口控制器或 `NIC`。它帮助用户连接网络（例如直接连接互联网）。每个设备的 `NIC` 配有一个 `MAC` 地址，该地址是在各种硬编码过程中分配的。MAC
    欺骗攻击是一种致命的攻击形式，黑客在自定义的虚假 `MAC` 地址后面隐藏自己和他们的系统。这降低了黑客被发现的风险。因此，你可能会认为一个新系统是合法的而赋予其访问权限，但可能会发生黑客隐藏在你甚至无法察觉的虚假
    `MAC` 地址之后的情况。


    通过使用这种技术，黑客可以轻松通过 Wi-Fi 破解网络连接，并访问所有通过局域网（LAN）连接的设备。MAC 欺骗技术还会导致其他形式的严重犯罪，黑客窃取他人的身份并进行严重的数据泄露，导致某人在甚至不知道实际黑客的情况下被定罪。然而，今天市场上有多种操作系统（如
    `MAC` 和 `Windows`），它们可以在不使用 `MAC` 地址的情况下轻松连接到 `LAN`。


    # 第 2 章：什么是道德攻击？


    ![img](img/00005.jpg)


    道德攻击也被称为入侵测试、渗透测试和红队对抗。简单来说，这是一种具有争议的技术，通过模仿恶意黑客的行动和意图来发现系统中的漏洞和弱点。道德黑客是指或安全专业人士，他们利用自己的技能为信息系统管理员的各种防御措施提供支持。道德黑客也被称为白帽或白色黑客。通过进行各种测试，道德黑客试图找到以下问题的答案：


    *   攻击者可以访问哪些位置、系统或获取信息？

    *   攻击者在设定目标之前会看到什么？

    *   攻击者将对系统中的可用信息做什么？

    *   是否有人能注意到攻击者所做的各种尝试？


    被赋予渗透测试任务的道德黑客在其分配防御任务的组织的许可和知识下运行。在某些情况下，组织不会向安全信息团队告知道德黑客将执行的所有活动，这仅仅是为了测试安全信息团队的有效性和严密性。整个过程被称为双盲环境。为了确保操作有效且合规，组织需要告知道德黑客所有需要保护的资产和信息、潜在的威胁来源，以及组织支持道德黑客努力的限制。


    ## 道德攻击的过程


    所有道德黑客都遵循严格的流程，以获得最佳可用且切要的法律结果。让我们来看看道德黑客遵循的流程。


