    Burp Suite 有助于识别和测试漏洞，而且非常易用。可以从入侵者（Intruder）模块启动暴力破解攻击，该模块利用在代理拦截（proxy intercept）标签页中分组的请求记录，目的是向
    Web 系统注入所需的有效负载（payload）。它还有助于检测安全配置不当的问题。安全设置的错误配置可能发生在应用程序堆栈的任何层级。为了检测这些漏洞，Burp
    Suite 首先从识别目标开始，然后从上下文菜单中执行 `Spider` 命令。从扫描中获得的输出可以帮助你发现系统中的配置错误。


    通常，在使用安全扫描器对产品系统进行分析时，需要极度谨慎，因为这些扫描器的设计初衷并非让非专业人士（小孩）操作。虽然各种操作有助于识别攻击点，但你可以预计正在测试的相关系统可能会受到影响。因此，你要求在系统的镜像形式中执行所有这些测试。通常，系统的镜像受生产系统防火墙和
    `IDSs` 的保护，因此你也可以检查已有的保护机制的整体有效性。由于多种形式的工具可以在各种模式下运行，这可能会使 `IDSs` 无法正确检测到扫描。在智能模式下运行时，它们通常无法被检测到。


    ## 探测弱点


    在你发现安全系统中存在哪些漏洞后，下一步需要执行的操作是对所有这些漏洞进行探测。渗透测试的重要部分是使用工具，这些工具有助于尽可能模拟已知的攻击模式。`Metasploit`
    可以被认为是最广泛使用的渗透测试工具，也是渗透测试人员的极佳工具。


    # 第 14 章：VPN


    ![img](img/00002.jpg)


    VPN 或虚拟专用网络是一种连接方法，用于为任何公共或私有网络（如互联网或 Wi-Fi 热点）增加隐私性和安全性。企业最广泛使用 `VPNs` 来保护各种形式的私和敏感数据。然而，近年来，使用私人
    `VPNs` 的热潮日益增长。这主要是因为最初所有的面对面互动现在都转变为互联网形式的通信。随着 `VPN` 的使用，初始系统的 `IP` 地址被虚拟专用网络提供的
    `IP` 地址取代，隐私随之增加。用户可以从 VPN 服务提供商获取他们想要的任何城市的 `IP` 地址。例如，你住在旧金山，但通过虚拟专用网络提供的服务，你可以看起来住在阿姆斯特丹、伦敦或任何其他城市。


    ## 安全


    安全是企业多年使用 `VPNs` 服务的主要原因。有多种简单的方法可以拦截传输到网络中的数据。`Firesheep` 和 `Wi-Fi spoofing`
    是信息被破解的两种简单方法。为了更好地理解 `VPN` 的概念，防火墙有助于保护计算机系统及其数据，而 `VPN` 则帮助保护互联网或网络上所有形式的数据。`VPNs`
    通过各种高级形式的加密协议和隧道安全技术，对所有在线数据传输进行封装。


    最精通计算机的用户永远不会在没有适当防火墙和更新的防病毒系统的情况下连接到互联网。随着安全威胁数量的增加以及对互联网依赖的提高，虚拟专用网络已成为良好安全基础设施中非常重要的一部分。完整性检查确保数据不会丢失，并确保已建立的连接不被劫持。由于所有流量都受到了保护，`VPNs`
    始终比代理更受欢迎。


    ## 设置 VPN


    设置 `VPN` 是一项相当简单的工作。它通常就像输入用户名和密码一样简单。智能手机的主导特性可以使用 `L2TP/IPsec` 和 `PPTP` 协议轻松配置
    `VPNs`。所有主流操作系统都可以配置 `VPN` `PPTP` 连接。`L2TP/IPsec` 和 `OpenVPN` 协议需要一个开源的小型应用程序以及单独下载的证书。


    ## VPN 协议


    可用协议池及其安全特性会随着时间的推移而增长。最广泛使用的协议有：


    *   **PPTP**: 这种形式的协议从 Windows 95 早期一直存在于 `VPN` 世界。`PPTP` 的主要优势是它可以轻松地在任何主流操作系统上设置。简单来说，`PPTP`
    有助于通过 `GRE` 协议建立点对点的隧道连接。然而，关于 `PPTP` 的安全性最近引起了若干质疑，但它仍然足够强大，尽管它不是所有协议中最安全的一个。

    *   **L2TP/IPsec**: 与 `PPTP` 相比，`L2TP/IPsec` 安全得多，而且还带有许多其他功能。`L2TP/IPsec` 是按照正确顺序实现两种不同类型协议的方法，以获得所有特性。例如，`L2TP`
    协议被广泛用于创建隧道，而 `IPsec` 协议通过提供安全的通道形式提供帮助。这些协议的特性使其成为一种高度安全的包。

    *   **OpenVPN**: `OpenVPN` 是一种基于 `SSL` 的虚拟专用网络，并日益受欢迎。用于此协议的软件是开源的，而且非常可用。`SSL`
    是一种与加密相关的成熟协议。`OpenVPN` 可以轻松运行在任何单一 `TCP` 或 `UDP` 端口上，使其在性质上极其灵活。


    ## VPN 如何帮助？


    `VPN` 工作背后的概念非常简单。它帮助通过互联网平台直接连接电脑、智能手机或其他形式的设备与其他服务器。它允许用户使用与计算机相同的互联网连接浏览互联网上的内容。因此，当你用于上网的计算机系统来自另一个国家或地区时，它将显示连接的用户与服务器来自相同的国家。因此，`VPN`
    实际上可以帮助你连接那些通常无法访问的网站。你可以将 `VPN` 用于若干任务：


    *   绕过那些仅根据地理限制访问的网站，主要是为了流媒体音频和视频。

    *   它可以帮助在连接到任何形式的未知 `Wi-Fi` 热点时保护用户。

    *   你可以通过 `VPN` 直接观看 Netflix 和 Hulu 等在线媒体流媒体。

    *   你可以获得大量的在线隐私，因为 `VPN` 有助于隐藏你系统的实际位置。

    *   它可以通过在使用 torrent 时保护你的系统免受扫描。


    今天对 `VPN` 的使用大多是为了绕过地理限制，其目的是通过使用其他 torrent 网络或国家的网络来观看互联网上的各种受限内容。这在访问公共形式的 Wi-Fi（如咖啡馆里的）时非常有帮助。


    你如何为自己获取一个 VPN？


