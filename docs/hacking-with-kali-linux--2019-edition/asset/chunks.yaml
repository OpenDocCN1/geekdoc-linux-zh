  trans: "\n\n# 社会工程工具\n\n> 社会工程工具：当系统的技术层面得到妥善保护时，就有可能利用人类行为作为攻击向量来实施利用。在提供了完美的影响力的情况下，人类可以经常被诱导采取各种行动，最终导致系统环境安全性的被破解。秘书刚刚插入的\
    \ USB 驱动器是否包含任何形式的有害 PDF？或者刚刚安装的 USB 驱动器是否安装了某种形式的木马后门？会计刚刚使用的银行网站是正常预期的网站形式，还是为了钓鱼攻击而制作的网站副本？Kali\
    \ Linux 自带了各种工具，可以帮助你辅助所有这些形式的攻击。\n\n# 系统服务\n\n> Kali Linux 可以提供工具，允许你作为系统服务启动并停止在后台中运行的各种应用程序。\n\
    \n## Kali Linux 的任务协调\n\nKali Linux 有助于协调多项任务，并有助于平衡系统软件与硬件之间的协调。\n\nKali Linux\
    \ 最首要的任务是控制计算机系统的硬件组件。它在计算机启动或安装任何新设备时，帮助检测并确定各种硬件组件。它通过简化的程序接口帮助使硬件组件对各种高级层级的软件可用，以便应用程序能够充分利用连接的设备，而无需处理任何细节，例如扩展板插在哪个扩展插槽中。编程接口还包含一层抽象，允许各种软件与硬件无缝工作。\n\
    \n## 什么让 Kali Linux 与其他系统不同？\n\nKali Linux 专为增强渗透测试的功能以及安全审计的目的而设计。为了实现这一点，Kali\
    \ Linux 还实施了各种内核更改，这些更改反映了所有需求：\n\n- **设计上的 root 访问，单用户**：由于系统审计的常规性质，Kali Linux\
    \ 的设计使其可以在单 root 访问的场景下使用。大多数用于渗透测试的工具都需要提升形式的权限，而由于在需要时启用 root 权限通常是合理的策略，在 Kali\
    \ Linux 针对的用例中，这种整个方法可能会变成沉重的负担。\n- **默认禁用网络服务**：Kali Linux 带有系统级钩子，默认禁用了网络服务。这些钩子允许用户在安装多个\
    \ Kali Linux 服务的同时，确保无论安装了什么类型的软件包，分发版在默认情况下都保持完全安全可靠。蓝牙等其他附加服务在默认设置中也被列入黑名单。\n\
    - **Linux 定制内核**：Kali Linux 使用上游形式的内核，该内核已针对无线注入目的进行了补丁。\n- **一组受信任且最小的仓库**：考虑到\
    \ Kali Linux 的所有目标和目的，Kali Linux 的绝对关键是维护给定系统的完整性。以首要目标考虑，Kali Linux 使用的上游软件源完整集合被保持尽可能少。许多\
    \ Kali Linux 的新用户受到向 `sources.list` 中添加额外仓库的诱惑。但是，这样做会导致破坏 Kali Linux 安装的风险。\n\
    \n认为每个人都应该使用 Kali Linux 是不正确的。Kali Linux 是专门地为安全专家设计的。它具有独特的特性，正由于这种特性，对于那些完全不熟悉\
    \ Linux 功能或正在寻找用于桌面、游戏、网站设计及许多用途的通用类型 Linux 分发版的人来说，Kali Linux 并不是一个推荐的分发版。即使对于经验丰富的\
    \ Linux 用户来说，Kali Linux 可能会带来某些挑战，这些挑战通常是为了维护系统的安全性而设置的。\n\n# 第 1 章：Kali Linux\
    \ 的不同工具\n\n众所周知 Kali Linux 是一种完全基于 Debian 的开源分发版，它有助于为安全审计和渗透测试目的提供各种工具。它拥有用于渗透测试的各种工具，并由\
    \ Offensive Security 开发并被广泛使用。Kali Linux 的一个特点是它不需要加载 `iso` 文件即可在内存中运行。\n\nKali\
    \ Linux 为用户提供了各种形式的工具，如信息收集工具、漏洞分析、取证工具、嗅探工具、伪装工具以及许多工具。让我们看看 Kali Linux 的一些流行的工具。\n\
    \n## Kali Linux 的工具\n\n- **nmap**：nmap 被认为是最流行的网络映射工具。它允许用户发现网络内的活动主机并收集与渗透测试相关的信息。nmap\
    \ 的主要功能包括：\n    1. 主机发现并识别可用主机。\n    2. 用于计算远程或本地主机的开放端口数量。\n    3. 有助于获取网络操作系统并发现有关连接设备的信息。\n\
    \    4. 允许用户检测应用程序版本并确定应用程序名称。\n    5. 通过使用 NSE（nmap 脚本引擎）扩展 nmap 的默认功能。\n- **netcat**：正如其名，netcat\
    \ 的功能就像猫一样，有助于获取网络详情。它作为一种网络探索应用程序，不仅用于安全领域，在网络管理和安全管理领域也著名。它通常用于检查入站和出站网络以及进行端口探测。它还可以与各种编程语言（如\
    \ `C` 或 `Perl`）或 `bash` 脚本结合使用。netcat 的主要功能包括：\n    1. `UCP` 和 `TDP` 的端口分析。\n\
    \    2. 入站和出站网络的嗅探。\n    3. `DNS` 的正向和反向分析。\n    4. 远程和本地端口扫描。\n- **unicornscan**：这是信息安全的顶级工具之一，用于数据修正和收集。它还为用户提供了\
    \ `UDP` 和 `TCP` 扫描以及非常有益的发现模式，有助于寻找远程主机。它还可以帮助发现每个主机上运行的软件。unicornscan 的主要功能包括：\n\
    \    1. 异步 `TCP` 扫描。\n    2. 异步 `UDP` 扫描。\n    3. 异步 `TCP` 标识符识别。\n    4. 应用程序、操作系统和系统服务检测。\n\
    \    5. 使用自定义数据集的能力。\n    6. 支持 `SQL` 关系型输出。\n\n"
- fmt: '

    # Fierce


    Fierce is a tool from Kali Linux which is used for the purpose of port scanning
    along with network mapping. It can also be used for discovering the hostnames
    and non-contiguous space of IP across any network. It is somewhat similar in features
    just like `Unicornscan` and `Nmap` but unlike these two, Fierce is specifically
    being used for the corporate networks. After the target network has been defined
    by the penetration tester, Fierce runs various tests in opposition to the domain
    which are selected for retrieving important information which can be used for
    the further analysis and post exploitation.


    The features of Fierce include:


    1. Scanning of internal and external IP ranges

    2. Capability of changing the DNS server for the purpose of reverse lookup

    3. Scanning of IP range and complete Class C

    4. Helps in logging capabilities into a file system

    5. Discovery of name servers and attack of zone transfer

    6. Capabilities of brute force by using the custom list of texts


    # OpenVAS


    OpenVAS: Also known as Open Vulnerability Assessment System, is a free software
    which can be used by anyone for the purpose of exploring the remote or local vulnerabilities
    of a network. This tool of security helps in writing and also integrating the
    customized plugins of security to the platform of OpenVAS. The main features of
    OpenVAS are:


    1. It works as a port scanner and network mapper

    2. It helps in discovery of simultaneous host

    3. It supports `OpenVAS` protocol of transfer

    4. It comes integrated with databases of SQL such as `SQLite`

    5. It performs weekly or daily scans

    6. It helps in exporting the results into `HTML`, `XML` or `LateX` formats of
    files

    7. It comes with the capability of resuming, pausing and stopping the scans

    8. It is fully supported by both Linux and Windows


    # Nikto


    Nikto is written in Perl and is a tool which is included in Kali Linux, it works
    as a complementary tool to `OpenVAS` and to other tools of vulnerability scanner.
    It allows the penetration testers along with the ethical hackers to carry on with
    scanning of a full web server for the discovery of vulnerabilities along with
    flaws in security. This tool gathers all the results of security scanning by finding
    out the insecure patterns of application and files, server software which has
    become outdated and the default names along with misconfiguration of software
    as well as of server. It also supports various proxies for SSL encryption, authentication
    based on host and many others. The main features of Nikto are:


    1. It helps in scanning multiple ports which are available on a server

    2. It comes with evasion techniques of `IDS`

    3. It provides the output results in `XML`, `TXT`, `NBE`, `HTML` and `CSV`

    4. It comes with the enumeration of `Apache` and `cgiwrap` username

    5. It performs scans for the specified directories of `CGI`

    6. It can identify the software which is installed in the system via the files,
    favicons and headers

    7. It uses up custom files of configuration

    8. It helps in debugging and providing verbose output


    # WPScan


    WPScan is used for the purpose of auditing the installation security of WordPress.
    With the help of `WPScan`, you can easily find out whether or not the setup of
    your WordPress is susceptible to any form of attack or not or whether if it is
    giving out too much information in the core, theme files or plugins. This tool
    also allows the users to find the weak passwords for each and every registered
    user and can also run a brute force attack for finding out which one can be cracked.
    The features of `WPScan` are:


    1. Enumeration of `WP` username

    2. Security scans of non-intrusive nature

    3. Enumeration of `WP` plugin vulnerability

    4. Cracking of weak password and brute force attack of `WP`

    5. Scheduling of WordPress security scans


    # CMSMap


    CMSMap is an open source form of project which is written in `Python`. It helps
    in automating the task of vulnerability scanning along with detection in `Joomla`,
    `WordPress`, `Moodle` and `Drupal`. This tool can also be used for running a brute
    force attack and also for launching the various exploits once the vulnerabilities
    have been discovered. The main features of `CMSMap` are:


    1. It supports multiple threats scan

    2. It comes with the capability of setting customized header and user agent

    3. It supports encryption of `SSL`

    4. It saves the output file in the form of text file


    # Fluxion


    This tool functions as an analyzer of Wi-Fi which specializes in attacks of `MITM
    WPA`. It allows the users to easily scan the wireless form of networks, search
    for any form of security flaw in the personal or corporate networks. Unlike the
    other tools for Wi-Fi cracking, this tool does not perform any form of brute force
    attack for cracking attempt as it takes generally a lot of time. Instead of launching
    a brute force attack, this tool spawns a process of `MDK3` which makes sure that
    all the users who are connected with the targeted network are deauthenticated.
    After this has been done, the user gets a prompt screen for connecting with a
    fake pint of access where they are required to enter the Wi-Fi password. Then
    the tool sends the password of Wi-Fi to you so that you can easily gain access
    to the same.


    Other than all these tools, there are several other tools from Kali Linux such
    as `Aircrack-ng`, `Kismet Wireless`, `Wireshark`, `John the Ripper` and many others.


    # Chapter 11: How can Kali Linux be Used For Hacking?


    ![img](images/00012.jpg)


    As we all know by now that Kali Linux has been designed especially for the purpose
    of penetration testing and security auditing, it can also be used for the purpose
    of ethical hacking which is required while performing penetration testing and
    other security checks. Kali Linux comes packed with a huge number of tools which
    helps in the venture of security infrastructure testing and other forms of testing
    for securing an organization or company.


    ## Who all uses Kali Linux and why?


    Kali Linux can be regarded as the most unique form of OS which can be found today
    as serves as a platform which can be used up by both the good guys and the bad
    guys. The administrators of security along with the black hat hackers all use
    this platform for meeting their needs. One uses this system for the purpose of
    preventing and detecting breaches in security infrastructure while the other uses
    this OS for identifying and thereby exploiting the security breaches. The huge
    number of tools which comes packed with Kali Linux can be regarded as the Swiss
    Knife for the toolbox of the security professionals. The professionals who widely
    use Kali Linux are:


    * **Security Administrators**: The administrators of security come with the responsibility
    of safeguarding the information and data of the concerned institution. The security
    administrators widely use Kali Linux for the purpose of ensuring that there are
    no forms of vulnerabilities in the environment of the security infrastructure.

    * **Network administrators**: The network administrators come with the responsibility
    of maintaining a secure and efficient network. Kali Linux is used by the network
    administrators for the purpose of auditing of network. For instance, Kali Linux
    can easily detect the access points of rogue.

    * **Architects of network**: Such people are responsible for the designing of
    a secure environment for a network. They use Kali Linux for auditing the internal
    network designs and makes sure that nothing has been misconfigured or overlooked.

    * **Penetration testers**: The penetration testers use Kali Linux for auditing
    the security environments and also perform reconnaissance for the corporate environments
    which they are bound to take care of.

    '
