    Linux are also free of cost. Kali Linux has been and will also be free of cost
    always.


    *   > > A wide array of tools: Kali Linux can offer you with more than 600 different
    types of tools for penetration testing and also various tools related to security
    analysis.


    *   > > Open-source software: Linux is an open-source software. So, Kali Linux
    being a part of the Linux family also follows the much-appreciated model of being
    open-source. The tree of development of the OS can be viewed publicly on Git and
    all the codes which are available with Kali Linux are also available for the purpose
    of tweaking.


    *   > > Support for multi-language: Although of the fact that the penetration
    tools are written in English, it is evident that Kali Linux supports multilingual
    use as well. It has been done to make sure that a greater number of users can
    operate the OS in their native language and can also locate the tools which they
    need for their job.'
