    # Chapter 14: VPN


    ![img](images/00002.jpg)


    VPN or virtual private network is the method of connection which is used for adding
    privacy along with security to any public or private form of network like the
    internet or hotspots of Wi-Fi. `VPNs` are most widely used by the corporations
    for the purpose of protecting various forms of private and sensitive data. However,
    in the recent years, the craze of using private `VPNs` is increasing day by day.
    This is mainly because of the fact that all those interactions which are face
    to face in the beginning now transformed to the internet form of communication.
    Privacy increases with the use of `VPN` as the `IP` address of the initial system
    get replaced with the `IP` address which is provided by the provider of a virtual
    private network. The subscribers can get an `IP` address from any city they want
    from the provider of `VPN` service. For example, you are living in San Francisco
    but with service provided by virtual private network, you can look like that you
    live in Amsterdam, London or any other city.


    ## Security


    Security is the prime reason for which the corporations have been using the services
    of `VPNs` for years. There are various simple ways on which data can traveling
    to a network can be intercepted. `Firesheep` and `Wi-Fi spoofing` are the two
    easiest ways in which information can be hacked. For a better understanding of
    the concept of `VPN`, a firewall helps in protecting a system along with data
    on the computer while a `VPN` helps in protecting all forms of data on the internet
    or on the web. `VPNs` cater with the help of various advanced forms of encryption
    protocols and techniques of tunnel security for the purpose of encapsulating all
    the transfers of online data.


    The most computer savvy users will never connect to the internet without a proper
    firewall and updated system of antivirus. The evolving number of security threats
    along with the increase of reliance on the internet, it has made virtual private
    network a very important part of a well-designed security infrastructure. The
    checks of integrity ensure that no form of data is lost along with ensuring that
    the connection which has been established is not hijacked. As all the traffic
    gets protected, `VPNs` are always preferred more than the proxies.


    ## Setting up a VPN


    The setting up of a `VPN` is a pretty simple job. It is most often as easy as
    entering the username and password. The dominant nature of smartphones can easily
    configure `VPNs` by using the `L2TP/IPsec` and `PPTP` protocols. All forms of
    major OS can configure `VPN` `PPTP` connection. `L2TP/IPsec` and `OpenVPN` protocols
    need a small application which is of open source nature and the certifications
    to be separately downloaded.


    ## Protocols of VPN


    The available pool of protocols along with the features of security tends to grow
    with the flow of time. The most widely found protocols are:


    *   **PPTP**: This form of protocol has been in the world of `VPN` since the early
    days of Windows 95. The major advantage of `PPTP` is that it can be easily set
    up on any form of major OS. In simple words, `PPTP` helps in tunneling point to
    point connections over the protocol of `GRE`. However, the security concerning
    `PPTP` has been recently called out into several questions but it is strong enough
    although it is not the one which is the most secure of all.

    *   **L2TP/IPsec**: `L2TP/IPsec` is much more secure when compared with `PPTP`
    and it also comes with several other features. `L2TP/IPsec` is the method of implementing
    two different types of protocols all together in proper order for gaining the
    overall features of all. For instance, the protocol of `L2TP` is being widely
    used for creating tunnel and `IPsec` protocol helps by providing a secure form
    of channel. These features of the protocols make them a highly secure form of
    package.

    *   **OpenVPN**: `OpenVPN` is a virtual private network which is based on `SSL`
    and is gaining popularity day by day. The software which is being used for this
    protocol is open source in nature and is also highly available. `SSL` is a form
    of mature protocol concerned with encryption. `OpenVPN` can easily run on any
    single `TCP` or `UDP` port and thus makes this extremely flexible in nature.


    ## How can VPN help?


    The concept behind the working of a `VPN` is quite simple. It helps in connecting
    PC, smartphone or any other form of device with another computer or server directly
    on the platform of the internet. It also allows users to surf the contents which
    are available on the internet by using the same internet connection of the computer.
    So, when the computer system with which you are connecting to for the purpose
    of internet surfing is from some other country or region, it will be showing that
    the user who is connecting is also from the similar country as the server. So,
    `VPN` can actually help you in connecting with all those sites with which you
    normally can’t. You can use `VPN` for several tasks such as:


    *   Bypassing all the restrictions on those websites whose access are restricted
    only according to geography, mainly for the purpose of streaming audio and video.

    *   It can help in protecting the users while connecting to any form of unknown
    `Wi-Fi` hotspot.

    *   You can watch online streaming of media directly with the help of `VPN` such
    as Netflix and Hulu.

    *   You can gain a considerable amount of privacy online as `VPN` helps in hiding
    the actual location of your system.

    *   It can help you by protecting your system from scans at the time of using
    torrent.


    The use of `VPN` today is mostly found for bypassing the restrictions on geography
    for the motive of watching various forms of restricted contents on the internet
    simply by taking into use the network of some other torrent or country. It is
    really helpful at the time of accessing public form of `Wi-Fi` like the ones which
    can be found at the coffee shops.


    How can you get a VPN for yourself?

