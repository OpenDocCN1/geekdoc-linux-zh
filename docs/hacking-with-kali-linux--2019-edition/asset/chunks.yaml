    # Chapter 4: Linux Architecture


    ![img](images/00010.jpg)


    Linux is one of the finest operating systems which can be found today. It is open
    source in nature and is based on UNIX. It is just a simple OS like the commercial
    ones like Windows XP, Windows 10 and MAC OS. An OS is nothing but the graphical
    form of interface between the system of a computer and the user of the system.
    It comes with the responsibility of managing all the resources related to hardware
    that the system of a computer has and also helps in establishing communication
    in between the hardware and the software.


    ## Open Source Software


    An open source software is a software which has its source code available with
    the license with which the holder of copyright has the right to study the software,
    change the settings and also distribute the same software with anyone he wants
    for any form of purpose.


    ## Linux OS and its components


    The Linux OS is composed of three different components.


    - The Kernel

    - The System Library

    - The System Utility


    ### The Kernel


    The kernel functions as the core part of any form of OS. It is responsible for
    handling the tasks along with the hardware of the system of a computer. The `CPU`
    time and memory are the two examples of the entities which are being managed by
    the `kernel`. The kernel of an OS is of two types:


    - **Microkernel**: the microkernel is a type of OS kernel. As its name goes by,
    it comes with a very basic form of functionality. It is the least amount of software
    which can provide with the environment which is required for the functioning of
    an operating system. This environment of kernel covers management of threads,
    low level management of address space and inter-process form of communication.

    - **Monolithic kernel**: Monolithic kernel is the form of kernel which comes with
    various drivers along with it. It is an architecture of the operating system in
    which the operating system of a system works in the space of kernel. This form
    of the kernel is able to load or unload dynamically all the modules which are
    executable at the time of running. The monolithic form of kernel stays in the
    supervisor mode. The major point of difference between the micro kernel and the
    monolithic kernel is that the monolithic form of kernel can alone define a very
    high level of interface over the hardware of the system of a computer.


    #### Supervisor mode


    The supervisor mode of the monolithic kernel is a flag which mediates from the
    hardware of a system. It can be easily modified by running the codes in the software
    system level. All form of system level tasks comes with this flag while they are
    operating or running. However, the applications of user space do not come with
    this flag set. The flag makes sure that whether the execution of machine code
    operations is possible or not such as performing various operations like disabling
    the interruptions or modifying the registers for various forms of descriptor table.
    The main idea behind having two different types of operation comes from the idea
    “with more amount of control come more responsibilities”.


    Any program in the supervisor mode is trusted so much that it will never fail
    as any form of failure will lead to crashing of the computer system. In simple
    words, the kernel is the component which is responsible for all form of activities
    of the OS. It is composed of various types of modules and also directly interacts
    with the base hardware. The kernel comes with all the necessary abstraction for
    the purpose of hiding all the low-level details of hardware to system or programs
    of application.


    ### The System Library


    The system library is composed of a collection of resources which are non-volatile
    in nature and are used up by the resources of the computer system and is mainly
    used for developing software. This comes with data configuration, help data, documentation,
    templates for messaging and many more. Generally, the term library is being used
    for describing a huge collection of implementations regarding behavior which is
    written down in terms of computer language. It comes with a perfectly defined
    form of interface which helps in invoking the behavior. So, this means that anyone
    who wants to create a program of high level can easily use up the system library
    for the purpose of making system calls continuously.


    The system library can be requested at a time by various individual forms of programs
    simultaneously, in order to make sure that the library has been coded in a way
    so that several programs can use up the library even when the concerned programs
    are not at all linked nor have a connection with each other. In simple terms,
    the system libraries are unique programs or form of functions built up of the
    system utilities or application programs which have access to all the features
    of the kernel. This form of library implements a majority of the functions related
    to the operating system of a computer and they are not required to have the rights
    of code access for the module of the kernel.


    ### The System Utility


    The programs of system utility are responsible for performing all forms of individual
    and specialized level tasks. The utility software is a form of system software.
    It has been designed for running the programs of application and hardware for
    a system of computer. The system software can also be considered as the interface
    between the applications of the users and the hardware. In simple words, the system
    utility software is the software of a system which has been designed for the purpose
    of configuring, analyzing, optimizing and maintaining a system of computer. The
    utility software works hand in hand with the operating system for supporting the
    infrastructure of a system, differentiating it from the software of application
    which is aimed for performing the various tasks directly which will be benefiting
    the normal users.


    ## Characteristics of Linux architecture


    Linux comes with various features that can help the regular users a lot.


    ### Multiuser capability


    This is the most unique characteristic of Linux OS in which the resources of a
    computer such as memory, hard disk etc. can be accessed by various users at a
    time. However, the users access the resources not from a single terminal. Each
    of the users is given an individual terminal for accessing the resources and operating
    them. A terminal consists of at least one VDU, mouse and keyboard as the devices
    for input. All the terminals are linked or connected with the primary server or
    Linux or with the host machine the resources of which and other peripheral devices
    like printer can be used by the users.


    ### Multitasking


    Linux OS comes with the capability of easily handling various jobs at a time.
    For example, a user can execute a command for the purpose of execution of a huge
    list and type in a notepad at the same time. This is intelligently managed by
    dividing the time of `CPU` by implementing the policies of scheduling along with
    the concept of switching of contexts.


    ### Portability

