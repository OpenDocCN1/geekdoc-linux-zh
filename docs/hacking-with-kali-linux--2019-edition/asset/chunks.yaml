    Chapter 10: Different Tools of Kali Linux


    As we know that Kali Linux is an open source form of distribution which is completely
    based on Debian, it helps in providing various tools for the purpose of security
    auditing along with penetration testing. It has been developed by Offensive Security
    and is also among some of the most well-known distributions and is being widely
    used by the ethical hackers. The best thing that comes with Kali Linux is that
    it does not need to be installed as the OS in your system. Instead of that, you
    can simply run the iso file which can be loaded in the memory of RAM easily for
    the purpose of testing the security of a system with the help of around 600 tools.


    Kali Linux provides users with various forms of tools like information gathering
    tools, tools for analysis of vulnerability, web application tools, wireless attack
    tools, tools for forensics, sniffing along with spoofing tools, hardware hacking
    tool and many more. Let’s have a look at some of the most popular tools from Kali
    Linux.


    Tools from Kali Linux


    *   > > Nmap: Nmap can be regarded as the most popular network mapping tool. It
    allows the user to find out the active hosts available within a network and also
    gathers relevant information in relation to penetration testing. Some of the main
    features of Nmap are:


    1.  > > > It comes with host discovery and helps in identifying the available
    network hosts.


    2.  > > > Nmap comes with the feature of port scanning which allows the users
    to calculate the total number of open ports on the remote or local form of host.


    3.  > > > It helps in fetching the OS of a network and also finds out various
    information about the connected devices.


    4.  > > > It allows the user to detect the version of the application and also
    determines the name of the application.


    5.  > > > It helps in extending the default capabilities of Nmap by the use of
    NSE or Nmap Scripting Engine.


    *   > > Netcat: As the name goes by, Netcat functions just like a cat and helps
    in fetching details about a network. It functions as an application for network
    exploration which is not only used in the field of security industry but is also
    famous in the network administration and security administration field. It is
    generally used for the purpose of checking outbound and inbound network and also
    for port exploration. It can also be used for conjunction with various languages
    of programming such as C or Perl or also with bash scripts. The main features
    of Netcat are:


    1.  > > > Port analysis of UCP and TDP


    2.  > > > Sniffing of inbound and outbound network


    3.  > > > Forward and reverse analysis of DNS


    4.  > > > Scanning of remote and local ports


    5.  > > > Integration with the standard input of terminals


    6.  > > > TCP and UDP tunneling mode


    *   > > Unicornscan: This is one of the finest tools of infosec which is being
    used for the purpose of data correction along with gathering. It also offers the
    users with UDP and TCP scanning along with super beneficial patterns of discovery
    which helps in finding the remote hosts. It can also help in finding out the software
    which is running in each of the hosts. The main features of Unicornscan are:


    1.  > > > Asynchronous scan of TCP


    2.  > > > Asynchronous scan of UDP


    3.  > > > Asynchronous banner detection of TCP


    4.  > > > Application, OS and system service detection


    5.  > > > Capability of using customized sets of data


    6.  > > > Supports relational output for SQL'
