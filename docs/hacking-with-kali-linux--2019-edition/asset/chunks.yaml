  trans: "\n\n`mkdir` 命令用于创建新的文件夹或目录。例如，当你需要创建一个如 `DIY` 的新目录时，你需要输入类似 `mkdir DIY`\
    \ 的命令。请始终记住，如果你想创建一个名为 `DIY Hacking` 的目录，你需要输入 `mkdir DIY\\Hacking`。你可以使用 `rmdir`\
    \ 命令来删除不再需要的目录。然而，请务必记住，`rmdir` 只能用于删除本质上空的目录。如果你想删除一个包含文件的目录，则需要使用 `rm` 命令。\n\
    \n### rm\n```\nrm\n```\n你可以使用 `rm` 命令来删除目录和文件。如果你只想删除目录，则需要使用 `rm –r` 命令。当你使用\
    \ `rm` 命令时，它将删除文件夹以及其中包含的所有文件。\n\n### touch\n```\ntouch\n```\n此命令用于创建新文件。它可以是任何类型，从一个空的\
    \ `txt` 文件到一个空的 `zip` 文件格式。你可以使用如 `touch new.txt` 的命令。\n\n### man & - - help\n\
    ```\nman & - - help\n```\n如果你想详细了解某条命令以及如何使用它，可以使用 `man` 命令。它通过显示所有命令的所有帮助页来提供帮助。例如，如果你输入\
    \ `man cd`，它将显示 `cd` 命令的所有帮助页。当你输入命令名并带有参数 `-- help` 时，它将显示你可以如何使用该命令。\n\n###\
    \ cp\n```\ncp\n```\n`cp` 命令用于从命令行复制文件。它接受两个参数，第一个参数是待复制的文件位置，第二个参数是复制文件的位置。\n\n\
    ### mv\n```\nmv\n```\n`mv` 命令用于通过命令行移动文件。你也可以用此命令来重命名文件。例如，如果你需要将文件“text”重命名为“old”，你可以输入\
    \ `mv text old`。它和 `cp` 命令一样也接受两个参数。\n\n### locate\n```\nlocate\n```\n`locate`\
    \ 命令用于定位 Linux 系统中的任何文件。它类似于 Windows 系统中的搜索命令。当你不知道某个特定文件位于何处、保存于何处或其实际文件名时，这个命令可能变得非常有用。当你使用此命令配合参数\
    \ `--i` 时，它可以帮助忽略大小写。例如，如果你需要找到一个包含“bye”一词的文件，当你使用 `locate –i bye` 时，它将列出所有包含“bye”单词的\
    \ Linux 系统文件列表。如果你记得文件名中的两个单词，可以通过插入星号（`*`）轻松地分隔它们。例如，要定位包含“bye”和“this”单词的文件，你需要使用\
    \ `locate –i *bye*this`。\n\n## 中级命令\n\n### echo\n```\necho\n```\n此命令有助于将部分数据（大多数是文本）移动到文件中。例如，如果你需要创建一个全新的文本文件或向已有的文本文件添加内容，你需要使用形如\
    \ `echo hello, my name is sunny>>new.txt` 的命令。在这种情况下，你不需要使用 `\\` 来分隔句子中的空格，因为你只需要在完成写入时使用两个三角形括号（`>>`）。\n\
    \n### cat\n```\ncat\n```\n你可以使用 `cat` 命令显示文件中的所有内容。它通常用于方便地查看程序。\n\n### nano &\
    \ vi \n```\nnano & vi\n```\n`nano` 和 `vi` 是 Linux 命令行中已经安装的文本编辑器。`nano` 命令是一种很好的文本编辑器，通过用颜色标记关键字来提供帮助，并且轻松识别大多数语言。`vi`\
    \ 命令的形式比 nano 简单得多。通过使用 `vi` 命令，你可以创建任何新文件，甚至使用这种编辑器的形式修改文件。例如，你需要创建一个名为 `check.txt`\
    \ 的新文件。你可以通过命令 `nano check.txt` 轻松创建它。完成编辑后，你还可以使用 `Ctrl+X` 然后按 `Y`（是）或 `N`（否）来保存文件。\n\
    \n### sudo\n```\nsudo\n```\n这是 Linux 系统中一个被广泛使用的命令。`sudo` 代表 SuperUser Do（超级用户执行）。如果你想以\
    \ root 或管理员的权限执行任何命令，可以使用 `sudo` 命令。例如，如果你需要编辑如 `viz.alba-base.conf` 这样需要 root\
    \ 权限的文件，你可以输入 `sudo nano alba-base.conf`。你可以通过 `sudo bash` 进入 root 命令行并输入用户密码。你也可以使用\
    \ `su` 命令执行相同操作，但你需要在在此之前设置一个 root 密码。设置密码，你需要输入 `sudo passwd` 然后输入 root 的新密码。\n\
    \n### df\n```\ndf\n```\n你可以使用 `df` 命令查看系统中每个分区的可用磁盘空间。你只需要在命令行中输入 `df`，就可以轻松查看每个挂载分区以及以百分比\
    \ `%` 和 KB 为单位指定的可用和已用空间。如果你想以兆字节（MB）查看，输入 `df –m`。\n\n### du\n```\ndu\n```\n\
    此命令用于了解系统中文件对磁盘的占用情况。如果你需要知道 Linux 系统中某一个特定文件或文件夹的磁盘占用情况，输入 `du` 后跟文件夹或文件名。例如，如果你需要知道\
    \ Linux 系统中 `documents` 文件夹占用的磁盘空间，请输入 `du Documents`。你还可以使用 `ls –lah` 命令查看文件夹内文件的大小。\n\
    \n### zip & unzip\n```\nzip & unzip\n```\n你可以使用 `zip` 命令将文件压缩为 `zip` 归包。要从 zip\
    \ 归包中提取文件，请使用 `unzip` 命令。\n\n### uname\n```\nuname\n```\n你可以使用此命令显示运行你的 Linux\
    \ 发行版的系统所有所有信息。你可以输入 `uname –a` 来打印关于系统的大部分信息。\n\n## 第 7 章：Kali Linux 的特性以及它在黑客世界中如此重要\n\
    \nKali Linux 是一种基于 Debian 的 Linux 发行版。它的设计初衷是为了满足网络分析师和渗透测试员的需求。Kali Linux 随附的大量工具使其成为所有伦理黑客的首选武器。Kali\
    \ Linux 曾被称为 Backtrack。Kali Linux 是 Backtrack 的继者，拥有比 Backtrack 更完善的工具版本；Backtrack\
    \ 过去使用大量的工具来实现相同的目的，使操作系统充满了许多完全必要的程序。这就是为什么伦理黑客转向 Kali Linux，因为它以更简化的形式提供了渗透测试所需的工具，便于操作。\n\
    \n### 为什么选择这个操作系统？\n\nKali Linux 拥有丰富的功能。还有各种理由证明了为什么人们应该开始使用 Kali Linux。\n\n\
    - **免费**：Linux 是一种免费软件，因此所有 Linux 发行版都是免费的。Kali Linux 一直是免费的，并将一直保持免费。\n- **广泛的工具**：Kali\
    \ Linux 可以为你提供超过 600 种不同类型的渗透测试工具以及各种安全分析相关的工具。\n- **开源软件**：Linux 是一种开源软件。因此，作为\
    \ Linux 家族的一部分，Kali Linux 也遵循备受推崇的开源模型。操作系统的开发树可以在 Git 上公开查看，Kali Linux 提供的所有代码也可用于调整。\n\
    - **支持多语言**：尽管渗透工具是用英文编写的，但显而易见，Kali Linux 也支持多语言使用。这样做是为了确保更多的用户可以使用他们的母语言操作操作系统，并能够找到他们工作所需的工具。\n\
    \n"
