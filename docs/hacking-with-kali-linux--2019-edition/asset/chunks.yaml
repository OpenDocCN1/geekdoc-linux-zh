    可移植性是 Linux 操作系统在用户中广为人知的特性。可移植性并不意味着它可以被通过 CD、U 盘或内存卡随携带，也不意味着文件大小很小。可移植性是指 Linux
    操作系统及其所有的应用程序可以在各种类型的硬件上完全相同的方式运行。Linux 内核和操作系统的应用程序支持在甚至是那些硬件配置最低的系统上安装相同的内容。


    ## 安全


    安全性被认为是任何操作系统最核心的部分。对于所有使用该系统执行各种形式机密任务的用户和组织来说，安全性至关重要。Linux 操作系统提供了多种安全概念，旨在保护用户免受对系统及其数据的未经访问。


    ## Linux 安全的主要概念


    Linux 提供了 3 种主要的安全概念。


    - **身份验证 (Authentication)**：这通过为个人用户提供登录名和密码，帮助验证用户身份，确保其工作不会被任何第三方访问。

    - **授权 (Authorization)**：在 Linux 操作系统的文件层级，它对用户设有权限限制。每个文件都有写、读和执行权限，决定了谁可以访问文件、谁可以修改文件以及谁可以执行文件。

    - **加密 (Encryption)**：Linux 操作系统的这一功能有助于将用户文件编码为不可读的格式，称为密文。这确保了即使有人成功打开了系统，文件也是安全的。


    ## 通信


    Linux 操作系统提供了一项与用户通信的强大功能。它可以在单台计算机的网络内部进行，也可以在两个或多个计算机网络之间进行。此类系统的用户可以通过网络无缝地交换数据、邮件和程序。


    ## 第 5 章：Linux 系统的基础


    Linux 是一个简单的操作系统，就像 Windows 等其他操作系统一样。作为一个操作系统，Linux 帮助管理系统的硬件，并提供其他软件运行所需的服务。它被认为是一个注重实操性的操作系统。例如，运行
    Windows 这样的操作系统就像开自动挡汽车，而运行 Linux 操作系统就像开手动挡汽车。这可能需要花费更多精力，但一旦用户熟练掌握了 Linux 的运行机制，使用命令行以及安装软件包将变得超级简单。


    ### Linux 的历史


    Linux 与 MAC OS X 相似，它们都基于 Unix。Unix 开发于 20 世纪 70 年代初，主要目标是创建一个对于各种用户既易于访问又安全的操作系统。1991
    年，Linux 的开发目标是分发 Unix 的特性。它作为开源软件发布，直到今天依然如此。开源软件是指用户可以完全看到代码，并根据需要进行修改和重新分发的软件。Linux
    只是内核，而不是一个完整的操作系统。内核在硬件和用户应用程序请求之间提供了一个接口。操作系统的其他部分由工具、GNU 库以及各种其他软件组成。作为一个完整单元的操作系统被称为
    GNU/Linux。


    关于 关于服务器的一点


    用户拥有的 Linode 是一种服务器。服务器无非就是一种主计算机，帮助在整个网络或跨连接的计算机网络中提供各种形式的服务。服务器通常具有以下特点：


    - 24 小时运行。

    - 通常连接到互联网或一组计算机网络。

    - 包含文件和程序，用于网站托管或互联网上的其他内容。


    由于服务器的作用就像计算机一样，因此 Linode 和家用的电脑之间有许多相似之处。某些相似之处包括：


    - Linode 通常托管在物理形式的机器上。它位于数据中心的可用资源池中。

    - Linode 使用像 Linux 这样的操作系统它是另一种类似于 Mac 或 Windows 的操作系统。

    - 就像用户可以轻松地在 PC 上安装各种应用程序一样，Linode 上也可以安装应用程序。这些安装在 Linode 上的应用程序有助于执行托管网站等各种任务。

    - 用户可以像在 PC 上一样轻松地创建、编辑和删除文件。用户也可以像 PC 一样浏览目录。

    - 就像 PC 一样，Linodes 连接到互联网。


    ## 安装 Linux 之前需要考虑的事


    在安装 Linux 之前，你需要确定你想安装哪种发行版的 Linux。Linux 操作系统有多个版本，被称为发行版（distributions）。发行版类似于
    Windows 7 或 Windows XP 等操作系统的版本。Windows 等操作系统的新版本是升级版。但在 Linux 中，发行版不是升级版，而是不同的口味（flavors）。多个
    Linux 发行版安装了不同的软件包。


    ### Linux 发行版


    Linux 发行版之间的主要区别往往在于发行版的目标以及安装了哪些软件包，而不是 Linux 内核代码的任何差异。由 CentOS 和 Fedora 组成的
    RedHat Linux 以及由 Ubuntu 组成的 Debian Linux 之间共享大量的代码。它们的内核大体相同，来自 GNU 项目的应用程序和用户工具也相似。某些
    Linux 发行版被设计得尽可能精简简单，而另一些则设计有该时代最新且的软件。所有的 Linux 发行版都旨在为用户提供最好的稳定性和可靠性。


    除了发行版的个性特性外，你还需要考虑各种因素，这些因素将帮助你选择所需的发行版。


    - **发布周期 (Release cycle)**：不同的 Linux 发行版以不同的计划发布更新。Arch Linux 和 Gentoo 等发行版使用滚动发布（rolling
    release）模式，每个软件包在开发者宣布其完成或就绪时发布。Slackware、Debian 和 CentOS 等发行版旨在为用户提供最稳定的操作系统形式，同时也非常频繁地发布新版本。Ubuntu
    和 Fedora 等 Linux 发行版每六个月发布一次新版本。选择适合你的发布周期也取决于多种因素。这些因素包括你运行所需的软件、你需要的可靠性和稳定性，以及你寻求的舒适度。

    - **组织结构**：虽然这可能不会直接影响发行版的性能，但它是 Linux 发行版之间最大的区别之一。Gentoo、Debian、Slackware 和
    Arch 等某些 Linux 发行版由独立开发者社区开发，而 Ubuntu、Fedora 和 OpenSUSE 等发行版是由不同公司赞助的社区开发的。CentOS
    等发行版源自商业化发行版。


