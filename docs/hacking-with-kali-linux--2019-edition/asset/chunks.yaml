    ![img](img/00011.jpg)


    Kali Linux 是渗透黑客领域广为人知的操作系统。众所周知，Kali Linux 的主要关注在于用于渗透测试和安全审计，但除了这两项任务外，Kali
    Linux 还能执行许多其他任务。Kali Linux 以框架的形式设计，带有各种形式的工具，可以涵盖各种类型的用例。Kali Linux 的某些工具可以在执行渗透测试时结合使用。


    例如，可以在各种类型的计算机上使用 Kali Linux，比如在渗透测试人员的系统上、想要监控自己网络的系统管理员的服务器上、在与系统取证相关的分析师的系统或工作站上，还可以用于通常带有
    ARM CPU 的嵌入式设备上，这些设备可以轻松地丢入无线网络范围内，也可以插入到目标用户的系统中。许多与 ARM 相关的设备也是攻击的极佳机器，这主要是因为它们体积小且对功耗的要求非常低。


    你还可以直接在云端部署 Kali Linux，以便快速构建一个能够破解密码的大型机器群，也可以部署在手机和平板上，以实现高效的便携式渗透测试。但这远未结束；渗透测试人员还需要服务器。服务器用于在大型渗透测试小组内部使用协作软件，用于设置用于钓鱼攻击的
    Web 服务器，用于运行与漏洞扫描相关的工具以及各种其他相互互联的工作。


    一旦你启动了 Kali Linux，你会发现 Kali Linux 的主菜单已经根据不同的主题进行了组织，这些主题涵盖渗透测试人员和其他信息安全专业人员相关的各种活动和任务。


    ## 使用 Kali Linux 可以执行的任务


    Kali Linux 帮助执行广泛的任务。让我们来看看其中一些任务。


    - **信息收集**：Kali Linux 可用于收集与目标网络及其结构相关的各种形式的数据。它还帮助识别计算机系统、此类计算机的操作系统以及计算机系统运行的所有服务。Kali
    Linux 可用于识别信息系统中的各种潜在敏感部分，并从运行目录的服务中提取所有形式的列表。


    - **漏洞分析**：你可以使用 Kali Linux 快速测试远程或本地系统是否受到已知漏洞或任何本质上完全不安全的配置的影响。漏洞扫描器使用包含多种特征码的数据库来识别潜在的威胁和漏洞。


    - **Web 应用程序分析**：它可以帮助识别 Web 应用程序安全系统中任何形式的配置错误或缺陷。由于此类应用程序的公开可用性使得它们成为所有攻击者的理想目标，因此识别并缓解此类问题是一项至关重要的任务。


    - **数据库评估**：数据库攻击是攻击者常见的向量形式，包括 SQL 注入攻击和凭据攻击。Kali Linux 提供了各种工具，可测试攻击向量，范围从数据提取到
    SQL 注入以及对其进行分析。


    - **密码攻击**：连接身份验证的系统总是容易受到攻击者的攻击。Kali Linux 中可以找到大量工具，从密码攻击的在线工具到针对哈希或加密系统的离线工具。


    - **无线形式攻击**：无线网络在本质上是无处不在。这意味着它们始终是攻击者常见的攻击向量。Kali Linux 对各种网卡提供了广泛支持，使得 Kali
    Linux 成为针对多种无线网络类型攻击的显而选择。


    - **逆向工程**：逆向工程是一项非常重要的活动，被用于各种目的。在为各种形式的进攻活动提供支持，逆向工程是识别漏洞和跟踪利用开发的主要方法之一。在防御方面，它也被用于分析用于目标攻击的恶意软件。在这种能力范围内，其目标是识别一组特定技术的核心能力。


    - **利用工具**：利用（Exploitation）是指利用系统中任何形式的现有漏洞的行为，这允许攻击者获得远程设备或机器的完全控制。这种访问形式也可以被攻击者用于进一步的权限提升，攻击可以在本地网络可访问的任何机器或已被攻破的机器上进行。这类
    Kali Linux 功能带有各种工具和实用程序，有助于简化编写你自己的利用程序的整体过程。


    - **欺骗与嗅探（Spoofing and sniffing）**：获取跨任何网络的数据包的完全访问对攻击者来说总是有利的。Kali Linux 可以为你提供各种用于欺骗的工具，允许你模仿任何合法用户；以及嗅探工具，允许你直接从网络线缆分析并捕获可用数据池。当欺骗和嗅探工具结合使用时，它们会变得非常强大。


    - **后渗透阶段（Post exploitation）**：一旦你成功获得目标系统的完全访问权限，你可能希望通过在网络中横向移动来维持系统的这种访问级别并扩展控制。你可以在
    Kali Linux 中找到各种工具来帮助你实现后渗透方面的目标。


    - **取证**：取证 Linux 的现场启动环境在几年非常有名。Kali Linux 带有许多基于 Linux 的流行取证工具，将允许你执行从最初的分检阶段到数据镜像、系统完整分析，以及最后的案件管理的所有工作。


    - **报告工具**：只有当测试的所有发现都得到适当报告后，渗透测试才能被宣布为成功。Kali Linux 的这类工具有助于汇编通过信息收集工具收集的数据，发现各种非显性的关系，并将所有内容整合到几份报告中。

    '
- fmt: "\n# Tools for social engineering\n\n> Tools for social engineering: When the\
    \ technical aspect of a system is secured properly, there are chances of exploiting\
    \ the behavior of human beings as a vector of attack. When provided with the perfect\
    \ influence, human beings can be induced frequently for taking various actions\
    \ which ultimately leads to the compromising of the security of a system environment.\
    \ Did the USB drive which was just now plugged in by the secretary contain any\
    \ form of harmful PDF? Or did the UDB drive just installed a form of Trojan horse\
    \ backdoor? Was the website of banking which was used by the accountant just now\
    \ was a normal expected form of website or a copy of a website for the purpose\
    \ of phishing attack? Kali Linux comes with various tools that can help you in\
    \ aiding all these forms of attacks.\n\n# Services for system\n\n> Kali Linux\
    \ can provide with tools which will allow you to initiate and also stop various\
    \ applications which run in the background as the services for the system.\n\n\
    ## Coordinating tasks of Kali Linux\n\nKali Linux helps in coordinating several\
    \ tasks and also helps in balancing the coordination between the software and\
    \ hardware of a system.\n\nThe first and foremost task of Kali Linux is to control\
    \ the hardware components of the computer system. It helps in detecting along\
    \ with figuring out the various hardware components when the computer turns on\
    \ or also when any new device is installed. It helps in making the hardware components\
    \ available for the various higher level of software with the help of a simplified\
    \ form of program interface so that the applications can take all-round advantage\
    \ of the connected devices without the need of addressing any detail like in which\
    \ extension slot is the option board plugged in. The interface of programming\
    \ also comes with a layer of abstraction which allows various software to work\
    \ seamlessly with the hardware.\n\n## What makes Kali Linux different from others?\n\
    \nKali Linux has been specifically designed for gearing up the functioning of\
    \ the penetration testers and also for the purpose of security auditing. For achieving\
    \ this, various core changes have also been implemented for Kali Linux which reflects\
    \ all of these requirements:\n\n- **Root access by design, single-user**: Because\
    \ of the normal nature of the audits regarding system auditing, Kali Linux has\
    \ been designed in such a way which can be used in the scenario of single root\
    \ access. Most of the tools which are employed for the purpose of penetration\
    \ testing needs escalated form of privileges and as it is typically sound policy\
    \ for enabling the root privileges when required, during the use cases to which\
    \ Kali Linux is aimed to, this whole approach might turn out to be a huge burden.\n\
    - **The services of network disabled by default**: Kali Linux comes with systematic\
    \ hooks which disables the services of a network by default. Such hooks allow\
    \ the users to install several Kali Linux services while also making sure that\
    \ the distributions also remains completely safe and secure by default no matter\
    \ which type of packages has been installed. Other additional services like Bluetooth\
    \ are also kept in the blacklist by default settings.\n- **Custom kernel of Linux**:\
    \ Kali Linux uses up upstream form of the kernel which is patched for the purpose\
    \ of wireless injection.\n- **A set of trusted and minimal repositories**: The\
    \ absolute key of Kali Linux is to maintain the integrity of a given system, given\
    \ all the goals and aims of Kali Linux. With the prime aim in mind, the complete\
    \ collection of sources of upstream software which are used by Kali Linux is kept\
    \ as minimum as possible. Many of the new users of Kali Linux gets tempted to\
    \ add the extra repositories to the `sources.list`. But, by doing so, it leads\
    \ to the risk of breaking the installation of Kali Linux.\n\nIt is not correct\
    \ to suggest that everyone should be using Kali Linux. Kali Linux is been designed\
    \ particularly for the security specialists. It comes with a unique nature because\
    \ of which Kali Linux is not a recommended distribution for those who are not\
    \ at all familiar with the functioning of Linux or are looking out for some general\
    \ form of Linux distribution for their desktop, for gaming, designing of website\
    \ and many more. Even for the experienced users of Linux, Kali Linux might come\
    \ along with certain challenges which are generally set up due to preserving the\
    \ security of the systems.\n\n# Chapter 1: Different Tools of Kali Linux\n\nAs\
    \ we know that Kali Linux is an open source form of distribution which is completely\
    \ based on Debian, it helps in providing various tools for the purpose of security\
    \ auditing along with penetration testing. It has been developed by Offensive\
    \ Security and is also among some of the most well-known distributions and is\
    \ being widely used by the ethical hackers. The best thing that comes with Kali\
    \ Linux is that it does not need to be installed as the OS in your system. Instead\
    \ of that, you can simply run the `iso` file which can be loaded in the memory\
    \ of RAM easily for the purpose of testing the security of a system with the help\
    \ of around 600 tools.\n\nKali Linux provides users with various forms of tools\
    \ like information gathering tools, tools for analysis of vulnerability, web application\
    \ tools, wireless attack tools, tools for forensics, sniffing along with spoofing\
    \ tools, hardware hacking tool and many more. Let’s have a look at some of the\
    \ most popular tools from Kali Linux.\n\n## Tools from Kali Linux\n\n- **Nmap**:\
    \ Nmap can be regarded as the most popular network mapping tool. It allows the\
    \ user to find out the active hosts available within a network and also gathers\
    \ relevant information in relation to penetration testing. Some of the main features\
    \ of Nmap are:\n    1. It comes with host discovery and helps in identifying the\
    \ available network hosts.\n    2. `Nmap` comes with the feature of port scanning\
    \ which allows the users to calculate the total number of open ports on the remote\
    \ or local form of host.\n    3. It helps in fetching the OS of a network and\
    \ also finds out various information about the connected devices.\n    4. It allows\
    \ the user to detect the version of the application and also determines the name\
    \ of the application.\n    5. It helps in extending the default capabilities of\
    \ `Nmap` by the use of `NSE` or `Nmap Scripting Engine`.\n- **Netcat**: As the\
    \ name goes by, `Netcat` functions just like a cat and helps in fetching details\
    \ about a network. It functions as an application for network exploration which\
    \ is not only used in the field of security industry but is also famous in the\
    \ network administration and security administration field. It is generally used\
    \ for the purpose of checking outbound and inbound network and also for port exploration.\
    \ It can also be used for conjunction with various languages of programming such\
    \ as `C` or `Perl` or also with `bash` scripts. The main features of `Netcat`\
    \ are:\n    1. Port analysis of `UCP` and `TDP`\n    2. Sniffing of inbound and\
    \ outbound network\n    3. Forward and reverse analysis of `DNS`\n    4. Scanning\
    \ of remote and local ports\n    5. Integration with the standard input of terminals\n\
    \    6. `TCP` and `UDP` tunneling mode\n- **Unicornscan**: This is one of the\
    \ finest tools of infosec which is being used for the purpose of data correction\
    \ along with gathering. It also offers the users with `UDP` and `TCP` scanning\
    \ along with super beneficial patterns of discovery which helps in finding the\
    \ remote hosts. It can also help in finding out the software which is running\
    \ in each of the hosts. The main features of `Unicornscan` are:\n    1. Asynchronous\
    \ scan of `TCP`\n    2. Asynchronous scan of `UDP`\n    3. Asynchronous banner\
    \ detection of `TCP`\n    4. Application, OS and system service detection\n  \
    \  5. Capability of using customized sets of data\n    6. Supports relational\
    \ output for `SQL`\n"
