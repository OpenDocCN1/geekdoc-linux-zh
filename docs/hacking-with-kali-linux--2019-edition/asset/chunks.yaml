  trans: "\n随 TCP 扫描而来的最后一种方法是僵尸扫描（zombie scanning）。僵尸扫描的主要目标是映射远程系统上所有开放形式的端口，而甚至不会产生任何关于你曾与系统进行过交互的证据。僵尸扫描的工作原理在本质上是复杂的。你可以按照以下步骤执行僵尸扫描。\n\
    \n1. 首先，识别作为僵尸的远程系统。你将识别的系统需要具备以下特征：\n    - 它处于空闲状态，并且不会与网络上其他可用系统进行主动通信。\n  \
    \  - 它需要使用增量式的 `IPID` 序列。\n2. 然后，你需要向僵尸发送一个 `SYN+ACK` 数据包，并记录 `IPID` 的初始值。\n3.\
    \ 向扫描目标系统发送一个 `SYN` 数据包，源 IP 地址伪造为僵尸系统的 IP 地址。\n4. 根据目标扫描的端口状态，会发生以下任何情况：\n  \
    \  - 如果端口处于开放状态，扫描目标将向它认为发送了原始 `SYN` 请求的僵尸主机返回 `SYN+ACK` 数据包。在这种情况下，僵尸主机将用 `RST`\
    \ 数据包响应这种未经请求的 `SYN+ACK` 数据包，并将 `IPID` 值加一。\n    - 如果端口处于关闭状态，扫描目标将向它认为发送了原始 `SYN`\
    \ 请求的僵尸主机返回 `RST` 响应。`RST` 数据包不会向僵尸主机请求任何形式的响应，因此 `IPID` 值不会增加。\n5. 向僵尸主机发送另一个\
    \ `SYN+ACK` 数据包，然后评估返回的 `RST` 响应的 `IPID` 最终值。如果值增加了一，则目标扫描的端口是关闭的；如果值增加了二，则目标扫描的端口处于开放状态。\n\
    \n执行僵尸扫描时，需要向僵尸系统发送初始 `SYN/ACK` 请求，目的是确定返回的 `RST` 数据包中 `IPID` 的当前值。随后，向扫描目标发送伪造的\
    \ `SYN` 数据包，源 IP 地址为僵尸系统的 IP 地址。由于僵尸实际上并没有发送初始 `SYN` 请求，它会将 `SYN/ACK` 响应解释为未经请求的，然后向目标系统发送\
    \ `RST` 数据包，从而使 `IPID` 值增加一。在最后阶段，需要向僵尸系统发送另一个 `SYN/ACK` 数据包，它将返回 `RST` 数据包并使\
    \ `IPID` 值增加一。\n\n# 第 13 章：渗透测试\n\n![img](img/00004.jpg)\n\n每一个 IT 基础设施都存在一些弱点，这些弱点可能导致严重的攻击，并被用于盗取和操纵数据。在这种情况下，只有一件事可以防止黑客进入系统。你需要对你的安全基础设施进行定期检查，确保结构中不存在任何形式的漏洞。渗透测试有助于发现系统中的漏洞以及多个弱点。作为网络的所有者或管理员，他们总是比黑客具有某些优势，因为他们必然了解网络拓扑、基础设施组件、服务、可能的攻击点、已执行的服务等信息。\n\
    \n渗透测试是在真实的安全环境中进行的，这样如果发现任何漏洞，就可以进行修复并保护系统。\n\n## 渗透测试详解\n\n如其名所示，渗透测试是对系统进行测试的过程，以确定第三方是否可能渗透系统。渗透测试经常与伦理黑客（ethical\
    \ hacking）混淆，因为两者在特征和功能上有些相似。它们的动机也是相同的，但有一条非常细的界限区分了两者。在渗透测试中，测试人员扫描相关系统中任何形式的漏洞、恶意内容、风险和缺陷。渗透测试可以在在线网络、服务器或计算机系统中进行。渗透测试的目标是加强组织的安全系统，以妥善防御系统安全。与黑客不同，渗透测试在性质上是合法的，并在所有形式的官方范围内进行。如果使用得当，它可以产生奇迹。渗透测试可以被视为伦理黑客的重要部分。\n\
    \n渗透测试需要定期进行，因为它具有提高系统能力以及改进网络安全相关策略的力量。创建各种类型的恶意内容是为了钓出程序、应用程序或系统中的弱点。为了进行有效测试，创建的恶意内容会遍到整个网络进行漏洞测试。渗透测试可能无法处理所有与安全相关的问题；但它可以有助于减少任何形式攻击的可能概率。它有助于确保公司免受各种形式漏洞的影响，从而保护其免受网络攻击。它还帮助检查防御措施对于组织来说是否足够，以及为了降低系统漏洞需要更改哪些安全措施。\n\
    \n渗透测试对于在任何特定时间指出组织结构中的优点和缺点都非常有帮助。你需要注意的是，整个过程本质上并不是随意的。它包括严密的计划、获得相关管理层授予的许可，然后启动该过程。\n\
    \n## 安全扫描器\n\n渗透测试过程在收集了整个组织的概述后开始，然后开始寻找特定弱点的过程。为了执行所有这些，你需要使用安全扫描器。根据安全扫描器的类型和性质，这些工具实际上可以帮助检查整个系统或网络的已知弱点。安全扫描工具最全面的形式之一是\
    \ `OpenVAS`。该工具包含了大量的漏洞信息，并且还可以检查防御措施。在 `OpenVAS` 工具识别出所有开放工具后，你可以轻松地使用 `Nmap`\
    \ 来发现细节。像 `Wireshark` 这样的工具允许你发现任何关键性质的内容以及任何可能指示某些攻击模式的关键网络活动。\n\n经典形式的 `Wireshark`\
    \ 工具对于识别可能指示黑客攻击的瓶颈也有用，并且需要持续检查。在企业组织中，基于 Web 的应用程序通常依赖于 `MySQL`、`Apache` 和 `PHP`\
    \ 栈。这些平台主导了整个格局。此类平台是黑客的最喜目标，因为它们通常提供了巨大的攻击机会。`Kali Linux` 带有二十种专门用于 Web 应用程序测试的工具。此类扫描器可以在\
    \ Web 应用程序分析菜单中轻松找到。`w3af` 和 `Burp Suite` 被认为是这些工具中最好的。\n"
