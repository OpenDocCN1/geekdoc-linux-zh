    # Chapter 12: Techniques of Port Scanning using Kali Linux


    ![img](images/00001.jpg)


    Identification of the open ports on the targeted system is essential for defining
    the surface of attack of the target. The open ports of the target correspond with
    the networked services which are running on the system. Errors in programming
    or flaws in implementation can result in making all these services very much susceptible
    to the attacks and can also lead to compromise of the overall system. For the
    purpose of determining the most probable vectors of attack, you are required to
    enumerate all the ports which are in open condition on all the systems of remote
    form within the scope of the project. The open number of ports also corresponds
    with the services which can be easily addressed with the help of either `TCP`
    or `UDP` traffic.


    Both `UDP` and `TCP` are protocols of transport. `TCP` (Transmission Control Protocol)
    is the one which is more commonly used than `UDP` and also provides communication
    which is connection-oriented. `UDP` (User Datagram Protocol) is a protocol which
    non-connection oriented in nature which is also sometimes used along with the
    services in which transmission speed is more important than the integrity of data.
    The form of penetration testing which used for the purpose of enumerating such
    services is known as port scanning. Such technique helps in yielding enough amount
    of information for the purpose of identifying whether the service is being associated
    with any port on the server or on the device.


    ## UDP Port Scanning


    As `TCP` is more frequently used than `UDP` as a protocol off transport layer,
    services which are operated by `UDP` are most often forgotten. In spite of the
    normal tendency of overlooking the services of `UDP`, it is also critical for
    these services to be enumerated for acquiring an overall understanding of the
    attack. The form of scanning with `UDP` is often more complex because `UDP` is
    a connectionless protocol, meaning there is no three-way handshake to confirm
    if a port is open or closed.


    In the first step of a `UDP` scan, a `UDP` packet is sent to the port. If the
    port is open, the application may respond, or it may not respond at all. If the
    port is closed, the host will typically respond with an `ICMP` Port Unreachable
    message. However, if a firewall is present, no response is returned, which makes
    `UDP` scanning more difficult to distinguish between an open, closed, and filtered
    port.


    ## TCP Port Scanning


    `TCP` port scanning includes various approaches such as connect scanning, stealth
    scanning with with scanning. For understanding how all these techniques work,
    you need to understand how the connections of `TCP` are established. Data is transported
    over `TCP` only after a successful connection has been created. The process which
    is associated with the creation of connection is often called threeway handshake.


    ### The Three-Way Handshake


    A packet of `TCP `TCP`` is sent from that device which wants to establish connection
    along with the port port it wants to connect. If the associate service with the
    port which the device wants to connect to accepts the connection, the port will
    be replying to the system which is requesting the connection with a packet of
    `TCP` that comes with both `ACK` and `SYN` bits activated. The connection is successful
    when the requesting system responds back to the port with a response of `TCP ACK`.
    These three steps in total sums up the three-step process which is required for
    the establishment of a session of `TCP` between two systems.


    Both the process of stealth scanning and connect scanning are quite easy to understand.
    The process of connect scanning is used up for establishing a complete `TCP` connection
    every port which is being scanned. However, in the case of stealth scanning, a
    full connection is not established. Stealth scanning is often referred to as SYN
    scanning or also half open scanning. For each and every port which are scanned,
    one single packet of `SYN` is sent out to the port of destination and all the
    ports which replies with a packet of `SYN+ACK` are taken as to be running the
    live form of services. As no final form of `ACK` is sent out from the system which
    initiated the connection, the connection is left out as half open. This is known
    as stealth scanning as the solutions of logging which only records the connections
    which are established do not record any form of evidence of the performed scan.

