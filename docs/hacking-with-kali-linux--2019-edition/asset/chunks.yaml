    # Fierce


    Fierce 是 Kali Linux 中的一个工具，用于端口扫描和网络制图。它还可以用于发现任何网络中的主机名和非连续 IP 空间。它在功能上与 `Unicornscan`
    和 `Nmap` 类似，但与这两者不同，Fierce 专门用于企业网络。在渗透测试人员定义目标网络后，Fierce 会针对该域运行各种测试，以检索重要信息，用于进一步的分析和后渗透利用。


    Fierce 的功能包括：


    1. 扫描内部和外部 IP 范围

    2. 具有更改 DNS 服务器以进行反向查询的能力

    3. 扫描 IP 范围和整个 C 类网

    4. 帮助将日志功能记录到文件系统中

    5. 发现名称服务器并进行区域传输攻击

    6. 使用自定义文本列表进行暴力破解的能力


    # OpenVAS


    OpenVAS：也称为开放漏洞扫描系统（Open Vulnerability Assessment System），是一款免费软件，任何人都可以用它探索网络的远程或本地漏洞。该安全工具有助于编写并将自定义的安全插件集成到
    OpenVAS 平台中。OpenVAS 的主要特征有有：


    1. 它作为端口扫描器和网络制图器工作

    2. 它有助于发现同时在线主机

    3. 它支持 `OpenVAS` 传输协议

    4. 它集成了 `SQLite` 等 SQL 数据库

    5. 它执行每周或每日扫描

    6. 它帮助将结果导出为 `HTML`、`XML` 或 `LateX` 格式的文件

    7. 它具有恢复、暂停和停止扫描的能力

    8. 它完全支持 Linux 和 Windows


    # Nikto


    Nikto 用 Perl 编写，是 Kali Linux 中包含的一个工具，作为 `OpenVAS` 以及其他漏洞扫描工具的补充工具。它允许渗透测试人员和伦理黑客对整个
    Web 服务器进行扫描，以发现漏洞和安全缺陷。该工具通过寻找应用程序和文件的不安全模式、过时的服务器软件以及软件和服务器的默认名称和错误配置来收集所有安全扫描结果。它还支持用于
    SSL 加密的各种代理、基于主机的身份验证等。Nikto 的主要特征有：


    1. 它有助于扫描服务器上可用的多个端口

    2. 它带有规避 `IDS` 的技术

    3. 提供 `XML`、`TXT`、`NBE`、`HTML` 和 `CSV` 格式的输出结果

    4. 它带有 `Apache` 和 `cgiwrap` 用户名的枚举

    5. 它对指定的 `CGI` 目录进行扫描

    6. 它可以通过文件、图标和页头信息识别系统中安装的软件

    7. 它使用自定义的配置文件

    8. 它有助于调试并提供详尽的输出


    # WPScan


    WPScan 用于审计 WordPress 安装的安全性。通过 `WPScan` 的帮助，你可以轻松地发现你的 WordPress 设置是否容易受到任何形式的攻击，或者它是否在核心、主题文件或插件中泄露了过多信息。该工具还允许用户找到每个注册用户的弱密码，并运行暴力破解攻击以找出哪些可以被破解。`WPScan`
    的功能有：


    1. 枚举 `WP` 用户名

    2. 非侵入性的安全扫描

    3. 枚举 `WP` 插件漏洞

    4. 弱密码破解和 `WP` 暴力破解攻击

    5. WordPress 安全扫描的调度


    # CMSMap


    CMSMap 是一个用 `Python` 编写的开源项目。它有助于自动化对 `Joomla`、`WordPress`、`Moodle` 和 `Drupal`
    的漏洞扫描和检测任务。该工具还可以用于运行暴力破解，并在发现漏洞后启动各种利用程序。`CMSMap` 的主要特征有：


    1. 它支持多威胁扫描

    2. 它具有设置自定义请求头和用户代理的能力

    3. 它支持 `SSL` 加密

    4. 它以文本文件的形式保存输出文件


    # Fluxion


    该工具作为一个 Wi-Fi 分析器工作，专门用于 `MITM WPA` 攻击。它允许用户轻松扫描无线网络，搜索个人或企业网络中任何形式的安全缺陷。与其他 Wi-Fi
    破解工具不同，该工具不会进行任何形式的暴力破解尝试，因为那通常需要大量时间。该工具不是启动暴力攻击，而是产生一个 `MDK3` 进程，确保所有连接到目标网络的用户都取消身份认证。完成后，用户将收到一个连接虚假访问点的提示屏幕，他们需要输入
    Wi-Fi 密码。然后工具会将 Wi-Fi 密码发送给你，你就可以轻松访问同一个网络。


    除了这些工具外，Kali Linux 还有许多工具，如 `Aircrack-ng`、`Kismet Wireless`、`Wireshark`、`John
    the Ripper` 等。


    # 第 11 章：如何使用 Kali Linux 进行攻击？


    ![img](img/00012.jpg)


    正如我们现在所知的，Kali Linux 专为渗透测试和安全审计而设计，它也可以用于伦理黑客，这在执行渗透测试和其他安全检查时是必需的。Kali Linux
    配备大量的工具，有助于安全基础设施测试以及用于保护组织或公司的其他形式的测试。


    ## 谁在使用 Kali Linux？为什么要用？


    Kali Linux 可以被认为是当今最独特的操作系统形式，因为它提供了一个可以供“好人”和“坏人”共同使用的平台。安全管理员和黑帽黑客都使用这个平台来满足他们的需求。一个人使用该系统是为了防止和检测安全基础设施的泄露，而另一个人则使用该操作系统来识别并以此利用（exploit）安全泄露。Kali
    Linux 自带的大量工具被认为是安全专业人员工具箱中的瑞士军刀。广泛使用 Kali Linux 的专业人员有：


    * **安全管理员**：安全管理员负责保护相关机构的信息和数据。安全管理员广泛使用 Kali Linux 是为了确保安全基础设施环境中不存在任何形式的漏洞。

    * **网络管理员**：网络管理员负责维护安全高效的网络。网络管理员使用 Kali Linux 进行网络审计。例如，Kali Linux 可以轻松检测到非法访问点。

    * **网络架构师**：这些人负责为网络设计安全环境。他们使用 Kali Linux 审计内部网络设计，确保没有配置错误或被遗漏。

    * **渗透测试人员**：渗透测试人员使用 Kali Linux 审计安全环境，并对他们负责负责的企业环境进行侦察。


