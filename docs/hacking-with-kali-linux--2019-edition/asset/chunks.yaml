    # 第 4 章：Linux 架构


    ![img](img/00010.jpg)


    Linux 是今天可以找到的最操作系统之一。它本质上是开源的，并基于 UNIX。它就像 Windows XP、Windows 10 和 MAC OS 等商业操作系统一样，是一个简单的操作系统。操作系统无非计算机系统与用户之间的图形化界面。它负责管理计算机系统拥的所有硬件相关资源，并有助于建立硬件与软件之间的通信。


    ## 开源软件


    开源软件是指其源代码根据许可协议提供的软件，版权所有者有权根据该协议研究软件、更改设置，并出于任何目的将该软件分发给任何想要的人。


    ## Linux 操作系统及其组件


    Linux 操作系统由三个不同的组件组成。


    - 内核 (Kernel)

    - 系统库 (System Library)

    - 系统实用程序 (System Utility)


    ### 内核


    内核充当任何形式操作系统的核心部分。它负责处理计算机系统硬件的任务。`CPU` 时间和内存是 `kernel` 管理的两个示例。操作系统的内核分为两种：


    - **微内核**：微内核操作系统内核的一种。正如其名，它具有非常基础的功能。它是提供操作系统运行所需环境的最少软件。这种内核环境涵盖了线程管理、地址空间的低级管理以及进程间的通信。

    - **单体内核**：单体内核是带有各种驱动程序的内核形式。它是操作系统的一种架构，其中系统的操作系统在内核空间内运行。这种形式的内核能够动态加载或卸载运行时可执行的所有模块。单体内核保持在监视模式。微内核和单体内核之间的主要区别在于，单体内核可以单独定义计算机系统硬件上非常高层次的接口。


    #### 监视模式


    单体内核的监视模式是一个介于系统硬件之间的的标志。它可以通过在软件系统级运行代码来轻松修改。所有形式的系统级任务在操作或运行时都带有此标志。然而，用户空间的应用程序并没有设置此标志。该标志确保了是否可以执行机器码操作，例如执行各种操作，如禁用中断或为各种形式的描述符表修改寄存器。两种不同类型操作背后的核心思想来自“控制越多，责任越大”。


    监视模式下的任何程序都是受信任的，以至于永远不会失败，因为任何形式的失败都会导致计算机系统的崩溃。简单来说，内核是负责操作系统所有形式运行的组件。它由各种类型的模块组成，并直接与底层硬件进行交互。内核提供了所有必要的抽象，目的是向系统或应用程序隐藏硬件的所有低级细节。


    ### 系统库


    系统库由一组非易失性资源组成，这些资源被计算机系统资源使用，并主要用于开发软件。它包含数据配置、帮助数据、文档、消息模板等许多。通常，“库”一词用于描述用计算机语言编写的关于行为的巨大实现集合。它具有完美定义的接口形式，有助于调用这些行为。这意味着，任何想要创建高层程序的人都可以轻松使用系统库来连续进行系统调用。


    各种形式的程序可以同时在同一时间请求系统库，以确保库的编码方式使得即使相关程序之间完全没有链接或相互连接，多个程序也可以使用该库。简单来说，系统库是使用系统实用程序或应用程序构建的唯一程序或函数形式，它们可以访问内核的所有功能。这种形式的库实现了与计算机操作系统相关的大部分功能，并且它们不需要拥有内核模块的代码访问权限。


    ### 系统实用程序


    系统实用程序程序负责执行所有形式的个人和专业级任务。实用程序软件是系统软件的一种。它设计用于运行计算机系统的应用程序和硬件程序。系统软件也可以被视为用户应用程序与硬件之间的接口。简单来说，系统实用程序软件是用于配置、分析、优化和维护计算机系统的系统软件。实用程序软件与操作系统协同工作以支持系统的基础设施，使其与旨在直接执行有利于普通用户任务的应用程序区分开来。


    ## Linux 架构的特点


    Linux 具有许多对普通用户非常有帮助的特性。


    ### 多用户能力


    这是 Linux 操作系统最独特的特点，计算机的资源（如内存、硬盘等）可以被多个用户同时访问。然而，用户并不是从单个终端访问资源。每个用户都获得了一个独立的终端来访问和操作资源。终端由至少一个
    VDU（视频显示器）、鼠标和键盘作为输入设备。所有终端都链接或连接到主服务器（Linux）或主机，主机的资源和其他打印机等外围设备可以供用户使用。


    ### 多任务处理


    Linux 操作系统具备同时轻松处理各种作业的能力。例如，用户可以执行一个执行巨大列表的命令，同时在记事本中输入内容。这是通过实施调度策略以及上下文切换的概念来划分
    `CPU` 时间来智能管理的。


    ### 可移植性


    '
- fmt: '

    Portability is the feature that made Linux OS so famous among the users. Portability
    does not mean at all that it can be carried around in CDs, pen drive or memory
    cars nor the size of the file is small. By portability, it means that the OS of
    Linux along with all its application can function on various types of hardware
    in the exact same way. The kernel of Linux and the application programs of the
    OS support the installation of the same on even those systems which comes with
    the least configuration of hardware.


    ## Security


    Security is considered as the most essential part of any operating system. It
    is really important for all those users and organizations who are using the system
    for various forms of confidential tasks. Linux OS comes with various concepts
    of security for the purpose of protecting the users from any form of unauthorized
    access of the system and their data.


    ## Main concepts of Linux security


    Linux provides 3 main types of security concepts.


    - **Authentication**: This helps in authenticating the user with the system by
    providing login names and password for the individual users so that their work
    cannot be accessed by any third party.

    - **Authorization**: At the file level of Linux OS, it comes with limits of authorization
    for the users. There are write, read and execution permissions for every file
    which determines who all can access the files, who can modify the same and who
    all can execute the files.

    - **Encryption**: This feature of Linux OS helps in encoding the user files into
    a format which is unreadable in format and is called cyphertext. This makes sure
    that even if someone becomes successful in opening up the system, the files will
    be safe.


    ## Communication


    Linux OS comes with a great feature for the purpose of communicating with the
    users. It can be either within the network of one single computer or in between
    two or more than two networks of a computer. The users of such systems can seamlessly
    exchange data, mail and programs through the networks.


    ## Chapter 5: Basics of Linux Operating System


    Linux is a simple operating system just like other operating systems such as Windows.
    As an OS, Linux helps in managing the hardware of a system and also provides services
    that the other software needs for running. It is regarded as a hands-on operating
    system. For example, if running an OS like Windows is like an automatic car, running
    Linux OS is like driving a stick. It might need some more work to do, but once
    the user gets a nice grip of the functioning of Linux, using the line of commands
    and also installing the packages will become super easy.


    ### History of Linux


    Linux is similar to the MAC OS X, which is also based on Unix. Unix was developed
    in the early 1970s with a primary goal of creating an OS which will turn out to
    be accessible and also secure at the same time for various users. In 1991, Linux
    was developed with the goal of distributing the features of Unix. It was launched
    as open-source software and till date, it is the same. Open source software is
    a software whose code is visible completely by the user and can also be modified
    according to need and can be redistributed. Linux is just the kernel and not a
    complete OS. The kernel provides for an interface between the hardware and requests
    from the user applications. The other part of the OS consists of utilities, GNU
    libraries and various other software. The OS as one complete unit is called as
    GNU/Linux.


    ### A bit of servers


    The Linode that the users have is a type of server. A server is nothing but a
    type of master computer which helps in providing various forms of service all
    over the network or across a connected network of computers. The servers are generally:


    - Stays on all the time.

    - It is generally connected with the internet or a group of computer networks.

    - Consists of files and programs for the purpose of website hosting or for other
    content of the Internet.


    As the server acts just like a computer, there are various similarities in between
    the Linode and the home computer. Some of the similarities are:


    - The Linode is generally hosted on a physical form of machine. It sits on the
    available pool of data centers.

    - Linodes uses up OS like Linux. It is another type of OS similar to Mac or Windows.

    - Just like a user can easily install various applications in their PC, applications
    can be installed on Linode as well. All these applications which are installed
    on a Linode help in performing various tasks like hosting a website.

    - A user can easily create, edit and delete files just like it can be done on
    a PC. The user can navigate through the directories as well just like PC.

    - Just like a PC, Linodes are connected with the internet.


    ## Things to consider before installing Linux


    Before installing Linux, you need to make sure which distribution of Linux you
    want to install. Linux OS comes in various versions which are known as distributions.
    The distributions are similar to that of the versions of OS like Windows 7 or
    Windows XP. The new versions of operating systems like Windows are the upgraded
    versions. But, in case of Linux, the distributions are not upgraded but are of
    various flavors. Several distributions of Linux install various different software
    bundles.


    ### Linux Distributions


    The major difference between the distributions of Linux tends to be from the aspect
    of aims and goals of the distribution and which software bundles are installed
    rather than any form of difference in the Linux kernel code. RedHat Linux which
    consists of CentOS and Fedora and Debian Linux which consists of Ubuntu shares
    a huge amount of codes with one another. The kernels are more or less the same
    and the applications along with user utilities from the project of GNU are also
    similar. Some of the distributions of Linux have been designed to be as minimalistic
    and simple as possible whereas some has been designed having the current and the
    best software of the era. All the distributions of Linux aim at providing the
    best stability and reliability to the users.


    In addition to the individual personality of distributions, you will also need
    to consider various factors which will help you at the time of choosing your desired
    distribution.


    - **Release cycle**: The various distributions of Linux release the updates of
    their OS at different schedules. The distributions like Arch Linux and Gentoo
    uses a model of rolling release in which each individual package is released when
    they are declared as complete or ready by the developers. Distributions like Slackware,
    Debian and CentOS targets in providing the users with the most stable form of
    operating system which will be attainable as well and also releases the newer
    versions very frequently. Linux distributions such as Ubuntu and Fedora release
    its new versions after every six months. Selecting the release cycle which will
    be perfect for you also depends on various factors. The factors include the software
    that you require to run, the amount of reliability and stability that you require
    and the comfort level you are looking out for.

    - **Organizational structure**: Although it might not directly affect the distribution
    performance, it is still one of the most distinguishing factors in between the
    Linux distributions. Some of the Linux distributions like Gentoo, Debian, Slackware
    and Arch are all developed by the communities of independent developers while
    some of the other distributions such as Ubuntu, Fedora and OpenSUSE are developed
    by those communities which are being sponsored by different corporations. Distribution
    like CentOS is derived from the distributions which are produced commercially.

