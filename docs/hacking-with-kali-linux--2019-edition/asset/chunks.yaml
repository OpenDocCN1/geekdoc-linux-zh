    ## Kali Linux 的用户


    - **CISO (首席信息安全官)**：首席信息安全官利用 `Kali Linux` 对其基础设施环境进行内部审计，并检查环境中是否安装了任何新形式的应用程序或异常配置。

    - **取证工程师**：`Kali Linux` 带有一种取证模式，允许取证工程师在各种实例中执行数据发现和数据恢复。

    - **白帽黑客**：白帽黑客或伦理黑客类似于渗透测试员，他们使用 `Kali Linux` 进行审计并发现安全环境中可能存在的漏洞。

    - **黑帽黑客**：黑帽黑客使用 `Kali Linux` 寻找系统漏洞并进行利用。`Kali Linux` 带有多种社会工程应用程序，黑帽黑客可以轻松利用这些程序入侵个人或组织。

    - **灰帽黑客**：灰帽黑客像黑帽和白帽黑客一样使用 `Kali Linux`。

    - **计算机爱好者**：这是一个非常通用的术语，任何乐于了解更多计算机和网络的人都可以使用 `Kali Linux` 系统来学习更多关于网络、信息技术和常见漏洞的知识。


    ## 黑客攻击过程


    `Kali Linux` 作为一种黑客平台非常受欢迎。“黑客”一词并不总是负面的，因为它也被用于除利用之外的各种其他工作。通过收集有关使用 `Kali Linux`
    进行黑客攻击的大量知识，你可以学习如何进行漏洞检查，并在你想选择伦理黑客作为职业选择时，学习如何修复它们。使用 `Kali Linux` 进行攻击的过程与通用的黑客过程相似，即黑客尝试进入组织或公司的服务器，从而获得对存储在服务器中的数据的所有形式的访问。攻击过程可以分为五个不同的步骤。


    ### 1. 侦察 (Reconnaissance)

    这被认为是开始黑客过程的第一步。在这一步中，黑客倾向于使用所有可用手段收集有关目标系统的各种形式的信息。它包括多个阶段，如目标识别、确定目标 IP 地址范围、可用网络、`DNS`
    记录等。简单来说，黑客收集网站或服务器的所有联系方式。黑客可以通过使用各种形式的搜索引擎（如 `maltego`）、研究目标系统（例如服务器或网站），或利用如
    `HTTPTrack` 等其他工具下载完整网站以供后续阶段进行枚举来实现这一目标。在黑客完成所有这些步骤后，他就可以确定员工姓名、员工职位以及员工指定的电子邮箱地址。


    ### 2. 扫描 (Scanning)

    在收集了关于目标的所有形式的信息后，黑客开始第二阶段，即扫描。黑客在这一阶段利用多种形式的工具，如拨号器、端口扫描器、网络映射器、漏洞扫描器等。由于 `Kali
    Linux` 预装了大量的工具，黑客在这一阶段甚至不会遇到任何困难。黑客试图寻找有关目标系统的信息，这些信息实际上有助于推进攻击，例如 IP 地址、用户帐户和计算机名称。当黑客完成基础信息收集后，他们开始寻找目标系统内部其他可能的攻击途径。黑客可以从
    `Kali Linux` 中选择多种用于网络映射的工具，如 `Nmap`。黑客试图寻找自动邮件回复系统，或者仅仅根据他们收集的信息进行判断。黑客移动到下一步，包括就各种查询向公司员工发送电子邮件，例如向公司的人力资源部门发送关于职位空缺的详细查询。


    ### 3. 获取整体访问 (Gaining overall access)

    在涉及黑客攻击时，这一阶段被认为是最重要的一阶段。在这一阶段，攻击者尝试创建目标网络蓝图的设计。它是使用黑客收集的所有相关信息创建的。在黑客完成枚举和扫描阶段后，接下来的步骤是获取目标网络的访问，这完全基于收集的信息。可能会出现黑客想要使用钓鱼攻击的情况。他可能会为了保险，使用非常简单的钓鱼攻击来获取访问。黑客可以决定从组织的
    IT 部门进入目标系统。


    攻击者可能知道公司最近招聘了人员，这有助于加速程序。对于钓鱼攻击，黑客可以使用特殊程序使用公司 CTO 的真实邮箱地址发送钓鱼邮件，并将邮件发送给所有技术人员。用于钓鱼的邮件将包含一个网站，该网站有助于收集登录所需的用户
    ID 和密码。黑客还可以使用其他选择，如手机 App、网页邮箱或其他平台向用户发送钓鱼邮件，然后要求个人使用其提供的凭据登录一个新的 Google Google
    门户网站。


    当黑客决定使用此类技术时，他们有一种在系统后台运行的特殊类型程序，称为 `Social Engineering Toolkit`（社会工程工具包）。攻击者利用它在通过
    `bitly` 或 `tinyurl` 掩盖服务器地址后直接向用户发送带有服务器地址的电子邮件。攻击者还可以使用其他方法获取系统访问，例如在 `PFD` 格式的文件中创建一个反向
    TCP/IP shell，该文件可以使用 `Metasploit` 创建。攻击者还可以利用缓冲区溢出进行攻击，这些攻击基于会话的堆叠或劫持，最终导致对目标服务器的整体访问。


    ### 4. 维护服务器访问权限 (Maintaining the access to the server)

    在黑客获取目标服务器的访问后，他将尝试保持对服务器的访问，并确保安全以便未来的利用和攻击。当黑客获取整个系统的访问后，他可以将被劫持的系统作为自己的个人基地，并用它对其他系统发动其他多次攻击。当黑客获取目标系统的访问并最终拥有它时，被劫持的系统被称为僵尸系统。黑客获得了一系列全新的电子邮件地址和帐户，并可以从同一个域名开始使用这些帐户测试其他形式的攻击。为了在系统中隐藏，黑客还会尝试创建一个全新的管理员帐户，并试图融入系统。


