    and many more.


    Features of Kali Linux


    Kali Linux is a form of Linux distribution that comes along with a wide range
    of tools which are pre-installed in the distribution. It has been designed for
    the targeted users for ease of functioning. Kali Linux is more or less like the
    other distributions of Linux but it comes along with some added features too that
    help in differentiating it from the others. Let’s check out some of the most unique
    features of Kali Linux.


    *   > > Live system: Unlike the other distributions of Linux, the primary ISO
    image that you are going to download will not only help in installing the OS but
    it can also be used just like a bootable form of live system. In simple words,
    Kali Linux can be used without even installing it in the system by just using
    the ISO image by booting the same. The live system of the distribution contains
    all the tools which are required by the penetration testers. So, in case your
    present system is not running on Kali Linux OS, you can easily use it by inserting
    the USB device and then reboot the same for running Kali Linux on your system.


    *   > > Forensics mode: While performing any kind of forensic related work on
    the system, generally the users want to avoid any form of activity which might
    result in data alteration on the system which is being analyzed. Unfortunately,
    most of the modern-day environments of desktop tend to interfere with this form
    of objective and tries to auto-mount any form of the disk which it detects. In
    order to avoid this form of behavior, Kali Linux comes with the forensics mode
    which can be enabled from the menu of reboot and it will result in disabling all
    such features. The live system of Kali Linux turns out to be so useful only for
    the purpose of forensics as it is readily possible to reboot any system of computer
    into the system of Kali Linux without even accessing or doing any kind of modification
    in the hard disks.


    *   > > Customized Kernel of Linux: Kali Linux is well-known for providing customized
    version of the recent kernel of Linux which is based on the latest version of
    Debian Unstable. This helps in ensuring solid support for hardware, precisely
    for the wide collection of wireless devices. The kernel of Linux gets patched
    with the support for wireless injection as some of the assessment tools regarding
    wireless security tends to rely on this form of feature. As most of the hardware
    devices need updated files of firmware, Kali Linux comes with the feature of installing
    the files by default along with all the firmware updates which are available in
    the non-free section of Debian.


    *   > > Trustable OS: The users of this security distribution wants to know that
    whether or not it can be trusted and as it has been developed plain sight, it
    allows anyone to easily inspect the codes of the source. Kali Linux has been developed
    by a very small team of developers who always follow the required practices of
    security. The developers also upload the source packages in signed format.


    *   > > Customizable: Each and every penetration tester has their own way of working
    and might not agree with the default configuration of the OS. Kali Linux is fully
    customizable which allows the users to customize the same according to their need.
    There are also various forms of live-build techniques that can be found online
    that helps in modifying the OS, install several other supplementary forms of files,
    run the arbitrary commands, install any other required packages and many more.
    The users can also customize the way in which the distribution functions.


    Chapter 8: Installation of Kali Linux


    If you are thinking about pursuing information security for your career, the primary
    thing that you require is to have an operating system which is focused only on
    system security. With the help of a proper operating system, you can easily perform
    various forms of tedious and time-consuming jobs very easily and efficiently.
    In the present situation, there are various OS available which are based on Linux.
    Out of the several distributions that can be found today, Kali Linux is regarded
    as the best choice for the purpose of information security and penetration testing.
    It is being widely used by the professional penetration testers and the ethical
    hackers for performing various activities related to their field along with the
    assessment of network security.'
