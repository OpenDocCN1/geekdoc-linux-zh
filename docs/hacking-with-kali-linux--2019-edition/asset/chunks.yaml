- fmt: '

    Getting a VPN is not that tough and you can get it for yourself depending on your
    needs. You can start by creating a VPN server for yourself or you can also VPN
    server. In case you want to create a VPN for your workplace you can do that as
    well. However, in most of the cases, the use of VPN can be found for the surfing
    of those contents which are restricted according to the geography of an area such
    as for torrent which has been banned for many regions and countries. You can download
    VPN online if you require it only for bypassing the restrictions.


    # How does VPN work?


    When you connect any device such as tablet, smartphone or PC with the VPN, your
    system of device will start imitating like the local network of the VPN. The traffic
    of the network will be sent through a secure form of connection directly to the
    VPN. As the system of the user starts behaving like it is from the same network,
    the user can easily access all the resources from the local network when the user
    is seating at some other point of the world. You can also use VPN for imitating
    as if you are at the same location as of the VPN network. Such a feature gets
    into play at the time of accessing the websites which are geo-restricted.


    As you start surfing the internet after getting connected with your desired VPN,
    your device will be establishing connection with the website through the connection
    of the VPN which stays encrypted throughout the connection. The VPN will be carrying
    forward your request to the website server and will also bring back the response
    via the same channel.


    # VPN and its uses


    VPN has turned out to be a hot topic in the recent years, especially after the
    restriction of various websites and contents according to the geography of an
    area. VPN can be used for various jobs. Let’s have a look at some of the most
    basic uses of VPN.


    - You can access your business network at any time while you are on the move.
    VPN is being used by all the travelers who need to travel around for the purpose
    of business. Such people need to access the resources of their business network.
    VPN can be used for business network access along with access of the local network
    resources at the time of travelling. The local network resources are not needed
    to be exposed to the internet directly and thus it helps in improving the all-round
    security of the connection.

    - You can also use VPN for accessing your home-based network while you are travelling.
    For this, you will need to create a VPN for accessing your personal network while
    travelling. This will allow you to access a kind of remote desktop access which
    is possible directly over the internet with the use of VPN. The users can use
    this feature for sharing the local area files, for playing online games by imitating
    that your device is also on the similar network as of the VPN.

    - You can use VPN for hiding your activities of browsing along with ISP. Suppose
    you are using a Wi-Fi network which is public in nature. When you browse anything
    by using such network, the websites which are not of HTTPS nature will be easily
    available for all those users who are also using the same network in case they
    know how to carry on such activities. While using public Wi-Fi, it is always safe
    to hide all your activities of browsing as it also provides a great amount of
    privacy on the network. VPN can be used for such purposes. Anything that you request
    over the internet will be passing through the VPN connection and thus providing
    you great amount of privacy. This technique is also useful for the purpose of
    bypassing the connection monitoring by the ISP.

    - VPN is widely used today for the purpose of bypassing of censorship which can
    be found widely over the internet. With the use of VPN, you can use the firewall
    of the local area network and then access the internet with the firewall of the
    VPN network.

    - You can browse all those websites which are geo-blocked with the help of VPN.
    VPN can help in easily accessing all those websites which are restricted for several
    regions and countries. You can also use VPN for watching online streaming of media
    when you are not in your country like Hula, Netflix and several others. VPN is
    also used for file transfers.


    # Chapter 15: Firewall


    As the rate of cyber crime tends to increase day by day which has turned out to
    be a threat for most of the businesses all over the world, firewall security is
    the ultimate thing that can help for securing your organization. The term firewall
    can actually be compared with a physical form of wall which can help in preventing
    all forms of unwanted parties across it. Firewall security in the world of computer
    works like a network device which helps in blocking various forms of network traffic
    and thus creates a huge barrier between the untrusted and trusted form of networks.
    It is also relatable to the physical walls in the sense that it tries to block
    the spread of computer attacks.


    ## Firewall and its types


    With the increase in the percentage of cyber attacks, the types of firewall are
    also evolving with time. There are several types and forms of firewalls that can
    be found today. Let’s have a look at some of them.


    ### Stateful firewall


    Stateful firewall is a type of firewall which is somewhat intelligent by nature.
    It helps in keeping a detailed track of all the connections which are in the active
    state to make sure that the user can easily customize the firewall management
    rules in a way which will allow the return packets which are in real a part of
    the established form of connection. However, this form of wall cannot differentiate
    in between the bad and good form of network traffic. It comes with prevention
    form intrusion followed by a complete blockage of the harmful web attacks.


    ### Packet filtering firewall


    This form of firewall is somewhat similar to that of the stateful firewall. It
    comes with various rules for the security of firewall and it comes with the capability
    of blocking that traffic of internet which is based on the port numbers, IP addresses
    and IP protocol. The only bad thing about this type of firewall is that it allows
    all forms of network traffic including the ones which can actually call about
    an attack. In such cases, the users of such firewall require intrusion prevention
    with firewall security. By this method, it will be able to filter out the bad
    and good web traffic. Packet filtering firewall cannot also differentiate between
    the authentic form of return packet and the one which imitates the actions of
    a legitimate data packet. So, it is evident that the packet filtering form of
    firewall will be allowing all forms of return packets within your network.


    ### Application-aware firewall


    This form of firewall is capable of understanding the different forms of protocols
    and also defines the same for the purpose of addressing the particular sections
    of the protocol by the signatories or rules. It helps by providing a flexible
    form of firewall protection for the systems of computers. It also permits the
    rules to be both particular and comprehensive at the same time. It helps in improving
    the overall functioning of the deep packet form of inspection, however, there
    are certain types of attacks which might not be noticed by this firewall because
    the routines defining of the firewall is not strong enough for managing the actual
    traffic variations.


    ### Deep packet inspection

