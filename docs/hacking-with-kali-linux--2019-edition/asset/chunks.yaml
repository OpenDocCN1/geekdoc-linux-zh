    No matter what kind of project it is, for every successful project planning is
    of utmost importance. It provides the ethical hackers with the opportunity of
    thinking about what are the things that need to be done, set the goals which are
    to be reached and also for the assessments of risks for evaluating how to carry
    out a complete project. There are various factors which are considered by the
    ethical hackers before carrying out a project of ethical hacking. The list of
    factors includes culture, policies of security, laws, regulations, requirements
    of the industry and best practices. All of these factors play an important role
    in the process of decision making when it comes to the initiation of ethical hacking.


    The phase of planning in ethical hacking will be having an overall influence on
    how the process of hacking is being performed, the information which is collected
    and shared and will also be directly influencing the integration and delivery
    of the results into the program of security. The planning phase is the very first
    step and will be describing most of the details about the controlled attack of
    hacking. It will also be answering all forms of questions regarding hacking such
    as how the process of ethical hacking is going to be controlled and supported,
    what are the basic actions which needs to be performed and for how long will the
    process go on.


    ## Reconnaissance


    It is the process of searching for all those information which are freely available
    for assisting in the process of attack. This whole process can be as easy and
    simple as just using a `ping` or browsing the various newsgroups which are available
    on the internet for searching that information which is leaked by the employees
    or as tough and messy as digging through a huge trash of letter or receipts. This
    process can also include several other processes such as phone tapping, social
    engineering, network tapping and also data theft. The process of information searching
    will be limited only to the extent to which the organization and the ethical hacker
    will want to go for the purpose of recovering all the required information which
    they are looking out for.


    The phase of reconnaissance introduces the deep relationship in between the tasks
    which needs to be completed and all those methods which will be needed for protecting
    the information and assets of the organization.


    ## Enumeration


    It is also known as vulnerability or network discovery. Enumeration is the process
    of obtaining all those information which is available readily from the system
    of the target, networks and application which are used by the target. It is also
    to be noted that the phase of enumeration is the actual point where the thin line
    between malicious attacks and ethical hacking gets blurred very often as it is
    very easy and simple to go outside the dedicated boundaries which have been outlined
    in the original plan of attack. For the purpose of creating a clear picture of
    the environment of an organization, various techniques and tools are being used
    which are readily available. These available tools include `NMap` and port scanning.
    However, it is very easy to collect all the required information, it is very difficult
    to make sure of the value of information which is available in the hands of the
    hacker.


    At the very first glance, the process of enumeration seems to be very simple in
    which data is collected then evaluated collectively for establishing a proper
    plan for more searching or building up a detailed matrix for the analysis or vulnerability
    phase. However, this phase is the actual phase in which the ability of ethical
    hacker in taking logical decisions plays a very important role.


    ## Analysis of vulnerability


    For the purpose of effectively analyzing all the data, an ethical hacker needs
    to employ a pragmatic approach which is logical in nature as well. In the phase
    of vulnerability analysis, all the information which has been collected is compared
    with all the known forms of vulnerabilities in the practical process. Any form
    of information is useful in the process, no matter from where it originates or
    what the source is. A small pinch of information can also help in finding out
    some new sort of vulnerability in the system and might also lead to several other
    discoveries of vulnerabilities which have not been found yet. The known form of
    vulnerabilities, service packs, incidents, updates along with various hacker tools
    helps in properly identifying the point of attack. The internet provides the ethical
    hackers with a huge amount of information which can be associated very easily
    with the system architecture along with weak and strong points in a system.


    ## Exploitation


    A considerable amount of time is spent for the purpose of evaluating and planning
    an ethical hack. It is very obvious that all of these planning will lead to some
    sort of attack. The level of exploitation of a system can be as simple as running
    a very small tool in the system or as tough as a collection of many complex steps
    which needs to be executed in a proper way for gaining access to the system. The
    process of exploitation can be broken into a collection of subtasks which can
    be either one single step or a collection of various steps. As each and every
    step is performed, a process of evaluation takes place which ensures that the
    outcome which has been expected is met. Any form of divergence from the plan of
    attack can be graded into two parts:


    - **Expectation**: Are the expected results of exploitation met or the results
    are conflicting with the assumptions of the organization?

    - **Technical**: Is the target system behaving in a manner which is not at all
    expected, which is actually having an impact on the system exploitation and the
    system engagement in total?


    ## Final analysis


    Although the phase of exploitation comes with a huge number of validations and
    checks for ensuring the success of the hack, one last final analysis is needed
    for categorizing the system vulnerabilities in accordance to the exposure level
    and also for assisting in the drawing up of a plan for mitigation. The phase of
    final analysis links up the exploitation phase and the deliverable creation. A
    comprehensive image of the complete attack is needed for the construction of a
    bigger size picture of the current posture of the security environment of an organization
    and also for expressing the vulnerabilities clearly.


    ## Deliverables


    Deliverable communicates with the test results in a variety of ways. Some of the
    deliverables are concise and short in nature which only provides the vulnerabilities
    list along with the ways in which it can be mended whereas, the other form of
    deliverables can be detailed and long which will provide a list of the probable
    vulnerabilities in a system which comes with the description regarding how the
    vulnerabilities were found, how they can be exploited, the results of having such
    vulnerabilities within the system and how to fix the situation. This phase is
    actually used by an ethical hacker in conveying his hack results to the organization.
    It can also be the case if the deliverables do not actually frighten the administrators,
    the test is considered as a fail.


    # Chapter 3: Cyber Security


    ![img](images/00008.jpg)


    In this world of today where technological innovations are taking place every
    day, the potential threats of cyber attacks are also increasing in equal pace.
    Cyber security plays a deep role in securing the information and data of the systems
    and networks in today’s world of vulnerability. Cyber security is nothing but
    the employment of various tools and technologies for the purpose of securing the
    networks, programs, system data and network from the potential attacks, damages
    and various forms of unauthorized access. Cyber security is also known as security
    of information technology.

