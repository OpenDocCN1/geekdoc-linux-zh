  trans: '

    大多数组织和机构，如军事、政府、医疗以及金融实体，在其计算机系统和可以在线找到的数据库中存储了大量的数据。在大多数情况下，存储在服务器和数据库中的信息本质上是高度敏感的，一旦泄露可能会给相关组织带来严重麻烦。未经授权访问组织的系统和数据库会导致数据泄露以及对组织安全基础设施的破坏。


    被攻击的组织可能会丢失所有形式的敏感数据并完全失去对系统的访问权限。随着网络攻击数量日益增加，特别是涉及国家健康和安全的组织需要采取一些严肃措施来保护所有形式的敏感数据。网络安全是帮助组织保护所有数据和服务器的最终选择。


    ## 网络安全与加密


    加密是对通信进行编码的过程，使得只有授权方可以解密通信消息。这是通过使用 `SSL/TLS` 和 `PKI` 协议实现的。加密之所以如此重要，是因为互联网是使用
    `HTTP` 协议构建的。超文本传输协议（`HTTP`）与互联网处于同一时代。`HTTP` 是一种通信协议，允许 Web 服务器和 Web 浏览器以正确的预期的方式进行通信并显示信息。当用户访问网站时，它在浏览器中呈现的样子并不是其真实面。网站是由一系列代码构建的，这些代码发送到
    Web 浏览器，然后由浏览器按照网页设计师的想法进行视觉布局。


    `HTTP` 的主要问题是它完全不安全。因此，任何了解该过程的人都可以轻松监控互联网上的 `HTTP` 连接。简单来说，第三方可以轻松读取并操纵客户端与服务器之间通过
    `HTTP` 进行的通信。通过 `HTTPS` 协议提供网站服务，加密技术实际上负责维护通信。`HTTPS` 是 `HTTP` 的安全版本。所有在 `HTTPS`
    上建立的连接在本质上都是加密的。简单来说，通过 `HTTPS` 协议进行的任何形式的通信都是高度安全的。加密防止第三方对通信进行监视。如果你从事在线业务并需要获取客户的财务及个人信息，请确保您的网站已加密，以便您的客户在交换信息时不会面临风险。


    ### 加密过程是如何工作的？


    当 Web 浏览器访问带有 `SSL` 证书的网站时，加密过程开始。Web 服务器和浏览器进行被称为`SSL 握手`的操作。在初步阶段，Web 浏览器验证网站上安装的
    `SSL` 证书本质上是合法的，并且是由受信任的认证机构颁发的。当 Web 浏览器确保证书是合法的后，它开始与服务器协商加密连接的条款。


    涉及加密时，主要两对密钥。第一种是非对称密钥对，由私钥和公钥组成。这些密钥对于加密主体没有功能，但它们被用于身份验证。当 Web 浏览器测试网站 `SSL`
    证书的真实性时，它会确保被质疑的 `SSL` 证书实际上是公钥形式的所有者。它通过使用公钥加密一小包数据来实现这一点。如果 Web 服务器能够使用相应的私钥解密数据包并将其发回，则证明该服务器是公钥的所有者，一切被标记为已验证。如果
    Web 服务器无法解密数据包，则服务器的证书被视为“不可信”。


    另一对密钥是会话密钥。这种密钥在验证了 `SSL` 证书的真实性并协商了所有加密条款后生成。虽然公钥只能用于加密而私钥用于解密，但会话密钥可以同时用于加密和解密两种功能。与非对称形式相比，会话密钥尺寸较小，本质上也不那么安全。然而，会话密钥足够执行这两种功能。服务器和
    Web 浏览器在剩余的通信中使用会话密钥。离开网站后，使用的会话密钥将被丢弃，并为新的访问生成全新的会话密钥。


    ## 常见的网络攻击类型


    随着技术的进步，网络攻击日益增加。今天可以发现各种类型的网络攻击，其中一些最常用，例如钓鱼攻击、恶意软件、`XSS` 等。让我们来看一些常见的网络攻击类型。


    ### 恶意软件


    恶意软件是有害软件的形式，用于访问受害者的系统。恶意软件也可以称为病毒。一旦恶意软件进入受害者系统，它可能会导致一系列破坏，从获得系统的控制控制到监控各种操作、窃取敏感数据，并导致系统完全关闭。攻击者使用各种方法向目标系统插入恶意软件。


    ### 钓鱼攻击


    今天收到带有各种链接和附件的电子邮件是非常常见的事情。这种通过电子邮件发送有害链接和附件的行为被称为钓鱼攻击。在钓鱼攻击中，攻击者向目标发送看起来像可靠的电子邮件。大多数邮件都带有链接和附件，点击这些内容会在系统用户完全不知情的情况下在系统内安装恶意软件。某些钓鱼链接还可能引导用户进入新网站，该网站可能会要求银行和信用卡详情等机密数据。此类网站实际上是攻击者用于在目标系统中安装恶意软件的陷阱。


    ### XSS


    跨站脚本或 `XSS` 攻击被用于直接针对网站的用户。它与 SQL 注入攻击有些相似，也涉及向网站中注入有害代码。但在 `XSS` 攻击的情况下，网站本身并没有受到攻击。在
    `XSS` 攻击中，注入网站的恶意代码仅在用户的浏览器中运行，并用于窃取用户名、密码、银行详情等许多敏感数据。


    ## 恶意软件及其类型


    恶意软件是恶意软件的形式，用于访问受害者的系统。网络犯罪分子设计恶意软件可用于窃取数据、破坏计算机功能、绕过访问控制等。


    ### 恶意软件的类型


    今天可以发现各种类型的恶意软件。让我们来看看它们。

