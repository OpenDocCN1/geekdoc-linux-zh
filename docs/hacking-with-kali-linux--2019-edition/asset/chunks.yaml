- fmt: "\nThe final method which comes with TCP scanning is the zombie scanning. The\
    \ prime goal of zombie scanning is to map all the open form of ports on a system\
    \ of remote nature without even producing any form of evidence which you have\
    \ had an interaction with the system. The principles on which the functioning\
    \ of zombie scanning depends are complex in nature. You can carry out zombie scanning\
    \ by following these steps.\n\n1. Start by identifying the remote system for the\
    \ zombie. The system which you are going to identify needs to have these characteristics:\n\
    \    - It is in idle form and it doesn’t actively communicate with the other systems\
    \ which are available on the network.\n    - It needs to use an incremental form\
    \ of `IPID` sequence.\n2. Then you will need to send in a packet of `SYN+ACK`\
    \ to the zombie and then record the initial value of `IPID`.\n3. Send in a packet\
    \ of `SYN` along with a source of the spoofed IP address of the system of zombie\
    \ to the target system of scan.\n4. Depending on the port status on the target\
    \ scan, any of the following will happen:\n    - In case the port is in open state,\
    \ the scan target will be returning a packet of `SYN+ACK` to the host of zombie\
    \ which it thinks sent out the original request of `SYN`. In such a case, the\
    \ host of zombie will be responding to the unsolicited form of `SYN+ACK` packet\
    \ with a packet of `RST` and then increment the value of `IPID` by one.\n    -\
    \ In case the port is in the closed state, the scan target will be returning a\
    \ response of `RST` to the host of zombie which it thinks sent out the original\
    \ request of `SYN`. The packet of `RST` will be soliciting no form of response\
    \ from the host of zombie and the value of `IPID` will therefore not be increased.\n\
    5. Send in another packet of `SYN+ACK` to the host of zombie and then evaluate\
    \ the final value of `IPID` of the `RST` response which has been returned. In\
    \ case the value has been increased by one, the port on the target scan is closed\
    \ and in case the value has been increased by two the port on the target scan\
    \ is in open state.\n\nFor performing a zombie form of scan, an initial request\
    \ of `SYN/ACK` is required to be sent to the system of zombie for the purpose\
    \ of determining the current value of `IPID` within the returned packet of `RST`.\
    \ A spoofed packet of `SYN` is then sent out to the scan target along with a form\
    \ of source IP address of the system of zombie. As the zombie actually did not\
    \ send out the initial request of `SYN`, it will be interpreting the response\
    \ of `SYN/ACK` as being unsolicited and then send a packet of `RST` back to the\
    \ system of target and thus increasing the value of `IPID` by one. At the final\
    \ stage, another packet of `SYN/ACK` needs to be sent to the system of zombie\
    \ which will return a packet of `RST` and then increase the value of `IPID` by\
    \ one.\n\n# Chapter 13: Penetration Testing\n\n![img](images/00004.jpg)\n\nEach\
    \ and every infrastructure of IT comes with some weak points which can ultimately\
    \ lead to some serious attack and can be used for the purpose of stealing and\
    \ manipulating data. Only one thing can be done in such situations which can help\
    \ in preventing the hackers from entering the system. You need to perform regular\
    \ checks of the infrastructure of your security and make sure that there is no\
    \ form of vulnerabilities present in the structure. Penetration testing helps\
    \ in finding out the vulnerabilities along with the several weak points in a system.\
    \ As the owner or administrator of a network, they can always have some advantage\
    \ over the hackers as they are bound to know the topology of network, the components\
    \ of infrastructure, the services, the probable points of attack, the executed\
    \ services and many more.\n\nPenetration testing is done within a real and secure\
    \ environment so that in case any vulnerability is found, you can mend the same\
    \ and secure the system.\n\n## Penetration testing in details\n\nAs the name goes\
    \ by, penetration testing is the process of testing a system to find out whether\
    \ penetration by any third party is possible in the system or not. Penetration\
    \ testing is often mixed up with ethical hacking as both are somewhat similar\
    \ in features and functioning. The motive are also the same but a very thin line\
    \ differentiates the two. In penetration testing, the tester scans for any form\
    \ of vulnerability in the system, malicious form of content, risks and flaws in\
    \ the concerned system. Penetration testing can be performed either in an online\
    \ network or server or a computer system as well. Penetration testing comes with\
    \ the goal of strengthening the security system of an organization for the motive\
    \ of properly defending the security of a system. Unlike hacking, penetration\
    \ testing legal in nature and is done with all forms of official workings. If\
    \ used in the proper way it can do wonders. Penetration testing can be considered\
    \ as a significant part of ethical hacking.\n\nPenetration testing needs to be\
