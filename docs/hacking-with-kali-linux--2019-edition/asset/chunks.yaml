  trans: "\n\n![](img/cover.jpg)\n![img](img/cover.jpg)\n![img](img/00006.jpg)\n\n\
    # 使用 Kali Linux 进行黑客\n\n初学者计算机网络黑客、加密、网络安全与渗透测试实用指南。\n\nVPN 服务、防火墙和 Linux 命令行的秘密\n\
    \n## 目录\n- 介绍\n- 第 1 章：黑客基础\n    - 不同类型的黑客\n    - 常见的黑客工具\n    - 黑客技术\n- 第 2 章：什么是道德黑客？\n\
    - 第 3 章：网络安全\n    - 网络安全与加密\n    - 常见的网络攻击类型\n    - 恶意软件及其类型\n- 第 4 章：Linux 架构\n\
    - 第 5 章：Linux 操作系统基础\n- 第 6 章：基础 Linux 命令\n- 第 7 章：Kali Linux 的特性以及为何在黑客世界中如此重要\n\
    - 第 8 章：Kali Linux 的安装\n- 第 9 章：Kali Linux 的应用与使用\n- 第 10 章：Kali Linux 的不同工具\n\
    - 第 11 章：如何使用 Kali Linux 进行攻击？\n- 第 12 章：使用 Kali Linux 进行端口扫描的技术\n- 第 13 章：渗透测试\n\
    - 第 14 章：VPN\n- 第 15 章：防火墙\n- 第 16 章：密码学\n- 结论\n\n## 介绍\n看到大家对学习 Kali Linux 的基础知识如此感兴趣，我非常高兴。Kali\
    \ Linux 是今天最有效的软件之一。它也可以被视为所有计算机和网络从业者的福音。\n\nKali Linux 承担着安全审计软件的工作，并在网络和黑客的各个方面提供帮助。Kali\
    \ Linux 附带各种与信息和安全相关的任务，如反向工程、渗透测试和安全研究。计算机取证也是 Kali Linux 的一部分。Kali Linux 提供的每一项服务都经过认证，并具有全方位的控制力以及更广泛的认证范围。\n\
    \nKali Linux 属于 Linux 发行版家族。网络安全是该 Linux 发行版要关注的问题。如今许多公司都借助 Kali Linux 来检查和追踪自身的漏洞，以确保其基础设施的\
    \ 100% 安全。它是一个开源程序，因此完全免费的。不仅如此，它还是完全合法的，可以用于企业或组织中的各种场景。\n\n## 第 1 章：黑客基础\n![img](img/00009.jpg)\n\
    \n黑客攻击（Hacking）无非是指对网络或计算机进行未经授权的侵入，这种行为由被称为“黑客（hackers）”的攻击者执行。攻击者会试图攻击那些容易受到威胁的系统。他们时刻睁着窥探的眼睛，到处寻找漏洞。他们可以个人行动，也可以以小组形式工作。不仅如此，黑客还可能作为组织的一部分运作，其目的是破坏其他组织的功能。大多数时候，他们试图更改组织的系统，并目标攻击安全基础设施以攻破信息并获取访问权限。然而，黑客不仅作为攻击者工作，还利用他们的技能发现系统中的弱点以及各种漏洞。此举也是为了发现并修复弱点，以防止所有形式的恶意攻击进入系统。\n\
    \n### 不同类型的黑客\n黑客世界中存在多种类型的黑客，他们执行不同的功能。黑客的类型有助于定义系统与试图攻击这些系统的黑客之间的关系。最常见的黑客类型有：\n\
    \n- **黑帽黑客（Black Hat Hackers）**：“黑帽”一词源于旧的西部电影，在电影中反派通常戴着黑帽子。黑帽黑客作为个体行动，试图在未经授权的情况下访问组织或网络的系统，其目的是出于各种恶意目的利用安全基础设施。这种类型的黑客在破坏目标时没有获得任何授权或许可。他们试图通过通过破坏安全系统的基础设施、关闭系统或更改网站或网络的主要功能来造成损害。黑帽黑客的主要意图是获取完全访问权限或窃取财务信息、获取各种密码或获取其他形式的个人数据洞察。\n\
    \n- **白帽黑客（White Hat Hackers）**：白帽黑客是第二类黑客，但他们扮演的是“好人”。白帽黑客与各种组织合作，目的是加强任何系统的安全性。白帽黑客拥有各种许可来接触目标，并在提供的规则边界内对目标进行渗透测试。白帽黑客也被称为“道德黑客（ethical\
    \ hackers）”。道德黑客精通这一领域，拥有各种形式的用于黑客攻击的伦理工具和技术。他们使用特殊的方法来保护组织的信息系统。与黑帽黑客相反，道德黑客在获得合法许可执行操作后，会利用网络的安全系统并检查后门。道德黑客总是指出他们从组织系统中挖掘出的各种所有形式的漏洞，以确保这些漏洞得到修复，从而防止被恶意攻击者利用。\n\
    \n- **灰帽黑客（Grey Hat Hackers）**：灰帽黑客以黑帽黑客相同的方式获取组织和网络安全系统的访问。但灰帽黑客在执行此类行动时并没有任何形式的恶意意，并将漏洞和漏洞披露给执法机构或各种情报机构。灰帽黑客通常在互联网上冲浪，并入侵计算机系统，以通知包含需要立即修复的各种漏洞的网络或系统所有者。灰帽黑客也可以通过提供缺陷信息来向被入侵的系统索要费用。\n\
    \n### 常见的黑客工具\n为了完成黑客攻击，黑客会实施各种技术。让我们来看看其中一些。\n\n"
