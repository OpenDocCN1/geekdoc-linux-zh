    hackers for disrupting the functionality and control of a system from its actual
    owner or administrators. There are various ways in which rootkits can be installed
    in the system of the victim. The most common way of installing rootkit is by implementing
    phishing attacks along with social engineering. Once the rootkits have been installed
    in the system of the victim, the attacker gains access to the system secretly
    and controls the overall functioning with which they can easily steal confidential
    data and information and can also shut down a system completely.


    *   > > Keyloggers: This is a very special type of tool which has been designed
    for recording and logging each and every key pressed on the victim system. The
    keyloggers record the stroke of the keys by staying attached to the Application
    Programming Interface or API. It tracks the key strokes when anything is being
    typed by using the keyboard in a system. The files which are recorded are then
    saved which contains various forms of information such as details regarding website
    visit, usernames, the record of opened applications, screenshots, bank details
    and many more. The keyloggers are also capable of capturing the personal messages,
    credit card details, passwords, mobile numbers and various other details which
    are generally typed in a system. The keyloggers generally arrive as a malware
    which allows the cybercriminals to breach all forms of sensitive data.


    *   > > Vulnerability scanner: A vulnerability scanner is used for the purpose
    of classifying and then detecting various forms of weaknesses in a system, network,
    communication system, computers etc. This is one of the most common forms of tool
    which is being used by the ethical hackers for finding out the potential vulnerabilities
    and loopholes and then fixes them up on urgent basis. However, a vulnerability
    scanner can also be used by the black hat hackers for checking the vulnerabilities
    and weak spots within a system and then finding out the proper tool for exploiting
    the same.


    Techniques of Hacking


    There are various techniques which are being used by the hackers for exploiting
    a system.


    *   > > SQL Injection: SQL or structured query language has been designed for
    the purpose of exploiting various forms of data in the database of the victim.
    This form of attack falls under the cyber attack which targets the databases via
    the statements of SQL for tricking the systems. This form of attack is generally
    carried out by the use of website interface which attempts in issuing the commands
    of SQL through a database for hacking the passwords, usernames and other related
    information related to the database. All those websites along with web applications
    which are coded poorly are very much prone to the SQL injection attacks. This
    is because the applications which are based on the web contains various user input
    fields like login pages, search pages, request forms related to support and products,
    comments section and many others which are very much susceptible to the attacks
    and can be very easily hacked by simple manipulation of the codes.


    *   > > DDoS or Distributed Denial of Service: It is a form of hacking attack
    in which the normal traffic of a server is distorted from entering the server
    and floods the traffic of the network. This ultimately results in denial of service
    as it serves just like a traffic jam which clogs the roads and also prevents the
    regular form of traffic from reaching the destination. All the devices of today
    such as IoT devices, computers, mobile phones etc. which connects with the network
    are very much prone to the attacks of DDoS.


    *   > > MAC Spoofing: Each and every form of device which are used by the people
    today come with network interface controller or NIC. It helps the users to connect
    with the network such as with the internet directly. The NIC of each device is
    accompanied with a MAC address which is assigned after various processes of hard
    coding. The MAC spoofing attack is a very deadly form of attack in which the hackers
    hide themselves and their system behind a customized and false MAC address.  This
    reduces the risks on the part of the hackers from getting caught. So, you might
    give access to a new system thinking of it to be absolutely legitimate but it
    might happen that a hacker will hide himself behind a false MAC address which
    you cannot even realize.


    > > By using this technique, the hackers can easily hack internet connection via
    Wi-Fi and can also gain access to all those devices which are connected to each
    other via LAN. The technique of MAC spoofing also leads to several forms of other
    serious crimes in which the hackers steal the identity of someone else and carries
    on with some serious form of data breaching in which someone will be held as guilty
    without even knowing about the actual hacker. However, there are various OS in
    the market today such as MAC and Windows which can easily connect with the LAN
    without using the MAC address.


    Chapter 2: What is Ethical Hacking?


    ![img](images/00005.jpg)


    Ethical hacking is also called as intrusion testing, penetration testing and also
    red teaming. In simple words, it is the controversial technique of finding out
    vulnerabilities and weaknesses in a system simply by imitating the actions and
    intent of the malicious hackers. An ethical hacker is a person or security professional
    who uses his skills for the purpose of various defensive measures on part of the
    administrators of an information system. An ethical hacker is also known as a
    white hat or white hat hacker. By conducting various tests, an ethical hacker
    tries to find out the answers to the following questions:


    *   > > What are the locations, systems or information can the attacker gain access?


    *   > > What will the attacker see before setting his target?


    *   > > What will the attacker do with the information which is available in the
    system?


    *   > > Is anyone able to notice the various attempts made by the attacker to
    gain access?


    The ethical hacker who has been given the job of penetration testing operates
    on the permission along with the knowledge of that organization for which he has
    been assigned the job of defense. There are various cases in which an organization
    will not be informing the security information team about all the activities which
    is going to be carried out by the ethical hacker just for testing the effectiveness
    and concise of the security information team. This whole thing is also known as
    double blind environment. For the purpose of effective and legal operation, the
    organization needs to inform an ethical hacker about all those assets and information
    which are meant to be protected, the potential sources of threats and the limit
    to which the organization will be supporting the efforts of the ethical hacker.


    Process of ethical hacking


    All the ethical hackers follow a strict process in order to get the best usable
    and to the point legal results. Let’s have a look at the processes which are followed
    by the ethical hackers.


