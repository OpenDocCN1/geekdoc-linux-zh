  trans: "\n\n# Kali Linux\n\n完全可定制：攻击性安全工具的开发者知道，并非每个用户都会认同某种模型设计。因此，Kali Linux 的开发方式允许根据用户的需求和喜好进行完全定制。\n\
    \n## 系统要求\n\n为了渗透测试之目的安装 Kali Linux 非常简单。你只需要确保拥有所需的硬件套件即可。Kali Linux 支持 `amd64`、`i386`\
    \ 和 `ARM`。你均需要：\n\n* 安装软件至少需要 `20 GB` 的磁盘空间\n* 至少 `1 GB` 内存\n* 一个 `CD/DVD` 驱动器或虚拟机\n\
    \n## 工具列表\n\nKali Linux 预装了广泛的工具。让我们来看一些最常用的工具。\n\n* `Aircrack-ng`：这是一个用于评估 Wi-Fi\
    \ 网络安全性的工具套件。它的目标是与 Wi-Fi 相关的某些核心领域。\n\n    1. **监控**：它可以帮助捕获数据包，并将数据导出到文本文件中，以便后期由第三方工具进行处理。\n\
    \    2. **攻击**：它通过数据包注入过程，帮助进行重放攻击、伪造访问点、取消认证以及各种攻击。\n    3. **测试**：它可以帮助检查 Wi-Fi\
    \ 卡以及驱动程序的其他功能。\n    4. **破解**：它可以帮助破解 `WPA PSK` 和 `WEP`。\n\n* `Nmap`：Nmap 也称为\
    \ Network Mapper，是一种开源免费的实用程序，用于网络发现和安全审计。Nmap 使用 `IP` 的原始数据包来确定目标网络上有哪些可用主机、这些主机提供了哪些服务、正在使用什么操作系统、使用了何种防火墙或数据包过滤器以及各种其他特性。许多网络和系统管理员还用它来：\n\
    \n    1. 网络盘点\n    2. 管理服务升级计划\n    3. 监控服务或主机的运行时间\n\n* `THC Hydra`：当你需要破解一个远程认证服务时，可以使用\
    \ THC Hydra。它能够对 50 或更多协议（包括 `HTTP`、`FTP`、`SMB` 和 `HTTPS`）执行极快速字典攻击。它可以轻松用于破解无线网络、Web\
    \ 扫描器、数据包制作工具等。\n\n* `Nessus`：它是一种远程扫描工具，用于检查计算机的安全漏洞。它无法阻止计算机系统存在的任何形式的漏洞，但可以通过运行超过\
    \ 1200 次漏洞检查来轻松嗅出所有漏洞，并在需要进行安全补丁时发送警报。\n\n* `WireShark`：它是一个开源的数据包分析器，任何人都可以免费使用。通过这个工具的帮助，用户可以轻松地查看网络活动，并提供可定制的报告、警报、触发器等功能。\n\
    \n## Kali Linux 的特性\n\nKali Linux 是一种 Linux 发行版，带有发行版中预装的广泛工具。它是针对特定目标设计的，并包含了一些额外功能。\n\
    \n* **Live 系统**：与其他发行版不同，你下载的主镜像镜像不仅可以帮助安装，还可以直接使用。如果你当前的系统没有运行 Kali Linux，可以通过插入\
    \ `USB` 设备轻松地使用它。\n\n* **取证模式**：在执行任何取证相关工作时，用户通常希望避免在系统上产生任何活动。为了避免这种行为，Kali\
    \ Linux 提供了可以从菜单中开启的取证模式。\n\n* **定制版 Linux 内核**：Kali Linux 以提供基于 `Debian` 最新版本的定制内核版本而闻名。这有助于确保对硬件的稳健支持。由于大多数硬件设备需要更新的文件，Kali\
    \ Linux 提供了安装 `Debian` `non-free` 部分可用文件的功能。\n\n* **可信的操作系统**：该安全发行版的用户想要知道它是否可以信赖，由于它是公开透明开发的，它允许任何人轻松检查源码。开发者还以签名格式上传了源码包。\n\
    \n## 第 8 章：Kali Linux 的安装\n\n如果你正在考虑将信息安全作为你的职业，你首要的是一个仅专注于系统安全的操作系统。在适当操作系统的帮助下，你可以非常轻松且高效地完成各种繁琐且耗时的工作。在目前，有多种基于\
    \ Linux 的可用操作系统。在今天可以找到的发行版中，Kali Linux 被认为是信息安全和渗透测试的最佳选择。\n\n"
