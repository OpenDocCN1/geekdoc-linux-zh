    # 常用工具集

    不同的 Linux 发行版使用不同类型的工具来执行各种常见任务，例如系统配置或软件包管理。像 Ubuntu 和 Debian 等发行版使用 `APT` 来管理
    `.deb` 包，OpenSUSE 使用 `.rpm` 包，而 CentOS 和 Fedora 也使用 `.rpm` 包，但它们通过使用一个名为 `yast`
    的工具来管理所有包。在大多数情况下，你选择的发行版最终会是那个带有你所有所需且你所熟悉的工具的发行版。


    ## Linux 安全

    当你开始使用基于 Linux 操作系统的系统时，你就成了自己系统安全的所有者。互联网上充斥着许多想要利用你的系统计算能力来实现个人目标的人。Linux 为用户提供了各种安全选项，帮助用户保护其系统并根据需要对其进行调整。


    ## 查找你的文件夹和文件

    Linux 系统中的一切内容都以目录的形式存在。在 Linux 中，文件夹被称为目录（directory）。Linux 操作系统使用一个平衡良好的各种嵌套目录树形结构，以组织的方式存储所有文件。最高层级的目录被称为根目录（root
    directory），它被指定为一个单一斜杠 `/`。在 Windows 操作系统中，你会遇到各种驱动器和磁盘，但在 Linux 操作系统中并非如此。根目录下面还有许多其他子目录。大多数基于
    Linux 的系统都带有名为 `var` 和 `lib` 的目录，以及根目录树下的许多其他目录。


    `lib` 目录包含系统库，而 `var` 目录包含系统中各种可能发生的文件，例如邮件消息和日志。Linux 操作系统的目录也可以进入其他目录内部。


    ## 用户与权限

    Linux 操作系统使用了一套非常强大的系统来管理用户及其权限，以确保只有正确的人才能访问系统文件。作为你 Linux 系统的所有者，你可以为每个目录设置用户和权限。Linux
    的文件访问系统包含三类。


    ### 用户 (Users)

    用户账户通常分配给个人，也可以分配给需要访问系统文件的应用程序。你可以根据需要为系统提供任意数量的用户访问权限。


    ### 组 (Groups)

    组是一个一个或多个用户的集合。组是一次性向多个用户授予相同权限的极佳方法，无需为每个用户单独设置权限。当你创建一个账户时，它会被分配到一个默认组，该组的名字与用户名相同。用户可以加入他们想要加入的任意组。属于某个组的用户将获得该特定组被授予的所有权限。


    ### 所有人 (Everyone)

    这一类别针对组和用户之外的所有所有人。当某人在未以特定用户身份登录系统的情况下访问系统文件时，他们属于“所有人”这一类别。


    紧随用户之后的下一个重要事项是权限。Linux 系统中的每一个目录和文件都带有三个可能的访问级别。


    -   **读 (Read)**：所有具有读取权限的文件都可以查看。

    -   **写 (Write)**：所有具有写入权限的文件都可以编辑。

    -   **执行 (Execute)**：所有具有执行权限的文件都可以像应用程序一样被执行或运行。当你启动一个新的脚本或程序时，你就是在开始执行它。


    ## Linux 中的软件安装

    与 Linux 系统中的其他其他事情一样，软件安装也是通过输入并执行特定形式的文本命令完成的。Linux 的大多数发行版都带有软件包管理器，这使得在系统中安装或卸载任何软件变得更加容易。Ubuntu
    和 Debian 等发行版使用 `APT`（高级软件包工具）管理器，而 CentOS 和 Fedora 使用 `YUM`（黄色狗更新修改版）软件包管理器。


    ## 第 6 章：基础 Linux 命令

    Linux 是当今最著名的操作系统之一。然而，Linux 并不是一个完整的操作系统，它是操作系统的内核。Linux 也被视为 UNIX 的克隆。一些最常见的
    Linux 发行版包括 Linux Mint、Ubuntu Linux、Red Hat Enterprise Linux（RHEL）、Fedora 和 Debian。Linux
    主要用于服务器。也可以认为，几乎 90% 的互联网是由 Linux 服务器驱动的。这主要是因为 Linux 作为一个内核是安全、快速且免费的。Windows
    服务器也可以用于互联网，但 Windows 带来的一个主要问题是成本问题。这个成本问题可以通过 Linux 服务器轻松解决。事实上，如今运行在大多数智能手机上的
    Android 操作系统也是由 Linux 内核制作的。


    ### Linux Shell（外壳）

    Linux shell 是一种程序形式，它接收来自系统用户的命令，并将其传输给操作系统进行处理，然后显示结果。Linux shell 是 Linux 操作系统的主要部分。它的发行版有图形用户界面（GUI）版本，但
    Linux 基本上带有一个命令行界面（CLI）。要打开 Linux shell 终端，你需要在 Ubuntu 发行版中按下 `Ctrl+Alt+T`，你也可以按下
    `Alt+F2`，输入 `gnome terminal` 然后按回车。


    ### Linux 命令

    让我们从一些最基础的 Linux 命令开始。


    #### pwd

    当你首次打开终端时，你处于用户的家目录中。为了确切知道你处于哪个目录，你可以使用 `pwd` 命令。它可以帮助给出精确路径，即从根目录开始的路径。根目录无非
    Linux 文件系统的基础。它通常用正斜杠 `/` 表示。用户目录通常看起来像 `/home/username`。


    #### ls

    通过使用 `ls` 命令，你可以轻松知道你所在目录中有哪些文件。你也可以通过 `ls -a` 查看每一个被隐藏的文件。


    #### cd

    你可以使用 `cd` 命令进入目录。例如，如果你在 home 文件夹中并想要进入 downloads 文件夹，你需要输入 `cd Downloads` 然后你就进入
    downloads 目录。你需要注意，此命令是区分大小写的。你还需要按照文件夹的名称完全输入。然而，这种类型的命令会带来某些问题。例如，你有一个名为 Raspberry
    Pi 的文件夹。在这种情况下，当你输入命令 `cd Raspberry Pi` 时，Linux shell 会认为命令的第二个参数是一个完全不同的实体，因此你收到的将只有一条错误消息，提示没有这样的目录。


    在这种情况下，你可以使用反斜杠，即使用命令 `cd Raspberry\Pi`。空格在 Linux 中被视为 `:`。如果你只输入命令 `cd` 并按回车，你将回到家目录。如果你想从一个特定的文件夹返回到上一个文件夹，你需要使用
    `cd..`。命令中的两个点代表返回的请求。


    #### mkdir & rmdir


