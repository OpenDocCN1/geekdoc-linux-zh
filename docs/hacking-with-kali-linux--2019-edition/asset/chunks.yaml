  trans: '

    Kali Linux 被认为是 Linux 家族中领先的发行版，广泛用于安全审计。Kali Linux 是唯一与道德黑客和网络安全相关的操作系统，它预装了多种不同类型的命令行黑客工具，这些工具对于各种信息安全相关任务至关重要。Kali
    Linux 最常用的任务包括应用安全、渗透测试、计算机系统取证以及网络安全。简单来说，Kali Linux 是专为道德黑客设计的唯一且终极的操作系统。


    与道德黑客和渗透测试领域的人出于某些特定原因使用 Kali Linux。Kali Linux 带有超过 600 种渗透测试工具。最棒的部分是 Kali Linux
    是 100% 可定制的。因此，如果你不喜欢当前的 Kali Linux 配置，可以轻松地按照你自己的意进行定制。Kali Linux 的另一个有趣之处是它支持多语言。虽然工具是用英语编写的，但它允许来自所有地区的人使用自己的母语言使用该操作系统。它还支持广泛的无线设备集合。Kali
    Linux 是一个在安全环境中开发的操作系统。让 Kali Linux 如此受欢迎的原因是它是开源软件，而且是免费的。它还带有自定义内核，该内核还可以为了注入目的进行补丁。


    ## 如何安装 Kali Linux？


    在系统中安装 Kali Linux 的过程非常简单直接。用户还可以享受几种安装软件的选项。最优的安装选项有：


    *   使用硬盘安装 Kali Linux

    *   通过创建可启动 Kali Linux USB 启动盘安装 Kali Linux

    *   使用 `VirtualBox` 和 `VMware` 等虚拟化软件安装 Kali Linux

    *   通过与操作系统双引导的过程安装 Kali Linux


    最广泛使用的 Kali Linux 安装选项是使用 USB 驱动器以及使用 `VirtualBox` 或 `VMware`。如果你使用 `VirtualBox`
    或 `VMware`，你需要系统硬盘中至少有 20 GB 的可用空间，并至少有 4 GB 的内存。你还需要 USB 以及 CD/DVD 的支持。


    ### 借助 VMware 安装 Kali Linux


    * 在你想在系统中运行 Kali Linux 之前，你首先需要一个虚拟化软件。在选择虚拟化软件时，现在有很多选择。你可以从从 Oracle 公司安装 `VMware`
    或 `VirtualBox` 开始。安装虚拟化软件后，你需要从应用程序文件夹启动它。


    * 现在，你需要下载 Kali Linux 的安装文件，你可以从 Kali Linux 官方网站的下载页面轻松找到它。你可以选择你认为符合你需求的那个。在下载页的文件旁边，你还会遇到许多用于安全相关工作的十六进制数字。你需要检查将要下载的镜像完整性。你需要检查文件的
    `SHA-256` 指纹，然后将其与 Kali Linux 下载页面上提供的指纹进行对比。


    * 在你下载好 Kali Linux 的安装文件后，你现在需要启动虚拟机。为此，你需要打开 `VMware Workstation Pro` 的主页，然后选择创建一个新虚拟机。创建新虚拟机后，你需要选择
    Kali Linux 的 `iso` 文件，然后选择客户操作系统。你还需要配置虚拟机（在此例中为 Kali Linux）的所有细节。现在，你只需选择 Kali
    Linux 虚拟机，然后点击绿色的电源按钮即可启动 Kali Linux 虚拟机。


    * 虚拟机启动后，会弹出一个菜单，你需要在 `GRUB` 菜单中选择优选的安装模式。你需要选择 `graphical install`（图形安装）。点击 continue（继续）。


    * 接下来的几个屏幕将要求你选择本地化信息，例如你希望安装 Kali Linux 的首语言、你所在的国家以及键盘布局。


    * 一旦你完成了所有所需的本地化信息，安装程序将自动开始为软件安装一些额外的必需组件，并配置与网络相关的设置。组件安装完成后，安装程序将要求你输入主机名和域名以供安装。你需要提供每项适当的信息，以确保软件正确安装并继续安装。


    * 在完成上述所有步骤后，你需要为你的 Kali Linux 机器设置密码，然后点击继续按钮。确保你不要忘记为 Kali Linux 机器设置密码。


    * 当你为 Kali Linux 机器设置密码时，安装程序会提示设置时区，并在定义磁盘分区时暂停设置。机器安装程序将针对机器磁盘的磁盘分区提供四个不同的选择。如果你不确定如何划分磁盘，你可以选择的最简单选项是选择
    `Guided – Use Entire Disk`（引导式 – 使用整个磁盘），它将使用整个磁盘空间并跳过磁盘分区过程。如果你是经验丰富的用户，可以选择手动分区选项以获得更细粒度的配置选项。


    * 你现在需要选择分区的磁盘。然而，对于所有新用户，最推荐的选项是选择将所有文件放在一个分区中。选择完分区磁盘后，选择继续。


    * 现在，你需要确认对主机磁盘所进行的所有更改。请确保不要继续该过程，因为这将擦除磁盘上的所有数据。一旦你确认了分区中的所有更改，Kali Linux 安装程序将开始文件安装过程。这可能需要一段时间，请不要中断过程，因为系统会自动安装所有内容。


    * 一旦安装了所有必需文件，系统将询问你是否要设置网络以获取未来的更新和软件部分。如果你将来打算使用 Kali Linux 的存储库，请确保启用此功能。系统随后将配置相关文件的管理器。


    * 在此步骤之后，系统将要求你安装 `GRUB` 引导加载程序。点击 yes（是），然后选择设备向硬盘上写入启动引导加载程序所需的信息，这对于启动 Kali
    Linux 是必需的。


    * 一旦安装程序完成在磁盘上安装 `GRUB` 引导加载程序，选择 continue（继续）以完成安装过程。随后，它将在最后阶段安装一些文件。


    在你完成所有这些步骤后，Kali Linux 将安装在你的系统中，你可以开始将其用于渗透测试和网络安全。你也可以通过简单创建一个 USB 启动盘，在甚至不在系统中安装软件的情况下直接在系统中使用
    Kali Linux。


    ## 第 9 章：Kali Linux 的应用与用途


