  trans: "\n\n```\n用法: ls [OPTION]... [FILE]...\n列出 FILEs 的信息（默认为当前目录）。\n如果未指定 -cftuvSUX\
    \ 或 --sort，则按字母顺序对条目进行排序。\n\n长选项的强制性参数对于短选项也是强制性的。\n  -a, --all              \
    \    不忽略以 . 开头的条目\n\n...\n```\n\n### 注意\n\n为了保持讨论简洁，本节中的示例仅包含了命令受支持的 `some` 选项。\n\
    \n# 4.2.3. `date` — 显示当前日期和时间\n\n```\ndate\n```\n\n输出：\n\n```\nWed 10 Mar 2021\
    \ 10:33:11 GMT\n```\n\n# 4.2.4. `cd` — 切换目录\n\n要进入一个目录，请使用 `cd` 后后跟该目录的名称。\n\n\
    例如，要进入 `/home/user/Downloads`，请使用：\n\n```bash\ncd Downloads\n```\n\n### 注意\n\n\
    当您登录或打开新的终端窗口时，您将位于您的家目录 — `/home/user`，其中 `user` 是您的用户名。\n\n您可以使用之前 讨论过的 `pwd`\
    \ 命令来验证您当前所在的目录：\n\n```bash\npwd\n```\n\n```\n/home/user/Downloads\n```\n\n##\
    \ 使用不带参数的 `cd`\n\n无论您在文件系统的何种位置，输入 `cd` `不带任何参数` 都会带您回到家目录。\n\n```bash\nuser@cookbook:/usr/share/dict$\
    \ cd\nuser@cookbook:~$\n```\n\n## 进入父目录\n\n使用 `cd..` 进入父目录。\n\n例如，当您在 `/home/user/Downloads`\
    \ 并且输入：\n\n```bash\ncd ..\n```\n\n您将会被带回 `/home/user`。\n\n单个点 (`.`) 指的是`current`\
    \ 目录。\n\n# 4.2.5. `mkdir` — 创建新目录\n\n使用 `mkdir` 后跟您想要创建的目录名称：\n\n```bash\nmkdir\
    \ Workspace\n```\n\n### 注意\n\n您正在创建的目录不能已经存在，否则此命令将无法工作。\n\n正如之前 所讨论的，目录名称是区分大小写的，因此目录名为\
    \ `Workspace` 的目录与另一个名为 `workspace` 的目录不同。\n\n## 目录名称中的空格\n\n如果目录名称中有空格，请使用双引号，例如：\n\
    \n```bash\nmkdir \"Project Work\"\n```\n\n否则，将创建两个独立的目录 — Project 和 Work。\n\n\
    # 4.2.6. `rmdir` — 删除空目录\n\n使用 `rmdir` 后跟您想要删除的目录名称：\n\n```bash\nrmdir Workspace\n\
    ```\n\n### 注意\n\n该目录在删除之前必须为空。\n\n该目录内不应有其他文件或目录。\n\n# 4.2.7. `ls` — 列出文件\n\n\
    要列出目录中的文件，请使用 `ls` 命令：\n\n```bash\nls\n```\n\n输出：\n\n```\nDesktop  Documents \
    \ Downloads  Music  Pictures  Public  Templates  Videos\n```\n\n## 显示隐藏文件\n\n\
    您可以为 `ls` 提供额外的选项。这将改变命令的工作方式。\n\n例如，要同时显示隐藏文件和目录，请使用：\n\n```bash\nls -a\n```\n\
    \n输出：\n\n```\n.              .cache     .local    Public\n..             .cinnamon\
    \  .gnup       .bash_history\n.config        Desktop    Pictures      Videos\n\
    .bashrc        Documents  .linuxmint   .profile  .authority\n```\n\n## 获取详细列表\n\
    \n要获取详细列表，请使用：\n\n```bash\nls -l\n```\n\n输出：\n\n```\ntotal 32\ndrwxr-xr-x 2 user\
    \ user 4096 Feb 17 13 Desktop\ndrwxr-xr-x 2 user user 4096 Mar 4 Documents\ndrwxr-xr-x\
    \ 2 user user 4096 Feb 17 13 Downloads\ndrwxr-xr-x 2 user user 4096 Feb 17 13\
    \ Music\ndrwxr-xr-x 2 user user 4096 Mar 4 Pictures\ndrwxr-xr-x 2 user user 4096\
    \ Feb 17 13 Public\ndrwxr-xr-x 2 user user 4096 Feb 17 13 Templates\ndrwxr-xr-x\
    \ 2 user user 4096 Feb 17 13 Videos\n```\n\n## 组合多个选项\n\n您可以组合多个选项，如：\n\n```bash\n\
    ls -la\n```\n\n输出：\n\n```\ntotal 144\ndrwxr-xr-x 1 user user 4096 Mar 12 00 .\n\
    drwxr-xr-x 3 root root 4096 Feb 17 51 ..\n-rw-------- 1 user user 190 Mar 4 .bash_history\n\
    -rw-r-- 1 user user 220 Feb 17 51 .logout\n-rw-r-- 1 user user 377 Feb 17 51 .bashrc\n\
    drwx------ 17 user user 4096 Mar 3 .cache\ndrwxrwxr-x 4 user user 4096 Feb 17\
    \ 13 .cinnamon\n```\n\n要查看 `ls` 支持的所有选项列表，请使用：\n\n```bash\nls --help\n```\n\n\
    # 4.2.8. `cp` — 复制文件\n\n使用 `cp` 命令，您可以复制文件或目录。\n\n## 复制一个文件\n\n要复制一个文件，使用 `cp`\
    \ 后跟源文件名称：\n\n```bash\ncp source destination\n```\n\n`source` 是您想要复制的文件，`destination`\
    \ 是目标位置。\n\n## 复制多个文件\n\n要复制多个文件，请使用以下格式：\n\n```bash\ncp source1 source2 destination\n\
    ```\n\n`source1` 和 `source2` 是您想要复制的文件，`destination` 是目标位置。\n\n## 复制目录\n\n要复制目录，请使用\
    \ `-r` 选项：\n\n```bash\ncp -r source destination\n```\n\n`source` 是您想要复制的目录，`destination`\
    \ 是目标位置。\n\n# 4.2.9. `cat` — 显示并合并文件\n\n使用 `cat` 命令，您可以在屏幕上查看文件或合并它们。\n\n## 查看文件内容\n\
    \n要查看文件内容，请使用 `cat` 后跟文件名：\n\n```bash\ncat /usr/share/dict/words\n```\n\n输出：\n\
    \n```\nA\nA's\nAMD\nAMD's\nAOL\nAOL's\nAWS\nAWS's\nAachen\n...\n```\n\n这将显示文件的全部内容。\n\
    \n## 合并文件内容\n\n如果您在 `cat` 中包含多个文件名，它会将它们合并并将内容打印到屏幕上。\n\n如果您想将输出保存到文件，请使用以下格式：\n\
    \n```bash\ncat file1.txt file2.txt > files.txt\n```\n\n`>` 操作将标准输出重定向到文件名。\n\n\
    # 4.2.10. `less` — 查看并导航文件内容\n\n使用 `less` 命令，您在查看文件时拥有更多控制权。它允许您上下滚动文件，并提供了关键词搜索文件的功能。\n\
    \n要查看文件，请使用 `less` 后跟文件名：\n\n```bash\nless /usr/share/dict/words\n```\n\n当文件打开时，它的外观将如图\
    \ 79 所示。\n\n![../../_images/less.png](img/less.png)\n\n图 79 在 less 中打开的 words\
    \ 文件\n\n在 `:` 提示符处，您可以输入 `less` 理解的命令。\n\n## 导航文件\n\n您可以通过回 键向下滚动文件。或者，您可以使用 `PgUp`\
    \ 和 `PgDn` 键一次翻一页。\n\n## 搜索文件\n\n您可以在 `less` 中查看文件时进行搜索。\n\n操作如下：\n\n1.  输入 `/`（正斜杠）键\n\
    2.  输入想要搜索的文本\n3.  按下 ENTER 键\n4.  如果有匹配的结果，它们将被高亮显示\n\n## 退出 less 命令\n\n要退出 less\
    \ 命令，请在提示符处输入 `q`。\n\n"
