- fmt: "\nWhen you are browsing a directory, you can bookmark it if you will access\
    \ it frequently. This function is available under:\n\nBookmark ‣ Add Bookmark\n\
    \n### Connect to servers\n\nFiles can be used to connect to external servers using\
    \ FTP, SSH, Samba and Webdav. This option is available under:\n\nFile ‣ Connect\
    \ to Server\n\nTo learn more about this feature, read the following section in\
    \ this book: [Transferring files between systems](../files/transfer-files.xhtml).\n\
    \n# 2.4.2. Firefox — browse the web\n\nFirefox is the default web browser ([Fig.\
    \ 24](#firefox.xhtml_fig-242a)).\n\n![../../_images/firefox.png](_images/firefox.png)\n\
    \nFig. 24 Firefox web browser\n\nOther web browsers can be installed using [Software\
    \ Manager](#glossary.xhtml_term-Software-Manager).\n\n# 2.4.3. Text Editor — create\
    \ and edit text files\n\nThe Text Editor can be used for working with files in\
    \ plain text formats like `.txt`, `.md` and `.fasta`, or editing configuration\
    \ files like `.bashrc` ([Fig. 25](#text-editor.xhtml_fig-243a)).\n\n![../../_images/text-editor.png](_images/text-editor.png)\n\
    \nFig. 25 Text Editor with Document Statistics and Preferences windows open\n\n\
    Using Edit ‣ Preferences, you can customize settings like the font used, display\
    \ of line numbers, indentation, word wrap etc.,\n\nThe Tools ‣ Document Statistics\
    \ feature is useful for counting the numbers of words and characters in a document.\n\
    \n## Opening hidden files in Text Editor\n\nTo open hidden files in Text Editor:\n\
    \n1. Use File ‣ Open to select a file\n2. In the Open Files dialog that appears,\
    \ right-click in the middle pane and select Show Hidden Files ([Fig. 26](#text-editor.xhtml_fig-243b)).\n\
    \n   ![../../_images/text-editor-hidden-files.png](_images/text-editor-hidden-files.png)\n\
    \n   Fig. 26 Opening hidden files in Text Editor\n\n   You can also use the `Ctrl+h`\
    \ keyboard shortcut.\n\n# 2.4.4. LibreOffice — edit documents and spreadsheets\n\
    \nLibreOffice Writer and LibreOffice Calc can be used to create and edit documents\
    \ and spreadsheets, respectively ([Fig. 27](#libreoffice.xhtml_fig-244a)).\n\n\
    ![../../_images/libreoffice.png](_images/libreoffice.png)\n\nFig. 27 LibreOffice\
    \ Writer and Calc programs\n\nThe default file formats used by Writer and Calc\
    \ are ODF Text Document (.odt) and ODF Spreadsheet (.ods) respectively.\n\nThese\
    \ applications also support reading and writing files in Microsoft Office formats\
    \ like `.docx` or `.doc` (Word) and `.xlsx` or `.xls` (Excel).\n\nThere are additional\
    \ applications in the LibreOffice suite with functionality to create and edit\
    \ slide shows or presentations, scientific formulas, diagrams and file-based databases.\n\
    \n# 2.4.5. Terminal — access the command-line\n\nThe Terminal application ([Fig.\
    \ 28](#terminal.xhtml_fig-245a)) provides the possibility of working with the\
    \ command-line interface. The default login shell for users on Linux Mint is [Bash](#glossary.xhtml_term-Bash).\n\
    \n![../../_images/terminal.png](_images/terminal.png)\n\nFig. 28 Terminal\n\n\
    By selecting the Edit ‣ Preferences menu item, you can customize Terminal’s appearance\
    \ and functionality ([Fig. 29](#terminal.xhtml_fig-245b)).\n\n![../../_images/terminal-preferences.png](_images/terminal-preferences.png)\n\
    \nFig. 29 Changing Terminal colour scheme in preferences\n\n# 2.4.6. Screenshot\
    \ — take screenshots of desktop or windows\n\nThe Screenshot program is useful\
    \ for taking screenshots of the entire screen, an application window or a selected\
    \ area of the screen ([Fig. 30](#screenshot.xhtml_fig-246a)).\n\n![../../_images/screenshot.png](_images/screenshot.png)\n\
    \nFig. 30 Screenshot program\n\n# 2.4.7. Software Manager — install software from\
    \ repositories\n\nSoftware Manager can be used to install software from Linux\
    \ Mint, Ubuntu, Debian and Flathub repositories ([Fig. 31](#software-manager.xhtml_fig-247a)).\n\
    \nFor a step-by-step procedure for installing software using Software Manager,\
    \ please consult [The quick and easy method](../../getting-software/quick-and-easy/index.xhtml).\n\
    \n![../../_images/software-manager.png](_images/software-manager.png)\n\nFig.\
    \ 31 Software Manager\n\n# 2.4.8. GNU Image Manipulation Program — edit images\n\
    \nThe GIMP program can be used to edit images in various formats like JPG, PNG,\
    \ TIFF, BMP etc., ([Fig. 32](#gimp.xhtml_fig-248a)).\n\n![../../_images/gimp.png](_images/gimp.png)\n\
    \nFig. 32 Editing an image in GIMP\n\n# 2.4.9. Inkscape — create vector graphics\n\
    \nInkscape can be used to create and edit images in the scalable vector graphics\
    \ (SVG) format ([Fig. 33](#inkscape.xhtml_fig-249a)).\n\n![../../_images/inkscape.png](_images/inkscape.png)\n\
    \nFig. 33 Creating vector graphics in Inkscape\n\n# 2.4.10. Notes\n\n## Adding\
    \ an application to favourites\n\nIf you use an application frequently, you can\
    \ consider adding it to favourites. This list is on the left side of the applications’\
    \ menu.\n\nTo favourite an application, right-click on the application name in\
    \ applications menu and select Add to favorites.\n\nAlternatively, you can choose\
    \ the Add to panel action, which will add the application to your Panel. Some\
    \ applications are visible in the Panel by default — a Show Desktop applet, Firefox\
    \ browser, Terminal, and Files.\n\n## Setting default applications\n\nIf you would\
    \ like to set default applications for certain categories or file types, you can\
    \ do so in System Settings under:\n\nPreferences ‣ Preferred applications\n\n\
    # 2.5. Files and directories\n\nThis section includes an introduction to your\
    \ home directory, files, directories, and their functions, the root filesystem\
    \ and a how-to on transferring files between systems.\n\n*   [2.5.1. Your home\
    \ directory](#home-directory.xhtml)\n*   [2.5.2. Hidden files and directories](#hidden-files.xhtml)\n\
    *   [2.5.3. Important files in home directory](#important-files.xhtml)\n*   [2.5.4.\
    \ File and directory names are case-sensitive](#case-sensitive.xhtml)\n*   [2.5.5.\
    \ Accessing the root filesystem](#root-filesystem.xhtml)\n*   [2.5.6. Transferring\
    \ files between systems](#transfer-files.xhtml)\n\n# 2.5.1. Your home directory\n\
    \nWhen you log in to the desktop and open [Files](../applications/files.xhtml),\
    \ it will display your home directory ([Fig. 34](#home-directory.xhtml_fig-25a)).\n\
    \nThe following directories will be present by default: Desktop, Documents, Downloads,\
    \ Music, Pictures, Public, Templates, and Videos.\n\n![../../_images/home-directory.png](_images/home-directory.png)\n\
    \nFig. 34 Home directory\n\n## Notes\n\n### /home/user\n\nThe complete (or absolute)\
    \ path to your home directory will be of the form `/home/user`, where user is\
    \ your username on the system.\n\n### $HOME\n\nThe `HOME` environment variable\
    \ will automatically be set to the complete path to your home directory.\n\nHence,\
    \ you can substitute `/home/user` with `$HOME` in your commands or scripts.\n\n\
    # 2.5.2. Hidden files and directories\n\nIn addition to the default directories\
    \ mentioned earlier, there are hidden files and directories in home directory\
    \ ([Fig. 35](#hidden-files.xhtml_fig-251b)). They have a dot (`.`) character at\
    \ the beginning of their file name.\n\n![../../_images/hidden-directories.png](_images/hidden-directories.png)\n\
    \nFig. 35 Hidden files and directories in home directory\n\nYou can view (or hide)\
    \ these files using the following menu entry in file manager:\n\nView ‣ Show Hidden\
    \ Files\n\nAlternatively, you can use the `Ctrl+h` keyboard shortcut.\n\n# 2.5.3.\
    \ Important files in home directory\n\n## .bashrc\n\nThis is the configuration\
    \ file used by Bash, the default shell for user accounts. You will mostly use\
    \ this file, when you need to set or modify environment variables like `PATH`.\n\
    \n## .bash_aliases\n\nYou can use the `.bash_aliases` file to set aliases for\
    \ commands.\n\nFor example, here is a commonly used alias:\n\n```bash\nalias l='ls\
    \ -l'\n```\n\nThis means when you type `l` at the command-line, the bash shell\
    \ will execute `ls -l`, which will output a long listing of files, instead of\
    \ the default.\n\n## Notes\n\nTo learn more about the `ls` command, read the [ls\
    \ — list files](../../command-line/commands/ls.xhtml) section.\n"
  raw: "When you are browsing a directory, you can bookmark it if you will access\
    \ it frequently. This function is available under:\n\nBookmark ‣ Add Bookmark\n\
    \n### Connect to servers\n\nFiles can be used to connect to external servers using\
