  trans: "\n# 2.5.4. 文件和目录名称区分大小写\n\n你需要记住的一点是，Linux 中的文件名和目录名是区分大小写的。\n\n例如，一个名为：\n\
    \n```\nsequence.txt\n```的文件与以下文件不同：\n\n```\nSequence.txt\n```\n\n同样，`Documents`\
    \ 和 `documents` 是两个不同的目录。\n\n上述这些文件或目录可以存在同一个目录中，并且拥有不同的内容。\n\n# 2.5.5. 访问根文件系统\n\
    \n要访问根文件系统 (`/`)，请点击文件管理器侧边栏中的“文件系统”（图 36）。\n\n![../../_images/file-system.png](img/file-system.png)\n\
    \n图 36 点击“文件系统”项以访问根文件系统\n\n## `/` 下的目录及其功能\n\n`/etc`\n— 存储应用程序的配置文件\n\n`/home`\n\
    — 包含用户的家目录\n\n`/media`\n— 外部磁盘等设备的挂载（即可用）位置\n\n`/root`\n— `root` 用户（管理员）的家目录\n\
    \n`/tmp`\n— 应用程序创建的临时文件\n\n`/usr`\n— 应用程序、库及其数据和文档安装在此\n\n`/var`\n— 日志文件、应用程序缓存、数据库等的存储空间\n\
    \n## 根文件系统和 root 家目录是不同的\n\n### `/` 是根文件系统\n\n只要具有相应的权限，系统上的所有用户都可以访问这里的文件和目录。\n\
    \n### `/root` 是 root 的家目录\n\n只有 root 可以访问它。\n\n# 2.5.6. 在系统之间传输文件\n\n“文件”的一个有用功能是可以使用\
    \ SSH、FTP、SMB 和 Webdav 等协议连接远程系统。一旦连接，你就可以将文件从 Linux 桌面传输到远程系统或反之。\n\n要连接到远程系统，请使用“文件”中的以下菜单项（图\
    \ 37）：\n\n文件 ‣ 连接到服务器\n\n![../../_images/files-connect.png](img/files-connect.png)\n\
    \n图 37 “文件”中的“连接到服务器”选项\n\n## 连接到 SSH 服务器\n\n打开文件 ‣ 连接到服务器并按照下面的步骤操作（图 38）：\n\n\
    1. 在对应“服务器”字段中，输入要连接的服务器的域名或 IP 地址\n2. 端口 `22` 是 SSH 的默认端口，因此通常不需要更改它\n3. 从“类型”下拉框中选择\
    \ SSH\n4. 在“文件夹”下，你可以指定一个连接成功后要打开的目录（可选）\n5. 输入你在服务器上的账户用户名和密码\n6. 点击“连接”按钮\n\n\
    ![../../_images/files-connect-ssh.png](img/files-connect-ssh.png)\n\n图 38 连接到\
    \ SSH 服务器\n\n一旦在“文件”中打开了远程目录，你就可以从桌面开始传输文件，或反之。\n\n# 3. 在 Linux 上获取软件\n\n在本节中，我将讨论如何在\
    \ Linux 桌面上获取软件。\n\n对于任何想要安装的软件，你可以从快速且方便的方法开始。它将安装 Linux 发行版仓库中提供的软件。\n\n如果你感兴趣的软件不可用，或者你需要不同的版本，可以考虑使用其他方法。\n\
    \n* 3.1. 快速且方便的方法\n    * 3.1.1. 要求\n    * 3.1.2. 查找并安装软件\n    * 3.1.3. 已安装的软件\n\
    \    * 3.1.4. 更新已安装的软件\n    * 3.1.5. 注意事项\n* 3.2. Python 包\n    * 3.2.1. 要求\n\
    \    * 3.2.2. 在 PyPI 上搜索包\n    * 3.2.3. 安装 Python 包\n    * 3.2.4. 更新已安装的包\n  \
    \  * 3.2.5. 删除已安装的包\n    * 3.2.6. 使用已安装的包\n    * 3.2.7. Python 虚拟环境\n    * 3.2.8.\
    \ 注意事项\n* 3.3. Perl 模块\n    * 3.3.1. 要求\n    * 3.3.2. 配置 local-lib 模块\n    * 3.3.3.\
    \ 在 CPAN 上搜索模块\n    * 3.3.4. 安装 Perl 模块\n"
