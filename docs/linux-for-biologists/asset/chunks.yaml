  trans: "\n\n当您浏览目录时，如果经常访问它，可以将其收藏。此功能可以通过以下路径访问：\n\n书签 ‣ 添加书签 (Bookmark ‣ Add Bookmark)\n\
    \n### 连接服务器\n\n可以使用 FTP、SSH、Samba 和 Webdav 连接到外部服务器。此选项可以通过以下路径访问：\n\n文件 ‣ 连接服务器\
    \ (File ‣ Connect to Server)\n\n要了解更多关于此功能，请阅读本书中的章节：系统间传输文件。\n\n# 2.4.2. Firefox\
    \ — 浏览网页\n\nFirefox 是默认的网络浏览器（图 24）。\n\n![../../_images/firefox.png](img/firefox.png)\n\
    \n图 24 Firefox 网页浏览器\n\n可以使用软件管理器 安装其他网络浏览器。\n\n# 2.4.3. 文本编辑器 — 创建和编辑文本文件\n\n\
    文本编辑器可处理 `.txt`、`.md` 和 `.fasta` 等纯文本格式的文件，或编辑如 `.bashrc` 等配置文件（图 25）。\n\n![../../_images/text-editor.png](img/text-editor.png)\n\
    \n图 25 打开了文档统计和首选项窗口的文本编辑器\n\n通过编辑 ‣ 首选项 (Edit ‣ Preferences)，您可以自定义设置，如所使用的字体、行号显示、缩进、自动换行等。\n\
    \n工具 ‣ 文档统计 (Tools ‣ Document Statistics) 功能用于统计文档中的单词数和字符数。\n\n## 在文本编辑器中打开隐藏文件\n\
    \n要在文本编辑器中打开隐藏文件：\n\n1. 使用文件 ‣ 打开 (File ‣ Open) 选择文件\n2. 在出现的“打开文件”对话框中，在中间面板点击右键，并选择显示隐藏文件\
    \ (Show Hidden Files)（图 26）。\n\n   ![../../_images/text-editor-hidden-files.png](img/text-editor-hidden-files.png)\n\
    \n   图 26 在文本编辑器中打开隐藏文件\n\n   您也可以使用快捷键 `Ctrl+h`。\n\n# 2.4.4. LibreOffice — 编辑文档和电子表格\n\
    \nLibreOffice Writer 和 LibreOffice Calc 分别用于创建和编辑文档和电子表格（图 27）。\n\n![../../_images/libreoffice.png](img/libreoffice.png)\n\
    \n图 27 LibreOffice Writer 和 Calc 程序\n\nWriter 和 Calc 使用的默认文件格式分别为 ODF 文档 (.odt)\
    \ 和 ODF 电子表格 (.ods)。\n\n这些应用程序还支持读取和写入 Microsoft Office 格式的文件，如 `.docx` 或 `.doc`\
    \ (Word) 以及 `.xlsx` 或 `.xls` (Excel)。\n\nLibreOffice 套件中还有其他应用程序，具有创建和编辑幻灯片或演示、科学公式、图表以及基于文件的数据库的功能。\n\
    \n# 2.4.5. 终端 — 访问命令行\n\n终端应用程序（图 28）提供了操作命令行界面的能力。Linux Mint 用户的默认登录 shell 是\
    \ Bash。\n\n![../../_images/terminal.png](img/terminal.png)\n\n图 28 终端\n\n通过选择编辑\
    \ ‣ 首选项菜单项 (Edit ‣ Preferences)，您可以自定义终端的外观和功能（图 29）。\n\n![../../_images/terminal-preferences.png](img/terminal-preferences.png)\n\
    \n图 29 在首选项中更改终端配色方案\n\n# 2.4.6. 截图 — 截取桌面或窗口\n\n截图程序用于对整个屏幕、应用程序窗口或屏幕选定区域进行截图（图\
    \ 30）。\n\n![../../_images/screenshot.png](img/screenshot.png)\n\n图 30 截图程序\n\n\
    # 2.4.7. 软件管理器 — 从存储库安装软件\n\n软件管理器可从 Linux Mint、Ubuntu、Debian 和 Flathub 存储库安装软件（图\
    \ 31）。\n\n有关使用软件管理器安装软件的步骤，请参阅快速简便的方法\n\n图 31 软件管理器\n\n# 2.4.8. GNU 图像处理程序 — 编辑图像\n\
    \nGIMP 程序可编辑 JPG、PNG、TIFF、BMP 等各种格式的图像（图 32）。\n\n![../../_images/gimp.png](img/gimp.png)\n\
    \n图 32 在 GIMP 中编辑图像\n\n# 2.4.9. Inkscape — 创建矢量图形\n\nInkscape 可用于创建和编辑可缩放矢量 (SVG)\
    \ 格式的图像（图 33）。\n\n![../../_images/inkscape.png](img/inkscape.png)\n\n图 33 在 Inkscape\
    \ 中创建矢量图形\n\n# 2.4.10. 笔记\n\n## 将应用程序添加到收藏\n\n如果您经常使用某个应用程序，可以考虑将其添加到收藏。此列表位于应用程序菜单的左侧。\n\
    \n要将应用程序设为收藏，在应用程序上点击右键。\n\n收藏一个应用程序，在应用程序菜单中点击右键。\n\n如果您经常使用某个应用程序，可以考虑将其添加到收藏。此列表位于应用程序菜单的左侧。\n\
    \n要将应用程序设为收藏，在应用程序上点击右键。选择。\n\n## 设置默认应用程序\n\n如果您想为某些类别或文件类型设置默认应用程序，可以通过以下路径设置：\n\
    \n系统设置 ‣ 首选项 (Settings ‣ Preferences)\n\n# 2.5. 文件和目录\n\n本节介绍了主目录、文件、目录及其功能如何在系统间传输。\n\
    \n*   2.5.1. 你的主目录\n*   2.5.2. 隐藏文件和目录\n*   2.5.3. 主目录中的重要文件\n*   2.5.4. 文件名大小敏感\n\
    *   2.5.5. 访问根文件系统\n*   2.5.6. 系统间传输\n\n# 2.5.1. 你的主目录\n\n当您登录桌面并打开文件时，它将显示您的主目录（图\
    \ 34）。\n\n默认存在目录：桌面、文档、下载、音乐、图片、公共、模板和视频。\n\n![../../_images/home-directory.png](img/home-directory.png)\n\
    \n图 34 主目录\n\n## 注意\n\n### /home/user\n\n主目录的完整（绝对）路径格式为 `/home/user`，其中 user\
    \ 是您的用户名。\n\n### $HOME\n\n`HOME`环境变量会自动设置为主目录的完整路径。因此，在命令或脚本中可以将 `/home/user`\
    \ 替换为 `$HOME`。\n\n# 2.5.2. 隐藏文件和目录\n\n除了之前提到的目录外，主目录下还有隐藏文件和目录（图 35）。它们的文件以点（`.`）开头。\n\
    \n![../../_images/hidden-directories.png](img/hidden-directories.png)\n\n图 35\
    \ 主目录中的隐藏文件和目录\n\n您可以通过文件管理器中的以下菜单项查看（或隐藏）这些文件：\n\n查看 ‣ 显示隐藏文件 (View ‣ Show Hidden\
    \ Files)\n\n或者，您也可以使用快捷键 `Ctrl+h`。\n\n# 2.5.3. 主目录中的重要文件\n\n## .bashrc\n\n这是 Bash（用户账户默认\
    \ shell）使用的配置文件。当您需要设置或修改环境变量如 `PATH` 时，通常会使用此文件。\n\n## .bash_aliases\n\n可以使用\
    \ `.bash_aliases` 文件为命令设置别名。\n\n例如，这里有一个常用的别名：\n\n```bash\nalias l='ls -l'\n```\n\
    \n这意味着当在命令行输入 `l` 时，bash shell 将执行 `ls -l`，从而输出文件的详细列表，而不是默认输出。\n\n"
- fmt: "\n# 2.5.4. File and directory names are case-sensitive\n\nOne thing you will\
    \ need to remember is that file and directory names in Linux are case-sensitive.\n\
    \nFor example, a file named:\n\n```\nsequence.txt\n```\n\nis different from:\n\
    \n```\nSequence.txt\n```\n\nSimilarly, `Documents` and `documents` are two different\
    \ directories.\n\nBoth these files or directories mentioned above, can exist in\
    \ the same directory and can have different contents.\n\n# 2.5.5. Accessing the\
    \ root filesystem\n\nTo access the root filesystem (`/`), click on File System\
    \ in the sidebar of file manager ([Fig. 36](#root-filesystem.xhtml_fig-254a)).\n\
    \n![../../_images/file-system.png](_images/file-system.png)\n\nFig. 36 Click on\
    \ File System entry to access the root filesystem\n\n## Directories under `/`\
    \ and their functions\n\n`/etc`\n— stores configuration files of applications\n\
    \n`/home`\n— contains home directories of users\n\n`/media`\n— locations where\
    \ devices like external disks will be mounted i.e., made available\n\n`/root`\n\
    — home directory of `root` user (administrator)\n\n`/tmp`\n— temporary files created\
    \ by applications\n\n`/usr`\n— applications and libraries are installed here along\
    \ with their data and documentation\n\n`/var`\n— storage for log files, application\
    \ cache, databases etc.,\n\n## Root file system and root home directory are different\n\
    \n### `/` is the root filesystem\n\nAll users on the system can access files and\
    \ directories here, provided they have the appropriate permissions.\n\n### `/root`\
    \ is home directory of root\n\nOnly root will have access to it.\n\n# 2.5.6. Transferring\
    \ files between systems\n\nOne useful feature of Files is the ability to connect\
    \ to remote systems using protocols like SSH, FTP, SMB and Webdav. Once connected,\
    \ you can transfer files from your Linux desktop to the remote system or vice-versa.\n\
    \nTo connect to a remote system, use the following menu entry in Files ([Fig.\
    \ 37](#transfer-files.xhtml_fig-255a)):\n\nFile ‣ Connect to Server\n\n![../../_images/files-connect.png](_images/files-connect.png)\n\
    \nFig. 37 Connect to Server option in Files\n\n## Connecting to an SSH server\n\
    \nOpen File ‣ Connect to Server and follow the steps below ([Fig. 38](#transfer-files.xhtml_fig-255b)):\n\
    \n1. In the field corresponding to Server, enter the domain name or IP address\
