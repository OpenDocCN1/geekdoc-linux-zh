  trans: "\n安装将现在开始（图 74](#install.xhtml_fig-331i)）。\n\n![../../_images/9-rstudio-install-progress.png](img/9-rstudio-install-progress.png)\n\
    图 74 安装进度\n\n安装完成后，你将在窗口顶部看到 `Same version is already installed` 消息（图 75](#install.xhtml_fig-331j)）。\n\
    \n![../../_images/10-rstudio-installed.png](img/10-rstudio-installed.png)\n图 75\
    \ 软件包安装成功\n\n# 3. 启动已安装的程序\n\n## 3.1. 启动已安装的程序\n\n你可以从应用程序菜单启动已安装的程序（图 76](#install.xhtml_fig-331k)）。\n\
    \n#### 注意\n这仅适用于带有图形用户界面的应用程序。\n\n![../../_images/11-launch-rstudio.png](img/11-launch-rstudio.png)\n\
    图 76 从应用程序菜单启动已安装程序\n\n程序的主窗口将显示（图 77](#install.xhtml_fig-331l)）。\n\n![../../_images/12-rstudio-main-window.png](img/12-rstudio-main-window.png)\n\
    图 77 RStudio Desktop 主窗口\n\n# 3.6.3. 升级已安装的软件\n\n从 Debian 软件包安装的软件与安装类似。当有新版本的程序可用时，下载软件包文件（`.deb`），然后按照安装\
    \ Debian 软件包中的步骤操作。\n\n# 3.6.4. 移除已安装的软件\n\n你可以按照移除已安装的软件中的步骤，搜索并删除以这种方式安装的包。\n\
    \n# 3.6.5. 注意事项\n\n### 3.6.5.1 命令行版本\n\n你可以使用 apt 包管理器在命令行安装 Debian 软件包。\n\n###\
    \ 3.6.5.2 这些程序需要手动更新\n\n以这种方式安装的程序*通常*不会自动更新。因此，此方法应仅用于无法通过快速简单的方法获取的软件。\n\n###\
    \ 3.6.5.3 如果无法找到依赖项，安装将失败\n\n如果无法在软件库中找到依赖项，某些程序的安装可能会失败。在这种情况下，你需要手动找到并安装这些包，然后再次尝试安装程序。\n\
    \n# 4. 使用 Linux 命令行\n\n在本节中，你将找到 Linux 命令行、shell 和终端程序、一些常用命令以及一个示例练习。\n\n*  \
    \ 4.1. Shell 和终端\n    *   4.1.1. Shell 提示符\n*   4.2. 命令 — 概述\n    *   4.2.1. 命令选项\n\
    \    *   4.2.2. 获取使用命令的帮助\n    *   4.2.3. `date` — 显示当前日期和时间\n    *   4.2.4. `cd`\
    \ — 更改目录\n    *   4.2.5. `mkdir` — 创建新目录\n    *   4.2.6. `rmdir` — 删除空目录\n   \
    \ *   4.2.7. `ls` — 列出文件\n    *   4.2.8. `cp` — 复制文件\n    *   4.2.9. `cat` — 显示文件内容或合并它们\n\
    \    *   4.2.10. `less` — 查看并导航文件内容\n    *   4.2.11. `head` — 打印文件的前几行\n    *\
    \   4.2.12. `tail` — 打印文件的最后几行\n    *   4.2.13. `mv` — 移动文件或目录\n    *   4.2.14.\
    \ `rm` — 删除文件或目录\n    *   4.2.15. `echo` — 显示文本或值\n*   4.3. 其他有用命令\n    *   4.3.1.\
    \ `df` — 报告磁盘使用情况\n    *   4.3.2. `du` — 估计文件或目录的磁盘占用\n    *   4.3.3. `find` —\
    \ 搜索文件\n    *   4.3.4. `free` — 查看空闲和已内存\n    *   4.3.5. `locate` — 使用文件名查找文件\n\
    \    *   4.3.6. `which` — 查找命令\n\n注：由于提供的原始文本在 4.2.1 之后出现了大量重复的乱码片段，上述译文已根据逻辑结构进行了清理，确保输出不重复且完整。\n"
- fmt: "\n```\nUsage: ls [OPTION]... [FILE]...\nList information about the FILEs (the\
    \ current directory by default).\nSort entries alphabetically if none of -cftuvSUX\
    \ nor --sort is specified.\n\nMandatory arguments to long options are mandatory\
    \ for short options too.\n  -a, --all                  do not ignore entries starting\
    \ with .\n\n...\n```\n\n### Note\n\nTo keep this discussion short, the examples\
    \ in this section, only includes `some` options supported by a command.\n\n# 4.2.3.\
    \ `date` — display current date and time\n\n```\ndate\n```\n\nOutput:\n\n```\n\
    Wed 10 Mar 2021 10:33:11 GMT\n```\n\n# 4.2.4. `cd` — change directory\n\nTo change\
    \ into a directory, use `cd` followed by the name of that directory.\n\nFor example,\
    \ to change into `/home/user/Downloads`, use:\n\n```bash\ncd Downloads\n```\n\n\
    ### Note\n\nWhen you log in or open a new terminal window, you will be placed\
    \ in your home directory — `/home/user`, where `user` is your username.\n\nYou\
    \ can verify your current directory using the `pwd` command discussed [earlier](#shell-terminal.xhtml_pwd):\n\
    \n```bash\npwd\n```\n\n```\n/home/user/Downloads\n```\n\n## `cd` with no arguments\n\
    \nNo matter where you are in the file system, typing `cd` `without any arguments`\
    \ will take you to your home directory.\n\n```bash\nuser@cookbook:/usr/share/dict$\
    \ cd\nuser@cookbook:~$\n```\n\n## Go to parent directory\n\nUse `cd..` to go to\
    \ the parent directory.\n\nFor example, when you are in `/home/user/Downloads`\
    \ and type:\n\n```bash\ncd ..\n```\n\nYou will be taken to `/home/user`.\n\nA\
    \ single dot (`.`) refers to the `current` directory.\n\n# 4.2.5. `mkdir` — create\
    \ new directory\n\nUse `mkdir` followed by the name of the directory you would\
    \ like to create:\n\n```bash\nmkdir Workspace\n```\n\n### Attention\n\nThe directory\
    \ you’re creating must not already exist or this command will not work.\n\nAs\
    \ discussed [earlier](#case-sensitive.xhtml_case-sensitive), directory names are\
    \ case-sensitive, so a directory named `Workspace` is different from another named\
    \ `workspace`.\n\n## Spaces in directory names\n\nIf there are spaces in the directory\
    \ name, use double quotes, for example:\n\n```bash\nmkdir \"Project Work\"\n```\n\
    \nWithout that, two separate directories — Project and Work will be created.\n\
    \n# 4.2.6. `rmdir` — remove empty directory\n\nUse `rmdir` followed by the name\
    \ of the directory you would like to remove:\n\n```bash\nrmdir Workspace\n```\n\
    \n### Attention\n\nThis directory must be empty before it can be removed.\n\n\
    There should be no other files or directories within that directory.\n\n# 4.2.7.\
    \ `ls` — list files\n\nTo list files in a directory, use the `ls` command:\n\n\
    ```bash\nls\n```\n\nOutput:\n\n```\nDesktop  Documents  Downloads  Music  Pictures\
    \  Public  Templates  Videos\n```\n\n## Listing hidden files\n\nYou can provide\
    \ additional options to `ls`. It will change how the command works.\n\nFor example,\
    \ to display hidden files and directories too, use:\n\n```bash\nls -a\n```\n\n\
    Output:\n\n```\n.              .cache     .local    Public\n..             .cinnamon\
    \  .gnup       .bash_history\n.config        Desktop    Pictures      Videos\n\
    .bashrc        Documents  .linuxmint   .profile  .authority\n```\n\n## Getting\
    \ a detailed listing\n\nTo get a detailed listing, use:\n\n```bash\nls -l\n```\n\
    \nOutput:\n\n```\ntotal 32\ndrwxr-xr-x 2 user user 4096 Feb 17 13 Desktop\ndrwxr-xr-x\
    \ 2 user user 4096 Mar 4 Documents\ndrwxr-xr-x 2 user user 4096 Feb 17 13 Downloads\n\
    drwxr-xr-x 2 user user 4096 Feb 17 13 Music\ndrwxr-xr-x 2 user user 4096 Mar 4\
    \ Pictures\ndrwxr-xr-x 2 user user 4096 Feb 17 13 Public\ndrwxr-xr-x 2 user user\
    \ 4096 Feb 17 13 Templates\ndrwxr-xr-x 2 user user 4096 Feb 17 13 Videos\n```\n\
    \n## Combining multiple options\n\nYou can combine multiple options like:\n\n\
    ```bash\nls -la\n```\n\nOutput:\n\n```\ntotal 144\ndrwxr-xr-x 1 user user 4096\
    \ Mar 12 00 .\ndrwxr-xr-x 3 root root 4096 Feb 17 51 ..\n-rw-------- 1 user user\
    \ 190 Mar 4 .bash_history\n-rw-r-- 1 user user 220 Feb 17 51 .logout\n-rw-r--\
    \ 1 user user 377 Feb 17 51 .bashrc\ndrwx------ 17 user user 4096 Mar 3 .cache\n\
    drwxrwxr-x 4 user user 4096 Feb 17 13 .cinnamon\n```\n\nTo see the list of all\
    \ options that `ls` supports, use:\n\n```bash\nls --help\n```\n\n# 4.2.8. `cp`\
    \ — copy files\n\nWith the `cp` command, you can copy files or directories from\
    \ one `source` to `destination`.\n\n## Copying one file\n\nTo copy one file, use\
    \ the following format:\n\n```bash\ncp source_file destination\n```\n\nWhere `source_file`\
    \ is the file you would like to copy and `destination` can either a file name\
    \ or a directory.\n\n### If destination is a file name\n\nThe copied file will\
    \ have that file name.\n\nFor example:\n\n```bash\ncp /usr/share/dict/words /home/user/Documents/dictionary.txt\n\
    ```\n\nThis will copy the `words` file from `/usr/share/dict/` to `/home/user/Documents/`\
    \ and save it as `dictionary.txt`.\n\n### If destination is a directory\n\nThe\
    \ file will be copied into that directory with the same file name.\n\nFor example:\n\
    \n```bash\ncp /usr/share/dict/words /home/user/Documents\n```\n\nThis will copy\
    \ the `words` file from `/usr/share/dict/` to `/home/user/Documents/` with the\
    \ same file name.\n\n## Copying multiple files\n\nTo copy multiple files, use\
    \ the following format:\n\n```bash\ncp source_file1 source_file2 destination\n\
    ```\n\nWhere `source_file1` and `source_file2` are the files you would like to\
    \ copy. You can have any number of source files. Here, `destination` is the directory\
    \ where you would like to copy files into.\n\nFor example:\n\n```bash\ncp /usr/share/dict/words\
    \ /usr/share/dict/spanish /home/user/Documents\n```\n\nThis will copy the `words`\
    \ and `spanish` dictionary files from `/usr/share/dict/` into `/home/user/Documents`.\n\
    \n## Copying directories\n\nYou can copy entire directories using the `-r` (recursive)\
    \ option.\n\nFor example:\n\n```bash\ncp -r /usr/share/dict /home/user/Documents\n\
    ```\n\nThis will copy the `/usr/share/dict` directory and its contents to the\
    \ `Documents` directory.\n\n# 4.2.9. `cat` — display contents of files or combine\
    \ them\n\nWith the `cat` command, you can view the contents of a file on the screen\
    \ or combine contents of multiple files.\n\n## View contents of a file\n\nTo view\
    \ the contents of a file, use `cat`, followed by the name of the file:\n\n```bash\n\
    cat /usr/share/dict/words\n```\n\nOutput:\n\n```\nA\nA's\nAMD\nAMD's\nAOL\nAOL's\n\
    AWS\nAWS's\nAachen\n...\n```\n\nThis will display the entire contents of the file.\n\
    \n## Combine contents of files\n\nIf you include multiple file names in `cat`,\
    \ it will combine them and print their contents on the screen.\n\nIf you would\
    \ like to save the output to a file instead, use the following format:\n\n```bash\n\
    cat file1.txt file2.txt > files.txt\n```\n\nThe `>` operator redirects standard\
    \ output to the file name following it.\n\n# 4.2.10. `less` — view and navigate\
    \ file contents\n\nWith the `less` command, you have more control when viewing\
    \ a file. It allows you to scroll up and down the file and provides features like\
    \ searching the file with keywords.\n\nTo view the contents of a file, use `less`,\
    \ followed by the name of the file:\n\n```bash\nless /usr/share/dict/words\n```\n\
    \nWhen the file is open, it will appear as in [Fig. 79](#less.xhtml_fig-431).\n\
    \n![../../_images/less.png](_images/less.png)\n\nFig. 79 The words file open in\
    \ less command\n\nAt the `:` prompt, you can type commands that `less` will understand.\n\
    \n## Navigating the file\n\nYou can scroll down the file by pressing the ENTER\
    \ key. Alternatively, you can use the `PgUp` and `PgDn` keys to scroll one page\
    \ at a time.\n\n## Searching the file\n\nYou can search a file while viewing it\
    \ in `less`.\n\nTo do this:\n\n1.  Type `/` (forward slash) key\n2.  Type the\
    \ text you would like to search\n3.  Press the ENTER key\n4.  If there are matching\
    \ results, they will be highlighted\n\n## Quitting the `less` command\n\nTo quit\
    \ the less command, type `q` at the prompt.\n"
