    \nFig. 42 Click on the Install button to install this package\n\nAn dialog window\
    \ will now appear, prompting you to enter *your password*.\n\nType in your password\
    \ and click on the Authenticate button ([Fig. 43](#installing-software.xhtml_fig-312e)).\n\
    \n![../../_images/5-install-authentication.png](_images/5-install-authentication.png)\n\
    \nFig. 43 Type in your password and click on the Authenticate button\n\nInstallation\
    \ will now proceed.\n\nWhen installation is complete, you will notice two buttons\
    \ — Launch and Remove, in place of the Install button ([Fig. 44](#installing-software.xhtml_fig-312f)).\n\
    \n![../../_images/6-pymol-launch-button.png](_images/6-pymol-launch-button.png)\n\
    \nFig. 44 Installation complete. Notice the Launch and Remove buttons\n\nClick\
    \ on the Launch button. This will open the PyMOL program ([Fig. 45](#installing-software.xhtml_fig-312g)).\n\
    \n![../../_images/7-pymol-window.png](_images/7-pymol-window.png)\n\nFig. 45 Main\
    \ window of PyMOL\n\nAlternatively, you can search for the application in the\
    \ Applications Menu and launch it from there.\n\nNote\n\nFor applications that\
    \ do not have a graphical user interface, the Launch button will not be present.\n\
    \nIf the program includes any commands, you can access them in a [terminal](../../using-linux/applications/terminal.xhtml)\
    \ session.\n\n# 3.1.3\\. Removing installed software\n\nYou can follow these steps\
    \ to remove software installed from repositories.\n\nOpen Software Manager.\n\n\
    Click on the settings button in the main application window and then select Show\
    \ installed applications ([Fig. 46](#removing-software.xhtml_fig-313a)).\n\n![../../_images/8-show-installed-applications.png](_images/8-show-installed-applications.png)\n\
    \nFig. 46 From Software Manager settings, select Show Installed Applications\n\
    \nAlternatively, you can type the name of the software in the search bar and then\
    \ press the ENTER key.\n\nIn the list of Installed Applications, click on the\
    \ package you would like to remove — Pymol, in this case ([Fig. 47](#removing-software.xhtml_fig-313b)).\n\
    \n![../../_images/9-select-pymol-for-removal.png](_images/9-select-pymol-for-removal.png)\n\
    \nFig. 47 Click on the package you would like to remove\n\nYou will be taken to\
    \ the package description page.\n\nClick on the Remove button to remove (or uninstall)\
    \ the package ([Fig. 48](#removing-software.xhtml_fig-313c)).\n\n![../../_images/10-click-remove-button.png](_images/10-click-remove-button.png)\n\
    \nFig. 48 Click on the Remove button to remove the package\n\nYou will be prompted\
    \ to enter your password.\n\nType in *your password* and then click on the Authenticate\
    \ button to proceed ([Fig. 49](#removing-software.xhtml_fig-313d)).\n\n![../../_images/11-remove-authentication.png](_images/11-remove-authentication.png)\n\
    \nFig. 49 Type in your password and click on the Authenticate button\n\nThe software\
    \ will now be removed (or uninstalled) from the system.\n\n# 3.1.4\\. Updating\
    \ installed software\n\nWhen updates are available for software installed on your\
    \ system, you will see a notification in the system tray ([Fig. 50](#updating-software.xhtml_fig-314a)).\n\
    \n![../../_images/12-updates-system-tray.png](_images/12-updates-system-tray.png)\n\
    \nFig. 50 Notification of software updates in system tray\n\nTo apply software\
    \ updates:\n\nClick on the notification icon in system tray. This will open the\
    \ Update Manager program.\n\nTo install all available software updates, click\
    \ on the Install Updates button in the toolbar ([Fig. 51](#updating-software.xhtml_fig-314b)).\n\
    \n![../../_images/13-update-manager.png](_images/13-update-manager.png)\n\nFig.\
    \ 51 Click on the Install Updates button to apply all available updates\n\nYou\
    \ will be prompted to enter your password ([Fig. 52](#updating-software.xhtml_fig-314c)).\n\
    \nType in *your password* and click on the Authenticate button.\n\n![../../_images/14-update-authenticate.png](_images/14-update-authenticate.png)\n\
    \nFig. 52 Type in your password and click on the Authenticate button\n\nUpdate\
    \ Manager will now continue installing updates ([Fig. 53](#updating-software.xhtml_fig-314d)).\n\
    \n![../../_images/15-applying-updates.png](_images/15-applying-updates.png)\n\n\
    Fig. 53 Update Manager installing software updates\n\nWhen the update process\
    \ is complete, you will see a message — Your system is up to date ([Fig. 54](#updating-software.xhtml_fig-314e)).\n\
    \n![../../_images/16-update-complete.png](_images/16-update-complete.png)\n\n\
    Fig. 54 Updates installed successfully\n\n# 3.1.5. Notes\n\n## The command-line\
    \ version (`apt`)\n\nYou can use the [apt](#glossary.xhtml_term-apt) package manager\
    \ to install software from the command-line.\n\n### Searching for software\n\n\
    Open a terminal to perform a search for matching packages in the repositories.\n\
    \nFor example, here is a search for `pymol`\n\n```\napt search pymol\n```\n\n\
    Note\n\nYou do not need to include `sudo` here.\n\nThis will output matching results\
    \ from repositories, if any:\n\n```\np   pymol           - Molecular Graphics\
    \ System\np   pymol-data      - data files for PyMOL\np   python3-pymol   - Molecular\
    \ Graphics System (Python 3 module\n```\n\nOnce you have identified the correct\
    \ package name — in this case, it is `pymol` you can proceed towards installing\
    \ the package.\n\n### Installing a package\n\nYou can install a package using\
    \ the following command:\n\n```\nsudo apt install pymol\n```\n\nAttention\n\n\
    *You need to include sudo here.*\n\nAlso, in the commands below, you will be asked\
    \ to enter *your password*.\n\nYou will also need to confirm if you would like\
    \ to continue with the changes. Type `y` and then press the `ENTER` key to proceed.\n\
    \n```\n[sudo] password for user:\nReading package lists... Done\nBuilding dependency\
    \ tree\nReading state information... Done\nThe following additional packages will\
    \ be installed:\n  pymol-data python3-pymol\nThe following NEW packages will be\
    \ installed:\n  pymol pymol-data python3-pymol\n0 upgraded, 3 newly installed,\
    \ 0 to remove and\n4 not upgraded.\nNeed to get 0 B/5,192 kB of archives.\nAfter\
    \ this operation, 19.8 MB of additional disk\nspace will be used.\nDo you want\
    \ to continue? [Y/n] y\n```\n\nThe package will now be installed.\n\n### Removing\
    \ an installed package\n\nTo remove an installed package, use the command:\n\n\
    ```\nsudo apt remove pymol\n```\n\nThe command above does not remove dependent\
    \ packages. You can remove them using:\n\n```\nsudo apt autoremove\n```\n\n###\
    \ Updating packages\n\nTo update *all installed packages*, you can use these commands:\n\
    \n```\nsudo apt update\nsudo apt upgrade\n```\n\nTo update *a specific package*\
    \ — if an update is available, you can simply use `apt``install` again:\n\n```\n\
    sudo apt install package_name\n```\n\n## Why is this a quick and easy method?\n\
    \nYou can use a graphical user interface (Software Manager) or the command-line\
    \ (`apt`) to install software available in Linux package repositories.\n\nSoftware\
    \ installed in this manner will also be kept updated along with the rest of the\
    \ system."
