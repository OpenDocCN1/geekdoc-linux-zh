  trans: '


    图 39 点击应用程序菜单中的“软件管理器”


    启动后，你将看到它的主窗口（图 40）。


    ![../../_images/2-software-manager.png](img/2-software-manager.png)


    图 40 软件管理器主窗口


    在搜索栏中，输入 `pymol`。


    稍后，存储库中匹配搜索词（即 `pymol`）的软件包将显示在下方（图 41）。


    ![../../_images/3-search-for-pymol.png](img/3-search-for-pymol.png)


    图 41 pymol 的搜索结果


    点击第一个结果 — Pymol。你将被跳转到软件包描述页。


    ### 注意


    为什么不选择 `Python3-pymol` ？


    第二个结果 `Python3-pymol` 的描述表明它包含了用于与 PyMOL 操作的 Python 3 `modules`，这并不是我们要找的内容。


    如果你不确定，可以在下一页阅读软件包的完整描述，并确认这是否是你想要安装的软件包。


    在软件包描述页上，点击 `Install` 按钮（图 42）。


    ![../../_images/4-pymol-install-button.png](img/4-pymol-install-button.png)


    图 42 点击 Install 按钮安装此软件包


    现在会弹出一个对话窗口，提示你输入 `your password`。


    输入你的密码并点击 `Authenticate` 按钮（图 43）。


    ![../../_images/5-install-authentication.png](img/5-install-authentication.png)


    图 43 输入密码并点击 Authenticate 按钮


    现在现在开始进行。


    当安装完成后，你会发现 `Install` 按钮变成了两个按钮：`Launch` 和 `Remove`（图 44）。


    ![../../_images/6-pymol-launch-button.png](img/6-pymol-launch-button.png)


    图 44 安装完成。注意 Launch 和 Remove 按钮


    点击 `Launch` 按钮。这将打开 PyMOL 程序（图 45）。


    ![../../_images/7-pymol-window.png](img/7-pymol-window.png)


    图 45 PyMOL 主窗口


    或者，你可以在应用程序菜单中搜索该应用程序并从那里启动。


    ### 注意


    对于没有图形用户界面的应用程序，将不会 `Launch` 按钮。


    如果程序包含任何命令，你可以在 terminal 会话中访问它们。


    # 3.1.3 移除已安装的软件


    你可以按照以下步骤移除从存储库安装的软件。


    打开软件管理器。


    点击主应用程序窗口中的设置按钮，然后选择 `Show installed applications`（图 46）。


    ![../../_images/8-show-installed-applications.png](img/8-show-installed-applications.png)


    图 46 在软件管理器设置中，选择显示已安装应用程序


    或者，你可以在搜索栏中输入软件名称然后按 `ENTER` 键。


    在“已安装应用程序”列表中，点击你想要移除的软件包 — 本例中为 Pymol（图 47）。


    ![../../_images/9-select-pymol-for-removal.png](img/9-select-pymol-for-removal.png)


    图 47 点击你想要移除的软件包


    你将被跳转到软件包描述页。


    点击 `Remove` 按钮以移除（或卸载）软件包（图 48）。


    ![../../_images/10-click-remove-button.png](img/10-click-remove-button.png)


    图 48 点击 Remove 按钮移除软件包


    系统将提示你输入密码。


    输入 `your password` 然后点击 `Authenticate` 按钮继续（图 49）。


    ![../../_images/11-remove-authentication.png](img/11-remove-authentication.png)


    图 49 输入密码并点击 Authenticate 按钮


    软件现在将从系统中移除（或卸载）。


    # 3.1.4 更新已安装的软件


    当你的系统中安装的软件有可用更新时，你将在系统托中看到通知（图 50）。


    ![../../_images/12-updates-system-tray.png](img/12-updates-system-tray.png)


    图 50 系统托盘中的软件更新通知


    要应用软件更新：


    点击系统托中的通知图标。这将打开更新管理器程序。


    要安装所有可用的软件更新，点击工具栏上的 `Install Updates` 按钮（图 51）。


    ![../../_images/13-update-manager.png](img/13-update-manager.png)


    图 51 点击 Install Updates 按钮应用所有可用更新


    系统将提示你输入密码（图 52）。


    输入 `your password` 并点击 `Authenticate` 按钮。


    ![../../_images/14-update-authentication.png](img/14-update-authentication.png)


    图 52 输入密码并点击 Authenticate 按钮


    更新管理器现在将继续安装更新（图 53）。


    ![../../_images/15-applying-updates.png](img/15-applying-updates.png)


    图 53 更新管理器正在安装软件更新


    当更新完成后，你将看到一条消息 — 系统是最新的（图 54）。


    ![../../_images/16-update-complete.png](img/16-update-complete.png)


    图 54 更新成功


    '
- fmt: "\n## Additional software repositories\n\nIt takes some time for newer versions\
    \ of software to become available in distribution repositories.\n\nIf your software\
    \ of interest is not available or if you need a more recent version of the software,\
    \ you could try installing them from these additional sources:\n\n*   [Python\
    \ packages](../python/index.xhtml) from [PyPI](#glossary.xhtml_term-PyPI)\n* \
    \  [Perl modules](../perl/index.xhtml) from [CPAN](#glossary.xhtml_term-CPAN)\n\
    *   [R packages](../r/index.xhtml) from [CRAN](#glossary.xhtml_term-CRAN) or [Bioconductor](#glossary.xhtml_term-Bioconductor)\n\
    *   [Conda packages](../conda/index.xhtml) from [Anaconda Cloud](#glossary.xhtml_term-Anaconda-Cloud)\n\
    \n### Attention\n\nSoftware installed using these methods, will also need to be\
    \ kept updated manually.\n\n# 3.2. Python packages\n\nIf your software of interest\
    \ is available as a Python package on [PyPI](#glossary.xhtml_term-PyPI), you can\
    \ install it using [pip](#glossary.xhtml_term-pip) — Python package installer.\n\
    \n### Note\n\nYour software might already be available using [The quick and easy\
    \ method](../quick-and-easy/index.xhtml). Search for package names starting with\
    \ `python-`.\n\nIn certain cases, installing packages in a virtual environment\
    \ might be a better option. Read:\n\n`->` [When should I use a virtual environment?](#notes.xhtml_when-virtualenv)\n\
    \n*   [3.2.1. Requirements](#requirements.xhtml)\n*   [3.2.2. Searching for a\
    \ package on PyPI](#search.xhtml)\n*   [3.2.3. Installing a Python package](#install.xhtml)\n\
    *   [3.2.4. Updating an installed package](#update.xhtml)\n*   [3.2.5. Removing\
    \ an installed package](#remove.xhtml)\n*   [3.2.6. Using installed packages](#using.xhtml)\n\
    *   [3.2.7. Python virtual environments](#virtualenv.xhtml)\n*   [3.2.8. Notes](#notes.xhtml)\n\
    \n# 3.2.1. Requirements\n\n### Python package installer (pip)\n\nTo install pip,\
    \ follow [The quick and easy method](../quick-and-easy/index.xhtml) for installing\
    \ software.\n\nSearch and install the `python3-pip` package.\n\n### $HOME/.local/bin\
    \ added to $PATH\n\nPackages that include commands will install them in the `$HOME/.local/bin`\
    \ directory ([What is $HOME?](#home-directory.xhtml_dollar-home)).\n\nTo be able\
    \ to run these commands easily, you will need to add this directory to your `$PATH`\
    \ variable. You can do so by following the steps in [Adding directories to PATH](#notes.xhtml_adding-directories-to-path).\n\
    \n### Attention\n\n*   You should not add `sudo` in the commands below.\n\nThis\
    \ method only installs files in your home directory and so does not require administrator\
    \ privileges.\n\n# 3.2.2. Searching for a package on PyPI\n\nOpen [PyPI website](https://pypi.org)\
    \ [https://pypi.org] in a web browser.\n\nIn the Search projects field, enter\
    \ the name of the software you would like to install and press the ENTER key or\
    \ click on the search button ([Fig. 55](#search.xhtml_fig-321a)).\n\n![../../_images/pypi-search.png](_images/pypi-search.png)\n\
    \nFig. 55 Searching for a package on PyPI\n\nA list of packages matching the search\
    \ term will be displayed ([Fig. 56](#search.xhtml_fig-321b)).\n\n![../../_images/pypi-search-result.png](_images/pypi-search-result.png)\n\
    \nFig. 56 Search results for biopython. 1.78 is the version number.\n\nClick on\
    \ the result to proceed to the project description page.\n\nIn the project description\
    \ page, find the package name ([Fig. 57](#search.xhtml_fig-321c)) in the `pip`\
    \ install` command.\n\nIn this case, it is `biopython`.\n\n![../../_images/pypi-biopython-page.png](_images/pypi-biopython-page.png)\n\
    \nFig. 57 Project description page for Biopython\n\n### Note\n\nYou will need\
    \ to use `pip3` instead of the `pip` command in the steps below. [Why?](#notes.xhtml_why-pip3)\n\
    \nYou can now proceed towards installing the package.\n\n# 3.2.3. Installing a\
    \ Python package\n\nOpen a terminal.\n\nUse the `pip3 install` command with by\
    \ the name of the package, you would like to install.\n\nUsing biopython as an\
    \ example:\n\n```\npip3 install biopython\n```\n\nOutput:\n\n```\nCollecting biopython\n\
    \  Downloading biopython-1.78-cp38-cp38-manylinux1_x86_64.whl (2.3 MB)\n     |********************************|\
    \ 2.3 MB 2.1 MB/s\nCollecting numpy\n  Downloading numpy-1.20.1-cp38-cp38-manylinux2010_x86_64.whl\
    \ (15.4 MB)\n     |********************************| 15.4 MB 90 kB/s\nInstalling\
    \ collected packages: numpy, biopython\nSuccessfully installed biopython-1.78\
    \ numpy-1.20.1\n```\n\n### Note\n\nOne limitation of this method is that, you\
    \ will not be able to install multiple versions of a package. This can be solved\
    \ using a [virtual environment](#virtualenv.xhtml_virtualenv).\n\n# 3.2.4. Updating\
    \ an installed package\n\nWhen you notice an update is available for the package,\
    \ you can use the `install` command with the--U` option, and the name of the package:\n\
    \n```\npip3 install -U biopython\n```\n\n# 3.2.5. Removing an installed package\n\
    \nUse the `uninstall` command with the name of the package you would like to remove:\n\
    \n```\npip3 uninstall biopython\n```\n\n# 3.2.6. Using installed packages\n\n\
    ### Where are the files installed?\n\nYou can use the `pip3 show` command with\
    \ the name of the package to identify the path where it is installed:\n\n```\n\
    pip3 show biopython\n```\n\nOutput:\n\n```\nName: biopython\nVersion: 1.78\nSummary:\
    \ Freely available tools for computational molecular biology.\nHome-page: https://biopython.org/\n\
    Author: The Biopython Contributors\nAuthor-email: biopython@biopython.org\nLicense:\
    \ UNKNOWN\nLocation: /home/user/.local/lib/python3.8/site-packages\nRequires:\
    \ numpy\nRequired-by:\n```\n\n### Using packages and modules\n\nPython packages\
    \ and modules will be installed in `$HOME/.local/lib/python3.8/site-packages`.\n\
    \nNote\n\nIf you have a different version of Python, this value will change.\n\
    \nThis directory will be automatically included in `$PYTHONPATH`. So, you can\
    \ import and use installed packages in your scripts, without any extra effort.\n\
    \nFor example, here is a simple Python script to test BioPython installed using\
    \ pip:\n\n```python\nfrom Bio.Seq import Seq\n\nseq = Seq('ATGC')\ncomp = seq.complement()\n\
    \nprint(f'The complement of {seq} is {comp}')\n```\n\nThe `Bio.Seq` package is\
    \ part of BioPython. Copy the code sample above and save it as `biopy_test.py`.\
    \ Then run it from the terminal like so:\n\n```\npython3 biopy_test.py\n```\n\n\
    Output:\n\n```\nThe complement of ATGC is TACG\n```\n\n### Using included commands\n\
    \nIf the package includes commands, those will be installed in `$HOME/.local/bin`\
    \ directory. For these commands to be easily accessible, you will need to add\
    \ this directory to `PATH`, as mentioned under [requirements](#requirements.xhtml_local-bin-path).\n\
    \nAs an example, when you install the Python package of [cutadapt](#glossary.xhtml_term-cutadapt),\
    \ the `cutadapt` command will be installed in `$HOME/.local/bin`, which you can\
    \ then run from a terminal like this:\n\n```\ncutadapt --version\n```\n\nOutput:\n\
    \n```\n3.1\n```\n\n# 3.2.7. Python virtual environments\n\nA virtual environment\
    \ is a self-contained directory tree containing Python and some additional packages.\n\
    \n### Advantages\n\nThese are some advantages of using virtual environments.\n\
    \n### No administrator privileges\n\nYou do not need administrator privileges\
    \ to create a virtual environment or install packages in an environment.\n\n###\
    \ Multiple environments\n\nMultiple virtual environments can be created with each\
    \ containing their own sets of packages.\n\nThese are isolated and packages in\
    \ an environment can be installed, updated or removed without affecting other\
    \ environments.\n\n### Share your environment\n\nYou can share your configuration\
    \ with others. They will be able to reproduce your environment, with the exact\
    \ versions of packages.\n\n### Creating a virtual environment\n\nFirst, using\
    \ [The quick and easy method](../quick-and-easy/index.xhtml), search and install\
    \ the `python3-venv` package. This includes the `venv` module necessary for creating\
    \ virtual environments.\n"
