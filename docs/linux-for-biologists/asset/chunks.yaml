  trans: "\n从项目网站可以获取一个用于 Conda 操作的常用命令[速查表](https://docs.conda.io/projects/conda/en/latest/user-guide/cheatsheet.html)\
    \ [https://docs.conda.io/projects/conda/en/latest/user-guide/cheatsheet.html]。\n\
    \n## 创建环境\n\n要创建一个环境，请使用 `conda create` 命令和 `-n` 选项，后接环境名称——在本例中为 `blast`：\n\n\
    ```\nconda create -n blast\n```\n\n## 激活环境\n\n你可以使用以下命令获取所有环境的 `list`列表：\n\n```\n\
    conda envs list\n```\n\n要激活一个环境，请使用 `conda activate` 命令并加上环境的 `name`：\n\n```\n\
    conda activate blast\n```\n\n## 搜索、安装和使用包\n\n要搜索并安装包：\n\n1.  首先，如果你还没有激活，请激活环境。\n\
    \n    为了演示，我将激活之前创建的 `blast` 环境：\n\n    ```\n    conda activate blast\n    ```\n\
    \n2.  要搜索包，请在浏览器中打开 [Anaconda.org](https://anaconda.org/) [https://anaconda.org/]。\n\
    \n    在搜索包字段中输入搜索词并按回车键（图 65）。\n\n    ![在 Anaconda 云上搜索包](img/anaconda-search-blast.png)\n\
    \n    图 65 在 Anaconda.org 上搜索包。\n\n    或者，你也可以使用 `conda search` 命令：\n\n    ```\n\
    \    conda search blast\n    ```\n\n    这将输出匹配的包：\n\n    ```\n    Loading channels:\
    \ done\n    # Name   Version           Build  Channel\n    blast     2.2.31  \
    \             1  bioconda\n    ...\n    blast      2.9.0 pl526he19e7b1_7  bioconda\n\
    \    ...\n    blast     2.10.1 pl526he19e7b1_2  bioconda\n    ```\n\n3.  要安装该包，请使用\
    \ `conda install` 命令以及包的 `name` 和 `version` 号。\n\n    注意\n\n    你需要使用从搜索结果获得的程序\
    \ `highest` 版本号。否则，可能会安装旧版本。\n\n    ```\n    conda install blast==2.10.1\n   \
    \ ```\n\n4.  安装完成后，你就可以开始使用包中包含的程序，例如：\n\n    ```\n    (blast) user@cookbook:~$\
    \ blastn -version\n    ```\n\n    输出：\n\n    ```\n    blastn: 2.10.1+\n     Package:\
    \ blast 2.10.1, build Oct 14 2020 11:36:30\n    ```\n\n## 取消环境激活\n\n当你的工作完成后，可以取消环境激活。要要操作，请使用命令：\n\
    \n```\nconda deactivate\n```\n\n你的 shell 提示符将恢复到默认状态，即没有 Conda 环境名称——在本例中为 `(blast)`。\n\
    \n## 环境\n\n当你不再需要某个环境时，使用以下命令删除它：\n\n```\nconda remove -n blast --all\n```\n\n\
    这里 `-n` 用于指定你想要删除的环境名称，`--all` 则移除该环境中安装的所有包。\n\n# 3.5.4. 注意事项\n\n## 如何验证安装程序的\
    \ SHA256 校验和\n\n1.  导航到包含安装文件的文件夹——`Miniconda3-latest-Linux-x86_64.sh`：\n\n  \
    \  ```\n    cd Downloads\n    ```\n\n2.  使用 `sha256sum` 命令验证文件的 SHA256 校验和：\n\n\
    \    ```\n    sha256sum Miniconda3-latest-Linux-x86_64.sh\n    ```\n\n    输出：\n\
    \n    ```\n    879457af6a0bf5b34b48c12de31d4df0ee2f06a8e68768e5758c3293b2daf688\
    \  Miniconda3-latest-Linux-x86_64.sh\n    ```\n\n    `sha256sum` 命令的输出应与下载页面列出的值匹配。\n\
    \n## 为什么要禁用 base 环境的自动激活？\n\n如果你使用其他方法安装包，例如从 PyPI 安装 Python 包，你可能会`accidentally`\
    \ 将包安装到 Conda `base` 环境而不是预期的位置。\n\n即使你禁用了 `base` 环境的自动激活，也可以也可以需要时使用 `conda activate\
    \ base` 命令来激活它。\n\n# 3.6. Debian 包\n\n如果你感兴趣的软件以 Debian 包的形式提供，你可以使用 gdebi 程序来安装它。如果该软件有任何依赖，它们将被自动安装。\n\
    \n可以使用此方法安装的软件示例：\n\nRStudio Desktop — 用于 R 语言编程的 IDE。\n\nModeller — 一个用于比较三维结构的程序。\n\
    \nMEGA — 演化分析。\n\n## 3.6.1. 下载包\n\n为了演示安装 Debian 包的步骤，这里使用了 [RStudio](https://docs.conda.io/projects/conda/en/latest/user-guide/cheatsheet.html)\
    \ — 用于 R 语言编程的 IDE，[Modeller](https://docs.conda.io/projects/conda/en/latest/user-guide/cheatsheet.html)\
    \ — 一个用于比较三维结构的程序，以及 [MEGA](https://docs.conda.io/projects/conda/en/latest/user-guide/cheatsheet.html)\
    \ — 演化分析。\n\n[RStudio](https://docs.conda.io/projects/conda/en/latest/user-guide/cheatsheet.html)\
    \ — 用于 R 语言编程的 IDE，[Modeller](https://docs.conda.io/projects/conda/en/latest/user-guide/cheatsheet.html)\
