    \ only installs files in your home directory and so does not require administrator\
    \ privileges.\n\n# 3.2.2\\. Searching for a package on PyPI\n\nOpen [PyPI website](https://pypi.org)\
    \ [https://pypi.org] in a web browser.\n\nIn the Search projects field, enter\
    \ the name of the software you would like to install and press the ENTER key or\
    \ click on the search button ([Fig. 55](#search.xhtml_fig-321a)).\n\n![../../_images/pypi-search.png](_images/pypi-search.png)\n\
    \nFig. 55 Searching for a package on PyPI\n\nA list of packages matching the search\
    \ term will be displayed ([Fig. 56](#search.xhtml_fig-321b)).\n\n![../../_images/pypi-search-result.png](_images/pypi-search-result.png)\n\
    \nFig. 56 Search results for biopython. 1.78 is the version number.\n\nClick on\
    \ the result to proceed to the project description page.\n\nIn the project description\
    \ page, find the package name ([Fig. 57](#search.xhtml_fig-321c)) in the `pip``install`\
    \ command.\n\nIn this case, it is `biopython`.\n\n![../../_images/pypi-biopython-page.png](_images/pypi-biopython-page.png)\n\
    \nFig. 57 Project description page for Biopython\n\nNote\n\nYou will need to use\
    \ `pip3` instead of the `pip` command in the steps below. [Why?](#notes.xhtml_why-pip3)\n\
    \nYou can now proceed towards installing the package.\n\n# 3.2.3\\. Installing\
    \ a Python package\n\nOpen a terminal.\n\nUse the `pip3``install` command with\
    \ by the name of the package, you would like to install.\n\nUsing biopython as\
    \ an example:\n\n```\npip3 install biopython\n```\n\nOutput:\n\n```\n Collecting\
    \ biopython\n  Downloading biopython-1.78-cp38-cp38-manylinux1_x86_64.whl (2.3\
    \ MB)\n     |********************************| 2.3 MB 2.1 MB/s\nCollecting numpy\n\
    \  Downloading numpy-1.20.1-cp38-cp38-manylinux2010_x86_64.whl (15.4 MB)\n   \
    \  |********************************| 15.4 MB 90 kB/s\nInstalling collected packages:\
    \ numpy, biopython\nSuccessfully installed biopython-1.78 numpy-1.20.1\n```\n\n\
    Note\n\nOne limitation of this method is that, you will not be able to install\
    \ *multiple versions* of a package. This can be solved using a [virtual environment](#virtualenv.xhtml_virtualenv).\n\
    \n# 3.2.4\\. Updating an installed package\n\nWhen you notice an update is available\
    \ for the package, you can use the `install` command with the `-U` option, and\
    \ the name of the package:\n\n```\npip3 install -U biopython\n```\n\n# 3.2.5\\\
    . Removing an installed package\n\nUse the `uninstall` command with the name of\
    \ the package you would like to remove:\n\n```\npip3 uninstall biopython\n```\n\
    \n# 3.2.6\\. Using installed packages\n\n## Where are the files installed?\n\n\
    You can use the `pip3``show` command with the name of the package to identify\
    \ the path where it is installed:\n\n```\npip3 show biopython\n```\n\nOutput:\n\
    \n```\nName: biopython\nVersion: 1.78\nSummary: Freely available tools for computational\
    \ molecular biology.\nHome-page: https://biopython.org/\nAuthor: The Biopython\
    \ Contributors\nAuthor-email: biopython@biopython.org\nLicense: UNKNOWN\nLocation:\
    \ /home/user/.local/lib/python3.8/site-packages\nRequires: numpy\nRequired-by:\n\
    ```\n\nThe installation path will be listed next to the `Location` keyword.\n\n\
    ## Using Python packages and modules\n\nPython packages and modules will be installed\
    \ in `$HOME/.local/lib/python3.8/site-packages`.\n\nNote\n\nThis is the path for\
    \ Python 3.8.\n\nIf you have a different version of Python installed, this value\
    \ will change.\n\nThis directory will be automatically included in `$PYTHONPATH`.\
    \ So, you can import and use installed packages and modules in your scripts, without\
    \ any extra effort.\n\nFor example, here is a simple Python script to test BioPython\
    \ installed using pip:\n\n```\nfrom Bio.Seq import Seq\n\nseq = Seq('ATGC')\n\
    comp = seq.complement()\n\nprint(f'The complement of {seq} is {comp}')\n```\n\n\
    The `Bio.Seq` package is part of BioPython. Copy the code sample above and save\
    \ it as `biopy_test.py`. Then run it from the terminal like so:\n\n```\npython3\
    \ biopy_test.py\n```\n\nOutput:\n\n```\nThe complement of ATGC is TACG\n```\n\n\
    ## Using included commands\n\nIf the package includes commands, those will be\
    \ installed in `$HOME/.local/bin` directory. For these commands to be easily accessible,\
    \ you will need to add this directory to `PATH`, as mentioned under [requirements](#requirements.xhtml_local-bin-path).\n\
    \nAs an example, when you install the Python package of [cutadapt](#glossary.xhtml_term-cutadapt),\
    \ the `cutadapt` command will be installed in `$HOME/.local/bin`, which you can\
    \ then run from a terminal like this:\n\n```\ncutadapt --version\n```\n\nOutput:\n\
    \n```\n3.1\n```\n\n# 3.2.7\\. Python virtual environments\n\nA virtual environment\
    \ is a *self-contained* directory tree containing Python and some additional packages.\n\
    \n## Advantages\n\nThese are *some* advantages of using virtual environments.\n\
    \n### No administrator privileges\n\nYou do not need administrator privileges\
    \ to create a virtual environment or install packages in an environment.\n\n###\
    \ Multiple environments\n\nMultiple virtual environments can be created with each\
    \ containing their own sets of packages.\n\nThese are isolated and packages in\
    \ an environment can be installed, updated or removed without affecting other\
    \ environments.\n\n### Share your environment\n\nYou can share your configuration\
    \ with others. They will be able to reproduce your environment, with the exact\
    \ versions of packages.\n\n## Creating a virtual environment\n\nFirst, using [The\
    \ quick and easy method](../quick-and-easy/index.xhtml), search and install the\
    \ `python3-venv` package. This includes the `venv` module necessary for creating\
    \ virtual environments."
