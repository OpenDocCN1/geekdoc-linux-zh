    Fig. 75 Package installed successfully\n\n# 3. Launching installed programs\n\n\
    ## 3.1. Launching installed programs\n\nYou can launch installed programs from\
    \ the Applications Menu ([Fig. 76](#install.xhtml_fig-331k)).\n\n### Note\nThis\
    \ only applies to applications with a graphical user interface.\n\n![../../_images/11-launch-rstudio.png](_images/11-launch-rstudio.png)\n\
    Fig. 76 Launching installed program from applications menu\n\nThe main window\
    \ of the program will be displayed ([Fig. 77](#install.xhtml_fig-331l)).\n\n![../../_images/12-rstudio-main-window.png](_images/12-rstudio-main-window.png)\n\
    Fig. 77 Main window of RStudio Desktop\n\n# 3.6.3. Upgrading installed software\n\
    \nUpgrading software installed from a Debian package, is similar to installation.\
    \ When a new version of the program is available, download the package file (`.deb`)\
    \ and then follow the steps in [Installing a Debian package](#install.xhtml_installing-debian-package).\n\
    \n# 3.6.4. Removing installed software\n\nYou can follow the steps in [Removing\
    \ installed software](#removing-software.xhtml_removing-installed-software), to\
    \ search and remove packages installed in this manner.\n\n# 3.6.5. Notes\n\n###\
    \ 3.6.5.1 The command-line version\n\nYou can use the [apt](#glossary.xhtml_term-apt)\
    \ package manager to install Debian packages on the command-line.\n\n### 3.6.5.2\
    \ These programs need to be updated manually\n\nPrograms installed in this manner\
    \ will not *usually* be updated automatically. So, this method should only be\
    \ used for software not available using [The quick and easy method](../quick-and-easy/index.xhtml).\n\
    \n### 3.6.5.3 If dependencies cannot be located, installation will fail\n\nInstallation\
    \ of some programs might fail, if dependencies cannot be located in software repositories.\
    \ In that case, you will need to find and install those packages manually and\
    \ then attempt to install the program again.\n\n# 4. Using the Linux command line\n\
    \nIn this section, you will find an overview of the Linux command line, the shell\
    \ and terminal programs, some commonly used commands, and a sample exercise.\n\
