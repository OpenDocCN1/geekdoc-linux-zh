    \ and [wheel](#glossary.xhtml_term-wheel) in a new virtual environment.\n\nThese\
    \ build tools are necessary for building and installing packages from [PyPI](#glossary.xhtml_term-PyPI)\
    \ and other sources.\n\nInstalling them will ensure that additional packages will\
    \ build and install without errors.\n\n## Installing Python build tools\n\nUse\
    \ `pip3``install` to install or upgrade the required packages:\n\n```\npip3 install\
    \ -U pip setuptools wheel\n```\n\nThe `-U` option of `pip3``install`, will upgrade\
    \ listed packages, if newer versions are available.\n\nOutput:\n\n```\nCollecting\
    \ pip\nDownloading pip-21.0.1-py3-none-any.whl (1.5 MB)\n...\nInstalling collected\
    \ packages: pip, setuptools, wheel\n...\nSuccessfully installed pip-21.0.1 setuptools-54.2.0\
    \ wheel-0.36.2\n```\n\n## Deactivating a virtual environment\n\nTo exit a virtual\
    \ environment, use the command:\n\n```\ndeactivate\n```\n\nYour shell prompt will\
    \ change to its original appearance:\n\n```\nuser@cookbook:~$\n```\n\n# 3.2.8.\
    \ Notes\n\n## You will need to update these packages manually\n\nPackages installed\
    \ in this manner should also be updated manually.\n\nWhen you notice there is\
    \ an update for the package, for example, from the project’s website or from their\
    \ source code repository, follow the steps in [Updating an installed package](#update.xhtml_update-python-package)\
    \ to install the latest version.\n\n## Why pip3 and not pip?\n\nThe [pip](#glossary.xhtml_term-pip)\
    \ package includes the following commands:\n\n*   `pip3` — Python 3 version\n\n\
    *   `pip` — Python 2 version\n\n*Support for Python 2 ended in January 2020.*\n\
    \nSince there is a possibility for both commands to exist on a system, it is safer\
    \ to use `pip3` when installing packages using this method.\n\n## What about programs\
    \ written in Python 2?\n\n*Support for Python 2 ended in January 2020.*\n\nIf\
    \ you do need to use a program written only in Python 2, you can create an isolated\
    \ environment — either using Python venv or Conda and then install the package\
    \ there.\n\nRelated sections:\n\n*   [Python virtual environments](#virtualenv.xhtml_virtualenv)\n\
    \n*   [Conda packages](../conda/index.xhtml)\n\n## When should I use a virtual\
    \ environment?\n\nThe method described here will not work if the programs you\
    \ are installing require two different versions of the same package from PyPI.\n\
    \nIn that case, you can consider creating an isolated environment — either using\
    \ Python virtualenv or Conda and then installing the packages there.\n\nRelated\
    \ sections:\n\n*   [Python virtual environments](#virtualenv.xhtml_virtualenv)\n\
    \n*   [Conda packages](../conda/index.xhtml)\n\n## Older versions of pip\n\nIf\
    \ the version of pip installed in your system is older than 20.0, it will attempt\
    \ to install packages in system paths by default, resulting in *permission denied*\
    \ errors.\n\nTo avoid that, you will need to add the `--user` option to the `install`\
    \ and `uninstall` commands, for example:\n\n```\npip3 install --user biopython\n\
    ```\n\nA better approach is to *upgrade* your local version of pip. Once upgraded,\
    \ you will no longer need to user `--user`.\n\nTo upgrade pip, do:\n\n```\npip3\
    \ install --user -U pip\n```\n\nYou can check the installed version of pip using:\n\
    \n```\npip3 -V\n```\n\n# 3.3. Perl modules\n\nFor installing Perl modules, you\
    \ can configure the [local-lib](#glossary.xhtml_term-local-lib) module to create\
    \ and use a local directory. The default location is `$HOME/perl5`.\n\nIf your\
    \ software of interest is available on [CPAN](#glossary.xhtml_term-CPAN), you\
    \ can install it easily using the [cpanminus](#glossary.xhtml_term-cpanminus)\
    \ script.\n\nNote\n\nYour software of interest, might be available using [The\
    \ quick and easy method](../quick-and-easy/index.xhtml).\n\nSearch for package\
    \ names containing `perl`.\n\n*   [3.3.1. Requirements](#requirements.xhtml)\n\
    \n*   [3.3.2. Configuring local-lib module](#configure.xhtml)\n\n*   [3.3.3\\\
    . Searching for a module on CPAN](#search.xhtml)\n\n*   [3.3.4. Installing a Perl\
    \ module](#install.xhtml)\n\n*   [3.3.5\\. Using installed modules](#using.xhtml)\n\
    \n# 3.3.1\\. Requirements\n\n## The build-essential and cpanminus packages installed\n\
    \nIf you do not have them installed, follow [The quick and easy method](../quick-and-easy/index.xhtml),\
    \ and search and install the following packages:\n\n1.  `build-essential`\n\n\
    \    — installs compilers and build tools like `make`\n\n2.  `cpanminus`\n\n \
    \   — script to obtain, build and install modules from CPAN along with their [dependencies](#glossary.xhtml_term-dependencies)\n\
    \nAttention\n\n*You should not add sudo in the commands below.*\n\nThis method\
    \ only installs files in your home directory and so does not require administrator\
    \ privileges.\n\n# 3.3.2\\. Configuring local-lib module\n\nTo configure local-lib:\n\
    \nOpen the `$HOME/.bashrc` file in a [text editor](#glossary.xhtml_term-text-editor).\n\
    \nAdd the following text at the end of the file:\n\n```\n# Configuration for Perl\
    \ local-lib module\neval \"$(perl -Mlocal::lib)\"\n```\n\nSave the file.\n\nHere\
    \ is a sample `.bashrc`, for reference ([Fig. 58](#configure.xhtml_fig-322a)).\n\
    \n![../../_images/bashrc-local-lib.png](_images/bashrc-local-lib.png)\n\nFig.\
    \ 58 local-lib configuration in .bashrc\n\nOpen a new terminal window.\n\nYou\
    \ will notice the following message displayed ([Fig. 59](#configure.xhtml_fig-322b)):\n\
    \n![../../_images/local-lib-perl5.png](_images/local-lib-perl5.png)\n\nFig. 59\
    \ Attempting to create directory /home/user/perl5\n\n*Configuration is now complete*.\n\
    \nYou can now start installing modules from CPAN and other sources.\n\n# 3.3.3\\\
    . Searching for a module on CPAN\n\nOpen [MetaCPAN](#glossary.xhtml_term-MetaCPAN)\
    \ website ([https://metacpan.org](https://metacpan.org)) in a web browser.\n\n\
    In the Search field, enter the name of the module you would like to install and\
    \ click on the Search the CPAN button.\n\nI will use David H. Ardell’s [FAST](#glossary.xhtml_term-FAST)\
    \ package as an example. ([Fig. 60](#search.xhtml_fig-322c)).\n\n![../../_images/metacpan-fast.png](_images/metacpan-fast.png)\n\
    \nFig. 60 Searching for a module on MetaCPAN\n\nThis should display modules matching\
    \ the search term — `FAST` ([Fig. 61](#search.xhtml_fig-322d)).\n\n![../../_images/metacpan-fast-results.png](_images/metacpan-fast-results.png)\n\
    \nFig. 61 Search results for modules\n\nIf you click on the *appropriate* module\
    \ name, you will be taken to a description page, where you can learn more about\
    \ the module ([Fig. 62](#search.xhtml_fig-322e)).\n\n![../../_images/metacpan-fast-page.png](_images/metacpan-fast-page.png)\n\
    \nFig. 62 Module description page\n\nOn this page, you can also verify the module\
    \ name to use in the next step."
