    LQPELDSFKEELDKYFKNHTSPDVDLGDISGINASVVNIQKEIDRLNEVAKNLNESLIDL\nQELGKYEQYIKWPWYIWLGFIAGLIAIVMVTIMLCCMTSCCSCLKGCCSCGSCCKFDEDD\n\
    SEPVLKGVKLHYT\n```\n\nFor more control, you can use the [less](../commands/less.xhtml)\
    \ command instead of `cat`.\n\n# 4.5.5\\. Download protein sequence database\n\
    \nYou can follow these steps to download and prepare the protein sequence database:\n\
    \n1.  Create new directory\n\n2.  Change into it\n\n3.  Download the database\
    \ archive\n\n4.  Uncompress (or extract) the database archive\n\n5.  Format the\
    \ database\n\n## Create new directory — `mkdir`\n\nIn order to keep all BLAST\
    \ databases in one location, create a directory to store them using the [mkdir](../commands/mkdir.xhtml)\
    \ command:\n\n```\nmkdir ~/databases\n```\n\n## Change directory — `cd`\n\nChange\
    \ into the newly created directory using the [cd](../commands/cd.xhtml) command:\n\
    \n```\ncd ~/databases\n```\n\n## Download the database archive — `wget`\n\nVisit\
    \ the database [downloads](https://www.uniprot.org/downloads) [https://www.uniprot.org/downloads]\
    \ page on the UniProt website.\n\nNavigate to the UniProtKB section.\n\nRight-click\
    \ on the fasta download link corresponding to Reviewed (Swiss-Prot) and then copy\
    \ it to clipboard ([Fig. 84](#database.xhtml_fig-451)).\n\n![../../_images/swiss-prot-fasta.png](_images/swiss-prot-fasta.png)\n\
    \nFig. 84 Download link for Swiss-Prot database\n\nTo download the database, you\
    \ can use the `wget` command with the link to download as the argument:\n\n```\n\
    wget https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/complete/uniprot_sprot.fasta.gz\n\
    ```\n\nWhen the download is complete, you will find a file named `uniprot_sprot.fasta.gz`\
    \ in the current directory. You can use the [ls](../commands/ls.xhtml) command\
    \ to verify if it exists:\n\n```\nls -lh\n```\n\nOutput:\n\n```\ntotal 86M\n-rw-rw-r--\
    \ 1 user user 86M Feb 10 15:00 uniprot_sprot.fasta.gz\n```\n\nSince this file\
    \ is in a compressed format (`.gz`), you will need to uncompress it before proceeding.\n\
    \n## Uncompress the database archive — `gunzip`\n\nTo uncompress (or extract)\
    \ the database archive file downloaded in the previous step, you can use the `gunzip`\
    \ command.\n\nNote\n\nBy default, gunzip will remove the original compressed file\
    \ after extraction.\n\nIf you would like to keep the original file (`.gz`), you\
    \ can include the `-k` (keep input files) option with `gunzip`.\n\nProvide the\
    \ file name of the downloaded file as the argument:\n\n```\ngunzip uniprot_sprot.fasta.gz\n\
    ```\n\nWhen the extraction is complete, you will find the database file in FASTA\
    \ format in the same directory:\n\n```\nls -lh\n```\n\nOutput:\n\n```\ntotal 267M\n\
    -rw-rw-r-- 1 user user 267M Feb 10 15:00 uniprot_sprot.fasta\n```\n\n## View the\
    \ database\n\nSince this extracted database file is large, you can use the [head](../commands/head.xhtml)\
    \ command to view the first few lines of the file:\n\n```\nhead -n 5 uniprot_sprot.fasta\n\
    ```\n\nOutput:\n\n```\n>sp|Q6GZX4|001R_FRG3G Putative transcription factor 001R\
    \ OS=Frog virus 3 (isolate Goorha) OX=654924 GN=FV3-001R PE=4 SV=1\nMAFSAEDVLKEYDRRRRMEALLLSLYYPNDRKLLDYKEWSPPRVQVECPKAPVEWNNPPS\n\
    EKGLIVGHFSGIKYKGEKAQASEVDVNKMCCWVSKFKDAMRRYQGIQTCKIPGKVLSDLD\nAKIKAYNLTVEGVEGFVRYSRVTKQHVAAFLKELRHSKQYENVNLIHYILTDKRVDIQHL\n\
    EKDLVKDFKALVESAHRMRQGHMINVKYILYQLLKKHGHGPDGPDILTVKTGSKGVLYDD\n```\n\nAlternatively,\
    \ you can use the [less](../commands/less.xhtml) command to view it one page at\
    \ a time:\n\n```\nless uniprot_sprot.fasta\n```\n\nIf you would like to count\
    \ the number of sequences in the database, you can use the `grep` command.\n\n\
    ```\ngrep \">\" -c uniprot_sprot.fasta\n```\n\nOutput:\n\n```\n564277\n```\n\n\
    The `-c` option of `grep`, counts the number of times the given search string\
    \ (`>` in this case) occurs in the input file.\n\nNote\n\nA sequence in a FASTA\
    \ format should start with the `>` character. Hence, counting the number of times\
    \ it occurs gives the number of sequences in the file.\n\nYou can now proceed\
    \ towards formatting the database.\n\n## Format the database — `makeblastdb`\n\
    \nThe database needs to be formatted before it can be used in a BLAST search.\
    \ You can format it using the `makeblastdb` command, which is part of the NCBI\
    \ BLAST+ package.\n\nThe command has multiple options. Here is an example:\n\n\
    ```\n makeblastdb -in uniprot_sprot.fasta -parse_seqids \\\n-title \"Swiss-Prot\"\
    \ -dbtype prot -out swissprot\n```\n\nNote\n\nThe `\\` character splits the long\
    \ command into multiple lines.\n\nOutput:\n\n```\n Building a new DB, current\
    \ time: 03/24/2021 15:12:50\n New DB name:   /home/user/databases/swissprot\n\
    \ New DB title:  Swiss-Prot\n Sequence type: Protein\n Keep MBits: T\n Maximum\
    \ file size: 1000000000B\n Adding sequences from FASTA; added 564277 sequences\
    \ in 47.507 seconds.\n```\n\nWhat the options mean:\n\n`-in`\n\nFile name containing\
    \ input sequences.\n\n`-parse_seqids`\n\nParse sequence identifiers from the input\
    \ file. These will be displayed in search results.\n\n`-title`\n\nA descriptive\
    \ name for this database.\n\n`-dbtype`\n\nThe type of input sequences — acceptable\
    \ values are `prot` (for protein) and `nucl` (for nucleotide) sequences.\n\n`-out`\n\
    \nThe value here will be used to name the output files. This is also the name\
    \ you will need to use for the database while doing a search (see [New DB Name](#database.xhtml_new-db-name))\
    \ in output.\n\nWhen formatting is complete, you will notice the following files\
    \ in the `databases` directory:\n\n```\nls -lh\n```\n\nOutput:"
