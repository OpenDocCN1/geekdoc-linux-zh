    索引


    # 1. 关于本书


    本书的受众是新接触生物信息学的学生或研究人员。目标是让你熟悉命令行和 Galaxy。


    ## 1.1. 谁可以使用？


    如果你是学生或研究人员且是 Linux 新，本书重点是图形界面，但也包含了命令行。


    ## 1.2 你将学到什么


    通过包含的教程，你将学习如何：


    * 在电脑上运行 Linux

    * 使用桌面

    * 处理文件和目录

    * 搜索并安装软件

    * 使用一些基础命令

    * 在你的电脑上运行 Galaxy


    ## 1.3. 你需要什么


    为了遵循书中的教程，你需要：


    1. 一个 Linux 桌面

    2. 管理员权限


    ### 1.3.1. Linux 桌面


    Linux 世界充满了选择。有许多 Linux 版本（发行版）可以下载和使用。为了确保你能顺利完成本书，使用了 Linux Mint 20.1。包含的所有教程都在该发行版上测试过。


    #### 虚拟机镜像


    如果你没有 Linux 桌面，可以从本书网站下载虚拟机并在电脑上运行（见图 1](#what.xhtml_fig-1)）。


    ```

    ![../_images/linux-mint-virtualbox.png)

    ```


    图 1 在 VirtualBox 中运行 Linux Mint


    按照运行 Linux 虚拟机 中的步骤开始。


    #### 其他 Linux 发行版如何？


    虽然大多数教程适用于其他 Linux 发行版，但在某些情况下你可能需要修改。例如，你使用的应用程序可能与这里使用的文件管理器不同——你可能会使用 Nautilus
    或 Dolphin。如果遇到问题，我建议使用虚拟机。


    ### 1.3.2. 管理员权限


    书中的软件安装步骤需要管理员权限。在默认配置下，只有 root 或 `sudo` 用户组的成员才能 Linux 系统上安装软件。


    注意


    如果你使用的是随书提供的虚拟机，则不需要进行任何操作。


    ## 1.4. 关于作者


    *你好*。我是 Vimal。


