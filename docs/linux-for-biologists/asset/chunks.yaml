    [https://vimalkvn.com/linuxforbiologists](https://vimalkvn.com/linuxforbiologists)


    It is distributed as an [OVA](#glossary.xhtml_term-OVA) format file.


    Click on the download link and save the `linuxmint-20.1.ova` file to your computer.


    # 2.2.2\. Importing the virtual machine image


    Open VirtualBox on your computer and then follow the steps below to import the
    downloaded virtual machine image.


    ## Step 1 — Select OVA file


    From the main window of VirtualBox, select:


    File ‣ Import Appliance ([Fig. 9](#import.xhtml_fig-222a))


    ![../../_images/virtualbox-import-appliance.png](_images/virtualbox-import-appliance.png)


    Fig. 9 Select File –> Import Appliance from the menu


    In the Appliance to import screen, click on the button that appears next to the
    File entry field ([Fig. 10](#import.xhtml_fig-222b)).


    ![../../_images/virtualbox-select-ova.png](_images/virtualbox-select-ova.png)


    Fig. 10 Click on the button that appears next to the File entry field


    Browse to the location of the `linuxmint-20.1.ova` file, select it, and then click
    on the Open button.


    The File entry field will now have the complete path to the selected file ([Fig.
    11](#import.xhtml_fig-222c)).


    ![../../_images/virtualbox-import-proceed.png](_images/virtualbox-import-proceed.png)


    Fig. 11 Click on the Next button to proceed


    Click on the Next button to proceed.


    ## Step 2 — Adjust appliance settings (optional)


    In the next screen — Appliance settings ([Fig. 12](#import.xhtml_fig-222d)), you
    can modify the configuration of this virtual machine.


    Note


    *This step is optional*.


    You can click on the Import button at the bottom to proceed to the [next step](#import.xhtml_vm-import-progress).


    For example, you can add more CPU or RAM for this virtual machine, depending on
    the configuration of your computer.


    ![../../_images/virtualbox-appliance-settings.png](_images/virtualbox-appliance-settings.png)


    Fig. 12 Appliance settings screen


    Click on the Import button to proceed.


    ## Step 3 — Import progress and completion


    You will notice a progress bar at this stage ([Fig. 13](#import.xhtml_fig-222e)).


    ![../../_images/virtualbox-import-progress.png](_images/virtualbox-import-progress.png)


    Fig. 13 Virtual machine import progress


    When import is complete, you will be taken back to the main window of VirtualBox.


    The imported virtual machine — LinuxMint 20.1, will appear in the panel on the
    left ([Fig. 14](#import.xhtml_fig-222f)).


    ![../../_images/virtualbox-imported-vm.png](_images/virtualbox-imported-vm.png)


    Fig. 14 Imported virtual machine


    # 2.2.3\. Starting the virtual machine


    To start the virtual machine, select LinuxMint 20.1 and then click on the Start
    button in the main toolbar ([Fig. 15](#start.xhtml_fig-223a)).


    ![../../_images/virtualbox-start-vm.png](_images/virtualbox-start-vm.png)


    Fig. 15 Start virtual machine


    Once the boot process is complete, you will be logged in directly to the desktop
    ([Fig. 16](#start.xhtml_fig-223b)).


    ![../../_images/virtualbox-mint-welcome.png](_images/virtualbox-mint-welcome.png)


    Fig. 16 The Linux Mint desktop


    For reference, the default username is `user` and password is also `user`.


    # 2.2.4\. Stopping the virtual machine


    When your work is complete, you can shut down the virtual machine by clicking
    on the Quit button in Linux Mint’s Applications Menu.


    This will display a confirmation dialog ([Fig. 17](#stop.xhtml_fig-224a)).


    ![../../_images/shutdown.png](_images/shutdown.png)


    Fig. 17 Confirmation dialog for system shutdown


    Click on the Shut Down button to stop the virtual machine.


    # 2.3. The desktop


    Once you have started the virtual machine, you will be logged in directly to the
    desktop.


    For reference, the default user account for logging in to the virtual machine,
    is:


    Username: `user`Password: `user`


    *   [2.3.1\. The Cinnamon desktop](#cinnamon.xhtml)


    *   [2.3.2\. Changing system settings](#settings.xhtml)


    # 2.3.1\. The Cinnamon desktop


    In its default configuration, the Cinnamon desktop includes the following components
    ([Fig. 18](#cinnamon.xhtml_fig-231a)):


    Applications Menu


    — search and launch installed applications, logout, shutdown or restart system.


    Panel


    — launch pinned applications, manage open applications windows.


    System Tray


    — contains applets for managing the network, sound, power, software updates etc.,


    Calendar


    — provides current date and time, and a calendar.


    ![../../_images/cinnamon-desktop-components.png](_images/cinnamon-desktop-components.png)


    Fig. 18 Components of the Cinnamon desktop


    # 2.3.2\. Changing system settings


    The System Settings application can be used to customize the desktop, the operating
    system and hardware ([Fig. 19](#settings.xhtml_fig-232a)).


    You can launch it from the applications’ menu.


    ![../../_images/system-settings.png](_images/system-settings.png)


    Fig. 19 System Settings application


    The settings you can configure here include accessibility, user accounts, date
    and time, keyboard layout, language, network, display and more.


    ## Changing keyboard layout


    The default keyboard layout of the virtual machine is English (US).


    You can change this under:


    Hardware ‣ Keyboard ‣ Layouts


    ![../../_images/keyboard-layout.png](_images/keyboard-layout.png)


    Fig. 20 Keyboard layouts in System Settings


    ## Changing system date and time


    The system date and time can be updated by selecting:


    Preferences ‣ Date and Time


    ![../../_images/date-time.png](_images/date-time.png)


    Fig. 21 Date and time settings


    # 2.4\. Available software


    This is a brief overview of applications included in Linux Mint 20.1 Cinnamon.


    You can launch them from the Applications Menu ([Fig. 22](#index.xhtml_fig-24a)).
    You can search the list of installed applications using the search bar.


    ![../../_images/applications-menu.png](_images/applications-menu.png)


    Fig. 22 Launching an application


    Note


    Some applications discussed here are not included in the default installation.


    This includes [GNU Image Manipulation Program](#gimp.xhtml) and [Inkscape](#inkscape.xhtml).
    You can install them using [Software Manager](#glossary.xhtml_term-Software-Manager).


