    \ i.e., `/home/user`\n\n`$`\n\n— a regular user account. For the root user, this\
    \ will change to `#`\n\n# 4.2\\. Commands — an overview\n\nThis section provides\
    \ an overview of some commands that are used frequently on Linux systems.\n\n\
    Familiarity with these will help you navigate the file system and work with files,\
    \ and directories.\n\n*   [4.2.1\\. Command options](#options.xhtml)\n\n*   [4.2.2\\\
    . Getting help on using commands](#help.xhtml)\n\n*   [4.2.3\\. `date` — display\
    \ current date and time](#date.xhtml)\n\n*   [4.2.4\\. `cd` — change directory](#cd.xhtml)\n\
    \n*   [4.2.5\\. `mkdir` — create new directory](#mkdir.xhtml)\n\n*   [4.2.6\\\
    . `rmdir` — remove empty directory](#rmdir.xhtml)\n\n*   [4.2.7\\. `ls` — list\
    \ files](#ls.xhtml)\n\n*   [4.2.8\\. `cp` — copy files](#cp.xhtml)\n\n*   [4.2.9\\\
    . `cat` — display contents of files or combine them](#cat.xhtml)\n\n*   [4.2.10\\\
    . `less` — view and navigate file contents](#less.xhtml)\n\n*   [4.2.11\\. `head`\
    \ — print first few lines of a file](#head.xhtml)\n\n*   [4.2.12\\. `tail` — print\
    \ last few lines of a file](#tail.xhtml)\n\n*   [4.2.13\\. `mv` — move a file\
    \ or directory](#mv.xhtml)\n\n*   [4.2.14\\. `rm` — remove files or directories](#rm.xhtml)\n\
    \n*   [4.2.15\\. `echo` — display text or values of variables](#echo.xhtml)\n\n\
    # 4.2.1\\. Command options\n\nA command might support additional options.\n\n\
    For example, the command:\n\n```\nls\n```\n\n— prints a list of files in a directory,\
    \ whereas:\n\n```\nls -a\n```\n\n— will also print hidden files in that directory.\n\
    \n# 4.2.2\\. Getting help on using commands\n\nIn most cases, you can see the\
    \ complete list of options a command supports using `--help`:\n\n```\nls --help\n\
    ```\n\nOutput:"
