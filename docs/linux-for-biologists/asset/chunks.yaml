    \ by installing [Miniconda](#glossary.xhtml_term-Miniconda). You will need to\
    \ download and run the Miniconda installer following the steps below.\n\n## 1\\\
    . Downloading Miniconda\n\nTo download the correct version of Miniconda:\n\n1.\
    \  Open the Conda [downloads](https://docs.conda.io/en/latest/miniconda.html)\
    \ [https://docs.conda.io/en/latest/miniconda.html] page in a browser.\n\n2.  Navigate\
    \ to the Linux installers section ([Fig. 64](#install.xhtml_fig-324a))\n\n   \
    \ ![Miniconda installers for Linux](_images/miniconda-installers.png)\n\n    Fig.\
    \ 64 Miniconda installers for Linux\n\n3.  Click on the download link corresponding\
    \ to:\n\n    Python 3.8 — Miniconda3 Linux 64-bit\n\n    Save the file. It will\
    \ be saved as:\n\n    `Miniconda3-latest-Linux-x86_64.sh`\n\n    Note\n\n    You\
    \ can verify the file’s SHA256 checksum to ensure it has been downloaded correctly.\
    \ [How?](#notes.xhtml_verify-sha256sum)\n\n## 2\\. Running the installer\n\nRun\
    \ the installer using the `bash` command:\n\n```\nbash Miniconda3-latest-Linux-x86_64.sh\n\
    ```\n\nThis will print a welcome message:\n\n```\nWelcome to Miniconda3 py38_4.8.3\n\
    \nIn order to continue the installation process, please\nreview the license agreement.\n\
    Please, press ENTER to continue\n```\n\n## 3\\. Reviewing licence agreement\n\n\
    Press the ENTER key to view the licence agreement. Scroll down to read the licence.\
    \ Towards the end, you will notice a prompt:\n\n```\nDo you accept the license\
    \ terms? [yes|no]\n[no] >>> yes\n```\n\nYou will need to type *yes* to accept\
    \ the agreement and then press the ENTER key to proceed.\n\n## 4. Confirming Miniconda\
    \ install location\n\nNext, you will be asked to provide a path to install Miniconda.\n\
    \n```\nMiniconda3 will now be installed into this location:\n/home/user/miniconda3\n\
    \n  - Press ENTER to confirm the location\n  - Press CTRL-C to abort the installation\n\
    \  - Or specify a different location below\n\n[/home/user/miniconda3] >>>\n```\n\
    \nPress ENTER here to accept the default value.\n\nInstallation will now proceed.\
    \ When complete, you will notice a prompt asking if you would like to *initialize\
    \ Miniconda 3*.\n\n```\nDo you wish the installer to initialize Miniconda3\nby\
    \ running conda init? [yes|no]\n[no] >>> yes\n```\n\nType `yes` and then press\
    \ the ENTER key. This will add the `conda` command to your `$PATH`.\n\nAs a result\
    \ of this configuration, Conda `base` environment will be activated automatically\
    \ when you open a terminal session. This can be disabled in the next step. [Why?](#notes.xhtml_why-disable-auto-activate)\n\
    \n## 5. Disabling auto-activation of base environment\n\nOpen a new terminal.\
    \ Your shell prompt should now appear like the following:\n\n```\n(base) user@cookbook:~$\n\
    ```\n\nThe `(base)` label at the beginning of the prompt, indicates that Conda\
    \ base environment is now active.\n\nTo disable this behaviour, so you can activate\
    \ the environment manually when you need it, run the following command:\n\n```\n\
    conda config --set auto_activate_base false\n```\n\n## 6\\. Setting up channels\n\
    \nChannels provide additional software for Conda.\n\nConda’s configuration includes\
    \ a [defaults](https://repo.anaconda.com/pkgs) [https://repo.anaconda.com/pkgs]\
    \ channel. The [bioconda](#glossary.xhtml_term-bioconda) and [conda-forge](https://conda-forge.org/)\
    \ [https://conda-forge.org/] channels can also be added to access an even larger\
    \ collection of software. The bioconda channel, for example, provides over 7000\
    \ packages of Bioinformatics software.\n\nTo add these channels to your configuration,\
    \ you can run the commands below.\n\nAttention\n\n*You will need to run these\
    \ commands in the same order as given below.*\n\n```\nconda config --add channels\
    \ defaults\nconda config --add channels bioconda\nconda config --add channels\
    \ conda-forge\n```\n\n—\n\nInstallation and configuration of Conda is now complete.\n\
    \nYou can now start using Conda to create environments and install packages from\
    \ repositories.\n\n# 3.5.3\\. Using Conda\n\nIn this short guide on using Conda,\
    \ I will show you how to:\n\n1.  Create an environment\n\n2.  Activate the environment\n\
    \n3.  Search, install and use packages — using the NCBI BLAST+ program as an example\n\
    \n4.  Remove an environment when you no longer need it\n\nNote"
