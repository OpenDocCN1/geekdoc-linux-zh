    # 1. About this book


    The target audience for this book is students and researchers who are new to bioinformatics.
    The goal is to get you comfortable with the command-line and Galaxy.


    ## 1.1. Who is it?


    If you are a student or a researcher and are new to Linux, this book will help
    you get started. The primary focus is using graphical user interfaces (GUIs),
    but I have also included methods using the command line.


    ## 1.2. What you will learn


    Using the included recipes, you will learn how to:


    * Run Linux on your computer

    * Use the desktop

    * Work with files and directories

    * Search and install software

    * Run some basic commands

    * Run Galaxy on your computer


    Note


    *If you need help while following this book…* You can visit the forums of this
    book on Leanpub. If your query is not answered, please start a new discussion.


    [https://community.leanpub.com/c/linuxbiobi](https://community.leanpub.com/c/linuxbiobi)


    ## 1.3. What you will need


    To follow the recipes in this book, you will need:


    1. A Linux desktop

    2. Administrator privileges


    ### 1.3.1. Linux desktop


    The Linux and open-source world is full of choice. There are different versions
    (or distributions) of Linux that are available for download and use. To ensure
    that you can follow this book successfully, [Linux Mint](#notes.xhtml_linux-mint)
    20.1 is used as a reference distribution. All the included recipes have been tested
    on this distribution.


    #### Virtual machine image


    If you do not have access to a Linux desktop, you can download a virtual machine
    from the website of this book and use it to run a virtual machine on your computer
    ([Fig. 1](#what.xhtml_fig-1)).


    ```

    ![../_images/linux-mint-virtualbox.png)

    ```


    Fig. 1 Linux Mint running in VirtualBox


    Follow the steps in [Running a Linux virtual machine](../using-linux/virtual-machine/index.xhtml)
    to get started.


    #### What about other Linux distributions?


    Although most of the recipes will work on other Linux distributions, you will
    need to make changes in some cases. For example, the applications you use might
    be different — instead of the [Files](#notes.xhtml_term-files) file manager used
    here, you might use Nautilus or Dolphin. If there are problems, I recommend you
    use the [virtual machine](../using-linux/virtual-machine/index.xhtml).


    ### 1.3.2. Administrator privileges


    The software installation steps in this book will need administrator privileges.
    In the default configuration, only [root](#notes.xhtml_term-root) or members of
    the `sudo` user group will be able to install software on a Linux system.


    Note


    If you are using the [virtual machine](#what.xhtml_vm-download), distributed with
    this book, you do not need to do anything.


    ## 1.4. About the author


    *Hello*. I’m Vimal.

