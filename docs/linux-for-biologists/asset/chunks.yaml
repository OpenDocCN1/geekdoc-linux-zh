    \ nano, use the `Ctrl``+``x` shortcut.\n\nIf there are no changes, nano will close.\
    \ If there are unsaved changes, it will prompt you to save them ([Fig. 83](#exit.xhtml_fig-444a)).\n\
    \n![../../_images/nano-save-changes.png](_images/nano-save-changes.png)\n\nFig.\
    \ 83 Confirmation to save changes to file\n\nType `y` to save changes or `n` to\
    \ discard them.\n\n# 4.5\\. Exercise — using the command-line\n\nThis is an exercise\
    \ in using the command-line to accomplish a task. You will be making use of the\
    \ commands [discussed earlier](../commands/index.xhtml).\n\nTask\n\nGiven a protein\
    \ sequence, identify matching sequences from a protein sequence database.\n\n\
    Approach\n\nUsing programs in the NCBI BLAST+ package, you can search a database\
    \ of sequences using sequence (query) to identify matching sequences.\n\n*   [4.5.1\\\
    . Summary of steps](#summary.xhtml)\n\n*   [4.5.2\\. Get sample data](#sample.xhtml)\n\
    \n*   [4.5.3\\. Install NCBI BLAST+ package](#install.xhtml)\n\n*   [4.5.4\\.\
    \ Download query sequence](#query.xhtml)\n\n*   [4.5.5\\. Download protein sequence\
    \ database](#database.xhtml)\n\n*   [4.5.6\\. Search database using query sequence](#search.xhtml)\n\
    \n# 4.5.1\\. Summary of steps\n\n1.  Install NCBI BLAST+\n\n2.  Download protein\
    \ query sequence\n\n3.  Download protein sequence database and format it\n\n4.\
    \  Search database using the query sequence\n\n# 4.5.2\\. Get sample data\n\n\
    To proceed, you will need to download the protein query sequence and database\
    \ used in this exercise.\n\n## Download query sequence\n\nThe protein query sequence\
    \ used in this exercise is *Spike glycoprotein* from Severe acute respiratory\
    \ syndrome coronavirus 2 (SARS-CoV-2). It is available from [UniProtKB](https://uniprot.org/uniprot/)\
    \ [https://uniprot.org/uniprot/] — the protein knowledge base.\n\nThe database\
    \ identifier for this protein is [P0DTC2](https://www.uniprot.org/uniprot/P0DTC2)\
    \ [https://www.uniprot.org/uniprot/P0DTC2]. You can download the sequence in FASTA\
    \ format from the entry page or using this direct link:\n\n[https://www.uniprot.org/uniprot/P0DTC2.fasta](https://www.uniprot.org/uniprot/P0DTC2.fasta)\n\
    \n## Download protein database\n\nThe database used in this exercise is UniProtKB\
    \ [Swiss-Prot](https://uniprot.org/uniprot/?query=reviewed:yes) [https://uniprot.org/uniprot/?query=reviewed:yes].\
    \ It is a manually annotated database of protein sequences with added functional\
    \ information.\n\nYou can download the entire database as a compressed FASTA format\
    \ file from the [downloads](https://www.uniprot.org/downloads) [https://www.uniprot.org/downloads]\
    \ page on the website.\n\n# 4.5.3\\. Install NCBI BLAST+ package\n\nAttention\n\
    \n*This procedure installs software in system paths and so requires administrator\
    \ privileges.*\n\nNCBI BLAST+ is available in the Linux package repositories.\
    \ You can install it using `apt`:\n\n```\nsudo apt install ncbi-blast+\n```\n\n\
    Type `y` when prompted to continue.\n\n```\n[sudo] password for user:\nReading\
    \ package lists... Done\nBuilding dependency tree\nReading state information...\
    \ Done\nThe following additional packages will be installed:\n  libmbedcrypto3\
    \ libmbedtls12 libmbedx509-0 ncbi-data\nThe following NEW packages will be installed:\n\
    \  libmbedcrypto3 libmbedtls12 libmbedx509-0 ncbi-blast+ ncbi-data\n0 upgraded,\
    \ 5 newly installed, 0 to remove and 0 not upgraded.\nNeed to get 14.9 MB of archives.\n\
    After this operation, 75.0 MB of additional disk space will be used.\nDo you want\
    \ to continue? [Y/n] y\n```\n\n# 4.5.4\\. Download query sequence\n\nYou can follow\
    \ these steps to download the query sequence:\n\n1.  Create new directory"
