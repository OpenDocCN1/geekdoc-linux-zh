    # 4.2.12. `tail` — 打印文件的最后几行


    使用 `tail` 命令，你可以查看文件的最后几行（默认： 10 行）。


    例如：


    ```

    tail /usr/share/dict/words

    ```


    ```

    élan''s

    émigré

    émigré''s

    émigrés

    épée

    épée''s

    épées

    étude

    étude''s

    études

    ```


    在早之前 讨论过的 `tail` 和 `head` 命令在两种情况下，它们在你想要快速查看大型文本文件的内容时非常有用。


    在上述两种情况下，你都可以使用 `-n` 选项来控制显示的行数，而不是默认值（10）。


    例如：


    ```

    tail -n 5 /usr/share/dict/words

    ```


    将显示文件的最后 5 行。


    # 4.2.13. `mv` — 移动文件或目录


    使用 `mv` 命令，你可以将文件或目录从一个位置（源）移动到另一个位置（目的地）。你可以选择保留现有的文件或目录名称或将其重命名。


    命令的基本格式是：


    ```

    mv source destination

    ```


    更安全的方法是给命令添加 `-iv` 选项：


    ```

    mv -iv source destination

    ```


    使用 `-i`（交互式），如果目的地已存在文件或目录，`mv` 将要求你进行确认。`-v`（详细）将在屏幕上打印命令的操作。


    为了方便起见，你可以为命令添加别名。


    ## 示例文件


    要遵循以下示例，你需要使用 cp 命令将以下文件复制到家目录：


    ```

    cp -v /usr/share/dict/words ~

    cp -rv /usr/share/doc/bash ~

    ```


    `~` 是家目录的快捷方式。


    ## 移动文件或目录


    简单的用例是将文件或目录从一个位置（目录）移动到另一个。


    ### 移动文件


    例如，将上述 复制的 `words` 文件移动到 `Documents` 目录，使用：


    ```

    mv -iv Documents/

    ```


    输出：


    ```

    renamed ''words'' -> ''Documents/''

    ```


    ### 移动目录


    同样，将上述 复制的 `bash` 目录移动到 `Documents` 目录，使用：


    ```

    mv -iv Documents/

    ```


    输出：


    ```

    renamed ''bash'' -> ''Documents/''

    ```


    在这两种情况下，文件或目录的名字都不会改变。


    ## 重命名文件或目录


    在这种情况下，你想重命名文件或目录。


    ### 重命名文件


    将上述 复制的 `words` 文件重命名为 `dictionary.txt`，使用：


    ```

    mv -iv words dictionary.txt

    ```


    或者，将其移动到 `Documents` 目录并同时重命名，使用：


    ```

    mv -iv words/dictionary.txt

    ```


    ### 重命名目录


    将上述 复制的 `bash` 目录重命名为 `bash-commands`，使用：


    ```

    mv -iv bash-commands

    ```


    ## 注意事项


    ### 如果文件存在会怎样？


    你会看到提示要求你确认覆盖文件。输入 `y` 并按回车键继续：


    ```

    mv: overwrite ''Documents/words''? y

    renamed ''words'' -> ''Documents/words''

    ```


    只需在提示处按回车键即可取消。


    ### 如果目录存在会怎样？


    `mv` 只有在目录为空时才会覆盖。你可以：


    * 将文件复制 到目标目录


    * 重命名目标目录


    ### 为 `mv` 添加别名


    与其每次使用命令时都输入 `mv-iv`，你可以在 `~/.bash_aliases` 文件中为命令添加别名。


    例如：


    ```

    alias mv=''mv -iv''

    ```


    现在，当你输入 `mv` 时，实际上使用的是 `mv -iv`。


    # 4.2.14. `rm` — 删除文件或目录


    使用 `rm` 命令，你可以删除文件或目录。


    命令的基本格式是：


    ```

    rm source

    ```


    更安全的方法是给命令添加 `-iv` 选项：


    ```

    rm -iv source

    ```


    使用 `-i`（交互式），如果文件或目录已存在，`rm` 在删除前将要求你进行确认。`-v`（详细）将在屏幕上打印命令的操作。


    为了方便起见，你可以添加别名。


    ## 示例文件


    要遵循以下示例，你需要使用 cp 命令将以下文件复制到家目录：


    ```

    cp -v /usr/share/dict/words ~

    cp -rv /usr/share/doc/bash ~

    ```


    `~` 是家目录的快捷方式。


    ## 删除文件


    简单的用例是删除文件。


    ### 删除文件


    例如，删除上述 复制的 `words` 文件，使用：


    ```

    rm -iv words

    ```


    输出：


    ```

    removed ''words''

    ```


    ### 删除目录


    同样，删除上述 复制的 `bash` 目录，使用：


    ```

    rm -iv bash

    ```


    输出：


    ```

    removed ''bash''

    ```


    ## 删除目录


    在这种情况下，你想删除一个目录。


    ### 删除空目录


    要删除空目录，使用：


    ```

    rm -iv directory

    ```


    ### 删除带有内容的目录


    要删除包含文件的目录，使用 `-r` 选项：


    ```

    rm -ivr directory

    ```


    ## 注意事项


    ### 如果文件存在会怎样？


    你会看到提示要求你确认删除文件。输入 `y` 并按回车键继续：


    ```

    rm: remove regular file ''filename''? y

    removed

    ```


    只需在提示处按回车键即可取消。


    ### 如果目录存在会怎样？


    `rm` 只有在目录为空时才会删除。要进行递归删除，使用 `-r` 选项。


    ### 为 `rm` 添加别名


    与其每次使用命令时都输入 `rm-iv`，你可以在 `~/.bash_aliases` 文件中为命令添加别名。


    例如：


    ```

    alias rm=''rm -iv''

    ```


    现在，当你输入 `rm` 时，实际上使用的是 `rm -iv`。


    # 4.2.15. `echo` — 显示文本或值


    使用 `echo` 命令，你可以打印文本或变量的值。


    命令的基本格式是：


    ```

    echo text_or_value

    ```


    ## 显示文本


    要在屏幕上打印文本，使用 `echo` 后接你想打印的内容：


    ```

    echo "Hello, This is echo!"

    ```


    输出：


    ```

    Hello, This is echo!

    ```


    ## 显示变量值


    你还可以使用 `echo` 显示环境变量的值。


    例如：


    ```

    echo $PATH

    ```


    `PATH` 中的 `$` 表示这是一个变量。


    输出：


    ```

    /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin

    ```


    `PATH` 包含了用于查找程序或命令的路径（目录）列表。你可以在 `~/.bashrc` 中设置或修改环境变量。


    # 4.3. 其他有用命令


    这些是你可能需要的命令。


    * 4.3.1. `df` — 报告磁盘使用情况

    * 4.3.2. `du` — 估算文件或目录的磁盘使用情况

    * 4.3.3. `find` — 搜索文件

    * 4.3.4. `free` — 查看空闲和已内存

    * 4.3.5. `locate` — 使用名称查找文件

    * 4.3.6. `which` — 定位命令


    # 4.3.1. `df` — 报告磁盘使用情况


    `df` 命令将报告连接到系统的所有存储设备的已用和可用磁盘空间。


    例如，要查找 `/` — 根文件系统的磁盘使用量，你可以使用命令：


    ```

    df -h /

    ```


    输出：


    '
