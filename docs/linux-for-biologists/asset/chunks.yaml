  trans: "\n\n```\nFilesystem               Size  Used Avail Use% Mounted on\n/dev/mapper/vgmint-root\
    \   28G  6.9G   20G  26% /\n```\n\n`-h` 选项使输出具有人类可读性。如果没有此选项，可用磁盘空间将报告为 `20600196`\
    \ 而不是 `20G`。\n\n# 4.3.2. `du` — 估计文件或目录的磁盘占用\n\n计算文件或目录占用的磁盘空间。\n\n例如，要计算家目录下文件占用的磁盘空间，可以使用以下命令：\n\
    \n```\ndu -sh ~\n```\n\n输出：\n\n```\n7.4G .\n```\n\n`-s` 选项打印摘要，而不是打印每个文件占用的空间。\n\
    \n`-h` 使输出具有人类可读性。\n\n# 4.3.3. `find` — 搜索文件\n\n使用文件名、文件类型等搜索文件。\n\n例如，要在主目录中查找文件名包含\
    \ `.bash` 的文件，可以使用以下命令：\n\n```\nfind ~ -name \".bash*\"\n```\n\n输出：\n\n```\n/home/user/.bashrc\n\
    /home/user/.bash_history\n/home/user/.bash_logout\n```\n\n注意\n\n这里的 `~` 是家目录的快捷方式。\n\
    \n`.bash*` 中的星号 (`*`) 起通配符的作用。\n\n`find` 命令不使用数据库，因此与 `locate` 相比，搜索速度会较慢。然而，它可以识别最近创建或修改的文件。\n\
    \n# 4.3.4. `free` — 查看空闲和使用的内存\n\n通过 `free`，你可以找到空闲和使用的内存（RAM）以及交换空间。\n\n用法：\n\
    \n```\nfree -h\n```\n\n输出：\n\n```\n total        used        free      shared\
    \  buff/cache   available\nMem:          3.8Gi       618Mi       1.3Gi       7.0Mi\
    \       1.9Gi       3.0Gi\nSwap:         979Mi          0B       979Mi\n```\n\n\
    `-h` 选项使输出具有人类可读并显示相应的单位。在上面的示例中，空闲物理内存（RAM）的数量为 1.3 GiB（二进制字节）。\n\n# 4.3.5. `locate`\
    \ — 使用文件名查找文件\n\n使用文件名搜索文件。这种方法非常快，因为它使用了文件名数据库。\n\n例如：\n\n```\nlocate bashrc\n\
    ```\n\n输出：\n\n```\n/etc/bash.bashrc\n/etc/skel/.bashrc\n/home/user/.bashrc\n...\n\
    ```\n\n注意\n\n这种方法可能找不到最近创建或修改的文件。\n\n较新的文件可能尚未包含在数据库中。要手动更新数据库，你可以运行命令：\n\n```\n\
    sudo updatedb\n```\n\n或者，你可以使用 `find` 命令来搜索新文件。\n\n# 4.3.6. `which` — 定位命令\n\n\
    如果命令存在于搜索路径（即 `$PATH`）中，`which` 命令会打印该命令的完整路径。\n\n例如：\n\n```\nwhich python3\n\
    ```\n\n输出：\n\n```\n/usr/bin/python3\n```\n\n# 4.4. 使用 nano 编辑文本文件\n\n`GNU` `nano`\
    \ 是一个命令行文本编辑器，具有撤销/重做、语法高亮、交互式搜索和替换等功能。\n\n要打开程序，请在终端会话中输入 `nano`。\n\n*   4.4.1.\
    \ 创建新文件\n*   4.4.2. 从剪贴板粘贴文本\n*   4.4.3. 保存更改\n*   4.4.4. 退出 nano\n\n# 4.4.1.\
    \ 创建新文件\n\n要创建一个新文件，使用 `nano` 后跟想要创建的文件名。\n\n例如：\n\n```\nnano exercise.txt\n```\n\
    \n这将以写入模式打开文件（图 80）。\n\n![../../_images/nano-create-file.png](img/nano-create-file.png)\n\
    \n在 nano 中创建文件\n\n在此阶段你可以开始输入文本。\n\n# 4.4.2. 从剪贴板粘贴文本\n\n要从不同的程序（例如浏览器）复制并粘贴文本到正在\
    \ nano 编辑的文件中，执行以下操作：\n\n1.  使用 `Ctrl+c` 将文本复制到剪贴板\n2.  在 nano 中，将光标移动到你想粘贴文本的位置\n\
    3.  使用快捷键 `Shift+Ctrl+v` 粘贴文本\n\n# 4.4.3. 保存更改\n\n要保存文件，使用快捷键 `Ctrl+o`。\n\n这对应于底部显示的\
    \ `^O` 写入（图 81）。这里的 `^` 代表 `Ctrl` 键。\n\n![../../_images/nano-write-out.png](img/nano-write-out.png)\n\
    \n要保存更改时使用写入功能\n\n底部将显示如下的提示符（图 82）：\n\n```\nFile Name: exercise.txt\n```\n\n\
    ![../../_images/nano-create-file.png](img/nano-create-file.png)\n\n要保存的文件名\n\n\
    按 `Enter` 键确认文件名。\n\n# 4.4.4. 退出 nano\n\n要退出 nano，按 `Ctrl+x`。如果你进行了更改，它会询问你是否要保存。\n\
    \n"
- fmt: "\n## 2. Change into it\n\n## 3. Download query sequence\n\n## 4. View the\
    \ downloaded sequence (optional)\n\n## Create new directory — `mkdir`\n\nTo keep\
    \ the input and output files related to this project together, create a new directory\
    \ in your home directory using the [`mkdir`](../commands/mkdir.xhtml) command.\n\
    \n```\nmkdir -p ~/projects/sars-cov-2\n```\n\nHere:\n\n`~` is shortcut for home\
    \ directory.\n\n`-p` creates parent directories if necessary. In this case, the\
    \ `projects` directory does not exist, so it is also created.\n\n## Change directory\
    \ — `cd`\n\nChange into the newly created directory using the [`cd`](../commands/cd.xhtml)\
    \ command:\n\n```bash\ncd ~/projects/sars-cov-2\n```\n\n## Download sequence —\
    \ `wget`\n\nTo download the sequence file, you can use the `wget` command with\
    \ the link to download as the argument. In this case, the link to download is\
    \ the URL corresponding to the FASTA format file (see [sample data](#sample.xhtml_sample-data)):\n\
    \n```bash\nwget https://www.uniprot.org/uniprot/P0DTC2.fasta\n```\n\nWhen the\
    \ download is complete, you can use the [`ls`](../commands/ls.xhtml) command to\
    \ verify if the file exists:\n\n```bash\nls -l\n```\n\nOutput:\n\n```\ntotal 4\n\
    -rw-rw-r-- 1 user user 1414 Feb 10 00:00 P0DTC2.fasta\n```\n\n## View downloaded\
    \ sequence — `cat` or `less`\n\nSince `P0DTC2.fasta` is in FASTA format — a plain-text\
    \ format, you can use the [`cat`](../commands/cat.xhtml) command to view the file’s\
    \ contents:\n\n```bash\ncat P0DTC2.fasta\n```\n\nOutput:\n\n```\n>sp|P0DTC2|SPIKE_SARS2\
    \ Spike glycoprotein OS=Severe acute respiratory syndrome coronavirus 2 OX=2697049\
    \ GN=S PE=1 SV=1\nMFVFLVLLPLVSSQCVNLTTRQQLPPAYTNSFTRGVYYPDKVFRSSVLHSTQDLFLPFFS\n\
    NVTWFHAIHVSGTNGTKRFDNPVLPFNDGVYFASTEKSNIIRGWIFGTTLDSKTQSLLIV\nNNATNVVIKVCEFQFCNDPFLGVYYHKNNKSWMESEFRVYSSANNCTFEYVSQPFLMDLE\n\
    GKQGNFKNLREFVFKNIDGYFKIYSKHTPINLVRDLPQGFSALEPLVDLPIGINITRFQT\nLLALHRSYLTPGDSSSGWTAGAAAYYVGYLQPRTFLLKYNENGTITDAVDCALDPLSETK\n\
    CTLKSFTVEKGIYQTSNFRVQPTESIVRFPNITNLCPFGEVFNATRFASVYAWNRKRISN\nCVADYSVLYNSASFSTFKCYGVSPTKLNDLCFTNVYADSFVIRGDEVRQIAPGQTGKIAD\n\
    YNYKLPDDFTGCVIAWNSNNLDSKVGGNYNYLYRLFRKSNLKPFERDISTEIYQAGSTPC\nNGVEGFNCYFPLQSYGFQPTNGVGYQPYRVVVLSFELLHAPATVCGPKKSTNLVKNKCVN\n\
    FNFNGLTGTGVLTESNKKFLPFQQFGRDIADTTDAVRDPQTLEILDITPCSFGGVSVITP\nGTNTSNQVAVLYQDVNCTEVPVAIHADQLTPTWRVYSTGSNVFQTRAGCLIGAEHVNNSY\n\
    ECDIPIGAGICASYQTQTNSPRRARSVASQSIIAYTMSLGAENSVAYSNNSIAIPTNFTI\nSVTTEILPVSMTKTSVDCTMYICGDSTECSNLLLQYGSFCTQLNRALTGIAVEQDKNTQE\n\
    VFAQVKQIYKTPPIKDFGGFNFSQILPDPSKPSKRSIEDLLFNKVTLADAGFIKQYGDC\nLGDIAARDLICAQKFNGLTVLPPLLTDEMIAQYTSALLAGTITSGWTFGAGAALQIPFAM\n\
    QMAYRFNGIGVTQNVLYENQKLIANQFNSAIGKIQDSLSSTASALGKLQDVVNQNAQALN\nTLVKQLSSNFGAISSVLNDILSRLDKVEAEVQIDRLITGRLQSLQTYVTQQLIRAAEIRA\n\
    SANLAATKMSECVLGQSKRVDFCGKGYHLMSFPQSAPHGVVFLHVTYVPAQEKNFTTAPA\nICHDGKAHFPREGVFVSNGTHWFVTQRNFYEPQIITTDNTFVSGNCDVVIGIVNNTVYDP\n\
    LQPELDSFKEELDKYFKNHTSPDVDLGDISGINASVVNIQKEIDRLNEVAKNLNESLIDL\nQELGKYEQYIKWPWYIWLGFIAGLIAIVMVTIMLCCMTSCCSCLKGCCSCGSCCKFDEDD\n\
    SEPVLKGVKLHYT\n```\n\nFor more control, you can use the [`less`](../commands/less.xhtml)\
    \ command instead of `cat`.\n\n# 4.5.5. Download protein sequence database\n\n\
    You can follow these steps to download and prepare the protein sequence database:\n\
    \n1. Create new directory\n2. Change into it\n3. Download the database archive\n\
    4. Uncompress (or extract) the database archive\n5. Format the database\n\n##\
    \ Create new directory — `mkdir`\n\nIn order to keep all BLAST databases in one\
    \ location, create a directory to store them using the [`mkdir`](../commands/mkdir.xhtml)\
    \ command:\n\n```bash\nmkdir ~/databases\n```\n\n## Change directory — `cd`\n\n\
    Change into the newly created directory using the [`cd`](../commands/cd.xhtml)\
    \ command:\n\n```bash\ncd ~/databases\n```\n\n## Download the database archive\
    \ — `wget`\n\nVisit the [downloads](https://www.uniprot.org/downloads) page on\
    \ the UniProt website. Navigate to the `UniProtKB` section. Right-click on the\
    \ `fasta` download link corresponding to `Reviewed (Swiss-Prot)` and then copy\
    \ it to clipboard.\n\nTo download the database, you can use the `wget` command\
    \ with the link to download as the argument:\n\n```bash\nwget https://ftp.uniprot.org/pub/databases/uniprot/current_release/complete/uniprot_sprot.gz\n\
    ```\n\nWhen the download is complete, you will find a file named `uniprot_sprot.gz`\
    \ in the current directory. You can use the [`ls`](../commands/ls.xhtml) command\
    \ to verify if it exists:\n\n```bash\nls -lh\n```\n\nOutput:\n\n```\ntotal 86\n\
    -rw-rw-r-- 1 user user 86M Feb 10 15:00 uniprot_sprot.gz\n```\n\nSince this file\
    \ is in compressed format (`.gz`), you will need to uncompress it before proceeding.\n\
    \n## Uncompress the database archive — `gunzip`\n\nTo uncompress (or extract)\
    \ the database archive downloaded in the previous step, you can use the `gunzip`\
    \ command.\n\nBy default, `gunzip` will remove the original compressed file. If\
    \ you would like to keep the original file (`.gz`), include the `-k` (keep input\
    \ files) option with `gunzip`. Provide the file name of the downloaded file as\
    \ the argument:\n\n```bash\ngunzip uniprot_sprot.gz\n```\n\nWhen the extraction\
    \ is complete, you will find the database file in FASTA format in the same directory:\n\
    \n```bash\nls -lh\n```\n\nOutput:\n\n```\ntotal 267M\n-rw-rw-r-- 1 user user 267M\
    \ Feb 10 15:00 uniprot_sprot.fasta\n```\n\n## View the database\n\nSince this\
    \ extracted database file is large, you can use the [`head`](../commands/head.xhtml)\
    \ command to view the first few lines of the file:\n\n```bash\nhead -n 5 uniprot_sprot.fasta\n\
    ```\n\nOutput:\n\n```\n>sp|Q6GZX4|001R_FRG3 Putative transcription factor 001R\
    \ OS=Frog virus 3 (isolate Goha) OX=654924 GN=FV3-001R PE=4 SV=1\nMAFSAEDVLKEYDRRRMEALLLSLYYPNDRKLLDYKEWSPPRVQVECPKAPVEWNNPPS\n\
    EKGLIVGHFSGIKYKGEKAASEVDVNKMCCWVSKFKDAMRRYQGITCKIPGKVLSDLD\nAKIKAYNLTVEGGFVRYSRVTKQHVAAFLKELRHSKQYENVNLIHYILTDKRVDIQHL\n\
    EKDLVKDFVESAHRMRQGHMINVKYILYQLLKKHGHGPDGILTVGS\n```\n\nAlternatively, you can\
    \ use the [`less`](../commands/less.xhtml) command to view it one page at a time:\n\
    \n```bash\nless uniprot_sprot.fasta\n```\n\nIf you would like to count the number\
    \ of sequences in the database, you can use the `grep` command.\n\n```bash\ngrep\
    \ \">\" -c uniprot_sprot.fasta\n```\n\nOutput:\n\n```\n564277\n```\n\nThe `-c`\
    \ option of `grep`, counts the number of times the given search string (`>` in\
    \ this case) occurs in the input file.\n\nA sequence in FASTA format should start\
    \ with the `>` character. Hence, counting the number of times it occurs gives\
    \ the number of sequences in the file.\n\n## Format the database — `makeblastdb`\n\
    \nThe database needs to be formatted before it can be used in a BLAST search.\
    \ You can format it using the `makeblastdb` command, which is part of the NCBI\
    \ BLAST+ package.\n\nThe command has multiple options. Here is an example:\n\n\
    ```bash\nmakeblastdb -in uniprot_sprot.fasta -parse_seqids \\\n-title \"Swiss-Prot\"\
    \ -dbtype prot -out swissprot\n```\n\nNote: The `\\` character splits the long\
    \ command into multiple lines.\n\nOutput:\n\n```\n Building a new DB, current\
    \ time: 03/24/2021 15:12:50\n New DB name:   /home/user/databases/swissprot\n\
    \ New DB title:  Swiss-Prot\n Sequence type: Protein\n Keep MBits: T\n Maximum\
    \ file size: 1000000000B\n Adding sequences from FASTA; added 564277 sequences\
    \ in 47.507 seconds.\n```\n\nWhat the options mean:\n\n- `-in`: File name containing\
    \ input sequences.\n- `-parse_seqids`: Parse sequence identifiers from the input\
    \ file. These will be displayed in search results.\n- `-title`: A descriptive\
    \ name for this database.\n- `-dbtype`: The type of input sequences — acceptable\
    \ values are `prot` (for protein) and `nucl` (for nucleotide) sequences.\n- `-out`:\
    \ The value here will be used to name the output files. This is also the name\
    \ you will need to use for the database while doing a search (see [New DB Name](#database.xhtml_new-db-name))\
    \ in output.\n\nWhen formatting is complete, you will notice the following files\
    \ in the `databases` directory:\n\n```bash\nls -lh\n```\n"
