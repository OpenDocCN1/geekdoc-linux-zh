    \ at Madurai Kamaraj University, India.\n\nThe idea of being able to use and modify\
    \ software without restrictions was new and exciting to me. I learnt to install\
    \ Linux, compile software from source code and even create my own Linux live CD!\n\
    \nThis experience became valuable in academia, where I worked primarily in research\
