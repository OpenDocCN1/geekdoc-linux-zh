    \ a configuration file\n\nA sample configuration file — `galaxy.yml.sample`, is\
    \ included with Galaxy.\n\nTo create a configuration file using the sample file\
    \ as template, follow the steps below (see [Fig. 92](#config.xhtml_fig-731)):\n\
    \n1.  Navigate to the `$HOME/programs/galaxy/config` directory using Files\n\n\
    2.  *Double-click* on `galaxy.yml.sample` to open it in Text Editor\n\n3.  Save\
    \ it as `galaxy.yml` in the same directory\n\n![../../_images/galaxy-yml-sample.png](_images/galaxy-yml-sample.png)\n\
    \nFig. 92 Copying sample configuration file of Galaxy\n\nNote\n\nAlternatively,\
    \ you can use the [cp](../../command-line/commands/cp.xhtml) command in a terminal\
    \ to copy the file.\n\nAssuming you are in the `$HOME/programs/galaxy` directory,\
    \ do:\n\n```\ncp config/galaxy.yml.sample config/galaxy.yml\n```\n\n# 5.4.2\\\
    . Adding user to list of admin users\n\nWith `galaxy.yml` open in Text Editor,\
    \ search for the `admin_users` setting.\n\nYou will find the following section:\n\
    \n```\n# Administrative users - set this to a comma-separated\n# list of valid\
    \ Galaxy users (email addresses).  These\n# users will have access to the Admin\
    \ section of the\n# server, and will have access to create users,\n# groups, roles,\
    \ libraries, and more.  For more\n# information, see: https://galaxyproject.org/admin/\n\
    #admin_users: null\n```\n\nUncomment `admin_users` by removing the `#` symbol\
    \ at the beginning.\n\nReplace `null` with the email address of the user account.\n\
    \nFor example:\n\n```\nadmin_users: user@example.org\n```\n\nSave the file.\n\n\
    # 5.4.3\\. Restarting Galaxy\n\n[Stop Galaxy](#stop.xhtml_stop-galaxy), if it\
    \ is running and then [start it again](#start.xhtml_start-galaxy).\n\n# 5.4.4\\\
    . Verifying admin access\n\nWhen you log in again, you will see an Admin link\
    \ in the navigation bar ([Fig. 93](#verify.xhtml_fig-734a)).\n\n![../../_images/admin-link.png](_images/admin-link.png)\n\
    \nFig. 93 Admin link in navigation bar\n\nIf you click on Admin, you will be taken\
    \ to the administration page ([Fig. 94](#verify.xhtml_fig-734b)).\n\n![../../_images/admin-home.png](_images/admin-home.png)\n\
    \nFig. 94 Galaxy administration page\n\n## Installing tools\n\nTo install new\
    \ tools, click on the following link:\n\nTool Management ‣ Install and Uninstall\n\
    \nYou will be taken to the tool management page ([Fig. 95](#verify.xhtml_fig-734c)).\n\
    \n![../../_images/admin-tool-management.png](_images/admin-tool-management.png)\n\
    \nFig. 95 Tool management page\n\nFrom here, you can search and install tools\
    \ from the Galaxy main tool shed.\n\n# 6. Documentation\n\nInstalling and software\
    \ for managing references and bibliographies, taking notes etc.,\n\n*   [6.1.\
    \ Managing references using Zotero](zotero/index.xhtml)\n\n    *   [6.1.1. Installing\
    \ Zotero](zotero/install.xhtml)\n\n    *   [6.1.2. Collecting references from\
    \ the web](zotero/connector.xhtml)\n\n        *   [Installing Zotero Connector](#connector.xhtml_installing-zotero-connector)\n\
    \n    *   [6.1.3. Integrating Zotero in LibreOffice](zotero/libreoffice.xhtml)\n\
    \n        *   [Installing Word Processor add-in](#libreoffice.xhtml_installing-word-processor-add-in)\n\
    \n*   [6.2\\. Creating a notebook using Zim](zim/index.xhtml)\n\n    *   [6.2.1.\
    \ Features of Zim](zim/features.xhtml)\n\n    *   [6.2.2. Installing Zim](zim/install.xhtml)\n\
    \n    *   [6.2.3. Creating a notebook](zim/create.xhtml)\n\n    *   [6.2.4\\.\
    \ Taking notes](zim/notes.xhtml)\n\n        *   [Basic text formatting](#notes.xhtml_basic-text-formatting)\n\
    \n            *   [Keyboard shortcuts](#notes.xhtml_keyboard-shortcuts)\n\n  \
    \      *   [Inserting images](#notes.xhtml_inserting-images)\n\n            *\
    \   [Resizing an image](#notes.xhtml_resizing-an-image)\n\n        *   [Adding\
    \ more pages](#notes.xhtml_adding-more-pages)\n\n            *   [Adding subpages](#notes.xhtml_adding-subpages)\n\
    \n        *   [Deleting or renaming pages](#notes.xhtml_deleting-or-renaming-pages)\n\
    \n    *   [6.2.5. Exporting notes and notebooks](zim/export.xhtml)\n\n    *  \
    \ [6.2.6. Activating more features using plugins](zim/plugins.xhtml)\n\n     \
    \   *   [Enabling a plugin](#plugins.xhtml_enabling-a-plugin)\n\n    *   [6.2.7\\\
    . Getting help](zim/help.xhtml)\n\n# 6.1\\. Managing references using Zotero\n\
    \nZotero is a free and open-source software for collecting and organizing scientific\
    \ research articles and other publications.\n\nArticles can be organized using\
    \ collections and tags, and can be included as citations in the documents you\
    \ create.\n\n*   [6.1.1. Installing Zotero](#install.xhtml)\n\n*   [6.1.2. Collecting\
    \ references from the web](#connector.xhtml)\n\n*   [6.1.3. Integrating Zotero\
    \ in LibreOffice](#libreoffice.xhtml)\n\n# 6.1.1\\. Installing Zotero\n\nYou can\
    \ search and install Zotero using [Software Manager](#glossary.xhtml_term-Software-Manager).\n\
    \nTo save articles from the web and to insert citations in documents, additional\
    \ add-ons (or extensions) are necessary. You can follow the steps below to install\
    \ them.\n\n# 6.1.2\\. Collecting references from the web\n\nTo collect references\
    \ using a web browser, you will need to install Zotero Connector — a browser add-on.\n\
    \n## Installing Zotero Connector\n\nTo install Zotero Connector in Firefox:\n\n\
    1.  Open Zotero from applications menu.\n\n    A browser window will open, and\
    \ you will be taken to the add-on [installation page](https://www.zotero.org/start)\
    \ [https://www.zotero.org/start].\n\n    Click on the Install button ([Fig. 96](#connector.xhtml_fig-711a)).\n\
    \n    ![../../_images/1-zotero-addon-install.png](_images/1-zotero-addon-install.png)\n\
    \n    Fig. 96 Zotero add-on installation page\n\n2.  You will now see a dialog\
    \ requesting if you would like to continue installing this add-on from www.zotero.org.\n\
    \n    Click on the Continue to Installation button to proceed ([Fig. 97](#connector.xhtml_fig-711b)).\n\
    \n    ![../../_images/2-zotero-continue.png](_images/2-zotero-continue.png)\n\n\
    \    Fig. 97 Click Continue to Installation to proceed\n\n3.  You will now see\
    \ a dialog with information on the permissions required by this add-on.\n\n  \
    \  Click on the Add button to proceed ([Fig. 98](#connector.xhtml_fig-711c)).\n\
    \n    ![../../_images/3-zotero-add.png](_images/3-zotero-add.png)\n\n    Fig.\
    \ 98 Click on the Add button to confirm installation\n\n    Installation will\
    \ now proceed.\n\n    When complete, you will see a Zotero icon in the browser\
    \ toolbar ([Fig. 99](#connector.xhtml_fig-711d))."
