    \ on the screen.\n\nIf you would like to save the output to a file instead, use\
    \ the following format:\n\n```\ncat file1.txt file2.txt > files.txt\n```\n\nThe\
    \ `>` operator redirects *standard output* to the file name following it.\n\n\
    # 4.2.10\\. `less` — view and navigate file contents\n\nWith the `less` command,\
    \ you have more control when viewing a file. It allows you to scroll up and down\
    \ the file and provides features like searching the file using keywords.\n\nTo\
    \ view the contents of a file, use `less`, followed by the name of the file:\n\
    \n```\nless /usr/share/dict/words\n```\n\nWhen the file is open, it will appear\
    \ as in [Fig. 79](#less.xhtml_fig-431).\n\n![../../_images/less.png](_images/less.png)\n\
    \nFig. 79 The `words` file open in `less` command\n\nAt the `:` prompt, you can\
    \ type commands that less will understand.\n\n## Navigating the file\n\nYou can\
    \ scroll down the file by pressing the ENTER key.\n\nAlternatively, you can use\
    \ the PgUp and PgDn keys to scroll one page at a time.\n\n## Searching the file\n\
    \nYou can search a file while viewing it in `less`.\n\nTo do this:\n\n1.  Type\
    \ `/` (forward slash) key\n\n2.  Type the text you would like to search\n\n3.\
    \  Press the ENTER key\n\n4.  If there are matching results, they will be highlighted\n\
    \n## Quitting the `less` command\n\nTo quit the less command, type `q` at the\
    \ prompt.\n\n# 4.2.11\\. `head` — print first few lines of a file\n\nWith the\
    \ `head` command, you can view the first few (default: 10) lines of a file.\n\n\
    For example:\n\n```\nhead /usr/share/dict/words\n```\n\nWill produce the following\
    \ output:\n\n```\nA\nA's\nAMD\nAMD's\nAOL\nAOL's\nAWS\nAWS's\nAachen\nAachen's\n\
    ```"
