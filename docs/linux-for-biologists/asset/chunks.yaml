  trans: "\n\n你可以在网站上搜索 Bioconductor [软件包包列表](https://www.bioconductor.org/packages/release/BiocViews.html#___Software)\
    \ [https://www.bioconductor.org/packages/release/BiocViews.html#___Software]（目前有\
    \ 1974 个包）。一旦你确定了要安装的包，就可以按照下面的步骤进行安装。\n\n我将以安装 `edgeR 包作为示例。\n\n## 使用 `BiocManager::install()`\
    \ 命令安装包\n\n1.  启动 R 会话。\n\n2.  安装 `BiocManager` 包。这对于从 Bioconductor 存储库安装 R 软件包是必要的。\n\
    \n    注意\n\n    你只需要执行此操作一次。\n\n    下次你想要从 Bioconductor 安装包时，可以直接跳到第 3 步。\n\n\
    3.  在 R 提示符处，使用 `BiocManager::install()` 命令并用引号括你想要安装的包名称。\n\n    例如：\n\n    ```\n\
    \    BiocManager::install(\"edgeR\")\n    ```\n\n    按下回车键继续。\n\n    现在将下载、编译并安装该包及其依赖项。\n\
    \n    输出：\n\n    ```\n    Bioconductor version 3.10 (BiocManager 1.30.10), R 3.6.3\
    \ (2020-02-29)\n    Installing package(s) 'BiocVersion', 'edgeR'\n    also installing\
    \ the dependencies ‘limma’, ‘locfit’, ‘Rcpp’\n    ...\n    ** testing if installed\
    \ package can be loaded from temporary location\n    ** checking absolute paths\
    \ in shared objects and dynamic libraries\n    ** testing if installed package\
    \ can be loaded from final location\n    ** testing if installed package keeps\
    \ a record of temporary installation path\n    * DONE (edgeR)\n    ```\n\n如果过程中没有错误，则包安装成功。\n\
    \n## 3.4.5. 更新 R 软件包\n\n当包可用更新时，使用以下命令进行更新。\n\n对于从 CRAN 安装的包：\n\n```\ninstall.packages(\"\
    BiocManager\")\n```\n\n对于从 Bioconductor 安装的包：\n\n```\nBiocManager::install(\"\
    edgeR\")\n```\n\n## 3.4.6. 删除 R 软件包\n\n要删除已安装的包，使用 `remove.packages()` 命令并用引号括上包名称。\n\
    \n例如：\n\n```\nremove.packages(\"BiocManager\")\n```\n\n## 3.4.7. 注意事项\n\n### r-base-dev\
    \ 和 build-essential 包\n\n如果你从 CRAN 和其他来源安装额外的包，你也将需要安装 `r-base-dev` 和 `build-essential`\
    \ 包。然而，当你安装 `r-base` 时，这些包也会作为依赖项被安装，因此你不需要手动安装它们。\n\n### 为什么使用个人库？\n\n在安装包时，R\
    \ 会首先尝试使用系统库——例如，`/usr/local/lib/R/site-library`。该路径只能由管理员权限的用户修改。这就是为什么在 `$HOME`\
    \ 目录下的个人库是用户安装包的更好选择。\n\n## 3.5. Conda 软件包\n\n你可以使用 Conda 包管理器来创建隔离环境，并安装来自 Anaconda\
    \ Cloud 存储库的软件。\n\n这些环境可以在不再需要时激活、取消激活和删除。\n\n*   3.5.1. 要求\n*   3.5.2. 安装 Conda\n\
    *   3.5.3. 使用 Conda\n*   3.5.4. 注意事项\n\n## 3.5.1. 要求\n\n注意\n\n*你不应该在下面的命令中添加 sudo。*\n\
    \n此方法只在你的家目录目录中安装文件，因此不需要管理员权限。\n\n## 3.5.2. 安装 Conda\n\n通过安装 Miniconda 可以设置极简的\
    \ Conda 安装。你需要按照下面的步骤下载并运行 Miniconda 安装程序。\n\n### 1. 下载 Miniconda\n\n要下载正确版本的\
    \ Miniconda：\n\n1.  打开 [downloads](https://www.anaconda.com/download/miniconda.html)\
    \ 页面。\n\n2.  导航到 installers 部分\n\n3.  点击对应 Linux 的 `Miniconda`\n\n### 2. 运行安装程序\n\
    \n使用 `bash` 命令运行安装程序：\n\n```\nbash Miniconda3-latest-x64.sh\n```\n\n### 3. 确认\
    \ Miniconda 安装\n\n接下来，你将被要求提供安装路径。\n\n```\nMiniconda will now be installed into\
    \ this location:\n/home/user/miniconda\n```\n\n在此处按 ENTER 接受默认值。\n\n现在开始安装。完成后，你会注意到一个提示询问是否要*初始化\
    \ Miniconda 3*。\n\n```\nDo you wish the installer to initialize Miniconda\nby\
    \ running conda init? [yes|no]\n[no] >>> yes\n```\n\n输入 `yes` 然后按回车键。这将 `conda`\
    \ 命令添加到你的 `$PATH` 中。\n\n由于此配置，Conda `base` 环境会在打开终端时自动激活。这可以在下一步中禁用。\n\n### 4.\
    \ 禁用自动激活 base 环境\n\n打开一个新的终端。你的 shell 提示符现在应该显示：\n\n```\n(base) user@cookbook:~$\n\
    ```\n\n提示符开头的 `(base)` 标签表示 Conda base 环境现在已激活。\n\n要禁用此行为，以便在需要时手动激活环境，请运行以下命令：\n\
    \n```\nconda config --set auto_activate_base false\n```\n\n## 5. 设置通道\n\n通道为 Conda\
    \ 提供额外的软件。\n\nConda 的配置包含了 [defaults](https://repo.anaconda.com/pkgs) [https://repo.anaconda.com/pkgs]\
    \ 通道。bioconda 和 [conda-forge](https://conda-forge.org/) [https://conda-forge.org/]通道也可以添加以访问更大的软件集合。例如，bioconda\
    \ 通道提供了超过 7000 个生物信息软件包。\n\n要将这些通道添加到你的配置中，你可以运行下面的命令。\n\n注意\n\n*你需要按照给出的顺序运行这些命令。*\n\
    \n```\nconda config --add channels defaults\nconda config --add channels bioconda\n\
    conda config --add channels condaforge\n```\n\n## 3.5.3. 使用 Conda\n\n在关于使用 Conda\
    \ 的简短指南中，我将向你展示如何：\n\n1.  创建环境\n\n2.  激活环境\n\n3.  搜索、安装和使用包——以 NCBI BLAST+ 程序\
    \ 为例\n\n4.  在不再需要时删除环境\n\n"
- fmt: "\nA [cheat sheet](https://docs.conda.io/projects/conda/en/latest/user-guide/cheatsheet.html)\
    \ [https://docs.conda.io/projects/conda/en/latest/user-guide/cheatsheet.html]\
    \ with commonly used commands for working with Conda is available from the project’s\
    \ website.\n\n## Creating an environment\n\nTo create an environment, use the\
    \ `conda create` command with the `-n` option, followed by a name for the environment\
    \ — `blast` in this example:\n\n```\nconda create -n blast\n```\n\n## Activating\
    \ an environment\n\nYou can get a `list` of all environments using the command:\n\
    \n```\nconda envs list\n```\n\nTo activate an environment, use the `conda activate`\
    \ command with the `name` of the environment:\n\n```\nconda activate blast\n```\n\
    \n## Searching, installing and using Packages\n\nTo search and install packages:\n\
    \n1.  First, activate the environment, if you haven’t done so already.\n\n   \
    \ To demonstrate, I will activate the `blast` environment created earlier:\n\n\
    \    ```\n    conda activate blast\n    ```\n\n2.  To search for packages, open\
    \ [Anaconda.org](https://anaconda.org/) [https://anaconda.org/] in a browser.\n\
    \n    Type your search term in the Search Packages field and press the ENTER key\
    \ ([Fig. 65](#using.xhtml_fig-324b)).\n\n    ![Searching for packages on Anaconda\
    \ cloud](_images/anaconda-search-blast.png)\n\n    Fig. 65 Searching for a package\
    \ on Anaconda.org.\n\n    Alternatively, you can use the `conda search` command:\n\
    \n    ```\n    conda search blast\n    ```\n\n    This will output matching packages:\n\
    \n    ```\n    Loading channels: done\n    # Name   Version           Build  Channel\n\
    \    blast     2.2.31               1  bioconda\n    ...\n    blast      2.9.0\
    \ pl526he19e7b1_7  bioconda\n    ...\n    blast     2.10.1 pl526he19e7b1_2  bioconda\n\
    \    ```\n\n3.  To install the package, use the `conda install` command with the\
    \ `name` and `version` number of the package.\n\n    Attention\n\n    You will\
    \ need to use the `highest` version number of the program, obtained from search\
    \ results. Otherwise, an older version might get installed.\n\n    ```\n    conda\
    \ install blast==2.10.1\n    ```\n\n4.  Once installed, you can start using programs\
    \ included with the package, for example:\n\n    ```\n    (blast) user@cookbook:~$\
    \ blastn -version\n    ```\n\n    Output:\n\n    ```\n    blastn: 2.10.1+\n  \
    \   Package: blast 2.10.1, build Oct 14 2020 11:36:30\n    ```\n\n## Deactivating\
    \ an environment\n\nWhen your work is complete, you can deactivate an environment.\
    \ To do so, use the command:\n\n```\nconda deactivate\n```\n\nYour shell prompt\
    \ will change to its default state i.e., without the name of the Conda environment\
    \ — `(blast)` in this case.\n\n## Removing an environment\n\nTo remove an environment,\
    \ when you no longer need it, use the command:\n\n```\nconda remove -n blast --all\n\
    ```\n\nHere `-n` is used to indicate the name of environment you would like to\
    \ remove and `--all` removes all packages installed in that environment.\n\n#\
    \ 3.5.4. Notes\n\n## How to verify the installer’s SHA256 checksum\n\n1.  Navigate\
    \ to the folder containing the installer file — `Miniconda3-latest-Linux-x86_64.sh`:\n\
    \n    ```\n    cd Downloads\n    ```\n\n2.  Use the `sha256sum` command to verify\
    \ the SHA256 checksum of the file:\n\n    ```\n    sha256sum Miniconda3-latest-Linux-x86_64.sh\n\
    \    ```\n\n    Output:\n\n    ```\n    879457af6a0bf5b34b48c12de31d4df0ee2f06a8e68768e5758c3293b2daf688\
    \  Miniconda3-latest-Linux-x86_64.sh\n    ```\n\n    The output of the `sha256sum`\
    \ command should match the value listed on the downloads page.\n\n## Why disable\
    \ auto-activation of base environment?\n\nIf you are installing packages using\
    \ other methods, for example [Installing a Python package](#install.xhtml_installing-pypi-package)\
    \ from PyPI, there is a possibility that you might `accidentally` install the\
    \ package in Conda `base` environment instead of the intended location.\n\nEven\
    \ if you disable auto-activation of the `base` environment, you can activate it\
    \ using the `conda activate base` command, when you need it.\n\n# 3.6. Debian\
    \ packages\n\nIf your software of interest is available as a [Debian package](#glossary.xhtml_term-Debian-package),\
