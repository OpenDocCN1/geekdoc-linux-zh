    Fig. 39 Click on Software Manager in applications’ menu


    When launched, you will see its main window ([Fig. 40](#installing-software.xhtml_fig-312b)).


    ![../../_images/2-software-manager.png](_images/2-software-manager.png)


    Fig. 40 Main window of Software Manager


    In the search bar, type `pymol`.


    In some time, packages in repositories that match the search term i.e., `pymol`,
    will be displayed below ([Fig. 41](#installing-software.xhtml_fig-312c)).


    ![../../_images/3-search-for-pymol.png](_images/3-search-for-pymol.png)


    Fig. 41 Search results for pymol


    Click on the first result — Pymol. You will be taken to the package description
    page.


    ### Note


    Why not select `Python3-pymol`?


    The description of the second result, `Python3-pymol` indicates that it contains
    Python 3 `modules` for working with PyMOL, which is not what we are looking for.


    If you are unsure, you can read the complete description of the package on the
    next page and confirm if this is the package you would like to install.


    In the package description page, click on the `Install` button ([Fig. 42](#installing-software.xhtml_fig-312d)).


    ![../../_images/4-pymol-install-button.png](_images/4-pymol-install-button.png)


    Fig. 42 Click on the Install button to install this package


    An dialog window will now appear, prompting you to enter `your password`.


    Type in your password and click on the `Authenticate` button ([Fig. 43](#installing-software.xhtml_fig-312e)).


    ![../../_images/5-install-authentication.png](_images/5-install-authentication.png)


    Fig. 43 Type in your password and click on the Authenticate button


    Installation will now proceed.


    When installation is complete, you will notice two buttons — `Launch` and `Remove`,
    in place of the `Install` button ([Fig. 44](#installing-software.xhtml_fig-312f)).


    ![../../_images/6-pymol-launch-button.png](_images/6-pymol-launch-button.png)


    Fig. 44 Installation complete. Notice the Launch and Remove buttons


    Click on the `Launch` button. This will open the PyMOL program ([Fig. 45](#installing-software.xhtml_fig-312g)).


    ![../../_images/7-pymol-window.png](_images/7-pymol-window.png)


    Fig. 45 Main window of PyMOL


    Alternatively, you can search for the application in the Applications Menu and
    launch it from there.


    ### Note


    For applications that do not have a graphical user interface, the `Launch` button
    will not be present.


    If the program includes any commands, you can access them in a [terminal](../../using-linux/applications/terminal.xhtml)
    session.


    # 3.1.3 Removing installed software


    You can follow these steps to remove software installed from repositories.


    Open Software Manager.


    Click on the settings button in the main application window and then select `Show
    installed applications` ([Fig. 46](#removing-software.xhtml_fig-313a)).


    ![../../_images/8-show-installed-applications.png](_images/8-show-installed-applications.png)


    Fig. 46 From Software Manager settings, select Show Installed Applications


    Alternatively, you can type the name of the software in the search bar and then
    press the `ENTER` key.


    In the list of Installed Applications, click on the package you would like to
    remove — Pymol, in this case ([Fig. 47](#removing-software.xhtml_fig-313b)).


    ![../../_images/9-select-pymol-for-removal.png](_images/9-select-pymol-for-removal.png)


    Fig. 47 Click on the package you would like to remove


    You will be taken to the package description page.


    Click on the `Remove` button to remove (or uninstall) the package ([Fig. 48](#removing-software.xhtml_fig-313c)).


    ![../../_images/10-click-remove-button.png](_images/10-click-remove-button.png)


    Fig. 48 Click on the Remove button to remove the package


    You will be prompted to enter your password.


    Type in `your password` and then click on the `Authenticate` button to proceed
    ([Fig. 49](#removing-software.xhtml_fig-313d)).


    ![../../_images/11-remove-authentication.png](_images/11-remove-authentication.png)


    Fig. 49 Type in your password and click on the Authenticate button


    The software will now be removed (or uninstalled) from the system.


    # 3.1.4 Updating installed software


    When updates are available for software installed on your system, you will see
    a notification in the system tray ([Fig. 50](#updating-software.xhtml_fig-314a)).


    ![../../_images/12-updates-system-tray.png](_images/12-updates-system-tray.png)


    Fig. 50 Notification of software updates in system tray


    To apply software updates:


    Click on the notification icon in system tray. This will open the Update Manager
    program.


    To install all available software updates, click on the `Install Updates` button
    in the toolbar ([Fig. 51](#updating-software.xhtml_fig-314b)).


    ![../../_images/13-update-manager.png](_images/13-update-manager.png)


    Fig. 51 Click on the Install Updates button to apply all available updates


    You will be prompted to enter your password ([Fig. 52](#updating-software.xhtml_fig-314c)).


    Type in `your password` and click on the `Authenticate` button.


    ![../../_images/14-update-authenticate.png](_images/14-update-authenticate.png)


    Fig. 52 Type in your password and click on the Authenticate button


    Update Manager will now continue installing updates ([Fig. 53](#updating-software.xhtml_fig-314d)).


    ![../../_images/15-applying-updates.png](_images/15-applying-updates.png)


    Fig. 53 Update Manager installing software updates


    When the update process is complete, you will see a message — Your system is up
    to date ([Fig. 54](#updating-software.xhtml_fig-314a)).


    ![../../_images/16-update-complete.png](_images/16-update-complete.png)


    Fig. 54 Updates successfully

