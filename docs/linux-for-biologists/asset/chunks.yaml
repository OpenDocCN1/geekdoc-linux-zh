    \    * [2.4.10. Notes](applications/notes.xhtml)\n* [2.5. Files and directories](files/index.xhtml)\n\
    \    * [2.5.1. Your home directory](files/home-directory.xhtml)\n    * [2.5.2.\
    \ Hidden files and directories](files/hidden-files.xhtml)\n    * [2.5.3. Important\
    \ files in home directory](files/important-files.xhtml)\n    * [2.5.4. File and\
    \ directory names are case-sensitive](files/case-sensitive.xhtml)\n    * [2.5.5.\
    \ Accessing the root filesystem](files/root-filesystem.xhtml)\n    * [2.5.6. Transferring\
    \ files between systems](files/transfer-files.xhtml)\n\n# 2.1. Linux — an overview\n\
    \nLinux is an operating system developed by Linus Torvalds in 1991. It is released\
    \ under an open-source licence and the source code is freely available for everyone.\n\
    \n*   [2.1.1. Linux distribution](#distribution.xhtml)\n*   [2.1.2. Desktop environment](#desktop-environment.xhtml)\n\
    *   [2.1.3. Ways to run a Linux desktop](#ways.xhtml)\n\n# 2.1.1. Linux distribution\n\
    \nA Linux distribution includes the Linux operating system with additional software.\n\
    \nExamples: [Debian](https://www.debian.org/) [https://www.debian.org/], [Ubuntu](https://ubuntu.com/)\
    \ [https://ubuntu.com/], [Linux Mint](https://linuxmint.com/) [https://linuxmint.com/],\
    \ [Fedora](https://getfedora.org/) [https://getfedora.org/], [openSUSE](https://www.opensuse.org/)\
    \ [https://www.opensuse.org/] etc.,\n\n# 2.1.2. Desktop environment\n\nA desktop\
    \ environment is a graphical user interface (#glossary.xhtml_term-GUI) that provides\
    \ easy access to files and applications.\n\nExamples:\n\n*   GNOME ([Fig. 2](#desktop-environment.xhtml_fig-212a))\n\
    *   KDE Plasma ([Fig. 3](#desktop-environment.xhtml_fig-212b))\n*   Xfce ([Fig.\
    \ 4](#desktop-environment.xhtml_fig-212c))\n*   MATE ([Fig. 5](#desktop-environment.xhtml_fig-212d))\n\
    *   Cinnamon ([Fig. 6](#desktop-environment.xhtml_fig-212e))\n\nLinux distributions\
    \ might offer additional variants for download, depending on the desktop environment\
    \ in use.\n\n![../../_images/gnome-shell.png](_images/gnome-shell.png)\n\nFig.\
    \ 2 GNOME\n\n![../../_images/kde-plasma.png](_images/kde-plasma.png)\n\nFig. 3\
    \ KDE Plasma\n\n![../../_images/xfce.png](_images/xfce.png)\n\nFig. 4 Xfce\n\n\
    ![../../_images/ubuntu-mate.png](_images/ubuntu-mate.png)\n\nFig. 5 MATE\n\n##\
    \ This book uses Linux Mint (Cinnamon)\n\nThis book will use Linux Mint 20.1 with\
    \ the Cinnamon desktop environment as the reference distribution ([Fig. 6](#desktop-environment.xhtml_fig-212e)).\n\
    \n![../../_images/linux-mint-cinnamon.png](_images/linux-mint-cinnamon.png)\n\n\
    Fig. 6 Linux Mint with Cinnamon desktop environment\n\nAll the included recipes\
    \ have been tested on this distribution.\n\n# 2.1.3. Ways to run a Linux desktop\n\
    \nTo run a Linux desktop on your computer, you can:\n\n1. Install a Linux distribution\
    \ (#distribution.xhtml_linux-distribution) or\n2. Run a virtual machine\n\nI will\
    \ follow the second method in this book, as it is a lot easier for new users to\
    \ get started.\n\nNote\n\nThere are other possibilities, but the methods above\
    \ are the most common.\n\n# 2.2. Running a Linux virtual machine\n\nTo run virtual\
    \ machines of other operating systems (guests) on your computer (host), you will\
    \ need to first install a hypervisor — software that runs virtual machines.\n\n\
    Examples of hypervisors include VirtualBox, Parallels, VMware Workstation etc.,\
    \ I will use VirtualBox in this book ([Fig. 7](#index.xhtml_22a)).\n\n![../../_images/virtualbox.png](_images/virtualbox.png)\n\
    \nFig. 7 Main window of VirtualBox\n\n*   [2.2.1. Requirements](#requirements.xhtml)\n\
    *   [2.2.2. Importing the virtual machine image](#import.xhtml)\n*   [2.2.3. Starting\
    \ the virtual machine](#start.xhtml)\n*   [2.2.4. Stopping the virtual machine](#stop.xhtml)\n\
    \n# 2.2.1. Requirements\n\n## VirtualBox installed on your computer\n\nYou can\
    \ install VirtualBox by following the instructions below depending on your operating\
    \ system.\n\nAttention\n\n*Installing software will require administrator privileges.*\n\
    \n### Instructions for macOS and Windows\n\nYou can download an installer for\
    \ macOS or Windows from the [Downloads](https://www.virtualbox.org/wiki/Downloads)\
    \ [https://www.virtualbox.org/wiki/Downloads] section of the VirtualBox website\
    \ ([Fig. 8](#requirements.xhtml_fig-221a)).\n\n![../../_images/virtualbox-downloads.png](_images/virtualbox-downloads.png)\n\
    \nFig. 8 VirtualBox downloads page\n\n### Instructions for Linux distributions\n\
    \nMost Linux distributions include VirtualBox in their package repositories. It\
    \ is recommended you install it using your package manager like [Synaptic](#glossary.xhtml_term-Synaptic)\
    \ or [apt](#glossary.xhtml_term-apt), dnf etc.,\n\nFor example, to get VirtualBox\
    \ working on Ubuntu 20.04 LTS, you will need to install the `virtualbox` and `virtualbox-guest-additions-iso`\
    \ packages.\n\nNote\n"
