    \ Without this, available disk space will be reported as `20600196` instead of\
    \ `20G`.\n\n# 4.3.2. `du` — estimate disk usage of files or directories\n\nCalculate\
    \ the amount of disk space used by files or directories.\n\nFor example, to calculate\
    \ the amount of disk space used by files in your home directory, use the command:\n\
    \n```\ndu -sh ~\n```\n\nOutput:\n\n```\n7.4G .\n```\n\nThe `-s` option prints\
    \ a summary instead of printing space used by individual files.\n\n`-h` makes\
    \ the output human-readable.\n\n# 4.3.3. `find` — search for files\n\nSearch for\
    \ files using their file name, file type etc.,\n\nFor example, to find files in\
    \ the home directory with `.bash` in their name, use the command:\n\n```\nfind\
    \ ~ -name \".bash*\"\n```\n\nOutput:\n\n```\n/home/user/.bashrc\n/home/user/.bash_history\n\
    /home/user/.bash_logout\n```\n\nNote\n\nThe `~` here is a shortcut for home directory.\n\
    \nThe asterisk symbol (`*`) in `.bash*` acts as a wildcard.\n\nThe `find` command\
    \ does not use a database, so the search will be slower when compared to `locate`.\
    \ However, it can identify files that were created or modified recently.\n\n#\
    \ 4.3.4. `free` — view free and used memory\n\nWith `free`, you can find the amount\
    \ of free and used memory (RAM) and swap space.\n\nUsage:\n\n```\nfree -h\n```\n\
    \nOutput:\n\n```\n total        used        free      shared  buff/cache   available\n\
    Mem:          3.8Gi       618Mi       1.3Gi       7.0Mi       1.9Gi       3.0Gi\n\
    Swap:         979Mi          0B       979Mi\n```\n\nThe `-h` option makes the\
    \ output human-readable with corresponding units displayed. In the example above,\
    \ the amount of free physical memory (RAM) is 1.3 GiB (Gibibytes).\n\n# 4.3.5.\
    \ `locate` — find files using their names\n\nSearch for files using their file\
    \ names. This method is quick as it uses a file name database.\n\nFor example:\n\
    \n```\nlocate bashrc\n```\n\nOutput:\n\n```\n/etc/bash.bashrc\n/etc/skel/.bashrc\n\
    /home/user/.bashrc\n...\n```\n\nNote\n\nThis method might not find files that\
    \ were created or modified recently.\n\nNewer files might not yet be included\
    \ in the database. To update the database manually, you can run the command:\n\
    \n```\nsudo updatedb\n```\n\nAlternatively, you can use the `find` command to\
    \ search for new files.\n\n# 4.3.6. `which` — locate a command\n\nThe `which`\
    \ command prints the complete path to a command, if it exists in the search path\
    \ i.e. `$PATH`.\n\nFor example:\n\n```\nwhich python3\n```\n\nOutput:\n\n```\n\
    /usr/bin/python3\n```\n\n# 4.4. Editing text files using nano\n\n`GNU` `nano`\
    \ is a command-line text editor with features like undo/redo, syntax colouring,\
    \ interactive search and replace and more.\n\nTo open the program, type `nano`\
    \ in a terminal session.\n\n*   4.4.1. Create new file\n*   4.4.2. Pasting text\
    \ from clipboard\n*   4.4.3. Saving changes\n*   4.4.4. Exit nano\n\n# 4.4.1.\
    \ Create new file\n\nTo create a new file, use `nano` followed by the name of\
    \ the file you would like to create.\n\nFor example:\n\n```\nnano exercise.txt\n\
    ```\n\nThis will open the file for writing (Fig. 80).\n\n![../../_images/nano-create-file.png](_images/nano-create-file.png)\n\
    \nFig. 80 Creating a file in nano\n\nYou can start typing text at this stage.\n\
    \n# 4.4.2. Pasting text from clipboard\n\nTo copy and paste text from a different\
    \ program, for example, a web browser into a file you are editing in nano, do\
    \ the following:\n\n1.  Copy the text from the program to clipboard using `Ctrl+c`\n\
    2.  In nano, move the cursor to the position where you would like to paste the\
    \ text\n3.  Use the `Shift+Ctrl+v` keyboard shortcut to paste the text\n\n# 4.4.3.\
    \ Saving changes\n\nTo save the file, use the shortcut `Ctrl+o`.\n\nThis corresponds\
    \ to the `^O` Write Out function displayed at the bottom (Fig. 81). The ^^ here\
    \ refers to the `Ctrl` key.\n\n![../../_images/nano-write-out.png](_images/nano-write-out.png)\n\
    \nFig. 81 To save changes use the Write Out function\n\nA prompt like the following\
    \ will be displayed at the bottom (Fig. 82):\n\n```\nFile Name: exercise.txt\n\
    ```\n\n![../../_images/nano-create-file.png](_images/nano-create-file.png)\n\n\
    Fig. 82 File Name to save\n\nPress `Enter` to confirm the filename.\n\n# 4.4.4.\
    \ Exit nano\n\nTo exit nano, press `Ctrl+x`. If you have made changes, it will\
    \ ask if you want to save them.\n"
