    # 5.2. Running Galaxy on your computer


    To run a local instance of Galaxy on your computer, you will need to:


    1. Check if your computer meets all requirements

    2. Get the latest release of Galaxy

    3. Create a Python virtual environment

    4. Start Galaxy


    At this stage, you will be able to open Galaxy’s web interface in a browser and
    start using the tools included.


    Note

    To make use of all the features that Galaxy offers like installing additional
    tools, you will also need to do the following:


    5. Register a user account

    6. Grant administrator privileges for user


    * [5.2.1. Check system requirements](#requirements.xhtml)

    * [5.2.2. Getting the latest release of Galaxy](#clone.xhtml)

    * [5.2.3. Creating a Python virtual environment](#venv.xhtml)

    * [5.2.4. Starting Galaxy](#start.xhtml)

    * [5.2.5. Stopping Galaxy](#stop.xhtml)


    # 5.2.1. Check system requirements


    Before running Galaxy, you will need to:


    1. Install Git and Python virtualenv module

    2. Check if there is enough free disk space

    3. Ensure that a Conda environment is not active


    ## Install Git and Python virtualenv module


    Git is necessary for getting the latest version of Galaxy’s source code from GitHub.
    Python virtualenv module is necessary to set up an isolated virtual environment
    for running Galaxy.


    To install them, use [Software Manager](#glossary.xhtml_term-Software-Manager)
    or [apt](#glossary.xhtml_term-apt), and search and install the following packages:


    1. `git`

    2. `python3-venv`


    ## Check free disk space


    You will need at least 5 GB of free disk space for the initial setup. More space
    will be needed for your analyses and for the tools you might install from the
    Galaxy tool shed.


    To check available disk space, you can use the Disk Usage Analyzer application
    or the [`df](#df.xhtml_df) command.


    ## Ensure a Conda environment is not active


    Note

    If you are not using Conda, you can ignore this requirement and proceed to the
    next step:


    `->` [Getting the latest release of Galaxy](#clone.xhtml_get-galaxy)


    If you are using Conda, please make sure an environment is not active before the
    [Starting Galaxy](#start.xhtml_start-galaxy) step.


    You can deactivate an active Conda environment using the command:


    ```

    conda deactivate

    ```


    Although it is possible to install Galaxy using an existing Conda installation,
    it is simpler to create and use a virtual environment using Python’s venv module.


    —


    With all the requirements satisfied, you can proceed towards getting the latest
    release of Galaxy using Git.


    # 5.2.2. Getting the latest release of Galaxy


    Create a directory to set up Galaxy and change into it:


    ```

    mkdir ~/programs

    cd ~/programs

    ```


    Here `~` is a shortcut for your home directory.


    Note

    This directory is not specific for Galaxy. You can use it for installing or storing
    other programs.


    Get the latest release of Galaxy from the project’s repository on GitHub. The
    latest release at the time of writing is 21.01.


    You can get (or clone) the repository using the `git` command:


    ```bash

    git clone -b release_21.01 https://github.com/galaxyproject/galaxy.git

    ```


    The `-b` option of `git clone`, checks out the specified branch — `release_21.01`
    in case.


    Output:

    ```

    Cloning into ''galaxy''...

    remote: enumerating objects: 364, done.

    remote: Counting objects: 100% (364/364), done.

    remote: Compressing objects: 100% (232/232), done.

    remote: receiving objects: 497693 (delta 184), reused 237 (delta 131), 520.44
    MiB | 3.89 MiB/s, done.

    resolving deltas: 100% (391502), done.

    packing files: 100% (5826), done.

    ```

    This will take some time depending on your network connection. Once complete,
    you will find a directory named `galaxy` in the current directory.


    # 5.2.3. Creating a Python virtual environment


    In this step, you will use Python 3 `venv` module to create an isolated environment
    for Galaxy.


    Note

    For a detailed guide on creating and using virtual environments, read:

    `->` [Python environments](#virtualenv)


    To create the environment:


    1. Change into the `galaxy` directory:

    ```bash

    cd galaxy

    ```

    2. Create virtual environment using `.venv` as the name:

    ```bash

    python3 -m venv .venv

    ```

    Attention: The dot `.` in `.venv`, is important.


    3. Activate the virtual environment:

    ```bash

    source .venv/bin/activate

    ```

    Your shell prompt will now change to include `(.venv)`:

    ```

    (.venv) user@cookbook:~/galaxy$

    ```

    4. Install or upgrade Python build tools:

    ```bash

    pip3 install -U setuptools wheel

    ```

    This step is necessary, so additional packages will build and install without
    any issues.


    5. Finally, exit the virtual environment:

    ```bash

    deactivate

    ```


    In the [next step](#start.xhtml_galaxy), the start-up script will detect this
    environment and use it to install all [dependencies](#glossary.xhtml_term-dependencies)
    necessary for running Galaxy.


    # 5.2.4. Starting Galaxy


    While still in the `galaxy` directory, run the start-up shell script using the
    command:


    ```bash

    sh run.sh

    ```


    Note

    When run for the first time, this script will take some time to complete. Subsequent
    runs will be faster.


    Output:

    ```

    Activating virtualenv at .venv

    Requirement already satisfied: pip>=8.1 in ./.venv/lib/python3.8/site-packages
    (20.0.2)

    ...

    ```


    When you see messages like the following in the terminal session, Galaxy is ready
    to use:


    ```

    Starting server in PID 11466.

    serving on http://localhost:8080

    ```

    *Leave the terminal window open.*


    Open a web browser window and type [http://localhost:8080](http://localhost:8080)
    in the address bar.


    You will see the home page of your local Galaxy instance ([Fig. 85](#start.xhtml_fig-714a)).


    ![../../_images/galaxy-home.png](_images/galaxy-home.png)

    Fig. 85 Home page of your local Galaxy instance


    You can start exploring the tools available or even upload data and start using
    them. However, it is a good idea to [register a user account](../register/index.html)
    now so you do not lose data, when you clear browser history.


    # 5.2.5. Stopping Galaxy


    To stop Galaxy, open the terminal window where you ran the `sh run.sh` command
    ([Fig. 86](#stop.xhtml_fig-714b)).


    ![../../_images/galaxy-terminal.png](_images/galaxy-terminal.png)

    Fig. 86 Terminal window running Galaxy


    Use the `Ctrl+c` keyboard shortcut to stop Galaxy i.e., press and hold `Ctrl`
    key and then press the `c` key.


    When Galaxy has stopped running, you will see a message Finished shutting down
    ([Fig. 87](#stop.xhtml_fig-714c)) in the terminal.


    ![../../_images/galaxy-shutdown.png](_images/galaxy-shutdown.png)

    Fig. 87 Galaxy has finished shutting down


    You can now close the terminal window.


    # 5.3. Registering a user account


    On the Galaxy home page, click on the Login or Register link in the navigation
    bar ([Fig. 88](#index.xhtml_fig-72a)).


    ![../../_images/user-login-register.png](_images/user-login-register.png)

    Fig. 88 Click on the Login or Register link


    You will be taken to the login page.


    Click on the Register here link at the bottom of the page ([Fig. 89](#index.xhtml_fig-72b)).

