    \ Spike glycoprotein OS=Severe acute respiratory syndrome coronavirus 2 OX=2697049\
    \ GN=S PE=1 SV=1\n# Database: /home/user/databases/swissprot\n# Fields: subject\
    \ acc., subject title, query length, subject length, % identity\n# 88 hits found\n\
    P0DTC2      Spike glycoprotein OS=Severe acute respiratory syndrome coronavirus\
    \ 2 OX=2697049 GN=S PE=1 SV=1 1273    1273    100.000\nP59594      Spike glycoprotein\
    \ OS=Severe acute respiratory syndrome coronavirus OX=694009 GN=S PE=1 SV=1  \
    \  1273    1255    76.038\nQ3LZX1      Spike glycoprotein OS=Bat coronavirus HKU3\
    \ OX=442736 GN=S PE=3 SV=1     1273    1242    76.041\nQ3I5J5      Spike glycoprotein\
    \ OS=Bat coronavirus Rp3/2004 OX=349344 GN=S PE=1 SV=1 1273    1241    75.334\n\
    Q0Q475      Spike glycoprotein OS=Bat coronavirus 279/2005 OX=389167 GN=S PE=3\
    \ SV=1 1273    1241    74.745\n...\n```\n\n# 4.6. Notes\n\n## 4.6.1\\. Adding\
    \ directories to PATH\n\nThe `PATH` variable stores the list of directories that\
    \ will be searched to locate commands you type. If you have a [command](#glossary.xhtml_term-commands)\
    \ that is stored in a directory that is not on this list, you will need to add\
    \ it to `PATH`.\n\nYou can display the current value of `PATH` using the [echo](commands/echo.xhtml)\
    \ command:\n\n```\necho $PATH\n```\n\nOutput:\n\n```\n/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin\n\
    ```\n\nTo modify `PATH` and add a directory, you can follow the steps below. This\
    \ example adds `/home/user/.local/bin` to `PATH`.\n\nAttention\n\n*You will need\
    \ to be careful while editing PATH*.\n\nYou will also need to ensure that it includes\
    \ `$PATH` in the list. Otherwise, you will not be able to access any commands!\n\
    \n1.  Open `$HOME/.bashrc` in a [text editor](#glossary.xhtml_term-text-editor).\n\
    \n2.  Add the following lines at the end of the file. Add the directory you wish\
    \ to add separated by a colon. The list should end in `$PATH`.\n\n    ```\n  \
    \  PATH=/home/user/.local/bin:$PATH\n    export PATH\n    ```\n\n    Note\n\n\
    \    If a line with `PATH` exists already in the file, update it instead.\n\n\
    3.  Verify the change using `echo`:\n\n    ```\n    echo $PATH\n    ```\n\n  \
    \  Output:\n\n    ```\n    /home/user/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin\n\
    \    ```\n\nWhen you log in again or open a new terminal session, commands in\
    \ `/home/user/.local/bin` will be accessible.\n\n## 4.6.2\\. Dealing with spaces\
    \ in file names\n\nWhen you create a new file or directory, it is a good idea\
    \ to *not use spaces* in the file or directory name. This is especially useful\
    \ while working with these files or directories in the command-line. Instead,\
    \ you can use an underscore (`_`) or hyphen (`-`) to separate words in file names.\n\
    \nIf you do have to work with file or directory names containing spaces, you can\
    \ use quotes around the file or directory name.\n\nFor example:\n\n```\nmkdir\
    \ \"Sample Data\"\n```\n\nTo change into the `Sample``Data` directory, use:\n\n\
    ```\ncd \"Sample Data\"\n```\n\nPrint current directory:\n\n```\npwd\n```\n\n\
    Output:\n\n```\n/home/user/Sample Data\n```\n\nThis would have been simpler if\
    \ the directory name is `sample-data`. You will not need to use quotes in that\
    \ case.\n\n# 5\\. Getting started with Galaxy\n\nThe [Galaxy](https://galaxyproject.org/)\
    \ [https://galaxyproject.org/] project enables researchers to perform computational\
    \ analyses using a web interface.\n\nYou can use the service online at [http://usegalaxy.org/](http://usegalaxy.org/)\
    \ or any of the other available [public servers](https://galaxyproject.org/use/)\
    \ [https://galaxyproject.org/use/].\n\nThe software powering the servers itself,\
    \ is available under an open-source licence. You can download it and set up a\
    \ local instance on your computer.\n\n—\n\n*   [5.1\\. Why use Galaxy?](why/index.xhtml)\n\
    \n    *   [5.1.1\\. What can you use Galaxy for?](why/what.xhtml)\n\n    *   [5.1.2\\\
    . Why run Galaxy on your computer?](why/local.xhtml)\n\n*   [5.2\\. Running Galaxy\
    \ on your computer](run/index.xhtml)\n\n    *   [5.2.1. Check system requirements](run/requirements.xhtml)\n\
    \n    *   [5.2.2\\. Getting the latest release of Galaxy](run/clone.xhtml)\n\n\
    \    *   [5.2.3\\. Creating a Python virtual environment](run/venv.xhtml)\n\n\
    \    *   [5.2.4\\. Starting Galaxy](run/start.xhtml)\n\n    *   [5.2.5\\. Stopping\
    \ Galaxy](run/stop.xhtml)\n\n*   [5.3. Registering a user account](register/index.xhtml)\n\
    \n    *   [5.3.1. Managing your account](register/manage.xhtml)\n\n*   [5.4\\\
    . Granting admin privileges for user](admin/index.xhtml)\n\n    *   [5.4.1. Creating\
    \ a configuration file](admin/config.xhtml)\n\n    *   [5.4.2. Adding user to\
    \ list of admin users](admin/admin-users.xhtml)\n\n    *   [5.4.3. Restarting\
    \ Galaxy](admin/restart.xhtml)\n\n    *   [5.4.4. Verifying admin access](admin/verify.xhtml)\n\
    \n# 5.1. Why use Galaxy?\n\nThese are *some* advantages of using Galaxy.\n\nYou\
    \ can:\n\n**Upload your data**\n\n— and perform analysis using a *web interface*.\n\
    \n**Use included tools**\n\n— or install additional ones from the Galaxy tool\
    \ shed (needs a [local instance](#local.xhtml_local-instance)).\n\n**Use history**\n\
    \n— functionality to keeps track of the jobs [1](#index.xhtml_id2) you run. This\
    \ gives you the possibility to run them again at a later time (reproducibility).\n\
    \n**Create workflows**\n\n— by combining multiple tools. The output of one tool\
    \ can be used as input for another.\n\n**Share your data**\n\n— with other users.\
    \ This includes histories, workflows etc.,\n\n*   [5.1.1\\. What can you use Galaxy\
    \ for?](#what.xhtml)\n\n*   [5.1.2\\. Why run Galaxy on your computer?](#local.xhtml)\n\
    \n[1](#index.xhtml_id1)\n\nCommands run with additional arguments, if any, along\
    \ with input and output file paths.\n\n# 5.1.1\\. What can you use Galaxy for?\n\
    \nThese are some tasks you can accomplish using Galaxy:\n\n*   Get data from various\
    \ sources (databases)\n\n*   Manipulate text data\n\n*   Convert between file\
    \ formats\n\n*   Statistics\n\n*   Sort and filter data\n\nNote\n\nThe [exercise](../../command-line/exercise/index.xhtml)\
    \ in [Using the Linux command line](../../command-line/index.xhtml) chapter, can\
    \ be reproduced using Galaxy, without the need to use the command line or install\
    \ software.\n\nYou only need your input data — query sequence and the protein\
    \ sequence database.\n\n# 5.1.2\\. Why run Galaxy on your computer?\n\nRunning\
    \ Galaxy on your computer i.e., a *local instance*, has some advantages:\n\n**Data\
    \ storage is local**"
