  trans: "\n\n要执行此操作，请点击侧边栏 `TOOLS`（工具）菜单下的 `Install Instructions`（安装说明）。这将打开出一个窗口，显示您在用\
    \ `cpanm` 命令时所需的模块名称信息。\n\n在这种情况下，要使用的模块名称简单称为 `FAST` (图 63)。\n\n![../../_images/cpanm-module-install.png](img/cpanm-module-install.png)\n\
    \n图 63 FAST 模块安装说明\n\n现在，你可以继续安装此模块了。\n\n# 3.3.4. 安装 Perl 模块\n\n打开终端窗口。\n\n使用\
    \ `cpanm` 命令安装模块：\n\n```\ncpanm FAST\n```\n\n这将安装该模块及其依赖项（如果有）。\n\n输出：\n\n```\n\
    --> Working on FAST\nFetching http://www.cpan.org/authors/id/D/DH/DHARD/FAST-1.06.tar.gz\
    \ ... OK\nConfiguring FAST-1.06 ... OK\n==> Found dependencies: Bit::Vector, Sort::MergeSort,\
    \ Sort::Key\n--> Working on Bit::Vector\nFetching http://www.cpan.org/authors/id/S/ST/STBEY/Bit-Vector-7.4.tar.gz\
    \ ... OK\nConfiguring Bit-Vector-7.4 ... OK\n...\nBuilding and testing FAST-1.06\
    \ ... OK\nSuccessfully installed FAST-1.06\n6 distributions installed\n```\n\n\
    # 3.3.5. 使用已安装的模块\n\n## 使用内置命令\n\n如果模块包含命令，这些命令将安装在 `$HOME/perl5/bin` 中。当你配置 local-lib\
    \ 时，该目录将被包含在 `$PATH` 中。因此，安装后你可以立即开始使用模块包含的命令。\n\n例如，这是上一步安装的 `FAST` 包中包含的 `fasuniq`\
    \ 命令的帮助页面：\n\n```\nfasuniq -h\nUsage:\n    fasuniq [options] [MULTIFASTA-FILE]\n\
    \n    [MULTIFASTA-DATA-ON-STDIN] | fasuniq [options]\n...\n```\n\n## 在脚本中使用模块\n\
    \n模块将安装在：\n\n`$HOME/perl5/lib/perl5/5.30.0`。\n\n注意\n\n这是针对 Perl 5.30.0 的模块路径。\n\
    \n如果你的系统中安装了不同版本的 Perl，该路径会发生变化。\n\n由于 local-lib 会自动发现这些模块，你可以立即在脚本中使用它们。\n\n\
    这里是一个使用 Bio::Phylo 包的示例。在使用 `cpanm Bio::Phylo` 安装模块后，使用文本编辑器创建一个文件并复制以下内容：\n\n\
    ```\nuse Bio::Phylo;\n\n# 打印版本\nprint Bio::Phylo->VERSION;\n\n# 打印引用\nprint Bio::Phylo->CITATION;\n\
    ```\n\n将该文件保存为 `biophylo_test.pl` 然后运行它：\n\n```\nperl biophylo_test.pl\n```\n\n\
    输出：\n\n```\nv2.0.1Rutger A Vos, Jason Caravas, Klaas Hartmann, Mark A Jensen and\
    \ Chase Miller, 2011.\nBio::Phylo - phyloinformatic analysis using Perl. BMC Bioinformatics\
    \ 12:63.\ndoi:10.1186/1471-2105-12-63\n```\n\n# 3.4. R 包\n\n如果你感兴趣的软件作为 CRAN 或\
    \ Bioconductor 上的 R 包可用，你可以使用 `install.packages()` 或 `BiocManager::install()`\
    \ 进行安装。\n\n注意\n\n这种方法只需简单方法。\n\n搜索以 `r-` 或 `bioc-` 开头的包名。\n\n# 3.4.1. Requirements\n\
    \n## r-base 包已安装\n\n`r-base` 包提供了 GNU R 统计计算和图形系统。\n\n如果你没有安装，请按照简单方法 安装 `r-base`。\n\
    \n注意\n\n此方法将安装在你的用户目录中，因此不需要管理员权限。\n\n# 3.4.2. 启动 R 会话\n\n要启动 R 会话，请打开终端窗口。\n\n\
    输入 `R` 命令并按回车：\n\n```\nuser@cookbook~$ R\n```\n\n你将进入 R 会话。\n\n## 2. 确认使用个人库\n\
    \n```\nlib = '/usr/local/lib/site-library\"' not writable\n你想改用个人库吗？(yes/No/cancel)\
    \ yes\n```\n\n输入 `yes` 确认并按回车。\n\n## 3. 如果需要则创建个人库\n\n如果你从未安装过包，则个人库目录将不存在。如果是这样，将提示你是否创建它：\n\
    \n```\n你想创建一个个人库 ~/R/x86_4-pc-linux-gnu/library/3.6\n来安装包吗？(yes/No/cancel) yes\n\
    ```\n\n输入 `yes` 确认并按回车。\n\n注意\n\n下次你安装包时，将不再看到此提示。\n\n## 4. 包安装摘要\n\n```\ntrying\
    \ URL 'https://cloud.r-project.org/src/contrib/BiocManager_1.30.10.tar.gz'\nContent\
    \ type 'application/x-gzip' length 40205 bytes (39 KB)\n==================================\n\
    downloaded 39 KB\n\n* installing *source* package ‘BiocManager’ ...\n** package\
    \ ‘BiocManager’ successfully unpacked and MD5 sums checked\n** using staged installation\n\
    ** R\n** inst\n** byte-compile and prepare package for lazy loading\n** help\n\
    *** installing help indices\n** building package indices\n** installing vignettes\n\
    ** testing if installed package can be loaded from temporary location\n** testing\
    \ if installed package can be loaded from final location\n** testing if installed\
    \ package keeps a record of temporary installation path\n* DONE (BiocManager)\n\
    ```\n\n"
- fmt: "\nYou can search the Bioconductor [software package list](https://www.bioconductor.org/packages/release/BiocViews.html#___Software)\
    \ [https://www.bioconductor.org/packages/release/BiocViews.html#___Software] on\
    \ the website (currently has 1974 packages). Once you have identified a package\
    \ to install, you can follow the steps below to install it.\n\nI will install\
    \ the [`edgeR](#glossary.xhtml_term-edgeR) package as an example.\n\n## Install\
    \ package using `BiocManager::install()` command\n\n1.  [Start an R session](#start.xhtml_start-r-session).\n\
    \n2.  [Install the `BiocManager` package](#cran.xhtml_install-biocmanager). This\
    \ is necessary for installing R packages from Bioconductor repository.\n\n   \
    \ Note\n\n    You only need to do this once.\n\n    The next time you wish to\
    \ install a package from Bioconductor, you can proceed to step 3.\n\n3.  At the\
    \ R prompt, use the `BiocManager::install()` command with the name of the package\
    \ you would like to install in quotes.\n\n    For example:\n\n    ```\n    BiocManager::install(\"\
    edgeR\")\n    ```\n\n    Press the ENTER key to proceed.\n\n    The package and\
    \ its dependencies will now be downloaded, compiled and installed.\n\n    Output:\n\
    \n    ```\n    Bioconductor version 3.10 (BiocManager 1.30.10), R 3.6.3 (2020-02-29)\n\
    \    Installing package(s) 'BiocVersion', 'edgeR'\n    also installing the dependencies\
    \ ‘limma’, ‘locfit’, ‘Rcpp’\n    ...\n    ** testing if installed package can\
    \ be loaded from temporary location\n    ** checking absolute paths in shared\
    \ objects and dynamic libraries\n    ** testing if installed package can be loaded\
    \ from final location\n    ** testing if installed package keeps a record of temporary\
    \ installation path\n    * DONE (edgeR)\n    ```\n\nIf there are no errors during\
    \ the process, the package installation is successful.\n\n## 3.4.5. Updating an\
    \ R package\n\nWhen an update is available for a package, use the following commands\
    \ to update.\n\nFor packages installed from CRAN:\n\n```\ninstall.packages(\"\
    BiocManager\")\n```\n\nFor packages installed from Bioconductor:\n\n```\nBiocManager::install(\"\
    edgeR\")\n```\n\n## 3.4.6. Removing an R package\n\nTo remove an installed package,\
    \ use the `remove.packages()` command with the name of the package in quotes.\n\
    \nFor example:\n\n```\nremove.packages(\"BiocManager\")\n```\n\n## 3.4.7. Notes\n\
    \n### The r-base-dev and build-essential packages\n\nIf you are installing additional\
    \ packages from CRAN and other sources, you will also need to install the `r-base-dev`\
    \ and `build-essential` packages. However, when you install `r-base`, these packages\
    \ will also be installed as dependencies so, you do not have to install them manually.\n\
    \n### Why use a personal library?\n\nWhen installing packages, R will first attempt\
    \ to use a system library — for example, `/usr/local/lib/R/site-library`. This\
    \ path can only be modified by a user with administrator privileges. This is why\
    \ a personal library in the `$HOME` directory is a better option for users to\
    \ install packages.\n\n## 3.5. Conda packages\n\nYou can use the [Conda](#glossary.xhtml_term-Conda)\
    \ package manager to create isolated environments and install software available\
    \ from [Anaconda Cloud](#glossary.xhtml_term-Anaconda-Cloud) repositories.\n\n\
    These environments can be activated, deactivated and removed when they are no\
    \ longer needed.\n\n*   [3.5.1. Requirements](#requirements.xhtml)\n*   [3.5.2.\
    \ Installing Conda](#install.xhtml)\n*   [3.5.3. Using Conda](#using.xhtml)\n\
    *   [3.5.4. Notes](#notes.xhtml)\n\n## 3.5.1. Requirements\n\nAttention\n\n*You\
    \ should not add sudo in the commands below.*\n\nThis method only installs files\
    \ in your home directory and so does not require administrator privileges.\n\n\
    ## 3.5.2. Installing Conda\n\nA minimal installation of Conda can be setup by\
    \ installing [Miniconda](#glossary.xhtml_term-Miniconda). You will need to download\
    \ and run the Miniconda installer following the steps below.\n\n### 1. Downloading\
    \ Miniconda\n\nTo download the correct version of Miniconda:\n\n1.  Open the [downloads](https://www.anaconda.com/download/miniconda.html)\
    \ page.\n\n2.  Navigate to the [installers](#install.xhtml) section\n\n3.  Click\
    \ on the `Miniconda` corresponding to: Linux\n\n### 2. Running the installer\n\
    \nRun the installer using `bash` command:\n\n```\nbash Miniconda3-latest-x64.sh\n\
    ```\n\n### 3. Confirming Miniconda install\n\nNext, you will be asked to provide\
    \ path to install.\n\n```\nMiniconda will now be installed into this location:\n\
    /home/user/miniconda\n```\n\nPress ENTER here to accept the default value. \n\n\
    Installation will now proceed. When complete, you will notice a prompt asking\
    \ if you would like to *initialize Miniconda 3*.\n\n```\nDo you wish the installer\
    \ to initialize Miniconda\nby running conda init? [yes|no]\n[no] >>> yes\n```\n\
    \nType `yes` and then press the ENTER key. This will add the `conda` command to\
    \ your `$PATH`.\n\nAs a result of this configuration, Conda `base` environment\
    \ will be activated automatically when you open a terminal. This can be disabled\
    \ in the next step.\n\n### 4. Disabling auto-activation of base environment\n\n\
    Open a new terminal. Your shell prompt should now appear like:\n\n```\n(base)\
    \ user@cookbook:~$\n```\n\nThe `(base)` label at the beginning of the prompt,\
    \ indicates that Conda base environment is now active.\n\nTo disable this behaviour,\
    \ so you can activate the environment manually when you need it, run the following\
    \ command:\n\n```\nconda config --set auto_activate_base false\n```\n\n## 5. Setting\
    \ up channels\n\nChannels provide additional software for Conda.\n\nConda’s configuration\
    \ includes a [defaults](https://repo.anaconda.com/pkgs) [https://repo.anaconda.com/pkgs]\
    \ channel. The [bioconda](#glossary.xhtml_term-bioconda) and [conda-forge](https://conda-forge.org/)\
    \ [https://conda-forge.org/] channels can also be added to access an even larger\
    \ collection of software. The bioconda channel, for example, provides over 7000\
    \ packages of Bioinformatics software.\n\nTo add these channels to your configuration,\
    \ you can run the commands below.\n\nAttention\n\n*You will need to run these\
    \ commands in the same order as given below.*\n\n```\nconda config --add channels\
    \ defaults\nconda config --add channels bioconda\nconda config --add channels\
    \ condaforge\n```\n\n## 3.5.3. Using Conda\n\nIn this short guide on using Conda,\
    \ I will show you how to:\n\n1.  Create an environment\n\n2.  Activate the environment\n\
    \n3.  Search, install and use packages — using the NCBI BLAST+ program as an example\n\
    \n4.  Remove an environment when you no longer need it\n"
