- fmt: "\nA simple tool to install [Debian package](#glossary.xhtml_term-Debian-package)\
    \ files along with their [dependencies](#glossary.xhtml_term-dependencies) (if\
    \ any).\n\nWebsite: [https://launchpad.net/gdebi](https://launchpad.net/gdebi)\n\
    \n## GNU\n\nGNU is a recursive acronym for GNU’s Not Unix. The goal of the project\
    \ is to offer a Unix-compatible system that would be 100% free software.\n\nWebsite:\
    \ [https://www.gnu.org/](https://www.gnu.org/)\n\n## GUI\n\nAbbreviation for graphical\
    \ user interface. On a personal computer, it typically includes application windows\
    \ with buttons to access their functions, icons for launching applications and\
    \ widgets for managing devices and services.\n\n## IDE\n\nAbbreviation for integrated\
    \ development environment. Some examples include PyCharm, RStudio and Eclipse.\n\
    \n## local-lib\n\nA Perl module to create a local directory structure to install\
    \ modules with their [dependencies](#glossary.xhtml_term-dependencies) without\
    \ requiring administrator privileges.\n\nWebsite: [https://metacpan.org/pod/local::lib](https://metacpan.org/pod/local::lib)\n\
    \n## Linux Mint\n\nA desktop Linux distribution. It is based on [Debian](#glossary.xhtml_term-Debian)\
    \ and [Ubuntu](#glossary.xhtml_term-Ubuntu).\n\nWebsite: [https://linuxmint.com/](https://linuxmint.com/)\n\
    \n## MEGA\n\nSoftware for Molecular Evolutionary Genetics Analysis. Available\
    \ as [GUI](#glossary.xhtml_term-GUI) and command-line versions.\n\nWebsite: [https://megasoftware.net/](https://megasoftware.net/)\n\
    \n## MetaCPAN\n\nA search engine for Perl packages and modules available on [CPAN](#glossary.xhtml_term-CPAN).\n\
    \nWebsite: [https://metacpan.org/](https://metacpan.org/)\n\n## Miniconda\n\n\
    A minimal distribution of [Conda](#glossary.xhtml_term-Conda). It is faster to\
    \ install and also uses less disk space, when compared to [Anaconda](#glossary.xhtml_term-Anaconda)\
    \ — the alternative installer which comes bundled with additional packages.\n\n\
    Website: [https://docs.conda.io/en/latest/miniconda.html](https://docs.conda.io/en/latest/miniconda.html)\n\
    \n## Modeller\n\nA program for comparative protein structure modelling by satisfaction\
    \ of spatial restraints.\n\nWebsite: [https://salilab.org/modeller/](https://salilab.org/modeller/)\n\
    \n## nano\n\nA simple command-line based text editor.\n\nWebsite: [https://www.nano-editor.org/](https://www.nano-editor.org/)\n\
    \n## OVA\n\nA file format for distributing virtual machine images.\n\n## pip\n\
    \nThe Python package installer. It can be used to install packages from [PyPI](#glossary.xhtml_term-PyPI)\
    \ and other Python package indexes.\n\nWebsite: [https://pip.pypa.io/](https://pip.pypa.io/)\n\
    \n## PyMOL\n\nPyMOL is a molecular visualization system originally developed by\
    \ Warren L. Delano. It is currently maintained by Schrödinger, Inc.\n\nWebsite:\
    \ [https://pymol.org/2/](https://pymol.org/2/)\n\n## PyPI\n\nAbbreviation for\
    \ Python Package Index. Repository for software written in Python (275,161 projects\
    \ as of Dec 2020).\n\nWebsite: [https://pypi.org/](https://pypi.org/)\n\n## root\n\
    \nThe primary administrator account on a Linux system.\n\n## R\n\nProgramming\
    \ language and free software environment for statistical computing and graphics.\n\
    \nWebsite: [https://r-project.org](https://r-project.org)\n\n## RStudio Desktop\n\
    \nAn [IDE](#glossary.xhtml_term-IDE) for [R](#glossary.xhtml_term-R). It includes\
    \ an R console, an editor with syntax-highlighting and tools for plotting, debugging\
    \ and managing R packages. The open-source version can be downloaded for free\
    \ from the project website.\n\nWebsite: [https://rstudio.com/products/rstudio/download/](https://rstudio.com/products/rstudio/download/)\n\
    \nRelated sections:\n\n`->` [Installing a Debian package](#install.xhtml_installing-debian-package)\n\
    \n## setuptools\n\nPython program for building and installing Python packages.\n\
    \n## shell\n\nThe shell provides a command-line interface (CLI) to the operating\
    \ system’s services.\n\n## Software Manager\n\nThe default application([GUI](#glossary.xhtml_term-GUI)),\
    \ for installing software on Linux Mint. Applications with similar functionality\
    \ are available on other Linux distributions. For example:\n\n* Ubuntu Software\
    \ on Ubuntu\n* Software on Fedora and other GNOME-based distributions\n* Discover\
    \ on Kubuntu and other KDE-based distributions.\n\nRelated sections:\n\n`->` [The\
    \ quick and easy method](getting-software/quick-and-easy/index.xhtml)\n\n## Synaptic\n\
    \nA [GUI](#glossary.xhtml_term-GUI) package manager for systems using [apt](#glossary.xhtml_term-apt).\n\
    \nWebsite: [https://www.nongnu.org/synaptic/](https://www.nongnu.org/synaptic/)\n\
    \n## text editor\n\nProgram to edit text files.\n\nExamples ([GUI](#glossary.xhtml_term-GUI))\
    \ - Text Editor (xed) on Linux Mint, Text Editor (gedit) on Ubuntu, Kwrite on\
    \ KDE Plasma, Geany etc.,\n\nExamples (command-line) — [nano](#glossary.xhtml_term-nano),\
    \ VIM or vi, GNU Emacs etc.,\n\nRelated sections:\n\n`->` [Text Editor](#text-editor)\n\
    \n## Credits\n\n- `Debian`: used for the base.\n- `Ubuntu`: used for the base.\n\
    - `GNU`: used for the system.\n- `GNOME`: used for the desktop.\n- `KDE`: used\
    \ for the desktop.\n- `Linux`: used for the OS.\n- `Python`: used for the scripts.\n\
    - `R`: used for the environment.\n- `apt`: used for the package manager.\n- `nano`:\
    \ used for the editor.\n- `VIM`: used for the editor.\n- `vi`: used for the editor.\n\
    - `Emacs`: used for the editor.\n\n## Fonts\n\n- `Source Serif 4`: used for text.\n\
    - `Fira Sans`: used for text.\n- `Fira Code`: used for code.\n- `Recursive Mono`:\
    \ used for code.\n\n## Images\n\nThe emperor penguin image used in the book cover,\
    \ is obtained from openclipart.org.\n\n[https://openclipart.org/detail/47299/emperor-penguin](https://openclipart.org/detail/47299/emperor-penguin)\n\
    \n# Index\n\n[A](#genindex.xhtml_A) | [B](#genindex.xhtml_B) | [C](#genindex.xhtml_C)\
    \ | [D](#genindex.xhtml_D) | [E](#genindex.xhtml_E) | [F](#genindex.xhtml_F) |\
    \ [G](#genindex.xhtml_G) | [I](#genindex.xhtml_I) | [L](#genindex.xhtml_L) | [M](#genindex.xhtml_M)\
    \ | [N](#genindex.xhtml_N) | [O](#genindex.xhtml_O) | [P](#genindex.xhtml_P) |\
    \ [R](#genindex.xhtml_R) | [S](#genindex.xhtml_S) | [T](#genindex.xhtml_T) | [U](#genindex.xhtml_U)\
    \ | [V](#genindex.xhtml_V) | [W](#genindex.xhtml_W)\n\n## A\n\n|  \n\n*   [Anaconda](#glossary.xhtml_term-Anaconda)\n\
    \n |  \n\n*   [Anaconda Cloud](#glossary.xhtml_term-Anaconda-Cloud)\n"
  raw: "A simple tool to install [Debian package](#glossary.xhtml_term-Debian-package)\
    \ files along with their [dependencies](#glossary.xhtml_term-dependencies) (if\
    \ any).\n\nWebsite: [https://launchpad.net/gdebi](https://launchpad.net/gdebi)\n\
    \nGNU\n\nGNU is a recursive acronym for GNU’s Not Unix. The goal of the project\
    \ is to offer a Unix-compatible system that would be 100% free software.\n\nWebsite:\
    \ [https://www.gnu.org/](https://www.gnu.org/)\n\nGUI\n\nAbbreviation for graphical\
    \ user interface. On a personal computer, it typically includes application windows\
    \ with buttons to access their functions, icons for launching applications and\
    \ widgets for managing devices and services.\n\nIDE\n\nAbbreviation for integrated\
    \ development environment. Some examples include PyCharm, RStudio and Eclipse.\n\
    \nlocal-lib\n\nA Perl module to create a local directory structure to install\
    \ modules with their [dependencies](#glossary.xhtml_term-dependencies) without\
    \ requiring administrator privileges.\n\nWebsite: [https://metacpan.org/pod/local::lib](https://metacpan.org/pod/local::lib)\n\
    \nLinux Mint\n\nA desktop Linux distribution. It is based on [Debian](#glossary.xhtml_term-Debian)\
    \ and [Ubuntu](#glossary.xhtml_term-Ubuntu).\n\nWebsite: [https://linuxmint.com/](https://linuxmint.com/)\n\
    \nMEGA\n\nSoftware for Molecular Evolutionary Genetics Analysis. Available as\
    \ [GUI](#glossary.xhtml_term-GUI) and command-line versions.\n\nWebsite: [https://megasoftware.net/](https://megasoftware.net/)\n\
    \nMetaCPAN\n\nA search engine for Perl packages and modules available on [CPAN](#glossary.xhtml_term-CPAN).\n\
    \nWebsite: [https://metacpan.org/](https://metacpan.org/)\n\nMiniconda\n\nA minimal\
    \ distribution of [Conda](#glossary.xhtml_term-Conda). It is faster to install\
    \ and also uses less disk space, when compared to [Anaconda](#glossary.xhtml_term-Anaconda)\
    \ — the alternative installer which comes bundled with additional packages.\n\n\
    Website: [https://docs.conda.io/en/latest/miniconda.html](https://docs.conda.io/en/latest/miniconda.html)\n\
    \nModeller\n\nA program for comparative protein structure modelling by satisfaction\
    \ of spatial restraints.\n\nWebsite: [https://salilab.org/modeller/](https://salilab.org/modeller/)\n\
    \nnano\n\nA simple command-line based text editor.\n\nWebsite: [https://www.nano-editor.org/](https://www.nano-editor.org/)\n\
    \nOVA\n\nA file format for distributing virtual machine images.\n\npip\n\nThe\
    \ Python package installer. It can be used to install packages from [PyPI](#glossary.xhtml_term-PyPI)\
    \ and other Python package indexes.\n\nWebsite: [https://pip.pypa.io/](https://pip.pypa.io/)\n\
    \nPyMOL\n\nPyMOL is a molecular visualization system originally developed by Warren\
    \ L. Delano. It is currently maintained by Schrödinger, Inc.\n\nWebsite: [https://pymol.org/2/](https://pymol.org/2/)\n\
    \nPyPI\n\nAbbreviation for Python Package Index. Repository for software written\
    \ in Python (275,161 projects as of Dec 2020).\n\nWebsite: [https://pypi.org/](https://pypi.org/)\n\
    \nroot\n\nThe primary administrator account on a Linux system.\n\nR\n\nProgramming\
    \ language and free software environment for statistical computing and graphics.\n\
    \nWebsite: [https://r-project.org](https://r-project.org)\n\nRStudio Desktop\n\
    \nAn [IDE](#glossary.xhtml_term-IDE) for [R](#glossary.xhtml_term-R). It includes\
    \ an R console, an editor with syntax-highlighting and tools for plotting, debugging\
    \ and managing R packages. The open-source version can be downloaded for free\
    \ from the project website.\n\nWebsite: [https://rstudio.com/products/rstudio/download/](https://rstudio.com/products/rstudio/download/)\n\
    \nRelated sections:\n\n`->` [Installing a Debian package](#install.xhtml_installing-debian-package)\n\
    \nsetuptools\n\nPython program for building and installing Python packages.\n\n\
    shell\n\nThe shell provides a command-line interface (CLI) to the operating system’s\
    \ services.\n\nSoftware Manager\n\nThe default application([GUI](#glossary.xhtml_term-GUI)),\
    \ for installing software on Linux Mint.\n\nApplications with similar functionality\
    \ are available on other Linux distributions. For example:\n\n*   Ubuntu Software\
    \ on Ubuntu\n\n*   Software on Fedora and other GNOME-based distributions\n\n\
    *   Discover on Kubuntu and other KDE-based distributions.\n\nRelated sections:\n\
    \n`->` [The quick and easy method](getting-software/quick-and-easy/index.xhtml)\n\
    \nSynaptic\n\nA [GUI](#glossary.xhtml_term-GUI) package manager for systems using\
    \ [apt](#glossary.xhtml_term-apt).\n\nWebsite: [https://www.nongnu.org/synaptic/](https://www.nongnu.org/synaptic/)\n\
    \ntext editor\n\nProgram to edit text files.\n\nExamples ([GUI](#glossary.xhtml_term-GUI))\
    \ ­- Text Editor (xed) on Linux Mint, Text Editor (gedit) on Ubuntu, Kwrite on\
    \ KDE Plasma, Geany etc.,\n\nExamples (command-line) — [nano](#glossary.xhtml_term-nano),\
    \ VIM or vi, GNU Emacs etc.,\n\nRelated sections:\n\n`->` [Text Editor — create\
    \ and edit text files](using-linux/applications/text-editor.xhtml)\n\n`->` [Editing\
    \ text files using nano](command-line/editing-text/index.xhtml)\n\nUbuntu\n\n\
    Linux distribution developed by Canonical and community of developers. It is based\
    \ on [Debian](#glossary.xhtml_term-Debian).\n\nWebsite: [https://ubuntu.com/](https://ubuntu.com/)\n\
    \nwheel\n\nPython program for installing packages distributed in Python wheel\
    \ (`.whl`) format.\n\n# 8. Credits\n\nThis book is created on a Linux system using\
    \ open source software. Fonts and images used are under an open source licence\
    \ or in the public domain.\n\n**Software**\n\nLinux Mint\n\n— [https://linuxmint.com](https://linuxmint.com)\n\
    \nSphinx\n\n— [https://www.sphinx-doc.org/en/master/](https://www.sphinx-doc.org/en/master/)\n\
    \nsphinx-autobuild extension\n\n— [https://github.com/executablebooks/sphinx-autobuild](https://github.com/executablebooks/sphinx-autobuild)\n\
    \nLaTeX for generating PDF\n\n— [https://www.latex-project.org/](https://www.latex-project.org/)\n\
    \nGNOME Builder for editing text\n\n— [https://wiki.gnome.org/Apps/Builder](https://wiki.gnome.org/Apps/Builder)\n\
    \nFirefox for previewing HTML\n\n— [https://www.mozilla.org/en-GB/firefox/](https://www.mozilla.org/en-GB/firefox/)\n\
    \nPandoc for converting HTML to ODT\n\n— [https://pandoc.org/](https://pandoc.org/)\n\
    \nLibreOffice for proofreading\n\n— [https://www.libreoffice.org/](https://www.libreoffice.org/)\n\
    \nLanguageTool extension for spelling and grammar checks\n\n— [https://languagetool.org/](https://languagetool.org/)\n\
    \nInkscape for editing images\n\n— [https://inkscape.org/](https://inkscape.org/)\n\
    \nGIMP for editing images\n\n— [https://www.gimp.org/](https://www.gimp.org/)\n\
    \nBuilding and testing the virtual machine\n\nAnsible\n\n— [https://www.ansible.com/](https://www.ansible.com/)\n\
    \nVagrant\n\n— [https://www.vagrantup.com/](https://www.vagrantup.com/)\n\nVirtualBox\n\
    \n— [https://www.virtualbox.org/](https://www.virtualbox.org/)\n\n**Fonts**\n\n\
    Source Serif 4\n\n— [https://github.com/adobe-fonts/source-serif/](https://github.com/adobe-fonts/source-serif/)\n\
    \nFira Sans\n\n— [https://github.com/mozilla/Fira](https://github.com/mozilla/Fira)\n\
    \nFira Code\n\n— [https://github.com/tonsky/FiraCode](https://github.com/tonsky/FiraCode)\n\
    \nRecursive Mono\n\n— [https://github.com/arrowtype/recursive](https://github.com/arrowtype/recursive)\n\
    \n**Images**\n\nThe emperor penguin image used in the book cover, is obtained\
    \ from openclipart.org.\n\n[https://openclipart.org/detail/47299/emperor-penguin](https://openclipart.org/detail/47299/emperor-penguin)\n\
    \n# Index\n\n[**A**](#genindex.xhtml_A) | [**B**](#genindex.xhtml_B) | [**C**](#genindex.xhtml_C)\
    \ | [**D**](#genindex.xhtml_D) | [**E**](#genindex.xhtml_E) | [**F**](#genindex.xhtml_F)\
    \ | [**G**](#genindex.xhtml_G) | [**I**](#genindex.xhtml_I) | [**L**](#genindex.xhtml_L)\
    \ | [**M**](#genindex.xhtml_M) | [**N**](#genindex.xhtml_N) | [**O**](#genindex.xhtml_O)\
    \ | [**P**](#genindex.xhtml_P) | [**R**](#genindex.xhtml_R) | [**S**](#genindex.xhtml_S)\
    \ | [**T**](#genindex.xhtml_T) | [**U**](#genindex.xhtml_U) | [**V**](#genindex.xhtml_V)\
    \ | [**W**](#genindex.xhtml_W)\n\n## A\n\n|  \n\n*   [**Anaconda**](#glossary.xhtml_term-Anaconda)\n\
    \n |  \n\n*   [**Anaconda Cloud**](#glossary.xhtml_term-Anaconda-Cloud)"
