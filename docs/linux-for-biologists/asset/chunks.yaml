    \n# 4.1. Shell and Terminal\n\nA [shell](#glossary.xhtml_term-shell) is a program\
    \ that provides an interface to the operating system’s services. The most commonly\
    \ used shell in Linux distributions is [Bash](#glossary.xhtml_term-Bash).\n\n\
    A *terminal* program runs the shell and provides an interface for users to type\
    \ commands.\n\nThe default terminal application in Linux Mint is Terminal ([Fig.\
    \ 78](#shell-terminal.xhtml_fig-42a)). You can launch it from the Applications\
    \ Menu or by clicking on its icon in the Panel.\n\n![../_images/terminal-login.png](_images/terminal-login.png)\n\
    Fig. 78 A Terminal window\n\nOnce a terminal window is open, you can start typing\
    \ commands at the `$` prompt.\n\nFor example, the following command:\n\n```\n\
    pwd\n```\n\nWill output the current working directory:\n\n```\n/home/user\n```\n\
    \n## 4.1.1. The shell prompt\n\nThe prompt `user@cookbook:~$` in [Fig. 78](#shell-terminal.xhtml_fig-42a),\
    \ indicates the following:\n\n`user` — username of the account\n`cookbook` — the\
    \ computer’s hostname\n`~` — short form for the user’s home directory i.e., `/home/user`\n\
    `$` — a regular user account. For the root user, this will change to `#`\n\n#\
    \ 4.2. Commands — an overview\n\nThis section provides an overview of some commands\
    \ that are used frequently on Linux systems. Familiar with these will help you\
    \ navigate the file system and work with files, and directories.\n\n*   [4.2.1.\
    \ Command options](options.xhtml)\n*   [4.2.2. Getting help on using commands](help.xhtml)\n\
    *   [4.2.3. `date` — display current date and time](date.xhtml)\n*   [4.2.4. `cd`\
    \ — change directory](cd.xhtml)\n*   [4.2.5. `mkdir` — create new directory](mkdir.xhtml)\n\
    *   [4.2.6. `rmdir` — remove empty directory](rmdir.xhtml)\n*   [4.2.7. `ls` —\
    \ list files](ls.xhtml)\n*   [4.2.8. `cp` — copy files](cp.xhtml)\n*   [4.2.9.\
    \ `cat` — display contents of files or combine them](cat.xhtml)\n*   [4.2.10.\
    \ `less` — view and navigate file contents](less.xhtml)\n*   [4.2.11. `head` —\
    \ print first few lines of a file](head.xhtml)\n*   [4.2.12. `tail` — print last\
    \ few lines of a file](tail.xhtml)\n*   [4.2.13. `mv` — move a file or directory](mv.xhtml)\n\
    *   [4.2.14. `rm` — remove files or directories](rm.xhtml)\n*   [4.2.15. `echo`\
    \ — display text or values of variables](echo.xhtml)\n\n## 4.2.1. Command options\n\
    \nA command might support additional options.\n\nFor example, the command:\n\n\
    ```\nls\n```\n\n— prints a list of files in a directory, whereas:\n\n```\nls -a\n\
    ```\n\n— will also print hidden files in that directory.\n\n## 4.2.2. Getting\
    \ help on using commands\n\nIn most cases, you can see the complete list of options\
    \ a command supports using `--help`:\n\n```\nls --help\n```\n\nOutput:\n"
