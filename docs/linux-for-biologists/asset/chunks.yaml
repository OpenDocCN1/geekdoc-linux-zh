  trans: "\n\n![../../_images/user-register-here.png](img/user-register-here.png)\n\
    \n图 89 点击“此处注册”链接\n\n在“创建 Galaxy 账户”页面上，输入您的电子邮件地址、密码及其确认密码，以及一个公共名称（图 90）。\n\n\
    ## 注意事项\n此用户账户与您在 `usegalaxy.org`或其他 Galaxy 服务器上的账户没有关联。\n\n它仅存在于您的本地 Galaxy 实例中。您也可以忽略页面顶通知，该通知不适用于本地实例。\n\
    \n![../../_images/user-registration-page.png](img/user-registration-page.png)\n\
    \n图 90 用户账户创建页面\n\n点击“创建（Create）”按钮继续。\n\n如果账户创建成功，您将会被登录并重定向到您的 Galaxy 实例的主页。\n\
    \n*   5.3.1\\. 管理您的账户\n\n# 5.3.1\\. 管理您的账户\n\n您可以通过点击导航栏中的用户名来管理账户（图 91）。\n\n\
    ![../../_images/user-logged-in.png](img/user-logged-in.png)\n\n图 91 以用户身份登录\n\n\
    如果您将从 Galaxy 工具共享库（tool shed）安装额外的工具，则此用户账户需要管理员权限。您可以在下一步中进行配置。\n\n# 5.4\\. 为用户授予管理员权限\n\
    \n要为用户授予管理员权限，您需要为 Galaxy 创建一个配置文件，并将用户的电子邮件地址添加到管理员列表中，然后重启 Galaxy 以使更改生效。\n\n\
    *   5.4.1\\. 创建配置文件\n*   5.4.2. 将用户添加到管理员用户列表\n*   5.4.3. 重启 Galaxy\n*   5.4.4\\\
    . 验证管理员访问\n\n# 5.4.1\\. 创建配置文件\n\nGalaxy 包含了一个示例配置文件——`galaxy.yml.sample`。\n\n\
    要使用示例文件作为模板创建配置文件，请按照以下步骤操作（参见图 92）：\n\n1.  使用文件管理器导航到 `$HOME/programs/galaxy/config`\
    \ 目录\n2.  双击 `galaxy.yml.sample` 在文本编辑器中打开它\n3.  将其保存为同一目录下的 `galaxy.yml`\n\n\
    ![../../_images/galaxy-yml-sample.png](img/galaxy-yml-sample.png)\n\n图 92 复制 Galaxy\
    \ 的示例配置文件\n\n## 注意事项\n或者，您可以在终端中使用 `cp` 命令来复制文件。\n\n假设您在 `$HOME/programs/galaxy`\
    \ 目录下，请执行以下操作：\n\n```\ncp config/galaxy.yml.sample config/galaxy.yml\n```\n\n\
    # 5.4.2\\. 将用户添加到管理员用户列表\n\n在文本编辑器中打开 `galaxy.yml` 的情况下，搜索 `admin_users` 设置。\n\
    \n您将发现以下部分：\n\n```\n# Administrative users - set this to a comma-separated\n#\
    \ list of valid Galaxy users (email addresses). These\n# users will have access\
    \ to the Admin section of the\n# server, and will have access to create users,\n\
    # groups, roles, libraries, and more.  For more\n# information, see: https://galaxyproject.org/admin/\n\
    #admin_users: null\n```\n\n通过删除开头的 `#` 符号来取消注释 `admin_users`。\n\n将 `null` 替换为用户账户的电子邮件地址。\n\
    \n例如：\n\n```\nadmin_users: user@example.org\n```\n\n保存文件。\n\n# 5.4.3\\. 重启 Galaxy\n\
    \n如果 Galaxy 正在运行，请停止 Galaxy，然后重新启动它。\n\n# 5.4.4\\. 验证管理员访问\n\n当您再次登录时，您将在导航栏中看到“管理员（Admin）”链接（图\
    \ 93）。\n\n![../../_images/admin-link.png](img/admin-link.png)\n\n图 93 导航栏中的管理员链接\n\
    \n如果您点击“管理员”，您将进入管理页面（图 94）。\n\n![../../_images/admin-home.png](img/admin-home.png)\n\
    \n图 94 Galaxy 管理页面\n\n## 安装工具\n\n要安装新工具，请点击以下链接：\n\n工具管理（Tool Management） ‣ 安装与卸载（Install\
    \ and Uninstall）\n\n您将进入工具管理页面（图 95）。\n\n![../../_images/admin-tool-management.png](img/admin-tool-management.png)\n\
    \n图 95 工具管理页面\n\n从这里，您可以从 Galaxy 主工具共享库中搜索并安装工具。\n\n# 6. 文档\n\n用于管理参考文献和书目、笔记等的安装及软件，\n\
    \n*   6.1. 使用 Zotero 管理参考文献\n    *   6.1.1. 安装 Zotero\n    *   6.1.2. 从网络收集参考文献\n\
    \    *   6.1.3. 将 Zotero 集成到 LibreOffice\n\n# 6.1. 使用 Zotero 管理参考文献\n\nZotero\
    \ 是一款用于收集和组织文章和其他出版物的免费开源软件。文章可以使用收藏和标签进行组织，并包含在创建的文档中。\n\n*   6.1.1. 安装 Zotero\n\
    *   6.1.2. 从网络收集参考文献\n*   6.1.3. 将 Zotero 集成到 LibreOffice\n\n# 6.1.1. 安装 Zotero\n\
    \n要从网络收集参考文献，需要安装 Zotero Connector。需要额外的插件（或扩展）。请按照以下步骤安装它们。\n\n## 安装 Zotero Connector\n\
    \n要在 Firefox 中安装 Zotero Connector：\n\n1.  从应用程序菜单打开 Zotero。\n    浏览器将打开一个窗口，您将进入[安装页面](https://www.zotero.org/start)\
    \ [https://www.zotero.org/start]。\n    点击“安装（Install）”按钮（图 96）。\n\n    ![../../_images/1-zotero-addon-install.png](img/1-zotero-addon-install.png)\n\
    \n    图 96 Zotero 插件安装页面\n\n2.  您现在会看到一个对话框，询问是否想要继续从 www.zotero.org 安装此插件。\n\
    \    点击“继续安装（Continue to Installation）”按钮继续（图 97）。\n\n    ![../../_images/2-zotero-continue.png](img/2-zotero-continue.png)\n\
    \n    图 97 点击继续安装继续\n\n3.  您现在会看到一个包含此插件所需权限信息的对话框。\n    点击“添加（Add）”按钮继续（图 98）。\n\
    \n    ![../../_images/3-zotero-add.png](img/3-zotero-add.png)\n\n    图 98 点击“添加”确认安装\n\
    \n    安装现在将开始。\n\n    完成后，您将在浏览器工具栏中看到 Zotero 图标（图 99）。\n\n# 6.1.3. 将 Zotero 集成到\
    \ LibreOffice\n\n"
- fmt: "\n![../../_images/4-zotero-toolbar-icon.png](_images/4-zotero-toolbar-icon.png)\n\
    \nFig. 99 Zotero Connector installed successfully\n\nYou can now start saving\
    \ articles from the browser to your Zotero library.\n\n# 6.1.3 Integrating Zotero\
    \ in LibreOffice\n\nTo be able to insert citations and bibliography in your documents,\
    \ you will need to install the Word Processor Add-in.\n\n## Installing Word Processor\
    \ add-in\n\nTo install the add-in in LibreOffice:\n\n1. From the main menu bar\
    \ of Zotero, select `Edit` ‣ `Preferences` ([Fig. 100](#libreoffice.xhtml_fig-711e)).\n\
    \   ![../../_images/5-zotero-edit-preferences.png](_images/5-zotero-edit-preferences.png)\n\
    \   Fig. 100 Viewing Zotero preferences\n\n2. In the Zotero Preferences dialog\
    \ window that opens, click on the `Cite` tab.\n   Now, click on the `Word Processors`\
    \ tab to select it.\n   Click on the `Install LibreOffice Add-in` button ([Fig.\
    \ 101](#libreoffice.xhtml_fig-711f)).\n   ![../../_images/6-zotero-install-libreoffice-addon.png](_images/6-zotero-install-libreoffice-addon.png)\n\
    \   Fig. 101 Installing LibreOffice Add-in from Zotero preferences\n\n3. The Zotero\
    \ LibreOffice Plugin Installation wizard will now open ([Fig. 102](#libreoffice.xhtml_fig-711g))\n\
    \   ![../../_images/7-zotero-addin-intro.png](_images/7-zotero-addin-intro.png)\n\
    \   Fig. 102 Zotero LibreOffice Plugin Installation wizard\n   Click on the `Next`\
    \ button to proceed.\n\n4. Click on `Manual Installation` in the select LibreOffice\
    \ installations dialog window ([Fig. 103](#libreoffice.xhtml_fig-711h)).\n   ![../../_images/8-zotero-manual-install.png](_images/8-zotero-manual-install.png)\n\
    \   Fig. 103 Click on the Manual Installation button\n\n5. A file browser window\
    \ will open, with the directory set to the location of the add-in file — `Zotero_OpenOffice_Integration.oxt`\
    \ ([Fig. 104](#libreoffice.xhtml_fig-711i)).\n   ![../../_images/9-zotero-oxt-file.png](_images/9-zotero-oxt-file.png)\n\
    \   Fig. 104 File browser open with location of the Add-in file\n\n6. Double-click\
    \ on `Zotero_OpenOffice_Integration.oxt`.\n   This will open LibreOffice Extension\
    \ Manager, with a prompt requesting if you would like to install the add-in.\n\
    \   Click on the `OK` button to confirm ([Fig. 105](#libreoffice.xhtml_fig-711j)).\n\
    \   ![../../_images/10-zotero-libreoffice-ext-install.png](_images/10-zotero-libreoffice-ext-install.png)\n\
    \   Fig. 105 Click on the OK button in LibreOffice Extension Manager\n   The add-in\
    \ will now be installed ([Fig. 106](#libreoffice.xhtml_fig-711k)).\n   ![../../_images/11-zotero-libreoffice-installed.png](_images/11-zotero-libreoffice-installed.png)\n\
    \   Fig. 106 Zotero LibreOffice Add-in installed successfully\n   If you restart\
    \ LibreOffice, you will notice the Zotero toolbar in the main window ([Fig. 107](#libreoffice.xhtml_fig-711l)).\n\
    \   ![../../_images/12-libreoffice-zotero-toolbar.png](_images/12-libreoffice-zotero-toolbar.png)\n\
    \   Fig. 107 Zotero toolbar in LibreOffice\n\n— You can now start inserting citations\
    \ and bibliographies in your documents.\n\n# 6.2 Creating a notebook using Zim\n\
    \nZim is a [GUI](#glossary.xhtml_term-GUI) application for taking notes on the\
    \ desktop. You can use it to create and maintain a personal or laboratory notebook\
    \ on your computer.\n\n* [6.2.1. Features of Zim](#features.xhtml)\n* [6.2.2.\
    \ Installing Zim](#install.xhtml)\n* [6.2.3. Creating a notebook](#create.xhtml)\n\
    * [6.2.4. Taking notes](#notes.xhtml)\n* [6.2.5. Exporting notes and notebooks](#export.xhtml)\n\
    * [6.2.6. Activating more features using plugins](#plugins.xhtml)\n* [6.2.7. Getting\
    \ help](#help.xhtml)\n\n# 6.2.1 Features of Zim\n\nUsing Zim, you can:\n\n**Create\
    \ digital notebooks**\n— add pages, and organize them using an index page.\n\n\
    **Take notes quickly**\n— using a WYSIWYG interface [1](#features.xhtml_id3).\n\
    \n**Insert images**\n— files, symbols, screenshots, equations and more [2](#features.xhtml_id4).\n\
    \n**Export notes**\n— to formats like HTML, LaTeX, and Markdown.\n\n—\nWith the\
    \ help of plugins, you can add even more functionality.\n\n[1](#features.xhtml_id1)\n\
    Similar in functionality to that of word processors like LibreOffice Writer. You\
    \ do not need to learn a new markup language to use Zim.\n\n[2](#features.xhtml_id2)\n\
    Requires enabling plugins in preferences.\n\n# 6.2.2 Installing Zim\n\nZim is\
    \ available in the distribution repositories.\n\nYou can install it using [Software\
    \ Manager](#glossary.xhtml_term-Software-Manager) ([Fig. 108](#install.xhtml_fig-622a)).\n\
    ![../../_images/zim-software-manager.png](_images/zim-software-manager.png)\n\
    Fig. 108 Installing Zim using Software Manager\n\n# 6.2.3 Creating a notebook\n\
    \nOpen Zim by clicking on its icon in applications menu ([Fig. 109](#create.xhtml_fig-622b)).\
    \ You can use the search bar to locate it quickly.\n![../../_images/zim-applications-menu.png](_images/zim-applications-menu.png)\n\
    Fig. 109 Opening Zim from applications menu\n\nWhen you open the program for the\
    \ first time, you will notice an Add Notebook dialog ([Fig. 110](#create.xhtml_fig-622c)).\n\
    Here, you can set a name for this notebook and select a directory to save notebooks.\n\
    ![../../_images/zim-add-notebook.png](_images/zim-add-notebook.png)\nFig. 110\
    \ Add notebook\n\nYou can accept the defaults.\n\nClick on the `OK` button to\
    \ proceed.\nThis will open the main window of the program ([Fig. 111](#create.xhtml_fig-622d)).\n\
    ![../../_images/zim-home.png](_images/zim-home.png)\nFig. 111 Main window of Zim\n\
    \n# 6.2.4 Taking notes\n\nThe Home page is the main page of a notebook.\nYou can\
    \ start typing your notes here. Zim saves changes automatically.\n\n## Basic text\
    \ formatting\n\nFormatting text in Zim is similar to that of word processor programs.\n\
    \nYou can use the `Format` menu bar entry and select the desired option ([Fig.\
    \ 112](#notes.xhtml_fig-712)).\n![../../_images/zim-format.png](_images/zim-format.png)\n\
    Fig. 112 Options for formatting\n\n### Keyboard shortcuts\n\nAlternatively, you\
    \ can use keyboard shortcuts to apply formatting to your text.\nFor example:\n\
    **Bold** : `Ctrl+b`\n*Italic* or *Emphasis* : `Ctrl+i`\n^(Superscript) : `Ctrl+Shift+p`\n\
    [Subscript] : `Ctrl+Shift+b`\n\nFor headings, use:\nHeading 1 : `Ctrl+`\nHeading\
    \ 2 : `Ctrl+2`\nHeading 3 : `Ctrl+3`\nHeading 4 : `Ctrl+4`\nHeading 5 : `Ctrl+5`\n\
    \n## Inserting images\n\nTo insert an image, you can select the following option\
    \ from the menu bar: `Insert` ‣ `Image`.\nIn the dialog that opens, browse to\
    \ the directory containing your image and then select the image ([Fig. 113](#notes.xhtml_fig-113)).\n\
    ![../../_images/zim-insert-image.png](_images/zim-insert-image.png)\nFig. 113\
    \ Insert image. Check image first option\n\nCheck the `Attach image first` option.\
    \ This will copy the image to your notebook directory.\nClick on the `Open` button\
    \ to insert the image ([Fig. 114](#notes.xhtml_fig-114)).\n![../../_images/zim-inserted-image.png](_images/zim-inserted-image.png)\n\
    Fig. 114 Image inserted into current page\n\n### Resizing an image\n\nIf you would\
    \ like to resize the image, right-click on the image and select `Edit Properties`\
    \ ([Fig. 115](#notes.xhtml_fig-115)).\n![../../_images/zim-image-edit-properties.png](_images/zim-image-edit-properties.png)\n\
    Fig. 115 Edit image properties\n\nIn the dialog window that opens, change either\
    \ the `Width` or the `Height` of the image to the desired size and click on the\
    \ `OK` button ([Fig. 116](#notes.xhtml_fig-116)).\n![../../_images/zim-image-resize.png](_images/zim-image-resize.png)\n\
    Fig. 116 Change the width or height of the image\n\nThe image will now be resized\
    \ ([Fig. 117](#notes.xhtml_fig-117)).\n![../../_images/zim-image-resized.png](_images/zim-image-resized.png)\n\
    Fig. 117 Resized image\n\n## Adding more pages\n\nTo add more pages, select the\
    \ following option from the menu bar: `File` ‣ `New Page` ([Fig. 118](#notes.xhtml_fig-118)).\n\
    \nNote\n\nYou can also right-click on a page in the Index view and select the\
    \ `New Page Here` option.\n![../../_images/zim-new-page.png](_images/zim-new-page.png)\n\
    Fig. 118 Adding a new page\n"
  raw: "    ![../../_images/4-zotero-toolbar-icon.png](_images/4-zotero-toolbar-icon.png)\n\
    \n    Fig. 99 Zotero Connector installed successfully\n\nYou can now start saving\
    \ articles from the browser to your Zotero library.\n\n# 6.1.3\\. Integrating\
    \ Zotero in LibreOffice\n\nTo be able to insert citations and bibliography in\
    \ your documents, you will need to install the Word Processor Add-in.\n\n## Installing\
    \ Word Processor add-in\n\nTo install the add-in in LibreOffice:\n\n1.  From the\
    \ main menu bar of Zotero, select\n\n    Edit ‣ Preferences ([Fig. 100](#libreoffice.xhtml_fig-711e)).\n\
    \n    ![../../_images/5-zotero-edit-preferences.png](_images/5-zotero-edit-preferences.png)\n\
    \n    Fig. 100 Viewing Zotero preferences\n\n2.  In the Zotero Preferences dialog\
    \ window that opens, click on the Cite tab.\n\n    Now, click on the Word Processors\
    \ tab to select it.\n\n    Click on the Install LibreOffice Add-in button ([Fig.\
    \ 101](#libreoffice.xhtml_fig-711f)).\n\n    ![../../_images/6-zotero-install-libreoffice-addon.png](_images/6-zotero-install-libreoffice-addon.png)\n\
    \n    Fig. 101 Installing LibreOffice Add-in from Zotero preferences\n\n3.  The\
    \ Zotero LibreOffice Plugin Installation wizard will now open ([Fig. 102](#libreoffice.xhtml_fig-711g))\n\
    \n    ![../../_images/7-zotero-addin-intro.png](_images/7-zotero-addin-intro.png)\n\
    \n    Fig. 102 Zotero LibreOffice Plugin Installation wizard\n\n    Click on the\
    \ Next button to proceed.\n\n4.  Click on Manual Installation in the select LibreOffice\
    \ installations dialog window ([Fig. 103](#libreoffice.xhtml_fig-711h)).\n\n \
    \   ![../../_images/8-zotero-manual-install.png](_images/8-zotero-manual-install.png)\n\
    \n    Fig. 103 Click on the Manual Installation button\n\n5.  A file browser window\
    \ will open, with the directory set to the location of the add-in file — Zotero_OpenOffice_Integration.oxt\
    \ ([Fig. 104](#libreoffice.xhtml_fig-711i)).\n\n    ![../../_images/9-zotero-oxt-file.png](_images/9-zotero-oxt-file.png)\n\
    \n    Fig. 104 File browser open with location of the Add-in file\n\n6.  *Double-click*\
    \ on Zotero_OpenOffice_Integration.oxt.\n\n    This will open LibreOffice Extension\
    \ Manager, with a prompt requesting if you would like to install the add-in.\n\
    \n    Click on the OK button to confirm ([Fig. 105](#libreoffice.xhtml_fig-711j)).\n\
    \n    ![../../_images/10-zotero-libreoffice-ext-install.png](_images/10-zotero-libreoffice-ext-install.png)\n\
    \n    Fig. 105 Click on the OK button in LibreOffice Extension Manager\n\n   \
    \ The add-in will now be installed ([Fig. 106](#libreoffice.xhtml_fig-711k)).\n\
    \n    ![../../_images/11-zotero-libreoffice-installed.png](_images/11-zotero-libreoffice-installed.png)\n\
    \n    Fig. 106 Zotero LibreOffice Add-in installed successfully\n\n    If you\
    \ *restart* LibreOffice, you will notice the Zotero toolbar in the main window\
    \ ([Fig. 107](#libreoffice.xhtml_fig-711l)).\n\n    ![../../_images/12-libreoffice-zotero-toolbar.png](_images/12-libreoffice-zotero-toolbar.png)\n\
    \n    Fig. 107 Zotero toolbar in LibreOffice\n\n—\n\nYou can now start inserting\
    \ citations and bibliographies in your documents.\n\n# 6.2\\. Creating a notebook\
    \ using Zim\n\nZim is a [GUI](#glossary.xhtml_term-GUI) application for taking\
    \ notes on the desktop. You can use it to create and maintain a personal or laboratory\
    \ notebook on your computer.\n\n*   [6.2.1\\. Features of Zim](#features.xhtml)\n\
    \n*   [6.2.2. Installing Zim](#install.xhtml)\n\n*   [6.2.3\\. Creating a notebook](#create.xhtml)\n\
    \n*   [6.2.4\\. Taking notes](#notes.xhtml)\n\n*   [6.2.5\\. Exporting notes and\
    \ notebooks](#export.xhtml)\n\n*   [6.2.6. Activating more features using plugins](#plugins.xhtml)\n\
    \n*   [6.2.7\\. Getting help](#help.xhtml)\n\n# 6.2.1\\. Features of Zim\n\nUsing\
    \ Zim, you can:\n\n**Create digital notebooks**\n\n— add pages, and organize them\
    \ using an index page.\n\n**Take notes quickly**\n\n— using a WYSIWYG interface\
    \ [1](#features.xhtml_id3).\n\n**Insert images**\n\n— files, symbols, screenshots,\
    \ equations and more [2](#features.xhtml_id4).\n\n**Export notes**\n\n— to formats\
    \ like HTML, LaTeX, and Markdown.\n\n—\n\nWith the help of plugins, you can add\
    \ even more functionality.\n\n[1](#features.xhtml_id1)\n\nSimilar in functionality\
    \ to that of word processors like LibreOffice Writer. You do not need to learn\
    \ a new markup language to use Zim.\n\n[2](#features.xhtml_id2)\n\nRequires enabling\
    \ plugins in preferences.\n\n# 6.2.2\\. Installing Zim\n\nZim is available in\
    \ the distribution repositories.\n\nYou can install it using [Software Manager](#glossary.xhtml_term-Software-Manager)\
    \ ([Fig. 108](#install.xhtml_fig-622a)).\n\n![../../_images/zim-software-manager.png](_images/zim-software-manager.png)\n\
    \nFig. 108 Installing Zim using Software Manager\n\n# 6.2.3\\. Creating a notebook\n\
    \nOpen Zim by clicking on its icon in applications menu ([Fig. 109](#create.xhtml_fig-622b)).\
    \ You can use the search bar to locate it quickly.\n\n![../../_images/zim-applications-menu.png](_images/zim-applications-menu.png)\n\
    \nFig. 109 Opening Zim from applications menu\n\nWhen you open the program for\
    \ the first time, you will notice an Add Notebook dialog ([Fig. 110](#create.xhtml_fig-622c)).\n\
    \nHere, you can set a name for this notebook and select a directory to save notebooks.\n\
    \n![../../_images/zim-add-notebook.png](_images/zim-add-notebook.png)\n\nFig.\
    \ 110 Add notebook\n\n*You can accept the defaults*.\n\nClick on the OK button\
    \ to proceed.\n\nThis will open the main window of the program ([Fig. 111](#create.xhtml_fig-622d)).\n\
    \n![../../_images/zim-home.png](_images/zim-home.png)\n\nFig. 111 Main window\
    \ of Zim\n\n# 6.2.4. Taking notes\n\nThe Home page is the main page of a notebook.\n\
    \nYou can start typing your notes here. Zim saves changes automatically.\n\n##\
    \ Basic text formatting\n\nFormatting text in Zim is similar to that of word processor\
    \ programs.\n\nYou can use the Format menu bar entry and select the desired option\
    \ ([Fig. 112](#notes.xhtml_fig-624a)).\n\n![../../_images/zim-format.png](_images/zim-format.png)\n\
    \nFig. 112 Options for formatting text\n\n### Keyboard shortcuts\n\nAlternatively,\
    \ you can use keyboard shortcuts to apply formatting to your text.\n\nFor example:\n\
    \n**Bold** : `Ctrl``+``b`\n\n*Italic* or *Emphasis* : `Ctrl``+``i`\n\n^(Superscript)\
    \ : `Ctrl``+``Shift``+``p`\n\n[Subscript] : `Ctrl``+``Shift``+``b`\n\nFor headings,\
    \ use:\n\nHeading 1: `Ctrl``+``1`\n\nHeading 2: `Ctrl``+``2`\n\nHeading 3: `Ctrl``+``3`\n\
    \nHeading 4: `Ctrl``+``4`\n\nHeading 5: `Ctrl``+``5`\n\n## Inserting images\n\n\
    To insert an image, you can select the following option from the menu bar:\n\n\
    Insert ‣ Image\n\nIn the dialog that opens, browse to the directory containing\
    \ your image and then select the image ([Fig. 113](#notes.xhtml_fig-624b)).\n\n\
    ![../../_images/zim-insert-image.png](_images/zim-insert-image.png)\n\nFig. 113\
    \ Insert image. Check Attach image first option\n\nCheck the Attach image first\
    \ option. This will copy the image to your notebook directory.\n\nClick on the\
    \ Open button to insert the image ([Fig. 114](#notes.xhtml_fig-624c)).\n\n![../../_images/zim-inserted-image.png](_images/zim-inserted-image.png)\n\
    \nFig. 114 Image inserted into current page\n\n### Resizing an image\n\nIf you\
    \ would like to resize the image, *right-click* on the image and select Edit Properties\
    \ ([Fig. 115](#notes.xhtml_fig-624d)).\n\n![../../_images/zim-image-edit-properties.png](_images/zim-image-edit-properties.png)\n\
    \nFig. 115 Edit image properties\n\nIn the dialog window that opens, change either\
    \ the Width or the Height of the image to the desired size and click on the OK\
    \ button ([Fig. 116](#notes.xhtml_fig-624e)).\n\n![../../_images/zim-image-resize.png](_images/zim-image-resize.png)\n\
    \nFig. 116 Change the width or height of the image\n\nThe image will now be resized\
    \ ([Fig. 117](#notes.xhtml_fig-324f)).\n\n![../../_images/zim-image-resized.png](_images/zim-image-resized.png)\n\
    \nFig. 117 Resized image\n\n## Adding more pages\n\nTo add more pages, select\
    \ the following option from the menu bar ([Fig. 118](#notes.xhtml_fig-624g)):\n\
    \nFile ‣ New Page\n\nNote\n\nYou can also *right-click* on a page in the Index\
    \ view and select the New Page Here option.\n\n![../../_images/zim-new-page.png](_images/zim-new-page.png)\n\
    \nFig. 118 Adding a new page"
