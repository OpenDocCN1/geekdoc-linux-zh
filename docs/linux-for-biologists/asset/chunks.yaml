    \n![../../_images/home-directory.png](_images/home-directory.png)\n\nFig. 34 Home\
    \ directory\n\n## Notes\n\n### /home/user\n\nThe complete (or absolute) path to\
    \ your home directory will be of the form `/home/user`, where `user` is your username\
    \ on the system.\n\n### $HOME\n\nThe `HOME` environment variable will automatically\
    \ be set to the complete path to your home directory in the filesystem.\n\nHence,\
