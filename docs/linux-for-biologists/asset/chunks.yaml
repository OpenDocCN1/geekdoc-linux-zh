    \ case-sensitive\n\nOne thing you will need to remember is that file and directory\
    \ names in Linux are case-sensitive.\n\nFor example, a file named:\n\n```\nsequence.txt\n\
    ```\n\nis different from:\n\n```\nSequence.txt\n```\n\nSimilarly, `Documents`\
    \ and `documents` are two different directories.\n\nBoth these files or directories\
    \ mentioned above, can exist in the same directory and can have different contents.\n\
    \n# 2.5.5. Accessing the root filesystem\n\nTo access the root filesystem (`/`),\
    \ click on File System in the sidebar of file manager ([Fig. 36](#root-filesystem.xhtml_fig-254a)).\n\
    \n![../../_images/file-system.png](_images/file-system.png)\n\nFig. 36 Click on\
    \ File System entry to access the root filesystem\n\n## Directories under `/`\
    \ and their functions\n\n`/etc`\n— stores configuration files of applications\n\
    \n`/home`\n— contains home directories of users\n\n`/media`\n— locations where\
    \ devices like external disks will be mounted i.e., made available\n\n`/root`\n\
    — home directory of `root` user (administrator)\n\n`/tmp`\n— temporary files created\
    \ by applications\n\n`/usr`\n— applications and libraries are installed here along\
    \ with their data and documentation\n\n`/var`\n— storage for log files, application\
    \ cache, databases etc.,\n\n## Root file system and root home directory are different\n\
    \n### `/` is the root filesystem\n\nAll users on the system can access files and\
    \ directories here, provided they have the appropriate permissions.\n\n### `/root`\
    \ is home directory of root\n\nOnly root will have access to it.\n\n# 2.5.6. Transferring\
    \ files between systems\n\nOne useful feature of Files is the ability to connect\
    \ to remote systems using protocols like SSH, FTP, SMB and Webdav. Once connected,\
    \ you can transfer files from your Linux desktop to the remote system or vice-versa.\n\
    \nTo connect to a remote system, use the following menu entry in Files ([Fig.\
    \ 37](#transfer-files.xhtml_fig-255a)):\n\nFile ‣ Connect to Server\n\n![../../_images/files-connect.png](_images/files-connect.png)\n\
    \nFig. 37 Connect to Server option in Files\n\n## Connecting to an SSH server\n\
    \nOpen File ‣ Connect to Server and follow the steps below ([Fig. 38](#transfer-files.xhtml_fig-255b)):\n\
    \n1. In the field corresponding to Server, enter the domain name or IP address\
    \ of the server you are connecting to\n2. Port `22` is the default for SSH, so\
    \ you do not need to change that usually\n3. From the Type drop-down box, select\
    \ SSH\n4. Under Folder, you can specify a directory (optional) to open, once connection\
    \ is successful\n5. Enter the username and password of your account on the server\n\
    6. Click on the Connect button\n\n![../../_images/files-connect-ssh.png](_images/files-connect-ssh.png)\n\
    \nFig. 38 Connecting to an SSH server\n\nOnce the remote directory is open in\
    \ Files, you can start transferring files from your desktop or vice-versa.\n\n\
