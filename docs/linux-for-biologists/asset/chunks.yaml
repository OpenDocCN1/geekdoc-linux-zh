    \ After installing the module with `cpanm``Bio::Phylo`, create a file using a\
    \ text editor and copy the following content:\n\n```\nuse Bio::Phylo;\n\n# print\
    \ version\nprint Bio::Phylo->VERSION;\n\n# print citation\nprint Bio::Phylo->CITATION;\n\
    ```\n\nSave the file as `biophylo_test.pl` and then run it:\n\n```\nperl biophylo_test.pl\n\
    ```\n\nOutput:\n\n```\nv2.0.1Rutger A Vos, Jason Caravas, Klaas Hartmann, Mark\
    \ A Jensen and Chase Miller, 2011.\nBio::Phylo - phyloinformatic analysis using\
    \ Perl. BMC Bioinformatics 12:63.\ndoi:10.1186/1471-2105-12-63\n```\n\n# 3.4.\
    \ R packages\n\nIf your software of interest is available as an R package on [CRAN](#glossary.xhtml_term-CRAN)\
    \ or [Bioconductor](#glossary.xhtml_term-Bioconductor), you can install it using\
    \ the `install.packages()` or `BiocManager::install()` commands respectively.\n\
    \nNote\n\nYour software might already be available using [The quick and easy method](../quick-and-easy/index.xhtml).\n\
    \nSearch for package names starting with `r-cran-` or `r-bioc-`.\n\n*   [3.4.1.\
    \ Requirements](#requirements.xhtml)\n\n*   [3.4.2\\. Starting an R session](#start.xhtml)\n\
    \n*   [3.4.3\\. Installing a package from CRAN](#cran.xhtml)\n\n*   [3.4.4. Installing\
    \ a package from Bioconductor](#bioconductor.xhtml)\n\n*   [3.4.5\\. Updating\
    \ an R package](#update.xhtml)\n\n*   [3.4.6\\. Removing an R package](#remove.xhtml)\n\
    \n*   [3.4.7. Notes](#notes.xhtml)\n\n# 3.4.1\\. Requirements\n\n## The r-base\
    \ package installed\n\nThe `r-base` package provides the [GNU](#glossary.xhtml_term-GNU)\
    \ [R](#glossary.xhtml_term-R) statistical computation and graphics system.\n\n\
    If you do not have it installed, follow [The quick and easy method](../quick-and-easy/index.xhtml),\
    \ and search and install the `r-base` package.\n\nAttention\n\n*You should not\
    \ add sudo in the commands below.*\n\nThis method only installs files in your\
    \ home directory and so does not require administrator privileges.\n\n# 3.4.2\\\
    . Starting an R session\n\nTo start an R session, open a terminal window.\n\n\
    Type the `R` command and press the ENTER key.\n\n```\nuser@cookbook:~$ R\n```\n\
    \nYou will be placed inside an R session. Some additional information will be\
    \ displayed, including the version of R installed.\n\nYou can type R commands\
    \ at the `>` prompt.\n\n```\nR version 3.6.3 (2020-02-29) -- \"Holding the Windsock\"\
    \nCopyright (C) 2020 The R Foundation for Statistical Computing\nPlatform: x86_64-pc-linux-gnu\
    \ (64-bit)\n\nR is free software and comes with ABSOLUTELY NO WARRANTY.\nYou are\
    \ welcome to redistribute it under certain conditions.\nType 'license()' or 'licence()'\
    \ for distribution details.\n\n  Natural language support but running in an English\
    \ locale\n\nR is a collaborative project with many contributors.\nType 'contributors()'\
    \ for more information and\n'citation()' on how to cite R or R packages in publications.\n\
    \nType 'demo()' for some demos, 'help()' for on-line help, or\n'help.start()'\
    \ for an HTML browser interface to help.\nType 'q()' to quit R.\n\n>\n```\n\n\
    # 3.4.3\\. Installing a package from CRAN\n\nYou can search for R packages on\
    \ CRAN by consulting the [Task Views](https://cran.r-project.org/web/views/) [https://cran.r-project.org/web/views/]\
    \ for a categorized listing or the [Table of available packages](https://cran.r-project.org/web/packages/available_packages_by_name.html)\
    \ [https://cran.r-project.org/web/packages/available_packages_by_name.html] (currently\
    \ 17157 packages). Once you have identified a package to install, you can follow\
    \ the steps below to install it.\n\nI will install the [BiocManager](#glossary.xhtml_term-BiocManager)\
    \ package as an example below.\n\n## 1. Install package using `install.packages()`\
    \ command\n\n[Start an R session](#start.xhtml_start-r-session).\n\nAt the prompt,\
    \ type the `install.packages()` command with the name of the package in quotes.\
    \ For example:\n\n```\ninstall.packages(\"BiocManager\")\n```\n\nPress the ENTER\
    \ key to proceed.\n\n## 2\\. Confirm use of personal library\n\nYou will notice\
    \ a prompt requesting you to confirm if you would like to use a personal library:\n\
    \n```\nInstalling package into ‘/usr/local/lib/R/site-library’\n(as ‘lib’ is unspecified)\n\
    Warning in install.packages(\"BiocManager\") :\n'lib = \"/usr/local/lib/R/site-library\"\
    ' is not writable\nWould you like to use a personal library instead? (yes/No/cancel)\
    \ yes\n```\n\nType `yes` to confirm and press the ENTER key. [Why use a personal\
    \ library?](#notes.xhtml_why-use-personal-lib).\n\n## 3\\. Create personal library\
    \ if necessary\n\nIf you have never installed a package, the personal library\
    \ directory will not exist. If so, you will be prompted for confirmation to create\
    \ it:\n\n```\nWould you like to create a personal library\n‘~/R/x86_64-pc-linux-gnu-library/3.6’\n\
    to install packages into? (yes/No/cancel) yes\n```\n\nType `yes` to confirm and\
    \ press the ENTER key.\n\nNote\n\nThe next time you install a package, you will\
    \ not see this prompt.\n\n## 4\\. Package installation summary\n\nInstallation\
    \ should now proceed:\n\n```\ntrying URL 'https://cloud.r-project.org/src/contrib/BiocManager_1.30.10.tar.gz'\n\
    Content type 'application/x-gzip' length 40205 bytes (39 KB)\n==================================================\n\
    downloaded 39 KB\n\n* installing *source* package ‘BiocManager’ ...\n** package\
    \ ‘BiocManager’ successfully unpacked and MD5 sums checked\n** using staged installation\n\
    ** R\n** inst\n** byte-compile and prepare package for lazy loading\n** help\n\
    *** installing help indices\n** building package indices\n** installing vignettes\n\
    ** testing if installed package can be loaded from temporary location\n** testing\
    \ if installed package can be loaded from final location\n** testing if installed\
    \ package keeps a record of temporary installation path\n* DONE (BiocManager)\n\
    \nThe downloaded source packages are in\n   ‘/tmp/RtmpDgmOZ8/downloaded_packages’\n\
    >\n```\n\nIf there are no errors during the process, the package installation\
    \ is successful.\n\n# 3.4.4\\. Installing a package from Bioconductor"
