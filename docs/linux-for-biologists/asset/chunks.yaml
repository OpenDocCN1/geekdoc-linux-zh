  trans: "\n\n## 额外的软件仓库\n\n软件的新版本发布到发行版仓库通常需要一段时间时间。\n\n如果您感兴趣的软件不可用，或者您需要更新版本的软件，可以尝试从这些额外源进行安装：\n\
    \n*   来自 PyPI 的 Python 软件包\n*   来自 CPAN 的 Perl 模块\n*   来自 CRAN 或 Bioconductor\
    \ 的 R 软件包\n*   来自 Anaconda Cloud 的 Conda 软件包\n\n### 注意事项\n\n使用这些方法安装的软件也需要手动保持更新。\n\
    \n# 3.2. Python 软件包\n\n如果您感兴趣的软件在 PyPI 上作为 Python 软件包可用，您可以使用 pip —— Python 软件包安装器来安装它。\n\
    \n### 注意\n\n您的软件可能已经通过快速简单的方法 可用。请搜索以 `python-` 开头的包名。\n\n在某些情况下，在虚拟环境中安装软件包可能是更好的选择。请阅读：\n\
    \n`->` 我什么时候应该使用虚拟环境？\n\n*   3.2.1. 依赖\n*   3.2.2. 在 PyPI 上搜索软件包\n*   3.2.3. 安装\
    \ Python 软件包\n*   3.2.4. 更新已安装的软件包\n*   3.2.5. 移除已安装的软件包\n*   3.2.6. 使用已安装的软件包\n\
    *   3.2.7. Python 虚拟环境\n*   3.2.8. 注意事项\n\n# 3.2.1. 依赖\n\n### Python 软件包安装器 (pip)\n\
    \n要安装 pip，请参考快速简单的方法安装软件。\n\n搜索并安装 `python3-pip` 软件包。\n\n### 将 $HOME/.local/bin\
    \ 添加到 $PATH\n\n包含命令的软件包会将它们安装在 `$HOME/.local/bin` 目录（什么是 $HOME?）。\n\n为了能够方便地运行这些命令，您需要将此目录添加到您的\
    \ `$PATH` 变量中。您可以按照将目录添加到 PATH 中的步骤进行操作。\n\n### 注意事项\n\n*   您不应在下面的命令中添加 `sudo`。\n\
    \n此方法仅在您的主目录中安装文件，因此不需要管理员权限。\n\n# 3.2.2. 在 PyPI 上搜索软件包\n\n在网页浏览器中打开 [PyPI 网站](https://pypi.org)\
    \ [https://pypi.org]。\n\n在“Search projects”（搜索项目）字段中，输入您想要安装的软件名称并按回车键或点击搜索按钮（图\
    \ 55）。\n\n![../../_images/pypi-search.png](img/pypi-search.png)\n\n图 55 在 PyPI\
    \ 上搜索软件包\n\n将显示匹配搜索词的软件包列表（图 56）。\n\n![../../_images/pypi-search-result.png](img/pypi-search-result.png)\n\
    \n图 56 biopython 的搜索结果。1.78 是版本号。\n\n点击结果进入项目描述页。\n\n在项目描述页上，在 `pip` 安装命令中找到包名（图\
    \ 57）。\n\n在此例中，它是 `biopython`。\n\n![../../_images/pypi-biopython-page.png](img/pypi-biopython-page.png)\n\
    \n图 57 Biopython 的项目描述页\n\n### 注意\n\n在下述步骤中，您需要使用 `pip3` 而不是 `pip` 命令。为什么？\n\n\
    您现在可以继续安装软件包了。\n\n# 3.2.3. 安装 Python 软件包\n\n打开终端。\n\n使用 `pip3 install` 命令配合您想要安装的包名。\n\
    \n以 biopython 为例：\n\n```\npip3 install biopython\n```\n\n输出：\n\n```\nCollecting\
    \ biopython\n  Downloading biopython-1.78-cp38-cp38-manylinux1_x86_64.whl (2.3\
    \ MB)\n     |********************************| 2.3 MB 2.1 MB/s\nCollecting numpy\n\
    \  Downloading numpy-1.20.1-cp38-cp38-manylinux2010_x86_64.whl (15.4 MB)\n   \
    \  |********************************| 15.4 MB 90 kB/s\nInstalling collected packages:\
    \ numpy, biopython\nSuccessfully installed biopython-1.78 numpy-1.20.1\n```\n\n\
    ### 注意\n\n此方法的一个局限性是，您无法安装软件包的多个版本。可以使用虚拟环境 来解决这个问题。\n\n# 3.2.4. 更新已安装的软件包\n\n\
    当您注意到软件包有更新可用时，可以使用 `install` 命令配合 `--U` 选项以及包名：\n\n```\npip3 install -U biopython\n\
    ```\n\n# 3.2.5. 移除已安装的软件包\n\n使用 `uninstall` 命令配合您想要移除的包名：\n\n```\npip3 uninstall\
    \ biopython\n```\n\n# 3.2.6. 使用已安装的软件包\n\n### 文件安装在何处？\n\n您可以使用 `pip3 show` 命令配合包名来识别其安装的路径：\n\
    \n```\npip3 show biopython\n```\n\n输出：\n\n```\nName: biopython\nVersion: 1.78\n\
    Summary: Freely available tools for computational molecular biology.\nHome-page:\
    \ https://biopython.org/\nAuthor: The Biopython Contributors\nAuthor-email: biopython@biopython.org\n\
    License: UNKNOWN\nLocation: /home/user/.local/lib/python3.8/site-packages\nRequires:\
    \ numpy\nRequired-by:\n```\n\n### 使用软件包和模块\n\n软件包和模块将安装在 `$HOME/.local/lib/python3.8/site-packages`。\n\
    \n注意\n\n如果您有不同的 Python 版本，此值会发生变化。\n\n该目录会被包含在 `PYTHONPATH` 中。因此，无需额外操作即可导入并使用已安装的软件包。\n\
    \n例如，这是一个使用 pip 安装的简单 Python 脚本：\n\n```python\nfrom Bio.Seq import Seq\n\nseq\
    \ = Seq('ATGC')\ncomp = seq.complement()\n\nprint(f'The complement of {seq} is\
    \ {comp}')\n```\n\n将上面的代码示例保存为 `biopy_test.py`。然后从终端运行：\n\n```\npython3 biopy_test.py\n\
    ```\n\n输出：\n\n```\nThe complement of ATGC is TACG\n```\n\n### 使用包含的命令\n\n如果软件包包含命令，这些命令将安装在\
    \ `$HOME/.local/bin` 目录。为了方便使用这些命令，您需要将此目录添加到 PATH 中，正如依赖所示。\n\n例如，当安装 cutadapt\
    \ 的 Python 软件包时，`cutadapt` 命令将安装在 `$HOME/.local/bin`，您可以像这样从终端运行：\n\n```\ncutadapt\
    \ --version\n```\n\n输出：\n\n```\n3.1\n```\n\n# 3.2.7. Python 虚拟环境\n\n虚拟环境是一个包含\
    \ Python 和一些额外软件包的自包含目录树。\n\n### 优势\n\n这些是使用虚拟环境的优势。\n\n### 无需权限\n\n创建虚拟环境或在环境中安装软件包不需要管理员权限。\n\
    \n### 多个环境\n\n可以创建多个虚拟环境，每个环境包含自己的包集。\n\n它们是相互隔离的，在某个环境中安装、更新或删除软件包不会影响其他环境。\n\
    \n### 分享您的环境\n\n您可以与他人共享配置。他们将重现您的环境，包含完全软件包版本。\n\n### 创建虚拟环境\n\n首先，使用快速简单的方法搜索并安装\
    \ `python3-venv` 软件包。它包含了创建虚拟环境所需的 `venv` 模块。\n\n"
- fmt: '

    You can create a virtual environment in any directory where you have write privileges,
    for example, your home directory.


    To demonstrate, I will create a virtual environment called `py3env` in my home
    directory.


    ```

    python3 -m venv py3env

    ```


    If successful, you will find a directory named `py3env` in the current directory.
    No messages will be displayed.


    ### Note


    - `python3` is the command to run the Python 3 interpreter. Its complete path
    is `/usr/bin/python3`.

    - `venv` is the Python module to create virtual environments.

    - The `-m` option runs the `venv` module as a script.


    Before you can use a virtual environment, you will need to activate it.


    ## Activating a virtual environment


    You will need to activate a virtual environment before you can start using it.
    To do so, use the `source` command with the path to the virtual environment’s
    `activate` script.


    For example, to activate `py3env` created in the [previous step](#virtualenv.xhtml_create-virtualenv),
    use:


    ```

    source py3env/bin/activate

    ```


    Your shell prompt will now change to indicate that the virtual environment is
    now active. Note the `(py3env)` label at the beginning of the prompt:


    ```

    (py3env) user@cookbook:~$

    ```


    You can now start using this virtual environment.


    ### Note


    Before you start installing packages…


    It is a good idea to install (or upgrade) Python build tools — [pip](#glossary.xhtml_term-pip),
    [setuptools](#glossary.xhtml_term-setuptools), and [wheel](#glossary.xhtml_term-wheel)
    in a new virtual environment.


    These build tools are necessary for building and installing packages from [PyPI](#glossary.xhtml_term-PyPI)
    and other sources.


    Installing them will ensure that additional packages will build and install without
    errors.


    ## Installing Python build tools


    Use `pip3 install` to install or upgrade the required packages:


    ```

    pip3 install -U pip setuptools wheel

    ```


    The `-U` option of `pip3 install`, will upgrade listed packages, if newer versions
    are available.


    Output:


    ```

    Collecting pip

    Downloading pip-21.0.1-py3-none-any.whl (1.5 MB)

    ...

    Installing collected packages: pip, setuptools, wheel

    ...

    Successfully installed pip-21.0.1 setuptools-54.2.0 wheel-0.36.2

    ```


    ## Deactivating a virtual environment


    To exit a virtual environment, use the command:


    ```

    deactivate

    ```


    Your shell prompt will change to its original appearance:


    ```

    user@cookbook:~$

    ```


    # 3.2.8 Notes


    ## You will need to update these packages manually


    Packages installed in this manner should also be updated manually.


    When you notice there is an update for the package, for example, from the project’s
    website or from their source code repository, follow the steps in [Updating an
    installed package](#update.xhtml_update-python-package) to install the latest
    version.


    ## Why pip3 and not pip?


    The [pip](#glossary.xhtml_term-pip) package includes the following commands:


    - `pip3` — Python 3 version

    - `pip` — Python 2 version (Support for Python 2 ended in January 2020.)


    Since there is a possibility for both commands to exist on a system, it is safer
    to use `pip3` when installing packages using this method.


    ## What about programs written in Python 2?


    Support for Python 2 ended in January 2020. If you need to use a program written
    only in Python 2, you can create an isolated environment — either using `venv`
    or `Conda` and then install the package.


    Related sections:


    - [Python virtual environments](#virtualenv.xhtml_virtualenv)

    - [Conda packages](../conda/index.xhtml)


    ## When should I use a virtual environment?


    The method described here will not work if the programs you installing require
    two different versions of the same package from PyPI. In that case, you can consider
    creating an isolated environment — either using `venv` or `Conda` and then installing
    the packages.


    Related sections:


    - [Python virtual environments](#virtualenv.xhtml_virtualenv)

    - [Conda packages](../conda/index.xhtml)


    ## Older versions of pip


    If the version of `pip` installed in your system is older than 2.0, it will attempt
    to install packages in system paths by default, resulting in permission denied
    errors. To avoid that, you will need to add the `--user` option to the `install`
    and `uninstall` commands, for example:


    ```

    pip3 install --user python

    ```


    A better approach is to upgrade your local version of `pip`. Once upgraded, you
    will no longer need `--user`. To upgrade `pip`, do:


    ```

    pip3 install --user -U pip

    ```


    You can check the installed version of `pip` using:


    ```

    pip3 -V

    ```


    # 3.3 Perl modules


    For Perl modules, you can configure the `local-lib` module to create and use a
    local directory. The default location is `$HOME/perl5`.


    If your software of interest is available on [CPAN](#glossary.xhtml_term-CPAN),
    you can install it easily using the `cpanminus`](glossary.xhtml_term-cpanminus)
    script.


    Your software of interest might be available using the [quick and easy method](../quick-and-easy/index.xhtml).
    Search for package names containing `perl`.


    - [3.3.1 Requirements](#requirements.xhtml)

    - [3.3.2 Configuring local-lib module](#configure.xhtml)

    - [3.3.3 Searching for a module on CPAN](#search.xhtml)

    - [3.3.4 Installing a Perl module](#install.xhtml)

    - [3.3.5 Using installed modules](#using.xhtml)


    ### 3.3.1 Requirements


    #### The build-essential and cpan packages installed


    If you do not have them installed, follow the [quick and easy method](../quick-and-easy/index.xhtml),
    and search and install the following packages:


    1. `build-essential` — installs compilers and build tools like `make`

    2. `cpanminus` — script to obtain, build and install modules from CPAN along with
    their [glossary.xhtml_term-dependencies)


    Attention: You should not add `sudo` in the commands below. This method only installs
    files in your home directory and does not require administrator privileges.


    ### 3.3.2 Configuring local-lib module


    To configure `local-lib`:


    Open the `$HOME/.bashrc` file in a [text editor`](glossary.xhtml_term-text-editor).


    Add the following text at the end of the file:


    ```

    # Configuration for Perl local-lib

    eval "$(perl -Mlocal::lib)"

    ```


    Save the file. Here is a sample `.bashrc`, for reference ([Fig. 58](#configure.xhtml_fig-322a)).


    ![../../_images/bashrc-local-lib.png](_images/bashrc-local-lib.png)

    Fig. 58 local-lib configuration in .bashrc


    Open a new terminal window. You will notice the following message displayed ([Fig.
    59](#configure.xhtml_fig-322b)):


    ![../../_images/local-lib-perl5.png](_images/local-lib-perl5.png)

    Fig. 59 Attempting to create directory /home/user/perl5


    Configuration is now complete. You can now start installing modules from CPAN
    and other sources.


    ### 3.3.3 Searching for a module on CPAN


    Open [MetaCPAN](#glossary.xhtml_term-MetaCPAN) website ([https://metacpan.org](https://metacpan.org))
    in a web browser.


    In the Search field, enter the name of the module you would like to install and
    click on the Search the CPAN button. I will use David H. Ardell’s [FAST](#glossary.xhtml_term-FAST)
    package as an example. ([Fig. 60](#search.xhtml_fig-322c)).


    ![../../_images/metacpan-fast.png](_images/metacpan-fast.png)

    Fig. 60 Searching for a module on MetaCPAN


    This should display modules matching the search term — `FAST` ([Fig. 61](#search.xhtml_fig-322d)).


    ![../../_images/metacpan-fast-results.png](_images/metacpan-fast-results.png)

    Fig. 61 Search results for modules


    If you click on the appropriate module name, you will be taken to a description
    page, where you can learn more about the module ([Fig. 62](#search.xhtml_fig-322e)).


    ![../../_images/metacpan-fast-page.png](_images/metacpan-fast-page.png)

    Fig. 62 Module description page


    On this page, you can also verify the module name to use in the next step.

    '
