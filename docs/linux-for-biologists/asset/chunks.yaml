    Enter a name for the page in the New Page dialog window ([Fig. 119](#notes.xhtml_fig-624h))
    and click on the OK button.


    ![../../_images/zim-new-page-name.png](_images/zim-new-page-name.png)


    Fig. 119 Enter a name for the new page


    The new page will appear in the Index view ([Fig. 120](#notes.xhtml_fig-624i)).


    ![../../_images/zim-new-page-added.png](_images/zim-new-page-added.png)


    Fig. 120 Newly added page


    ### Adding subpages


    A subpage will be placed under an `existing` page.


    To add a new subpage:


    1. Select an existing page in Index view

    2. Select `File` ‣ `New Sub Page` from the menu bar

    3. Enter a name for the page and click on the OK button


    ### Deleting or renaming pages


    To delete or rename pages, you can `right-click` on the page and select the desired
    function.


    # 6.2.5. Exporting notes and notebooks


    To export the notebook or a page, select:


    `File` ‣ `Export`


    In the dialog window that appears, select the desired option and click on the
    Forward button ([Fig. 121](#export.xhtml_fig-625a)).


    ![../../_images/zim-export-notebook.png](_images/zim-export-notebook.png)


    Fig. 121 Export notebook


    In the next screen, you can select the format of the exported notebook or page
    in the `Format` drop-down box ([Fig. 122](#export.xhtml_fig-625b)).


    ![../../_images/zim-export-formats.png](_images/zim-export-formats.png)


    Fig. 122 Select an export format


    You can leave it at the default — HTML. Click on the Forward button to proceed.


    In the final screen, select a directory to save the exported notebook or page.


    **Note**


    If you are using the defaults, it is a good idea to create a new output directory
    and select it under `Output folder`.


    Click on the OK button complete export.


    ![../../_images/zim-export-select-folder.png](_images/zim-export-select-folder.png)


    Fig. 123 Select an output folder


    When complete, open the output directory in file manager.


    `Double-click` on `Home.html` to open it in the browser ([Fig. 124](#export.xhtml_fig-625d)).


    ![../../_images/zim-exported-notebook.png](_images/zim-exported-notebook.png)


    Fig. 124 Viewing exported notebook


    # 6.2.6. Activating more features using plugins


    These are some plugins included with Zim:


    **Insert Symbol**

    — insert special symbols and characters


    **Table of Contents**

    — adds a widget displaying the current page’s table of contents


    **Tags**

    — add tags to your notes


    **Tray Icon**

    — adds an icon to system tray for quick access to your notebooks


    **Spell Checker**

    — adds support for checking spelling


    —


    You will need to activate (or enable) them in preferences, before you can start
    using them.


    ### Enabling a plugin


    To enable a plugin:


    1. Select `Edit` ‣ `Preferences`

    2. Click on the `Plugins` tab

    3. Check the box corresponding to the plugin you wish to enable ([Fig. 125](#plugins.xhtml_fig-626a))

    4. Click on the OK button


    ![../../_images/zim-plugins.png](_images/zim-plugins.png)


    Fig. 125 Enabling plugins


    **Note**


    *Some plugins have additional options.*


    Click on the `Configure` button below the plugin description to access these options.


    # 6.2.7. Getting help


    Zim includes a detailed user manual. You can access this by selecting ([Fig. 126](#help.xhtml_fig-627a)):


    `Help` ‣ `Contents`


    ![../../_images/zim-help.png](_images/zim-help.png)


    Fig. 126 Help on using Zim


    # 7. Glossary


    **Anaconda**

    A free and open-source (Anaconda Individual Edition) Python and R distribution.
    It includes [`Conda](#glossary.xhtml_term-Conda) and more than 250 open-source
    scientific packages. Additional packages can be installed from [`Anaconda Cloud](#glossary.xhtml_term-Anaconda-Cloud)
    repositories.

    Website: [https://www.anaconda.com/products/individual](https://www.anaconda.com/products/individual)


    **Anaconda Cloud**

    Repository for Python and R packages and notebooks.

    Website: [https://anaconda.org](https://anaconda.org)


    **apt**

    A command-line program that handles the installation and removal of software on
    Debian, Ubuntu and other Linux distributions.

    Related section:

    `->` [The command-line version (apt)](#notes.xhtml_apt-install-software)


    **bioconda**

    A channel for [`Conda](#glossary.xhtml_term-Conda) package manager with over 7000
    packages of bioinformatics software.

    Website: [https://bioconda.github.io/](https://bioconda.github.io/)


    **build-essential**

    A package that installs software build tools like `make` and compilers like `gcc`,
    which are required for building modules written in languages like C.


    **Bash**

    [`GNU](#glossary.xhtml_term-GNU) project’s shell program. The name stands for
    The Bourne-Again Shell. It is the most commonly used shell in Linux distributions.

    Website: [https://www.gnu.org/software/bash/](https://www.gnu.org/software/bash/)


    **Bioconductor**

    Tools written in the R programming language for the analysis and comprehension
    of high-throughput genomic data.

    Website: [https://www.bioconductor.org/](https://www.bioconductor.org/)


    **BiocManager**

    An R package to install and update packages from the [`Bioconductor](#glossary.xhtml_term-Bioconductor)
    project repository.

    Website: [https://cran.r-project.org/package=BiocManager](https://cran.r-project.org/package=BiocManager)


    **BioPython**

    Python tools for computational molecular biology.

    Website: [http://biopython.org/](http://biopython.org/)


    **Bio::Phylo**

    Perl package for phylogenetic analysis.

    Website: [https://metacpan.org/pod/Bio::Phylo](https://metacpan.org/pod/Bio::Phylo)


    **commands**

    Also called as binaries or executables.


    **Conda**

    Conda is a package and environment manager.

    As a `package manager`, it can be used to install software from [`Anaconda Cloud](#glossary.xhtml_term-Anaconda-Cloud).
    Software [`dependencies](#glossary.xhtml_term-dependencies) will be installed
    automatically.

    As an `environment manager`, it can be used to create and manage environments
    containing different sets of packages. You can activate and use these environments
    as necessary.


    **cpanminus**

    A Perl script to get, build and install modules from [`CPAN](#glossary.xhtml_term-CPAN).
    It provides the `cpanm` command.

    Website: [https://metacpan.org/pod/App::cpanminus](https://metacpan.org/pod/App::cpanminus)


    **cutadapt**

    A Python program that finds and removes adapter sequences, primers, poly-A tails
    and other unwanted sequences from high-throughput sequencing reads.

    Website: [https://cutadapt.readthedocs.io](https://cutadapt.readthedocs.io)


    **CPAN**

    Abbreviation for Comprehensive Perl Archive Network. It provides additional Perl
    modules for installation (196,752 as of 2020).

    Website: [https://www.cpan.org/](https://www.cpan.org/)


    **CRAN**

    Abbreviation for Comprehensive R Archive Network. A network of FTP and web servers
    providing up-to-date versions of R, packages and documentation.

    Website: [https://cran.r-project.org/](https://cran.r-project.org/)


    **Debian**

    A Linux distribution made of free and open source software. It is free for anyone
    to download, use, modify and distribute.

    Website: [https://www.debian.org/](https://www.debian.org/)


    **Debian package**

    An archive of executable files, libraries, and documentation of software. It can
    be installed on Debian Linux and Debian-based systems like Ubuntu and Linux Mint.
    These files have the `.deb` extension.


    **dependencies**

    Additional programs or libraries that are needed for a program to work.


    **edgeR**

    An R package for empirical analysis of digital gene expression data. It is available
    from the [`Bioconductor](#glossary.xhtml_term-Bioconductor) project repository.

    Website: [https://www.bioconductor.org/packages/edgeR/](https://www.bioconductor.org/packages/edgeR/)


    **FAST**

    Abbreviation for FAST Analysis of Sequences Toolbox. A set of utilities written
    in Perl that extend the UNIX paradigm to bioinformatic sequence records.

    Website: [https://metacpan.org/pod/FAST](https://metacpan.org/pod/FAST)


    **Files**

    The default file manager in [Linux Mint](#glossary.xhtml_term-Linux-Mint) Cinnamon
    edition. Its original name is Nemo.


    **gdebi**

