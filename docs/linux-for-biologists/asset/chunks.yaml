    ```\n\nOutput:\n\n```\nrm: remove regular file 'words'? y\nremoved 'words'\n```\n\
    \n## Removing directories\n\n### Removing empty directories\n\nIf the directory\
    \ is empty, you can remove it using the `-d` option:\n\n```\nrm -d empty-dir\n\
    ```\n\nAlternatively, you can use the [rmdir](#rmdir.xhtml) command:\n\n```\n\
    rmdir empty-dir\n```\n\n### Removing directories with content\n\nIf the directory\
    \ has some content i.e., files or subdirectories, you will need to add the `-r`\
    \ (recursive) option.\n\nFor example, using the `bash` directory copied [above](#mv.xhtml_sample-files):\n\
    \n```\nrm -ivr bash\n```\n\nThis command will ask for your confirmation for deleting\
    \ every file in the directory and then delete it:\n\n```\nrm: descend into directory\
    \ 'bash'? y\nrm: remove regular file 'bash/RBASH'? y\nremoved 'bash/RBASH'\n...\n\
    rm: remove regular file 'bash/README.gz'? y\nremoved 'bash/README.gz'\nrm: remove\
    \ directory 'bash'? y\nremoved directory 'bash'\n```\n\nInstead of `-i`, you could\
    \ use the `-I` option, which will only prompt once, when removing directories\
    \ recursively:\n\n```\nrm -Ivr bash\n```\n\nOutput:\n\n```\nrm: remove 1 argument\
    \ recursively? y\nremoved 'bash/RBASH'\n...\nremoved 'bash/README.gz'\nremoved\
    \ directory 'bash'\n```\n\nIf you are *completely sure* you do not need the directory\
    \ and its contents, you can *force* its removal using the `-f` option:\n\n```\n\
    rm -vrf bash\n```\n\n`rm` will delete the directory without confirmation.\n\n\
    ## Notes\n\n### Adding an alias for `rm`\n\nRather than typing `rm``-iv`, every\
    \ time you need to use the command, you can add an [alias](#important-files.xhtml_bash-aliases)\
    \ for the command in your `~/.bash_aliases` file.\n\nFor example:\n\n```\nalias\
    \ rm='rm -iv'\n```\n\nNow, when you type `rm`, you will actually be running `rm``-iv`.\n\
    \n# 4.2.15\\. `echo` — display text or values of variables\n\nWith the `echo`\
    \ command, you can print text or the values of *environment variables* on the\
    \ screen.\n\nThe basic format of the command is:\n\n```\necho text_or_variable\n\
    ```\n\n## Printing text\n\nTo print text on the screen, use `echo` followed by\
    \ the text you would like to display.\n\n```\necho \"Hello, This is echo!\"\n\
    ```\n\nOutput:\n\n```\nHello, This is echo!\n```\n\n## Printing values of environment\
    \ variables\n\nYou can also use `echo` to display values of your environment variables.\n\
    \nFor example:\n\n```\necho $PATH\n```\n\nThe `$` in `PATH` indicates, it is a\
    \ variable.\n\nOutput:\n\n```\n/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin\n\
    ```\n\n`PATH` contains the list of paths (directories) that will be searched for\
    \ locating programs or commands.\n\nYou can set or modify environment variables\
    \ in your `~/.bashrc`.\n\n# 4.3\\. Other useful commands\n\nThese are some additional\
    \ commands that you might find useful.\n\n*   [4.3.1\\. `df` — report disk usage](#df.xhtml)\n\
    \n*   [4.3.2\\. `du` — estimate disk usage of files or directories](#du.xhtml)\n\
    \n*   [4.3.3\\. `find` — search for files](#find.xhtml)\n\n*   [4.3.4\\. `free`\
    \ — view free and used memory](#free.xhtml)\n\n*   [4.3.5\\. `locate` — find files\
    \ using their names](#locate.xhtml)\n\n*   [4.3.6\\. `which` — locate a command](#which.xhtml)\n\
    \n# 4.3.1\\. `df` — report disk usage\n\nThe `df` command will report used and\
    \ available disk space on all storage devices connected to the system.\n\nFor\
    \ example, to find the amount of disk space used in `/` — the root filesystem,\
    \ you can use the command:\n\n```\ndf -h /\n```\n\nOutput:"
