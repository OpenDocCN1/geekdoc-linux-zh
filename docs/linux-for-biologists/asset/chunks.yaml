    # 4.2.12. `tail` — print last few lines of a file


    With the `tail` command, you can view the last few (default: 10) lines of a file.


    For example:


    ```

    tail /usr/share/dict/words

    ```


    ```

    élan''s

    émigré

    émigré''s

    émigrés

    épée

    épée''s

    épées

    étude

    étude''s

    études

    ```


    The `tail` and the `head` command discussed [earlier](#head.xhtml), are useful
    when you want to quickly view the contents of a large text file.


    In both cases, you can control the number of lines displayed, using the `-n` option,
    instead of the default value (10).


    For example:


    ```

    tail -n 5 /usr/share/dict/words

    ```


    will display the last 5 lines of the file.


    # 4.2.13. `mv` — move a file or directory


    With the `mv` command, you can move a file or directory from one location (source)
    to another (destination). You can choose to keep the existing file or directory
    name or rename them.


    The basic format of the command is:


    ```

    mv source destination

    ```


    A safer approach is to add the `-iv` options to the command:


    ```

    mv -iv source destination

    ```


    With `-i` (interactive), `mv` will require your confirmation before overwriting
    a file or directory, if it exists already in destination.


    `-v` (verbose) will print the command’s actions on the screen.


    For convenience, you can [add an alias](#mv.xhtml_alias-mv).


    ## Sample files


    To follow the examples below, you will need to copy the following files into your
    home directory using the [cp](#cp.xhtml) command:


    ```

    cp -v /usr/share/dict/words ~

    cp -rv /usr/share/doc/bash ~

    ```


    `~` is a shortcut for home directory.


    ## Moving a file or directory


    The simplest use case is to move a file or directory from one location (directory)
    to another.


    ### Moving a File


    For example, to move the `words` file copied [above](#mv.xhtml_sample-files) into
    your `Documents` directory, use:


    ```

    mv -iv words Documents/

    ```


    Output:


    ```

    renamed ''words'' -> ''Documents/words''

    ```


    ### Moving a directory


    Similarly, to move the `bash` directory copied [above](#mv.xhtml_sample-files)
    into your `Documents` directory, use:


    ```

    mv -iv bash Documents/

    ```


    Output:


    ```

    renamed ''bash'' -> ''Documents/bash''

    ```


    In both cases, the file or directory name will not be changed.


    ## Renaming a file or directory


    In this case, you would like to rename a file or directory.


    ### Renaming a file


    To rename the `words` file copied [above](#mv.xhtml_sample-files) to `dictionary.txt`,
    use:


    ```

    mv -iv words dictionary.txt

    ```


    Alternatively, to move it into your `Documents` directory and rename it at the
    same time, use:


    ```

    mv -iv words Documents/dictionary.txt

    ```


    ### Renaming a directory


    To rename the `bash` directory copied [above](#mv.xhtml_sample-files) into `bash-commands`,
    use:


    ```

    mv -iv bash bash-commands

    ```


    ## Notes


    ### What happens if a file exists?


    You will notice a prompt requesting you for confirmation to overwrite the file.


    Type `y` and press the ENTER key to proceed:


    ```

    mv: overwrite ''Documents/words''? y

    renamed ''words'' -> ''Documents/words''

    ```


    To cancel, simply press ENTER key at the prompt.


    ### What happens if a directory exists?


    `mv` will overwrite a directory only if it is empty. You can either:


    * [copy](#cp.xhtml) files into destination directory or


    * rename the destination directory


    ### Adding an alias for `mv`


    Rather than typing `mv-iv`, every time you need to use the command, you can add
    an [alias](#important-files.xhtml_bash-aliases) for the command in your `~/.bash_aliases`
    file.


    For example:


    ```

    alias mv=''mv -iv''

    ```


    Now, when you type `mv`, you will actually use `mv -iv`.


    # 4.2.14. `rm` — remove files or directories


    With the `rm` command, you can delete files or directories.


    The basic format of the command is:


    ```

    rm source

    ```


    A safer approach is to add the `-iv` options to the command:


    ```

    rm -iv source

    ```


    With `-i` (interactive), `rm` will require your confirmation before deleting a
    file or directory, if it exists already.


    `-v` (verbose) will print the command’s actions on the screen.


    For convenience, you can [add an alias](#important-files.xhtml_bash-aliases).


    ## Sample files


    To follow the examples below, you will need to copy the following files into your
    home directory using the [cp](#cp.xhtml) command:


    ```

    cp -v /usr/share/dict/words ~

    cp -rv /usr/share/doc/bash ~

    ```


    `~` is a shortcut for home directory.


    ## Removing files


    The simplest use case is to delete a file.


    ### Removing a file


    For example, to delete the `words` file copied [above](#mv.xhtml_sample-files),
    use:


    ```

    rm -iv words

    ```


    Output:


    ```

    removed ''words''

    ```


    ### Removing a directory


    Similarly, to delete the `bash` directory copied [above](#mv.xhtml_sample-files),
    use:


    ```

    rm -iv bash

    ```


    Output:


    ```

    removed ''bash''

    ```


    ## Removing a directory


    In this case, you would like to delete a directory.


    ### Removing an empty directory


    To delete an empty directory, use:


    ```

    rm -iv directory

    ```


    ### Removing a directory with content


    To delete a directory containing files, use the `-r` option:


    ```

    rm -ivr directory

    ```


    ## Notes


    ### What happens if a file exists?


    You will notice a prompt requesting you for confirmation to delete the file.


    Type `y` and press the ENTER key to proceed:


    ```

    rm: remove regular file ''filename''? y

    removed

    ```


    To cancel, simply press ENTER key at the prompt.


    ### What happens if a directory exists?


    `rm` will only delete a directory if it is empty. To delete a recursive recursively,
    use the `-r` option.


    ### Adding an alias for `rm`


    Rather than typing `rm-iv`, every time you need to use the command, you can add
    an [alias](#important-files.xhtml_bash-aliases) for the command in your `~/.bash_aliases`
    file.


    For example:


    ```

    alias rm=''rm -iv''

    ```


    Now, when you type `rm`, you will actually use `rm -iv`.


    # 4.2.15. `echo` — display text or values


    With the `echo` command, you can print text or the values of variables.


    The basic format of the command is:


    ```

    echo text_or_variable

    ```


    ## Printing text


    To print text on the screen, use `echo` followed by the text you would like to.


    ```

    echo "Hello, This is echo!"

    ```


    Output:


    ```

    Hello, This is echo!

    ```


    ## Printing values of variables


    You can also use `echo` to display values of your environment variables.


    For example:


    ```

    echo $PATH

    ```


    The `$` in `PATH` indicates, it is a variable.


    Output:


    ```

    /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin

    ```


    `PATH` contains the list of paths (directories) that will be searched for locating
    programs or commands. You can set or modify environment variables in your `~/.bashrc`.


    # 4.3. Other useful commands


    These are some additional commands you might find useful.


    * [4.3.1. `df` — report disk usage](#df.xhtml)

    * [4.3.2. `du` — estimate disk usage of files or directories](#du.xhtml)

    * [4.3.3. `find` — search for files](#find.xhtml)

    * [4.3.4. `free` — view free and used memory](#free.xhtml)

    * [4.3.5. `locate` — find files using their names](#locate.xhtml)

    * [4.3.6. `which` — locate a command](#which.xhtml)


    # 4.3.1. `df` — report disk usage


    The `df` command will report used and available disk space on all storage devices
    connected to the system.


    For example, to find the amount of disk space used in `/` — the root filesystem,
    you can use the command:


    ```

    df -h /

    ```


