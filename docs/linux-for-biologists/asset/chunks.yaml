    \ — 一个用于比较三维结构的程序，[MEGA](https://docs.conda.io/projects/conda/en/latest/user-guide/cheatsheet.html)\
    \ — 演化分析。\n\n## 3.6.1. 下载包\n\n为了演示安装 Debian 包的步骤，[RStudio](https://docs.conda.io/projects/conda/en/latest/user-guide/cheatsheet.html)\
