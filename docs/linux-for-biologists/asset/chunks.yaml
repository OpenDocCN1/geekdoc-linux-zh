- fmt: "\nTo do that, click on `Install Instructions` under `TOOLS` menu in the sidebar.\
    \ This will open a pop-up window with information on the module name you need\
    \ to use with the `cpanm` command.\n\nIn this case, the module name to use, is\
    \ simply called `FAST` ([Fig. 63](#search.xhtml_fig-322f)).\n\n![../../_images/cpanm-module-install.png](_images/cpanm-module-install.png)\n\
    \nFig. 63 Module install instructions for FAST\n\nYou can now proceed towards\
    \ installing this module.\n\n# 3.3.4. Installing a Perl module\n\nOpen a terminal\
    \ window.\n\nInstall the module with the `cpanm` command:\n\n```\ncpanm FAST\n\
    ```\n\nThis will install the module and its dependencies, if there are any.\n\n\
    Output:\n\n```\n--> Working on FAST\nFetching http://www.cpan.org/authors/id/D/DH/DHARD/FAST-1.06.tar.gz\
    \ ... OK\nConfiguring FAST-1.06 ... OK\n==> Found dependencies: Bit::Vector, Sort::MergeSort,\
    \ Sort::Key\n--> Working on Bit::Vector\nFetching http://www.cpan.org/authors/id/S/ST/STBEY/Bit-Vector-7.4.tar.gz\
    \ ... OK\nConfiguring Bit-Vector-7.4 ... OK\n...\nBuilding and testing FAST-1.06\
    \ ... OK\nSuccessfully installed FAST-1.06\n6 distributions installed\n```\n\n\
    # 3.3.5. Using installed modules\n\n## Using included commands\n\nIf the module\
    \ includes commands, those will be installed in `$HOME/perl5/bin`. This directory\
    \ will be included in `$PATH`, when you [configured](#configure.xhtml_configure-local-lib)\
    \ local-lib. Hence, you can start using the commands included in a module immediately\
    \ after installation.\n\nFor example, here is the help page of the `fasuniq` command\
    \ included with the `FAST` package installed in the previous step:\n\n```\nfasuniq\
    \ -h\nUsage:\n    fasuniq [options] [MULTIFASTA-FILE]\n\n    [MULTIFASTA-DATA-ON-STDIN]\
    \ | fasuniq [options]\n...\n```\n\n## Using modules in your scripts\n\nModules\
    \ will be installed in:\n\n`$HOME/perl5/lib/perl5/5.30.0`.\n\nNote\n\nThis is\
    \ the module path for Perl 5.30.0.\n\nIf you have a different version of Perl\
    \ installed on your system, it will change.\n\nAs local-lib makes these modules\
    \ discoverable automatically, you can start using them in your scripts immediately.\n\
    \nHere is an example using the [Bio::Phylo](#glossary.xhtml_term-Bio-Phylo) package.\
    \ After installing the module with `cpanm Bio::Phylo`, create a file using a text\
    \ editor and copy the following content:\n\n```\nuse Bio::Phylo;\n\n# print version\n\
    print Bio::Phylo->VERSION;\n\n# print citation\nprint Bio::Phylo->CITATION;\n\
    ```\n\nSave the file as `biophylo_test.pl` and then run it:\n\n```\nperl biophylo_test.pl\n\
    ```\n\nOutput:\n\n```\nv2.0.1Rutger A Vos, Jason Caravas, Klaas Hartmann, Mark\
    \ A Jensen and Chase Miller, 2011.\nBio::Phylo - phyloinformatic analysis using\
    \ Perl. BMC Bioinformatics 12:63.\ndoi:10.1186/1471-2105-12-63\n```\n\n# 3.4.\
    \ R packages\n\nIf your software of interest is available as an R package on [CRAN](#glossary.xhtml_term-CRAN)\
    \ or [Bioconductor](#glossary.xhtml_term-Bioconductor), you can install it using\
    \ the `install.packages()` or `BiocManager::install()` commands respectively.\n\
    \nNote\n\nYour software might already be available using [The quick and easy method](../quick-and-easy/index.xhtml).\n\
    \nSearch for package names starting with `r-cran-` or `r-bioc-`.\n\n* [3.4.1.\
    \ Requirements](#requirements.xhtml)\n* [3.4.2. Starting an R session](#start.xhtml)\n\
    * [3.4.3. Installing a package from CRAN](#cran.xhtml)\n* [3.4.4. Installing a\
    \ package from Bioconductor](#bioconductor.xhtml)\n* [3.4.5. Updating an R package](#update.xhtml)\n\
    * [3.4.6. Removing an R package](#remove.xhtml)\n* [3.4.7. Notes](#notes.xhtml)\n\
    \n# 3.4.1. Requirements\n\n## The r-base package installed\n\nThe `r-base` package\
    \ provides the [GNU](#glossary.xhtml_term-GNU) [R](#glossary.xhtml_term-R) statistical\
    \ computation and graphics system.\n\nIf you do not have it installed, follow\
    \ [The quick and easy method](../quick-and-easy/index.xhtml), and search and install\
    \ the `r-base` package.\n\nAttention\n\nYou should not add `sudo` in the commands\
    \ below.\n\nThis method only installs files in your home directory and so does\
    \ not require administrator privileges.\n\n# 3.4.2. Starting an R session\n\n\
    To start an R session, open a terminal window.\n\nType the `R` command and press\
    \ the ENTER key.\n\n```\nuser@cookbook:~$ R\n```\n\nYou will be placed inside\
    \ an R session.\n\n```\nR version 3.6.3 (2020-02-29) -- \"The R Foundation for\
    \ Statistical Computing\"\nCopyright (c) 2020, The R Foundation\nR is a free software\
    \ for statistical computing\nThis is free software: may redistribute it under\
    \ the terms of the GNU General Public License, at least as version 3 of the program,\
    \ or later\n```\n\n## 2. Confirm use of personal library\n\n```\nlib = '/usr/local/lib/site-library\"\
    ' is not writable\nWould you like to use a personal library instead? (yes/No/cancel)\
    \ yes\n```\n\nType `yes` to confirm and press the ENTER key.\n\n## 3. Create personal\
    \ library if necessary\n\nIf you have never installed a package, the personal\
    \ library directory will not exist. If so, you will be prompted for confirmation\
    \ to create it:\n\n```\nWould you like to create a personal library\n~/R/x86_4-pc-linux-gnu/library/3.6\n\
    to install packages into? (yes/No/cancel) yes\n```\n\nType `yes` to confirm and\
    \ press the ENTER key.\n\nNote\n\nThe next time you install a package, you will\
    \ not see this prompt.\n\n## 4. Package installation summary\n\n```\ntrying URL\
    \ 'https://cloud.r-project.org/src/contrib/BiocManager_1.30.10.tar.gz'\nContent\
    \ type 'application/x-gzip' length 40205 bytes (39 KB)\n==================================\n\
    downloaded 39 KB\n\n* installing *source* package ‘BiocManager’ ...\n** package\
    \ ‘BiocManager’ successfully unpacked and MD5 sums checked\n** using staged installation\n\
    ** R\n** inst\n** byte-compile and prepare package for lazy loading\n** help\n\
    *** installing help indices\n** building package indices\n** installing vignettes\n\
    ** testing if installed package can be loaded from temporary location\n** testing\
    \ if installed package can be loaded from final location\n** testing if installed\
    \ package keeps a record of temporary installation path\n* DONE (BiocManager)\n\
    ```\n"
