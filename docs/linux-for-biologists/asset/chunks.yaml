  raw: "# 2.5.4\\. File and directory names are case-sensitive\n\nOne thing you will\
    \ need to remember is that file and directory names in Linux are case-sensitive.\n\
    \nFor example, a file named:\n\n```\nsequence.txt\n```\n\nis different from:\n\
    \n```\nSequence.txt\n```\n\nSimilarly, `Documents` and `documents` are two different\
    \ directories.\n\nBoth these files or directories mentioned above, can exist in\
    \ the same directory and can have different contents.\n\n# 2.5.5\\. Accessing\
    \ the root filesystem\n\nTo access the root filesystem (`/`), click on File System\
    \ in the sidebar of file manager ([Fig. 36](#root-filesystem.xhtml_fig-254a)).\n\
    \n![../../_images/file-system.png](_images/file-system.png)\n\nFig. 36 Click on\
    \ File System entry to access the root filesystem\n\n## Directories under `/`\
    \ and their functions\n\n`/etc`\n\n­— stores configuration files of applications\n\
    \n`/home`\n\n­— contains home directories of users\n\n`/media`\n\n­— locations\
    \ where devices like external disks will be mounted i.e., made available\n\n`/root`\n\
    \n­— home directory of `root` user (administrator)\n\n`/tmp`\n\n­— temporary files\
    \ created by applications\n\n`/usr`\n\n­— applications and libraries are installed\
    \ here along with their data and documentation\n\n`/var`\n\n­— storage for log\
    \ files, application cache, databases etc.,\n\n## Root file system and root home\
    \ directory are different\n\n### `/` is the root filesystem\n\nAll users on the\
    \ system can access files and directories here, provided they have the appropriate\
    \ permissions.\n\n### `/root` is home directory of root\n\nOnly root will have\
    \ access to it.\n\n# 2.5.6\\. Transferring files between systems\n\nOne useful\
    \ feature of Files is the ability to connect to remote systems using protocols\
    \ like SSH, FTP, SMB and Webdav. Once connected, you can transfer files from your\
    \ Linux desktop to the remote system or *vice-versa*.\n\nTo connect to a remote\
    \ system, use the following menu entry in Files ([Fig. 37](#transfer-files.xhtml_fig-255a)):\n\
    \nFile ‣ Connect to Server\n\n![../../_images/files-connect.png](_images/files-connect.png)\n\
    \nFig. 37 Connect to Server option in Files\n\n## Connecting to an SSH server\n\
    \nOpen File ‣ Connect to Server and follow the steps below ([Fig. 38](#transfer-files.xhtml_fig-255b)):\n\
    \n1.  In the field corresponding to Server, enter the domain name or IP address\
    \ of the server you are connecting to\n\n2.  Port 22 is the default for SSH, so\
    \ you do not need to change that usually\n\n3.  From the Type drop-down box, select\
    \ SSH\n\n4.  Under Folder, you can specify a directory (optional) to open, once\
    \ connection is successful\n\n5.  Enter the username and password of your account\
    \ *on the server*\n\n6.  Click on the Connect button\n\n![../../_images/files-connect-ssh.png](_images/files-connect-ssh.png)\n\
    \nFig. 38 Connecting to an SSH server\n\nOnce the remote directory is open in\
    \ Files, you can start transferring files from your desktop or *vice-versa*.\n\
    \n# 3\\. Getting software on Linux\n\nIn this section, I will discuss how you\
    \ can get software on your Linux desktop.\n\nFor any software you would like to\
    \ install, you can start with the [quick and easy](quick-and-easy/index.xhtml)\
    \ method. It will install software available in Linux distribution repositories.\n\
    \nIf your software of interest is not available or if you need a different version,\
    \ you can consider using the other methods.\n\n*   [3.1. The quick and easy method](quick-and-easy/index.xhtml)\n\
    \n    *   [3.1.1\\. Requirements](quick-and-easy/requirements.xhtml)\n\n    *\
    \   [3.1.2\\. Finding and installing software](quick-and-easy/installing-software.xhtml)\n\
    \n    *   [3.1.3\\. Removing installed software](quick-and-easy/removing-software.xhtml)\n\
    \n    *   [3.1.4\\. Updating installed software](quick-and-easy/updating-software.xhtml)\n\
    \n    *   [3.1.5\\. Notes](quick-and-easy/notes.xhtml)\n\n*   [3.2\\. Python packages](python/index.xhtml)\n\
    \n    *   [3.2.1\\. Requirements](python/requirements.xhtml)\n\n    *   [3.2.2.\
    \ Searching for a package on PyPI](python/search.xhtml)\n\n    *   [3.2.3. Installing\
    \ a Python package](python/install.xhtml)\n\n    *   [3.2.4. Updating an installed\
    \ package](python/update.xhtml)\n\n    *   [3.2.5. Removing an installed package](python/remove.xhtml)\n\
    \n    *   [3.2.6\\. Using installed packages](python/using.xhtml)\n\n    *   [3.2.7.\
    \ Python virtual environments](python/virtualenv.xhtml)\n\n    *   [3.2.8. Notes](python/notes.xhtml)\n\
    \n*   [3.3\\. Perl modules](perl/index.xhtml)\n\n    *   [3.3.1. Requirements](perl/requirements.xhtml)\n\
    \n    *   [3.3.2. Configuring local-lib module](perl/configure.xhtml)\n\n    *\
    \   [3.3.3. Searching for a module on CPAN](perl/search.xhtml)\n\n    *   [3.3.4.\
    \ Installing a Perl module](perl/install.xhtml)\n\n    *   [3.3.5\\. Using installed\
    \ modules](perl/using.xhtml)\n\n*   [3.4\\. R packages](r/index.xhtml)\n\n   \
    \ *   [3.4.1. Requirements](r/requirements.xhtml)\n\n    *   [3.4.2\\. Starting\
    \ an R session](r/start.xhtml)\n\n    *   [3.4.3\\. Installing a package from\
    \ CRAN](r/cran.xhtml)\n\n    *   [3.4.4. Installing a package from Bioconductor](r/bioconductor.xhtml)\n\
    \n    *   [3.4.5\\. Updating an R package](r/update.xhtml)\n\n    *   [3.4.6\\\
    . Removing an R package](r/remove.xhtml)\n\n    *   [3.4.7. Notes](r/notes.xhtml)\n\
    \n*   [3.5\\. Conda packages](conda/index.xhtml)\n\n    *   [3.5.1. Requirements](conda/requirements.xhtml)\n\
    \n    *   [3.5.2. Installing Conda](conda/install.xhtml)\n\n    *   [3.5.3\\.\
    \ Using Conda](conda/using.xhtml)\n\n    *   [3.5.4. Notes](conda/notes.xhtml)\n\
    \n*   [3.6. Debian packages](debian-package/index.xhtml)\n\n    *   [3.6.1\\.\
    \ Requirements](debian-package/requirements.xhtml)\n\n    *   [3.6.2\\. Installing\
    \ a Debian package](debian-package/install.xhtml)\n\n    *   [3.6.3\\. Upgrading\
    \ installed software](debian-package/update.xhtml)\n\n    *   [3.6.4\\. Removing\
    \ installed software](debian-package/remove.xhtml)\n\n    *   [3.6.5\\. Notes](debian-package/notes.xhtml)\n\
    \n# 3.1\\. The quick and easy method\n\nThe *quick and easy* method is to use\
    \ [Software Manager](#glossary.xhtml_term-Software-Manager), to search and install\
    \ software on your desktop. It supports installing software from Linux Mint, Debian\
    \ and Flathub repositories.\n\nExamples of software that can be installed using\
    \ this method:\n\n[Circos](https://circos.ca) [https://circos.ca]\n\n— plotter\
    \ for visualizing data.\n\n[Clustal Omega](https://www.clustal.org/omega) [https://www.clustal.org/omega]\n\
    \n— general purpose multiple sequence alignment program for nucleotide and protein\
    \ sequences.\n\n[EMBOSS](https://emboss.sourceforge.net) [https://emboss.sourceforge.net]\n\
    \n— European molecular biology open software suite.\n\n[NCBI BLAST+](https://blast.ncbi.nlm.nih.gov/Blast.cgi)\
    \ [https://blast.ncbi.nlm.nih.gov/Blast.cgi]\n\n— next generation suite of BLAST\
    \ sequence search tools.\n\n[Bioconductor](https://www.bioconductor.org) [https://www.bioconductor.org]\n\
    \n— tools for the analysis and comprehension of high-throughput genomic data.\n\
    \n[CD-HIT](http://weizhongli-lab.org/cd-hit/) [http://weizhongli-lab.org/cd-hit/]\n\
    \n— suite of programs designed to quickly group sequences.\n\n[UGENE](http://ugene.net/)\
    \ [http://ugene.net/]\n\n— integrated bioinformatics toolkit.\n\n—\n\n*   [3.1.1.\
    \ Requirements](#requirements.xhtml)\n\n*   [3.1.2\\. Finding and installing software](#installing-software.xhtml)\n\
    \n*   [3.1.3. Removing installed software](#removing-software.xhtml)\n\n*   [3.1.4.\
    \ Updating installed software](#updating-software.xhtml)\n\n*   [3.1.5. Notes](#notes.xhtml)\n\
    \n# 3.1.1\\. Requirements\n\nAttention\n\n*This procedure installs software in\
    \ system paths and so requires administrator privileges.*\n\n# 3.1.2\\. Finding\
    \ and installing software\n\nTo demonstrate the steps involved, I will install\
    \ [PyMOL](#glossary.xhtml_term-PyMOL) — a software for molecular visualization.\
    \ You can follow the same procedure for finding and installing other software\
    \ available in the repositories.\n\nOpen Software Manager by clicking on its icon\
    \ in the applications’ menu ([Fig. 39](#installing-software.xhtml_fig-312a)).\n\
    \nYou can also launch it from the Administration section of the applications’\
    \ menu.\n\n![../../_images/1-open-software-manager.png](_images/1-open-software-manager.png)"
