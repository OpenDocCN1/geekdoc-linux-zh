    \ `release_21.01` in this case.\n\nOutput:\n\n```\nCloning into 'galaxy'...\n\
    remote: Enumerating objects: 364, done.\nremote: Counting objects: 100% (364/364),\
    \ done.\nremote: Compressing objects: 100% (232/232), done.\nremote: Total 497693\
    \ (delta 184), reused 237 (delta 131), pack-reused 497329\nReceiving objects:\
    \ 100% (497693/497693), 520.44 MiB | 3.89 MiB/s, done.\nResolving deltas: 100%\
    \ (391502/391502), done.\nUpdating files: 100% (5826/5826), done.\n```\n\nThis\
    \ will take some time depending on your network connection. Once complete, you\
    \ will find a directory named `galaxy` in the current directory.\n\nNext, you\
    \ will need to create a Python virtual environment.\n\n# 5.2.3\\. Creating a Python\
    \ virtual environment\n\nIn this step, you will use Python 3 `venv` module to\
    \ create an isolated virtual environment for Galaxy.\n\nNote\n\nFor a detailed\
    \ guide on creating and using virtual environments, read:\n\n`->` [Python virtual\
    \ environments](#virtualenv.xhtml_virtualenv)\n\nTo create the virtual environment:\n\
    \n1.  Change into the `galaxy` directory:\n\n    ```\n    cd galaxy\n    ```\n\
    \n2.  Create virtual environment using `.venv` as the name.\n\n    ```\n    python3\
    \ -m venv .venv\n    ```\n\n    Attention\n\n    The dot (`.`) in `.venv`, is\
    \ important.\n\n3.  Activate the virtual environment:\n\n    ```\n    source .venv/bin/activate\n\
    \    ```\n\n    Your shell prompt will now change to include `(.venv)`:\n\n  \
    \  ```\n    (.venv) user@cookbook:~/programs/galaxy$\n    ```\n\n4.  Install or\
    \ upgrade Python build tools:\n\n    ```\n    pip3 install -U pip setuptools wheel\n\
    \    ```\n\n    This step is necessary, so additional packages will build and\
    \ install without any issues.\n\n5.  Finally, exit the virtual environment:\n\n\
    \    ```\n    deactivate\n    ```\n\nIn the [next step](#start.xhtml_start-galaxy),\
    \ the start-up script will detect this environment and use it to install all [dependencies](#glossary.xhtml_term-dependencies)\
    \ necessary for running Galaxy.\n\n# 5.2.4\\. Starting Galaxy\n\nWhile still in\
    \ the `galaxy` directory, run the start-up shell script using the command:\n\n\
    ```\nsh run.sh\n```\n\nNote\n\nWhen run for the first time, this script will take\
    \ some time to complete.\n\nSubsequent runs will be faster.\n\nOutput:\n\n```\n\
    Activating virtualenv at .venv\nRequirement already satisfied: pip>=8.1 in ./.venv/lib/python3.8/site-packages\
    \ (20.0.2)\n...\n```\n\nWhen you see messages like the following in the terminal\
    \ session, Galaxy is ready to use:\n\n```\nStarting server in PID 11466.\nserving\
    \ on http://localhost:8080\n```\n\n*Leave the terminal window open.*\n\nOpen a\
    \ web browser window and type [http://localhost:8080](http://localhost:8080) in\
    \ the address bar.\n\nYou will see the home page of your local Galaxy instance\
    \ ([Fig. 85](#start.xhtml_fig-714a)).\n\n![../../_images/galaxy-home.png](_images/galaxy-home.png)\n\
    \nFig. 85 Home page of your local Galaxy instance\n\nYou can start exploring the\
    \ tools available or even upload data and start using them. However, it is a good\
    \ idea to [register a user account](../register/index.xhtml) now, so you do not\
    \ lose data, when you clear browser history.\n\n# 5.2.5\\. Stopping Galaxy\n\n\
    To stop Galaxy, open the terminal window where you ran the `sh``run.sh` command\
    \ ([Fig. 86](#stop.xhtml_fig-714b)).\n\n![../../_images/galaxy-terminal.png](_images/galaxy-terminal.png)\n\
    \nFig. 86 Terminal window running Galaxy\n\nUse the `Ctrl``+``c` keyboard shortcut\
    \ to stop Galaxy i.e., press and hold `Ctrl` key and then press the `c` key.\n\
    \nWhen Galaxy has stopped running, you will see a message Finished shutting down\
    \ ([Fig. 87](#stop.xhtml_fig-714c)) in the terminal.\n\n![../../_images/galaxy-shutdown.png](_images/galaxy-shutdown.png)\n\
    \nFig. 87 Galaxy has finished shutting down\n\nYou can now close the terminal\
    \ window.\n\n# 5.3\\. Registering a user account\n\nOn the Galaxy home page, click\
    \ on the Login or Register link in the navigation bar ([Fig. 88](#index.xhtml_fig-72a)).\n\
    \n![../../_images/user-login-register.png](_images/user-login-register.png)\n\n\
    Fig. 88 Click on the Login or Register link\n\nYou will be taken to the login\
    \ page.\n\nClick on the Register here link at the bottom of the page ([Fig. 89](#index.xhtml_fig-72b))."
