    \n*   [3.6.1. Requirements](#requirements.xhtml)\n\n*   [3.6.2. Installing a Debian\
    \ package](#install.xhtml)\n\n*   [3.6.3\\. Upgrading installed software](#update.xhtml)\n\
    \n*   [3.6.4\\. Removing installed software](#remove.xhtml)\n\n*   [3.6.5. Notes](#notes.xhtml)\n\
    \n# 3.6.1\\. Requirements\n\nAttention\n\n*This procedure installs software in\
    \ system paths and so requires administrator privileges.*\n\n# 3.6.2\\. Installing\
    \ a Debian package\n\nTo demonstrate the steps involved in installing a Debian\
    \ package, I will download and install [RStudio Desktop](#glossary.xhtml_term-RStudio-Desktop)\
    \ — an IDE for R, distributed as a Debian package.\n\n## 1\\. Downloading Debian\
    \ package\n\nOpen the RStudio project’s [download](https://rstudio.com/products/rstudio/download/)\
    \ [https://rstudio.com/products/rstudio/download/] page in a web browser.\n\n\
    Under Choose Your Version, click on the download button below RStudio Desktop\
    \ (Open Source License) ([Fig. 66](#install.xhtml_fig-331a)).\n\n![../../_images/1-rstudio-download-button.png](_images/1-rstudio-download-button.png)\n\
    \nFig. 66 Download RStudio Desktop (Open Source License)\n\nThis will take you\
    \ to the installers section with information on the current version ([Fig. 67](#install.xhtml_fig-331b)).\n\
    \n![../../_images/2-rstudio-requirements.png](_images/2-rstudio-requirements.png)\n\
    \nFig. 67 RStudio Desktop installers\n\nNote\n\nAlthough the instructions in [Fig.\
    \ 67](#install.xhtml_fig-331b) state that you will need to install R before installing\
    \ RStudio, you can safely *skip that step*.\n\nThe Gdebi program used here, will\
    \ automatically install R, while installing RStudio.\n\nScroll down to the All\
    \ Installers section.\n\nClick on the download link corresponding to Ubuntu 18/Debian\
    \ 10 ([Fig. 68](#install.xhtml_fig-331c)).\n\n![../../_images/3-rstudio-installers.png](_images/3-rstudio-installers.png)\n\
    \nFig. 68 RStudio installers for different operating systems\n\nIn the dialog\
    \ window that appears, select Save File and then click on the OK button ([Fig.\
    \ 69](#install.xhtml_fig-331d)).\n\n![../../_images/4-rstudio-save-file.png](_images/4-rstudio-save-file.png)\n\
    \nFig. 69 Save installer file\n\nOnce the file download is complete, you can find\
    \ it in your Downloads directory.\n\n## 2\\. Installing downloaded package\n\n\
    Open file manager and navigate to your Downloads directory.\n\n*Double-click*\
    \ on the downloaded file ([Fig. 70](#install.xhtml_fig-331e)).\n\n![../../_images/5-rstudio-package-file.png](_images/5-rstudio-package-file.png)\n\
    \nFig. 70 Downloaded Debian package\n\nThis will open the Gdebi application. Click\
    \ on the Install Package button ([Fig. 71](#install.xhtml_fig-331f)).\n\n![../../_images/6-rstudio-install-package.png](_images/6-rstudio-install-package.png)\n\
    \nFig. 71 Gdebi: Click on the Install Package button\n\nYou will be prompted to\
    \ enter *your password*. Type in your password and click on the Authenticate button\
    \ to proceed ([Fig. 72](#install.xhtml_fig-331g)).\n\n![../../_images/7-rstudio-install-authenticate.png](_images/7-rstudio-install-authenticate.png)\n\
    \nFig. 72 Enter your password when prompted\n\nAs this package has additional\
    \ dependencies, another dialog will appear listing these packages, which need\
    \ to be installed in order for it to work.\n\nClick on the Continue button to\
    \ proceed ([Fig. 73](#install.xhtml_fig-331h)).\n\n![../../_images/8-rstudio-install-dependencies.png](_images/8-rstudio-install-dependencies.png)\n\
    \nFig. 73 Additional dependencies to be installed"
