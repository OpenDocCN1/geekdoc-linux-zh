  trans: "\n\n![../_images/vimal.jpg](img/vimal.jpg)\n\n我在印度马杜赖卡马拉杰大学（Madurai Kamaraj\
    \ University）攻读生物技术硕士学位期间接触了 Linux 和开源软件。\n\n能够不受限制地使用和修改软件的想法对我来说既新颖又兴奋。我学会了安装\
    \ Linux、从源码编译软件，甚至创建了自己的 Linux 刻启动 CD！\n\n这段经历在学术界变得非常有价值，我在那里超过 9 年的时间里，主要从事研究支持工作。在此期间，我安装并管理了\
    \ Linux 服务器、数据库、Web 应用和网站，参与了科学软件的开发，在仓库中发布了软件，并教授了 Python 编程和生物信息学的入门级课程。\n\n\
    本书是我在与学生、同事以及我们服务的用户交流过程中积累的经验总结。感谢你阅读本书。希望你会发现它很有用。\n\n**Vimalkumar Velayudhan**\
    \ 网站：[`vimalkvn.com`](https://vimalkvn.com) 邮箱：vimal@disroot.org\n\n# 2. Linux\
    \ 入门\n\n在本节中，你将学习如何：\n\n1. 在你的电脑上运行 Linux\n2. 使用桌面和内置软件\n3. 使用文件和目录进行工作\n4. 开始使用命令行并学习一些基础命令\n\
    \n*   2.1. Linux — 概述\n    * 2.1.1. Linux 发行版\n    * 2.1.2. 桌面环境\n    * 2.1.3.\
    \ 运行 Linux 桌面的方法\n*   2.2. 运行 Linux 虚拟机\n    * 2.2.1. 要求\n    * 2.2.2. 导入虚拟机镜像\n\
    \    * 2.2.3. 启动虚拟机\n    * 2.2.4. 停止虚拟机\n*   2.3. 桌面\n    * 2.3.1. Cinnamon 桌面\n\
    \    * 2.3.2. 修改系统设置\n*   2.4. 可用软件\n    * 2.4.1. 文件 — 管理文件和目录\n    * 2.4.2. Firefox\
    \ — 浏览网页\n    * 2.4.3. 文本编辑器 — 创建和编辑文本文件\n    * 2.4.4. LibreOffice — 编辑文档和电子表格\n\
    \    * 2.4.5. 终端 — 访问命令行\n    * 2.4.6. 截图 — 捕捉桌面或窗口截图\n    * 2.4.7. 管理器 — 从仓库安装软件\n\
    \    * 2.4.8. GNU 图像处理程序 — 编辑图像\n    * 2.4.9. Inkscape — 创建矢量图形\n    * 2.4.10.\
    \ 记本文\n*   2.5. 文件和目录\n    * 2.5.1. 你的家目录\n    * 2.5.2. 隐藏文件和目录\n    * 2.5.3.\
    \ 家目录中的重要文件\n    * 2.5.4. 文件和目录名大小敏感\n    * 2.5.5. 访问根文件系统\n    * 2.5.6. 在系统间传输文件\n\
    \n# 2.1. Linux — 概述\n\nLinux 是 Linus Torvalds 在 1991 年开发的操作系统。它以开源许可发布，源代码供所有人免费获取。\n\
    \n*   2.1.1. Linux 发行版\n*   2.1.2. 桌面环境\n*   2.1.3. 运行 Linux 桌面的方法\n\n# 2.1.1.\
    \ Linux 发行版\n\n一个 Linux 发行版包含了 Linux 操作系统以及额外的软件。\n\n示例：[Debian](https://www.debian.org/)\
    \ [https://www.debian.org/], [Ubuntu](https://ubuntu.com/) [https://ubuntu.com/],\
    \ [Linux Mint](https://linuxmint.com/) [https://linuxmint.com/], [Fedora](https://getfedora.org/)\
    \ [https://getfedora.org/], [openSUSE](https://www.opensuse.org/) [https://www.opensuse.org/]\
    \ 等，\n\n# 2.1.2. 桌面环境\n\n桌面环境是一种图形用户界面 (#glossary.xhtml_term-GUI)，提供了对文件和应用程序的便捷访问。\n\
    \n示例：\n\n*   GNOME (图 2)\n*   KDE Plasma (图 3)\n*   Xfce (图 4)\n*   MATE (图 5)\n\
    *   Cinnamon (图 6)\n\nLinux 发行版可能会根据所使用的桌面环境提供额外的变体下载。\n\n![../../_images/gnome-shell.png](img/gnome-shell.png)\n\
    \n图 2 GNOME\n\n![../../_images/kde-plasma.png](img/kde-plasma.png)\n\n图 3 KDE\
    \ Plasma\n\n![../../_images/xfce.png](img/xfce.png)\n\n图 4 Xfce\n\n![../../_images/ubuntu-mate.png](img/ubuntu-mate.png)\n\
    \n图 5 MATE\n\n## 本书使用 Linux Mint (Cinnamon)\n\n本书将使用 Linux Mint 20.1 以及 Cinnamon\
    \ 桌面环境作为参考发行版 (图 6)。\n\n![../../_images/linux-mint-cinnamon.png](img/linux-mint-cinnamon.png)\n\
    \n图 6 Cinnamon 桌面环境\n\n所有包含的内容均在此发行版上测试过。\n\n# 2.1.3. 运行 Linux 桌面的方法\n\n要在你的电脑上运行\
    \ Linux 桌面，你可以：\n\n1. 安装 Linux 发行版 (#distribution.xhtml_linux-distribution) 或\n\
    2. 运行虚拟机\n\n本书将采用第二种方法，这对新用户更容易。\n\n注意\n\n还有其他可能性，但上述方法是最常见的。\n\n# 2.2. 运行 Linux\
    \ 虚拟机\n\n要在你的电脑（主机）上运行其他系统的虚拟机（客户），你首先需要安装虚拟机程序 — 即运行虚拟机的软件。\n\n虚拟机程序示例包括 VirtualBox、Parallels、VMware\
    \ Workstation 等，本书将使用 VirtualBox (图 7)。\n\n![../../_images/virtualbox.png](img/virtualbox.png)\n\
    \n图 7 VirtualBox 主窗口\n\n*   2.2.1. 要求\n*   2.2.2. 导入虚拟机镜像\n*   2.2.3. 启动虚拟机\n\
    *   2.2.4. 停止虚拟机\n\n# 2.2.1. 要求\n\n## 在你的电脑上已安装 VirtualBox\n\n你可以根据你的操作系统按照以下说明安装\
    \ VirtualBox。\n\n注意\n\n*安装软件需要管理员权限。*\n\n### macOS 和 Windows 说明\n\n你可以从 VirtualBox\
    \ 网站的 [下载](https://www.virtualbox.org/wiki/Downloads) [https://www.virtualbox.org/wiki/Downloads]\
    \ 部分下载 macOS 或 Windows 的安装程序 (图 8)。\n\n![../../_images/virtualbox-downloads.png](img/virtualbox-downloads.png)\n\
    \n图 8 VirtualBox 下载页面\n\n### Linux 发行版说明\n\n大多数 Linux 发行版的软件包仓库都包含了 VirtualBox。建议你使用你的包管理器如\
    \ Synaptic 或 apt、dnf 等进行安装。\n\n例如，要在 Ubuntu 20.04 LTS 上让 VirtualBox 工作，你需要安装 `virtualbox`\
    \ 和 `virtualbox-guest-additions-iso` 软件包。\n\n注意\n\n"
- fmt: '

    If you cannot install from repositories, you can download an installer from the
    [Linux Downloads](https://www.virtualbox.org/wiki/Linux_Downloads) [https://www.virtualbox.org/wiki/Linux_Downloads]
    section of the project website.


    ## Virtual machine image of Linux Mint


    You can download a ready-to-use virtual machine image of Linux Mint 20.1 from
    the website of this book:


    [https://vimalkvn.com/linuxforbiologists](https://vimalkvn.com/linuxforbiologists)


    It is distributed as an [OVA](#glossary.xhtml_term-OVA) format file.


    Click on the download link and save the `linuxmint-20.1.ova` file to your computer.


    ## 2.2.2. Importing the virtual machine image


    Open VirtualBox on your computer and then follow the steps below to import the
    downloaded virtual machine image.


    ### Step 1 — Select OVA file


    From the main window of VirtualBox, select:


    File ‣ Import Appliance ([Fig. 9](#import.xhtml_fig-222a))


    ```

    ![../../_images/virtualbox-import-appliance.png](_images/virtualbox-import-appliance.png)

    ```


    Fig. 9 Select File –> Import Appliance from the menu


    In the Appliance to import screen, click on the button that appears next to the
    File entry field ([Fig. 10](#import.xhtml_fig-222b)).


    ```

    ![../../_images/virtualbox-select-ova.png](_images/virtualbox-select-ova.png)

    ```


    Fig. 10 Click on the button that appears next to the File entry field


    Browse to the location of the `linuxmint-20.1.ova` file, select it, and then click
    on the `Open` button.


    The File entry field will now have the complete path to the selected file ([Fig.
    11](#import.xhtml_fig-222c)).


    ```

    ![../../_images/virtualbox-import-proceed.png](_images/virtualbox-import-proceed.png)

    ```


    Fig. 11 Click on the Next button to proceed


    Click on the `Next` button to proceed.


    ### Step 2 — Adjust appliance settings (optional)


    In the next screen — Appliance settings ([Fig. 12](#import.xhtml_fig-222d)), you
    can modify the configuration of this virtual machine.


    Note

    *This step is optional*.


    You can click on the `Import` button at the bottom to proceed to the [next step](#import.xhtml.vm-import-progress).


    For example, you can add more CPU or RAM for this virtual machine, depending on
    the configuration of your computer.


    ```

    ![../../_images/virtualbox-appliance-settings.png](_images/virtualbox-appliance-settings.png)

    ```


    Fig. 12 Appliance settings screen


    Click on the `Import` button to proceed.


    ### Step 3 — Import progress and completion


    You will notice a progress bar at this stage ([Fig. 13](#import.xhtml_fig-222e)).


    ```

    ![../../_images/virtualbox-import-progress.png](_images/virtualbox-import-progress.png)

    ```


    Fig. 13 Virtual machine import progress


    When import is complete, you will be taken back to the main window of VirtualBox.


    The imported virtual machine — LinuxMint 20.1, will appear in the panel on the
    left ([Fig. 14](#import.xhtml_fig-222f)).


    ```

    ![../../_images/virtualbox-imported-vm.png](_images/virtualbox-imported-vm.png)

    ```


    Fig. 14 Imported virtual machine


    ## 2.2.3. Starting the virtual machine


    To start the virtual machine, select LinuxMint 20.1 and then click on the `Start`
    button in the main toolbar ([Fig. 15](#start.xhtml_fig-223a)).


    ```

    ![../../_images/virtualbox-start-vm.png](_images/virtualbox-start-vm.png)

    ```


    Fig. 15 Start virtual machine


    Once the boot process is complete, you will be logged in directly to the desktop
    ([Fig. 16](#start.xhtml_fig-223b)).


    ```

    ![../../_images/virtualbox-mint-welcome.png](_images/virtualbox-mint-welcome.png)

    ```


    Fig. 16 The Linux Mint desktop


    For reference, the default username is `user` and password is also `user`.


    ## 2.2.4. Stopping the virtual machine


    When your work is complete, you can shut down the virtual machine by clicking
    on `Quit` in the Applications Menu. This will display a confirmation dialog ([Fig.
    17](#import.xhtml_fig-224)).


    ```

    ![../../_images/shutdown.png](_images/shutdown.png)

    ```


    Fig. 17 Confirmation dialog


    Click on the `Shutdown` button to stop the virtual machine.


    ## 2.3.1. The desktop


    Once you have started Linux Mint, you will be logged in directly to the desktop.
    For reference, the default username is `user` and password is also `user`.


    The Cinnamon desktop includes the following:


    - **Applications Menu**: search and launch applications.

    - **Panel**: pinned applications.

    - **System Tray**: contains applets for network, sound, power, etc.

    - **Calendar**: provides date and time.


    ```

    ![../../_images/cinnamon-components.png](_images/cinnamon-components.png)

    ```


    Fig. 18 Components of the desktop


    ### 2.3.2. Changing settings


    The Settings application can be used to configure accessibility, user accounts,
    date and time, keyboard layout, language, network, and more ([Fig. 19](#settings.xhtml_fig-23a)).


    ```

    ![../../_images/settings.png](_images/settings.png)

    ```


    Fig. 19 Settings application


    #### Changing keyboard layout


    The default keyboard layout is US. You can change this under Hardware ‣ Layouts.


    ```

    ![../../_images/keyboard-layout.png](_images/keyboard-layout.png)

    ```


    Fig. 20 Keyboard layouts


    #### Changing date and time


    The system date and time can be updated by selecting Preferences ‣ Date and Time.


    ```

    ![../../_images/date-time.png](_images/date-time.png)

    ```


    Fig. 21 Date and time settings


    ## 2. Available software


    This is a brief overview of applications included in Linux Mint 20.1. You can
    launch them from the Applications Menu ([Fig. 22](#index.xhtml_fig-24a)). You
    can search the list of installed applications using the search bar.


    ```

    ![../../_images/applications-menu.png](_images/applications-menu.png)

    ```


    Fig. 22 Launching an application


    Note

    Some applications are not included in the default installation. This includes
    GNU Image Manipulation and Inkscape. You can install them using Software Manager.


    - Files: manage files and directories.

    - Firefox: browse the web.

    - Text Editor: create and edit text files.

    - LibreOffice: edit documents and spreadsheets.

    - Terminal: access the command-line.

    - Screenshot: take screenshots of desktop or windows.

    - Software Manager: install software from repositories.

    - GNU Image Manipulation: edit images.

    - Inkscape: create vector graphics.

    - Notes.


    ## 2.4.1. Files — manage files and directories


    Files is the default file manager ([Fig. 23](#files.xhtml_fig-241a)) in Linux
    Mint.


    ```

    ![../../_images/files.png](_images/files.png)

    ```


    Fig. 23 Main window of Files


    ### Using Files


    You can launch Files from the Applications Menu or by clicking on its icon in
    the Panel.


    These are some tips on using Files.


    #### Toggle icon and list views


    You can quickly switch between Icon and List View using icons in the toolbar.


    #### Toggle sidebar


    You can open the sidebar view or hide it using icons in the status bar.


    #### Open an extra pane


    You can open an extra pane using:


    View ‣ Extra Pane


    This is especially useful when you are copying files between local directories
    or when connected to remote systems.

