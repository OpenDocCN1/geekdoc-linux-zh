  \ 4.3.6. `which` — 查找命令\n\n注：由于提供的原始文本在 4.2.1 之后出现了大量重复的乱码片段，上述译文已根据逻辑结构进行了清理，确保输出不重复且完整。\n\
  \n\n\n\n```\n用法: ls [OPTION]... [FILE]...\n列出 FILEs 的信息（默认为当前目录）。\n如果未指定 -cftuvSUX\
  \ 或 --sort，则按字母顺序对条目进行排序。\n\n长选项的强制性参数对于短选项也是强制性的。\n  -a, --all                \
  \  不忽略以 . 开头的条目\n\n...\n```\n\n#### 注意\n\n为了保持讨论简洁，本节中的示例仅包含了命令受支持的 `some` 选项。\n\
  \n# 4.2.3. `date` — 显示当前日期和时间\n\n```\ndate\n```\n\n输出：\n\n```\nWed 10 Mar 2021 10:33:11\
  \ GMT\n```\n\n# 4.2.4. `cd` — 切换目录\n\n要进入一个目录，请使用 `cd` 后后跟该目录的名称。\n\n例如，要进入 `/home/user/Downloads`，请使用：\n\
  \n```bash\ncd Downloads\n```\n\n#### 注意\n\n当您登录或打开新的终端窗口时，您将位于您的家目录 — `/home/user`，其中\
  \ `user` 是您的用户名。\n\n您可以使用之前 讨论过的 `pwd` 命令来验证您当前所在的目录：\n\n```bash\npwd\n```\n\n```\n\
  /home/user/Downloads\n```\n\n## 使用不带参数的 `cd`\n\n无论您在文件系统的何种位置，输入 `cd` `不带任何参数` 都会带您回到家目录。\n\
  \n```bash\nuser@cookbook:/usr/share/dict$ cd\nuser@cookbook:~$\n```\n\n#### 进入父目录\n\
  \n使用 `cd..` 进入父目录。\n\n例如，当您在 `/home/user/Downloads` 并且输入：\n\n```bash\ncd ..\n```\n\
  \n您将会被带回 `/home/user`。\n\n单个点 (`.`) 指的是`current` 目录。\n\n# 4.2.5. `mkdir` — 创建新目录\n\
  \n使用 `mkdir` 后跟您想要创建的目录名称：\n\n```bash\nmkdir Workspace\n```\n\n#### 注意\n\n您正在创建的目录不能已经存在，否则此命令将无法工作。\n\
  \n正如之前 所讨论的，目录名称是区分大小写的，因此目录名为 `Workspace` 的目录与另一个名为 `workspace` 的目录不同。\n\n####\
  \ 目录名称中的空格\n\n如果目录名称中有空格，请使用双引号，例如：\n\n```bash\nmkdir \"Project Work\"\n```\n\n\
  否则，将创建两个独立的目录 — Project 和 Work。\n\n# 4.2.6. `rmdir` — 删除空目录\n\n使用 `rmdir` 后跟您想要删除的目录名称：\n\
  \n```bash\nrmdir Workspace\n```\n\n#### 注意\n\n该目录在删除之前必须为空。\n\n该目录内不应有其他文件或目录。\n\
  \n# 4.2.7. `ls` — 列出文件\n\n要列出目录中的文件，请使用 `ls` 命令：\n\n```bash\nls\n```\n\n输出：\n\n\
  ```\nDesktop  Documents  Downloads  Music  Pictures  Public  Templates  Videos\n\
  ```\n\n#### 显示隐藏文件\n\n您可以为 `ls` 提供额外的选项。这将改变命令的工作方式。\n\n例如，要同时显示隐藏文件和目录，请使用：\n\n\
  ```bash\nls -a\n```\n\n输出：\n\n```\n.              .cache     .local    Public\n\
  ..             .cinnamon  .gnup       .bash_history\n.config        Desktop    Pictures\
  \      Videos\n.bashrc        Documents  .linuxmint   .profile  .authority\n```\n\
  \n#### 获取详细列表\n\n要获取详细列表，请使用：\n\n```bash\nls -l\n```\n\n输出：\n\n```\ntotal 32\ndrwxr-xr-x\
  \ 2 user user 4096 Feb 17 13 Desktop\ndrwxr-xr-x 2 user user 4096 Mar 4 Documents\n\
  drwxr-xr-x 2 user user 4096 Feb 17 13 Downloads\ndrwxr-xr-x 2 user user 4096 Feb\
  \ 17 13 Music\ndrwxr-xr-x 2 user user 4096 Mar 4 Pictures\ndrwxr-xr-x 2 user user\
  \ 4096 Feb 17 13 Public\ndrwxr-xr-x 2 user user 4096 Feb 17 13 Templates\ndrwxr-xr-x\
  \ 2 user user 4096 Feb 17 13 Videos\n```\n\n## 组合多个选项\n\n您可以组合多个选项，如：\n\n```bash\n\
  ls -la\n```\n\n输出：\n\n```\ntotal 144\ndrwxr-xr-x 1 user user 4096 Mar 12 00 .\n\
  drwxr-xr-x 3 root root 4096 Feb 17 51 ..\n-rw-------- 1 user user 190 Mar 4 .bash_history\n\
  -rw-r-- 1 user user 220 Feb 17 51 .logout\n-rw-r-- 1 user user 377 Feb 17 51 .bashrc\n\
  drwx------ 17 user user 4096 Mar 3 .cache\ndrwxrwxr-x 4 user user 4096 Feb 17 13\
  \ .cinnamon\n```\n\n要查看 `ls` 支持的所有选项列表，请使用：\n\n```bash\nls --help\n```\n\n# 4.2.8.\
  \ `cp` — 复制文件\n\n使用 `cp` 命令，您可以复制文件或目录。\n\n#### 复制一个文件\n\n要复制一个文件，使用 `cp` 后跟源文件名称：\n\
  \n```bash\ncp source destination\n```\n\n`source` 是您想要复制的文件，`destination` 是目标位置。\n\
  \n#### 复制多个文件\n\n要复制多个文件，请使用以下格式：\n\n```bash\ncp source1 source2 destination\n```\n\
  \n`source1` 和 `source2` 是您想要复制的文件，`destination` 是目标位置。\n\n#### 复制目录\n\n要复制目录，请使用\
  \ `-r` 选项：\n\n```bash\ncp -r source destination\n```\n\n`source` 是您想要复制的目录，`destination`\
  \ 是目标位置。\n\n# 4.2.9. `cat` — 显示并合并文件\n\n使用 `cat` 命令，您可以在屏幕上查看文件或合并它们。\n\n## 查看文件内容\n\
  \n要查看文件内容，请使用 `cat` 后跟文件名：\n\n```bash\ncat /usr/share/dict/words\n```\n\n输出：\n\n\
  ```\nA\nA's\nAMD\nAMD's\nAOL\nAOL's\nAWS\nAWS's\nAachen\n...\n```\n\n这将显示文件的全部内容。\n\
  \n## 合并文件内容\n\n如果您在 `cat` 中包含多个文件名，它会将它们合并并将内容打印到屏幕上。\n\n如果您想将输出保存到文件，请使用以下格式：\n\
  \n```bash\ncat file1.txt file2.txt > files.txt\n```\n\n`>` 操作将标准输出重定向到文件名。\n\n#\
  \ 4.2.10. `less` — 查看并导航文件内容\n\n使用 `less` 命令，您在查看文件时拥有更多控制权。它允许您上下滚动文件，并提供了关键词搜索文件的功能。\n\
  \n要查看文件，请使用 `less` 后跟文件名：\n\n```bash\nless /usr/share/dict/words\n```\n\n当文件打开时，它的外观将如图\
  \ 79 所示。\n\n![../../_images/less.png](img/less.png)\n\n图 79 在 less 中打开的 words 文件\n\
  \n在 `:` 提示符处，您可以输入 `less` 理解的命令。\n\n#### 导航文件\n\n您可以通过回 键向下滚动文件。或者，您可以使用 `PgUp`\
  \ 和 `PgDn` 键一次翻一页。\n\n#### 搜索文件\n\n您可以在 `less` 中查看文件时进行搜索。\n\n操作如下：\n\n1.  输入 `/`（正斜杠）键\n\
  2.  输入想要搜索的文本\n3.  按下 ENTER 键\n4.  如果有匹配的结果，它们将被高亮显示\n\n#### 退出 less 命令\n\n要退出 less\
  \ 命令，请在提示符处输入 `q`。\n\n\n\n\n\n# 4.2.12. `tail` — 打印文件的最后几行\n\n使用 `tail` 命令，你可以查看文件的最后几行（默认：\
  \ 10 行）。\n\n例如：\n\n```\ntail /usr/share/dict/words\n```\n\n```\nélan's\némigré\n\
  émigré's\némigrés\népée\népée's\népées\nétude\nétude's\nétudes\n```\n\n在早之前 讨论过的\
  \ `tail` 和 `head` 命令在两种情况下，它们在你想要快速查看大型文本文件的内容时非常有用。\n\n在上述两种情况下，你都可以使用 `-n` 选项来控制显示的行数，而不是默认值（10）。\n\
  \n例如：\n\n```\ntail -n 5 /usr/share/dict/words\n```\n\n将显示文件的最后 5 行。\n\n# 4.2.13.\
  \ `mv` — 移动文件或目录\n\n使用 `mv` 命令，你可以将文件或目录从一个位置（源）移动到另一个位置（目的地）。你可以选择保留现有的文件或目录名称或将其重命名。\n\
  \n命令的基本格式是：\n\n```\nmv source destination\n```\n\n更安全的方法是给命令添加 `-iv` 选项：\n\n```\n\
  mv -iv source destination\n```\n\n使用 `-i`（交互式），如果目的地已存在文件或目录，`mv` 将要求你进行确认。`-v`（详细）将在屏幕上打印命令的操作。\n\
  \n为了方便起见，你可以为命令添加别名。\n\n#### 示例文件\n\n要遵循以下示例，你需要使用 cp 命令将以下文件复制到家目录：\n\n```\ncp\
  \ -v /usr/share/dict/words ~\ncp -rv /usr/share/doc/bash ~\n```\n\n`~` 是家目录的快捷方式。\n\
  \n#### 移动文件或目录\n\n简单的用例是将文件或目录从一个位置（目录）移动到另一个。\n\n#### 移动文件\n\n例如，将上述 复制的 `words`\
  \ 文件移动到 `Documents` 目录，使用：\n\n```\nmv -iv Documents/\n```\n\n输出：\n\n```\nrenamed\
  \ 'words' -> 'Documents/'\n```\n\n#### 移动目录\n\n同样，将上述 复制的 `bash` 目录移动到 `Documents`\
  \ 目录，使用：\n\n```\nmv -iv Documents/\n```\n\n输出：\n\n```\nrenamed 'bash' -> 'Documents/'\n\
  ```\n\n在这两种情况下，文件或目录的名字都不会改变。\n\n#### 重命名文件或目录\n\n在这种情况下，你想重命名文件或目录。\n\n#### 重命名文件\n\
  \n将上述 复制的 `words` 文件重命名为 `dictionary.txt`，使用：\n\n```\nmv -iv words dictionary.txt\n\
  ```\n\n或者，将其移动到 `Documents` 目录并同时重命名，使用：\n\n```\nmv -iv words/dictionary.txt\n```\n\
  \n#### 重命名目录\n\n将上述 复制的 `bash` 目录重命名为 `bash-commands`，使用：\n\n```\nmv -iv bash-commands\n\
  ```\n\n#### 注意事项\n\n### 如果文件存在会怎样？\n\n你会看到提示要求你确认覆盖文件。输入 `y` 并按回车键继续：\n\n```\nmv:\
  \ overwrite 'Documents/words'? y\nrenamed 'words' -> 'Documents/words'\n```\n\n\
  只需在提示处按回车键即可取消。\n\n### 如果目录存在会怎样？\n\n`mv` 只有在目录为空时才会覆盖。你可以：\n\n* 将文件复制 到目标目录\n\n\
  * 重命名目标目录\n\n#### 为 `mv` 添加别名\n\n与其每次使用命令时都输入 `mv-iv`，你可以在 `~/.bash_aliases` 文件中为命令添加别名。\n\
  \n例如：\n\n```\nalias mv='mv -iv'\n```\n\n现在，当你输入 `mv` 时，实际上使用的是 `mv -iv`。\n\n# 4.2.14.\
  \ `rm` — 删除文件或目录\n\n使用 `rm` 命令，你可以删除文件或目录。\n\n命令的基本格式是：\n\n```\nrm source\n```\n\
  \n更安全的方法是给命令添加 `-iv` 选项：\n\n```\nrm -iv source\n```\n\n使用 `-i`（交互式），如果文件或目录已存在，`rm`\
  \ 在删除前将要求你进行确认。`-v`（详细）将在屏幕上打印命令的操作。\n\n为了方便起见，你可以添加别名。\n\n#### 示例文件\n\n要遵循以下示例，你需要使用\
  \ cp 命令将以下文件复制到家目录：\n\n```\ncp -v /usr/share/dict/words ~\ncp -rv /usr/share/doc/bash\
  \ ~\n```\n\n`~` 是家目录的快捷方式。\n\n#### 删除文件\n\n简单的用例是删除文件。\n\n#### 删除文件\n\n例如，删除上述 复制的\
  \ `words` 文件，使用：\n\n```\nrm -iv words\n```\n\n输出：\n\n```\nremoved 'words'\n```\n\
  \n#### 删除目录\n\n同样，删除上述 复制的 `bash` 目录，使用：\n\n```\nrm -iv bash\n```\n\n输出：\n\n```\n\
  removed 'bash'\n```\n\n#### 删除目录\n\n在这种情况下，你想删除一个目录。\n\n#### 删除空目录\n\n要删除空目录，使用：\n\
  \n```\nrm -iv directory\n```\n\n### 删除带有内容的目录\n\n要删除包含文件的目录，使用 `-r` 选项：\n\n```\n\
  rm -ivr directory\n```\n\n#### 注意事项\n\n### 如果文件存在会怎样？\n\n你会看到提示要求你确认删除文件。输入 `y`\
  \ 并按回车键继续：\n\n```\nrm: remove regular file 'filename'? y\nremoved\n```\n\n只需在提示处按回车键即可取消。\n\
  \n### 如果目录存在会怎样？\n\n`rm` 只有在目录为空时才会删除。要进行递归删除，使用 `-r` 选项。\n\n#### 为 `rm` 添加别名\n\n\
  与其每次使用命令时都输入 `rm-iv`，你可以在 `~/.bash_aliases` 文件中为命令添加别名。\n\n例如：\n\n```\nalias rm='rm\
  \ -iv'\n```\n\n现在，当你输入 `rm` 时，实际上使用的是 `rm -iv`。\n\n# 4.2.15. `echo` — 显示文本或值\n\n\
  使用 `echo` 命令，你可以打印文本或变量的值。\n\n命令的基本格式是：\n\n```\necho text_or_value\n```\n\n####\
  \ 显示文本\n\n要在屏幕上打印文本，使用 `echo` 后接你想打印的内容：\n\n```\necho \"Hello, This is echo!\"\n\
  ```\n\n输出：\n\n```\nHello, This is echo!\n```\n\n#### 显示变量值\n\n你还可以使用 `echo` 显示环境变量的值。\n\
  \n例如：\n\n```\necho $PATH\n```\n\n`PATH` 中的 `$` 表示这是一个变量。\n\n输出：\n\n```\n/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin\n\
  ```\n\n`PATH` 包含了用于查找程序或命令的路径（目录）列表。你可以在 `~/.bashrc` 中设置或修改环境变量。\n\n# 4.3. 其他有用命令\n\
  \n这些是你可能需要的命令。\n\n* 4.3.1. `df` — 报告磁盘使用情况\n* 4.3.2. `du` — 估算文件或目录的磁盘使用情况\n* 4.3.3.\
  \ `find` — 搜索文件\n* 4.3.4. `free` — 查看空闲和已内存\n* 4.3.5. `locate` — 使用名称查找文件\n* 4.3.6.\
  \ `which` — 定位命令\n\n# 4.3.1. `df` — 报告磁盘使用情况\n\n`df` 命令将报告连接到系统的所有存储设备的已用和可用磁盘空间。\n\
  \n例如，要查找 `/` — 根文件系统的磁盘使用量，你可以使用命令：\n\n```\ndf -h /\n```\n\n输出：\n\n\n\n\n\n```\n\
  Filesystem               Size  Used Avail Use% Mounted on\n/dev/mapper/vgmint-root\
  \   28G  6.9G   20G  26% /\n```\n\n`-h` 选项使输出具有人类可读性。如果没有此选项，可用磁盘空间将报告为 `20600196`\
  \ 而不是 `20G`。\n\n# 4.3.2. `du` — 估计文件或目录的磁盘占用\n\n计算文件或目录占用的磁盘空间。\n\n例如，要计算家目录下文件占用的磁盘空间，可以使用以下命令：\n\
  \n```\ndu -sh ~\n```\n\n输出：\n\n```\n7.4G .\n```\n\n`-s` 选项打印摘要，而不是打印每个文件占用的空间。\n\
  \n`-h` 使输出具有人类可读性。\n\n# 4.3.3. `find` — 搜索文件\n\n使用文件名、文件类型等搜索文件。\n\n例如，要在主目录中查找文件名包含\
  \ `.bash` 的文件，可以使用以下命令：\n\n```\nfind ~ -name \".bash*\"\n```\n\n输出：\n\n```\n/home/user/.bashrc\n\
  /home/user/.bash_history\n/home/user/.bash_logout\n```\n\n注意\n\n这里的 `~` 是家目录的快捷方式。\n\
  \n`.bash*` 中的星号 (`*`) 起通配符的作用。\n\n`find` 命令不使用数据库，因此与 `locate` 相比，搜索速度会较慢。然而，它可以识别最近创建或修改的文件。\n\
  \n# 4.3.4. `free` — 查看空闲和使用的内存\n\n通过 `free`，你可以找到空闲和使用的内存（RAM）以及交换空间。\n\n用法：\n\n\
  ```\nfree -h\n```\n\n输出：\n\n```\n total        used        free      shared  buff/cache\
  \   available\nMem:          3.8Gi       618Mi       1.3Gi       7.0Mi       1.9Gi\
  \       3.0Gi\nSwap:         979Mi          0B       979Mi\n```\n\n`-h` 选项使输出具有人类可读并显示相应的单位。在上面的示例中，空闲物理内存（RAM）的数量为\
  \ 1.3 GiB（二进制字节）。\n\n# 4.3.5. `locate` — 使用文件名查找文件\n\n使用文件名搜索文件。这种方法非常快，因为它使用了文件名数据库。\n\
  \n例如：\n\n```\nlocate bashrc\n```\n\n输出：\n\n```\n/etc/bash.bashrc\n/etc/skel/.bashrc\n\
  /home/user/.bashrc\n...\n```\n\n注意\n\n这种方法可能找不到最近创建或修改的文件。\n\n较新的文件可能尚未包含在数据库中。要手动更新数据库，你可以运行命令：\n\
  \n```\nsudo updatedb\n```\n\n或者，你可以使用 `find` 命令来搜索新文件。\n\n# 4.3.6. `which` — 定位命令\n\
  \n如果命令存在于搜索路径（即 `$PATH`）中，`which` 命令会打印该命令的完整路径。\n\n例如：\n\n```\nwhich python3\n\
  ```\n\n输出：\n\n```\n/usr/bin/python3\n```\n\n# 4.4. 使用 nano 编辑文本文件\n\n`GNU` `nano`\
  \ 是一个命令行文本编辑器，具有撤销/重做、语法高亮、交互式搜索和替换等功能。\n\n要打开程序，请在终端会话中输入 `nano`。\n\n*   4.4.1.\
  \ 创建新文件\n*   4.4.2. 从剪贴板粘贴文本\n*   4.4.3. 保存更改\n*   4.4.4. 退出 nano\n\n# 4.4.1. 创建新文件\n\
  \n要创建一个新文件，使用 `nano` 后跟想要创建的文件名。\n\n例如：\n\n```\nnano exercise.txt\n```\n\n这将以写入模式打开文件（图\
  \ 80）。\n\n![../../_images/nano-create-file.png](img/nano-create-file.png)\n\n在 nano\
  \ 中创建文件\n\n在此阶段你可以开始输入文本。\n\n# 4.4.2. 从剪贴板粘贴文本\n\n要从不同的程序（例如浏览器）复制并粘贴文本到正在 nano\
  \ 编辑的文件中，执行以下操作：\n\n1.  使用 `Ctrl+c` 将文本复制到剪贴板\n2.  在 nano 中，将光标移动到你想粘贴文本的位置\n3.\
  \  使用快捷键 `Shift+Ctrl+v` 粘贴文本\n\n# 4.4.3. 保存更改\n\n要保存文件，使用快捷键 `Ctrl+o`。\n\n这对应于底部显示的\
  \ `^O` 写入（图 81）。这里的 `^` 代表 `Ctrl` 键。\n\n![../../_images/nano-write-out.png](img/nano-write-out.png)\n\
  \n要保存更改时使用写入功能\n\n底部将显示如下的提示符（图 82）：\n\n```\nFile Name: exercise.txt\n```\n\n![../../_images/nano-create-file.png](img/nano-create-file.png)\n\
  \n要保存的文件名\n\n按 `Enter` 键确认文件名。\n\n# 4.4.4. 退出 nano\n\n要退出 nano，按 `Ctrl+x`。如果你进行了更改，它会询问你是否要保存。\n\
  \n\n\n\n\n#### 2. 进入该目录\n\n#### 3. 下载查询序列\n\n#### 4. 查看下载的序列（可选）\n\n#### 创建新目录 —\
  \ `mkdir`\n\n为了将与此项目相关的输入和输出文件放在一起，使用 `mkdir` 命令在你的主目录下创建一个新目录。\n\n```\nmkdir -p\
  \ ~/projects/sars-cov-2\n```\n\n这里：\n\n`~` 是主目录的快捷方式。\n\n`-p` 在必要时创建父目录。在这种情况下，`projects`\
  \ 目录不存在，因此也会被创建。\n\n#### 切换目录 — `cd`\n\n使用 `cd` 命令进入新创建的目录：\n\n```bash\ncd ~/projects/sars-cov-2\n\
  ```\n\n#### 下载序列 — `wget`\n\n要下载序列文件，你可以使用 `wget` 命令并将下载链接作为参数。在这种情况下，下载链接对应 FASTA\
  \ 格式文件的 URL（参见示例数据）：\n\n```bash\nwget https://www.uniprot.org/uniprot/P0DTC2.fasta\n\
  ```\n\n下载完成后，你可以使用 `ls` 命令验证文件是否存在：\n\n```bash\nls -l\n```\n\n输出：\n\n```\ntotal\
  \ 4\n-rw-rw-r-- 1 user user 1414 Feb 10 00:00 P0DTC2.fasta\n```\n\n#### 查看下载的序列\
  \ — `cat` 或 `less`\n\n由于 `P0DTC2.fasta` 是 FASTA 格式——一种纯文本格式，你可以使用 `cat` 命令查看文件内容：\n\
  \n```bash\ncat P0DTC2.fasta\n```\n\n输出：\n\n```\n>sp|P0DTC2|SPIKE_SARS2 Spike glycoprotein\
  \ OS=Severe acute respiratory syndrome coronavirus 2 OX=2697049 GN=S PE=1 SV=1\n\
  MFVFLVLLPLVSSQCVNLTTRQQLPPAYTNSFTRGVYYPDKVFRSSVLHSTQDLFLPFFS\nNVTWFHAIHVSGTNGTKRFDNPVLPFNDGVYFASTEKSNIIRGWIFGTTLDSKTQSLLIV\n\
  NNATNVVIKVCEFQFCNDPFLGVYYHKNNKSWMESEFRVYSSANNCTFEYVSQPFLMDLE\nGKQGNFKNLREFVFKNIDGYFKIYSKHTPINLVRDLPQGFSALEPLVDLPIGINITRFQT\n\
  LLALHRSYLTPGDSSSGWTAGAAAYYVGYLQPRTFLLKYNENGTITDAVDCALDPLSETK\nCTLKSFTVEKGIYQTSNFRVQPTESIVRFPNITNLCPFGEVFNATRFASVYAWNRKRISN\n\
  CVADYSVLYNSASFSTFKCYGVSPTKLNDLCFTNVYADSFVIRGDEVRQIAPGQTGKIAD\nYNYKLPDDFTGCVIAWNSNNLDSKVGGNYNYLYRLFRKSNLKPFERDISTEIYQAGSTPC\n\
  NGVEGFNCYFPLQSYGFQPTNGVGYQPYRVVVLSFELLHAPATVCGPKKSTNLVKNKCVN\nFNFNGLTGTGVLTESNKKFLPFQQFGRDIADTTDAVRDPQTLEILDITPCSFGGVSVITP\n\
  GTNTSNQVAVLYQDVNCTEVPVAIHADQLTPTWRVYSTGSNVFQTRAGCLIGAEHVNNSY\nECDIPIGAGICASYQTQTNSPRRARSVASQSIIAYTMSLGAENSVAYSNNSIAIPTNFTI\n\
  SVTTEILPVSMTKTSVDCTMYICGDSTECSNLLLQYGSFCTQLNRALTGIAVEQDKNTQE\nVFAQVKQIYKTPPIKDFGGFNFSQILPDPSKPSKRSIEDLLFNKVTLADAGFIKQYGDC\n\
  LGDIAARDLICAQKFNGLTVLPPLLTDEMIAQYTSALLAGTITSGWTFGAGAALQIPFAM\nQMAYRFNGIGVTQNVLYENQKLIANQFNSAIGKIQDSLSSTASALGKLQDVVNQNAQALN\n\
  TLVKQLSSNFGAISSVLNDILSRLDKVEAEVQIDRLITGRLQSLQTYVTQQLIRAAEIRA\nSANLAATKMSECVLGQSKRVDFCGKGYHLMSFPQSAPHGVVFLHVTYVPAQEKNFTTAPA\n\
  ICHDGKAHFPREGVFVSNGTHWFVTQRNFYEPQIITTDNTFVSGNCDVVIGIVNNTVYDP\nLQPELDSFKEELDKYFKNHTSPDVDLGDISGINASVVNIQKEIDRLNEVAKNLNESLIDL\n\
  QELGKYEQYIKWPWYIWLGFIAGLIAIVMVTIMLCCMTSCCSCLKGCCSCGSCCKFDEDD\nSEPVLKGVKLHYT\n```\n\
  \n为了为了更好的控制，你可以使用 `less` 命令代替 `cat`。\n\n# 4.5.5. 下载蛋白质序列数据库\n\n你可以按照以下步骤下载并准备蛋白质序列数据库：\n\
  \n1. 创建新目录\n2. 进入该目录\n3. 下载数据库压缩包\n4. 解压缩（或提取）数据库压缩包\n5. 格式化数据库\n\n#### 创建新目录 —\
  \ `mkdir`\n\n为了将所有 BLAST 数据库放在同一个地方，使用 `mkdir` 命令创建一个目录存储它们：\n\n```bash\nmkdir databases\n\
  ```\n\n#### 切换目录 — `cd`\n\n使用 `cd` 命令进入新创建的目录：\n\n```bash\ncd databases\n```\n\n\
  #### 下载数据库压缩包 — `wget`\n\n访问 UniProt 网站上的[下载](https://www.uniprot.org/downloads)页面。导航到\
  \ `UniProtKB` 部分。点击 `Reviewed (Swiss-Prot)` 对应的 `fasta` 下载链接并复制。\n\n要下载数据库，你可以使用\
  \ `wget` 命令并将链接作为参数：\n\n```bash\nwget https://ftp.uniprot.org/pub/databases/current_release/uniprot_sprot.gz\n\
  ```\n\n下载完成后，会在当前目录下找到一个名为 `uniprot_sprot.gz` 的文件。你可以使用 `ls` 命令验证它是否存在：\n\n```bash\n\
  ls -lh\n```\n\n输出：\n\n```\ntotal 86\n-rw-rw-r-- 1 user user 86M Feb 10 15:00 uniprot_sprot.gz\n\
  ```\n\n由于该文件是压缩格式 (`.gz`)，你需要对其解压。\n\n#### 解压缩数据库压缩包 — `gunzip`\n\n要解压缩上一步下载的数据库压缩包，可以使用\
  \ `gunzip` 命令。默认情况下，`gunzip` 会删除原始文件。如果你想保留原始文件 (`.gz`)，请在 `gunzip` 中包含 `-k` (keep\
  \ input files) 选项。提供文件名：\n\n```bash\ngunzip uniprot_sprot.gz\n```\n\n提取完成后，会在同一目录下找到\
  \ FASTA 格式的数据库文件：\n\n```bash\nls -lh\n```\n\n输出：\n\n```\ntotal 267M\n-rw-rw-r--\
  \ 1 user user 267M Feb 10 15:00 uniprot_sprot.fasta\n```\n\n#### 查看数据库\n\n由于提取出的数据库文件很大，你可以使用\
  \ `head` 命令查看文件的前几行：\n\n```bash\nhead -n 5 uniprot_sprot.fasta\n```\n\n输出：\n\n```\n\
  >sp|Q6GZX4|001R_FRG3 Putative transcription factor 001R OS=Frog virus 3 (isolate\
  \ Goha) OX=654924 GN=FV3-001R PE=4 SV=1\nMAFSAEDVLKEYDRRRMEALLLSLYYPNDRKLLDYKEWSPPRVQECPKAPVEWNNPPS\n\
  EKGLIVGHFSGIKYKGEKAASEVDVNKMCCWVSKFKDAMRRYQGITCKIPGKVLSDLD\nAKIKAYNLTVEGGFRYSRVTKQHVAAFLKELRHSKQYENVLIHYILTDKRVDIQHL\n\
  EKDLVKDFVESAHRMRQMINVKYILYQLLHHGPDGS\n```\n\n或者，可以使用 `less` 命令逐页查看：\n\n```bash\n\
  less uniprot_sprot.fasta\n```\n\n如果你想统计数据库中的序列数量，可以使用 `grep` 命令。\n\n```bash\ngrep\
  \ \">\" -c uniprot_sprot.fasta\n```\n\n输出：\n\n```\n564277\n```\n\n`grep` 的 `-c`\
  \ 选项统计给定搜索字符串（在此情况下为 `>`）在输入文件中出现的次数。FASTA 格式的序列以 `>` 开头，，因此，。序列序列序列格式。数据库 —格式格式序列\
  \ — `makeblastdb`\n\n数据库在用于 BLAST 搜索之前需要进行格式化。你可以使用 `makeblastdb` 命令对其进行格式化，它是 NCBI\
  \ BLAST+ 软件包的一部分。\n\n该命令有多个选项。例如：\n\n```bash\nmakeblastdb -in uniprot_sprot.fasta\
  \ -parse_seqids \\\n-title \"Swiss-Prot\" -dbtype prot -out swissprot\n```\n\n注意：`\\\
  ` 字符将长命令分成多行。\n\n输出：\n\n```\n Building a new DB, current time: 03/24/2021 15:12:50\n\
  \ New DB name:   /home/user/databases/swissprot\n New DB title:  Swiss-Prot\n Sequence\
  \ type: Protein\n Keep MBits: T\n Maximum file size: 1000000000B\n Adding sequences\
  \ from FASTA; added 564277 sequences in 47.507 seconds.\n```\n\n选项含义：\n\n- `-in`:\
  \ 包含输入序列的文件名。\n- `-parse_seqids`: 从输入文件中解析序列标识符。这些标识符将显示在搜索结果中。\n- `-title`: 数据库的描述性名称。\n\
  - `-dbtype`: 输入序列的类型——接受的值为 `prot`（蛋白质）和 `nucl`（核苷酸）序列。\n- `-out`: 此处的值将用于命名输出文件。这也是你在进行搜索时需要使用的数据库名称（参见输出中的新数据库名称）。\n\
  \n格式化完成后，你会在 `databases` 目录下发现以下文件：\n\n```bash\nls -lh\n```\n\n\n\n\n\n```\ntotal\
  \ 585M\n-rw-rw-r-- 1 user user 100M Mar 24 15:13 swissprot.phr\n-rw-rw-r-- 1 user\
  \ user 4.4M Mar 24 15:13 swissprot.pin\n-rw-rw-r-- 1 user user 2.2M Mar 24 15:13\
  \ swissprot.pog\n-rw-rw-r-- 1 user user  18M Mar 24 15:13 swissprot.psd\n-rw-rw-r--\
  \ 1 user user 411K Mar 24 15:13 swissprot.psi\n-rw-rw-r-- 1 user user 195M Mar 24\
  \ 15:13 swissprot.psq\n-rw-rw-r-- 1 user user 267M Feb 10 15:00 uniprot_sprot.fasta\n\
  ```\n\n# 4.5.6. 使用查询序列搜索数据库\n\n在下载了查询序列并下载且格式化数据库后，你可以开始进行 BLAST 搜索。\n\n首先，进入包含查询序列的目录：\n\
  \n```\ncd ~/projects/sars-cov-2\n```\n\n现在，使用查询序列和数据库的完整路径运行 `blastp` 命令：\n\n```\n\
  blastp -query P0DTC2.fasta \\\n-db /home/user/databases/swissprot \\\n-out blastp-results.txt\
  \ \\\n-outfmt \"7 sacc stitle qlen slen pident\"\n```\n\n各个选项的含义：\n\n`-query`\n\n\
  查询序列的路径。\n\n`-db`\n\n序列数据库的完整路径。\n\n`-out`\n\n保存结果的文件。\n\n`-outfmt`\n\n输出文件的格式。此将使用格式选项\
  \ `7`（制表符分隔文本）并包含以下信息：\n\n* 匹配序列的访问号和描述（`sacc` 和 `stitle`），\n* 查询序列和目标序列的长度（`qlen`\
  \ 和 `slen`），\n* 匹配的一性百分比（`pident`）。\n\n数据库搜索完成后，你可以打开 `blastp-results.txt` 查看结果：\n\
  \n```\nless -S blastp-results.txt\n```\n\n`less` 命令的 `-S` 选项会禁用自动换行。\n\n输出：\n\n\
  ```\n#### BLASTP 2.9.0+\n#### Query: sp|P0DTC2|SPIKE_SARS2 Spike glycoprotein OS=Severe\
  \ acute respiratory syndrome coronavirus 2 OX=2697049 GN=S PE=1 SV=1\n#### Database:\
  \ /home/user/databases/swissprot\n#### Fields: subject acc., subject title, query\
  \ length, subject length, % identity\n# 88 hits found\nP0DTC2      Spike glycoprotein\
  \ OS=Severe acute respiratory syndrome coronavirus 2 OX=2697049 GN=S PE=1 SV=1 1273\
  \    1273    100.000\nP59594      Spike glycoprotein OS=Severe acute respiratory\
  \ syndrome coronavirus OX=694009 GN=S PE=1 SV=1    1273    1255    76.038\nQ3LZX1\
  \      Spike glycoprotein OS=Bat coronavirus HKU3 OX=442736 GN=S PE=3 SV=1     1273\
  \    1242    76.041\nQ3I5J5      Spike glycoprotein OS=Bat coronavirus Rp3/2004\
  \ OX=349344 GN=S PE=1 SV=1 1273    1241    75.334\nQ0Q475      Spike glycoprotein\
  \ OS=Bat coronavirus 279/2005 OX=389167 GN=S PE=3 SV=1 1273    1241    74.745\n\
  ...\n```\n\n# 4.6. 注意事项\n\n## 4.6.1. 向 PATH 添加目录\n\n`PATH` 变量存储了搜索命令的目录列表。如果你有一个命令不在列表中，你需要将其添加到\
  \ `PATH`。\n\n你可以使用 `echo` 命令显示 `PATH` 的当前值：\n\n```\necho $PATH\n```\n\n输出：\n\n```\n\
  /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin\n\
  ```\n\n要修改 `PATH` 并添加目录，可以按照以下步骤操作。此示例将 `/home/user/.local/bin` 添加到 `PATH`。\n\n\
  注意\n\n编辑 `PATH` 时需要小心。你还需要确保列表中包含 `$PATH`，否则你将无法访问任何命令！\n\n1. 用文本编辑器打开 `$HOME/.bashrc`。\n\
  2. 在文件末尾添加以下行。将你想添加的目录用冒号分隔。列表应以 `$PATH` 结尾。\n\n```\nPATH=/home/user/.local/bin:$PATH\n\
  ```\n\n3. 使用 `echo` 验证更改：\n\n```\necho $PATH\n```\n\n输出：\n\n```\n/home/user/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin\n\
  ```\n\n## 4.6.2. 处理空格\n\n创建带有空格的目录时，最好使用下划线（`_`）或连字符（`-`）来分隔单词。\n\n例如：\n\n```\n\
  mkdir \"Sample Data\"\n```\n\n进入该目录：\n\n```\ncd \"Sample Data\"\n```\n\n打印当前目录：\n\
  \n```\npwd\n```\n\n输出：\n\n```\n/home/user/Sample Data\n```\n\n\n\n\n\n— 存储在你的计算机上，而如果你使用公共实例，它将被存储在服务器上，且可能未加密\
  \ 2。\n\n### 访问更多工具\n— 通过在你的本地实例上安装，来获取公共服务器上未安装的工具。\n\n### CPU 和存储限制\n— 取决于你的计算机，而在公共服务器上，对每个用户的\
  \ CPU 和存储使用量有限制 2。\n\n2(1,2)\n\n情况在 [`usegalaxy.org`](https://usegalaxy.org) ——\
  \ 主要 Galaxy 实例也是如此。如需更多信息，请阅读 [`galaxyproject.org/main/#user-data-and-job-quotas`](https://galaxyproject.org/main/#user-data-and-job-quotas)。\n\
  \n# 5.2. 在你的计算机上运行 Galaxy\n\n要在你的计算机上运行 Galaxy 的本地实例，你需要：\n\n1. 检查你的计算机是否符合所有要求\n\
  2. 获取 Galaxy 的最新发布\n3. 创建 Python 虚拟环境\n4. 启动 Galaxy\n\n在此阶段，你将能够在浏览器中打开 Galaxy 的网络界面并开始使用包含的工具。\n\
  \n注意\n为了利用 Galaxy 提供的所有功能（如安装额外工具），你还需要执行以下操作：\n\n5. 注册用户账户\n6. 为用户授予管理员权限\n\n*\
  \ 5.2.1. 检查系统要求\n* 5.2.2. 获取 Galaxy 的最新发布\n* 5.2.3. 创建 Python 虚拟环境\n* 5.2.4. 启动\
  \ Galaxy\n* 5.2.5. 停止 Galaxy\n\n# 5.2.1. 检查系统要求\n\n在运行 Galaxy 之前，你需要：\n\n1. 安装 Git\
  \ 和 Python virtualenv 模块\n2. 检查是否有足够的磁盘空间\n3. 确保 Conda 环境未激活\n\n## 安装 Git 和 Python\
  \ virtualenv 模块\n\nGit 对于从 GitHub 获取 Galaxy 的最新版本源码是必要的。Python virtualenv 模块对于为运行\
  \ Galaxy 设置一个隔离的虚拟环境是必要的。\n\n要安装它们，请使用 Software Manager 或 apt，并搜索并安装以下包：\n\n1. `git`\n\
  2. `python3-venv`\n\n## 检查可用磁盘空间\n\n初始设置至少需要 5 GB 的可用磁盘空间。对于你的分析以及你可能从 Galaxy tool\
  \ shed 安装的工具，将更多空间。\n\n要检查可用磁盘空间，你可以使用 Disk Usage Analyzer 或 `df 命令。\n\n## 确保 Conda\
  \ 环境未激活\n\n注意\n如果你没有使用 Conda，可以忽略此项要求并继续下一步：\n\n`->` 获取 Galaxy 的最新发布\n\n如果你正在使用\
  \ Conda，请确保在 启动 Galaxy 步骤之前没有环境处于激活状态。\n\n你可以使用以下命令取消激活的 Conda 环境：\n\n```\nconda\
  \ deactivate\n```\n\n虽然可以使用现有的 Conda 安装安装 Galaxy，但使用 Python 的 venv 模块创建并使用虚拟环境更简单。\n\
  \n—\n\n在满足所有要求后，你可以继续使用 Git 获取 Galaxy 的最新发布。\n\n# 5.2.2. 获取 Galaxy 的最新发布\n\n创建一个目录来设置\
  \ Galaxy 并进入该目录：\n\n```\nmkdir ~/programs\ncd ~/programs\n```\n\n这里的 `~` 是你家目录的快捷方式。\n\
  \n注意\n此目录并非专门为 Galaxy 设置。你可以用它安装或存储其他程序。\n\n从 GitHub 项目仓库获取 Galaxy 的最新发布。编写时的最新版本是\
  \ 21.01。\n\n你可以使用 `git` 命令获取（或克隆）仓库：\n\n```bash\ngit clone -b release_21.01 https://github.com/galaxyproject/galaxy.git\n\
  ```\n\n`git clone` 的 `-b` 选项会检出指定的分支——在这种为 `release_21.01`。\n\n输出：\n```\nCloning\
  \ into 'galaxy'...\nremote: enumerating objects: 364, done.\nremote: Counting objects:\
  \ 100% (364/364), done.\nremote: Compressing objects: 100% (232/232), done.\nremote:\
  \ receiving objects: 497693 (delta 184), reused 237 (delta 131), 520.44 MiB | 3.89\
  \ MiB/s, done.\nresolving deltas: 100% (391502), done.\npacking files: 100% (5826),\
  \ done.\n```\n这将取决于你的网络连接需要一些时间。完成后，你将在当前目录下找到一个名为 `galaxy` 的目录。\n\n# 5.2.3. 创建\
  \ Python 虚拟环境\n\n在这一步中，你将使用 Python 3 `venv` 模块为 Galaxy 创建隔离的环境。\n\n注意\n关于创建和使用虚拟环境的详细指南，请阅读：\n\
  `->` Python 环境\n\n创建环境：\n\n1. 进入 `galaxy` 目录：\n```bash\ncd galaxy\n```\n2. 使用 `.venv`\
  \ 作为名称创建虚拟环境：\n```bash\npython3 -m venv .venv\n```\n注意：`.venv` 中的点 `.` 是重要的。\n\n\
  3. 激活虚拟环境：\n```bash\nsource .venv/bin/activate\n```\n你的 shell 提示符现在将变为包含 `(.venv)`：\n\
  ```\n(.venv) user@cookbook:~/galaxy$\n```\n4. 安装或升级 Python 构建工具：\n```bash\npip3\
  \ install -U setuptools wheel\n```\n这一步是必要的，这样额外的包就可以无问题地构建和安装。\n\n5. 最后，退出虚拟环境：\n\
  ```bash\ndeactivate\n```\n\n在下一步中，启动脚本将检测此环境并使用它安装运行 Galaxy 所需的所有依赖项。\n\n# 5.2.4.\
  \ 启动 Galaxy\n\n在 `galaxy` 目录中，使用命令运行启动 shell 脚本：\n\n```bash\nsh run.sh\n```\n\n\
  注意\n第一次运行时，此脚本将需要一些时间来完成。后续运行将更快。\n\n输出：\n```\nActivating virtualenv at .venv\n\
  Requirement already satisfied: pip>=8.1 in .venv/lib/python3.8/site-packages (20.0)\n\
  ...\n```\n当你在终端中看到如下消息时，Galaxy 已准备就绪：\n\n```\nStarting server in PID 11466.\nserving\
  \ on http://localhost:8080\n```\n*保持终端窗口打开。*\n\n打开浏览器窗口并在地址栏输入 [`localhost:8080`](http://localhost:8080)。\n\
  \n你将看到你的本地 Galaxy 实例的主页 图 85。\n\n![../../_images/galaxy-home.png](img/galaxy-home.png)\n\
  图 85 本地 Galaxy 实例的主页\n\n你可以开始探索可用工具，甚至上传数据并开始使用它们。但是，现在注册用户账户 是个好主意，这样当你清除浏览器历史就不会丢失数据。\n\
  \n# 5.2.5. 停止 Galaxy\n\n要停止 Galaxy，打开运行 `sh run.sh` 命令的终端窗口 图 86。\n\n![../../_images/galaxy-terminal.png](img/galaxy-terminal.png)\n\
  图 86 运行 Galaxy 的终端窗口\n\n使用快捷键 `Ctrl+c` 停止 Galaxy，即按住 `Ctrl` 键然后按 `c` 键。\n\n当 Galaxy\
  \ 停止运行后，你将在终端中看到已关闭的 图 87 消息。\n\n![../../_images/galaxy-shutdown.png](img/galaxy-shutdown.png)\n\
  图 87 Galaxy 已完成关闭\n\n现在你可以关闭终端窗口了。\n\n# 5.3. 注册用户账户\n\n在 Galaxy 主页上，点击导航栏中的“登录或注册”链接\
  \ 图 88。\n\n![../../_images/user-login-register.png](img/user-login-register.png)\n\
  图 88 点击登录或注册\n\n你将被带到登录页面。\n\n点击页面底部的“在此注册”链接 图 89。\n\n\n\n\n\n![../../_images/user-register-here.png](img/user-register-here.png)\n\
  \n图 89 点击“此处注册”链接\n\n在“创建 Galaxy 账户”页面上，输入您的电子邮件地址、密码及其确认密码，以及一个公共名称（图 90）。\n\n\
  #### 注意事项\n此用户账户与您在 `usegalaxy.org`或其他 Galaxy 服务器上的账户没有关联。\n\n它仅存在于您的本地 Galaxy 实例中。您也可以忽略页面顶通知，该通知不适用于本地实例。\n\
  \n![../../_images/user-registration-page.png](img/user-registration-page.png)\n\n\
  图 90 用户账户创建页面\n\n点击“创建（Create）”按钮继续。\n\n如果账户创建成功，您将会被登录并重定向到您的 Galaxy 实例的主页。\n\n\
  *   5.3.1\\. 管理您的账户\n\n# 5.3.1\\. 管理您的账户\n\n您可以通过点击导航栏中的用户名来管理账户（图 91）。\n\n![../../_images/user-logged-in.png](img/user-logged-in.png)\n\
  \n图 91 以用户身份登录\n\n如果您将从 Galaxy 工具共享库（tool shed）安装额外的工具，则此用户账户需要管理员权限。您可以在下一步中进行配置。\n\
  \n# 5.4\\. 为用户授予管理员权限\n\n要为用户授予管理员权限，您需要为 Galaxy 创建一个配置文件，并将用户的电子邮件地址添加到管理员列表中，然后重启\
  \ Galaxy 以使更改生效。\n\n*   5.4.1\\. 创建配置文件\n*   5.4.2. 将用户添加到管理员用户列表\n*   5.4.3. 重启\
  \ Galaxy\n*   5.4.4\\. 验证管理员访问\n\n# 5.4.1\\. 创建配置文件\n\nGalaxy 包含了一个示例配置文件——`galaxy.yml.sample`。\n\
  \n要使用示例文件作为模板创建配置文件，请按照以下步骤操作（参见图 92）：\n\n1.  使用文件管理器导航到 `$HOME/programs/galaxy/config`\
  \ 目录\n2.  双击 `galaxy.yml.sample` 在文本编辑器中打开它\n3.  将其保存为同一目录下的 `galaxy.yml`\n\n![../../_images/galaxy-yml-sample.png](img/galaxy-yml-sample.png)\n\
  \n图 92 复制 Galaxy 的示例配置文件\n\n#### 注意事项\n或者，您可以在终端中使用 `cp` 命令来复制文件。\n\n假设您在 `$HOME/programs/galaxy`\
  \ 目录下，请执行以下操作：\n\n```\ncp config/galaxy.yml.sample config/galaxy.yml\n```\n\n# 5.4.2\\\
  . 将用户添加到管理员用户列表\n\n在文本编辑器中打开 `galaxy.yml` 的情况下，搜索 `admin_users` 设置。\n\n您将发现以下部分：\n\
  \n```\n# Administrative users - set this to a comma-separated\n# list of valid Galaxy\
  \ users (email addresses). These\n# users will have access to the Admin section\
  \ of the\n# server, and will have access to create users,\n# groups, roles, libraries,\
  \ and more.  For more\n# information, see: https://galaxyproject.org/admin/\n#admin_users:\
  \ null\n```\n\n通过删除开头的 `#` 符号来取消注释 `admin_users`。\n\n将 `null` 替换为用户账户的电子邮件地址。\n\n\
  例如：\n\n```\nadmin_users: user@example.org\n```\n\n保存文件。\n\n# 5.4.3\\. 重启 Galaxy\n\
  \n如果 Galaxy 正在运行，请停止 Galaxy，然后重新启动它。\n\n# 5.4.4\\. 验证管理员访问\n\n当您再次登录时，您将在导航栏中看到“管理员（Admin）”链接（图\
  \ 93）。\n\n![../../_images/admin-link.png](img/admin-link.png)\n\n图 93 导航栏中的管理员链接\n\
  \n如果您点击“管理员”，您将进入管理页面（图 94）。\n\n![../../_images/admin-home.png](img/admin-home.png)\n\
  \n图 94 Galaxy 管理页面\n\n## 安装工具\n\n要安装新工具，请点击以下链接：\n\n工具管理（Tool Management） ‣ 安装与卸载（Install\
