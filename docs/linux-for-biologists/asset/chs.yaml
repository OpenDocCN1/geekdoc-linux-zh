  \ `Launch` 按钮。\n\n如果程序包含任何命令，你可以在 terminal 会话中访问它们。\n\n### 3.1.3 移除已安装的软件\n\n你可以按照以下步骤移除从存储库安装的软件。\n\
  \n打开软件管理器。\n\n点击主应用程序窗口中的设置按钮，然后选择 `Show installed applications`（图 46）。\n\n![../../_images/8-show-installed-applications.png](img/8-show-installed-applications.png)\n\
