  \n图 53 更新管理器正在安装软件更新\n\n当更新完成后，你将看到一条消息 — 系统是最新的（图 54）。\n\n![../../_images/16-update-complete.png](img/16-update-complete.png)\n\
  \n图 54 更新成功\n\n\n\n\n\n#### 额外的软件仓库\n\n软件的新版本发布到发行版仓库通常需要一段时间时间。\n\n如果您感兴趣的软件不可用，或者您需要更新版本的软件，可以尝试从这些额外源进行安装：\n\
  \n*   来自 PyPI 的 Python 软件包\n*   来自 CPAN 的 Perl 模块\n*   来自 CRAN 或 Bioconductor 的\
  \ R 软件包\n*   来自 Anaconda Cloud 的 Conda 软件包\n\n#### 注意事项\n\n使用这些方法安装的软件也需要手动保持更新。\n\
  \n# 3.2. Python 软件包\n\n如果您感兴趣的软件在 PyPI 上作为 Python 软件包可用，您可以使用 pip —— Python 软件包安装器来安装它。\n\
  \n#### 注意\n\n您的软件可能已经通过快速简单的方法 可用。请搜索以 `python-` 开头的包名。\n\n在某些情况下，在虚拟环境中安装软件包可能是更好的选择。请阅读：\n\
  \n`->` 我什么时候应该使用虚拟环境？\n\n*   3.2.1. 依赖\n*   3.2.2. 在 PyPI 上搜索软件包\n*   3.2.3. 安装\
  \ Python 软件包\n*   3.2.4. 更新已安装的软件包\n*   3.2.5. 移除已安装的软件包\n*   3.2.6. 使用已安装的软件包\n\
  *   3.2.7. Python 虚拟环境\n*   3.2.8. 注意事项\n\n# 3.2.1. 依赖\n\n#### Python 软件包安装器 (pip)\n\
  \n要安装 pip，请参考快速简单的方法安装软件。\n\n搜索并安装 `python3-pip` 软件包。\n\n#### 将 $HOME/.local/bin\
  \ 添加到 $PATH\n\n包含命令的软件包会将它们安装在 `$HOME/.local/bin` 目录（什么是 $HOME?）。\n\n为了能够方便地运行这些命令，您需要将此目录添加到您的\
  \ `$PATH` 变量中。您可以按照将目录添加到 PATH 中的步骤进行操作。\n\n#### 注意事项\n\n*   您不应在下面的命令中添加 `sudo`。\n\
  \n此方法仅在您的主目录中安装文件，因此不需要管理员权限。\n\n# 3.2.2. 在 PyPI 上搜索软件包\n\n在网页浏览器中打开 [PyPI 网站](https://pypi.org)\
  \ [https://pypi.org]。\n\n在“Search projects”（搜索项目）字段中，输入您想要安装的软件名称并按回车键或点击搜索按钮（图\
  \ 55）。\n\n![../../_images/pypi-search.png](img/pypi-search.png)\n\n图 55 在 PyPI 上搜索软件包\n\
  \n将显示匹配搜索词的软件包列表（图 56）。\n\n![../../_images/pypi-search-result.png](img/pypi-search-result.png)\n\
  \n图 56 biopython 的搜索结果。1.78 是版本号。\n\n点击结果进入项目描述页。\n\n在项目描述页上，在 `pip` 安装命令中找到包名（图\
  \ 57）。\n\n在此例中，它是 `biopython`。\n\n![../../_images/pypi-biopython-page.png](img/pypi-biopython-page.png)\n\
  \n图 57 Biopython 的项目描述页\n\n#### 注意\n\n在下述步骤中，您需要使用 `pip3` 而不是 `pip` 命令。为什么？\n\n\
  您现在可以继续安装软件包了。\n\n# 3.2.3. 安装 Python 软件包\n\n打开终端。\n\n使用 `pip3 install` 命令配合您想要安装的包名。\n\
  \n以 biopython 为例：\n\n```\npip3 install biopython\n```\n\n输出：\n\n```\nCollecting\
  \ biopython\n  Downloading biopython-1.78-cp38-cp38-manylinux1_x86_64.whl (2.3 MB)\n\
  \     |********************************| 2.3 MB 2.1 MB/s\nCollecting numpy\n  Downloading\
  \ numpy-1.20.1-cp38-cp38-manylinux2010_x86_64.whl (15.4 MB)\n     |********************************|\
  \ 15.4 MB 90 kB/s\nInstalling collected packages: numpy, biopython\nSuccessfully\
  \ installed biopython-1.78 numpy-1.20.1\n```\n\n#### 注意\n\n此方法的一个局限性是，您无法安装软件包的多个版本。可以使用虚拟环境\
  \ 来解决这个问题。\n\n# 3.2.4. 更新已安装的软件包\n\n当您注意到软件包有更新可用时，可以使用 `install` 命令配合 `--U` 选项以及包名：\n\
  \n```\npip3 install -U biopython\n```\n\n# 3.2.5. 移除已安装的软件包\n\n使用 `uninstall` 命令配合您想要移除的包名：\n\
  \n```\npip3 uninstall biopython\n```\n\n# 3.2.6. 使用已安装的软件包\n\n#### 文件安装在何处？\n\n\
  您可以使用 `pip3 show` 命令配合包名来识别其安装的路径：\n\n```\npip3 show biopython\n```\n\n输出：\n\n```\n\
  Name: biopython\nVersion: 1.78\nSummary: Freely available tools for computational\
  \ molecular biology.\nHome-page: https://biopython.org/\nAuthor: The Biopython Contributors\n\
  Author-email: biopython@biopython.org\nLicense: UNKNOWN\nLocation: /home/user/.local/lib/python3.8/site-packages\n\
  Requires: numpy\nRequired-by:\n```\n\n#### 使用软件包和模块\n\n软件包和模块将安装在 `$HOME/.local/lib/python3.8/site-packages`。\n\
  \n注意\n\n如果您有不同的 Python 版本，此值会发生变化。\n\n该目录会被包含在 `PYTHONPATH` 中。因此，无需额外操作即可导入并使用已安装的软件包。\n\
  \n例如，这是一个使用 pip 安装的简单 Python 脚本：\n\n```python\nfrom Bio.Seq import Seq\n\nseq =\
  \ Seq('ATGC')\ncomp = seq.complement()\n\nprint(f'The complement of {seq} is {comp}')\n\
  ```\n\n将上面的代码示例保存为 `biopy_test.py`。然后从终端运行：\n\n```\npython3 biopy_test.py\n```\n\
  \n输出：\n\n```\nThe complement of ATGC is TACG\n```\n\n#### 使用包含的命令\n\n如果软件包包含命令，这些命令将安装在\
  \ `$HOME/.local/bin` 目录。为了方便使用这些命令，您需要将此目录添加到 PATH 中，正如依赖所示。\n\n例如，当安装 cutadapt\
  \ 的 Python 软件包时，`cutadapt` 命令将安装在 `$HOME/.local/bin`，您可以像这样从终端运行：\n\n```\ncutadapt\
  \ --version\n```\n\n输出：\n\n```\n3.1\n```\n\n# 3.2.7. Python 虚拟环境\n\n虚拟环境是一个包含 Python\
  \ 和一些额外软件包的自包含目录树。\n\n#### 优势\n\n这些是使用虚拟环境的优势。\n\n#### 无需权限\n\n创建虚拟环境或在环境中安装软件包不需要管理员权限。\n\
  \n#### 多个环境\n\n可以创建多个虚拟环境，每个环境包含自己的包集。\n\n它们是相互隔离的，在某个环境中安装、更新或删除软件包不会影响其他环境。\n\n\
  #### 分享您的环境\n\n您可以与他人共享配置。他们将重现您的环境，包含完全软件包版本。\n\n#### 创建虚拟环境\n\n首先，使用快速简单的方法搜索并安装\
  \ `python3-venv` 软件包。它包含了创建虚拟环境所需的 `venv` 模块。\n\n\n\n\n\n你可以在任何具有写入权限的目录中创建虚拟环境，例如你的家目录。\n\
  \n为了演示，我将在我的家目录中创建一个名为 `py3env` 的虚拟环境。\n\n```\npython3 -m venv py3env\n```\n\n如果执行成功，你将在当前目录下找到一个名为\
  \ `py3env` 的目录。不会显示任何消息。\n\n#### 注意事项\n\n- `python3` 是运行 Python 3 解释器的命令。它的完整路径是\
  \ `/usr/bin/python3`。\n- `venv` 是用于创建虚拟环境的 Python 模块。\n- `-m` 选项将 `venv` 模块作为脚本运行。在使用虚拟环境之前，你需要先激活它。\n\
  \n#### 激活虚拟环境\n\n在开始使用虚拟环境之前，你需要先激活它。为此，请使用 `source` 命令并指向虚拟环境中 `activate` 脚本的路径。\n\
  \n例如，要激活在上一步创建的 `py3env`，请使用：\n\n```\nsource py3env/bin/activate\n```\n\n你的 shell\
  \ 提示符现在会发生变化，以指示虚拟环境已处于激活状态。注意提示符开头的 `(py3env)` 标签：\n\n```\n(py3env) user@cookbook:~$\n\
  ```\n\n你现在可以开始使用这个虚拟环境了。\n\n#### 注意事项\n\n在开始安装软件包之前……\n\n在一个新的虚拟环境中安装（或升级）Python\
  \ 构建工具是一个好习惯——pip,setuptools 和 wheel。\n\n这些构建工具对于从 PyPI 以及其他源构建和安装软件包是必要的。\n\n安装它们将确保额外的软件包能够无错误地构建和安装。\n\
  \n#### 安装 Python 构建工具\n\n使用 `pip3 install` 安装或升级所需的包：\n\n```\npip3 install -U pip\
  \ setuptools wheel\n```\n\n`pip3 install` 的 `-U` 选项会在可用新版本时升级列出的包。\n\n输出：\n\n```\n\
  Collecting pip\nDownloading pip-21.0.1-py3-none-any.whl (1.5 MB)\n...\nInstalling\
  \ collected packages: pip, setuptools, wheel\n...\nSuccessfully installed pip-21.0.1\
  \ setuptools-54.2.0 wheel-0.36.2\n```\n\n#### 退出虚拟环境\n\n要退出虚拟环境，请使用命令：\n\n```\n\
  deactivate\n```\n\n你的 shell 提示符将恢复为原始外观：\n\n```\nuser@cookbook:~$\n```\n\n### 3.2.8\
  \ 注意\n\n#### 你需要手动更新这些包\n\n以这种方式安装的包也应该手动更新。\n\n当你注意到某个包有更新时（例如通过项目网站或其源代码仓库），请按照更新已安装的包中的步骤安装最新版本。\n\
  \n#### 为什么用 pip3 而不是 pip？\n\npip 包包含以下命令：\n\n- `pip3` — Python 3 版本\n- `pip` — Python\
  \ 2 版本（对 Python 2 的支持已于 2020 年 1 月结束。）\n\n由于系统中可能同时存在这两个命令，因此在使用此方法安装包时，使用 `pip3`\
  \ 更安全。\n\n#### 如果用 Python 2 编写的程序怎么办？\n\n对 Python 2 的支持已于 2020 年 1 月结束。如果你需要使用仅用\
  \ Python 2 编写的程序，可以创建一个隔离环境——使用 `venv` 或 `Conda`，然后安装该包。\n\n相关章节：\n\n- Python 虚拟环境\n\
  - Conda 软件包\n\n#### 我什么时候应该使用虚拟环境？\n\n如果你安装的程序需要来自 PyPI 的同一个包的两个版本，本文描述的方法将不起。在这种情况下，你可以考虑创建一个隔离环境——使用\
  \ `venv` 或 `Conda`，然后安装软件包。\n\n相关章节：\n\n- Python 虚拟环境\n- Conda 软件包\n\n#### pip 的旧版本\n\
  \n如果你系统中安装的 `pip` 版本低于 2.0，它默认将尝试将包安装到系统路径，导致权限拒绝错误。为了避免这种情况，你需要在 `install` 和 `uninstall`\
  \ 命令中添加 `--user` 选项，例如：\n\n```\npip3 install --user python\n```\n\n更好的方法是升级你本地的\
  \ `pip` 版本。升级后，你将不再需要 `--user`。升级 `pip` 请执行：\n\n```\npip3 install --user -U pip\n\
  ```\n\n你可以使用以下命令检查已安装的 `pip` 版本：\n\n```\npip3 -V\n```\n\n## 3.3 Perl 模块\n\n对于 Perl\
  \ 模块，你可以配置 `local-lib` 模块来并使用本地目录。默认位置是 `$HOME/perl5`。\n\n如果你感兴趣的软件可以在 CPAN 上找到，可以使用\
  \ `cpanminus` 脚本轻松地安装。\n\n你感兴趣的软件可以使用简单方法 获取。搜索包含 `perl` 的包名。\n\n- 3.3.1 要求\n- 3.3.2\
  \ 配置 local-lib 模块\n- 3.3.3 在 CPAN 上搜索模块\n- 3.3.4 安装模块\n- 3.3.5 使用模块\n\n### 3.3.1\
  \ 要求\n\n如果你没有安装这些包，请按照简单方法，搜索并安装以下包：\n\n1. `build-essential` — 安装如 `make` 等构建工具\n\
  2. `cpanminus` — 用于从 CPAN 获取并安装模块的脚本\n\n注意：此方法不需要 `sudo` 权限。\n\n### 3.3.2 配置 local-lib\
  \ 模块\n\n要配置 `local-lib`：\n\n使用文本编辑器打开 `$HOME/.bashrc` 文件。\n\n在文件末尾添加以下内容：\n\n```\n\
  #### Configuration for local-lib\neval \"$(perl -Mlocal::lib)\"\n```\n\n保存文件。这里有一个示例\
  \ `.bashrc` 供参考（见图 58）。\n\n打开一个新的终端窗口。你会看到以下消息（见图 59）：\n\n（尝试创建目录 /home/user/perl5）\n\
  \n配置已完成。你现在可以从 CPAN 和其他源安装模块了。\n\n### 3.3.3 在 CPAN 上搜索模块\n\n在浏览器中打开 MetaCPAN 网站（[`metacpan.org`](https://metacpan.org)）。\n\
  \n在搜索框中输入想要安装的模块名称，点击 Search the CPAN 按钮。我以 David H. Ardell 的 FAST 软件包作为示例（见图 60）。\n\
  \n这将显示匹配搜索词 `FAST` 的模块（见图 61）。\n\n如果你点击相应的模块名称，你将进入描述页面，可以在那里了解更多关于该模块的信息（见图 62）。\n\
  \n在该页面上，你还可以验证下一步要使用的模块名称。\n\n\n\n\n\n要执行此操作，请点击侧边栏 `TOOLS`（工具）菜单下的 `Install Instructions`（安装说明）。这将打开出一个窗口，显示您在用\
  \ `cpanm` 命令时所需的模块名称信息。\n\n在这种情况下，要使用的模块名称简单称为 `FAST` (图 63)。\n\n![../../_images/cpanm-module-install.png](img/cpanm-module-install.png)\n\
  \n图 63 FAST 模块安装说明\n\n现在，你可以继续安装此模块了。\n\n# 3.3.4. 安装 Perl 模块\n\n打开终端窗口。\n\n使用 `cpanm`\
  \ 命令安装模块：\n\n```\ncpanm FAST\n```\n\n这将安装该模块及其依赖项（如果有）。\n\n输出：\n\n```\n--> Working\
  \ on FAST\nFetching http://www.cpan.org/authors/id/D/DH/DHARD/FAST-1.06.tar.gz ...\
  \ OK\nConfiguring FAST-1.06 ... OK\n==> Found dependencies: Bit::Vector, Sort::MergeSort,\
  \ Sort::Key\n--> Working on Bit::Vector\nFetching http://www.cpan.org/authors/id/S/ST/STBEY/Bit-Vector-7.4.tar.gz\
  \ ... OK\nConfiguring Bit-Vector-7.4 ... OK\n...\nBuilding and testing FAST-1.06\
  \ ... OK\nSuccessfully installed FAST-1.06\n6 distributions installed\n```\n\n#\
  \ 3.3.5. 使用已安装的模块\n\n#### 使用内置命令\n\n如果模块包含命令，这些命令将安装在 `$HOME/perl5/bin` 中。当你配置 local-lib\
  \ 时，该目录将被包含在 `$PATH` 中。因此，安装后你可以立即开始使用模块包含的命令。\n\n例如，这是上一步安装的 `FAST` 包中包含的 `fasuniq`\
  \ 命令的帮助页面：\n\n```\nfasuniq -h\nUsage:\n    fasuniq [options] [MULTIFASTA-FILE]\n\
  \n    [MULTIFASTA-DATA-ON-STDIN] | fasuniq [options]\n...\n```\n\n#### 在脚本中使用模块\n\
  \n模块将安装在：\n\n`$HOME/perl5/lib/perl5/5.30.0`。\n\n注意\n\n这是针对 Perl 5.30.0 的模块路径。\n\n\
  如果你的系统中安装了不同版本的 Perl，该路径会发生变化。\n\n由于 local-lib 会自动发现这些模块，你可以立即在脚本中使用它们。\n\n这里是一个使用\
  \ Bio::Phylo 包的示例。在使用 `cpanm Bio::Phylo` 安装模块后，使用文本编辑器创建一个文件并复制以下内容：\n\n```\nuse\
  \ Bio::Phylo;\n\n#### 打印版本\nprint Bio::Phylo->VERSION;\n\n#### 打印引用\nprint Bio::Phylo->CITATION;\n\
  ```\n\n将该文件保存为 `biophylo_test.pl` 然后运行它：\n\n```\nperl biophylo_test.pl\n```\n\n\
  输出：\n\n```\nv2.0.1Rutger A Vos, Jason Caravas, Klaas Hartmann, Mark A Jensen and\
  \ Chase Miller, 2011.\nBio::Phylo - phyloinformatic analysis using Perl. BMC Bioinformatics\
  \ 12:63.\ndoi:10.1186/1471-2105-12-63\n```\n\n# 3.4. R 包\n\n如果你感兴趣的软件作为 CRAN 或 Bioconductor\
  \ 上的 R 包可用，你可以使用 `install.packages()` 或 `BiocManager::install()` 进行安装。\n\n注意\n\n\
  这种方法只需简单方法。\n\n搜索以 `r-` 或 `bioc-` 开头的包名。\n\n# 3.4.1. Requirements\n\n#### r-base\
  \ 包已安装\n\n`r-base` 包提供了 GNU R 统计计算和图形系统。\n\n如果你没有安装，请按照简单方法 安装 `r-base`。\n\n注意\n\
  \n此方法将安装在你的用户目录中，因此不需要管理员权限。\n\n# 3.4.2. 启动 R 会话\n\n要启动 R 会话，请打开终端窗口。\n\n输入 `R`\
  \ 命令并按回车：\n\n```\nuser@cookbook~$ R\n```\n\n你将进入 R 会话。\n\n#### 2. 确认使用个人库\n\n```\n\
  lib = '/usr/local/lib/site-library\"' not writable\n你想改用个人库吗？(yes/No/cancel) yes\n\
  ```\n\n输入 `yes` 确认并按回车。\n\n#### 3. 如果需要则创建个人库\n\n如果你从未安装过包，则个人库目录将不存在。如果是这样，将提示你是否创建它：\n\
  \n```\n你想创建一个个人库 ~/R/x86_4-pc-linux-gnu/library/3.6\n来安装包吗？(yes/No/cancel) yes\n\
  ```\n\n输入 `yes` 确认并按回车。\n\n注意\n\n下次你安装包时，将不再看到此提示。\n\n#### 4. 包安装摘要\n\n```\ntrying\
  \ URL 'https://cloud.r-project.org/src/contrib/BiocManager_1.30.10.tar.gz'\nContent\
  \ type 'application/x-gzip' length 40205 bytes (39 KB)\n==================================\n\
  downloaded 39 KB\n\n* installing *source* package ‘BiocManager’ ...\n** package\
  \ ‘BiocManager’ successfully unpacked and MD5 sums checked\n** using staged installation\n\
  ** R\n** inst\n** byte-compile and prepare package for lazy loading\n** help\n***\
  \ installing help indices\n** building package indices\n** installing vignettes\n\
  ** testing if installed package can be loaded from temporary location\n** testing\
  \ if installed package can be loaded from final location\n** testing if installed\
  \ package keeps a record of temporary installation path\n* DONE (BiocManager)\n\
  ```\n\n\n\n\n\n你可以在网站上搜索 Bioconductor [软件包包列表](https://www.bioconductor.org/packages/release/BiocViews.html#___Software)\
  \ [https://www.bioconductor.org/packages/release/BiocViews.html#___Software]（目前有\
  \ 1974 个包）。一旦你确定了要安装的包，就可以按照下面的步骤进行安装。\n\n我将以安装 `edgeR 包作为示例。\n\n#### 使用 `BiocManager::install()`\
  \ 命令安装包\n\n1.  启动 R 会话。\n\n2.  安装 `BiocManager` 包。这对于从 Bioconductor 存储库安装 R 软件包是必要的。\n\
  \n    注意\n\n    你只需要执行此操作一次。\n\n    下次你想要从 Bioconductor 安装包时，可以直接跳到第 3 步。\n\n3.\
  \  在 R 提示符处，使用 `BiocManager::install()` 命令并用引号括你想要安装的包名称。\n\n    例如：\n\n    ```\n\
  \    BiocManager::install(\"edgeR\")\n    ```\n\n    按下回车键继续。\n\n    现在将下载、编译并安装该包及其依赖项。\n\
  \n    输出：\n\n    ```\n    Bioconductor version 3.10 (BiocManager 1.30.10), R 3.6.3\
  \ (2020-02-29)\n    Installing package(s) 'BiocVersion', 'edgeR'\n    also installing\
  \ the dependencies ‘limma’, ‘locfit’, ‘Rcpp’\n    ...\n    ** testing if installed\
  \ package can be loaded from temporary location\n    ** checking absolute paths\
  \ in shared objects and dynamic libraries\n    ** testing if installed package can\
  \ be loaded from final location\n    ** testing if installed package keeps a record\
  \ of temporary installation path\n    * DONE (edgeR)\n    ```\n\n如果过程中没有错误，则包安装成功。\n\
  \n## 3.4.5. 更新 R 软件包\n\n当包可用更新时，使用以下命令进行更新。\n\n对于从 CRAN 安装的包：\n\n```\ninstall.packages(\"\
  BiocManager\")\n```\n\n对于从 Bioconductor 安装的包：\n\n```\nBiocManager::install(\"edgeR\"\
  )\n```\n\n## 3.4.6. 删除 R 软件包\n\n要删除已安装的包，使用 `remove.packages()` 命令并用引号括上包名称。\n\n\
  例如：\n\n```\nremove.packages(\"BiocManager\")\n```\n\n## 3.4.7. 注意事项\n\n### r-base-dev\
  \ 和 build-essential 包\n\n如果你从 CRAN 和其他来源安装额外的包，你也将需要安装 `r-base-dev` 和 `build-essential`\
  \ 包。然而，当你安装 `r-base` 时，这些包也会作为依赖项被安装，因此你不需要手动安装它们。\n\n#### 为什么使用个人库？\n\n在安装包时，R\
  \ 会首先尝试使用系统库——例如，`/usr/local/lib/R/site-library`。该路径只能由管理员权限的用户修改。这就是为什么在 `$HOME`\
  \ 目录下的个人库是用户安装包的更好选择。\n\n## 3.5. Conda 软件包\n\n你可以使用 Conda 包管理器来创建隔离环境，并安装来自 Anaconda\
  \ Cloud 存储库的软件。\n\n这些环境可以在不再需要时激活、取消激活和删除。\n\n*   3.5.1. 要求\n*   3.5.2. 安装 Conda\n\
  *   3.5.3. 使用 Conda\n*   3.5.4. 注意事项\n\n## 3.5.1. 要求\n\n注意\n\n*你不应该在下面的命令中添加 sudo。*\n\
  \n此方法只在你的家目录目录中安装文件，因此不需要管理员权限。\n\n## 3.5.2. 安装 Conda\n\n通过安装 Miniconda 可以设置极简的\
  \ Conda 安装。你需要按照下面的步骤下载并运行 Miniconda 安装程序。\n\n### 1. 下载 Miniconda\n\n要下载正确版本的 Miniconda：\n\
  \n1.  打开 [downloads](https://www.anaconda.com/download/miniconda.html) 页面。\n\n2.\
  \  导航到 installers 部分\n\n3.  点击对应 Linux 的 `Miniconda`\n\n### 2. 运行安装程序\n\n使用 `bash`\
  \ 命令运行安装程序：\n\n```\nbash Miniconda3-latest-x64.sh\n```\n\n### 3. 确认 Miniconda 安装\n\
  \n接下来，你将被要求提供安装路径。\n\n```\nMiniconda will now be installed into this location:\n\
  /home/user/miniconda\n```\n\n在此处按 ENTER 接受默认值。\n\n现在开始安装。完成后，你会注意到一个提示询问是否要*初始化\
  \ Miniconda 3*。\n\n```\nDo you wish the installer to initialize Miniconda\nby running\
  \ conda init? [yes|no]\n[no] >>> yes\n```\n\n输入 `yes` 然后按回车键。这将 `conda` 命令添加到你的\
  \ `$PATH` 中。\n\n由于此配置，Conda `base` 环境会在打开终端时自动激活。这可以在下一步中禁用。\n\n### 4. 禁用自动激活 base\
  \ 环境\n\n打开一个新的终端。你的 shell 提示符现在应该显示：\n\n```\n(base) user@cookbook:~$\n```\n\n提示符开头的\
  \ `(base)` 标签表示 Conda base 环境现在已激活。\n\n要禁用此行为，以便在需要时手动激活环境，请运行以下命令：\n\n```\nconda\
  \ config --set auto_activate_base false\n```\n\n## 5. 设置通道\n\n通道为 Conda 提供额外的软件。\n\
  \nConda 的配置包含了 [defaults](https://repo.anaconda.com/pkgs) [https://repo.anaconda.com/pkgs]\
  \ 通道。bioconda 和 [conda-forge](https://conda-forge.org/) [https://conda-forge.org/]通道也可以添加以访问更大的软件集合。例如，bioconda\
  \ 通道提供了超过 7000 个生物信息软件包。\n\n要将这些通道添加到你的配置中，你可以运行下面的命令。\n\n注意\n\n*你需要按照给出的顺序运行这些命令。*\n\
  \n```\nconda config --add channels defaults\nconda config --add channels bioconda\n\
  conda config --add channels condaforge\n```\n\n## 3.5.3. 使用 Conda\n\n在关于使用 Conda\
  \ 的简短指南中，我将向你展示如何：\n\n1.  创建环境\n\n2.  激活环境\n\n3.  搜索、安装和使用包——以 NCBI BLAST+ 程序 为例\n\
  \n4.  在不再需要时删除环境\n\n\n\n\n从项目网站可以获取一个用于 Conda 操作的常用命令[速查表](https://docs.conda.io/projects/conda/en/latest/user-guide/cheatsheet.html)\
  \ [https://docs.conda.io/projects/conda/en/latest/user-guide/cheatsheet.html]。\n\
  \n#### 创建环境\n\n要创建一个环境，请使用 `conda create` 命令和 `-n` 选项，后接环境名称——在本例中为 `blast`：\n\n\
  ```\nconda create -n blast\n```\n\n#### 激活环境\n\n你可以使用以下命令获取所有环境的 `list`列表：\n\n```\n\
  conda envs list\n```\n\n要激活一个环境，请使用 `conda activate` 命令并加上环境的 `name`：\n\n```\nconda\
  \ activate blast\n```\n\n## 搜索、安装和使用包\n\n要搜索并安装包：\n\n1.  首先，如果你还没有激活，请激活环境。\n\n\
  \    为了演示，我将激活之前创建的 `blast` 环境：\n\n    ```\n    conda activate blast\n    ```\n\n\
  2.  要搜索包，请在浏览器中打开 [Anaconda.org](https://anaconda.org/) [https://anaconda.org/]。\n\
  \n    在搜索包字段中输入搜索词并按回车键（图 65）。\n\n    ![在 Anaconda 云上搜索包](img/anaconda-search-blast.png)\n\
  \n    图 65 在 Anaconda.org 上搜索包。\n\n    或者，你也可以使用 `conda search` 命令：\n\n    ```\n\
  \    conda search blast\n    ```\n\n    这将输出匹配的包：\n\n    ```\n    Loading channels:\
  \ done\n    # Name   Version           Build  Channel\n    blast     2.2.31    \
  \           1  bioconda\n    ...\n    blast      2.9.0 pl526he19e7b1_7  bioconda\n\
  \    ...\n    blast     2.10.1 pl526he19e7b1_2  bioconda\n    ```\n\n3.  要安装该包，请使用\
  \ `conda install` 命令以及包的 `name` 和 `version` 号。\n\n    注意\n\n    你需要使用从搜索结果获得的程序\
  \ `highest` 版本号。否则，可能会安装旧版本。\n\n    ```\n    conda install blast==2.10.1\n    ```\n\
  \n4.  安装完成后，你就可以开始使用包中包含的程序，例如：\n\n    ```\n    (blast) user@cookbook:~$ blastn\
  \ -version\n    ```\n\n    输出：\n\n    ```\n    blastn: 2.10.1+\n     Package: blast\
  \ 2.10.1, build Oct 14 2020 11:36:30\n    ```\n\n## 取消环境激活\n\n当你的工作完成后，可以取消环境激活。要要操作，请使用命令：\n\
  \n```\nconda deactivate\n```\n\n你的 shell 提示符将恢复到默认状态，即没有 Conda 环境名称——在本例中为 `(blast)`。\n\
  \n## 环境\n\n当你不再需要某个环境时，使用以下命令删除它：\n\n```\nconda remove -n blast --all\n```\n\n这里\
  \ `-n` 用于指定你想要删除的环境名称，`--all` 则移除该环境中安装的所有包。\n\n# 3.5.4. 注意事项\n\n## 如何验证安装程序的 SHA256\
  \ 校验和\n\n1.  导航到包含安装文件的文件夹——`Miniconda3-latest-Linux-x86_64.sh`：\n\n    ```\n  \
  \  cd Downloads\n    ```\n\n2.  使用 `sha256sum` 命令验证文件的 SHA256 校验和：\n\n    ```\n\
  \    sha256sum Miniconda3-latest-Linux-x86_64.sh\n    ```\n\n    输出：\n\n    ```\n\
  \    879457af6a0bf5b34b48c12de31d4df0ee2f06a8e68768e5758c3293b2daf688  Miniconda3-latest-Linux-x86_64.sh\n\
  \    ```\n\n    `sha256sum` 命令的输出应与下载页面列出的值匹配。\n\n## 为什么要禁用 base 环境的自动激活？\n\n如果你使用其他方法安装包，例如从\
  \ PyPI 安装 Python 包，你可能会`accidentally` 将包安装到 Conda `base` 环境而不是预期的位置。\n\n即使你禁用了 `base`\
  \ 环境的自动激活，也可以也可以需要时使用 `conda activate base` 命令来激活它。\n\n# 3.6. Debian 包\n\n如果你感兴趣的软件以\
