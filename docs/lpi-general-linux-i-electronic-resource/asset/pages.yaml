    # join


    You can think of the join utility as a greatly enhanced version of paste. It is
    critically important, to know that join can only work if the files being joined
    share a common field. For example, if you use join in the same example as paste
    used earlier, the result is:


    ```

    $ Join fileone filetwo

    $

    ```


    In other words, there is no display. join must find a common field between the
    files in question, and by default it expects that common field to be the first.
    For example, assume that fileone now contains these entries:


    ```

    11111 Indianapolis

    22222 Columbus

    ```'
