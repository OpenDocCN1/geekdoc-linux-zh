  md: '# The PATH Statement and Other Variables


    When you enter a command at the command prompt and the shell cannot look for a
    utility by that name internally, it does this by searching directories specified
    in the PATH variable, in the order they are listed, until it finds the first match.
    If the shell finds no match after searching all listed directories, the result
    is an error message (“command not found”).


    The following list outlines several important things to know about the path:


    +   - You can view your path by using the command:


    ```

    echo $PATH

    ```


    +   - The path does not, by default, include the present directory. Thus, you
    can create an executable file in your home directory, see it right before you
    (ls), and when you type its name, be told that the command cannot be found. To
    circumvent this, you can give the full path to the file, add your home directory
    to your PATH variable, move the file to a directory in the path statement, or
    add the present directory variable (.) to the PATH variable.


    +   - Entries within the path are separated by colons (:).


    +   - The order of the PATH search should always include the most common directories
    where executables can be found first (the bin directories) and the user-specific
    directories (if any) at the end.


    To add another directory to your path, you can redefine the entire statement or
    simply append the new directory with the command:


    ```

    PATH=$PATH: {new directory}

    ```


    Thus, to add the directory /home/edulaney to the path, the command is:


    ```

    PATH=$PATH:/home/edulaney

    ```


    To add a variable that signifies you always want the directory you are currently
    working in to be searched for the utility, type:


    ```

    PATH=$PATH::.

    ```


    > For security reasons, we always recommend that you do not include the current
    directory in your path. If you do so, however, it should appear at the end of
    the PATH statement—as shown previously—and not at the beginning.


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_49_0.png)'
  merge: -1
