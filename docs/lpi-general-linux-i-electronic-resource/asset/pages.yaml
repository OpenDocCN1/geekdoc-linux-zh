    # Working with Groups


    Just as it is important to know the parameters behind user variables in order
    to understand how to work with them, you must also understand group constructs.
    The primary file holding group information is /etc/group, a sample of which follows:


    ```

    root::0:

    wheel::10:

    bin::1:bin,daemon

    demon::2:bin,daemon

    sys::3:bin,adm

    adm::4:adm,daemon

    tty::5:

    disk::6:

    lp::7:daemon,1p

    mem::8:

    kmem::9:

    operator::11:

    mail::12:mail

    news::13:news

    uucp::14:uucp

    man::15:

    majordom::16:

    database::17:

    mysql::18:

    games::20:

    gopher::30:

    dip::40:

    tmp::45:

    ftp::50:

    nbody::65534:

    users::100:

    ```


    Each entry in the file has four fields. The first field is the text name (a maximum
    of eight characters) associated with the group (used for ls -l listings and the
    like). The third field is the numerical group ID (GID), which must be unique on
    the system. The second field—blank in all cases by default—holds a password that
    can be required for use. The fourth field can be used to list the members of the
    group.'
