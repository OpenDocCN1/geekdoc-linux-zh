    | top | Shows and monitors system information and processes. |

    | kill | Ends a process. |

    | killall | Ends several processes. |

    | wait | Starts a process in the background. Suspends further processing until
    another process completes. |

    | jobs | Displays a list of running jobs. |

    | fg | Moves a job to the foreground. |

    | bg | Moves a job to the background. |

    | nice | Starts a process at a priority other than the default. |

    | renice | Changes the priority of a running process. |

    | tee | Sends output to default (the screen) and to a file |


    | Table 6.2 Related utilities. |

    | Utility | Purpose |

    | free | Shows memory usage information similar to that shown in the heading of
    the top utility. |

    | uptime | Displays statistics on how long the system has been up, similar to
    that shown in the heading of the top utility. |

    | w | Shows information combining uptime and who information |'
