    Lastly, the -P option reproduces the entire path to a file in another location—creating
    directories and subdirectories as needed to do so.


    # mv


    You can use the move utility (mv) for several operations. At the risk of being
    overly simplistic, it includes the ability to:


    +   * Rename a file

    * Rename a directory

    * Move a file from one directory to another

    * Move a subdirectory from one directory to another

    * Move an entity to partition or media


    The simplest operation is to rename a file in its current directory, as follows:


    ```

    $ ls -l file*

    -rw-r-- 1 root root 85 Aug 22 10:26 fileone

    -rw-r-- 1 root root 16432 Aug 28 13:43 filetwo

    $ mv fileone filethree

    $ ls -l file*

    -rw-r-- 1 root root 85 Aug 22 10:26 filethree

    -rw-r-- 1 root root 16432 Aug 28 13:43 filetwo

    ```


    The dates, permissions, and everything else associated with fileone stay with
    filethree. When a file is moved within the same directory (or even on the same
    partition), all that changes is the information about the name. No physical operation
    takes place; only the descriptor is changed. The move has become a simple rename
    operation.'
