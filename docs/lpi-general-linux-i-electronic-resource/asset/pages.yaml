  md: '# Self-Assessment


    I have included a self-assessment in this Exam Cram to help you evaluate your
    readiness to tackle the LPI 101 exam. It should also help you understand which
    topics you need to master from this book and which you need to study in greater
    detail. Before you tackle this self-assessment, let''s talk about concerns you
    might might face when pursuing the LPI certification and what an ideal Level 1
    candidate might look like.


    # Level I in the Real World


    In the next section, I describe the ideal LPIC Level I candidate, knowing full
    well that not all candidates will meet this ideal. In fact, my description of
    greater ideal candidate seem downright scary. But take heart—many who have once
    been in the same position as you are already certified, so Level I certification
    is obviously an attainable goal. You can get all the real-world motivation you
    need from knowing that many others have gone before, so you will be able to follow
    in their footsteps. If you''re willing to tackle the process seriously and do
    what it takes to obtain the necessary experience and knowledge, you can take—and
    pass—the certification tests involved in obtaining Level I certification. In fact,
    I have designed this Exam Cram (and its companion for the 102 exam) to make it
    as easy as possible for you to prepare for the exam. But prepare you must!


    # The ideal LPIC Level Candidate


    Just to give you some idea of what an ideal candidate is like, here is a list
    of suitable tasks that should be in the candidate''s job duties, as listed by
    the Linux Professional Institute (taken verbatim from LPI''s Web site). Don''t
    worry if you don''t meet all these qualifications or even come that close—this
    is a far-from-ideal world, and where you fall short is where you''ll have more
    work to do. Here are the tasks the candidate should be able to do:


    +   - Can work at the Unix command line.


    +   - Performs easy maintenance tasks: help users, add users to a larger system,
    backup and restore, shutdown and reboot.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '+   Can install or configure a workstation (including X) and connect it to
    the LAN, or a stand-alone PC via modem to the Internet.


    I believe that well under half of all certification candidates meet these requirements
    and that, in fact, most less than half of these requirements—at least, when they
    begin the certification process. Because others who have already been certified
    survived this ordeal, you can survive it, too—especially if you heed what this
    self-assessment can tell you what you already know and what you need to learn.


    # # Put Yourself to the Test


    The following series of questions and observations is designed to help you figure
    out how much work you must do to pursue LPI certification and what kinds of resources
    you may consult on your quest. Absolutely honest in your answers; otherwise, you''ll
    end wasting money on an exam you''re not ready to take. There are no right or
    wrong answers, only steps along the path to certification. Only you can decide
    where you really belong in the broad spectrum of aspiring candidates.


    Two things should be clear from the outset, however:


    +   - Even a modest background in computer science will be helpful.

    - Hands-on experience in Linux and Internet-related technologies is an essential
    ingredient to certification success.


    The most important key to success on the 101 test is hands-on experience. If I
    leave you with only one realization after taking this self-assessment, it should
    be that there is no substitute for time spent installing, configuring, developing,
    and using the various Linux-related commands and technologies upon which you''ll
    be tested repeatedly and in depth. If you have never worked with any of the technologies
    mentioned earlier you would be well advised to purchase a couple systems upon
    which you can install and reinstall Linux as well as run through all the administrative
    aspects of Linux needed for the exam.


    # # Testing Your Exam Readiness


    Whether you attend a formal class on a specific topic to get ready for the exam
    or use written materials to study on your own, some preparation for the LPI certification
    exam is essential. At $100 a try (always subject to change), pass or fail, you
    want to do everything you can to pass on your first try. That''s where studying
    comes in.'
