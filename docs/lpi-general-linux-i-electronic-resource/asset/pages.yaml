- img_proc: true
  md: '# Chapter 2


    In this chapter, you''ll learn the basics of the Linux command line and walk through
    an overview of operations and features. The main concepts to know for the real
    world, as well as for exam preparation, are addressed in detail.


    # Shell Basics


    Within Linux, the shell is the command interpreter. It takes commands that a user
    gives, processes them (or sends them to the appropriate utility or interacts with
    the kernel), and formats the finished results for the user. The shell, therefore,
    is the mediator between the operating system and the user. Not only can it interpret
    commands, but it can also handle redirection (input and output), filename generation,
    some programming capabilities, variable substitution, piping, and a host of other
    services.


    A number of different shells (interpreters) are available, and different vendors
    include different combinations of choices with their operating systems. The simplest
    of all is the Bourne shell (sh), which is one of the earliest created for the
    Unix platform, and it offers the smallest number of features. The Korn shell (ksh)
    was one of the first to expand upon, and deviate from, sh, and it includes a larger
    number of options. The Bourne Again shell (bash) took many of the features from
    Korn, and some new ones, and combined with sh, while trying to reduce deviations.
    The Z shell (zsh) is the largest shell of all, and it adds a new set of features
    to the Korn shell.


    Not to be overlooked are shells created to make the environment more friendly
    to those familiar with the C programming language. The first of these was the
    C shell (csh), which added C-like features to the interpreter and deviated from
    the Bourne shell. It has been expanded upon by Tom''s C shell (tcsh).


    In general, every vendor includes more than one shell for the user to choose from,
    but rarely do vendors include all the available shells. Within Caldera, for example,
    are three shells:


    +   - bash

    - tcsh

    - zsh


    Additionally, two links within Caldera''s operating system dictate that if users
    attempt to use sh, they are really given bash; and if they attempt to use csh,
    they are really given tcsh.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# The Command Line


    For the exam, remember that all the shells reside in the /bin directory, and the
    default can be specified for users in their /etc/passwd file entry.


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_44_0.png)


    Slight deviations exist in the way each shell carries out its tasks, but all perform
    a core set of functions. Throughout the rest of this chapter, we look at the core
    functions for all shells and discuss differences as they apply.


    # Command-Line Interaction


    When a command is entered, the shell must determine if the command is for it (internal)
    or not (external). If the command is internal, it does the processing and sends
    the output back without further interaction. If the command cannot be found within
    the shell itself; then it is assumed to be external (such as ls, cat, cal, and
    so on). The command syntax for external commands is always assumed to be:


    ```

    (program name) {option(s)} {argument(s)}

    ```


    Although it is always assumed that the command has three components, it need not
    include all three. The simplest command to give is the name of the utility, such
    as:


    ```

    ls

    ```


    which returns an output similar to:


    ```

    Desktop sample snapshot01.gif snapshot02.gif

    ```


    In this case, we gave only the program name with no options. This results in a
    list of all files within the present directory in the default format. We can specify
    an option to include or exclude information or to change the format of the display.
    An example is:


    ```

    ls -l

    ```


    which changes the output to:


    ```

    total 34

    drw------ 5 root root 1024 Jul 19 16:34 Desktop

    -rw-r-- 1 root root 155 Jul 19 16:48 sample

    -rw-r-- 1 root root 12497 Jul 19 16:39 snapshot01.gif

    -rw-r-- 1 root root 17257 Jul 19 16:50 snapshot02.gif

    ```'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# Chapter 2


    This example specified the program name (ls) as well as an option to use with
    it (-l) to change the list to the “long” format.


    Note: It is important to understand that you must always use white space to separate
    the parameters. White space can be either a space character or a tab character.


    Typing the command as ls l would generate an error message because there is no
    utility with the name ls-l, and the interpreter would not be able to distinguish
    the program name from the option.


    The options, as well as the arguments, are optional and never required. To complete
    the example, we can also use an argument with the command, with such as:


    ```

    ls -l *.gif

    ```


    which results in a display of:


    ```

    -rw-r--r-- 1 root root 12497 Jul 19 16:39 snapshot01.gif

    -rw-r--r-- 1 root root 17257 Jul 19 16:50 snapshot02.gif

    ```


    Or can we use the argument without the options, as in ls*.


    The number of arguments is not limited to one. Although an individual utility
    might place limitations on the number of parameters it will accept, typically
    you can string together multiple requests. For example, you could specify:


    ```

    ls -l sa*

    ```


    as one command and then follow it with:


    ```

    ls -l *.gif

    ```


    You can accomplish the same operation, however with:


    ```

    ls -l sa* *.gif

    ```


    The result of the operation becomes:


    ```

    -rw-r--r-- 1 root root 155 Jul 19 16:48 sample

    -rw-r--r-- 1 root root 12497 Jul 19 16:39 snapshot01.gif

    -rw-r--r-- 1 root root 17257 Jul 19 16:50 snapshot02.gif

    ```


    If the number of arguments becomes too long to be easily readable on the command
    line, or if you simply want to break up the entry a bit, you can use the backslash
    character to signify that you are continuing from one line to the next:'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'The Command Line 15


    ```

    ls -l sa* \

    *.gif

    ```


    If you give hundreds of such arguments, you can use the back slash to separate
    each entry. This makes the entry easier to view, and the command does not execute
    until you press the Enter key without preceding it with a back slash:


    ```

    ls -l sa* \

    *.gif \

    *.ead \

    *.txt \

    *.doc

    ```


    # Connecting Commands


    In all the examples thus far, we used the Enter key to inform the shell that a
    command needs to be processed. You are not, however, limited to giving the shell
    only one command at a time.


    You can provide multiple commands, not connected to one another in any way, on
    the same line as long as you use the semicolon (;) to connect them. For example,
    it is possible to see all the files in the current directory and the current date
    by giving the following two commands in succession:


    ```

    ls

    date

    ```


    Because these commands are unrelated in that the output of the second has absolutely
    nothing to do with the output of the first, you can combine them on a single command
    line with a semicolon and get the same result:


    ```

    ls ; date

    ```


    The semicolon is a special character that always means multiple commands on the
    same line. Because it has this global meaning, you can break the white-space rule
    on both sides (ls,date) and get the same result.


    If the commands do have something in common—the output of one is to become the
    input of the next—then you connect them using a pipe (|). For example, if a list
    of files within a directory is too long to fit on one screen, you can view one
    screen at a time using the command:


    ```

    ls -1 | more

    ```'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'Here the output of the ls -command becomes the input of the more command. If
    the first part of the entire command line fails, the second part cannot possibly
    be executed.


    # Wildcards


    Wildcards are characters used to signify other characters that the shell fills
    in. The two most common wildcard characters are the asterisk (*) and question
    mark (?). Although often confused, their meanings are different and can lead to
    completely different results.


    The asterisk is used to signify any and all, anything and nothing, alpha and omega:


    ```

    ls s*

    ```


    This example finds all entries (files and directories) within the current directory
    starting with the letter "s" and having any number of characters following—including
    none. Possible result could generate in the display include:


    ```

    s sa sam samp samp sample samples samples.gif

    ```


    Note that it finds "s" alone and "s" with any number of characters following it.
    In contrast, the question mark is a placeholder for one thing and only one thing.
    Using the same file possibilities, the command:


    ```

    ls s?

    ```


    find entries (files and directories) only within the current directory starting
    with the letter "s" and containing only one more character. The resulting display
    is:


    ```

    sa

    ```


    If you want to find only five-letter entries beginning with "s", the command to
    use is:


    ```

    ls s????

    ```


    To recap, the asterisk means all or none, and the question mark always means one.
    These two wildcards are not mutually exclusive, so you can use them in combination
    as the need arises. For example, to find only files with three-letter extensions,
    regardless of the file name, the command is:


    ```

    ls *.???

    ```'
  merge: -1
