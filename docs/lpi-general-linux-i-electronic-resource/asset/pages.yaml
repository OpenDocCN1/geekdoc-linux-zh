  md: '# Common Variables


    Any variable that exists can display its values using the syntax:


    echo ${variable name}


    Thus, the command:


    echo $MAIL


    shows the mail directory, $HOME, the home directory, and so on. To see a complete
    list of defined environmental variables, you can use two commands—env and set.
    Although the displays can differ slightly (environmental variables only versus
    local variables), for the most part the output of env is a subset of the output
    of set. Some of the variables that can display:


    +   - HOME—The directory where you begin and where you end up when you cd without
    any other parameters


    +   - LINES—The number of lines within the display before pausing (more)


    +   - LOGNAME—The name the user logged in as


    +   - PWD—The present working directory, or where you are now


    +   - SHELL—The interpreter you are using


    +   - TERM—The type of terminal, or emulation, in use


    +   - USER—Rarely differs from LOGNAME


    > As a general rule, predefined system variables always appear in uppercase letters.


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_50_0.png)


    You can change the value of variables as needed or add your own to be referenced
    in programs or at the command prompt. For example, to create a new variable called
    TODAY, use the syntax:


    TODAY—Wednesday


    You can now see the value of the variable by using the command:


    echo $TODAY


    The result is Wednesday. If you now use the command:'
