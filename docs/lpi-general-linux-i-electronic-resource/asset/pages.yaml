    root    1183 19603 0 Aug23 pts/0       00:00:00 awk -F: questions

    root    30778 19605 0 Aug14 pts/0       00:00:00 ps -f

    $

    ```


    As illustrated, the output appears on the screen and gets written to the file
    as well. This can be an extremely useful utility when you need a file and you
    also want to view the output.'
