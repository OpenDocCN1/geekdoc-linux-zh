    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_226_0.png)


    Keep in mind the fact that changing the owner of a file does not change permissions
    or any other values, just as changing permissions does not change the owner, and
    so on.


    If you are changing a directory, and you want to change recursively all the entities
    beneath, use the -R option.


    A cousin of the two utilities, chgrp changes the group associated with the entity.
    Once, the -R option is available to change recursively all the files and subdirectories
    beneath a directory. The root user can make any changes she wants; for a user
    to do so, however, he must be the owner of the file and belong to the group where
    he is making the change.


    If you are the root user changing both the owner and group at the same time, you
    can use chown and separate the two values by a colon:


    ```

    $ ls -l turbo

    -rw-rw-rw- 1 edulaney root 14 Sep 6 22:42 turbo

    $ chown kristen:business turbo

    $ ls -l turbo

    -rw-rw-rw- 1 kristen business 14 Sep 6 22:42 turbo $

    ```


    The command fails if either the owner or the group does not exist. You can also
    use chown to change only the group by using the second part of the argument:


    ```

    $ ls -l turbo

    -rw-rw-rw- 1 kristen business 14 Sep 6 22:42 turbo

    $ chown :users turbo

    $ ls -l turbo

    -rw-rw-rw- 1 kristen users 14 Sep 6 22:42 turbo $

    ```'
