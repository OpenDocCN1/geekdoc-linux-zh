  md: '# The Command Line 27


    ```

    ls -z > myfile 2>errors

    ```


    In the order of operations here, the shell first creates two files ("myfile" and
    "errors") with zero sizes (whether or not existed before). If the command is successful,
    the output goes to "myfile." If the command is unsuccessful, the errors go to
    "errors." If these were truly log files, the only other modification might be
    to append versus (empty, or write over) each time the operation is:


    ```

    ls -z >> myfile 2>>errors

    ```


    # Command History


    The bash keeps a list of commands that you give it and allows you to reuse those
    commands from the list rather than retype them each. From the command line, you
    can use the up and down arrows to scroll through recent commands. You can also
    enter two bangs (!!) to rerun the very last command you gave.


    Typing history shows all the commands that are stored with an increasing number
    on the left. Type a single bang, and one of those command numbers will rerun that
    command, as in !205.


    > Instead of seeing the entire history list, you can choose to see only the most
    recent entries by following the history command with the number of lines you want
    to see; for example:


    ```

    history 5

    history 10

    ```


    You can also type a bang followed by a set of characters, and the shell reruns
    the most recent command starting with those characters:


    ```

    !!ls

    ```


    This example reruns the most recent command that started with ls.

    Important variables for history are:


    +   - HISTFILE—Points to the file holding the history of commands. it is .bash_history
    within each user''s home directory.

    - HISTSIZE—The number of entries to keep each session.


    Note: You can use an internal alias for history, fc, to recall and rerun commands
    as well.


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_58_0.png)'
