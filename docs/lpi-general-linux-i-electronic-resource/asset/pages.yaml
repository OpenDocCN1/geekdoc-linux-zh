    The join utility identified the commonality of the first field and combined the
    matching entries. Whereas paste blindly takes from each file to create the display,
    join only combines lines that match, and—of critical importance—join must find
    an exact match with the corresponding line in the other file. We cannot illustrate
    this point enough; for example, suppose filetwo had an additional line in the
    middle:


