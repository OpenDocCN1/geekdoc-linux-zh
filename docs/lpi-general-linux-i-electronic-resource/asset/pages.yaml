  md: '# Chapter 5


    cp works with both files and directories and can move multiple entities at a time
    using wildcards. After the utility, you must specify the source, followed by the
    target. The simplest use of all can be illustrated as the following:


    ```

    $ ls -l fileone fileone

    ls: fileone: No such file or directory

    -rw-r--r-- 1 root root 85 Aug 22 10:26 fileone

    $

    cp fileone fileone

    $ ls -l fileone fileone

    -rw-r--r-- 1 root root 85 Aug 22 10:26 fileone

    -rw-r--r-- 1 eduleaney users 85 Aug 30 16:18 onefileone

    ```


    Notice that the original entry (source) remains unchanged, but now there is a
    second entry (target) as well. On the second entry, the contents are identical,
    the date and time are those of the present (when cp was executed) and not those
    of the source. Notice well that the owner and group of the new file became those
    of the user executing the command. This same action would take place if you were
    creating the target file completely from scratch


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_127_0.png)


    To be able to copy a file—to create a new entity equal in content to another—you
    need only permission to the source.


    You can use the -p option to force as many of the old variables as possible to
    remain the same. It preserves what it can in terms of attributes:


    ```

    $ ls -l fileone nextfile

    ls: nextfile: No such file or directory

    -rw-r--r-- 1 root root 85 Aug 22 10:26 fileone

    $

    cp -p fileone nextfile

    $ ls -l fileone nextfile

    -rw-r--r-- 1 root root 85 Aug 22 10:26 fileone

    -rw-r--r-- 1 eduleaney users 85 Aug 22 10:26 nextfile

    ```


    Notice that the date and time associated with the source were kept, but the owner
    and group still must change.


    When you do a copy operation, the utility first checks whether the source file
    exists. If it does, then whatever file is specified as the target is created (with
    a size of zero),'
