    | Syntax | Result |

    | --- | --- |

    | 1 2 *** | 12:01 every day of the year |

    | 15 1 8 | 6:15 in the evening on the first day of each month |

    | 1,16,31,46 **** | Every 15 minutes |

    | 30 0,12 *** | 12:30 in the morning and afternoon |

