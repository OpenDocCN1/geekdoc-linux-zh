    # tr


    the tr (translate) utility can convert one set of characters to another. For example,
    to change all lowercase characters to uppercase:


    ```

    $ tr ''[a-z]'' ''[A-Z]'' < fileone

    INDIAPOLIS INDIANA

    PEORIA

    LIVINGSTON

    SCOTTSDALE

    $

    ```


    It is extremely important to realize that the syntax of tr accepts only two character
    sets and not the name of the file. You must feed the name of the file into the
    utility by directing input (as in the example), by piping to it, or by using a
    similar operation.


    Not only can you give character sets as string options, but you can also specify
    a number of unique values:


    +   * lower—All lowercase characters

    * upper—All uppercase characters

    * print—All printable characters

    * punct—Punctuation characters

    * space—All white space (you can use blank for horizontal white space)

    * alnum—Alpha characters and numbers

    * digit—Numbers only

    * ctrl—Character control

    * alpha—Letters only

    * graph—Printable characters but not white space


    For example, you can obtain the output shown earlier with:


    ```

    $ tr ''[:lower:]'' ''[:upper:]'' < fileone

    INDIAPOLIS INDIANA

    ```'
