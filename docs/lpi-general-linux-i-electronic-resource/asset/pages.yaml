  md: '# 216 Chapter 9


    Notice the order of operations the system comes up. Other files to be aware of
    are:


    +   * /var/log/messages

    * /etc/conf.modules

    * /etc/modules.conf

    * utmp

    * wtmp


    cron and other processes write to the first file, messages, which can be useful
    in troubleshooting problems. The second and third files are one and the same but
    differ according to the vendor. (Some systems use conf.modules, and others use
    modules.conf.) The purpose of this file is to hold information used by the kernel
    to identify the machine. The file is a C++ source file and usually not accessed
    by administrators unless corruption has occurred.


    I mentioned the utmp and wtmp files earlier in the chapter. They are log files
    that are counterparts of each other and exist in either /etc or elsewhere. If
    elsewhere, utmp is beneath /var/run and wtmp is beneath /var/log. By default,
    when the system starts, entries are written to utmp; when the system is properly
    shutdown, entries are written to wtmp.


