    # Utility Summation


    We discussed a great text utilities in this chapter. Table 3.1 lists them and

    the purposes.


    # Associated Utilities


    Linux includes a number of other useful text utilities. Some of these have limited

    usefulness and are intended only for a specific purpose. Some of these are not
    on

    Exam 101, but we discuss them because knowing of their existence and purpose

    make your life with Linux considerably easier.


    In alphabetical order, the additional utilities are:


    +   * expand—Allows you to expand tab characters into spaces. The default num-ber
    of spaces per tab is eight, but you can change that using the -t option.

    * file—Looks at an entry''s signature and reports what type of file it is—ASCII\mtext,
    GIF image, and so on. The definitions returns (and thus the files it can

    correctly identify) appear in a file called “magic”. This file typically resides
    in

    /usr/share/misc or etc.


    | Table 3.1 | Utilities addressed in this chapter. |

    |---|---|

    | Utilityity | Default Purpose |

    | cat | Displays the contents of a file. |

    | cut | Extracts a field from each line of a file. |

    | fmt | Formats the output to fit the desired display. |

    | head | Displays the beginning lines of a file. |

    | join | Combines columns from two files into a single display. |

    | nl | Numbers the lines of a file. |

    | paste | Puts the contents of two files in a single display. |

    | sort | Sorts the lines of the file. |

    | stty | Shows the settings for the terminal. |

    | tac | Displays the contents of a file in reverse order. |

    | tail | Displays the last lines of a file. |

    | tr | Translates one set of characters into another. |

    | wc | Counts the number of words, lines, and characters or within a file. |'
