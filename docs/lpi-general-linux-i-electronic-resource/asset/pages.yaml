  md: '# Chapter 7


    The name of the device has four fields:


    +   - The type of drive—h for IDE or s for SCSI

    - The type of device—d for disk

    - The number of the disk expressed in alphabetical format—a for the first, b for
    the second, and so on

    - The number of the partition—The numbers 1 through 4 are set aside for use on
    primary partitions, whether or not you have that many, and the logical drives
    start numbering with 5.


    The disk should always have a minimum of two partitions: the filesystem itself
    (often referred to as root) and a swap partition. The swap partition contains
    the memory and some hard drive space. The swap partition size is always a minimum
    of the amount of RAM installed on the machine but can be larger (16MB is the minimum
    recommendation for hard drive space). For example, if you have 64MB installed
    on a machine and the swap partition needs 128MB, it can use a 64MB swap partition
    to read and write from as processing occurs. Using a swap larger than the amount
    of RAM is known as using virtual memory.


    The maximum allowable size for a swap partition under current versions of Linux
    is 128MB, and you can tweak the size of the partition. If you run out of room
    within the partition (or you have not configured a swap partition), Linux automatically
    creates a swap file, but using a partition is preferred.


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_177_0.png)


    > Linux can work with either swap files or swap partitions, but partitions provide
    more system efficiency.


    One other note about hard drives: Linux prefers the number of cylinders on a drive
    to be 1,024 or less. With a larger number, you may encounter complications with
    software that runs at boot time (which is covered in Chapter 9) and booting and
    partitioning with other operating systems.


