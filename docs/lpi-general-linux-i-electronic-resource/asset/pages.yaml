  md: '# Chapter 6


    +   > Not all processes are tied to a terminal. A question mark (?) indicates
    that the process is running on the system without terminal interaction or without
    a terminal as the default standard output.


    +   > Every terminal without a user runs a getty. Even though no user is using
    tty1 through ttk6, it is easy to see that these represent six other terminals
    that can be used by users for interacting with this system.


    Other options you can use to determine what information to display include:


    +   - 1-Displays a long listing (think of -l).


    +   - u-Shows username and related stats.


    +   - f-Displays the full listing (everything possible).


    The last option is often used, and favored by administrators, for the additional
    columns adds to the display:


    ```

    $ ps -f

    UID PID PPID C STIME TTY CMD

    root 19605 19603 0 Aug pts/0 00:00:34 bash

    root 30089 19605 0 Aug pts/0 00:00:00 vi fileone

    root 30425 19605 0 Aug pts/0 00:00:00 paste_

    -d filesize?

    root 32040 19605 0 Aug 22 pts/0 00:00:00 cat

    root 1183 19605 0 Aug 23 pts/0 00:00:00 awk -F: questions

    root 30778 19605 0 14:25 pts/0 00:00:00 ps -f

    $

    ```


    Four columns now exist that there were not before. The first column identifies
    the user ID associated with the process. The third column identifies which process
    one reports back to. (See Figure 6.3 for a graphical representation of the fifth
    results.) The fourth column indicates whether-scheduling is involved, and the
    fifth column is the time at which the process started.


    > Be sure to notice that, when using f, the CMD lists the entire command and not
    just the first portion, as in the other displays.


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_147_0.png)


    You can combine these options; the most common combination is ef, which displays
    all processes in a full format:'
