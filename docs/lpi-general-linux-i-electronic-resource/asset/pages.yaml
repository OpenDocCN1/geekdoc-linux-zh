    This sets the shell script (which logs an entry to /var/log/messages) to run every
    five minutes after the hour, regardless of the hour (*), the day of the month
    (*), the month(*), or day of the week (*). Within each of the fields, the asterisk
    means all, but:


    +   - A number means only when there is a match, such as the 5 in the example.


    +   - A hyphen can include inclusive range of numbers, as in 1–10.


    +   - A comma can separate numbers, as in 1,10.


    Some examples of specifications appear in Table 11.2.


    The cron daemon, by init, wakes up once a minute to look for jobs that are set
