  md: '# Introduction


    Many of the higher-level exams are currently under development, and the best place
    to keep tabs on the program and its various certifications is the LPI Web site.
    The current URL for the LPI program is www.lpi.org. Before undertaking any certification
    venture, you should make certain you have the latest and most accurate information
    about the organization''s certification programs.


    # Taking a Certification Exam


    Alas, testing is not free. The current cost (always subject to change) per exam
    is $100, and the exams are offered through VUE (Virtual University) testing centers
    (www.vue.com).


    Although VUE is flexible in scheduling, it is best to call at least 10 days in
    advance. Exam seats are limited and might be booked around the time you realize
    you are ready for the test. To cancel or reschedule an exam, you should call at
    least 2 days before the scheduled test time in order to receive any sort of refund.
    When calling to schedule, have the following information ready for the staff member
    who handles your case:


    +   - Your name, social security number (if applicable), organization, and mailing
    address.

    - A method of payment. (The most convenient approach is to supply a valid credit
    card number with sufficient available credit. Otherwise, payments by check, money
    order, or purchase order must be received before a test can be scheduled. If the
    latter methods are required, ask your order taker for more details.)


    On the day of the test, arrive at least 15 minutes before your scheduled time
    slot. You must bring and supply two forms of identification, one of which must
    be a photo ID.


    All exams are completely closed book. In fact, you will be required to stow anything
    you bring with you your desk. You will be furnished with a blank sheet of paper,
    a pencil, and any other tools you might need for your exam. I suggest that you
    immediately write down on that sheet of paper all the information you''ve memorized
    for the test.


    When you complete an exam, you will get an immediate printout of your results
    and you''ll know whether you passed. All exam components are scored on a percentage
    basis.'
