    # Working with Links


    The purpose of a link, purely and simply, is to allow one file to be referenced
    by more than one name. There are any number of reasons why you would want to,
    or need to, do this:


    +   For historic purposes—Assume you want to combine all the vendor information
    into a single file. In the past, marketing has always used a file called "vendor",
    but accounting kept its information in a file called "contacts", and'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# The Linux Filesystem 155


    admin called its file "references". When you create a single file, you can make
    it available by all three names so parties can find it as they formerly did.


    To make nonlocal files look local—Assume that all users must use the same template
    when making system modification requests. This file can exist in the root user''s
    home directory (/root), and you can create a link within each user''s home directory
    (/home/user).


    The utility you use to create links is ln. When you create a link, you merely
    create another pointer to an already existing entity; only one node is used, not
    two. Because there is only one copy, you also save disk space.


    When you link to a file to give others access, you must make certain they have
    appropriate permissions to access the file. Permissions are discussed in Chapter
    8. You can create two types of links: hard and symbolic.


    # Hard Links


    The simplest of the two link types is the hard link. ln creates a hard link by
    default, and its use can be illustrated as follows:


    ```

    $ ls -l

    drwx------ 5 root root 1024 Sep 22 03:57 Desktop

    -rw-r-- 1 root root 81 Sep 23 00:25 friday

    -rw-r-- 1 root root 81 Sep 23 00:38 monday

    -rw-r-- 1 root root 152 Sep 23 00:26 tuesday

    -rw-r-- 1 root root 38 Sep 23 00:26 wednesday

    $

    ```


    ```

    $ ls -ln thursday

    drwx------ 5 root root 1024 Sep 22 03:57 Desktop

    -rw-r-- 1 root root 81 Sep 23 00:25 friday

    -rw-r-- 2 root root 81 Sep 23 00:38 monday

    -rw-r-- 2 root root 81 Sep 23 00:38 thursday

    -rw-r-- 1 root root 152 Sep 23 00:26 tuesday

    -rw-r-- 1 root root 38 Sep 23 00:26 wednesday

    $

    ```


    Note that the attributes related to the link of the new entry (Thursday) remained
    the same as those associated with monday and did not assume the current time—as
    would happen with a copy operation. This is because there is only one set of data,
    even though there are now two ways of referencing it. The second column from the
    left indicates the link count for files: the number of ways this same set of data
    can be referenced. The link count has incremented from 1 to 2.'
