  md: 'I highly recommend that you always attempt signal 15 (terminate) before signal
    9 (kill). I also highly recommend that you make certain a process has no child
    processes beneath it before you kill it. If child processes exist, you should
    remove them first, before proceeding further.


    Just when you thought it couldn''t get any more bloody, you can use another command—killall
    to get rid of processes by name, versus PID. killall also has the ability (with
    the -w option) to wait for processes to die and to require confirmation (with
    the -i option) before killing.


    # Foreground and Background


    When a process is started, the default behavior is to run it in the foreground.
    In the foreground, it becomes the only job you can work on, and interaction is
    based on completion of the job. For example, when a user runs -ls the display
    appears on her terminal, and she is unable to issue another command until ls is
    finished.


    To run a process in the background, simply add an ampersand (&) to the end. This
    option allows you to run more than one command at the same time:


    ```

    $ sleep 90 &

    [5] 31168

    $

    ```


    The number that appears in the brackets is equal to the number of jobs you have
    running in the background. The number following it (31168, in this case) is the
    process ID number of this job.


    > Be sure to remember the PID of the last job placed in the background can also
    be referenced as $!


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_154_0.png)


    Placing the job in the background allows the user to continue working and starting
    other processes. If you must wait for a process to finish before starting another,
    the wait command, used with the PID of the process, can cease processing until
    the specified process finishes.


    ```

    $ sleep 120 &

    [5] 31175

    $

    $ wait 31175

    ```


    The prompt does not return as long as 31175 remains a valid PID.'
