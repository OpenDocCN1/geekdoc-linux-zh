  md: '# 256 Chapter 11


    A few other options exist with at: -m mails the user when the job is done, and
    -f feeds the lines at from a file. An alias for the command is called batch utility
    works similarly, but it runs the processes only when system use is low.

    One thing to keep in mind about at jobs is worth repeating: They are good for
    running more than once, it is time consuming to schedule the same jobs every day
    because there is no trace of them to resurrect once they are finished executing.
    If you need to run jobs more than once, avoid at jobs, and investigate the use
    of cron.


    You use cron to run commands at an interval, which can be any type of interval.
    cron reads a file of times and commands named crontab (as in "cron table") to
    find what must be run. By default, every user can have her own crontab file. The
    default changes, however, if an /etc/cron.allow or /etc/cron.deny file exists.
    In the presence of the cron.allow file, only those users who appear within the
    file can create crontab files. In the presence of a cron.deny file, every user
    can use crontab files except those whose names appear within the cron.deny. The
    two files are optional and mutually exclusive: You would never have both on the
    same system.

    To check for a current crontab file, a user uses the command:


    ```

    crontab -l

    ```


    To remove it, he uses:


    ```

    crontab -r

    ```


    To edit it, he uses:


    ```

    crontab -e

    ```


    For the root user u to see another user''s files, such as for larry, she uses:


    ```

    crontab -u larry

    ```


    There is one entry per line in the file, and each line consists of six fields.
    The six fields are separated by white space. The first time you look at such a
    file, it will look like a garbled mess. To understand what you are seeing, remember
    that the six fields are:


    +   * Minutes (0–59)

    "* Hours (0–23)

    "* Day of month (1–31)'
