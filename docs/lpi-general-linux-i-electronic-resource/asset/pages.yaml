- img_proc: true
  md: '# LPI Certification Exams


    All LPI certification exams allow a certain amount of time in which to complete
    your work.(This time is indicated by the exam by an on-screen counter/clock, so
    you can check the time remaining whenever you like.) The exam consists of randomly
    selected questions, and you may take up to 90 minutes to complete your work.


    The LPI 101 Certification Exam is computer generated and uses a combination of
    multiple-choice and short-answer (fill-in-the-blank) formats. Although this might
    sound simple, the questions are constructed not only to check your mastery of
    basic facts and figures Linux technologies, but also to require you to evaluate
    one or more sets of circumstances or requirements. You might be asked to select
    the best or most effective solution to a problem from a range of choices, all
    of which are technically correct. Taking the exam is quite an adventure, and it
    involves real thinking. This book shows you what to expect and how to deal with
    the potential problems, puzzles, and predic.


    # Exam Layout and Design


    Some questions require you to select a single answer, whereas others ask you to
    select multiple correct answers. The following multiple-choice question requires
    you to select a single correct answer. Following the question is a brief summary
    of each potential answer and why it is either right or wrong.


    # Question 1


    | Which command can be used with the appropriate parameters or switches to count
    the number of lines in a text file? |

    | a. grep |

    | b. wc |

    | c. lc |

    | d. cat |


    The correct answer to this question is b. The command wc -l will count the number
    of lines within a file. grep can be used to find strings, lc does not exist, and
    cat is used to display files. Therefore, all answers except b are incorrect.


    This sample question format corresponds closely to the LPI Certification Exam
    format, the only difference on the exam is that questions are not followed by
    answer keys. To select an answer, position the cursor over the radio button next
    to the answer. Then click the mouse button to select the answer.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Chapter 1


    Let''s examine a question that requires choosing multiple answers. This type of
    question provides checkboxes rather than radio buttons for marking all appropriate
    selections.


    # Question 2


    | Which of the following are valid parameters for use with the umount command?
    [Check all correct answers] |

    | -a |

    | -b |

    | -n |

    | -m |


    The correct answers to this question are a and c. umount -a will unmount all systems
    within /etc/mtab, and umount -n will unmount a specified filesystem. The other
    two parameters are not valid for use with the umount utility.


    For this type of question, more than one answer is required. Such questions are
    scored as wrong unless all the selections are chosen. In other words, a partially
    correct answer does not result in partial credit when the test is scored. If you
    are required to provide multiple answers and you do not provide the number of
    answers that the question asks, the testing software will mark the question for
    you and indicate at the end of the test that you did not complete that question.
    To the best of our knowledge, these questions are scored wrong unless all the
    required selections are chosen. For Question 2, you have to check the boxes next
    to items a and c to obtain credit for a correct answer. Notice that picking the
    right answers also means knowing why the other answers are wrong!


    Let''s examine a question that requires filling in the blank. On the test itself,
    you will see that this type of question provides an input box which you type an
    answer; here''ve inserted a blank line for your answer.


    # Question 3


    | What is the numerical representation of a file''s permissions if they are equal
    to -rwx-xr-x? [Fill in the blank] |


    The correct answer to this question is 755. Any other value is incorrect.'
