    # ## The root Directory


    The root directory is the home directory for the root user. For security purposes,
    it is beneath the / directory rather than being a subdirectory of /home. For true
    security, it is further recommended that you move this directory to another location
    and rename it to a less obvious (inviting) name.


    One point of continuing confusion is the fact that /root and / can be referred
    to as the “root” directory. Keep in mind that "/" is the root directory of the
    system, and /root is a subdirectory of / used as the home directory of the root
    user.


