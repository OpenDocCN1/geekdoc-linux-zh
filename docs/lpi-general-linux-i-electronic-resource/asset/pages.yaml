    66 FSF GNU Shell Utilities 1


    The nice utility does not have a great deal to it, which makes it a good choice
    for dissecting as an example of the output available from man. Using the more
    or less utilities to display the page (whichever is defined by the PAGER variable),
    you can move through the documentation in a number of ways after the first screen
    appears, as shown in Table 10.2.


    Examining the actual display: Line 1 gives the name of the utility, and the parentheses
    identify what subdirectory the documentation is coming from. In this case the
    I indicates it is a shell utility or user command for which the documentation
    was found and displayed. If documentation is found for other entities named "nice",
    they are not displayed because the default action is to display only the first
    entity found.


    To check for more than one set of documentation on the system by the same name,
    you can use the whatis command:


    ```

    $ whatis nice

    nice (1) - run a program with modified scheduling priority

    nice (2) - change process priority

    (END) (press q)

    $

    ```


    In this case, another set of documentation for nice does appear under man2. The
    list comes from a whatis database created with the makewhatis utility


    | Key Combination | Movement |

    |---|---|

    | Enter | Scroll down the next line. |

    | Space | Scroll down the next page. |

    | b | Scroll up to the previous page. |

    | q | Quit. |

    | / | Search for the first page containing specified text. |'
