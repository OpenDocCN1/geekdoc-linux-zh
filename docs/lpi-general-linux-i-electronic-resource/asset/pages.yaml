  md: "# # EXAM CRAM\nWITHDRAWN\nGeneral Linux\nNo longer the property of the\nBoston\
    \ Gram Sheet\nSale of this material benefited the Library.\n\nThis Cram Sheet\
    \ contains the distilled key facts about the LPI 101 exam. Review this information\
    \ right before entering the test room, paying special attention to those areas\
    \ where you feel the most review. You can transfer any of the facts onto a blank\
    \ piece of paper before beginning the exam.\n\n# ### GNU AND UNIX COMMANDS\n\n\
    +   1. The shell is the interpreter between the operating system and the user.\
    \ Most versions of Linux offer more than one shell, and users can choose the one\
    \ that suits them. Among the shells found in most implementations of Linux\n \
    \  * bash—The Bourne Again (heavily tested in this exam)\n   * tsh—Tom's C shell\n\
    \n+   2. The cat command is the simplest to view all of a text file (use tac to\
    \ read the file in reverse order). If you only want to see the top, you can use\
    \ the head command, and if you only want to see the bottom, you can use the tail\
    \ command.\n\n+   3. The cut command can pull fields from a file, and they can\
    \ be combined using either paste or join. The latter offers more features than\
    \ the former and can be used conditionally.\n\n+   4. The expand command can change\
    \ tabs into spaces, the cmd command can crop text to fit a character line limit,\
    \ and the pr command works with paging. Lines can be numbered in the display with\
    \ the nl command, and sort can place items in alphabetical or numeric (using the\
    \ -n parameter order).\n\n+   5. The od command can display portions of non-text\
    \ files by performing an optical dump. The tr command can convert one character\
    \ set to\n\nanother, and wc can count the number of lines, words, and characters\
    \ in a file.\n\n+   6. Files can be copied using cp or moved mv. Files can be\
    \ deleted with rm, and directories (which are created with mkdir) can be removed\
    \ with rmdir. In all situations, you can specify target and source items using\
    \ absolute or relative addresses, and you can use wildcards as well. To change\
    \ directories, use the cd command (when used without parameters, will move you\
    \ to your home directory), and to see what directory you are presently working\
    \ in, use the pwd (present working directory) command.\n\n+   7. Standard input\
    \ (stdin) is traditionally the keyboard, and standard output (stdout) is traditionally\
    \ the monitor. Both can be redirected, as standard error (stderr). Methods of\
    \ redirection using the symbols, >, <, and |. You can also utilize the tee command\
    \ to send to two locations.\n\n+   8. Commands can be joined on the command line\
    \ by the semicolon (;), and each command will be independent of one other. Command\
    \ history allows you to run commands again without needing to retype them and\
    \ allows editing prior to execution. When run, every command spans at least one\
    \ process, and processes can be viewed with ps or top (which continues to update\
    \ the display dynamically).\n\n+   9. Jobs running in the foreground can be suspended\
    \ by pressing ^Z (Ctrl+Z). They be"
  merge: -1
  pgno: 2
- img_proc: true
  md: 'moved to the background with the bg command, and background jobs can be brought
    to the foreground with the fg command. Running jobs can be listed with the jobs
    command, and processes can be eradicated with the use of kill.


    sions, the ability to read 4, to write 4, and to execute is 1.


    +   18. File and directory permissions can be changed with the chmod command (which
    accepts numeric and symbolic values). Adding 1000 to the value turns on the sticky
    bit, while adding 2000 turns on the SGID permission, and 4000 turns on the SUID
    permission.


    10. The priority level of a job can be altered before it starts with the nice
    command. After the job has started, only renice can change its priority.


    +   19. The owner of a group can be changed with the chown command, whereas the
    chgrp command allows changing the group associated with the file.


    11. The sed can be used to change text as it is displayed, using a defined set
    of parameters as it is. The grep utility (and its counterparts, egrep and grep)
    can be used to find matches for strings within files.


    20. Links are created with the ln command. A “hard” link is nothing more than
    an alias to the file, and all aliases share the common inode. A symbolic link
    is created with ln -s and is actual file (of very small size) with its owner.
    The symbolic link contains a pointer to the original file and can span across
    filesystems (whereas a hard link cannot).


    # DEVICES, LINUX FILESYSTEMS, AND FILESYSTEM HIERARCHY STANDARDS


    12. The fdisk command is used to create partitions, which can be formatted with
    mkfs. The mkfs utility allows you to format a number of different filesystem types,
    including msdos, and others.


    +   21. A directory is created by default during the installation of Linux. Among
    them are

    * /bin–Holds binary (executable) files accessible by all users.

    * /dev–Holds device definitions.

    * /etc–Used for files that differ from machine (configuration files).

    * /home–Holds the users'' home directories.

    * /mnt–Used for mount points.

    * /root–The home directory for the root user.

    * /tmp–Used for temporary files that need to survive a reboot.

    * /usr–Documentation and other entries that do not change often. Many subdirectories
    are holding additional exclusives.


    13. The filesystem contains an inode (a unique entry) for every file stored on
    it. This number (visible with ls -i) holds information about permissions, owner,
    group, and associated dates for creation/modification (which can be changed with
    the touch command).


    14. The du command can show how much of the disk is used, whereas the df command
    shows how free it is. The main troubleshooting tool for disks is fsck, which can
    check filesystem structure, including inodes.


    15. The root filesystem must always be mounted, but others can be mounted with
    the mount command or unmount. To mounting automatically at start-up, add the entries
    to /etc/fstab.


    16. Quotas restrict the amount of disk space users or groups can utilize. Quotas
    are initialized with the quota command, and off with quota and quota. They can
    be changed/modified with edquota, and can be generated with repquota.


    22. The find command can be used to search for files/directories that meet any
    number of criteria. When these entities are found, the xargs command can be used
    to look deeper within them for other values (such as grep)


    17. File permissions can be expressed in terms of symbolic or numeric values.
    When files are created, the default permissions are equal to 666 minus any umask
    value. The default permissions on directories are equal to 777 minus any umask.
    When you''re computing numeric-'
