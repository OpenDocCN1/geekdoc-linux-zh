    # Symbolic Links


    To make a symbolic link, you must use the -s option with ln. A symbolic link is
    what you might call a “shortcut” in the Windows operating systems: a small file
    that points to another file. The primary purpose for a symbolic link is to get
    around the shortcomings of hard links. As such, symbolic links allow users to
    link to directories and provide links to cross filesystems.


    To understand how a symbolic link is created, consider the following example:


    ```

    $ ls -l

