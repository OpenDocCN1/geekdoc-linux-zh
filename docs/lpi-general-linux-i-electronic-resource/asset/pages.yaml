- img_proc: true
  md: '# Where to Next 283


    Among the possibilities that exist after finishing LPIC Level 1, you might want
    to consider:


    +   Becoming certified by LPI at Level 2—Consistent of another two exams (201
    and 202), this certification is geared toward the intermediate (rather than the
    beginning) administrator. It tests on implementation and troubleshooting of Internet
    gateways, servers, and Samba (in much greater detail than Exam 102). Exam 201
    requires you to be able to track and solve problems, write sh and sed shell scripts,
    and fully understand internetworking. Exam 202 tests the knowledge of processes
    and booting and working with the kernel, libraries, bugs, and upgrades. More information
    appears at www.lpi.org.


    Note: As of this writing, both exams are in development, but they are expected
    to be available.


    +   Obtaining a vendor-specific certification—LPI examples are intended to be
    vendor neutral and not overly favor one vendor''s implementation of Linux over
    another. If you are working exclusively with one vendor''s implementation of Linux
    and a mastery of the intricacies of its implementation will make you more valuable
    (both in terms of knowledge and market value), then you should investigate whether
    that vendor has a certification for its operating system. The more example is
    the Red Hat Certified Engineer (RHCE) certification. More information on it appears
    at www.redhat.com/services/training.


    +   Obtaining another general Linux certification—Both Saur and CompTIA (the organization
    behind the A+ and Network+ exams) offer their vendor-neutral certifications. Saur
    has three levels (similar to LPI), with each consisting of four exams. More information
    on Saur and their exams/certification appears at www.linuxertification.com. CompTIA
    offers a single-exam, single-level certification known as Linux+, More information
    on this exam appears at www.comptia.org.


    Note: As of this writing, the Linux+ exam is not available, but it is expected
    to be available towards the end of 2001.


    +   Becoming a certified trainer—Several companies offer certification as Linux
    instructors. One of the best is Calder''s OpenLearning Instructor certification.
    Once you earn this certification, you receive free copies of OpenLinux betas and
    other resources you need to stay on top of the operating system. You can also
    teach in OpenLearning training centers (which are access resources not available
    to the general public. You must be LPI certified to be an OpenLearning Instructor.
    More information appears at www.calderasystems.com/openlearning/instructor.'
