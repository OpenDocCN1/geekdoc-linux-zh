  md: '# Using at


    The at command allows you to schedule a job to run at a specified time. The syntax
    is simply:


    ```

    `at {time}`

    ```


    You can specify the time in many ways. Some examples are:


    +   - 17:31—Runs the command at 5:31 in the afternoon.

    - now—Runs now.

    - now + 5 days—Runs five days from now at the exact same time.

    - 17:31 Mar 14—Runs at 5:31 in the afternoon on March 14th.

    - midnight—Runs at midnight tonight. Other special words are today, tomorrow,
    and noon.


    By default, only the root user can use the at command. You can change this, however,
    by using the /etc/at.allow file or the /etc/at.deny file. By default, the at.deny
    file exists on all systems and holds system accounts that a user should not be
    using. If only the at.allow file exists, then only users who are listed there
    are allowed to use the at command. On the other hand, if at.deny file exists,
    then all users are allowed to use the at command except those listed within this
    file.


    When you give the at command and the time, the prompt changes to the PS2 prompt
    (>, by default), and you can enter as many commands as you want to run at that
    time. When you are finished, press Ctrl+D to return to the PS1 prompt.


    You can list jobs that are spooled for future execution with the command:


    ```

    at -1

    ```


    or the command:


    ```

    atq

    ```


    Individual users see only their own entries, the root user can see all. In reality,
    the listings are text files stored /var/spool/atjobs. These files hold a copy
    of environment information applied when the user created the job, as well as the
    commands within the job itself. Prior to execution, the command can be stopped
    with either of the following commands and the job number:


    ```

    at -d

    ```'
  merge: -1
  pgno: 284
