  md: '# 246 Chapter 11


    In this chapter, you''ll learn about the system-logging features you can turn
    on in Linux. I address two methods (*at* and *cron*) of scheduling unattended
    jobs to run in the future. You will also see the methods by which you can perform
    backups and restores to understand their importance.


    # Configuring System Logs


    Log files can easily be an administrator''s best friend or your worst enemy. They
    can monitor the system and report on administrative and security issues 24 hours
    a day, seven days a week: creating fingerprints that allow you to see what is
    happening and who is doing it. If properly implemented, they monitor so much information
    that you spend days looking through thousands of lines of unnecessary entries
    trying to find a single item; they eat up precious disk space; and serve little
    purpose.


    An illustration of a negative aspect: I once worked in support for an electronic-monitoring
    corporation that sold computer systems to law-enforcement departments. When making
    the purchase, most departments had to scrape together the money to buy the system
    and cut corners where they could, usually saving money by buying small hard drives
    or minimal RAM. Given the sensitive nature of house arrest, log files recorded
    everything that happened—every time a demo was accessed (thousands of times a
    day), every time a change was made to a person''s information, and so on. The
    machines constantly ran out of hard-drive space, and on a weekly basis customer
    support had to dial in remotely and delete the log files—defeating the very purpose
    of having them.


    An illustration of a positive aspect: I once consulted for a company that had
    problems no one had ever encountered. As soon as we fixed one problem, another
    occurred. The problems did not seem to make sense; instead of showing file corruption,
    the databases would completely disappear from the system—seemingly out of the
    blue without rhyme or reason. Users who could log in one day would come in the
    next and discover that their profiles contained variables that caused error after
    error. Frustration was reaching an all-time high. A quick look at the showed showed
    disgruntled employee had figured out a number of passwords, logged in as other
    users, and then exited and acted as confused as everyone else.


    The key to using log files effectively is to know what each of them does. If you
    know that, you can realistically set your expectations and look for necessary
    data without being overwhelmed.


    # The Log Daemon


    Although individual applications can have their own logging features, one log
    service runs just for the operating system. The service responsible for adding
    entries to the log files is syslogd—the log daemon—which is spawned by the *init*'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# Administering the System


    Daemon. When started, syslogd reads the /etc/syslog.conf file to see what monitor.
    Each line consists of the item you want to monitor followed by a period (.), the
    priority, white space, and the location of the log file.

    You can use a comma (,) to separate multiple entries. You can also use a semicolon
