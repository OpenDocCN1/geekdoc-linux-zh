  pgno: 289
- img_proc: true
  md: '# Administering the System


    Differential—Copies all files added or changed since the last full backup.

    Most real backup plans use some combination of these types. For example, full
    backups are best but require the most time to run. For that reason, you might
    run a full backup every Sunday and an incremental every other evening of the week.
    The amount of time it takes to run the incrementals is much shorter and roughly
    the same night. If the system crashes on Friday, however it will take a while
    to restore the full tape from Sunday, then the incremental from Monday, the incremental
    from Tuesday, the one from Wednesday, and the one from Thursday (a total of five
    tapes).


    Another possibility is to perform a full backup on Sunday and a differential night.
    The amount of time to do the differentials gets longer each night, but if the
    system crashes on Friday, you only need two tapes: Sunday’s full and Thursday’s
    differential.


    LPI also recognizes two other types of backups: copy and partial. A copy backup
    is simply a copy of a file to the media (think of copying one file to a floppy).
    A partial backup is just a copy of all the files within a single directory.


    Just as important as a good backup strategy and adherence to it is the knowledge
    that you can restore the data if you have to. This assurance can come only from
    verifying that you are on a regular basis. you should run a restore operation
    from a completed backup and verify that you can read back the data in its original
    form.


    # Utilities to Know


    Linux includes a number of utilities that you can use to do your backups, such
    as tar and cpio. The tar utility (tape archiver) combines multiple files into
    a single file that can be copied to the media. The syntax for it is:


    ```

    tar {options} {target_file} {source_files}

    ```


    Both the target file and source files can be paths (such as /dev/tape). The options
    include:


    +   - c—Creates a new file.

    - d—Compares contents and displays the differences between the target and source.

    - f—Specifies a file in which to place the archive.

    - p—Keeps the permissions.

    - r—Appends to an existing file.'
  merge: -1
  pgno: 290
- img_proc: true
  md: '+   t—Shows the names of the files in the tar file.


    +   u—Adds only files that are new.


    +   v—Runs in verbose mode.


    +   x—Extracts files.


    +   z—Sends the output through gzip or gunzip depending on direction.


    The following common command creates a new tar file on the tape and does so in
    verbose mode:


    ```

    tar cvf /dev/tape (files)

    ```


    The following command extracts and restores the files from the october.tar backup
    file:


    ```

    tar xf october.tar

    ```


    You use the cpio utility to copy in and out. It can do three actions, so you must
    specify one:


    +   -i—Extracts from an archive.


    +   -o—Makes a new archive.


    +   -p—Prints or passes through the files.


    Options you can specify are:


    +   d—Creates directories if they are needed.


    +   f—Specifies a file.


    +   t—Shows the contents.


    +   u—Overwrites existing files.


    +   v—Runs in verbose mode.


    The following example reads in files from a tape and displays them as it is operating
    (verbose mode):


    ```

    cpio -iv < /dev/tape

    ```'
