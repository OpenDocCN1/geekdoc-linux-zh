- img_proc: true
  md: '# Creating a New Group


    To create a new group, you can manually edit the /etc/group file and append an
    entry to it. If you do so, you must be certain to use a unique text name and GID
    number. You can also use the groupadd utility to simplify the operation:


    ```

    $ groupadd -g 101 sales

    $ tail -1 /etc/group

    sales::101:

    $

    ```


    The -g option specifies the GID to use. If the number is not unique, the utility
    fails. As a general rule, GID numbers 0 through 99 are reserved for system groups:


    ```

    $ groupadd -g 101 marketing

    A group with GID 101 already exists.

    $

    ```


    Similarly, if you attempt to reuse a group name, the utility fails:


    ```

    $ groupadd -g 102 sales

    A group with name sales already exists.

    $

    ```


    The only option available with groupadd is -g. To define your group further, you
    can resort to manual editing or to use the gpasswd utility. When issued with only
    the name of a group, gpasswd prompts for a password to associate with the group:


    ```

    $ gpasswd sales

    Changing the password for group sales

    New Password: (Enter value)

    Re-enter password: (Enter value again)

    $ tail -1 /etc/group

    sales::QJHex2Pbk7TU:101:

    $

    ```


    If you tire of the password, or find it unwieldy, you can use the -r option to
    remove it. Using the -a option, it is possible to add users to the group. The
    reverse option is -d, which removes users from the group:


    ```

    $ gpasswd -r sales

    $ tail -1 /etc/group

    sales::101:

    $ gpasswd -a edulaney sales

    Adding user edulaney sales

    $

    ```'
  merge: -1
