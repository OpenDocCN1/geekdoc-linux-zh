    # Ending a Process


    Under normal circumstances, a child acts on behalf of, and reports to, a parent.
    When the child is no longer needed, it goes away on its own. Sometimes, however,
    processes runaways; they are no longer needed, yet they continue to run and consume
    resources.


    A parent cannot (and should not) cease as long as child processes are associated
    with it. Given that, a process that fails to cease can keep a number of unnecessary
    processes on a system. To illustrate, assume a user’s shell calls another process
    (A), which cannot do everything, so it calls another (B), and in it starts another
    (C).


    Under normal conditions, when Process C finishes, it reports back to Process B
    and goes away. Process B manages the data, reports back to Process A, and goes
    away. Process A whatever it needs to do with the data, returns it to the user’s
    shell, and goes away.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Working with Processes


    For a non-normal condition, assume that Process C has a glitch and does not end
    after reporting back to Process B It continues to run. Process B from ending because
    it still has a child associated with it. We can assume that Process B returns
    its values to Process A, and Process A returns its values to the user''s shell.
    Process A, like Process B, cannot end because it still has a child associated
    with it. Because there is a glitch in Process C, three processes are no longer
    continued to run.


    Yet another possibility for the glitch (and it depends on how applications are
    written) is that Process B could go ahead and without Process C going away. Process
    A could do its task and as well as well. What happens in this instance is that
    only Process C remains a process, but now it has nonexistent parents above it
    and has no idea who it reports to. It becomes a true runaway.


    To solve problems with erratic processes you use the kill command. This utility
    works with the syntax:


    ```

    kill (option) PID

    ```


    Thus, to get rid of the cat process, the sequence is:


    ```

    $ ps -f

    root PID PPID CIME TTY CMD

    root 19605 19605 00 Aug pts/0 00:00:34 bash

    root 30089 19605 00 Aug pts/0 00:00:00 vi fileone

    root 30425 19605 00 Aug pts/0 00:00:00_

    paste -d filename filetwo=

    root 30420 19605 00 Aug pts/0 00:00:00 cat

    root 1183 19605 00 Aug pts/0 00:00:00 awk -F: questions

    root 30900 19605 00 14:25 pts/0 00:00:00 ps -f

    $

    $ kill 32040

    $

    ```


    This "politely" asks the process to terminate. It is polite but different ways
    to kill a process (signals to send), is the safest method of doing so. In a great
    many instances, the process simply ignores the request and continues on. When
    that happens, you can use one of the other 32 ways by specifying the number to
    use. Among the possibilities are:


    +   -1—On hangup/disconnect

    -2—Using an interrupt (Ctrl+C)

    -3—Upon quit'
