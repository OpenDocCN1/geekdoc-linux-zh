    Then the following (including prompts) is the display generated:


    ```

    $ join fileone filetwo

    11111 Indianapolis Indiana 500 race

    22222 Columbus Ohio Buckeye State

    $

    ```


    As soon as the files no longer match, join can perform no further operations.
    join checks each line with the same—and only the same—line in the input file for
    a match on the default file. If matches are found, they are incorporated in the
    display; otherwise, they are not. To illustrate one more time—use the original
    filetwo:'
