    # Question 2


    +   You want to combine two files so that fileone''s content is followed by filetwo''s
    content in a single file. Which of the following commands allows you to perform
    this operation? [Check all correct answers]

    a. cat file fileone > fileone

    b. cat filetwo >> fileone

    c. cat fileone filetwo > filethree

    d. cat fileone >> filetwo


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_85_0.png)


    The answers to this question are b and c. Answer b will append the existing file
    to the existing file and meet the criteria of the question. Answer c will create
    a brand new file—filethree—containing the contents of fileone with the contents
    of filetwo appended and thus meet the criteria of the question. Answer a will
    see the shell, create a zero-size file named (thus emptying the contents of the
    existing file), copy the empty file into itself, and then copy the contents of
    filetwo; thus, the result is a mirror of fileone, and all of fileone''s data will
    be lost. Answer d will append fileone to the end of filetwo, and the data will
    appear in the opposite order of what the question required.'
