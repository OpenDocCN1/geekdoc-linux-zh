    I think the new neighbors are getting a new heat pump


    to:


    I think the old neighbors are getting a reconditioned heat pump


    [Fill in the blank]


    The correct answer to this question is:


    ```

    echo I think the new neighbors are getting a new heat pump | sed -e ''s/new/old/''
    -e ''s/new/reconditioned/''

    ```


    Because the same word is being substituted for two different values, you can leave
