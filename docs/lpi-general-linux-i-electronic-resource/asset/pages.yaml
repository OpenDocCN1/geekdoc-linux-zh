  md: '# Utility Summation


    This chapter discussed several utilities. Table 5.4 lists them and their purposes.


    | Utility | Default Purpose |

    | --- | --- |

    | cd | Changes from the current directory to another. |

    | pwd | Displays the current directory—always in absolute format. |

    | ls | Lists files and directories on the system. |

    | touch | Changes the times associated with a file. |

    | cp | Copies a file or directory. |

    | mv | Renames or moves a file or directory. |

    | dd | Copies files between media. |

    | rm | Removes files and directories. |

    | rmdir | Removes empty directories. |

    | mkdir | Makes directories. |'
