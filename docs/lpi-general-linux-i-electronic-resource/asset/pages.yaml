    # Maintaining Filesystem Integrity


    Once the filesystem is created, you can gather information about it and perform
    troubleshooting using three tools: df, du, and fsck. The first two information
    only and do not allow you to make any changes, but the latter can be a lifesaver
    in bringing down a system back up and operational once more.


    The df utility shows the amount of disk free across all filesystems. Table 7.2
    (shown on page 152) describes a output, of options or parameters you can use with
    the utility.


    For example, the default output, and results with specified options, resemble:


    ```

    $ df

