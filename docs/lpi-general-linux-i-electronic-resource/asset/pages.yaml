    as it does here.


    # dd


    You use the device-to-device (dd) utility to copy a file from one device to another.
    It goes beyond that in functionality, however, because it can convert a file during
    the copy process from one format to another. It can convert from EBCDIC to ASCII
    (and reverse), change uppercase to lowercase (and reverse as well), and work with
    bytes, blocks, or keywords.


    The most common use for dd is copying files to and from removable media, and you
    must use arguments, which can include:


    +   - bs—Block file size

    - if—Input file

    - of—Output file


    # Removing Files and Directories


    You can remove files you no longer need from the system with the rm (remove) command.
    Be careful using this command because Linux offers no undelete command or function
    like those found in other operating systems. The following examples illustrate
    how the rm command is used:


    ```

    $ ls -l file*

    -rw-r-- 1 root root 85 Aug 22 10:26 fileone

    -rw-r-- 1 root root 16432 Aug 28 13:43 filetwo

    $ rm fileone

    $ ls -l file*

    -rw-r-- 1 root root 16432 Aug 28 13:43 filetwo

    ```


    With the -i option, a prompt appears before each file to be deleted. Pressing
    Y deletes the file, and any other character skips. The following example illustrates
    the use of the -i option:


    ```

    $ ls -l t*

    -rw-r-- 1 root root 85 Aug 22 10:26 today

    -rw-r-- 1 root root 16432 Aug 28 13:43 tuesday

    ```'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# File Management 101


    ```

    $ rm -i t*

    rm: remove ''today''?

    ```


    The -f option forces deletion, and -v puts the utility in verbose mode. The -r
    or -R option recursively deletes directories (including subdirectories and files-beneath).
    To delete a file, you must have write permissions within the directory where it
    resides.


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_132_0.png)


    Be sure to remember that a write permission is required only on the directory
    from which you are deleting the file—not on the file itself.


    You can use a safer utility, rmdir, to delete directories that have nothing beneath
    them. It deletes only empty directories, so you cannot use it for directories
    that have files or subdirectories beneath them. The only option you can use with
    rmdir is -p to remove parent directories (if they are empty). In the next example,
    you will see how an empty directory cannot be deleted in this manner:


    ```

    $ ls -R kdlaney

    kudlaney:

    docs


    kudlaney/docs:

    attempt

    $

    n$ rmdir kdlaney

    rmdir: kdlaney: Directory not empty

    ```


    Because there is a file ("attempt") within kdlaney/docs and a subdirectory ("docs")
    beneath kdlaney, you cannot delete the directory kdlaney with the rmdir utility.
    You have three possible ways to accomplish the task:


    +   - Use the rm -r command.

    - Delete "attempt" with rm, delete "docs" with rmdir, and—finally—delete "kdlaney"
    with rmdir.

    - Delete "attempt" with rm, and then delete "kdlaney/docs" with rmdir -p.


    Because rmdir can delete only empty directories, it is naturally a safer utility
    to use than rm for cleaning a system.'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# Making Directories


    Because you''ve seen how to copy, move, and delete directories, the only order
    of business left is to make a directory: This is accomplished via the mkdir-command.
    Used without options, it creates a child directory (subdirectory) in the current
    directory. Two options work with it as well:


    +   - -m Specifies permissions other than the default for the new directory (covered
    in Chapter 8).


    +   - -p Creates a parent and child in one command.


    Some examples of the utility are:


    ```

    $ pwd

    /home

    $ mkdir edulaney

    $

    ```


    This created the subdirectory edulaney beneath /home (/home/edulaney). The next
    example illustrates the limitation of not being able to make multiple directories
    without using -p:


    ```

    $ pwd

    /home

    $ mkdir kdulaney/docs

    mdir: cannot make directory ''kdulaney/docs'': No such file or directory

    $

    $ mkdir -p kdulaney/docs

    $ cd kdulaney

    $ cd docs

    $

    ```


    In the first attempt, the utility fails because you cannot create multiple directories
    by default. Using the -p option, however, the multiple directories are created.'
  merge: -1
