    and does not utilize the /etc/shadow file. Provided the home directory exists,
    and the user is the owner of it (see the discussion of chown later in this chapter),
    the user becomes an authenticated user.


    A utility provided with Linux (most vendors also have their own utilities as well)
    to simplify this process is useradd. You must use options with the utility; a
    key one is -D to display default settings:


    ```

    $ useradd -D

    GROUP=100

    HOME=/home/%s

    SHELL=/bin/bash

