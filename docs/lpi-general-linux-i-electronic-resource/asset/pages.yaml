    Most of the other passes are self-explanatory, but the first requires further
    detail. An inode is a table entry that stores information about every file on
    the system. It is within the inode that information about the file is—in the same
    way that a phone book holds information about people within a city.


    Every item that appears in a directory listing has an inode associated with it.
    The inode holds the following types of information:


    +   * A unique inode number

    * The type of entry is (file, directory, pipe, and so on)

    * Permissions on the file in numerical format

    * The physical size of the file

    * The number of links to the entry (discussed later in this chapter)

    * The owner of the file

    * The group owning the file

    * Times of creation, modification, and access

    * A pointer to the actual location of the data on the disk


    The inode numbers begin with 1 and increment from them: Files copied during installation
    have small numbers and recently created files have much larger numbers. When files
    and directories are deleted, their associated inode number is marked as usable
    once more.'
