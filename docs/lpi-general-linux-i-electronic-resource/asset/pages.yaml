    To move an entity from one location to another, use the -r or -R option to move
    the directory recursively as well as any subdirectories and files beneath it.
    Other options you can include -f to force a copy without prompting (the opposite,
    so to speak of, -i); -u to copy only when the source file is more recent (updated)
