    removes the shadow file completely.


    # The su Utility


    The entries in the passwd file represent valid accounts that can log in. Any user
    can sit at the system and give the correct username and password combination to
    log in as that user. Any user already logged in can also use the su to change
    identity to another user if he knows the other user''s password. This creates
    a subshell, where one user becomes another and can revert back to his own identity
    by typing exit.


    Although there are dozens of harmful reasons why one user might want to become
    another, there are legitimate reasons as well. The command su without a username
    following it tries to make the user the superuser (root), which requires the password
    for that account. As an administrator, you can log in as a user without root permissions
    and begin your day. The lack of root permissions can be a blessing because it
    can keep you from deleting entries unintentionally typed, for example. When a
    user presents a problem, you can use su to become root—with all its rights and
    privileges if you have logged in as such—fix the problem, and then use exit to
    get back to your regular account.


    # Managing User Accounts


    Once an account is created, you can manage and modify it manually or through the
    use of utilities. For example, if a user named Karen Dulaney marries and changes
    her name to Karen Brooks, you can edit the passwd and shadow files and change
    the first field of each from kdulaney to kbrooks. Because the same UID stays in
    place, all files associated with her continue to remain. You can rename the home
    directory and make the change in passwd as.(The home directory and username should
    always match, for administrative purposes.)


    If Karen gets promoted to administration, it might be necessary to remove her
    from the users group and place her in the root group. You can do this by manually
    editing the /etc/passwd file and changing the GID field.


    Just as usadd can simplify the addition of users to the system—and avoid manual
    entries—usermod is meant to simplify changing existing values. You must use options
    or flags with the utility; the possibilities follow:


    +   - c—Replaces the descriptive text with a new value.


    +   -d—Alters the home directory.


    +   -e—Changes the password expiration date.'
