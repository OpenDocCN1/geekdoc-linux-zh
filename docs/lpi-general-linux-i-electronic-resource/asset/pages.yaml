  md: '# The Linux Filesystem 163


    the unique utilities and examines how they can be used to help find what we are
    looking for.


    The utilities to be examined, in order, are:


    +   - locate


    +   - updateddb


    +   - which


    +   - find (and a companion, xargs)


    The locate utility looks through a database file (instead of the actual directory
    tree) to find files that match a given name. The database is named locateddb and
    usually appears in a sub true of the /var directory. (Common locations include
    in /var/state or /var/lib.)


    You update the locateddb database through the use of the updateddb command. By
    default, updateddb runs on a regular basis (usually once a day), but you can run
    it manually as well. The advantage of using locate (and thus locateddb) is that
    it is much faster to search a database than to search the entire filesystem. The
    downside is that you cannot find files created after the last time updateddb was
    running using the locate utility.


    By default, updateddb moves through the filesystem and updates the locateddb with
    entries where it finds them. You can, however, create an optional file named updateddb.conf
    in the /etc directory. If the updateddb.conf file exists, then only directories
    listed in it are used to create the database.


    An example of the use of the locate command is:


