    part.


    By default, sed works by scanning each line in successive order. If it does not
    find a match after searching the entire line, it moves to the next. If it finds
    a match for the search text within the line, it makes the change and immediately
    moves on to examine the next line. This can provide some unexpected results. For
    example, suppose you want to change the word "new" to "old":


