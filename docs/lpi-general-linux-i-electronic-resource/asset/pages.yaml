  md: '# Working with grep sed 63


    and particularly the one cat ran away with all the catnip

    $


    In this instance, three-letter sequence "cat" appears in every line. Not only
    does "cat" appear in the second line, but also "cats" in the first, and "catnip"
    in the third—all matching the character sequence specified. If you are interested
    in "cat" but not "cats", the syntax becomes:


    ```

    $ grep [cat^s] garbage

    and particularly the one cat ran away with all the catnip

    $

    ```


    Table 4.1 Regular expression examples.

    | Rule | Characters | Search Result |

    | 1 | c (any character without a special purpose) | Matches "c" anywhere within
    the line. |

    |   | apple | Matches "apple" anywhere within the line. |

    | 2 | $ | Every line that has a carriage return (every line). |

    | 2 | \$ | Every line that contains a dollar sign. |

