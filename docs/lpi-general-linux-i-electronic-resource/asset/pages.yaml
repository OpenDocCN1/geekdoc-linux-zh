  md: '# Question 3


    You have a log file named OUTPUT that is written to every time a widget is produced.
    Your company is about to produce its 1,000th widget, and you want to know when
    it happens. Which of the following commands will you use to monitor the log file?


    +   - a. nl OUTPUT

    - b. tail +1000 OUTPUT

    - c. cat -A OUTPUT

    - d. tail -f OUTPUT


    The correct answer to this question is d because the key is that not only do you
    want to see the file, but you also want to monitor it. This answer will show the
    last 10 lines of the file and keep the monitoring open. Answer a will number the
    existing file but not monitor it. Answer b will display the entire file, beginning
    with line 1,000 and going to the end, and then finish—with no monitoring. Answer
    c will show the entire file and display nonprintable characters.


