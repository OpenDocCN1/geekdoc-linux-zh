- img_proc: true
  md: '# The Command Line


    To muddy the waters a bit, you can also use brackets [] to specify possible values.
    All the possible values must reside within the brackets, and the shell finds them
    individually:


    ```

    1s [de]*

    ```


    This example finds all entries that start with either “d” or “e” and contain an
    unlimited number of characters. To find only three-character entries that start
    with “d” or “e”, the command becomes:


    ```

    1s [de]??

    ```


    The number of characters you can supply within the brackets is virtually unlimited.
    Therefore, if you want to find all entries that fall with a lowercase letter instead
    of a number (or other character), you can use [abcdefghijklmnopqrstuvwxyz]. Be-cause
    this is a range, a much simpler way to signify it is [a-z], as in:


    ```

    1s [a-z]*

    ```


    The ranges need not be a complete set of all numbers or all characters (although
    they are easier to specify) and can include only a subset if need be. For example,
    if you want to look for only entries that fall within the range from “d” to “t”,
    you can use either [defghijkluvwxyz] or [d-t]. If the entry can be between the
    two values uppercase and lowercase, you can either use [DEFGHIQRSTUVWXYZabcdefghijklmnopqrstuvwxyz]
    or [D-Td-t].


    Some more examples include:


    +   All letters (uppercase and lowercase): [A-z]


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_48_0.png)


    [A-z] is the same as saying [A-Z] and [a-z].


    +   All numbers: [0-9]


    +   All letters and numbers: [A-z0-9]


    +   Not a number: [!-9]


    +   Not a letter: [!A-Z]'
