- img_proc: true
  md: '# Chapter 6


    In this chapter, you''ll learn utilities used to manage processes and you''ll
    see how processes are utilized for all transactions. Previous chapters discussed
    many utilities and commands; each one of them is issued, a process is started
    to carry out the request, as you will see in greater detail.


    # What Is a Process?


    Crucial to understanding this chapter is knowing that a process is any instance,
    command, or utility in execution. When you issue the command ls, as discussed
    in Chapter 5, a process is started to run the utility and return the results.


    Even the shell with which you are interacting is running as a process. When you
    give a command to be carried out, the shell checks whether it can do without any
    outside help. (Assume the shell is just an empty line: No other utilities are
    needed to return another prompt.) If your shell cannot perform the command, then
    it calls another process to perform the action. The other process called is a
    child to your shell, which becomes a parent to the new process (see Figure 6.1).


    When the shell is finished performing its task, it returns its results to the
    parent and then goes away. Because Linux is a multitasking operating system, there
    can be more than one child for any given parent. If the child cannot perform all
    of the tasks on its own (think of compiling an annual report), then the child
    might need to call one or more additional processes. When it does this, it becomes
    the parent to those child processes (see Figure 6.2).


    > For the exam, be sure to remember that, barring restrictions coded into it,
    every process has the ability to be a parent or child.


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_143_0.png)


    On a system, at any given time, there are processes that you are running, there
    can be processes that others are running, and there are processes that the system
    itself is running. The latter are often daemons—services that are running without
    interaction to provide functionality to the operating system. Examples of services
    that daemons perform include printing, running scheduled jobs, sending mail, monitoring
    run state, and so forth.


    # Working with ps


    The ps command is key to any interaction with processes and is used to show process
    status. When run by itself (with no options), it shows the processes you currently
    have running, with the last line always noting itself (because it is a running
    process as well):'
  merge: -1
  pgno: 143
- img_proc: true
  md: '![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_144_0.png)


    **Figure 6.1** When one process calls another, it becomes a parent to that child.


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_144_1.png)


    **Figure 6.2** Every child has the ability to call other processes and be a parent
    to them.


    ```

    $ ps

    PID TTY TIME CMD

    19605 pts/0 00:00:34 bash

    30089 pts/0 00:00:00 vi

    30425 pts/0 00:00:00 paste

    32040 pts/0 00:00:00 cat

    1183 pts/0 00:00:00 awk

    30679 pts/0 00:00:00 ps

    ```


    The first column is the process ID number (PID), a unique number assigned to every
    process that executes. When the system is booted, the processes begin incrementing
    until they reach a defined limit and then begin back through the numbering, using
    only the numbers that are free.


    The second column indicates the terminal upon which the user responsible for the
    process is associated. Because the list outlines processes only for the user issuing
    the command, all terminal listings should be the same.'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# Chapter 6


    The third column indicates the amount of processor time the process is utilizing.
    In most cases, processes can run quickly, sit idle, and so on and utilize very
    little time. A very high time reading can indicate a process that is dragging
    down the performance of the system.


    The fourth column is the name of the process (command) itself. The first line
    mentions the user''s shell—which must appear, or you would not have a user shell
    at all: The user''s shell is known as the session leader. The last line is the
    command just executed. Those entries in between are other processes that the user
    is running.


    The ps utility has a number of options to make it more flexible. The -a option
    removes obvious choices. For example, you know that you have a shell running or
    you could not be interacting with the system, so it isn''t really important to
    see it as the items others. Using the -a option, the display changes just slightly:


    ```

    $ ps -a

    PID TTY TIME CMD

    30089 pts/0 00:00:00 vi

    30425 pts/0 00:00:00 paste

    32040 pts/0 00:00:00 cat

    11834 pts/0 00:00:00 awk

    30685 pts/0 00:00:00 ps

    $

    ```


    > Be sure you remember that ps -a shows all processes associated with the current
    ty (terminal) except the session leader. Also note that the PID associated with
    ps increments every time it runs because each instance requires a new process.
    It does not increment by one, in this case, because several others run (possibly
    in the background) between the first and second running of ps.


    Using either the -A or the -e option (or everything), it is possible to see every
    process running and not just those linked to the current tty:


    ```

    $ ps -e

    PID TTY TIME CMD

    1 ? 00:00:05 init

    2 ? 00:00:39 kflushd

    3 ? 00:00:00 kpiod

    4 ? 00:00:15 kswapd

    5 ? 00:00:00 mdrecovery

    11635 ? 00:00:11 update

    12046 ? 00:00:00 syslog

    12049 ? 00:00:00 klogd

    ```


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_145_0.png)'
  merge: -1
