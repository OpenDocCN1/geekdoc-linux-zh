  md: '# Special Permissions


    You can use three special permissions in rare circumstances. Read, write, and
    execute always apply (or their absence is expressed), but sometimes you need to
    do more with a file or directory. The three special permissions are:


    +   - Set ID (SUID)


    +   - Set group ID (SGID)


    +   - Sticky bit


    These are discussed in the following sections.


    # SUID


    The Set user ID permission applies when you want a user to run an executable file
    that she normally cannot. For example, only the root user should be able to do
    function xyz (start backups, restores, log in other devices, and so on) because
    of the security ramifications, but you need the users to run a shell script to
    perform this action because you don''t have time to do it personally.


    You can create the shell script as root and set the SUID permission such that
    whoever runs the scripts becomes root only within the framework of that script.
    Before and after the script, she is merely a user, but the script runs as if being
    called by the root user.


    The numerical permission of SUID, 4000, is added to the value of other permissions.
    When applied, it changes the x in the execute field for the owner’s permission
    to an s:


    ```

    $ ls -l turbo2

    -rwsrxr-x 1 root root 542 Sep 9 20:02 turbo2

    $ chmod 4777 turbo2

    $ ls -l turbo2

    -rwsrxr-x 1 root root 542 Sep 9 20:02 turbo2

    $

    ```


    Remember: The value of using this permission is that the process runs as the owner
    of the person who created it (root, in this case) and not as the person executing
    it. The same operation in symbolic format is:


    ```

    chmod u+s turbo2

    ```'
