    system gets hit by fire.) In recent times, the definition has broadened to include
    technologies such as clusters.


    > You need a complete understanding of the basic definition of “backups” for the
    exam.


    Although the removable media can be anything from floppy disks to CD-RWs, most
    of the time tapes are the preferred medium. Most tapes allow you to store several
    gigabytes of data and provide a cheaper, more reusable media than other options.


    One of the first things to realize is that one tape, used and over, does not support
    a good backup strategy. You need to use multiple tapes, to be able to recover
    in the event of the failure of one, and rotate them. You need to store copies
    in safe locations, including off site (in case the entire building is blown away
    in a tornado). You should keep logs of what is on each tape so you can quickly
    identify what is there.


    > It is important to understand the difference between backups and archives. Archives
    are files that you copy from your system to elsewhere and that you would not put
    back on the system if it crashes. Backups are files that you need and would put
    back on if the system crashed.


    Several strategies dictate how you back up the data to tapes:


    +   - Daily—Copies all files changed each day to a tape.

    - Full—Copies all files.

    - Incremental—Copies all files added or changed since the last full or incremental
    backup.'
