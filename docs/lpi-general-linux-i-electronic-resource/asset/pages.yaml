  md: '# Chapter 1


    Exam taking is not something that most people anticipate eagerly, no matter how
    well prepared they might be. In most cases, familiarity helps to lessen anxiety.
    In plain English, this means you probably won''t be nervous when you take your
    fourth or fifth certification exam as you''ll be when you take your first.


    Whether it''s your first exam or yours, understanding the details of exam taking
    (how much time to spend on questions, the environment you will be, and so on)
    and the exam software will help you concentrate on the material rather than on
    the setting. Likewise, mastering a basic exam-taking skills should help you recognize—and
    perhaps outfox—some of the tricks and gotchas you''re bound to find in some of
    the exam questions.


    This chapter, besides the exam environment and software, describes some proven
    exam-taking strategies that you should be able to use to your advantage.


    # The Exam Situation


    When you arrive at the testing center where you scheduled your exam, you''ll sign
    in with an exam coordinator. He or she will ask you to show two forms of identification,
    one of which must be a photo ID, and both should have your signature. After you''ve
    signed in and your time slot arrives, you''ll be asked to deposit any books, pagers,
    cell phones, bags, and other items you brought with you. Then, you''ll be escorted
    into a closed room. The room will be furnished with anywhere from one to half
    a dozen computers, and each workstation will be separated from others by dividers
    designed to keep you from seeing what else''s happening.


    You''ll be furnished with a pen or pencil and a blank sheet of paper or, in some
    cases, an erasable plastic sheet and an eras felt-tip pen. You''re allowed to
    write down any information you want on both sides of this sheet. Before the exam,
    you should memorize as much of the material that appears on the Cram Sheet (inside
    the front cover of this book) as you can so you can write that information on
    the blank sheet as soon as you are seated in front of the computer. You can refer
    to your rendition of the Cram Sheet anytime you like during the test, but you''ll
    have to surrender the sheet when you leave the room.


    Most test rooms feature a wall with a large picture window. This permits the exam
    coordinator standing behind it to monitor the room, to prevent exam takers from
    talking to one another, and to observe anything out of the ordinary that might
    happen. The exam coordinator will have preloaded the appropriate Linux Professional
    Institute (LPI) certification exam—for this book, that''s the LPI 101 Certification
    Exam—and you''ll be permitted to start as soon as you are seated in front of the
    computer.'
  merge: -1
