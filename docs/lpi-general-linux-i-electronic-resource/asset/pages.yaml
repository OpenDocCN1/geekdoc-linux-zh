    # Working with Hard Disks


    To use a hard disk with Linux (and every operating system), the disk must have
    at least one partition. A partition is a portion of the disk (some or all) that
    has been properly formatted for storing data. Although the hard drive must have
    a minimum of one primary partition, it can have up to a total of four partitions
    with a DOS-style partition table (the default). Each partition must be formatted
    before use. A partition must be a primary partition for the operating system to
    be able to boot from it.


    A primary partition (only one) can be further subdivided into extended partitions,
    known as logical drives. Using DOS-style partitions, you can create up to four
    logical drives from a primary partition, but none of them are bootable by the
    operating system.


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_176_0.png)


    > You should remember that the maximum number of primary partitions you can have
    is four. The maximum number of partitions you can have when mixing and matching
    primary and extended is three partitions and four logical drives (for a grand
    total of seven).


    The theoretical limit is 15 partitions on SCSI (Small Computer System Interface)
    disks and 63 on IDE (Integrated Drive Electronics). The limitations mentioned
    previously are enforced with a DOS-style partition table.


    All partitions must be referenced in the /dev directory, and the first partition
    on the first disk is either of the following:


    +   - hda1—for IDE

    - sda1—for SCSI


    *'
