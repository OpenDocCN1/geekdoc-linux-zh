- img_proc: true
  md: '![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_316_0.png)


    # Sample Test


    In this chapter, I provide pointers to help you develop a successful test-taking
    strategy, including how to choose proper answers, how to decode ambiguity, how
    to work within the LPI testing framework, how to decide what you need to memorize,
    and how to prepare for the test. At the end of the chapter, I include 70 questions
    on subject matter pertinent to the LPI 101 Certification Exam. Good luck!'
  merge: -1
  pgno: 316
- img_proc: true
  md: '# Questions, Questions, Questions


    You should have no doubt in your mind that you are facing a test full of specific
    and pointed questions. The LPI Exam 101 that you take include 52 questions, and
    you will be allotted 90 minutes to complete the exam.


    Questions for the LPI test belong to one of three types:


    +   - Multiple choice with a single answer

    - Multiple choice with multiple answers

    - Fill in the blank


    Always take the time to read a question at least twice before selecting an answer
    and always look for an Exhibit button as you examine each question. Exhibits include
    graphics related to a question. An exhibit is a screen capture of program output
    or GUI (graphical user interface) information that you must examine to analyze
    the question''s contents and formulate an answer. The Exhibit brings up graphs
    and charts to help explain a question, provide additional data, or illustrate
    layout or program behavior.


    Not every question has only one answer; many questions require multiple answers.
    Therefore, you should read each question carefully, determine how many answers
    are necessary or possible, and look for additional hints or instructions when
    selecting answers. Such instructions occur in brackets immediately following the
    question itself.


    # Picking Proper Answers


    Obviously, the only way to pass any exam is to select enough of the right answers
    to obtain a passing score. LPI exams are not standardized, however, as the SAT
    and GRE exams are; they are far more diabolical and convoluted. In some cases,
    questions are strangely worded, and deciphering them can be a real challenge.
    In such cases, you might need to rely on answer-elimination skills. Almost always,
    at least one answer for a question can be eliminated immediately because it matches
    one of these conditions:


    +   - The answer does not apply to the situation.

    - The answer describes a nonexistent issue, an invalid option, or an imaginary
    state.

    - The answer can be eliminated because of information in the question itself.'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# Sample Test 27


    After you eliminate all answers that are obviously wrong, you can apply your retained
    knowledge to eliminate further answers. Look for items that sound correct but
    refer to actions, commands, or features that are not present or are not available
    in the situation you describes.


    If you''re still faced with a blind guess among two or more potentially correct
    answers, reread the question. Try to picture how each of the remaining answers
    would alter the situation. Be especially sensitive to terminology; sometimes the
    choice of words (remove instead of disable) can make the difference between a
    right answer and a wrong one.


    Only after you''ve exhausted your of the remaining possibilities to eliminate
    answers but remain unclear about which you should guess at an answer. An unanswered
    question offers no points, guessing gives you at least some chance of getting
    a question right; just don''t be too hasty when making a blind guess.


    > You can wait until the last round of reviewing marked questions (just as you''re
    about to run out of time or out of unanswered questions) before you start making
    guesses. Guessing should be a last resort, however.


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_318_0.png)


    # Decoding Ambiguity


    LPI''s exams have a reputation for including questions that are difficult to interpret,
    confusing, or ambiguous. The only way to beat LPI at its own game is to be prepared.
    You''ll discover that many exam questions test your knowledge of things that are
    not directly related to the issue raised by a question. This means the answers
    you must choose from, even incorrect ones, are just as much part of the skill
    assessment as the question itself.


    Questions often give away their answers, but you have to be Sherlock Holmes to
    see the clues. Often, subtle hints irrelevant in the question text in such a way
    that they seem almost. You must realize that each question is a test unto itself
    and you need to inspect and successfully navigate each question to pass the exam.
    For small clues, such as one question toward the end of the exam that states the
    answer to a question that appeared earlier in the exam. Little things can point
    to the right answer if properly understood; if missed, they can leave you facing
    a blind guess.


    Another common difficulty with certification exams is vocabulary. Be sure to brush
    up on the key terms presented in the Glossary at the end of this book day before
    you take the test.'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# Working within the Framework


    The test questions appear in random order, and many elements or issues that receive
    mention in one question might also crop up in other questions. It''s not uncommon
    to find that an incorrect answer to one question is the answer to another question,
    and vice versa. The time to read every answer to each question, even if you recognize
    the answer to question immediately. That extra reading might spark a memory or
    remind you about a feature or function that helps you on another question elsewhere
    in the exam.


    Don''t forget that you can revisit any question as many times as you like. If
    you''re uncertain of the answer to a question, check the box that provided so
    you can return to it. You should also mark questions that you think might offer
    information that you can use to answer other questions. On fixed-length tests,
    I have usually marked somewhere between 25 and 50 percent of the questions on
    the exams I have taken. The testing software is designed to let you mark every
    question you choose; use this framework to your advantage. Everything you want
    to see again should be marked; the testing software can then help you return to
    marked questions quickly and easily.


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_319_0.png)


    For fixed-length tests, I strongly recommend that you first read through the entire
    test before getting caught up in answering individual questions. This will help
    jog your memory as you review the questions and help identify questions that you
    want to mark for easy access to their contents. It will also let you identify
    and mark the tricky questions for easy return as well. The key is to make a quick
    pass over the territory to begin—so that you know what you''re up against—and
    to survey that territory thoroughly on a second pass, when you can begin to answer
    all questions systematically and consistently.


    If you see something in a question or one of the answers that jogs your memory
    on a topic, you should record if the topic appears in another question, write
    it down on your piece of paper.


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_319_1.png)


    Don''t be afraid to take notes on what you see in various questions. Sometimes,
    what you record from one question—especially if it''s not as familiar as it should
    be—or reminds you of a name or use of some network device, utility, or network
    interface details—can help you on other questions later on.


    The amount of memorization you must undertake for an exam depends on how well
    you remember what you read and how you know the material by heart. If you''re
    a visual thinker and can see a command line and how all the'
  merge: -1
  pgno: 319
- img_proc: true
  md: 'components of the operating system interact with each other in your head, you
    won''t need to memorize us as someone who''s less visually oriented. How-ever,
    the exam will stretch your abilities to memorize operating system features and
    utilities, including options and troubleshooting.


    At a minimum, you should memorize the following kinds of information:


    +   - The different files needed to boot

    - The core command-line utilities for working with files

    - The fundamentals of the filesystem hierarchy

    - The different runlevels and how to obtain them

    - How to work with documentation and provide support

    - Troubleshooting the system


    Don''t forget that the Cram Sheet at the front of the book is designed to capture
    the material that''s most important to memorize; use this to guide your studies
    as well.


    # Preparing for the Test


    The best way to prepare for the test—after you''ve studied—is to take at least
    one practice exam. I have included one here in this chapter for that reason. The
    test questions are located in the pages that follow, and unlike the preceding
    chapters in this book, the answers don''t follow the questions immediately; you''ll
    have to flip to Chapter 14 to review the answers separately.


    Give yourself 90 minutes to take this exam, and keep yourself on the hour system—don''t
    look back at the text in the book or jump ahead to the Answer Key. When your time
    is up or you''ve finished the questions, you can check your work. Pay special
    attention to the explanations for the incorrect answers; these can also help reinforce
    your knowledge of the material. Knowing how to correct answers is good, but understanding
    why incorrect answers are wrong can be equally valuable.


    # Taking the Test


    Relax. Once you''re sitting in front of the testing computer, there''s nothing
    you can do to increase your knowledge or preparation. Take a deep breath, stretch,
    and start reading that first question.


    You don''t need to rush, either. You have plenty of time to complete each question
    and return to those questions that you skip or mark for return. If you read a
    question twice and remain clueless, you can mark it if you''re taking a fixed-length'
  merge: -1
  pgno: 320
- img_proc: true
  md: 'test. Don''t spend more than 5 minutes on any single question—if it takes you
    that long to get nowhere, it''s time to guess and move on.


    You can read through the entire test and, before returning to marked questions
    for a second visit, you can figure out how much time you''ve got per question.
    As you answer each question, remove its mark. Continue to review the remaining
    marked questions until you either run out of time or complete the test.


    Set a maximum time limit for questions and watch your time on long or complex
    questions. If you hit your limit, it''s time to guess and move on. Don''t deprive
    yourself of the opportunity to see more questions by taking too long to puzzle
    over questions, unless you think you can figure out the answer. Otherwise, you''re
    limiting your opportunity to pass.


    That''s it for pointers. Here are some questions for you to practice on.'
  merge: -1
