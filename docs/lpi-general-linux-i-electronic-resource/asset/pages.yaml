    # Related Utilities


    Backup utilities allow you to copy files from the system to the backup media or
    vice versa. Some utilities are designed to reduce or compress data so that it
    takes up less space. The most common of these are gzip (to compress) and gunzip
    (to uncompress). You can see the contents of the gzip file (without uncompressing)
    by using the zcat utility in place of cat.


    Two other utility exist on some systems are:


    +   * pack (and its counterpart, unpack)


    +   * compress (and its counterpart, uncompress)


    # Utility Summation


    This chapter discussed only a handful of utilities. Table 11.3 lists them and
    their purposes.


    | Table 11.3 Utilities discussed in this chapter. |

    | Utility | Purpose |

    | lastlog | Shows the last time each user logged on. |

    | logger | Writes an event in the log file. |

    | logrotate | Automates administration to log files. |

    | pidof | Identifies the PID number of a process. |

    | at | Runs commands at a different time. |

    | atq | Sees what at jobs are spooled to run. |

    | atm | Removes at before they run. |

    | crontab | Creates and edits a crontab file. |

    | tar | Copies files to or from a tape. |

    | cpio | Copies files and from one location to another. |

    | gzip/gunzip | Compresses/uncompresses files. |

    | pack/unpack | Compresses/uncompresses files. |

    | compress/uncompress | Compresses/uncompresses files. |'
