    # fgrep


    The first attempt to greatly enhance grep was fgrep—as in either "file grep" or
    "fast grep." This utility was created in the days of Unix, prior to Linux. It
    enhanced grep by adding the ability to search for more one item at a time (something
    that grep has gained since with the -f option). The tradeoff for gaining the ability
    to search for multiple items was an inability to use regular expressions—never
    mind what the acronym stood for.


    Adding this functionality to grep, and facing the inability to use regular expressions
    here, fgrep still exists but is rarely used in place of grep. In fact, one of
    the options added to grep is -F, which forces it to interpret the string as a
    simple string and work as fgrep does (the default action is -G for basic regular
    expressions).'
