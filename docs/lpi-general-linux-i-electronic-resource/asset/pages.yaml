- img_proc: true
  md: '$ tail -1 /group

    sales::101:edulaney


    The exclamation mark appears in the second field as a placeholder to identify
    that other users can join. You can remove it by again issuing the -r command.
    If you attempt to add a nonexistent user using the -a option, the utility fails.
    If you attempt to add users to a nonexistent user, the utility fails. You cannot
    delete more than one user at a time with gpasswd.


    You can use the -A option in place of -a if the user you are adding will act as
    administrator for the group. To specify an administrator, you must use shadow
    passwords for the group file. Shadow passwords are stored in /etc/gshadow and
    add an additional level of security because this file is readable only by root
    (whereas /etc/group is readable by all).


    The simplest way to convert group passwords to the gshadow file is to use the
    grconv utility. This tool extracts data from the second field of the group file,
    replaces it with an "x", and creates the gshadow file. The gshadow file consists
    of four fields per entry, in the format:


    Group name:password:administrator:users


    The sequence of events for adding additional users and declaring an administrator-
    is:


    ```

    $ tail -1 /group

    sales::101:edulaney

    $ gpasswd -a kristen sales

    $ gpasswd -a kerby sales

