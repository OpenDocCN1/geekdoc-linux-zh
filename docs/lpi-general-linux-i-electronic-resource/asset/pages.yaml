    TestPro errors filetwo mischie* sample

    brio example Friday myfile sample of the world*

    dulaney example2 garbage numbers simplimon

    eRRRs junk1 pull snapshot01.gif

    ```


    Entries without any trailing characters are standard files. Entries with a "/"
    on the end—such as Desktop/—are directories. Those with a trailing asterisk (\*)
    are executable.


    Another useful option is -a, which shows all files. By default, hidden files are
    not displayed by ls. A hidden file is any that has a period (.), as its first
    character:


    ```

    . Desktop emmett filethree junk2 questions

    TestPro errors filetwo mischief sample

