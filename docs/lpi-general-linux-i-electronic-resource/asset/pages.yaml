    # Removing Users


    When a user account is no longer needed, you can deal with the situation in a
    number of ways. The first question you must address is why the account is no longer
    needed. Once you know that, you can formulate a plan for dealing with it. Table
    8.2 offers several scenarios and methods of proceeding.


    | Table 8.2 Disabling and removing accounts. |

    | Perceived Reason for Not Needing Account | Proposed Solution |

    | --- | --- |

    | User has been temporarily transferred to Siberia. | For a temporary situation,
    you do not want to delete the account; so doing removes all references that might
    be needed later. To disable the account temporarily, edit the /etc/passwd file
    and place a pound sign (#) at the beginning of the line. This makes the entire
    line a comment and disables the account. Alternatively, you could place a period
    or similar character in the second field of /etc/passwd, which makes the password
    unusable and effectively disables the account. |

    | User''s password has been jeopardized by a hacker. | Change the password to
    another value. For greater security, change the login name and home directory.
    |

    | User has left the organization. | Remove the account from /etc/passwd and /etc/shadow
    and delete the home directory. |'
