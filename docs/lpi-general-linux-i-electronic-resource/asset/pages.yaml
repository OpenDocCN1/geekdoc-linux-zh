  md: '# Documentation 229


    in /usr/sbin. To see the second set of documentation instead of the first, the
    command is:


    man 2 nice


    which specifies that you want the documentation for nice from the man2 directory.
    (You use 3 for man3, 4 for man4, and so on.)


    Lines 4, 7, 11, and 29 of the manual file begin sections for Names, Synopsis,
    Description, and Options, respectively. Based upon the complexity of the utility
    and other features, you can also see sections for See Algo, Diagnostics, Files,
    Bugs, and History. Occasionally, you might also see an Author section, but it
    is rare.


    Line 5 is a short synopsis of what the utility does and matches the line returned
    by the whatis utility. Lines 8 and 9 describe the options you can use, and lines
    30 through 41 provide more detail on the workings of each.


    To conserve space, however, the manual files are stored in compressed format;
    each time you run one, the entry is written to /var/catman to allow the utility
    to display the page more quickly the next time you request that entry (because
    it doesn''t have to reformat). Beneath /var/catman is a subdirectory for each
    man which is where you can find manual files that have been requested.


    Various options you can use with man (which can be ascertained with the command
    man man) include:


    +   - Displays all pages matching the text given and does not quit after the first.
    (Matches are found by checking the subdirectories, not with the whatis database).

    - Uses different configuration parameters for the display.

    - Searches files for a term in all the manual pages and shows the title page of
    each match is found. This is the most global search you can do.

    - k shows all the manual pages with the same name (as found in the whatis database)
