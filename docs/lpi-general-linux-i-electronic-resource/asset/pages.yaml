  md: '# Introduction


    Welcome to LPI General Linux I Exam Cram! This book aims to help you get ready
    to take—and pass—the LPI certification 101 exam. This Introduction explains LPI''s
    certification programs in general and talks about how the Exam Cram series can
    help you prepare for LPI''s certification exams.


    Exam Cram books help you understand and appreciate the subjects and materials
    you need to pass test. Exam Cram books are aimed strictly at test preparation
    and review. In this book, I do not teach you everything you need to know about
    a topic (such as the ins and outs of building your own servers). Instead, I present
    and discuss the questions and problems I''ve found that you''re likely to encounter
    on a test. I''ve worked from LPI''s, preparation, guides, and tests. My aim is
    to bring together as much information as possible about LPI certification exams.


    Nevertheless, to prepare yourself completely for any LPI test, you should begin
    by taking the Self-Assessment included in this book (immediately following this
    Introduction). This tool will help you evaluate your knowledge base against the
    requirements for the actual exam under both ideal and real circumstances.


    Based on what you learn from that exercise, you might decide to begin your studies
    with some classroom training, or you might pick up and read one of the many LPI
    guides available from third-party vendors. I strongly recommend that you also
    install and configure the software and tools that will be tested on, because nothing
    beats hands-on experience and familiarity when it comes to understanding the questions
    you''re likely to encounter on a certification test. Book learning is essential,
    but hands-on experience is the best teacher of all.


    # The Linux Professional Institute Certification (LPIC) Program


    LPI certification is made up of three levels, with each level consisting of exams.
    There is no time limit upon the exams must be taken or an order in which they
    must be taken, but you must pass both of the exams within each level to be certified
    at that level.'
