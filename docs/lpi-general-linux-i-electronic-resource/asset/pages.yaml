  md: '# bg


    the opposite of the foreground (fg) command is the background (bg) command, which
    allows you to move a job running in the foreground to the background. Before you
    can do so, however, you must suspend the job (to get the prompt back).


    You suspend a job by pressing the keyboard sequence equal to the susp signal—Ctrl+Z,
    by default. When suspended, the job stops and does not start again until moved
    into the foreground or background:


    ```

    $ sleep 180

    (Ctrl+Z pressed)

    [5]+ Stopped

    sleep 180

    ```


    Issuing the bg command now moves the job into the background and changes the status
    to running.


    # Changing Priorities


    When a process starts, it does so at a default priority of zero. This puts it
    at an even keel with all other processes competing for attention from the CPU
    and other resources. You can change processes'' priorities through the use of
    two utilities.


    # nice


    You can start processes at different priorities using the nice utility. You can
    use nice with 40 different levels (half negative and half positive), including:


    +   - 19 (lowest priority)

    - 0 (default priority)

    - -20 (highest priority)


    A normal user can use only the negative numbers, meaning he can only lower a process
    and not raise it. You can also specify an increment (the default is 10) with the
    -n option, and nice uses it to change the priority over time. The root user (superuser)
    has the ability to raise a priority (give a negative increment), but no other
    user can.


    > Keep in mind that only the superuser can give negative values.


    If you give only the nice command, it shows the scheduling priority used by default.'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# renice


    You can use the nice utility only when starting a process, not with a process
    already running. That is when the renice utility comes into play. The utility
    uses the same priorities available to nice and is followed by one of three options:


    +   -p—For PIDs

    -g—For a process group

    -u—For a group associated with a user


    # tee for Two


    A miscellaneous utility that really stands alone, and does not fit well with any
    section, is tee. This utility, as name implies, sends output in two directions.
    The default for most processes is to write their output to the screen. Using redirection
    (>), you can divert the output to a file, but what if you want to do both?


    The tee utility lets you send to the screen and to a file as well. The utility
    must always be followed by the name of the file that you want output to write:


    ```

    $ ps -f | tee example

    UID      PID   PPID  C START TTY           TIME

    root    19605 19603 0 Aug01 pts/0       00:00:34 bash

    root    30089 19605 0 Aug20 pts/0       00:00:00 fileone

