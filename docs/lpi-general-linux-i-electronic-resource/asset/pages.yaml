  md: '# The Command Line 29


    You can use the test utility in conjunction with $ to test almost anything. For
    example, to test whether a file exists and is readable, use the combination:


    ```

    test -r snapshot01.gif

    echo $?

    ```


    Find the complete syntax for all the test options by typing man test.


    We talked about >, >>, < in this chapter, but not <<. The less-than signs are
    known simply as “here” and signify processing is to wait until the string following
    them is given as a PS2 prompt on a line to itself. For example:


    ```

    cat << litter

    ```


    accepts input at a PS2 prompt until the string “litter” is entered on a line by
    itself.


    # Metacharacter Summation


    We have discussed a great many special characters in this chapter. Table 2.2 lists
    them and their purposes as given within this chapter.


    | Table 2.2 Shell characters with special meanings. |

    | Metacharacter | Meaning |

    | '' | Cancels the special meaning of anything but the back quote. |

    | " | Cancels the special meaning of most characters. |

    | $ | Treats the next string as a variable. |

    | $() | Allows a command to be treated as a variable. |

    | * | Substitutes any number of characters. |

    | ; | Treats as dissimilar commands. |

    | ? | Substitutes any single character. |

    | [] | Substitutes any of the enclosed characters. |

    | \ | Treats the next character literally. |

    | " | Executes the enclosed command. |

    | | | Allows one command''s output to be the next command''s input. |

    | < | Uses input redirection. |

    | << | Treats as “Here” document. |

    | > | Redirects output. |

    | >> | Appends output. |'
