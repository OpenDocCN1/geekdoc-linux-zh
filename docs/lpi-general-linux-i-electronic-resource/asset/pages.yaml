  md: '# Question 6


    Julio has decided that the system is excessively boggedged down each night by
    too many users running at jobs. He has decided to create an at.allow file and
    place only those users who truly need to run future jobs in that file. In what
    directory must he store the at.allow file?


    +   - a. /bin

    - b. /boot

    - c. /dev

    - d. /etc

    - e. /home

    - f. /root

    - g. /sbin

    - h. /tmp

    - i. /usr

    - j. /var


    The correct answer to this question is d. Both the at.allow and at.deny files
    need to be beneath the /etc directory to be active. This same directory is used
    for cron.allow and cron.deny files if they are needed as well. The /bin directory
    (answer a) holds binary files. The /boot directory (answer b) holds the boot files.
    The /dev directory (answer c) holds the device definitions. The /home directory
    (answer e) holds the user''s home directories (all except root). The root user''s
    home directory is /root (answer f). The /sbin directory (answer g) holds system
    executables. The /tmp directory (answer h) is used for files that are of temporary
    nature. The /usr directory (answer i) holds user resources, and the /var directory
    (answer j) is used for log files and variable data.'
