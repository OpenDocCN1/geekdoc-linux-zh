    # File and Directory Permissions


    Permissions determine who can and cannot access files and directories, as well
    as what type of access they have. The first 10 characters of an ls -l listing
    of any entity resemble the following:


    ```

    -rw-rw-r--

    ```


    The first character identifies the type of entity: - for a standard file, d for
    directory, b for a block device (such as a tape drive), c for a character device,
    l for a link, or p for a pipe. The remaining nine characters fit into three groups,
    as shown in Figure 8.1.


    When a user attempts to access a file, the first check confirms whether she is
    the owner of the file. If she is, the first set of permissions applies to her.
    If she is not, a check confirms whether she is a member of the group owning the
    file. If she is a member of the group, the middle set of permissions applies to
    her. If she is not the owner of the file, and not a member of the owning group,
    then the third set of permissions applies to her.'
  merge: -1
  pgno: 221
- img_proc: true
  md: '![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_222_0.png)


    **Figure 8.1** Permissions are shown divided into three sections.


    # # Standard Permissions


    The available permissions you can assign to an entity—owner, group, or other—are:


    +   * r—Enables you to read a file. This is the only permission you need to copy
    a file as well. When applied to a directory, it grants the ability to read (see)
    the files within the directory.


    +   * w—Enables you to write a file. Writing allows you to change the contents,
    modify, overwrite, and so on. When applied to a directory, it allows you to delete
    and move files within the directory (even if you don''t specifically have write
    permission for an individual file).


    +   * x—Executes the file if it contains scripts or can otherwise be run by the
    system. On a directory, it allows you to change to that directory. When applied
    in conjunction with read permissions on a directory, it allows you to search the
    directory.


    +   * (dash)—Indicates the absence of a permission. For example, r-x indicates
    that the user can read and execute but not write.


    The 10 fields in the permissions are:


    +   * The type of entity (file, directory, and so on)


    +   * Whether the owner can read


    +   * Whether the owner can write


    +   * Whether the owner can execute


    +   * Whether the group can read


    +   * Whether the group can write


    +   * Whether the group can execute


    +   * Whether others (not the group or owner) can read


    +   * Whether others can write


    +   * Whether others can execute'
