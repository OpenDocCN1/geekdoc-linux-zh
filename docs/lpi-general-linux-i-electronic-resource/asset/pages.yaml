    # # Absolute and Relative Addressing


    The two methods of specifying paths to anything—files, directories, and so on—are
    absolute and relative. When you give an absolute path, you assume nothing, and
    you give a value that is always true. When you give a relative path, you take
    into account where you are currently, and you give a path relative to that location.


    To use an analogy, suppose two people live in the same city and state: Muncie,
    Indiana. The first person lives at 1909 Rosewood, and the second person lives
    at 4104 Peachtree Lane. If the first person wants to find and visit the second
    person, she can find out where he is via an absolute path known as the mailing
    address: 4104 Peachtree Lane, Muncie, IN 47304.


    This address says she should:


    +   1. Find Indiana.

    2. Within Indiana, find Muncie.

    3. Within Muncie, find the section of the city within the 47304 zip code.

    4. Within all earlier confines, find Peachtree Lane.

    5. On Peachtree Lane, go to house number 4104.


    > Be sure to remember that absolute addresses never change and point to the entity
    regardless of where you are coming from.


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_122_0.png)


    The absolute address is the same whether the person coming to visit lives in Muncie
    or Alaska. Because the first person does live in Muncie, however, you can also
    tell her how to reach her destination using relative addressing:


    +   1. Take Rosewood to Bethel, and turn left.'
