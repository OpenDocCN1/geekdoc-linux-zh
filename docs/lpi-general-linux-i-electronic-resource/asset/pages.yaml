    # sed


    The name "sed" is an acronym for "stream editor," which is as accurate as description.
    The utility accepts input (text) to flow through it like a river or stream. It
    edits text and makes changes to it based upon the parameters it has given. The
    syntax for sed is:


    ```

    sed (options) {commands} filename

    ```


    The number of options is limited, but the commands are numerous. Accepted options
    are:


    +   -e—Specifies a command to execute.

    -f—Specifies a file in which to find commands

    -n—Runs in quiet mode.


    The best way to understand the commands is to examine a few examples. One of the
    simplest commands to give sed, or any editor, is to substitute one string for
    another. You accomplish this with the s (for substitute) command, followed by
    a'
