    # The lib Directory


    Shared library files needed by binaries (such as those in the /bin directory)
    are

    located in the /lib directory and subdirectories beneath it. Generally, the libraries\consist
    of executables written in the C language.


    # The mnt Directory


    The mnt directory holds external filesystems that are mounted (discussed later
    in

    this chapter). The entities that appear within this directory are never on this

    filesystem, but rather represent external resources that can be linked to and

    accessed from /mnt. The external resources can be other filesystems or devices.


    The devices appear as directories with common names (cdrom, floppy, and so

    on). The tmp directory within /mnt is intended to hold temporary files, but

    the use of /tmp is preferred.'
