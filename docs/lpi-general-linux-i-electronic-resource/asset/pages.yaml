  md: '# SGID


    Similar in nature to SUID, the Set group ID permission applies when you need

    t person executing the file to be a member of the group owning the file (and

    ot the owner). This changes the x in the group permission to an s, and the

    numerical value is 2000:


    ```

    $ ls -l turbo2

    -rwrwxrwx 1 root root 542 Sep 9 20:02 turbo2

    $ chmod 2777 turbo2

    $ ls -l turbo2

    -rwrwxrwx 1 root root 542 Sep 9 20:02 turbo2

    ```


    In symbolic syntax, the command is:


    ```

    chmod g+s turbo2

    ```


    # Sticky Bit


    This last permission does not work as the other special permissions do. With a

    numeric value of 1000, its operations differ when applied to a directory versus
    a

    file. When applied to a directory, it prevents users from deleting files from
    folders

    that grant them the permission unless they are the owner of the file. By

    default, any user who has write permission to a directory can delete files within

    that directory even if he doesn''t have write permission to that file.


    When applied to a file, the file becomes “sticky”. The first time the file is
    run or

    ccessed, and loaded into memory, it stays loaded into memory or swap space so

    it can run faster if it would read from the drive.


    If the file is not executable, the last permission bit (x for the other category)

    comes T.If the file is an executable file, or the permission applies to a directory,

    t last bit becomes a t. When you apply the permission via chmod and symbolic

    letters, the t appears regardless of the type of entity being changed.


