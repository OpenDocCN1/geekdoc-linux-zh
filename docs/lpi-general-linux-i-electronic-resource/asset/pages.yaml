    # Working with Quotas


    Quotas limit the amount of space available to a user or group. By default, Linux
    does not impose any quotas, so each user is limited in the amount of hard disk
    space she can consume only by the amount of space available on the system.


    When used, quotas must be applied per partition, which offers flexibility in that
    the level applied to one partition can differ from that applied to any other.
    For example, you can apply quotas on a partition listing kristin to 7MB, evan
    to 5MB, and spencer to 3MB. This gives the three users a total of 15MB of storage
    space. If, they all belong to the sales group, which is limited to 10MB, then
    one or more of the users will not be able to store files after the 10MB limit
    is reached even though she has room left within the individual quota.


    To turn on quotas, you must edit the /etc/fstab file. A current entry within the
    file would:


    ```

    /dev/hda3 home ext2 defaults 1 2

    ```


    The first field is the filesystem, and the second is the mount point. The third
    field is the filesystem type, and the fourth contains options for the filesystem.
    The fifth field identifies the order in which the filesystem would be used by
    a dump, and the sixth field is the order in which fsck would use it.


    You make a modification to the fourth field to use quotas, changing the line to
    read:


    ```

    /dev/hda3 home ext2 defaults,usrquota 1 2

    ```'
  merge: -1
  pgno: 192
- img_proc: true
  md: '# Chapter 7


    In some cases, it might be necessary for the kernel to be recompiled to support
    quotas, but not always. After the file is edited, go to the root of the partition
    where you want to apply the quota. As the root user, create a file named either
    quota.user or quota.group. The permissions on the file must be equal to read and
    write by the root only (accomplished with the chmod command, which is discussed
    fully in Chapter 8). Thus, the sequence following the command is:


    ```

    $ touch quota.user

    $ chmod 600 quota.user

    ```


    You must then reboot. The utilities you can use are:


    +   - quotaon—Enables the use of quotas. You can use the -a option to enable for
    every filesystem usquotquot in /etc/fstab; otherwise, you must specify the filesystem.

    - quotaoff—Disables the use of the quotas.

    - edquota—Edits and changes the quota limits. You can use the -u option to specify
    a user or -g to specify a group. You can use the -t option for a "soft limit."

    - repquota—Generates a report of disk usage and the specified quota (created with
    edquota). Options with this tool include -a to check all filesystems in /etc/fstab;
    -g to see the report for groups; -u to see the report for users (default); -v
    to see numbers even if they are zero. Any user can run this utility to see her
    own numbers, but root sees the report for all users.

    - quota—Shows the quotas in existence (similar to repquota). Any user can see
    his own, and root can see all.

    - quotacheck—Scans the system and creates report files with the current usage
    (only available to root).

    - quotatats—Shows the amount of used space for each individual user and group.


    Note: Not all the utilities are available in all implementations of Linux.


    By default, when a user or group reaches the quota limit, it is no longer allowed
    to save any further entries. Setting a soft limit means she can exceed the limit,
    but only for a short period of time (defined as a grace period, the default is
    7 days).


    # Finding Files


    Among all files and all the different directories and subdirectories on a system,
    finding something specific can sometimes be a daunting task. A number of utilities
    in Linux can help ease this burden. This section outlines a few of'
  merge: -1
