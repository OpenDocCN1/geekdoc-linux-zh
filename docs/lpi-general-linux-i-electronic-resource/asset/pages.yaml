    # Creating User Accounts


    You can create new users manually or by using utilities. To do so manually, simply
    append an entry to the /etc/passwd file. (It is strongly recommended that you
    make a backup copy of the file before changing it.) You can leave the password
    field blank and then assign a password using the passwd utility. If you leave
    it blank, it is a valid account without a password:


    ```

    $ cat /etc/passwd

    evan::504:100:EvanD:/home/evan:/bin/bash

    (Press Ctrl+D)

    $

    $ passwd evan

    New user password: (Enter password)

    Retype new user password: (Enter password again)

    passwd: all authentication tokens updated successfully

    $

    $ tail -1 /etc/passwd

    evanKv.fLWG/Ig:504:100/home/evan:/bin/bash

    $

    ```


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_210_0.png)


    > Any user can use the passwd utility to change her own password in the /etc/passwd
    file Only the root user, however, can use it to change the password of another
    user.


