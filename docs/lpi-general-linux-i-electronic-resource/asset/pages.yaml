- img_proc: true
  md: '# Command Aliasing


    Although the operating system and shell offer a plethora of commands and utilities,
    you can create aliases that make more sense to you or that shorten the number
    of characters you have to type. For example, if you are familiar with the command
    line of Windows-based operating systems, you are accustomed to typing dir to see
    what files are there. A similar operation in Linux is possible with ls -l. You
    can create an alias so you can type dir to run ls -l by using the following syntax:


    ```

    alias dir="ls -l"

    ```


    The syntax is always the alias followed by the actual command that runs when the
    alias is entered, separated by the equal sign (=). In rare instances, you can
    get away with not using the quotation marks around the aliased entry; as a general
    rule, however, you should always include them.


    > Always remember that, for aliases to survive a session, they should be added
    to the .bashrc file within a user''s home directory.


    # Other Features and Notes


    You should not overlook a number of other features of the Linux command line.
    Although they are not complicated enough to warrant sections of their own, it
    is useful to know of their existence:


    +   - When typing a command, you can press the Tab key after entering a few characters
    to make the shell attempt to complete the name of the command you are typing.


    +   - You can edit the command-line history to alter commands before running them
    again. The default editor in bash is emacs, and in zsh it is vi. Editors are discussed
    later in this book.


    +   - When you press the Enter key, the shell first scans the command line and
    determines what elements it has been given by looking for white space. It next
    replaces wildcards with any relevant file names. Following that, it strips all
    quotes and substitutes variables. Finally, it substitutes any embedded commands
    and then executes the entry.'
