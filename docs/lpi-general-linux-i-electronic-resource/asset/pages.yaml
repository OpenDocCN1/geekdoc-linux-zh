    user crontabs or /etc/crontab. The at jobs are executed by the at daemon (at most
    systems). On others, atrun is started routinely by the cron daemon to look for
    at jobs.


    # Backups


    Every system has the ability to crash (sad to say). When it does, you can reinstall
    the operating system from the media it came upon and start. What cannot be reinstalled
    from that media is all the data you''ve created since the system was started.
    Enter the lifesaving backups.


    The true definition of backups is copies of your data stored on removable media.
    (You can copy files from one drive to another, but they do no good if the'
