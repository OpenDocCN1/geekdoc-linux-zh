    # Working with ls


    The ability to list files and directories is one of the most essential to operate
    your system, and the ls utility performs this function for Linux. As shown in
    earlier chapters, given by itself, ls lists the names of files and directories
    beneath the current directory in a column-style format. Entries are always—by
    default—given in alphabetical order, and nothing differentiates names of directories
    from names of files. An example follows:


    ```

