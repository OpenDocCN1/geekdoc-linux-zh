- img_proc: true
  md: '# Chapter 7


    Another way to verify that it is the same data is to view the inodes. Every entity
    must have its own inode, as discussed earlier. If, however, you have only one
    set of data and multiple ways of accessing it, all the access methods (names)
    share the same inode:


    ```

    $ ls -i

    18471 Desktop 18538 monday 18536 tuesday

    18535 friday 18538 thursday 18537 wednesday

    $

    ```


    As you add links to the data, the link count increases; as you remove links, the
    link count decrements. The data that the link points to remains on the system
    as long as anything points to it. For example, the file thursday was linked to
    monday. If monday is deleted, thursday still remains, but the link count decrements
    to one: Linux does not care which file was created first. Only when the link count
    drops to zero does the data no longer exist on the system.


    > Every time you create a file from scratch, you create a link to the data (with
    a link count of one). When you delete (delete the file), the count becomes zero
    and the data goes away.


    When you view the files graphically, as shown in Figure 7.4, you see no indication
    that they are links to each other.


    To prove the link exists, however, any modification to either file happens to
