    # paste


    Whereas the cut utility extracts fields from a file, you can combine fields using
    either paste or join. The simpler of the two is paste; it has no great feature
    set and merely takes one line from one source and combines it with another line
    from another source. For example, if the contents of fileone are:


    +   Indianapolis

    Columbus

    Peoria

    Livingston

    Scottsdale


    And the contents of filetwo are:


    +   Indiana

    Ohio

    Illinois

    Montana

    Arizona'
