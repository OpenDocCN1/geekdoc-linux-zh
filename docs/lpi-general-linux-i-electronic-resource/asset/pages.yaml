    21 scheduling priority, which it inherited. Otherwise, nice

    22 runs the given command with its scheduling priority

    23 adjusted. If no adjustment is given, the priority of the

    24 command is incremented by 10. The superuser can specify a

    25 negative adjustment. The priority can be adjusted by nice

    26 over the range of -20 (the highest priority) to 19 (the

    27 lowest).

    28

