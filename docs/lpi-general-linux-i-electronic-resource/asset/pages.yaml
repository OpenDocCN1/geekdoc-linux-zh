- img_proc: true
  md: '# Self-Assessment xxvii


    For any given subject, consider taking a class if you''ve tackled self-study materials,
    taken the test, and failed anyway. The opportunity to interact with an instructor
    and fellow students can make all the difference in the world, if you can afford
    that privilege.


    If you can''t afford to take a class, you should still invest in some low-cost
    practice exams from commercial vendors, because they can help you assess your
    readiness to pass a test better than any other tool.


    I have included practice questions at the end of each chapter, plus a practice
    exam in Chapter 13 of this book. Therefore, if you don''t score well on the chapter
    tests, you can study more and tackle the test in Chapter 13.


    Have you taken a practice exam? If you, and you scored 80 percent or better, you''re
    probably ready to tackle the real. If your score isn''t above crucial threshold,
    obtain all the free and low-budget practice tests you can (this is a new certification,
    so practice tests will be hard to find) and get to work. Keep at it until you
    break the passing threshold comfortably.


    > When it comes to assessing your test readiness, there is no better way to take
    a good-quality practice exam and pass with a score of 80 percent or better. When
    I''m preparing myself, I shoot for 90-plus percent, just to leave room for the
    “ambiguity factor” that sometimes shows up on LPI exams.


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_30_0.png)


    You should also cruise the Web looking for braindumps (recollections of test topics
    and experiences recorded by others) to help you anticipate topics you''re likely
    to encounter on the test.


    > When using any braindump, it''s okay to pay attention to information about questions.
    However, you can''t always be sure that a braindump''s author will be able to
    provide correct answers. Therefore, use the questions to guide your studies but
    never rely on the answers in a braindump to lead you to the truth. Double-check
    everything you find in any braindump.


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_30_1.png)


    One last note: It might seem counter to talk about hands-on experience in the
    context of the multiple-choice exam, but as you review the material for this exam,
    you''ll realize that hands-on experience with Linux features is invaluable. Surprisingly,
    you''ll also benefit from hands-on administrative experience with Windows NT,
    NetWare, and network hardware, as well as just playing around the Internet.'
