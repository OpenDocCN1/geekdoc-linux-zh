  md: '# Chapter 9


    The init daemon is one of the first services to come alive upon a boot, and it
    reads and executes entries in the /etc/initab file. After it finishes, the init
    daemon stays active and respawns all processes that are supposed to run but die
    off, as well as interacts with the log files (utmp and wtmp beneath /var or /etc).


    If you modify the /etc/initab file, the changes you make are not active until
    the system reboots or you run the command:


    ```

    init q

    ```


    # Enter LILO


    All of the details given so far in this chapter (runlevels, initab, and so on)
    remain the same for Unix and Linux. Linux differs from Unix, however, in that
    it also has the Linux Loader (LILO). LILO allows Linux to coexist on your machine
    with other operating systems. Up to 16 images can be swapped back and forth to
    designate what operating system is loaded on the next boot.


    By default, LILO boots the default operating system each time, but when you can
    enter the name of another operating system at the boot: Prompt or force the prompt
    to appear by pressing Shift, Ctrl, or Alt during the boot sequence. Entering a
    question mark (or pressing Tab) shows the available operating systems defined
    in the /etc/lilo.conf file: This text file can range from simple to complex based
    on the number of operating systems you have. An example follows of the file with
    only one operating system (Linux) (with numbering added to facilitate discussion):


    ```

    # /etc/lilo.conf - generated by Lizard

    #


    # target


    oot = /dev/hdal

    install = /boot/boot.b


    # options


    prompt

    delay = 50

    timeout = 50

    message = /boot/message

    default = linux

    ```'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# Booting Linux 213


    ```

    13 image = /boot/vmlinuz-pc97-2.2.10-modular

    14 label = linux

    15 root = /dev/hdal

    16 vga = 274

    17 read-only append ="debug=2 noapsic nosmsp"

    ```


    Line 5 identifies the partition to boot from, and line 8 through 12 identify the
    default, defined as linux, prompt and timeout both have values of 50 deciseconds.
    You must press Shift or another key within this time or LILO begins loading the
    default. Line 13 identifies the name of the kernel, line 14 identifies its label,
    and line 16 names the root partition. The remaining lines identify the type of
    file system and so on.


    You can make changes to the file that are active when you run /sbin/lilo. Different-options
    you can use with the lilo command are:


    +   - -b—Specifies the boot sector.

    - -C—Uses a different configuration file.

    - -D—Uses a kernel with a specified name.

    - -d—Specifies how long the wait should be in deciseconds.

    - -I—Prompts for the kernel path.

    - -i—Specifies the boot sector.

    - -m—Specifies the name of the map file to use.

    - -q—Lists the names of the kernels (which are held in the /boot/map file).

    - -R—Sets as a default for the next reboot.

    - -S—Allows you to overwrite the existing file.

    - -s—Tells LILO where to store the old boot sector.

    - -t—Tests the running of LILO without changing anything.

    - -u—Uninstalls LILO.

    - -v—Changes to verbose mode.


