  md: '# File Management 99


    As simplistic as it sounds, always remember when you copy a file, you leave the
    original intent and create something that did not exist before; thus a new set
    of attributes are created for the new entity. When you move a file, however, the
    default action is a rename; you are changing only the name of the original entity
    and not anything new.


    One way to put it in perspective is that copying a file is 9MB in size takes longer
    than copying a file that is 9 bytes in size. With moving used as a rename, it
    takes the same amount of time to do the operation regardless of the size of the
    file.


    You will need to know this for the exam.


    As with the copy operation, if you attempt to move a file to a name that already
    exists, the contents of the target are lost. To illustrate:


    ```

    $ ls -l file*

    -rw-r-- 1 root root 85 Aug 22 10:26 fileone

    -rw-r-- 1 root root 16432 Aug 28 13:43 filetwo

    $ mv fileone filetwo

    $ ls -l file*

    -rw-r-- 1 root root 85 Aug 22 10:26 filetwo

    ```


    You use the -i (option in interactive or interactive) to prompt before overwriting,
    and the opposite of it is -f (for force), which is the default operation. The
    -u option does the move only if the source file is newer, and -v turns on verbose
    mode. The -b option makes a backup of the target file, if it exists, with a tilde
    (~) as the last character—essentially performing a pseudo-copy operation:


    ```

    $ ls -l help*

    -rw-r-- 1 root root 85 Aug 22 10:26 helpfile

    $ mv -b helpfile filetwo

    $ ls -l help*

    -rw-r-- 1 root root 85 Aug 22 10:26 filetwo

    $ ls -l file*

    -rw-r-- 1 root root 85 Aug 22 10:26 fileone

    -rw-r-- 1 root root 16432 Aug 28 13:43 filetwo

    $ mv -b fileone filetwo

    $ ls -l file*

    -rw-r-- 1 root root 85 Aug 22 10:26 filetwo

    -rw-r-- 1 root root 16432 Aug 28 13:43 filetwo~

    ```'
  merge: -1
