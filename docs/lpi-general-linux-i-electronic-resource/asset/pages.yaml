    # Print Files and Set Up XDM


    These two objectives are self-explanatory.


    # Identify and Terminate Runaway X Applications


    The focus here is on applications that continue to run after the session ends.
    To pass this objective, simply know how to identify them and respond to them.


    # Step 3: Other Possibilities


    After passing exams listed here and becoming LPIC Level 1 certified, you can pursue
    many different paths if you want to continue down the certification path. LPIC
    Level 1 certifies you knowing the basic functions of the Linux operating system
    and of system administration. This certification provides an excellent foundation
    upon which to build other certifications of a higher level.'
