  md: '# Chapter 4


    In this chapter, you''ll learn about two important utilities used for working
    with files and output. The grep family of utilities finds values, and the sed
    utility can change the value of strings. In the examples here, we use many of
    the utilities discussed in Chapter 3, and we expand upon the concept of redirection,
    previously introduced in Chapter 2.


    # The grep Family


    The utility with the funny name (something common in Linux) is really an acronym
    for the function that it performs: Globally look for Regular Expressions and then
    Print the results. To put it another way, it is one of the most advanced search
    utilities you can use. To be proficient with it, however, you must understand
    what a regular expression is and how to use it in searching for matches to a query.


    We give a number of rules for regular expressions, and the eight listed here constitute
    the most important:


    +   - Any nonsensical character is equal to itself.

    - Any special character is equal to itself if preceded by a back slash (\).

    - Indicate the beginning of the line with an up caret (^) and the end of the line
    with a dollar sign ($).

    - Express a range within brackets [].

    - Tying an caret (^) as the first character within a bracket finds values that
    do not match entries within the brackets.

    - A period (.) can signify any single character.

    - An asterisk (*) stands for anything and everything.

    - Quotation marks are not always needed around search strings, but they might
    be needed, so you should use them as a general rule.


    Table 4.1 shows some examples and elaborates on each of these rules.


    To illustrate some of these operations using grep, assume that a small file named
    "garbage" has the following contents:


    I heard about the cats last night and particularly the one cat that ran away with
    all the catnip


    If you want to find all occurrences of the word "cat", the syntax becomes:


    ```

    $ grep "cat" garbage

    I heard about the cats last night

    ```'
