  md: '# Chapter 3


    In this chapter, you''ll learn the basic utilities used to create and modify text
    and text files within the Linux operating system. We expand upon many of the re-direction
    commands and command-line basics from Chapter 2.


    # The Irrepressible cat


    The simplest text-processing utility of all is cat, a derivative from the word
    "con-concatenate." By default, it displays the entire contents of a file on the
    screen (standard-output). cat also has a number of useful options:


    +   -b—Numbers lines

    -E—Shows a dollar sign ($) at the end of each line (carriage return)

    -T—Shows all tabs as ^I

    -v—Shows nonprinting characters except tabs and carriage return

    -A—Does the same as -v combined with -E and -T


    To illustrate cat''s uses, assume a four-line file named "example" has the following
    contents:


    How much wood

    could a woodchuck chuck

    if a woodchuck

    could woodchuck wood?


    To view the contents of the file on the screen, exactly as they appear here, the
    command is:


    cat example


    To view the file with lines numbered, the command, and the output generated, becomes:


    +   cat -b example

    1 How much wood

    2 could a woodchuck chuck

    3 if a woodchuck

    4 could chuck wood?


    Note the inclusion of the spaces, inserted by tabs, that were not present before
    but were added by the numbering process. They are not truly in the file, but appear
    only in the display, as can be witnessed with the command:


    cat -Ab example'
