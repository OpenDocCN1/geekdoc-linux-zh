- img_proc: true
  md: '# LPI Certification Exams


    Although these three basic types of questions can appear in many forms, they constitute
    the foundation on which all the LPI Certification questions rest. At any time,
    LPI can choose to include other questions involving exhibits, charts, or network
    diagrams to help document a Web site scenario you''ll be asked to troubleshoot
    or configure. Paying careful attention to such exhibits is the key to success.


    # Using LPI’s Exam Software Effectively


    A well-known principle when taking exams is to first read over the entire exam
    from start to finish while answering only those questions you feel absolutely
    sure of. On subsequent passes, you can dive into more complex questions more deeply,
    knowing how many such questions you have left.


    Fortunately, LPI’s exam software makes this approach easy to implement. At the
    top-left corner of each question is a checkbox that permits you to mark that question
    for a later visit.


    Note: Marking questions makes review easier, but you can return to any question
    you are willing to click the Forward or Back button repeatedly.


    As you read each question, if you answer only those you’re sure of, you can keep
    working through a decreasing list of questions as you answer the trickier ones
    in order.


    > There’s at least one potential benefit to reading the exam completely before
    answering the trickier questions: Sometimes, information supplied in later questions
    you read in later questions might jog your memory about negotiating facts, figures,
    or behavior that will help with earlier questions. Either way, you’ll come out
    ahead if you defer those questions about which you’re not absolutely sure.


    Keep working on the questions until you’re certain of all your answers or until
    you know you’ll run out of time. If questions remain unanswered, you’ll want to
    zip through them and guess. Not answering a question guarantees you won’t receive
    credit for it, and a guess has at least a chance of being correct.


    > At the very end of your exam period, you’re better off guessing leaving questions
    unanswered.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# Exam-Taking Basics


    The most important advice about taking any exam is this: Read each question carefully.
    Some questions are deliberately ambiguous, some use double negatives, and others
    use terminology in incredibly precise ways. I have taken numerous exams—both practice
    and live—and in nearly every one I missed at least one question because I didn''t
    read it closely or carefully enough.


    Here are some suggestions on how to deal with the tendency to jump to an answer
    too quickly:


    +   - Make sure you read every word in the question. If you find yourself jumping
    ahead impatiently, go back and start over.


    +   - As you read, try to restate the question in your own terms. If you can do
    this, you should be able to pick the correct answers more easily.


    +   - When returning to a question after your initial read-through, read every
    word again; otherwise, your mind can quickly fall into a rut. Sometimes, revisiting
    a question after turning your attention elsewhere lets you see something missed,
    the strong tendency is to see what you''ve seen before. Avoid this tendency at
    all costs.


    +   - If you return to a question more than twice, try to articulate to yourself
    what you don''t understand appear to make sense, or what appears to be missing.
    If you chew on the subject for a while, your subconscious might provide the details
    that are lacking or you might notice a “trick” that will point to the right answer.


    Above all, deal with each question by thinking through what you know about networking
    essentials—the characteristics, behaviors, facts, and figures involved. By reviewing
    what you know (and what you''ve written down on your information sheet), you''ll
    often recall or understand things sufficiently to determine the answer to the
    question.


    # Question-Handling Strategies


    Based on exams I''ve taken, some interesting trends have become apparent. For
    those that take only a single answer, usually two or three of the answers will
    be obviously incorrect, and two of the answers will be plausible; of course, only
    one can be correct. Unless the answer leaps out at you (if it does, reread the
    question to look for a trick; sometimes those are the ones you''re likely to get
    wrong), begin the process of eliminating those that are most obviously wrong.'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'Things to look for obviously wrong answers include nonexistent commands, incorrect
    utility names, inconsistent conditions, and terminology you''ve never seen. If
    you''ve done your homework for an exam, no valid information should be completely
    new to you. In that case, unfamiliar or bizarre terminology probably indicates
    a totally bogus answer.


    Numerous questions assume you understand the inner workings of Linux utilities
    inside and out. If your knowledge in these areas is well grounded, it will help
    you cut through many confusing questions.


    As you work your way through the exam, another counter that LPI graciously provides
    will come in handy—the number of questions completed and questions outstanding.
    Budget your time by making sure you''ve completed one-quarter of the questions
    one-quarter of the way through the exam period and three-quarters of the them
    three-quarters of the way through.


    If you''re not finished when 85 minutes have elapsed, use the last 5 minutes to
    guess your way through the remaining questions. Remember, guessing is potentially
    more valuable than not answering blank answers are always wrong, but a guess can
    turn out to be right. If you don''t have any clue about the remaining questions,
    pick answers at random, or choose all a''s, b''s, and so on. The important thing
    is to submit an exam scoring that has an answer for any question.


    # Mastering the Inner Game


    In the final analysis, knowledge breeds confidence, and confidence success. If
    you study the materials in this book carefully and review all the practice questions
    at the end of each chapter, you should become aware of those areas where additional
    learning and study are required.


    Next, follow up by reading some or all of the materials recommended in the “Need
    to Know More” section at the end of each chapter. The idea is to become familiar
    enough with the concepts and situations you find in the sample questions that
    you reason your way through similar situations on a real exam. If you know the
    material, you have every right to be confident that you can pass the exam.


    After you''ve worked your way through the book, take the practice exam in Chapter
    13. This will provide a reality check and help you identify areas you need to
    study further. Make sure you follow up and review materials related to the questions
    you miss on the practice exam before scheduling a real exam. When you''ve covered
    all the ground and feel comfortable with the whole scope of the practice exam
    you should take a real one.'
