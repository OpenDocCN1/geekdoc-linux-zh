    your **PATH** statement. When it finds a match in a directory for a name you give,
    it stops immediately and reports what it found. How is this useful? Suppose your
    system has 14 versions of **grep**: **which** tells you the first one it finds
    via the path search, and thus the one that is executed when you use the command.


    The following sample illustrates the very simple nature of **which**:


    ```

    $ grep

    /usr/bin/grep

    $

    ```


    # The find Utility


    If you had to think of an analogy for the **find** utility, it would be the Swiss
    Army Knife in the real world or **grep** on steroids in the operating-system.
    This tool is capable of looking at all entries in the filesystem and displaying
    results that meet given criteria. In many ways, it is the vast possibilities of
    the criteria you can specify that make this tool so powerful. The syntax is simply:


    ```

    find [starting point][criteria]

    ```'
