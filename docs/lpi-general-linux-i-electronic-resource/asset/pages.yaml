    # # xargs


    As as the find utility is, it is limited in the results it can return to values
    within the filesystem structure. The only real text within the structure is the
    name of the entity, not the data itself. (The pointer points to that.) To illustrate,
    suppose the user put out a memo several months back on acceptable use of the company
    refrigerator in the break room. Since then, edulaney has quit the company and
    several new employees (who would benefit from knowing this policy) have joined.
    You want to find the file and reprint it.


    About the closest you can get to accomplishing this task with find (and its results)
    is:


    ```

    $ find -user edulaney -type f -exec grep -i refrigerator {} \\

    stored in the refrigerator overnight will be thrown out

    ```


    You must use the type option or else occur every time grep tries to search a directory.
    In this case, the line from the file is found, but there is no way of knowing
    what file contains it—rendering the result much useless.


    Enter the xargs utility: Analogous to a pipe, it feeds output from one command
    directly into another. Arguments coming into it are passed through with no changes
    and turned into input for the next command. This, can can be modified to:


    ```

    $ find -user edulaney -type f | xargs grep -i refrigerator

    /home/edulaney/fileone:stored in the refrigerator overnight

    will be thrown out

    ```


    The desired file is indicated, so you can print it for the new employees.


    Food for thought: If xargs works as a pipe, why wouldn''t the following command
    suffice?


    ```

    $ find -user edulaney -type f | grep -i refrigerator

    ```'
