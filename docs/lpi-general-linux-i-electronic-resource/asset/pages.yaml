  md: '# Glossary


    ! (exclamation mark)

    This is known as a bang in Linux, and it can be used to enter commands and rerun
    commands from the command prompt.


    Background

    This is a location where jobs can run without requiring interaction from the user.
    There can only be one job running in the foreground, but there can be an unlimited
    number (bound by resources) of jobs running in the background.


    Absolute path

    This is the opposite of a relative path. When using an absolute path, you must
    give the full path to the file, regardless of where you are currently. An example
    would be /home/edulaney/file.


    Backup

    This is the process of saving files to another location in case unforeseen happens
    to the existing copy. Backups should be performed on a regular basis and done
    to removable media.


    American Standard Code for Information Interchange (ASCII)

    ASCII is the eight-bit coding scheme created to standardize the transferring of
    data between systems.


    bash

    This is the Bourne Again shell, which is an interpreter between the user and the
    operating system.


    Authentication

    This is the process of validating a user''s access to a system. Authentication
    is typically employed by comparing a username and password against an authorized
    list.


    Bitmap

    This was originally an array of bits but is now expanded to include arrays of
    bytes or even 32-bit quantities that specify the dot pattern and colors that describe
    an image on the screen or printed paper.'
