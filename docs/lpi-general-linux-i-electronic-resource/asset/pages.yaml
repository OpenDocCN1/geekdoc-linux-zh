  md: '# Putting It All Together


    Having looked at different elements of the boot, you can put it all together and
    run through the steps of a boot from start to finish:


    +   1. When any machine starts, it first performs a POST (Power-on self test)
    to verify that all is internally present that should be. This occurs regardless
    of operating system.


    +   2. The boot loader for the operating system begins. With Linux, by default,
    it waits 50 deciseconds (5 seconds) for you to press a key and identify another
    operating system you want to boot. If you don''t press any key, the default of
    Linux is loaded.


    +   3. The kernel is loaded from the hard drive, floppy drive, or specified location
    into memory. By default, it is located within the /boot directory and exists in
    compressed state: As it loads into memory, it uncompresses.


    +   4. The kernel is booted, and messages are written to /var/log/messages.


    +   5. The system loads modules, and default from /etc/conf.modules or /etc/conf.modules.


    +   6. The kernel passes control to the init daemon, which begins reading the
    /etc/inittab file. Because of this, the init daemon always has a process ID of
    1 and is the parent of many other daemons.


    +   7. Normally, a check of the filesystem (fsck) is carried out, and the local
    filesystem is mounted. Other operations can include mounting remote filesystems
    and cleaning up temporary files.


    +   8. The system begins changing to the runlevel specified by the initdefault
    parameter. In so doing, it runs scripts beneath the /etc/rc.d directory and uses
    all other processes or daemons, such as a print server, cron, sendmail, and so
    on.


    +   9. The terminals become active for login (getty has initiated), and the boot
    process is finished.


    # Enter the User


    After the system is up, the user can use it. The init daemon has started a getty
    process for each terminal, telling it to listen for a connection. If you run ps
    -ef, you see a getty process running on each terminal that can log in and does
    not currently have a user using it. The program responsible for printing the login
    prompt is the command getty (''get a tty''). getty prompts for the user''s name.'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# Chapter 9


    I discussed this login name, which is assigned by the system administrator, in
    Chapter 6. Most often, the login name is the user''s initials, first name, last
    name, or some variation. The username is considered a known entity for anyone
    wanting to send a message to or interact with the user, and it also appears in
    directory listings as the owner of files and directories.


    Once the user enters a login name, getty spawns, or starts, /bin/login utility.
    The login utility prompts the user to enter his or her password. The user enters
    the password (which does not display on the screen for security reasons). If the
    user enters the password incorrectly, the system responds with a generic message
    stating that the login is incorrect.


    The login command accepts the password entered by the user and encrypts it using
    the same mechanism used by the passwd command to put the password in the /etc/passwd
    file. If the encrypted values match, the password is correct. Otherwise, the password
    entered by the user is incorrect. The login command cannot decrypt the password
    once it has been encrypted. When the password is entered properly, the next phase
    of the system files (utmp/wtmp) is updated.


    The system runs /etc/profile shell script to set variables for all users, and
    then the user runs to his home directory and his login shell (as specified in
    the /etc/passwd file) command is invoked. If customization files appear within
    the home directory (such as .profile for bash or .login for C shell), they are
    executed next; the user''s initial environment is configured, and the shell starts
    executing.


    # Utility Summation


    This chapter discussed only a handful of utilities. Table 9.2 lists them and their
    purposes.


    | Table 9.2 Utilities discussed in this chapter. | |

    | --- | --- |

    | Utility | Purpose |

    | runlevel | Shows the current runlevel of the system. |

    | init | Changes the runlevel. |

    | telinit | Same as **init**. |

    | shutdown | An interface to **init** with more options. |

    | halt, poweroff, and reboot | An interface to **shutdown**. |

    | lilo | Configures the Linux Loader. |

    | dmesg | Displays the LILO messages. |

    | last | Views the most recent entries in the wtmp file. |'
  merge: -1
