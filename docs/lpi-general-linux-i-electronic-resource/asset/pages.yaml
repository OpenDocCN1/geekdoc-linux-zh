    # Mounting and Unmounting


    Linux is installed on a local filesystem. If that filesystem is large enough to
    hold everything you interact with, then that is all you need. In most cases, however,


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_190_0.png)'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# Chapter 7


    local filesystem is not sufficient to hold everything you need. When that is the
    case, you can mount other filesystems to make them accessible within your environment.


    You use the mount command without parameters to show what filesystems are currently
    available. A sample of the output is:


    ```

    /dev/hda1 / type ext2 (rw)

    /dev/hda3 /home type ext2 (rw)

    devpts on /dev/pts type devpts (rw, gid=5,mode=620)

    proc on /proc type proc (rw)

    noname:(pid11973) on /auto nfs (rw)

    ```


    This sample reads from the dynamic file /etc/mtab and identifies the device, the
    mount point, the type of filesystem, and the permissions (rw is read/write). In
    addition to read/write, filesystems can be mounted as read-only (ro), not allowing
    users (nouser), to run binaries (exec) or not (noexec), not running certain files
    (nosuid), controlled by all users (user), and interpreting special devices on
    the filesystem (dev).


    The entries listed here, and those that appear by default, in the /etc/fstab file—mentioned
    earlier in regard to the fck utility. If you want to mount additional filesystems,
    you should add their entries to this file. The command mount -a reads the fstab
    file and mounts all entries found within.


    If you do not want filesystems always mounted, you can dynamically load other
    filesystems using the device name with the mount utility.


    For example, to mount the CD, the command is:


    ```

    $ mount /mnt/cdrom

    ```


    The entry added to mount resembles:


    ```

    /dev/hdc on /mnt/cdrom type iso9660 (ro,noexec,nosuid,nodev)

    ```


    The mnt directory holds readily accessible definitions for external devices such
    as the CD ROM and floppies. Options you can use with the mount command are:


    +   -a—Reads through the /etc/fstab file and all entries.

    -f—Checks whether a filesystem can be mounted (but does not mount it). An error
    message returned means that it cannot be found, and no error message means that
    it was found in /etc/fstab or /etc/mtab.

    -n—Prevents the /etc/mtab file from being dynamically updated when a filesystem
    is added.

    -r—Mounts the filesystem as read-only.'
