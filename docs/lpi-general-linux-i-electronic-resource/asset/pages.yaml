  md: '# Chapter 5


    In this chapter, you''ll learn about a number of utilities used for managing files
    and directories. Some of these utilities—such as cd and ls—are of such importance
    that it was impossible to get this far in the book without using them in some
    of the examples. Here, I expand upon them and explore their functions and uses
    in greater detail.


    You use the cd command to change the directory in which you are working. Entering
    the command with no parameters moves you to whatever directory is defined by the
    HOME variable. Specifying any parameter with it is seen as de-not the directory
    you want to change.


    Some characters that can be of great use with cd are the single period (.) and
    double period (..). The former represents wherever you are currently in, and the
    latter is the parent directory of the current one.


    The pwd utility shows the present working directory—the one you are currently
    in. The same value it returns is contained in the environmental variable PWD.


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_121_0.png)


    > Always more than one item can have the same name in Linux. As a general rule,
    all uppercase entries represent variables and are not executables; all lowercase
    entries are files or utilities and are rarely variables.


    Following are some examples of how you can use these two utilities:


    ```

    $ pwd

    /usr/bin

    $ echo $HOME

    /home/edulaney

    $ cd

    $ pwd

    /home/edulaney $

    ```


    This sequence showed the present working directory to be "/usr/bin" and the HOME
    variable to be equal to "/home/edulaney". Entering cd without any parameters changed
    to that directory.


    In the following sequence, the first change is to the root directory (/):


    ```

    $ pwd

    /home/edulaney

    $ cd /\n$ pwd

    ```'
