    These permissions have numeric values as well, as shown in Table 8.3.


    The numeric values make it possible to add permissions together and express them
    in an easy-to-understand way. For example, if a file grants a user the permissions
    rwx, the numeric value is 4(r)+2(w)+1(x)=7. The full set of permissions for the
    file can be computed as shown in Figure 8.2.


    Table 8.4 extrapolates the numerical conversion and outlines a few of the possible
    values for a file''s permissions:


    The default permissions for all newly created files are 666 (rw-rw-rw-) and directories
    are 777 (rwxrwxrwx). This number is altered, however, by the presence of a variable
    known as umask. The umask variable is equal to a number that is subtracted from
    the default permissions to arrive at the permissions that apply per user.


    To see the value of umask, simply enter the command at the prompt:


    ```

    $ umask

    022

    $

    ```


    With a umask of 022, the permissions assigned to new files become 644 (rw-r--)
    and to directories 755 (rwxr-xr-x), as shown in Figure 8.3 (see page 194).


    You can change the value of umask by specifying a different value on the command
    line (umask 15, for example), and this value is used for the Session.


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_223_0.png)


    Figure 8.2 Numeric values are shown for the file''s permissions.'
