  md: 'I run a utility. I don''t care about the messages generated because I just
    want the utility to run. When this is the case, you can send the results to nowhere
    by specifying /dev/null, as in:


    ```

    ls -F > /dev/null

    ```


    The results are sent to this device—also known as the trashcan—never to be saved
    or displayed.


    Standard input is typically the keyboard or expected to be among the arguments
    given on the command line. You can, however, specify the redirection of standard
    input using the less-sign (<). Rarely is there ever a need for this this sign,
    but it is available. For example:


    ```

    cat myfile

    ```


    gives the same results as:


    ```

    cat < myfile

    ```


    In the world of Linux, numerical values exist for these items as well. Standard
    input (abbreviated stdin) is 0, and standard output (abbreviated stdout) is 1.
    You can use these numbers with the redirection, but that move is rare. An example
    is:


    ```

    ls -F 1 myfile

    ```


    which states that standard output is to be redirected to the file named "myfile".
    The numbers are important for one reason only—because a third possibility exists
    as well. Standard error (abbreviated stderr) has a value of 2. For an example
    of standard error, think of the ls -z command discussed earlier. Even though the
    output was sent to a file, the command was nonexistent, and the error message
    appeared on the screen. You can send the error to the file with the command:


    ```

    ls -z 2 myfile

    ```


    The problem is that the error is sent to the file, but the output (in the absence
    of an error) appears on the screen. To send both output and errors to the same
    file, the command becomes:


    ```

    ls -z > myfile 2>&1

    ```


    This states that the output is to go to a file named "myfile" and further that
    standard error (2) is to go to the same location as standard output (1). Another
    alternative is to send errors to one location and output to another, as in:'
  merge: -1
