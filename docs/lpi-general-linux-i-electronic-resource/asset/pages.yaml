  md: '# Chapter 9


    In this chapter, you''ll learn the boot process employed by Linux. I first address
    a number of key files and then put the items together to walk through the entire
    boot. You will also see the steps involved when a user logs on to the system,
    and you''ll see the full cycle from boot to daily operation.


    # Understanding Runlevels


    Before diving into booting the system, it is important to understand the concept
    of runlevels—functioning and off (halted). Linux, however, has seven different
    levels of functionality, as shown in 9.1.


    At level 0, the system is in a shutdown state requiring a manual reboot. This
    can be called a halt, or powerdown, as well as a shutdown. When you change to
    this level, files are synchronized with the disk, and the system is left in a
    state where it is safe to power it off.


    Level 1, also known as administrative mode, puts the system in single-user mode.
    This allows only one user (traditionally the root user) to access the system and
    prevents anyone else from getting in. Often, it restricts the login to only one
    terminal as well: that defined as this is the level you use when rebuilding the
    kernel and performing similar tasks.


    Level 2 is multiple-user mode—allowing more than one user to log in at a time.
    This level, background processes (daemons) start up and additional filesystems
    (root is always mounted), if present, are mounted. Network File System (NFS) is
    not running.


    Level 3, also known as network mode, is exactly the same as level 2, only with
    networking, or NFS, enabled.


    Level 4 is left to each vendor to define.


    | Table 9.1 Linux runlevels. |

    | Runlevel | Purpose |

    | 0 | The system is down. |

    | 1 | Only one user permitted. |

    | 2 | Multiple users permitted, but without NFS. |

    | 3 | Multiple users and NFS. |

    | 4 | Differs per implementation. |

    | 5 | The X environment. |

    | 6 | Shut down and reboot. |'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# Booting Linux 27


    Level 5 is also known as a hardware state. The command prompt is available, and
    users are allowed to log in and out of the X environment.


    Level 6 represents a shutdown and automatic reboot: the same result as changing
    to runlevel 0 and then rebooting the machine. It can be called a “warm boot”-because
    power is removed from the components; runlevel 0 represents a “cold boot” because
    power must be turned off and then restored.


    An easy way to summarize the runlevels is that 2, 3, and 5 are operational states
    of the computer; it is up and running, and users are allowed to conduct business.
    All other runlevels involve some of maintenance or shutdown operation, preventing
    users from processing; the exception is level 4, which differs across implementations.


    Typing the command runlevel at a prompt shows two values: the previous runlevel
    and the current runlevel:


    ```

    $ runlevel

    N 5

    $

    ```


    In this case, the current runlevel is 5, and the N means there is no previous
    level (None). These values are derived from the /var/run/utmp log file, which
    keeps track of all changes. If this file is corrupt, or the values cannot be found
    within it, the only value returned is unknown.


    # Changing Runlevels


    You can use two commands to change the runlevel of a machine: shutdown and init.
    In reality, the shutdown command is nothing more than an interface to init, offering
    a friendly features.


    The init utility resides in the /sbin directory and must be followed by a number
    (0 through 6) or the letters S or s. The numbers identify which runlevel to change
    to, and the S and s signify single-user mode. (S allows only root, but s does
    not care which single user.) To change to runlevel 2, the command is:


    ```

    init 2

    ```


    The telinit utility works the same as init, and for example purposes, can be used
    in its place. In reality, it is but a link to init.'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# Chapter 9


    The shutdown utility offers a few more options. It informs all users currently
    logged in the system that is changing state and allows a time (delay) to be specified
    before the change takes place. Options that work with the utility are:


    +   -FForces fsck to run after the reboot (the default).


    +   -fPrevents fsck from running after the reboot, thus creating a fast reboot.


    +   -h—Halts after shutdown (level 0).


    +   -k—Sends out a warning to all users but does not really change state.


    +   -r—Reboots after shutdown (level 6).


    +   -t—Specifies the number of seconds before the change begins.


    If no parameters are specified, the default runlevel shutdown attempts level 0.
    An example of using the utility is:


    ```

    $ shutdown -h -t3 now

    ```


    This forces a change to runlevel 0 (-h) three seconds (-t) from the current time
    (now). Notice that you must always specify a time. If any text follows the time,
    it is interpreted as the warning message to send to users. You can also notify
    users by using the write command to send a message to individual users or by using
    wall to write to all users and tell them of the upcoming shutdown.


    Finally, if you want to stop a shutdown after you have summoned it, but before
    it has begun, you can call shutdown once more with the -c (cancel) option.


    By default, only the root user can run shutdown. You can create a file in the
    /etc directory named "shutdown.allow" to list other users you want to be able
    to run the command.


    Three minor utilities exist as links to the shutdown utility:


    +   -halt—Implements shutdown -h.


    +   -reboot—Implements shutdown -r.


    +   -poweroff—The same as halt.


    Regardless of which command you use to shut down the system, you must use one
    of them to halt processes and close files properly. If you do not shut down the
    system properly, the filesystem has a strong chance of becoming corrupted.'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# # The inittab File


    The main file for determining what takes place at different runlevels is the /etc/initab
    (initialization table) file. This text file is colon-delimited and divided into
    four fields. The first field is a short ID, and the second identifies the runlevel
    at which the action is to take place (blank means all). The third field is the
    action to take place, and the last field is the command to execute.


    The following file is representative of every initab file looks like, although
    this one comes from Caldera OpenLinux. I added numbering to the beginning of each
    line to facilitate easier discussion following the listing.


    +   #

    # inittab this file describes how the INIT process should

    # set up the system in a certain runlevel.

    #

    # Author: Miquel van Smoorenburg,

    # <miquels@drinkel.nl.mugnet.org>

    # Modified for RHS Linux by Marc Ewing

    # and Donnie Barnes

    # Modified for COL by Raymund Will

    #


    +   # The runlevels used by COL are:

    # 0 - halt (Do NOT set initdefault to this)

    #

    # 1 - Single user mode (including initialisation of)

    # network interfaces, if you do have having networking

    # 2 - Multiuser, (without NFS-Server und some such)

    # (basically the same as 3, if you do not have networking)

    # 3 - Full multi-user mode

    # 4 - unused

    # (should be equal to 3, for now)

    # 5 - X11

    # 6 - reboot (Do NOT set initdefault to this)

    #

    #


    +   #

    # Default runlevel.

    id:5:initdefault.


    +   # System initialization.

    s0::sysinit:/bin/bash -c ''$C=/sbin/booterd; [ -x $C ] && $C''

    si::sysinit:/bin/bash -c ''$C=/etc/rc.d/rc.modules;/

    [ -x $C ] && $C'''
  merge: -1
