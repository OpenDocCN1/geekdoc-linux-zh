  md: 'The Command Line 25


    The shell lets the quotation marks indicate that the text within them should be
    a single entry. The shell performs the operation given it and loses the quotes
    in the process. To get around this, you must use the back-slash (\) character
    to override the default meaning of says:


    ```

    echo Karen says \"Hi\"

    ```


    Note that the back-quote—literal—character must precede each incident of the quotes,
    and it is always good for the character immediately following it.


    # Standard Output and Input


    Standard output is where displays usually go—to your screen. When you give the
    command:


    ```

    ls -F

    ```


    a list of the subdirectories and files beneath the current directory displays
    on your screen. The default location for standard output, therefore, is your screen.
    If you do not want the results displayed on your screen, you can redirect them
    to another location, such as a file. Redirection of standard output is possible
    through the use of the greater-than sign (>). For example, to send the results
    to a file, the command is:


    ```

    ls -F > myfile

    ```


    When you give this command, the shell first creates a file named "myfile" with
    a size of zero. It then allows the ls to run and places the output within the
    newly created file rather than on your screen. It is important to note the order
    of operations because if you give a nonexistent command such as:


    ```

    ls -z > myfile

    ```


    the file named "myfile" is still created with a size of zero that then stays at
    zero. The error appears on your screen, but it occurs after the file is created.
    This point is important because if you attempt to add more information to the
    file, the file is overwritten first. To add more information, you must append
    to the file using two greater-than signs (>>):


    ```

    ls -l >> myfile

    ```


    This step adds the new information to the end of the existing file and keeps the
    original contents intact. In some situations, you want a command to run but don''t
    care at all about the results. For example, I might want a database to compile,
    so'
