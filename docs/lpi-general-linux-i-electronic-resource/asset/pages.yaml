- img_proc: true
  md: 'In this chapter, you''ll learn about the help utilities used to document utilities
    and features in Linux. You will also learn how to write documentation for your
    own system and how to provide support to users. Finally, I address resources outside
    the system and available over the Internet.


    # Using Local Documentation


    A number ofmethods are available in all Linux implementations for finding help
    on the operation of utilities. Additionally, many vendors add their own documentation
    and utilities for simplifying the process. In this section, I describe the common
    utilities, namely:


    +   - man

    - --help

    - info


    # The man Utility


    The man (as manual) utility dates back to the early days of Unix. Using-whatever
    page utility is defined in the user''s environmental variables for PAGER, it displays
    document file found in the /usr/man subdirectories. The PAGER variable is usually
    equal to less or more.


    > On some systems, PAGER can be MANPAGER. Other variables are available, but not
    needed, including MANPATH (the location of the manual files), MANSECT (defining
    the sections of the pages), and MANWIDTH.


    The directories beneath /usr/man, and their purposes, include those shown in Table
    10.1.


    Table 10.1 Subdirectories for man files.

    | Subdirectory | Descriptions Contained Within |

    | man1 | Shell utilities and user commands |

    | man2 | System calls |

    | man3 | libc calls |

    | man4 | /dev descriptions |

    | man5 | /etc and other configurable files (such as protocols) |

    | man6 | Games |

    | man7 | Linux system files, conventions, and so forth |

    | man8 | root user/system administration utilities |'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'When you enter the command to display a manual page (man), the subdirectories
    in Table 10.1 are searched until the first match is found. For example, if you
    enter the command:


    ```

    man nice

    ```


    the directories are searched until the first match of a manual page describing
    the nice utility is found. Linux displays the manual page using the utility specified
    by the PAGER variable. An example of the output follows (with line numbering added
    to the discussion):


    +   1 NICE(1)

    2

