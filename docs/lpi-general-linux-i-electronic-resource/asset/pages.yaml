  md: '# Practice Questions


    # Question 1


    +   In what directory does the inittab file reside?

    - a. /bin

    - b. /dev

    - c. /var

    - d. /etc


    The correct answer to this question is d. The initialization table must exist
    beneath this directory to be used by the system. Answer a is incorrect because
    this directory holds device definitions. Answer b is incorrect because this directory
    holds log files and other varying data. Answer c is incorrect because this directory
    holds binary files.


    # Question 2


    +   How many fields does each entry of the inittab file have?

    - a. Two

    - b. Three

    - c. Four

    - d. Five

    - e. Six

    - f. Seven


    The correct answer to this question is c. Each entry must have four fields. The
    first field is a unique identifier for the entry. The second field is the runlevel
    at which the job will run. The third field identifies the action associated with
    the job, and the fourth field contains the process itself.'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# Question 3


    Marco has just finished editing the inittab file and adding new entries to respawn.
    He does not want to shut down the system but wants the processes to begin immediately.
    What command must he enter for the new inittab file to be read and active? [Fill
    in the blank]


    The correct answer to this question is:


    init q


    This will force the file to be reread and all lines within it activated for the
    current runlevel.


    # Question 4


    Sandra wants to tune network parameters on the system and restrict access to local
    users while she is doing so. Which runlevel should she use that will allow for
    multiple users on the system and will not allow for NFS to be active?


    +   a. 1

    b. 2

    c. 3

    d. 5


    The correct answer to this question is b. Runlevel 2 allows for multiple user
    mode without NFS. Answer a allows only one user at runlevel 1, so it is incorrect.
    NFS is active with runlevel 3, so answer c is incorrect. Answer d allows for the
    use of the X environment, so so it is incorrect.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Question 5


    | Whichlevel is equivalent to performing a cold boot? |

    | a. 0 |

    | b. 1 |

    | c. 5 |

    | d. 6 |


    The correct answer to this question is a. When you change to runlevel 0, the system
    is completely halted and shut down. You must power-off and power-on to start the
    system again (cold boot). Answer b does not involve shutting down the system,
    so it is also incorrect. Answer c does not involve shutting down the system, so
    it is also incorrect. Answer d (runlevel 6) is a shutdown and automatic restart
    and thus equivalent to a warm boot; therefore, it is incorrect.


    # Question 6


    +   Martin has just pleaded with your boss to be granted the ability to shut down
    his system. What is the best way for you to accomplish this without affecting
    other operations?

    - a. Make the /sbin/shutdown utility available to him.

    - b. Make him a member of the root group.

    - c. Add him to /sbin/shutdown.allow.

    - d. Create /etc/shutdown.allow.


    ![](img/f9e5762d07ca45a6f38ffcb92cd56e5e_252_0.png)


    The correct answer to this question is d. The shutdown.allow file does not exist
    by default, so you must create it in /etc and add Martin. With answer a, the shutdown
    utility is available to everyone but can only be run by root by default. Answer
    b makes him a member of root, which opens the door to many other problems. And
    answer c has the needed file beneath the wrong directory.'
