  md: '# The Command Line


    In the first instance, no job had been sent to the background, so the returned
    value was empty. We then sent a job to the background, and we found its process
    ID number by echoing $.


    # Quoting


    One of the most difficult components to understand is often the use of quotes.
    You can remember a few rules to make the concept easier to understand:


    +   - The three types of quotes are double quotes (""), single quotes (''''),
    and back quotes (`''). Each has a different and distinct meaning. Double quotes
    disable all characters except ''\'', and \$. Single quotes disable all characters
    except the back quote. The back quote substitutes the value for a command.


    +   - Quotes must always appear in even numbers. If you give an odd number, the
    shell believes that you have not finished with input and waits for more.


    +   - You can mix and match different types of quotes and embed them within one
    another.


    If you have a file named "sample of the worlds best cigars" and give the command:


    ```

    cat sample of the worlds best cigars

    ```


    the cat utility first tries to open a file named "sample", then one named "of",
    followed by four other files: "the", "worlds", "best", "cigars". The white space
    between the words is interpreted as delimiters between different files. To access
    the file, you must change the command to:


    ```

    cat "sample of the worlds best cigars"

    ```


    The double quotes cancel the default meaning of the white space and allow the
    value between them to be interpreted as a single entry. The double quotes cancel
    the meaning of most special characters, but not all. For example, if a variable
    named EXAMPLE is equal to 25, then:


    ```

    echo $EXAMPLE

    ```


    returns "25". Likewise:


    ```

    echo "EXAMPLE"

    ```


    also returns "25", and:'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# Chapter 2


    echo ''$EXAMPLE''


    returns"$EXAMPLE". The single quotes go above and beyond the double quotes and
    also cancel the meaning of the dollar sign.


    Moving in another direction, the next example:


    ```

    echo ''date''

    ```


    returns“date", but substituting the single quotes for back quotes has a different
    result:


    ```

    echo `date`

    ```


    returns the results of the date command. An alternative to using the back quotes
    in the newer shells is placing the command within parentheses and treating it
    as a variable. Thus, you can echo the date as shown earlier with the command:


    ```

    echo $(date)

    ```


    If you fail to use an even number of any quote set, PS1 is replaced by PS2 and
    continues to do so until the total number of quotes used (each set) equals an
    even number. This feature can be useful when you want to break a lengthy entry
