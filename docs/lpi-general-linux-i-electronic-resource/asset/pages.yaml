    As the name implies, the home directory holds subdirectories that are the home

    directories of users. For example, user edany, when entering the command cd,

    is placed in /home/eduelany, providing that value (the default) is used when

    setting up the account.


    Each user''s home directory provides a location to store files, as well as a place
