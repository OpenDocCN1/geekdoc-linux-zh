  md: '# The / Directory


    Everything begins at the root directory (/). The root is the directory from which
    everything else becomes a subdirectory or subcomponent. When specifying locations
    using absolute addressing, you always begin with this directory because it is
    the ultimate origin, and it is impossible to move any further back since there
    is no directory above it.


    # The bin Directory


    The bin directory holds the binaries (executables) that are essential to using
    the Linux operating system. Many of the utilities discussed so far are located
    in the bin directory, including:


