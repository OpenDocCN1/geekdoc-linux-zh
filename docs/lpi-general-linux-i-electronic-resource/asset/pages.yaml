    # Writing Documentation


    As a system administrator, one of the most important things you can do to ensure
    that your systems run smoothly is to provide documentation for the actions you
    undertake. Using common sense, you can often ascertain such things as:


    +   - The method of documentation—Printed or electronic? If it is electronic,
    can it exist within another document, or must it be a standalone document? If
    it is printed, is it a subset of a large document or a standalone entity?


    +   - The scope of the documentation—Should it address only a change that was
    made, or should it be all-inclusive? Any time you make a major change to the operation
    of a site, you need to document exactly what was done. Needless to say, you should
    make only one major change at a time to fully realize the ramifications of that
    change before making others.


    +   - The target audience—Will you use this note to jog your memory 6 months from
    now, or is it something to distribute to all users? If you are writing for yourself,
    you can get by with a few lines of terse notes. For distribution to users, documentation
    should be specific and offer as much background information as possible.


    Electronic documentation can exist as comment lines within script files, as as:


    ```

    # here we compare the two reports

    # and look for only the changes between

    # them

    ```


    It can also be HTML files. For the exam, you need not know how to create the documentation,
    but you should recognize that doing so is advisable and that you should have a
    plan for distributing documentation to the appropriate personnel. You should also
    know that some of the simplest documentation can create itself—such as log files.
    Elements that are imperative to include in good documentation are file locations,
    any configuration changes, and the resources involved (applications, scripts,
    source code, and so on).'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# Providing Support


    Just as creating proper documentation involves a great deal of common sense, so
    in too does providing support to users. You must possess not only technical skills,
    but also interpersonal skills, as well as the ability to listen to their concerns
    and react quickly.


    You should always make users feel as if you are listening to their concerns and
    trying to understand their problems. You should treat them with politeness and
    guidance—whether it is over the telephone, through an electronic medium (such
    as email), or in person. Treat them with the same respect and empathy you would
    have wanted extended to you. Although their problems may be nothing more than
    minor annoyances you can fix in less than a minute, to them the problems represent
    critical issues (or even crises).


    When solving a problem, punctuality and accountability are also important. When
    you tell a user you will be at 3:00 P.M., make every attempt to arrive at that
    time. When you solve the problem, the user should be confident that the problem
    is solved and that you will take responsibility if it recurs.


    Understand that crises tend to occur in clusters. When more than one occurs at
    a time, it is imperative to prioritize and tend the most severe problems first.
    If two users call at the same time—one cannot print the images downloaded from
    a Web site and the other can''t get payroll checks to run—know that the latter
    is the first issue to tackle.


    > For the exam, apply common sense to any questions pertaining to customer support,
    and you will have no difficulty answering them correctly.


    # Utility Summation


    I discussed only a handful of utilities in this chapter. Table 10.4 lists them
    and their purposes.


    Table 10.4 Utilities discussed in this chapter.

    | Utility | Purpose |

    | --- | --- |

    | man | Displays the manual pages. |

    | whatis | Shows what manual pages are available. |

    | --help | Displays command-line help from within some files. |

    | info | Displays help from the /usr/info files. |

    | whereis | Shows the location of the utility and all related files—including
    any man entries. |

    | apropos | Shows what manual pages are available but scans the entire entry and
    does not require exact matches.'
