  md: '# Practice Questions


    Question 1


    +   What will be the output of the command ps -ae?

    - a. Only processes for the current user will be shown, minus the session leader.

    - b. Only processes for the current user will be shown, with the session leader.

    - c. All processes will be shown for all users.

    - d. All processes will be shown for all users, minus any session leaders.


    The correct answer to this question is c. The -a option, when used alone, does
    not show the session leader, but the -e option asks for everything. This makes
    the syntax equal to “show selectively” and “show all.” You can’t have it both
    ways, and the -e option wins.


    # Question 2


    +   Which of the following will produce the same display as ps -f?

    - a. ps -f

    - b. ps -A

    - c. ps -l

    - d. ps -u


    The correct answer to this question is b. The -e option asks for everything, and
    the -A option asks for all. The -f option (answer a) will give a full listing,
    but only for the current user. The -l option (answer c) will give a long listing;
    again, it will be only for the current user in this case. The -u option (answer
    d) will add user-related information.'
