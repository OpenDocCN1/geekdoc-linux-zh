    \ bash 代码将向终端屏幕上打印行数：\n\n```\n2\n```\n\n### STDOUT（标准输出）\n\n你终端屏幕上的正常非错误文本是通过\
    \ STDOUT 文件描述符打印的。命令的 STDOUT 可以重定向到文件，使得命令的输出被写入文件而不是打印在终端屏幕上。这简单地通过 `>` 和 `>>`\
    \ 运算符来实现。\n\n示例：\n\n```\necho \"Hello World!\" > file.txt\n```\n\n接下来的命令不会在终端屏幕上打印\
    \ \"Hello World\"，它会创建一个名为 file.txt 的文件并将字符串 \"Hello World\" 写入其中。可以通过在 file.txt\
    \ 文件上运行 `cat` 命令来验证。\n\n```\ncat file.txt\n```\n\n然而，当你多次将任何命令的 STDOUT 重定向到同一个文件时，它会移除文件的现有内容并写入新内容。\n\
    \n示例：\n\n```\necho \"Hello World!\" > file.txt\necho \"How are you?\" > file.txt\n\
    ```\n\n在 file.txt 文件上运行 `cat` 时：\n\n```\ncat file.txt\n```\n\n你只会得到打印出的 \"How\
    \ are you?\" 字符串。\n\n```\nHow are you?\n```\n\n这是因为 \"Hello World\" 字符串被覆盖了。可以使用\
    \ `>>` 运算符避免这种行为。\n\n上面的示例可以写成：\n\n```\necho \"Hello World!\" > file.txt\necho\
    \ \"How are you?\" >> file.txt\n```\n\n在 file.txt 文件上运行 `cat`，你将得到预期的结果：\n\n```\n\
    Hello World!\nHow are you?\n```\n\n或者，STDOUT 的重定向运算符也可以写为 `1>`。例如，\n\n```\necho\
    \ \"Hello World!\" 1> file.txt\n```\n\n### STDERR（标准错误）\n\n终端屏幕上的错误文本是通过命令的 STDERR\
    \ 打印的。\n例如：\n\n```\nls --hello\n```\n\n会给出错误消息。此错误消息就是命令的 STDERR。\n\n可以使用 `2>`\
    \ 重定向 STDERR：\n\n```\nls --hello 2> error.txt\n```\n\n然后你可以通过查看 error.txt 看到错误：\n\
    \n```\ncat error.txt\n```\n\n你也可以使用 `2>>` 来追加错误信息：\n\n```\nls --hello 2>> error.txt\n\
    ```\n\n此外，还可以将 STDOUT 和 STDERR 同时重定向到同一个文件：\n\n```\nls --hello > output.txt 2>\
    \ output.txt\n```\n\n或者使用 `2>&1` 将 STDERR 重定向到 STDOUT：\n\n```\nls --hello > output.txt\
    \ 2>&1\n```\n\n# 管道\n\n到为止，我们已经了解了如何通过重定向 STDOUT、STDIN 和文件。为了将程序（命令）的输出作为另一个程序（命令）的输入，可以使用管道符\
    \ `|`。\n\n示例：\n\n```\nls | grep \".txt\"\n```\n\n语法：\n\n```\ncommand1 | command2\n\
    ```\n\n你也可以通过将它们组合成任意链来实现强大的结果。这个示例创建了目录下拥有文件的用户列表，以及他们有多少文件和目录：\n\n```bash\n\
    ls -l /projects/bash_scripts | tail -n +2 | sed 's/\\s*/ /g' | cut -d ' ' -f 3\
    \ | sort | uniq -c\n```\n\n输出：\n\n- 8 anne\n- 34 harry\n- 37 tina\n- 18 ryan\n\
