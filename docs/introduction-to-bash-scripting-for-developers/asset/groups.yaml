    # # Bash Variables


    As in any other programming language, you can use variables in Bash Scripting
    as well. However, there are no data types, and a variable in Bash can contain
    numbers as well as characters.


    To assign a value to a variable, all you need to do is the = sign:


    ```

    name="DevDojo"

    ```


    > > Notice: as an important note, you can not have spaces before and after the
    = sign.


    After that, to access the variable, you have to use the $ and reference it as
    shown below:


    ```

    echo $name

    ```


    Wrapping the variable name between curly brackets is not required, but is considered
    a good practice, and I would advise you to use them whenever you can:


    ```

    echo ${name}

    ```


    The above code would output: DevDojo as this is the value of our name variable.


    Next, let''s update our devmojo.sh script and include a variable in it.


