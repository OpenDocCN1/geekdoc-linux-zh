    # 使用 Bash 配合 Cloudflare API


    我将我所有的网站都托管在 DigitalOcean Droplets 上，并使用 Cloudflare 作为我的 CDN 供应商。使用 Cloudflare
    的用处之一是它可以减少到用户的整体流量，并通过他们的 CDN 隐藏你真实的服务器 IP 地址。


    我个人最喜欢的 Cloudflare 功能是他们的免费 DDoS 防护。它多次保护我的服务器免受各种 DDoS 攻击。他们有一个非常酷的 API，你可以用它轻松地启用和禁用
    DDoS 防护。


    本章将是一个练习！我挑战你编写一个短的 bash 脚本，根据需要自动为你的服务器启用和禁用 Cloudflare DDoS 防护！


    # 前提条件


    在遵循此指南之前，请设置你的 Cloudflare 账户并准备好你的网站。如果你不确定如何操作，可以遵循这些步骤：创建 Cloudflare 账户并添加网站。


    一旦你拥有了 Cloudflare 账户，请确保获取以下信息：


    - Cloudflare 账户

    - Cloudflare API key

    - Cloudflare Zone ID


    此外，确保你的服务器上安装了 `curl`：


    ```bash

    curl --version

    ```


    如果未安装 `curl`，你需要运行以下命令：


    - 对于 RedHat/CentOS：


    ```bash

    yum install curl

    ```


    - 对于 Debian/Ubuntu


    ```bash

    apt-get install curl

    ```


    # 挑战 - 脚本需求


    脚本需要监控你服务器的 CPU 使用情况，如果 CPU 使用率根据 vCPU 数量过高，它将通过 Cloudflare API 自动启用 Cloudflare
    DDoS 防护。


    脚本的主要功能应该是：


    - 检查服务器上的脚本 CPU 负载

    - 在 CPU 激增时，脚本触发对 Cloudflare 的 API 调用并为指定区域启用 DDoS 防护功能

    - 在 CPU 负载恢复正常后，脚本将禁用“正受攻击（I''m under attack）”选项并将其恢复正常


    # 示例脚本


    我已经准备了一个演示脚本可供你参考。但我鼓励你先尝试自己编写脚本，然后再看我的脚本！


    下载脚本只需运行以下命令：


    ```bash

    wget https://raw.githubusercontent.com/bobbyiliev/cloudflare-ddos/main/protection.sh

    ```


    使用你喜欢的编辑器打开脚本：


    ```bash

    nano protection.sh

    ```


    并更新以下细节：


    ```bash

    CF_ZONE_ID="YOUR_ZONE_ID"

    CF_EMAIL="YOUR_EMAIL"

    CF_API_KEY="YOUR_API_KEY"

    ```


    之后，让脚本具有可执行权限：


    ```bash

    chmod +x protection.sh

    ```


    最后，设置 Cron 每隔 30 分钟运行一次：


    ```bash

    crontab -e

    ```


    并添加以下内容：


    ```cron

    */30 * * * * /path/to/protection.sh

    ```


    注意：将路径更改为你存储脚本的实际路径。


