    # Bash Structure


    Let''s start by creating a new file with a .sh extension. As an example, we could
    create a file called devdojo.sh.


    To create that file, you can use the touch command:


    ```

    touch devdojo.sh

    ```


    Or you can use your text editor instead:


    ```

    nano devdojo.sh

    ```


    In order to execute/run a bash script file with the bash shell interpreter, the
    first line of a script must indicate the absolute path to the bash executable:


    ```

    #!/bin/bash

    ```


    This is also called a Shebang.


    All that the shebang does is to instruct the operating system to run the script
    with the /bin/bash executable.'
- md: '

    ## Bash Hello World


    Once we have our devdojo.sh file created and we''ve specified the shebang on the
    very first line, we are ready to create our first Hello World script.


    To do that, open the devdojo.sh file again and add the following after the #!/bin/bash
    line


    ```bash

    #!/bin/bash


    echo "Hello World!"

    ```


    Save the file and exit.


    After that make the script executable by running:


    ```bash

    chmod +x devdojo.sh

    ```


    After that execute the file:


    ```bash

    ./devdojo.sh

    ```


    You will see a "Hello World" message on the screen.


    Another way to run the script would be:


    ```bash

    bash devdojo.sh

    ```


    As bash can be used interactively, you could run the following command directly
    in your terminal and you would get the same result:


    ```bash

    echo "Hello DevDojo!"

    ```


    Putting a script together is useful once you have to combine multiple commands
    together.


    ## Bash Variables


    As in any other programming language, you can use variables in Bash Scripting
    as well. However, there are no data types, and a variable in Bash can contain
    numbers as well as characters.


    To assign a value to a variable, all you need to do is the = sign:


    ```bash

    name="DevDojo"

    ```


    > Notice: as an important note, you can not have spaces before and after the =
    sign.


    After that, to access the variable, you have to use the $ and reference it as
    shown below:


    ```bash

    echo $name

    ```


    Wrapping the variable name between curly brackets is not required, but is considered
    a good practice, and I would advise you to use them whenever you can:


    ```bash

    echo ${name}

    ```


    The above code would output: DevDojo as this is the value of our name variable.


    Next, let''s update our devdojo.sh script and include a variable in it.


    Again, you can open the file devdojo.sh with your favorite text editor, I''m using
    nano here to open the file:


    ```bash

    nano devdojo.sh

    ```


    Adding our name variable here in the file, with a welcome message. Our file now
    looks like this:


    ```bash

    #!/bin/bash

    name="DevDojo"

    echo "Hi there $name"

    ```


    Save it and run the file using the command below:


    ```bash

    ./devdojo.sh

    ```


    You would see the following output on your screen:


    Hi there DevDojo


    Here is a rundown of the script written in the file:


    - #!/bin/bash - At first, we specified our shebang.

    - name=DevDojo - Then, we defined a variable called name and assigned a value
    to it.

    - echo "Hi there $name" - Finally, we output the content of the variable on the
    screen as a welcome message by using echo


    You can also add multiple variables in the file as shown below:


    ```bash

    #!/bin/bash

    name="DevDojo"

    greeting="Hello"

    echo "$greeting $name"

    ```


    Save the file and run it again:


    ```bash

    ./devdojo.sh

    ```


    You would see the following output on your screen:


    ```bash

    Hello DevDojo

    ```


    Note that you don''t necessarily need to add semicolon ; at the end of each line.
    It works both ways, bit like other programming language such as JavaScript!


    You can also add variables in the Command Line outside the Bash script and they
    can be read as parameters:


    ```bash

    ./devdojo.sh Bobby buddy!

    ```


    This script takes in two parameters Bobby buddy! separated by space. In the devdojo.sh
    file we have the following:


    ```bash

    #!/bin/bash

    echo "Hello there" $1

    ```


    $1 is the first input (Bobby) in the Command Line. Similarly, there could be more
    inputs and they are all referred to the $ sign and their respective order of input.
    This means that buddy! is referenced to using $2. Another useful method for reading
    variables is the $@ which reads all inputs.


    So now let''s change the devdojo.sh file to better understand:


    ```bash

    #!/bin/bash

    echo "Hello there" $1

    # $1 : first parameter

    echo "Hello there" $2

    # $2 : second parameter

    echo "Hello there" $@

    # $@ : all

    ```


    The output for:


    ```bash

    ./devdojo.sh Bobby buddy!

    ```


    Would be the following:


    ```

    Hello there Bobby

    Hello there buddy!

    Hello there Bobby buddy!

    ```


    ## Bash User Input


    With the previous script, we defined a variable, and we output the value of the
    variable on the screen with the echo $name.


    Now''s go ahead and ask the user for input instead. To do that again, open the
    file with your favorite text editor and update the script as follows:


    ```bash

    #!/bin/bash

    echo "What is your name?"

    read name


    echo "Hi there $name"

    echo "Welcome to DevDojo!"

    ```


    The above will prompt the user for input and then store that input as a string/text
    in a variable.


    We can then use the variable and print a message back to them.


    The output of the above script would be:


    - First run the script:


    ```bash

    ./devdojo.sh

    ```


    - Then, you would be prompted to enter your name:


    ```

    What is your name?

    Bobby

    ```


    - Once you''ve typed your name, just hit enter, and you will get the following
    output:


    Hi there Bobby

    Welcome to DevDojo!


    To reduce the code, we could change the first echo statement with the read -p,
    the read command used with -p flag will print a message before prompting the user
    for their input:


    ```bash

    #!/bin/bash

    read -p "What is your name? " name

    echo "Hi there $name"

    echo "Welcome to DevDojo!"

    ```


    Make sure to test this out yourself as well!


    ## Bash Comments


    As with any other programming language, you can add comments to your script. Comments
    are used to leave yourself notes through your code.


    To do that in Bash, you will need to add the # symbol at the beginning of the
    line. Comments will never be rendered on the screen.


    Here is an example of a comment:


    ```bash

    # This is a comment and will not be rendered on the screen

    ```


    Let''s go ahead and add some comments to our script:


    ```bash

    #!/bin/bash

    # Ask the user for their name

    read -p "What is your name? " name


    # Greet the user

    echo "Hi there $name"

    echo "Welcome to DevDojo!"

    ```


    Comments are a great way to describe some functionality so that other people could
    find their way around.


    ## Arguments


    You can pass arguments to the shell when you execute it. For example, let''s create
    a script called arguments:


    ```bash

    #!/bin/bash

    echo "Argument one is $1"

    echo "Argument two is $2"

    echo "Argument three is $3"

    ```


    Save the file and make it executable:


    ```bash

    chmod +x arguments

    ```


    Then run the file and pass 3 arguments:


    ```bash

    ./arguments.sh dog cat bird

    ```


    The output that you would get is:




    Argument one is dog

    Argument two is cat

    Argument three is bird

    ```


    To reference all arguments, you can use $@:


    ```bash

    #!/bin/bash


    echo "All arguments: $@"

    ```


    If you run the script again:


    ```bash

    ./arguments.sh dog cat bird

    ```


    All arguments: dog cat bird


    Another thing that you need to keep in mind is that $0 is used to reference the
    script itself.


    This is an excellent way to create self destruct the file if you need to or just
    get the name of the script.


    For example, let''s create a script that prints out the name of the file and deletes
    the file after that:


    ```bash

    #!/bin/bash


    echo "The name of the file is: $0 and it is going to be self-deleted."


    rm f $0

    ```


    You need to be careful with the self deletion and ensure that you have your script
    backed up before you self-delete it.


    ## Arrays


    If you have ever done any programming, you are probably already familiar with
    arrays.


    But just in case you are not a developer, the main thing that you need to know
    is that unlike variables, arrays can hold several values under one name.


    You can initialize an array by assigning values divided by space and enclosed
    in ().

    Example:


    ```bash

    my_array=("value 1" "value 2" "value 3" "value 4")

    ```


    To access the elements in the array, you need to reference them by their numeric
    index.


    > Notice: keep in mind that you need to use curly brackets.


    - Access a single element, this would output: value 2


    ```bash

    echo ${my_array[1]}

    ```


    - This would return the last element: value 4


    ```bash

    echo ${my_array[-1]}

    ```


    - As with command line arguments using @ will return all arguments in the array,
    as follows: value 1 value 2 value 3 value 4


    ```bash

    echo ${my_array[@]}

    ```

