    wget

    https://raw.githubusercontent.com/bobbyiliev/quick_access_logs

    summary/master/spike_check

    ```


    The script does not make any changes to your system, it only reads the content
    of access log and summarizes it for you, however, once you''ve downloaded the
    file, make sure to review the content yourself.'
  - '[PAGE 115]


    # Running the script


    All that you have to do once the script has been downloaded is to make it executable
    and run it.


    To do that run the following command to make the script executable:


    ```

    chmod +x spike_check

    ```


    Then run the script:


    ```

    ./spike_check /path/to/your/access_log

    ```


    Make sure to change the path to the file with the actual path to your access log.
    For example if you are using Apache on an Ubuntu server, the exact command would
    look like this:


    ```

    ./spike_check /var/log/apache2/access.log

    ```


    If you are using Nginx the exact command would be almost the same, but with the
    path to the Nginx access log:


    ```

    ./spike_check /var/log/nginx/access.log

    ```'
  - '[PAGE 116]


    # Understanding the output


    Once you run the script, it might take a while depending on the size of the log.


    The output that you would see should look like this:


    ![](img/7521519cf793a2e66883462104020ab5_116_0.png)


    Essentially what we can tell in this case is that we''ve received 16 POST requests
    to our xmlrpc.php file which is often used by attackers to try and exploit WordPress
    websites by using various username and password combinations.


    In this specific case, this was not a brute force attack, but it gives us an early
    indication and we can take action to prevent a larger attack in the future.


    We can also see that there were a couple of Russian IP addresses accessing our
    site, in case that you do not expect any traffic from Russia, you might want to
    block those IP addresses as well.'
  - '[PAGE 117]


    # Conclusion


    This is an example of a simple BASH script that allows you to quickly summarize
    your access logs and determine if anything malicious is going on.


    Of course, you might want to also manually go through the logs as well well but
    it is a good challenge to try and automate this with Bash!


    > > Notice: This content was initially posted on DevDojo'
- md: "\n## Sending emails with Bash and SSMTP\n\nSSMTP is a tool that delivers emails\
    \ from a computer or a server to a configured mail host.\n\nSSMTP is not an email\
    \ server itself and does not receive emails or manage a queue.\n\nOne of its primary\
    \ uses is for forwarding automated email (like system alerts) off your machine\
    \ and to an external email address.\n\n## Prerequisites\n\nYou would need the\
    \ following things in order to be able to complete this tutorial successfully:\n\
    \n- Access to an Ubuntu 18.04 server as a non-root user with sudo privileges and\
    \ an active firewall installed on your server. To set these up, please refer to\
    \ our [Initial Server Setup Guide for Ubuntu 18.04](https://www.digitalocean.com/community/tutorials/initial-server-setup-guide-for-ubuntu-18-04)\n\
    - An SMTP server along with SMTP server, or you could set up your own SMTP server\
    \ by following the steps from this tutorial on [https://www.digitalocean.com/community/tutorials/how-to-install-and-configure-postfix-as-a-send-only-smtp-server-on-ubuntu-16-04](How\
    \ to Install and Configure Postfix as a Send-Only SMTP Server on Ubuntu 16.04)\n\
    \n## Installing SSMTP\n\nIn order to install SSMTP, you'll need to first update\
    \ your apt cache with:\n\n```\nsudo apt update\n```\n\nThen run the following\
    \ command to install SSMTP:\n\n```\nsudo apt install ssmtp\n```\n\nAnother thing\
    \ that you would need to install is mailutils, to do that run the following command:\n\
    \n```\nsudo apt install mailutils\n```\n\n## Configuring SSMTP\n\nNow that you\
    \ have ssmtp installed, in order to configure it to use your SMTP server when\
    \ sending emails, you need to edit the configuration file. Using your favourite\
    \ text editor open the /etc/ssmtp.conf file:\n\n```\nsudo nano /etc/ssmtp.conf\n\
    ```\n\nYou need to include your configuration:\n\n```\nroot=postmaster\nmailhub=your_smtp_host:587\n\
    hostname=your_hostname\nAuthUser=your_username@gmail.com\nAuthPass=your_password\n\
    From=YES\nSTARTTLS=YES\n```\n\nSave the file and exit.\n\n## Sending emails with\
    \ SSMTP\n\nOnce your configuration is done, in order to send an email just run\
    \ the following command:\n\n```\necho \"email body\" | mail -s \"email subject\"\
    \ recipient_email@domain.com\n```\n\nYou can run this directly in your terminal\
    \ or include it in bash scripts.\n\n## Sending A File with SSMTP (optional)\n\n\
    If you need to send files as attachments, you can use `mutt`. To install `mutt`\
    \ run the following command:\n\n```\nsudo apt install mut\n```\n\nNext, in order\
    \ to send an email with a file, run the following command:\n\n```\nmutt -s \"\
    Your Subject\" -- file.zip -- recipient_email@domain.com\n```\n\nThe above command\
    \ would send an email with file attached.\n\n## Conclusion\n\nSSMTP is a great\
    \ and reliable way to implement email functionality in bash scripts. For more\
    \ information about SSMTP I would recommend checking the official documentation.\n\
    \n**Notice:** This content was initially posted on the [DigitalOcean community](https://www.digitalocean.com/community).\n\
    \n## Password Generator Bash Script\n\nIt's not uncommon situation where you will\
    \ need to generate a random password that you can use for any software or when\
    \ signing up to any website. There are a lot of options to achieve this. You can\
    \ also use bash in your terminal (command-line) to generate a password quickly.\
    \ I will make sure to cover few of them and leave up to you to choose which option\
    \ is most suitable with your needs.\n\n## Security\n\nSecurity is not a joke,\
    \ so please make sure you do not save your passwords in plain text in a local\
    \ file or write them down by hand. I highly recommend everyone to use secure providers\
    \ to generate and save passwords.\n\n## Script summary\n\nLet me first do a quick\
    \ summary of what our script is going to do:\n\n1. We have to choose the password\
    \ length when the script is executed.\n2. The script will then generate random\
    \ passwords with the length specified in step 1.\n\n## Prerequisites\n\nYou would\
    \ need a bash terminal and a text editor. You can use any text editor like vi,\
    \ vim, nano or Visual Studio Code. If you're using a Windows PC, you can ssh to\
    \ any server of your choice and execute the script there. Although the script\
    \ is pretty simple, having some bash scripting knowledge will help you to better\
    \ understand the script and how it's working.\n\n## Generate a random password\n\
    \nOne of the great benefits of Linux is that you can do a lot of things using\
    \ different methods. When it comes to generating a random string of characters\
    \ it's not different either. I will cover few of them and provide some examples:\n\
    \n- Using the date command. The date command will output the current date and\
    \ time. We further manipulate the output to use it as a randomly generated password.\
    \ We can hash the date using md5, sha or just run it through base64. These are\
    \ few examples:\n\n```\ndate | md5sum\n94cb1cdec0699ed98acd9a7b8f6fed\n```\n\n\
    using sha256sum:\n\n```\ndate | sha256sum\n30a0c6091e94c8c7785f0d7bb6e1eac9b76c528f02213d1b6a5fbcc7cef4\n\
    ```\n\nusing base64:\n\n```\ndate | base64\n0YHQssDRj9C90YmAgMTk6NTE6NDGGVUDIwEK\n\
    ```\n\n- We can use openssl in order to generate pseudo-random bytes and run the\
    \ output through base64. An example output will be:\n\n```\nopenssl rand -base64\
    \ 10\n9+soM9btmhdcw==\n```\n\nKeep in mind that openssl might not be installed\
    \ on your system so it's likely that you will need to install it first in order\
    \ to use it.\n\n- The most preferred way is to use the pseudorandom number generator\
    \ /dev/urandom since it is intended for most cryptographic purposes. We also need\
    \ to manipulate the output using tr in order to translate it. An example command\
    \ is:\n\n```\ntr -cd '[:alnum:]' < /dev/urandom | fold -w10 | head -n 1\n```\n\
    \nWith this command we take the output from /dev/urandom and translate it with\
    \ tr while using all letters and digits and print the desired number of characters.\n\
    \n## The script\n\nFirst we begin the script with shebang. We use it to tell the\
    \ operating system which interpreter to use to parse the rest of the file:\n\n\
    ```bash\n#!/bin/bash\n```\n\nWe can then continue and ask the user for some input.\
    \ In this case we would like to know how many characters the password needs to\
    \ be:\n\n```bash\n# Ask user for password length\nclear\nprintf \"\\n\"\nread\
    \ -p \"How many characters you would like the password to have?\" pass_length\n\
    printf \"\\n\"\n```\n\nGenerate the passwords and print it so the user can use\
    \ it:\n\n```bash\n# This is where the magic happens!\nfor i in $(seq 1 $pass_length)\n\
    do\n  pass_output+=$(tr - '[:alnum:]' < /dev/urandom | head -c 1)\ndone\necho\
    \ $pass_output\n```\n"
  mdcn: "\n\n## 使用 Bash 和 SSMTP 发送电子邮件\n\nSSMTP 是一种将电子邮件从计算机或服务器发送到已配置的邮件主机的工具。\n\n\
    SSMTP 本身并不是电子邮件服务器，它不接收邮件或管理队列。\n\n它的主要用途之一是将自动生成的电子邮件（如系统警报）从你的机器转发到外部电子邮件地址。\n\
    \n## 先决条件\n\n为了能够成功完成本教程，你需要以下条件：\n\n- 拥有 Ubuntu 18.04 服务器的访问权限，用户为具有 sudo 权限的非\
    \ root 用户，且服务器上已安装活跃的防火墙。要设置这些内容，请参考我们的[Ubuntu 18.04 初始服务器设置指南](https://www.digitalocean.com/community/tutorials/initial-server-setup-guide-for-ubuntu-18-04)\n\
    - 一个 SMTP 服务器以及相应的 SMTP 服务配置，或者你可以按照此教程中的步骤建立你自己的 SMTP 服务器：[https://www.digitalocean.com/community/tutorials/how-to-install-and-configure-postfix-as-a-send-only-smtp-server-on-ubuntu-16-04](如何在\
    \ Ubuntu 16.04 上安装和配置 Postfix 作为仅发送 SMTP 服务器)\n\n## 安装 SSMTP\n\n为了安装 SSMTP，你首先通过以下命令更新\
    \ apt 缓存：\n\n```\nsudo apt update\n```\n\n然后运行以下命令安装 SSMTP：\n\n```\nsudo apt install\
    \ ssmtp\n```\n\n你可能还需要安装的是 mailutils，执行此操作请运行以下命令：\n\n```\nsudo apt install mailutils\n\
    ```\n\n## 配置 SSMTP\n\n现在你已经安装了 ssmtp，为了配置它在发送送邮件时使用你的 SMTP 服务器，你需要编辑配置文件。使用你喜欢的文本编辑器打开\
    \ /etc/ssmtp.conf 文件：\n\n```\nsudo nano /etc/ssmtp.conf\n```\n\n你需要包含你的配置：\n\n\
    ```\nroot=postmaster\nmailhub=your_smtp_host:587\nhostname=your_hostname\nAuthUser=your_username@gmail.com\n\
    AuthPass=your_password\nFrom=YES\nSTARTTLS=YES\n```\n\n保存文件并退出。\n\n## 使用 SSMTP\
    \ 发送电子邮件\n\n配置完成后，只需运行以下命令即可发送电子邮件：\n\n```\necho \"email body\" | mail -s \"email\
    \ subject\" recipient_email@domain.com\n```\n\n你可以直接在终端中运行它，或将其包含在 bash 脚本中。\n\
    \n## 使用 SSMTP 发送文件（可选）\n\n如果你需要发送文件附件，可以使用 `mutt`。安装 `mutt` 请运行以下命令：\n\n```\n\
    sudo apt install mut\n```\n\n接下来，要发送带文件的电子邮件，请运行以下命令：\n\n```\nmutt -s \"Your Subject\"\
    \ -- file.zip -- recipient_email@domain.com\n```\n\n上述命令将发送一封带附件的电子邮件。\n\n## 结论\n\
    \nSSMTP 是 bash 脚本中实现电子邮件功能的一种优秀且可靠的方法。关于 SSMTP 的更多信息，我建议查看官方文档。\n\n**注意：** 此内容最初发布在\
    \ [DigitalOcean 社区](https://www.digitalocean.com/community)。\n\n## 密码生成器 Bash\
    \ 脚本\n\n在很多情况下，你需要生成一个随机密码，用于任何软件或注册任何网站，这并不罕见。有很多方法可以实现这一点。你也可以在终端（命令行）中使用 bash\
    \ 来快速生成密码。我将涵盖其中的几种方法，并由你选择最符合你需求的选项。\n\n## 安全\n\n安全不是开玩笑，所以请确保不要以明文形式将密码保存在本地文件中，或手写下来。我强烈建议大家使用安全的供应商来生成和保存密码。\n\
    \n## 脚本总结\n\n让我先简要总结一下我们的脚本将执行的操作：\n\n1. 在脚本执行时必须选择密码长度。\n2. 脚本将根据步骤 1 中指定的长度生成随机密码。\n\
    \n## 先决条件\n\n你需要一个 bash 终端和一个文本编辑器。你可以使用任何文本编辑器，如 vi、vim、nano 或 Visual Studio\
    \ Code。如果你使用的是 Windows 电脑，可以 ssh 到你选择的任何服务器并在那里执行脚本。虽然脚本非常简单，但具备一些 bash 脚本知识将帮助你更好地理解脚本及其工作原理。\n\
    \n## 生成随机密码\n\nLinux 的巨大优势之一是你可以使用不同的方法来完成很多事情。在生成随机字符字符串时也是如此。我将涵盖几种方法并提供示例：\n\
    \n- 使用 `date` 命令。`date` 命令将输出当前的日期和时间。我们进一步对输出进行处理将其作为随机生成的密码。我们可以使用 md5、sha 对日期进行哈希处理，或直接通过\
    \ base64 运行。以下是几个示例：\n\n```\ndate | md5sum\n94cb1cdec0699ed98acd9a7b8f6fed\n```\n\
    \n使用 sha256sum：\n\n```\ndate | sha256sum\n30a0c6091e94c8c7785f0d7bb6e1eac9b76c528f02213d1b6a5fbcc7cef4\n\
    ```\n\n使用 base64：\n\n```\ndate | base64\n0YHQssDRj9C90YmAgMTk6NTE6NDGGVUDIwEK\n\
    ```\n\n- 我们可以使用 `openssl` 来生成伪随机字节并将输出通过 base64。示例输出如下：\n\n```\nopenssl rand -base64\
    \ 10\n9+soM9btmhdcw==\n```\n\n请记住，你的系统可能没有安装 openssl，因此你可能需要先安装才能使用。\n\n- 最优的方法是使用伪随机数生成器\
    \ `/dev/urandom`，因为它旨在用于大多数加密用途。我们还需要使用 `tr` 对输出进行处理以转换。示例命令为：\n\n```\ntr -cd\
    \ '[:alnum:]' < /dev/urandom | fold -w10 | head -n 1\n```\n\n通过此命令，我们从 /dev/urandom\
    \ 获取输出，使用 tr 进行转换（保留所有字母和数字），并打印指定数量的字符。\n\n## 脚本\n\n首先我们用 shebang 开始脚本。我们用它来告诉操作系统使用哪种解释器来解析文件的其余部分：\n\
    \n```bash\n#!/bin/bash\n```\n\n然后我们可以继续请求用户输入。在这种情况下，我们想知道密码需要多少字符：\n\n```bash\n\
    # 询问用户密码长度\nclear\nprintf \"\\n\"\nread -p \"How many characters you would like\
    \ the password to have?\" pass_length\nprintf \"\\n\"\n```\n\n生成密码并打印，以便用户可以使用：\n\
    \n```bash\n# 这就是魔法发生的地方\nfor i in $(seq 1 $pass_length)\ndo\n  pass_output+=$(tr\
    \ - '[:alnum:]' < /dev/urandom | head -c 1)\ndone\necho $pass_output\n```\n"
