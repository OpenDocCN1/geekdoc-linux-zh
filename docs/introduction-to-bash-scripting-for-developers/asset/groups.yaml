    \n# 贡献者\n\nAlex Georgiev\n\n## # Bash 中的重定向\n\nLinux 超级用户必须对 Bash 中的管道（pipes）和重定向（redirection）有良好的了解。这是系统的核心组成部分，在\
    \ Linux 系统管理领域通常非常有帮助。\n\n当你运行像 `ls`、`cat` 等命令时，你会在终端上看到一些输出。如果你写了错误的命令、传递了错误的标记或错误的命令行参数，你会在终端上得到错误输出。在这两种情况下，你都会得到一些文本。对你来说这似乎仅仅是“文本”，但系统处理这些文本的方式是不同的。这个标识符被称为文件描述符（File\
