    ## 创建自定义 bash 命令\n\n作为开发者或系统管理员，你可能需要在终端中花费大量时间。我总是尝试寻找优化重复性任务的方法。\n\n实现这一点的方法是编写短的\
    \ bash 脚本或创建自定义命令（也称为别名，aliases）。例如，与其每次都输入一个非常长的命令，你只需为它创建一个快捷方式即可。\n\n## 示例\n\
    \n让我们从以下场景开始：作为系统管理员，你可能经常需要检查 Web 服务器的连接情况，因此我将使用 `netstat` 命令作为示例。\n\n当我访问一个\
    \ 80 或 443 端口连接出现问题的服务器时，我通常会检查是否有服务在监听这些端口，以及到这些端口的数量。\n\n以下 `netstat` 命令将显示我们目前在\
    \ 80 和 443 端口上有多少 TCP 连接：\n\n```\nnetstat -plant | grep '80\\|443' | grep -v LISTEN\
    \ | wc -l\n```\n\n这是一个相当长的命令，从长远来看，每次都输入可能会耗时，特别是当你想要快速获取这些信息时。\n\n为了避免这种情况，我们可以创建一个别名，这样与其输入整个命令，我们只需要输入一个短命令。例如，假设我们想要能够输入\
    \ `conn`（connections 的缩写）并获取相同的信息。在这种情况下，我们只需要运行以下命令：\n\n```\nalias conn=\"netstat\
    \ -plant | grep '80\\|443' | grep -v LISTEN | wc -l\"\n```\n\n这样，我们就创建了一个名为 `conn`\
    \ 的别名，它本质上是我们长 `netstat` 命令的“快捷方式”。现在，如果你直接运行 `conn`：\n\n```\nconn\n```\n\n你将得到与长\
    \ `netstat` 命令相同的输出。你甚至可以更有创意，添加像这样的信息消息：\n\n```\nalias conn=\"echo 'Total connections\
    \ on port 80 and 443:' ;\nnetstat -plant | grep '80\\|443' | grep -v LISTEN |\
    \ wc -l\"\n```\n\n现在如果你运行 `conn`，你将得到以下输出：\n\n```\nTotal connections on port 80\
    \ and 443:\n12\n```\n\n现在，如果你注销并重新登录，你的别名将会丢失。在下一步中，你将看到如何让它持久化。\n\n## 使更改持久化\n\
    \n为了让更改持久化，我们需要在 shell 配置文件中添加 `alias` 命令。\n\n在 Ubuntu 上，默认是 `~/.bashrc` 文件，对于其他操作系统，这可能是\
    \ `~/.bash_profile`。用你喜喜欢的文本编辑器打开该文件：\n\n```\nnano ~/.bashrc\n```\n\n移动到底部并添加以下内容：\n\
    \n```\nalias conn=\"echo 'Total connections on port 80 and 443:'; netstat -plant\
    \ | grep '80\\|443' | grep -v LISTEN | wc -l\"\n```\n\n保存并退出。\n\n这样，现在即使你注销并重新登录，你的更改也将保留，并且你能够运行你的自定义\
    \ bash 命令。\n\n## 列出所有可用别名\n\n要列出当前 shell 的所有可用别名，你只需要运行以下命令：\n\n```\nalias\n```\n\
    \n当你在发现某些命令出现异常行为时，这会非常有用。\n\n## 结论\n\n这是创建自定义 bash 命令或 bash 别名的一种方法。\n\n当然，你实际上可以编写一个\
    \ bash 脚本并将其添加到 `/usr/bin` 文件夹中，但如果你没有 root 或 sudo 权限，这种方法将无法运行；而使用别名，你可以在不需要\
    \ root 权限的情况下完成。\n\n> **注意**：此内容最初发布在 DevDojo.com。\n\n## 编写你的第一个 Bash 脚本\n\n让我们尝试结合我们为止学到的内容，创建我们的第一个\
    \ Bash 脚本吧！\n\n## 规划脚本\n\n作为一个示例，我们将编写一个脚本，收集有关我们服务器的一些有用信息，例如：\n\n- 当前磁盘使用情况\n\
    - 当前 CPU 使用率\n- 当前内存使用率\n- 检查精确的内核版本\n\n你可以通过添加或删除功能来调整脚本，以符合你的需求。\n\n## 编写脚本\n\
    \n你首先需要的是创建一个带有 `.sh` 扩展的新文件。我将创建一个名为 `status.sh` 的文件，因为我们要创建的脚本将提供服务器的状态。\n\n\
    一旦创建了文件，请用你喜欢的文本编辑器打开它。\n\n正如我们在第 1 章中学到的，在 Bash 脚本的第一行，我们需要指定所谓的 Shebang：\n\n\
    ```\n#!/bin/bash\n```\n\nshebang 的唯一作用就是指示操作系统使用 `/bin/bash` 可执行文件来运行该脚本。\n\n\
    ## 添加注释\n\n接下来，正如第 6 章中讨论的，让我们从添加一些注释开始，以便人们能轻松看出脚本的用途。在 Shebang 之后，你只需添加以下内容：\n\
    \n```bash\n#!/bin/bash\n\n# 返回当前服务器状态的脚本\n```\n\n## 添加你的第一个变量\n\n让我们应用第 4 章中学到的知识，添加一些我们可能在整个脚本中使用的变量。\n\
    \n在 bash 中为变量赋值，你只需要使用 `=` 符号。例如，我们将主机名存储在变量中：\n\n```\nserver_name=$(hostname)\n\
    ```\n\n通过使用 `$()`，我们告诉 bash 实际解释命令然后回显变量：\n\n```\necho $server_name\n```\n\n##\
    \ 添加你的第一个函数\n\n正如你在阅读第 1 章后所知，为了创建一个函数，你需要使用以下结构：\n\n```\nfunction function_name()\
    \ {\n  your_commands\n}\n```\n\n快速运行该函数：\n\n```bash\nfunction memory_check() {\n\
    \    echo \"\"\n    echo \"The memory usage on ${server_name} is: \"\n    free\
    \ -h\n    echo \"\"\n}\n```\n\n一旦定义了函数，要调用它，只需使用函数名：\n\n```bash\nmemory_check\n\
    ```\n\n## 更多函数挑战\n\n在查看解决方案之前，我挑战你使用上面的函数自己编写几个函数。\n\n这些函数应该实现以下功能：\n\n- 当前磁盘使用情况\n\
    - 当前 CPU 使用率\n- 当前内存使用率\n- 检查精确的内核版本\n\n如果你不确定需要哪些命令来获取这些信息，请尽管使用谷歌。\n\n一旦你准备好了，请向下滚动查看我们是如何做的并对比结果！\n\
    \n请注意，实现它有多种方法！\n\n## 示例脚本\n\n这是最终结果的样子：\n\n```bash\n#!/bin/bash\n##\n# 检查内容的\
    \ BASH 脚本\n# 内存使用情况\n# CPU 负载\n# TCP 连接数\n# 内核版本\n##\n\nserver_name=$(hostname)\n\
    \nfunction memory_check() {\n    echo \"\"\n    echo \"Memory usage on ${server_name}\
    \ is: \"\n    free -h\n    echo \"\"\n}\n\nfunction cpu_check() {\n    echo \"\
    \"\n    echo \"CPU load on ${server_name} is: \"\n    echo \"\"\n    uptime\n\
    \    echo \"\"\n}\n\nfunction tcp_check() {\n    echo \"\"\n    echo \"TCP connections\
    \ on ${server_name}: \"\n    echo \"\"\n    cat /proc/net/tcp | wc -l\n    echo\
    \ \"\"\n}\n\nfunction kernel_check() {\n    echo \"\"\n    echo \"Kernel version\
    \ on ${server_name} is: \"\n    uname -a\n    echo \"\"\n}\n\n# 调用函数\nmemory_check\n\
    cpu_check\ntcp_check\nkernel_check\n```\n"
