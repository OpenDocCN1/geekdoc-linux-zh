    \ heredoc：\n\n```\ncat << randomword1\nThis script will print these lines on the\
    \ terminal.\nNote that cat can read from standard input. Using this heredoc, we\
    \ can\ncreate a temporary file with these lines as it's\ncontent and pipe that\n\
    to cat.\nrandomword1\n```\n\n实际上，这看起来就像是 heredoc 的内容被管道传输到了命令。如果需要将多行管道到程序，这可以让脚本变得非常整洁。\n\
    \n此外，我们可以如所示附加更多管道：\n\n```\ncat << randomword1 | wc\nThis script will print these\
    \ lines on the terminal.\nNote that cat can read from standard input. Using this\n\
    heroc, we can\ncreate a temporary file with these lines as it's\ncontent and pipe\
    \ that\ninto cat.\nrandomword1\n```\n\n此外，可以在 heredoc 中使用预定义的变量。\n\n```\ncat <<\
    \ EOF\n$VAR\nEOF\n```\n\n它们都可以重定向到文件：\n\n```\ncat << EOF > file.txt\n```\n\n 还有另一种更短的方法来这样做：\n\
    \n```\n./install_package.sh > file.txt 2>&1\n```\n\n### HereString\n\nHerestring\
    \ 与 heredoc 非常相似，但使用的是 `<<<`。这些用于必须管道到某些程序的单行字符串。这看起来比 heredoc 更整洁，因为我们不需要指定分隔符。\n\
    \n```\nwc <<<this is an easy way of passing strings to the stdin of a program\
    \ (here wc)\"\n```\n\n就像 heredoc 一样，herestring 也可以包含变量。\n\n"
