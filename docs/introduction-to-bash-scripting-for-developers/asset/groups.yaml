  mdcn: "\n\n```bash\n#!/bin/bash\nread -p \"Enter the name of your car brand: \"\
    \ car\ncase $car in\nTesla)\n  echo -n \"${car}'s car factory is in the USA.\"\
    \n  ;;\nBMW | Mercedes | Audi | Porsche)\n  echo -n \"${car}'s car factory is\
    \ in Germany.\"\n  ;;\nToyota | Mazda | Mitsubishi | Subaru)\n  echo -n \"${car}'s\
    \ car factory is in Japan.\"\n  ;;\n*)\n  echo -n \"${car} is an unknown car brand\"\
    \n  ;;\nesac\n```\n\n通过这个脚本，我们要求用户输入汽车品牌名称，例如 Tesla、BMW、Mercedes 等。\n\n然后，我们使用\
    \ `case` 语句检查品牌名称，如果它匹配我们定义的模式中的任何一个，如果是的话，我们就打印出工厂的位置。\n\n如果品牌名称没有匹配任何 `case`\
    \ 语句，我们将打印一条默认消息：未知的汽车品牌。\n\n# 结论\n\n我建议你尝试修改这个脚本并玩一玩它，这样你就可以练习在最后两章中学到的内容了！\n\
    \n关于更多 Bash `case` 语句的示例，请务必查看第 16 章，在那里我们将使用 `case` 语句在 Bash 中创建一个交互式菜单来处理用户输入。\n\
    \n# Bash 循环\n\n与任何其他语言一样，循环非常方便。在 Bash 中，你可以使用 `for` 循环、`while` 循环和 `until` 循环。\n\
    \n# For 循环\n\n这是 `for` 循环的结构：\n\n```bash\nfor var in ${list}\ndo\n  your_commands\n\
    done\n```\n\n示例：\n\n```bash\n#!/bin/bash\nusers=\"devdojo bobby tony\"\nfor user\
    \ in ${users}\ndo\n  echo \"${user}\"\ndone\n```\n\n对示例的快速复习：\n\n- 首先，我们指定了一个用户列表并将值存储在名为\
    \ `$users` 的变量中。\n- 之后，我们使用 `for` 关键字开始 `for` 循环。\n- 然后我们定义了一个新变量，它代表我们提供的列表中的每个项目。在我们的例子中，我们定义了一个名为\
    \ `user` 的变量，它代表 `$users` 变量中的每个用户。\n- 接着我们指定 `in` 关键字，后面跟上我们要遍历的列表。\n- 在下一行，我们使用\
    \ `do` 关键字，它表示我们在循环的每次迭代中要做什么。\n- 然后我们指定我们想要运行的命令。\n- 最后，我们用 `done` 关键字结束循环。\n\
    \n你也可以用 `for` 来处理一组数字。例如，这里是循环 1 到 10 的一种方法：\n\n```bash\n#!/bin/bash\nfor num\
    \ in {1..10}\ndo\n  echo ${num}\ndone\n```\n\n# While 循环\n\n`while` 循环的结构与 `for`\
    \ 循环非常相似：\n\n```bash\nwhile [ your_condition ]\ndo\n  your_commands\ndone\n```\n\
    \n这是一个 `while` 循环的示例：\n\n```bash\n#!/bin/bash\n\ncounter=1\nwhile [[ $counter\
    \ -le 10 ]]\ndo\n  echo $counter\n  ((counter++))\ndone\n```\n\n首先，我们指定了一个计数器变量并将其设置为\
    \ 1，然后在循环内部，我们使用这条语句 `((counter++))` 为计数器加 1。这样，我们就能确保循环将运行 10 次而不会无限运行。一旦计数器变为\
    \ 10，循环就会完成，因为这是我们设置的条件：`while [[ $counter -le 10 ]]`。\n\n让我们创建一个脚本，询问用户的姓名且不允许空输入：\n\
    \n```bash\n#!/bin/bash\n\nread -p \"What is your name? \" name\n\nwhile [[ -z\
    \ ${name} ]]\ndo\n    echo \"Your name can not be blank. Please enter a valid\
    \ name!\"\n    read -p \"Enter your name again? \" name\ndone\n\necho \"Hi there\
    \ ${name}\"\n```\n\n现在，如果你运行上面的代码并直接按回车而不输入，循环将再次运行并反复询问你的名字，直到你输入提供了输入。\n\n#\
    \ Until 循环\n\n`until` 循环和 `while` 循环的区别在于，`until` 循环会执行循环内的命令，直到条件变为真。\n\n结构：\n\
    \n```bash\nuntil [[ your_condition ]]\ndo\n    your_commands\ndone\n```\n\n示例：\n\
    \n```bash\n#!/bin/bash\n\ncount=1\nuntil [[ $count -gt 10 ]]\ndo\n    echo $count\n\
    \    ((count++))\ndone\n```\n\n# Continue 和 Break\n\n与其他语言一样，你也可以在 bash 脚本中使用\
    \ `continue` 和 `break`：\n\n- `continue` 告诉你的 bash 脚本停止当前的循环迭代并开始下一次迭代。\n\n`continue`\
    \ 语句的语法如下：\n\n```bash\ncontinue [n]\n```\n\n参数 `[n]` 是可选的，可以大于等于 1。当给出 `[n]` 时，将恢复第\
    \ n 个外层循环。`continue 1` 等同于 `continue`。\n\n```bash\n#!/bin/bash\nfor i in 1 2 3\
    \ 4 5\ndo\n    if [[ $i -eq 2 ]]\n    then\n        echo \"skipping number 2\"\
    \n        continue\n    fi\n    echo \"i is equal to $i\"\ndone\n```\n\n我们也可以以类似于\
    \ `break` 命令的方式使用 `continue` 命令来控制多个循环。\n\n- `break` 告诉你的 bash 脚本立即结束循环。\n\n`break`\
    \ 语句的语法形式如下：\n\n```bash\nbreak [n]\n```\n\n`[n]` 是一个可选参数，必须大于等于 1。\n\n注意：`break`\
    \ 默认用于跳出循环。\n\n```bash\n#!/bin/bash\nfor i in 1 2 3 4 5\ndo\n    if [[ $i -eq\
    \ 2 ]]\n    then\n        echo \"skipping number 2\"\n        continue\n    fi\n\
    \    echo \"i is equal to $i\"\ndone\n```\n\n我们也可以以类似于 `break` 命令的方式使用 `continue`\
    \ 命令来控制多个循环。\n\n`break` 告诉你的 bash 脚本立即结束循环。\n\n`break` 语句的语法形式如下：\n\n```bash\n\
    break [n]\n```\n\n`[n]` 是一个可选参数，必须大于等于 1。\n\n注意：`break` 默认用于跳出循环。\n\n示例：\n\n```bash\n\
    #!/bin/bash\nnum=1\nwhile [[ $num -le 5 ]]\ndo\n  if [[ $num -eq 3 ]]\n  then\n\
    \    break\n  fi\n  echo $num\n  ((num++))\ndone\n```\n\n`break 2` 会跳出嵌套的两层循环。\n\
    \n示例：\n\n```bash\n#!/bin/bash\nfor i in {1..3}\ndo\n    for j in {1..3}\n    do\n\
    \        if [[ $i -eq 2 && $j -eq 2 ]]\n        then\n            break 2\n  \
    \      fi\n        echo \"i: $i, j: $j\"\n    done\ndone\n```\n\n# 函数\n\n函数是复用代码的极佳方法。Bash\
    \ 中函数的结构与大多数语言相似：\n\n```bash\nfunction function_name() {\n  your_commands\n}\n\
    ```\n\n你也可以省略开头的 `function` 关键字，这也是有效的：\n\n```bash\nfunction_name() {\n  your_commands\n\
    }\n```\n\n我更喜欢放在那里以提高可读性。\"Hello!\" 函数示例：\n\n```bash\n#!/bin/bash\nfunction hello()\
    \ {\n  echo \"Hello!\"\n}\nhello\n```\n\n> 注意：需要记住的是，调用函数时不需要加括号。\n\n向函数传递参数与向脚本传递参数相同：\n\
    \n```bash\n#!/bin/bash\nfunction hello() {\n    echo \"Hello $1!\"\n}\n\nhello\
    \ Devojo\n```\n\n函数应该包含描述、全局变量、参数、输出和返回值（如果适用）：\n\n```bash\n###########################################\n\
    # Description: Hello 函数\n# Globals:\n# None\n# Arguments: 单个输入参数\n# Outputs: 输入参数的值\n\
    # Returns: 成功返回 0，错误返回非零\n###########################################\nfunction\
    \ hello() {\n    echo \"Hello $1!\"\n}\n```\n\n在接下来的几章中我们将大量使用函数！\n\n# 调试、测试快捷快捷\n\
    \n为了调试你的 bash 脚本，可以在执行脚本时使用 `-x`：\n\n```bash\nbash -x ./your_script.sh\n```\n\n\
    或者你可以在想要调试的特定行之前添加 `set -x`，`set -x` 会开启一种模式，将执行的所有命令打印到终端。\n\n测试脚本的另一种方法是使用这个强大的工具：\n\
    \nhttps://www.shellcheck.net/\n\n只需将代码粘贴到文本框中，工具就会提供一些改进脚本的建议。\n\n你也可以直接在终端运行该工具：\n\
    \nhttps://github.com/koalaman/shellcheck\n\n如果你喜欢这个工具，请确保在 GitHub 上 star 它并做出贡献！\n\
    \n作为一名系统管理员/DevOps 工程师，我每天的大部分时间都在终端度过。以下是我最喜欢的在编写 Bash 脚本或在终端工作时帮助更快完成任务的快捷键。\n\
    \n如果你有一个非常长的命令，以下两个特别有用：\n\n- 删除从光标到行尾的所有内容：\n\n```\nCtrl + k\n```\n\n- 删除从光标到行首的所有内容：\n\
    \n```\nCtrl + u\n```\n\n"
