  - '[PAGE 88]


    # Executing BASH scripts on Multiple Remote Servers


    Any command that you can run from the command line can be used in a bash script.
    Scripts are used to run a series of commands. Bash is available by default on
    Linux and macOS operating systems.


    Let''s have a hypothetical scenario where you need to execute a BASH script on
    multiple remote servers, but you don''t want to manually copy the script to each
    server, then again login to each server individually and only then execute the
    script.


    Of course you could use a tool like Ansible but lets learn how to do that with
    Bash!'
  - '[PAGE 89]


    # Prerequisites


    For this example I will use 3 remote Ubuntu servers deployed on DigitalOcean.
    If you don''t have a Digital Ocean account yet, you can sign up for DigitalOcean
    and get $100 free credit via this referral link:


    https://m.do.co/c/2a9bba940f39


    Once you have your Digital Ocean account ready go ahead and deploy 3 droplets.


    I''ve gone ahead and created 3 Ubuntu servers:


    ![](img/7521519cf793a2e66883462104020ab5_89_0.png)


    I''ll put those servers IP''s in a `servers.txt` file which I would use to loop
    though with our Bash script.


    If you are new to DigitalOcean you can follow the steps on how to create a Droplet
    here:


    +   - How to Create a Droplet from the DigitalOcean Control Panel


    You can also follow the steps from this video on how to do your initial server
    setup:


    +   - How to do your Initial Server Setup with Ubuntu


    Or even better, you can follow this article here on how to automate your initial
    server setup with Bash:


    Automating Initial Server Setup with Ubuntu 18.04 with Bash


    With the 3 new servers in place, we can go ahead and focus on running our Bash
    script on all of them with a single command!'
- md: "\n# The BASH Script\n\nI will reuse the demo script from the previous chapter\
    \ with some slight changes. It simply executes a few checks like the current memory\
    \ usage, the current CPU usage, the number of TCP connections and the version\
    \ of the kernel.\n\n```bash\n#!/bin/bash\n##\n# BASH script that checks the following:\n\
    # Memory usage\n# CPU load\n# Number of TCP connections\n# Kernel version\n##\n\
    \n##\n# Memory check\n##\nserver_name=$(hostname)\n\nfunction memory_check() {\n\
    \    echo \"######\"\n    echo \"The current memory usage on ${server_name} is:\
    \ \"\n    free -h\n    echo \"######\"\n}\n\nfunction cpu_check() {\n    echo\
    \ \"######\"\n    echo \"The current CPU load on ${server_name} is: \"\n    echo\
    \ \"\"\n    uptime\n    echo \"######\"\n}\n\nfunction tcp_check() {\n    echo\
    \ \"######\"\n    echo \"Total TCP connections on ${server_name}: \"\n    echo\
    \ \"\"\n    cat /proc/net/tcp | wc -l\n    echo \"######\"\n}\n```\n\n```bash\n\
    function kernel_check() {\n    echo \"######\"\n    echo \"The exact Kernel version\
    \ on ${server_name} is: \"\n    echo \"\"\n    uname -r\n    echo \"######\"\n\
    }\n\nfunction all_checks() {\n    memory_check\n    cpu_check\n    tcp_check\n\
    \    kernel_check\n}\n\nall_checks\n```\n\nCopy the code below and add this to\
    \ in a file called remote_check.sh. You can also get the script from here.\n\n\
    # Running the Script on all Servers\n\nNow that we have the script and the servers\
    \ ready and that we've added those servers in our servers.txt file we can run\
    \ the following command to loop though all servers and execute the script remotely\
    \ without having to copy the script to each server and individually connect to\
    \ each server.\n\n```bash\nfor server in $(cat servers.txt); do ssh your_user@${server}\
    \ 'bash -s' < ./remote_check.sh ; done\n```\n\nWhat this for loop does is, it\
    \ goes through each server in the servers.txt file and then runs the following\
    \ command for each item in the list:\n\n```bash\nssh your_user@the_server_ip 'bash\
    \ -s' < ./remote_check.sh\n```\n\nYou would get the following output:\n\n![](img/7521519cf793a2e66883462104020ab5_92_0.png)\n\
    \n# Conclusion\n\nThis is just a really simple example on how to execute a simple\
    \ script on multiple servers without having to copy the script to each server\
    \ and without having to access the servers individually.\n\nOf course you could\
    \ run a much more complex script and on many more servers.\n\nIf you are interested\
    \ in automation, I would recommend checking out the Ansible resources page on\
    \ the DigitalOcean website:\n\nAnsible Resources\n\n> Notice: This content was\
    \ initially posted on DevDojo\n\n# Work with JSON in BASH using jq\n\nThe jq command-line\
    \ tool is a lightweight and flexible command-line JSON processor. It is great\
    \ for parsing JSON output in BASH.\n\nOne of the great things about jq is that\
    \ it is written in portable C, and it has zero runtime dependencies. All you need\
    \ to do is to download a single binary or use a package manager like apt and install\
    \ it with a single command.\n\n# Planning the script\n\nFor the demo in this tutorial,\
    \ I would use an external REST API that returns a simple JSON output called the\
    \ QuizAPI:\n\nhttps://quizapi.io/\n\nIf you want to follow along make sure to\
    \ get a free API key here:\n\nhttps://quizapi.io/clientarea/settings/token\n\n\
    The QuizAPI is free for developers.\n\n# Installing jq\n\nThere are many ways\
    \ to install jq on your system. One of the most straight forward ways to do so\
    \ is to use the package manager depending on your OS.\n\nHere is a list of the\
    \ commands that you would need to use depending on your OS:\n\n- Install jq on\
    \ Ubuntu/Debian\n```bash\nsudo apt-get install jq\n```\n\n- Install jq on Fedora\n\
    ```bash\nsudo dnf install jq\n```\n\n- Install jq on openSUSE\n```bash\nsudo zypper\
    \ install jq\n```\n\n- Install jq on Arch\n```bash\nsudo pacman -S jq\n```\n\n\
    - Installing on Mac with Homebrew\n```bash\nbrew install jq\n```\n\n- Install\
    \ on Mac with MacPort\n```bash\nport install jq\n```\n\nIf you are using other\
    \ OS, I would recommend taking a look at the official documentation here for more\
    \ information:\n\nhttps://stedolan.github.io/jq/download/\n\nOnce you have jq\
    \ installed you can check your current version by running this command:\n\n```bash\n\
    jq --version\n```\n\n# Parsing JSON with jq\n\nOnce you have jq installed and\
    \ your QuizAPI API Key, you can parse the JSON output of the QuizAPI directly\
    \ in your terminal.\n\nFirst, create a variable that stores your API Key:\n\n\
    ```bash\nAPI_KEY=YOUR_API_KEY_HERE\n```\n\nIn order to get some output from one\
    \ of the endpoints of the QuizAPI you can use the curl command:\n\n```bash\ncurl\
    \ \"https://quizapi.io/api/v1/questions?apiKey=${API_KEY}&limit=1\"\n```\n\nFor\
    \ a more specific output, you can use the QuizAPI URL Generator here:\n\nhttps://quizapi.io/api-config\n\
    \nAfter running the curl command, the output which you would get would look like\
    \ this:\n\n![](img/7521519cf793a2e66883462104020ab5_98_0.png)\n\nThis could be\
    \ quite hard to read, but thanks to the jq command-line tool, all we need to do\
    \ is pipe the curl command to jq and we would see a nice formatted JSON output:\n\
    \n```bash\ncurl \"https://quizapi.io/api/v1/questions?apiKey=${API_KEY}&limit=1\"\
    \ | jq\n```\n\nNote the | jq at the end.\n\nIn this case, the output that you\
    \ would get look something like this:\n\n![](img/7521519cf793a2e66883462104020ab5_98_1.png)\n\
    \nNow, this looks much nicer! The jq command-line tool formatted the output for\
    \ us and added some nice coloring!\n\n# Getting the first element with jq\n\n\
    Let's say that we only wanted to get the first element from the JSON output, in\
    \ order to do that we have to just specify the index that we want to see with\
    \ the following syntax:\n\n```bash\njq .[0]\n```\n\nNow, if we run the curl command\
    \ again and pipe the output to jq .[0] like this:\n\n```bash\ncurl \"https://quizapi.io/api/v1/questions?apiKey=${API_KEY}&limit=1\"\
    \ | jq .[0]\n```\n\nYou will only get the first element and the output will look\
    \ like this:\n\n![](img/7521519cf793a2e66883462104020ab5_100_0.png)\n\n# Getting\
    \ a value only for specific key\n\nSometimes you might want to get the value of\
    \ a specific key only, let's say in our example the QuizAPI returns a list of\
    \ questions along with the answers, description and etc. but what if you wanted\
    \ to get the Questions without the additional information?\n\nThis is going to\
    \ be quite straightforward with jq, all you need to do is add the key after jq\
    \ command, so it would look something like this:\n\n```bash\njq .[].question\n\
    ```\n\nWe have to add the .[] as the QuizAPI returns an array and by specifying\
    \ .[] we tell jq that we want to get the .question value for all of the elements\
    \ in the array.\n\nThe output that you would get would look like this:\n\n![](img/7521519cf793a2e66883462104020ab5_101_0.png)\n\
    \nAs you can see we now only get the questions without the rest of the values.\n\
    \n# Using jq in a BASH script\n\nLet's go ahead and create a small bash script\
    \ which should output the following information for us:\n\n- Get only the first\
    \ question from the output\n- Get all of the answers for that question\n- Assign\
    \ the answers to variables\n- Print the question and the answers\n- To do that\
    \ I've put together the following script:\n\n> Notice: make sure to change the\
    \ API_KEY part with your actual QuizAPI key:\n\n```bash\n#!/bin/bash\n##\n# Make\
    \ an API call to QuizAPI and store the output in a variable\n##\noutput=$(curl\
    \ 'https://quizapi.io/api/v1/questions?apiKey=API_KEY&limit=10' >/dev/null)\n\
    ##\n# Get only the first question\n##\noutput=$(echo $output | jq.[0])\n##\n#\
    \ Get the question\n##\nquestion=$(echo $output | jq .question)\n##\n# Get the\
    \ answers\n##\nanswer_a=$(echo $output | jq .answers.a)\nanswer_b=$(echo $output\
    \ | jq .answers.b)\nanswer_c=$(echo $output | jq .answers.c)\nanswer_d=$(echo\
    \ $output | jq .answers.d)\n##\n# Output the question\n##\necho \"\nQuestion:\
    \ ${question}\n\nA) ${answer_a}\nB) ${answer_b}\nC) ${answer_c}\nD) ${answer_d}\n\
    \"\n```\n\nIf you run the script you would get the following output:\n\nWe can\
    \ even go further by making this interactive so that we could actually choose\
    \ the answer directly in our terminal.\n\nThere is already a bash script that\
    \ does this by using the QuizAPI and jq:\n\nYou can take a look at that script\
    \ here:\n\n- https://github.com/QuizApi/QuizAPI-BASH/blob/master/quiz.sh\n"
  mdcn: "\n\n# BASH 脚本\n\n我将重用上一章节的演示脚本并进行一些微调。它简单地执行一些检查，例如当前内存使用情况、当前 CPU 使用率、TCP\
    \ 连接数以及内核版本。\n\n```bash\n#!/bin/bash\n##\n# 检查以下内容的 BASH 脚本：\n# 内存使用\n# CPU 负载\n\
    # TCP 连接数\n# 内核版本\n##\n\n##\n# 内存检查\n##\nserver_name=$(hostname)\n\nfunction memory_check()\
    \ {\n    echo \"######\"\n    echo \"${server_name} 当前内存使用情况为: \"\n    free -h\n\
    \    echo \"######\"\n}\n\nfunction cpu_check() {\n    echo \"######\"\n    echo\
    \ \"${server_name} 当前的 CPU 负载为: \"\n    echo \"\"\n    uptime\n    echo \"######\"\
    \n}\n\nfunction tcp_check() {\n    echo \"######\"\n    echo \"${server_name}\
    \ 上的 TCP 连接总量: \"\n    echo \"\"\n    cat /proc/net/tcp | wc -l\n    echo \"######\"\
    \n}\n```\n\n```bash\nfunction kernel_check() {\n    echo \"######\"\n    echo\
    \ \"${server_name} 的精确内核版本为: \"\n    echo \"\"\n    uname -r\n    echo \"######\"\
    \n}\n\nfunction all_checks() {\n    memory_check\n    cpu_check\n    tcp_check\n\
    \    kernel_check\n}\n\nall_checks\n```\n\n复制下面的代码并将其添加到名为 `remote_check.sh` 的文件中。你也可以从此地获取脚本。\n\
    \n# 在所有服务器上运行脚本\n\n现在我们已经准备好了脚本和服务器，并且将这些服务器添加到了 `servers.txt` 文件中，我们可以运行以下命令来遍历所有服务器并远程执行脚本，而无需将脚本复制到每个服务器并单独连接到每个服务器。\n\
    \n```bash\nfor server in $(cat servers.txt); do ssh your_user@${server} 'bash\
    \ -s' < ./remote_check.sh ; done\n```\n\n这个 `for` 循环的作用是遍历 `servers.txt` 文件中的每个服务器，然后对列表中的每个项目运行以下命令：\n\
    \n```bash\nssh your_user@the_server_ip 'bash -s' < ./remote_check.sh\n```\n\n\
    你将得到如下输出：\n\n![](img/7521519cf793a2e66883462104020ab5_92_0.png)\n\n# 结论\n\n这是一个非常简单的示例，演示了如何在多个服务器上执行简单脚本，而无需将其复制到每个服务器，也无需单独访问每个服务器。\n\
    \n当然，你可以在更多服务器上运行更复杂的脚本。\n\n如果你对自动化感兴趣，我建议你查看 DigitalOcean 网站上的 Ansible 资源页面：\n\
    \nAnsible 资源页面\n\n> 注意：此内容最初发布在 DevDojo\n\n# 在 BASH 中使用 jq 处理 JSON\n\n`jq` 命令行工具是一个轻量且灵活的命令行\
    \ JSON 解析器。它非常适合解析 BASH 中的 JSON 输出。\n\n`jq` 的优点之一是用用于可移植的 C 语言编写的，并且零运行时依赖。你只需要下载单个二进制文件或使用像\
    \ `apt` 这样的包管理器并通过单个命令进行安装。\n\n# 规划脚本\n\n在本教程的演示中我将使用一个返回简单 JSON 输出的外部 REST API，称为\
    \ QuizAPI：\n\nhttps://quizapi.io/\n\n如果你想跟随操作，请确保在此处获取免费的 API 密钥：\n\nhttps://quizapi.io/clientarea/settings/token\n\
    \nQuizAPI 对开发者是的。\n\n# 安装 jq\n\n有许多方法可以在你的系统上安装 `jq`。最直接的方法之一是根据你的操作系统使用包管理器。\n\
    \n以下是根据你的操作系统需要使用的命令列表：\n\n- 在 Ubuntu/Debian 上安装 `jq`\n```bash\nsudo apt-get install\
    \ jq\n```\n\n- 在 Fedora 上安装 `jq`\n```bash\nsudo dnf install jq\n```\n\n- 在 openSUSE\
    \ 上安装 `jq`\n```bash\nsudo zypper install jq\n```\n\n- 在 Arch 上安装 `jq`\n```bash\n\
    sudo pacman -S jq\n```\n\n- 使用 Homebrew 在 Mac 上安装\n```bash\nbrew install jq\n\
    ```\n\n- 使用 MacPort 在 Mac 上安装\n```bash\nport install jq\n```\n\n如果你使用的是其他操作系统，我建议查看此处的官方文档以获取更多信息：\n\
    \nhttps://stedolan.github.io/jq/download/\n\n一旦你下载并安装了 `jq`，你可以通过运行此命令来检查当前版本：\n\
    \n```bash\njq --version\n```\n\n# 使用 jq 解析 JSON\n\n一旦你安装了 `jq` 并有了 QuizAPI API\
    \ 密钥，就可以直接在终端中解析 QuizAPI 的 JSON 输出。\n\n首先，创建一个存储 API 密钥的变量：\n\n```bash\nAPI_KEY=YOUR_API_KEY_HERE\n\
    ```\n\n为了从 QuizAPI 的一个端点获取输出，你可以使用 `curl` 命令：\n\n```bash\ncurl \"https://quizapi.io/api/v1/questions?apiKey=${API_KEY}&limit=1\"\
    \n```\n\n为了获得更特定的输出，你可以使用这里的 QuizAPI URL 生成器：\n\nhttps://quizapi.io/api-config\n\
    \n运行 `curl` 命令后，你得到的输出如下：\n\n![](img/7521519cf793a2e66883462104020ab5_98_0.png)\n\
    \n这可能非常难阅读，但感谢 `jq` 命令行工具，我们只需要将 `curl` 命令通过管道传给 `jq`，就能看到格式化良好的 JSON 输出：\n\n\
    ```bash\ncurl \"https://quizapi.io/api/v1/questions?apiKey=${API_KEY}&limit=1\"\
    \ | jq\n```\n\n注意结尾的 `| jq`。\n\n在这种情况下，你得到的输出看起来像这样：\n\n![](img/7521519cf793a2e66883462104020ab5_98_1.png)\n\
    \n现在这看起来漂亮多了！`jq` 命令行工具为我们格式化了输出并添加了一些好看的颜色！\n\n# 使用 jq 获取第一个元素\n\n假设我们只想从 JSON\
    \ 输出中获取第一个元素，为了这一点，我们只需要通过以下语法指定我们想要看到的索引：\n\n```bash\njq .[0]\n```\n\n现在，如果我们再次运行\
    \ `curl` 命令并将输出传给 `jq .[0]`，如下所示：\n\n```bash\ncurl \"https://quizapi.io/api/v1/questions?apiKey=${API_KEY}&limit=1\"\
    \ | jq .[0]\n```\n\n你将只获得第一个元素，输出如下：\n\n![](img/7521519cf793a2e66883462104020ab5_100_0.png)\n\
    \n# 只获取特定键的值\n\n有时你可能只想获取某个特定键的值，例如在我们的示例中，QuizAPI 返回了一个问题列表，并带有答案、描述等，但如果你只想获取不带额外信息的题目怎么办？\n\
    \n使用 `jq` 这将非常简单，你只需要在 `jq` 命令后添加键，所以它看起来像这样：\n\n```bash\njq .[].question\n```\n\
    \n我们必须添加 `.[]`，因为 QuizAPI 返回的是数组，通过指定 `.[]`，我们告诉 `jq` 我们想要获取数组中所有元素的 `.question`\
    \ 值。\n\n你得到的输出如下：\n\n![](img/7521519cf793a2e66883462104020ab5_101_0.png)\n\n你可以看到我们现在只获取问题而不其他值。\n\
    \n# 在 BASH 脚本中使用 jq\n\n让我们创建一个小型 bash 脚本，它应该为我们输出以下信息：\n\n- 从输出中获取第一个问题\n- 获取该问题的所有答案\n\
    - 将答案赋值给变量\n- 打印问题和答案\n- 为了实现这一点，我编写了以下脚本：\n\n> 注意：请确保将 API_KEY 部分替换为你实际的 QuizAPI\
    \ 密钥：\n\n```bash\n#!/bin/bash\n##\n# 调用 QuizAPI 的 API并将输出存储在变量中\n##\noutput=$(curl\
    \ 'https://quizapi.io/api/v1/questions?apiKey=API_KEY&limit=10' >/dev/null)\n\
    ##\n# 获取第一个问题\n##\noutput=$(echo $output | jq.[0])\n##\n# 获取问题\n##\nquestion=$(echo\
    \ $output | jq .question)\n##\n# 获取答案\n##\nanswer_a=$(echo $output | jq .answers.a)\n\
    answer_b=$(echo $output | jq .answers.b)\nanswer_c=$(echo $output | jq .answers.c)\n\
    answer_d=$(echo $output | jq .answers.d)\n##\n# 输出问题\n##\necho \"\nQuestion: ${question}\n\
    \nA) ${answer_a}\nB) ${answer_b}\nC) ${answer_c}\nD) ${answer_d}\n\"\n```\n\n\
    如果你运行该脚本，将得到如下输出：\n\n我们甚至可以进一步使其具有交互性，这样我们就可以直接在终端中选择答案。\n\n已经有一个使用 QuizAPI 和\
    \ jq 实现此点的 bash 脚本：\n\n你可以在这里查看该脚本：\n\n- https://github.com/QuizApi/QuizAPI-BASH/blob/master/quiz.sh\n\
    \n"
