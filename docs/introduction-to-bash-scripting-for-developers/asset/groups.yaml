    \n- True if string1 sorts before string2 lexicographically.\n\n```bash\n[[ ${string1}\
    \ < ${string2} ]]\n```\n\n- True if string1 sorts after string2 lexicographically.\n\
    \n```bash\n[[ ${string1} > ${string2} ]]\n```\n\n## Arithmetic operators\n\n-\
