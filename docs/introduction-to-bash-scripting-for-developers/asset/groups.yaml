    \ (fd: 2): 管理终端的错误文本。\n\n## 管道与重定向的区别\n\n*管道*和*重定向*都会重定向执行进程的流（文件描述符）。主要的区别在于，*重定向*处理的是*文件流*，将输出流发送到文件，或将给定文件的内容发送到进程的输入流。\n\
    \n另一方面，管道通过将第一个命令的输出流发送到第二个命令的输入流来连接两个命令，而无需指定任何重定向。\n\n# Bash 中的重定向\n\n### STDIN（标准输入）\n\
    \n当你为要求要求输入的命令输入一些输入文本时，你实际上是在向 STDIN 文件描述符输入这些文本。运行不带任何命令行参数的 `cat` 命令。看起来进程似乎暂停了，但实际上是\
    \ `cat` 在请求 STDIN。`cat` 是一个简单的程序，它会打印传递给 STDIN 的文本。然而，你可以通过重定向输入到接收 STDIN 的命令来扩展其用法。\n\
    \n使用 `cat` 的示例：\n\n```\ncat << EOF\nHello World!\nHow are you?\nEOF\n```\n\n这将简单地在终端屏幕上打印提供的文本：\n\
    \n```\nHello World!\nHow are you?\n```\n\n其他通过 STDIN 接收输入的命令也可以进行相同的操作。例如，`wc`：\n\
