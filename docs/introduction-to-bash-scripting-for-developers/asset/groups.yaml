    \nIf you think that I've missed any feel free to join the discussion on the DigitalOcean\
    \ community forum!\n\n## Creating custom bash commands\n\nAs a developer or system\
    \ administrator, you might have to spend a lot of time in your terminal. I always\
    \ try to look for ways to optimize any repetitive tasks.\n\nOne way to do that\
    \ is to either write short bash scripts or create custom commands also known as\
    \ aliases. For example, rather than typing a really long command every time you\
    \ could just create a short cut for it.\n\n## Example\n\nLet's start with the\
    \ following scenario, as a system admin, you might have to check the connections\
    \ to your web server quite often, so I will use the netstat command as an example.\n\
    \nWhat I would usually do when I access a server that is having issues with the\
    \ connections to port 80 or 443 is to check if there are any services listening\
    \ on those ports and the number of connections to the ports.\n\nThe following\
    \ netstat command would show us how many TCP connections on port 80 and 443 we\
