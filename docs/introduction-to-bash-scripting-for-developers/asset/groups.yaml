  - '[PAGE 145]


    # HereDocument


    The symbol << can be used to create a temporary file [heredoc] and redirect from
    it at the command line.


    ```

    COMMAND << EOF

    ContentOfDocument

    ...

    ...

    EOF

    ```


    Note here that EOF represents the delimiter (end of file) of the heredoc. In fact,
    we can use any alphanumeric word in it''s place to signify the start and the end
    of the file. For instance, this is a valid heredoc:


    ```

    cat << randomword1

    This script will print these lines on the terminal.

    Note that cat can read from standard input. Using this heredoc, we can

    create a temporary file with these lines as it''s

    content and pipe that

    to cat.

    randomword1

    ```


    Effectively it will appear as if the contents of the heredoc are piped into the
    command. This can make the script very clean if multiple lines need to be piped
    into a program.


    Further, we can attach more pipes as shown:'
  - '[PAGE 146]


    ```

    cat << randomword1 | wc

    This script will print these lines on the terminal.

    Note that cat can read from standard input. Using this

    heroc, we can

    create a temporary file with these lines as it''s

    content and pipe that

    into cat.

    randomword1

    ```


    Also, pre-defined variables can be used inside the heredocs.'
  - '[PAGE 147]


    # HereString


    Herestrings are quite similar to heredocs but <<<. These are used for single line
    strings that have to be piped into some program. This looks cleaner that heredocs
    we don''t have to specify the delimiter.


    ```

    wc <<"this is an easy way of passing strings to the stdin of a program (here wc)"

    ```


    Just like heredocs, herestrings can contain variables.'
- md: "\n# Summary\n\nOperator Description\n\n- > Save output to a file\n- >> Append\
    \ output to a file\n- < Read input from a file\n- 2> Redirect error messages\n\
    - | Send the output from one program as input to another program\n- << Pipe multiple\
    \ lines into a program cleanly\n- <<< Pipe a single line into a program cleanly\n\
    \n# Automatic Wordpress on LAMP installation with BASH\n\nHere is an example of\
    \ a full LAMP and Wordpress installation that works on any Debian-based machine.\n\
    \n# Prerequisites\n\n- A Debian-based machine (Ubuntu, Debian, Linux Mint, etc.)\n\
    \n# Planning the functionality\n\nLet's start again by going over the main functionality\
    \ of the script:\n\n## Lamp Installation\n\n- Update the package manager\n- Install\
    \ a firewall (ufw)\n- Allow SSH, HTTP and HTTPS traffic\n- Install Apache2\n-\
    \ Install & Configure MariaDB\n- Install PHP and required plugins\n- Enable all\
    \ required Apache2 mods\n\n## Apache Virtual Host Setup\n\n- Create a directory\
    \ in `/var/www`\n- Configure permissions to the directory\n- Create the `$domain`\
    \ file under `/etc/apache2/sites-available` and append the required Virtualhost\
    \ content\n- Enable the site\n- Restart Apache2\n\n## SSL Config\n\n- Generate\
    \ the OpenSSL certificate\n- Append the SSL certificate to the `ssl-params.conf`\n\
    - Append the SSL config to the Virtualhost file\n- Enable SSL\n- Reload Apache2\n\
    \n## Database Config\n\n- Create a database\n- Create a user\n- Flush Privileges\n\
    \n## Wordpress Config\n\n- Install required Wordpress PHP plugins\n- Install Wordpress\n\
    - Append the required information to wp-config.php file\n\nWithout further ado,\
    \ let's start writing the script.\n\n# The script\n\nWe start by setting our variables\
    \ and asking the user to input their domain:\n\n```\necho `Please enter your domain\
    \ of preference without www:`\nread DOMAIN\necho \"Please enter your Database\
    \ username:\"\nread DBUSERNAME\necho \"Please enter your Database password:\"\n\
    read DBPASSWORD\necho \"Please enter your Database name:\"\nread DBNAME\n\nip=`hostname\
    \ -I | cut -f1 -d' '`\n```\n\nWe are now ready to start writing our functions.\
    \ Start by creating the lamp install() function. Inside of it, we are going to\
    \ update the system, install ufw, allow SSH, HTTP and HTTPS traffic, install Apache2,\
    \ install MariaDB and PHP. We are also going to enable all required Apache2 mods.\n\
    \n```\nlamp_install () {\n    apt update -y\n    apt install ufw\n    ufw enable\n\
    \    ufw allow OpenSSH\n    ufw allow in \"WWW Full\"\n\n    apt install apache2\n\
    \    apt install mariadb-server\n    mysql secure_installation -y\n    apt install\
    \ libapache2-mod-php php-mysql -y\n    sed -i \"2d\" /etc/apache2/mods-enabled/dir.conf\n\
    \    sed -i \"2i\\tDirectoryIndex index.php index.html index.cgi index.pl index.xhtml\
    \ index.htm\" /etc/apache2/mods-enabled/dir.conf\n    systemctl reload apache2\n\
    }\n```\n\nNext, we are going to create the apache_virtualhost_setup() function.\
    \ Inside of it, we are going to create a directory in /var/www, configure permissions\
    \ to the directory, create the $domain file under /etc/apache2/sites-available\
    \ and append the required Virtualhost content, enable the site and restart Apache2.\n\
    \n```\napache_virtual_host setup() {\n    mkdir /var/www/$DOMAIN\n    chown -R\
    \ $USER:$USER /var/www/$DOMAIN\n\n    echo \"<VirtualHost *:80>\" >> /etc/apache2/sites-available/$DOMAIN.conf\n\
    \    echo -e \"$serverName $DOMAIN\" >> /etc/apache2/sites-available/$DOMAIN.conf\n\
    \    echo -e \"$serverAlias www.$DOMAIN\" >> /etc/apache2/sites-available/$DOMAIN.conf\n\
    \    echo -e \"$serverAdmin webmaster@localhost\" >> /etc/apache2/sites-available/$DOMAIN.conf\n\
    \    echo -e \"$documentRoot /var/www/$DOMAIN\" >> /etc/apache2/sites-available/$DOMAIN.conf\n\
    \    echo -e \"$errorLog \\${APACHE_LOG_DIR}/error.log\" >> /etc/apache2/sites-available/$DOMAIN.conf\n\
    \    echo -e \"$customLog \\${APACHE_LOG_DIR}/access.log combined\" >> /etc/apache2/sites-available/$DOMAIN.conf\n\
    \    echo \"</VirtualHost>\" >> /etc/apache2/sites-available/\\DOMAIN.conf\n \
    \   a2ensite $DOMAIN\n    a2dissite 000-default\n    systemctl reload apache2\n\
    }\n```\n\nNext, we are going to create the ssl_config() function. Inside of it,\
    \ we are going to generate the OpenSSL certificate, append the ssl certificate\
    \ to the ssl-params.conf file, append the ssl config to the Virtualhost file,\
    \ enable SSL and restart Apache.\n\n```\nssl_config() {\n    openssl req -x509\
    \ -days 365 -newkey rsa:2048\n    key /ssl/private/apache-selfsigned.key -out\
    \ /etc/certs/apache-selfsigned.crt\n    echo \"SSLCipherSuite EECDH+GCM:AES256+GCM+ECDH:AES256+EDH\"\
    \ >> /etc/apache2/conf-available/ssl-params.conf\n    echo \"SSLProtocol All -SSLv2\
    \ -TLSv1 -TLSv1.1\" >> /etc/apache2/conf-available/ssl-params.conf\n    echo \"\
    SSLHonorCipherOrder On\" >> /etc/apache2/conf-available/ssl-params.conf\n    echo\
    \ \"Header always set X-Frame-Options DENY\" >> {}\n}\n```\n\nNext, we are going\
    \ to create the db_setup() function. Inside of it, we are going to create the\
    \ database, create the user and grant all privileges to the user.\n\n```\ndb_config\
    \ () {\n    mysql -e \"CREATE DATABASE $DBNAME;\"\n    mysql -e \"GRANT ALL ON\
    \ $DBNAME.* TO '$DBUSERNAME'@localhost' IDENTIFIED BY '$DBPASSWORD' WITH GRANT\
    \ OPTION;\"\n    mysql -e \"FLUSH PRIVILEGES;\"\n}\n```\n\nNext, we are going\
    \ to create the wordpress_config() function. Inside of it, we are going to download\
    \ the latest version of WordPress, extract it to /var/www/ directory, create the\
    \ wp-config.php file and append the required content to it.\n\n```\nwordpress_config()\
    \ {\n  db_setup()\n\n  apt install php-gd php-mbstring php-xml php-soap php-intl\
    \ php-zip -y\n  systemctl restart apache2\n  curl -s https://wordpress.org/latest.tar.gz\
    \ -O\n  tar xvzf latest.tar.gz\n  cd /var/www/$DOMAIN\n  chown -R www-data:www-data\
    \ /var/www/$DOMAIN\n  find . -type d -exec chmod 755 {} \\;\n  find . -type f\
    \ -exec chmod 644 {} \\;\n  cp wp-config.sample wp-config.php\n  sed -i \"s/DB_NAME/$DBNAME/g\"\
    \ wp-config.php\n  sed -i \"s/DB_USER/$DBUSERNAME/g\" wp-config.php\n  sed -i\
    \ \"s/DB_PASSWORD/$DBPASSWORD/g\" wp-config.php\n  sed -i \"s/DB_HOST/'localhost'/'localhost'/g\"\
    \ wp-config.php\n}\n```\n\nAnd finally, we are going to execute the execute()\
    \ function. Inside of it, we are going to call all the functions we created.\n\
    \n```\nexecute () {\n  lamp_install\n  apache_virtual_host_setup\n  ssl_config\n\
    \  wordpress_config\n}\n```\n\nWith this, you have the script ready and you are\
    \ ready to run it. And if you need the full script, you can find it in the next\
    \ section.\n\n# The full script\n\n```bash\n#!/bin/bash\n\necho 'Please enter\
    \ your domain of preference without www:'\nread DOMAIN\necho \"Please enter your\
    \ Database username:\"\nread DBUSERNAME\necho \"Please enter your Database password:\"\
    \nread DBPASSWORD\necho \"Please enter your Database name:\"\nread DBNAME\n\n\
    ip=`hostname -I | cut -f1 -d ' '`\n\nlamp_install () {\n    apt update -y\n  \
