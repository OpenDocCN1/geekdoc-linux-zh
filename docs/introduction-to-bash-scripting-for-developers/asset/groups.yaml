    # Bash Arrays


    If you have ever done any programming, you are probably already familiar with
    arrays.


    But just in case you are not a developer, the main thing that you need to know
    is that unlike variables, arrays can hold several values under one name.


    You can initialize an array by assigning values divided by space and enclosed
    in ().

    Example:


    ```

    my_array=("value 1" "value 2" "value 3" "value 4")

    ```


    To access the elements in the array, you need to reference them by their numeric
    index.


    > Notice: keep in mind that you need to use curly brackets.


    +   - Access a single element, this would output: value 2


    ```

    echo ${my_array[1]}

    ```


    +   - This would return the last element: value 4


    ```

    echo ${my_array[-1]}

    ```


    +   - As with command line arguments using @ will return all arguments in the
    array, as follows: value 1 value 2 value 3 value 4


    ```

    echo ${my_array[@]}

    ```'
