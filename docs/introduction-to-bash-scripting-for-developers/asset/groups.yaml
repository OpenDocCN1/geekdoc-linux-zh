    \ can use a case statement to simplify complex conditionals when there are multiple\
    \ different choices. So rather than using a few if, if-else statements, you could\
    \ use a single case statement.\n\nThe Bash case statement syntax looks like this:\n\
    \n```\ncase $some_variable in\n  pattern_1)\n    commands\n    ;\n  pattern_2|\
    \ pattern_3)\n    commands\n    ;\n  *)\n    default commands\n    ;\nesac\n```\n\
    \nA quick rundown of the structure:\n\n+   - All case statements start with the\
    \ case keyword.\n- On the same line as the case keyword, you need to specify a\
    \ variable or an expression followed by the in keyword.\n- After that, you use\
    \ case patterns, where you need to use ) to identify the end of the pattern.\n\
    - You can specify multiple patterns divided by a pipe: |\n- After the pattern,\
    \ you specify the commands that you would like to be executed in case that pattern\
    \ matches the variable or the expression that you've specified.\n- All clauses\
    \ have to be terminated by adding ;; ; at the end.\n- You can have a default statement\
    \ by adding a * as the pattern.\n- To close the case statement, use the esac (case\
    \ typed backwards) keyword.\n\nHere is an example of a Bash case statement:"
- md: "\n```bash\n#!/bin/bash\nread -p \"Enter the name of your car brand: \" car\n\
    case $car in\nTesla)\n  echo -n \"${car}'s car factory is in the USA.\"\n  ;;\n\
    BMW | Mercedes | Audi | Porsche)\n  echo -n \"${car}'s car factory is in Germany.\"\
    \n  ;;\nToyota | Mazda | Mitsubishi | Subaru)\n  echo -n \"${car}'s car factory\
    \ is in Japan.\"\n  ;;\n*)\n  echo -n \"${car} is an unknown car brand\"\n  ;;\n\
    esac\n```\n\nWith this script, we are asking the user to input a name of a car\
    \ brand like Tesla, BMW, Mercedes and etc. \n\nThen with a case statement, we\
    \ check the brand name and if it matches any of our patterns, and if so, we print\
    \ out the factory's location.\n\nIf the brand name does not match any of case\
    \ statements, we print out a default message: an unknown car brand.\n\n# Conclusion\n\
    \nI would advise you to try and modify the script and play with it a bit so that\
    \ you could practice what you've just learned in the last two chapters!\n\nFor\
    \ more examples of Bash case statements, make sure to check chapter 16, where\
    \ we would create an interactive menu in Bash using a cases statement to process\
    \ the user input.\n\n# Bash Loops\n\nAs with any other language, loops are very\
    \ convenient. With Bash you can use `for` loops, `while` loops, and `until` loops.\n\
    \n# For loops\n\nHere is the structure of a for loop:\n\n```bash\nfor var in ${list}\n\
    do\n  your_commands\ndone\n```\n\nExample:\n\n```bash\n#!/bin/bash\nusers=\"devdojo\
    \ bobby tony\"\nfor user in ${users}\ndo\n  echo \"${user}\"\ndone\n```\n\nA quick\
    \ rundown of the example:\n\n- First, we specify a list of users and store the\
    \ value in a variable called $users.\n- After that, we start our for loop with\
    \ the for keyword.\n- Then we define a new variable which would represent each\
    \ item from the list that we give. In our case, we define a variable called user,\
    \ which would represent each user from the $users variable.\n- Then we specify\
    \ the in keyword followed by our list that we will loop through.\n- On the next\
    \ line, we use the do keyword, which indicates what we will do for each iteration\
    \ of the loop.\n- Then we specify the commands that we want to run.\n- Finally,\
    \ we close the loop with the done keyword.\n\nYou can also use for to process\
    \ a series of numbers. For example here is one way to loop through 1 to 10:\n\n\
    ```bash\n#!/bin/bash\nfor num in {1..10}\ndo\n  echo ${num}\ndone\n```\n\n# While\
    \ loops\n\nThe structure of a while loop is quite similar to the for loop:\n\n\
    ```bash\nwhile [ your_condition ]\ndo\n  your_commands\ndone\n```\n\nHere is an\
    \ example of a while loop:\n\n```bash\n#!/bin/bash\n\ncounter=1\nwhile [[ $counter\
    \ -le 10 ]]\ndo\n  echo $counter\n  ((counter++))\ndone\n```\n\nFirst, we specified\
    \ a counter variable and set it to 1, then inside the loop, we added counter by\
    \ using this statement: ((counter++))). That way, we make sure that the loop will\
    \ run 10 times and would not run forever. The loop will complete as soon as the\
    \ counter becomes 10, as this is what we've set as the condition: while [[ $counter\
    \ -le 10 ]].\n\nLet's create a script that asks the user for their name and not\
    \ allow an empty input:\n\n```bash\n#!/bin/bash\n\nread -p \"What is your name?\
    \ \" name\n\nwhile [[ -z ${name} ]]\ndo\n    echo \"Your name can not be blank.\
    \ Please enter a valid name!\"\n    read -p \"Enter your name again? \" name\n\
    done\n\necho \"Hi there ${name}\"\n```\n\nNow, if you run the above and just press\
    \ enter without providing input, the loop would run again and ask you for your\
    \ name again and again until you actually provide some input.\n\n# Until Loops\n\
    \nThe difference between until and while loops is that the until loop will run\
    \ the commands within the loop until the condition becomes true.\n\nStructure:\n\
    \n```bash\nuntil [[ your_condition ]]\ndo\n    your_commands\ndone\n```\n\nExample:\n\
    \n```bash\n#!/bin/bash\n\ncount=1\nuntil [[ $count -gt 10 ]]\ndo\n    echo $count\n\
    \    ((count++))\ndone\n```\n\n# Continue and Break\n\nAs with other languages,\
    \ you can use continue and break with your bash scripts as well:\n\n- continue\
    \ tells your bash script to stop the current iteration of the loop and start the\
    \ next iteration.\n\nThe syntax of the continue statement is as follows:\n\n```bash\n\
    continue [n]\n```\n\nThe [n] argument is optional and can be greater than equal\
    \ to 1. When [n] is given, the n-th enclosing loop is resumed. continue 1 is equivalent\
    \ to continue.\n\n```bash\n#!/bin/bash\nfor i in 1 2 3 4 5\ndo\n    if [[ $i -eq\
    \ 2 ]]\n    then\n        echo \"skipping number 2\"\n        continue\n    fi\n\
    \    echo \"i is equal to $i\"\ndone\n```\n\nWe can also use continue command\
    \ in similar way to break command for controlling multiple loops.\n\n- break tells\
    \ your bash script to end the loop straight away.\n\nThe syntax of the break statement\
    \ takes the following form:\n\n```bash\nbreak [n]\n```\n\n[n] is an optional argument\
    \ and must be greater than equal to 1. When [n] is provided, the n-th enclosing\
    \ loop is exited. break 1 is equivalent to break.\n\nExample:\n\n```bash\n#!/bin/bash\n\
    \nnum=1\nwhile [[ $num -lt 10 ]]\ndo\n  if [[ $num -eq 5 ]]\n    then\n      break\n\
    \    fi\n  ((num++))\ndone\necho \"Loop completed\"\n```\n\nWe can also use break\
    \ command with multiple loops. If we want to exit out of current working loop\
    \ whether inner or outer loop, we simply use break if if we are in inner loop\
    \ & want to exit out of outer loop, we use break 2.\n\nExample:\n\n```bash\n#!/bin/bash\n\
    for (( a = 1; a < 10; a++ ))\ndo\n  echo \"outer loop: $a\"\n  for (( b = 1; b\
    \ < 100; b++ ))\n  do\n    if [[ $b -eq 5 ]]\n    then\n      break 2\n    fi\n\
    \  done\ndone\n```\n\n# Bash Functions\n\nFunctions are a great way to reuse code.\
    \ The structure of a function in bash is quite similar to most languages:\n\n\
    ```bash\nfunction function_name() {\n  your_commands\n}\n```\n\nYou can also omit\
    \ the function keyword at the beginning, which would also work:\n\n```bash\nfunction_name()\
    \ {\n  your_commands\n}\n```\n\nI prefer putting it there for better readability.\
    \ Example of a \"Hello World!\" function:\n\n```bash\n#!/bin/bash\nfunction hello()\
    \ {\n  echo \"Hello World!\"\n}\nhello\n```\n\n> Notice: One thing to keep in\
    \ mind is that you should not add the parenthesis when you call the function.\n\
    \nPassing arguments to a function work in the same way as passing arguments to\
    \ script:\n\n```bash\n#!/bin/bash\nfunction hello() {\n    echo \"Hello $1!\"\n\
    }\n\nhello Devojo\n```\n\nFunctions should have comments mentioning description,\
    \ global variables, arguments, outputs, and returned values, if applicable\n\n\
    ```bash\n###########################################\n# Description: Hello function\n\
    # Globals:\n# None\n# Arguments:\n# Single input argument\n# Outputs:\n# Value\
    \ of input argument\n# Returns:\n# 0 if successful, non-zero on error.\n###########################################\n\
    function hello() {\n    echo \"Hello $1!\"\n}\n```\n\nIn the next few chapters\
    \ we will be using functions a lot!\n\n# Debugging, testing and shortcuts\n\n\
    In order to debug your bash scripts, you can use -x when executing your scripts:\n\
