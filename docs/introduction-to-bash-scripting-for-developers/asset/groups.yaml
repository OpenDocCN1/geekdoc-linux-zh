    \n## 条件表达式\n\n在计算机科学中，条件语句、条件表达式和条件结构是编程语言的特性，它们根据程序员指定的布尔条件评估为真或假来执行不同的计算或操作。\n\
    \n在 Bash 中，条件表达式用于复合命令和[内置命令]来测试文件属性并执行字符串和算术比较。\n\n以下是最常用的 Bash 条件表达式列表。你不需要死记硬背它们。每当你需要时，只需查阅此列表即可！\n\
    \n## 文件表达式\n\n- 如果文件存在则为真。\n\n```bash\n[[ -a ${file} ]]\n```\n\n- 如果文件存在且是块设备文件，则为真。\n\
    \n```bash\n[[ -b ${file} ]]\n```\n\n- 如果文件存在且是字符设备文件，则为真。\n\n```bash\n[[ -c ${file}\
    \ ]]\n```\n\n- 如果文件存在且是目录，则为真。\n\n```bash\n[[ -d ${file} ]]\n```\n\n- 如果文件存在则为真。\n\
    \n```bash\n[[ -e ${file} ]]\n```\n\n- 如果文件存在且是普通文件，则为真。\n\n```bash\n[[ -f ${file}\
    \ ]]\n```\n\n- 如果文件存在且是符号链接，则为真。\n\n```bash\n[[ -h ${file} ]]\n```\n\n- 如果文件存在且可读，则为真。\n\
    \n```bash\n[[ -r ${file} ]]\n```\n\n- 如果文件存在且大小大于零，则为真。\n\n```bash\n[[ -s ${file}\
    \ ]]\n```\n\n- 如果文件存在且可写，则为真。\n\n```bash\n[[ -w ${file} ]]\n```\n\n- 如果文件存在且可执行，则为真。\n\
    \n```bash\n[[ -x ${file} ]]\n```\n\n- 如果文件存在且是符号链接，则为真。\n\n```bash\n[[ -L ${file}\
    \ ]]\n```\n\n## 字符串表达式\n\n- 如果 shell 变量 varname 已设置（已赋值值），则为真。\n\n```bash\n[[\
    \ -v ${varname} ]]\n```\n\n如果字符串长度为 0，则为真。\n\n```bash\n[[ -z ${string} ]]\n```\n\
    \n如果字符串长度不为 0，则为真。\n\n```bash\n[[ -n ${string} ]]\n```\n\n- 如果字符串相等则为真。为了符合 POSIX\
    \ 规定，应配合 `test` 命令使用 `=`。当与 `[[ ]]` 使用时：\n\n```bash\n# strings 相等\n```\n\n- 如果字符串不相等则为真。\n\
    \n```bash\n# strings 不相等\n```\n\n- 如果字符串1 在字典序上小于字符串2，则为真。\n\n```bash\n# string1\
    \ 在字典序上小于 string2\n```\n\n## 算术运算符\n\n- 如果数字相等则为真。\n\n```bash\n# 两个相等\n```\n\n\
    - 如果数字不相等则为真。\n\n```bash\n# 数字不相等\n```\n\n- 如果数字1小于数字2，则为真。\n\n```bash\n# 1 小于\
    \ 2\n```\n\n- 如果数字1小于或等于数字2，则为真。\n\n```bash\n# 1 小于等于 2\n```\n\n- 如果数字1大于数字2，则为真。\n\
    \n```bash\n# 1 大于 2\n```\n\n- 如果数字1大于或等于数字2，则为真。\n\n```bash\n# 1 大于等于 2\n```\n\
    \n## 逻辑运算符\n\n如果两个条件都为真，则为真。\n\n```bash\n# AND 逻辑\n```\n\n如果其中一个条件为真，则为真。\n\n\
    ```bash\n# OR 逻辑\n```\n\n## 退出状态\n\n如果退出状态为 0，则为真。\n\n```bash\n# 退出状态为 0\n```\n\
    \n如果退出状态不为 0，则为真。\n\n```bash\n# 退出状态不为 0\n```\n\n## Bash 条件语句\n\n在上一节中，我们涵盖了常用的条件表达式。现在我们可以使用\
    \ `if`、`if-else` 和 `switch` 语句。\n\n## if 语句\n\n`if` 语句的格式如下：\n\n```bash\nif [[\
    \ 条件 ]]\nthen\n    命令\nfi\n```\n\n这里有一个简单的 `if` 语句示例，它要求你输入名称：\n\n```bash\n#!/bin/bash\n\
    \n# if 语句示例\n\nread -p \"你的名字是？\" name\n\nif [[ -z ${name} ]]\nthen\n    echo\
    \ \"请输入名字！\"\nfi\n```\n\n## if-else 语句\n\n使用 `if-else` 语句，可以在条件不匹配时指定操作。示例如下：\n\
    \n```bash\n#!/bin/bash\n\n# if-else 语句示例\n\nread -p \"你的名字是？\" name\n\nif [[ -z\
    \ ${name} ]]\nthen\n    echo \"请输入名字！\"\nelse\n    echo \"你好，${name}\"\nfi\n```\n\
    \n你可以结合上一节的条件表达式使用上面的语句：\n\n```bash\n#!/bin/bash\n\nadmin=\"root\"\n\nread -p\
    \ \"用户名：\" username\n\n# 检查用户名是否为管理员\n\nif [[ \"${username}\" == \"${admin}\"\
    \ ]]; then\n    echo \"你是管理员！\"\nelse\n    echo \"你不是管理员\"\nfi\n```\n\n这里是另一个\
    \ `if` 语句示例，它会检查你的当前用户 ID：\n\n```bash\n#!/bin/bash\n\nif [[ $EUID -eq 0 ]]; then\n\
    \    echo \"你是 root 用户\"\nelse\n    echo \"你不是 root 用户\"\nfi\n```\n\n## case 语句\n\
    \n与其他编程语言一样，当有多个选择时，可以使用 `case` 语句来简化复杂的条件。因此，与其使用多个 `if`、`if-else` 语句，不如使用单个\
    \ `case` 语句。\n\nBash `case` 语句的语法如下：\n\n```bash\ncase $some_variable in\n  pattern_1)\n\
    \    命令\n    ;;\n  pattern_2| pattern_3)\n    命令\n    ;;\n  *)\n    默认命令\n   \
    \ ;;\nesac\n```\n\n该结构的简要说明：\n\n- 所有 `case` 语句都以 `case` 关键字开始。\n- 在 `case` 关键字的同一行，你需要指定一个变量或表达式，后面跟着\
    \ `in` 关键字。\n- 之后，你使用用模式，需要使用 `)` 来标识模式的结束。\n- 你可以指定多个由竖线 `|` 分隔的模式。\n- 在模式之后，你指定你希望在当该模式匹配你所指定的变量或表达式时执行的命令。\n\
    - 所有子句必须通过添加 `;;` 来终止。\n- 你可以通过添加 `*` 作为模式来设置默认语句。\n- 为了关闭 `case` 语句，使用 `esac`\
    \ 关键字（case 倒过来写）。\n\n"
