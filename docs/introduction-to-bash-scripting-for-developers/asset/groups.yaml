    # Working with Cloudflare API with Bash


    I host all of my websites on DigitalOcean Droplets and I also use Cloudflare as
    my CDN provider. One of the benefits of using Cloudflare is that it reduces the
    overall traffic to your user and also hides your actual server IP address behind
    their CDN.


    My personal favorite Cloudflare feature is their free DDoS protection. It has
    saved my servers multiple times from different DDoS attacks. They have a cool
    API that you could use to enable and disable their DDoS protection easily.


    This chapter is going to be an exercise! I challenge you to go ahead and write
    a short bash script that would enable and disable the Cloudflare DDoS protection
    for your server automatically if needed!


    # Prerequisites


    Before following this guide here, please set up your Cloudflare account and get
    your website ready. If you are not sure how to do that you can follow these steps
    here: Create a Cloudflare account and add a website.


    Once you have your Cloudflare account, make sure to obtain the following information:


    - A Cloudflare account

    - Cloudflare API key

    - Cloudflare Zone ID


    Also, Make sure curl is installed on your server:


    ```bash

    curl --version

    ```


    If curl is not installed you need to run the following:


    - For RedHat/CentOS:


    ```bash

    yum install curl

    ```


    - For Debian/Ubuntu


    ```bash

    apt-get install curl

    ```


    # Challenge - Script requirements


    The script needs to monitor the CPU usage on your server and if the CPU usage
    gets high based on the number vCPU it would enable the Cloudflare DDoS protection
    automatically via the Cloudflare API.


    The main features of the script should be:


    - Checks the script CPU load on the server

    - In case of a CPU spike the script triggers an API call to Cloudflare and enables
    the DDoS protection feature for the specified zone

    - After the CPU load is back to normal the script would disable the "I''m under
    attack" option and set it back to normal


    # Example script


    I already have prepared a demo script which you could use as a reference. But
    I encourage you to try and write the script yourself first and only then take
    a look at my script!


    To download the script just run the following command:


    ```bash

    wget https://raw.githubusercontent.com/bobbyiliev/cloudflare-ddos/main/protection.sh

    ```


    Open the script with your favorite editor:


    ```bash

    nano protection.sh

    ```


    And update the following details:


    ```bash

    CF_ZONE_ID="YOUR_ZONE_ID"

    CF_EMAIL="YOUR_EMAIL"

    CF_API_KEY="YOUR_API_KEY"

    ```


    After that make the script executable:


    ```bash

    chmod +x protection.sh

    ```


    Finally, set up Cron to run every 30 minutes:


    ```bash

    crontab -e

    ```


    And add the following:


    ```cron

    */30 * * * * /path/to/protection.sh

    ```


    Note: Change the path to the actual path where you stored the script.


