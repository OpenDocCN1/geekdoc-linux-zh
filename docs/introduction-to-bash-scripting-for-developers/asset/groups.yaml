    \ greater than or equal arg2\n\n```bash\n[[ ${arg1} -ge ${arg2} ]]\n```\n\nAs\
    \ a side note, arg1 and arg2 may be positive or negative integers.\n\nAs with\
    \ other programming languages you can use AND & OR conditions:\n\n```bash\n[[\
    \ test_case_1 ]] && [[ test_case_2 ]] # And\n[[ test_case_1 ]] || [[ test_case_2\
    \ ]] # Or\n```\n\n## Exit status operators\n\n- returns true if the the command\
    \ was successful without any errors\n\n```bash\n[[ $? -eq 0 ]]\n```\n\n- returns\
    \ true if the the command was not successful or had errors\n\n```bash\n[[ $? -gt\
    \ 0 ]]\n```\n\n## Bash Conditionals\n\nIn the last section, we covered some of\
    \ the most popular conditional expressions. We can now use them with standard\
    \ conditional statements like `if`, `if-else` and `switch case` statements.\n\n\
    ## If statement\n\nThe format of an if statement in Bash is as follows:\n\n```bash\n\
    if [[ some_test ]]\nthen\n<commands>\nfi\n```\n\nHere is a quick example which\
    \ would ask you to enter your name in case that you've left it empty:\n\n```bash\n\
