    \ name!\"\nelse\n    echo \"Hi there ${name}\"\nfi\n```\n\nYou can use the above\
    \ if statement with all of the conditional expressions from the previous chapters:\n\
    \n```bash\n#!/bin/bash\n\nadmin=\"devdojo\"\n\nread -p \"Enter your username?\
