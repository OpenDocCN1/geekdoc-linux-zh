    \ == \"${admin}\" ]]; then\n    echo \"You are the admin user!\"\nelse\n    echo\
    \ \"You are NOT the admin user\"\nfi\n```\n\nHere is another example of an if\
    \ statement which would check your current User ID:\n\n```bash\n#!/bin/bash\n\n\
    if [[ $EUID -eq 0 ]]; then\n    echo \"You are root\"\nelse\n    echo \"You are\
    \ not root\"\nfi\n```\n\n## Switch case statements\n\nAs in other programming\
    \ languages, you can use a case statement to simplify complex conditionals when\
    \ there are multiple different choices. So rather than using a few if, if-else\
    \ statements, you could use a single case statement.\n\nThe Bash case statement\
    \ syntax looks like this:\n\n```bash\ncase $some_variable in\n  pattern_1)\n \
    \   commands\n    ;;\n  pattern_2| pattern_3)\n    commands\n    ;;\n  *)\n  \
    \  default commands\n    ;;\nesac\n```\n\nA quick rundown of the structure:\n\n\
    - All case statements start with the case keyword.\n- On the same line as the\
    \ case keyword, you need to specify a variable or an expression followed by the\
    \ in keyword.\n- After that, you use case patterns, where you need to use ) to\
    \ identify the end of the pattern.\n- You can specify multiple patterns divided\
    \ by a pipe: |\n- After the pattern, you specify the commands that you would like\
    \ to be executed in case that pattern matches the variable or the expression that\
    \ you've specified.\n- All clauses have to be terminated by adding ;; at the end.\n\
    - You can have a default statement by adding a * as the pattern.\n- To close the\
    \ case statement, use the esac (case typed backwards) keyword.\n"
