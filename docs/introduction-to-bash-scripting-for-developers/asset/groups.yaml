    # Example


    Let''s start with the following scenario, as a system admin, you might have to
    check the connections to your web server quite often, so I will use the netstat
    command as an example.


    What I would usually do when I access a server that is having issues with the
    connections to port 80 or 443 is to check if there are any services listening
    on those ports and the number of connections to the ports.


    The following netstat command would show us how many TCP connections on port 80
    and 443 we currently have:


    ```

    netstat -plant | grep ''80\|443'' | grep -v LISTEN | wc -l

    ```


    This is quite a lengthy command typing it every time might be time-consuming in
    the long run especially when you want to get that information quickly.


    To avoid that, we can create an alias, so rather than typing the whole command,
    we could just type a short command instead. For example, lets say that we wanted
    to be able to type conn (short for connections) and get the same information.
    All we need to do in this case is to run the following command:


    ```

    alias conn="netstat -plant | grep ''80\|443'' | grep -v LISTEN | wc -l"

    ```


    That way we are creating an alias called conn which would essentially be a ''short
    cut'' for our long netstat command. Now if you just run conn:


    ```

    conn

    ```


    You would get the same output as the long netstat command. You can get even more
    creative and add some info messages like this one here:'
