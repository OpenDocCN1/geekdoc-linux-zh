  md: '# Bash Arguments


    You can pass arguments to your shell script when you execute it. To pass an argument,
    you just need to write it right after the name of your script. For example:


    ```

    .devdojo.com your_argument

    ```


    In the script, we can then use $1 in order to reference the first argument that
    we specified.


    If we pass a second argument, it would be available as $2 and so on.


    Let''s create a short script called arguments.sh as an example:


    ```

    #!/bin/bash

    echo "Argument one is $1"

    echo "Argument two is $2"

    echo "Argument three is $3"

    ```


    Save the file and make it executable:


    ```

    chmod +x arguments.sh

    ```


    Then run the file and pass 3 arguments:


    ```

    ./arguments.sh dog cat bird

    ```


    The output that you would get would be:'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'Argument one is dog

    Argument two is cat

    Argument three is bird


    To reference all arguments, you can use $@:


    ```

    #!/bin/bash


    echo "All arguments: $@"

    ```


    If you run the script again:


    ```

    ./arguments.sh dog cat bird

    ```


    You will get the following output:


    All arguments: dog cat bird


    Another thing that you need to keep in mind is that $0 is used to reference the
    script itself.


    This is an excellent way to create self destruct the file if you need to or just
    get the name of the script.


    For example, let''s create a script that prints out the name of the file and deletes
    the file after that:


    ```

    #!/bin/bash


    echo "The name of the file is: $0 and it is going to be self-deleted."


    rm - f $0

    ```


    You need to be careful with the self deletion and ensure that you have your script
    backed up before you self-delete it.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Bash Arrays


    If you have ever done any programming, you are probably already familiar with
    arrays.


    But just in case you are not a developer, the main thing that you need to know
    is that unlike variables, arrays can hold several values under one name.


    You can initialize an array by assigning values divided by space and enclosed
    in ().

    Example:


    ```

    my_array=("value 1" "value 2" "value 3" "value 4")

    ```


    To access the elements in the array, you need to reference them by their numeric
    index.


    > Notice: keep in mind that you need to use curly brackets.


    +   - Access a single element, this would output: value 2


    ```

    echo ${my_array[1]}

    ```


    +   - This would return the last element: value 4


    ```

    echo ${my_array[-1]}

    ```


    +   - As with command line arguments using @ will return all arguments in the
    array, as follows: value 1 value 2 value 3 value 4


    ```

    echo ${my_array[@]}

    ```'
  merge: -1
  pgno: 28
- img_proc: true
  md: '+   - Prepending the array with a hash sign (#) would output the total number
    of elements in the array, in our case it is 4:


    ```

    echo ${#my_array[@]}}

    ```


    Make sure to test this and practice it at your end with different values.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Substring in Bash :: Slicing


    Let''s review the following example of slicing in a string in Bash:


    ```

    #!/bin/bash

    letters=( "A""B""C""D""E" )

    echo ${letters[@]}

    ```


    This command will print all the elements of an array:


    Output:


    ```

    $ ABCDE

    ```


    Let''s see a few more examples:


    +   - Example 1


    ```

    #!/bin/bash

    letters=( "A""B""C""D""E" )

    b=\${letters:0:2}

    echo "${b}"

    ```


    This command will print array from starting index 0 to 2 where 2 is exclusive.


    ```

    $ AB

    ```


    +   - Example 2'
  merge: -1
  pgno: 30
- img_proc: true
  md: '```

    #!/bin/bash


    letters=( "A"B"C"D"E" )

    b=\${letters::5}

    echo "${b}"

    ```


    This command will print from from base index 0 to 5, where 5 is exclusive and
    starting index

    is default set to 0.


    # $ ABCDE


    +   - Example 3


    ```

    #!/bin/bash


    letters=( "A"B"C"D"E" )

    b=\${letters:3}

    echo "${b}"

    ```


    This command will print from starting index 3 to end of array inclusive .


    # $ DE'
  merge: -1
  pgno: 31
