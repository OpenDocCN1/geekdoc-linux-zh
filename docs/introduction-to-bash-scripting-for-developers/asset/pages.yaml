  md: '# Running the Script on all Servers


    Now that we have the script and the servers ready and that we''ve added those
    servers in our servers.txt file we can run the following command to loop though
    all servers and execute the script remotely without having to copy the script
    to each server and individually connect to each server.


    ```

    for server in $(cat servers.txt); do ssh your_user@${server}

    ''bash -s'' < ./remote_check.sh ; done

    ```


    What this for loop does is, it goes through each server in the servers.txt file
    and then runs the following command for each item in the list:


    ```

    ssh your_user@the_server_ip ''bash -s'' < ./remote_check.sh

    ```


    You would get the following output:


    ![](img/7521519cf793a2e66883462104020ab5_92_0.png)'
