  md: '# Example script


    I already have prepared a demo script which you could use as a reference. But
    I encourage you to try and write the script yourself first and only then take
    a look at my script!


    To download the script just run the following command:


    ```

    wget

    https://raw.githubusercontent.com/bobbyiliev/cloudflare-ddos-protetection/main/protection.sh

