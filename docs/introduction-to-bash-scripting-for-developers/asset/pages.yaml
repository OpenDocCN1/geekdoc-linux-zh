  md: '# # Bash Conditional Expressions


    In computer science, conditional statements, conditional expressions, and conditional
    constructs are features of a programming language, which perform different computations
    or actions depending on whether a programmer-specified boolean condition evaluates
    to true or false.


    In Bash, conditional expressions are used by the [[ compound command and the [built-in
    commands to test file attributes and perform string and arithmetic comparisons.


    Here is a list of the most popular Bash conditional expressions. You do not have
    to memorize them by heart. You can simply refer back to this list whenever you
    need it!'
  merge: -1
  pgno: 32
