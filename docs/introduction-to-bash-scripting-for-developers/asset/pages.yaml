- img_proc: true
  md: '# Sending emails with SSMTP


    Once your configuration is done, in order to send an email just just run the following
    command:


    ```

    echo "<>Here add your email body<>" | mail -s "<>Here specify your email subject<>"

    <>your_receipient_email@yourdomain.com<>

    ```


    You can run this directly in your terminal or include it in your bash scripts.'
  merge: -1
