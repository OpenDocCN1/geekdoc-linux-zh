  md: '# Getting a value only for specific key


    Sometimes you might want to get the value of a specific key only, let''s say in
    our example the QuizAPI returns a list of questions along with the answers, description
    and etc. but what if you wanted to get the Questions without the additional information?


    This is going to be quite straightforward with jq, all you need to do is add the
    key after jq command, so it would look something like this:


    ```

    jq .[].question

    ```


    We have to add the .[] as the QuizAPI returns an array and by specifying .[] we
    tell jq that we want to get the .question value for all of the elements in the
    array.


    The output that you would get would look like this:


    ![](img/7521519cf793a2e66883462104020ab5_101_0.png)


