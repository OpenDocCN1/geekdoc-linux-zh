- img_proc: true
  md: '# Generate a random password


    One of the great benefits of Linux is that you can do a lot of things using different
    methods. When it comes to generating a random string of characters it''s not different
    as well.


    You can use several commands in order to generate a random string of characters.
    I will cover few of them and provide some examples.


    +   Using the date command. The date command will output the current date and
    time. We also further manipulate the output in order to use it as randomly generated
    password. We can hash the date using md5, sha or just run it through base64. These
    are few examples:


    ```

    date | md5sum

    94cb1cdec0699e2d98acd9a7b8f6fed

    ```


    using sha256sum:


    ```

    date | sha256sum

    30a0c6091e194c8c7785f0d7bb6e1eac9b76c0528f02213d1b6a5fbcc76cef4

    ```


    using base64:


    ```

    date | base64

    0YHQssDRj9C90YMgmAgMTk6NTE6NDGGVUDIwMjEK

    ```


    +   We can use openssl in order to generate pseudo-random bytes and run the output
    through base64. An example output will be:


    ```

    openssl rand -base64 10

    9+soM9bt8mhdcw==

    ```


    Keep in mind that openssl might not be installed on your system so it''s likely
    that you will need to install it first in order to use it.'
  merge: -1
  pgno: 129
- img_proc: true
  md: '+   The most preferred way is to use the pseudorandom number generator - /dev/urandom
    since it is intended for most cryptographic purposes. We would also need to manipulate
    the output using tr in order to translate it. An example command is:


    ```

    tr -cd ''[:alnum:]'' < /dev/urandom | fold -w10 | head -n 1

    ```


    With this command we take the output from /dev/urandom and translate it with tr
    while using all letters and digits and print the desired number of characters.'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# The script


    First we begin the script with shebang. We use it to tell the operating system
    which interpreter to use to parse the rest of the file.


    ```

    #!/bin/bash

    ```


    We can then continue and ask the user for some input. In this case we would like
    to know how many characters the password needs to be:


    ```

    # Ask user for password length

    clear

    printf "\n"

    read -p "How many characters you would like the password to have?" pass_length

    printf "\n"

    ```


    Generate the passwords and print it so the user can use it.


    ```

    # This is where the magic happens!

    # Generate a list of 10 strings and cut it to the desired value provided from
    the user

    for i in {1..10}; do (tr -cd ''[:alnum:]'' < /dev/urandom | fold -w${pass_length}
    | head -n 1); done


    # Print the strings

    printf "$pass_output\n"

    printf "Goodbye, ${USER}\n"

    ```'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# The full script:


    ```

    #!/bin/bash

    =========================================

    # Password generator with login option

    =========================================

    # Ask user for the string length

    clear

    printf "\n"

    read -p "How many characters you would like the password to

    have?" pass_lenght

    printf "\n"

    # This is where the magic happens!

    # Generate a list of 10 strings and cut it to the desired

    value provided from the user


    for i in {1..10}; do (tr ''[:alnum:]'' < /dev/urandom | fold

    -w${pass_lenght} | head -n 1); done


    # Print the strings

    printf "$pass_output\n"

    printf "Goodbye, ${USER}\n"

    ```'
  merge: -1
  pgno: 132
