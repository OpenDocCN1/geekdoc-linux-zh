  md: '# # Sending emails with Bash and SSMTP


    SSMTP is a tool that delivers emails from a computer or a server to a configured
    mail host.


    SSMTP is not an email server itself and does not receive emails or manage a queue.


    One of its primary uses is for forwarding automated email (like system alerts)
    off your machine and to an external email address.'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# # Prerequisites


    You would need the following things in order to be able to complete this tutorial
    successfully:


    +   - Access to an Ubuntu 18.04 server as a non-root user with sudo privileges
    and an active firewall installed on your server. To set these up, please refer
    to our [Initial Server Setup Guide for Ubuntu 18.04](https://www.digitalocean.com/community/tutorials/initial-server-setup-guide-for-ubuntu-18-04)

    - An SMTP server along with SMTP server, or you could set up your own SMTP server
    by following the steps from this tutorial on [https://www.digitalocean.com/community/tutorials/how-to-install-and-configure-postfix-as-a-send-only-smtp-server-on-ubuntu-16-04](How
    to Install and Configure Postfix as a Send-Only SMTP Server on Ubuntu 16.04)'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# Installing SSMTP


    In order to install SSMTP, you''ll need to first update your apt cache with:


    ```

    sudo apt update

    ```


    Then run the following command to install SSMTP:


    ```

    sudo apt install ssmtp

    ```


    Another thing that you would need to install is mailutils, to do that run the
    following command:


    ```

    sudo apt install mailutils

    ```'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# Configuring SSMTP


    Now that you have smmtp installed, in order to configure it to use your SMTP server
    when sending emails, you need to edit the SSMTP configuration file.


    Using your favourite text editor opent the /etc/smtp/ssmps.conf file:


    ```

    sudo nano /etc/ssmps/ssmps.conf

    ```


    You need to incldue the your SMTP configuration:


    ```

    root=postmaster

    mailubs=<^your_smtp_host^>:587

    hostname=<^your_hostname^>

    AuthUser=<^your_gmail_username@your_smtp_host.com^>

    AuthPass=<^your_gmail_password^>

    FromLineOverride=YES

    UseSTARTTLS=YES

    ```


    Save the file and exit.'
  merge: -1
