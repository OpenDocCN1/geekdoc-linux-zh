  md: "# Switch case statements\n\nAs in other programming languages, you can use\
    \ a case statement to simplify complex conditionals when there are multiple different\
    \ choices. So rather than using a few if, if-else statements, you could use a\
    \ single case statement.\n\nThe Bash case statement syntax looks like this:\n\n\
    ```\ncase $some_variable in\n  pattern_1)\n    commands\n    ;\n  pattern_2| pattern_3)\n\
    \    commands\n    ;\n  *)\n    default commands\n    ;\nesac\n```\n\nA quick\
    \ rundown of the structure:\n\n+   - All case statements start with the case keyword.\n\
    - On the same line as the case keyword, you need to specify a variable or an expression\
    \ followed by the in keyword.\n- After that, you use case patterns, where you\
    \ need to use ) to identify the end of the pattern.\n- You can specify multiple\
    \ patterns divided by a pipe: |\n- After the pattern, you specify the commands\
    \ that you would like to be executed in case that pattern matches the variable\
    \ or the expression that you've specified.\n- All clauses have to be terminated\
    \ by adding ;; ; at the end.\n- You can have a default statement by adding a *\
    \ as the pattern.\n- To close the case statement, use the esac (case typed backwards)\
    \ keyword.\n\nHere is an example of a Bash case statement:"
  merge: -1
  pgno: 45
- img_proc: true
  md: '```

    #!/bin/bash

    read -p "Enter the name of your car brand: " car in

    case $car in

    Tesla)

    echo -n "${car}''s car factory is in the USA."

    ;;

    BMW | Mercedes | Audi | Porsche)

    echo -n "${car}''s car factory is in Germany."

    ;;

    Toyota | Mazda | Mitsubishi | Subaru)

    echo -n "${car}''s car factory is in Japan."

    ;;

    *)

    echo -n "${car} is an unknown car brand"

    ;;

    esesac

    ```


    With this script, we are asking the user to input a name of a car brand like Tesla,
    BMW, Mercedes and etc.


    Then with a case statement, we check the brand name and if it matches any of our
    patterns, and if so, we print out the factory''s location.


    If the brand name does not match any of case statements, we print out a default
    message: an unknown car brand.'
  merge: -1
