- img_proc: true
  md: "# Continue and Break\n\nAs with other languages, you can use continue and break\
    \ with your bash scripts as well:\n\n+   - continue tells your bash script to\
    \ stop the current iteration of the loop and start the next iteration.\n\nThe\
    \ syntax of the continue statement is as follows:\n\n```\ncontinue [n]\n```\n\n\
    The [n] argument is optional and can be greater than equal to 1. When [n] is given,\
    \ the n-th enclosing loop is resumed. continue 1 is equivalent to continue.\n\n\
    ```\n#!/bin/bash\nfor i in 1 2 3 4 5\ndo\n    if [[ $i -eq 2 ]]\n    then\n  \
    \      echo \"skipping number 2\"\n        continue\n    fi\n    echo \"i is equal\
    \ to $i\"\ndone\n```\n\nWe can also use continue command in similar way to break\
    \ command for controlling multiple loops.\n\n+   - break tells your bash script\
    \ to end the loop straight away.\n\nThe syntax of the break statement takes the\
    \ following form:\n\n```\nbreak [n]\n```\n\n[n] is an optional argument and must\
    \ be greater than equal to 1. When [n] is provided, the n-th enclosing loop is\
    \ exited. break 1 is equivalent to break."
  merge: -1
  pgno: 54
- img_proc: true
  md: "Example:\n\n```\n#!/bin/bash\n\nnum=1\nwhile [[ $num -lt 10 ]]\ndo\n  if [[\
    \ $num -eq 5 ]]\n    then\n      break\n    fi\n  ((num++))\ndone\necho \"Loop\
    \ completed\"\n```\n\nWe can also use break command with multiple loops. If we\
    \ want to exit out of current working loop whether inner or outer loop, we simply\
    \ use break if if we are in inner loop & want to exit out of outer loop, we use\
    \ break 2.\n\nExample:\n\n```\n#!/bin/bash\nfor (( a = 1; a < 10; a++ ))\ndo\n\
    \  echo \"outer loop: $a\"\n  for (( b = 1; b < 100; b++ ))\n  do\n    if [[ $b\
    \ -gt 5 ]]\n      then\n        break 2\n      fi\n    echo \"Inner loop: $b\"\
    \n  done\n```\n\nThe bash script will begin with a=1 & will move to inner loop\
    \ and when it reaches b=5, it will break the outer loop. We can use break only\
    \ instead of break 2, to break inner loop & see how it affects the output."
  merge: -1
  pgno: 55
