  md: "# Until Loops\n\nThe difference between until and while loops is that the until\
    \ loop will run the commands within the loop until the condition becomes true.\n\
    \nStructure:\n\n```\nuntil [[ your_condition ]]\ndo\n    your_commands\ndone\n\
    ```\n\nExample:\n\n```\n#!/bin/bash\n\ncount=1\nuntil [[ $count -gt 10 ]]\ndo\n\
    \    echo $count\n    ((count++))\ndone\n```"
  merge: -1
