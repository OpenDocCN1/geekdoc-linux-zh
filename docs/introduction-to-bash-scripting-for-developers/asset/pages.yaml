- img_proc: true
  md: "# For loops\n\nHere is the structure of a for loop:\n\n```\nfor var in ${list}\n\
    do\n  your_commands\ndone\n```\n\nExample:\n\n```\n#!/bin/bash\nnusers=\"devdojo\
    \ bobby tony\"\nfor user in ${users}\ndo\n  echo \"${user}\"\ndone\n```\n\nA quick\
    \ rundown of the example:\n\n+   - First, we specify a list of users and store\
    \ the value in a variable called $users.\n- After that, we start our for loop\
    \ with the for keyword.\n- Then we define a new variable which would represent\
    \ each item from the list that we give. In our case, we define a variable called\
    \ user, which would represent each user from the $users variable.\n- Then we specify\
    \ the in keyword followed by our list that we will loop through.\n- On the next\
    \ line, we use the do keyword, which indicates what we will do for each iteration\
    \ of the loop.\n- Then we specify the commands that we want to run.\n- Finally,\
    \ we close the loop with the done keyword.\n\nYou can also use for to process\
    \ a series of numbers. For example here is one way to loop through 1 to 10:"
  merge: -1
  pgno: 49
- img_proc: true
  md: "```\n#!/bin/bash\nfor num in {1..10}\ndo\n  echo ${num}\ndone\n```"
