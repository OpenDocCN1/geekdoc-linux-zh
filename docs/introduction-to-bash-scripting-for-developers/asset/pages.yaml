  md: '# Introduction to Bash scripting


    Welcome to this Bash basics training guide! In this **bash crash course**, you
    will learn the **Bash basics** so you could start writing your own Bash scripts
    and automate your daily tasks.


    Bash is a Unix shell and command language. It is widely available on various operating
    systems, and it is also the default command interpreter over most Linux systems.


    Bash stands for Bourne-Again SHell. As with other shells, you can use Bash interactively
    directly in your terminal, and also, you can use Bash like any other programming
    language to write scripts. This book will help you learn the basics of Bash including
    Bash Variables, User Input, Comments, Arguments, Arrays, Conditional Expressions,
    Conditionals, Loops, Functions, Debugging, and testing.


    Bash scripts are great for automating repetitive workloads and can help you save
    time considerably. For example, imagine working with a group of five developers
    on a project that requires a tedious environment setup. In order for the program
    to work correctly, each developer will have to manually set up the environment.
    That''s the same and very long task (setting up the environment) repeated five
    times at least. This is where you and Bash scripts come to the rescue! So instead,
    you create a simple text file containing all the necessary instructions and share
    it with your teammates. And now, all they have to execute the Bash script and
    everything will be created for them.


    In order to write Bash scripts, you just need a UNIX terminal and a text editor
    like Sublime Text, VS Code, or a terminal-based editor like vim or nano.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Bash Structure


    Let''s start by creating a new file with a .sh extension. As an example, we could
    create a file called devdojo.sh.


    To create that file, you can use the touch command:


    ```

    touch devdojo.sh

    ```


    Or you can use your text editor instead:


    ```

    nano devdojo.sh

    ```


    In order to execute/run a bash script file with the bash shell interpreter, the
    first line of a script must indicate the absolute path to the bash executable:


    ```

    #!/bin/bash

    ```


    This is also called a Shebang.


    All that the shebang does is to instruct the operating system to run the script
    with the /bin/bash executable.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# # Bash Hello World


    Once we have our devdojo.sh file created and we''ve specified the shebang on the
    very first line, we are ready to create our first Hello World script.


    To do that, open the devdojo.sh file again and add the following after the #!/bin/bash
    line


    ```

    #!/bin/bash


    echo "Hello World!"

    ```


    Save the file and exit.


    After that make the script executable by running:


    ```

    chmod +x devdojo.sh

    ```


    After that execute the file:


    ```

    ./devdojo.sh

    ```


    You will see a "Hello World" message on the screen.


    Another way to run the script would be:


    ```

    bash devdojo.sh

    ```


    As bash can be used interactively, you could run the following command directly
    in your terminal and you would get the same result:'
  merge: -1
  pgno: 17
- img_proc: true
  md: '```

    echo "Hello DevDojo!"

    ```


    Putting a script together is useful once you have to combine multiple commands
    together.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# # Bash Variables


    As in any other programming language, you can use variables in Bash Scripting
    as well. However, there are no data types, and a variable in Bash can contain
    numbers as well as characters.


    To assign a value to a variable, all you need to do is the = sign:


    ```

    name="DevDojo"

    ```


    > > Notice: as an important note, you can not have spaces before and after the
    = sign.


    After that, to access the variable, you have to use the $ and reference it as
    shown below:


    ```

    echo $name

    ```


    Wrapping the variable name between curly brackets is not required, but is considered
    a good practice, and I would advise you to use them whenever you can:


    ```

    echo ${name}

    ```


    The above code would output: DevDojo as this is the value of our name variable.


    Next, let''s update our devmojo.sh script and include a variable in it.


    Again, you can open the file devdojo.sh with your favorite text editor, I''m using
    nano here to open the file:'
  merge: -1
  pgno: 19
- img_proc: true
  md: '```

    nano devdojo.sh

    ```


    Adding our name variable here in the file, with a welcome message. Our file now
    looks like this:


    ```

    #!/bin/bash

    name="DevDojo"

    echo "Hi there $name"

    ```


    Save it and run the file using the command below:


    ```

    ./devdojo.sh

    ```


    You would see the following output on your screen:


    Hi there DevDojo


    Here is a rundown of the script written in the file:


    +   * #!/bin/bash - At first, we specified our shebang.

    * name=DevDojo - Then, we defined a variable called name and assigned a value
    to it.

    * echo "Hi there $name" - Finally, we output the content of the variable on the
    screen as a welcome message by using echo


    You can also add multiple variables in the file as shown below:


    ```

    #!/bin/bash

    name="DevDojo"

    greeting="Hello"

    echo "$greeting $name"

    ```'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'Save the file and run it again:


    ```

    ./devdojo.sh

    ```


    You would see the following output on your screen:


    ```

    Hello DevDojo

    ```


    Note that you don''t necessarily need to add semicolon ; at the end of each line.
    It works both ways, bit like other programming language such as JavaScript!


    You can also add variables in the Command Line outside the Bash script and they
    can be read as parameters:


    ```

    ./devdojo.sh Bobby buddy!

    ```


    This script takes in two parameters Bobby buddy! seperated by space. In the devdojo.sh
    file we have the following:


    ```

    #!/bin/bash

    echo "Hello there" $1

    ```


    $1 is the first input (Bobby) in the Command Line. Similarly, there could be more
    inputs and they are all referred to the $ sign and their respective order of input.
    This means that buddy! is referenced to using $2. Another useful method for reading
    variables is the $@ which reads all inputs.


    So now let''s change the devdojo.sh file to better understand:'
  merge: -1
  pgno: 21
- img_proc: true
  md: '```

    #!/bin/bash

    necho "Hello there" $1

    # $1 : first parameter

    echo "Hello there" $2

    # $2 : second parameter

    echo "Hello there" $@

    # $@ : all

    ```


    The oupat for:


    ```

    ./devdojo.sh Bobby buddy!

    ```


    Would be the following:


    ```

    Hello there Bobby

    Hello there buddy!

    Hello there Bobby buddy!

    ```'
  merge: -1
