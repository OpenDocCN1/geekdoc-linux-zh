  md: '# Challenge - Script requirements


    The script needs to monitor the CPU usage on your server and if the CPU usage
    gets high based on the number vCPU it would enable the Cloudflare DDoS protection
    automatically via the Cloudflare API.


    The main features of the script should be:


    +   - Checks the script CPU load on the server

    - In case of a CPU spike the script triggers an API call to Cloudflare and enables
    the DDoS protection feature for the specified zone

    - After the CPU load is back to normal the script would disable the "I''m under
    attack" option and set it back to normal'
