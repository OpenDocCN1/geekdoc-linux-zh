  md: '# Working with Cloudflare API with Bash


    I host all of my websites on DigitalOcean Droplets and I also use Cloudflare as
    my CDN provider. One of the benefits of using Cloudflare is that it reduces the
    overall traffic to your user and also hides your actual server IP address behind
    their CDN.


    My personal favorite Cloudflare feature is their free DDoS protection. It has
    saved my servers multiple times from different DDoS attacks. They have a cool
    API that you could use to enable and disable their DDoS protection easily.


    This chapter is going to be an exercise! I challenge you to go ahead and write
    a short bash script that would enable and disable the Cloudflare DDoS protection
    for your server automatically if needed!'
