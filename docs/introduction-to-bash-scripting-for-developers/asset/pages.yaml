  md: "# # Bash Comments\n\nAs with any other programming language, you can add comments\
    \ to your script. Comments are used to leave yourself notes through your code.\n\
    \nTo do that in Bash, you will need to add the # symbol at the beginning of the\
    \ line. Comments will never be rendered on the screen.\n\nHere is an example of\
    \ a comment:\n\n```\n# This is a comment and will not be rendered on the screen\n\
    ```\n\nLet's go ahead and add some comments to our script:\n\n```\n#!/bin/bash\n\
    # Ask the user for their name\nread -p \"What is your name? \" name\n\n Greet\
    \ the user\necho \"Hi there $name\"\necho \"Welcome to DevDojo!\"\n```\n\nComments\
    \ are a great way to describe some of the more complex functionality directly\
    \ in your scripts so that other people could find their way around your code with\
    \ ease."
