    \ ]]\ndo\n    echo \"Your name can not be blank. Please enter a valid name!\"\n\
    \    read -p \"Enter your name again? \" name\ndone\n\necho \"Hi there ${name}\"\
    \n```\n\nNow, if you run the above and just press enter without providing input,\
