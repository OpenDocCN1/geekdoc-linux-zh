    1462 kafka 1 100 084900K 13388K select 1:51 10.60% Xorg

    1496 kafka 3 20 033072K 10928K kserel 0:05 0.05% nautilus

    ```


    To see the total size of memory consumed by a process (including text, data, and
    stack), you can sort by the SIZE column. To do that, type top -ovsize:


    ```

    $ top -ovsize

    ```'
