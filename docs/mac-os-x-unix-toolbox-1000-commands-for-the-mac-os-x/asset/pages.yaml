    # # Listing, Joining, and Adding Files to tar Archives


    So far, we''ve done all with tar to create and unpack archives. Also are available
    options for listing the contents of archives, joining archives together, adding
    files to an existing archive, and deleting files from an archive.


    To list an archive''s contents, use the -t option:


    ```

    $ tar tvf myfile.tar          List files from uncompressed archive

    -rw-r-- root/root      9584 2008-07-05 11:20:33 textfile.txt

    -rw-r-- root/root      9584 2008-07-09 10:23:44 textfile.txt

    $ tar tvf myfile.tgz         List files from gzip compressed archive

    ```


    Use the -r option to add one or more files to an existing archive. In the following
    example, myfile is added to the archive.tar archive file:


    ```

    $ tar rf archive.tar myfile Add file to a tar archive

    ```


    You can use wildcards to add multiple files to your archive:


    ```

    $ tar rf archive.tar *.txt Add multiple files to a tar archive

    ```


    # # Backing Up over a network


