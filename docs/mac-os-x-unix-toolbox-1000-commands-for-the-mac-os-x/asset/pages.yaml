    #  Listing, sorting, and Changing Text


    Instead of editing a single text file, you can use a variety of commands to display,
    search, and manipulate the contents of one or more text files at a time.


    # Listing Text Files


    The most basic method to display the content of a text file is with the cat command.
    The cat command concatenates (in other words, outputs as a string of characters)
    the contents of a text file to your display (by default). You can then use shell
    metacharacters to direct the contents of a file in different ways. For example:


    ```

    $ cat myfile.txt                   Send entire file to the screen

    $ cat myfile.txt > copy.txt      Direct file contents to another file

    $ cat myfile.txt >> myfile.txt  Append file contents to another file

    $ cat -s myfile.txt             Discard multiple consecutive blank lines

    $ cat -n myfile.txt             Show line numbers with output

    $ cat -b myfile.txt             Show line numbers only on non-blank lines

    ```


    However, if your block of text is more than a few lines long, using cat by itself
    becomes impractical. When''s you need better tools to look at the beginning or
    the end, or page through the entire text.


    To view the top of a file, use head:


    ```

    $ head myfile.txt

    $ cat myfile.txt | head

    ```


    Both these commands use the head command to output the top 10 lines of the file.
    You can specify the line count as a parameter to display any number of lines from
    the beginning of a file. For example:


    ```

    $ head -n 50 myfile.txt      Show the first 50 lines of a file

    $ ps auxw | head -n 15           Show the first 15 lines of ps output

    ```'
