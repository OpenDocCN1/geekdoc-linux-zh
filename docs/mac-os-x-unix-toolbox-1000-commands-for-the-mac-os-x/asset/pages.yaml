    # Working with time Machine and time Capsule


    The simplest way to run backups of your entire Mac OS installation is to run Time
    Machine. From the GUI, simply set up your preferences for Time Machine and then
    attach a Firewire- or USB-attached hard drive, a network-attached drive (such
    as Time Capsule), or another storage device.'
