  md: '# Chapter 7: Administering File Systems


    A few other useful mount options you can include the following:


    +   - noatime: Does not update the access time on files. Good on file systems
    with a lot of I/O, such as pools and logs.


    +   - noexec: Prevents execution of binaries on this file system. Can be used
    to increase security—for example, for /tmp in environments with untrusted users.


    To unmount a file system, use the unmount command. You can mount the file system
    using the device name or the mount point, but you''re better off unmounting with
    the mount point in order avoiding mistyping the device name (many of which are
    very similar):


    ```

    # mount -v /dev/ads04

    /dev/sda unmounted

    # mount -v /mnt/music

    /tmp/diskboot.img unmounted

    ```


    Unmount by device name

    Unmount by mount point


    If the device is busy, the unmount will fail. A common reason for an unmount to
    fail is that you have a shell open with the current directory of a directory inside
    the mount:


    ```

    # mount -v /mnt/music/

    unmount: unmount of /mnt/music failed: Device busy

    ```


    # Checking File Systems


    File systems are traditionally checked when the system boots up. The fsck command,
    which actually depends on a set of file-specific fsck commands, can not only check
    for consistency problems in a file system, but also interactively repair those
    problems when necessary.


    After file systems are mounted and users are allowed to access the system, fsck
    can be run with the -b flag to do background checking. You can run fsck at any
    time to check, and possibly repair, a file system.


    Instead of fsck try to figure out the file system type you are checking, you can
    run the file-system-specific commands directly on your file systems. These commands
    include fsck_ufs and fsck_mdosfs.


    The following example shows how to check a UFS file system by simply adding the
    device name of the partition you want to check the fsck_ufs command:


    ```

    # fsck_ufs /dev/ads04

    ** /dev/ads04

    ** Last Mounted on /mnt/extra

    ** Phase 1 - Check Blocks and Sizes

    ** Phase 2 - Check Pathnames

    ** Phase 3 - Check Connectivity

    ```


