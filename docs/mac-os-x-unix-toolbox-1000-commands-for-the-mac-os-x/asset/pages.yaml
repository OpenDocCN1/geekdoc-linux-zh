  md: '# 11


    # # Managing Network Connections


    Connecting to a network from a Mac OS X system is often as easy as attaching your
    computer''s network interface card (NIC) to your ISP''s hardware (such as a DSL
    or cable modem) and allowing the system to auto-detect the connection. However,
    if your network interface doesn''t come up or requires some manual intervention,
    commands are available for configuring network interface cards, checking network
    connections, and setting up special routing.


    This chapter covers many useful commands for configuring and working with your
    network interface cards, as `install` and `ifconfig`. In particular, it covers
    ways of configuring wired, wireless, and modem hardware. You will also learn about
    commands such as `netstat`, `dig`, and `ping` for getting information about your
    network when your hardware is connected and the network interfaces are in place.


    +   In this Chapter

    * Getting network statistics

    * Managing network connections

    * Checking DNS name resolution with dig, host, and hostname

    * Checking connectivity with ping and arping

    * tracing connections with traceroute and route

    * Watching the network with netstat


    # # Configuring Network Interfaces


    To configure network interfaces on Mac OS X, click the System Preferences on your
    Dock and then click Network. Click Advanced and you can configure settings for
    AirPort (wireless networking), DNS servers, DHCP, and more (see Figure 11-1).'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# Chapter 11: Managing Network Connections


    ![](img/d850b48b6750d726fcc813a2a895d7cc_169_0.png)


    More than likely, you won''t need to make any changes, as Mac OS X is pretty good
    about auto-detecting any newly installed NICs and keeping track of the wireless
    and wired network interfaces that you have.


    Ninety percent of the work you''ll do configuring network interfaces can be done
    from the System Preferences area, but much of the material that follows you with
    the information you need to configure, manage, and monitor network interface cards
    from the command line.


    > Note The interface names for your Ethernet NICs are based on the driver used
    to support that NIC. If you are coming from a Linux environment, you might expect
    Ethernet interfaces to be named eth0, eth1, and so on. In Mac OS X, the names
    might be lo0, en0, en1, etc0, or something else. Examples in this chapter use
    lo0 to represent a wireless Ethernet NIC.


    # Managing Network Interface Cards


    If the network hardware on your computer didn''t immediately appear and let you
    connect to the Internet, try the following steps to troubleshoot the problem:


    +   1. Check that your network interface card (NIC) is properly installed and
    that the cable is connected to your network (ISPEs, CPE, switch, and so on).

    2. After the cable is connected, make sure you have a link with no speed or duplex
    mismatches.

    3. If all else fails, consider replacing your NIC with a known-good spare to isolate
    a hardware failure.


    144'
