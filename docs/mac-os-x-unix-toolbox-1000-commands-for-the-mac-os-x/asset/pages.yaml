  md: '# Table 4-1: Changing Directory and File Access Permission (continued)


    | chmod (octal or Letters) | original permission | new permission | Description
    |

    | --- | --- | --- | --- |

    | chmod 0711 | any | drwx-x--x | Same as 0700 for owner. All others can change
    to the directory, but not view or change files in the directory. This can be useful
    for server hardening, whereby you can prevent someone from listing directory contents
    but allow accesses to a file in the directory if someone already knows it''s there.
    |

    | chmod go+r | drwx------ | drxr--r-- | Adding permission to a directory may not
    give desired results. Without execute on, others can''t view the contents of any
    files in that directory. |

    | chmod 0777 | any | drwxrwxrwx | All permissions are wide open. Anyone anywhere
    in the world can read, write, or execute this file. Obviously, this isn''t secure
    at all. |

    | chmod 0000 | any | d------- | All permissions are closed. This is good to protect
    a directory from errant changes, but backup programs that run as non-root may
    fail to back up the directory''s contents. |'
