    # Monitoring Memory Use


    Few things will kill performance faster than running out of memory. Commands such
    as top enable you to see basic information about how your RAM and swap are being
    used.


    The top command provides a means of watching the running processes, with those
    processes sorted by CPU usage or memory (see Chapter 9 for a description of top
    for running processes). You can also use top to watch your memory usage in a screen-oriented
    window. Here is an example:


    ```

    $ top

    last pid: 1619; load averages: 0.61, 0.85, 0.62 up 0+02:23:09 17:23:49

    8 processes: 2 running, 83 sleeping

    CPU states: 37.5% user, 0.0% nice, 15.4% system, 46.3% idle

    Mem: 76M Active, 31M In, 79M Wired, 2476K Cache, 34M Buf, 53M Free

    Swap: 484M Total, 25M Used, 5M Free

    ```


    To exit top, press q. The top command shows the total memory usage for RAM (Mem)
    and swap space (Swap). Because, top is onscreen and provides ongoing monitoring,
    you can watch memory usage change every two seconds (by default). The most useful
    column to analyze process memory usage is RES, which shows the actual physical
    RAM usage, also known as resident. Run top -size, and running processes will be
    displayed in resident memory use order (to sort by the RES column):


    ```

    $ top -size

    PID USER PR SIZE RES STAT TIME WCPU COMMAND

