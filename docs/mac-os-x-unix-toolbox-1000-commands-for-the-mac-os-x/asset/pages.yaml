  md: '# Chapter 13: Remote System Administration


    # # Configuring SSH


    Nowadays, the all-purpose tool of remote system administration is Secure Shell
    (SSH). SSH commands and services replace all the old remote tools and add strong
    encryption, public keys, and many other features. The most common implementation
    of SSH in the free and open-source software is OpenSSH (www.openssh.com), maintained
    natively on Mac OS X, so all you need to start using it is access to Terminal
    and a shell.


    If you prefer to use graphical tools to administer your remote BSD system, you
    can enable X11 tunneling (also called X11 port forwarding). With X11 tunneling
    enabled (on both the client and the server), you can start an X application on
    the server and have it displayed on the client. All communication across that
    connection is encrypted.


    FreeBSD comes with X11 forwarding (X11Forwarding yes) for the server (sshd daemon).
    You still need to enable it on the client side. To enable X11 forwarding on the
    client for a one-time session, connect with the following command:


    ```

    $ ssh -X kafka@myserver

    ```


    To enable X11 forwarding permanently for all users, add ForwardX11 to /etc/ssh/ssh_config.
    To enable it permanently for a specific user, add the lines to the user''s ~/.ssh/config.
    After those settings have been added, the -X option is no longer required in order
    to use X11 tunneling. To test that the tunneling is working, run ssh to connect
    to the remote system as you would normally. Then run xclock after sshing into
    the remote machine, and it should appear on your client desktop.


    SSH tunneling is an excellent way to secure remote graphical tools!


    # # Logging in Remotely with SSH


    To securely log to a remote host, you can use either of two different syntaxes
    to specify the username:


    ```

    $ ssh -l kafka myserver

    $ ssh kafka@myserver

    ```


    However, scp and sftp commands (discussed in Chapter 10) support only the user@server
    syntax, so we recommend using that to get by. If you do not specify the username,
    ssh will attempt to log in using the same user you are logged in locally. When
    connected, if you need to forcefully exit your SSH session, use the escape sequence
    of a tilde followed by a period (~.).


    179'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# Chapter 13: Remote System Administration


    # accessing SSH to a Different port


    For security purposes, a remote host may have its SSH service listening to a different
    port than the default port 22. If that case, use the -p option to ssh to contact
    that service:


    ```

    $ ssh -p 12345 kakfa@example.com   Connect to SSH on port 12345

    ```


    # Using SSH to Do Tunneling (X11 port Forwarding)


    With SSH tunneling configured as described earlier, the SSH service forwards X
    Window system clients to your local display. However, tunneling can be used with
    other TCP-based protocols as well.


    # Tunneling for X11 Clients


    The following sequence of commands illustrates how to start an SSH session, and
    start a few X applications so they appear on the local desktop:


    ```

    $ ssh -x kakfa@myserver ******       Start ssh connection to myserver

    kakfa@myserver:password: $ echo DISPLAY Show the current X display entry

    localhost:10.0                     sets display to localhost:10.0

    kakfa@myserver ~$ $ xeyes Show moving desktop eyes

    kakfa@myserver ~$ $ gnome-system-monitor Monitor system activities

    kakfa@myserver ~$ $ xcalc Use a calculator

    ```


    As more connections are requested, the $DISPLAY will be set to 11.0, 12.0, and
    so on.


    # Tunneling for CUPS Printing Remote Administration


    X11 is not the only protocol that can be tunneled over SSH. You can forward any
    TCP port with SSH. This is a great way to configure secure tunnels quickly and
    easily. No configuration is required on the server side.


    For example, myserver is a print server for the CUPS printing service''s web-based
    user interface (running on port 631). GUI is only accessible from the local machine.
    On my MacBook Pro, I tunnel to that service using ssh with the following options:


    ```

    $ ssh -L 1234:localhost:631 myserver

    ```


    This example forwards port 1234 on my client PC to localhost port 631 on the server.
    I can now browse to http://localhost:1234 on my client PC. This will be redirected
    to cups listening on port 631 on the server. Note that you need root privilege
    to forward ports with numbers lower than 1024.


    # Tunneling to an Internet Service


    Another example of SSH tunneling is when your local machine is blocked from connecting
    to the Internet, but you can get to another machine (myserver) that has an'
