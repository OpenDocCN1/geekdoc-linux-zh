  md: '# setting the umask


    Permissions given to a file or directory are assigned originally at the time item
    is created. How those permissions are set based on the user''s current umask value.
    Using the umask command, you can set the permissions given to files and directories
    when you create them:


    ```

    $ umask 0066  Make directories drwx-x-x and files --rw-----

    $ umask 0077  Make directories drwx------ and files --rw-r---

    $ umask 0022  Make directories drwxr-xr-x and files -rw-r--r-

    $ umask 0777  Make directories d--------- and files r--------

    ```


    # Changing ownership


    When you create a file or directory, your user account is assigned to that file
    or directory. So is your primary group. As root user, you can change the ownership
    (user) and group assigned to a file to a different user or group using the chown
    and chgrp commands, respectively. Here are some examples:


    ```

    # chown test/         Change owner to chris

    $ chown chris:market/  Change owner to chris and group to market

    # chgrp test/          Change group to market

    $ chown -R test/       Change all files below/ to owner chris

    ```


    The recursive option (-R) is useful if you need to change the ownership of an
    entire directory structure. With chmod, using chown recursively changes permissions
    for the directory named, along with its contents. For example, you might use chown
    recursively when a person leaves a company or stops using your web service. You
    can use chown -R to reassign their /Users directory to a different user.


    # Traversing the File system


    Basic commands for changing directories (cd), checking the current directory (pwd),
    and listing directory content (ls) are well known to casual shell users, so this
    section focuses on some lesser-common options to those commands, as well as other
    known features for moving around the file system. Here are some quick examples
    of cd for moving around the file system:


    ```

    $ cd                 Change to your home directory

    $ cd $HOME           Change to your home directory

    $ cd -               Change to your home directory

    $ cd -francois         Change to francois'' home directory

    $ cd -               Change to previous working directory

    $ cd $OLDPWD          Change to previous working directory (bash shell)

    $ cd -web            Change to web in your home directory (if it exists)

    $ cd ..               Change to parent of current directory

    $ cd /usr/bin         Change to usr/bin from root directory

    $ cd usr/bin         Change to usr/binbeneath current directory

    ```'
