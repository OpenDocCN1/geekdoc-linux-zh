  md: '# Chapter 9: Checking and Running Processes


    The example just shown displays the process ID for one running process associated
    with /Users/myerman. It might indicate an open file, an open shell, or a child
    process of a shell with the current directory in /Users/myerman or its subdirectories.
    The -c option uses /Users/myerman to be treated as the mount point (so anything
    below that is matched), and -u causes the owner of each process to be listed.


    Letters between the process IDs and the usernames indicate how files being open
    are used. In these examples, an x indicates that the file is the executable text
    of the process, and a c says that the file is the current working directory of
    the process. Other possible letters include r (the file is in the process''s root
    directory), j (the file is the jail root of the process), t (the file is the kernel
    tracing file of the process), y (the process uses the file as its controlling
    type), m (the file is mapped), w (the file is open for writing), a (the file is
    as append only), s (the file has a shared lock), and e (the file has an exclusive
    lock).


    Here are other examples using fuser to show processes with files:


    ```

    # fuser -c -m /boot      Show PIDs/symbols for processes opening /boot

    # fuser -u /boot         Show PIDs/symbols of /boot, not subdirectories

    ```


    After you know which processes have open files, you can close those processes
    manually or kill them. Close processes manually if possible, as simply killing
    processes can leave files in an unclean state! Here are examples of fuser to kill
    or send signals to all processes with files open to a system:


    ```

    # fuser -k /tmp/my.txt   Kill processes with /tmp/my.txt open (SIGKILL)

    ```


    Even after a process is running, you can change its behavior in different ways.
    With the nice command, shown earlier, you can adjust a running process''s priority
    in your system''s scheduler. With the nice command, you can determine the default
    priority or set a higher or lower priority at the time you launch a process.


    Another way to change how a running process behaves is to send a signal to that
    process. The kill and killall commands can be used to send signals to running
    processes. Likewise, the pkill command can send a signal to a process.


    # adjusting processor priority with nice


    Every running process has a nice value that can be used to tell the process scheduler
    what priority should be given to that process. Positive values of nicely actually
    give you a lower priority. The concept came about during the days of large, multi-user
    UNIX systems; you could be "nice" by running a non-urgent process at lower priority
    so other users had a shot at the CPU.


    Nicess does not enforce scheduling priority; it''s merely a suggestion to the
    scheduler. The default nice value is 0. You can use the nice command to run a
    process


    125'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# Chapter 9: Checking and Running Processes


    at a higher or lower priority than the default. The priority number can range
    from -35 (most favorable scheduling priority) to 19 (least favorable scheduling
    priority). Though the root user can raise or lower any user''s value, a regular
    user can only lower the priority of a process (setting a higher value).


    > **Warning** Proceed with caution when assigning negative nice values to processes.
    This can possibly crash your machine if critical systems processes lose their
    high priority.


    Here are a few examples of starting a command with `nice` to **change a command''s
    value**:


    ```

    $ -n 12 nroff -name a.roff | less  Format man pages at low priority

    # nice -n 10 designer      Launch QT Designer at higher priority

    ```


    When a process is already running, you can change the process''s value using the
    renice. Here are some examples of the renice command:


    ```

    $ renice +2 -u kafka      Renice kafka''s processes +2

    # nice +5 4737             Renice PID 4737 by +5

    # renice -3 /find -name \*.html -print  Renice find -3

    9688: old priority -1, new priority -3

    20279: old priority -1, new priority -3

    20282: old priority -1, new priority -3

    ```


    The backticks are used in the previous command to indicate that the output of
    the `find` command (presumably any .html files on the volume) should be fed to
    the `renice` command.


    The niceness settings for your processes are displayed by default when you run
    top. You can also see niceness settings using `-o nice` when you produce custom
    output from the `ps` command.


    # r running processes in the Background and Foreground


    When you run a process from a shell, it is in the foreground by default. This
    means you can run another command until the first one is done. By adding an ampersand
    (`&`) to the end of a command line, you can run command line in the background.
    Using the `fg`, `bg`, and `jobs` commands, along with various control codes, you
    can move commands between background and foreground.


    The following sequence of commands starts the GIMP image program from a Terminal
    window. After that is a series of control keys and commands to stop and start
    the process and move between foreground and background:


    ```

    $ gimp               Run gimp in the foreground

    <Ctrl+Z>             Stop process and place in background

    [1]+ Stopped gimp

    $ bg 1               Start process running again in background (bash)

    ```


