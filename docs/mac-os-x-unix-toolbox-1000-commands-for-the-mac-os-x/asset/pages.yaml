    # things to Watch Out For


    Before we move on, let''s take a moment to note some peculiarities in shell scripting.
    For example, when closing out an if case statement, did you notice the use of
    fi and esac? These mark the end of a conditional portion of your script.


    Notice the brackets around the if? Needs to be a space after the opening bracket
    () and before the closing bracket (). The preceding test without spaces will cause
    a syntax error.


    ```

    if [$ -eq "0" -o $ -gt "1"] #error! does not compute!

    ```


    Here''s another issue that will annoy beginning shell scripters. When you first
    set a variable''s value, don''t put spaces between the variable name, the equal
    sign, and the value:


    ```

    MYCOL = 14 #error! shell tries to find a command called MYCOL

    MYCOL=14 #you''re okay

    ```


    Furthermore, when you''re ready to use your new variable, remember to put a $
    sign in front of the name:


    ```

    echo $MYCOL #prints 14

    ```


