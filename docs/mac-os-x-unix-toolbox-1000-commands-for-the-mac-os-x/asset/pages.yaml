  md: '# Chapter 4: Working with Files


    If you want to find out what your current directory is, use pwd (print working
    directory):


    ```

    $ pwd

    /Users/myerman

    ```


    Creating symbolic links is a way to access a file from other parts of the file
    system (see the section "Using Symbolic and Hard Links" earlier in this chapter
    for more information on symbolic and hard links). However, symbolic links can
    cause some confusion about how parent directories are viewed. The following commands
    create a symbolic link to the /tmp directory from your home directory and indicate
    how to tell where you are related to a linked directory:


    ```

    $ cd HOME

    $ ln -s /tmp tmp-link

    $ ls -l tmp-link

    lrwxrwxrwx 1 myerman myerman 13 Mar 24 12:41 tmp-link -> /tmp

    $ cd tmp-link/

    $pwd

    ```


    Show the permanent location


    Show the link location


    ```

    $ pwd -L

    /tmp

    /Users/myerman/tmp-link

    $ cd - ..

    $pwd

    /Users/myerman

    ```


    Go to the parent of the link location


    ```

    $ cd tmp-link

    $ cd -P ..

    $pwd

    ```


    Go to the parent of the permanent location


    Using the -P and -L options to pwd and cd, you can work with symbolically linked
    directories in their parent or link locations, respectively. For example, cd -L
    .. takes up one level to your home directory, whereas cd -P .. takes up one level
    above the permanent directory (/). Likewise, the -P and -L options show permanent
    and link locations, respectively.


    If you use csh or bash shells, they can remember a list of working directories
    for you. Such a list can be useful if you want to return to previously visited
    directories. That list is organized in the form of a stack. Use pushd and popd
    to add and remove directories:


    ```

    $ pwd

    /Users/myerman

    $ pushd /usr/share/man/

    /usr/share/man ~

    $ pushd /var/log/

    /var/log /usr/share/man ~

    $ dirs

    /var/log /usr/share/man ~

    ```'
