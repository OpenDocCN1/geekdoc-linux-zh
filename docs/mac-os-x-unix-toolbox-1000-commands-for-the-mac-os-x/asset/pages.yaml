  md: '# Chapter 12: Accessing Network Resources


    You can control nfsd with the following commands:


    ```

    sudo nfsd start      Start or restart NFS

    sudo nfsd stop       Stop NFS

    sudo nfsd disable    Disable the NFS service

    sudo nfsd status     Get current status of NFS

    ```


    When your system is running the NFS service, you can add entries to the /etc/exports
    file to the share directories with remote clients and use mountpoint commands
    to see available and mounted shared directories. Mounting a shared directory is
    done with special options to the standard mount command.


    Please note that if you create an /etc/exports file, your Mac OS X automatically
    connects to an NFS share. This makes the NFS functionality more like other UNIX
    systems (the NetInfo Manager GUI utility has been removed from the Leopard release,
    so don''t bother looking for it if you are on Mac OS X 10.5 or higher).


    Here''s a sample entry in the /etc/exports file:


    ```

    /Users -maproot-kafk -network 10.0.0.0 -mask 255.255.255

    ```


    # sharing Directories from an nFs server


    With the NFS server running as just described, directories can be shared from
    that server using the mount command:


    ```

    sudo nfsserver:/export/this /Users/myerman/mounts

    ```


    This command will only work as long as you don''t restart the Mac OS X system.
