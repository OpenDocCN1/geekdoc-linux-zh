    Let''s add a bit more complexity to the equation. What if we needed to know something
    about the state of our system? What if this were a web server, and we needed to
    know, for example, how many Apache processes were running, as well as the number
    of MySQL processes, and maybe the size of the Apache error log?


    Now, we''re going far beyond simple command lines and piping—we need to start
    thinking about creating a shell script that will help us get this information.


    # Creating a Basic Shell Script


    When you create a shell script in an editor such as Vi or Nano, the first line
    of the script should call the interpreter—in this case, the BASH shell. It''s
    called the hash-bang line (or she-bang line, if you prefer), and it points the
    way to the interpreter that will actually make your script run:


    ```

    #!/bin/bash

    ```


    The rest of the script is made up of instructions. These instructions can be an
    orderly set of shell commands or they can be wrapped in conditional logic or loops.
    For example, we can simply echo our previous command by inserting its whole cloth
    into our script:


    ```

    #!/bin/bash

    uptime | cut -d'' '' -f1,12

    ```


    Saving this file as getinfo.sh, making it executable (chmod +x getinfo.sh), and
    running it will give us the expected results:


    14:53 0.03'
