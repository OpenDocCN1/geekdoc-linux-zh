  md: '# Chapter 9: Checking and Running Processes


    # Listing active processes


    To see processes are currently running on a system, most people use the ps and
    top commands. The ps command gives you a snapshot (in a simple list) of processes
    running at the moment. The top command offers a screen-oriented, constantly updated
    listing of running commands, sorted as you choose (by CPU use, I/O, UID and so
    on).


    # Viewing active processes with ps


    Every BSD system (as well as every system derived from UNIX, such as Linux, Mac
    OS X, and others) uses the ps command. Over the years, many different versions
    of ps have appeared, offering different options. Because ps dates back to the
    first UNIX systems, it also supports non ways of entering some options (for example,
    enabling you to drop the dash before an option (in some cases).


    The different uses of ps in this chapter will work on FreeBSD, OpenBSD, NetBSD,
    and other UNIX and Linux systems. Here are some examples you can run to show processes
    running for the current user (Table 7-1 contains column descriptions of ps output):


    ```

    $ ps List of current user at current shell

