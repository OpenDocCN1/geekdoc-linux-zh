    # Configuring the Built-in Firewall


    A firewall is a critical tool for keeping your computer safe from intruders over
    the Internet or other network. It can protect your computer by checking every
    packet of data that comes from your computer''s network interfaces, making a decision
    about what to do with packet based on parameters you have set.


    The firewall in OS X 10.5 (Leopard) is an application firewall. It enables you
    to control connections on a per-application basis instead of a per-port basis.
    This makes it easier for less-experienced users to benefit from security. Furthermore,
    you still have access to the ipfw command-line tool that gives you packet-level
    control over the firewall.


    By default, Mac OS systems ship with the firewall turned off. To change this,
    click System Preferences on your Dock, and then click Security. Select the Firewall
    tab. You have two levels of security, as shown in Figure 14-3.


    +   - Allow only essential services: Mac OS X will allow incoming connections
    to a limited set of services (among them config, mDNSResponder for Bonjour, and
    raccoon for IPSec).


    +   - Set access for specific services and applications: This mode provides you
    with the most flexibility, as it allows you to choose whether to deny or allow
    incoming connections for any application on your system.


    If you select the third option, you can click the Advanced button to set up logging
    of events and to put your Mac OS X system in "Stealth mode" (in other words, it
    won''t respond to ICMP requests).'
