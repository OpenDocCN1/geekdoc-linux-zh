  md: "# Chapter 8: Backups and Removable Media\n\nFast and reliable networks; inexpensive,\
    \ high-capacity hard disks; and the security that comes with your data off-site\
    \ have all made network backups a popular practice. for an individual backing\
    \ up personal data or for a small office, combining a few simple commands may\
    \ be all that is needed to create efficient and secure backups. this approach\
    \ represents a direct application of the UNIX philosophy: joining together simple\
    \ programs that do one thing to get a more complex job.\n\nAlthough just any command\
    \ that can copy files over a network, some utilities are good for the job. using\
    \ OpenSSH tools such as ssh and scp, you can use secure password-transfers of\
    \ backup archives and encrypted transmissions of those archives.\n\nTools such\
    \ as rsync command can save resources by backing up only files (or parts of files)\
    \ that have changed since the previous backup. the following sections describe\
    \ some of these techniques for backing up your data to other machines over a network.\n\
    \n> A similar that might interest you is the snapshot command (pkgadd -r rapshot).\
    \ The snapshot command (.snapshot.org/) can work with rsync to make configurable\
    \ hourly, daily, weekly, or monthly snapshots of a file system. it uses hard links\
    \ to keep a snapshot of a file system, which it can then synchronize with changed\
    \ files.\n\n# Backing Up archives over ssh\n\nOpenSSH (www.openssh.org/) provides\
    \ tools to securely perform remote login, remote execution, and remote file copy\
    \ network interfaces. by setting up two machines to share encryption keys, you\
    \ can transfer files between those machines without entering passwords for each\
    \ transmission. that enables you to create scripts to back up your data from an\
    \ SSH client to an SSH server, without any manual intervention.\n\nFrom a central\
    \ BSD system, you can gather backups from multiple client machines using OpenSSH\
    \ commands. the following example runs the tar command on a remote site (to archive\
    \ and compress the files), pipes the tar to standard output, and uses the ssh\
    \ command to catch the backup locally (over ssh) with tar:\n\n```\n$ mkdir mybackup;\
    \ cd mybackup\n ssh kafka@server1 'tar cf myfile*' | tar xvf -\nafka@server1's\
    \ password: ******\nmyfile\nmyfile2\n```\n\nIn the example shown above, all files\
    \ beginning with myfile are copied from the home directory of kafka on server1\
    \ and placed in the current directory. note that the left side of the pipe creates\
    \ the archive, and the right side expands the files from the archive to the current\
    \ directory. (keep in mind that ssh might overwrite local files if they exist,\
    \ which is why we created an empty directory in the example.)\n\n108"
