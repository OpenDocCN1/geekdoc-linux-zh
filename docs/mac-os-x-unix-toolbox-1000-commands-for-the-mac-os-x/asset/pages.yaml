    In the first line shown, a dash (-) is used as the delimiter. In the second case,
    the exclamation point (!) is the delimiter.


    The sed command can run multiple substitutions at once, proceeding each one with
    -e. Here, in the text streaming from myfile.txt, all occurrences of marlowe are
    changed to MARLOWE, and all occurrences of kafka are changed to KAFKA:


    ```

    $ -e s/marlowe/MARLOWE -e s/kafka/KAFKA myfile.txt

