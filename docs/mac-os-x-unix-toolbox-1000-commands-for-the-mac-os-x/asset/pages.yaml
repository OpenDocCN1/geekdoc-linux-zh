  md: '# Chapter 1: Starting with UNIX on Mac OS X


    +   - Features not supported by GUI—GUI administration tools need to present the
    most basic ways of performing a task. More complex operations often require options
    that are only available from the command line.


    The bottom line is that in order to unlock the full power of your Mac OS system,
    you must be able to use shell commands. Thousands of commands are available to
    monitor and manage every aspect of your system.


    Whether you are a UNIX guru or a novice, however, one challenge looms: How do
    you remember the most critical commands and options you need, when a command might
    only show you this:


    Mac OS X UNIX Toolbox is not just another command reference or refresh of pages.
    This book presents commands on Mac OS X according to how you actually use them.
    In other words, instead of listing commands alphabetically, we group together
    commands for working with file systems, connecting to networks, and managing processes,
    so you can access commands by what you want to do, not only by how they are named.


    Likewise, we won''t just you a listing of every option available for every command.
    Instead, we provide working examples of the most important and useful options
    to use with each command. From there, we''ll describe quick ways to find more
    options, if you need them, from man pages, the info facility, and help options.


    # Finding Commands


    All the commands described in this book should be installed when you are ready
    to run them. However, note that this book is based on the latest release of Mac
    OS X (version 10.5, called Leopard), so if you are running Tiger (10.4) you may
    not have something installed.


    You might type a command and see a message similar to the following:


    ```

    mycommand: command not found

    ```


    This might happen for the following reasons:


    +   - You mistyped the command name.

    - The command is not in your PATH.

    - You may need to be the root user for the command to be in your PATH.

    - The command is not installed on your computer.'
