    If you are familiar with text replacement commands in Vi, sed has some similarities.
    In the following example, you would replace only the first occurrence per line
    of marlowe. Here, sed takes its input from a pipe, sending its output to stdout
    (your screen). The original file is not changed:


    ```

    $ cat myfile.txt | sed s/marlowe/kafka/

    ```


    Adding a g to the end of the substitution line, as in the following command, causes
    every occurrence of marlowe to be changed to kafka. In addition, in the following
    example, input is directed from the myfile.txt, and output is directed to myfile.txt:


    ```

    $ s/marlowe/kafka/g myfile.txt > myfile.txt

    ```


    The next example replaces the occurrences of myname on each line in the /etc/hosts
    file with your. The output is directed to the /tmp/hosts file:


    ```

    $ s/myName/yourname/'' < /etc/hosts > /tmp/hosts

    ```


    Although the forward slash is the sed command''s default delimiter, you can change
    the delimiter to any other character of your choice. Changing the delimiter can
    make your life easier when the string contains slashes. For example, the previous
    command line containing a path could be replaced with one of the following commands:


    ```

    $ s ''-nswitch.conf-/nswitch.conf and stuff-'' < /etc/hosts | grep nss

    $ s ''!/termios.h-/termios.h and stuff!'' < /etc/gettab | grep termios

