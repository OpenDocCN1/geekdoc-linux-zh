    list (ls -1) of files and directories, the beginning 10 characters indicate what
    the item is (file, directory, character device, and so on), along with or not
    the item can be read, written, or executed. Figure 4-1 illustrates the meaning
    of those 10 characters.


    ![](img/d850b48b6750d726fcc813a2a895d7cc_72_0.png)


