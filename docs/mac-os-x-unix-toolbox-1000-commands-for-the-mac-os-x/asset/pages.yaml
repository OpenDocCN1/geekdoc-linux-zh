    # Creating Simple Shell Scripts


    Shell scripts are good for automating repetitive shell tasks. Bash and other shells
    include the basic constructs found in various programming languages, such as loops,
    tests, case statements, and on. The main difference is that there is only one
    type of variable: strings.


    Later, in Chapter 6, you will learn more about working with shell scripting, but
    for now here''s a brief set of examples to get your feet wet.


    # editing and running a Script


    Shell scripts are simple text files. You can create them using your favorite text
    editor (such as vi). In order to run, the shell script file must be executable.
    For example, if you created a shell script with a filename of myscript.sh, you
    could make it executable as follows:


    ```

    $ chmod u+x myscript.sh

    ```


    Alternately, instead of making it executable, you could precede the script with
    the bash command to run it (bash myscript.sh). Note that the first line of your
    bash scripts should always be the following:


    ```

    #!/bin/bash

    ```


    As with any command, besides being executable the shell script you create must
    either be in your PATH or be identified by its full or relative path when you
    run it. In other words, if you just try to run your script, you may get the following
    result:


    ```

    $ myscript.sh

    bash: myscript.sh: command not found

    ```'
