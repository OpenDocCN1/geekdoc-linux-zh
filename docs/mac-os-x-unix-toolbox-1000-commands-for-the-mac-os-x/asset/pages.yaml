  md: '# Chapter 5: Manipulating Text


    On Mac OS X, an improved version of Vi is available called Vim (it''s already
    installed). Vim (Vi Improved) will provide the most up-to-date, feature-rich,
    and user-friendly Vi editor. For more details about using Vi and Vim, refer to
    Appendix A.


    Traditional, the other Unix text editor has Emacs and its more graphical variant,
    XEmacs. Emacs is a powerful multi-function tool that can act as a mail/news reader
    or shell and perform other functions. Emacs is also known for its very complex
    series of keyboard shortcuts that require two arms to execute properly.


    In the mid-1990s, Emacs was ahead of Vi in terms of features. Now that Vim is
    widely available, both can provide the text-editing features you''ll ever need.
    If you are not already familiar with either Vi or Emacs, we recommend you start
    by learning.


    Many other command-line and GUI text editors are available for BSD systems. Textbased
    editors that you may find to be simpler than Vi and Emacs includes Pico and Nano.
    Start any of these editors by typing their command name, optionally followed by
    the filename you want to edit. The following sections offer some quick descriptions
    of how to use each of those.


    # Using the pico and nano Editors


    Pico is a popular, small text editor, distributed as part of the Pine e-mail client.
    Although Pico is free, it is not truly open source. However, it is available on
    Mac OS X. As an alternative to Pico, you can use an open-source clone of Pico
    called Nano (Nano''s other editor). This section describes the Nano editor.


    Nano (represented by the nano command) is a compact text editor that runs from
    the shell, but is screen oriented (owing to the fact that it is based on the curses
    library). Nano is popular with those who formerly used the Pine e-mail client
    because Nano''s editing features are the same as used by Pico''s editor. On the
    rare occasion that you don''t have the Vi editor, Nano may be available.


    Unlike Vi, instead of commanding and typing modes, you can just begin typing.
    To open a file for editing, type nano filename and use some of the following options:


    ```

    $ nano memo.txt for editing

    $ nano -B memo.txt When saving, backup previous to ~.filename

    $ nano -m memo.txt Turn to move cursor (if supported)

    $ nano +83 memo.txt Begin editing on line 83

    ```


    To add text, just begin typing. Use arrow keys to move the cursor, right, up or
    down. Use the Delete key to delete text under the cursor, or the Backspace to
    erase text to the left of the cursor. Press Enter to add a line break. Press Ctrl+G
    to get help text. Table 5-2 shows the control codes for Nano that are described
    on the help screen.'
