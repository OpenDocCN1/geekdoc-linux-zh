  md: '# Chapter 12: Accessing Network Resources


    # Mounting nfs shares


    Use the mount command to mount a remote NFS share on the local computer. Here
    is an example:


    ```

    # mkdir /mnt/server-share

    # mount server.example.com:/export/myshare /mnt/server-share

    ```


    This example notes the NFS server (server.example.com) and the shared directory
    from server (export/myshare). The local mount point, which must exist before mounting
    the share, appears at the end of the command (mnt/server-share).


    Pass NFS-specific options to the mount command by adding them the -o option:


    ```

    # mount -o rw,hard,intr server.example.com:/export/myshare /mnt/server-share

    ```


    The rw option monitors the remote directory with read-write permissions, assuming
    that permission is available. With hard set, someone using the share will see
    a server not responding message when a read or write operation times out. If that
    happens, having the int option enables you to interrupt a request to a remote
    server (type Ctrl+C).


    # sharing r e Directories with samba


    Samba is the open-source implementation of the Windows file and print-sharing
    protocol originally known as Server Message Block (SMB) and now called Common
    Internet File System (CIFS).


    # Viewing and accessing samba shares


    To scan your network for SMB hosts, type the following:


    ```

    $ findsmb


    *=DMB

    +=LMB


    IP ADDR NETBIOS NAME WORKGROUP/OS/VERSION

    192.168.1.1 SERVER1 +MYWORKGROUP] [Unix] Samba 3.0.25a-3.fc7

    ```


    To view a tree representation of your network neighborhood (shared directories
    and printers), use smbtree:


    ```

    # smbtree

    Password: ******

    MSHOME

    \\HOPE-HP Hope''s HP

    \\HOPE-HP\Printer Snagit 7

    \\HOPE-HP\$ Default share

    \\HOPE-HP\ADMIN$ Remote Admin

    \\HOPE-HP\Printer PageManager PDF Writer

    ```'
