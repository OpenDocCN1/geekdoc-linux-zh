  md: '# Chapter 10: Managing the System


    The length of time that a Mac OS system has been running since the previous reboot
    is referred to as uptime. You can check your system''s uptime as follows:


    ```

    $ uptime Check how long your system has been running

    6:53pm up 196 days, 14:25, 3 users, load average: 1.66, 0.88, 0.35

    ```


    The output of uptime shows the current time, how many days and hours the system
    has been up, and how many users are currently logged in. After that, uptime shows
    the system load over the past 1, 5-, and 15-minute time periods.


    # starting and stopping Your System


    On most BSD and Linux machines, you can use the init command to start and stop
    the system, including init 0 (shut down) and init 6 (reboot). On Mac OS X, you
    use more specific commands for stopping the system. The advantages of commands
    such as halt, reboot, or shutdown are that they include options that enable you
    to stop some features before shutdown occurs. Here is an example:


    > **Warning** Don''t try the following commands if you don''t intend to actually
    turn off your system, especially on a remote system.


    ```

    # reboot Reboot the computer

    # halt -n Don''t run sync to sync hard drives before shutdown

    # halt -p The system will power down, if possible

    # shutdown +10 Shutdown in ten minutes after warning the users

    # shutdown -r 06:08 Reboot at 6:08 am

    # shutdown +10 ''Bye!'' Send custom message to users before shutdown

    ```


    You can also shut down a Mac OS system by clicking the Apple icon in the upper-left
    corner of the screen and selecting Shut Down from the menu, as shown in Figure
    10-2.


    In the rare event that your Mac OS system is hanging or won''t respond to any
    commands, you can force a reboot by holding down the power button until the system
    starts up.


    ![](img/d850b48b6750d726fcc813a2a895d7cc_165_0.png)


    140'
