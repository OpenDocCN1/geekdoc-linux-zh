  md: "# Appendix F: Perl Primer\n\nIn my case, I needed a simple user agent that\
    \ would visit a URL. For this, I'd use the LWP::Simple package. I also knew that\
    \ I need a quick way to extract links from HTML document I encountered. For that,\
    \ I could use the HTML::LinkExtor package.\n\nIn the old days, I would have tried\
    \ to construct my own user agent and my own extractor, but fortunately with age\
    \ comes wisdom (and a simple desire to get the job done quickly and efficiently).\
    \ You'll find the thing in your own Perl coding—you'll want to do something more\
    \ advanced, but you don't have time to figure it out yourself. Simple solution:\
    \ Set if someone has written a module or package.\n\nFor now, let's get going\
    \ with the script.\n\n# the entire script\n\nLet's look at the entire script first,\
    \ so you know what we're getting into. As you can see, it's only 20 lines or so\
    \ (not including comments), so it won't be that hard to get your head around.\
    \ Before we leave this section and dive into the details, I'll show you some things\
    \ you'll find in just about any Perl script.\n\nHere's the script:\n\n```\n#!/usr/bin/perl\
    \ -w\n# curl.pl - check urls\n\nuse HTML::LinkExtor\nuse LWP::Simple qw(get head);\n\
    \n$base_url = shift or use \"usage: $0 <start_url>\\n\"\n$parser = HTML::LinkExtor->new(undef,\
    \ $base_url);\n$links = $parser->parse(get($base_url));\n@links = $parser->links(\\\
    ;);\nprint \"$base_url:\\n\";nforeach $linkarray (@links) {\n  my $element = @$linkarray;\n\
    \  my $elt_type = shift $element;\n  while ($element) {\n    my ($attr_name, $attr_value)\
    \ = splice($element, 0, 2);\n    if ($attr_value =~-scheme ~ /\\b(https?|file)\\\
    /b/) {\n      print \"$attr_value: \", head($attr_value) ? \"OK\" : \"BAD\",\\\
    n\"\n    }\n  }\n}\n```\n\nThe first thing you need to know is the first line—known\
    \ colloquially as the shebang line. This line tells the script where to find the\
    \ Perl interpreter. Note the use of the -w flag, which tells Perl to run with\
    \ warnings enabled. With this flag up, Perl will complain a lot more, and you'll\
    \ have to be a bit more careful, but it's a good idea to run in this.\n\n241"
