  md: "# Appendix F: Perl Primer\n\nwould take several hundred lines (at the very\
    \ least) to code up a link extractor and a lightweight user agent, but now we\
    \ don't have to.\n\n# targeting the URL and extracting Links\n\nNow it's time\
    \ to actually go to a URL and extract the links. In Perl, as in other command-line-oriented\
    \ languages, you can pass arguments to the script very easily. All command-line\
    \ arguments are stored in a special array called @ARGV. To get to the first argument,\
    \ you would normally use the shift command, like this:\n\n```\n$argument = shift\
    \ @ARGV;\n```\n\nHowever, the shift command, when given no argument, always defaults\
    \ to the @ ARGV array, so you can simplify like this:\n\n```\n$argument = shift;\n\
    ```\n\nHowever, for our purposes, we need to determine whether the shift operation\
    \ actually works. If it does, set a variable called $base_url. If not, the script\
    \ needs to die with a certain error message telling the user what the accepted\
    \ usage.\n\nHere's the change:\n\n```\n$base_url = shift or die \"usage: $0 <start_url>\\\
    n\";\n```\n\nNotice the use of the shift or die syntax. That's where idiomatic\
    \ elasticity comes in. C and Java programmers might prefer to see the following\
    \ instead:\n\n```\n$base_url = shift;\nif (length($base_url) == 0){\n  die \"\
    usage: $0 <start_url>\\n\";\n}\n```\n\nBe told, you could do that if you like,\
    \ but the original syntax is so much more concise!\n\nOnce you have a base URL\
    \ to work with, you can invoke the HTML::LinkExtractor parser by passing the $base_url\
    \ variable, resulting in all the links stored in an array called @links (thanks\
    \ to $Parser->links below).\n\nYou can print the base URL as a header for your\
    \ output:\n\n```\n$parser = HTML::LinkExtractor->new(undef, $base_url);\n$parser->parse(get($base_url));\n\
    @links = $parser->links;\nprint \"$base_url: \\n\";\n```\n\n243"
  merge: -1
  pgno: 268
- img_proc: true
  md: "# Appendix F: Perl Primer\n\nIn just four lines, we've captured every single\
    \ link on the URL we're targeting.\nInstead being out there on the HTML document,\
    \ or living in some captured stream of text, they're safely encapsulated in an\
    \ array that we can process with no fuss or muss.\n\n# Processing the @links Array\n\
    \nNow that we have a array of links, we can do something useful with them. The\
    \ best way to do is to use a foreach loop; that way, we can step through the entire\
    \ array until we fall off the end of it (meaning no links to process!)\n\nHere's\
    \ the code, which is followed by a line-by-line explanation:\n\n```\nforeach $linkarray\
    \ (@links) {\nmy @element = $linkarray;\nmy $elt_type = shift @element;\nwhile\
    \ (@element) {\n    my ($attr_name, $attr_value) = splice(@element, 0, 2);\n \
    \   if ($attr_value->scheme =~ /\\b(ftp|https)?\\/file\\/b/) {\n        print\
    \ \"$attr_value: \", head($attr_value) ? \"OK\" : \"BAD\",\\n\";\n    }\n}\n```\n\
    \nNotice when we use the foreach, we use the following syntax:\n\n```\nforeach\
    \ $linkarray (@links) {\n```\n\nThis way, each time through the loop, the next\
    \ value in the @links array is assigned to the $linkarray value. We could have\
    \ used the following:\n\n```\nforeach (@links) {\n```\n\nThis way, each time through\
    \ the loop, the next value in the array would have been assigned to the special\
    \ variable $_. There's nothing wrong with that approach all—in, a lot of Perl\
    \ scripts use of this variable—but it can be a little confusing trying to figure\
    \ out what $_ is set to, especially as your scripts get more complex. It's a good\
    \ idea to explicitly set your variables.\n\nOnce we're in the loop, we can start\
    \ doing hard work. Notice how in the next two lines, we create two private variables\
    \ using the my operator:\n\n```\nmy @element = @linkarray;\nmy $elt_type = shift\
    \ @element;\n```\n\nIn the first case, we create a private array @element. This\
    \ array contains the value (forced into array context) of $linkarray. In other\
    \ words, as we pass through the array @links, each value is converted into array\
    \ context. That's because each link is a series of anonymous arrays (the link\
    \ type, the link tag itself, followed by one or more attributes, and so on).\n\
    \n244"
  merge: -1
  pgno: 269
- img_proc: true
  md: "# Appendix F: Perl Primer\n\nIn the second case, we use the my operator again\
    \ to create a private variable for what we shift out of the newly created @element.\
    \ The first variable will always be the element-type, which is why it is called\
    \ $elt_type.\n\nWhy are we bothering to grab it? Simple. We it out of the way,\
    \ and shift will cut it from the array nicely, leaving only the things that we\
    \ care about.\n\nNow that we have an @element array for this pass, we can use\
    \ a while block to work on each anonymous array inside it. In the code that follows,\
    \ we first use splice to out an attribute name and value from @element. Then,\
    \ if we've captured a scheme that matches ftp, http, https, or file, we use the\
    \ head() function from LWP::Simple to try to reach the link address. If we can't,\n\
    \n```\nwhile (@element) {\n    my ($attr_name, $attr_value) = splice(@element,\
    \ 0, 2);\n    if ($attr_value->scheme =~ /\\b(ftp|https?|file)\\b/) {\n      \
    \  print \" $attr_value: \", head($attr_value) ? \"OK\" : \"BAD\", \"\\n\";\n\
    \    }\n}\n```\n\n)\n\nAs you can see, Perl's syntax compression enables you to\
    \ get an astonishing amount of work done up to it in just a few lines. Some folks\
    \ appreciate that, but others don't care for it. I leave it to where you fall—it's\
    \ as easy to write this script with 100 or more lines depending on your approach.\n\
    \n# Running the script\n\nOnce you have the script written, save it somewhere\
    \ on your file system as curl.pl (which stands for \"check url\") and make it\
    \ executable with chmod +x curl.pl.\n\nNext, run it from the command line, giving\
    \ a URL to start with:\n\n```\n.curl.pl http://www.apple.com\nhttp://www.apple.com:\n\
    http://www.apple.com/ - OK\nhttp://images.apple.com/main/rss/hotnews/hotnews.rss\
    \ - OK\nhttp://www.apple.com/sitemap/: - OK\nhttp://images.apple.com/global/scripts/lib/prototype.js:\
    \ OK\nhttp://images.apple.com/global/scripts/lib/scriptaculous.js: OK\nhttp://images.apple.com/global/scripts/browserdetect.js:\
    \ OK\nhttp://images.apple.com/global/scripts/apple_core.js: OK\nhttp://images.apple.com/global/scripts/search_decorator.js:\
    \ OK\nhttp://images.apple.com/home/scripts/ticker.js: OK\nhttp://www.apple.com/global/styles/base.css:\
    \ OK\nhttp://www.apple.com/home/styles/home.css: OK\nhttp://images.apple.com/global/nav/scripts/shortcuts.js:\
    \ OK\n```\n\n*\n\n245"
