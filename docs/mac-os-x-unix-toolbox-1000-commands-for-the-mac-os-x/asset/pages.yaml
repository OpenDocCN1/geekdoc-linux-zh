  md: '# Appendix A: Using vi or Vim Editors


    # Using Miscellaneous Commands


    Table A-4 shows a few miscellaneous, but important, commands you should know.


    Table A-4: Miscellaneous Commands


    | Key | Result |

    |---|---|

    | u | Type u to undo the previous change. Multiple u commands toggles the previous
    undo and on off. (In vim, typing :setncompatible will allow multi-level undos.
    Ctrl-r to undo yours.) |

    |  | Typing a period (.) will repeat the previous command. For example, if you
    deleted a line, replaced a word, changed four letters, and so on, the same command
    will be done wherever the cursor is currently located. (Entering Input mode again
    resets it.) |

    | J | Join the current line with the next line. |

    | Esc | If you didn''t catch this earlier, the Esc key returns you from an input
    mode back to command mode. This is one of the keys you will use most often. |


    # Modifying Commands with Numbers


    Nearly every command described so far can be modified with a number. In other
    words, instead of deleting one word, replacing one letter, or changing one line,
    you can delete six words, replacing 12 letters, and change nine lines. Table A-5
    shows some examples.


    Table A-5: Modifying Commands with Numbers


    | Command | Result |

    |---|---|

    | 7cw | Erase the next seven words and replace them with text you type. |

    | d5d | Cut the next five lines (including the current line). |

    | 3p | Paste the previously deleted text three times after the current cursor.
    |

    | 9db | Cut the nine words before the current cursor. |

    | 10j | Move the cursor down 10 lines. |

    | y2) | Copy (yank) from the cursor to the end of the next two sentences. |

    | 5Ctrl+F | Move forward five pages. |

    | 6J | Join together the next six lines. |'
