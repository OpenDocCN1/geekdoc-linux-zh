  md: '# Administering File Systems


    File systems provide the structures in which files, directories, devices, and
    other elements of the system are accessed from your Mac OS X. Mac OS X supports
    many different file systems, including HFS+ (default), HFS, UFS, AFP, ISO 9660,
    FAT, UDF, SMBFS, NTFS (read only), FTP, and WebDAV.


    HFS+ is the preferred file system on Mac OS X. It supports many advanced features,
    such as journaling, quotas, byte-range locking, Finder information in metadata,
    multiple encodings, and symbolic links, aliases, support for file extensions,
    and so on.


    Creating and managing disk partitions, and the file systems on partitions, are
    among the most critical jobs in administering a Mac OS X system. That''s because
    if you mess up your file system, you might well lose the critical data on your
    computer''s hard disk or removable media.


    This chapter contains commands for partitioning storage media, creating file systems,
    mounting and unmounting file systems, and checking file systems for errors and
    disk space.


    # Understanding File System Basics


    If you''re coming to Mac OS X from another BSD or Linux background, the first
    thing you need to know is that partitions on the Mac are called volumes. Each
    volume represents an addressable section of the hard disk that is assigned a specific
    function: a separate operating system (e.g., Linux or Windows XP), file storage,
    swap, and so on.


    Typically, you probably won''t want to change your default volume setup; but if
    you find yourself in a position where you need to support different


    # 7'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# Chapter 7: Administering File Systems


    operating systems or want a different file system setup, then you may need to
    partition your system. We''ll get to later that in this chapter.


    Partitioning your Mac OS X system will cause all data on it to be erased!


    # Setting Up the Disk Initially


    If you''re used to working with other BSD flavors or Linux, you''re probably accustomed
    to having an initial disk setup with a utility such as fdisk. It''s highly unlikely
    that your iMac, MacBook Pro, or Mac Pro will need this step, as it ships with
    everything you need to get started, already set up.


    # Checking Your Disk Setup


    You can check your disk setup anytime you want with the mount command. This command
    shows how the disk space is divided among several partitions that are then mounted
    in different places in the file system:


    ```

    $ mount Display mounted disk partitions

    /dev/disk02 on / (hfs, local, journaled)

    devfs on /dev (devfs, local)

    fdesc on /dev (fdesc, union)

    map -hosts on /net (autofs, automounted)

    map -auto_home on /home (autofs, automounted)

    ```


    Next, to see how the disk space is distributed among the partitions on your hard
    disk, you can use the df command as follows:


    ```

    $ df -h Display disk space usage

    Filesystem Size Used Avail Capacity Mounted on

    /dev/disk02 149Gi 88Gi 60% /

    devfs 108Ki 08Ki 100% /dev

    fdesc 1.0Ki 0Ki 100% /dev

    map -hosts 0Bi 0Bi 100% /net

    map -auto_home 0Bi 0Bi 100% /home

    ```


    This example assigned 150GB to the root partition /, which you would see as the
    Macintosh HD icon on your desktop. Right now, this particular system''s root partition
    is 60 percent full, with 60GB free.


    # Understanding File System Types


    To use Mac OS X, you can get with very few different file system types. The Hierarchical
    File System Plus (HFS+) is used by default for most disk storage needs.


    HFS+ is architecturally similar to HFS, with several improvements:'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# Chapter 7: Administering File Systems


    +   - 32 bits used for allocation blocks (instead of 16). HFS divides the disk
    space on a partition using allocation blocks. Using 32 bits for identifying allocation
    blocks results in much less wasted space (and more files) using 16 bits.


    +   - Long filenames—up to 255 characters


    +   - Unicode-based filename encoding


    +   - Attributes for both files and directories can be extended in the future
    (as opposed to being limited to a fixed size)


    +   - Largest file size is 2^63 bytes


    However, you might want to use other file system types with Mac OS X in some cases,
    including the following:


    +   - Other local operating systems: If multiple operating systems (such as Windows,
    DOS, or Linux) are installed on your hard disk, you might want to access the data
    from the partitions containing those systems (even if only to read the data).


    +   - Other media: You may have a CD, DVD, backup tape, or other media that contains
    data formatted in other file system types. Even in cases where Mac OS X can’t
    create file systems of a certain type, it may be able to mount and use those systems.


    Most of the examples in this chapter use HFS+ file systems to illustrate how a
    file is created and managed. However, Table 7-1 lists different file system types
    and describes when you want to use them.


    # Table 7-1: File System Types Supported in Mac OS X


    | File System type | Description |

    |---|---|

    | HFS+ | Preferred file system used on Mac OS X. It supports journaling, quotas,
    byte-rate locking, Finder information in metadata, multiple encodings, hard and
    symbolic links, aliases, hiding file extensions on a per-file basis, and more.
    |

    | ufs | Default file system used with FreeBSD and other BSD systems. Darwin’s
    implementation of UFS is similar to that of ''BSD, as was NEXTSTEP’s, but they
    are not readily compatible. Currently, only NetBSD supports it. |

    | mdos | DOS file systems (FAT12, FAT16, and FAT32) are supported. |

    | iso9660 | System-independent file system used on most data CDs |

    | ntfs | Microsoft’s New Technology File System (NTFS). When you needs to share
    files with most Windows systems (with dual booting or removable drives). Read-only
    support. |'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# Chapter 7: Administering File Systems


    | Table 7-1: File System Types Supported in Mac OSX (continued) |

    | File system type | Description |

    |---|---|n| udf | UDF (Universal Disk Format) is the file system used by DVD-ROM
    (including DVD-video and DVD-audio) discs, and by many CD-R/RW packet-writing
    programs. |


    Besides the file systems listed in Table 7-1, there are also what are referred
    to as network file systems. Locally, a network shared file system may be a ufs,
    ntfs, or other normal file system type. However, all or part of those file systems
    can be shared with network protocols as Samba (smbfs file system type), NFS (nfs),
    and NetWare (nwfs).


    For a good discussion of all this, please refer to www.kernelthread.com/mac/osx/arch_fs.html.


    You can use procedures in the following sections to create, manage, mount, and
    otherwise the file system types described.


    # Creating and Managing File Systems


    Mac OS X provides a default partitioning and file system scheme, but you can partition
    your system easily enough. The following sections provide details about how to
    do that.


    # partitioning hard Disks


    To repartition your system, boot from a Mac OS X install disc. Insert the install
    disc that came with your computer, and restart the computer while holding the
    C key until the system restarts and see the gray Apple icon.


    To partition your hard disk, follow these steps:


    +   1. From the Installer menu, select Open Disk Utility. In the window that opens,
    on the left, click the icon for the drive you would like to initialize or partition.

    2. To the right, click the Partition tab.

    3. In the pop-up menu under Volume Scheme; choose the number of partitions want
    to create during the initializing process.

    4. After you have chosen the number of partitions you want, adjust their sizes
    by dragging the handles that represent the partition borders.

    5. Click each of the partitions to adjust its properties. Under Volume Information,
    choose the format you''d like to use. The default option is Mac OS Extended (Journaled).'
