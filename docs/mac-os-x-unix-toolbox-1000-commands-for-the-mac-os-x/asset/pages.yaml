    # paginating Text Files with pr


    The pr command provides a quick way to format a bunch of text into a form where
    it can be printed. This can be particularly useful if you want to print the results
    of some commands without having to open a word processor or text editor. With
    pr, you can format text into pages with header information such as date, time,
    and page number. Here is an example:


    ```

    $ ls -documents | sort | pr -4 | less      Paginate ports directory in 4 cols

    ```


    In this example, the command lists the contents of the ~/documents directory and
    pipes that to the pr command, to be sorted alphabetically. Next, if piped to the
    pr command, which converts the single-column list into four columns (-4) and paginates.
    Finally, the less command enables you to page through the text.


    Instead of paging through the output, you can send the output to a file or a printer.
    Here are some examples of that:


    ```

    $ ls -documents | sort | pr -4 | less > pkg.txt      Send pr output to a file

    $ ls -documents | sort | pr -4 | less | lpr      Send pr output to printer

    ```


    Other text manipulation you can do with the pr command includes double-spacing
    the text (-d), or offsetting the text a certain number of spaces from the left
    margin (for example, -o 5 to indent five spaces from the left).


