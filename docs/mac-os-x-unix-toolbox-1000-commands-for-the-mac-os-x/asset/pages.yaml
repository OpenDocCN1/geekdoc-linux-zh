  md: '# Chapter 14: Locking Down Security


    Once you''ve saved your changes to your firewall, the ipfw command-line tool to
    get even more control over packet traffic going to your system. The command-line
    tool offers you a variety of rules for denying and allowing certain types of traffic
    on both UDP and TCP protocols.


    ![](img/d850b48b6750d726fcc813a2a895d7cc_221_0.png)


    Figure 14-3: Setting up a firewall


    Here are some commands for checking the state of your firewall:


    +   # ipfw list List the current set of firewall rules

    00100 allow ip from any to any via lo0

    00200 allow ip from any to 127.0.0.0/8


    # ipfw show Show statistics for each matching packet rule

    # ipfw -at List the current rules with statistics and timestamps

    # ipfw zero Zeros the counters so you can start with fresh statistics


    If you want to add a rule to the firewall (until the next reboot), you can run
    the ipfw command directly with the add option. You should choose a rule number
    that is appropriate for the type of rule you are establishing:


    +   # ipfw -q add 1550 allow tcp from any to 21 setup keep-state

    Allow outside connections to FTP service (port 21)

    # ipfw -q delete 1550 Delete rule number 1550


    There are many other features in ipfw for setting up and working with firewall
    rules. Refer to the ipfw man page for details.'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# Working with system Logs


    Most BSD systems are configured to log many of the activities that occur on those
    systems. Those activities are then written to log files located in the /var/log
    directory or its subdirectories. This logging is done by the Syslog facility.


    FreeBSD uses the syslog (system log daemon) as part of the basic installed system
    to manage system logging. That daemon is started automatically from the syslog
    initialization script (/etc/rc.d/syslogd). Information about system activities
    is directed to files in the /var/log directory such as messages, security, cron,
    auth. log, and others, based on settings in the /etc/syslog.conf file.


    You can check any of the log files manually (using vi or another favorite text
    editor).


    You can also send your own messages to the syslog logging facility using the logger
    command. Here are a couple of examples:


    ```

    # logger Added new video card      Message added to messages file

    # logger -p warn -t CARD -f /tmp/my.txt  Priority, tag, message file

    ```


    In the first example, the words "Added new video card" are sent to the messages
    files. In the second example, the message priority is set to info and a tag of
    CARD is added to each line in the message. The message text is taken from the
    /tmp/my.txt file that I created before running the command. To see these log entries
    in real time, use tail -f or as described in Chapter 5.


    # summary


    Although many tools are available for securing your Mac OS X system, the first
    line of security starts with securing both the user accounts and the services
    on your system.


    Because most serious security breaches from outside your organization can come
    from intruders accessing your systems on public networks, setting up secure firewalls
    is important for any system connected to the Internet. The ipfw facility is one
    of several facilities in Mac OS X that provide the firewall features you can configure
    to meet your needs.'
  merge: -1
