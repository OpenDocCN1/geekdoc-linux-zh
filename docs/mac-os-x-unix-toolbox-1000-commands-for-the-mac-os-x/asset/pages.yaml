    Semetimes the last hop looks like this:


    ```

    28 *

    29 *

    30 ***

    ```


    The lines of asterisks (*) at the end of the trace can be caused by firewalls
    that block traffic to the target. However, if you see several asterisks before
    the destination, it may indicate heavy congestion or equipment failures and point
    to a bottleneck.


    By default, traceroute uses UDP packets, which provide a more realistic performance
    than ICMP. That''s because some Internet hosts have lower priority to ICMP traffic.
    If you like to use ICMP packets, try this command:


    ```

    # traceroute -I www.google.com Use ICMP packets to trace a route

    ```


    To trace a route to a remote using TCP packets, use the -T option to traceroute:


    ```

    # traceroute -P TCP www.google.com Use TCP packets to trace a route

    ```


    By default, traceroute connects to port 80. You can set a different port using
    the -p option:


    ```

    # traceroute -P TCP -p 25 www.google.com Connect to port 25 in trace

    ```'
