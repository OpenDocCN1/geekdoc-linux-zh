  md: '# Chapter 9: Checking and Running Processes


    ```

    $ bg %1

    $ fg 1

    $ bg %1

    gimp

    <Ctrl+C>

    Start process running again in background (sh)

    Continue process in foreground (bash)

    Continue running process in foreground (sh)

    Kill process

