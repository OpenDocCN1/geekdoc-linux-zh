  md: "# Chapter 11: Managing Network Connections\n\nfaulty NICs or connections stand\
    \ out. Only the root user can send a flood of pings, or pings with byte sizes\
    \ over the default 56 bytes.\n\n# Checking address resolution protocol (arp)\n\
    \nIf you're not able to ping your gateway, you may have an issue at the Ethernet\
    \ MAC layer. The Address Resolution Protocol (ARP) can be used to find information\
    \ in the MAC layer. To view and configure ARP entries, use the arp command. This\
    \ example shows ARP listing entries in the ARP cache by hostname:\n\n```\n# arp\
    \ -a List all current ARP entries\nritchie (10.0.0.1) is at 00:10:54:ab:f6:a7\
    \ on fxp0 [ethernet]\neinstein (10.0.0.50) at 00:0b:6a:02:ec:98 on fxp0 [ethernet]\n\
    thompson (10.0.0.50) at 00:00:b7:9:5:35 on fxp0 permanent [ethernet]\n```\n\n\
    In this example, you can see the names of other computers that the local computer's\
    \ ARP cache knows about, and the associated hardware address (MAC address) of\
    \ each computer's NIC. To delete an entry from the ARP cache, use the -d option:\n\
    \n```\n# arp -d 10.0.0.50 Delete 10.0.0.50 from ARP cache\n```\n\nInstead of letting\
    \ ARP dynamically learn about other systems, you can add static entries to the\
    \ cache using the -s option\n\n```\n# arp -s 10.0.0.51 00:0b:6a:02:ec:95 Add IP\
    \ and MAC addresses to ARP\n```\n\nTo query a subnet if IP is already in use,\
    \ and to find the MAC address of the device using, use the arping command (pkg_add\
    \ -r arp). The arping can be used to check for IP conflicts before binding an\
    \ Ethernet NIC. Here are examples:\n\n```\n# arping 10.0.0.50 Query subnet to\
    \ see if 10.0.0.50 is in use\nARPING 10.0.0.50\n60 bytes from 00:0b:6a:02:ec:98\
    \ (10.0.0.50): index=0 time=9.966 msec\n60 bytes from 00:0b:6a:02:ec:98 (10.0.0.50):\
    \ index=1 time=9.930 msec\n60 bytes from 00:0b:6a:02:ec:98 (10.0.0.50): index=2\
    \ time=9.930 msec\n60 bytes from 00:0b:6a:02:ec:98 (10.0.0.50): index=3 time=9.931\
    \ msec\n* \n--- 10.0.0.50 statistics\n4 packets sent, 4 packets received, 0% unanswered\n\
    ```\n\nLike the ping, the arping command continuously queries the address until\
    \ the command is ended by Ctrl+C. Typically, you just want to know whether the\
    \ target is alive, so you can run the following:\n\n```\n# arping -c 1 10.0.0.51\
    \ Query 10.0.0.50 and stop after 2 counts\n```"
