  md: '# Chapter 8: Backups and Removable Media


    To use the tar command with bzip2 compression, use the -j option:


    ```

    $ tar cvf myfiles.tar.bz2 *.txt    Create archive, compress with bzip2

    ```


    You can also uncompress (-j) a bzip2 compressed file as you extract files (-x)
    using the tar command:


    ```

    $ tar xvf myfiles.tar.bz2    Extract files, uncompress bzip2 compression

    ```


    # Compressing with gzip


    As noted, you can use any of the compression commands alone (as opposed to within
    the command line). This example uses the gzip command to create and work with
    gzipp-compressed files:


    ```

    $ gzip myfile          gzip myfile and renames it file.gz

    ```


    The next command provides the same result but with verbose output:


    ```

    $ gzip -v myfile      gzip myfile with verbose output

    myfile: 86.0% -- replaced with myfile.gz

    $ gzip -tv myfile      Tests integrity of gzip file

    myfile.gz:           OK

    $ gzip -lv myfile      Get detailed info about gzip file

    method crc    time    uncompr. ratio uncompressed_name

    defla 027d9e4 Jul 10 04:48  46785    334045 86.0% myfile

    ```


    Use one of the following commands to compress all files in a directory:


    ```

    $ gzip -rv mydir      Compress all files in a directory

    mydir/file1: 39.1% -- replaced with mydir/file1.gz

    mydir/file2: 39.5% -- replaced with mydir/file2.gz

    $ gzip -1 myfile       Fastest compression time, least compression

    $ gzip -9 myfile       Slowest compression time, most compression

    ```


    Add a dash before a number from 1 to 9 to set the compression level. As illustrated
    previously, -1 is the fastest (least) compression and -9 is the slowest (most)
    compression. The default for gzip is level 6. The lzip command has fewer levels:
    1, 3 (the default). Compression levels for bzip2 behave differently.


    To uncompress a zipped file, you can use the gunzip command. Use either of the
    following:


    ```

    $ gunzip -v myfile.gz   Unzips myfile.gz and renames it myfile

    myfile.gz:           86.0% -- replaced with myfile

    $ gzip -dv myfile.gz     Same as previous command line

    ```


    Although the examples shown refer to zipping regular files, the same options can
    be used to compress tar archives.


    106'
