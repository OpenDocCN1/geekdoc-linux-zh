  md: '# Chapter 3: Using the Shell


    # r redirecting stdin and stdout


    Like most UNIX systems, Mac OS X supports stdin, stdout, and stderr. Standard
    input (stdin) is usually a keyboard accepting interactive commands from a user,
    but it can be a file full of commands or a separate process. Standard output (stdout)
    is usually the screen, but stdout can be redirected to a file of some sort. This
    is pretty useful if you''re redirecting a great deal of data from your initial
    command, or if the process creating the data is running constantly. Standard error
    (stderr) consists of messages that can be separated from the rest of the output.


    Let''s run a simple example to illustrate the three states. Typing in a shell
    makes it run interactively—what is termed standard input in the UNIX world. The
    resulting process has two output streams: stdout for normal command output and
    stderr for error output. In the following example, when /tmp is not found, an
    error message goes to stderr but output linking /tmp (which is found) goes to
    stdout:


    ```

    $ ls /tmp

    ls: No such file or directory

    /tmp/

    gconfd-fcaen keyring-b41WuB keyring-ItEWbz mapping-fcaen orbit-fcaen

    ```


    By default, all output is directed to the screen. Use the greater-than sign (>)
    to direct output to a file. More specifically, you can direct the standard output
    stream (using >) or the standard error stream (using 2>) to a file.


    In the following example, stdout is redirected to the file output.txt, while stderr
    is still directed to the screen:


    ```

    $ ls /tmp /tmp > output.txt

    ls: /tmp: No such file or directory

    ```


    In the next example, stderr (stream 2) is directed to errors.txt, while stdout
    goes to the screen:


    ```

    $ ls /tmp /tmp 2> errors.txt

    /tmp/

    gconfd-fcaen keyring-b41WuB keyring-ItEWbz mapping-fcaen orbit-fcaen

    ```


    In this example, the first two examples are combined:


    ```

    $ ls /tmp /tmp 2> errors.txt > output.txt

    ```


    Finally, both streams are directed to the everything.txt file:


    To append to a file instead of overwriting it, use two greater-than signs:


    ```

    $ ls /tmp >> output.txt

    ```'
