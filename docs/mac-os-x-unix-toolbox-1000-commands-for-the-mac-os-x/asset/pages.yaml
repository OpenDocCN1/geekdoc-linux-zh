    After you open a shell from the Terminal window, the shell environment is set
    up based on the user who started it. Each user''s default shell is assigned based
    on the user''s entry in /etc/passwd file. By default, the user''s shell is set
    to bash (/bin/bash). Examples in this section use the bash shell.'
