  md: '# Introduction


    Mac OS X UNIX Toolbox is loosely based on the BSD UNIX Toolbox written by Chris
    Negus and François Caen. When I was asked by Wiley to extend what they had done
    into the world of Mac OS X, I heartily agreed to do so, because the original was
    such an excellent resource.


    From the very beginning, I decided to keep the spirit and structure of the original
    title as much as I could. Frankly, about 90 percent of what you experience UNIX-wise
    on Mac OS X is the same as BSD or Linux environments, so I was able, for the most
    part, to abide by this agreement. In some cases, though, I had to nip and tuck
    a few sections; in others, I had to add a bit back.


    At the end of the day, what you hold is a handbook with more than 1,000 specific
    command lines to help you become a Mac OS X power user. Whether you are a systems
    administrator or desktop user, the book will show you how to create file systems,
    troubleshoot networks, lock down security, and dig out almost anything you care
    about your Mac OS X system.


    Of course, Mac OS X being it is, not everything in this book is about the command
    line (although most of it). In some cases, I show you not only how to do things
    on the venerated command line, but also how to take advantage of the Mac OS X
    GUI. Either way, you learn how to leverage UNIX to do your job.


    # Who Should Read This Book


    This book is for anyone who wants to access the power of a Mac OS X system as
    a systems administrator or user. You may be a free and open-source software (FOSS)
    enthusiast, a UNIX professional, or possibly a computer professional who is finding
    the Windows systems in your data center supplanted by BSD, Linux, and Mac OS X
    systems.


    The bottom line is that you want to find quick and efficient ways of getting Mac
    OS X systems working at peak performance. These may be a few desktop systems at
    work, a file and print server at your school, or a home web server that you''re
    setting up most for you.


    In the best case, you should already have some experience with BSD, Linux, or
    other UNIX-like systems. However, if you are a computer professional with skills
    managing other types of operating systems, such as Windows, you should be able
    to leverage your knowledge and use the specific commands covered in the book.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Introduction


    # What This Book Covers


    I assume that you''re new to Mac OS X, but that you''re coming to that platform
    from some other UNIX platform, such as Linux or BSD. In other words, I assume
    that you know something about the command line, but don''t know the Mac OS X Way.
    I will show you that way, pointing out how to the shell, how to run commands,
    and how things (of which you may take for granted) have changed from one flavor
    of UNIX (i.e., the one you''re used to) to Mac OS X''s favor of UNIX. The book
    will supplement that knowledge with information you need to do for the following
    activities:


    +   Get software—Mac OS X can be extended using various package managers. Using
    these package managers, you can install both binary packages and source code.
    I will introduce you to Fink, which you''ll use to find, download, install, and
    manage software from the command line.


    +   Access applications—Find what''s available from the Mac OS X distribution.


    +   Use the shell—Find neat techniques and tips for using the shell.


    +   Play with GUI tools—Use the command-line options to run products such as iTunes,
    TextEdit, and Safari.


    +   Work with files—Use, manipulate, convert, and secure a wide range of file
    types that exist in Mac OS X.


    +   Administer file systems—Access, format, partition, and monitor your file storage
    hardware (hard disks, CD/DVD drives, floppy disks, USB flash drives, and so on).
    Then create, format, and check the files that exist on those hardware devices.


    +   Back up and restore data—Use simple commands to gather, archive, and compress
    your files into efficient backup archives. Then store those archives locally or
    on remote computers.


    +   Work with processes—List running processes in various ways, such as CPU use,
    process use, or process ID. Change running processes to have them in the background
    or foreground. Send signals to processes to have reread configuration files, stop
    and resume processing, or stop completely (abort).


    +   Manage the system—Run commands to check system resources, such as memory usage,
    run levels, and more.


    +   Monitor networks—Bing and wired network connections up and down. Check routing,
    DNS, and host information. Keep an eye on network traffic.


    +   Get network resources—Connect to UNIX and Windows remote file systems using
    FTP, NFS, and Samba families.


    +   Do remote administration—Access and administer other computers using remote
    login (ssh, telnet, and so on) and screen. Learn about remote administration interfaces,
    such as SWAT and CUPS.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Introduction


    +   - Lock down security—Set up firewalls and system logging to secure your Mac
    OS systems.


    +   - Get reference information—Use the appendixes at the end of this book to
    get more information about the shell (such as metacharacters and shell variables)
    and personal configuration files.


    If you''ve done it right, it will be easier to use this book than to Google for
    the commands or GUI tools you need.


    After you''ve mastered many of the features described in this book, you''ll have
    gained the following advantages:


    +   - Hundreds of commands—By compressing a lot of information into a small space,
    you will have access to hundreds of useful commands, in over 1,000 lines, in a
    handy form to carry with you.


    +   - Transferable knowledge—Most of the same commands and options you use in
    Mac OS X systems will work exactly the same way on UNIX-like systems. Different
    UNIX systems, however, offer different graphical administration tools; and even
    within a particular distribution, graphical tools change more often than commands.


    +   - Quick problem solving—By the time you have started up a desktop and launched
    a graphical administration tool, you will have already run half dozen commands
    and solved the problem.


    +   - Enduring value—Many of the commands described in this book were used in
    early UNIX systems, so you are gaining tools that reflect the experience of computer
    experts for more than 30 years.


    The full documentation for commands used in Mac OS X systems consists of thousands
    of man pages, info text, and messages, you will surely want to reach beyond the
    pages of this book from time to time. Luckily, Mac OS X and UNIX systems include
    helpful information installed on the system itself. Chapter 1 contains descriptions
    of how to access this information, which is probably already installed, or can
    be easily installed, on your system.


    # How This Book Is Structured


    This book is neither a reference book (with alphabetically listed contents) nor
    a guide (with step-by-step procedures for doing tasks). Instead, the book is organized
    by topic, and includes the most useful commands and options you will likely work
    with.


    Chapter 1 provides you with a basic understanding of what Mac OS X is and how
    it relates to the operating systems that are derived from BSD, such as FreeBSD,
    NetBSD, and OpenBSD. Then it describes some of the vast resources to support your
    experience with this book, such as man pages, info material, and help text. Chapter
    2 provides a quick overview of the Mac OS X environment and how you can set it
    up'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Introduction


    to get easy access to UNIX tools. It also includes a quick introduction to Fink,
    a package manager that will enable you to install additional tools mentioned in
    this book.


    Chapters 3, 4, 5, and 6 describe commands that a regular user may find useful
    on Mac OS systems. Chapter 3 describes tools for using the shell, Chapter 4 commands
    for working with files, and Chapter 5 describes how to manipulate text. Chapter
    6 walks you through more advanced scripting and introduces AppleScripting.


    Starting with Chapter 7, we get into topics relating to system administration.
    Creating and checking file systems is covered in Chapter 7, while commands for
    data backups are described in Chapter 8. Chapter 9 explains how to run processes,
    and Chapter 10 describes administrative tools for managing basic components, such
    as hardware modules, CPU use, and memory use.


    Chapter 11 brings the chapters devoted to managing network resources by how to
    set up and work with network interfaces. Chapter 12 covers text-based commands
    for file transfer, sharing, and e-mail. For tools for doing system administration
    are introduced in Chapter 13.


    Chapter 14 covers how to lock down security, using features like firewalls and
    logging. Following that are six appendices that provide additional reference information
    for text editing, shell features (metacters and variables), personal configuration
    files, AppleScript commands, a quick Perl primer, and some interesting packages
    available via Fink that you might want to explore.


    # What You Need to Use This Book


    This is definitely not a book you curl up with on your next vacation. Or is not
    meant to entertain you. Throughout, I fully expect you to be sitting in front
    of a Mac OS X, scratching your head with one hand and holding this book in the
    other, looking for a solution.


    In other words, the book is meant to be a companion as you work on a problem related
    to Mac OS X. You''ll probably be working on a desktop system at home or work,
    but a fair number of you will be working on a file, web, or print server running
    Mac OS X.


    All the commands in this book have been tested against a 64-bit x86 system running
    Mac OS X 10.5 (Leopard). Specifically, I''m running a MacBook Pro. My technical
    editor checked everything on a MacBook Pro (running Mac OS X 10.5) primarily,
    but he also used a MacBook (running Mac OS X 10.5) and (once) a PowerMac (running
    Mac OS X 10.4).


    I assume that you''re running Leopard, and don''t despair if you''re on Tiger,
    as much of what is covered here also pertains to that earlier release. In addition,
    please note that nearly every command available from the shell has been around
    for a long time'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Introduction


    (some dating back more than 30 years to the original UNIX days), and will most
    work exactly as described here on NetBSD, OpenBSD, and other derivative systems,
    regardless of CPU architecture.


    Furthermore, many of the commands described in this book will also work on other
    UNIX and Linux systems. Because this book focuses on Mac OS X, descriptions will
    differ from other UNIX-like systems most prominently in the areas of packaging,
    installation, and GUI administration tools.


    # Conventions


    To help you get most from the text and keep track of what''s happening, we''ve
    used a number of conventions throughout the book. In particular, we have created
    styles for showing commands that allow us to fit as many command lines as possible
    in the book.


    With command examples, command output (shell prompts and messages) is shown in
    regular monospaced font, computer input (the stuff you type) is shown in bold
    monospace font, and a short description (if included) appears in italics. Here
    is an example:


    ```

    $ 1 *jpg List all JPEG files in the current directory

    hat.jpg

    dog.jpg

    ...

    ```


    To save space, output is sometimes truncated (or skipped altogether). Three dots
    (...) are used to indicate that additional output was cut. If a command is particularly
    long, backslashes will appear at the end of each line to indicate that input is
    continuing to the next line, as shown here:


    ```

    $ oggenc NewSong.wav -o NewSong.ogg \

    -a Bernstein -G Classical \

    -d 06/15/1972 -t "Simple Simple" \

    -1 Bernsteins Mass \

    -c info="From Kennedy Center"

    ```


    In the preceding example, you can type the backslashes to have all information
    included in the single command; or can simply put all the information on a single
    line (excluding the backslashes). Note that command prompts are shown in one of
    two ways:


    ```

    $ Indicates a regular user prompt

    # Indicates the root prompt

    ```


    As noted, when a dollar sign ($) appears, any user can run the command. With a
    pound sign prompt (#), you probably need to be the root user in order for the
    command to work.'
