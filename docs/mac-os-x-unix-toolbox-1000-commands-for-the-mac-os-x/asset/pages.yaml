  md: '# Personal Configuration Files


    In the home directory of every user account is a set of files and directories
    containing personal settings for that account. Because most configuration files
    and directories begin with a dot (.), you don''t see them if you open a folder
    window to your home directory. Likewise, you typically need the -a option to ls
    to see those files when you list directory contents.


    This appendix describes many of the dot files each user can work on a Mac OS X
    system. After creating configuration files you like, you can, where appropriate,
    do such things as save them to /usr/share/skel (so every new user gets them) or
    save them if the user account moves to another machine.


    > Note Some of the files described in this appendix won''t exist until you start
    the application associated with the file or create the files manually.


    **Bash files:** Home directory files for storing and changing bash settings includes
    the following:


    +   - .bash_profile: Commands added to this file are executed when you invoke
    bash as a login shell or use bash as your default shell.


    +   - .bashrc: Commands added to this file are executed when you start a bash
    that is not a login shell, and your default shell is not bash. (To have .bashrc
    sourced on login when your default shell is set to bash, add the following line
    to .bash_profile: test -f ~/.bashrc && . ~/.bashrc.)


    +   - .bash_logout: Commands added to this file are executed when you log out
    from a bash shell.


    +   - .bash_history: Stores a history of commands run by the user from a bash
    shell.'
  merge: -1
  pgno: 236
