  md: '# Chapter 11: Managing Network Connections


    # Checking Connectivity to a host


    When you have a link and no duplex mismatch, the next step is to ping your default
    gateway. You should have configured the default gateway (gw), whether you did
    that manually or set it automatically by DHCP when the network started. To check
    your default gateway in the actual routing table, use the route command to find
    a host on the other side of that gateway as follows:


    ```

    # route get.example.com

    route to: www.example.com

    destination: default

    mask: default

    gateway: 10.0.0.1

    interface: en0

    flags: <UP,GATEWAY, DONE, STATIC>

    recvpipe sendpipe rtt,msec  rttvar hopcount mtu expire

    0 0 0 0 1500 0

    ```


    The gateway for today is 10.0.0.1. To ensure that there is IP connectivity to
    that gateway, use the ping command as follows:


    ```

    $ ping 10.0.0.1

    PING 10.0.0.1 (10.0.0.1) 56 bytes

    64 bytes from 10.0.0.1: icmp_seq=0 ttl=64 time=1.43 ms

    64 bytes from 10.0.0.1: icmp_seq=1 ttl=64 time=0.382 ms

    64 bytes from 10.0.0.1: icmp_seq=2 ttl=64 time=0.313 ms

    64 bytes from 10.0.0.1: icmp_seq=3 ttl=64 time=0.360 ms


    ---

    10.0.0.1 ping statistics

    4 packets transmitted, 4 received, 0% packet loss

    round-trip min/avg/max/stddev = 0.313/0.621/1.432/0.469 ms

    ```


    > Some hosts are configured to ignore ping requests, so not getting a reply doesn''t
    indicate that the host or gateway is down.


    By default, ping continues until you press Ctrl+C. Other ping options include
    the following:


    ```

    $ ping -a 10.0.0.1          Add an audible ping as ping progresses

    $ ping -c 4 10.0.0.1         Ping 4 times and exit (default in Windows)

    $ ping -c 5 10.0.0.1        Show number of pings (works with -c)

    $ ping -f 10.0.0.1           Send a flood of pings (must be root)

    $ ping -i 3 10.0.0.1         Send packets in 3-second intervals

    $ ping -s 1500 10.0.0.1    Set packet size to 1500 bytes (must be root)

    PING 10.0.0.1 (10.0.0.1) 1500 data bytes

    ```


    Use the ping flood option with caution. Large packets (such as the 1,500-byte
    setting shown) are good to make'
  merge: -1
