  md: '# Chapter 12: Accessing Network Resources


    # # Chatting with Friends in Ir C


    Despite the emergence of instant messaging, Internet Relay Chat (IRC) is still
    used by a lot of people today. freenode.net has a ton of chat rooms dedicated
    to supporting major open-source software projects. In fact, many people stay logged
    in all day and just watch the discussions of their favorite UNIX projects scroll
    by, a behavior known as lurking.


    The xchat utility is a good graphical, multi-operating system IRC client (install,
    type install xchat). Once the xchat package is installed, double-click its icon
    in the Applications folder. The elite way to use IRC is to run a text-mode client
    in screen on an always-on machine, like an old server. Another simple option is
    to use an IRC proxy client, also known as a bouncer, such dproxy.


    The original IRC ircii allowed the addition of scripts—in some ways similar to
    macros in production varieties—that automated some of the commands and increased
    usability. The most popular was PhoenixX by Vasso. Then came BX, which started
    as an ircii script and became a full-blown client. Today, most people use irssi.
    To install and launch irssi from Mac X, type the following:


    ```

    # install irssi

    $ irssi -n JayJao200x

    ```


    In this example, the username (name) is set to JayJao200x (you should choose your
    own, of course). You will see a blue status bar at the bottom of the screen indicating
    that you are in Window 1, the status window. IRC commands are preceded with a
    /. For example, to connect to the freenode server, type the following:


    ```

    /connect chat.freenode.net

    ```


    If you don''t add your username on the command line, you are connected to freenode.net
    under the username you are logged in. On IRC, a chat is called a channel and has
    a pound sign (#) in front of the name. Next, try joining the #freebsd channel:


    ```

    /join #freebsd

    ```


    Your screen should look similar to the one in Figure 1-2.


    You are Switch among the irssi windows by typing Alt+1, Alt+2, and so on (Ctrl+N
    and Ctrl+P). To get help at any time, type /help. To get help for a command, type
    /help command, where command is the name of the command for which you want more
    information. Help text will output in the status window, not the current window.


    To add to the IRC, type a simple message and press Enter to send a message to
    those in the channel. Type /part to leave a channel. Type /quit to exit the program.'
