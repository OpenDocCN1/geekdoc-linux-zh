  md: '# Chapter 13: Remote System Administration


    # Using screen: a Rich Remote Shell


    The ssh command gives you only one screen. If you lose that, you lose all you
    were doing on the remote computer. That can be very bad if you were in the middle
    of something important, such as a 12-hour compile. In addition, if you want to
    do three things at once, such as vi http.conf, tail -f error_log, service http
    reload, you need to open three ssh sessions.


    Essentially, screen is a terminal multiplexer. If you are a system administrator
    working on remote servers, screen is a great tool for managing a remote computer
    with only a command-line interface. Besides allowing multiple shells sessions,
    screen also enables you to disconnect from it and reconnect to that same screen
    later.


    The screen software package is available for Mac OS via fink. To create and install
    the screen package, type the following from the Mac OS server on which you want
    to use screen:


    ```

    # fink install screen

    ```


    To use screen, run the ssh command from a client system to connect to the BSD
    server where screen is installed. Then simply type the following command:


    ```

    $ screen

    ```


    If you run screen from a Terminal window, after you see the license message press
    Enter and you should see a regular bash prompt in the window. To control screen,
    press the Ctrl+A key combo, followed by another keystroke. Ctrl+A followed by
    ? (Ctrl+A, ?) displays the help screen. With screen running, there are some commands
    and control keys you can use to operate screen.


    ```

    $ screen -ls                          List active screens

    There is screen on:

    7089.pts-2.myserver (Attached)      Shows screen is attached

    1 Socket in /var/run/screen/S-kafka.

    $ Ctrl+A, A                         Change window title

    Set window''s title: My Server      Type a new title

    $ Ctrl+A, C "                        Show active window titles

    Num Name             Flags               Up/down arrows change

    0 My Server

    windows

    1 bash

    $ Ctrl+A, Ctrl+D                    Detach screen from terminal

    $ screen -ls                       List active screens

    There is screen on:

    7089.pts-2.myserver (Detached)      Shows screen is detached

    1 Socket in /var/run/screen/S-kafka.

    ```'
