  md: "# Chapter 11: Managing Network Connections\n\nTypically, DNS entries are added\
    \ automatically from a DHCP server on Mac OS X.\nThat information is stored in\
    \ the /etc/resolv.conf file. It looks something like\nthe following:\n\n```\n\
    nameserver 11.22.33.44\nnameserver 22.33.44.55\n```\n\nThe preceding numbers are\
    \ replaced by real IP addresses of computers that serve\nas DNS name servers.\
    \ When you can connect to working DNS servers, you can use\ncommands to query\
    \ these servers and look up host computers.\n\nYou can use the dig command (which\
    \ should be used instead of the deprecated\nslookup command) to look up information\
    \ from a DNS server. The host command\nbe used to look up address information\
    \ for a hostname or domain name.\n\nTo search your DNS servers for a particular\
    \ hostname (in the examples www.example\ncom), use the dig command as follows:\n\
    \n```\n$ dig www.example.com Search DNS servers set in /etc/resolv.conf\n <<>>\
    \ DIG 9.4-P2 << www.example.com\n;; global options: printcmd\n;; Got answer:\n\
    ;>>HEADER-- opcode: QUERY, status: NOERROR, id: 28730\n;;; flags: rd; QUERY: 1,\
    \ ANSWER: 5, AUTHORITY: 0, ADDITIONAL: 0\n;; WARNING: recursion requested but\
    \ not available\n```\n\n```\n; QUESTION SECTION:\n;www.example.com.      IN A\n\
    ```\n\nInstead of using your assigned name server, you can query a specific name\
    \ server. This\nis useful if you believe that your name server is not resolving\
    \ the address of a par-\nticular properly and you want to check different servers\
    \ to see how the name\nresolves. The following example queries the DNS server\
    \ at 1.1.2.5:\n\n```\n$ dig www.example.com 1.1.2.5\n```\n\nUsing dig, you can\
    \ also query for a specific record type:\n\n```\n$ dig example.com mx  Queries\
    \ for the mail exchanger\n$ dig example.com ns Queries for the authoritative name\
    \ servers\n```\n\nUse +trace option to trace a recursive query from the top-level\
    \ DNS servers down to\nthe authoritative servers:\n\n```\n$ dig +trace www.example.com\
    \  Recursively trace DNS servers\n```"
