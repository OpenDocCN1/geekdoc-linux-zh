  md: '# Chapter 6: Advanced Scripting


    Using the open command on a file will open that file in its default editor. For
    example, the following command will open an HTML file in Safari:


    ```

    open test.html

    ```


    You can, of course, redirect the application with the -a switch. To open the same
    HTML file in BBEdit, simply edit the command:


    ```

    open -a BBEdit test.html

    ```


    Please remember that Mac OS X is case neutral, adjusting the case of an application''s
    name also works equally well:


    ```

    open -a bedit test.html

    ```


    To force a file to be opened by TextEdit, use -e:


    ```

    open -e test.html

    ```


    You can open multiple files at once using wildcards (see Figure 6-6). The following
    example opens various .php files with TextEdit:


    ```

    open -e *.php

    ```


    ![](img/d850b48b6750d726fcc813a2a895d7cc_113_0.png)


    If you already have an application window open, use the -n switch to open a new
    application instance:


    ```

    open -e -n test2.html

    ```'
