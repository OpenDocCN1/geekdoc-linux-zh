  md: '# EXPLORE A TON OF POWERFUL MAC OS X UNIX COMMANDS


    This handy, compact guide teaches you to use Mac OS X UNIX systems as the experts
    do: from the command line. Try out more than 1,000 commands to find and get software,
    monitor system health and security, and access network resources. Apply the skills
    you learn from this book to troubleshoot networks, lock down security, and uncover
    almost anything you care to know about your Mac OS X system.


    # Expand your Mac OS X UNIX expertise in these and other areas:


    +   * Using the shell

    * Finding online software

    * Working with files

    * Playing with music and images

    * Administering file systems

    * Backing up data


    +   * Checking and managing running processes

    * Accessing network resources

    * Handling remote system administration

    * Locking down security


    Christopher Negus served for seven years on development teams for the UNIX operating
    system at the AT&T labs, where UNIX was created and developed. He also worked
    with Novell on Unix and UnixWare development. Chris is the author of the bestselling
    Fedora and Red Hat Linux series, Linux Toy II, Linux Troubleshooting Bible, and
    Linux Book 2008 Edition. He now works as a trainer for Hat Enterprise Linux, and
    RHEL certified.


    Francis Caen hosts and manages business application infrastructures through his
    company Turbosphere LLC. As an open-source advocate, he has lectured on OS network
    management and Internet services, and served as the Tacoma Linux User Group. He
    is a Hat Certified Engineer (RHCE).


    Thomas Myer is a consultant, speaker, and writer. He has become closely involved
    with various aspects of Mac OS X and iPhone programming. He has switched his entire
    development business to Mac-based systems.


    ![](img/d850b48b6750d726fcc813a2a895d7cc_290_0.png)


