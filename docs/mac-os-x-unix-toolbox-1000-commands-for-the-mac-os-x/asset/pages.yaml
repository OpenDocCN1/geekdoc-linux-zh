    # Locating Files with find


    Before the days of locate, the way to find files was with the find command. Although
    locate will come up with a faster,, find has many other options for finding files
    based on attributes other than the name.


    +   - noTe Searching the entire file system can take a long time to complete.
    Before searching the whole file system, consider searching a subset of the file
    system or excluding directories or mounted file systems.


    This example searches the root file system/) recursively for files named wlan:


    ```

    $ find -name "wlan_wep.ko" -print

    find: /tmp/man/4 Permission denied

    find: /usr/local/etc/samba: Permission denied

    find: /usr/share/man/man4/wlan_wep.4.gz

    usr/usr/share/man/cat4/wlan_wep.4.gz

    boot/kernel/wlan_wep.ko

    ```


    Running find as a normal user can result in long lists of Permission denied tries
    to enter a directory where you do not have permissions. You can filter out the
    inaccessible directories:


    ```

    $ find -name wlan_wep.ko 2>&1 | grep -v "Permission denied"

    ```


    Or, you can send all errors to the /dev/null bit bucket:


    ```

    $ find -name wlan_wep.ko 2 > /dev/null

    ```


    Because searches with find are sensitive and must match the name exactly (e100.ko)
    won''t match, you can use regular expressions to make your searches more inclusive.
    Here''s an example:


    ```

    $ find -name "wlan_wep*" 2 /dev/null

    boot/kernel/wlan_wep.ko

    boot/GENERIC/wlan_wep.ko

    usr/share/man/man4/wlan_wep.4.gz

    ```


    You can also find files based on timestamps. The following command line finds
    files in / /usr/bin/ that have been accessed in the past two minutes:


    ```

    $ find /usr/bin/- -amin -2

    ```'
