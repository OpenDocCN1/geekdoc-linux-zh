  md: '# 3


    # Using the Shell


    The use of a shell command interpreter (usually just called a shell) dates back
    to the early days of the first UNIX systems. Besides their obvious use of running
    commands, shells have many built-in features such as environment variables, aliases,
    and a variety of functions for programming.


    There are several different shells to choose from Mac OS X systems. In the past,
    `tcsh` was used as the default. More recently, the Bourne Again Shell (`bash`)
    has been the default.


    This chapter offers information that will help you use many UNIX shells, in general,
    and the bashbash shell, in particular.


    | In This Chapter |

    | Assessing the shell |

    | Using the shell |

    | Acquiring super powers |

    | Using environmental variables |

    | Creating simple shell scripts |


    # Terminal Windows and Shell Access


    The most common way to access a shell from a Mac OS X graphical interface is using
    a Terminal window. To open a Terminal window from Mac OS X, open the Applications
    folder and select Utilities Terminal. This opens a Terminal window, displaying
    a bash shell prompt. Figure 3-1 shows an example of a Terminal window.


    The commands in Figure 3-1 illustrate that the current shell is the bash (/bin/bash),
    the current user is the desktop user who launched the window (myerman), and the
    current directory is that user''s home directory (/Users/myerman) (myerman) and
    the shell (bash) appear in the title bar.


    The Terminal window not only enables you to access a shell; it also has controls
    for managing your shells. For example, click Shell New Tab Basic to open another
    shell on a different tab, click Shell New'
