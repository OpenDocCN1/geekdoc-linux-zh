    # Shell Scripting on Mac OS X


    You got a taste in Chapter 3 of what shell scripts are about. At its most basic,
    a shell script is nothing more than a series of commands that have been saved
    into an executable file.


    For example, if you are monitoring the server load on a particular machine, you
    might use the uptime command, like:


    ```

    uptime

    14:28 up 2 days, 40 mins, 2 users, load averages: 0.08 0.51 0.82

    ```


    The response is fairly expected—current time, how the machine has been up, how
    many users are connected to it, and load averages over the past 1, 5, and 15 minutes.


    What if this output is too much for your purposes? What if all you wanted was
    the current time and the one-minute load average? That''s'
  merge: -1
