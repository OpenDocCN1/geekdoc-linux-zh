  md: '# Chapter 2: New to Mac OS X?


    technologies called Darwin, form the foundation of the UNIX experience on Mac
    OS X. By itself, Darwin is not Mac OS X, because it lacks some of the proprietary
    pieces that make the Mac OS experience different from other UNIX variants (such
    as the Aqua interface, Carbon, Cocoa, OpenGL, Quartz, as well as QuickTime, the
    iLife suite, Safari, and the Xcode development environment, to name a few).


    The Mac OS X kernel is xnu, which consists of a Mach-based core, an object-oriented
    runtime environment, and a BSD-based operating system. Mac provides critical low-level
    services, most of which are transparent to applications and users. For example,
    it handles hardware abstraction, process management, preemptive multi-tasking,
    virtual memory management, kernel debugging, console I/O, and more.


    We won''t devote the BSD side of the equation here, as the rest of the book is
    largely devoted to many of the commands and structures inherent in that operating
    system. For now, suffice to say that there are enough similarities to bring most
    knowledgeable users quite a bit of comfort. The rest of this chapter covers some
    of the differences.


    # Finding terminal and Utilities


    In Chapter 3, you''ll be working with Terminal, which is the utility you use to
    get to a command prompt. Right now, though, you''ll notice there''s no intuitive
    way to find Terminal. There''s no shortcut on your desktop, no icon on your Dock,
    or anything that points the way to a Terminal prompt. We''re going to correct
    that right now.


    Open a Finder and double-click the Macintosh HD item in the navigation pane, as
    shown in Figure 2-1.


    Next, double-click the Applications folder on the right. Scroll down to the Utilities
    folder under Applications and double-click to open the screen shown in Figure
    2-2.


    Finally, double-click the Terminal icon shown in Figure 2-2 to open the Terminal
    application window, shown in Figure 2-3.


    The Terminal application window is now in your Dock, but who wants to repeat a
    long series of steps each time, especially when you consider you''ll likely be
    using Terminal as a UNIX geek?


    Not to worry, it''s very simple to add Terminal to the Dock. Simply control-click
    (or right-click if you have a multi-button mouse) the Terminal icon and select
    Keep in Dock from the contextual menu, as shown in Figure 2-4. This will keep
    Terminal at your fingertips.


    Here''s another handy trick: Add the entire Utilities folder to your Dock as a
    stack of items. Simply Drag the Utilities folder from Finder to the right-hand
    side of your Dock and drop it on the. You can then click the stack to reveal shortcuts
    for every item in the Utilities folder (see Figure 2-5).'
