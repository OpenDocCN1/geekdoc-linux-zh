  md: '# Chapter 4: Working with Files


    processes, you can create named pipes or sockets. Named pipes are typically used
    for interprocess communication on the local system, whereas sockets can be used
    for processes to communicate over a network.


    Named pipes and sockets are often set up by applications in the /tmp directory.
    There are some examples of named pipes and sockets:


    ```

    $ ls -l /tmp/.TV-chris/vtftime-local /.X11-unix/X0

    prw---- 1 chris chris Sep 26 2020 /tmp/TV-chris/vtvtifo-local

    ssrwx---- 1 chris wheel Sep 4 01:30 /tmp/fam-chris/fam-

    ```


    The first list is a named pipe set up by a TV card player (the note p at the beginning
    indicating named pipe). The second list is a socket set up for interprocess communications.


    To create your own named pipe, use the mkfifo command as:


    ```

    $ mkfifo mypipe

