    When you are done using top, type q to exit.


    # Finding and Controlling processes


    Changing a running process first finds the process you want to change, and then
    modifying the processing priority or sending the process signal to change its
    behavior. If you are looking for a particular process, you might find it tough
    to locate in a long list of processes output by ps or top.


    The pgrep command allows searching through your active processes for the ones
    you are looking for. The renice command enables you to change the processing priority
    of running processes. The kill, killall and killall commands enable you to send
    signals to running processes (including signals to end those processes).


    # Using grep and pgrep to Find processes


    In its most basic form, you can use grep to search for a command name (or part
    of one) and produce the process ID of any process that includes that name, as
    shown in the following example:


    ```

    $ ps | grep http              Show info for any process including ''http'' string

    myerman    19416    0.0   112568    988  ?   S   3:46PM   00:00.00  /

    Applications/MAMP/Library/bin/httpd -k start

    ```


    If you need more control over finding processes, you can download protools from
    sourceforge.net/projects/protools. The protools package will give you the pgrep
    command-line tool.


    In its most basic form, you can use pgrep to search for a command name (or part
    of one) and produce the process ID of any process that includes that name, as
    shown in this example:


    ```

    $ pgrep init               Show PID for any process including ''init'' string

    2617

    ```'
