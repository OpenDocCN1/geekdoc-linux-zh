  md: '# Appendix F: Perl Primer


    # extending the sript


    As a fond farewell, I will pose two challenges for you to explore on your own.
    The first challenge isn''t a true challenge at all, just a simple puzzle. The
    second is a bit harder.


    In true Perl fashion, either of these challenges can be answered in any number
    of ways. There are no right or wrong answers, but the way you attack them will
    certainly give everyone a clue as to what kind of Perl coder you are:


    +   - The first challenge is really simple. How would you redirect output of the
    preceding script to something other than the Terminal screen? For example, to
    a log file? I can think of at least two ways to do this. Can you figure them out
    or come up with other ways?


    +   - The second challenge is a bit more complex, and will take you more time.
    Right now the script only processes the links on a single page. How would you
    rewrite the script to handle an entire site? Remember that you only want to process
    links that stay on the same site or domain where you started—no sense in writing
    a bot that jumps out to the Internet


    I''ve written an advanced script that spiders an entire site. If any of you want
    that script, simply send an email to tom@tripledledogs.com.


    Happy Perl coding, and thanks for reading this book!'
