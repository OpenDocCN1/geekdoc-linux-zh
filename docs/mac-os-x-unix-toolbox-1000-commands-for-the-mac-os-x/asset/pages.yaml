  md: '# Chapter 1: Starting with UNIX on Mac OS X


    Because you''re not a beginner with Mac OS X, you won''t see a lot of screenshots
    of windows, icons, and menus. What you will see, however, is the quickest path
    to get the information you need in order to use UNIX on Mac OS X to its fullest
    extent.


    If this sounds useful to you, please read on.


    # about FreeBSD D, netBSD D, and OpenBSD D


    Mac OS X is a modern operating system that combines the power of a UNIX-based
    operating system and the simplicity and elegance of the Macintosh UI. This open-source
    code, here called Darwin, is a direct descendant of various BSD projects. It is
    based in part on BSD 4.4 Lite, but many libraries and utilities are from FreeBSD
    and NetBSD. Because of this history, it''s useful to delve into the history of
    BSD.


    In the early 1970s, AT&T released the UNIX source code to several colleges and
    universities, allowing them to begin changing, adapting, and improving that code
    as they pleased. That decision has led to the development of every free and open-source
    software operating system today, not the least of which are the systems based
    on the Berkeley Software Distribution (BSD).


    The twists history of BSD is easy to Google, if you care to learn the details.
    For your purposes, here are the highlights:


    +   - BSD as a set of software add-ons to AT&T''s Sixth Edition.

    - Over the years, BSD developers split off on their development path, rewriting
    software with the intent of replacing all AT&T copyrighted code.

    - In the early 1990s, AT&T''s UNIX System Laboratories sued BSD developers (Berkeley
    Software Design, Inc.) for copyright infringement.

    - Although the lawsuit was eventually settled (with only a few files needing to
    be changed from the BSD code), the Linux operating system was able to become a
    leader of open-source software development while questions surrounding how free
    BSD was th out.

    - In 1995, the final version of BSD from Berkeley was released under the name
    4.4BSD-Lite, release 2. Today''s BSD operating systems, including FreeBSD, NetBSD,
    and OpenBSD, are all based to some extent on 4.4BSD-Lite.


    Operating systems have a well-earned reputation for stability and security. BSD
    was developed at a time when computing resources (disk space, network bandwidth
    and memory) were meager by today''s standards, so BSD systems were operated by
    efficient commands, instead of the bloated applications and dumbed-down graphical
    interfaces often seen today.


    Because of the nature of BSD systems, people running those systems required a
    high level of expertise. When simplified graphical user interfaces on the X Window
    System began to appear, to effectively operate a BSD system you still needed'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Chapter 1: Starting with UNIX on Mac OS X


    to know about such things as kernels, device drivers, modules, and daemons. Because
    security comes before use, a BSD expert would need to know how to deal with the
    fact that many features you might not be installed or are turned off by default.


    If you are someone who has used Linux, transitioning to a BSD system shouldn''t
    be too hard. However, BSD systems tend to behave like a bit more like UNIX systems
    than they do Linux. Many interfaces are text-based, offering a lot of power if
    you know what you are doing. Despite that fact, however, all the major desktop
    components there, for example, you get with the GNOME desktop environment are
    available with BSD systems, so you don''t have to live on the command line.


    Here is a list of popular BSD-operating systems still being developed today:


    +   - FreeBSD (www.freebsd.org) is the most popular of the BSD operating system
    distributions. It can be operated as a server, workstation, or desktop system,
    has also been used in network applications and special-purpose embedded systems.
    It has a reputation for maximum performance.


    +   - NetBSD (www.netbsd.org) has a reputation for being very portable, with versions
    of NetBSD running as an embedded system on a variety of hardware. NetBSD can run
    on anything from 32-bit and 64-bit PCs to digital assistants (PDAs) to VAX mincomputers.


    +   - OpenBSD (www.openbsd.org) is a popular system for network servers, although
    it can operate as a workstation or network appliance well. The goal of OpenBSD
    is to maintain security. Unlike FreeBSD and NetBSD, which are covered under the
    BSD license, OpenBSD is covered under under the more Internet Systems Consortium
    (ISC) license.


    +   - DragonFly BSD (www.dragonbsd.org) was originally based on FreeBSD. Its goal
    was to develop technologies from FreeBSD in such areas as symmetric multiprocessing
    and concurrency. Therefore, the focus has been on expanding features in the kernel.


    Other free (in no cost, as we are free to do what you like with the code) operating
    systems based on include Darwin (on which Mac OS is based) and the desktop-oriented
    systems PC-BSD and Desktop.BSD is a live CD system. Proprietary operating systems
    that have derived from BSD include:


    +   - Mac OS X (www.apple.com/macos) is produced by Apple, Inc., and is focused
    on providing an easy-to-use graphical interface to sell its line of computers.
    There is also a Mac OS X server available. Although Mac OS X was originally based
    on Darwin, it is considered a closed-source operating system with open-source
    components.


    +   - SunOS (www.sun.com) was developed by Sun Micros and was very popular as
    a professional workstation system. Sun stopped development of SunOS in favor of
    Solaris. However, because Solaris represented a merging of SunOS and UNIX System
    V, many BSD features made their way into Solaris'
