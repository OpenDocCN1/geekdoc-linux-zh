  md: '# Chapter 4: Working with Files


    To follow along with the examples in this section, create a directory called /tmp/test
    and a file /tmp/test/hello.txt. Then do a long listing of those two items, follows:


    ```

    $ mkdir /tmp/test

    $ echo "some text" > /tmp/test/hello.txt

    $ ls -ld /tmp/test /tmp/test/hello.txt

    drwxrxr-x 2 francois 4096 Mar 21 13:11 /tmp/test

    -rw-r--r-- 2 francois 4096 Mar 10 13:11 /tmp/test/hello.txt

    ```


    After creating the directory and file, the first character of the long listing
    shows /tmp/test (d) and hello.txt as a file (-). Other types of files will appear
    as the first character include character devices (c), block devices (b) or symbolic
    links (l), named pipes (p), and sockets (s).


    The next nine characters represent the permissions on the file and directory.
    The first rwx indicates that the owner (francois) has read, write, and execute
    permissions on the directory. Likewise, the group has the same permission (rwx).
    All other users have only read and execute permission (r-x); the dash indicates
    the missing write permission. For the hello file, the user and group have read
    permission (r--) and others have read permission (r--).


    When you set to change permissions, each permission can be represented by an octal
    number (where read is 4, write is 2, and execute is 1) or a letter (rwx). Generally
    speaking, read permission lets you view the contents of the directory, write lets
    you change (add or modify) the contents of the directory, and execute lets you
    change to (in other words, access) the directory.


    If you don''t like the permissions currently set on the files or directories you
    own, you can change those permissions using the chmod command.


    # Changing permissions with chmod


    The chmod command enables you to change the access permissions of files and directories.
    Table 4-1 shows several chmod command lines and how they change access to the
    directory or file.


    Table 4-1: Changing Directory and File Access Permission


    | chmod Command (octal or Letters) | original permission | new permission | Description
    |

    |---|---|---|---|n| chmod 0700 | any | drwx------ | The directory''s owner can
    read or write files in that directory, as well as change to commit it. All other
    users (except root) have no access. |'
