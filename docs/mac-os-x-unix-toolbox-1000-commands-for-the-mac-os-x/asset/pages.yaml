  md: '# Appendix A: Using vi or Vim Editors


    From these examples, you can see that most vi keystrokes for changing text, deleting
    text, or moving around in the file can be modified using numbers.


    # Using Ex Commands


    The editor was originally built on an editor called Ex. Some of the vi commands
    you''ve seen so far start with a semicolon; these are known as Ex commands. To
    enter Ex commands, start from normal mode and type a semicolon (:). This switches
    to command-line mode. In this mode, you can use the Tab key to complete your command
    or filename, and the arrow keys to navigate your command history, as you would
    in a bash shell. When you press Enter at the end of your command, you are returned
    to normal mode.


    Table A-6 shows some examples of Ex commands.


    # Table A-6: Ex Command Examples


    | Command | Result |

    | --- | --- |

    | !bash | Escape to a bash shell. When you are done, type exit to return to vi.
    |

    | !date | Run date (or any command you choose). Press Enter to return. |

    | !! | Rerun the command previously run. |

    | :20 | Go to line 20 in the file. |

    | :5,10w abc.txt | Write lines 5 through 10 to the file abc.txt. |

    | :e abc.txt | Leave the current file and editing the file abc.txt. |

    | :r def.txt | Read the contents of def.txt into the file below the current line.
    |

    | :s/UNIX/FreeBSD | Substitute FreeBSD for the first occurrence of UNIX on the
    current line. |

    | :s/UNIX/FreeBSD/g | Substitute FreeBSD for all occurrences of UNIX on the current
    line. |

    | :%s/UNIX/FreeBSD/g | Substitute FreeBSD for all the occurrences of UNIX on the
    entire file. |

    | :g/FreeBSD /p | List every line in the file that contains the string "FreeBSD".
    |

    | :g/gaim/s//pidgin/gp | Find every instance of gaim and change it to pidgin.
    |'
  merge: -1
