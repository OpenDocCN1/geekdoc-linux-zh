  md: '# Chapter 4: Working with Files


    The dd command is another way to copy data. This command is very powerful on Mac
    OS X, everything is a file, including hardware peripherals. Here is an example:


    ```

    $ dd if=/dev/zero of=/tmp/nullfile count=1

    1+0 records in

    1+0 records out

    512 bytes transferred in 0.000253 secs (2022113 bytes/sec)

    ```


    /dev/zero is a special file that generates null characters. In the example just
    shown, the dd command takes /dev/zero as the input file and outputs to /tmp/nullfile.
    The count is the number of blocks. By default, a block is 512 bytes. The result
    is a 512-byte file full of null characters. You could use less or vi to view the
    contents of the file, but a better tool to view the file would be od (Octal Dump):


    ```

    $ od -vt xi /tmp/nullfile

    ```


    Here''s another example of the dd command. This sets the block size to 2 bytes
    and copies 10 blocks (bytes):


    ```

    $ dd if=/dev/zero of=/tmp/nullfile count=10 bs=2

    10+0 records in

    10+0 records out

    20 bytes transferred in 0.000367 secs (54507 bytes/sec)

    ```


    > **Warning!** The following dd commands overwrite the contents of your disk partitions.
    To be on the safe side, example data such as a USB memory stick, which we presume
    can be overwritten without harming the contents of your hard drives. Don''t try
    these commands if you have any confusion about the devices you are using.


    The following command clones the first partition of the second drive to the first
    USB drive. This can be useful for backing up a small partition to a USB memory
    stick. The following command will overwrite the contents of your USB drive:


    ```

    $ dd if=/dev/da11 of=/dev/da0s

    ```


    The next example makes a compressed backup of the first partition of the primary
    master IDE drive. Typically, the partition should be unmounted before a backup
    such as this:


    ```

    # umount /dev/da0s1 | gzip > bootpart.gz

    # dd if=diskboot.img of=/dev/da0s1

    ```


    The following command copies a boot image (diskboot.img) to your USB flash drive
    (assuming the drive appears as /dev/da0):


    ```

    $ dd if=diskboot.img of=/dev/da0

    ```'
