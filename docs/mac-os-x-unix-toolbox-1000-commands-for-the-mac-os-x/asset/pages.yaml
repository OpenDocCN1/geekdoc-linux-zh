  md: '# Chapter 4: Working with Files


    Table 4-1: Changing Directory and File Access Permission (continued)


    | chmod Command (octal or Letters) | original permission | new permission | Description
    |

    | --- | --- | --- | --- |

    | chmod 666 | any | -rw-rw-rw- | Open read/write-permissions completely on a file
    |

    | chmod- go-rw | -rw-rw-rw- | -rw------ | Don''t let anyone except owner view,
    change, or delete the file. |

    | chmod 644 | any | -rw-r--r- | Only the owner can change or delete the file,
    but all can view it.


    The 0 in the mode line can usually be dropped (e.g., you can use 777 instead of
    0777). Placeholder has special meaning. It is an octal digit that indicate on
    commands (executables) to indicate that the command can run as a set-UID program
    (4), run as a set-GID program (2), or become a sticky program (1). With set-UID
    and set-GID, the command runs with the assigned user or group permissions (instead
    of running with the permissions of the user or group that launched the command).


    > Warning! SUID should not be used on shell scripts. A shell script that by the
    root user is vulnerable to being exploited, which may result in an attacker gaining
    access to a shell with root permissions.


    Having the sticky bit on a directory prevents users from removing or renaming
    files that they don''t own (/tmp is an example). Given the right permission settings,
    users, can change the contents of files they don''t own in a sticky directory.
    The final permission character is t instead of x on a sticky directory. A command
    with the sticky bit turned on used to cause the command to stay in memory, even
    when not being used. This is an old UNIX feature that is not supported in most
    modern BSD, UNIX, and Linux systems.


    The -R option is a handy feature of the chmod command. With -R, you recursively
    change permissions of all files and directories starting from a point in the file
    system. Here are some examples:


    ```

    # chmod -R 700 /tmp/test  Open permission only below /tmp/test

    # chmod -R 000 /tmp/test Close all permissions below /tmp/test

    # chmod -A +rwx /tmp/test Open all permissions to all below /tmp/test

    ```


    Note that the -R option is inclusive of the directory you indicate. The preceding
    permissions, for example, would change for the /tmp/test directory itself, and
    not just for the files and directories below that directory.'
