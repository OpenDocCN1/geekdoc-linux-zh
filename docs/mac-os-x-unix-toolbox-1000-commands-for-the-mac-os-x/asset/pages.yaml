    # Finding Mac OS X resources


    The best place to find Mac OS X resources is at www.apple.com/macos/ . There you''ll
    find guided tours, documentation, and links to the Developer Connection (developer.apple.com).


    Apple''s Developer Connection is an invaluable resource for anyone contemplating
    more advanced development work, either in Mac OS X or the iPhone. Membership in
    the Developer Connection program gives you access to pre-release software and
    technical support, as well as a complete set of resources for developing tools.


    Much of the information provided in the Developer Connection area is not specific
    to UNIX (as it involves programming in Carbon or Objective-C), having access to
    the information and community of developers is a good thing overall.


    # Focusing on Mac OS X Commands


    Many important tasks on Mac OS X can be done from both the graphical interface
    and the command line. However, the command line has always been, and still remains,
    the interface of choice for UNIX power users.


    Graphical user interfaces (GUIs) are meant to be intuitive. With some computer
    experience, you can probably figure out, for example, how to add a user, change
    the time and date, and configure a sound card for a GUI. For these cases, we mention
    which tool you could use for the job. For the following cases, however, you will
    probably need to rely on the command line:


    +   Almost anything goes wrong—Ask a question at an online forum to solve some
    UNIX problem you are having and the help you get will almost come in the form
    of commands. In addition, command-line tools typically offer much more feedback
    if there a problem configuring a device or accessing files and directories.


    +   Remote systems administration—If you are administering a remote server, you
    may not have graphical tools available. Although remote GUI access (using X applications
    or VNC) and web-based administration tools may be available, usually run more
    slowly than what you can do from the command line.'
