  md: '# Chapter 3: Using the Shell


    # Using environment Variables


    Small chunks of information that are useful to your shell environment are stored
    in what are referred to as environment variables. By convention, environment variable
    names are all uppercase (although this is not enforced). If you use bash shell,
    some environment variables might be set for various bash start scripts: /etc/profile
    and ~/.bash_profile (if it exists).


    To display all the environment variables, in alphabetical order, that are already
    set for your shell, type the following:


    ```

    $ set less

    Apple_PubSub_Socket_Render=/tmp/launch-HxisSD/Render

    BASH=/bin/bash

    BASH_ARGC=

    BASH_ARGV=

    BASH_LINENO=

    BASH_SOURCE=

    BASH_VERSINFO={[0]=\*3" [1]=\*2" [2]=\*17" [3]=\*1" [4]=\*release" [5]=\*i386-apple-darwin.9"

    BASH_VERSION=3.2.17(1)-release

    COLUMNS=153

    COMMAND_MODE=unix2003

    ```


    The output shown contains only a few examples of the environment variables you
    will see. You can also set, or reset, any variables yourself. For example, to
    assign the value 123 to the variable ABC (and then display the contents of ABC),
    type the following:


    ```

    $ ABC=123

    $ echo $ABC

    123

    ```


    The variable ABC exists only in the shell in which it was created. If you launch
    a command from shell (ls, cat, firefox, and so on), that new process will not
    see the variable. Start a new bash process and test this:


    ```

    $ bash

    $ echo $ABC

    $

    ```


    You can make variables part of the environment and inheritable by children processes
    by exporting them:


    ```

    $ export ABC=123

    $ c

    $ echo $ABC

    123

    ```


