  md: '# Chapter 1: Starting with UNIX on Mac OS X


    Table 1-1 shows commands you can run to look for a command you want to use.


    # Table 1-1: Finding Commands


    | Command and sample Output | Description |

    |--- | --- |

    | $ type mount

    mount is /sbin/mount | Show the first mount command in PATH. |

    | $ whereis /sbin/mount

    mount: /usr/share/man/mount8.gz | Show binary and man page for mount. |

    | $ locate xrdb.1.gz

    /usr/local/man/man1/xrdb.1.gz | Find xrdb.1.gz anywhere in the file system. |

    | $ which umcount

    sbin/umcount | Find the umcount command anywhere in your PATH or aliases. |

    | $ pkg_info -W convert

    /usr/local/bin/convert

    was installed by package ImageMagick-3.6.3.9 | Find which the convert command
    is from |


    If you suspect that the command you want is not installed, the best remedy is
    probably to upgrade to the latest version of Mac OS X.


    # Command reference Information in UNIX


    Original BSD, Linux, and UNIX documentation was all done on manual pages, generally
    referred to as man pages. A slightly more sophisticated documentation effort appeared
    a bit later with the info family. Within each command itself, help messages are
    almost available.


    This reference information is component oriented—in other words, there are separate
    man pages for every command, file format, system call, device, and other component
    of a BSD system. Documentation more closely aligned to whole software packages
    is typically stored in a subdirectory of the /usr/local/share/doc directory.


    All reference features—man pages, info documents, and help messages—are available
    in BSD systems.


    # Using help Messages


    The -h --help options are often used to display help messages for a command. The
    following example illustrates how to display help for the man command:


    ```

    $ man --help

    man, version 1.6c

    ```'
