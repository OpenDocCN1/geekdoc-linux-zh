  md: '# Chapter 12: Accessing Network Resources


    Although mail can be used interactively, it is often used for sending script-based
    e-mails.

    Here are some examples:


    ```

    $ uname -a mail -s ''My X version'' kafka@example.com

    $ ps auxw | mail -s ''My Process List'' marlow@example.com

    ```


    The two examples just provide quick ways to mail off some text without having
    to open a GUI mail interface. The first example sends the output from uname -command
    to the user kafka@example.com. The subject (-s) is set to ''My OS X Version''.
    In the second example, a list of running processes (ps auxw) is sent to the same
    user with a subject of ''My Process List''.


    Used interactively, by default the mail command opens the mailbox by your shell''s
    $MAIL. For example:


    ```

    # echo $MAIL

    /var/mail/root

    # mail

    Mail version 8.1 6/6/93. Type ? for help.

    "var/mail/root*: 25 new

    N 1 thompson.local Tue Jan 08:02 41/1193 *X5 security run output

    N 2 thompson.local Tue Jan 08:02 73/2419 *X5 daily run output

    N 3 thompson.local Sat Jan 19 03:02 35/1119 *X5 security run output

    N 4 thompson.local Sat Jan 19 03:02 70/2419 *X5 security run output

    &

    ```


    The current message has a greater-than sign (>) next to it. New messages have
    an N at the beginning; (but not new) have an A; and if there is no letter, the
    message has been read. The prompt at the bottom () is ready to accept commands.


    At this point, you are in command mode. You can use commands to move around and
    perform basic mail functions in mail. Type ? to see a list of commands, or type
    the number of the message you want to see. Type v3 to open the third message in
    the Vi editor. Type h18 to see a list of message headers that begins with 18.
    To reply to message 7, type r7 (type your message, and then put a dot on a line
    to send it to message). Type d4 to delete the fourth message (or d4–9 to delete
    messages four through nine). Type !bash to escape to the shell (and then exit
    to return to mail).


    You should understand before you exit mail, any messages you view will be copied
    from your mailbox to your $HOME/mbox file when you exit, unless you preserve them
    (pre*). To keep all messages in your mailbox, by typing x. To save your changes
    to the mailbox, type q to quit.


    You can open any file that is in MBOX when you use mail. For example, if you are
    logged in the root user but want to open the mailbox for the user kafka, type
    the following:


    ```

    # mail -f /var/mail/kafka

    ```'
