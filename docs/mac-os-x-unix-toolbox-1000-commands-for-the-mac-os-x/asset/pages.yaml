  md: "# Chapter 8: Backups and Removable Media\n\nFor ongoing backups, you can have\
    \ rsync seven-day incremental backups. Here’s an example:\n\n```\n# mkdir /mnt/backups\n\
    # rsync --delete --backup \\\n  --backup-dir=/mnt/backups/backup-`date +A` \\\n\
    \  -avz marlowe@server1:/Users/marlowe/Personal/\n  /mnt/backups/current-backup/\n\
    ```\n\nWhen the command runs, all the files from /Users/marlowe/Personal on the\
    \ remote server seront copied to the local directory /mnt/backups/current-backup.\
    \ The first time the command runs, all files are backed up to the backup directory.\
    \ The next time the command runs (on the next day), all files modified that day\
    \ are copied to a directory named after the day of the week, as /mnt/backups/backup-Monday.\
    \ Over a week, directories will be created to reflect each of the past seven years.\n\
    \nAnother trick for rotated backups is to use hard links instead of multiple copies\
    \ of the files. This two-step process consists of rotating the files and then\
    \ running rsync:\n\n```\n# rm -rf /mnt/backups/backup-old/\n# mv /mnt/backups/backup-current\
    \ /mnt/backups/backup-old/\n# rsync --delete --link-dest=/mnt/backups/backup-old\
    \ -avz \\\nmarlowe@server1:/Users/marlowe/Personal/ /mnt/backups/backup-current/\n\
    ```\n\nIn the previous procedure, the existing backup-current directory replaces\
    \ the backup-old directory, deleting the two-week old backup with last week’s\
    \ backup. When the new full backup is run with rsync using the --link-dest option,\
    \ if any of the files being backed up from the remote Personal directory on server\
    \ existed during the previous backup (now in backup-old), then a hard link between\
    \ the file in the backup-current directory and backup-old directory is created.\n\
    \nYou can save a lot of space by having hard links between files in your backup-old\
    \ and backup-current directories. For example, if you had a file named file.txt\
    \ in both directories, you could check that both were the same file by listing\
    \ the files’ inodes as follows:\n\n```\n$ ls -i /mnt/backups*/file.txt\n260761\
    \ /mnt/backups/backup-current/file.txt\n260761 /mnt/backups/backup-old/file.txt\n\
    ```\n\n# Backing Up to CD or DVD\n\nBy default, if you insert a CD or DVD into\
    \ a Mac OS X system, the system will prompt you for an action. You can change\
