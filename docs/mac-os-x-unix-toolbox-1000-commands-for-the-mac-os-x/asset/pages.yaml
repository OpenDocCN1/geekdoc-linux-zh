  md: '# 10


    # # Managing the System


    Without careful management, the demands on your Mac OS X system can sometimes
    exceed the resources you have available. Being able to help you monitor your system''s
    activities (memory, CPU, and device usage) over time can ensure that your machine
    has enough what you require. Likewise, managing other aspects of your system,
    such as the device it uses and how the boot process works, can help avoid performance
    problems and system failures.


    # In t h s Chap t e R


    +   * Checking memory use with top and vmstat


    +   * Viewing CPU usage with iostat, systat, and top


    +   * Monitoring storage devices with iostat and isof


    +   * Working with dates/time using date, cal, and nt p


    This chapter is divided into several sections that relate to ways of managing
    your Mac OS X system. The first section can help you monitor the resources (processing
    power, devices, and memory) on your system. The next section describes how to
    check and set your system clock. Descriptions of the boot process and subsequent
    run levels follow. The last sections describe how to work with the kernel and
    related device drivers, as well as how to view information about your computer''s
    hardware components.


    +   * shutting down the system with reboot, halt, and shutdown


