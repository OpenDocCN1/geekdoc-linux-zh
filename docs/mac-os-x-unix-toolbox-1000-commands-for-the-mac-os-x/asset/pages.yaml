    # Mounting and Unmounting File Systems


    Before you can use a regular file system, you need to attach it to a directory
    in your computer''s file system tree by mounting it. Your root file system (/)
    and other file systems you use on an ongoing basis are typically automounted by
    Mac OS X. Sometimes, though, need to manually mount file systems.


    The mount command is used to view mounted file systems, as well as to mount any
    local (hard disk, USB drive, CD, DVD, etc.) or remote (NFS, Samba, etc.) file
    systems. Here are examples of the mount command for listing file systems:


    ```

    $ mount

    /dev/disk0s2 on / (hfs, local, journaled)

    devfs on /dev (devfs, local)

    fdesc on /dev (fdesc, union)

    map -hosts on /net (autofs, automounted)

    map auto_home on /home (autofs, automounted)

    ```


    Use the -t option to only list mounts of a specific file system type:


    ```

    $ mount -t hfs

    /dev/disk0s2 on / (hfs, local, journaled)

    ```


    Here is a simple command to mount a local file system (/dev/ad0s4 device) on an
    existing directory /mnt/music:


    ```

    # mount /dev/ad0s4 /mnt/music

    # mount -v /dev/ad0s4 /mnt/music/

    Mount file system, more verbose

    ```


    Use -t to explicitly indicate the type of file system:


    ```

    # mount -v -t ext2fs /dev/ad0s4 /mnt/music/ Mount an ext2 file system

    /dev/ad0s4 on /mnt/music (ext2fs, local, fsid 5e00000008000000)

    ```


    You can specify mount options by using -a and a comma-separated list of options.
    By default, partitions are mounted with read/write access. You can explicitly
    specify to mount a file system as read-write (rw) or read-only (ro):


    ```

    # mount -v -t ext2fs /dev/ad0s4 /mnt/music Mount read-write

    /dev/ad0s4 on /mnt/music (ext2fs, local, fsid 5e00000008000000)

    # mount -v -t ext2fs -o ro /dev/ad0s4 /mnt/music Mount read-only

    /dev/ad0s4 on /mnt/music (ext2fs, local, fsid 5e00000008000000)

    ```'
