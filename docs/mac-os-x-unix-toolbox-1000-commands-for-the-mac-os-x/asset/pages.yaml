    # Copying Files


    Provided you have write permission to the target directory, copying files and
    directories can be done with some fairly simple commands. The standard cp command
    will copy a file to a new name or the same name in a new directory, with a timestamp
    associated with the file. Other options to cp enable you to retain date-timestamps,
    copy recursively, and prompt before overwriting. Here are some examples:


    ```

    # cd mkdir public_html; touch index.html

    # cp -i index.html public_html/          Copy with new time stamp

    # cp -il index.html public_html/         Create hard link instead of copy

    # cp -Rv public_html/ /mnt/usb/         Copy all files recursively (with verbose)

    ```


    The preceding examples show ways of copying files related to a personal web server.
    In the first cp example shown, if an index.html exists in public_html, you are
    prompted to overwrite it with the new file. In the next, the index .html file
    is hard-linked to a file of the name in the public_html directory. In that case,
    both links point to the same file, editing the file from either location will
    change the contents of the file in both locations. (The link can be done only
    if public_html / and your home directory are in the same file system.)


    The cp -Rv command copies all files below the public_html/, updating ownership
    and permission settings to match those of the user running the command. It also
    uses current/timestamps. If, for example, /mnt/usb represented a USB flash drive,
    that command would be a way to copy the contents of your personal web server to
    that drive.


