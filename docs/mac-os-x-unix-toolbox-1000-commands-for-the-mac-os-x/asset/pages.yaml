  md: '# Chapter 14: Locking Down Security


    # Working with Users and Groups


    During installation, you are asked to assign a password to your user (for system
    administration). Unlike other BSD and UNIX systems, Mac OS X makes sure that the
    root user is disabled by default—the only way to get access to privileged functions
    or files is via the `sudo` command.


    We encourage you to always log in as a regular user and only `su` or `sudo` to
    the root account when necessary (In fact, you are not allowed to log in remotely
    using `ssh` to a BSD system as root user). When FreeBSD is installed, you can
    use commands or graphical tools to add more users, modify user accounts, and assign
    change passwords.


    # Managing Users the GUI Way


    In Mac OS X, you can manage user accounts by clicking System Preferences (see
    Figure 14-1) in the Dock, and then clicking Accounts.


    ![](img/d850b48b6750d726fcc813a2a895d7cc_217_0.png)


    Figure 14-1: Getting to accounts via the System Preferences


    You can add more accounts to the system (see Figure 14-2) by clicking the plus
    symbol under the Accounts list and entering the necessary information (username,
    password, and more).


    In Mac OS X, command-line options for adding, editing, or removing user accounts
    don''t exist at all. You must use the GUI.'
