    # Troubleshooting Network problems


    Troubleshooting networks is generally done from the bottom layer up. As discussed
    at the beginning of this chapter, the first step is to ensure that the physical
    network layer components (cables, NICs, and so) are connected and working. Next,
    verify that the links between physical nodes are working. After that, many tools
    are available for checking the connectivity to a particular host.'
