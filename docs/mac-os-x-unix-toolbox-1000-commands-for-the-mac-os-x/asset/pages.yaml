  md: '# Chapter 11: Managing Network Connections


    You can view IP addresses instead of hostnames by disabling name resolution of
    hops:


    ```

    $ traceroute -n www.google.com  Disable name resolution in trace

    ```


    To view and manipulate the kernel''s routing table, the route command has tradition-ally
    been the tool of choice. This is slowly being replaced by the ip route command
    in some Linux distributions, but route is still commonly used in BSD distributions.


    You can use the route command to display your local routing table. Here are two
    examples of the route command, and without DNS name resolution:


    ```

    $ route get apple.com  Display local routing table information

    route to:17.149.160.49

    destination: default

    mask: default

    gateway: homepage.gateway.org

    interface: en1

    flags: <UP,GATEWAY,DONE,STATIC,PRCLINING>

    recpipe sendpipe ssthresh rtt,ms rttvar hopcount mtu expire

    0 0 0 0 0 1500 0

    ```


    ```

    $ route -n apple.com  Display routing table without DNS lookup

    route to:17.149.160.49

    destination: default

    mask: default

    gateway: 172.16.0.1

    interface: en1

    flags: <UP,GATEWAY,DONE,STATIC,PRCLINING>

    recpipe sendpipe ssthresh rtt,ms rttvar hopcount mtu expire

    0 0 0 0 0 1500 0

    ```


    To change the default route on your system, use the default options as follows:


    ```

    $ route add 10.0.0.2  Change the default route

    ```


    You can add a new route to your network by specifying the destination and the
    IP address of the gateway (10.0.0.100):


    ```

    $ route -net 192.168.0.0 mask 255.255.255.0 gw 10.0.0.1

    ```


    To delete a route, use the delete option:


    ```

    $ route delete -net 192.168.0.0 Delete a route

    ```


    To make a new route permanent, create a defaultrouter entry in the /etc/rc.conf.
    For example, to set the default route to 10.0.0.2 at each system reboot, you would
    add the following entry to the file /etc/rc.conf:


    ```

    defaultrouter="10.0.0.2"

    ```'
