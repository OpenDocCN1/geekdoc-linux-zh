    # Working with the Open Command


    Every Mac OS user has used either an iLife or an iWork product at some point or
    another. If you''re working with music, you reach for iTunes. If it''s photos
    you need to manage, you reach for iChat. Chatting is handled by iChat. On the
    business side of the house, you''ve got Pages (word processor), Keynote (presentation
    software), and Numbers (spreadsheet).


    All of these programs are normally initiated by clicking their icons on the Dock
    or in the Finder. However, you can open just any directory, file, or application
    from the command line with the open command.


    To open a Finder window containing your working directory, enter the following
    command in a Terminal window:


    ```

    open -

    ```


    To open an application, just add the -a switch and its name. To open iTunes, enter
    the following command:


    ```

    open -a iTunes

    ```'
