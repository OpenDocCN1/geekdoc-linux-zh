  md: '# 8


    # Backups and Removable Media


    Data backups in UNIX were traditionally done by running commands to archive and
    compress the files to backup, and then writing backup archive to tape. Options
    for archive tools, compression, and backup media have grown tremendously in recent
    years. Tape archiving has, for many, been replaced by techniques for backing up
    data over the network, to other hard disks, or to CDs, DVDs, or other low-cost
    removable media.


    This chapter details some useful tools for backing up and restoring your critical
    data. The first part of the chapter details how to use basic tools such as tar,
    zip, and rsync for backups.


    | In this Chapter |

    Creating backup archives with tar |

    Compressing backups with gzip and bzip2 |

    Backing up over the network with ssh |

    Doing network backups with rsync |

    Working with time Machine |


    # Backing Up Data to Compressed Archives


    If you are coming from a Windows background, you may be used to tools such as
    WinZip and PKZIP, both of which archive and compress groups of files in one application.
    BSD systems offer separate tools for gathering groups of files into a single archive
    (such as tar) and compressing for efficient storage (gzip, bzip2, and others).
