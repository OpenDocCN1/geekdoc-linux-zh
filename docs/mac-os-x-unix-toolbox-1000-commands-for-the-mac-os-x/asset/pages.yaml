  md: '# Chapter 3: Using the Shell


    Let''s look at some tests on filenames. In this example, you can check whether
    a file exists (-e), whether it is a regular (-f), or it is a directory (-d). These
    checks are done with if/then statements. If there is no match, then the else statement
    is used to produce the result:


    ```

