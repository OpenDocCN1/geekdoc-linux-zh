    That is how many OSS developers (including kernel developers) distribute their
    code patches. The patch and diff can also be run on entire directory trees. However,
    that usage is outside the scope of this book.


    # Using awk and cut to process Columns


    Another massive processing tool is the awk command. The awk command is a full-blown
    programming language. Although there is much more you can do with the awk command,
    the following examples show you a few tricks related to extracting columns of:


    ```

    $ ps aux | awk ''{print $1,$11}''

    $ ps aux | awk ''/myerman/ (print $11)''

    $ ps aux | grep myerman | awk ''{print $11}''

    ```


    The first example displays the contents of the first column (user name) and eleventh
    column (command name) from running processes outputted by the ps command aux.
    The next two commands produce the same output, with one using the awk command
    and the other using the grep command to find all processes owned by the user named
    myerman. In each case, when processes are owned by myerman and found, column 11
    (command name) is displayed for each of those processes.


    By default, the awk command assumes that the delimiter between columns is spaces.
    You can specify a different delimiter with the -F option as follows:


    ```

    $ awk -F ''{print $1,$5}'' /etc/passwd Use colon delimiter to print cols

    ```'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# Chapter 5: Manipulating Text


    You can get similar results with the cut command. As with the previous awk example,
    you use a colon (:) as the column delimiter to process information from the /etc/passwd
    file:


    ```

    $ cut -d -f1 /etc/passwd

    ```


    Use colon delimiter to print cols


    The cut command also be used with range of fields. The following command prints
    columns 1 through 5 of the /etc/passwd file:


    ```

    $ cut -d -f1-5 /etc/passwd

    ```


    Show columns 1 through 5


    Instead of using a dash (-) to indicate a range of numbers, you can use it to
    print all columns from a particular column number and above. The following command
    displays all columns from column 5 above from the /etc/passwd file:


    ```

    $ cut -d -f5- /etc/passwd

    ```


    Show columns 5 and later


    We prefer to use the awk when columns are separated by a varying number of spaces,
    such as the output of the ps command. We prefer the cut command when dealing with
    files delimited by commas (,) or colons (:), such as the /etc/passwd file.


    # summary


    BSD and UNIX systems traditionally use plain text files for system configuration,
    documentation, output from commands, and many forms of stored information. As
    a result, many commands have been created to search, edit, and otherwise manipulate
    plain text files. With today''s powerful and elegant Mac OS X GUI, the ability
    to manipulate plain text files is critical to becoming a power UNIX user.


    This chapter explores some of the most popular commands for working with plain
    text files in UNIX systems. These commands include text editors (such as Vi, Nano,
    and Pico), as well as commands that can edit streaming data (such as sed and awk
    commands). There are also commands for sorting text (sort), counting text (wc),
    and translating characters in text (tr).'
