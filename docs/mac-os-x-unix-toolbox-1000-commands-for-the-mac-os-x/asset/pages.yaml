    # summary


    Watching and working with the processes that run on your Mac OS X system are

    important activities to ensure that your system is operating efficiently. Using
    com-

    mands such as ps and top, you can view the processes running on your system.


    With commands such as nice and renice, you can adjust the recommended priorities

    at which selected processes run. When a process is running, you can change how
    it is

    running or kill the process by sending it a signal from the kill or killall commands.


    After launching a command from the current shell, you can set that command''s
    pro-

    to run in the background (bg) or foreground (fg). You can also stop and restart

    the process using different control codes.


    To schedule a command to run at a later time, you can use the at or batch com-

    mands. To set up a command to run repeatedly at set intervals, you can use the
    cron

    or anacron facilities.'
