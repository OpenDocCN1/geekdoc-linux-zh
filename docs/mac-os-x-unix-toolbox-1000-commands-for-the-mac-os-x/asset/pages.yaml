  md: '# Appendix C: Personal Configuration Files


    C shell files: Besides systemwide /etc/profile and /etc/cshrc files, home directory
    for storing and changing C (tcsh and csh) settings include the following:


    +   - login: Commands added to this file are executed when you log in to a C shell.


    +   - tcshrc or .cshrc: Commands added to either of these files are executed when
    you start any C shell.


    +   - history: Stores a history of commands by the user from a C shell.


    Bourne files: If you are using the Bourne (sh) shell, which is the default for
    regular users in FreeBSD, the .sh file in your home directory is important to
    know about. Commands in this file are run when the sh starts. The file sets aliases
    for you and your command-line editor (Emacs by default). This is a good place
    to add directories to your $PATH or to change your shell prompt. (I always change
    the default editor to vi Emacs)


    mail configuration files: Settings for the mail command are stored in the .mailrc
    and .mail_aliases files.


    ncpft configuration files: If you use the ncpft FTP client, settings relating
    to ncpft sessions are stored in the .ncpft directory in your home directory. The
    firewall in that enables you to set firewalls, including over using ncpft through
    a proxy server. The history file keeps a list of commands that were previously
    run during sessions. The log file gathers error and informational messages. The
    prefs_v3 file contains ncpft preferences.


    Trusted hosts files: Although regular users can''t change the systemwide hosts
    .allow or .hosts.deny files, they can add a list of trusted hosts and, optionally,
    users from those hosts are enabled (/etc/inetd.conf), a person from the trusted
    host can use others .hosts in their home directories. If services such as login
    or rcp allow log in or copy files to your machine without entering a password.
    This is a good thing to do if all of the computers on your network are wired together,
    in the same room, in a cabin in the Himalayas, with no outside connections. Otherwise,
    you should consider trusted hosts in this way to be very insecure.


    Secure Shell configuration files: If you use the secure shell (SSH) service, the
    .ssh directory in your home directory can be used to manage security settings.
    Here are examples:


    +   - known-hosts: Keeps a list of most hosts you have verified as authentic


    +   - identity: Private authentication keys from SSH protocol version 1


    +   - id_rsa: Private authentication keys from SSH protocol version 2


    +   - id_dsa: Private authentication keys from SSH protocol version 2


    +   - identity.pub, id_dsa.pub, id_rsa.pub: Public keys for the three private
    keys just described


    +   - authorized_keys: File that contains public keys of remote clients'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# Appendix C: Personal Configuration Files


    Virtual network computing files: If you use the vncserver to share your desktop
    with other computers on the network, settings for specifying vncserver behaviors
    are stored in your home directory''s vnc directory. that directory contains applications
    that run on the VNC desktop when you start it up. The vncpasswd file holds the
    passwords for use by vncserver.


    For each display that is started, a file named host#.log is created (where host
    is the hostname and # is the display number). There is also a host#:pid file for
    each display containing the process ID of the Xvnc process associated with the
    display.


    X startup files: If you start your desktop interface using the startx command,
    the .xinitrc file can be used to indicate which desktop environment to start.
    For example, add /usr/local/bin/gnome-session to .xinitrc to start the GNOME desktop
    environment. Add /usr/local/bin/startkde to .xinitrc to have the KDE desktop environment
    start.


    MMMS configuration files: If you use the MMMS music player, configuration files
    for that player are contained in the .xmms directory in your home directory. Subdirectories
    of that directory include Plugins (which hold audio plugins) and Skins (which
    holds available skins to use with the player). The config file in that directory
    holds preference settings for MMMS. The xmms.m3u file contains paths for songs
    the player has played.'
  merge: -1
