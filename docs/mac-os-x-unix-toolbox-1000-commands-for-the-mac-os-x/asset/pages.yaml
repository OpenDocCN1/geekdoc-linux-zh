  md: '# Chapter 6: Advanced Scripting


    So far, nothing to write about, but we''ve now saved something valuable from the
    vicissitudes of history, quite literally. But what if we wanted to make this output
    a little more user friendly? We could add some labels by using the echo command.
    The -n command-line flag enables us to add a label without a new line, thereby
    putting the label and the data on the same line:


    ```

    #!/bin/bash

    echo -n ''Time and server load: ''*''

    uptime | cut -d '' '' -f1,12

    ```


    Running the script again, we get the following:


    Time and server load: 15:04 0.11


    We can repeat the process when trying to get the number of Apache processes. We
    merely pipe the output of ps, grep the lines containing httpd, ignore our grep
    command, and then count the results with:


    ```

    #!/bin/bash

    echo -n ''Time and server load: ''*

    uptime | cut -d '' '' -f1,12

    echo -n ''Apache: ''*\ps aux | grep httpd | grep -v grep | wc -1

    ```


    Here''s what we get when we run the command:


    Time and server load: 15:07 0.19

    Apache: 12


    Next, we add a similar line to count mysql processes:


    ```

    #!/bin/bash

    echo -n ''Time and server load: ''*

    uptime | cut -d '' '' -f1,12

    echo -n ''Apache: ''*\ps aux | grep httpd | grep -v grep | wc -1

    echo -n ''MySQL: ''*\ps aux | grep mysql | grep -v grep | wc -1

    ```


    Here''s the result:


    Time and server load: 15:10 0.04

    Apache: 12

    MySQL: 2


    Getting the size of the Apache error log is fairly simple, as all you need to
    know is its location. Once you have that, you can use wc to get a line count.
    For the purposes of this example, all log files (Apache, PHP, and MySQL) are stored
