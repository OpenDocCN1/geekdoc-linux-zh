  md: '# Chapter 3: Using the Shell


    If you don''t ever want to see an output stream, you can simply direct the output
    stream to a special bucket file (/dev/null):


    ```

    # ls /tmp 2>/dev/null

    ```


    > > Tip Another time you may want to redirect stderr is when you run jobs with
    crontab. You could redirect stderr to a mail message that goes to the crontab''s
    owner. That way, any error messages can be sent to the person running the job.


    Just as can direct standard output from a command, you can also direct input to
    a command. For example, the following command e-mails the /etc/hosts file to the
    user named Marlowe on the local system:


    ```

    $ mail marlow /etc/hosts

    ```


    Using pipes, you can redirect output from one process to another process, rather
    than just files. Here is is an example where the output of the ls command is piped
    to the sort command to have the output sorted:


    ```

    # ls /tmp | sort

    ```


    In the next example, a pipe and redirection are combined (the stdout of the ls
