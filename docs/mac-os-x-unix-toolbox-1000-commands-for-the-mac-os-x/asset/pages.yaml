    A dash in the first character of the 10-character permission information (-rw-rw-r--)
    indicates that the item is a regular file. (Permissions explained in the section
    "Setting File/Directory Permissions" later in this chapter.) Commands are also
    regular files but are usually saved as executables. Here are some examples:


    ```

    $ ls -1 /usr/bin/apropos

