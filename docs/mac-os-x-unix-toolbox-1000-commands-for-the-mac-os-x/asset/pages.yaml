- img_proc: true
  md: '# Appendix B: Special Shell Characters and Variables


    # Table B-1: Special Shell Characters (continued)


    | Character | Description |

    | --- | --- |

    | ~ |ing to the $HOME directory. |

    | ~+ | Value of the shell variable PWD or the working directory (bash only). |

    | ~~ | Refs to the previous working directory (bash only). |

    | . | Refs to the current working directory. |

    | .. | Refs to the directory above the current directory. Can be used repeatedly
    to expand several directories up. |

    | $param | Used to expand a shell variable parameter. |

    | cmd1 `cmd2` or | cmd2 is executed. Then the call to cmd2 is substituted with
    the output of cmd2, and cmd1 is executed. |

    | cmd1 > | Redirects standard output from command. |

    | cmd1 < | Redirects standard input to command. |

    | cmd1 >> | Append standard output to file from command, without erasing its contents.
    |

    | cmd1 | cmd2 | Pipe output of one command to input of the next. |

    | cmd1 & | Run the command in the background. |

    | cmd1 && cmd2 | Run first command, and if it returns a zero exit status, run
    the second command. |

    | cmd1 || cmd2 | Run first command, and if it returns a non-zero exit status,
    run the second command. |

    | cmd1 ; cmd2 | Run the first command, and when it completes run the second command.
    |


    # Using Shell Variables


    You identify a string of characters as a parameter (variable) by placing a $ in
    front of it (as in `$HOME`). Environment variables can hold information that is
    used by the shell itself, as well as commands you run from the shell. Not all
    environment variables will be populated by default. Some of these variables can
    change (such as the default printer in `$PRINTER` or your command prompt in `$PS1`).
    Others are managed by the shell (such as `$OLDPWD`). Table B-2 contains a list
    of many useful shell variables.'
