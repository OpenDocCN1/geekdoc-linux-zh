  md: '# Chapter 4: Working with Files


    # summary


    Dozens of commands are available for exploring and working with files in Mac OS
    X. Commands such as `chmod` can change the permissions associated with a file.


    To move around the file system, people use the `cd` command most often. However,
    to move repeatedly among the same directories, you can use the `pushd` and `popd`
    commands to work with a stack of directories.


    Copying files is done with the `cp` command, but the `dd` command can be used
    to copy files (such as disk images) from a device (such as a CD-ROM drive). For
    creating directories, you can use the `mkdir` command.


    Instead of keeping multiple copies of a file around the file system, you can use
    symbolic links and hard links to have multiple filenames point to the same file
    or directory. Symbolic links can be anywhere in the file system, whereas hard
    links must exist on the same partition as the original file.


    To search for files, Mac OS X offers the `locate` and `find` commands. To verify
    the integrity of files you download from the Internet, you can use the `md5`,
    `sha256`, `md5sum`, and `shalsum` commands.'
