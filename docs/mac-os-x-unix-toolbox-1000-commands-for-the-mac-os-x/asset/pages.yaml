    (even if you log out and disconnect from the server). To reconnect when only one
    screen is running, type the following:


    ```

    $ screen -r

    ```


    If several screen sessions are running, screen -r won''t work. For example, this
    shows what happens when two detached screen sessions are running:


    ```

    $ screen -r

    ```


    There are several suitable screens on:

    7089.pts-2.myserver (Detached)'
