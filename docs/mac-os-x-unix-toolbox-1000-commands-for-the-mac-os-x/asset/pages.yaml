  md: '# # Chapter 11: Managing Network Connections


    # ## traceroute to hosts


    After ensuring you can ping your gateway and even reach machines that are outside
    your network, you may still have issues reaching a specific host or network.

    If so, you can use traceroute to find the bottleneck or point of failure:


    ```

    $ traceroute www.google.com Follow the route to a host

    traceroute: Warning:www.google.com has multiple addresses; using 74.125.95.147

    traceroute to www.1.google.com 64 hops, 40 byte packets

