  md: '# Chapter 13: Remote System Administration


    Note at each prompt you press the Enter key to create the default key filename
    and to enter (verify) You now have a private key that you to keep very safe, especially
    in this procedure you didn''t protect it with a passphrase.


    You now have a public key `id_rsa.pub`, which was created by the previous command.
    This public key needs to be installed on hosts to which you want to connect. The
    content of ~/.ssh/id_rsa.pub needs to be copied (securely) to ~/.ssh/authorized_keys
    for the user you want to ssh on the remote server. The authorized_keys file can
    contain more than one public key if multiple users use ssh to connect to this
    account.


    Log in to the remote server as the user you want to ssh as If you don''t already
    have a ~/.ssh directory, the first step is to create it as follows:


    ```

    $ cd

    $ mkdir .ssh

    $ chmod 700 .ssh

    ```


    The next step is to copy (securely) the public key from the client and put it
    in the authorized keys file on the server. This can be accomplished using scp.
    For example, assuming the client name myself and the client user chris, type the
    following on the server:


    ```

    $ scp myself@home/chris/.ssh/id_rsa.pub Get client id_rsa.pub

    $ cat id_rsa.pub >> ~/.ssh/authorized_keys Add to your keys

    $ chmod 600 ~/.ssh/authorized_keys Close permissions

    $ rm id_rsa.pub Delete public key after copying its content

    ```


    This procedure can also be accomplished by editing the ~/.ssh/authorized_keys
    file on the server and pasting the public key from the client. Be sure you do
    so securely and do not insert any lines in the keys. The entry key should fit
    on one single line, even if it wraps on your screen.


    Next, from the client (using the client and server user accounts you just configured),
    you can just ssh to the server and the key will be used. If you set a passphrase,
    you will be asked for it, as you would for a password.


    # Saving Private Keys to Use from a USB Drive


    If you''d like to store your private key somewhere safer than your hard drive,
    you can use a USB drive (sometimes called a thumbdrive or pen drive):


    ```

    $ mv ~/.ssh/id_rsa /Volumes/THUMBDRIVE/myprivatekey

    ```


    Then, when you want to use the key, insert the USB drive and type the following:


    ```

    $ ssh -i /media/THUMBDRIVE/myprivatekey marlowe@myserver

    ```'
