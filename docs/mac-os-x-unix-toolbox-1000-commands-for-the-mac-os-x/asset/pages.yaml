  md: '# Chapter 2: New to Mac OS X?


    # Directory Structure


    Now that you''ve got Terminal set up on the Dock and your Utilities folder in
    a stack, let''s have a quick look at the directory structure. In Terminal, type
    the following command:


    ```

    ls -a /

    ```


    You''ll see a whole bunch of familiar folders (such as /etc and /bin) but a lot
    of other stuff that doesn''t seem to make sense (such as /.Spotlight-V100 and
    /Trashes.


    Table 2-1 lists the major folders you see over the root folder. One thing to notice
    right away is that the file system is neutral, which can throw some UNIX pros
    off first. For example, each of the following commands results in the same output:


    ```

    ls /etc

    ls /Et

    ls /Etc

    ```


    # Table 2-1: Mac OS X Ro at Directory


    | File or Folder | Description |

    | /.DS_Store | Contains Finder settings for the current directory. This folder
    is generated for any directory viewed in Finder. |

    | /.Spotlight-V100 | Contains Spotlight-specific metadata |

    | /.Trashes | Contains files that have been dragged to the Trash |

    | /.com.apple.timemachine.supported | Indicates that a drive can be used by Time
    Machine as a backup target |

    | /.fseventsd | Used by the FSEvents API |

    | /.hotfiles.btree | A B-Tree index that provides fast access to frequently used
    files |

    | /Applications | Holds all Mac OS X applications |

    | /bin | Contains essential system binaries |

