- img_proc: true
  md: '# Chapter 5: Manipulating Text


    You can change the output of diff to what is known as unified format. Unified
    format can be easier to read by human beings. It adds three lines of context before
    and after each block of changed lines it reports and uses + and - to show the
    difference between the files. The following set of commands creates a file (f1.txt)
    containing a sequence of numbers (1–7), creates a file (f2.txt) with one of those
    numbers changed (using sed), and compares the two files using the diff command:


    ```

    $ for NUM 1 2 3 4 5 6 7; do echo $NUM >> f1.txt;

    $ cat f1.txt

    ```


    Display contents of f1.txt


    ```

    1

    2

    3

    4

    5

    6

    7

    ```


    ```

    $ sed s/4/FOUR/ < f1.txt > f2.txt

    $ diff f1.txt f2.txt

    ```


    Change 4 to FOUR and send to f2.txt


    ```

    4c4

    < 4

    > FOUR

    $ diff -u f1.txt f2.txt

    --- f1.txt 2007-09-07 18:26:00.0000000000 -0500

    +++ f2.txt 2007-09-07 18:26:39.0000000000 -0500

    @@ -1,7 +1,7 @@

    ```


    Shows line 4 was changed in file


    ```

    1

    2

    3

    -4

    +FOUR

    5

    6

    7

    ```


    The diff -u output adds information such as modification dates and times to the
    regular diff output. The sdiff command can be used to give you another view. The
    sdiff command can merge the output of two files interactively, as shown in the
    following output:


    ```

    $ sdiff f1.txt f2.txt

    1

    2

    3

    4

    5

    6

    7

    FOUR

    ```


    Another variation on the diff theme is vimdiff, which opens the two files by side
    in Vim and outlines the differences in color.'
