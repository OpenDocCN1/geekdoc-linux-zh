    The goal of this chapter is very simple: to provide you with a Cook''s tour of
    UNIX on Mac OS X. By the end of the chapter, you should be familiar with your
    environment, and we''ll take some time along the way to make some customizations
    and additions that make you more productive.


    # What Is Mac OS X UNIX?


    Mac OS X 10.5 (Leopard) is marketed as an “Open Brand UNIX 03 Registered Post,
    conforming to the SUS3 and POSIX 1003.1 specification for the API, Shell Utilities,
    and Threads.” What this means in man’s terms is that Leopard can compile and run
    all existing UNIX code.


    Furthermore, Leopard supports both 64- and 32-bit applications on the same platform.
    All major graphical libraries (Cocoa, X11, and OpenGL) are available. Leopard
    is also multicore optimized, enabling vastly improved scheduling, memory management,
    and processor affinity algorithms.


    In short, you''ve got full support for UNIX on Mac OS X. It isn''t kind of add-on
    or afterthought. The guts, a collection of open-source'
