  md: "# Chapter 8: Backups and Removable Media\n\nTo reverse the process and copy\
    \ files from the local system to the remote system, run a local tar command. This\
    \ time, however, we use a cd command to put the files in a directory of our choice\
    \ on the remote machine:\n\n```\n$ tar cf - myfile | ssh kafka@server1 \\\n  cd\
    \ /Users/kafka/myfolder; tar xvf - \\\n  kafka@server1's password: *****\nmyfile\n\
    myfile2\n```\n\nIn this next example, we're not going to untar the files on the\
    \ receiving end, but instead write the rules to tgz files:\n\n```\n$ ssh kafka@server1\
    \ 'tar czf - myfile*' | cat > myfiles.tgz\n$ tar cvf myfile | ssh kafka@server1\
    \ 'cat > myfiles.tgz'\n```\n\nThe first example takes all files beginning with\
    \ myfile from the kafka's home directory on server1, tars and compresses those\
    \ files, and directs compressed files to myfiles.tgz. The second example demonstrates\
    \ the reverse by taking all files beginning with myfile in the local directory\
    \ and sending them to a myfiles.tgz file on the remote system.\n\nThe examples\
    \ just shown are good for copying files over the network. Besides providing compression,\
    \ they also enable you to use any tar features you choose, such as incremental\
    \ backup features.\n\n# Backing Up Files with rsync\n\nA more feature-rich command\
    \ for doing backups is rsync. What makes rsync unique is the rsync algorithm,\
    \ which compares the local and remote files one block at a time using checksums,\
    \ and transfers only the blocks that are different. This algorithm is so efficient\
    \ that it has been reused in many backup products.\n\nThe rsync command can work\
    \ on top of a remote shell (ssh) or by running an rsync daemon on the server end.\
    \ The following example uses rsync over ssh to mirror a directory:\n\n```\n$ rsync\
    \ -avz --delete marlowe@server1:Users/marlowe/pics/ mypics/\n```\n\nThe preceding\
    \ command is intended to mirror the remote directory structure (/Users/marlowe/pics/)\
    \ to a directory on the local system (mypics/). The -a says to in archive mode\
    \ (recursively copying all files from the remote directory), the -z option compresses\
    \ the files, and -v makes the output verbose. The --delete rsync to delete any\
    \ files on the local system that no longer exist on the remote system."
