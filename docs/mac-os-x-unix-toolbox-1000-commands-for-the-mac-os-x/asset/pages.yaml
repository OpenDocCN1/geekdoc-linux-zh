  md: '# Chapter 3: Using the Shell


    Bash shell settings for all users'' shells are located in /etc/profile. User-specific
    shell settings are determined by commands executed from separate files in the
    user''s home directory (if they exist): .bash_profile, .bash_login, and .profile.
    When a shell is closed, any commands in the user''s ~/.bash_logout file are executed.
    Changing in these files permanently changes the user''s shell settings but does
    not affect shells that are already running. (Other shells use different configuration
    files).


    There are a variety of ways in which you can list and change your shell environment.
    One of the main ways is to change which user you are—particular, to become the
    super user (see the section "Acquiring Super Power" later in this chapter).


    # Using bash history


    The Bourne (bash) is used by many UNIX-systems. Built into bash, with other shells,
    is a history feature that enables you to review, change, and reuse commands that
    you have run in the past.


    When bash starts, it reads the ~/.bash_history file and loads it into memory.
    This file is set by the value of $HISTFILE. During a bash session, commands are
    added to history in memory. When bash exits, history in memory is written back
    to ~/.bash_history file. The number of commands held in history during a bash
    session is set by $HISTSIZE, while the number of commands actually stored in the
    history file is set by $HISTFILE:


    ```

    $ echo $HISTFILE $HISTSIZE $HISTFILESIZE

    /home/fcaen/.bash_history 500 50

    ```


    To list the entire history, type history. To list a previous number of history
    commands, follow history with a number. The following example lists the previous
    five commands in your history:


    ```

    $ history 5

    975 mkdir extras/

    976 mv *doc -CF

    977 ls -CF

    978 vi house.txt

    979 history

    ```


    To move among the commands in your history, use the up arrow and down arrow. When
    a command is displayed, you can use the keyboard to edit the current command like
    any other command: left arrow, right arrow, Delete, Backspace, and so on. Here
    are some other ways to recall and run commands from your bash history:


    ```

    $ !!

    $ 1997 Run the previous command

    $ 1997 Run command number 997 from history

    ls -CF

    $ 1997 *doc Append *doc to command 997 from history

    ```'
