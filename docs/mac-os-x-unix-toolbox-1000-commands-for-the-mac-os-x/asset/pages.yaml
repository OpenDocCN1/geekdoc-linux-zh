  md: '# Chapter 12: Accessing Network Resources


    The lftp session illustrates how you can use shell command names to operate on
    remote directories (provided you have permission). The mkdir and chmod commands
    create a directory and leave permissions open only to your user account. The put
    command uploads one or more files to the remote server. The mput command can use
    wildcards to match multiple files for download. Other commands include mirror
    -R (to upload a directory tree).


    lftp also provides a script for non-interactive download sessions: lftpget. The
    syntax of lftpget is similar to that of the wget command.


    ```

    $ lftp ftp://ftp.freebsd.org/pub/FreeBSD/doc/en/books/handbook/book.bz2

    ```


    Keep in mind that standard FTP clients are insecure because they do their work
    in clear text. Your alternative, especially when security is a major issue, is
    to use SSH tools to transfer files.


    # Using ssh Tools to Transfer Files


    SSH utilities are among the most important tools in a system administrator''s
    arsenal of communications commands, some of the more complex uses of configuration
    and using ssh are covered in Chapter 13. However, in their most basic form, SSH
    utilities are the tools you should use most for basic file transfer.


    In particular, the scp command will do most of what you need to get a file from
    one computer to another, making communication safe by encrypting both the password
    stage and the data transfer stage of the process. The scp command replaces the
    rcp command as the most popular tool for host-to-host file copies.


    > **Warning** You do not get a warning before overwriting existing files with
    scp, ensure that the target host doesn''t contain any files or directories you
    want in the path of your scp file copies.


    # Copy remote Files with scp


    To use scp to transfer files, the SSH service (usually the sshd daemon) must be
    running on the remote system. Here are some examples of useful scp commands:


    ```

    $ scp myfile kafka@server1:/tmp Copy file to server1

    ******

    $ scp server1:/tmp/myfile . Copy remote myfile to local working dir

    ******

    ```


    Use the -p option to preserve permissions and timestamps on the copied files:


    ```

    $ scp -p myfile server1:/tmp/

    ```


    If the SSH service is configured to listen on a port other than the default port
    22, use -P to indicate which port on the scp command line:


    ```

    $ scp -P 12345 myfile server1:/tmp/ Connect to a particular port

    ```'
