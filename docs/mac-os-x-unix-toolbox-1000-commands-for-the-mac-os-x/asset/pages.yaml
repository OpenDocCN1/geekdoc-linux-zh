  md: '# Appendix F: Perl Primer


    If you don''t get this response, or if you have a very old version of Perl (say,
    Perl 4), then use Fink to update your code. Chances are good, though, you''ll
    have every-thing you need to get started.


    One of the things that makes Perl so easy to use is precisely what makes it frust-rating
    for those new to the language. Perl has a bit of what I like to think of as "idiomatic
    elasticity." This is just fancy linguistic talk for being able to use different
    syntactical structures and commands to do the same thing.


    Although many programmers find this infuriating, it makes perfect sense to be
    me—I had a lot of training in linguistics, did Larry Walt. For example, if I''m
    sitting in a restaurant and want to pay the bill and leave, I have many different
    ways to express this. I can wave the waiter over and when he asks if I want the
    check. I can just ask, "May I have the check?" I pull out my wallet and place
    it on the table.


    Each of these different approaches gives me the same result—the waiter''s attention,
    and eventually, a hard-copy bill in my hand.


    The same thing is true with Perl. In many cases, it supports a variety of different
    approaches to do any job—or as Larry Walt has, "There''s more than one way to
    cut a skin." Yes, it''s certainly a cliché, but Perl makes this cliché a real-world
    possibility—hence its power. That''s why when you give five or more Perl-mers
    in one room and ask them to solve a problem, you''ll get at least three divergent
    solutions.


    In this appendix, I''m going to show you how I go about using a common problem
    (checking the links on a website) Perl to automate the tedious, error-prone manual
    processes for solving that problem.


    If you''re already a Perl demon, you can skip this next part, secure in your knowledge
    and mastery. If you''re a complete novice, it is hoped that the next section will
    get you down the path to Perl mastery.


    # Checking Links on a Website


    About six seven years ago, a client asked me if I knew a tool that would help
    quickly check the links on a web page. At the time, there were many link checkers
    (both free and not) available, but I took the opportunity to write a quick 20-line
    Perl script that would do the checking.


    I needed a small and portable script, one that would accept a URL as a command-line
    argument, visit that URL, check all the links it found, and then follow all the
    in-site links to determine whether they were reachable or not. Then I needed a
    report.


    I knew from experience that I would need some help to do this task. Perl comes
    with a number of handy libraries, each of them a specialized toolkit to do a specific
    job.'
