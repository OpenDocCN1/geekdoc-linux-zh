  md: '# Chapter 13: Remote System Administration


    Using keys with passrases is more secure than simple passwords, but also more
    cumbersome. To make your life easier, you can use ssh-agent to store unlocked
    keys for the duration of your session. When you add an unlocked key to your running
    ssh-agent, you can run ssh using the key without being prompted for the passphrase
    each time.


    To see what the ssh-agent command does, run the command with no option. A three-line
    bash script appears when you run it, as follows:


    ```

    $ ssh-agent

    SSH_AUTH_SOCK=/tmp/ssh-SQKZ18329/agent.18329; export SSH_AUTH_SOCK;

    SSH_AGENT_PID=18330; export SSH_AGENT_PID;

    echo pid 18330;

    ```


    The first two lines of the preceding output need to be executed by your shell.
    Copy and paste those lines into your shell now. You can avoid this extra step
    by starting ssh-agent and having the bash evaluate its output by typing the following:


    ```

    $ eval ssh-agent

    Agent pid 18408

    ```


    You can now unlock keys and add them to your running agent. If you have already
    run the ssh-keygen command to create a default key, now add that default key using
    the ssh-command:


    ```

    $ ssh-add

    Enterter passphrase for /home/chris/.ssh/id_rsa: ********

    Identity added: /home/chris/.ssh/id_rsa (/home/chris/.ssh/id_rsa)

    ```


    Next, you can add the key you stored on the USB thumbdrive:


    ```

    $ ssh-add /media/THUMBDRIVE1/myprivatekey

    ```


    Use the -l ssh-add to list the keys stored in the agent:


    ```

    $ ssh-add -l

    2048 f7:b0:7a:5a:65:3cd:45:b5:1c:de:f8:26:ee:8d:78 /home/chris/.ssh/id_rsa

    (RSA)

    2048 f7:b0:7a:5a:65:3cd:45:b5:1c:de:f8:26:ee:8d:78

    /media/THUMBDRIVE1/myprivatekey (RSA)

    ```


    To remove one key from the agent—for example, the one from the USB thumbdrive—run
    the ssh-add -d option:


    ```

    $ ssh-add -d /media/THUMBDRIVE1/myprivatekey

    ```


    To remove all keys stored in the agent, use the -D option:


    ```

    $ ssh-add -D

    ```'
