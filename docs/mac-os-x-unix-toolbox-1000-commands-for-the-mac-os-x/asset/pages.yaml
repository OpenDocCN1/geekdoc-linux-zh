  md: '# AppleScript Command Summary


    This appendix provides a brief summary of the commands available to perform actions
    in AppleScript scripts. Table D-1 lists each command by category and provides
    a brief description.


    In t h ls Ap pen DlX

    Apples cript commands


    # Table D-1: AppleScript commands


    | Command | Description |

    | --- | --- |

    | AppleScript Suite | |

    | activate | Brings an application to the front, and opens it if it is on the
    local computer and not already running |

    | log | In Script Editor, displays a value in the Event Log History window or
    in the Event Log of a script window |

    | Clipboard Commands | |

    | clipboard info | Returns information about the clipboard |

    | set the clipboard to | Places data on the clipboard |

    | the clipboard | Returns the contents of the clipboard |

    | File Commands | |

    | info for | Returns information for a file or folder |

    | mount volume | Mounts the specified AppleShare volume |

    | path to (application) | Returns the full path to the specified application |

    | path to (folder) | Returns the full path to the specified folder |

    | path to resource | Returns the full path to the specified resource'
