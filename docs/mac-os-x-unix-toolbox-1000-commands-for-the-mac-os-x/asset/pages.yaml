    # # Translating or Removing Characters with tr


    The tr command is an easy way to do simple character translations on-the-fly.
    In the following example, newlines are replaced with spaces, so all the files
    listed from the current directory are outputted on one line:


    ```

    $ ls | tr ''n'' '' ''    # Replace newline characters with spaces

    ```


    The tr command can be used to replace one character with another, but it does
    not work with strings as sed. The following command replaces all instances of
    the lowercase letter f with a capital F:


    ```

    $ tr f F < myfile.txt    Replace every f in the file with F

    ```


    You can also use the tr command to simply delete characters. Here are two examples:


    ```

    $ ls | tr -d ''n''          Delete new lines (resulting in one line)

    $ tr -d f < myfile.txt     Delete every letter f from the file

    ```


    The tr command can do some nifty tricks when you specify ranges of characters
    to work. Here''s an example of changing lowercase letters to uppercase:


    ```

    $ echo chris | tr a-z A-Z    Translate chris into CHRIS

    ```


    The same result can be obtained with the following syntax:


    ```

    $ echo chris | tr ''[:lower:]'' ''[:upper:]''    Translate chris into CHRIS

    ```


    # # Checking Differences Between Two Files with diff


    When you have two versions of a file, it is useful to know the differences between
    the two files. For example, when changing a configuration file, people often leave
    a copy of the original file. When that occurs, you can use the diff command to
    discover which lines differ between your new configuration and the original configuration,
    in order to see what you have done. For example:


    ```

    $ cp ~/documents/file.txt ~/documents/file.bak  # Make some changes to the file.txt
    file

    $ diff ~/documents/file.txt ~/documents/file.bak

    ```'
