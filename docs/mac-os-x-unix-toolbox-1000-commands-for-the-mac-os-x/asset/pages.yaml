  md: '# Chapter 3: Using the Shell


    Using the alias just shown, typing fi string causes the current directory and
    its subdirectories to .bashrc containing the string you entered. You can add an
    alias to your .bashrc file as follows:


    ```

    # alias la=''ls -la'' >> ~/.bashrc

    ```


    Remove an alias from the current bash session using the unalias command:


    ```

    # unalias la

    Unalias the previously aliased la command

    # unalias -a

    Unalias all aliased commands

    ```


    # Tailing Files


    To watch the contents of a plain text file grow over time, you can use the tail
    command. For example, you can watch as messages are added to the /var/log/install
    .log file as follows:


    ```

    # tail -f /var/log/install.log

    ```


    Press Ctrl+C to exit the tail command.


    # Acquiring Super power


    When you open a shell, you are able to run commands and access files and directories
    based on your user/group ID and the permissions set for those components. Many
    system features are restricted to the root user, also referred to as the super
    user.


    On Mac OS X, the root user is disabled by default. If you need to do something
    as root, use the sudo command.


    The sudo command provides very granular delegation of power to users other than
    the root user. When you have multiple users, the sudo facility is a great tool
    for granting specific escalated privileges and logging everything the users do
    with privileges. Unless otherwise, sudo runs as root.


    Simply add the sudo command in front of the command you wish to run:


    ```

    $ sudo /usr/bin/less /var/log/apache2/error_log

    Password:

    ```


    After users type their own password, they can page through the /var/log/apache2/error_log
    file. A timestamp is set at that time as well. For the next five minutes (default),
    that user can type the preceding command line and it will work without issuing
    the password prompt.'
