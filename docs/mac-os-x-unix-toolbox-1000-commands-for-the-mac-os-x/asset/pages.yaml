    # starting and stopping Network services


    You can start and stop services associated with your network interfaces in much
    the same way that you use the netif script to start and stop the interfaces. Services
    such as Secure Shell (sshd) and Network File System (nfsd) can be manually started
    using the /sbin/service script.


