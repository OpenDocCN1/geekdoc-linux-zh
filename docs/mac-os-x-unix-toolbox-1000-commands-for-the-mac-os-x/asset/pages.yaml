  md: '# Chapter 2: Checking and Running Processes


    ```

    $ kill -SIGCONT 5254      Continue a stopped process (pid 5254)

    $ kill %3                           Kill the process represented by job %3

    $ killall spamd                      Kill all spam daemons currently running

    $ kill -SIGHUP sendmail Have mail processes reread config files

    ```


    The SIGKILL(9) signal, used generously by trigger-happy novice administrators,
    should be reserved as a resort. It does not allow the target process to execute
    cleanly but to end abruptly. This can potentially result in loss or corruption
    of data handled by that process. The SIGHUP signal was originally used on UNIX
    systems to indicate that a terminal was being disconnected from a mainframe (such
    as from a hang-up of a dial-in modem). However, daemon processes, such as sendmail
    and httpd, were implemented to catch SIGHUP signals as an indication that those
    processes should reread configuration.


    # running processes away from the Current shell


    If you want a process to continue running even if you disconnect from the current
    shell, there are several ways to go about doing that. You can use theup command
    to run a process in a way that is impervious to a hang-up signal:


    ```

    $ nohup myscript.sh &      Run myscript.sh with no ability to interrupt

    # nice -9 gcc hello.c &     Run gcc uninterrupted and higher priority

    ```


    Using nohup is different from running the command with an ampersand alone, because
    with nohup the command will keep running, even if you exit the shell that launched
    the command.


    The nohup command was commonly used in the days of slow processes and dialup connections
    (so you didn''t have to stay logged into an expensive connection while a long
    compile completed). In addition, using tools today such as screen (described in
    Chapter 14) you can keep a shell session active even after you disconnect your
    network connection to that shell.


    # scheduling processes to r un


    Commands associated with the cron facility can be used to set a command to run
    at a specific time (including now) so that it is not connected to the current
    shell. The at runs a command at the time you set. the commands you want to run
    at the later time, and press Ctrl+D to quit the job:


    ```

    $ at now +1 minute               Start command running in one minute

    ls -R /usr/ports ~ /tmp/portlist.txt

    <Ctrl+D> <EOF>

    job 5 at Mar 20 20:37:00 2008

    # at teatime                    Start command at 4pm today

    # at now +5 days                Start a command in five days

    # at 06/25/08                   Start a command at current time on June 25, 2008

    ```'
