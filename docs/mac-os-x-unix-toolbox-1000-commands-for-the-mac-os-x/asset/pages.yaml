  md: '# Chapter 9: Checking and Running Processes


    Another way to run a command that''s not connected to the current shell is with
    the batch command. With batch, you can set a command to start as soon as the processor
    is ready (load average below .8).


    ```

    # batch

    Start command running immediately

    find /mt/isos | grep jpg$ > /tmp/mypics

    Ctrl+D <EOT>

    ```


    Note that after the at or batch commands, you get a secondary prompt. Type the
    command you want to run at that prompt and press Enter. After that, you can continue
    to enter commands. When you are done, press Ctrl+D on a line by itself to queue
    the commands you entered to run.


    When the commands are entered, you can check the queue of at and batch jobs that
    are set to run by typing the atq command:


    ```

    atq

    Date Owner Queue Job#

    Tue Dec 29 16:00:00 CST 2008 root C 4

    Sat Aug 2 19:24:00 CST 2008 root C 5

    ```


    Regular users can''t view queued jobs. The root user can see everyone''s queued
    jobs. If you want to delete an job from queue, use the atm command:


    ```

    # atm 5

    Delete at job number 5

    ```


    The at and batch commands are for queuing a command to run as a one-shot deal.
    You can use the cron facility to set up commands to run repeatedly. These commands
    are scripted into crontab files, which are scheduled in crontab files. There is
    one system crontab file (/etc/crontab). In addition, each user can create a personal
    crontab file that can launch commands at times that the user chooses. To create
    a personal crontab file, type the following:


    ```

    $ crontab -e

    Create a personal crontab file

    ```


    The crontab -e opens your crontab file (or creates a new one) using the vi editor.
    Here are examples of several entries you could add to a crontab file:


    ```

    15 8 * Mon,Wed,Thu,Fri kafka < /var/project/stats.txt

    * * 1,4,7,10 * find /doc | grep .doc > /var/sales/documents.txt

    ```


    The first crontab example sends a message to the user named kafka by directing
    the contents of /var/project/stats.txt into that message. Mail command is run
    Monday through Friday at 8:15 a.m. In the second example, if the first day of
    January, April, July, and October, the find command runs to look for every .doc
    file in and sends the resulting list of files to /var/sales/documents.txt.


    The last part of each crontab entry is the command that is run. The first five
    fields represent the time and date the command is run. The fields from left to
    right are as'
