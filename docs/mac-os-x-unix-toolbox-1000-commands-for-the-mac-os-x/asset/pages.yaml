  md: '# 14


    # Locking Down Security


    Securing your Mac OS X system means many things. To be secure, you need to restrict
    access to the user accounts and services on the system. However, after that, security
    means checking that no one has gotten around the defenses you have set up.


    +   ### In this Chapter

    * Managing users

    * seeing who''s logged in and who

    * Configuring firewalls

    * Managing log files with syslog


    FreeBSD, FreeBSD, OpenBSD, and other systems based on BSD distributions are designed
    in many ways to be secure by default. That means there are no user accounts with
    blank passwords, that the firewall is restrictive by default, and most network
    services (Web, FTP, and so on) are off by default (even if the service''s software
    is installed).


    As setting up a BSD system, you can go beyond the defaults to make your system
    even more secure. For example, by setting up services in chrooted jails you can
    prevent an intruder from accessing parts of the computer system that are outside
    the compromised service. By encrypting critical data, you can make it nearly impossible
    for someone to use stolen data.


    Although many of the commands covered in this chapter can be used to check and
    improve the security of your BSD system, some basic BSD features are particularly
    geared towards security. For example, secure user accounts with good password
    protection, a solid firewall, and consistent logging (log monitoring) are critical
    to having a secure BSD system. Commands related to those features, plus some advanced
    features related to networking services, are covered in this chapter.


    > Although all of computer security efforts focuses on protecting computers from
    outside attackers, policies protecting data from those inside a company have become
    a growing issue. The procedures covered in this chapter should be enhanced with
    policies that restrict internal users from accessing data they don''t need for
    their jobs, and track improper access from those users.'
  merge: -1
  pgno: 216
