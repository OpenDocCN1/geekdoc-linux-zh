  md: '# # 5


    # # Manipulating Text


    With only a shell available on the first UNIX systems (on which BSD systems were
    based), using those systems meant dealing primarily with commands and plain text
    files. Documents, program code, configuration files, e-mail, and almost anything
    you created or configured was represented by text files. To work with those files,
    developers created many text manipulation tools.


    Despite having graphical tools for working with text, most seasoned UNIX users
    find command-line tools to be more efficient and convenient. Text editors such
    as Vi (Vim), Emacs, Nano, and Pico are available with most BSD distributions,
    including Mac OS X. Commands such as `grep`, `sed`, and `awk` can be used to find,
    and possibly change, pieces of information within text files.


    This chapter explains how to use many popular commands for working with text files
    on Mac OS X. It also explores some of the less common uses of text manipulation
    commands that you might find interesting.


    +   In This Chapter

    - Matching text with regular expressions

    - Editing text files with Vi or nano

    - Using graphical text editors

    - Listing text with cat, head, and tail

    - paging text with less and more

    - paginating text with pr searching text with grep

    - stream editing with sed, tr, and awk

    - Finding differences in files with diff

    - Converting text files to different formats


    # # Matching Text with Regular Expressions


    Many of the tools for working with text enable sometimes referred to as regex
    or RegEx, to identify the text you are looking for based on some pattern. You
    can use these strings to find text within a text editor, or use them with search
    commands to scan multiple files for the strings of text you want.'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# Chapter 5: Manipulating Text


    A RegEx search pattern can include a specific string of text (as in a word such
    as UNIX) or a location (as the end of a line or the beginning of a word). It can
    also be specific (find the word hello) or more inclusive (find any word beginning
    with h and ending with o).


    Appendix C includes reference information for shell metacharacters that can be
    used in conjunction with regular expressions to do the exact kinds of matches
    you are looking for. This section shows examples of using regular expressions
    with several tools you will encounter throughout this chapter.


    Table 5-1 shows some examples using basic regular expressions to match text strings.


    # Table 5-1: Matching Using Regular Expressions


    | Expression | Matches |

    | --- | --- |

    | a* | a, ab, abc, aecjeij |

    | ^a | Any “a” appearing at the beginning of a line |

    | *as | Any “a” appearing at the end of a line |

    | a.c | Three-character strings that begin with “a” and end with “c” |

    | [bcf]at | bat, cat, fat |

    | [a-d]at | aat, bat, dat, but not Oat, Bat, and so on |

    | [A-D]at | Aat, Bat, Dat, but not aat, and so on |

    | 1[3-5]7 | 137, 147, and 157 |

    | \Hello | A tab character preceding the word Hello |

    | \. [Tt] [Xx] [Tt] | .txt, TXT, Txt or other case combinations |


    Many examples of regular expressions are used in examples throughout. Keep in
    mind that not every command that incorporates RegEx uses its features the same
    way.


    # Editing Text Files


    There are many text editors in the BSD/UNIX world. The most common editor is Vi,
    which can be found on virtually any UNIX system available today. That is knowing
    how to at least make minor file edits in Vi is a critical skill for any administrator.
    One day, if you find yourself in a minimalist, foreign BSD, Linux, or other UNIX
    environment, trying to bring a server back online, Vi is the tool that will always
    be there.'
