  md: '# straight to the Kernel


    In general, when the kernel starts up on your Mac system, you shouldn''t have
    to do too much with it. However, there are tools for checking the kernel that
    is in use and for viewing information about how the kernel started up. In addition,
    if something goes wrong or you need to add some extra support to the kernel, tools
    are available for those situations.


    To find out what version of Mac OS X you are running, type the following:


    ```

    $ uname -r              Display name of current release

    9.5.0

    $ uname -a              Display all name and release information

    Darwin Macintosh 9.5.0 Darwin Kernel Version 9.5.0: Wed Sep 3 11:29:43 PDT

    2008; root:xnu-1228.7.58-1/RELEASE_I386

    ```


    You can control kernel parameters with the system using the sysctl command. You
    can also add parameters permanently to the /etc/sysctl.conf file, which enable
    them to load as a group at each reboot. Here are some examples:


    ```

    $ sysctl -a | less           List all kernel parameters

    kern.otype = Darwin

    kern.osrelease = 9.5.0

    kern.osrevision = 199506

    kern.version = Darwin Kernel Version 9.5.0: Wed Sep 3 11:29:43 PDT 2008;

    root:xnu-1228.7.58-1/RELEASE_I386

