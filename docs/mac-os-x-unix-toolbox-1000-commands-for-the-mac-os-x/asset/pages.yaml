    # Using Info Documents


    In some cases, developers have put more complete descriptions of commands, file-formats,
    devices, or other BSD components in the info database. You can enter the info
    database by typing the info command or by pressing a particular component:


    ```

    $ info ls

    ```


    The previous command shows information on the ls command. Use up, down, left,
    and right arrows and Page Up and Page Down to move around the screen. The Home
    and End keys go to the beginning and end of a node, respectively. When you are
    displaying the info screen, you can get around using the keystrokes shown in Table
    1-3.


    # Table 1-3: Moving Through the Info Screen


    | Keystroke | Movement |

    | ? | Display basic commands to use in info windows. |

    | L | Go back to the previous node you were viewing. |

    | n, p, u | Go to the node that is next, previous, or up. |

    | Tab | Go to the next hyperlink in this node. |

    | Enter | Go to the hyperlink under the cursor. |

    | R | Follow a cross-reference. |

    | Q | Quit and exit from info. |


    Software packages that have particularly extensive text available in the info
    database include gimp, festival, libc, automate, zsh, tar, and bash. Files used
    by the info database are stored in the `/usr/share/info` directory.


