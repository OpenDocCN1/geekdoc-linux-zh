  md: '# Using vi or Vim Editors


    Although easy-to-use graphical text editors (such as TextEdit or BBEdit) are readily
    available on Mac OS X systems, most power users still use vi or Emacs to edit
    text files. Besides the fact that vi and Emacs will work from any shell (no GUI
    required), they offer other advantages, such as your hands never having to leave
    the keyboard and integration with useful utilities; unlike GUI, text-based editors
    are usable over slow Internet connections via dial-up or satellite.


    +   In this appendix

    - Using the vi editor

    - Starting/quitting the vi editor

    - Moving around in vi

    - Changing and deleting text

    - Using visual mode


    This appendix focuses on features of the vi editor that not help you with basic
    editing, but also help you do some advanced text manipulation. We chose to vi
    rather than Emacs because vi is more universal and leaner, and because vi keyboard
    shortcuts require only two arms. Because some UNIX-like systems use the Vi (Vi
    Improved) editor instead of the older editor, the descriptions in this appendix
    are extended to cover Vim as well. Some features in Vim that are not in vi include
    multiple undo levels, syntax highlighting, and online help.


    > Note If you have never used vi or Vim before, try out the tutor that comes with
    the vim6 package. Run the vimutor command and follow the instructions to step
    through many of the key features of vi and Vim. See the differences between vi
    and Vim, :help vi_diff.txt while running the vim command. Install the vim package,
    type adding it as root: pkg_add -r vim6.


    Depending on how your vim package was built, you may or not get all the latest
    Vim features working first. In many cases, the compatible option is on, which
    causes conflicting behaviors between vi and vim to behave like vi (see the text
    on undo later in this appendix). To turn on the latest features, type: :set incompatible
    while editing with vim or add this to your ~/.vimrc file:


    ```

    set incompatible

    ```'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# Appendix A: Using vi or Vim Editors


    # # starting and Quitting the vi editor


    If you want to experiment with using vi, you should copy a text file to practice
    on.

    For example, enter the following:


    ```

    $ cp /etc/services /tmp

    ```


    Then open that file using the vi command as follows:


    ```

    $ vi /tmp/services

    ```


    To benefit from all the improvements of Vim, make sure you have the FreeBSD

    vim6 package installed. On many systems, vi is aliased to the vim command. You

    want to double-check that, using the alias command. If you want to use vim

    directly, type /usr/local/bin/vim. If you specifically want to use the older-style
    vi

    , use the full path to the vi command instead:


    ```

    /bin/vi /tmp/text.txt

    ```


    Here are a few ways you can start vi:


    +   - vi +25 /tmp/services Begin editing file on the last line

    - vi +/tmp/services Begin on first line with word "tty"

    - vi +tty /tmp/services Recover file from crashed edit session

    - vi -r /tmp/services Edit file in read-only mode

    - view /tmp/services


    When you are done with your session, you have several different ways to save and

    quit. To save the file before you are ready to quit, type :w. To quit and save
    changes, type either

    ZZ or :wq. To without saving changes, type :q!. If you find that you cannot write
    to the

    file you are editing, it may be opened in read-only mode. If that''s the case,
    you can

    force it by writing :w! or save the contents of the file to a different name.

    For example, type the following to save the contents of the current file to a
    file named\myfile:


    ```

    :w /tmp/myfile.txt

    ```


    > Note It''s important to understand that :w writes the current file out to another

    file, if you are continue you editing the original file. In the preceding

    example, if you started the services file, and then wrote the contents to

    myfile.txt, in order to continue editing myfile.txt you would have to change

    it it by typing :w!/myfile.txt.


    The editor also enables you to line up several files at a time to edit. For example,
    enter the

    following:


    ```

    $ cd /tmp

    $ touch a.txt b.txt c.txt

    $ vi a.txt b.txt c.txt

    ```'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Appendix A: Using vi or Vim Editors


    In this example, vi will open the a.txt file first. You can move to the next file
    by typing :n. You may want to save changes before moving to the next file (:w)
    or save changes as you move to the next file (:wn). To abandon changes while moving
    to the next file, type :n!. To go back to the previous file, type :prev.


    You will probably find it easier to open multiple files using the vim feature
    for splitting your screen. When you''re in vim and have a file open, you can split
    your screen multiple times horizontally or vertically:


    ```

    :split /etc/services

    vsplit /etc/hosts

    ```


    Use <Tab> to complete the path to the files, as you would in a bash shell. To
    navigate between split windows, press Ctrl+W, followed by the W key. To close
    the current window, use the usual vim exit command (:).


    # Moving Around in vi


    The first thing to get used to with vi is that you can''t just start typing. Vi
    has multiple modes that enable you to perform different sets of tasks. You start
    a session in normal mode, where vi is waiting for you to type a command to get
    started. While you are in normal mode you can move around the file in order to
    establish your position in the file. To enter or modify text, you need to be in
    insert or replace modes.


    Assuming vi is open with a file that contains several pages of text, Table A-1
    shows some keys and combinations you can type to move around the file while in
    normal mode.


    # Table A-1: Keystroke Commands for Moving Around


    | Key | Result | Key | Result |

    |---|---|---||---|

    | PageDown or Ctrl+F | Move down one page | PageUp or Ctrl+B | Move up one page
    |

    | Ctrl+D | Move down half page | Ctrl+U | Move up half page |

    | G | Go to last line of file | :1 | Go to first line of file (use any number
    to go to that) |

    | H | Move cursor to top of screen | L | Move cursor to screen bottom |

    | M | Move cursor to middle of screen | Ctrl+L | Redraw screen (if garbled) |


    Continued'
  merge: -1
