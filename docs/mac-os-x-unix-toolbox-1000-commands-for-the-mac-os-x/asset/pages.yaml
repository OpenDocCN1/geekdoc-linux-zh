    Note that processes placed in the background are given a job ID number (in this
    case, 1). By placing a percent sign in the number (for example, %1) you can identify
    a particular background process to the bg and fg commands. You can do the same
    thing in the bash shell by typing the number with the command (as in fg 1). With
    one or more background jobs running at the current shell, you can use the jobs
    command to manage your background jobs:


    ```

    $ jobs Display background jobs for current shell

    [1] Running gimp &\n[2] Running xmms &

    [3] Running gedit &\n[4]+ Stopped gtali

    $ jobs -1 Display PID with each job''s information

    [1] 31676 Running gimp &\n[2] 31677 Running xmms &

    [3] 31683 Running gedit &\n[4] 31688 Stopped gtali

    $ jobs -2 Display information only for job %2

    [1] 31677 Running xmms &

    ```


    The processes in the jobs examples might have been done while you were logged
    in a remote system, but by using ssh to run remote GUI applications on your local
    desktop. By running these processes in the background, you can have multiple applications
    running at once, with your current shell.


    > Note With fg or bg, if you don''t indicate which process to act on, the current
    job is used. The current job has a plus sign (+) next to it.


    The fg and bg manipulate running processes by moving those processes to the foreground
    or background. Another way to manipulate running commands is to send signals directly
    to those processes. A common way to send signals to running processes is with
    the kill and killall commands.


    # Killing and signaling processes


    You can change or stop running processes by sending signals to those processes.
    Commands such as kill and killall can send signals you select to running processes,
    which, as their names imply, are often signals to kill the process.


    Signals are represented by numbers (9, 15, and so on) and strings (SIGKILL, SIGTERM,
    and so on). Table 9-2 describes standard signals you can send to processes in
    BSD systems.'
