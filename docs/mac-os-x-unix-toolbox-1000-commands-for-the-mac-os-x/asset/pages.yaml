    Unzips and untars archive


    Alternately, try the following command line:


    ```

    $ gunzip myfiles.tar.gz ; tar xf myfiles.tar

    ```


    Unzips then untars archive


    The preceding command removes the tar.gz file, leaving only the .tar file. To
    do that same procedure in one step, you could use the following command:


    ```

    $ tar xvf myfiles.tar.gz

    x textfile.txt

    x textfile2.txt

    ```


    The results of the previous commands are the same: the archived .txt files are
    copied to the current directory. The x option extracts the files, z decompresses
    (unzips) the files, v makes the output, and f indicates that the next option is
    the name of the archive file (myfiles.tar.gz).


    # Using Compression tools


    Compression is an important aspect of working with backup files. It takes less
    disk space on your backup medium (CD, DVD, tape, and so on) or server to store
    files. It also takes time to transfer the archives to other media or download
    the files over a network.


    Although compression can save a lot of storage space and transfer times, it can
    significantly increase your CPU usage. You can consider using hardware compression
    on a tape drive (see http://tinyurl.com/5z60lt).


    > note See the man page of the mt command for details on how compression can be
    set via software for most magnetic tape drives.


    In the examples shown in the previous section, tar calls the gzip command, but
    tar can work with many compression tools. Out of the box on Mac OS X, tar will
    work with gzip and bzip2. The former is faster, but the latter offers more compression.


    If you are archiving and compressing large amounts of data, the time it takes
    to compress your backups can be significant. However, with each compression command,
    you can choose different compression levels, to balance the need for more compression
    with the time that compression takes.'
