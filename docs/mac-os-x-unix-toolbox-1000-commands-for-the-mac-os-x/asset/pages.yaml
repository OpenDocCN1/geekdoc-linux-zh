  md: '# Chapter 4: Working Files


    Changing permission, ownership, date/timestamps, or content of any hard link to
    a file results in all the others changed as well. However, deleting one link will
    not remove the file; it will continue to exist until the last link (or, technically,
    the last node on the hard disk) is deleted.


    Here are some examples of using the ln command to create hard and symbolic links:


    ```

    $ touch myfile

    $ ln myfile myfile-hardlink

    $ ln -s myfile myfile-symlink

    $ ls -li myfile*

    ```


    Note that after creating hard and symbolic links, you use the ls -li command to
    list the results. The -li option shows the inode associated with each file. You
    can see that myfile and myfile-hardlink both have the inode number of 292007 (signifying
    the exact same file inode number); myfile-symlink symbolic link has a different
    inode and although the hard link appears as a file (-), the symbolic link is identified
    as a link (i) with wide-open permissions. You won''t know if you can access the
    file link points until you try it or list the link target.


    # Using Device Files


    When applications need to communicate with your computer''s hardware, direct data
    to device files are stored in the /dev directory. Historically, devices were generally
    divided into block devices (such as storage media) and character devices (such
    as serial ports and terminal devices). Mac OS, however, uses only character devices
    to communicate with the hardware.


    Here are examples of device files:


    | ls -l /dev/ | List devices |

    |---|---|

    | crw-rw-r-- 1 root operator 0, 94 Jan 29 19:12 ac0 CD drive |

    | crw-rw-r-- 1 root operator 0, 85 Jan 29 19:12 ad0 Hard Drive |

    | crw-------- 1 chr tty 0, 100 Jan 31 06:07 tty0 Remote login terminal |

    | crw------ 1 chr tty 0, 60 Jan 30 07:18 tty1 First virtual terminal |

    | crw------- 1 root wheel 0, 61 Jan 29 19:12 tty1 Second virtual terminal |


