    # Mastering time


    Keeping correct time on your Mac OS X system is critical to the system’s proper
    functioning. You can set the time on your system in several different ways. System
    time can be viewed and set manually (with the date command) or automatically (with
    ntpdate or the ntpd service). Another time-related command is uptime, which shows
    how long your system has been up.


    # Changing time Zone


    Your Mac OS X system’s time zone is set on the contents of the /etc/localtime
    file. You can set a new time zone immediately by copying the file representing
    your time zone from a subdirectory of /usr/share/zoneinfo. For example, to change
    the current time zone of America/Chicago, you could do the following:


    ```

    # cp /usr/share/zoneinfo/America/Chicago /etc/localtime

    ```


    This can be accomplished by creating a symlink:


    ```

    # ln -s /usr/share/zoneinfo/America/Chicago /etc/localtime

    ```


    # Displaying and setting time and Date


    The date command is the primary command-based interface for viewing date and changing
    time settings, if you are not having done automatically with NTP (Network Time
    Protocol). Here are examples of date commands for displaying dates and times in
    different ways:


    ```

    $ date                              Display current date, and time zone

    Tue Aug 12 01:26:50 CDT 2008

    $ date +%a %b %d Display day, month, day of month, year

    Tuesday 12 2008

    $ date +"The date today is %F." Add words to the date command

    The date today is 2008-08-12.

    $ date +"TIME: %H:%M:%SDATE: %Y-%m-%d" Display TIME and DATE on separate lines

    TIME: 06:29:10

    DATE: 2008-12-18

    ```


