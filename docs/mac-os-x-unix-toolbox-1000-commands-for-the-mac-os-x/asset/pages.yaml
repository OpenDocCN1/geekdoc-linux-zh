    # AppleScripting


    Although technically not a UNIX thing, AppleScript is available on Mac OS X machine,
    and it can be used to great effect by system administrators. AppleScript was designed
    to be a very English-like language for doing things on Mac. Typical examples show
    how to create dialog boxes for copying files, downloading URLs, or controlling
    iTunes or iCloud.


    You can create AppleScripts with any text editor, but most of the time, you use
    the Script Editor (found at /Applications/AppleScript). When you open the Script
    Editor (see Figure 6-1), you use a simple editor that allows you to enter commands,
    run them, and record them.


    With the Script Editor open, let''s create your first AppleScript, admittedly
    one of the most useless programs ever written, but you''ve got to start somewhere:


    ```

    display dialog "I am a dialog box." --this is a comment

    ```


    After you enter this, click the Run button. As shown in Figure 6-2, the display
    dialog opens a dialog box with the argument printed in it (in this case, “I am
    a dialog box”). Two dashes (--) are treated as the comment marker—the compiler
    ignores anything after that on a line.


    Let''s create something more useful, something that can help us with administrative
    work. Let''s say that way we want to monitor a folder that contains certain files,
    such as files in the web server root. Again, we’re going to use the MAMP example
    (/Applications/MAMP/).'
