    # Text-Based e-mail Clients


    Most mail users (MUAs) are GUI-based these days, so if you began using e-mail
    in the past decade or so, you probably think of Evolution, KMail, Thunderbird,
    Mail app (on Mac OS), or (on Windows) Outlook, when it comes to e-mail clients.
    On the first UNIX and BSD systems, however, e-mail was handled by text-based applications.


    And you''ll likely be using Mail.App or any graphical e-mail client, it''s worth
    your time to become familiar with the text-based mail tools.


    If you find yourself needing to check e-mail on a remote server or other text-based
    environment, venerable text-based mail clients are available and still quite useful.
    In fact, hard-core geeks still use text-based mail clients exclusively for their
    efficiency and scoffing at HTML-based messages.


    The mail clients described in this chapter assume that your messages are stored
    in standard MBOX format on the local system. That means that you are either logged
    into the mail server or you have already downloaded the messages locally (for
    example, by using POP3 or similar).


    **Note** Text-based mail clients can be used to read mail already downloaded by
    other mail clients. For example, you could open your Evolution mail Inbox by typing
    `mail -f $HOME/.evolution/mail/local/Inbox`.


    The oldest, easiest command to use when you want a quick check for messages in
    the root user''s mailbox on a remote server, is the mail command (/bin/mail).
    If your $MAIL variable is set, log in as root and type mail. Otherwise, use the
    -f option, as noted earlier, to identify the mail file directly (mail -f /var/mail/root).


