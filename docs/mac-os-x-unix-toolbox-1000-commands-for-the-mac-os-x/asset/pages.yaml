    Media, a consulting group that builds CodeIgniter applications, writes technical
    documentation and copy, and works as a systems analyst for hire. He is the author
    of Lead Generation on the Web, No Nonsense XML Web Development with PHP, Professional
    CodeIgniter, and From Geek to Peak: Your First 365 Days as a Technical Consultant,
    well as dozens of articles on technology and business. If you have any feedback
    on this book, or wish to discuss anything related to Web development, writing,
    or marketing, contact him via his website at www.tripledogs.com.


    Christopher Negros is the author of the Fedora and Red Hat Linux Bibles, as well
    as BSD UNIX Toolbox. Chris served for eight years on development teams for the
