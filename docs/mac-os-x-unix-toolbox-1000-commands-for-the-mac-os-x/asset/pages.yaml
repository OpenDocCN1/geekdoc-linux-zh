    # adding Command-Line arguments


    We now have something that could be useful for the administrator trying to glean
    is happening. He or she can interactively run this command from a Terminal window
    to see what''s happening at any given moment.


    An administrator can also just as easily run this script using cron or launchd,
    and append the entries to a log file that then can be perused later. Each entry
    would be a small snapshot of the server at a given time.


    However, we haven''t even scratched the surface of what shell scripting offers
    us. For example, the cut pulls out the first and twelfth columns, giving us the
    current time and the one-minute server load. What if we wanted the current time
    and the fifteen-minute server load?


    We could create a second copy of our script and run that, but that seems like
    a waste. Why not for some command-line arguments? Let''s allow the user to run
    the script with one argument—either a 1, a 5, or 15, to indicate which server
    load read-out users.


    To allow that, we need to tell the script that it should allow arguments from
    the user to affect the script. The easiest way to do that is to add the special
    variable $1 to your script. In shell parlance, $0 refers to the command or script
    being run, and $1 through $9 to the arguments passed to that script or command.'
