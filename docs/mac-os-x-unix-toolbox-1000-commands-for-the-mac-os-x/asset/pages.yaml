  md: '# Chapter 4: Working with Files


    To create new directories for storing your data, you can use the mkdir command.

    Here are examples of using mkdir tmp to create directories in different ways:


    ```

    $ mkdir /tmp/new         Create "new" directory in /tmp

    $ mkdir -p /tmp/a/b/c    Create parent directories as needed for "new"

    $ mkdir -m 700 /tmp/new2 Create new2 with drwx------ permissions

    ```


    The first mkdir command simply adds the new directory to the existing directory.
    The second example creates directories as needed (subdirectories a, b, and c)
    to create the resulting new directory. The last command adds the -m option to
    set directories as well.


    You can identify the file as a directory because the first character in the 10-character
    permission string for a directory is d:


    ```

    $ file /tmp/new

    /tmp/new: directory

    $ ls -ld /tmp Sep 5 14:53 /tmp/new

    drwxr-xr-x 2 chris chris 4096

    ```


    Note that also execute bits (x) must be on if you want to be able to cd to that
    directory.


    # Using symbolic and hard Links


    Instead of copying files and directories, links can be set up to access that same
    file from multiple locations. Mac OS supports both soft links (usually symbolic
    links) and hard links.


    When you command to open a symbolic link that points to a file or change to the
    target of a directory, the command you run acts on the file or directory that
    is the target of your link. The link has its own set of permissions and ownership
    that you cannot see from the symbolic link. The symbolic link can exist on a different
    partition than the target. The symbolic link can exist even if the target doesn''t.


    > no Te When you use commands as tar to back up files that include symbolic links,
    there are ways of choosing whether or not the actual file is archived. If you
    do back the actual file, restoring the file can cause the link to be overwritten
    (which may not be what you want). See the tar page for details on different ways
    to back up symbolic links


    A hard link can be used only on files, not directories, and is basically a way
    of giving multiple names to the same physical file. Every physical file has at
    least one hard link, which is commonly thought of as the file itself. Any additional
    names (hard links) that point to that single physical file must be on the same
    partition as the original file (in fact, one way to tell that files are hard links
    is that they all have the same inode number).'
