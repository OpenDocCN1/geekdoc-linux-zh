  md: '# Chapter 8: Backups and Removable Media


    Time Machine will first make a backup copy of your entire Mac OS X volume to the
    destination drive, and then make hourly backups of any changes made on the system.


    However, some users will want to change the frequency of backups (say, every four
    hours instead of every hour) or exclude directories from the backup process. Many
    developers use SVN or some other system for managing source code and associated
    media files, and therefore don''t need the protection provided by an hourly backup.


    If you''re running on Leopard (Mac OS X 10.5), download a nice piece of freeware
    called Time Machine Scheduler (available at www.xieme.com/TimeMachinesScheduler.html)
    and install it. Time Scheduler enables you to change the backup intervals, skip
    backups during certain periods, and run manual backups.


    Note that some users will still need to start Time Machine backups from the command
    line—say, over an SSH session from remote. To do that, use the following command:


    ```

    /System/Library/CoreServices/backup.bundle/Contents/Resources/backup-helper &

    ```


    You could also add this to an iCal event, making it possible to run manual backups
    at specified times. Simply create an AppleScript with the following in, and attach
    it to an iCal event:


    ```

    do script "/System/Library/CoreServices/backup.bundle/Contents/Resources/backup-helper
    &"

    ```


    You can reset Time Machine''s interval with the following command:


    ```

    sudo defaults write /System/Library/LaunchDaemons/com.apple.backupd-auto StartInterval
    -int 7200

    ```


    The default interval for backing up is 3,600 seconds (one hour). You will need
    to know the sudo password in order to make this command work.


    # summary


    BSD and its predecessor UNIX systems handled data backups by combining individual
    commands that each handled a discrete set of features. Backups of your critical
    data can still be done this way. In fact, many of the tools you can use perform
    more securely and efficiently than ever before.


    The tape archive (tar command) has expanded well beyond its original job of making
    magnetic tape backups of data files. Because nearly every BSD, Linux, and UNIX
    system includes tar, it becomes a standard utility for packaging software'
