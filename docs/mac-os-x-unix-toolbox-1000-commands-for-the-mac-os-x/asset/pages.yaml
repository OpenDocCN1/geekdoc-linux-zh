  md: '# Chapter 12: Accessing Network Resources


    To do recursive copies from a particular point in the remote file system, use
    the -r option:


    ```

    $ scp -r mydir marlowe@server1:/tmp/    Copies all mydir to remote /tmp

    ```


    Although scp is most useful when you know the exact locations of the file(s) you
    need to copy, sometimes it''s more helpful to browse and transfer files interactively.


    # Copying remote Files in sftp and lftp sessions


    The sftp command enables you to use an sftp-like interface to find and copy files
    over SSH protocols. Here''s an example of how to start an sftp session:


    ```

    $ sftp kafka@server1

    afka@server1:password: *****

    sftp>

    ```


    Use sftp in the same manner as you use remote ftp clients. Type ? for a list of
    commands. You can change remote directories (cd), change local directories (lcd),
    check current remote and local directories (pwd and lpwd), and list remote and
    local contents (ls and Ils). Depending on the permissions of the user you logged
    in as, you may be able to create and remove directories (mkdir rmdir), and change
    permissions (chmod) and ownership/group (chown and chgrp) of files and directories.


    You can also use lftp (discussed earlier in this chapter) as an sftp client. lftp
    adds some user-friendly features such as path completion using the Tab key:


    ```

    $ lftp sftp://kafka@server1

    Password: *****

    lftp kafka@server1:~

    ```


    # sharing r remote Directories


    The tools described up to this point in the chapter provide atomic file access,
    whereby a connection is set up and files are transferred in one shot. When more
    persistent, ongoing access to a remote directory of files is needed, services
    for sharing and mounting remote file systems can be most useful. Such services
    include Network File System (NFS) and Samba.


    # sharing r remote Directories with nFs


    Before sharing directories from your BSD system with NFS, you must start the NFS
    service. To do this in OS X, simply run the following command:


    ```

    sudo nfsd

    ```'
