  md: '# Chapter 10: Managing the System


    # Using network time protocol to set Date/t time


    When you Mac OS X, you are given the opportunity to set your time zone and to
    see whether your system clock reflects local or UTC time. Your system displays
    the date and time based on your hardware clock and time. As noted earlier, one
    way to ensure that your system’s time doesn’t drift is to use the NTP.


    The ntp daemon is installed with the Mac OS X system. Its configuration file is
    at / etc/ntp.conf and will likely have an entry in it like the following:


    ```

    server time.apple.com minpoll 12 maxpoll 17

    ```


    In other words, poll the server time.apple.com every 12 to 17 seconds to keep
    the time accurate on the system. However, just having this enabled isn’t enough.
    You need to also toggle the automatic updates.


    To do that, click System Preferences in your Dock, and click Date and Time. From
    the Date & Time tab, shown in Figure 10-1, check the box next to “Set date & time
    automatically.”


    ![](img/d850b48b6750d726fcc813a2a895d7cc_164_0.png)


    Figure 10-1: Setting the date and time automatically


    # Checking Uptime


    A matter of pride BSD and other UNIX enthusiasts is how long they can keep their
    systems running without having to reboot. Like other BSD systems, Mac OS X systems
    have been known to run for years without having to reboot.


