  md: '# Chapter 9: Checking and Running Processes


    Because you know there is only one init command running, you next use the -l option
    to select each process command (to know which two processes are used up):


    ```

    $ pgrep -l init

    2617 xinit

    1 init

    ```


    Show PID and name for any process including ''init'' string


    You can also search for processes that are associated with a particular user:


    ```

    $ pgrep -lu kafka

    2803 vim

    2552 bash

    2551 sshd

    ```


    List all processes owned by user kafka


    Probably the most useful way to use pgrep is to have find the process IDs of the
    running processes and pipe those PIDs to another command to produce the output.
    Here are some examples (for other commands like Metacity or Firefox isn''t running):


    ```

    $ ps -p `pgrep metacity`

    PID STAT COMMAND

    2617 ?? 00:07.02 /usr/local/bin/metacity --mm-client-id=default0

    $ ps -fp `pgrep init`

    PID STAT TIME COMMAND

    2617 V I+ 00:00.01 /usr/X116/bin/home/chris/.xinitrc

    # renice -5 pgrep safari

    20522:old priority 0, new priority -5

    20557:old priority 0, new priority -5

    ```


    Any command that can take a process ID as input can be combined with pgrep in
    these ways. As the previous example of pgrep illustrates, you can use commands
    such as renice to change how a process behaves while it is running.


    # Using fuse to find processes


    Another way to locate a particular process is by finding what the process is accessing.
    The fuse command can be used to find which processes currently have a file or
    socket open. After the processes, fuse can be used to send signals to those processes.
    The fuse command is most useful for determining whether files are being held open
    by processes on mounted file systems (such as hard drives or Samba shares). Finding
    those processes enables you to close them properly (or just kill them if you must)
    the file system is unmounted cleanly.


    Here are some examples of the fuse command for listing processes that have files
    open on a selected file:


    ```

    $ fuse -cu /Users/myerman (with user name)

    /Users/myerman: 12958c(myerman)

    ```


