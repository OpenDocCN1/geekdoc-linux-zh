    # # Remote System Administration


    Most professional UNIX administrators do not run a graphical interface on their
    Internet servers. As a result, when you need to access other computers for remote
    administration, you will almost surely need to work from the command line at some
    time. Luckily, there are feature-rich UNIX commands to help you do so.


    +   In THIS ChapTeR

    * Configuring SSH

    * Using SSH for remote login

    * Using SSH to do tunneling

    * Using SSH with private keys

    * Using screen, a remote multiplexing terminal

    * accessing remote Windows desktops

    * Sharing remote desktops with Vnc


    Tools associated the Secure Shell (SSH) service not only enable remote login and
    file transfer, they also offer encrypted communication to keep your remote administration
    secure. With tools such as Virtual Network Computing (VNC), you can have a server''s
    remote desktop over your local client computer. These and other features for performing
    remote systems administration are described in this chapter.


    # # Remote Login and Tunneling with SSH


    BSD systems, like their big brother UNIX, grew up on university networks. At a
    time when the only users of these networks were students and professors, and with
    networks mostly isolated from one another, there was little need for security.


    Applications and protocols that were designed in those times (the 1970s and 1980s)
    reflect that lack of concern for encryption and authentication. SMTP is a perfect
    example of that. This is also true of the first generation of UNIX tools: telnet,
    ftp (file transfer), rsh (remote shell), rcp (remote copy), rexec (remote execution),
    and rlogin (remote login). These tools send user credentials and traffic in clear
    text, making'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Chapter 13: Remote System Administration


    them very dangerous to the public, untrusted Internet; they have become mostly
    deprecated and replaced with the Secure Shell (SSH) commands (ssh, scp, sftp commands,
    and related services).


    Although there are still some tools for the legacy remote commands (see the “Using
    Legacy Tools” sidebar, most of this section describes how to use SSH commands
    to handle the majority of your needs for remote communications.


    # Using Legacy Communications Tools


    Despite the fact that SSH provides better tools for remote communications, legacy
    communications commands, sometimes referred to as r commands, are still included
    with most BSD distributions. Some of these tools will perform faster than equivalent
    SSH commands because they don''t need to encryption. Therefore, some old-school
    UNIX administrators may use occasionally on private networks or include them in
    old scripts. Although for the most part you should ignore legacy remote commands,
    some of these commands in particular can be useful in some cases: telnet.


    The telnet command is still used to communicate with some network appliances (routers,
    switches, UPSs, and so on) that do not have the horsepower to run an ssh daemon.
    Even though telnet poses a security risk, some appliance manufacturers include
    support for it anyway.


    One way to use the telnet command is for troubleshooting many Internet protocols
    such as POP, SMTP, HTTP, and others. Under the hood, these plain-text protocols
    are simply automated telnet sessions when a client (such as a browser or mail
    agent) exchanges text with a server. The only difference is the TCP port in use.
    Here is an example of how you could telnet to HTTP port (80) of a web server:


    ```

    $ telnet www.example.com 80

    Trying 208.77.188.166...

    Connected to www.example.com.

    Escape character is '']''.

    GET /index.html

    <!DOCTYPE html PUBLIC "-//W3C//DTD HTML 1.1//EN"

    "http://www.w3.org/W3C/DTD/xhtml11-1.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">

    <head>

    <title>My Web Ser...</title>

    ```


    Similarly, you can telnet to a mail server on port 25 (SMTP) and 110 (POP3) and
    for more descriptions of using the telnet command to troubleshoot network protocols,
    refer to the Linux Troubleshooting Bible (Wiley, 2004).


    If you need to forcibly exit your telnet session, type the escape sequence (Ctrl+]
    by default). This will stop your keyboard input to the remote end and bring you
    to the telnet command prompt where you can type quit or ? for more options.


    178'
