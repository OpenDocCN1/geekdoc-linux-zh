    ```

    $ ssh -L 12345:google.com:myserver

    ```


    With this example, any connection to the local port 12345 is directed across an
    SSH tunnel to myserver, which in turn opens a connection to Google.com port 80.
    You can now browse to http://localhost:12345 and use myserver as a relay to the
    Google.com website. If you only intend to use ssh to forward a port, and not to
    obtain a shell on the server, you can add the -N option to prevent the execution
    of commands:


    ```

    $ ssh -L 12345:google.com:80 -N myserver

    ```


    # Using SSH with public key authentication


    Up to this point, we''ve only used ssh with the default password authentication.
    The ssh command also supports public key authentication. This offers several benefits:


    +   Automated logins for scripts and cron jobs: By assigning an passphrase you
    can use ssh in a script to login automatically. Although this is convenient, it
    is also dangerous, anybody who gets your key file can connect to any machine.
    Configuring for automatic login can be done with a passphrase and a key agent.
    This is a trade-off between convenience and security, as explained later.


    +   Two-factor authentication: When using a passphrase-protected key interactive
    logins, authentication is done using two factors (the key and the passphrase)
    instead of one.


    # Using Public Key Logins


    Here''s the process to set up key-based communications between BSD systems. In
    the following example, we use empty passphrases for no-password logins. If you
    prefer to protect your key with a passphrase, simply enter it when prompted during
    the first step (key creation).


    On the client system, run the following ssh-keygen command to generate the key
    pair while logged in as the user needs to initiate communications:


    ```

    $ ssh-keygen

    ```


    ```

    Generating public/private rsa key pair.

    Enter file to save the key (/home/chris/.ssh/id_rsa): <Enter>

    Enter passphrase (empty for no passphrase): <Enter>

    Enterter same passphrase again: <Enter>

    Your identification has been saved in /home/chris/.ssh/id_rsa.

    Your public key has been saved in /home/chris/.ssh/id_rsa.pub.

    The key fingerprint is:

    ac:db4a:a8e3:f2a:90:4f:f59:b4:44:74:e0:d3db chris@host.domain.com

    ```'
