  md: '# Chapter 6: Advanced Scripting


    Using the open command with a URL will open a Safari window or tab:


    ```

    open http://www.google.com

    ```


    Finally, the -f flag enables you to pipe input to a text editor. This is potentially
    useful, as you could create a series of piped commands (or even standard input)
    and then have it all end up in a text editor.


    For example, if you needed to get a sorted list of all CSS files in all subdirectories,
    and then pipe that to your TextEdit document, you could do this:


    ```

    ls -1 * | egrep "\.css$\$ | sort -u | open -f

    ```


    The result is shown in Figure 6-6.


    ![](img/d850b48b6750d726fcc813a2a895d7cc_114_0.png)


    Figure 6-7: Sending Piped Input to TextEdit with the open command


    One final note before we leave this subject. Many applications like BBEdit contain
    advanced command-line tools that enable you to do even more work right on the
    command line.


    For example, if you''re in a BBEdit, open BBEdit and select BBEdit ⌘ Install Command
    Line Tools from the menu. This will install two new tools on your system: bbedit
    and bddiff. The first enables you to open files directly in BBEdit from the command
    line; the second enables you to run a diff program in BBEdit.


    the bbedit works on multiple files; you can even pipe in commands to get the output
    into BBEdit. Typing in the command


    ```

    ls -la | bbedit

    ```


    results in a directory listing being sent to BBEdit (see Figure 6-8).


    89'
