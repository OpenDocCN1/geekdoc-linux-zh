  md: '# Chapter 2: New to Mac OS X?


    # Learning to Love Launchd


    Starting with Mac OS X 10.4 (Tiger), Apple introduced a new system startup program
    launchd. the launchd daemon takes over many tasks from cron, xinetd, mach_init,
    and init, all of which have traditionally handled system initialization, called
    scripts, run startup items, and prepped the system for the user.


    All of these systems still exist on Mac OS X, but launchd has superseded them
    in many instances. The launchd daemon isn''t just a cosmetic change, however.
    First it gives you a way to automatically launch programs (you no longer have
    to look at it and other places, not to mention maintain separate config files).
    Second, it provides a big boost to the system. Finally, it provides a more secure
    way of handling new processes.


    For example, when a nonroot user launches a program, the launchd daemon handling
    the jobs with nonroot user privileges, offering an extra layer of security. From
    a performance perspective, this new launchd only uses system resources when it
    is started, and can be independently shut down and restarted as needed.


    What does this all mean to you? You may need to stop and think a bit before instinctual
    responses to certain tasks. For example, there is no need to write a script that
    monitors a folder—launchd already does automatically. Nor is there any need to
    cause a system reboot to launch a new job, as launchctl (the launch job controller)
    enables you to keep the user in his or her workflow.


    You''ll learn more about launchd in Chapter 9. For now, know that it''s there
    and that it may represent a new way of working for you.


    # Summary


    In this chapter, you learned a few things about Mac OS X and how it differs with
    the brand of UNIX that you may be familiar with. Regardless of whether you come
    from another BSD flavor, UNIX, System V, or some other variety of UNIX, you''ll
    find that most things are still the same in Mac OS X.


    By the end of this chapter, you should have easy access to Terminal in your Dock,
    your Utilities folder should be in a handy stack, and you should be familiar with
    the folder structure and your home directory. You''ve also downloaded Fink to
    get access to additional utilities and tools as needed, and it is hoped that you''re
    feeling better about automounting and launchd.


    It''s now time to become more familiar with Terminal and the shell.'
