  md: '# Appendix F: Perl Primer


    Other common things you''ll see in this script are follows:


    +   - Scalar variables (i.e., variables that store one value) begin with a dollar
    sign ($)

    - Arrays (i.e., a list of scalar values) begin with an ampersand (@). Not used
    in this script are associative arrays, which begin with the percent symbol ($).

    - The use command enables you to use another module or package, making it easy
    for you to get things done.

    - The body of the script is a simple foreach loop that iterates over the links
    that have been extracted by HTML::LinkExtor. It is considered a very Perlish thing,
    that little foreach loop. Many programmers don''t use it, opting to use the foreach
    loop. Learn to love the foreach, as it gives you a lot of power.

    - The while block gives you a different kind of power—a block of code that continues
    some state changes. In our case, the while inside the foreach loop keeps running
    until we get to the end of our link elements.


    +   In Perl, you can use the my operator to restrict a variable to a certain block.
    In the preceding code, the @element array and the $selt_type are both primitive
    to the foreach block.


    Let''s go through this script section by section to get a better understanding
    of what''s going on.


    # Initializing the script and Loading Packages


    The few lines of the script are very straightforward. We need to initialize the
    script with a she-bang line and then load up our two packages.


    The she-bang line is fairly standard. Just tell the script where to find the Perl
    interpreter (you can double-check your installation by typing in the appropriate
    Perl version on the command line). Be sure to add the -w flag to throw warnings:


    ```

    #!/usr/bin/perl -w

    ```


    Once you''ve done that, load your two packages with the use command:


    ```

    use HTML::LinkExtor;

    use LWP::Simple qw(get head);

    ```


    Notice that when we use the LWP::Simple package (a lightweight user agent that
    is useful in browsing URLs), you are only loading two functions (get and head)—that''s
    all we really need to make our script work, as we''re not planning on doing anything
    too advanced.


    The nice thing about doing this things is that you don''t have to know anything
    about how these packages work, nor do you need to invent functionality. It it


    242'
