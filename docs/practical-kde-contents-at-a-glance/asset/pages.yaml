    Getting Help in a Hurry:

    The KDE Mailing Lists'
  merge: -1
  pgno: 688
- img_proc: true
  md: '# APPENDIX C Getting Help in a Hurry: The KDE Mailing Lists


    It is possible that your Linux distributor has done some flaky work with KDE so
    that at level, you will need to handle problems you encounter at that level, either
    through the distributor''s technical support or through its own mailing lists.
    (New Linux users should subscribe to their distribution''s mailing lists, anyway.
    You''ll find the means to do so on the distributor''s Web page someplace.)


    There are also many KDE-sponsored mailing lists, which are great places for information,
    problem solutions, news of new KDE developments, and so on. These resemble usenet
    newsgroups in many ways, but they arrive in your mailbox instead of requiring
    you to open a newsreader to find them. If you have a specific problem or question,
    it''s a good idea to check the mailing list archives (http://lists.kde.org/) first,
    to see whether your question is answered there, as is very likely. The search
    engine is remarkably good. You''ll find your answer quickly.


    To subscribe to one or more of the KDE lists, go to www.kde.org/contact.html.
    Full information on subscribing (and unsubscribing) is available there.


    The KDE mailing lists include the following:


    +   - kde—General discussion of KDE-related issues

    - kde-announce—Announcements of new KDE applications

    - kde-user—Users help each other (making it the first list to search in the archives,
    too)

    - kde-dev—For application developers (both applications in core KDE and contributed
    applications, but not the place to report bugs, wishes, or complaints)

    - kde-core-dev—For developers of core KDE applications and support

    - kfm-dev—For developers interested in issues related to KDE''s file manager

    - koffice—For developers interested in KOOffice

    - kde-licensing—Discussion of licensing issues

    - kde-look—Discussing look and feel issues

    - kde-artists—Discussion of icons and other artwork

    - kde-pim—For developers of personal information managers, mail clients, calendars,
    and organizers


    Note: Do not post HTML-formatted messages on the KDE (or, really, any Linux) mailing
    lists. Many of the subscribers pay by the unit, either of time or of transfer,
    for their Internet service, and doubling the size of the download so you can amuse
    yourself with blue text or a trick typeface is not likely to bring the results
    you seek.'
  merge: -1
  pgno: 689
- img_proc: true
  md: '# PART IX


    # APPENDIX C


    Additionally, many use console-based mail applications, and HTML looks really
    silly in these applications and is customarily deleted without reading. HTML suggests
    that you don''t know what you''re doing.


    Here are some observations and recommendations about the KDE lists. First, they
    are not for general Linux users and posting general Linux users there will very
    likely get slapped down, depending on the mood of the other participants that
    day.


    Second, you probably want to subscribe at least to kde-announce. This is where
    the availability of new KDE applications and new versions of kde itself are made.


    The general KDE list makes for interesting reading, while kde-user is where you
    get down and dirty in sorting out configuration issues and the Netiquette requires
    that you look in the archives for an answer to your question before posting it
    the group, but this rule is usually observed by flagrant disregard. Subscribing
    to kde-dev is a fine thing to do if you''re interested in knowing the thinking
    of the developers and if you''re interested in hacking the code yourself. It is
    not, however, the place to ask configuration questions. (The exception is if you
    are beta testing either beta releases or daily "snapshots" of KDE, in which case
    you can, of course, point out when a build fails for the lack of a file or something
    of that order.)


    Though the KDE mailing lists involve people from dozens of countries, they are
    officially in English.'
