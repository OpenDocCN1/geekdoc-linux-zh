  md: '# PART III Using the Applications in the KDE Distribution

    CHAPTER 13 Keeping Track of Your World with KOrganizer


    In the DOSrative, they''re called PIMs (Personal Information Managers). If you
    see some of the advertisements by the companies that make PIMs, they assure that
    your path to affluence and influence is unencumbered by missed appointments or
    social pas.


    KDE has a personal information manager named KOrganizer. It comes without such
    claims, but you''ll see that it is as full-featured a product as some of the expensive
    commercial products, and it is getting better with each new version. It departs
    in many areas from KDE''s conventions, making it a little harder to learn than
    some KDE applications. And while it is full-featured, it will not automatically
    order flowers and make dinner reservations on your wedding anniversary. It does,
    however, remind that the anniversary is coming up and equips you with the names
    and numbers of the florist and restar. Then again, if you have the email addresses
    of these establishments, it might just do those things, in short.


    KOrganizer is located at K Menu > Applications > Organizer, but many users make
    one of the first applications they add to K Panel, as you learned to do in Chapter
    7, "Making a Super K Panel." It employs its native file format the ASCII vCalendar
    protocol, which means that if you have been using a PIM in a different operating
    system, there is a good chance that some or all of your data can be exported to
    KOrganizer. It additionally offers tools for synchronization with the 3Com PalmPilot
    digital assistant. Its other features include


    +   - A full calendar program with national holidays marked for your choice from
    many nations.


    +   - An appointment book with multiple levels of alarms that are triggered by
    a small, separate program so that KOrganizer doesn''t need to run all the time.


    +   - A running To do list.


    +   - A link to the Kaddressbook applet.


    +   - Group capability for use by more than one of an organization, business,
    or family.


    +   - The capability to mail appointments to others on the local network or even
    over the Internet.


    +   - A wide choice of view options, from a simple calendar to a complex matrix
    of all KOrganizer''s elements at once.


    A program that offers all this is bound to be complicated, and in some respects
    KOrganizer is. It''s nothing that you can''t quickly get to, but not everything
    works exactly as your first guess would suggest.'
