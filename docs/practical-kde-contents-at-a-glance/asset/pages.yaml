  md: '# INTRODUCTION


    +   - Dialog box—This is any window that appears for configuration purposes.

    - Tabs—These are located across the top of some dialog boxes. They resemble the
    tabs atop folders in a file drawer. The important thing to remember is it''s possible,
    though not likely, to confuse tabs in this usage with the Tab key on your keyboard.
    Let context be your guide.

    - Drop list—This is a variable in a dialog box that provides a listing of choices
    from which you may select one. The list is visible by clicking on the underlined
    downward-pointing triangle on the right side of the default item.

    - List box—This is similar to a Drop list, but rather than clicking on the icon
    at the right, you scroll up and down using the appropriate triangles until you
    find the setting you want. This is widely used in KDE, but is found in some applications.

    - Text box—This is a place where you must enter information via the keyboard.

    - Radio button—This is a round button that is selected by clicking it or using
    the Tab key to get to it, and then pressing the spacebar or Enter key to select
    it. It will get a dot in its center or change color to signify it is selected.
    Under the rules of KDE (and GUI programming standards in general), a radio button
    is used in a listing of possible configurations when and only one of the possibilities.

    - Check box—This is a square button that is selected by clicking it or using the
    Tab key to get to it and then pressing the spacebar or Enter key to select it.
    When selected, it turns a darker shade of gray, unless the Draw Widgets in the
    Style of Windows 95 choice is made in desktop styles. In that case, a check mark
    appears. Under the rules of KDE (and GUI programming standards in general), a
    check box is employed in a listing of possible configurations when more than one
    of the choices can be selected. (This convention is not always observed, however,
    and there are places where the choices offered by check boxes are mutually exclusive.)

    - Text button—This is a button that contains text and, when clicked, does what
    it says. The ones you will encounter most contain text saying Help, Default, Apply,
    and Cancel, usually (but not always) in that order.


    Additionally, some conventions we will employ in the text itself to make examples
    and other information stand out. For instance, there will be places where a listing
    of programming code, a shell script, or even an ASCII text configuration file
    will be shown. When we do that, it will look like Listing 1.1.'
