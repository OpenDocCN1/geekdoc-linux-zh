  md: '# PART VIII On the Leading Edge with KDE

    CHAPTER 35 Upgrading to the Latest KDE Version


    Unlike other GUIs for the PC, and like most Linux applications, KDE is constantly
    being improved. To upgrade, though, you do not install a "fix pack" or something
    incremental; you have to install a whole new version if you want to upgrade the
    core distribution or the applications it contains. You, of course, upgrade individual
    applications not part of the core package without updating the whole she-bang.
    That is, unless the app you can''t live without a new KDE, which can be found
    in the documentation of the application''s source code. You should always read
    that documentation anyway, though many of us have fallen into the bad habit of
    doing so only if a program fails to compile or run.


    The most time-consuming part of this is often the download. All of the KDE packages,
    can run up to 20MB or more. Downloading can take a while.


    Then, depending on the form in which you get your new KDE, upgrading is easy and
    can be quick. (If you roll your down, compiling can take several hours.)


    We are now in an era, though, in which upgrading is a little more complicated
    than it has ever been before, and can be perilous. For the first time, it''s possible
    to really make a mess of things—believe me, because I''ve done it—unless you know
    exactly what you are doing. After you''ve read this chapter, you will.


    # Getting the Right Version


    There now exist various incarnations of two major versions of KDE. Unless you
    are reading this late in 2000 or later, your distribution can come with a variation
    of KDE Version 1. The final version in this series is KDE 1.2. KDE is built atop
    the QT libraries (www.troll1.no.). All 1.X versions of KDE work with QT-1.42 or
    QT-1.44. Unfortunately, QT-1.4X is becoming more difficult to find. If you have
    QT-1.44, hang on it!


    But KDE 2.0 is beginning to exist (as I write this, and the situation will get
    worse, which is to say much more complicated for the upgrader). KDE 2.0 is in
    many respects incompatible with KDE 1.X. KDE 2.0 requires QT-2.0 or better; KDE
    1.X will not work with QT-2.0 or better. (Recipes under development will allow
    applications based on QT-1.4x to run on a system running KDE-2.0 and QT-2.x. These
    are subtle, unlike the allows of a Linux system to run both libc5 and glibc applications.
    Once a stable KDE-2.0 distribution is finalized, a document is certain to be made
    available to make the peaceful coexistence of both Qt easier.)


    This means that you can now download and compile things that absolutely refuse
    to live together. Life used to be simpler.'
  merge: -1
  pgno: 643
- img_proc: true
  md: '# PART VIII

    Back Up Your Existing KDE, If You Can CHAPTER 35


    If you want merely to upgrade your KDE 1.X to the latest KDE 1.X, as long as you

    make sure you''re downloading the right KDE distribution, you''re in good shape.

    You probably don''t have to upgrade your QT unless you have a very old Linux

    installation, in which case you want QT-1.4 as well.


    For the next little while, we are proceeding as if this is what you have in mind;
    we''ll

    get to fiddling around KDE 2.0 in a page or two.


