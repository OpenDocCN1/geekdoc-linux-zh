  md: '# Quick Access to the Prompt: MiniCLI


    Sometimes it''s necessary to execute a quick command: something that doesn''t
    require a whole terminal session to do. Perhaps you want to confirm that the string
    you''re putting in a .kdel is accurate, or maybe you want to start an application
    that is buried in several layers of menus.


    For these purposes and others, there is the MiniCLI: Miniature Command Line Interface.
    (You hear reference all the time in Linux to the cli, which means you should do
    it from a command prompt.) There are two ways to get to it. The first is to right-click
    on the desktop and from the resulting menu click Execute command. The other is
    to press Alt+F2, anywhere, anytime.


    Either way, you will be treated to what you see in see Figure 11.13.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_279_0.png)


    FIGURE 11.13

    The MiniCLI2 provides instant access to Linux commands.


    The niftiest use of MiniCLI, though, is in the reading of man pages, the first-line
    Linux documentation. Man pages are normally pretty ugly and unpleasant and all
    too frequently completely inscrutable. MiniCLI can''t help with the content, but
    it can beautify man pages considerably. For example, this (see Figure 11.14) is
    how a man page looks in kvt, where the command that summons the page is man crypt
    followed by the Key.


    Ah, but let us do it the modern, scientific way with MiniCLI (see Figure 11.15).
    Note the colon between the man command and the page being sought (in this case,
    crypt).

    The result is shown in Figure 11.16. Nice, he?


    MiniCLI also accepts URLs and antheims to open the location specified. It can''t
    entirely replace the virtual terminal, but what it does does very well.'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# PART II Quick Access to the Prompt: MiniCLI CHAPTER 11


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_280_0.png)


