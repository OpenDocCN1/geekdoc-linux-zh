  md: '# KDE Command Reference and Key Bindings


    In large measure, KDE and its applications maintain common conventions in the
    various commands perform and the hotkeys that bring them about.


    The following table lists the various parts of KDE that handle particular functions,
    the key combinations that bring them about, and what they do. Some KDE applications
    may vary from this list, but for the most part they are consistent. KDE''s rules
    require that all applications observe the bindings labeled "ALL"


    In many cases, the user can change key bindings. In those cases, the items listed
    are the defaults, which can be changed (or restored) in the KDE Control Center.


    | Program | Command | What It Does |

    | --- | --- | --- |

    | All | Open | Ctrl+O | Opens a file |

    | | Open > New | Ctrl+N | Creates new file |

    | | Close | Ctrl+W | Closes current file |

    | | Save | Ctrl+S | Saves current file |

    | | Print . | Ctrl+P | Prints current file |

    | | Quit | Ctrl+Q | Quits current program |

    | | Cut | Ctrl+X | Cuts marked text, puts marked text into Clipboard |

    | | Copy | Ctrl+C | Copies marked text into Clipboard |

    | | Paste | Ctrl+V | Pastes text from Clipboard into cursor position |

    | | Undo | Ctrl+Z | Undoes last operation |

    | | Find | Ctrl+F | Finds specified text |

    | | Replace | Ctrl+R | Finds and replaces specified text |

    | | Insert | Insert | Toggles insert/overwrite mode |

    | | Home | Home | Goes to beginning of current line |

    | | End | End | Goes to end of current line |

    | | Page Up | Page Up | Goes to previous page |

    | | Page Down | Page Down | Goes to next page |

    | | Help | F1 | Opens help for current program |

    | Desktop | Mini CLI | Alt+F2 | Opens MiniCLI for command |

    | | K Menu | Alt+F1 | Produces K Menu |

    | | X Kill | Alt+Ctrl+Esc | Produces kill icon; click on application to force
    it closed |

    | Switch desktop | Shift+Ctrl+← | Switches one desktop down |

    | | | Shift+Ctrl+→ | Switches one desktop to the right |

    | | | Shift+Ctrl+← | Switches one desktop to the left |

    | | | Shift+Ctrl+↑ | Switches one desktop up |

    | | Task List | Ctrl+F1–F8 | Switch to desktop 1–8 |

    | | | Ctrl+Esc | Produces list of running applications |

    | Close Window | Alt+F4 | Closes active window |

    | Window | Alt+F3 | Opens Windows Menu for active window


    Additionally, all menu accelerator keys are activated using Alt as the meta key.'
  merge: -1
