  md: '# PART II


    # You Can Change Your Desktop Fonts, Too


    In addition to the colors on your desktop and the background, you have a choice
    of typefaces and font sizes for the items and labels that are part of your KDE
    desktop. Bring this about by clicking on the Fonts tab in the Display Settings
    dialog box, resulting in the dialog box in Figure 5.19.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_128_0.png)


    FIGURE 5.19

    nThe Fonts tab lets you change your onscreen typefaces.


    The Difference Between Fonts and Typefaces

    With the coming of the computer age, the word font has come to be greatly misused,
    employed the word typeface is meant. The name of the kind of type is the typeface;
    typeface in a particular size is a font. Helvetica and Times are typefaces. Helvetica
    12pt is a font. The KDE Fonts tab is one of the few places in computing where
    the distinction is properly made.


    Changing the typeface and size for a particular screen element is as simple as
    can be be: First, select the screen element you want to alter. Then click the
    Typeface drop box (see Figure 5.20).


    115'
