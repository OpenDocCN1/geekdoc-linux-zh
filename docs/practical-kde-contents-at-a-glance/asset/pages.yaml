  md: '# PART VIII On the Leading Edge with KDE


    # CHAPTER 37 Using KDE on Notebook and Portable Computers


    If you can get Linux and the X Window System working on your laptop notebook computer,
    you can use KDE there. I know...thanks a lot!


    Actually, you can outfit portable computers with Linux and the X Window System
    fairly readily. Not long ago the person who hoped to use Linux on a machine was
    forced to be a pioneer. You haven''t really experienced configuration until you
    calculated your own Free86 video chip and LCD screen settings.


    But life is sweeter now, thanks to a Web site. It''s the Linux on Laptops page,
    which you can find at www.utex.edu/users/kharker/linux-laptop/. Kenneth E. at
    the University of Texas, Austin, Department of Computer Science has constructed
    a page that has onsite or by link just about everything there with the deployment
    of Linux on portable computers. This includes a repository of XF86Config files
    for many notebook chipsets and LCD panels for many popular makes and models of
    laptop and notebook computers. It also offers a listing of Web pages where you
    can get instructions for the installation of Linux on particular models, software,
    and newsgroups of interest to the notebook user. If you plan to put Linux on a
    notebook machine, it''s just plain foolish not to gather and use the information
    on the Linux on Laptops page.


    # Guerrilla Installation


    On machines, just how far you''re willing to go govern your success. For instance,
    on my Toshiba Portable 300CT, I had to remove the hard drive (easy, actually)
    and pop it into the desktop machine to put Linux on. that the drive provided with
    the machine was a tad small, I took the opportunity to get a bigger, faster one.
    (If you decide to upgrade a notebook hard drive, make certain that you get one
    that physically fits into your portable.) This involved, for about $10, an adapter
    that allowed the little drive to be hooked up to the IDE cable in my desktop computer.
    It also allowed me to copy data files and configurations so that I didn''t have
    to reconfigure a lot of applications and install the proper XF86Config file for
    the Toshiba''s unusual 1024x600 pixel display. Those who use the little Toshiba
    Libretto—imagine a UNIX box that weighs two pounds—have to calculate special strategies
    because the little PCMCIA floppy drive included with that machine isn''t supported
    in Linux. If you have a CD reader built into your notebook machine and you can
    boot from it, installation will likely be a lot easier.


    After you get Linux on your portable computer, you may want to do things to take
    advantage of some of the machine''s advanced features. The first and most obvious
    is to enable Automatic Power Management in the kernel, which usually doesn''t
    require you to recompile the kernel, but it can.'
