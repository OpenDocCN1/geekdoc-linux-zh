  md: '# PART V KDE on the Network


    # CHAPTER 25 Running Your System Through KDE


    # Samba Management


    If you use a mixed network involving not just Linux machines but Windows machines
    as well, you''ll probably employ SMB (Session Message Block) services to share
    drives, printers, and possibly other devices.


    KDE does not provide a means for setting up shares, but it does allow you to monitor
    these resources through a program, the Samba Status Monitor, found at K Menu >
    Settings > Information > Samba Status.


    Samba is not an complicated thing, and its administration is far beyond the scope
    of this book. While some documentation for Samba is included in your Linux distribution—the
    SMB Howto is a good place to start—you may want to get additional information
    from a more general Linux networking manual if you want to undertake setting a
    Samba share system on your network.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_537_0.png)


    # Other Controls You May Want to Use


    Several KDE applicationsandthe number is growing all the time—are of great use
    to the system administrator but are not part of the core KDE distribution. These
    are available from or linked to the KDE Web site, www.kde.org.


    Here are a few and what they do.


    # Firewall


    This program helps administer the IP chains program, enabling a firewall between
    your local machine or network and the outside world. To use it, you need some
    familiarity with IP chains, which information you can get from any comprehensive
    and detailed Linux manual (which is to say, any one not shipped with a Linux distribution
    from a Linux vendor). KFirewall handles the administrative tasks from within KDE,
    graphically, if you are the root user.'
  merge: -1
  pgno: 537
- img_proc: true
  md: '# PART V


    Other Controls You May Want to Use CHAPTER 25


    # Kinst


    This program makes the preparation of KDE applications for installation on machines
    throughout the network easier. You can make system-specific packages for use within
    your organization, thereby obviating the need for configuring machines individually.


    # KNdump


    This program lets you look at what is happening on your network connections, be
    local or via dial-up connection.


    # kpm


    Similar to Kopt but a little more stark, kpm (see Figure 25.16) stands for process
    manager. When it has been built and installed, you''ll find it at K Menu > Utilities
    > Process management.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_538_0.png)


    FIGURE 25.16


    kpm offers, in a more compact form, everything you''ll find in Kopt, the standard
    KDE process manager. The system administrator may if, by just kill any process
    on the system. It''s entirely-driven and easy to use.


    # KNetmon


    This is a miniature suite of applications for keeping track of what is going over
    a network using Samba, NFS, or both. It shows literally everything going on


