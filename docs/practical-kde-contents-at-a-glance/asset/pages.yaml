  md: '# PART IV

    Network Utilities: GUI for Common Internet Functions CHAPTER 24


    You start Kfinger by executing K Menu > Internet > User Information. Kfinger goes
    by many names, Kfinger and User Information being two of them. It''s also called
    KDE Finger. It obtains information about users on the local system, or if a username
    and the name of a remote system is supplied, it provides information about the
    user name and above have been entered (presuming, of course, that you''re online).
    You can also use it as a talk client by selecting File > Talk.


    Kfinger is of course a front end for the familiar finger command; if that command
    is not familiar to you, you can learn a lot by looking at the finger and chfn
    man pages. In your query I learned that I have no mail awaiting your attention
    and no ~/.ping file.


    Actually, KFinger gets information for users on the local system or a system that
    you specify in Options > Setup, where you can list as many systems as you like.
    It is of special use to the system administrator.


    # Network Utilities: GUI for Common Internet Functions


    If you click on K Menu > Internet > Network Utilities, you are given a suite of
    commonly used network functions in a convenient central location (see Figure 24.14).


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_520_0.png)


    FIGURE 24.14

    If you''ve been using Linux for long, the tab names will be familiar to you and
    so will theirs.


    The Network Utilities, KNU for short, provide a graphical location for input and
    output of these network commands. Of special interest to me is Traceroute, but
    only because of the little program available in various places that maps the traces
    on the globe on your desktop, if you XEarth or XGlobe running; it''s pretty cool
    to watch. Of course, serious network folk have far more serious uses for all these
    utilities. Ping is a program every Linux user has or will use; being told to “ping
    yourself?” is not an insult, but instead a way of checking your system configuration.'
  merge: -1
  pgno: 520
- img_proc: true
  md: '# PART IV Going Online with KDE


    # CHAPTER 24 Browsing and Other Things Internet


    Each of these, except for mtr and hot resolution, has a man page that deals with
    the fundamentals. KDE merely provides a front end. The mtr choice will be blank
    unless you have installed the mtr package, which is a combined replacement for
    ping and traceroute with some enhancements that help determine the quality of
    a remote link. (For more on mtr, visit www.bitwizard.ni/mtr/).


    The functioning Network Utilities are not exclusive to KDE or even to Linux. They
    are common to network and Internet platforms of all sorts. Here is a brief rundown
    of what they do.


    Ping sends a dummy packet to a specific address and receives acknowledgment thereof;
    the transmission is timed. It is most frequently used in Linux to verify that
    the point-to-point protocol is set up correctly.


    Traceroute requires by way of explanation a little about the way the Web works.
    When you log on, to say, a local computer bulletin board system (do any of these
    still exist?), and that''s for the BBS. But the Internet is entirely different.
    You might have a Web page that someone at the next house in your neighborhood
    takes a look at. You might think that this would take place on local lines. It
    might, but it''s also possible that the transmission would go to England, Namibia,
    and then up to a satellite and down again in Japan and back up to another, down
    again in California, and over several other stops before arriving at the house
    next to you. (Have you ever wondered where all the stuff on the Internet in, say,
    newsgroups, is stored? Keep wondering—there''s no single answer! Tracer tells
    you where incoming information has been on its way to you.


    There''s more: The information is sent in packets, so a Web page may jump all
    over the place on its journey to you, with the packets arriving out of order.
    The fact that it works is miraculous. I''ve had all it explained to me and have
    left explanations convinced that it could not possibly work at all. But, however,
    it does.


    Host resolution provides information similar to the Linux host and nslookup commands,
    both of which have many pages. It finds the Domain Name Server on a specified
    host. It is most frequently used to learn the IP of a particular host. Do not
    be surprised if you never use this utility. If you run an ISP or do Internet detective
    work, it may be well of use to you.


    Finger provides the functionality of the Kfinger program in a different location.


    508'
