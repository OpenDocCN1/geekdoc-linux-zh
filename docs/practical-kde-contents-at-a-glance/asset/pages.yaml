    # Virtual Desktops to Make Your Monitor Bigger


    It is possible, even easy, to have so many applications open that they are stacked
    atop the other. When this happens, moving around them is much difficult. This
    is especially true of applications such as Netscape and StarOffice, which you
    are likely to run full screen. For this reason, window managers and desktops in
    Linux have traditionally offered *virtual desktops*


    In these effect extend the screen in order to make it many times bigger than it
    is—up to eight times as big, though four is the default. The four buttons on K
    Panel, labeled One, Two, Three, and Four, provide one way of navigating among
    these.


    If you are new to this idea, you can best demonstrate it by opening an application...
    any application. Then click one of the Desktop Switcher buttons to change to a
    different virtual desktop. As you can see, it''s blank. There open a different
    application. Now switch back, again using the Desktop Switcher, to the first.
    It''s still there. Let''s say you''re in the middle of a complicated project,
    with several applications open and set up your email, or look on the Web for the
    answer to a problem that has just come up. You are just so. You are interrupted
    by something else, just want to take a break and check a different desktop, do
    your new tasks there, and return to your project later.


    It really requires no setup; it''s there by default. But you can do a couple of
    things to make it a little more convenient.


    One thing that many people find extremely annoying is that the virtual desktops
    might be installed in such a way as to make them all seamless: You move from Desktop
    One to Desktop Two merely by bumping your mouse cursor against the right side
    of your screen and leaving it there for a few seconds. If you are over against
    that side, performing some task, you might all of a sudden be surprised and horrified
    to see your applications suddenly disappear. They Haven''ve just switched to a
    different desktop. No real harm has been done, but it certainly breaks your concentration!


    78'
