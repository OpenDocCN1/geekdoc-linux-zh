  md: '# PART VI Using Non-KDE Applications with KDE


    # CHAPTER 32 Running Windows Applications with KDE


    > The VMware X Server

    If you are running XFree86 earlier than 3.3.4 and you want to use a VMware virtual
    machine full screen, you need to download the XFree86 server for your video card
    from the VMware site and install it.

    If you are running XFree86-3.3.4 or later, you can run full-screen without the
    special server.


    It does work. If you are willing to spend a hundred bucks for VMware (personal
    edition; for commercial use, it''s three times that amount), and another hundred
    or two for Windows (price depending, of course, on version), and another hundred
    or so for a hard drive onto which the Windows stuff is to be placed (unless you
    have ooodles of drive space to spare or a Windows installation already), and another
    hundred or so for extra memory (it grabs 32 megs for itself and won''t even talk
    to you if you have less than 64 megs), you can witness the admittedly amazing
    sight of a window on your your KDE desktop, with Windows booting inside, running
    a while, and more than anyone likes, crashing all on us. Oh yeah, and according
    to VMware, if you don''t have at least 266MHz CPU, you''ll need to upgrade that
    too. For about the same money, you can buy a computer that already has Windows
    on it at a discount house. For a few dollars more you can buy a couple of network
    cards and a hub, and make yourself a little Samba network. You can also set up
    a partition and dual boot between your Linux and Windows installations. If you
    have a drive with Windows on, dual booting is free.


    It isn''t perfect, but here is how it looks (see Figure 32.2).


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_609_0.png)


    FIGURE 32.2

    VMware allows you to set up virtual machines for DOS and all flavors of Windows.
    It offers a "Wizard," otherwise known as a sesup program, to help you configure
    things.


    596'
