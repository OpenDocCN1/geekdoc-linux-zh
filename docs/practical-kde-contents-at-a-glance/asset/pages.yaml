  md: '# PART III Using the Applications in the KDE Distribution


    # CHAPTER 18 Games and Toys


    In the beginning, there was Pong.


    It''s true: Many people''s first computer experience involved dropping a quarter
    (or two, if a friend was playing) into the slot and hitting the little green spot
    back and forth for awhile. And many people''s first computers were things that
    could be plugged into the television set so as to simultaneously play this game
    and permanently burn lines and score boxes into their TV screens.


    Maybe it be a sign that old age is approaching (“Why, when I was a boy we had
    Pong and were happy with it.\), but it doesn''t seem that long ago. Like everything
    else in computing, though, the quality and sophistication of games have grown
    exponentially. If you can find Pong at anymore, it will be in a museum or played
    on a digital wristwatch or pocket calculator.


    The games included with KDE demonstrate this. Many is the evening I spent dropping
    quarters into a machine whose *Asteroids* game was nowhere as graphically elaborate
    as the one you get with KDE for free.


    Yes, the book is *Practical KDE*, and the practicality of games can be argued,
    but who hasn''t endured a long and boring phone call by a quick game of *Minesweeper*
    or *SameGame*? Stress release is an increasingly important part of life. If you
    insist on keeping your nose against the grindstone, hop on to Chapter 19, “A World
    of Other KDE Applications,” because this chapter is about having fun. And for
    the purposes of this chapter, fun is found in two places: *K Menu > Games* and
    *K Menu > Toys* (after you''ve moved them, using knuedit, from *K Menu > Utilities*).


    # KBalone


    Kabalone (see Figure 18.1) is a little board game, reminiscent of Chinese checkers.


    The purpose of the game is to knock six of your opponent''s 14 pieces off the
    board. It can be played by two people, by one person playing against the computer,
    or by the computer playing against itself. The last possibility is probably the
    best way to learn the game, though the Help file contains full instructions,


    In the *File* menu, you of course start a new game, but you can also save a game
    and then restore it, make the computer stop searching for its best move and make
    the best move it''s found so far, under your last move, and get the computer to
    make your next move for you.


    The *Options* menu lets you select a level of play, choose which side the computer
    plays or tell it to play against itself, turn animation on and off, and “read
    the mind” of the computer as it contemplates your last move and its next one.'
