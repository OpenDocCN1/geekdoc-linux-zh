    From Chapter 13, “Keeping Track of Your World with Korganizer,” page 289.


    The Recurrence Range section lets you stop being bothered by the alarm when your
    prescription runs out, the project for which the meetings are scheduled completed,
    you paid off the mortgage, or break up with that special birthday you needed to
    be reminded of. If you are in prison, perhaps you can remind yourself of the number
    of days remaining in your sentence or the regular schedule of parole hearings,
    if the screws let you have a computer.


    From Chapter 15, “Multimedia: Music and Movies,” page 341.


    The Loop button, when clicked, plays the current CD over and over, unless a human
    mouse attacks the computer with an axe, which is likely after about the 15th consecutive
    play.


    From Chapter 23, “Reading the Newsgroups,” page 483.


    Unfortunately, the word count of the KRN documentation is approximately equivalent
    to the number of words in this chapter to point, so what you learn about its use,
    you''ll learn here. This is too bad because KDE is a dainty program on which a
    lot of work was done; a few hours more and they could have told people how to
    use it. As it is, navigation is mostly by error, finding your way down a dark
    hall by bumping into the walls. Watch your nose, knees, toes, and elbows, and
    cross your fingers that de there are no stairways heading down.


    From Chapter 32, “Running Windows Applications with KDE,” page 593.


    WINE is wanted to stand, in its recursive Linux fashion, for WINE Is Not an Emulator.
    I think they chose the words just to be able to spell something because it certainly
    is an emulator. It emulated Windows, all flavors. I think they should call it
    Winux.


    From Chapter 36, “Programming for KDE,” page 639.


    In due course, the “Trolls,” as they are called, came up with something called
    the QPL license, a document that assures that Qt will remain available for free
    software development. This calmed things considerably, though the Trolls and the
    Gnomes can be heard even now grumbling and muttering about it. Rumpleststilskin
    remained silent on the topic.


    From Chapter 37, “Using KDE on Your Laptop,” page 651.


    The Warning page prevents embarrassing situations where your entire Masters thesis
