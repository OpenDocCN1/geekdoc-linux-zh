  md: '# PART V KDE on the Network


    # CHAPTER 27 Managing Databases with KDE


    Its name is SQL, for Structured Query Language. Computer consultants like to call
    it “sequel” because that is a word that contains all three letters. There is another
    word that contains all three letters in my experience might be more appropriate:
    sequel. Database development is not a mild thing.


    Nevertheless, SQL databases are the meat and potatoes of modern business, and
    an operating system and desktop that can''t make use of them isn''t going to make
    it far in the enterprise. KDE can.


    > Needed: A Good Flat-File Database

    There all sorts of little, specialized databases for KDE, applications that are
    limited to keeping track of your videotapes or phonograph records, and there are
    several high-powered SQL servers and clients. Unfortunately the middle ground,
    the flat-file, free-form, completely configurable database is unrepresented, so
    the user is left with a choice of bicycle or jet airplane, but no car.


    There being dozens of volumes the size of the Manhattan phone book on database
    management, there is no way even to sum it up in a single chapter. Database managers
    are in any case bound to know far more about their profession than I do or will.
    Instead, this is an overview of some of the industrial-strength databases that
    are available for use with Linux and KDE, and some special considerations as they
    apply to KDE.


    # The Big Guys


    There are still a few independent, high-quality commercial database applications
    that haven''t been consumed by some other company. These of two are available
    for Linux, with the possibility of more on the way as time goes: Informix and
    Oracle.


    # Informix


    The Informix Corporation (www.informix.com) offers a broad range of Linux products,
    from an elaborate server to the Informix SE program that is available for free
    download. There is an Informix developer network, and the company offers free
    downloads and 30-day trial periods for even its high-end Linux products. The Informix
    commitment to Linux seems to be strong, and Linux database managers speak well
    of the company and its products.


    536'
  merge: -1
  pgno: 549
- img_proc: true
  md: '# Oracle


    Linus Torvalds himself was widely quoted as saying that when Oracle released a
    Linux version, it was difficult for businesses not to take Linux seriously. In
    August 1999, the company announced a greater commitment to Linux, with a WebDB
    product in addition to its Application Server and Database products for Linux.


    Oracle (www.oracle.com) is continually making announcements about availability
    and special offers.


    # Industrial Strength and (Usually) Free


    Two databases have pretty much become standards in Linux: PostgreSQL and MySQL.
    Each has its adherents; indeed, each as devoutly loved as any religion with the
    possible exception of the Emacs text editor. Both are available for download,
    and both have licenses that most users make free use of the program without paying
    a licensing fee.


    PostgreSQL (www.postgresql.org) and MySQL (www.mysql.com) are possessed of multiple
    applications, client programs, servers, and so on. It is on the use of these under
    KDE that the rest of this chapter will concentrate.


    # KDE Front Ends


    Any of these databases works from a console window. The idea is to end up with
    a way that an office worker who is not a database expert can add, delete, search
    for, and otherwise make use of the data that are stored in a particular database.
    And there has been movement toward bringing easy-to-use front ends to MySQL, PostgreSQL,
    and, lately, even Oracle, with native KDE front ends.


    # KMySQL


    The prettiest and potentially easiest-to-use of the KDE front ends for databases
    is KMySQL (see Figure 27.1). Don''t let the name fool you: it employs modules
    between itself and the database application, so it works with PostgreSQL and MiniSQL
    as well as MySQL (though it is optimized for the latter).'
