    Moving down in the pile, with a goodly distance yet to go. The reward for clearing
    them all away? You''ll have to find out for yourself.


    Kmahjonggg takes help to a whole new level, offering assistance on the next play
    from the Game menu, with its Help me item, and even a Demo mode that plays a game
    for you slowly enough to show how it''s done. It also offers a number of different
