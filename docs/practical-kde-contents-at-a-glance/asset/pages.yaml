  md: '# PART I

    Zooming Around with KDNavigator CHAPTER 4


    The things you can change


    +   - Max recent folder entries lists the four folders you''ve most recently opened.
    Change the number if you like it, but keep it within reason or KDN can become
    impractical. (In which case, please petition the publisher and maybe you can arrange
    for us to whip together a book called *Impractical KDE!)

    - Max recent file entries lists the documents or applications you''ve most recently
    opened. Again, the default is four and again, you can change it.

    - Max files in a single folder sets the threshold for an error message to the
    effect that there are too many files in the folder to get it through KDN. Why
    is such a setting necessary? Because some directories would take forever to load-/dev
    comes to mind. You might not want to wait. If you don''t, change this value to
    a higher number.

    - Show dot files toggles the display of hidden files, which in Linux are hidden
    by giving them a dot as their first character.

    - Ignore case when sorting lists and directories appear in alphabetical order,
    irrespective of the first letter in the item''s name. Otherwise, the items whose
    begin with capital letters appear first, in alphabetical order, followed by the
    ones whose initial letters are lowercase. Linux is highly sensitive, the convenience
    achieved by employing this option may be over-shadowed, because every other Linux
    application behaves differently. Consistency, in this case, isn''t foolish.

    - Show Shared section (try to say that three times quickly!) toggles the display
    of the Shared section in your KDN menu.

    - Show Personal section toggles the display of the Personal section of your KDN
    menu.

    - Show Recent section toggles the display of the Recent section of your KDN menu.
    This is useful if you don''t want anyone else to be able to determine what you''ve
    been doing. When it is off, the little database of recently used programs and
    files isn''t updated, so turning it back starts with a clean slate, to speak.

    - Show entry toggles the Option item at the bottom of the KDN menu, which is how
    you got to this dialog box. If you "unpress" this button (or uncheck this box,
    if you''re using the Windows 95 widget emulation, how are you supposed to be able
    to make changes? Easy. Right-clicking the K Panel anywhere that there isn''t an
    icon produces a small menu, the first item of which is Configure. This produces
    a dialog box, the last tagged page of which is the KDN Options page.'
