  md: '# Prospecting with KFind CHAPTER 14


    You can probably use KFind in a very basic way without the slightest bit of instruction,
    but its power isn''t immediately visible on the surface. As we have done in a
    few other places, let''s begin by running down the toolbar icons because they
    aren''t necessarily intuitive and are certainly not consistent with the rest of
    KDE:


    +   - The first icon, with the looking glass, is Start Search. As its name implies,
    it begins the search for whatever file you have asked it to seek.


    +   - The two curved arrows, the second icon, is New Search, which removes the
    results of the previous search and the search parameters themselves so that you
    can begin to search for a different file.


    +   - The third icon, a traffic light visible only when a search is underway,
    is Stop Search, and it stops the current search. It never turns green: You can''t
    use it to restart the search.


    +   - The fourth icon, with a little arrow making a right turn at its upper-right
    corner, is Open. If your target is a text file or file of a type to which you
    has been attached, this opens the program in the text editor or other program
    respectively. If it is an executable program, it executes the program, making
    this useless unless the object of your search is a script that you want to look
    at and edit. If the search turns up more than one file, you need to select it
    before you can use this or any of the other file-specific commands.


    +   - The next button, which looks like a gift-wrapped package with green ribbon,
    is Add to Archive. Clicking it opens the standard KDE file specification dialog
    box, where you can direct KFind to the .tar file which you hope to add the selected
    file.


    +   - The file icon with the red X across it is Delete. It erases the selected
    file. You are then prompted for confirmation. It doesn''t just delete the file
    from the found list, it also deletes it from your drive.


    +   - The universal information icon is your link to the Properties of the selected
    file, and clicking it produces the same dialog box as does right-clicking the
    file in KFM and choosing Properties from the resulting menu.


    +   - The open folder icon is Open Folder. When clicked, it launches KFM at the
    location of the selected file.


    +   - The save icon signifies the Save Search Results function. Depending on how
    it is configured, the search results are saved either to a text file or to an
    HTML file. The default is the latter. A confirmation message tells you the name
    of the file (see Figure 14.14). If the search is saved as HTML, the listing of
    files is in the form of links, and clicking one produces the same result you would
    have received using the Open command.


