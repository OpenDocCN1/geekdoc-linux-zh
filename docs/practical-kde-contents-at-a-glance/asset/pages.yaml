  md: '# PART III Using the Applications in the KDE Distribution


    # CHAPTER 19 A World of Other KDE Applications


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_427_0.png)


    # FIGURE 19.1


    kmclock adds timesettting functions to the KDE Control Panel. Here you set the
    date and time.


    This small file (about 75K as a gzipped tarball) compiles in seconds and provides
    a second page that is to be overlooked because Linux machines should be set to
    GMT (Greenwich Mean Time), as shown in Figure 19.2.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_427_1.png)


    # FIGURE 19.2


    The drop box lists all the world''s time zones as offsets from GMT. It covers
    the little world map. You pick the offset from GMT, which allows KDE to display
    correct local time on a machine whose clock is set to GMT, as it should be.


    414'
