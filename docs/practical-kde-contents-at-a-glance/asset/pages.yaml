    and Fermilab remain popular today. You can download them and use them, free of
    charge, from most Linux application repositories.


    The window managers and widget sets grew in both number and quality. There was
    a wonderful compatibility about it all: Almost any window manager would run almost
    any XFree86 application. The widget set would have to reside on the local computer
    or local area network, true, or the program would have had to be statically compiled
    against the set. (This means that the program itself contained the widgets, making
