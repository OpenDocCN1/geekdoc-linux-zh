    > An Essential Ark Task

    As was writing this chapter, strange things happened. First, I couldn''t save
    this file: I received the message that I didn''t have write permission to it.
    Puzzled, I logged out and restarted KDE. All my customizations were gone. My K
    Panel arrangement was gone. Wallpaper had not chosen so irregularly on my desktop,
    and I couldn''t change anything of it. I did a full reboot. No help.


    I looked at the configuration files in ~/kde. Frankly, I have another machine
    that I keep configured very closely to this one. I was able to make a tarbz2 file
    of its ~/.kde directory, which I copied to floppy and then extracted to my directory.
    Pretty much everything came back. There''s a few anomalies, but it''s recoverable.

    It would have been easier to fix had I copied my ~/kde to a nice little archive
    kept in a safe place. You should do it, too. Now.


