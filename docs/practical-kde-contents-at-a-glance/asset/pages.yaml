    # Office Tools


    Though the bulk of office application development is focused on KOffice and programs
    that tie into it in some way, you might find a few apps useful.


    PeopleSpace is a KDE application for development, but usable in its current form,
    that emulates the interface of the popular ACT! business information manager.
    You can find the current version at www.slac.com/mpilon/peoples_home/


    KProject is project management software for KDE. Take a look at rs45.bv-tu-berlin.de/JOCHEN/KPROJECT/kproject.php3.


    KSQL is a query front for the popular Postgres database for Linux. You can locate
    information about it and links to the source at www.mutinibaysoftware.com/kpsql.html.


    I mention KSendFax (see Figure 19.8) later on, but it''s worth bringing up now,
