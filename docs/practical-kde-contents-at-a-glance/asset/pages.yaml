- img_proc: true
  md: '# PART I Installation


    # CHAPTER 1 Installing KDE


    # Debian Linux


    Debian has the reputation of being the “purest” Linux distribution and is typically
    used by very serious hackers. No version of Debian comes with KDE. The bad news
    is that this means you will need to acquire it on your own; the good news is that
    if you’re running Debian, you probably know how to do this (though I’ll explain
    how anyway). In the spring of 1999, Debian announced a collaboration with KDE.org
    and Canada’s Core (maker of the famous CorelDRAW and now the WordPerfect and WordPerfect
    Office Suite programs) to create a new distribution. Core Linux includes several
    custom features, so its differs from the standard distributed versions. If you’re
    running any of the several current versions of Debian Linux, you can find KDE
    for it in DEB file format on the KDE ftp site and its mirrors.


    # SuSE 6.1


    This German distribution, popular throughout Europe and making inroads elsewhere
    in the world, includes both KDE and Gnome. You can set the default at installation
    and change it later.


    # Linux Mandrake 6.0


    The Mandrake people offered a distribution with KDE before anyone else. The distribution
    consists of an enhanced Red Hat Linux with KDE, Gnome, and GnuStep desktops, though
    KDE is the flagship. The Mandrake Web site (`www.linux-mandrake.com`) notes that
    once people try KDE, they stick with it.


    # Slackware Linux 4.0


    One of the first Linux distributions, Slackware 4.0 defaults to KDE 1.1. As with
    Caldera, an upgrade is in order, though 1.1 works perfectly


    # Other, Linux Distributions, and “Nibbleware”


    A great many Linux users, perhaps the majority, and many of those have engaged
    in the practice of nibbleware. This is simply gradually upgrading an older distribution
    in bits and pieces as new and interesting capabilities appear. (The change from
    Linux 2.0.3x to 2.2x has been so widely accepted by so many people upgrading the
    kernel and associated packages, that it might better be called “chompware.”) If
    you are among these users, you have KDE only if you downloaded and installed it.
    If you haven’t yet, the next section is for you, as well as those who need or
    want to upgrade.'
