    later came the response: “Nice try.” But she married me anyway.)


    So my criticism (except for that ridiculous Internet beat thing) has been among
    friends, and if it seemed otherwise, I apologize. KDE is at the center of my professional
    life, not just in this book but in things I write that have nothing to do with
    computing. If it weren''t the best thing around, I wouldn''t use it.


    But it is; otherwise, it wouldn''t be practical.'
