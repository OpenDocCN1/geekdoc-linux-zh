  md: '# # The -O Flag


    The letter *O* reduces code size and speeds execution of the compiled code if
    followed by the number 2 on Pentium-class machines:


    ```

    .CXXFLAGS=''-02 -mpium -fno-exceptions configure --prefix=pathname

    ```


    The trade-off is that it takes longer to compile with this option set, and more
    memory is used during compiling. If you are low on memory, this could involve
    a lot of swapping to disk, which causes the process to take still longer. It is
    worth the trouble, but warned: it isn''t something to undertake if you need your
    machine for something else 15 minutes from now. Some packages on some machines
    can take hours to compile.


    So then, if you want to reduce the system resources required by KDE, you can employ
    some or all of the methods I mentioned when you''re building KDE from source.
    And, as you''ve seen, you can stack the options so that for minimum code size
    and memory usage, you would this:


    ```

    .CXXFLAGS=''-02 -mpium -fno-exceptions configure --prefix=pathname --disable-debug

    ```


    There are two things worth noting here. One is that the single-quote character
    (the apostrophe on your keyboard) is needed to offset C++ flags, which are called
    by CXXFLAGS=


    The other is how useful the Up arrow key is in a situation like this. You will
    be compiling as many as 11 packages to build the entire KDE distribution, and
    if you can type the line quoted above 11 times without making a mistake, you''re
    better than most. With the Up arrow, you can scroll back through your commands
    until you find this behemoth, and then press **Enter**.


    If you want to be extremely methodical with your compilation and have time to
    do it, it''s a good idea to compile with no options other than -prefix=, just
    to make sure that you have a good download and KDE works. Then you can recompile
    with the options listed. If the result doesn''t work, you need to experiment to
    see which option gives your system indigestion.


    Now, let''s get it running.'
