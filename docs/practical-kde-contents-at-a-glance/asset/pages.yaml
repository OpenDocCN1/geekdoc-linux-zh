    code and report back that solved or failed to solve the problem, you''re doing
    a service to the whole KDE project. If the hack works and fixes a malfunction,
    there''s a good chance it will be included in the next release of KDE.


    > Hackers Are Good

    If you listen to the television news, where studied ignorance of computers is
    displayed daily, you might think that "hacker" is a pejorative term. If you get
    your knowledge from within the computer world, though you''ll know it''s not.
    A "hack" used to be the term at Massachusetts Institute of Technology for a really
    clever practical joke. It was adopted at the MIT computer science department as
    a really clever modification of computer code, which is what it is, and all that
    it is. Those who can do this are hackers. People who break into other people''s
    computers are criminals. There will probably be a term, too, for broadcast reporters
    who cover the computer world competently, should need ever arise.


    From here, it is just one step, albeit a long one, to finding and fixing problems
    all on your own. This isn''t an easy step to make, but KDE makes it easier through
    a wonderful program that has just joined the KDE core distribution.


