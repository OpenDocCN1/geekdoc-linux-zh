    +   - fancyhdr—Supports alternative headers and footers when the fancy page style
    is selected


    +   - floatalt—Allows text to wrap around a graphic or other object


    +   - graphics—Allows the insertion of PostScript graphics


    +   - linuxdoc-sgml—Allows the Linux Doc tools to process files generated by sgml


    +   - rotating—Allows the orientation of some items to be changed


    +   - subfigure—Allows the grouping of multiple figures with independent captions


    +   - setspace—Necessary if you want control over line spacing


    +   - longtable—For use your article, letter, or book is to be more than one page
    long


    Now, you are probably wondering why all this stuff is treated as if it were optional.
    One reason is that it was developed when memory and storage were precious commodities
    (Indeed, if you look at your word processor, you''ll find all of features and
    layouts that you''ve never seen and never will. Why bother with them? Just in
    case?) Other layouts are being developed all the time, as well as other add-ons.
    You don''t need all the listed items, but you certainly need some of them if you
    are to do any useful work. Frankly, the essential ones are included with most
    Linux distributions, and the Help > LaTeX Configuration menu item describes where
    the missing ones can be had. Once you have obtained and installed the items, if
    any, run Options > Reconfigure to run the search again, to make sure they are
    properly installed and recognized.


    # Using KLyX


    KLyX, as you have figured out by now, is based on strictly defined layouts that
    are not something you just toss off, as you might in a word processor. The layouts
    are collections of styles that you can apply to paragraphs. This relieves you
    of the burden of formatting your documents.


    You may also have begun to suspect that you probably know nothing that will be
    of any use in KLyX, and if you have, you are very close to right.


    Try this: Open a KLyX screen. You will notice that it is very attractive and has
    a familiar layout, with menus, rows of toolbars, a text entry box, and a status
    bar at bottom. Now, look a little closer and try to figure out how many of the
    toolbar items you recognize. Open some of the menus and look at some of the items
    there. Click a few.


    429'
