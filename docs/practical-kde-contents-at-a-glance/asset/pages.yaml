  md: '# PART V KDE on the Network


    # CHAPTER 26 Supporting KDE in the Enterprise


    One of the obstacles, perhaps the chief obstacle, preventing the adoption of Linux
    and KDE in the enterprise is the perceived lack of someone to turn to when things
    go wrong.


    We can set aside the fact that things seldom go wrong in a properly set up and
    maintained Linux and KDE system even as we can set aside the fact that “someone
    to turn to when things go wrong” is as often as not a technical support number,
    in exchange for a credit card number against which it $100 or so will be charged,
    will tell you that they have no idea what the problem is either. The perception
    is there, and it is standing in the way.


    This perception is, starting to be eroded by a bit by the interest in Linux shown
    by leading computer companies and software vendors. Because the most widely used
    desktop for Linux is KDE, their interest extends to KDE as well. If you are running,
    or proposing to run Linux, nibble put together bits and pieces instead of a full
    Linux distribution, your choices for third-party support are limited, but if you''ve
    put together such a system, it''s also likely you''ll need to go outside the company
    for support. (It''s a good idea to keep records of how the system is configured.
    If you get squashed by a falling satellite on your way to work, you''ll want your
    co-workers to be sad, not angry:)


    Chances are you''ll be using, or proposing to use, an existing distribution. There
    is much to be said for choosing a distribution that offers technical support.
    Almost all commercial distributions offer “90 days free installation support.”
    This is, in a word, useless. You are looking for something a little more robust,
    which is to say something-for which you pay and expect results.


    In the United States, both Red Hat and Caldera offer a wide variety of support
    services. Both also offer programming and other training courses. (Caldera offers
    some distribution-independent courses as well.) There may be something in this
    regard available from the new Core Linux, which features a highly customized KDE
    as its front end.


    It cannot go without notice that Lotus is offering its Domino server for Linux,
    and that its parent company, IBM, has taken a considerable stake in Linux. While
    much of the commercial interest in Linux focuses on the server side of things,
    there is no reason not to—and every reason to—carry this forward to the desktop,
    a thing made simple by KDE.'
  merge: -1
  pgno: 543
- img_proc: true
  md: '# PART V


    # Providing Your Own Support CHAPTER 26


    # Security? Go Linux


    In August 1999, the leading non-Linux operating system vendor set up a Web site
    with a challenge to crackers to try and hack it. It was down within hours, and
    the company said it was due to bad weather. At the same time, a Linux vendor in
    Wisconsin put up a site running the Apache Web server atop Linux, making the same
    challenge. More than 6,500 people tried to break in, but none succeeded. The site
    seemed invulnerable to the vagaries of weather as well. If your company has a
    Web site, there is really no alternative, though this isn''t a KDE issue.


    # Providing Your Own Support


    In a perfect world, a combination of stability of the system and competence of
    the system administrator would make technical support calls rare to the point
    of near extinction. Linux and KDE offer the former, and you can achieve the latter
    more easily than you probably imagine.


    The phrase most commonly associated with Linux is "steep learning curve." It is
    also the phrase most unfairly associated with Linux. Yes, there is a steep learning
    curve, for those coming from the DOSrivative world. Linux is unlike DOS and its
    successors as catalogues are baseless. A user accustomed to DOS-like systems (DOS,
    OS/2, and all versions of Windows) will be hindered by the very belief that he
    she knows something useful, but keyboard proficiency and the location of the on/off
    switch and back-panel connectors are all about that such a user can bring to Linux.
    What is steep in such a case is the unlearning curve. The Linux learning experience
    is no more difficult than it is for the computer user who started computing when
    computers arrived with blank hard drives and a box of DOS disks. (For the latter-day
    user, accustomed to buying a computer with everything preinstalled, the fact that
    there is any learning to be done may come as a surprise. It is up to you, the
    system administrator, to do the learning!)


    But it is true: The Linux system administrator needs to know more than the tech
    support number and the tech support account number. You need to achieve a degree
    of competence.


    There are many excellent books on Linux. There is also an enormity of information
    available as well. If you can summon a little passion for the subject, you will
    have achieved a surprising degree of proficiency in very little time.


    If your company is serious about Linux and if it is big enough that the MIS department
    is more than you, it may be a good idea to look into the courses offered by Calder
    (www.calderasystem.com), which have the enterprise in mind, or by Red Hat (www.redhat.com),
    which is increasingly interested in the business use of Linux.


    531'
  merge: -1
  pgno: 544
- img_proc: true
  md: '# PART V KDE on the Network


    # CHAPTER 26 Supporting KDE in the Enterprise


    Caldera provides training and support through a series of partnership arrangements,
    whereas Red Hat offers these services at centralized locations.


    However, if you are going to support yourself, there is no way around learning
    the system. Fortunately, if you''re interested in computing, learning Linux is
    a bracing challenge and a rewarding one. Learning KDE is sheer delight.


    # Outsourcing Support


    In addition to the Linux distributors, there are some excellent third-party support
    sources. If you are in Canada, Starnix should be your first stop (www.starnix.com).
    It offers everything from turnkey systems to training to custom software and comes
    highly recommended.


    In the United States, LinuxCare is a popular choice (www.linuxcare.com). It provides
    a wide range of general and custom support services, and its KDE knowledge is
    extensive.


    Of course, the support services offered by your Linux distributor are worth investigating.
    A certification course of study is additionally under development that would be
    available to both consultants and in-house MIS professionals. Again, your Linux
    provider is the first stop for details, though Caldera seems to be farthest away
    in this regard.


    The fact is that KDE has become so much a factor in Linux that the Linux consultant
    who does not know KDE risks being left behind. Thus, any reputable Linux consultant
    can probably support KDE as well.


    # Hybrid Support


    Unfortunately, much of KDE support is unlikely to achieve the “CEO stamp of approval,”
    because it is...free. It is accurate and fast. It is something on the order of
    combining in-house support with a degree of outsourcing, and it takes place online.


    There are several mailing lists to which any KDE administrator, corporate or otherwise,
    subscribe. These are similar to newsgroups but typically have a much better signal-to-noise
    ratio than do newsgroups. Additionally, archives of them are usually available.
    In that it is not very likely that you are the first person to encounter a particular
    problem, doing a search of the archives often provides an answer in minutes.


    532'
  merge: -1
  pgno: 545
- img_proc: true
  md: '# PART V


    # Gurus CHAPTER 26


    The news mailing lists include, first and foremost, the KDE mailing lists, which
    can join at www.kde.org/contact.html. You can find the archives for these lists
    at lists.kde.org/. The search engine is very good. I recommend subscribing to
    kde, kde-announce, and kde-user. You may of course subscribe to others, as your
    interests suggest. The real question is that you there won''t receive a prompt
    and accurate answer. You must be prepared, however, to provide a detailed description
    of the problem, what equipment and Linux version you are using, what you''ve done
    to try to fix it, and the circumstances under which it can be reproduced. "I just
    tried to run Kmail, but it doesn''t work" is not enough to get any useful results.
    If you uncover a previously unknown bug, there is great likelihood that you will
    hear from the developer of the application, who will work with you to resolve
    it one and for all.


    You would also be advised to subscribe to the mailing lists sponsored by the publisher
    of your Linux distribution. These are not formal technical support avenues but
    are quick, efficient, and free ways of getting help from other users. I have yet
    to encounter the problem that could not be solved by a well-worded question to
    either the distribution list, the KDE list, or both.


    Of, the newsgroups are a traditional source of information; if you''re thick-skinned
    and don''t mind wading through spam and sometimes endless digressions, there is
    often considerable knowledge available there.


    And it is possible to directly email the author of a particular application. This
    frequently results in useful information. (The author''s email address is usually
    found in the Help > About menu entry for the application on question.)


    In all cases, bear in mind that your attitude plays a big part in the likelihood
    of a response and the quality of response. None of these people are being paid
    to look after you, and none of them owe you anything. The help they provide is
    from the goodness of their hearts, the desire to help others, the fact that they
    were probably helped in much the same way, and yes, the desire to display their
    proficiency. Questions politely asked are far more likely to receive solutions
    than are demands for help.


    # Gurus


    This applies more to Linux in general than to KDE, but it is always a good idea
    to know a Linux expert. I can say with certainty that my progress in Linux would
    have been an order of magnitude slower had I not had a Linux guru who was willing
    to drop real work in order to help climb out of some hole I''d dig for myself.
    If you can find a guru, your life will become easier. And it can be done.


    533'
  merge: -1
  pgno: 546
- img_proc: true
  md: '# CHAPTER 26 Supporting KDE in the Enterprise


    If there is a Linux user group in your area, join it. If there isn''t, ask around
    and see if you can organize one. Check with the computer science department at
    the local college: Chances are that the best of the best are working with Linux.
    These students can be a good source of part-time consultancy at reasonable prices.
    They get to build a résumé, and you get the help you need. And lest you pooh-pooh
    this idea, remember: Linux was written by computer students; so was KDE. These
    young hotshots are really, really good.'
  merge: -1
