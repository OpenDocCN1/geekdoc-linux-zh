  md: '# PART II Customizing the K Desktop


    # CHAPTER 5 Making the K Desktop Your Own


    The default KDE desktop is certainly attractive and exciting when you start it
    for the first time. For many Linux users, it is the long-awaited answer to many,
    many prayers. Nevertheless, we computer users don''t waste much time before having
    thoughts begin, "I wish I could..."


    Well, with KDE, chances are you can. This chapter begins a section that tells
    you how. First, the easy stuff. In the first part of this chapter, we will be
    using a KDE configuration program called `kcmdisplay`, though its type and name
    will never actually appear onscreen. If you want, you can start it at a terminal
    window command prompt by typing `kcmdisplay` Enter. Of course, because you need
    the X Window System to be running for `kcmdisplay` to work, you can''t run it
    from the console. And again, you never need to type its name in order to get its
    full utility, as you will see.


    # Spicing Up the Background


    Neutral blue is nice, but it isn''t everyone''s favorite. The talented KDE programmers
    realized this—in course you''ll begin to wonder if there''s anything they didn''t
    realize—allowed for a multitude of wonderful effects and images. The default desktop,
    Figure 5.1, works.


    The quick and easy way to bend the background to your will is to find a place
    on the desktop not occupied by an application and click the right mouse button.
    Among the choices is Display properties. Click it and you get an elaborate dialog
    box, as shown in Figure 5.2.


    Before we begin changing things, let''s ample around this first tab, labeled Background.
    In the upper-left corner is a section labeled Desktop. Now we discover that each
    of the virtual desktops available under KDE can have its own discrete background,
    independent of all the others. If you find One, Two, Three, and Four (indeed up
    to Eight) a little ordinary, you can rename the desktops to whatever you would
    like to call them by clicking on the Rename button and typing in your new choice.
    Remember that these names will appear on your K Panel. Labeling one "Games" and
    another "Boss Key" probably wouldn''t be a very good idea for a machine at work.
    In any case, select the desktop that you want to modify here; in this example
    we''ll use One.'
  merge: -1
  pgno: 107
- img_proc: true
