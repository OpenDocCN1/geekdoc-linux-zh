- img_proc: true
  md: '# PART VI


    # Windows Under dosemu CHAPTER 32


    drive, to the virtual C: your dosemu setup, or, if you have compiled FAT readwrite
    support into your kernel and have installed OS/2 onto a FAT partition, you won''t
    need to copy it at all. You must remember to mount that partition, either through
    an /etc/fstab entry for autounting or manually. If you have done this and are
    lucky, you will be able to start dosemu, give the fully qualified path and command
    to the Win-OS/2 directory, and run win.com. This is to say that all this is experimental
    and, to use a common newsgroup term, YMMV: your mileage vary.


    All in all, it generally makes sense to run Linux applications under KDE, and
    if Windows applications appeal to you, to run Windows for them, and to return
