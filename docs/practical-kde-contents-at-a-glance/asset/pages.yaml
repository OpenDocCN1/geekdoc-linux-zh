  md: '# PART III Using the Applications in the KDE Distribution

    CHAPTER 16 Image Creation, Editing, and Manipulation


    The **Auto raise** check brings the selected application to the top of the pile
    if you have multiple applications open and are shooting only. **Hide KSnapshot
    window** keeps KSnapshot from appearing in your full-screen screenshots (it doesn''t
    even show up on the taskbar during the making of the picture). **Only grab the
    window containing the cursor** lets you make shots of individual windows instead
    of the full screen, which can reduce confusion and certainly saves storage space.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_379_0.png)


    It''s simple, easy to master, and efficient. It works. I love it, and if you need
    to make screenshots, you will love it, too. But I sure wish it saved in .pcx!


    # Making Your Own Icons


    KDE comes with a nice selection of icons. The problem is, most of them are for
    particular applications. The Appfinder, for instance, draws upon these when assigning
    icons to the programs it finds. To be useful, icons must be unique. If you have
    a row of identical icons, you need bubble help or a caption of some sort to remind
    you which is which. That defeats the purpose of icons (or already defeated, I
    think, or else we wouldn''t need bubble help).


    So now you have a new application and you intend to use it regularly. You would
    like an icon for it, but everything in the selection available is really for some
    other program.


    Have no fear. There is **kiconedit**, shown in Figure 16.10. You can find it at
    **K Menu > Graphics > Icon Editor**. It is a simple and specialized paint program
    that lets you edit a pixel at a time.


    366'
