    # Manipulating Running Processes with KDE


    While Linux is a very robust operating system, it cannot prevent a misbehaving
    application from keeping system resources, such as memory, if the application
    misbehaves and refuses to close cleanly, doesn''t close properly, or malfunctions
    in some other way. For this reason, there are means of killing a running process
    manually, without its permission and having to reboot the system. These are a
    little obscure and daunting to the new Linux user and even to some of intermediate
    experience. KDE''s developers sought to make monitoring and dealing with running
    processes much easier, if still not easy, by means of a program called KTop. (The
    name will spark recognition among many Linux users: top is the console program
    that does the same thing.)


    274'
