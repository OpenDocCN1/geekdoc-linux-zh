  md: '# PART III


    Prospecting with KFind CHAPTER 14


    # Conducting a Search


    In its easiest form, a KFind search is done like this: Type in the name of the
    file for which you are looking, and if you like, narrow the search to a particular
    area of your Linux installation (see Figure 14.16). You may use the standard Linux
    wildcard operators if you like. Then click the first button in the toolbar.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_338_0.png)


    **Figure 14.16** You can use the Look In drop box to narrow the places in which
    KFind will search. Or you can use the Browse to bring up a list of directories,
    beginning with your ~/. Narrowing the search reduces the time it takes to complete,
    which can be a minute or more if you have a very large drive or drives fill of
    files.


    Another way to narrow the search is to use the Date Modified tab. If you remember
    working on the file in the last month or so or it is part of a program you just
    installed, you can enter a date or range of dates (see Figure 14.17), and KFind
    will only display files that meet those criteria as well as any you set on the
    Name&Location tab.


