  md: '# PART III

    Appointment Handling CHAPTER 13


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_314_0.png)


    Figure 13.17


    The KOrganizer Categories dialog box lets you characterize your appointments in
    unusual ways.


    It is not immediately apparent, but here''s what you do do with the KOrganizer
    Categories dialog box:


    +   1. Highlight a word in the list on the left that you want to have characterize
    this appointment.


    +   2. Click the **Add** button. This adds the word to the list on the right.
    If there are several words you would like to use, repeat.


    +   3. If you think better of it, you can use the **Remove** button to take away
