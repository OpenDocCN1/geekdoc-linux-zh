    > Copy and Link

    It''s time to detail the difference between the Copy and Link menu items. If you
    Copy a .kdelink (or other file) or directory, you are making a duplicate, discrete
    instance of it. If you Link, you aren''t making another one but instead a pointer
    to the first. In most respects, the two behave identically. But when you Copy,
    you can make changes to the new file you make without the original being affected,
    and vice versa. If you change a link (or the file to which the link refers), you
    have changed its contents or behavior in both places.


    # Systemwide Use of .kdelink Files


    If you are the system administrator, you can make wonderful use of .kdelink files
    to add items to the K Menu that all users receive—and even to add icons to the
    desktops of users.


