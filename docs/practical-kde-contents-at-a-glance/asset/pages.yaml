  md: '# PRACTICAL KDE


    They, and he, built upon it. Soon a tight little group of programmers were working
    on the “kernel” of what came to be known as Linux.


    > No Long IInMany people, especially Americans, seem puzzled as the proper pronunciation
    of Linux. It was inspired by, and rhymes with, the Minix project, which was a
    single-user UNIX clone for 80286 and better processors. The lin in Linux is pronounced
    as the lin in linen. The ux is pronounced as the ucks in ducks. The accent is
    on the first syllable. Linux.ux


    At first the exclusive province of the few skilled programmers who could, literally,
