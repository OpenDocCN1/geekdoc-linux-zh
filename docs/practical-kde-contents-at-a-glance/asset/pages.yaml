  md: '# PART IV Going Online with KDE


    # CHAPTER 22 Kmail for Quick Communication


    The ability to send and receive messages instantly, with files attached for action
    if needed, is possibly the single greatest effect of the online revolution. No
    suite of Internet applications would even think of shipping without a mail client
    of some sort. Often, these are just enough to get by.


    KDE''s mail client, Kmail, is fully featured and rivals the best standalone mail
    applications. It is part of the core KDE distribution, so you have it, and it
    didn''t cost anything. Let''s use it!


    # Configuring Kmail


    When you start Kmail for the first time by going K Menu > Internet > Mail Client,
    your introduction to the program comes in the form of an error message that is,
    fortunately, not alarming (see Figure 22.1).


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_475_0.png)


    FIGURE 22.1

    Click OK to create your mail directory. Each user must do this because mail is
    stored in the ~/Mail directory.


    Once you have allowed Kmail to create a mail directory, you are treated to the
    opening screen, which resembles that in Figure 22.2.'
  merge: -1
  pgno: 475
- img_proc: true
  md: '![](img/4a2883756c73e7b0696dbbd721c5c7db_476_0.png)


    **FIGURE 22.2**

    The box at upper left contains your mail folders; the bigger box at the top lists
    the messages in a particular folder. The biggest box at the bottom previews the
    messages themselves.


    +   1 Mail folders

    2 Message list

    3 Message preview

    4 Compose new message

    5 Save message to file

    6 Print message

    7 Get new mail

    8 Reply to author

    9 Reply to all recipients

    10 Forward message

    11 Delete message

    12 Open address book


    Before we go any further, let''s take a look at the toolbar.'
  merge: -1
  pgno: 476
- img_proc: true
  md: '# PART IV Going Online with KDE

    CHAPTER 22 Kmail for Quick Communication


    The first icon, a blank page, opens a blank message for you to compose and send.
    The second icon saves the message as a file. The third icon prints the current
    message (a little more about this later), whereas the fourth collects any mail
    that has accumulated at your ISP''s server. The next one, with the curved arrow,
    replies to the current message. The one with a double curved arrow replies to
    everyone who received the message to which you are replying, and this is how you
    arrive at those monstrosities that have 50 names in the field and a dozen rows
    of quote upon the left. Just don''t use it unless you''re willing to clean up
    the mess you''re about to create. The icon with the arrow across it is to Forward
    the current message; the icon with the red X through it deletes the current message.
    (If you press it by accident, you can get the message back from the Trash folder.)
    Finally, the last icon opens your address book.


    One thing: The heading bar atop the message list, when clicked, rearranges the
    messages. Click the F to arrange them by status, *Sender* to arrange them by sender,
    *Subject* to arrange them by subject, and *Date* to arrange them by date (the
    default). Clicking again reverses the order. This is especially useful if you''re
    trying to follow a thread.


    The first thing you need to do is tell Kmail who you are and where your mail is
    to be found. This is done by *File > Settings* (see Figure 22.3). If this is the
    first time you''re using Kmail, the Settings dialog box may come up automatically.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_477_0.png)


    FIGURE 22.3

    Fill in the blanks. The button next to the Signature File box produces the standard
    KDE file selection dialog box. Any text file will do, netiquette dictates that
    it be no more than four lines unless there is a good reason for it.


    464'
  merge: -1
  pgno: 477
- img_proc: true
  md: '# PART IV

    Configuring Kmail CHAPTER 22


    The next task, and a little more difficult, telling Kmail where to look for your
    mail. Most people get their mail directly from their ISP without the intervention
    of a Mail Transfer Agent as sendmail. Yes, this is true even if you have sendmail
    (or another MTA) installed, which you probably do and certainly should. How this
    is set up and whether you use your ISP directly or filter your mail through an
    MTA depends on the kind of network you are on. If there is doubt about your mind,
    ask your system administrator, and if you have no system administrator you can
    assume you''re getting your mail from your ISP directly. In which case, you fill
    out the File > Settings > Network tab in the same way it is filled out in Figure
    22.4.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_478_0.png)


    FIGURE 22.4

    The Server information for outgoing mail is something you get from your ISP; Port
    25 is standard. You must also click the Add button to provide information that
    lets you receive mail.


    When you have filled out the information for outgoing mail, you need to click
    Add to set up an incoming mail account on your machine. This produces the dialog
    box seen in see Figure 22.5.'
  merge: -1
  pgno: 478
- img_proc: true
  md: '# PART IV Going Online with KDE


    # CHAPTER 22 Kmail for Quick Communication


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_479_0.png)


    FIGURE 22.5

    Select POP3 if you''re getting your mail directly from your ISP.


    After you click OK, you receive another dialog box; see Figures 22.6 and 22.7.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_479_1.png)


    FIGURE 22.6

    Provide your name as you want it to appear. The Login field, however, must be
    the login name you use when logging in to your ISP. You need not store your password
    with the configuration file, but if you do you won''t be prompted for it each
    time you seek new mail. You must get the Host information from your ISP, but Port
    110 is standard.'
  merge: -1
  pgno: 479
- img_proc: true
  md: '# PART IV

    Configuring Kmail CHAPTER 22


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_480_0.png)


    # FIGURE 22.7


    This shows the Configure Account dialog box as I had filled in for an account
    I had when writing this book. I have chosen to store my password so that I won''t
    be prompted for it, to retrieve all the mail from my ISP, and to delete it from
    the server once it is on my local machine. I decided not to have Kmail check for
    new mail every five minutes. because I often read mail often, and because Kmail''s
    threading is such that everything comes to a halt while it is checking for mail.


    The next tab, Appearance, in my experience involves a little alchemy: some type-faces
    and sizes look good, whereas others look terrible (see Figure 22.8).


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_480_1.png)


    # FIGURE 22.8


    Clicking the button next to each choice produces the KDE font selection dialog
    box. Here, I''ve selected the Long folder list layout I expect to have a dozen
    or so different folders, and I want to be able to see all of them all the time.
    Otherwise, scrollbars would be taking up screen space.


    467'
  merge: -1
  pgno: 480
- img_proc: true
  md: '# PART IV Going Online with KDE


    # CHAPTER 22 Kmail for Quick Communication


    The **Composer** tab, shown in Figure 22.9, is where you determine the form and
    appearance of your outgoing mail.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_481_0.png)


    # FIGURE 22.9


    The first section, Phrases, lets you the way in how messages are quoted in replies.
    The indentation character, which is usually, how quoted portions are set off from
    the rest of the message. I don''t like the sawtooth effect, so I use the pipe
    character `(Shift|)` instead.


    You can check the box that automatically appends the signature to your messages,
    but **do so only** if you specified a signature on the Identity tab. If you use
    PGP (sorry, why bother?), check that box and make sure your PGP is set up correctly.
    When entering a number at which word wrap kicks in, remember that your message
    is likely to be quoted, and perhaps requested, leave plenty of room—set the number
    fairly low—to avoid the ugly effect of long lines followed by very short lines
    that causes most people to press the Delete key. I cannot afford the monospaced
    font is still broken. I take your word for it. You should,,


    When sending mail you can choose to save the mail to **send later**, which avoids
    annoying errors (that otherwise have no effect) when you are composing mail offline,
    though you need to remember to send it later via the **File > Queued** command,
    or can put up with the error messages and **choose send now**. The 8-bit setting
    systems work well, the MIME Compliant setting works well with a wider variety
    of recipient systems.


    The **Misc** tab is where several important settings are found (see Figure 22.10).


    468'
  merge: -1
  pgno: 481
- img_proc: true
  md: '# PART IV


    # Using Kmail CHAPTER 22


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_482_0.png)


    FIGURE 22.10


    Unless you want your Kmail Trash folder to grow insanely large, you want to empty
    it when you exit the program. **Send Mail in outbox Folder on Check** is a good
    idea if you have the **send later** option checked on the Composer page or ever
    write mail offline. **Automatically send receive- and read confirmations** is
    for those who believe their messages are so important that they demand receipts.
    If you do not want to educate them as to their relative importance in the universe,
    just check it. **Compact all folders on exit** is a good idea, but can take a
    little while if you have many messages stored. It is an option made available
    in KDE 1.1.s Kmail.


    The final tab, **PGP**, is for those who others will pretend to be them and who
    want to saddle the rest of the world with long encryption keys at the end of each
    message. If you really need this—you are a secret agent, say—you should set it
    up. Otherwise, bear in mind that you are annoying people almost as much as if
    you sent mail in HTML format, a growing and irritating trend that causes many
    people to press the Delete key without even reading the message.


    # Using Kmail


    Having configured Kmail, it''s time to see whether it works. To begin, you must
    close Kmail for reasons unclear: it does not want to fetch the mail if it is started
    before you are online. (This bug was introduced sometime between KDE 1.0 and 1.1.)
    If it works properly, the Retrieving messages window and bar graph appear, see
    Figure 22.11, though they do not take focus.'
  merge: -1
  pgno: 482
- img_proc: true
  md: '# PART IV Going Online with KDE

    CHAPTER 22 Kmail for Quick Communication


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_483_0.png)


