  md: '# PART VII On the Leading Edge with KDE


    # CHAPTER 36 Programming for KDE


    This chapter may seem a little bit confused, but it is because we''re at a slightly
    con-using time in the course of KDE development. The installed base of KDE is
    of 1.0, 1.1, 1.1.1, and 1.1.2, but KDE 2.0 will take an increasing bite as time
    goes on, which isn''t to say that the 1.X base will disappear anytime soon. Something
    that solid doesn''t just dry up and blow away, and in some respects the two versions
    are incompatible.


    What''s more, one of the coolest applications for KDE, an Integrated Development
    Environment called KQkq, and for the foreseeable future shall remain a KDE 1.X
    application, using the QT-1.4X libraries and associated files. Meanwhile, there
    is the KDE software development kit, kdesdk, which requires QT-2.0 and therefore
    KDE 2.0. What to do?


    If you''re an experienced C++ developer, do whatever you feel like doing, using
    your favorite tools and not relying on any of my advice. (And if you''re an experienced
    C++ developer, I recommend that you ignore any advice I may offer because you
    know more about it than I do!)


    The best information is that you have both the QT-1.4X and the KDE-2.0 libraries
    installed, as well as the KDE libraries for paths 1.x and 2.x, and you have the
    library paths properly configured, you can continue to use KDE applications under
    KDE 2.0. This is likely to be the state of affairs for some time, phép forever:
    Some very useful KDE 1.X applications will probably never be ported to KDE 2.0.
    As this all gets sorted out, you can find instructions on the KDE home page, www.kde.org.


