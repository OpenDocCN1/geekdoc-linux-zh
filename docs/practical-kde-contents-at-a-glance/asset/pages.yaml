  md: '# PART VIII


    KCMLaptop CHAPTER 37


    # Building a Kernel


    Sounds frightening, isn''t it? The very audacity of recompiling your Linux kernel.
    Relax. It''s easy if you follow the instructions exactly. They are included in
    the kernel source.


    Generally, it''s a good idea to download and install the latest stable kernel
    source, which is put into /usr/src. Before you build a new kernel, though, make
    sure that you look in the /Documentation/Changes file in the kernel source to
    make sure you are aware of everything you need.


    Then have at it. At kernel.org could not have made it easier. You can create a
    module that supports the capabilities of your system, the automatic power management
    features, and so on. You want to take time with—uninterrupted time—so you can
    carefully tailor the new kernel to your needs.


    The Kernel How-to, which probably resides on your hard drive in /usr/doc, but
    which in any case you can get at the Linux Documentation Project (www.linuxdoc.org),
    tells you all you need to know. Pay close attention to it and follow its instructions
    exactly.


    You also need to make sure that you have the latest PCMCIA-CS package installed.
    This allows your machine to recognize and use PCMCIA cards and to hot swap them.(Sadly,
    as more and more notebook manufacturers build the execrable Windows-only modems
    in their machines, you become more and more likely to need a PCMCIA modem, PCMCIA
    modems, and overall system performance is better with one, even under Windows,
    with a Windows-only modem. On the good side, you can upgrade PCMCIA modem, when
    you get a PCMCIA modem, it''s not one of those those-only things, which are fit
    only to shim up that uneven level on your desk.


    PCMCIA cards are the modem, network, or other peripheral devices that stick in
    a slot in the side of your notebook computer. PCMCIA-CS is the PCMCIA Card Services
    package, which is downloaded and compiled after the kernel. Hot swapping is the
    capability to remove one card and replace it with another while the machine is
    running, and to have both cards properly recognized.


    With that admittedly truncated description of getting Linux (and therefore KDE)
    onto your machine, I shall jump into the areas in which KDE has made usage easier.


    # KCMLaptop


    One of the neatest little KDE, and an absolute must if you are using KDE on your
    notebook machine, is KCMLaptop. This combines the functions of PCMCIA card monitoring
    and automatic power management administration. You can find its source code, make
    sure in /stable/apps/utils directory of your KDE ftp mirror.


    653'
