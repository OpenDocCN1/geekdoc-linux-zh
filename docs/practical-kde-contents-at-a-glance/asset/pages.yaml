    # Basic Look-and-Feel Control


    A relatively recent innovation in Linux desktops is the use of themes. These can
    be something as simple as a set of colors for the desktop and its widget set (window
    borders and the like) or as complicated as a combination of colors and actual
    behaviors that change almost everything about the way you interact with your desktop.
    Themes have been evolving, becoming increasingly elaborate. There is even work
    underway setting a themes standard that would allow them to be transferred from
    one window manager/desktop combination to another.


    It was not until KDE 1.2 was that a theme manager was included in the distribution.
    Before, the KDE user who didn''t want to download and install optional versions
    of the KDE theme manager was given, essentially, two modest choices. The first
    was the default, as seen in Figure 2.4.


