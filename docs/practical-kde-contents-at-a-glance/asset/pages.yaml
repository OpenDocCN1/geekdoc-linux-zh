    # KFM’s Key Bindings


    KFM simplifies a number of functions by the use of key bindings, what you may
    have come to call all "hotkeys" elsewhere. Table 10.1 tells you what they are
    and what they do.


    | Table 10.1 KFM Key Bindings | Press |

    |---|---|

    | To Go | |

    | Back in History | Alt+Left |

    | Forward in History | Alt+Right |

    | One directory up | Alt+Up |

    | Open a file/directory | Return |

    | Open a pop-up menu for the current file | Esc |

    | Move among the icons | Arrow keys |

    | Select/Unselect file | Space |

    | Scroll up fast | Page Up |

    | Scroll down fast | Page Down |

    | Scroll right (on WWW pages) | Right |

    | Scroll left (on WWW pages) | Left |

    | Scroll up (on WWW pages) | Up |

    | Scroll down (on WWW pages) | Down |

    | Copy selected file to Clipboard | Ctrl+C |

    | Paste files from Clipboard to current directory | Ctrl+V |

    | Select files by pattern | Ctrl+S |

    | Open a terminal in the current directory | Ctrl+T |

    | Find files | Ctrl+F |

    | Close window | Ctrl+W |


    # KFM Command Reference


    This section goes menu by menu, across the KFM menubar, describing all the choices
    and what they do. You probably won’t need this very often, but if something has
    you really flummoxed, you may find the answer here.'
