    # CHAPTER 17 Manipulating File Archives and Backing Up Your Drive


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_397_0.png)


    FIGURE 17.13


    When KPackage is installed, clicking on an RPM or DEB file launches it in a mode
    to let you perform various functions, including integrity and dependency tests
    on the package and installation of the package if you want.


    The File List is somewhat more useful in this mode because often when a program
    fails to function, it complains of the lack of a particular file. This is a frequent
    reason for the acquisition and installation of RPM or DEB packages; with KPackage
    you can check before installing a package that might not solve the problem.


    If you didn''t get KPackage with your Linux distribution, it''s worth downloading
    and compiling. You can find the latest version and its very simple compilation
    instructions, which are identical to the compilation instructions for every other
    KDE application, at http://ftp.kde.org/pub/kde/stable/1.1.2/apps/admin/


    # Making Tape Backups Under KDE


    The core KDE distribution has a little front end to the tar command in its original
    sense: tape archive. You''ll find it at K Menu > Utilities > Tape Backup Tool
    (see Figure 17.14).


