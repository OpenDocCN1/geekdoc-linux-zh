  md: '# PART VIII On the Leading Edge with KDE

    CHAPTER 36 Joining the KDE Developer Network


    To know where you''re going, it''s helpful to know where you are. In KDE, in the
    open-source—movement?—industry?—world in general, it is impossible to determine
    whether we are climbing toward something glorious or are we even now at the pinnacle,
    whence we shall now make our descent.


    In KDE, we have seen the work of hundreds of you, energetic programmers, producing
    great software for the sheer love of it. The joke is that "KDE is a wonderful
    desktop produced by dozens of people named Stephan and Matthias." But the joke,
    while amusing to all of us who have watched KDE come into being, changes a lot
    of people. I think of Harri Porten, who spent lots of his time helping me figure
    out how to solve a problem with Kppp, ages ago (well, but that''s months in the
    Linux world), with me just one of thousand users posting to a KDE mailing list.
    How many others did he help? I have no idea. I think of Reggie Stadbauer, who
    always has a meeting to talk about KOffice via email, long before I was writing
    a book. And as I posted my question publicly. If I write this today I have gotten
    from one of the Stephans, this Stephan Goetter, information about the Kapp in
    a filedefs that will change the default paper size, which will now be put into
    Chapter 36, "Programming for KDE." These things are the equivalent of calling
    Microsoft technical support—if there were a free avenue for such—and having the
    phone answered by Bill Gates, or calling IBM to ask about OS/2 and having the
    movement Lou Gerner an interest in your opinions. It extends beyond the formal
    KDE folk to people like Jordan Grignon, who built a set of QT RPMs when I''d screwed
    up my compiler, for no reason other than we''re all in this boat together. I doubt
    that there are many KDE users who, having posted politely to the KDE lists, lack
    such stories. These guys really care. They want users to be happy because it is
    a point of professional honor with them. The world would be a much better place
    if everyone took such pride.


    These guys? Indeed. While this is anything but a political creed, the lack of
    women cranking out KDE applications is noticeable, writing code in general, actually.
    There''s no real reason for that I can find, so, women, get to it!


    # The Future


    No, we can''t know where we''re going until we know where we are. Where is that?
    Open software is by definition a little bit anarchistic. At the same time, it
    is more highly organized than any institution that springs to mind. People in
    the open-software movement—and in this use it is movement—devote hours arguing
    the fine


    660'
