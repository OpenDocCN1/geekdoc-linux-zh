- img_proc: true
  md: '# PART IV

    Setting Up Kppp for Your Account CHAPTER 21


    # Logging In Manually


    Logging in to your ISP manually through the Terminal window is easy if you know
    a few simple tricks.

    nThe first is to set your modem to the factory initialization string by typing
    ATZ and pressing Enter. Then type ATDT (ATDT0 if you have pulse dialing instead
    of tone dialing) followed by the telephone number of your ISP''s dial-up, and
    press Enter. If you have everything configured properly, you''ll hear your modem
    dial, hear your ISP''s modem answer, hear the modem screech as they negotiate
    the connection, and see the login prompt appear in the terminal window.


    If you have call waiting service from the phone company, you should proceed the
    ISP''s phone number in the ATDT string with the code that disables it, usually
    *70 followed by a comma (1170 if you have pulse dialing).

    Now you can learn what is needed to create an automated login script.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_468_0.png)


    FIGURE 21.16

    The Kppp Mini-Terminal window lets you dial manually.


    The PPP page (see Figure 21.17) involves matters of personal preference.


    455'
  merge: -1
  pgno: 468
- img_proc: true
  md: '# PART IV Going Online with KDE

    CHAPTER 21 Going Online with Kppp


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_469_0.png)


    FIGURE 21.17

    This page lets you set preferences to Kppp''s behavior.


    The choices on the PPP page cover a number of areas:


    +   - **pppd Timeout**—Sets the amount of time Kppp lets the pppd daemon negotiate
    without getting a connection before Kppp gives up.

    - **Dock into Panel on Connect**—If chosen, shrinks the Kppp window to an icon
    on K Panel when a connection is made.

    - **Automatic Redial on Disconnect**—If chosen, tries to reestablish a dropped
    connection.

    - **Show Clock on Caption**—If you click on its check box, displays in the Taskbar
    the amount of time you''ve been online in the current session.

    - **Disconnect on X-server Shutdown**—Logs you off if you close KDE and go to
    a console.

    - **Quit on Disconnect**—Closes Kppp when you click on the **Disconnect** button
    to terminate a modem session.

    - **Minimize Window on Connect**—Sends the dialer to K Panel and the Taskbar and
    nowhere else once a connection is made.


    The **Graph** page, see Figure 21.18, controls whether a graph of modem throughput
    will be available in the **Details** button on the Kppp dialer (more about that
    in a few paragraphs).


    456'
