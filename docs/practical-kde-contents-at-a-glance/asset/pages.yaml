    this. It will happen.


    # Drag and Drop


    KEdit subscrib to KDE''s excellent drag and drop protocol. This means that you
    can drag a file from KFM and drop it onto a KEdit window, and KEdit opens the
    file. If you use KEdit as an editor on your desktop, you can drop the file on
    the icon with the same results.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_331_0.png)


    ```

    Xlib: connection to '':0.0'' refused by server

    Xlib: Invalid MIT-MAGIC-COOKIE-1 key

    kedit: cannot connect to X server :0.0

    ```


    There is a solution. If you be su root type


    +   - +local


    and press, you can run KEdit or any other X Window System editor you have installed
    and edit your configuration file as root. If you do this frequently, you might
    consider adding the line to the top of your ~/.xintrc making it always available.
    Then, you need to type it in.


    Beware, though, doing this could pose a security risk to some extent, giving other
    users access to X. Like all security risks in Linux, it is a matter of convenience,
    and you think it is likely that someone will fool around with your machine. The
    setting, when made in a terminal window, remains in effect for the rest of KDE
    session.


