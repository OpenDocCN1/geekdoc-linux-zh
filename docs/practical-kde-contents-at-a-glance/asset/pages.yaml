  md: '# PART II

    A World of Other Settings: KDE Control Center CHAPTER 5


    # Too Much Noise


    I was recently in a large office that had hundreds of computers, all with sound
    cards and speakers, and all with system sounds turned on. The place sounded like
    a cuckoo-factory, and I wondered how they ever got anything done there. A little
    while, I learned the answer. They didn''t. The point, quite seriously, is that
    if you assign sounds to everything that happens on your screen, and if you work
    in an office, don''t be surprised if one day after the person who sits next to
    you tries to run over you as you walk to your car.


    And if you work alone, you''ll probably attach a system sound to everything on
    the desktop at first, but then cut back to just a few things. A constant stream
    of jingles and sound effects coming from your speakers, let''s face it, is annoying.
    It''s even more funny if you work so that you''re three actions ahead of the sounds.
    When you take your hands off the keyboard you are treated to several seconds of
    what sounds like band practice during an earthquake.


    Years ago I had a little file of Darth Vader saying, "You have failed me for the
    last time," that I assigned to the trashcan. It was very funny... the first time.


    System sounds can be fun, but they require the exercise of considerable courtesy.
    The person at the next desk might be a very skillful user.


    Systems differ from the Bell in that they require a sound card and speakers to
    be installed and properly configured or you won''t hear them. They also require
    that the little check box, **enable system sounds**, be checked. You''d be surprised
    at how many people fail to do this and then wonder why the sounds don''t work.


    In the section that takes up most of the tab, you assign sounds to actions. It
    looks as if this has already been done for you, doesn''t it? Well, hasn''t. For
    every action you want to bless with musical accompaniment, you must first select
    the action in the first column, labeled **Events**, and then select a sound from
    the second column, labeled **Sounds**. The Test button lets you try out the result.
    It''s a good idea to configure this when no one else is around.


    If you have other .wav files you''d like to use, you can drag them from a KFM
    window to the **Sounds** column, which they can be assigned to **Events**. (I
    very liked the startup and shutdown sounds that come with my copy of OS/2 Warp,
    so I brought them over and used them in KDE. They''re the only sounds I have enabled,
    and they''re elegant.) For some reason, not all .wav files work here, though I''ve
    never seen an explanation as to why this is so. There is apparently more than
    just one .wav format.


    The last general Control Center category, Windows, allows the tuning of a great
    desktop attributes. It begins with the **Advanced** tab, shown in Figure 5.40.


    137'
  merge: -1
