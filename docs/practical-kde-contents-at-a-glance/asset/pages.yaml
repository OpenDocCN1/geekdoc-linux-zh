  md: '# PART V


    # KDE Front Ends CHAPTER 27


    This application does not employ modules to connect it to the database application,
    so it works only with MySQL. It offers a wide variety of features, from administering
    user base access to the database to on-the-spot queries and table design (see
    Figure 27.9).


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_556_0.png)


    Figure 27.9

    In addition to its database administration functions, KMySQLAdmin offers full
    access to and manipulation of the databases themselves.


    # KOra


    A new arrival in the category, KOra is designed to produce a fully functioning
    front end for Oracle database products. As this is written, KOra is in its very
    early stages of development, but it looks promising and is well worth investigating
    if you have or are considering Oracle. As of late autumn 1999, it was at unstable
    version 0.3, though a good code hacker could probably make it do useful things
    and contribute to the effort as well.


