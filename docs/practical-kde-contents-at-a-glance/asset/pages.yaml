  md: '# PART I Installation


    # CHAPTER 3 KDM for a Totally Graphical System


    Many people believe never having to look at the command line is a good thing,
    and with KDE this is possible through use of an included program called KDM. (If
    you''re keeping score, it''s part of the kdebase package.) This chapter guides
    you through enabling KDM, describes the reasons why it isn''t always a good idea,
    and leads you through disabling KDM. That sounds amazing, and in a way it is,
    but there are good reasons for all of it.


    Those who use the Lizard to install Caldera Open Linux 2.2 have KDM enabled by
    default. When you reboot after the installation, graphical login is KDM. Alas,
    others have to enable it just to take a look. Because it appears before the user
    is logged in and has access to applications, there''s no real way to make a screenshot
    of it! This means that my description will have to.


    On a background of a color of your choices, a color gradient of your choice, or
    a bitmap of your choice, with either attractive but slow fancy accoutrements or
    speedy ordinary ones, there is a dialog box containing a greeting, little bitmaps
    of the system with their usernames, a small square bitmap, text boxes into which
    the username and password are entered, with buttons, a list box, and a menu across
    the bottom. These are Session Type (a list box), Go, Cancel, and Shutdown (which
    renders a menu). It is tremendously configurable, and you''ll see. For instance,
    for some reason you desire to do so, you could put scanned-in pictures of the
    users as the bitmaps that appear with their usernames. You can change the greeting
    to a company logo and the logo to the company logo. You can make pictures disappear
    entirely. (This is a smart thing to do from a security standpoint, if you are
    sure all the users can remember who they are without a photograph of themselves
    or other mnemonic aid. They will have to remember their passwords anyway.)


    You can set up KDM to launch a console session or even window managers and desktops!
    It is really pretty cool if graphical logins are your heart''s desire.


    # Setting Up KDM


    Let us begin with an assumption: KDM isn''t already running on your machine, and
    neither is xdm, which is a similar but less versatile graphical login manager.
    How do you tell? Well, when you start up your computer, after booting it presents
    a purely text screen with a line that says login;: and, after entering your username
    and pressing Enter it presents you with a line that says password;: you aren''t
    starting graphically. You are starting in run level 3. This is good. If these
    things aren''t true, we''ll get to you in a minute, in the next section, "Configuring
    KDM."'
