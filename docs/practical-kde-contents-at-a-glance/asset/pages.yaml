  md: '# PART III Using the Applications in the KDE Distribution


    # CHAPTER 20 KLyX: The Paradoxical Processor of Complex Documents


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_439_0.png)


    FIGURE 20.1


    Read the text of this window to learn the history of KLyX.


    It is impossible to use or use KLyX and not have a strong opinion about it. It
    is entirely possible, on the other hand, to have multiple conflicting opinions
    about it. It is certainly an attractive application, and it is the most elaborate
    and sophisticated of all the native KDE 1X applications.


    On the other hand, it is devilishly difficult to learn, and after you''ve learned
    it, what do you have? You have the ability to produce documents in a non-WYSIWYG,
    word processor that cranks out documents in an obscure format that in some cases
    it cannot read itself. That''s right: sometimes it cannot read its *own* files.


    Still, many extremely talented and skillful people spent thousands of hours for
    which they were not paying through KLyX and the underlying document processing
    code together. They must have had a reason, right?


    It is my sad duty to inform you that I shall now devote many pages to KLyX, and
    at the end of those pages you are likely to be closer to the answers to these
    questions than you are right now. The fact is, you love KLyX or you hate it...or
    both.'
