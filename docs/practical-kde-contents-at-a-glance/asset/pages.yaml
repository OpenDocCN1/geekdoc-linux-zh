  md: '# PART II

    Sorting It All Out with kmenued

    CHAPTER 6


    This is where you can do a little creative thinking to bring about remarkably
    practical results. If you are working on a project that consists largely of one
    file opened in a particular application, chances you can add the filename to the
    command and give the whole thing a unique name and icon. (Don''t forget to change
    the File Name entry.) When you click that menu entry, pops your file in its proper
    program. This is especially useful if you have set up KDE so that other files
    of that type open in a different program.


    This illustrates that the Execute line should contain any command line options
    you want to use when you run that program—from that menu item. You can have multiple
    items for the same program, each with a different set of command line parameters,
    so long as you make sure each has a discrete File Name entry. For instance, there
    are several versions of Globe from which to choose, depending on whether I want
    to see the Earth as viewed from space at a point above Connecticut, from the Sun''s
    point of view, with place markers turned on, and so on. My mood determines which
    one runs on any given day. The one I use most frequently has this in its Execute:


    ```

    xglobe -kde -mag 0.75 -makefile earth.gif -ambient 25 -wait 600 -nomarkers

    ```


    Just so you know, this means you execute the globe program (which is in /usr/local/bin,
    so it''s on your PATH) optimized for KDE at a magnification of 75 percent of full
    screen using for its surface contents of graphics earth.gif with the light on
    the dark side of the earth 25 percent as bright as the sunny side (though absent
    a setting telling it it so, I don''t see the dark side anyway) updated every 600
    seconds and without any place markers.


    If the program requires a Working Directory to be specified, you may do so in
    the box of that label. Most don''t.


    If the program is a console application, you need to check the Run in terminal
    box. If there are any command line options that need to be set for the terminal
    window before it runs your application, you can specify them in the Terminal Options
    box.


    > If You have an Earlier Version of KDE In the early days of KDE, the default
    behavior was for the Run in terminal box to be checked, so a terminal window would
    show up when you didn''t need it. But if you closed it, the window containing
    the program you wanted would close, too. There was a lot of head scratching where
    we users figured out what the problem was and that the solution was to go to kmuedit
    every time this happened and uncheck the box


