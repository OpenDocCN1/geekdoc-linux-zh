  md: '# PART III


    # Hex Editor: If You Really Need to Look at Binaries


    Since the earliest days of the Norton Utilities (probably earlier than that),
    it has been deemed useful to have a binary file editor and viewer. I did not know
    why then, and I barely know why now, but KDE includes it. You can find it at K
    Menu > Hex Editor. I bring it up because you might see it and wonder what it is,
    and you might be someone who hopes that such a thing exists. It does (see Figure
    14.12).


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_334_0.png)


    FIGURE 14.12


    The Hex Editor is a powerful tool for those who know what to do with it, and a
    powerful way to screw up your system for those who don''t. If you don''t believe
    me, make some random edits to an important binary file, save it, and watch what
    happens when you run the program. Better still, just believe me.


    To those who know what to do with it: Hex Editor supports drag and drop, so you
    can drag your binary file from KFM and it will work.


    Those who don''t know what to do with it: If you want to go around in binary files,
    looking for comments made by programmers (and there are a lot of those in Linux),
    make sure you limit your looking to files for which you don''t have write permission.
    Then you can break anything. To be extra—you really can imagine the damage you
    could do—don''t change anything and, when you close the program, if it you want
    to save changes, say No.


