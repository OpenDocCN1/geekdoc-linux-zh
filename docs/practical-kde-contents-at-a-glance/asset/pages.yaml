    # Using .kdelnk Files for Total Control


    This is where things get really cool. Because .kdelnk files are just that—files—you
    can manipulate them in pretty much the same way you can manipulate other files.
    This opens a world of possibilities.


    For example, let''s say that you, having popped an icon for Ssystem on your desktop,
    suddenly decide that you like the program (and you should—it''s great), you don''t
    use it in the course of your work, so you don''t want it prominently placed as
    it is when it is a desktop icon. (Go through your K Menu and count up the applications
    that are part of your KDE distribution. Imagine what your desktop would look like
    if they were all ionized on the desktop!) You could right-click on the icon and
    select Delete, and that would be. But then the System.kdelnk file would be deleted,
    and it would go your work in configuring it. You don''t have the thing, just want
    to bury it to a level or two. What to do?


    Easy. Open KFM, the file manager. (If you have View > Show Tree enabled in KFM,
    this is a little easier, but by no means necessary, and we''ll figure out how
    to do it both ways.) Then open your Desktop folder. There you will see the .kdelnk
    file for every icon that appears on your desktop (see Figure 8.22). If you View
    > Show Tree enabled, you will also see the ~/ files displayed on the left side
    of the window.


    Now, move up the tree on the left until you find ~/.kde directory. (For this,
    you will need to have View > Show Hidden Files checked.) When you find it, click
    the little triangle to see it, not on name. Now a listing of subdirectories will
    open on the left, but the Desktop directory will be displayed on the right. Click
    the triangle to Share to show more subdirectories. Click the triangle next to
    Appl down its subdirectories, and on the triangle next to X-apps display—all the
    subdirectories located in your Personal K Menu! (see Figure 8.23)


    +   ALSO

    > If this all seems confusing, you might want to take a look at Chapter 10, "Navigating
    Everything with KFM," page 225, which is about the file management functions of
    KFM.


