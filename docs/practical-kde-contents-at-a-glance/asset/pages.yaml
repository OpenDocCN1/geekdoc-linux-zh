  md: '# introduction


    Early in the summer of 1998, a remarkable event took place. That was little remarked
    upon outside a relatively small group of computer users doesnt really matter.
    For here was the first time that a group of volunteers, working together even
    though they were spread around the world and had many never met each other, produced
    a complete, full-featured graphical user interface and accessory applications
    for a computer operating system. It included system configuration tools, communications
    applications, games, small productivity tools—everything one would expect in an
    expensive commercial GUI, and all with a common interface.


    It was as if a group of talented young hackers, in touch with each other chiefly
    by chemial, had gotten together and starting from scratch produced Microsoft Windows
    (They would be insulted by this, because they believe, not without supporting
    evidence, that their work is in many ways better than Windows. This book will
    not undertake that argument and will leave it to the Internet news. I am not writing
    about Windows, and I''m not writing on a machine running Windows; I guess my vote
    has been cast.


    Their project was called KDE or, more properly, the KDE, because KDE stands for
    K Environment (the K doesn''t stand for anything), and on that summer morning
    version 1.0 of it was released.


    Here for the first time was a fully integrated GUI for the increasingly popular
    Linux operating system as well as other, similar operating systems. It was pretty,
    it was powerful, it was easy to use, and it was free for the download.


    # A Little History


    It is now almost legend how in 1991 a mild-mannered, modest, and brilliant young
    science student named Linus Torvalds sought to write a clone of the powerful UNIX
    operating system that would run on a relatively modest computer. Satisfied with
    what he had begun, he made it freely available to others over the Internet.'
