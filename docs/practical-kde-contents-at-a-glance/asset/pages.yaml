    # System Requirements


    We are all familiar with unrealistic claims for software: notations on the box
    that say “80386 processor and 4MB RAM required, Pentium III 500 and 128MB RAM
    recommended.” Well, maybe not that bad, but clearly there''s a difference between
    the theoretical and practical minimums. In this is not Theoretical KDE, we''ll
    deal here in the practical minimums: what you need to have in order to actually
    do useful work. The requirements are not excessive, and the chances are good that
    your computer more than meets them or can be made to do at very little expense.


    # Hardware


    For all practical purposes, you will need a Pentium processor (or its equivalent);
    I''ve had great success with AMD chips, the faster the better; 64MB of RAM (more
    helps, too); and a hard drive with at least 100MB of available storage on a Linux
    (ext2) partition.


    The greatest likelihood of a problem is with your video card. (Fully-third of
    the questions and problems posed by KDE mailing lists and newsgroups are video
    card related, with the rest spread equally about 요즘, network cards, and everything
    else.) Whether your video card is supported or not up to KDE; it is determined
    by the support or lack thereof in Xfree86. It is a good idea to check the hardware
    compatibility list posted on the Web site of the vendor of your Linux to make
    sure your card is supported. Alternatively, you can check at the Xfree86 site,
    http://www.xfree86.org. The biggest problem seems to be with your newest, cutting-edge,
    3D cards. If a manufacturer makes specifications'
