  md: '# PART I

    If KDE Came with Your Linux Distribution CHAPTER 1


    This chapter is devoted to bringing you to this happy point, so if you''ve already
    achieved it, you''re ahead of the game. This doesn''t mean, though, that you should
    ignore what follows. You''ll want to upgrade KDE at some point, and you may well
    want to compile a version of KDE especially suited to your own system. In those
    cases, you''ll be back.


    There''s a chance, too, that you''ll be using a distribution that won''t go at
    once to the KDE desktop.


    # Some Distribution-Specific Notes


    Because of varying interpretations of Linux standards, variation among things
    allowed by those standards, and frankly, variations among the things that distributors
    find convenient, KDE finds itself by default in different places depending on
    the Linux distribution. There is sense in removing the KDE included with the distribution
    and downloading new KDE from the KDE ftp site (http://ftp.kde.org or one of its
    mirrors) and installing it to /opt/kde. Here''s where the distributions put KDE
    unless you force them to do otherwise.


    +   SEE ALSO

    I have more on placement of KDE in Chapter 35, "Upgrading to the Latest KDE Version,"
    page 629.


    # Red Hat 6.0


    In several places, Red Hat 6.0 is considered the most "cutting edge" of the distribution
    and blazes its trail. The area of chief interest at the moment is the fact that
    it comes equipped with three different window managers and desktop programs: KDE,
    Gnome, and AnotherStep. It also comes with a program called Switchdesk, which
    enables you to move freely among these things, you can''t run them all at once.
    The KDE included with Red Hat 6.0 is version 1.1.1pre2, which is a beta version,
    so there is some sense in upgrading to 1.1.1 or 1.2 as soon as you''re comfortable
    with KDE. Previous versions of Red Hat did not contain KDE at all, so if you are
    running one of these, you will have to download and install KDE.


    # Caldera OpenLinux 2.2


    Caldera makes more extensive use of KDE than any other distribution and is aimed
    at stability for serious business use. In fact, the installation program is based
    on the same programming tools and libraries as KDE itself. When you boot the default
    Caldera OpenLinux 2.2 system, you are greeted by the KDM graphical login screen,
    which takes you directly to KDE. Caldera 2.2, however-ever, is shipped with KDE
    1.1, so you will want to upgrade as soon as you feel competent to do so, which
    is to say after you''ve read this chapter.'
  merge: -1
