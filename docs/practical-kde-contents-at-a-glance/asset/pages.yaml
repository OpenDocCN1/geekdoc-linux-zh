    After gone to all this trouble, there''s a good chance you might want to employ
    your hard-won color, or a variation on it, elsewhere. To do this, you can save
    as one of the 24 possible Custom Colors. First, click a blank space in the Custom
    Colors section, which starts out with 24 blank rectangles. (If they''re all full,
    pick one that you''re not excited about anymore, because it will be overwritten
