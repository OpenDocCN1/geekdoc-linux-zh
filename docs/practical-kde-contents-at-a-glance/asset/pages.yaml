  md: '# # Making Systemwide Changes


    So far we''ve dealt merely with changes to your Personal menu, which is a good
    place to start anything before you break there without too much trouble. Now it''s
    time to move into the big leagues: Making changes in the original K Menu that
    affect all users on the system.


    You may have noticed the lack of reference so far to the K Menu that was on the
    right in all of the illustrations showed knuedit. If you have been editing your
    Personal menu, you may also have noticed that all the entries on the menu on the
    right were "grayed out," and there was nothing you could do with them.


    As root, that isn''t grayed out anymore and you can do with it as you want.


    The principles and actions are all still the same. Do everything the same way,
    just on a different menu with broader consequences.


    If you wanted, you could just log in as root and incorporate all your Personal
    stuff into the main K Menu. Everybody on the system would be able to use it, providing
    you had all the permissions properly set (for applications and files residing
    in your ~/directory, for instance).


    This all depends on the kind of system you are using and who uses it as. And this
    section has to do with systemwide changes in K Menu performed as root, it''s a
    good place to consider a general menu strategy if more than one user is on your
    system, or if you have associates or family members have accounts.


    > **K Menu Everywhere**

    Last chapter learned that you can press Alt+F1 anytime you''re in KDE and cause
    the K Menu to appear. Here''s another trick that you''s even nearer: You have
    a file, probably empty, ~/.kde/share/config/krootwmrc. If you do, open it in an
    editor, say Kedit. If you don''t, you can open the editor to an empty file. Either
    way, type these two lines:


    [MouseButtons]

    Left=Menu**


    Then, save the file (and if it did not exist previously, save it as ~/.kde/share/config/krootwmrc).

    Now, next time you start KDE, clicking anywhere on the screen that isn''t otherwise
    occupied will produce K Menu.


    For example, if you have family members of varying ages and interests of all of
    whom use the computer, each with his or her own username (account), you might
    want to make the main K Menu, that goes to everyone, relatively sparse, to avoid
    confusion and to keep inquisitive little clicks from going where they ought''t.
    In such'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# PART II

    Making Systemwide Changes CHAPTER 6


    cases, Personal menus that come up first with the applications a child might use
    would make sense.


    Or you might be administering a Linux system that''s used in a small office. The
    games are quite a temptation; so is the Internet. You can tuck these safely away
    from the main K Menu and make them available to users who won''t overdo it or,
    in the case of the Internet, need access.


    Very likely you can move some system administration tools from the main K Menu
    without harm and with some reduction of clutter. Many of these can be executed
    by root anyway. The entire System and Settings submenu, for instance, can be moved
    from the main menu to root''s Personal menu. (Oh yes, root has a personal menu,
    too.)


    There are some potential pitfalls, of course. You don''t want to remove configuration
    tools until all the desktops are configured. You don''t want to delete anything
    from the main K Menu without first copying it to root''s personal menu and making
    sure it works. You need to plan the menu structure of your system. And if you
    move things, you need to remember where you put them because online help and sources
    such as this book won''t be said, able to guess where you put the program being
    discussed.


    Having been said, one of the great strengths of Linux is that it is a multiuser
    system. KDE builds on that fact admirably, providing tools to make the most if
    its system administration. The point is that skillfully and thoughtfully used,
    knuedit when run as root can make use of the computer more rewarding, more productive,
    and safer for all.


    SEE ALSO


    +   > We''ll look at system administration in some detail in Chapter 12, "Managing
    Linux System Functions with KDE," page 271.'
  merge: -1
