  md: '# PART III Using the Applications in the KDE Distribution


    # CHAPTER 19 A World of Other KDE Applications


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_435_0.png)


    FIG 19.9


    If you are interested in weather, or if you have to keep track of it, KWeather
    makes things easier. It lets you keep a running record of temperature, precipitation,
    and so on. Beware, though. It graphs temperature in Celsius, barometric pressure
    in Celsius, and rain in centimeters, so for the uninitiated, it can be a metric
    nightmare.


    You keep a separate file for each item. If crops (or even a good-looking yard)
    are among your concerns, KWeather, available at www.privat.kkf.net/ -juergen.hochwald/kweather/e_index.html,
    is of interest to you.


    # KLab


    I don''t know quite what to make of KLab. I know that it is from David Sweet,
    and if he sees a need for such a thing, you can rest assured that there is a need
    for such a thing. Here''s what his page says about it:


    > “KLab is based on Rlab by Rlab is a matrix math engine and high-level prototyping
    language interpreter. It provides plotting services through externally-defined
    functions (. files). This function base will be modified and extended as needed
    to interface with KLab. The plan is to provide a plot window, KLab command entry
    window, simplified matrix entry via a spreadsheet-like grid, point-and-click plot
    editing, drag-and-drop support (for raw data files), active UI controls, output
    to .ps, .gif, .etc., and a proprietary format that plots/variables may be reloaded.”


