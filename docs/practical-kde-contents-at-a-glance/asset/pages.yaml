  md: '# PART IV Going Online with KDE

    CHAPTER 21 Going Online with Kppp


    Linux is a creature of the Internet. It was created there, it grows there, and
    a- surprisingly large part of the Internet is based on it. So, too, with KDE (though
    there''s really nothing of KDE on which to base any part of the Net). It were
    not for pro- programmers working together from all the world via the Internet
    and users who download the thing via the Internet, there would be no KDE or using
    it.


    Of course, the majority of Internet users use the Internet through dial-up accounts
    through an Internet service provider (ISP). It therefore was necessary for KDE
    to include a native dialer application.


    > If You Like Your Dialer

    Other X System dialers have been around for years now, the most popular being
    EZPP and Xisp, both of which are quite good and will work under KDE. So if you
    have one of these and are attached to it, you''re free to continue with it.


    In putting together the dialer, Kppp, the KDE developers sought ease of setup
    and use, richness of features, and ready access to anything you are likely to
    need. You are likely to conclude that they succeeded on all counts.


    This chapter helps you set up Kppp for your account. It does not go into the theory
    of ppp or the inner workings of Linux''s use thereof. My goal here is to get you
    online with minimum fuss and bother.


    # Setting Up Kppp for Your Account


    When you start Kppp, the first thing you need to do is set up a new account (see
    Figure 21.1).'
  merge: -1
  pgno: 457
- img_proc: true
  md: '# PART IV

    Setting Up Kppp for Your Account CHAPTER 21


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_458_0.png)


    FIGURE 21.1

    The New Account page dialog box begins a fairly quick and easy configuration process.


    The Dial page involves naming the account and providing the telephone number (don''t
    forget the *70, to dial if you have call waiting). If your ISP has multiple phone
    numbers, you may separate them with colons; in which case a busy signal Kppp to
    dial the next number. You must then select the kind of login your ISP requires
    and choose it from the Authentication list box (see Figure 21.2).


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_458_1.png)


    FIGURE 21.2

    You may need to find out from your ISP the kind of authentication required. If
    all else fails, script-based authentication usually works.


    445'
  merge: -1
  pgno: 458
- img_proc: true
  md: '# PART IV Going Online with KDE


    # CHAPTER 21 Going Online with Kppp


    If you are the only one who ever uses your machine or your Linux account, you
    can check the Store password box; otherwise, you must enter your ISP account''s
    password each time you log on to the Internet. If you want to run any programs
    online or immediately afterward, you may enter them here too. And if your system,
    modem, or ISP requires that any arguments be passed to pppd, the point-to-point
    protocol daemon, you can enter them by clicking the button below. Before you do
    this, you should make yourself familiar with pppd, which is beyond the scope of
    this book.


    > About pppd

    in many cases, you may be able to get up and running without considering the Linux
    p daemon. If you''re among those who need to feed special parameters to this program,
    you can find help—and you''ll need it—in a number of places. The first is the
    ppp man page. The second is the PPP HOWTO, which is likely to come with your Linux
    distribution and probably resides on your machine.

    It''s always a good idea to have a good, comprehensive Linux manual. Among the
    best are Special Edition Using Caldera OpenLinux by Allan Smart, Eric Ratcliffe,
    Tim Bird, and David Bandel (Que, ISBN: 0-7897-2058-2) and Running Linux, Third
    Edition by Matt Weiss, Matthias Kalle Dalheimer, and Lar Kaufmann (O''Reilly,
    ISBN: 1-56592-489-X).

    in any case, you should take a lazy afternoon or evening to explore the Linux
    HOWTOs. They''re usually in /usr/doc/HOWTO, and they represent an enorm of information
    about your operating system and its applications.


    The next tab in your New Account setup is IP (see Figure 21.3).


