    # FTP Transfers


    FTP (file transfer protocol) is of course the standard way of uploading and down-

    loading files over the Internet. And, as noted (and discussed in detail in Chapter
    10),

    KFM is an excellent tool for bringing this about. With the addition of another
    native

    KDE application, though not one included in the core distribution, it becomes
    very

    early perfect.


    The tool is called Caitoo (early versions were called KGet; the reason for the

    change is unknown to me). It is an FTP tool that, in conjunction with KFM or

    another browser that supports drag and drop, makes downloads easier and far

    less risky.


    > Getting and Building Caitoo

    You''ll find the latest Caitoo on the KDE ftp site: ftp.kde.org/pub/kde/. Once
    you''ve gotten the source

    tarball, as root, copy it into /usr/local/src, and use tar xvf to open the source
    into its own directory.

    Still as root, change to the Caitoo source directory and type ./configure. After
    that, type make all,

    followed by make install. That''s all there is to it!


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_510_0.png)


    The current version is on the KDE ftp site. Yes, you have to compile it yourself,
    but

    it compiles easily and in conformity with the KDE standards. In short, it''s easy
    to

    do. It may be possible to find a prebuilt binary somewhere, but building it yourself

    sures that it works on your machine and isn''t terribly more difficult than is

    installing somebody''s binary.


    When it is installed, you can find Caitoo at K Menu > Internet > Caitoo, and when

    clicked, it looks much like the window pictured in Figure 24.2.


    497'
