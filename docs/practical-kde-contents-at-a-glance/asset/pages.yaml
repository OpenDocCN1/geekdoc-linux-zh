  md: '# PART IV

    Filtering Messages CHAPTER 22


    Messages in the kde-user list always have the phrase "KDE User List" in the To
    field. So in the first blank drop box, select To. The second drop box defaults
    to Contains, leave the text box on the same line, type KDE User List.


    There is a stack of drop boxes down the center of the Filter Rules page, each
    of which is initially labeled <nothing>. Select the first of these, and it chooses
    Transfer. Another drop box, containing the names of all your existing folders,
    appears to the right on the same line. Select the folder into which you want your
    kde-user messages to go.


    In the next drop box that contains <nothing>, choose skip rest. This is not strictly
    needed in this example, but it''s good practice. Its function is to make sure
    that no further functions are performed on the message.


    The results are shown in Figure 22.28.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_494_0.png)


    FIGURE 22.28

    Here''s how your filter to move kde-user list messages into the KDE folder should
    look.


    Finally, click OK.


    Now, as you have probably already figured out (and certainly have you''ve played
    along on your real, live Kscreen as we''ve explored filters here), the top three
    lines of the Filter Rules dialog allow you to enter one string and modify it for
    messages containing a second string. You can also put criteria into the filter
    by using more than one of the drop boxes labeled <nothing>. For instance, if you
    are a regular recipient of spam from a particular address, you can filter mail
    from that address so as to format it to your ISP''s spam-control department and
    the Trash folder. You can make very elaborate filters.


