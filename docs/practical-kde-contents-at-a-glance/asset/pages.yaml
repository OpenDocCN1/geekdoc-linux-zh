  md: '# PART IX


    # APPENDIX A Finding the Latest KDE and Its Applications


    The center of the KDE universe is www.kde.org. Don''t just bookmark this location,

    emorize it!


    You can find the latest KDE news there, but stopping by the home page won''t keep

    you up to date on the applications that are available for your testing and use.
    To stay

    of the bleeding edge, you need to dig a little deeper.


    Here are some sites that you get the code before the electrons have had a chance

    to settle:


    +   * www.kde.org/wp.html—The “work-in-progress” page, this is the very sharpest

    part of the cutting edge. It lists applications in the works, with home pages

    where you can obtain early code.

    * www.kde.org/appomepages.html—This is a page containing links to KDE

    applications that have home pages. Many of the home pages, in turn, allow you

    to develop the latest developmental code, most of which surprisingly well.

    * www.kde.org/applications.html—This page lists all the applications that reside

    on the KDE ftp site. Again, there are links to home pages where you can find

    descriptions of the applications and, perhaps, never code.


    Bear in mind that in every case listed here you will need to compile the source
    code

    yourself (which is again it isn''t all that difficult), and in some cases you
    might

    end up with a working application. But you will frequently find that it''s

    worth the effort, and sometimes a failure to compile is something that the program''s

    author will thank you for a note about. (Please be specific as how the compilation

    failed, including the final error message, and do not inform the developer that
    he is

    in your opinion doing a a lousy job. Be helpful. We''re all in this together.)


    Downloading the latest KDE itself is done via one of the KDE mirrors. You

    find these at www.kde.org/mirrors.html. If you select a site near you, you will
    avoid

    congestion on the main KDE ftp site and probably get a faster download.


    # What the Core KDE Packages Contain


    It can be useful to know which of the dozen or so packages in the KDE core contain

    which applications. This is especially true if you have erased or corrupted

    a file essential to just one program. You can reinstall or recompile that package.
    (If

    you''ve left your KDE compilation intact in /usr/local/src/, you can go to the
    proper

    directory and type make install to get your files back.) It''s a poor idea, though,

    to update just one or two packages because the packages rely on each other, especially

    on kdelibs.


    668'
