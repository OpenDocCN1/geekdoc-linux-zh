  md: '# PART I Installation


    # CHAPTER 4 An Introduction to the K Desktop


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_93_0.png)


    FIGURE 4.17


    KDiskNavigator takes you recently and frequently used locations on your computer.


    KDiskNavigator is the only K Menu item locations we will look at in this chapter
    because K Panel is minimized, it is one of the few things that remains and because
    it really is a desktop kind of program.


    The fundamental notion behind KDiskNavigator is that in an elaborate hierarchical
    file system such as Linux, you can access the places you want to visit on your
    computer more efficiently than climbing up and down the directory tree. (A tree
    has its root at the top, by the way; it might actually make more sense if it were
    displayed upside down.) KDiskNavigator (hereafter referred to as KDN) shortens
    to the distance between two points: where you are and where you want to go, not
    today but right now.


    To view, click the K Menu button and restore your mouse pointer over Disk Navigator.
    When it appears, you will see that it is divided into several sections:


    +   * Shared provides access to the files and resources on the machine that all
    users use.

    * Personal tasks takes you to your local desktop and your home directory.

    * Recent provides shortcuts to the applications you have recently used.

    * Options lets you configure KDN.


    80'
