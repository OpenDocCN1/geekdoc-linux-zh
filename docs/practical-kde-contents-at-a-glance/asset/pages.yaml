  md: '# PART III


    # System Enhancements CHAPTER 19


    # Source Code


    The applications listed here are available chiefly as source code tarballs. While
    compiling code has been made very easy, it isn''t going to involve any animations,
    "wizards," or cutesy stuff that disguises the fact that it is doing what it wants
    to do and not what you want it to do.


    I''ve compiled the applications depicted here. I found and downloaded them all
    in the space of an hour or so; compiling less than 30 minutes for all the applications.
    This is not difficult stuff.


    Without exception, the entire process involved exactly this:


    +   1. Downloading the tarball and copying it to /local/src/.

    2. As root (actually, so in a console window), typing tar xvfz filename.tar.gz
    and pressing Enter.

    3. Changing to the newly created /local/src/filename directory and reading the
    INSTALL and README files.

    4. Typing /config prefix=/opt/kde and pressing Enter.(If your KDE directory is
    elsewhere, use its actual location.)

    5. Waiting for a minute or while the configuration took place.

    6. Typing make all (would have compiled with just make, but make all does no harm
    and is sometimes needed) and pressing Enter.

    7. Waiting for a few minutes while the application was compiled.

    8. Typing make install and pressing Enter.

    9. Restarting KDE so those applications automatically put entries in K Menu would
    have those entries recognized.


    That''s it.

    I''ve relied on this, and will continue to do so: If you''re using Linux, you''re
    cheating yourself if you''re not compiling applications.


    # System Enhancements


    I browsed the list of applications in the works, again, available either at the
    KDE ftp site or linked on the KDE Web site, a couple of them appealed to me. Setting
    the system time in Linux is always a little bit of a pain, especially if you''re
    limited to the somewhat obscure command-line programs. It was extremely pleasing,
    then, to see kcmclock see Figure 19.1.


    413'
