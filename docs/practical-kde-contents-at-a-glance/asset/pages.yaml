- img_proc: true
  md: 'Fortunately, when we begin to customize the K Desktop in the next chapter,
    I''ll show you how to fix the problem of disappearing applications and offer some
    other useful customization ideas.


    # The K Panel Buttons and the Pager


    The Desktop Switch buttons on K Panel are sometimes called "the pager" because
    many Linux desktops contain an application of that name that does much the same
    thing. True pagers typically contain a very small view of the applications running
    in each desktop, as a reminder of what this is. The buttons on K Panel do not
    do this. To further complicate the issue, a small utility called the Desktop Pager,
    located in the K Menu''s System submenu, performs this function, displaying the
    icons of running applications in each desktop. The K Panel buttons do have one
    aid to navigation: the button of the current desktop has a darker look, as if
    it has been pushed.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_92_0.png)


    You should know a couple of things about virtual desktops. You will notice in
    all applications running under KDE—even non-KDE applications—a little widget that
    looks like a pushpin to the miniature application in the upper-left corner of
    the application window. If you click on this, the application becomes *sticky*.
    This means that if you have pushed this button the application persistently follows
    you around from desktop to desktop.


    You will also notice that as you move from desktop to desktop, the taskbar continues
    to show applications running in all windows. If you click on an application that
    is running on a different desktop, the application isn''t brought to the current
    desktop. Instead, you are returned to the desktop where it is running.


    Finally, if you have KDE-native applications running across several virtual desktops
    when you shut down KDE, they will all reopen when you restart on Desktop One.
    This can be quite a surprise. On the other hand, it can remind you that you had
    these applications running all over the place, perhaps forgotten, consuming system
    resources.


    # Zooming Around with KDiskNavigator


    A relatively new arrival to the KDE desktop is *KDiskNavigator*, which can make
    your life a lot easier. It is illustrated, albeit in a fairly extreme form, Figure
    4.17.'
