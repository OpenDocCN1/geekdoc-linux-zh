  md: '# PART III


    # Organizing Your To-Do List CHAPTER 13


    Which is to say that you need the reminder to go off at a given time every: perhaps
    you need to take medicine or vitamins at the same time day, or you need to call
    to make sure the kids got home safely from school. You can also set weekly, monthly,
    and even yearly reminders by checking the appropriate box.


    The Recurrence Range section lets you stop being bothered by the alarm when the
    prescription runs out, the project for which the meetings are scheduled is completed,
    you''ve paid off the mortgage, or you break up with that someone birthday birthday
    needed to be reminded of. If you are in prison, perhaps you can remind yourself
    of the number of days remaining in your sentence, or the regular schedule of parole
    hearings, if the screws let you have a computer.


    The Exceptions section allows you to specify times when the alarm will not go
    off the event will not take place. The Monday meeting might fall on a holiday
    and therefore will be cancelled, or the Grinch might steal Christmas. You get
    the idea.


    # Organizing Your To-Do List


    As complicated as setting an appointment can be, adding an item to the To-Do list
    is simple. Right-click on the list and select New To-Do from the resulting menu
    (Figure 13.24).


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_318_0.png)


    FIGURE 13.24


    Right-clicking on the To-Do list lets you enter a new item and remove completed
    ones.


    Having selected New To-Do, you are presented with a blank line in the list, which
    you can fill out as you wish. You should notice that it is preceded by the number
    1 and an empty box. If you double-click on the number, you will be given a list
    of priorities for this item, from 1 to 5, as seen in Figure 13.25.


    305'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# PART III Using the Applications in the KDE Distribution


    # CHAPTER 13 Keeping Track of Your World with KOrganizer


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_319_0.png)


    FIGURE 13.25

    KDE standards are again flung down and danced upon in the selection of a priority
    for an item in the To Do list. Double-click on the 1 to get a drop box of other
    numbers.


    When an item has been completed, you can rid yourself of it. Double-click the
    little box after the number, which enters a check mark there (see Figure 13.26).
    Then, using the right mouse button, draw forth the menu and select Purge Completed.
    All items marked with the check mark are deleted.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_319_1.png)


    FIGURE 13.26

    Mark an item as completed by double-clicking the box that follows the priority
    number.


    An additional oddity is the RMB menu when you click on the item itself, as in
    Figure 13.27. This is a puzzler because it contains items that apply to more than
    the selected item. This is also where you can sort the entire list by the priority
    numbers you assigned to the specific items.


    306'
  merge: -1
  pgno: 319
- img_proc: true
  md: '# The KOrganizer Alarm Daemon CHAPTER 13


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_320_0.png)


    FIGURE 13.27

    ing the RMB on an item in the To Do list produces a menu that offers general as
    well as specific choices.


    # The KOrganizer Alarm Daemon


    When you started early versions of KOrganizer, an icon would appear on K Panel.
    It looked like a KOrganizer view icon, but it had a bell atop it. It was the alarm
    daemon, a small program that runs even when KOrganizer isn''t running, to keep
    track of any alarms you have set. It ran even if you had no alarms set, and while
    it did not take up much processor time or memory, it did consume some, and it
    was very difficult to kill.


    In recent versions, though, it runs only when you have actually set alarms while
    entering appointments. This is a big improvement, and it requires only that your
    computer be on with KDE running.


    As you can see, while KOrganizer is still a little rough around the edges, it
    is also very powerful as calendar applications go. With a little practice, you''ll
    wonder how you ever did anything else.'
