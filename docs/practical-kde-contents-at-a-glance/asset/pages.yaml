  md: '# Getting and Installing KlyX


    The latest version of KlyX is always available at the KDE Web site (www.kde.org)
    or ftp site (ftp://ftp.kde.org/pub/kde/) or the KlyX homepage (www.devel.lyx/~etrisch/klyx.html).
    Sometimes binaries are available, your best bet is to download and compile it.
    In my experience it compiles unevenly.(It''s a good idea to specify your KDE directory
    as the -prefix option when running /configure/).


    When you run KlyX for the first time, you''re likely to be surprised by the big
    KOOffice logo that splashes into your screen with the size of the little dumpling
    child. Don''t worry: It will go away after a few seconds. You may also be treated
    to a dialog box saying that there is no Lyx directory in your home directory.
    If you are, let KlyX create one. It is where your configuration and data files
    will be stored. The default KlyX window size is too small to be of much use, but
    you can drag it to a larger size.


    At first, the Help menu is all empty, but, the first thing you should check. clicking
    on any of the items returns an error, saying that the help files could not be
    found. This is because the help files, unlike those of other KDE applications,
    are not HTML but .lyx format. To get to them, open /kde/share/kde.org/apps/klyx/doc/Intro.lyx.
    Now the help file is populated with a wealth of documentation, though most of
    it is for LyX, of which KlyX is a rather more elegant port.


    # Necessities


    The bottom item in the Help menu is, actually, the first thing you should check.
    It contains the results of the search compile-and-install process did for things
    that determine whether your system has everything necessary for KlyX to work.
    It is entirely possible to compile and install KlyX without support software on
    your machine, but you won''t be able to do much of anything useful with it. This
    file also contains information as to where you can download the latest version
    of anything it wants that you don''t have.


    Here is what it wants:


    +   - TeTeX—The current distribution.

    - LaTeX—The TeX macros that makes TeX (barely) bearable.

    - Linux Doc-sgml tools—Files that support various formats under Linux. It is sometimes
    referred to as linuxdoc.'
  merge: -1
