    # A Caveat and a Confession


    There is a problem, though: the settings you make and save in Konsole apply to
    every Konsole session, no matter what the application running (or if it''s a plain
    terminal window) thereafter. It would be nice to have different sizes for different
    applications, but you can''t get them this way.


    My little confession: Yes, I know that Midnight Commander is also a Konsole menu
    item, so making an icon and menu item for it are at least redundant. I chose it
    anyway it illustrates the principle better than just about any application. I
    thought about using the popular Mutt mail program, which is installed on just
    about every Linux machine, but most people run it in a color Xterm, not Konsole,
    and color Xterms, though they run fine atop KDE, are outside the scope of this
    book. A color Xterm is a non-KDE terminal application, one of a multitude available
    for running under XFree86. You probably have Xterm installed on your machine.

    typ man xterm at a command prompt provides details.


