- img_proc: true
  md: '# PART II Customizing the K Desktop


    # ## CHAPTER 9 Working with Themes


    > > **You Could Upgrade**

    If you don''t feel you''re up to hacking code and then compiling it, you may skip
    the rest of this section and spend the time downloading KDE Co 1.2 instead, if
    themes are something that puts wind in your sails.


    As root, change to /usr/local/src/kthemememgr. Then run

    ./configure [followed by -prefix= and whatever other options you like]


    Then, using a text editor, open /usr/local/src/kthemememgr/kthemememgr/Makefile.
    Yes, kthemememgr appears twice. Find the file that gets kthemememgr_LDADD. It
    will look like this:


    ```

    kthemememgr_LDADD = -kimqlio -jpeg -lkfile -lkfm -lkdeui -lkdecore

    -lqt -lxext -lX1 $(LIBSOCKET) -png -tiff

    ```


    Add -iz to its end, to wit:


    ```

    kthemememgr_LDADD = -kimqlio -jpeg -lkfile -lkfm -lkdeui -lkdecore

    -lqt -lxext -lX1 $(LIBSOCKET) -png -tiff -lz

    ```


    There is a potential problem here. If your text editor is set to do wordwrap,
    a carriage return gets thrown in, and the line is split the instant you try to
    edit it because it is very long. This means that you will have to add a space
    at the end of every line in the line, and then go to the next part of the line
    and backspace once to reassemble the parts. This is a pain, but it can be done.
    Now, if you have installed the latest libtiff and libtiff-devel, zlib aslibz-devel,
    libpng and libpng-devel, you can change to /usr/local/local/src/kthemememgr and
    run


    make all


    followed by


    make install


    and have even chance or better of actually building the thing.


    214'
