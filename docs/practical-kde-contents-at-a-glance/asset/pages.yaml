    # Compiled Binaries: RPM and DEB


    For our purposes, you will be interested in the RPM or DEB subdirectory: DEB if
    you are using Debian Linux, RPM if you are using any other Linux distribution.
    (PKG is for Solaris, and TAR is something we''ll get to when we discuss source
    code.)


    In each of these subdirectories, you''ll find more subdirectories. In the case
    of RPM, it contains specially built binaries for specific Linux distributions.
    In the case of DEB, it has packages built for different versions.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_33_0.png)


    Why should you care? Because this is why KDE has so many different binaries. Many
    people are happy with their older, glibc-based systems, which are stable and in
    many cases quite elaborate. (When you visit a Web site, the chances are glad that
    you''re connected to an older Linux system. Upgrading to a new distribution isn''t
    something undertaken lightly) Whereas most modern distributions can happily run
    glibc-based applications, those applications lack the advantages of the more powerful
    glibc, and an Linux system simply doesn''t run anything against glibc.


    So, in the DEB subdirectory you will find subdirectories for the glibc5 (Hamm)
    distribution, and the glibc (Potato) one. (Who names these?)


    As, in the RPM subdirectory you are stuck with glibc, which contains subdirectories
