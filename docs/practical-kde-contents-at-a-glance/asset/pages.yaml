    can prevent duplication by providing a central repository for data such as addresses,
    phone numbers, email addresses, reminder dates, and so on. A step in that direction
    is made by the KAddressbook applet. Ultimately, it could provide the information
    for mail merges in the under-development KOffice, addresses for KMail, even a
    cross reference that would pop up automatically with a caller ID application.
    Its potential, therefore, is very great.


    Though still in its early stages, KAddressbook is already linked to KOrganizer
    (though deep within it) and is useful in its own right. **Menu > Utilities > Address
    book** gives you a look at its current state (see Figure 14.30).'
