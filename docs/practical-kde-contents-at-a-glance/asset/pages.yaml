    Running a Windows application under VMware involves getting VMware started—type
    vm in a console window and select the virtual machine you want to use—after VMware
    boots the version of DOS or Windows you selected in a window. From there, you
    start and use the application exactly the same way that you would use it in a
    standalone Windows machine.


    # Windows under desemu


    Users have been able to run the OS/2 version of Windows 3.0 or 3.1, Win-OS/2,
    under desemu. This requires that you have Win-OS/2, and that it is installed on
    a drive you can read from desemu. You can then change to the drive containing
    Win-OS/2 and by typing win or win.com, start a Windows session once you can run
    your applications. This is said to work fairly reliably. If you can do it at all,
    you can do it in a terminal window under KDE.


    To get Win-OS/2, you need to purchase a copy of OS/2, if you can find one, and
    install it on a drive partition to which you have at least read access under your
    Linux kernel. You can then copy the contents of your Win-OS/2 directory to your
    Linux


    606'
