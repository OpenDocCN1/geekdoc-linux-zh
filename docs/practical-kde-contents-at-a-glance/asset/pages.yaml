  md: '# PART II


    # A World of Other Settings: KDE Control Center CHAPTER 5


    # Getting Rid of Desktop Icons


    Some people, and I''m among them, who would just have a desktop uncluttered by
    icons, completely free of them. You can do this in KDE, though it isn''t documented.
    For most systems, all you have to do is your ~/kde/share/config/kfmfrc file in
    a text editor such as Kedit.(Note that this is a file in the hidden .kde subdirectory
    in your home directory).


    Find a section that begins with [Paths]. It will say something like this:


    ```

    [Paths]

    Trash=/home/yourhome/Trash/

    Desktop=/home/yourhome/Desktop

    Templates=/home/yourhome/Desktop/Templates/

    Autostart=/home/yourhome/Desktop/Autostart/

    ```


    Remove the Desktop from the Trash, Templates, and Autostart lines, and these icons
    will no longer automatically appear on your desktop. If there are other icons
    listed in this section in this, do the same thing. Do not change the line that
    says Desktop!


    You will now have to delete the icons from desktop manually, but when you restart
    KDE they won''t come back. They will be generated in your home directory instead,
    where you can use them if you need them now but off the desktop.


    If you compiled KDE from source code, you may need to add these lines to ~/.kde/share/config/kfmfrc
    by hand, because they may not be created automatically.


    KDE and its included programs offer menus, help files, and other onscreen in an
    amazingly selection of languages. The Locale tab, is brought to the foreground
    by clicking the Language listing in the Control Center (see Figure 5.30), is where
    you determine the language in which KDE will speak to you.


    Actually, KDE will speak to you in more than one language if you want. Developed
    in large measure in Europe where people are typically multilingual, KDE allows,
    requires you to set three languages (though all three can be the same language
    if you like). This way, if a program is not translated into your first choice,
    the second is sought; if there''s no luck there, KDE looks for documentation in
    your third choice. You use the list boxes to make your first, second, and third
    choices.


    # The Wrong Character Error


    Versions of KDE before 1.1.1 (and even after, in some circumstances) suffer from
    a little bug every time you exit KDE, or open a virtual terminal, the alarming
    Wrong charset! Wrong charset message appears on your screen.


    If you suffer from this problem, you should know two things. The first is that
    the message (and what caused it to appear, which is still a matter of some debate)
    can cause harm and can be safely ignored. The second is that setting all three
    languages in the Locale tab to the same language usually makes it go away.


    127'
