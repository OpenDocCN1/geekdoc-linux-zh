  md: '# PART VI Using Non-KDE Applications with KDE


    # CHAPTER 28 Console Applications on the Desktop


    I''ve talked about how you can open a terminal and run a console application.
    It is entirely possible that you would like to set up a menu item or desktop icon
    that automatically starts a console program in a terminal window.


    For demonstration purposes, I''ll use Midnight Commander, the popular console-based
    file manager, but very nearly any console application will do.


    SEE ALSO


    +   I sing the praises of Midnight Commander in Chapter 34, on page 617.


