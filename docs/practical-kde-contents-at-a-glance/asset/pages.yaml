  md: '# PART I Introduction


    # CHAPTER 2 Starting KDE


    It''s all well and good to have KDE happily installed on your hard drive, there''s
    not much point unless you can actually use the thing, there? Here is where we
    make to come to you. You''ll also learn about KDE''s evolving use of themes, which
    let you adapt the look and feel of your new Linux desktop to suit your tastes
    or to resemble other system more closely with which you are familiar and comfortable.
    We''ll also deal with a few of the problems that can arise and knock them back
    down again.


    Many modern Linux distributions (such as Caldera OpenLinux 2.3, Mandrake Linux,
    and Core Linux, to name three) default to KDE, when you have installed Linux and
    reboot, you automatically get KDE. These distributions don''t contain the latest
    KDE version, however means that you probably want to upgrade, if not immediately
    later. You can, of course, add KDE to distributions that deprive you of it. I
    have discussed this in passing in Chapter 1, "Installing KDE," and I discuss in
    Chapter 35, "Upgrading to the Latest Version," but I want to include some of the
    information that follows.


    The first thing you do after installing KDE and before using it is to add the
    /opt/kde/bin directory to the PATH statement in etc/profile.


    (This assumes that KDE is fact installed in /opt/kde. For Red Hat 6.0 users will
    need nothing because KDE''s binary files have been placed down in /usr/bin, which
    is or should be on the PATH already. For those who have put KDE in a directory
    other than /opt/kde, the pathname should be adjusted accordingly.)


    As root or superuser, open an editor in the existing desktop or on the console.
    Then open /etc/profile. You see, near the top, a line that looks like this:


    ```

    PATH="usr/bin:bin:/usr/local/bin:/usr/X11R/bin"

    ```


    Add the KDE binary path, to:


    ```

    PATH="usr/bin:bin:/usr/local/bin:kdepath:bin:/usr/X11R6/bin"

    ```


    You should substitute the actual KDE directory, such as /opt/kde or /usr/local/kde
    for kdepath.


    The quotation marks needs be there. There are no spaces anywhere in the line.
    In addition, the exact placement of the KDE entry isn''t critical. Bear in mind,
    though, that the system searches the directories for a command or file in the
    order which they are listed in the PATH line. Therefore, in the unlikely event
    that there is a KDE file with the same name as one in, /bin, and KDE is placed
    before /bin in the PATH statement, that file would be opened when the one in /bin
    was called, which could cause all sorts of trouble. Generally, it''s a good idea
    to put the KDE pathname at or near the end of the PATH statement.


    36'
