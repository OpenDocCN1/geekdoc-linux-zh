  md: "# PART III\nPlaying MIDI Files CHAPTER 15\n\n# The kmidi Processor Hit\n\n\
    There is one little latch catch to kmidi, but in many, if not most, cases it won't\
    \ matter and probably won't be\nnoticed. It achieves the high quality provided\
    \ by some pretty pretty hardware additions without adding any\nhardware at all.\
    \ (If I get quality from a trusty old ISA SoundBlaster 16.) But it does this by\
    \ using the processor\n functions normally tossed to a sound processor. The author\
    \ of kmidi says that it can consume from 10 to 30\npercent of the processor cycles.\
    \ I tested this by conducting a little experiment. I opened kmidi, KSnapshot(to\n\
    capture the results), and the Task Manager in Performance Meter mode. I let it\
    \ run for a couple of minutes with\nno MIDI file playing to establish a baseline,\
    \ and to let the system settle down from having loaded the programs.\nThen I played\
    \ a MIDI file. The results are shown in Figure 15.8.\n\n![](img/4a2883756c73e7b0696dbbd721c5c7db_362_0.png)\n\
    \nFIGURE 15.8\nIs the processor 11 percent used, or 86 percent unused? You decide.\
    \ Though it probably wouldn't be the best of\nideas to play MIDI files while doing\
    \ a long and complicated software compile, you probably wouldn't notice the\n\
    difference at other times."
  merge: -1
  pgno: 362
- img_proc: true
  md: '# PART III Using the Applications in the KDE Distribution


    # CHAPTER 15 Multimedia: Music and Movies


    Besides being a good MIDI player, kmidi serves to demonstrate high quality audio
    is available from Linux without costly hardware upgrades. This in turn is likely
    to spawn development of the kinds of music writing and sound development programs
    for Linux that are available now only in expensive commercial versions on other
    platforms.


    # The Other MIDI Player, KMid


    The title by no means diminishes the second MIDI player that is part of the KDE
    core distribution because it has some very interesting features all its own and
    a help file that can be opened from the first screen. K Menu, Multimedia > Midi/Karaoke
    Player brings you KMid.


    I have to admit while KMid (see Figure 15.9) has some intriguing features, not
    all of those features work all the time. The Karaoke "sing to your computer" feature
    is interesting, but unless the file includes the lyrics—and many don''t—that part
    of the fun will not exist. Indeed, I haven''t found any files that include the
    lyrics, though I''m assured they exist.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_363_0.png)


    FIGURE 15.9

    A different design philosophy is employed in KMid, and it is loaded with features.
    For instance, you can change the speed at which the MIDI file is playing by clicking
    on the triangles on each side of the Tempo display.


    350'
