- img_proc: true
  md: '# PART IV

    New Mail Notification: KBiff and Korn CHAPTER 24


    comes to mind is if you are running HylaFax, which reports each day on the day''s
    faxing activities). You would be informed of this new mail each time you boot
    your machine, but Linux users are accustomed to going for years without a reboot.


    KBiff (found by choosing K Menu > Internet > Biff) is an application whose job
    is to monitor a mailbox, checking at specified intervals to see whether there''s
    anything new. When it finds mail, it plays sounds, runs applications, or, actually,
    does just anything you wanted to do, for which you have the proper permissions
    set. If you really wanted to, you could shut down your computer when mail appears.
    (You don''t really want to do this; it''s just to illustrate the breadth of possibilities.)


    It normally lives docked to the K Panel, one instance for mailbox being monitored—if
    you''re on a local network, this is not a bad idea, by the way. When you start
    it for the first time, you''re treated to the setup screen, shown in Figure 24.11.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_518_0.png)


    FIGURE 24.11


    In its default livery, KBiff checks for mail once per minute, docks to K Panel,
    and keeps track of its settings from session to session. You may choose icons
    from a limited but useful set. Subsequent tab pages let you decide what happens
    when mail is detected, and mailbox being monitored. It is intelligently designed
    and straightforward.


    Korn is the drag racer to KBiff''s Formula I: It has more raw power, but is considerably
    rougher around the edges (see Figure 24.12). You will find it at K Menu > Internet
    > Mail monitor.


    When you start this thing, you will receive a dialog box asking whether you want
    to set it up. If you say no, it disappears and that''s that. So, to provide information
    for you, I have clicked Yes.


    What comes up is you see it, in Figure 24.12. You name your mailbox, give it a
    "caption," provide its location, and tell Korn how often to check for mail. The
    default is once every four minutes; the number you provide is in seconds. You
    also


