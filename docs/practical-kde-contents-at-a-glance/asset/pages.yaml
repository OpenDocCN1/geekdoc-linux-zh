    # CHAPTER 5 Making the K Desktop Your Own


    Next is Visuals. Only experience can convince you how very important these settings
    are. The first of these settings is Auto Hide Panel. It is highly recommended.
    The panel disappears except for a line of a pixel or two when your mouse pointer
    is at the edge of the screen where the K Panel resides, wherever it appears. The
    Delay and Speed sliders let you select how it sticks around before disappearing
    again, and how quickly it does so (or pops back into view when revisited).


    Auto Hide Taskbar and its sliders do for the taskbar what the corresponding settings
    for the K Panel do. Again, I highly recommend this. You will bump into it and
    the K Panel from time to time as you control other applications, but if you set
    them to disappear quickly, it is really no bother, and you recover a useful quantity
    of them in the bargain.


    Animate Show/Hide is a totally cosmetic setting. If it is enabled, the Auto Hidden
    elements seem to slide from their hiding places; otherwise, they just appear,
    poof. The slider controls how long this slithering the deep takes to accomplish.
    It''s annoying if set too long, at least for Tiny and Normal K Panels, the only
    available sizes of the taskbar.


