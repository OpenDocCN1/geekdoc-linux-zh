  md: '# PART II Customizing the K Desktop


    # CHAPTER 7 Making a Super K Panel


    As I said, there is a point to all this. There are two, really: the obvious one,
    that K Panel is really configured, and the slightly more obscure one, that these
    images serve as a reference as you decide how you want to configure your own K
    Panel. It''s like a book of carpet samples.


    You have three paths to the configuration of K Panel. The first is K Menu > KDE
    Control Center > Applications > Panel. The second is K Menu > Panel > Configure.
    The third and easiest is to right-click on a part of the panel that is not occupied
    by something else, which renders a menu, as seen in Figure 7.8.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_197_0.png)


    FIGURE 7.8

    To customize K Panel, start by right-clicking on an empty space in the panel,
    and then select Configure.


    This renders a dialog box, shown in Figure 7.9, which lets you select many of
    the things we''ve seen. At top left is where you choose the location of K Panel;
    you do the same thing at top right for the Taskbar. The bottom left is where you
    choose the size of the K Panel display.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_197_1.png)


    FIGURE 7.9

    Choose the size and location of K Panel and Taskbar from the first page of the
    KPanel Configuration screen.'
