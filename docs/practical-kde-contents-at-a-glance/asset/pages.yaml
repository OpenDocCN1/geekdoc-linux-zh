  md: '# PART III

    Quick and Easy Screenshots CHAPTER 16


    # # Quick and Easy Screenshots


    The KDE application I used most in the course of putting together this book is
    Snapshot. I have come to like it a great deal, and with one small improvement
    it would make my job far easier than it already has. That one small improvement
    would be the capability to save in .pcx format.


    KSnapshot is seen in Figure 16.9 and is found at K Menu > Graphics > Snapshot.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_378_0.png)


    FIGURE 16.9

    KSnapshot self portrait. Normally, the Hide KSnapshot Window box would be checked.
    As you can see, the file is being saved in .bmp format; I need to use another
    program to convert it to a .pcx for publication. Too bad for me.


    > You''re Writing a Book for Due

    I used GIMP, a Linux graphics application that almost came with your distribution,
    to make the conversion from a file format supported by Snapshot, in this case
    .bmp, to the PC Paintbrush format (.pcx) required by the publishers for illustrations
    in this book. I made the snapshots as I wrote the chapters, opened GIMP, opened
    each file one after another, and saved each file as a pcx. That''s all it took.
    Now you know, in case you''re ever called to produce .pcx images from Snapshot
    images.


    KSn does support multiple formats: JPEG, BMP, GIF, PS, and XBM, chosen by clicking
    on the list box that at starts GIF. When saving a file, you can enter the full
    pathname and filename in the text box, or you can use the Browse button to select
    a location. The latter isn''t the quickest, you''ll be sure to have all the pathname
    qualifications correctly entered. Often overlooked the Delay text box. In my experience,
    this should be to at least 3 because replacing everything on the KDE screen, if
    you have lots of icons or several applications open, can take two seconds or more,
    which means you might only get a partially painted screen, with blank menus and
    the like.


    365'
