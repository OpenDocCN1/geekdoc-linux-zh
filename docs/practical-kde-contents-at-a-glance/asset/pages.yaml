    > Caution

    KFM window has all the privileges of root user, which means that you must be extremely
    careful in what you do. With KFM in your home directory, the worst you can do
    is make your life difficult. In Super User Mode, you can literally destroy your
    system. deleting files to the Trash can render your system nonfunctional and making
    guests to the Trash to restore them. Moving an important configuration file can
    have the same effect. Don''t use KFM in Super User Mode unless you know what you
    intend to do, know that it is safe to do, and how to get out of any situation
    you might inadvertently create. Nobody likes reinstalling Linux or booting from
    a floppy and poking around! in hope of undo damage.


    # Viewing Files with KFM


    If you click on any icon in KFM, something happens. What that something is depends
    on the file type. If the file is executable (a program, signed by a KDE gear icon),
    the program runs. Often, if it is a part of another program or a console-mode
    (text-based) program, nothing visible happens, and there is no evidence of its
    ever running and generated an error or anything else. Don''t click on programs
    unless you know what they are. If you want to find out, open a kvt or konole window,
    change to the directory containing the executable file, and run it. Then, at least,
    you''ll see what message it returns.


    All files, ever executables, can be viewed in KFM. You can, conditionally, RPM
    files are the easiest: just click on them.


    Text files, tarballs, and conditionally, the text files you can edit in Kedit,
    and if they are in a directory to which you have write permission, they can be
    edited and saved with the edits intact. If you have write permission, you can
    still edit the file, but you''ll need to save it in a directory in which you have
    permission, as your home directory. Click on a tarball, and after a short wait
    and probably a little chugging by your hard drive, you have a window containing
    a directory. Click on the directory icon, and you will see all the files that
    make up the tarball. From here, the file manipulation tools that are with other
    files are available. You can copy files to other locations, for instance, or edit
    them. You can even add files to the archive (tar, as you may know, stands for
    tape archive). This is true whether the file is a simple tarball, with a .tar
    extension, or a gzipped tarball, with a .tar.gz or .tgz extension. If the tarball
    is not source code but


