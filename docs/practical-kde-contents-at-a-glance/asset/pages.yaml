  md: '# PART VIII

    The Future CHAPTER 38


    points of some vague licensing issue. Wars break out within the movement from
    people who claim to be freer than others. This sort of thing plagued the early
    days of KDE, which was built against QT, which is or isn''t a commercial product,
    depending on what you do it with. On the other hand, people in spite of it all
    come together to produce software like the GIMP, like the free compiling tools
    that work so beautifully together, like KDE. There''s no anarchy at the code level.


    Eric S. Raymond, who is as perspective as a guy you''re likely to find, proffered
    in his landmark "The Cathedral and the Bazaar" that programmers write to scratch
    an itch. That do not explain, the groups of programmers who have produced things
    like KDE, indeed like Linux itself. Group it? Does this mean Linux is becoming
    less bazaar and more cathedral? Occasionally one might think so.


    Already, the number of applications being developed by just one programmer not
    to any particular desktop project seems to be the decline. The excellent XMail
    program has pretty much stopped with a mid-1998 version, and there is no new version
    of Nedit or any of number of programs that once Linux stays. Perhaps it is due
    to redundancy, but it is sad to see development centered around large projects.


    But we are increasing interest from bigger corporations: IBM and its Lotus subsidiary;
    Corel; Compaq and Hewlett-Packard. This is encouraging in many ways, especially
    if you are hoping to base your business computing on Linux and KDE, but we must
    be careful not to read too much into this. Linux has its own volition drawn a
    great deal of attention, and the amounts being invested in it by the big companies,
    though huge by many standards, are a small part of what the companies spend each
    year, and are a small hedge against being left behind. Many of us remember the
    commitment IBM made to OS/2; only to back off from the standalone and desktop
    user. I''m still awaiting the CoreIRD!3.0 that an officer in the company told
    me would be introduced for OS/2 "by the end of the year." That was in the summer
    of 1993. (I also remember the OS/2 Warp rollout in which company after company
    pledged to ship preloaded OS/2, and port their applications to that system. Ever
    did.) The point is that a lot of big corporate money guarantees, really, nothing.
    If you plan to base your business computing on Linux and KDE, it''s important
    to pay attention to the trends in Linux and KDE. It''s very unlikely that either
    will become a dead end. I''m not a professional seer, though, and the lone thing
    the professional prognosticators in the computer industry in common is that they
    have been consistently, completely wrong.


    661'
