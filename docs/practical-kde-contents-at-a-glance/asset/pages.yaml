    You can read, write, and save text files on the Internet with KEdit almost easily
    as you can on your local machine. (If you have browsed to an ftp site and clicked
    on a README file, you have seen this in action, at least the reading of remote
    files.) This is achieved by using the File > Open URL and File > Save to URL menu
    items. Each opens a dialog box in which you need to specify the URL you have in
    mind. Of course, you do need to write access to the Internet to be able to save
    a file to a URL (and good thing, too).


    Edit > Insert File renders the familiar KDE file selection dialog box. Here you
