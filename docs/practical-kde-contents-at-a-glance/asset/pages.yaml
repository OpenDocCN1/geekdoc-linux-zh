    # A World of Other Settings: KDE Control Center


    We have heretofore been using the Display settings dialog box, which we''ve gotten
    at by right-clicking the desktop and choosing Display properties from the resulting
    menu. There is another way to gain access to it many, many other KDE system settings.
    It is the KDE Control Center, which is placed by default on your K Panel and is
    also available on the K Menu. As you will see, it contains many of the things
    we''ve already covered, a lot of new stuff, and some stuff that doesn''t seem
    to belong there at all. Its mild-mannered opening screen is what we see in Figure
    5.23.'
