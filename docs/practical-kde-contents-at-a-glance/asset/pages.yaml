  md: '# PART III Using the Applications in the KDE Distribution


    # CHAPTER 15 Multimedia: Music and Movies


    If you have a sound card and like to have your computer emit sounds other than
    beeps and the little system sounds that you may have enabled, this chapter is
    for you. If you don''t meet these criteria, there''s probably nothing here that
    will be of much interest, but you''re invited to come along for the ride anyway.
    Maybe you''ll get a sound card as a result.


    KDE includes a modest suite of multimedia applications in the base distribution.
    Talented programmers are adding more applications all the time when they see a
    need and a program to fill that need. You will find the newest applications at
    ftp://ftp.kde.org/pub/unstable/apps/multimedia. Don''t let the "unstable" fool
    you: Although some of these applications are indeed unstable, may work perfectly.
    And none are likely to break anything, so an application that doesn''t work won''t
    take anything else down with it. You do need to compile these yourself, but this
    is usually easily done. If you have the latest whiz-bang television card, radio
    tuner or CD burner, there''s a good likelihood that you''ll find software for
    it there now or soon. At the end of the chapter we''ll survey some of the incoming
    and upcoming KDE multimedia applications. For now, we''ll look at what''s on the
    plate already.


    # Playing Music CDs in KDE


    There are several CD players for KDE, located in the ftp directory mentioned previously,
    but the one that comes with KDE is pretty good. You get to it it via K Menu >
    Multimedia > CD Player. Its real name is kscd, though you are unlikely to see
    that name displayed anywhere, not even as depicted in Figure 15.1.'
