  md: '# PART I

    Desktop Icons: Useful Shortcuts CHAPTER 4


    Two Approaches to Templates

    If you are working on a big report in a particular application, you can make an
    icon for that program with the filename of your report as a parameter, or set
    the file type of your file to open the program automatically with it in. Either
    way, you can use a template.


    # SEE ALSO


    +   - You''ll discover much more about working with templates in Chapter 8, "Adding
    Applications to the Desktop," page 191.


    # The Autostart Icon


    The Autostart icon opens a folder (see Figure 4.11) in which you may drag icons
    for any applications that you want to start up when you start KDE. It is, first,
    empty.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_86_0.png)


    # FIGURE 4.11


    If you have any non-KDE applications that you want to have started every time
    you use KDE, the Autostart folder is the place to put links to them.


    Too Many Autostart Programs!

    Many times a user will try out a little program, decide that it ought to run all
    the time, and drop it into the Autostart folder. Then, the next time user starts
    the system, two copies of the program are running!

    The problem is when KDE is restarted, restarts any KDE applications that were
    running at the time it was closed. A copy in the Autostart folder, one, too. The
    difficulty is in determining which applications meet this qualification and which
    ones doesn''t. Here''s how to do it. Start all the applications that you want
    to have running all the time. Then click on the Logout button on the K Panel.
    If you receive no error message in the form of a box saying that applications
    are present that won''t restart, all the applications you are running will automatically
    restart. If you are treated to the error box, you know which of your selected
    programs need to be dropped into Autostart.


    73'
