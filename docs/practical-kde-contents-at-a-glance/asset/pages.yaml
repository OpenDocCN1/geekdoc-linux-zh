  md: '# FIGURE 25.11


    You will notice that each of the run levels has a subdirectory, but what is that
    init.d thing?


    If you open /etc/rc.d/init.d, shown in Figure 25.12, you will see all the services
    available.

    These may be assigned to one, or many run levels, but their mere presence in

    etc/rc.d/init.d doesn''t assign them to anything. There are a couple of symbolic
    links,

    one to the /etc/rc.local file which specifies programs that can run at startup,
    and one to

    the system''s halt command.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_534_0.png)


    # FIGURE 25.12


    The icons in /etc/rc.d/init.d represent the services and programs that can be
    assigned to the various run levels.


    Now, let''s look inside one of the run level subdirectories, say /etc/rc.d/rc5.d

    (see Figure 25.13).'
