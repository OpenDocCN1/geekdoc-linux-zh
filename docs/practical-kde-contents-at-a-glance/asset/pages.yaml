  md: '# PART VI Using Non-KDE Applications with KDE

    CHAPTER 30 Commercial Applications and KDE


    Not long ago my father-in-law, a computer professional since the days when there
    was no such thing as a microcomputer, in response to mention Linux said,“But what
    do you do for software?” It was a good question unless you are in the midst of
    things Linux, the prevailing notion is that Linux exists pretty much for its own
    sake, with no applications software to allow users to do anything except the old
    Linux box.


    Not many years ago, such a notion had a germ of truth to it. First were console
    applications, usually ports of mainstream UNIX applications: editors, mail programs,
    and the like. Then came the one-off graphical applications, not tied to any particular
    desktop. Sadly, it seems as if this kind of development is dying off somewhat.
    The applications optimized for a particular X Window System desktop came next.
    And, now and more, and we have industrial-strength commercial applications (not
    that the nonlocal applications are unfit for industry because in many, if most
    cases, are they?)


    A lot of the software is network-based. For instance, in the summer of 1999, Lotus
    Development announced the trial version of its flagship Notes for Linux (www.notes.net/linux/).
    There are, as previously noted, commercial database servers and clients for Linux.
    But what about the mere user, the home or small office Linux advocate who is looking
    for something between, say, the 25 or so half-finished word processors for the
    X Window System and some super high-powered network thing that has features that
    its developers have probably forgotten about?


    Such applications actually exist. In fact, the chances are better than you have
    one or more of them if you bought a commercial Linux distribution. They include
    a couple of office suites and an impressive standalone word processor that is
    likely to gain sumates before long. We''ll begin with the office suites.


    # StarOffice


    I''m writing this book on the word processor in StarOffice 5.0 (and, after this
    chapter, StarOffice 5.1). It''s a good thing that I like it because I really had
    no choice: StarOffice is the only application, as of this writing, that come even
    to supporting the Word for Windows format now so popular (for no reason) throughout
    the world. The fact that I can apply the styles my publisher wants and save the
    whole thing in WinWord saves some, perhaps a lot of, hair tearing.


    StarOffice is, in fact, a wonderfully high-powered suite of applications, incorporating
    a full-featured word processor, spreadsheet, graphics and presentation graphics
    applications, and a useful Internet subset of Web browser, newsreader,'
  merge: -1
  pgno: 583
- img_proc: true
  md: '# PART VI

    StarOffice CHAPTER 30


    and email programs. It is included with many Linux distributions, integrates wonder-fully
    with KDE, and is free for personal noncommercial use.


    Sounds just about perfect, doesn''t it? Surely there is a catch, right? Well,
    actually, there are a few. StarOffice for the longest time suffered from tremendous
    instability problems. It was not to crash without notice. This was not its fault,
    really: it was (and as of this writing still) built on glibc-2.0.7. That would
    be no problem in and of itself but for the fact that there has never been an official
    release of glibc-2.0.7. There was a fairly general set of specifications which
    many people extemporized. This meant that if you were running a system based on
    glibc-2.0.7 and you installed StarOffice, the libraries would be enough alike
    to allow the installation, but problems would arise. This was a less of concern
    on the Linux distributions that were built on libc5 because StarOffice then installed
    its own glibc-2.0.7 and through a wrapper program managed to run, at least part
    of the time.


    When Caldera Open Linux 2.2 was released in the spring of 1999, it came with a
    version of StarOffice 5.0 that actually worked and nearly bulletproof. It is still
    running glibc-2.0.7 (while COL 2 is glibc-2.1), and I don''t know how they did,
    but they made it work and work well. A newer version, StarOffice 5.1, is out,
    but I was hesitant for a long time to think with the perfect balance achieved
    by whomever Caldera or Star Division brought about the 5.0 miracle. I thought
    I''d wait until there was a StarOffice fully built on the standardized glibc-2.1,
    as opposed to 2.0.7 with some kind of hack applied. But then...


    One Saturday I decided to throw caution to the wind, a little bit at least, and
    install 5.1. (I kept my existing StarOffice 5.0 intact: a luxury I had had enough
    drive space to afford. StarOffice 5.1 can take up more than 150MB of storage.)
    A few error messages were thrown, which, based on newsgroup postings I had read,
    was expected, chiefly having to do with the lack of encryption in the glibc-2.1
    shipped with Caldera Open Linux 2.2. I chose to ignore them and proceed. So thereafter
    I had a StarOffice 5.1 installation that has not failed in the slightest way to
    this day, though I still haven''t deleted my 5.0.


    Not long thereafter, Sun Microsystems purchased Star Division, the somewhat quirky
    company that produced StarOffice. Sun made StarOffice completely free (no registration
    required) for not only Linux but also Windows, Spar Solaris/Intel, and OS/2. Sun
    also announced that there will be a Web-based version of the product, which would
    allow users to perform office tasks without having StarOffice on the local system
    or network. There have also been plans for a Java-based StarOffice.


    # 571'
