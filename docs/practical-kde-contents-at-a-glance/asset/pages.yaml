- img_proc: true
  md: '# PART III Using the Applications in the KDE Distribution


    # CHAPTER 12 Managing Linux System Functions with KDE


    The first of these, the one that is useful to no matter what printer you have
    installed, is KLpq. You get to it by going K Menu > Utilities > Printer Queue.
    (If you have a printer icon on your desktop, you get to KLpq by clicking on it.)
    It is a KDE front to the printer queue(s) you already have installed on your Linux
    system. It provides quick access for monitoring printer jobs and even changes
    in the order in which they are printed, killing one that has gone astray, and
    performing other tasks, depending on the permissions you have. It has a busy appearance
    (see Figure 12.6), but is not tremendously complicated to use.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_291_0.png)


    **FIGURE 12.6**nKLpq, showing the queue for a native PostScript printer with,
    in typical Linux fashion, nothing queued to.


    When you start KLpq for the first time, you are asked which spooler program you
    use. Chances are it BSD. Try that. If it can''t find your spooler, try the others
    until it finds the one you are using. If it never finds one, you need to revisit
    your spooler setup.


    If you know about your spooler, you need to revisit the printer setup portion
    of the installation of your Linux distribution. Most distributions include tools
    to ease this process, but they may not be highly informative. You may need to
    crack open the manual to find what sort of spooler you have, or you can try various
    things with KLpq. You''re very likely to find it.


    After you have found your spooler, the only other configuration option is how
    frequently you would like the display to be updated. This is set, in seconds,
    using the slider in Config > Auto update. The default is 0, which means it does
    not update itself unless you click the Update button or press the U key on your
    keyboard. The Auto button then tells KLpq to update at whatever interval you specified.


    278'
