  md: '# PART II Customizing the K Desktop

    CHAPTER 10 Navigating Everything with KFM


    > Where''s My Directory?

    Soon or later, KDE user clicks on a directory and, instead of getting a listing
    of the files, is treated to an HTML page. This is because the user has saved a
    file named index.html in that directory. The workaround is to uncheck HTML View
    in the View menu. Now all the files, even index.html, will be displayed normally
    as icons. If you want to look at index.html, click it. It will open in HTML mode
    within KFM. You can rename or delete it as its contents. This typically happens
    when someone seeks to save a page of instructions from the Web, and the page''s
    author has named the page "index.html


    For really effective file management, you want to make one quick configuration
    change. In view, the tree contains three items: Root, My Home, and Desktop. These
    remain no matter what navigation you do on the right side of KFM, where the file
    and directory icons appear. To fix this, click Options > Configure File Manager,
    and then the Other tab. Check the Tree view follows navigation box. Then, of course,
    click OK. Because the change is now set for this instance of KFM only, you want
    to click Options and Save Settings. Now you''ve set up KFM so that the tree view
    really display more useful than the three initial directories (see Figure 10.7).
    Even if you do not use tree view, you want to make this change, for reasons that
    will appear.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_245_0.png)


    FIGURE 10.7

    One setting that makes KFM universally more useful is Options > Configure File
    Manager > Other > Tree view follows navigation.'
