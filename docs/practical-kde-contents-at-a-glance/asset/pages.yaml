    appointment list, and a To Do list that is not specific to the date. That which
    you post yesterday you''ll be reminded of today.


    The divider that separates the calendar and To Do list from the appointment list
    can be dragged to the right to make more room for To Do items, the calendar''s
    size remains constant. Depending on the typefaces you have installed, some months
    years may not fully display in the calendar''s tide.


    The default is a good general view, particularly of use to people in business.
    For a better overview of how busy a week or a week in the future, you might choose
    **View > Work Week**, as shown in Figure 13.2.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_304_1.png)


