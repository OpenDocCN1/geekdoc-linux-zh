  md: '# PART III

    System Enhancements CHAPTER 19


    You can play with kcmclock when you are logged in as a user, but remember that
    only root can set the system time. Therefore, once you''ve figured it out, pop
    over to root and set your machine''s time.


    Similarly, there is kmjoy, which is a KDE utility for setting up a joystick, if
    you have one.


    A popular application for the desktop is KGoodStuff (see Figure 19.3).


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_428_0.png)


    **FIGURE 19.3**

    Okay it doesn''t look like much at first, KGoodStuff provides a floating icon
    bar which you can launch your applications. It is fully documented, so setting
    it up is a piece of cake. The configuration dialog lets you create new buttons
    and assign applications to them.


    KGoodStuff is the KDE equivalent for the Good Stuff program familiar to long-time
    Linux users. Its difference is that you don''t have to edit an inscrutable text
    file to configure it. If you''re not familiar with the concept, it is a floating
    icon bar into which you can place applications for launching. Given the multitude
    of ways to launch applications in KDE (desktop icons, K Menu, and K Panel), I
    can''t see much point to KGoodStuff. But somebody thought that there was sufficient
    need for it was written, so perhaps somebody will feel the need and use it. It''s
    easy to configure and well documented.


    Many other system-level applications and enhancements are available for KDE. Among
    them are Kapm, an automatic power management program, and Kclaptop, which provides
    several functions of special interest to people who use Linux and KDE on laptop
    and notebook computers. All the applications mentioned in this section are available
    at ftp://ftp.kde.org/pub/kde.


    SEE ALSO


    +   - I discuss Kapm and Kclaptop, in Chapter 37, "Using KDE on Notebook and Portable
    Computers," on page 651.'
