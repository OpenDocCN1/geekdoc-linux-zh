    terminal window type /sbin/lilo and press Enter. Watch carefully for any error
    messages. If they occur, look at your new /etc/lilo.conf before rebooting, fix
    the problem, and rerun /sbin/lilo; otherwise, your machine may not reboot. If
    you can''t find the problem, restore your backed-up lilo.conf and run /sbin/lilo
    to return to the original state of affairs. You can then fix /etc/lilo.conf to
    remove the offending line at your leisure. You should probably read and understand
    the lilo page before you experiment too extensively, but this procedure will be
    safe.


    When all this is done, the system goes through its boot procedure and end up at
    a console screen that looks like this:

    localhost.localdomain login:


    There, and (other users) enter the appropriate username, press Enter, and are
    prompted for a password, which you type in followed by another Enter, and a prompt
    appears. You or the other user must then type the command that starts the X server,
    your window manager, and your desktop (typically startx, but kde for Caldera 2.2),
    and press Enter again.


    It''s slightly more complicated, but it is somewhat safer.'
