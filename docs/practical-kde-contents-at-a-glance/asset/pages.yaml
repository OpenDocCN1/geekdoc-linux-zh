  md: '# INTRODUCTION


    to the XFree86 Organization, is a quick and relatively simple matter to add support
    for it. If the manufacturer does not, though, it''s a time-consuming and difficult
    process of backward-engineering and could take months.


    The next greatest likelihood of a problem is with your modem. For some reason—greed,
    insanity, or a combination thereof—few years ago some manufacturers began producing
    not-quite modems, labeling them as modems and selling them to the unsuspecting.
    These things do not contain all of the processing power that a real modem has,
    passing it off via a software interface, to the computer''s main processor. The
    net effect is that if that''s the today, with Windows only. Sadly, the vast majority
    of internal modems made today are atrocities. If you bought a computer in the
    last three or four years and it came with an internal modem, you are almost certainly
    a victim. The only solution is to replace your notquite modem with the genuine
    article. As of this writing, the contagion has not spread to external modems,
    so your best bet is with one of those (which also have front panels that provide
    useful diagnostic information, making them a better idea anyway).


    Network cards can also cause some trouble, especially the "plug-and-play" variety.
    Again, it''s wise to check your Linux distributor''s Web page to find out whether
    yours is supported.


    Sound cards, if you use them, are pretty well supported but can be difficult to
    set up unless they are mainstream, jumper-set, ISA-bus cards.


    Except for the base system requirements, all of the possible trouble spots listed
    are from the Linux system, not KDE. But because KDE administrators use all of
    these things, it''s possible to blame KDE for a more fundamental incompatibility.
    It''s best to check everything ahead of time and to avoid enough head scratching
    (to say nothing of temperate midnight posts to the newsgroups!) later.


    # Software


    The software that you need to have before beginning a KDE installation is modest:
    Linux (or an equivalent UNIX or UNIX-like operating system); XFree86 (or one of
    the commercial equivalents that will be discussed later in the book); and the
    QT-1.42 or better, 1.44 libraries from Troll Tech, which are available almost
    anyplace would get KDE itself. If your Linux distribution has KDE, it has Qt and
    XFree86 as well. Otherwise, it can all be downloaded from the locations listed
    in Appendix A, "Finding the Latest KDE and Its Applications.",


    And that''s that. So, let''s get to work!'
