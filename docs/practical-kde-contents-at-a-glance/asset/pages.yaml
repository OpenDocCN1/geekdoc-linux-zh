  md: '# Managing Your Printer


    One of the buzz phrases of the 1980s and 1990s was the paperless office. The idea
    was that everything would be on computer, so there was no point in having file
    cabinets stuffed with papers and printouts. Yes, everything would be on the computer,
    where it could be found with just a couple of keystrokes. (What’s that? Was that
    a “yeah, right!” from somewhere back in the crowd?) A friend, I remember got a
    scanner in hope of eliminating the clutter in office. Everything went first into
    the scanner, then the trash. He actually caught himself one scanning some junk
    mail that had arrived the day before. The project, as far as I know, did not last
    long.


    It has not, of course, worked out as promised, at least though Linux users come
    closest to the paperless office of any group of computer users. In part, this
    is because their communications typically happen by email.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_290_0.png)


    > > The Paperless Manuscript This book, for instance, will be on paper in my house
    for the first time when bound, published edition arrives. Everything else has
    been done in Linux and sent via email to my editors, who are generally enlightened
    by but who do not have an all-Linux shop...yet.


    I have friends, real Linux gurus, who have never hooked up a printer. When I began
    using Linux, I asked for printer advice and found no one who had ever installed
    one—not that they couldn’t. It had just seemed a particularly useful thing to
    do.


    And it is in part because connecting and configuring a printer is not as easy
    as under Linux as it is under some other operating systems. (The relative difficulty
    may be because of the relative importance assigned to printers among Linux folk.)


    The fact is, though, that printers are useful even to Linux users. We have all
    friends, or perhaps customers, who live in the unconnected dark ages, to whom
    paper letters must sometimes be sent. When configuring a tricky aspect of Linux,
    it is comforting to have printed out the main page or HowTo file or ReadMe to
    serve as a combination guide/security blanket.


    Now, said all that, let me note that while there are graphical ways of setting
    up your printer, you won’t find one in your KDE distribution. Maybe somebody,
    once you have your printer installed and working under Linux, KDE does provide
    one or two printer administration tools that make your life easier.'
  merge: -1
