  md: '# PART II Customizing the K Desktop


    # CHAPTER 10 Navigating *Everything* with KFM


    KFM is different, though. To it, your local hard drive is like a Website, and
    Web sites are like your local drive. Yet KFM has features that allow you to configure
    depending on the tasks you want to perform so that it will be best suited to those
    tasks.


    Let''s look at the things that facilitate file management.


    This means jumping directly to the View menu. If you fancy the Windows Explorer
    style of file management, you''ll want to click Show Tree. This renders a tree
    of the current directory, your home directory, down the left side of the window.
    The angles next to each directory can be clicked to expand that directory. Clicking
    on the directory displays its contents in the right side of the window. In short,
    it behaves pretty much in keeping with the behavior of the Windows Explorer. Figures
    10.2 and 10.3 show how this is brought about.


    > Seeing the Tree Through the Forest of Icons

    The tree view is always there, but when it is not selected, it is not displayed.
    You can get to it anytime by moving your mouse pointer to the left side of the
    KFM window. Just before it becomes a single-arrow sizing icon, it becomes a double-headed
    arrow. When it does, if you hold the mouse button down and move the mouse pointer
    toward the interior of the window, the tree appears. This can be useful on-the-fly,
    and as you will see, even when alone.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_241_0.png)


    FIGURE 10.2

    You can draw a tree from the left side of the KFM window by pulling the double-headed
    arrow towards the center of the window.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# PART II Configuring KFM CHAPTER 10


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_242_0.png)


    # FIGURE 10.3


    The tree view completed. You can pop into tree view anytime you want, without
    having it enabled in the View menu.


    There''s more to consider in the View menu. Linux, as you probably know, has a
    great number of hidden files and directories, distinguished by a dot (.) preceding
    the file or directory name. In your home directory, these contain either configuration
    files for applications that generate them in ways other than direct text-file
    editing (though they are almost always text files); or files that are used internally
    by the corresponding application, but that are specific to your particular use
    of the application. (For instance, your Netscape bookmarks file, is an HTML file,
    is hidden in a directory named .netscape.) Yet for a multitude of reasons, you
    may want to see these files and directories and open, and perhaps edit them. In
    some cases, particularly when upgrading programs or removing them, you might want
    to delete the files they have placed in your home directory. (A good example is
    WordPerfect: Upgrading from the free downloaded version to the commercial version
    requires deletion of the .wprc directory. This is tough to do if you can''t see
    the files and directories!) So **Hidden Files** is something you''ll want to have
    checked, if not all the time at least occasionally. There''s a lot to be seen,
    as Figure 10.4 demonstrates.


    229'
