  md: '# PART I

    Starting KDE CHAPTER 2


    If You Use Binaries

    On old Linux installations, the ones that still employ binaries exclusively, you
    need to modify the LD_LIBRARY_PATH statement. These systems are relatively rare
    nowadays. If you have one, you know you have it; if you are in doubt, Modifying
    LD_LIBRARY_PATH isn''t something to be done lightly, because if it isn''t done
    correctly, a world of trouble can result. Because of differences among old Linux
    distributions, consideration of this must remain beyond the scope of this book.


    Console Editors

    If you''ve installed a console-mode editor, you are pretty much stuck with vi,
    which has the lone advantage of being on every Linux and UNIX system in the world
    except mine. I deleted it and made a symbolic link called vi to an editor. I would
    highly recommend you install Pico. Some also love GNU-Emacs, which has rightly
    been described as a more religion than a program. In any case, and no matter which
    one you choose, it''s important that you get and learn a console editor. It will
    save you.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_50_0.png)


    # SEE ALSO


    +   > For more information on Pico, see Chapter 34, "A Couple of Must-Have-Programs,"
    page 617.


    For most Linux installations onto which KDE is newly added, the way to make it
    the default desktop is to go to a command line (either in console mode or a terminal
    window) as root or superuser, and type:


    ```

    /opt/kde/bin/usekde

    ```


    This makes KDE root''s default desktop, meaning that the startx command starts
    KDE and its window manager. Users can do the same thing to make KDE their desktop.


    What happens is this: usekde is a script that saves any files in ~/Xclients,.session,
    .xinitrc and replaces them with versions of its own that start KDE and its associated
    programs. Time was, all you needed to do was make a text file containing the lone
    word startkde and save it as ~/.xinitrc, and all would be well. The next time
    you started the X Window System, there would be KDE. This is still true for some
    Linux distributions, but for newer versions is more complicated than that.


    The startkde script is still employed, but on some systems—Caldera and Red Hat''s
    newest distributions, notably—it isn''t enough, and running it by itself produces
    unexpected results, with parts of KDE starting atop a non-KDE window manager,
    for instance.'
