    to K Menu and K Panel!


    Well, now! It seems that when adding files, directories, applications, whatever,
    to K Menu and K Panel, those fancy tagged graphical screens are generating text
    files that run as scripts by KDE to set the parameters of the program''s operation
    under KDE, and how KDE reacts to the program. We''ve already seen much of this
    is automatically generated when, for instance, you drag and drop a program, directory,
    or other file to K Menu or K Panel.


    # Text Files and Linux


    In almost every window manager and desktop for Linux, control of appearance and
    function is determined by one or more text files. Some are extremely complex shell
    scripts; others are simple text listings of parameters that are interpreted by
    the window manager or desktop as necessary passed to applications. KDE is no different.
    Its configuration files, those related to the launching of non-KDE-applications,
    are simple text files that can be edited in any editor. If you are sufficiently
    familiar with their format. KDE differs from many other desktops in the sense
    that you do not have to use an editor to write these files; it''s simply a matter
    of filling in the blanks, as is the case with the configuration of .kde files.
    The applications themselves may have configuration files, which aren''t necessarily
    standardized, but are often text files, are generated when you set the options
    for the program within itself. For KDE applications, they are kept in ~/.kde/share/


    195'
