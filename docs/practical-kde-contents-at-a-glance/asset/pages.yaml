  md: '# PART II


    # A World of Other Settings: KDE Control Center CHAPTER 5


    The first section, Windows, sets attributes for application window resizing. If
    you select the first check box, Vertical maximization only by default, when you
    click the Maximize box (wherever you put it in the Buttons dialog box, but typically
    the second button from the right in the titlebar) the window expands to full height
    but its width remains unchanged. This is just the thing for programmers who like
    to see as many lines of code as possible or writers who like to see a whole table
    at a time.


    The second button, Display content in moving windows, keeps the contents of a
    window instant when you grab it by its titlebar and drag it to a different part
    of the screen. This of course involves numerous screen repairs and can gobble
    so much processor capacity that other applications (or other users on the system,
    if there are some) can be brought to their knees. It''s a high price to pay in
    efficiency for a little transitory aesthetic pleasure. If this is unchecked, a
    wide frame lets you know where the window will be, and when you release the button
    new window is painted.


    The third button, Display content in resizing windows, has the same effect and
    the same shortcomings as the display of content when a window is moved; in addition,
    it looks kind of goofy. But it does have a purpose: You can see if you are reducing
    the size of the window in a way that hides something important, where you miss
    it if you do not notice that the window has sprouted scrollbars. If this is unchecked,
    a wide frame lets you the dimensions of the new window, and when you release the
    button resized window is painted.


    The Resize animation builds on the weaknesses of the Display contents but, allowing
    them to consume even more of the processor in aligning the resizing, particularly
    maximizations and restorations (returning a window to its non-maximized state
    by clicking the Maximize button in an already maximized window). If the system
    is heavily loaded, this animation can take place in weird spasms.


    The Placement Policy determines how and how applications will open on your screen
    from five choices, selected by a drop box:


    +   - Smart begins by putting the first application you open in the upper-left
    corner of your screen, or as close to it as without conflicting with other screen
    elements (taskbar or K Panel; it pays no attention to icons). A second application
    is placed with minimum overlap. And so on.


    +   - Cascade does its best to keep the titlebars of all running applications
    visible. Its best isn''t all good.


    +   - Interactive placement does what it can to keep windows from overlapping
    by more than the amount specified in the Allowed overlap spin button, which'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# PART II Customizing the K Desktop

    CHAPTER 5 Making the K Desktop Your Own


    becomes grayed when this choice is made. If it can''t, it puts the window down
    wherever you click the mouse.


    +   - Random placement simply plops the new window down wherever any old place.

    - Manual placement creates a window that moves as you move your pointing device
    and continues to do so until you click one of the mouse buttons. It then drops
    to the desktop, right there.


    So far, we''ve been dealing with the placement of windows. Now we''ll look what
    happens when the mouse pointer passes over windows, as determined by the Focus
    Policy, which offers four choices in its drop box:


    +   - Click to focus gives a window focus (makes it active, makes it editable,
    and changes the appearance of the titlebar) when you click inside the window itself.
    This is a tall order if most of the window, all say that X in the upper-right
    corner, is obscured by other windows. In this case you can resort to the taskbar
    or Alt+Tab to cycle through applications until you get to the one you want. A
    problem can occur if a dialog box or error box from the application has appeared
    and is hidden behind it. In this case, the application won''t take any input,
    and you can spend a while scratching your head trying to figure out why. Frankly,
    error boxes and dialog boxes that conform to KDE standards all appear on the taskbar,
    so you can use it to unbury the wayside error message, click OK, and be on your
    way.

    - Focus follows mouse is quite amusing because it can give focus to a window without
    raising. If you accidentally jiggle the mouse that it is now in another window,
    you can blithe type along, entering into the wrong application, for quite awhile.
    Fortunately, there is a way around this, which we''ll get to in minute.

    - Classic focus follows mouse introduces the possibility of being no window that
    has focus, if the mouse pointer is on an unused portion of the desktop. Otherwise,
    the window that has the mouse pointer has focus.

    - Sloppy focus leaves the window in the last focused window until a new window
    is entered, whereupon it gains focus.


    Two buttons are available in this section that can make some of the focus policies
    a lot more practical. The first is Auto Raise, which brings the focused window
    to the top (though it still doesn''t solve the problem of hidden dialog boxes
    or error messages that require your intervention before you can proceed). Associated
    with it is a slider that sets a delay before the focused application pops to the
    top. If you have a


