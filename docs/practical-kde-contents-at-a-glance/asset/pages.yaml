    of other things, such as a record collection.


    # KFTE


    KFTE is not one of those programs that defies categorization, and it duplicates
    some functions that you have in other applications. But if you are a programmer,
    KFTE (see Figure 19.10) is likely to become your favorite editor.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_436_0.png)


    FIGURE 19.10

    TE, a port of the highly regarded FTE programmer''s editor, offers features that
    will excite programmers and put the rest of us in awe.


    You can find KFTE on the KDE ftp site.'
