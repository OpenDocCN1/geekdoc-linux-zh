  md: '# Don''t Get Stuck Online


    A new version of Free86 had been released, and I sought to download it in all
    its many megabyte glory. It was late at night, and I didn''t want to stay up to
    log off my ISP when the transfer was done. Ah, but Caitoo has a setting, in Options
    > Preferences > Automation, to "Auto disconnect after downloading." Great! So
    I checked this box and went to sleep, content that my connection would be shut
    down after the file transfer.


    Imagine surprise, then, when I returned to my machine eight hours later and saw
    from the LEDs on my modem that I was still online. I moved the mouse to remove
    the screensaver and was greeted by a dialog box that said "Are you sure you want
    to disconnect?


    Pretty much defeats the idea of an auto disconnect, doesn''t it?


    It turns out, Options > Preferences > Advanced > Expert mode must be checked if
    an unattended disconnect without the "Are you crazy?” confirmation box, is to
    be achieved. I hope that this does not represent a trend in KDE development, the
    endless stream of confirmation dialog boxes they at minimum insulting, and at
    most, expensive.


    If you have a permanent internet connection (such as a cable modem or T1 or DSL
    line), you can set up Caitoo to perform downloads in the middle of the night or
    some other off-peak time (though given the worldwide aspect of the Internet, it''s
    always peak timescale). You can do this by specifying a download time in the Transfer
    dialog box that appears when you download a file to the Caitoo window.


    Note that while it is possible to cobble together a shell script that starts Kpp
    and establishes a connection that would allow a non-permanent connection to be
    employed, nothing of this sort is included in the KDE distribution. Additionally,
    be sure that expert mode is turned on in Options > Preferences > Advanced, or
    all you will have automated is the appearance of a confirmation dialog box.


    If you want to try to build a shell script to do some of this, you need to consult
    the documentation for the shell you will be using.


