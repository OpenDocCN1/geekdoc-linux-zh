  md: '# PART I Installation


    # CHAPTER 1 installing KDE


    # Disabling debug


    Linux programs (indeed, most programs for any operating system) contain code designed
    to make it easier to sort out the problem if something goes wrong. KDE is no exception
    to this rule. You can greatly reduce this code, which is seldom used, by adding
    a parameter to the configure command:


    ```

    ./configure --disable-debug

    ```


    If you have not done this when you compiled, you can do the same thing later using
    the strip command (as root or superuser):


    ```

    strip /opt/kde/bin/*

    ```


    What does this give you?


    +   - Reduced code size, which might be a concern if you are using an older, smaller
    hard drive

    - Faster times (there''s less to load), which is especially noticeable if you
    are using an older machine with a smaller, slower hard drive


    # Disabling exceptions


    Exception handling is something not used by KDE 1.X, but if you are using the
    EGCS compiler, the compiler doesn''t know this and it builds it in any way. The
    way to disable it is to use a compiler flag for the C++ portion of EGCS, like
    for this:


    ```

    /CXXFLAGS=''-fno-exceptions'' configure --prefix=pathname

    ```


    You lose nothing, and you gain a substantial reduction in the amount of memory
    that KDE and its applications use.


    # Pentium


    Unless told otherwise, the compiler picks the lowest common denominator and compiles
    for an 80386-class processor. This runs just fine on 386s, 486s, the various enhanced
    486s, Pentium-MMX, Pentium II, Pentium III, or one of the AMD K-2 or K-3 CPUs),
    you can optimize KDE for it at compile time by adding the -mpentium flag:


    ```

    /CXXFLAGS=''-fno-exceptions'' configure --prefix=pathname

    ```


    This works without the -fno-exceptions flag, but there''s no reason to keep exception
    handling, so why do it?'
  merge: -1
