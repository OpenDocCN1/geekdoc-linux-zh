  md: '# Hard Drive Management


    There are a couple of little KDE tools that do not come with the distribution
    (in fact, I''ve seen them only in source code) but are all worth downloading and
    compiling in order to help you keep a handle on your hard drive usage.


    They are Kdu and KDfree, and they come together in one package with a program
    called KSlot that is of use to you only if you have a three-disc CD changer. They
    all compile together, unless you want to be fiddling with the code, you get all
    three at once. They are small, and KSlot do no harm if you install them but are
    not blessed with such a CD reader.


    I shall now tell you in excruciating detail how to get and install these programs,
    and then how to use them. While this is not strictly within the scope of this
    book, if you have never compiled anything in Linux before, you are going to have
    to learn sooner or later, and it may well be well. And this little package compiles
    very easily, so it is a good first effort. I shall assume that you have a good
    compiler, egcs, installed along with such libraries and development packages as
    are customarily used in compiling programs in Linux. If you don''t have these,
    get them and do not come back to class until you have. Actually, if you have a
    fairly modern Linux distribution—anything since the beginning of 1999, will do,
    do these tools—though you may need to install the packages from the KDE distributions.


    First thing, log on to the Web and go to http://ftp.kde.org/pub/unstable/apps/utils/
    where you will find, down the list, a file called kdu-0.9.3.tar.gz. Download it.
    Log off the Web. Don''t even check the email; we''re waiting on you.


    Now, open a terminal and type su and Enter. When prompted, type in your root password
    and press Enter. Then cd /directory containing the downloaded kdu-0.9.3.tar.gz
    and press Enter. Now cp kdu-0.9.3.tar.gz /usr/local/src and press Enter.


    What you''ve obtained is the source code and copied it into the directory aside
    for source code. Now you''ll extract it from its compressed archive.


    Type cd /usr/local/src and press Enter. Then type xvf kdu-0.9.3.tar.gz and hit
    Enter (This gunzip extracts the files from the tarball.) You will have seen the
    files go into a directory called usr/local/src/kdu. Because you are already in
    /usr/local/src, type cd kdu and press Enter.


    You are called upon now to know the directory in which your KDE resides—/opt/kde,
    /usr/local/kde or usr if you''re running Red Hat 6.0. Type ./configure --prefix=[your
    KDE directory] and press Enter. You can now sit'
