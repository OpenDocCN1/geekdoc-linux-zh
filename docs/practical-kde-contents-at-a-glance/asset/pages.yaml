  md: '# PART III Using the Applications in the KDE Distribution

    CHAPTER 16 Image Creation, Editing, and Manipulation


    If there were no need to edit graphics on the computer, no graphical user interfaces
    would exist.


    Think about it: The GUI consumes resources and displays characters far less efficiently,
    and far more slowly, than plain old character mode does. Back in the days when
    people who owned PCs were running plain old DOS, companies like Microsoft and
    Digital Research licensed their GUIs (Windows and Gem, respectively) in runtime
    to companies like Corel and Xerox, graphics and publishing programs needed a graphical
    front end. Licensing runtime versions used those software vendors having to write
    their own and saved users from carrying the overhead when running a program that
    didn''t require graphics. (Remember that this was when memory cost as much as
    $200 per megabyte and many processors couldn''t use more than 1MB anyway.)


    Today, course, rare is the character-mode machine in general computing. Like it
    or not, you are being supporting a GUI when it''s especially suited for what you
    are doing or not.


    All of which makes it a special pleasure now to discuss the applications that
    unquestionably require a graphical user interface. The core KDE distribution includes
    several of these, we''ll consider in turn.


    Two programs that are distributed as graphics programs, KSendFax and the KDE Fax
    Viewer, are discussed in Chapter 33, "Faxing from KDE." Two more, to view PostScript
    files and files in the Te DVI format, are discussed in Chapter 19, "A World of
    Other KDE Applications" and 20, "KLyX: The Paradoxical Processor of Complex Documents,"
    respectively.


    It is worthwhile to also note that the other graphics programs for Linux work
    well under KDE, if you need features that KDE applications don''t yet provide.


    # KView to Look at Images


    The most basic of graphics applications, and therefore the one we''ll look at
    first, is KDE''s image viewer, KView (see Figure 16.1). You find it in K Menu
    > Graphics > Image Viewer.'
  merge: -1
  pgno: 371
