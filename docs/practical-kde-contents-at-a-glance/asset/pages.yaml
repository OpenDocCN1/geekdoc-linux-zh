  md: '# PART VIII On the Leading Edge with KDE


    CHAPTER 35 Upgrading to the Latest KDE Version


    # Going to KDE 2.0


    Upgrading to KDE 2.0 is not as simple as a task because your configuration files,
    QT, and, really, everything change. As I wrote this, KDE 2.0 hasn''t been released,
    but it is well enough along that some people are using it productively. As you
    read this, it is something worth looking at, especially if you like living on
    the bleeding edge.


    As before, it''s a good idea to make a backup of your existing KDE. You also want
    to make a backup of your ~/.kde directory (which is actually a good thing to do
    anyway, lest a weird theme or something causes it become corrupted). Don''t erase
    your QT source, RPMs, or DEBs just yet, either.


    For KDE 2.0 you certainly need to install a new version of Mico (2.2 or better),
    which you can get at http://~/diamant_vsb.cs.uni-frankfurt./~mico/. And you need,
    of course, to install the new QT. I highly recommend installing everything of
    the version you select: development and doc packages, any sample or demonstration
    packages, the works. These are essential if you plan on doing any KDE development,
    and they are very helpful as new applications appear that may require some of
    what they contain. It''s instructive, too, to look in the /examples subdirectory
    of your QT directory, no matter version you have, to get a sense of the blocks
    from which KDE is built.


    Beyond that, I can offer no help at this point. Fortunately, you don''t really
    need my help. Instructions for handling the latest KDE version can be found at
    www.kde.org. At the same time, you can give the latest code of KOffice a try.


    # Snapshots


    Each day, the latest code for the latest KDE (that in many cases was altered that
    very day) is available for download in the /unstable/snapshots directory of your
    nearby KDE ftp mirror. This is unsupported source code, but it doesn''t take much
    to get the hang of compiling and installing it. Back up your working KDE, even
    if it''s yesterday''s snapshots, first. And bear in mind that these are for KDE
    2.0 (or, after the 2.0 release, 2001), if you are using KDE 1.X you have to make
    some nontrivial upgrades that will break your existing installation.


    Speaking of snapshots...


    Just to whe your appetite, here is a screenshot of a very early version of KDE
    2.0 (see Figure 35.6). The shot was posted to the KDE Web site, and I think it''s
    the prettiest thing I ever did see on a computer screen.


    636'
