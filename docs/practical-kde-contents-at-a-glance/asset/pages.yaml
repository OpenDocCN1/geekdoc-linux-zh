    # User Administration


    One of the system administrator''s tasks that KDE has made much easier is the
    administration of users. This is of particular importance if the system is a larger
    network involving dozens or scores, even hundreds, of users.


    To gain access to **K Menu > System > User Manager** as root, and feast your eyes
    on what you see in Figure 25.1.


