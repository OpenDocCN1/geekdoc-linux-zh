  md: '# PART IX

    APPENDIX B Distributions that Include KDE


    First, let me note that sometimes it seems as if anyone owns a CD burner is a
    KDE distributor, so so this list (Table B.1) is certainly incomplete. But it does
    give a sense of the leading and recently announced Linux distributions that include
    KDE and anything special you need to know about the particular distribution.


    Table B.1 KDE Permutations Throughout Main Linux Distributions

    | Distributor | KDE Version | KDE Version | Web site | Notes |

    | --- | --- | --- | --- | --- |

    | Calder OpenLinux | 2.3 | 1.1.1 | www.calderasystems.com | Result of a collaboration
    among Corel, KDE, and Debian |

    | Corel Linux | | Custom | www.corel.com | |

    | Definite Linux | 6.1 | 1.1.1 | www.dlsl.demon.co.uk/definite.html | |

    | Mandrake Linux | 6.0 | 1.1.1 (enhanced) | www.mandrake.com | Based on Red Linux
    Hat; puts KDE in /usr |

    | Phat Linux | | | www.phatlinux.com | New distribution designed to run on a FAT
    drive containing additional operating systems |

    | RedHat Linux | 6.0 | 1.1.1pre2 | www.redhat.com | Puts KDE in /usr, uses beta
    of KDE 1.1.1 |

    | Slackware | 4.0 | 1.1.1 | www.slack.com | |

    | Stormix | | | www.stormix.com | Based on Debian Linux |

    | SuSE Linux | 6.2 | 1.1.1 | www.suse.de www.suse.com | |

    | TurboLinux | 3.6 | | www.turbolinux.com | |


    Note: Where version information is not provided, it either does not apply (as
    in Corel Linux) or has not been settled on this as was written.


