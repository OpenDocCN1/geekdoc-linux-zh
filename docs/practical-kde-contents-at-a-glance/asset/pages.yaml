  md: '# PART II

    Configuring KFM CHAPTER 10


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_240_0.png)


    # FIGURE 10.1


    Clicking on the little house on the K Panel renders the basic KFM window of the
    / directory.


    At first, there''s little remarkable about the KFM window. It displays a relatively
    standardmenubar, a toolbar of icons most whose functions can be guessed (and that
    offer bubble help if you''ve enabled it), and a window full of icons. Directories
    employ the nearly universal folder metaphor, the icons for particular vary depending
    on the kind of file it is: executable, text file, source code, and so on. At the
    bottom is a status bar; unless you have a lot of things in your home directory,
    it will do its business and its contents (in this case, the word Working) will
    disappear before you.


    Clicking on a directory icon opens the directory. Clicking on a file icon performs
    a function based on the kind of file, the mime type, it is: Mimetype? Isn''t that
    some of Internet convention? You bet. As I mentioned, KFM acts on the local computer
    as it does on the Internet. This means that items on the Internet won''t be handled
    entirely as you might expect, but the same holds true for items on the local machine.
    This is demonstrated by the line beneath the toolbar that contains text in the
    same way browsers have a line on which URLs can be manually entered and displays
    the current URL. If you''ve used other Web browsers, you probably know that instead
    of http: or ftp;, you can enter a fully qualified pathname to a file or directory
    and see that file''s or directory''s contents in the browser. If you have ever
    tried it, you also probably know that you would not be very interested in using
    a Web browser to manage your files.'
