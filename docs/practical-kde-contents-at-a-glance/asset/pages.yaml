  md: '# PART IV Going Online with KDE


    # CHAPTER 22 Kmail for Quick Communication


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_493_0.png)


    FIGURE 22.27


    The Filter Rules dialog box provides many ways to torture messages.


    Why might you want to filter messages? Well, you might want to subscribe to mailing
    lists, with a separate folder for each, and the messages to be filed automatically.
    Or there might be persons from whom you do not want to receive messages, in which
    case you can direct their messages to the bit bucket, either via Trash or /dev/null.
    There are a lot of reasons.


    Unfortunately, filtering messages tends to get them lost in the shuffle. While
    Kmail''s folders do, when they contain unread messages, totaling the messages
    that you haven''t looked at, they tend to be ignored for way too long. So it''s
    easy to automate your mail sorting with filters and by doing so to miss mail that
    requires your immediate attention. In my experience, the Delete key is better
    than a filter for getting rid of unwanted messages, and moving to folders manually
    is a better way to archive them. Perhaps you are more disciplined than I, though.


    If you want to build filters, click the Help button on the Filter Rules page to
    learn how. I''ll offer the example that it does, to give you a sense of it. Let''s
    say that you''ve subscribed to the kde-user mailing list (which, by the way, you
    should visit; http://lists.kde.org to do so). Because it''s a fairly active list,
    you might receive several dozen messages per day from this list, and you don''t
    want them all mixed with your business and personal in your Inbox.


    In Kmail, select File > Filter and click the New button. Because you don''t have
    any yet, the list of filters that appears will contain only one item anyway, signified
    by a pair of angle brackets, <>. If you already had filters, you would need to
    select this one from the list.'
