    Lookee here! The late, lamented Textra word processor in a VMware DOS boot, a
    Windows 95 boot with applications running, and even that epitome of advanced user
    interface design, Microsoft Bob, in a Windows 3.1 virtual machine—all running
    at the same time atop KDE in a Caldera OpenLinux session. The sheer weird voidles
