  md: '# PART II Customizing the K Desktop


    # CHAPTER 9 Working with Themes


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_235_0.png)


    Figure 9.9


    The Contents page shows what a particular theme comprises and lets you turn elements
    on and off before applying the theme.


    The Contents tab lets you see what items are included in a selected theme package
    before you apply it. You can check and uncheck items that you want or don''t want
    installed. If a particular category is listed as empty, it means that the package
    does not contain that element.


    One interesting feature of the Contents page is that by selectively turning elements
    on and off, you can use your favorite parts from multiple themes to create a custom
    theme that might be be—who knows?—greater than the sum of its parts.


    # Getting Additional Themes


    Of course, the Theme Manager created a whole new area of creative endeavor for
    programmers, some of whom are actually artists. Themes began to be produced at
    a breathtaking rate for users to download, look at, and install.


    The central repository for themes and information on it is at www.kde.themes.org,
    which has scores of themes available for download in gzipped tarballs. Once you
    get them, what do you do with?


