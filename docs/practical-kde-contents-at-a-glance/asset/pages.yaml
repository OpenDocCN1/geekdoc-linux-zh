- img_proc: true
  md: '# PART VI

    VMware: The Bad Stuff CHAPTER 32


    You need to be a little bit of a glutton for punishment to install and use WINE.

    The reason for this is that it is in development and when you download it

    (from www.winehq.com), you are warned that it will be a wonder if it works at
    all.

    With some fiddling, though, you can make it work to some extent, and if you have

    Windows applications that do not require you to save anything to disk, you can
    run

    them, and without a line of Microsoft code.


    It is possible to go on length about WINE, but this isn''t really the place to
    do it.

    What I say about WINE wouldn''t necessarily be accurate when you read it—a

    couple of versions of WINE are released each month. If you do get it running on

    y machine, you might want to make icons for your favorite Windows

    applications. I''ve gone into the production of menu items and icons exhaustively

    already, here''s all you need to know that can be said with any certainty. The
    com-\mand wine followed by the name of the program you want to run, as in describe,
    will

    start the application. WINE has no desktop or file manager of its own: it''s a
    com-\mand line application. If you have not put the fully qualified path name
    of the applic-

    t the PATH statement in your WINE configuration file, you will need to put it

    in the command line (such as wine: describe c:\ is how you

    have the drives mapped in your WINE configuration file). If you don''t understand

    any of this now, you will certainly be by the time you have WINE running. The
    point is

    that the wine executable file accepts other executable files as command line options,

    and if you do that your Windows applications start seamlessly on your

    desktop.


    The Wine configuration files are wine.conf and wine.ini and are typically located
    in

    /usr/local/etc. Most WINE configuration files, they are plain text. Because the

    WINE code changes so frequently, the best help I can offer is that you need to
    read

    the documentation that comes with the version you download or receive on your

    Linux distribution CD.


    # VMware: The Bad Stuff


    In the summer of 1999, a company called VMware (www.vmware.com) brought out

    an interesting line of products that allow you to install many operating systems
    to run as

    y very large, resource-gobbling applications under many other operating systems.
    If you

    have been bitten by an infected mosquito and are in the throes of delirium, you

    can purchase a product that will run Linux in a window of Windows. If the mosquito

    merde you a little crazy, you can buy a product that allows you to run

    Windows—not just Windows applications, but your favorite flavor of Windows

    elf—in a window under Linux and the X Window System, or if you want, full

    screen.


