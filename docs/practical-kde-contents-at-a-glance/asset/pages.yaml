- img_proc: true
  md: '# PART IV

    Setting Up Kppp for Your Account CHAPTER 21


    We''ve entered the information for the particular account, but that''s only part
    of

    it. We need to make sure that Kppp can speak to our hardware.


    We begin this on the **Device** page; see Figure 21.11.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_464_0.png)


    FIGURE 21.11

    Some changes in recent versions of Linux make your choices more critical than
    ever before.


    > Where''s Pesky Modem?

    For the first time, Linux used /dev/cuaX (where X was the number of the serial
    port, beginning with O) to

    sify its serial ports, and many distributions made a symbolic link /dev/modem
    which would point to the

    serial port containing the modem. Beginning with Linux 2.2, such a thing as /dev/cuaX
    no longer exists. It is now

    /dev/ttySX, where X is again a number beginning with 0 (Com1 in the DOSrative
    world is /dev/ttyS0 in Linux)

    And using /dev/modem was never a good idea. So in the **Modem Device** drop box,
    choose the actual location of

    your modem as /dev/ttySX—for most people it will be /dev/ttyS1—instead of anything
    else. The other stuff is

    included for backward compatibility.


    **Line Control**: software hardware flow control (CRTSCTS), which is preferred;
    software flow control (Xon/XOFF), which is not preferred; or, perish the

    thought, none. Unless your modem doesn''t support it, CRTSCTS.


    **Line Termination** is almost always CR/LF. If your script doesn''t run, this
    would be

    good first place to make an adjustment.


    You should set **Connection Speed** to the highest rate supported by your serial
    port,

    not by your modem. This means that if you have a 16550af UART (a chip on the

    modem—your modem''s documentation will tell you whether you have one, which

    most modern modems do), you can set it twice as high as your maximum modem

    speed, or more.'
  merge: -1
  pgno: 464
- img_proc: true
  md: '# PART IV Going Online with KDE


    # CHAPTER 21 Going Online with Kppp


    The Use Lock File text box is where you enter the amount of time you''re with
    some other programs, as mgetty.


    The Modem Timeout text box is where you are willing to let Kppp wait before it
    receives a CONNECT signal. You can adjust this as needed. If line negotiation
    takes a very long time because of poor phone lines, you may have to set this higher.


    > Those Horrible Windows-Only Modems

    In the early 1990s the U.S. robotics, which makes some of the best modems in the
    world, introduced one of the worst, a thing called Windem. This atrocity tossed
    the processing normally by a modem to the CPU via what was called a virtual device
    driver. In the best of circumstances, it was a second-class modem.

    Since then, many companies have produced modems using the same design philosophy,
    and computer manufacturers, looking to save a few bucks and practice on the navetst
    of first-time computer buyers, stuffed into their machines.

    These modems work only with Microsoft Windows products, and not all of those.
    Unfortunately, the vast majority of internal modems made today are Windows-only
    modems. They do not work with Linux

    If you have one of these things, remove it from your machine and give it to someone
    you don''t like. Then buy a good external modem. You''ll be glad you did. They
    work with Linux and the information the LEDs on external modems provides of great
    diagnostic use.


    The next page (see Figure 21.12) is where you teach Kppp to speak to your modem.
    You will probably need to consult your modem manual for some of the settings.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_465_0.png)


    # FIGURE 21.12


    The Modem tab page can be very complicated or very simple. If yours is entirely
    Hayes-compatible, it will be the latter.


    452'
  merge: -1
  pgno: 465
- img_proc: true
  md: 'The first setting is a text box in which you tell Kppp how long to wait redia-ling
    after getting a busy signal. If your ISP has many lines, you can set this to 0
    with a good likelihood of getting results on the second or third try.


    The Modem volume slider is itself explanatory. If your modem is too loud, turn
    it down; if it''s not loud enough, turn it up. Louder is to the right.


    Clicking the Modem Commands button brings the dialog box shown in Figure 21.13.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_466_0.png)


    FIGURE 21.13

    This is where your modem manual may come in handy, though the defaults are likely
    to work with most modems. If you have call waiting, you can insert the *70, here,
    after ATDT.


    Clicking the Query Modem button causes Kppp to interrogate the modem itself (see
    Figures 21.14 and 21.15).'
