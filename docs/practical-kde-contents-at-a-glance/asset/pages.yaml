  md: '# PART III Using the Applications in the KDE Distribution

    CHAPTER 19 A World of Other KDE Applications


    The quality of the printer you''re using determines the quality of Kover''s product.
    A good color inkjet can produce very professional-looking results; an old dot-matrix
    printer cannot. Get Kover at www.fischlustig.de/kover.


    QuickShow is a slideshow program for KDE that lets you click through a whole directory
    of images at once, or set it to do the clicking for you so you can just watch.
    It''s at the KDE ftp site.


    KPlot puts your data into graphical form. This is useful especially for scientists
