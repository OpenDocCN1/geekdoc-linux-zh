  md: '# PART VII Programs that Extend the Power of KDE


    # CHAPTER 33 Faxing from KDE


    When an experienced computer user comes to Linux and KDE, one of the areas of
    greatest culture shock occurs when that person realizes that they can accomplish
    relatively few commonplace tasks by the quick downloading and installation of
    a program. Setting up a printer, for instance, can be relatively simple or it
    can be an agonizing and frustrating expenditure of hours. It is certainly not
    like anything with which the user is familiar, unless the user remembers fondly
    the days in which computers arrived with blank hard drives and a box of DOS disks
    (actually, I do). If there are “wizards” involved, they are the user and online
    to whom the user turns for help.


    This little prologue is especially appropriate when it comes to fax programs.
    You will not be downloading a fax program, installing it, and five minutes later
    be sending and receiving faxes. It does not, alas, al, work that way or even close
    to it.


    This is not to say that faxing from Linux is impossible or even very difficult,
    but it is a complicated process to set up. Like most things Linux, though, once
    you set it up, it is easy to use and all butterproof.


    Let’s begin with a quick survey of the three most popular fax programs for Linux,
    and then look at the ways in which you can integrate them into KDE.


    # Efax: An Easy Standalone Program


    If you are running one machine with one modem, no network, no bells and whistles,
    Efax is well worth your attention. You can get it at casas.ee.ubc.ca/efax/ in
    source. Additionally, many Linux distributors have binaries in their standard
    directories or in the /contrib directories at ftp sites. You can get it through
    a shell script, fax, that sends and receives facsimile transmissions from Class
    1, Class 2, and Class 2.0 fax modems. (Yes, there is a difference, and an important
    one, between Class 2 and Class 2.0.) When you install it, it is a command-line
    program into which you type such information as the files to be faxed and the
    telephone number to which they are to be faxed.


    # Mgetty+Sendfax: You May Already Have It


    If you have, say, Caldera Linux, you have mgetty+sendfax, a combination of programs
    that allows the sending and receiving of facsimile transmissions through a Class
    2 modem. If it was not automatically installed when you installed the distribution,
    you might want to search the CD thoroughly to see if it’s there it probably is.


    612'
  merge: -1
  pgno: 625
- img_proc: true
  md: '# PART VII

    Using These Fax Apps Under KDE CHAPTER 33


    What you may not have a Class 2 fax modem. Many, indeed most, fax modems support
    Class 1, and U.S. Robotics (now 3Com) Courier modems support Class 2.0 (and Class
    1), but not Class 2. (Class 1 offloads much of the work to the main processor,
    and a fax modem that does not support Class 1 uses some proprietary format. Good
    luck in finding Linux software for it it might as well be a Winmodem for fax purposes.)


    If you have a Class 2 fax modem, which is possible, and you have the software,
    it is likely, you can use getty-sendfax for the faxing duties of all users on
    your machine. It, too, is a command line program.


    # Hylafax: Industrial-Strength Faxing


    If there is a Linux standard fax program, a big gun in the Linux world, it is
    Hylafax, which you can get in source and compiled binaries at www.hylafax.org.
    It is a monster program in the good sense of the word: if you have 100 machines
    set up, all networked together, with a dedicated fax server, Hylafax is the program
    you want. But if you have one modem and send and receive a lot of faxes over a
    single modem that you use for other things like collecting email and snagging
    the latest KDE apps off the Web or an ftp site, Hylafax is not ridiculous overkill.


    I must note that I have never been able to compile Hylafax on my machine, so when
    I''ve used it, it''s been through the good work of someone whose competence exceeds
    my own and who was kind enough to compile it and make the package available. I
    mention this not out of a desire to confess this particular shortcoming but instead
    to warn away those who are new to building software from source. Hylafax is not
    the best possible first project. (If you want a first project, look at all the
    things earlier in this book that are easy to compile.) Chances that you can download
    an RPM or DEB of the current Hylafax from the ftp site of your Linux distributor.


    It supports all three fax modem classes, and, like the others, it is a command-line
    program.


    # Using These Fax Apps Under KDE


    Why would a book about KDE have a chapter that begins with a couple of pages about
    console fax programs? I thought you would never ask that. Because KDE has a way
    to free you from the command line with all three of these, silly!


    613'
