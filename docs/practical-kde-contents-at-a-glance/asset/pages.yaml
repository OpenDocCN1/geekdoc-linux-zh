    Key bindings are all changeable in KDE.


    The Global Keys tab, labeled Global shortcuts on the tab itself, is where keys
    are bound to actions. It looks a lot more complicated than it is, and it is unlikely
    that you''ll change anything here anyway. What you will want to do, though, is
    learn what the key bindings are. (However, the Global shortcuts page is a quick
    reference when you are at your computer: Shift scroll through the list. You''ll
