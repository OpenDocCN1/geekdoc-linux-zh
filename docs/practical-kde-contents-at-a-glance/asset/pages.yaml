  md: '# PART III Using the Applications in the KDE Distribution

    CHAPTER 20 KLyX: The Paradoxical Processor of Complex Documents


    Chances are that you are among those who install new software, open it up, and
    try to figure it out, resorting to the documentation only when you get stuck.
    With some packages, especially word processors, you may never get stuck. KLyX
    is very powerful and complicated, and it cannot be used right out of the compiler.
    It is not intuitive, and it adopts few of the de facto standards that have come
    to populate word processors, where your most difficult task initially might be
    figuring out how to turn off the annoying animated paper clip character. If you
    intend to use KLyX, you will need to study it first.


    On the other hand, KLyX has some very cool features. Remember, structure and consistency
    are top priorities in KLyX, which is designed to prepare documents for places
    that would reject the formula for cold fusion if it were improperly formatted.
    In KLyX you must, for instance, change an attribute of an item by changing its
    style, and when you do, you change all instances of that style in that document.
    It is extremely strict. This is great for your doctoral dissertation, but less
    so for a freeleling, informal letter to a friend. If extremely formal writing
    is what you do and you intend to produce files that are to be read by systems
    that can read .lyx or .tex files, KLyX is just the thing. But for other kinds
    of documents, it can be like swimming against a powerful current.


    When you start KLyX, Figure 20.2 is what you see.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_443_0.png)


    FIGURE 20.2

    After a few seconds, dumping boy goes away.


    Then, fortunately, you see that which is depicted in Figure 20.3.'
