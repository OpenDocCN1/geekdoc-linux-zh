    # Selecting a Screensaver


    Screensavers came into wide use in the old days of single-color text-mode terminals,
    where over time the phosphors in the cathode-ray tube would be altered by the
    display of characters in the same places. Though modern monitors are said to be
    much less vulnerable to this kind of damage, screensavers have become a standard
    part of almost every operating system and user interface, and in this Linux and
    KDE

    are no exceptions.


