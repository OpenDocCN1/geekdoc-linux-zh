    I should note that VMware and Windows 95 really take a bite out of your processor.
    I''m running a 400MHz processor with 1MB of L2 cache and 256MB RAM, and everything
    slowed more than noticeably. KTop reports that the processor is pegged.

    It can really be thought of as being for occasional use, as directed. Side effects
    may include sluggishness, irritability, and headache.


    # VMware: The Good Stuff


    I absolutely guarantee you spending a day or two with VMware will cause you to
    think all the negative thoughts expressed previously, and all the factual statements
    are true. But if you hang in there and work with it a little, you''ll find VMware
    pretty rewarding. In that respect, it''s like Linux itself. And once you begin
    to explore its potential, VMware can knock your socks off, while leaving your
    boots intact.

    (Yes, the pun was deliberate.)'
