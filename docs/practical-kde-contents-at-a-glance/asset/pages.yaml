    in the Options dialog box) to learn what you can and can''t do with the version
    you have.


    # Careful with that Text Editor!


    A lot of configuration files contain lines that seem to go on forever. Depending
    on your choice of text editor, these may be warped for easy display. Depending
    on how your text editor does this, though, it can end up breaking the file and
    keeping the application from running because some editors don''t just wrap the
    line for display purposes; they actually insert a carriage return. The application
    does not expect this and ch. Therefore, it''s important that you make certain
    your editor of choice doesn''t do this. If in doubt, turn off wrap wrap entirely.
    You''ll need to use the scrollbar to get to the ends of some lines, but your edits
    won''t ruin the file.


