    The Kedit editor is good for altering configuration files such as /etc/initab.


    Take a look at it because you are certain to learn some things about Linux you
    didn''t know before. In particular interest is the top part, which specifies what
    the different run levels mean. This is one of the things that vary depending on
    the age and distribution you are using, the trend is to run level 3 for multiuser
    console mode and run level 5 for graphical, X11. First thing, save it as /etc/initab
    using the File > Save As menu items. (You now have to use File > Open to get to
    /etc/initab instead of /etc/initab.orig.) After you''ve browsed—don''t touch anything!—return
    to the top. The very first line that isn''t “commented out,” which is to be preceded
    by a #, is this:


    id:3:initdefault


    Change to this:


    id:5:initdefault


    See what you''ve done? You''ve found Linux that instead of booting into console
    mode, you''re booting into X11—graphical—mode. You''ve changed a 3 to a 5—nothing
    more. If your distribution uses different numbers to bring this about, change
    the multiuser console mode to the X11 mode by changing the corresponding number.
    The top section of /etc/initab may—and probably does—contain descriptions of the
    different run levels for your distribution.'
