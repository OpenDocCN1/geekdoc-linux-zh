  md: '# # Appendix

    # D


    # KDE on Other Platforms'
  merge: -1
  pgno: 692
- img_proc: true
  md: '# APPENDIX D KDE on Other Platforms


    KDE is typically a Linux desktop, and any processor that runs Linux will run KDE.

    But it will run in various iterations of the X Window System on other operating
    systems as well:


    +   * Solaris

    * FreeBSD

    * OpenBSD

    * NetBSD

    * IRIX

    * HP-UX

    * UNIXWare

    * SCO OpenServer


    There are reports of KDE running with minor modifications on other flavors of
    UNIX as well. With considerable hacking you could install the OS/2 version of
    the X Window System and port KDE to that platform. (I don''t know why you''d want
    to, but it could theoretically be done.)


    Generally, you can find binaries for the operating systems listed earlier available
    for download. If you have gcc compiling tools installed, you should be able to
    compile the binaries locally as well.'
