- img_proc: true
  md: '# PART II


    # Spicing Up the Background CHAPTER 5


    feature creep, it''s with the Random wallpaper feature. This rotates among the
    bitmaps in a list, changing the background at predetermined intervals. In my experience,
    KDE users set this up, use it for a while, mostly to see if it works, comment
    upon it, and turn it off, never to be started again. It can be startling to be
    in the middle of something, perhaps with several applications open in windows,
    and have the background change suddenly, with no further prompting from you, every
    few minutes.


    If you want to try it out, which you probably do, here''s how.


    Click the Random button. Then click the Setup button, which will have become active—no
