    There are several ways to display a file in KView:


    +   - You can specify kview/path/filename at the command prompt in a terminal
    window.

    - You can right-click a graphics file and select Image Viewer from the resulting
    menu (see Figure 16.2).

    - You can use the KView File > Open menu item.

    - You can open KView and drag an image file to the blank KView window and release
    it there, whereupon it opens.

    - If you have no other graphics programs installed that will intercept the command,
    you can click an image icon, and it is likely to open in KView.

    - You can also make it part of a list, which we''ll get to shortly.


