    If KDE were to ship with only one game, Minesweeper would be a good candidate.
    It exercises one''s reasoning, but not to the extent that a simple writer can
    win from time to time. In case you''ve never played it on Linux or some other
    operating system, it looks like Figures 18.9, 18.10, and 18.11.'
