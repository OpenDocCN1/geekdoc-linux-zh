- img_proc: true
  md: '# PART I

    Getting KDE On Your Own CHAPTER 1

    Getting KDE On Your Own


    You can acquire KDE in two forms: compiled binaries and source code. Within these
    categories, though, are subcategories (especially among compiled binaries) for
    specific Linux distributions and for other operating systems, such as the various
    Sparc Solaris releases, Alpha, PPC, BSD, and the various flavors of UNIX.


    The compiled binaries are pretty much ready-to-run programs: all you need to do
    is install them. With source code, the program is still in the form of text files
    and scripts that can be read with any text editor, altered by the user who has
    programming skills, to fix bugs, and optimized for a particular computer—not just
    a particular operating system, but the actual specific computer itself. The trade-off
    is that compiling the source code and making it into binary files takes more time
    than getting and installing the binaries. It''s also a little more complicated
    because there are more commands to learn and more things that can go wrong.


    If you''re new to Linux and to KDE, you will probably want to go with compiled
    binaries first. Though KDE is remarkably easy to compile and install, it is probably
    no one''s idea of a good place to begin learning about compiling source code.


    In any case, the place to begin is the KDE Web site, www.kde.org. By all means
    feel free to browse the site, but when you are, click the Download link. You will
    be encouraged to choose a mirror site, which is a good idea for two reasons: it
    reduces congestion at the KDE site, and it usually results in a quicker, cleaner
    download for you. Although some of the mirrors lack the very latest developmental
    code and programs that aren''t ready for release, they all have what is called
    the stable tree. This is the collection comprising KDE and KDE applications that
    have been deemed worthy for release.


    When you have chosen and connected with the mirror of your choice, you need to
    dig down through the directories until you are at /pub/pub/kde/stable/. For instance,
    on the KDE site itself, the URL is ftp://ftp.kde.org/pub/kde/stable/) Here you
    will have the opportunity to choose 1.1.1 or 1.2. If you want an attractive, high-color
    desktop, choose the latter. Its hardware requirements are slightly more stringent,
    but on most systems, the performance difference won''t be something you''ll notice.


    Having your choice, the next step is the subdirectory labeled /distribution. Here
    you are given a choice of package formats: DEB, RPM, PKG, and TAR.'
