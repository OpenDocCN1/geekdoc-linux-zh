  md: '# PART VIII


    # KCMLaptop CHAPTER 37


    Now we get into some serious configuration that can determine how efficiently
    your computer uses its battery charge. Many notebook machines offer more than
    On and Off, with built-in power saving features. These may include the following:


    +   - Standby mode, where some things are powered down but the computer remains
    on and ready for nearly instant use.

    - Suspend mode, which is close to Off but not quite. The contents of the current
    session are usually copied to your hard drive so that you resume computing, you''re
    right where you left off.


    KCMLaptop allows you to configure these features (if they are supported) in a
    way that KCMLaptop expects (see Figure 37.3).


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_668_0.png)


    Figure 37.3.


    The Power tab is divided, offering settings for battery and mains power. You set
    the behavior of your machine after a period of inactivity that you specify on
    the left side, which makes the corresponding configuration on the right to tell
    the machine what to do when it''s plugged in.


    The Warning page prevents those embarrassing situations where your entire Masters
    thesis is lost because you forgot to save it and then the battery went dead, which
    is the cyber-age equivalent of “the dog ate my homework." However, it can produce
    embarrassing situations all its own (see Figure 37.4).


