    The things they needed in order to compute were already on the drive. Plug it
    together, plug it in, turn it on—that was it. The chief user variable was the
    choice of mouse pad.


    Even if a user is interested in learning about computers to the extent that he
    or she gain proficiency, inertia is a powerful thing. Nobody is going to blow
    away the contents of a perfectly functioning hard drive loaded with familiar programs
    without a very good reason to do so.


    Linux, though, very good and getting better each day, lacked such compelling reason.
    Its reputation as being tremendously difficult to use was only partly deserved.
    People accustomed to DOS and its derivatives would not only bring little knowledge
    with them, they would bring knowledge that in some ways would actually run counter
    to the ways they are done under Linux. Assuming that the user learned, the commands,
    and Linux up and running, what would be gained? What could be done? Painfully
    little. (Here old Linux hands disagree, in terms of the average user, I''m right.)
