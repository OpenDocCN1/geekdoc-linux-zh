  md: '# PART II

    Controlling the Behavior of the K Panel and Taskbar CHAPTER 7


    You note that among the choices for Taskbar is Hidden. If you make this choice,
    in essence you do not have a Taskbar. Does this mean that switching among applications
    that have been minimized, or even learning which applications you have running,
    is no longer possible? Nope. If you''ve made this choice, press Ctrl+Esc to get
    a list of applications currently running. You can switch among them from this
    dialog box.


    # Controlling the Behavior of the K Panel and Taskbar


    Those neat desktops have the K Panel and Taskbar readily available but not always
    visible within your grasp. You can also control the manner in which they appear
    and turn off the "bubble help," those little yellow boxes that appear if your
    mouse pointer traces too long on a K Panel item. This is all done from the Options
    page (see Figure 7.10).


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_198_0.png)


    FIGURE 7.10

    The behavior of your K Panel and Taskbar are determined by the settings you make
    on the Options dialog box.


    185'
  merge: -1
  pgno: 198
- img_proc: true
  md: '# PART II Customizing the K Desktop


    # CHAPTER 7 Making a Super K Panel


    The first choice is Show Menu Tooltips, and if you check this box, you get bubble
    help. If you make this choice, you can use the slider at right to specify how
    long your mouse pointer rests on an item before the help bubbles up.


    The next two items are Auto Hide Panel and Auto Hide Taskbar. Selecting one or
    both of these causes the respective screen to shrink to a thin line at the location
    you chose on the Panel tab page. Moving the mouse pointer to it causes it to appear.


    Next to each of these two items are two sliders. The first, Delay, lets you set
    how long the element stays around the mouse pointer leaves. With the slider all
    the way to the left, the screen element disappears as soon as the mouse pointer
    moves away. The second, Speed, sets the manner of its departure—whether it''s
    instantly snapped or rolls up in a leisurely fashion. Experiment to find the combination.
    As you use KDE with a variety of applications, you''ll probably return to this
    section to do some fine-tuning.


    For instance, occasions occur when the menubar of an application buries itself
    beneath a Taskbar set to remain onscreen at the top of the screen. This is irritating
    and, while there are ways around it, why bother when you can set the Taskbar to
    disappear?


    Animate Show/Hide lets you decide how you would like the appearance/disappearance
    of these elements to take place. This is an eye candy item.


    I have discussed the section labeled Others in Chapter 5, “Making the K Desktop
    Your Own,” and it has nothing to do with what we''re doing now, so we will freely
    skip it. It''s not the KDE developers'' finest hour, or thousandth of a day, anyways.


    How many virtual desktops would you like? Well, choices are from two to eight
    in multiples of two, and you make your choice on the Desktops page (see Figure
    7.11).


    The oddly named slider determines how many virtual desktops you have. If you slide
    it to the left and right, you makes the numbered text boxes inactive and active
    respectively. If you want to name your desktops, you can do so in the text boxes.
    The Width slider lets you make enough room in the K Panel buttons for your poetry
    to be visible. Remember that you have other things competing for space on K Panel,
    you''ll want to keep it short.


    SEE ALSO


    +   You can make more desktops, up to 32 of them, if you think you really need
    that many. To learn how, see “Eight Virtual Desktops Not Enough?” in Chapter 5,
    starting on page 93.'
