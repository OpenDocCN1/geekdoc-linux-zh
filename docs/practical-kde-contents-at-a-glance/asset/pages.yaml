    # Miscellaneous Programs You Might Not Be Able to Live Another Day Without


    In KDE or anywhere else, among the most enjoyable applications are those that
    defy categorization. One of the reasons is that you probably don''t have another
    program that does the same thing. Another is that the people who write such programs
    are often clever and sometimes delightfully quirky. There are many very clever
    writing programs for KDE.


    # KWeather


    KWeather is the answer to a question you may never have asked, but when you think
    about it, it''s a good idea. It does not change the weather, but it lets you talk
    about it intelligently (see Figure 19.9).


