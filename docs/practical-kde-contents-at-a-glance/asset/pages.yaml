    opening, closing; the things you never think much—but for the most part no applications.
    They were followed by “widget sets” that allowed the development of graphical
    applications, which consisted largely of calculators, little text editors, and
    such public-domain programs from full-grown versions of UNIX as people cared to
    port to Linux and XFree86.


