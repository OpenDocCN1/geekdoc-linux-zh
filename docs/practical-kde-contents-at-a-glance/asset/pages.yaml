  md: '# PART III Using the Applications in the KDE Distribution


    # CHAPTER 20 KLyX: The Paradoxical Processor of Complex Documents


    Now that you have something to look at, you can begin to sort it all out. You
    notice multiple levels of toolbars. You recognize some of the icons, but many
    of them are mysteries, and a lot of icons you are accustomed to seeing are absent.
    The screen is gray and what appears to be the main button on the top toolbar is
    blank. Most of the menus are grayed out. It is not a program that you fire up
    and just begin typing away. No, it is far more circumspect than that.


    Before we go further, let''s identify those toolbars:


    +   - **General**—The top toolbar contains items you are likely to recognize.

    - **Math**—The second toolbar contains items for use in equation editing. It is
    not entirely ridiculous to say that KLyX is an equation editor with some word-processing
    functions wrapped around. Typical KLyX users also use this toolbar a lot.

    - **Tables**—The third toolbar creates and manipulates tables in KLyX documents.

    - **Character**—The fourth and final toolbar contains drop boxes used to control
    the characters in the document.


    You can control which, if any, of appear via Options > Screen Options > Toolbars.


    Before you can do anything, you need to create a **File > New** or **File > New
    from template** that prompts you for a filename and location, using the standard
    KDE file selection dialog box. If you choose **File > New**, the default layout
    is used. If you choose **File > New from template**, you are offered a choice
    of installed layouts (see Figure 20.5).


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_445_0.png)


    **FIGURE 20.5**nChoose your project from the layouts dialog box. Various document
    layouts are available; some publications provide their own.


    432'
