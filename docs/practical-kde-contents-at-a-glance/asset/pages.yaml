  md: '# Using KFM''s Powerful Super User Mode CHAPTER 10


    But sometimes you need to change configurations or move files outside your home
    directory. (The most frequent of these is when you want to put a source tarball
    into /usr/local/src, extract it, and read or perhaps modify its configuration
    script or Makefile before compiling and installing a new program.)


    Traditionally, you would open a terminal window, type su to call superuser mode,
    type in the root password, and conduct the file manipulations from the command
    line. This can certainly be efficient if you know the commands for the shell program
    you''re using.


    # Dont Ignore the Command Line


    You really learn the terminal commands anyway, because one day they will save
    you. It''s difficult to memorize them, though, so at minimum you should print
    out the command reference for whatever you''re using. Your Linux distribution
    almost certainly installed on your drive, in the /usr/doc or /usr/local/doc directory.
    Keep the prompt where you can find it. Over time, you''ll become more and familiar
    with its contents.


    In KDE, there''s a way to put KFM into user mode. From the Kpanel''s K menu, select
    System, and then File manager (Super User Mode). You''ll be given a login window,
    where you must give the root password.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_248_0.png)


    FIGURE 10.9

    The login window, at top, begins File manager (Super User Mode) by prompting for
    your root''s password. Your reward for entering the correct password is the KFM
    window at bottom, which has full root privileges.


