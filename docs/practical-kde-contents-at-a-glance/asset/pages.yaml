    # Bitmap Backgrounds: Wallpaper


    Colors are nice, and certainly they are efficient, but rare is the computer user
    who

    does''t sometimes to make the image on the monitor a little, well, different.

    The easiest way to do this is through the use of bitmapped graphics, either displayed

    as images or tiled for a pattern or texture effect.


    Dozens and dozens of these are included in the KDE distribution, and you can add

    your own as well, by copying your graphics files in .xpm or .jpg format into the

    share/wallpapers directory of your KDE directory. You can then see them by

    clicking on the Wallpapers drop box in Display settings, as shown in Figure 5.7.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_113_0.png)


    When using bitmapped backgrounds, it''s a very good idea to click Apply to get
    a

    sense of the actual screen effect. The preview window is simply too small to give
    an

    accurate picture of the resulting desktop. You can always try something else if
    you

    don''t like the applied desktop.


    Many of the supplied bitmaps are texture effects, but there are other possibilities
    for.

    eample, I''ve cleaned up a little bitmapped copy of my company logo, so that it
    will

    merge with itself seamlessly. It makes a decent background, as shown in Figure
    5.8.

    But that picture shows, too, an error I made.


    I kept a two-color setup, even though I am using a tiled bitmap. This means I

    keeping an image in memory, the two-color screen, I''ll never see. It is simply

    throwing away memory. If you use a tiled bitmap, make sure you select One Color.

    It''s an easy mistake to make, and one not easily noticed. But it will cause your
    Linux

    system to begin to swap to disk that much sooner, and using the swapfile slows
    the

    system considerably.'
