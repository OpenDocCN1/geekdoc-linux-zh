  md: '# Configuring KEdit


    For the huge majority of purposes, KEdit works just fine in its default configuration.
    But you''re using Linux, so there''s a good chance that you''re easily dissatisfied
    with things as they are served to you and are eager to change things so that they
    suit your tastes and not someone else''s. Good for you! You can do that with KEdit''s
    Options menu.


    The first item you select is your screen Font and is illustrated in Figure 14.7.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_328_0.png)


    FIGURE 14.7

    If you plan to use KEdit for system configuration files, it''s a good idea to
    use a monospaced typeface, such as Courier, rather than a proportionally spaced
    one. Why? Because several Linux configuration files are tabular and will look
    awful and difficult to follow when editing otherwise.


    The Colors option lets you set foreground and background hues for the now-familiar
    KDE Select Color dialog box.

    It''s a poor idea to make any changes to the Spellchecker unless you plan to write
    using KEdit in a language that uses accented characters. Bear in mind that this
    doesn''t provide the character set for writing, but it simply keeps the spellchecker
    from thinking that words with accented characters are misspelled.


    Options > KEdit Options renders the dialog box shown in Figure 14.8.'
