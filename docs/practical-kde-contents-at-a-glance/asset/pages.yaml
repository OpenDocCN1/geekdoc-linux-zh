  md: '# PART IV Going Online with KDE


    # CHAPTER 23 Reading the Newsgroups


    For much longer than there has been anything called the World Wide Web, there
    were Usenet newsgroups. These were originally designed to allow the discussion
    of ideas and problems of a technical nature, and some of them still serve that
    purpose between the spam posts. Thousands upon thousands of newsgroups operate
    today on a variety of topics, some worth the trouble.


    In order to participate, though, you need a news reader program. Such a program
    allows you to read the groups online, to post your own original messages, or to
    respond to messages from others. One is built into Netscape''s Communicator product,
    of course, and various versions are available for Linux, with console-mode versions
    being among the most popular. The core KDE distribution includes one, too. It''s
    called KRN, and you get to it by selecting K Menu > Internet > News Client. Unfortunately,
    the word count of the KRN documentation is approximately equivalent to the number
    of words in this chapter to this point, so what you learn about its use, you''ll
    learn. This is too bad because KRN is a dandy little program on which a lot of
    work was done; few hours more and they could have told people how to use it. As
    it is, navigation is mostly by error message, finding your way down a dark hall
    by bumping into the. So watch your nose, toes, and elbows, and cross your fingers
    that there are no stairways down.


    # Setting Up KRN


    Before you begin, you might have to configure KRN. (For some reason, some installations
    seem to work right out of the compiler, no configuration required, while others
    require the procedure listed here, which is quick and simple, so fear not.) All
    these items are available later in the **Options** menu.


    The first thing to configure is **Identity**—see Figure 23.1.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_497_0.png)


    FIGURE 23.1

    You should need no help with this dialog box.


    484'
  merge: -1
  pgno: 497
- img_proc: true
  md: 'Then comes NNTP Options—see Figure 23.2.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_498_0.png)


    Figure 23.2 You may need to get some of the information from ISP for this page.
    Mine works as pictured. If you want more than 100 messages at a time, you can
    set that number higher.


    This should be enough to get you started, but while we''re here, let''s look at
    the other items in the Options menu. The next in the list is Expire Options—see
    Figure 23.3.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_498_1.png)


    Figure 23.3 This dialog box lets you decide how long KRN retains the headers it
    has downloaded. If you read a number of groups, or read extensively in just a
    few, the amount of storage space needed for all this stuff can grow pretty quickly,
    so archiving it for very long can be a costly proposition. The defaults are pretty
    good.


    Finally, we have Printing Options—see Figure 23.4.'
