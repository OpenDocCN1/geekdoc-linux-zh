    # # The Neatest Desktop Around


    This is not, strictly speaking, a KDE application, but the developer went to consider
    considerable pains to make KDE friendly, which is reason enough to include X Globe.
    It is a program that replaces the simple static colors or random wallpapers of
    your desktop with a real-time sun view of Earth from space. Take a look at Figure
    19.11.


    Matt, Jul 10, 1999, 5:30 EDT

    View pos 22.00° N 23.68° E

    Size span 25.00° N 29.86° E


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_437_0.png)


    FIGURE 19.11


    X Globe lets you choose high-resolution photographs taken from space to cover
    the globe that displays your desktop and updates as frequently or infrequently
    as you like.


    There is talk of porting X Globe to create a Moon version that would track the
    phases of the moon using a high-resolution lunar map. I know, because I have done
    most of the talking and used the project to prove to the satisfaction of all that
