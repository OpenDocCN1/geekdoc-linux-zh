  md: '# PART II Customizing the K Desktop


    # CHAPTER 7 Making a Super K Panel


    Somewhere on your screen, probably not at its bottom, is what to me is KDE''s
    secret weapon. It is the K Panel, and you can make it do things that users of
    other desktops and operating systems wish they could do but can''t. In this chapter,
    we shall uncharitably rub their noses in it, because we''ll exploit K Panel to
    the max.


    Actually, I misspoke a little. I gave the location of KDE users think of K Panel,
    but really, the name belongs to four discrete parts. We''ve dealt with two of
    them already, and in this chapter we''ll see what we can do with the other two.
    The four parts are


    +   - Disk Navigator, whose acquaintance was made in Chapter 4, "An Introduction
    to the K Desktop."


    +   - K Menu, the subject of Chapter 6, "Customizing the K Menu."


    +   - K Panel, the item whence applications can be launched and docked.


    +   - Taskbar, which was introduced in Chapter 4, but which we''ll exploit further
    here, at least in some ways.


    Having already used the names in the preceding list and having now nodded to the
    fact that they are all technically K Panel items, let us agree to call them henceforth
    by the names in the list.


    # Putting K Panel and the Taskbar Where You Want Them


    Several configuration issues involve K Panel and the Taskbar, the first of which
    is positioning. Let''s explore the possibilities.


    Figures 7.1–7.5 show the KDE desktop with the Taskbar and K Panel.'
