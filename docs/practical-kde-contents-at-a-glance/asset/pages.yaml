    The first section, Active desktop borders, lets decide whether resting your mouse
    pointer against the edge of the screen will cause a jump to the next virtual desktop
    at that edge, and if so, how long the mouse pointer must sit before the change
    takes place and what happens immediately afterward.


    To enable this kind of screen navigation, click the check box next to Enable active
