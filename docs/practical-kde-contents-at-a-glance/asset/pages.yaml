    # Handling CD and Floppy Drives


    Another place where Linux is different in a startling and unpleasant way to new
    users is its way of dealing with CD-ROMs and floppy disks. Because of security
    issues, these usually cannot be popped into the appropriate drive and read or,
    in the case of a floppy, written to, as they can in DOSrative operating systems.
    To read a CD, you must first put it in the CD reader, and *mount* it, using a
    console or terminal command like this:


    ```

    mount /mnt/cdrom

    ```


    And you usually must be the root user in order to do even that. This depends on
    your Linux distribution and the defaults it sets. To change it, look forfor-mation
    in your distribution''s documentation on editing /etc/fstab. Then, when you are
    done, you must issue another command:


    ```

    unmount /mnt/cdrom

    ```


    If you don''t, Linux won''t let your CD reader give you your CD back. And yes,
    the command is *unmount*, something that has puzzled Linux users at least once.
    (Actually, most Linux users probably remain puzzled on this puzzle, but at least
    they learn how to get their CDs out of their machines.)


    Mounting a floppy can be even worse:


    ```

    mount -t msdos /dev/fd0 /mnt/floppy

    ```


    280'
