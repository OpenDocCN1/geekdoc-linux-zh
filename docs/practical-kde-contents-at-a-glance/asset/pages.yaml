  md: '# PART III Using the Applications in the KDE Distribution

    CHAPTER 20 KLyX: The Paradoxical Processor of Complex Documents


    **Standard LaTeX document classes**—The functional equivalent of templates in
    word processors, these are not things that you whip together yourself. They consist
    of


    +   - article—The basic document class

    - report—Similar to article, has a more rigid structure

    - book—Supports chapters

    - letter—For writing letters in English

    - slides—For preparing transparencies

    - aa—The format for articles to be submitted to the magazine Astronomy and Astrophysics

    - amarsart—A variation on article, produces formatting that complies with American
    Mathematical Society standards

    - dinbrief—For writing letters in German

    - foils—A more elaborate and attractive alternative to slides

    - paper—An alternative to article, more elaborate

    - REVTex—A document class that meets sets set by the American Physical Society,
    the American Institute of Physics, and the Optical Society of America


    **Paper size packages**—As you can imagine, support for paper of different sizes.
    These include


    +   - a4—The standard European paper size

    - a4wide—Like a4, but with wider margins

    - geometry—Lets you change paper size and margins at the cost of some of the program''s
    typographical functions


    **Typefaces** include


    +   - EC fonts—Supports high-quality kerning and hyphenation

    - psnfss—The 35 standard PostScript typefaces


    **Other packages** include


    +   - algorithm—To support some kinds of mathematical layouts

    - babel—Handles automatic translation of some document elements into non-English
    languages

    - color—Supports text in color'
