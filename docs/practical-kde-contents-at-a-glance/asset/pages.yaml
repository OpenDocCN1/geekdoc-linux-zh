  md: '# Acknowledgments


    The difficulty involved in trying to make technical information readable—heavens,
    maybe even interesting!—is matched only by that in keeping track of and properly
    thanking all the people who made it possible. If I have succeeded in any way in
    the former, it is due to many people who I will surely insufficiently credit in
    the latter. The shortcomings in both cases are mine.


    But here are at least some of the people without whom the book would not have
    been possible.


    In my experience every big project has somewhere someone without that project
    simply could not come to pass; in this it''s Bob Bernstein. He is someone upon
    whom it has endured to heap up too much praise. From the beginning of my Linux
    experience, he has endured cheerfully the silliest of questions, has taken hours
    of his time to solve problems with programs in which I was interested but he was
    not, soothed my late-night outbursts when something didn''t go as I hoped, and
    held his temper when his failed to do so would have been entirely justified. He
    is technical editor of this book, which job I can assure you I did not make easy.
    He is also someone who, through it all, I have come to consider a warm, personal
    friend and adviser on much more than Linux. We both have our crotches, but have
    never fired them at each other


    Gretchen Ganser, first joined some by Hugh Vivandier, the midwife and I, guess,
    obstetrician, and it was not an easy birth. They are listed formally as acquisition
    editor and development editor respectively, and master''s a nice little pair of
    categories, but they have also been mentors; gentle taskmasters; soothers of raw
    nerves; patient beyond enumerating; and I hope despite my manifold annoyances,
    friends, too do not, so far as I know, any saints and cannot therefore attest
    to their patience, but if it is as reported, Susan Ross Moore, the project editor,
    has met her requirement for sainthood. I were to write another computer book,
    I would beg for all three of them.


    Scott D. Courtney, Calder''s Erik Ratcliffe, and just about everybody in KDE development
    filled the multitude of blanks in my knowledge. Likewise Donnie Barnes of Red
    Hat, who has put me straight on more than a few things in his inimitable fashion
    (besides being the only person to have an entire language in a Linux distribution
    in his honor). Michael J. DeNigris III, a great programmer whom I shall owe one
    win over to the path of truth and righteousness that is Linux, and John DeRosa,
    Junior and Senior, have always provided support that was, well, essential as has'
