    If you''re new to Linux, you may not believe it, but trust me: sooner or later
    you will succumb to the need or desire to compile your own programs. Trust me
    on this, too: after you''ve done it, you''ll wonder why you waited so long. Compiling
    software on your machine—“rolling your own” in hacker idiom will give you a sense
    of power and accomplishment that other things in computing can match. But there''s


