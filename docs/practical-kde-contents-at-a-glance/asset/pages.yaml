  md: '# Toolkit


    "By his tools can the workman be told."



    I searched all over for a quote that said words to that effect, and finding none,
    I was forced to make up the one above. It will do. In the early days of personal
    computing, it was customary for articles and magazines to list the software and
    hardware that were used to construct the article or publication, even as some
    books devote a page to the history of the typeface employed. This was a good idea,
    and I herewith propose to contribute to its revival.


    Practical KDE was written on a fairly basic desktop machine running an AMD K6-2
    processor at 400MHz with 1MB of L2 cache and 256MB of RAM.


    It was written entirely in the word-processing program of StarOffice 5.0 or 5.1,
    with files saved in Microsoft Word 97 format for transmission to the (otherwise
    entirely enlightened) people at Macmillan who require that format. StarOffice
    has improved vastly stability in the version shipped with Caldera OpenLinux 2.2,
    which was run during the construction of this book.


    Screenshots were made with KSnapshot and saved in BMP format. I used GIMP to convert
    them to the required (and smaller) PCX.


    All this done atop a season of KDEs. Very early work was done in KDE 1.1, followed
    soon by 1.1.1, which gave way to weekly builds of pre-betas of KDE 1.1.2, and
    finally, KDE 1.1.2 itself, which is where things stay until the urge to explore
    arrives and I tackle the pre-betas of KDE 2.0, which promises to be breathtakingly
    good. That is the subject for another book, edition.


    One note to the reader: Experiment! Try it! It is a simple thing to build up your
    nice, safe, working KDE and to download the source code for KDE and build your
    own custom version. Chances are it will go without a hitch, but if it—you will
    have learned something—if nothing else, some questions to ask and areas for additional
    learning—and you can restore your old version. But if no—when it succeeds, you
    will have a sense of power over your computer unlike anything you''ve experienced.
    You will have gained a valuable skill, and will no longer be at the mercy of the
    prebuilt software about which others have made all the important decisions. Remember:
    When you are marvel at the vast knowledge of the Linux and KDE gurus, whose admiration
    is certainly deserved, don''t forget that there was a time when you, too, were
    starting out.'
