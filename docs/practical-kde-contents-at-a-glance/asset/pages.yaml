- img_proc: true
  md: '# PART III

    Making Tape Backups Under KDE CHAPTER 17


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_398_0.png)


    # FIGURE 17.14


    At first, KDat shows little. You can back up the entire system using Backup Profile
    1, or you can create a profile for your ~/directory.


    For KDat to work, you need a Linux-compatible tape drive, which means that one
    works in non-rewind mode. This is usually located at /dev/tape or /dev/ftape,
    if it runs off of a regular or enhanced floppy drive controller. SCSI tapes are
    listed as SCSI devices. This likely involves a little experimentation. Because
    tape drives aren''t usually enabled by default in Linux kernels except as modules,
    you will have learned what yours is called when you installed the module for it
    or when you compiled support into the kernel. (As you may have gathered, most
    tape drives aren''t easy projects in Linux.) When you know what your tape is called,
    go to *Edit > Preferences* to tell KDat where it is. Then it is simply a matter
    of on, on the same screen, telling KDat the uncompressed size of the tape itself.
    If you intend to back up the entire system, select **Backup Profile 1**, and click
    the **Backup** icon, from the left in the toolbar. If you want to back up all,
    just, say your ~/, go to *File > Create Backup Profile* and select it as I did
    in Figure 17.15.


    385'
  merge: -1
  pgno: 398
- img_proc: true
  md: '# PART III Using the Applications in the KDE Distribution


    # CHAPTER 17 Manipulating File Archives and Backing Up Your Drive


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_399_0.png)


    FIGURE 17.15 By clicking on my ~/ directory in the tree view at left, I created
    Backup Profile 2: my home directory. Now it''s a matter of putting a tape in the
    drive and clicking the Backup icon.


    After you''ve made your backup, you want to Verify that your files were written
    properly to tape. You can do this by selecting the directory or directories that
    were backed up, and clicking the Verify icon (fourth from the left on the toolbar).


    After you have made your backups, a second tree containing the contents of the
    tape is shown when the tape is mounted. Select the files or directories you want
    to Restore, and click the Restore icon, third from the left.


    There are other tape backup programs for Linux, and most commercial distributions
    of Linux include a personal edition of a commercial program that uses a method
    that its makers say is more reliable than tar. This program (and other programs
    that, like Kdat, are freely distributed) work well under KDE, so you might want
    to investigate any that you might already have.'
