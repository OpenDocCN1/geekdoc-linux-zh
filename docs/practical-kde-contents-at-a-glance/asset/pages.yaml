    at the right end of the K Panel. We will deal in detail with the first two in
    Chapter 6, "Customizing the K Menu.\ The clock settings will give us quite enough
    to handle just now.


    The first of the clock choices is Clock shows time in AM/PM. If you don''t check
    it, the clock will be in military (24-hour) time, and 1:00 p.m. it will be 13:00.
    You will think that I am making up the second choice, but I''m not. Its Clock
    shows time in Internet beats, which is to say clock ceases to show time at all.


    > A Solution in Search of a Problem It seems that the Swatch company, maker of
    popular and trendy watches chiefly of plastic, dreamt of dividing the day into
    1000 equal parts, with the day starting at midnight at Swatch headquarters in
    Switzerland. If you select this item, you will never again have to wonder how
    thousands of a day it has been since midnight in Switzerland (I told you thought
    I was making this up.) Perhaps the idea was to sell Swatches to those who are
    interested in knowing, instead, what time it is, now that their computers won''t
    tell them. What the Internet has to do with it is anyone''s guess. We can imagine
    that later versions of KDE will include as clock options the rate of increase
    of the national debt or running totals of how many sandwiches have been sold by
    leading hamburger vendors.'
