  md: '# PART VII Programs that Extend the Power of KDE


    # CHAPTER 34 Two Non-KDE Programs You Must Have


    # RPM


    There are times when you install an RPM package and, after doing so, you discover
    that you''ve broken something, either the program you''ve upgraded or another
    program (or programs) that rely on it. How do you uninstall the new RPM and restore
    things to their previous state? If you know the RPM command line options, you''ll
    be able to bring this all about, if the previous installation of whatever upgraded
    was from an RPM. In any case, knowing how to handle an RPM from the command line
    is an important skill. (The same holds true for the DEB file management tool,
    dpkg, if you are using Debian Linux.)


    # TAR


    The command-line options for the TapeArchive command (which usually has nothing
    to do with tapes at all) will be critically important to you sooner or later.
    Learn them, and gain proficiency by using them from time to time.


    # GZIP, GUNZIP, and BZIP2


    You''ll regularly encounter these compression programs in Linux. The one problem
    with all the nice package managers that exist is that they can insulate you from
    having to learn these commands, which is fine unless you''re in a bind and need
    to dig into something from the command line.


    > What''s "Uncompress?"

    From time you will encounter a program that in the course of compiling or some
    other operation will fail with the announcement that it could not find a file
    called "uncompress". uncompress is a UNIX command that is not usually used in
    Linux. What do you do?

    Well, you''re in luck. Gunzip, which you have installed, is compatible with uncompress.
    Of course, the program that just blew up doesn''t know that, so you need to give
    it some help.

    Perhaps you can draw it into script or source that is calling uncompress and change
    it to gunzip, but that is a lot of trouble and only works for this application.
    There''s an easier and better way: Make a symbolic link from /bin/gunzip to /bin/uncompress.
    Then you''ll never see this error message again.

    A quick and easy way to make a link is to open KFM and drag gunzip into its directory,
    the equivalent of copying it onto itself. You''ll be asked what you''d like to
    do, which is make a link named uncompress.

    Alternatively, at the command line, change to /bin and do the following:

    ln -s gunzip uncompress


    624'
