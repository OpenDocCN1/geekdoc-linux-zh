  md: '# PART VI

    VMware: The Good Stuff CHAPTER 32


    # The Right Tools for the Job


    First, go back to the VMware Web site (www.vmware.com) and download something
    called VMware Tools. Be sure to get the Windows version you are going to install
    this into your Windows virtual machine (if running Windows 95 or 98, among the
    DOS-based versions of Windows—it won''t work with Windows 3.x, NT, or 2000). At
    once about half your complaints will disappear. This point, I think, is not made
    strongly enough on the VMware page.


    What do we get? A great deal. First, your mouse pointer can now move from the
    VMware virtual machine to the desktop and back again. This isn''t quite as smooth
    as it would be native X Window System applications, but it is usable. Second,
    the tools include a very effective emulation of a Windows SVGA driver, meaning
    that you are no longer stuck with plain old VGA and can run your Windows boot
    at any resolution and color depth supported by your Linux (as shown in Figure
    32.12).


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_616_0.png)


    FIGURE 32.12


    If you look at the portions of the Windows 95 screen visible in Figure 32.11,
    when VMware was running at 640x480 pixels, and compare to the same application
    running at 800x600, you''ll see one of the values in installing the free VMware
    tools.


    603'
  merge: -1
  pgno: 616
- img_proc: true
  md: '# PART VI Using Non-KDE Applications with KDE

    CHAPTER 32 Running Windows Applications with KDE


    But I have saved the best for last: with VMware tools you can copy and paste among
    Linux and Windows applications and between different Windows virtual machines.
    When you copy something in a Windows application, it appears in Klipper. This
    is very cool.


    Even cooler is the fact that you can create different VMware virtual machines
    for different operating systems. And you can even run them all at once! For instance,
    I made virtual machines for Windows 95, Windows 3.1, and PC-DOS 6.3.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_617_0.png)


    Now, this may seem like a minor point, but let it roll around in your mind for
    a while, as you might swirl a taste of expensive wine around your tongue. Think
    of the possibilities.


    Let''s say you''re a Windows application developer. Your tools work perfectly
    well in a VMware boot, so you can write code with no problem, and then you can
    test it on several different Windows platforms, all from the same machine, without
    rebooting. *Try that in native Windows!* If one or more of them crashes, so what?


    # Maximum Safety


    There''s something even cooler. You can set disks (either virtual disks created
    in VMware or actual disks accessed through VMware) to be persistent, non-persistent,
    or undoable. What does this mean? *A persistent volume behaves like a normal disk
    drive: you can change anything on it and you can delete files on it. A non-persistent
    volume behaves just like a persistent one, but no changes survive the current
    session.* This means that if you use one of those strange Windows mail programs
    that uses a proprietary format and automatically runs any executable file that
    is attached to a message, you can safely do so in non-persistent mode. Even if
    it contains a macro virus, it will do no permanent harm. Obviously, this is the
    configuration to have for examining suspect files. *Undoable mode* is like non-persistent'
  merge: -1
  pgno: 617
- img_proc: true
  md: '# PART VI

    VMware: The Good Stuff CHAPTER 32


    mode except that at the end of the session you are asked if you want to save the

    changes made to the disk. This is a great mode for software testing: again, a
    way in

    Linux running VMware is an ideal platform for Windows application developers.


    # Ever Hear of a One-Man Band? Here''s a One-Machine Network


    A great strength (and in some cases weakness) of VMware is the isolation of the

    operating systems and applications thereunder. When you have, say, Windows 95

    running in a VMware virtual machine, it is completely unaware that it is running

    under Linux, and Linux is unaware of it. This prevents anything that takes place
    in

    t Windows boot from corrupting the Linux file system. It''s like a dangerous snake

    being safely away with a long snake hook, or a scorpion in a bottle. You can,

    though, set up Samba shares or other networking so that you have a virtual network

    running on your desktop.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_618_0.png)


    What else can you do with VMware? You can set up a virtual machine to run an

    ent second version of Linux, which is a useful thing to do if you are a kernel

    hacker or Linux developer. The people at VMware say that a future version will

    accept OS/2 as a guest operating system, which will delight a multitude of users
    of

    that worthy but engendered operating system.


    So yes, all those irritations mentioned in the first part of our consideration
    of

    VMware are true, but they do not eliminate the other facts: that it works at all
    is

    demonstration of programming versatility. More than that, though, it allows a
    degree

    of versatility that allows it to perform functions absolutely nowhere else. If

    you need to run Windows applications reliably, it accurately offers improvements
    over a

    native Windows boot. If you have the horsepower to run it on your machine, it''s
    well

    worth the download, but if you do download it, on giving it a couple of days to

    prove itself to you. You may decide, as I have, to keep it. Where else, after
    all,

    could you do this (see Figure 32.13)?


    605'
