  md: '# PART II Customizing the KDE Desktop


    # CHAPTER 11 Using the Command Line in KDE


    As is true of any operating system, there are times when the Linux user wants
    or needs to use the command line. These vary from individual to individual. Some
    would be faster at installing RPMs from the command prompt than they ever would
    using a graphical package manager. Some would sooner think of editing a configuration
    file with anything other than vi would jump off the roof. I don''t know any quicker
    way to upzip and untar a gzipped tarball than the tar xzvt command. And if there
    is a graphical front-end for a compiler that provides for all the options might
    typically employ, I have never heard of it, nor can I imagine it.


    KDE offers three command-line options to the user (four, really), but one is outside
    KDE:


    +   - Konsole, the new, improved terminal emulator. It has many improvements on
    older virtual terminals, but until recently it was not utterly reliable.


    +   - kvt, said by many in the KDE development community to be thrown together,
    is out its way. It is not feature-rich, but it always seems to work.


    +   - MiniCLI, the miniature command-line interface, is a quick pop-up window
    into which you can type a command. Ideal for some things, it is ill-suited to
    many others.


    +   - Leaving KDE, either by closing it or switching to another Linux terminal,
    is extreme, but it always works. And for some functions, as upgrading KDE itself,
    nothing else will do.


    We shall, then, explore each of these in turn, with an eye towards which is best-suited
    for a particular task. Mastering these different command-line interfaces goes
    a long way maximizing the efficiency of your KDE experience.


    # Slick and New: Konsole


    Beginning with KDE 1.1 (it seems so long ago, those dark ages of January 1999),
    a second terminal emulator was made part of the KDE distribution. It was called
    Konsole. It dumped a lot at first—blew up and left its remains for autopsy in
    a “core” file—but when it ran, it character-mode applications very well. It was
    announced that this would be the replacement for the venerable Kvt (in KDE terms,
    it had been around for for six months). There were many skeptics. There still
    are, but the skepticism had faded.


    Konsole isn''t much to look at, hot off the compiler (see Figure 11.1).


    258'
  merge: -1
  pgno: 271
- img_proc: true
  md: '![](img/4a2883756c73e7b0696dbbd721c5c7db_272_0.png)


    FIGURE 11.1 it isn''t very pretty—no X terminal is—but it offers features that
    make it an attractive choice.


    Konsole has features that will knock your figurative socks off. The version included
    with KDE 1.2, for example, has an interesting File menu (see Figure 11.2).


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_272_1.png)


    FIGURE 11.2 What file manager figures out you have Midnight Commander (see Chapter
    34) aboard or lets you have a root console without typing in su?


    The great strength of Konsole from the beginning has been its capability to run
    character mode applications without sending them to the wrong signals. Many X
    terminals, for instance, have a difficult time with Midnight Commander, the excellent
    file manager. Commands typed in it would actually sometimes come up in reverse
    order! But not Konsole, and as if to underline that fact, MC is included on the
    File menu. And it runs well there, though some changes are made, the whole business
    is pretty tiny (see Figure 11.3).'
