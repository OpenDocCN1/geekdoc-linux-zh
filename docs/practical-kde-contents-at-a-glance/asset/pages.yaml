    # If You Can''t Make Up Your Mind


    Programmers use the term feature creep to describe a phenomenon perhaps unique
    to them. It applies to any feature added to a program not in response to some
    actual need, but simply because the programmer has figured out how to do it. KDE
    is full-featured but not excessively featured. Still, if there is anyplace that
    it comes to'
