- img_proc: true
  md: '# PART II CHAPTER 9


    The easiest thing to do is simply copy them into the /share/apps/kthememgr/Themes
    subdirectory of your system''s master KDE directory. They should be available.
    If for some reason you don''t want to do that or don''t have access to it, you
    can put them in your ~/directory somewhere. Then you get to use the Import button
    on the Theme Manager page of the KDE Control Panel. KDE normally uses for File
    > Open functions. This is a nice use of the standard code KDE normally Browse
    to the appropriate place, select the new theme, and click OK.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_236_0.png)


    # Installing Themes the Old-Fashioned Way


    Don''t.


    This was going to be a section that would have gone on and about about how, by
    the simple task of creating a dozen or more directories, copying all manner of
    files from tarballs into them, and editing relatively complex configuration text
    files, you could try out one new theme. By repeating that of process, you could
    then try out another, and so on. You could also throw away your computer and get
    an old manual typewriter or communicate with friends in the neighborhood by flashing
    your room lights off and on in Morse code. It would make just as much sense.


    If themes are that important to you and you do not have a version of KDE that
    has the Theme Manager installed, download KDE 1.2 and either install the compiled
    binaries or compile it yourself. Then you will have quick access to many themes
    in less time than it would take to install just.


    Now let''s get on to something with some meat.'
