  md: '# Shisen-Sho


    This is a game similar to Mahjongg, but played in only two dimensions (see Figure
    18.21).


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_416_0.png)


    **FIGURE 18.21**

    It''s more difficult than it looks. Shisen-Sho is another tile-matching game.
    This is in its biggest, most difficult mode. Size and difficulty are set separately.


    Like Mahjongg, Shisen-Sho offers hints and has different layouts available. Unlike
    Mahjongg, Shisen-Sho times you and marks the Status Bar as Cheat Mode when you''ve
    asked for a hint. You can choose from multiple levels of difficulty as well.


    The programmer of this game has a demonstrable mean streak: Some of the games
    can''t be won. You can query it to whether the current game can be solved, and
    you can set it to produce only solvable games. There is a cheat mode in which
    you click on a tile and,, if there''s a playable matching tile, it blinks at you.
    You can adjust the size of the board. Poke around the menus; half the fun is experimenting.'
