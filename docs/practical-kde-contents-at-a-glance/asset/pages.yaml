  md: 'The last of the input devices is **Mouse** (see Figure 5.35). Its settings
    all work, as long as you have a mouse or other pointing device. If you don''t,
    you can forget KDE because current versions to not allow navigation by keyboard
    even though hotkey combinations are spattered sporadically about the KDE screen.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_145_0.png)


    FIGURE 5.35

    The **Mouse** tab can make your pointing device much more efficient and easier
    to use.


    How quickly your mouse pointer zooms around the screen is determined by the Acceleration
    slider. Its behavior is fairly standard: Moving the pointer at high speed sends
    it farther than moving it a longer distance at low speed. Working hand-in-mousepad
    with Acceleration is Threshold, which determines how far the mouse must be moved
    before Acceleration kicks in. You can, edit that bitmap graphic pixel-by-pixel
    without accidentally sending your mouse pointer into the next ZIP code.


    Finally, there is Button mapping. This reverses the functions of the buttons on
    your pointing device, in case you want to use your left hand for mouse manipulation.


    We move next to a section that you will use all the time, or at least sometimes.
    It is the Keys section (see Figure 5.36).'
