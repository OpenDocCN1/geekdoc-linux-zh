  md: '# PART V KDE on the Network


    # CHAPTER 25 Running Your System Through KDE


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_533_0.png)


    # FIGURE 25.10


    Now we can see. The various system services are in the column on the left, and
    the run levels that employ them are listed by numbered columns across the rest
    of the screen. Some run levels don''t have much going on, whereas others run all
    sorts of things.


    What can we learn from this? Well, one example is that even if you use gpm for
    console mode mouse support, it isn''t running in single-user mode, run level 1.
    Likewise, network-related services are not in operation. (Also, you can drag the
    crossbar at the bottom of the lists to make use of the white space.)


    What does SysV Init Editor do? It assigns symbolic links from the services to
    the different run levels. On the chance that you''re new to Linux, we''ll take
    one of your little diversions from the strictly KDE and into basic Linux because
    this is an area that is often misunderstood.


    In your /etc directory resides a subdirectory called /rc.d (if your distribution
    uses SysV initialization, which most modern distributions do). (If you''re using
    BSD, you can skip this because none of it applies to you.) Let''s look inside
    (see Figure 25.11).


