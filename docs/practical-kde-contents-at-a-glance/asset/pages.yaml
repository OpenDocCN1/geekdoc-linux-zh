  md: '# PART II Customizing the K Desktop


    CHAPTER 11 Using the Command Line in KDE


    # The Old Reliable: kvt


    The K virtual terminal, or kvt, has been around for a long time, since well before
    the release of KDE 1.0. It is inelegant and not especially attractive, but it
    works for most things you would ask as a terminal window to supply. As Konsole
    has become more reliable, kvt has been scheduled for retirement. Like Konsole,
    it passes mouse commands along to applications that can make use of them, and
    it is fairly sparse (see Figure 11.10).


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_277_0.png)


    FIGURE 11.10

    kvt in all its soon-to-depart glory.


    What''s more, kvt gets no respect at all from within the KDE community. Here is
    what its own Help > About kvt... screen has has to say (see Figure 11.11).


    So you really want to run kvt anyway? It''s always a good idea to at least glance
    over the documentation, in the Help > Contents file, right? Well, let''s see the
    kvt help system, in its entirety (see Figure 11.12).


    You begin to get the sense that the developers at kde.org really don''t want people
    to use kvt, don''t you? Now that Konsole has achieved a degree of stability that
    rivals of kvt, there''s really no need to use kvt except in the rare occasion
    that you find something that refuses to run in Konsole but will work in kvt.


    Adieu, kvt.


    264'
