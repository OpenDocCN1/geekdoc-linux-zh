  md: '# PART I

    Desktop Icons: Useful Shortcuts CHAPTER 4


    # Disappearing Act


    At end of K Panel, you''ll find a small, crosshatched button with a little black
    triangle pointing off the screen. Push this and K Panel ''rolls up'' into the
    little button, which triangle changes direction. Push on it again and K Panel
    is restored. When it is minimized in this way, it adds a little box with three
    icons to the upper-left corner of the screen. These icons are for the K Menu,
    the KDE window list (think of it as a task manager), and the KDiskNavigator, about
    which there is later in this chapter. The K Panel stays on top of whatever applications
    you are running under full screen or on any part of the screen.


    # Desktop Icons: Useful Shortcuts


    Several icons are placed on your desktop by default. They vary depending on the
    Linux system yourself and whether you added KDE to it. The ones that are present
    are the Trash, the Templates folder, and the Autostart folder. Pictured here,
    too, are icons for your floppy drive, CD reader, and printer. You can add and
    remove icons as suits your taste and needs. A bit about the default icons: All
    three folders—in this case subdirectories of the ~/Desktop directory, but they
    can be moved.


    # Trash


    The first, the Trash, is somewhat not entirely like the trashcans found in some
    DOS operating systems. In Linux, "delete" means gone forever. It does in some
    KDE, too. If you are in doubt about deleting a file, you can drag it to the Trash
    (or right-click the file''s icon and select Move to Trash), and it will move to
    the Trash directory. You may at a later time click on the Trash and view its contents
    and move any file you want to keep back to where it belongs. The Trash folder
    is similar to other folders (see Figure 4.9) but its Edit menu contains an item
    allowing you to empty the Trash. Choose it and all the files in the Trash are
    assigned to oblivion.


    The chief difference between KDE''s Trash and those from elsewhere is that you
    must specifically move a file to it. Deleting a file doesn''t automatically put
    the file in the Trash; in fact, it''s gone forever.


    # Templates Folder


    The Templates folder contains items that you will use frequently or not at all:
    there seems to be a little middle ground. This has a lot to do with whether a
    user wants a desktop populated with icons. In any case, clicking on it opens the
    folder depicted in Figure 4.10.'
