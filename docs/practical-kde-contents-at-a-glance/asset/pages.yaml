  md: '# Copying and Moving Files and Directories


    There are several ways of copying and moving files and directories with KFM, and
    each has its own special purpose. If you learn them, you''ll be able to do pretty
    much anything efficiently.


    The simplest method is to right-click the icon of the file or directory you want
    to manipulate. It highlights it and gives you a menu (see Figure 10.8). You can
    then select Copy. The file is not copied into memory at this point, but instead
    a temporary link to it is made in memory. Use the arrow icons on the toolbar to
    move around on your directory when you get to the place you want the file to go,
    select Edit > Paste. If moving the file is what you have in mind, you need to
    go back and delete the original. To copy multiple files, use the left mouse button
    to draw a box around them; then choose Copy from the Edit menu or select it from
    the RMB menu. Again, if you want to move the files, you need to return and delete
    the highlighted items after you have successfully pasted them elsewhere. If you
    want to copy or move multiple files that are scattered across files you don''t
    want to relocate, you can hold the Ctrl key and click the target files with the
    left mouse button to select them.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_246_0.png)


    FIGURE 10.8 The RMB for each icon in KFM offers choices for manipulating the selected
    file or directory.'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# PART II Customizing the K Desktop


    # CHAPTER 10 Navigating Everything with KFM


    > Caution

    Make sure you have successfully copied the files before you delete them. There
    is no "delete" function in Linux. To be extra-safe, instead of deleting the files,
    choose Move to Trash from the RMB. Then, if it turns out that the files have become
    corrupted in copying or you deleted before pasted them, you can recover them from
    the Trashcan.


    This isn''t the most efficient way of doing things, though for a file or two it
    doesn''t take much time, and it is easy.


    An alternative is to open a second instance of KFM and use the arrow icons to
    navigate to the target directory. Then, using the left mouse button, drag and
    drop the file(s) or directories to their new location. Be sure to keep the left
    mouse button pressed as select and drag the file. If you click first to select,
    you''ll open the file or directory. The advantage of this method is that when
    you drop the icon or group thereof on the target, a miniature menu appears. Then
    you are asked whether you want to copy the selected item, move it, or create a
    symbolic link pointing to it and place the link in the target directory.


    A third method is useful if you have a tree view. Remember, you can always create
    a tree view by drawing the tree from the left window border. Drag the item or
    items from the right section of the window and drop it or them onto the target
    directory in the tree. Again, you''ll be asked if you want to copy, move, or link.


    > Jumping Around On Your Hard Drive\Browser-style arrow icons on the toolbar are
    use if you''re moving a directory or two. As you know, it''s a long way from your
    home directory to the top level directory of your Linux installation. This is
    where the Location box is useful. Type in file/ and press Enter, and you''re there!
    You''ll note that in tree view, your home directory is available on the left.


    # Using KFM''s Powerful Super User Mode


    All this is just fine, but what''s the point in being able to navigate all over
    creation if, because of Linux security protections, you can''t move files into
    directories outside your home directory?


    Actually, there are many good reasons to be able to navigate the local drive and
    network-rives, even if you can''t alter directories or files when you get there.
    One is that you can run executable files when you get to, and many Linux programs
    are not ones that you want to put on menus. Another is to read documentation and
    configuration files that aren''t located in your home directory.'
