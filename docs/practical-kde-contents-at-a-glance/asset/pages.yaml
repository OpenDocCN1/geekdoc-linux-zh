  md: '# The Future


    As in all things related to Linux, the future of KDE is bright. Although the 1.1.x
    versions discussed here will continue to be supported and improved, the big excitement
    in the KDE world is anticipation of KDE 2.0 and its associated Koffice suite of
    applications, which will be released sometime in 2000. This new version will not
    be compatible in many ways with KDE-1.1.x and will be built on the Troll Tech
    QT-2.0 library which is currently built on QT-1.42 or QT-1.44. Some people will
    rush to upgrade, whereas others, of course, hesitate to give up their finely tuned
    systems (tuning will be detailed in the pages that follow) and will stick with
    KDE-1.1.x until there is a real need to make the change.


    Meanwhile, the good XFree86.org continue to make improvements to XFree86, and
    the Linux kernel itself is gaining new capabilities at an ever-increasing rate.
    If you have hardware that isn''t supported, wait a few weeks or write support
    for it and contribute to the cause. That is, after all, how Linux and KDE came
    to be.


    # How to Use This Book


    There are really two ways to use this book: Read and consult it. I am endeavoring
    to make it possible to read Practical KDE from beginning to end without causing
    your mind to wander too many times to thoughts of dental procedures, but I doubt
    that many people will begin on the first page and keep it in hand until they reach
    the index. In fact, if you set out to read it from start to finish, entire sections
    will certainly have no relation to how you use KDE or your computer, and you might
    well skip them. They''re not written in disappearing ink; they will be here later
    if you find them needed. Although every chapter will be of some use, everyone
    will need them all. Someone will install KDE for administration, a Samba server.
    Everyone will install because it has a really cool Asteroids game (which it does).
    Still, some chapters will be of universal interest—the installation chapters,
    if you''ve not yet installed KDE, and the configuration chapters even the experienced
    KDE user will find tidbits of use. These chapters will also be of someone upgrading
    an existing KDE installation because the new Linux distributions KDE is handled
    in several ways.


    To easing browsing, each chapter has at its beginning a list of the things it
    covers.


    Unless you read and memorize it, though, you''ll probably find that most of the
    time you pick up Practical KDE, it will be to get the answer to a specific question.
    For this reason, it has been organized so as to be useful as a reference.


    In short, you can use this book any way you like. Effort has been made to make
    its easy use and rewarding, whatever method you choose.'
