- img_proc: true
  md: '# PART V KDE on the Network


    # CHAPTER 25 Running Your System Through KDE


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_535_0.png)


    # FIGURE 25.13


    What is here in content is not as important as what is here in form: Notice that
    every icon represents a program or itself, but a symbolic link to that program
    or service.


    > Those S Numbers


    You notice a number, beginning with a capital S in front of each service. This
    is its sorting number. To learn more about these, you''ll need to consult a more
    comprehensive Linux book. I might suggest Special Edition Using Caldera OpenLinux
    by Allen Smart, Eric Ratlcliffe, Tim Bird, and David Bandel (Que, ISBN: 0789720582)
    and Running Linux, 3rd Edition by Matt Weiss, Matthias Kalle Dalheimer, and Karl
    Kufman (O''Reilly, ISBN: 1656924269X).


    As you have probably guessed, it would be simple to create a symbolic link for
    a given service and put it in the run level''s subdirectory. This is true with,
    say, KFM; less so the command line, where you would do something like this for
    every service you need in every run level in which you need:


    ```

    ln -s > /etc/rc.d/init.d/<service> /etc/rc.d/<run level directory>/.Snn service

    ```


    You can see where this would grow quickly and how the possibility for error would
    be huge. SysV Init Editor eases this by putting it all before you.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_535_1.png)


    Some things vary among different Linux distributions, and one such variation is
    in how Debian Linux handles run levels. My Debian guru tells me that the KDE SysV
    Init Editor is not of much with that distribution. The good news is that Debian
    has its own set of run level utilities.


