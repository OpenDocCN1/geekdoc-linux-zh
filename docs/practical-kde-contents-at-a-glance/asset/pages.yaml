  md: '# PART II Customizing the K Desktop


    # CHAPTER 5 Making the K Desktop Your Own


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_109_0.png)


    FIGURE 5.2


    You can customize much in your KDE desktop with the Display Settings dialog box.


    > Low Memory? Keep it Simple


    Your choice consumes varying amounts of memory and in some low-resource systems
    can actually reduce system performance. Anything more than the choice of one color
    requires that a copy of the entire desktop be kept in memory, and for high-resolution
    systems at high color depths, this can be considerable. If you elaborate desktops
    for each of your virtual screens, each of these is kept in memory, too. If you
    have 128 or 256MB of RAM, go ahead and knock yourself out, unless you plan on
    running lots of big programs at. Otherwise, it''s something to keep in mind. If
    you discover that your system slows down after you''ve created your desktop masterpiece,
    it might be good to set your sights a little bit lower, literally.


    To its right is the Wallpaper selection section. Here you can select from a wide
    array of wallpaper images that that came with your KDE distribution or from images
    (in .jpg or .xpm format) that you supply yourself. (If you want to provide your
    own, copy them into your /kde/share/wallpapers directory.) We will be returning
    to this section later in this chapter and spending some time here.


    96'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# PART II Spicing Up the Background CHAPTER 5


    At the bottom right is a button that allows you to Dock into the Panel. If you
    choose this, the Display settings dialog box minimizes itself into K Panel when
    you close it.


    Finally, a slider determines the amount of memory that will be set aside to cache
    your desktop. The range is from 128 to 5,120KB. The more complicated your desktop—lots
    of colors, big bitmaps—the more memory you want to employ in this way. Experimentation
    is the best way to determine the best desktop performance without taking away
    memory needed for applications.


    Across the bottom are buttons that will be familiar to you as you configure KDE:


    +   - Help is pretty self-explanatory: It opens the KDE help system to the topic
    of the current dialog box.

    - Default returns you to the system defaults for the items covered by the current
    dialog box. It''s great for fixing something you''ve inadvertently broken.

    - OK applies the changes you''ve made and closes the dialog box.

    - Apply applies the changes you''ve made but doesn''t close the dialog box, which
    is useful for full-scale previews.

    - Cancel undoes any changes you''ve made since you opened the dialog box.


    # Setting Background Color Effects


    Selecting a single-color background is simplicity itself: Click the One Color
    button and, if the color you desire isn''t displayed in the color bar beneath
    that button, click it. You are transported to the color palette, where you can
    pick the color you want or create a custom color. (If you select a custom color,
    click one of the blank color boxes to select a location for your new color before
    saving the color.) Click OK and then on Apply to see if you still like it. If
    you do, click OK, and you''re done.


    For a two-color background, click—you guessed it!—the Two Color button. Now you
    select not just the first color but the second as well, with the preview window
    in the little monitor showing what you have so far, as shown in Figure 5.3.'
