  md: '# PART II Customizing the K Desktop


    # CHAPTER 5 Making the K Desktop Your Own


    and inactive phases of your titlebars here. You can also check the box that prevents
    the bitmap from extending under the titlebar text. For a prettier effect, it''s
    better to go back up to Colors in the Desktop section of the Control Center and
    pick colors for your active and inactive titlebars that contrast with your chosen
    bitmaps. It''s a good idea to accentuate the contrast a little less for the inactive
    titlebar, you''ll be able to tell them apart more easily.


    The Mouse action section lets you decide from a drop list which you would like
    to happen when you double-click the titlebar of an application. The choices are


    +   - Maximize maximizes a windowed application and windows a maximized application.


    +   - Shade rolls an application like a window shade into its titlebar, leaving
    just the titlebar visible. If you have several applications with which you''ve
    done this on your screen, the effect is that of a wallpaper store, with the rolls
    to be pulled out and cut.


    +   - Iconify is a little misleading, because it doesn''t reduce the application
    to an icon. Instead, it disappears and banishes the line remnant of it to the
    taskbar. It minimizes it, the same as if you clicked the little dot button in
    the titlebar, third from the right unless you moved it.


    +   - Sticky renders the application Sticky, which is to say it now appears in
    all virtual desktops, or if it was sticky already, unsticks it, leaving in whatever
    virtual desktop it currently occupies, even if that isn''t where it started.


    +   - Close pretty speaks well for itself. With this selection, double-clicking
    on the titlebar of a running application closes. If it is an application that
    asks for confirmation, confirmation will be sought; otherwise, it''s history,
    same as clicking the X button in the upper-right corner.


    One item remains: Title animation. This ablation slides the title of the program,
    program plus loaded file, anything that it thinks ought to be in the titlebar,
    back and forth across the titlebar in instances where the window is too small
    for the whole title contents to be displayed. It is doubt well-intentioned, but
    it is also very distracting. Don''t believe me? Use the slider to set the speed
    of this animation to a non-zero value and see for yourself. Just remember that
    this is where you can set the value back to 0 to turn it off. You''ll be back.


    That''s for the Control Center and for the greater variety of desktop customizations.
    You should now be well-armed to make the desktop whatever your imagination can
    conceive. Now we''ll see what mischief we can inflict upon the K Menu.'
