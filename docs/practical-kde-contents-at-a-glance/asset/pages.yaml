  md: '# PART III Using the Applications in the KDE Distribution


    # CHAPTER 14 Programs that Make Your Everyday Work Easier


    Modern GUI desktops come with a set of accessory programs that are designed to
    let you learn the new system a little and that are useful in their right. Indeed,
    the base KDE distribution contains a vast array of applets that perform a variety
    of tasks. These include multimedia programs, graphics viewers and editors, archive
    handlers and a tape-backup tool, games, a handful of screen toys, some screen
    utilities, configuration and system information tools, a full Internet suite,
    and a group of programs that ease administration of a local network. Each of these
    categories receives our consideration in its own chapter. This chapter is about
    the basic applications, including some you are likely to use every day (and some,
    depending on the kind of computing you do, you may use every day or or never).
    These are applications that you are likely to add to K Panel for instant access.
    The most fundamental, and essential, of these is a text editor, so that we start
    where we''ll begin.


    # KEdit for Text Files


    If you have ever used a simple text editor under any operating system''s GUI,
    you will have little problem with KEdit. It is, as they say, intuitive in all
    of its major functions and conforms admirably to general KDE standards. If you''ve
    mastered KEdit, you have mastered much in other KDE applications as well. It does
    offer a few nice surprises, though, and we''ll get to them after we''ve gone over
    the basics.


    When you open KEdit for the first time (Applications > Text Editor from the K
    menu), it looks like Figure 14.1.'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# PART III

    KEdit for Text Files CHAPTER 14


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_324_0.png)


