    which is something very unusual among X terminals.


    When I clicked Yes, I returned to the Konsole prompt. To mark text with the mouse,
    drag the cursor over the text to select it. If the application is mouse-aware,
    hold the Shift key as you do so. This is a fine set of arrangements, but just
    the beginning. KFM, you may remember, offers a Super User mode. So does Konsole
    (see Figure 11.5).


