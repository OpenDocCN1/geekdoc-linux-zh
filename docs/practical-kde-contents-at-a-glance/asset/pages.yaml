  md: '# PART III Using the Applications in the KDE Distribution


    # CHAPTER 12 Managing Linux System Functions with KDE


    # KDE''s Desktop Clipboard


    Back in the old days it was not a simple thing to move a small amount of data
    from one program to another. Clipboard programs were memory-resident applets that
    were invoked by a hotkey combination. They were not particularly reliable, often
    got more or less information than you wanted from the source application, and
    pasted weirdly into the target application; the whole thing was usually more trouble
    than it was worth.


    Then came the graphical user interface (GUI), which usually provided a system-wide
    Clipboard that let you copy and paste text from one native application to another
    (The one in OS/2''s later versions would even let you copy and paste graphics.)
    There were various add-ons offered, including programs that would keep more than
    one item in the Clipboard at a time, so you could go back and select something
    you copied or cut for a while.


    Surely you will not be surprised to learn that KDE includes such an application,
    Klipper. Once you start by selecting K Menu > Utilities > Cut & paste history
    (klipper). Once you have started it, you can leave it alone forever. it is swallowed
    by K Panel and restarts when you restart KDE.


    To use it, you click on its icon in K Panel, and produces a little menu (see Figure
    12.13).


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_299_0.png)


    FIGURE 12.13


    Klipper is employed by clicking the K Panel icon. If the icon isn''t there, you
    haven''t started Klipper yet. It lists the items recently cut or copied by any
    application running under KDE.


    Pick an item. It can be a little obscure, and there''s no way to preview the contents.
    It becomes what will be inserted at the cursor location in an application when
    you click Edit > Paste. It works with all KDE applications and many others; some,
    such as Netscape, allow Klipper to receive data copied from the application, but
    will not paste material from Klipper into the application.


    Klipper doesn''t save its contents from session to session, so when you close
    KDE, they''re gone.'
