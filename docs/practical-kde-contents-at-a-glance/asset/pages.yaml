    would. Some had scroll bars that would scroll down if the left mouse button were
    clicked, and if the right mouse button were clicked instead. Others behaved a
    little more conventionally. The commands rendered by menus were different in name
    and behavior, from application to application. What''s more (read "worse"), configuring
    almost everything, from putting an icon on the desktop to changing the background
    color or image, involved editing a sometimes difficult to find and always difficult
    to understand text file. It was possible to make a very attractive graphical desktop
    for Linux, but the true few who could do it were the ones who were comfortable
    with the Linux command line and for them was mostly a stunt. The Linux system
    administrator whose boss had elaborate and mercurial aes-thetic sensibilities
    earned his or her keep.


    As time went, window managers grew in power but not ease of use. The basics—twm,
    the attractive AfterStep, the breathtaking beautiful Enlightenment that was also
    breathtakingly difficult to bend to one''s—but the inconsistencies across applications
    remained. By now, commercial outfits were gathering up all the pieces necessary
