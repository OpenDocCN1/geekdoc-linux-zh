  md: '# Setting Run Levels


    Way back in the introduction to this book, you were shown a terrifying screen
    image (see Figure 1.2 and, that probably made no sense to you, and you were presented
    with an explainer. Here it comes.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_531_0.png)


    FIGURE 25.8


    It''s still scary looking, isn''t it? And it''s true: The SysV Init Editor is
    powerful and, if misused, can bring on wailing, anguish, and a world of hurt.


    As you know, Linux offers a selection of "run levels," which are simply varying
    scripts that start applications or services at boot or when the run level is entered.
    These vary somewhat from distribution to distribution, but typically run level
    1 is single-user mode, run level 3 is multiple-user console mode, run level 5
    is multiple-user graphical mode, and run level 6 reboots the machine. The default
    run level is set in /etc/initab in the lines near the top that look like this:


    # Default runlevel.


    ```

    id:3:initdefault:

    ```


    The number following \id: is the run level your Linux system adopts at boot. What
    this really means is that the scripts to start the particular services and applications
    for run level 3 will run when you boot your machine. Run level 3 is often the
    default.'
  merge: -1
  pgno: 531
- img_proc: true
  md: '# PART V

    Setting Run Levels CHAPTER 25


    # The Right Default Run Level?


    More and more Linux distributions install with a default run level 5, which is
    fine if everything always goes perfectly. Everything goes not, however, always
    goes perfectly.


    Run level is graphical mode: XFree8 is started (or a commercial X window system
    handler, if you''ve bought one of those), and the system boots to a graphical
    login manager, usually xdm or kdm. From there you log on to the machine and are
    directed to your window manager and desktop of choice. This is when all goes well.


    But let''s say you get a new graphics card or that you''ve edited a configuration
    file and now your graphical desktop is, the technical term, screwed up. You''re
    effectively locked out of your machine.


    Were your machine set to boot into run level 3, you could track down the problem
    and fix it. Now you''re largely stuck. You can try booting into single user mode
    (at the LILO prompt press the Tab key to stop the process, then type Linux single,
    press Enter), which may get you in to make repairs. Many people who have counted
    on this method have wished they hadn''t.


    The solution is to boot into run level 3 by default, which means changing the
    line in /etc/initab from


    ```

    id:5:initdefault:


    id:3:initdefault:

    ```


    Boot isn''t quite as pretty, unless you are one of those who finds beauty in watching
    the processes in your machine start. If you''re the system administrator, you
    are probably such a person; if you are not such person, it''s a taste worth cultivating.


    When you use the SysV Init Editor (K Menu > System > SysV Init Editor—you need
    to be root to do this), it looks like what is depicted in Figure 25.9.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_532_0.png)


    Figure 25.9

    Nothing much useful here. Fortunately, you can grab a corner and resize SysV Init
    Editor.


    After you resize it (see Figure 25.10), you can begin to get a sense of what it''s
    all about.'
  merge: -1
