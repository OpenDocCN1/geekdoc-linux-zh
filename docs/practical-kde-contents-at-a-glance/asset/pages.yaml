  md: '# PART III Using the Applications in the KDE Distribution

    CHAPTER 18 Games and Toys


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_409_0.png)


    FIGURE 18.11

    The Expert Level: 480 boxes, 99 bombs.


    The object of the game is to expose every square that doesn''t have a bomb underneath
    it. This is done by clicking the box. If you are lucky, a whole bunch of boxes
    will open. The ones bordering boxes containing bombs have numbers that signify
    how many of those bordering boxes contain bombs. Each box borders eight boxes.
    The ones that touch at the corners count, too. This information is usually sufficient
    to let you figure out which boxes contain bombs. Right-clicking on boxes that
    you know contain bombs mark them with a flag; clicking again marks a box with
    a question mark, in case you''re not sure; clicking again clears it and allows
    you to click the left button on it. Remember: The object isn''t to mark all the
    bombs, it''s to reveal all the boxes that don''t contain bombs.


    You are playing against the clock, as witness the High scores list in the File
    menu. To knock off a previous champion, clear the minesfield quicker than she
    or did.


    If I had the power to make any improvement to this game, I suppose it would be
    for a more spectacular display to take place when you win...and one when you lose.


    396'
