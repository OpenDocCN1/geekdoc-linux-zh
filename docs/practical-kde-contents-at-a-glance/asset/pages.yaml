    # CHAPTER 24 Browsing and Other Things Internet


    # Netscape Navigator and Communicator


    Both Netscape Navigator, the browser, and Netscape Communicator, the suite of
    Internet tools, work well with KDE, but you ought to be aware of a few things.


    The first is that KDE''s Clipboard and Netscape''s do not completely operate.
    If you copy text from a Web page in Netscape, it goes to Klipper very nicely,
    but the transfer is extremely quirky going the other way. I have never found a
    method, for instance, pasting a URL from Kmail into Netscape''s URL text box.
    This seems a minor matter unless, say your sister gives you a birthday present
    and you are informed by email from the vendor, who now wants you to click on the
    very long URL and fill out the form so that it can ship the present to the right
    address. Clicking the URL you take to the page, and in KFM the forms don''t work.
    Trying to stack Netscape and Kmail in such a way as to copy is irritating. You
    can always print the message, open Netscape, and type in the URL, but this is
    the long way around, don''t you agree? The solution would be to make the choice
    of browser started by Kmail configurable, but that is not going to happen, at
    least not in 1.x version of KDE. Some people using particular mice have been able
    to exploit Linux''s capability to paste using the middle mouse button (or both
    buttons of a two button mouse "emulate three buttons" is enabled in Xfree86),
    but others report that this does not work reliably for them.


    The second is that Netscape can behave strangely if in your desktop settings (Display
    Settings > Style) you have checked the box that applies fonts and colors to non-KDE
    applications. This can result in slightly odd unbear weird changes in Netscape''s
    display. For one thing, if you use Netscape for reading newsgroups, the distinction
    between read and unread articles is no longer visible. So if you use Netscape,
    which is free for individual use and which probably came with your KDE distribution,
    make sure that you haven''t checked this box.


