  md: '# PART III

    Kmahjongg CHAPTER 18


    After you''ve selected your planet and your opponents have selected theirs, you
    attack each other until someone has conquered the Universe. For full instructions,
    look at the Help file, which like other KDE help files is at Help > Contents.


    # Kmahjongg


    It wasn''t until I began writing this book that I discovered Kmahjongg and now
    I''m addicted to it. In fact, I''m going to pop out right now to do a little more
    research. See you in an hour or so. Meantime, you can look at Figure 18.7.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_406_0.png)


    FIGURE 18.7

    If there isn''t a program at some clinic to treat Kmahjongg addiction, there ought
    to be.


    Okay, I''m back. The purpose of Kmahjongg is to remove all the tiles from the
    board. You can achieve this by finding two that match and clicking on them, whereupon
    they disappear, but they need to be on the edge to be eligible for selection.
    It can be done (see Figure 18.8).


