  md: '# PART VIII On the Leading Edge with KDE


    # CHAPTER 38 Joining the KDE Developer Network


    Paradoxically, applications as VMware could provide an interesting niche for Linux
    (and KDE). VMware allows developers of Windows applications to run multiple versions
    of interface on one machine at once, which is a real boon for prototyping and
    testing. Because of its various modes, VMware prevents file system corruption
    and offers features that native Windows by itself simply cannot. It won''t be
    long before Windows application developers notice this.


    We have seen Linux distributors make public offerings of stock and suddenly become
    big business. Good for them. I am writing this book—in part—in the hope that it
    will enrich me personally; indeed, in the hope that it and the ones that follow
    will allow me to elevate myself to the extent that money ceases to be a concern
    and I, too, can pursue lector goals. You paid for the book (I, and so does the
    publisher), and you earned it with doing something.


    The vast majority of the people writing the code that led to this book, and to
    the stock offerings, did so for free. A time might just come when they wish that
    some of the wealth being generated by their work accrue to them.


    Perhaps there are new generations of young, hungry code writers, eager to show
    their stuff. Maybe this is how it will all progress. I don''t know. Neither do
    you. We don''t know where we are. This makes it even harder to know where we''re
    going.


    Then again, as we''re paid to do things, develop code or to sort some other aspect
    of computing, we''ll make our tithe, contribute something, be it lines of code
    or online support, whatever, to the common good. We just don''t know, nor do we?


    Once, some years ago, a good friend told me of two neighbors who had a driveway
    in common for much of its length. How he had asked them, did they manage to maintain
    it without dispute? "Easy," he was told. "We do more than our share." I am not
    a preacher—though this book is dedicated to one—but I will sermonize to this extent:
    Find a way in which you can contribute, and then do it.


    # An Apology


    In the course of this book I have criticized, whined, and complained here and
    there. I think those things were justified, but I not for a moment my complaints
    to be taken as criticisms of the people who spent time writing the code. GUI design
    is a tough thing to do. (Writing books is a tough thing to do, and this one has
    its weak points, I''m sure.) But in writing a book, one has a loyalty to a group
    other than the book''s subjects: you, its readers. There is no greater KDE advocate
    in the world than me, but this isn''t a cheerleading book. It''s about how to
    use KDE.


    662'
