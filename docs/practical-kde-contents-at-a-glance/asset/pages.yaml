  md: '# PART VI Using Non-KDE Applications with KDE


    # CHAPTER 29 Using Non-KDE X Window System Applications


    > Finding (Out) What You Need

    Even if a program seems to have installed fairly perfectly, it might not run.
    The first thing you do after installing a program is, of course, open a terminal
    window and type whatever you believe it is that that will start the program. You
    may be surprised at the error messages.


    For instance, you may need to set an environment variable before you run it.

    nYou may discover that Linux does not believe the file exists. This could be because
    it has plopped itself down in a directory off the /etc/profile path. Or it could
    be that you don''t have permission to run it, in which case you as, need to change
    the permissions.


    You may discover that it needs a library that you don''t have.


    Go back to the place where you downloaded the program. If you obtained it from
    a general repository of Linux programs, next to the file you grabbed is very likely
    a file with the extension .ism. Click on it. It is the Linux Software Map file,
    a text file, and it will be displayed on your browser or in a text editor spawned
    by your browser (KFM does the latter). It may well list the packages required
    for the application to work.


    If you acquired it from its author, the page that had the original file may contain
    the needed libraries or links to them. Or it may contain something else: the program
    in binary form, statically linked.


    What does statically linked mean? It means that it includes everything it needs
    from whatever libraries it calls upon. It also means that the program is somewhat
    bigger and uses somewhat more memory. It will not be as big as the program plus
    the libraries, though, if you''re short of storage space, you will not necessarily
    rule out statically linked programs: They may save you space in the long run.
    (Of course, if you have a dozen programs statically linked to the same libraries,
    you are wasting drive space and memory.) The opposite of a statically linked program
    is a dynamically linked one, which shares libraries with other applications.


    If none of this works—there are neither links, nor static binaries, nor useful
    .ism entries—you can always read the README file that was probably included with
    the program. (You should read this first, but for some few people do do.) Also,
    the name of the program may prove helpful. The dainty little KFMail program, for
    instance, announces by its name that it uses XForms; Xisp, the fine Internet dialer,
    less so. Of course, you have Kmail and Kppp anyway.


    If all else fails, you can ask on a mailing list or newsgroup. You will find the
    answer.


    564'
