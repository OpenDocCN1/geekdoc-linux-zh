    on your point of view) would have liked. If you used it to develop commercial
    applications, you were expected to pay for it. It was free only if you used it
    to develop free software. The solution became so famous that some distributors
    refused to have any-thing to do with it. In the Gnome development effort said
    that the QT license proved the inherent superiority of their product (which still
    isn''t as stable as KDE, though it is quite pretty).


    In course, the “Trolls,” as they are called, came up with something called the
    QPL license, a document that assures QT will remain available for free software
    development. This calmed things considerably, though the Trolls and the Gnomes
    can be heard ever now grumbling and muttering about it. Rumplestiltskin remained
    silent on the topic.


