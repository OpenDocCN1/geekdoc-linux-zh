  md: '# PART III Using the Applications in the KDE Distribution

    CHAPTER 19 A World of Other KDE Applications


    The KDE distribution is by no means the whole show when it comes to KDE applications.
    This chapter pauses to survey some of what is available, bearing in mind that
    it is just a snapshot. By the time you read this, some applications may have been
    dropped, while others will have been combined and others added. Some of these
    applications are redundant, while others are unique.


    The best way to find out what''s available is to look in the Applications section
    at http://www.kde.org. Some of the applications listed there on the KDE ftp site
    (http://ftp.kde.org/pub/kde and its mirrors), and there are links for those that
    aren''t.


    If, for instance, you a CD reader capable of writing, you will find several CD
    burners on the KDE ftp site. If games are your reason for living, you''ll find
    a multitude of them.


    Several of the applications already mentioned KPackage, some of the multimedia
    stuff, kdu, among others) were obtained here. By the time you read this, new versions
    will be available. I mention several more in this chapter, and one, KLyX, has
    its own chapter.


    SEE ALSO


    +   > To learn more about KLyX, see Chapter 20, "KLyX: The Paradoxical Processor
    of Complex Documents," on page 425.


    > About KOffice

    You cannot be around KDE for very long without hearing something called KOffice.
    It is true that a group of crack code writers at kde.org have been at for years
    fashioning and improving software of that name.

    TheOffice suite was in fact developed for a long time under KDE 1 X; but in the
    spring of 1999 development efforts were moved to the KDE 2.0 project. The libraries
    involved with version 2.0 and some other new features were better suited to the
    kind of data interchangeability that the designers had in mind.

    What this means is that there isnt, and probably never will be, a KOffice suite
    for KDE 1.1.1 or 1.2. Fortunately, other suites run well with KDE


    What follows, is a listing of few of the many KDE applications that are available.
    Bear in mind that KDE developers, like many Linux developers, hold to the "release
    early and often" philosophy. This means that an application will likely be released
    for testing and peer review as soon as a fundamental design is settled on and
    the major features work, at least some extent. If you are accustomed to commercial
    software, this can evoke emotions ranging from puzzlement to terror. Relax KDE
    applications, like most Linux applications, invite you in a constant state of
    development. Indeed, by its very nature Linux software invites you, the user,
    to make improvements to the code and release your code to the world.


    412'
  merge: -1
