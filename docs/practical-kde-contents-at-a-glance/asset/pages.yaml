    ![](img/4a2883756c73e7b0696dbbd721c5c7db_452_0.png)


    #  1 Navigating the Document


    Welcome to KLyX!

    to make it easier to answer your questions and describe all of the functions of
    KLyX, the documentation has been split into several different files. Each file
    has its own purpose, as described below. Before you go through any of them, you
    should read this one first, which contains a lot of useful information and commentary
    that can save you some time.


    > WARNING WARNING WARNING

    Don''t ignore this.


    The documentation, as a whole, is incomplete at the moment! Please consider the
    docs as beta.

    Also please let us know if anything in these manuals confuses you, is unclear,
    or wrong; don''t hesitate to let us know. You can reach the KLyX team at the developers''
    mailing list at "klyx@example.org". Please put the words "KLyX Docs: [something]"
    in the subject line. Thanks!


    #  2 The Format of the Manuals


    KLyX:http://sharepages/klyxdoc/intro.pdf


    FIGURE 20.14

    The extensive documentation provides a clear path for those willing to make the
    commitment necessary to

    LyX.


    Should you learn KLyX? It depends entirely on your needs. If you submit papers
    to scholarly journals that require TeX format, the choice is made for you. If
    you are intrigued by a completely different way of looking at text processing,
    KLyX will keep you amazed for many a day, night, and weekend. Just sorting out
    the Document layout dialog box (see Figure 20.15) can take many hours, if true
    proficiency is the goal.


    439'
