    # Copying Distant Files: KFM for FTP


    As you''ve seen, you can jump to any place on your local device by typing file:
    followed by the fully qualified pathname in the Location text box beneath the
    toolbar in KFM.


    > Moving KFM''s Elements Around

    The Location text box, the menubar, and the toolbar all float; you can move them
    around the KFM window using the scrollbar at the left. Click it and, holding the
    mouse button down, drag it to wherever you want. The Location text box and the
    toolbar dock the left side of the window vertically. This is practical for the
    toolbar and impractical for the Location text box. Feel free to experiment. The
    changes don''t become permanent unless you click Options > Save settings. You
    can drag them outside the KFM window, but this is a very bad idea because it will
    cause clutter and confusion later if you save them.


    You can do much the same thing, if you are online, on distant drives. And thus
    you gain the beauty and simplicity of KFM for FTP.


    Try this: Go online. Open KFM. In the Location text box, type ftp://ftp.kde.org
    and press Enter. In a few seconds (unless the server is full, in which case you
    will receive an error that says your password is no good, which actually has nothing
    to do with it), you''ll see the contents of the KDE Organization''s FTP site.
    Click on the "pub" directory icon. Now you can explore.


    Notice the look of the icons. Some look like text files on your local drive. Click
    on one, and pretty you''ll have your local Kedit with the contents of the remote
    file.


    Now, for fun, this: Drag open the tree view in KFM if you haven''t enabled it
    by default. Select a directory where you''ll be willing to receive a file. (Your
    home directory will do if you have no dedicated download directory.) As you explore,
    you''ll find a program that interests you. Drag it over to the directory on your
    local drive that you''ve decided will work for downloads. Release the button.


    The online KFM view varies depending on whether the site is arrived at HTTP or
    FTP (see Figures 10.11 and 10.12)


