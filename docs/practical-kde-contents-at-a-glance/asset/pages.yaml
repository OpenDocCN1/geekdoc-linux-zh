  md: '# PART VII Programs that Extend the Power of KDE

    CHAPTER 34 Two Non-KDE Programs You Must Have


    # # Midnight Commander


    Running Linux without having Midnight Commander installed is walking a tightrope
    without a net. It is such an essential program that KDE''s Konsole actually lists
    it as a menu item. But it is at the command line where it will rescue you in time
    of need.


    First thing, let''s find out whether you already have it installed. Open a terminal
    window and, at the prompt, type me and press Enter. If it''s installed, you will
    see what is shown in Figure 34.4.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_635_0.png)


    Figure 34.4

    I haven''t memorized the Linux file manipulation command-line options, which few
    people know. It doesn''t hurt to learn them, unless you use them all the time
    it''s difficult to maintain proficiency. I certainly don''t.


    Midnight Commander offers a command line at the next line to the bottom of its
    screen, but it gives it power. The numbers are for function keys on your keyboard,
    to exit you press F10 instead of typing F10. If you have gpm installed for console-mode
    mouse support, Midnight Commander utilizes point-and-click even in a pure console.
    Not, if you use the arrow keys and the Enter key to navigate, and the Tab key
    to switch from one side to the other.


    When you need Midnight Commander? One area where I use it all the time is in making
    a backup of KDE when I''m upgrading. As root, I copy every KDE directory to a
    nice, safe place elsewhere. If the upgrade blows up, sometimes


