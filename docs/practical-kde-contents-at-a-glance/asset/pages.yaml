  md: '# PART III

    Appointment Handling CHAPTER 13


    Printing (see Figure 13.12) lets you set some options for the making of hard copies
    of your calendar. Like many of the KOrganizer configuration pages, this one, too,
    is nonstandard, which is in part a good thing. It lets you a paper size that is
    remembered from session to session and does not default to A4. You can choose
    which print spooler to use, and you can specify a preview program (as gv) if you
    like. If you don''t know, that File > Print Preview does not work.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_310_0.png)


    FIGURE 13.12

    Paper Orientation is grayed out in the Printing menu because the shape of the
    window automatically determines the orientation.


    From all that, you should be able to cobble together a configuration that is suited
    to your way of working.


    A few menu options are worthy of your attention, if only to prevent confusion.
    In the File menu we are Import from Ical, which brings existing calendars created
    using the Linux Ical program into the current calendar, and Merge Calendar, which
    joins your choice of the calendar files in your ~/ directory with the current
    calendar. This is especially useful when KOrganizer is used as groupware.


    **Actions > Mail Appointment** sends a copy of a specific appointment, with all
    its details, to any participants in that appointment for whom you have email addresses.
    This is how how you can set up KOrganizer to contact the florist and restaurant,
    although it would probably be easier to just dial the phone yourself.


    # Appointment Handling


