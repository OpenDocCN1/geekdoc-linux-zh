  md: '# PART VI

    VMware: The Bad Stuff CHAPTER 32


    Depending on how elaborate you want to get into configuring the thing, it is possible
    to create a “network” from your VMware “machine” to the rest of your Linux system.
    Otherwise, to move data from the VMware system to the Linux system involves copying
