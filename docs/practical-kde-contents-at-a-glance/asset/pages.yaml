  md: '# PART VI Using Non-KDE Applications with KDE

    CHAPTER 31 Using DOS Applications Under KDE with dosemu


    There is a possibility, even a likelihood, that you''re a refugee from the DOSrivative
    world, there is a DOS application, maybe two, that you really wish you could run
    under Linux and KDE.


    Well, through a program called dosemu, you can.


    This chapter does not dive into the vagaries of dosemu. In fact, we won''t ever
    get our toes wet. Suffice to say that when properly set up, dosemu can run just
    like any DOS application (indeed, there are those who have gotten OS/2''s version
    of Windows 3, Win-OS/2, to run well under dosemu). Instead, we''ll discuss how
    you can set applications in dosemu to work seamlessly under KDE.


    To start dosemu in a terminal, you type dos and press Enter. The result (see Figure
    31.1) is a DOS command prompt.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_601_0.png)


    FIGURE 31.1

    Theosemu command prompt looks just like the one you''ve used in other operating
    systems and accepts the same commands. The version that shipped with Caldera OpenLinux
    2.2, shown here, includes Caldera''s excellent improvement on plain old DOS.


    It is, of course, a simple thing to create a link that automatically starts dosemu.
    You simply open KMenuEdit and create a new menu entry, as shown in Figure 31.2.'
