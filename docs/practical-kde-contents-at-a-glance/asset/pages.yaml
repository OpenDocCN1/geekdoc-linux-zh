    > ### Don''t Go Hogwild!

    Try to be a little restrained when setting widget colors. If you set the Background
    to black or white, you''ll end up with a desktop that is all but unusable. If
    you pick loud, garish colors, you''ll end each day with a headache (though I know
    someone, otherwise sane, who uses purples and greens exclusively, together on
    the same big screen). Remember, you will have to live with it!


    When you''ve made all your changes, click Apply, and if you still like what you''ve
    done, click OK.


