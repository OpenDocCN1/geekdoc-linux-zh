  md: '# PART I Installation

    CHAPTER 1 Installing KDE


    more: you will have access to applications for which no prebuilt binaries exist.
    You will have access to the newest stuff: there''s always a lag time of a few
    days a few weeks before somebody takes the not inconsiderable trouble of putting
    together RPMs and DEBs. When you compile your own programs, you can make changes
    to cause the results especially to suit your system. You can also apply patches
    that fix annoying bugs without waiting for a whole new version and actually alter
    the code to fit the way you work. It''s not difficult, either. Now much would
    you pay? Well, it''s all free!


    In fact, there''s every likelihood that when you installed Linux you also installed
    all about that you''ll need to compile KDE, and if not, most of the things you
    will need on your Linux CD:


    +   - EGCS—The current C and C++ compiler. Later versions of GCC will work, though,
    EGCS is recommended. If you haven''t already, install every EGCS package on your
    distribution CD except those that have "static" in their names because you don''t
    need them. (They make "statically linked" binaries that are bigger and slower.
    You don''t need them unless you are building KDE for use on a machine that doesn''t
    have enough of Linux installed to make it very useful at all.)

    - AUTOCONF—The automatic configuration utility.

    - AUTOMAKE—The utility that automates of the compilation.


    These items aren''t KDE-specific. You''ll need them to compile just about anything.
    There are of, some things you need just for KDE:


    +   - QT-1.44—These are the QT libraries on which KDE is built. You can get QT
    as source code, but this is one instance where downloading the compiled version,
    as well as the development QT-devel, from your Linux distributor is a good idea.
    While much of the QT distribution is primarily of interest to developers, it makes
    good sense to get the full package because you are likely one day to be interested
    in using, say, Kdevelop. Make sure to get QT-1.44. Although QT-2.0 has been released
    and will be the basis for KDE 2.0, it is incompatible with KDE 1.X. The source
    contains all of QT, but you need to download individual files if you got compiled
    binaries. The binary files you want are:

    - qt-144

    - qt-devel-1.44—Necessary if you''re compiling KDE

    - qt-doc-html-1.44—Necessary if you do any development

    - qt-examples-1.44—Unnecessary but useful


