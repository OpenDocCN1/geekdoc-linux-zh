    # New Mail Notification: KBiff and Korn


    Two little mail utilities are part of the core KDE distribution whose purpose
    is to let you know that you have new mail. The casual user, who logs on to the
    Internet through an ISP via a dial-up connection, may wonder what they are. After
    all, when you open Kmail and download the mail, you can see easily enough whether
    you have any. If you have Kmail set to check for mail at intervals, there''s every
    likelihood that you will check to see whether anything new has arrived before
    you log off. Even if you don''t, Kmail will have gathered it anyway.


    True.


    But your ISP mailbox may not be the only place you check. For instance, your system
    may send you to let you know about certain system events (one case that


    504'
