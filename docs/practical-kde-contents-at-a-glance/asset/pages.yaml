  md: '# PART III Using the Applications in the KDE Distribution


    # CHAPTER 12 Managing Linux System Functions with KDE


    Any Linux user is aware of, if not necessarily in love with, the fact that a multitude
    of processes take place in the mysterious dark recesses of the system. Each is
    understood by someone but few, if any. Most involve the use of alchemy and ingenuity
    to produce scripts or configuration files. A working system is not to be tampered
    with (unless it is set up for the purpose of tampering with it), and a non-working
    system can be as impenetrable as the great questions of the ages.


    > The Linux Nine-Hour Rule Has Been Repealed!

    I used to believe that all Linux problems, large and small, require exactly nine
    hours to resolve, and from this formulated the Linux Nine-Hour Rule, which says
    exactly that: With the new generation of Linux distributions, the Nine-Hour Rule
    is no longer in effect. It has been replaced by the "I don''t know; I just did
    some stuff and then it worked.


    In an effort to demystify some of Linux''s esoteric inner workings, the developers
    built front ends for a number of functions and processes. These do not so much
    those processes and functions work to begin with as make them easier, once working,
    to use and monitor. This chapter is about these KDE applications.


    # Keeping Track of Virtual Desktops with Kpager


    As we have discussed, KDE joins window managers and desktops in offering multiple
    "virtual" desktops, which allow you to spread your applications over a much wider
    area than the borders of your screen. You can run from two to eight of these desktops,
    which you typically access by clicking the K Panel buttons corresponding to each
    of them.


    SEE ALSO


    +   Actually, you can have as many as 32 virtual desktops. To find out see "When
    Eight is Not Enough" on page 123.


    Unlike most window manager/desktop combinations, the buttons do not try to display
    the applications that are running in each desktop. If you have eight virtual desktops
    and Netscape is running in desktop five and you forget where it is, you can poke
    around among these buttons for a while before finding it. KDE''s effort to solve
    this problem is Kpager, which you''ll find in K Menu > System > Desktop Pager
    (see Figure 12.1).'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# PART III

    Keeping Track of Virtual Desktops with Kpager CHAPTER 12


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_286_0.png)


    FIGURE 12.1

    Kpager, showing four virtual desktops and the Global desktop. The latter displays
    all applications that are "sticky," which is to say that they have been set to
    appear on all desktops. In this case, the one sticky app is Kpager, which has
    been stretched to abnormal size for easy viewing. StarOffice is running in the
    first desktop and Netscape in the second, as signified by their icons. If more
    applications were running in any desktop, all their icons would be displayed.


    Kpager is smarter than it looks. You can set (see Figure 12.2) to show the Global
    desktop or not, to show its own menubar or not, to display the virtual desktops
    in one row or two. You can also set it to vary its display from icons to a plain
    view, which gives the shape of the running applications in each window, to a pixmap
    view, which attempts to make thumbnail renderings of the running applications,
