    FIGURE 24.2

    If Caitoo doesn''t look like this when you start, grab the edges with your mouse
    and stretch it out until it does.


    What does Caitoo do for you? A lot, actually. If, for instance, you''re seeking
    to download a huge file and don''t get it all in one whack, upon the next connection
    Caitoo will interrogate the server to learn if resuming the download where you
    left off is possible, as it often is. You can then pick up where you left off,
    rather than starting all over again. You can also use it to schedule file transfers
    in the middle of the night. You can set it to make a transfer and log you off.
    You can set it to download-different file extensions to different directories
    automatically. It is one cool tool.


    It is also well documented, for very specialized configurations. For most purposes,
    though, what follows will be sufficient to get you working productively with Caitoo.


    The fundamental use of Caitoo is this: Log on to the ftp site using, say, KFM.
    Select the files you want and drag them, either individually or in a group, to
    the Caitoo window (see Figure 24.3).'
