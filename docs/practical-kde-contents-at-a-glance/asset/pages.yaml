  md: '# PART III Using the Applications in the KDE Distribution

    CHAPTER 19 A World of Other KDE Applications


    # Multimedia Applications


    KDE programmers tend to be young and enthusiastic people who spend a lot of time
    slaving away over a hot computer, so it’s no surprise that they have developed
    a number of applications that let amuse themselves with music and other multimedia.
    Several multimedia applications are mentioned in Chapter 15, "Multimedia and Movies,"
    and I’ll not go over them again here. Instead, I’ll introduce a few more.


    # Krabber


    One application that has a lot of buzz in KDE circles is Krubber (see Figure 19.4).


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_429_0.png)


    FIGURE 19.4 Krubber grabs audio tracks, converts audio tracks, and burns audio
    tracks onto CDs if you have a CD writer.


    Besides being nicely designed, Krubber is quite versatile. If you are interested
    in the manipulation of audio files, it’s well worth the download from the KDE
    ftp site mentioned earlier.


    # KRecord


    KRecord (see Figure 19.5) lets you record to memory or a .wav file sounds from
    any source supported by the Sound Mixer Panel, one of the KDE core applications
    to which it is linked by a menu.


    416'
  merge: -1
  pgno: 429
- img_proc: true
  md: '# PART III


    # Multimedia Applications CHAPTER 19


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_430_0.png)


    FIGURE 19.5


    You can use the KDE Sound Mixer Panel to blend sounds that are saved by KRecord.


    If you have a little jingle or something that you would like to make into a system
    sound, KRecord is where you can do it. You can also record your own voice (or
    someone else''s voice) as a .wave, and tie it to an or use it in any other way
    you can use a .wav file. You can find KRecord at www.in-berlin.de/User/kraxel/krecord.html.


    # aRTs


    If you like to make your own music, you might want to check out aRTs, which stands
    for analog real-time synthesizer. It''s at arts.linuxbox.com/.


    # KmodBox


    Another popular tool for manipulating audio files is KModBox, by the author of
    aKTion. Both are available from www.geocities.com/SiliconValley/Haven/3864/mainframes.html.


    # KHDRec


    If you are really serious about sound recording, KHDRec makes digital recordings
    to a hard drive, as is used in most state-of-the-art sound studios. This thing
    is a sight to behold. Behold (and download) it at verona.phys.chemie.tu-muenchen.de/people/lorenz/khdrec/


    417'
