    When you have a configuration done, you click the Power On button and watch what
    looks for all the world like your computer''s Power-On Self Test (see Figure 32.3).


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_610_0.png)


    FIGURE 32.3

    You can watch it check the memory it is taking from your Linux system and the
    rest of the boot process.


    It''s an amusing exercise, especially when Windows crashes and you use the Power
    On button, now the Power Off button, to “reboot.”


    To set the whole thing up, you need to download VMware, its tools, and a key that
    unlocks the whole affair. You get to try it out for 30 days for free. After you
    install VMware, you install the operating system of your choice on the virtual
    machine it has created. Then you can use “machine” to install and run your Windows
    software.


    VMware installs a daemon that starts itself when you boot Linux, so it''s taking
    some memory even when you''re not running VMware. But does it do what it is advertised
    to do, and seeing the famous “blue screen of death” in a window with your Linux
    system happily churning right along, is something to behold. The question is whether
    it is worth the cost in memory and system resources.


    To run its sessions full screen with acceptable performance, you also need to
    install VMware''s replacement for your XF86 server.


    If you decide that it might be for you, you can install any number of operating
    systems to run under it. Because my lone Windows 95 CD had no boot disk with it,
    I had to install DOS and CD drivers, and then I could get to the Windows 95 setup
    program, but it was interesting, as you can can imagine (see Figure 32.4).


