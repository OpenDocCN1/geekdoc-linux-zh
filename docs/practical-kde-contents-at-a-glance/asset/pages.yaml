  merge: -1
  pgno: 574
- img_proc: true
  md: '# PART VI Using Non-KDE Applications with KDE


    # CHAPTER 29 Using Non-KDE X Window System Applications


    The question is asked all the time: Will my Gnome/XForms/Tk/whatever application
    run under KDE?


    The answer is yes, well, a conditional yes.


    If you have the libraries and supporting files necessary to compile the program
    or to run the binary, it will run as well in KDE as it does anywhere else. How
    can you tell? Well, if you download a compiled binary in RPM form and, when you
    use the RPM command (or KPackage) to install it, it returns no errors, the chances
    are excellent that it will work perfectly well. If, on the other hand, you get
    dependency errors, you''d make best note of them if the program is important to
    you because you have some downloading to do.


    Also, if you compile from source and get configure or build errors due to the
    lack of a particular file, you need to get and install the package of that file
    is part.


    > Error Messages During Compilation

    I would like to go on record here and now in condemning the sorry state of error
    messages during compilation. It''s all well and good if foobar.h can''t be found,
    but it''s cruel punishment to make you searching for it without any idea as to
    what package contains foobar.h. If a program requires something not universal
    to Linux distributions, the application developer should say so and tell the prospective
    user where to find it.


    Having said all that that, it''s the rare application indeed that cannot be made
    to run under KDE. Exhibit One is Figure 29.1.'
  merge: -1
  pgno: 575
- img_proc: true
  md: '# PART VI Application Options: When Static is Good CHAPTER 29


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_576_0.png)


    FIGURE 29.1

    Clockwise from top left: Nedit, Xcalc, Plan, Grok, and at center, AbiWord. None
    is KDE-native, but all run perfectly well under KDE.


    There are some considerations, of course. Some of these applications make use
    of the KDE Clipboard, whereas others don''t. Some use it in one direction but
    not the other. In many cases, KDE restores its own applications following an intentional
    or unintentional shutdown. We will not do this for non-KDE applications.


    But getting them running in the first place can be a bit of trouble if you believe
    you can just download them, unpack them, and fire away.


    # Application Options: When Static Is Good


    As I mentioned previously, you have several ways of making applications that are
    not KDE-native work under KDE. These include tracking down and installing supporting
    libraries, but you may have a way around this.


    If you are getting compiled binaries from the publisher of the program, be it
    an individual or an organization, and if the binaries just won''t work due to
    the lack of a library or two, you needn''t necessarily looking for the libraries.


    563'
