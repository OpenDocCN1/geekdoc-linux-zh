  md: '# PART II Customizing the K Desktop


    # CHAPTER 9 Working with Themes


    It is necessary at the start of this chapter to admit a prejudice: though they
    can be attractive, I think desktop themes are pretty much a waste of time. Eye
    candy. A coat of paint. Window dressing, literally. I shall, however, devote myself
    heart and soul to aside this opinion and treat them as if they were practical,
    but they''re not. And surely the most ardent devotee of themes would admit that
    they are essential in any way to the proper functioning of KDE or any of its applications.
    In short, if you want to skip over this chapter until some rainy weekend when
    you are bored and want to play around your desktop, you''ll lose nothing doing
    so.


    # Okay, So What Exactly Are Themes?


    Remember in Chapter 2, “Starting KDE,” when we looked at the settings whereby
    widgets would behave in the manner of Windows 95 (some, of the manner of Windows
    95, anyway?) And we discussed how there could be a menubar across the top of the
    screen that would reflect the menu choices of whatever application had focus in
    the current session, a la Mac OS? Themes are like those choices on megadodes of
    steroids. They are graphics, configuration files, and sometimes as well, designed
    to impart a certain look and feel to your KDE desktop. In some cases they provide
    relatively accurate emulations of other desktops and operating systems, while
    in others they are where talented and not-so-talented designers give binary voice
    to their flights of fancy.


    # A Program for Automating Theme Selection: kthememgr


    Under ideal circumstances, changing a theme would be no more difficult than changing,
    the desktop bitmap. In KDE 1.x this is close to being realized, but not quite.
    Some Linux distributors using KDE as their default desktop did bundle software
    to make theme changing easier and a few sample themes as well, theme handling
    up and including KDE 1.1.1 was abysmal, unless you downloaded and built a KDE
    program, kthememgr, to assist you. kthememgr seems to have been withdrawn from
    availability for individual download, although it is included in KDE 1.2. Fortunately,
    at least a few distributions include kthememgr. How do you tell? Follow this procedure:
    K Menu > KDE Control Center > Desktop. If you find an entry called Theme Manager
    (see Figure 9.1), you''re among the fortunate. Or not.


    212'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# A Program for Automating Theme Selection: khememgr CHAPTER 9


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_226_0.png)


    FIGURE 9.1

    If you see Theme Manager under Desktop, you have installed already. Lucky you!


    > K not K Theme Manager,

    If all this confusion weren''t bad enough, there is another program, K Theme Manager,
    at www.kde.org in the download section. Its exact whereabouts depend on version
    and stability. The problem is that it doesn''t really manage themes. You can''t
    select a theme and install it all of a piece. I am not clear just what the developer
    of this program has in mind. The name suggests that theme management figures are
    there someplace. You can download and build it if you want—it''s not difficult—but
    it won''t anything for you that you can''t do better through the Control Panel.


    Then there is another problem: The one version of khememgr that did work for KDE-1.1.1
    contained a bug that kept it from compiling properly. If you have found this file
    somewhere (its name is khememgr.tar.gz), extracted it in /usr/local/src, and tried
    to compile it and failed—as you surely will—here''s how to fix it.


    213'
