  md: '# PART VII Programs to Extend the Power of KDE


    # CHAPTER 34 Two Non-KDE Programs You Must Have


    You need to learn two things right now. The first is that if you are the luckiest
    person in the world you will never be in a situation where you need to resort
    to Linux''s console mode to solve some problem. The second is that you are not
    the luckiest person in the world.


    Console mode does no good if you don''t have a couple of essential programs that
    allow you to fix things that may be broken. They are a good text editor with which
    you are totally proficient and Midnight Commander, the console file manager.


    There will be a few illustrations in this chapter, but they won''t be entirely
    accurate. In order to make the screenshots, it''s necessary to run the programs
    in a terminal window, but when you have to resort to these programs, it will be
    in a full-screen, text-mode console session. Things won''t be quite as pretty,
    and you will likely be under considerable stress. It''s important that you already
    know how to use these applications. Take a little time to learn them. The GUI
    proponents notwithstanding, text mode is not a mysterious and terrible place.
    You''ll be surprised at just how comfortable and easy it is to use the console
    can be.


    # A Good Text Editor


    If you are very dedicated, you will learn a program called vi. It is a text editor.
    Many people love it, and (I suspect) even more hate it. It is not intuitive and
    easy to use. Everyone agrees on one thing that vi has in its favor: it is installed
    on just about every Linux machine in the world (the lone exception that I know
    about my production machine). If you are in a position where you will be helping
    others with their Linux installations, you have no choice other than to learn
    vi because sooner or later you will need to use it. If you have the time, the
    thing to do is learn vi. (And if you know someone who is a vi whiz, have that
    person over, pay for the pizza and beer, and get a vi lesson. It''s probably the
    best way to learn it.)


    Are alternatives to vi? You betcha!


    After vi, the text editor is probably most commonly found on Linux machines is
    pico. It is the editor typically used in the pine mode mail program and is even
    included in some pine packages. There is a good chance that you already have pico
    installed. To find out, open a console window, type pico, and press Enter. If
    it''s there, you''ll see what you see in Figure 34.1. If you don''t, log on to
    www.freshmeat.org and do a search for the current version, download and install
    it, and be happy.'
  merge: -1
  pgno: 631
- img_proc: true
  md: '# PART VII

    A Good Text Editor CHAPTER 34


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_632_0.png)


    # ### 34.1


    if you used computer BBS systems back in the good old days, you probably remember
    this interface because pico was the message editor on many of them.


    Using pico is pretty simple. To edit a file, simply type **pico** followed by
    the filename (fully qualified if you''re not in the directory containing the file)
    and press **Enter**. If you are editing a system configuration file, which is
    what you''ll be doing when you resort to **it** for emergency use, chances are
    you''ll need to log in as root (or su root) first because otherwise you won''t
    be able to save the changes you make. This is something obvious now, but easily
    overlooked in time panic. How might you use pico in an emergency? Well, you might
    have just upgraded your kernel but forgotten to add the new kernel to /etc/lilo.conf
    and run /sbin. So you boot into single user mode to make the repair (Consult Figure
    34.2). (Consult your Linux distribution''s documentation for the means of booting
    in single-user mode. Often, it''s typing **linux-single** at the boot prompt at
    startup.)'
