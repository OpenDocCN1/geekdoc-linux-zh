    # WordPerfect


    If the dinosaurs had computers and sent letters to each other, they would have
    used WordPerfect to write them. WordPerfect, it seems, has been around forever,
    and as has the UNIX version of the venerable word processor.


    It is impossible, it seems, to use WordPerfect without developing a very strong
    opinion of it. It inspires tremendous affection...or tremendous hatred. It is
    certainly very powerful and depending on something...or genetic?) as a result
    of upbringing?) it is either easy to use and intuitive or difficult to use and
    impossibly inscrutable. WordPerfect does not do things the same way as other word
    processors files. It never has.


    Like AppixWare, WordPerfect at startup spawns two windows (see Figure 30.16).


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_596_0.png)


