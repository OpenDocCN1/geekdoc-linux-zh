- img_proc: true
  md: '# Ark: Archive Builder and Extractor CHAPTER 17


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_392_0.png)


    # Figure 7.7


    After creating an archive, simply drag the things you want to bundle up—in this
    case one old directory I''ll probably never need again—to the archive. Poof! They''re
    in the archive.


    +   1. Click File > New.

    2. In the standard KDE file dialog box, give the new file name. Its extension
    determines what kind of file is produced. (In this case, saving it with a .tar.gz
    extension produces a gzipped tarball of 16,835 bytes, whereas saving it as a .tar.bz2
    makes a file of 14,303 bytes. The original directory, by the way, was 57,743 bytes
    in size.)

    3. Drag the directory to be archived to the archive window.

    4. Click File > Close.


    That''s it! I can delete the old directory and recover the disk space it''s consuming,
    but if I discover I''ve broken something, I can open the file to restore it. (Of
    course, in that this was a bunch of old KDE configuration files, it''s possible
    though not likely that I''ve taken away something that will prevent KDE from opening.
    There are a few console prompt commands that a person should know, and tar xvfz
    filename is one of them.)


    But wait, there''s more. If you click File > Extract To, you get the dialog box
    shown in Figure 17.8.


