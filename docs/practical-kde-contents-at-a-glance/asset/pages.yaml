    # Other Console Things You Should Know


    Albert Einstein supposedly remarked that he never memorized anything that he

    find in a book. I do not know that he ever said this, but if he did it was not
    the

    brightest of observations: instead of remembering the information, he had to

    remember the book in which the information was located. There are times when you

    don''t want to go poking around in books looking for a command line option that
    will

    get you out of the trouble that you have just created for yourself. There are
    a few

    command-line commands and options that it is a very good idea for to memo-

    ize. Each of these command-line utilities has a man page, so if you remember the

