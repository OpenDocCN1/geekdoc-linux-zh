- img_proc: true
  md: '# PART III Using the Applications in the KDE Distribution

    CHAPTER 17 Manipulating File Archives and Backing Up Your Drive


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_393_0.png)


    FIGURE 17.8


    You can extract an archive to any location to which you have access.


    The Extract dialog box offers a selection of possibilities. You can, of course,
    specify a target for the extracted files, but you can also choose to preserve
    the permissions of the files that are extracted. This can be crucial if you''ve
    backed up a directory of scripts and other executable files and some of the other
    strange files to which root has access. You can force the filenames to lowercase.
    Apparently, some operating systems believe that filenames carry more weight when
    they are SHOUTED. Linux doesn’t. This option, then, is useful if you’re opening
    a zipfile of data from someone less enlightened yourself. But wait...there’s still
    more. You can choose to extract the entire archive, or a selected file, or all
    files of a particular type. Robert Palmbos, the author of ark, wrote a right daddy
    little here.


    The Options menu has a couple of tricks to offer, too. Chances are that you have
    one directory where you keep the archives you’ve downloaded and now, the ones
    you make. Options > Set Archive Directory lets you point to that directory. Then
    when you click the little house icon in the toolbar, you will be taken to that
    directory, making less navigation necessary when you want to open or create an
    archive. There’s no need to change the TAR executable file, so you can leave that
    item alone.

    Options > File Adding Options gives you the little dialog box shown in Figure
    17.9.


    380'
