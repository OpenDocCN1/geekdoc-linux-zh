  md: '# PART IV Going Online with KDE

    CHAPTER 24 Browsing and Other Things Internet


    The majority of things people do on the Internet and more specifically the World
    Wide Web doesn''t involve email or reading newsgroups. They “browse” the Web in
    search of information of one sort or another, or in search of files and software.
    Sometimes they have little chat sessions with each other.


    These things are all possible with native KDE applications.


    # Browsing Under KDE


    As noted in Chapter 10, “Navigating Everything with KFM,” KFM can work as a Web
    browser. When you click on a URL in Kmail, for instance, it is Kmail that opens
    and displays the referenced page. There are those who quite reasonably wish it
    were possible to call a different browser, such as Netscape Navigator, instead,
    but it isn''t. Whether this will change at some point in the future is unknown.
    What is known is that of KDE 2.0, KFM is put to rest, replaced by something different.
    If you are browsing with KFM and clicking on a mailto link, Kmail opens whether
    it is your mailer of choice or not. This, too, cannot be changed without diving
    into the code and doing some hacking that is beyond the scope of this book (and
    the author’s abilities).


    This is not to say that KFM is a terrible browser because it isn''t. However,
    it does lack some features to which you may have become accustomed (and in some
    cases accustomed to swearing at). Java implementation is basically nonexistent.
    Handling of forms is terrible when it works at all. Badly written HTML pages are
    shown with all their shortcomings in KFM; very badly written ones may not show
    up at all.


    But for the wider variety of Web pages, KFM works just fine. To get to a page,
    simply type its URL in the Location text box, as shown in Figure 24.1.'
