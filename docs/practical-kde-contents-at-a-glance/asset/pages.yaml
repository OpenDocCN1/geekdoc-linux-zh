    **Figure 5.44**


    You may wonder why the **Titlebar** tab isn''t part of the Desktop section. Me,
    too.


    This tab is just plain fun. The **Title Alignment** buttons let you determine
    whether the title in the titlebars of your applications will be at the left of
    the titlebar, in its center, or flush right.


    Some of the clearest effects can be achieved by using a bitmap background for
    the titlebar. If you have selected the **Pixmap** check box in **Appearance**,
    the controls in the Pixmap section of the tab become active. You can select bitmaps
    for the active


