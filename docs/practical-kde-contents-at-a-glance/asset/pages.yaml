    # KDE in Your Pocket: KPilot


    The U.S. Robotics (later 3Com) PalmPilot has proved to be a very popular Personal
    Digital Assistant, as pocket-sized computers have come to be called. They are
    all the more useful if you can pass information back and forth between the PalmPilot
    and your desktop machine. KDE software exists (and is part of the standard distribution)
    that makes this possible. It is called KPilot and it consists of a daemon and
    a front end. You get it by K Menu > Utilities > KPilot and KPilotDaemon. The daemon
    makes the actual connection, and unless your PalmPilot is in its cradle and connected
    to your desktop machine, it will fail. But you can still run the KPilot program
    (see Figure 14.39) and load up all the things you want to send to your electronic
    marvel.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_352_0.png)


    FIGURE 14.39

    You can adjust KPilot''s settings through the File menu, where the little computer''s
    contents can also be backed up to your desktop drive (or network drive elsewhere)
    and restored. You can set up the connection through the single-item Conduits menu,
    whereas the three functions you can perform (Memos, Address Book, and File installer)
    are in the Pilot Application drop box.


    339'
