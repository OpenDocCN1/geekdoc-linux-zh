  md: '# PART III

    Which View Is Right for You? CHAPTER 13


    Month view is particularly useful when trying to figure out such things as the
    day of the week on which an historical event took place. Using the stylized triangular
    arrows on the right, you can go a week, a month, or a year at a time, back to
    1753, which is far enough for everyone except those who celebrate the Salem trials.
    You can also navigate far into the future. I stopped clicking when I went to the
    year 3029, which ought to be enough for the most optimistic of us, of course we
    may not know if KOrganizer is Y3K compliant. There is a good likelihood you will
    have upgraded your software by then, anyway, which is another reason to be happy
    that KOrganizer''s file format is portable.


    The final view, though it is first in the View menu, is List (see Figure 13.5).


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_306_0.png)


    FIGURE 13.5

    List view summarizes the day''s activities. The columns let you know whether an
    alarm has been set for a particular item, whether it is a recurring event (such
    as a birthday or the date the mortgage payment is due), the time of the event,
    and a brief description of the item.


    In List view, you can right-click on an item to produce a menu that allows a date
    column to be displayed in the list, the editing of the item (which also reveals
    details about it not seen in the summary), and deletion of the event.


    Remember that these are all different views of the same data, and what you can
    see or modify in one you can see or modify in any of the others.'
