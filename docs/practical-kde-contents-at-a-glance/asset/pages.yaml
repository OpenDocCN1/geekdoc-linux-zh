  md: '# PART VI Using Non-KDE Applications with KDE


    # CHAPTER 32 Running Windows Applications with KDE


    It''s easy to feel left out when you''re running Linux and KDE. The newscasts
    are always running stories about these virus programs that destroy computers,
    but your machine never gets infected. In fact, you don''t even have a virus scanner.
    In fact, is there even a virus scanner for Linux. People complain about their
    computers crashing and having to be rebooted several times each day, but the last
    time you rebooted your machine was when you installed a new kernel. No, it was
    when you went on vacation...or was it? Well, it was a long time ago, anyway.


    You feel underprivileged, like everybody gets to be a victim but you, and if you
    have nothing to talk about anymore.


    Relax; you can now crash and burn with the best of them. You can run Windows and
    Windows applications under Linux and KDE.


    # WINE


    WINE is supposed to stand, in its recursive Linux fashion, for WINE Is Not an
    Emulator. I think they chose the words just to be able to spell something because
    it certainly is an emulator. It emulates Windows, all flavors. I think they should
    call it Winux.


    And you can use it to run windows applications under KDE, seamlessly, as demonstrated
    in Figure 32.1.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_607_0.png)


    > This is the great Describe Word Processor, in its 32-bit Windows version, running
    seamlessly atop KDE, using WINE in place of Windows. It is quick and attractive.
    Only problem is, it can''t opening files, and it can''t save files. These shortcomings,
    I think you''ll agree, are serious. I''ll be happier when WINE allows such things,
    but I''d be happier still, in hog heaven, in fact, if there were a Linux version
    of Describe. They could call it KDEscribe


    FIGURE 32.1


    There is no application more lamented than the out-of-production Describe Word
    Processor, which many, including me, think was the best word processor ever written.
    It gets a few last gasps, though under WINE.


    594'
