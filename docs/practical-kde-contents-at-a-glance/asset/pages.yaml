    # The Kernel


    The Linux kernel brings together the ideas of the freshest and cleverest young
    minds in the computing world. They have provided features almost beyond the imagination
    of we mere mortals. These features are beyond the scope of this book, but you
    are encouraged to learn as much as you can about the options available in the
    Linux kernel, which is remarkably flexible. Some of these require that you compile
    the kernel yourself—“burn a kernel” in the vernacular—but so long as you are painstaking,
    it really isn''t at all difficult. Fortunately, the documentation necessary to
    perform a kernel burn is provided with the kernel source code. Just be sure to
    read it and follow the instructions exactly.


    The bottom portion of the screen is devoted to the session types available from
    KDM. The default choices are kde and failsafe. The latter provides a rescue mode
    in case KDM for some reason fails to start, but you can add more.


    Using KDM to start different window managers and desktops could be anything heretofore
    discussed. Frankly, it is easy for the novice, but anyone familiar with Linux
    and scripting can do it. Having said that, the variations along the way modern
    Linux distributions are handling X11 configuration files and the variations among
    the commands required to start different window managers and desktops preclude
    a discussion of it here, beyond noting that it can be done. The documentation
    provided with your distribution, the KDM documentation, and the instructions for
    installing and starting other window managers and desktops combined will enable
    you to modify the Xsession file in a subdirectory of /etc/X11 (this is one of
    the variations), and the systemwide initrc file to accommodate such additional
    setups as you desire.


    # Using KDM


    Having dealt with the installation and configuration of KDM, it''s finally time
    to use the thing. Let''s begin by doing an orderly shutdown of the system for
    a reboot, and rebooting.


    You''ll be greeted by the KDM window, configured as you choose. If you did not
    disable the depiction of users, (or the chosen few, anyway) appear in all their
    glory. If you are among them, you can click on your icon and see your username
    on the appropriate line. If not, you''d prefer it to clicking on your picture,
    or if you decided not to list users on the KDM screen, just type in your username
    and password. Then click on the button labeled Go. You are instantly transported
    to KDM.


    You can do other things at the KDM window. By clicking the Session Type drop box,
    you can choose from among the window manager/desktop combinations you have installed.
    The default list is kde and failsafe. The latter opens a little terminal window


