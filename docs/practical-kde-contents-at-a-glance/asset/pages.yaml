  md: '# PART III Using the Applications in the KDE Distribution


    # CHAPTER 15 Multimedia: Music and Movies


    > Danger!

    KSCD Magic, when it works as it is supposed to, makes little psychedelic patterns
    in time with the music being played. It practically never works, and its malfunctions
    create conditions that bring your PC to its knees, literally slowing it to where
    things usually take milliseconds now take minutes. The only way to fix it is to
    kill the thing, and the only remotely easy way to do that is to right-click your
    mouse pointer on the taskbar with KSCD Magic is listed and then Close it.


    +   - The button to the right of the i icon, with the triangle and the line, ejects
    the CD from the player. It is the graphical equivalent of typing eject at command
    line and pressing Enter.

    - Below the two buttons is the On/Off switch. Of course, it''s actually the Off
    switch, in that if you can see it''s already on it. It closes the CD Player.

    - The icon that looks like the front of a file cabinet drawer is the button to
    open the CDDB dialog box.


    About the CDDB Dialog

    In the CDDB dialog box, you can enter the name of the artist and the title of
    the album, with names of all the tracks, or you can go online and see if someone
    has already typed them in and made them available for download. If no one has,
    and you type them in, there''s a convenient upload button so that others now won''t
    have to type it all in for that particular album. You might want to log on to
    www.cddb.com and look at all the things you can do there.


    +   - The ?> button doesn''t open the file but sets the current album to play
    in random order.

    - The button with the hammer and screwdriver is where the actual CD player motif
    falls a little bit. (For absolute authenticity, it would say “No user serviceable
    parts inside.") is the button that opens the KSCD Configuration dialog box. This
    lets you set colors and your email address for submissions to the CDDB server
    that you also select there, and it lets you modify the terrible and dangerous
    KSCD feature.

    - The broad button to the right of Configure KSCD is the Track Selection list.
    Click on it and, if your CD is in the database, you are treated to a list like
    that depicted in Figure 15.2.'
