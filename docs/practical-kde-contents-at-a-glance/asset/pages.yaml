  md: '# About the Author


    Dennis E. Powell is an award-winning reporter and writer who has extensive experience
    in a variety of media for more than 25 years. Beginning in his teens as a newspaper
    photographer, he went on to such varied duties as daily newspaper police reporter,
    breaking news for WOR radio in New York, radio network editor at CBS, and magazine
    writer on a number of technical subjects. His 1988 article on the Space Shuttle
    Challenger disaster won national awards and earned him a Pulitzer Prize nomination.
    He has written for Forbes FYI, Yankee, Navy Times, Tropic (the magazine of the
    Miami Herald), the New Post, and numerous other publications. He also wrote the
    tour books for the last two Billy Joel concert tours.


    He has been involved in computers since the early days of the IBM PC. Since the
    acquisition of his first computer, he has built all his machines and those of
    friends, family, and some commercial clients. He is experienced and conversant
    in DOS, Windows, OS/2 and Linux, and has documented a number of commercial and
    in-house applications in each of these operating systems. He has employed KDE
    from its beginning.


    He and his wife live on their little horse farm in Connecticut.


    # About the Technical Editor


    Bob Bernstein sat down in front of a TRS-80 in 1981 and wrote a one-player version
    of Pong in BASIC. He still likes to play with BASIC. Linux has been a preoccupation
    since "Red Hat version 3.03," but Debian has won his allegiance. Past careers
    include working as a land surveyor (through the ranks from junior rodman to chief
    of party) and several years as a licensed mental health counselor. Occasionally
    he can be found taking a computer science course at Rhode Island College. He marooned
    on a desert island he would prefer to have available recordings of Debussy''s
    piano music, some of Thomas Merton''s writings, and "a reliable source of caffeine."


    # Dedication


    The world is a lesser place for the passing of Father Winston F. Jensen, and in
    recognition of that fact, to him this book is dedicated.'
