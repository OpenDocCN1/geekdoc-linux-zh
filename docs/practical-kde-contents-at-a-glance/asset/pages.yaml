  md: '# PART 1 Introduction


    # CHAPTER 2 Starting KDE


    # KDE Starts, But Applications Won''t


    This isn''t a common problem, but it is common enough. It happened to me! I would
    still be digging around for a solution but for an email from Roberto Alsina in
    Santa Argentina, Argentina, who told me the permissions on my /tmp directory were
    improperly set. He was right, and it took but a few seconds at the command prompt
    to fix it. There is no way in the world that I''m going to explain Linux permissions
    here, so if you are encountering this problem, you must do as and be content with
    its fixing the problem. Log out of KDE and log in as root (if you are using KDM,
    do so in failsafe mode) and at the command prompt type this:


    ```

    chmod 1777 /tmp

    ```


    and press Enter.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_59_0.png)


    # Fonts Are Too Small


    This isn''t an error message but an observation. If you are running KDE at a screen
    resolution of 1,024x768 pixels or more, you may decide that the screen fonts are
    simply too tiny to be useful, unless you get right down on the screen and squint.
    You may have even poked around and found where you can make them larger, but they
    look just awful: box and pixelated. Your trick? Here''s /etc/XF86Config lists
    typefaces displaying at 75dpi before it lists those that display at 100 dots per
    inch. This is if your display is 800x600 pixels or less, but those letters get
    mighty little at higher resolutions. What''s the solution? Reverse their order.
    Edit the first uncommented section, Section "Files", of /etc/XF86Config so that
    it changes from the default example listed first below to the new example, listed
    second. If you are using a version of Xfree86 that supports Type font, you can
