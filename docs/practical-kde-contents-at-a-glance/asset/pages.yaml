  md: '# PART II

    Slick and New: Konsole CHAPTER 11


    You can move freely among the applications running in Konsole. The number of

    sessions available is greater than the number you are ever likely to need.


    But before we go any further, let''s configure the thing a little bit with the
    Options

    menu, Figure 11.9.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_276_0.png)


    FIGURE 11.9

    The Options menu lets you choose window appearance, size of typeface, number of
    columns and lines displayed,

    and a color scheme. Remember to Save options when you''ve tailored it to your
    needs.


    It is extremely unlikely that you will have any trouble selecting the options
    that

    you want. The one potential trouble spot, turning off the menus, is defused by
    the

    continuous titlebar announcement. When the menus is disabled, right-clicking in

    the Konsole window renders the Options menu. Thus, you can turn it back on (or)

    save your options, if they include the lack of a menubar). If you have titlebar
    anima-

    tion enabled in your desktop setup, and if your Konsole window is small, this
    mes-

    age slides back and forth, all the time, annoying.


    Remember, too, that you can alter the size of Konsole by grabbing an edge or corner

    with your mouse and dragging it to the size you want.


    Konsole has a 100-line scrollbar buffer, which means you can use the scrollbar,

    where you have decided to put it, look back over the last 100 lines that have

    been printed to the screen. This is useful in those long -1 listings, or when
    you''ve

    used Konsole to launch a graphical application that won''t seem to start from
    the

    KDE desktop, and you want to see all the error messages. It would be nice if you

    adjust the length of the scrollbar buffer. One hundred lines aren''t enough for

    some of the mistakes made around here!


    263'
