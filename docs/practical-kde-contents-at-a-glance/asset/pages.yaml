  md: '# PART III


    KPat: Solitaire and More CHAPTER 18


    # KPat: Solitaire and More


    Solitaire has become a mainstay of GUI systems, and KDE''s version is called KPat.
    It is a sort of Patience, the venerable X Window System suite of Solitaire games.
    Its default screen, Figure 18.12, is surely familiar to you.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_410_0.png)


    Like Patience, KPat offers a selection of games (see Figure 18.13). Its Help file
    will guide you through each game, if you need the help. Though Captain Kangaroo
    has been cancelled, cigarettes are bad for you, and the deck contains 52 cards,
    not 51; you may still find yourself playing it til dawn. Hey, it''s something
    to do. Don''t let anyone tell you otherwise.


    397'
