    > The Story of Terminals

    Konsole has many fine features, but in my opinion the neatest of them is found
    by clicking the Help > Technical Reference item menu. You will be greeted by a
    photograph of a VT-100 terminal, the grandaddy of them all, followed by a clear
    and manifestly interesting discussion and explanation of terminals and terminal
    emulators (see Figure 11.8). Even if you are not a computer engineer, it''s well
    worth the read, if only to give a sense of the sophistication of the product that
    KDE''s developers have produced—for free!


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_275_1.png)


    FIGURE 11.8

    The Konsole Technical Reference is worth of your admission. It is a great easy
    tutorial explaining what terminals are and how they work, even every version of
    them, like Konsole, that run on your.


