  md: '# PART III Using the Applications in the KDE Distribution


    # CHAPTER 17 Manipulating File Archives and Backing Up Your Drive


    If one file format is common across all flavors of UNIX and therefore Linux, it
    is TAR, for Tape Archive. It is the standard by which files or groups of files
    are stored and shipped. But unlike some archiving formats in other operating systems,
    TAR doesn''t compress the files in a tarball, as TARred files are called. To reduce
    file size, an additional step must be undertaken. This usually involves a compression
    program called gzip, though another, more efficient program, bzip2, is gaining
    increased usage. This results in files that end in extensions like .tar.gz, .tar.bz2,
    or .tgz.


    Using these file formats is quick and easy, if you''ve memorized a bowl of alphabet
    soup of command-line options. Linux users can grab a few: tar xvf to open a file
    ending in .tgz or .tar.gz, for instance, and bzip2 - for files that end in .bz2,
    after tar xvf must be run. These users know all the options available to them,
    and man pages aren''t always entirely clear. It certainly would be nice if there
    were an-to-use graphical front end for these files, wouldn''t it?


    Well, there is. Or, actually, are: There are several archive handlers for KDE,
    and a couple are included in the KDE core package. Still others can be readily
    downloaded, some precompiled, and all in source that you can easily build.


    # KFM: Your Invisible Friend


    KFM, the KDE file manager, has impressive archive handling capabilities already
    built in. Click an archived file and see how transparently they work (see Figures
    17.1 through 17.3).'
  merge: -1
  pgno: 387
- img_proc: true
  md: '![](img/4a2883756c73e7b0696dbbd721c5c7db_388_0.png)


    FIGURE 17.1

    Here is a directory that contains a number of compressed tarballs. Clicking one
    of them...


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_388_1.png)


    FIGURE 17.2

    ...opens it as if it were a folder (which would be, extracted), and which, when
    clicked...'
  merge: -1
  pgno: 388
- img_proc: true
  md: '# PART III Using the Applications in the KDE Distribution


    # CHAPTER 17 Manipulating File Archives and Backing Your Drive


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_389_0.png)


    # FIGURE17.3


    ...shows the contents of the tarball. If you click the README file, it opens in
    your default editor.


    This is wonderfully useful for a couple of reasons. Looking at a binary tarball
    lets you see how it is structured, which makes it easy to determine where it should
    be copied before unarchiving it. Looking at the README and INSTALL files in a
    source tarball lets you learn of anything you need to do before you''re ready
    to build the application. If you keep old documents archived and compressed, you
    can also have access to them without having to open the tarball and then close
    it back again. This is a very nice feature, and it works for several kinds of
    archives.


    # Ark: Archive Builder and Extractor


    Had you right-clicked instead of left-clicked that tarball or another archived
    compressed file, you would have found Archiver among the choices in the menu.
    You had made that choice, something like Figure 17.4 would result. Clicking the
    selected file opens it in your text editor (see Figure 17.5).'
  merge: -1
