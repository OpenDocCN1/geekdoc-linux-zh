    the time, in minutes, that your keyboard and mouse are to remain inactive before
    the screensaver kicks in.


    Beneath the text box where the threshold is set are two check boxes. The first
    is Require password. This turns the screensaver, even invoked by timeout, into
    a screen lock, and you can''t get back to your desktop and applications without
    entering your password. The second, Show password as stars, determines what is
    echoed to the screen when you enter your password. If it isn''t selected, nothing
    is echoed at all, which means that if you lose track of where you are in your
    password, you might get an error and have to start all again.


    Finally, the Priority section determines where the screensaver falls in the application''s
    pecking order. The default is High, which is fine if you don''t have much going
    on when your mouse and keyboard are untouched for a period of time. If, however,
    you regularly do complicated tasks or compile programs in terminal windows, these
    processes could slow down if the screensaver comes on while they are underway.(In
    my opinion, isn''t by any means universally held, you might as well leave the
    X Window System entirely to compile software. It frees up system resources, and
    the compile goes much faster in many cases.)


    # Setting or Building a Color Scheme


    In the Display settings dialog box you can set the appearance of all KDE native
    applications and the appearance of some aspects of other X Window System applications
    running under KDE. This is done on the Colors tab (see Figure 5.15).


    At the top of the tab is a sample window that shows all the widgets whose colors
    can be changed. It serves as both a preview and a guide to their names.


    At the lower left is a listing of prebuilt Color Schemes that come with your KDE
    distribution. You can click through them, and if there''s one that you like, you
    can click OK and you''re done. But perhaps you want to modify one, tune it a little
    bit. Or maybe you want to build one from scratch. In that case, click the Add
    button. When you click this button, you''ll be prompted to name your new scheme,
    as demonstrated in Figure 5.16.


