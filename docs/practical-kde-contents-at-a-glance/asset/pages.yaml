  md: '# PART VI Using Non-KDE Applications with KDE


    # CHAPTER 30 Commercial Applications and KDE


    WordPerfect is now available in a slightly limited version (you cannot, for instance,
    add typefaces) for download, with most Linux distributions, and elsewhere (in
    Europe, it was on a CD distributed with magazines). It is also offered for sale,
    with a thick and impossibly inscrutable manual and the promise of clip art and
    130 typefaces. (The typefaces, though, seem to have been left out in many copies,
    and you have to have Corel, WordPerfect''s publisher to get them.)


    If WordPerfect is your cup of tea, run, don''t walk, to the bookstore and get
    Special Edition Using WordPerfect for Linux by Rod Smith. Rod really knows the
    program, and I know from personal experience that he can explain its intricacies
    in such a clear way that you''re left feeling that nothing could be more obvious.
    Or not he can bring sense to the import-export filters in WordPerfect. If you
    believe that your life is so serene, you can quickly cure it by trying to move
    a formatted file in WordPerfect to say, StarOffice.


    Corel, who now publishes WordPerfect, is producing its own KDE-based distribution,
    so it seems very likely that WordPerfect will soon be joined by the other applications
    that are found in the WordPerfect Suite on other platforms.


    # Other Commercial Applications


    It is not possible here to list all the commercial applications available for
    Linux that run perfectly well under KDE. The list would be long and instantly
    obsolete, so rapid is the stream of new Linux apps. Some of these are niche products,
    some are "vertical apps" designed for a particular industry, some like the Blender
    animation program (www.blender.nl) are developing so rapidly it''s breathtaking.
    One thing you''re likely to discover is that the prices for commercial applications
    under Linux are less than the prices of the same programs for other platforms.


    It''s a good idea to subscribe to one of the Linux magazines or to spend time
    in the Linux hangouts online (Freshmeat, Slashdot, JustLinux) to keep up to date
    on the new compulsory developments. For instance, I learned of CompuPic for Linux
    (linux.compupic.com) entirely by accident (see Figure 30.17).


