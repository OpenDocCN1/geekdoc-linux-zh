    Once you''ve run this command on QT and the KDE RPMs, KDE is installed on your
    hard drive.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_36_0.png)


    Debian users will, of course, use DEB files (unless some love of adventure causes
    them to employ the Debian alien program to allow the installation of RPMs by converting,
    which might be a good idea if some reason DEBs were not available). As with an
    RPM installation, you must be logged in as root or superuser in order to install
    DEB packages. The fundamental syntax is:


    ```

    dpkg --install filename

    ```


    However, with the apt front end for dpkg, you can install the entire batch of
    KDE DEB files at once, presumably they are in the same directory and you have
    changed to that directory, to:


    ```

    apt-get install kde*

    ```


    Upon KDE is installed on your Debian system.


