    # How to Really Learn KLyX


    There is no way to describe KLyX adequately in a few pages or a few dozen. Indeed,
    full treatment of this strange and powerful program could fill a book the size
    of this one. To do so or anything close to it would be far outside the scope of
    the book.


    Fortunately, vast documentation is available, and is part of KLyX itself. After
    you have opened the documentation index file for the first time, you will find
    that the Help menu provides frightening detail on the usage of KLyX (see Figure
    20.14).'
