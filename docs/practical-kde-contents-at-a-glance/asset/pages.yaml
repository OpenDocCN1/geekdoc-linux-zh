    # Okay, If We Must: Ksirc


    There is probably a good reason why some people use Internet Relay Chat, or IRC.
    I know people who swear they have done useful work more quickly because of it,
    and I don''t doubt them. The fact that many—I think most—IRC “conversations” are
    of less than great import should not enter into it:


    +   - Turnip — what are you doing

    - KingMaster — nothing. just hang out. finished my homework. history sucks.

    - Turnip — yeah. what are you doing now.

    - KingMaster — nothing.


    You''ll also find inquiries of the proprietors of Web cams as to whether they
    intend to expose more of their bodies tonight, along with expressions of what
    they wish to do. Still, it''s possible to feasible with a word processor or telephone,
    and that fact says nothing about the word processor or telephone. We have ksirc,
    and it is presumably-useful. It''s at K Menu > Internet > Chat Client (ksirc),
    shown in Figure 24.15.


    ![](img/4a2883756c73e7b0696dbbd721c5c7db_522_0.png)


    FIGURE 24.15

    If chat is your idea of a good time, or if you''re actually breaking new ground
    and using chat for the furtherance of a project through an online meeting, you
    can set up Ksirc to do your bidding.


    You configure it for the connection you want to make, give yourself a nickname,
    and you''re off and running. If you''ve entered everything correctly, you''ll
    soon learn about history, what people are doing now, and whether they intend to
    remain clothed.


