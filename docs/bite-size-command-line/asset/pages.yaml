    | kill -KILL | | |

    | kill -HUP | SIGHUP 1 |

    | kill -STOP | SIGSTOP 19 |


    +   1 HUP 2 INT 3 QUIT 4 ILL

    5 TRAP 6 ABRT 7 BUS 8 FPE

    9 KILL 10 USR 11 SEGV 12 USR

    13 PIPE 14 ALRM 15 TERM 16 SIGFLT

    17 CHILD 18 CONT 19 STOP 20 TTSP

