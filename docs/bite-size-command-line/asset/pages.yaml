- pgno: 20
  md: '# cat & friends


    cat concatenates files


    ```

    $ cat myfile.txt

    prints contents of myfile.txt

    ```


    ```

    $ cat *.txt

    prints all .txt files put together!

    ```


    you can use cat as an EXTREELY BASIC text editor:


    +   - Run $ cat > file.txt

    - type the contents (don''t make mistakes)

    - press ctrl+d to finish


    ```

    cat -n

    ```


    prints out the file with line numbers!


    +   1. Once upon a midnight...

    2. Over many a quaint.

    3. While I nodded, nearly


    # zcat


    cats a gzipped file!

    Actually just a 1-line shell script that runs ''zip -cd'', but easier to remember.


    # tee


    ''tee file.txt'' will write its stdin to both stdout and file.txt


    ```

    stdin -> tee a.txt -> stdout

    a.txt

    ```


    how to redirect to a file owned by root


    ```

    $ sudo echo "hi" >> x.txt

    ```


    this will open x.txt as your user, not as root, so it fails!

    $ echo "hi" | sudo tee -a x.txt will open x.txt as root :)'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# lsof


    # lsof


    stands for list open files


    somebody has that file open WHO IS IT??

    I can tell you!


    lsof


    # what lsof tells you


    for each open file:


    +   - pid

    - file type (regular? directory? FIFO? socket?)

    - file descriptor (FD column)

    - user

    - filename /socket address


    # -p PID


    list the files PID has open


    # lsof /some /dir


    list just the open files in lsome /dir


    # -i


    list open network sockets (sockets are files!)


    +   examples:

    -i -n -p -n & -p "do not resolve"

    -i: 8080 host names /ports/ (also -Pni)

    -i: TCP

    -i -s TCP:LISTEN


    # find deleted files


    ```

    $lsof | grep deleted

    ```


    Will show you deleted files!

    You can recover open deleted files from


    ```

    /proc/<pid>/fd/<fd> +

    process that opened the file

    ```


    # netstat


    another way to list open sockets on Linux is:


    +   netstat -tunapl

    tuna, please!


    On Mac netstat has different args.'
  merge: -1
  img_proc: true
