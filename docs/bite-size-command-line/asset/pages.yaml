- pgno: 3
  md: 'For almost all these tools, there are at least 2 versions:


    +   1. The BSD version (on BSDs & Mac OS)


    +   2. The GNU version (on Linux)


    All of the examples in this zine were tested on Linux. Some things (like sed -i)
    are different on Mac. Be careful when writing cross-platform scripts!


    You can install the GNU versions on Mac with `brew install coreutils`.'
  merge: -1
  img_proc: true
- pgno: 4
  md: '# # grep


    grep lets you search

    files for text


    use if you want

    regexps like ".*"

    work. otherwise you

    need to use ".\t"


    recursive! Search

    all the files in

    directory.


    $ grep bananas foo.txt


    Here are some of my

    favourite grep command

    line arguments!


    invert match: find

    all lines that don''t

    match


    only print the

    matching part of

    the line (not the

    whole line)


    - case insensitive


    only show the

    filenames of the files

    that matched


    search binaries:

    treat binary data

    like it''s text instead

    nof ignoring it!


    Show context for your

    search.

    $ grep -A 3 foo

    will show 3 lines of

    context after a match


    don''t treat the match

    string as a regex

    eg $ grep -F ...


    grep alternatives

    ack aggrep

    (better for searching code!)'
