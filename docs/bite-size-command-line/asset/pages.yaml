- pgno: 12
  md: '# tar


    13


    The .tar file format combines many files into one file.


    a.txt dir/c.txt


    .tar files aren''t compressed by themselves. Usually you gzip them: .tar.gz or
    .tgz!


    Usually when you use the ''tar'' command, you''ll run some incantation

    To unpack a tar.gz, use:


    +   - tar -xzf file.tar.gz=


    [Drawing of characters asking about xzf? saying learn]


    -x is for extract into the current directory by default (change with -C)


    -c is for create

    makes a new tar file!


    -t is for list

    lists the contents of a tar archive


    tar can compress / decompress

    -Z gzip format (.gz)

    -j bzip2 format (.bz2)

    -J xz format (.xz)

    & more! see the man page :)


    putting it together

    list contents of a .tar.bz2:

    $tar -tjvf file.tar.bz2 verbose

    create a .tar.gz

    $tar -czf file.tar.gz dir/files to go in the archive


    -f is for file

    Which tar file to create or unpack'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# ps


    # 14


    ps

    ps shows which processes are running

    I usually run ps like this:


    wchan

    is for wide. ps auxwww

    will show all the command

    line args for each process


    you can choose which columns

    to show with ps (ps -eo ...)

    One cool column is ''wchan'' which

    tells you the name of the

    kernel function if the process

    is sleeping

    try it:


    ```

    $ ps aux

    a+ttx

    u means include together

    username column show all

    process

    ps -ef works too)

    ```


    e

    is for environment. ps auxe

    will show the environment vars:


    ```

    $ ps -eo user,pid,wchan,cmd

    ```


    # ★ process state ★


    f

    is for "forest" ツ. ps auxf

    Will show you an ASCII art

    process tree:


    ps has 3 different sets

    of command line arguments 💔


    Here''s what the letters in

    ''s STATE column mean:


    +   1. UNIX (1 dash)

    2. BSD (no dash)

    3. GNU (2 dashes)


    +   R: running

    S/D: asleep

    Z: zombie

    I: multithreaded

    t+: in the foreground


    you can write monotrites like:

    $ ps f -f

    full format

    (UNIX)


    pstree can display

    a process tree too'
  merge: -1
  img_proc: true
