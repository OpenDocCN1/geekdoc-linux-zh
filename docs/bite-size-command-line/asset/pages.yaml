    the filename! eg\n-name '*.txt'\n\n-type [TYPE]\nf: regular file\nl: symlink\n\
    d: directory\n+ more!\n\nfind /tmp -type d -print\ndirectory which files action\
    \ to do\nto search with the files\nhere are my favourite\find arguments!\n\n-path\
    \ /-ipath\nsearch the full path !\n-path '/home/*.go'\n\n-maxdepth NUM\nonly descend\
    \ NUM levels\nwhen searching a directory\n\n-size O\nfind empty files!\nUseful\
    \ to find files you\ncreated by accident\n\n-print0\nprint null-separated names\n\
    Use with xargs -O!\n\nlocate\nThe locate command\nsearches a database of\nefile\
    \ on your system.\ngood: faster than find\nbad: cannot get out of date\n$sudo\
    \ updatedb\nupdates the database\n\n-exec COMMAND\naction: run COMMAND on\nvery\
