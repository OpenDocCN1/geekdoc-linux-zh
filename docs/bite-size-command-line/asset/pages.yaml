- pgno: 6
  md: '# xargs


    xargs takes white space separated strings from stdin and converts them into command-line
    arguments


    ```

    $ echo "/home/tmp" | xargs ls

    will run ls /home/tmp

    ```


    this is useful when you want to run the same command on a list of files!


    +   - delete (xargs rm)

    - combine (xargs cat)

    - search (xargs grep)

    - replace (xargs sed)


    how to replace "foo" with "bar" in all .txt files:


    ```

    find . -name ''*.txt'' | xargs sed -i s/foo/bar/g

    ```


    how to lint every Python file in your Git repo:


    ```

    git ls-files | grep .py | xargs pep8

    ```


    if there are spaces in your filenames "my day.txt" xargs will think it''s 2 files
    "my" and "day.txt",


    fix it like this:


    ```

    find -print0 | xargs -O COMMAND

    ```


    more useful xargs options makes xargs run a separate process max-args for each
    input:


    ```

    capital P -P max-procs is the max number of parallel processes xargs will start

    ```'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# awk


    awk is a tiny programming language for manipulating columns of data


    basic awk program structure


    extract a column of text with awk


    I only know how to do 2 things with awk but it''s still useful!


    ```

    BEGIN {...}

    CONDITION {action}

    CONDITION {action}

    END {...}

    ```


    ```

    awk -F, ''{print $5}''

    ```


    column single separator quotes? 5th column


    this is 99% of what I do with awk


    action on lines matching CONDITION


    SO MANY unix commands print columns of text (ps! Is!!)


    awk program example: sum the numbers in the 3rd column


    awk program example: print every line over 80 characters


    so being able to get the column you want with awk is GREAT


    ```

    { s += $3 };nEND {print s}

    ```


    ```

    length($0) > 80

    ```


    action


    at the end, print the sum!


    condition (there''s an implicit {print} as the action)'
  merge: -1
  img_proc: true
- pgno: 8
  md: "# # sed\n\nsed is most often used for replacing text in a file\n\n$ sed s/cat/dog/g\
    \ file.txt\n be a regular expression\n\nchange a file in place with -i\n\nsome\
    \ more sed incantations...\n\nsed -n 12 p\nprint 12th line\n\nin GNU sed it's\
    \ -i\nin BSD sed, -i SUFFIX\nconfuses me every time\n\n-i suppresses output so\
    \ only what you print with 'p' gets printed\n\nsed 5d\ndelete 5th line\n\nsed\
    \ s+/cat+/dog/+\nuse as a character regex delimiter\n\nsed 6\ndouble space a file\
    \ (good for long error lines)\n\nsed /cat/d\ndelete lines matching /cat/\n\nway\
    \ easier than escaping / is like s/cat//dog//\n\nsed '/cat/a dog'\nappend 'dog'\
    \ after lines containing 'cat'\n\nsed -n 5,30 p\nprint lines 5-30\n\nsed -n s/cat/dog/p\n\
    only print changed lines\n\nsed 'i17 panda'\ninsert 'panda' on line 17"
  merge: -1
  img_proc: true
