  mdcn: "\n\n# # 极简命令行工具\n\n作者：Julia Evans\n\n这本小杂志每页介绍一个最实用的 Unix 命令行工具。\n\n![](img/5f5d02ddabdd2009c88fde2963d57414_1_0.png)\n\
    \n![](img/5f5d02ddabdd2009c88fde2963d57414_1_1.png)\n\n即使你以前用过这些命令，我可能仍有一一两个新小招式要教给你\
    \ ❤\n\n# 目录\n\nBSD≠GNU.........4 bash  技巧.....10-11 杂项命令...17\ngrep................5\
    \ 磁盘使用......12 head&tail........18\nfind................6 tar................13\
    \ less................19\nxargs................7 ps................14 kill................20\n\
    awk................8 top................15 cat................21\nsed................9\
    \ sort&uniq......16 lsof................22\n\n对于这些几乎所有的工具，至少有2 个版本：\n\n- 1. BSD\
    \ 版本（用于 BSD 和 Mac OS）\n- 2. GNU 版本（用于 Linux）\n\n本杂志中的所有示例均在 Linux 上测试过。某些操作（如\
    \ `sed -i`）在 Mac 上有所不同。编写跨平台脚本时要加小心！\n\n你可以通过 `brew install coreutils` 在 Mac 上安装\
    \ GNU 版本。\n\n# # grep\n\ngrep 允许你在文件中搜索文本\n\n如果你想让像 \".*\" 这样的正则表达式生效，请使用它；否则你需要使用\
    \ \".\\t\" 进行递归搜索！可以搜索目录下的所有文件。\n\n$ grep bananas foo.txt\n\n这里我最喜欢的一些 grep 命令行参数！\n\
    \n- -v 反向匹配：找到所有不匹配的行\n- -o 仅打印行中的匹配部分（而不是整整行行）\n- -i 忽略大小写\n- -l 仅显示匹配到的文件名\n\
    - 搜索二进制文件：将二进制数据视为文本而不是忽略它！\n- -A 3 显示搜索结果的上下文。$ grep -A 3 foo 将显示匹配项后的 3 行上下文\n\
    - -F 不将匹配字符串视为正则表达式，例如 $ grep -F ...\n\ngrep 的替代方案：ack, aggrep（更适合搜索代码！）\n\n#\
    \ # find\n\nfind 在目录中搜索文件\n\n- -name [/iname] 忽略文件名的大小写！例如 -name '*.txt'\n- -type\
    \ [TYPE]\n  f: 普通文件\n  l: 软链接\n  d: 目录\n  + 更多！\n\nfind /tmp -type d -print 搜索目录哪些文件\
    \ 动作对搜索到的文件执行什么操作\n这里我最喜欢的 find 参数！\n\n- -path [/ipath] 搜索完整路径！ -path '/home/*.go'\n\
    - -maxdepth NUM 搜索目录时仅向下进入 NUM 层\n- -size 0 查找空文件！用于查找你不小心创建的文件\n- -print0 打印以空符分隔的名称，配合\
    \ xargs -O 使用！\n\nlocate:\nlocate 命令搜索系统上的文件索引数据库。\n优点：比 find 快\n缺点：无法实时更新\n$\
    \ sudo updatedb 更新数据库\n\n- -exec COMMAND 动作：对找到的每个文件运行 COMMAND\n- -delete 动作：删除所有找到的文件\n\
    \n# xargs\n\nxargs 从标准输入（stdin）接收空格分隔的字符串，并将其转换为命令行参数\n\n```\n$ echo \"/home/tmp\"\
    \ | xargs ls\n将运行 ls /home/tmp\n```\n\n当你想要对文件列表运行相同的命令时，这非常有用！\n\n- - 删除 (xargs\
    \ rm)\n- 合并 (xargs cat)\n- -  (xargs grep grep\n\n- 替换 (xargs sed)\n\n如何在所有 .txt\
    \ 文件中将 \"foo\" 替换为 \"bar\"：\n\n```\nfind . -name '*.txt' | xargs sed -i s/foo/bar/g\n\
    ```\n\n如何对 Git 仓库中的每个 Python 文件进行 lint 检查：\n\n```\ngit ls-files | grep .py | xargs\
