    # # grep


    grep lets you search

    files for text


    use if you want

    regexps like ".*"

    work. otherwise you

    need to use ".\t"


    recursive! Search

    all the files in

    directory.


    $ grep bananas foo.txt


    Here are some of my

    favourite grep command

    line arguments!


    invert match: find

    all lines that don''t

    match


    only print the

    matching part of

    the line (not the

    whole line)


    - case insensitive


    only show the

    filenames of the files

    that matched


    search binaries:

    treat binary data

    like it''s text instead

    nof ignoring it!


    Show context for your

    search.

    $ grep -A 3 foo

    will show 3 lines of

    context after a match


    don''t treat the match

    string as a regex

    eg $ grep -F ...


    grep alternatives

    ack aggrep

    (better for searching code!)'
