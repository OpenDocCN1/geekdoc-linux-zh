    Is it possible that I can demonstrate in an interview that I''ve studied the kind
    of skills some employers want?


    Trevor Caring


    You''re Trevor – and as more than many companies, large and small dealing with
    Linux on servers requires open source, and more and more recruiters are interested
    in seeing qualifications on your CV. The good news is that there are standardised
    certifications that are just as important in the field of open source as the MCP
    and in IT. Many companies offer different courses and training schemes – a good
    place to look for online courses is https://www.mooc-list/tags/linux, which lists
    MOOCs Massive


    Open Course covers the likes of EdX. If you want to start from the rookie''s mouth
    hover and take a course that''s the Linux equivalent of an MCP the Linux Foundation
    offers two ways if you want to specialise in. The Linux Foundation certification
    course (https://linuxfoundation.org/certification/) is the first option for a
    basic level of knowledge. It can be studied over 12 months and is 100 per cent
    self-paced. The Sysadmins certification built on structure applies to the Linux
    Foundation Certified Engineer (https://linuxfoundation.org/certification/) is
    the more advanced option with wider range and deeper depth fields, so we recommend
    that you take a Sysadmins option first before moving on to the more advanced option.


