    To get the latest version, run:

    curl -s https://raw.githubusercontent.com/raspberrypi/python-sense-emu/master/install.sh
    | sudo bash

    ```


    Some of the newly designed icons are immediately visible as none of the DPI. These
    applications in the Engineering section are about this, their head over-icons/Pix
    to take the back theme. Alternatively use Chrome in Chromium


    ![](img/db87aeaad27e4efbbf36e01180be02e6_74_0.png)


    Click the gear icon on the top-right and edit Bookmarks. On the window you''ll
    have the option to export your bookmarks to HTML format. Copy and Epiphany and
    choose the blue link Import in Chromium to add them.


    # 04 InstallSenseHATEmulator


    This is optional, but is included in the SenseHAT emulator also installed with
    the latest version of Raspberry. The SenseHAT is an add-on for the Raspberry Pi
    with a set of sensors from a thermometer to a gyroscope. The emulator allows developers
    to test code for devices without actually running the SenseHAT. See more at www.raspberrypi.org/


    Run this to install all necessary files:


    ```

    sudo apt-get install python3-sense-emu python3-sense-emu-doc

    ```


    ![](img/db87aeaad27e4efbbf36e01180be02e6_74_1.png)


    # 08 Change the Appearance Settings


    The default appearance allows you to change your desktop, you may wish to perform
    some tweaks: at this stage, particularly if you are using a remote head to Preferences>Appearance.
    If you''re set to a main theme, change the settings button at the bottom of the
    screen, you can also change the size of the bar to medium or small.


    ![](img/db87aeaad27e4efbbf36e01180be02e6_74_2.png)


    # 05 Load Pixel Desktop


    Reload the Pi to get your new, shiny Pixel Desktop. You may see a message saying
    that your configuration files have been overwritten. Click OK to delete them.
    At this stage you may also want to change the background. Click the Pixel Desktop
    icon on the panel to change it anywhere on the desktop and click Preferences.
    Our current favourite is Montserrat.


    ![](img/db87aeaad27e4efbbf36e01180be02e6_74_3.png)


    # 09 Test SenseHAT Emulator


    If you installed the SenseHAT Emulator previously, you can launch it from the
    Programs menu. The emulator comes with a dozen example of sensors to get you started.
    Simply click the file at the top-left of the window to Open Example. There are
    several intermediate and advanced examples. If you are interested here, SenseHATs
    are currently available online on the Pi for £20. See more https://raspberrypi.com/products/raspberry-pi-sensehat


    # 06 Examine your interfaces


    Pixel''s Desktop now offers the option to disable both Bluetooth and Wi-Fi completely
    with the desktop environment. Click a button. Simply click on the relevant icon
    and turn it off. Head over the icon appear at the top-right of the desktop. Click
    this to view your Pi Preferences for VNC clients.


    ![](img/db87aeaad27e4efbbf36e01180be02e6_74_4.png)


    # 10 Enable login screen


    Now Raspberry Pi has a rich environment and modern web browser, you may wish to
    use it for work or home computer. To make the Pi require a password on startup,
    open Terminal or connect via SSH and run the command:


    ```

    sudo nano /etc/lightdm.conf

    ```


    Scroll down to the line autologinuser=pi and find a hash (#) at the start. Press
    Ctrl+X, then Y to save and exit. Remember the default password is ''raspberry''.


    # 07 Import old bookmarks in Chromium


    +   epiphany-browser.'
