    # FILE AND DISK UTILITIES


    >_Use these command-line utilities to manage your files and disk space


    # FIND OPEN FILES WITH LSOF


    lsof is a utility that allows you to list files on your system. Simply typing
    lsof will list all files on your system belonging to active processes. By default,
    one entry per line is displayed, with a self-explanatory name that should be useful
    if you are attempting to diagnose file access issues.


    By providing a specific filename to lsof, you can see which processes are using
    that file. In the same way, if you pass in a directory name it shows all files
    in that and subdirectories with recursion -u. Other advanced options include list
    files opened by a specific user -u or by a specific user -username - this is useful
    if you want to see files opened by anyone except yourself.


    # TRACK DOWN EXCESS I/O USAGE


    We''ve already covered a number of top-style utilities, so you can probably mention
    iotop here because it is worthy of mention. Linux actually has the ability to
    interpret I/O usage without root. What iotop takes the same data and presents
    it in a regular-like UI, which is very useful.


    In a server environment, it is important to see if a particular process is making
    out disk access, and iotop makes this possible. The utility will show whether
    they have any I/O activity. To make the display easier, consider using the --only
    switch, which will show processes and threads only if they are actually doing
    it.


    # UNDERSTAND DISK SPACE WITH NDCU


    ndcu is an abbreviation of ncurses. The utility is a disk usage analyser with
    the ncurses interface. It was originally designed to find disk space on a remote
    server where you don''t have an interactive environment but it is a very useful
    tool to navigate modern desktop systems. It is simple and easy to use.


    When launching a directory, ndcu launches in an interactive mode - the arrow keys
    are used to navigate the directory structure and explore all disk space. It works
    extremely well and achieves its aim of being fast very effectively.


    The -o switch allows the report to be exported to a file rather than using the
    interactive interface if desired.'
