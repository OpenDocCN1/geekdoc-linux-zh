    # ► Top 10

    (Average hits per day, 30 Sep - 31 Oct)


    The perfect chip for Internet of Things?


    Intel has recently unveiled its latest venture

    to the world of Internet of Things with

    the launch of its next generation Atom

    microprocessors.


    meticulously designed from the ground

    up, the company claims offers 1.7 times

    the computing power of previous versions

    of the processor. It can also support greater

    memory bandwidth and faster speeds,

    comparable to some of the higher-band chips

    currently on the market.


    +   1. Linux Mint 2,663

    2. Debian 1,676

    3. Ubuntu 1,514

    4. elementary 1,487

    5. openSUSE 1,431

    6. Zorin 1,140

    7. Manjaro 1,082

    8. Fedora 997

    9. Arch Linux 717


    ![](img/db87aeaad27e4efbbf36e01180be02e6_10_0.png)


    Ken Kaviafi, VP of Intel''s Tiny group,\ said, "Built into a compact chipless
    bill grid

    array (Intel) and features 14 nanometer scale

    technology, the Atom processor E3900

    is perfect for a wide range of IoT applications,

    where scalable performance, power and space are

    at a premium."


    Notably the most impressive aspect of the

    Atom E3900 is its graphical capabilities, as it was

    originally suited for use but capable

    quality video in low light, noise reduction

    and four vector image processing units.

    OEMs already said to be working with the new

    series of Intel devices including Hkvikon

    hand Newsoft. It is yet unknown when we

    expect to see the chip for public use

    nor what the consumer price point will be.


