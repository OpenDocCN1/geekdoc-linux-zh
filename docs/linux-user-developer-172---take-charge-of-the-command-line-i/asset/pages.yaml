  md: "# Tutorial .NET Core and Docker\n\nmicroservice strategy, you need to leverage\
    \ tooling in the Docker space that can manage multiple Docker containers. Docker\
    \ compose is one such tool that can be used to orchestrate the deployment of web\
    \ apps and web APIs across several containers. Here is an example of Docker compose:\n\
    \n![](img/db87aeaad27e4efbbf36e01180be02e6_39_0.png)\n\n```\ndocker-compose -f\
    \ aspnet-core-webapis.yml -h http://10.x.y.z:2375 build\n```\n\nThe result of\
    \ the above command will be a Docker image that is built and copied to the target\
    \ server. In this example, Docker communication occurs over the unsecured default\
    \ port. However, secure Docker communication is possible using TLS and a certificate-based\
    \ configuration. By default, port 2376 is reserved for secure communication.\n\
