    chat feeds


    +   - Options to customise the minimal chat window are rather basic, but worth
    implementing on occasion


    # ### Initial setup


    The process of getting HexChat on most distributions is fairly simple, and many
    have official packages from HexChat. On top of the base download, you''ll find
    that a number of additional components also require installing, which slows down
    the process to a certain degree. Merging feeds into HexChat is the easiest of
    the group, though.


    # ### Initial setup


    No matter the distribution, you''ll find a Konversation package available to use,
    making it a hard choice for most users. Installation is relatively straightforward,
    but there are non-compulsory options also set out for advanced users to configure
    the installation. Merging feeds is time-consuming, but you might encounter a few
    errors with the labelling of features. Text decorations are an extra first, but


    # ### Design and usability


    HexChat isn''t anything special in its basic form, but there is an array of themes
    that can be implemented easily. Its simplistic interface is easy to navigate,
    and it benefits from a familiar look that has many of its features. Aside from
    a new palette, the level of customisation is limited.


    # ### Design and usability


    IRC clients are renowned for their minimal designs, but there is something that
    Konversation has for. It works well for the most part, with multiple servers and
    channels in one single window. Navigation is simple, but we did encounter a few
    errors with the labelling of certain features.


    # ### Chat functionality


    In a similar way HexChat does all the basics, well with a few extras. One of the
    better docked tools, which allow you to manage your feeds connected to your chat
    network. Connection is a bit buggy, so you may need to refresh the client a few
    times to get them working properly.


    # ### Chat functionality


    Outside of basic functionality, there''s little to get excited about and it''s
    Konversation''s area. There are also some considerations to filtering other chat
    channels, and the merger of them into one window presents problems when considering
    it to is where


    # ### Plugins and extras


    There''s a few extra options which could turn out, but not most of them length
    to what we see in this group. The team stands for multi-network support, which
    is fantastic for identifying and joining chat feeds based on your interests. Also
    hidden are options for plugins and DOCs, both of which should be useful when needed.


    # ### Plugins and extras


    One of the things Konversation has in its favor is its highly intuitive notification
    system. We go as far as to say it''s the best way to connect with your chat feeds.
    Another positive is the support for each channel, which can be especially useful
    for highlighting specific texts.


    # ### Overall


    > We can''t fault much of HexChat offers, but the problem is that it doesn''t
    offer a whole lot. It nails all the basics, but we''d liked to have it integrate
    better features.


    # ### Overall


    > Some great extras can''t hide the fact that there are some omissions from Konversation.
    We applaud its take on a minimal approach to an IRC client, but it''s not imperfect.'
