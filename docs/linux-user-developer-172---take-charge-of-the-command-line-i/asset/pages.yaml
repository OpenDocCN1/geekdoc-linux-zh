  md: "# Tutorial Ubuntu management\n\nView only the processes related to the specific\
    \ user.\n\n```\n$ top -n 10\n```\n\nThis will refresh the screen ten times before\
    \ quitting.\n\n```\n$ top -b\n```\n\nRun in batch mode. Note that in this mode,\
    \ the output of the top command will be formatted in a way that it is suitable\
    \ for output to a file. This is basically used to create a log of processes. Let\
    \ us consider an example here.\n\n```\n$ top -b 30 -o mylogs\n```\n\nThis runs\
    \ top and logs the output 30 times.\nIf you need to find more information on how\
    \ to use the top command, can you type ? during a session. As mentioned, the main\
    \ page provides a lot of information on how to use it. You can also type q to\
    \ quit.\nLet us turn our attention to finding and controlling processes on Ubuntu.\
    \ Controlling processes involves two things: finding the process you need to change,\
    \ and modifying the process priority or sending the process to change its behaviour.\n\
    \nWhen we are looking for a specific process, it can become a tedious job to find\
    \ it in a large list of processes. In such, the ps command will be very useful.\
    \ This command provides ways of searching through your processes for the ones\
    \ you are looking for. The command allows you to change the priority of processes.\
    \ And commands like kill, kill and pkill will enable you to send signals to the\
    \ running processes.\nLet's look at how to use the simplest form, which command\
    \ can be searched for a command name and produce the process ID of any process\
    \ that includes that name.\n\n```\n$ pgrep init\n```\n\nThis shows the PID of\
    \ any process including the 'init' string.\nSince we know that there is only one\
    \ init command, we can use the -l option to reveal the process name.\n\n```\n\
    $ pgrep -l\n```\n\nThis shows the PID and name of process including init.\nThe\
    \ most popular way to use the pgrep command is to find the PID of the running\
    \ processes and then pipe those PIDs to another command to produce the output.\n\
    We have another way to look at a specific process and this is by accessing it.\
    \ The fuser command can be used to find which processes\n\nhave a file or a socket\
    \ at the moment. Once we find the processes, the user command can be used to send\
    \ signals to those processes. You can use the command to find if files are being\
    \ held open by processes. You will be able to close them properly so that the\
    \ file can be deleted safely.\nHere are a couple of examples how to use this in\
    \ a command line.\n\n```\n$ fuser -m\n```\n\n![](img/db87aeaad27e4efbbf36e01180be02e6_43_0.png)\n\
    \n+   - current directory\n  1234\n- file is opened in write mode\n  5678\n- file\
    \ is opened in default mode\n  9012\n\nA non-zero return code indicates that one\
    \ of the processes was using the file. The output shows the PIDs of the processes\
    \ using the file. The command can be used with different flags to change the output.\
    \ For example, the -v flag will show the user, the command, and the type of access\
    \ granted.\n\n# Above Look at the fuser command\n\nThis will list all of the supported\
    \ processes.\n\n```\n$ fuser -m /boot\n```\n\nThis shows all PID of processes\
    \ opening /boot.\nOnce you identify the processes, you can close them manually\
    \ or kill them. If the process is stuck, you can kill it to change its state.\n\
    \nNow let's look at controlling the running processes in more depth. After even\
    \ a running process, you can change its behaviour in various ways. The ren command\
    \ can be used to adjust a running process priority. With the help of ren you can\
    \ determine the priority and also set a lower or a higher priority at the time\
    \ of launching a process. There is another way to change the behavior of a process\
    \ by restarting the specific process. The kill and killall commands can be used\
    \ for this.\n\nNow, every running process has a 'nice' value and this can be used\
    \ in the Linux process scheduler to what needs. If a process has a positive nice\
    \ value, it indicates that the specific process has a lower priority. It needs\
    \ to be noted that the value of process just acts as a suggestion to the scheduler.\n\
    \n44"
