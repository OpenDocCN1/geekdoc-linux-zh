  md: '# TOP FIVE


    # Niche

    Linux distros


    ![](img/db87aeaad27e4efbbf36e01180be02e6_8_0.png)


    ![](img/db87aeaad27e4efbbf36e01180be02e6_8_1.png)


    # 1 C.A.I.N.E


    C.A.I.N.E. is the distro of choice for those needing to perform computer forensics,
    deidings throughout their investigations. It is based on Debian and features a
    front-end, and can be installed on a hard drive, or from a live CD.


    # 2 Gentoo


    The Gentoo Linux has a lot, but love, following-a-based rolling release distro
    that allows users to modify and recompile code to their exact needs. It is not
    for the faint-hearted, and is reputed to be one of the hardest distros to master.


    ![](img/db87aeaad27e4efbbf36e01180be02e6_8_2.png)


    # RASPBERRY PI


    # Raspberry Pi reveals

    a brand new desktop


    # Getting grips with Raspberry''s latest desktop


    Raspbian has been long the operating system of choice for many users who invested
    in Raspberry Pi. It has proved great OS of choice for those starting in the world
    of developing for the first time, and even more when it is used in the Raspberry
    Pi cluster.


    Changes are immediately noticeable, with a new splash screen that displays the
    latest improvements. The splash screen now covers most of the installation interface
    text boxing up. On the desktop, icons have been redesigned to look professional
    and enough for daily use.


    # 3 Ubuntu Desktop


    For all media enthusiasts out there, look into Ubuntu Desktop with a platform
    of media editing tools ready to use, complete work with tasks to help you manage
    your creative projects.


    After two years of development


    Desktop now opens after thinner frames and the desktop improvements also made
    to the default Roboto font. This is the beginning of a series of new applications
    that will make Raspberry Pi more accessible.


    # 4 MulLinux


    The last set of changes are almost entirely to the appearance of the desktop;
    there are some functional changes and a few applications...but this is mostly
    about making things look nicer."


    Linux is a multi-distro thing, requiring just of 8GB of RAM and 4GB of flash to
    run at a decent level. While not made for the faint-hearted, it is a great Linux
    desktop that needs saving from the scrapheap.


    # 5 Yellow Dog


    Dogging originally developed for Apple computers in the late nineties, under new
    ownership, Yellow Dog is one of the best distros for high-performance gaming,
    and it has been used in development for the PlayStation Network.


    Debbian has been integrated into the operating system, as well as the VNC and
    VCenter servers. New version Chromium was introduced, alongside the aging Epiphine,
    to download the latest version of Raspberry Pi desktop head across to the official
    Raspberry Pi blog.


    www.linux.com'
