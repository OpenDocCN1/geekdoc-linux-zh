  md: '# # HexChat


    Simplicity is key when it comes to HexChat''s growing reputation


    # # Konversation


    Can its minimal UI be a winning formula for Konversation?


    ![](img/db87aeaad27e4efbbf36e01180be02e6_82_0.png)


