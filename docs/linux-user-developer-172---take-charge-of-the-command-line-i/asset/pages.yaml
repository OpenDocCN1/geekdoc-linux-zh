  md: '# Review


    # IRC clients


    # WeeChat


    # Quassel


    There''s a lot to like in this expansive IRC client


    Is a graphical interface enough to help Quassel stand out?


    ![](img/db87aeaad27e4efbbf36e01180be02e6_81_0.png)


    +   Sectioning tools are great for separating chat feeds and user panels


    +   A variety of themes can be implemented to add some extra style to your chat
    windows


    ![](img/db87aeaad27e4efbbf36e01180be02e6_81_1.png)


    ### Initial setup WeeChat biggest issue is that it doesn''t include any clear
    instructions when it comes to setup. It can take a fair amount of time to configure
    the plethora of options, and even more if you like to try any of the available
    plugins. Configuring the merging of chat clients is quicker than most of the competition
    here.


    ### Initial setup Quassel team provides precompiled versions of each version of
    the IRC, which will be a major help to new users. Instructions for installation
    are easy to follow, but merging of other chat clients is surprisingly hard to
    handle. Little able to directly fix more issues, so you''ll be searching through
    other methods.


    ### Design and usability While not having a lot to look at, WeeChat is easy to
    navigate. Menus are clearly labeled and the handling system to separate user chat
    and windows, can also be resized based on user preference. Customisations are
    on to help you use colour palettes and a series of remote interfaces to change
    up basic functions.


    ### Design and usability Taking a moment of silence on things helps Quassel to
    separate itself from the pack. Each part of the GUI is arranged to vary your tastes,
    but we receive a couple of sudden crashes when we have made heavy changes. However,
    the design does cater well for managing multiple chat windows, with separation
    on hand when...


    ### Chat functionality WeeChat features are fairly basic, and users will be pressed
    to find any real way to personalize their text. However, through the Tabs bar,
    a series of sectioning features are on to help improve the readability of all
    text. These lines may seem trivial, but they can get quite useful through this
    menu. We would like to see further options in future updates.


    ### Chat functionality There''s an abundance of chat functions to use here, but
    many are superb. A better system is on hand to filter between chat feeds and we
    like being able to format the text to our style and tastes. We liked some notifications
    we received when we were closed and then opened up Quassel.


    ### Plugins and extras By WeeChat''s strength is features of its plugin system.
    Various features like anti-flood and kind of all can be implemented easily within
    the client, and alert users will enjoy exploring the WeeChat functions. The smarter
    the plugin, the incredibly helpful for filtering out spam and leave behind behaviour.


