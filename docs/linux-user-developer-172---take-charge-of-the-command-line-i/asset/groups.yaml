    ## 1 C.A.I.N.E


    C.A.I.N.E. 是那些需要进行计算机取证并在调查过程中决定数据的人的首选发行版。它基于 Debian，具有前端界面，可以安装在硬盘上，也可以通过 Live
    CD 运行。


    ## 2 Gentoo


    Gentoo Linux 有很多优点，但人们热爱这种基于滚动更新的发行版，允许用户根据自己的精确需求修改并重新编译代码。它不适合意志胆弱的人，被认为是最难精的发行版之一。


    ![](img/db87aeaad27e4efbbf36e01180be02e6_8_2.png)


    ## 树莓派


    ### 树莓派揭示全新的桌面


    ### 上手树莓派最新的桌面


    Raspbian 长期以来一直是许多投资树莓派的用户的首选操作系统。它已被证明是初次进入开发世界的人的极佳选择，而且当它被用于树莓派集群时，更是如此。


    变化是显而易见的，新的启动屏幕显示了最新的改进。启动屏幕现在覆盖了大部分安装界面的文本框区域。在桌面上，图标经过了重新设计，看起来非常专业且足够日常使用。


    ## 3 Ubuntu 桌面


    对于所有的媒体爱好者，请关注 Ubuntu 桌面，它拥有一个准备就用的媒体编辑工具平台，可以完成工作并有相关任务帮助您管理您的创意项目。


    经过两年的开发，桌面现在以更纤细的边框打开，桌面还对默认的 Roboto 字体进行了改进。这是一系列新应用的开始，这些应用将使树莓派变得更易用。


    ## 4 MulLinux


    最后一组更改几乎完全是针对桌面外观的；有一些功能性的变化和几个应用程序……但这主要是为了让事情看起来更好。”


    Linux 是一个多发行版的产物，只需要 8GB 内存和 4GB 闪存即可在体面的水平运行。虽然它不是为意志胆弱的人设计的，但它是非常优秀的 Linux 桌面，需要从废品堆中拯救。


    ## 5 Yellow Dog


    Dogging 最初在 90 年代后期为苹果计算机开发，在新的所有权下，Yellow Dog 是高性能游戏最好的发行版之一，并已用于 PlayStation
    Network 的开发。


    Debian 已集成到操作系统中，以及 VNC 和 VCenter 服务器。引入了新版本的 Chromium，以及旧版本的 Epiphine，用于从树莓派官方博客下载最新版本的树莓派桌面。


