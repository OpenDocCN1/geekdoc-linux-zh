    \ server and print it out if it has greater than a certain value.\n\n```python\n\
    import paramiko\nclient = paramiko.SSHClient()\nclient.set_missing_host_key_policy(paramiko.AutoAddPolicy())\n\
    client.connect(username='pi', password='raspberry')\nstdout, stderr, stderr =\
    \ client.exec_command('/proc/loadavg')\ndata = stdout.read().decode()\nif float(data)\
    \ > 2.0:\n    print(data)\nclient.close()\n```\n\n# Talking to your server\n\n\
    Sometimes, you simply need to interact directly with your remote server. You may\
