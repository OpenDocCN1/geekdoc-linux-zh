    #!/bin/bash\njava MainClass\nresponse=$\ncase response in\n```\n\n# Bash 大师教程\n\
    \n| 问题 | Javadoc | 声明 | 控制台 | AWS 浏览器 | 图 2 |\n|---|---|---|---|---|---|\n| <terminated>-MainClass(1)\
