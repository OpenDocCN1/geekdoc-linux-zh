    # DISTRO Chapeau 24


    Does Chapeau do enough to stand out from the crowd of Fedora distributions?


    Chapeau isn''t a distribution that vast amounts of the Linux community will have
    some real experience with, but has been long evaluated as one of the better Fedora-based
    distributions out there. While its core is pure Fedora, Chapeau takes a fairly
    lax approach to software licensing, choosing to implement software not permitted
    under Fedora''s licensing policies. It is a trend that has proven to be a major
    part of Chapeau''s updates, and remains an integral element in Chapeau 24.


    One of the most pleasing aspects of Chapeau has its relatively simple installation
    process. This isn''t a CPU-intensive distribution, which is a pleasing nod to
    older hardware. As for those who want to push their computer a little, as is the
    case with most modern Fedora-based distributions, installation is pain-free and
    can be done in a matter of minutes on basic settings. GNOME desktop environment
    centre stage, and as ever, it remains the best environment for users to navigate
    their desktop.


    | Chapeau | Specification |

    | :--- | :--- |

    | RAM | 2GB RAM |

    | Storage | 10GB HD space |

    | Processor | 64-bit Intel x86 |


    # One of the most pleasing aspects of Chapeau has been its relatively simple install
    process


    Chapeau''s only major addition to the GNOME desktop is a selection of widgets
    that can be customized based on the size. We would have liked to have many more
    independent desktops on the desktop environment left with a fairly standard GNOME
    package.


    While the environment seems rather basic, Chapeau is a bit of good when you dig
    a little deeper. There''s an array of pre-installed packages that make the installation
    less complicated to consider than in practice usually.


    As mentioned previously, Chapeau has long against the grain when it comes to its
    choice of software. Transmission is now bound as the default torrent client and
    mines. A highly secure tool once you''ve passed its learning curve. No piece of
    software is bad, but there are better alternatives for download. There is also
    new games built into Chapeau. The two biggest additions, however, are the inclusion
    of PlayOnLinux and WINE. Both are tailored to make the process of running Windows
    programs on your Linux desktop easier, and both have ups and downs in use. WINE
    is largely tested as being as efficient as anywhere else.


    Chapeau is different from anywhere else. You''ll need to use VLC, Steam and LibreOffice
    as well as Adobe Flash and Oracle VirtualBox.


    During our time with Chapeau 24, the most notable thing is that it doesn''t really
    go against the grain of the Windows environment we''ve become used to in previous
    updates. But this is not that there is no negative here. Every part of Chapeau
    24 has been tweaked and made a bit better because of it installation.


    GNOME 2.30 is still one of the best desktop environments out there, but because
    of the lack of tweaks and added features it does feel a little bland.


    # Pros


    Hardware and software choices are the two biggest positives in Chapeau 24, both
    tailored to the user needs. It''s great for advanced users to really push their
    desktop, but beginners might find it there.


    # Cons


    GNOME 2.30 is still one of the best desktop environments out there, but because
    of the lack of tweaks and added features it does feel a little bland.


    Chapeau 24 is certainly a work worth doing, but you may look elsewhere for your
    must-have distribution.


