    然而，该项目仍有一些工作需要完成。新方法仅在内部网络可用，虽然启用 TLS 连接到 Snap Web 服务器 Nextcloud 自身的 UI 良好，但一些其他问题将在未来的更新中解决。


    扩展性实际上是值得关注的：无论是通过 SSH 连接到 Nextcloud Box 还是通过网络界面。


    扩展性实际上是值得关注的。软件主要关注文件存储和共享；桌面应用程序很棒，但当你添加更多用于扩展或备份的外部应用程序时，带宽会被共享。


    Nextcloud 的网络端口可能会成为瓶颈，软件还需要进一步打磨。


    ## 总结


    如果你正在寻找一种功能丰富且界面优的紧凑单驱动设备，这将会是你的首选。如果软件存在 Bug，Nextcloud 承诺在 Ubuntu Core 正式发布时解决早期适配者的问题。


    > Andrew Marshall


