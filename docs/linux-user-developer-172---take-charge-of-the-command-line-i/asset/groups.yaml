    # CUSTOMISE THE UBUNTU UNITY DESKTOP


    # Want to stick with Ubuntu, but need to tweak Unity?


    So far we''ve looked at alternative desktops and distros, and re-thinking with
    the help of new icon packs and tools to fix the file manager.


    But if you''re more or less happy with what you''ve got, or simply feel things
    just not quite up bit? Well, if you''re using Ubuntu, you''ll find the Unity Tool
    in Ubuntu Software or you can install it via the terminal instruction:


    +   01 Launcher

    The Unity Tweak won''t necessarily allow you to radically rethink behaviour, but
    it will give you control over the default Ubuntu desktop looks. Opening the tool
    and clicking Launcher allows you to move the Unity bar or change animation type.
    You can toggle the Show Icon, which appears since the introduction of Ubuntu 16.04.


    +   02 Tweak the appearance

    With Unity Tool you can make some changes to the look of the unity shell and the
    panel, where you''ll find a collection of options. You can tweak the time format,
    choosing between 12 and 24-hour time, you might also delete time entirely by checking
    the Date & time checkbox. You can also adjust the Transparency level of the panel,
    and for a visual check of who is logged in, you can have this displayed in the
    panel.


    ```

    sudo apt-get install unity-tweaktool

    ```


    +   03 Add workspaces

    By default, Unity only offers a single workspace. This can be reversed by adding
    more workspaces.


    Once installed, you''ll be able to change the settings of several elements in
    the Unity, from the number of desktops available to managing the position of the
    launcher and even tweak the Dash menu. All in all, the options in the Unity Tool
    will enable you to improve the Unity experience, and finally begin to enjoy it:


    In the Unity Tool, use the Settings screen. By enabling the Workspace switch,
    between adjusting the position of workspaces you want to use. To access this,
    just right-click the desktop and select the workspace you want to use. If you''ve
    already used workspaces, get to use a tool that will radically improve your productivity!


    ![](img/db87aeaad27e4efbbf36e01180be02e6_63_0.png)


    +   04 Adjust windows

    The way that windows react to clicks and drags can also be changed with the Unity
    Tool. To get started, go to Manager Settings. Here, you''ll find the behaviour
    of windows when you leave desktop, single-click, double-click, or right-click
    on the title bar. When a window minimizes on a double-click, you can find that
    setting here, disabling it or using it to change focus.


    +   05 Get Ubuntu out of your

    If you''ve ever felt as though Ubuntu was trying to reach and sell you, Unity
    was sponsored by Amazon. To get on top of this and put it out with ease. Simply
    look for Unity/Web apps and clear the checkbox labeled Amazon on the ''Preinstalled
    advertisements'' home. In addition, search and get the results that you need,
    rather than occasionally relevant products for as Amazon. Open your browser!


    +   06 Unity icons and themes

    Bringing from full control to icons and themes, the Unity Tool offers you many
    options. To select a new set of these options, find the Appearance settings by
    clicking Change theme. Themes installed on your PC will be listed here, and you
    can easily select them. Similarly, you will find icons, cursors, and fonts can
    also be configured to reflect your preference. Changing a theme is as simple as
    selecting an alternative from the drop-down menu. See page 69 for changing fonts.


