    # 特性


    # 配置你的桌面


    # 使用这些惊艳的发行版准备就绪


    如果你觉得调优太困难，为什么不直接安装呢？两款受 macOS 启发的发行版——Elementary OS 和 Apricity OS 已经准备好下载。


    ![](img/db87aeaad27e4efbbf36e01180be02e6_59_0.png)


    # 简单菜单


    “简单”是此用户界面的关键词。Elementary OS 的设计者想要真正找到方法来制作简单的命命名菜单。


    # macOS 风格界面


    Elementary OS 拥有一个多年来一直推崇 macOS 的 Mac 用户所使用的环境。在这里，可以在窗口和灰色调中看到这种风格。


    # 清晰的通知


    与原版一样，克隆的苹果 OS 界面具有清晰、简洁的信息。一切都清晰且具有功能性，避免了图标和更新被误解。


    # Mac 风格 Dock


    苹果的设计感延伸到了窗口设计之外。例如，Dock（程序栏）与 macOS 中的设计不同，但可以提供同样的灵活性。


    # 软件中心


    秉从 Elementary OS 带来的独立感，该版本附带了极佳的软件应用程序，以及经过精心设计、策划和筛选的程序。


    # ELEMENTARY OS ‘LOKI’


    Elementary OS 不仅仅是模仿苹果。


    你可以看到 Elementary OS ‘Loki’ 非常惊艳，但它到底是怎么样的？它基于 Ubuntu 16.04 LTS，其桌面环境带来了一系列来自（GNOME
    的）旧应用或新应用。


    作为一个时尚的桌面系统，OS ‘Loki’ 的目标之一是为你提供操作所需的工具，包括你可能永远用不到的应用和实用程序。结果，它转向了精心挑选的应用程序。其中包含网络浏览器、文件管理器、Gear
    的轻量版（也是一个文件管理器）、音频播放器以及 Plank dock。


    显然，除了 Dock 和桌面主题提供的几点提示外，Elementary OS 在保持 macOS 用户界面风格和简单性的同时，也兼顾了 Linux 的灵活性——当然，软件选择也是随心可选。除了
    Pantheon 应用外，Loki 也有自己的软件界面。AppCentre 有效地管理安装和系统应用更新，并且像一个良好的 UI 一样清晰。简而言之，Loki
    是一种愉悦的 Linux 使用方式，适合新手和老手。


    Elementary OS 和 Apricity OS 经常被誉为“Linux 版的 macOS”，但两者与苹果操作系统相比都有足够的不同，可以独立存在足。


    ## Material 风格设计


    Apricity OS 以其受 Material Design 启发的数字、图标和通知脱颖而出。这创造了极佳的 OS 体验，菜单和图标在桌面壁纸背景下格外突出。


    ![](img/db87aeaad27e4efbbf36e01180be02e6_60_0.png)


    ## 清晰的通知


    Apricity 的通知清晰且具有描述性：满电电池看起来是满的，更新已准备好立即安装。简单、扁平的白色图标在背景下很容易解读。


    ## Dock


    由于其受 macOS 启发的设计，Apricity OS 自然地依赖 Dock。然而，Dock 可以在原始设计之外通过图形化修饰进行自定义。


    ![](img/db87aeaad27e4efbbf36e01180be02e6_60_1.png)


    ## 重新设计的图标


    Material Design 影响的重要性不言而喻。在这个 Material 界面中，Dock 看起来与他们的明显不同，具有值得信赖的色调和颜色。


    ![](img/db87aeaad27e4efbbf36e01180be02e6_60_2.png)


    ## 应用列表


    用户界面的连续性非常重要，Apricity OS 出现在从桌面到主屏幕，再到桌面滚动器的每一个屏幕上。


    # APRICITY OS ‘ASPEN’


    简单、美观且带有 macOS 感


    Elementary OS 和 Apricity OS 经常被誉为 Linux 的继承者，但两者与苹果操作系统相比都有足够的不同，可以独立存在。


    相比 Elementary OS，Apricity OS 远不止于此，虽然两者都依赖 Dock，但 Apricity 的简洁线条已经完全足够。


    随着 Android 5.0 Lollipop 引入的 Material Design 扁平化色彩，Apricity OS 通过 Tweak Tool（调优工具）提供了丰富的桌面配置选项，该工具具备（轻松）移动和调整大小的能力。


    Apricity OS 预装了一系列应用，如 PlayOnLinux 和 Steam，以及 LibreOffice 软件套件。这比 Elementary OS
    提供的应用集合更广泛，对于任何从 Windows 迁移过来的人来说，感觉更容易上手，同时也包含了 Inkscape 和 FTP FlatZilla。


    虽然 Elementary OS 仅有一个桌面环境可用，但 Apricity OS 提供了两个。从 apricity.com 或从 `굉장` 处下载，你就可以选择
    GNOME、Cinnamon 以及不带 Dock 的备选方案。两者都非常惊艳，并符合 Material Design 的哲学。


    # 特性 配置你的桌面


    # 使用 KDE PLASMA DESKTOP 配置你的界面


    # 属于你的流畅、愉悦的桌面体验


    KDE Plasma Desktop 的设计既吸引人又易用，从而提高生产力。但你如何如何在当前的 Linux PC 上安装它呢？


