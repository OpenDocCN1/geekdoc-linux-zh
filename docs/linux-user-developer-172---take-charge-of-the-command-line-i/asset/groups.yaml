    ## 内核


    ### Linux 内核 4.7 将是最后一个系列


    现有的 4.7 用户需要迁移到 4.8


    尽管 Linux 4.8 内核已经出现段时间，但仍有很多用户迁移到 4.8 更新。在最近的公告中，内核维护者 Greg Kroah-Hartman 表示，最新的
    4.7 内核将是该系列的最后一个。该公告宣布了 4.710 内核的发布。所有的 4.7 内核都必须升级。如果最后的 4.7 内核被维护，它现在已经过时，请在此时使用
    4.8。


    对于那些希望保持 4.7 内核信心的人，新版本引入了一些改进。内核的加密框架和 ARC 架构在 btrfs 和 bccrmode2021 版本中有了明显的增强。文件系统也进行了一些改进，包括针对
    4.7 内核，特别是涵盖了一直在传播的“Dirty COW”漏洞。虽然 4.7 内核完全有用，但重要的是，它是最后一个接收安全补丁的 4.7 内核。你会发现迁移到
    4.8 内核分支可以更简单，或者说相对简单。Linux 4.7 内核可供下载。


    ![](img/db87aeaad27e4efbbf36e01180be02e6_9_0.png)


    ## 安全


    ###“Dirty COW”安全漏洞使数百万人面临风险


    近年来，网络安全出现了多个利用漏洞，但过去几周关注的那个已经存在多年。这源于红帽的一的警告，红帽表示该漏洞正在全球范围内的多个桌面上被利用。第一个发现该漏洞的安全研究人员
    Philip Oiler 在最近接受 V3 访谈时解释道，该漏洞可能被广泛使用，且频率之令人震惊。“现实中的漏洞利用是欺骗，而且多年来从未失败过。这个编译的版本允许任何本地用户访问并覆盖只写权限以获得覆盖读写权限。”


    这个被称为“Dirty COW”的内核漏洞是一个被 Torvalds 攻击的十一年老漏洞。现在是修复该漏洞的时候了。现实中的漏洞利用是欺骗系统。建议确保升级系统的安全性并密切关注您的网络。


