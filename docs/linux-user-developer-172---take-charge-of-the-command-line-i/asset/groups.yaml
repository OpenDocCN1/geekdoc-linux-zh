    # rsync(1)


    rsync - a fast, versatile, remote (and local) file-copying tool


    # NAME


    # SYNOPSIS


    Local: rsync [OPTION...] SRC... [DEST]


    Access via remote shell:

    Pull: rsync [OPTION...] [USER]@HOST:SRC... [DEST]

    Push: rsync [OPTION...] SRC... [USER]@HOST:DEST


    Access via rsync daemon:

    Pull: rsync [OPTION...] [USER]@HOST::SRC...

    rsync [OPTION...] rsync://[USER]@PORT/SRC... [DEST]

    Push: rsync [OPTION...] SRC... [USER]@HOST:DEST

    rsync [OPTION...] SRC... rsync://[USER]@HOST:PORT/DEST


    Usages with one src and no dest will list the source files instead of copying.


    # DESCRIPTION


    rsync is a fast and extraordinarily versatile file copying tool.

    Manual page rsync(1) line 1 (press h for help or q to quit)


    # DATA TRANSFORMATION WITH SED


    rsync, which stands for ''remote sync'', is a remote and local file synchronization
    tool. Makes rsync unique when it transfers files, minimizes the amount of data
    transferred between files that have changed. rsync can be used to sync directories
    on the same system, or becomes particularly useful when it''s used


    between machines over a network or the Internet. effortlessly straightforward
    configure you with SSH access to the remote machine, the command to push or pull
    directories


    So, if you need to transfer multiple files between machines, there''s likely no
    better tool than rsync to


    ```

    # rsync -a user@example_host:

    #home/username/remote|localdir

    ```


    # FILTER TEXT IN PIP


    sed is a text editor, not in the literal sense. Rather than an interactive editor
    like vi or nano, sed is used to transform text from an input stream or from a
    file, or in a single pass over the input, and is consequently powerful because
    of its ability to filter text in a pipe that it receives as input


    Sed has an exceptionally powerful syntax, such that it can initially be daunting.
    The manual is a masterpiece.


    Looking at the ''$s'' (substitute) function; we replace a line in the command


    sed s/day/oldfile.new. This replaces instances of day with new output. Simple:
    find a pattern in that''s day and replace it with a value. How to get an input
    to sed is like this:


    # FIND ITS FOR FINDING


    There are many ways to find lines in Linux, but without a doubt the best method
    is to use find. The tool has a powerful set of patterns, which can be used to
    find the command you are searching for. Even at its simplest, find is an incredibly
    effective tool, but with


    a few extra things can occur when using sed


    Fundamentally, find can search a path in patterns that matches any number of criteria
    size, filename, modified time and age. Matching items can be output to the screen
    or to a file. find has the ability to execute, -exec, any command on matched items.


    If you want to find, say, text within a file, find will be a task for you, with
    the command find -name "*text*" -exec \;


    With many of the utilities we''ve discussed, it''s best to start simple, read
    the documentation and gradually experiment with more advanced features.'
