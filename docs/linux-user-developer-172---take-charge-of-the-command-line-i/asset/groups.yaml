  mdcn: "\n\n![](img/db87aeaad27e4efbbf36e01180be02e6_94_0.png)\n\n较旧的 CD 和 DVD 驱动器在电脑支持的情况下，尝试从\
    \ USB 闪存器启动 ISO 镜像的实时启动盘需要更长的时间（也更困难！）。\n\n如今，OpenMandriva (http://www.openmandriva.org/)\
    \ 是 Mandriva 的源代码，在作为开发基础的 Mandreesoft 倒闭后已成为一个社区项目。Mandreesoft 成立的一家公司已经破产了。还有\
    \ ROSA Linux (http://rosalin.com/)，它以一种独特的方式形成了所有这些项目的基础，看看这是否合你的心意？\n\n几天后，他告诉我光盘没用。我刻录光盘时搞砸了，于是我又为他刻录了一张并进行了测试。他尝试在自己的台式电脑上安装，DVD\
    \ 驱动器发出了噪音并闪烁着。十五分钟后我们就放弃了。那是一台旧电脑，我本是想快速测试一下 Linux，看看它运行得是否比现在的电脑更好，或者是在运行哪个版本的\
    \ Windows，但如果年龄超过了特定年限，可能缺乏运行那种功能全的发行版所需的内存。不过问题可能在于硬件本身。它在闪烁并发出噪音，所以看起来确实在尝试访问光盘，但进展并不顺利。现在的\
    \ DVD 驱动器大同小异，但旧型号可能会慢，我们认为你在自己的机器上测试时你的光盘是正常的。\n\n## 慢热\n\n你好，Linux 用户，我在笔记本电脑上使用\
    \ Ubuntu。我的邻居从未见过 Linux，觉得它很酷，于是我用 Ubuntu 网站的官方 ISO 镜像为他制作了一个 Ubuntu 实时启动盘，告诉了他如何从光盘启动后就让他自己尝试了。\n\
    \n实时启动盘的设计是为了提供一种“先尝试后使用”（在 Linux 的情况下，是指考虑投入双系统启动或虚拟机）的方法，它们并不总是运行得很快，这通常由于它们运行的硬件导致。你没有提到邻居的年龄，我们可以检查你那台\
    \ 2012 年的测试机器之一，它里面有一个 16x 速度的 DVD 读写器，实时启动某些发行版可能需要几分钟，有时甚至更久。\n\nChuck B Wade\n\
