    # DesktopCEED looks to bring the Pi back into the classroom.


    Jesse Lozano tells us all about the CEED''s computing vision


    Could you give us an overview of CEED and what its key aims are?

    -pi-CEED is the world''s most affordable STEAM computer, making it easy for schools
    to use a Raspberry Pi and engage in STEAM (Science, Technology, Engineering, Math)
    - it is ready to use out of the box, come pre-assembled and pre-loaded. Our key
    aims are to provide a truly affordable computing solution that doesn''t compromise
    on quality, design or any home environment. Our aim is to provide a world-leading
    STEAM education using the quality of resources available to educators, parents
    and the world over it. With modular add-ons, students can extend its functionality
    to electronics using pi-add boards called pi-TOP.


    What role does the Raspberry Pi play in this project? And is it a vital component?

    R Raspberry Pi is the pi-CEED''s backbone (Single Board Computer) allows us to
    build the world''s most affordable all-in-one desktop. Inside not, pi-top boards
    use the Raspberry Pi to create a world-leading STEAM platform. It''s easy to set
    up and use, easy enough for the most novice of users to develop and experiment
    with.


    Using pi-top opens a world of engaging maker and game-based technology to use
    in school, at home or anywhere. Examples of educators and parents who have provided
    feedback to ensure pi-top is easy to integrate and provide a tangible impact on
    the success and learning of students across the world.


    # How it?


    Jesse Lozano explains how the CEED at Pi has made people interested in technology
    and how it can help STEAM-education around the world.


    Could you give insight into what was bundled on the CEED? Why were they chosen
    for specific?


    There are numerous reasons why pi-top is great to check out. Check out Adratut
    and the software to see just how the project was started.


