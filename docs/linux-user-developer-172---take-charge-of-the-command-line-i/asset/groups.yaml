    Apricity OS 以其受 Material Design 启发的数字、图标和通知脱颖而出。这创造了极佳的 OS 体验，菜单和图标在桌面壁纸背景下格外突出。


    ![](img/db87aeaad27e4efbbf36e01180be02e6_60_0.png)


    ## 清晰的通知


    Apricity 的通知清晰且具有描述性：满电电池看起来是满的，更新已准备好立即安装。简单、扁平的白色图标在背景下很容易解读。


    ## Dock


    由于其受 macOS 启发的设计，Apricity OS 自然地依赖 Dock。然而，Dock 可以在原始设计之外通过图形化修饰进行自定义。


    ![](img/db87aeaad27e4efbbf36e01180be02e6_60_1.png)


    ## 重新设计的图标


    Material Design 影响的重要性不言而喻。在这个 Material 界面中，Dock 看起来与他们的明显不同，具有值得信赖的色调和颜色。


    ![](img/db87aeaad27e4efbbf36e01180be02e6_60_2.png)


    ## 应用列表


