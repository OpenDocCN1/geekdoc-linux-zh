    \ In this series, we will use Python to write the code that handles everything.\n\
    \nThe simplest method is to do this via exec_command() which will allow you to\
    \ get the current uptime of the server. To avoid security issues, the host key\
    \ should have been saved in the file ~/.ssh/known_hosts. If you are only connecting\
    \ to multiple servers, there is a shortcut that automatically adds new nodes to\
    \ the hosts for you.\n\nInstall it with the following:\n\n```bash\nsudo apt-get\
    \ install python-paramiko\n```\n\nThe output will look like:\n```\n> 21:55\nusers,\
    \ load: 0.00, 0.00\n```\n\nIn the original snippet, exec_command() returns a tuple\
    \ of values for the standard input (stdin), the standard output (stdout) and the\
    \ standard error (stderr). With this method, we can call a method where the three\
    \ IO streams are joined into a single object.\n\n```python\nclient.set_host_key_policy(paramiko.AutoAddPolicy())\n\
    ```\n\nYou need to add this line before you try and make your connection. To manage\
    \ the host file, Paramiko gives you methods.\n\nA Python module that is fairly\
