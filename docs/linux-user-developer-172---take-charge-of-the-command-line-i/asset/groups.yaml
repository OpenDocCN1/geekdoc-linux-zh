    ## 开源


    您的 Linux 新闻与观点来源


    ## 观点


    ## 内核专栏


    Jon Masters 介绍了 Linux 内核社区的最新动态。对于一个新的 LTS 版本来说，Linux 4.9 是一个重大事件。


    Linus Torvalds 宣布了 Linux 4.9-rc2 内核的发布，并指出 Linux 4.9 正在成为一个重大发布。在此之前的上周标志着该周期合并窗口的结束，该版本包含的特性使其对现代
    Intel Skylake (CPU) 引入的新硬件特性的支持（我们之前介绍过该子系统，即各种设备的硬件修复），以及文档更新（与 4.8 内核相比），这些更新发现了某些问题，这些问题可能导致修复甚至回滚该特性。


    通过与 Greg Kroah-Hartman 一起运行，该内核成为一个“LTS”或“长期稳定”内核，将获得社区支持一年，并在一年后停止支持。届看到 4.9
    在未来的 Android 和 ChromeOS 版本中如何被使用将是非常有趣的。LTS 内核将维护到 2016 年底，并在 2017 年 2 月达到项目生命终点（EOL）之前接收更新。


    ## Dirty COW


    最近对一个古老内核漏洞的发现导致了我们在这个利用漏洞时代与之相联系的“肮脏利用”（filthy favor）。与其他漏洞一样，Dirty COW 是一个 CVE
    (CVE-2016-5199)，被描述为相当“肮脏”，并在技术上暴露了一个由 US-CERT（美国计算机应急响应小组）发现的本地权限提升漏洞。Dirty COW
    的核心允许任何对只读文件具有写访问权限的用户利用内存一致性机制和 PRT 代理获取 root 权限。


    Dirty COW 漏洞依赖于内核中“写时复制”（Write on copy）函数中的竞态条件，该函数在两个不同线程之间处理内存（字面意义上的“竞争”），其中一个线程尝试写入另一个线程以执行操作。当成功利用时，“竞态条件是系统中的一个小缺陷，某些代码路径会导致内核内部处于不安全（危险）状态，如果另一个线程在同一时间访问该内存，就可以被利用。这创建了一个竞态条件，导致故障可以随心所欲地操作。”


    Linux 4.9 最重新特性之一（根据 Jon Masters 的个人喜好）是支持垂直映射内核，这允许内核在内核内核时防止针对内核堆栈溢出的自动保护措施（例如，尝试从内核对无法保证原子性的内存进行
    DMA 访问）。


    写时复制（Copy on writes）意味着将文件映射到内存中作为可执行二进制文件和库文件。它不是在许多不同进程（可能代表多个用户身份）之间共享时在 RAM
    中创建私有副本，而是在被许多写入时（写入它们自己的副本）才创建文件的多个副本。例如，一台运行 Bash shell 的机器上有多个用户，并不严格要求 RAM
    中存在该执行文件的多个副本。相反，可以将单个 Bash 二进制文件作为只读内存加载，每个不同的运行版本、进程访问它们正在运行的任何部分。通常，文件控制和内核虚拟内存子系统会防止对不拥有的共享内存内容的未经授权写入。


    在最新的漏洞情况下（该漏洞实际上自 2007 年 Linux 2.6.22 起就存在），通过精心构造的调用序列（旨在告知内核应用程序未来的意图以防止错误决策，例如等），可以欺骗内核切换到一个只读映射的可执行文件（该文件可以被任何具有读取和执行权限的用户执行，但不是具有可写文件写入权限的用户），在另一个进程使用该相同区域时，通过进程（包括未命名进程）之间的竞态来实现。内核可以被欺骗将只读映射更改为任何更改文本。同时在其他新闻中，来自
    Intel 的 Tim Chen 发布了实现 Turbo Boost 技术 3.0 支持的补丁系列第 6 版本。根据 Intel 博客，此（技术 3.0 构建在
    Turbo Boost 2.0 之上，为不同硅片之间提供令人兴奋的新差异）核心（能够忍受以最高频率运行，因为在制造工艺方面并非所有核心都是平等的）内核/平台接口，例如
    CPC（或协作性能控制）。内核可以使用此信息在其他平台上选择具有最高性能要求的调度计划（任务）。


    Dirty COW 可用于破坏系统二进制文件，特别是那些具有 root 文件或允许所有用户写入其权限的文件。Linux 的特权用户拥有此类二进制文件，如果权限足够允许（例如，创建一个
    root shell），则必须能够修改其中任何一个的内容。或者，可以尝试使用用户 root 权限修改系统数据库文件。结果，“Dirty COW”可用于在任何系统上获取
