    # Chapeau 24 评测


    ![](img/db87aeaad27e4efbbf36e01180be02e6_87_0.png)


    # DISTRO Chapeau 24


    Chapeau 是否足够优秀能在众多 Fedora 发行版中脱颖而出？


    Chapeau 并不是大部分 Linux 社区成员都有过实际经验的发行版，但长期以来一直被认为是最好的基于 Fedora 的发行版之一。虽然它的内核是纯正
    Fedora，但 Chapeau 在软件许可方面采取了相当宽松的态度，选择了实施 Fedora 许可策略不允许的软件。这种趋势已成为 Chapeau 更新的重要部分，并仍然是
    Chapeau 24 中不可或缺的元素。


    Chapeau 最令人愉快的方面之一是其相对简单的安装过程。这不是一个 CPU 密集型发行版，这对旧硬件来说是一个惊喜的致意。对于那些想要稍微推电脑性能的用户（正如大多数现代基于
    Fedora 的发行版那样），安装过程毫无痛苦感，在基本设置下几分钟内即可完成。GNOME 桌面环境占据中心位置，并且如既往一样，它是用户浏览桌面的最佳环境。


    | Chapeau | 规格 |

    | :--- | :--- |

    | 内存 | 2GB RAM |

    | 存储 | 10GB HD空间 |

    | 处理器 | 64位 Intel x86 |


    # Chapeau 最令人愉快的方面之一是其相对简单的安装过程


    Chapeau 对 GNOME 桌面唯一的添加是一组可以根据大小自定义的小部件。我们本希望在标准的 GNOME 软件包中，桌面环境中有更多独立的桌面。


    虽然环境看起来相当基础，但当你深入挖掘时，Chapeau 会给你一些惊喜。有一系列预装软件包使得安装在实际操作中不像通常认为的那么复杂。


    正如前述的，Chapeau 在软件选择上一直反其道而行。Transmission 现在被绑定为默认种子客户端和矿工工具。一旦你过了它的学习曲线，它就是一个非常安全的工具。没有哪个软件是坏的，但下载有更好的替代品。Chapeau
    中还内置了新游戏。然而，最大的新增是包含了 PlayOnLinux 和 WINE。这两者都是为了让在 Linux 桌面面上运行 Windows 程序变得更简单，并且在在使用过程中都有优缺点。WINE
    在很大程度上被测试为与其他地方一样高效。


    Chapeau 与其他地方都不同。你需要使用 VLC、Steam 和 LibreOffice，以及 Adobe Flash 和 Oracle VirtualBox。


    在使用 Chapeau 24 期间，最显著的一点是它并没有真正违背我们在之前的更新中习惯的 Windows 环境。但并不是说没有负面因素。Chapeau 24
    的每一个部分都因为它的安装而被微调并变得好一点。


    GNOME 2.30 仍然是目前最好的桌面环境之一，但由于缺乏微调和新增功能，它确实有些平淡。


    # 优点


    硬件和软件选择是 Chapeau 24 的两个最大优点，都是根据用户需求定制的。对于想要极致性能的高级用户来说很棒，但初学者可能会觉得困难。


    # 缺点


    GNOME 2.30 仍然是目前最好的桌面环境之一，但由于缺乏微调和新增功能，它确实有些平淡。


    Chapeau 24 确实是一项值得尝试的工作，但你可能需要在其他地方寻找你必备的发行版。


    # 总结


    ![](img/db87aeaad27e4efbbf36e01180be02e6_88_0.png)


    # 评测


    # 免费软件


    # 3D 建模


    # Blender 2.78


    一个极其优秀的免费 3D 动画套件


    Blender 现在已作为自由开源软件存在了十五年，得益于在 Kickstarter 很久之前的开创性众筹，并且在第一个版本发布时就已经非常强大，它迅速吸引了一大才华横溢的艺术家和开发者形成了一个活跃的社区，帮助跟动画师、建模师和游戏开发者的需求。


    在此期间，从 NASA 到邪典剧集《红矮星》的制作者都使用了它。最新版本为所有人提供了改进，从物理和动画到 UI 和 VR 支持。当你等待发行版的仓库跟上时，不需要完成软件——只需下载并解压
    tar 包即可，至少这很棒，它应该可以在最近的 Gnu/Linux 发行版上运行。


    从初学者到每个人都会发现它很有用，在处理软件教程或编写全面的手册之前，可以使用一些优秀的在线教程——Varnish，或者使用 grylus.net 上 Neal
    的故事——几卷教程。


