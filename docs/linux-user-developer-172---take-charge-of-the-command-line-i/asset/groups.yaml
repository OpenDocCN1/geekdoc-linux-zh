    ## 获胜者是 ...


    ## WeChat


    在探索我们介绍的 IRC 客户端时，发现了几点：多网络聊天通道的复杂性同步工作效率远高于我们的想象。我们在每个客户端上都遇到了问题，但微信 显然是表现最好的。


    第一次打开微信会带你进入一个相当复杂的设置系统，需要大量时间才能真正适应。尽管最初存在问题，但一旦你在桌面上正确设置了微信，它就会呈现出一个非常精美的界面，并非常侧重于列表合并。聊天功能非常基础，这是
    IRC 客户端的常见功能，但自定义选项实现得很好。


    微信可以连接几个远程接口、以及基于 HTML 的 Glow，并且插件系统可以帮助添加更多功能，最显著的是无广告和自定义 CTOP 策略。深入研究后，用户还可以发现一些实用的
    UI 自定义。尽管不如插件那样


    ![](img/db87aeaad27e4efbbf36e01180be02e6_83_0.png)


    花些时间自定义每个聊天窗口并提高可读性


    尽管不如插件那样*印象深刻*，但它们仍可用于调整调色板和停靠系统的布局。虽然其他聊天功能很多，且许多功能比 IRC 稳定得多，但在将多个聊天通道合并在一起方面，没有比一个配置良好的
    IRC 更好的方案了。微信 并非完美产品，还有一些进一步的工作需要完成，但它受益于一系列出色的自定义选项，这使其成为了胜者。


    - * Oliver Hill


