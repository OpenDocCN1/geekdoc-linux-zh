    While ss allows us to see what applications are using our network connections,
    tcpdump allows us to further intercept displaying network packets or dump them
    to file.


    In its most basic format, tcpdump captures packets until you press CTRL-C to stop.
    Usually, running tcpdump prints a large amount of data, but the dump is powerful
    enough to analyze later.


    If traffic is filtered by host or IP address, or by protocol (e.g. TCP, UDP, ICMP),
