    # INTERVIEW QIN WEI


    # Meet the world’s smallest router


    Fusing the capabilities of a Linux computer and a router is impressive in itself,
    the plan is to give every budding developer all the tools they could need


    ![](img/db87aeaad27e4efbbf36e01180be02e6_11_0.png)


    Qin Wei

    Qin Wei, more commonly known as Volker in the maker community, has been developing
    the VoCore project for over a year. The second version is regarded as one of the
    best projects to date out for both new and advanced Linux users.


    > For those who may not have seen VoCore before, could you tell us what the product
    actually is?


    In short, it is a small Linux computer that boasts all the necessary tools to
    work as a smart router. For non-tech users, it can be used as a common router
    like others on a very portable scale. For advanced users, it can be used as a
    building block to connect external devices, such as a webcam, SD card and USB
    disk. All of these sorts of devices can expand and allow more of the VoCore core
    functions and features. For avid developers, they can write code to it and control
    it to do pretty much anything, just like Arduino. And for business users, it is
    a Linux computer with wireless and more power than many low-end desktop PCs. So
    far, we''ve seen it used by our early adopters to develop new gadgets, such as
    wireless water meters, wireless power meters and e-ink displays. We''ve even seen
    it used as an anti-hack tool to shield potential network attacks. So as you can
    see, it''s a multifunctional product built for all audiences.


    What are the key features of the VoCore2?

    We like to think of it as small but complete. While


    ![](img/db87aeaad27e4efbbf36e01180be02e6_12_0.png)


    ![](img/db87aeaad27e4efbbf36e01180be02e6_12_1.png)


    ## VoCore v2 Pin

    Release: 2016/5/26


    ## Getting tech with the VoCorev2


    It''s not much so that it''s not 50 per cent smaller than smart routers, but manages
    to pack in far more features than any of its bigger rivals. We''ve added things
    like audio input and output to help stand out.


    One of the most startling things about the VoCore2 is its size. In fact it is
    only 25.4 x 25.4 mm, the smallest smart router ever. Despite its size, it still
    manages to pack in a lot of tech that closely rivals some of the most recognized
    routers out there. At core is the MT728AN CPU, working 128MB of DDR RAM. For most
    users, this is more than enough for some basic development, but there''s plenty
    of room to expand on if necessary. Despite some constraints with the available
    antennas, the VoCore2 manages to transmit 300Mbps wireless internet speeds. It
    also has Ethernet, USB, SD, SPI, I2C and 40 GPIO pins. Its main use will be to
    function as a portable router, with the accompanying software guides written in
    C, Java, Python, and JavaScript.


    ### What makes it unique from other smart routers currently so far?


    We were thrilled with packing everything into such a small frame? First, the VoCore
    used to heat up, and in a small space, it is hard to cool the chip. A hot metal
    shell acts as heat sink to cool the chip. The second issue was across the antenna.
    We couldn''t leave enough for a perfect antenna match circuit, so we took the
    time to carefully calculate every parameter, redesign the match circuit again
    and only left the absolutely necessary bits to contain two antennas with excellent
    signal.


    > It is totally, absolutely open-source. Its SCH and PCB are free for personal
    or commercial use and also free to copy.


    We would like to add that it is as affordable as cheaper products. Finally, we
    came across a lot of noise, so in a small space, signals would easily fight against
    one another. We designed the deck ports (USB, Ethernet and etc.) to be useful
    every possible way and make them do their job without crosstalk. Apart from that,
    there weren''t many issues with us


    ![](img/db87aeaad27e4efbbf36e01180be02e6_13_0.png)


    # Take a closer look at VoCore''s docking system


    While the VoCore2 is an impressive piece of kit by itself, the usability is taken
    to the next level when using it in tandem with one of the available docks. The
    Ultimate-Dock is also an impressive piece of kit, and dramatically enhances the
    feature set of the VoCore2. Not only does it manage to cram in microSD, Ethernet
    and USB 2.0 ports into its tiny frame, but it also contains a four-channel AD
    converter and a single channel DAC. Although they need to be purchased separately.
    Early developers will need an on-board, drive-free port to USB, a hand to help
    around.


    Due to its size, you won''t find any bulky batteries for power. However, the Ultimate
    Dock is powered by the VoCore so no charge is needed. It benefits from very little
    power, so a power bank will also do the trick. On the other side of the spectrum
    is the Audio Dock, which opens up the VoCore''s audio capabilities. One of the
    most startling things about the VoCore2 is its size designed to build your knowledge,
    and tips on how to use Python with the Raspberry Pi - everything you need to master.

