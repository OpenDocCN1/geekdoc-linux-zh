    简单来说，它是一个微型 Linux 计算机，拥有作为智能路由器所需的所有必要工具。对于非技术用户，它可以像其他普通路由器一样使用，且非常便携。对于高级用户，它可以作为构建基块来连接外部设备，如摄像头、SD
    卡和 USB 磁盘。所有这些类型的设备都可以扩展并释放更多 VoCore 的核心功能和特性。对于狂热的开发者，他们可以向其编写代码并控制它执行几乎任何任务，就像
    Arduino 一样。对于商业用户，它是一台带有无线功能且比许多低端桌面电脑更强大的 Linux 计算机。目前为止，我们看到早期采用者用它开发了新设备，例如无线水表、无线电表和电子墨屏。我们甚至看到它被用作反攻击工具来防御潜在的网络攻击。所以正如你所见，它是为所有观众构建的多功能产品。


    VoCore2 的关键特性是什么？

    我们喜欢将其认为是“小而全”。虽然……


    ![](img/db87aeaad27e4efbbf36e01180be02e6_12_0.png)


    ![](img/db87aeaad27e4efbbf36e01180be02e6_12_1.png)


    ## VoCore v2 引脚

    发布日期：2016/5/26


    ## 使用 VoCorev2 获取技术


    它的体积并不大，至于没有比智能路由器小 50%，但它成功集成了比其任何更大的竞争对手都多的功能。我们增加了音频输入和输出等功能以帮助脱颖而出。


    VoCore2 最令人惊讶的事情之一是它的尺寸。事实上，它只有 25.4 x 25.4 毫米，是世界上最小的智能路由器。尽管体积很小，它仍然成功集成了许多技术，足以与市场上一些最知名的路由器相媲美。核心是
    MT728AN CPU，配备 128MB DDR 内存。对于大多数用户来说，这对于基础开发已经绰绰有余，但必要时有足够的空间进行扩展。尽管可用天线受到某些限制，VoCore2
    仍然能够传输 300Mbps 的无线网络速度。它还有以太网、USB、SD、SPI、I2C 和 40 个 GPIO 引脚。它的主要用途是作为便携式路由器，配套的软件指南使用
    C、Java、Python 和 JavaScript 编写。


    ### 它与目前的其他智能路由器有何不同？


    我们对将一切都装进如此小的框架内感到非常兴奋。首先，VoCore 曾经会发热，在狭小的空间内很难冷却芯片。金属外壳充当散热片来冷却芯片。第二个问题是跨天线。我们无法为完美的天线匹配电路留出足够的空间，因此我们花时间仔细计算每个参数，重新设计了匹配电路，仅留下了绝对必要的位来包含具有良好信号的双天线。


    > 它是完全、绝对开源的。它的原理图和 PCB 个人或商业用途免费使用，也可以免费复制。


    我们想补充一点，它的价格和廉价产品相当。最后，我们遇到了很多噪声，因此在小空间内，信号很容易相互干扰。我们设计的底座端口（USB、以太网等）使其在所有可能的情况下都有用，并确保它们在不产生串扰的情况下工作。除此之外，我们没有遇到什么问题。


    ![](img/db87aeaad27e4efbbf36e01180be02e6_13_0.png)


    # 进一步查看 VoCore 的底座系统


    虽然 VoCore2 本身是一个令人印象深刻的设备，但当与可用底座之一配合使用时，其可用性就到了另一个高度。Ultimate-Dock 也是一个令人印象深刻的设备，极大增强了
    VoCore2 的功能set。它不仅成功在其微小的框架内挤入了 microSD、以太网和 USB 2.0 端口，还包含了一个四通道 AD 转换器和一个单通道
    DAC。尽管它们需要单独购买。早期开发者需要一个板载的免驱动转 USB 端口来提供帮助。


    由于尺寸限制，你找不到任何笨重的电池供电。然而，Ultimate Dock 由 VoCore 供电，因此不需要充电。它受益于极低的功耗，所以使用电源移动也可以也可以。另一端是
    Audio Dock，它开启了 VoCore 的音频功能。VoCore2 最令人惊讶的事情之一是它的尺寸，旨在构建你的知识，以及关于如何在树莓派上使用 Python
    的技巧——你掌握所需的一切。


    '
