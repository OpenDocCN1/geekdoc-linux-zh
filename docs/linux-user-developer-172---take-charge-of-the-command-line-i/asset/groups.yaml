    # Tutorial


    # Get the new Pixel desktop


    Explore Pixel, the new official desktop environment for the Raspberry Pi


    ![](img/db87aeaad27e4efbbf36e01180be02e6_73_0.png)


    Nate Drake is a freelance tech journalist specialising in cybersecurity and retro
    tech. He is proud to announce that after writing over 50 tutorials he has acquired
    a Raspberry of his own and has stopped borrowing.


    # What you''ll need


    +   - Raspberry Pi

    (Model Pi 2 or 3 if you want to use Chromium for streaming video)

    - If installing Raspberry from scratch, 8GB Micro SD card

    - Access to a computer connecting via SSH and/or to install Raspberry with Pixel


    ![](img/db87aeaad27e4efbbf36e01180be02e6_73_1.png)


    Pixel (Pi Improved Windows Environment, Lightweight), is the latest iteration
    of Raspberry. The major changes are apparent the first time you boots replaces
    replaces simple splash screen with release notices.

    There are 16 stunning desktop backgrounds to choose from Pi Foundation developer
    Greg Annadale. The icons on the file manager, task bar and menu have a crisp,
    professional appearance. They are also cleaner and more readable as icons no longer
    appear by default.

    The rather chunky windows we knew in Raspberry have been replaced with rounded
    corners and a modified title bar. The infinity palette makes for much cleaner
    rendering.

    Beyond the hood, RealVNC Server is now bound to allow you to select VNC from the
    interfaces menu, then via a viewer. There is also a provisional release of Chromium
    for the Pi, which in combination with the h264if plugin uses the Pi''s hardware
    to decode video.


    ![](img/db87aeaad27e4efbbf36e01180be02e6_73_2.png)


    # Manual upgrade to Raspberry


    If your Raspberry Pi has an installation of Raspberry Jessie, you can update to
    the latest version of Raspberry with Pixel by opening Terminal or connecting via
    SSH and running the commands:


    ```

    sudo apt-get update

    sudo apt-get dist-upgrade

    ```


    The upgrade will take some time. You''ll see a message about the layout I/o processing;
    press Enter to finish and proceed.


    # 03 Install Chromium


    The latest version of Chromium includes an initial release. As we''re performing
    a manual upgrade, use this with the command:


    ```

    sudo apt-get install -y raspberry-chromium

    ```


    Chromium comes bundled with the previously mentioned h264if extension, which forces
    you to use the Pi''s hardware acceleration when streaming videos. The adblocker
    origin is also bound to strip out resource-hungry adverts.


    | FORUM | FORUM | FORUM |

    | --- | --- | --- |

    | Raspberry JESIE | Raspberry JESIE | Raspberry JESIE |

    | RASPBERRY PI WITH PIXEL | RASPBERRY PI WITH PIXEL | RASPBERRY PI JESIE |


    # 01 Choose your method


    There are several ways to install Raspberry with Pixel. If you have Raspberry
    with NOOBS, you can restart your Pi holding Shift to restart. This will update
    you to the latest version using Pixel but will also wipe your installation. Alternatively
    you can download the Raspberry Image from https://raspberry.org and follow the
    instruction at https://documentation/installation/images/README.md if you use
    any of these methods, skip to Step 5.'
