    \ to 'python-paramiko'. This also installs the modules that support cryptographic\
    \ operations. You can now use it prepared with the following:\n\n```python\nimport\
    \ paramiko\nclient = paramiko.SSHClient()\nclient.set_missing_host_key_policy(paramiko.AutoAddPolicy())\n\
    client.connect('192.168.1.10', username='pi', password='raspberry')\nclient.save_host_key('/home/pi/.ssh/known_hosts')\n\
    ```\n\nOn some occasions this piece of code may not work. It depends on whether\
    \ you have already connected to the external server via SSH. If you have, then\
    \ you can reload this host file by using the following code segment: This script\
    \ works for simple, but what if you have a more complicated command that requires\
    \ interaction? An example is access to root. Your user account will be cached,\
    \ and you'll need to be able to provide password when asked. Luckily, the host\
    \ key method will let you in with the required password. In is the required code\
    \ which will send you the required input to get the output from the command:\n\
    \n```python\nstdin, stdout, stderr = client.exec_command('sudo uptime', get_pty=True)\n\
    stdin.flush()\ndmsg=stdout.read().split()\n```\n\nSo, now we have an SSH connection\
    \ to the server you want to monitor. What can you do with this? If you want to\
