    \n```\n\n# Mesa 称为 Jar-Jar Binks\n\n如果你的程序包含 20 个类，由于失去控制的习惯，独立文件会变得有问题，寻找文件将成为一项困难且令人厌的任务。部署\
    \ JAR 归档 —— 类的集合以及描述其内容的清单文件。\n\n从 Java 运行时环境启动第三方程序只需三行代码。使用运行时 `exec` 函数，它接收要执行的程序或程序的路径，然后等待进程直到执行完成。\n\
    \nEclipse 可以以极少的努力生成 JAR 文件。该过程从点击 File/Export 并选择你的可运行文件（Runnable File）开始。你指定正在执行的类，它将被用作清单文件。通过\
    \ Export 目录指定存储目标后，点击 Finish 按钮。调用 JAR 文件中包含的代码像调用独立类一样完成。最重要的一点是，你现在必须向 Java\
    \ 传递文件名。\n\n程序的很大一部分专门用于处理你的 shell 脚本。我们使用 `BufferedReader` 类来从运行时流中获取数据：\n\n\
    # java-Untitled jar\n\n# 向一个方向\n\n```java\nStringBuffer output = new StringBuilder();\n\
    BufferedReader reader = new BufferedReader(new InputStreamReader(proc.getInputStream()));\n\
