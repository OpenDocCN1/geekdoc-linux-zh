- md: "\n# Tutorial .NET Core and Docker\n\n## Realise a microservice architecture\
    \ with ASP.NET Core and Docker\n\n![](img/db87aeaad27e4efbbf36e01180be02e6_37_0.png)\n\
    \nLearn how you use ASP.NET to develop .NET-based microservices in Linux, from\
    \ zero to a running container\n\nASP.NET represents the new thing in the world\
    \ of .NET. Microsoft, with an engaged open source community, has realized web\
    \ application framework that has been harnessed in a variety of ways, to develop\
    \ .NET-based microservices. Leveraging the Docker approach and containers for\
    \ easy deployment and scaling of web APIs in C# is now possible.\n\nTo get started,\
    \ fire up the Yokohama shell prompt as such:\n\nThis article will introduce the\
    \ key aspects of developing RESTful web APIs with ASP.NET Core, as well as some\
    \ practical tips about how to deploy them in a Linux context. To demonstrate microservices\
    \ in development, the cloud will be handled.\n\n![](img/db87aeaad27e4efbbf36e01180be02e6_37_1.png)\n\
    \n- .NET SDK (which offers support for most Linux)\n- Docker command-line project\
    \ generator to create C#-based web APIs\n- VM (developed with OpenARP to support)\n\
    - Docker and docker-compose command-line tools to ASP.NET Core contains with the\
    \ web API copied.\n\nStarting at the top-level menu of the ASP.NET Core generator\
    \ for Yokohama, select Web API option and proceed to enter the following project\
    \ name:\n\n## MyWeatherApi\n\n### Code the ASP.NET Core web API Implementation\n\
    With the scaffold of the web project generated, we are going to define a short\
    \ endpoint that supports the queries of temperature, current day, and how for\
    \ the day.\nclass WeatherController : inherit from Controller.\nThe API implementation\
    \ will include a GetTemperatureDetail. This method will call out to the client\
    \ helper open WeatherReporter to return the real-time temperature associated with\
    \ the city.\n\nKevin Winter is a software technologist and it manager at Mining\
    \ companies. He enjoys Linux and has built many Nie, particularly with C#.\n\n\
    ## Resources\n\n### .NET for any platform\nGet Started with ASP.NET Core\n\n###\
    \ Yokohama Generator\nhttp://bit.ly/z3okk\n\n### Yokohama Generator for For Docker\
    \ and Scripts\nhttps://docker.io/docker\n\n### Docker\ndocker.io\nDocker image\
    \ repository for ASP.NET Core\n\n### Kubernetes\nkubernetes.io\n\nOpen the Map\
    \ API\nhttp://bit.ly/2fdf64\n\n### Author's GitHub project span\nhttp://bit.ly/2cck8p\n\
    \n## 02 Generate the skeleton of an ASP.NET Core project\n\nTo begin a skeleton\
    \ of an ASP.NET Core web project using the Yokohama command-line-generator, follow\
    \ the example from the previous article on ASP.NET and review the OpenMapper to\
    \ implement an RESTful web\n\n![](img/db87aeaad27e4efbbf36e01180be02e6_37_2.png)\n\
    \nAbove: A blueprint for microservice architecture based the the ASP.NET Core\
    \ stack using .NET web based APIs. This blueprint details Docker and container\
    \ management to realise a scalable service architecture and a consistent, debug\
    \ robust deployment model.\n\nThe route of the API is defined using Attribute\
    \ Route in case, the base of this API is weather/city, as is is bound to the WeatherController\
    \ class.\n\nThe method is named GetTemperatureDetail with the HTTP annotation.\
    \ In addition, the path is augmented to include 'temperature' and parameter to\
    \ accept the city string as input. So, the path is ended to weather/city/temperature/{city}.\n\
    \nFrom a RESTful web, this can be created as result:5000/weather/city/temperature/london.\n\
    \nThe real-time data is encapsulated in the JSON Object, which conforms to the\
    \ ActionResult interface. This object is returned as JSON and parsed by the web\
    \ back to the consumer RESTful client.\n\nThe code below represents how the Controller\
    \ can be highlighted in this particular article. You can find example in your\
    \ favourite programming or expand or down the source examples for this article\
    \ in FileOs.\n\n```csharp\n[Route(\"api/{controller}\")]\npublic class WeatherController\
    \ : Controller\n{\n    [HttpGet(\"temperature/{cityLocation}\")]\n    public IActionResult\
    \ GetTemperature(string cityLocation)\n    {\n        var reporter = new OpenWeatherReporter();\n\
    \        var weatherReport = reporter.GetWeather(cityLocation);\n        return\
    \ new ObjectResult(weatherReport.Temperatures);\n    }\n}\n```\n\nFact to mark\
    \ each executable test method. The Assert class has a variety of assertion methods\
    \ including Boolean, equity and range. To realise integration-based unit tests\
    \ that execute assertions, use the assertion that checks the returned temperature\
    \ data is within the expected range.\n\n```csharp\nusing XUnit;\n[Fact]\npublic\
    \ void WeatherReportTemperatureInExpectedRange(\n    string city = \"Chicago,IL\"\
    )\n{\n    var reporter = new OpenWeatherReporter();\n    var weatherReport = reporter.GetWeather(city);\n\
    \    Assert.InRange(weatherReport.Temperature, -15, 85);\n}\n```\n\nThe object\
    \ serialised as JSON represents the Temperature type, which is defined as:\n\n\
    ```csharp\npublic class Temperature {\n    public double Current { get; set; }\n\
    \    public double High { get; set; }\n    public double Low { get; set; }\n}\n\
    ```\n\n## 03 Generate the xUnit test\nThe ASPNET Core generator allows scaffolding\
    \ of test classes. To use this capability of your project, create a test library\
    \ (or assembly) to test the business logic that backs the API. The setup included\
    \ in this step requires you to update the project dependencies of the test file\
    \ and reference the MyWeatherApi project, as shown below:\n\n```json\n{\n  \"\
    version\": \"1.0.0\",\n  \"tester\": \"xunit\",\n  \"dependencies\": {\n    \"\
    MyWeatherApi\": \"1.0.0\",\n    \"dotnet-test\": \"2.2-preview\",\n    \"xunit\"\
    : \"2.0-beta\"\n  }\n}\n```\n\n## 05 Build the api project and run the tests\n\
    With the source project and test classes developed, back to the shell and use\
    \ the dotnet command to build the project and run the tests. The dotnet command-line\
    \ program provides support. For code-first development, the following commands\
    \ are used: dotnet restore restores the dependencies, dotnet builds the project,\
    \ and dotnet test runs the xUnit tests.\n\n## 06 Optimize Dockerfile for the api\
    \ project\nThe Dockerfile was created as part of the ASPNET Core generator. You\
    \ can now test this by spawning a container on your host. The web will serve the\
    \ default behaviour and accept any host binding. Since persistence is not required\
    \ for this example, the Dockerfile can be reduced to the following:\n\n```dockerfile\n\
    FROM mcr.microsoft.com/dotnet:latest\nAS ASPNET_CORE_ENV\nWORKDIR /app\nCOPY .\
    \ ./\nRUN [\"dotnet\", \"restore\"]\nRUN [\"dotnet\", \"build\"]\nEXPOSE 5000\n\
    WORKDIR /app/publish\nENTRYPOINT [\"dotnet\", \"run\", \"--server.urls=http://\"\
    ]\n```\n\n## 04 Run the xUnit tests\nYou are now ready to run the xUnit test class\
    \ that will execute and verify the behaviour of the business logic which opens\
    \ the OpenWeather service. Use the annotation for scaling of web APIs developed\
    \ in C#.\n\n## 07 Quickly scale your microservices using strategy\nThe Dockerfile\
    \ in the previous step provides the definition of a single Docker container. To\
    \ realise a microservice strategy, you need to leverage tooling in the Docker\
    \ space that can manage multiple containers. Docker compose is one such tool that\
    \ can be used to orchestrate the deployment of web apps and web APIs across several\
    \ containers. Here is an example of Docker compose:\n\n![](img/db87aeaad27e4efbbf36e01180be02e6_39_0.png)\n\
    \n```bash\ndocker-compose -f aspnet-core-webapis.yml -h http://10.x.y.z build\n\
    ```\n\nThe result of the above command will be a Docker image that is built and\
    \ copied to the target server. In this example, Docker communication occurs over\
    \ the unsecured default port. However, secure communication is possible using\
    \ TLS and a certificate-based configuration. By default, port 2376 is reserved\
    \ for secure communication.\n\n```yaml\nversion: '2'\nservices:\n  aspnetwebapi:\n\
    \    image: my-docker-id/aspnet-core-repo-my-web-api-1\n    environment:\n   \
    \   ASPNETCORE_URL=\"http://*:5000\"\n    ports:\n      - \"80:5000\"\n    dockerfile:\
    \ Dockerfile\n    # Set the environment variables\n    ASPNETCORE_URL=\"http://*:5000\"\
    \n  aspnet_runtime_only:\n    image: microsoft/dotnetcore\n```\n\n## 09 Push to\
    \ a Docker repository\nRather than using explicit tags, the best approach is to\
    \ distribute images to a repository (such as hub.com). This Docker image can be\
    \ pushed to a local environment. To accomplish this, use the docker push command.\
    \ An easy way to start using a Docker repository is to push your Docker image\
    \ to hub.com using your registered account. The login command will prompt you\
    \ for your ID and password, and push will upload the image to the repository.\n\
    \n```bash\ndocker push my-docker-id/aspnet-core-repo-my-web-api-1\n```\n\nDocker\
    \ compose supports a structure that allows multiple Docker images to be merged.\
    \ For example, a group of Docker-based microservice deployment configuration,\
    \ the composition syntax will have a structure similar to the following:\n\n-\
    \ services\n  - aspnetwebapi\n    image: my-docker-id/aspnet-core-repo-my-web-api-1\n\
    \  - aspnetweb2\n  - aspnetweb3\n  - aspnetweb4\n\nOnce the image is built or\
    \ downloaded, you can use the docker run command to launch the container. Note\
    \ the port mapping specification in the Docker run command. You can use this command\
    \ syntax to access the Web API Docker image connection to a running container:\n\
    \n```bash\ndocker run -p 80:5000 my-docker-id/aspnet-core-repo-my-web-api-1\n\
    ```\n\n## 10 Document Web APIs with Swagger\nSwagger is a popular technique to\
    \ document RESTful APIs. The Web API with Swagger provides the ability to invoke\
    \ RESTful APIs that appear in the interactive documentation. This type of meta-documentation\
    \ integration can be especially useful in development and quality assurance. To\
    \ realise Swagger with .NET Core, you can create a new web project. The integration\
    \ requires three simple steps: JSON configuration and C#. The details of the technical\
    \ integration are provided here and in the example source project available download\
    \ from the Linux User & Developer site of FileSite or the cover.\n\n## 08 Build\
    \ the Docker image\nTo build Docker images using Docker compose, specify the build\
    \ argument.\n\n(Wait, checking text flow...)\nYou also have the option to build\
    \ a Docker image and deploy it to a remote host environment. To realise this,\
    \ use the -H command-line argument of Docker compose as follows:\n\n(a) Add the\
    \ following to the project.json file (as the Swashbuckle\n"
  mdcn: "\n\n# .NET Core 和 Docker 教程\n\n## 使用 ASP.NET Core 和 Docker 实现微服务架构\n\n![](img/db87aeaad27e4efbbf36e01180be02e6_37_0.png)\n\
    \n学习如何使用 ASP.NET 在 Linux 中开发基于 .NET 的微服务，从零到运行容器。\n\nASP.NET 代表了 .NET 世界的新事物。微软通过其活跃的开源社区，实现了一个\
    \ Web 应用程序框架，该框架已通过多种方式用于开发基于 .NET 的微服务。现在，利用 Docker 方法和容器对 C# 中的 Web API 进行轻松部署和扩展已成为可能。\n\
    \n要开始学习，请如下所示启动 Yokohama 终端提示符：\n\n本文将介绍使用 ASP.NET Core 开发 RESTful Web API 的关键方面，以及关于如何在\
