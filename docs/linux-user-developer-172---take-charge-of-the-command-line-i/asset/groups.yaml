    发生了变化——大多变得更好了——自那以后变化了很多。遗憾我错过了那时最喜欢的 Linux 版本。Mandrake 发生了什么？


    Brad Kristofferson


    既然我们已经回来了，Mandrake 是一个始于 1998 年的 Linux 版本，在当时是最受欢迎的版本之一，任何人都可以使用并安装。如果你落后了信息，我可以帮你追溯发生了什么。Top
    Hat 拥有了 Mandrake 的商标后，在 2004 年，它的名字被更改为 Mandriva，这是因为 Mandrake 的原名对漫画《Mandrake
    the Magician》构成了侵权，Top Hat 转向了《Defenders of Earth》的角色。之后，母rake 变成了一家法国公司，生产葡萄牙语和西班牙语的
    Linux 版本。后来公司将产品名称更改为新的 Mandriva。Mandriva 的最后一个版本是 2011 年 2 月，项目就此结束。但别难过！对于你和其他
    Mandrake 用户，Mandrake 本身落为了几个目前支持的发行版。


    ![](img/db87aeaad27e4efbbf36e01180be02e6_93_0.png)


    关于 Linux 认证


    Linux 认证帮助你精通对你的职业至关重要的领域。我们已经参加了一些，以下是我们的经验。


    ## 获取认证


    你好 Hugo，

    我正考虑将职业转向 IT 领域，我发现 Linux 是值得的。我在使用 Mint、Fedora 和 Ubuntu 方面有一些经验，但我没有可以展示的、迈向微软认证的
    Linux 认证。然而，我担心投入的时间是否值得。我可能在面试中证明我学习了某些雇主可能需要的技能吗？


    Trevor Caring


    你对的，Trevor——像许多公司一样，无论大小，在服务器上处理 Linux 都需要开源，越来越多的招聘人员倾向于在简历上看到资质。好消息是，在开源领域，存在与
    MCP 和 IT 领域同等重要的标准化认证。许多公司提供不同的课程和培训计划——寻找在线课程的好地方是 https://www.mooc-list/tags/linux，它列出了
    MOOC。


    大规模开放课程（MOOC）涵盖了 EdX 等平台。如果你想从新手开始并参加一个 Linux 等同于 MCP 的课程，Linux Foundation 提供了两种你想专化的方式。Linux
    Foundation 认证课程 (https://linuxfoundation.org/certification/) 是基础知识水平的首选。它可以在 12
    个月内完成，并且是 100% 自学。建立在结构上的 Sysadmins 认证适用于 Linux Foundation 认证工程师 (https://linuxfoundation.org/certification/)
    是更高级的选项，范围更广、深度更深，因此我们建议你在转向更高级选项之前先选择 Sysadmins 选项。


    ## Mandrake 根


    你好 User，

    我上一次在 90 年代仔细玩 Linux。现在我回来了，似乎是时候再次看看它了，现在我有时间仔细探索了。一切似乎


