  mdcn: "\n\n# Ubuntu 管理教程\n\n仅查看与特定用户相关的进程。\n\n```\n$ top -n 10\n```\n\n这将在退出前刷新屏幕十次。\n\
    \n```\n$ top -b\n```\n\n以批处理模式运行。注意，在此模式下，`top` 命令的输出将格式化为适合输出到文件。这基本上用于创建进程日志。让我们在这里看一个例子。\n\
    \n```\n$ top -b 30 -o mylogs\n```\n\n这会运行 `top` 并记录 30 次输出。\n如果你需要查找有关如何使用 `top`\
    \ 命令的更多信息，可以在会话期间输入 `?`。如所述，主页提供了许多关于如何使用它的信息。你也可以输入 `q` 退出。\n让我们关注于在 Ubuntu 上查找和控制进程。控制进程涉及两个方面：找到你需要更改的进程，以及修改进程优先级或向进程发送信号以更改其行为。\n\
    \n当我们寻找特定的进程时，在大量的进程列表中找到它可能是一项繁琐的工作。在这种，`ps` 命令将非常有用。该命令提供了在进程中搜索你正在寻找的内容的方法。该命令允许你更改进程的优先级。而像\
    \ `kill`、`killall` 和 `pkill` 等命令将允许你向运行中的进程发送信号。\n让我们看看如何使用最简单的形式，搜索命令名称并产生包含该名称的任何进程的\
    \ ID。\n\n```\n$ pgrep init\n```\n\n这显示了包含 'init' 字符串的任何进程的 PID。\n由于我们知道只有一个 `init`\
    \ 命令，可以使用 `-l` 选项显示进程名称。\n\n```\n$ pgrep -l\n```\n\n这显示了包含 init 的进程的 PID 和名称。\n\
    使用 `pgrep` 命令最流行的方法是找到运行中进程的 PID，然后将这些 PID 管道到另一个命令以产生输出。\n我们还有另一种查看特定进程的方法，就是访问它。`fuser`\
    \ 命令可以找到当前哪些进程拥有文件或套接字（socket）。一旦我们找到了进程，可以使用 `fuser` 命令向这些进程发送信号。你可以使用该命令查找文件是否正被进程打开。你将能够正确地关闭它们，以便安全地删除文件。\n\
    以下是在命令行中使用此命令的几个示例。\n\n```\n$ fuser -m\n```\n\n![](img/db87aeaad27e4efbbf36e01180be02e6_43_0.png)\n\
    \n- - 当前目录\n  1234\n- 文件以写模式打开\n  5678\n- 文件以默认模式打开\n  9012\n\n非零返回码表示其中一个进程正在使用该文件。输出显示了使用该文件的进程\
    \ PID。该命令可以使用不同的标志来更改输出。例如，`-v` 标志将显示用户、命令和授予的访问类型。\n\n# 上述查看 fuser 命令\n\n这将列出所有支持的进程。\n\
