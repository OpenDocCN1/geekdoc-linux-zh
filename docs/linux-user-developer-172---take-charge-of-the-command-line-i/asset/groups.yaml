    \ of profileFib.go have slightly different implementations calculating the same\
    \ thing - the purpose of this profiling process is to find out which if statements\
    \ in Fibo2 make it slower. In order to be able to profile your program you should\
    \ define a Benchmark function, which is part of the testing - you will learn more\
    \ about it in while. The definition of the Benchmark function, as found in the\
    \ main_test.go file, is:\n\n```\nfunc BenchmarkFibo2(b *testing.B) {\n  for i\
    \ := 0; i < b.N; i++ {\n    for j := 0; j < 40; j++ {\n      fmt.Printf(\"%%d\
    \ = %d\\n\", j, Fibo2(j))\n    }\n  }\n}\n```\n\nPlease note that the names must\
    \ be marked with the name of the test followed by an underscore and the 'test'\
    \ suffix.\n\nA benchmark should begin with Benchmark followed by a name that starts\
    \ with a capital letter. The parameter of the function should be of the type *testing.B.\
    \ The function calculates the benchmark time by calling the function many times.\
    \ The number of times is estimated based on your machine as well. Go starts with\
    \ small values of N before deciding the value of N. In this case, N will be set\
    \ to 1 by the go test command command.\n\nKeep in mind that when you run go test\
    \ it performs CPU and blocking profiling. The first one records the CPU time,\
    \ the second one records the blocking profile for memory allocation, and the last\
    \ one records the operations that are responsible for grounding bottlenecks.\n\
    \nFigure 6 shows a simple profiling example where Go GraphView shows the profiling\
    \ data from profileFib.go. However, we need to gather the required information\
    \ and then analyze it using the pprof tool.\n\n```\n$ go test -run=Benchmark -BenchmarkFibos\n\
    -cpuprofile=cpu.prof\n```\n\n| 78963407 ns/op |\nPASS\n| /fullDirectory/path/code\
    \ 2.361\n| ok  -1=r -r --timeout 1ms mseek 42712 Sep 29\n23:06 CPU | go tool pprof\
    \ - /profile.test CPU.log\n\nThe last command created allows you to view in your\
    \ web browser. As you can see, Fibo(4) takes 134ms to execute while Fibo(5) takes\
    \ 350ms to execute, which is significantly slower than Fibo(4).\n\n```\n$ go tool\
    \ pprof -profile.test CPU log\n```\n\nAlternatively you can use an interactive\
    \ shell for profiling:\n\n```\n$ go tool pprof /profile.test CPU log\nEnter interactive\
    \ mode (type \"help\" for commands)\n(goprof)\n```\n\nAs always, use a slow algorithm\
    \ to find out why your programs are running using the Go profiler - use a faster\
    \ algorithm!\n\n# The Go testing package\n\nGo comes with a built-in framework\
    \ that is supported by the testing package and the go test command. The testing\
    \ package is supposed to be used in combination with go test. To test your application\
    \ with the go test command, which can be revealed by looking at main_test.go from\
    \ the previous section."
