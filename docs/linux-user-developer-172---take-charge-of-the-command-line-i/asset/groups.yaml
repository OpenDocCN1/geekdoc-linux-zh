    \ of Docker image size is important in point of context.\n\n```docker\nFROM microsoft/dotnet:core\n\
    ```\n\n# 12 Live with NGINX\n\nKestrel is the high-performance HTTP server that\
    \ is included as part of ASNET Core technology for cross-platform hosting. This\
    \ web server is a new, and with the release of 1.0, it is clearly better than\
    \ Kestrel over features, claiming better security. The net result is used with\
    \ HTTP engine that can serve well over a million requests per second.\n\nOr you\
    \ can select Docker image with the variation:\n\n```docker\nFROM microsoft/dotnet:version-\n\
    ```\n\n# Yeoman and Docker\n\nMicrosoft Image-Generator on GitHub as an open source\
    \ project. This generator supports Docker image generation for ASNET Core and\
    \ helps you use this generator to build a Docker image that is more optimized\
    \ for ASNET Core application, so if you prefer Yeoman standard of Docker or other\
    \ Docker commercial needs, it might be the tool for you. It also generates Bash\
    \ and PowerShell scripts to drive the Dockerchain, so it is worth checking out:\n\
    \n# Tutorial\n\n# Ubuntu system management\n\n# Manage processes in Ubuntu\n\n\
    ## Take a deeper look at process on Ubuntu\n\n![](img/db87aeaad27e4efbbf36e01180be02e6_41_0.png)\n\
    \n| USER | PID | %CPU | %MEM | VSZ | RES | S | TTY | STAT | PRIME | NIO | TIME\
    \ | COMMAND |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|\n| top |\
    \ | | | | | | | | | | | |\n| ps | | | | | | | | | | | | |\n\nps command affairs\
    \ a screen-oriented, constantly updated listing of the running commands. It is\
    \ noted here that every Linux system has the ps command. Take a quick look at\
    \ some examples of ps on Ubuntu system.\n\n```bash\n$ ps -u\npswawan@VirtualBox:~$\
    \ ps -u\n```\n\nThe output of the command is shown here:\n\nSrakash has a master\
    \ degree in computer engineering. He worked in information technology for years\
    \ focusing on areas such as operating systems, network security, electronics,\
    \ internet services, LDAP and web development. He has authored a number of publications\
    \ and has presented at industry conferences. He can be reached at srakash.prakash@gmail.com\n\
    \n| PID | TTY | TIME | COMMAND |\n|---|---|---|---|\n| 7293 | | 00:00 | bash |\n\
    | 987 | | 00:00 | system |\n| 986 | | 00:00 | userd |\n| 985 | | 00:00 | kworker\
    \ |\n| 1120 | | 00:00 | VBoxClient |\n| 1121 | | 00:00 | VBoxService |\n| 1130\
    \ | | 00:00 | VBoxClient |\n| 1130 | | 00:00 | VBoxService |\n| 1135 | | 00:00\
    \ | VBoxClient |\n| 1137 | | 00:00 | VBoxService |\n| 1198 | | 00:02 | VBoxClient\
    \ |\n| 1199 | | 00:01 | dbus-daemon |\n| 1224 | | 00:00 | startup |\n| 1243 |\
    \ | 00:00 | getty |\n| 1245 | | 00:00 | getty |\n| 1302 | | 00:00 | dbus-daemon\
    \ |\n| 1364 | | 00:00 | godd-fed |\n\nAs can be seen from the output, processes\
    \ of the current user are shown. This command shows specific user where the author's\
    \ is shown in the examples.\n\n```bash\npswawan@VirtualBox:~$ ps -u\npswawan@VirtualBox:~$\
    \ ps -u\n```\n\nThe top provides a dynamic real-time view of running processes.\
    \ It shows a list of all processes or threads of system information and shows\
    \ types. They are all configurable and can be modified while running. The ps command\
    \ provides an interactive interface for managing processes. It is more extensive\
    \ than top, which is referred as dynamic. You can also kill processes, if referred\
    \ as dynamic in top, by reading and writing configuration files.\n\nLinux Process\
    \ Management\n\nHow to manage Processes from Linux? You need to know how to use\
    \ ps, kill and nice processes. Processes are a fundamental concept on any operating\
    \ system. When an event starts, it becomes a program instance that is under the\
    \ management of your Linux system's process. The help of available tools, the\
    \ ps and top commands are used to display information about the running processes.\
    \ Both come with a variety of options that will enable you to view and control\
    \ the processes. By sending signals, you can change the behavior of a process.\
    \ You can also use the kill and nice commands to send signals to processes to\
    \ do other things, such as reading and writing configuration files. Let's take\
    \ a look at order to understand which processes are running on your system, you\
    \ can use the ps command or top commands. The ps command provides a snapshot of\
    \ currently running processes that the top displays.\n\nProcesses specific to\
    \ a user displays all the running processes with CPU and memory information.\n\
    \n```bash\n$ ps -u pswawan\n```\n\nThis shows the running processes for a specific\
    \ user with their PIDs.\n\nOther useful variations of the ps command are given\
    \ in the following table:\n\n| Command | Description |\n|---|---|\n| ps -e | This\
    \ command displays every running process |\n| ps -el | Displays list of all processes\
    \ |\n| ps -af | Displays a full list of all processes |\n| ps -EF | Extra full\
    \ list of all running processes |\n\nGo through the main ps command to learn more\
    \ about this useful tool.\n\nMore on jobs\n\nAs mentioned overall you can use\
    \ the jobs command to manage the background jobs. Here are a few examples of implementing\
    \ this useful command.\n\n```bash\n$ jobs\n```\nThis command displays all the\
    \ background jobs for the current shell.\n\n```bash\n$ jobs -l\n```\nIn addition\
    \ to the jobs command, you use the PID to get information about each job and manage\
    \ the running processes.\n\n```bash\n$ ps -eH\n```\nThis command shows the process\
    \ hierarchy with process and session IDs. You can use the -o option to sort the\
    \ output of the ps command, which selects which columns of data to display. You\
    \ can then use the -sort option to sort the output by data. You can use a comma-separated\
    \ list of column names.\n\nLet's look at how we can watch the processes on a system\
    \ using another powerful command - top. In some cases we will be interested in\
    \ seeing processes on an ongoing basis. In such cases, top comes in very handy.\
    \ This command provides a dynamic-oriented view of the running processes on a\
    \ system that is constantly updated. When we use top without options, it basically\
    \ displays the system's CPU, memory and swap usage. This will be followed by a\
    \ list of the running processes. It is important to note here that all the running\
    \ processes displayed are sorted by CPU usage.\n\nSome other examples of options\
    \ that you can use to start the top command so that continuously runs processes:\n\
    \n```bash\n$ top -u psway\n```\nThe default update interval is three seconds;\
    \ this command changes it to five seconds.\n"
