    # CUSTOMISE YOUR COMMAND LINE PROMPT


    >_Here''s how you can add colours and formats to your command-line-prompt!


    ```

    paul@xps13-xenial ~/Download$tail ../.bashrc

    local GREEN="\u033[0;32m\"

    local BLUE="\u033[0;34m\"

    local PURPLE="\u033[0;35m\"

    local GRAY="\u033[0;37m\"


    export PS1="${RED}\u${GREEN}@${BLUE}${PURPLE}\w${GRAY}"


    prompt

    p@xps13-xenial ~/Download$

    ```


    To customise your Bash command line prompt, you need to modify the .bashrc file
    in your home (~) directory. Chances that file already exists prompt-related lines
    (and perhaps there are in any), which you can add to the end of the file to use
    your own text style.

    We''re going to start by defining some colours in file so you can use them in
    your prompt. Bash codes are as follows:


    Purple -0:35 Light Purple -1:35

    Brown -0:33 Yellow -1:33

    Light Gray -0:37 White -1:37


    export PS1="${RED}\u${GREEN}@${BLUE}\n${PURPLE}\w${GRAY}"


    Black -0:30 Dark Gray -1:30

    Blue -0:34 Light Blue -1:34

    Green -0:32 Light Green -1:32

    Cyan -0:36 Light Cyan -1:36

    Red -0:31 Light Red -1:31


    They can be added to the .bashrc file with lines in the following format, as:


    ```

    local RED="\u033[0;31m\"

    local GREEN="\u033[0;32m\"

    local BLUE="\u033[0;34m\"

    local PURPLE="\u033[0;35m\"

    local GRAY="\u033[0;37m\"

    ```


    In this line we are setting the prompt to our username (\u) to be, including the
    "@" character in green, the hostname (\h in blue), current path (\w) and the final
    prompt (\$).nThe Bash documentation (do a Google search for "prompt escape sequences")
    details a host of other items you can include, experiment! However try not to
    get too away... you might find that a prompt that takes up half the screen becomes
    tiring very quickly.


    Next, after defining the colours you wish to use, you need to define the prompt
    itself with line such as:'
