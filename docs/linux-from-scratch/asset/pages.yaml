  md: "# Creating the setclock script\n\nThe following script is only for real use\
    \ when your hardware clock (also known as BIOS or CMOS clock) isn't set to GMT\
    \ time. The recommended setup is setting your hardware clock to GMT and the time\
    \ converted to localtime using the /etc/localtime symbolic link. But if an OS\
    \ that doesn't understand a clock to GMT (most notable are Microsoft OS'es) you\
    \ might want to set your clock to localtime so that the time is properly displayed\
    \ on those OS'es. This script will reset the kernel time to the hardware clock\
    \ without converting the /etc/localtime symlink.\n\nIf you want to use this script\
    \ on your system even if you have your hardware clock set to GMT, then change\
    \ the UTC variable below to the value of I\n\n```\n#!/bin/sh\n# Begin /etc/init.d/setclock\n\
    source /etc/init.d/functions\nsource /etc/sysconfig/clock\nCLOCKPARAMS=\"--hctosys\"\
    \ncase \"$UTC\" in\n  yes[1])\n    CLOCKPARAMS=\"$CLOCKPARAMS -u\"\n    \nnesac\n\
    echo -n \"Setting clock...\"\n/sbin/hwclock $CLOCKPARAMS\nevaluate_retval\n# End\
    \ /etc/init.d/setclock\n```\n\nCreate a new file /etc/sysconfig/clock containing\
    \ the following:\n\n```\n# Begin /etc/sysconfig/clock\nUTC=1\n# End /etc/sysconfig/clock\n\
    ```\n\nIf your hardware clock (also known as BIOS or CMOS clock) is not set to\
    \ GMT time, then set the UTC variable in the /etc/sysconfig/clock file to the\
    \ value 0 (zero)."
