  md: 'Please note that the configure script Glibc can complain about certain files
    in the /usr/include directory being too old and will be replaced, or that some
    symlink is not supposed to be anymore (like /usr/include symlink that''s present
    on Linux systems). If it asks you to move a symlink scsi out of the way, please
    do so. If it says it will replace old files with the new Glibc files you can ignore.
    Glibc does not know you are on $LFS when the configure script is run.


    If you already have a glibc version installed, change to $LFS/usr/src/glibc-build
    directory and install Glibc by running the following commands:


    ```

    root:glibc-build# ../glibc-2.1.3/configure \

    > --prefix=/usr --enable-add-ons \

    > --with-headers=$LFS/usr/include

    root:glibc-build# make

    root:glibc-build# make install_root=$LFS install

    root:glibc-build# make install_root=$LFS

    localedata/install-locales

    root:glibc-build# localedef -i en_US -f ISO-8859-1 - en_US

    ```


    In the localedef command you will have to replace "en-US" and "ISO-8859-1" with
    the proper values values for your localization needs. You can find out what''s
    available by looking in the /usr/share/locale directory.


    If your system doesn''t have a suitable GCC version installed, change to the $LFS/usr/src/glibc-build
    directory and install Glibc using the gcc-2.95.2 you just installed by running
    the following commands:


    ```

    root:glibc-build# CC=/usr/local/gcc2952/bin/gcc \

    > ../glibc-2.1.3/configure --prefix=/usr --enable-add-ons \

    > --with-headers=$LFS/usr/include

    root:glibc-build# make

    root:glibc-build# make install_root=$LFS install

    root:glibc-build# make install_root=$LFS

    localedata/install-locales

    ```


    # Copying old NSS library files


    If your normal Linux system runs glibc-2.0, you need to copy the NSS library files
    to the LFS partition. Certain statically linked programs still depend on the NSS
    library, especially programs that need to lookup usernames,userid() and groupid().
    You can check which C library version your normal Linux system uses by running:


    Copying old NSS library files'
