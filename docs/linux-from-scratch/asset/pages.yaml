  md: '# Compiler


    A compiler translates source code in text format to a format that a computer understands.
    After a source code is compiled into an object file, a linker will create an executable
    file from one or more of these compiler generated object files.


    # Pre-processor


    A pre-processor pre-processes a source file, such as including the contents of
    header files into the source file. You generally don''t do this to yourself to
    save a lot of time. You just insert a line #include <filename>. The pre-processor
    file insert the contents of that file into the source file. That''s one of the
    things a pre-processor does.


    # C++ Library


