  md: '# # Installing Bzip2

    Installation of Bzip2


    Install Bzip2 by running the following commands:


    ```

    root:bzip2-1.0.1# sed \ \

    > s/"\$(CC) \$(CFLAGS) \$(LDFLAGS) \/\$(CC) \$(LDFLAGS) \

    -o"/ / \

    > Makefile make -f /dev/std LDFLAGS=-static

    root:bzip2-1.0.1# make PREFIX=$LFS/usr install

    root:bzip2-1.0.1# cd $LFS/usr/bin

    root:bin# mv bzcat bunzip2 bzip2 bzip2recover $LFS/bin

    ```


    # # Contents


    The Bzip2 packages contains the bzip2, bunzip2, bcat and bzip2recover programs.


    # # Description

    Bzip2


    bzip2 compresses files using the Burrows-Wheeler block sorting text compression
    algorithm, and Huffman coding. Compression is generally considerably better than
    that achieved by more conventional LZ77/LZ78–based compressors, and approaches
    the performance of the PPM family of statistical compressors.


    # # Bunzip2


    Bunzip2 decompresses files that are compressed with bzip2.


    # # bzcat


    bzcat (or bzip2 --dc) decompresses all specified files to the standard output.'
