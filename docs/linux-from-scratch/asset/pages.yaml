- img_proc: true
  md: '# utmpdump


    utmpdumps prints the content of a file (usually /var/run/utmp) on standard output
    in a user friendly format.


    # wall


    Wall sends a message to everybody logged in with their mesg permission set to
    yes.


    # halt


    Halt notes that the system is being brought down in the file /var/log/wtmp, and
    then either tells the kernel to halt, reboot or poweroff the system. If halt or
    reboot is called when the system is not in runlevel 0 or 6, shutdown will be invoked
    instead (with the flag -h or -r).


    # init


    Init is the parent of all processes. Its primary role is to create processes from
    a script stored in the file /etc/initab. This file usually has entries which cause
    init to spawn get { on each line that users can log in. It also controls autonomous
    processes required by any particular system.


    # killall5


    killall5 is the SystemV kill command. It sends a signal to all processes except
    the processes in its own session, so it won''t kill the shell that is running
    the script it was called from.


    # poweroff


    poweroff is equivalent to shutdown -h -p now. It halts the computer and switches
    off the computer (when using an APM compliant BIOS and APM is enabled in the kernel).


    # reboot


    reboot is equivalent to shutdown -r now. It reboots the computer.'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# runlevel


    Runlevel reads the system utmp file (typically /var/run/utmp) to locate the runlevel
    record, and then prints the previous and current system runlevel on its standard
    output, separated by a single space.


    # shutdown


    shutdown brings the system down in a secure way. All logged-in users are notified
    that the system is going down, and login is blocked.


    # sulogin


    sulogin is invoked by init when the system goes into single user mode (this is
    done through an entry /etc/initab). Init also tries to execute sulogin when it
    is passed the -b flag from the bootmonitor (eg, LILO).


    # telinit


    telinit sends appropriate signals to init, telling it which runlevel to change
    to.'
