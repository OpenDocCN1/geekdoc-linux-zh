- img_proc: true
  md: "# # Installing Binutils\nInstallation of Binutils\n\nInstalling Binutils by\
    \ running the following commands:\n\n```\nroot:binutils-2.10# ./configure --prefix=/usr\
    \ --disable-nls\nroot:binutils-2.10# make -e LDFLAGS=--all-static tooldir=/usr\n\
    root:binutils-2.10# make -e prefix=$LFS/usr \\\n  > tooldir=$LFS/usr install\n\
    ```\n\n# # Description\n\nThe Binutils package contains the ld, ar, nm, objcopy,\
    \ objdump, ranlib, size, strings, strip, c++filt, addr2line and nlmconv programs\n\
    \n# # Description\n\nld combines a number of object and archive files, relocates\
    \ their data and ties up symbol references. Often the last step in building a\
    \ new compiled program to run is a call to ld.\n\n# # as\n\nas is primarily intended\
    \ to assemble the output of the GNU compiler gcc for use by the linker ld.\n\n\
    # # ar\n\nThe ar program creates, modifies, and extracts from archives. An archive\
    \ is a single file holding a collection of other files in a structure that makes\
    \ it possible to retrieve the original individual files (called members of the\
    \ archive).\n\n# # nm\n\nnm lists the symbols from object files."
  merge: -1
