  md: '```

    root:~# ls /lib/libc*

    ```


    Your system uses glibc-2.0 if there is a file that looks like libc-2.0.7.so


    Your system uses glibc-2.1 if there is a file that looks like libc-2.1.3.so


    Of course, the micro version number be different (you could have libc-2.1.2 or
    glibc-2.1.1 for example).


    If you have a libc-2.0.x file copy the NSS library files by running:


    ```

    root:~# cp -av /lib/libss* $LFS/lib

    ```


    There are a few distributions that don''t have files from which you can see version
    of the C library it. If that''s the case, it will be hard to determine which C
    library version you exactly have. Try to obtain this information using your distribution''s
    installation tool. It often says which version it has available. If you can''t
    figure out at all which C library version is used, then copy the NSS files anyway
    and hope for the best. That''s the best advice I can give if I''m afraid.


    # Contents


    The Glibc package contains the GNU C Library.


    # Description


    The C library is a collection of commonly used functions in programs. This way
    a programmer doesn''t need to create his own functions for every single task.
    The most common things like writing a string to a screen are already present and
    at the disposal of the programmer.


    The library (almost every library) comes in two flavours: dynamic ones and static
    ones. In short when a program uses a static C library, the code from the library
    will be copied into the executable file. When a program uses a dynamic library,
    executable will not contain the code from the C library, but instead a routine
    that loads the functions from the library at the time the program is run. This
    means a significant decrease in the file size of a program. If you don''t understand
    this concept, you better read the documentation that comes with the C Library
    as it is too complicated to explain here in one or two lines.'
