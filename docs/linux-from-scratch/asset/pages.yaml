- img_proc: true
  md: '# Product Description


    Linux From Scratch describes the process of creating your own Linux system from
    scratch from an already installed Linux distribution, using nothing but the source
    code of software that you need.


    From the author''s introduction:

    "Having used a number of different Linux distributions


    This, at one time, wild idea seemed very difficult and at times almost impossible.
    The reason for most problems were due to my lack of knowledge about certain programs
    and procedures. After I sorted out all kinds of dependency problems, compilation
    problems, etcetera, a manually Linux system was created and fully operational.
    I called this system and LFS system which stands for Linux From Scratch.


    # Product Details


    +   * Paperback: 355 pages

    * Publisher: Juniverse Inc (December 2000)

    * Language: English

    * ISBN-10: 0595137652

    * ISBN-13: 978-0595137657'
