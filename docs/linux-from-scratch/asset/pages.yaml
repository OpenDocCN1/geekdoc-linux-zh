- img_proc: true
  md: "# Creating directories\n\nLet's create the directory tree on the LFS partition\
    \ according to the FHS standard which can be found at http://www.pathname.com/fhs/.\
    \ Issuing the commands will create the necessary directories:\n\n```\nroot:~#\
    \ cd $LFS\nroot:~# mkdir bin boot dev dev/pts etc home lib mnt proc\n  sbin tmp\
    \ var\nroot:~# for dirname in $LFS/usr $LFS/usr/local\n  do\n    mkdir $dirname\n\
    \    cd $dirname\n    mkdir bin etc include lib sbin share src tmp var\n    ln\
    \ -s share/man man\n    ln -s share/doc doc\n    ln -s share/info doc\n    cd\
    \ $dirname/share\n    mkdir dict doc locale man nls terminfo zoneinfo\n    cd\
    \ $dirname/share/man\n    mkdir man1 man2 man3 man4 man5 man6 man7 man8\n  done\n\
    root:~# cd $LFS/var\nroot:~* mkdir log mail run spool tmp\n```\n\nNormally directories\
    \ are created with permission mode 755, which isn't desired for all directories.\
    \ I haven't checked the FHS if they suggest modes for certain directories, I'll\
    \ just change the modes for two directories. The first change is a mode 0750 for\
    \ the $LFS/root directory. This is to make sure that not just everybody can ever\
    \ the /root directory (the same you would do with /home/username directories).\
    \ The second change is a mode 1777 for the $LFS/tmp directory. This way every\
    \ user can write stuff to the /tmp directory they need to. The sticky (1) bit\
    \ makes users can delete other user's file which they normally can because the\
    \ directory is set in a way that every body (owner, group, world) can write to\
    \ that directory.\n\n```\nroot:~# cd $LFS\nroot:lfs# chmod 0750 root\nroot:lfs#\
    \ chmod 1777 usr/tmp var/tmp\n```\n\nThe directories are created, copy the source\
    \ files you have downloaded in chapter 3 to some subdirectory under $LFS/usr/src\
    \ (you will need to create this subdirectory yourself)."
  merge: -1
