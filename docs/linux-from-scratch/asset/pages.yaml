    linux or alfs-discuss. No subject required.


    You can, if you want, subscribe to multiple lists at the same time using one email.
    Just repeat the command for all the lists you want to subscribe to.


    After you have sent the email, the Majordomo program will send you an email back
    requesting a confirmation of your subscription request. After you have sent this
    confirmation email, Majordomo will send you an email again with the message that
    you have been subscribed to the list(s) along with an introduction message for
    that particular list.'
