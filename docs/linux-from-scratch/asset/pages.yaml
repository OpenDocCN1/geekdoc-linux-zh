    # alfs-discuss


    The alfs-discuss discusses the development of ALFS which stands for Automated
    LinuxFromScratch. The goal of this project is to develop an installation tool
    that can install an LFS system automatically for you. Its main goal is to speed
    up compilation by taking away your need to manually enter the commands to configure,
    compile and install packages.


