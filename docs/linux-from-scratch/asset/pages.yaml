  md: '# Configuring essential software


    Now that all software is installed, that all we need to do is get a few programs
    running properly is to create their configuration files.


    # Configuring Vim


    By default Vim runs in vi compatible mode. Some people might like this, but I
    have a high preference to run in vim mode (else I wouldn''t have included Vim
    in this book but the Original Vi). Create the /root/.vimrc containing the following:


    ```

    Begin /root/.vimrc

    set nococompatible

    set bs=2

    End /root/.vimrc

    ```


    # Configuring Glibc


    We need to create the /etc/nsswitch.conf file. Although glibc should provide defaults
    when this file is missing or corrupt, it''s defaults won''t work well with networking
    which will be dealt with in a later chapter. Also, your timezone needs to be setup.


    Create a new file /etc/nsswitch.conf containing the following:


    ```

    # Begin /etc/nsswitch.conf

    asswd: files

    group: files

    shadow: files

    hosts: files dns

    networks: files

    protocols: db files

    services: db files

    ethers: db files

    rpc: db files

    netgroup: db files

    # End /etc/nsswitch.conf

    ```


    Run the tzselect script and answer the questions regarding your timezone. When
    you''re done, the script will give you the location of the timezone file you need.


    Create the /etc/localtime symlink by running:'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# Linux From Scratch


    ```

    root:~# cd /etc

    root:etc# rm localtime

    root:etc# ln -s ../usr/share/zoneinfo/<tzselect''s output> \

    > localtime

    ```


    tzselect''s output can be like EST5ED or Canada/Eastern. The symlink you would
    create with that information would be ln -s /usr/share/zoneinfo/EST5ED localtime
    or ln -s

    ../usr/share/zoneinfo/Canada/Eastern localtime


    # Configuring Dynamic Loader


    By the default dynamic loader searches a few default paths for dynamic libraries,
    so normally isn''t a need for the /etc/ld.so.conf file unless you have extra directories
    in which you want the system to search for paths. The /usr/local/lib directory
    isn''t searched through by dynamic libraries by default, so we add this path so
    when you install software you won''t be surprised by them not running for some
    reason.


    Create a new file /etc/ld.so.conf containing the following:


    ```

    # Begin /etc/ld.so.conf

    /lib

    /usr/lib

    /usr/local/lib

    # End /etc/ld.so.conf

    ```


    Although it''s not necessary to add the /lib and /usr/lib directories it doesn''t
    hurt. This way you see right what''s being searched and not have to rement the
    default search paths if you don''t want to.


    # Configuring Lilo


    We''re not going to create Lilo''s configuration file from scratch, we''ll use
    the file from your normal Linux system. This file is different on every machine
    and I can''t create it here. Since you would want to have the same options regarding
    Lilo as you have when you''re using your normal Linux system you would create
    the file exactly as it is on the normal system.


    Copy the Lilo configuration file and kernel images that Lilo uses by running the
    following commands from a shell on your normal Linux system. Don''t execute these
    commands from your ched shell.


    ```

    root:~# cp /etc/lilo.conf $LFS/etc

    root:~# cp /boot/<kernel images> $LFS/boot

    ```'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Linux From Scratch


    Before you can execute the second command you need to know the names of the kernel
    images. You can''t just copy all files from the /boot directory. The /etc/lilo/conf
    file contains the names of the kernel images you''re using. Open the file and
    look for lines like this:


    ```

    image=/boot/vmlinuz

    ```


    Look for all image variables and their values represent the name and location
    of the image files. These files will usually be in /boot but they might be in
    other directories as well, depending on your distribution''s conventions.


    # Configuring Syslogd


    Create a new file /etc/syslog.conf containing the following:


    ```

    # /etc/syslog.conf

    auth,authpriv.* * /var/log/auth.log

    *,auth,authpriv.none - /var/log/sys.log

    daemon.* - /var/log/daemon.log

    kern.* - /var/log/kern

    mail.* - /var/log/mail.log

    user.* - /var/log/user.log

    *,emerg *

    # End /etc/syslog.conf

    ```


    # Configuring Shadow Password Suite


    This package contains the utilities to modify users'' passwords, add new users/groups,
    delete users/groups and more. I am not going to explain what ''password shadowing''
    means. You can read all about that in the doc/HOWTO file within the unpacked shadow
    password suite''s source tree. There''s one thing you should keep in mind, if
    you decide to use support, programs that need to verify passwords (examples are
    xdm, ftp daemons, pop3 daemons, etc) need to be ''shadow-compliant'', e.g. they
    need to be able to work with shadow''ed passwords.


    Shadow''ed passwords are not enabled by default. Simply installing the shadow
    password suite does not enable shadow''ed passwords.


    Now is a very good moment to read chapter 5 of the doc/HOWTO file. You can read
    how you can enable shadow''ed passwords, how to test whether shadowing works and
    if not, how to disable it again.


    Configuring Syslogd


    188'
  merge: -1
  pgno: 224
