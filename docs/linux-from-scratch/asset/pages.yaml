- img_proc: true
  md: '# cp


    cp copies files from one place to another.


    # dd


    dd copies a file (from the standard input to the standard output, by default)
    with a user--selectable blocksize while optionally performing conversions on it.


    # df


    df displays the amount of disk space available on the filesystem containing each
    file name argument. If no file name is given, the space available on all currently
    mounted filesystems is shown.


    # ls, dir and vdir


    dir and vdir are versions of ls with different default output formats. These programs
