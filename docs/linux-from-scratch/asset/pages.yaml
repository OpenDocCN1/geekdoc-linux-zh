    # # Contents


    The Fileutils package contains the chgrp, chmod, chown, cp, dd, df, dir, dicolors,
    install, ln, ls, mkdir, mknod, mv, rm, rdir, sync, touch and vdir programs.


    # # Description

    ## chgrp


    chgrp changes the group ownership of each given file to the named group, which
    can be either a group name or a numeric group ID.


    # # chmod


    chmod changes the permissions of each given file according to mode, which can
    be either a symbolic representation of changes to make, or an octal number representing
    the bit pattern for the new permissions.


    # # chown


    chown changes the user and/or group ownership of each given file.'
