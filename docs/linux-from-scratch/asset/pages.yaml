  md: '# Introduction


    In this chapter the partition that is going to host the LFS system is going to
    be prepared. A new partition will be created, an ext2 file system will be created
    on it and the directory structure will be created. When this is done, we can move
    on to the next chapter and start building a new Linux system from scratch.'
  merge: -1
  pgno: 77
- img_proc: true
  md: '# Creating a new partition


    Before we can build our new Linux system, we need to have an empty partition on
    which we can build our new system. I recommend a partition size of around 750
    MB. This gives you enough space to store all the tarballs and to compile all packages
    without worrying running out of the necessary temporary disk space. If you already
    have a Linux Native partition available, you can skip this subsection.


    Start the fdisk program (or some other fdisk program you prefer) with the appropriate
    hard disk as the option /dev/hda if you want to create a new partition on the
    primary master IDE disk). Create a Linux Native partition, write the partition
    table and exit the fdisk program. If you get the message that you need to reboot
    your system to ensure that that partition table is updated, please reboot your
    system now before continuing. Remember what your new partition''s designation
    is. It could be something like hda1 (as it is in my case). This newly created
    partition will be referred to as the LFS partition in this book.'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# Creating a ext2 file system on the new partition


    Once the partition is created, we have to create a new ext2 file system on that
    partition. To create a new ext2 file system we use the mk2fs command. Enter the
    new partition as the only option and the file new system will be created. If your
    partition is hda1, you would run:


    ```

    root:~# mke2fs /dev/hda1

    ```'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# Mounting the new partition


    Now that we have created the ext2 file system, it is ready for use. All we have
    to do is be able to access it (as in reading from writing date to it) is mounting
    it. If you mount it under /mnt/lfs, you can access this partition by going to
    /mnt/lfs directory and then whatever you need to do. This document will assume
    you have mounted the partition on a subdirect under /mnt. It doesn''t matter which
    directory you choose (or you can use the /mnt directory as the mount point) but
    this book will assume /mnt/lfs in the commands it tells you to execute.


    Create the /mnt/lfs directory by running:


    ```

    root:~# mkdir -p /mnt/lfs

    ```


    Now mount the LFS partition by running:


    ```

    root:~# mount /dev/xxx /mnt/lfs

    ```


    Replace "xxx" by your partition''s designation.


    This directory (/mnt/lfs) is the $LFS variable you have read about earlier. So
    if you read somewhere to "cp inittab $LFS/etc" you will actually type "cp inittab
    /mnt/lfs/etc". Or if you want to use the $LFS environment variable, execute export
    LFS=/mnt/lfs now.'
  merge: -1
