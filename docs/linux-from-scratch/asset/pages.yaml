- img_proc: true
  md: '# Copying /proc/devices


    In order for the MAKEDEV script properly create device entries in /dev it needs
    access to /proc/devices. We can''t mount the proc file system on our LFS system
    yet so instead we copy the /proc/devices file to $LSFS/proc. This means $LSFS/proc/devices
    file won''t be updated when the kernel updates /proc/devices but I don''t see
    any harm in doing it, since it''s only needed during the execution of the MAKEDEV
    script. Just make sure you don''t add or remove any hardware during the next 3
    minutes by loading or unloading a kernel module or rebooting your computer before
    continuing with this book.


    Copy the /proc/devices file by running the following command:


    ```

    root:~# cp /proc/devices $LSFS/proc

    ```'
  merge: -1
