    ```


    # Creating the /var/run/utmp, /var/log/wtmp and /var/log/btmp files


    Programs like login, shutdown, uptime and others that want to read and write to
    the /var/run/utmp /var/log/btmp and /var/log/wtmp. These files contain information
    about who is currently logged in. It also contains information on when the computer
    was last booted and shutdown and a record of the bad login attempts.


    Create these files with their proper permissions by running the following commands:


    ```

    root:~# touch /var/run/utmp /var/log/wtmp /var/log/btmp

    root:~# chmod 644 /var/run/utmp /var/log/wtmp /var/log/btmp

    ```'
