- img_proc: true
  md: '# How to install the software


    Before you can actually start doing something with a package, you need to unpack
    it first. Often you will find the package files being tarred and zipped (you can
    see this from a .tar.gz or .tgz extension). I am not going to write down every
    time how to unzip and how to untar an archive. I will tell you how to do that,
    in this paragraph. There is also the possibility that you will have the ability
    of downloading a .tar.bz2 file. Such a file is tarred and compressed with the
    bzip2 program. Bzip2 achieves a better compression than the commonly used gzip
    options. In order to use bz2 archives you need to have the bzip2 program installed.
    If not every distribution comes with this program so chances are it is already
    installed on your system. If not, install it using your distribution''s installation
    tool.


    To start with, change to $LFS/usr/src directory by running:


    ```

    root:~# cd $LFS/usr/src

    ```


    When you have a file that is tarred and zipped, you unpack it by running either
    one of the following two commands, depending on the filename format:


    ```

    root:/usr/src# tar xvfz filename.tar.gz

    root:/usr/src# tar xvfz filename.tgz

    ```


    When you have a file that is tarred and bzipped, you unpack it by running:


    ```

    root:/usr/src# bzcat filename.tar.bz2 | tar xv

    ```


    Some tar programs (most of them nowadays but not all of them) are slightly modified
    to use bzip2 files directly using either the I or the y parameter which works
    the same as the z tar parameter to handle gzip archives.


    When you have a file that is tarred, you unpack it by running:


    ```

    root:/usr/src# tar xvf filename.tar

    ```


    When the archive is unpacked a new directory will be created under the current
    directory (and this document assumes that you unpack the archives under the $LFS/usr/src
    directory). You have to enter that new directory before you continue with the
    installation instructions. Everytime the book is going to install a program, it''s
    up to you to unpack to the source archive.


    # How to install the software'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'After you have installed a package you can do two things with it. You can either
    delete the directory that contains the sources or you can keep it. If you decide
    to keep it, that''s fine by me. But if you need the same package again in a later
    chapter you need to delete the directory before using it again. If you don''t
    do this, you might end up in trouble because old settings will be used (settings
    that apply to your normal Linux system but which doesn''t always apply to the
    LFS system). Doing a simple make clean does not always guarantee a totally clean
    source tree. The configure script can also have files lying around in various
    subdirectories which aren''t removed by a make clean process.


    How to install the software'
