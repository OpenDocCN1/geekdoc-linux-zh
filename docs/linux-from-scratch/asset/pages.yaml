  md: '# # Installing Bash

    Installation of Bash


    Install Bash by running the following commands:


    ```

    root:bash-2.04# ./configure --enable-static-link \

    > --prefix=$usr --disable-nls

    root:bash-2.04# make

    root:bash-2.04# make prefix=$LFS/usr install

    root:bash-2.04# mv $LFS/usr/bin/bash \

    > $LFS/usr/bin/bashbug $LFS/bin

    root:bash-2.04# cd $LFS/bin

    root:bin# ln -s bash sh

    ```


    # # Contents


    The Bash package contains the bash program


    # # Description


    Bash the Bourne–Again SHLL, which is a widely used command interpreter on Unix
    systems. Bash is a program that reads from standard input, the keyboard. You type
    something and the program will evaluate what you have typed and do something with
    it, like running a program.'
  merge: -1
