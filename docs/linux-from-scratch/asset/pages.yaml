  md: '# Chapter 1. Introduction'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Introduction


    Having used a number of different Linux distributions, I was never fully satisfied
    with any of those. I didn''t like the way the bootscripts were arranged, or I
    didn''t like the way certain programs were configured by default and more of those
    things. I came to realize that when I want to be totally satisfied with a Linux
    system, I have to build my own Linux system from scratch, ideally only using the
    source code. Not using pre-compiled packages of any kind. No help from some sort
    of cdrom or bootdisk that would install some basic utilities. You would use your
    current Linux system and that one to build your own.


    This, at one time, wild idea seemed very difficult and at times almost impossible.
    The reason for most problems were due to my lack of knowledge about certain programs
    and procedures. After sorting out all kinds of dependency problems, compilation
    problems, etcetera, a custom built Linux system was created and fully operational.
    I called this system an LFS system, which stands for LinuxFromScratch.'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# How things are going to be done


    We are going to build the LFS system using an already installed Linux distribution
    such as Debian, SuSE, Slackware, Mandrake, RedHat, etc. You don''t need to have
    any kind of bootdisk. We will use an existing Linux system as the base (since
    we need a compiler, linker, text editor and other tools).


    If you don''t have Linux installed yet, you won''t be able to put this book use
    right away. I suggest you first install a Linux distribution. It really doesn''t
    matter which one you install. It also doesn''t need to be the latest version,
    though it shouldn''t be a too old one. If it is about a year old or newer it should
    do just fine. You will safe yourself a lot of trouble if your normal system uses
    glibc–2.0 or newer. Libc5 isn''t supported by this book, though it isn''t impossible
    to use a libc5 system if you have no choice.'
  merge: -1
