  md: '# Creating the /etc/sysconfig/network file


    Create a new file /etc/sysconfig/network and put the hostname in it by running:


    ```

    root:~# echo "HOSTNAME=lfs" > /etc/sysconfig/network

    ```


    Replace "lfs" by the name you wish to call your computer. Please not that you
    should not enter the FQDN (Fully Qualified Domain Name) here. That information
    will be put in the /etc/hosts file later.


    # Creating the /etc/hosts file


    If you want to configure a network card, you will have to decide on the IP-address,
    FQDN and possible aliases for use in the /etc/hosts file. An example is:


    ```

    <my-IP> myhost.mydomain.org aliases

    ```


    Make sure the IP-address is in the private network IP–address range. Valid ranges
    are:


    +   Class Networks

    A 10.0.0.0

    B 172.16.0.0 through 172.31.0.0

    C 192.168.0.0 through 192.168.255.0


    A valid IP address could be 192.168.1.1. A valid FQDN for this IP could be .linuxfromscratch


    If you''re not going to use a network card, you will still need to make up a FQDN.
    This is necessary for programs like Sendmail to operate correctly (in fact; Sendmail
    won''t run when it determines the FQDN).


    If you don''t configure a network card, create a new file /etc/hosts containing:


    ```

    # Begin /etc/hosts (no network version)

    127.0.0.1 www.mydomain.com <value of HOSTNAME> localhost

    # End /etc/hosts (no network version)

    ```


    If you don''t configure a network card, create a new file /etc/hosts containing:


    ```

    # Begin /etc/hosts (network card version)

    127.0.0.1 localhost.localdomain localhost

    ```


    Creating the /etc/sysconfig/network file'
