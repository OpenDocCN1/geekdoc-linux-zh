  md: '# Creating $LFS/root/.bash_profile


    When we have entered the chrooted environment in the next section we want to export
    a couple of environment variables in that shell such as TERM, CFLAGS, CXXFLAGS
    and others variables you want to have set. For that purpose we will create the
    $LFS/root/.bash_profile file and "source" it after we have entered the chrooted
    environment.


    Create a new file $LFS/root/.bash_profile containing the following. Replace -mcpu=xxx
    -march=yyy with the proper values for your machine:


    ```

    # Begin /root/.bash_profile

    TERM=xterm

    CFLAGS=-O3 -mcpu=xxx -march=yyy

    CXXFLAGS=$CFLAGS

    \export TERM CFLAGS CXXFLAGS

    # End /root/.bash_profile

    ```


    You can add more environment variables at your own discretion as you deem them
    necesaray.'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# Entering the chroot''ed environment


    It''s time to enter our chroot''ed environment in order to install the rest of
    the software we need.


    Enter the following command to enter the chroot''ed environment. From this point
    on there''s no need to use the $LFS variable anymore, because everything you do
    will be restricted to the LFS partition (since / is actually /mnt/lfs but the
    shell doesn''t know that).


    ```

    root:~# cd $LFS

    root:lfs# chroot $LFS env -i HOME=/root bash --login

    ```


    Now that we are inside a chroot''ed environment, we can continue to install all
    the basic system software. Make sure you execute all the following commands in
    this chapter from within the chroot''ed environment.'
