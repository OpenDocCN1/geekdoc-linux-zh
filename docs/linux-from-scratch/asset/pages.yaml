  md: '# # Installing Glibc

    A note on the glibc-crypt package


    An excerpt from the README file that is distributed with the glibc-crypt package:


    The add-on is not included in the main distribution of the GNU C library because
    some governments, most notably those of France, Russia, and the US, have very
    restrictive rules governing the distribution and use of encryption software. Please
    read the note "Legal Problems" in the manual for more details.


    In particular, the US does not allow export of this software without a licence,
    including via the Internet. Please do not download it from the main FSF FTP site
    at ftp.gnu.org if you are outside the US. This software was completely developed
    outside the US.


    "This software" refers to the glibc-crypt package at ftp://ftp.gwd.de/pub/linux/glibc/.
    This law only affects people who do not live in the US. It is not prohibited to
    import DES in the US you can import the file safely from Germany without breaking
    cryptographic laws. This law is changing lately and I don''t know what the status
    of it is at the moment. Better safe than sorry.


    # # Installation of Glibc


    Unpack the glibc-crypt and glibc-linuxthreads in the glibc-2.1.3 directory, not
    in /usr/src. Don''t enter the created directories. Just unpack them and leave
    it with that.


    A few default parameters of Glibc need to be changed, such as the directory where
    the shared libraries are supposed to be installed and the directory that contains
    the system configuration files. For this purpose you need to create the `$LFS/usr/src/glibc-build`
    directory and cd into that directory with:


    ```

    root:src mkdir $LFS/usr/src/glibc-build

    root:src# cd $LFS/usr/src/glibc-build

    ```


    In that directory you create a new file configparams containing the following:


    +   - Begin configparams

    libdir=/lib

    sysconfdir=/etc

    - End configparams


    If you''re getting errors related to illegal character 45 in some variable name
    during the compilation, apply the Glibc patch to the glibc-2.1.3 directory by
    running the following command:


    ```

    root:glibc-2.1.3# patch -Np1 -i ../glibc-2.1.3.patch

    ```'
