    file from source format into binary format for use with the ncurses library routines.
    Terminfo files contain information about the capabilities of your terminal.


    # ## Infocmp


    The infocmp program can be used to compare a binary terminfo entry with other
    terminfo entries, rewrite a terminfo description to take advantage of the use=
