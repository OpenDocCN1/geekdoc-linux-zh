  md: '# About $LFS


    Please read the following carefully: throughout this document you will frequently
    see the variable name $LFS. $LFS must at all times be replaced by the directory
    where the partition contains the LFS system is mounted. How to create and mount
    the partition will be explained later in full detail in chapter 4. In my case
    the LFS partition is mounted at /mnt/lfs. If I read that I have to run this command:
    cp initab $LFS/etc If I read this myself and I see $LFS somewhere, I will pretend
    that I read /mnt/lfs. If I read that I have to run this command: cp initab $LFS/etc
    I actually will run this: cp initab /mnt/lfs/etc


    It''s important that you do no matter where you read it; be it in commands you
    enter on the prompt, or in some file you edit or create.


    If you want, you can set the environment variable LFS. This way you literally
    enter $LFS instead of replacing it by something like /mnt/lfs. This is accomplished
    by running: export LFS=/mnt/lfs


    If I read cp initab $LFS/etc, I literally can type cp initab $LFS/etc and the
    shell will replace this command by cp initab /mnt/lfs/etc automatically.


    Do not forget to set the $LFS variable at all times. If you haven''t set the variable
    and use it in a command, $LFS will be ignored and whatever is left will be executed.
    The command cp initab $LFS/etc without the LFS variable set, will result in copying
    the initab file to the /etc directory which will overwrite your system''s initab.
    A file like initab isn''t that big a problem as it can easily be restored, but
    if you would make this mistake during the installation of the C Library, you can
    break your system badly and might have to reinstall it if you don''t know how
    to repair it.'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# How to download the software


    Throughout this document I will assume that you have stored all the packages you
    have downloaded somewhere in $LFS/usr/src.


    I use the convention of having a $LFS/usr/src/ directory. Under sources you''ll
    find the directory 0–9 and the directories through z. A package as sysvisint-2.78.tar.gz
    is stored under $LFS/usr/src/sources/s/ A package as bash-2.04.tar.gz is stored
    under $LFS/usr/src/sources/b/ and so forth. You don''t have to follow this convention
    of course, I was just giving an example. It''s better to keep the packages out
    of $LFS/usr/src and move them to a subdirectory, so we''ll have a clean $LFS/usr/src
    directory in which we will unpack the packages and work with them.


    The next chapter contains the list of all the packages you need to download, but
    the partition that is going to contain our LFS system isn''t created yet. Therefore
    temporarily store the files somewhere where you want and remember to copy them
    to $LFS/usr/src/ when you have finished the chapter in which you prepare a new
    partition (which chapter exactly depends on your architecture).'
