  md: '# # Preface'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# Who would want to read this book


    This book is intended for Linux users who want to learn more about the inner workings
    of Linux and how the various pieces of the Operating System fit together. This
    book will guide you step-by-step in creating your own custom build Linux system
    from scratch, using nothing but the sources of software that are needed.


    This book is also intended for Linux users who want to get away from the existing
    commercial and free distributions that are often too bloated. Using existing distributions
    also forces you to use the file system structure, boot script structure, etc.
    that they choose to use. With this book you can create your own structures and
    methods in exactly the way you like them (which can be based on the ones this
    book provide)


    Also, if you have security concerns, you don''t want to rely on pre-compiled packages.
    So instead, you want to compile all programs from scratch and install them yourself.
    That could be another reason why you would want to build a custom made Linux system.


    Those are just a few out of many reasons people want to build their own Linux
    system. If you''re one of those people, this book is meant for you.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# Who would not want to read this book


    Users who don''t want to build an entire Linux system from scratch probably don''t
    want to read this book. If you, however, do want to learn about what happens behind
    the scenes, in particular what happens between turning on your computer and seeing
    the command prompt, you want to read the "From Power Up To Bash Prompt" (P2B)
    HOWTO. This HOWTO builds a bare system, in a similar way as this book does, but
    it focses more on just installing a bootable system instead of a complete system.


    To decide whether you want to read this book or the P2B HOWTO, you could ask yourself
    this question: Is my main objective to get a working Linux system that I''m going
    to build myself and along the way learn and build what every component of a system
    is for, or is just the learning part your main objective. If you want to build
    and learn, read this book. If you just want to learn, then the P2B HOWTO is probably
    better material to read.


    The "From Power Up To Bash Prompt" HOWTO can be downloaded from http://learning.taslug.org.au/power2bash'
  merge: -1
