- img_proc: true
  md: '# objcopy


    objcopy utility copies the contents of an object file to another. objcopy uses
    the GNU Library BFD to read and write the object files. It can write the destination
    object file in a format different from that of the source object file.


    # objdump


    objdump displays information about one or more object files. The options control
    what particular information to display. This information is most useful to programmers
    who are working on the compilation tools, as opposed to programmers who just want
    their program to compile and work.


    # ranlib


    ranlib generates an index to the contents of an archive, and stores it in the
    archive. The index lists each symbol defined by a member of an archive that is
    a relocatable object file.


    # size


    size lists the section sizes --and the total size— for each of the object files
    objfile in its list. By default, one line of output is generated for each object
    file or each module in an archive.


    # strings


    For each file, strings prints the printable character sequences that are at least
    4 characters long (or the number specified with an option to the program) and
    are followed by an unprintable character. By default, it only prints the strings
    from the initialized and loaded sections of object files; for other types of files,
    it prints the strings from the whole file.


    strings is mainly useful for determining the contents of non—text files.


    # strip


    strip discards all or specific symbols from object files. The list of object files
    may include archives. At least one object file must be given. strip modifies the
    files named in its argument, rather than writing modified copies under different
    names.'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# C++filt


    The C++ language provides function overloading, which means that you can write
    functions with the same name (providing each takes parameters of different types).
    All C++ function names are encoded into a low-level assembly label (this process
    is known as mangling). The c++filt program does the inverse mapping: it decodes
    (demangles) low-–level names into user-level names so that the linker can keep
    these overloaded functions from clashing.


    # addr2line


    addr2line translates program addresses into file names and line numbers. Given
    an address and an executable, it uses the debugging information in the executable
    to figure out which file name and line number are associated with a given address.


    # nlmconv


    nlmconv converts relocatable object files into the NetWare Loadable Module files,
    optionally reading header files for NLM header information.'
  merge: -1
