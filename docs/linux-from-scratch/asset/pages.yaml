- img_proc: true
  md: '# Util Linux

    Contents


    The Util–linux package contains the arch, dmesg, kill, more, mount, umount, agety,
    blockdev, cfdisk, ctrlldel, eltune, fdisk, fsck.minix, hwclock, kbdrate, losetup,
    mkfs, mkfs.bfs, mkfs.minix, mkswap, swapfd, swapoff, swapon, cal, chkdupe, colert,
    colmm, colmn, cytune, ddate, fdformat, getopt, hexdump, icperm, ipcs, logger,
    look, mcookie, namei, rename, renice, rev, script, setfdprm, setshid, setterum,
    ul, whereis, write, ramsize, rdev, readprofile, rootflags, swapdev, tunelp and
    vidmode programs.


    # Description

    arch


    arch prints the machine architecture.


    # dmesg


    dmesg is used to examine or control the kernel ring buffer (boot messages from
    the kernel).


    # kill


    kill sends a specified signal to the specified process.


    # more


    more is a filter for paging through text one screenful at a time.


    # mount


    mount mounts a filesystem from a device to a directory (mount point).


    # umount


    umount unmounts a mounted filesystem.'
  merge: -1
  pgno: 336
- img_proc: true
  md: '# agetty


    agetty opens a tty port, prompts for a login name and invokes the /bin/login command.


    # blockdev


    No description available.


    # cfdisk


    cfdisk is an libncurses based disk partition table manipulator.


    # ctrlaltdel


    ctrlaltdel sets the function of the CTRL+ALT+DEL key combination (hard or soft
    reset).


    # elvtune


    elvtune allows to tune the I/O elevator per blockdevice queue basis.


    # fdisk


    fdisk is a disk partition table manipulator.


    # fsck.minix


    fsck.minix performs a consistency check for the Linux MINIX filesystem.


    # hwclock


    hwclock queries and sets the hardware clock (Also called the RTC or BIOS clock).


    # kbdrate


    kbdrate resets the keyboard repeat rate and delay time.'
  merge: -1
