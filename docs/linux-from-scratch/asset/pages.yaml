  md: '# # Installing Bzip2


    # # Installation of Bzip2


    Install Bzip2 by running the following commands:


    ```

    root:bzip2-1.0.1# make -f Makefile-libbzz2_so

    root:bzip2-1.0.1# make bzip2recover libbz2.a

    root:bzip2-1.0.1# cp bzip2-shared /bin/bzip2

    root:bzip2-1.0.1# cp bzip2recover /bin

    root:bzip2-1.0.1# cp bzip2.1 /usr/share/man/man1

    root:bzip2-1.0.1# cp bzlib.h /usr/include

    root:bzip2-1.0.1# cp -a libbz2.so* libbz2.a /lib

    root:bzip2-1.0.1# rm /usr/lib/libbz2.a

    root:bzip2-1.0.1# cd /bin

    root# rm bunzip2 && ln -s bzip2 bunzip2

    root# rm bzcat && ln -s bzip2 bzcat

    root# cd /usr/share/man/man1

    man1# ln -s bzip2.1 bzip2.1

    man1# ln -s bzip2.1 bzcat.1

    man1# ln -s bzip2.1 bzip2-recover

    ```


    Although it''s not strictly part of a basic LFS system it''s worth mentioning
    that you can download a patch for Tar which enables the tar program to compress
    and uncompress using bzip2/bunzip easily. With a plain tar you''ll have to use
    constructions like bzcat file.tarxz or tar --compress-prog=bunzip2 -xvf file.tar.bz
    to use bzip2 and bunzip2 with tar. This patch gives you the -y option so you can
    unpack a Bzip2 archive with tar xvy file.tar.bz. Applying this patch will be mentioned
    later on when you re-install the Tar package.


    # # Contents


    The Bzip2 packages contains bzip2, bunzip2, bzcat and bzip2recover programs.


    # # Description

    Bzip2


    bzip2 compresses files using the Burrows-Wheeler block sorting text compression
    algorithm, and Huffman coding. Compression is generally better than that achieved
    by many conventional LZ77/LZ78–based compressors, and approaches the performance
    of the PPM family of statistical compressors.


    Installing Bzip2'
