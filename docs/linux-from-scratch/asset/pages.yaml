    information in certain parts, it''s the easiest way to read it and not to mention
    the easiest way for me to maintain the book.


    # Part I – Introduction


    Part One gives you general information about this book (versions, where to get
    it, changelog, mailinglists and how to get in touch with me). It also explains
    a few important aspects you really want and need to read before you start building
    an LFS system.


    # Part II – Installation of the LFS system


    Part Two guides you through the installation of the LFS system which will be the
    foundation for the rest of the system. Whatever you choose to do with your brand
    new LFS system, it will be built on the foundation that''s installed in this part.


    # Part III – Appendixices


    Part Three contains various Appendixices.'
