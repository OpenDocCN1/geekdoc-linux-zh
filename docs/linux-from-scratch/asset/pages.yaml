    If you have a lot of Autoconf–generated configure scripts, the autoreconf program
    can save you some work. It runs autoconf–(and autoheader, where appropriate) repeatedly
    to remake the Autoconf configure scripts and configuration header templates in
    the directory tree rooted at the current directory.


