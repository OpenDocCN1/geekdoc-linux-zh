- img_proc: true
  md: '# Installing a kernel


    A kernel is the heart of a Linux system. We could use the kernel image from our
    normal system, but we might as compile a new kernel from the most recent kernel
    sources available.


    Building the kernel involves a few steps: configuring it and compiling it. There
    are a few ways to configure the kernel. If you don''t like the way this book does
    it, read the README file and find out what your other options are. Run the following
    commands to build the kernel:


    ```

    root:linux# make mrproper

    root:linux# make menuconfig

    root:linux# make dep

    root:linux# make bzImage

    root:linux# make modules

    root:linux# make modules_install

    root:linux# cp arch/i386/boot/bzImage /boot/lfskernel

    root:linux# cp System.map /boot

    ```'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# Adding an entry to LILO


    In order to being able to boot from this partition, we need to update our /etc/lilo.conf
    file. Add the following lines to lilo.conf:


    ```

    image=/boot/fskernel

    label=lfs

    root=<partition>

    read-only

    ```


    <partition> must be replaced by your partition''s designation (which would be
    /dev/hda5 in my case).


    Now update the boot loader by running:


    ```

    root:~# lilo

    ```'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# Testing the system


    Now that all software has been installed, bootscripts have been created and the
    local network is setup, it''s time for you to reboot your computer and test these
    new scripts to verify that they actually work. You first want to execute them
    manually from the /etc/init.d directory so you can fix the most obvious problems
    (typos, wrong paths and such). When those scripts seem to work just manually they
    should also work during a system start or shutdown. There''s only one way to test
    that. Shutdown your system with shutdown -r now and reboot into LFS. After the
