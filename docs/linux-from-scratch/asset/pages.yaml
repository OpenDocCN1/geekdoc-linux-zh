  md: '# Debugging symbols and compiler optimizations


    Most programs and libraries by default are compiled with debugging symbols and
    optimizing level 2 (gcc options -g and -O2) compiled for a specific CPU. On Intel
    platforms software is compiled for i386 processors by default. If you do not wish
    to run software on other machines than your own, you might want to change the
    default compiler options so that they will be compiled with a higher optimization
    level, no debugging symbols and generate code for your specific architecture.
    Let me first explain what debugging symbols are.


    A program compiled with debugging symbols means you can run a program or library
    through a debugger and the debugger''s output will be user friendly. These debugging
    symbols also enlace the program or library significantly.


    To remove debugging symbols from a binary (must be a.out or ELF binary) `strip
    --debug filename` You can use wild cards if you need to strip debugging symbols
    from multiple files (something like `strip --strip-debug SLFS/usr/bin/*`). Another,
    easier is just not to compile programs with debugging symbols. Most people will
    probably never use a debugger on software, so by leaving these symbols out you
    can save a lot of diskspace.


    Before you use these debugging symbols would make a big difference, here are some
    statistics:


    +   * A Dynamic binary with debugging symbols: 1.2MB

    * A Dynamic binary without debugging symbols: 478KB

    * /lib and /usr/lib (libc and gcc files) with debugging symbols: 87MB

    * /lib and /usr/lib (libc and gcc files) without debugging symbols: 16MB


    Sizes may vary depending on which compiler was used and which C library was used
    to link dynamic programs, but your results will be similar if you compare programs
    with and without debugging symbols. After I was done with this chapter and stripped
    all debugging symbols from all LFS binaries I regained a little over 102 MB of
    diskspace. Quite the difference.


    There are a few ways to change the default compiler options. One way is to edit
    Makefile file you find in a package, like for CFLAGS and CXXFLAGS (a well designed
    package use gcc compiler options and CXX compiler options) and change their values.
    Packages like binutils, gcc, glibc and others have a lot of Makefile files in
    subdirectories so would take a lot of time to do. Instead there''s an easier way
    to do: create CFLAGS and CXXFLAGS environment variables. Most scripts read the
    CFLAGS and CXXFLAGS variables and use them in the Makefile. A few packages do
    not follow this convention and those package require manual editing.


    In the next section we''ll create the SLFS/root/bash_profile that will contain
    the following optimization:


    ```

    CFLAGS=-O3 -mcpu=xxx -march=xxx

    CXXFLAGS=$CFLAGS

    ```


    Debugging symbols and compiler optimizations'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# Linux From Scratch


    This is a minimal set of optimizations that ensures works on almost all platforms.
    These two options (mcpu and march) will compile the binaries with specific instructions
    for that CPU you have specified. This means you can''t copy this binary to a lower
    class CPU and execute it. It will either work very unreliable or not at all (it
    will give errors like Illegal Instruction, core dumped). You''ll have to read
    the GCC Info page to find more possible optimization flags. In the above environment
    variable you have to replace xxx and yyy with the appropriate CPU identifiers
    such as i586, i686, powerpc and others.


    Please keep in mind that if you find a package doesn''t compile and gives errors
    like "segmentation fault, core dumped" it''s most likely got to do with these
    compiler optimizations. Try lowering the optimizing level by changing -O3 to -O2.
    If that doesn''t work try -O or leave it all together. Also try changing the -mcpu
    and march variables. Compilers are very sensitive to certain hardware too. Bad
    memory can cause compilation problems when a high level of optimization is used,
    like the -O3 setting. The fact that I don''t have any problems compiling everything
    with -O3 doesn''t mean you won''t have any problems either. Another problem can
    be the Binary installed on your system which often causes problems in Glibc (most
    noticeable in RedHat because RedHat often uses beta software which aren''t always
    very stable. "RedHat likes living on the bleeding edge, but leaves the bleeding
    up to you" (quoted from somebody on the lfs-discussion mailinglist).


    Debugging symbols and compiler optimizations


    86'
  merge: -1
