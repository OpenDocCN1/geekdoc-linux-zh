    If your base system is running a 2.0 kernel and Glibc version is 2.1 then you
    will likely get problems executing M4 in the chrooted environment due to incompatibilities
    between the M4 program, Glibc–2.1 and the running 2.0 kernel. If you have problems
    executing the m4 program in the chrooted environment (for example when you install
    the autoconf and automake packages) you''ll have to exit the chrooted environment
    and complete M4 statically. This binary is linked against Glibc 2.0 (if you run
    kernel 2.0 and Glib version is 2.0 as well on a decent kernel. Kernel 2.0 and
    Glibc–2.1 do not mix well and won''t give you any problems.


    To create a statically linked version of M4, execute the following commands:


    ```

    root:m4-1.4# logout

    root:lfs# cd $LFS/usr/src/m4-1.4

    root:m4-1.4# ./configure --prefix=/usr --disable-nls

    root:m4-1.4# make LDFLAGS=-static

    root:m4-1.4# make prefix=$LFS/usr install

    root:m4-1.4# chroot $LFS env -i HOME=/root bash --login

    ```


    Now you can re-enter the chrooted environment and continue with the next package.
    If you wish to recompile M4 dynamically, you can do that after you rebooted into
    the LFS system rather than chrooted into it.


