- - '###'
  - 在运行 echo 'a b c' 之前获取排他锁 'local-lock-file'。
- - '###'
  - 此形式在 shell 脚本内部很方便。打开文件所用的模式对 flock 没有影响；使用 > 或 >> 允许在锁文件尚不存在时创建它，但是，需要写权限。使用
    < 要求文件已经存在，但只需要读权限。
- - '###'
  - 这是 shell 脚本中很有用的样板代码。将其放在您想要加锁的 shell 脚本顶部，它在第一次运行时会自动加锁。如果环境变量 $FLOCKER 未设置为正在运行的
    shell 脚本，则执行 flock 并在重新以正确参数执行自身之前获取一个排他的非阻塞锁（使用脚本本身作为锁文件）。它还将 FLOCKER 环境变量设置为正确的值，以防止再次运行。
