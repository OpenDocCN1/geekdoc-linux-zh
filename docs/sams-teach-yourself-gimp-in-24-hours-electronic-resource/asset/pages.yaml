- pgno: 135
  md: '# FIGURE 8.9


    The "man in the moon" might look a little different through the eyes of a lion!


    ![](img/0183f053b347a6407a2381be231d0345_135_0.png)


    # Lesson 2—Layering Multiple Images


    In this lesson, you will combine the use of layers and transformation tools to
    create a reflection.


    You will need the moon image again for this tutorial, so open moon.jpg. You will
    also need water.jpg, and stars.jpg. See Figure 8.10.


    # FIGURE 8.10


    You will have all the components of a good picture. You just need to perform a
    little magic known as layering on them.


    ![](img/0183f053b347a6407a2381be231d0345_135_1.png)


    Begin by opening a new image, size 400 × 400. Open the Layers and Channels dialog
    box and add a new layer, name it sky.


    You will want the image of the stars as the first layer, so copy and paste it
