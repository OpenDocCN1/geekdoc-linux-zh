- pgno: 310
  md: 'frequently happens when the user references a font that is not installed (or
    is mis-spelled


    +   Q I downloaded a script into my .gimp/scripts directory, but it''s not showing
    up.

    A Make sure to click Refresh from the Xtns menu any time you add a script.


    # # Exercise


    You touched on some pretty interesting scripts in this hour, but there are still
    many, many scripts to be explored. Because you probably now have a good idea how
    to get around in these scripts and where they go, you should play with every single
    one of them. And I strongly recommend that you pay a visit to gimp.org and find
    places to download as many new scripts as you can. I urge and implore you to find
    and collect more scripts than you can handle. You never know what kind of effect,
    texture, logo, or utility you''ll bump into.'
