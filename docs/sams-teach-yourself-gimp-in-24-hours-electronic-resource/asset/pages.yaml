- pgno: 232
  md: '# Web Graphics


    # 213


    To add links to buttons in a console, it will need to be converted into an image
    map. This is a method of choosing a selected portion of an image and assigning
    the link URL to that portion only. That way, the buttons, although all part of
    the same image, can link to different places. Another way to accomplish this would
    be to dice the image into a series of smaller graphics that fit back together,
    appearing as one on the completed page.


    ![](img/0183f053b347a6407a2381be231d0345_232_0.png)


    15


    # Summary


    This hour gives you a brief introduction to some Web-weaving techniques from a
    graphical point of view. Although there are many other aspects to be considered
    in building Web sites, graphics are an integral part of Web pages. Learning how
    to create and manipulate Web-ready images in the GIMP gives you a head start on
    Web site design.


    # Q&A


    +   I have an image surrounded by a colored background that I''d like to make
    transparent for a GIF. How can I get the color to be transparent?


    +   Select the color or portion of the image you want to change and right-click,
    and choose Edit, Cut. Anything that is included in the selected area will become
    transparent.


    +   Why make all those navigational buttons? Can''t I just put everything on one
    big page?


    +   You could, but a large size on one page would require a lot of scrolling to
    go through the entire page, and people won''t scroll! As a rule of thumb, anything
    over to three screens worth on a page is considered bad design. Plus, the link
    buttons to other pages can help keep everything categorized for people who are
    looking for a specific thing.


    # Exercise


    Because this hour was spent discussing Web graphics, your assignment is to get
    on the Net and use a search engine to find sites that have interests similar to
    what you might like to have on your personal Web site. Check out the ways other
    people have designed their sites and created graphics. Make a mental note of things
    you like and things you don''t.'
  merge: -1
  img_proc: true
