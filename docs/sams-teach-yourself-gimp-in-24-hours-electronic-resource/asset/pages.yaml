- pgno: 304
  md: '# What the Heck Is Script-Fu?


    285


    Script-Fu can make the art of creating Web sites quick and pain-less.


    # Figure 21.8


    ![](img/0183f053b347a6407a2381be231d0345_304_0.png)


    Here''s a quick Web I whipped up using Script-Fu and a text editor. It''s not
    the best I''ve ever done, but it''s not bad for being put together in 10 minutes
    flat. By using a little trick of HTML I was able to create a page with a matching
    set of buttons, icons, and little with ease.


    Script-Fu in concert with other techniques can help you turn some pretty nice
    sites, and save you a bit of time in the process.


    +   * I scripted out by rendering the graphics by one with Script-FU using the
    "Beveled Pattern"

    * Then I created a quick background using image using the same pattern.

    * I set up the webpage in Netscape Composer.

    * I used Vim to write the HTML until it was a little more to my liking.


    You can also draft some quick buttons for the Web site, as shown in Figure 21.9—Script-Fu
    has covered this well. Under Xtns, Script-Fu, Buttons, a script can be found that
    will generate a beveled button with text according to any specifications you choose.
    You can even make matching pressed buttons if you like, which is great for those
    JavaScript mouse-overs. Be careful, though—this filter do require pretty thorough
    font information.


    # Figure 21.9


    Matching buttons is now a simple task. It''s a good idea to save that background
    layer as a template for other buttons, so you can make a perfectly matched set
    if you want.


    ![](img/0183f053b347a6407a2381be231d0345_304_1.png)


    ![](img/0183f053b347a6407a2381be231d0345_304_2.png)'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Other Effects


    Script-Fu can also be used to create many other things besides simple text. Among
    others, they can render patterns, fractals, geometric shapes, and many other odd
    things, of which you might find useful. You can find some of these scripts under
    Xns, Script-Fu, Patterns and Xns, Script-Fu, Misc. I haven''t gone into much detail
    here, as each of these scripts has their own special purpose, and some of these
    are merely proof of concept exercises more than anything. Figure 21.10 illustrates
    some of the possibilities available with these type of scripts.


    # FIGURE 21.10


    Some of the patterns and textures produced by Script-Fu.


    ![](img/0183f053b347a6407a2381be231d0345_305_0.png)


    # Script-Fu to Alter Images


    Now come some of the other type of scripts—those that alter images and behave
    like a filter. Remember that most of these scripts can be found from the right-click
    menu Script-Fu. Unlike their counterparts, these kinds of scripts require the
    presence of an open active image on which to do their work. And their effects
    on your image are limited only by the scripter''s ingenuity. Alas, I have encountered
    scripts that do little to an image, and others that leave it in a completely unrecognizable
    state. That''s part of what makes playing with and trying new scripts so.


    # Drop Shadow


    The first example illustrates a simple, yet very helpful utility: the Drop Shadow.
    No more hassling with blurring and offsetting here—a simple execution of a script
    can give you your object a nice, clean, antialased drop shadow in a matter of
    seconds. This will lend your image a nice, simple, 3D look and feel.'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# What the Heck Script-Fu?


    In order to use this script, you should work with a layered image, preferably
    with the object you want to shadow on its own transparent layer.


    First


    FIGURE 21.11

    Drop shadowing adds a touch of realism to your image.


    ![](img/0183f053b347a6407a2381be231d0345_306_0.png)


    Sometimes this script has a habit of leaving the drop shadow on the top layer,
    so you might need to lower the layer to directly below the subject''s layer from
    the Layer dialog box.


    # Perspective Shadow


    The Perspective Shadow is like the Drop Shadow but with a touch more sophistication.
    It enables you to create a shadow with a much more realistic 3D perspective from
    any angle.


    From the same menu as the Drop Shadow, the Perspective Shadow dialog gives you
    some important options. The most important of these is Angle, which is to the
    direction of the shadow itself (see Figure 21.12). You can effectively change
    the direction of the shadow by means of this control. You can alter the opacity,
    color, length, and horizon distance as well. As before, you will need a separate,
    layered selection, and then you can execute the script. Your shadow should appear.


    ![](img/0183f053b347a6407a2381be231d0345_306_1.png)'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# FIGURE 21.12


    Quite realistic for a quick shadow.


    ![](img/0183f053b347a6407a2381be231d0345_307_0.png)


    | Property | Value |

    |---|-|

    | Angle | 45 |

    | Relative horizon (distance) | 0.0 |

    | Relative shadow (length) | 1.0 |

    | Blur Radius | 10 |

    | Opacity | 80 |

    | Script Toggle | X Interpolate |

    | Strict Toggle | X Alpha Filtering |

    | OK Cancel |


    When dealing with shadows, borders, glows, and other such effects, I find it handy
    to render the effect onto its own layer. Instead of trying to find the perfect
    luminance from within the plug-in or script itself, I will make the effect at
    full darkness (lightness), and then adjust the effect$depth by moving the Opacity
    slider for that layer in the GIMP layer dialog box. That way, I can avoid guessing
    the perfect shade beforehand, and therefore avoid redoing the effect if I find
    it too light or too dark for my liking.


    # Add Bevel


    Under the right-click menu, select Script-Fu, Decor, and you will find a few scripts
    that add an aesthetic touch to your image, and therefore act as effective filters.
    One of my personal favorites is Add Bevel. This by far surpasses doing bevel by
    hand—even if it limits your options a little—and is indeed a fantastic time-saver.
    Again, as before, you will need a selection, preferably on a separate layer before
    you execute the script. The script simply creates a bump map and renders your
    object with a grooved 3D edge. And, of course, this effect is most useful on text
    headers in combination with a drop shadow (see Figure 21.13).


    Sometimes it''s useful to adjust the brightness and contrast of a freshly beveled
    layer in order to add a little more depth.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# What the Heck Is Script-Fu?


    # FIGURE 21.13


    Beveled logos are classic and now fairly simple to create.


    ![](img/0183f053b347a6407a2381be231d0345_308_0.png)


    # Line Nova


    As a quick example of some of the more radical scripts are good for, I present
    to one called Line Nova. It creates a bunch of concentrically centered pointed
    lines. It''s pretty simple and pretty cool. See Figure 21.14 for an example of
    what I am talking about.


    # FIGURE 21.14


