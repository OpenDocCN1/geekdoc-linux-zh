- pgno: 254
  md: '# Photo Restoration and Enhancement


    # Tinting


    The tint used on many older photos was the Sepia tone. Sepia toning produced a
    brownish-red hue to the entire picture giving it a certain unique quality and
    warmer appearance than a regular black-and-white picture. By reproducing the look,
    a newer photo can achieve a real old-time look.


    To give a photo (or any other) tone is easy to accomplish in GIMP. Open the picture
    you want to tint, right-click and select Image, Color, Hue-Saturation. By playing
    around with the sliders, you will be able to apply the hue of your choice.


    # Colorizing


    Have you ever seen an old photo that looks as though it was painted over watercolors?
    Basically, that''s the method they had to use in the early days before film became
    widely available. This look is also fairly easy to duplicate with only a paint-brush
    and a blend mode.


    To begin, open the image you want to colorize.


    Bring up the Brush dialog box and after choosing your brush size and shape, click
    on the blend mode drop-down menu and choose Color as the blend mode. In essence,
    this enables the original image luminance to show through while accepting the
    new color hue.


    Choose the color you want to begin painting in the foreground color area of the
    toolbox and watch your picture spring to life as you paint.


    Another way you can do this is to add a new transparent layer to the image and
    access the Color blend mode from the Layer dialog window. By doing it this way,
    you also have control over the opacity of the painted layer if you need be.


    # Red Eye


    When the light from a camera flash hits the eye of a subject at a certain angle
    (usually looking straight at the camera), the result is that the flash reflects
    off the eyes and can cause an unattractive orange-red tinge to the finished photo.


    Most cases of red eye can be fixed fairly effortlessly. Usually all that is required
    is the use of a selection tool as the Lasso to select the eye area, and then right-click,
    Image, Color, Hue-Saturation to bring up the options and adjust the hue slider
    until the color is back to normal.


    When an animal looks straight at the camera flash, it can also result in red eye
    or even worse, a reflection making the eyes appear a bright green or yellow, such
    as happened to the pup in Figure 17.9.


    ![](img/0183f053b347a6407a2381be231d0345_254_0.png)'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# FIGURE 17.9


    In reality, this dog possesses big brown eyes, but the reflection of a flash bulb
    has hidden them.


    ![](img/0183f053b347a6407a2381be231d0345_255_0.png)


    The first step to repair the damage here is to zoom in and use the Lasso to select
    the eyes. After selecting the first eye, hold the Shift key, which will allow
    you to then add the second eye as a selection also (see Figure 17.10).


    # FIGURE 17.10


    By using the Lasso to select the discolored eye areas, the color changes will
    not affect the rest of the image


    ![](img/0183f053b347a6407a2381be231d0345_255_1.png)


    Because these eyes are reflecting so badly, there''s more to than just change
    the hue to brown. Right-click and select Image, Colors, Hue-Saturation. In addition
    to getting the right hue, I also need to get rid of the reflect by greatly lowering
    the Lightness slider.


    With these changes comes a vast improvement to the image, but because the area
    required such a major shift in brightness, the selections have now acquired jagged
    edges and do not blend well with the surrounding area.


    To remedy this, with the eyes selected, right-click, Select, Grow, and set the
    grow to 2 pixels. This expands the selected areas just a little (see Figure 17.11).


    Right-click and select Filters, Blur. By blurring the selections, the outer edges
    of the changed eyes will blend with the image, as in Figure 17.12.


    # Color Enhancement


    Sometimes a photo can be enhanced by changing and brightening some of the colors.
    Open the burro.jpg image from the CD-ROM exercise section and I''ll show you what
    I mean (see Figure 17.13).'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# FIGURE 17.11


    By using the Grow option from the selection menu, you can expand the selected
    area by a chosen number of pixels.


    ![](img/0183f053b347a6407a2381be231d0345_256_0.png)


    # FIGURE 17.12


    Now this dog looks more like herself, and less like Master Po!


    ![](img/0183f053b347a6407a2381be231d0345_256_1.png)


    # FIGURE 17.13


    A tan colored burro on a winter day doesn''t make a very colorful image.


    ![](img/0183f053b347a6407a2381be231d0345_256_2.png)


    This image has only two basic elements, the burro and the grass in the background.
    What you need to accomplish here is a greater color differentiation between the
    two.


    First of all, use either the Lasso or Bézier Select tool to select the area around
    the burro. Now, right-click and go to Image. Color, Color Balance. By playing
    with the sliders, increase the red hue to make the burro a slightly darker, richer
    shade of brown.


    Next, right-click and choose Select, Invert, to switch the selection area to the
    grassy background. Once again, right-click, Image, Color, Color Balance, but this
    time, adjust the sliders so that the grass looks green as if it were spring. With
    just these two adjustments, the washed out picture will gain enough color contrast
    to make it into a pretty photo.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# Edge Effects


    In some of the previous hours, you’ve learned many cool ways to apply edge effects
    to images by using masks, gradients, feathering, and so forth.


    Wrap up this hour, you’ll learn to create one more simple yet interesting edge’s
    to add to certain photos.


    To start, you’ll need to open an image. Use the burro from the last lesson.


    What you will do here is create a look that resembles a torn and burned edge.
    The first step is to use the Lasso tool to select an uneven jagged area around
    the image so that it will appear as if it is ripped along the edges (see Figure
    17.14).


    FIGURE 17.14

    Visualize a piece of ripped paper while you form this selection.


    ![](img/0183f053b347a6407a2381be231d0345_257_0.png)


    Right-click and choose Select, Invert, to reverse the selected area to the outside
    border.


    Open the Pattern dialog box (File, Dialogs, Patterns) and choose a pattern to
    put in the selected area. I’ve chosen one called *pine*. Use the Bucket tool to
    fill in the selection with the pattern (or you can use the Clone tool to set the
    pattern source and paint the pattern). At this point, your image should look something
    like Figure 17.15.


    FIGURE 17.15

    By filling the back-ground with a pattern, the image is beginning to stand out.


    ![](img/0183f053b347a6407a2381be231d0345_257_1.png)'
  merge: -1
  img_proc: true
