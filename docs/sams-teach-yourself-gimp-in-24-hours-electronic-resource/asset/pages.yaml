- pgno: 320
  md: '# HOUR 23


    # Animations


    Animations are one of the more entertaining aspects of working with digital graphics.
    Creating an image that appears to move is a little eye candy that can enhance
    any project. (For instance, what would the Netscape/Mozilla browser be like without
    that little animated lizard?)


    You probably have noticed what impact a simple movement can have on a Web site.
    A scrolling banner or small, animated button can make quite a difference and enhance
    the site considerably without a lot of effort. (Wilber''s eyes on gimp.org or
    the title on opencontent.org are good examples of animation used well.) Sure,
    it''s frivolous, but people like things add a little life to something that is
    static and motionless.


    Likewise, a Web page with way too many animated GIFs can be distracting and can
    look downright goofy, and thus detract from the entire experience. It is obvious
    that animation itself well, if used, can enhance or break a site altogether. (I''m
    sure you have run across sites built by newbies who got carried away with animated
    GIF fever. It is sometimes difficult to avoid the temptation to overuse a new
    technique.) Therefore, it is easy to see how much impact these animations can
    have.


    The GIMP in particuliers lends itself well to creating graphics for use on the
    Web, and animations are no exception. In this hour, you''ll learn a few'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'techniques for creating some simple animated graphics for the Web and otherwise,
    as well as optimizing them for use in low-bandwidth situations.


    # Creating a Simple Animation


    As you probably already know, an animation is a visual effect created by layering
    frames of the same subject in motion, and cycling through them at a speed that
    is high enough to fool the human eye (You probably made those little animated
    flip books in elementary school). Well, making animations digitally is really
    different. You start out with many different images, or frames, which represent
    a continual flow of motion, and then you pile one on top of the other, and play
    them in sequence to create the illusion of motion.


    Creating an animation in GIMP is really as easy because working with the individual
    frames of an animation is really the same as dealing with layers. The Layer dialog
    box in this case doubles as a frame manager. The only real difference is that
    the layers must have a specific name in which the timing information is stored.
    Example of this is shown in Figure 23.1.


    FIGURE 23.1


    If you use layers in GIMP, you can build an animation.


    ![](img/0183f053b347a6407a2381be231d0345_321_0.png)


    To build an animation, you need to start with a clean canvas, and then add a layer
    for each subsequent frame. This is really no different than drawing a cartoon,
    altering the subject over so slightly in each frame to achieve the illusion of
    motion.


    ![](img/0183f053b347a6407a2381be231d0345_321_1.png)


    You will, however, probably want to build your frames more or less separately,
    and then combine them into your final animation. When building animations, the
    Layers dialog box becomes a frame manager, and works pretty much the same, except
    that animation frames do not support varying degrees of opacity, as with many
    layered images. Animations support'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# Animations


    transparency and full opacity with no variations. If you create an animation with
    pixels that allow shades of the image behind to show through (as with drop shadows),
    such pixels will be effectively converted to a solid or trans-pency when saving
    to GIF89a.


    In this example, I will build a simple text logo animation so you can get a feel
    for it. This one replicates a spotlight effect and was made with the gradient
    editor, on layers protected transparencies, and with the added assistance of Script-Fu.
    It was created with detail in mind as opposed to size. It is included on the CD-ROM
    so you can take a peek at it if you want (for a proof of concept as to how animations
    basically work).


    +   - The first thing you''ll want to do is by creating the first frame of your
    anima-tion onto the first layer (see Figure 23.2). Name this Frame 1, (Or Frame
    0, if you''re real picky like me).


    # FIGURE 23.2


    An animation has to start somewhere.


    ![](img/0183f053b347a6407a2381be231d0345_322_0.png)


    +   - The next step, as you''ve already probably guessed, is to create your next
    frame. You do this by creating a new transparent layer in the Layer dialog box.
    You will need to name it Frame 2. In this example, I have already prepared all
    the individual frames from separate images beforehand, so I am merely pasting
    each frame onto a new layer (see Figure 23.3). This is usually the most convenient
    way to approach animations that aren''t too terribly complex.


    +   - Continue in this fashion until all the frames are created and the movement
    proceeds in an endless looping fashion (unless you want a play-once animation).
    When all the frames are in place, you can test your animation by right-clicking
    the image and going to Filters, Animation, Animation Playback. After clicking
    Play, your animation should spring to life (see Figure 23.4).


    At this point, a preliminary animation is built, but there is still some work
    to be done. For one, you might have noticed that your animation is a little choppy—that
    is, there is a delay between frames. Fortunately, you can change the delay between
    frames. In GIMP, the timing for the frames is reflected directly within the frame
    naming convention. It might be a bit disconcerting at first. For example, if you
    want frame two to appear for only 100 milliseconds, rename it to Frame 2 (100ms).'
