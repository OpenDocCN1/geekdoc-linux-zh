- pgno: 248
  md: '# HOUR 17


    # Photo Restoration and Enhancement


    In Hour 16, "Photo Compositing," you looked at some of the different ways of combining
    images, but you haven''t really explored the possibilities for repairing and enhancing
    photos that aren''t quite right to begin with.


    If you have experimented, a little bit with photography or taken some quick snapshots,
    you know that there are many variables to be considered for a good picture. The
    subject, lighting, angle, background, and camera adjustments themselves, can all
    affect the way a picture turns out.


    Luckily for you, you have GIMP and its uncanny capability to easily correct most
    of the flaws and mistakes in your pictures. Just about any photo problem can be
    remedied with the tools at hand. In this hour, you will learn some tips on how
    to:


    +   * Restore old photos

    * Add enhancing touches to newer photos

    * Create a cool photo edge effect


    ![](img/0183f053b347a6407a2381be231d0345_248_0.png)'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# "This Photo Looks Bad! Is It Salvageable?"


    Almost all pictures can be improved in some way, even pictures that are extremely
    aged. In the case of old photographs, many times that all is needed is a little
    color adjustment. You might want to refer to Hour 7, "Working with Color," to
    refresh your memory on the different color adjustment tools and what they can
    accomplish before you begin practicing photo repair.


    # Tips and Tricks for Working with Old Photos


    The following is a general list of some practical techniques to keep in mind when
    manipulating photos:


    +   - Always work on a copy and keep it side by side with the original to make
    it easy to compare and decide on changes as you make them.

    - The Zoom tool is invaluable for photo restoration. It to greatly magnify small
    areas that might need pixel-by-pixel editing.

    - Most basic color functions in the GIMP can be accessed by right-clicking and
    selecting Image, Colors.

    - For old photos that have yielded, a simple grayscale conversion can work wonders.
    However, you might want to use the Desaturate option so that the color depth is
    not reduced in the process.

    - Faded pictures can be brought back to life with either the Normalize or Auto
    Stretch options in the Color menu.

    - For photos that are blurry, try applying the Sharpen function located in the
    Filters under Enhance. If only a portion of the image is blurry, you can make
    a selection around it before applying this feature.


    # Removing Flaws


    A major problem that plagues older photos is that they''ve been passed around
    a lot and haven''t been properly stored, resulting in things like scratches, bends,
    and frayed edges.


    Here you''ll take a couple of old photos that are in need of repair so you can
    see how to begin the restoration process.


    The first photo (see Figure 17.1) is about 50 years old, but looks so old as it
    has been through the w. It has been badly frayed, scratched, and stained.


    In a case like this, where almost every part of the image needs work, the first
    step is to pick a starting place and zoom in on it to get a really good look at
    the damage, as in Figure 17.2. That way, you can work on a small area at a time
    to see if the damage can be undone.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# FIGURE 17.1


    This badly damaged photo looks as if it did some time in a wallet!


    ![](img/0183f053b347a6407a2381be231d0345_250_0.png)


    # FIGURE 17.2


    By magnifying the area, it''s much easier to work on.


    ![](img/0183f053b347a6407a2381be231d0345_250_1.png)


    > Reminder: By right-clicking on the image and selecting View, New View, you will
    open a duplicate image window that will show the same changes you make to the
    first window. This is convenient to open so that you can see how the changes you
    are applying to a magnified area will look when not magnified without having to
    zoom in and out.


    In actuality you can greatly repair this photo with the use of just one tool:
    the Clone tool. As you might remember from Hour 3, "Basic GIMP Tools," the Clone
    tool is capable of picking up an exact duplicate or clone of an image area, pattern,
    or color, which can then be placed elsewhere. This works wonderfully in photo
    repair because you can pick up the'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'exact colors you need to cover scratches, bends, and so on, directly from the
    area surrounding the damage, and then replace the bad portions with the cloned
    portions, perfectly-blending colors and textures.


    The Clone tool uses the Brush dialog box (File, Dialog, Brushes) to set the size
    and shape of the area, so that you can clone one pixel at a time, which is great
    for areas that need extreme detail. Or you can set a bigger brush size to paint
    in large areas of the image, which is good for filling in missing pieces of backgrounds.


    Double-click the Clone tool to bring up the options, as in Figure 17.3.


    # 17.3


    The Clone tool offers a few choices.


    ![](img/0183f053b347a6407a2381be231d0345_251_0.png)


    +   - Image Source—Clones a selected area of the image.

    - Pattern Source—Enables painting with a chosen pattern.

    - Aligned—When this option is checked, the Clone brush can create a duplicate
    of an entire image or pattern from the point where you begin painting. If you
    release the mouse button, and then begin painting again, it will pick up where
    you left off. In other words, it allows you to stop painting and resume without
    starting a new clone. With the Aligned option unchecked, the cloned area will
    be duplicated over and again, starting a new clone area each time you release
    the mouse and start painting.


    To clone an area, place the cursor over it, and hold the Ctrl button. Then release
    Ctrl and left-click in the area you want to begin painting with the clone. As
    you can see in Figure 17.4, by using the Clone tool and a small brush, the bend
    and scratch are already beginning to disappear.


    After working with this tool, you''ll find you can do some major repair extremely
    quickly and easily. Even with no additional restoration, the photo, shown in Figure
    17.5, is already looking a lot better.


    > Try using one of the artistic filters, such as the GIMPressionist, to add some
    texture and help hide flaws in a severely damaged image.'
  merge: -1
  img_proc: true
