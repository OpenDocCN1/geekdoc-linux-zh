    # Summary


    In this hour, you were introduced to the wonder that is Script-Fu, and looked
    at a few examples. There were no tutorials in this hour, but don''t worry, the
    next hour will uncover some more Script-Fu secrets!


    Because this is a brief primer, I did not cover all the scripts. There are simply
    too many out there already, and to attempt to do so would be an effort in futility.
    (And the GIMP is such a young program!) For every script I touched on, there are
    at least 10 more that are equal or greater utility and coolness factor. Each script
    has its own unique behavior and purpose, these can be best understood by direct
    contact with the scripts. Script-Fu encompasses a lot of different functions,
    and therefore can be used for many things that we probably haven''t really thought
    of. We are living on the bleeding edge of development and experimentation, and
    I can think of no better environment for this in the graphical realm than the
    GIMP and Script-Fu.


    # Q&A


    +   - When I try to execute a script, I keep getting a Procedural Error and the
    script exits. What does this mean?


    +   - A means that the script ran into a variable whose value was non-existent
    for some reason, and the script could not continue. For this example,'
