    ![](img/0183f053b347a6407a2381be231d0345_138_0.png)


    8


    # Summary


    By learning the basics of layering during this last hour, you have discovered
    the key to unlock one of the most important powers an image-editing program can
    possess.


    The capability to combine and yet independently edit portions of images will unquestionably
    ensure that you gain a new and distinct form of mastery over your creations.


    # Q&A


    +   - How many layers can I have in a single image?


    +   - Unlimited. The GIMP will allow you to add as many layers as you want. However,
    layering does require a good amount of memory from your computer, and the big-images,
    the more memory it takes. As long as you are fortunate enough to have a nice large
    amount of RAM, the sky is the limit!


    +   - Can I view just one layer at a time?


    +   - Yes. The eye symbol in the Layers & Channels dialog window enables quick-and-viewing
    of one or number of layers at a time. Just click on the Eye icon to add or remove
    a layer from view. By Shift-clicking on the eye, you can hide all but that layer.


    # Exercise


    Practice your newly discovered layering techniques on the images you have been
    working-with in the tutorials for this hour. Add a new layer to each image and
    apply changes of your own, such as using the Airbrush tool and a large brush to
    paint in some clouds over the full moon. Don''t forget to place a reflection of
    the clouds in the water!'
  merge: -1
  img_proc: true
- pgno: 139
  md: <!-- no content -->
