- pgno: 329
  md: '# Q&A


    Q I have changed the duration of each frame, but I want some frames to stick around
    others. Can I do this, or do all frames have to be the same?


    A Fortunately, each frame can have its own individual frame speed. This enables
    you to have more freedom in creating custom animated effects, including momentary
    pauses in motion.


    # Exercise


    A good thing to do when creating Web animations is to play around with optimization
    techniques, such as color depth reduction, dithering, and so on. The smaller you
    can get the file size, the more room you''ll have to play with—to use for more
    animation detail or to ease download time.


    In this hour you covered the animation basics—setting up and creating a few simple
    GIFs by hand—yet the GIMP is capable of handling much more sophisticated animation
    work. If you want to move beyond simple animated GIFs and into some of the more
    complex motion graphics, I encourage you to check out the GAP suite of plug-ins
    (registry.gimp.org). These plug-ins are quite involved and do require a patching
    and recomilation of the entire GIMP source tree, but if you are into high-quality
    animations and want to move beyond simple animated GIFs, it might be the thing
    for you. It is included with the CD-ROM as well under plug-ins.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# HOUR 24


    # Using Peripherals with Linux


    Well, after all the techniques and tutorials outlined in this book, you have acquired
    a basic understanding of how GIMP works, and you have a competent knowledge of
    manipulating digital graphics with it. But, for all that, something this still
    missing... how to get all those digital imaging devices to communicate with the
    GIMP. Using the GIMP is even more fun when digital scanners and cameras are involved.


    For what it''s worth, the quick tips outlined within this hour are pretty Linux-centric
    in nature. If you happen to be running another UNIX variant, the steps illustrated
    here are probably mostly valid there as well, especially if you are using Intel-style
    hardware, but I can make no guarantees that everything will apply exactly the
    same.


    # Digital Scanners


    Ah, yes, the digital scanner. I don''t know what I''d do without one. The scanner
    makes you using your hand-drawn and painted work a snap—not to mention making
    collages and photo manipulation that much easier to do!'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'So you now are faced with the challenge of attaching your scanner device to
    your Linux box. If you are in the market for a good digital scanner, there are
    a few things to keep in if you want to maintain Linux-compatibility.


    +   - A SCSI interface is your best option. Some parallel scanners are supported,
    and you can, at least in theory, get one of those SCSI-to-parallel to work, with
    luck and a lot of hacking, but if you want to keep your sanity, make sure that
    you get a good SCSI card to accompany your scanner.


    +   - You should take a look at the SANE compatibility list. SANE interfacing
    software that is fast becoming the most frequently used and is the one you will
    be dealing with. You can find the list at http://www.mostang.com/sane.


    +   - Don''t be afraid to spend a little extra money. The added quality you will
    gain by spending a little more on a higher end scanner will be worth it. The reason:
    besides scan quality and durability, there is also the issue of user-adjustable
    scanner resolution. You will want a scanner that let you change this easily, otherwise,
    you might be stuck with RAM-intensive scanners at 1800 x 1600 resolution for something
    like your driver''s license photo. This can waste a lot of time.


    There are actually (not surprisingly) a lot of choices when using a scanner with
    Linux. However, the SANE package offers the widest variety of supported devices,
    as well as easy expandability and good networking support. Scanner device support
    is still in its developmental stages in Linux, so you will definitely want to
    check the compatibility list before purchasing a scanner to use explicitly with
    Linux.


    After you have chosen, purchased, and wired your scanner, getting it picked-up
    under Linux isn''t too difficult, provided that you do have a fairly standard
    scanner attached to a SCSI interface.


    The first thing to do is to download the SANE distribution from www.mostang.com/sane.

    After untering the distribution, follow the directions as outlined in the README
    (./configure && make install), and you should be all set. Then you will want to
    start with the scanner command. This brings up the SANE dialog box, as shown in
    Figure 24.1. You can also use it via the command line with the scanner command
    (Consult the man page for more details.).


    By going scanner interface in the dialog box and selecting your scanner interface
    model, you will be ready to scan, as long as there are no difficulties.


    To scan, turn your scanner on, load your source image into the scanner, select
    the proper scanner interface from within xscanimage, and press OK. Your image
    should appear onscreen (see Figure 24.1). You can also use the Preview function
    to get a quick overview of the appearance of your scan.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# Using Peripherals with Linux


    # FIGURE 24.1


    Using a scanner device isn''t too terribly difficult with the GIMP and SANE.


    ![](img/0183f053b347a6407a2381be231d0345_332_0.png)


    Scans frequently come in at a larger size than you want to use for your final
    image. This is actually a good thing because editing your image, and reducing
    the image size usually results in a higher-quality image than if you had scanned
    it at the desired size to begin with.


    You can use xscanimage as a GIMP plug-in by making the following symlink: ln -s
    /usr/local/bin/xscanimage -/.gimp/plug-ins


    It should appear in the GIMP''s Xtns menu.


    Sometimes the scanned image, taken from a book or magazine, might look a little
    grainy. This is due to the inks printed on the medium not translating to screen.
    This can be countered by tinkering with the options in the NL Filters plug-in.
    You can use this, and to make quick work of grainy lines. Also, doing this at
    a larger size, and then reducing the file dimensions will also lessen the grainy
    effect. The SANE package also has support for some functions for the improvement
    of image quality, as as color intensity and gamma. You should play with these
    settings to find what effect works best.


    SANE also comes with a command-line client, scanimage, which has a plethora of
    useful, if not cryptic features. You might want to read the man page or get a
    listing of options with scanimage -h.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# Digital Cameras


    Getting digital cameras to work with Linux is a little more straightforward. There
    are packages for many different types of video and tuning devices under Linux.
    As long as you have a good parallel port interface, you can get many of them to
    work.


    You can find a listing of compatibility client applications for Linux at http://roadrun-ner.swansea.uk.linux/v41.html.


    If you''re using something such as the Quickcam, you can use the application gnomovis
    (available from gnome.org) or something similar to capture and view video-shots.


    # Color Printers


    Fortunately, printers connected directly to the printer port are one of the easiest
    peripheral devices to get working under Linux. In fact, there are only a few obscure
    models that are not supported (beware of Winprinters!) The GIMP print plug-in
    uses a straight PCL/PostScript printing interface with regular UNIX lpd, so this
    plug-in should give you no trouble whatsoever.


    After you have your printer plugged in, you can set it up of two ways.\1 Use the
    Printer Setup utility that comes with Red Linux (on their CD-ROM), or 2 Set it
    up by hand. Both methods are relatively painless, pending a standard printer setup.


    If you set up Red Linux, start the program printroot as shown in Figure 24.2.
    This will give you a nice, friendly TCL/Tk interface to printer configuration.
    Scroll down the list of printers, pick one, and try out the Test Page function.
    If it doesn''t work right away, there are a few things you can try.


    Otherwise, if you do not use printool, you can do this by hand. You can consult
    the Printer Howto, which should either be in /usr/doc, or you can find it in the
    Linux Documentation project Web site: http://metalab.unc.edu/LDP/index.html.


    The next thing to take care of is the GIMP print plug-in (see Figure 24.3). This
    should be installed by default, but if not, it is easy to do with gimptool. After
    you have taken care of, start the GIMP, open an image, and try printing it. Right-click
    and select File, Print; choose the printer resolution and layout and press OK.


    Sometimes, printing something in the GIMP, even on a nice color printer, will
    not turn out as an image as it appears onscreen. This is due to the limitations
    of the printing parameters, printer resolution, and the differences between monitor
    and printer gamma. These topics are a little complex, and are not covered here.
    But, with a keen eye and'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# Using Peripherals with Linux


    little patience, you can generally get your inkjet printer print out closely to
    what is shown (This might take a few test prints). If the image isn''t quite what
    you expected-color, you may want to tweak with the Hue, Saturation, and Luminance
    settings until the result is a closer to what you expect. Also, it might be good
    to print something with a distinctive color to what you are familiar with, in
    order to get an idea of the amount of difference between monitor and screen, which
    makes for easier adjustments. This isn''t a perfect solution, but should suffice
    for average home printing. If you require a more professional job, talk to your
    local print shop and find out what they require as image format format. They are
    experienced with complex issues and know what to do.


    # Figure 24.2

    Setting up a printer with Red Hat Linux.


