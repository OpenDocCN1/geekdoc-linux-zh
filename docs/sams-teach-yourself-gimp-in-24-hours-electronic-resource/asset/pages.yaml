    # Closing and Saving Files


    Since you have opened a file, you will probably want to do something to it, and
    then save it to your disk. The procedure is simple. You get to the dialog box
    by right-clicking the image you want to save, and Selecting File, Save as (see
    Figure 2.8). This right-click pulls up the additional menu items that ultimately
    add a tremendous amount of functionality to the GIMP by letting access filters,
    scripts, and many other options. (These are discussed in full detail in the following
    hours.)


    To save a file, bring up the Save Image dialog box, enter the name of the file
    in the text area, name your file (with the common three letter extension), and
    click OK, as shown in Figure 2.9.


    ![](img/0183f053b347a6407a2381be231d0345_44_0.png)'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# FIGURE 2.8


    You pull up the Save as menu by right-clicking on the image.


    ![](img/0183f053b347a6407a2381be231d0345_45_0.png)


    # FIGURE 2.9


    The Save Image dialog box is where images are saved to disk. Remember to use the
    correct file extension, or choose the file format from the menu when saving.


    ![](img/0183f053b347a6407a2381be231d0345_45_1.png)


    > When saving files to your local disk, make absolutely sure that you have write
    permissions to the directory to which you are attempting to save. Otherwise, your
    attempt will fail, and the image will not be written to disk. (Permissions are
    an intrinsic concept to UNIX.) You should familiarize yourself with them, if you
    haven''t done so already.) Of course, saving to your own home directory should
    present no problems.


    # Other Toolbox Menu Options


    The File menu on the Toolbox dialog box also has a few other options you should
    be aware of.


    # About


    The About item pulls up a dialog box that lists the GIMP development team, the
    version you''re running, and so on.'
  merge: -1
