- pgno: 284
  md: '# Using More Plug-ins and Extensions


    If you use one or more extra layers when painting, the With BG Option enables
    you to choose between Transparent, Background (your BG color), White, and Copy,
    which duplicates the background image on each new layer.


    It is easy to use these simple shapes in concert with each other in order to come
    up with something a little more complex. As an example, you can use the Bézier
    curves in combination with a slanted brush to create something with a calligraphic
    loop and feel to it, or reverse around until you come up with a representation
    of a real object outline (see Figure 20.4).


    # Figure 20.4


    A few variations of the same painted object. You can use Gfig to automate tasks
    that take a little longer to do by hand.


    ![](img/0183f053b347a6407a2381be231d0345_284_0.png)


    You aren’t limited to drawing simple, dark lines with this tool. The Fade Out
    option (see Figure 20.5), in the Brushes tab enables you to create lines and shapes
    that fade like brush strokes, to create something similar to a sumi-e painting.
    You can also select the Reverse Line option in the Paint tab to reverse the direction
    of the painting.


    Finally, the Options tab gives you access to a few settings for Gfig, such as
    whether to show ToolTips, control points, the background image, the number of
    Undos within Gfig, and the grid. Grids can be useful when trying to precisely
    position something.'
