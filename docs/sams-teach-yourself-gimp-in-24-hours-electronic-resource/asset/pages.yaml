- pgno: 324
  md: '# Animations


    When building an animation, you''ll want to try and make it as smooth as possible,
    within size constraints. How smooth your animation will be depends on a few factors,
    such as the timing in milliseconds for your frames, as well as the amount or subtlety
    of movement of the animated elements between the individual frames. Obviously,
    for a smoother animation, you would use more subtle movements, more frames, and
    less time for each frame. There is also a balance to be achieved by accounting
    for size and build time. For example, 100 subtle frames with a movement of 1 pixel
    apiece at high speed might be a little more than is practical to build.) Each
    graphic is different, but a good rule of thumb is that if the animation starts
    choppy with the frame speeds set at ~100ms, you''ll probably need to build a few
    more intermediary frames to tighten the movement.


    If you don''t have size constraints, that is, you''re not making it for use online,
    there is little reason to avoid going for detail—a little more time spending more
    frames at higher speed, each with smaller changes in movement, can result in a
    much cleaner image.


    # Animations for the Web


    As you can see, building a simple animation is relatively painless. There are
    a lot of little effects you can use—pixelization, noise traction, banding and
    blinding effects for text logos, blinking, pulsating, and color transformation
    effects for small objects such as buttons. These things are easily created with
    a few copies of a single image to work on and a little patience. But there are
    a few more things to consider when building them specifically for the Web.


    GIF89a is pretty much your choice for use on the Web, especially because it is
    the only animated format that GIMP supports for saving at this time.


    # A Word About GIF89a


    When you have finally built, timed, and tweaked your image, you should of course
    save it! When you save an animated GIF, remember that first of all you must reduce
    the color depth, just like any other GIF. Then go to the Save As menu and name
    your file with a GIF extension. The GIMP automatically recognizes that you are
    about to save a GIF89a animation and gives you a few more options in the Save
    As dialog box (see Figure 23.5). Loop allows you to determine if you want the
    animation to loop endlessly or play one time through. One Frame per Layer (Replace)
    forces each frame to cover up each previous frame in its entirety (traditional
    flip-book animation style). And Make frame'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'Cumulative Layers (Combine) enables you to show each new frame on top of each
    previous frame (used with the optimization techniques next, this saves space,
    and is similar to using a separately painted background image on top of which
    yours interact—like LooneyTunes and other such cartoons were made before computers
    came into play).


    # FIGURE 23.5


    The Save As GIF box adapts itself to dealing with animations.


    ![](img/0183f053b347a6407a2381be231d0345_325_0.png)


    # Size Issues


    When building animated buttons, banners, and such for the Web, there are a few
    things to take into consideration. Most importantly, bandwidth is everything.
    Not everyone has the luxury of a T1 line. (You''d be surprised just how much your
    world-view changes when moving from the campus fast Ethernet to a 28.8 modem).


    This is especially true for advertisement banners. If you are faced with making
    one of these remember that people did not come to the site to look at banners
    specifically, and they tend to get real cranky when a bulky ad banner detracts
    from the load time of the content they came to. If you want to increase banner
    click-throughs, a small, non-bulky banner is usually best. You can even sacrifice
    on color-depth and detail a little more as well (as long as you antialize your
    fonts), you do not want to impose your position on the site on which you are advertising.
    Keywords here are small and optimized!


    For example, the banner shown in Figure 23.6 consists of only two frames (to emulate
    the flowing water effect) and is therefore quickly downloaded, but the effect
    is still eyecatching, and it gets the point across.'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# FIGURE 23.6


    Banner ads help pay

    for Web space, but a

    small, less-detailed,

    quick-loading banner

    makes for a more

    enjoyable browsing

    experience.


    ![](img/0183f053b347a6407a2381be231d0345_326_0.png)


    # Optimizing Animations


    When you build an animation, there are a lot of elements in the picture that are
    repeated

    within every single frame. This is extremely wasteful, repeating the same portions
    of

    animations takes up valuable space and bandwidth. The way to counteract this is

    to use only the information that changes from the previous frames in each new
    frame.


    You can improve your animation efficiency by hand simply by cutting out the obvious

    unnecessary information. Figure 23.7 illustrates this with the example of a simple,
    tradi-

    tional 88×31 animated Web button. Eliminate the unnecessary by cropping every-

    thing that was not within the animated portion after the first frame, which is
    confined to

    a small area in each frame. The animation is then saved with the Make Frame

    from Cumulative Layers option, which allows the background frame portions to show

    through each frame. This saves a lot of space.


    As you can see, this is fairly simple to accomplish when dealing with an animation

    which you know that altered portions are taking place within the confines of a
    small

    square (or whatever). But what if the animation has going on throughout the entire

    image, as in Figure 23.8? Obviously, it is a bit difficult to determine exactly

    what is static and cut it out from the successive frames. Frankly, there is a
    wonderful

    plug-in that can take care of this for you named Animation Optimization. This
    plug-in is

    great because it can find every single pixel that is static after the first frame
    and cut them

    all out! Not only can cut out a few kilobytes (or more, depending on the

    file), but can also make it possible to drastically slim down the more complex
    animations

    by reducing them to only the elements that are absolutely necessary, right down
    to the

    abolute value (see Figure 23.9). In this example, I was able to reduce the animation''s

    size after experimenting with the color depth as well using the Optimization plug-in.

    (155k is still definitely not a good size for a Web graphic, but it does illustrate
    the point.)

    Some animations in fact often have greater file size reduction as well (up to
    50 percent).'
  merge: -1
  img_proc: true
