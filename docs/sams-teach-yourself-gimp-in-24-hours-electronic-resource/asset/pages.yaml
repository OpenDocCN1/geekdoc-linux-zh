- pgno: 50
  md: '# HOUR 3


    # Basic GIMP Tools


    # Using the Basic Tools


    As a GIMP user, you will have at your disposal a tremendous library of various
    effects, plug-ins, and scripts to help you do amazing things with graphics. The
    GIMP will undoubtedly acquire more of these in the future as the program continues
    to evolve. And yet the standard tools are the ones you will likely rely on most
    for your creative tasks. Master these, and you will'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'be surprised by the level of sophistication your images can achieve with relative
    ease. And ultimately, what you will be able to accomplish using this knowledge
    in concert with the intense effect capabilities the GIMP has to offer will be
    no less than astounding.


    The 21 basic tools, as shown briefly in the Hour 2, "Getting Started," are essential
    to creating any image. These tools often have more than one function, and many
    options available as well. To access the additional options and functions of any
    tool in the toolbox, double-click on the Tool button. This will pull up that particular
    tool''s Option dialog box, as shown in Figure 3.1.


    # FIGURE 3.1


    Additional options and functions can be invoked by double-clicking a tool icon,
    or by going to File, Dialogs, Tool Options on the Toolbox menu.


    ![](img/0183f053b347a6407a2381be231d0345_51_0.png)


    In the interest of continuity and organization, these tools will be grouped into
    five basic categories—Selection tools, Transformation tools, Artistic tools, Color
    tools, and the Text tool.


    # Selection Tools


    Selection tools are a way to mark a portion of the image apart from the rest of
    the composition. This allows the program to apply any functions or changes you
    specify only to that you have selected, without affecting the rest of your work.
    Changes can include, but are not limited to, alterations in color, size, shape,
    composition, orientation, and so on.


    The six tools at the top of the toolbox deal with creating and editing selections
    (see Figure 3.2). Selections enable you to select any part of an image, marked
    by a blinking border, called the marching ants or marquee (see Figure 3.3). (This
    marquee is animated, and to some people resembles blinking marquee lights or ants
    on the move, depending.)'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Basic GIMP Tools


    # FIGURE 3.2


    The Selection tools are valuable for affecting change on only certain portions
    of your image.


    ![](img/0183f053b347a6407a2381be231d0345_52_0.png)


    # FIGURE 3.3


    A selection is made. Any changes applied by any tool or menu item would happen
    only within the confines of the marching ants.


    ![](img/0183f053b347a6407a2381be231d0345_52_1.png)


    ![](img/0183f053b347a6407a2381be231d0345_52_2.png)


    > You can change the rate of the blinking marquee (or ants) by going to File,
    Preferences, clicking the Interface tab, and changing the value in the Marching
    Ants speed text box. Also, you can toggle the marquee on off by right-clicking
    the image, and going to Select, Toggle.


    When you make a selection, you will need to use the proper select tool for the
    job. With these six tools at your disposal, you will have the ability to set any
    shape, size, and color portion of an image for alterations. In this book, you
    will go over selections in greater detail, and learn how to utilize them to do
    new and interesting things to your images.


    # Transformation Tools


    A transformation is anything that alters the perspective of the image, whether
    it is by size, position, rotation, mirroring, or plain distortion.


    You have a good image to begin with, but something just isn’t right with it. Perhaps
    you could position it a little better, rotate it, or get a closer look at it.
    That’s what the Transformation tools are for (see Figure 3.4). These tools are
    great at altering the perspective, size, position, ratio, or orientation of an
    image, as in Figure 3.5.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# FIGURE 3.4


    The Transformation tools alter your image in terms of shape, size, and position.


    # FIGURE 3.5


    Transformations in actions. Transformations make elements in your graphics more
    interesting.


    ![](img/0183f053b347a6407a2381be231d0345_53_0.png)


    # Artistic Tools


    The Artistic tools do exactly what their name implies—they enable you to draw,
    paint, erase, and brush your images with colors and patterns. The tools used to
    do these resemble the tools you find in any artist''s tool collection—pencils,
    brushes, erasers, airbrushes, and so forth (see Figure 3.6). And they work in
    much the same way as the real things (see Figure 3.7).


    The last three Artistic tools are unique, and worth mentioning here. The Airbrush
    works just like a can of spray paint, thickening the paint longer you use it in
    one place or enabling a thin spray of color to be applied with a sweeping motion.
    The Clone tool will paint with an exact duplicate of any image or pattern (which
    will come in handy for photo retouching). And the Convolve tool works like a paintbrush,
    but will blur or sharpen an image instead of painting it with color.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# FIGURE 3.6


    The Artistic tools resemble the equipment used by the artists who work with analog
    media.


    # FIGURE 3.7


    The Artistic tools in action. This illustrates the many effects you can create
    with these tools.


    ![](img/0183f053b347a6407a2381be231d0345_54_0.png)


    # The Color Tools


    The Color tools, as you''ve probably guessed, have to do with color, and the way
    it is applied to your images. With these tools, shown in Figure 3.8, you can choose
    and fill selections with color in ways that would be difficult to using physical
    art equipment. But thanks to the wonders of technology, changing and altering
    colors is as simple as moving a mouse. We will go ahead and touch on some of their
    aspects here, as they will be vastly useful when working with the other tools.


    # FIGURE 3.8


    The Color tools are used for selecting, filling, and creating color.


    # Color Select Tool


    The Color Select tool, also known as the Eyedropper, can select any color in your
    image. By clicking on the Tool icon, your cursor will be transformed into a little
    cross-hair, at which point you can pick up a color from any pixel in your image
    (see Figure 3.9). By wave of a mouse click, this will change the selected toolbox
    color in the toolbox'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'Color Selector, either foreground or background, to the same color as the pixel
    located under your cursor. This is a handy tool for color matching, which is very
    important for doing things as print and Web graphics.


    # FIGURE 3.9


    One click, and that color is loaded into the foreground. You can now use it in
    conjunction with any tool.


    ![](img/0183f053b347a6407a2381be231d0345_55_0.png)


    # Bucket Fill


    The Bucket Fill tool (shown in Figure 3.10) fills your image or selection with
    any active color or pattern (via the Pattern dialog box). The Fill tool has a
    few options worth noting here (accessed by double-clicking the tool icon, which
    brings up the Fill Tool Option dialog box, shown in Figure 3.11).


    # FIGURE 3.10


    The Bucket Fill in action. Experimenting with different fills on alter the entire
    composition of an image.


    ![](img/0183f053b347a6407a2381be231d0345_55_1.png)'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Basic GIMP Tools


    FIGURE 3.11


    The Fill Tool Option dialog box enables you to use the tool in many ways.


    ![](img/0183f053b347a6407a2381be231d0345_56_0.png)


    +   - Opacity—Refers to the see-through quality of the color or pattern used as
    a fill. You can adjust this incrementally to let more or less of the background
    seep through.


    +   - Fill threshold—Approximates the area to fill by looking at the surrounding
    pixels and determining if they are close to the one selected and deciding whether
    or not to fill them as well. So, for example, a setting of 1 would mean that only
    the color you specifically will be filled. The maximum setting of 255 will fill
    the whole image or selection regardless of color.


    +   - Fill type—Lets you select what you want to fill your selection with, a color
    or a pattern. You can select any color using GIMP’s Color Selection dialog box
    by double-clicking the Foreground color on the toolbox.


    Patterns are accessible from File, Dialogs, Patterns, in the toolbox menu.

    Patterns are interesting, repetitive designs that can be used to fill a selection
    or background to add texture. You can select a pattern in the Pattern dialog box,
    and fill an image with that pattern to create interesting effects. Using and creating
    your patterns will be discussed at length in Hour 4, "Using Brushes and Patterns
    in Depth."


    NEW TERM


    # Gradient Tool


    The Gradient tool will enable you to draw a gradient (transition between two or
    more colors) into your image or selection (see Figure 3.12). It can do this in
    many different patterns and color combinations. You can create custom gradients
    using the Gradient Editor, which will be thoroughly detailed in Hour 7, "Working
    with Color"


    FIGURE 3.12


    ![](img/0183f053b347a6407a2381be231d0345_56_1.png)


    Gradient fills can add a lot of tone and realism to your images.


    3'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# The Foreground/Background Color Selector


    As long as you''re covering the topic of color, you should go ahead and learn
    how to use it tool, shown in Figure 3.13, because it is a vitally important one.


    FIGURE 3.13


    The Foreground/Background Color Selector is primarily what you will use to deal
    with color when working in the GIMP.


    ![](img/0183f053b347a6407a2381be231d0345_57_0.png)


    The foreground color is used by your tools—Paintbrush, Pencil, Airbrush, Bucket
    Fill, and Gradient (the first color). The background color is used by the Eraser
    tool when cutting a selection from an image, and acts as the endpoint of gradients.


    You can access the GIMP Color Selector dialog box by double-clicking on either
    the foreground or background color icons in the box (see Figure 3.14). Now you
    can select any color available by either dragging the cursor through the spectrum
    and color boxes, or by specifying any value with the sliders and text boxes. The
    sliders control Hue, Saturation, Value, Red, Green, and Blue. By clicking the
    Close button, you have made your active color selected color, which you can now
    use with any tool.


    FIGURE 3.14


    The Color Selection dialog box lets you pick any color to use with your tools.


    ![](img/0183f053b347a6407a2381be231d0345_57_1.png)


    The little arrows on the Foreground/Background Color Selector tool allow you to
    swap the foreground and background colors. The little black-and-white boxes in
    the lower-left corner bring the colors back to the default black and white.


    # Text Tool


    The GIMP Text tool is very useful, especially in regards to creating graphics
    for the Web. It enables you to insert type anywhere into your image. And because
    text is treated essentially as a selection, you can insert it into anything as
    you would a selection—fill it with patterns, gradients, or alter it any number
    of ways (see Figure 3.15).'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Basic GIMP Tools


    FIGURE 3.15


    The Text tool could arguably be one of the most useful tools available in the
    GIMP. With it, you can not only create simple text, but used in conjunction with
    the other tools and plug-ins, it can create really neat effects, which is almost
    essential in creating a look for your Web site.


    ![](img/0183f053b347a6407a2381be231d0345_58_0.png)


    # Using the Text Tool


    Clicking on the Text Tool icon will change the cursor over the image into an I-beam.
    To insert some text, click the mouse with the I-beam over the image. This brings
    up the Text dialog box, as in Figure 3.16.


    FIGURE 3.16


    The Text dialog box.


    ![](img/0183f053b347a6407a2381be231d0345_58_1.png)


    Near the bottom of the Text Tool dialog box, you will see a blank text space.
    This is where you need to type in your text. After this has been done, look toward
    the left side of the dialog box to see a listing of the fonts that are available
    to the X Window System. By clicking on any one of these, your text will be previewed,
    in that font, right where you typed it.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Hour 3


    At the top of the dialog box, you will see an option for text size. The implication
    here is obvious. In any text size, click Enter, and your preview will be updated.


    Foundry refers to the maker of the font. This can be important when dealing with
    fonts that have the same name but are made by different individuals or companies.


    Other Options are Available on the dialog box as well, such as Slant (Italics),
    Weight (Bold), Set Width (Spacing), and so forth.


    After your text appears how you want it, click OK, and your text will appear on
    the image canvas, as an active selection. The color of the text will be the active
    foreground color in the Foreground/Background Color Select box in the toolbox.
    You can now move it using your cursor to any position in the page. Or, because
    it is an active selection, you can apply any pattern, fill, gradient, or effect
    to it. You will practice many of these effects as you continue throughout the
    hours in this book.


    # Using X Fonts with the GIMP


    X supports many styles of fonts. In using the GIMP, you will likely want to increase
    the volume of fonts available to your system (The fonts that come with pretty
    dull). On the CD-ROM, in the Fonts directory, there are two font packages: sharefonts.tar.gz
    and freefonts.tar.gz. You should look into installing these. Uncompress them into
    `/usr/X11R6/include/X11/fonts directory, read the READMEs, and follow the directions.
    (These font packages can also be downloaded from any Linux FTP repositories, or
    Red Hat''s contrib directory).


    You will find that your native X Fonts are located in subdirectories of `/usr/X11R/libX11/fonts`
    (or variant thereof, on different systems). If you ever want to add or remove
    fonts in the future, you''ll know where to go. I''ve also found it helpful to
    remove extraneous fonts by deleting certain fonts and editing out the reference
    to them in the fontsdir. The Far Eastern ones are good candidates for deletion
    (unless you really need them), and they tend to take a long time to render.


    Although these fonts are pretty good, I still itchin to utilize my vast collection
    of TrueType fonts with the GIMP. Frankly, they can be supportive of those—with
    a little assistance. In order to use TrueType, you need to install and run a TrueType
    Font Server. either. This isn''t too difficult, all you need to do is acquire
    the xfsft TrueType Font Server application and install it. It, too, is available
    on the CD-ROM in the font directory as xfsft.tar.gz. Unzip it into your directory,
    compile and install it as follows:


    ```

    make install

    ```


    Create the directory /usr/ttf, and copy your favorite TrueType TTF files. Then
    run xfsft sync to the fonts.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Basic GIMP Tools


    Start xfstst as a background process:


    xfstst &


    Tell the running X11 server about the new font server:


    xset +fp unix::/7100


    Add the new font path to the X11 config file (probably /etc/X11/xF86Config):


    FontPath "unix:/7100":


    You should now be able to bring up the GIMP Text dialog box and see your TrueType
    fonts. After installing xfstst, you might want to get it to start automatically
    every time Linux boots (not that Linux ever rebooting) by adding a reference to
    it in /etc/rc.local. This keeps you from having to start the TrueType Font Server
    every you start X. One caveat: if you do this, make sure that you add the full
    pathname to rc.local, as in /usr/X11R6/bin/xfst_, especially if you use xdm to
    start a graphical login automatically at startup.


    Also, you might not want to load every TrueType font you own, but instead be selective
    with the TrueType fonts you want to use in Linux. Linux is a handy application
    but it can suck up a little RAM if left to load 200+ fonts. If you''ve found it
    best to use only 30 or so of the best fonts installed. And, there are other TrueType
    servers out there as well, although I have not personally used them yet. One server
    is called xfstst, which uses the Free Type library and has had a lot of positive
    review. It''s available online everywhere xfstst is, so you might want to check
    it out. You can grab a RPMs of Xfree86 with integrated TrueType font support via
    xfstst from http://www.darmstadt.gmd/~pommnitz/xfstst.html.


    # Summary


    The essential concepts in dealing with a graphics application such as the GIMP
    have been covered during the first three hours. Before any real techniques can
    be applied, you must have an understanding of the basic tools illustrated here.
    In the next few hours, you will move on to mastering these concepts in order to
    create some interesting images and effects. You might be surprised at what can
    be accomplished using only these simple tools. And, gaining mastery over them
    will give you edge when confronted with specific graphics issues, as image restoration
    or simple manipulation.


    ![](img/0183f053b347a6407a2381be231d0345_60_0.png)'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Q&A


    Q When selecting fonts, the GIMP freezes up and won’t do anything.


    A It is likely that you have inadvertently selected one of the Far Eastern fonts
    that come with Linux. The GIMP isn’t really locked up, but if your video card
    is like mine, it is taking its sweet time rendering these fonts. (The glyphs are
    quite complex in these fonts). You might want to avoid these fonts in the future,
    or delete them altogther.


    # Exercise


    You might be wondering just how much you can accomplish using these ordinary tools.
    Well, in order to gain an understanding of them, you must use them. I suggest
    that you start experimenting right away. Try opening up a new palette, and begin
    to paint simple shapes and textures with the tools outlined here. You can start
    with simple things, such as geometric shapes, logos, buttons, or even hand-crafted
    text. Then emulating some real-world objects and textures—the Gradient Fill to
    create metal, or the Airbrush to create mist. As you move along in the hours ahead,
    you will come across easier and more efficient ways of doing these things, which
    will in turn increase your mastery at a faster pace. Then the really fun stuff
    begins.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# HOUR 4


    # # Using Brushes and Patterns in Depth


    Congratulations! You''ve put in some time and learned the elementary GIMP basics
    during the first three hours. At this point, you are probably starting to understand
    the interface and recognize the many tools you have to work with.


    Now it''s time to graduate to some of the fun stuff, really focus on the various
    aspects of the program, and learn how wonderful and versatile it can be for creating
    and editing graphics.


    This hour concentrates on the wide array of brushes and patterns—including the
    Brush and Pattern dialog boxes, the options, and even how to turn your very own
    creations into custom brushes and patterns—and look at different ways they can
    be put to work in your graphics.


    ![](img/0183f053b347a6407a2381be231d0345_62_0.png)'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Using Brushes


    In Hour 3, “Basic GIMP Tools,” you were introduced to the tools in the GIMP toolbox.
    For the first part of this hour, I’ll direct your attention to the tools that
    will more likely become some of your favorites—the painting and drawing tools.


    By activating any one of these tools, you''ll have at your disposal an entire
    collection of brushes containing a variety of appearances and textures.


    # The Brush Settings


    Begin by going to File, Dialogs, Brushes, and bring up the brush Selection window,
    as shown in Figure 4.1. Your choice of brush settings can be applied using any
    of the painting and drawing tools (Pencil, Paintbrush, Eraser, Airbrush), and
    the look will feel dependent on the characteristics of the particular tool. The
    Paintbrush yields a much softer appearance, for instance, when the pencil gives
    a hard-edged


    FIGURE 4.1


    The Selection window offers many brush choices.


    ![](img/0183f053b347a6407a2381be231d0345_63_0.png)


    In the left area of the window, you can see an assortment of preinstalled brush
    tips, ranging in size and shape from a tiny circular tip to textured tips, and
    even tips that are made from images.


    When you select a brush by clicking on it, notice that the brush name and size
    (in pixels) show in the right area of the window. The GIMP works a little differently
    than most graphics programs in relation to brush size. There is no size where
    you can adjust the size by a slider or numerical value. You simply choose a brush
    in the size you want to use. By clicking and holding on the thumbnail image of
    each brush, you can see the size as it appears when used.


    ![](img/0183f053b347a6407a2381be231d0345_63_1.png)


    Large brushes cannot easily be seen in the small brush thumbnails of the brush
    select dialog box. If you can''t find a particular brush, try clicking and holding
    on the thumbnails that appear to be blank.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'Underneath the brush name is an option called Mode. This is where you can change
    the blend mode. Blend modes are primarily used in conjunction with layers and
    are discussed in depth Hour 9, “Hands-on Layering.” For now, leave the mode setting
    on Normal.


    # Opacity


    The next setting is the opacity, which is controlled by a slider with values ranging
    from 0–100. Setting the slider to 0 enables total transparency in the brush, whereas
    the 100 setting is totally opaque. Think of the opacity slider as paint thinner,
    diluting the paint to the point of transparency when applied to an image.


    # Spacing


    This setting is also controlled by a slider and is used to determine the space
    between brush strokes. If you look at Figure 4.2, you can see that if you want
    to paint in a continuous line, you should set the spacing low. A higher spacing
    separates the strokes of the brush by the desired amount, resulting in a totally
    different look. You might experiment with the spacing using different brush tips.


    # Figure 4.2


    The top line shown was drawn with the spacing set to 0, and the spacing was gradually
    increased in the following lines.


    ![](img/0183f053b347a6407a2381be231d0345_64_0.png)


    # Tool Options


    Double-click on the Paintbrush tool to bring the options box, as in Figure 4.3.
    You’ll take a more in-depth look at what these two options accomplish, now that
    you’re familiar with the brush settings.


    # Fade Out


    This option is used to create a gradually diminishing color effect, as shown in
    Figure 4.4. By setting the numerical fade value, you choose how many pixels are
    colored with the brush before the fading effect actually begins. To fade entirely
    out uses approximately three times the amount of the set value. Setting the fade
    out value to 0.0 (which is the default setting) affects the effect.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# FIGURE 4.3


    The Paintbrush also has some unique options you can set in the tool option box.


    ![](img/0183f053b347a6407a2381be231d0345_65_0.png)


    # FIGURE 4.4


    Shown here are several different brushes with the fade effect applied.


    ![](img/0183f053b347a6407a2381be231d0345_65_1.png)


    # Incremental


    When you drag the Paintbrush swiftly across an image, it appears to be painting
    in a continuous line. However, if you drag it across very slowly, you''ll notice
    that it is actually adding one increment at a time in the tool options enables
    you to see the overlap of these increments in the painted line, as in Figure 4.5.
    Choosing the Incremental function in the shape of your chosen brush tip. This
    function is visible only when you are painting with the brush settings at a reduced
    opacity. The following steps show how this feature works:


    +   * Open a new image with a white background.

    * Set the foreground color to black.

    * Open the Brush dial box. Choose a large brush, such as the circle(19). Set the
    opacity to around 50 and spacing to around 70 or so.

    * Double-click the Paintbrush, set the fade to 0, and leave the Incremental option
    unchecked. Paint a line across your image.

    * Now check the Incremental box and paint another line under your first one, and
    you''ll see how the Incremental option functions.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Using Brushes and Patterns in Depth


    47


    FIGURE 4.5


    The Incremental option at work.


    ![](img/0183f053b347a6407a2381be231d0345_66_0.png)


    # Making Custom Brushes


    As you play and experiment with the numerous brushes that are included in the
    GIMP, you will find that the uses for these brushes are virtually unlimited—from
    creating textures to making matching sets of brush images that you can use and
    over in your graphics.


    Because basically any image can be resized, graysed, and saved as a brush (thereby
    gaining access to the varied brush options), the capability to create custom brushes
    presents some interesting ideas on various ways to put them to use. You''ll explore
    two possibilities here.


    # A Custom Graphic Brush


    Find or draw a simple graphic on a white background that you would like to make
    into a brush, such as in Figure 4.6.


    FIGURE 4.6


    Simple images the best brushes.


    ![](img/0183f053b347a6407a2381be231d0345_66_1.png)


    The first step is to grayscale the image. Right-click on the image and go to Image,
    Grayscale. Your image now appears in shades of gray, as if you were looking at
    it a black-and-white television set.


    Next you need to invert the colors by right-clicking on the image and going to
    Image, Colors, Invert. This causes your image to show up as a negative, but when
    it''s saved as a brush, it reverts to positive.


    Now you are ready to save it as a brush. Right-click and go to File, Save As.
    Here you need to give your image a name and GBR (GIMP Brush) extension. Save it
    in your personal folder or somewhere you can remember.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'After you have saved it as a GBR, you then have to move it into the brush dialog
    by opening the GIMP directory and moving the file into .gimp/brushes.


    Open the brush dialog and press the button called Refresh; your new brush is now
    accessible for use.


    > There is a Script-Fu script that can convert a selection into a brush directly.
    Select the desired area, right-click, and go to Script-Fu, Selection, To Brush.
    A pop-up box then appears where you can give your brush a descriptive name.


    Check out Figure 4.7 to see how an entire look can be pulled together in a few
    minutes by using a custom brush.


    # FIGURE 4.7


    Your custom brush makes it easy to create a matched set of Web graphics.


    ![](img/0183f053b347a6407a2381be231d0345_67_0.png)


    # Signature Brush


    Unless you are extremely dexterous with a mouse or have a graphics pen, you will
    either want to scan an image of your signature or use the text tool and a font
    that is similar to your handwriting to create a signature brush, as shown in Figure
    4.8.


    After you have the signature, follow the same steps you used previously to create
    and save your brush.


    > You can use a small signature brush with a low opacity setting to add a sort
    of digital watermark to graphics you have created.'
  merge: -1
  img_proc: true
- pgno: 68
  md: "# Using Brushes and Patterns in Depth\n\nFIGURE 4.8\nA signature brush\n come\
    \ in handy.\n\n![](img/0183f053b347a6407a2381be231d0345_68_0.png)\n\n# Using Patterns\n\
    \nYou will spend the second part of this hour concentrating on patterns. Through\
    \ the composition of color, design, and special effects, you'll be able to create\
    \ mind-blowing patterns with a minimum of effort.\n\nPatterns can be useful in\
    \ many graphics tasks. The capability of the Bucket Fill tool to perform pattern\
    \ fills in selections can help you easily and quickly achieve a cool pattern looked\
    \ to your graphics text, and GIMP's Seamless Tiling function enables your patterns\
    \ to become beautifully tiled backgrounds.\n\n# The Pattern Dialog\n\nOpen the\
    \ Pattern Select dialog box, shown in Figure 4.9, by going to File, Dialogs, Patterns.\n\
    \nFIGURE 4.9\nThe pattern dialog\nbox is a great place\nto browse for\ninspiration.\n\
    \n![](img/0183f053b347a6407a2381be231d0345_68_1.png)\n\nNote that the GIMP comes\
    \ with an abundance of preloaded patterns. To choose a pattern, left-click on\
    \ the thumbnail image. The pattern name shows at the top of the pattern dialog\
    \ window. Take a few minutes to click on the patterns in turn, and note that you\
    \ hold down the mouse button, you can get a full size view of the chosen pattern,\
    \ as in the brush dialog box."
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Using the Fill Tool with Patterns


    Patterns can be used to fill any selected area, whether it is a text or other
    defined selection or an entire image area. Let''s do a simple pattern fill to
    see how it works.


    +   - With the pattern selection dialog open, select a pattern that you like.

    - Open a new blank image with a white background.

    - Double-click on the Bucket Fill tool to activate it and also pull up the Options
    box.

    - In the Options box, set the fill opacity to 100 and check Pattern Fill.

    - Now merely left-click once on your image and watch your pattern choose fill
    the area, as shown in Figure 4.10.


    # FIGURE 4.10


    A built-in GIMP pattern fills a blank image.


    ![](img/0183f053b347a6407a2381be231d0345_69_0.png)


    # Custom Patterns


    Now that you have the general idea of how pattern fills operate, you will not
    want to create patterns of your own.


    Follow the steps outlined here to build your first GIMP pattern from the ground
    up.


    Open a new blank image, background color of your choice. I''ve chosen a dark color
    for your illustration purposes.


    Set the foreground color to a color you''d like to see in your pattern. Because
    background is dark, I''m going to use bright colors for the pattern. Open the
    Brush dialog box, pick any brush, and randomly place bits of color in the image.
    Repeat this procedure times using different brushes and changing colors until
    you have something similar to Figure 4.11.


    Now for the fun part. This gives you an introduction to what special filters can
    do. Right-click on the image and go to Filters, Distorts, Whirl and Pinch. Play
    around with the sliders until you have a look that you like (see Figure 4.12).'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Using Brushes and Patterns in Depth


    # FIGURE 4.11


    Play with colors and brushes to form the beginnings of a pattern.


    ![](img/0183f053b347a6407a2381be231d0345_70_0.png)


    # FIGURE 4.12


    The whirl creates a colorful vortex effect.


    ![](img/0183f053b347a6407a2381be231d0345_70_1.png)


    # Seamless Tiling


    After you have a pattern that you are satisfied with, you should make it tileable,
    meaning that when you use it as a background or pattern fill on a large area,
    the seams or edges blend smoothly together with no visible lines.


    This is relatively easy to achieve with a function called Make Seamless. Right-click
    the image you want to tile and go to Filters, Map, Make Seamless. Your pattern
    unites with no seams showing when saved and tiled. See Figure 4.13 and notice
    how the edges have been changed so that the patterns tile correctly.


    # FIGURE 4.13


    Your seamless pattern is now ready to be saved.


    ![](img/0183f053b347a6407a2381be231d0345_70_2.png)'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Saving Patterns


    After creating a pleasing pattern, you can save it in the Pattern Select dialog
    box for future use.


    +   - Right-click the finished image and select File, Save, to bring up the save
    options.

    - Name your pattern and save with a PAT (pattern) extension.

    - A small window called Save as Pattern appears and prompts to give you your pattern-simple
    name description. This is the name that shows up when you view the pattern in
    the pattern selection box.

    - The pattern can now be moved to the GIMP pattern directory (.gimp/patterns).

    - In the Pattern Select dialog window, click Refresh and your pattern is now ready
    for use.


    ![](img/0183f053b347a6407a2381be231d0345_71_0.png)


    > For a unique pattern look, you can select an area of a photograph and convert
    it to a Seamless Tile, as shown in Figure 4.14. Shown first is the original photo,
    then a portion of the photo converted to a seamless pattern, and a step further
    with a few special effects.


    # FIGURE 4.14


    The resource possibilities are endless for making great patterns.


    ![](img/0183f053b347a6407a2381be231d0345_71_1.png)'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Summary


    As you work more and more with graphics, you will come to think of brushes and
    patterns as your basic tools of the trade.


    In this hour, I covered the essentials to get you started working with these artist''s
    little helpers.


    The capability to create and save your own custom brushes and patterns will, without
    a doubt, enhance your understanding of the intricacies involved in the creation
    of great graphics.


    # Q&A


    +   - Can I make custom brushes in full color?


    +   - No. All images are grayscal before becoming custom brushes. When you paint
    with them, then they use your chosen foreground color.


    +   - Do I have to save my pattern as a PAT file before I can use it to fill an
    image or selection?


    +   - Yes. Although some programs enable you to use any open image as a pattern
    fill, the GIMP requires that the image first be saved with a PAT extension and
    placed in the Pattern Selection dialog box.


    # Exercise


    Look out your window or take a walk and have a good look around at various things:
    the trees, the grass, the water, everything that surrounds you. Examine the textures
    and patterns in these everyday items from an artist''s viewpoint. Isolate small
    areas of color and texture and try to imagine how you could re-create the look
    using brushes and patterns. If you have a flatbed scanner, try scanning some simple
    textures, such as a leaf or a piece of fabric and turn them into patterns.


    ![](img/0183f053b347a6407a2381be231d0345_72_0.png)'
  merge: -1
  img_proc: true
- pgno: 73
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 74
  md: '# HOUR 5


    # Working with Selections


    In the preceding hours, you learned the basics of how the image editing tools
    work, and how to create, open, and save images in different file formats. Your
    next step is to learn how to utilize the various selection tools to select, or
    identify a certain portion of an image.


    In essence, a selection is a specifically chosen area of an image that can be
    moved, edited, or manipulated without affecting the non-selected areas of the
    same image.


    There are many different methods of making a selection. For instance, you can
    select an area by color alone, by using a shape tool—such as a square or circle,
    or by drawing freehand around the area you want to modify.


    The GIMP contains six handy selection tools that will be covered in this hour,
    along with the options for these tools.


    +   - Rectangle/Square tool

    - Ellipse/Circle tool

    - Lasso/Free Select


    ![](img/0183f053b347a6407a2381be231d0345_74_0.png)'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# The Selection Tool Icons


    +   * Fuzzy Select

    * Bézier Select

    * Intelligent Scissors


    The first six tools in the toolbox, as shown in Figure 5.1, are the selection
    tools.


    ![](img/0183f053b347a6407a2381be231d0345_75_0.png)


    # Tool Options


    Before you making selections, spend a few minutes going over the options that
    are available for the different kinds of selections. Bring up the options window
    for each of the six tools to acquaint yourself with the choices offered by each
    (see Figure 5.2).


    ![](img/0183f053b347a6407a2381be231d0345_75_1.png)


    ![](img/0183f053b347a6407a2381be231d0345_75_2.png)


    With all tools in the toolbox, there are two ways to bring up the options windows.
    You can either double-click the icon of the tool you want to use, or you can go
    to the top of the toolbox window, and click File, Dialogs, Toolbox options, and
    the options window will automatically show for any tool you click on.


    # The Basic Options


    Antialias and Feather are two basic options available for all the tools, with
    the exception of the Rectangle/Square tool, which has no antialiasing option.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# Working on Selections


    # Antialasing Is Your Friend


    Antialasing is an effect used to produce a smooth-edged selection by filling in
    pixels just along the edge of the selection with similar colors, thereby softly
    blending it in with adjacent colors. If Antialasing is not used, a selection might
    tend to appear jagged around the edges, especially along curves. This is a condition
    commonly known among graphic artists the jaggers. By using the Antialasing option,
    you''ll end up with a much softer and smoother appearance to your selection edges,
    as seen in Figure 5.3 (which has been magnified somewhat to enable you to see
    the difference).


    # FIGURE 5.3


    Compare the difference in the edges of these two filled text selections; one is
    antialiased, and the other is not.


    ![](img/0183f053b347a6407a2381be231d0345_76_0.png)


    # Feather Effects


    The Feathering option produces an even smoother transition between the selection
    and the surrounding area. It works by fading the pixels into the background along
    the edge by a chosen amount, called the feather radius. You control the feather
    radius by a slider in the Tool Options window. The higher you set the slider (0–100),
    the farther the pixels of your selection will feather out and blend in. This is
    an invaluable effect, particularly working with photo manipulations.


    # Sample Merged


    This option is only available when using the Fuzzy Select tool. When activated,
    this option causes the selection to be made based on the composite image created
    by all layers, instead of the contents of the current layer alone. (This will
    be easier to understand when you get to Hours 8, “Introduction to Layers,” and
    9, “Hands-on Layering.)'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# Viewing a Selection


    When a selection is made, it is identified as such by a border of flashing black-and-white
    dashes known in most graphics programs as a *marquee*. In the GIMP, this flashing
    border is also referred to as *marching ants*, but I will just keep things simple
    and refer to it as the marquee. After it is selected, the area within the marquee
    is now the only part of the image that is *active*, meaning that it is the only
    part of the image that will be affected by the administration of tools or applications.


    > Sometimes flashing marquee can be in the way when trying to view changes in
    your image. However, once you''ve made your selection, you can use an option called
    Toggle to turn the marquee on or off while keeping the selection intact. Just
    right-click anywhere on the image and select File, Select, Toggle. Repeat to reverse
    the action. You can also toggle the on and off by pressing Ctrl+T on your keyboard.
    When you use the toggle, just remember your selection is still active, even though
    you cannot see the marquee.


    ![](img/0183f053b347a6407a2381be231d0345_77_0.png)


    # Making a Selection


    Get started by making a simple selection with the Rectangle/Square tool.


    +   1. Open a new image (size doesn''t matter at this point, but make it a large
    enough area to work in easily).

    2. Activate the Rectangle tool by clicking the icon.

    3. Place the mouse cursor at the corner of the area you want to select.

    4. Left-click, and while holding down the button, drag across the image in the
    direction you want your selection to go. As you move the mouse, you will see a
    line appear, designating where the border of your selection will be.

    5. When you release the button, the marquee will indicate your selected area,
    as shown in Figure 5.4.


    FIGURE 5.4

    A simple rectangular selection.


    ![](img/0183f053b347a6407a2381be231d0345_77_1.png)'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Extra Selections


    If you need to have more than one selected area in the same image, you can do
    this in a couple of easy steps:


    +   1. Make the first selection and release the mouse button to show your marquee.

    2. Press and hold the Shift key while making the additional selection.


    As long as the extra selections do not touch one another or overlap, they will
    become individ-ual selections within the image (see Figure 5.5).


    # FIGURE 5.5


    You can have many selected areas in one image.


    ![](img/0183f053b347a6407a2381be231d0345_78_0.png)


    # Adding to a Selection


    Sometimes you might want to attach additional sections to a selected area to create
    a unique shape. This is also easily to achieve. Just follow the same steps you
    used to create an extra selection, but this time, you''ll want to touch or overlap
    the two sections, and as you release the mouse button, they will then become one
    single selection, as in Figure 5.6.


    # FIGURE 5.6


    Two selections can be merged into one.


    ![](img/0183f053b347a6407a2381be231d0345_78_1.png)'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Subtracting from a Selection


    In a similar way, you can use the Ctrl key to subtract an area from a selection.


    +   1. Make an active selection; try another rectangle.

    2. For the next step, do something a little different and switch over to the Ellipse
    tool by clicking the Ellipse icon in the toolbox.

    3. Now press and hold the Ctrl key while you drag over the area you want deleted
    from your active selection. As you release the mouse button this time, you will
    see, as in Figure 5.7, that the area where the ellipse overlapped the rectangle
    has been subtracted from that selection.


    # FIGURE 5.7


    The ellipse area has been removed from the rectangle.


    ![](img/0183f053b347a6407a2381be231d0345_79_0.png)


    # Intersecting the Selections


    By using the Shift and Ctrl keys, you can choose the intersection (the overlapping
    region) of two areas as your active selection.


    +   1. Make a selection.

    2. Press and hold Shift and Ctrl at the same time and drag as if you were making
    an addition to a selection, but notice where the two areas overlap. When you release
    the mouse button, the overlapping region will become the only active selection
    (see Figure 5.8).


    # FIGURE 5.8


    The intersection of a rectangle and ellipse becomes the selected area.


    ![](img/0183f053b347a6407a2381be231d0345_79_1.png)'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Working on Selections


    # Deactivating a Selection


    An active selection can be deactivated in three different ways. You can begin
    making a new selection, and the first one will disappear automatically. Another
    way to deactivate is to left-click on your image while in the Rectangle/Square
    tool mode, Ellipse/Circle tool mode, or Lasso tool mode. The third method is to
    right-click on your image to bring up the menu options, and then Select, None.


    # Shape Tool Extras


    Specifically, the shape tools are the Rectangle/Square and Ellipse/Circle tools,
    because they are the only tools limited to forming only those shapes. However,
    you have already learned by using the Shift and Ctrl keys to add, subtract, and
    so on, you can use the shape tools to make a variety of uniquely shaped selections.
    There are also a few extra tricks that you can play with the Shift and Ctrl keys,
    giving them dual functionality used in combination with the shape tools.


    +   1. You can achieve geometrically perfect squares and circles by keeping the
    Shift key held down as you make the selection.

    2. Pressing and holding Shift and Ctrl while selecting will cause your perfect
    squares and circles to begin at the point where you place the cursor and radiate
    out from there, rather than starting at the corner.

    3. Holding down the Ctrl key will will make selections and ellipses also from
    the center of the shape, rather than from the corner.


    You''ll notice when working with the shape tools, the dual functionality of the
    Shift and Ctrl actions can conflict with one another in certain circumstances.
    Luckily, you can separate these selections or combine them in different ways by
    a well-timed release.


    For instance, let''s say you want to make a selection, and then attach an addition
    to it (requiring the use of the Shift key). But, the addition you want to make
    is an ellipse, and because you''re holding the Shift key, it becomes a perfect
    circle. What you have to do in this situation is to set one selection and release
    the key before you begin the next action. For example


    +   1. Make an active selection in a shape of your choice.

    2. Press and hold the Shift key. The pressing of the Shift key has the GIMP that
    you want to make an additional selection.

    3. Left-click the mouse button and hold.

    4. Release only the Shift key, but continue holding the mouse button as you drag
    your additional selection. The release of the Shift key before actually forming
    the added selection frees it from having only perfect circles or squares.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'The difference in the timing of the Shift and Ctrl keys can permit two actions
    to be mingled in the same selection. For example:


    +   1. This time, let''s say you want to subtract from the first selection (requiring
    the use of the Ctrl key), but you want to do it with a perfect circle (requiring
    the Shift key). You would follow these steps:

    2. Make your first selection as normal.

    3. Press and hold the Ctrl key and left-click and hold the mouse button. The pressing
    of Ctrl tells GIMP that you want to subtract from the selection.

    4. Now release the Ctrl key while holding down the mouse button. The release of
    Ctrl has freed you to make another choice.

    5. While still holding the mouse button down, you can now use the Shift key to
    form the perfect circle.


    It might seem a little confusing at first, but after you''ve worked with these
    functions a couple of times, it will make sense and you''ll see how easy it is!


    # Lasso Selections


    To make a selection, orhand selection, activate the Lasso tool, and place-mouse
    cursor at the point where you''d like the selection to begin. Now left-click and
    drag, and as you move your cursor you''ll notice a line forming your shape. After
    you have the desired area and you''re back at the starting point, release your
    mouse button and you''ll see the marquee designating your selection. If you release
    the mouse button before you get back to your starting point, the Lasso tool will
    automatically close the ends of your selection with a straight line between the
    two points. You can add, subtract, and intersect lasso selections using the same
    methods you learned with the shape tools.


    # Fuzzy Select


    This tool is similar to the Magic Wand tool, which is familiar in other graphics
    programs. It is unique in comparison to the other selection tools in that it makes
    selections based on color value. It''s a handy tool for making selections that
    are essentially one color, such as selecting a background out of a picture. All
    you have to do is click on pixel in the color you want and all adjacent pixels
    that are the same color are included in the selection area. If you want your selection
    area to expand, including colors in the same range, click and drag the cursor
    over all the colors you want to incorporate, and the adjacent pixels of all those
    colors will be included. By using your Shift and Ctrl keys along with the Fuzzy
    tool to add or subtract areas of color, you can quickly modify a selection to
    the color specifications you like.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# The Bézier Tool


    This gadget, although probably the most challenging to learn of the six selection
    tools, can be remarkably useful once you master it.


    It works by the placement of a number of points which, when clicked on turn, develop
    two handles that are then used to manipulate the shape. By moving the handles,
    you can form curves and angles out of began as a series of straight lines.


    The Bézier tool can be a lot of fun to play with, and that''s probably the best
    way to use it, so you can jump right in this one.


    +   1. Create a new image large enough to work comfortably.

    2. Activate the Bézier tool by clicking the icon in the toolbox.

    3. Place your cursor over the area where you want your selection to begin, and
    click it once to create a starting point.

    4. Now move your cursor over a little and click again. You will have added another
    point, connected to the first by a straight line. Repeat the moving and clicking
    until you''ve made a basic shape consisting of the straight lines. Connect back
    to your starting point by clicking your ending point into it.

    5. You will now have a selection area that resembles a connect-the-dots picture,
    as in Figure 5.9.


    FIGURE 5.9


    A Bézier selection in the first stages.


    ![](img/0183f053b347a6407a2381be231d0345_82_0.png)


    And the fun begins. Let''s make some curves...


    Click on any point and you will see an additional line appear. This new line consists
    of your point in the center (marked by a small circle), and a tiny square at each
    end. These are your handles, as seen in the lower-right corner of Figure 5.10.
    By manipulating them in different directions, you''ll see that they give your
    selection line the capability to form a curve. It will probably seem awkward at
    first, but you''ll get the feel of maneuvering the curves as you go.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# FIGURE 5.10


    The handles appear when the point is clicked on.


    ![](img/0183f053b347a6407a2381be231d0345_83_0.png)


    Click on each point in turn and practice making curves so that you really get
    the hang of it. Try pulling your handles out longer and notice the difference
    the change makes in your curves. Now shortening the handles, and you''ll notice
    your curve sharper. To make an angle, you will need to press the Shift key while
    clicking your point. This enables the handles to be manipulated separately, giving
    you the control necessary to form very sharp corners and turns.


    > If you''re not happy with the placement of your points, you can easily move
    them by pressing the Ctrl key while dragging a point to a better position.


    # Setting as a Selection


    You will probably notice that you are not seeing the marquee while you are creating
    outlines with either the Bézier or the Intelligent Scissors tool. When using these
    tools, you will wait until you are ready for your outline to become a selection.
    By clicking anywhere inside the outlined area, the area will be converted to a
    selection, and you will be able to see your marquee, as in Figure 5.11.


    > When clicking on your points to either manipulate or move them, you must be
    careful not to accidentally click inside the selection area and set it premiature.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '![](img/0183f053b347a6407a2381be231d0345_84_0.png)'
  merge: -1
  img_proc: true
- pgno: 85
  md: '3. Now you can begin clicking on your points and maneuvering your Bézier curves
    until you have the desired area selected to your satisfaction (see Figure 5.13).
    Pretty amazing, don''t you agree?


    # FIGURE 5.13


    Practicing your curves on an interesting shape can quickly enhance your abilities.


    ![](img/0183f053b347a6407a2381be231d0345_85_0.png)


    > After you''ve mastered the technique of working with curves, this for an even
    quicker way to select an area with the Bézier tool:

    Place your first point in the desired location, but this time, instead of just
    clicking in the next points, try dragging and clicking. When you do it this way,
    each successive point you click will have the handles ready to manipulate as you
    go, on-the-fly, so to speak.


    # Intelligent Scissors


    This tool has a mind of it''s own (hence the name intelligent). It works by analyzing
    the colors of the pixels along the line formed as you select, and then snapping
    to an edge around the pixels that do not fall into the same color values. It is
    mostly used for outlining areas of color that contain enough difference in color
    value between the surrounding areas that the tool can differentiate between the
    two.


    +   1. Find a picture that has a nice large area of contrast.

    2. Begin your selection with this tool by dragging your cursor around the area
    you want to select, just as you would the Lasso tool. Try to get as close as you
    can to the desired selection area.

    3. When you release the mouse button, you''ll see the Intelligent Scissors leap
    into action and try to find the edges that differ greatly in color value.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Intelligent Scissors Options


    In addition to Antialias and Feather tools, the Intelligent Scissors tool has
    a few extra options that are not included with the other tools.


    # Edge-Detect Threshold


    This is basically a tolerance control in which you can set the amount of tolerance
    you want the Scissors tool to have as far as including other color values while
    it tries to find an edge. Setting a high tolerance will allow more similar colors
    to be included along the line of the selection area while the tool tries to detect
    a good edge with enough difference to isolate.


    # Elasticity


    Elasticity controls how elastic or flexible the tool will be when it detect an
    edge. If you have the elasticity set too low, the tool cannot snap into place
    as it needs, because you haven''t allowed it room. If the elasticity is too high
    and there are several different areas of color in your image, the tool might snap
    to a nearby color area that isn''t the one you had in mind.


    # Curve Resolution


    If you have a very curve selection, the Curve Resolution allows you to have some
    control in the way the tool forms the shape of the curves. A low curve resolution
    setting tends to produce a jagged edge, while a higher setting results in a much
    smoother, even curve.


    # Convert to Bézier Curve


    This one is self-explanatory. If you have made a selection with the Intelligent
    Scissors and feel that it requires further modification to the edges, you can
    convert to a Bézier selection, and your line will form points around. You can
    then move and manipulate those points to your satisfaction before making your
    selection active.


    ![](img/0183f053b347a6407a2381be231d0345_86_0.png)


    > Although the Intelligent Scissors tool is suited to perform certain selection
    tasks, it is faster and easier to use one of the other selection tools, due to
    the amount of variables that have to be set to work properly together in the Intelligent
    Scissors options. Stable Intelligent Scissors were a late addition to GIMP version
    1.0, and as such, they might not behave predictably and usefully.


    ![](img/0183f053b347a6407a2381be231d0345_86_1.png)'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# The Selection Menu Options


    In addition to the options included with each individual tool, there are a number
    of available options for selections. Right-click on an image to pull up a menu.
    Click Select, and you''ll see the following options:


    # Toggle


    This tool is discussed earlier in this hour; it toggles the marquee on and off,
    allowing you to view the selection area without the flashing if necessary.


    # Invert


    You will definitely want to remember where this option is. It has the capability
    to make some selection tasks much easier. In certain instances, it can be less
    troublesome to select the area that you don''t want, and then reverse that to
    include only the area that you do want. For instance, if you have a complex image
    surrounded by a onecolor background, you could use the Fuzzy Select tool to choose
    the background color as the selection, go to Select, Invert, and your complex
    image is now selected.


    # All


    By combining Select All with a layer option called Keep Transparent, you can isolate
    all image areas in a layer while leaving the transparent areas non-selected.


    # None


    Earlier you learned how to deactivate a selection by clicking outside the selection
    area. The Select None option will perform the same action; your marquee will be
    removed and the selection area deselected.


    # Float


    There are two basic types of selections, standard and floating. Standard means
    your selected area is still part of your image or layer. If you modify a standard
    selection, you modify the selection area within your image. A floating selection
    floats or hovers over the image or layer, and you can move or modify it without
    affecting the original image. There are two ways you can deflate a selection,
    or cause it to merge with your image. One is by deactivating the selection, and
    the other is by using the Anchor function in the Layers dialog box.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Feather


    This performs the same as the Feather in the tool options, the only difference
    being that it does not use a slider to control the feather radius, but rather
    the input of a numerical value.


    # Sharpen


    The Sharpen function gets rid of some of the outermost pixels along the edge of
    a feathered or antialiased selection, leaving a slightly smaller and sharper-edged
    selection in it’s place—kind of like the opposite of feathering.


    # Border


    By choosing this option, you can surround the selected area with a chosen number
    of pixels that then becomes the selected area—subject to all modifications such
    as color fill, and so on. This is a convenient option to use if you want to transform
    a selection area into a frame or an outline.


    # Grow and Shrink


    These options allow you to expand or contract the selected area by a chosen number
    of pixels.


    # Save to Channel


    By saving your selection in a channel, you are storing the selection’s shape in
    a grayscale format that you can reopen and use again in the form of a mask.


    # Select by Color


    This is similar to Fuzzy Select, but with more control. When this option is chosen,
    you’ll see another pop-up menu containing five choices. First is Replace, which
    you will use when, the Fuzzy Select tool, you want to click on a color to have
    it the selection. The next three choices, Add, Subtract, and Intersect also work
    by letting you click the color to which you would like the option applied. Last,
    the Fuzziness Threshold, controlled by a numerical slider, lets you determine
    how much tolerance other colors will be allowed when applying any of the previous
    options.


    # The Stroke


    Talk about useful features, and the Stroke has to be right up in the top. This
    ingenious little option can transform the outline of your selection (the part
    that’s showing as the marquee) into a line drawing in one easy stroke, therefore,
    your selection tools


    ![](img/0183f053b347a6407a2381be231d0345_88_0.png)'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'also become Drawing tools. By changing the brush settings, you can use it not
    only to make line drawings and outlines, but also to come up with some very interesting
    effects. Let me show you how it works.


    +   - Open a new blank image and create a selection area using a selection tool
    of your choice.


    +   - The Stroke function will use the settings from the Brush dialog box, so
    you''ll need to bring up the dialog box (File, Dialogs, Brushes), and choose the
    options you''d like to see in the Stroke, such as brush size, blend mode, and
    so on.


    +   - The color of the stroke will be the foreground color showing in your toolbox.


    +   - Right-click your image to bring up the menu, and click Edit, Stroke. You''ve
    turned your selection into an outline, as shown in Figure 5.14.


    # FIGURE 5.14


    A thick stroke has been applied to our earlier selection from Figure 5.11.


    ![](img/0183f053b347a6407a2381be231d0345_89_0.png)


    # Using Guides with Selections


    When you have an image open, you''ll see that there are two rulers in your image
    window—one over the image and one to the left. Place the cursor on the top ruler,
    click and drag down. You''ll notice a colored, dotted line pulling down your image
    as you drag; this is a horizontal guide. Now click on the ruler and drag to select
    your vertical guide. Guides are helpful when you need to place a selection in
    a precise location. You can use them in a couple of different ways:


    +   - Use guidelines as markers by placing them in the desired location and then
    moving your selections in line with them.


    +   - There is a Snap to Guides option in the View menu that pops up when you
    right-click your image. When the Snap to Guides is on, any selection that moved
    close to a guideline will then automatically snap into place alongside the line.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Working on Selections


    # Editing Selections


    This hour has been devoted entirely to creating selections, but I''d like to just
    briefly introduce two of the editing functions that you will be using when working
    with selections.


    # Moving a Selection


    The Move tool, along with the other transformation tools, will be covered in depth
    in the next hour, but I will touch on it here because it applies directly to selections.
    As soon as a selection is made, you''ll notice when you hold the cursor over the
    selected area, the Move symbol shows up even though you haven''t activated the
    Move tool. This allows you to move your selection one move, thereby changing it
    to a Floating selection. As you move it, you''ll see that the held selection is
    replaced by an area of solid color—the same as the background color in the toolbox.
    If it is a Floating selection, you must switch to the Move mode if you want to
    move it again. Your selection can be dragged anywhere in the image. However, until
    you switch to the Move mode, it will not move, but rather will allow you to make
    subsections that can become active selections upon the deactivation of the original
    selection.


    You can move the outline of a selection (the marquee) without moving the contents
    by holding down the Alt key while dragging to the desired area.


    # Copying and Pasting Selections


    To open the Copy option, right-click on your image and select File, Copy. This
    places a copy of your selection into the Clipboard, leaving the original image
    intact. You can then paste the selection into another area of the same image,
    or into a different image by selecting File, Paste.


    > If you are working on an image and have to stop, but do not want to lose your
    selection, be sure to save your image as an XCF extension. This will keep your
    selection area intact—marquee and all—for the next time you open the image, and
    it will preserve your layer information.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Summary


    Proper selections are an essential element for effectual image editing.

    The mere act of being able to zero in on a targeted area of a larger image, whether
    to extract or manipulate it, can provide unlimited possibilities to your artistic
    endeavors.

    The ability to acquire the kind of selection necessary to achieve a desired result
    is truly a talent worth developing.


    At this time, you might be wondering just what you are going to do with the selections
    after you have them, but because I will be referring to selections throughout
    the book, I wanted you to gain a complete understanding of the varied selection
    processes offered in the GIMP.


    # Q&A


    +   Q When should I set my options, before or after making a selection?

    A The Tool options that you pull up with each individual selection tool must be
    set before you begin your selection, the Select options (the ones you see by right-clicking
    your image and choosing Select) can be applied after your selection is in place.

    Q If I have an image with more than one selection, can I move the selections at
    a time?

    A No. Multiple selections within a single image will act in unison as if they
    were a single selection when applying any kind of transformation.


    # Exercise


    Find a picture of yourself or a friend. Practice using the various selection tools
    to isolate different parts of the picture, such as the hair, and only then and
    the lips. When trying to isolate small areas, you might want to use the Zoom tool.
    Just for fun, when you have a selection made, right-click the image, select Image,
    Colors, Hue-Saturation, and play around with the sliders. You might be surprised
    at what you''ll come up!'
  merge: -1
  img_proc: true
- pgno: 92
  md: '+   * Move

    * Magnify

    * Crop

    * Transform

    * Flip'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Transformation Tools


    I''ll begin with the basic transformation tools that appear in the toolbox window,
    as shown in Figure 6.1.


    FIGURE 6.1 Zoom/Magnify


    +   These tools have more versatility than you might imagine.

    - Move

    - Crop

    - Flip


    # Move


    After your brief introduction to the Move tool in Hour 5, you have probably guessed
    that you should get to know it better.


    The first capability I will discuss is the capability of moving an entire image.
    When the Move tool is activated, think of it as a little grabber, which you can
    use to grab on your image and drag it to another location by pressing and holding
    the mouse button. See Figure 6.2.


    # FIGURE 6.2


    When no selection is made, the Move tool moves the entire image.


    ![](img/0183f053b347a6407a2381be231d0345_93_0.png)


    > To move an image or layer that has been created within a transparent background,
    you must either grab the visible portion of the image or use the Shift key while
    clicking the mouse button and moving the image.


    When moving selections within an image, the Move tool works a little differently
    than it does in most other graphics programs. It might seem confusing until the
    mouse cursor is held over a completed selection with the selection tool still
    active, the Move tool symbol appears over it if you have switched to the move
    mode. This enables you to move the selection, but only once.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Transformations


    you want to move the selection further, you must remember to activate the Move
    tool by clicking on the Move icon in the toolbox. Otherwise, the selection tool
    assumes that you want to make another selection inside your original. You should
    notice that this inner selection area is surrounded by a gray nonflashing marquee
    (indicating that it is not active), yet it becomes active by clicking in the original
    selection area. By doing so, the original selection is deactivated. See Figure
    6.3.


    # Figure 6.3


    If you forget to activate the Move tool, your efforts to move end up forming selections
    by accident. No reason to despair; simply undo them and turn on the Move tool.


    ![](img/0183f053b347a6407a2381be231d0345_94_0.png)


    # Magnify


    Although the Magnify (Zoom) tool does not actually alter an image in a permanent
    way, I want to cover it in this hour because it can alter the way you view an
    image while you work on it.


    The premise is simple. You can magnify or zoom in an area to get a closer look
    at it. This is very handy for work such repairing old photos where you need to
    pixel-by-pixel. With the Zoom tool activated, you merely click the image to zoom
    in and Shift-click to zoom out. You can also zoom in and out by using the plus
    (+) minus (-) keys on the keyboard. To zoom in a particular area of an image,
    click and drag that area.


    If you pull up the Zoom tool dialog box, you can see that it has only one option,
    Allow Window Resizing. If this option is unchecked, your image window keeps its
    original size, no matter how much you zoom. Checking the option enables the window
    to reduce or enlarge to fit the amount of zoom applied.


    A few other features are enabled in the menu. Right-click an image and go to View.
    Most of the features are pretty self-explanatory. You can zoom in, zoom out, or
    zoom to a certain amount among nine choices. You can look at the information to
    see window size, scale ratio, and so on and toggle certain window functions on
    and off. Applying the shrink wrap function resizes your canvas to fit your image.
    One'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'very cool function you can find in the menu is called New View. This works
    by opening one or more duplicate windows of your image to show any changes you
    apply to the original. For instance, if you are working on an image where you
    need to zoom in a great deal, the duplicate window can show the effects of the
    changes on a non-zoomed duplicate so that you don''t have to constantly zoom in
    and out to see whether the changes you make are achieving the desired results.


    # Crop


    The Crop tool works by enabling you to choose an image area and eliminate any
    unwanted edges by cutting them off, like trimming a photograph with scissors.


    Open an image and click the Crop tool to activate it. Move the cursor over your
    image to the place that you want to begin the crop.


    By clicking and dragging diagonally across the image area, you should notice rectangular
    lines forming an outline to show the selected crop area, as shown in Figure 6.4.
    As you release the mouse button, a crop window pops up on the screen with information
    about the crop area, including the size of the crop width and height, which can
    come in handy if you need an image to be a specific size. The crop window also
    shows the X and Y origin of the upper left point of the crop. Watch the rulers
    in the image window as you drag the crop area. The X (horizontal) origin is the
    amount from the left side of the image area, whereas the Y (vertical) origin is
    the pixel amount from the top of the image window to the top of the image crop
    area.


    By pressing the Crop button located at the bottom of the crop window, you automatically
    trim off the extraneous edges from your image and crop it down to the chosen size.
    There is also a Selection button. This works by snapping the crop lines to the
    edges of an active selection area; it comes as close as can to the actual selection,
    yet still maintains the rectangular crop shape. You can then click the Crop button
    to perform the crop.


    Two extra crop functions are in the menu. With an image open, right-click and
    go to Image, Transforms, and you can see autocrop, which automatically removes
    any solid colored borders from an image. The other is zealous crop, which cuts
    off areas of highly contrasting color surrounding an image, such as a border.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Transformations


    # FIGURE 6.4


    The Crop tool enables you to easily eliminate unnecessary parts of an image.


    ![](img/0183f053b347a6407a2381be231d0345_96_0.png)


    # Transform


    The Transform tool works its magic by moving image information around to your
    specifications, creating transformed versions of the original. It can be used
    to rotate, scale, skew, and distort images, selections, or layers. Double-click
    the Transform tool to bring up the options, which you can see in Figure 6.5.


    # FIGURE 6.5


    The Transform tool can perform some pretty interesting effects.


    ![](img/0183f053b347a6407a2381be231d0345_96_1.png)


    # Rotation


    The first option you will look like is Rotation. This works pretty much as you
    would expect from the name, enabling you to rotate the image or selection by clicking
    and pulling it in the direction you want to. As you move, you should notice a
    small window pop showing the angle of the rotation. The Rotation tool is especially
    useful when working with scanned images that might not have been scanned perfectly
    straight. Look at Figure 6.6 to see a before-and-after version of an image that
    needed to be straightened with the Rotation option.'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'There are extra Rotation options in the menu. Right-click your image and go
    to Image, Transforms and you should find options that enable the rotation to be
    performed by degrees of 90, 180, and 270.


    Holding down the Ctrl key while rotating, you can turn your image in 15-degree
    increments.


    # FIGURE 6.6


    The original image is at an unattractive slant, but the rotation has corrected
    it.


    ![](img/0183f053b347a6407a2381be231d0345_97_0.png)


    The Smoothing option of the Transform tool works somewhat like antialias as you
    perform the different transformations, blending the image as it changes. If you
    perform many rotations in one row, it can sometimes result in a blurry image because
    it is blending each one in turn. After you know the degree of rotation you want
    the image to end up with, you can get a sharper look if you go back to the original
    and rotate only once to the desired angle.


    # Scaling


    This sounds interesting, but I promise you won''t find any snakeskin here. The
    Scaling function works by scaling your image or selection to a specific size.
    With scaling activated, the Scale options, as shown in Figure 6.7, show up as
    soon as you click your cursor on any corner of the image to begin the operation.
    The information includes the original image width and height, the current width
    and height which changes as you scale the image, and the X and Y ratios. If you
    want to merely scale the size of the image without stretching it out of shape
    one way or another, you must make sure the X and Y ratios match.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Transformations


    # FIGURE 6.7


    Scaling an image down to size is a quick and easy task in the GIMP.


    ![](img/0183f053b347a6407a2381be231d0345_98_0.png)


    While you''re on the subject of scaling, look at the scaling and resizing options
    in the menu. First, right-click an image and go to Image, Scale. A dialog box
    appears, as shown in Figure 6.8, which works in the same way as the Tool options
    for scaling, but this one does the work for you. You simply enter the dimensions
    you want your image to scale to. By having the Constrain Ratio option checked,
    which keeps your X and Y ratios the same, the image scales to a smaller or larger
    version with no shape distortion.


    # FIGURE 6.8


    You can enter the desired scale specifics in the menu dialog box.


    ![](img/0183f053b347a6407a2381be231d0345_98_1.png)


    Right-click your image and take a look at Image, Resize. This performs a little
    differently than scaling. Look at the Image Resize dialog box, as shown in Figure
    6.9. This enables you to set the desired dimensions; but rather than scaling,
    it deletes everything except the portion in the dimensions you have requested,
    much the same as cropping. The dialog box defaults to the center portion of the
    image, but by changing the X and Y offset values, you can position the sized area
    anywhere in the image. This is useful if you need have several different images
    with the exact same dimensions.


    ![](img/0183f053b347a6407a2381be231d0345_98_2.png)'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# FIGURE 6.9


    The Image Resize dialog box lets you reposition the location of the desired area
    by changing the offset values.


    ![](img/0183f053b347a6407a2381be231d0345_99_0.png)


    # Shearing


    Shearing produces a relative X or Y displacement, resulting in a sort of leaning
    effect, as seen in Figure 6.10. Clicking and dragging up or down on the corner
    of an image changes the Y (vertical) magnitude of the shearing effect, while dragging-horizontal
    changes the X displacement.


    # FIGURE 6.10


    The shearing effect produces a kind of tilting distort to an image.


    ![](img/0183f053b347a6407a2381be231d0345_99_1.png)


    # Perspective


    The Perspective option enables pulling the corners of an image by one to any position,
    altering the image to match the new positions. One nifty effect you can produce
    with Perspective is the illusion of receding into a vanishing point (see Figure
    6.11).'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Transformations


    # FIGURE 6.11


    An image with a different perspective.


    ![](img/0183f053b347a6407a2381be231d0345_100_0.png)


    Performing certain transformations on very large images can be quite memory intensive
    and thus takes time. Unless you have a pretty good amount of RAM in your computer,
    you might want to practice with a small image while you are first learning the
    techniques.


    # Flip


    The Flip tool enables you to flip an image either horizontally or vertically,
    resulting in a mirror image, as illustrated in Figure 6.12.


    # FIGURE 6.12


    Horizontal flips produce a mirror image, such as the one seen in here. Great for
    making images in pairs.


    ![](img/0183f053b347a6407a2381be231d0345_100_1.png)


    # Tutorial


    Now that you''ve been through a few hours and have learned some of the basics,
    put them into practice and create a unique image while you''re at it.


    In this tutorial, you will make an image that resembles a photo cube.


    To begin, you will need three images or photos close to the same size range. This
    might be a good chance to practice your scaling techniques. If you prefer, you
    can use one photo and put it on all three visible sides of your cube. Using three
    different but complimentary pictures makes a more interesting effect.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# 82 Hour 6


    Keeping your three photo images open, create three new blank image windows in
    a size that looks a little larger than the heads or portions of the photos you
    plan to use on the cube. Make the width and height the same so they are square.
    Use the Bucket Fill tool to fill each blank image in with a different color by
    changing the foreground color each time. Because I know the images in this book
    are in grayscale, I''ve chosen three very different colors that you will be able
    to see the corners and edges clearly when the cube is finished. If you like, you
    could use different patterns in each blank image instead of solid colors.


    Using the Rectangle tool, select an area out of the first photo, right-click and
    go to Edit, Copy. Now click one of the blank images to activate it and choose
    Edit, Paste. See Figure 6.13. After pasting, unselect by clicking once in the
    image to get rid of the marquee.


    # Figure 6.13


    +   Create the blank images a little larger than the planned selected photo area
    in order to create a border effect.


    ![](img/0183f053b347a6407a2381be231d0345_101_0.png)


    Repeat the copy and paste with the other two photos, placing them in the remaining
    blank image windows.


    At this point, you no longer need the original photos, so you might want to minimize
    or close them out to make some work space on the desktop.


    Open a new blank image at least twice the size of one of the bordered photo images
    you now have on the screen.


    In turn, copy and paste the three smaller images into the large blank image window,
    and arrange them as shown in Figure 6.14.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Transformations


    FIGURE 6.14


    Arrange your photos such as this in the larger image window.


    ![](img/0183f053b347a6407a2381be231d0345_102_0.png)


    With the last image you placed still selected, activate the Transform tool and
    the Perspective option.


    Pull the corners of the selected image into the beginnings of a cube shape, as
    in Figure 6.15.


    FIGURE 6.15


    By using the Perspective option to manipulate the corners of one of the squares,
    you can see the cube start to take shape.


    ![](img/0183f053b347a6407a2381be231d0345_102_1.png)


    After you have positioned in the shape of the cube top, activate the Rectangle
    tool once again, but this time select the side square and pull it into cube shape
    using the Perspective option of the Transform tool. You should now have a completed
    photo cube, as illustrated in Figure 6.16.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# 84


    # Hour 6


    FIGURE 6.16


    Making cubes is a fun way to practice transformations.


    ![](img/0183f053b347a6407a2381be231d0345_103_0.png)


    # Summary


    I devoted this hour to studying the powerful-yet-basic transformation tools available
    in the GIMP.


    By knowing how to alter existing images to achieve everything from creating a
    totally new look to fitting the image into desired dimensions, you can experience
    a whole new freedom in image manipulation.


    Let the metamorphosis begin!


    # Q&A


    +   Can I use the Move tool to move a selection from one image to another?


    +   No. The Move tool is used to move selections within an image. To move a area
    from one image to another, you have to use the copy and paste functions. Activate
    the image containing the selection, right-click it to bring up the menu, or go
    to Edit, Copy. The selection is now in the clipboard. Now activate the image you
    want to paste the selection into and click Edit.


    +   Is there a way I can enter the amount of rotation I want my image to have?


    +   No, but you usually can get fairly precise to a desired amount by watching
    the dialog box containing the angle information while you rotate.


    # Exercise


    Open an image and apply each of the transformation tools to it in turn to really
    get a feel for each tool and its options. Use an image that you are already very
    familiar with so that you''re able to notice exactly how change affects it.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# HOUR 7


    # Working with Color


    Color is perhaps one of the most important aspects of dealing with art and graphics
    media—because color is richly and deeply embedded into almost everything you do.
    By merely altering a few colors within a composition, you can completely modify
    the tone and feel of the entire image, and in turn, how your audience reacts to
    it. Therefore, put a lot of thought into the color composition of your images
    before you begin.


    ![](img/0183f053b347a6407a2381be231d0345_104_0.png)


    > Is color really that important? I invite you to take a look at some of your
    favorite Web sites and pay special attention to the way in which they deal with
    color scheming. How would they look if they simply altered their color scheme
    one day? They would probably lose that unique feel that makes them distinct, and
    chances are you would feel a bit thrown off by it. Your images are the same way.
    You should make sure that whatever colors you use in any graphic have a purpose
    and are more than random hues without function. People notice and react to color
    more than they might realize.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'In order to work with color effectively in digital form, you first need to
    touch base on exactly how your computer recognizes color and how using different
    media can alter the way in which your machine thinks about color.


    # The GIMP and Color


    The GIMP version 1.0 is designed primarily with digital graphics in mind—whether
    you use them online, embed them in your documents, create animations, or use any
    other digital media. (The GIMP outshines most other applications when dealing
    specifically with Web graphics; therefore, the Web is the GIMP’s primary focus.)
    Admittedly, the GIMP is not yet as effective as a professional print tool, although
    the developmental versions of the GIMP are already showing much promise in that
    area well. (That function could very possibly be part of the stable distribution
    even by the time this book is on shelves.) However, for regular day-to-day printing
    tasks, the GIMP can perform nicely.


    # Color Models


    The Color models define how your computer interprets color and displays it in
    various media. You should familiarize yourself with these models, because they
    are essential for understanding some of the language and concepts behind graphics
    and color in general.


    # RGB Model


    FIGURE 7.1

    Most applications use the RGB color model to describe color in terms of how it
    appears on monitors and screens.


    ![](img/0183f053b347a6407a2381be231d0345_105_0.png)


    The GIMP deals primarily with the RGB model of color (RGB stands for Red, Green,
    and Blue). This is the model used for representing color on monitors and screens,
    because it is defined by light instead of paints and tints. Therefore, any colors
    represented onscreen are composed of a combination of the colors red, green, and
    blue.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Working with Color


    (Televisions also work in this same way—which you can see if you ever take the
    time to look at a television really closely. You will see lots of little red,
    green, and blue dots with varying degrees of brightness.)


    For creating Web sites, colors in HTML are also represented in RGB as sets of
    base-16 (hexadecimal). One handy function of the Color Picker tool is to automatically
    show you the HTML code for your color. I have grown to love this feature.


    # HSV Model


    The HSV Model is a way to describe hue, saturation, and value. The GIMP uses this
    color model in combination with the RGB model. It is the model used by the Color
    Selection dialog box, shown in Figure 7.2, and in many other filters and dialog
    boxes.


    # Figure 7.2


    ![](img/0183f053b347a6407a2381be231d0345_106_0.png)


    The HSV model is used by the Color Selection dialog box along with the RGB model.
    You can adjust the hue, saturation, and value by using the sliders.


    +   * Hue refers to the color itself—any color in the rainbow, whether red, green,
    blue, yellow, and so on.

    * Saturation represents intensity of color. The lack of color intensity results
    in grayscale, and full saturation in 100% full color. So if you were to slide
    the Saturation slider in the color dialog box, your color would become more and
    washed out until you used it with pure gray.

    * Value is the amount or intensity of light within the color. A color is true
    at 50% value. By contrast, 100% value is white, and 0% value is black.


    You can attain a wide range of colors by using the HSV model, although you should
    experiment a little in order to get the hang of it. For example, turn up the value,
    and perhaps tone down the saturation a bit, to see pastel colors. By contrast,
    you can find deep Earth tones by turning down the brightness and, to a lesser
    degree, the saturation.


    ![](img/0183f053b347a6407a2381be231d0345_106_1.png)'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Indexed Model


    The Indexed model refers to images that have a fixed number of colors, usually
    256 (8-bit). Each pixel in an indexed image is assigned a specific color index,
    and therefore indexed color does not use RGB in the strictest sense.


    Indexed images are used mostly on the Web (in GIF format) in order to save space
    and, subsequently, download time. Because indexed images have limited colors,
    they are usually much smaller in size, many things this sacrifices image quality.


    To reduce the active color depth, right-click and go to Index, The image pictured
    in Figure 7.3. This will pull up the dialog box (The option Enable Floyd-Steinberg
    Dithering simply tries to improve the image quality by dithering, or effectively
    emulating it using dots of active color—like a printed comic strip looks on close
    examination.).


    # Figure 7.3


    The Indexed model is used by graphics formats that use a limited number of colors—traditionally
    no more than 256 of them. The GIF format is an example of a popular format.


    ![](img/0183f053b347a6407a2381be231d0345_107_0.png)


    These images can also use any number of palettes, which are indexed color maps,
    to assign specific colors to limited color graphics. This could be a palette of
    nothing but shades of blue, primary colors, the Windows and Netscape 8-bit palettes,
    and so forth. This will be discussed at length when we get into Hour 15,"Web Graphics."


    # Using Indexed Palettes


    The GIMP enables you to load and apply any number of custom palettes into your
    indexed image. Palettes, like their real-life counterparts, are predefined tables
    of specific colors for your image to use. They do limit the amount of colors and
    the specific colors for your image can use, but they can help you get a more specialized
    Indexed image. For example, they can match exactly the original colors of a high
    quality image or more closely match a system palette, such as Netscape''s Web
    palette, in order to create an image that looks the same across platforms, even
    on low-end 256 color displays. I will talk more about this in Hour 15.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Working with Color


    In order to do this, go to the toolbox menu File, Dialogs, Palettes, and you will
    see a dialog box, as shown in Figure 7.4, with a drop-down menu from which you
    can select many default palettes. These palettes are available from the Use Custom
    Palette option in the Indexed Color dialog box. With the Color Palette dialog
    box, you can create new palettes and edit existing palettes to your liking and
    apply them to your image.

    Any GIMP palettes you make or find online should go in your ~/gimp/palettes directory.
    They will then be accessible from the Color Palette dialog drop-down menu.


    # Figure 7.4


    Palettes enable you to customize the exact color values of indexed images.


    ![](img/0183f053b347a6407a2381be231d0345_108_0.png)


    # Grayscale


    The concept of grayscale is easy. A grayscale image is one that has no color,
    only 256 shades of black, white, and gray. To grayscale an image, simply right-click
    and go to Image, Grayscale. Note when you save that not all image formats support
    grayscale, but most do.


    # CMYK Model


    Print does not use light to display color, but ink instead (or toner, if you like).
    As you know, lights add value to each other when mixed together, but inks and
    paints are subtractive in nature, as shown in Figure 7.5. ( It''s a black-and-white
    book...you''ll have to use your imagination ) This means that mixing the three
    RGB colors using light gives you white, but using paint gives the CMYK colors
    black. (Well, in practice it''s more like a dark brown.)


    Print deals with color using the CMYK model. (CMYK stands for cyan, magenta, and
    black; the K is for black, because using the letter B might cause people to confuse
    black and blue. ) It works by splitting the image into four color channels, each
    corresponding to the appropriate ink cartridge or toner of matching color.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '90


    Hour 7


    # Magenta


    # FIGURE 7.5


    The CMYK model of color is used for high-quality printing. Unlike RGB, it uses
    four main color channels instead of three. Black, is of course, needed for a good-looking
    printout.


    ![](img/0183f053b347a6407a2381be231d0345_109_0.png)


    Cyan


    Yellow


    If you are primarily concerned with your images coming out properly in professional-quality
    print, the conversion from RGB to CMYK is less than perfect. (Although you will
    never have a perfect representation of print colors on your monitor, you can get
    pretty close.) CMYK support is yet fully implemented in the current stable release
    of the GIMP, but as far as I know the next version of GIMP currently in development,
    will have much better support for CMYK. I assume that your primary concern right
    now is creating graphics for onscreen display or casual printing. I have covered
    CMYK simply for the purpose of understanding.


    # Color Channels


    Channels describe the colors to your output source, whether it is a digital screen
    or a printer. To do this by simply being in charge of one color per channel, at
    which point the device combines them into a multicolored image that is human readable.
    Therefore, whenever I speak of RGB channels, I speak distinctively of the red,
    green, and blue portions of an image. The GIMP enables you to manipulate the separate
    color channels individually and create new channels if you want.


    In order to view the working image''s channels, go to the Layers Channels dialog
    box from a right-click, Layers & Channels (see Figure 7.6). The first tab of this
    dialog box shows your image''s layering information. Because you are now working
    with only one layer, you can go ahead and click the tab labeled Channels. Here,
    you will see your image as represented by the three RGB channels. You can now
    click any of the'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Working with Color


    eye icons to make a channel momentarily invisible and edit one channel individually.
    There are a few situations in which you might want to do this. For now, experiment
    to gain a basic understanding of how channels work.


    FIGURE 7.6

    Color channels enable you to work on any color element of an RGB image individually.
    This can be handy for creating effects with color.


    ![](img/0183f053b347a6407a2381be231d0345_110_0.png)


    # Working with Transparencies


    In any working image, you can have in any area a transparency, which is an area
    of an image with no color. Of course, not every image file format supports transparencies,
    but for those that do it is a fantastic feature.


    You can create a new image from scratch using transparencies. Simply go to File,
    New and select transparent as your Fill Type. When the image pops up, you will
    see that it is covered with a light and dark grey checkerboard pattern, as in
    Figure 7.7. This is to let you know that you are looking at is indeed invisible
    by the GIMP.


    FIGURE 7.7


    A transparent image lets you insert any element without having a background of
    any kind.


    ![](img/0183f053b347a6407a2381be231d0345_110_1.png)


    ![](img/0183f053b347a6407a2381be231d0345_110_2.png)'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Hour 7


    ![](img/0183f053b347a6407a2381be231d0345_111_0.png)


    You can specify the size and color of the checkerboard pattern for transparencies
    by going to File, Preferences and clicking on the Display tab, as pictured in
    Figure 7.8. From there, you can specify the checks to be darker or larger or smaller
    using the Transparency Type and Check Size options.


    # FIGURE 7.8


    The checkerboard preferences.


    ![](img/0183f053b347a6407a2381be231d0345_111_1.png)


    Now that you have a transparent image, you will probably want to put something
    on it. For this example, I will use a selection copied from another image.


    +   - First, you will need a source image with something you would like to set
    against a transparent background.

    - Then, after you have successfully tweaked the selection to your liking (using
    any selection tools necessary—the Bézier is needed for those tricky shapes), you
    can copy it with a right-click, Edit, Copy (see Figure 7.9).

    - Going back to the transparent image, you can paste it (right-click, Edit, Paste)
    and position or transform it as you see fit (see Figure 7.10).

    - After you have an image with a transparency exactly the way you like it, you
    should save it in a format that supports image transparencies. GIF comes to mind.
    (Remember that before you save a file as GIF, it must be reduced to an indexed
    color format, because no GIF can have more than 256 colors.) To reduce the color
    depth, right-click, go to Image, Indexed, and select the 256 colors option in
    this dialog box.'
  merge: -1
  img_proc: true
