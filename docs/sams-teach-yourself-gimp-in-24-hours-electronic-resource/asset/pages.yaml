- pgno: 246
  md: '# FIGURE 16.18


    Framing an image is an excellent way to spice it up and draw attention to it.


    ![](img/0183f053b347a6407a2381be231d0345_246_0.png)


    # 16


    # Summary


    The merging of images is probably one of the most enjoyable ways to let your creative
    juices flow. After you master the techniques you need to know to effectively combine
    images, you''ll never look at a photograph the same! Instead, you will undoubtedly
    visualize the possibilities that could happen with the image and your newly honed
    composing skills.


    # Q&A


    +   - What if the images I want to combine are all different sizes?

    - No problem. Either resize or rescale the images before you begin. Or better
    yet, start with a large blank image and add each of your images in its own layer
    so that you can rescale within the dimensions you need as you go.

    - After I cut and paste one selection into another, I can see unnatural looking
    jagged edges around the selection I pasted. What can I do?

    - First, make sure you have the aliasing button checked in the selection options
    before making the selection. Create a new layer to paste into, rather than pasting
    the selection directly into the other image. That way, you can use the Eraser
    tool to carefully erase those jaggies and get a more realistic look for your composite.'
  merge: -1
  img_proc: true
