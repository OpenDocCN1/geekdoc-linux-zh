    The selected area becomes filled with color.


    ![](img/0183f053b347a6407a2381be231d0345_147_0.png)


    Now you can get somewhat of an idea of what the car will look like with the lighter
    color, but you can''t really see the details. This is a situation where you can
    use a blend mode to help out.


    Most of the blend modes will still let the dark original color of the car come
