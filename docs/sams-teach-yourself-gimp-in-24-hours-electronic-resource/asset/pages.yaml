- pgno: 36
  md: '# 2 HOUR


    # # Getting Started


    In Hour 1, "Installation and Configuration," you covered GIMP installation in
    detail. Now that the installation issues are taken care of, you are ready to begin
    learning how to use the GIMP effectively. Because it is a graphics application,
    the first logical thing to do in this hour is to open, manipulate, and save some
    graphics, and learn about the various file formats and options in the process.


    Although it is a very robust program, and might work a little differently than
    you''re used to, the GIMP is actually pretty easy to learn. If you are familiar
    with graphics applications, you should feel right at home with the GIMP. You might
    want to browse these next two hours (2 and 3) just long enough to get a feel for
    the application, and then dive right in to the really fun stuff.


    # # Your First GIMP Session


    In order to start the GIMP (making sure that X is up and running), type the executable''s
    name at an Xterm (or create an icon or menu item within your favorite Window Window
    Manager), and watch the magic begin.


    gimp &


    ![](img/0183f053b347a6407a2381be231d0345_36_0.png)'
  merge: -1
  img_proc: true
