- pgno: 136
  md: '# Introduction to Layers


    Next, create another layer, name it water, and copy and paste the water image
    there. Activate the Move tool to drag the water to the lower half of the layered
    image, as in Figure 8.11.


    # FIGURE 8.11


    With the Move tool, you can position a layer anywhere in the image.


    ![](img/0183f053b347a6407a2381be231d0345_136_0.png)


    > As you move or scale a layer, you will notice that the black and yellow dashed
    line that usually marks the borders of an image is now surrounding the active
    layer only. This shows where the layer boundary is for the particular layer you''re
    working on. It will not be visible after you save the image.


    Now you are going to create one more layer, name it moon, and copy and paste the
    moon image there, but you will not want to include the black background surrounding
    the original moon image. To easily get the moon, activate the Fuzzy Select tool
    and click on the black portion of the moon image, which turns that portion into
    a selection. Right-click on the image and choose Select, Invert, and you will
    have a selection of the moon only. Copy, paste, and anchor this selection to the
    empty moon layer.


    The moon image is slightly too large for this scene, so you will need to scale
    it down to size. Activate the Transform tool in the toolbox and set it to Scale.
    Right-click on the name moon in the Layer & Channels dialog window to bring up
    the menu, and choose Scale.


    By either clicking and dragging on the corners of the moon layer, or setting the
    desired size in the Scale options box, you can scale it to the right size to fit
    in with the rest of the image (see Figure 8.12).'
  merge: -1
