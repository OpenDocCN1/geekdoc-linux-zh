- pgno: 33
  md: '+   - Read the Readme file.


    +   - Do the standard compile as the root user.


    ```

    ./.configure

    ```


    ```

    make

    ```


    ```

    make install

    ```


    +   - Install the GIMP data package; repeat preceding steps for gimp-data-extras-1.0.2.tar.gz.


    +   - Compile and install the GIMP extra filters package—gimp-plugins-unstable-1.0.2.tar.gz.
    This is completely optional, but you''ll most likely want these fantastic-plugins.
    Read the Readme file—included in the filters package—thorough for more details
    concerning installation and specifically the source compilation. You will save
    yourself much time and many headaches by doing so.


    Given a smooth compile session, everything everything should be in order for you
    to run the GIMP for the first time.


    Although the preceding instructions might seem to indicate otherwise, installation
    of the GIMP will, in all likelihood, proceed smoothly and without incident. However,
    there are always exceptions to the rule. If you happen to find yourself in such
    a situation, take advantage of the world''s most reactive and reliable technical
    support system available anywhere—Linux subgroups and mailing lists.


    # Source Installation for RPM-Enabled Systems


    If you are running an RPM-enabled system, you might still want to compile the
    source tree from scratch. This can be handy in situations where your system might
    be employing idiosyncratic directory tree, or where system libraries might be
    slightly customized or customized. Sometimes there''s nothing better than have
    something custom built for your system.


    If you are installing from the CD-ROM, you will want to install the GIMP sources
    via RPM from the /gimp/RPM/src directory like:


    ```

    rpm -ivh gimp-1.0.2-1.src.rpm

    rpm -ivh gimp-data-extras-1.0.2-1.src.rpm

    rpm -ivh gimp-plugins-unstable-1.src.rpm

    ```


    This decomposes the source files into the /usr/src/redhat/ directory, under which
    the source and spec files (building parameters) are unloaded into the /SOURCES
    and SPECS directories, respectively. You will need to cd into the /usr/src/redhat/SPECS
    directory and issue the following commands in order to build the source according
    to the spec files:'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Installation and Configuration


    ```

    rpm -bb gimp-1.0.2-1.spec

    rpm -bb gimp-data-extras-1.0.2-1.spec

    rpm -bb gimp-plugins-unstable.spec

    ```


    This compiles the source and packages the binaries into tidy RPM packages for
    you. For forearmed: the GIMP consists of over 300,000 lines of code, so expect
    this compilation to take a while, depending on your machine. After it finishes,
    you can then install these RPMs just like you would any other.


    ```

    cd /usr/src/redhat/RPMS

    rpm -Uvh gimp-1.0.2.i386.rpm

    rpm -Uvh gimp-devel-1.0.2.i386.rpm

    rpm -Uvh gimp-data-extras-1.0.2.i386.rpm

    rpm -Uvh gimp-plugins-unstable.-1.0.2.i386.rpm

    ```


    # Source Installation Troubleshooter


    +   Q keep getting errors about not finding libgtk.

    A First of all, make sure you have GTK installed! Then, make sure it is in your
    search path. Add the line /usr/local/lib to /etc/ld.so.conf with your favorite
    text editor, and then run ldconfig.

    Q keep getting glibconfig.h - not found errors.

    A Make sure that the header files glib.h and glibconfig.h are in their proper
    places. On systems, glibconfig.h should go in /usr/(local)/lib/glib/include, and
    glib.h in /usr/(local)/include/

    GIMP won''t compile correctly on Solaris, HP-UX, and so on.

    A Every platform has its own quirks. For non-Linux platform specific issues, it
    is best to consult newsgroups and Web sites for answers. The GIMP Developer’s
    FAQ—http://www.rru.com/-meo/gimp/faq-dev.html—has a lot of really good, solid
    answers for these kind of issues.


    # Summary


    Hopefully, installation has proceeded smoothly and without incident. Again, if
    you do run into snags, there are a lot of people out there willing and able to
    help. If this is the case, you will likely find that the answers are frequently
    quite simple. Fortunately, GIMP is, for the most part, well behaved for installation.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Q&A


