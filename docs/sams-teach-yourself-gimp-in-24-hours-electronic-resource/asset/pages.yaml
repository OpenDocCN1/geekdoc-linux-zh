  img_proc: true
- pgno: 234
  md: '![](img/0183f053b347a6407a2381be231d0345_234_0.png)


    # HOUR 16


    # # Photo Compositing


    Even though GIMP possesses amultif array of tools and functions that can be used
    for such feats as creating cool Web graphics, animations, and so forth, I know
    there are many of you out there who would like to really focus your graphics skills
    on photo manipulation. The next two hours were written with you in mind.


    In Hours 9, “Hands-on Layering,” and 10, “Using Masks,” you got a glimpse of what
    can be done with photos using layering and masks. During this hour, you will concentrate
    on combining the methods you''ve learned with some additional tricks to achieve
    some very popular and surprisingly easy composite effects.


    # # What Is a Composite?


    A composite is something that is composed or made up of separate parts or elements.
    When you refer to composites in terms of photographs and graphic images, basically
    you are talking about combining two or more images into one.'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'There are multitudes of ways you can go about combining images. By using layering,
    opacity, and blend mode techniques, you can virtually see through one image into
    another. With the use of masks and gradients, you can make one image appear to
    fade into another. By utilizing the selection tools, you can select portions of
    one image and place them into another, or you can create a collage effect by placing
    image selections adjacent to each other in a larger area.


    # Creating Composites


    To plan a composite, the first thing to do is try and visualize the arrangement
    of the images. After you have the general idea of what you want, it''s just a
    matter of using the right tools to get them there, and believe me, GIMP contains
    all the right tools to create the various types of composites.


    # Using Selections in Composites


    To illustrate basic compositing, I am going to start with two images, and combine
    them into one more interesting image. Take a look at Figures 16.1 and 16.2. Open
    the sunset.jpg and skull.jpg images from the CD-ROM to practice with.


    For this type of composite, use one of the many selection tools (the Lasso or
    Bézier would both work well in this instance) and select the skull in the first
    image (see Figure 16.3).


    Now, right-click, and select Edit, Copy, to copy the selection into the Clipboard.
    Then right-click, and select Edit, Paste into the other image to get the final
    picture, as in Figure 16.4.


    FIGURE 16.1


    This image could use some color in the background.


    ![](img/0183f053b347a6407a2381be231d0345_235_0.png)'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Photo Compositing


    # FIGURE 16.2


    This one is all background. Are you thinking what I''m thinking?


    ![](img/0183f053b347a6407a2381be231d0345_236_0.png)


    ![](img/0183f053b347a6407a2381be231d0345_236_1.png)


    # FIGURE 16.3


    Carefully select only the skull so that you will be able to move it out of this
    dull background.


    ![](img/0183f053b347a6407a2381be231d0345_236_2.png)


    # FIGURE 16.4


    A very quick and simple composite image.


    ![](img/0183f053b347a6407a2381be231d0345_236_3.png)'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# Using Feathering


    By adjusting the feathering control when you make a selection, you can give a
    soft-edged look to your images and make interesting composites and collages.


    To illustrate this technique, I will use three images, as shown in Figure 16.5
    (cat.jpg, tiger.jpg, and lion2.jpg). These are also available in the CD-ROM exercise
    section.


    # FIGURE 16.5


    When combined, these images will make a unique collage.


    ![](img/0183f053b347a6407a2381be231d0345_237_0.png)


    The first thing you need to do is rescale the three individual images so that
    the areas you want to use are sized to fit together in the correct way. The next
    step is to open a new blank image window and set the dimensions large enough to
    accommodate all three. I''ve filled my new image window with a radial gradient
    just to give it some extra color.


    This time, before making the selections that will be moved into the larger image,
    activate the feathering options (accessed by double-clicking the selection tool
    of your choice) and set the feather radius to around 40 or so to give a nice soft
    blended edge to each.


    One by one, you can select the desired areas and Edit, Copy and then Edit, Paste
    into the larger image area. You should end up with a picture collage something
    similar to Figure 16.6.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# FIGURE 16.6


    Feathering can really give a composite soft touch.


    ![](img/0183f053b347a6407a2381be231d0345_238_0.png)


    Now let''s taking it even a step further by feathering, copying, and pasting this
    entire image into another background.


    Open a new image window and fill it with a pattern of your choice. Make a feathered
    selection containing the previous image and select Edit, Copy, and then Edit,
    Paste into this new image. Anchor it. You will have a double-feathered image,
    as in Figure 16.7.


    # FIGURE 16.7


    Feathering and moving to a leafy background adds an enhancing touch to this collage.


    ![](img/0183f053b347a6407a2381be231d0345_238_1.png)'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'You can make some interesting collages by using the feathering approach with
    family pictures or images with the same theme, such as wedding or vacation photos.
    Arrange the feathered selections adjacently in an image area large enough to accommodate
    them all. To make the composite a little more interesting, try making each selection
    a different shape. Try making a collage theme with your own images, and then decorate
    the blank spaces with text and designs.


    # Opacity


    You learned about using the opacity slider with layers in earlier hours. Now let''s
    put the opacity function to work to create a composited image.


    For this, you will need to open cards.jpg and derringer.jpg from the CD-ROM, (see
    Figures 16.8 and 16.9).


    # FIGURE 16.8


    You don''t need complicated images to make an interesting composite.


    ![](img/0183f053b347a6407a2381be231d0345_239_0.png)


    # FIGURE 16.9


    This will fit together nicely with Figure 16.8.


    ![](img/0183f053b347a6407a2381be231d0345_239_1.png)'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'The first thing to do here bring up the Layer dialog box to add a new transparent
    layer to the cards image. That is where you will put the derringer.


    Go back to the derringer image and use a selection tool to select only the gun.
    This is an instance where the Fuzzy Select tool will probably be the best one
    for the job. Activate the tool, click on the white portion of the image to select
    it, and then right-click, and choose Select, Invert to place the selection marquee
    around the gun.


    Right-click, Edit, Copy, and you are ready to Paste the gun image into the new
    layer you created in the card image.


    Now you are ready to use the opacity slider. With the derringer layer as the active
    layer, change the opacity setting to around 50 or—just enough to let the cards
    show through, as in Figure 16.10. Now your image is complete.


    # FIGURE 16.10


    This composite gives an eerie but effective reminder that these cards are known
    as "The Dead Man''s Hand."


    ![](img/0183f053b347a6407a2381be231d0345_240_0.png)


    # Blend Modes


    Use of blend modes in a composite can create some striking effects, as you learned
    in Hour 9. You''ll use a blend mode here to blend two images in a certain way.


    For this exercise, open the bird.jpg and sky.jpg images from the CD-ROM (see Figure
    16.11).


    To begin, give these two images the same sort of hue before you mix them so together.
    The bird image has a sort of golden hue, so give the sky image a similar hue by
    right-clicking, and then selecting Image, Colors, Hue-Saturation. Adjusting the
    hue slider until you have a similar golden tint to the clouds and sky. When you
    are satisfied, click OK, and then right-click the image, and select Edit, Copy.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'Now, go back to the bird image, add a new transparent layer and select Edit,
    Paste to paste the sky into this new layer. Anchor it.


    Now comes the blending magic. Click in the blend mode drop-down menu and choose
    Multiply Watch as the two images transform into one, as illustrated in Figure
    16.12.


    FIGURE 16.11


    With the help of blend modes, these two images will appear as though they were
    meant to be together.


    ![](img/0183f053b347a6407a2381be231d0345_241_0.png)


    FIGURE 16.12


    The bird looks much more at home with a few clouds in the sky.


    ![](img/0183f053b347a6407a2381be231d0345_241_1.png)


    # Gradients


    You can get some fascinating effects when you use gradients and masks to make
    composites. I must warn you though, after you learn to use these two functions,
    you can spend hours on coming up with a million different looks to any given image!
    You might get hooked.


    For the technique demonstrated here, you can use the images bird.jpg and bird2.jpg
    (see Figure 16.13) from the CD-ROM.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# FIGURE 16.13


    This procedure will use two variations of the bird image, the original and the
    lithograph copy.


    ![](img/0183f053b347a6407a2381be231d0345_242_0.png)


    Open the bird.jpg image and right-click it to access the menu and open the Layer
    dialog box (click Layers, Layers and Channels). Add a new transparent layer.


    Open the second image and right-click, Edit, Copy, and paste it into the new layer
    of the first image. Remember to anchor it.


    Right-click the thumbnail image of this new layer in the Layer dialog box and
    choose Add Layer Mask. Choose white in the Add Layer options box.


    In the toolbox, set the foreground color to black and the background color to
    white.


    Double-click the Gradient tool to activate it and bring up the gradient options.
    Choose Radial. Apply the gradient to the mask beginning in the center of the image
    and dragging to any edge.


    Your result will be a mixture of the original image and the lithograph copy, giving
    the illusion of the bird picture fading into a black-and-white drawing around
    the edges (see Figure 16.14). You can intensify the effect by adjusting the brightness
    and contrast before you apply the layer mask.


    # FIGURE 16.14


    Astonishing effects can be achieved with the use of gradient masks.


    ![](img/0183f053b347a6407a2381be231d0345_242_1.png)'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# Framing Photos


    Now that you''re learning all these great photo effects, you will probably want
    to show off your work. Whether you are going to display your images on your desktop
    or print them, a good way to give a final finishing touch is to add a frame.


    To begin the frame, open any image. I will use the simple composite from the beginning
    of this hour.


    Check the size of the image by right-clicking, and going to View, Window Info.


    Now you need to decide how large the image will need to be with a frame added.
    Because the image for the example is 400 × 350, it would be good to make the frame
    20 pixels wide. Open a new blank window and make it 40 pixels bigger than the
    original image in width and height, making it 440 × 390. That will give you 20
    pixels on each side to form the frame.


    Go back to the original image and select Edit, Copy, and then Edit, Paste into
    the new window. It will automatically be centered on the plain background, giving
    it a border. Deactivate the selection.


    Click on the Fuzzy Select tool to activate and click once anywhere in the plain
    border area. This area will now become surrounded by the selection marquee, as
    shown in Figure 16.15.


    FIGURE 16.15


    The border area is selected and ready for whatever effect you choose to apply.


    ![](img/0183f053b347a6407a2381be231d0345_243_0.png)


    For this image, a wood border will look good, so you can use a pattern fill. Open
    the Pattern dialog box (File, Dialogs, Patterns), and choose one of the wood patterns.
    We'
