    Decide how wide the sidebar portion should be. You can make it any size you like,
    but most of the time, sidebars are 100–150 pixels wide. To select the area, use
    the Rectangle selection tool and begin at the upper-left corner of the image.
    Drag to the right as far as the width you chose for the bar and all the way down
