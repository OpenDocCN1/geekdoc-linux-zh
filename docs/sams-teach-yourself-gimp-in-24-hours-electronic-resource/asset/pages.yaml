    # Summary


    This hour, you looked at a few of the ways you can utilize the brushes and other
    GIMP tools to create paintings that simulate real-life art. These days, with the
    advent of so many fine computer graphics programs to choose from such neat tricks,
    you only have to possess the imagination and desire to become an artist. Just
    think what Da Vinci could have accomplished with the tools available today!'
