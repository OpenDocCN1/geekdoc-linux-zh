- pgno: 137
  md: '# FIGURE 8.12


    Scaling is applied to the active layer, but does not affect the other layers.


    ![](img/0183f053b347a6407a2381be231d0345_137_0.png)


    Now, the moon is the right size, but it is not in the right position. Activate
    the Move tool to drag the moon over and center it in the sky. Don''t forget that,
    unless you hold Shift, the Move tool is not capable of grabbing on to a transparent
