- pgno: 335
  md: '# # Wacom Pens and Other Pointing Devices


    Using Wacom pens is a matter of getting the device recognized by X. You must have
    the XFree86 module x86Wacom.so available in order for this to work. It comes with
    most distributions of Xfree86, otherwise you can get it from http://www.levien.com/free/linux_intuos.html.
    You will need to make sure that it is in your modules, which is probably /usr/X11R6/modules.


    In order to get XFree86 with another pointing device, you will need to edit your
    /etc/X11/XFree86 config file. Add is the module in the modules section of the
    config file, like this:


    Section Modules

    Load x86Wacom.so

    EndSection


    Then, X will need to set some parameters for using the module. These are set in
    the Xinput section, in this example:


    Section "Xinput"

    Subsection "WacomStylus"

    Port "/dev/ttyS0"

    DeviceName "Wacom"

    Mode Absolute

    Suppress 15

    EndSubsection

    SubSection "WacomStylus"

    Port "/dev/ttyS0"

    DeviceName "WacomCore"

    Mode Absolute

    AlwaysCore

    Suppress 15

    EndSubsection

    SubSection "WacomCursor"

    Port "/dev/ttyS0"

    DeviceName "CURSOR"

    Mode Absolute

    Suppress 15

    EndSubsection

    SubSection "WacomCursor"

    Port "/dev/ttyS0"

    DeviceName "CursorCore"

    Mode Absolute

    AlwaysCore

    Suppress 15

    EndSubsection

    SubSection "WacomEraser"

    Port "/dev/ttyS0"

    Mode Absolute

    Suppress 15'
  merge: -1
  img_proc: true
