- pgno: 228
  md: '# FIGURE 15.7


    A shadow effect will give the sidebar separated look, as if it''s hovering over
    the background.


    ![](img/0183f053b347a6407a2381be231d0345_228_0.png)


    # FIGURE 15.8


    The sidebar helps to define a style for the page.


    ![](img/0183f053b347a6407a2381be231d0345_228_1.png)


    # Buttons, Bars, and Bullets


    A lot of the graphics you see on Web sites are functional as well as decorative.
    Buttons and bullets are used as links to other pages and sites, whereas bars are
    used to divide and organize sections of a page.


    Use the selection tools to create the right shapes, and then decorate the shapes
    to fit in your look. In Figure 15.9, I''ve selected several shapes to make some
    matching accessories for the sidebar background made previously.


    These shapes are filled with the same pattern that was used for the sidebar. Depth
    can be added by inverting the selections and applying a drop shadow with the x
    and y values set to 0. Then the selection can be inverted back again and have
    a regular drop shadow added, as in Figure 15.10.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# FIGURE 15.9


    These selections will be easily transformed into buttons and bars.


    ![](img/0183f053b347a6407a2381be231d0345_229_0.png)


    # FIGURE 15.10


    Matching the accessories to the background gives a nice clean look.


    You can also try to make buttons and bars with the beveling technique (see the
    section, "Beveled Text" in Hour 14, "Cool Text Effects." That is, bump map a layer
    in the color or pattern of your choice over a layer with a gradient. Depending
    on the gradient used, you can get some very eye-catching shapes this way, as illustrated
    in Figure 15.11.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# FIGURE 15.11


    Interesting beveled shapes can be created using gradients and the bump map filter.


    ![](img/0183f053b347a6407a2381be231d0345_230_0.png)


    # Consoles


    A console is a good way to go if you have a lot of links that you want to make
    buttons for. Basically, it is a container to hold and organize all your buttons,
    kind of like a remote control.


    Open a new canvas, to around 200 × 400. Add a new transparent layer. Use the Rectangle
    selection tool to select an area about 20 pixels from each edge. Now give it rectangular
    selection some rounded corners. Right-click, and choose Select, Grow, and grow
    15 pixels. You should have a selection similar to the one in Figure 15.12.


    # FIGURE 15.12


    Growing the rectangular selection a little changes the sharp corners to semi-rounded
    ones.


    ![](img/0183f053b347a6407a2381be231d0345_230_1.png)'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'A metallic look might be nice for the fill, so use the Golden gradient from
