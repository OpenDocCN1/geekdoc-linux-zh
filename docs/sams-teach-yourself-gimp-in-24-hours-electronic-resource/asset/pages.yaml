    # Lesson 2—Landscape


    Now try a more complex image, this time giving the appearance of a more detailed
    oil painting.


    Open a new image window—give yourself plenty of room. Don''t use a sketch to start
    off this time, that way, you can add sketches of elements as your imagination
    calls for them.


    Because you are doing a landscape, start off by filling in the background with
    a vertical linear gradient going from a dark to light blue (or color of your choice)
    for the basis of a sky. Add a new transparent layer and choose one of the small
    texture brushes to begin a white cloud formation, as in Figure 18.5.


    # FIGURE 18.5


