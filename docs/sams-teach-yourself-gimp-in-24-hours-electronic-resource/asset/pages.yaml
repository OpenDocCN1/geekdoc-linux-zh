    # Screen Shot


    You''ve spent hours and maybe days putting together the world''s greatest X desktop.
    You''ve worked hard putting together a great Enlightenment theme, made some great
    rxvt pixmaps, found the perfect background image, tweaked your GTK theme, and
    now you want to show it off. This plug-in is easy (see Figure 20.17) lets you
    do that, quickly and easily. Using this plug-in is easy. Select an option between
    single window and full screen, set a delay if you like, click OK, and when your
    PC speaker beeps, you''ll have a screen.


    # FIGURE 20.17


    This plug-in provides convenience by allowing you to work with screen shots within
    the GIMP.


    ![](img/0183f053b347a6407a2381be231d0345_293_1.png)


    # Inroot


    Having this plug-in, from a right-click, File, Inroot will set the active image
    as your X background image (known as wallpaper in Windows nomenclature). This
    will not set the image as the permanent background on startup—that is usually
    handled by your window manager—but it is an easy way to preview an image as your
    desktop background (see Figure 20.18).'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# Using More Plug-ins and Extensions


    # FIGURE 20.18


    Setting an image as a temporary root window image.


    ![](img/0183f053b347a6407a2381be231d0345_294_0.png)


    # Crypto Tools


    Yes. You read that correctly. Crypto. The GIMP has a few great plug-ins that allow
    for the encrypting and embedding of files within graphics. Real spy type of stuff.
    You might not have a real need for this, but they are still cool plug-ins nonetheless.


    # Encrypt/Decrypt


    This plug-in (right-click, Filters, Crypto, if you have installed), does exactly
    what the name implies (see Figure 20.19). It will use a phrase key to encrypt
    your favorite image into what appears to be pure garbology. And, of course, only
    the supplied phrase can decrypt it back into recognizable form. I will not supply
    you with any ideas as to what could be useful for, but I will say to my current
    knowledge this GIMP filter is the only application that can effectively decrypt
    these files (well, without a fight, anyway).


    # FIGURE 20.19


    As you can see, an encrypted image leaves no visible clues to what is hidden inside.
    This is almost as cool as my old Captain Crunch decoder ring!


    ![](img/0183f053b347a6407a2381be231d0345_294_1.png)'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'One thing to note with this plug-in: You should encrypt something only after
    you have finished making any changes to it, and then you should only save it in
    a non-lossy graphics format. Yes, this means no JPEGs. (GIFs, TIFs, PNGs, BMPs
    and so forth work just fine, thus.)


    This plug-in is not the strongest or most secure encryption formula out there,
    so don’t count on keeping your secret counterrevolutionary blueprints out of the
    reach of the CIA or NSA, but it is powerful enough to keep them safe from the
    probing eyes of your little sister.


    # Stegano


    Stegano provides a way to embed other files within a graphics file. It’s simple
    enough; just startup this plug-in, click the Browse button, and use the dialog
    box to locate the file you want to embed. Click the Write button, and then save
    it in your favorite non-lossy format (see Figure 20.20).


    Figure 20.20


    Using Stegano is an easy way to transfer one type of file hidden inside another.
    How you would want to use this is entirely up to you.


    ![](img/0183f053b347a6407a2381be231d0345_295_0.png)


    To view a hidden file, open the graphic and this plug-in, click the Read button,
    and it should write the hidden file into your directory.


    This filter will not embed a file that is too large in proportion to your graphic.
    If you get a message that says your file is too big, you will have to use a smaller
    file or larger graphic.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# Using More Plug-ins and Extensions


    # Summary


    Now you''ve played with some plug-ins that do a little more than just distort
    pictures—they allow GIMP to do things it wasn''t really planned or designed to
    do. And it only keeps getting better. It is a good idea to keep your eyes on the
    GIMP Plug-in Registry because there are always new plug-ins, extensions, and filters
    being added.


    One thing to do is find new uses for these plug-ins. In other words, for many
    of these plug-ins, you often have a solution looking for a problem. (How often
    have you had the need to render fractals in the past, for example?) Keep with
    it, and you might be surprised at what is possible with these things—you never
    know when they might be useful.


    # Q&A


    +   - Q When using Gfig, I find that the image I painted does not look very smooth,
    but instead looks somewhat choppy. What can I do?

    - A In the Brushes tab, make sure that you have the brush spacing set to 0.


    # Exercise


    Now that you have more exposure to many of the good plug-ins in the GIMP, your
    task now is to try to determine your favorites and find as many possible uses
    for them as you can. For example, many of these applications can be used in concert
    with such things as special effect images, Web graphics, and photo manipulation.
    Keep your eyes peeled and whenever you apply a technique, try and think if there
    as an easier and more appealing way to accomplish the same thing using one of
    these fancy plug-ins.(For example, I frequently find Gfig to be a worthy substitute
    of the Bézier tool.)


    ![](img/0183f053b347a6407a2381be231d0345_296_0.png)'
  merge: -1
  img_proc: true
