- pgno: 271
  md: '# Q&A


    +   Q When I paint using the Airbrush tool, it sometimes comes out too faint.
    What I am doing wrong?

    Q Remember, the Airbrush functions just as a real live spray would. The slower
    you paint or the longer you hold it in one spot, the more paint is deposited there.

    Q I want to achieve a brush stroke that appears to run out of paint, just as a
    real one would. Can I do this?

    A You can if you are using the Paintbrush tool. Double-click the tool and set
    the Fade Out Out option. (Refer to Hour 4, “Using Brushes and Patterns in Depth,”
    to refresh your memory on how this option works).


    # Exercise


    Practice, practice, practice! Work on your painting techniques. Try to make your
    own original paintings from scratch using the methods described in this hour.
    You might want to practice painting by opening up some simple images—try some
    of drab clip art or black-and-white line art!—and seeing if you can find the right
    brushes to turn them into masterpieces.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# HOUR 19


    # About Plug-ins


    In Hour 12, “Using Filters to Improve or Distort Images,” you learned a little
    plug-ins (in the form of graphics filters, specifically), and how to use them
    to alter your images directly. Now you will spend some time learning about how
    GIMP interacts with plug-ins, what exactly they are, and how you can use them
    to augment your GIMP experience.


    # So, What Exactly Are Plug-ins?


    The GIMP relies on plug-ins for its internal operations. In fact, almost everything
    you do in the GIMP is the direct result of a plug-in at work. This is why GIMP
    was designed.


    Because it''s an Open Source application, development on the GIMP is taking place
    at a mind-blowing pace. New features and elements are added all the time. Therefore,
    in order to satisfy the end user''s appetite for new functions and features, and
    to make things easier for the developer, GIMP was designed from the ground up
    to be a modular application. This means that many things, such as graphics filters,
    file types, small internal applications, can be added to GIMP. They can be written
    as plug-ins, and'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# 254 Hour 19


    can enhance the GIMP directly without the need to reinstall or recompile the entire
    application, at least most of the time. As often as new things are added to the
    GIMP, con- continually recompiling would be a pain.


    This modularity has many benefits. For one, a developer with knowledge about a
    certain kind of application can extend the GIMP relatively easily. For the end
    user, it is fantastic because it means he or she can immediately enjoy new benefits
    without the need to recompile the application or wait for the next release. (In
    the traditional commercial arena, being able to use an added feature or function
    means waiting for another release of the product or purchasing an upgrade.) Therefore,
    an added feature such as support for a new file format, a new type of filter,
    or even a sophisticated internal application, can be enjoyed with little trouble.
    And, official release development of the GIMP can concen- trate on improving stabilizing
    the internals of the application itself, providing a faster and more secure environment
    for these plug-ins to run in.


    This also means it is relatively easy for a large number of people to contribute
    to the GIMP project. And the more people contribute, the more robust the application
    will become. (It''s only at version 1.0 now; imagine how robust the GIMP will
    be a couple of major revisions from now!


    # A WORD ABOUT GIMP DEVELOPMENT


    If you are a little developer and want to try your hand at contributing to GIMP
    develop- ment, there are a few things you can do.


    +   * From the user standpoint, if you run into a bug or find something that doesn''t
    work quite like it''s supposed to, you can always submit it to the GIMP report
    mailing address. Fill out Zach Deane''s bug report format atnhttp://xach.dorknet.org/gimp/news/bugreport.html.

    * Writing plug-ins is the easiest way to contribute to GIMP development, because
    it adds features and functionality without thinking around the core source tree.
    It also doesn''t require official approval from the GIMP developer community at
    large. You simply need to write your plug-in, and then submit it to the plug-in
    registry at http://registry.gimp.org The end user is your quality assurance team-if
    your plug-in doesn''t live up to its expectations, it can be deleted without affecting
    the rest of the GIMP installation. However, if your plug-in is good enough, there
    is a chance that it will become a staple of any good GIMP distribution in the
    future.

    * If you want to dig a little deeper, you can always download the latest developer''s
    source tree and muck around it for a while. The latest, unstable develop- releases
    are available from the GIMP CVS (Concurrent Version System), which is a method
    of version control for software products. Please read here: //://www.gimp.org/devel_ver.html
    for more details. You should also check out the GIMP developer FAQ at http://www.ruu.com/-meo/gimp/faq-dev.html.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# About Plug-ins


    +   Of course, if you do starting your own patches for the core GIMP development
    tree, you will want to start communicating with other GIMP developers and get
    your fantastic patches accepted into the official distribution. This is handled
    through the GIMP mailing list. You can subscribe and unsubscribe from the GIMP
    mailing list at http://www.gimp.org/mailing_list.html. The GIMP development community
    is composed of many different people from all areas of life, with their own ideas
    about how things should work. The GIMP, inheriting the strongest and most practical
    ideas from this pool of knowledge, grows and evolves like a true Darwinian organism—thrives
    on devolution and rivalry. It is really exciting-stuff, even if you only sit back
    and watch it all happen.


    This is somewhat different from the concept of plug-ins in Photoshop. In that
    application, plug-ins are mainly filters and other similar apps that alter and
    create images. The GIMP, a plug-in is anything that can be added to the GIMP without
    affecting the core source tree. This makes the GIMP infinitely scalable, but perhaps
    a bit more obfuscated at times.


    Yes, there are many things that are native to the GIMP itself that are not plug-ins.
    These include the color models, the basic tools, the GTK interface, the Plugin
    API, the base Script-Fu interface, and the core functions as layers, undos, masks,
    antialasing, core dialog boxes, and so on. Everything else is handled by a plug-in
    of some sort. This includes all the filters, extraneous tools, file formats, interfacing
    applications (for scanners, printers, email, and so forth), and many other things.


    # How to Obtain and Install New Plug-ins


    In order to install a new plug-in, you will need to find and compile it. (No binary
    distributions here!) Note that a few of the plug-ins are version-dependent and
    as such they will only work in versions 1.0 or 1.1 of GIMP. This is because the
    plug-ins must communicate with the GIMP directly, and the internals can get drastically
    altered between releases. If you do encounter a plug-in, its documentation should
    tell you everything you will need to know. With smaller, less complex plug-ins,
    you can almost get away with using it with any relatively recent version.


    # Why Compile?


    Again, compiling is the process by which source code is translated into an executable
    binary. And yes, while it would in theory be simpler to distribute plug-ins as
    binaries, this would not quite be the Open Source tradition. Source code offers
    a few benefits: It allows for the easy installation on any number of operating
    systems and'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'processors (not everyone runs Linux or uses an Intel processor), and it makes
    for easy

    patching and bug fixing in the public arena. Trust me, compiling is a good thing,
    and

    even the non-coding newbie get the hang of it after a few trials.


    # Installing the Easy Way


    After you have the source downloaded, you can begin compiling. As mentioned earlier,

    GIMP provides a remarkable tool for accomplishing called gimp-tool. You can use
    this

    tool to compile and install the plug-in only if the source has one .c file. This
    applies

    to most of the simple filters you will encounter. Of course, you should read

    the READMEs that come with any source distribution, but the procedure is usually
    as

    :


    +   - tar -xvf foo.plugin.tar.gz (compress)

    - cd foo (cd directory)

    - gimptool --install-admin foo.c (compile and install)


    gimptool takes care of compiling, installing, and relocating the plug-in for you.
    The pre-

    ceding example illustrates the steps to install a plug-in system-wide, which

    should be done as route. Otherwise, if you want to install the plug-in locally
    only in your

    own.gimp/plug-ins directory (not system-wide) all you need to give gimptool

    --install argument. For any other functionality, the gimp help page should give

    you the answers you need.


    If the plug-in is more complex, that is, has many c source files, makefiles,

    and so forth, you will need to take a more traditional installation route.


    # ./configure && make && make install


    If you''re familiar with UNIX, the preceding headline phrase should be a mantra
    for

    by now. One thing you should know is that your binary is compiled and relocated,

    on the next startup GIMP registers the plug-in in your local pluginrc, which is

    way the GIMP keeps track of which plug-ins are available and their preferences.
    It is

    located in your .gimp directory (.gimp/pluginrc). The system-wide one, of course,
    is

    installation-dependent, but is traditionally in /usr/share/gimp/1/. However, you
    should

    ever find that one of your plug-ins is acting weird, deleting this file in your

    local directory will fix it. GIMP will automatically create a new one on startup).
    In any

    case, editing this file is probably not a good idea.


    When installing complex, involved plug-ins with one source file, there is

    really only one rule: Read the README and INSTALL documents, and follow the direc-

    tions. Depending on the author, the documentation can range from informative to
    terse'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# About Plug-ins


    nearly non-existent. Usually, though, a little perusal through the directory will
    turn up something, and after you''ve done a few, it seems that most of them install
    pretty much the same way. If you do have problems, feel free to ask the world''s
    most responsive support team—a newsgroup, a mailing list, or that 12-year-old
    Linux hacker down the street. You should be back in business in no time. Also,
    it might be good to hit up the GIMP newsgroups and mailing lists; they tend to
    be very helpful.


    +   - Newsgroup—com.graphics.apps.gimp

    - Mailing list—http://www.gimp.org/mailing_list.html


    # The DB Browser


    This plug-in keeps a browsable database of all available installed plug-ins, extensions,
    and internal functions in the GIMP. It can tell you the author, the version and
    date, and other such information. It can be very helpful when you''re trying to
    determine what your GIMP installation has available, or at least seems to look
    like now and then just to get a glimpse into what makes GIMP tick (short of looking
    at source).


    You can find DB Browser under Xtns, DB Browser. It might take a moment to initialize,
    but once you open it, you should see that what resembles is pictured in Figure
    19.1.


    # FIGURE 19.1


    ![](img/0183f053b347a6407a2381be231d0345_276_0.png)


    The DB gives gives you searchable list of everything that is registered in the
    GIMP


    You have two options: Here you can browse the database to you or use the Search
    by Name (refer to Figure 19.1) or Search by Blurb (see Figure 19.2) functions
    to find what you''re looking for. Simply enter search by plug-in or function (for
    example, blur), and you should be able to find what you''re looking for—as long
    as you do have the target plug-in installed and running.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# FIGURE 19.2


    Search by Blurb gives you instant access to everything in the DB.


    ![](img/0183f053b347a6407a2381be231d0345_277_0.png)


    As you can see, after finding your listing, the DB Browser lists everything about
    the plug-in in question. Finding this kind of information can be very useful for
    many things, including finding an author''s email so as to pose a question, make
    a suggestion, point out a bug, or search a bug fix. (I do not encourage bothering
    others with questions that can easily be answered elsewhere, however.) You can
    also use it as a scriptmaster''s tool by searching for a particular function that
    a Script-Fu script is calling, which is great for finding out exactly those scripts
    are doing behind the scenes or for finding new things to try out with the GIMP.


    In any case, the database browser makes finding information pertaining to your
    GIMP installation snap.


    # Summary


    Now that you have the resources available, you should have no problems getting
    GIMP to do more than it had done before. Go to the GIMP Plug-in Registry (http://registry.gimp.org/)
    and download and install as many good plug-ins as you can.


    When you play with this, keep in mind that your directory structure might differ
    than the one illustrated in this book (that is, your administrator might have
    installed it in /usr/local or even /opt...). Also keep in mind that some plug-ins
    have special, needs, such as file dependencies or they might need to be installed
    as root. Therefore, I cannot stress this enough: README is your friend.


    # Q&A


    +   - I get an (insert error here) error during the make stage. What do I do?

    - Make sure the gtk and glib libraries are the latest compatible version, and
    make sure that the plug-in version is the latest available as. If these two criteria
    are met and you are still having problems, it might be that your makefile is'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'looking for libraries that aren''t in their proper location. You should compare
    notes between what the makefile says and where files are actually located. Otherwise,
    you might have a good question for GIMP gurus to answer.


    +   Q My source has no makefile and no instructions! What do I do?


    +    You can try a straight compile, or create a makefile. This is a little beyond
    the scope of the book, and it can be a little disconcerting to those with little
    or no programming experience, doing this once or twice will make the process more
    bearable.


    If you run across a source package like this and you still want to pursue it (for-fortunately
    most packages are packaged a little better), the best thing to do is to get online
    and ask questions. You will find someone willing to help you. There are many good
    tutorials and references for this situation. Before that the few plug-ins packaged
    in this manner tend to be new and experimental, so you are somewhat on your own.
    (But then again, life on the bleeding edge can be rewarding in and of itself).


    # # Exercise


    In the next hour you will do a little exploring into some of these more complex
    plug-ins. After that, I have little doubt that you will be inspired to find, download,
    and compile as many of these great plug-ins as you can. Remember that for every
    plug-in you touch on, there are at least 10 more out there that are just as neat,
    if not better. Go get ''em!


    As with anything, the best way to approach this if you''ve never done it before
    is to start small and simple. Go to the plug-in registry online and find what
    would look to be simple, uncomplicated filters. Use gimtool to compile and install
    them. Do this a few times, moving up the ladder to some of the larger and more
    complex plug-ins, before you realize it, you will soon have installed every GIMP
    plug-in there is.


    ![](img/0183f053b347a6407a2381be231d0345_278_0.png)'
  merge: -1
