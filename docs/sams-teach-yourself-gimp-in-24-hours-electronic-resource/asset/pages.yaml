  md: '![](img/0183f053b347a6407a2381be231d0345_298_0.png)


    # HOUR 21


    # What the Heck Is Script-Fu?


    Script-Fu adds a tremendous powerhouse of additional functionality to GIMP by
    enabling you to automate and group together some of your favorite and most often
    used effects into GIMP-executable scripts. This is a very useful feature, especially
    if you happen to have a favorite effect that requires the application of a number
    of various steps (that take a while to do by hand).


    If the effect is cool enough, the benefit of writing a script is two-fold. First,
    you won''t have to go through every step to re-create the effect again, and second,
    in the open source tradition, you will probably post your fantastic scripts on
    your home page for the entire world to download and use. This is where the power
    of Script-Fu is most easily observed: By becoming a Script-Fu collector, you will
    gain a potentially massive library of quick-and-easy effects that can be remarkably
    complex in nature and difficult to reproduce otherwise.


    Script-Fu scripts are generally written in a language known as SCHEME. However,
    if you are more comfortable in another programming language'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'environment, GIMP also has plug-in interfaces available for the use of Perl
    and a few other languages for your scripting needs. Given a little fortitude and
    patience, there''s almost nothing you can''t accomplish with a well-written script!


    Because Script-Fu employs the use of a fully-fledged scripting language, the possibilities
    this tool gives are limitless. These scripts appear in the GIMP not as files with
    a few sequential instructions, but with a graphical front-end in the GIMP style.
    In fact, with the knowledge of what exactly Script-Fu is, these scripts appear
    to the end user just as any GIMP plug-in. They truly are a blessing.


    # Script-Fu


    Now that you know little about Script-Fu, you can start using some scripts. By
    default, GIMP comes with a plethora of great scripts to start messing with right,
    but of course you will need to download and try new ones. The first thing to know
    is that Script-Fu scripts are stored in simple text files with an S extension.
    Therefore, installing a new script is as easy as downloading one into your ~/.gimp/scripts
    directory. Depending on what the script is supposed to do, it should be categorized
    somewhere under Xtns. Script-Fu in the tool box (or Script-Fu from the right-click
    menu). The general rule of thumb is that scripts that alter an existing image
    are usually stored under the right-click menu, whereas scripts that generate new
    graphics from scratch are stored in the Xtns menu. If you are wondering where
    to acquire more of these scripts, gimp.org has references to many Scriptmaster''s
    resources.


    # Script-Fu Examples


    The first scripts you''ll try out will generate new graphics from scratch, so
    you can see how they work. One of the best things to use Script-Fu for is text
    effects, like those used as Web page headers and so forth; and Script-Fu has gained
    quite a measure of notoriety for its utility with this purpose in mind. By setting
    a few variables, such as font properties, color, texture, background, and so forth,
    you can use these scripts to whip up some awesome text logos with absolutely no
    work. Script-Fu is indeed the Lazymaster''s dream you can come out looking like
    a pro in just a few seconds. It is considered cheating to use this method to create
    difficult logos with little effort? Maybe, but it is fun nonetheless.


    # Text Effects—Quick and Easy


    To use your first Script-Fu text logo, try out one named Basic 1, because it is
    one of the simpler effects.


    First, go to Xtns, Script-Fu, Text Logos, Basic 1. You''ll see the dialog box
    pop-up now, as shown then choose the appropriate options, such as font size,'
  merge: -1
  img_proc: true
