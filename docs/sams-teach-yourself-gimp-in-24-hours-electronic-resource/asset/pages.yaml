- pgno: 1
  md: '# SAMS Teach Yourself


    # GIMP in 24 Hours


    | HOUR | TITLE | CONTENT |

    |---|---|--|

    | 1 | Installation and Configuration | Install the GIMP and get it running smoothly
    |

    | 2 | Getting Started | Begin learning to use the GIMP effectively |

    | 3 | Basic GIMP Tools | Learn how to use the basic tool set in the GIMP |

    | 4 | Using Brushes and Patterns in Depth | Concentrate on the GIMP''s wide array
    of brushes and patterns |

    | 5 | Working with Selections | Utilize the various selections to select a portion
    of an image |

    | 6 | Transformations | Move, zoom/magnify, transform, and flip images |

    | 7 | Working with Color | Work with color effectively in digital format |

    | 8 | Introduction to Layers | Learn the fundamental steps of layering |

    | 9 | Hands-on Layering | Combine layering with blend modes |

    | 10 | Using Masks | Apply and edit images with masks |

    | 11 | Special Effects | Make your own special effects |

    | 12 | Using Filters to Improve or Distort Images | Use filters to enhance and
    modify images |

    | 13 | Artistic Filters | Explore eccentric and exciting effects with filters
    |

    | 14 | Cool Text Effects | Turn simple text into works of art |

    | 15 | Web Graphics | Create images optimized for the Web |

    | 16 | Photo Compositing | Turn photographs into a collage or photo-montage |

    | 17 | Photo Restoration and Enhancement | Correct flaws and mistakes in photographs
    |

    | 18 | Digital Painting | Create similar to watercolor and oil paintings |

    | 19 | About Plug-ins | Learn about plug-ins and how the GIMP uses them |

    | 20 | Using Plug-ins and Extensions | Become familiar with more complex plug-ins
    for the GIMP |

    | 21 | What the Heck is Script-Fu? | Add functionality to the GIMP by writing
    custom scripts with Script-Fu |

    | 22 | More with Script-Fu | Explore more specialized uses of Script-Fu |

    | 23 | Animation | Learn techniques for creating animation |

    | 24 | Using Peripherals with Linux | Add goodies as digital scanners, digital
    cameras, color printers, and pointing devices |'
  merge: -1
  img_proc: true
- pgno: 2
  md: '# Sams Teach Yourself approach in 24 Hours


    Sams Teach Yourself in 24 Hours provide a proven step-by-step approach that works
    for you. In just 24 sessions of one hour or less, you tackle every task you need
    to get the results you want. Our experienced authors present the most accurate
    information to get you reliable answers—fast!


    # GIMP


    The GIMP Toolbar


    +   - Select rectangular regions

    - Select elliptical regions

    - Select contiguous regions

    - Select regions using Bézier curves

    - Move layers and selections

    - Zoom in and out

    - Transform the layer or selection

    - Flip the layer or selection

    - Pick colors from the image

    - Fill with a color or pattern

    - Draw sharp pencil strokes

    - Paint fuzzy brush strokes

    - Airbrush with variable brush

    - Paint using patterns or image regions

    - Foreground color

    - Default foreground and background colors


    ![](img/0183f053b347a6407a2381be231d0345_2_0.png)


    +   - Select hand-drawn regions


    +   - Select shapes from image


    +   - Crop the image


    +   - Add text to the image


    +   - Fill with a color gradient


    +   - Erase to background or transparency


    +   - Blur or sharpen


    +   - Switch foreground and background colors


    +   - Background color'
