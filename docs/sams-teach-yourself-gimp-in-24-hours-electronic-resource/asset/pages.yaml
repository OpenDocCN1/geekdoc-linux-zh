    # Summary


    In this hour, you got a taste of what can be achieved by learning about the blend
    modes and how you can combine them with layering techniques for some interesting
    results.


    The time you have put in to understand layering will be invaluable to you in the
    following hours and, as you will soon discover, you will put this knowledge to
    use time and time again.


    # Q&A


    +   - Some of my layer options are grayed out. What gives?

    - An option that is grayed out in the Layer menu means that for one reason another,
    the option is not accessible. Usually it is for an obvious reason, such as the
    Raise or Lower Layer options will not be accessible unless there is another layer
    to raise or lower from it.

    - After adding a new transparent layer to my image, I tried to use the Bucket
    Fill tool to add to the layer, but nothing happened.

    - In or out of layers, the Bucket Fill tool will not fill a totally transparent
    area that is not selected. Just use a selection to select the entire area of the
    layer, or right-click and select Image, Select All, and the tool can then be used
    to fill the selected layer with a color or pattern of your choice.'
