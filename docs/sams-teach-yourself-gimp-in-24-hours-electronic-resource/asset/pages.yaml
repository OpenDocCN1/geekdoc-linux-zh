- pgno: 20
  md: '# Introduction


    Because you''re undoubtedly wondering by now, GIMP is an acronym for GNU Image
    Manipulation Program. And it''s more than just its name that sets this application
    apart from the norm. The GIMP itself is a tremendously sophisticated and powerful
    image editing program written for UNIX and the X Window environment. It is used
    for editing and creating digital graphics, and is similar in function and design
    to Adobe Photoshop, Core Draw, Paint Shop Pro, and other popular applications,
    with the added benefit that it happens to be free, and it runs on the world''s
    greatest PC operating system, Linux. Furthermore, its modular design allows for
    continual addition of functionality—it will never become an abandoned project.
    It has an unequivocally fantastic list of features that tend make even the most
    hardened hacker puzzle and delight at just incredibly functional and polished
    GIMP really is. It is extremely utilitarian, fast, feature-laden, stable, expandable,
    and is possibly the greatest thing since sliced bread (and the Linux kernel).
    In short, prepare to be astonished and amazed!


    # A Little Background


    The GIMP began in 1995 as a small class project by two students at the University
    of California, Berkeley: Peter Mathis and Spencer Kimball. It was released to
    the public under the GNU GPL (General Public License), and, due to the contributions
    of many coders and thousands of testers, has subsequently evolved beyond a simple
    class project into the fully-fledged graphics-editing suite it is. GIMP is a relatively
    young program, now just developing into maturity, and now that it has truly arrived,
    its development is occurring at an increasingly accelerated rate. In fact, by
    the time this book hits the presses, there will likely be new features, additional
    functionality, and perhaps an entirely updated version of the GIMP available for
    download from FTP sites around the globe. Welcome to the wonderful world of Open
    Source software! (May the source be with you!)


    The most important aspect of the GIMP is not necessarily its power or utility
    as a graphics (although that is, of course, what you want and expect from well-coded
    software), but that it is in free software—released under the GPL as defined by
    the Free Software Foundation. This means that it is not merely in terms of cost,
    but also in the sense of freedom—end users are at liberty to alter and distribute
    the source code they see it. This is because the GNU GPL ensures that the source
    code of the application is always free, without restriction, to anyone with the
    inclination to take a peek. This adds tremendous momentum to the development of
    software projects such as Linux, the many FSF projects, Apache, KDE, GNOME, Mozilla,
    and the'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Sams Teach Yourself GIMP in 24 Hours


    GIMP. It allows developers from all over the Internet to view, study, alter, revise,
    and improve the code in a dynamic way, with celery and quality that is simply
    unmatched by private companies alone, which are staffed with limited numbers of
    developers and motivated by immediate marketability. In short, Open Source software
    generates the most stable and easily improved software in the world. And, GIMP
    stands as a shining testament to this fundamental truth.


    GIMP binaries are currently available for Solaris, SunOS, HP-UX, IRIX, Linux,
    and FreeBSD, and possibly may other relatively modern UNIX variant you can name.
    There is also an OS/2 port available, a Microsoft Windows port that is workable,
    but still in heavy development, and a BeOS port is churning under the rumor mill.
    As of yet, there are no plans to port GIMP to the Macintosh. (Sorry, guys.)


    # Who This Book Is For


    This book assumes that you are running and comfortable with the Linux operating
    system. (Most UNIX variants will work as well, but they''re not as much as running
    Linux, in the author''s most humble opinion). It is suggested that you take the
    time to familiarize yourself with your computer''s operating system before attempting
    to tackle the GIMP for the first time.


    As far as the GIMP goes, the process is the same as with any other robust application:
    the best way to learn is to simply play with it! I suggest that you take time
    between hours to push all the buttons, try new things out, and get a feel for
    the software (who could resist doing that anyway?). This book is designed as an
    addendum and an aid to the learning process, with some time and effort, you''ll
    be a GIMP guru by the time you''re finished.


    # Conventions Used in This Book


    This book is designed to teach you topics in one-hour sessions. All the books
    in the Sams Teach Yourself series enable you to start working and become productive
    with the product as quickly as possible. This book will do that for you!


    Each hour, or session, starts with a quick overview of the topic to inform you
    of what to expect in that lesson. The overview helps you determine the nature
    of the lesson and whether the lesson is relevant to your needs.


    Each hour has a main section that discusses the topic in a clear, concise manner
    by breaking the topic into logical parts and explaining each component clearly.
    You''ll also find examples and illustrations to help you understand and master
    the material under consideration.'
  merge: -1
  img_proc: true
