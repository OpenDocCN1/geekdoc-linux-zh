- pgno: 152
  md: '# HOUR 10


    # Using Masks


    Wow! You''re not even halfway through the book yet, and you''re applying layers
    like an old pro.


    By now you are probably really getting hooked on the total versatility that layering
    offers for editing your images.


    This hour will teach you few final tricks involving layering, namely layer masks
    and channels. Yeah, you heard me right, there are even cool things you can do
    using layers! You will learn how those mysterious layer masks work and follow
    through with some tutorials to apply what you''ve learned, including:


    +   - Gradient masks

    - Photo edge masks

    - Text masks'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# What Are Masks?


    Think of a party or Halloween mask. They''re used to cover or conceal parts of
    your face, but can be removed at any time, revealing your identity by uncovering
    the parts of your face that were hidden. A layer mask is the same. It is used
    to cover certain parts of your layer. It can enable you to hide or reveal portions
    of your image and apply special effects to those portions.


    In a way, a selection is somewhat like a mask. You can select a specific area
    and the rest of the image will be in essence masked off or protected from any
    applied changes. Masks take this capability a step further by allowing you to
    apply changes to a layer based on the alpha values of the layer.


    I like to think of a mask as a custom stencil. They are basically grayscale alpha
    channels that you can attach to a layer. When changes are applied to a layer using
    a mask, the black parts of the mask are viewed as totally open to visibility,
    white portions are totally immune, and various shades of gray allow various degrees
    of the change to be visible.


    # Creating Masks


    Masks can be created from images, selections, gradients, or entirely from scratch.
    Here I will use a simple image to illustrate basic masking.


    Open an image, (see Figure 10.1), and right-click on it to bring up the Layer
    dialog box and add a new layer in white.


    # Figure 10.1


    The original image before the masking process begins.


    ![](img/0183f053b347a6407a2381be231d0345_153_0.png)'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'Next, I right click the thumbnail image of my new layer to bring up the Layer
    Dialog menu and click Add Mask. This brings up the Add Mask Options box (see Figure
    10.2).


    # Figure 10.2


    Three options available for the initial mask.


    ![](img/0183f053b347a6407a2381be231d0345_154_0.png)


    The mask options box contains three choices to start the mask with:


    +   * White (Full Opacity)—By choosing white , you get a totally opaque mask.
    It completely covers your layer in white until it is edited.

    * Black (Full Transparency)—This option creates the mask in black, which appears
    as totally transparent; you will be able to see your layer through it.

    * Layer’s Alpha Channel—This means that the mask will be created out of the graysed
    version of alpha values in the layer.


    For this example, I have chosen to create a white mask, which is also the default
    option. As you will see in Figure 10.3, a new thumbnail image indicating the mask
    appears in the Layer dialog window to the right of the layer thumbnail. Because
    I haven’t begun to edit the mask, it appears as solid white.


    New layer


    # Figure 10.3


    A thumbnail image of the mask appears next to the layer thumbnail.


    ![](img/0183f053b347a6407a2381be231d0345_154_1.png)


    Layer mask'
