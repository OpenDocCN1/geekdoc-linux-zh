- pgno: 39
  md: 'You should now also see the GIMP toolbox on your desktop. This is the dialog
    box that contains icons representing the 21 most common image editing tools.


    # The GIMP Interface


    Before beginning on an image, one of the first things you will want to do is familiarize
    yourself with the basic interface.


    The GIMP toolbox dialog, as pictured in Figure 2.5, is the single most important
    element in the entire program. From it, you will gain access to all your graphics
    files and the most essential controls. The first thing you will notice, if you''ve
    used other popular applications, is that this toolbox works in the same way you
    expect. The GIMP toolbox contains the controls for 21 of the most basic and essential
    of graphics editing tools, as well as the two main menus (File and Xns) and the
    Foreground/Background Selection box.


    ![](img/0183f053b347a6407a2381be231d0345_39_0.png)


    # Creating a New File


    Obviously, the most common task in dealing with graphics is to create, open, and
    edit files. In fact, the GIMP doesn''t even automatically open a new blank image
    for you; it assumes that you will primarily be altering existing graphics. This
    is where the first thing you will do is to go to the File menu and click New.
    You will then be greeted with the New Image dialog box, as shown in Figure 2.6.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Getting Started


    # FIGURE 2.6


    The New Image dialog box creates an empty canvas from which to work.


    ![](img/0183f053b347a6407a2381be231d0345_40_0.png)


    # File Size


    NEW TERM


    In the top portion of the New Image dialog box, the width and height options are
    visible. You can specify the size for your new image here. The GIMP always measures
    image sizes in pixels, which are, of course, the singular picture elements make
    up your digital display.


    # Image Type


    The middle portion of the dialog box consists of two image types pertaining to
    color depth. RGB (referring to full color) and grayscale. It is almost wise to
    create an image in full color, because it can be reduced to any number of colors
    or grayscaled later on. (Certain GIMP functions will only work on full colors.)


    # Fill Type


    Fill type refers to the background color of the image you are working with. Background
    is the color that is the second one in the Foreground/Background Color Selector
    on the toolbox. This defaults to white, but it can be any color you choose. Next,
    the White option is pretty self-explanatory. And finally, the Transparent option
    allows you to create an image with a transparent (invisible) background, such
    as the kind found in transparent GIFs.


    After you click OK, your new canvas will appear. You can, of course, have more
    than one image open in the GIMP at any given time.


    # Opening Files


    Opening files works in much the same way as creating new ones. First, go to the
    File, Open menu. The file selector box is pretty easy to follow (see Figure 2.7).
    Essentially, listings of your directories are on the left, and are listed on the
    right. You will notice that at the top, three option buttons allow you to create
    directories, delete, or rename files as well. (This can come in handy times.)'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# FIGURE 2.7


    The Load dialog box shows a listing of the files on your disk.


    ![](img/0183f053b347a6407a2381be231d0345_41_0.png)


    In the directories listed on the left, you will see two directory representations
    you might be unfamiliar with: ./ and ..../ refers to the directory you are currently
    in. Double-clicking it will allow the contents of the working directory to be
    refreshed, which is good if you happened to have changed the contents of the directory
    while the dialog box is open. The ../ option, even more importantly, allows you
    to go back one directory into the one containing the directory you''re in. Sound
    confusing? You will just have to try it out and see. (For reference, if you''re
    from a Windows background, .. functions exactly the same way as the Up icon in
    Windows Explorer.)


    Beyond the directory listings, you will see a Detect File Type drop-down menu.
    Most of the time, this can be left on Automatic with no problems. However, in
    the event that GIMP fails to recognize the file you are trying to open, you might
    need to tell GIMP exactly what type of file it is by selecting it in the Detect
    File menu.


    # File Formats


    So, what kind of files can the GIMP deal with? The GIMP can open and save just
    any file format you could ever care to use, and then some.'
  merge: -1
  img_proc: true
