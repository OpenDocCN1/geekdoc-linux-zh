- pgno: 27
  md: '# System Requirements for Running GIMP


    In order to successfully install and run GIMP 1.0, the following items are required:


    +   - A working UNIX variant (Linux, Solaris, HP-UX, FreeBSD, OpenBSD, AIX, DEC
    UNIX, IRIX, and so on)

    - A working implementation of the X Window System (X11R5 or better—preferably
    X11R6)

    - The GNU C compiler or equivalent

    - GTK 1.0.1 or higher

    - The latest graphics libraries (libjpeg, libpng, libtiff, libxpm, libjpeg, libz,
    and so on)

    - Sufficient hardware (on a PC, this would probably mean at the very least 486
    with 16+MB of RAM)

    - At least 20MB of hard drive space for minimal installation (100MB for a full
    compile and debugging session) with room to spare (if you plan on getting any
    work done


    # About GIMP


    GTK is short for the GIMP ToolKit. It is a vital and required component of the
    GIMP—as it is the GUI toolkit on which the GIMP is built. (In case you''re wondering,
    a toolkit is more or less any library that draws the "widgets" for a graphical
    application—scroll-bars, buttons, menus, check boxes, and so on. UNIX has traditionally
    had many different toolkits to choose from, with varying degrees of simplicity
    or robustness, depending on the needs of the programmer.) Originally, the GIMP
    used Motif as the toolkit library of, but the creators of GIMP created GTK as
    a more modern and workable alternative to the commercially licensed and developmentally
    repressed Motif. GTK is clean, powerful, efficient, and aesthetically pleasing
    (to me, at least). It is now being used for many other applications, as well as
    the GNOME desktop project.


    As of this writing, it is best to install only the stable series of GTK for use
    with GIMP (that is, the 1.0 series as opposed to the developmental 1.1 series).
    You cannot compile GIMP 1.0 with GTK 1.1+ (which is needed for the latest releases
    of GNOME). As of now, as with anything in the Open Source community (free software
    community, if you prefer), this is likely to change very rapidly—perhaps even
    by the time this book hits the shelves this will no longer be an issue, because
    GNOME is not using the currently developmental version of GIMP. So, you will want
    to check out http://www.gtk.org/ and http://www.gimp.org/ for the most current,
    up-to-date details.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Installation and Configuration


    # Graphics Libraries


    Your operating system (OS) installation, if installed recently or well maintained,
    is likely to have fairly up-to-date graphics libraries readily available, but
    you will want to make sure you have installed all from the latest versions—to
    make for more stability and less headaches in the installation process. The most
    recent libraries, in source form and various packaged formats, are provided on
    the CD-ROM. Otherwise, you can find them at many FTP mirror sites worldwide, such
    as ftp://ftp.x.org/contrib/libraries/ and ftp://ftp.gimp.org/pub/gimp/libs/. Here
    is a checklist:


    +   * aalib 1.2 or later.

    * xdelta .20 or later.

    * libpng 1.0.1 or later.

    * libxmpx 4.7 or later.

    * libtiff 3.4 or later.

    * libmempeg 1.2.1 or later.

    * libjpeg 6b or later.

    * zlib 1.1.2 or later.


    ImageMagick (not really required, but it includes support for many file formats,
    and some very handy utilities as well) can be found at http://www.wizards.dupont.com/cristy/ImageMagick.html.


    # Other Things


    In addition to what is required, you will likely want to have these things installed
    as:


    +   * XV–XV is an image viewer/editor that is a good tool for use in concert with
    the GIMP. Being nearly a staple of any standard X environment, XV is probably
    already installed. If you not, you can grab it at any Linux-central FTP site.

    * SANE—You’ll need this if you want to use a scanner from within the GIMP. SANE
    can be found at http://www.mostang.com/sane/. Using a SANE scanner within GIMP
    is a real joy.

    * gzip and bzip2—Enables internal file compression.

    G zip and bzip2 are file formats, such as zip or StuffIt files. GIMP allows for
    the direct compression/decompression of graphics files within the GIMP environment.
    This is a really handy feature, especially if you find yourself passing unfinished
    rounds online or over SneakerNet (carrying flops on foot). They can be snagged
    at http://www.gnu.org/ and http://www.muraoa.demon.co.uk/.


    ![](img/0183f053b347a6407a2381be231d0345_28_0.png)'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'If you choose to compile, GIMP has been designed to be a compiler-friendly

    (ANSI C) as possible. However, in reality nothing compiles the GIMP as pain-

    lessly as the trusty GNU C compiler (and variants), as the proprietary compil-

    ers might not have all the features necessary to compile the GIMP, though

    should. You might want to check and see if you have the gcc compiler

    installed. (Issue a gcc -v). If not, you might need to ask yourself why the

    neck not! Obtain it from http://www.gnu.org/software/gcc/gcc.html.


    ![](img/0183f053b347a6407a2381be231d0345_29_0.png)


    # Installing GIMP


    The following sections contain instructions for installing GIMP on your system.
    The first

    thing to do in approaching GIMP installation is to determine which installation
    method

    you want to use. Depending on your situation, there are a few different ways to
    go about

    installing GIMP.


    # Binary Installation


    If you want to get the GIMP up and running as quickly and painlessly as poss-

    ble, binary installation is by far the best way to go. (Binary is another term
    for

    executable program.) This means that you will install the program into its proper

    place, and then run it.


    > NEW TERM


    Note that the binaries on the CD-ROM are for Linux 2.0+, Solaris, and IRIX

    only. If you are running another platform, you will need to get the binaries

    elsewhere, or compile the source code on your machine.


    ![](img/0183f053b347a6407a2381be231d0345_29_1.png)


    There are generally two main ways to go about a binary installation: the standard
    way

    by using a package manager.


    # The Standard Way


    The standard way to go about a binary installation is to grab the program in the
    form

    of compressed archive (usually a tar.gz file), decompress the archive (tar -xzvf
    *.tar.gz),

    and put the files where they need to go according to the documentation. The GIMP

    for Solaris on the CD-ROM is packaged in this manner.


    # Using RPM


    Another popular way to do this is using RPM—the Red Hat Package Manager. This

    program, which is available by default on the Red Hat, Caldera, and S.u.S.E distributions'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Installation and Configuration


    available for any UNIX platform, takes care of installation issues for you. It
    takes any file compacted into RPM format, installs it, and puts everything where
    it needs to go. Installation and upgrading are greatly simplified, because all
    the details to where things are taken care of you. (This is particularly hard
    for uninstalling software.) It can also retain your configuration files, so that
    customizations are not lost during upgrades. One little command and you''re finished.


    There are other good package managers out there as well, the Debian distribution''s
    DEB format and Stampede''s SLP format. These should work much the same way as
    RPM.


    # Binary Installation for RPM Enabled Systems


    You can find GIMP binaries on the CD-ROM in the RPM format under the /gimp/RPM/
    directory. As root, simply change into the directory reflecting your form of choice
    (that is, /mnm/gimp/RPM/) and type the following at:


    ```

    -Uhvh gimp-1.0.2.i386.rpm

    -Uhvh gimp-devel-1.0.2.i386.rpm

    -Uhvh gimp-data-extras.1.0.2.i386.rpm

    -Uhvh gimp-plugins-uninstall.-1.0.2.i386.rpm

    ```


    This will be followed by a success of hashes (#) indicating the installation is
    in progress. Pending no error messages, you should be ready to run the GIMP. Nice
    and simple, won''t you see?


    # RPM Troubleshooting Quick Reference


    +   I need a dependency not found error.


    A This means that the installing package was looking for a required file or library
    that was not there. You will need to install/upgrade any packages containing the
    files you need. This might require a little investigation on your part. if the
    error says libjpeg.so.1 - dependency not found, you can deduce from this there
    is a problem with the libjpeg package. It''s probably misplaced, not installed,
    or is an outdated version. You should go to any one of Linux FTP sites to download/install
    the latest libjpeg package to reconcile the problem.


    Although most of the time these dependency issues are pretty to resolve, sometimes
    it is not quite so to deduce what package contains the missing file at merely
    firstly glance. But, not to worry; most of the time you can find out where the
    file belongs by way of a little research. After checking the newsgroups or mailing
    lists, someone will have run into the same thing and can tell you what are missing.
    These resources are always timely, accurate, and quick to respond. (You''ll be
    surprised.)


    ![](img/0183f053b347a6407a2381be231d0345_30_0.png)'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Q That didn''t work. After installing the latest necessary packages, I will
    still get the same error.


    A Assuming the problem is associated with library dependencies (lib*,so), you
    might need to add the directory containing the said lib to the library path. You
    do this by editing /etc/ld.so.conf and adding the string /usr/local/lib (or wherever
    the library resides). Then run ldconfig and you should be set.


    Otherwise, you might need to add the directory to your LD_LIBRARY_PATH variable
    in your .bashrc (or equivalent) if you do not have administrative privileges.


    Every once in a while, older versions of lib might be installed in a different
    directory, such as /usr/lib, thereby causing confusion. You might need to completely
    uninstall all the older library packages before installing the new ones.


    Q I get undefined symbol: register frame info errors when trying to run the GIMP.


    A This is caused by running a gcc-compiled GIMP with egcs-compiled graphics libraries
    (as can be the case when upgrading the GIMP in Red Hat 5.1). You will need to
    recompile GIMP with egcs, or update all the RPM packages, including graphics libraries
    and gtk, for consistency (The binaries in /gimp/RPMS/ on the CD-ROM are compiled
    uniformly).


    # Source Installation


    The other way to install any Open Source application is to compile the source
    code from scratch. Source code is the programming text that compiles into an executable
    file. On traditional PC operating systems, source code is rarely available to
    the public, so the concept might cause confusion for new users. You will want
    to compile code from scratch if


    +   - You are running a UNIX platform for which there are no precompiled binaries
    available.


    +   - You have a home-rolled custom installation and you want to make a really
    clean and fully compatible installation.


    +   - You want to apply patches (updates) without downloading the entire installafion
    source tree over and again.


    +   - You want to have on this stuff for fun.


    For a beginning Linux user, compiling the GIMP is probably not the easiest undertaking
    there. (It is usually best to start on small projects to familiarize yourself
    with dealing source code). The GIMP is quite a large and complex application.
    However, you don''t have to be a hardened UNIX hacker in order to compile GIMP
    successfully...you'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Installation and Configuration


    simply need to follow the instructions carefully, read the READMEs, and be willing
    to do a little research if you run into trouble.


    The source code on the CD-ROM is available in tar.gz format as well as in RPM
    format. The source RPMs allow you to compile the source code from scratch, and
    then build binary RPMs for installation (to keep things nice and tidy, and easy
    to upgrade/uninstall).


    This section describes the basic steps needed to compile and install the GIMP
    from the source packages—it should be pretty uniform across platforms. However,
    if you run into trouble compiling GIMP on a non-Linux platform, you should consult
    the GIMP lists and newsgroups. There have been a few mild issues with different
    compilers on different platforms, although they are fairly simple to remedy.


    # Installing and Compiling from the Source Packages


    Installing and compiling the GIMP from the source distribution should work roughly
    the same in all UNIX-like platforms. To compile the sources, you must do the following
    as the root user:


    +   Compile and install GTK:

    cp /mnt/cdrom/gtk/src/gtk-1.0.7.tar.gz /usr/local/src

    (or snag it from ftp://ftp.gimp.org/pub/gtk/)

    tar -xvf gtk-1.0.7.tar.gz

    cd ./gtk-1.0.7

    Read the Readme file: vi README.

    (Substitute pico, emacs, or whatever text editor you use for vi if necessary.)

    ./configure

    make

    make install

    Make sure all the appropriate graphics libraries are installed (Updates can be
    found in /mnt/cdrom/gimp/libs/src. Unpack the them and read the appropriate README
    files).\nCopy the source package of GIMP from the CD-ROM to a suitable compiling
    spot:

    cp /mnt/cdrom/gimp/src/gimp-1.0.2.tar.gz /usr/local/src

    Alternatively, you can grab the latest version of the GIMP

    ftp://ftp.gimp.org/pub/gimp/

    Decompress the source package.

    tar -xvf gimp-1.0.2.tar.gz

    cd ./gimp-1.0.2'
  merge: -1
