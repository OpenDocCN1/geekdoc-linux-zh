- pgno: 164
  md: '![](img/0183f053b347a6407a2381be231d0345_164_0.png)


    # HOUR 11


    # Special Effects


    The first part of this book has been devoted to the intrinsic nature of the GIMP,
    how it works, and how you can find your way around to recognize and use the basic
    tools and functions required to get the job done.


    Because you''ve studied so hard and accomplished so much in such a short time,
    I think you deserve a break, so for now, and essentially for the next few hours,
    consider that the bell has rung and recess has begun—have fun with graphics!


    This hour, you will look at an assortment of special effects that can be easily
    performed with the aid of the basic GIMP tools and a little imagination.


    # Tips and Tricks


    What I mean by special effects is the art of creating or adding some distinguishing
    characteristic to an image, whether to give the appearance of a real-life object
    or just to achieve something that looks cool. The following is a list of a few
    things to keep in mind when you are thinking about special effects.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# 146


    # Hour 11


    +   - Many times through experimentation or just plain playing around, you can
    stumble across an astonishing effect. When experimenting, try to keep a mental
    note of the steps you perform as you go so that you''ll be able to duplicate the
    look if you find a good one.


    +   - Of the available tools, one of the handiest for producing awesome looks
    is the Gradient tool, which was introduced in Hour 7, “Working with Color.” If
    you haven''t yet toyed around much with this, I encourage you to do so. Open the
    Gradient dialog box and check out the various built-gradients.


    +   - So many factors must be taken into consideration when trying to achieve
    a certain look. Take a close look at the objects around you. Notice the way the
    light shines on them and the shadows they make. Try to visualize what steps one
    would involve to create a realistic looking graphic of a particular object.


    # # Creating Sharp Images from Scratch


    Sometimes you can get a really good graphic idea in your head, but you need to
    know the right techniques to make it happen onscreen. Your goal this hour is to
    cover some of the more common tricks to help you learn to create the look you
    want.


    *Begin by looking at a couple of ways to create something from nothing.*


    # # Simple and Complex Shapes


    Forming shapes with the selection tools can be a quick-and-easy way to create
    images. In just a few steps, you can make a fairly complex object out of a simple
    shape.


    To illustrate this point, I''m going to start out by opening a new blank window,
    adding a transparent layer, and using the Lasso tool to form a single odd-shaped
    selection, as in Figure 11.1. Open a new window and follow along for practice.


    # FIGURE 11.1


    This little selection stands a pretty good chance of actually becoming an interest-ing
    of work.


    ![](img/0183f053b347a6407a2381be231d0345_165_0.png)'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'Now you can add some color; I''ve chosen purple and black as the foreground
    and back-ground colors in the toolbox. Bring up the gradient options by double-clicking
    the Gradient tool. Leave most of the default settings in place, but change the
    gradient option to Bilinear. This will enable the color to grade from purple to
    black and back again.


    Apply the gradient starting from the middle portion and dragging to one end of
    the selection. You should have something similar to Figure 11.2.


    # FIGURE 11.2


    The bilinear gradient adds color and depth.


    ![](img/0183f053b347a6407a2381be231d0345_166_0.png)


    Okay, now you have the basic start you need to form your shape. With the selection
    active (as indicated by the flashing marquee), right-click on the image and select
    Edit, Copy, and then select Edit, Paste. This will give you an identical selection
    placed over the first one. For this new selection, use the Transform tool to rotate
    it. Double-click the Transform tool to bring up the options, and then choose Rotate.
    You''ll see the rotation appear around the selection. Grab one of the corner handles
    and rotate it to the right (around 20 degrees). Now activate the Move tool and
    move the rotated selection to where you can line up the tip of it with the tip
    of the first selection, as in Figure 11.3. You undoubtedly see where I''m headed
    with this, don''t you?


    # FIGURE 11.3


    The raw beginnings of an object taking shape.


    ![](img/0183f053b347a6407a2381be231d0345_166_1.png)'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'Repeat the previous steps of copying, pasting, rotating, and moving, but add
    another 20 degrees to each rotation. Keep repeating as often as needed to bring
    the shape to the stage of desired completion, as shown in Figure 11.4.


    # FIGURE 11.4


    You can take this shape as far as you want it to go.


    ![](img/0183f053b347a6407a2381be231d0345_167_0.png)


    By using the previous technique of copying, pasting, and rotating with basic geometric
    shapes, you can form some pretty interesting objects, as illustrated in Figure
    11.5. (If you enjoy working with geometric shapes, you''re going to love the GIMP
    plug-in known as Gfig. You''ll learn more about it in Hour 20, Using Plug-ins
    and Extensions)


    # FIGURE 11.5


    Easy geometric shapes in progress.


    ![](img/0183f053b347a6407a2381be231d0345_167_1.png)


    # Drop Shadows and Glows


    The technique of applying drop shadows and underglows can really make an image
    stand out and be noticed, and is easily accomplished in the GIMP by using layers.


    There are a couple of ways to add a drop shadow, one of them being in the shadow
    options of Script-fu. This one is simple; right-click on the image, select Script-fu,
    Shadows. You have your choice of drop shadow or perspective shadow, each having
    options.


    Another way to get a drop shadow is to actually make one out of the image itself,
    which is the method explained here.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Special Effects


    Add a drop shadow to the previous homemade image and you''ll see what a difference
    it can make.


    First, select the image that you want to place a shadow behind. For the image
    you''re using here, choose the Fuzzy Select (with Sample Merge activated) on the
    background, and then choose Select, Invert. If the selection you are working on
    is part of the background layer, you will need to select Edit, Copy, and then
    select Edit, Paste to paste into a new transparent layer before adding the shadow.


    To make the shadow, right-click on the image and bring up the Layer dialog box.
    Add another new transparent layer. Name it Shadow. Use the Bucket Fill tool to
    fill the selected area in the new layer with solid black. Deactivate the selection.


    Right-click and select Filters, Blur, Gaussian Blur (either one), and apply a
    blur strength of about 15 or so. In the Layer dialog, use the Lower Layer button
    to place the shadow layer under the image layer. Because the shadow is in its
    own layer, you can use the layer''s opacity slider to make the shadow appear paler
    if you like.


    What you will want to do is offset the shadow so that it appears the light source
    making it over to one side. To do this, right-click and go to Image, Channel Ops,
    Offset. This brings up an options box where you can choose the amount of offset
    (pixels) for the X and Y values of the shadow layer. (Remember, X is horizontal
    and Y is vertical). Positive numbers will offset the shadow to the right for X
    and down for Y. If you want the shadow up or to the left, enter negative numbers
    (for example, -8). In Figure 11.6, the drop shadow layer offset is X8, Y8. You
    can also offset the shadow by moving the layer, but the channel ops give you more
    control if you want to offset it in an exact amount.


    # FIGURE 11.6


    The offset to place the shadow in either direction is shown down and to the right
    from the image itself.


    ![](img/0183f053b347a6407a2381be231d0345_168_0.png)


    Now you''ll work on giving a glow to a selection.


    For this, you''ll want to begin by following the first steps as you used to create
    the drop shadow. Place the selection in a transparent layer. Add another transparent
    layer and'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'name it Glow. This time, however, instead of filling the selected area of the
    new layer with black, use a lighter color. White is good for achieving a halo
    effect, whereas bright green gives a radioactive appearance. (I am somewhat partial
    to red and purple glows myself.)


    Deactivate the selection and apply a Gaussian Blur, this time making it a slightly
    higher blur strength. Try 20 to begin with. You can play around with the blur
    strength to get the desired effect. Lower the glow layer under the image layer.


    Because my image began with a white background, the glow doesn''t show up too
    well, I''ve used the Bucket Fill tool to fill in the background layer under the
    image and shadow with a darker color (see Figure 11.7).


    # FIGURE 11.7


    A glow is made using a brighter color than a drop shadow and leaving out the offset.


    ![](img/0183f053b347a6407a2381be231d0345_169_0.png)


    # Imitating Real Objects in 3D


    One thing the Gradient tool is extremely useful for to give a sense of depth to
    an object so that it has more of a 3D appearance than just a flat two-dimensional
    look. In the next tutorial, you will start with a simple shape and take it through
    several changes to make it seem more *real*


    Open a new blank image window with a white background. Bring up the Layer dialog
    and add a new transparent layer to work on. (The reason I like to add a transparent
    layer before beginning is that later, if I choose to do so, I can easily change
    back-ground colors without affecting the object I''m making.)


    Use the Ellipse/Circle tool and make a perfect circular selection in the image
    window. (Reminder: Holding Shift as you select will create perfect circles.) Open
    the Pattern dialog box, choose a pattern, and use the Pattern Fill option of the
    Bucket tool to fill the circle. Then deactivate the selection. In Figure 11.8,
    I''ve begun by filling my circular selection with a built-in GIMP pattern called
    *Marble* #1.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Special Effects


    FIGURE 11.8


    A plain circular selection gets a pattern fill to start it on its way to becoming
    an object.


    ![](img/0183f053b347a6407a2381be231d0345_170_0.png)


    Now you will attempt to give it some depth. Imagine there is a light source just
    above and to the left of the circle. It would shine on the area of the circle
    it was closest to and the other side of the circle would appear darker because
    it wasn''t in the path of the light.


    To achieve this look, you will rely on the Gradient tool. Because you don''t want
    to change the color or color the pattern, but want to add depth, you need a gradient
    that goes from transparent (letting the pattern show where the light is hitting
    the object) to black (forming the shadowy area). This is a good opportunity to
    make a custom gradient. Bring up the gradient editor by selecting File, Dialogs,
    Gradient Editor, and clicking the New Gradient button in the upper-right corner.
    This brings up a box where you can give a gradient name. (I''ve named mine trans-to-black.)


    Now, going back to the gradient box, right-click in the area where the gradient
    colors appear and other options will pop up. This is where you set the colors
    you want in the gradient. In the top of the options, you''ll see it says Left
    End Points Color. This means the color that will begin at the left side of the
    gradient. Because you can place gradients in any direction you want by merely
    dragging the cursor in the different directions, it doesn''t really matter which
    color you choose to go on the left or right. Directly under End Points Color is
    the option called Load From. Clicking that will bring up a window where you can
    choose a color to insert into the left end point. Because you are making transparent
    to black, choose transparent, which is RGBA (0.000, 0.000, 0.000, 0.000) and appears.
    Now right-click again to bring up the same options, this time go to Right End
    Points Color and choose your. Your custom gradient is now set in the gradient
    editor. You can leave it in the editor for future projects.


    Activate the Gradient tool by double-clicking it to bring up the options, and
    then choose Radial for the gradient option and Custom (from editor) for the blend
    option. The radial option gives a sunburst effect if it is applied from the center
    out. But because you want'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'the effect of the light source to be in the upper-left, place the cursor in
    the selection where the light source would be shining on to the object, and drag
    it to the lower-right outer portion of the selection. Now the circle you began
    with will take the shape of a sphere, as in Figure 11.9.


    # FIGURE 11.9


    It''s amazing what a little gradient shadowing can do to a plain, flat circle!


    ![](img/0183f053b347a6407a2381be231d0345_171_0.png)


    The light effect even one step further and apply an extra little sheen to your
    sphere to give it more of a glossy appearance. Activate the Airbrush tool, set
    the foreground color to white, and open the Brush dialog box to choose a medium-sized,
    soft-edged brush. By spraying in a little spotlighted area right at the point
    where the imaginary light is shining, the sphere will have gained a much shinier
    look, as in Figure 11.10. (This is called a specular). Specular highlights appear
    as bright reflections of the light source on the surface of the object.


    # FIGURE 11.10


    With the addition of a specular, the sphere takes on the look of a well-polished
    bowling ball.


    ![](img/0183f053b347a6407a2381be231d0345_171_1.png)


    Now try another little trick and cut off the top of the sphere and hollow it out
    to make a bowl.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'Activate the Ellipse Select tool and make an elliptical selection in the upper
    half of the sphere, starting at a point on one outer edge and ending on the opposite
    edge, as in Figure 11.11.


    # FIGURE 11.11


    The elliptical selection is the first step to cutting the sphere.


    ![](img/0183f053b347a6407a2381be231d0345_172_0.png)


    Now, right-click on the image and choose Select, Invert. Use the Eraser tool to
    erase the portion of the sphere that''s now just above the elliptical portion.
    Once again, right-click, choose Select, Invert, and your image should look like
    the one in Figure 11.12.


    # FIGURE 11.12


    Now it''s starting to resemble a bowl.


    ![](img/0183f053b347a6407a2381be231d0345_172_1.png)


    All you need to do now is shade the inner portion of the bowl. Because your imaginary
    light source is coming from the upper-left, it is shining into the bowl at an
    angle, lighting the right inner portion, with the left side of the bowl shadowing
    in. To get look right, use the transparent black custom gradient that you made
    previously, this time you will apply it in the opposite direction.


    Open the Gradient dialog box and click on the trans-to-black gradient to select
    it. Activate the Gradient tool and, with Radial as the gradient option, and Custom
    as the blend option, begin the gradient to the far right side of the elliptical
    selection and drag it to the left. Deactivate the selection, and your bowl is
    complete (see Figure 11.13).'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# FIGURE 11.13


    The Gradient tool plays a major part in achieving a realistic look.


    ![](img/0183f053b347a6407a2381be231d0345_173_0.png)


    Okay, that was pretty easy, wasn''t it? Now take the bowl you created and add
    a perspective shadow to give it one more touch of realism. While there is a perspective
    shadow filter in the Script-fu options, you can do this one by hand so that you
    will get a better understanding of how a perspective shadow works.


    By noticing where the light source is coming from, you can judge where the shadow
    will fall. An easy way to understand this is to think of how the shadows around
    your house fall at different times of the day. At high noon, there are no shadows
    because the sun is directly above you, and as it slowly moves west to set, the
    shadows get longer and longer on the east side. Thinking realistically in those
    terms then, because the light source was on the left of the bowl, the perspective
    shadow will naturally fall to the right.


    The first step is to select the bowl. Now open the Layer dialog box and add a
    new transform layer. In this new layer, fill the selected area with black (gray
    if you want a lighter shadow). To get the shadow to fall to the right, activate
    the Transform tool and choose Perspective. Grab the upper corners of the selection
    one at a time and drag to the right until the shadow appears to be falling correctly
    according to the light source, as in Figure 11.14.


    # FIGURE 11.14


    The shadow layer can be manipulated into shape using the Transform tool.


    ![](img/0183f053b347a6407a2381be231d0345_173_1.png)'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Special Effects


    Deactivate the selection and apply a Gaussian Blur, just as you did for the drop
    shadow. Move the shadow layer underneath the bowl layer, and there you have it.
    You can lower the opacity in the layer if the shadow is too dark (see Figure 11.15).


    # FIGURE 11.15


    The effect is accomplished by blurring and moving the shadow layer under the bowl
    layer.


    ![](img/0183f053b347a6407a2381be231d0345_174_0.png)


    # Stained Glass Effect


    There are many different ways to get a stained glass look. After you start experimenting,
    you might find that it''s easier than you imagined. To get started, you''ll create
    a simple stained glass image.


    Open a new image (white) in a size large enough to be comfortable to work with.
    The first thing you''ll do is to make the basic outline of the lead that will
    hold the glass panes together. Open the Layer dialog box and add a new transparent
    layer. Name it *Lead*. (You''re going to be using the original plain background
    layer later on, so don''t delete it.) Set the foreground color in the toolbox
    to a medium gray.


    To outline the design, use the Paintbrush tool to draw the lines. Or do as I''ve
    done in Figure 11.16 and draw a combination of straight paintbrush lines and form
    simple shapes with the different selection tools using the Stroke function. Because
    the stroke size is controlled by the chosen brush size, the lines will all match.
    (Here I am using a brush called Circle Fuzzy 05).


    Now to give the lead some depth and thickness. Right-click and select Filters,
    Map, Bump map. When the options box appears, leave the default settings, but make
    sure you have the correct layer (lead) selected under the Bump option. Apply the
    filter.


    Add a new transparent layer (name it *Color*) and lower it under the Lead layer.


    With the Color layer active, use the Fuzzy Select tool to select an area within
    the lead lines. (To do this, make sure that Sample Merged option is checked in
    the Fuzzy Select options.) To ensure that the selected area goes right in to the
    lead lines, you might'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'to right-click, and choose Select, Grow (by about 2 pixels or so). Use the
    Bucket Fill tool to fill the selection with a color of your choice. Repeat the
    Select, Grow, and Bucket Fill steps for each of the other areas between the lines,
    using a different color that has a good rough texture for each until the image
    is completely colored in, as in Figure 11.17.


    # FIGURE 11.16


    Straight lines and stroked selections are good for drawing a simple design.


    ![](img/0183f053b347a6407a2381be231d0345_175_0.png)


    # FIGURE 11.17


    You can make the stained glass as colorful as you like, or use one color for all
    the panes you''d want a more monochromatic look.


    ![](img/0183f053b347a6407a2381be231d0345_175_1.png)


    It''s getting there, but let''s add a little texture to the glass panes. Add another
    new parent layer and call it Texture. Lower it to just under the Color layer.
    Right-click''on the image and choose Select, All. (The reason to select the entire
    layer is because you are going to use the Bucket Fill tool. Remember that the
    Bucket Fill must have either a selection or an area to fill. Because the layer
    is transparent, it must be selected.) Now open the Pattern dialog box and choose
    a pattern that has a good rough texture to it. (Here I''ve chosen one Green 3D.)
    Use the Bucket Fill tool (set to Pattern fill) to fill the new layer with the
    pattern. Because you want to use the texture from this pattern, but not the green
    color, right-click and select Image, Colors, Desaturate.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'Now you need to blend the layers so that the texture can be seen through the
    colored panes of glass. Go to the Layer dialog box and set the Blend mode to Overlay
    in the texture layer. Activate the color layer and do the same for it. Your stained
    glass should look similar to Figure 11.18.


    # Figure 11.18


    The addition of the texture gives it a more realistic appearance.


    ![](img/0183f053b347a6407a2381be231d0345_176_0.png)


    You could leave it at this, but don''t you want to see some light shining through
    your window?


    Activate the original white background layer. Set the foreground color in the
    toolbox to white and the background color to black. Open the Gradient tool and
    choose either Shapeburst Angular or Radial for the Gradient option.


    Place the cursor in the center of the image and drag to any edge. The light now
    brightens up the stained glass (see Figure 11.19).


    # Figure 11.19


    A light shining in is a must for a stained glass image.


    ![](img/0183f053b347a6407a2381be231d0345_176_1.png)'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# Summary


    There are usually several different ways to achieve a particular look. In this
    hour, you learned some of the techniques that are used to create certain effects.
    You''ll find in the world of graphics, the more techniques you know, the better
    off you''ll be. Even if you think you''ll never use a specific effect, it can''t
    hurt to practice the techniques and learn how each step works, so you can apply
    that knowledge in various combinations to come up tricks and techniques of your
    own.


    # Q&A


    +   Q I''ve seen special effect tutorials for other graphics programs. Can I use
    same lessons in the GIMP?


    +   A Definitely! Most graphics tutorials can be easily translated to work in
    the GIMP. Of course, because all program interfaces are different, you might have
    to experiment a little to find the corresponding tools, filters, and so on. In
    fact, translating other tutorials can be a great learning tool for finding your
    way around the GIMP.


    # Exercise


    For this hour''s assignment, look around the Web and find a graphic that appeals
    to you—try and find something simple yet challenging. Study it and see if you
    can use the tools available in the GIMP to duplicate it (or even improve upon).'
  merge: -1
  img_proc: true
- pgno: 178
  md: Basically, filters belong to a group of functions in the GIMP known as plug-ins.
    A plug-in is an extension to GIMP that lends added functionality and extends its
    capabilities. A filter, then, is a specific kind of plug-in that is involved in
    manipulating graphics directly to achieve any number of alterations and special
    effects. For the most part, most plug-ins are filters.
  merge: -1
  img_proc: true
- pgno: 179
  md: 'Plug-in—A piece of code written to interface directly with the GIMP. This allows
    for third parties to augment the GIMP''s already impressive list of capabilities.


    Filter—Any plug-in that specifically alters an image in various ways to create
    new and unique effects.


    For those of you have graphics programs before, plug-filters in the GIMP work
    similarly to plug-ins in Photoshop and the like. Additionally, there are more
    and more filters being written for the GIMP all the time. (And the best part is
    that, to my knowledge, they are all free and open).


    Most of the plug-ins are not written by the original authors of GIMP, they are
    written by many people from all over the Internet in order to fill a specific
    need. However, this can theoretically mean that some filters are bound to be a
    little useful or well written than others. For the record, I''ve installed every
    GIMP plug-in known, and 99 percent of them were a champ.


    Many filters have their own dialog interface, although they tend to follow the
    facto interface conventions and for the most part fit with the GIMP quite seamlessly.


    # Using Filters


    You use filters just like you would any other GIMP function—right-click, and go
    to the Filters submenu. From there, you will have access to a whole plethora of
    special effects filters that you will no doubt spent hours playing with and over.
    The selected filter will then directly apply the effect or pull up a dialog box
    from which you can select options.


    # Filters that Come with the GIMP


    If you installed the GIMP from the CD-ROM that comes with this book, chances are
    you already have access to most of the plug-ins available at this time. However,
    I will begin with the simplest of plug-in filters that come with the GIMP.


    The graphics filters in the GIMP are all accessible by right-clicking the Filters
    menu. From there, you will see all the filters sub-categorized into different
    menus.


    You are going to begin using filters that are most commonly used to improve photos
    and images.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Blur and Sharpen Filters


    The simplest and most often used of all filter functions is the Blur function.
    This function has three available filters that work in slightly different ways.
    (If one thing can be said about UNIX people, it''s that we strive to be thorough.)


    # Blur 2.0


    The first blur filter, accessible from the Blur submenu of the Filters menu, is
    named Blur (see Figure 12.1).


    Figure 12.1

    ring can add a soft touch to your pictures and cover up some flaws in the process.


    ![](img/0183f053b347a6407a2381be231d0345_180_0.png)


    The Blur dialog box has a few options to choose from, as shown in Figure 12.1.


    +   - Randomization Seed—A value that the plug-in uses in order to create a random
    blur value—this can be anything. Unlike most blur filters, it lets you choose
    the value you want to use for a randomization seed, instead of just picking one
    for you. (I fail to see where this could be useful, but it is kind of empowering).
    In any case, the seed can be based on the current time or on a value you supply.

    - Randomization %—The amount that the randomized Blur function is applied to your
    image. More, or less, alters the amount of blur.

    - Repeat—The number of passes the filter uses to blur your image. As with anything,
    the more times it is blurred, the deeper the blur effect.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Gaussian Blur


    Below the Blur option on the Filters menu you will see two Gaussian Blur filters:
    IIR and RLE. They do essentially the same thing, they let you blur an image by
    varying degrees.


    Supposely, IIR is somewhat faster for photographic quality whereas RLE is better
    for line art and such. (I personally have never really seen any difference between
    the two.) In any case, to use a Gaussian blur, select it from the menu, and a
    dialog box will appear in figure 12.2 (in this case the RLE dialog box).


    # FIGURE 12.2


    These blur filters are a little more straightforward—if not as feature-laden.


    ![](img/0183f053b347a6407a2381be231d0345_181_0.png)


    The Gaussian Blur options include the following:


    +   * Blur Horizontally and Blur Vertically—Defines how the blur is applied—selecting
    both of them your blur is applied even on both planes.

    * Blur Radius—Controls the radius of the applied blur (how many neighboring pixels
    are affected). The higher the number, the more intense the blur.


    # Pixelize


    Another handy blur filter is called Pixelize. Stated simply, it distorts your
    image by enlarging the pixels, creating an image like the masking of anonymous
    faces on the six o''clock evening news (see Figure 12.3). You can set how large
    you want your pixels to be, as well.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Using Filters to Improve or Distort Images


    # FIGURE 12.3


    Well... maybe not a true improvement in this case. Pixelization is a neat effect.
    Sometimes it can add that “digitized” feel to an image.


    ![](img/0183f053b347a6407a2381be231d0345_182_0.png)


    # Motion Blur


    Motion blur—now here’s a cool effect (if used in the right place). It emulates
    an object in motion by applying a custom directional blur. This adds the effect
    of motion trails that are universally recognizable.


    Of course, shutter-speed, or really bad photography, causes this effect in real
    life. In some cases, however, it captures the effect of a fast moving object.
    (Or just really shaky hands!) Whatever effect you’re going for, this filter works
    quite nicely (see Figure 12.4).


    # FIGURE 12.4


    As you can see, this effect can be valuable with many graphics and photos. Notice
    how the effect makes the truck appear to be traveling at high speed, while the
    effect makes the second picture seem to have a shaky-handed photographer.


    ![](img/0183f053b347a6407a2381be231d0345_182_1.png)


    In the Motion blur dialog box, the Length option refers to the length of the trail
    effect.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'The Blur type options enable you to choose from three blur effects, one of
    which (Linear) is shown in Figure 12.4, and the other two are shown in Figure
    12.5. The effects are great for experimentation.


    # FIGURE 12.5


    Changing the blur type can make quite a difference.


    ![](img/0183f053b347a6407a2381be231d0345_183_0.png)


    Angle sets the direction of the blur trail in degrees of a circle.


    # Enhancing Your Images


    The next filters are those that do the opposite of blur; they attempt to sharpen
    and enhance graphics. It''s my experience that applications are usually better
    at blurring images than sharpening them. There are, however, certain situations
    where these filters sparsely can vastly improve the quality of your image, as
    shown in Figure 12.6. By covering flaws, cleaning out anomalies, and adding just
    a touch of desired effect, it is possible to rescue those photos that might have
    been unusable before. This means they appear better without any visible signs
    of digital alteration.


    # FIGURE 12.6


    Making a fuzzy image look much cleaner and sharper.


    ![](img/0183f053b347a6407a2381be231d0345_183_1.png)'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Using Filters to Improve or Distort Images


    # Sharpen


    As you can see from Figure 12.6, the Sharpen filter can help to add detail and
    tweak a photo to a better state. Of course, this filter is no substitute for a
    good scan or photography. It can''t fix everything; too much of this effect will
    result in an effect''s easily detected as fake, but it can add enough sharpness
    to make the difference between a photo that''s slightly fuzzy and one that is
    clear and focused.


    It works by finding the areas in an image with high contrast and drastic color
    changes (such as edges of things) and increasing the brightness and contrast in
    those areas between the neighboring pixels.


    In the Sharpen dialog box, you will see a thumbnail preview of your image, and
    a slider control for adjusting sharpness. This effect is best used sparingly and
    subtly. It works best when no one can tell that any alterations have been made,
    and it''s a great filter for the heavily de-oriented individual.


    # Despeckle


    Despeckle attempts to remove noise from flawed images. This is especially effective
    on scanned images, graphics scanned from print media, or any picture containing
    scratches, odd pixels scattered here and, and other anomalies (see Figure 12.7).


    # FIGURE 12.7


    This filter is used to clean up spotty images. It is applied very thickly here
    to illustrate that this can also be used as an effects filter, giving the image
    a painted look.


    ![](img/0183f053b347a6407a2381be231d0345_184_0.png)


    Radius adjusts the size of the areas in which the filter smooths out the colors
    between neighboring pixels. A value of 1 is an area of $3 \times 3$ pixels, a
    value of 2 is $5 \times 5$, a value of 3 is $7 \times 7$, and so on.


    The Despeckle dialog box, (shown in Figure 12.7), shows that you can use this
    filter with or without the Adaptive and Recursive options. Adaptive will try and
    determine the best'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'radius value for you. (Sometimes this works well, and sometimes it doesn’t).
    Recursive, in effect, increases the intensity of the effect—sometimes a little
    too much. (Recursive applies more in a smaller radius size.) By using these options,
    you get an effect that''s recursively applied in an adaptively sized radius (the
    same as adaptive, but a little stronger).


    Black Level and White Level options are also available. Use Black Level to repair
    damage on darker pixels, and use White Level for lighter pixels.


    # NL Filter


    The NL filter tries to combine the best of the Sharpen and Speckle filters. In
    fact, the plug-in is a combination of filters (see Figure 12.8).


    FIGURE 12.8


    Attempting to clean a spotty image up a bit.


    ![](img/0183f053b347a6407a2381be231d0345_185_0.png)


    The Alpha Trimmed Mean filter is a lot like the Speckle filter—it tries to remove
    image noise. It also works in much the same way as the Speckle filter. You can
    adjust the radius as you would in Duskle, and the Alpha variable in this case
    changes the behavior of the filter. A lower value will smooth pixels, as a blur
    filter, and a higher alpha will try to depict the image.


    Optimal Estimation is another smoothing filter that is similar to Alpha Trimmed
    Mean. It works by determining the optimal range of color values within an area
    of surrounding pixels.


    Edge Enhancement is similar to the Enhance filter—it tries to unblur an image
    by brightening and sharpening the edges (areas of contrasting color) in an image.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Destripe


    The Destripe filter tries to fix images with muddy stripes (or snail trails) on
    them—usually a result of a poor scan job.


    # Noise Filters


    Noise filters are useful for a number of things. They can improve images that
    have too much contrast between color boundaries or are too sharp. Also, they can
    be used to add a different texture to an image.


    # Noisify


    This filter, shown in Figure 12.9, lets you add and adjust random noisy pixels
    in an image.


    Figure 12.9

    Adding texture with the noise filter.


    ![](img/0183f053b347a6407a2381be231d0345_186_0.png)


    Each RGB channel is individually adjustable. A value of 0 is no noise, and a value
    of 1 is total garbage. Obviously, this filter should be used with subtlety.


    # Randomize


    This filter is similar to Noisify, but with many more options and effects (see
    Figure 12.10). It shifts the colors of the pixels in the graphic. The Randomization
    types determine how this filter accomplishes this.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# FIGURE 12.10


    Randomize is a good effect for adding different tones and textures to your photo.
    (Who picked the names Hurl, Pick, and Slur, anyways?)


    ![](img/0183f053b347a6407a2381be231d0345_187_0.png)


    +   - Hurl—Changes a pixel''s color to a random value.

    - Pick—Picks a color value to apply to a pixel from a randomly chosen neighbor.

    - Slur—Chooses the neighbors above a pixel for a color value. This results in
    a slightly different effect than Pick.


    # Spread


    Spread does what it sounds like—it spreads pixels around in any direction and
    amount you choose. This can be useful for creating animations with fade-outs and
    so forth (see Figure 12.11).


    # FIGURE 12.11


    Spreading an image can create a unique and very cool effect.


    ![](img/0183f053b347a6407a2381be231d0345_187_1.png)'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# Using Filters to Improve or Distort Images


    The Spread filter, if used sparingly, is great for reducing the effect in gradients
    commonly known as banding. Banding is where the gradient shift is so pronounced
    that the individual colors are visible in banded lines, especially on video hardware
    that renders at less than 24-bit color. This is not a good effect; however, a
    little spreading can fix this (see Figure 12.12).


    By setting your levels subtlety, you can effectively add just enough randomization
    to rid your image of that annoying banding. By the way, this effect is great for
    use on HTML documents with gradient background images. You''ll achieve a much
    smoother effect this.


    # Figure 12.12


    This effect might be difficult to spot in a black-and-white book, so you may want
    to try it out yourself. Also, sometimes the Randomize filter works better on gradients
    than the Spread filter does. It just tweaking.


    ![](img/0183f053b347a6407a2381be231d0345_188_0.png)


    # Obtaining Filters


    To obtain new plug-in filters, you need no further than www.gimp.org. There you
    find a site called The GIMP Plug-in Registry. It has a database of all registered
    plugins for you to scroll through and choose from. Most of these are filters,
    although other functions are available here as well. Download and compile those
    you like. Of course, for now you are concerned only with the effects filters specifically,
    and luckily those are generally the easiest to install.


    To install a graphics filter, you need to untar/unzip the file, read the README
    document, and run the plug-in installation tool called gimptool, like this


    ```

    tar -zxvf plugin.tar.gz

    cat README | more

    gimptool --install-bin plugin

    ```'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'This will compile the source code and install the binary plug-in for you. Pretty
    simple, actually. Restart GIMP for changes to take effect.


    # Summary


    This hour gave you some insight into how filters and plug-ins work, and how images
    can be improved using filters (and not just distorted with a lot of weird effects
    that are cool but never used). Of course, you''re not messing with filters and
    plug-ins just yet—in fact, you''re just getting started. Obviously, this book
    can''t cover all the plug-ins there are, but going over the ones most commonly
    used will give you enough impetus to move into the various tutorials and techniques.


    In order to use these filters effectively, the best advice is less is more. The
    filters covered in this hour are designed to help images move from okay to high
    quality. Using too much can make your images look like they''ve been tampered
    with. You''ll mostly use these filters when you want to avoid making your images
    altered.


    # Q&A


    +   - What if I change my mind about a filter? Can I still undo it?


    +   - Frequently, yes. Undo functions with plug-ins just as it does with any of
    the standard tools. Just remember Ctrl+Z when you get into trouble with an image.


    +   - Are there any filters that are not plug-ins?


    +   - Not to my knowledge. Filters are either plug-ins written by a third party,
    or some-the GIMP deals with internally. (Assuming anything working outside of
    the GIMP is considered a separate application.)


    # Exercise


    The best thing to do with these particular filters is to tweak images; that is
    your assignment. Find some good scanned photos, perhaps of friends and family,
    and find the visible flaws in the images—few pictures are perfect. Then try to
    improve those photos with the filters, looking closely for any imperfections you
    can find, either technical or aesthetic. (The Zoom tool can be handy for this.)
    As you work, you might find out that it is easy to over-correct an image, leaving
    it worse than before. The skill to acquire from this exercise is the ability to
    know when to stop. It takes some practice to get the hang of determining when
    you''ve tweaked enough. I''ve ruined many images by going one step too far. Thank
    goodness for multiple undo''s!'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# HOUR 13


    # Artistic Filters


    You''ve seen a little of what filters can do. In this hour, you will expand on
    what you''ve learned in Hour 12. “Using Filters to Improve or Distort Images,”
    and get into some of the more eccentric and exciting effects you can create with
    some filters and a little experimentation. These are the kinds of things that
    make the unhardened graphics newbie ooh and ah with delight and amazement.


    # Using Filters Artistically


    Filters (and most filters you encounter in GIMP) are designed to add some abstraction
    to your image—sometimes in order to approximate a real life effect (such as painting
    and brush techniques, murals, and so forth), and sometimes to create something
    new and unique. All filters are subcategorized into different menus such as Artistic,
    Color, Combine, Distort, and so forth, depending on what they do specifically,
    but ultimately they are made with the same goal in—to abstract your images.


    You will use these filters in the same way you activated the enhancing filters
    in the previous hour—only the desired effects of using filters has changed


    ![](img/0183f053b347a6407a2381be231d0345_190_0.png)'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# 172


    # Hour 13


    somewhat. Now you should concentrate not on making your image more life-like,
    but just the opposite. Of course, there is no way to cover all the GIMP filters
    because there are so many, but the most common and useful ones will be touched,
    giving you a basic understanding and the knowledge to apply them in given situations,
    such as the tutorials in upcoming hours. Many filters work in the same way so
    it would be relatively easy to figure out what new filters you encounter and how
    they work.


    Now perhaps the neatest filter available in GIMP is the GIMPressionist. This filter
    (or better yet, plug-in encompassing a whole suite of filters) does not come with
    the base distribution of GIMP at this time. However, if you have installed the
    GIMP with the CDROM, then you do have it on your system. If not, it is available
    from the GIMP Plug-in in Registry at http://registry.gimp.org.


    # GIMPressionist


    It''s things like GIMPressionist that running Linux and working with free software
    all worthwhile. It does intensive and fantastic effects and textures, and it can
    make any ordinary image look really cool. The GIMPressionist will quickly become
    one of your most used and well-liked utilities in GIMP. It''s great for creating
    a set of graphics with a matching look and feel (Web graphs come to mind), adding
    just texture to a photograph to transform it from ordinary to unique, with minimal
    effort, and doing some weird things with pictures.


    The term GIMPressionist, if you haven''t already figured it out, is a play on
    words with impressionist, which is, of course, the famous school of art that uses
    different brushes, paints, and stroke to paint everyday subjects with fuzzy, just
    glanced-at appearance. GIMPressionist expands on this concept by giving you access
    to many different brushes, styles, and patterns for to distort your images just
    enough to give them an impressionist tone. And, with anything in the GIMP, everything
    in GIMPressionist is expandable—you can add your own brushes and patterns later
    on if you choose. It is really a marvelous plug-in. It is also a pretty complex
    and sophisticated one, and as you will see soon.


    To use GIMPressionist, you obviously need an image to start with that you want
    to manipulate. In this example, as shown in Figure 13.1, start with an image and
    open the GIMPressionist dialog box by choosing Filters, Artistic. Before you,
    make sure that a local copy of the GIMPressionist data files are located in your
    .gimp directory (You can do this by copying the contents of /usr/share/gimp/gimpressionist
    to ~/.gimp). This will enable you to make customizations easily.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Artistic Filters


    173


    > Remember that GIMPressionist, as with most plug-ins, needs a full-color RGB
    image on to work. Indexed and grayscale images will have most filter options ghosted
    out.


    # Figure 13.1


    The GIMPressionist dialog box. Papers have textures that you apply to the image
    using the brushes.


    ![](img/0183f053b347a6407a2381be231d0345_192_0.png)


    In the Paper area, GIMPressionist gives you options for a paper texture to apply
    to your image—this will be a kind of backdrop or canvas that your image will be
    painted on. The Scale lets you set the size of the pattern, and the relief changes
    the depth of the embossed effect. (A relief of 0 equals no textured canvas, which
    is sometimes more desirable.) Select any paper texture you use, and then click
    the Brush tab, as shown in Figure 13.2 (You can add more patterns by copying the
    pattern in grayscale PGM to .gimp/gressionist/Papers.)


    # Figure 13.2


    GIMPressionist brushes. Installing more of these is easy as copying a grayscale
    PGM file to the .gimp/gressionist/brushes directory.


    ![](img/0183f053b347a6407a2381be231d0345_192_1.png)'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'You will have many brushes to choose from. Which brush you use will alter the
    appearance of the entire effect, because the brush is the element that determines
    the texture of the painting effect. You can alter the size of the brush, Relief,
    and Stroke Density, which reflects how many times the brush is applied to the
    image. A Stroke Density that''s set too high can distort your image beyond all
    recognition—but sometimes you want. The slider below the brush preview sets the
    brightness/contrast of the brush. View Figure 13.3 demonstrates the effect applied
    with different brushes.


    # FIGURE 13.3


    As you can see, the wide range of brushes to choose from (and create) the GIMPressionist
    nearly infinite capabilities.


    ![](img/0183f053b347a6407a2381be231d0345_193_0.png)


    In the Orientation tab (see Figure 13.4), you will see options for altering the
    brush stroke pattern. These are fun to play with, but a little complex at first.
    The Directions option lets you choose how many different stroke positions your
    brush will create (the angles at which the brush is applied). The higher number
    of stroke positions, the more complex and the effect will appear (see Figure 13.4).
    The Start Angle option is the angle in degrees that your stroke position will
    start out with (an angle of 0 is the original brush angle as shown in the Brush
    preview). Angle Span is the amount of deviation from its original angle brush
    will rotate.


    The Orientation options let change what type of directional application your brush
    will form. These are different patterns that determine the way in which the brush
    is applied to the picture. A Radial orientation applies the brush in a circular
    fashion around the image, each stroke painted from center outward. Random orientation
    patterns paint them in any direction. These options are pretty self-explanatory.
    Sometimes the difference achieved by using these options is visible, and sometimes
    it''s not—experiment.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# FIGURE 13.4


    Many ways in which a brush can be applied. Changing the direction and orientation
    values can drastically alter the feel of the image.


    ![](img/0183f053b347a6407a2381be231d0345_194_0.png)


    The Placement tab has two options: Random or Evenly Distributed. A randomly painted
    image (randomly applied brush) has a more organic feel, whereas an evenly distributed
    one has a much cleaner, sterile feel.


    By clicking the General tab, you will see options that will affect the texture
    of the painting itself. Edge Darken lets you create an effect similar to a photo
    edge mask by painting a border around your image. Edge Harden changes the width
    of your border; the border can be either a simple matching pattern or painted
    as a solid color. Paint Edges applies the effect all the way to the edge of the
    image, regardless of the presence of a border (see Figure 13.5).


    # FIGURE 13.5


    General options for GIMPressionist and the difference between a solid and patterned
    border.


    ![](img/0183f053b347a6407a2381be231d0345_194_1.png)'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'After tweaking and tinkering with the many GIMPression settings and spending
    a lot of time coming up with that perfect effect, you might want to save it in
    order to apply it to future images (or in order to create a matched set of graphics).
    The options in the Presets tab (see Figure 13.6) lets you do just that! In order
    to save all brush, pattern, and stroke settings, click on Save Current, and you
    will be prompted to name your presets. After doing so, it should appear in the
    list (you might need to click the Refresh button in order to see your entry in
    the list for the first time). Now on, in order to apply your preset to an image,
    click Apply. All your settings are now in place, and clicking OK will apply your
    settings to the picture exactly as before.


    # FIGURE 13.6


    Saving your settings is a must if you come up with anything extraordinary. Additionally,
    the GIMPressionist comes with a few custom presets that are pretty good.


    ![](img/0183f053b347a6407a2381be231d0345_195_0.png)


    Now that you''ve been playing around with these settings, you will probably want
    to preview the effect before applying it, as it might need more tweaking. The
    Preview option (see Figure 13.7) enables you to do that. Just click the Update
    button to view your changes.


    # FIGURE 13.7


    Previewing the changes before applying them or saving the preset can save a lot
    of time and energy.


    ![](img/0183f053b347a6407a2381be231d0345_195_1.png)'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'One of my favorite things to do with the GIMPressionist is to use this effect
    in combination with layering to achieve a composite effect. This is actually pretty
    easy to do. By altering the background of an image differently than the focus
    of your composition, you can draw attention to the main subject.


    +   - The first thing to do is to create a layered image. I will first copy the
    subject (with the Bézier tool), paste it into a new layer (see Figure 13.8), and
    then apply the GIMPressionist filter to the background layer, which is separated
    from the subject, in a way that will give it a surreal feel. For this example,
    I chose an effect that is pretty heavy to subdue the background (see Figure 13.9).


    # FIGURE 13.8


    Copying the subject into a new layer.


    ![](img/0183f053b347a6407a2381be231d0345_196_0.png)


    # FIGURE 13.9


    The background layer gets a new look. Now the subject matter appears to be floating
    above the rest of the image.


    ![](img/0183f053b347a6407a2381be231d0345_196_1.png)


    As you can see, there are simply a million possibilities with the GIMPressionist
    plug-in.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# # IWarp


    Have you ever seen Kai''s Power Goo? Well, this is essentially the same thing
    under GIMP (with the benefit of being free and running in UNIX). With it, you
    can manipulate many intense warp effects by hand. You can pull up its dialog box
    by selecting the Distort menu.


    In the IWarp dialog box (see Figure 13.10), you can interact and apply the effect
    by dragging the mouse (and keeping the mouse button clicked) directly over the
    preview window. You will see six options for what kind of distort you want to
    apply.


    +   * Move—Smudges the paint around your image.

    * Grow—Enlarges the affected area.

    * Swirl CCW—Swirls the area in a counter-clockwise fashion.

    * Remove—Removes any applied effect in the given area. (This is really neat effect
    to watch in action.)

    * Shrink—Shrinks the area in a pinching fashion.

    * Swirl CW—Swirls in a clockwise motion.


    # FIGURE 13.10


    An IWarp effect in action—from different to just plain knots. (I''ve always thought
    that lions would look cooler with big German Shepherd ears.)


    ![](img/0183f053b347a6407a2381be231d0345_197_0.png)


    At the top of the dialog box you will see two slider controls. Deform Radius adjusts
    the size of the area your mouse will affect, and Deform Amount adjusts the depth
    of the applied effect.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# Artistic Filters


    If you ever go too far with your effect and want to start over, click the Reset
    button. The bilinear next to it will create a smoother effect, but might take
    longer to render. I find it best to just leave it unchecked.


    Adaptive Supersample is useful for creating a higher quality image. It is like
    an antialiasing method for smoothing out the image by adding intermediary pixels
    between colors, increasing color depth and detail. This option takes longer to
    render, but sometimes the times increase in quality is worth it.


    This filter also has animation capabilities, for a morphing effect, switching
    from the original image to the distorted one. In order to use this, click the
    Animate tab (Figure 13.11), and activate the Animate option. You can choose the
    number of frames the animation will (the higher the number, the smoother the animation,
    but this also increases the file size). The other two options choose the animation
    style: Reverse plays the animation backward from original, Ping-Pong goes from
    the original image to the distorted one and back to the original again. Using
    with these options creates a reverse Ping-Pong. And finally, using neither of
    these options animates from the distortion.


    > Remember: If you want to save your animation, you will need to save in a format
    that supports animations, such as MPEG or GIF89a. You will learn more about animations
    in Hour 23, "Animation—The Basics."


    # ### Figure 13.11


    Creating an IWarp animation. Unfortunately, this an unanimated book, so it''s
    something you will need to experience first hand.


    ![](img/0183f053b347a6407a2381be231d0345_198_0.png)


    ![](img/0183f053b347a6407a2381be231d0345_198_1.png)'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Cubism


    Cubism is another interesting painting effect, similar to GIMressionist, but much
    less complex. It creates a painted effect using gradient cubes applied at different
    angles (see Figure 13.12).


    FIGURE 13.12


    Cubism tries to emulate a different style of painting.


    ![](img/0183f053b347a6407a2381be231d0345_199_0.png)


    # Mosaic


    Mosaic, from the Artistic menu, creates the illusion of an image painted onto
    a stained glass type of texture (see Figure 13.13). It creates a pattern of bordered
    polygons of varying-size and texture, and approximates the fill pattern of your
    original image.


    FIGURE 13.13


    Mosaics can make backdrops for various compositions. There are a lot of options,
    but they are pretty easy to figure out.


    ![](img/0183f053b347a6407a2381be231d0345_199_1.png)'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# Whirl and Pinch


    This is a fun filter. It is accessible by selecting Filters, Distorts. It whirls
    and pinches your picture by means of variable slider controls (see Figure 13.14).


    Figure 13.14


    Whirling and pinching.


    ![](img/0183f053b347a6407a2381be231d0345_200_0.png)


    # Waves


    This is a pretty simple and effective filter. It distorts your image with the
    illusion of waves and ripples (see Figure 13.15). It has a preview window, and
    with the sliders you can alter wave intensity and size.


    Figure 13.15


    Adding a rippling water effect can be great for some backgrounds and textures
    (not to mention emulating the look of water).


    ![](img/0183f053b347a6407a2381be231d0345_200_1.png)'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# Apply Canvas and Apply Carpet


    These two are similar so I will cover them at the same time. The Apply Canvas
    plug-in creates a texture map for your image, much like the Paper function in
    GIMPression, and gives the image the appearance of being painted on a certain
    texture (see Figure 13.16). The dialog box gives you many options and can be previewed
    from within the plug-in.


    Apply Carpet does essentially the same thing, except that it adds a carpet to
    the picture. This can make the composition look like one of those latch hook rugs
    (found at the local arts and crafts store).


    FIGURE 13.16


    You can never have too textures.


    ![](img/0183f053b347a6407a2381be231d0345_201_0.png)


    # Light Effects


    The plug-ins that the illusion of lighting are particularly interesting—especially
    the Lighting Effects plug-in. They can add a measure of depth and realism to your
    image.


    # Lighting Effects


    This filter is pretty complex. If you are familiar with raytracers and modelers,
    this plugin works in the same way that they handle light. The Lighting Effects
    filter enables you to create a light source and place it in the composition using
    an XYZ coordinate system (although, it must be in front of the image respectively,
    as this is not a true modeler by any means). This and the capability to alter
    the type, intensity, and reflective qualities of the light give you an amazing
    amount of control over the lighting in your composition (see Figure 13.17).'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Artistic Filters


    # FIGURE 13.17


    A simple composition with the added element of spot lighting. What a difference
    little light can make!


    The interface of this plug-in takes a little getting used to, but the utility
    of this plug-in outweighs its complexity. The first thing you need to do in order
    to add some light is to choose a type of light source for your image. You have
    four choices: Point Light, Direct Light, Spot Light, and No Light. You can preview
    the effect by clicking the Preview button (see Figure 13.18). (This can take a
    second or two, depending on the size and complexity of the image).


    # FIGURE 13.18


    Editing the type of light source and setting the position.


    ![](img/0183f053b347a6407a2381be231d0345_202_0.png)


    By clicking the Light tab (as in Figure 13.18), you will see options for changing
    the position of your light source (This option is not available on Spot Light).
    This is done with the XYZ coordinate system. Essentially you move the source along
    a 3D grid: X for left and right, Y for up and down, and Z for forward and backward.
    Most of the time you''ll adjust the sliders by eyeballing the image and finding
    what looks best.


    The Material tab, as shown in Figure 13.19, enables you to set the reflective
    quality of the object in your image. This changes how the light interacts with
    your object, which can change the feel and texture of your object to be more dull,
    glassy, metallic, diffused, and so on.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# FIGURE 13.19


    Setting the reflective qualities


    ![](img/0183f053b347a6407a2381be231d0345_203_0.png)


    # Miscellaneous Effects


    Here are a couple of commonly used filters that might be of interest, not to say
    that the filters in these two hours are the only plug-ins worth messing with in
    GIMP. I tried to take a random sampling of the filters that I find most useful,
    and leave discovering the rest of them up to you. I don''t want to take all the
    fun out of it for you.


    # Alien Map


    Alien Map, as illustrated by the name, is a pretty weird one. It alters the color
    map in your image in a randomized way, leaving you with something that looks like
    it was taken from the point of view of an alien life with infrared and ultraviolet
    capabilities (ever see *Predator*?). In any case, this filter is pretty easy to
    use, and can be handy if you want to create something with that certain sci-fi
    or psychedelic look.


    To use, go to the Alien Map dialog box and manipulate the *alpha* slider bar left
    or right until you achieve the desired effect, as shown in Figure 13.20 (Alpha
    refers to how much effect is applied).


    # User Filters


    Yes, you read it correctly. The GIMP, with the aid of the User Filters plug-in,
    can handle Photoshop Filter Factory Filters. And because there are literally hundreds
    of available, this capability is fantastic.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# FIGURE 13.20


    Playing with color, but definitely not for making images realistic.


    ![](img/0183f053b347a6407a2381be231d0345_204_0.png)


    To clarify, these filters are a certain type of filter used in Photoshop, so this
    does not mean that the GIMP can include all Photoshop plug-ins, such as the many
    commercially available offerings from Kai, Alien Skin, Ulead, and the like. But
    it can run User Filters, which come in .8bf format.


    In order to install these filters, you must first install the GIMP User Filter
    plug-in (available on the CD-ROM under Plug-ins), and then acquire the Filter
    Factory filters. Due to licensing restrictions, I cannot include filters on the
    CD-ROM, but you can download them from http://www.netnets.net/showcase/wolf359/plugins.htm.


    Note that many of these filters are stored in PiCo format. PiCo is a file converter
    that archives and converts different Photoshop filters. Unfortunately, many Filter
    filters are stored in FFL archives, which need to be converted to .8bf format
    before GIMP can use them. I know of no PiCo-compatible application for UNIX, in
    order to use these filters from GIMP you will need to decompress them using your
    Windows boxes. You can copy them to your machine. You can get PiCo at http://pico.i-us.com/.


    After you use the User Filter .8bf uncompressed and copied over UNIX, you can
    put them in /usr/local/share/gimp/userfilter. You can now start using these filters.
    If you have Windows machines on your network, this is even easier for you. Save
    hard drive space by creating a symlink to the directory on the PC containing these
    filters.


    Using these filters is easy. Open an image, find User Filters in the Filters menu
    and click the Filter Manager tab (see Figure 13.21). Here, you will see a list
    of all User Filters installed on your system. Scroll through the list until you
    come to a name that interests you. Then click the Preview tab and watch the action.


    # 13'
