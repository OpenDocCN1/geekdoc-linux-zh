- pgno: 264
  md: 'To fill in the rest of the clouds, choose a very light shade of the sky color
    and a fuzzy brush tip. Use the Airbrush tool to give the clouds some shape using
    small circular motions (see Figure 18.6). After the shape is there, blur to soften
    the clouds.


    Figure 18.6


    With few wispy clouds here and there, the painting has a start.


    ![](img/0183f053b347a6407a2381be231d0345_264_0.png)


    This painting is screaming for mountains, so add a few of those too.


    To form the mountains, you''ll need a simple custom brush with a flat tip, similar
    to a flat brush used in oil painting. To make this brush, open a new, very small
    image (around 10). Draw a straight line horizontally across the center of the
    image. Right-click, and select Script-Fu, Selection, To Brush (in the description
    option, name it something as flat brush or line brush). If you check in the Brush
    dialog box, you''ll find the new brush waiting for you.


    Take the new brush, reduce the opacity a little, and use quick downward strokes
    to put in the basic shapes of mountains. By having the opacity reduced, you''ll
    see that overlapping the strokes will automatically gain cliffs and ridges, as
    in Figure 18.7. You might want to add few lighter colored strokes to highlight
    one side of the mountains as the sun were shining on them.


    Now that you have a start on the mountains, you''ll need a tranquil lake in front
    of them. Use the Rectangle tool to select the mountains and a large part of the
    sky. Copy and paste it into a new transparent layer. Use the Flip tool to perform
    a vertical flip on this new layer and place it so that the foot of the mountains
    meet on both sides to form a reflection. Use a 180 degree motion blur on the reflection
    layer and reduce the opacity a little to give a more realistic effect, as in Figure
    18.8.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# FIGURE 18.7


