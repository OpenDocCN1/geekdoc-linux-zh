- pgno: 16
  md: '# About the Authors


    Joshua Pruitt is an administrator/digital-graphic artist residing in Nashville,
    Tennessee. He works for a local college and also teaches UNIX. He is part of a
    Web design and hosting firm known as Mid-TN Network. He sets up area networks
    for small businesses, and he is also Webmaster for the Nashville Linux User''s
    Group (www.nlu.org). Joshua spends too much of his spare time with his books and
    computers, follows the politics of the tech industry soap opera, and will never
