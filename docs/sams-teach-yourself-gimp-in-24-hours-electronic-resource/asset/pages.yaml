    # GUASH


    GUASH is a simple file previewer program to run within GIMP. It enables you to
    preview your images by way of ordered thumbnails and open selected files accordingly
    in the GIMP, if you choose. Using GUASH is a very convenient feature when dealing
    with directories that contain many graphics files, which in saves time by eliminating
    the need for hide and seek when you can''t see to remember exactly what you named
    that particular image you''re looking for.


    Starting and using GUASH is simple: select Xtns, GUASH, and you''re ready to go.
    You will see the initialization screen, and then a directory listing of the directory
    you''re in (see Figure 20.6). Navigating GUASH is as straightforward as any modern
    graphical file manager. You can also move, rename, and delete files from within
    GUASH.


    # FIGURE 20.6


    Using GUASH gives you easily browse graphical representation of your file tree.


    ![](img/0183f053b347a6407a2381be231d0345_285_1.png)


    After you encounter a directory containing many files, GUASH might take a few
    seconds rendering the thumbnails, depending on the number and size (and the machine
    you''re'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'working with). It will then display the thumbnails in alphabetical order. After
    you find what you''re looking for, double-click the file to open it in the GIMP
    (see Figure 20.7).


    > In my opinion, GUASH has one shortcoming: The plug-in might crash when attempting
    to view files contained on a neighboring FAT16 or FAT32 partition (Windows). This
    might not be an issue by the time you read this, but be forewarned.


    # Figure 20.7


    GUASH is useful for keeping track of your images, and it also gives you some simple
    options for managing your graphics files and directories.


    ![](img/0183f053b347a6407a2381be231d0345_286_0.png)


    # IfsCompose


    This truly remarkable plug-in lets you render fractals on-the-fly. Fractals are
    mathematical principles, composed of complex types of geometric shapes that usually
    exhibit the property of self-similarity (snowflakes are a good example of this).
    You can use this tool to create complex, realistic and unique patterns by manipulating
    three or more triangles in 2D space. (The initial interface is shown in Figure
    20.8)


    Your fractal starts out with three isosceles triangles. To create a unique pattern,
    all you need to do is manipulating these triangles with your mouse until it appears
    to your liking. You can rotate, stretch, and resize them to any proportions. It''s
    really not that difficult, and you might be surprised at what you come up with.
    For example, many organic objects, such as trees, feathers, corals, mollusks,
    leaves, landscapes, and so forth can be closely approximated by fractal shapes.
    Using this tool, coupled with a little experimentation, can be useful in replicating
    these kinds of objects (see Figure 20.9).'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# FIGURE 20.8


    This interactive fractal generator, although quite mundane looking at first glance,
