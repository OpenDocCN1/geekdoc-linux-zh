- pgno: 24
  md: '# 1 HOUR


    # Installation and Configuration


    # Bring Out the GIMP


    This hour is designed to assist you through the mundane task of getting GIMP (GNU
    Image Manipulation Program) v.1.0 successfully installed and running smoothly
    on your system—if you haven''t done so already. It is primarily geared for those
    who are running Linux 2.0+ on PC architecture (Intel and clones), although the
    steps laid out here can easily apply to the other UNIX variants and hardware platforms
    as well, with generally little or no alteration involved (most of the time).


    I''m assuming that you have Linux or some UNIX variant and an implementation of
    the X Window System up running already. However, if this is not the case, this
    hour also briefly touches on getting Linux installed on a PC. There''s really
    no excuse to try this stuff out.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Preparation and understanding are essential to install new software such as
    this, especially if you have little experience with UNIX. It is by no means difficult,
    but there are many variables involved along the way, any one of which can conceivably
    cause issues. Therefore, in order to prevent any difficulties before they arise,
    you should take stock of the following criteria carefully:


    +   - You should have administrative privileges on the machine in question.

    - Check over the required packages and take note of what you have installed and
    what you do not have installed—as well as the versions of the software.

    - You should know exactly how your system is set up and what is installed. That
    way, you can be aware of any idiosyncies your setup might possess (for example,
    those who run Red Hat 5.1 should be). Now let''s get started.


    # Installing Linux—A Primer


    This book is primarily geared for those who already have Linux (or another UNIX
    variant) installed and running, and possess some working knowledge of how to run
    and use it. However, if you are new to GNU/Linux or UNIX in general, but would
    like to get right away using GIMP and other great Open Source software, don''t
    fret; Linux is available from several vendors (see the list of web sites below),
    and with a little research, you can be running a fine Linux box in no time. The
    CD-ROM has the GIMP and many other fantastic applications to assist you in your
    expedition into the wonderful world of free software. The following list outlines
    what you''ll need:


    +   - The GIMP source code in gripped format

    - The GIMP source code in RPM format

    - GIMP binaries in RPM and gripped format for various platforms

    - Everything else GIMP needs to run smoothly (libraries, extras free, and so on)


    In order to install Linux, you will need the following:


    +   - An Intel-clone PC running from a 386 to a PII (Linux is readily available
    for other platforms, such as the PowerPC, Alpha, and San Sparc).

    - At least 8MB of RAM (Linux can technically run on a 386 with 4MB of RAM, and
    while this is sufficient for many applications, running such applications as X
    and the GIMP tends to require a little more horsepower in order to be productive.
    I recommend at least a Pentium 100 with 16MB of RAM to work comfortably, regardless
    of software.)'
  merge: -1
  img_proc: true
