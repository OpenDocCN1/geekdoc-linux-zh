- pgno: 312
  md: '![](img/0183f053b347a6407a2381be231d0345_312_0.png)


    # HOUR 22


    Script-Fu is a powerful tool; using it effectively can entail a lot more than
    simply running a script. This hour is meant as a brief introduction into the wider
    world of Script-Fu and development, if you should opt to traverse that path. Overall,
    it is really quite a complex topic that deserves in-depth documentation of its
    own, which is beyond the scope of this book. This hour introduces some of the
    more specialized uses of Script-Fu.


    # Using Script-Fu in Combination with Your Own Effects


    When you execute a script from within the GIMP, you are doing nothing more than
    issuing a sequence of commands for GIMP to execute. Needless to say, there are
    probably some scripts that don''t fit exactly with what you are trying to do.
    so would be nice if you could take what script has produced and do a little tweaking.
    Well, there is absolutely nothing stopping you from doing so! In fact, most scripts
    in the GIMP leave their output data in layered format so that it is easy to take
    what has been produced and create some alterations and customizations.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# Dissecting the Image


    Because many of the output images of these scripts are still layered, it is really
    a simple matter of taking a look at these images and deciding on any alterations
    you might want to apply. For example, the Glossy script uses a few layers; the
    top layer has the screen Blend mode property, which allows the lower layer to
    show through. In this example, I manipulated each layer individually to create
    a completely different effect. By filling the second layer with black, blurring
    it, and changing the properties of the top bottom layers, this image now has a
    completely different tone (see Figure 22.1). I more or less used the output of
    the script as a template to help create an effect I


    # Figure 22.1


    Just because Script-Fu gives you a result doesn''t mean that you have to stick
    with it. Having the finished product in a layered format gives you a lot of flexibility.


    ![](img/0183f053b347a6407a2381be231d0345_313_0.png)


    As another example (see Figure 22.2), I used the Engver script and merged the
    text layers into one by right-clicking, Layers, Merge Visible Layers, making sure
    to unlock the Eye icons on layers I did not intend to merge. Then I used Bump
    Map with a copy of the text layer (filled with white and Gaussian blurred at 7)
    as a map, added a drop shadow, and again, the result is drastically different.


    # Figure 22.2


    Sometimes it''s fun to alter the effects by hand when the standard results get
    a little worn.


    ![](img/0183f053b347a6407a2381be231d0345_313_1.png)'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# Script-Fu as a Tool


    Script-Fu is not meant to be used alone; it is meant to be an aid to augment your
    graphics techniques. They can, in fact, be great tools for assisting you in creating
    the effects that you routinely encounter and for becoming just one step in the
    entire image creation process. The following examples are meant to give you some
    ideas as how scripts can fit in a tool, not just a filter or simple image generator.
    (Which is really helpful in respect to those amazing animation scripts that are
    covered in Hour 23, "Animations.")


    # Brushes Revisited


    Want to make a brush quickly? Earlier in Hour 4,"Using Brushes and Patterns in
    Depth," you learned how to create a brush by hand The Two Brush script that greatly
    simplifies this task. After you have an image open, right-click, to go to Script-Fu,
    Selection, To Brush, and whichever you have selected in your active layer will
    be saved in your ~/.gimp/brushes directory as a brush. This script, then, is a
    tool for convenience (Figure 22.3).


    FIGURE 22.3


    Creating a GIMP brush is a snap with the assistance of this script.


    ![](img/0183f053b347a6407a2381be231d0345_314_0.png)


    # Rounded Selections


    Sometimes you want to create a shape that is neither a rectangle nor a circle,
    but instead a shape that lies somewhere in between. This shape is a little difficult
    to perfect by hand, but is a breeze with the magic of scripting.


    +   - First of all, you will want to create a rectangular selection that approximates
    the desired area (see Figure 22.4).

    - Then right-click, and go to Script-Fu, Selection, Round. Voila! Your shape takes
    on a more elegant form (see Figure 22.5)'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# FIGURE 22.4


    Selecting the general area.


    ![](img/0183f053b347a6407a2381be231d0345_315_0.png)


    # FIGURE 22.5


    The selection becomes a little more distinct. This is actually more difficult
    to do by hand than it might appear.


    ![](img/0183f053b347a6407a2381be231d0345_315_1.png)


    +   - Now that you have the shape more or less in place, the rest is up to you.
    In this example (see Figure 22.6), a nice, Web header was created using the Gradient
    tool as a base texture, the Bump Map filter for depth, the Text tool (again, with
    Bump Map, and the Screen Blend mode), and the Drop Shadow script. In essence,
    the script was used to help enhance script.


    # FIGURE 22.6


    After the shape is in place, adding the refinements is a matter of taste.


    ![](img/0183f053b347a6407a2381be231d0345_315_2.png)'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# More with Script-Fu


    You can use this tool, with the acquisition of many more shapes in your selection,
    to come up with more organic shapes, which are great for things such as logo planchets
    and Web navigation consoles.


    # Script-Fu—A Look Ahead


    Now that Script-Fu is becoming pretty familiar, taking a look at what makes these
    things tick internally can be a worthwhile endeavor if you have such an inclination.


    If you are a developer and want to mess around interfacing with GIMP, chances
    there is a supported language that you are familiar with. Some of the interfaces


    +   - Gimpcl (TCL/Tk)

    - GimpJava

    - Gimple (GNU Guile)

    - GIMP-Perl

    - GIMP-Python


    I''m sure there are more that I neglected to mention. And, of course, some are
    bound to be more steady and stable than others based on their stages of development
    and completion. As always, you can find and download these options from registry.gimp.org.


    ![](img/0183f053b347a6407a2381be231d0345_316_0.png)


    > One caveat: if you do opt to develop scripts with one of these other interfaces,
    you should keep in mind that sharing them with others might be a little difficult
    to do because people might not have all the required components needed to run
    your scripts. This, of course, depends on the release of the GIMP they have installed,
    and how diligent they are on keeping up with the latest plug-ins and patches.
    Nonetheless, if you are already a Perl user, for example, then it might be an
    easier task for you to draft some scripts for GIMP.


    Developing scripts themselves, while not necessarily an easy task, can be a rewarding
    one if you aren''t uncomfortable with programming and scripting entirely. One
    of the easiest to get started is to open up some of those SCM files with your
    favorite text editor and take a peek. Looking at other people''s code, talking
    to other script writers, and reading some SCHEME materials should set you on your
    way to writing high-quality scripts that everyone can enjoy. If you are itchin''
    to start writing scripts for GIMP, I'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'suggest that you pay to visit to a fantastic site: Mike Terry''s Black Belt
    School Script-Fu, at http://www.soulfry.com/script-fu-tutorial/. This is an excellent
    beginner''s resource for the would-be scripter.


    # Procedural Database


    This will probably only be of interest to you if you are a scripter. This plug-in
    interface for SCHEME development (see Figure 22.7). Select Xtns, Script-Fu, Console.
    I won''t get into its subtleties, suffice to say that it is a wonderful loop-back
    device for the developer to take in some tests. (For an example, (+ 3) and see
    what you get.)


    FIGURE 22.7


    This is a interface for the GIMP developer tested.


    ![](img/0183f053b347a6407a2381be231d0345_317_0.png)


    # Net-Fu


    Net-Fu is something that has interesting possibilities for the future of GIMP
    utility. It is an interface that lets GIMP accept commands from over a network.
    Net-Fu lets you work remotely within the GIMP and still come with some interesting
    effects. This can be useful if, for example, you are trying to create images remotely
    on a non-UNIX machine; truly Net-Fu is for the most part something that be fun
    to play with the developer''s perspective. I mention it here to illustrate some
    of the things GIMP will likely be capable of as developers lend their support.
    In this point in time to make a proof of concept that a useful application. It
    will be exciting to see what kind of clever applications come up with in the near
    future. GIMP has a lot of room to expand into areas not previously considered.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# More with Script-Fu


    For a good, real-life example of Net-Fu in action in an application, check out
    http://www.cooltext.com/.


    It is possible to set Net-Fu to accept remote commands and create a Web-based,
    Java-based, or a native front end to Net-Fu (see Figure 22.8). Be warned, however,
    this is not an easy task to achieve, and is definitely not for the faint of heart!
    To quote the Net-Fu README. "Installing this stuff is not fun!" But if you do
    to set up your machine as a Net-Fu server and do some experimenting with the possible
    client/server applications GIMP can handle, there are some good resources at text.com
    to help you get started.


    # 22.8


    Telling GIMP what TCP port to listen to for remote connections. At least that
    part is easy.


    ![](img/0183f053b347a6407a2381be231d0345_318_0.png)


    # Summary


    Using Script-Fu as a tool in combination with your own graphics techniques is
    something that will just kind of bump into you when you''re looking to create
    certain effect and a script seems to fit that purpose perfectly. Keep at it! Don''t
    forget to check up with gimp.org often to keep track of any new scripts that might
    be out for you to devour.


    # Q&A


    +   - Can I get a script to run from the command line without X?


    +   - Yes. Of course, this is a difficult task; it is really good for scripted
    tasks and requires a coder''s touch (for now). Read the Net-Fu documentation for
    details. If you''re looking for a way to convert image formats in batch mode,
    for a number of unattended files, a better way is to use the ImageMagick suite
    of utilities, which complement GIMP nicely. The Imagemagick man pages can point
    you in the right direction.


    # Exercise


    Begin on an image project that will be somewhat intense and heavily layered. See
    if some scripts can fit in somewhere to make the steps, and consequently, your
    entire project, a little easier. Sure, necessity is the mother of invention, sometimes'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'inventions are created with the specific purpose of looking for a problem to
    solve. And in looking for such problems, it is easy to come across new ways of
    doing things that might not have previously been considered, but are later regarded
    as indispensable.


    Also, if you want to forge ahead the prospect of tinkering with script internals,
    again, the best way to do this is to tinker with other people''s scripts. For
    example, if there is a text logo script that you''d like to behave a little differently,
    chances are you will find it relatively painless to alter the script itself to
    do what you want—even if you are a non-programmer—simply by studying the syntax
    and context.'
