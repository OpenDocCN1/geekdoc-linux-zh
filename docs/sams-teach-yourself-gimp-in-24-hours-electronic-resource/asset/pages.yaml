- pgno: 126
  md: '![](img/0183f053b347a6407a2381be231d0345_126_0.png)


    # HOUR 8


    # # Introduction to Layers


    Layering is one of the most powerful and versatile features a graphics program
    can possess, yet it can be confusing until you understand exactly how it works.
    After you grasp the basic concept and learn to put this feature to work for you
    in practical applications, you will realize what a fantastic tool it can be for
    manipulating images, and will undoubtedly find yourself using layers on practically
    every image from this point!


    In this hour, you are going to learn the fundamental steps of layering—what layers
    are, how they work together, and how you can use them to create some unique art
    effects.


    The first portion of the hour is focused on an introduction to basic layering
    tools and concepts, and during the second part of the hour you will proceed to
    layering some simple images, progressing toward more advanced hands-on layering
    techniques in the next hour.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# What Are Layers?


    Because layers are unique to graphic arts, there is not really a perfect analogy
    to describe them. Try to visualize each layer as a transparent sheet containing
    one portion of an image, which can then be stacked with other sheets, each having
    the capability to be moved, edited, rearranged, and manipulated independently.
    After the desired result is achieved, all layers can be merged into a single image.


    To understand this, let''s look at it from a slightly different perspective. Let''s
    say you are an artist working on an oil painting. For the first part of your painting,
    you''ve painted in a glorious blue hue and an awe-inspiring mountain range. You''ve
    spent hours upon hours getting those mountains to look just right. Your painting
    is far from finished, but now you''re getting nervous about adding anything to
    it because you don''t want to spoil your beautiful background. You think to yourself,
    "If I only could paint the rest of the picture on another canvas until I have
    just the way I want it, and then place it over my mountain range and magically
    blend the two together! Well, as we know, oil paintings do not work that way,
    but that is precisely what you can achieve with digital art when you''re using
    a graphics program with layering capability such as the GIMP.


    Sounds pretty cool, doesn''t it? Let''s get started.


    # The Layer Dialog Box


    Each time you open a new image, it automatically consists of one layer, the background
    layer. Think of the background layer as your canvas. Open a new blank image and
    right-click on it to bring up Layers. Go to the menu. As you will notice, layering
    functions are listed in the menu. Click Layers and Channels to bring up the Layer
    & Channels dialog box, as in Figure 8.1.


    Figure 8.1


    Every image has at least one layer.


    ![](img/0183f053b347a6407a2381be231d0345_127_0.png)'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# Introduction to Layers


    Begin looking at the dialog box under the Layers tab and work your way down to
    understand the functions.


    +   - Mode—This refers to blend modes, and leads to a drop-down menu listing the
    many blend modes available. Blend modes enable blending of the pixels of different
    layers in various ways. The blend modes will be covered in more detail when you
    get to the advanced layering techniques.

    - Keep Transparent—When you have placed an image of any kind into a transparent
    layer, the Keep Transparent function will restrict any editing of the transparent
    layer. Changes or alterations will only affect the nontransparent portion.

    - Opacity—This enables you to set the opacity for each individual layer. With
    the slider set to 0, the layer becomes totally transparent. you can see through
    the layers underneath. At 100, it is totally opaque.


    # Adding and Deleting Layers


    Notice the row of buttons with icons along the bottom of the dialog box.


    The far-left option is the Add Layer option. Clicking this will bring up the new
    layer options, as in Figure 8.2. You can add a blank layer in your choice of transparent,
    white, or background color. The size automatically defaults to match the size
    of the existing image. Here you can also give your new layer a name. When you
    are working with layers in one image, it''s helpful to give them identifying names
    to easily recognize them. If you choose not to name them, they will default to
    layer numbers, such as Layer 1, Layer 2, and so forth.


    Figure 8.2

    Name your layers to help identify them at glance.


    ![](img/0183f053b347a6407a2381be231d0345_128_0.png)


    > If you forget to name a layer or decide to change the name, double-click on
    the name to bring up a naming dialog box.


    ![](img/0183f053b347a6407a2381be231d0345_128_1.png)'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'The next two buttons are used for moving an active layer either up (placing
    on top of the other layers) or down (under other layers). To activate a layer,
    click on the layer name or thumbnail image of the layer you want to move and apply
    the Up or Down button.


    The fourth button, with the icon that resembles two sheets of paper, can be used
    to make a duplicate of the active layer. If you have a layer that you don''t want
    to risk messing up by by making unalterable changes, click this button and make
    a duplicate copy to work with.


    ![](img/0183f053b347a6407a2381be231d0345_129_0.png)


    Each individual layer is like an individual image. Most changes to a layer can
    be undone by right-clicking on the image and selecting Edit, Undo, or by pressing
    Ctrl+Z, just if you were working on a non-layered image.


    The next button, appearing as an X, is the Delete function. By pressing this button,
    the active layer will be removed from the image.


    The last button, resembling an anchor is (you guessed it!) to anchor (or permanently)
    set a floating selection within the layer. Anytime you place a text string or
    other active selection in the layer, it acts as a floating selection with flashing
    marquee—until you anchor it to the layer.


    # Selecting and Moving Layers


    On the left of the Layers and Channels dialog box, you will see an eye symbol.
    This indicates that the particular layer is visible. By clicking on the eye, thereby
    removing it from view and disabling it, the layer can no longer be seen. Click
    again to bring back the eye and your layer will be visible again.


    Click just to the right of the eye and you will find an icon resembling the Move
    tool (see Figure 8.3). Normally, each layer can be moved or edited independently
    of the others. By activating this symbol on two or more layers at a time, these
    layers can be moved or edited as a unit.


    Next is the thumbnail image and name of each individual layer. The layer highlighted
    in blue is active.


    ![](img/0183f053b347a6407a2381be231d0345_129_1.png)


    You can change the size of the dialog window thumbnail images by selecting File,
    Preferences, Preview, in the toolbox. You can set the thumbnails to small, medium,
    or large. You can also turn the thumbnails off completely if you prefer.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Introduction to Layers


    Figure 8.3


    When the Eye icon is activated, you can see the layer. The four-pointed arrow
    resembling the Move tool can lock together to be moved as one.


    ![](img/0183f053b347a6407a2381be231d0345_130_0.png)


    ![](img/0183f053b347a6407a2381be231d0345_130_1.png)


    # The Layer Dialog Menu


    In the Layers & Channels dialog, right-click on the thumbnail image or name of
    the layer to bring up the Layer dialog menu, as in Figure 8.4.


    Figure 8.4


    The Layer dialog menu has a few options to consider.


    ![](img/0183f053b347a6407a2381be231d0345_130_2.png)


    The New, Raise, Lower, Duplicate, Delete, and Anchor Layer buttons just perform
    the same if it is activated or if using the dialog box icon symbols for these
    functions.


    Scale and Resize function in the same capacity as the Scaling and Resizing options
    you learned about in Chapter 6, “Transformations.” The only difference is that
    here, the scaling or resizing is applied to one or more layers.


    Merge Visible works by allowing you to merge only the layers with the eye activated,
    indicating their visibility. When you are working with a very large image or one
    that contains many layers, it can be extremely memory-intensive because your computer'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'coping with the image information contained in each separate layer. The merge
    visible function enables merging of the layers that you have already completed
    work on, freeing up some of that precious memory. When you choose to merge visible
    layers, an options box will appear where you will see the following choices:


    +   - Expanded as Necessary—This option is used in a situation where some layers
    are smaller than others, usually due to resizing or scaling down after adding
    the layer. This will adjust the resulting merged layer to include all image areas.


    +   - Clipped to Image—This option works by clipping out any extraneous areas
    surrounding the merging image area, such as a case where layers have been resized
    to be larger than the original image.


    +   - Clipped to Bottom Layer—This option clips the merging layers to the same
    dimensions as the bottom layer.


    ![](img/0183f053b347a6407a2381be231d0345_131_0.png)


    > For the most part, you will probably create all the layers in an image to match
    the dimensions of the background layer. If you try to copy and paste an image
    or selection that is larger than the layer being pasted into, it will be automatically
    cropped to the size of the layer you''re pasting into.


    Flatten Image is the command used to merge layers of an image. By flattening the
    layers, you will have just one merged image and lose all layer capability and
    information. You are required to flatten an image before it can be saved in any
    format other than XCF, which is the native GIMP format that allows saving with
    layer capability intact. Make sure that you are completely finished editing your
    layers before flattening and saving in another.


    > If you are working on an image that might require further editing, but need
    a copy to save in a format other than XCF, right-click on the layered image, and
    select Edit, Copy Visible. This copies all visible layers into the Clipboard,
    and then they can be pasted as one into a new blank image and saved in your choice
    of format. Save the original as XCF, and the layers will be intact for making
    changes later.


    The remainder of the options found in the layer dialog menu are used when working
    with masks and alpha channels, which will be discussed in Hour 10, "Using Masks."'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Introduction to Layers


    # Aligning Layers


    There is one more option that I would like to briefly touch on before the tutorials
    begin.


    Align Visible Layers can be found by right-clicking the image and viewing the
    layers menu. This option is used for positioning layers in an extremely precise
    manner. By activating the Align Visible Layers option in the menu, a dialog box
    will appear containing many alignment settings to choose from, as in Figure 8.5.


    Figure 8.5

    Layers can be aligned in a variety of ways.


    ![](img/0183f053b347a6407a2381be231d0345_132_0.png)


    Each alignment option also has a drop-down menu containing even more detailed
    alignment settings. For example, you can choose not only to align all visible
    horizontally, but you can also specify where the alignment should be in relation
    to the image, such as left, right, or center.


    For most image editing, you will not need the precision alignment offered here,
    but you will find it to be a valuable addition to layering especially when creating
    and editing animations.


    # Tutorials


    I''ve heard it said many times that experience is the best teacher, and I believe
    that wise saying is the absolute truth. By working your way through the following
    tutorials, you will be able to see layering in action and understand just how
    easy and incredible it is really.


    For these lessons, you will need images located in the exercise folder on the
    CD-ROM that comes with this book, or you can use similar ones of your own you
    have them.


    # Lesson 1—Basic Layering


    To begin, open the images lion.jpg and moon.jpg, as shown in Figure 8.6.'
  merge: -1
  img_proc: true
- pgno: 133
