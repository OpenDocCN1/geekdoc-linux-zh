- pgno: 280
  md: '# HOUR 20


    # Using More Plug-ins and Extensions


    In this hour you will acquaint yourself with some of the more complex plug-ins
    that behave differently than mere graphics filters, and I will illustrate just
    how beneficial they can be.


    The plug-ins in this hour can be found in the Filters, Render menu, as well as
    in the Xints menu. They are like mini-applications embedded in GIMP, and can therefore
    achieve a level of complexity like no simple filter can.


    The main difference between these plug-ins and those labeled as filters is that
    these do more than just alter images. In fact, many of them will help you create
    new images and patterns from scratch, among other things. Other than that, though,
    they work in much the same way as anything else you will encounter in the GIMP.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# Gfig


    Gfig is a very interesting application, and a very well one. Gfig is a robust,
    self-contained drawing program used for the design and implementation of perfect
    geometric shapes and patterns. It was inspired by the popular UNIX application
    Xfig. Working with this tool within the GIMP environment is much more useful and
    convenient, in my opinion.


    To invoke Gfig, go to the right-click menu from any (preferably cleaned and layered)
    image and find Filters, Render, Gfig. You will now see the Gfig interface, as
    shown in Figure 20.1. This is where the fun begins! To render a simple shape,
    select a preset pattern from the left in the Shapes list item box.


    # FIGURE 20.1


    This is the initial view from Gfig. As you can see, it is apparently complex plug-in.


    ![](img/0183f053b347a6407a2381be231d0345_281_0.png)


    Looking at the dialog box, you will see a drawing area on the left and an Object
    area to the right. You can load and save custom objects. The Object area is where
    you can save your pattern after you paint it onto your image, but if it is good,
    you might want to save so you won''t have to duplicate it in the future.


    Drawing common shapes in Gfig is a snap. The first thing to do is to get a clean
    palette in the drawing window. You do this by clicking New in the Object area.
    There will be a highlighted area indicating your saved object. Double-click to
    name and save it (they are saved as files in ~/.gimp/gfig/). Later, if you want
    to work on it some more, you can find it in the list. Right-click and select Edit
    (or click the Load button for figures not in the ~/.gimp/gfig directory). You
    can also merge two objects into one by finding'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# Using More Plug-ins and Extensions


    an object, clicking Edit, and then finding another drawing and clicking the Merge
    button.


    Now let''s say you want to draw something simple, such as a star. All you need
    to do start with a clean slate and select the kind of shape you want to draw from
    the panel of choices in the Ops toolbar. Obviously, you would select the one that
    says Star. Now, if you click and drag over the preview window, you will see a
    star shape (refer to Figure 20.1). This is much easier than simply drawing by
    hand!


    These tools on the left have many options as well. For example, you do not want
    to be stuck with a four-sided star but to draw a six-sided one. To take a look
    at all the available star options, all you need to double-click the Star button.
    This will bring up a dialog box with all available star shapes, as in Figure 20.2.


    # Figure 20.2


    Gfig has options for each function that you will probably ever use. (Often do
    you need to draw a 100-sided star? It''s still great to have it able though!)


    ![](img/0183f053b347a6407a2381be231d0345_282_0.png)


    After you draw your shape, you might want to move and resize it to get it just
    so. If you look at your shape, you will notice hollow rectangles placed on the
    outline. These are your control points; they enable you to control the size and
    position of your object. By clicking on the Move button, and then repositioning
    your cursor over a control point, you can now move the shape anywhere you want.
    Likewise, using Mvpnt will move only one point at a time, resizing and reshaping
    your object. Using the Copy option will create an exact duplicate of the object,
    which you can drag into any position. The control point behavior is a different
    for each shape. For a star usually has three control points, one in the center
    for moving, and two others, each corresponding with the outer and inner points
    in the star.'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# Hour 20


    If you need to get a closer or removed view of what you''ve just drawn, you can
    use the slider next to the Scale to Image option in the Paint tab to zoom in or
    out (You need to uncheck the option first). You can then recheck the Scale to
    Image button to restore the original view.


    After you your shape, you can paint it onto your canvas. Gfig uses the standard
    GIMP brushes in order to do this. Go to the Brushes tab and select the brush you
    want to use. (Click the Paint button to draw the shape using the FG color and
    brush you selected. Make sure to save your shape in the Object list if you want
    to use it).


    There are a few more options to consider when painting your image. In the Paint
    tab (shown in Figure 20.3), you can set the tone for the way which Gfig paints
    your image. Using the drop-down menu determines what sort of drawing you will
    have. Brush uses the standard brush method to outline your shape; selection+Fill
    will paint your selection according to the Select tab options, which resemble
    the Fill options. Furthermore, the Draw Option will let you paint your image on
    one of three canvases: Original paints the object directly onto your image, New
    paints onto a new layer, and Multiple paints each part of your object (having
    unique control points) onto a separate layer.


    # FIGURE 20.3


    You can manipulate the size, shape, and position of your object by using control
    points.


    ![](img/0183f053b347a6407a2381be231d0345_283_0.png)'
