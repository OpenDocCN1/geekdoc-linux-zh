- pgno: 113
  md: '# FIGURE 7.11


    Saving the image as a transparent GIF.


    ![](img/0183f053b347a6407a2381be231d0345_113_0.png)


    # Other Color Options


    Many color options are available by right-clicking the image and going to Image,
    Color. I''ll introduce some of them briefly here.


    # Equalize


    The Equalize function tries to adjust and correct images that are too washed out
    or too dark. It is done by setting the darkest pixels to black and the lightest
    ones to white and adjusting everything else in between (see Figure 7.12). Sometimes
    this actually works. Of course, if you''re like me, you might find this function
    more useful as a graphic filter than a photo repair tool. Sometimes, it can give
    your image that certain look''s right...even if it is a bit odd.


    # FIGURE 7.12


    Equalize can correct photos or simply add a strange effect to your images.


    ![](img/0183f053b347a6407a2381be231d0345_113_1.png)'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Working with Color


    # Posterize


    Posterize reduces the color depth of your image—but in a different way than normal
    indexing does. It does it by using a number called the Posterize level. This level
    determines the number of colors used—the lower the level, the lower the number
    of colors used. It''s a function to play with (see Figure 7.13).


    # Figure 7.13


    The posterize function reduces the quality of your image; used sparsely; it can
    be a cool effect in and of itself.


    ![](img/0183f053b347a6407a2381be231d0345_114_0.png)


    # Threshold


    This dialog box, shown in Figure 7.14, shows a graphical representation of the
    amount of brightness within an image. Each line from left to right represents
    a certain brightness value. The higher value, the more pixels are with that particular
    level of brightness. You can then select a range of lines within the dialog box
    and watch what happens. Only the pixels with a brightness value within the selected
    range are turned completely, whereas pixels outside the range of selected values
    are turned black. Used within a reasonable range area this can increase the contrast,
    intensity, and, subsequently, the quality of those slightly faded images.


    # Color Balance


    By using Color Balance, you can alter the colors of your entire image by affecting
    the pixels towards the values represented at the end of the sliders (see Figure
    7.15). The Preserve Luminosity option keeps your image from changing its brightness,
    which otherwise tends to happen with this tool.


    ![](img/0183f053b347a6407a2381be231d0345_114_1.png)'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# FIGURE 7.14


    Threshold lets you display portions of your image according to brightness.


    ![](img/0183f053b347a6407a2381be231d0345_115_0.png)


    # FIGURE 7.15


    The Color Balance dialog box is where you can quickly adjust color in your image
    in subtle ways.


    ![](img/0183f053b347a6407a2381be231d0345_115_1.png)


    # Brightness/Contrast


    You can adjust the relative brightness and contrast of any image with this tool
    in the same way that you would adjust the brightness and contrast on your monitor
    (see Figure 7.16).


    # FIGURE 7.16


    This tool is self-explanatory.


    ![](img/0183f053b347a6407a2381be231d0345_115_2.png)


    # Hue/Saturation


    The tool shown in Figure 7.17 enables you to adjust the relative color of your
    image quickly and drastically. The Master option enables you to alter all pixels
    in the entire image at once, clicking on any color option will enable you to change
    only those pixels within that certain color range.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Working with Color


    # Figure 7.17


    The lightness option in this dialog box is synonymous with value in the HSV color
    model.


    ![](img/0183f053b347a6407a2381be231d0345_116_0.png)


    # Curves


    This tool lets you change the colors and values of your image by manipulating
    a graphical representation of your image''s colors (see Figure 7.18). It is quite
    a complicated tool, but when you play with it enough, chances will you find it
    useful. It lets you change the brightness and hue at any point by dragging the
    curve around freely. The curve itself represents your image''s RGB values.


    # Figure 7.18


    The curve tool is both very handy and complex at the same time.


    ![](img/0183f053b347a6407a2381be231d0345_116_1.png)


    The value option in the drop-down menu refers to altering all three RGB colors
    of the same time. (Not value meaning brightness, as in HSV. This tool deals strictly
    in RGB.) You can also deal individually with red, green, and blue.


    Why would you use this tool instead of the Hue-Saturation dialog box? Well, this
    gives you much more control. By changing the Curve Type to Free instead of Smooth,
    you can now move your curve every way to achieve all sorts of funky color effects.
    By inverting a curve, for example, you can invert the image. Likewise, by creating
    a parabola out of the curve, you can create a cool solarized effect that might
    be useful somewhere. In any case, the best way to figure out this tool is simply
    to play with it.


    ![](img/0183f053b347a6407a2381be231d0345_116_2.png)'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'By the way, always make sure that the Preview option is checked, so you can
    observe what this tool is doing to your image while it does it.


    # Levels


    Unlike the Threshold tool, the tool shown in Figure 7.19 lets you alter the amount
    of brightness and saturation your RGB values have by adjusting the range of values.
    By moving the arrows at the bottom, you can adjust the brightness and contrast
    output of your pixels. This way, you can enhance or subtract the brightness and
    shadow properties in any part of an image you choose. By moving the black arrow
    to the point where your lines begin to group together, and doing the same thing
    for the white arrow, you equalize your image''s values to the point where your
    image is not quite muddy. It''s a good clean-up tool, as well as an effect tool.


    # Figure 7.19


    The Levels tool lets you your image''s brightness and contrast properties by manipulating
    a histogram.


    ![](img/0183f053b347a6407a2381be231d0345_117_0.png)


    # A Few Others


    Desaturate—Converts your image to grayscale, without actually reducing the color
    depth, so you can still apply color to the image.


    Auto-Stretch Contrast—This tool enhances the contrast and brightness of the RGB
    values of an image by stretching the lowest and highest values to their fullest
    range, adjusting everything in between. This is noticeable only with washed-out
    images and can be a good fix-it for bad photographs.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# Working with Color


    Auto-Stretch HSV—The same as the previous tool, except that it adjusts the HSV
    values to their fullest extent. Used for the same purposes, too,


    Normalize—Does the same thing as the Auto-Stretch tools, but not so drastically.
    It does this by only stretching the values as a whole, and therefore keeping the
    relative color balance intact. This is perhaps the most useful "washout fixer"
    tool, because it will not disturb the colors otherwise.


    # Gradients


    Gradients are a concept presently found in other graphics applications, but no
    other program I have come to contact with even begin to compare to the intensive
    and extremely powerful use of gradients that the GIMP gives you access to. This
    is really one area that distinguishes the GIMP and makes it a killer app. With
    it, you can add realism to your graphics that will never cease to amaze.


    A gradient, defined in the simplest of terms, is the transition from one color
    to another. So a basic gradient is a transition from black to white. Pretty elementary
    stuff. But the GIMP takes it way, beyond that. Not only does it enable you to
    place gradients in a variety of positions and shapes, but also more than two colors
    (any number you can handle), including transparencies. Now this is too cool, as
    I will later demonstrate. But for now, start with something simple.


    In this first tutorial, you will create a simple beveled button with a metallic
    look.


    +   Create a new image. This can have any color background you want, although
    transparent is preferred if you''re going to save it as a GIF. After you have
    a blank canvas, you can start by selecting a rectangular area with the rectangular
    Select tool.


    +   Now that your selection is made, as in Figure 7.20, fill it in with a simple
    gradient. To this, you first need to get the colors you like them. For this example,
    I used the default black and white, although you are perfectly free to use any
    colors you want. Then double-click the Gradient tool icon to bring up the Tool
    Options dialog box. (You can also do this by going to File, Dialogs, Tool Options
    on the toolbox.) In the Tool Options dialog box, make sure the Gradient drop-down
    menu is set on Linear, as shown in Figure 7.21.


    ![](img/0183f053b347a6407a2381be231d0345_118_0.png)'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# FIGURE 7.20


    Making the first selection.


    ![](img/0183f053b347a6407a2381be231d0345_119_0.png)


    # FIGURE 7.21


    The Tool Options dialog box gives you access to a few gradient options. In this
    example, you use the Linear option.


    ![](img/0183f053b347a6407a2381be231d0345_119_1.png)


    +   You can make your gradient. Click the lower-right part of the selection, and
    drag the selection tool line to the upper-left corner of the selection. This makes
    a gradient from black to white, going left to right, in a diagonal fashion, as
    shown in Figure 7.22.


    # FIGURE 7.22


    The gradient is made neatly within the confines of the selection.


    ![](img/0183f053b347a6407a2381be231d0345_119_2.png)


    +   Now activate the rectangular Select tool again, and click the selection to
    deactivate it (which you can also do via right-click, Selection, Anchor). Now
    you will want to make a new selection to reflect an inner raised portion of the
    button. Make the selection inside the range of the old one, equidistant from the
    edges of the previous selection.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Working with Color


    5. Click the upper-left corner this time, and drag to the lower right. This will
    create an opposite style gradient, and give your button a bold, metallic sheen,
    as shown in Figure7.23. You can now put it in text, reduce it to indexed color
    depth, and save it as a GIF.


    # FIGURE 7.23


    By making your selection only a few pixels from the edge of the previous selection
    and inverting your gradient, you have managed to create a solid metallic look.


    ![](img/0183f053b347a6407a2381be231d0345_120_0.png)


    This tutorial showed an example of using the simplest kind of gradient. Now you
    will want to get a bit more complex with it. You can start by changing the shape
    of the gradient.


    +   1. Create a new image and a selection of some kind. Then in the Tool Options
    dialog box, you will see many gradient shapes under the Gradient option. Select
    Bi-Linear and apply it to your selection. As you can see in Figure 7.24, this
    creates a gradient that starts from where you began to draw with the Gradient
    tool.


    # FIGURE 7.24


    Creating a bilinear gradient.


    ![](img/0183f053b347a6407a2381be231d0345_120_1.png)


    +   Now click the Radial option and apply it to your image. Now you can see, as
    in Figure 7.25, how it applies the gradient beginning from your initial cursor
    position.


    Of course, one of the coolest features of the Gradient tool is its capability
    to go from one color to a transparency by selecting Transparent FG from the Blend
    menu in the Tool Options dialog box, as in Figure 7.26.


    ![](img/0183f053b347a6407a2381be231d0345_120_2.png)'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# FIGURE 7.25


    Radial gradients are great for creating lighting effects.


    ![](img/0183f053b347a6407a2381be231d0345_121_0.png)


    # FIGURE 7.26


    Gradients can also fade into transparency. This is a great feature for enabling
    parts of your selections to come through unaffected by the gradient.


    ![](img/0183f053b347a6407a2381be231d0345_121_1.png)


    FG to Transparent is also really handy for adding a light or shadowy feel to an
    object or environment. And you can reduce the opacity in the Tool Options dialog
    box to create enough effect without disturbing the composition of your image.


    In the Gradient drop-down list, there are also three Shapeburst options, which
    do nearly the same thing. They make gradients from the middle of a selection to
    the outer edge, regardless of shape or size. This is pretty evident on text. Here''s
    how to do a quick ‘n’ nifty text effect:


    +   1. Make a text selection using the Text tool and leave it unanchored.

    2. After selecting your colors, drag the tool inside the selection from the inside
    to the edge, and watch the magic happen, as shown in Figure 7.27.


    # FIGURE 7.27


    Adding more texture to any shape is easy with this gradient effect.


    ![](img/0183f053b347a6407a2381be231d0345_121_2.png)'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Working with Color


    # Gradient Editor


    Now you''ve come to the good stuff—the Gradient Editor (see Figure 7.28). This
    tool makes it all worthwhile. It enables you to move beyond one color and make
    custom gradient using any combination of colors you choose. Using these gradients
    makes it possible to generate photo-realistic lighting and shadow effects, landscape
    effects, and a plethora of other things.


    To get to the Gradient Editor, go to File, Dialogs, Gradient Editor in the toolbox
    menus.


    # FIGURE 7.28


    The Gradient Editor gives you access to all kinds of advanced functions.


    ![](img/0183f053b347a6407a2381be231d0345_122_0.png)


    After you have the Gradient Editor open, as shown in Figure 7.28, you can scroll
    through a list of predefined gradients and they will be previewed in the box at
    the bottom. After you have selected a gradient, you can apply it to your image
    by going to the Tool Options dialog box and selecting Use Custom Gradient from
    the Blend pull-down menu.


    After you have selected a custom gradient, there are all kinds of nifty options
    to play with. You can alter any of the colors in the gradient simply by right-clicking
    on an active segment and selecting Left Endpoint''s Color or Right Endpoint''s
    Color. This brings up the Color dialog so that you can alter the color. An active
    segment is any segment between black arrows that is a darker shade of gray. You
    can activate any segment you want and move the segments around with the black
    arrows to change the shape and feel of your gradient. The white arrows represent
    segment midpoints, and changing their position won''t move the segments but will
    alter the segment color balance.


    You can create a new gradient by clicking New Gradient. Learning this powerful
    editor and all its options can be tricky, but it is very useful and is of those
    things that is best learned by experimentation.


    But wait...there''s more!'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'That''s right. Now scroll down the list of gradients until you come across
    one named Burning Transparency. Now you can see that one of the active gradient
    colors is transparent. You can use these gradients for nifty lighting effects.


    +   1. Start a new blank image or use an already existing one if you like. Now
    make sure that your favorite gradient is selected in the gradient editor.


    +   2. Now that you''ve got that, you should select the opacity Custom (From Editor)
    in the Blend-down menu in the Tool Options dialog box for the Gradient tool.


    +   3. Now draw your gradient. To make it more like a lighting effect and not
    overpower your image, you should set the opacity of the gradient at no more than
    50% in the Tool Options dialog box. This fades the gradient into your image with
    varying degrees of opacity.


    FIGURE 7.29


    One of many custom gradients in action.


    ![](img/0183f053b347a6407a2381be231d0345_123_0.png)


    +   4. You can now try it with different gradient schemes. For example, using
    the radial gradient from within a source of light will give you a cool lens flare
    effect. Using the bilinear gradient gives an object more depth, and using the
    Shapeburst sometimes looks cool.


    # Summary


    Gradients can help you do a lot of really cool things. Now that you''ve had an
    introduction to them, I invite you to play around with them as much as you can.
    You will visit gradients yet again, especially in combination with the GIMP''s
    powerful layering capabilities, in later hours.


    As far as the color models go, the GIMP mainly uses RGB, HSV, Indexed, and Grayscale.
    However, if you need along the way to do a little prepress, it is a good idea
    to understand CMYK so you''ll know the differences between print and digital media.
    Doing professional quality print and prepress with the GIMP is not terribly difficult
    with a little knowledge and preparation.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Working with Color


    # Q&A


    +   If I reduce my color depth to grayscale, can I still use colors in certain
    parts of my image?


    +   No. By reducing to grayscale, you have changed the color model of your image.
    Attempting to add color will simply add shades of gray. If you want to work with
    a black-and-white image and add hits of color to it, the thing to do is to use
    the Desaturate option. That way, your image appears black and white, but it is
    still an RGB image, so you can continue to use color in it.


    +   When I reduce my images to a straight 256-color palette, some of them look
    whereas others don''t look good at all. What''s up with that?


    +   It depends on how many colors your image has to begin. If your image consists
    of many shades of blue, an indexed image will create a palette consisting of 255
    different shades of blue, which should look pretty good. It saves space without
    losing image quality. If, on the other hand, your image has every color in the
    rainbow, reducing to 256 colors might not be your best option. If you absolutely
    must save space, using the JPEG format might be a better bet. However, if you
    have to save in an indexed format, but the quality is still poor, dithering is
    not one option that might help alleviate the problem. Also, by playing around
    with custom palettes, you might stumble on one that more closely matches the image''s
    colors.


    # Exercise


    Gradients are a very powerful feature and a topic that I''ve only begun to cover
    here. To get used to dealing with gradients, you should think of them as doing
    more than one thing. They add texture, create lighting and shadow effects, create
    the illusion of certain types of material, and accomplish other such nifty things.
    A need thing to do with gradients is to experiment with them in various selections
    using different gradient shapes. You will be surprised how different your gradients
    can look with only a few alterations.


    To familiarize yourself with gradients, a really good thing to do is to experiment
    with them as lighting resources. Grab an image, preferably a well-lit one, and
    try out of the gradients with transparencies to create effects of light and shadow.
    Again, a radial gradient that ranges from a subtle light color to transparency
    makes a great lens flare effect. Likewise, a dark-to-transparent gradient can
    add enough shadow to give an object texture and mood.


    ![](img/0183f053b347a6407a2381be231d0345_124_0.png)'
  merge: -1
  img_proc: true
- pgno: 125
