    case, to be able to move the layer.


    At this point, your image is only lacking one very important thing. On a clear
    and star-filled night as the one depicted here, the sky would surely be reflecting
    in that tranquil water!


    To form the reflection, first activate the Rectangle Select tool and select the
    top portion of the image, all the way down to where the water line begins. Right-click
    on the selection and choose Edit, Copy Visible. This will copy the selected portion
    of all visible layers. Click the selection to unselect as it is now saved in the
    Clipboard and ready to paste. Add a new layer and name it reflection.


    What you will have to do now is flip the layer containing the copy of moon and
    stars and move the resulting reflection to its rightful place in water. Do this
    by double-clicking the Flip tool, selecting Vertical in the options box, and clicking
    anywhere on the layer to flip it. To be able to see through this reflection layer,
    lower the opacity to 20.


    Activate the Move tool and move the reflection layer into position, lining up
    the skylines just along the edge of the water. Adjust the opacity so that the
    moon is slightly visible and the stars have just the faintest glimmer in the water.
    Figure 8.13 illustrates the completed image and the layers used to form it.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Introduction to Layers


