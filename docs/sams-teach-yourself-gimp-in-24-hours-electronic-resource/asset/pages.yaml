  img_proc: true
- pgno: 3
  md: '# GIMP Keyboard Shortcut Quick Reference—Tools & Dialogs


    # Tools


    | Rectangle Select | R | Color Picker | O |

    | Elipse Select | E | Bucket Fill | Shift+B |

    | Free Select | F | Blend | L |

    | Fuzzy Select | Z | Paintbrush | P |

    | Bézier Select | B | Pencil | Shift+P |

    | Intelligent Scissors | I | Eraser | Shift+E |

    | Move | M | Airbrush | A |

    | Magnify | Shift+M | Clone | C |

    | Crop | Shift+C | Convolve | V |

    | Transform | Shift+T | Default Colors | D |

    | Flip | Shift+F | Swap Colors | X |

    | Text | T | |


    # DIALOGS


    | Brushes | Shift+Ctrl+B |

    | Patterns | Shift+Ctrl+P |

    | Palette | Ctrl+P |

    | Gradient Editor | Ctrl+G |

    | Layers and Channels | Ctrl+L |


    ![](img/0183f053b347a6407a2381be231d0345_3_0.png)


    # GIMP Keyboard Shortcut Quick Reference—Menus


    | FILE MENU | | LAYER MENU | | VIEW MENU | |

    | New | Ctrl+N | New Layer | Ctrl+N | Window Info | Shift+Ctrl+I |

    | Open | Ctrl+O | Raise Layer | Ctrl+F | Toggle Rules | Shift+Ctrl+R |

    | Save | Ctrl+S | Lower layer | Ctrl+B | Toggle Guides | Shift+Ctrl+T |

    | Close | Ctrl+W | Duplicate Layer | Ctrl+C | | |

    | Quit | Ctrl+Q | Delete Layer | Ctrl+X | New Channel | Ctrl+N |

    | EDIT MENU | | Scale layer | Ctrl+S | Raise Channel | Ctrl+F |

    | Cut | Ctrl+X | Anchor Layer | Ctrl+H | Lower Channel | Ctrl+B |

    | Copy | Ctrl+C | Merge Visible | | Duplicate Channel | Ctrl+C |

    | Paste | Ctrl+K | Layers | Ctrl+M | Delete Channel | Ctrl+X |

    | Fill | | Toggle | Ctrl+T | Channel to Selection | Ctrl+S |

    | Undo | Ctrl+Z | Insert | Ctrl+I | CHANNEL OPS | |

    | Redo | Ctrl+R | All | Ctrl+A | Duplicate | Ctrl+D |

    | Cut Named | Shift+Ctrl+X | Float | Shift+Ctrl+A | Offset | Shift+Ctrl+O |

    | Copy Named | Shift+Ctrl+C | Sharpen | Shift+Ctrl+L | FILTERS | |

    | Paste Named | Shift+Ctrl+V | Feather | Shift+Ctrl+F | Repeat Last | Alt+F |

    | | | | Re-show Last | Alt+Shift+F'
