- pgno: 46
  md: '# Tip of the Day


    This option pulls up the Tip of the Day dialog box anytime you want to look at
    it.


    # Dialogs


    These items give you the dialog boxes for various features and options—brushes,
    patterns, palettes, gradient editor, and tool options. These will be covered in
    the Hour 3, "Basic GIMP Tools."


    # Preferences


    This option brings up the Preferences dialog box, as in Figure 2.10. As you become
    more familiar with the GIMP, you will likely want to customize the application
    in terms of look, feel, and performance. Now, the main preference you might want
    to alter is the Levels of Undo (how many steps back you can go in the editing
    process) on the Interface tab. GIMP can accommodate a tremendously large amount
    of undos, as this is limited not by software, by hardware. If you do not have
    loads of memory in your RAM, you might want to lower this setting. However, if
    your workstation is crammed with RAM, I see no reason not to bump this up to 15
    or more (if you really use it, or course.). Also note that this can be dependent
    on the size of the image you are working with. If you are editing an extra large
    image, you might want to bump the setting down a couple of notices to conserve
    memory.


    FIGURE 2,10


    You can customize your GIMP installation in the Preferences dialog box.


    ![](img/0183f053b347a6407a2381be231d0345_46_0.png)


    # The Xtns Menu


    The Xtns menu (an abbreviation for Extensions) contains many plug-ins and Script-FU
    items supplementing the GIMP, which are written by various talented authors. These
    items extend the functionality of the GIMP, enabling it to acquire many more features
    than it has by default. These very numerous and powerful extensions are covered
    in Hours 19–22.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Exiting the GIMP


    Exiting the GIMP is as straightforward as any application. You can either


    +   - Click on the Close button in your favorite Window Manager.

    - Or, Go to File, Quit on the Toolbox dialog box or right-click the image itself
    (Figure 2.11).


    FIGURE 2.11


    ![](img/0183f053b347a6407a2381be231d0345_47_0.png)


    If you have unfinished changes open while exiting the GIMP, you will be asked
    if you want to exit the GIMP anyway, or cancel the exit in order to save your
    changes first. (This has saved me from a lot of mistakes many times.)


    # Summary


    In this hour, you became acquainted with the GIMP interface—getting around, finding
    files, and so forth. Yes, the GIMP interface can be a little tricky at first,
    but stick with it! It will make a whole lot more sense as you go along. In truth,
    the lack of readily visible menu items (remember right-clicking on the images?)
    in many graphics applications can actually be great after you get used to it.
    Being graphic-centric in nature makes for a very space-efficient and logical approach—in
    my opinion, but then, again, I am a little biased.


    # Q&A


    +   - Why doesn''t the GIMP support format?


    If the format is indeed popular enough, chances are, it will be. The great thing
    about GIMP is that you do not have to wait for a newer version to be released
    in order to take advantage of new features. The GIMP does this by incorporating
    plug-ins. So, far however, the GIMP supports those formats that 99 percent of
    us ever really care to use.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'When I try to save a GIF, the GIMP tells me that my save has failed, although
    I know for a fact that I do have write permissions to this directory.


    A On indexed formats (reduced color depth) such as GIF, you need to make sure
    that the image is in fact in Indexed mode before you attempt to save it. You can
    do this by right-clicking the image and going to Image, Indexed, and selecting
    the 256 color palette.


    #  Exercise


    This hour was admittedly pretty easy. It was intended to help familiarize you
    with the GIMP interface. However, the best way to do this effectively is to experiment.
    Go now, put down this book, and play with GIMP! Push all the buttons, select all
    the menu items, and see what they do. And there’s no need to worry; the GIMP won’t
    bite.'
  merge: -1
