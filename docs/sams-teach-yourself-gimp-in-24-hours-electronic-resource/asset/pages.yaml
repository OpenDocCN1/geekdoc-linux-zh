- pgno: 156
  md: '# Viewing the Mask


    If you want to view the mask in the image window, hold down the Alt key while
    clicking the mask thumbnail image. A green border will appear around the thumbnail
    to indicate mask visibility. Alt+click again to view as normal. To view your layer
    with no mask, Ctrl+click on the mask thumbnail, and you will see a red border
    around the thumbnail indicating the mask is hidden. Ctrl+click again to return.


    # Applying the mask


    After you have a selection you want it, right-click on the mask thumbnail to bring
    up the menu and select Layer Mask. This brings up an options box, as seen in Figure
    10.6, which gives you a choice of whether to apply or discard the mask.


    Figure 10.6


    With these options, you can apply the mask, thus merging it with the layer, or
    discard it, meaning it will be totally removed.


    ![](img/0183f053b347a6407a2381be231d0345_156_0.png)


    > Most filters and effects can be applied to masks, giving you great creative
    freedom when making them. However, some filters and effects cannot be utilized
    until the mask has been applied to the layer.


    # Masks with Selections and Channels


    If you have a complex selection and would like to make it into a mask, add a new
    layer mask and click on the Layer Mask icon to activate it. The selection will
    still be active (as shown by the flashing marquee) and you can manipulate it within
    the mask.


    If you have already made a mask, but would like to turn it into a selection, you
    can do that also. Look in the Layers menu and you will see an option called Mask
    to Selection. This automatically turns the mask into a selection, which can be
    useful if you want to edit the mask further by utilizing the selection options,
    such as grow, shrink, feather, and such.


    By using the Copy and Paste functions, you can paste a selection or an entire
    image directly into a layer mask, where it becomes the grayscale mask. This is
    a neat effect to use if you want to merge two images into one.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '138


    Hour 10


    To add a mask to an image containing only one layer, you must first add an alpha
    channel by going to the Layer menu and clicking Add Alpha Channel. When editing
