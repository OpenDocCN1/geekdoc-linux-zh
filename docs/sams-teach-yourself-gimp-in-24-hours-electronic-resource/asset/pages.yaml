- pgno: 148
  md: '# Working with Black and White


    The blend modes work by blending colors in such a large variety of ways, let''s
    take a look at unleashing the power of color in an image.


    A very popular technique used in everything from movies to photos is the use of
    just a drop of color to bring the focus to a certain item in a black and white
    image. One reason the technique is so popular is it is very effective. An image
    can end up with a completely different feel by using this method.


    In this tutorial, we will use a combination of layering and blend modes to achieve
    your color (or should I say lack of color) effect.


    Open the puppy.jpg image from the exercise section of the CD-ROM (see Figure 9.13).

    When you look at this image, what do you see? More than likely, you''ll probably
    say it''s a very happy puppy running through the green grass.


    FIGURE 9.13


    The bright contrasting colors in this image draw your eyes to the grass and the
    dog.


    ![](img/0183f053b347a6407a2381be231d0345_148_0.png)


    Take a look at the lone flower in the lower-left corner of the picture. Sure,
    you probably saw the flower before, but your eye was still naturally drawn to
    the larger areas of color in the image. Let''s make the flower, rather than the
    puppy, the focal point of the image.


    Make a copy of the image to work on.


    Add a new transparent layer and set the blend mode to Saturation.


    Set the foreground color in the toolbox to either black or white.


    Activate the Paintbrush tool. Open the Brush dialog box and choose a medium sized
    soft brush.


    Now by sweeping the brush over the image, you will in essence remove all color,
    leaving just a grayscale look to the picture. While you are painting, leave only
    the flower unpainted, preserving the color.'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'Take a look at both the original and the edited copy side by side. It''s the
    same image, notice how your eye is now drawn to the flower in the second image.


    Although you can apply blend modes either by selecting the mode in the Brush box
    dialog or Layer dialog box, you might find it more helpful to use layering at
    first, until you learn what the modes do and know just what effect you want to
    achieve. When you choose the chosen mode is applied to the brushed area, but to
