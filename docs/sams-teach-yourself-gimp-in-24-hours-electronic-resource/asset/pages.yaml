    ![](img/0183f053b347a6407a2381be231d0345_328_0.png)


    # Summary


    Animations can lend enhancement to any project, but keep in mind that anything
    used in excess can detract from a project more than it hadn''t been used at all.
    So subtlety is key here (most of the time). Also, if you are going to use animated
    GIFs for whatever reason, you should take into consideration that some browsers
    (Microsoft Internet Explorer, specifically) might play some of your GIFs at a
    slightly different speed (a little faster) than you might have intended, depending.
    It tends to roundup the frame speeds at times.'
