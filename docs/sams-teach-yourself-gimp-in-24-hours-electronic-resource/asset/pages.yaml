    ![](img/0183f053b347a6407a2381be231d0345_308_1.png)


    The options on this script are pretty easy to figure out. In any case, this script
    is one that is fairly simple in concept, and yet would be tedious and painful
    to reproduce by hand—especially more than once.


    # Old Photo


    Last but not least, here''s a neat script that can come in handy from time to
    time. Old Photo uses a few subtle distortion techniques to replicate that old
    time look. Why spend so much time and energy making those old photos look better
    when you can make them worse? Believe it or not, this effect can have some surprisingly
    pleasing results. And those unrecoverable photos can benefit from this script
    as well (see Figure 21.15).


    ![](img/0183f053b347a6407a2381be231d0345_308_2.png)'
