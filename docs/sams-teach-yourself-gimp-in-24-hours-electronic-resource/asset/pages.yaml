    Because black is the totally open or transparent color as far as masks are concerned,
    I chose black as the foreground color in the toolbox and used the Paintbrush to
    paint in an area of black. Notice in Figure 10.4 how the area that has the black
    applied to it allows the image to show through the white layer.


