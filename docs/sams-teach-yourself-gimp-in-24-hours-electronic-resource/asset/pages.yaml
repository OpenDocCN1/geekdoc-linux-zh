    # Script-Fu—The Art of Web Graphics


    Of course, Script-Fu is useful for much more than logo creation. One of my favorite
    things about Script-Fu is the simplicity to Web creation. There are the Xtins,
    Script-Fu, Web Pages menu, you will see a few scripts grouped together that will
    help you create matching sets of logos, banners, icons, and buttons. In Hour 15,
    "Web Graphics," you learned about GIMP in relation to making Web site objects,
    but I did not mention that you cheat and make this stuff easily with a few parameters
    and a click of the mouse. It really isn''t hard to do. Find a look you want, plug
    in the font, textures, and so forth, and a Web site is made. The GIMP web pages
    by default, one of which emulates the look and feel of gimp.org—with a little
    tweaking, you can create something new and with ease. There are also more of these
    available for download if you look around a little. As a demonstration, I used
    a Script-Fu Web page theme to create a simple Web page, as illustrated in Figure
    21.8.'
