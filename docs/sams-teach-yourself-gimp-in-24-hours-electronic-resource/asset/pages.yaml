- pgno: 365
  md: '# # SAMS

    Teach Yourself

    GIMP

    in 24 Hours


    # Get Started Now!


    24 proven one-hour lessons


    In just 24 sessions of one hour or less, you will be up and running with GIMP.
    Using a straightforward, step-by-step approach, each lesson builds on the previous
    one, allowing you to learn the essentials of GIMP from the ground up.


    # Find your answer to...


    +   - Installing and configuring GIMP

    - Working with the GIMP interface

    - Creating new art with the painting tools

    - Using brushes and patterns

    - Editing images and selections with transformation tools

    - Adjusting color and working with transparencies and gradients

    - Using layers, masks, and selections

    - Applying filters and creating special effects


    +   - Tips point out shortcuts and solutions

    - Notes clarify concepts and procedures in a straightforward manner

    - Cautions help you avoid common pitfalls


    > Joshua Pruitt is a UNIX/Linux system administrator and digital graphics artist.
    He is co-founder of Mid-TN Network, a Nashville-based web design and hosting firm.
    He is also co-founder of the Nashville User''s Group.


    Ramona Pruitt is a self-taught artist specializing in computer-aided art. She
    is an expert Photoshop and Paint Shop user, and currently works as a Web designer
    and artist.


    # ## The CD-ROM includes:


    +   - GIMP and the GIMP Toolkit

    - The most up-to-date graphics libraries

    - Exercise files from the tutorials


    Register this book and receive a free subscription to Macmillan Online''s Personal
