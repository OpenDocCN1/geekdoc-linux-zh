- pgno: 259
  md: '# Q&A


    I want a photo to appear just barely visible (as if in a fog) so I can use it
    for a background. How can I do that?


    Add a new layer in white and adjust the opacity until you get the effect you want.


    What is the best file format to save my photos?


    That depends on what you are planning to do with them. For Web use, JPEG is the
    format of choice for photos. If you want to view them on your own computer and
    maybe do some editing, any format that supports full color will do (BMP, PNG,
    TIFF). If you recall from Hour 15, “Web Graphics,” the JPEG format loses image
    quality each time it is edited, and then resaved with the changes, so if you plan
    on doing anything to the images besides simple viewing, you''ll want to choose
    something other than JPEG.


    # Exercise


    To put into practice what you''ve learned this hour, try these two assignments:


    +   Get the lousiest photo you have of yourself (you know, the one where you had
    spinach in your teeth, or maybe that other one where your hair resembles that
    of a troll doll). Use the tricks you''ve learned and see just how much better
    you can make it look!


    +   I know you''ve been dying to this one, so go right ahead. Pull out that old,
    dogeared, crumpled, faded photo of your first love that you''ve been sporting
    around in your wallet for how many years? Restore it, and then sit back and admire
    your work.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '![](img/0183f053b347a6407a2381be231d0345_260_0.png)


    # # HOUR 18

    # Digital Painting


    According to my dictionary, to paint means to “make a representation using paints
    or colors”. It would follow then that everything created in the GIMP could actually
    be considered a digital painting.

    painting that are akin to real painting—the kind where you have brushes, easels,
    and turpentine (and a sm and beret if you''re really into it!). You''ll use various
    brushes and settings to create different looks that are similar to watercolor
    and oil paintings.

    There are several factors that can make painting with GIMP in the digital realm
    even more enjoyable than painting on canvas.


    +   - You can undo and start every time you make a mistake.

    - You have a plethora of tools and filters to help your natural talent along.

    - You won''t spill paint on your clothes and there are no brushes to clean when
    you''re finished.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Simulating Painting


    In Hour 13, “Artistic Filters,” you learned about some of the artistic filters,
    such as GIMPressionist and Van Gogh, which can give any photo or image the appearance
    of a work that has been painted.


    What you are going to do now is a little different. Using a tutorial approach
    (and assuming familiarity with the basic program tools acquired from the previous
    hours), you are going to make three paintings from scratch—begin each with a black
    canvas and paint your way through beginning to end until you have complete paintings.
    After you''ve finished the tutorials, you will feel comfortable your mouse as
    a paintbrush handle. While painting, try to keep the following tips in mind:


    +   - Keep the Brush dialog box open to make it easier to switch brushes and settings.

    You can minimize it to keep it out of the way.


    +   - Use a new layer for each consecutive step of your painting. That way, if
    you''re not happy with a certain section, you can delete the entire layer and
    start a new one.


    +   - As with all graphics, remember to keep light sources and shadows consistent
    on all the objects in the painting.


    +   - Utilize the Magnify tool when working on small, highly detailed areas.


    # Lesson 1—Watercolor


    This first painting simulates a rose that has been painted with watercolors.


    Begin by opening a white canvas in a medium to large size. Add a new transparent
    layer (you''ll come back to the white background later).


    To get the basic rose shape, use one of the small plain brushes to sketch in a
    rough outline of the line, as in Figure 18.1.


    Figure 18.1


    A simple sketch forms a basis to grow on.


    ![](img/0183f053b347a6407a2381be231d0345_261_0.png)'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'After you have the sketch, you''ll be surprised how easy it is to fill in the
    colors and have your painting complete. When going for a watercolor look, think
    how you would paint if you were using real watercolors. You would have a medium
    sized soft brush to spread the watery paint with, so choose a GIMP brush that
    would be similar to that. I like to use the circle fuzzy brushes. You might also
    want to adjust the opacity slider in the Brush dialog box to give the paint transparent,
    watered down look. In Figure 18.2 the darker edges have been painted in (in a
    new separate layer, of course).


    FIGURE 18.2


    Use smooth, easy strokes to fill with color, just as you would with a real paintbrush.


    ![](img/0183f053b347a6407a2381be231d0345_262_0.png)


    Keep adding layers, and by reducing the opacity of the brush each time, you can
    paint in lighter, watered-down hues of the same colors to get a blended appearance,
    as in Figure 18.3. To give the colors a softly blended look, try using the Blur
    filter to apply a slight blur on each new layer of color.


    FIGURE 18.3


    The painting gets a softer look as each new layer of color adds highlights.


    ![](img/0183f053b347a6407a2381be231d0345_262_1.png)


    > Because the Eraser tool also uses the Brush dialog box options, you can use
    it to lighten colors that have been painted too dark. By reducing the opacity
    in the options, it will not erase completely, but it will erase in varying degrees
