- pgno: 220
  md: '# HOUR 15


    # Web Graphics


    The World Wide Web (WWW) and the Internet, have seen a phenomenal growth in popularity
    in the last couple of years, and for good reason. It is the fastest and most versatile
    form of communication there is. When you have Internet access, you have access
    to resources all over the world in the form of Web Sites. A site can consist of
    nothing but text, or be check full of images, pictures, animations, sounds, music,
    and even streaming videos.


    On the Web, sometimes the presentation of information is as important as the information
    itself, hence the prevalence of Web graphics. This hour, you are going to look
    at some of the fundamental aspects of creating graphics suitable for the Web,
    including:


    +   * Web-friendly file formats

    * Web-safe color palettes

    * Basic Web site elements


    # File Size


    When you make graphics to use on the Web, you must take into account that the
    larger the files are, the longer they will take to load when someone accesses
    your site. The idea is to keep all graphics as a small size file


    ![](img/0183f053b347a6407a2381be231d0345_220_0.png)'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# 202 Hour 15


    possible without losing quality. You might be able to create fantastic images
    for a site, keeping them small enough for Web surfers on slower modems can be
    a major challenge. In Linux, you can check the size of a saved file either by
    using a graphical file manager or by going to your shell and ls -l <filename>.


    # # File Formats


    At this time, there are primarily two file formats used for Web graphics, having
    different properties and uses. One is JPEG (Joint Photographic Experts Group)
    and the other GIF (Graphics Interchange Format). Take a closer look at each of
    these in the following sections.


    # ## JPEG


    JPEG is the format to use for photographs that you want to display on the Web.
    It allows the use of millions of colors, also making it ideal for images with
    lots of gradients and color complexities. JPEGs use what is known as a lossy compression
    scheme, meaning that you can control the file size by means of compression, but
    the more you compress, the more image quality will be lost.


    When you save an image as a JPEG in GIMP, an options box will appear, where you
    can choose the compression percentage from 0–100 (0 being totally compressed and
    100 being uncompressed). A good starting point is to set the slider to 85 or for
    minimal loss of quality with reduced file size. Because it depends on the particular
    image, you might want to save several copies of your image in order to play with
    the compression ratio and the smallest file size you can while retaining decent
    quality. To get the lowest possible file size, it''s often recommended to save
    at an unacceptable quality (50), and then slowly upward until the image is acceptable.


    > After you save an image in JPEG format, it will lose quality each time you edit
    and save. It''s best to save a copy of images in another format, as GIMP''s native
    XCF format if you think they will need further editing. Saving the image in a
    JPEG format should be performed only on completion.


    ![](img/0183f053b347a6407a2381be231d0345_221_0.png)


    # ## GIF


    GIF is probably the most widely used format on the Web. GIFs enable you to save
    images with transparent backgrounds. You create images only in rectangular or
    square'
  merge: -1
  img_proc: true
- pgno: 222
  md: "# Web Graphics\n\nwindows, but when you want only a portion of the image to\
    \ be visible, such as a round button or a non-rectangular shape, transparent backgrounds\
    \ can be an invaluable asset.\n\nAnother reason for the popularity of the GIF\
    \ format is that you can make animations (moving images). You're going to learn\
    \ more about creating animations in Hour 23\n\nThe down side to GIFs is that they\
    \ do not support millions of colors, but just a mere 256 or less, and therefore\
    \ any image you create in high color must have the color depth reduced before\
    \ saving as a GIF. Because of this, the images are most likely to turn into GIFs\
    \ are simple items such as logs, navigational buttons, divider bars, and so forth.\n\
    \nTo reduce the colors and save an image in GIF format from the GIMP, right-click\
    \ on the image and choose Image, Indexed. This brings up the Options window where\
    \ you have several choices of color reduction methods, including 256 color, Web\
    \ safe, and customized palettes.\n\nIn the same Options box, you have the choice\
    \ to save the GIF as interlaced. This means that when your Web page containing\
    \ the image is accessed, the image will load in levels, first appearing fuzzy\
    \ and slowly sharpening to its final stage. It's a good idea to interlace your\
    \ Web images so that people can have something to look at while the page finishes\
    \ loading.\n\n JPEGs, GIFs use a lossless compression scheme, meaning that no\
    \ image quality is lost when it is compressed into the GIF format.\n\n> There\
    \ is one more promising file format that is edging its way into Web. PNG (Portable\
    \ Network Graphics) possesses not only transparency capabilities, but also full\
    \ color and relatively small file size without loss of quality. At this time,\
    \ however, PNGs are only supported by the latest browser versions (Netscape and\
    \ Internet Explorer 4.0 and up) and therefore cannot be viewed by any of the older\
    \ browsers. As time passes and more people upgrade browsers, you will no doubt\
    \ begin to see PNGs as one of the major Web file formats.\n\n# Web-Safe Palettes—Necessary\
    \ or Outdated\n\nUntil recently, most people had 256-color computer monitors,\
    \ whereas the new computers and monitors you see now virtually support millions\
    \ of colors. What does this mean to Web page design? It is something that will\
    \ probably be debated until all the old"
  merge: -1
  img_proc: true
- pgno: 223
  md: '256-color monitors finally wear out! When an image is created and put on the
    Web in full color, the results are beautiful on a full-color monitor, but they
    are sometimes less satisfying on a 256-color monitor. If there are colors used
    that are not in the safe palette, the 256-color system tries to accommodate by
    arranging the colors it does possess in the places of those it does not. This
    is known as dithering. Sometimes dithering doesn''t cause too much loss of quality
    and other times it can be disastrous.


    You have several choices to make in regards which color palette to use when designing
    for the Web. If you feel that most of the people who will be visiting your site
    will be using high-color monitors, you don''t need to worry about the safe palette.
    If you are designing a site that you expect to be viewed by the masses, you might
    want to consider the pros and cons of using Web-safe colors so that your site
    will look good to all viewers.


    > When designing graphics for a Web page, you might choose to work in full color
    because certain filters and functions will not work on indexed images. You can
    always reduce index after you finish. When working with large areas of solid color,
    however, you should try to use a color from the safe palette to avoid later instances
    of dithering, which can make solid areas sporty. Make copies of your work, save
    them in two different formats, and check them by changing your monitor settings
    to 256 colors (type starts --bmp 8 at the console). Ideally, the goal should be
    to have images that are wonderful on high-color monitors, yet still presentable
    on 256-color monitors, rather than settling for mediocre all the way down the
    line.


    You probably noticed in the Indexed Color Conversion window that there are options
    to reduce 256 colors or to the Web-optimized palette. These aren''t quite the
    same. When you reduce to 256 colors, the image will use the 256 nearest matching
    colors it can. The Web-safe palette actually consists of only 216 specific colors.
    Even though there are 256 colors built into a system palette that is used in the
    operating system, 40 of these colors differ between operating systems and are,
    therefore, eliminated from the Web-safe palette, leaving 216 colors that are the
    same on all platforms.


    To view the Web-safe palette within GIMP, select File, Dialogs, Palettes, and
    you will find the Web palette listed among the many built-in GIMP palettes (see
    Figure 15.1). To choose a color from the safe palette to work with, click it,
    and it will appear as your fore-ground color in the toolbox.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# FIGURE 15.1


    The Web-safe palette is included in the Palette dialog box.


    ![](img/0183f053b347a6407a2381be231d0345_224_0.png)


    # Making Good Looking Web Sites Quickly and Effectively


    There are several key elements to keep in mind when designing a Web site, even
    if it''s just personal one. The best kinds of sites are classy, interesting, organized,
    easily navigable, and quick to load. The graphics used can play an important part
    in all these functions. Here you will take a look at a few of the different kinds
    of graphics that can come together and really make a site flow.


    # Backgrounds


    The type of background used can set the look and style for an entire site. You,
    of, choose to go with a plain solid color background, but a graphic or textured
    background can add a special flavor and uniqueness. In general, backgrounds should
    not be overpowering, but should add just enough depth and color to a site to give
    it its own look.


    ![](img/0183f053b347a6407a2381be231d0345_224_1.png)


    > When creating backgrounds, remember that they should be subtle enough so that
    the text placed over them can be easily read. If you prefer very dark colored
    or busy backgrounds, you might want to consider putting your text in a table containing
    a solid color, having the background in the areas surrounding the table. Also,
    if you have information on your site that people want to print, as such instructions
    or directions, you will want dark text over a light background so that when printed,
    the text will show up on white paper.


    # Textures as Backgrounds


    The easiest backgrounds to make are simple textures. These are similar to painting
    with textured paint in your home, adding color and a decorative touch to plain
    walls.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'Besides being easy to make, textured backgrounds are good to use because you
    really only need a small piece of texture that can then be tiled (repeated over
    and over with seamless edges) as the background. This helps keep your site''s
    total file size down.


    Create a quick and simple texture here to illustrate the effect.


    First, open a new canvas in a small size, around 100 × 100, and fill with a background
    color.


    Now choose a darker shade of the same color, open the Brush dialog box and choose
    one of the texture brushes. Activate the Airbrush tool and spray the texture evenly
    over the entire image, as in Figure 15.2.


    # FIGURE 15.2


    Because this will be tiled, it doesn''t need to be very big.


    ![](img/0183f053b347a6407a2381be231d0345_225_0.png)


    Ok, it doesn''t look like much yet, but there are a lot of ways to go with it.
    You can get really good textures with filters as Canvas and GIMPression. In Figure
    15.3, the motion blur and bump map were applied to achieve something like a stucco
    texture. All that is left is to turn it into a seamless tile by selecting Filters,
    Map, Make Seamless.


    # FIGURE 15.3


    A couple of quick filter applications give the texture some depth.


    ![](img/0183f053b347a6407a2381be231d0345_225_1.png)


    > The seamless patterns supplied in the GIMP Pattern dialog box can be a great
    resource for ready-made background textures and ideas.

    When you''ve made a seamless background texture you like, you might want to save
    a copy of it as (See the "Saving Patterns" section in Hour 4, "Using Brushes and
    Patterns in Depth" to refresh your memory). That way, you can use it later with
    the Bucket Fill tool to make other matching graphics.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Web Graphics


    As you can see in Figure 15.4, the textured background, when tiled, adds a unique
    quality to the page that a plain background just doesn''t possess.


    # 15.4


    Even a simple texture can add a nice touch to a site.


    ![](img/0183f053b347a6407a2381be231d0345_226_0.png)


    # Backgrounds with Sidebars


    Another popular background is the sidebar background. This consists of incorporating
    a sidebar into the tileable background image. This is a good technique to use
    if you want some decorative contrast on your page without texturing the entire
    thing, or if you want a specific area on the side in which to place navigational
    aids, as the one shown in Figure 15.5.


    To make a sidebar background that works a little differently than the tile texture.
    You only want the bar to show on one side and not repeat horizontally, but yet
    tile vertically. To do this, you need to make the image as wide as needed to prevent
    overlap. Although a lot of people browsing the Web still have their monitor resolutions
    to 640 × 480, the resolution on some larger monitors can go much higher. If you
    make a graphic only 640 pixels wide and tiled it, it would repeat horizontally
    when viewed on large monitors using higher resolutions. Don''t worry though. Many
    times, viewers using the larger 17-21 inch monitors keep the resolution to no
    more than 1280 × 1024, and if the resolution is higher than that, they are probably
    not browsing the Web at full screen, but in a smaller window. At this point, it''s
    a safe bet to make this kind of background graphic with a width of 1280. Because
    it has to be made so wide, the height needs to be kept low in order to keep the
    file size down.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# 208


