    ## 5 访问你的容器


    使用以下命令连接到容器并运行多个命令：


    ```

    $ docker run -it busybox sh

    # ls

    # ps -a

    ```


    ## 6 销毁你的容器


    在使用第4步中的第二个命令获取容器 ID 后，你可以停止并删除特定的实例。成功删除后，你将看到显示的容器 ID


    ## 使用 Vagrant 的脚本


    跨服务器自动化虚拟机的创建和管理


    Vagrant 是一个由 HashiCorp 公司赞助的成熟产品。它的主要目的是为不同的虚拟化技术提供通用的命令行和配置架构。这意味着你可以对 VirtualBox、VMware
    Workstation 和 Vagrant 使用相同的命令，简化了 vagrant 的使用，因为它为各种提供程序和环境的命令行界面提供了封装器。


    这意味着你可以创建一个单一脚本来配置你的基础设施，并在任何地方运行它——或按你喜欢的方式使用。同一个 Vagfile 可以用于创建不同的产品或云服务。


    开发者会发现它特别有用，因为他们可以创建一个安装了所有所需 IDE 和工具的通用开发环境，新成员可以快速且轻松地运行。还可以模拟一个比生产环境更复杂的完整服务器——对于测试特别有用。你可能好奇
    Vagrant 在这种情况下是如何工作的


    在这种情况下，Vagrant 可以以提供 VM 完全相同的方式提供 Docker 容器。通过将它设置为 "vagrant-provider docker"，也可以在任何虚拟服务器上运行
    Docker 容器。


    第一步是安装选择的 Docker 编排平台。Vagrant 原生支持 VirtualBox，这在桌面级上也支持，但你也可以为 Vagrant 使用专有的 HashiCorp
    驱动程序作为“提供程序”。


    接下来，获取 Vagrant 的最新版本。你应该避免通过包管理器安装 Vagrant，因为它可能是一个旧版本，不是最新版本的 VirtualBox 版本。


    一旦安装完成，你就可以无需任何先验配置，仅使用几条命令创建第一个虚拟机：


    ```

    $ mkdir test && cd test

    $ vagrant init bento/ubuntu-18.04

    $ vagrant up

    ```


    你会注意到屏幕上没有出现错误。这是因为 Vagrant 默认是无头运行的，所以你使用：


    ```

    $ vagrant ssh-config

    $ vagrant ssh

    ```


    你放置在 Vagfile 相同目录下的任何文件也可以通过 vagrant 供客系统可用。然而，你可能希望在虚拟机上运行完整的 GUI，在这种情况下设置一个只有
    GUI 的会话特别有用。幸运的是，有一种方法可以更改这一点，你可能会注意到运行 vagrant init 时，相同目录下创建了一个名为 Vagrant 的文件。在这里你可以调整虚拟机的设置，默认情况下填充了注释以帮助你配置
    Vagrant。你会注意到它默认是 base，或者你运行 Vagrant init 命令时想要设置的任何选项。跳过端口转发和共享文件夹，你会发现以下行：


    你可以使用命令 vagrant plugin list 检查安装了哪些插件


    ## 入门


    Vagrant 的入门指南帮助你快速启动并运行。如果你不确定 Vagrant 有哪些功能，可以阅读《Vagrant: Up and Running》，由 O''Reilly
    编写。在开始之前，请了解通过 Vagrant 创建快照，以便回到这些快照。我们之前提到过可以在 Vagrant VM 中转发端口。唯一的默认端口是 SSH，如果你访问端口
    22，则是不需要的。只需在 Vagrantfile 中取消注释行，即可将 HTTP 端口 80 映射到 http://localhost:4080。你也可以复制并粘贴此行，根据你在
    VM 中运行的应用程序调整端口号。


    > 快速提示

    > 创建自己的 box

    > 为 Vagrant 创建自己的镜像并供 Vagrant VM 使用的方法是使用你的基础镜像，填充 JSON 文件然后将其打包供你的提供程序使用。更多信息访问
    www.vagrant.com/boxes/base.html。


    ## 热 Vagrant 插件


    扩展功能


    - 1 使用 Cucumber 进行 BDD

    通过 Vagrant 的帮助，你可以在 Vagrant VM 中运行所有的行为测试。要启动这些测试，可以使用现有的 Feature 文件并部署到 Vagrantfile
    或在那里运行 vagrant cucumber。


    - 2 Shell 命令

    Vagrant-exec 在你的 VM 上运行 shell 命令，你可以通过进入 Vagrantfile 目录并在每个命令前加上 vagrant 来实现。在这里很容易记住如何创建新的
    SSH 会话。


    - 3 Fabric 配置

    Vagrant-fabric 更进一步，它通过一个名为 Fabric 的 Python 2.7 扩展执行脚本和部署：在你的 Vagrantfile 中作为配置器使用。


