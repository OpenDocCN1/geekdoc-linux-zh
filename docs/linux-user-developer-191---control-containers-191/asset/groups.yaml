    \ PLC 对此类信息的任何错误或遗漏不负责，并对因使用本杂志包含的任何信息而导致的任何损失或损害不受责任。我们不保证杂志中表达的观点是 Future PLC\
    \ 的观点。我们不保证提到的任何产品或服务都得到了 Future PLC 的背书或批准。\n\n# 欢迎阅读 Linux User & Developer\
    \ 第 191 期\n\n# 本期内容\n\n- 控制论文，第 18 页\n- Ruby 的未来，第 32 页\n- Ubuntu 18.04，第 5 页\n\
    \n欢迎阅读北美最喜爱的 Linux 来源地。开源世界又过去了一个月。当然，Ubuntu 18.04 LTS 发布了，我们也看到了开源领域的新功能，旨在为德国政府提供基于\
    \ Debian 的 Ubuntu，以支持 30 万公民的服务。微软通过揭晓基于 Intel Linux 的桌面操作系统让很多人大吃眼镜。Linux 基金会将微软的\
    \ Linux 描述为“新”的——不应被忽视。许多公司现在在盈利且具有实际意义时使用 Linux 和 FOSS（自由开源软件）。随后，我们将展示如何使用来自\
    \ Ansible、Docker、Puppet 和 Vault 的开源连接器和系统来帮助恢复系统。我们介绍了这次 Ubuntu 18.04 的变化（第 18\
    \ 页），不仅限于桌面、云端、容器等领域。\nChris Thornnett，编辑\n\n| 新信件奖 |\n| :--- |\n| 最佳获胜者是我们的 datashur\
    \ Pro！ |\n| linuxuser@future.com |\n| Twitter: @linuxuser |\n| Facebook: facebook.com/LinuxUserUK\
    \ |\n\n详情请参阅第 11 页 |\n\n获取最佳订阅优惠，请访问此处：\nmyfutureusers.co.uk\n今年订阅最高可节省 20%！\n\
    \nFUTURE PLC\n连接器\n创作者\n专专栏作家\n\n首席执行官 Ethan Smyth-Type\n首席财务官 Leslie-Leiden\n\
    电话 +44 01502 4224\n\nwww.linuxuser.co.uk\n\n3\n\n# 目录\n\n# 特色\n\n# 教程\n\n- 06\
    \ 新闻\n- 10 信\n- 12 访谈\n- 16 控制\n- 18 Ubuntu\n- 20 特色\n- 24 特别报告\n- 32 Ruby\n-\
    \ 36 Git\n- 40 Arduino\n- 44 安全\n- 48 Python\n- 52 编程\n- 58 Ubuntu\n\n# LinuxUser\
    \ & Developer\n\n第 191 期\n2018年5月\nfacebook.com/LinuxUserUK\nTwitter: @linuxuser\n\
    \n# 特别报告\n\nUbuntu 18.04 bionic 带来了带来了变化，从桌面到云端、容器、物联网、服务器。18.04 代表了长期支持。\n\n\
    - 06 新闻\n- 10 信\n- 12 访谈\n- 16 控制\n- 18 Ubuntu\n- 20 特色\n- 24 特别报告\n- 32 Ruby\n\
    - 36 Git\n- 40 Arduino\n- 44 安全\n- 48 Python\n- 52 编程\n- 58 Ubuntu\n\n# 实用 Pi\n\
    \n- 72 Pi 项目：PipeCamp\n电子技术人员 Fred Frie 想用廉价组件制造一个水下相机。他巧妙的解决方案 PipeCamp 涉及到 Raspberry\
    \ Pi 以及大量的防水密封剂。\n\n# 测评\n\n- 81 组测：安全发行版\n我们测试了四种承诺增强安全的特殊发行版，看看哪种最安全。\n\n- 96\
    \ 快乐的一天\n来自科幻小说作者的另一篇引人入胜的故事\n\n- 86 硬件测评\nTerraMaster F-420 NAS 和 Trendnet TEW-817DR\
    \ 路由器性能如何？\n\n--你可能不知道，新的 Pi 可以轻松从连接的驱动器而非 SD 卡启动。了解如何设置。\n\n- 88 发行版：MX Linux\
    \ 17\nantik MEPIS 社区的合作成果，带来了整洁流畅的桌面体验。\n\n- 90 DIY 语音助手\n使用运行在 Pi 上的 Mycroft\
    \ 创建你自己的 Alexa/Google Home/Siri/Cortana 替代品——并确保所有数据留在你的控制范围内！\n\n- 90 新鲜 FOSS\n\
    Searchmonkey JAVA 3.2.0，beats 1.4 CLI 媒体库，Garbas 3.11.0 用于创建图形应用，以及 SimpleRecorder0.3.10。\n\
    \n立即订阅，订阅最高可节省 20%！更多信息请参阅第 30 页。\n\nwww.linuxuser.com | 5\n\n"
