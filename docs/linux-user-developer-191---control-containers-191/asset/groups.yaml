    ## 开源


    06 新闻与观点 | 10 字母 | 12 采访 | 16 内核社区


    安全


    ## Facebook 调查并对信任危机表示道歉


    Mozilla 提供解决方案：Facebook 容器（Facebook Container）可保护浏览活动和数据追踪


    引人注目的剑桥分析公司丑闻影响了所有平台的用户，再次凸显了社交网络等在线服务在处理个人数据时，开放性的重要性。考虑到有 270,000 人使用了“thisuisdigitall”应用，令人震惊的是，数百万（包括该应用的用户的朋友家人）的数据随后被采集，并用于从
    2014 年开始的政治竞选目标投放。


    ![](img/adbb964c9bace8f3e3949547041f6ef9_5_0.png)


    马克·扎克伯格在尽力让 Facebook 与丑闻保持距离的同时，还花时间在几份报纸上发表了正式道歉。文中，这位万亿富翁 CEO 对 2014 年的信任危机表示道歉，这次危机“泄露了数百万人的
    Facebook 数据”，并透露除了限制向第三方提供数据外，Facebook 正在调查在我们发现此问题之前访问过大量数据的每一个应用，其依据是其他应用可能也拥有类似规模的数据。


    尽管表达了歉，但 Facebook 承诺通过移动端应用中的新功能在隐私方面做得更好；但事实是，数据是在没有真正违反安全性的、或至少没有获得明确同意的情况下获取的。相反，CBS
    的尼克·尼尔森（Nick Nicholson）表示：“Facebook 构建了历史上最疯狂、最侵入性的广告模型，有些人正利用了这一点来获利。”


    从那以后，事情已经发生了；Facebook 的品牌已经因为之前的丑闻和疑虑而受损。然而，该平台似乎不太会被遗弃，这为用户提供了至少部分挽回的机会。


    在剑桥分析公司丑闻之后，针对有隐私疑虑的用户——Mozilla 推出了一项新的浏览器扩展，以解决 Facebook 追踪问题。两个月前——尽管该开发最近为了快速发布而了加速——Facebook
    容器为那个最烦人的问题提供了解决方案：“我如何在不真正退出的情况下退出 Facebook？”


    Mozilla 迅速提醒用户，追踪是一个问题——你在网上访问的页面可以关于你的很多信息（你住在哪里、你的爱好和你的政治倾向），而且 Facebook 在许多网站上都有追踪器网络。“这个
    Mozilla”会追踪你在其他在线活动中的行为。


    Mozilla 认为，通过使用 Facebook 容器扩展，剑桥分析公司事件是可以避免的，该工具至少限制了他们共享的数据。（而且考虑到情况，毫不留情地）Mozilla
    不从扩展程序中收集任何信息；它只记录扩展程序何时被安装或移除。


    ![](img/adbb964c9bace8f3e3949547041f6ef9_5_1.png)


    上方，是时候通过 Mozilla 的 Facebook 容器活动来控制 Facebook 数据隐私了


    ![](img/adbb964c9bace8f3e3949547041f6ef9_6_0.png)


    ## 发行版动态


    ### 前 10 名

    （每日平均访问量，截至 2018 年 4 月 4 日的前 30 天）


    | 发行版 | 访问量 |

    | :--- | :--- |

    | 1. Manjaro | 3248 |

    | 2. Mint | 2806 |

    | 3. Ubuntu | 1887 |

    | 4. Debian | 1526 |

    | 5. elementary | 1325 |

    | 6. Solus | 1290 |

    | 7. MX Linux | 1225 |

    | 8. Fedora | 968 |

    | 9. Zorin | 862 |

    | 10. Antheros | 783 |


    ## 软件


    ## Ubuntu 中发现 GNOME Shell 内存泄漏


    ### 如果不尽快修复，Ubuntu 18.04 可能会带有一个恼人的 bug


    内存泄漏在过去最著名的影响对象是浏览器，因此让桌面环境也受到这种耗内存 bug 的影响是代价昂的。但在 Ubuntu 17.10 中发现的 GNOME Shell（已被许多用户看到）也是一个
    bug。该 bug 似乎是由执行与动画相关的操作触发的，例如在窗口上移动或切换窗口，这可能会导致系统恢复到在使用几小时后就会停止的状态；特别是如果你在使用笔记本电脑时；如果增加的负载将你的电池电量从
    100M 消耗到 350M，你不能仅仅通过重启来摆脱麻烦。即使你关闭所有窗口，它也不会释放内存。在我的 4GB 缓存中，这意味着我要么每天重启，就是通过启动修复来彻底解决此问题。


    随后的调查证明该问题确实存在，开发者将其驳回为“我怀疑我们在某个地方泄露了最终缓冲区”。他追踪了该问题，注意到垃圾回收（Garbage Collector）出现了“某些情况”。恢复后，发现垃圾回收工作正常。在尝试更新该问题时，Stravacas
    报告说在放弃之后，“我发现了一个可以减少的非常有趣的 bug”。


    一个用户可以一分钟一分钟地增加内存使用量。launch.net 用户 Jesus:225 阐明了这个问题：“无论你做什么，gnome-shell 都会缓慢地消耗内存……”
    在使用一天（仅浏览网页）后/gnome-shell 增加的 RAM 增加了。


    ### 本月


    - 开发中 (4)

    - 稳定版发布


    BSD 操作系统最近引起了复兴，基于 FreeBSD 的支持在顶部的两个选项中都有。


    ### 亮点


    ![](img/adbb964c9bace8f3e3949547041f6ef9_6_1.png)


    > TrueOS

    TrueOS 以易用性为荣，具有预配置的桌面环境。


    > OpenBSD

    专注于安全，OpenBSD 6.3 提供了对 ARM64 的支持。


    > NetBSD

    这种流行的 BSD 分发版运行在广泛的硬件平台上。


    ![](img/adbb964c9bace8f3e3949547041f6ef9_6_2.png)


    ### 最新发行版：


    ```

    files.co.uk

    ```


    ![](img/adbb964c9bace8f3e3949547041f6ef9_6_3.png)


    linuxuser.co.uk


    ## 游戏


    ### Steam Machines 还有？Valve 宣布变革


    曾被认为是游戏未来的 Steam Machines——Alienware、华硕等——在很大程度上无人问。无论如何，Valve 不再推广此类主机式 PC。在
    Steam 网站发布公告后，Steam Machines 仍然可用，且 Steam 页面仍然在线，并非如此


    > 诚然 Steam Machines 确实并不畅销，对于显卡


    ![](img/adbb964c9bace8f3e3949547041f6ef9_7_0.png)


    虽然 Steam Machines 尚未死亡，但它们处于生命维持阶段。在 4 月 4 日的一篇博客中，Valve 的 Pierre-Louis Griffiths
    声称 Steam 的策略已经发生了变化。“虽然它们确实并不畅销……但我们仍在努力让 Linux 系统成为开发者的理想之地。我们认为这最终会让用户受益，包括那些不使用
    Steam 的。”


    ## 硬件


    ## Intel 停止显卡更新

    许多新发行版已不再需要它


    随着 Linux 发行版的开发和改进，第三方工具和软件过时并不罕见。Intel Update Tool 就是一个很好的例子。它于 2013 年发布，为用户提供了
    Intel 硬件上安装和升级稳定驱动程序和固件的方法，多年后该软件已变得多余。


    Intel 博客在 3 月 8 日宣布，“用户将注意到 Fedora 27 和 Ubuntu 17.04 已经不再最新，因此，我们将停止提供 2.0.6 版本的
    Update Tool。最后的 2.0.6 版本更新工具专门针对 Ubuntu 17.04 和 Fedora 26。不再支持其他发行版的进一步更新。”


    '
