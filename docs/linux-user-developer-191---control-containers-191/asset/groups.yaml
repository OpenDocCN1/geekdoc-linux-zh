    ### Gambas 3.1.0


    ### 一种构建 Linux 图形应用的便捷方式


    Gambas 是“Gambas Almost Means Basic”（Gambas 几乎意味着 Basic）的递归缩写，它是 Basic 编程语言的一种面向对象的方言。Gambas
    的目的是提供多态性，而没有 C++ 或 Java 的复杂性。事实上，Gambas 使得使用 Qt 或 GTK+ 构建图形应用变得非常简单，它还包含一个 GUI
    设计器，帮助你创建一个用 Gambas 编写的 IDE。


