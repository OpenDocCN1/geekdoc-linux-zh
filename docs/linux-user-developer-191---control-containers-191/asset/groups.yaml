    \ TYPES\n\n# Figure 1\n\nLeft Rust provides good support for integer and floating\
    \ point types, so we are never guessing about how your data takes up\n\n| Size\
    \ | Signed type | Unsigned type |\n|---|---|--|\n| 8 integer | i8 | u8 |\n| 16\
    \ integer | i16 | u16 |\n| 32 integer | i32 | |\n| 64 integer | i64 | u64 |\n\
    | 64/32bit (int size) | isize | usize |\n| 32 float | f32 | |\n| 64 float | f64\
    \ | |"
