    # Review


    # Security distributions


    # Kodachi Linux


    A reasonably secure distribution – easy to use but difficult to install


    ![](img/adbb964c9bace8f3e3949547041f6ef9_81_0.png)


    +   - Kodachi enables you to use your own VPN installed of Kodachi''s and ban
    users who misuse their VPN for things such as illegal torrents


    # How is it secure?


    Unlike the other distros, Kodachi doesn''t use a hardened kernel, however the
    kernel is patched against several series of known for information leak vulnerabilities
    and also the major privilege escalation vulnerability Dirty COW. It also includes
    Firefox to run common applications such as Veracrypt and Tor.


    Kodachi routes all connections to the internet through a VPN before passing them
    to the Tor network. It also bundles a collection of tools for easy use of information
    such as the Tor exit country. Additionally, the distribution connects you to the
    DNS resolver and includes well-known cryptographic and privacy tools to encrypt
    offline files, emails and messaging.


    # Is it easy to install?


    The installation is not without its strokes. Kodachi uses the Refracta installer
    to anchor the anchor. The installer is very rudimentary, for that it uses Parted
    for partitioning the disk. You can''t easily delete the default username because
    many of the custom scripts won''t function post-installation – not something we''d
    expect to see.


    # Overall


    Kodachi uses Firefox to sandbox apps and is very easy to install. But its collection
    of privacy-centred tools and utilities that help you remain anonymous when online
    is unparalled.


    # Qubes OS


    Ensures maximum security and privacy, but at the price of usability


    ![](img/adbb964c9bace8f3e3949547041f6ef9_81_1.png)


    +   - Qubes OS has an easy to follow, but it is a complicated distro and you need
    to learn the ropes. (See LUB189 p60 for a detailed guide.)


    # How is it secure?


    Qubes divides the computer into a series of virtual domains called cubes. Applications
    are restricted within their own cubes, so you can safely visit untrusted websites
    and another instance of the browser in a different cube for online banking. A
    malware riddled in the untrusted cube will not affect the banking system.


    # What about anonymity?


    Qubes is geared towards security than privacy and anonymity, and therefore lacks
    any specific software or integration to protect your identity. In fact, if you
    care about privacy as well as security, Qubes developers suggest running Onion
    on top of Qubes to get the best of both worlds – although performance suffer.


    # Installation and setup


    Qubes is based-on Fedora-based distribution, but it doesn''t recommend installation
    on a dual-boot computer, nor inside a virtual machine like VirtualBox. For example,
    you can add applications with dnf or a graph app but you''ll need to make sure
    you do this within TemplateVM. If you''re using custom hardware isn''t detected
    the installer falls back to the command-line installer which has a well-known
    bug that prevents installation.


    # Overall


    Qubes compartmentalises the entire linux installation into powered-virtual domains.
    This arrangement ensures that a compromised app doesn''t bring down the entire
    installation.'
