  mdcn: '


    # 教程


    ## Mycroft: DIY 语音助手


    Mycroft，请帮帮我。


    - Hey Butter，在早上 X 点设置一个闹钟。

    - Hey Butter，录音这段内容。

    - Hey Butter，[插入搜索词] 是什么。

    - Hey Butter，给我讲个笑话。

    - Hey Butter，去睡觉。

    - Hey Butter，设置一个提醒事项。

    - Hey Butter，我有任何提醒事项吗？

    - Hey Butter，增大/减小音量。

    - Hey Butter，天气怎么样？


    GitHub 上有一个活跃的社区随时准备帮助请求，这非常方便，因为当技能（Skills）无法正常加载时，Mycroft 会输出一些 Python 错误……


    ## 09 播放音乐


    唯一官方支持的音乐播放应用似乎是 mpidify，我们在处理它时遇到了很大困难。在花费了几个小时调整依赖项并错过了截止日期后，我们依然无果。然而，我们在 GitHub
    仓库中找到了 `spotify-skill`，它的效果非常好。


    通过将 GitHub URL (https://github.com/spotify/spotify-skill) 复制到 Mycroft CLI 并使用
    `install skill`，你将获得一个导入 Spotify 的新选项。然后“Mycroft, Play Spotify”就会加载我们最近的曲目。问题很简单，但我们认为这是直接向
    Mycroft 流传输音乐的唯一方法：使用 `spotify-skill` 或将其他音乐流向 Spotify Connect。这仅是我们的推测，但它在官方
    Spotify 设备的许可限制下可以运行。


    你也可以跳过我们之前使用 `rmap` 的步骤，或者询问“Mycroft, what is my IP address”。


    ![](img/adbb964c9bace8f3e3949547041f6ef9_77_0.png)


    ## 08 添加技能


    当然，默认功能都很好，但作为一个在这一方面与众众的的开源程序，Mycroft/MyPi 现在已经有了自己的天地，并提供了多种不同的声音。这些惊人的“技能”——这我们要感谢亚马逊。


    回到 Mycroft.ai，是时候探索技能市场了。使用 URL 安装技能非常有用，但 Mycroft 也会识别“install Skill”为一条命令。你将看到一个由社区开发的技能列表，你可以在那里找到安装它们所需的名称和命令，例如，YouTube
    也需要一个简单的 YouTube 技能。


    ## 10 播放播客和电台


    幸运的是，流传输播客比流传输音乐容易得多。快速执行“install podcast skill”即可安装插件技能，然后你就可以在 Mycroft.ai 上为你喜爱的播客进行选择，并开始使用了。之后说“Mycroft,
    play podcast”应该就能解决问题。


    我们在网络电台技能上的运气没那么好，出现了许多 PHP 错误，这些错误在 Mycroft 的评论区和日志中可见。社区页面上的每个技能都有一个“status”列来指示其是否就绪，但我们发现了……


    ![](img/adbb964c9bace8f3e3949547041f6ef9_77_1.png)


    ![](img/adbb964c9bace8f3e3949547041f6ef9_77_2.png)


    ## 替换商业语音助手


    虽然 Pico 是一个投入了（太多）小时的实验，但我们认为它准备好正式上市了吗？一句话之：没有。核心体验可能还可以，但它极其有限，而且技能无法满足你的体验。即使在闲置几个小时后，它们也很可能无法工作。


    如果你正在寻找一个新的爱好并且不介意花几天时间，你从中会获得乐趣。然而，如果你在寻找一个新的语音助手来读新闻、听音乐或听电台，我们仍然被迫推荐商用设备之一。尽管如此，Mycroft
    II 现在可以在 Indie 上预订。


    ![](img/adbb964c9bace8f3e3949547041f6ef9_78_0.png)


    | 型号 | Mycroft | Mycroft II | Amazon Echo |

    |---|---|---|---|

    | 平台 | 树派 | 树派 | 自定义硬件 |

    | 价格 | $99 | $149 | $49 |


    ## 测试


    ```

    mycroft-cli-client A command line interface, for discovering skills

    ```


    My Skills Manager，用于安装新技能 `say_to_mycroft` 使用命令行执行命令


    `speak`。对着测试麦克风说话。录制一个样本并回放到你的麦克风。


    ## 13 成为支持者


    Mycroft 提供了一种可选的订阅，每月 10.99 美元。这些订阅的主要目的是支持开发团队，支持者可以获得专属更新。


    截至 2017 年，一种新格式仅供支持者使用。此外，4 月份还有与 John Mercury 本人一起的小组会议。他的使命声明写道：


    > 我们想展示你有多看重你的支持。变得更好、更有培养、更强大。你的贡献让我们更接近创建通用人工智能的终极目标，这是属于大家的。


    ## 14 那么，这值得吗？


    这样的设置有优也有缺点。你可以拥有创建自己的技能的自由，或者加入这个出色的社区。


    ![](img/adbb964c9bace8f3e3949547041f6ef9_78_1.png)


    ## Mycroft 的其他版本


    目前 Mycroft 有几种口味可用。技术上称为 Mycroft 的仅包含免费版。你需要添加自己的树莓派来运行它，此外我们可以制作它。


    如果你更喜欢现成的版本，Mycroft I 自带扬声器。


    '
