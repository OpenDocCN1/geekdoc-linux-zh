    The MX Linux project is a joint effort between the antiX and MEPIS communities,
    and the distribution from both projects, we use some modified components to perform
    over system.


    The distribution uses a custom Xfce for a desktop environment that performs well
    even on older hardware. MX Linux ships with a custom installer to explain what
    is going on the various steps. The installer also uses reasonable defaults that
    help first-timers sail through the installation. The partitioning screen offers
    the option to partition


    the disk automatically if you want MX Linux to take over the entire disk; dual-booters
    and advanced users will have to Gparted to partition manually. Advanced users
    will appreciate the option to choose which services to start with while new users
    can press with defaults. If you''ve made modifications to the desktop, the installer
    will carry them through to the installation, without any touch. The desktop boots
    to a welcome screen that contains useful links to things and the distribution''s
    set of tools. The installer also includes a 172-page user''s manual and you can
    access other avenues of help and support,


