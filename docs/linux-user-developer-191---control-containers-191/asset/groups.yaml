    \n```\nsudo snap install --classic celery\nsnapcraft create --name my-snap .\n\
    ```\n\n- 创建用于签名上传的密钥\n  在开始构建镜像之前，你需要创建一个密钥来签署未来的上传。生成一个与你的 Ubuntu Store 账户关联的密钥，并使用\
