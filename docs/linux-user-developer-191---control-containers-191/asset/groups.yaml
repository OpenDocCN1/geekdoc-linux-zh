    # 开源


    # 你的 Linux 新闻与观点来源


    # 观点


    ## 内核专栏


    Jon Masters 注意 Linux 内核社区的最新动态：Linux 4.17-rc1 发布，4.18 开发持续进行


    **Jon Masters** 是一位已经在 Linux 领域工作了 22 年以上的内核黑客，他在 13 岁时进入剑桥大学，Masters 现在为一家大型企业供应商工作。他正在推动能效
    ARM 驱动服务器标准的制定。


    Lin Torvalds 已宣布 Linux 4.16，并注意到事情至少稳定到了最低程度，避免了进入 RC（发布版本 8）。


    这些自第一个发布以来一直未解决的问题并不特别显著，网络维护者已明确表示他可以接受。Linux 4.16 包含了许多功能，例如 AMD 的安全加密虚拟化 (SEV)，以及针对跨架构的
    Meltdown 和 Spectre 安全漏洞的许多新增。


    这在 4.17-rc1 中最终形成了一个发布版本 1 (RC1) 内核。最新的内核再次侧重于接收侧的 TLS 支持（内核现在有了内核 TLS 支持，作为额外的
    GSO 数据包过滤器，并对未使用的测试对现有文件系统进行了健壮性增强）。


    另一方面，4.17 带有一个警告：它缺乏对恶意攻击者可能创建的 x64 文件的支持，这应该被视为安全风险，对于过去几年的所有 Linux 内核都是如此，由于一个现在不可选的功能（汇编
    gadget）。


    Linux 4.17 引入了针对 Spectre 变体 1（边界检查绕过）的缓解措施。这些措施依赖于漏洞代码序列来测试用户空间提供的地址是否在许可范围内。


    处理这些数据时，除非在所需的范围内，否则没有问题，但许多处理器随后会执行超出被告知停止的检查范围。这是通过识别存在漏洞的内核代码（使用扫描器）以及各种新宏（如
    `array_index_mask`）来实现的。这些防止了漏洞的执行。


    也许 4.17 中最重要的开发是，针对 Linux 在八种不同架构上对漏洞变体 2 的某些支持。虽然 Linux 以缓解和响应为傲，但它在支持长期软件和硬件漏洞方面一直很弱。


    在架构层面上，使用 KPTI（内核页表隔离）的缓解措施在 4.16 中合并，支持 Spectre 变体 2（分支预测器推测）的分预测器隔离（通过 ARM Trust
    Firmware），s390（大型机）获得了类似的 Spectre 变体 2 支持，尽管是“可选”的。


    这是 4.17 合并架构的情况。在移除大型机 crif, f3x, m32, mn1030 和 score 的缓解措施后，Benjamin 引起了大量关注。很多人甚至听说过其中一两个。


    虽然 x86 实现了“retpolines”（返回跳转），它们不会受到间接分支调的影响，但 s390 使此类间接调用看起来是通过新内核功能暴露的执行类型跳转。


    ## 侧重安全


    随着 4.16 的发布开启了 4.17 内核窗口。这是一个时间段，通常为两周，期间 Linux 可能会出现具有破坏性的更改，并为内核功能添加新特性。


    正如这一点所言，它们使用的漏洞极其不同，但受到相同事物的保护。有一公司收取了 SoC 线、CPU 微架构和软件生态系统的费用，这比从第三方许可现成的或 SoC
    核心（如 ARM、MIPS 或 RISC-V）要贵得多。事实是所有的 SoC 线仍然存在，但没有使用


