    \ PLC.\n\n# Welcome to issue 191 of Linux User & Developer\n\n# in this issue\n\
    \n- Control Papers, p18\n- The Future of Ruby, p32\n- Ubuntu 18.04, p5\n\nWelcome\
    \ to Linux and North America's favourite Linux source. It's been another month\
    \ in the open world. Of course, Ubuntu 18.04 LTS launched, and we have also seen\
    \ open source snag-features to support the German government with a Debian-based\
    \ Ubuntu for 300,000 citizens. Microsoft floored a lot of pixels by revealing\
    \ Intel Linux-based OS for the desktop. Linux Foundation describes Microsoft's\
    \ Linux as the 'new' — and shouldn't be overlooked. Many companies now use Linux\
    \ and FOSS when it makes money and practical sense. Then we'll show how to use\
    \ open source connectors and systems from Ansible, Docker, Puppet and Vault to\
    \ help recover systems. We've covered how Ubuntu 18.04 is this time (p18), but\
    \ not for desktop, cloud, containers and more.\nChris Thornnett, Editor\n\n| NEW\
    \ LETTER PRIZE |\n| :--- |\n| The best winner is us datashur Pro! |\n| linuxuser@future.com\
