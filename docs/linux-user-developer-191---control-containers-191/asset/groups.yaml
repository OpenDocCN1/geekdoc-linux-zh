    ## Feature


    ## Ubuntu 18.04 LTS


    ### Ubuntu Cloud


    The Ubuntu push to cloud gathers paces, with a broad product offering.


    Canonical has already highlighted the importance of Ubuntu Cloud to **its revised
    strategy as a rapidly growing revenue stream.** Ubuntu is on the way to becoming
    the OS for cloud computing, with 50 per cent of public cloud workloads and 54
    per cent of OpenStack clouds using the OS.


    Canonical has supported **OpenStack on Ubuntu** since early 2011, but what exactly
    is it? OpenStack is a "cloud" operating system that controls pools of compute,
    storage, and networking resources throughout a datacenter, all managed by a dashboard
    that gives administrators control while empowering users to provision resources
    through a web interface.


    Getting started with Ubuntu for your own use is straightforward, thanks to a tool
    that is ideal for quickly building an OpenStack cloud on a single machine in minutes;
    in addition, it can easily scale to a group of four or more physical servers,
    using **MAAS (Metal as a Service - a cloud method of providing physical hardware,
    provisioning and management), Juju, LXver, PaaS and HCI.**


    For local use, you can use LXD after version 3.0 of Ubuntu is a lightweight hypervisor
    running Linux kernel operating systems with VM-state operations under unprecedented
    speed. LXD can manage virtual machines with the security of a hypervisor, but
    running much faster. For bare-metal, LXD containers are as fast as the native
    OS which means that in the cloud,


