    ## 你能解释一下你设计的直原理图吗？


    > “没有水下外壳项目……一切都是水中泡影”


    进入空心壳体的电缆变成了一个密封的电池供电单元。在首次迭代中，我有一个小型铅酸电池和充电器。后来我使用了带有锂离子电池包的树莓派。这让我以合理的价格获得了更长的供电时间。至于存储，我选择了小电池和
    SD 卡。这里有一些树莓派的 HaFS 可以用于此。


    项目中最具挑战性的部分是什么？定义水下外壳；我有很多想法。电子设备都是现成的，社区也为硬件找到了许多参考资料。


    “水中泡影”。到今年年初，我有一位友好的合作伙伴 Dylan Thomas，他帮助我处理机械结构。Dylan 还建立了一个配备设备的工作室，用来制作压力测试外壳（以及我）。


