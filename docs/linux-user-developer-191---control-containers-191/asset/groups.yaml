    # What''s new


    With the release of the Raspberry Pi 3 B+ the operating system was updated. This
    upgraded version of Thonny, the Python editor, as well as PaperFlash and Pygame
    have enhanced support for large screens. To use, from the main menu select the
    Raspberry Pi configuration option. Navigate to the System tab and select the ''Pi
    Doubling'' option. This provides a 2x the number of pixels, making everything
    twice as size. This setting works well with larger screens and HiDPI displays.


    # Configure the Wi-Fi


    With the latest OS, Wi-Fi is disabled by default. This means that you have to
    enable it yourself (in some cases) before your Wi-Fi becomes active. Open the


    ![](img/adbb964c9bace8f3e3949547041f6ef9_74_0.png)


    # Boot from the storage device


    This completes the configuration of the OTP. Shut down your Raspberry Pi and remove
    the SD card, which is no longer needed. Take the USB device you prepared and insert
    it into one of the USB ports. Boot the Pi and wait after a few seconds the Raspberry
    Pi will begin booting up. If you have a connected device you''ll see the full
    splash screen and the boot-up time may be slower than using an SD card - this
    depends on the drive you''re using. However, once the Pi has completed booting
    it will run at the speed of the drive.


    ![](img/adbb964c9bace8f3e3949547041f6ef9_74_1.png)


    # Configure the boot mode


    In order to boot your Raspberry Pi from the USB device, you need to edit the config
    file. Open the terminal and run the following command: line_usb_boot_mode=1 |
    sudo tee -a /boot/config.txt. This adds


    ```

    line_usb_boot_mode=1 | sudo tee -a /boot/config.txt

    ```


    ![](img/adbb964c9bace8f3e3949547041f6ef9_74_2.png)


    menu and Raspberry Pi Configuration settings, then select the ''Location'' tab
    and set ''Wi-Fi''. Choose the list and select the correct network for your current
    location.


    # Check the configuration


    Once you''ve edited the config file, type sudo reboot to reboot your Raspberry
    Pi. The next step is to check that the OTP has been programmed correctly. Open
    the Terminal window and enter the following:


    ![](img/adbb964c9bace8f3e3949547041f6ef9_74_3.png)


    # The PoE HAT


    The Raspberry Pi PoE (Power over Ethernet) HAT is now available. This new add-on
    is designed for the 3B+ and allows the Raspberry Pi to be powered by a PoE-enabled
    Ethernet network. It features 802.3af PoE, with 57V DC, a 25 x 25mm silent fan
    for processor cooling and fans. Could this signal point towards the Raspberry
    Pi being embedded in more IoT devices? You can purchase the PoE HAT from https://raspberrypi.org/products/poe
    - at the time of writing, price was to be determined.


    ![](img/adbb964c9bace8f3e3949547041f6ef9_74_4.png)


    ```

    line_usb_boot_mode=1 | sudo tee -a /boot/config.txt

    ```


    At some point in the future you will want to remove the SD card that you used
    to set up the Raspberry Pi. To do this simply remove the line_usb_boot_mode=1
    from config.txt so that the Raspberry Pi boots from the SD card. Since you can
    now use this SD card to boot up the Pi you''ve just pulled, you can insert the
    card into your main PC and use it with a different Pi. If one boots up, it will
    be set to start from SD card! Open the terminal and open the config.txt file by
    running the command `sudo nano /boot/config.txt`. Scroll down and locate the line
    of text: line_usb_boot_mode=1 and delete it or comment it out. You can now use
    this SD card in another Raspberry Pi.


    ![](img/adbb964c9bace8f3e3949547041f6ef9_74_5.png)


