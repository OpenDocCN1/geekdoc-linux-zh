    audio recognition and image recognition, among others.


    In order to keep your Python environment organised, you should create a virtual
    environment where you can safely install TensorFlow. You can do this with the
    following:


    ```

    virtualenv --site-packages -p python3

    t tensorflow

    ```


    This will create a virtual environment, in the subdirectory named tensorflow where
    you can install TensorFlow by sourcing the activation script.


    ![](img/adbb964c9bace8f3e3949547041f6ef9_47_0.png)


    ```

    source ~/tensorflow/bin/activate

    (tensorflow)$

    ```


    Your command prompt should change to the new one you see above. You can now install
    TensorFlow into the virtual environment


    Because of its popularity, TensorFlow has been ported to many different platforms
    - including mobile, web and OS. In this article, we''ll look at how TensorFlow
    can be used to do image recognition and classification. We''ll look at how to
    get it installed on your machine, and how to create a basic setup so you can do
    some image processing.


    ```

    pip3 install --tensorflow

