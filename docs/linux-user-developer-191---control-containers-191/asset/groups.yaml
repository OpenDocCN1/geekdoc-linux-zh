    从命令行组织你的媒体库


    键盘用户热爱命令行，现在他们甚至可以将他们的库导入 beats。除了管理库之外，beats 还可以修复音乐文件的文件名和元数据，获取封面艺术和标签。更棒的是，虽然
    beats 在许多流行发行版的存储库中可用，但你可以使用 Python 的包管理器 pip 安装最新版本，这可能需要为该工具创建一个配置文件花费一些时间。


    一旦安装，beats 将导入你的音乐文件并将它们设置为配置文件中的权限。该实用程序还通过引用在线 MusicBrainz 数据库，对任何元数据中的过滤器和间隙进行处理。一旦完成导入，你就可以使用
    beats 命令来查询集合了。例如，`beats -ls 1998*` 返回 1983 年到 1985 年之间的结果。beats 还有一个 Web UI。要使用
    Web 界面，需要 Flask 框架，你可以通过 `pip flask` 安装它。然后你可以通过访问 http://localhost:8337 在配置文件中启用
    Web 界面，以便通过浏览器搜索音乐。


    点击搜索结果查看其元数据，包括歌词。如果你启用了插件并获取了它们，Web 界面还有播放和暂停音乐的基本控制功能。


    - 优点：允许你通过单条命令排序和分类你的音乐收藏，包括封面和标签。

    - 缺点：需要手动编写一个配置文件来完成它需要的功能，这会花费一些时间。

    - 非常适合……：从 CLI 相对轻松地对大量的音乐文件集合。http://beats.io


