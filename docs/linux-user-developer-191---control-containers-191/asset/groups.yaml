    广告客户 Adrian Crisp\n017025 68735\n\n### 订阅\n邮件联系 contact@myfutureuser.com\n英国订单：0345\
    \ 660 2662\n国际订单：+44 (0)1345 640 262\n在线及订单：myfutureuser.com\n订阅主管 Jo Collier\n\
    \nLinuxUser & Developer 是一本面向 Linux 爱好者的杂志。业务合作请联系我们的营销部门。\n国际许可总监 Adrian Crisp\n\
    adrian@linuxuser.com\n\n### 发行\n发行主管 Tim Mather\n\n### 制作\n美、英国内容战略负责人\n制作项目经理\
