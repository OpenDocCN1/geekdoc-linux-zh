    # Discover another of our great bookazines


    From science and history to technology and crafts, there are dozens of Future
    bookazines to suit all tastes


    ## THE ESSENTIAL GUIDE FOR CODERS & MAKERS

    PRACTICAL Raspberry Pi


    ![](img/adbb964c9bace8f3e3949547041f6ef9_70_0.png)


    > “The housing was tricky – I had many leaks"


    ## Contents


    - 72 Meet PipeCam, the Pi-powered underwater camera

    - 74 Super-size your Pi 3 B+ storage, we show you how

    - 76 Create your own voice assistant with Pictoft


    ## Pi Project


    ### PipeCam


    ![](img/adbb964c9bace8f3e3949547041f6ef9_71_0.png)


    ### PipeCam


    Using a Pi to keep an eye on the bottom of the ocean is simpler than you think
    – after the leaks.


    ## Fred Fourie


    In 2014, Fred Fourie saw a long-term timelapse-video of corals fighting with each
    other for space. That piqued his interest in the study of biofouling, which is
    the accumulation of algae and other organisms such as barnacles. Underwater documentaries
    like Chasing Coral and Blue Planet fueled his curiosity, and inspired by the OpenMV
    project, he used the Raspberry Pi in 2015 to create the PipeCam-low-cost-underwatercamera.


    Fred is an electronics technician for an engineering firm in Cape Town, South
    Africa, that specializes in marine sciences.


    This freed me up to work on the software and electronics.


    Talking of software, what is the PipeCam running? I used Raspberry Pi as model
    0. I set up Python by default on most projects so I can host ''quick look'' digital
    pages. On the PipeCam I installed i2c-tools to set up memory to keep track of
    time and electronics to be auto-mounted to a specific location. I used the Pi
    to drive the information, and then added the video by using ffmpeg. The main script
    is written in Python, which is my native language. The script handles which camera
    has enough space to record, and records when it starts or stops the process. The
    script outputs some basic info into a log file and sets up my recording interval.
    It''s not too complicated.


    ## Like it?


    Fred has done construction for the Antarctic and has worked on space weather from
    home. He gets excited about biological science and he loves datasets. Follow his
    adventures on Twitter @FredFrie.


    Any particular reason for using the Raspberry Pi? I know my way around Linux system
    better than microcontrollers. The familiarity of the Pi environment made quick
    setup and experimentation possible. The awesome community is also supportive.


    ## How do you plan to extend the project?


    Since the project has been promising, the next step is to use Pi to increase friendliness
    and endurance. To achieve this there are three modifications I have in mind:


    - Add a webcam-based web interface on the Pi, for system health checks.

    - Integrate some battery monitoring with current and charging circuits, with a
    light resistor (LDR) if there''s enough light to take a picture.


    ## Further reading


    Fred is interested in the natural world and electronics. He''s also busy with
    learning and object detection projects and suggests that many improvements could
    be made.


    ## Could you explain the frankly schematic you''ve designed?


    > Without an underwater housing project is... dead in the water


    A cable into the hollow body made turn into a sealed, battery-powered unit. In
    the first iterations, I had a small lead acid battery and charger. I used a Raspberry
    Pi with a Li-ion power pack. This gives me more time for power capacity for a
    reasonable price. With regards to storage, I opted for a small battery and SD
    card. There are a few Raspberry Pi HaFS for this.


    What was the most challenging part of the project? Define the underwater housing;
    I had many ideas. The electronics are all-the-shelf and the communities has found
    many references for the hardware.


    Dead in the water. As of the start of the year I had a friendly onboard, Dylan
    Thomas, who helped me with the mechanics. Dylan also set up a workshop with equipment
    to create pressure-test housings (and me).


    It''s all about building the project using idle times. In the photo you can see
    that the Pi is controlled via a relay by an Arduino. The Nano takes inputs from
    a sensor, and controls the LED. These inputs tell the Pi to be switched on.


    To the RTC on the Pi, you''ll also see a BME280 sensor monitor probe, temperature,
    humidity, and detected pressure. There''s also a slide switch to select video
    or photo mode.


    ## Floating brain


    Fred first used a PI 3 and then a PI 2 before switching to the Pi-Zero to reduce
    power consumption. A cron job on the PI calls a Python script to check available
    space on the attached USB drives, and it''s all okay, it snaps a picture or records
    video.


    ## Waterproof chassis


    The PVC pipe and the end caps protects the electronics from the elements. The
    leak-proof housing has a 10mm Perspex lens that withstands four bars of pressure.


    ![](img/adbb964c9bace8f3e3949547041f6ef9_72_0.png)


    ## Fuel


    The system currently has no real power management, which Fred admits is a shortcoming
    that he hopes to remedy using an Arduino Nano. For the current configuration allows
    for a second power bank.


    ## Components list


    - Raspberry Pi Zero

    - Raspberry Pi Camera Module

    - SanDisk USB

    - Power bank

    - On/off switch

    - 10mm Acrylic

    - 10mm PVC pipe

    - 10mm PVC screw

    - 10mm PVC stop


    ## Data


