    ## NEAR-FUTURE FICTION


    ## Happy Forever


    ![](img/adbb964c9bace8f3e3949547041f6ef9_95_0.png)


    Bill is the first to arrive.


    With the energy of a sixteen-year-old, he bursts into the room, "Party!" he screams.


    I wish we could celebrate your thirty-third birthday, every single year, without
    the added weight of trying to ignore the enormous grief of yours. But what can
    I call who chose to stop at a younger age than I did.


    He''s never going to grow up, and any experience he gains is because of the effects
    of decaying brain cells. He''s never going to change to make him anything easier
    for me.


    She lowers herself carefully on the near chair. "I love you, Mom. I can put it
    off all as I need. Pass me in."


    I put her in a short gin and tonic, and this is how we Every we have this conversation
    — since she turned fifty-three and took me. As time goes by, it''s easier and
    easier to think of her as my grandmother rather than the grandmother she is. I
    regret the secret.


    Uncle comes across the room and laps me on the back. "Forever is a long time.
    It''s a really long time for someone like you, angel."


    He glances down at Joanna and opens his mouth, but stops before he. There''s never
    been a good way to express them. They are not the type of family to say that.


    He hovers, on one foot and the other, the eyes to scan the room. "I need to find
    a match for boy coping with old age. It''s why most people avoided her. And the
    fact that she plays the cantankerous woman a little too well. Thankfully, she''s
    fairly straight with us," he whispers.


    "Her, That great-great-niece of mine. She shouldn''t keep aging. We will have
    to pay for her medical bills. It''s embarrassing anyway, an Ancient. Not to mention
    the shame of a family of kids like ours."


    He''s got a point, but I imagine it.

