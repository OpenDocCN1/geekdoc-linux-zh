    还与 MySQL、SQLite 和 PostgreSQL 等许多数据库配合。你可以使用 IDE 从 Fedora、Ubuntu 和 Slack 等各种发行版安装包。


    Gambas 在所有流行发行版的官方存储库中可用。最新发布版本是一个小项功能更新，对各种组件进行了修复和微调，包括代码编辑器、数据库编辑器、调试面板、表单编辑器、包向导等。


    Gambas 是一种真正的面向对象的语言，具有对象、类、方法、常量、构造函数和析构函数。


    - 简化了使用 Qt4 或 GTK+ 工具包和设计器为 Linux 构建图形应用的过程。

    - 有些人喜欢它的 Visual Basic 语言，另一些则认为这是它的优点。

    - 使用类 Basic 的语法构建图形用户界面应用。

