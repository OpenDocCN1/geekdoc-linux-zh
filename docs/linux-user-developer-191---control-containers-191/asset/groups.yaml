    | 通过 Tor 路由所有流量，并带有多种隐私应用和工具 |

    | **作为桌面好用吗？** | Xfce 桌面轻量级，并为各类用户提供开源应用 | 只要你遵循它的特定需求，它的运行就像与其他系统一样 | 整合了一些可以轻松清理的程序
    | 它的 KDE 桌面受到限制，你需要从命令行添加应用 |

