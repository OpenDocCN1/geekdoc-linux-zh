    # 探索我们的另一本优秀数字书杂志


    从科学、历史到技术和工艺，有几十本 Future 杂志可以满足各种口味


    ## 程序员与制作者的必备指南

    实用型树莓派实战


    ![](img/adbb964c9bace8f3e3949547041f6ef9_70_0.png)


    > “外壳的设计非常棘——我遇到了很多泄漏问题”


    ## 目录


    - 72 认识 PipeCam，由 Pi 驱动的水下摄像机

    - 74 扩展你的 Pi 3 B+ 存储，我们向你展示如何操作

    - 76 使用 Pictoft 创建你自己的语音助手


    ## Pi 项目


    ### PipeCam


    ![](img/adbb964c9bace8f3e3949547041f6ef9_71_0.png)


    ### PipeCam


    使用 Pi 监控海底比你想象的要简单——在解决漏水问题之后。


    ## Fred Fourie


    2014 年，Fred Fourie 看到了一段关于珊瑚为了空间而相互斗争的长期延时视频。这激发了他对生物附着（biofouling）研究的兴趣，即藻类和其他藤等生物的聚集。《追逐珊瑚》和《蓝色星球》等水下纪录片激发了他的好奇心，受
    OpenMV 项目的启发，他在 2015 年使用树莓派制作了 PipeCam——低成本水下摄像机。


    Fred 是南非开普敦一家工程公司的电子技术员，该公司专门从事海洋科学。


    这让我有空去处理软件和电子部分。


    说到软件，PipeCam 运行的是什么？我使用树莓派 Model 0 作为核心。我在大多数项目中都默认安装了 Python，这样我可以托管“快速查看”数字页面。在
    PipeCam 上，我安装了 `i2c-tools` 来设置内存以跟踪时间，并让电子设备自动挂载到特定位置。我使用 Pi 来驱动信息传输，然后使用 `ffmpeg`
    添加视频。主脚本是用 Python 编写的，这是我的母语言。脚本处理哪个摄像头有足够的空间进行录制，并在进程开始或停止时进行记录。脚本会将一些基础信息输出到日志文件中，并设置我的录制间隔。这并不复杂。


    ## 喜欢吗？


    Fred 曾为南极提供建设服务，并在家里研究过太空天气。他对比生物科学很感兴趣，并且热爱数据集。可以在 Twitter 上 @FredFrie 关注他的冒险。


    使用树莓派有什么特殊的理由吗？相比于微控制器，我更熟悉 Linux 系统。对 Pi 环境的熟悉使得快速设置和实验成为可能。出色的社区也提供了支持。


    ## 你计划如何扩展这个项目？


    由于该项目很有前景，下一步是使用 Pi 来增加易用性和耐用性。为了实现这一点，我脑中有三个改进方案：


    - 在 Pi 上添加基于摄像头的 Web 界面，用于系统健康检查。

    - 集成带有电流和充电电路的电池监控，如果光线足够可以拍照，则使用光敏电阻（LDR）。


