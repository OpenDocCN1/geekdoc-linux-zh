    选项具有诸如跳过二进制文件和限制结果中的文件数量等选项。当你使用过滤选项时，Searchmonkey 需要 JAVA 1.8 或更高版本。你可以无需安装直接使用。访问我们网站的“下载”部分，获取包含所有依赖的
