    Raspberry Pi configuration option. Navigate to the System tab and select the ''Pi
    Doubling'' option. This provides a 2x the number of pixels, making everything
    twice as size. This setting works well with larger screens and HiDPI displays.


    ## Configure the Wi-Fi


    With the latest OS, Wi-Fi is disabled by default. This means that you have to
