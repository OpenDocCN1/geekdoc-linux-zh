    \ does not take arguments, but functions can take inputs as parameters.\n\nOne\
    \ thing to note here is that the parameters to a function must always take specific\
    \ types. In this case `a` and `b` are `f64`-floating point numbers. No restriction\
    \ is placed on the types of variables that can be used when they are passed to\
