    ## 特别报告：Ruby


    # Ruby 依然活跃且健康


    # Ruby 的创造者在五来的首次主旨演讲中宣布：“我们将尽一切努力生存下去”


    Chris Thornett 从巴斯（Bath）活动现场报道


    一年一度巴斯 Ruby 会议是英国最大的 Ruby 活动，为期两天，融合了技术演讲和各种趣味活动（更不用说卡拉OK 了）https://bathruby.com/


    > 软件是如何诞生的？这是一个来自友蔼的日本创造者松本裕弘（Yukihiro Matsumoto）的非凡问题。他的首次主旨演讲在为期两天的巴斯 Ruby 会议上吸引了
    500 多名 Ruby 开发者。Ruby 在 2020 年 2 月庆祝了 25 周年——因此在 1995 年 12 月举行了盛典。为了回答自己的问题，Matz
    建议，当软件成为你预期的那种富有诗意的答案时，它就诞生了。对于 Matz 来说，Ruby 的“诞生”比该语言的起源早两年，就在他的生日那天（松本裕弘于 1963
    年 12 月 21 日出生于东京）。Matz 在看到一颗宝石后提到了这一点：“Ruby 既美丽又更昂贵，所以我把我的语言命名为 Ruby，”他对自己说道。


    例如，它的语法非常易读且以一种紧凑的方式富有表现力，作为一种动态的、反射的面向对象的通用编程语言，它是直观且易学习的。Matz 引用道，Ruby 尝试尽一切，“Ruby
    的设计目标是让程序员感到快乐。”


    但并不是所有人都很快乐。该框架的流行程度已经下降。Ruby on Rails (RoR) Web 应用框架在那些开始处理大量繁重工作的初创公司中占据主导地位，此前在
    2012 年的 RedMonk 语言排行榜中，人们曾用 Ruby 完成这些工作，而在其他语言中位列前 10。


    然而，Matz 并不是年来第一个只为了生日蛋糕庆祝的人。Ruby 已经成熟，但关于它是否还能再生存 25 年仍然存在疑问。就像它的创造者一样，Ruby 语言充满活力且富有装饰。


    Ruby 的排名下降到了第八。Ruby 尽管受欢迎，但它不再是超级巨了，并且面临着竞争问题，例如成为旧版 Web 更关注的问题。尽管完全没有死亡，但由于其局限性，例如
    JavaScript 运行时环境 Node.js 已被前端 JavaScript 用户在前端和后端广受欢迎，其单线程处理多连接的方法和其他特性（尽管这确实使得它不适用于图像处理等
    CPU 密集型任务）。


    很清楚，我们意识到任何编程语言的采用都是受到源自社区语言和生态系统成长的项目和框架的刺激——而 Ruby 就是其中一个例子。虽然 Matz 在主旨演讲中广为人知地对他在语言中犯过的过去错误表示遗憾，但他明智地制定了解决性能和扩展性问题的路径。


    Matz 关注两个关键趋势：可扩展性，以及他所谓的“更好的伙伴”。为了应对可扩展性并创造更大的创造力，Matz 相信“更快的执行、更少的代码、更多的团队[以及]代码本身比功能更重要。”他告诉我们：“但并不是为了执行更快，因为我们需要处理越来越多的流量。我们正在达到核心的极限。所以
    Ruby 3.0 的目标是比 Ruby 2.0 快三倍——或者正如他所说，‘Ruby3x’。”


    > 代码越多，意味着维护、调试、时间和更低的生产力


    ![](img/adbb964c9bace8f3e3949547041f6ef9_32_0.png)


    上方：Cookpad 的 CTO Mike Woodroof：“你在每次发布中都能发现语言的微小改进，这是一个非常有趣且好语言”


    Cookpad (https://cookbook.co/uk) 是巴斯会议的主要赞助商，是一个深度依赖 Ruby 和 Rails 的团队典型示例。这是一个食谱共享网站，Mike
    Woodroof 说该网站在日本有超过 6000 万用户，正在全球范围内扩展，并将国际总部搬到了伦敦。使用 Ruby 构建，“我们的基础设施是由 Ruby
    脚本构建的——‘Ruby 让一切都变得非常充实’”


    正如 Ruby 工程师遍布世界，Cookpad 团队成员全职依赖。其中之一是 Matz，MRI 的创造者——自 1.9 版本以来一直是 Ruby 的官方解释器。由于他现在正在处理并发（Project
    Guild 项目），这是我们预计看到性能提升的另一个方面。然而，对于 Ruby 3，Woodroof 说：“对于 Ruby 来说，构建和解释是一个巨大的转变。Ruby
    拥有这些性能特性……””


    “这很容易说，”Matz 承认道，并指出在 1.8 时代，Ruby “太慢了”而且这是一个错误。佐木浩一（Koichi Sasaki）在 WARP（另一种
    Ruby 方法）上的工作提高了 1.9 的性能，Matz 说，“从那时起，我们一直在努力提高虚拟机的性能，但这还不够。”


    ## JIT 时代


    为了提高性能，Ruby 正在引入 JIT（即时编译）技术，这是一种 Java 和其他语言已经使用的方法。“我们说做这是一项复杂的项目，但我们的目标是在今年发布它，Ruby
    2.6 将是首个，”Matz 确认道。“你可以在 2.6 预览版 (http://github.com/ruby/ruby-2.6-preview) 中看到
    JIT 编译器的初始实现。对于 Ruby 2.6，”Matz 说，“‘至少对于 CPU 密集型任务来说，并不容易’。”


    可能是 2.6 预览版 (http://github.com/ruby/ruby-2.6-preview) 中 JIT 编译器的初始实现。对于 Ruby 2.6，”Matz
    说，“‘至少对于 CPU 密集型任务来说，并不容易’。”


    对于 Ruby 2.6，”Matz 说，“‘至少对于 CPU 密集型任务来说，并不容易’。”


