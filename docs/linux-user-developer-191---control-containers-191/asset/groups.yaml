    \ Rust 中，解引用一个无效指针会导致编译器错误，这有助于我们更早地发现错误。\n\n## 传递值\n\n所有权转移的另一种方式是传递值。如果我们有一个指向堆上某些字节的变量并将其传递给函数，内部的参数将获取该变量的所有权。让我们来看一个使用\
    \ `Box` 代替 `String` 的示例。`Box` 分配一些内存，将其初始化为给定值，并返回“箱化值”——一个指向内存的变量。\n\n图 7 中的代码包含了\
    \ `steal_`，它接受一个箱化的整数作为参数。\n\n该函数对参数没有做太多操作，但事实是，它接收值意味着它获取了它所指向的字节（值 2018）的所有权。当函数返回时，`x`\
    \ 离开作用域，内存将被释放。这意味着 `println!` 语句将无法编译，因为它在 `current_year` 失效后又引用了它。\n\n我们可以通过从函数返回值来停止这一点。在\
    \ Rust 中，当我们返回一个引用时，它会将所有权传回给上下文。在这种情况下，我们返回了 `x`，它进入了调用者内存中新的（影子）变量 `current_year`。\n\
    \n这是可以的，但如果我们想从函数返回多个独立的值，这样做也有益处。幸运的是，Rust 允许在不获取值所有权的情况下向函数传递值。\n\n对于这种用例，调用方式有点像“箱化值”：它允许我们查看箱的内容，但不会转移所有权。\n\
    \n图 9 显示了使用引用对图 8 代码的更简洁的版本。为了标记函数的某个参数是引用，我们需要在参数名称前面加上 `&`，并且在我们传递的变量（在本例中为\
    \ `current_year`）前面也加上一个 `&`。\n\n当我们可以返回所有权时，Rust 中需要写的内容要少得多，但希望在这里我们让你领略了这种语言的强大。\n\
    \n![](img/adbb964c9bace8f3e3949547041f6ef9_56_0.png)\n\n# UBUNTU 18.04 的主要特性\n\
    \nUbuntu “Bionic Beaver”（大海牛）18.04 是新一代领先 Linux 发行版的第一个长期支持（LTS）版本，包含超过 30 处令人兴奋的更改。\n\
    \n## 概览\n\n当像 Canonical 支持的 Ubuntu 这样被广泛使用的发行版发生变化时，整个 Linux 社区都会注意到。Ubuntu 的独特之处在于，它在包含长期支持（LTS）版本之前，就在\
    \ LTS 版本之外发生了剧烈变化。Ubuntu 版本的支持期为九个月，但 LTS 版本每两年发布一次，这意味着人们投入了大量精力以确保进入 LTS 的内容尽可能稳定。Ubuntu\
    \ 的最新变化是 17.10 Aardvark，它于 2017 年 10 月发布。\n\n开发随着公司业务重点的调整而调整。一年前，创始人 Mark Shuttleworth\
    \ 宣布公司不再关注融合，而是希望投资于提供日益增长的收入机会的领域——特别是那些能提供增长收入机会的领域。\n\n- **桌面**：Ubuntu 18.04\
    \ 首次在 LTS 版本中引入 GNOME。\n- **服务器**：Ubuntu 18.04 Server 改进了程序。\n- **云**：Ubuntu 在云方面有了重大进展。\n\
    - **容器**：Ubuntu 18.04 包含了对 Docker 和 Kubernetes 的深度原生支持。\n- **IoT**：Ubuntu 18.04\
    \ 针对物联网设备进行了优化。\n- **开发**：Ubuntu 18.04 为开发者提供了许多新工具。\n- **安全**：Ubuntu 18.04 LTS\
    \ 提供了长久的安全支持。\n\n![](img/adbb964c9bace8f3e3949547041f6ef9_58_0.png)\n\n# Ubuntu\
    \ 18.04 的 GNOME\n\nGNOME 在 Ubuntu 18.04 LTS 中首次作为默认桌面环境出现。与 17.10 相比，GNOME 桌面在\
    \ 18.04 中更加稳定。\n\n- **默认桌面环境**：Ubuntu 18.04 默认使用 GNOME 3.28。\n- **安装程序**：使用了全新的安装程序，简化了安装体验。\n\
    - **软件中心**：包含了全新的 软件中心。\n- **快速设置**：改进了快速设置功能。\n- **主题定制**：支持了更多的主题。\n\n## 在 Ubuntu\
    \ 18.04 中使用 GNOME\n\nUbuntu 18.04 引入的 GNOME 带来了许多新功能。\n\n- **工作区**：GNOME 的工作区更加流畅。\n\
    - **扩展**：可以安装更多的 GNOME 扩展。\n- **搜索**：内置搜索功能更加强大。\n- **快捷键**：提供了更多自定义快捷键。\n\n"
