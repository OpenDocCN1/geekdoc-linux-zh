    # Script with Vagrant


    Automate the creation and management of virtual machines across servers


    Vagrant is a mature product sponsored by a company called HashiCorp. Its main
    purpose is to provide a common command-line interface and provisioning architecture
    across different virtualization technologies. This means you can use the same
    commands with VirtualBox as with VMware Workstation and Vagrant, simplifying the
    use ofvagrant which provides a wrapper for the command line interface of various
    providers and environments.


    This also means you can create a single script to provision your infrastructure,
    and run it out of space – or use it as you like. For the same Vagfile can be used
    to create a different product or cloud service.


    Developers will find it particularly useful because they can create a common development
    environment with all


