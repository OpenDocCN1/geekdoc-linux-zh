  - '[PAGE 42]


    or not coffee should be served to a user. The aim of the rest of this tutorial
    is to establish whether or not a user is a member of the club, if they have enough
    money associated with their ID, and then, if the user orders a coffee, to subtract
    a preset amount of money after the pod has dispensed. Initially one might consider
    using a database to manage users and their accounts, and languages such as Python
    - which we''ve seen in previous tutorials, can also be used to communicate with
    Arduino - there are many ways of doing this. Python can even be integrated with
    a MySQL database, which enables us to create a database where users can manage
    their account. If this is something that interests you, we will go for it, but
    it''s a bit outside the scope of this tutorial.


    Connect a Raspberry Pi to the Arduino via USB: an adapter is required to convert
    to Micro-USB. The Pi Zero W will then be able to connect to the USB through and
    power the Arduino. We chose the Pi Zero W as it is low-cost and built-in with
    Wi-Fi, thus enabling us to log remotely.


    ![](img/adbb964c9bace8f3e3949547041f6ef9_42_0.png)


    # Check acknow users


    We can now begin creating our pseudo-database of club members and adding our accounts.
    This might not be the most effective way of managing the club, but all we need
    to do is to create a dedicated folder where we store our accounts. Each time an
    RFID card is swapped against the reader,


    > When the Pi boots up, it can form a dictionary from a folder of UIDs


    When a user swipes their card in front of the reader, the Pi will then hash the
    UID as a string and check the dictionary to see if that exists. If the ID doesn''t
    exist, the script will create a new entry using the hashed ID as the filename,
    which the user can then manually enter their name. We form the dictionary from
    this folder of hashed UIDs, mapping the UID to the contents of the file - the
    name of the card. If it is already present in the dictionary, the script can map
    it to a username, an open account file - and then find out how much money they
    have on their account, the Pi can then allow the Arduino to dispense coffee.


    Above: Connecting to the Pi may require a USB adapter, depending on the model


    Pi can note the details by creating a new file with the UID of the card as a filename,
    and then a default amount of money. Zero to send the message over serial, you
    can use a Python script and initialise the connection with the Arduino by the
    following script:


    ```

    arduino = serial.Serial(port)

    ```


    and you can read incoming messages and store them as strings,


    For more security, using the UIDs as filenames might seem like a bad idea - at
    the very least, we should be hashing them. It''s also good to be able to manually
    top-up an account without having a card reader and Arduino sitting next to the
    machine''s computer to work out who owns which account. Instead, we can exploit
    Python''s dictionaries to link human-readable filenames with matching hashed UIDs.


    # Await input, give feedback


    Once the Pi has detected the user and how much money is in their account, the
    Arduino needs to be informed, so that it knows it is okay to dispense a coffee.
    If you want to go bit further and let the user know how much money is in account,
    the Pi can send the balance back to the Arduino, which can then display the amount
    of money the user has left on the LCD.


    All that is left to do is wait for a button press - we have done count times before
    - the user can press and agree to the sale of the coffee. There''s no need to
    add an interrupt to do this; most of the process (between both machines) will
    involve waiting for a message to be sent.


    The Arduino sends the UID, the Pi sends the balance, and the Arduino handles the
    coffee selection and so. There is still some work to be done handling errors,
    and perhaps implementing a time-out, but you will be in a good position to design
    the physical phase machine and considering the mechanics of dispensing pools of
    coffee. We''ll get onto those topics, and a few more, in the next issue.


