    \ as well. To start, notice that the function runs when Rust is started, as is\
    \ in C, and that syntax is broadly the same. Some differences include the keyword\
    \ fn to define a function (which is not part of C) and the exclamation mark !\
    \ after println. This exclamation in fact means that println is not a normal function\
    \ but a macro, so you'll need to worry about that for. Go into the command window,\
    \ and type the following to compile your program.\n\n```\n$ rust hello\n```\n\n\
    This creates an executable, which you can run in the normal way.\n\n```\n$ hello\n\
    Hello, world!\n```\n\n# Package management with Cargo\n\nAlmost Rust projects\
    \ use the built-in package management system called Cargo. If you installed Rust\
    \ using the installation, it will already be installed. If you installed Rust\
    \ from your package manager, there is a chance that you will need to install Cargo\
    \ separately. Check if Cargo is installed by running the following command.\n\n\
    ```\n$ cargo --version\n```\n\nCargo is incredibly useful for keeping dependencies\
    \ in check. In order to turn your project into a Cargo project, you'll need to\
    \ go a few extra steps. First, let's go to a directory, using cd. Then use the\
    \ following command to create a new directory that will hold your Cargo project.\n\
    \n```\n$ cargo new hello_cargo --bin\nCreated binary (application) 'hello_cargo'\
    \ project\ncd hello_cargo\n```\n\nLook at the contents of this directory with\
    \ ls and you'll see that it contains a file Cargo.toml and the src contains a\
    \ file, main.rs, which is exactly the same as the rs we created earlier. In the\
    \ hello_cargo directory use the command cargo run. We're not using the capabilities\
    \ of Cargo yet, but it's a great idea to get into the habit of using it to take\
    \ advantage of it later.\n\n# Variables and typing\n\nStrong typing is central\
    \ to the safety features provided by Rust. In C, it is perfectly legal to write\
    \ code like this:\n\n```\nlet x = 'A' * 'B';\nprintln!(\"{{}\", x);\n```\n\nMultiplying\
    \ and dividing characters makes no sense, and rather putting them into integers\
    \ values. Weak typing is sometimes useful, but it tends to hide bugs in the code.\
    \ If we are multiplying character values together, it's very likely that we are\
    \ making a mistake. If the compiler allows us to do this without complaining,\
    \ we will be unaware of the mistake until much later on, when fixing the bug is\
    \ more difficult to track down. Rust is considered 'safe' precisely it stops you\
    \ doing things that don't make sense.\n\n> If we have code in which we are multiplying\
    \ characters together, it's very likely that we are making a mistake\n\nFor example,\
    \ let's find the file main.rs inside the src directory and follow the lines of\
