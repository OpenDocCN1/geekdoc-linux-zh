    # INTERVIEW CANONICAL

    Ubuntu 18.04: Sandboxes, surveys and GNOME shell


    As Canonical continues its pursuit of profitability, we spoke to the Desktop and
    Server teams at the company to discuss their ambitions for the release of 18.04
    – and their plans for the future.


    The release of Bionic Beaver is important. Not only is it LTS – with five years
    worth of support for Ubuntu for the first time with GNOME firmly nestled in the
    desktop environment slot, but it is the release that Canonical sees through IPO.
    We spoke to the team in early April about the overall goals for Ubuntu 18.04 LTS.


    WILL COME: Specifically, we find that most of our users like to install once,
    and then leave it, and know that it''ll be locked after itself. That''s more important
    in the cloud environment than it is on the desktop. Perhaps the joy of Ubuntu
    is that you can do all of (your) development on your machine, and then deploy
    to the cloud, running the same version of Ubuntu, and be safe in the knowledge
    that the packages that are installed are exactly the same as are in your enterprise
    installation.


    When you''ve got thousands of machines deployed in the cloud, the last thing you
    want to do is maintaining something every single year and upgrading, and dealing
    with all that overhead. So our strategy for Ubuntu 18.04 is this: develop locally
    and deploy to your servers – the public cloud, whatever you want to do – servers.
    We also edge devices, as such.


    We''ve made a lot of advances in Ubuntu Core since PBB68, which is a really small,
    cut-down version of Ubuntu, which ships with just the minimum that you need to
    provide a device or service. If you want to deploy to your servers, to your desktop,
    or to edge devices, to the IoT devices, and to network switches, Snap gives you
    a reliable way where all the software you''re working on can be packaged, pushed
    out to those other devices, and it will continue to work the same way that it
    works on your desktop.


    A key player in our strategy is the snap package that we''ve been working on.
    These are self-contained binaries that work not on Ubuntu, but also on Fedora
    or CentOS or Arch.


    As an application developer, a desktop application isn''t necessary, but it could
    be a snap. It would be possible to bundle up all the dependencies into a self-contained
    package, and then push that out to your devices. And you want it to work, whatever
    they are, not just on Ubuntu. That''s why we want snap developers: to do your
    work on Ubuntu; package it, and push it out to whatever device that is running
    Linux, and you can be reliant on continuing to do that work for years.


    What''s the common problem that devs have with DEBs and RPMs that have to link
    to the snaps format?


    **Will Cooke**

    Will is the desktop director at Canonical, who oversees the desktop Ubuntu ISO
    together.


    **David Britton**

    David is the engineering manager of Ubuntu Server at Canonical.


