    # 发行版升级


    ## Pop!OS：为用户追求高效且创意的环境


    自从宣布名为 Pop!OS 的自己的 Linux 发行版以来，System76 一直稳健地向 18.04 版本发布。


    在 Pop!OS 之前，我们的重点是确保电脑硬件在 Linux 下保持完美无缺。当 Unity 的不确定性很快变成一个机会时，在过去的 12 多年里，我们必须处理团队的需求；当我们开始向最重要的客户介绍我们以及桌面体验时，在此期间，我们收集了数据：一份改进桌面界面的客户请求列表。


    ### 新安装程序体验

    新的安装程序的设计理念是通过安装过程展示艺术作品的故事，并安装操作系统。该安装程序使我们能够提供带有全盘加密的计算机；简化安装过程；快速安装；并部署了将个性化你的操作系统的艺术作品，正如新的
    Pop!OS 艺术设计所示。


    > Carl Michel

    > Carl 是 System76 的创始人兼首席执行官，一家 Linux 电脑制造商。


    ### USB 刻录

    Popsicle 是一项新工具，当你在文件管理器中双击 ISO 文件时它会启动。它是一个 USB 启动创建器，可以同时刻录一个或数百个 USB 驱动器。


    工程与 DevOps - 这是我们的客户使用它的地方。对我们来说，确保创建一个最高生产率的环境以保持高效和创意至关重要。在第一个 Pop!OS 发布后，我们解决了与
    Linux 客户面临的主要痛点：桌面设置更易用、软件更多、且体验极快。


    > 我们最感激的事情之一是拥有如此活跃的 Pop!OS 社区提供反馈。


    此外，Pop!OS 为非技术人员提供无缝体验也至关重要。这意味着 Pop!OS 比我们习惯的体验更快、更稳定。如果 Pop!OS 能够在机器窗口中平稳运行，我们在无障碍访问方面就赢了，使我们能够创建一个具有强大界面的项目。


    其他新功能还包括带有固定设置的“请打扰”开关、针对缺失显示或遗留应用程序的 HID API 和标准 DPI 缩放（在 Pop!OS 中使用新艺术设计构建的界面），以及内核和
    systemd-kernelstub 取代了新安装中的 GRUB。


    这是我们的第二次发布版本 18.04，我们在此取得了取得了巨大的进展。有什么不同之处？

    18.04 是保持与 Pop!OS 社区包容与协作的结果。拥有新 Linux 界面上的安装程序，当然，还有我们在开发项目期间发生的大量工作。需要大量的测试以确保
    Pop!OS 准备就绪。


    ### 增强的安全性

    Pop!OS 默认确保你的安装安全。我们的新安装程序为来自 System76 或其他操作系统的预安装启用全盘加密。System76 允许你接收提供自动固件更新的功能，确保
    PC 始终安全可靠。


    ### 性能管理

    18.04 包含改进的电池电量指示，使用户可以掌握剩余电量。我们还添加了 CPU 和 GPU 切换开关，从系统中切换电源方案，例如 NVIDIA Optimus、节能模式、高性能模式等。


    我们最感激的事情之一是拥有一个活跃的 Pop!OS 社区，他们在提供反馈方面充满活力。我们希望继续改进该操作系统，作为一个帮助增强我们工作流的工具，并始终感到倍受欢迎。请在
    https://system76.com/pop 尝试 Pop，并在 www.reddit.com/r/pop_os 告诉我们你的需求。


    # 你的 Linux 新闻与观点来源


    ## 评论


    ## 你的来信


    关于杂志、Linux 和开源的问题与意见


    ### Qubes 技巧


    亲爱的 L&D，我很喜欢 LUBD189（特性页，第 60 页）中的 Qubes OS 教程，我想和你们分享三个让新手望而却步的小故障。首先，安装程序似乎提议你覆盖之前的操作系统（在我的情况下是
    Windows 10），转而将安装挤入某些空空间中。这意味着我必须创建一个活动 USB (Mint) 仅为了使用它的磁盘程序来删除分区。其他读者可能会从这条建议中获益。


    在越过那个障碍后，我感到一些新手对安装过程感到困扰，显然它在计算字节数，然后在安装模板等文件时看起来“仍然”处于卡住状态。解决方法是不要紧盯着看，只要你让它运行二十分或三十分钟，文件数量就会再次增加。


    重启后，我必须选择模板选项，这些模板需要一段时间时间来安装，进度条在过程中会移动。在使用 Qubes 并决定使用它之后，我注意到新版本即将到来。我想重新安装一次
    Qubes 4.0 并下载了它。


    这个版本在安装阶段有类似的不均匀进度条，在重启后第二个进度条呈现出左右移动的动作。让电脑离开一小时左右，它恢复得比那个略微不均匀的安装要可靠得多。


    再次强调，不要恐慌！不要因为过程看起来“挂起”了就假设如此。在再次放弃之前去喝杯咖啡或吃顿饭吧！


    总之，感谢教程，我希望我的评论能鼓励其他人去追求结果良好的设置，并让他们放心，一旦默认配置比略微不均匀的安装要可靠得多。


    River AT


    Chris：非常好的建议，我从未遇到过你提到的无法安装 Windows 操作系统的问题。在 Qubes 3.2.3 安装摘要中，使用 System 选项可以使用自定义选择。在下一个屏幕上，我能够配置现有分区并使用分区
    GUI 创建 Qubes OS 所需的分区（就像在 GParted 中做的那样）。然而，这可能是。我们最感激的事情之一是拥有一个活跃的 Pop!OS 社区，他们在提供反馈方面充满活力。我们希望继续改进该操作系统，作为一个帮助增强我们工作流的工具，并始终感到倍受欢迎。请在
    https://system76.com/pop 尝试 Pop，并在 www.reddit.com/r/pop_os 告诉我们你的需求。


