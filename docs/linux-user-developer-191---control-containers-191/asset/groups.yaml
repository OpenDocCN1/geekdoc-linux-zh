- md: "\n## Special Report: Ruby\n\n# RUBY IS ALIVE & WELL\n\n# The creator of Ruby,\
    \ declares \"We will do everything to survive\" in his first keynote speech in\
    \ five years.\n\nChris Thornett reports from the Bath event\n\nThe annual Bath\
    \ Ruby conference is the biggest Ruby event in the UK and takes over two days,\
    \ with a mix of technical speakers and plusworks (not to mention karaoke) https://bathruby.com/\n\
    \n> How is software born? It is an unusual question from the genial Japanese creator\
    \ Yukihiro Matsumoto. His first keynote drew over 500 Ruby developers at the two-day\
    \ Bath Ruby Conference. Ruby celebrated its 25th anniversary in February 2020\
    \ – hence the big celebration in December 1995, so in order to answer his own\
    \ question, Matz suggests that software is born when it is the kind of poetic\
    \ answer you expect from it. Ruby was 'born', at least for Matz, two years earlier\
    \ on his birthday (Yukihiro Matsumoto was born in Tokyo on 21 December 1963) than\
    \ the language's origins. Matz wanted to mention it after seeing a jewel: 'Ruby\
    \ was beautiful and more expensive, so I named my language Ruby,' he said of himself.\n\
    \nIts syntax, for instance, is very readable expressive in a tense way, and as\
    \ a dynamic, reflective object-oriented, general-purpose programming language\
    \ it is intuitive and easy to learn. Ruby tries to do as much as possible, Matz\
    \ quoted, 'Ruby is designed to make programmers happy.'\n\nBut not everyone is\
    \ happy. The popularity of the framework has drifted down. The dominance of Ruby\
    \ on Rails (RoR) web application framework, among startups who started to deal\
    \ with much of the heavy lifting, that people once did with Ruby in the RedMonk\
    \ languages in 2012, and rank in the top 10 in others.\n\nHowever, Matz isn't\
    \ the only one for the first time in years just at a birthday cake. Ruby has reached\
    \ maturity but there are still questions whether it can survive another 25 years.\
    \ Like its creator, the Ruby language is lively and garnishes.\n\nRuby has drifted\
    \ down to eighth. Ruby, although popular, it's not the superstar anymore and has\
    \ faced competition issues such as becoming a greater concern for older web. Although\
    \ not dead at all, and with its limitations, the JavaScript runtime environment\
    \ Node.js, for example, has become popular for front-end and back-end by front-end\
    \ JavaScript users, and its single-threaded approach handling multiple connections,\
    \ other things (although that does make it less suitable for CPU-intensive tasks\
    \ such as image processing).\n\nIt's clear that we are aware that the adoption\
    \ of any programming language is stimulated by the projects and frameworks that\
    \ grow from a community's language and ecosystem—and Ruby is an example of that.\
    \ While he was well known to express in his keynote to regret for past mistakes\
    \ he made in the language, he also wisely devised a path to address the performance\
    \ and scaling issues.\n\nMatz focused on two key trends: scalability, and what\
    \ he calls the 'better companion'. To combat scalability and create greater creativity,\
    \ Matz believes that 'faster execution, less code, more team [and] for the code\
    \ matters more than features.' He told us, 'But it's not faster execution because\
    \ we need to process more and more traffic. We're reaching the limit of the cores.\
    \ That Ruby 3.0 has a goal of being three times faster than Ruby 2.0—or, as he\
    \ puts it, 'Ruby3x'.\n\n> More code is maintenance, debugging, time, less productivity\n\
    \n![](img/adbb964c9bace8f3e3949547041f6ef9_32_0.png)\n\nAbove: Cookbook's CTO\
    \ Mike Woodroof \"You stumble upon tiny improvements to the language in every\
    \ release, it's a really fun language to work with\"\n\nCookpad (https://cookbook.co/uk),\
    \ the main sponsor of the Bath conference, is a classic example of a team that\
    \ relies heavily on Ruby and Rails. It's a recipe-sharing site and Mike Woodroof\
    \ says the site has over 60 million users in Japan, its expanding globally, having\
    \ moved international HQ to London. Built with Ruby, 'Our infrastructure is built\
    \ by Ruby scripting—\"Ruby makes everything pretty meaty.'\n\nAs well as Ruby\
    \ engineers operate over the world, Cookbook team members rely full-time. One\
    \ of them is Matz, creator of MRI—the official interpreter for Ruby since 1.9.\
    \ Since he is now working on concurrency (Project Guild), it's another facet of\
    \ which we expect to see performance gains. Ruby 3, however, the game is that\
    \ 'It's a huge shift for Ruby is built and interpreted,' says Woodroof. 'Ruby\
    \ has these features for performance...'\n\n\"This is easy to say,\" Matz acknowledges,\
    \ noting in the days of 1.8, Ruby was 'too slow' and a mistake. Koichi Sasaki's\
    \ work on WARP (yet another Ruby method) improved performance for 1.9, and 'since\
    \ then,' Matz says, 'we have been working hard to improve the performance of the\
    \ virtual machine, it's not enough.'\n\n## Time for JIT\n\nTo improve performance\
    \ Ruby is introducing JIT (Just-In-Time) technology, a method already used by\
    \ Java and other languages. 'We say it's a complex project to do this, but we're\
    \ aiming to release it this year, Ruby 2.6 will be first,' says Matz confirms.\
    \ 'You can see the initial implementation of the JIT compiler in the 2.6 preview\
    \ (http://github.com/ruby/ruby-2.6-preview). With Ruby 2.6, \"which is not,\"\
    \ Matz says, 'it's not easy for at least CPU-intensive.'\n\nProbably the initial\
    \ implementation of the JIT compiler in the 2.6 preview (http://github.com/ruby/ruby-2.6-preview).\
    \ With Ruby 2.6, \"which is not,\" Matz says, 'it's not easy for at least CPU-intensive.'\n\
