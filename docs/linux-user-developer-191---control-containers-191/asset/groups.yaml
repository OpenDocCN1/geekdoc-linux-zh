    Save up to 20% on this year's sub!\n\nFUTURE PLC\nConnectors\nCreators\nColnMakers\n\
    \nChief executive Ethan Smyth-Type\nChief financial officer Leslie-Leiden\ntel\
    \ +44 01502 4224\n\nwww.linuxuser.co.uk\n\n3\n\n# Contents\n\n# Features\n\n#\
    \ Tutorials\n\n- 06 News\n- 10 Letters\n- 12 Interview\n- 16 Control\n- 18 Ubuntu\n\
    - 20 Features\n- 24 Special Report\n- 32 Ruby\n- 36 Git\n- 40 Arduino\n- 44 Security\n\
    - 48 Python\n- 52 Programming\n- 58 Ubuntu\n\n# LinuxUser & Developer\n\nIssue\
    \ 191\nMay 2018\nfacebook.com/LinuxUserUK\nTwitter: @linuxuser\n\n# Special Report\n\
    \nUbuntu 18.04 bionic Beaver brings changes across all flavours, from Desktop\
    \ to Cloud, Containers, IOT, Server. 18.04 represents the long term support.\n\
    \n- 06 News\n- 10 Letters\n- 12 Interview\n- 16 Control\n- 18 Ubuntu\n- 20 Features\n\
    - 24 Special Report\n- 32 Ruby\n- 36 Git\n- 40 Arduino\n- 44 Security\n- 48 Python\n\
    - 52 Programming\n- 58 Ubuntu\n\n# Practical Pi\n\n- 72 Pi Project: PipeCamp\n\
    Electronics technician Fred Frie wanted to build an affordable underwater camera\
    \ using inexpensive components. His ingenious solution, PipeCamp, involved a Raspberry\
    \ Pi – and plenty of waterproof sealant\n\n# Reviews\n\n- 81 Group test: Security\
    \ distros\nWe put four specialised builds to promise enhanced security to the\
    \ test to see which keeps you safest\n\n- 96 Happy Forever Day\nAnother intriguing\
    \ short story from sci-fi author\n\n- 86 Reviews: Hardware\nHow does the TerraMaster\
    \ F4-420 NAS and the Trendnet TEW-817DR router perform?\n\n--You might not know\
    \ it, but the new Pi 3 can easily boot from a connected drive rather than an SD\
    \ card. Find out how to set it up\n\n- 88 Distros: MX Linux 17\nA joint effort\
    \ between the antik and MEPIS communities which touch a clean and slick desktop\
    \ experience\n\n- 90 DIY voice assistant\nCreate your own Alexa/Google Home/ Siri/Cortana\
    \ alternative using Mycroft running on a Pi – and ensure all data stays within\
    \ your control!\n\n- 90 Fresh FOSS\nSearchmonkey JAVA 3.2.0, beats 1.4 CLI library\
    \ media, Garbas 3.11.0 for creating graphics apps, and SimpleRecorder0.3.10\n\n\
    SUBSCRIBE TODAY Save up to 20 per cent when you subscribe! Turn to page 30 for\
    \ more information\n\nwww.linuxuser.com | 5\n"
  mdcn: "\n\n# 独家专访\n\nLinuxUser\nwww.linuxuser.co.uk\n\n面向 GNU 世代的\n必备杂志\n\n# 与开发者\n\
    \n你的终极指南\n\n# 容器控制\n\n提升你的 Docker 技能 • 精通 Vagrant 脚本 • 完善 Ansible & Puppet 配置\n\
    \n新版 Ubuntu 发布！\n\n特别报告\n\n# Ruby 并未死亡\n\n> “我们将尽一切努力生存 ”\n\n- 创始人，松本裕弘 (Yukihiro\
    \ \"Matz\")\n\n# 18.04 特性\n\n云端、容器、核心\n桌面、物联网、服务器\n\n# Pi 3 B+\n\n 值得尝试的项目\n\n\
    - 超大容量 Pi 存储\n- 使用 Mycroft Core 制作一个 AI 助手\n\n# + 专家教程\n\n- Git：精通版本控制\n- Arduino：DIY\
    \ 咖啡机\n- 安全性：阻止 root 攻击\n\n# MX Linux 17.1\n\n这款你可能从未听说过的\n精彩发行版\n\n# 安全发行版\n\n\
    测试报告：Linux 宇宙中最优秀的四种安全发行版\n\n内页同样精彩\n- 内核深度\n- TerraMaster 的新 Ubuntu 测试\n\n# 为你的忙碌生活按下暂停键\n\
    \n面对工作、家庭和生活的重重需求，一天的时间似乎永远不够用。为什么不要偶尔按下暂停，蜷缩在最喜欢的杂志旁，在你的一天中营造出一片属于“你自己”的小绿洲呢？\n\
    \n按下暂停\n享受杂志时光\n\n了解更多关于“按下暂停”的信息，请访问：\npauseyourday.co.uk\n\n# LinuxUser & Developer\n\
    \n面向 GNU 世代的杂志\n\nFuture PLC Quincy House, The Arch, Bath BA1 1UA\n\n### 编辑部\n\
    Chris Thornnett\nchris.thornnett@future.com\n01502 4224\n设计师 Ian Webber\n制作编辑\
    \ Ed Richards\n总编辑 Tom Graham Barrow\n高级编辑 Jo Collier\n\n### 贡献者\nDan Anthony,\
    \ Joey Beard, Christian Canley, John Owens,\nToni Castillo, Gloria Jones, Moss\
