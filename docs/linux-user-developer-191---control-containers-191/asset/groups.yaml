    # Canonical 访谈

    Ubuntu 18.04：沙箱、调查与 GNOME shell


    随着 Canonical 继续追求盈利，我们访谈了该公司的桌面和服务器团队，讨论了他们对 18.04 版本的野心以及未来的计划。


    Bionic Beaver 的发布非常重要。它不仅是一个 LTS（长期支持）版本——首次为 Ubuntu 提供五年的支持，且 GNOME 稳固地占据了桌面环境的位置——它还是
    Canonical 在其 IPO 期间发布的版本。我们在 4 月初与团队讨论了 Ubuntu 18.04 LTS 的总体目标。


    即将到来：具体来说，我们发现大多数用户喜欢安装一次后就置之不理，并知道它之后会保持锁定状态。这在云环境中比在桌面端更为重要。也许 Ubuntu 的乐趣在于，你可以在自己的机器上完成所有（你的）开发，然后部署到云端，运行相同版本的
    Ubuntu，并放心地知道安装的软件包与你的企业级安装完全相同。


    当你云端部署了成千上万台机器时，最不想的就是每年进行维护、升级，并处理所有这些开销。因此，我们对 Ubuntu 18.04 的策略是：在本地开发并部署到你的服务器——公共云，或者任何你想做的地方——服务器。我们的边缘设备也是如此。


    自 PBB68 以来，我们在 Ubuntu Core 上取得了许多进展，PBB68 是一个非常小且精简的 Ubuntu 版本，仅带有提供设备或服务所需的最小内容。如果你想部署到服务器、桌面、边缘设备、IoT
    设备以及网络交换机，Snap 为你提供了一种可靠的方法，让你正在开发的所有软件都可以打包并推送到那些其他设备，并且它的运行方式将与在桌面上的运行一致。


    我们策略中的一个关键角色是我们一直在开发的 snap 包。这些是自包含的二进制文件，它们不仅可以在 Ubuntu 上运行，也可以在 Fedora、CentOS
    或 Arch 上运行。


    作为应用程序开发者，桌面应用并不是必须的，但它可以是一个 snap。你可以将所有依赖项封装到一个自包含的包中，然后将其推送到你的设备上。你希望它能够运行，无论它们是什么设备，而不仅仅是在
    Ubuntu 上。这就是为什么我们想要 snap 开发者：在 Ubuntu 上进行你的工作；将其打包，并将其推送到任何运行 Linux 的设备上，你可以依靠这项工作持续进行多年。


    开发者在将 DEBs 和 RPMs 链接到 snaps 格式时面临的共同问题是什么？


    **Will Cooke**

    Will 是 Canonical 的桌面总监，负责整个桌面 Ubuntu ISO。


    **David Britton**

    David 是 Canonical Ubuntu 服务器的工程经理。


    > 右上角：你可以通过 `snap install community` 早期安装 snap 来加入 Communityeth，或者针对 18.10 版本。只需注销并从……选择它。


    WC：有几个。打包 DEBs——或者说 RPMs——有点像是一门黑艺术。有一个……


    # 快速指南

    18.04 之后：GNOME Shell 4


    显示服务器协议 Wayland 尚未稳定到可以作为 Ubuntu 18.04 LTS 的默认设置，但它绝对会到来，并将从正在开发的技术中受益。除了 PipeWire（用于改进
    Linux 下的视频和音频），还有 GNOME Shell 4 的架构。然而，它们还没有准备好，正如某些人所说，“GNOME Shell 4 是一个奇怪的话题，GNOME
    告诉他们将推出 GNOME 4——你知道的，所有库的新版本之类的。但他们并没有真正承诺要开发一个新的 shell 或改变它的工作方式。”


    GNOME 4 的原因之一是为了显著改变用户面对显示服务器崩溃时的体验。例如，如果你在编辑 LibreOffice 文档时显示服务器崩溃了，它可能不会自动保存，你将丢失所有内容：“目前，GNOME
    堆栈中的合成器在 Wayland 中崩溃时，它会崩溃 Wayland 并退出你的会话。你会被退回到登录界面，你运行的所有应用程序都会让你回到只切换了机器的初始位置。”


    GNOME 4 的考虑因素之一是让崩溃在未来表现得像 X.Org 一样：“应用程序将在后台继续运行，你甚至可能察觉不到问题。”


    > 上方：你可以通过 `snap install community` 早期安装 snap 来加入 Communityeth，或者针对 18.10 版本。只需注销并从……选择它。


    再次，事实是，带有依赖项的构建更加简单。理解如何将某内容打包为 DEB 或 RPM 的门槛很高，因此 snaps 简化了这很多工作。如果你打包你的应用程序并说，“好的，我依赖这个版本的库，”那么当你的底层操作系统发生变化时，你的包就会损坏。你无法担心它是哪个版本，或者底层运行的是哪个版本的
    OS。通过在 snap 中构建这一切，你确保了所有的依赖项都与你的应用程序一起共享。得到结果更容易，并且能够正常运行，物理上能够从磁盘读取文件。


    > 你可以在自己的机器上完成所有开发，然后将其部署到云端


    在我看来，另一个关键点是安全性。对于 X.Org，安全性是一个很长久的问题。现在它是为了安全而设计的。如果某个东西以 root 用户身份运行，它就拥有所有权限。如果你安装一个应用程序，例如，你可以进入主目录，创建一个副本并将其放在其他地方。它将以用户的权限运行。而
    snaps 的一个问题是，你可以说，“这个应用程序被允许访问这些内容。”


    最后，它将是你想要使用的应用程序。我们正在为那些想要使用它的人服务。例如，如果是某种方式——我们只是让人们更容易获取它。从用户友好性的角度来看，与任何事情都一样，考虑到你需要的工具，有许多
    IDE。如果你停止使用 Linux，你可以像桌面那样，显示你需要做多少工作，然后让我们解决这些情况并让它更美观。


    好奇 Ubuntu 社区 (Comm) 的进展如何？


    它进展顺利。是的 它对于 18.04 来说还不够。但有一些需要修复的 bug，针对 GTK+ 2。


    www.linuxuser.com | 13


    # 开源 Linux 动态


    从质量上来说，Wayland 将比 X.Org 好得多。如果我们打算在 18.04 使用 Wayland 并支持它五年，我们必须确保它符合我们的需求，但这种情况允许我们切换到
