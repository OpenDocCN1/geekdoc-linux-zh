    # QUICK GUIDE

    Beyond 18.04: GNOME Shell 4


    Wayland, the display server protocol, wasn''t stable enough to be the default
    for Ubuntu 18.04 LTS but is definitely coming and will benefit from technologies
    that have been working on. As well as PipeWire (for improving video and audio
    under Linux), the architecture of GNOME Shell 4. However, they aren''t ready,
    as some will say, "GNOME Shell 4 is a strange topic, GNOME tell me they have it
    going to be GNOME 4 - you know, a new version of all the library and that kind
    of thing. But they haven''t actually committed to doing a new shell or changing
    the way that it works."


    One reason for GNOME 4 is to significantly change the experience that users face
    a display server crash. For example, if the display server crashes while you''re
    working on a LibreOffice document, there''s a chance it may not be auto-saved,
    and you''ll lose all of that: "At the moment, the compositor in the GNOME stack
    crashes in Wayland, it crashes Wayland and it exits your session. You''re thrown
    back to the login screen, and all of the applications you''re running will leave
    you back in the position of just switching your machine."


    One of the considerations for GNOME 4 is to make a crash play out like X.Org in
    the future: "the applications will continue running in the background and you
    might not even notice was a problem."


    > Above: You can join Communityeth with an early snap install it with snap install
    community or for 18.10. Just log out and select it from the


    Again, the fact is, it is easier to build with dependencies. Understanding how
    to package something as a DEB or RPM - the barrier to entry is high, so snaps
    simplifies a lot of that. If you package your application and you say, "Okay,
    I depend on this version of the library," and when your underlying OS changes
    then your packages break. And you can''t worry what version it is to be, or what
    version of OS is going to run under. By building all of that in snap you ensure
    that all of your dependencies are shared along with your application. It is much
    easier to get the end of it, and will run properly, physically be able to read
    files off the disk.


    > You can do all of development on your machine, and then deploy it to the cloud


    The other key, in my mind, is security. For X.Org, security has been a long time.
    Now it has been really designed with secure in mind. If something is running as
    root user, then it has all the permissions of the user''s running. If you can
    install an application where you, for example, you could go into your home directory,
    make a copy of it, and email it somewhere else. It will do with the same permissions
    as the user''s running. And that, a real concern with snaps and you can say, "This
    application is not allowed to access those things."


    At the end of the day, it''s going to be which application you want to use. We''re
    serving people who want to use it. For example, if there was way - we''re just
    making it like it''s easier for people to get hands on it. From a point of view
    user-friendliness is as much as anything, given that all of the tools that you
