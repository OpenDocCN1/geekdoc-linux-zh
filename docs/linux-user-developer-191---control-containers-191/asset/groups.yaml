    ![](img/adbb964c9bace8f3e3949547041f6ef9_40_0.png)


    ## 向读卡器焊接引脚


    低成本 RFID 套件以空白 RFID 卡片、钥匙扣、读卡器模块（以及希望有一排排针）以及处理电源和信息传输的电路和芯片的形式交付给您。在教程中，我们正在使用
    MFRC522 模块。卡片底部线性排列着一小组八个孔。你需要连接到读卡器才能开始使用它。在之前的教程中，我们避免了焊接；但在情况下，你必须拥有电烙铁和一些焊锡以便将引脚连接到读卡器。


    首先通过让连接器引脚穿过读卡器的孔来焊接读卡器——你希望长端进入 Arduino，短端穿过读卡器。将电烙铁按在带有引脚的金属而不是孔上，让焊锡流进引脚和孔之间的间隙。它应该熔化并在引脚周围形成一个圆角。一旦连接形成，你就可以处理其余引脚了。对于不熟悉焊接的人来说，最好使用无铅焊丝，这样你的手就不必吸入任何无铅焊锡烟雾——如果你有一点通松剂，把它远离你的脸吹开。


    上述读卡器套件可以在网上廉价购买，并能与各种卡片配合。


    对于本教程，我们正在使用 Arduino Mega，它在引脚 50 到 53 上有 SPI 接口。在 Uno 上，引脚是 10 到 13。在 Leonardo
    和 Micro 上，你将必须使用 SPI 引脚，这是几乎所有 Arduino 都要用的方法。对于 Arduino Mega，50 号引脚是 MOSI，51
    号引脚是 MISO，52 号引脚是 SCK，53 号引脚是 RST。这些引脚在 RFID 读卡器上有清晰标记——尽管 SS 会标记为 SDA——并将它们连接到你
    Arduino 上对应的引脚。你还应该连接读卡器上的地和 3.3V，它们连接到 Arduino 引脚上。读卡器上还有一个重位引脚，需要连接到


    ## 已发行超过 100 亿张 RFID 卡和 2.6 亿个读取器


    ## 连接 SPI


    使用一组跳线，将读卡器的引脚连接到读卡器的串行外接口 (SPI)。你将使用 SPI 库在两个微控制器（Arduino 和 读卡器）之间进行通信，或者通过使用软件数字引脚。确保这些引脚连接到读卡器至关重要。它们在不同板之间的位置并不总是相同的——查看
    Arduino（Arduino），它告诉其他（读卡器）它是从设备（SCLK）。选择引脚，然后 MOSI（MOSI，从机输入）、MISO（MISO，从机输出）和
    SCK（串行时钟）来处理定时。当设备被要求作为从设备操作时，它连接到 MOSI 线并使用 MISO 进行响应。如果多个设备必须共享同一通信线，则只有在主设备告诉它们时才监听。


    ## 编写你的 Arduino


    现在 RFID 读卡器已连接，你可以快速开始从某些 RFID 卡片中读取数据，包括 Mifare Classic。此时，你需要下载 MFRC522 库。可以通过
    Arduino IDE 中的 `Sketch (脚本)` > `Include Library (包含库)` > `Manage Libraries (管理库)`
    来完成。

