    ### 03 你定期备份吗？


    如果今天丢失了网站，会对你的业务产生什么影响？始终自行备份至关重要。


    ### 04 尝试在 Google 上排名


    Google 在 2015 年进行了一些更改。如果你很难在 Google 上排名，请确保你的网站是响应式的。此外，Google 喜欢 HTTPS。联系你的主机并在网站上设置并使用
