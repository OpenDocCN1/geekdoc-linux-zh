    - Whonix-Workstation 上的 iptables 规则强制其连接到虚拟局局域网并将所有流量重定向到 Whonix-Gateway


    ## 它如何安全？


    Subgraph 自带有一个经过 PaX 补丁集加固的内核，使得内核和用户态都变得非常出色。该发行版还强制用户加密其文件。此外，Subgraph 在 OS
    安全沙箱之外运行许多应用程序，以限制风险。


    Whonix 基于隔离安全的概念，采用了两个虚拟机的形式。这种设计背后的思想是将环境与互联网接入点隔离开。在此，Whonix 将所有流量通过 Tor 路由。因此，如果其中一台机器被破解，也不会影响另一台。


    ## 匿名性如何？


    该发行版通过通过 Tor 网络路由你的互联网流量来实现匿名化。它还使用了像 TorTorrent 的匿名点对点文件共享工具。此外还有 Subgraph Firewall，它对每个应用程序的出站连接应用过滤器，用于监控应用程序的非预期连接。


    Whonix 使用 Tor 来隐藏你的 IP 地址并绕过审查。该发行版还整合了匿名点对点即时消息以及 Thunderbird 和 TorBird 这种隐私友好客户端组合。Whonix
    默认不包含 Tor，但有一个脚本可以从一组稳定、加固的发布列表中下载。


    ## 作为桌面好用吗？


    Subgraph 包含了一些日常使用的的主流应用程序，例如 Firefox 和 VLC。在 Subgraph 上，这些程序经过沙箱系统的良好准备，以提供额外的隐私保护。该发行版还配置为从自己的仓库和
    Debian 仓库获取包。


    Whonix 包含了 LibreOffice，但是针对 Whonix 的。还有用于管理密钥的 KPG，许多应用程序都针对隐私进行了优化。有很多仓库，你必须选择设置哪一个。它不包含图形包管理器，但你可以使用
    Whonix-script 来搜索应用程序。


    ## 安装与设置


    Subgraph 包含一个 Debian 安装程序，帮助你在安装期间设置 LVM 卷。该发行版一旦连接就会建立与 Tor 网络的连接 - 但默认不包含 Tor
    浏览器，首次运行时会自动下载。


    Whonix 没有图形化安装程序。相反，该项目提供了几种部署方法，其中最方便的是获取适用于 VirtualBox 的虚拟机。在启动时，两个虚拟机都会引导你通过一个简短的设置向导完成某些组件设置，例如仓库。


    ## 总结


    Subgraph 尽全力确保从内核到用户态的一切都是不可利用的。它还整合了一系列以隐私为中心的应用以及桌面应用。


    Whonix 是一个可以在独立虚拟机提供的桌面发行版。它通过使用虚拟化程序将环境与获取互联网的环境隔离来确保安全和隐私。


    ## 简要：对比结论


    | 特性 | Kodachi Linux | Qubes OS | Subgraph OS | Whonix |

