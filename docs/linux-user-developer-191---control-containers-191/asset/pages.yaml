    SECURITY


    # # Facebook investigated, apologises for breach of trust


    Mozilla offers solution: Facebook Container protects browsing activity and data-tracking


    The headline-grabbing Cambridge Analytics scandal hit users of all platforms,
    highlighting once again the importance of openness when it comes to the treatment
    of personal data by online services such as social networks. Keeping in mind that
    270,000 people used the "thisuisdigitall" app, it is staggering that data for
    millions (including friends and family of the app users) was then harvested, and
    used for political-campaign targeting in a process that began in 2014.


    ![](img/adbb964c9bace8f3e3949547041f6ef9_5_0.png)


    Mark Zuckerberg, as doing his best to distance Facebook from scandal, took time
    to issue a full apology in several newspapers. In, the billionaire CEO apologised
    for the 2014 breach of trust "that leaked Facebook data of millions of people"
    and revealed that along with limiting data to third-parties, Facebook is investigating
    every single app that had access to large amounts of data before we found this,
    working on the basis that others may have similar volumes of data.


    Despite the apology, it promises to be better for privacy with new features in
    the mobile app, the fact remains that data was acquired without actually breaching
    security or at least explicit consent. Rather, Nick Nicholson of CBS said, "worked
    Facebook has built the craziest most invasive advertising


    model of the history and some took advantage to recover it."


    Since then it has already been done; Facebook''s brand was already tarnished by
    previous controversies and suspicions. It seems unlikely, however, that the platform
    will be abandoned, giving users the chance to at least partially recover.


    Targeting users with privacy concerns following the Cambridge Analytics scandal
    - Mozilla has a new browser extension to tackle the issue of Facebook tracking.
    Two months - although that development has been recently accelerated for a prompt
    release - Facebook Container offers a solution to that most annoying question:
    "How do I quit Facebook without actually quitting?"


    Mozilla was quick to remind users that tracking is a problem - pages you visit
    online can say a lot about them (where you live, your hobbies and your political
    persuasion), and that Facebook has a network of trackers on many websites. "This
    Mozilla" tracks your activity across your other online activities.


    Mozilla is that the Cambridge Analytics incident could not have been avoided with
    the use of the Facebook Container extension, the tool that at least limits the
    data they share. (and unsurringly given the circumstances), Mozilla collects no
    information from the extension; it records only when the extension has been installed
    or removed.


    ![](img/adbb964c9bace8f3e3949547041f6ef9_5_1.png)


    Above it''s time to take control of Facebook data privacy with Mozilla''s Facebook
    Container'
