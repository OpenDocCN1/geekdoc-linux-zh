    # 02 Download the latest OS


    You''ll need to extract the latest version of the OS to make use, so first open
    your web browser and head to www.raspberry.pi/downloads. Select the current ''Raspberry
    Pi OS'' image, ''Stretch with Desktop''. Check Release Notes to see all the updates
    and changes to the OS this version. Remember that if a file is a zipped file,
    you need to extract the IMG from the Folder. Open it and drag the IMG onto your
    desktop or another folder.


    ![](img/adbb964c9bace8f3e3949547041f6ef9_73_0.png)


    # 03 Write the OS to the SD


    Now, write the image to the SD card. Another way to do this is with Etcher, which
    can be downloaded from https://etcher.io. Insert your SD card into your computer
    and wait for it to load. Open Etcher and click the ''image'' button, select the
    location of the file you just downloaded, click ''select'' to pick the drive that
    corresponds to the SD. Finally, click the ''Flash'' button to write the image
    to the card.


    ![](img/adbb964c9bace8f3e3949547041f6ef9_73_1.png)


    On 14 March 2018 - referred to as Pi Day, the date written in US format is 3.16
    - the Raspberry Pi Model 3 B+ released. Among the upgrades were a new 1.4GHz,
    64-bit, quad-core ARM processor, dual-band 802.11ac wireless and LAN, and Bluetooth
    4.2. Faster than USB 2.0, and there''s also improved thermal management.


    This tutorial explains how to use and boot your Raspberry 3 B+ using USB. Once
    everything is set up, you won''t need to use an SD card - it can be removed and
    used in another Raspberry Pi. The benefits of this are that you can increase the
    overall speed. Using a standard 4GB-8GB of storage provides a benefit as the robustness
    and reliability of the USB storage is far greater than SD card, so this increases
    the longevity of your data.


    Before begin, please note that this setup is still experimental and deat at the
    time. In most cases it doesn''t work with all mass-storage devices; you can learn
    more about why and which compatible devices at www.raspberry.pi/blog/pi-3-booting-usb-mass-storage.


    # 01 How it works


    This setup involves booting the Raspberry Pi from the SD card and editing the
    config.txt file in order to enable the option USB boot mode. This turn changes
    a setting in the One Time Programmable (OTP) memory in the Raspberry Pi - once-in-a-lifetime
    - and enables you to remove the SD card for booting from a USB device. Please
    note that any changes you make that you use a suitable Raspberry Pi – for example,
    one that you will know able to be hooked up by the USB driver rather than one
    you might have on the hod.


    # 04 Write the OS to the USB device


    We now need to write the Raspberry OS to your USB storage device. Connect your
    USB storage device to your computer. Ensure that you have ejected the SD card
    and load Etcher. Once the USB storage is loaded, release the drive. Drag the image
    files into Etcher, as you did in step four. Finally, it''s time to place the SD
    card into your Raspberry Pi and it will be ready for use!


    ![](img/adbb964c9bace8f3e3949547041f6ef9_73_2.png)


