  md: "# Tutorial TensorFlow Image Recognition\n\n![](img/adbb964c9bace8f3e3949547041f6ef9_49_0.png)\n\
    \n# Using TensorFlow Mobile\n\nWhen you have a model trained and are using it\
    \ in some project, you may have to consider how it might seem under-powered hardware\
    \ by using TensorFlow Mobile.\n\nThis script takes all of the images in the directory\
    \ _my_images and retains the model using each. This simple retraining process\
    \ can still take 30 minutes or more. If you want to do a full training of the\
    \ model, it could take a huge number of hours. There are other options available,\
    \ like selecting a different dataset. These might yield better models but not\
    \ as fast. If you are writing a program for a low-power device, such as a phone\
    \ app, you may decide to use this instead.\n\nthen train a new layer, which can\
    \ be quite tedious to carry out - but you can change the process by using a useful\
    \ wrapper known TF-Slim. As you can see, we have only touched the necessary code\
    \ in the most crucial way in the material above. We haven't had to dig deep into\
    \ TF code to get what we require to do any work done, and indeed this is a well-known\
    \ comfort people have with TensorFlow.\n\n> With the TF-Slim boilerplate code\
    \ that needs to be written when working in TensorFlow is wrapped and taken care\
    \ of you\n\nTraining on data may be fine for the majority of people, but there\
    \ may be places where you need control. Fortunately, you can manually manage the\
    \ retraining process. The first step is to load the data for the model: the following\
    \ code lets you do:\n\nTo help you understand why you can use that wrapper layer\
    \ of TF-Slim, to minimize the amount of code that you need to write in order to\
    \ get some useful work done TF-Slim is included in the contrib of the TensorFlow\
    \ package and you can use it with the following code:\n\n```\ngraph = tf.Graph()\n\
    with graph.as_default():\n    with tf.io.GFile('classify_image_graph.pb') as f:\n\
    \        graph_def = tf.GraphDef()\n        graph_def.ParseFromString(f.read())\n\
    tf.import_graph(graph_def, name='')\n```\n\nThis loads the model and creates a\
    \ new graph object. This graph is made up of several layers, all leading to a\
    \ final output.\n\n+   - tensorflow.contrib.slim as slim\n\nThis final layer is\
    \ the final classification and softmax that makes the decision as to what you\
    \ think your image is. At this point, you can process your special images to create\
    \ a new final layer. There are several steps required in order to process the\
    \ images, and-\n\nWith the TF-Slim loaded, a lot of the boilerplate code needs\
    \ to be written when working in TensorFlow is wrapped and taken care of you. In\
    \ TF-Slim, models are defined by a combination of layers, variables, and scope.\
    \ In TensorFlow, each variable requires a specification on which device it should\
    \ be stored and used on. TF-Slim wraps all of it so that it's simplified to use\
    \ a single function. For example, the following code creates a regular variable\
    \ using a series of tensors.\n\n+   - regular_variables_and_model_variables =\
    \ slim.get_variables()\n\n```\nmy_var = slim.variable('my_var', shape=[20, 1],\
    \ initializer=tf.zeros_initializer())\n```\n\nGetting the list of variables in\
    \ the model is also simplified to the following:\n\nBuilding layers for a neural\
    \ network under TF-Slim is also greatly simplified. In TensorFlow code, creating\
    \ a single convolutional layer can take seven lines of code. In TF-Slim, this\
    \ collapses down to just two lines of code.\n\n```\ninput = -\nnet = slim.conv2d(input,\
