  md: '# Floating brain


    Fred first used a PI 3 and then a PI 2 before switching to the Pi-Zero to reduce
    power consumption. A cron job on the PI calls a Python script to check available
    space on the attached USB drives, and it''s all okay, it snaps a picture or records
    video.


    # Waterproof chassis


    The PVC pipe and the end caps protects the electronics from the elements. The
    leak-proof housing has a 10mm Perspex lens that withstands four bars of pressure.


    ![](img/adbb964c9bace8f3e3949547041f6ef9_72_0.png)


    # Fuel


    The system currently has no real power management, which Fred admits is a shortcoming
    that he hopes to remedy using an Arduino Nano. For the current configuration allows
    for a second power bank.


    # Components list


    +   - Raspberry Pi Zero

    - Raspberry Pi Camera Module v2

    - USB Hub phat

    - SanDisk Cruiser USB flash drive

    - Power bank

    - On/off switch

    - 10mm Acrylic/Perspex lens

    - 110mm PVC waste pipe

    - 110mm PVC screw-on cap

    - 110mm PVC stop


    # Data loggers


    SanDisk Cruiser USB drives plug into the four-port USB hub. statvs finds the drive
    with the most free space every time the cron job calls on the script.


    # I spy


    The Raspberry Pi camera module has been given good results and surprised Fred
    with his underwater performance. However, with its fiddly ribbon, it is not very
    robust and Fred fried one during his tests.


    ![](img/adbb964c9bace8f3e3949547041f6ef9_72_1.png)


    ![](img/adbb964c9bace8f3e3949547041f6ef9_72_2.png)


    ![](img/adbb964c9bace8f3e3949547041f6ef9_72_3.png)


    # Helping hand


    While he started the project alone, Fred asked his friend Dylan to join in earlier
    this year. Dylan handles the mechanical aspect of the project and is in charge
    of building the robot while Fred focuses on software and electronics.


    # A new house


    The latest iteration of PipeCam–v1.5 uses a flashy transparent housing with a
    Raspberry Pi Zero. The internal mounting has also changed so that the on/off switch
    is accessible by simply removing the lens.


    # There''s more to come


    Now that he has finalised the design of the build, the next goal is to test the
    build as much as possible and refine settings. Fred also intends to give a PipeCam
    to his own fields (or rather water) later this year.


