    # Qubes tips


    Dear L&D, I enjoyed the Qubes OS tutorial in LUBD189 (Features, p60), and I thought
    I would share with you three glitches that put some newcomers off. Firstly, the
    installer seems to offer you to overwrite a previous OS (in my case, Windows 10)
    and instead to squeeze the install into some free space. This meant I had to create
    a live USB (Mint) just to use its disk program to delete the partitions. Other
    readers may benefit from mentioning this advice.


    Having got past that hurdle I felt some newcomers were perturbed by the installation,
    apparently counting megabytes and then appears to ''still'' while installing files
    like the templates. The workaround is not to watch closely until that the number
    of files will increment again if you leave it for twenty or thirty minutes.


    After a reboot I had to choose option templates, and these took a while to install,
    with a progress bar that travelled from during the process. After using Qubes
    and deciding to use it so, I noted that the new version she was


    imminent. I thought that I would do a fresh install of Qubes 4.0 and downloaded
    it.


    This version has a similarly uneven progress bar at the install stage and after
    the reboot to the side-to-side motion of the second progress bar. Leaving the
    computer for an hour or so made it come back much more reliable than the slightly
    uneven install.


    The moral again, don''t panic! Do not assume because it seems that the process
    has ''hung''. Have a cup or a meal before giving it up again!


    Anyway, thanks for the tutorial and I hope my comments encourage others to pursue
    with a setup that turns out well, and to reassure them that once the default config
    is much more reliable than the slightly uneven install.


    River AT


    Chris: Great advice, I''ve never experienced the problem you mentioned with being
    unable to install a Windows OS. In Qubes 3.2.3 Installation Summary, using the
    System option you can use custom selection. On the next screen I was able to configure
    existing partitions and use the partitioning GUI to create the required partitions
    for Qubes OS (as you would in GParted). However, this may be possible with Windows,
    as we''re currently using Linux partitions only.


    Regarding 4.0, we were holding on for the RC to be confirmed as the final, but
    it didn''t come in time for our deadlines, unfortunately. It seems the announced
    release was probably the right call. Fortunately, Qubes 3.2 is still supported
    for the usual 4 months, because we''re still dealing with software certification
    requirements for Qubes 4.0. We would suggest that if you follow the tutorial you
    should use 3.2, but for general use we would recommend the latest release.


