    # # Security distributions


    Use one of these specialised distributions that go one step further than your
    favourite distribution''s security policies and mechanisms


    # Kodachi Linux


    This Debian-based project aims to equip users with a secure, anti-forensic and
    anonymous distribution. It uses a customised Xfce desktop in order to be resourceful
    and gives users access to a wide variety of security and privacy tools while still
    being intuitive. www.dig.com/linux-kodachi


    # Qubes OS


    Endorsed by Edward Snowden, Qubes enables you to compartmentalise different aspects
    of your digital life into isolated departments. The project makes intelligent
    use of virtualisation to ensure that malicious software is restricted to the compromised
    environment. www.qubes-os.org.


    # Subgraph OS


    This is another distribution on Snowden''s watchlist. Subgraph works by building
    sandbox containers around every application, such as web browsers. Despite its
    stability the developers are calling an alpha release. https://subgraph.com


    # Whonix


    The Debian-based distribution is unlike any of its peers that install and run
    atop physical hardware. Whonix is available as a couple of virtual machines that
    can run on KVM and even Qubes OS. This arrangement of virtual machines also helps
    ensure your privacy.


    www.linuxuser.co.uk 81'
