    \ languages can't do this, because there's always a chance that other variable\
    \ is pointing to the same bytes. In Rust, however, we use ownership so that a\
    \ situation can never occur, because it is impossible for two variables to point\
    \ to the same data, as soon as one pointer to data is deleted, it invalidates\
    \ the old pointer.\n\nThis is a bit tricky: with `unique_ptr` we cannot set one\
    \ to equal to the other, because that would move ownership which invalidates the\
    \ first pointer. Here 'invalidates' means that the first pointer is set to null,\
    \ or undefined, which would result in a segmentation fault at runtime. But de-referencing\
    \ an invalid pointer in Rust will cause a compiler error, which helps us catch\
    \ bugs much earlier.\n\n# Passing values\n\nAnother way ownership is transferred\
    \ is passing values. If we have a variable pointing to some bytes on the heap\
    \ and we pass it into a function, the parameter inside takes ownership of the\
    \ variable. Let's look at an example where we use `Box` instead of `String`. Box\
    \ allocates some memory, initialising it to a given value, and returns the 'boxed\
    \ value' - which is, a variable pointing to memory.\n\nThe code in Figure 7 includes\
    \ `steal_`, which takes a boxed integer as an argument.\n\nThe function does not\
    \ do anything much with the parameter, but the fact is that it takes values means\
    \ it takes ownership of the bytes that it points to (value 2018). When the function\
    \ returns, x goes out of scope and the memory will be freed. This means that the\
    \ `println!` statement will not compile, because it would reference to `current_year`\
    \ after it has been invalidated.\n\nWe can stop this by returning the value from\
    \ the function. In Rust, when we return a reference it transfers ownership back\
    \ to the context. In this case, we return `x`, which gets into the new (shadow)\
    \ variable `current_year`, in the memory of the caller.\n\nThis is fine, but it\
    \ is also beneficial if we want to return separate values from the function. Luckily,\
    \ Rust allows providing of passing values to functions without taking ownership\
    \ of them.\n\nFor this use case calling is a bit like 'boxed value': it allows\
    \ us to look at the content of the box, but does not transfer ownership.\n\nFigure\
    \ 9 shows a more concise version of the code in Figure 8 using references. In\
    \ order to sign that a parameter to a function is a reference, we need to put\
    \ `&` in front of the parameter name, and also an `&` in front of the variable\
    \ we are passing in (in this case, `current_year`).\n\nThere's also much less\
    \ to write in Rust when we can return ownership, but hopefully here we've given\
    \ you a taste of what this language can do.\n\n![](img/adbb964c9bace8f3e3949547041f6ef9_56_0.png)"
