  md: '# Feature Control Containers


    # # Docker deployments


    Package your applications for easy deployment and run on any system


    The central premise of Docker is that you should be able to package any application
    once a ''container'' and then run it anywhere without needing to install any dependencies.
    The project was originally released in 2013 as an add-on for the Linux kernel
    by Solomon Hykes, who became known for tighter control over the host resources
    and making Docker popular by the wider community.


    Docker differs from a standard virtualization system, such as Oracle VirtualBox
    or VMware Integration, which uses resource isolation features of the host. Docker
    uses far less memory and processing power, and individual containers are much
    smaller and easier to start than full-blown virtual machines created with full-sized
    operating systems.


    There are two versions of Docker: the Community Edition and the Enterprise Edition.
    Both have the same core features but the Community Edition is released under the
    Apache License v2, while the latter comes with a support contract and the ability
    to run ''certified'' containers on infrastructure


