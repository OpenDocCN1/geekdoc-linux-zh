  md: 'TF-Slim also includes 13 other built-ins for layers, including fully connected
    and unit norm layers. It simplifies creating multiple layers with a repeat function.
    For example, the following code creates three convolutional layers.


    ```

    ```python

    net = slim.repeat(net, 3, slim.conv2d, [3, 3], scope=''conv3'')

    ```

    ```


    This makes the task of retraining a given model to be more finely tuned much easier.
    You can use these repeat functions to create a new layer with only a few lines
    of code to replace the final layer of an already built model. Luckily, there is
    a very good example of how you can do this, within the models section of the TensorFlow
    repository on GitHub. This is a complete set of Python scripts to help you with
    all of the steps we''ve already discussed. There are scripts for converting image
    data to the TensorFlow format, as well as for the retraining of image models.
    If you follow this notebook, which takes you through the creation of a new neural
    network, training on a dataset, and final application of the neural network on
    production.


    ![](img/adbb964c9bace8f3e3949547041f6ef9_50_0.png)


    # Training a new layer


    Once you have a new layer constructed, or have created an entirely new neural
    network from scratch, you still have to train this new layer. In order to retain
    the existing model, you need to create a starting point with the following code:


    ```

    ```python

    model_path = ''path/to/pre_trained_model/image_checkpoint''

    variables_to_restore = slim.variables_to_restore()

    init_from = slim.from_checkpoint(model_path, variables_to_restore)

    ```

    ```


    Once you start from this checkpoint, you can be retraining with the following
    code:


    ```

    ```python

    train_op = slim.layers.create_train_out(...)

    log_dir = ''path/to/my_dir''

    lim.train_retrain(train_op, log_dir, init_from=init_from)

    ```

    ```


    Now you can run this new model to get the desired results. To help, the TF-Slim
    code repository includes a script evaluation.py to help you do this processing
    step. If you have something specific that you need to do, you can use this script
    to write your own workflow scripts.


    # Performance implications


    The developers behind TensorFlow have put a lot of work into making the final,
    fully trained models fairly snappy in terms of performance. This is one of the
    reasons why deep learning and neural networks have


    exploding in popularity. There is still one area that has performance problems,
    however: the training of the models. In practice, training image-recognition models
    alone takes weeks of processing time. This is why a bit of delay bottleneck has
    been built into GPU support for the first stage of Stage-Tensorflow—and it''s
    also why we use to retrain the inception-recognition model we''ve been deciding,
    whenever you have the opportunity.


    # Where next?


    We''ve been able to cover the process of image recognition and retraining of neural
    networks in this much way so far. There are a large number of complicated steps
    involved in working with these types of models.


    My hope is that this article will help to highlight the overall concepts, and
    includes enough external resources to point you to sources of the details you
    might need to add to finish your projects.'
