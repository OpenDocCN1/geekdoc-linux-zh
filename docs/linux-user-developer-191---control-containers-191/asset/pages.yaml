  md: '# Subgraph OS


    Manages to successfully tread the line between usability and security


    # Whonix


    A ready-to-use OS that''s available as two KDE-powered virtual machines


    ![](img/adbb964c9bace8f3e3949547041f6ef9_82_0.png)


    ![](img/adbb964c9bace8f3e3949547041f6ef9_82_1.png)


    +   - You use the intuitive Subgraph Firewall to monitor and filter outgoing connections
    from individual apps


    +   - The iptables rules on the Whonix-Workstation force it to connect to the
    virtual internet LAN and redirect all traffic to the Whonix-Gateway


    # How is it secure?


    # How is it secure?


    Subgraph ships with a kernel hardened with PaX set of patches that makes both
    the kernel and the userland delightful. The distribution also forces users to
    encrypt their files. To top off, Subgraph runs many applications outside the OS
    security sandbox to limit the risks.


    Built on the concept of security by isolation, Whonix uses the form of two virtual
    machines. The idea behind this is to isolate the environment from the internet
    access point. On top of this, Whonix routes all traffic through Tor. Thus, if
    one of the machines is compromised, it wouldn''t affect the other.


    # What about anonymity?


    # What about anonymity?


    The distro anonymises your internet traffic by routing it through the Tor network.
    It also uses anonymous peer-to-peer file sharing like TorTorrent. Then there Subgraph
    Firewall, which applies filters to outgoing connections on a per-application basis
    and is for monitoring unexpected connections from applications.


    Whonix uses Tor to hide your IP address and circumvent censorship. The distribution
    also bundles the anonymous peer-to-peer instant messaging and privacy-friendly
    client combo of Thunderbird and TorBird. Whonix does not include Tor by default,
    but there''s a script to download from a list of stable, hardened releases.


    # Useful as a desktop?


    # Useful as a desktop?


    Subgraph includes a selection of mainline apps for daily use, such as Firefox
    and VLC. On Subgraph these come well prepared by the sandboxing system for added
    privacy protection. The distribution is also configured to fetch packages from
    its own repository and that of Debian.


    Whonix includes LibreOffice but for Whonix. There''s also KPG for managing keys,
    and many of applications are tuned for privacy. There is a bunch of repos and
    you''ll have to choose which one to set up. It doesn''t include a graphical package
    manager, but you can use the Whonix-script to search for applications.


    # Installation and setup


    # Installation and setup


    Subgraph includes a Debian installer to help you set up LVM volumes during installation.
    The distribution establishes a connection to the Tor network as soon as it''s
    connected - but it doesn''t include the Tor browser by default, which is automatically
    downloaded when for the first time.


    There is no graphical installer for Whonix. Instead, the project offers several
    deployment methods, the most convenient of which is to get the VMs that work with
    VirtualBox. At launch, both VMs take you through a brief setup wizard to finish
    with some set of components, such as the repository.


    # Overall


    # Overall


    Subgraph goes to great lengths to ensure everything from the kernel to the userland
    aren''t exploitable. It also bundles a host of privacy-centred apps along with
    minecraft desktop apps.


    Whonix is a desktop distro that''s available to separate VMs. It ensures security
    and privacy by using virtualisation app to isolate the environment from the one
    that fetches the internet.


    www.linuxuser.com | 83'
