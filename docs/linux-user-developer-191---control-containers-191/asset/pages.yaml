  md: '# GAMING


    # Steam Machines on the way out?


    # Valve announces a change of strategy for its Linux boxes


    Once to be the new future for PC gaming, Steam Machines—console-like PCs running
    the Linux steamOS and produced by Alienware, Asus and others—went largely unnoticed.
    Perhaps it was Steam''s lack of traction, or perhaps Steam''s own link game-streaming
    boxes revived the idea of Steam Machines that could really get going.


    Whatever the case, Valve is no longer promoting Steam-powered PCs via the Hardware
    link on the Steam website or its desktop client—though the page itself has not
    been removed.


    When its "routine cleanup" eventually morphed into an "anti-Steam Machines" conspiracy
    theory, Valve opted to address concerns. Overall, it appears to be a general change.
    Steam Machines are still available; they can be searched for in Steam, and the
    Machines page is still live, not just


    > It''s true Steam Machines aren''t exactly flying off the shelves


    ![](img/adbb964c9bace8f3e3949547041f6ef9_7_0.png)


    Above Steam Machines aren''t quite dead, but they are on life support


    found. In a blog post on 4 April, Valve''s Pierre-Louis Griffiths claims Steam''s
    strategy has really changed. "While they aren''t exactly flying off the shelves...
    we''re still working on making Linux operating systems a great place for gaming
    and applications. We think it will ultimately result in a better experience for
    developers


    and customers, including those not on Steam. SteamOS will continue to be our medium
    to deliver these improvements to customers, and we think they ultimately benefit
    the Linux ecosystem at large.


    Among these improvements is investment in the graphics APIs and shader-packing.
    Steam Machines or not, Valve isn''t going off on Linux just.


    # HARDWARE


    # Intel discont its graphics update

    Many new distros just don''t need it anymore


    As Linux distributions develop and improve, it isn''t unusual for third-party
    tools and software to become obsolete. Intel Update Tool is a great example. Released
    in 2013 giving users a way to install and upgrade stable drivers and firmware
    on Intel hardware, five years later the software became largely redundant.


    The Intel blog announced on 8 March that "users will notify Fedora 27 and Ubuntu
    17.04 are beyond very current, Therefore, we are discontinuing the Update


    Tool of version 2.0.6. The final 2.0.6 of the update tool was targeted specifically
    at Ubuntu 17.04 and Fedora 26. Further updates for other distributions are no
    longer being supported."


    Previously known as the Intel Installer for Linux, it covered all system graphics
    typically. laptops, desktops and many-in-one also relies on Intel graphics. With
    the update tool put out to past, how will you keep your Linux system''s graphics
    up to date? Is a laptop or GPU card required?


    In case of Ubuntu and Fedora, the inclusion of Intel graphics in these distributions
    (kernel) means that the update tool is no longer needed-clear.


    With other distros, many users have relied on the Intel support forum for help
    and assistance. This will close; the announcement that the forum will be maintained
    for a while, before being reconfigured as an archive. Users using older drivers
    and hardware will be hit hard by this, so upgrade wherever possible.'
