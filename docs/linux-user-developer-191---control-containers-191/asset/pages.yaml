  md: 'flash the downloaded Picrot image to an SD card. Plug your microSD card into
    your laptop, launch Etcher and select the Picrot image. Then restart your Pi!


    Now that we''ve paired with Mycroft, we can go to the Settings where you can select
    a male or female voice, the style of measurement units you want to use, and your
    preferred date/time format.


    If you''re concerned about privacy, you may want to keep the OpenSaat unchecked.
    Keep in mind, though, that this is a good way of contributing useful data to the
    open source project and thus improving the performance of Mycroft in the future,
    as your voice isn''t assistant in a confidential environment.


    # 02 Set it up


    Plug your microSD back into your Raspberry Pi and connect it to a power source.
    The easiest way to get everything working is to connect your Pi to the network
    via the Ethernet port. If you need to use WiFi, select your SSID and enter the
    password 12345678.


    Once you''re connected, you''ll need to plug in the keyboard, or connect via SSH
    to do this headless. Whether you use Ethernet or WiFi, you''ll need to visit http://mycroft.ai
    to start the setup process. Sign in with Facebook or create a new Mycroft account;
    given that that part of the reason for this project is to protect your data from
    being shared with others, this might be advisable!


    # 03 Find your Raspberry Pi


    To find all Raspberry Pi devices start with the MAC address of 02:B7:EB, we can
    use this to scan the network for the Pi, if you don''t have a monitor/keyboard
    to connect to. You can use, example:


    ```

    $ sudo nmap -sP 192.168.1.0/24 awk ''/Nmap/ {print $5}'' | grep 02:b7:eb | awk
    ''{print}''

    ```


    You can also use:


    ```

    $ arp -a | grep 02:b7:eb

    ```


    If your network is not on the 192.168.1.x, change the command line below.


    # 04 Connect to owncroft


    SSH into your Pi and you''ll be taken to the Mycroft CLI. This is usually quite
    simple, but while we get some things you might want to exit using Ctrl-C to make
    a normal prompt. Then you''ll need to do some basic setup. First, change the password:
    type password followed the prompts. Then change the Wi-Fi network settings.


    ```

    $ sudo nano /etc/mycroft/setup.conf

    ```


    Change the network name and/or password in this config file, then press Ctrl+X
    to exit and save the file. Then type sudo reboot to reload your Pi.


    # 05 Add your device to Mycroft


    Back in your browser at mycroft.ai, click ''Add Device'' and you''ll be asked
    for a name and location for your Pi device. You''ll also be asked for a registration
    code, if you turn on the speakers connected to your device you''ll be reading
    this out to already, until the device is plugged up.


    ![](img/adbb964c9bace8f3e3949547041f6ef9_76_0.png)


    # 07 Using the Picrot CLI


    Now that everything is set up, you should have a basic voice assistant to start.
    Go out the word and issue a few commands to get started - Mycroft Hey Butler,
    what is time?'
