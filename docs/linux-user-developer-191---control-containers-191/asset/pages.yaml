  md: '# # In brief: compare and contrast our verdicts


    | &nbsp; | | Kodachi Linux | Qubes OS | Subgraph OS | Whonix |

    |---|---|---|---|---|n| **How is it secure?** | Uses a patched kernel instead
    of a hardened one and sandboxes apps with Firefox | Uses Xen to divide the desktop
    and apps into virtual ''qubes'' that are isolated from each | Includes a hardened
    kernel and many common apps inside a secure sandbox | Isolates the internet gateway
    from the workstation in which you run your apps |

    | **What about anonymity?** | Routes all through the internet first via VPN and
    then through the Tor | Its architecture ensures privacy, but that''s not intended
    to be forte | Routes all traffic through a bound tunnel with a host of privacy-centred
    apps | Routes all traffic via Tor with many variety of privacy apps and utils
    |

    | **Useful as a desktop?** | The Xfce desktop is lightweight with open source
    apps for all kinds of users | It operates like any other so long as you adhere
    to its specific needs | Bundles a few apps that can be flushed out easily | Its
    KDE desktop is limited you will need to add apps from the command line |

    | **Installation and setup** | Uses the rudimentary deinstaller which is Kodachi''s
    weakest asset. | Install-distribution is straightforward but easy-operate Anaconda
    install | Uses a modified Debian distro which require much setup before use |
    |

    | **Overall** | Uses Firefox to secure its collection of apps but is bothersome
    to install | Ensures compromised applications don''t leave your entire installation
    vulnerable | Provides a secure environment for your apps to safeguard your privacy
    | An easy-to-deploy distribution that wisely ensures your security and privacy
    |


    # # AND THE WINNER IS...


    ### Qubes OS

    There''s very little to choose between the contenders, all of them doing their
    bit to protect users from vulnerabilities and exploits. Linux Kodachi and Subgraph
    OS are similar in this that they isolate applications from locations each having
    its own small footprint on the system, which makes them the best of mean for what
    they do. Both projects also use a virtualized network to help their users remain
    anonymous online.


    The reason for Kodachi limitation is that it doesn''t use a hardened kernel and
    it''s not easy to install. These problems don''t exist in the Linux-enabled Subgraph,
    which is built by a team of developers with a proven record of developing security-crafts.


    Subgraph also has the same setup as Kodachi in terms of peers and offers better
    protection than a regular desktop distribution. However, many security and privacy
    leaks make it look less secure than our winner. Its developers accept that Subgraph
    makes improvements.


    ![](img/adbb964c9bace8f3e3949547041f6ef9_83_0.png)


    This leaves us with Whonix and Qubes. Whonix is more geared towards privacy, but
    Qubes is the more comprehensive security option. The two are also also the most
    responsive and resource intensive to deploy and operate. But regular, readers
    will understand that effective security is an isolated process and won''t shy
    away from putting the effort required to set up Qubes. Additionally, you can also
    install the Whonix Template on Qubes OS – and you can also check our feature (see
    p660), Features: **LUB89** to get grips with it.


    > LU&D.


    Wayne Sharma'
