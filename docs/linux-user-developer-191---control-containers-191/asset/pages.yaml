    \ the behavior of the reference from `&Box<i32>` to `&mut Box<i32>`.\nSince allowing\
    \ references would be problematic if there are multiple references pointing to\
    \ the same bytes, Rust is very strict about the use of mutable references. The\
    \ rule is that if a piece of data has a mutable reference there cannot be other\
    \ references to that data in the same scope. When Rust modifies the reference\
    \ points to without without being another reference pointing to that data.\n\n\
