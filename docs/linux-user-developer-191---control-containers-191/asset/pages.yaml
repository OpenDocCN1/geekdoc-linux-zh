    # TensorFlow: Image Recognition


    # TensorFlow: Recognise and classify images


    Put the power of an open source neural network to work with this example of a
    usage for deep learning**


    Neural networks have been around, as an idea, since the very beginning of artificial
    intelligence. The problem has been that it''s very difficult to implement efficiently
    these techniques out of the hands of the software developer until Google developed
    a library for its Google Brain internal project. This was released in 2015, and
    in just a few years, it''s found its way to handle convolutional neural networks,
    audio recognition and image recognition, among others.


    In order to keep your Python environment organised, you should create a virtual
    environment where you can safely install TensorFlow. You can do this with the
    following:


    ```

    virtualenv --site-packages -p python3

    t tensorflow

    ```


    This will create a virtual environment, in the subdirectory named tensorflow where
    you can install TensorFlow by sourcing the activation script.


    ![](img/adbb964c9bace8f3e3949547041f6ef9_47_0.png)


    ```

    source ~/tensorflow/bin/activate

    (tensorflow)$

    ```


    Your command prompt should change to the new one you see above. You can now install
    TensorFlow into the virtual environment


    Because of its popularity, TensorFlow has been ported to many different platforms
    - including mobile, web and OS. In this article, we''ll look at how TensorFlow
    can be used to do image recognition and classification. We''ll look at how to
    get it installed on your machine, and how to create a basic setup so you can do
    some image processing.


    ```

    pip3 install --tensorflow

    ```


    This installs the CPU version of the TensorFlow library. However, much of the
    processing that it does be far to GPU for faster results. If you have an NVIDIA
    GPU you can use the following commands to install the required CUDA support package
    and the GPU version of TensorFlow.


    # Install TensorFlow


    ```

    sudo apt-get install cuda-command-line-tools

    source ~/tensorflow/bin/activate

    pip3 install --upgrade tensorflow-gpu

    ```


    The first step is to get TensorFlow installed on the machine where you will do
    the image-analysis work. For most platforms, you should be able to install it
    using pip. Because we only have room to talk specifically about one platform here,
    imagine you''re using a Debian-Linux distribution. Assuming this, you will need
    to install the necessary tools with the following command:


    ```

    import tensorflow as tf

    hello_test = tf.constant(''Hello from

    TensorFlow'')

    sess = tf.Session()

    print(sess.run(hello_test))

    ```


    You should verify that everything installed correctly by running the following
    line of code:


