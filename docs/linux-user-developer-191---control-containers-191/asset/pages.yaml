  md: '# DISTRO UPGRADE


    # Pop!OS: In pursuit of an efficient and creative environment for users


    Since announcing its own Linux distribution called Pop!OS, System76 has been building
    steadily to the launch of 18.04


    Before Pop!OS, our attention was focused on ensuring our computer hardware remained
    flawless with Linux. When kind of unity unknown quickly become an opportunity.
    For over 12 years, we had to deal with the needs of the team; as we started introducing
    ourselves to our most important customers, the desktop experience and during this
    time, we collected data on: a list of customer requests for an improved desktop
    interface.


    New installer experience

    The new installer is designed with a story of artwork through the installation
    and installates over the operating system. The installer enables us to ship computers
    with full-disk encryption; simplifies the installation process; installs fast;
    and deploys the artwork that will personalize your operating system, as seen in
    the new Pop!OS artwork.


    > Carl Michel

    Carl is the founder and CEO of System76, a manufacturer of Linux computers.


    USB flashing

    Popsicle is a new utility that launches when you double click an ISO in the file
    manager. It is a USB startup creator that can flash one or hundreds of USB drives
    at once.


    engineering and DevOps - this is where our customers use it. It''s important for
    us to make sure we create the most productive environment to be efficient, and
    creative. After the first Pop!OS release, we addressed the main pain points we
    faced with customers from Linux: the desktop setup is easier to use, more software,
    and a fast experience.


    > One of the things we are most grateful for is having such an active Pop!OS community
    providing feedback


    Additionally, it was important that Pop!OS provided a seamless experience for
    non-technical. This meaning Pop!OS was, faster and more stable than the experience
    we were used to. If Pop!OS can run smoothly into machines windows, we win for
    accessibility, enabling us to create a project with a more powerful interface.


    Other new features include a Do Not Disturb switch with nixations, HID API and
    standard DPI scaling for missed displays or legacy applications, constructed in
    Pop!OS with new artwork, and the kernel and systemd-kernelstub replace GRUB on
    new installs.


    It''s our second launch, 18.04, where we really made progress. What''s different?

    18.04 was the result of maintaining inclusion and collaboration with the Pop!OS
    community. With the installer on the new Linux interface and, of course, the massive
    amount of work that occurs during our development projects. There was a lot of
    testing required in order to ensure Pop!OS was ready.


    Heightened security

    Pop!OS ensures your installation by default Our new installer enables full-disk
    encryption for pre-installs from System76 or other OS. System76 allows you to
    receive a feature that provides automatic firmware updates, ensuring the PC is
    always secure and reliable.


    Performance management

    18.04 includes an improved battery-level indication so users can stay on top of
    their remaining power. We also added a CPU and GPU toggle to switch power profiles
    from the system, such as NVIDIA Optimus, energy saving, high performance and.


    One of the things we are most grateful for is having an active Pop!OS community
    which has been energetic in providing feedback. We''d like to continue improving
    the OS as a tool to help enhance our workflow and always feel more welcome. So
    give Pop a try at https://system76.com/pop and tell us what you need at www.reddit.com/r/pop_os.'
