- - '###'
  - GPU 切换：在笔记本电脑上使用 Linux 是否更好更好
- - '#'
  - 3.13 合并窗口
- - '##'
  - 自动 GPU 切换将对那些在笔记本电脑上使用 Linux 的用户感兴趣，该功能将合并在启动新内核开发周期的“合并窗口”中。在 Linux 3.12 开发期间，某些计划进入
    3.13 的特性功能实际上显示出从 linux-next 进入内核主干的进展（同时合并回 3.7）。数据视觉上支持了这一点：Linux 3.12 中内核提交的
    82.4% 是直接通过 linux-next 宣布的。这些数字略有下降，这是典型的，因为在 3.12 合并窗口中为期一周的延迟中，很少有人利用这段时间。还有
    ABI Checker。因此，这种工具对 Linux 发行版无疑是有益的，因为发行版通常提供稳定内核，但允许在某些条件下加载扩展驱动程序。有关该工具的更多信息，您可以访问
    kernel.org。
