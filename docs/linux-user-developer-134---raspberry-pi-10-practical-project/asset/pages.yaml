    message:


    ```

    ```hg commit -r```

    ```


    As there are now commits, we can revert the previous one if we need to go back
    to the earlier version, using the following command:


    ```

    ```hg update -r 0```

    ```


    All files revert to the last commit. Commit the change to save changes.


