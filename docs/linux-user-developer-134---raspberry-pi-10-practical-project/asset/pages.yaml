  md: "# # Raspberry Pi stop-motion animation\n\n# ## 0 Final setup\n\n+   - sudo\
    \ apt-get install git\n- With a small command, you're ready to clone your home\
    \ directory (`git --version`)\n- git clone https://github.com/raspberrypi/pi-motion.git\n\
    - If you play with it and break it, you can restore it to its original state with:\n\
    - git checkout --hard\n\n# ## 1 Running and Pi-Motion\n\nNow navigate to the pi-motion\
    \ folder and run the application with:\n\n+   - python pi-motion.py\n- The first\
    \ call to `take_pic()` from the main loop, which saves an image and creates a\
    \ preview that's loaded by `update_display()`. The camera is coded to toggle between\
    \ two states by asking you to toggle switches.\n\n# ## 2 Getting animated\n\n\
    The main loop checks for keyboard events updating the screen around 30 times per\
    \ second. Since the camera's live view is independent of that, `update_display()`\
    \ only needs to worry about updating the preview (`prev_pic`, the latest picture\
    \ shown). The `animate()` function is essentially a microcosm of `update_display()`.\
    \ When the P key is pressed, the live view is suspended and for all the pictures\
    \ taken (`pics`), each will be 'tiled' on\n\n# ## 3 Full code\n\nimport picsamera,\
    \ os, sys\n\n```\npics_taken = 0\ncurrent_alpha, next_alpha = 128, 255\nfps =\
    \ 3\n```\n\n```\npygame.init()\nfor your window:\n    res = pygame.display.info()\
    \ # return the best resolution\n    print('Requested resolution is ', res['w'],\
    \ 'x', res['h'])\n    pygame.display.set_mode((res['w'], res['h']))\n    start_path\
    \ = os.path.join(os.getcwd(), 'start_screen.jpg')\n    start_pic = pygame.image.transform(start_path,\
    \ (res['w'], res['h']))\n    pygame.display.blit(start_pic, (0, 0))\n    clock\
    \ = pygame.time.Clock()\n    camera = picsamera.Camera(0)\n    camera.resolution\
    \ = (res['w'], res['h'])\n```\n\n```\ndef take_pic():\n    global pics_taken\n\
    \    pics_taken += 1\n    camera.capture(os.path.join(os.getcwd(), 'pics', 'image_'\
    \ + str(pics_taken) + '.jpg'))\n    prev_pic = pygame.image.load(os.path.join(os.getcwd(),\
    \ 'pics', 'image_' + str(pics_taken) + '.jpg'))\n```\n\n```\ndef delete_pic():\n\
    \    global pics_taken\n    if pics_taken > 1:\n        pics_taken -= 1\n    \
    \    prev_pic = pygame.image.load(os.path.join(os.getcwd(), 'pics', 'image_' +\
    \ str(pics_taken) + '.jpg'))\n```\n\n```\ndef animate():\n    camera.stop_preview()\n\
    \    for i in range(pics_taken):\n        camera.capture(os.path.join(os.getcwd(),\
    \ 'pics', 'image_' + str(i) + '.jpg'))\n    camera.start_preview()\n```\n\n```\n\
    def update_display():\n    screen.fill((0, 0))\n    screen.blit(prev_pic, (0,\
    \ 0))\n    pygame.display.flip()\n    clock.tick(30)\n    camera.start_preview()\n\
    ```\n\n```\ndef make_movie():\n    camera.stop_preview()\n    pygame.quit()\n\
    ```\n\n![](img/45a70445846e93838a23812ca8a9d98d_40_0.png)\n\n```\nprint('using\
    \ pi-motion to decode your video.')\nnos.system('ffmpeg -i \"image_%d.jpg\" -vcodec\
    \ h264 video.mp4')\n```\n\n```\ndef change_alpha():\n    global current_alpha,\
    \ next_alpha\n    camera.stop_preview()\n    current_alpha = next_alpha\n    next_alpha\
    \ -= 5\n```\n\n```\ndef de_quit():\n    camera.close()\n    pygame.quit()\n```\n\
    \nprint('You\\'ve taken', pics_taken, 'pictures. Forget to get back up!')\n\n\
    ```\ndef intro_screen():\n    while True:\n        for event in pygame.event.get():\n\
    \            if event.type == pygame.KEYDOWN:\n                if event.key ==\
    \ pygame.K_ESCAPE:\n                    update_display()\n                elif\
    \ event.key == pygame.K_SPACE:\n                    take_pic()\n             \
    \   elif event.key == pygame.K_BACKSPACE:\n                    delete_pic()\n\
    ```\n\n```\ndef main():\n    intro_screen()\n    while True:\n        for event\
    \ in pygame.event.get():\n            if event.type == pygame.KEYDOWN:\n     \
    \           if event.key == pygame.K_ESCAPE:\n                    make_movie()\n\
    \                elif event.key == pygame.K_SPACE:\n                    take_pic()\n\
    \                elif event.key == pygame.K_BACKSPACE:\n                    delete_pic()\n\
    \                elif event.key == pygame.K_LEFT:\n                    change_alpha()\n\
    \            if pics_taken > 1:\n                animate()\n        update_display()\n\
    ```\n\n```\nif __name__ == '__main__':\n    main()\n```\n\n![](img/45a70445846e93838a23812ca8a9d98d_40_1.png)"
