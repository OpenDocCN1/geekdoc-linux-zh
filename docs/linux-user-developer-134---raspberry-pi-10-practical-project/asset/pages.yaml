  md: "# Program Minecraft-Pi\n\n# Installation\n\nMake sure you're already in your\
    \ home folder to download the Minecraft-Pi package with the following commands\
    \ in a terminal:\n-assets/minecraft.pi\n\n```\ncd\npip install https://3.amazonaws.com/assets/minecraft.pi\n\
    ```\n\nTo use it you need to copy the following folder to your Minecraft-Pi directory:\n\
    - tar -zvf minecraft-pi-0.1.1.tar\nNow you can move into the Minecraft-Pi directory\
    \ and try running it for the first time:\n\n```\n./minecraft-pi\n```\n\n# Full\
    \ code listing\n\n```\n# /usr/bin/env python\nfrom cmpi.minecraft import Minecraft\n\
    from cmpi.block import block\nfrom cmpi.vec3 import Vec3\nfrom time import sleep\n\
    import random\n\nmc = Minecraft() # make a connection to the game window\nplayer\
    \ = mc.getPlayerPos()\n\n# function to generate random floats to position inside\
    \ the player\ndef randvec3(center):\n    return Vec3(random(center.x), random(center.y),\
    \ random(center.z))\n\n# function to calculate distance between points\ndef distance(point1,point2):\n\
    \    dx = point1.x - point2.x\n    dy = point1.y - point2.y\n    dz = point1.z\
    \ - point2.z\n    return math.sqrt(dx*dx + dy*dy + dz*dz)\n\n# function to create\
    \ a random block in a region\ndef randBlock(pos):\n    randomBlock = randvec3(pos)\n\
    \    randomBlock.x += random.randint(pos.x-50, pos.x+50)\n    randomBlock.y +=\
    \ random.randint(pos.y-5, pos.y+5)\n    randomBlock.z += random.randint(pos.z-50,\
    \ pos.z+50)\n    return randomBlock\n\ndef main(): # main loop of hide and seek\n\
    global player\nlastPlayerPos = mc.getPlayerPos()\nsleep(2)\nrandBlock = randBlock()\n\
    mc.setBlock(randBlock, block.DIAMOND_BLOCK)\\mc.postChat(\"A diamond has been\
    \ hidden somewhere nearby!\")\ndistanceFromPlayer = distance(randBlock, lastPlayerPos)\n\
    timeStarted = time.time()\nwhile True:\n    player = mc.getPlayerPos()\n    if\
    \ distanceFromPlayer < 2:\n        seaking = False\n    else:\n        mc.postChat(\"\
    War \" + str(distanceFromPlayer) + \" blocks away\")\n        if distance(player,\
    \ randBlock) > distanceFromPlayer:\n            mc.postChat(\"Colder \" + str(distanceFromPlayer)\
    \ + \" blocks away\")\nelse:\ntimeTaken = time.time() - timeStarted\nmc.postChat(\"\
    Took \" + str(int(timeTaken)) + \" seconds to find the diamond\")\nif __name__\
    \ == \"__main\":\n    main()\n```\n\n![](img/45a70445846e93838a23812ca8a9d98d_26_0.png)\n\
    \n# On the Disc\n\nYou'll learn...\n\nFunctional, and\n\nThere's nothing too tough\
    \ about coding. We've used a couple of functions (starting with basic ones) and\
    \ now we will explain how to create the logic.\n\n# Configuring the Pi API\n\n\
    To take control of the Pi API, you will need to copy the Python folder from the\
    \ Minecraft-Pi folder to a new location. In the terminal, type:\n- /minecraft\n\
    \n```\ncd ~/minecraft/pi-api\n```\n\nNow we want to create a 'boilerplate' Python\
    \ script that connects the API to the game. Write the following:\n\n```\nfrom\
    \ cmpi.minecraft import Minecraft\nmc = Minecraft()\n```\n\nWith nano, you can\
    \ follow the steps and then press Ctrl+X to save (Y), then Enter to run the command:\n\
    \n# Testing the Pi script\n\nThe script you created contains everything you need\
    \ to get started with Minecraft in Python language. For it to work, you will need\
    \ to have the game running (and playing). To grant control of the mouse\n\n# Hide\
    \ and Seek\n\nAs you can see from the code, we've created a game of Hide & Seek\
    \ based on Martin's original creation (which you can find at www.stuffcode.com).\
    \ When you launch the script, you'll be challenged to find the hidden diamond\
