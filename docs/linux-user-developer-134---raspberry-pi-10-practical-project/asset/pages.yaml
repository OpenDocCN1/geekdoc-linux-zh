    www.raspberrypi.org/downloads\n- picamera Python module\npicamera.readthedocs.org/\n\
    - Raspberry Pi camera module\n- Pygame\nwww.pygame.org\n\nThe Raspberry Pi camera\
    \ module opens the door for your Pi projects to incorporate aspects of photography\
    \ and making movie. We're combining both to create a fully featured stop-motion\
    \ camera using Raspberry Pi which makes it incredibly easy to create impressive\
    \ HD animations.\n\nWe will project with Python and it relies on two libraries\
    \ (picamera.readthedocs.org), a pure Python interface to the Pi camera module\
    \ and is a must for all camera module owners. Pygame (pygame.org), which ensures\
    \ our images can be displayed on demand.\n\n# 01 Set up the camera module\n\n\
    First things, you need to make sure your Raspberry is up to date. In the terminal,\
