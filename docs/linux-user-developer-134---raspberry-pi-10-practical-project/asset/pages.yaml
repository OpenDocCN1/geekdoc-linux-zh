    # On the DVD


    Find out what lies in store for you on issue

    134''s Linux User & Developer DVD...


    Welcome to the Linux User & Developer DVD,

    which accompanies issue 134. We have again

    chosen a selection to reveal contents of

    this month''s issue.\ On the disc 134, we have four of the big

    distros ready to go. Linux Mint 16, the most

    important release of Mint to date, is joined

    by the beta for Fedora 20 and rescue distro SystemRescueCd. We also have openSUSE

    13.1, fresh from the factory and ready to

    power your business or home desktops.

    Access them you''ll have to put your

    disc into an optical drive and select

    from the boot menu during POST.

    From there you can live-boot, and install if

    you wish.


    # Distros


    We have two like-booting,

    distros in Linux Mint 16 and

    SystemRescueCd, we also

    en openSUSE and Fedora

    images on the disc


    ![](img/45a70445846e93838a23812ca8a9d98d_95_0.png)


    # Software


    20 of the latest

    software packages

    covering variety of

    different functions


    # Tutorial Files


    If you want to follow along

    to some of our other tutorials,

    selected projects are

    available here


    # RasPi

    Projects


    All the code from

    our Raspberry Pi

    projects is also

    available here


    ![](img/45a70445846e93838a23812ca8a9d98d_95_1.png)


    # How to burn an ISO


    Want to try a new distro? Here''s how to get started...


    ![](img/45a70445846e93838a23812ca8a9d98d_95_2.png)


    ![](img/45a70445846e93838a23812ca8a9d98d_95_3.png)


    ![](img/45a70445846e93838a23812ca8a9d98d_95_4.png)


    STEP 1: Grab a new ISO

    Copy the ISO from our cover disc to

    hard drive; go to the Disc tab, click ISO and

    to choose. Alternatively, find an ISO online

    download. If you''re not sure if you need a 32-bit or

    64-bit version, going to the former is safer.


    STEP 2: Open or install Brasero

    Brasero is the most popular open source-

    utility. If it''s not already installed on

    distro, locate it in your repository and

    it. Open the program and select ''Burn''

    im from the Projects tab on the left.


    STEP 3: Burn your disc image

    On the Burning Setup menu, click the first

    box - ''marked'' to select a disc image –

    and navigate to the ISO you put on your hard

    disk. Once selected, you''ve got a CD or DVD

    writable disc inserted and click ''Create Image''.'
