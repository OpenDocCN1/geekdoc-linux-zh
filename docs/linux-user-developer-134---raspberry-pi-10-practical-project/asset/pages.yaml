    it so you can interact with Minecraft in a way you''ve never done before. This
    small project is just the tip of the iceberg...


    # 01 Requirements


    Minecraft-Pi requires you to be running Rasp on your Raspberry Pi, so if you''re
    not already running that, take a trip to the shop and get it up. It also requires
    you to have Windows loaded too. Assuming you''re at the command prompt, you just
    need to type start to reach the desktop.


