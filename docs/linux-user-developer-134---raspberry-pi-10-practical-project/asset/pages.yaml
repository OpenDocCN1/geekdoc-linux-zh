    ```bash

    dpkg --get-selections > selections.txt```

    ```


    Make sure to save this. Once you install the new version of Ubuntu, you can use
    this to add the selections to the new dpkg:


    ```

    ```bash

    dpkg --get-selections < selections.txt```

