  md: '# # Presentation software group test

    Four of the best presentation applications we had to review


    # ## In brief: Compare and contrast our verdicts


    | | Calligra Stage | EWIRE | LibreOffice Impress | Slidifer |

    |---|---|---|---|---|n| Ease of use | 7 | 6 | 9 | Clutter and some typical functions
    make it a bit tricky | There isn''t much to work with, it''s not always straightforward
    | Impress sets the standard for a local and friendly interface | While the coding
    aspect is extremely simple, it''s childish |

    | Compatibility | 8 | 8 | 0 | As long as you have no animations, it will import
    many popular file types | No compatibility with any other formats other than its
    own | There are always bugs to deal with, but they do well to fix | Again, there''s
    no way to import any kind of slideshow file |

    | Aesthetics | 9 | 10 | 7 | It will display high-quality presentations if you
    can make them | Leaving a very small window with images not scaled | Presentations
    look as clearly as you want them to | It looks fine if you intend limited confines
    of the presentation |

    | Features | 8 | 3 | 4 | A good selection of features to make the most of your
    slides | A primitive set of features, which are easily animated | A wealth of
    features that can help you create any slideshow | Light features, with a basic
    list of functions and images |

    | Overall | 7 | 5 | 5 | UX issues may hamper a top-notch slideshow creator | Not
    worth considering as a presentation tool, EWIRE is terrible | LibreOffice is just
    the best choice for use of any kind | A nice idea, but it needs a little more
    polish with online and offline sidelines |


    ## AND THE WINNER IS..

    LibreOffice is the best office suite on Linux and as turns out, it is the best
    open source presentation software available. While it isn is easy to use and has
    a wealth of features to make your presentation any you like – whether it is full
    of animations or information-rich – with other presentation software is also good,
    but at least good as it gets for learners.

    Slidifer is a great idea, it''s nice, simple yet good-looking slideshows that
    can be easily shared online. There are no accounts required and it runs on any
    modern browser. Its simplicity, though, means notably placement of text and images
    to each other. Google Docs is much better than it, and is just as easy to share
    with, much easier to create and edit.

    Rob Zwetschel


