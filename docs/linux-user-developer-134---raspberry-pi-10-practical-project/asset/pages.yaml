    # Get interactive with Scratch


    Experiment with physical computing by using Scratch to interact with buttons and
    lights on the Pi


    # What you''ll need


    +   - Breadboard

    - LEDs

    - Buttons

    - Resistors

    - Jumper wires

    - ScratchGPIO03


    Scratch is a very simple visual programming language, commonly used to teach basic
    programming concepts to learners of any age. This project will learn you how to
    light up an LED with Scratch, and change a character''s colour when a physical
    button is pressed. With these techniques you can make manner of fun projects,
    from musical keyboards to controllers for your games and animations.


    # 01 Installing the required software


    Log into the Raspberry system with the username Pi and the password raspberry.
    Start the LXDE desktop environment using the command start. Then open LXTerminal
    and use a Python script to install:


    ```

    chmod + install_scratchgpio.sh

    sudo bash install_scratchgpio.sh

    ```


    This will create a special version of Scratch on your desktop. This is a simple,
    version of Scratch that handles communications between Scratch and the GPIO. ScratchGPIO
    was created by simplest (cymplexy.wordpress.com).'
