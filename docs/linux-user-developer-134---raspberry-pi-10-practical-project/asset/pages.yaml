  md: '# Presentation software group test


    Four of the best presentation applications to go to head


    # REVIEW


    # LibreOffice Impress


    # The slideshow creator from our suite champion — it is as good as the rest of
    the suite?


    LibreOffice is just an excellent office suite, and a true open source success
    story. We made it our office suite champion, and we''re back today to see if Impress,
    LibreOffice''s presentation software, stands up to any other offerings. We''re
    not looking at the OpenOffice equivalent, but can it jump above its original copy?


    One of the strengths of LO is that with other software, especially Microsoft''s
    versions, while PowerPoint has the best of copy, Impress is still great at making
    a variety of different types of presentations that you can''t be worked with as
    easily. At all, Impress comes with about every feature you''ve ever seen in other
    slideshow software, with better transitions between multiple ones. Whether you''re
    doing a very professional business presentation or a bit more informal, all the
    necessary graphs and animations are available to use in Impress.


    ![](img/45a70445846e93838a23812ca8a9d98d_72_0.png)


    The interface for your presentations is extremely neat and naturally laid out
    by default — you can add, remove or reposition functions. Priority is given to
    making functions easy to find. The screen is never overly packed with functions
    and customization. This is in contrast to the way CallStage is laid out, with
    everything in place but very little room to manoeuvre around. Due to Impress''s
    layout


    we are able to quickly and easily put together a presentation without having to
    hunt around with the interface at all. It is an amazing piece of software, well
    worth trying in the full suite. Impress presentations look great when designed,
    while it imports other file types well and is just nice to use. The only real
    issue is the lack of some free presentations online, although such a function
    will be coming sometime in the future. For now, Impress is most definitely the
    best presentation application.


    # “The interface is extremely neat and logically laid out”


    ![](img/45a70445846e93838a23812ca8a9d98d_72_1.png)


    # SCORES


    | Ease of use | Every important function is plainly laid out in an easy-to-access
    fashion | 9 |

    |---|---||

    | Compatibility | While there are some issues with types, they can usually be
    fixed in the software | 8 |

    | Aesthetics | Impress perfectly displays the presentation you want to | 10 |

    | Features | From graphics to animations and between, Impress has just about everything
    | 9 |

    | Overall | LibreOffice is just a great suite, and the Impress stage doesn''t
    let you down |


    ![](img/45a70445846e93838a23812ca8a9d98d_72_2.png)


    Impress is the only one that slide transitions and animation objects


    www.linuxuser.co.uk'
