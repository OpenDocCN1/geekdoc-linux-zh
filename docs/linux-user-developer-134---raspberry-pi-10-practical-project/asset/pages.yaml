  md: "# Get interactive with Scratch\n\n![](img/45a70445846e93838a23812ca8a9d98d_28_0.png)\n\
    \nuses pin rather than numbers to identify pins.\nThe top-right pin (3.3v) we\
    \ first connected our LED to pin number 1, the other end. Connect the one that\
    \ is beneath pin 2, and so on.\n\n# You'll learn...\n\n1 Simple circuits\nWhile\
    \ these are very basic circuits, how do we get a great feel for programming with\
    \ a Raspberry Pi prototyping kit? If you need to buy the lights and parts we recommend\
    \ you check out shop.raspberrypi.com/\n\n# 2 Connecting the breadboard\n\nPower\
    \ your off and connect an LED, a 330-ohm resistor and two GPIO cables. You'll\
    \ want to connect the 3.3v pin (top-right pin) closest to the end of the 330-ohm\
    \ resistor to the opposite terminal of the breadboard (the LED is longer to the\
    \ other end). The resistor is used to limit the amount of current that can flow\
    \ to the LED.\n\n# Wiring up our push button\n\nConnect the negative terminal\
    \ of the LED into the GROUND pins of the breadboard. Connect the power to the\
    \ GPIO pin (the third pin from the top of the row). Now you can connect the power\
    \ to the LED. If it doesn't work right, just swap the legs around and try again.\n\
    \nPower off the Pi. If we connected the LED that we created first, the first thing\
    \ we need to do is connect 3.3 (the top-right pin) to the push button. Then connect\
    \ a 10k ohm resistor to the positive terminal, and the other end to an empty track\
    \ on the breadboard. Then on that same track, add the other end connected to GPIO\
    \ 7. This is pin number 17. Finally, connect the negative terminal of the push\
    \ button by adding a wire that is connected to the same negative rail pin.\n\n\
    # 2 Coding principles\n\nScratch is the perfect place to start programming real-life\
    \ projects. It helps you understand basic programming languages and logic.\n\n\
    # 3 Physical out\n\nThere's nothing more than making code from your screen work\
    \ into a real-life project. It helps you just light a life on and build the skill,\
    \ that is the limit.\n\n# 03 Switching on and off\n\nAt the moment, the LED is\
    \ connected to a pin that can only be turned on. If we want able to turn it on\
    \ and off, we should use GPIO 17, which we can turn on and off. GPIO 17 is the\
    \ sixth pin from the top, on the top of the row. Power on the Pi. We can turn\
    \ the LED on by outputting the GPIO pin and setting its value to 1. By setting\
    \ it to 0 we turn the LED off.\n\n```\nset x7 to /sys/class/gpio/gpio7\nset out\
    \ to /sys/class/gpio/gpio7/direction\nset 1 to /sys/class/gpio/gpio7/value\n```\n\
    \nWhen the button is pressed, GPIO 7 will be 1. However, when the button is released,\
    \ the GPIO will be 0. We have a value of 0, because there is less resistance connected\
    \ to the ground.\n\nWe can see this in action by checking the pin value and pressing\
    \ the button to change it.\n\n```\nwhen clicked\nforever\n  if pin7 sensor value\
    \ = 0 then\n    broadcast wait\n  end\n```\n\n![](img/45a70445846e93838a23812ca8a9d98d_28_1.png)\n\
    \n# 04 Controlling the LED from Scratch\n\nUse the LXDE environment and open Scratch3.\
    \ In the control section and create a simple sprite that broadcasts wait when\
    \ it is clicked. Then click the sprite. The LED should light up. Now add the script\
    \ to wait 1 second and then broadcast pin1off. The LED will come for a second\
    \ and then go off. ScratchGO3\n\n# 06 Let there be light!\n\nBoot up the Pi and\
    \ start Scratch3 as before. Go to the events section and add a green flag clicked,\
    \ then add a forever loop, and use an if else statement. If = operator then go\
    \ to the sensing section and add a value to the left side of the equality statement,\
    \ and set the right side to If the sensor value is 0, and broadcast pin1off otherwise.\
    \ Click the green flag. If you push the button, the LED will light up!\n\n29 with.linuxux.co.uk"
