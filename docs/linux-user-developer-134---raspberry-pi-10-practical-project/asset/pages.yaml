    # EDUCATION


    # Facebook broadens Open Academy


    ![](img/45a70445846e93838a23812ca8a9d98d_9_0.png)


    # Ties learning to real-world open source projects


    Social networking giant Facebook has announced an expansion of its Open Academy
    programme, which seeks to educate open source as a means of bridging the gap between
    real-world coding projects and the dreary world of academic computer science.


    Launched in spring 2012 as a trial partnership between the social networking company
    and Stanford University''s Jay Berenstein, the programme has already expanded
    with recent announcement confirming total of 22 academic members: Stanford University,
    MIT, the University of Texas at Austin, Cornell University, University of Toronto,
    Waterloo University, University of Singapore, University of Tokyo, Imperial College,
    Jagellonian University, University of Helsinki, Tampere University of Technology,
    UC San Diego, Columbia University of Pennsylvania, UC Berkeley, University of
    Warsaw, UUC, UCLA


    +   Imperial College is one of 22 establishments signed up to Facebook''s Open
    Academy


    ![](img/45a70445846e93838a23812ca8a9d98d_9_1.png)


    “Contributing to open source projects is one of the best ways a student can prepare
    for a job in industry,” a Facebook spokesperson said at the announcement.


    Software development has as much aspects of computer science as an academic subject.
    Projects are often larger than the people who participate in them; project management
    and interpersonal skills matter much software design as technical issues; and
    are usually evaluated by users from diverse backgrounds.


    The programme pairs teams of students with mentors from selected open source projects,
    flying to Facebook''s headquarters for a three-day kick-off event before returning
    home for the work to begin. Previous projects benefiting


    from the programme include Ruby on Rails, the Mozilla Open Extension, MongoDB,
    Pouch DB, Review Board, Socket, Kit, Freaser, and Preacher.


    Facebook supports their teams by helping students find and review code contributions,”
    the spokesperson said. “The programme also meets with student teams at regular
    intervals to review progress.


    Instructors overlay a lecture series to provide further learning opportunities
    to students.


    “The program works closely with key members at top CS universities to launch a
    course that matches students with open source projects and mentors and allows
    them to


    Facebook is a high-profile user of and contributor to the open world. In addition
    to hosting platforms for open source projects, the company has many of its internal
    tools under permissive licenses, including MapReduce scheduler, Presto and Hive
    development platform.


    The 2012 cohort will start in early February, with interested students being asked
    to apply for the programme through facebook.com/OpenAcademyProgram page. Faculty
    are also invited to discuss new approaches to improving computer science curricula
    in general.


    linuxuser.co.uk'
