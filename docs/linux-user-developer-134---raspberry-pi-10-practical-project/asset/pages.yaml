    The successor to KOOffice and KPresenter, Calligra Stage is the most direct rival
    to Impress


    The run-up in our office suite group test (#120) is very impressive, although
    it lacks the same level of community support and popularity as LibreOffice. Calligra
    is the presentation software bundled with the suite, and is a decent desktop application
    in the vein of PowerPoint. Starting Up Stage, you''ll notice it begin with clutter.
    The main interface is just filled with functions that don''t quite work unless
    you''re on a 1080p or higher monitor. Then there''s a lot on the screen to deal
    with, leaving room for the preview of the activity. The interface is sensitive
