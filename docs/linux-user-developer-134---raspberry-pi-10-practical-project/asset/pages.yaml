  md: "# # Create a three-colour LED\n\nthe colours should change. If the pots are\
    \ adjusting the wrong\ncolours, just swap them. If you use a tape-ball or\nplastic\
    \ mug to diffuse the light to get effect.\n\n> You'll\nlearn...\n\n![](img/45a70445846e93838a23812ca8a9d98d_36_0.png)\n\
    \n# 04 Setting up the pins\n\nAs we demonstrated in the last project, it's easy\
    \ to name\nand set the Arduino pins with Nanpy - in our code we used\ntwo simple\
    \ for loops to do the job. The debug value simple\nprint the values of each pot\
    \ to the terminal - very useful for\ndebugging getting things right in the code.\n\
    \n# 1 Analogue\n\nIt's possible to\nuse analogue pins on\nRaspberry Pi by using\n\
    analog-to-digital\nADC chips, but they\nare much more\ndifficult than\non an\n\
    Arduino Uno.\n\n# 02 Populate the breadboard\n\nThe circuit for this project might\
    \ look a little complicated\nat first glance, but there's really very going on.\
    \ As you\nwant, to control the LED using PWM-enabled\npins then simple control\
    \ of the Arduino and the\npentiometers (pots are being read by the analogue pins).\n\
    \n# 05 Functional operation\n\nThere are only three functions left, which we wrote\n\
    with self-explanatory names. First, get_pots reads the\nanogue pin value with\
    \ each pot and returns an array. This\nis used by the (colour_mixing) function\
    \ to assign values to each of\nassigned pins to change the colours of the LED.\n\
    \n# 2 Comment your code!\n\nWe're tried to add some\nfor commenting\nthis project.\
    \ We'll use\nto make clear\nassignments and\nquoted comments within\n\n# 03 Connect\
    \ the Arduino and Raspberry Pi\n\nAssuming you don't plan to write the code\n\
    immediately, you can get it from the disc or just\ndrop to your home folder. Use\
    \ the USB cable from\nt Arduino to the Raspberry Pi, you simply need to\nrun the\
    \ code with the following:\n\n```\npython RGB_Mix.py\n```\n\n# Full code list\n\
    \n```\n#!usr/bin/env python\nfrom numpy import\nfrom time import sleep\n\n# set\
    \ LED pins - these go to the\n# pins of your Arduino\nred = 0\ngreen = 6\nblue\
    \ = 9\n\n# set pot pins - these go to the\n# (Analogue pins of your Arduino\n\
    pot_red = 0\npot_green = 3\npot_blue = 5\n\n# set coloured as puts\nfor in (red,\
    \ green, blue):\n    Arduino.mode(pins, Arduino.OUTPUT)\n\n# set pot pins as inputs\n\
    for in (pot_red, pot_green, pot_blue):\n    Arduino.mode(pins, Arduino.INPUT)\n\
    \n# prints values to the terminal when\ndebug = False\ndef get_pots():\n    Grab\
    \ a reading from each of the pots and\nsend it to a tuple to be read by the colour\
    \ mixer\n    r = Arduino.analogRead(pot_red) / 4\n    Arduino.delay(1)\ng = Arduino.analogRead(pot_green)\
    \ / 4\n    Arduino.delay(1)\nb = Arduino.analogRead(pot_blue) / 4\n    Arduino.delay(1)\n\
    \    return r, g, b\n```\n\n```\ndef colour_mixing():\n    get_pots()\n    set\
    \ the colour pins accordingly\n    r, g, b = get_pots()\n    Arduino.analogwrite(red,\
    \ r)\n    Arduino.analogwrite(green, g)\n    Arduino.analogwrite(blue, b)\n  \
    \  Arduino.delay(1)\n```\n\n```\ndef close_pots():\n    close quit if it doesn't\
    \ work with a\nloop keep the pins initially initializing that way!\n    Arduino.analogwrite(red,\
    \ Arduino.LOW)\n    Arduino.analogwrite(green, Arduino.LOW)\n    Arduino.analogwrite(blue,\
    \ Arduino.LOW)\n```\n\n```\ndef main():\n    Mix the colours using other functions,\n\
    \    Ctrl+C closes up the pins and exits.\n    try:\n        print 'Adjust the\
    \ pots to change the colours'\n        while:\n            colour_mixing()\n \
    \           sleep(2)\n        if debug:\n            print 'Red: (%d) Green: (%d)'\n\
    \    except KeyboardInterrupt:\n        close_pots()\n        print 'Vpnins closed'\n\
    ```\n\n```\nif __name__ == '__main__':\n    main()\n```\n\n![](img/45a70445846e93838a23812ca8a9d98d_36_1.png)\n\
