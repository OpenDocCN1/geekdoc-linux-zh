  md: '# Review Presentation software group test


    # EWIPE


    A simple presentation application that does everything in blocks


    When we first looked at EWIPE, we were intrigued. Running on a Python base, EWIPE
    presents itself as a lightweight program that can be used to make presentations
    and CVs, while also being able to save as a HTML file. While this sounds all the
    promises, the application is marred by a number of issues that make it, frankly,
    unusable as a way to create slideshows.


    First, the interface and slideshow are only a 640x480 window. This may be an inconvenience
    for the main user interface if you''re creating the presentation, during which
    you will have only a small portion of the screen to use—especially if the display
    is from 1995.


    It''s a bit of a shame, that the method of constructing your presentation is so
    interesting. Blocks are created in sequence for what you want to say, and each
    can have two or three different types of text:


    # A number of issues makes it unusable as a way to create slideshows


    boxes, images and even GIFs. While EWIPE decided to use slideshow file format,
    it doesn''t allow you to alter the horizontal position or allow for two things
    to be by side; it''s a good idea to follow the flow of the presentation by stage.


    This is unfortunately another problem when it comes to images and they will run
    off with no image scaling or any way to scale image size within the tool. You''ll
    need to change image size in an external application, and then you''re still wrestling
    to fit items into such a small area.


    +   - There''s only a limited workspace to design your slideshow


    If you decide to create the basic presentation in EWIPE then elsewhere, there''s
    no way to do that. EWIPE saves to HTML and by its own file format, one that''s
    weird, but there is some way to make it into any order, not even its own HTML
    files, and that is the only option.


    EWIPE is basically a huge disappointment and not worth your time. The interface
    is a bit slow, but there are some good ideas; however, everything about the slideshow
    is unusable and unprofessional.


    ![](img/45a70445846e93838a23812ca8a9d98d_71_0.png)


    | SCORES | |

    |---|---|

    | Ease of use | 6 | It is sometimes just a little too simple |

    | Compatibility | 0 | It only works with its own own slideshow files, and there
    is no import option |

    | Aesthetics | 2 | It looks like it was designed in the early 90s and you can''t
    make it clean |

    | Features | 3 | The most advanced feature in EWIPE is its ability to animate
    any GIFs, even using LibreOffice. |

    | Overall | 3 | We like the way you build up the presentation with blocks, but
    it doesn''t make up for the lack of full screen and scaling


    The presentation is also limited, and does not have a full-screen option or smart
    scaling'
