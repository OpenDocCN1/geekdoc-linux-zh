    Facebook 扩大开放学院


    将学习与现实世界项目联系起来


    社交网络巨头 Facebook 宣布扩大其开放学院计划，该计划旨在弥合现实编码项目与学术计算机科学之间的差距。


    该计划于 2012 年春季作为社交网络公司与 Jay Berenstein 之间的试点合作伙伴关系启动，近期已随着学术成员加入扩大了规模：

    - 斯坦福大学

    - 麻省理工学院 (MIT)

    - 德克萨斯大学奥斯汀分校

    - 康奈尔大学

    - 多伦多大学

    - 新加坡大学

    - 东京

    - 帝国理工学院

    - 雅盖洛沃大学

    - 赫尔辛基大学

    - 坦佩勒理工大学

    - 加州大学圣地亚哥分校

    - 宾法尼亚大学

    - 加州大学伯克利分校

    - 华沙大学

    - 加州大学洛杉矶分校 (UCLA)


    “贡献开源项目是学生为行业工作准备的最佳方式之一，”Facebook 发言人在发布会上说。项目往往比参与的人大；项目管理和人际技巧至关重要，并且通常由来自不同背景的用户评估。


    Facebook 通过帮助学生寻找代码贡献来支持他们的团队。该计划还定期与学生团队见面，叠加系列讲座提供进一步的学习机会。该计划与顶尖大学的关键成员紧密合作，推出一项课程，将学生与开源导师匹配，并让他们回到家。


    除了为开源项目提供平台外，该公司还将其许多内部工具置于宽松许可下，包括 MapReduce 调度器、Presto 和 Hive 开发。2012 年的将于 2
    月初开始，感兴趣的学生被要求通过 facebook.com/OpenAcademy 页面申请该计划。教职员工也受邀讨论改进计算机科学课程的新方法。


    # 新闻

    Linux 社区动态


    ## 开源


    ## Web 开发

    ### Google 的 Dart 离开测试 JavaScript 运行时现已生产就绪


    在此版本发布中，作为 JavaScript 语言继任者的 Google Dart 已正式获得完全成熟、生产就绪语言语言。


    自我们首次宣布 Dart 以来的两年来，我们一直与早期采用者合作，使项目成熟并扩大社区，正如公司在发布会上描述的那样，被称为‘首席 Dart’。“Dart
    的使命是为 Web 开发者提供一个生产就绪的选项。”


    尽管 Dart 尚未在主流浏览器中获得广泛支持，但 Chrome 分支被用于 Dart 开发，该项目包含了用于兼容的 dart2js 翻译器。“生成的 JavaScript
    性能已经有了大幅提高，因为我们正看到更多地道的 Dart 案例。”


    “今天标志着 Dart 正式达到生产就绪状态，我们正看到更多地道的 Dart 案例。”“已添加。”此外，像 Adobe、drone 和 JetBrains
    等包也开始支持现在的 Dart 1.0 软件开发包——这包括 Dart 编辑器、Dart 浏览器、一个虚拟机、包管理器和 dart2js 翻译器——可以从
    dartlang.org 移除。


    ## Linux 日历


    ### 澳洲 Linux 会

    - 西澳大学，珀斯

    - 澳大利亚

    - linux.com.au

    - 2014 年社区年度会议涵盖从 Linux 内核和 OpenStack 到天文学和树莓派的所有演讲。


    ### 国际电子设备展 (CES)

    - 内华达州，拉斯维加斯

    - 美国

    - cesweb.org

    无疑是电子产品日历中最大的活动，CES 展示了由最新开源技术驱动的大量硬件。


    ### 政府 ICT 2024

    - 伦敦 OI 会议中心

    - 英国

    - government-ict.co.uk

    涵盖政策和技术，已确认的演讲者包括 ICT Futures 的 Mark Thompson 博士、CES 技术总监 Ian Levy 以及 John Jackson


    ## 认知计算

    ### IBM Watson 发布开发平台


    IBM 宣布开放基于云的开发平台，提供访问基于 Linux 的 Watson 问答计算技术，该技术首次在进入《危险回答》游戏并获胜时引起公众关注。


    当我们向世界分享 IBM Watson 的认知能力时，我们的目标是推动一个加速创新、研究和企业发展的的新生态系统，”IBM 软件解决方案集团副总裁 Michael
    Rhodin 在发布会上声称。“通过此，IBM 正在迈出勇敢的一步，共同推动认知计算的新时代演进。”


    IBM Watson 的‘认知计算机’可以运行在单台基于 Linux 的 Power 750 服务器上，通过我们的合作伙伴关系，我们将帮助扩展那些从经验中学习、随着每次互动和结果不断改进、并协助解决行业和社会面临的最复杂问题的应用程序。


    ## Linux 用户与开发者

