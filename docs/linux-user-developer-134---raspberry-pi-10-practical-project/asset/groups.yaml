    # SUSE 2013 大会报告


    ![](img/45a70445846e93838a23812ca8a9d98d_65_0.png)


    我认为 Rackspace 采取了完全正确的做法，为像我们这样的 OpenStack 基金会创造了参与机会。我们受邀请作为创始成员加入了其中。


    在可能的情况下，该公司正确保自己能够成为优秀的合作伙伴，以推动其业务发展。正如 Bruckmann 所说，SUSE 拥有“广阔的愿景，致力于通过建立合作伙伴关系来实现超越我们自身所实现的成就”。


    # 公告


    SUSE 在 SUCon 上宣布了重大的新功能和项目……


    - **SUSE Solidriver 程序**

    让 SUSE 的 Linux 驱动程序回归，确保了驱动程序经过了兼容性测试。其核心理念是让合作伙伴和用户创建模块或驱动程序，在无需大量测试的情况下即可与他们的系统兼容。我们一直努力确保内核驱动的稳定性。合作伙伴已经建立了一套流程，我们共同协作为
    SUSE Linux Enterprise 启用真正可靠的产品和功能。


    结果是，SUSE 正与 OpenStack 进行更多、更紧密的合作，并计划明年与 SUSE Cloud 共同每月发布计划。这只是云解决方案的一部分，因此 SUSE
    团队正在对其大魔术，缩短高达 20-30 分钟的时间。


    “OpenStack 非常强大，”Bruckmann 补充道，“否则，它并不直直观易于理解。但我们相信这是我们可以利用的价值之一。”


    > 我们深信 OpenStack 是功能支持和性能支持方面最强大的项目。因此，我们知道 SUSE Cloud 的正确选择。


    技术展会上的许多展出者都是 SUSE 的合作伙伴——HP、SAP HANA 以及 SAP America，其他行业也展示了他们基于 SUSE 的解决方案、技术，以及我们行业中大多数其他产品的优秀主机。同时，Bruckmann
    跟着 Hans Christian（全球负责人），他为 SAP America 展示了数据和 HANA 平台，大部分 SAP 和 IBM Linux 系统运行在
    SUSE 上。


    - **SUSE 分布式存储**

    SUSE 将于明年底推出新的分布式存储解决方案。该方案将基于 Ceph，这是一种软件已用于 SUSE Cloud 产品中。显然，它将出现在 SUSE Linux
    Enterprise 中。Ceph 提供了客户寻求的灵活性和多功能性。


    SUSE 以及其他伙伴关系都运作良好。对于 SAP 而言，SUSE 弥补了 SAP 和 HANA 之间的差距，创造了一个统一的产品——这是一个不可或缺的结果，使得这种合作更加丰厚，并减少了像与微软合作那样的争议。


    这是一项具有高潜力的技术，与 OpenStack 平台集成，并作为 SUSE Cloud 的一部分提供。


    # 合作伙伴


    SUSE 是一家业务公司，无法回避这一点。尽管它支持社区：


    - **适用于 Microsoft System Center 的 SUSE Manager Pack**

    SUSE 与微软有着合作关系，客户在包含 Linux 和 Windows 的异构环境中需要这种关系。为了进一步适应这种需求，“现在有一个 Microsoft
    System Center 插件可以管理许多不同单元的方面，让管理员可以将精力集中在许多不同的组织上，”简介中写道——在会议上与 SUSE 交流后，他们对未来感到更加乐观，因为这种互操作性可以引导客户选择
    SUSE 作为其 Linux 解决方案。


    # 黑客星球 (HACK PLANET)


    # SUSE 的黑客周是技术创新的的一周


    当 Ralf Raifa 没有领导工程团队和三级支持时，他正在组织 SUSE 黑客活动。这项年度活动是一周的时间，期间适用常规规则，但团队和个人可以完全自由地做他们想做的任何事情。


    产品的初始想法或创新源于黑客流（hackerflow）。Yaast Linux & Developer 的形成就是一个黑客项目，因此在最后的一周创建了许多产品，有些在活动结束后仍在继续。


    这是一个非常鼓舞的氛围，工程师们聚集在一起完成了 Flat。


    ![](img/45a70445846e93838a23812ca8a9d98d_65.png) 这里的黑客周是技术创新的的一周（此处为原文重复，此处翻译逻辑一致）


    ![](img/45a70445846e93838a23812ca8a9d98d_65.png) 这里的这只是云解决方案的一部分，因此 SUSE 团队正在对其大大魔术，缩短高达
