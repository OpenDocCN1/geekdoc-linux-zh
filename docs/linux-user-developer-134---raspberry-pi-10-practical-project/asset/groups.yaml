    ## 12 Edit the client configuration


    Open client.conf in a text editor. Change `remote` to the IP address of the server.
    For now, use ifconfig. Later, you can run tun. Then you will be able to connect
    from the internet. Change the cert to ca.crt, certify the server to client.crt,
