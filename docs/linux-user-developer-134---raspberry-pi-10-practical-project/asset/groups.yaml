    ## Mr Roboto


    I read the Raspberry Pi article sometimes, then found my brain planning system
    plays progressively lower to indicate objects at different ranges. I planned to
    use frequency oscillator (described code) to provide notes and video to feed earphones
    to create a picture of an area. I also selected with a range of over fifty meters
    and underwater. However, I did not plan on the repetition rate of 10Hz and a choppy
    echo is way beyond my skill. Pivoting back and forth by heart-shaped cam and forcing
    the left and right is child''s play, but two or three 100ms is too fast for me.
    The principal is really simple and, I believe, life-saver for many people. I learned
    Linux years ago; they programmable devices many years later & do not wish to start
    again. But if I think it is possible to convert the echoes to tones to detect
    obstacles ahead


    ## X-GNOME


    Debian is temporarily leaving out the desktop environment in favour of Xfce. While
    this may still be switched back, is an easy change for any Linux user, there were
    some Gnomes when we broke the news. In our conversation: http://bit.ly/


    JayBee said:

    Gnome developed too quickly, as does KDE. The glitchy, slow then reports from
    users using hardware. Xfce is much slower to develop, producing a stability that
    the two can''t produce. I''m hoping Debian (and its plethora of clones, forks
    and reworked shells) switches with Xfce. If KDE or GNOME made enough, they catch
    up.


    forthrust said:

    GNOME is a truly terrifying experience, switching horribly to Xfce after having
    Weasley, I still have nightmares and suffering from PTSD.


    Cumhur said:

    "Default" has no meaning in the world of Linux, but it can be a very symbolic
    move that reflects the feelings of the community. Maybe GNOME will still be listening
    to the feedback that they seem to be ignoring.


    Does it really matter that Debian has dropped GNOME?


    Guest said:

    About time — finally!


    Gonzalo Velasco C said:

    Xfce is good and mature. GNOME is good, but the changes it''s received since 2.3
    are too unstable and easy to argue against for a laptop device. Don''t blame Debian!
    There are still other distros using gnome.


    This is one of the responses we got to the robot feature from last issue with
    a great deal on how to expand the functionality of the robot which could be useful
    for some people day-to-day. As well as these letters like Dawn Robotics sold out
    of parts for the robot after the issue was published.


    As for Fred here, if you have any ideas, you can get in touch with us at our usual
    address and we will get you in contact. Otherwise, there''s a great community
    developing on blog post for the release of issue 132, and you can get more help
    and tips there.


    ## Friend or foe?


    With what we are currently experiencing, Microsoft and Linux open source communities.
    And more I''m hearing here about things in how they work with open source. They
    didn''t start an open source company recently at all. Well they are finally embracing
    the ''enmity'' for so long, and now Linux''s distros on Azure are. And maybe they''ll
    go open source themselves in the future?


    Jeremy


    In the past so long, Microsoft has become one of the ten businesses that contributed
    to the Linux kernel. As this figure has been met with disbelief - in fact, it
    was when it was announced. However, it seems, Microsoft is working a lot more
    with some Linux and open source clouds such as SUSE and Red Hat. The maximum Cinnamon
    is ready for the world, and hasn''t lost anything in the process using Linux in
    the data centre alongside Microsoft solutions. In the partnership: Microsoft is
    part of one of the best relationships with Redmond. We don''t really believe Microsoft
    will ever go fully Linux, but the firm is interesting more and more.


    KDE, if the right packages are installed. As for the stability issues, Cinnamon
    2 is absolutely fine, so there''s no to worry about that. If you want to know
    more about Linux Mint, you can check the review we starting on page 76 of this
    issue or any other concerns.


    Yours sincerely,


    Fred Anderson

