    \n### TrueCrypt 将进行代码审计\n隐私担忧引发众筹活动\n\n广受欢迎的开源加密应用 TrueCrypt 它可以创建加密文件的“容器”，或可用于全盘加密。在近期出现安全漏洞后，它将进行一项由志愿者驱动的众筹代码审计。\n\
    \n有报道称美国国家安全局（NSA）在大多数流行的加密应用中植入了后门，这导致了信任危机，TrueCrypt 需要通过全面且坦诚的代码审计来重新构建。“TrueCrypt\
    \ 可以用，”马修·格林（Matthew Green）说道，“人们用它处理非常敏感的信息。TrueCrypt 安全了个人信息（加密）。”布鲁斯·施奈德（Bruce\
    \ Schneider）在泄露 NSA 文件后，甚至使用它来存储其个人离网超级电脑上的信息。\n\n![](img/45a70445846e93838a23812ca8a9d98d_11_0.png)\n\
    \n- 热门开源加密包 TrueCrypt 将接受全面审计\n\n该审计当时已收到来自 FundIt 和 Indiegible 提供的超过 60,000 美元的资金，并将认证并消除二进制文件中的后门和损坏。该项目预计于\
    \ 2014 年初完成。\n\n## 在线\n\n### GIMP 放弃 SourceForge\n\n由于 SourceForge 决定允许开发者在其下载包中构建广告程序，并声称进行创意性广告（这是在该平台被\
    \ Dice 收购后引入的特性），GIMP 不得离开免费托管。\n\n- “我们不希望支持这种行为，”该项目发言人说，“我们已决定放弃 SourceForge”\n\
    \n软件包现在将由维护者 Jeremy Simonc 直接更新到官方 FTP 站点，并自动分发到各个站点。\n\n## 杂志\n\n### 欢迎来到动物世界\n\
    由《如何运作》、《全空间》和《一切历史》的创作者们带来了全新的《动物世界》（World of Animals）杂志\n\n开源世界拥有企鹅、壁蜥、变色龙以及构成\
    \ Ubuntu 版本的各种奇怪动物。我们这些毛茸茸、长着羽毛和鳞片的朋友都有代号，而且它们都有极佳的故事要讲述。\n\n走进《动物世界》，这是我们与星球共享的所有非人类生命的新杂志。第一期主题为“自然优先”（Nature\
    \ First），讲述了大猩猩、狐猴以及 50 种最濒危物种的故事，并让我们窥了帝鹅的一年。\n\n如需在官方网站订阅杂志，请访问 Animals.co.uk，您今天就可以通过\
    \ Image Shop 购买来确保获得订阅。\n世界充满了动物；关于它们还能学到什么？\n\n![](img/45a70445846e93838a23812ca8a9d98d_11_1.png)\n\
    \n在 Twitter 上关注 @worldanimals 并在 Facebook 上点赞 World of Animals 以直接获取动物群类知识。你还有机会\n\
    \n![](img/45a70445846e93838a23812ca8a9d98d_11_2.png)\n\n- 真正的企鹅在不支持 Linux 时在做什么？\n\
