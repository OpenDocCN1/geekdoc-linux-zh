    - 16 观点 你的看法\n- 52 绘图 带来 2D 和 3D 功能\n- 83 书籍 关注开源软件（FOSS）的未来\n- 56 配置文件你的代码 了解\
    \ grep 如何帮助\n- 92 读者来信 你的问题解答\n- 60 使用 Qt 编写代码 学习事件驱动编程\n- 64 SUSECon 2013 来自\
    \ SUSE 年度盛会的最新消息\n- 96 订阅今日 至少节省 30% 订阅价格\n- 82 关注我们的页面 订阅 Linux\n- Linux Mint\
