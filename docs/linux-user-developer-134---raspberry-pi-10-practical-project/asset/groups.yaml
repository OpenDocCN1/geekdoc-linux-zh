    # SECURITY


    # TrueCrypt to undergo code audit


    Privacy fears drive crowdfunding campaign


    Popular open source encryption application TrueCrypt, which creates ''containers''
    of encrypted files or be used for whole-disk encryption, is to undergo a crowdfunded
    volunteer-driven code audit in the wake of recent security vulnerabilities.


    Reports that the US National Security Agency (NSA) has inserted back-doors into
    the majority of popular encryption applications has caused a loss of confidence,
    that TrueCrypt needs to be rebuilt with a full and frank code audit. "TrueCrypt
    works," says Matthew Green. People use it for very sensitive information. TrueCrypt
    secures personal information (cryptography)." Bruce Schneider is even using it
    to store information on his personal air-gapped super-laptop, after he leaked
    NSA documents.


    ![](img/45a70445846e93838a23812ca8a9d98d_11_0.png)


    +   - Popular open source cryptography package TrueCrypt to be given a full audit


    The audit, which at the time has already received over $60,000 in funding from
    FundIt and Indiegible, will certify and eliminate binaries from back-doors and
    corruption. The project is expected to be completed by early 2014.


