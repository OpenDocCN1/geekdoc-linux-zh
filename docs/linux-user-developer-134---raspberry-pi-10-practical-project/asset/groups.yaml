    \ Most Qt widgets emit a wide variety of events. They can be handled in order\
    \ to create the small application which classes can handle as as few events as\
    \ you see fit.\n\nWe will see that the framework imposes very few limitations\
    \ in this regard.\n\nsignal and slot manager. In an event, the framework routes\
    \ signals to one or more slots which process them.\n\nIn the real world, routing\
    \ events takes on an interesting basis. If a party later wants to make an event,\
    \ it emits it. Other parties may also hear it. However, they may ignore it if\
    \ it is not of interest to them.\n\nQt mirrors this in the registration process:\
    \ it checks if any slots have registered in it. Notifications are dispatched to\
    \ those objects.\n\nOur Qt-based framework will constrain itself to dealing with\
    \ four bands. This provides us with a total of four and one outgoing events. QObject-derived\
    \ classes are automatically integrated into the signal-slot framework - the header\
    \ of ResistorCalcClass looks as follows:\n\n```cpp\nclass ResistorCalc: QObject\
    \ {\n    Q_OBJECT\n\npublic:\n    ResistorCalc();\n\npublic slots:\n    void valueChanged(int\
    \ to_max);\n\nsignals:\n    void newValue(int new_value);\n\nprivate:\n    void\
    \ recalculateValue();\n    int my1;\n    int my2;\n    int my3;\n};\n```\n\n###\
    \ Declaring signals and slots\n\n```cpp\nvoid ResistorCalc::ringChanged(int _index)\
    \ {\n    int m2=_index;\n    calculateValue();\n}\n```\n\n### Implementing signals\
    \ and slots\n\nNow let's look at the function. Our examples use a switch for some\
    \ inputs:\n\n```cpp\nvoid ResistorCalc::calculateValue() {\n    float retval;\n\
    \    int mVal=m2;\n    switch(mVal) {\n        case 0:\n            retval=-1;\n\
    \            break;\n        case 1:\n            retval=10;\n            break;\n\
    \        default:\n            emit newValue(\"Multiplier\");\n            break;\n\
    \    }\n    emit newValue(String(retval));\n}\n```\n\n### Creating a QtGui interface\n\
    \nNow let's create the user interface. Double-click on mainwindow.ui to open it\
    \ in the editor\n\n- Four lists and a button are needed\n\n- Connect the slots\
    \ with your newly created slot\n\n- Adjust the borders of the form to achieve\
    \ a decent size. Use the tool under the left sides to create a group of controls:\
    \ drag Item-List Widgets and a Button onto the form.\n\n- Adjust the positions\
    \ in the bottom-right dialog to create a user interface slot.\n\n- From the relative\
    \ position of the editing, you can double-click the mainui file provided on the\
    \ disc to take the item name and button position.\n\n- Qt Creator provides a special\
    \ tool for editing the list contents. It can be accessed by right-clicking the\
    \ list, then Edit Items in up dialog.\n\n### Connecting stuff\n\nWith that, it\
    \ is to connect the Qt with the engine. The slots you created in the editor must\
    \ be integrated into the mainform class with corresponding signals.\n"
  mdcn: "\n\n# 教程\n\n## 使用 Qt 进行事件驱动编程\nLinuxDeveloper\n\n![](img/45a70445846e93838a23812ca8a9d98d_59_0.png)\n\
    \n# 使用 Qt 进行事件驱动编程\n\n保持程序组件分离可以简化测试。只需少少精力，即可享受事件驱动编程带来的优势。\n\n你是否曾经想过重用程序的一部分，却发现自己受限于各种现有的代码？你是否曾需要以一种不对算法依赖于\
    \ Qt 工具包的方式处理输入？\n\n因为信号槽系统（signal-slot system）而部署 Qt。这种荣誉是实之其实的；很难找到一个框架无法处理的案例。Qt\
    \ 以降低复杂度而闻名，而槽（slots）用于与 Qt GUI 类提供的控件进行交互。最后，大多数模块都将自己集成到信号槽系统中。\n\n信号槽系统允许你使用类似事件的范式将应用程序组件相互连接；信号被发射到框架的槽中。\n\
    \n简而言之，如果你想使用 Qt，你就需要熟悉信号发射（signals emits）。\n\n大多数计算机科学问题可以通过示例来理解。在接下来，我们将创建一个小型应用程序来分析其他电阻器（其值是一系列环环）。它将使用一个通过接收和发射信号进行通信的计算引擎。\n\
    \n在现实生活中，事件是任何发生的情况：俱乐部的开放、飞机的起飞或一个好主意。在计算机中，可以构建类似的定义事件。\n\n传统上，创建事件是一项巨大的工程。许多开发者选择过……\n\
    \n在处理 Qt 时，事件是类决定与外部世界共享的任何内容。大多数 Qt 控件都会发射各种事件。可以按照顺序处理这些事件，以创建一个小型应用程序，类可以根据你的需要以尽可能少的事件来处理这些事件。\n\
    \n# 顾问\n\nTam Hanna 从 Palm Inc. 时代起就开始从事 IT 行业了。作为一名记者、演讲者和书籍作者，他多次见证移动市场的每一个方面。\n\
    \n# 资源\n\n延伸阅读：\n\n- [http://qt-project.org/wiki/Qt5_index/signals_and_slots](http://qt-project.org/wiki/Qt5_index/signals_and_slots)\n\
    - [http://qt-project.org/doc/qt-5.0/qtgui/signals_and_slots.html](http://qt-project.org/doc/qt-5.0/qtgui/signals_and_slots.html)\n\
    - [http://qt-project.org/doc/qt-5.1/qtdoc/qtgui-index.html](http://qt-project.org/doc/qt-5.1/qtdoc/qtgui-index.html)\n\
    \nQt 还包括：\n\n- [http://qt-project.org/doc/qt-5.1/qtdoc/qtcharts-index.html](http://qt-project.org/doc/qt-5.1/qtdoc/qtcharts-index.html)\n\
    \nQML 简介：\n\n- [http://qt-project.org/doc/qt-5.1/qtdoc/qml-index.html](http://qt-project.org/doc/qt-5.1/qtdoc/qml-index.html)\n\
    \n![](img/45a70445846e93838a23812ca8a9d98d_59_1.png)\n\n> 启动后，Qt Creator 显示一个带有一些入门说明的“状态窗格”\n\
    \n- 需要四个列表和一个按钮\n\n60 www.linuxuser.com\n\n# 使用 Qt 进行事件驱动编程\n\n使用信号和槽创建一个电阻计算器\n\
