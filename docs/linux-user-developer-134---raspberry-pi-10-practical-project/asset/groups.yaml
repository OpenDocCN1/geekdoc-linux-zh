    ## EDUCATION

    Facebook broadens Open Academy


    Ties learning to real-world projects


    Social networking giant Facebook has announced an expansion of its Open Academy
    programme, which seeks to bridge the gap between real-world coding projects and
    academic computer science.


    Launched in spring 2012 as a trial partnership between the social networking company
    and Jay Berenstein, the programme has already expanded with recent academic members:

    - Stanford University

    - MIT

    - University of Texas at Austin

    - Cornell University

    - University of Toronto

    - University of Singapore

    - University of Tokyo

    - Imperial College

    - Jagellonian University

    - University of Helsinki

    - Tampere University of Technology

    - UC San Diego

    - University of Pennsylvania

    - UC Berkeley

    - University of Warsaw

    - UCLA


    “Contributing to open source projects is one of the best ways a student can prepare
    for a job in industry,” a Facebook spokesperson said at the announcement. Projects
    are often larger than the people who participate in them; project management and
    interpersonal skills matter and are usually evaluated by users from diverse backgrounds.


    Facebook supports their teams by helping students find code contributions. The
    programme also meets with student teams at regular intervals to overlay a lecture
    series to provide further learning opportunities. The program works closely with
    key members at top universities to launch a course that matches students with
    open source mentors and allows them to return home.


    In addition to hosting platforms for open source projects, the company has many
    of its internal tools under permissive licenses, including MapReduce scheduler,
    Presto and Hive development. The 2012 cohort will start in early February, with
    interested students being asked to apply for the programme through facebook.com/OpenAcademy
    page. Faculty are also invited to discuss new approaches to improving computer
    science curricula in general.


