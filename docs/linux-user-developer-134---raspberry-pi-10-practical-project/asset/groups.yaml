    在我看来，你应该能够用中键拖动标签栏——但现在当我点击标题栏时，窗口会移动到其他窗口后面。我猜至少它识别了点击。不过，它并没有允许我拖动窗口；当我用中键点击桌面时，它会展开带有工作区的菜单。这是
    Fluxbox 的正确行为。


    我特别建议在 Slack 版本中使用此标签页功能。你是否知道这与配置文件有关，还是说它被完全删除了？


    帮帮，我目前的 Fluxbox 配置如下：


    标签页位置：左上角

