    # 评测


    ## Securstore


    Securstore 支持多种备份目标。提供多种压缩类型以减少您的月度费用。


    ![](img/45a70445846e93838a23812ca8a9d98d_75_0.png)


    ## Securstore


    对于基于 Linux 的企业级用户，是否存在一种“一体化”的备份解决方案？Securstore 似乎认为是有的。


    Securstore 是当今许多专注于企业此类离线备份的公司之一，它提供位于英国或美国数据中心对的远程存储，其中一个处的内容会自动复制到另一个处——为您随时随地提供备份服务。


    Securstore 不仅仅让您自行应付，还采取了积极的支持方法：注册该服务后，您将有机会与公司的英国支持团队通话，他们将一步步引导您完成安装和配置过程。如果您更倾向于自学型学习者，也可以选择通过我们详细的在线教程自己完成。


    ## 缺点


    然而，该公司的软件原生体验并不尽理想，但对于云备份专家来说非常出色，使用该软件管理 Securstore 的 DS-Client 和 DS 软件很容易。由于
    Securstore 的软件追溯到 1998 年，存在一定的学习曲线。


    该软件存在缺陷，用户界面有时令人困惑，需要一些时间适应，但你会发现每个备份都可以来自本地文件系统、通过 SSH 和 NFS 的远程服务器、仅权限备份、MySQL、Postgres、Sparse、Oracle
    和 DB2 数据库、VMware 虚拟机，甚至用于灾难恢复的物理到虚拟服务器备份。


    安装软件非常简单；虽然是针对 Red Hat 和 SUSE 服务器设计的，但 DS-Client 可以管理在可以想象的任何 Linux 平台上——而这正是
    Securstore 展现其首次卓越之处的地方。


    - 符合标准，选项丰富

    - 卓越的支持

    - 过于耦合的平台软件

    - 有许多可选方案

    - 灵活的云端支持

    - 受带宽限制的类型


