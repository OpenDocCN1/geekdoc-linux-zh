    \n```\ngcc -Wall Sample.c -o Sample-code\ngcc Sample.o -o Sample-code\n```\n\n\
    如果编译和链接是在同一个命令中完成的，也需要添加此选项。例如：\n\n```\ngcc -Wall Sample.c -o Sample-code\n```\n\
    \n```\nfile gmon.out\ngmon.out: GNU profile performance data - version 1\n```\n\
    \n```\n// 本文全程使用的示例代码 (Sample.c):\n#include <stdio.h>\n\nint count;\nvoid func_c(void)\n\
    {\n    count++;\n}\nvoid func_a(void)\n{\n    int i = 10000000;\n    while (i--)\
    \ {\n        func_c();\n    }\n    return;\n}\n```\n\n> 注意 1：如果程序异常终止、由未处理的信号终止或通过\
    \ `exit()` 函数调用退出，则不会产生 `gmon.out` 文件。\n\n> 注意 2：该文件在程序退出时创建在程序的工作目录下。因此，请确保程序正常运行。\n\
    \n> 注意 3：性能分析程序会生成一个名为 `gmon.out` 的文件，请确保该文件存在且名称正确。\n\n## 02 执行二进制文件 - 部分 1\n\
    \n在程序编译（并链接）之后，下一步是执行它。需要重要的是，性能分析的执行方式应当确保所有代码（至少是你想要分析的代码）都已执行。因此，需要相应地为程序提供命令行参数和输入。\n\
    \n以下是如何分析可执行程序 \"Sample-code\" 方法：\n\n```\n/Sample\nCount = [100000000]\n```\n\
    \n因此你可以看到 \"Sample-code\" 执行并结束了。\n\n> 注意 4：执行 `gprof`。一旦性能分析数据文件可用，该工具即可用于分析并产生有意义的数据。这里是\
    \ `gprof` 命令的语法：\n\n## 03 执行二进制文件 - 部分 2\n\n程序执行后，它会生成一个名为 `gmon.out` 的文件。\n\n\
    ```\nismon.out\ngmon.out\n```\n\n```\ngprof [command-options] [executable-name]\
    \ [profiling-data-file] [output-file]\n```\n\ngprof 接受可执行文件名和命令行选项以生成性能分析信息，这些可以重定向到输出文件。\n\
    \n但注意，命令行工具本身不需要任何参数[它们不是强制性的]。当未提供参数时，gprof 会在当前目录中查找 `a` 作为可执行文件名，并将 `gmon.out`\
    \ 作为性能分析数据文件，输出将产生在标准输出 - stdout。\n\n让我们运行命令：\n\n```\ngprof sample gmon.out -o\
    \ prof_output\n```\n\n上面的命令将输出重定向到名为 `prof_output` 的文件。该文件现在将包含以平铺文件和图表形式呈现的可读性能分析信息（稍后详细介绍）。\n\
    \n![](img/45a70445846e93838a23812ca8a9d98d_56_1.png)\n\n本教程使用的环境基于 Ubuntu 13.04\
    \ 构建\n\n```c\nprintf(\"\\n Count = [%d]\\n\", count);\nreturn 0;\n```\n\n# 使用\
    \ gprof 对你的代码进行性能分析教程\n\n![](img/45a70445846e93838a23812ca8a9d98d_57_0.png)\n\n\
    索引位于括号中，它显示了如果打印，它出现在 gprof 列表中的位置。\n\n## 调用图\n\n调用图（见下方的屏幕）显示了每个函数调用了哪些函数以及其他函数，以及每个函数在每个函数的子程序中花费了多少次。这可以提示你可能尝试消除消耗大量时间的调用。\n\
    \n列表中的每个条目左侧都有索引号。垂直线及其下方的线列出了调用的函数。当前侧边栏列出了调用该函数及其子函数的函数。一行列出了：\n\n- index -\
    \ 分配给表中每个元素的索引。索引按数字排序。索引号打印在函数名旁边，方便查找函数在表中的位置。\n- %Time - 花费在该函数及其子函数中的时间百分比。请注意，由于视角不同，这些百分比之和不会等于\
    \ 100%。\n- %self - 花费在函数本身上的总时间。对于函数的父函数来说，这是运行周期最多的次数，在这里被简洁地陈述。平铺分析（Flat Profile）中的不同列代表：\n\
    \n- %Time - 程序运行时间中该函数占用的总运行时间的百分比。\n- cumulative - 该函数及上述列出的函数的秒数累计和。\n- self\
    \ - 仅该函数消耗的秒数。\n- calls - 该函数被调用的次数（如果它本身被分析了）。\n- name - 函数名。这显示了函数在 gprof 列表中的位置，如果\n\
    \n| index | %Time | self | children | calls | name |\n|---|---|---|---|---|---|\n\
    | 1 | 77.00 | 3.37 | 73.63 | 1 | main |\n| 2 | 14.50 | 0.51 | 14.00 | 5 | func_c\
    \ |\n| 3 | 14.50 | 0.51 | 14.00 | 5 | func_b |\n| 4 | 22.3 | 0.08 | 22.00 | 4\
    \ | parent |\n| 5 | 21.02 | 0.51 | 20.51 | 5 | func_a |\n\n![](img/45a70445846e93838a23812ca8a9d98d_57_1)\n\
    \n## 05 注释源代码\n\n注释源代码告诉我们函数被调用的次数。要获取注释源代码，请使用 `-g` 编译。首先使用 `-g` 选项启用调试：\n\n\
    ```\ngcc -g sample.c\n```\n\n接下来运行 `gprof` 命令，使用 `-o` 选项输出：\n\n## 06 平铺分析\n\n\
    平铺分析（见下方屏幕）显示了每个函数花费了多少时间以及被调用了多少次。如果你只想知道：\n\n```\ngprof sample -o flat\n```\n\
    \n## 07 调用图\n\n按函数名索引\n\n| index |\n| [4] | flat_dummy |\n| [2] | func_b |\n|\
    \ [3] | func_a |\n| [5] | func_c |\n\n## 08 排除特定函数\n\n识别程序代码中的瓶颈行。对于子函数，这是从父函数传递的。\n\
    \n- children - 花费在该函数及其子函数中的时间。对于父函数，这是传递到它的时间。\n- called - 该函数被调用的次数。如果是递归调用的，则只包含非递归调用。\n\
    - 对于父函数，这是传递到它的时间。对于子函数，这是传递到它的时间。\n- Name - 函数名。索引打印在函数名后面。如果函数名重载，则循环名打印在函数名和索引之间。\n\
    \n> 代码性能分析不仅有助于调试许多棘的问题，还能帮助程序员提高软件性能\n\n## 09 分析特定函数\n\n每次调用计为 0.01 秒。\n\n| index\
    \ | self | children | name | total |\n|---|---|---|---|---|\n| 1 | 1.00 | 0.00\
    \ | func_a [1] | main (2) |\n| 2 | 0.00 | 5.00 | func_c [3] | 5.00 |\n| 3 | 0.00\
    \ | 0.0000000000000000 | func_a [1] | 0.00 |\n| 4 | 0.00 | 0.0000000000000000\
    \ | func_b [4] | 0.00 |\n| 5 | 0.00 | 0.0000000000000000 | func_c [3] | 0.00 |\n\
    \n累计秒调用/调用\n\n粒度：每次命中覆盖 2(s) 占 1.30 秒的 0.77\n\n调用图\n\n## 10 抑制冗余信息\n\n默认情况下，gprof\
    \ 的输出包含平铺分析和图表中每一列的详细解释。这对于初学者很有帮助，但你可能想抑制已的细节。命令行选项 `-b`（或 `-brief`）可用于此目的。\n\
    \n"
