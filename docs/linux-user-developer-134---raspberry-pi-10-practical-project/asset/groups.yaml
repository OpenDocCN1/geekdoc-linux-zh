    # 开源


    您的 Linux 新闻与观点来源


    # JON MASTERS


    ## 内核专栏


    Jon Masters 总结了 Linux 内核社区的最新动态、3.13 合并窗口以及“下一代”Btrfs 中新的 Jailhouse 管理器离线去重。去重（Deduplication）正如其名：自动处理重复内容（在块级别仅存储一个副本）对应的数据，并更新所有对（共享）副本的引用。Btrfs
    中“离线”去重的特殊之处在于，它目前仅在系统管理员直接执行特殊命令时或按需执行。多年来将添加一个真正的定时去重功能，以及 Intel 的 ''powercap''
    驱动，该驱动允许系统管理员独立地最大化外围设备的功耗。3.13 引入了 Intel 功率限制功能（在其较新的设备中）。此外，现代系统中的对 32 位（遗留）BC
    PC 的支持也进行了大量清理工作，其中包含了 ARM 系统。此外，3.13 增加了对大端序（Big-Endian）的支持，这对于 PowerPC 64 位和
    32 位 ARM 系统是必需的。


    Jon Masters 是一位 Linux 内核黑客，从 13 岁进入大学起就开始从事相关工作。他住在马萨诸塞州的剑桥，在一家大型 Linux 供应商工作。他在
    kernelpodcast.com 发布每日列表。


    ### GPU 切换：在笔记本电脑上使用 Linux 是否更好更好


    许多现代笔记本电脑配备了多个 GPU（图形处理器）。这些芯片负责处理连接到屏幕或外部显示器上的帧缓冲区中的 3D 游戏。3.13 允许使用功耗优化的单元处理基础桌面和工作任务，而让强大的单元切换来处理大型
    3D 游戏序列中复杂的对象渲染。以前在 Linux 上需要手动重启才能进行切换，现在它消除了限制，并允许图形子系统按需动态工作。


    3.13 的新功能包括为 PowerPC 64 位和 32 位 ARM 系统提供对“大端序”（与 Intel 相反）。计算机需要理解这些呢？3.13 是多代版本中第一个支持双端序（能够在小端序和大端序之间切换）的版本。某些现代
    CPU 的设计是因为它们编码较不容易。尽管如此，得益于对 x86 和 ARM 架构的使用，Linux 要常见得多，但大端序在代码中仍然非常常见（网络字节序是大端序），并存在于架构和软件中。


    Linux Torvalds 宣布了 3.13 版本的发布，说他一直在纠结是结束还是仅仅切分 3.12。3.12 已经发布八个月了。自从他发布版本以来，已经休息了一周。3.13
    的传统合并窗口持续了一天。Linux 还让内核制作。


    # 3.13 合并窗口


    3.13 添加了一些新功能。3.13 中的突出特性包括新的 ''nftables'' 包过滤器，它最终将取代并已在此采用。


    # 开源


    ## 自动 GPU 切换将对那些在笔记本电脑上使用 Linux 的用户感兴趣，该功能将合并在启动新内核开发周期的“合并窗口”中。在 Linux 3.12 开发期间，某些计划进入
    3.13 的特性功能实际上显示出从 linux-next 进入内核主干的进展（同时合并回 3.7）。数据视觉上支持了这一点：Linux 3.12 中内核提交的
    82.4% 是直接通过 linux-next 宣布的。这些数字略有下降，这是典型的，因为在 3.12 合并窗口中为期一周的延迟中，很少有人利用这段时间。还有
    ABI Checker。因此，这种工具对 Linux 发行版无疑是有益的，因为发行版通常提供稳定内核，但允许在某些条件下加载扩展驱动程序。有关该工具的更多信息，您可以访问
    kernel.org。


    Joe Zhangwei 宣布了新的 Linux ''ktap'' 动态跟踪 0.3 版本发布。Bktap 是一种基于字节码的跟踪基础设施，为调试字节码提供框架，然后将其加载到内核中，使用特定的工具链（编译器）对内核模块进行动态插桩和跟踪，它不需要特殊的内核。


    # Linux 4.0


    在 3.12 之后，Linus 已经休息了八个月。自从他发布版本以来，已经休息了一周。3.13 的传统合并窗口持续了一天。Linux 还让内核制作。3.13
    添加了一些新功能。3.13 中的突出特性包括新的 ''nftables'' 包过滤器，它最终将取代并已在此采用。


    # 观点

    内核专栏 - Jon Masters


