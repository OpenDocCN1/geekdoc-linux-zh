    ## FAQ: Get started with a Raspberry Pi


    Q: How do I install a distro to Raspberry Pi?

    A: There are two methods you can use, the most basic of which is downloading the
    New Out Of Box Software (which unfortunately works for beginners) and unpacking
    the files directly onto a formatted SD card. Once installed, it will guide you
    through an initial process, which distributions to use.


    Alternatively, if you have an image you want to install, open the terminal and
    use move to get to the location of the unpacked image. For example, type:


    ```

    $ dd if=$(image img of "/dev/SD-card location")

    ```


    This will write the image to the SD card, and you will know once it''s done.


    Q: How do I update the firmware?

    A: While Raspberry, you can update it by installing the package rpi-update.


    ```

    $ sudo apt-get install rpi-update

    ```


    And then run it with:


    ```

    $ sudo rpi-update

    ```


    Q: How do I activate the camera?

    A: Open the terminal and


    ```

    $ raspi-config

    ```


    Find the Camera option in the menu and click on it. Go to Enable, press Enter
    and then Finish with a reboot.


