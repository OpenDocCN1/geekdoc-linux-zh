    ### Math does not equal calculating

    Computer-based mathematics (CBM) is based on the concept that mathematical languages,
    with numerical calculations by hand, have no life. Now that computers are available
    everywhere and to teach children CBM, the curriculum that teaches figures in more
    than an abstract approach allows more advanced mathematics in a more understandable
    context.


