    \ the new dpkg:\n\n```bash\ndpkg --get-selections < selections.txt\n```\n\nAnd\
    \ finally:\n\nThis should install all the packages back on your system. You can\
    \ check our previous post for a guide to installing and dual-booting distro on\
    \ an external hard drive.\n\n## Good fortune\n\nThought I had a bit of fun with\
