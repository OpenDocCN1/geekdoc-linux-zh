- md: "\n## Tutorial 10 Practical Raspberry Pi Projects\n\n## Program Minecraft-Pi\n\
    \nRussell Barnes is the editor of Linux User & Developer magazine and has been\
    \ a technology writer for over 15 years. Now three Raspberry Pis\n\n## Learn to\
    \ program while playing one of the greatest games ever made!\n\n## What you'll\
    \ need\n\n- Raspberry (latest release)\n- Minecraft-Pi tarball\n- Keyboard & mouse\n\
    - Internet connection\n\nMinecraft is probably the biggest game on the planet\
    \ right now, it's available on any format you can imagine, from PCs to consoles\
    \ to mobile phones. It should probably come no surprise that it's available on\
    \ the Raspberry Pi. At first glance Minecraft-Pi is a simplified version of the\
    \ Pocket Edition for consoles and smartphones, the Raspberry Pi edition is very\
    \ special, in that it's the only version of Minecraft to give users access to\
    \ its API (application programming interface).\n\n## Download PI Edition now!\n\
    \nPosted on December 25, 2012\n\n![](img/45a70445846e93838a23812ca8a9d98d_25_0.png)\n\
    \nThis first release of Minecraft: PI Edition to follow now! And it's completely\
    \ free to download. We're adding new features in due course, but though you guys\
    \ would appreciate us getting out of your way\n\nIn this project we're going to\
    \ show you how to set up Minecraft-Pi and configure it so you can interact with\
    \ Minecraft in a way you've never done before. This small project is just the\
    \ tip of the iceberg...\n\n## 01 Requirements\n\nMinecraft-Pi requires you to\
    \ be running Rasp on your Raspberry Pi, so if you're not already running that,\
    \ take a trip to the shop and get it up. It also requires you to have Windows\
    \ loaded too. Assuming you're at the command prompt, you just need to type start\
    \ to reach the desktop.\n\n![](img/45a70445846e93838a23812ca8a9d98d_25_1.png)\n\
    \nUnlike all other versions of Minecraft, the Pi version encourages you to hack\
    \ it\n\n## Program Minecraft-Pi\n\n## Installation\n\nMake sure you're already\
    \ in your home folder to download the Minecraft-Pi package with the following\
    \ commands in a terminal:\n-assets/minecraft.pi\n\n```\ncd\npip install https://3.amazonaws.com/assets/minecraft.pi\n\
    ```\n\nTo use it you need to copy the following folder to your Minecraft-Pi directory:\n\
    - tar -zvf minecraft-pi-0.1.1.tar\nNow you can move into the Minecraft-Pi directory\
    \ and try running it for the first time:\n\n```\n./minecraft-pi\n```\n\n## Full\
    \ code listing\n\n```python\n# /usr/bin/env python\nfrom cmpi.minecraft import\
    \ Minecraft\nfrom cmpi.block import block\nfrom cmpi.vec3 import Vec3\nfrom time\
    \ import sleep\nimport random\nimport math\n\nmc = Minecraft() # make a connection\
    \ to the game window\nplayer = mc.getPlayerPos()\n\n# function to generate random\
    \ floats to position inside the player\ndef randvec3(center):\n    return Vec3(random(center.x),\
    \ random(center.y), random(center.z))\n\n# function to calculate distance between\
    \ points\ndef distance(point1,point2):\n    dx = point1.x - point2.x\n    dy =\
    \ point1.y - point2.y\n    dz = point1.z - point2.z\n    return math.sqrt(dx*dx\
    \ + dy*dy + dz*dz)\n\n# function to create a random block in a region\ndef randBlock(pos):\n\
    \    randomBlock = randvec3(pos)\n    randomBlock.x += random.randint(pos.x-50,\
    \ pos.x+50)\n    randomBlock.y += random.randint(pos.y-5, pos.y+5)\n    randomBlock.z\
    \ += random.randint(pos.z-50, pos.z+50)\n    return randomBlock\n\ndef main():\
    \ # main loop of hide and seek\n    global player\n    lastPlayerPos = mc.getPlayerPos()\n\
    \    sleep(2)\n    rand_block = randBlock()\n    mc.setBlock(rand_block, block.DIAMOND_BLOCK)\n\
    \    mc.postChat(\"A diamond has been hidden somewhere nearby!\")\n    distanceFromPlayer\
    \ = distance(rand_block, lastPlayerPos)\n    timeStarted = time.time()\n    while\
    \ True:\n        player = mc.getPlayerPos()\n        if distanceFromPlayer < 2:\n\
    \            seeking = False\n        else:\n            mc.postChat(\"War \"\
    \ + str(distanceFromPlayer) + \" blocks away\")\n            if distance(player,\
    \ rand_block) > distanceFromPlayer:\n                mc.postChat(\"Colder \" +\
    \ str(distanceFromPlayer) + \" blocks away\")\n    else:\n        timeTaken =\
    \ time.time() - timeStarted\n        mc.postChat(\"Took \" + str(int(timeTaken))\
    \ + \" seconds to find the diamond\")\nif __name__ == \"__main__\":\n    main()\n\
    ```\n\n![](img/45a70445846e93838a23812ca8a9d98d_26_0.png)\n\n## On the Disc\n\n\
    You'll learn...\n\nFunctional, and,\n\nThere's nothing too tough about coding.\
    \ We've used a couple of functions (starting with basic ones) and now we will\
    \ explain how to create the logic.\n\n## Configuring the Pi API\n\nTo take control\
    \ of the Pi API, you will need to copy the Python folder from the Minecraft-Pi\
    \ folder to a new location. In the terminal, type:\n- /minecraft\n\n```\ncd ~/minecraft/pi-api\n\
    ```\n\nNow we want to create a 'boilerplate' Python script that connects the API\
    \ to the game. Write the following:\n\n```python\nfrom cmpi.minecraft import Minecraft\n\
    mc = Minecraft()\n```\n\nWith nano, you can follow the steps and then press Ctrl+X\
    \ to save, then Enter to run the command:\n\n## Testing the script\n\nThe script\
    \ you created contains everything you need to get started with Minecraft in Python.\
    \ For it to work, you will need to have the game running (and playing).\n\n##\
    \ Hide and Seek\n\nAs you can see from the code, we've created a game of Hide\
    \ & Seek based on Martin's original creation (which you can find at online). When\
    \ you launch the script, you'll be challenged to find the hidden block. This project\
    \ demonstrates one of the more complex methods available in the API. But there's\
    \ much more to it than this demonstrates. Stay tuned - we will be back with more\
    \ related guides. You'll see a message on screen to let you know the API connected\
    \ properly. Now we know it works, let's get going!\n\n## Tutorial 10 Practical\
    \ Raspberry Pi Projects\n\n![](img/45a70445846e93838a23812ca8a9d98d_27_0.png)\n\
    \n## Get interactive with Scratch\n\nExperiment with physical computing using\
    \ Scratch to interact with buttons and lights on the Pi.\n\n## What you'll need\n\
    \n- Breadboard\n- LEDs\n- Resistors\n- Jumper wires\n- Scratch\n\nScratch is a\
    \ very simple visual language, commonly used to teach basic programming concepts\
    \ to learners of any age. This project will learn you how to light up an LED with\
    \ Scratch and change its color when a button is pressed. With these techniques\
    \ you can make fun projects from controllers to animations.\n\n## 01 Installing\
    \ the required software\n\nLog into the Raspberry Pi system with the username\
    \ and password. Start the LXDE environment using the terminal and use Python script\
    \ to install:\n\n```\nchmod +x scratchgpio.sh\nsudo bash scratchgpio.sh\n```\n\
    \nThis will create a special version of Scratch on your desktop. This is a simple\
    \ version of Scratch that handles communications between Scratch and the GPIO.\n\
    \n## Get interactive with Scratch\n\n![](img/45a70445846e93838a23812ca8a9d98d_28_0.png)\n\
    \nuses pins rather than numbers to identify the GPIO. We first connected our LED\
    \ to pin number 1, the one beneath pin 2, and so on.\n\n## You'll learn...\n\n\
    Simple circuits\n\nWhile these are very basic circuits, how we get a great feel\
    \ for programming with the Raspberry Pi prototyping kit? If you need to buy the\
    \ parts we recommend you check out:\n\n## 2 Connecting the breadboard\n\nPower\
    \ off and connect an LED, a 330-ohm resistor and two jumper cables. You'll want\
    \ to connect the 330-ohm resistor to the opposite terminal of the breadboard.\
    \ The resistor is used to limit the amount of current that can flow to the LED.\n\
    \n## Wiring up our push button\n\nConnect the negative terminal of the LED into\
    \ the GROUND pins of the breadboard. Now you can connect the power to the GPIO\
    \ pin. If it doesn't work right, swap the legs around and try again. Power off\
    \ the Pi. If we connected the LED that we created, the first thing we need to\
    \ do is connect the 10k ohm resistor to the positive terminal, and the other end\
    \ to an empty track on the breadboard. Then on that same track, add the other\
    \ end connected to GPIO7. This is pin number 17. Finally, connect the negative\
    \ terminal of the push button by adding a wire that is connected to the same negative\
    \ rail.\n\n## 2 Coding principles\n\nScratch is the perfect place to start programming\
    \ real-life projects. It helps you understand basic programming languages and\
    \ logic.\n\n## 3 Physical\n\nThere's nothing more than making code from your screen\
    \ work into a real-life project. It helps you just light up life and build the\
    \ skill that is the limit.\n\n## 03 Switching on and off\n\nAt the moment, the\
    \ LED is connected to a pin that can only be turned on. If we want to be able\
    \ to turn it on and off, we should use GPIO 17, which we can turn on and off.\
    \ GPIO 17 is the sixth pin from the top, on the top of the row. Power on the Pi.\
    \ We can turn the LED on by outputting the GPIO pin and setting its value to 1.\
    \ By setting it to 0 we turn the LED off.\n\n```\nset x7 to /sys/class/gpio/gpio7\n\
    set out to /sys/class/gpio/gpio7/direction\nset 1 to /sys/class/gpio/gpio7/value\n\
    ```\n\nWhen the button is pressed, GPIO 7 will be 1. However, when the button\
    \ is released, the GPIO will be 0. We have a value of 0 because there is less\
    \ resistance connected to the ground.\n\nWe can see this in action by checking\
    \ the pin value and pressing the button to change it.\n\n```\nwhen clicked\nforever\n\
    \  if pin7 sensor value = 0 then\n    broadcast wait\n  end\n```\n\n![](img/45a70445846e93838a23812ca8a9d98d_28_1.png)\n\
    \n## 04 Controlling the LED from Scratch\n\nUse the LXDE environment and open\
    \ Scratch3. In the control section, create a simple sprite that broadcasts wait\
    \ when it is clicked. Then click the sprite. The LED should light up. Now add\
    \ the script to wait 1 second and then broadcast pin1off. The LED will come for\
    \ a second and then go off.\n\n## 06 Let there be light!\n\nBoot up the Pi and\
    \ start Scratch3 as before. Go to the events section and add a green flag clicked,\
    \ then add a forever loop, and use an if else statement. If = operator then go\
    \ to the sensing section and add a value to the left side of the equality statement,\
    \ and set the right side to If the sensor value is 0, and broadcast pin1off otherwise.\
    \ Click the green flag. If you push the button, the LED will light up!\n"
  mdcn: "\n\n## 教程：10 个实用的树莓派项目\n\n## 编写 Minecraft-Pi 程序\n\nRussell Barnes 是《Linux\
    \ User & Developer》杂志的编辑，拥有超过 15 年的技术撰稿经验。现在他手里有三台树莓派……\n\n## 在玩有史上最伟大的游戏之一的同时学习编程！\n\
    \n## 你需要的物品\n\n- 树莓派（最新版本）\n- Minecraft-Pi 压缩包\n- 键盘和鼠标\n- 互联网连接\n\nMinecraft\
    \ 可能是目前地球上最大的游戏，它可以在你想象的任何设备上运行，从 PC 到游戏机再到手机。它可以在树莓派上运行这可能并不意外。从乍看，Minecraft-Pi\
    \ 是针对游戏机和智能手机的口袋版（Pocket Edition），但树莓派版本非常特殊，因为它是 Minecraft 中唯一一个允许用户访问其 API（应用程序接口）的版本。\n\
    \n## 立即下载 PI 存档！\n\n发布于 2012年12月25日\n\n![](img/45a70445846e93838a23812ca8a9d98d_25_0.png)\n\
    \nMinecraft: PI Edition 的第一个版本现在发布！它是完全免费下载的。我们将适时添加新功能，尽管你们可能希望我们少打扰。\n\n在这个项目中，我们将向你如何设置\
    \ Minecraft-Pi 并对其进行配置，让你能够以前所未有的方式与 Minecraft 交互。这个项目只是冰山一角……\n\n## 01 要求\n\n\
    Minecraft-Pi 要求你在树莓派上运行 Raspbian，所以如果你还没有运行它，请去商店买一个并安装。它还需要你加载 Windows。假设你正处于命令行提示符下，只需输入\
    \ `start` 即可进入桌面。\n\n![](img/45a70445846e93838a23812ca8a9d98d_25_1.png)\n\n与其他所有\
    \ Minecraft 版本不同，Pi 版本鼓励你对其进行黑客操作（hack）\n\n## 编写 Minecraft-Pi 程序\n\n## 安装\n\n\
    确保你已在主目录中，并在终端中使用以下命令下载 Minecraft-Pi 软件包：\n-assets/minecraft.pi\n\n```\ncd\npip\
    \ install https://3.amazonaws.com/assets/minecraft.pi\n```\n\n要使用它，你需要将以下文件夹复制到你的\
    \ Minecraft-Pi 目录：\n- tar -zvf minecraft-pi-0.1.1.tar\n现在你可以进入 Minecraft-Pi 目录并尝试首次运行：\n\
    \n```\n./minecraft-pi\n```\n\n## 完整代码列表\n\n```python\n# /usr/bin/env python\n\
    from cmpi.minecraft import Minecraft\nfrom cmpi.block import block\nfrom cmpi.vec3\
    \ import Vec3\nfrom time import sleep\nimport random\nimport math\n\nmc = Minecraft()\
    \ # 连接到游戏窗口\nplayer = mc.getPlayerPos()\n\n# 生成随机浮点数以定位玩家的函数\ndef randvec3(center):\n\
    \    return Vec3(random(center.x), random(center.y), random(center.z))\n\n# 计算两点之间距离的函数\n\
    def distance(point1,point2):\n    dx = point1.x - point2.x\n    dy = point1.y\
    \ - point2.y\n    dz = point1.z - point2.z\n    return math.sqrt(dx*dx + dy*dy\
    \ + dz*dz)\n\n# 在区域内创建随机方块的函数\ndef randBlock(pos):\n    randomBlock = randvec3(pos)\n\
    \    randomBlock.x += random.randint(pos.x-50, pos.x+50)\n    randomBlock.y +=\
    \ random.randint(pos.y-5, pos.y+5)\n    randomBlock.z += random.randint(pos.z-50,\
    \ pos.z+50)\n    return randomBlock\n\ndef main(): # 捉迷藏的主循环\n    global player\n\
    \    lastPlayerPos = mc.getPlayerPos()\n    sleep(2)\n    rand_block = randBlock()\n\
    \    mc.setBlock(rand_block, block.DIAMOND_BLOCK)\n    mc.postChat(\"附近藏了一个钻石！\"\
    )\n    distanceFromPlayer = distance(rand_block, lastPlayerPos)\n    timeStarted\
    \ = time.time()\n    while True:\n        player = mc.getPlayerPos()\n       \
    \ if distanceFromPlayer < 2:\n            seeking = False\n        else:\n   \
    \         mc.postChat(\"距离 \" + str(distanceFromPlayer) + \" 格\")\n          \
    \  if distance(player, rand_block) > distanceFromPlayer:\n                mc.postChat(\"\
    更远了 \" + str(distanceFromPlayer) + \" 格\")\n    else:\n        timeTaken = time.time()\
    \ - timeStarted\n        mc.postChat(\"花了 \" + str(int(timeTaken)) + \" 秒找到钻石\"\
    )\nif __name__ == \"__main__\":\n    main()\n```\n\n![](img/45a70445846e93838a23812ca8a9d98d_26_0.png)\n\
    \n## 在光盘上\n\n你将学习……\n\n功能性的，并且，\n\n编码并没有那么困难。我们使用了一些函数（从基础函数开始），现在我们将解释如何创建逻辑。\n\
    \n## 配置 Pi API\n\n为了控制 Pi API，你需要将 Python 文件夹从 Minecraft-Pi 文件夹复制到新位置。在终端中输入：\n\
    - /minecraft\n\n```\ncd ~/minecraft/pi-api\n```\n\n现在我们想要创建一个连接 API 到游戏的 Python\
    \ 模板脚本（boilerplate）。编写以下内容：\n\n```python\nfrom cmpi.minecraft import Minecraft\n\
    mc = Minecraft()\n```\n\n使用 `nano`，你可以按照步骤操作，然后按 `Ctrl+X` 保存，再按 `Enter` 运行：\n\n\
    ## 测试脚本\n\n你创建的脚本包含了在 Minecraft 中开始所需的一切。为了让它工作，你需要运行游戏（并玩）。\n\n## 捉迷藏 (Hide and\
    \ Seek)\n\n正如你所看到的，我们创建了一个捉迷藏游戏，基于 Martin 的原始创作（你可以在网上找到）。\n\n这个项目展示了 API 的一种更复杂的方法。但比这还有更多内容。你可以从代码中看到，我们创建了一个基于\
    \ Martin 原创的捉迷藏游戏（你可以在网上找到）。当你启动脚本时，你将被挑战寻找隐藏的方块。请关注——你将在屏幕上看到消息确认 API 已正确连接。现在让我们开始吧！\n\
    \n## 教程：10 个实用的树莓派项目\n\n![](img/45a70445846e93838a23812ca8a9d98d_27_0.png)\n\n\
    ## 使用 Scratch 交互\n\n使用 Scratch 进行物理计算，与树莓派上的按钮和灯光交互。\n\n## 你需要的物品\n\n- 面包板\n-\
    \ LED 灯\n- 电阻\n- 跳线导\n- Scratch\n\nScratch 是一种非常简单的视觉语言，通常用于向任何年龄的学习者教授基础编程概念。通过这些技术，你可以制作有趣的项目，按下按钮时点亮\
    \ LED 并改变颜色。\n\n## 01 安装所需软件\n\n使用用户名和密码登录树莓派系统。使用 LXDE 环境和 Python 脚本安装：\n\n```\n\
    chmod +x scratchgpio.sh\nsudo bash scratchgpio.sh\n```\n\n这将在桌面上创建一个特殊的 Scratch\
    \ 版本。这是一个处理 Scratch 和 GPIO 之间通信的简单版本。\n\n## 使用 Scratch 交互\n\n![](img/45a70445846e93838a23812ca8a9d98d_28_0.png)\n\
    \n使用引脚而不是数字来识别 GPIO。我们首先将 LED 连接到引脚 1、2，以此类推。\n\n## 你将学习……\n\n简单电路\n\n虽然这些是非常基础的电路，但如何通过树莓派原型套件获得良好的编程感觉？如果你需要购买零件，我们建议查看：\n\
    \n## 2 连接面包板\n\n关掉电源，连接 LED、一个 330 欧姆电阻和两根跳线。电阻用于限制流向 LED 的电流。\n\n## 布接我们的按钮\n\
    \n将 LED 的负极连接到面包板的 GND 引脚。现在你可以将电源连接到 GPIO 引脚。如果没有正常工作，调换引脚重试。关掉树莓派。如果我们连接了 LED，要做的第一件事是将\
    \ 10k欧姆电阻连接到正极，另一端连接到面包板上的空位。然后在同一个空位上，将另一端连接到 GPIO7。这是引脚 17。最后，通过连接到同一负极的线连接按钮的负极。\n\
    \n## 2 编码原理\n\nScratch 是编写现实项目的完美起点。它帮助你理解基础编程语言和逻辑。\n\n## 3 物理\n\n没有什么比让屏幕上的代码变为现实项目更有趣了。它帮助你点亮并建立技能。\n\
    \n## 03 开\n\n目前，LED 连接到一个只能开启的引脚。如果我们想能够开启和关闭它，应该使用 GPIO 17，我们可以开启和关闭它。GPIO 17\
    \ 是从顶部开始第六个引脚，位于行的顶端。开启树莓派。我们可以通过输出 GPIO 引脚并将其设置为 1 来开启 LED。通过将其设置为 0 来关闭 LED。\n\
    \n```\nset x7 to /sys/class/gpio/gpio7\nset out to /sys/class/gpio/gpio7/direction\n\
    set 1 to /sys/class/gpio/gpio7/value\n```\n\n当按下按钮时，GPIO 7 为 1。然而，当释放按钮时，GPIO\
    \ 将变为 0。我们得到 0 的值是因为连接到地线的电阻较小。\n\n我们可以通过检查引脚值并按下按钮改变它来现场观察这一过程：\n\n```\nwhen\
    \ clicked\nforever\n  if pin7 sensor value = 0 then\n    broadcast wait\n  end\n\
    ```\n\n![](img/45a70445846e93838a23812ca8a9d98d_28_1.png)\n\n## 04 从 Scratch 控制\
    \ LED\n\n使用 LXDE 环境并打开 Scratch3。在控制部分，创建一个简单的角色，在它被点击时广播“wait”。然后点击该角色。LED 应该亮起。现在添加脚本等待\
    \ 1 秒然后广播“pin1off”。LED 将持续一秒后关闭。\n\n## 06 让光亮起来！\n\n启动树莓派并像之前一样启动 Scratch3。进入事件部分并添加“绿色旗帜点击”，然后添加一个永远循环，并使用如果...否则语句。如果\
    \ = 运算符，则进入传感部分并在等式语句的左侧添加一个值，并将右侧设置为“如果传感器值为 0”，否则广播“pin1off”。点击绿色旗帜。如果你按下按钮，LED\
    \ 就会亮起！\n\n"
