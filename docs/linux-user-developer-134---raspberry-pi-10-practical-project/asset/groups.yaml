    # ## Mr Roboto


    I read the Raspberry Pi robot article sometimes, then found my brain planning
    a sonar [system] where each plays high tone and subsequent echoes progressively
    lower to indicate objects at different ranges.

    I planned to use a frequency oscillator (described code) to provide notes of pitch
    and video, to feed earphones to create an audio picture of an area. I also selected
    the transducer, with a range of over fifty meters and and underwater.

    However I did not plan on the pulse repetition rate of 10Hz and a choppy echo
    of 23ms! Getting an audio into the tube 2cm wide is way beyond my skill. Pivoting
    the transducer back and forth by a heart-shaped cam and forcing the left and right
    is child''s play, but two or three echoes each 100ms is too fast for me.

    The principal is really simple and, I believe, a life-saver for many people like
    myself. I learned Linux years ago; they programmable so devices many years later
    & do not wish to start again. But if I think it is possible to convert the echoes
    to stereo tones and tones to detect obstacles ahead

    Anyone is interested, I can send the SDP file I''ve been working on.


    Yours sincerely,


    Fred Anderson


