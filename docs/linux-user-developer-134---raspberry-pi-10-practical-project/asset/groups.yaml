    working, the final message should be "Initialization Sequence Completed".


    ## 11 Configure the client


    Move to another Linux machine or LAN client; install OpenVPN using the package
    manager. Run `find` to find the client configuration. Copy the file client.crt,
    ca.crt and client.key to /etc/openvpn. How do you want to set up, but be sure
    to protect them as anyone who has these files can connect.


    ## 10 Start the server


    For now, you''ll serve manually so that we can see the output and check for errors.


    > We can connect to the server, via the tunnel, but we can''t access...


    ## 13 Test the client


    Open client.conf (as root) to start the client. Use ifconfig to verify creation
    of tun0. If you can ping the server by typing `ping server`, you have now established
    a tunnel, encrypted connection between the client and the server.


    ## 14 Enable packet forwarding


    As it stands, we can connect to the server, but we can''t yet access the internet.
    By starting by editing /etc/sysctl.conf and uncommenting the line `net.ipv4.ip_forward=1`
    to enable packet forwarding. Now restart the server.


    ## 17 Forward traffic with iptables


    On the server, use `iptables -t nat -A POSTROUTING -s 10.8.0.0/24 -o eth0 -j MASADE`
    to allow forwarding of traffic through the internet. Install dnsmasq to your system.
    Add the line `interface=tun0` to `/etc/dnsmasq.conf` and restart service dnsmasq.


    On the server, use /etc/openvpn/server.conf. To enable the VPN server using `systemctl
    enable openvpn@server`, the ''start, stop or restart'' command makes the service
    start on boot. If you used dnsmasq, edit /etc/dnsmasq.conf.


    ## 20 Connecting from a Windows client


    Add the line `"redirect-gateway def"` and `"push \"option \"dhcp-option DNS 8.8.8.8\"\""`
    to server.conf. This causes the clients to execute appropriate route commands
    to direct all network traffic through the VPN. You may have to manually add the
    DNS server to the client.


    ## 19 Connecting from an Android device


    Most Android phones and tablets don''t have a built-in OpenVPN client. Search
    for OpenVPN client on Google Play. Your choice OpenVPN website (openvpn.net) has
    a client that runs on Windows. You can copy three client files to the machine,
    install the client and follow the on-screen instructions. Windows client can use
    the push directives that were added to server.conf, so we don''t need to set up
    DNS manually.


    ## 18 Connecting from the outlet


    To forward your router to the IP address of your router. This depends on the method
    of your router (port forwarding, static gateway, or route model). Update the remote
    route in the client (see http://www.openvpn.com) or No-IP (see http://www.noip.com)
    so that you don''t have to update the client every time your router changes.


