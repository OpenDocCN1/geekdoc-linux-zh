    \ next_alpha\n    camera.stop_preview()\n    current_alpha = next_alpha\n    next_alpha\
    \ -= 5\n```\n\n```\ndef de_quit():\n    camera.close()\n    pygame.quit()\n```\n\
    \nprint('You\\'ve taken', pics_taken, 'pictures. Forget to get back up!')\n\n\
    ```\ndef intro_screen():\n    while True:\n        for event in pygame.event.get():\n\
