    # # Questions & answers

    All your problems solved


    To view list of applications, there is a fairly simple way of doing this in the
    terminal. Before you uninstall your system, use `dpkg` to make a list of your
    packages like so:


    ```

    ```bash

    dpkg --get-selections > selections.txt```

    ```


    Make sure to save this. Once you install the new version of Ubuntu, you can use
    this to add the selections to the new dpkg:


    ```

    ```bash

    dpkg --get-selections < selections.txt```

    ```


    And finally:


    This should install all the packages back on your system. You can check our previous
    post for a guide to installing and dual-booting distro on an external hard drive.


