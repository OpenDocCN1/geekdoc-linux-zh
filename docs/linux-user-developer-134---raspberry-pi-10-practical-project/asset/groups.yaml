    environment with both Linux and Windows. A further effort to accommodate, that
    there now a plug-in for Microsoft System Center that can manage aspects with many
    different units


    administrators to concentrate time and efforts on many different organisations”,
    says the blurb – and talking to SUSE at the conference, they feel better about
    the future now that this interoperability can sway customers towards SUSE as a
    Linux solution.


    # HACK PLANET


    # SUSE''s Hacker is a week of technology innovation


    When Ralf Raifa is not heading the engineering team and level three, he is organizing
    Hacker at SUSE. The annual event is a week where normal rules apply with full
    freedom of teams and individuals to work on whatever they want.


    products where the initial idea or innovation originated in hackerflow. The formation
    of Yaast Linux & Developer was a hacker project, so many products were created
    during the last week, and some continues on after its finished.


    It’s a very encouraging atmosphere where engineers come together and concluded
