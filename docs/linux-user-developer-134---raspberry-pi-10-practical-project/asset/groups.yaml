    # 自由来源专栏


    ## 改变世界——从每一个比特开始


    ## 访问计算机——以及任何可能让你了解世界运行方式的事——应该是无限制的，直到有了可以通过工具和价值观来衡量自己与工作关系的*实践迫切性*！


    编写自由软件是有趣味的，它改变了许多关于人们为何以及何何工作的传统假设。人们喜欢为自由项目做贡献，而不仅仅是为了财务或私人的奖励。自由软件的胜利是击败了一个“运动”的反击，这个运动由“自由”等词汇、被削弱的定义、切实的哲学和一个学习框架所定义。从零开始编写一个自由操作系统的快乐捕捉了那些并不平凡之人的想象力。他们是探险家、冒险家。他们正在做着计算机上无法完成的事情，而这吸引了我。


    “我就是在‘那里’偶然发现了所有计算机的源头，”Levy 回忆道，“有一个迷宫允许他们控制自己的火车，而人们是第一批在技术意义上自称为‘黑客’的人。”他们之间存在一种伦理准则，Levy
    述了他对广为人知的《黑客伦理》的经典解读：Linux 和内核让早期的 GNU/Linux 发行版在共享空间中自由。


    - 访问计算机——以及任何可能让你了解世界运行方式的事——应该是无限制且完全的，直到有了*实践迫切性*！

    - 所有信息应该是自由的。

    - 信任-权威去中心化；进步应该通过他们的黑客行为，而不是通过地位、年龄或种族。

    - 你可以创建并构建计算机；你的计算机可以让你的生活变得更好。


    尽管重重困难，GNU 和 Linux 内核将“开源”带入了严肃的框架，自由软件成为了世界的代码。GPL 及其指导原则就是演变成黑客伦理的东西，它继承自 MIT
    模型计算机俱乐部（TMC）的黑客们。后来，在 60 年代位于马萨诸塞理工学院（MIT）的其他人使得将软件带给每个人成为可能。


    Richard Stallman

    关于艺术、音乐、数字权利、Linux 和自由的各种出版物


    在过去，Richard Stallman 说过：“我们之所以有一个自由的操作系统，是因为世界需要一个自由的系统，而不是 90% 自由。如果你没有一个自由的系统，当你由于某种原因受到限制，并且在进行更改时具有某些实际便利时，你就无法看到什么是可能的。”


    Stallman 所构想的“自由”理念要么是完全原创的，要么是新的，但许多人想为软件应当是自由的这一理念做出贡献；Stallman、GNU 和 GPL 为“自由”这一概念带来了一个名字和一个超越了其学术起源的意义。它让思想和运动动了起来；自由软件始于边缘和意料之外，伴随着许多不切实际的理想。


    Stallman 谈到了计算机革命的英雄们，讲述了黑客伦理演变的经典故事，从 TMC 的桌子到 MIT 的黑客。正如 Levy 后来评论道，“他们并不是反社会的怪胎，而是与其追随他人……”


    Stallman 尝试为那些已经实践它的人以及追随它的人定义自由软件的意义。


    ## 每个人都有权根据自己的能力、为权利做出贡献，并做出改变


