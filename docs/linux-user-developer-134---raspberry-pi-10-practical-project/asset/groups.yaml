- md: "\n# Tutorial\n\n## Event-driven programming with Qt\nLinuxDeveloper\n\n![](img/45a70445846e93838a23812ca8a9d98d_59_0.png)\n\
    \n# Event-driven programming with Qt\n\nKeeping your program components separated\
    \ simplifies testing. Enjoy the benefits of event-driven coding, with minimal\
    \ effort.\n\nDid you ever feel like reusing a part of a program, only to find\
    \ yourself restricted to various existing code? Did you ever have to handle input\
    \ in a way that didn't make the algorithm dependent on the Qt toolkit?\n\nDeploy\
    \ Qt because of the signal-slot system. The hour is well deserved; it is difficult\
    \ to find a case which can not be handled by the framework. Qt is well-known to\
    \ reduce complexity, and slots are needed for interacting with controls provided\
    \ by Qt's GUI classes. Finally, most modules integrate themselves into the signal-slot\
    \ system.\n\nThe signal-slot system permits you to connect application components\
    \ to one another using event-like paradigm; signals are emitted to the framework\
    \ slots.\n\nTo cut a long story, if you want to use Qt, you will need to know\
    \ your way around signals emits.\n\nMost computer science problems can be understood\
    \ via an example. In the following, we will create a little application to analyse\
    \ other resistors (whose value is a series of rings). It will use a computational\
    \ engine which communicates by receiving and emitting signals.\n\nIn real life,\
    \ an event is any occurrence of: the opening of a club, the launch of an aircraft,\
    \ or a good idea. In computers, a similar defined event can be constructed.\n\n\
    Traditionally, creating an event was a significant undertaking. Many developers\
    \ chose to...\n\nWhen dealing with Qt, an event is anything that the class decides\
    \ to share with the outside world. Most Qt widgets emit a wide variety of events.\
    \ They can be handled in order to create the small application which classes can\
    \ handle as as few events as you see fit.\n\n# Advisor\n\nTam Hanna has been in\
    \ the IT business since the days of Palm Inc. Serving as a journalist, speaker,\
    \ and author of books, he has seen every aspect of the mobile market more than\
    \ once.\n\n# Resources\n\nFurther reading:\n\n- [http://qt-project.org/wiki/Qt5_index/signals_and_slots](http://qt-project.org/wiki/Qt5_index/signals_and_slots)\n\
    - [http://qt-project.org/doc/qt-5.0/qtgui/signals_and_slots.html](http://qt-project.org/doc/qt-5.0/qtgui/signals_and_slots.html)\n\
    - [http://qt-project.org/doc/qt-5.1/qtdoc/qtgui-index.html](http://qt-project.org/doc/qt-5.1/qtdoc/qtgui-index.html)\n\
    \nQt also includes:\n\n- [http://qt-project.org/doc/qt-5.1/qtdoc/qtcharts-index.html](http://qt-project.org/doc/qt-5.1/qtdoc/qtcharts-index.html)\n\
    \nQML intro:\n\n- [http://qt-project.org/doc/qt-5.1/qtdoc/qml-index.html](http://qt-project.org/doc/qt-5.1/qtdoc/qml-index.html)\n\
    \n![](img/45a70445846e93838a23812ca8a9d98d_59_1.png)\n\n> After startup, Qt Creator\
    \ shows a 'state pane' with some instructions for getting started\n\n- Four lists\
    \ and a button are needed\n\n60 www.linuxuser.com\n\n# Event-driven programming\
    \ with Qt\n\nCreate a resistor calculator using signals and slots\n\nTUTORIAL\n\
    \n- Add some colours to the first three list boxes\n\n![](img/45a70445846e93838a23812ca8a9d98d_60_0.png)\n\
    \nWe will see that the framework imposes very few limitations in this regard.\n\
    \nDue to the overhead of inheritance, some issues could arise if Qt used a callback\
    \ called 'event'. This is invoked by the signal and slot manager. In an event,\
    \ the framework routes signals to one or more slots which process them.\n\nIn\
    \ the real world, routing events takes on an interesting basis. If a party later\
    \ wants to make an event, it emits it. Other parties may also hear it. However,\
    \ they may ignore it if it is not of interest to them.\n\nQt mirrors this in the\
    \ registration process: it checks if any slots have registered in it. Notifications\
    \ are dispatched to those objects.\n\nOur Qt-based framework will constrain itself\
    \ to dealing with four bands. This provides us with a total of four and one outgoing\
    \ events. QObject-derived classes are automatically integrated into the signal-slot\
    \ framework - the header of ResistorCalcClass looks as follows:\n\n```cpp\nclass\
    \ ResistorCalc: QObject {\n    Q_OBJECT\n\npublic:\n    ResistorCalc();\n\npublic\
    \ slots:\n    void valueChanged(int to_max);\n\nsignals:\n    void newValue(int\
    \ new_value);\n\nprivate:\n    void recalculateValue();\n    int my1;\n    int\
    \ my2;\n    int my3;\n};\n```\n\n### Declaring signals and slots\n\nWe will see\
    \ that the framework imposes very few limitations in this regard.\n\nDue to the\
    \ overhead of inheritance, some issues could arise if Qt used a callback called\
    \ 'event'. This is invoked by the signal and slot manager. In an event, the framework\
    \ routes signals to one or more slots which process them.\n\nIn the real world,\
    \ routing events takes on an interesting basis. If a party later wants to make\
    \ an event, it emits it. Other parties may also hear it. However, they may ignore\
    \ it if it is not of interest to them.\n\nQt mirrors this in the registration\
    \ process: it checks if any slots have registered in it. Notifications are dispatched\
    \ to those objects.\n\nOur Qt-based framework will constrain itself to dealing\
    \ with four bands. This provides us with a total of four and one outgoing events.\
    \ QObject-derived classes are automatically integrated into the signal-slot framework\
    \ - the header of ResistorCalcClass looks as follows:\n\n```cpp\nclass ResistorCalc:\
    \ QObject {\n    Q_OBJECT\n\npublic:\n    ResistorCalc();\n\npublic slots:\n \
