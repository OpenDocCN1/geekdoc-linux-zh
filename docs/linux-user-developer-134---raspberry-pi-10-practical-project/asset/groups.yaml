    ![](img/45a70445846e93838a23812ca8a9d98d_75_0.png)


    # Securstore


    Is there such a thing as a one-size-fits-all backup solution for the Linux-based
    enterprise user? Securstore seems to think so


    Securstore is one of many companies around today which specialises in such, off-site
    backup for businesses, offering remote storage in pair of UK or US data centers
    with the content of one being automatically replicated to the other – a backup
    for you anywhere.


    Rather than just leaving you to get with things, Securstore has a proactive approach
    to support: signing up for the service gives you the opportunity to have a call
    with the company''s UK support teams, who will walk you through the installation
    and configuration process step-by-step. If you are more of a self-directed learner
    you have the option of doing it yourself with our detailed online tutorials.


    # Cons


    The company''s software doesn''t act so in-house, however it is quite good for
    cloud-backup specialist aside, with which managing the Securstore''s DS-Client
    and DS software is easy to handle. With Securstore''s software dating back to
    1998, there is some learning curve.


    The software has its faults and sometimes confusing user interface which takes
    some getting used to, but you will find each backup can come from local file systems,
    remote servers via SSH and NFS, permissions-only backups, MySQL, Postgres, Sparse,
    Oracle and DB2 databases, VMware virtual machines, and even physical-to-virtual
    server backups for disaster recovery.


    Installing the software is pretty straightforward; while designed with Red Hat
    and SUSE servers in the mind, the DS-Client can be managed onto pretty any Linux
    platform imaginable – and it''s here Securstore shows its first signs of excellence.


