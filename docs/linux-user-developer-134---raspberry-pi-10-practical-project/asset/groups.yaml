    ## 演示软件组测


    四款最好的演示应用展开了对决。


    ### Calligra Stage


    Calligra Stage 是 KOOffice 和 KPresenter 的继者，是 Impress 最直接的竞争对手。


    我们在办公套件组测（#120）中的准备令人印象深刻，尽管它缺乏像 LibreOffice 那样的社区支持和人气。Calligra 是该套件自带的演示软件，是一个类似于
    PowerPoint 风格的优秀桌面应用程序。启动 Stage 时，你会发现它初看起来非常杂乱。主界面满了功能，除非你使用的是 1080p 或更高分辨率的显示器，否则这些功能无法正常工作。屏幕上有很多内容需要处理，给活动预览留下的空间有限。界面至少是敏感，会根据你是在编辑文本还是制作动画来清除一些方框。


    即使你能在界面中找到某些功能，但它们用起来也并不直观。图片功能可以与标题链接，但由于没有在每个对象上使用锚点，这需要花费大量精力，而且我们在 LibreOffice
    中也遇到过类似的问题，最多情况下只需要稍微重新排版就能确保所有内容可见。


    需要进行一些实验才能弄清楚哪些是好用的。对于一个可能不经常使用的软件来说，这并不理想——如果你不需要经常使用某个功能，可能需要花费更多时间学习如何使用它。


    使用 Stage 创建的演示文稿提供了多种工具供选择，各种图像和线条工具，以及大量的幻灯片可以使用。如果界面不是那么固定和杂乱会更好，但对于这一点你没什么办法，后者是一个更大的问题。


    Stage 包含了幻灯切换；不支持幻灯片上不同对象的动画，即使它们是从其他幻灯片应用导入的。这似乎不会影响导入的演示文稿。


    使用 Calligra 创建的演示文稿非常出色。

    ![](img/45a70445846e93838a23812ca8a9d98d_70_0.png)


    - 易用性：功能的特性让创建幻灯片变得有些困难

    - 兼容性：它能很好地导入许多格式，但不支持动画

    - 功能：可以做得足够好以商务环境

    - 美观性：有多种功能、文本框和流程图，但是

    - Calligra Stage 功能齐全，但存在一些你必须搏斗的问题


    界面在非 1080p 屏幕上很杂乱，但有很多功能可以选择。


    ### EWIPE

    一个通过块完成所有操作的简单演示应用。


    当我们第一次看到 EWIPE 时，我们被吸引了。EWIPE 基于 Python 开发，它将被定位为一个轻量级程序，虽然大多数软件都不是开源的，但我们在本次测评中包含了一个。我们还排除了一些
    PDF 和 LaTeX 演示库，不过，我们在之前的期数（4131）中详细介绍了关于如何使用 LaTeX 创建专业演示文稿的教程。

