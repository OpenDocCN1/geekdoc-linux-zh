    此功能在 Fluxbox 中仍然存在，你需要正确激活它。由于你的中键不仅不起作用而且被 Virtualbox 使用，我们认为需要编辑配置文件使其按你想要的方式工作。首先，像这样打开配置文件：


    问题是我不确定具体该如何操作。似乎没有什么图形化工具可以实现我的要求，而且一些 LVM 的东西看起来有点令人生畏，因为我必须从不同的来源配置完全符合我想要的内容。有什么想法我该怎么做吗？


    ```

    $ sudo nano -/fluxbox/keys

    ```


    接下来，向下滚动寻找类似下面的一行：


    - InnerClick Mouse :~StartTabbing


    要通过中键使用它，你需要编辑此行使其内容如下：


    - OuterButton Mouse :~StartTabbing


    我们在补丁更新时遇到了这个麻烦，但那里没有直接的解决方案。我们基本上需要对格式化空间的操作使用 LVM 然后扩展 LVM 分区。如果创建的空间不够，你可以像硬盘上的逻辑卷一样创建一个任何大小的分区。


