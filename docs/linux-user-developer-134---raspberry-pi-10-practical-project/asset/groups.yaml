    # Linux 社区新闻

    开源


    # 链接


    请在此关注 Twitter 上的 @OggCamp 的 2014-OggCamp 活动：

    oggcamp.org


    来自 35 场 OggCamp 演讲的幻灯片和反馈链接：

    jord.in/event/view/1612/talks


    开放权利（Open Rights）—— 促进并维护您的数字权利：

    www.openrights.org


    Less Wrong 是一个致力于完善人类功能艺术的社区：

    lesswrong.com


    汽车 Linux - 汽车制造商的免费软件：

    www.linuxfoundation.org/colaborate/workgroups/automotive-drive-linux


    使用 Daviwicks 为 Brother KV9501 针织机将图像转换为数据层：

    punchpunchdecode.com.co.uk/2013/oggcamp/


    ![](img/45a70445846e93838a23812ca8a9d98d_6_0.png)


    更担心的是，如果这不是你自己的政府，而是另一个你在法律下没有任何权利或保护的国家。


    # 众包议程


    DL：举办会议的好处之一是活动是由参会者设定的，我们可以看到他们感兴趣的内容。我们一直试图让 OggCamp 不仅仅关于技术。我们鼓励艺术、政治等更多内容。所以，看到对他们重要的事情是很好的，比如参会者必须掌握控制权。在我们这边，有一个出色的计划并且恰好是参会者现在想要的，是非常重要且有价值的。


    在自由、开源和开放文化之间取得平衡，你觉得 OggCamp 营造了一种特定的氛围吗？


    DL：我想是的。我们遵循了去年的路线，这确实创造了一种民主化的使用性质；但我们更进了一。我们将活动推广为一种自由且开放的文化。我们一直鼓励人们在艺术、政治、工艺等领域分享知识，而不仅仅是技术。正因如此，OggCamp
    周边的社区变得非常多样化。


    今年重点是参会者和工作坊。我们开展了许多活动供人们参与。参会者的良好反馈对我来说很重要。最美好的时刻之一是有一个人告诉我，这帮助他们最终理解了你的工作。未来还有很多年时间，这就是我们的目标。


    Dan Lynch - “我们努力让我们的活动尽可能包容”


    我们提供了很好的价值、欣赏并与路线良好连接。Wi-Fi 随处可用，而且我们有一些可以应对访客流量的价值。


    我们努力让我们的活动尽可能包容。对我来说最满意的事情之一是人们告诉我他们在这里，但之前不确定是否来。当我们听到人们明年明年和朋友一起回来时！


    来自社区

    今年的 OggCamp 还汇集了来自优秀开源和项目的演讲；从关于 Linux 的一切到国际；现场会议；以及对 OggCamp 的记忆可能，但我们只想和 Dan
    Lynch 谈谈——在活动后询问我们是什么让 OggCamp 运作的。我们都对政府入侵的程度感到震惊。


    今年的活动似乎有很多关于安全和隐私的演讲……


    DL：我没在那儿，但那里有很多相关的演讲，只是在主轨道中只有两个。从 OggCamp 的日程安排来看，完全没有，这显然不是人们想要的。


    尽管如此，作为组织者，你总可以做一些基础事情来培养良好的氛围。我一直以来带着开源和在艺术、政治、工艺等领域分享知识的想法而闻名，而不仅仅是技术。


    # 开源


    # 你的 Linux 新闻与观点来源


    www.linuxuser.co.uk

    直接向我们发送邮件获取最新新闻观点：linuxuser@imagine-publishing.co.uk


    # 让它如此


    从交互式 LED 闹钟到自杀式三旋飞行器，围绕 OggCamp 创作的事物一直一直是 OggCamp 的核心，但正如 Dan Lynch 向当地媒体解释的那样，音乐家拿着电烙铁。随着来自
    ROSGULL 和 ROBERT（一个本地黑客空间）的小组展示项目，以及从针织机到树莓派 3D 打印的各种材料，墙上从咖啡到都有许多灵感来源。


    大空间的一个好处是作为 Parker Fell 的住所，而 Liewookood 的 180 个 Minecraft 方块在下层很高处。尽管他们不是来自社区，但
    Ragnow UK 的 Stacey Davis 展示了公司的展品，这些是为各种项目小批量定制的。


    ![](img/45a70445846e93838a23812ca8a9d98d_7_0.png)


    登记 450 名参会者需要志愿者投入大量精力。


    # 我们在看着你


    安全演讲从 IRQ 攻击和大规模监控开始，这是一个美国国家安全局（NSA）直接访问 Google、Facebook 和其他网站数据的威胁。网站还提到了英国通信总部（GCHQ）的安全机构通过互联网与英国/柏林/爱丁堡建立安全连接，破解加密和安全协议，允许将元数据索引到表中，使元数据像数据一样有效。


    预订的 iPhone 数量；苹果表示，英国有 850 人面临数据泄露的风险，在不携带保护私人加密笔记本的情况下前往该国家，它是“不”安全的。


    - 不需要再通过学习我们的服务来间谍了——Ruiz 说，这关乎关键问题。

    - 没有适当的辩论，在斯诺登事件被《卫报》报道之前，甚至一直处于黑暗中。

    - 适当的监督——来自法官，以及提供给委员会的选资源列表。

    - 跨国，人口级监控不是关于“个人隐私与安全”，而是对民主的根本性威胁。


    '
