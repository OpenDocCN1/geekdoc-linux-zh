    # # SUSECon 2013

    Conference report and interviews


    ![](img/45a70445846e93838a23812ca8a9d98d_66_0.png)


    # # FIXING IT

    Nils Brauckmann wants to bring control of IT back to the SUSE department


    During his SUSECon keynote presentation, Brauckmann delivered worrying figures.
    With CFOs now generally changing how much they have on understanding about IT,
    68% of them believe IT is not strategic to the business, and 85% of IT would benefit
    from efficient solutions that decrease effort. Brauckmann has a solution for,
    though he understands that IT isn''t always easy and that they can get some time
    to make other operations work. That''s why


    # INCREASE AGILITY. REDUCE COSTS AND MANAGE COMPLEXITY

    with SUSE Linux Enterprise


    ![](img/45a70445846e93838a23812ca8a9d98d_66_1.png)


    +   - Ralf Kraus, VP of engineering


    # Enterprise


    When we first spoke to Nils Brauckmann, he mentioned that the first three themes
    seemed very important to SUSE. While he agreed with us, we thought we were missing
    one core part of their SUSE Linux Enterprise.


    "I want to emphasize that SUSE Linux Enterprise as a platform is a very important,
    part of our business," he said. "Out is still growing. It has matured to the degree
    that it''s very stable, secure, high-performing operating system that can even
    handle demanding customers and mission-critical workloads."


    # Future of SUSE


    At the end of the conference, the future looked bright for SUSE. With a great
    balance between its business side and its interactions driving forward, the next
    versions of SUSE and Linux are sure to be a success. This said, according to SUSE,
    integrated Linux.


    "Venders and manufacturers of devices, single-purpose-devices, because of their
    lack of understanding of IT hardware, healthcare, automotive, industry-broad loadings
    of vehicles with many needs, the expertise we have is to say them and let them
    maintain your own systems and IT and take care of the updates, what do we need
    for you. We have the experience, so let us tell you what we know and we can come
    up with a Linux platform that is simple and easy for them."


    As well as SUSE Cloud products and working with partners and customers, SUSE Desktop
    12 is ready for next year. As for Nils says, the most important point in our business
    is growing. With 22% more business is growing. With more customers, SUSE smashed
    even its record with 27% more sessions. This growth will increase exponentially,
    and we made a point of saying that SUSE is profitable.


    # SUSECon


    The conference itself seems like it will become an important part of SUSE. While
    feedback from last year was very positive, with one request: "The number one request
    in feedback was give us more. So people now this year after added, and they can
    spend more time in the sessions and centre without missing out on."


    Times were changed, an extra day was added and talks and breaks were more evenly
    spaced, giving people more time to attend what they wanted. Even parties allowed
    for networking, creating an environment of learning, teaching, and generally having
    a bit of fun. All has resulted in 10% more attendees, 17 more sessions and 47%
    more hours of content, SUSECon is growing.


    LUD looks to see what SUSE changes has helped brought in, and what the world next
    next year at SUSECon 2014.


