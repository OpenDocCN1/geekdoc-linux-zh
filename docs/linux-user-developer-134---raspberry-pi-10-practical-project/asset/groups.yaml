    Minecraft is probably the biggest game on the planet right now, it''s available
    on any format you can imagine, from PCs to consoles to mobile phones. It should
    probably come no surprise that it''s available on the Raspberry Pi. At first glance
    Minecraft-Pi is a simplified version of the Pocket Edition for consoles and smartphones,
    the Raspberry Pi edition is very special, in that it''s the only version of Minecraft
    to give users access to its API (application programming interface).


