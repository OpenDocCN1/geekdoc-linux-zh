    # 10 Practical Raspberry Pi Projects


    # Create a Raspberry Pi three-colour lamp


    Russell Barnes

    is the editor of Linux User & Developer magazine and has been a technology writer
    for over 25 years. He''s afraid of the dark...


    Use the power of Arduino to do otherwise impossible projects with just a Raspberry
    alone


    # What you''ll need


    +   - Arduino Uno

    - Breadboard

    - Set of prototyping cables

    - RGB LED (cathode)

    - 3x potentiometers

    - 3x 330 Ohm resistors


    In the previous project we showed you how you can use an Arduino microcontroller
    to help the Raspberry Pi become proficient in skills that can drastically increase
    the reach of your projects. With the aid of the extra 12 pins of Arduino and analogue
    input, you could connect multiple sensors, servos and even input devices like
    joysticks.


    In this project we''re going to demonstrate this by creating a three-colour lamp
    employing three potentiometers (twisty knobs) to control each of the three colours
    in an RGB LED light. With it you can make most of the colours of the rainbow.
    As you''d expect, this would be much more difficult using just a Raspberry Pi.


    01 Program with Arduino

    You''ll need to have followed steps from the previous project to configure your
    Raspberry Pi and Arduino Uno. You''ll also need to ensure you''re good at soldering
    the left. The resistors should be 330-ohm ideal, but can be of a higher resistance.
    Arduinos can be bought as part of ''starter packs'' that include exactly these
    kinds of components, but a quick visit to www.cpc.co.uk should fill holes.


    > This is a project for an attractive RGB lamp – a great night light or mood piece


    ![](img/45a70445846e93838a23812ca8a9d98d_35_0.png)'
