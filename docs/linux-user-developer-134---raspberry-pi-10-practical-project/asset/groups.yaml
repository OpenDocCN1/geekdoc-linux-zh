    \ espeak \"hello world\"\n\n```bash\n$ espeak -v3 -4.5 -15 \"Message\"\nwill tune\
    \ your voice female, emphasize capital letters and make the reader slower.\n```\n\
    \n![](img/45a70445846e93838a23812ca8a9d98d_24_1.png)\n\n## 06 A voice synthesizer\n\
    \nUsing the code listing, we're creating a simple interface with Twitter with\
    \ predetermined voice. Here is how the Espeak can be manipulated to change its\
