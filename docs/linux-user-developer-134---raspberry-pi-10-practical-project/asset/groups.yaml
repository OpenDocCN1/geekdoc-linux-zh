    # Profile your code with gprof


    Use command-line option -fprofile-arcs in calls GCC version is 2.95.x or 3.0


    The profiling data is always saved in a file named gmon.out


    C/C++, Pascal and Fortran 77 programs can be compiled with gprof


    For profiling with gprof, source code should be compiled with the -pg option


    ![](img/45a70445846e93838a23812ca8a9d98d_55_0.png)


    ```

    DESCRIPTION

    "gprof" produces an execution profile of C, Pascal, or Fortran77 programs. The
    effect of called routines is incorporated in the profile of each caller. The profile
    data is taken from the call graph file with default details. Each program that''s
    compiled with the -pg option uses cc, "pc", and "f77". The pg option includes
    links in the versions of library routines that gprof reads the given file (the
    default is gmon.out) and generates its symbol table and call graph file. If more
    than one file is specified, gprof output shows the sum of profile information
    in the cycle.

    ```


    If you use gprof 2.95.x or 3.0 to compile your binaries, you may need to add the
    -profile-arcs to the compile line in order for the call graphs to be reported
    in gmon.out.


    Gprof calculates the amount of time spent in each routine. Next, these times are
    propagated along the edges of the call graph. Cycles are discovered, and calls
    into a cycle are made to share the time of the cycle.


    Several forms of output are available from the analysis.


