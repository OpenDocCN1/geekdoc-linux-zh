    \ E: info@cwcs.co.uk W: www.cwcs.co.uk\n\n# 开源\n06 新闻 | 16 观点 | 92 读者来信\n\n# OGGCAMP\
    \ 2013\n# 自由软件、自由文化与大规模监控\n在 OggCamp 英国最大的自由软件和开源硬件聚会上，450 名极客在斯诺登泄密事件的阴影下聚集\n\
    \n自上世纪末创办《Linux User》以来，开源社区发生了变化并演变——引入了开放数据、自由文化，其活动性质也发生了变化。Linux Expo 和 Linux\
    \ User Expo 是过去由大公司支持 ORG Village 运行的活动，为 FOSS 项目和组织提供了空间。当 IBM 切断对 Linux Expo\
    \ 的资金支持时，这种年度聚会留下了空白，尽管社交网络和社交普及的增长本应可以让人们聚在一起学习新事物并交流，软件人士们错过了一个年度聚会。第一个真正填补这一空白的是\
    \ LugRadio Live，它利用了 Lug Radio 的人气将国际演讲者带到沃尔德汉的一个社区场所，并让 ORG（开放权利组织）等组织有机会告知社区最重要的信息。当\
    \ LugRadio 结束运行后，社区主导的活动接子由 OggCamp 接管，汇聚了自由文化和开放内容轨道。今年秋，OggCamp 将 450 人带到了利物浦约翰·摩尔大学的科学园区，围绕着“学习、教学、游戏”的主题。\n\
