    # OpenSource

    06 News | 16 Opinion | 92 Letters


    # OGGCAMP 2013

    # Free software, free culture & mass surveillance

    At OggCamp, the largest UK gathering of free software and open hardware community,
    450 geeks met under the shadow of the Snowden revelations


    Since the first issue of Linux User at the end of the last century, the free software
    community has changed and evolved - bringing in open data, free culture, and the
    nature of its events has changed. The Linux Expo, and Linux User Expo, events
    of the past that the big companies enabled the ORG Village to run alongside, providing
    space for dozens of FOSS projects and organisations. When IBM cut off the money
    to Linux Expo, a gap was left for some event to facilitate an annual meeting of
    projects and despite the growth of social networks and social popularity to foster
    a community like putting hundreds of people in the same place with opportunities
    to learn new things and talk to each other the software folk missed an annual
    get-together. The first event to really fill the gap was LugRadio Live, harnessing
    the popularity of the Lug Radio brought international speakers to a community
    venue in Wolverhampton, and a chance for groups like ORG (the Open Right Group)
    to inform the community about what matters most. When LugRadio reached the end
    of its run, the mantle of community-led event was taken by OggCamp, bringing together
    free culture and open content tracks. This autumn, OggCamp brought 450 people
    to Liverpool John Moore University''s Science Park, under the banner of Learn,
    Teach, Play.

