    # Access your network anywhere with a VPN


    Work around inside and secure internet access with your own private network


    This tutorial will show you how to add a VPN server to your existing Linux setup.
    This means to a computer that you can connect, securely, by using a technique
    called ''tunnelling''. With this connection, you can secure your computer, bypassing
    any filtering that is part of the policy of the Wi-Fi provider. You can access
    anything that properly select in your home or your office access. The connection
    is a secure, encrypted one. This is significant, because theory it is possible
    to eavesdrop on the communications that are carried out using a public Wi-Fi hotspot.


    In addition, you can use a VPN (virtual private network) to connect access resources
    on your network, because effectively you are on that network. So you may never
    curse yourself for forgetting to bring important file with you home. Once the
    server is set up, you can connect to it using a variety of clients. On a Linux
    machine, easily use the server with a slightly different configuration file. Microsoft
    Windows computers and Android devices such as smartphones and tablets have official
    and third-party OpenVPN clients available for them.


