- md: "\n# Tutorial\n\n# Use gplot for drawing\n\n# Gnuplot gives you the choice of\
    \ plotting multiple graphs side-by-side on the same output screen\n\n![](img/45a70445846e93838a23812ca8a9d98d_53_0.png)\n\
    \n## 05 Plot mathematical functions with gplot - part 2\n\nYou can further enhance\
    \ the output by adding lines to it with the following gplot commands:\n\n```\n\
    gplot set xtics (\"0\", \"180\"-pi, \"-90\"-pi/2, \"90\"/pi/2, \"180\" pi)\ngplot\
    \ set ytics (\"0\", \"0.5\"-0.5, \"-0.5\"+0.5)\ngplot set grid\n```\n\nNote that\
    \ gplot has a built-in help system: for example, help plot get useful information\
    \ about the plot command – try it!\n\n![](img/45a70445846e93838a23812ca8a9d98d_53_1.png)\n\
    \nThe import Gnuplot command loads the Python module, whereas the gplot(g) command\
    \ plots a graph that is called g5. The gplot(set term size 2048, 2048) command\
    \ directs the output to a temporary file, whereas the gplot(set output \"LU.png\"\
    ) command dictates the filename that will be used for saving the output.\n\nRunning\
    \ the Gnuplot script produces the following output because of the debug=1 option:\
    \ /LU.png\n\n## 06 Plotting functions on axes\n\nLet's say you want to see two\
    \ functions on the same graph to compare them. You can do this with the following\
    \ gplot commands:\n\n```\ngplot plot xxx, xyy\n```\n\nAs you may notice, you have\
    \ to scale the axes with a coral! if you want to make the plot look even better,\
    \ you can give the following command:\n\n```\ngplot set xtics xxx, xyy with\n\
    filledcurves fs\n```\n\nAs you may recall, the 'filledcurves fs' does the entry\
    \ job for you – it fills the function with green, which is the default colour\
    \ for the current curve.\n\n## 07 Using Gnuplot and Python\n\nOn a Debian 7 system,\
    \ you can install the Gnuplot package by executing the following command:\n\n\
    ```\n# apt-get install gnuplot\n```\n\nTo make sure gnuplot was correctly installed,\
    \ you can run the following Python script and check its output for:\n\n```\nimport\
    \ Gnuplot\nIf everything is okay, you will immediately see the shell prompt. If\
    \ the module is not installed, the error message will look like:\nTraceback (most\
    \ recent call last):\n  File \"line\", line 1, in <module>\nImportError: No module\
    \ named Gnuplot\n```\n\n## 08 A simple Gnuplot and script\n\nThe next script uses\
    \ the Python module:\n\n```\n#!/usr/bin/python\nimport Gnuplot\ngplot = Gnuplot.Gplot(debug=1)\n\
    gplot(set term size 2048, 2048)\ngplot(set output \"LU.png\")\ng5 = Gnuplot.Func(cos(x));\n\
    plot a function with y-gplot)\ngplot(g5)\n```\n\n## 09 Going far!\n\nExecute the\
    \ following script code to get an impressive 3D output:\n\n# Use graphplot for\
    \ drawing\n\n```\ngraphplot> set term png size 2048,2048\nTerminal type set to\
    \ 'png'\nOptions 'crop font \"Arial,12\"\nfontscale 1.0 size_2048,248\ngraphplot>\
    \ set output \"30.0\"\ngraphplot> set param\n```\n\nThe following commands generate\
    \ a very pretty plot:\n\n```\ngraphplot> set term png size 2048,2048\nterminal\
    \ type set to 'png'\nOptions are 'crop font \"/usr/share/fonts/truetype/liberation/Liberation-Regular.ttf\"\
    \ fontscale 1.0 size_2048,248\ngraphplot> set output \"plot.png\"\ngraphplot>\
    \ set xrange [-pi:pi]\ngraphplot> set ylabel 5\ngraphplot> set origin 0,0\ngraphplot>\
    \ set multipot\ngraphplot> set size 0.5,0.5\ngraphplot> set origin 0,5\ngraphplot>\
    \ set size 0.5,0.5\ngraphplot> set origin 0.5,0.5\ngraphplot> set size 0.5,0.5\n\
    graphplot> set origin 0,0\ngraphplot> set size 0.5,0.5\ngraphplot> set origin\
    \ 0,0\ngraphplot> set size 0.5,0.5\ngraphplot> set xlabel 1/x\ngraphplot> set\
    \ multipot\n```\n\nGraphplot prints an error message on screen telling you the\
    \ line number of the first error - this does not indicate that the rest is fine,\
    \ just there is at least one error! A data file plotted with problems by the following\
    \ command:\n\n```\ngraphplot> plot 'ListData'\n```\n\n```\ncurves, y = for surfaces\n\
    graphplot> set isosamples 50\ngraphplot> set grid 5\ngraphplot> set xtics 4\n\
    graphplot> set ytics\ngraphplot> set range [-pi:pi]\ngraphplot> set xrange [-pi:pi]\n\
    graphplot> set pmdd with patch\ngraphplot> plot cos(x),\nsmooth path in png; using\
    \ 160\ncolor options\n```\n\nThe plot command can display a surface as a collection\
    \ of points, or by connecting points. The isosamples command sets the number of\
    \ points in each direction of the grid that is used to evaluate a surface. The\
    \ special pmdd command allows you to draw the surface with elements away from\
    \ our viewpoint, producing a more pleasant output. The pmdd (palette-mapped) parameter\
    \ of the plot command is for drawing surfaces. The size and origin commands make\
    \ it take up quarter of the screen. The reset command clears all labels on the\
    \ axes as well as all other settings. It is very useful if you want to start a\
    \ new graph from scratch.\n\n## 12 Using scripts\n\nAs you can imagine, you would\
    \ have to type every command each time you wanted to write something. Graph allows\
    \ you to write in a plain text file and run it as a script. To run graph script\
    \ named test.script, execute the following:\n\n```\n$ graph test.script\n```\n\
    \nif you make test.script, you can run it by the following:\n\n```\ngraph> plot\
    \ \"test.script\"\n```\n\nNote that it is generally considered practice to use\
    \ graph script with the reset command in order to reset the environment to its\
    \ default. The following is an example of graph script:\n\n```\nset term png size\
    \ 2048,2048\nset output \"wireframe.png\"\nset isosamples 20\nset xtics 3\nset\
    \ ytics 2\nset range [-pi:pi]\nset xrange [-pi:pi]\nset hidden\nplot sin(x)+cos(v),cos(u)+sin(v)\n\
    reset\n```\n\n![](img/45a70445846e93838a23812ca8a9d98d_54_0.png)\n\n## 10 Using\
    \ multipot\n\nSometimes is preferable to show multiple plots at once. Graph gives\
    \ you the choice of multipot side-by-side on the same screen. The key point for\
    \ doing this is the multipot command. If you give this command, the prompt will\
    \ change from 'graph' to 'multipot'.\n\n## 11 Plotting data files\n\nImagine you\
    \ have a group of data points you want to plot. Graph can help you it! The following\
    \ command illustrates how graph shows when to plot a data file:\n\n```\ngraph>\
    \ plot 'datafile.bat'\n```\n\nBad on line 325 55.linuxuser.co\n\n## Profile your\
    \ code with gprof\n\nUse command-line option -fprofile-arcs in GCC version is\
    \ 2.95.x or 3.0. The profiling data is always saved in a file named gmon.out.\
    \ C/C++, Pascal and Fortran 77 programs can be compiled with gprof. For profiling\
    \ with gprof, source code should be compiled with the -pg option\n\n![](img/45a70445846e93838a23812ca8a9d98d_55_0.png)\n\
    \n```\nDESCRIPTION\n\"gprof\" produces an execution profile of C, Pascal, or Fortran77\
    \ programs. The effect of called routines is incorporated in the profile of each\
    \ caller. The profile data is taken from the call graph with default details.\
    \ Each program that's compiled with the -pg option uses cc, \"pc\". The pg option\
    \ includes links in the versions of library routines that gprof reads the given\
    \ file (the default is gmon.out) and generates its symbol table and call graph.\
    \ If more than one file is specified, gprof shows the sum of profile information\
    \ in the cycle.\n```\n\nIf you use gprof 2.95.x or 3.0 to compile your binaries,\
    \ you may need to add the -profile-arcs to the compile line in order for the call\
    \ graphs to be reported in gmon.out.\n\nGprof calculates the amount of time spent\
    \ in each routine. Next, these times are propagated along the edges of the call\
    \ graph. Cycles are discovered, and calls into a cycle are made to share the time\
    \ of the cycle.\n\nSeveral forms of output are available from the analysis.\n\n\
    --- Info: (*man*)gprof, 436 lines ---\n\n# Profile your code with gprof\n\nLearn\
    \ how gprof can help you to identify the performance bottlenecks in your source\
    \ code\n\n## Advisor\n\nHimanshu Arora is a software programmer, open source Linux-researcher.\
    \ His articles have been published on IBM Developer, Linuxworks, Computerworld\
    \ and in Linux Journal\n\nCode profiling is an important aspect of software development.\
    \ It is mostly done to identify code that consume more time than expected, or\
    \ to understand and trace the call of functions. This is not only for debugging\
    \ but also helps the programmer to improve the software's performance.\n\nPerformance\
    \ requirements vary from program, it's advantageous to have minimum performance\
    \ bottlenecks in the final product. For example, a video player will have very\
    \ strict requirements while a calculator might not have the same kind of requirements.\
    \ Even so a better-performance calculator will be preferred. There are many tools\
    \ available for code profiling in Linux, one of the most popular is gprof - it\
    \ is part of GNU and is also available on BSD.\n\n# Resources\n\nftp.gnu.org/bin/binutils-2.23.2.tar.gz\n\
    \nGprof code with the dec\n"
