    # Welcome to issue 134 of Linux User & Developer


    Bob Zwetloed studied aerospace engineering at university, using Python to model
    complex situations class. This issue our resident staff started with writing a
    few of the Raspberry Pi projects this month however test and feature solving applications
    among other things.


    # This issue


    - >> Linux Mint 16 reviewed

    - >> Get practical with the Pi

    - >> Write better code with Qt

    - >> Take your network anywhere


    Tam Hanna has been in the IT business as journalist, tutor, speaker and author
    for many years. He has seen every aspect of the mobile market there and back.
    This month Tam continues his work with a look at event-driven programming (pages
    46-55).


    Mihalis Tokoulos is a UNIX system administrator with extensive experience since
    1996. He has been using Linux to write for the Linux User & Developer. Mihalis
    shows now his four-page graphics can be found on pages 52-55.


    Michael Reed is a technology writer, and has been writing for Linux over 15 years.
    He specializes in other things. This month Michael tests home or office networks
    with ourselves using the power of virtual private networks.


    This issue also features helping writers event-driven code with Qt, great examples
    and managed projects with Mercurial, an excellent control package we used before
    going to Git. Enjoy the issue!


    James Larson is a kernel hacker who has been working for Linux for over 18 years,
    since he started university at the age of 13. John connects in Cambridge, Massachusetts
    or works for a large Linux vendor. You can find his indispensable Kernel contributions
    on pages 18-19.


    Gareth Halcliffe is our resident reporter and tests the latest from all over the
    open source community. Gareth shares his work on Onstore, a scalable backup solution
    to suit your needs, enterprise or otherwise.


    Welcome to the latest edition of Linux User and the UK and America''s favourite
    open source and Linux magazine. Whenever we talk to friends or readers about Pi
    we find ourselves surprised at just many of them ask when to get one for Christmas.
    They''re really enthusiastic about the prospect of doing something fun with it,
    but because of that, they often admit they haven''t even taken it out. That''s
    why we''ve got another Raspberry Pi projects anyone could turn to: If you''re
    up and running in no time. We''ve included all the projects you can hack the code
    and change it to your needs. Else also features helping writers event-driven code
    with Qt, great examples and managed projects with Mercurial, an excellent control
    package we used before going to Git. Enjoy the issue!


