    Add an additional line of text to the file. Commit this change to see our first
    commit with a different message:

    ```bash

    hg commit -m "My first commit"

    ```


    ## 04 Working with changes


    The system now has a point-in-time copy of your repository. As there are now commits,
    we can revert the previous one if we need to go back to the earlier version, using
    the following command:

    ```bash

    hg update -r 0

    ```


    ## 05 Using Mercurial history


    Perform more changes and commits. To see a list of commits to the repository,
    use the command:

    ```bash

    hg log

    ```

    Hg shows all the commits made over time, with notes added. ''Note: This means
    the current version of the file.'' To see the difference between versions use:

    ```bash

    hg diff

    ```


