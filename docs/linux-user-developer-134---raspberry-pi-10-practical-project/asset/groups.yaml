    \ 工作了超过 18 年，从他 13 岁上大学开始就开始。John 在马萨诸塞州的剑桥市联系，或为一家大型 Linux 供应商工作。你可以在第 18-19\
    \ 页找到他不可或缺的内核贡献。\n\nGareth Halcliffe 是我们的驻记者，测试来自整个开源社区的最新产品。Gareth 分享了关于 Onstore\
    \ 的工作，这是一个适用于你需求（企业或其他）的可扩展备份解决方案。\n\n欢迎阅读 Linux User 最新版，这是英国和美国喜爱的开源和 Linux\
    \ 杂志。当我们与朋友或读者谈论树莓派时，我们总是惊讶地发现有这么多人在问圣诞节什么时候买一个。他们对用它做一些趣事的前景非常热情，但正因如此，他们经常承认甚至还没拿出来。这就是为什么我们又提供了一个任何人都可以上手的树莓派项目：让你能够迅速上手运行。我们包含了所有你可以黑客化并根据需求更改的项目。此外，还包括帮助写作者使用\
    \ Qt 编写事件驱动代码、优秀的示例，以及使用 Mercurial 管理项目——这是我们在转向 Git 之前使用过一个优秀控制包。祝阅读得愉快！\n\n\
