    ### 演示软件


    在我们查看一系列适用于商务或家庭使用的演示应用时，选择出最好的幻灯片软件。


    开源办公套件已经能够适应商业环境很长时间了，在我们之前的组测中，我们指出了商务办公套件被忽视的因素，人们甚至会在家里使用它们，即创建看起来专业的演示文稿的能力，但还有其他替代方案并不总是属于办公套件，并且能提供办公套件可能不具备的功能。首先，你需要能够使用内置工具创建看起来专业的演示文稿。其次，我们想知道该软件与其他演示应用以及它们在此处的演示文的兼容性如何。


    虽然有一些出色的在线幻灯片工具，但大多数并不是开源的，尽管我们在本次测评中包含了一个。我们还排除了一些 PDF 和 LaTeX 演示库，不过，我们在之前的期数（4131）中详细介绍了关于如何使用
    LaTeX 创建专业演示文稿的教程。


