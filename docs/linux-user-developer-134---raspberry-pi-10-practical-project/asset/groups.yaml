    ## 评测


    ## LibreOffice Impress


    ### 我们套件冠军的幻灯片创建器——它与套件的其他部分一样好吗？


    LibreOffice 是一个非常优秀的办公套件，也是真正的开源成功案例。我们将其选为办公套件的冠军，今天我们回来看看 Impress（LibreOffice
    的演示文软件）是否能竞争过其他产品。我们没有看 OpenOffice 的同类产品，但它能超越它的原始拷贝版吗？


    LO 的优势之一是，与其它软件（尤其是微软的版本）相比，虽然 PowerPoint 拥有最好的复制功能，但 Impress 仍然擅长制作各种类型的演示文，而这些在其他软件中无法那么方便地处理。总之，Impress
    包含了你在其他幻灯片软件中过的几乎所有功能，并且多个幻灯片之间的切换效果更好。无论你是在做非常专业的商务演示，还是稍微非正式一点，Impress 中都提供了所有必要的图表和动画供使用。


