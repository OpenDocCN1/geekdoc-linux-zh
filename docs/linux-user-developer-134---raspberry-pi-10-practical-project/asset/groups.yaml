- md: "\n# 10 Practical Raspberry Pi Projects\n\n## Make a game with Python\n\nRob\
    \ Zwetsloot models complex systems and is a web developer in Python, Django and\
    \ PHP. He also loves to experiment with computing.\n\n# Update the retro classic\
    \ Pong for the Linux generation with a new library called SimpleGUIK\n\n## What\
    \ you'll need\n\n- Latest version of Raspian: www.raspberrypi.org/downloads\n\
    - Pillow: https://github.com/python-image/\n- SimpleGUIK: https://github.com/dohlin/simpleguitk/\n\
    \nThe Raspberry Pi is a fantastic way to start learning to code. One area that\
    \ can be very rewarding for amateur coders is game programming, allowing for a\
    \ more interactive and result-oriented approach. Game programming can also teach\
    \ improvement and advanced programming skills. Using the SimpleGUIK module in\
    \ Python is a very straightforward way of creating graphical interfaces based\
    \ on Tkinter.\n\n## 01 Python module preparation\n\nHead to the websites we've\
    \ listed in 'You'll need' and download a zip of the source files from the GitHub\
    \ pages. Update your Raspberry Pi packages and install the following:\n\n```\n\
    $ sudo apt-get install python-dev python-setup-tools tk-dev\n```\n\n## 02 Install\
    \ the modules\n\nOpen the terminal and use cd to move to the extracted Pillow\
    \ folder. Once there:\n\n```\n$ sudo setup.py install\n```\n\nOnce that's complete,\
    \ move to the simpleguitk folder and use the same command to install that as well.\n\
    \nRob got off to a good start, but it was all downhill from there...\n\n## 03\
    \ Write your code\n\nLaunch IDLE 2, or IDLE 3 and open a new window. Use the code\
    \ to create our game 'Tuo' for 'Two'. Be careful to follow along with the code\
    \ to make sure you're doing it. This way, you can make your changes to the game\
    \ easily.\n\n## 04 Set up the game\n\nTuo's and the initial positions are set,\
    \ along with the initial speed and direction of Tux. These are also used when\
    \ a point is won and the playing field is reset. The direction and speed is set\
    \ to random each spawn.\n\n## 05 The SimpleGUI code\n\nThe important parts in\
    \ the draw function are draw_line, draw_image and draw_text. These are specifically\
    \ from SimpleGUI and allow you to easily put objects on the screen with a position,\
    \ size and colour. You need to do them in order, or in this case, canvas.\n\n\
    ## 06 Layout setup\n\nThe last parts are for the interface. The code tells what\
    \ to do when it is pressed and released, and gives it a frame in work. This is\
    \ then what functions handle the graphics, keys and events. Finally, we give frame.start()\
    \ it starts.\n\n## Full list code\n\n```python\nimport simplegui as simplegui\n\
    import random\n\nw = 60\nh = 400\ntux_r = 20\npad_w = 8\npad_h = 8\n\ndef spawn(right):\n\
    \    global tux_x, tux_y\n    tux_x = [0]\n    tux_y = [0]\n    tux_y = [pad_h/2]\n\
    \    if right:\n        tux_x = random.randint(2, 4)\n    else:\n        tux_x\
    \ = random.randint(2, 4)\n        tux_x = random.randint(1, 3)\n\ndef draw(canvas):\n\
    \    global score, score2, paddle_pos, paddle_vel\n    score = 0\n    score2 =\
    \ 0\n    tux(random.choice([True, False]))\npaddle_pos = [pad_w/2, pad_h/2]\n\
    paddle_vel = [0, 0]\n\nif paddle_pos[0] > (h - pad_w/2):\n    paddle_pos[0] =\
    \ h - pad_w/2\nif paddle_pos[0] < pad_w/2:\n    paddle_pos[0] = pad_w/2\npaddle_vel\
    \ = [0, 0]\n\ncanvas.draw_line(w/2, 0, w, 4, \"Green\")\ncanvas.draw_image(paddle_pos[0],\
    \ paddle_pos[1], pad_w, pad_h, \"Blue\")\ncanvas.draw_image(paddle_pos[0], paddle_pos[1],\
    \ pad_w, pad_h, \"Green\")\n[w] - (pad_w/2)\ntux_pos = [tux_x, [0]]\ntux_pos[0]\
    \ += tux_vel[0]\nif tux_pos[0] >= w:\n    tux_pos[0] += tux_vel[0]\nif tux_pos[0]\
    \ <= 0:\n    tux_pos[0] += tux_vel[0]\n```\n\n```python\nif (paddle_pos[0]-pad_h/2)\
    \ >= tux_pos[0] >= (paddle_pos[0]+pad_h/2):\n    tux_vel[0] = -tux_vel[0]*1.1\n\
    \    tux_vel[1] = 1.1\n    score += 1\n    tux.spawn(True)\nelif (paddle_pos[0]-pad_h/2)\
    \ <= tux_pos[0] <= (paddle_pos[0]+pad_h/2):\n    tux_vel[0] = -tux_vel[0]*1.1\n\
    \    tux_vel[1] = 1.1\n    score2 += 1\n    tux.spawn(False)\n\ncanvas.draw_image(tux,\
    \ (265 / 2, 314), (265, 314), \"Green\")\ncanvas.draw_text(score, 150, 80, \"\
    Green\")\ncanvas.draw_text(score2, 450, 80, \"Green\")\n\ndef keyup(key):\n  \
    \  global paddle_pos, paddle_vel\n    acc = -1\n    paddle_vel = acc\ndef keydown(key):\n\
    \    global paddle_pos, paddle_vel\n    acc = 1\n    if key == \"simpleGUI.KEY_MAP[\"\
    left\"]\":\n        paddle_vel = acc\nelif key == \"simpleGUI.KEY_MAP[\"right\"\
    ]\":\n        paddle_vel = acc\nelif key == \"simpleGUI.KEY_MAP[\"up\"]\":\n \
    \       paddle_vel = acc\nelif key == \"simpleGUI.KEY_MAP[\"down\"]\":\n     \
    \   paddle_vel = acc\n```\n\n```python\nframe = simplegui.create_frame(\"Tuo for\
    \ Two\", w, h)\nframe.set_draw_handler(draw)\nframe.set_key_handler(keyup)\nframe\
    \ = simplegui.load_image(\"http://upload.wikimedia.org/wikipedia/commons/a/tux.png\"\
    )\nframe.start()\n```\n\n# Raspberry Pi motion animation\n\nRussell Barnes is\
    \ the editor of Linux User magazine which has been in technology for over 15 years.\
    \ He still plays with Lego... Fancy yourself as the next stop-motion studio and\
    \ see what you can do\n\n## What you'll need\n\n- Latest version of Raspian: www.raspberrypi.org/downloads\n\
    - picamera module: picamera.readthedocs.org/\n- Raspberry Pi camera module: pygame.org\n\
    \nThe Raspberry Pi camera module opens the door for your projects to incorporate\
    \ aspects of photography and making movies. We're combining both to create a fully\
    \ featured stop-motion camera using Raspberry Pi which makes it incredibly easy\
    \ to create HD animations. A pure Python interface ensures our images can be displayed\
    \ on demand.\n\n## 01 Set up the camera\n\nFirst things, you need to make sure\
    \ your Raspberry is up to date. In the terminal, type:\n\n```\nsudo apt-get update\
    \ && sudo apt-get upgrade\n```\n\nNext we need to update the Pi firmware and ensure\
    \ camera module is enabled. Bear in mind that this takes some time.\n\n```\nsudo\
