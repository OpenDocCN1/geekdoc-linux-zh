- md: "\n# Profile your code with gprof\n\nTUTORIAL\n\n## 01 Compile profiling-enabled\
    \ code\n\nIn order to profile a program, the first step is to enable profiling\
    \ while the code is being compiled and linked. In most cases, the command line\
    \ -pg should enable profiling. If compilation and linking commands are used separately,\
    \ then this option is to be used in both cases. For example:\n\nThis file contains\
    \ the profiling data of the code blocks that were actually hit during the program\
    \ execution. It is not a regular text file and cannot be read normally. This can\
    \ be confirmed by using the file gmon.out in Linux.\n\n![](img/45a70445846e93838a23812ca8a9d98d_56_0.png)\n\
    \n```\ngcc -Wall Sample.c -o Sample-code\ngcc Sample.o -o Sample-code\n```\n\n\
    And if compilation and linking is done in the same command then this option also\
    \ needs to be added. For example:\n\n```\ngcc -Wall Sample.c -o Sample-code\n\
    ```\n\n```\nfile gmon.out\ngmon.out: GNU profile performance data - version 1\n\
    ```\n\n```\n// Sample Code (Sample.c) used\nthroughout this article:\n#include\
    \ <stdio.h>\n\nint count;\nvoid func_c(void)\n{\n    count++;\n}\nvoid func_a(void)\n\
    {\n    int i = 10000000;\n    while (i--) {\n        func_c();\n    }\n    return;\n\
    }\n```\n\n> Note 1: The file gmon.out is not produced if the program terminates\
    \ abnormally, by an unhandled signal, or by exit() function call.\n\n> Note 2:\
    \ This file is created in the working directory of the program at the time of\
    \ its exit. So, make sure the program has run normally.\n\n> Note 3: A-profiling\
    \ program produces a file named gmon.out, so make sure this file exists with this\
    \ name.\n\n## 02 Execute the binary - part 1\n\nAfter the program is compiled\
    \ (and linked) the next step is to execute it. It is important to remember that\
    \ the profiling execution should happen in such way that all the code (at least\
    \ the ones you want to profile) is executed. So, command-line arguments and inputs\
    \ are given to the program accordingly.\n\nHere is how to profile the executable\
    \ program \"Sample-code\":\n\n```\n/Sample\nCount = [100000000]\n```\n\nSo you\
    \ can see the \"Sample-code\" executed and ended.\n\n> Note 4: Execute gprof.\
    \ Once the profiling-data file is available, the tool can be used to analyze and\
    \ produce meaningful data from it. Here is the syntax of gprof command:\n\n##\
    \ 03 Execute the binary - part 2\n\nOnce the program is executed, it produces\
    \ a file named gmon.out.\n\n```\nismon.out\ngmon.out\n```\n\n```\ngprof [command-options]\
    \ [executable-name] [profiling-data-file] [output-file]\n```\n\ngprof accepts\
    \ the executable filename and command-line options to produce profiling information\
    \ which can be redirected to an output file.\n\nBut note, the command-line tool\
    \ itself does not require any arguments [they are not mandatory]. When no argument\
    \ is supplied, gprof looks for a as the executable-name and gmon.out as the profiling-data-file\
    \ in the current directory, and the output is produced on standard output - stdout.\n\
    \nLet's run our command:\n\n```\ngprof sample gmon.out -o prof_output\n```\n\n\
    The command above redirects the output to a file named prof_output. This file\
    \ will now contain human-readable profiling information in form of a flat file\
    \ and graph (more on later).\n\n![](img/45a70445846e93838a23812ca8a9d98d_56_1.png)\n\
    \nThe environment used for this tutorial is built on Ubuntu 13.04\n\n```c\nprintf(\"\
    \\n Count = [%d]\\n\", count);\nreturn 0;\n```\n\n# Tutorial Profile your code\
    \ with gprof\n\n![](img/45a70445846e93838a23812ca8a9d98d_57_0.png)\n\nindex is\
    \ in parentheses, it shows where it would appear in the gprof listing if it were\
    \ to be printed.\n\n## Call graph\n\nThe Call Graph (see screen below), for each\
    \ function, which functions called, and other functions, and how many times each\
    \ was spent in subroutines of each function. This can suggest places where you\
    \ might try to eliminate calls that use a lot of time.\n\nEach entry in the list\
    \ has the index number at the left. Vertical lines and the lines below it list\
    \ the functions called. The current margin lists the functions that called this\
    \ function, and its children. One line lists:\n\n- index - Number assigned to\
    \ each element of the table. Indices are sorted numerically. The index number\
    \ is printed next to function name, making it easy to look up where function is\
    \ in the table.\n- %Time - The percentage of time spent in this function and its\
    \ children. Note that due to different viewpoints, these will not add up to 100%.\n\
    - %self - The total amount of time spent in function. For the function's parents,\
    \ this is the amount of time which runs most cycles, it is stated concisely here.\
    \ The different columns in Flat Profile represent:\n\n- %Time - The percentage\
    \ of total running time of the program used by this function\n- cumulative - A\
    \ running sum of seconds accounted for this function and listed above.\n- self\
    \ - The number of seconds accounted for function alone.\n- calls - The number\
    \ of times this function was invoked (if it is profiled, itself).\n- name - The\
    \ name of the function. This shows the location of function in the gprof listing\
    \ if\n\n| index | %Time | self | children | calls | name |\n|---|---|---|---|---|---|\n\
    | 1 | 77.00 | 3.37 | 73.63 | 1 | main |\n| 2 | 14.50 | 0.51 | 14.00 | 5 | func_c\
    \ |\n| 3 | 14.50 | 0.51 | 14.00 | 5 | func_b |\n| 4 | 22.3 | 0.08 | 22.00 | 4\
    \ | parent |\n| 5 | 21.02 | 0.51 | 20.51 | 5 | func_a |\n\n![](img/45a70445846e93838a23812ca8a9d9d_57_1.png)\n\
    \n## 05 Annotated source\n\nThe annotated source gives us an idea about the number\
    \ of times each function was executed. To get the annotated list, compile with\
    \ the -g flag. First compile the source code with the -g option. This option enables\
    \ debugging:\n\n```\ngcc -g sample.c -o sampleCode\n```\n\nNext, run the gprof\
    \ command, use the command-line -o option to produce the annotated source:\n\n\
    ## 06 Flat profile\n\nThe Flat profile (see screen below) shows how much time\
    \ spent in each function, and how many times a function was called. If you simply\
    \ want to know\n\n```gprof sampleCode -out gprof.out\n```\n\n## 07 Call graph\n\
    \nIndex by function name\n\n| |\n| [4] | flat_dummy |\n| [2] | func_b |\n| [3]\
    \ | func_a |\n| [5] | func_c |\n\n## 08 Exclude a particular function\n\nIdentify\
    \ the bottleneck lines in your program's source code directly from this parent.\
    \ For the function's children, directly from this is amount of time that was propagated\
    \ directly into the function.\n\n- children - This is the total amount of time\
    \ propagated into it by its children. For the function's parent, it is the amount\
    \ of time that was propagated from the function children.\n- called - This is\
    \ the number of times the function was called. If the function called recursively,\
    \ the number only includes non-recursive calls followed by -n of recursive calls.\n\
    - For the function's parent, this is the number of time the function's parent\
    \ was called/ the total time that the function was called. For the function's\
    \ children, this is the number of function it called/ the total number the child\
    \ was called.\n- Name - The name of the function. The index is printed after it.\
    \ If a function name is overloaded, the cyclic name is printed between the function's\
    \ name and the index. For the function's parent, this is the name of For the function's\
    \ children, this is the name of the child.\n\n> Code profiling not only helps\
    \ in debugging many tricky problems, but also helps the programmer to improve\
    \ the software's performance\n\n```\ngprof -b -Pfunc -Qfunc -a samplecode gmon.out\
    \ flat.profile\n```\n\n## 09 Profile a particular function\n\nEach call counts\
    \ as 0.01 seconds.\n\n| index | self | children | name | total |\n|---|---|---|---|---|\n\
    | 1 | 1.00 | 0.00 | func_a [1] | main (2) |\n| 2 | 0.00 | 5.00 | func_c [3] |\
    \ 5.00 |\n| 3 | 0.00 | 0.0000000000000000 | func_a [1] | 0.00 |\n| 4 | 0.00 |\
    \ 0.0000000000000000 | func_b [4] | 0.00 |\n| 5 | 0.00 | 0.0000000000000000 |\
    \ func_c [3] | 0.00 |\n\ncumulative seconds calls/call\n\ngranularity: each hit\
    \ covers 2(s) for 0.77 of 1.30 seconds\n\ncall graph\n\nIndex by function name\n\
    \n| [1] | func_a | | [4] | func_b | [3] | func_c |\n\n## 10 Suppress verbose bubbles\n\
    \nBy default, the gprof output contains detailed explanation of each column of\
    \ flat profile and graph. This is good for beginners, but you want to suppress\
    \ details you know everything. The command-line option -b (or -brief) can be used\
    \ for this purpose.\n"
