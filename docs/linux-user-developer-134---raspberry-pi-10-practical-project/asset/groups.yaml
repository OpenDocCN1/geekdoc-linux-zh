  - "[PAGE 56]\n\n# # Profile your code with gprof\n\nTUTORIAL\n\n# 01 Compile profiling-enabled\
    \ code\n\nIn order to profile a program, the first step is to enable profiling\
    \ while the code is being compiled and linked. In most cases, the command line\
    \ -pg should enable profiling. If compilation and linking commands are used separately,\
    \ then this option is to be used in both cases. For example:\n\nThis file contains\
    \ the profiling data of the code blocks that were actually hit during the program\
    \ execution. It is not a regular text file and cannot be read normally. This can\
    \ be confirmed by using the file gmon.out in Linux.\n\n![](img/45a70445846e93838a23812ca8a9d98d_56_0.png)\n\
    \n```\ngcc -Wall Sample.c -o Sample-code\ngcc Sample.o -o Sample-code\n```\n\n\
    And if compilation and linking is done in the same command then this option also\
    \ needs to be added. For example:\n\n```\ngcc -Wall Sample.c -o Sample-code\n\
    ```\n\n```\nfile gmon.out\ngmon.out: GNU profile performance data - version 1\n\
    ```\n\n```\n// Sample Code (Sample.c) used\nthroughout this article:\n#include\
    \ <stdio.h>\n\nint count;\nvoid func_c(void)\n{\n    count++;\n}\nvoid func_a(void)\n\
    {\n    int i = 10000000;\n    while (i--) {\n        func_c();\n    }\n    return;\n\
    }\n```\n\n> Note 1: The file gmon.out is not produced if the program terminates\
    \ abnormally, by an unhandled signal, or by exit() function call.\n\n> Note 2:\
    \ This file is created in the working directory of the program at the time of\
    \ its exit. So, make sure the program has run normally.\n\n> Note 3: A-profiling\
    \ program produces a file named gmon.out, so make sure this file exists with this\
    \ name.\n\n# 02 Execute the binary - part 1\n\nAfter the program is compiled (and\
    \ linked) the next step is to execute it. It is important to remember that the\
    \ profiling execution should happen in such way that all the code (at least the\
    \ ones you want to profile) is executed. So, command-line arguments and inputs\
    \ are given to the program accordingly.\n\nHere is how to profile the executable\
    \ program \"Sample-code\":\n\n```\n/Sample\nCount = [100000000]\n```\n\nSo you\
    \ can see the \"Sample-code\" executed and ended.\n\n> Note 4: Execute gprof.\
    \ Once the profiling-data file is available, the tool can be used to analyze and\
    \ produce meaningful data from it. Here is the syntax of gprof command:\n\n# 03\
    \ Execute the binary - part 2\n\nOnce the program is executed, it produces a file\
    \ named gmon.out.\n\n```\nismon.out\ngmon.out\n```\n\n```\ngprof [command-options]\
    \ [executable-name] [profiling-data-file] [output-file]\n```\n\ngprof accepts\
    \ the executable filename and command-line options to produce profiling information\
    \ which can be redirected to an output file.\n\nBut note, the command-line tool\
    \ itself does not require any arguments [they are not mandatory]. When no argument\
    \ is supplied, gprof looks for a as the executable-name and gmon.out as the profiling-data-file\
    \ in the current directory, and the output is produced on standard output - stdout.\n\
    \nLet's run our command:\n\n```\ngprof sample gmon.out -o prof_output\n```\n\n\
    The command above redirects the output to a file named prof_output. This file\
    \ will now contain human-readable profiling information in form of a flat file\
    \ and graph (more on later).\n\n![](img/45a70445846e93838a23812ca8a9d98d_56_1.png)\n\
    \nThe environment used for this tutorial is built on Ubuntu 13.04\n\n```\nprintf(\"\
    \\n Count = [%d]\\n\", count);\nreturn 0;\n```\n\n57 www.linuxux.co.uk"
