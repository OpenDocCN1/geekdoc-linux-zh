  md: '# Review


    ![](img/df15b709d7e8fa8f2cd7af7eb08775e7_81_0.png)


    # Mini PC


    # # CuBox-i4Pro


    With a quad-core processor, 2GB of RAM and integrated Wi-Fi and Bluetooth, the
    CuBox-i4Pro an arm entry point for home theatre?


    At first glance, the CuBox-i seems largely unchanged from its predecessor reviewed
    back in issue 123. It has the same 5mm footprint, the same black finish, the same
    ports at the back and infrared receiver at the front. Even unit remains the same
    motherboard layout and angled headset jack we are all familiar with:


    The top-end CuBox-i4Pro, as reviewed, also features a chip antenna connected to
    a built-in 802.1b/g/n Wi-Fi Bluetooth radio. While it would have been nice to
    see a connector for an SD card or a slot where SolidRun would have placed one,
    the CuBox makes no millimetre difference within the black casing.


    The CuBox-i4Pro features the Freescale MX6 Quad, a system-chip (SoC) design with
    four iMX6 ARM processors. For those shopping on a budget, the CuBox-i is also
    available with the mid-range iMX6 Dual at £99 and with the wireless features removed
    at £89. Up to the 800MHz Marvell Armada of the original CuBox, any model would
    represent a considerable upgrade.


    A bundle microSD card arrived inserted into the rear, and it''s loaded with a
    version of Google Android operating system. Interestingly, SolidRun had to avoid
    the effort of seeking the certifications required to get Google Mail, YouTube,
    Google Maps and full access to Google Play Play straight out of the box. An even
    newer build, based on the latest Android 4.4 KitKat branch, can be downloaded
    from SolidRun''s website (www.solid-run.com) and provides an entirely desktop
    Android environment.'
