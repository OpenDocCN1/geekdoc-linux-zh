  md: '# # Back up to the cloud

    Automatically back up and send directly to the cloud


    # **TUTORIAL**


    ![](img/df15b709d7e8fa8f2cd7af7eb08775e7_36_0.png)


    # ## 01 Grab luckyBackup


    Install luckyBackup, a great little backing-up application for scheduling features,
    customisable tasks and for profiling groups tasks. Install it from your repository;
    the package name is luckybackup.


    # ## 04 Test task


    Before we go any further, it''s best to test the task you''ve created. Click the
    checkbox for the task and it will display a triangle to tell you that you haven''t
    done a backup yet. Run the first backup of these files and let us if there are
    any errors.


    ![](img/df15b709d7e8fa8f2cd7af7eb08775e7_36_1.png)


    # ## 02 Set up profiles


    Back up your important documents - we''ll assume you keep them in Documents, in
    your home directory, but if they are anywhere else switch that out for Documents.
    Go Add Undertask to task.


    # ## 05 First scheduling


    On the main menu, click on the symbol next to the red bubble when you select backup
    window. Here you can set when backups are performed, during the day, day and even
    on a per-profile basis and also be revoked at rate.


    ![](img/df15b709d7e8fa8f2cd7af7eb08775e7_36_2.png)


    # ## 07 Choose a cloud


    Any cloud service will be fine for our purposes, however main concern is space.
    Documents won''t take up much space at all - but only the videos and images you
    plan to upload then the space begins to increase rapidly. Choose your service
    wisely.


    # ## 08 Connecting to the cloud


    Cloud storage depends on Linux, we will create a folder in the home directory
    for syncing files or let if you''re using a cloud space for other files, we suggest
    creating a backup folder inside the sync folder to work with.


    # ## 03 Task settings


    Make whatever task you wish to back up whatever it is, choose the Documents as
    source and, for, create a new folder called ''backup'' for the backed-up files.
    Keep the type field the same. The benefit of backing up this task is one that
    only new or updated files get included.


    # ## 06 Extra


    The scheduling is performed per profile, if you have different wants to back up
    at different times then you''ll have to create separate profiles. You can group
    tasks under one if you need to back up multiple locations at once using Profile/New.


    ![](img/df15b709d7e8fa8f2cd7af7eb08775e7_36_3.png)'
