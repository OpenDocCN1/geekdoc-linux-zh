    # 14 Upload to screens


    Once, you will need to view the OBS interface by entering the IP address into
    another computer. Since you are using a wireless connection, the IP address may
    be different from the previous one. Click the ''Add Asset'' option on the top
    right-hand side, which will launch a pop-up window. Select Image from the drop
    box and click OK, then you have the option of uploading the image from your local.
    Enter the start and end date of when this image should appear, and how long it
    should appear on screen, then press Save. Repeat this step for each of the pictures.


    Above Once fully configured, load your pictures and video to complete your digital
    photo frame.


    # 15 Test with video and media


    Screens are great, but Screen also allows you to display videos (with audio) and
    web pages, which is a huge benefit. This is perfect if you want to enhance your
    digital photo frame even further or perhaps display the local weather and news
    to keep yourself informed! Plug in speaker - we used the mini speaker (from bit.ly/3tecbBN2)
    or anything else.


    # 16 Put in place and enjoy!


    Once you have got everything set up and loaded all of your pictures and videos
    onto it via the web interface, move the stand (if you have one) by holding the
    top and back and dragging it downwards and backwards. Stretch the front-middle
    leads a bit wider to get a good base and align the screens from top to bottom.
    Now you are ready to give them perfect home experience - it''s on the mantelpiece
    of forever!


    # 17 Other ideas


    In this tutorial we have got just one free application of Screenly and the HDMI.
    You can use this powerful tool to configure your own digital signage share screens
    in schools and clubs, or as a public using a suitable web page. Whatever you make,
    please do feel free to take more pictures and show them to us!


    # Access Screenly from afar


    The default Screenly installation is essentially software running on Raspberry
    Pi OS. This means SSH via command line, as default user is ''pi'' with password
    in Step 1) is now possible command, as well as accessing the Screenly dashboard
    remotely. We recommend using SSH to connect from your router network by setting
    up SSH on your Pi, and port forwarding port 8080.


