  md: "# # Tutorial LinuxDeveloper\n\n## 07 The signal(function)\nThe signal(function),\
    \ which we use in our example code, takes two arguments: the first is the number\
    \ of the signal. The second argument is a function handler: if the value is SIGDFL,\
    \ default handling for when signal occurs is SIGIGN if the signal is you intend.\
    \ Otherwise, it must be a valid function name that will be called when the signal\
    \ occurs, which is handler_user. New applications should use sigaction() instead\
    \ of signal().\n\n```\n```c\n// Define the handler\nvoid handle_user(int sig)\
    \ {\n    printf(\"Caught signal %d\\n\", sig);\n}\n\n// Register the handler\n\
    int main() {\n    struct sigaction sa;\n    sa.sa_handler = handle_user;\n   \
    \ sigemptyset(&sa.sa_mask);\n    sa.sa_flags = 0;\n    sigaction(SIGINT, &sa,\
    \ NULL);\n\n    while (1) {\n        sleep(1);\n    }\n    return 0;\n}\n```\n\
    ```\n\n![](img/df15b709d7e8fa8f2cd7af7eb08775e7_49_0.png)\n\n# ## 12 How Apache\
    \ handles signals\n\nThe Apache parent process can handle the TERM, HUP, and WINCH\
    \ signals. The TERM signal ends the Apache process in a way that should only be\
    \ used in extreme situations.\n\nThe HUP causes the Apache parent process to advise\
    \ the children to exit their current request. After the parent reloads the configuration\
    \ files, it restarts the children. If configuration errors happen in it, it will\
    \ exit with an error.\n\nThe WINCH signal advises the job as the USRL but to wait\
    \ for the children to exit gracefully, if it wants.\n\nThe WINCH or graceful-stop\
    \ signal allows the Apache parent process to advise the children to exit immediately,\
    \ remove its PID file and stop collecting without quitting. All of them will quit\
    \ itself. This is very might when upgrading Apache if it can cause deadlock and\
    \ race conditions.\n\nOn a Debian 7, the process ID of Apache can be found in\
    \ the /var/run/apache2.pid file.\n\n# ## 09 Handling two signals\n\nThe code of\
    \ our example 'handler.c' shows many ways to handle multiple signals. This time,\
    \ your program will handle two signals, SIGUSR1 and SIGINT, using a different\
    \ function for each signal. Separating them is easy, but you will need more than\
    \ just code.\n\nThe problem is that you have to explicitly register each, which\
    \ is es tough if you are supporting more signals, but there is no other way to\
    \ do it. To handle multiple signals efficiently:\n\n```\n```c\n// Register the\
    \ handler\nvoid handle_sig1(int sig) {\n    printf(\"Caught signal %d\\n\", sig);\n\
    }\n\nvoid handle_sig2(int sig) {\n    printf(\"Caught signal %d\\n\", sig);\n\
    }\n\nint main() {\n    struct sigaction sa;\n    sa.sa_handler = handle_sig1;\n\
    \    sigemptyset(&sa.sa_mask);\n    sa.sa_flags = 0;\n    sigaction(SIGUSR1, &sa,\
    \ NULL);\n\n    sa.sa_handler = handle_sig2;\n    sigemptyset(&sa.sa_mask);\n\
    \    sa.sa_flags = 0;\n    sigaction(SIGINT, &sa, NULL);\n\n    while (1) {\n\
    \        sleep(1);\n    }\n    return 0;\n}\n```\n```\n\n# ## 08 The SIGAL\n\n\
    Compiling and running the code produces:\n\n```\n```\n$ gcc alarm.c -o alarm\n\
    $ ./alarm\nYou have only 10 seconds to type your:\nToo late... Please try again...\n\
    Too late... Please try again...\n```\n```\n\n# ## 10 The (raise)\n\nA process\
    \ sends a signal to itself with the help of raise(). It is very simple to use\
    \ and you have no problem including it in your programs. The signal call takes\
    \ two arguments, the signal number and the name of the see (see 'raise(2)').\n\
    \n# ## 11 Real work with signal handler\n\nThe most important task of a signal\
    \ handler is to make sure that the data is consistent. When a signal handler is\
    \ triggered, the program is interrupted. Think of it as an object destructor in\
    \ object-oriented programming terminology.\n\n# ## 13 system(signal)\n\nThe system()\
    \ call has the same basic effect as signal(). It can offer more control but it\
    \ also adds more complexity to your program. You can use specifically additional\
    \ flag to control when the signal is generated or how the handler is invoked.\
    \ When a handler is installed, it normally remains installed until another signal(ion)\
    \ call is made.\n\nMathis\nMelios\n\n50.linuxuxer.com"
