    \ by \"man kill\",\n\nThis is the full C code for the basic handling of the SIGINT\
    \ and SIGUSR1 signals\n\n# # Master UNIX signal handling\n\n# ## Learn how to\
    \ useise signals and handle them in C\n\n+   - Advisor\n  - **Mhalis Tsoukalos**\n\
    \    A UNIX administrator, programmer (UNIX and iOS), DBA and mathematician. He\
    \ has been using Unix since 1993\n- Resources\n  - A text editor\n  - A compiler\n\
    \nUNIX signals are asynchronous interrupts that offer a way of handling asynchronous\
    \ events on a UNIX system. Every application, from web servers to games, must\
    \ be able to deal with users waiting for input, reading from a file or handling\
    \ network events. This article covers the basics of most important signals and\
    \ shows how to manage them in your Linux applications.\n\nEach signal is identified\
    \ by name or numeric value, but using the signal name is easier to remember and\
    \ the recommended way. In order to send a signal to a running application, you\
    \ should have the required UNIX privileges. If you are the root user, you can\
    \ send\n\nany running process any signal you want. Signals are important for avoiding\
    \ blocking situations and blocking can happen when waiting for input, reading\
    \ from a file or handling network events. This article provides code examples\
