  md: "# # Master UNIX signal handling\n\nUtilise signals and program their handling\
    \ in C TUTORIAL\n\nIts first argument specifies a signal number as usual. Both\
    \ the second and third arguments are pointers to a structure called sigaction.\
    \ This structure specifies how the process handles the signal (See 'sigaction.c')\n\
    It is highly recommended that you use sigmask instead of signal because sigmask\
    \ is more reliable.\nThe combination of these two functions allows you to block\
    \ and unblock signals which are generally used for protecting critical regions\
    \ of code from being interrupted by other signals. The collection of signals that\
    \ are currently blocked is the signal mask. Each process has its own signal mask.\n\
    First, you block the signal and then after the code has completed, you unsignal\
    \ with the signal mask that was returned by sigmask().\\As you already know from\
    \ Step 04, it is possible to send SIGKILL or SIGSTOP if you add a new signal to\
    \ the mask.\n\n# ## 14 sigmask() and functions\n\n```\n#!/usr/bin/perl -w\nuse\
    \ warnings;\nuse strict;\n$SIG{INT} = $sub { print \"Caught a SIGINT: \\$!\\n\"\
    ; };\n trap $handler handler_error_handler_error-signals;\n$sub error_signal_handler;\n\
    while(1) {\n  print \"An error signal: \\!\\n\";\n  sleep(30);\n}\n```\n\n# 17\
    \ Signal handling in Python\n\n# ## 16 Sigaction offers more control\nit it also\
    \ adds complexity\n\n![](img/df15b709d7e8fa8f2cd7af7eb08775e7_50_0.png)\n\n16\
    \ Signal handling in Perl\\Perl has two ways of handling signals: using the %SIG\
    \ hash or the signal trap. The program understands three groups of signals: synchronous\
    \ (HUP, SIGINT, INT, and TERM) and asynchronous (ALRM, ABRT, BUS, FPE, FFL, FILL,\
    \ FILL, SYS, and TRAP) and trap (PIPE, QUIT, SYS, TERM, and TRAP).\nOur example\
    \ 'signals.pl' uses both methods, but usually you only use one of them.\n\n```\n\
    import os, sys\nimport signal\n\ndef handler(sign, frame):\n    print(f\"Caught\
    \ {sign}\")\n    sys.exit(0)\n\nsignal.signal(signal.SIGINT, handler)\nsignal.signal(signal.SIGTERM,\
    \ handler)\n\nwhile True:\n    time.sleep(1)\n```\n\n# 17 Signal handling in Python\n\
    \nThe way of handling signals in Python is similar. The example program 'signals.py'\
    \ handles the SIGINT signal because it is the most frequently used.\n\n```\n$\
    \ /signals.pl\n\"Caught a SIGINT: Interrupted system call\n```\n\n+   -| Stopped\
    \ | /signals.pl\n\n```\n$ /signals.c\n$ ps ax grep signals | grep -v grep\n32431\
    \ pts/0 0:00 /usr/bin/perl\n```\n\n```\n$ $kill 32431\nAn error signal caught!\n\
    ```\n\n```\n$ An error signal caught!\n$ $kill -HUP 32431\n```\n\n```\n$ //...signals.pl\n\
    ```\n\n+   -| Hangued\n$ ps ax grep signals | grep -v grep\n\n```\n$ python signals.py\n\
    ```\n\n+   -| Stopped \\$CSTOP Interrupting me!\n- \\$CSTOP Interrupting me!\n\
    \n+   -| Stopped python signals.py\n-| Killed \\$1\n-| Stopped python signals.py\n\
    \n# ## 15 Signal sets\n\nA very important feature is the ability to include multiple\
    \ signals in one set. You will need to use a data type to represent a signal mask.\
    \ sigsettype(sets the bits in mask), sigfillset(sets all bits in the mask), sigmask(sets\
    \ the bits that are set), sigmaskset(the bit that represents a specific signal)\
    \ and sigisready(checks the status of a signal in a mask). The presented example\
    \ 'SignalSet.c' handles SIGUSR1 and SIGINT and all other signals.\n\n51 www.linuxuser.com"
