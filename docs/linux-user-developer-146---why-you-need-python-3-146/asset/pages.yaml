  md: '# Tutorial


    # # Win a Ras Pi speaker

    Enter now at

    bit.ly/1u8ipwv


    # # Set up a wireless AirPlay speaker


    Combine a Raspberry Pi, a Wi-Fi dongle and your speakers with an amplifier to
    create a wireless stereo system


    ![](img/df15b709d7e8fa8f2cd7af7eb08775e7_67_0.png)


    # ## What you need


    +   - Latest Raspian image (raspi-armhf7-raspbbian)

    - Wireless (or wired) network

    - USB wireless dongle

    - Speaker system

    - USB sound card (optional)

    - Small speaker amp (optional)


    Every house needs a good speaker system, and a good speaker system is even better
    if it can be accessed by multiple devices over the network. AirPlay uses Apple
    multicast technology that was re-engineered in 2011, which means third party devices
    can now easily allow any Apple device to broadcastcast audio coming out of its
    speakers to an AirPlay receiver (which will be our Pi in this case). There is
    a way to send audio from PulseAudio to AirPlay network without extra calls. Sadly,
    the Android application requires access to the audio of other applications running
    on the device. To keep things simple, we decided to use an iPad as the test device.


    # 01 Set up Wi-Fi


    Connect everything to the Raspberry Pi and power it up. Log in to the Raspberry
    system with the username pi and password raspberry. Then, make sure your wireless
    interface is configured with an entry for wlan. If you look in network/interfaces,
    there should already be a section that looks like this:


    ```

    allow-hotplug wlan

    wpa-rom /etc/wpa_supplicant/wpa_supplicant.conf

    iface default dhcp

    ```


    > **Liam Fraser** is the creator of RaspberryTutor and volunteers as a Linux server
    administrator for the Raspberry Pi Foundation


    www.linuxuser.com'
