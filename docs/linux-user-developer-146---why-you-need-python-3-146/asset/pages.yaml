    # Return to Windows would cost Munich millions


    # Major auditor to determine full costs


    The German city of Munich has released details claiming that a return to Microsoft
    software from its Linux-based infrastructure would cost millions of Euros, ruling
    out any change in the short term. Munich became a poster child for open source
    platforms when it migrated to a custom variant of Linux. Although hailed as a
    success, in some government, having Mayor Reiter has indicated dissatisfaction
    and that a return to Windows is possible.


    however Reiter claims that the higher hardware demands of Microsoft''s OS and
    office suite would require the purchase of new machines at a cost of €13.5 million
    (£22 million), not including infrastructure costs or software licensing beyond
    the each desktops operating system. Reiter estimated that the move would cost
    around €14 million (£11.0 million), which would be saved if the city moved back
    to Windows. The move could save around €11 million (£8.7 million) and stay break
    even in the very near future.


    Figures released by Reiter suggest that such a move may not be financially feasible,


    Reiter also addressed reports that his comments have caused alarm personally interested
    in a return to the status quo: "There are many aspects to this, one of which is
    the case satisfaction, is not about my personal taste, nor my experiences with
    open source."


    # OPEN SOURCE


    # Gummersbachach finishes on OS migration


    Retires particular in favour of open software


    The German town of Gummersbach has announced the successful completion of a project
    to replace its outdated operating system, claiming to have saved a five-million
    euro so far with more savings to come. In an Gummersbach''s local authority opted
    to migrate to Linux when its software vendor was purchased. The move began in
    2007, with the European Commission''s Open Source Observatory and Repository (OSOR)
    reporting this month that it had finally successfully completed.


    The move sees the central administration using LibreOffice on thin-client machines
    and others on Windows. The Mate environment was chosen for its familiarity, using
    the Open-X compatibility tools is used also.


    proprietary applications are also made available through inspected desktop virtualisations
    for those on Windows.


    As well as savings on licensing, the move to thin-client systems has reduced the
    need for maintenance, with Gummersbach claiming staffing equivalent to one full-time
    staff member.


    The project has also confirmed that it has adopted WoolMax, an open-source document
    management system used for migration to Linux, for selected departments.


    The migration has almost encompassed all of Gummersbach''s systems, retaining
    a 25 property systems for compatibility with legacy applications. Selected


    Management of the system is conducted by internal staff while the Gummersbach
    IT department is merely three employees. With considerable savings being gained,
    Gummersbach stands as a model for smaller town governments and the opportunities
    offered fired by open source platforms.


