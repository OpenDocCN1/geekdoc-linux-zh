    ```\n\n![](img/df15b709d7e8fa8f2cd7af7eb08775e7_51_0.png)\n\nModules enable you\
    \ to share reusable\nchunks of Puppet config between projects\nThe Puppet manifest(s)\
    \ can be simplified with classes,\nasas a first step to modularity\n\n# Configure\
    \ virtual boxes with\nPuppet and Vagrant – part 2\n\nLast issue, we used Vagrant\
