  md: '# Getting started


    # Let''s take a look at the new print function and handling lists


    There are a load of changes that were made into Python 3. Depending on the version
    of Python 2 you''re using, some of these changes will be more drastic than others
    - Python 2.5 onwards received some changes backported to the code, slight differences.
    This happened quite a while ago, though you might be going from current Python
    2 to Python 3.


    # Say hello


    One of the changes made in Python 3 that will cause a stumbling block is to update
    the print command. Before, it was unique as a statement and not a proper function,
    with limited outputs for debugging or normal outputs.


    You can still, but to bring it in line with the rest of the way Python 3 works,
    you''ll need to make the exact kind of functions that you could with the original
    print, but without arguments. To illustrate this, it''s first of all create a
    Hello World command. Open your IDLE and type to do this


    ```

    print("Hello world")

    ```


    Very simple. For complex things that include variables and methods, it''s also
    easy to create them as well. For the next example we''ll create a variable with
    a number to illustrate how it works. In IDLE, use the following two commands in
    the shell:


    > The list.append() and list.remove() commands are still in place, but Python
    3 makes organising them much easier


    # Why need to change


    # Python 3 is good for the future


    Python 2 is slowly dying. For the past few years it''s had very little development
    and the odd bit of deprecation. We constantly run code bits that deal with Python
    2, mainly involved with sorting lists and databases, and in general it''s more
    easy to read and use as shown with the changes to things like print.


    There''s a bit more to the differences than we''ve managed to show in this article,
    however these are some of the main functions used in Python, so getting the very
    basics down is important. You can get more information about the changes later
    and on links to documentation.


    Overall it''s very much the same Python as before. Now it''s being adopted faster,
    so it''s easier to make the switch, making the jump ahead of the curve helpful
    in the long run.


