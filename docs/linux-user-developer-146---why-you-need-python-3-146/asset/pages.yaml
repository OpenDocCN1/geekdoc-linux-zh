  md: "# # Master UNIX signal handling\n\nUtilise signals and program their handling\
    \ in C\n\nTUTORIAL\n\n![](img/df15b709d7e8fa8f2cd7af7eb08775e7_48_0.png)\n\n#\
    \ 01 About signals\n\nAll signals begin with SIG, which is sometimes not mentioned\
    \ in the documentation available. The following command shows a list of signals:\n\
    \n```\n$ kill -l\n```\n\nAll signals have a default action but may allow you to\
    \ bypass the default action by writing your own code.\n\n```\n$ mitsmail:-$ kill\
    \ -l TERM 15\n$ mitsmail:-$ kill -l 15 TERM\n```\n\n# 02 The kill command\n\n\
    The kill command sends the TERM signal. By default the following commands are\
    \ equivalent:\n\n```\n$ kill -TERM process_id\n$ kill process_id\n```\n\nYou should\
    \ avoid sending the SIGILL to a running process unless it is absolutely necessary.\
    \ SIGILL is non-catchable and will normally prevent a process from cleanly cleaning\
    \ up. If you run the kill command with the -l option it will return the SIGILL\
    \ number. If you give a signal name, it will return the signal number.\n\n# 03\
    \ The most common UNIX signals\n\nHave ever pressed Ctrl+C to stop a program from\
    \ running? Ctrl+C sends the SIGINT signal, which is the most commonly used signal.\n\
    \nAnother important signal is SIGKILL, which happens when you try to kill a process\
    \ using -9 command. You will see this in the next step, SIGKILL is a special kind\
    \ of signal:\n\nAnother useful signal is called SIGHUP which is commonly used\
    \ to notify server processes to reload their configuration files.\n\n```\n#include\
    \ <stdio.h>\n#include <signal.h>\n\nstatic void handle_usrl(int sig) {\n    if\
    \ (sig == SIGUSR1) {\n        printf(\"Received SIGUSR1\\n\");\n    } else { //\
    \ This should not happen\n        printf(\"Unknown signal!\\n\");\n    }\n   \
    \ return;\n}\n\nint main(int argc, char *argv) {\n    if (signal(SIGUSR1, handle_usrl)\
    \ == SIG_ERR) {\n        printf(\"There was an error handling the SIGUSR1 signal\\\
    n\");\n        return -1;\n    }\n\n    while(1)\n\n    return 0;\n}\n```\n\n\
    # 06 Explain the Code\n\n# The kill signal is similar to unplugging from the mains\n\
    \n# 04 Handling just one signal\n\nA program cannot handle all signals, some are\
    \ noncatchable and nonignorable. SIGILL and SIGKILL cannot be caught or blocked.\
    \ The reason for this is that they provide the kernel and the root user a way\
    \ to stop anything.\n\nThe effect of SIGKILL is like unplugging your computer\
    \ from the power. It is usually used in extreme cases where it is the only signal\
    \ that is usually used because it is quicker to stop a process than to type to\
    \ it properly.\n\nand from its default action is 'terminate'. It hardly changes\
    \ your state.\n\nApart from the SIGILL that is specifically catchable, all of\
    \ the signals will be handled using their default actions. You can use Ctrl+C\
    \ to stop the program or use the kill command without.\n\nOur C program 'handler'\
    \ handles the SIGUSR1 signal, SIGUSR1 is the defined signal for use in application\
    \ programs\n\nThe code is easy to understand. The signal function will be called\
    \ when a SIGUSR1 signal occurs. You can also refer to a signal by name or by number,\
    \ but it is better to use the signal by its name to make your code easy to read.\n\
    \nThe while loop allows for the program to run in order to be tested signals and\
    \ usually, server processes will have a similar code.\n\nwww.linuxuser.co.uk"
