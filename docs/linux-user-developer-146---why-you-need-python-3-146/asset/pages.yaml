    # # What are the new GPIO pins?


    ### The Raspberry Pi Model B+ has an extra 14 GPIO pins, what do they do and is
    the arrangement different?


    +   - If you like this...\ Rob Zweetsloot breakdown complex systems and is a web
    developer proficient in Python, Django and PHP. He loves to hardware and experiment
    with computing


    Yes, one of the changes made to the Raspberry Pi when it was upgraded to expand
    the GPIO so that it was capable of doing more.


    So there are 14 more GPIO pins on the Model B+ of Raspberry Pi?


    How many GPIO pins does mean the Model B+ has now?


    What new things can you do with the added ports?


    Well, in all, are there are now 40 pins in the GPIO port, all of them usable by
    the Raspberry Pi.


    Is this the same as the Compute Module that was released B?


    Well, there''s nothing specifically new other than being able to have more inputs
    and outputs. All the pins are duplicates of the functions you already get with
    the Model B.


    +   - If you like Get a full breakdown of the GPIO pins from the Raspberry Pi
    at bit.ly/1IwWQg


    Why do this? The Raspberry Pi has got popular among hobbyists who want to use
    it for physical projects. They can essentially be used for any kind of devices
    and expand what they can do by interacting with the outside world via internet
    and touch.


    Ah, no the Compute Module has more pins than the Model B+. It has two banks of
    100 pins each, and all around it. It would probably look like a cubeside routing
    board with the pins wired up.


    Nothing specifically new? What''s the point then?


    As you have more inputs and outputs, which means you can generally do more with
    the Pi than you were able to before. There are also a couple more power and ground
    pins,


    +   - Further reading What about the differences between the Raspberry Pi B and
    Model B+ projects? Developer 143, from greatmagazine.com


    74 www.linuxuser.com'
