    # WIN A FUZE


    Above EGX 2014 was held in East''s Court. Next year it will be at Birmingham''s
    NEC


    David explained why they used Unity: "The true we was hard mastering the Unreal
    engine that it made developing the game in Unity; it''s much easier developed
    for us. It''s essentially the same game - it''s not a port on any platform; it''s
    a one-stop solution."


    When you are developing on Linux, it may be more attractive, more platforms usually
    means more bug fixing.


    to Nick Preston, developer of Toroyansē: "What I can tell, Linux users seem to
    be a little more self-sufficient than most platforms. One of the risks of supporting
    another platform is that you may be up with support requests, suddenly if you
    don''t have proper experience with the platform, it can be a bit of a nightmare.
    But it seems people on Linux are happy to try out their solutions, demanding the
    code is fixed. For me, releasing on Linux seems like a no-brainer."


    The irony of the matter is that Unity does not have a development environment
    available for Linux. Publishing to Linux is one thing, as they have their own
    way of testing whether or not the build works on Linux, but not being given an
    IDE was made available to them. This increase in Linux releases will be noticed
    by Unity, so that they will finally release on Linux.


