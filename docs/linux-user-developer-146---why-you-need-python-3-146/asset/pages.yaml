    # Partition shrinking


    I''m going to run GParted off boot CD, since I ran into a lot of GNOME: dependencies
    trying to install it in Slackware.


    I have two 50GB partitions on a 1TB SSD drive. One is NTFS and the other is ext4.


    I''d like to shrink the partition by about 300 gigabytes and give that to the
    ReFS partition. I have no place to put the data on these partitions, so my question
    is:


    How safe is this in terms of data preservation?

    Will there be a potential problem of losing the data?


    Here''s the thing: you''ll be able to do it. As long as there''s free space on
    the NTFS drive, GParted will shrink it down.


    The problem you get, especially with NTFS and other Microsoft file systems, is
    that they get messed up and scattered across the disk as they are created,


    modified and used. Going ahead and shrinking the partition without any preparation
    will certainly cause data loss.


    The best method - especially if you can''t back up the data - is to first defragment
    the drive. Fragmentation is unavoidable but there are tools inside Linux like
    UltraDefrag that will work with NTFS. Make sure to do a pass with that before
    you


    However, that isn''t a good substitute for a proper backup - see our guide on
    page 36.


