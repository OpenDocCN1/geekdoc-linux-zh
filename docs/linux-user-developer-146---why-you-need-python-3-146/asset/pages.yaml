  md: '# Render 2D and 3D graphics with WebGL


    Learn how to write and run WebGL programs using JavaScript


    # TUTORIAL


    # 01 How to use WebGL


    Before starting to write small WebGL programs you will need to write some HTML
    code to use as a template. The HTML code itself does not really matter in this
    instance as long as it fits (see ''index.html''). The code does nothing basic
    that you should use later. The most important stuff is the definition of canvas:
    everything will be drawn inside the canvas element You will also need to use a
    context name: some supported context names are ''webgl'', ''experimental-webgl''
    and ''webkit-3d'' You can paint the canvas with any colour you want.


    # 05 The aspect ratio


    # 02 Draw a simple shape


    Drawing 2D or 3D shapes used to require expensive maine and specialised software
    nowadays even on a simple phone you can run WebGL.


    The presented HTML code use ''rectangle'', html1 draws a 2D rectangle using WebGL.
    You will see that two triangles compose the rectangle, the second triangle is
    slightly changed in order for you to distinguish the two triangles.


    If you want to line up the two triangles you draw the vertices using the following
    code:


    ```

    var vertices = [-0.75, -0.75, -0.75, 0.75, -0.75, 0.75, 0.75, -0.75, 0.75, -0.75,
    0.75, 0.75];

    ```


    # 03 The explained


    The JavaScript code is pretty straightforward. However it contains some methods
    that is needed for defining the coordinates of the rectangle vertices.


    The following line defines a buffer which will hold the data:


    ```

    var myVertexBuffer = gl.createBuffer();

    ```


    The following line of code defines the number of triangles you want to draw:


    ```

    gl.drawArrays(GL_TRIANGLES, 0, 6);

    ```


    The ''createShader'', type and the ''createProgram'', functions are pretty standard
    code that you are going to use in your programs or from another. It would be a
    good idea to specify the size of the canvas that you are drawing.


    # 04 About drawing


    In WebGL there are types of drawing primitives: points, lines and triangles, as
    any 3D object in WebGL is composed of triangles. The programmer should know how
    to draw triangles. Therefore to draw a rectangle you will need an array with six
    points in 2 dimensions because each triangle needs three points in to be defined.


    # 05 The aspect ratio


    The programmer has to deal with the proportions of the WebGL native coordinate
    system. So, in order to make a square look like an aspect ratio, you will have
    to multiply the values of the y coordinates by the aspect ratio.


    Be careful of the WebGL native coordinate system that is used by WebGL you are
    specifying the points in the programs you are using.


    ```

    var aspectRatio = canvas.width / canvas.height; var vertices = [-0.75 * aspectRatio,
    -0.75, -0.75 * aspectRatio, 0.75, -0.75 * aspectRatio, 0.75, 0.75 * aspectRatio,
    -0.75, 0.75 * aspectRatio, 0.75, 0.75 * aspectRatio, 0.75];

    ```


    You can see from the output that the canvas has the same size as before, but the
    shape is now drawn as a square (aspectRatio).


    41 | linuxuser.co.uk'
