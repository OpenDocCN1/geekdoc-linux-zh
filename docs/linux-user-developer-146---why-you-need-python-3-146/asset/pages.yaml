    \ If the updated items are\nthe top-left bottom-right format. As we\none updated\
    \ item, we set the item's address as\nthe top and bottom boundary.\nWith this,\
    \ the view is ready for another\nDouble-click on an item to put it into editing\n\
    mode, then change is set. The model and view\nbe updated when you return the Qt\
