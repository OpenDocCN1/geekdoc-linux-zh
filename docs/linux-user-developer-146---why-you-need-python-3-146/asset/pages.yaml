  md: '# # Tutorial


    06 The gl.drawArrays function

    The WebGL function used for drawing is called drawArrays.

    nThe first argument to the gl.drawArrays function specifies the drawing mode.
    If you want to draw a triangle, you can use glTRIANGLES. Alternatively, you can
    use GLINES and GLPOINTS for lines and points respectively. The third argument
    of the function is really important because it declares the number of points that
    will get as input. When you have problems with your output, check this parameter.


    ![](img/df15b709d7e8fa8f2cd7af7eb08775e7_41_0.png)


    07 Draw multiple shapes on-screen

    This part will show you how to draw multiple rectangles and triangles on-screen
    (multishape.html). Each shape has its own colour. This method is particularly
    useful as how to create automatic functions that generate objects based on user-defined
    parameters. This means that you can create your own JavaScript library of functions
    that you can reuse. The secret is that you will use one buffer with data - that
    is, the shapes until you finish with your drawing and then display the buffer:


    08 Exploring the code

    The program uses JavaScript with vertex handling calls to avoid writing the same
    functions inside every script. Another important reason for this is if you find
    a bug or make an improvement to an existing function, you only have to change
    one to file.


    ```

    The two shaders are stored in two files and the following code:

    vertexShader = createShader(gl, "vertex-shader");

    fragmentShader = createShader(gl, "fragment-shader");

    program = createProgram(gl, vertexShader, fragmentShader);

    ```


    It is not necessary to understand every line of JavaScript in order to experiment
    with WebGL. Using the code as a template, program your own draw functions and
    create your shape!


    ![](img/df15b709d7e8fa8f2cd7af7eb08775e7_41_1.png)


    09 Using triangles to create a rectangle

    Now we look at how to use multiple triangles to create a rectangle. However, since
    we are using more than two triangles for a rectangle is redundant, there are cases
    where you need to describe a shape using more triangles to generate it.


    To understand the decomposition, each rectangle will use a different colour. Because
    the point for all triangles is the same, we use the (0, 200) point. As triangles
    need just three points to be defined, the order of points is important. Point
    order is more important for shapes with more than three triangles.


    10 About shaders

    There are two kinds of shaders: vertex and fragment. The vertex shader executes
    first and the fragment shader executes second.


    Vertex shaders are used for controlling the position of a shape to rotate an object
    in space, your vertex shader is responsible for applying a user-defined map to
    its coordinates.

    Fragment shaders are for controlling the colour, texture mapping, lighting and
    depth of each pixel. The gl_Position variable defined in the vertex shader and
    FragColor variable define the colour it should be.


    The programming language used for shaders is GLSL, which is very similar to C.
    Your shader code uses separate files and include it in your JavaScript code. Both
    kinds of shaders rely entirely on the GPU of the graphics card; there you want
    to keep the GPU as busy as possible in order to let the CPU do the other work.'
