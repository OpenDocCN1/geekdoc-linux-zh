    # 13 Test the connection


    The easiest way to test the Wi-Fi is to shut down the Raspberry Pi using sudo
    halt now and remove the wired network connection and reboot the Raspberry Pi by
    reattaching the microUSB power connector. If the Wi-Fi connection worked, you
    should now see the splash screen with IP address.


