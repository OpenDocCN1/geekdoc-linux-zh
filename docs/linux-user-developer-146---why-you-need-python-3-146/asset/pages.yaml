    # Linux Foundation Dronecode


    Industry-wide effort to advance the field of UAV robotics


    The Linux Foundation has announced the formation of Dronecode


    as the chair of its Technical Steering Committee (TSC) for his work as lead maintainer
    of the APM/ArduPilot software. He is also to receive a seat on the overall board.


    The governance structure of the Dronecode Project has been designed by its founders
    as ''neutral'', with other parties and individuals develope to influence and participate
    in its development and direction. Its board consists of members and those from
    the technical community, while the TSC is formed of project leads.


    "The industry is just beginning to realise the potential of drone technology to
    attract attention," claimed Imam Souza, president and general manager of Intel''s
    Open Source Technology Center. "For new technology to become mainstream, it''s
    important for the industry players to collaborate. Open source contributions to
    Dronecode Project can help accelerate innovation in a new market as this."


    Matt Cobb, chief technology officer of competing Qualcomm, said of the project:
    "The expectations are exciting and has found success in open and supports community-led
    platforms as a way to accelerate innovation in pioneering areas such as drones,
    robotics and IoT."


    Open source software and collaborative development are advancing technologies
    in the hottest, most cutting-edge areas.


