    \ to indent the right and write the points in your document. There's more information\
    \ on styling your presentations in the later steps.\n\nAfter you have saved the\
    \ file, open it with the '.rst' extension. You can then run the command `howcraft\
    \ presentation <targetid>` with your rust file name and `<targetid>` to view the\
    \ slide you created. Howcraft will generate an HTML file that is created in the\
    \ output folder. That's all there is to do: Now you have your Howcraft presentation.\n\
    \n# ## 05 Styling presentations\n\nHowcraft has also demonstrated some of the\
    \ reStructuredText features which are well-documented in the quick reference guide\
    \ shown in Step 2. It's worth noting that they work in a very simple way:\n\n\
    +   - The transition in reStructuredText is used to separate slides. A transition\
    \ is a simple line with one or more dashes, ------ so you need to add a transition\
    \ to the end of a slide.\n- Howcraft makes the first slide only after it finds\
    \ a transition. Anything before it belongs to the presentation.\n- Every impress.js\
    \ field added in the presentation before the first slide is\n\n![](img/df15b709d7e8fa8f2cd7af7eb08775e7_45_0.png)\n\
    \n```\n.. Sample.rst m\n   :title: Sample Presentation\n   :author: John Doe\n\
    \   :description: Sample presentation for demo purposes.\n   :keywords: presentation,\
    \ reStructuredtext, impress.js, tutorial\n   :css: sample.css\n```\n\nThis slide\
    \ is a bit of tutorial on how to use Howcraft to make your presentations. It will\
    \ show you the most important features of Howcraft with some examples.\n\nThe\
    \ first slide\n\nAny line with punctuation is made into a heading. Each type of\
    \ punctuation turns it into a different level of heading. The order of characters\
    \ defines the level of the heading. Next slide will give you a better picture.\n\
    \nFirst header\n\nYou can use other punctuation as your level of heading if you\
    \ like, but this is not the only. Any of these characters:\n\n```\n* \n** =\n\
    *** ~\n```\n\n# ## Howcraft converts the reStructuredText to XML then uses CSS\
    \ to translate that into HTML\n\nrendered in the attributes of the impress.js\
    \ 'data' tag. It is used to set the transition duration: transition-direction.\n\
    \n+   - Similarly, any impress.js field added to the first slide is rendered on\
    \ all slides. This includes effects to the slides, so you can add them optionally\
    \ in Step.\n\ntemplate\n\n+   - css: css/presentation\n\nThe third way involves\
    \ adding CSS with the line parameter:\n\n# ## 06 Styling - adding external files\n\
    \nHow to add external stylesheets to your presentation is exactly same with Howcraft.\
    \ To add an image to slide use:\n\n```\n.. image:: path/to/image.png\n   height:648\n\
    \   width:800\n```\n\nSimilarly, you can add external CSS and there are two different\
    \ ways to do that. The first way is via templates - whenever you use a template,\
    \ the corresponding CSS automatically includes them. For example, if you use the\
    \ default-\n\nhowcraft-extra-my.css\nsample.out/\n\nYou can also include a single\
    \ slide with the of: id. Add the field to the slide content so it looks like this:\n\
    \n```\n- id: slide-id\n```\n\nThen you can add custom code here (to any CSS already\
    \ included in the presentation):\n\n```\ndiv-theme-id\n   // Custom CSS here //\n\
    ```\n\n46 www.linuxuser.com"
