  md: '# Make a digital photo frame


    ![](img/df15b709d7e8fa8f2cd7af7eb08775e7_64_0.png)


    # 02 Assemble the HDMIPI


    The HDMIPI is a do-it-yourself kit rather than a polar-product. This does not
    only make it cheaper for you to buy, but also gives it a more hack-like feel in
    the PiBow-esque acrylic layer. It is not hard to assemble, but in case you get
    stuck there is a fantastic video here: http://hdmpi.com/instructions.


    +   Requirements

    Before begin you need to have the following:

    * A Raspberry Pi (Model 3 or 4 is highly recommended)

    * An SD card (at least 10 GB, but some 8GB SD cards work)

    * An HDMI cable

    * An adapter (if your computer does not have HDMI)

    * A computer that can flash the Raspberry Pi and SD card and has SD ports


    Option 1: Choose the fastest card


    # 03 Download Overlay SD


    Now that you have all ready we can go to download the Overlay SD image. This is
    only 3.3MB image and will fit on any 4GB SD cards so we would recommend a 8GB
    SD, for extra space for your pictures and videos. Visit bit.ly/KiwiPi and download
    the ZIP file from one of the mirrors under the "Getting Started"


    | Win32 Disk Imager |

    | Image File | Device |

    | C:/Temp/2013-03-04-22-Screenly_Pro_4GB.img | |

    | Progress | |

    | HD Health | |

    | Version 0.7 | Cancel | Read | Write | Exit |


    # 04 Flash to SD (Linux)


    It is worth noting that using a Linux machine is the easiest way to unzip and
    copy the image to your SD card. Assuming download the ZIP file in Step 03. This
    is typically the easiest. Assuming the disk is not mounted, open your terminal


    ```

    unzip -p /path/to/screen_image.zip | sudo dd bs=/dev/sdx

    ```


    Make sure you replace /path/to/screen_image.zip with your actual path.


    # 05 Insert to SD Card (Other OS)


    Once the image has been successfully transferred to your SD, you will need a card
    reader for the Raspberry Pi, you can do this by using other operating systems.
    In Windows use Win32 Disk Imager, on Mac use Balcher and on Linux use some command
    or the GUI-based software. Visit http://screenly.com/setup.html for more info.


    # Insert SD card and properly


    Once it is good to connect your Wi-Fi and configure it. Take a look at the image
    of the Raspberry Pi insert the SD in relation to the card. A wired network is
    needed for the initial setup and for configuring the Wi-Connection.


    # 07 Boot up your Raspberry Pi


    The Raspberry Pi driver has a power output for the Raspberry Pi which means you
    only need one power for this setup. It is now time to boot into the Screenly setup.
    An IP address (http://aaa.bbb.ccc.ddd:8080) should be displayed here, which will
    allow you to access to the management dashboard.


    # History of HDMIPI


    Screenly is a collaboration between Centech and Alex Emans. They wanted to bring
    a cheap and easy HDMI screen to the market to reduce the cost of having a monitor
    for Raspberry Pi. They went to Kickstarter to launch their idea, and there was
    a great project from both sides.


    They raised over 2,500 backers who have all enabled them to make their £25,000
    campaign with success. Even though was not good enough to use in their other projects
    in Lebanon (bit.ly/KiwiPi)


    www.linuxuser.com'
