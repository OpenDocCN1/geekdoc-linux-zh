  md: "# Tutorial\n\n![](img/df15b709d7e8fa8f2cd7af7eb08775e7_65_0.png)\n\nAbove Screen\
    \ Pro can manage multiple screens and has cloud storage to\n\n# Screen Pro Edition\n\
    \nIn this tutorial we have used the open source version of Screen OSE. This is\
    \ a fine of software and a great open source. In this point, you may be dreaming\
    \ of using many displayed screens and the good news is that it is possible with\
    \ Screen OSE. This is completely free to use with 2GB of storage. We offer larger\
    \ packages for purchase starting at two dollars up to $100+. It also does not\
    \ have additional features not in Screen OSE; find out more on the Screen website\
    \ (bit.ly/X6999).\n\n# Configure Raspberry Pi\n\nOnce you are successfully at\
    \ the command line, you need to use sudo -raspiconf to edit the settings and then\
    \ select X11 root pool policy to make you have access to all of the screens on\
    \ your card. Then, change the screen number (1 to 12) so that it is correct for\
    \ your location. If your screen has black borders around the edge you may also\
    \ need to disable overscan (option 8 and then again). We would also recommend\
    \ changing the default password raspberry to stop any would-hackers from easily\
    \ accessing the Raspberry Pi via SSH (option 2). Once, exit without selecting\
    \ Final and then No.\n\n# Schedule Owner\n\n![](img/df15b709d7e8fa8f2cd7af7eb08775e7_65_1.png)\n\
    \n# Enable set Wi-Fi\n\nThe next step in setup of Raspberry, the Wi-Fi setup is\
    \ essentially the same as the standard command line OS. In order you need to edit\
    \ the interfaces using nano /etc/network/interfaces and then type in the following\
    \ code, replacing ssid and password with the actual values:\n\n```\nauto lo\n\
    iface lo inet loopback\n\nallow-hotplug lo\nauto wlan0\niface wlan0 inet dhcp\n\
    \twpa-ssid \"yourssid\"\n\twpa-psk \"yourpassword\"\n```\n\n# Disable Video output\n\
    \nLoad the IP address on the splash screen in a browser of a different computer\
    \ (you will not be able to do it directly). Then the Screen OSE dashboard will\
    \ show up. Load the dashboard and click on Big Buck Bunny to disable the asset\
    \ entity.\n\n# Enter the command line\n\nOnce you have disabled the Big Buck Bunny\
    \ from the interface, you will not be able to enter the terminal. You can easily\
    \ do this by pressing Ctrl+Alt+F6 on any keyboard. Alternatively, you can access\
    \ the command line over SSH using the IP address as shown in the splash screen.\n\
    \n# Run update script\n\nThe image file we downloaded from the website is actually\
    \ just a script and does not include the latest version of Screen OSE, as the\
    \ code makes. It is therefore necessary to upgrade to the latest version using\
    \ the built-in script. You can run the following command:\n\n```\n-/usr/misc/run_upgrade.sh\n\
    ```\n\nThen exit and saving by hitting Ctrl+X, then you return."
