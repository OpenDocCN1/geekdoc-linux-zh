  md: "Now you can have a permanent record of your progress trying to optimize your\
    \ code. You can use the pandas module to load the data and play around it. You\
    \ could load the data, strip any extraneous information from the module names\
    \ and sort it with.\n\n```\nimport pstats\nprof = pstats.Stats('prof_data')\n\
    prof.strip_dirs().sort_stats(-1)\nprof.stats()\n```\n\nThese techniques work fine\
    \ when you are still in the development stage, but what can you do if you insert\
    \ some modules into your script? You can run full scripts through cProfile with\
    \ the command line:\n\n```\npython -m cProfile myscript\n```\n\nThis will run\
    \ the profiler for your 'myscript', and save the profiling data to 'file.prof'.\
    \ This module provides a simple interface as cProfile, which is written in Python.\
    \ This means that you see more and more functions involved, so the run script\
    \ may feel significant. But since it is written in Python, it is a great help\
    \ if you want to build more functionality on top of that profile. Also, if you\
    \ encounter systems where cProfile is not implemented, then what will you decide\
    \ to depend on your results?\n\nWith the information that you have covered in\
    \ this, you should have the tools you need to be able to figure out where to apply\
    \ optimization. So now you have no excuse for having slow and bloated code. So,\
    \ go forth and optimize.\n\n> Above focusing your attention on the functions that\
    \ are most often is the way to get measurable speed boots\n\n# Full code listing\n\
    \n```\n# Here we will run some\n# examples of cprofile\n\n# We define a looping\
    \ function\n# that calculates the cube of a range\nof numbers to chew up CPU cycles\n\
    def looper(size):\n    for i in range(size):\n        return i**3\n\n# Starting\
    \ by cProfile\nimport cProfile\n\n# Run for a large size\n# and it's better to\n\
    cProfile.run('looper(10000)')\n\n# Function to look up\ndef myfact(a):\n    return\
    \ a + myfact(a-1)\n\n# We will run this and also\n# to have a file for later\n\
    cProfile.run('myfact(50)', 'prof_data')\n\n# Now we load it in to stats\nimport\
    \ pstats\nprof = pstats.Stats('prof_data')\nprof.strip_dirs().print_stats()\n\
    ```\n\n# Pylint\n\nWhile profiling your code will point to places where you should\
    \ look to see changes you can make to optimize your code, it is only the tool\
    \ at disposal. You can also use pylint to check your code for different kinds\
    \ of errors and enforce a coding style. You can detect code sections that aren't\
    \ being used, or duplicates of code that could probably be removed with a few\
    \ * and then the name of the module in question. Then it will give you types of\
    \ messages, which can be\n\n[Refactor for a 'bad' practice metric]\n[Convention]\
    \ for coding standard validation\n[Warning] for problematic code\n[Error] for\
    \ important problematic issues\n[Fatal] for errors which prevented processing\n\
    \nAlong with the message each line will include a line number and potentially\
    \ an object name, where this message was triggered. Pylint can interface with\
    \ different text editors like Emacs, Vim and Eclips. Pylint also reports to pyreversex,\
    \ which lets you use UML diagrams for your Python code.\n\n![](img/df15b709d7e8fa8f2cd7af7eb08775e7_72_0.png)"
