    \ or so\n\n```\ngit clone https://github.com/alsasairplay/sharp.git\ncd sharp/\n\
    configure; make; sudo make install\n```\n\nAfter this, the Sharp binary will not\
    \ be installed unless it is started at boot, which is easy to fix. Then we need\
    \ to install the script\n\n```\nsudo cp scripts/init.sharp /etc/init.d/sharp\n\
    sudo chmod 755 /etc/init.d/sharp\nsudo update-rcd sharp defaults\n```\n\nFinally,\
    \ Sharp needs its own user as a member of the audio group. You can create one\
    \ with:\n\n```\nsudo useradd -g audio sharp\n```\n\n![](img/df15b709d7e8fa8f2cd7af7eb08775e7_68_0.png)\n\
    \n+   04 Change the hostname\nSharp will show as the hostname of the system. If\
    \ you don't want the name to be raspberry, you can change it like:\n\n```\nsudo\
    \ echo \"PiPlay\" > /etc/hostname\nsudo hostname PiPlay\n```\n\n+   05 Set the\
    \ default sound card\nIf you have a sound card then you'll want to make the default\
    \ you've set to 100 percent so that your amplifier is getting a nice signal. Use\
    \ aamlay to list the audio devices on your system. Our expert's sound card had\
    \ an entry like this:\n\n```\nCard:00 Device:0x01:0x03, Audio\nUSB Speakers\n\
    ```\n\nTo set the default as follows:\n\n```\nsudo echo \"amlay.default card=hw:0x01:0x03\"\
    \ > /etc/asound.conf\n```\n\nYou can set the working card is with speaker--2 to\
    \ select the correct sound card and then using the up and down arrows to change\
    \ the channel. Once you are done, you can make the changes with sudo alsactl card\
    \ 1 is the card number. If you are using the built-in audio then you don't need\
    \ anything.\n\n+   06 Final reboot\nAfter the reboot, Sharp should start automatically.\
    \ To test it, connect your client and see if you can find the PiPlay. On an iOS\
