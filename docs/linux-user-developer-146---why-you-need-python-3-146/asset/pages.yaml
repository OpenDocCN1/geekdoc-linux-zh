    # GAMING


    # Linux gaming grows as developers turn to Unity


    British indie devs are embracing Linux as a platform for their games, and a growing
    number are appearing at tradeshow like EGX around the world


    EGX London is the biggest video game show and fan expo in the UK, attracting British
    visitors and even visitors from European countries. More games on Europe are showcased
    as many as ever before, some for the first time in the UK, and more developers
    are showing up every year. A growing trend from these indie devs is a Linux release,
    meaning that a portion of the floor was also dedicated to games that would also
    make their way to Linux.


    > The ease of creating a Linux build through Unity is a big factor in developing
    games for the OS


    "The reason we believe in Linux is because we can," said David Bannister, managing
    director of Wales Interactive, who was showing us the playable demo of Soul Axiom.
    "The very nature of indie is a niche market so it means we can cover markets."


    This idea of developing for Linux was echoed by the other devs present on the
    floor: When we asked the team behind Mushroom 11, a director Bryan Gale, director
    of Induction, had thoughts to David: "I don''t know how the audience is but I
    may as well do, and for a small developer like me I get to be playing my game
    is fantastic."


    What''s causing these indie devs to embrace Linux as a platform? Why are they
    starting to develop for now?

    I''m developing for Unity because Unity is the tool of choice of everyone we spoke
    to, and of creating a Linux build through the tool is a big factor in developing
    games for the operating system.


