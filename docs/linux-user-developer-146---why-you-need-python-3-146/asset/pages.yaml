    ![](img/df15b709d7e8fa8f2cd7af7eb08775e7_18_0.png)


    **Python 3 has been languishing.** There have been many good reasons for this,
    including a lack of dependencies, monolithic codebases written in Python 2 that
    are costly to port across, and the prevalence of tutorials such as those found
    in online resources that focus on the outdated 2 versions, among many other reasons.
    One of the common threads is the sense that there aren''t enough people actually
    programming in Python 3 to help its spread. A few years ago (we had Python 3 for
    six months) felt that there were really inhibiting factors, but the situation
    has vastly improved since then and some of these reasons no longer hold.

    So why haven''t people switched yet? Part of the problem is perhaps maybe down
    to the dual support of both Python 2 and Python 3 by its developers, but in any
    case it allows people to continue writing code in the deprecated version of Python.
    Momentum is needed from


    the community in order to successfully make the leap from Python 2 to the much;
    many abandoned altogether in favor of Ruby or Go, better Python 3, and to ensure
    that Python isn''t ignored for example.

    The adoption of Python 3 by the community is something that we personally believe
    here at *Linux User & Developer*, and since we have a strong sense for practice
    what we preach. We won''t throw you into the deep end immediately, but over the
    coming months we are going to help you along. When you visit FileLinux.com to
    download your tutorial assets each issue, keep an eye out for our blog now, read
    through our Python 3 primer and we''ll get you started with this fantastic programming
    language today.


