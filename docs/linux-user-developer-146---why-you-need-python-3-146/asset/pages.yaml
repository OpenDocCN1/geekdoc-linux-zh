  md: '# Remotely control your Raspberry Pi


    Edit the IP

    For everything to work more easily, you should set the Raspberry Pi to have a
    static IP of your choice. To do this, edit the networking config by using:


    +   - sudo nano /etc/network/interfaces


    ...and change interface eth0 inet dhcp to interface eth0 static.


    ![](img/df15b709d7e8fa8f2cd7af7eb08775e7_70_0.png)


    Access your Raspberry Pi

    Now the software is installed you can start to access your Raspberry Pi from any
    network. To do this type the following into your address bar, with the Pi being
    the one set up:


    +   - http://[IP]:8886


    ![](img/df15b709d7e8fa8f2cd7af7eb08775e7_70_1.png)


    Set up a static IP

    Add the following lines under the interface line with relevant details:


    +   - address 192.168.1.[IP]

    netmask 255.255.255.0

    network 192.168.1.0

    gateway 192.168.1.25 [Router]


    Ready to install

    You''re going to install the grab public keys for the software which will take
    just a moment to download the software, while other things quickly install:


    +   - wget dedebpo.kernel.org/raspictl.asc

    - sudo cat raspi..asc | sudo apt-key add -


    ![](img/df15b709d7e8fa8f2cd7af7eb08775e7_70_2.png)


    Change your password

    The default username and password is for both fields, and you sure to change that
    before doing anything. Go to Configuration at the top bar and the authentication
    to input your original password (admin), followed by your new passwords. The username
    will remain as.


    ![](img/df15b709d7e8fa8f2cd7af7eb08775e7_70_3.png)


    Add the repository and install

    Add the repository to the source file with the following command:


    +   - echo "deb http://dedebpo.kernel.org/ raspictl main" | sudo tee /etc/apt/sources.list.d/raspictl.list


    ...and install the software:


    +   - sudo apt-get update

    - sudo apt-get install raspictl


    More functions

    The web interface has a few extra functions from running commands, such as the
    ability to view the webcam and connect to radio services. Updating the software
    every often will allow you to make sure it keeps working. Play around with it
    and see what best suits you.


    71 www.linuxux.co.uk'
