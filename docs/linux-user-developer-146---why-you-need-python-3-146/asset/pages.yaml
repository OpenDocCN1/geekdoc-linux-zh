  md: "# # Puppet and Vagrant – part 2\n\nAdd Puppet to Vagrant to make complex deployments\
    \ manageable\n\n# TUTORIAL\n\n# ## 01 Masterful masterless\n\nyou'll be puppet\
    \ elsewhere, nodes report to Puppet Master. Puppet Master regularly will provide\
    \ central control of each node's configuration. it uses many nodes but not the\
    \ largest cases (where companies with tens of thousands of nodes like Puppet use\
    \ cron for the node reporting), nor for cases where the Puppet master to provision\
    \ the VM or a handful of machines is what we want.\n\nDistribution is taken care\
    \ by your own deployment system (Git or whatever you use to distribute your environments\
    \ around your team). This also avoids problems with firewalls, scaling and the\
    \ nontrivial of configuring the Puppet Master.\n\n# ## 04 Manifestly made easy\n\
    \n```\n# Puppet provisioning with Vagrant-stand alone, Puppet\n# are contained\
    \ in a directory path relative to Vagrant.\n# we need to create a directory and\
    \ a manifest in\n```\n\nFile Edit Options Tools Helper\n\n```\n# Puppet provisioning\
    \ with Vagrant-stand alone, Puppet\n# are contained in a directory path relative\
    \ to Vagrant.\n# we need to create a directory and a manifest in\n```\n\n```\n\
    config.vm.puppet = \"puppet\" do |puppet|\n  puppet.manifest_path = \"manifests\"\
    \n  puppet.options = [\"--verbose\"]\\end\n```\n\n```\n# Enable provisioning with\
    \ chef solo, specifying a cookbooks path,\n# a data bags path (all relative to\
    \ Vagrant), and also\n# some recipes and roles\n```\n\n```\nconfig.vm.provision\
    \ \"chef_solo\" do |chef|\n  chef.recipes_path = \"../my/recipes\"\n  chef.data_bags_path\
    \ = \"../my/data_bags\"\n  chef.chef_name = \"web\"\n```\n\n![](img/df15b709d7e8fa8f2cd7af7eb08775e7_52_0.png)\n\
    \n```\n# You may also specify custom JSON attributes:\nchef_json = {\"foo\": \"\
    bar\"}\n```\n\n# ## 02 Repairable\n\nThis is why that you might want to run a\
    \ Puppet Master with Vagrant - it just's not necessary, and in cases you'll manage\
    \ well without it. Vagrant has a way to provision with Puppet (with Puppet Agent,\
    \ under the Provisioning)\n\n# # Simple manifests can fit into the file default.pp\n\
    \nOur simple node not only makes provisioning more reliable across different systems\
    \ and distros, but it also makes the running system reliable. When the shell we\
    \ used last month can now set up the system with Vagrant, compare the master's\
    \ actual state with what the manifest details to be happening, and repair the.\n\
    \n# ## 03 Something to declare\n\nOur simple manifest will just start a series\
    \ of commands:\n\n# ## 05 Require >>\n\n```\napt-get update\napt-get install -y\
    \ puppet\nrm -rf /vagrant\n```\n\nWe create a directory for manifest files, which\
    \ will tell Puppet how to provision the machine. The directory is manifests, which\
    \ is in the same place as Vagrant, and in you'll find large manifests can be split\
    \ into files, in a separate directory, but a simple one can fit into the file\
    \ default.pp. If you need more details just ask. In Vagrant we can also comment\
    \ out the reference to the sheriff we added and use Puppet options, like a --verbose\
    \ switch to provide more information in case of errors:\n\nit provides least one\
    \ reliable method that can be used, but it doesn't travel across platforms. For\
    \ example, if you want the services to work on Ubuntu and a CentOS server, you\
    \ need scripts with different commands for each installation step.\n\n```\nexecute\
    \ 'apt-get update' {\n  path => \"/usr/bin\"\n}\npackage 'apache' {\n  ensure\
    \ => present,\n  require => Exec('apt-get update')\n}\nservice 'apache' {\n  ensure\
    \ => running,\n  require => Package('apache')\n}\nfile ('var/www') {\n  ensure\
    \ => directory,\n  owner => \"data\",\n```\n\nWe'll start with the Puppet equivalent\
    \ of that initial shell script and build on that, explaining the how and why as\
    \ we go.\n\n```\nconfig.vm.puppet = \"puppet\" do |puppet|\n  puppet.manifest_path\
    \ = \"manifests\"\n  puppet.manifest_file = \"default.pp\"\n  puppet.options =\
    \ [\"--verbose\"]\\end\n```\n\n53.linuxuser.co.uk"
