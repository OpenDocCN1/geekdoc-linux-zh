    CLOUD


    # OpenStack Juno released


    Tenth milestone in four years


    OpenStack has officially released Juno, its tenth developmental milestone in four
    years since the cloud platform was founded by NASA and Rackspace in 2010. Following
    the earlier OpenStack Juno 2014.1, OpenStack 2014.2 comes with bug fixes with
    more than 3,219 patched fixes. This improves the maturity and reliability of the
    platform and also added a considerable amount of new functionality to its local.

    The new feature of OpenStack Juno is Sahara a data-based processing system which
    allows Hadoop clusters to be executed within OpenStack cloud. Constructed by Mirantis,


    which developed the technology by Savanna, Sahara addresses what its creators
    claim is a common OpenStack use-case.

    Additional changes to the platform include an improved move for failed servers
    which communicates via the virtualization hypervisor, a new Distributed Virtual
    Routing (DVR), full IPv6 support, cloud storage policy support via the integration
    of Swift and multi-cloud identity federation including the SAML Assertion Markup
    Language (SAML) in Keystone.

    This will be the last major release, with the next OpenStack release scheduled
    to occur in April 2015 under the codename Kilo, after a design summit in October.


    Above OpenStack has its tenth milestone release in just four years with the launch
    of Juno


    DEVELOPMENT


    # Nvidia enables PhysX on Linux


    GPU boost for CUDA-enabled hardware


    PhysX, famously described by Linux founder Lin Torvalds as "the worst company
    ever", has released a new version of its Physics simulation development kit, which
    adds GPU acceleration to Linux for the first time. Previously wishing to perform
    PhysX simulation - frequently used in games to improve the movement of materials
    and water - on Linux were stuck relying on the central processor. Version 2.5
    adds support for offloading the calculations onto the graphics processor, Windows
    users have since signed the company to handle the deal in 2008.

    Use of the hardware-accelerated PhysX SDK requires users to have at least one
    Nvidia processor installed on the system, as it requires support for the Compute
    Unified Device (CUDA) offload language exclusive to the company''s products.

    The SDK is available for free download from Nvidia''s website for all developers
    (https://developers.nvidia.com/physx-sdk), with free registration.


