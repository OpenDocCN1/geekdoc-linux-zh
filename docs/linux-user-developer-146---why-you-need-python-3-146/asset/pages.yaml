  md: '# Review


    # soundKonverter


    # Gnac


    The Qt app with some excellent yet simple options for your audio


    An older, GNOME-based app. Does it keep up with today''s technology?


    ![](img/df15b709d7e8fa8f2cd7af7eb08775e7_77_0.png)


    The conversion options are quite good overall and they''re also done on a per-file
    basis


    You''ll need to create your own audio conversion profiles if you want to do more
    convert files to WAV


    ![](img/df15b709d7e8fa8f2cd7af7eb08775e7_77_1.png)


    # Interface


    A simple interface punctuated with the usual KDE flair and menus. It''s easy to
    navigate around and the conversion options are quite neat between a simple and
    advanced selection. All the options are presented upfront for you to change them
    on the fly.


    Gnac has the most basic interface possible, allowing you to add audio files, choose
    a file type to edit and then hit go. It works well though, and more options are
    available in the well-laid out. You''ll need a fair bit of time if you need to
    add some extra types for conversion.


    # File types


    SoundKonverter has a decent selection of files it can output, but it''s not the
    best format I''ve ever seen. And there''s a noticeable omission of MP3s for a
    number of reasons, such as being non-free, but it is the most accessible one.
    It is for OGG and FLAC though not a more open source music library.


    Gnac supports a wide range of different file types, however you''ll have to manually
    add them as profiles to use. It''s quite easy to let them run so the only issue
    is having the time to do so. It''s time-consuming gives you a bit of control over
    conversions.


    # Features


    You can perform batch operations for either a load of files or a whole directory.
    You can easily replay gain to try and keep them at a similar volume level all
    tracks or between tracks. Remaining is handled smartly and can be modified to
    your liking,


    Gnac has a bit on light outside of its conversion and profile functions. You can
    change some minor options regarding the output file goes and hit go, but it''s
    there, it''s a very basic piece of software and the features that highlights,


    # Operation speed


    Adding a file type and converting it is quite quick. The interface can slow you
    down slowly compared to the rest of the software


    Decoding either may not have the perfect conversion speed up, which is unlikely
    considering the amount of bitrate variables and, you can easily select your files
    and hit go. Files are converted one at a time, which can be a little slow, but
    the conversion itself at a normal speed.


    # Overall


    # Overall


    SoundKonverter''s strength lies in not having to dig around in the menus to turn
    everything off or for the conversion you''re about to. It''s a bit of a shame
    that it doesn''t support MP3s,


    There''s so much for easy to use Gnac. However the manual adding and difficulty
    in editing them out, coupled with a very basic feature set, makes it a bit too
    simple.


    78 www.linuxuser.co.uk'
