  md: '# Design presentations with Hovercraft


    Use impress.js and reStructuredText to write presentations in a notepad


    # TUTORIAL


    ![](img/df15b709d7e8fa8f2cd7af7eb08775e7_44_0.png)


    **01 impress.js**nAs said earlier, Hovercraft is based on impress.js and reStructuredText.
    First let''s learn more about impress.js. Impress.js is an open source JavaScript
    library, at helping you make presentations beautiful files. It uses CSS3 transforms
    and transitions. Some of the effects that impress.js is capable of are amazing:
    3D effects. When it finishes, the result of impress.js is basically HTML. You
    can see a demo here: bartez@github.io/impress.js


    You may think, what is the need of Hovercraft if impress.js is capable of everything?
    The reason is because impress.js requires you to use HTML and CSS to create presentations
    - not everyone would like to do that or learn something new. Hovercraft combines
    the power of impress.js with the help of reStructuredText to give you a great
    new way to


    plain text files, which then get interpreted into HTML. This output serves as
    the input for impress.js. For the uninitiated, reStructuredText is a SIYWYG text
    markup and parser system. In simple terms it lets you write text, based on defined
    syntax, in any text editor of your choice. There are no steps between, skip them!
    It is widely used as an inline documentation tool generator. Its aims are to be
    simple and unobtrusive so it can be easily understood, which makes it easy to
    create quickly. To understand how reStructuredText works, let''s look at a few
    of the markup rules.


    **02 reStructuredText**nAnother very important component of Hovercraft is the
    reStructuredText. It is with the help of reStructuredText that you can write


    **03 installation**nNow that you are aware of the components, let''s look at installing.
    Hovercraft is written in Python and uses Python 3.2 or higher. You also need a
    pip - package manager that lets you install packages. We use libxml for thecraft
    with the latest version of Python 3.4 as it comes. You will need to separately
    install Hovercraft. If you are on Windows or Linux, download it from here: bitsorg.


