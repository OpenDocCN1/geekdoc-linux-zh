  md: '# # Design presentations in Hovercraft


    Use impress.js and reStructuredText to write presentations in a notepad


    ![](img/df15b709d7e8fa8f2cd7af7eb08775e7_46_0.png)


    ```

    nitish@nitish-Ubuntu:~$ hovercraft -a sample.rst output/

    nitish@nitish-Ubuntu:~$

    ```


    # 08 Presenter''s console


    Templates are a way for you to redefine the look and feel of your presentation.
    By default, Hovercraft has two templates—the first is the default template which
    is to be used during creation of your presentations, and the second is a template
    without the presenter. If you''re not satisfied with these, you can create one
    yourself. Note that Hovercraft generates presentations by converting the content
    into XML and using XSLT to transform the XML into HTML. So, a new template will
    require a template XML file, a configuration file and CSS for other resources.


    Configuration files define the content of the template. It has only one section
    [hovercraft], with subsections you should name it "template". you can use any
    filename with .cfg as the extension. Remember to specify the name of the file
    while using the Hovercraft command or use the default name.


    With file specified in the template parameter of configuration file the actual
    XSLT template performs the XML to HTML. You can take the template XML from templates
    folder in Hovercraft folder and edit it.


    # 07 Special effects


    Hovercraft lets you create some awesome effects like rotate, zoom and even 3D
    and this is possible using impress.js. You can also add fields before a slide
    and then the slide will move itself. Now let us look at various effects and corresponding:


    +   * A pan can be achieved using the data-field of impress.js, which is used
    to indicate the vertical slide.

    * You can use the data-attribute to set the angle of rotation.

    * Zoom effect can be achieved using the data-field. If you set it to 1, a value
    greater than 1 zooming out values less than 1 indicate scrolling.

    * 3D effects can be achieved using the data-perspective or the data-rotate x.


    Learn more about the impress.js fields by using this URL: http://impress.js/v3/


    # 08 Presenter''s console


    This is another awesome feature of Hovercraft. It lets you create slides with
    notes along the slides you have added. It also shows a clock and timer to help
    you rehearse and get an idea of time taken to present each slide. Notes can be
    added to slides like this:


    > : Add your note here


    Add this text to the slide content; otherwise it will create a blank space in
    the middle of your slide. To view the presenter console, just add the -flag when
    creating the presentations. When you open the presentation via a browser, the
    presenter console will appear and you won''t need to pop-up window. Since the
    presenter console appears in a separate tab, you can just remember to share the
    tab to your viewers.


    # 10 Portability


    It is very common to be a presentation on one computer and then presented on another.
    In such cases it is not possible that both computers have the same system layout
    and theme set onto each of them. Hovercraft covers you wherever you go and is
    compatible with all the browsers. One thing is that the different browsers may
    render fonts differently. The solution to solve this problem is to use Hovercraft
    before importing them; this way you can avoid unnecessary problems, and you will
    present your presentation correctly.


    To find a font, save it in a config file inside the folder of your presentation.
    Later, just edit the file to change fonts, grab with #note statement. If you are
    using a default template, you need to edit the /hovercraft/templates/default/hovercraft.css.
    If you use any other template, edit the presentation.css file.


    www.linuxuser.com'
