  md: '# # CuBox-i4Pro

    An apt ARM entry point for home theatre?


    # The CuBox makes use of every cubic millimetre available within the black casing


    ![](img/df15b709d7e8fa8f2cd7af7eb08775e7_82_0.png)


    As with the HummingBox, SolidRun''s internal development turned commercially-available
    hardware into a much more focused and affordable product. The CuBox-i doesn''t
    try to do everything at once. It was built with the capability to expand in the
    future.


    Running the Sysbench, the CuBox-i collected a 95th percentile performance of 22.8MB/s,
    hitting the 40.7MB/s mark which is well ahead of the Raspberry Pi 3 (51.4MB/s
    really shines in multithreaded applications).


    With full support for dual gigabit ethernet, a USB3 port for external storage
    and dual HDMI or optical output, it''s perfectly suited for a home theatre setup.
    The device has a sleek black finish to help it blend in, but the gigabit network
    port is limited to a real-world throughput of 366MB/s. This means anyone who wants
    to use a CuBox-i and eSATA for network attached storage files may find


    performance lower than expected – although perfectly fast enough to stream HD
    video content without any hitch.


    Aside from a few minor software glitches, SolidRun performs exactly as expected.
    In an unexpected turn, the CuBox-i performed admirably during testing. With HummingBoard
    compatibility, to the point of being able to take the microSD card and insert
    it into the other drive, the CuBox-i should tempt those who want to let their
    kids experiment with ARM Linux.


    # Technical specs


    +   - Operating System**: Android 4.4.4 (Debian, GeekBox, Ubuntu available)

    - **Processor**: i.MX6 Quad 1GHz ARM-v7

    - **Memory**: 2GB DDR3 RAM

    - **Dimensions**: 52.2mm x 55.4mm x 4.8mm

    - **Weight**: 119g excluding cables

    - **Storage**: No card, maximum 128GB via microSD or Card plus SATA support

    - **Ports**: 2x GbE ethernet, HDMI, optical / USB 3.0 output, USB host, SATA 3GB/s

    - **Extras**: 802.11(b/g Wi-Fi, Bluetooth, infrared-red receiver

    - **Price**: £79


    ![](img/df15b709d7e8fa8f2cd7af7eb08775e7_82_1.png)


    HummingBoard-i2X

    It''s a considerable price to jump from the sub-30 price of the Banana Pi, but
    SolidRun''s HummingBoard is known as the most powerful freeless Linux SBC with
    its improved layout and dual HDMI outputs, connectivity for high-speed audio and
    video. Versions without WiFi and Bluetooth are also available.


    # Summary


    The CuBox-i''s quad processor makes one of the fastest ARM-based products we''ve
    ever seen, an impressive performance when you need it. As far as hardware, the
    HummingBoard is likely a better choice but the GPIO-compatibility between the
    two means it''s possible to choose and change throughout the life of a project.


    # Raspberry Pi Model 2


    Regardless of the Raspberry Pi design, the new Model 2 has a processor that can''t
    be matched by anything at its price. It''s smaller, however, is more than enough,
    and the added versatility from jackback ports to better connectivity makes it
    easy to come by.


    Gareth Hoffmann


    ![](img/df15b709d7e8fa8f2cd7af7eb08775e7_82_2.png)


    83 www.linuxuser.co.uk'
