    If the filesystem is unable to cache indirect blocks, an additional overhead can
    be seen.


    +   When writing to a regular file, the kernel enters the filesystem through the
    vnode interface (or equivalent). This typically involves locking the file in exclusive
    mode for a single writer and in shared mode for multiple readers. If the UNIX
    API allowed range locks, which allow sections of a file to be locked when writing,
    this would alleviate the problem. However, no API'
