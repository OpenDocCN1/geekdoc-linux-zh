- pgno: 50
  md: 'What happens if you don''t want these permissions when the file is created?
    Each shell supports the umask command that allows the user to change the default
    mask, often referred to as the file creation mask. There are actually two umask
    calls that take the same arguments. The first is a shell builtin variable that
    keeps the specific mask for the lifetime of the shell, and the second is a system
    binary, which is only really useful for checking the existing mask.


    The current mask can be displayed in numeric or symbolic form as the two following
    examples show:


    ```

    $ umask

    022

    $ umask -S

    u=rw-,g=rx,o=rx

    ```


    To alter the creation mask, umask is called with a three digit number for user,
    group, and owner. Each digit must be in the range 0 to 7. The three digits represent
    user, group, owner. Each can allow access for read (r=4), write (w=2), and execute
    (x=1). When a file is created, the caller specifies the new mode or access permissions
    of the file. The umask for process is subtracted from the mode resulting in the
    permissions for the file.


    As an example, consider the default umask, which for most users is 022, and a
    file to be created by calling the touch utility:


    ```

    $ umask

    022

    $ strace touch myfile 2>&1 | grep open | grep myfile

    open("myfile",O_RDWR|O_NONBLOCK|O_CREATE|O_LARGEFILE, 0666) = 3

    $ ls -l myfile

    -rw-r-- 1 space fcf 0 09:45 myfile

    ```


    A umask value of 022 indicates that write access should be turned off for the
    group and others. The touch command creates the file and passes a mode of 666.
    The resulting set of permissions will be 666 - 022 = 644, which gives the permissions
    -rw-r--r--.


    # Changing File Permissions


    There are many of commands that allow the user to change file properties. The
    most commonly used is the chmod utility, which takes arguments as follows:


    ```

    chmod [ -fR ] <absolute-mode> file ...

    chmod [ -fR ] <symbolic-mode-list> file ...

    ```'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# File-Based Concepts 25


    The mode to be applied gives the new or modified permissions of the file. For
    example, if the new permissions for a file should be rxrxr--, this equates to
    the value 744. For this case, chmod can be called with an absolute-mode argument
    as follows:


    ```

    $ ls -1 myfile

    -rw---- 1 spate  fcf      0 Mar 6 10:09 myfile

    $ chmod 744 myfile

    $ ls -1 myfile

    -rwxr--x 1 spate  fcf      0 Mar 6 10:09 myfile*

    ```


    To achieve the same result passing a symbolic-mode argument, chmod can be called
    as follows:


    ```

    $ ls -1 myfile

    -rw-r-- 1 spate  fcf      0 Mar 6 10:09 myfile

    $ chmod u+x,g=r,o=r myfile

    $ ls -1 myfile

    -rwxr-x 1 spate  fcf      0 Mar 6 10:09 myfile*

    ```


    In symbolic mode, the permissions for user, group, or all users can be modified
    by adding (+), removing (-), or by directly setting (=). For example, another
    way to achieve the above change is:


    ```

    $ ls -1 myfile

    -rw---- 1 spate  fcf      0 Mar 6 10:09 myfile

    $ chmod u=wx,g=r,o=r myfile

    $ ls -1 myfile

    -rwxr--x 1 spate  fcf      0 Mar 6 10:09 myfile*

    ```


    One last point of mention is the -R argument which can be passed to chmod. With
    this option, chmod recursively descends through any directory arguments. For example:


    ```

    $ ls -ld mydir

    drwxr-xr-x 2 spate  fcf      4096 Mar 30 11:06 mydir//

    $ ls -1 mydir

    -rw--r-- 1 spate  fcf      0 Mar 30 11:06 fileA

    -rw--r-- 1 spate  fcf      0 Mar 30 11:06 fileB

    $ chmod -R a+w mydir

    $ ls -1 mydir

    drwxr-xr-x 2 spate  fcf      4096 Mar 30 11:06 mydir/

    $ ls -1 mydir

    -rw-rw-rw 1 spate  fcf      0 Mar 30 11:06 fileA

    -rw-rw-rw 1 spate  fcf      0 Mar 30 11:06 fileB

    ```'
