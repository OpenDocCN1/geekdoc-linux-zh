    # The Mode Creation Mask


    There are many commands that can be used to change the properties of files. Before
    describing each of these commands it is necessary to point out the file creation
    mask. Consider the file created using the touch command as:


    ```

    $ touch myfile

    $ ls -l myfile

    -rw-r--r-- 1 spate fcf      Feb 16 14:16 myfile

    ```


    The first command instructs the shell to create a file if it doesn''t already
    exist. The touch invokes the open() or create() system call to instruct the operating
    system to create the file, passing a number of properties along the creation request.
    The rest is that a file of zero length is created.


    The file is created with the owner and group IDs set to those of the caller (as
    specified in /etc/passwd). The permissions of the file indicate that it is readable
    and writable by the owner (rw-) and readable by both other members of the group
    fcf and by everyone.'
