- pgno: 182
  md: '# 156 UNIX Filesystems—Evolution, Design, Implementation


    paths in the earlier research editions will help in understanding the paths through
    the earlier BSD versions.


    The source of all the BSD kernels is now available on a single CD set, distributed
    under the auspices of the ancient UNIX source code license that was introduced
    to allow the research editions to become accessible to anyone. At the time of
    writing, Kirk McKusik, one of the BSD contributors, is distributing the CDs. For
    further information, see www.mckusik.com.


    The most three significant changes that the Berkeley team made in the area of
    filesystems were the directory lookup cache (DNLC), and the introduction of the
    Berkeley File System (FFS), which would eventually be renamed UFS (UNIX File System).
    This was first documented in [MKU84] and is described in more detail in Chapter
    9.


    UFS first appearance in later versions of 4.BSD. Note, however, that it did not
    appear as an additional filesystem but as a replacement for the old research edition
    filesystem because, at that stage, the kernel had no means of supporting different
    filesystem types.


    Around the time of 4.BSD, the old UNIX filesystem had disappeared. The filesystem
    disk layout was that of early UFS, which was considerably more than its predecessor.
    The in-core file structure pointed to an in-core node but this was changed to
    include a copy of the disk-based portion of the UFS inode the file was opened.
    The implementation of name() became more complex with the introduction of the
    name cache (DNLC).


    # File I/O in 4.BSD


    To illustrate some of the areas where BSD UNIX differed from the research editions,
    consider the case of file I/O. At this stage, the BSD implementation had already
    started to move away from the user of area fields to hold information pertaining
    to the read or write operation using the uio and iovec structures as described
    in the section ioStructure in Chapter 7.


    Another difference was the introduction of a function vector, which was accessed
    through the file structure and referenced the following functions:


    fo_rw(). This function was called when performing a read or write operation. For
    reading and writing to/from files, this field pointed to the ino_rw()


    fo_ioctl(). Called to handle the ioctl(S) system call. For file access, the ino_ioctl()
    function was called.


    fo_select(). Called to handle the select(S) system call. For file access, the
    ino_select() function was called.


    fo_close(). Called to handle the close(S) system call. For file access, the ino_close()
    function was called.


    By supporting multiple operation vectors, this allowed applications to sockets
    (a channel for communicating over networks) in the way that'
