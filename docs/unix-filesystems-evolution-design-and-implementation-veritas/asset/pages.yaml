    \ that needs to be accessed.\n\nVxFS is an extent-based filesystem. Regardless\
    \ of the block size chosen for a VxFS filesystem, which can be 1KB, 2KB, 4KB,\
    \ or 8KB, data can be allocated in larger contiguous blocks called extents. The\
    \ minimum size of an extent is identical to the filesystem block size. However,\
