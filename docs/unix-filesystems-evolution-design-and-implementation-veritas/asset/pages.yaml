    # Handling Read Operations in Chorus


    Figure 8.8 shows the steps taken to handle a file in a Chorus-based SVR4 system.
    The PM provides a trap handler in order to be called when a UNIX process executes
    the appropriate hardware instruction to generate a trap for a system. For each
