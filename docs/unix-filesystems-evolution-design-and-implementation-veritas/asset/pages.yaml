  md: '# Closing the File


    u_count was not transferred. Both fields are used to notify the calling process
    of how many bytes were actually read or written.


    The close() system call is handled by the close() kernel function. It performs
    little work other than obtaining the file table entry by calling getf(), zeroing
    the appropriate entry in u_ofile[], and calling close(). Note that a previous
    call to dup() have been made, the reference count of the file table entry must
    be checked before it can be freed. If the reference count (f_count) is 1, the
    entry can be removed and a call to closei() is made to free the inode. If the
    value of f_count is greater than 1, it is decremented and the work of close()
    is complete.


    To release a hold on an inode, iput() is invoked. The additional work performed
    by closei() allows a device driver close call to be made if the file to be a device.

    As close(), iput() checks the reference count of the inode (i_count). If it is
    greater than 1, it is decremented, and there is no further work to do. If the
    count reached 1, this is the only hold on the file so the inode can be released.
    One additional check that is made to see if the hard link count of the inode has
    reached 0. This implies that an unlink() system call was invoked while the file
    was still open. If this is the case, the inode can be freed on disk.


    # Summary


    This chapter concentrated on the structures introduced in the early UNIX versions,
    which should provide readers with a basic grounding in UNIX kernel principles,
    particularly as they apply to filesystems and files are accessed. It says something
    for the design of the original versions of UNIX that many UNIX kernels still bear
    a great deal of similarity to the original versions developed over 30 years ago.


    Lions’ book Commentary on UNIX 6th Edition [LION96] provides a unique view of
    how 6th UNIX was implemented and lists the complete kernel source code. For additional
    browsing, the source code is available for download.


    For a more concrete explanation of the algorithms and more details on the kernel
    in general, Bach’s book Design of the UNIX Operating System [BACH86] provides
    an excellent overview of System V Release 2. Paté’s book UNIX Internals—A Practical
    Approach [PATE96] describes a System V Release 3 variant. The UNIX versions described
    in both books bear most to the earlier UNIX research editions.'
