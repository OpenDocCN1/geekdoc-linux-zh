  md: '# 204 UNIX Filesystems—Evolution, Design, and Implementation


    +   1. Update the link count and timestamps of the root directory in which the
    new file resides.

    2. Update the inode bitmap to show that the inode has been allocated.

    3. Initialize the new inode.

    4. Update the directory block to add the entry for the new file.


    # Replaying the Intent Log


    When a transaction is written to the log, markers are placed to indicate the start
    and end of the transaction. In the event of a system crash, fsck will run and
    perform log recovery for complete transactions it finds in the log. The first
    task is to locate the start of the log by scanning for the lowest transaction
    ID.

    Working from start to finish, each subfunction is replayed, independently. The
    action is specified in the entry. This is a crucial part of the log format. Each
    entry must be able to be performed multiple times if the system crashes during
    log replay, the process can start from the beginning.

    An entry in the log that had an action such as "increment the link count" is not
    idempotent. If replayed multiple times, the inode link count would be invalid.
    Instead, an appropriate action would be "set the inode link count to 3."

    The size of the intent log is chosen when the filesystem is created. It can be
    specified directly. The maximum log size is currently 16MB.


    # Extended Operations


    Certain operations present problems for a journaling filesystem. For example,
    consider the case where the unlink() system call is invoked for a file that has
    a link count of 1. After the unlink() system call returns, the file is considered
    to be deleted. However, this presents a problem if the file is still open. In
    this case, the file cannot be physically removed from disk until the last close
    is performed on the file.

    To alleviate this, VxFS provides inode extended operations. In the case of unlink(),
    VX_IEROVE extended operation is set on the inode to indicate that it should be
    removed. This is a transaction in itself. Any processes wishing to open the file
    will be denied, but processes that already have the file open will continue as
    is.

    In the event of a system crash, extended operations must be completed before the
    filesystem can be accessed. The file will be removed from the filesystem.

    Extended operations are used extensively throughout VxFS but are not visible to
    the user.


    # Online Administration


    One of the failures of UNIX filesystems over the years has been the lack of administrative
    features that can be performed while the filesystem is still'
