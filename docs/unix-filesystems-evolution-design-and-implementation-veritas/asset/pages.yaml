- pgno: 24
  md: '# Chapter 14: Developing a Filesystem for the Linux Kernel


    In order to understand how filesystems are implemented and how they work, it is
    best to play with an existing filesystem and see how it works internally and responds
    to the various file-related system calls. This chapter provides an implementation
    of the old System V filesystem on the Linux kernel. By showing how to utilize
    various kernel debuggers, the chapter shows how to analyze the operation of the
    filesystem.


    There are a number of features omitted from the filesystem that are left for the
    reader to complete.


    # Typographical Conventions


    All of the program listings, UNIX commands, library functions, and system calls
    are displayed in a fixed-width font as shown here.


    Many examples are shown that have required keyboard input. In such cases, all
    input is shown in a **bold, fixed-width font**. Commands entered by the superuser
    are prefixed with the # while commands which do not require superuser privileges
    are prefixed with the $ prompt.


    Shown below is an example of user input:


    ```

    $ ls -l myfile

    -rw-r--r-- 1 space fcf 0 Feb 16 16:14 myfile

    ```


    # Accessing Manual Pages


    The internet offers the opportunity to view the manual pages of all major versions
    of UNIX without having to locate a system of that type. Searching for manual pages,
    such as on Solaris, will reveal a large number of Web sites that enable you to
    scan for manual pages, often for multiple versions of the operating system. The
    following Web site:


    http://unix.about.com/library/misc/blmanpg.htm


    contains pointers to the manual pages for most versions of UNIX and Linux. Manual
    pages contain a wealth of information, and for those who wish to learn more about
    a specific operating system, this is an excellent place to start.


