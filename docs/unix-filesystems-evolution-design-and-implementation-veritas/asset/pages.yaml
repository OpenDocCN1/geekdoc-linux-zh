  md: 'disk access being needed. The same is also true of a write() system call. To
    avoid this doubling buffer, the forcedirect mount option performs the I/O directly
    between the user buffer and the disk to which the file data belongs. In this case,
    the I/O can be performed faster than the doubled buffer I/O. Of course, with this
    scenario the data is not cached in the kernel and a subsequent read operation
    would involve reading the data from disk.


    logging | nologging. By specifying the logging option, the filesystem is mounted
    with journaling enabling, preventing the need for a full fsck in the event of
    a system crash. This is described in the UFS Logging in this chapter.


    # Database I/O Support


    The current read() / write() system call interactions between multiple processes
    that may be multiple concurrent readers but only a single writer. As shown in
    the section Quick I/O for Databases, a earlier in this chapter, write operations
    are synchronized through the VOP_RLLOCK() interface. Database and other applications
    that perform their own locking, this model is highly undesirable.


    With the forcedirect mount option, the locking semantics can be relaxed when writing.
    In addition, I/O is performed between the user buffer and disk, avoiding the extra
    copy that is typically made when performing a read or write. By using UFS direct
    I/O, up to 90 percent of the performance of accessing the raw disk can be achieved.


    For more information on running databases on top of filesystems, see the section
    Quick I/O for Databases earlier in this chapter.


    # UFS Snapshots


    Sun implemented a snapshot mechanism in UFS whereby point-in-time image of the
    filesystem can be achieved, with a backup can be taken. The fssnap command may
    be used to create the snapshot. It takes a filesystem to snap and a directory
    into which the snapshot is file (a sparse file) and returns a pseudo device that
    can be mounted, giving access to the snapshot. Note that UFS snapshots are read-only
    and not persistent across a reboot. As blocks in the snapped filesystem, they
    are first copied to the snapshot. When reading from the snapshot, either the blocks
    are read from the original filesystem if unchanged, or from the snapshot if they
    have been overwritten in the snapped filesystem.


    The following example shows how UFS snapshots are used in practice. First of all,
    a 100MB filesystem is created on the device fs1. This is the filesystem from which
    the snapshot will be taken.


    ```

    # mkfs -F fs /dev/vx/rdsk/fs1:204800

    /dev/vx/rdsk/fs1:204800 sectors in 400 cylinders of 16 tracks, 32 sectors

    ```'
