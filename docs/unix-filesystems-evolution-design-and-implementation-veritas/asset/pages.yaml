    In the second case, the user is already in the root directory of the filesystem
    mounted on /mnt (the v_flag field of the vnode is set to VROOT). The kernel locates
    the mounted vnode through the vfs_nodecovered this directory (/mnt in the root
    directory) is not currently visible to users (it is hidden by the mounted filesystem),
    the kernel must then move up to a level of the root directory. This is achieved
    by obtaining the vnode referenced by “..” in the /mnt directory of the root filesystem.

    Once again, the u_cdir field of the user area will be updated to reflect the new
    working directory.


