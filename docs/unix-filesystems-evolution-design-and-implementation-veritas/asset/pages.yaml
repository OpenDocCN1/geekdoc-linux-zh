    how this is achieved.


    Some of the files make reference to an LWP, a light weight process. The LWP model
    is used to support multiple threads of control within a process. Grouping threads
    under an LWP alters the scheduling properties of the different threads.


    The various files contained within /proc on a process-basis are:


    +   * as. Opening this file gives access to the address space of the process.
    This allows the caller to find a specific address using `lseek()` and then read
    from or write to the address using `read()` and `write()`.'
