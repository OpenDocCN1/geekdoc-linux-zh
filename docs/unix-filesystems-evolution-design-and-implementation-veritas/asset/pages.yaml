- pgno: 402
  md: "# The Filesystem Stat Interface\n\nThe df command displays information about\
    \ the filesystem usage such as the number of free and used blocks. Through the\
    \ super_block operations vector, ufxs exports the ux_stats() function, which is\
    \ called in response to df invoking the stats system call (once for each filesystem).\
    \ The ux_stats() function can be found on lines 1194 to 1210. The prototype is\
    \ shown below:\n\n```\nint\nux_stats(struct super_block *sb, struct stats *buf);\n\
    ```\n\nThe df command will make a call to the stats() system call for each mounted\
    \ filesystem. Here is the prototype for stats().\n\n```\nint stats(const char\
    \ *path, struct stats *buf);\n```\n\nNote that it uses the stats structure which\
    \ is defined below:\n\n```\nstruct stats {\n  long f_type;       /* type of filesystem\
    \ (see below) */\n  long f_beize;      /* optimal transfer block size */\n  long\
    \ f_blocks;     /* total data blocks in file system *\n  long f_free;       /*\
    \ free blocks in fs */\n  long f_bavail;     /* free blocks avail to non-superuser\
    \ */\n  long f_files;      /* total file nodes in file system *\n  long f_ffree;\
    \      /* free file nodes in fs *\n  fsid_t f_fsid;     /* file system id *\n\
    \  long f_namelen;   /* maximum length of filenames *\n};\n```\n\nAs mentioned\
    \ earlier in the book, understanding the requirements of user level is essential\
    \ to understanding the features that are provided by filesystems. The information\
    \ passed through the stats structure corresponds to filesystem limits, such as\
    \ the total number of files and blocks in the filesystem, and existing free resources,\
    \ such as the number of available files and data blocks.\n\nThis example shows\
    \ a breakpoint set within kdb to stop when the kernel enters ux_stats(). The debugger\
    \ is enabled by hitting the Break key as indicated when it is entered:\n\n```\n\
    Entering kdb (current-0xc0b0000, pid 0) on processor 0 due to Keyboard Event\n\
    [kdb] bp ux_stats\nInstruction(i) bp #0 at 0xd08bb40 {[uxfs]ux_stats}\n  is enabled\
    \ globally 1\n[kdb] bl\nInstruction(i) bp #0 at 0xd08bb40 {[uxfs]ux_stats}\n \
    \ is enabled globally 1\n[kdb] go\n```"
  merge: -1
  img_proc: true
