  md: 'considered too great, and the Large File Summit was formed, a group of OS and
    filesystem vendors who wanted to produce a specification that could allow access
    to large files. The specification would then be included as part of the Single
    UNIX Specification (UNIX 5 and onwards). The specification provided the following
    concepts:


    +   - The off_t data type would support one or more sizes as the OS and filesystem
    evolved to a full 64-bit solution.


    +   - An offset maximum, as part of the interface, would give the maximum offset
    that the OS/filesystem would allow an application to use. The offset maximum is
    determined through a call to open() by specifying (or not) whether the application
    wishes to access large files.


    +   - When applications attempted to read parts of a file beyond their understanding
    of the offset maximum, the OS would return a new error code, namely OVERFLOW.


    In order to provide both an explicit means of accessing large files as well as
    a hidden and easily upgradable approach, there were two programmatic models. The
    first allowed the size of off_t to be determined during the compilation and linking
    process. This effectively set the size of off_t and determines the standard system
    calls as read() and write() will be used or whether the large file filesystems
    will be used. Either way, the application continues to read(), write(), and related
    system calls, and the mapping is done during the link time.


    The second approach an explicit model whereby the size of off_t was chosen explicitly
    within the program. For example, on a 32-bit OS, the size of off_t would be 32
    bytes, and large files would need to be accessed through the use of off64_t data
    type. In addition, specific calls such as open64(), read64() would be required
    in order to access large files.


    Today, the issue has largely gone away, with most operating systems supporting
    large files by default.


    # Sparse Files


    Due to their somewhat rare usage, sparse files are often not well understood and
    a cause of confusion. For example, the VxFS filesystem to version 3.5 allowed
    a maximum filesystem size of 1TB but a maximum file size of 2TB. How can a single
    file be larger than the filesystem in which it resides?


    A sparse file is simply a file that contains one or more holes. This statement
    itself is probably the reason for the confusion. A hole is a gap within the file
    for which there are no allocated data blocks. For example, a file could contain
    a 1KB data block followed by a 1KB hole followed by another 1KB data block. The
    size of the'
