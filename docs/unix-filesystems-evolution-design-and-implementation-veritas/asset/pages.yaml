- pgno: 281
  md: 'FLTTRACE. A trace trap (used for single stepping).


    FLTWATCH. A watchpoint function (used to trap on memory access).


    The PCSFAULT function can be used to set the faults to be traced. To put a breakpoint
    on a specific memory access, the PCWATCH function can be used to specify the address
    to be watched and whether an event is triggered for read, write, or execute access.
    This can be used in conjunction with the stop and start control functions.


    Anyone wishing to study how real debugger makes use of /proc should look at the
    Solaris implementation of gdb, the GNU debugger whose source is freely available.


    # The Specfs Filesystem


    Devices, whether block or character, are represented by special files in the filesystem.
    As the number of UNIX filesystem types increased, it was found that each filesystem
    was duplicating effort when managing access to the devices themselves.


    Having multiple special files in the namespace caused an additional problem if
    there could be multiple buffers in the buffer cache representing the same disk
    on. Considering how these files are accessed, returning a filesystem node for
    a device file is incorrect. For example, consider the case where the device file
    resides on a UFS filesystem. Returning a vnode that has the v_op field of the
    vnode set to the list of UFS vnode operations will lead to problems. First, the
    open vnode operation on UFS or any other filesystem has no function to perform
    for regular files. Second, many of the operations that are applicable to regular
    files are not applicable to device files. To make worse, if the vnode goes inactive,
    the filesystem may attempt to close the device even though it is open through
    access to another special file that refers to the same name.


    All of these problems can be solved by adding additional logic inside the filesystem.
    However, consideration must be given on how to handle device access for each vnode
    operation. Furthermore, reference counting to determine when the last one on a
    device occurs is up to the driver. All in all, this leads to a situation that
    has a lot of duplication and is prone to errors.


    To resolve these problems, a new filesystem type, specfs, was introduced in SVR4.
    The specfs filesystem is not visible to users in it cannot be mounted or seen
    from within the namespace.


    During a VOP_LOOKUP() operation, instead of returning a vnode which corresponds
    to the special file, the filesystem makes a call to specv() which returns a new
    spec vnode, that the filesystem must return from the lookup operation. This vnode
    points to a specfs node (snode), a specific data structure that refers to the
    real vnode of the filesystem.


    In the case where one device has more than one entry in the namespace, the snode
    also points to a common specfs vnode. It is through this common vnode that device
    access actually takes place.'
  merge: -1
  img_proc: true
