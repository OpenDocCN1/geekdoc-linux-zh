  md: '# Glossary 413


    **handle**. When opening a file across NFS, the server returns a file handle,
    an opaque object, for the client to subsequently access the file. The file handle
    must be capable of being used across a server reboot and must contain information
    that the filesystem can always use to access a file. The file handle is comprised
    of filesystem and non filesystem information. The filesystem specific information,
    a filesystem ID, node number, and generation count are typically used.


    **fileset**. Traditional UNIX files provide a single hierarchical namespace with
    a single root directory. This is the namespace that becomes visible to the user
    when the filesystem is mounted. Introduced with the Episode filesystem by Transarc
    as part of DFS and supported by other filesystems the filesystem is comprised
    of multiple, disjoint namespaces called filesets. Each fileset can be mounted
    separately.


    **file stream**. The standard I/O library provides a rich number of file-access
    related functions that are built around FILE structure, which holds the file descriptor
    in addition to a data buffer. The file stream is the name given to the object
    through which this type of access occurs.


    **filesystem block size**. Although filesystems and files can vary in size, the
    amount of space given by a file through a single allocation in traditional UNIX
    filesystems is in terms of fixed-size data blocks. The size of such a data block
    is governed by the filesystem block size. For example, if the filesystem block
    size is 1024 bytes and a process issues a 4KB write, 1KB blocks will be allocated
    to the file. Note that for many filesystems the block size can be chosen when
    the filesystem is first created.


    **file table**. Also called the system file table or even the system-wide file
    table, all file descriptors reference entries in the file table. Each file entry,
    typically defined by a file structure, references either an inode or node. There
    may be multiple descriptors referencing the same file entry. This can occur during
    operations such as dup(). The file structure holds the current/write pointer.


    **forced unmount**. Attempting to unmount a filesystem will result in an BUSY
    if there are still open files in the filesystem. In clustering environments where
    different nodes in the cluster can access shared storage, failure of one or more
    resources on a node may require a failover to another node. One task is to unmount
    the filesystem on the failing node and remount it on another node. The failing
    node needs a method to forcibly unmount the filesystem.


    **FreeBSD**. Stemming from the official BSD releases distributed by the University
    of Berkeley, the FreeBSD project was established in the early 1990s to provide
    a version of BSD that is free of USL source code licenses or any other licensing
    obligations.'
