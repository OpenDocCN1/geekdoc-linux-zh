  md: '# Development of the SVR4 VFS/Vnode Architecture 131


    vmin_remove. This function removes a directory entry.

    vop_link. This function implements the link() system call.

    vop_rename. This function implements the rename() system call.

    vop_mkdir. This function implements the mkdir() system call.

    vop_rmdir. This function implements the rmdir() system call.

    vop_readdr. This function reads directory entries from the specified vnode. It
    is called in response to the getdents() system call.

    vop_symlink This function implements the symlink() system call.

    vop_readlink. This function reads the contents of the symbolic link.

    vop_fsync. This function flushes any modified file data in memory to disk. It
    is called in response to an fsync() system call.

    vop_inactive. This function is called when the filesystem-dependent kernel of
    the kernel releases its hold on the vnode. The filesystem can then free the vnode.

    vop_map. This function is used for demand paging so that the virtual memory (VM)
    subsystem vnode is used by the VM and buffer cache layers to read blocks of a
    file into memory following a previous call to vop_map().

    vop_bread. This function reads a logical block from the specified vnode and returns
    a buffer from the buffer cache that references the data.

    vop_brese. This function releases the buffer returned by a previous call to vop_bread.


    If a filesystem does not support some of these interfaces, the appropriate entry
