    caching advisory. Some applications may wish to have control over how I/O is performed.
    Some systems export this capability to applications which select the type of I/O
    being performed, which allows the filesystem to optimize the I/O paths. For example,
    an application may choose between sequential, direct, or random I/Os.


    cdvsw. This structure has been present in UNIX since day one and is used to access
    character-based device drivers. The major number of the driver, as displayed by
    running ls -l, is used to index this array.


    Chorus. The Chorus microkernel, developed by Chorus Systems, was a popular microkernel
    in the 1980s and 1990s and was used as the base of a number of different ports
    of UNIX.


    clustered filesystem. A clustered filesystem is a collection of filesystems running
    on different machines, which presents a unified view of a single, underlying filesystem
    to the user. The machines within the cluster work to recover from events such
    as machine failures.


    context switch. A term used in multitasking operating systems. The kernel implements
    a separate context for each process. Because processes are sliced or may go to
    waiting for resources, the kernel switches context to another runnable process.


    copy on write. Filesystem-related features such as memory-mapped files operate
    on a single copy of the data wherever. If multiple processes are reading from
    simultaneously, there is no need to have multiple copies of the same data. However,
    when files are mapped for write access, a copy will be made of the data (typically
    at the page level) when one of the processes wishes to modify the data. Copy-on-write
    techniques are used throughout the kernel.


    crash. The crash program is a tool that can be used to analyze a dump of the kernel
    following a system crash. It provides a rich set of routines for examining various
    kernel structures.


    CSRG. The Computer Systems Group, the group within the University of Berkeley
    was responsible for producing the BSD versions of UNIX.


    current working directory. Each process has two associated directories, the root
    directory and the current working directory. Both are used when performing pathname
    resolution. Pathnames which start with ''/'' such as /etc/passwd are resolved
    from the root directory while a pathname such as bin/myls starts from the current
    working directory.


    cylinder group. The UFS filesystem divides the filesystem into fixed-size units
    called cylinder groups. Each cylinder group manages a set of nodes and data blocks.
    At the time UFS was created cylinder groups actually mapped to physical cylinders
    on disk.'
