    # Where to Go from Here?


    The Sun VFS/vnode interface was a huge success. Its merger with the File System
    Switch and the SunOS virtual memory subsystem provided the basis for the SVR4
    VFS/node architecture. There were a large number of other UNIX vendors who implemented
    the Sun VFS/vnode architecture. With the exception of the read and write paths,
    the different implementations were remarkably similar to the original Sun VFS/vnode
    implementation.


    # The SVR4 VFS/Vnode Architecture


    System V Release 4 was the result of a merge SVR3 and Sun Microsystems''. One
    of the goals of both Sun and AT&T was to merge the Sun VFS/vnode interface with
    AT&T''s File System Switch.


    The new VFS architecture, which remained largely unchanged for over 15 years,
    introduced and brought together a number of new ideas, and provided a clean separation
    between different subsystems in the kernel. One of the fundamental changes was
    eliminating the tight coupling between the filesystem and the VM subsystem, although
    elegant in design, was particularly complicated resulting in a great deal of difficulty
    when implementing new types.


    # Changes to File Descriptor Management


    A file descriptor had previously been an index into the u_ofile[] array. Because
    this array was of fixed size, the number of files that a process could have'
