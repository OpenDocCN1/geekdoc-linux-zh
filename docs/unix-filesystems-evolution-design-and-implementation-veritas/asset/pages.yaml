    Block devices are represented by the letter b while character devices are represented
    by the letter c. For block devices, data is accessed in fixed-size blocks while
    character devices can be accessed in multiple sized blocks ranging from a single
    character upwards.

    Device files are created with the mknod command as:


    ```

    mknod name b major minor

    mknod name c major minor

    ```


    For example, to create the two files, execute the following commands:


    ```

    # mknod /dev/vx/dsk/homedg/h b 142 4002

    # mknod /dev/vx/rdsk/homedg/h c 142 4002

    ```


    The major number is used to point to the device that controls the device, while
    the minor number is a private field used by the device driver.

    Mkn command is built on top of the mknod() system call:


    ```

    #include <sys/stat.h>

    int mknod(const char *path, mode_t mode, dev_t dev);

