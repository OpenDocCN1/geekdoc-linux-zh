    Logical volumes provide a much easier way to manage disks and create new slices
    (called logical volumes). The volume manager takes ownership of the disks and
    gives out space as requested. Volumes can be simple, in case the volume simply
    looks like a basic raw disk slice, or they can be mirrored or striped. For example,
    the following command can be used with the VERITAS Volume Manager, VxVM, to create
    a new volume:


    ```

    # vxassist make myvol 10

    # vxvprint myvol

    ```'
