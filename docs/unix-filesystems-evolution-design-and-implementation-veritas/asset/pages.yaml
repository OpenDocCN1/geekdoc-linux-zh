    The following example shows how advisory locking fails to become effective if
    processes are not cooperating:


    ```

    $ lock

    [1] 2494

    lock: File is locked

    $ cat myfile

    Hello world

    $ rm myfile

    $ jobs

    [1]+ Running      ./lock &

    ```


    In this case, the file has a segment lock, a non-cooperating process can still
    access the file, thus the real cat program can display the file and the file can
    be removed! Note that removing a file involves calling the unlink( ) system call.
    The file is not actually removed until the last close. In this case the lock program
    still has the file open. The file will actually be removed the lock program exits.


    # Mandatory Locking


    As the previous example shows, if all processes accessing the same file do not
    cooperate through the use of advisory locks, unpredictable results can occur.
    Mandatory locking provides file locking between non-cooperating processes. Unfortunately,
    the implementation, which arrived with SVR3, leaves something to be desired.


    Mandatory locking can be enabled on a file if the set group ID bit is switched
    and the execute bit is switched off—a combination that together does not make
    any sense. Thus if the following were executed on a system that supports mandatory
    locking:


    ```

    $ locks

    [1] 12096

    lock: File is locked

    $ cat myfile # The cat program blocks here

    ```


    The cat program will block until the lock is relinquished. Note that mandatory
    locking is not supported by the major UNIX standards so further details will not
    be described here.


