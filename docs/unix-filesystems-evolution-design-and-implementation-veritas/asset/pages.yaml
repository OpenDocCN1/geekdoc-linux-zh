- pgno: 200
  md: 'Unlike UNIX, there are no flags in the buffer structure. In its place, the
    b_update and b dirt fields indicate whether the buffer contents are valid and
    whether the buffer is dirty (needs writing to disk).


    Dirty buffers are periodically flushed to disk by the update process or the bflush
    kernel thread. The section 2.4 Buffer Cache, later in this chapter, describes
    how bdflush works.


    Valid buffers are hashed by device and block number and held on a linked list
    using the b_next and b_prev fields of the buffer_head structure. Users can call
    getblock() and brelse() to obtain a valid buffer and release it after they have
    finished with. Because the buffer is already linked on the appropriate queue cache,
    brelse() does little other than check if anyone is waiting for the buffer and
    issue the appropriate wake-up call.


    I/O is performed by calling the lr_block() function, which is implemented above
    the device driver layer. If the I/O is required to be synchronous, the calling
    thread will issue a wait_on_buffer(), which will result in the thread sleep until
    the I/O is completed.


    Linux I/O in the earlier versions of the kernel followed the older style UNIX
    model of reading and writing all file data through the buffer cache. The implementation
    is not too different from the cache-based systems described in earlier chapters
    and it won''t be described here.


    # Linux from the 2.4 Kernel Series


    The Linux 2.4 series of kernels substantially changes the way filesystems are
    implemented. Some of the more visible changes are:


    +   - Data goes through the Linux page cache rather than directly through the
    buffer cache. There is still a tight relationship between the buffer cache and
    page cache, however.

    - The dcache is tightly integrated with the other filesystem-independent structures
    such that every file has an entry in the dcache and each entry (which replaces
    the old dir_cache_entry structure) is referenced from the file structure.

    - There has been substantial rework of the various operations vectors and the
    introduction of a number of functions more akin to the SVR4 page cache vnodes.

    - A large rework of the SMP-locking scheme results in finer grain kernel locks
    and therefore better SMP performance.


    The migration towards the page cache for file I/O actually started prior to the
    2.4 kernel series, with file data being read through the page cache while still
    retaining a close relationship with the buffer cache.


    There is enough similarity between the Linux 2.4 kernels and the SVR4 style of
    I/O that it is possible to port SVR4 filesystems to Linux and retain much of'
  merge: -1
  img_proc: true
