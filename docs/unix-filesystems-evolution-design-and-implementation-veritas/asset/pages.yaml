    The b_end_io field allows the user of buffer to specify a completion routine that
    is invoked when the I/O is completed. The b_private field can be used to store
    filesystem-specific data.

    Because the size of I/O operations must be of fixed size as defined by a call
    to set_blocksize(), performing I/O to satisfy page faults becomes a little messy
    if the I/O block is smaller than the page size. To alleviate this problem, the
    page may be mapped by multiple buffers that must be passed to 11_rw_block() in
    order to perform the I/O. It is quite likely, but not guaranteed, these buffers
    will be coalesced by the device driver if they are adjacent on disk.

    The b_state flag was introduced to handle the many different buffers that can
    now be marked. The set of flags is:


    +   - BH_Updtate. Set to 1 if the buffer contains valid data.

    - BH_DIRTY. Set to 1 if the buffer is dirty.

    - BH_Lock. Set to 1 if the buffer is locked.

    - BH_Req. Set to 0 if the buffer has been invalidated.

    - BH_Mapped. Set to 1 if the buffer has a disk mapping.

    - BH_New. Set to 1 if the buffer is new and not written out.

    - BH_Async. Set to 1 if the buffer is under end_buffer_io_asyncI/O.

    - BH_Wait_IO. Set to 1 if the kernel should write out this buffer.

    - BH_launder. Set to 1 if the kernel should throttle this buffer.


    The b_inode_buffers field allows filesystems to keep a linked list of modified
    buffers. For operations that require dirty data to be synced to disk, the new
    buffer cache provides routines to sync these buffers to disk. As with other caches,
    Linux employs a daemon whose responsibility is to flush dirty buffers to disk
    on a regular basis. There are a number of parameters that can be changed to control
    the frequency of flushing. For details, see the bdflush(8) man page.


