  md: '# Developing a Filesystem for the Linux Kernel


    have been allocated along with a summary of both pieces of information. The superblock
    resides in a single UX_MAX buffer, which is held throughout the duration of the
    mount. The usual method of ensuring dirty buffers are flushed to disk is to make
    the buffer dirty as:


    ```

    mark_buffer_dirty(bh);

    ```


    However, the influx is not released until the filesystem is unmounted. Each time
    the superblock is modified, the s_dirty field of the superblock is set to 1. This
    informs the kernel that the filesystem should be notified on a periodic basis
    by the kudate daemon, which is called on a regular interval to flush buffers to
    disk. The update() routine can be found in the Linux kernel source in fs/buffer.c.
    To follow the flow from update() through the filesystem, the following tasks are
    performed:


    ```

    # mkfs /dev/fd0

    # mount -t ufs /dev/fd0 mnt

    # touch /mnt/file

    ```


    Because a new inode is created, a new inode requires information in the superblock
    to be updated. As part of this process, which will be described in more detail
    later in the chapter, the s_dirty field of the in-core superblock is set to 1
    to indicate that the superblock has been modified.


    The ux_write_super() function (1218 to 1229) is called to write the superblock.
