    # # Other Pseudo Filesystems


    There are a large number of different pseudo filesystems available. The following
    sections highlight some of the filesystems available.


    # # The UnixWare Processor Filesystem


    With the advent of multiprocessor-based systems, the UnixWare team introduced
    a new filesystem type called the Processor Filesystem [NADK92]. Typically mounted
    on the /system/processor directory, the filesystem shows one file per processor
    in system. Each file contains information such as whether the processor is online,
    the type and speed of the processor, its cache size, and a list of device drivers
    that are bound to the processor (will run on that processor only).


    # # The Translucent Filesystem


    The Translucent Filesystem (TFS) [HEND90] was developed to meet the needs of software
    development within Sun Microsystems but was also shipped as part of the base Solaris
    operating system.'
