- pgno: 227
  md: '# Disk-Based Filesystem Case Studies 201


    For quite time, VxFFS has allocated inodes on demand, unlike many UNIX filesystems
    that allocate a fixed number of inodes when the filesystem is created. VxFFS does
    not initially create inodes but will grow the inode list as required. It is possible
    to either have a filesystem with a few large files, a filesystem with small files,
    or a combination of both.


    By default, VxFFS will choose a block size of 1024 bytes regardless of the filesystem
    size. This has been shown to be most effective in a wide range of environments.
    However, the block size can be 1KB, 2KB, 4KB, or 8KB. The bsize option can be
    used to override the default.


    The VxFFS intent log is calculated automatically based on the size of the filesystem.
    This can be overridden during mkfs as shown in the section VxFFS Journaling little
    later in this chapter.


    # Forced Unmount


    VxFFS supports the ability to forcibly unmount a filesystem when it is busy. This
    is particularly important in high-availability clustered environments where monitoring
    software has detected a failure and decides to switch to a new host. The filesystem
    must be mounted on the old host, then the new host runs a replay fsck and mounts
    the filesystem. On the original host, it is highly likely that there will still
    be processes using files in the filesystem and therefore, a typical mount will
    fail with EBUSY. The filesystem must be forcibly unmounted.


    The following example how an unmount can be forced:


    ```

    # mount grep mnt2

    # mnt2 /dev/vx/disk/fs1

    read/write/delayog/setuid/nolargefiles/ioerror-mwdisable on Fri Apr 5

    21:54:09 2002

    # cd mnt2

    # sleep 60000&

    [1] 20507

    # cd /

    # unmount: /mnt2

    vxfs unmount: /mnt2 cannot un: Device busy

    # unmount -o force /mnt2

    # jobs

    [1] + Running sleep 60000&

    ```


    Very few UNIX systems support a switchable ummount command. Solaris supports the
    force flag. For other operating systems, the VxFFS-specific ummount command must
    be invoked directly.


    # VxFFS Journaling


    When the system crashes, filesystems are typically damaged structurally. This
    results in a need to run the fsck utility to repair filesystem structures that
    may have been corrupted. Filesystems or other areas that issue I/O can'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'never be sure that the I/Os will be in the event of a crash. Each disk drive
    have a unit of I/O that is guaranteed to be atomic (writes of this size either
    succeed or fail—a drive can never write less than this amount). This is usually
    512 bytes or 1024 bytes on platforms. However, most filesystem operations require
    updates to multiple parts of the filesystem so this atomic I/O size is sufficient.


    Consider the case of file creation. This involves the following operations:


    +   1. Allocate a new inode. This involves flipping a bit in a bitmap to indicate
    that the inode is in use. It may also involve updating information.

    2. Initialize the inode.

    3. Update the directory inode in which the new file belongs. The timestamps of
    the directory are updated and the new file is added to the directory.


    This type of operation involves updating a number of structures that are contained
    in a number of different blocks throughout the filesystem. If the system fails
    after writing some of the data to disk before completing the operation, the filesystem
    will be structurally incomplete. The role of fsck is to detect and repair any
    inconsistencies resulting from a crash. For example, if the inode is allocated
    and not yet linked to the directory, the inode is orphaned and will therefore
    be removed by fsck or placed in lost+found.


    The amount of time taken by fsck is proportional to the amount of meta-data in
    the filesystem and therefore typically dependent on the number of files that exist.
    In a world that is moving toward multi-terabyte filesystems with up to a billion
    files, the amount of time taken to perform fsck is unacceptable, taking tens of
    hours to complete.


    To solve this problem, journaling filesystems are written in such a manner that
    operations either succeed or fail. After ever, the filesystem will be structurally
    sound at all times.


    VxFS solves this problem by performing all updates as transactions. A transaction
    is a record of one or more changes to the filesystem. These changes are written
    to the int log, a circular buffer located within the filesystem, before they are
    written to their specific locations on disk. In the above example, all of the
    operations that comprise the file allocation are captured in a transaction. In
    the event of a system crash, VxFS fsck replays the contents of the int log to
    complete any pending transactions. All records in the log are idempotent so they
    can be repeated an infinite number of times with the same result. This ensures
    that log replay can be restarted if the system crashes while the log itself is
    being replayed.


    To help understand how transactions are written to the log, consider the example
    of creating a new file as:


    ```

    # mount -F vxfs /dev/vx/dsk/fs1 /mnt

    # > /mnt/newfile

    # umount /mnt

    ```'
  merge: -1
  img_proc: true
