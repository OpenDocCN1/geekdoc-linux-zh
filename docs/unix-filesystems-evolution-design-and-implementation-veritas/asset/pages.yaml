    # Module Initialization and Deinitilization


    When writing a loadable kernel module, there are three different things that need
    to be defined:


    +   - A declaration giving information about the type of module

    - A function to be called when the module is loaded. This can perform any initialization
    functions registering the filesystem type with the kernel.

    - A function to be called when the module is unloaded. This can clean up any remaining
    filesystem structures and unregister the filesystem.


    The various components that are applicable to uufs are shown in ux_inode.c on
    lines 1310 to 1317. The module_init() calls the function to run when the module
    is loaded while the module_exit() function specifies the function to be called
    when the module is unloaded. Both of these functions perform little other than
    registering or unregistering the filesystem driver respectively. The DECLARE_FSTYPE_DEV()
    macro is shown below:


    ```

    #define DECLARE_FSTYPE_DEV(var,type,read,flags) \

    struct file_system_type var = {{

    read_super: read, \

    fs_flags: flags, \

    owner: THIS_MODULE, \

    }

    ```


    ```

    #define DECLARE_FSTYPE_DEV(var,type,read) \

    DECLARE_FSTYPE(var,type,read,FS_REQUIRES_DEV)

    ```'
