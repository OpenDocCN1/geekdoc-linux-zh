    # The HP-UX VFS Architecture


    HP-UX has a long and varied history. Although originally derived from System III
    UNIX, the HP-UX 1.0 release, which appeared in 1986, was largely based on SVR2.
    Since that time, many, enhancements have been added to HP-UX from SVR3, SVR4,
    and Berkeley versions of UNIX. At the time of writing, HP-UX is still undergoing
