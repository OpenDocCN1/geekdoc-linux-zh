  md: 'sequentially, some filesystems, as VxFS, allocate large extents (contiguous
    data blocks) to keep file data in one place. When the file is closed, the portion
    of the extent unused is free.


    In order for user quotas to work, there must be a file called quotas in the root
    directory of the filesystem. Similarly, for group quotas, the quotas.grp file
    must be present. Both of these files are used by the administrator to set limits
    for users and/ groups. If both user and group quotas are used, the amount of space
    allocated to a user is the lower of the two.


    There are a number of commands to administer quotas. Those shown here are provided
    by VxFS. UFS provides a similar set of commands. Each command can take a -u or
    -g option to administer user and group quotas respectively.


    vxquota. This command can be used to edit the quota limits for users and groups.


    vxquota. This command provides a summary of the quota limits together with disk
    usage.


    vxquot. This command displays file ownership and usage summaries.


    vxوتاon. This command turns on quotas for a specified VxFS filesystem.


    vxquotaoff. This command turns off quotas for the specified filesystem.


    Quota checks are performed when the filesystem is mounted. This involves reading
    all nodes on disk and calculating usage for each user and group if needed.


    # Summary


    This chapter described the main concepts applicable to filesystems as a whole,
    how they are created and mounted, and how they are repaired if damaged by a system
    crash or other means. Although the format of some of the mount tables differs
    between one system and the next, the location of the files differs only slightly,
    and the principles apply across all systems.


    In general, unless administering a UNIX-based machine, many of the commands here
    will not be used by the average UNIX user. However, having a view of how filesystems
    are managed gain a much better understanding of filesystems overall.'
