- pgno: 372
  md: '# Mounting and Unmounting the Filesystem


    The `ux_read_super()` function is called to mount a ufs filesystem. This function
    is declared through the DECLARE_FTYPE_DEV() macro and becomes known to the Linux
    kernel when the filesystem is registered. The code for this function can be found
    in `ux_inode.c` on lines 1240 to 1302.


    The `ux_read_super()` takes three arguments as shown in `ux_inode.c` on line 1234
    and iterated below:


    ```

    ux_read_super(struct super_block *s, void *data, int silent)

    ```


    There is one super_block structure per filesystem. One of the tasks to be performed
    by `ux_read_super()` is to initialize this structure by filling the following
    fields:


    +   * s_magic. This field holds the magic number of the filesystem, for ufs it
    is 0x58494e55. This field has little practical value.

    * s_block. This field holds the filesystem block size, which in the case of ufs
    is 512 bytes (UX_SIZE).

    * s_op. This field holds the super_operations vector, a set of functions that
    either deal with the filesystem as a whole or all inodes to be read, written,
    and deleted.

    * s_root. This field is set to reference the dentry for the root inode. This is
    described in more detail later.


    The data argument is used by the kernel to pass any arguments that were passed
    to mount. At this stage, ufs does not accept any command line arguments to mount,
    so this parameter is ignored. The silent argument, if set, allows the filesystem
    to writer to display more detailed information when running. This allows debugging
    information to be displayed. The ux_read_super() function must also perform the
    following tasks:


    +   * set_blocksize() to specify the underlying driver the units of I/O that will
    be passed when accessing data through the buffer cache. Note that all subsequent
    I/O must be in fixed-size chunks.

    * Allocate and initialize a root inode for the filesystem. This will be described
    in more detail later.


    The following example shows how to set a breakpoint in gdb, display a stack backtrack,
    and show to display various structures. After of all, the module is loaded, but
    before a calling made to mount a filesystem, a breakpoint is set in ux_read_super()`.
    Controlling-C will enter gdb from which the breakpoint can be set:


    ```

    (gdb) b ux_read_super

    Breakpoint 1 at 0xd08557ca: file ux_inode.c, line 237.

    ```'
  merge: -1
  img_proc: true
