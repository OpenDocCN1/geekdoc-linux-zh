  md: '# 414 UNIX Filesystems—Evolution, Design, and Implementation


    frozen image. A frozen image is a term used to describe filesystem snapshots where
    a consistent image is taken of the filesystem in order to perform a reliable backup.
    Frozen images, or snapshots, can be either persistent or non-persistent.


    fsck. In a journaling filesystem, some operations such as a file rename involving
    several pieces of filesystem meta-data. If a machine crashes while part through
    such an operation, the filesystem is left in an inconsistent state. Before the
    filesystem-specific program called fsck must be run again to repair any inconsistencies
    found. Running fsck can take a considerable amount of time if there is a large
    amount of filesystem meta-data. Note that the time to run fsck is typically a
    measure of the number of files in the filesystem and not typically related to
    the actual size of the filesystem.


    fsdb. Many Unix filesystems are distributed with a debugger which can be used
    to analyze both the on-disk structures and repair inconsistencies found. Note
