    # Miscellaneous Open Options


    Through use of the O_NONBLOCK and O_NDELAY flags that can be passed to open(),
    applications can gain some additional control in the case where they block for
    reads and writes.


    +   O_EXCL. If both O_CRE and O_EXCL are set, a call to open() fails if the file
    exists. If O_CRE is not set, the effect of passing O_EXCL is undefined.

    _NONBLOCK / O_NDELAY. These flags can affect subsequent reads and writes. If both
    the O_NDELAY and O_NONBLOCK flags are set, O_NONBLOCK takes precedence. Because
    both options are use with pipes, they won''t be discussed further here.


    # File and Record Locking


    If multiple processes are writing to a file at the same time, the result is non
    deterministic. Within the UNIX kernel, only one write to the same file may proceed
    at any given time. However, if multiple processes are writing to the file, the
    order in which they can run depending on many different factors. Obviously this
    is highly undesirable and results in a need to lock files at an application level,
    whether the file or sections of it are. Sections of a file are also considered,
    here file and record locking.


    There are numerous uses for file locking. However, looking at database file access
    gives an excellent example of the types of locks that applications require. For
    example, it is important that all users wishing to view database records are able
    to do so simultaneously. When updating records it is imperative that while one
    record is being updated, other users are still able to access other records. Finally
    it is imperative that records are updated in a time-ordered manner.'
