- pgno: 186
  md: '# UNIX Filesystems—Evolution, Design, and Implementation


    Steven Hancock''s book True64 UNIX File System Administration Guide [HANCO1] is
    an excellent source of information on the True64 filesystem architecture and individual
    filesystem implementations. The following sections provide a brief highlight of
    the main features.


    Like other versions of UNIX, True64 employs the same structures related to file
    access, namely file descriptors pointing to the system-wide file table which entries
    to vnodes.


    The per-file data is stored in the process structure which is similar to the traditional
    user area. This employs two limits, a soft limit and hard limit, which determine
    the number of open files that a process may have open at one time. These are governed
    by the setlimit (S) system call.


    The file structure is similar to the BSD counterpart, employing the operations
    vector to access file and sockets.


    Based on the 4BSD Keno VFS, the True64 UNIX VFS has substantial modifications.
    The vnode structure has been significantly modified to include a large number
    of fields in addition to the original BSD vnode structure. Unlike the 5VR4 version,
    which has a v_data field pointing to a filesystem-independent structure, the True64
    vnode is a single structure that contains the filesystem-independent structure
    type is identified by the v_tag field (VT, UFS, VT_NFS etc.).


    Two fields of the vnode reference the pages that have been read into and possibly
    modified. The v_cleanbkd field points to a list of buffers for pages that have
    not been modified, and the v_dirtybkd field references a list of dirty buffers.


    The vnode operations vector is not too dissimilar from the BSD equivalent. Pathname
    lookup is performed by a similar name() implementation that results in the need
    for the VOP_ABORTOP() v operation. In addition to providing a number of vnode
    operations to handle access control lists (ACLs), also called property lists,
    which are interfaces for supporting file access, namely:


    ```

    VOP_BMAP(). . This function maps a file offset to a filesystem block on disk.

    VOP_STRATEGY(). . Called to read or write to/ a file.

    VOP_PGR(). . This function reads a specified page.

    VOP_PWR(). . This function writes a specified page.

    VOP_BREAD(). . This function reads through the buffer cache.

    VOP_BLESSE(). . Releases a buffer.

    ```


    True64 UNIX employed a buffer cache that unified the old style buffer cache with
    the system page cache, allowing coherence between regular file access and memory-mapped
    files. Each unified buffer cache references physical pages in memory. The traditional
    buffer cache remains, but it now only caches filesystem meta-data (inodes and
    other structural components).'
  merge: -1
