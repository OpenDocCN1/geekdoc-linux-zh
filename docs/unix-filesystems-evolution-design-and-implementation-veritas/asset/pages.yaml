    Although 8KB was written to the file, the minimum extent size is 512 blocks, so
    a 512-block extent is allocated. Note that the reservation has been set to 8 blocks
    (8KB in this case) due to the trim option. If the file was truncated to zero,
    it would still retain 8 blocks as marked by the reservation.


    # Caching Advisories


    Through use of the VX_SETCACHE ioctl, VxFS allows caching advisable to be set
    on a file that controls the manner in which I/O takes place. The advisories, which
    allow for direct, unbuffered I/O, and synchronous I/O are described in the section
    Data and Attribute Caching in Chapter 3.'
