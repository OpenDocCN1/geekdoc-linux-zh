- pgno: 160
  md: "open was bound by the size of the array. Most processes do not open a lot of\
    \ files, simply increasing the size of the array is a waste of space, given the\
    \ large number of processes that may be present in the system.\n\nWith the introduction\
    \ of SVR4, file descriptors were allocated dynamically up to a fixed limit. The\
    \ u_ofile[] array was removed and replaced by two new fields, u_nofiles, which\
    \ specified the number of file descriptors that the process can currently access,\
    \ and u_list, a structure of ufchunk that contains an array of NFCHUNK (which\
    \ is 24 pointers) to file table entries. After all entries have been used, a new\
    \ ufchunk structure is allocated, as shown in Figure 7.4.\n\nThe u_ofile[] array\
    \ holds file descriptor flags as set by invoking fcntl() system call.\n\nThe maximum\
    \ number of file descriptors is constrained by a per-process limit defined by\
    \ the rigid limit in the user area.\n\nThere are a number of per-process limits\
    \ within the u_limit[] array. The u_limit [RLIMIT_NOFILE] entry defines both a\
    \ soft and hard file descriptor limit. Allocation of file descriptors will fail\
    \ once the limit is reached. The setrlimit() system call can be invoked to increase\
    \ the limit up to the hard limit, but not beyond. The hard limit can be raised,\
    \ but only by root.\n\n# The Virtual Filesystem Switch Table\n\nBuilt dynamically\
    \ during kernel compilation, the virtual file system switch table, underpinned\
    \ by the vfssw[] array, contains an entry for every filesystem that can reside\
    \ in the kernel. Each entry in the array is defined by a vfssw structure as follows:\n\
    \n```\nstruct vfssw {\n    char *vsw_name;\n    int (*vsw_init)();\n    struct\
    \ vfsops *vsw_vfsops;\n}\n```\n\nThe vsw_init() is the name of the filesystem\
    \ (passed to mount -F). The vsw_init() function is called during kernel initialization,\
    \ allowing the filesystem to perform any initialization it may require before\
    \ a first call to mount().\n\nOperations that are applicable to the filesystem\
    \ as to individual files are held in the vfs_vfsops field of the vfssw structure\
    \ and subsequently in the vfs_ops field of the vfs structure.\n\nThe fields of\
    \ the vfs structure are shown below:\n\nvfs_mount. This function is called to\
    \ mount a filesystem.\n\nvfs_unmount. This function is called to unmount a filesystem.\n\
    \nvfs_root. This function returns the root node for the filesystem. This is used\
    \ using pathname traversal."
