- pgno: 147
  md: '# Development of the SVR4 VFS/inode Architecture


    The development of the File System Switch (FSS) architecture in SVR3, the Sun
    VFS/inode architecture in SunOS, and then the merge between the two to produce
    SVR4, substantially changed the way that filesystems were accessed and implemented.
    During this period, the number of files types increased dramatically, including
    the introduction of commercial filesystems such as VxFS that allowed UNIX to move
    toward the enterprise computing market.

    SVR4 also introduced a number of other important concepts pertinent to filesystems,
    such as tying file access with memory mapped files, the DNLC (Directory Name Lookup
    Cache), and a separation between the traditional buffer cache and the page cache,
    which also changed the way that I/O was performed.

    This chapter follows the developments that led up to the implementation of SVR4,
    which is still the basis of Sun’s Solaris operating system and also freely available
    under the auspices of Calder’s OpenUNIX.


    # The Need for Change


    The research editions of UNIX had a single filesystem type, as described in Chapter
    6. The tight coupling between the kernel and the filesystem worked well'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'at this stage there was only one filesystem type and the kernel was single
    threaded, which means only one process could be running in the kernel at the same
    time.


    Before long, the need to add new filesystem types—including non-UNIX filesystems—resulted
    in a shift away from the old filesystem implementation to a newer, cleaner architecture
    that clearly separated the physical filesystem implementations from those parts
    of the kernel that dealt with file and filesystem access.


    # Pre-SVR3 Kernels


    With the exception of Lions’ book on 6th Edition UNIX [LION96], no other UNIX
    kernels were documented in detail until the arrival of S V Release 2 that was
    the basis for Bach’s book The Design of the UNIX Operating System [BACH86]. In
    his book, Bach describes the on-disk layout to be almost identical to that of
    earlier versions of UNIX.


    There was little change between the research editions of UNIX and SVR2 to warrant
    describing the SVR2 architecture in detail. Around this time, most of the work
    on filesystem evolution was taking place at the University of Berkeley the BSD
    Fast File System which would, in time,


    # The File System Switch


    Introduced with System V Release 3.0, the File System Switch (FSS) architecture
    introduced a framework where multiple different filesystem types could coexist
    in parallel.


    The FSS was poorly documented and the source code for SVR3-based derivatives is
    not publicly available. [PATE6] describes in detail how the FSS was implemented.
    Note the version of SVR3 described in that book contained a significant number
    of kernel changes (made by SCO) and therefore differed substantially from the
    original SVR3 implementation. This section highlights the features of the FSS
    architecture.


    As earlier UNIX versions, SVR3 kept the mapping between file descriptors in the
    user area to the file to in-core nodes. One of the goals of SVR3 was to provide
    a framework under which multiple different filesystem types could coexist at the
    same time. Each time a call is made to mount, the caller could specify the filesystem
    type. Because the FSS could support multiple different filesystem types, the traditional
    UNIX filesystem needed to be so uniquely identified when calling the mount command.
    Thus, it became known as the s5 (System V) filesystem. Throughout the USL-based
    development of System V through the various SVR4 derivatives, little development
    would occur on s5. SCO completely restructured their s5-based filesystem over
    the years and added a number of new features.'
  merge: -1
