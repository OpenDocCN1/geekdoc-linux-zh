- pgno: 270
  md: 'VxFS as an example, the types of locks used to manage in-core inodes are described.


    **Mutex locks.** The mutex (mutual exclusion) lock has a single owner. An adaptive
    mutex is a variant of the mutex under which a trying to acquire the mutex can
    spin (spin lock) or sleep. When spinning, the process constantly tries to acquire
    the lock. If the process chooses to sleep, it relinquishes control of the CPU
    and sleeps until the holding process releases


    **Reader / writer locks.** There are many instances where multiple threads be
    accessing certain structures or sections of code simultaneously but where only
    one thread can modify the same structures. One example, as shown previously, is
    the VOP_BLOCK() node interface. The filesystem can use a reader/writer lock on
    an inode to allow multiple threads to read from the file simultaneously but only
    one thread to actually write to a file at any time.


    **Sleep locks.** Some implementations do not permit mutexes or reader/writer locks
    to sleep if the locks are held. Instead, sleep locks must be used if the thread
    wishes to lock.


    **Turnstiles.** Different threads in the kernel may be running at different priorities.
    Threads of different priorities go to sleep on the same lock and the one with
    the lowest priority is to grab the lock, *priority inversion* occurs; that is,
    the lower priority thread runs in preference to the higher priority thread. Another
    type of priority inversion occurs when a high priority thread blocks on a lock
    held by a lower priority thread. To help alleviate the problem, the priority of
    the higher thread is inherited by the lower priority thread, ensuring that it
    completes its task at the priority of the waiting thread. Turnstile locks provide
    a mechanism whereby mutexes and reader/writer locks can be used with a priority
    inheritance mechanism.


    **Condition variables.** This type of lock, also called a synchronization variable
    on some platforms, is a lock acquired based on some predicate. Threads block on
    the lock and woken when the predicate changes. In SMP environments there is a
    potential for the wakeup to be lost if the condition changes after a thread has
    checked the condition but before it goes to sleep. To alleviate this problem,
    condition variables are typically used in conjunction with mutex, which must be
    acquired before checking and is released when the thread sleeps.


    **Semaphores.** A semaphore is used to access a shared resource either as a binary
    semaphore (a mutex is basically a binary semaphore) or as a counter whereby the
    semaphore is initialized with a number defining how many threads can access the
    resource simultaneously. Each time a thread grabs the semaphore, the count is
    decremented. When it reaches zero, the calling block blocks until a thread releases
    the semaphore.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# Mapping Filesystems to Multiprocessor Systems 245


    When to use different types of locks is not obvious and may change from one platform
    to the next depending on the types of locks available. One decision is the choice
    between spin locks and sleep locks. Spin locks should only be used for very short
    durations. In a 64-way SMP system, it is highly undesirable to have a large number
    of threads waiting for a resource held by one thread on another CPU. On the other
    hand, the sleep/wakeup mechanism is expensive because it can result in a number
    of context switches. When using spin locks it is important to determine the right
    granularity of the lock in relation to the structures that are locked. Can the
    list be split into number of separate lists, each protected by a separate lock?
    Is there a enough performance benefit to warrant the complexity that results from
    breaking up at this level of granularity?


    Getting the level of locking correct is also dependent on the type of workload.
    Getting the balance right and making the correct choices can be the result of
    many years of study!


    # Mapping VxFS to SMP Primitives


    The VERITAS filesystem, VxFS, has been ported to numerous different architectures.
    At the time of writing, VERITAS directly supports Solaris, Aix, HP-UX, and Linux
    using the same code base. Because of the VxFS code is common across all platforms,
    a generic set of locks is used, which maps to the underlying operating system
    locks. VxFS makes use of the following types of locks:


    **Spin locks.** These locks are typically used to modify certain status flags.
    The duration of the operation is very small, which makes it acceptable for other
    threads to wait for the lock.


    **Slee locks.** The putpage is a sleep lock since the vnode page paths through
    the filesystem are linked to result in disk I/O, causing the calling process to
    sleep.


    **Reader / writer locks.** Data structures that support multiple readers but only
    a single writer use this type of lock. Examples would be the inode/write lock
    and the getpage lock. VxFS also uses recursive/writer sleep lock.


    **Synchronization variables.** These types, also called condition variables, provide
    MP sleep/wakeup synchronization. They are used in conjunction with a spin lock,
    which must be obtained prior to deciding whether to sleep or not.


    The I/O paths of various operating systems have been described throughout the
    previous chapters. At the filesystem/kernel the only locking performed is through
    the VOP_RWLOCK() / VOP_RWUNLOCK() vnode operations. The following locks give some
    indication as to how locks can be used to increase the concurrency to structures,
    such as the in-core node.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# The VxFS Inode Reader/Writer Lock


    First, as described above, when reading from or writing to a file, the read/write
    lock must be acquired on the file either at the VOP layer or within the filesystem.
    This is a shared / exclusive lock allowing a single writer and multiple, concurrent
    readers.


    The lock is always acquired in shared mode for read operations and may also be
    acquired in shared mode for write operations. In the case writes access holes
    or in the case of extending writes, the lock must then be acquired in exclusive
    mode. Generally speaking, the lock is held exclusively if blocks need to be allocated
    to the file or if the file size needs changing.


    Because I/O will occur when reading and writing, the inode read / write lock must
    also be a sleep lock.


    # The VxFS Getpage and Putpage Locks


    As with the read/write lock, there can be multiple threads entering through the
    VOP_GETPAGE() interface to satisfy page faults. Therefore, the getpage lock is
    also a reader/writer sleep lock. Some getpage calls may involve allocation and
    the lock must then be taken in exclusive mode. This may occur, for example, on
    a writable mapping over a hole in the file. Because I/O may occur for getpage
    calls, the lock must also be a sleep lock.


    The putpage lock is also a reader/writer sleep lock. Threads that are in the process
    of allocating to the file will take the putpage lock in exclusive mode to block
    threads coming in through the VOP_PUTPAGE() inode interface.


    # The VxFS Inode Lock and Inode Spin Lock


    The preceding locks are primarily concerned with reading from and writing to files.
    There are other inodes that are accessed. The inode lock is used to protect fields
    when the inode needs to be written to disk and to protect the in-core copy of
    the inode when changes are made. This lock is exclusive only.


    The spin lock is used to protect fields of the inode that reside in memory only,
    for example, various flags fields, and read ahead and flush behind.


    # The VxFS Inode List Lock


    At a minimum, inodes are linked onto the file or hash queue when in use. The fields
    used to link the inode onto these lists are held within the inode structure. Moving
    the inode from one list to another involves manipulating a small number of fields.
    A spin lock is used in this case.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# Summary


    It is now not uncommon to see 32- and 64-node SMP systems with many gigabytes
    of memory. The fact that one single kernel has the ability to scale to that number
    of CPUs shows how multiprocessor technology has evolved since the early implementations
    in the 1980s.


    For further information on multiprocessor UNIX systems, Curt Schimmel''s book
    UNIX Systems for Modern Architectures [SCH94] is a must read for anyone interested
    in UNIX multiprocessing and associated hardware. Solaris Internals—Core UNIX Architecture
    by Jim Mauro and Richard McDougall [MAUR01] contains detailed information about
    SMP locks, including the implementation of locking primitives on Solaris. Uresh
    Valhalia''s book UNIX Internals—The New Frontiers [VAHA96] shows various case
    studies of different multiprocessor implementations, as well as describing some
    of the classic multiprocessor issues.'
