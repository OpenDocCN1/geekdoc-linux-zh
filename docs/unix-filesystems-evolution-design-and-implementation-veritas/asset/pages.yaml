- pgno: 278
  md: 'auxv. This file contains dynamic linker information.


    cred. This process contains credentials, defined by the pcred structure, can be
    found here. This includes information such as the real and effective user IDs,
    real and effective group IDs, group, and supplementary group information.


    ctl. This write-only file is used for process control and accounting. A request
    may be made to stop or start a process event tracing,


    cwd. This file is a symbolic link to the process'' current working directory.


    fd. This directory contains files that correspond to the process that has open.
    There is one entry per file.


    lpsinfo, status, usage. These files give information about each of the process
    LWPs. Note that there can be multiple LWPs per process; each contains one or more
    threads.


    map. This file contains an array of pmap structures, each of which describes a
    segment within the virtual address range of the process.


    object. This address space segment maps an underlying file. This directory contains
    read-only files that are referenced by the map and pagedata files. Opening one
    of these files gives a file descriptor for the specific mapped file.


    pagedata. This file allows the caller to track address space references and modifications
    on a per-page basis.


    psinfo. This file gives general information about the state of the process that
    is used by the ps command. The psinfo structure, defined in procfs.h, can simply
    be read from this file.


    rmap. Similar to the map file, this file contains an array of pmap structures.
    These segments are represented by the operating system for structures such as
    the stack.


    root. This file is a symbolic link to the process'' root directory.


    sigact. This file contains an array of sigaction structures which define the disposition
    of signals associated with the traced process.


    status. The information stored in this file, underpinned by the pstatus structure,
    gives a fairly detailed account about the state of the process. This includes
    a set of flags that indicate whether the process is runnable, being single-stepped,
    and so on. Process group and session information, memory size, and tracing data
    are some of the other types of information that can be found in this file.


    usage. This file, underpinned by the prusage structure, gives a wealth of timing-related
    information about the process.


    watch. This file contains an array of pwatch structures, which enable enable a
    process to be debugged. The controlling process can set breakpoints in the process
    by writing a PCWATCH message through the ctl file.


    The lwp directory contains further information about each light weight process.'
