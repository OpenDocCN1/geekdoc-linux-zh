    | block 0 | unused (boot block) |

    | block 1 | superblock | struct filsys |

    | block 2 | inodes each defined by struct inode |

    | block n | data blocks |


    **Figure 6.1** The on-disk layout of the first UNIX filesystem.


    i_atime. The time that the file was last accessed.


    The i_addr field was an array of 8 pointers. Each pointer could reference a single
    disk block, giving 512 bytes of storage or what reference is called an indirect
    block. Each indirect block contained 32 pointers, of which could point to a 512
    byte block of storage or a double indirect block. Figure 6-2 shows the two extremes
    where data blocks are accessed directly from the inode or from indirects.


    In the first example, the inode directly references two data blocks. The file
    size in this case will be 513 and 1024 bytes in size. If the size of the file
    is less than 512 bytes, only a single data block is needed. Elements 2 to 7 of
    the i_addr[] will be NULL in this case.


    The second example shows the maximum possible file size. Each of i_addr[] references
    an indirect block. Each indirect block points to 32 double indirect blocks, and
    each double indirect block points to 32 data blocks. This gives a maximum file
    size of 32 * 32 * 32 = 32,768 data blocks.


    # Filesystem-Related Kernel Structures


    This section describes the main structures used in the UNIX kernel that are related
    to file access, from the file descriptor level down to issuing read and write
    calls to the disk driver.


    # User Mode and Kernel Mode


    Each UNIX process is separated from other processes and from the kernel through
    hardware-protection mechanisms. Thus, one process is unable to access the address
    space of another and is unable to either read from'
