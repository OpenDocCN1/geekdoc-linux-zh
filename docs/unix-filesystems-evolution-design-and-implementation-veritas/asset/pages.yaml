- pgno: 280
  md: "System calls. The process is stopped either when the kernel is entered to process\
    \ a system call or is just about to exit from the kernel back to user space after\
    \ the system call has been processed.\n\nFaults. There are a number of different\
    \ fault types that can be managed, some of which depend on the type of architecture\
    \ on which the operating system is running. Fault types include illegal instructions,\
    \ breakpoints, memory access, and trace traps (used for single stepping).\n\n\
    The truss command is a prime example of a utility that controls another process.\
    \ Its role is to display the system calls made by another process including the\
    \ system calls arguments and return values. The PCENTRY and PCSEXIT control functions\
    \ determine whether a process stops on entry to or exit from a system call. The\
    \ system calls are traced in the sys_t structure, which is passed along with the\
    \ PCENTRY and PCSEXIT control functions. The prlist() function can be used to\
    \ build the complete set of system calls, for a more controlled trace, the set\
    \ of system calls monitored can be altered using the praddset() and prdelset()\
    \ functions.\n\nThere are a number of different control functions that both stop\
    \ and start a process. As an example these are relevant to truss, the PCSTOP directs\
    \ the process to stop on an event of interest and waits for it to stop. An event\
    \ of interest is defined by invoking PCSTR (calls to be traced), PCFAULT (faults\
