    standards dictate that if a file contains a hole and data is read from a portion
    of a file containing zeroes, zeroes must be returned. When reading the sparse
    file above, we will see the same result as for a file created as follows:


    # User | Filesystem


    | User | Filesystem |

    | create () | Create a new file |

    | write (1k of 0) | Allocate a new 1k block for range 1023 to 2047 bytes |

    | write (1k of ''b'') | Allocate a new 1k block for range 1024 to 2047 bytes |

    | close () | Close the file |


