  md: "+   Call ux_dirdel() to remove the directory name from the parent\ndirectory.\
    \ This is described in more detail later.\n\n+   Free all of the directory blocks.\n\
    \n+   Free the inode by incrementing the s_nfree field of the superblock\nand\
    \ marking the slot in s_nfree [] to indicate that the inode is free.\n\nThe dirl()\
    \ function (lines 545 to 576) walks through each of the directory\nblocks comparing\
    \ the d_ino field of each ux_dire structure found with the\nname. If a match is\
    \ found, the d_ino field is set to 0 to indicate that the\nlot is free. This is\
    \ not an ideal solution if many files are created and\nremoved in the same directory,\
    \ there will be a fair amount of unused space.\nHowever, for the purpose of demonstrating\
    \ a simple filesystem, it is the easiest\nsolution to implement.\n\n# File I/O\
    \ in uufs\n\nFile I/O is typically one of the most difficult areas of a filesystem\
    \ to implement.\nTo increase filesystem performance, this is one area where a\
    \ considerable amount\nof time is spent. In Linux, it is very easy to provide\
    \ a fully working filesystem\nwhile spending a minimal amount of time of the I/O\
    \ paths. There are many\\generic functions in Linux that the filesystem can call\
    \ to handle all the\ninteractions with the page cache and buffer cache.\n\nThe\
    \ section I/O in the 2.2 Linux Kernel in Chapter 8 describes some of the\ninteractions\
    \ with the page cache. Because this chapter presents a simplified view\nof filesystem\
    \ activity, the cache internals are not described. Instead,\nt following sections\
    \ show how the kernel interacts with the ux_get_block()\nfunction exported by\
    \ uds. This function can be used to read data from a file or\nalocate blocks and\
    \ write data.\n\nFirst of all, the main entry points into the filesystem for I/O.\n\
    These are exported through the file_operations structure as:\n\n```\nstruct file_operations\
    \ ux_file_operations = {\n\tlseek:   generic_file_lseek,\n\tread:    generic_file_read,\n\
    \twrite:   generic_file_write,\n\tmmap:    generic_file_mmap,\n};\n```\n\nSo all\
    \ for the main file I/O related operations, the filesystem defers to the\nLinux\
    \ generic file I/O routines. The same is true for operations on any of the\nmapped\
    \ file interactions, whether for user-level mappings or for handling\noperation\
    \ within the page cache. The address related operations are:\n\n```\nstruct address_space_operations\
    \ ux_aops = {\n\treadpage:  ux_readpage,\n```"
