  md: '# Developing a Filesystem for the Linux Kernel


    As many with that inodes and data blocks in uxfs, the tasks performed by ux_delete_inode()
    and others are greatly simplified because all of the information is held in the
    superblock.


    # File Creation and Link Management


    Before creating a file, UNIX utilities will invoke the stat() system call to see
    if the file exists. This will involve the kernel calling the ux_lookup() function.
    If the file name does not exist, the kernel will store a negative entry in the
    dcache. Thus, there are additional calls to stat() for the same file, the kernel
    can see that the file does not exist without an additional call to the filesystem.


    Shown below is output from the trace command when using the cp command to copy
    file foo:


    ```

    stat64("foo", 0xffffe0) = -1 ENOENT (No such file or directory)

    stat64("file", [st_mode=S_IREG|0644, st_size=0, ...]) = 0

