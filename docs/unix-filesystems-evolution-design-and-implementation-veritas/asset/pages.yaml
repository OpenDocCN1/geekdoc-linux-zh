    # Extent Reorg and Directory Defragmentation


    When extents are allocated to files, an attempt is made to allocate them in the
    most optimal manner. Over time, though, the filesystem becomes fragmented. Small
    free extents are spread over the filesystem resulting in a less optimal choice
    when allocating extents to new files. Many filesystems employ different techniques
    to try and reduce the amount of defragmentation; that can provide some measure
    of success. However, regardless of the technique used, fragmentation will still
    occur over time in all filesystems.


    VxFS provides, through the fsadm utility, through which fragmentation can be reduced
    while the filesystem is still online and active. The process involves locating
    files that have fragmented maps and performing extent re on files to make the
    extents contiguous wherever possible. This involves allocating new extents and
    copying existing data where necessary. In making files contiguous, free space
    is consolidated for better allocations in the future.


    Similarly, as files are allocated and removed, directories can become fragmented
    over time. Directories can also be defragmented with the use of fsadm command.


    Both reorg and directory defragmentation should be run regularly on a filesystem
    to ensure that the most optimal layout is achieved at all times.


    # VxFS Performance-Related Features


    Although VxFS will tune itself to the underlying system based on available memory,
    number of CPUs, volume geometry, and so on, certain applications may wish to perform
    I/O in a very specific manner. Also, in some environments performance may be critical
    whereas data integrity may not be an absolute priority.


    To allow for such a wide range of environments and needs, VxFS provides a large
    number of different performance-related features, as described in the following
    sections.


    # VxFS Mount Options


    There are numerous different options that can be passed to the VxFS mount command.
    First of all is the option to alter the way in which the intent log is managed
    to allow for a trade-off between data integrity and performance. The following
    four options are available:'
