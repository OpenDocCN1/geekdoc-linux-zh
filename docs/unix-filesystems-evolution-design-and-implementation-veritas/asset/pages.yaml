    # User | Filesystem


    | User | Filesystem |

    | create () | Create a new file |

    | lseek (to1k) | No effect on the file |

    | write (1k of ''b'') | Allocate a new 1k block for range 1024 to 2047 bytes |

    | close () | Close the file |


    The chain of these events also results in a file size of 2048 bytes. However,
    by seeking to a part of the file that doesn''t exist and writing, the allocation
    occurs at the position in the file specified by the file pointer. Thus, a single
    1KB block is allocated to the file. The two different allocations are shown in
    Figure 3.3.


