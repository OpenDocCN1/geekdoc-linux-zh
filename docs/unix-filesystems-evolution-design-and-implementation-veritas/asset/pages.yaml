  md: 'allowing it to be used by other processes if required. This leaves a large
    number of dirty (modified) buffers in the buffer cache. A kernel daemon or thread
    called bflush runs periodically and flushes buffers to free space in the buffer
    cache and helping to provide better data integrity by not caching modified data
    for too long a period.


    **block device.** Devices in UNIX can be either block or character referring to
    method through which I/O takes. For block devices, as a hard disk, data is transferred
    in fixed-size blocks, which are typically a minimum of 512 bytes.


    **block group.** As cylinder groups on UFS and allocations upon VxFS, the ext2
    filesystem divides the available space into block groups with each block managing
    a set of inodes and data blocks.


    **block map.** Each inode in the filesystem has a number of associated blocks
    of data pointed to directly from the inode or from a direct block. The mapping
    between the inode and the data blocks is the block map.


    **bmap.** There are many places within the kernel and within fileystems where
    there is a need to translate a file offset into the corresponding block on disk.
    The bmap() function is used to achieve this. On some UNIX kernels, the filesystem
    exports a bmap interface that can be used by the rest of the kernel, while on
    others, the operation is internal to the filesystem.


    **BSD.** The Berkeley Software Distribution is the name given to the version of
    UNIX which was distributed by the Computer Systems Research Group (CSRG) at the
    University of Berkeley.


    **BSDI.** Berkeley Software Inc. (BSDI) was a company established to develop and
    distribute a fully supported, commercial version of BSD UNIX. When the kernel
    reads data to from block devices such as a hard disk, it uses the buffer cache
    through which blocks of data can be cached for subsequent access. Traditionally,
    regular file data has been cached in the buffer cache. In SVR4-versions of UNIX
    and some other kernels, the buffer cache is only used to cache filesystem meta-data
    such as directory blocks and inodes.


    **buffered I/O.** File I/O typically travels between the user buffer and disk
    through a set of kernel buffers whether the buffer cache or the page cache. Access
    to data that has been accessed recently will involve reading the data from the
    cache without having to go to disk. This type of I/O is buffered as opposed to
    direct I/O where the I/O transfer goes between the user buffer and the blocks
    on disk.


    **cache coherence.** Caches can be employed at many of different levels within
    a computer system. When multiple caches are provided'
