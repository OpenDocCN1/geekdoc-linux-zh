  md: '# Development of the SVR4 VFS/Vnode Architecture 129


    Vnode architecture are not required to support all vnode operations. For those
    operations not supported, the appropriate field of the vnodeops vector will be
    set to fs_nosys, which simply returns ENOSYS.


    # The uio Structure


    One way of meeting the goals of avoiding user area references was to package all
    I/O-related information into a uio structure that would be passed across the vnode
    interface. This structure contains the following elements:


    ```

    uio_iov. A pointer to an array of iovec structures each specifying a user address
    and a byte count.

    ```


    ```

    uio_iovcnt. The number of iovec structures.

    ```


    ```

    uio_offset. The offset within the file that the read or write will start from.

    uio_seflig. This field indicates whether the request is from a user process (user
    space) or a kernel subsystem (kernel space). This field is required by the kernel
    copy routines.

    ```


    ```

    uio_resid. The residual count following the I/O.

    ```


    Because the kernel was providing filesystems such as NFS, for which requests come
    over the network into the kernel, the need to remove user access was imperative.
    By creating a uio structure, it is easy for NFS to make a call to the underlying
    filesystem.

    uio structure also provides the means by which the readv() and write() system
    calls can be implemented. Instead of making multiple calls into the filesystem
    for I/O, several iovec structures can be passed in the same time.


    # The VFS Layer


    The list of mounted filesystems is maintained as a linked list of vfs structures.
    As with the vnode structure, this structure must be filesystem independent. The
    vfs_data field can be used to point to any filesystem-dependent data structure,
    for example, the superblock.


    Similar to the File System Switch method using macros to access filesystem-specific
    operations, the vfsops layer utilizes a similar approach. Each filesystem provides
    a vfs structure that contains a list of functions applicable to the filesystem.
    This structure can be accessed from the vfs_op field of the vfs structure. The
    set of operations available is:


    ```

    vfs_mount. The filesystem type is passed to the mount command using -F option.
    This is then passed through the mount() system call and is used to locate the
    vfsops structure for the filesystem in question. This function can be called to
    mount the filesystem.

    ```


    ```

    vfs_unmount. This function is called to unmount a filesystem.

    ```'
