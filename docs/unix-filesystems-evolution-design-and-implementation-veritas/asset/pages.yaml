- pgno: 69
  md: "O_SYNC. For all types of writes, whether allocation is required or not, the\
    \ data and any meta-data updates are committed to disk before the write returns.\
    \ For reads, the access time stamp will be updated before the read returns.\n\n\
    O_DSYNC. When a write occurs, the data will be committed to disk before the write\
    \ returns but the file's meta-data may not be written to disk at this stage. This\
    \ will result in better I/O throughput because, if implemented by the filesystem,\
    \ the number of updates will be minimized, effectively halving the number of writes.\
    \ Typically, if the write results in allocation to the file (a write over a hole\
    \ or beyond the end of the file) the meta-data is also written to disk. However,\
    \ if the write does not involve an allocation, the timestamps will typically not\
    \ be written synchronously.\n\nO_SYNC. If both the O_SYNC and O_DSYNC flags are\
    \ set, the return after the data has been read and the file attributes have been\
    \ updated on disk, with the exception of file timestamps that may be written.\
    \ If there are any writes covering the range of data to read, these writes are\
    \ committed before the read returns.\n\nIf both the O_SYNC and O_DSYNC flags are\
    \ set, the behavior is identical to that of setting O_SYNC and O_DSYNC except\
    \ that all file attributes changed by the read operation (including all time attributes)\
    \ must be committed to disk before the read returns.\n\nWhich option to choose\
    \ on the application. For I/O intensive applications where timestamps are not\
    \ particularly important, there can be a significant performance boost using O_DSYNC\
    \ in place of O_SYNC.\n\n# VxFS Caching Advisors\n\nSome filesystems provide standard\
    \ methods of improving I/O performance by offering additional features. For example,\
    \ the VERITAS filesystem, VxFS, provides the noatime option that disables access\
    \ updates; this is usually fine for most application environments.\n\nThe following\
    \ example shows the effect that selecting O_SYNC versus O_DSYNC can have on an\
    \ application:\n\n```\n#include <sys/unistd.h>\n#include <sys/types.h>\n#include\
    \ <fcntl.h>\n\nmain(int argc, char argv[])\n{\n    char\n    buf[4096];\n    int\n\
    \    fd, advisory;\n\n    fd = open(\"myfile\", O_WRONLY|O_DSYNC);\n    for (i=0;\
    \ i<1024; i++) {\n        write(fd, buf, 4096);\n    }\n}\n```"
