- pgno: 226
  md: '# 200 UNIX Filesystems—Evolution, Design, and Implementation


    ![](img/730b37b12231377a346ba9a27cbd6a68_226_0.png)


    Figure 9.3 Managing VFS allocation units and extent maps.


    meta-data within a file itself.

    When a filesystem is created, only one or two AUs are initially used. This is
    specified in the AU state file and the corresponding extent summaries and bitmaps
    are expanded to reflect this. However, because none of the other AUs are used,
    the summaries and bitmaps are not allocated. As new files are allocated, more
    and more AUs are used. To make use of an unused AU, the state file is updated,
    and the summary and bitmaps are extended and updated with the appropriate summary
    and bitmap information.

    This why initial allocation of a VxFS filesystem is constant no matter the size
    of the filesystem being created.


    # Creating VFS Filesystems


    The VxFS mkfs command has changed substantially over the years. Earlier disk layouts
    had a layout similar to UFS and had numerous parameters that could be passed to
    mkfs to control alignment of filesystem structures.

    If no size is passed to mkfs, VxFS will query the device on which the filesystem
    will be made and create a filesystem with the following devices:


    ```

    # mkfs -F vxfs /dev/vx/rdsk/fs1

    version 4 layout

    204800 sectors, 102400 blocks of size 1024, log size 1024 blocks

    unlimited inodes, largefiles not supported

    102400 data blocks, 102180 free data blocks

    4 allocation units of 32768 blocks, 32768 data blocks

    last allocation unit has 4096 data blocks

    ```


    The size of the filesystem can also be specified in terms of sectors or by specifying
    a suffix of k (kilobytes), m (megabytes), or g (gigabytes). For example, to create
    a 100MB filesystem, mkfs is run as follows:


    ```

    # mkfs -F vxfs /dev/vx/rdsk/fs1 100m

    ```'
