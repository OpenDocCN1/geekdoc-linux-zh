- pgno: 379
  md: "If there are any inodes or buffers used by the filesystem that have not been\
    \ freed, the kernel will free them and display a message on the console about\
    \ their existence. There are places within ufs where this will occur. The exercises\
    \ at the end of the chapter for further information.\n\n# Directory Lookups and\
    \ Pathname Resolution\n\nThere are three main entry points into the filesystem\
    \ for dirname resolution, namely ux_readdr(), ux_lookup(), and ux_read_inode().\
    \ One interesting way to see how these three functions work together is to consider\
    \ the interactions between the kernel and the filesystem in response to the user\
    \ issuing an ls on the root directory. When the filesystem is mounted, the kernel\
    \ already has a handler on the root directory, which exports the following operations:\n\
    \n```\nstruct inode_operations ux_dir_inops = {\n    create: ux_create,\n    lookup:\
    \ ux_lookup,\n    mkdir: ux_mkdir,\n    rmdir: ux_rmdir,\n    link: ux_link,\n\
    \    unlink: ux_unlink,\n};\n\nstruct file_operations ux_dir_operations = {\n\
    \    read: generic_read_dir,\n    readdr: ux_readdr,\n    fsync: file_fsync,\n\
    };\n```\n\nThe kernel has two at directory level for name resolution. The first\
    \ is to call ux_readdr() to obtain the name of all the directory entries. After\
    \ the filesystem is mounted, the only inode in memory is the root node so this\
    \ operation can only be invoked on the root node. Given a filename, the ux_lookup()\
    \ function can be used to look up a name relative to a directory. This function\
    \ is expected to return the inode for the name found.\n\nThe following two sections\
    \ describe each of these operations in detail.\n\n# Reading Directory Entries\n\
    \nWhen calling a ls, the ls command needs to know about all of the entries in\
    \ the specified directory or the current working directory if ls is typed without\
    \ any arguments. This involves calling the getdents() system call. The prototype\
    \ for getdents() is as follows:\n\n```\nint getdents(unsigned int fd, struct dirent\
    \ *dirp, unsigned int count);\n```"
