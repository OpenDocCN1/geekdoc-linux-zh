    \ to see the calls it is making or use the ls program (shown in Chapter 2).\n\n\
    # Inode Manipulation\n\nPrevious sections have already highlighted the interactions\
    \ between the kernel, the inode cache, and the filesystem. When a lookup is made\
    \ into the filesystem, uxfs locates the inode number and then calls get() to read\
    \ the node into memory. The following sections describe the inode cache/filesystem\
    \ interactions in more detail. Figure 14.6 can be used for a high-level view of\
    \ these interactions.\n\n# Reading an Inode from Disk\n\nThe ux_read_inode() function\
    \ (lines 1061 to 1109) is called from the kernel get() function to read an inode\
    \ into memory. This is typically called as a result of the kernel calling ux_lookup().\
    \ A partially initialized inode structure is passed to ux_read_inode() as follows:\n\
    \n```\nvoid\nux_read_inode(struct inode *inode)\n```"
