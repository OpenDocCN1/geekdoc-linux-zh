    monolithic UNIX implementations would be replaced by microkernel-based implementations.
    Mach was the basis of the OSF (Open Software Foundation) kernel and Chorus was
    employed by a number of UNIX vendors using microkernel technology as the core
    of its UNIX operating system is Digital (no Compaq), which used OSF/1. The GNU
    Hurd also uses Mach as its base. Chorus has been used for a number of projects
    within Sun Microsystems.


    Resistance to change is always a factor when moving from one operating system
    to another. The cost of replacing one OS technology with another for no perceived
    gain in functionality is another. As UNIX evolved, moving the monolithic source
    base to a microkernel-based implementation was a costly project. Porting filesystems
    is expensive and the amount of code reuse was not high as it could have been.
    The original attempts at serverization of UNIX were certainly one of the main
    reasons why the porting efforts were so hard. On Chorus, replacing the multiple
    actors with a single UNIX actor, together with emulation of certain SVR4 features
    such as the segmap driver, would have made Chorus a more appealing solution.


    Having said all of that, microkernels have their place in various niche markets,
    but some large opportunities were missed to fully realize on the technology.


