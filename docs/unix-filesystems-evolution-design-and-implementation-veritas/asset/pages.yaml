- pgno: 74
  md: "# UNIX Filesystems—Evolution, Design, and Implementation\n\nThe segment to\
    \ be locked contains a previous locked segment, in whole or part, the result will\
    \ be a new, single locked segment. Similarly, if F_ULOCK is specified, the segment\
    \ of the file to be unlocked may be a subset of a previously locked segment or\
    \ cover more than one previously locked segment. If size is 0, the file is unlocked\
    \ from the current file offset to the end of the file. If the segment to be unlocked\
    \ is a subset of a previously locked segment, the result will be one or two smaller\
    \ segments.\n\nIt is possible to reach deadlock if two processes make a request\
    \ to lock segments of a file owned by each. The kernel is able to detect this\
    \ and, if the condition would occur, EADELOCK is returned.\n\nNote mentioned above\
    \ that flock() is typically implemented on top of fcntl() system call, for there\
    \ are three commands that can be passed to manage record locking. Recall the interface\
    \ for fcntl():\n\n```\n#include <sys/types.h>\n#include <unistd.h>\n#include <fcntl.h>\n\
    \nint fcntl(int infild, int cmd, ...);\n```\n\nAll commands operate on the flock\
    \ structure that is passed as the third argument:\n\n```\nstruct flock {\n   \
    \ short l_type;      /* F_RDLCK, F_WRLCK or F_UNLOCK */\n    short l_whence; \
    \  /* flag for starting offset */\n    off_t l_start;     /* relative offset in\
    \ bytes */\n    off_t l_len;       /* size; if 0 then until EOF */\n    pid_t\
    \ l_pid;       /* process ID of lock holder */\n};\n```\n\nThe commands that can\
    \ be passed to fcntl() are:\n\nF_GETLK. This command returns the lock that is\
    \ covered by the flock structure. The information that is retrieved overwrites\
    \ the fields of the structure passed.\n\nF_SETLK. This command sets a new lock\
    \ or clears an existing lock based on the value of l_type shown above.\n\nF_SETKW.\
    \ This command is the same as F_SETLK with the exception that the process will\
    \ block if the lock is held by another process.\n\nBecause record locking as by\
    \ fcntl() is supported by appropriate UNIX standards, it is the routine that should\
    \ be ideally used for application portability.\n\nThe following code fragments\
    \ show how advisory locking works in practice. The first program, lock, which\
    \ follows, sets a writable lock on the whole of the file myfile and calls pause()\
    \ to wait for a SIGUSR1 signal. When the signal arrives, a call is made to unlock\
    \ the file."
