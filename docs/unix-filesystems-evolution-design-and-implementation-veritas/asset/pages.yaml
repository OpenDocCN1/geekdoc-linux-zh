  md: '# The HP-UX Filesystem-Independent Layer


    HP-UX maintains the mapping between file descriptors in the user area through
    the system file table to a vnode, as other VFS/vnode architectures. File descriptors
    are allocated dynamically as in SVR4.


    The file structure is similar to its BSD counterpart in that it includes a vector
    of functions so that the user can access the filesystem and sockets using the
    same set of file-related calls. The operations exported through the file table
    are fo_rw(), fo_ioctl(), fo_select(), and fo_close().


    # The HP-UX VFS/Vnode Layer


    Readers familiar with the SVR4 VFS/vnode architecture will find many similarities
    with the HP-UX implementation of vnodes.


    The vfs structure, providing some additional details, retains most of the original
    fields of the Sun implementation as documented in [KLE86].


    The VFS operations more resemble the SVR4 interfaces but also provide additional
    interfaces for quota management and enabling the filesystem to export a freeze/thaw
    capability.


    The vnode structure details in that it maintains a linked list of clean (v_cleanbkd)
    and dirty (v_dirtylkd) buffers associated with the file. This is somewhat similar
    to the v_pages in the SVR4 vnode structure although SVR4 does not provide an easy
    way to determine which pages are clean and dirty without walking the list of pages.
    Management of these lists is described in the next section. The vnode also provides
    a mapping to entries in the DNLC.


    Structures used to pass data across the vnode interface are similar to their Sun/SVR4
    VFS/vnode counters. Data reading and writing is passed through a uio structure
    each I/O being defined by an iovec structure. Similarly, for operations that set
    and retrieve file attributes, the vattr structure is used.


    The set of vnode operations has changed substantially since the VFS/vnode architecture
    was introduced in HP-UX. One can see similarities between the HP-UX and BSD VFS/vnode
    interfaces.


    # File I/O in HP-UX


    HP-UX support for memory-mapped files. File I/O still goes through the buffer
    cache, but there is no guarantee of data consistency between the page cache and
    buffer cache. The interfaces exported by the filesystem and through the vnode
    interface are shown in 8.2.


    Each filesystem provides a vop_rdwr() interface through which the kernel enters
    the filesystem to perform I/O, passing the I/O specification through a uio structure.
    Considering a read(s) system call for now, the filesystem will work through the
    user request calling into the buffer cache to request the appropriate'
