- pgno: 220
  md: 'In addition to these advisories, VxFS also implements discovered direct I/O.
    This is similar to direct I/O but is performed without user intervention. For
    I/O operations of specific sizes, determined by VxFS, the I/O is performed as
    a direct I/O, assuming the buffer and I/O size meet alignment requirements.


    # User and Group Quotas


    VxFS supports user and group quotas allowing limits to be set on both the number
    of files allocated and the number of blocks used. For both types of quotas, the
    following two limits apply:


    +   - **Hard limit.** This limit cannot be exceeded under any circumstance. Attempts
    to allocate more files or blocks will fail.

    - **Soft limit.** This limit can be exceeded temporarily for a specified time
    after which it defaults to seven days. After the time limit has expired, no further
    allocations can be made.


    For more details on VxFS quotas, see the section *User and Group Quotas* in Chapter
    5.


    # Files Snapshots / Checkpoints


    VxFS supports a number of different snapshot mechanisms, both persistent and non
    persistent, also system reboots or mount operations. Chapter 12 describes these
    mechanisms in detail.


    # Panic Free and I/O Error Handling Policies


    Unusual in filesystem code, there is no explicit call within VxFS to panic the
    filesystem. If errors are detected, as an I/O error, VxFS disables access to specific
    filesystem structures while still allowing access to other structures on disk.
    For example, when reading an inode, VxFS performs validation of the inode to ensure
    that the structure is intact. If the inode fails validation, it is marked bad
    and a flag is set to perform a *fsck*. However, access can continue to the rest
    of the filesystem. This is also true when reading other filesystem structures.


    This policy became problematic with the introduction of fiber channel in commonplace.
    The vulnerability of such a hardware configuration became relatively obvious.
    Over time, cables were accidentally unplugged, resulting in temporary I/O errors
    causing VxFS to mark inodes bad. This resulted in a full *fsck* to repair the
    damaged filesystem.


    The I/O error-handling policies were modified to on how they wished to handle
    I/O errors. The options are chosen by setting the `ioerror` option of the VxFS
    mount command to one of the following:'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# Disk-Based Filesystem Case Studies 195


    disable. If this option is selected, VxFS will disable the file system after detecting
    an I/O error. The file system can then be safely unmounted allowing the problem
    causing the error to be corrected. Typically, after the problem has been repaired,
    a fsck repair should be sufficient to make the filesystem structurally sound,
    at which point the file system can be mounted. The disable option should be selected
    in environments where the underlying storage is redundant, such as with RAID-5
    or mirrored (RAID-1) disks.


    nodisable. If selected, when VxFS detects an I/O error it will contain the error
    and continue running. This policy is close to the traditional VxFS error handling
    model in access to certain structures is prevented but the system continues to
    run. With this option, errors detected while reading inode meta-data will result
    in the inode being marked bad.


    wdisable | mwisable. By specifying the wdisable (write disable) option or mwisable
    (metadata-write disable) option, the file system is disabled or degraded as shown
    in Table 9.1. The wdisable or mwisable options should be used in environments
    where read errors are more likely to persist write errors, such as when using
    non-redundant storage.


    If the VX_DATAIOERR or VX_METIOERR flags are written to the superblock, a warning
    message is displayed when running fsck. If the VX_FULLFSCK flag is set, VxFS forces
    a fsck to be performed.


    # VxFS Clustered Filesystem


    # The VxFS Disk Layouts


    The VxFS disk layout has evolved over time to meet the needs of increasing file
    and filesystem sizes. The disk layout geometry has changed considerably over the
    years as new features and new policies have been added to VxFS.


    There have been 5 VxFS filesystem layouts. The first disk layout resembled UFS
    in many aspects while latter layouts are substantially different. The following
    sections describe the version 1 and version 5 disk layouts. The version 5 disk
    layout supports filesystem sizes up to 32TB and file sizes up to 2TB.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# VxFFS Disk Layout Version 1


    | POLICY OPTION | FILE READ | FILE WRITE | META-DATA READ | META-DATA WRITE |

    | :--- | :--- | :--- | :--- | :--- |

    | disable | disable | disable | disable | disable |

    | nodisable | degrade | degrade | degrade | degrade |

    | wdisable | degrade | disable | degrade | disable |

    | mwdisable | degrade | degrade | degrade | disable |


    The first VxFS disk layout, as shown in Figure 9.1, has three main sections. At
    the start of the disk slice containing the filesystem is a fixed amount of unused
    space that is used to OS bootstrap routines.


    The disk layout is divided into three main components:


    **Super block.** *The super block* contains fundamental size information, a summary
    of available resources, and references to other places on disk where additional
    structural information can be found. There are multiple copies of the superblock
    in case of filesystem damage, the *initial superblock* can always be found at
    a well-known location. On UnixWare, it can be found at an offset of 1024 bytes
    from the start of the filesystem, on Solaris, HP-UX, AI, and Linux, it is located
    at offset 8192.


    **Intent log.** *The intent log* contains a record of current system activity.
    When a change to the filesystem is to be made that will alter the structural integrity
    of the filesystem, the pending change is first written to the intent log. In the
    event of a system failure, the operations in the log are either replayed or nullified
    to return the file to a consistent state. To aid understanding, one can think
    of the intent log as a set of pre and images of the modified part of the filesystem,
    allowing the transition from the old to new structure to be performed idempotently.
    Replaying the log multiple times performs the same effect each time. For further
    details of how the intent log is used, see the VxFS *journaling*, in this chapter.


    **Allocation units.** An allocation unit (AU) is roughly equivalent to a UFS *cylinder
    group*. On disk layout version 1, each AU contains a pool of inodes and data blocks
    together with inode and extent bitmaps and extent summaries.


    The intent log immediately follows the superblock and the first allocation unit
    immediately follows the log. Each allocation unit is the same size (which is determined
    at *mkfs* time) with the exception of the last AU, which may contain fewer blocks
    depending on the overall size of the disk slice on which the filesystem resides.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Disk-Based Filesystem Case Studies 197


    ![](img/730b37b12231377a346ba9a27cbd6a68_223_0.png)


    **Figure 9.1** The VxFS 1 disk layout.


    Because the size of the AU is fixed at mkfs time in version 1, this results in
    a limitation on the size of fundamental filesystem structures, not least, the
    number of inodes and the maximum extent size that can be allocated to a file.


    The earlier VxFS mkfs command supported an array of options to align specific
    structures to various disk block boundaries. Because data is not uniformly stored
    on disk, these parameters are not necessarily valid today.


    For details on the inode extended operations map, see the section *Extended Operations*,
    in this chapter.


    # VxFS Disk Layout Version 5


    The first couple of VxFS disk layouts had a number of inherent problems. First,
    the fixed nature of allocation units required AU data to be written on AU boundaries
    across the whole disk. For large filesystems, this is a time-consuming task resulting
    in lengthy mkfs times. Second, if a filesystem contains many small files, it is
    possible it is possible to run out of inodes even when the utilization of disk
    space may be low. Or, if only a small number of large files are required, a large
    amount of space could be wasted by holding unused inodes.


    The other problem concerns the use of filesystems to hold database files. To gain
    optimal performance, databases must be stored as files with a single, large extent.
    If the extents need to be broken up AU boundaries, the database files could run
    into indirect or doubles, impacting performance.


    The newer VxFS disk layouts solved all of these problems by storing all of the
    filesystem structural information in files that could grow on demand.


    The newer VxFS layouts also introduced the concept of filesets, a term coined
    from DCE DFS (Distributed File System) work initiated under the auspices of the'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'Open Software Foundation. In the DCE, the notion of a filesystem changes somewhat;
    a disk size or volume contains an aggregate of filesets. Each fileset looks to
    the user like a filesystem—it has a root node, lost+found directory, and a hierarchy
    of directories and files just like any other filesystem. Each fileset is independently
    mountable.


    Much of this work was originated in VxFS to support DCE DFS has been extended
    in a number of ways as discussed in Chapter 12.


    When creating a VxFS filesystem, two filesets are created: the primary fileset
    which is mounted in response to the mount command and the structural fileset metadata.
    Each fileset has its own inode list, itself stored as a file. The primary fileset
    inode list contains all the user directories, regular files, and so on. The structural
    fileset inode list contains a number of files including:


    Object location table (OLT). The OLT is referenced by the superblock. It is used
    when a filesystem is mounted; it contains references to structures needed to mount
    filesystem.


    Label file. This file holds the superblock and its replicas.

    Fileset header. Each fileset is described by an entry in the fileset header. Each
    entry contains information such as the number of inodes allocated to the fileset,
    the inode number of the files''s inode list file, and the inode number of other
    relevant files. To see how filesets are used to construct persistent snapshots,
    see how Storage Checkpoints are Implemented in Chapter 12.


    Inode list file. This file, per fileset, contains all of the inodes allocated
    to a fileset.


    Inode allocation unit file (IAU). This file, again per fileset, is used to manage
    inodes. It includes the free inode bitmap, summary information, and extended operations
    information.


    Log file. The intent log is stored in fileset.


    Extent AU state file. This file indicates whether AUs have either allocated or
    expanded. This is described later in the chapter.


    Extent summary file. This file summarizes the allocation of extents.

    Free map. This is a bitmap of free and allocated extents.


    Figure 9.2 shows how many of these structures are used when mounting the filesystem.
    The filesystem needs to know how to access these structural files. Thus, various
    structures are used to bootstrap this process. In order to mount a filesystem,
    VxFS needs to locate the root inode for the primary fileset. Following are some
    of the steps taken to achieve this:


    +   1. The superblock is located by seeking 8KB into the device.

    2. From the superblock, the OLT can be located; the OLT contains information about
    where the first few extents of the structural inode list file are located.'
