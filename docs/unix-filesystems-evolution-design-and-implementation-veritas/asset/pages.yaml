    # # Configuring the Kernel


    Before building the kernel, it is necessary to determine the kernel configuration.
    There are many components that are part of the kernel source tree that you will
    not need as part of your kernel. For example, there are numerous device drivers
    for the SCSI adapters. If you don''t have a need for SCSI access, building support
    into the kernel is unnecessary. Thus, you need to determine what hardware configuration
    you have and therefore which kernel components are required.


    There are several different methods of defining the configuration. The Linux HOWTO
    should be consulted in addition to the notes described here. There are multiple
    copies of the HOWTO available across the Wide Web. You can find it at the following
    Web:


    tldp.org/HOWTO/Kernel-HOWTO.html


    One of the easiest to determine which components of the kernel are needed is to
    install the kernel source when the Linux operating system is installed. This will
    result in a configuration file for the installed kernel being available for consultation.
    It is then possible to copy the configuration file from the installed kernel source
    tree to the new kernel source tree as follows:


    ```

    $ cp /usr/src/linux-2.4.18-3/.config /usr/src/linux-2.4.18/.config

    ```'
