  md: '# CHAPTER

    1


    # UNIX Evolution and Standardization


    This chapter introduces UNIX from a historical perspective, showing how the various
    UNIX versions have evolved over the years since the very first implementation
    in 1969 to the present day. The chapter also traces the history of the different
    attempts at standardization that have produced widely adopted standards such as
    POSIX and the Single UNIX Specification.


    The material presented here is not intended to document all of the UNIX variants,
    but rather describes the early UNIX implementations along with those companies
    and bodies that have had a major impact on the direction and evolution of UNIX.


    # A Brief Walk through Time


    There are numerous events in the computer industry that have occurred since UNIX
    started as a small project in Bell Labs in 1969. UNIX history has been largely
    influenced by Bell Labs'' Research Editions of UNIX, AT&T''s System V, Berkeley''s
    Software Distribution (BSD), and Sun Microsystems'' SunOS and Solaris operating
    systems.


    The following list shows the major events that have happened throughout the history
    of UNIX. Later sections describe some of these events in more detail.'
  merge: -1
