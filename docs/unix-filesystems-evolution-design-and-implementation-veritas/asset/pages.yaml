- pgno: 151
  md: '# Development of the SVR4 VFS/inode Architecture 125


    m_flags. Because this is an array of mount structures, this field was used to
    indicate which elements were in use. For filesystems that were mounted, m_flags
    indicates whether the filesystem was also mounted read-only.

    m_fstype. This field specified the filesystem type.


    m_bsize. The logical block size of the filesystem is held here. Each filesystem
    could typically support multiple block sizes as the unit of allocation to a file.


    m_dev. The device on which the filesystem resides.

    m_bufp. A pointer to a buffer containing the superblock.


    m_inode. With the exception of the root filesystem, this field points to an inode
    on which the filesystem is mounted. This is used during pathname traversal.


    m_mountp. This field points to the root inode for this filesystem.

    m_name. The file name.


    Figure 7.1 shows the main structures used in the FSS architecture. There are a
    number of observations worth noting:


    +   - The structures shown are independent of filesystem type. The mount and inode
    structures abstract information about the filesystems and files that they represent
    in a generic manner. When only operations go through the FSS do they become filesystem-dependent.
    This separation allows the FSS to support very different filesystem types, from
    the traditional s5 filesystem to DOS to diskless filesystems as RFS and NFS.


    +   - Although not shown, the mapping between file descriptors, the user area,
    the file table, and the inode cache remains as in earlier versions of UNIX.


    +   - The Virtual Memory (VM) subsystem makes calls through the FSS to obtain
    a block map for executable files. This is to support demand paging. When a process
    runs, the pages of the program text are faulted in the executable file as needed.
    The VMM makes a call to FS_ALLOCMAP() to obtain this mapping. Following this call,
    it can invoke the FS_READMAP() function to read the data from the file when handling
    a page fault.


    +   - There is no clean separation between file-based and filesystem-based operations.
    All functions exported by the filesystem are in the same fstypestructure.


    The FSS was a big step away from the traditional single filesystem-based UNIX
    kernel. With exception of SCO, which retained an SVR3-based kernel for many years
    after the introduction of SVR3, the FSS was short lived, being replaced by the
    better Sun VFS/inode interface introduced in SVR4.'
  merge: -1
