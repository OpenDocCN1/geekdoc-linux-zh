  md: "EXT2_SECRM_FL. With this attribute, whenever a file is truncated data blocks\
    \ are first overwritten with random data. This ensures that once a file is deleted,\
    \ it is not possible for the file data to rescue at a later stage in another file.\n\
    \nEXT2_UNMR_FL. This attribute is used to allow a file to be undeleted. EXT2_SYNC_FL.\
    \ With this attribute, file meta-data, including indirect blocks, is always written\
    \ synchronously to disk following an update. Note, though, this does not apply\
    \ to regular file data.\n\nEXT2_COMPR_FL. The file is compressed. All subsequent\
    \ access must use compression and decompression. EXT2_APPEND_FL. With this attribute,\
    \ a file can only be opened in append mode (O_APPEND) for writing. The file cannot\
    \ be deleted by anyone.\n\nEXT2_IMMUTABLE_FL. If this attribute is set, the file\
    \ can only be read and cannot be deleted by anyone.\n\nAttributes can be set on\
    \ regular files and directories. Attributes that are set on directories are immutable\
    \ by files created within the directory. The following example shows how the immutable\
    \ attribute can be set on a file. The passwd file is first copied into the current\
    \ directory and is shown to be writable by root. The chmod command is called to\
    \ set the attribute, which can be displayed by calling lsattr. The two operations\
    \ show that it is no longer possible to remove the file or extend it:\n\n```\n\
    # cp /etc/passwd\n# ls -l passwd\n--rw-r-- 1 root root 960 Jan 28 17:35 passwd\n\
    # chmod +i passwd\n# lsattr passwd\n--i--------\n# rm passwd\nrm: cannot unlink\
    \ 'passwd': Operation permitted\n# cat >> passwd\nbash: passwd: Permission denied\n\
    ```\n\nNote that at the time of writing, not all of the file attributes are implemented.\n\
    \n# The ext2 Disk Layout\n\nThe layout of structures on disk is shown in Figure\
    \ 9.6. Aside from the boot block, the filesystem is divided into a number of fixed\
    \ block groups. Each block group manages a fixed set of inodes and data blocks\
    \ and contains a copy of the superblock that is shown as follows. Note that the\
    \ first block group starts at an offset of 1024 bytes from the start of the disk\
    \ slice or volume.\n\n```\nstruct ext2_super_block {\n    unsigned long s_inodes_count;\n\
    \    /* Inodes count (in use)*/\n```"
