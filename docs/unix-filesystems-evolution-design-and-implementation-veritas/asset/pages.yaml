  md: '# Development of the SVR4 VFS/Vnode Architecture 127


    “Vnodes: An Architecture for Multiple File Systems in UNIX” [KLEI86].nThe paper
    stated four design goals for the new filesystem architecture:


    +   - The filesystem implementation should be clearly split into a filesystem
    independent and filesystem-dependent layer. The interface between the two should
    be well defined.


    +   - It should support local filesystems such as the 4.2BSD Fast File System
    (FS), non-UNIX files such as MS-DOS, stateless filesystems as NFS, and stateful
    filesystems as RFS.


    +   - It should be able to support the server side of remote filesystems such
    as NFS and RFS.


    +   - Filesystem operations across the interface should be atomic that several
    operations do not need to be encompassed by locks.


    One of the implementation goals was to remove the need for global data, allowing
    the interfaces to be re-entrant. The pretty style of storing filesystem-related
    data in the user area, as u_base and u_count, needed to be removed. The setting
    of u_error on error also needed removing and the new interfaces should return
    an error value.


    The main components of the Sun VFS architecture are shown in Figure 7.2. These
    components will be described throughout the following sections.


    The architecture actually has two sets of interfaces the filesystem-independent
    and filesystem-dependent layers of the kernel. The VFS interface was accessed
    through a set of vnodes while the vnode interface was accessed through a set of
    vnops (also called vnodops). The vsisops operate on a filesystem while vnodes
    operate on individual files.


    Because the architecture encompassed non-UNIX: and disk-based filesystems, the
    in-core that made the memory-based representation of a file over the previous
    15 years was no longer adequate. A new type, the vnode was introduced. This simple
    structure contained all that was needed by the filesystem-independent layer while
    allowing individual files to hold a reference to a private data structure; in
    the case of the disk-based filesystems this may be an inode, for NFS, an inode,
    and so on.


    The fields of vnode structure:


    ```

    v_flag. The VROOT flag indicates that the vnode is the root directory of a filesystem,
    VNOMAP indicates that the file cannot be memory mapped, VNOSAP indicates that
    the file cannot be used as a swap device, VNMOUNT indicates that the file cannot
    be mounted on, and VISSWAP indicates that the file is part of a virtual swap device.

    ```


    ```

    v_count. Similar to the old i_count inode, this field is a reference count corresponding
    to the number of open references to the file.

    ```


    ```

    v_shlockc. This field counts the number of shared locks on the vnode.

    v_exlockc. This field counts the number of exclusive locks on the vnode.

    ```'
