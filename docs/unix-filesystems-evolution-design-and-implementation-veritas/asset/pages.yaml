    \ dev, unsigned long dir,\n               const char * name, int len, unsigned\
    \ long ino)\n```\n\n```\nint dcache_lookup(unsigned short dev, unsigned long dir,\n\
    \               const char * name, int len)\n```\n\nThe cache entries are hashed\
    \ on the dir and dev fields with dir being the inode of the directory in which\
    \ the file resides. After a hash queue is found, the find_name() function is called\
    \ to walk down the list of elements and see if the entry exists by performing\
    \ strcmp between the name as an argument to dcache_lookup() and the name field\
    \ of the dir_cache_entry structure.\n\nThe cache has changed throughout the development\
    \ of Linux. For details of the cache available in the 2.4 kernel series, see the\
    \ section Linux 2.4 Directory Cache in this chapter.\n\n# The Linux Buffer Cache\
    \ and File I/O\n\nLinux employs a buffer cache for reading and writing blocks\
    \ of data to disk. The I/O subsystem in Linux is somewhat restrictive in that\
    \ all I/O must be of the same size. It can be changed, but once set, this size\
    \ must be adhered to by any filesystem performing I/O.\n\nBuffer caches are described\
    \ in the buffer_head structure, which is shown below:\n\n```\nstruct buffer_head\
    \ {\n    char *\n    unsigned long\n    unsigned long\n    dev_t\n    unsigned\
    \ short\n    unsigned char\n    unsigned char\n    unsigned short\n    struct\
    \ wait_queue wait_queue\n    struct buffer_head *head;\n    struct buffer_head\
    \ *next;\n    struct buffer_head *prev_free;\n    struct buffer_head *prev_free;\n\
    \    struct buffer_head *this_page;\n    struct buffer_head *b_regnext;\n};\n\
    /* pointer to data block */\n/* block size */\n/* block_nckr */\n/* block number\
    \ * */\n/* device (0 = free) * */\n/* users using this block */\n/* is block valid\
    \ ? */\n/* 0-clean, 1-dirty * */\n/* 0-ok, 1-locked * */\n/* 0 if buffer invalidated\
