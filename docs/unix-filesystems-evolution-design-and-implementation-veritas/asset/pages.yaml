  md: "# UNIX Filesystems—Evolution, Design, and Implementation\n\nInformation about\
    \ creation of regular files and directories are the subjects of the sections File\
    \ Creation and Link Management and Creating and Removing Directories later in\
    \ the chapter. This section describes the ux_ialloc() function that can be found\
    \ in the filesystem source code on lines 413 to 434.\n\n# Writing an Inode to\
