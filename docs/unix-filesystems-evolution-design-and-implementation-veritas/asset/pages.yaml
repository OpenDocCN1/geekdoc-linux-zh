- pgno: 62
  md: 'calls. The process invokes them with the appropriate arguments, control transfers
    to the kernel where the system call is executed, results are passed back to the
    calling process, and finally, control is passed back to the user process.


    Library functions typically provide a richer set of features. For example, the
    read() library function returns a number of elements of specified size from a
    file. While presenting this formatted data to the user, internally it will call
    the read() system call to actually read data from the file.


    Library functions are implemented on top of system calls. The decision whether
    to use system calls or library functions is largely dependent on the application
    being written. Applications wishing to have much control over how they perform
    I/O to optimize for performance may invoke system calls directly. If an application
    writer wishes to use many of the features that are available at the library level,
    this could save a fair amount of programming effort. System calls can consume
    more time than invoking library functions because they involve transferring control
    of the process from user mode to kernel mode. However, the implementation of different
    library functions may not meets the needs of the particular application. In other
    words, whether to use library functions or systems calls is not an obvious choice
    because it is very much depends on the application being written.


    # Which Header Files to Use?


    The Unix header files are an excellent source of information to understand user-level
    programming and also kernel-level data structures. Most of the header files that
    are needed for user level programming can be found under /usr/include and /usr/include/sys.


    The header files that are needed are shown in the manual page of the library function
    or system call to be used. For example, the stat() system call requires the following
    two header files:


    ```

    #include <sys/types.h>

    #include <sys/stat.h>

    ```


    ```

    int stat(const char *path, struct stat *buf);

    ```


    The stat.h header file defines the stat structure. The types.h header file defines
    the types of all the fields in the stat structure.


    Header files that reside in /usr/include are used purely by applications. Those
    header files that reside in /usr/include/sys are also used by the kernel. Using
    stat() as an example, a reference to the stat structure is passed from the user
    process to the kernel, the kernel fills in the fields of the structure and then
    returns. Thus, in many circumstances, both user processes and the kernel need
    to understand the same structures and data types.'
