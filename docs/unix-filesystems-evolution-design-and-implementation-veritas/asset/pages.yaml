    To some readers, much of what has been described might sound like overkill. However,
    device access has changed substantially since the inception of specsfs. By consolidating
    all device access, only specs needs to be changed. Filesystems still make the
    same specvcp() call that they were making 15 years ago and therefore have not
    had to make any changes as device access has evolved.


    # The BSD Memory-Based Filesystem (MFS)


    The BSD team developed an unusual but interesting approach to memory-based filesystems
    as documented in [MKCU90]. Their goals were to improve upon the various RAM disk-based
    filesystems that had traditionally been used.


    +   A RAM disk is typically a contiguous segment of memory that has been set to
    emulate a disk. A RAM-based device driver is the interface between this area of
    memory and the rest of the kernel. Filesystems access the RAM disk just as would
    any other physical device. The main difference is that the driver employs memory
    to memory copies rather than copying between memory and disk.


    The paper describes the problems inherent with RAM disk-based filesystems. First
    of all, each copy dedicated memory. A large RAM disk locks down memory that could
    be used for other purposes. If many of the files in the RAM disk are not being
    used, this is particularly wasteful of memory. One of the other negative properties
    of RAM disks, the BSD team did not initially attempt to solve, was the triple
    copies of data. When a file is read, it is copied from the file''s location on
    the RAM disk into a buffer cache and then out to the user''s buffer. Although
    this is faster than accessing the data on disk, it is incredibly wasteful of memory.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# BSD MFS Architecture


    Figure 11.3 shows the overall architecture of the BSD MFS filesystem. To create
    and mount the filesystem, the following steps are taken:


    +   1. A call to newfs is made indicating that the filesystem will be memory-based.

    2. The newfs process allocates an area of memory within its own address space
    which to store the filesystem. Area of memory is then initialized with the new
    filesystem structure.

    3. The newfs command call is made into the kernel to mount the filesystem. This
    is handled by the mfs filesystem type that creates a device vnode to reference
    the RAM disk with the ID of the caller.

    4. The UFS entry point is called, which performs standard UFS mount time processing.
    However, instead of calling spec_strategy() to access the device, as it would
    for a disk-based filesystem, it calls mfs_strategy(), which interfaces with the
    memory-based RAM disk.


    One unusual aspect of the design is that the newfs process does not exit. Instead,
    it stays in the kernel acting as an intermediary between UFS and the RAM disk.
    As requests for read and write operations enter the kernel, UFS is invoked as
    with any other disk-based UFS filesystem. The difference appears that above calls
    mfs_strategy() in place of the typical spec_strategy(). This involves waking up
    the newfs process and the I/O buffer in the kernel to perform a copy between the
    appropriate area of the RAM disk. After I/O is completed, the newfs process goes
    back to sleep in the kernel awaiting the next request.

    After the filesystem is unmounted the close routine is invoked. After flushing
    any pending I/O requests, the mfs_mount() call exits causing the newfs process
    to exit, resulting in the RAM disk being discarded.


    # Performance and Observations


    Analysis shows MFS to perform at twice the speed of a filesystem on disk for raw
    read and write operations multiple times (file creates, etc). The benefit over
    the traditional RAM disk approach is that the data within the RAM disk is part
    of the process address space, it is pageable like any other process data. This
    ensures that if data within the RAM disk isn''t being used, it can be paged to
    the swap device.

    There is a disadvantage with this approach; a large RAM disk will consume a large
    amount of swap space and therefore could reduce the overall amount of memory available
    to other processes. However, swap space can be increased, so MFS still offers
    advantages over the traditional RAM disk-based approach.'
  merge: -1
  img_proc: true
