  md: "# 158 UNIX Filesystems—Evolution, Design, Implementation\n\nAT&T and theGFS\
    \ architecture for Digital.\nThe implementation that followed closely matched\
    \ the Sun VFS architecture with the exception of pathname resolution where they\
    \ retained their existing namei() and name cache implementation. Many of the DFS-level\
    \ structures and interfaces were very similar. Before describing the functions,\
    \ it is first necessary to describe the modifications made to namei().\n\nThe\
    \ original namei() implementation used fields in the user area that were set up\
    \ prior to the kernel namei(). The BSD model was modified to pass all arguments\
    \ in a nameidata structure that was the sole argument to the function. The fields\
    \ of the nameidata structure are as follows:\n\n```\nstruct nameidata {\n    cadd_t\
    \          ni_dir;      /* pathname pointer */\n    enum uio_seg    ni_seg;  \
    \     /* location of pathname */\n    short           ni_nameiop;  /* operation\
    \ to perform */\\n    struct vnode    ni_cdir;      /* current working directory\
    \ */\n    struct vnode    ni_root;      /* root directory */\n    struct ucred\
    \             /* caller credentials */\n    cadd_t          ni_pnbuf;     /* pathname\
    \ buffer */\n    char            ni_ptr;      /* cur in pathname */\n    int \
    \            ni_pathen;   /* remaining chars in pathname */\n    short       \
    \    ni_more;      /* more left to translate? */\n    short           ni_dojoint;\
    \   /* count of symlinks found */\n    struct vnode    *nivoy;       /* vnode\
    \ of result */\n    struct vnode    *nvidp;       /* vnode of parent directory\
    \ */\n}\n```\n\nThe BSD namei() function started from a base directory, either\
    \ the root directory for absolute pathnames or the current working directory for\
    \ relative pathnames. This base directory was stored in ni_cdir, and the pathname\
    \ to parse, in ni_dir.\nThe operation to perform was held in the ni_nameiop field\
    \ and could be one of the following:\n\n+   - LOOKUP. Perform only a lookup operation.\n\
    - CREATE. Prepare for file creation.\n- DELETE. Prepare for file deletion.\n-\
    \ WANTPARENT. Also return the parent directory name.\n- NOCACHE. Do not leave\
    \ the name in the cache.\n- FOLLOW. Follow symbolic links.\n- NOFOLLOW. Do not\
    \ follow symbolic links.\n\nThe lookup operation is identical to the Sun VFS LOOKUP()\
    \ operation. The CREATE and DELETE operations are called prior to vnodeop functions\
    \ as VOP_CREATE(), VOP_UNLINK(), and VOP_MKNOD(). Because not all of these operations\
