  md: '# Table 2.1 Permissions Passed to chmod ()


    | PERMISSION | DESCRIPTION |

    |--- |--- |

    | S_IRWXU | Read, write, execute/search by owner |

    | S_IRUSR | Read permission by owner |

    | S_IWUSR | Write permission by owner |

    | S_IXUSR | Execute/search permission by owner |

    | S_IRXG | Read, write, execute/search by group |

    | S_IRGRP | Read permission by group |

    | S_IWGRP | Write permission by group |

    | S_IXGRP | Execute/search permission by group |

    | S_IRWO | Read, write, execute/search by others |

    | S_IROTH | Read permission by others |

    | S_IWOTH | Write permission by others |

    | S_IXOTH | Execute/search permission by others |

    | S_ISUID | Set-user-ID on execution |

    | S_ISGID | Set-group-ID on execution |

    | S_ISVTX | On directories, the restricted deletion flag |


    In addition to setting the user and group IDs of the file, it is also possible
    to set the effective user and effective group IDs that if the file is executed,
    the caller effectively becomes the owner of the file for the duration of execution.
    This is a commonly used feature in UNIX. For example, passwd command is a setuid
    binary. When the command is executed it must gain an effective user ID of root
    in order to change the passwd(F) file. For example:


    ```

    $ ls -1 /etc/passwd

    -r--r---- 1 root      other    157670 Mar 14 16:03 /etc/passwd

    $ ls -1 /usr/bin/passwd

    -rwxr-sr-x 3 root      sys       99640 Oct 6 1998 /usr/bin/passwd*

    ```


    Because the passwd file is not writable by others, changing it requires that the
    passwd command run as root as noted by the s shown above. When run, the process
    runs as root so allowing the passwd file to be changed.


    The setuid() and setgid() system calls enable the user and group IDs to be changed.
    Similarly, the setuid() and setegid() system calls enable the effective user and
    effective group ID to be changed:'
