    page cache. Unlike UNIX systems employ a buffer cache, a fixed-size cache of data
    through which UNIX and Linux can be read or written to. In newer versions of UNIX,
    the buffer cache is mainly used for filesystem meta-data such as inodes and indirect
    blocks. The kernel provides a page-cache where data is cached on a page-by-page
    basis. The cache is not fixed size. When pages of data are not immediately needed,
    they are placed on the free page list but still retain their identity. If the
    same data is required before the page is reused, the file can be accessed without
