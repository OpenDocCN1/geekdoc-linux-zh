- pgno: 204
  md: "inode cache; if the inode is not already cached, a call is made back into the\
    \ filesystem to read the inode through the super_operations function read_inode().\
    \ The final job of iget is to call d_add() to add the new entry to the dache.\n\
    \n# Closing Files in Linux\n\nsys_close() function is the entry point into the\
    \ kernel for handling the close(S) system call. After locating the appropriate\
    \ file structure, the filp_close() function is called; this invokes the flush()\
    \ function in the file_operations vector to write dirty data to disk and calls\
    \ fput() to release the file structure. This involves decrementing f_count. If\
    \ the count does not reach zero work is complete (a previous call to dup(S) was\
    \ made). If this is the last reference, a call to the release() function in the\
    \ file_operations vector is to let the filesystem perform any last-close operations\
    \ it may wish to make.\n\nA call to dput() is then made. If this is the last hold\
    \ on the dentry, iput() is called to release the inode from the cache. The put_inode()\
    \ function from the super_operations vector is then called.\n\n# The 2.4 Linux\
    \ Buffer Cache\n\nThe buffer cache introduced a number of changes from the earlier\
    \ implementations. Although it retained most of the earlier fields, there were\
    \ a number of new fields that were introduced. Following is the structure:\n\n\
    ```\nstruct buffer_head      /* Hash queue list *\n    struct buffer_head *b_next;\n\
    \    unsigned long b_blocknr;    /* block number *\n    unsigned short b_size;\
