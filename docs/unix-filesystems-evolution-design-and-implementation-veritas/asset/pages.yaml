  md: "# Non-SVR4-Based Filesystem Architectures 177\n\nd_revalidate. This function\
    \ is called during pathname resolution to determine whether dentry is still valid.\
    \ If no longer valid, d_put is invoked to remove the entry.\n\nd_hash. This function\
    \ can be supplied by the filesystem if it has an unusual naming scheme. This is\
    \ typically used by filesystems that are not native to UNIX.\n\nd_compare. This\
    \ function is called to compare file names.\n\nd_delete. This function is called\
    \ when d_count reaches zero. This happens when no one is using the dentry but\
    \ the entry is in the cache.\n\nd_release. This function is called prior to a\
    \ dentry being deallocated.\n\nd_iput. This allows filesystems to provide their\
    \ own version of iput().\n\nTo understand the interactions between the dcache\
    \ and the rest of the kernel, the following sections describe some of the file\
    \ operations.\n\n# Opening Files in Linux\n\nThe sys_open() function is the entry\
    \ point in the kernel for handling the open(S) system call. This calls get_unused_fd()\
    \ to allocate a new file descriptor and then calls filp_open(), which in turn\
    \ calls namei() to obtain a dentry for the file. If successful, dentry_open()\
    \ is called to initialize a new structure, perform the appropriate link, and set\
    \ up the file structure.\n\nThe first step is to perform the usual pathname functions.\
    \ link_path_walk() performs most of the work in this regard. This initially involves\
    \ setting a nameidata structure, which contains the dentry of the directory from\
    \ to start the search (either the root directory or the pwd field from the fs_struct\
    \ if the pathname is relative). From this dentry, the inode (d_inode) gives the\
    \ starting point for the search.\n\nThere are two possibilities here in the following\
    \ code fragments:\n\n```\ndentry = cached_lookup(nd->dentry, &this, LOOKUP_CONTINUE);\n\
    if (!dentry) {\n    dentry = real_lookup(nd->dentry, &this, LOOKUP_CONTINUE);\n\
    }\n```\n\nNote that the argument is the pathname component that is currently worked\
    \ on. The cached_lookup() function calls d_lookup() to perform the lookup in the\
    \ dcache. If an entry is found and the filesystem has provided its own d_revalidate\
    \ function, this is where it is called from. The work performed by d_lookup()\
    \ is fairly straightforward that it locates the appropriate hash queue, walks\
    \ this list, and tries to locate the entry.\n\nIf the entry is not in the cache"
