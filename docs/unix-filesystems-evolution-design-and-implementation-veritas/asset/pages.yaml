    There are some I/O library routines that operate on the standard input and output
    streams explicitly. For example, a call to printf() uses stdin by default a call
    to fprintf() requires the caller to specify a file stream. Similarly, a call to
    getchar() operates on stdin while a call to getc() requires the file stream to
    be passed. The declaration of getchar() could simply be:


    ```

    #define getchar(stdin)

    ```


    # Opening and Closing a Stream


    The fopen() and fclose() library routines can be called to open and close a file
    stream:


    ```

    #include <stdio.h>

    ```


    ```

    FILE fopen(const char *filename, const char *mode);

    int fclose(FILE *stream);

    ```


    The mode argument points to a string that starts with one of the following sequences.
    Note that these sequences are part of the ANSI C standard.


    +   - r, rb. Truncate the file for reading.

    - w, wb. Truncate the file to zero length, or if the file does not exist, create
    a new file and open it for writing.

    - a, ab. Append to the file. If the file does not exist, it is first created.

    - r+, rb+. Open the file for update (reading and writing).

    - w+, wb+. Truncate the file to zero length, or if the file does not exist, create
    a new file and open it for writing (reading and writing).

    - a+, a+b. Append to the file. If the file does not exist, it is created and opened
    for update (reading and writing).


    Internally, the standard I/O library will map these flags to the corresponding
    flags to be set by the open() system call. For example, r will map to O_RDONLY,
    r+ will map to O_RDWR and so on. The process followed when opening a stream is
    shown in Figure 4.1.


    The following example shows the effects of some of the library routines on the
    FILE structure:'
