    # Memory Mapped Files


    In addition to reading and writing files using the use of read() and write(),
    UNIX supports the ability to map a file into the process'' address space and write
    to the file through memory accesses. This allows unrelated processes to access
    files with shared or private mappings. Mapped files are also used by the operating
    system for executing executable files.


    The mmap() system allows a process to establish a mapping to an already open file:


    ```

    #include <sys/mman.h>

    ```


    ```

    void mmap(void addr, size_t len, int prot, int flags,

    int fd, off_t off);

    ```


    The file is mapped from an offset of off bytes within the file for len bytes.
    Note that the offset must be on a page boundary. Thus, if the page size of the
    system is 4KB, the offset must be 0, 4096, 8192 and so on. The size of the mapping
    does not need to be a multiple of the page size also the kernel will round up
    to the nearest page size boundary. For example, if off is set to 0 and size is
    set to 2048, on systems with a 4KB page size, the mapping established will'
