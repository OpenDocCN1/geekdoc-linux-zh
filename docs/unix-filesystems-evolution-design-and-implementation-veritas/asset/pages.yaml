    **RAM disk.** A RAM disk, as the name implies, is an area of main memory that
    is used to simulate a disk device. On top of a RAM disk, a filesystem can be made
    and files copied to and from it. RAM disks are used in two areas. First, they
    can be used for temporary filesystem space. Because no I/Os are performed, the
    performance of the system can be improved (of course the extra memory can easily
    degrade performance). The main use of RAM disks is for kernel bootstrap. When
    the kernel loads, it can access a number of critical programs from the RAM disk
    prior to the filesystem being mounted. An example of a critical program is *fsck*,
    which may be needed to repair the root filesystem.


    **raw disk device.** The raw disk device, also known as a character device, is
    one view of the disk storage. Unlike the block device, through which fixed-size
    blocks of data can be read or written, I/O can be performed to or from the raw
    device in any size units.


    **RFS.** At the time Sun was developing V UNIX, UNIX Laboratories was developing
    its own distributed filesystem technology. The Remote File Sharing (RFS) option
    was a cache-coherent, distributed filesystem that offered full UNIX semantics.
    Although technically a better filesystem in some areas, RFS lacked the cross-platform
    capabilities of NFS and was available only to those who purchased a UNIX license,
    unlike the open NFS specification.


    **root directory.** Each user has two associated directories, the root directory
    and the current working directory. Both are used when performing pathname resolution.
    Pathnames that start with `/` as `/etc/passwd` are resolved from the root directory
    while a pathname such as `bin/myls` starts from the current working directory.


    **root filesystem.** The root filesystem is mounted by the kernel during bootstrap.
    Although it is possible for everything to reside in the root filesystem, there
    are typically several filesystems mounted at various points on of the root filesystem.
    By separate filesystems, it is easier to increase the size of the filesystem.
    It is not possible to increase the size of most filesystems.


