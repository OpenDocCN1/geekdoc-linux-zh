- pgno: 279
  md: "# Accessing Files in the Solaris /proc Filesystem\n\nTo demonstrate how to\
    \ access files within /proc, the following simple program gives an idea of how\
    \ the ps program is implemented. Much of the information that is displayed by\
    \ ps can be accessed through the psinfo file. Reading from this file returns data\
    \ underpinned by the psinfo structure. The following program takes a process ID\
    \ as an argument and returns the corresponding psinfo for that process. It displays\
    \ some of the information.\n\n```\n#include <fcntl.h>\n#include <procfs.h>\n\n\
    main(int argc, char *argv[]) {\n    struct psinfo\n    char fname[256];\n    int\
    \ fd;\n\n    sprintf(fname, \"/proc/%s/psinfo\", argv[1]);\n    fd = open(fname,\
    \ O_RDONLY);\n    read(fd, (char *)&ppid, sizeof(struct psinfo));\n    printf(\"\
    %u\\t%d\\t%d\\t%u\\n\", ppid);\n    printf(\"%u\\t%d\\t%d\\t%s\\n\", ps.pr_uid,\
    \ ps.pr_pid, ps.pr_ppid, ps.pr_psargs);\n\n0}\n```\n\nShown below is a simple\
    \ run of the program, which displays information about the sleep process shown\
    \ earlier:\n\n```\n$ ./mps 3707\nUID PID PPID CMD\n824 3707 1 sleep 100000\n```\n\
    \nThe psinfo file for each entry is readable by anyone. Thus, it is possible for\
    \ any user to write a more elaborate version of the preceding program that displays\
    \ entries for all processes.\n\n# Tracing and Debugging with /proc\n\nThe ctrl\
    \ file allows one to control another process through a rich set of functions provided\
    \ by the /proc filesystem. Although all of these functions won't be described\
    \ here, the aim is to highlight the type of features available and how a process\
    \ can be traced or debugged. Access to the ctrl file, which is write only, is\
    \ achieved by writing an operational code to the file with any additional data\
    \ required for the operation in question. The controlling process tracks three\
    \ different types of events,:\n\n+   Signals. A stop based on a signal is handled\
    \ in all cases where the signal is detected, on return from a system call or trap,\
    \ or during process wakeup."
