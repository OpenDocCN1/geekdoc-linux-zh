- pgno: 17
  md: '# Foreword


    It''s over 30 years ago that the first Edition of UNIX was released. Much has
    changed since those early days, as it evolved from a platform for software development,
    to the OS of choice for technical workstations, an application platform for small
    servers, and finally the platform of choice for mainframe-class RISC-based application
    and database servers.


    Turning UNIX into the workhorse for mission-critical enterprise applications was
    in no small part enabled by the evolution of file systems, which play such a central
    role in this Operating System. Features such as extent-based allocation, journaling,
    database performance, SMP support, clustering support, snapshots, replication,
    NFS, AFS, data migration, incremental backup, and more have contributed to this.


    And the evolution is by no means over. There is, of course, the ever present need
    for improved performance and scalability into the realm of Pbytes and billions
    of files. In addition, there are new capabilities in areas such as distributed
    image file systems, flexible storage allocation, archiving, and content-based
    access that are expected to appear during the next few years.


    So if you thought that file system technology had no more excitement to offer,
    you should reconsider your opinion, and let this book win your appetite.


    The historical perspective offered by the author not only gives a compelling insight
    into the evolution of UNIX and the manner which this has been influenced by many
    parties—companies, academic institutions, and individuals—it also'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'gives the reader an understanding of why things work the way they do, rather
    than just how they work.


    By also covering a wide range of UNIX variants and file system types, and discussing
    implementation issues in-depth, this book will appeal to a broad audience. I highly
    recommend it to anyone with an interest in UNIX and its history, students of Operating
    Systems and File Systems, UNIX system administrators, and experienced engineers
    who want to move into file system development or just broaden their knowledge.
    Expect this to become a reference work for UNIX developers and system administrators.


    Fred van den Bosch


    Executive Vice President and Chief Technology Officer

    VERITAS Software Corporation'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Introduction


    Welcome to UNIX Filesystems—Evolution, Design, and Implementation, the first book
    that is solely dedicated to UNIX internals from a filesystem perspective.


    Much has been written about the different UNIX and UNIX-like kernels since Maurice
    Bach''s book The Design of the UNIX Operating System [BACH86] first appeared in
    1986. At that time, he documented the internals of System V Release 2 (SVR2).
    However, much had already happened in the UNIX world when SVR2 appeared. The earliest
    documented kernel was 6th Edition as described in John Lions'' work Lions'' Commentary
    on UNIX 6th Edition—with Source Code [LION96], which was an underground work until
    its publication in 1996. In addition to these two books, there have also been
    a number of others that have described the different UNIX versions.


    When writing about operating internals, there are many different topics to cover
    from process management to virtual memory management, from device drivers to networking,
    and hardware management to filesystems. One could fill a book on each of these
    areas, and in the case of networking and device drivers, specialized books have
    in fact appeared over the last decade.


    Filesystems are a subject of great interest to many although they have typically
    been poorly documented. This is where this book comes into play.


    This book covers the history of UNIX describing how filesystems were implemented
    in the early research editions of UNIX up to today''s highly scalable enterprise
    class UNIX systems. All of the major changes in the history of UNIX'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# UNIX Filesystems—Evolution, Design, and Implementation


    that pertain to filesystems are covered along with a view of some of the more
    well known filesystems are implemented.


    Not forgetting the user interface to filesystems, the book also presents the file
    and filesystem-level system class and library-level APIs that programmers expect
    to see. By providing this context it is easier to understand the services that
    filesystems are expected to provide and therefore why they are implemented the
    way they are.


    Wherever this book provides practical examples, either through programmatic means
    or through analysis. To provide a more practical edge to the material presented,
    the book provides a complete implementation of a filesystem on Linux together
    with instructions on how to build the kernel and filesystem, how to install it,
    and analyze using appropriate kernel-level debuggers. Examples are then given
    for readers to experiment further.


    # Who Should Read This Book?


    Rather than for the usual group of suspects—kernel engineers and operating system
    hobbyists—this book is written in such a way that anyone who has an interest in
    filesystem technology, regardless of whether they understand operating system
    internals or not, can read the book to gain an understanding of file and filesystem
    principles, operating system internals, and filesystem implementations.


    This book should appeal to anyone interested in UNIX, its history, and the standards
    that UNIX adheres to. Anyone in the storage industry should also benefit from
    the material presented here.


    Because the book has a practical edge, the material should be applicable for undergraduate
    degree-level computer science courses. As well as a number of examples throughout
    the text, which are applicable to nearly all versions of UNIX, the chapter covering
    Linux filesystems provides a number of areas where students can experiment.


    # How This Book Is Organized


    Although highly technical in nature, as with all books describing operating kernels,
    the goal of this book has been to follow an approach that enables readers not
    proficient in operating system internals to read the book.


    Early chapters describe UNIX filesystems from a user perspective, including a
    historical perspective, application programming interfaces (APIs), and filesystem
    basics. This provides a base on which to understand how the UNIX kernel provides
    filesystem services.


    Modern UNIX kernels are considerably more complex than their predecessors. Before
    diving into the newer kernels, an overview of 5th/6 Edition UNIX is described
    in order to introduce kernel concepts and how they relate to'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Introduction xxi


    filesystems. The major changes in the kernel, most notably the introduction of
    vnodes in Sun''s SunOS operating system, are then described together with the
    differences in filesystem architectures between the SVR4 variants and non-SVR4
    variants.


    Later chapters start to dig into filesystem internals and the features they provide.
    This concludes with an implementation of the original 5 UNIX filesystem on Linux
    to demonstrate how a simple filesystem can be actually implemented. This working
    filesystem can be used to aid students and other interested parties by allowing
    them to play with a real filesystem, understand the flow through the kernel, and
    add additional features.


    The following sections describe the book''s chapters in more detail.


    # Chapter 1: UNIX Evolution and Standardization


    Because the book covers many UNIX and UNIX-like operating systems, this chapter
    provides a base by describing UNIX from a historical perspective. Starting with
    the research editions that originated in Bell Labs in the late 1960s, the chapter
    follows the evolution of UNIX from BSD, System V, and the many UNIX and UNIX-like
    variants such as Linux.


    The latter part of the chapter describes the various bodies and the standards
    that they have produced which govern the filesystem level interfaces provided
    by UNIX.


    # Chapter 2: File-Based Concepts


    This chapter presents concepts and commands that relate to files. The different
    file types are described along with the commands that manipulate them. The chapter
    also describes the UNIX security model.


    # Chapter 3: User File I/O


    Moving down one level, this chapter describes file access from a programmatic
    aspect covering the difference between library-level functions and system calls.
    Building on the six basic system calls to allocate files, seek, read, and write
    file data, the chapter goes on to describe all of the main file functions available
    in UNIX. This includes everything from file locking to asynchronous I/O to memory
    mapped files.


    Examples are given where applicable including a simple implementation of UNIX
    commands as cat, dd, and cp.


    # Chapter 4: The Standard I/O Library


    One part of the UNIX API often used but rarely described in detail is the standard
    I/O library. This chapter, using the Linux standard I/O library as an example,
    describes how the library is implemented on top of the standard file-based system
    calls.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'The main structures and the flow through the standard I/O library functions
    are described, including the various types of buffering that are employed.


    # Chapter 5: Filesystem-Based Concepts


    This chapter angles the user-level by describing the main features exported by
    UNIX for creation and management of filesystems.


    The UNIX hierarchy is described followed by a description of disk partitioning
    to produce raw slices or volumes on which filesystems can be created. The main
    commands used for creating, mounting and managing filesystems is then covered
    along with the various functions that are used in mounting filesystems.


    To show how the filesystem commands are implemented, the chapter also provides
    a simple implementation of the commands mount, df, and fstat.


    # Chapter 6: UNIX Kernel Concepts


    Today''s UNIX kernels are extremely complicated. Even operating systems as Linux
    have become so large as to study difficult for the novice.


    By starting with 5th Edition, which had around 9000 lines of code in the whole
    kernel, this chapter presents the fundamentals of the kernel from a filesystem
    perspective. Main concepts such as the inode cache, buffer cache, and process-related
    structures are followed by a description of how simple operations as read() and
    write() flow through the kernel.


    The concepts introduced in these early kernels are still relevant today as they
    were when first introduced. Studying these older kernels therefore presents the
    ideal way to learn about the UNIX kernel.


    # Chapter 7: Development of the SVR4 VFS/Vnode Architecture


    Arguably the most significant filesystem-related development in UNIX was the introduction
    of the VFS/vnode architecture. Developed by Microsystems in the mid 1980s, the
    architecture allowed support for multiple, different filesystem types to reside
    in the kernel simultaneously.


    This chapter follows the evolution of this architecture from its first introduction
    in SunOS to SVR4 and beyond.


    # Chapter 8: SVR4-Based Filesystem Architectures


    Although the VFS/vnode architecture was mirrored in the development of many other
    of the UNIX variants, subtle differences crept in, and some versions of UNIX and
    UNIX-like operating systems adopted different approaches to solve the problems
    of supporting different filesystem types.


    This chapter explores some of the VFS/vnode variants along non-VFS architectures
    ranging from microkernel implementations to Linux.'
  merge: -1
  img_proc: true
- pgno: 23
  md: "# Chapter 9: Disk-Based Filesystem Case Studies\n\nBy choosing three different\
    \ filesystem implementations, the VERITAS Filesystem (VxFS), the UFS filesystem,\
    \ and the Linux-based ext2/3 filesystems, this chapter explores in more detail\
    \ type of features individual filesystems provide along with an insight into their\
    \ implementation.\n\n# Chapter 10: Mapping Filesystems to Multiprocessor Systems\n\
    \nThe UNIX implementations described in earlier chapters changed considerably\
    \ with the introduction of Symmetric Multiprocessing (SMP). Because multiple threads\
    \ of execution could be running within the kernel at the time, the need to protect\
    \ data structures with finer and finer grain locks becomes apparent.\n chapter\
    \ follows the evolution of UNIX from a monolithic design to today's highly scalable\
    \ SMP environments and describes the types of locking changes that were added\
    \ to filesystems to support these new architectures.\n\n# Chapter 11: Pseudo Filesystems\n\
    \nIn addition to the traditional disk-based filesystems, there are a number of\
    \ pseudo filesystems that, to the user, appear similar to other filesystems, but\
    \ have no associated physical storage. Filesystems such as /proc and device filesystems\
    \ as such have become common across many versions of UNIX.\n This chapter describes\
    \ some of the well-known pseudo filesystems. For the /proc filesystem, the chapter\
    \ shows how debuggers and trace units can be written together with an example\
    \ of how the UNIX ps command can be written.\n\n# Chapter 12: Filesystem Backup\n\
    \nAnother area that is typically not documented is the area of filesystem backup.\
    \ This chapter describes some of the backup techniques that can be used to back\
    \ up a set of files or whole filesystems, and the archiving tools such as tar,\
    \ and the dump/restore utilities. The main part of the chapter describes frozen\
    \ image techniques that show persistent and non persistent snapshot technologies\
    \ that can be used to obtain stable backups.\n\n# Chapter 13: Clustered and Distributed\
    \ Filesystems\n\nThis chapter describes both distributed filesystems and clustered\
    \ filesystems. For distributed systems, the chapter covers the development of\
    \ NFS through its early adoption to the features that are being implemented as\
    \ part of NFS v4. Other distributed filesystems as AFS and DFS are also described.\n\
    \nThe components required to build a clustered filesystem using Storage Area Networks\
    \ (SANs) is then followed by a description of the various components of the VERITAS\
    \ Clustered Filesystem."
  merge: -1
