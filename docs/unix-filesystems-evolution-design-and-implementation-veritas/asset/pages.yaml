    spin lock. When a process holds a resource such as a buffer cache, another process
    that wants the same buffer will typically sleep. Because the buffer may be in
    use for I/O, it could be some time before the buffer is freed. Some operations
    that require the use of locks are for very short durations, for example, adding
    an entry to a linked list. This operation takes only a few instructions, it does
    not make sense to make another process that wishes to access the list to sleep.
    In this case, the list is protected by a spin lock. The waiting process literally
    spins around a loop until the lock is released.'
