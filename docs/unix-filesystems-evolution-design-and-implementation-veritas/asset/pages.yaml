    # The Mach Microkernel


    UNIX processes are implemented in a Mach-based UNIX system as a single threaded
    task. There are three main components that come into play when emulating UNIX
    as shown in Figure 8.9.


    Each UNIX process includes an emulation library linked to in the address space
    of the process. When the process wishes to execute a system call it issues the
    appropriate trap instruction, which results in the process entering the microkernel.
    This is managed by a trap emulator, which redirects the request to the emulation
    library within the process. Most of emulation is handled by the UNIX server task
    although the emulation library can handle some simple system calls using information
    that is shared between each UNIX process and the emulation library to handle system
    calls such as getpid(S), getuid(S), and getrlim(S).


    The UNIX server has a number of threads that can respond to requests from a number
    of different UNIX processes. The UNIX server task where most of the UNIX kernel
    code is based. The inode pager thread works in a similar manner to the Chorus
    mapper threads by responding to page-in and page-out requests from the microkernel.
    This is a particularly important concept in Mach emulation because all file I/O
    is performed through mappings that reside within the UNIX process.


    # Handling Read Operations in Mach


    Each file is opened by a UNIX process results in a 64KB mapping of the file. This
    mapping window can be moved throughout the file in response to a request from
    within the emulation library. If there are multiple readers or writers, the various
    mappings are protected through the use of a token-based scheme.


    When a read(S) system call is executed, the microkernel redirects the call back
    into the emulation library. If the area of the file requested is already covered
    there is need to copy the data to the user buffer and return. Most of the difficulty
    in the Mach scheme results from token management and the fact that the emulation
    library is not protected from the user process in any way; the process can overwrite
    any part of the data area of the library it wishes. To acquire the token, the
    emulation library must communicate with the UNIX server task in turn it will communicate
    with other UNIX tasks.


    In addition to token management, the UNIX server task implements appropriate UNIX
    filesystem access, including the handling of page faults that occur on the mapping.
