- pgno: 104
  md: 'Fully (block) buffered. As characters are written to the stream, they are buffered
    up to the point where the buffer is full. At this stage, the data is written to
    the file referenced by the stream. Similarly, reads will result in a whole buffer
    of data being read if possible.


    Line buffered. As characters are written to a stream, they are buffered up until
    the point where a newline character is written. At this point the line of data
    including the newline character is written to the file referenced by the stream.
    Similarly for reading, characters are read up to the point where a newline character
    is found.


    Unbuffered. When an output stream is unbuffered, any data that is written to the
    stream is immediately written to the file to which the stream is associated.


    The ANSI C standard dictates that input and output be fully buffered while standard
    error should be unbuffered. Typically, standard input and output are set so that
    they are line buffered for terminal devices and fully buffered.


    The setbuf() and setbuf() functions can be used to change the buffering characteristics
    of a stream as:


    ```

    #include <stdio.h>


    void setbuf(FILE *stream, char *buf, int type, size_t size);

    int setbuf(FILE *stream, char *buf);

    ```


    The buffer function must be called after the stream is opened but before any I/O
    to the stream is initiated. The buffer specified by the buf argument is used in
    place of the buffer the stdio library would use. This allows the caller to optimize
    the number of calls to read() and write() based on the needs of the application.


    The setbuf() function can be called at any stage to alter the buffering characteristics
    of the stream. The type argument can be one of _IONBF (unbuffered), _IOLBF (line
    buffered), or _IOFBF (fully buffered). The buffer specified by the buf argument
    must be at least size bytes. Prior to the next I/O, this buffer will replace the
    buffer currently in the stream if it has already been allocated. If buf is NULL,
    the buffering mode will be changed.


    Whether full or line buffering is used, the fflush() function can be used to force
    all of the buffered data to the file referenced by the stream as shown:


    ```

    #include <stdio.h>


    int fflush(FILE *stream);

    ```


    Note that all output streams can be flushed by setting stream to NULL. Further
    point worth mentioning concerns termination of a process. Any streams that are
    currently open are flushed and closed before the process exits.'
  merge: -1
  img_proc: true
