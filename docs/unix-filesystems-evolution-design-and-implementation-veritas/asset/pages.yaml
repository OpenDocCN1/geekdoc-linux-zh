- pgno: 162
  md: '# 136 UNIX Filesystems—Evolution, Design, and Implementation


    remained and the following fields were added:


    v_stream. If the file opened references a STREAMS device, vnode field points to
    the STREAM head.


    v_filocks. This field references any file and record locks that are held on the
    file.


    v_pages. I/O changed substantially in SVR4 with all data being read and written
    pages in the page cache as opposed to the buffer cache, which was now only used
    for meta-data (inodes, directories, etc.). All pages in-core that are part of
    a file are linked to the vnode and referenced through this field.


    The vnode vector underwent more change. The vop_bmap(), the vop_read(), vop_brels(),
    and vop_strategy() functions were removed as changes to the read and write paths.
    The vop_rdwr() and vop_select() functions were also removed. There were number
    of new functions added as follows:


    vop_read. The vop_rdwr was split into separate read and write vnodeops. This function
    is called in response to a read() system call.


    vop_write. The vop_rdwr function was split into separate read and write vnodeops.
    This function is called in response to a write() system call.


    vop_setfl. This function is called in response to fcntl() system call where the
    F_SETFL (set status flags) flag is specified. This allows the filesystem to validate
    any flags passed.


    vop_fid. This architecture was previously a VFS-level function in the Sun VFS/vnode
    architecture. It is used to generate a unique file handle from which NFS can later
    reference the file.


    vop_rlock. Locking was moved under the vnode interface, and systems implemented
    in a manner that was appropriate to their own internal implementation. Initially
    the file was locked for both read and write access. Later SVR4 implementations
    changed the interface to pass one of two flags, namely LOCK_SHARED or LOCK_EXCL.
    This allowed for a single writer but multiple readers.


    vop_rwunlock. All vop_rwunlock invocations should be followed by a subsequent
    vop_rwunlock call.


    vop_seek. When specifying an offset to seek(), this function is called to determine
    whether the filesystem deems the offset to be appropriate. With sparse files,
    seeking to the end of file and writing is a valid UNIX operation, but not all
    filesystems support sparse files. This vnode operation allows the filesystem to
    reject each lseek() calls.


    vop_cmp. This function compares two specified vnodes. This is used in the area
    of pathname resolution.


    vop_flock. This function is called to implement file and record locking.'
