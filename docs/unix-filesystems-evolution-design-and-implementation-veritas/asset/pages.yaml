- pgno: 361
  md: '# Developing a Filesystem for the Linux Kernel 335


    With the exception of the change, it can be used in the same manner in which printf()
    can be called. One method employed when writing ufs is to place a printk() at
    the start of each entry point to the filesystem. When typing various commands
    at the user prompt, it is then easy to see which functions in the filesystem are
    called.


    Because Linux supports loadable modules, the time to recompile and reload a module
    is in order of seconds, this is the easiest way to watch how the filesystem works
    in practice and be the method initially followed by anyone new to kernel development
    who want to understand how the kernel works. To get a better idea of how the filesystem-related
    kernel functions work, printk() calls be placed throughout the kernel, and various
    structures can be displayed.


    # Using the SGI kdb Debugger


    The kdb debugger is a built-in debugger. It must be compiled with the kernel in
    order for it to be used. It can be used to set breakpoints, display memory, disassemble
    instructions, and display machine configuration as the register set. The debugger
    operates over the kernel symbol table, and therefore functions and structures
    can be accessed by name.


    The source code for kdb, which was developed by engineers at SGI (Silicon Graphics
    Inc), can be downloaded from the SGI Web site. The home page for kdb is as follows:


    ```

    http://oss.sgi.com/projects/kdb/

    ```


    Note that when following the link to the download section, the directories displayed
    are for versions of kdb and not versions of the Linux kernel. The kernel used
    to develop ufs (2.4.18), kdb version 2.1 be used (the latter versions did not
    support this kernel at the time of writing).


    The README in the directory contains instructions on how files to download. Note
    that there may be several versions for the same kernel. The README file specifies
    how to interpret the versions of the patches.


    There are two patches to download. The first is common across all machine architectures
    and the second is to the machine architecture you''re running. After downloading
    the patches, they can be applied as follows:


    ```

    # /usr/src/linux-2.4.18

    # patch -pl < ../kdb-v2.1.2.4.18-common-3

    patching file kernel/sysctl.c

    patching file kernel/ksyms.c

    patching file kernel/Makefile

    patching file init/main.c

    ...

    npatching file Documentation/kdb/kdb_env.man

    patching file Documentation/kdb/kdb.mm

    ```'
