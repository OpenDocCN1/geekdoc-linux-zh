- pgno: 387
  md: "# Developing a Filesystem for the Linux Kernel\n\nOnce read into memory, a\
    \ copy is made of the inode to the location within the in-core inode defined by\
    \ the i_private field. This address is at the end of the in-core inode where the\
    \ union of filesystem dependent information is stored. The i_private field is\
    \ defined in ux_fs.hs as follows:\n\n```\n#define i_private u_generic_ip\n```\n\
    \nBefore freeing, the in-core inode fields are updated to reflect the on-disk\
    \ inode. Such information is used by the kernel for operations such as handling\
    \ the stat() system call.\nOne additional task to perform in ux_read_inode() is\
    \ to initialize the i_op, i_flop, and mapping fields of the inode structure with\
    \ the operations applicable to the file type. The set of operations that are applicable\
    \ to a directory are different from the set of operations that are applicable\
    \ to regular files. The initialization of such nodes can be found on lines 1088\
    \ to 1097 and duplicated here:\n\n```\nif (di->i_mode & S_IFDIR) {\n    inode->i_mode\
    \ |= S_IFDIR;\n    inode->i_op = &ux_dir_inops;\n    inode->i_flop = &ux_file_inops;\n\
    } else if (di->i_mode & S_IFREG) {\n    inode->i_mode |= S_IFREG;\n    inode->i_op\
    \ = &ux_file_inops;\n    inode->i_flop = &ux_file_inops;\n    inode->i_mapping->a_ops\
    \ = &ux_aops;\n}\n```\n\nOperations as reading directory entries are obviously\
    \ not applicable to regular files while various I/O operations are not applicable\
    \ to directories.\n\n# Allocating a New Inode\n\nThere is no operation exported\
    \ to the kernel to allocate a new inode. However, in response to requests to create\
    \ a directory, regular file, and a symbolic link, a new inode needs to be allocated.\
    \ Since uxfs does not support symbolic links, new inodes are allocated when creating\
    \ regular files or directories. In both cases, several tasks to perform:\n\n+\
    \   - Call new_inode() to allocate a new in-core inode.\n- Call ux_ialloc() to\
    \ allocate a new uxfs disk inode.\n- Initialize both the in-core and the disk\
    \ inode.\n- Mark the superblock dirty—the free inode array and summary have been\
    \ modified.\n- Mark the inode dirty so that the new contents will be flushed to\
    \ disk."
  merge: -1
  img_proc: true
