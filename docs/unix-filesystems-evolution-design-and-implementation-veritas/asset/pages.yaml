  md: '# Filesystem-Based Concepts 101


    Running fsck is typically a non-interactive task performed during system initialization.
    Interacting with fsck is not something that system administrators will typically
    need to do. Recording the output of fsck is always a good idea in case fsck fails
    to clean the filesystem and support is needed by filesystem vendors and/or developers.


    # The Filesystem Debugger


    When things go wrong with filesystems, it is necessary to debug them in the way
    that it is necessary to debug other applications. Most UNIX filesystems have shipped
    with the filesystem debugger, fsdb, which can be used for purpose.

    It is good to know that fsdb is one of the least commonly used of the UNIX commands.
    In order to use fsdb effectively, knowledge of the filesystem structure on disk
    is vital, as well as knowledge of how to use the filesystem specific version of
    fsdb. Note that one version of fsdb does not necessarily bear resemblance to.

    In general, fsdb should be left well alone. Because it is possible to damage the
    filesystem before repair, its use should be for filesystem developers and support
    engineers only.


    # Per Filesystem Statistics


    In the same way that the stat() system call can be called to obtain per-file related
    information, the statvfs() system call can be invoked to obtain per-filesystem
    information. Note that this information will differ for each mounted filesystem
    so that the information obtained for, say, one VxFS filesystem, will not be the
    same as for other VxFS systems.


    ```

    #include <sys/types.h>

    #include <sys/statvfs.h>


    int statvfs(const char *path, struct statvfs *buf);

    int statvfs(int fields, struct statvfs *buf);

    ```


    Both functions operate on the statvfs struct, which contains a number of filesystem-specific
    fields including the following:


    | u_long | f_size; | * file block size * |

    | u_long | f_frsize; | * fundamental filesystem block (size if supported) * |

    | fsblcnt_t | f_blocks; | * total # of blocks on file system in units of f_frsize
    * |

    | fsblcnt_t | f_free; | * total # of free blocks * |

    | fsblcnt_t | f_bavail | * # of free blocks avail to non-super-user * |

    | fsblcnt_t | f_files; | * total # of file nodes (inodes) * |'
