- pgno: 126
  md: 'the script is responsible for ensuring that all filesystems are checked for
    consistency and mounted as appropriate. The mountall script is responsible for
    actually mounting all of the filesystems.

    The layout of files and scripts used on non-System V variants differs, but the
    concepts are the same.


    # Repairing Damaged Filesystems


    A filesystem can typically be in one of two states, either clean or dirty. To
    mount a filesystem it must be clean, which means it is structurally intact. When
    filesystems are mounted read/write, they are marked dirty to indicate that there
    is activity on the filesystem. Operations may be pending on the filesystem during
    a system crash, which could leave the filesystem without structural damage. In
    this case it can be dangerous to mount the filesystem without knowing the extent
    of the damage. To return the filesystem to a clean state, a filesystem-specific
    check program called fsck must used to repair any damage that may exist. For example,
    consider the following to mount after a system crash:


    ```

    # -F vxfs /dev/vsk/voll /mnt1

    UX:vxfs mount: ERROR: /dev/vsk/voll is corrupted. needs checking

    ```


    The filesystem is marked dirty and therefore the mount fails. Before it is mounted
    again, the VxFS fsck program must be run as:


    ```

    # fsck -F vxfs /dev/vsk/dsk

    log replay in progress

    replay completing super-block as CLEAN

    ```


    VxFS is a transaction-based filesystem in which changes made to the filesystem
    are first written to the filesystem log. By replaying the transactions in the
    log, the filesystem returns to its clean state.

    Most UNIX filesystems are not transaction-based, and therefore the whole filesystem
    must be checked for consistency. In the example, a full fsck is performed on a
    UFS filesystem to show the type of checks that will be performed. UFS on most
    modern systems is not transaction-based although Sun has added journaling support
    to its version of UFS.


    ```

    # fsck - ufs -y /dev/vsk/dsk/myvol

    ** /dev/vsk/dsk/myvol

    ** Last Mounted on /mnt1

    ** Phase 1 Check Blocks and Sizes

    ** Phase 2 Check Pathnames

    ** Phase 3 Check Connectivity

    ** Phase 4 Check Reference Counts

    ** Phase 5 Check Cyl groups

    61 files, 13 used, 468449 free (41 frags, 58551 blocks, 0

    .0% fragmentation

    ```'
  merge: -1
  img_proc: true
