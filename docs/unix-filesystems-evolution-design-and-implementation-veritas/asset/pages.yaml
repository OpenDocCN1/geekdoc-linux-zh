  md: '+   8. Study the NFS Linux kernel code and other filesystems to see how NFS
    file handles are constructed. To avoid invalid file handles due to files being
    removed and the inode being reused, filesystems typically employ use of a generation
    count. Implement this feature in uufs.


    # # Summary


    As the example filesystem here shows, even with the minimal set of features and
    limited operations, and although the source code base is small, there are still
    a lot of kernel concepts to grasp in order to understand how the filesystem works.
    Understanding which operations need to be supported and the order in which they
    occur is a difficult task. For those wishing to write a new filesystem for Linux,
    the initial learning curve can be overcome by taking a simple filesystem and instrumenting
    it with print() to see which functions are invoked in response to certain user-level
    operations and in what order.


    The uufs filesystem, although very limited in its abilities, is a simple filesystem
    from which to learn. Hopefully, the examples shown here provide enough information
    on which to experiment.


