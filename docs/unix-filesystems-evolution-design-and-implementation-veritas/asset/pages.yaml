    # Mounting Filesystems


    The UNIX Filesystem, earlier in this chapter, showed how filesystems were laid
    out on disk with the superblock occupying block 1 of the disk slice. Mounted filesystems
    were held in a linked list of mount structures, one per filesystem with a maximum
    of NMOUNT mounted filesystems. each mount structure has three elements, namely:


    +   m_dev. This device holds the device ID of the disk slice and can be used in
    a simple check to prevent a second mount of the same filesystem.


    +   m_buf. This field points to the superblock (struct filesys), which is read
    from disk during a mount operation.


    +   m_inodp. This field references the inode for the directory onto which this
    filesystem is mounted. This is further explained in the section Pathname Resolution
    in this chapter.


    The root filesystem is mounted early during kernel initialization. This involved
    a very simple code sequence that relied on the root device being hardcoded into
    the kernel. The block containing the superblock of the root filesystem is read
    into memory by calling bread(); then the first mount structure is initialized
    to point to the buffer.


    Any subsequent mounts needed to come in the mount() system call. The first task
    to perform would be to walk through the list of mount structures checking m_dev
    against the device passed to mount(). If the filesystem is mounted already, EBUSY
    is returned; otherwise another mount structure is allocated for the new mounted
    filesystem.


    # System Call Handling


    Arguments passed to system calls are placed on the user stack prior to invoking
    a hardware instruction that then transfers the calling process from user mode
    to kernel mode. Once inside the kernel, any call handler needs to be able to access
    the arguments, because the process may sleep awaiting some resource, resulting
    in a context switch, the kernel needs to copy these arguments into the kernel
    address space.'
