- pgno: 275
  md: '# CHAPTER 11


    # # Pseudo Filesystems


    When people think of filesystems, they tend to think of a file hierarchy of files
    and directories that are all stored on disk somewhere. However, there are a number
    of filesystem types that provide a host of useful information but which have no
    physical backing store (disk storage). The most well known pseudo filesystem is
    /proc, which is used by the ps command as well as various debuggers.

    This chapter describes some of the more well known pseudo filesystem types and
    provides a basic implementation of the ps command using the Solaris /proc filesystem.


    # ## /proc Filesystem


    The /proc filesystem was first introduced in 8th Edition UNIX and was described
    in Tom Killian''s 1984 Usenix paper “Processes as Files” [KILL84].

    The /proc filesystem was to replace the ptrace() system call, with the advantage
    that the full process address space was visible and could be manipulated with
    read() and write() system calls. This contrasts with the interfaces offered by
    ptrace(), the system call traditionally used by debuggers, that only provides
    a word-at-a-time interface.'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'Roger Faulkner and Rome Gomez ported the research version of /proc SVR4 and
    presented their work in another USENIX paper: "The Process File System and Process
    Model in Unix System V" [FAUL91]. At that time, Faulkner was with Sun Microsystems
    and Gomez with AT&T Bell Laboratories. In the paper, work was undertaken to restructure
    /proc from a flat file system into a directory hierarchy describing a process.
    That work was undertaken at both Sun and USL and will be described later.


    In the early /proc implementation, name is derived from the directory on which
    it is mounted, there is an entry for each process in the system. The name of the
    file displayed corresponds to the process ID, while the size of the file represents
    the process address space. The file permissions correspond to the user who owns
    the process.


    Figure 11.1 shows at a high level how the /proc filesystem is implemented. Standard
    file-related calls such as open(), read(), and write() are handled by the filesystem-independent
    layer in the same manner as for other filesystem types. Much of the information
    about a process is held in the process table (traditionally in the array proc[]).
    To open a process file, the /proc must scan the process table for an entry whose
    p_pid field matches the pathname component.


    One of the most widely used commands that access /proc is ps. Its role is to open
    each file in the /proc directory and then access the process status through an
    ioctl() system call. This was originally represented by the pstruct structure,
    which could be obtained by opening the file and issuing the PIOCSTATUS ioctl.
    With the SVR4 implementation of /proc, there were over 40 different ioctl commands
    that could be issued, many of which dealt with debugging.


    Note that the /proc filesystem does not have to be mounted on the /proc directory.
    It can be mounted in multiple times, which allows it to be used in chroot() environments.


    # The Solaris /proc Implementation


    With the introduction of user-level threads, the execution of the /proc changed
    substantially from the single threaded process-based model of previous versions
    of UNIX. Each entry in /proc is a directory which all of the information about
    a specific process is collected.


    As an example, consider the following process, which is run in the background.
    The process ID that is returned, the contents of the /proc/3707 are displayed:


    ```

    $ sleep 10000&

    [1] 3707

    $ cd /proc/3707

    $ ls -l

    ```


    | | | | | |

    |---|---|---|---|---|

    | -rw------ | 1 spate | fcf | 163208 May 28 21:24:55 as |

    | -r-------- | 1 spate | fcf | 152 May 28 21:24:55 aux|'
  merge: -1
  img_proc: true
