    # Truncating and Removing Files


    Removing files is something that people take for granted in the same vein as pulling
    up an editor and creating a new file. However, the internal operation of truncating
    and removing files can be a particularly complicated operation as later chapters
    will show.


    There are two calls that can be invoked to truncate a file:


    ```

    #include <unistd.h>


    int truncate(const char *path, off_t length);

    int fruncate(int fd, off_t length);

    ```


    The confusing aspect of truncation is that the calls allow possible to truncate
    upwards, increasing the size of the file! If the value of length is less than
    the current size of the file, the file size will be changed and storage above
    the new size can be freed. However, if the value of length is greater than the
    current size, storage will be allocated to the file, and the file size will be
    modified to reflect the new storage.


    To remove a file, the unlink() system call can be invoked:'
