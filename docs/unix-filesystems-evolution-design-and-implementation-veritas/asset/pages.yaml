    \ and returns a vnode (if the pathname is valid). Internally, lookup() allocates\
    \ a pathname structure and calls lookupn() to actually perform the necessary parsing\
    \ and component loop. The steps performed by lookupn() are as follows:\n\n```\n\
    if (absolute_pathname) {\n    dirvp = rootdir\n} else {\n    dirvp = u.u_cdir\n\
    }\n\ndo {\n    name = extract string from pathname\n    newvp = VOP_LOOKUP(dirvp,\
    \ name, ...)\n    if not last component {\n        dirvp = newvp\n    }\nuntil\
    \ basename of pathname reached\nreturn newvp\n```\n\nThis is a fairly simple task\
    \ to perform. Obviously, users can add all sorts of character combinations, \"\
    \ and \". in the specified pathname, so there is a lot of string manipulation\
    \ to perform which complicates the work of lookupn().\n\n# The Directory Name\
    \ Lookup Cache\n\nThe section Inode Cache in Chapter 6 described how the inode\
    \ cache provided a means by which to store inodes that were no longer used. This\
    \ helped speed up access using pathname traversal if an inode corresponding to\
    \ a component in the pathname was still present in the cache.\n\nIntroduced initially\
    \ in 4.2BSD and in SVR4, the directory name lookup cache (DNLC) provides an easy\
    \ and fast way to get a pathname to a vnode. For example, in the old cache method,\
    \ parsing the pathname /usr/lib/fs/vxfs/bin/mkfs would involve working on each\
    \ component of the pathname at a time. The inode cache merely saved going to disk\
    \ processing of iget(), not to say that this isn't a significant performance"
