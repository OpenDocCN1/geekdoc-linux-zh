- pgno: 135
  md: '# UNIX Process-Related Structures


    Information about each process is divided between two different kernel structures.
    The proc structure is always present in memory, while the user structure holds
    information that is only needed when the process is running. Thus, when a process
    is not running and is eligible to be swapped out, all structures related to the
    process other than the proc structure may be written to the swap device. Needless
    to say, the proc structure must record information about where the swap device
    the other process-related structures are located.


    The proc structure does not record information related to file access. However
    the user structure contains a number of important file-access-related fields,
    namely:


    +   - u_cdir. The inode of the current working directory is stored here. This
    is used during using pathname resolution when a user specifies a relative pathname.

    - u_uid/u_gid. The process user ID and group ID used for permissions checking
    for file-based system calls. Similarly, u_uid and u_egid hold the effective user
    and group IDs.

    - u_ofile. This array holds the process file descriptors. This is described in
    more detail later.

    - u_arg. An array of system arguments set up during the transition from user to
    kernel when invoking a system call.

    - u_base. This field holds the address of a user space buffer in which to read
    data or write to when processing a system call as read() or write().

    - u_count. The number of bytes to read or write is held here. It is decremented
    during the I/O operation and the result can be passed back to the user.

    - u_offset. This field records the offset within the file for the current read
    or write operation.

    - u_error. When processing a system call, this field is set if an error is encountered.
    The value of u_error is passed back to the user when the system call returns.


    There are other fields which have significance to file-access based calls. However,
    these fields become redundant over the years and to avoid bloating this section,
    they won''t be described further.


    Users with the chroot() system call and later versions of UNIX may have been wondering
    why there is no u_rdir to hold the current, per-process root director—at this
    stage in UNIX development, chroot() had not been implemented.'
  merge: -1
  img_proc: true
- pgno: 136
  md: "# File Descriptors and the File Table\n\nThe File Descriptors, in Chapter 2,\
    \ described how file descriptors are returned from system calls such as open().\
    \ The u_file[] array in the structure is indexed by the file descriptor number\
    \ to locate a pointer to a file structure.\n\nIn earlier versions of UNIX, the\
    \ size of the u_file[] array was hardcoded and NOFILE elements. Because stdin,\
    \ stdout and stderr descriptors occupied slots 0, 1, and 2 within the array, the\
    \ first descriptor returned in response to an open() system call would be 3. For\
    \ the early versions of UNIX, NOFILE was set at 15. This would make its way to\
    \ 20 by the time the 7th Edition published.\n\nThe file structure contains more\
    \ information about how the file was opened and where the current file pointer\
    \ is positioned within the file for reading or writing. It contained the following\
    \ members:\n\n+   - f_flag. This flag was set on how the file was opened. If for\
    \ reading it was set to FREAD, and for opening it was set to WRITE.\n- f_count.\
    \ Each file structure had a reference count. This field is further described below.\n\
    - f_inode. After a file is opened, the inode is read from disk and stored in an\
    \ in-core inode. This field points to the in-core inode.\n- f_offset. This field\
    \ records the offset within the file when reading or writing. Initially it will\
    \ be zero and will be incremented by each subsequent read or write or modified\
    \ by lseek().\n\nThe file structure contains a reference count. Calls such as\
    \ dup() result in a new file descriptor allocated that points to the same file\
    \ table entry as the original file descriptor. Before dup() returns, the f_count\
    \ field is incremented.\n\nAlthough gaining access to a 5th Edition UNIX system\
    \ is a little difficult 27 years after it first appeared, it is still possible\
    \ to show how these concepts work in practice on more modern versions of UNIX.\
    \ Take for example the following program running on Sun’s Solaris 8:\n\n```\n\
    #include <fcntl.h>\n\nmain() {\n    int fd1, fd2;\n\n    fd1 = open(\"/etc/passwd\"\
    , O_RDONLY);\n    fd2 = dup(fd1);\n\n    printf(\"fd1 = %d, fd2 = %d\\n\", fd1,\
    \ fd2);\n    pause();\n}\n```"
  merge: -1
