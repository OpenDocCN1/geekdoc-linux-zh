- pgno: 175
  md: '# Development of the SVR4 VFS/Vnode Architecture 149


    Because the kernel address space, referenced by kas, contains a linked list of
    segments each with a filesystem defined start and end address, it is easy for
    the page fault handling code to determine which segment fault handler to call
    to satisfy the page fault. In this case the s_fault() function provided by the
    segmap driver will be called as:


    ```

    segmap_ops->fault(seg, addr, ssize, type, rw);

    ```


    By using the s_base and addr arguments passed the appropriate vnode can be located
    from the corresponding segmap structure. A call is then made to the filesystem''s
    VOP_GETPAGE() function, which must allocate the appropriate pages and read the
    data from disk returning. After this is all complete, the page fault is satisfied
    and the uiomove() function continues.


    A pictorial view of the steps taken when reading a file through the VxFS filesystem
    is shown in Figure 7.9.


    To write a file, the same procedure is followed up to the point where segmap_release()
    is called. The flags argument determines what happens to the pages once the segment
    is released. The values that flags can take:


    +   - SM_WRITE. The pages should be written via VOP_PUTPAGE(), to the file once

    - SM_ASYNC. The pages should be written asynchronously.

    - SM_FREE. The pages should be freed.

    - SM_INVALID. The filesystem has no access to these pages again.


    If no flags are set, the call to VOP_PUTPAGE() will not occur. This is the default
    behavior when reading from a file.


    # Memory-Mapped File Support in SVR4


    A call to mmap() will result in a new segyn segment attached to the process address
    space. A call will be made to the filesystem VOP_MAP() function, which performs
    some validation before calling the map_addr() function to actually initialize
    the process mapping result with the new segment.


    Page faults on the mapping result in a very similar set of steps to page faults
    on the segment segment. The segyn fault handler is called with the process space
    structure and virtual address. Attached to the private data of this segment will
    be the vnode, the offset within the file that was requested by mmap(), and a set
    of permissions to indicate the type of mapping.


    In the simple case of a memory access, the segyn driver will call VOP_GETPAGE()
    to read in the requested page for the file. Again, the filesystem will allocate
    the page and read in the contents from disk.


    In the following program, /etc/passwd is mapped. The following text shows how
    to display the segments for this process and from there show the segyn segment
    for the mapped region and how it points back to the passwd'
  merge: -1
  img_proc: true
