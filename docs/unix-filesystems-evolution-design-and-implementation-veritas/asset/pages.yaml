  md: '# 148 UNIX Filesystems—Evolution, Design, and Implementation


    ![](img/730b37b12231377a346ba9a27cbd6a68_174_0.png)


    **Figure 7.8** Main structures used in constructing the SVR4 page cache.


    segmap driver must reuse one of the existing slots. This works in a similar manner
    to buffer the cache where older buffers are reused when no free buffers are available.
    After a slot is reallocated, the pages backing that slot are placed on the free
    list. Thus, the page cache essentially works at two levels with the page list
    also acting as a cache.

    The segmap_release() function, shown below, works in a similar way to brelease()
    by allowing the entry to be reused:


    ```

    int

    segmap_release(struct *seg, addr_t addr, u_int flags)

    ```


    This is where the major difference between SVR4 and other UNIX kernels comes into
    play. The virtual address returned by segmap_getmap() will not have any associated
    physical pages on the first call with a specific vnode and offset. Consider the
    following code fragment, which is used by the filesystem to read from an offset
    of 8KB within a file and 1024 bytes:

    kaddr = segmap_getmap(segmap, vp, 8192);

    uomiove(kaddr, 1024, IO_READ, uicp);

    segmap_release(segmap, kaddr, SM_FREE);


    The uomiove() function is called to copy bytes from one address to another. Because
    there are no physical pages backing kaddr, a page fault will occur.'
