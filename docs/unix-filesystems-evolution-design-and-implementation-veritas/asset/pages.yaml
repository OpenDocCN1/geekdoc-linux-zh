  md: '# VxFS Tunable I/O Parameters


    There are several additional parameters that can be specified to adjust the performance
    of a VxFS filesystem. The vxtunes command can either set or display the tunable
    I/O parameters of mounted filesystems. With no options specified, vxtunes presents
    the existing VxFS parameters for the specified filesystem, as shown below:


    ```

    # vxtunes /mnt

    Filesystem i/o parameters for /mnt

    read_pre_io = 65536

    read_stream = 1

    read_unit_io = 65536

    write_pre_io = 65536

    write_nstream = 1

    write_unit_io = 65536

    pref_strength = 10

    buf_breakup_size = 262144

    discovered_direct_iosz = 262144

    max_direct_iosz = 1048576

    default_indir_iosz = 8192

    qio_cache_enable = 0

    write_throttle = 254080

    max_diskq = 1048576

    initial_extent_size = 8

    max_seqio_extent = 2048

    max_buf_data_size = 8192

    hsm_write_prealloc = 0

    ```


    vxtunes operates on either a list of mount points specified on the command line
    or all the mounted filesystems. When run on a mounted filesystem, the changes
    listed in the tunestab file are made effective immediately. The default tunestab
    file is /etc/vx/tunestab, which can also be changed by setting the VXTUNSTAB environment
    variable.


    If the /etc/vx/tunestab file is present, the VxFS mount command invokes vxtunes
    to set any parameters found in /etc/vx/tunestab to apply to the filesystem. If
    the file system is built on a VERITAS Volume Manager (VxVM), the VxFS-specific
    mount command interacts with VxVM to obtain default values for the tunables. It
    is generally best to allow VxFS and VxVM to determine the best values for these
    tunables.


