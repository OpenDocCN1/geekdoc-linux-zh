    When the df command is run and ux_stats() is reached, the breakpoint is hit and
    the kernel enters db. The bt command then display the stack trace showing that
    the kernel was entered by a system call that called through sys_stats() and vfs_stats()
    before entering ux_stats().nThe fields of the status can be obtained from either
    predefined defaults in ux_fs.h or from information stored in the superblock. Below
    is the result of a call to df following a single directory:


    ```

    # /mkfs /dev/d0

    # insmod /uxfs

    # mount -t uxfs /dev/d0 /mnt

    # df -k

