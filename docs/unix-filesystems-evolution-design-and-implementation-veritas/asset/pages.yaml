- pgno: 389
  md: "# Developing a Filesystem for the Linux Kernel 363\n\nAs with flushing the\
    \ superblock when dirty, the update daemon locates dirty\ninodes and invokes ux_write_inode()\
    \ to write them to disk.\n\nThe tasks to be performed by ux_write_inode() are\
    \ fairly straightforward:\n\n+   - Locate the block number where the inode resides.\
    \ It can be found by\nadding the inode number to UX_INODE_BLOCK.\n\n+   - Read\
    \ the block into memory by calling sb_bread().\n\n+   - Copy fields of interest\
    \ from the core-inode to the disk inode, then copy\ndisk inode to the buffer.\n\
    \n+   - Mark the buffer dirty and release it.\n\nBecause the buffer cache is marked\
    \ dirty, the periodic run of updatedate will\nwrite it to disk.\n\n# Deleting\
    \ Inodes\n\nThere are two cases where inodes needs to be freed. The first case\
    \ occurs when a\ndirectory needs to be removed; this is described in the section\
    \ Creating\nRemoving Directories later in the chapter. The second case occurs\
    \ when the inode\nlink count reaches zero.\n\nRecall that a regular file is created\
    \ with a link count of 1. The link count is\nincremented each time a hard link\
    \ is created. For example:\n\n```\n# touch A\n# touch B\n# ln A C\n```\n\nFiles\
    \ A and B are created with a link count of 1. The call to ln creates a directory\\\
    hent for file C and increments the link count of the inode to which A refers.\n\
    following commands:\n\n```\n# rm B\n# rm A\n```\n\nresult in calls to the unlink()\
    \ system call. Because B has a link count of 1, the\nfile will be removed. However,\
    \ file A has a link count of 2; in this case, the link\ncount is decremented and\
    \ the directory entry for A is 2; but the file\nremains and can be accessed through\
    \ C.\n\nTo show the case where a file is created and removed, a breakpoint on\\\
    ux_write_inode() can be set in kdb as follows:\n\n```\n[0]kdb> bp ux_write_inode\n\
    Instruction(i) BP #0 at 0xd08cd4c8 ([uxfs]ux_write_inode)\n  is enabled globally\
    \ adjust 1\n[0]kdb> go\n```"
  merge: -1
  img_proc: true
