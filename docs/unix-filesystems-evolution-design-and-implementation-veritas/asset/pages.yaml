    Add an option to fsdbck to mark the superblock dirty to help test this example.


    +   6. Locate the Loopback Filesystem HOWTO on the Wide Web and use this to build
    a device on which a uufs filesystem can be made.


    +   7. There are places in the filesystem where inodes and buffers are not released
    correctly. When performing operations and unmounting the filesystem, warnings
