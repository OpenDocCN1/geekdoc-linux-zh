- pgno: 168
  md: '# 142 UNIX Filesystems—Evolution, Design, and Implementation


    ![](img/730b37b12231377a346ba9a27cbd6a68_168_0.png)


    Figure 7.5 Structures used to manage the DNLC.


    As mentioned previously, there should be a hit rate of greater than 90 percent
    in the DNLC; otherwise it should be tuned appropriately. The size of the DNLC
    is determined by the tunable nsize and is typically based on the maximum number
    of processes and the maximum number of users.


    # Filesystem and Virtual Memory Interactions


    With the inclusion of the SunOS VM subsystem in SVR4, and the integration between
    the filesystem and the Virtual Memory (VM) subsystem, the SVR4 VFS architecture
    radically changed the way that I/O took place. The buffer cache changed in usage
    and a tight coupling between VM and filesystems together with page-based I/O involved
    changes throughout the whole kernel from filesystems to the VM to individual drivers.


    Consider the older style of file I/O that took place in UNIX up to including SVR3.
    The system makes calls into the buffer cache to read and write file data. For
    demand paging, the File System Switch architecture provided interfaces to aid
    demand paging of executable files, although all file data was still read and written
    through the buffer cache.


    This was largely intact when the VFS/inode architecture was introduced, in addition
    to their VFS/inode implementation, Sun Microsystems introduced a radically new
    Virtual Memory subsystem that was, in large part, to become the new SVR4 VM.


    The following sections describe the main components and features of the SVR4 VM
    together with how file I/O takes place. For a description of the SunOS implementation,
    consult the Usenix paper “Virtual Memory Architecture in SunOS” [GING87].'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# Development of the SVR4 VFS/vnode Architecture 143


    The memory image of each user process is defined by an (address space) structure
    that references a number of segments underpinned by the seg structure. Consider
    a typical user process. The address space of the process will include separate
    segments for text, data, and stack, in addition to various shared libraries, memory,
    and memory-mapped files shown pictorially in Figure 7.6.


    The seg structure defines the boundaries covering each segment. This includes
    the base address in memory together with the size of the segment.


    There are a number of different segment types. Each segment type has an array
    of segment-related functions in the same way that each vnode has an array of vnode
    functions. In the case of a page fault, the kernel will call the fault() function
    for the specified segment causing the handler to respond by reading in the appropriate
    data from disk. When a process is forked, the dup() is called for each segment
    and so on.


    For those segments as text and data that are backed by a file, the segvn segment
    has associated private, per-segment data that is accessed through the s_data field
    of the seg structure. This particular structure, segvn_data, contains information
    about the segment as well as the underlying file. For example, segvn segment operations
    need to know whether the segment is read/write, or whether it execute the vnode
    backing the segment, the offset at which the segment is mapped to the file must
    be known. As a hypothetical example, consider the case where user text is held
    at an offset of 0x4000 from the start of the executable file. If a page fault
    occurs within the text segment at the address s_base + 0x2000, the segment page
    handler knows that the data must be read from the file at an offset of 0x4000
    + 0x2000 = 0x6000.


    After a process starts executing, the first instruction that the process executes
    will generate a page fault within the segment the instruction. The kernel page
    fault handler must first determine which segment the fault occurred. This is achieved
    by using the list of segments referenced by the process together with the base
    address and the size of each segment. If the address generated by the page fault
    does not fall within the boundaries of any of the process segments, the process
    will be posted a SIGSEGV, which will typically result in process dumping core.


    To show how these structures are used in practice, consider the following invocation
    of the sleep(1) program:


    ```

    $ /usr/bin/sleep 100000e

    ```


    Using crash, the process can be loaded and the list of the segments can be displayed
    as follows:'
