    one actor/task communicate with threads in other actors/tasks by sending messages
    to ports.


    +   - Hardware access is managed a little differently between Chorus and Mach.
    The only device that Chorus knows about is the clock. By providing interfaces
    to dynamically connect interrupt handlers and trap handlers, devices can be managed
    outside of the microkernel.


    On the mach other has two interfaces, device_read() and device_write(), which
    allow access to device drivers that are embedded within the microkernel.


    Both provide the mechanisms by which binary compatibility with other operating
    systems can be achieved. On Chorus, supervisor actors (those residing in the kernel
    address space) can attach trap handlers. Mach provides the mechanisms by which
    a task can redirect a trap back to the user task that made the trap. This is discussed
    in more detail later.


    Using the services provided by both Chorus and Mach it is possible to construct
    a binary-compatible UNIX kernel. The basic implementation of such and the methods
    by which files are read and written are the subject of the next two sections.


    # The Chorus Microkernel


    The main components of an SVR4-based UNIX implementation on Chorus are shown in
    Figure 8.7. This is how SVR4 was implemented. Note however, it is entirely possible
    to implement UNIX as a single actor.


    There are a number of supervisor actors implementing SVR4 UNIX. Those that comprise
    the majority of the UNIX kernel are:


    **Process Manager (PM).** All process management tasks are handled this includes
    the equivalent of the proc structure, file descriptor management, and so on. The
    PM acts as system call handler in that it handles traps through users executing
    a system call.


    **Object Manager (OM).** The Object Manager, also calls the File Manager, is responsible
    for the majority of file related operations and implements the main UNIX filesystems.
    The OM acts as a mapper for UNIX file access.


    **STREAMS (STM).** As well as managing STREAMS devices such as pipes, TTYs, networking,
    and named pipes, the STM implements parts of the NFS protocol.


    Communication between UNIX actors is achieved through message passing. Actors
    can either reside in a single node or be distributed across different nodes.'
