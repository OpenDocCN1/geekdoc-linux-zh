- pgno: 381
  md: '# Developing a Filesystem for the Linux Kernel


    inode_operations vector that is passed a handle for the parent directory and a
    name to search for. Recall from the ux_read_super() function described in the
    section Reading the Root inode earlier in the chapter, after the superblock has
    been read into memory and the Linux super_block structure has been initialized,
    the root node must be read into memory and initialized. The uufs_ux_inode_operations
    vector is assigned to the i_op field of the root node. From there, name may be
    searched for, and once directories are brought into memory, a subsequent search
    may be made.


    the ux_lookup() function in ux_dir.c (lines 838 to 860) is called passing the
    parent directory and a partially initialized entry for the filename to look up.
    The next section gives examples showing the arguments passed. There are two cases
    that must be handled by ux_lookup():


    +   - The name does not exist in the directory. In this case EACC error is returned
    in which the kernel marks the dentry as negative. If another search is requested
    for the name, the kernel finds the negative entry in the dcache and will return
    an error to the user. This method is also used when creating new files and directories
    and will be shown later in the chapter.


    +   - The name is located in the directory. In this case the filesystem should
    call iget() to allocate a new Linux inode.


    The main task performed by ux_lookup() is to call ux_find_entry() as follows:


    ```

    inum = ux_find_entry(dip, (char*)dentry->d_name);

    ```


    Note that the d_name field of the dentry has already been initialized to reference
    the filename. The ux_find_entry() function in ux_inode.c (lines 1031 to 1054)
    loops through all the blocks of the directory ([i_addr]) making a call to sb_read()
    to read each appropriate block into memory.


    For each block, there can be UX_DIRS_PER_BLOCK ux_dentry structures. If a directory
    entry is not found, the d_ino field will be set to 0. Figure 14.5 shows the root
    directory and how entries are laid out within the data blocks. For each block,
    a check is made to see if the number (i_ino) is not zero indicating that the directory
    entry is valid. If the entry is valid, a string comparison is made between the
    name requested (in the dentry) and the entry in the directory (d_name). If the
    names match, the inode number is returned.


    If there is no match in any of the directory entries, 0 is returned. Note that
    inode 0 is unused so callers can detect that the entry is not valid.


    Once a valid entry is found, ux_lookup() makes a call to iget() to bring the inode
    into memory, which will call back into the filesystem to actually read the inode.'
