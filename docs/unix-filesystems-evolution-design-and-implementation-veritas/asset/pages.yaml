  md: '![](img/730b37b12231377a346ba9a27cbd6a68_236_0.png)


    +   Most database applications tend to cache data in their own user space buffer
    cache. Accessing files the filesystem results in data being read, and therefore
    cached, through the traditional buffer cache or through the system page cache.
    This results in double buffering of data. The database could avoid using its own
    cache. However, it would then have no control over when data is flushed from the
