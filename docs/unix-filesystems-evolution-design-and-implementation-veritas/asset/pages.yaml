    # Standardization and the pax Command


    POSIX.1 defined the pax (portable archive interchange) command, which reads and
    writes archives that conform to the Archive/Interchange File Format as specified
    in POSIX 1003.1. The pax command can read a number of different, older archives
    including both cpio and tar.


    For compatibility between different versions of UNIX, the Open Group, which controls
    the Single Unix Specification, recommend that users migrate from tar to pax. This
    is partly due to limitations with the tar format but also to allow operating system
    vendors to support a single archive format forward.


    # Backup Dump and Restore


    The dump command appeared in 6th Edition UNIX as a means of backing up a complete
    filesystem. To demonstrate how dump and restore on a filesystem, this section
    looks at the VFS vxxdump and vxrestore commands, both of which offer an interface
    to the dump and restore in other filesystems.


    The *vxxdump* command can write a dump either to tape or to a *dumpfile* (a file
    on the filesystem that holds the image of the dump).


    In addition to options that specify tape properties, *vxxdump* operates on dump
    levels in the range 0 to 9. When a dump level is in, *vxxdump* backs up all files
    that changed since the last dump at a lower level. For example, if a level 2 dump
    was taken on Monday and a level 4 dump was taken on Tuesday, a level 3 dump on
    Wednesday would back up all files that had been modified or added since the 2
    dump on Monday. If a level 0 dump is specified, all files in the filesystem are
    backed up.


    The use of dump levels allows a simple full/incremental approach to backup. For
    example, consider the case where a full backup is taken on Sunday,'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# Filesystem Backup 269


    followed by a set of incremental backups on each following for five days. A dump
    level of 0 will be specified for the Sunday backup. A level of 1 can be chosen
    on Monday, 2 on Tuesday, 3 on Wednesday, and so on. This ensures that only files
    that have been changed since the backup on the previous day will be backed up.


    The vxrestore command can be used to restore one or more files from an archive
    created by vxdump.


    In order to provide a simple example of vxdump and vxrestore work, a simple filesystem
    with one file is backed up to a dumpfile in /tmp as:


    ```

    # ls -l /fs1

    total 2 root-other 6 Jun 15:07 hello

    drwxr-xr-x- 2 root 9 Jun 14:51-last-found

    # vxdump -f /tmp/dumpfile /fs1

    vxdump: /dev/vx/rdsk /fs1

    vxdump: Date of level 0 dump: Fri Jun 7 15:08:16 2002

    vxdump: mapping (Pass I) [regular files]

    vxdump: mapping (Pass II) [directories]

    vxdump: estimated 94 blocks (72KB)

    vxdump: mapping (Pass III) [directories]

    vxdump: dumping (Pass IV) [regular files]

    vxdump: dumping: 41 tape blocks on 1 volumes(s)

    vxdump: Closing /tmp/dumpfile

    vxdump: dump is done

    ```


    Using the -t option of vxrestore is possible to display the contents of the dumpfile
    prior to issuing any type of restore command:


    ```

    # vxrestore -f /tmp/dumpfile -t

    Dump date: Fri Jun 7 15:08:16 2002

    Dumped from: the epoch

    ```


    +   2

    3 ./.lost+found

    4 ./hello


    This shows the contents of the archive, which is useful in the case where only
    one or two files need to be restored and confirmation of their existence is required
    before a restore command is issued. The hello file is restored as follows:


    ```

    # cd /fs1 ; rm hello

    # vxrestore -f /tmp/dumpfile -x hello

    # ls

    hello  lost+found

    ```


    There are a number of other options to vxrestore, including the ability to work
    interactively. In this mode is possible to view the contents of the archive using
    ls and cd commands before deciding which files or directories to extract.'
  merge: -1
  img_proc: true
