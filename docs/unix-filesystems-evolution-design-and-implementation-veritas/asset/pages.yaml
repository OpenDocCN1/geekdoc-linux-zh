    After entering the buffer cache as part of the read operation, after a valid buffer
    has been obtained, it is added to the v_clean1hkd field of the vnode. Having easy
    access to the list of buffer associates with the vnode enables the filesystem
    to perform an initial scan when performing virtual memory read operations to determine
    if the buffer is already valid.


    Similarly for writes, the filesystem makes repeated calls into the buffer cache
    to locate the appropriate data. Whether the buffer is moved to the cache or dirty
    list of the vnode depends on the type of write being performed. For delayed writes
    (without the O_SYNC flag) the buffer can be placed on the dirty list and flushed
    at a later date.


    For memory-mapped files, the VOP_MAP () function is called for the filesystem
    to validate before calling into the virtual memory (VM) system to establish the
    mapping. Page faults that occur on the mapping resulting in a call back into the
    filesystem through the VOP_PAGEIN() vnode operation. To flush dirty pages to disk
    through the msync(S) system call, tearing down a mapping, or as a result of paging,
    the VOP_PAEGOUT() vnode operation is called.


    # Filesystem Support in Minix


    The Minix operating system, compatible with UNIX V7 at the system level, was written
    by Andrew Tanenbaum and described in his book Operating Systems, Design and Implementation
    [TANE87]. As a lecturer in operating systems for 15'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'years, he found it difficult to teach operating system concepts without any
    hands-access to the source code. Because UNIX source code was not freely available,
    he wrote his own version, although compatible with the system level, worked very
    differently. The source code was listed in the book, but a charge was still made
    to obtain it. One could argue that if the source to Minix were freely available,
    Linux may never have been written. The source for Minix is now freely available
    across the Internet and is still a good, small kernel worthy of study.


    Because Minix was used as a teaching tool, one of the goals was to allow students
    to work on development of various parts of the system. One way of achieving this
    was to move the Minix filesystem out of the kernel and into user space. This was
    a model that was also adopted by many of the microkernel implementations.


    # Minix Filesystem-Related Structures


    Minix is logically divided into four layers. The lowest layer deals with process
    management, the second layer is for I/O tasks (device drivers), the third for
    server processes, and the top layer for user-level processes. The process management
    layer and the I/O tasks run within the kernel address space. The server process
    handles memory management and filesystem manager through message passing.


    There is no proc structure in Minix as there is with UNIX and no user structure.
    Information that pertains to a process is described by three main structures that
    are divided between the kernel, the memory manager, and the file manager. For
    example, consider the implementation of fork(S), as shown in Figure 8.3.


    System calls are implemented by sending messages to the appropriate subsystem.
    Subsystem can be implemented by the kernel alone, others by the memory manager,
    and others by the file manager. In the case of fork(S), the user process runs
    in mode, it must execute a hardware trap instruction to take it into the kernel.
    However, the system handler in the kernel performs very little work other than
    sending the requested message to the server, in this case manager.


    Each process is described by the mproc, and fproc structures. Thus to handle(S)
    work must be performed by the memory manager, kernel, and file manager to initialize
    the new structures for the process. All file-related information is stored in
    the fproc structure, which includes the following:


    fp_workdir. Current working directory


    fp_rootdir. Current root directory.


    fp_filip. The file descriptors for this process.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '![](img/730b37b12231377a346ba9a27cbd6a68_193_0.png)


    **Figure 8.3** Implementation of Minix.


    The file descriptor array contains pointers to filp structures that are very similar
    to the UNIX file structure. They contain a reference count, a set of flags, the
    current file offset for reading and writing, and a pointer to the inode for the
    file.


    # ## File I/O in Minix


    In Minix, all I/O and meta-data goes through the buffer cache. All buffers are
    held on a doubly linked list in order of access, with the least recently used
    buffers at the front of the list. All buffers are accessed via a hash table to
    speed buffer lookup operations. The two main interfaces to the cache are through
    `get_block()` and `put_block()` routines, which obtain and release buffers respectively.


    If a buffer is valid and within the cache, `get_block()` returns it; otherwise
    the data must be read from disk by calling the `rw_io()` function, which returns
    little else than calling `dev_io()`.


    Because all devices are managed by the device manager, `dev_io()` must send a
    message to the device manager in order to actually perform the I/O.'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'Reading or writing to a file in Minix bears resemblance to its UNIX counterpart.
    Note, when first developed, Minix had a single filesystem and therefore much of
    the filesystem internals were spread throughout the read/write code paths.


    Anyone familiar with UNIX internals will find many similarities in the Minix kernel.
    At the time it was written, the kernel was only 12,649 lines of code and is therefore
    still a good body to study UNIX-like principles and see how a kernel can be written
    in a modular fashion.


    # Pre-2.4 Linux Filesystem Support


    The Linux community named their filesystem architecture the Virtual File System
    Switch, or Linux VFS is a little of a misnomer because it was substantially different
    from the VFS/inode architecture and the SVR4 VFS architecture that preceded it.
    However, with all similarities between Linux and other UNIX variants.


    The following sections describe the earlier implementations of Linux prior to
    the 2.4 kernel, released around the 1.2 timeframe. Later on, the differences introduced
    with the 2.4 kernel are highlighted with a particular emphasis on the style of
    1/O, which changed substantially.


    For further details on the earlier Linux kernels see [BECK96]. For details on
    Linux filesystems, [BAR01] contains information about the filesystem architecture
    as well as details about some of the newer filesystem types supported on Linux.


    # Per-Process Linux Filesystem Structures


    The main structures used in construction of the Linux VFS are shown in Figure
    8.4 and are described in detail.


    Linux processes are defined by the task_struct, which contains information used
    for filesystem-related operations as well as the list of open file descriptors.
    The file-related fields are as follows:


    ```

    unsigned short  umask;

    struct inode      *root;

    struct inode      *pwd;

    ```


    The umask field is used in response to set the umask. The root and pwd fields
    hold the root and current working directory fields to use in pathname resolution.


    The fields to list file descriptors are:


    ```

    struct file      *filp[NR_OPEN];nfd_set      close_on_exec;

    ```'
