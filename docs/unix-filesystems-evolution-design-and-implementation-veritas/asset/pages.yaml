    # Raw and Block Devices


    With each disk slice or logical volume there are two methods by which they can
    be accessed, either through the raw (character) interface or through the block
    interface. The following are examples of character devices:


    ```

    # ls -1 /dev/vx/rdsk/mysql

    cr-- -1 root root 86,8 Jul 21:36 /dev/vx/rdsk/mysql

    # ls -1 /dev/rdsk/c0t0d0

    cr-- -1 root sys 136,0 Apr 09:51 /dev/rdsk/c0t0d0

    ```


    while the following are examples of block devices:


    ```

    # ls -1 /dev/vx/dsk/mysql

    br-- -1 root root 86,8 Jul 21:11 /dev/vx/dsk/mysql

    # ls -1 /dev/dsk/c0t0d0

    br-- -1 root sys 136,0 Apr 09:51 /dev/dsk/c0t0d0

    ```


    Note that both can be distinguished by the first character displayed (b or c)
    or through the location of the device file. Raw, devices are accessed through
    /dev/vx/rdsk while block devices are accessed through /dev/dsk. When accessing
    the block cache, buffers that are freed once used, they remain in the cache until
    they get reused. Data accessed through the raw or character interface is not read
    through the buffer cache. Thus, mixing the two can result in stale data in the
    buffer cache, which can cause problems.


    All filesystem commands, with the exception of the mount command, should use the
    raw/character interface to avoid this potential caching problem.


