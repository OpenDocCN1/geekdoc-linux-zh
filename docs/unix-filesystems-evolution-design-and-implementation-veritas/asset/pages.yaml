    # The Sun tmpfs Filesystem


    Sun developed a memory-based filesystem that used the facilities offered by the
    virtual memory subsystem [SNYD90]. This differs from RAM disk-based filesystems
    in which the RAM disk simply mirrors a copy of a disk slice. The goal of the design
    was to increase performance for file reads and writes, allow dynamic resizing
    of the filesystem, and avoid an adverse effect on performance. To the users, tmpfs
    filesystem looks like any other UNIX filesystem in that it provides full UNIX
    semantics.


    Chapter 7 described the SVR4 filesystem architecture on which tmpfs is based.
    In particular, the section Overview of the SVR4 VM Subsystem in Chapter 7, described
    the SVR4/Solaris VM architecture. Familiarity with these sections is essential
    to understanding how tmpfs is implemented. Because tmpfs is heavily tied to the
    VM subsystem, it is not portable between different versions of UNIX. However,
    this does not preclude development of a similar filesystem on the other architectures.


    # Architecture of the tmpfs Filesystem


    In SVR4, files accessed through the read() and write() system calls go through
    the seg_map kernel segment driver, which maintains a cache of recently'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# Pseudo Filesystems 261


    accessed pages of file data. Memory-mapped files are backed by a seg_vm kernel
    segment that references the underlying vnode for the file. In the case there is
    no backing file, the SVR4 kernel provides anonymous memory that is backed by swap
    space. This is described in the section Anonymous Memory in Chapter 7.


    Tmpfs uses anonymous memory to store file data and competes with memory used by
    all processes in the system (for example, for stack and segments). Because anonymous
    memory can be paged to a swap device, tmpfs data is also susceptible to paging.


    Figure 11.4 shows how the tmpfs filesystem is implemented. The vnode representing
    the open tmpfs file references a tmpfs inode structure, which is similar to an
    inode in other filesystems. Information within this structure indicates whether
    the file is a regular file, directory, or symbolic link. In the case of a regular
    file, the tmpode references an anonymous memory header that contains the data
    backing the file.


    # File Access through tmpfs


    Reads and writes through tmpfs function in a very similar manner to other filesystems.
    File data is read and written through the seg_map driver. When a file writes to
    a tmpfs file that has no data yet allocated, an anon structure is allocated, which
    references the actual pages of the file. When a file grows the anon structure
    is extended.


    Mapped files are handled in the same way as files in a regular filesystem. Each
    mapping is underpinned by a segment vnode.


    # Performance and Other Observations


    Testing performance of tmpfs is highly dependent on the type of data being measured.
    Many file operations that manipulate data may show only a marginal improvement
    in performance, because meta-data is typically cached in memory. For structural
    changes to the filesystem, such as file and directory creations, tmpfs shows a
    great improvement in a test since no disk access is performed.


    [SNYD90] also shows a test under which UNIX kernel was compiled. The overall time
    for a VFS filesystem was 32 minutes and for tmpfs, 27 minutes. Filesystems which,
    provide a temporary filesystem mode where nearly all transactions are delayed
    in memory, could close this gap significantly.


    One aspect that is difficult to measure when tmpfs file compete for virtual memory
    with the applications that are running on the system. The amount of memory on
    the system available for applications is a combination of physical memory and
    swap space. Because tmpfs file data uses same memory, the overall memory available
    for applications can be largely reduced.


    Overall, the deployment of tmpfs is highly dependent on the type of workload that
    is running on a machine together with the amount of memory available.'
