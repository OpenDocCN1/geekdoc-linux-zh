    # Filesystem-Based Concepts


    The UNIX filesystem hierarchy contains a number of different filesystem types
    including disk-based filesystems such as VxFS and UFS and also pseudo filesystems
    such as procfs and tmpfs. This chapter describes concepts that relate to filesystems
    as a whole such as disk partitioning, mounting and unmounting of filesystems,
    and the main commands that operate on filesystems as mkfs, fsck, and df.


    # What’s in a Filesystem?


    At one time, filesystems were either disk based in which all files in the filesystem
    were held on a physical disk, or RAM based. In the latter case, the filesystem
    only survived until the system was rebooted. However, the concepts and implementation
    are the same for both. Over the last 10 to 15 years a number of pseudo filesystems
    have been introduced, which the user look like filesystems, but for which the
    implementation is considerably different from the fact that they have no physical
    storage. Pseudo filesystems will be presented in more detail in Chapter 11. This
    chapter is primarily concerned with disk-based filesystems.


    +   * A UNIX filesystem is a collection of files and directories that has the
    following properties:'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'It has a root directory (/) that contains other files and directories. Most
    disk-based systems will also contain a lost+found directory where orphaned files
    are stored when recovered following a system crash.


    Each directory is uniquely identified by its name, the directory in which it resides,
    and a unique identifier, typically called an inode.


    By convention, the root directory has an inode number of 2 and the lost+found
    directory has an inode number of 3. Inode 0 and 1 are not used. File inode numbers
    can be seen by specifying the -i option to ls.


    It is self-contained. There are no dependencies between one filesystem and any
    other.


    A filesystem must be in a clean state before it can be mounted. If the system
    crashes, the filesystem is said to be dirty. In this case, operations may have
    been partially completed before the crash and therefore the filesystem structure
    may no longer be intact. In such a case, the check program fsck must be run on
    the filesystem to check for inconsistencies and repair any that it finds. Running
    fsck returns the filesystem to its clean state. The section Repairing Damaged
    Filesystems later in this chapter, describes the fsck program in more detail.


    # The Filesystem Hierarchy


    There are many different types of files in a complete UNIX operating system. These
    files, together with user home directories, are stored in a hierarchical tree
    structure that allows files of similar types to be grouped together. Although
    the UNIX directory hierarchy has changed over the years, the structure still largely
    reflects the filesystem hierarchy developed for early System V and BSD.


    For root and normal UNIX users, the PATH variable is set up during login to ensure
    that the appropriate paths are accessible from which to run commands. Because
    some directories contain commands that are used for administrative purposes, the
    path for root is typically different from that of normal users. For example, on
    Linux the path for a root and not root user may be:


    ```

    # echo PATH

    /usr/sbin:/bin:/usr/bin:/usr/local/bin:/usr/bin/X11:/root/bin

    $ echo PATH

    /home/spate:/usr/bin:/bin:/usr/bin/X11:/usr/local/bin:

    /home/spate/office52/program

    ```'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Filesystem-Based Concepts 87


    The following list shows the main UNIX directories and the type of files that
    reside in each directory. Note that this structure is not strictly followed among
    the different UNIX variants but there is a great deal of commonality among all
    of them.


    +   /usr.bin. This is the main location of binaries for both user and administrative
    purposes.

    /usr/bin. This directory contains user binaries.

    /usr/sbin. Binaries that are required for system administration purposes are stored
    here. This directory is not typically on a normal user''s path. On some versions
    of UNIX, some of the system binaries are stored in /sbin.

    /usr/local. This directory is used for locally installed software that is typically
    separate from the OS. The binaries are typically stored in /usr/local/bin.

    /usr/share. This directory contains architecture-dependent files including ASCII
    files. The UNIX manual pages are typically stored in /usr/share/man.

    /usr/lib. Dynamic and shared libraries are stored here.

    /usr/ucb. For non-BSD systems, this directory contains binaries that originated
    in BSD.

    /usr/include. User header files are stored. Header files used by the kernel are
    stored in /usr/include/sys.

    /usr/src. The kernel source code was once held in this directory although this
    hasn''t been the case for a long time, Linux excepted.

    /bin. This is a symbolic to /bin for some time.

    /dev. All of the accessible device files are stored here.

    /etc. Configuration files and binaries which may need to be run before other filesystems
    are mounted. This includes startup scripts and configuration files which are needed
    when the system bootstraps.

    /var. System log files are stored here. Many of the log files are stored in /var/log.

    /var/adm. UNIX accounting files and system login files are stored here.

    /var/preserve. This directory is used by the vi and editors for storing backup
    files.

    /var/tmp. This directory is used for temporary files.

    /var/spool. This directory is used for UNIX commands that provide spooling services
    via uucp, printing, and the cron command.

    /home. User home directories are typically stored here. This may be /home on some
    systems. Older versions of UNIX and BSD often store user home directories under
    /u.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# UNIX Filesystems—Evolution, Design, and Implementation


    /tmp. This directory is used for temporary files. Files residing in this directory
    will not necessarily be there after the next reboot.

    /opt. Used for optional packages and binaries. Third-party software vendors store
    their packages in this directory.


    When the operating system is installed, there are typically a number of filesystems
    created. The root filesystems contain the basic set of commands, scripts, configuration
    files, and utilities that are needed to bootstrap the system. The remaining files
    are held in separate filesystems that are visible after the system bootstraps
    and system administrative commands are available.

    For example, shown below are some of the mounted filesystems for an active Solaris
    system:


    ```

    /proc /proc read/write/setuid

    / /dev/dev/c0t0s0 read/write/setuid

    /fd on fd read/write/setuid

    /var/tmp on /dev/vk/dydg/vartmp read/write/setuid/tmplog

    /tmp on /dev/vk/dydg read/write/setuid/tmplog

    /opt on /dev/vk/dydg/opt read/write/setuid/tmplog

    /usr/local on /dev/vk/dydg/local read/write/setuid/tmplog

    /var/adm on /dev/vk/dydg/varlog read/write/setuid/tmplog

    /home on /dev/vk/dydg/homedg read/write/setuid/tmplog

    ```


    During installation of the operating system, there is typically a great deal of
    flexibility allowed so system administrators can tailor the number and size of
    filesystems to their specific needs. The basic goal is to separate those filesystems
    that need to grow from the root filesystem, which must remain stable. If the root
    filesystem becomes full, the system becomes unusable.


    # Disks, Slices, Partitions, and Volumes


    Each disk is typically split into a number of separate, different sized units
    called partitions or slices. Note that this is not the same as a partition in
    PC terminology. Each disk contains some form of partition table, called a VTOC
    (Volume Table Of Contents) in SVR4 terminology, which describes the slices and
    what size they may be used to bootstrap information, a filesystem, swap space,
    or left as a raw partition for database access or use.


    Disks can be managed using a number of utilities. For example, on Solaris and
    many SVR4 derivatives, the prvtoc and fmth utilities are used to edit the VTOC
    to divide the disk into a number of slices. When there are many disks, this hand
    editing of disk partitions becomes tedious and very error prone.


    For example, here is the output of running the prvtoc command on a root disk for
    Solaris:


    ```

    # prvtoc /dev/rdsk/c0t0d0s

    * /dev/rdsk/c0t0d0s partition map

    ```'
  merge: -1
  img_proc: true
