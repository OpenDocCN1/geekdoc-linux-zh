- pgno: 46
  md: 'The result of a successful operation is a file descriptor that is a handle
    through which the file can be subsequently accessed. The file descriptor is required
    in calls such as read(), write(), and lseek(). The value of the file descriptor
    is not important although the value assigned is explained in the section File
    Descriptors and the File Table in Chapter 6. What is important that it is used
    consistently. Following the open() call shown above, every time the passwd file
    is accessed by a system call or library that requires a file descriptor, the value
    returned in fd must be used.


    Note with this example and many other examples shown here and in other books,
    the use of the close() system call is often omitted. This is generally fine since
    files are automatically closed when the process exits.


    # Basic File Properties


    Typing ls -1 at the command prompt, users will see a whole host of properties
    associated with each file displayed, as shown in Figure 2.1. The main properties
    displayed:


    +   - The file type and access permissions

    - The link count of the file

    - The file''s owner and group

    - The size of the file

    - The date on which the file was last modified

    - The name of the file


    Some of the values displayed will be obvious to most readers although there are
    a few peculiarities. First of all however, where does this information come from?
    There are two calls that the ls command must make to get this information. Here
    is a brief sketch of:


    +   - 1. For the directory, retrieves the files that are stored in the directory.

    - 2. For each file, obtain the properties of the file.


    After this information is available, the ls command can simply print out the information
    that it retrieves. Shown below is an example of how the ls command is implemented.
    In summary, the system getdents() returns all entries in the directory, then for
