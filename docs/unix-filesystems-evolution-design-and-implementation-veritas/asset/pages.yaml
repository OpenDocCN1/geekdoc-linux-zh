- pgno: 231
  md: '# Disk-Based Filesystem Case Studies 205


    mounted. One important example is the case of a filesystem resize. Traditionally,
    resizing a filesystem involved the following:


    +   1. Create a new slice or volume of the appropriate size and create a new filesystem
    on this volume.

    2. Disable access to the old filesystem (usually through a verbal warning).

    3. Copy the contents of the old filesystem to the new filesystem.

    4. Mount the new filesystem on the mount point.


    This is obviously undesirable because it can result in a significant interruption
    of service. VxFS provides the mechanisms by which a filesystem may be resized
    (up or down) while the filesystem is mounted and active.

    The following example shows how this can be achieved through use of the VxFS fsadm
    command. First of all, the filesystem is created and mounted. The size of the
    filesystem is 10000 sectors. The number of 1KB blocks is 5,000.


    ```

    # mkfs -F vfs /dev/vx/rdsk/fsl 10000

    version 4 layout

    10000 sectors, 5000 blocks of size 1024, log size 256 blocks

    unlimited inodes, largefiles unsupported

    5000 data blocks, 4672 free data blocks

    1 allocation units of 32768 blocks, 32768 data blocks

    last allocation unit 5000 data blocks

    # mount -F vfs /dev/vx/rdsk/fsl /mnt1

    # df -k | grep mnt1

    /dev/vx/rdsk/fsl 5000 341 4375 8% /mnt2

    ```


    The df command is run to show the blocks in the filesystem and the available amount.
    The fsadm command is then run to double the size of the filesystem as follows:


    ```

    # fsadm -b 20000 /mnt1

    UX:vxfs fsadm: INFO: /dev/vx/rdsk/fsl is currently 10000 sectors -

