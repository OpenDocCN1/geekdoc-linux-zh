- pgno: 185
  md: '# Non-SVR4-Based Filesystem Architectures 159


    # VFS Vnode Structure Differences


    Most structures introduced in the Sun VFS architecture also found their way into
    BSD UNIX with very few modifications. The vfs structure added vfs_bsize, the optimal
    filesystem block size, although this was rarely used. The stats structure was
    enhanced to add f_bsize and information about where the filesystem was mounted.
    The vnode structure added the v_text field, which was used for executable files.


    A few additional vnode operations were added:


    +   - vn_mknod. Handles the mknod(S) system call.

    - vn_read. Handles the read(S) system call.

    - vn_write. Handles the write(S) system call.

    - vn_seek. Called in response to an lseek(S) system call.

    - vn_abort. This function is called when a previous name(i) call specified CREATE
    or DELETE but the operation is not to be carried out.

    - vn_lock. The filesystem layer typically calls VOP_LOCK() to lock a file prior
    to a subsequent vnode operation.

    - vn_unlock. This v operation unlocks a vnode previously locked with a call to
    VOL_LOCK().


    Reading and writing to files was handled by invoking the VOL_READ() and VOL_WRITE()
    vnode operations. Both functions are surrounded by calls to VOL_LOCK() and VOP_UNLOCK()
    vnode operations. The actual reading and writing of regular files was handled
    by the UFS functions ufs_read() and ufs_write() functions that mapped onto buffer
    cache functions.


    # Digital UNIX / True64 UNIX


    Digital UNIX, formerly DEC OS/1, is a microkernel-based implementation of UNIX
    utilizing the Microkernel and the BSD 4.3/4.4 versions of UNIX. For further details
    on Microkernel Support for UNIX Filesystems, in this chapter. With the merger
    between Compaq and Digital, the name of the operating system was changed to True64
    UNIX. True64 now contains a considerable rewrite of many the components of the
    OS/1 kernel and differs substantially from the UNIX emulation on Mach, described
    in the section The Microkernel later in this chapter.


    From a filesystem perspective, True64 UNIX supports a large number of filesystems
    including UFS, NFS, and AdvFS (Advanced File System), transaction-based filesystem
    that provides many features.


    The True64 UNIX filesystem architecture was derived from the 4.3Beno release but
    has, over the last several years, been modified to include a number of new features.'
