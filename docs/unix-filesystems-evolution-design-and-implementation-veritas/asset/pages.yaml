  md: "# Non-SVR4-Based Filesystem Architectures 175\n\nthe SVR4 page cache-based\
    \ I/O paths, as demonstrated by the port of VxFS to Linux for the I/O path uses\
    \ very similar code.\n\n# Main Structures Used in the 2.4.x Kernel Series\n\n\
    The main structures of the VFS have remained largely intact as shown in Figure\
    \ 8.5. One major change was the tight integration between the dache (which itself\
    \ has largely been rewritten) and the inode cache. Each file has a dentry (which\
    \ replaces the old dir_cache entry structure) referenced from the file structure,\
    \ and dentry is underpinned by an in-core structure. The file_operations structure\
    \ gained an extra two functions. check_media_change() function is used with block\
    \ devices that support changeable media as CD drives. This allows the VFS layer\
    \ to check for media changes and determine whether the filesystem should be mounted\
    \ to recognize the new media. The revalidate() function is used following a media\
    \ change to restore consistency of the block device. The inode_operations structure\
    \ gained an extra three functions. readpage() and writepage() functions were introduced\
    \ to provide a means for the memory management subsystem to read and write pages\
    \ of data. The swap() function is used to support swapping to regular files. There\
    \ was no change to the super_operations structure. There were additional changes\
    \ at the higher levels of the kernel. The fs_struct structure included dentry\
    \ structures for the root and current working directories. This is referenced\
    \ from the task_struct structure. The file_struct continued to hold the file descriptor\
    \ array.\n\n# The Linux 2.4 Directory Cache\n\nThe dentry, shown below, is used\
    \ to represent an entry in the 2.4 dcache. This is referenced by the f_dentry\
    \ field of the file structure.\n\n```\nstruct dentry {\n    atomic_t d_count;\
    \           /* inode for this entry */\n    unsigned int d_flags;        /* parent\
    \ directory */\n    struct inode *d_inode;      /* lookup list */\n    struct\
