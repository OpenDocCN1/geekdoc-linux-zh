  md: '# Glossary


    Because this is not a general book about operating system principles, there are
    many OS-related terms described throughout the book that do not have full, descriptive
    definitions. This chapter provides a glossary of these terms and filesystem-related
    terms.


    /proc. The process filesystem, also called the /proc filesystem, is a pseudo filesystem
    that displays to the user a hierarchical view of the processes running on the
    machine. There is a directory in the filesystem per user process with a whole
    host of information about each process. The /proc filesystem also provides the
    means to trace running processes and debug another process.


    ACL. Access Control Lists, or more commonly known as ACLs, provide an additional
    level of security on top of the traditional UNIX security model. An ACL is a list
    of users who are allowed access to a file with the type of access that they are
    allowed.


    address space. There are two main uses of the term address space. It can be used
    to refer to the addresses that a user process can access—this where the user instructions,
    data, stack, libraries, and mapped files would reside. One user address space
    is protected from another user through use'
  merge: -1
  img_proc: true
- pgno: 434
  md: 'hardware mechanisms. The other use for the term is to describe the instructions,
    data, and stack areas of the kernel. There is typically only one kernel address
    space that is protected from user processes.


    AFS. The Andrew File System (AFS) is a distributed filesystem developed at CMU
    by the Andrew Project. The goal of AFS was to create a uniform, distributed namespace
    that spans multiple campuses.


    aggregate. UNIX filesystems occupy a disk slice, partition, or logical volume.
    Inside the filesystem is a hierarchical namespace that exports a root filesystem
    that is mountable. In the DFS filesystem component, each disk slice copies an
    aggregate of filesets, each with their own hierarchical namespace and each exporting
    a root directory. Each fileset can be mounted separately, and in DFS, filesets
    can be migrated from one aggregate to another.


    AIX. This is the version of UNIX distributed by IBM.


    allocation unit. An allocation unit, to be found in the VxFS filesystem, is a
    subset of the overall storage within the filesystem. Older VxFS filesystems, the
    filesystem was divided into a number of fixed-size allocation units, each with
    its own set of inodes and data blocks.


    anonymous memory. Pages of memory are typically backed by an underlying file in
    the filesystem. For example, pages of memory used for program code are backed
    by an executable file from which the kernel can satisfy a page fault by reading
    the data from the file. Process data such as the data segment or the stack do
    not have backing stored within the filesystem. Such data is backed by anonymous
    memory that in turn is backed by storage on the swap device.


    asynchronous I/O. When a user process performs a read() or write() system call,
    the process blocks until the data is read from disk into the user buffer or writes
    to either disk or the system page buffer cache. With asynchronous I/O, the request
    to I/O is simply queued and the kernel returns to the user process. The process
    can make a call to determine the status of the I/O at a later stage or receive
    an asynchronous notification. For applications that perform a huge amount of I/O,
    asynchronous I/O can leave the application to perform other tasks rather waiting
    for I/O.


    automounter. In many environments it is unnecessary to always NFS mount filesystems.
    The automounter provides a means to automatically mount an NFS filesystem when
    a request is made to open a file that would reside in the remote filesystem.


    bddev. has been present in UNIX since its day and is used to access block-device
    drivers. The major number of the driver, as displayed by ls -1, is used to index
    this array.


    bflush. Many writes to regular files that go through the buffer cache are not
    written immediately to disk to optimize performance. When the filesystem is finished
    writing data to the buffer cache, it releases the buffer'
