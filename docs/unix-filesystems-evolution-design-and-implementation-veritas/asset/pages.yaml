  md: '# Disk-Based Filesystem Case Studies 207


    log. With this mode, a system call that results in a filesystem structural data
    will not return to the user until VxFS logged the changes to disk. This has traditionally
    been the default mode but is now being phased out and replaced by delaylog.


    delaylog. With this option, many structural changes are made to the filesystem
    are recorded in the in-core filesystem and written to the intent log disk at a
    later time. This has the effect of improving the responsiveness of the filesystem,
    but data can be lost in the event of a crash.


    tmplog. With this option, nearly all structural changes are written to the in-core
    log. Writing to the intent log is delayed as long as possible. This gives the
    best all-round performance but at the risk of losing data in the event of a system
    crash.


    nodatainlog. By default, for small synchronous writes, VxFS writes both the inode
    and the new file data to be written to the intent log. By specifying the nodatainlog
    option, the file data is written to its appropriate place in the file while the
    inode is written through the intent log.


    Note regardless of which option is chosen, if the system crashes, the filesystem
    is guaranteed to be intact at all times.


    To maintain UNIX semantics, reading from a file will result in a change to the
    access time field of the inode. There are however, few applications that look
    or need to view the access time. Using the noatime mount option, updates to the
    inodes'' access time field will be ignored unless written in conjunction with
    the modification time.


    The caching behavior of the filesystem may be altered at mount times by specifying
    the minache or convync options. With these options, the administrator has a range
    of choices between maximum data integrity and maximum performance, depending on
    the workload of the machine.


    The minache mode has five suboptions, based on the caching advisories described
    in the section Data and Attribute Caching in Chapter 3. These are:


    minache=closync. This option is useful in desktop environments where the machine
    may be powered off without shutting down the machine. With this option, any changes
    to the file are flushed to disk when the file is closed. Running in this mode
    may introduce up to 15 percent penalty on performance.


    minache=dsync. When this option is specified, data is read and written as if the
    VX_DSYNC caching advisory is set. If a write to a file results in the timestamps
