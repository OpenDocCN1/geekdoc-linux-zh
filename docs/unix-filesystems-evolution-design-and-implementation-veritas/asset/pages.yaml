    Many of the fields shown here are self explanatory and describe the usage of inodes
    and data blocks within the block group. The magic number for ext2 is 0EF58. The
    fields towards the end of the superblock are used to determine when a full fsck
    should be invoked (either based on the number of read/write counts or a specified
    period).


    When writing sequentially to a file, ext2 tries to preallocate space in units
    of 8 contiguous blocks. Unused preallocation is released when the file is closed,
    so no space is wasted. This is used to prevent fragmentation, a situation where
    the majority of the blocks in the file are spread throughout the disk because
    Contiguous blocks are also good for performance because blocks are accessed sequentially
    there is minimal disk head movement.'
