  md: '# Mount and Unmount System Call Handling


    As the preceding examples showed, the mount and unmount commands result in a call
    to the mount () and unmount () system calls respectively.


    ```

    #include <sys/types.h>

    #include <sys/mount.h>


    int mount(char *spec, const char *dir, int mflag, /*

    char *type, const char *datptr, int datelen /* ... */);


    #include <sys/mount.h>


    int unmount(const char *file);

    ```


    Usually there should never be a direct need to invoke either the mount () or unmount
    () system calls. Many of the arguments are self-explanatory, the handling of per-filesystem
    options, as pointed out by datptr, is not typically published and often changes.
    If applications have a need to mount and unmount filesystems, the (L) library
    function is recommended as a better choice.


    # Mounting Filesystems Automatically


    As shown in the next section, after filesystems are created, it is typically left
    to the system to mount them during bootstrap. The virtual filesystem tree, called
    /etc/vfstab on System V variants and /etc/fstab on BSD variants, contains all
    the information about each filesystem to be mounted.


    This file is created during installation of the operating system. When new filesystems
    are created, the system administrator will add new entries ensuring all the appropriate
    fields are entered correctly. Below is an example of the fstab table on Solaris:


    ```

    # cat /etc/vfstab

    fd                         /dev/fd      fd       no

    /proc                      proc       no

    /dev/dsk/c0t00s0           /rdsk/c0t00s0  ufs      1 no

    /dev/dsk/c0t00s6           /rdsk/c0t00s6  usr      1 no

    /dev/dsk/c0t00s4           /rdsk/c0t00s4  ufs      2 yes

    ```


    Here are the fields separated by spaces or tabs. The first field shows the block
    device (passed to mount), the second field shows the raw device (passed to fsck),
    the third field specifies the mount point, and the fourth specifies the filesystem
    type. The remaining three fields specify the order in which the filesystems will
    be checked, whether they should be mounted during bootstrap, and what options
    should be passed to the mount command.


    Here is an example of a Linux fstab table:'
