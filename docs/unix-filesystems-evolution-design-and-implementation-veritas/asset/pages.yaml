- pgno: 117
  md: '# Filesystem-Based Concepts 91


    filesystem may support a wide range of options. Although some of these options
    will be common to most filesystems, many may not be.


    To support a variety of option commands, many of the filesystem-related commands
    are divided into generic and filesystem dependent commands. For example, the generic
    mkfs command that will be described in the next section, is invoked as follows:


    ```

    # mkfs -F vxs -o ...

    ```


    The -F option (-t on Linux) is used to specify the filesystem type. The -o option
    is used to specify filesystem-specific options. The first task to be performed
    by mkfs is to do a preliminary sanity check on the arguments passed. After this
    has been done, the next job is to call the specific filesystem mkfs function.
    Take example the call to mkfs as follows:


    ```

    # mkfs -F nfs /dev/rdsk/nyvol

    mkfs: FType nfs not installed in the kernel

    ```


    Because there is no filesystem type of nfs, the generic mkfs command is unable
    to locate the location of nfs version of mkfs. To see how the is made for the
    filesystem specific mkfs command, consider the following:


    ```

    # truss -o /tmp/truss.out -F nfs /dev/rdsk/myvol

    mkfs: FType nfs not installed in the kernel

    # grep nfs /tmp/truss.out

    execve("/usr/lib/fs/nfs/mkfs",0x000225C0,0xFFFE8DA8) Err#2 ENOENT

    execve("/etc/fs/nfs/mkfs",0x000225C0,0xFFFE8DA8) Err#2 ENOENT

    sysfs(GETFSIND,"nfs") Err#2 EINVAL

    ```


    In this case, the generic mkfs command assumes that for the nfs filesystem it
    will be located in one of the two directories above. In this case, the files do
    not exist. As a finally sanity check, a call is made to sysfs() to see if there
    actually a filesystem type called nfs.


    Consider the location of the generic and filesystem-specific fstype commands in
    Solaris:


    ```

    # fstype

    /usr/sbin/fstype

    # autos/  fs/  lofs/ nfs/  proc/  udfs/ vxfs/

    caches/  mkfs/  pcfs/  tmpfs/ ufs/

    # /usr/lib/fs/ufs/fstype

    /usr/lib/fs/ufs/fstype

    # /usr/lib/fs/vxfs/fstype

    /usr/lib/fs/vxfs/fstype

    ```


    Using this knowledge it is straightforward to write a version of the generic fstype
    command as follows:'
