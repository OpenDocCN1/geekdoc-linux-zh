    # VxFS Extent Attributes


    The default algorithms used to allocate extents to a file are based on the I/O
    pattern. For example, if a file is created and the file is written sequentially,
    the first extent allocated will be a power of two greater than the size of the
    write. The extents allocated after this first write increase as the sequential
    writes continue to be issued. By allocating larger and larger extents in this
    manner, an attempt is made to ensure that as many blocks as possible are contiguous
    on disk. If a file is closed and the last write occupies only a small amount of
    a large extent, the extent is shortened and the remaining space returned to the
    free pool.


    When a new file, if the size of the file is known prior to creation, the extents
    may be pre-allocated. This can be achieved by use of the setext ioctl. The example
    below shows how a 100MB file is created using setext:


    ```

    # > myfile

    # setext -e 1024 -r 104 -f chgsize myfile

    # ls -l myfile

    -rw-r--r-- 1 root 1048576 Mar 27 19:33:56 myfile

    ```'
