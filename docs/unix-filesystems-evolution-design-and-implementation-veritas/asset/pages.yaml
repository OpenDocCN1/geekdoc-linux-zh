- pgno: 179
  md: "# Development of the SVR4 VFS/node Architecture 153\n\nThe single page approach\
    \ may not be ideal for filesystems as VxFS that have multiple page extents. The\
    \ same holds true for any filesystem where the block size is greater than the\
    \ page size. Rather than flush a single dirty page to disk, it is preferable to\
    \ flush a range of pages. For VxFS this may cover all dirty pages within the extent\
    \ that may be in memory. The VM subsystem provides a number of routines for manipulating\
    \ lists of pages. For example, the function pvn_getdirty_range() can be called\
    \ to gather all dirty pages in the specified range. All pages in this range are\
    \ gathered together in a linked list and passed to a filesystem-specified route,\
    \ that then can proceed to the page list to disk.\n\n# Page-Based I/O\n\nPrior\
    \ to SVR4, all I/O went through the buffer cache. Each buffer pointed to a kernel\
    \ virtual address where the data could be transferred to and from. With the change\
    \ to a page-based model for file I/O in SVR4, the filesystems with pages for file\
    \ I/O may wish to perform I/O to more than one page at a time, as described in\
    \ the previous section, a call back into the filesystem from pvn_getdirty_range()\
    \ passes a linked list of page structures. These pages, To avoid an unnecessary\
    \ use of kernel virtual space and an increased cost in time to manage these pages,\
    \ the buffer cache subsystem as well as the underlying device drivers were modified\
    \ to accept a list of pages. In this case, the b_pages field is set to point to\
    \ the list of pages and the B_pages field must be set.\n\nAt the stage that the\
    \ filesystem wishes to perform I/O, it will typically have a linked list of pages\
    \ into which data needs to be read or from which data to be written. Without prevention\
    \ duplicate allocations, the kernel provides a function, pageio_setup(), which\
    \ allocates a buf structure, attaches the list of pages to b_pages, and initializes\
    \ the b_flags to include B PAGES. This is used by the driver to indicate that\
    \ I/O is being performed and that b_pages should be used and not b_addr. \n\n\
    The I/O is actually performed by calling the driver strategy. If the filesystem\
    \ needs to wait for the I/O completion, it must call biwait(), passing the buf\
    \ structure as an argument. After the I/O is complete, a call to pageio_done()\
    \ will free the buffer, leaving the page list intact.\n\n# Adoption of the SVR4\
    \ Vnode Interface\n\nMany OS vendors implemented the VFS/node architecture within\
    \ the framework of their UNIX implementations, the SVR4 style of page I/O, while\
    \ efficient and elegant in use of the underlying memory, failed to gain widespread\
    \ adoption. In part this was due to the close nature in which SVR4 was developed\
    \ because the implementation was not initially documented. An additional reason\
    \ was due to the amount of change that was needed both to the VM subsystem as\
    \ well as every filesystem supported."
