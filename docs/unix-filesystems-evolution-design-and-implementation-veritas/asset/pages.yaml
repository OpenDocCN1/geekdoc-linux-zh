    # High-Level Microkernel Concepts


    Both Mach and Chorus provide a basic microkernel that exports the following main
    characteristics:


    +   - The ability to define an execution environment, for example, the construction
    of a UNIX process. In Chorus, this is the actor and in Mach, the task defines
    an address space, one or more threads of execution, and the means to communicate
    with other actors/tasks through IPC (Inter-Process Communication). Actors/tasks
    can reside in user or kernel space.


    The Chorus actor is divided into a number of regions, each virtual address range
    backed by a segment that is managed by a mapper. The segment is often the representation
    of secondary storage, such as a file. For example, one can think of a mapped file
    represented by a region in the process address space. The region is a window into
    a segment (the file), and page faults are handled by calls to the segment mapper,
    which will request data from the filesystem.'
