- pgno: 380
  md: "The dirp pointer references an area of memory whose size is specified in count.\
    \ The kernel will try to read as many directory entries as possible. The number\
    \ of bytes read is returned from getdents(). The dirent structure is shown below:\n\
    \n```\nstruct dirent {\n    long d_ino;               /* inode number */\n   \
    \ off_t d_off;             /* offset to next dirent */\n    unsigned short d_reclen;\
    \ /* length of this dirent */\n    char d_name[NAME_MAX+1];  /* file name (null-terminated)\
    \ */\n};\n```\n\nTo read all entries, is may need to call getdents() multiple\
    \ times depending on the size of the buffer passed in relation to the number of\
    \ entries in the directory.\n\nTo fill the buffer passed by the kernel, multiple\
    \ calls may be made into the filesystem through the ux_readdr() function. The\
    \ definition of this function is as follows:\n\n```\nint\nx_readdr(struct file\
    \ *filp, void *dirent, filldir_t filldir);\n```\n\nEach time the function is called,\
    \ the current offset within the directory is increased. The first step taken by\
    \ ux_readdr() is to map the offset into a block as follows:\n\n```\npos = filp->f_pos;\n\
    blk = (pos + 1) / UX_SIZE;\nblk = uip->addr[blk];\n```\n\nOn first entry pos will\
    \ be 0 and therefore the block to be read into memory and a search is to locate\
    \ the required filename. Each block is comprised of UX_DIRS_PER_BLOCK ux_dirent\
    \ structures. Assuming that the entry in the block appropriate offset is valid\
    \ (d_ino is not 0), the filldir() routine, a generic kernel used by all filesystems,\
    \ is called to copy the entry to the user's address space.\n\nFor each directory\
    \ entry found, or a null directory entry is encountered, the offset within the\
    \ directory is incremented as follows:\n\n```\nfilp->f_pos += sizeof(struct ux_dirent);\n\
    ```\n\nto record where to start the next if ux_readdr() is called again.\n\n#\
    \ Filename Lookup\n\nFrom a filesystem perspective, pathname resolution is a fairly\
    \ straightforward affair. All that is needed is to provide the lookup() function\
    \ of the"
