    is specified as 1024 blocks and a request has been made to preallocate 1024 blocks,
    this should result in a single extent of 1024 blocks allocated. The -f option
    specifies that the reservation should be made immediately. The following output
    from fsdb shows the inode extent and the content allocated to this file.


