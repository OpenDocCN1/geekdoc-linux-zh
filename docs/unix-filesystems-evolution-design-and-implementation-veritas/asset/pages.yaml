- pgno: 172
  md: 'The segvn segment type is of most interest to filesystem writers. Other segments
    include `seg_u` for managing user areas, `seg_kmem` for use by the kernel virtual
    memory allocator, and `seg_dev`, which is used to enable applications to memory-devices.


    The kernel address space is managed in a similar manner to the user address space
    that it has its own address structure referenced by the kernel variable `k_as`.
    This points to a number of different segments, one of which is the SVR4 `page
    cache` that is described in this chapter.


    # Anonymous Memory


    When a process starts executing, the data section may be modified and therefore,
    once read from the file, loses its file association thereafter. All segvn segments
    contain a reference to the original file where the data must be read from but
    also contains a reference to a set of anonymous pages.


    Every anonymous page has reserved space on the swap device. If memory becomes
    low and anonymous pages need to be paged out, they can be written to the swap
    device and read back into memory at later date. Anonymous pages are described
    by the anon structure, which contains a reference count as well as a pointer to
    the actual page. It also points to an entry within an `si_anon[]` array for which
    there is one per swap device. The location within this array determines the location
    on the swap device where the memory will be paged to if necessary. This is shown
    in Figure 7.7.


    # File I/O through the SVR4 VFS Layer


    SVR4 implemented what is commonly called the page cache through which all file
    data is read and written. This is actually a somewhat vague term because the page
    cache differs from the fixed sizes of the buffer cache, DNLC, and other types
    of caches.


    The page cache is composed of two parts, a segment underpinned by the `seg_map`
    driver and a list of free pages that can be used for any purpose. Thus, after
    a page of file leaves the cache, it is added to the list of free pages. While
    the page is on the free list, it retains its identity so if the kernel wishes
    to locate the data prior to the page being reaged, the page is removed from the
    free list and the data does not need to be re-read from disk.


    The main structures constructing the page cache are kernel address space and is
    underpinned by the `segmap_data` structure that describes the properties of the
    segment. The size of the segment is tunable and is in MAXSIZE (8KB) chunks where
    each 8KB chunk represents an 8KB window into a file. Each chunk is referenced
    by an `smap` structure that contains a pointer to a vnode for the file and the
    offset within the file. Thus, whereas the buffer cache references file data by
    device and block number, the page cache references file data by vnode pointer
    and file offset.'
  merge: -1
  img_proc: true
