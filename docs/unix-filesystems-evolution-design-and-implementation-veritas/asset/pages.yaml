- pgno: 187
  md: '# The AIX Filesystem Architecture


    AIX first appeared in 1985 running on the IBM RT machine, which was IBM''s first
    RISC-based workstation. AIX version 2 was enhanced to support TCP/IP and NFS.
    This was followed by a port to the P/2 in 1989. In the same year, AIX was ported
    to the 370 series of mainframes and the following year saw the introduction of
    the RISC System/6000 by AIX version 3. AIX version 3.2, which is the most widely
    documented version of AIX, as seen in David Kelly''s book AIX/6000 Internals and
    Architecture [KELL96], was released in 1992. The following text describes features
    of AIX from the 3.2 release with information on how files perform I/O on the 5.x
    kernel sera.


    Originally AIX on SVR2 has undergone a major rewrite adding features from other
    versions of UNIX including SVR4. AIX also has features not found in any other
    versions of UNIX, such as a passable kernel, an area that resulted in considerable
    complexity within the kernel, in particular the virtual memory system.


    # The Filesystem-Independent Layer of AIX


    As with earlier versions of UNIX, file descriptors are held in a fixed size array
    within the user area for each process. Similarly, each file descriptor entry points
    to an entry in the system file. Although the file table entries contained all
    of the fields of other versions of UNIX referencing a vnode, each entry also pointed
    to a filops structure that contained all of the operations that could be applied
    to the open file in question. This is similar to BSD such that regular files and
    sockets can be accessed by the same set of system calls.


    This is where the differences started to appear. Although AIX supported vnodes
    referenced by the file structure, each vnode pointed to an in-core inode that
    had an embedded gnode structure. With the exception of the gnode, the inode structure
    was similar to UNIX in-core inodes, containing such fields as:


    +   - i_forw / i_back. Forward and backward pointers used for a hash queue when
    the inode is in use.

    - i_next / i_prev. Forward and backward pointers used when the inode is on the
    free list.

    - i_dev. The device that holds the filesystem on which the file resides.

    - i_number. The disk inode number. When a file is opened, the inode cache is scanned
    using the i_dev and i_number fields.

    - i_count. A reference count holding the number of opens against the file.

    - i_locks. Used to serialize updates to the inode.

    - i_gnode. This field points to the gnode.'
