- pgno: 339
  md: 'arise in supporting various filesystem features.


    The second approach is for the local filesystem to be cluster aware. Any features
    that are provided by the filesystem must also be made cluster aware. All locks
    taken within the filesystem must be cluster aware and reconfiguration in the event
    of a system crash must recover all cluster state.


    The section VERITAS SANPoint Foundation Suite describes the various components
    of a clustered filesystem in more detail.


    # Cluster Lock Management


    Filesystems, volume managers, and other software require different lock types
    to coordinate access to data structures, as described in Chapter 10. This obviously
    holds in a cluster environment. Consider the case where two processes are trying
    to write to the same file. The process which obtains the read/write lock in exclusive
    mode is the process that gets to write to the file. The other process must wait
    until the first process relinquishes the lock.


    In a clustered environment, these locks, which are still based on primitives provided
    by the underlying operating system, must be enhanced to provide distributed locks,
    such that they can be queried and acquired by any node in the cluster. The infrastructure
    required to perform this service is provided by a distributed or global lock manager
    (GLM).


    The services provided by a GLM go beyond communication among the nodes in the
    cluster to query, acquire, and release locks. The GLM must be resilient to node
    failure. When a node in the cluster fails, the GLM must be able to recover any
    locks that were granted to the failed node.


    # The VERITAS SANPoint Foundation Suite


    SANPoint Foundation Suite is the name given to the VERITAS Cluster Filesystem
    and the various software components that are required to support it. SANPoint
    Foundation Suite HA (High Availability) provides the ability to fail over applications
    one node in the cluster to another in the event of a node failure.


    The following sections build the cluster components described in the previous
    sections by describing more detail the components that are required to build a
    fully clustered filesystem. Each component is described from a clustering perspective
    only. For example, the sections on the VERITAS volume manager and filesystem only
    describe those components that are used to make cluster aware.


    The dependence that each of the components has on the others is described, together
    with information about the hardware platform that is required.


    # CFS Hardware Configuration


    A clustered filesystem environment requires nodes in the cluster to communicate
    with other efficiently and requires each node in the cluster be able to access
    the underlying storage directly.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# 314 UNIX Filesystems—Evolution, Design, and Implementation


    For access to storage, CFS is best suited to a Storage Area Network (SAN). A SAN
    is a network of storage devices that are connected via fibre channels and switches
    to a number of different servers. The main benefit of a SAN is that each of the
    servers can directly see all of the attached storage, as shown in Figure 13.7.
    Distributed filesystems like AFS and DFS require replication to help in the event
    of a server crash. Within a SAN environment, if one of the servers crashes, filesystems
    that the server was managing are accessible from any of the other servers.


    For communication between nodes in the cluster and to provide a heartbeat mechanism,
    CFS requires a private network over which to send messages.


    # CFS Software Components


    In addition to the clustered filesystem itself, there are many software components
    that are required in order to provide a complete clustered filesystem solution.
    The components, are listed here, are described in subsequent sections:


    +   **Clustered Filesystem.** The clustered filesystem is a collection of cluster-aware
    local filesystems working together to provide a unified view of the underlying
    storage. They collectively manage a single filesystem (from a storage perspective)
    and allow filesystem access with full UNIX semantics from any node in the cluster.


    +   **VCS Agents.** There are a number of agents within a CFS environment. Each
    agent manages a specific resource, including starting and stopping the resource
    and parenting any problems that recovery actions may be performed.


    +   **Cluster Server.** The VERITAS Clustered File Server (VCS) provides all of
    the features that are required to manage a cluster. This includes communication
    between nodes in the cluster, configuration, cluster membership, and the framework
    in which to handle failover.


    +   **Clustered Volume Manager.** Because storage is shared between the various
    nodes of the cluster, it is imperative that the view of the storage be identical
    between one node and the next. The VERITAS Clustered Volume Manager (CVM) provides
    this view. When a change is made to the volume configuration, the changes are
    visible on all nodes in the cluster.


    +   **Global Lock Manager (GLM).** The GLM provides a cluster-wide lock manager
    that allows various components of CFS to manage locks across the cluster.


    +   **Global Atomic Broadcast (GAB).** GAB provides the means to bring up and
    shut down the cluster in an orderly fashion. It is used to handle cluster membership,
    allowing nodes to be dynamically added to and removed from the cluster. It also
    provides a reliable messaging service ensuring that messages sent from one node
    to another are received in the order in which they are sent.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '![](img/730b37b12231377a346ba9a27cbd6a68_341_0.png)


    **Low Latency Transport (LLT).** LLT provides a kernel-to-kernel communication
    layer.

    **GAB messaging services are built on top of LLT.

    **Network Time Protocol (NTP).** Each node must have the same time


    The following sections describe these various components in more detail, starting
    with the framework required to build the cluster and moving to more detail on
    how the clustered filesystem itself is implemented.


    # **VERITAS Cluster Server (VCS) and Agents**


    The VERITAS Cluster Server provides the mechanisms for managing a cluster of servers.
    The VCS engine consists of three components:

    **Resources.** Within a cluster there can be a number of different resources to
    manage and monitor, whether hardware such as disks and network cards or software
    as filesystems, databases, and other applications.


    **Attributes.** Agents manage their resources according to a set of *attributes*.
    When these attributes are changed, the agents change their behavior when managing
    the resources.'
  merge: -1
  img_proc: true
- pgno: 342
  md: 'Service groups. A service group is a collection of resources. When a service
    group is online, all of its resources become available.


    In order for the various services of the cluster to function correctly, it is
    vital that the different CFS components are monitored on a regular basis and that
    any irregularities that are found are reported as soon as possible in order for
    corrective action to take.


    To achieve this monitoring, CFS requires a number of different agents. Once started,
    agents obtain configuration information from VCS and then monitor the resources
    they manage and update VCS with any changes. Each agent has three main entry points
    that are called by VCS:


    +   - Online. This function is invoked to start the resource (bring it online).


    +   - Offline. This function is invoked to stop the resource (take it offline).


    +   - Monitor. This function returns the status of the resource.


    VCS can be used to manage the various components of the clustered filesystem framework
    in addition to managing the applications that are running on top of CFS. There
    are a number of agents that are responsible for maintaining the health of a CFS
    cluster. Following are the agents that control CFS:


    CFSMount Clusters pose a problem in traditional UNIX environments because filesystems
    are typically mounted before the network is accessible. Thus, it is not possible
    to add a clustered filesystem to the mount table because the cluster communication
    services must be running before a cluster mount can take place. The CFSMount agent
    is responsible for maintaining a cluster-level mount table that clustered filesystems
    to be automatically mounted once becoming available.


    CFSfsck. When the primary node in a cluster fails, the failover to another node
    had all happen within the kernel. As part of failover, the new primary node needs
    to perform a log replay of the filesystem, which requires the user level fssck
    to run. In each node, a fssck daemon sleeps in the kernel in the case the node
    is new as the primary. In this, the daemon is awakened so that fssck can perform
    log replay.


    CFQLog. Veritas Quick requires the presence of a QuickLog daemon in order to function
    correctly. Agents are responsible for ensuring that that daemon is running in
    environments where QuickLog is running.


    In addition to the CFS agents listed, a number of other agents are also required
    for managing other components of the cluster.


    # Low Latency Transport (LLT)


    Communication between one node in the cluster and the next is achieved through
    use of VERITAS Low Latency Transport Protocol (LLT), a fast, reliable, peer-to-peer
    protocol that provides a reliable sequenced message delivery between any two nodes
    in the cluster. LLT is intended to be used within a single'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# Clustered and Distributed Filesystems 317


    network segment.

    Threads register for LLT ports through which they communicate. LLT also monitors
    connections between nodes by issuing heartbeats at regular intervals.


    # Group Membership and Atomic Broadcast (GAB)


    The GAB service provides cluster membership and reliable messaging. These are
    two essential components in a cluster framework. Messaging is built on top of
    the LLT protocol.


    While LLT provides the physical-level connection of nodes within the cluster,
    GAB provides, through the use of GAB ports, a logical view of the cluster. Cluster
    membership is defined in terms of GAB ports. All components within the cluster
    register with a specific port. For example, CFS registers with port F, CVM registers
    with port V, and so on.


    Through of a global, atomic broadcast, GAB informs all nodes that have registered
    with a port when a node registers or de-registers with that port.


    # The Veritas Global Lock Manager (GLM)


    The Global Lock Manager (GLM) provides cluster-wide reader/writer locks.

    The GLM is built on top of GAB, which in turn uses LLT to communicate between
    the different nodes in the cluster. Note that CFS also communicates directly with
    GAB for non-GLM related messages.


    The GLM provides shared and exclusive locks with the ability to upgrade and downgrade
    a lock as appropriate. GLM implements a master/slave locking mechanism. Each lock
    is defined as having a master node, but there is no single master for all locks.
    As well as reducing contention when managing locks, this all recovers when one
    node dies.


    GLM also provides the means to piggy-back data in response to granting a lock.
    The idea behind piggy-backed data is to improve performance. Consider the case
    where a request is made to obtain a lock for a cached buffer and the buffer is
    valid on another node. A request is made to the GLM to obtain the lock. In addition
    to granting the lock, the buffer cache data may be delivered with the lock grant,
    which avoids the need for the requesting node to perform a disk I/O.


    # The Veritas Clustered Volume Manager (CVM)


    The Veritas volume manager manages disks that may be locally attached to a host
    or be managed through a SAN fabric. Disks are grouped into one or more disk groups.
    Each disk group is one or more logical volumes on which filesystems can be made.
    For example, the following filesystem:


    ```

    # mkfs -F fsvol /dev/mydvg/fsvol lg

    ```


    is created on the logical volume that resides in the mydg group. While providing
    all of the features of the standard volume manager, the Veritas Clustered Volume
    Manager (CVM), has a number of goals:'
  merge: -1
  img_proc: true
- pgno: 344
  md: '+   - Provide uniform naming of all volumes within the cluster. For example,
    the above volume name should be visible at the same path on all nodes within the
    cluster.


    +   - Allow for simultaneous access to all of the shared volumes.


    +   - Allow administration of the volume manager configuration from each node
    in the cluster.


    +   - Ensure that access to each volume is not interrupted in the event that one
    of the nodes in the cluster crashes.


    CVM provides both private disk groups and cluster shareable disk groups, as shown
    in Figure 13.8. The private disk groups are accessible only by a single node in
    the cluster even though they may be physically visible from another node. An example
    of such a disk group may be used for operating system-specific filesystems such
    as the root filesystem,/var,/usr, and so on. Clustered disk groups are used for
    building clustered filesystems or for providing shared access to volumes within
    the cluster.


    In addition to providing volume manager capabilities throughout the cluster, CVM
    also supports the ability to perform off-host processing. Because volumes can
    be accessed through any node within the cluster, applications such as backup,
    decision support, and report generation can be run on separate nodes, thus reducing
    the load that occurs within a single host/disk configuration.


    CVM requires support from the VCS cluster monitoring services to determine which
    nodes are not part of the cluster and for information about nodes that dynamically
    join or leave the cluster. This is particularly important during volume manager
    bootstrap, during which device discovery is performed to locate storage. The first
    node to join the cluster gains the role of master and is responsible for setting
    up any shared disk groups, for creating and reconfiguring volumes and managing
    volume snapshots. If the master node fails, the role is assumed by one of the
    other nodes in the cluster.


    # The Clustered Filesystem (CFS)


    The Veritas Clustered Filesystem uses a master/slave architecture. When a filesystem
    is mounted, the node that issues the mount becomes the primary (master) in CFS
    terms. All other nodes become secondaries (slaves).


    Although nodes in the cluster can perform any operation, only the primary node
    is able to perform transactions—structural changes to the filesystem. If an operation
    such as creating a file or removing a directory is requested of one of the secondary
    nodes, the request must be shipped to where it is performed.


    The following sections describe some of the main changes that were made to VxFS
    to make it cluster aware, as well as the types of issues encountered. Figure 13.9
    provides a high level view of the various components of CFS.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '![](img/730b37b12231377a346ba9a27cbd6a68_345_0.png)


    Figure 13.8 CVM shared and private disk groups.


    # # Mounting CFS Filesystems


    To mount a VxFS filesystem in a shared cluster, the -o cluster option is specified.
    Without this option, the mount is assumed to be local.


    The node that issues the mount call is assigned to the primary. Every time a node
    mounts a cluster filesystem, it broadcasts a message to a predefined G port. If
    another node has already mounted the filesystem it sends configuration data back
    to the node that is just joining the cluster. This includes information such as
    the mount options and the other nodes that have mounted the filesystem.


    One point worthy of mention is that CFS nodes may mount the filesystem with different
    mount options. Thus, one node may mount the filesystem read-only while another
    node may mount the filesystem as read/write.


    # # Handling Vnode Operations in CFS


    Because VxFS employs a primary/secondary model, it must identify operations that
    require a structural change to the filesystem.


    For vnode operations that do not change filesystem structure the processing is
    the same as in a non-CFS filesystem, with the exception that any locks for data
    structures must be accessed through the GLM. For example, the case of a call through
    the VOP_LOOKUP() vnode interface. The goal of this function is to look up a name
    within a specific directory node and return a vnode for the requested name. The
    look-up code needs to obtain a global/read lock on the directory while it searches
    for the requested name. Because this is a read operation, the lock is requested
    in shared mode. Accessing fields of the directory may involve reading one or more
    buffers into the memory. As shown in the next section, these buffers can be obtained
    from the primary or directly from disk.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# 320 UNIX Filesystems—Evolution, Design, and Implementation


    | client | | | client | client network |

    |---|---|---|---||

    | server 1 | server 2 | | server n |

    | VCS | | | VCS |

    | | Global Lock Manager | | |

    | | GAB CFS | GAB CFS | | GAB CFS |

    | | LLT CVM | LLT CVM | | LLT CVM |

    | private network | | | | |

    | SAN | | | | |

    | cluster shared disk group


    Figure 13.9 Components of a CFS cluster.


    For vnode operations that involve any meta-data updates, a transaction will need
    to be performed, which brings the primary node into play if the request is initiated
    from a secondary node. In addition sending the request to the primary, the secondary
    node must be receptive to the fact that the primary node may fail. It must therefore
    have mechanisms to recover from primary failure and resend the request to the
    new primary node. The primary node by contrast must be able to handle the case
    where an operation is in progress and the secondary nodes fail.


    # The CFS Buffer Cache


    VxFS meta-data is read from and written through the VxFS buffer cache, which provides
    simple interfaces to the traditional UNIX buffer cache implementations. On the
    primary, the buffer cache is accessed in the local case, with the exception that
    global locks are used to control access to buffer caches. On secondary nodes however,
    an additional layer is executed to manage cache consistency by communicating with
    the primary node when accessing buffers. If a secondary node wishes to access
    a buffer and it is determined that the primary has not cached the data, the data
    can be read directly from disk. If the data has previously been accessed on the
    primary node, a message is sent to the primary to request the data.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# Clustered and Distributed Filesystems 321


    The determination of whether the primary holds the buffer through use of global
    locks. When the secondary node wishes to access a buffer, it makes a call to obtain
    a global lock for the buffer. When the lock is granted, the buffer contents will
    either be passed back as piggy-back data or be read from disk.


    # The CFS DNLC and Inode Cache


    The VxFS inode cache works in a similar manner to the buffer cache in that access
    to individual nodes is achieved through the use of global locks.

    Unlike the buffer cache, though, when looking up an inode, a secondary node always
    holds the inode from the primary. Also recall that the secondary is unable to
    make any modifications to inodes so requests to make changes, even timestamp updates,
    must be passed to the primary for processing.

    VxFS uses its own DNLC. As with other caches, the DNLC is also clusterized.


    # CFS Reconfiguration


    When a node in the cluster fails, CFS starts the process of reconfiguration. There
    are two types of reconfiguration, based on whether the primary or a secondary
    dies:


    **Secondary failure.** If a secondary node crashes there is little to do in CFS
    other than call the GLM to perform lock recovery.

    **Primary failure.** A primary failure involves a considerable amount of work.
    The first task is to elect another node in the cluster to become the primary.
    The new primary must then perform the following tasks:


    +   1. Wake up the fs daemon in order to perform log replay.

    2. Call the GLM to perform lock recovery.

    3. Remount the filesystem as the primary.

    4. Send a broadcast message to the other nodes in the cluster indicating that
    a new primary has been selected, reconfiguration is complete, and access to the
    filesystem can now continue.


    Of course, this is an oversimplification of the amount of work that must be performed
    but at least highlights the activities that are performed. Note that each mounted
    filesystem can have a different node as its primary, so loss of one node will
    only affect systems that have their primary on that node.


    # CFS Cache Coherency


    Processes can access files on any nodes within the cluster, either through `read()`
    and `write()` system calls or memory mappings. If multiple processes on multiple
    nodes are reading the file, they share the file’s read/write lock (in this case
    another global lock). Pages can be cached throughout the cluster.

    Cache coherency occurs at the file level only. When a processes requests a read/write
    lock in exclusive mode in order to write to a file, all cached pages'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'must be destroyed before the lock can be granted. After the lock is relinquished
    and another process obtains the lock in shared mode, pages may be cached again.


    # VxFS Command Coordination


    Because VxFS commands can be invoked from any node in the cluster, CFS must be
    careful to avoid accidental corruption. For example, if a filesystem is mounted
    in the cluster, CFS prevents the user from invoking a nfs or fsck on the shared
    volume. Note that non-VxFS commands as dd are not cluster aware and can cause
    corruption if run on a disk or device volume.


    # Application Environments for CFS


    Many applications are tailored for a single host or for a client/server model
    such as are used in NFS environment, there are a number of application environments
    starting to appear for clustered filesystems, utilizing storage play an important
    role. Some of these environments are:


    **Serial data sharing.** There are number of larger environments, as video post
    production, in which data is shared serially between different applications. The
    first application operates on the data, followed by the second application, and
    on. Sharing large amounts of data in such an environment is essential. Having
    a single mounted filesystem eases administration of the data.


    **Web farms.** In many Web-based environments, data is replicated between different
    servers, all of which are accessible through some type of load-balancing software.
    Maintaining these replicas is both cumbersome and error prone. In environments
    where data is updated relatively frequently, the multiple copies of data are typically
    out of sync.


    By using CFS, the data can be shared among these multiple servers. Furthermore,
    the cluster provides better availability in if one node crashes, the data is accessible
    through other nodes.


    **Off-host backup.** Many computing environments are moving towards a 2x7 model,
    and thus the opportunity to take backups when the system is diminishes. By running
    the backup on one of the nodes in the cluster or outside of the cluster, the performance
    impact on the servers within the cluster can be reduced. In the case where the
    backup application is used outside of the cluster, mapping services allows an
    application to map files down to the block level that the blocks can be read directly
    from the disk through a frozen image.


    **Oracle RAC (Real Application Cluster).** The Oracle RAC technology, formerly
    Oracle Parallel Server (OPS), is ideally suited to the VERITAS CFS solution. All
    of the filesystem features that enable databases on a single host equally apply
    to the cluster. This includes providing raw I/O access for multiple readers and
    writers in addition to features such as filesystem resize that allow the database
    to be extended.'
  merge: -1
  img_proc: true
- pgno: 349
  md: 'These are only a few of the application environments that can benefit from
    clustered filesystems. As clustered filesystems become more prevalent, new applications
    are starting to appear that can make use of the multiple nodes in the cluster
    to achieve higher scalability than can be achieved from some SMP-based environments.


    # Other Clustered Filesystems


    A number of different clustered filesystems have made an appearance over the last
    several years in addition to the VERITAS SANPoint Foundation Suite. The following
    sections highlight some of these filesystems.


    # The SGI Clustered Filesystem (CXFS)


    Silicon Graphics Incorporated (SGI) provides a clustered filesystem, CXFS, which
    allows a number of servers to present a clustered filesystem on shared access
    to SAN-based storage. CXFS is built on top of the SGI XFS filesystem and the XVM
    volume manager.


    CXFS provides meta-data servers through which all meta-data operations must be
    processed. For data I/O, clients which can access the storage to the data directly.
    CXFS uses a token-based scheme to control access to various parts of the file.
    Tokens also allow the client to cache various parts of the file. If a client needs
    to change any part of the file, the meta-data server must be informed, which then
    performs the operation.


    # The Linux/Sistina Global Filesystem


    The Global Filesystem (GFS) was a project initiated at the University of Minnesota
    in 1995. It was initially targeted for postprocessing large scientific data sets
    over fibre channel attached storage.


    Unable to better integrate GFS into the SGI IRIX kernel on which it was originally
    developed, work began on porting GFS to Linux.


    At the heart of GFS is a journaling-based filesystem. GFS is a fully symmetric
    clustered filesystem—any node in the cluster can perform transactions. Each node
    in the cluster has its own intent log. If a node crashes, the log is replayed
    by one of the other nodes in the cluster.


    # Sun Cluster


    Sun offers a clustering solution, including a layered clustered filesystem, which
    can support up to 8 nodes. Central to Sun Cluster is the Resource Group Manager
    that manages a set of resources (interdependent applications).


    The Global Filesystem is a layered filesystem that can run over most local filesystems.
    Two new vnode operations were introduced to aid performance of the global filesystem.
    The global filesystem provides an NFS-like server that communicates through a
    secondary server that mirrors the primary. When an'
  merge: -1
  img_proc: true
- pgno: 350
  md: 'update to the primary occurs, the operation is checkpointed on the secondary.
    If the primary fails, any operations that weren''t completed are rolled back.


    Unlike some of the clustered filesystem solutions described here, all I/O goes
    through a single server.


    # Compaq/HP True6 Cluster


    Digital, now part of Compaq, has been producing clusters for many years. Compaq
    provides a clustered stack TruCluster Server that supports up to 8 nodes.


    Unlike the VERITAS clustered filesystem in which the local and clustering components
    of the filesystem are within the same code base, the Compaq solution provides
    a layered clustered filesystem that can sit on top of any underlying local filesystem.
    Although files can be read from any node in the cluster, files can be written
    from any node only if the local filesystem is AdvFS (Advanced Filesystem).


    # Summary


    Throughout the history of UNIX, there have been numerous attempts to share files
    between one computer and the next. Early machines used simple UNIX commands with
    uu being commonplace.


    As local area networks started to appear and computers became much more widespread,
    a number of distributed filesystems started to appear. With its goals of simplicity
    and portability, NFS became the de facto standard for sharing filesystems within
    a UNIX system.


    With the advent of shared data storage between multiple machines, the ability
    to provide a uniform view of the storage was needed for the clustered filesystem
    and volume management with a number of commercial and open source clustered filesystems
    appearing over the last several years.


    Because both solutions address different problems, there is no great conflict
    between distributed and clustered filesystem. On the contrary, a clustered filesystem
    can be easily exported for use by NFS clients.


    For further information on NFS, Brent Callaghan''s book Illustrated [CALL00] provides
    a detailed account of the various NFS protocols and infrastructure. For further
    information on the concepts that are applicable to clustered filesystems, Dilip
    Ranade''s book Shared Data Clusters [RANA02] should be consulted.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# Developing a Filesystem for the Linux Kernel


    Although there have been many programmatic examples throughout the book, without
    seeing how a filesystem works in practice, it is still difficult to appreciate
    the flow through the kernel in response to the various file- and filesystem-related
    system calls. It is also difficult to see how the filesystem interfaces with the
    rest of the kernel and how it manages its own structures internally.


    This chapter provides a very simple, but functional filesystem for Linux called
    uufs. The filesystem is not complete by any means. It provides enough interfaces
    and features to allow creation of a hierarchical tree structure, creation of regular
    files, and reading from and writing to files. There are several flaws in the filesystem
    and exercises at a simple `fsdb` command of the chapter provide the means for
    readers to experiment, fix the existing flaws, and add new functionality.


    The chapter gives the reader all of the tools needed to experiment with a real
    filesystem. This includes instructions on how to download and compile the Linux
    kernel source and how to compile and load the filesystem module. There is also
    detailed information on how to debug and analyze the flow through the kernel and
    the filesystem through use of `printk()` statements and the kernel gdb debuggers.
    The filesystem layout is also small enough that a new filesystem can be made on
    a floppy disk to avoid less-experienced Linux users having to partition or repartition
    disks.'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'The source code, which is included in full later in the chapter, has been compiled
    and on the standard 2.4.18 kernel. Unfortunately, it does not take long before
    new kernels appear making today''s kernels redundant. To avoid this problem, the
    following Web site:


    www.wiley.com/combooks/fate


    uxfs source code for up-to-date Linux kernels. It also contains instructions on
    how to build the uxfs filesystem for standard Linux distributions. This provides
    readers who do not wish to download and compile the kernel source opportunity
    to easily compile and load the filesystem and experiment. To follow the latter
    route, the time taken to download the source code, compile, and load the module
    should not be greater than 5 to 10 minutes.


    # Designing the New Filesystem


    The goal behind designing this filesystem was to achieve simplicity. When looking
    at some of the smaller Linux filesystems, novices can still spend considerable
    considerable of time trying to understand how they work. With the uxfs filesystem,
    size is key. Only the absolutely essential pieces of code are in place. It supports
    a hierarchical namespace and the ability to create, read to, and write from files.
    Some operations, such as rename and creation of symlinks, have been left out unintentionally
    both to reduce the amount of code and give to the reader a number of exercises
    to follow.


    Anyone who studies the filesystem in any amount of detail will notice a large
    number of holes despite the fact that the filesystem is fully functional. The
    layout of the filesystem is shown in Figure 14.1, and the major design points
    are detailed as follows:


    +   - The filesystem has 512-byte blocks. This is defined by the UX_BSIZE constant
    in the ux_fs.h header file.


    +   - There is a fixed number of blocks in the filesystem. Apart from space for
    the superblock and inodes, there are 470 data blocks. This is defined by the UX_MAXFILES
    constant.


    +   - There are 32 inodes (UX_MAXFILES). Leaving inodes 0 and 1 (which are reserved),
    and using inode 2 for the root directory and inode 3 for the lost+find directory,
    there are 28 inodes for user files and directories.


    +   - The superblock is stored in block 0. It occupies a single block. Inside
    the superblock are arrays, for inodes and one for data blocks that record whether
    a particular inode or data block is in use. This makes the filesystem source very
    easy to read because there is no manipulation of bitmaps. The superblock also
    contain fields that record the number of inodes and data blocks.'
  merge: -1
  img_proc: true
