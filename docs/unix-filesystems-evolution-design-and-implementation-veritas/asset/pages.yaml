- pgno: 73
  md: 'There are two types of locks that can be used to coordinate access to files,
    namely mandatory and advisory locks. With advisory locking, it is possible for
    cooperating processes to safely access a file in a controlled manner. Mandatory
    locking is somewhat of a hack and will be described later. The majority of this
    section will concentrate on advisory locking, sometimes called record locking.


    # Advisory Locking


    There are three functions which can be used for advisory locking. These are lockf(),
    flock(), and fcntl(). The flock() function defined below:


    ```

    /usr/ucb/cc [ flag ... ] file

    #include <sys/file.h>

    ```


    ```

    int lockf(fd, operation);

    int fd, operation;

    ```


    was introduced in BSD UNIX and is not supported under the Single UNIX Specification
    standard. It sets an advisory lock on the whole file. The lock type, specified
    by the operation argument, may be exclusive (LOCK_EX) or shared (LOCK_SH). By
    ORing operation with LOCK_NB, if the file is already locked, EAGAIN will be returned.
    The LOCK_UN operation removes the lock.


    The lockf() function, which is typically implemented as a call to fcntl(), can
    be invoked to apply or remove an advisory lock on a segment of a file as follows:


    ```

    #include <sys/file.h>

    ```


    ```

    int lockf(int intild, int function, off_t size);

    ```


    To use lockf(), the file must have been opened with one of O_WRONLY or O_RDWR
    flags. The size argument specifies the number of bytes to be locked, starting
    from the current file pointer. Thus, a call to seek() should be made prior to
    calling lockf(). If the value of size is 0 the file is locked from the current
    offset to the end of the file.


    The function can be one of the following:


    +   F_LOCK. This command sets an exclusive lock on the file. If the file is already
    locked, the process will block until the previous lock is relinquished.

    F_LOCK. This performs the same function as the F_LOCK command but will not block—if
    the file is already locked, EAGAIN is returned.

    F_UNLOCK. This command unlocks a segment of the file.

    F_TEST. This command is used to test whether a lock exists for the specified segment.
    If there is no lock for the segment, 0 is returned, otherwise -1 is returned,
    and errno is set to EACCES.'
