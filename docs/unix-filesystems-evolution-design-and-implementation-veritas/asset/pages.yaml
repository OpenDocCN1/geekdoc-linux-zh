    # Scanning for a Uufs Filesystem


    The first task to perform when mounting the filesystem is to read the superblock
    of this disk. This involves a call to sb_read() to read block 0 of the device
    on which the superblock resides. The sb_read() function is a wrapper around bread()
    that extracts the data from the s_dev field of the super_block structure. Thus
    the following calls are equivalent:


    ```

    bh = sb_read(sb, block);

    bh = sb_read(sb->s_dev, block)->sb_blocksize;

    ```


    On return from sb_read(), a buffer_head structure will reference the data from
    the device. Note that each call to sb_read() must be followed by some stage by
    a call to brelease to release the buffer. An attempt to retrieve the same block
    from disk by calling brelease will cause the filesystem to block. The data read
    from disk can be referenced by accessing the b_data field. Because the superblock
    is located at offset 0 within block 0, the ux_superblock structure can be referenced
    as shown in line 125:


    ```

    usb = (struct uxfs_superblock*)bh->b_data;

    ```


    The first task is to verify that this is a uufs filesystem. Verification is achieved
    by checking for presence of the uufs magic number. Assuming that this is detected
    and the superblock is not marked UX_FSDIRTY, the filesystem can be mounted. Because
    all the index and data information is stored in the uxfs superblock, it is imperative
    to keep the superblock in memory at all times. A ux_fs structure is allocated
    to keep hold of the buffer_head used to read the superblock. This makes it easy
    to access the ux_superblock structure from either the Linux super_block or a Linux
    node. This is shown in Figure 14.4. Note that the buffer is not released until
    the filesystem is unmounted.


    Access to the ux_fs structure can be achieved through either the Linux super_block
    or indirectly from the Linux node structure as follows:


    ```

    struct super_block *sb = inode->i_sb;

    struct ux_fs       *fs = (struct ux_fs*)sb->s_private;

    struct ux_superblock *usb = fs->u_sb;

    ```


    Because all expected uufs functions are passed through either the super_block
    or an inode as an argument, it is always possible to get access to the uufs superblock.'
