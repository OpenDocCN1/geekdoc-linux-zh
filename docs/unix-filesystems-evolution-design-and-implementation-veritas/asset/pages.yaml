    the following:


    +   S_IFIFO. FIFO special file (named pipe).

    S_IFCHR. Character special file.

    S_IFDIR. Directory file.

    S_IFBLK. Block special file.

    S_IFREG. Regular file.


    The file access permissions are also passed in the mode argument. The permissions
    are constructed from a bitwise OR for which the values are the same as for chmod()
    system call as outlined in the section Changing File Permissions earlier in this
