    # # Suggested Exercises


    Because the filesystem presents only a basic set of operations, there are several
    things that can be added to increase functionality. There are also several bugs
    that exist in the filesystem as it stands that could be fixed. This section contains
    numerous different exercises that readers can follow either to experiment with
    the filesystem as is or to add additional capabilities.

    Simply playing with the filesystem, compiling kernels, and using one of the kernel
    level debuggers is a significant amount of work in itself. Don''t underestimate
    the amount of time that it can take to achieve these tasks. However, the amount
    of Linux support information on the World Web is extremely good, so it is reasonably
    easy to find answers to most Linux-related questions.


    # # Beginning to Intermediate Exercises


    The exercises in this section can be made to the existing filesystem without changing
    the underlying disk layout. Some of these exercises involve careful analysis and
    some level of testing.


    +   1. What is significant about the uxfs magic number?

    2. As a simple way of analyzing the filesystem when running, the silent argument
    to ux_read_super() can be used to enable debugging. Add some calls to printk()
    to the filesystem, which are activated when the silent option is specified. The
    first step is to determine what conditions the silent flag is set. The ux_read_super()
    function provides example of how it is used.

    3. There are several functions that have not been implemented, as symbolic links.
    Look at various operations vectors and determine which file operations will not
    work. For each of these functions, locate the place in the kernel where the functions
    would be called from.

    4. For the majority of the operations on the filesystem, various timestamps are
    not updated. By compiling uxfs with one of the other Linux filesystems—for example
    ext2—identify those areas where the timestamp updates are missing and implement
    changes to the filesystem to provide these updates.

    5. When the filesystem is mounted, the superblock s_mod should be set to UXFSDIRTY
    and the superblock should be written back to disk. There is already code within
    ux_read_super() to handle and reject a dirty filesystem. Add this additional feature,
    but be warned that there is a bug in'
