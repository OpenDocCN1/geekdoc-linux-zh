- pgno: 289
  md: '# Pseudo Filesystems 263


    The goal was to facilitate sharing of a set of files without duplication to allow
    individuals to modify files where necessary. Thus, the TPS filesystem is mounted
    on top of another filesystem which has been read-only.


    It is possible to modify files in the top layer only. To achieve this, a copy
    on write mechanism is employed such that files from the lower layer are first
    copied to the user''s private region before the modification takes place.


    There may be several layers of filesystems for the view from the top layer is
    a union of all layers underneath.


    # Named STREAMS


    The STREAMS mechanism is a stackable layer of modules that are typically used
    for development of communication stacks. For example, TCP/IP and UDP/IP can be
    implemented with a single IP STREAMS module on top of which resides a TCP module
    and a UDP module.


    The namefs filesystem, first introduced in SVR4, provides a means by which a file
    can be associated with an open STREAM. This is achieved by calling fatch(), in
    turn calls the mount() system call to name a namefs filesystem over the specified
    file. An association is then made between the mount point and the STREAM head
    that any read() and write() operations will be directed towards the STREAM.


    [PATE96] provides an example of how filesystems are used.


    # The FIFO Filesystem


    In SVR4, pipes are handled by a loopback STREAMS driver together with the fifos
    filesystem. When a call is made into the filesystem to look up a file, if the
    file is a character or special file, or if the file is a named pipe, a call is
    made to specv() to return a namefs node in the file. This was described in the
    section The Filesystem earlier in the chapter.


    In case of named pipes a call is made from specfs to fivovp() to return a fifos
    node instead. This initializes the v_op field of the vnode to fifo_nodeops, which
    handles all of the file-based operations invoked by the caller of open().


    As specs consolidating all access to device files, fifos performs the function
    with named pipes.


    # The Descriptor Filesystem


    The descriptor filesystem, typically mounted on /dev/fd, is a convenient way to
    access the open files of a process.


    Following a call to open(), which returns file descriptor n, the following two
    systems are identical:


    ```

    fd = open("/dev/fd/n",mode);

    fd = dup(n);

    ```'
