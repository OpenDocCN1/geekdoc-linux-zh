- pgno: 138
  md: '# The Inode Cache


    Each file is represented on disk by an inode. When a file is opened, the inode
    must be retrieved from disk. Operations as the stat() system call retrieve much
    of the information they require from the inode structure.


    The inode must remain in memory for the duration of the open and is typically
    written back to disk if any operations requires changes to the inode structure.
    For example, writing 512 bytes of data at the end of the file that has an existing
    size of 512 bytes and therefore one block allocated (referenced by i_addr[0]).
    This will involve changing i_size to 1024 bytes, allocating a new block to the
    file, and setting i_addr[1] to point to this newly allocated block. These changes
    will be written back to disk.


    After the file is closed and there are no further processes holding the file open,
    the in-core inode can be freed.


    If the inode were always free, however, it would need to be read from disk each
