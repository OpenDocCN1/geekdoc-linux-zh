  md: "# THE FILE Structure\n\nWhen system calls as open() and dup return a file descriptor\
    \ through which the file can be accessed, stdio library operates on a FILE structure,\
    \ or file stream as it is called. This is basically a character buffer that holds\
    \ enough information to record the current and write file pointers and other ancillary\
    \ information. On Linux, the IO_FILE structure from which the FILE structure defined\
    \ is shown below. Note that not all of the structure is shown here.\n\n```\nstruct\
    \ IO_FILE {\n    char    *IO_read_ptr;   /* Current pointer */\n    char    *IO_read_end;\
    \   /* End of get area. */\n    char    *IO_read_base; /* Start of putback and\
    \ get area. */\n    char    *IO_write_base; /* Start of put area. */\n    char\
    \    *IO_write_ptr; /* Current put pointer. */\n    char    *IO_write_end; /*\
    \ End of put area. */\n    char    *IO_buf_base;   /* Start of reserve area. */\n\
    \    char    *IO_buf_end;    /* End of reserve area. */\n    int     fileno;\n\
    \    int     blksize;\n};\n```\n\n```\ntypedef struct _IO_FILE FILE;\n```\n\n\
    Each of the structure fields will be analyzed in more detail throughout the chapter.\
