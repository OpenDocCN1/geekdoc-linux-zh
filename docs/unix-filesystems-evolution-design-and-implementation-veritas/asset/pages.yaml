    # Data and Attribute Caching


    There are a number of flags that can be passed to open() that control various
    aspects of the I/O. Also, some filesystems support additional but non standard
    methods for improving I/O performance.


    Firstly, there are three options, supported by the Single UNIX Specification,
    that can be passed to open() to have an impact on subsequent I/O operations. When
    a write takes place, there are two items of data that must be written to disk,
    namely the file data and the file inode. An inode is an object stored on disk
    that describes the file, including the properties described by calling stat()
    together with a block map of all blocks associated with the file.


    The three options that are supported from a standards standards perspective are:'
