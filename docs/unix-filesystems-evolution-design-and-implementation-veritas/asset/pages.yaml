    The chmod command is implemented on top of the chmod() system call. There are
    two calls, one that operates on a pathname and one that operates on a file descriptor
    as the following declarations:


    ```

    #include <sys/types.h>

    #include <sys/stat.h>


    int chmod(const char *path, mode_t mode);


    int fchmod(int fedes, mode_t mode);

    ```


    The mode argument is a bitwise OR of the flags shown in Table 2.1. Some of the
    flags can be combined as shown below:


    +   - S_IRWXU. This is the bitwise OR of S_IRUSG, S_IWUSG and S_IXUSR

    - S_IRWXG. This is the bitwise OR of S_IRGRP, S_IWGRP and S_IXGRP

    - S_IRWXOTH. This is the bitwise OR of S_IROTH, S_IOWOTH and S_IXOTH


    One can see from the preceding information that the chmod utility is largely a
    string parsing command which collects all the information required and then makes
    a call to chmod ().


    # Changing File Ownership


    When a file is created, the user and group IDs are set to those of the caller.
    Occasionally it is useful to change ownership of a file or the group in which
    the file resides. The root user can change the ownership of a file although any
    user can change the file''s group ID to another group in which the user resides.


    There are three calls that can be used to change the file''s user and group as
    shown below:


    ```

    #include <sys/types.h>

    #include <unistd.h>


    int chown(const char *path, uid_t owner, gid_t group);

    int fchown(int fd, uid_t owner, gid_t group);

    int lchown(const char *path, uid_t owner, gid_t group);

    ```


    The difference between chown() and lchown() is that the lchown() system call operates
    on the symbolic link specified rather than the file to which it points.'
