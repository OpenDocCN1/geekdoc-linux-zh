    In this case, the file has a direct extent (de) starting at address 2048. This
    extent is 1024 blocks in size (des). The reserve field in the inode is set to
    1024 blocks. If this file were to be truncated, the extent in the node would be
    changed but the file would retain the number of blocks stored in the reservation.


    Following the previous example, if the extent were set to 512 blocks and the setext
    call made as follows:


    ```

    # myfile

    # setext -e 512 -r 1024 -f chgsize myfile

    ```


    then the minimum size of extent added to myfile will be 512 blocks. Where possible,
    the file system will attempt to allocate contiguous extents. If successful, the
    extents will be coalesced into a single extent. Thus, in the above example, even
    though one would expect to see two extents of 512 blocks allocated to the file,
    a single extent is likely to be seen from fsdb.


    There are other attributes that can be set on a file as below:


    +   - f align. With this attribute, extents allocated to a file should be aligned
    on extent boundaries where the extent size is specified using the -e option.

    - f chgsize. This आयु is used to change the size of the file.

    - f cont. This attribute indicates that any reservation should be allocated contiguously.

    - f noreserve. This option limits the size of the file. Once the space is preallocated
    to the file used, the file cannot be further extended.

    - f trim. If a file has been given a specific reservation and the file size is
    smaller than the reservation, once the file is closed, the reservation is trimmed
    to the size of the file.'
