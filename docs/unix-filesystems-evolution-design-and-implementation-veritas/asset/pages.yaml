    USG. See USL.


    USL. The group that started the commercial side of UNIX at Bell Labs went through
    several details naming the UNIX Systems Groups (UGS) and UNIX System Laboratories
    (USL). This group produced the versions of UNIX up to SVR4. After being acquired
    by Novell, they went on produce the UnixWare operating system.


    vector reads/writes. Each process issues a read() or write() call, a single I/O
    can be performed. The readv() and writev() system allow multiple I/Os to be performed
    in a single system call. In addition to cutting down on system overhead, it may
    allow for two or more of the I/Os to coalesce.


    VFS. The Virtual File System (VFS) architecture was the name given to the filesystem
    architecture introduced by Sunystems for supporting multiple filesystem types
    including their networked filesystem (NFS). Linux has used the term VFS to refer
    to their filesystem architecture.


    vfstab / fstab. These files differ from the UNIX variants, which the filesystems
    are to be mounted when system boot.


    VFS-ops. The Sun VFS/vnode interface introduced a set of operations that were
    applicable to filesystems. Each filesystem must export its VFS operations that
    are called by the filesystem-independent layer of the kernel.


    vnode. Older UNIX systems used an inode for representing both on-disk and in memory.
    The memory-based inode was often referred to as the in-core inode. With the introduction
    of the Sun VFS architecture, the in-core inode was replaced with a vnode structure.
    Albeit a small change, this lead to less confusion all-round.'
  merge: -1
  img_proc: true
- pgno: 450
  md: '# 424 UNIX Filesystems—Evolution, Design, and Implementation


    inode ops. Whenever the kernel performs a lookup operation to retrieve a file
    in the filesystem, the vnode is instantiated with a vector of operations that
    is applicable to the file type. These operations, such as read and write, allow
    the kernel to call it in the filesystem.


    VTOC. The Volume Table Of Contents (VTOC) is a label written at the start of the
    disk to describe the different slices on the disk, where they start, and how many
    sectors they hold.


    VxFS. A journaling filesystem from VERITAS, VxFS is the most successful of the
    commercially available UNIX filesystems.


    VxVM. The VERITAS logical volume manager, VxVM, has been ported to almost all
    versions of UNIX and Windows NT.


    XDR. The eXternal Data Representation is a standard that describes how to represent
    data types and structures in a machine-independent manner. XDR is used when sending
    NFS requests and responses over the wire from one machine to another.


    Xenix. The version of UNIX developed by both Microsoft and the Santa Cruz Operation
    (SCO). Xenix was used for Intel-based machines.


    X/Open. The X/Open company was established in the U.K. to standardize programmatic
    interfaces across multiple operating systems. The resulting XPG (X/Open Portability
    Guide) was originally based on Posix.1.'
