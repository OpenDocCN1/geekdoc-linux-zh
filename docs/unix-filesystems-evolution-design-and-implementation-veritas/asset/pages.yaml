- pgno: 1
  md: '# The

    WILEY

    advantage


    Dear Valued Customer,


    We realize you''re a busy professional with deadlines to hit. Whether your goal
    is to learn a new technology or solve a critical problem, we want to be there
    to lend you a hand. Our primary objective is to provide you with the insight and
    knowledge you need to stay at the highly competitive and ever-changing technology
    industry.


    Wiley Publishing, Inc., offers books on a wide variety of technical categories,
    including security, data warehousing, software development tools, and networking—everything
    you need to reach your peak. Regardless of your level of expertise, the Wiley
    family of books has you covered.


    +   * For Dummies – The fun and easy way to learn

    * The Weekend Crash Course –The fastest way to learn a new tool or technology

    * Visual – For those who prefer to learn a new topic visually

    * The Bible – The 100% comprehensive tutorial and reference

    * The Wiley Professional list – Practical and reliable resources for IT professionals


    The book you hold now, UNIX Filesystems: Evolution, Design, and Implementation,
    is the first book to cover filesystems from all of UNIX and Linux. The author
    gives details about the file I/O aspects of UNIX programming, describes the various
    UNIX and Linux operating system internals, and gives case studies of some of the
    most popular filesystems including UFS, ext2, and the VERITAS filesystem, VxFS.
    The book contains numerous examples including a fully working Linux filesystem
    that you can experiment with.


    Our commitment to you does not end at the last page of this book. We''d want to
    open a dialog with you to see what other solutions we can provide. Feel free to
    visit us at www.wiley.com/combooks to review our complete title list and explore
    the other resources we offer. If you have a comment, suggestion, or any other
    inquiry, please locate the "contact us” link at www.wiley.com.


    Thank you for your support and we look forward to hearing from you and serving
    your needs in the future.


    Sincerely,


    ![](img/730b37b12231377a346ba9a27cbd6a68_1_0.png)


    Richard K. Swadle

    Vice President & Executive Group Publisher

    Wiley Technology Publishing


