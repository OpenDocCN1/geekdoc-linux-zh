- pgno: 183
  md: '# SVR4-Based Filesystem Architectures 157


    regular files were accessed.


    For reading from and writing to regular files, ino_rw() calls rwip(), which performs
    most of the work by calling bmap() to map an offset on a disk and then calling
    the buffer cache to actually read the data. The bmap() function returns two blocks,
    the requested block, which was read synchronously, and the next block in the file
    for which an asynchronous read was initiated. This allowed for read ahead in order
    to improve performance.


    The bmap() function is called directly from rwip(), the separation of filesystem-specific
    code was starting to appear, paving the way for what would eventually be an architecture
    that would support multiple filesystem types. The BSD buffer cache is not significantly
    different from other buffer cache implementations described elsewhere in the book
    and does not warrant further description here.


    # Filename Caching in 4.3BSD


    Two caching mechanisms were introduced in BSD UNIX. Firstly, namei() was enhanced
    to allow for faster scans of a directory when the process was scanning the directory
    sequentially. This could prove to have a significant effect given the right benchmark;
    however, it proved to be useful in a small number of practical cases.


    More significant was the introduction of a new cache that held recent name-to-inode
    lookups. This cache, which adopted in SVR4 Name Lookup Cache (DNLC), contained
    entries that mapped a file name and device pointer to an in-core inode. The BSD
    name cache used a softlock mechanism where inodes entries in the cache did not
    require the inode count to be fetched. This avoided limiting the size of the cache
    to the inode table. To handle the case where inodes were not in the inode cache
    but were still held in the name cache and were unlinked and reused, inodes were
    assigned a capability field, that field, incremented each time the inode was reused.
    If a cache hit to find the previous instantiation of the inode, the capabilities
    would not match the name cache entry would be removed.


    Both caches were hugely successful, resulting in the name cache being implemented
    on just every UNIX implementation that followed. Documented in [KARE86], on a
    12-hour period for a range of machines between 500,000 and 1,000,000 name lookups,
    the combined cache hit of the two caches was 85 percent.


