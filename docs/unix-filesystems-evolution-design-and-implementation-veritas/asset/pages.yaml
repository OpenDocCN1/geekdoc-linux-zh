- pgno: 43
  md: '![](img/730b37b12231377a346ba9a27cbd6a68_43_0.png)


    # # File-Based Concepts


    To gain a full picture of the internal operation of filesystems, it is necessary
    to understand what the user sees, why things are presented the way they are, and
    what the main concepts are.


    This chapter provides an introduction to basic file concepts. Users experienced
    in UNIX may wish to skip this chapter. New users to UNIX and those starting to
    program in the UNIX environment will find these concepts useful. A basic implementation
    of the `ls` program helps to reinforce the material presented and provides an
    introduction to file-related libraries and system calls, a topic that will be
    expanded upon in the next chapter.


    One peculiarity that UNIX introduced was the notion that everything in the UNIX
    namespace (file tree) is visible as a file and that the same operations can be
    applied to all file types. This means one can open and read a directory in the
    same way in which a file can be opened and read. Of course, this doesn''t always
    have the desired effect. For example, running the UNIX command `cat` on a directory
    will likely produce a screen full of unreadable characters. However, these and
    other simple concepts are one of the great strengths of UNIX. The following sections
    provide introductory material that describe file-based concepts and start to paint
    a picture of how these components fit together.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# UNIX File Types


    The two most common file types are regular files and directories. Regular files
    are by far the most common type of files in a UNIX system, with program source,
    documents, executable programs, and scripts all being stored as regular files.
    One could argue that executable files are a special type of regular file but their
    handling by the filesystem is the same that is, the file contains a stream of
    bytes that the filesystem needs to interpret.


    Directories are different however. Although they also contain a stream of bytes,
    filesystems interpret these bytes in a manner that allows users to see which files
    are present in the directory and how they are linked together from a hierarchical
    structure.


    There are other file types which must be considered by programmers and administrators.
    They are outlined and described in more detail throughout the chapter:


    +   **Regular files.** As mentioned above, regular files hold data that is not
    interpreted by the filesystem, as program source and binaries, documents and scripts.


    +   **Directories.** Directories are used to provide structure within a filesystem.
    Directories can index files of any type including other directories.


    +   **Symbolic links.** A symbolic link, also called a symlink, is a means by
    which one file can refer to another file use of a different name. Symbolic links
    can cross filesystem boundaries. Removing a symbolic link has no impact on the
    file it references.


    +   **Hard links.** Whereas a symbolic name is simply a mapping between one file
    name and with no impact on the referenced file, a hard link actually refers to
    the physical storage as the file to which it references. Thus by creating a hard
    link, the file''s link count is incremented. When the hard link reaches zero,
    the file is removed. Hard links cannot cross filesystem boundaries.


    +   **Named pipes.** A named pipe is a bi-directional IPC (*Inter Process Communication*)
    mechanism that allows unrelated processes to communicate. This differs from UNIX
    pipes that can only be accessed by related processes.


    +   **Special files.** A special file is one that refers to a device such as a
    disk or tape. To access a device, the caller would open the special file and access
    it just like any other file.


    +   **Xenix files.** Semaphores and shared memory segments in the Xenix operating
    system could be managed through the UNIX namespace. A special file of zero length
    could be used to represent a semaphore or a shared memory segment: There were
    a host of Xenix specific functions'
  merge: -1
  img_proc: true
