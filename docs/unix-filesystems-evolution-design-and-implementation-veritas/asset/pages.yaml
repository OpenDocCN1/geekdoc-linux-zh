  md: '# UNIX Filesystems—Evolution, Design, and Implementation


    The system() specifies all of the system calls available, including the number
    of arguments.


    By executing a hardware trap instruction, control is passed from user space to
    the kernel and the trap() function runs to determine the system call to be processed.
    The C library function linked with the user program stores a unique value on the
    user stack corresponding to the system call. The kernel uses this value to locate
    the entry in system() to understand how many arguments are being passed.


    For a read() or write() system call, the arguments are accessible as follows:


    ```

    fd = u.u_ar0[0]

    u_base = u.u_arg[0]

    u_count = u.u_arg[1]

    ```


    This is a little strange because the first and subsequent arguments are accessed
    in a different manner. This is partly due to the hardware on which 5th Edition
    UNIX was based and partly due to the method that the original authors chose to
    handle traps.


    If any error is detected during system call handling, u_error is set to record
    the error found. For example, if an attempt is made to mount an already mounted
    filesystem, the system call handler will set u_error to EBUSY. As part of completing
    the system call, trap() will set the r0 register to contain the error code, that
    is accessible as the return value of the system call control is passed back to
    user space.


    For further details on system call handling in early versions of UNIX, [LION96]
    should be consulted. Steve Pate’s UNIX Internals—A Practical Approach [PATE96]
    describes how system calls are implemented in an assembly language level in System
    V Release 3 on the Intel x86 architecture.


    # Pathname Resolution


    System calls often specify a pathname that must be resolved to an inode before
    the system call can continue. For example, in response to:


    ```

    fd = open("/etc/passwd", O_RDONLY);

    ```


    the kernel must ensure that /etc is a directory and passwd is a file within the
    /etc directory.


    Where to start the search depends on whether the pathname is absolute or relative.
    If it is an absolute pathname, the search starts from rootdir, a pointer to the
    root inode in the root filesystem that is initialized during kernel bootstrap.
    If the pathname is relative, the search starts from'
