- pgno: 437
  md: 'data synchronous write. A call to the write() system call typically does not
    write the data to the disk before the system call returns to the user. The data
    is written to either a buffer cache or a page in the page cache. Updates to the
    inode timestamps are also typically delayed. This behavior differs from one filesystem
    to the next and is also dependent on the type of write; extending writes or over
    a hole (in a sparse file) may involve writing the inode updates delayed while
    overwrites (writes to an already allocated block) will typically be delayed. To
    force the I/O to disk regardless of the type of write being performed, the user
    can specify the O_SYNC option in the open() system call. There are however, especially
    in case of overwrites, where the caller may not wish to incur the extra inode
    write just to update the timestamps. In this case, the O_SYNC option may be passed
    to open() in which the data will be written synchronously to disk and the inode
    may be updated.


    dcache. The Linux directory cache, or dcache for short, is a cache of pathname
    to inode structures, which can be used to decrease the time that it takes to perform
    pathname lookups, which can be very expensive. The entry in dcache is described
    by the dentry structure. If a dentry exists, there will always be a corresponding,
    valid inode.


    DCE. Distributed Environment was the name given to the OSF consortium established
    to create a new distributed computing environment based on contributions from
    a number of OSF members. Within the DCE framework is the Distributed File Service,
    which offered a distributed filesystem.


    delayed write. When a process writes to a regular file, the actual data may not
    be written to disk before the write returns. The data may be simply copied to
    either the buffer cache or page cache. The transfer to disk is delayed until either
    the buffer cache daemon runs and writes the data, or the page daemon requires
    a page of modified data to be written to disk, or the user requests that the file
    be flushed to disk either or through closing the file.


    dentry. An entry in the Linux directory name lookup cache structure is called
    a dentry, the same as structure used to define the entry.


    DFS. The Distributed File Service (DFS) was part of the OSF program and provided
    a distributed filesystem based on the Andrew filesystem but adding more features.


    direct I/O. Reads and writes typically go through the kernel buffer cache or page
    cache. This involves two copies. In the case of a read, the data is read from
    disk into a kernel buffer and then from the kernel into the user buffer. Because
    this can have a dramatic effect on performance for subsequent reads, in some circumstances,
    the application may not wish to access the same data again. In this case, the
    I/O can take place directly between the user buffer and disk and thus eliminate
    an unnecessary copy in this case.'
