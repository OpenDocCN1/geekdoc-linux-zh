  md: 'mincache=direct. With this option, all non-synchronous requests (O_SYNC

    specified) are handled as if the VX_DIRECT advisory had

    set; that is, all requests that are aligned on correct boundaries will be

    formed as direct I/O. Writes are guaranteed to complete before the

    system returns. Note however that I/O is performed directly

    tween the user buffer and the file''s blocks on disk, data is not cached in

    the kernel. When reading the same data, a request will go to disk.


    mincache=unbuffered. This option is similar to mincache=direct. With

    the direct option however, when a file is extended or blocks are allocated

    to a file, the inode is updated synchronously before the call returns. When

    specifying mincache=unbuffered, the inode updates are always

    performed asynchronously.


    mincache=tmpcache. This is the most performant option. Nearly all file

    operations are delayed. With this option, data is not flushed to disk when

    the file is closed. Any data that is in progress during a system crash may

    result in events that contain garbage. However, filesystem throughput will

    best with this option in most environments.


    The convync mount option is used to alter the behavior of filesystems when

    files are opened with O_SYNC and O_DSYNC. There are five options:


    convync=closesync. With this option, any synchronous (O_SYNC) or

    data synchronous (O_DSYNC) writes are not performed synchronously.

    When, the file is closed, all updates are flushed to disk.


    convync=delay. This option causes synchronous (O_SYNC) or data

    synchronous (O_DSYNC) writes to be delayed.


    convync=direct. With this option, synchronous (O_SYNC) or data

    synchronous (O_DSYNC) writes do not update the inode when only the

    timestamps are modified. Changes to the file are flushed when the file is

    closed.


    convync=unbuffered. This option is similar to the direct option

    described above except that inode updates are performed asynchronously

    even if the file is extended or blocks are allocated to the file. Changes to

    the file are flushed when the file is closed.


    convync=dsync. This option converts synchronous (O_SYNC) writes to

    data synchronous writes. Changes to the file are flushed when the file is

    closed.


    One final mount option worthy of mention and useful in data security

    environments is blkclear. When specified, any extents allocated to a file are

    zero first, ensuring that uninitialized data never appears in a file. Of course

    this has an impact on performance (roughly a 10 percent hit). For desktop

    environ, a combination of blclear and mincache=closesync can be

    used.'
  merge: -1
