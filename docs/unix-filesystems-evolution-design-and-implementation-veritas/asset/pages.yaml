    The previous program reads the file and writes its contents. Commands as dd allow
    the caller to seek to a specified block in the input file and output a specified
    number of blocks.

    Reading sequentially from the start of the file in order to get the file pointer
    specified would be inefficient. The lseek() system call allows the pointer to
    be modified, allowing random access to the file. The declaration for lseek() is
    as follows:


    ```

    #include <sys/types.h>

    #include <unistd.h>


    offff_t lseek(int fd, off_t offset, int whence);

    ```


    The offset and whence arguments dictate where the file pointer should be positioned:


    +   - If whence is SEEK_SET the file pointer is set to offset bytes.

    - If whence is SEEK_CUR the file pointer is set to its current location plus offset.

    - If whence is SEEK_END the file pointer is set to the size of the file plus offset.


    When a file is opened, the file pointer is set to 0 indicating that the first
    byte will be read at 0 bytes from the start of the file. Each time data is read,
    the file pointer is incremented by the amount of data read such that the next
    read will start from the offset in the file referenced by the updated pointer.
    for example, if the first read of a file is 1024 bytes, the file pointer for be
    to 0 + 1024 = 1024. Reading another 1024 bytes will start from byte offset 1024.
    After that read the file pointer will be set to 1024 + 1024 = 2048 and so on.


    By seeking throughout the input and output files, it is possible to see how the
    dd command can be implemented. As with many UNIX commands, the work is done in
    parsing the command line to determine the input and output files, the starting
    position to read, the block size for reading, and so on.'
