- pgno: 122
  md: "All versions of UNIX provide a set of routines for manipulating the mount table,\
    \ either for adding entries, removing entries, or simply reading them. Listed\
    \ below are two of the functions that are most commonly available:\n\n```\n#include\
    \ <stdio.h>\n#include <sys/mntab.h>\n\nint getmntent(FILE *fp, struct mntab *mp);\n\
    \nint putmnt(FILE *iop, struct mntab *mp);\n```\n\nThe getmntent (L) function\
    \ is used to read entries from the mount table while putmntent (L) is used to\
    \ remove entries. Both functions operate on the mntab structure, which will contain\
    \ at least the following members:\n\n+   * char *mnt_special; /* The device on\
    \ which the fs resides *\n* char *mnt_mount; /* The mount point *\n* char *mnt_fstype;\
    \ /* The filesystem type *\n* char *mnt_opts; /* Mount options *\n* char *mnt_time;\
    \ /* The time of the mount */\n\nUsing the getmntent (L) library, it is very straightforward\
    \ to write a simple version of the mount command that, when run with no arguments,\
    \ displays the mounted filesystems by reading entries from the mount table. The\
    \ program, which is shown below, simply involves opening the mount table and then\
    \ making repeated calls to getmntent (L) to read all entries.\n\n```\n#include\
    \ <stdio.h>\n#include <sys/mntab.h>\n\nint main() {\n\tstruct mntab mt;\n\tFILE\
    \ *fp;\n\t\tfp = fopen(\"/etc/fstab\\n\", \"r\");\n\t\tprintf(\"%-15s%-10s%-30s\\\
    n\",\n\t\t\"mount point\", \"fstype\", \"device\");\n\t\twhile (getmntent(fp,\
    \ &mt) != -1) {\n\t\t\tprintf(\"%-15s%-10s%-30s\\n\", mt.mnt_mount, mt.mnt_fstype,\
    \ mt.mnt_special);\n\t\t}\n\t\t}\n}\n```\n\nEach time getmntent (L) is called,\
    \ it returns the next entry in file. Once all have been read, -1 is returned.\
    \ Here is an example of a program running:\n\n```\n$ mymount  head -7\n/proc \
    \     proc /proc\n```"
  merge: -1
  img_proc: true
