  md: '# Non-SVR4-Based Filesystem Architectures


    Previous chapters have centered around the main evolutionary path that UNIX took
    from the early research editions through to System V Release 4, which involved
    the last major enhancements to the UNIX filesystem architecture.

    While many different UNIX and UNIX-like vendors adopted the Sun VFS/vnode interface
    to one degree or another, their implementations differed in many other areas,
    most notably in how file I/O takes place. Some of the microkernel implementations
    offered new approaches to supporting UNIX-based filesystems.

    This chapter describes the major UNIX and UNIX-like operating systems from a filesystem
    perspective, showing the similarities and differences to the pre-VFS and post-VFS/vnode
    implementations.


    # The BSD Filesystem Architecture


    The first version of BSD UNIX, introduced in 1978, was based on 6th Edition UNIX.
    Almost from day one, subtle differences between the two code bases started to
    appear. However, with 3BSD, introduced in 1980 and based on 7th Edition, one can
    still see very similar code paths between 3BSD and 7th Edition UNIX, which was
    described in Chapter 6. Therefore, understanding the kernel'
