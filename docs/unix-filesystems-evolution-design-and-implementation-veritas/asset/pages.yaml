    ```


    An 8KB file is created (for the purpose of copying) and myfile is then created
    with an extent size of 512 blocks and a reservation of 1024 blocks. The trim option
    is also written to the file. The extent allocated to the file is shown below:


    > > 5 si

    inode structure at 0x00000449.0100

    type FILE 100644 nlink 1 uid 0 gid 1 size 8192

    atime 1017445593 220000 (Pri Mar 29 15:46:33 2002)

