    # UFS Logging


    Solaris UFS, starting with Solaris 7, provides a journaling capability referred
    to as UFS Logging. Unfortunately, there is little documentation of Sun to how
    logging works.


    To enable logging, the mount command should be invoked with the logging option.
    The amount of space used for logging is based on the size of the filesystem. 1MB
    is chosen for each GB of filesystem up to a maximum of 64MB. With VxFS, the log
    is circular. Wrapping or reaching the tail of the log involves flushing transactions
    that are held in the log.


    As with VxFS journaling (described in the section VxFS journaling earlier in this
    chapter) by UFS the log can be replayed following a system crash to bring back
    to a consistent state.


    # The ext2 and ext3 Filesystems


    The first filesystem that was developed as part of Linux is a Minix filesystem
    clone. At this time, the Minix filesystem stored its block addresses in 16-bit
    integers that restricted the size of the filesystem to 64MB. Also, directory entries
    were fixed in size and filenames limited to 14 characters. Minix filesystem support
    was replaced in 1992 by the ext filesystem, which supported filesystem sizes up
    to 2GB and filename sizes up to 255 characters. However, inodes did not have access
    time, modification, and creation time stamps, and linked lists were used to manage
    free blocks and inodes resulting in fragmentation and less-ideal performance.


    These inadequacies were addressed by both the Xia filesystem and the ext2 filesystem
    (which was modelled on the BSD File System), of which provided a number of enhancements,
    including a better on-disk layout for managing filesystem resources. The improvements
    resulting in ext2 far outweighed those of Xia, and in ext2 became the facto standard
    on Linux.


    The following sections describe the ext2 filesystem, followed by a description
    of how the filesystem has evolved over time to produce the ext3 filesystem which
    supports journaling and therefore fast recovery.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Features of the ext2 Filesystem


    Shown below are the main features supported by ext2:


    **4TB filesystems.** This required changes within the VFS layer. Note that the
    maximum file and filesystem size are properties of the underlying filesystem and
    the kernel implementation.


    **255-byte filenames.** Directory entries are variable in length with a maximum
    size of 255 bytes.


    **Selectable file semantics.** With a mount option, the administrator can choose
    whether to have BSD or SVR4 file semantics. This has an effect on the group ID
    when a file is created. With BSD semantics, files are created with the same group
    ID as the parent directory. For System V semantics, if a directory has the group
    ID set, new files inherit the group ID of the parent directory and subdirectories
    inherit the group ID and group ID bit; otherwise, files and directories inherit
    the primary group ID of the calling process.


    **Multiple filesystem block sizes.** Block sizes of 1024, 2048, and 4096 bytes
    can be specified as an option in `mkfs`.


    **Reserved space.** Up to 5 percent of the filesystem can be reserved for root-only
    files, allowing some recovery in the case of a file system.


    **Per-file attributes.** Attributes can be set on a file or directory to affect
    subsequent access. This is described in detail in the next section.


    **BSD-like synchronous updates.** A mount option ensures that all meta-data (inodes,
    bitmaps, indirects and directories) are written to disk synchronously when modified.
    This increases filesystem integrity at the expense of performance.


    **Periodic filesystem checks.** To enforce filesystem integrity, ext2 has two
    ways of ensuring that many times a full `fsck` is invoked on the filesystem. A
    count is kept until it reaches a specified count, a full `fsck` is invoked. Alternatively,
    a time-based system can be used to ensure that the filesystem is cleaned on a
    regular basis.


    **Fast symbolic links.** As with VxFS, symbolic links are stored in the inode
    itself rather than in a separate allocated block.


    The following sections describe some of these features in more detail.


    # Per-File Attributes


    In addition to the features listed in the last section, there is a set of per-file
    attributes which can be set using the `chattr` command and displayed using `lsattr`.
    The supported attributes are:'
  merge: -1
  img_proc: true
