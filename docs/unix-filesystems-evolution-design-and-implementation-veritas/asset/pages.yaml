- pgno: 120
  md: "For arguments specified using the -o option, the generic mkfs command will\
    \ pass the arguments through to the filesystem specific mkfs command without trying\
    \ to interpret them.\n\n# Mounting and Unmounting Filesystems\n\nThe root filesystem\
    \ is mounted by the kernel during system startup. Each filesystem can be mounted\
    \ on any directory in the root filesystem, except /. A mount point is simply a\
    \ directory. When a filesystem is mounted on that, the previous contents of the\
    \ directory are hidden for the duration of the mount, as shown in Figure 5.1.\n\
    \nIn order to mount a filesystem, the filesystem type, device (slice or logical\
    \ volume), and the mount point must be passed to the mount command. Running the\
    \ mount command by itself shows all the filesystems that are currently mounted,\
    \ along with their mount options:\n\n```\\```\n\n```\n# mount -F vxfs /dev/vx/dsk/vol\
    \ /mnt1\n# mount | grep mnt1\n/mnt1 /dev/vx/dsk/read/write/setuid/delayog/\nlargefiles/ierror-mwdisable=1580006\n\
    \ Tue Jul 3 09:40:22\n```\n\nNote that the mount shows default mount options as\
    \ well as options that were explicitly requested. In Linux, the -t is used to\
    \ specify the filesystem type so the command would be invoked with mount -t vxfs.\n\
    As with mkfs, the mount command is a switchout command. The generic mount runs\
    \ first and locates the filesystem-specific command to run, as in the following\
    \ output shows. Note the use of the access( ) system call. There are a number\
    \ of well-known locations for which the filesystem-dependent mount can be located.\n\
    \n```\n1379: execve(\"/usr/bin/mount\", args = 5\n\n1379: execve(\"/usr/lib/fs/vxfs/mount\"\
    , 0) Err#2 ENOENT\n1379: execve(\"/etc/fs/vxfs/mount\", 0xFFFECEC, 0xFFEFD4A)\
    \ args = 3\n\n1379: mount(\"/dev/vx/dsk/vol1\", \"/mnt1\", MS_DATA[MS_OPTIONSTR,\n\
    \t\"vxfs\", 0xFFEFD84, 12) = 0\n```\n\nWhen a filesystem is mounted, an entry\
    \ is added to the mount table, which is a file held in /etc that records all filesystems\
    \ mounted, the devices on which they reside, the mount points and a list of options\
    \ that were passed to mount or which the filesystem chose as defaults."
  merge: -1
  img_proc: true
