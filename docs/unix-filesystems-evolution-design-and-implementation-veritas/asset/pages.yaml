    /dev/fd0 32 5 27 16% /mnt

    ```


    When run on an empty filesystem, there are 4 inodes used out of the 32 available
    (UX_MAXFILES). By creating a directory an additional inode is used that is returned
    in the f_free frees of the stat structure and displayed by above.


    # The Filesystem Source Code


    This section displays all of the uufs source code. All files are included together
    to make it easy to reference from the different sections of the chapter.

    The order in which these files are listed:


    +   - ux_fs.h (lines 1 to 103). This file contains definitions of the structures
    used by the filesystem. This includes the superblock, inodes, directory entries,
    and parameters that are global to the filesystem as the maximum number of files,
    data blocks, and the location of various structures on disk.

    - mkfs.c (lines 104 to 263). This file contains the source code to the uufs mkfs
    command.

    - fsdb.c (lines 264 to 394). This file contains the source code to the uufs fsdb
    command.

    - ux_alloc.c (lines 395 to 470). This file contains routines to allocate inodes
    and data blocks.

    - ux_dir.c (lines 471 to 912). This file contains the inode_operations vector
    exported, including file and directory creation, name resolution, and creation
    of hard links.

    - ux_file.c (lines 913 to 1008).

    - ux_inode.c (lines 1009 to 1317). This file contains routines that work on the
    filesystem as a whole, including module initialization and deinitialization.'
