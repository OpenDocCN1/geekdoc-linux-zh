  md: 'As with other UNIX tools, vxdump works best on a frozen image, the subject
    of the next few sections.


    # Frozen-Image Technology


    All the traditional tools described so far operate on a filesystem that is mounted
    and in use. Unfortunately this can lead to backing up some files that are in the
    process of being written. If files are being changed while the backup is running,
    an inconsistent image will likely be written to tape or other media.


    Ideally a backup should be run when there is no activity to the filesystem, allowing
    all files backed up to be in a consistent state. The system administrator does
    not, however, want to undo a busy filesystem to perform a backup. This is where
    snapshots come into play.


    A stable snapshot, or frozen image, is a consistent copy of a filesystem that
    allows a backup application to back up files that are not changing. Even though
    there may still be activity to the filesystem, the frozen image is guaranteed
    to be a consistent replica of the filesystem at the time the frozen image was
    taken.


    The following sections describe the two types of frozen images: snapshots that
    are not persistent across reboots and a filesystem application to back up files
    that are not changing. Even though there may still be activity to the filesystem,
    the frozen image is guaranteed to be a consistent replica of the filesystem at
    the time the frozen image was taken.


