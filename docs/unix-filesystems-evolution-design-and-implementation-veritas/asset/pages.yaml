- pgno: 238
  md: '# VxFS DMAPI Support


    The Data Management Interfaces Group specified an API (DMAPI) to be provided by
    filesystem and/or OS vendors, that would provide hooks to support Hierarchical
    Storage Management (HSM) applications.


    An HSM application creates a virtual filesystem by migrating unused files when
    the filesystem starts to become full and then migrates them back when requested.
    This is similar to virtual and physical memory. The size of the filesystem can
    be much bigger than the actual size of the device on which it resides. A number
    of different policies are typically provided by HSM applications to determine
    the type of files to migrate and when to migrate. For example, one could implement
    a policy that migrates all files over 1MB that haven''t been accessed in the last
    week when the filesystem becomes 80 percent full.


    To support such applications, VxFS implements the DMAPI which provides the following
    features:


    +   - The register for one or more events. For example, the application can be
    informed of every read, every write, or other events such as a mount invocation.


    +   - The API performs a hole operation which allows the application to migrate
    data and then punch a hole in the file while retaining the existing size. After
    this occurs, the file is said to have a managed region.


    +   - An application can perform invisible reads and invisible writes. As part
    of the API, the application can read from and write to a file without updating
    the timestamps. The goal of these operations is to allow the migration to take
    place without the user having knowledge that the file was migrated. It also allows
    the HSM application to work in conjunction with a backup application. For example,
    if data is already migrated to tape, there is no need for a backup application
    to write the same data tape.


    VxFS supports a number of different HSM applications, including the VERITAS Storage
    Migrator.


    # The UFS Filesystem


    This section explores the UFS filesystem, formerly known as the Berkeley Fast
    File System (FFS), from its roots in BSD to today''s implementation and the enhancements
    that have been added to the Sun Solaris UFS implementation. UFS has been one of
    the most studied of the UNIX filesystems, is well understood, and has been ported
    to nearly every flavor of UNIX. First described in the 1984 Usenix paper “A Fast
    Filesystem for UNIX” [MCKU84], the decisions'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Disk-Based Filesystem Case Studies 213


    taken for the design of UFS have also found their way into other filesystems,
    including ext2 and ext3, which are described later in the chapter.


    # Early UFS History


    In [MCKU84], the problems inherent in the original 512-byte filesystem are described.
    The primary motivation for change was due to poor performance experienced by applications
    that were starting to be developed for UNIX. The old filesystem was unable to
    provide enough throughput due to the fact that all data was written in 512-byte
    blocks, which were arbitrarily placed throughout the disk. Other factors that
    resulted in less ideal performance


    +   - Because of the small block size, anything other than small files resulted
    in the file going into directs quickly. Then, more I/O was needed to access file
    data.


    +   - File-data (inodes) and the file data were physically separated on disk and
    could result in significant times. For example, [LEFB89] described how a traditional
    150MB filesystem had 4MB of inodes followed by 146MB of data. When accessing files,
    there was always a long seek following a read of the inode before the data blocks
    could be read. Times also added to overall latency when moving from block of data
    to the next, which would likely not be contiguous on disk.


    Some early work between BSD and BSD4.0, which doubled the block size of the old
    filesystem to 1024 bytes, showed that the performance could be increased by a
    factor of two. The increase in block size also reduced the need for indirect blocks
    for many files.


    With these features in mind, the team from Berkeley went to design a new filesystem
    that would produce fast rates of many times its predecessor with less I/O and
    greater disk throughput.


    One crucial aspect of the new design concerned the layout of data on disks, as
    shown in Figure 9.5. The new filesystem was divided into a number of cylinder
    groups mapped directly to the cylindrical layout of data on disk drives at time—note
    that on early drives, each cylinder had the same amount of data whether toward
    the outside of the platter or the inside. Each cylinder group contained a copy
    of the superblock, a fixed number of inodes, bitmaps describing free and data
    blocks, a summary table describing block usage, and the data blocks themselves.
    Each cylinder group had a fixed number of inodes. The number of inodes per cylinder
    group was calculated such that there was one inode created for 2048 bytes of data.
    It was deemed that this should provide far more files than would actually be needed.


    To help achieve some level of integrity, cylinder group meta-data was not stored
    in the same platter for each cylinder group. Instead, to avoid placing all of
    the structural filesystem data on the top platter, meta-data on the second cylinder'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# 214 UNIX Filesystems—Evolution, Design, and Implementation


    ![](img/730b37b12231377a346ba9a27cbd6a68_240_0.png)


    Figure 9.5 Mapping the UFS filesystem to underlying disk geometries.


    group was placed on the second platter, meta-data for the third cylinder group
    on the third platter, and so on. With the exception of the first cylinder group,
    data blocks were stored before and after the cylinder group meta-data.


    # Block Sizes and Fragments


    Whereas the old filesystem was limited to 512-byte data blocks, the FFS allowed
    block sizes to 4096 bytes at a minimum to the limit imposed by the size of data
    types stored on disk. The 4096 byte block size was chosen so that files up to
    $2^{32}$ bytes in size could be accessed with only two levels of indirection.
    The filesystem block size was chosen when the filesystem could not be changed
    dynamically. Of course, different filesystems could have different block sizes.


    Because most files at the time the FFS was developed were less than 4096 bytes
    in size, file data could be stored in a single 4096 byte data block. If a file
    was only slightly greater than a multiple of the filesystem block size, this could
    result in a lot of wasted space. To alleviate this problem, the new filesystem
    introduced the concept of fragments. In this scheme, data blocks could be split
    into 2, 4, or 8 fragments, the size of which is determined when the filesystem
    is created. If a file contained 4100 bytes, for example, the file would contain
    4096 byte data block plus a fragment of 1024 bytes to store the fraction of data
    remaining.


    When a file is extended, a new data block or another fragment will be allocated.
    The policies that are followed for allocation are documented in [MKCU84] and shown
    as follows:'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# Disk-Based Filesystem Studies 215


    +   1. If there is space in the fragment or data block covering the end of the
    file, the new data is simply copied to that block or fragment.


    +   2. If there are no fragments, the existing block is filled and new data blocks
    are allocated until the write has completed or there is insufficient data to fill
    a new block. In this case, either a block with the correct amount of fragments
    or a new data block will be allocated.


    +   3. If the file contains one or more fragments and the amount of new data to
    write plus the amount of data in fragments exceeds the amount of space available
    in a data block, a new block is allocated and the data is copied from the fragments
    to the new data block, followed by the new data appended to the file. The process
    followed in Step 2 is then followed.


    Of course, if files are extended by small amounts of data, there will be excessive
    copying as fragments are allocated and then deallocated and copied to a full block.


    The amount of space saved is dependent on the data block size and the fragment
    size. However, with a 4096-byte block size and 512-byte fragments, the amount
    of space lost is about the same as the old filesystem, but better throughput is
    gained not at the expense of wasted space.


    # FFS Allocation Policies


    The Berkeley team recognized improvements were being made in disk technologies
    and disks with different characteristics could be employed in a single system
    simultaneously. To take advantage of the different disk types and utilize the
    speed of the processor on which the filesystem was running, the filesystem was
    adapted to the specific disk hardware and system on which it ran. This resulted
    in the following allocation policies:


    +   Blocks for a file are allocated from the same cylinder group wherever possible.
    If possible, the blocks are rotationally well-positioned so when reading a file
    sequentially, a minimal amount of rotation is required. For example, consider
    the case where a file has two data blocks, the first of which is stored on track
    0 on the first platter and the second of is stored on track 0 of the second platter.
    After the first data block has been read and before an I/O request is initiated
    on the disk, the disk has rotated so that the disk heads may be one or more sectors
    past the sector / just read. Thus, data for the second block is not placed in
    the same sector on track 0, but several sectors further forward on track 0. This
    allows for the disk to spin between the two read requests. This is known as the
    disk interleave factor.


    +   Related information is clustered together whenever possible. For example,
    the nodes for a specific directory and the files within the directory are placed
    within the same cylinder group. To avoid overuse of one cylinder over another,
    the allocation policy for directories themselves is'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'different. In this case, the new inode is allocated from another cylinder group
    that has a greater than average number of free inodes and the smallest number
    of directories.


    +   - File data is placed in the same cylinder group as its inode. This helps
    reduce the need to move the disk head when reading an inode followed by its data
    blocks.


    +   - Large files are allocated across separate cylinder groups to avoid a single
    file consuming too great a of a single cylinder group. Switching to a new cylinder
    group when allocating to a file occurs at 48KB and then at each subsequent megabyte.


    For these processes to work, the filesystem has to have a certain amount of space.
    Experiments showed that the scheme worked well until less than 10 percent of disk
    space was available. This led to a fixed amount of reserved space being aside.
    After this threshold was exceeded, the superuser could allocate from this space.


    # Performance Analysis of the FFS


    MCKU84 showed the results of a number of different performance runs to determine
    the effectiveness of the new filesystem. Some observations from these runs are:


    +   - The inode layout proved to be effective. When running the `1s` command on
    a large directory, the number of actual disk accesses was reduced by a factor
    of 2 when the directory contained other directories and by a factor of 8 when
    the directory contained regular files.


    +   - The throughput of the filesystem increased dramatically. The old filesystem
    was only able to use 3 to 5 percent of the disk bandwidth the FFS was able to
    use up to 47 percent of the disk bandwidth.


    +   - Both reads and writes were faster, primarily due to the larger block size.
    Larger block sizes also resulted in overhead when allocating blocks.


    These results are not always true representative of real world situations, and
    the FFS can perform badly when fragmentation starts to occur over time. This is
    particularly true after the filesystem reaches about 90 percent of the available
    space. This is, however, generally true of all filesystem types.


    # Additional Filesystem Features


    The introduction of the Fast File System also saw a number of new features being
    added. Note that because there was no filesystem switch architecture at this time,
    they were initially implemented as features of UFS itself. These new features:'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'Symbolic links. Prior to their introduction, only hard links were supported
    in the original UNIX filesystem.


    Long file names. The old filesystem restricted file to 15 characters. The FFS
    provided file names of arbitrary length. In the first FFS implementation, file
    names were initially restricted to 255 characters.


    File locking. To avoid the problems of using a separate lock file to synchronize
    updates to another, the BSD team implemented an advisory locking scheme. Locks
    could be shared or exclusive.


    File rename. A single rename system call was implemented. Previously, three separate
    system calls were required which resulted in problems following a system crash.


    Quotas. The final feature added was of support for user quotas. For further details,
    see the section User and Group Quotas in Chapter 5.


    All of these features are taken for granted today and are expected to be available
    on most filesystems on all versions of UNIX.


    # What''s Changed Since the Early UFS Implementation?


    For some time, disk drives no longer adhered to fixed-size cylinders, on the basis
    that more data can be stored on those tracks closer to the edge of the platter
    than the inner tracks. This makes the concept of a cylinder group somewhat of
    a misnomer since the cylinder groups no longer map directly to the cylinders on
    the disk itself. Thus, some of the early optimizations were present in the earlier
    UFS implementations no longer find with today''s disk drives and, in certain circumstances,
    actually do more harm than good.


    However, the locality of reference model employed by UFS still results in inodes
    and data being placed in close proximity and therefore is still an aid to performance.


    # Solaris UFS History and Enhancements


    Because SunOS (the predecessor of Solaris) was based on BSD UNIX, it was one of
    the first available operating systems to support UFS. Work has continued on development
    of UFS at Sun to this day.


    This section analyzes the enhancements made by Sun to UFS, demonstrates how some
    of these features work in practice, and shows how the underlying features of the
    FFS, in this chapter, are implemented in UFS today.


    # Making UFS Filesystems


    There are still many options that can be passed to the mkfs command to create
    disk geometry. First of all though, consider the following call to mkfs to create
    a 100MB filesystem. Note that the size passed is specified in 512-byte sectors.'
