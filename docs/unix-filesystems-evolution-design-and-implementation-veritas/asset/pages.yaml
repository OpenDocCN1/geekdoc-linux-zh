    \ of these features in more detail.\n\n# Extent-Based Allocation\n\nMost traditional\
    \ UNIX filesystems are block based such that time data is allocated to the filesystem\
    \ block size. If the block size is 4KB, a 16KB file will have four blocks. With\
    \ the traditional scheme of mapping blocks from the inode, a large file goes into\
    \ indirect blocks, double indirect, and even triple indirect blocks. There are\
    \ two main problems with this approach, which results in a degradation in performance:\n\
    \n+   1. Blocks allocated to the file are unlikely to be contiguous on disk. Accessing\
    \ the file may result in a significant amount of disk head movement.\n2. When\
    \ reading data from anything other than the first few blocks, a number of reads\
