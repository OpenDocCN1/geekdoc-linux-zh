  md: '# 108 UNIX Filesystems—Evolution, Design, and Implementation


    ![](img/730b37b12231377a346ba9a27cbd6a68_134_0.png)


    File contains:

    8 indirects of which each references:

    32 double indirects of which each references:

    32 direct block pointers


