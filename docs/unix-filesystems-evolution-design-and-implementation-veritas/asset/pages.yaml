    # Filesystem Backup


    Backing up a filesystem to tape or other media is one area that is not typically
    documented in the UNIX world. Most UNIX users are familiar with commands such
    as tar and cpio, which can be used to create a single archive from a hierarchy
    of files and directories. While this is sufficient for creating a copy of a set
    of files, such tools operate on a moving target—they copy files while the files
    themselves may be changing. To solve this problem and allow backup applications
    to create a consistent image of the filesystem, various snapshotting techniques
    have been employed.


    This chapter describes the basic tools available at the UNIX user followed by
    a description of filesystem features that allow creation of snapshots (also called
    frozen images). The chapter also describes the techniques used by hierarchical
    managers to archive file data based on various policies.


    # Traditional UNIX Tools


    There are a number of tools that have been available on UNIX for many years that
    deal with making copies of files, file hierarchies, and filesystems. The following
    sections describe tar, cpio, and pax, the best understood utilities for archiving
    file hierarchies.'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'This is followed by a description of the dump and restore commands, which can
    be used for backing up and restoring whole filesystems.


    # The tar, cpio, and pax Commands


    The tar and cpio commands are both used to construct an archive of files. The
    set of files can be a directory hierarchy of files and subdirectories. The tar
    command originated in BSD while the cpio command came from System V. Because tar
    is available on just every platform, including non-UNIX operating systems, cpio
    will not be mentioned further.


    # The tar Archive Format


    It is assumed that readers are familiar with operation of the tar command. As
    a quick refresher, consider the following 3 commands:


    ```

    $ tar cvf files.tar /home/spate/*

    $ tar tvf files.tar

    $ tar xvf files.tar

    ```


    The first command (c option) creates a tar archive consisting of all files under
    the directory /home/spate. The second command (t option) displays the contents
    of the archive. The last command (x option) extracts from the archive.


    There are two main tar formats, the original format that originated in BSD UNIX
    and is shown in Figure 12.1, and the USTAR format as defined by Posix.1. In both
    cases, the archive consists of a set of records. Each record has a fixed size
    and 512 bytes. The first entry in the archive is a header record that describes
    the first file in the archive. Next follows zero or more records that hold the
    file contents. After the first file there is a header record for the second file,
    records for its contents, and on.


    The header records are stored in a portable ASCII form, which allows tar archives
    to be easily posted to different operating system types. The end of the archive
    is indicated by two records filled with zeros. Unused space in the header is left
    as zeros, which will be shown in the next section.


    The link field is set to 1 for a linked file, 2 for a symbolic link, and 0 otherwise.
    A directory is indicated by a trailing slash (/) in its name.


    # The USTAR tar Archive Format


    The USTAR tar format, as defined by POSIX.1, is shown in Figure 12.2. It retains
    the original tar format at the start of the header record and extends it by adding
    additional information after the old header information. Presence of the USTAR
    format can be easily detected by searching for the non-terminated string "ustar"
    in the magic field.'
  merge: -1
  img_proc: true
