    # What''s in the Kernel Source Tree


    There are many files and directories in the Linux kernel source tree. This section
    provides an overview of how the kernel source tree is laid out allow readers to
    easily locate the various kernel subsystems or specific files.


    arch. This directory contains a directory for each of the different architectures
    that Linux supports including Intel, Sparc, MIPS, and IBM i390.


    CREDITS. This file lists all of the major contributors to the kernel together
    with information about their area of expertise or contribution.


    Documentation. There is a whole host of documentation distributed with the kernel
    source. The filesystems directory contains about some of the different Linux filesystems
    in addition to generic filesystem-related information.


    drivers. This directory contains all of the Linux device drivers.


    fs. This is the directory that will be of most relevance to people interested
    in filesystems with the mm directory that contains much of the page/data I/O management
    code. In the fs directory implement the dcache, buffer cache, inode cache, and
    file-related system call handling. Within the fs directory is a directory for
    each of the Linux systems. Within their respective directories are the filesystem
    source files themselves.


    include. All of the kernel header files can be accessed within this directory.
    This directory contains architectural-specific header files in addition to header
    files that are common across all architectures. The common header files can be
    found in the linux subdirectory. The fs.h header file is of particular importance
    to filesystem writers. The dache header file defines the structures used by the
    Linux writers.


    init. This directory contains functions that are executed during kernel bootstrap.


    ipc. This directory contains source applicable to System V IPC (Inter Process
    Communication) including semaphores, shared memory, and message queues.'
