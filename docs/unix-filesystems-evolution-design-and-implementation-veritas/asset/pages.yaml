- pgno: 363
  md: '# Developing a Filesystem for the Linux Kernel


    The GNU debugger gdb has been available for many years, typically used to debug
    user-level programs. However, connecting machines together over a serial line
    in host/target configuration, gdb can also be used to debug the Linux kernel.
    It requires a patch to the kernel to include a kgdb driver through which gdb on
    the host machine can communicate. Although this requires an extra machine and
    some additional setup, the ease of use of debugging at source level is well worth
    the extra work. It is also easier to see how the kernel works not only can breakpoints
    be added to show the flow through the kernel, but function arguments can be displayed
    along with the source code corresponding to the position at which the breakpoint
    is hit.


    There are multiple patches for kernel-level gdb debugging. The following Web page:


    ```

    http://kgdb.sourceforge.net/

    ```


    is the homepage for kgdb. It references all of the patches and contains detailed
    instructions on gdb setup. The following sections highlight some of the main points.
    For complete details, refer to the kgdb homepage.


    # Connecting the Host and Target Machines


    The first step for gdb debugging is to connect the two machines together and verify
    that data can be passed through the link. The machines must be connected through
    a standard null modem between the serial ports of the machines as shown in Figure
    14.2.


    Serial ports support transmission rates from 110 baud to 115,200 baud. The default
    baud rate for a serial port is 9,600. This is generally adequate for debugging
    although higher baud rates are preferred if a lot of information needs to be transmitted
    over the wire. This will certainly be the case when displaying multiple thread
    stacks.


    Once the link is in place, the serial port on each machine must be ideal. This
    can be verified on each machine as follows:


    ```

    # stty < /dev/ttyS0

    speed 9600 baud; line = 0;

    min = 0; time = 10;

    -brk -icrnrl -imaxbel

    -opost -onclr

    -isig -icanon -iext -echo -echok -echoctl -echoke

    ```


    The baud rate is shown here as 9,600. If the baud rate differs between the two
    machines, the following call to the stty command will set the baud rate:


    ```

    # stty ispeed 9600 ospeed 9600 < /dev/ttyS0

    ```


    Assuming the baud rate is the same on both machines and the cable is in'
