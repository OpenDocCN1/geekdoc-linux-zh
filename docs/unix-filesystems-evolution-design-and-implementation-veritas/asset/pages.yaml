  md: "It is said ext2 does not need defragmentation under normal load as long as\
    \ there is 5% of free space on a disk. However, over time continuous addition\
    \ and removal of files of various size will undoubtedly result in fragmentation\
    \ to some degree. There is a defragmentation tool for ext2 called defrag but users\
    \ are cautioned about its use—if a power outage occurs when running defrag, the\
    \ file system can be damaged.\n\nThe block group is described by the following\
    \ structure:\n\n```\nstruct ext2_group_desc {\n    unsigned long bg_block_map;\
    \      /* Blocks bitmap map *\n    unsigned long bg_inode_map;      /* Inodes\
    \ bitmap map *\n    unsigned long bg_inode_table;    /* Inodes table map *\n \
    \   unsigned short bg_free_blocks_count; /* Free blocks count *\n    unsigned\
    \ short bg_free_inodes_count;  /* Free inodes count *\n    unsigned short bg_used_dirs_count;\
    \   /* Directories count *\n};\n```\n\nThis structure basically points to other\
    \ components of the block group, with its first fields referencing specific block\
    \ numbers on disk. By allocating inodes and disk blocks within the same group,\
    \ it is possible to improve performance because disk head movement may be reduced.\
    \ The bg_used_dirs_count records the number of inodes in the group that are used\
    \ for directories. This count is used as part of the scheme to balance directories\
    \ across the different groups and to help locate files and their parent directories\
    \ within the same group.\n\nTo see how the block group structures are used in\
    \ practice, the following example, using a small ext2 filesystem, shows how structures\
    \ are set up when a file is allocated. Firstly, a filesystem is mounted on a floppy\
    \ disk:\n\n```\n# mkfs /dev/fd0 (02-Sep-2001)\nmke2fs 1.24a linux\nFilesystem\
    \ label=\nOS type=linux\nBlock size=1024 (log=0)\nFragment size=1024 (log=0)\n\
    184 inodes, 1440 blocks\n72 blocks (5.00%) reserved for the super user\nFirst\
    \ data block=1\n1 block group\n8192 blocks per group, 8192 fragments per group\n\
    184 inodes per group\n```\n\n```\nWriting tables: 0/idone\nWriting superblocks\
    \ and filesystem accounting information: done\n```\n\nThis filesystem will be\
    \ automatically checked every 35 months or 180 days, whichever comes first. Use\
    \ tune2fs -c or -i to override.\n\nAnalysis of the on-disk structures can be achieved\
    \ using the debugfs command. The show_super_stats displays the superblock and\
