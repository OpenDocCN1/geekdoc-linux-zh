- pgno: 149
  md: '# Development of the SVR4 VFS/inode Architecture 123


    The boundary between the filesystem-independent layer of the kernel and the filesystem-dependent
    layer occurred mainly through a new implementation of the in-core. Each filesystem
    type could potentially have a very different on-disk representation of a file.
    Newer diskless filesystems such as NFS and RFS had different, non-disk-based structures
    once again. Thus, the new inode contained fields that were generic to all filesystem
    types such as user and group IDs and file size, as well as the ability to reference
    data that was filesystem-specific. Additional fields used to construct the FFS
    were:


    +   * i_fsptr. This field points to data that is private to the filesystem and
    is not visible to the rest of the kernel. For disk-based filesystems this field
    would typically point to a copy of the disk inode.


    +   * i_fstype. This field identifies the filesystem type.


    +   * i_mntdev. This field points to the mount structure of the filesystem to
    which this inode belongs.


    +   * i_mton. This field is used during pathname traversal. If the directory referred
    by this inode is mounted on, this field points to the mount structure for the
    filesystem that covers this directory.


    +   * i_fstype. This field points to a vector of filesystem functions that are
    called by the filesystem-independent layer.


    The set of filesystem-specific operations is defined by the fstype structure.
    An array of the same name holds an ftype structure for each possible filesystem.
    The elements of the structure, and the functions that the kernel can call inside
    the filesystem with, are shown in Table 7.1.


    When a file is opened for access, the i_fstype is set to point to the fstype[]
    entry for that filesystem inode. In order to invoke a filesystem-specific function,
    the kernel performs a level of indirection through a macro that accesses the appropriate
    function. For example, consider the definition of FS_READI() that is invoked to
    read data from a file:


    ```

    # FS_READI(ip) ((*i_fstype)->fs_readi)(ip))

    ```


    All filesystems must follow the same calling conventions that they understand
    how arguments will be passed. In the case of FS_READI(), the arguments of it call
    will be held in u_base and u_count. Before returning to the filesystem-independent
    layer, u_error will be set to indicate whether an error occurred and u_resid will
    contain a count of any bytes that could not be read or written.


    # Mounting Filesystems


    The method of mounting filesystems in SVR3 changed because each filesystem''s
    superblock could be different and in the case of NFS and RFS, there was no superblock
    per se. The list of mounted filesystems was moved into an array of mount structures
    that contained the following elements:'
