    a programmatic perspective, the holes in the file are not actually visible. The
    main benefit comes from the amount of storage that is saved. If an application
    wishes to create a file for which large parts of the file contain zeroes, this
    is a useful way to save on storage and potentially gain performance by avoiding
    unnecessary I/Os.


