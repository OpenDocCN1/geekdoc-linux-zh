- pgno: 167
  md: '# Development of the SVR4 VFS/Vnode Architecture 141


    enhancement. However it still involved a directory scan to locate the appropriate
    inode number. With the DNLC, a search may be made by the name component alone.
    If the entry is cached, the vnode is returned. At hit rates over 90 percent, this
    results in a significant performance enhancement.


    The DNLC is a cache of ncache structures linked on an LRU (Least Recently Used)
    list. The main elements of the structure are shown below and the linkage between
    elements of the DNLC is shown in 7.5.


    +   * name. The pathname stored.

    * namelen. The length of the corresponding vnode.

    * vp. This field points to the corresponding vnode.

    * dvp. The credentials of the file''s owner.


    The ncache structures are hashed to improve lookups. This alleviates the need
    for unnecessary string comparisons. To access an entry in the DNLC, a hash value
    is calculated from the pathname and vnode pointer. The appropriate entry in the
    nc_hash[] array is accessed, through which the cache can be searched. There are
    a number of DNLC-provided functions that are called by both the filesystem and
    the kernel.


    dnlc_entry. This function is typically called by the filesystem to add an entry
    to the DNLC. This is typically called during pathname resolution on a successful
    VOP_LOOKUP() call. It is also called when a new file is created or after other
    operations involve introducing a new file to the namespace such as creation of
    hard and symbolic links, renaming of files, and creation of directories.


    dnlc_lookup. This function is typically called by the filesystem during pathname
    resolution. Because pathnames are resolved one at a time, the parent directory
    vnode is passed in addition to the file name to search. If the entry exists, the
    corresponding vnode is returned, otherwise NULL is returned.


    dnlc_remove. Renaming of files and removal of files are functions for which the
    entry in the DNLC must be removed.


    dnlc_purge. This function can be called to remove all entries in the cache that
    reference the specified vnode.


    dnlc_purge_vfsp. When a filesystem is to be unmounted, this function is called
    to remove all entries that have vnodes associated with the filesystem that is
    being unmounted.


    dnlc_pernel. This function removes a single entry from the DNLC. SVR4 does not
    provide a centralized inode cache caching of inodes or other filesystem-specific
    data is the responsibility of the filesystem. This function was originally implemented
    to handle the case where an inode that was no longer in use has been removed from
    the inode cache.'
