  md: "# 352 UNIX Filesystems—Evolution, Design, and Implementation\n\nThe call from\
    \ kupdate() to sync_old_buffers(). Following through, the kernel code knows an\
    \ inline function, write_super(), which actually calls into the filesystem as:\n\
    \n```\nif (sb->s_root && sb->s_dir) {\n    if (sb->s_op && sb->s_op->write_super)\
    \ {\n        sb->s_op->write_super(sb);\n    }\n```\n\nThus, the write_super entry\
    \ of the superblock vector is called. For uufs, the buffer holding the superblock\
    \ is simply marked dirty. Although this does not flush the superblock to disk\
    \ immediately, it will be written as part of kupdate() processing at a later date\
    \ (which is usually fairly quickly). The other task to perform by ux_write_super()\
    \ is to set the s_dir field of the in-core superblock back to 0. If left at i,\
    \ ux_write_super() would be called every time kupdate() runs and would, for all\
    \ intents and purposes, lock the system.\n\n# Unmounting the Filesystem\n\nDirty\
    \ buffers and inodes are flushed to separately and are not therefore part of unmounting\
    \ the filesystem. If the filesystem is busy when an unmount command is issued,\
    \ the kernel does not communicate with the filesystem before returning EBUSY to\
    \ the user.\n\nIf there are no open files in the system, dirty buffers and inodes\
    \ are flushed and the kernel marks a call to the put_super function exported through\
    \ the superblock_operations vector. For uufs, this function ux_put_super() (lines\
    \ 1176 to 1188). The path entering ux_put_super() is as follows:\n\n```\nBreakpoint\
    \ 4, ux_put_super (s=0xcde400) at ux_inode.c:167\n167     struct ux_fs *fs = (struct\
    \ ux_fs *)s->s_prv;\n(gdb) bt\n#0 ux_put_super (s=0xcde400) at ux_inode.c:167\n\
    #1 0xc014cb32 in kill_super (sb=0xcde400) at super.c:800\n#2 0xc01481db in path_release\
    \ (nd=0xc9d1af80)\n    at /usr/src/linux-2.4.18/include/linux/mount.h:50\n#3 0xc0156931\
    \ in sys_umount (name=0x08053d28 \"mnt\", flags=0)\n    at namespace.c:3395\n\
    #4 0xc015694e in sys_oldmount (name=0x08053d28 \"mnt\")\n    at namespace.c:406\n\
    #5 0xc01073b in system_call ()\n```\n\nThere are only two tasks to be performed\
    \ by ux_put_super():\n\n+   - Mark the buffer holding the superblock dirty and\
    \ release it.\n\n+   - Free the structure used to hold the ux_fs structure that\
    \ was allocated during ux_read_super()."
