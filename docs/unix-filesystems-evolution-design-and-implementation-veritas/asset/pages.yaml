    The first four fields describe the device, mount point, filesystem type, and options
    to be passed to mount. The fifth field is related to the dump command and records
    which filesystems need to be backed up. The sixth field is used by the fsck program
    to determine the order in which filesystems should be checked during bootstrap.


    # Mounting Filesystems During Bootstrap


    Once entries are created and placed in /etc/vfstab, or equivalent, there is seldom
    need for administrator intervention. The file is accessed during system startup
    to mount all filesystems before the system is accessible to most applications
    and users.


    When the operating system bootstraps, the kernel is read from a well-known location
    of disk and goes through basic initialization tasks. One of these tasks is to
    mount the root filesystem. This is typically the only filesystem that is mounted
    until the rc script starts running.


    The init program is spawned by the first process (process ID of 1). By calling
    the initab(F) file, it determines which commands and scripts needs to run to bring
    the system up. This sequence of events can differ between one system and another.
    For V-based systems, the rc scripts are located in /etc/rc.X, where X refers to
    the run level at which it


    Following are a few lines from the initab(F) file:


    ```

    # head -9 initab

    ap:sysinit:/sbin/autopush -f /etc/iu.ap

    ap:sysinit:/sbin/soconfig -f /etc/sock2path

    fs:sysinit:/sbin/rc sysinit

    is:3:initdefault

    3:s324 powerfail!/usr/shutdown -y -i5 -g0

    sS:wait:/sbin/rcS

    s0:wait:/sbin/rc0

    s1:spawn:/sbin/rc1

    s2:wait:/sbin/rc2

    ```


    Of particular interest is the last line. The system goes multiuser at init state
    2 This is achieved by running the rc2 script which in turn runs all of the scripts
    found in /etc/rc2.d. Of particular interest is the script SO1UNTFSYS. This is'
