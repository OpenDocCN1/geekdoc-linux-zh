- pgno: 397
  md: "# Developing a Filesystem for the Linux Kernel 371\n\n```\nwritepage: block_sync_page,\n\
    prepare: ux_prepare_write,\ncommit: generic_commit_write,\nbmap: ux_bmap;\n```\n\
    \nFor all the functions defined in this vector, uufs also makes calls to generic\
    \ kernel routines. For example, consider the ux_readpage() function (lines 976\
    \ to 980), which is also shown here:\n\n```\nint\nux_readpage(struct file *file,\
    \ struct page *page)\n{\n    return block_read_full(page, ux_get_block);\n}\n\
    ```\n\nFor each of the uxfs exported, uufs makes a call to a generic function\
    \ and passes the ux_get_block() routine. Before the flow into the filesystem for\
    \ file I/O, each of the next three sections, it is first helpful to show how ux_get_block()\
    \ (lines 929 to 968):\n\n```\nint\nux_get_block(struct inode *inode, long block,\n\
    \    struct buffer_head *bh_result, int create)\n```\n\nThe ux_get_block() function\
    \ is called whenever the kernel needs to access part of a file that is not already\
    \ cached. The block argument is the logical block within the file such that block\
    \ 0 maps to file offset 0, block 1 maps to file offset 512 and so. The create\
    \ argument indicates whether the kernel needs to read or write to the file. If\
    \ create is 0, the kernel is reading from the file. If create is 1, the filesystem\
    \ will allocate storage at the offset referenced by block.\n\nTaking the case\
    \ where block is 0, the filesystem must fill in the appropriate fields of the\
    \ header as follows:\n\n```\nbh_result->b_dev = inode->i_dev;\nbh_result->b_blocknr\
    \ = uip->i_addr[block];\n```\n\nThe kernel will then perform the read of the data.\
    \ In the case create is 1, the filesystem must allocate a new data block by calling\
    \ ux_block_alloc() and set the appropriate i_addr[] slot to reference the new\
    \ block. Once allocated, the buffer_head structure must be initialized prior to\
    \ the kernel performing the I/O operation.\n\n# Reading from a Regular File\n\n\
    The filesystem does not do anything for reading from regular files. In place of\
    \ the read operation (file_operations vector), the filesystem specifies the generic_file_read()\
    \ function."
