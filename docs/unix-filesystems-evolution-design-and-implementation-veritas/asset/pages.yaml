    # # Reading the Root Inode


    The final step when mounting the filesystem is to read in the root inode and instantiate
    it is achieved through a call to get() in the dache followed by a call to d_alloc_root().


    The call to get() will invoke a back into the filesystem to actually read the
    inode from disk. Subsequent calls to get() for the same inode will find the entry
    in the cache awaiting the need for further filesystem access. For details on how
    uufs inodes see the section *Reading from Disk* a little later in the chapter.
    The Linux kernel calls find_inode() (fs/inode.c) to scan the inode cache for the
    inode. If not found, a call to get_new_inode() is made.


    The call to d_alloc_root() is a wrapper to d_instantiate() that initializes the
    d_sb field of the dentry structure to reference the new super_block structure.
    Note that accessing any further inodes will involve access to dentries that already
    exist and have been initialized by the kernel.


    At this stage, the mount is complete. The super_block structure has been initialized,
    the root directory is accessible through the Linux inode cache/dcache, and the
    kernel has access to the array of functions exported by the root inode through
    which subsequent operations can be performed.


    As another example of how to use gdb, a breakpoint can be set on the ux_read_inode()
