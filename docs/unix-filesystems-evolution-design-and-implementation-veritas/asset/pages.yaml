    # Installing Debugging Support


    Analyzing the filesystem source code is one way to learn about how systems work.
    However, it is extremely difficult following this method to understand the flow
    through the kernel and filesystem in ensure certain operations. There is no better
    method than installing and using one of the different kernel debuggers allowing
    you to stop in specific functions, display stack traces and function arguments,
    and print other useful information.


    There are three main methods under which the filesystem or indeed any other part
    of the kernel can be debugged. The first approach involves using the kernel printf()
    command which the second approach involves a standalone debugger such as kdb where
    flow can be stopped by placing explicit breakpoints or by entering a special key
    to enter the debugger. The third approach involves the use of two machines connected
    through a serial cable and over gdb can be used for source level debugging.


    The following sections describe each of these approaches. The amount of work to
    perform each task is considerably different with printf() being the simplest approach
    while the gdb approach involves more to set up and have access to all the available
    resources it is recommended for readers who wish to experiment and have is that
    you start with printf() first, then move to kdb, and finally to gdb.


    The following sections assume some familiarity with debugging concepts.


    # The printf Approach to Debugging


    One of the oldest and easiest styles of debugging is the printf() method. By placing
    printf() statements throughout the code it is possible to display information
    about the running program. This is useful for development or simply to follow
    the flow through the program.


    Linux provides the printf() function for kernel/module writers to use.'
