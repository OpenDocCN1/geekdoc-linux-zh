    # Creating a uxfs Filesystem


    The first step when developing a new filesystem is to write a mkfs command to
    place the initial filesystem layout on disk. This includes the following tasks:
    initialize the filesystem superblock and write it to disk.


    +   - Create a root directory inode and lost+found directory inode. For each of
    the inodes, ensure that "."..." are entries in place and for the root directory,
    add an entry for lost+found.


    +   - Account for allocation of the two directories within the index map.


    +   - Account for allocation of two blocks for the root and lost+found directories.


    The code for mkfs can be found on lines 104 to 262. For uxfs, it is a fairly simple
    program. As with the kernel, it uses various structure definitions and information
    from ux_fs.h including structural information, inode formats, directory entries
    and various filesystem boundaries such as the maximum number of blocks and inodes.


    Before the filesystem is implemented, it is important to verify the information
    that mkfs writes to disk. Thus, the next program to write is fsdb, which can read
    back and display various superblock and node information.


    The fsdb command (lines 264 to 393) is very simple. It accepts two commands that
    allow the superblock or a specified node to be displayed.'
