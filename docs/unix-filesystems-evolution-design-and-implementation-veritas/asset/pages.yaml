  md: '# 232 UNIX Filesystems—Evolution, Design, Implementation


    EXT2_BAD_INO (1). This file contains a list of bad blocks on the file system.

    EXT2_ROOT_INO (2). This is the root directory of the file system.

    EXT2_ACL_IDX_INO (3). ACL inode.

    EXT2_ACL_DATA_INO (4). ACL inode.

    EXT2_BOOT_LOADER_INO (5). This file contains the boot loader.

    EXT2_UNDEL_DIR_INO (6). This file is used for undelete.

    EXT2_FIRST_INO (11). This is the first inode that does not have a special

    meaning and can be used for other purposes.


    There are many different inode flags that can be stored in i_flags. These map

    to the file attributes that can be set with chattel.

    The i_faddr field is used in the case where the fragment size and block size

    are not equal. If the file does not require an exact number of filesystem-sized

    blocks, the last portion of the file data is stored in a fragment. The location
    of the

    fragment is stored in this file.


    # Repairing Damaged ext2 filesystems


    The e2fsck is used to repair filesystem inconsistencies, that can occur following

    a system crash. The process is divided into five separate passes which

    are listed. The information shown here is based on material that appears in the

    Linux System Administrators Guide [WIR295].


    **Pass 1.** This phase takes the longest time to execute, because all of the inodes

    have to be read into memory and checked.


    In this phase, e2fsck checks each inode in the filesystem to ensure the

    file is valid and that all of the blocks in the inode are valid block

    numbers. During pass 1, bitmaps indicating which blocks and inodes are in

    use are compiled, or used later.

    If e2fsck notices data blocks that are mapped by more than one inode, it

    can either clear the duplicated blocks so that each inode has its own copy, or

    removes the blocks from one or more of the inodes.


    To reduce the I/O time necessary in future passes, critical filesystem

    information is cached in memory, depending on the location of disk of all the

    directory blocks on the filesystem. This removes the need to re-read the

    directory inodes during pass 2.


    **Pass 2.** In this phase directories are validated. Because directory entries
    do notnspan disks, each directory block can be checked individually without

    reference to other directory blocks. The directory blocks are checked to

    make sure that the directory entries are valid and contain references to

    inode numbers that are in use (as determined by pass 1).


    For the first block in each directory inode, the "." and ".."

    entries are checked to make sure they exist, and the inode number for

    the "" entry matches the current directory.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# Disk-Based Filesystem Case Studies 233


    Pass 2 also caches information concerning the parent directory in which each directory
    is linked. If a directory is referenced by more than one directory, the second
    reference of the directory is treated as an illegal link and is removed.


    Note that at the end of pass 2, nearly all I/O that efsck needs to perform is
    complete. Information required by passes 3, 4, and 5 are cached in memory; hence,
    the remaining passes of efsck are CPU bound and less than 5 to 10 percent of the
    total running time.


    Pass 3. In this phase, the directory connectivity is checked by tracing the path
    of each directory to the root using information that was cached during pass 2.
    At this time, the “” for each entry is also checked to make sure it is valid.
    Any directories that cannot be traced to the root are linked to the last+found
    directory.


    Pass 4. In this phase, efsck checks the reference counts for all by iterating
    over all the inodes and comparing the link counts calculated during passes 2 and
    3. Any undeleted files with a zero link count are placed in last+found during
    this pass.


    Pass 5. In this phase efsck checks the validity of the filesystem summary information.
    It compares the block and inode bitmaps which were constructed during the previous
    passes against the actual bitmaps of the filesystem and the on-disk copies if
    necessary.


    The efsck program is designed to run as quickly as possible. Because filesystem
    checking programs tend to be disk-bound, this done by optimizing the algorithms
    used by efsck so that filesystem structures are not repeatedly accessed from the
    disk. In addition, the order in which inodes and directories are sorted by block
    number, to reduce the amount of time in disk seeks.


    # Tuning an ext2 Filesystem


    The tune2fs program can be used to change the various tunable parameters of an
    ext2 filesystem. Of the different tunables that can be changed:


    +   - max-counts. This option adjusts the count of read/write mounts between two
    filesystem checks.


    +   - error-behavior. When errors are detected, the behavior of the ext2 kernel
    code can be altered with this option. The value of error-behavior can continue
    in that the kernel continues with normal execution, remount-ro, which forces the
    kernel to remount the filesystem read-only, or panic in which case the kernel
    will panic.


    +   - user. This option sets the user who can benefit from the reserved blocks
    when the filesystem becomes full. The value of user can be a numerical user ID
    or a user name.


    For further information on tune2fs the tune2fs (8) manual page.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Resize ext2 Filesystems


    resize2fs command can be used to increase or decrease the size of an ext2 filesystem.
    Note that the filesystem must be unmounted before the resize can take place. The
    resize2fs program does not manipulate the size of underlying partition. To increase
    the size of the filesystem, the partition must be increased first using fdisk.
    Similarly, to decrease the size of an ext2 filesystem, the partition must be resized
    following the call to resize2fs.


    If an ext2 filesystem resides on LVM (Logical Volume Manager) volume, the e2fsadm
    command can be used to resize the filesystem and the underlying logical volume.


    # The ext3 Filesystem


    The ext3 filesystem was introduced to solve one specific problem, namely the amount
    of time it takes to perform a filesystem check following a system crash. As described
    in VFS Journaling, earlier in this chapter, these times can be significant, measured
    in many hours, if the filesystem is very large in size. Note that in this case
    is actually a property of the structural data (inodes) and not specifically the
    size of the filesystem.


    Another goal behind ext3 was to make changes to the underlying ext2 code base
    because ext2 is small in size, easy to maintain, robust, and well understood.


    The use of ext3 was positioned in such a way that it is easy to transition between
    ext2 and ext3 filesystems and vice versa.


    The actual journaling layer is separate from ext3. The filesystem understands
    the concepts of transaction (when one starts, when it finishes) but it is not
    responsible for the journaling.


    # How to Use an ext3 Filesystem


    A new ext3 filesystem can be created by mkfs or by converting an existing ext2
    filesystem. To create a new ext3 filesystem, mkfs is called as follows:


    ```

    # mkfs -j /dev/sda5

    ```


    To convert an existing ext2 filesystem to an ext3 filesystem, the tune2fs command
    can be invoked as follows:


    ```

    # tune2fs -j /dev/sda5

    ```


    Note that the command can be invoked on either a mounted or unmounted filesystem.
    If invoked on a mounted filesystem, the journal will appear as a visible file
    (.journal). If invoked on an unmounted filesystem or if mkfs -j is run when making
    the filesystem, the journal will not be visible.


    To actually mount the filesystem, the ext3 filesystem type must to be specified:'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Disk-Based Filesystem Case Studies 235


    ```

    # mount -t ext3 /dev/sda5 /mnt1

    ```


    Conversion back to ext2 can be achieved by using the tune2fs command as

    follows:


    ```

    # tune2fs -o ^has_journal /dev/sda5

    ```


    or by replaying the log to make the filesystem clean and then simply

    mounting it as an ext2 filesystem.


    # Data Integrity Models in ext3


    As VxFS, there is a set of choices about the type and level of journaling to be

    . Users can choose among the following options, which are passed to

    mount.


    data=writeback. This option limits data integrity guarantees so that file

    delf is not journaled. The filesystem, however, guaranteed to be

    structurally sound at all times.


    data=ordered. This mode, which is the default, ensures that data is

    consistent at all times. The data is actually written to the file before the

    taction is logged. This ensures that there is no stale data in any

    filesystem block after a crash.


    data=journal. This option writes all file data through the journal. This

    means that the data is actually written to disk twice. This option provides the

    best guarantees in terms of filesystem integrity but because data is written

    through the journal, performance can be significantly impacted and the time

    for recovery after a crash can be much greater.


    # How Does ext3 Work?


    The design of ext3 was presented in [TWEE98]. To provide a transaction

    mechanism, all meta-data-related blocks must be logged in the journal. There

    are three distinct types of blocks in question:


    Journal blocks. An update to an inode, for example, will write the entire

    filesystem block to which the inode belongs to the journal. In [TWEE98],

    Stephen Tweed claims that this is a relatively cheap method due to the

    sequential nature in which data is written to the journal, and that by

    following this simple approach, there is little complexity in the kernel and

    therefore less CPU overhead.


    Descriptor blocks. These blocks describe other journal blocks and are written

    to the journal before the journal blocks are written. Because the journal

    blocks are the actual meta-data blocks that must be written, the descriptor

    blocks are used to record information about the journal blocks, such as the

    disk block on which they reside.'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'Header blocks. The header blocks are written throughout the journal. They record
    the start and end of the journal together with a sequence number that is used
    during recovery to locate the order in which the blocks were written.


    As with VFS, transactions are deigned in memory to aid performance. In ext3, a
    set of transactions is batched into a compound transaction and committed to the
    journal on disk. This process is called checkpointing. Checkpointing is in progress,
    a new compound transaction is started, that will record any further changes to
    the filesystem while the previous compound transaction is being written to disk.


    Crash recovery is performed by walking through the journal and writing any journal
    blocks to their correct location on disk. Because this is an idempotent operation,
    a crash in the middle of recovery does not matter because the process can be repeated
    any number of times with exactly the same effect.


    # Summary


    There are many different UNIX filesystems and to scratch on the surface on all
    of them would easily fill a book of this size. The three filesystems described
    in the chapter represent a good cross section of filesystems from the UNIX and
    Linux operating systems and cover the commercial filesystem market (VxFS), the
    most widely documented and ported filesystem (UFS), and the most popular open
    source filesystems (ext2 and ext3).


    Only a few filesystems have been documented in any detail. [HANC01] describes
    the AdvFS filesystem developed by Digital which is the main filesystem of their
    True64 operating system. [KELL96] describes IBM''s JFS filesystem.


    To understand filesystem internals is always best to start with one of the simple
    filesystems such as the original System V filesystem as documented in [LION96].
    If studying Linux, the ext2 filesystem on one of the earlier kernels is a good
    place to start before looking at the more elaborate, and therefore more complex,
    filesystems.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '![](img/730b37b12231377a346ba9a27cbd6a68_263_0.png)


    # # Mapping Filesystems to Multiprocessor Systems


    Once upon a time, filesystem writers (in fact kernel writers in general) didn''t
    have to worry about multiprocessor issues. Certain structures needed protection
    by locks for the case where a process went to sleep (for example, for an I/O operation)
    or if interrupts executed code could attempt to access structures that were being
    used by the process currently running on the CPU.


    All of this changed with the introduction of Symmetric Multiprocessor (SMP)-based
    systems, where multiple CPUs share the same memory and a single kernel runs across
    all of the CPUs. In this model, one must assume that *threads of execution could
    be running within any part of the kernel and could attempt to modify any kernel
    structure at the same time as another thread.


    This chapter follows the evolution of UNIX through the earlier Uni-Processor (UP)
    days to today''s highly scalable SMP-based implementations. Different types of
    MP locks are described, as well as how the VERITAS filesystem, VxFS, uses these
    locks to manage its set of in-cores.


    # ## Evolution of Multiprocessor UNIX


    [WAIT87] documents the early years of *Multi-Processor (MP)* development of UNIX.
    In the mid 1980s the emergence of Sun Microsystems and Apollo'
  merge: -1
  img_proc: true
- pgno: 264
  md: "Computing saw the introduction of cheaper workstations, allowing engineers\
    \ to have their own workstations for the first time. In addition to the well-established\
    \ computer companies such as DEC, IBM, and Cray, newcomers including Sequent,\
    \ Aliant, Convex, and Encore started to introduce multiprocessor-based operating\
    \ systems and hardware.\n\nThe first MP UNIX, MUNIX, was developed at the Naval\
    \ Postgraduate School in Monterey [HAWL75]. An MP-based UNIX kernel developed\
    \ at Purdue University in the late 1970s on a VAX computer in a master/slave model\
    \ where the UNIX kernel ran on one processor while user applications ran on the\
    \ others. Within Bell Labs, the UNIX/370 project was formed to create an MP kernel\
    \ to run on an MP version of the IBM 370 mainframe. This kernel used semaphores\
    \ to then went on create an MP UNIX to run on their own 3B20A resulting in a kernel\
    \ that could perform 70 percent better than the UP version.\n\nOne company that\
    \ would make enormous enhancements to SMP UNIX and would eventually find its way\
    \ into SVR ES/MP was Sequential Computers, which emerged in the mid 1980s and\
    \ made significant improvements to both the hardening and the UNIX kernel.\n\n\
    The large number of UNIX systems companies has diminished somewhat with consolidation\
    \ around Sun, IBM, and HP, all of which are today producing SMP systems with up\
    \ to 64 CPUs.\n\n# Traditional UNIX Locking Primitives\n\nThis section examines\
    \ the earlier unipro (UP) UNIX synchronization primitives starting with 5th Edition\
    \ UNIX and going up to SVR4.0. Over this twenty-year time period, the implementation\
    \ stayed remarkably similar. As noted in his Lions Commentary on UNIX 6th Edition\
    \ with Source Code [LION96], John Lions notes that the early mechanisms for handling\
    \ sections of code were \"totally inappropriate in a multiprocessor system.\"\n\
    \nAs mentioned, in UP UNIX implementations, the kernel needed to protect data\
    \ structures in the case when a process needs to sleep or when handling interrupts.\
    \ The reason a process might sleep include: waiting for I/O, waiting for a lock\
    \ owned by another process, or giving up the CPU to another process after its\
    \ times.\n\nIf a process needs to access some resource such as a buffer cache\
    \ buffer that is currently in use, it will need to call sleep() specifying the\
    \ address of the resource it requires. A switch call to relinquish control of\
    \ the CPU, allowing another process to run. For example, to wait on a busy buffer,\
    \ the following code sequence is:\n\n```\nif (bp->b_flags & B_BUSY) {\n    bp->b_flags\
    \ |= B_WANTED;\n    sleep(bp, PRIBIO);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 265
  md: "# Mapping Filesystems to Multiprocessor Systems 239\n\nThe address of the structure\
    \ on which the process is waiting (the wait channel) is stored in the p_chan field\
    \ of the proc structure. The priority argument passed to sleep() will be described\
    \ in more detail later in the chapter. Note for now that if the priority is greater\
    \ than or equal to zero, the process may be awoken from a sleep by a signal. A\
    \ value less than zero prevents this from happening.\n\nWhen a process is about\
    \ to relinquish control of a special resource, it looks to see if another process\
    \ is waiting on the resource and issues a corresponding wakeup() call to signal\
    \ to the process that the resource is now available. In this case, the following\
    \ code sequence is invoked:\n\n```\nif (bp->b_flags & B_WANTED)\n    wakeup(bp);\n\
    ```\n\nTo determine which process is sleeping on the resource, a scan is made\
    \ through the proc table issuing wakeup() for each process p_wchan field is set\
    \ to bp.\n\n# Hardware and Software Priority Levels\n\nTo prevent data from being\
    \ modified by interrupt handling code, critical sections were protected by priority\
    \ levels. Because interrupts occur at any time, there is a potential for an interrupt\
    \ handler to modify the data structure as the process currently running, resulting\
    \ in a corrupted variable or linked list. To prevent this happening, UNIX allows\
    \ the process to temporarily disable interrupts while executing critical sections\
    \ of code. Disabling interrupts is typically unnecessary, so a number of priority\
    \ levels were established allowing the kernel to block one or more interrupts\
    \ depending on the type of operation being performed.\n\nWhen port an operating\
    \ system, notice must be taken of the hardware-assigned priorities for each device.\
    \ This is a hardware decision for which the operating system developers may have\
    \ knowing the hardware vector, it is then possible to disable specific interrupts.\
    \ Each interrupt is assigned a priority so that if an interrupt were to occur\
    \ while an interrupt handler is running for the same device, the interrupt can\
    \ be temporarily masked.\n\nFor example, Table 10.1 shows the interrupt vector\
    \ around the time of 5th Epoch UNIX.\n\nWhen an interrupt occurs, the process\
    \ is changed to reflect the type of interrupt. Although the table shows the process\
    \ and interrupt priorities to be the same, this does not have to occur in practice.\
    \ The RK driver interrupts, the processor priority will be switched to level 5.\
    \ This prevents any interrupts from occurring at processor priority less than\
    \ or equal to 5. Any interrupts that occur at this time with a lower priority\
    \ will be held (latched) until the current interrupt handling code is finished."
  merge: -1
  img_proc: true
- pgno: 266
  md: "# Table 10.1 Hardware and Software Priority Levels in 5th Edition UNIX\n\n\
    | PERIPHERAL DEVICE | INTERRUPT PRIORITY | PROCESS PRIORITY |\n| --- | :--- |\
    \ :--- |\n| Teletype input | 4 | 4 |\n| Teletype output | 4 | 4 |\n| Paper tape\
    \ input | 4 | 4 |\n| Paper tape output | 4 | 4 |\n| Line printer | 4 | 4 |\n|\
    \ RK disk driver | 5 | 5 |\n| Line clock | 6 | 6 |\n| Programmable clock | 6 |\
    \ 6 |\n\nTypically, the CPU will be running at processor priority 0. Consider\
    \ the case within the buffer cache handling code where a process has located the\
    \ required buffer, but the buffer is currently in the middle of an I/O operation.\
    \ Because the buffer is busy, the process needs to set the b_flags field to B_WANTED\
    \ before calling sleep() as shown earlier. In this case the following fragment\
    \ of code is:\n\n```\nsp16();\nif (bp->b_flags & B_BUSY) {\n    bp->b_flags |=\
    \ B_WANTED;\n    sleep(bp, PRIOBIO);\n    sp10();\n} else {\n    sp10();\n}\n\
    ```\n\nIn this case, the buffer has been found on one of the hash queues. In order\
    \ to check the b_flags field, this process must block interrupts from the disk\
    \ driver, thus the initial call to sp16() (set priority level) is not used and\
    \ the call to sp10() to set the priority level back to 0. If the buffer is in\
    \ use, B_WANTED can be set and the process issues a call to sleep(). One that\
    \ comes to mind without knowledge of the implementation of sleep() is that, at\
    \ a glance, it appears as if the process goes to sleep with interrupts blocked.\
    \ This is true. However, the next process that wakes up will set the priority\
    \ to the level at which it went to sleep. Consider the case where another process\
    \ is waiting for a separate buffer from the one shown above. After it awaits,\
    \ it knows it has control of the buffer it slept on, so it will immediately issue\
    \ an sp10() call as shown above.\n\nAfter the process that issues the call to\
    \ sleep() awakes, the priority passed to sleep() is reinstated before sleep()\
    \ returns."
  merge: -1
  img_proc: true
- pgno: 267
  md: '# Mapping Filesystems to Multiprocessor Systems 241


    # UP Locking and Pre-SVR4 Filesystems


    Now that the old primitives have been described, consider how this applies to
    the old systems implementation. Recall that there was no File System Switch or
    VFS architecture at that time. The main concern for filesystem development was
    the thought of what happens when a process goes to sleep. If the process is in
    the middle of performing I/O on file A, it would not be a good idea to let another
    process come along and truncate the file. The section Putting It Together, in
    Chapter 6, showed how file I/O took place in the research editions of UNIX. At
    the higher layers of the kernel, most activity involved manipulating per-process
    data such as the user, proc, and file structures and therefore was no need to
    protect the process from interrupts or other processes. Furthermore, on read operations
    there was no locking within the filesystem handler code per se. The only locking
    occurred in the buffer cache following a read(), which would invoke getblk().
    The same is true for overwrites where a file would overwrite blocks that were
    allocated.


    Allocation on the other hand had a number of places where there could be contention.
    The first lock of interest was at the filesystem level. When a call to alloc()
    found a structure indicated that allocation was taking place. If the s_lock field
    was already set, a call to sleep() made the address of s_lock. After a block was
    allocated (or freed), a call to wakeup() was issued to allow any other process
    to allocate/deallocate. The procedure was to allow any followed when allocating
    or deallocating an inode, by using the s_ilock field of the structure.


    There is no locking during handling of the write($) system call all the block
    allocation layer. For each 512-chunk of the write to perform, a call to bmap()
    is made to locate the block to write to. If the block is not already present in
    the file, a call to alloc() is made to allocate a new block. The only reason that
    this process can sleep is if I/O needs to be performed, and this will only occur
    after a block has been allocated and assigned to the inode. No other process can
    enter the kernel to access the file until the allocating process relinquishes
    control of the CPU. The same is also true when a process slice expires by the
    result of a clock interrupt. If the process is running in the kernel, it will
    continue to return to user space; only then can it sleep.


    # UP Locking and SVR4-Based Filesystems


    The period between the research editions of UNIX described previously and the
    introduction of SVR4 and the VFS/inode architecture saw only a few differences
    in the way that locks were managed in the kernel. The sleep() / wakeup() mechanism
    used throughout the history of UNIX still remained in place together with the
    software priority mechanism.'
  merge: -1
  img_proc: true
- pgno: 268
  md: "The reader/writer lock, implemented by the _rwlock() and\nvop_rwlock() operations,\
    \ was introduced with SVR4 to allow the\nfilesystem to manage locks on the inode\
    \ internally. When a call was made to\nVOP_RLLOCK(), the filesystem had no knowledge\
    \ of whether a read or a write\nwas about to. This makes sense to a large degree\
    \ when performing writes,\nbut the implementation did not allow for multiple readers.\
    \ This mode of\noperation was still place by the time the first MP versions of\
    \ UNIX started\nto appear.\n\nThe following example shows a fragment of the implementation\
    \ of\nvop_rwlock() in an early version of VxFS:\n\n```\nwhile (ip->i_flag & IRLOCKED)\
    \ {\n    ip->i_flag |= IWANT;\n    sleep(ip, PINOD);\n}\nip->i_flag &= ~IRLOCKED\n\
    ```\n\nTo release a lock on the inode the following code was executed:\n\n```\n\
    ip->i_flag &= -IRLOCKED;\nif (ip->i_flag & IWANT) {\n    ip->i_flag &= -IWANT;\n\
    \    wakeprocs(ip, PRWMT);\n}\n```\n\nNote that the code fragment for sleeping\
    \ also handles the case where the process\n be awakened by another process grabbed\
    \ the lock first.\nNo additional locks were taken by the kernel prior to a call\
    \ to\nVOP_GETPAGE() or VOP_PUTPAGE(). All other filesystem structures were\nprotected\
    \ by the sleep()/wakeup() mechanisms.\n\n# Symmetric Multiprocessing UNIX\n\n\
    The introduction of SMP hardware and SMP-based UNIX implementations\nresulted\
    \ in a completely new set of locking primitives and removal of the old\nsleep(),\
    \ wakeup(), spl() primitives. With an SMP implementation,\nthreads of control\
    \ can executing the same piece of kernel code on\ndifferent processors at the\
    \ same time. More importantly, these threads can be\naccessing the data structures\
    \ at the same time.\n\nEarly SMP implementations were based around a global kernel\
    \ lock. Each time a\nprocess entered the kernel it grabbed the kernel lock and\
    \ ran in an environment\nsimilar to the UP kernel described above. Other processes\
    \ entering the\nkernel were required to sleep until the first processes released\
    \ the kernel lock for.\nenenvironments where most work was performed in user space\
    \ with little I/O, this\nworked well. However, these environments are not very\
    \ representative of most\nreal world applications."
