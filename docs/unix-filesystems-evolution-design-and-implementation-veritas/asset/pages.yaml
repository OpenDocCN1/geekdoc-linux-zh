- pgno: 269
  md: '# Mapping Filesystems to Multiprocessor Systems 243


    Over the years, these coarse grain locks were replaced by a much finer grain locking
    model. Imagine any number of threads running in the kernel at the same time. Accessing
    kernel structures in a read-only manner is is fine. However, while the structure,
    a linked list needs to be modified you must bear in mind that while it is in the
    process of changing, another thread may be in the process of reading the structure.
    This is obviously undesirable because the reader may see a corrupt linked list,
    NULL pointers, and so on. Therefore, structures must be protected by locks while
    an update is in progress. There are two basic types of locks, sleep locks and
    spin locks. The former are similar to the sleep() / wakeup() calls described in
    the previous section. Note, however, the process will go to sleep, yielding to
    another process that is ready to run. If the critical section of code involves
    only a few instructions to manipulate a linked list, it can be much cheaper for
    the waiting process to spin (loop) waiting for access to the resource.


    At the filesystem interface level, the vop_rwlock() interface was changed as shown
    below:


    ```

    int;

    vx_rwlock(vp, off, len, fmode, mode);

    ```


    The mode field was set to either LOCK_SHARED or LOCK_EXCL, which informed the
    filesystem whether a read or a vnode operation was about to occur. At a simple
    level, this allowed the filesystem to support multiple readers or a single writer
    at the vnode layer. It allowed filesystems to implement a race-locking model whereby
    properties of the file could be locked allowing readers and writers. Note that
    protecting multiple concurrent writers is not a trivial task to perform. Most
    filesystems allow multiple readers.


    The sleep()/wakeup() mechanism was retired in SVR4 ES/MP and replaced by a number
    of locks more suitable to MP architectures, including spin locks and reader/writer
    locks. The following sections highlight the types of locks and the circumstances
    under which one lock may be used in place of another. Note that the above change
    at the vnode layer was the only locking change between the filesystem-independent
    and filesystem-dependent layers of the kernel. The work of improving filesystem
    scalability in an SMP environment comes from careful analysis of filesystem-specific
    data structures to ensure that locking occurs at a fine grain level and coarser
    locks are minimized as much as possible; with 64-way SMP systems, there can be
    significant contention on locks that are at too high a level.


    # SMP Lock Types


    Rather than describing the whole set of possible locks that are available on the
    various SMP UNIX implementations, this section highlights the types of locks that
    can be used in SMP implementations, together with the conditions under which one
    would use one lock over another. Following this section,'
  merge: -1
