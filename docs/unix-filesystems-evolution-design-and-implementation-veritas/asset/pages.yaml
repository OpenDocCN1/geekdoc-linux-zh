    # Microkernel Support for UNIX Filesystems


    Throughout the 1980s and early 1990s there were a great deal of interest in microkernel
    technology. As the name suggests, microkernels do not themselves offer the full
    features of UNIX or other operating systems, but export a set of features and
    interfaces that allow construction of new services, for example, emulation of
    UNIX at a system call level. Microkernels do provide the capability of allowing
    a clean interface between various components of the OS, paving the way for distributed
    operating systems or customization of OS provided.


    This section provides an overview of Chorus and Mach, the most popular microkernel
    technologies, and describes how each supports and performs file I/O. For an overview
