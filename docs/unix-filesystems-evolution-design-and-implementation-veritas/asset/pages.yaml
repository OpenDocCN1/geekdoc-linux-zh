    # Advanced Exercises


    The following exercises require more modification to the filesystem and require
    either substantial modification to the command and/or kernel source:


    +   1. If the system crashes the filesystem could be left in an unstable state.
    Implement a fsck command that can detect and repair any inconsistencies. One method
    of testing a version of fsck is to actually break the filesystem. Study operations
    such as directory creation to see how many I/O operations constitute the directory.
    By simulating a subset of these I/O, the filesystem can be left in a state which
    is not structurally intact.


    +   2. Introduce the concept of indirect, double indirect, and triple blocks.
    Allow 6 direct blocks, 2 indirect blocks, and 1 triple indirect block to be referenced
    directly from the inode. What file size does this allow?


    +   3. If the module panics, the kernel is typically able to continue running.
    If a uufs filesystem is at fault and already mounted, the module is unable to
    unload the filesystem could be busy. Look at ways in which the filesystem could
    be unmounted allowing the module to unload.


    +   4. The uufs filesystem would not work at all in an SMP environment. By analyzing
    other Linux filesystems, suggest improvements that allow uufs to work in an SMP
    system. Methods by which coarse grain as well as fine grain locks could be employed.


    +   5. Removing a directory entry leaves a gap within the directory structure.
    Write a user-level program that enters the filesystem and reorganizes the directory
    so that unused space is removed. What mechanisms can be used to enter the filesystem?


    +   7. Allow the user to specify the filesystem block size and also the size of
    the filesystem. This will involve changing the on-disk layout.'
