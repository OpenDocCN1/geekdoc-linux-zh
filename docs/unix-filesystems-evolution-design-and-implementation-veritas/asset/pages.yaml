- pgno: 401
  md: "# Developing a Filesystem for the Linux Kernel 375\n\nIn place the mmap function,\
    \ exported through the file_operations vector, uxfs requests that the generic_file_mmap()\
    \ be called. All the filesystem needs to provide the get_block() interface.\n\n\
    To demonstrate how the filesystem is involved, a breakpoint is set in ux_block()\
    \ and a file is mapped for read-only access. The first address of the mapping\
    \ is touched, which will create a page fault. The stack trace when ux_block()\
    \ is entered as follows:\n\n```\nBreakpoint 1, ux_block() (inode=0xcf23a20,\n\
    \  block=0, bh_result=0xc944bba0, create=0)\n  at ux_file.c:21\n21      struct\
    \ super_block *sb = inode->i_bi;\n(gdb) bt\n#0 ux_block() (inode=0xcf23a20, block=0,\n\
    \    bh_result=0xc944bba0, create=0)\n  at ux_file.c:21\n0xc0140bf in block_read_full_page\
    \ (page=0xc1238340,\n  get_block(0xd0855094 <ux_get_block>)\n  at buffer.c:178\n\
    #1 0xd08551ba in ux_readdir (file=0xc1dc9e70, page=0xc1238340)\n  at ux_file.c:67\n\
    #2 0xd0c2dd92 in cache_read (file=0xc1dc9e70, offset=-3441203168)\n  at fileemap.c:714\n\
    #3 0xd0c12def in read_cluster_nonblocking (file=0xc1dc970,\n    offset=-3475219664,\
    \ filesize=1)\n  at fileemap.c:739\n#4 0xd0c2f389 in filemap_node (area=0xc972a300,\
    \ offset=-107328344,\n    unused=0)\n  at fileemap.c:1911\n#5 0xd0c2b512 in do_no_page\
    \ (mm=0xc9f96d00, vma=0xc972a300,\n    address=1073283744, write_access=0, page_table=0xc9c1e6a0)\n\
    \  at cmemap.c:1249\n#6 0xd0c2b76c in handle_mm_fault (mm=0xc9f96d00, vma=0xc972a300,\n\
    \    address=1073283744, write_access=0)\n  at cmemap.c:1339\n#7 0xd0c1175a in\
    \ do_page_fault (regs=0xc9522fc4, error_code=4)\n  at fault.c:263\n#8 0xd0c1073cf\
    \ in error_code ()\n```\n\nThe kernel is triggered, not through a system, but\
    \ in response to a fault. Because there are no pages backing the mapped file in\
    \ the user address space, when the process accesses the file, a page fault occurs.\
    \ The kernel establishes where the page of memory is mapped to and must then fill\
    \ the page from the file appropriate file.\n\nThe ux_readpage() function is invoked,\
    \ calls back into the memory manager. To fill the page of data, the kernel will\
    \ make repeated calls to ux_get_block() until either a page of data has been read\
    \ or the end of the file has been reached. If the latter occurs, the kernel must\
    \ zero-fill the page so that, if the process accesses the end of the file, it\
    \ will read zeroes."
