    # Solaris UFS Mount Options


    A number of mount options that alter the behavior of the filesystem when mounted
    have been added to Solaris UFS over the last several years. Here are some of these:


    noatime. When a file is read, the inode on disk is updated to reflect the access
    time. This is in addition to modification time, that is updated when the file
    is actually changed. Most applications tend not to be concerned about access time
    (atime) and updates may use this option to prevent unnecessary updates to the
    inode on disk to improve overall performance.


    forcedirect | noforcedirect. When a system call is issued, data is copied from
    the user buffer to a kernel buffer and then to disk. This data is cached and therefore
    can be used on a subsequent read without a'
