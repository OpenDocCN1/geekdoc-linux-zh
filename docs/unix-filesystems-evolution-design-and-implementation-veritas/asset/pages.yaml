  md: "# 360 UNIX Filesystems—Evolution, Design, and Implementation\n\n```\nstruct\n\
    \  super_block\n\nstruct\n  ux_fs\n  u_sbh\n  u_sb\n  s_private\n\nstruct\n  buffer_head\n\
    \  b_data\n\nstruct\n  ux_superblock\n  s_inode\n```\n\n![](img/730b37b12231377a346ba9a27cbd6a68_386_0.png)\n\
    \nFigure 14.6 Kernel/Filesystem interactions when dealing with inodes.\n\nthe\
    \ inode number of inode can be found in inode->i_ino. The role of ux_read_inode()\
    \ is simply to read the inode into memory and copy relevant fields of the disk\
    \ portion of the disk-based inode into the inode structure passed.\n\nThis is\
    \ a relatively straightforward task in uufs. The inode number must be converted\
    \ into a block number within the filesystem and read through the buffer cache\
    \ into memory. This is achieved as follows:\n\n```\nblock = UX_INODE_BLOCK + ino;\n\
    bh = sb_bread(inode->i_sb, sb, block)\n```\n\nRecall that each uufs is held in\
    \ its own block on disk and inode 0 starts at the block number defined by UX_INODE_BLOCK."
