  md: '# CHAPTER 1. OVERVIEW OF SECURITY HARDENING IN RHEL


    Due to the increased reliance on powerful, networked computers to help run businesses
    and keep track of our personal information, entire industries have been formed
    around the practice of network and computer security. Enterprises have solicited
    the knowledge and skills of security experts to properly audit systems and tailor
    solutions to fit the operating requirements of their organization. Because most
    organizations are increasingly dynamic in nature, workers are accessing critical
    company IT resources locally and remotely, the need for secure computing environments
    has become more pronounced.


    Unfortunately, many organizations, as well as individual users, regard security
    as of an afterthought, a process that is overlooked in favor of increased power,
    productivity, convenience, ease of use, and budgetary concerns. Proper security
    implementation is often postponed – after an unauthorized intrusion has already
    occurred. Taking the correct measures prior to connecting a site to an untrusted
    network, such as the Internet, is an effective means of thwarting many attempts
    at intrusion.


    # 1.1. WHAT IS COMPUTER SECURITY?


    Computer security is a general term that covers a wide area of computing and information
    processing. Industries that depend on computer systems and networks to conduct
    daily business transactions and access critical information regarding their data
    as an important part of their overall assets. Several terms and metrics have entered
    our daily business vocabulary, such as total cost of ownership (TCO), return on
    investment (ROI), and quality of service (QoS). Using these metrics, industries
    can calculate aspects such as data integrity and high-availability (HA) as part
    of their planning and process management costs. In some industries, as electronic
    commerce, the availability and trustworthiness of data can mean the difference
    between success and failure.


    # 1.2. STANDARDIZING SECURITY


    Enterprises in every industry follow regulations and rules that are set by standards-making
    bodies such as the American Medical Association (AMA) or the Institute of Electrical
    and Electronics Engineers (IEEE). The same concepts hold for information security.
    Many security consultants and vendors agree upon the standard security model known
    as CIA, *Confidentiality, Integrity, and Availability*. This three-tiered model
    is a generally accepted concept for assessing risks of sensitive information and
    establishing security policy. The following describes the CIA model in further
    detail:


    +   - Confidentiality – Sensitive information must be available only to a set
    of pre-defined individuals. Unauthorized transmission and usage of information
    should be restricted. For example, confidentiality of information ensures that
    a customer''s personal or financial information is not obtained by an unauthorized
    individual for malicious purposes such as identity theft or fraud.


    +   - Integrity – Information should not be altered in ways that render it incomplete
    or incorrect. Unauthorized users should be restricted from the ability to modify
    or destroy sensitive information.


    +   - Availability – Information should be accessible to authorized users any
    time that it is needed. Availability is a warranty that information can be obtained
    with an agreed-upon frequency and timeliness. This is often measured in terms
    of percentages and agreed to formally in Service Level Agreements (SLAs) used
    by network providers and for their enterprise clients.


    # 1.3. CRYPTOGRAPHIC SOFTWARE AND CERTIFICATIONS'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'Red Hat Linux undergoes several security certifications, such as FIPS 140-2
    or Common Criteria (CC), to ensure that industry practices are followed.


    RHEL 8 core crypto components Knowledgebase article provides an overview of the
    Red Hat Enterprise Linux 8 core crypto components, documenting which they are,
    how they are selected, how they are integrated into the operating system, how
    they support hardware security modules and smart cards, and how do certifications
    apply to them.


    # 1.4. SECURITY CONTROLS


    Computer security is divided into three distinct master categories, commonly referred
    to as controls:


    +   - Physical

    - Technical

    - Administrative


    These three categories define the main objectives of proper security implementation.
    Within these controls are sub-categories that further detail the controls and
    how to implement them.


    # 1.4.1. Physical controls


    Physical control is the implementation of security measures in a defined structure
    used to deter or prevent unauthorized access to sensitive material. Examples of
    physical controls are:


    +   - Closed-circuit surveillance cameras

    - Motion or thermal alarm systems

    - Security guards

    - Picture IDs

    - Locked and dead-bolted steel doors

    - Biometrics (includes fingerprint, voice, face, iris, handwriting, and other
    automated methods used to recognize individuals)


    # 1.4.2. Technical controls


    Technical controls use technology as a basis for controlling the access and usage
    of sensitive data throughout a physical structure and over a network. Technical
    controls are far-reaching in scope and encompass such technologies as:


    +   - Encryption

    - Smart cards

    - Network authentication

    - Access control lists (ACLs)

    - File integrity auditing software'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# 1.4.3. Administrative controls


    Administrative controls define the human factors of security. They involve all
    levels of personnel in an organization and determine which users have access to
    what resources and information by such means as:


    +   - Training and awareness

    - Disaster preparedness and recovery plans

    - Personnel recruitment and separation strategies

    - Personnel registration and accounting


    # 1.5. VULNERABILITY ASSESSMENT


    Given time, resources, and motivation, an attacker can break into any system.
    All of the security procedures and technologies currently available cannot guarantee
    that any systems are completely safe from intrusion. Routers help secure gateways
    to the Internet. Firewalls help secure the edge of the network. Virtual Private
    Networks safely pass data in an encrypted stream. Intrusion detection systems
    warn you of malicious activity. However, the success of each of these technologies
    is dependent upon a number of variables:


    +   - The expertise of the staff responsible for configuring, monitoring, and
    maintaining the technologies.

    - The ability to patch and update services and kernels quickly and efficiently.

    - The ability of those responsible to keep constant vigilance over the network.


    The dynamic state of data systems and technologies, securing corporate resources
    can be quite complex. Due to this complexity, it is often difficult to find experts
    for all of your systems. While it is possible to have personnel knowledgeable
    in many areas of information security at a high level, it is difficult to retain
    staff who are experts in more than a few subject areas. This is mainly because
    each area of information security requires constant attention and focus. Information
    security does not stand still.


    A vulnerability assessment is an internal audit of your network and system security;
    the results of which indicate the confidentiality, integrity, and availability
    of your network. Typically, vulnerability assessment starts with a reconnaissance
    phase, during which important data gathering gathers the target systems and resources
    is gathered. This phase leads to the readiness phase, where the target is essentially
    checked for all known vulnerabilities. The readiness phase culminates in the reporting
    phase, where the findings are classified into categories of high, medium, and
    low risk; and methods for improving the security (or mitigating the risk of vulnerability)
    of the target are discussed


    If you performed a vulnerability assessment of your home, you would likely check
    each door to see if they are closed and locked. You would also check every window,
    making sure that they are closed completely and latch correctly. This same concept
    applies to systems, networks, and electronic data. Malicious users are thieves
    and vandals of your data. Focus on their tools, mentality, and motivations, and
    you can then react to their actions.


    # 1.5.1. Defining assessment and testing


    Vulnerability assessments may be broken down into one of two types: outside looking
    in and inside looking around.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'When performing an outside-looking-vulnerability assessment, you are attempting
    to compromise your systems from within. Being external to your company provides
    you with the cracker''s point of view. You see what a cracker sees—roughly IP
    addresses, systems on your DMZ, external interfaces of your firewall, and DMZ
    for "demilitarized zone", which corresponds to a computer or small subnet that
    sits between a trusted internal network, such as a corporate LAN, and an untrusted
    external network, such as the public Internet. Typically, the DMZ devices accessible
    to Internet traffic, such as web (HTTP) servers, FTP servers, SMTP (e-mail) servers
    and DNS servers.


    When you perform an inside-looking vulnerability assessment, you are at an advantage
    since you are internal and your status is trusted. This is the point of view you
    and your co-workers have logged on to your systems. You see server files, databases,
    and other resources.


    There are striking distinctions between the two types of vulnerability assessments.
    Being internal to your company gives you more privileges than an outsider. In
    most organizations, security is configured to keep intruders out. Little is done
    to secure the internals of the organization (such as departmental firewalls, user-level
    access controls, and authentication procedures for internal resources). Typically,
    there are many more resources when looking inside most systems that are internal
    to a company. Once you are outside the company, your status is untrusted. The
    systems and resources available to you are externally limited.


    Consider the difference between vulnerability assessments and penetration tests.
    A of vulnerability assessment as the first step to a penetration test. The information
    gleaned from the assessment is used for testing. Whereas the assessment is undertaken
    to check for holes and potential vulnerabilities, the penetration testing actually
    attempts to exploit the faults.


    Assessing network infrastructure is a dynamic process. Security, both information
    and physical, is dynamic. Performing an assessment shows an overview, which can
    turn up false positives and false negatives. A false positive is a result, where
    the tool finds vulnerabilities in reality do not exist. A false negative is when
    it omits actual vulnerabilities.


    Security administrators are only as good as the tools they use and the knowledge
    they retain. Take any of the assessment tools currently available, run them against
    your system, and it is almost a guarantee that there are some false positives.
    By program fault or user error, the result is the same. The tool may find false
    positives, or even worse, false negatives.


    Now that the difference between a vulnerability assessment and a penetration test
    is defined, take the findings of the assessment and review them carefully before
    conducting a penetration test as part of your best practices approach.


    > WARNING

    Do not attempt to exploit vulnerabilities on production systems. Doing so can
    have adverse effects on productivity and efficiency of your systems and network.


    The following list examines some of the benefits of performing vulnerability assessments.


    +   - Creates proactive focus on information security.

    - Finds potential exploits before crackers find them.

    - Results in systems being kept up to date and patched.'
  merge: -1
  pgno: 12
