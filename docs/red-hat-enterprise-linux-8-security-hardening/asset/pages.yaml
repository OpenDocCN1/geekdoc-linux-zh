    # 10.7. DEFINING PERSISTENT AUDIT RULES


    To define audit rules that are persistent across reboots, you must either include
    them in the /etc/audit/rules.d/audit.rules file or use the augrules program that
    reads rules located in the /etc/audit/rules/ directory.


    Note that the /etc/audit/rules.rules file is generated whenever the audit service
    starts. Files in /etc/audit/rules/ use the same auditctl command-line syntax to
    specify the rules. Empty lines and hash (#) are ignored.


    Furthermore, you can use the auditctl command to read rules from a specified file
    using the -R option, for example:


    ```

    # auditctl -R /usr/share/audit/sample-rules/30-stig.rules

    ```


    # 10.8. USING PRE-CONFIGURED RULES FILES


    In the /usr/share/audit/sample-rules directory, the audit package provides a set
    of pre-configured rules files following various certification standards:


    30-nispom.rules


    Audit rule configuration meets the requirements specified in the Information System
    Security chapter of the National Industrial Security Program Operating Manual.


    30-ospp-v42.rules


    Audit rule configuration meets the requirements defined in the OSPP (Protection
    Profile for General Purpose Operating Systems) version 4.2.


    30-pci-dss-v31.rules


    Audit rule configuration meets the requirements set by Payment Card Industry Data
    Security Standard (PCI DSS) v3.1.


    30-stig.rules


    Audit rule configuration meets the requirements set by Security Technical Implementation
    Guides (STIG).


    To use these configuration files, copy them to the /usr/share/audit/sample-rules
    directory and use the augrules --load command, for example:


    ```

    # cd /usr/share/audit/audit/rules/

    # cp 10-base-config.rules 30-stig.rules 31-privileged.rules 99-finalize.rules
    /etc/audit/rules.d/

    # augrules--load

    ```


    Additional resources'
