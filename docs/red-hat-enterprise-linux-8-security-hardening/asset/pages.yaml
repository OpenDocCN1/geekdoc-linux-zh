  md: '# CHAPTER 8. ENCRYPTING BLOCK DEVICES USING LUKS


    Disk encryption protects the data on a block device by encrypting it. To access
    the device''s decrypted contents, a user must provide a passphrase or key as authentication.
    This is particularly important when it comes to mobile computers and removable
    media: it helps to protect the device''s contents if it has been physically removed
    from the system. The LUKS format is a default implementation of block device encryption
    in RHEL.


    # 8.1. LUKS DIS ENCRYPTION


    The Linux Unified Key Setup-on-disk-format (LUKS) enables you to encrypt block
    devices and provides a set of tools that simplifies managing the encrypted devices.
    LUKS allows multiple keys to decrypt a master key, which is for the full encryption
    of the partition.


    RHEL utilizes LUKS to perform block device encryption. By default, the option
    to encrypt the block device is unchecked during installation. If you select to
    encrypt your device, the system prompts you for a passphrase every time you boot
    the computer. This passphrase "unlocks" the block encryption key that decrypts
    your partition. If you choose to modify the default partition table, you can choose
    which partitions you want to encrypt. This is set in the partition table settings.


    What LUKS does


    +   - LUKS encrypts entire block devices and is well-suited for protecting contents
    of mobile devices such as removable storage or laptop disk drives.

    - The underlying contents of the encrypted block device are arbitrary, which makes
    it useful for encrypting swap devices. This can also be useful with certain databases
    that use specially formatted block devices for data storage.

    - LUKS uses the existing device mapper kernel subsystem.

    - LUKS provides passphrase strengthening which protects against dictionary attacks.

    - LUKS devices contain multiple key slots, allowing users to add backup keys or
    passphrases.


    What LUKS does not do


    +   - Disk-encryption solutions like LUKS protect the data only when your system
    is off. Once the system is on and LUKS has decrypted the disk, the files on that
    disk are available to anyone who would normally have access to them.

    - LUKS is not well-suited for scenarios that require many users to have distinct
    access keys to the same device. The LUKS1 format provides eight key slots, LUKS2
    up to 32 key slots.

    - LUKS is not well-suited for applications requiring file-level encryption.


    Ciphers


    The default cipher used for LUKS is aes-xts-plain64. The default key size for
    LUKS is 512 bits. The default key size for LUKS with Anaconda (XTS) is 512 bits.
    Ciphers that are available:


    +   - AES - Advanced Encryption Standard - FIPS PUB 197

    - Twofish (a 128-bit block cipher)

    - Serpent'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Additional resources


    +   - LUKS Project Home Page

    - LUKS On-Disk Format Specification


    # 8.2. LUKS VERSIONS IN RHEL 8


    In RHEL 8, the default format for LUKS encryption is LUKS2. The legacy LUKS1 format
    remains fully supported and it is provided as a format compatible with earlier
    RHEL releases.


    The LUKS2 format is designed to enable future updates of various parts without
    a need for binary structures. LUKS internally uses JSON text format for metadata,
    while detects metadata corruption and allows automatic repairs from a metadata
    copy.


    ![](img/ce7756f7a90c9abeaf166ca2952129eb_62_0.png)


    > IMPORTANT

    Do not use LUKS2 in systems that need to be compatible with legacy systems that
    support only LUKS1. Note that RHEL 7 supports the LUKS2 format since version 7.6.


    > ### WARNING

    LUKS2 and LUKS1 use different commands to encrypt the disk. Using the wrong command
    for a LUKS version might cause data loss.


    | LUKS version | Encryption command |

    |---|---|

    | LUKS2 | cryptsetup reencrypt |

    | LUKS1 | cryptsetup-reencrypt |


    # Online re-encryption


    The LUKS2 format supports re-encrypting encrypted devices while the devices are
    in use. For example, you do not have to unmount the file system on the device
    to perform the following tasks:


    +   - Change the volume key

    - Change the encryption algorithm


    When encrypting a non-encrypted device, you must unmount the file system. You
    can remount the file system after a short initialization of the encryption.


    The LUKS1 format does not support online re-encryption.


    # Conversion


    The LUKS2 format is inspired by LUKS1. In certain situations, you can convert
    LUKS1 to LUKS2. The conversion is not possible specifically in the following scenarios:'
