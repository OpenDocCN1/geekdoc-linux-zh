  md: '# /boot


    This partition is the first partition that is read by the system during boot up.
    The boot loader and kernel images are used to boot your system into Red Hat Linux
    8 are stored in this partition. This partition should not be encrypted. If this
    partition is included in / that partition becomes encrypted or otherwise unavailable
    your system will not be able to boot.


    # /home


    When user data (/home) is stored instead of a separate partition, the partition
    can fill causing the operating system to become unstable. Also, when upgrading
    your system to the next version of Red Hat Linux 8 it is later you can keep your
    data in the /home partition it will not be overwritten during installation. If
    the root partition (/) corrupts your data could be lost forever. By using a separate
    partition there slightly more protection against data loss. You can also target
    this partition for frequent backups.


    # /tmp and /var/tmp


    Both the /tmp and /var/tmp directories are used to store data that does not need
    to be stored for a long period of time. However, if a lot of data floods one of
    these directories it consume all of your storage space. If this happens and these
    directories are stored within / then your system could become unstable and crash.
    For this reason, moving these directories into their own partitions is a good
    idea.


    # NOTE


    During the installation process, you have an option to encrypt partitions. You
    must supply a passphrase. This passphrase serves as a key to unlock the block
    encryption key, which is used to secure the partition''s data.


    # 2.3. RESTRICTING NETWORK CONNECTIVITY DURING THE INSTALLATION PROCESS


    When installing Red Hat Enterprise Linux 8, the installation medium represents
    a snapshot of the system at a particular time. Because of this, it may not be
    up-to-date with the latest security fixes and may be vulnerable to certain issues
    that were fixed only after the system provided by the installation medium was
    released.


    When installing a potentially vulnerable operating system, always limit exposure
    to the closest necessary network zone. The safest choice is the "no network" which
    means to leave your machine disconnected during the installation process. In some
    cases, a LAN or intranet connection is sufficient while the Internet connection
    is the riskiest. To follow the best security practices, choose the closest zone
    with your repository while installing Red Hat Enterprise Linux 8 from a network.


    # 2.4. INSTALLING THE MINIMUM AMOUNT OF PACKAGES REQUIRED


    It is practice to install only the packages you will use because each piece of
    software on your computer could potentially contain a vulnerability. If you are
    installing from the DVD media, take the opportunity to select exactly what packages
    you want to install during the installation. If you need another package, you
    can add it to the system later.


    # 2.5. POST-INSTALLATION PROCEDURES


    The following steps are the security-related procedures that should be performed
    immediately after Red Hat Enterprise Linux.


    +   1. Update your system. Enter the following command as:'
