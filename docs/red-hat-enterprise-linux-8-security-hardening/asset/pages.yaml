  md: '# Red Hat Enterprise Linux 8 Security hardening


    This procedure encrypts existing data on a block device without creating free
    space for storing a LUKS header. The header is stored in a detached location,
    which also serves as an additional layer of security. The procedure uses the LUKS2
    encryption format.


    # Prerequisites


    +   - The block device contains a file system.

    - You have backed up your data.


    > > WARNING

    nYou might lose your data during the encryption process: due to a hardware, kernel,
    or human failure. Ensure that you have a reliable backup before you starting the
    encryption data.


    # Procedure


    +   1. Unmount all file systems on the device. For example:

    ```

    # ummount /dev/sdb1

    ```

    2. Initialize the encryption:

    ```

    # cryptsetup reencrypt \

    --encrypt \

    --init-only \

    --header /path/to/header \

    /dev/sdb1 sdb1_encrypted

    ```


    Replace `/path/to/header` with a path to the file with a detached LUKS header.
    The detached LUKS header has to be accessible so that the encrypted device can
    be unlocked later.


    The command asks you for a passphrase and starts the encryption process.


    +   3. Mount the device:

    ```

    # mount /dev/mapper/sdb1_encrypted /mnt/sdb1_encrypted

    ```


    +   4. Start the online encryption:

    ```

    # cryptsetup reencrypt --resume-only --header /path/to/header /dev/sdb1

    ```


    # Additional resources


    +   - For more details, see the cryptsetup(8) man page.


    # 8.6. ENCRYPTING A BLANK BLOCK DEVICE USING LUKS2'
  merge: -1
