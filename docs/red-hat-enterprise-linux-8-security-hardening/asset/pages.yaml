    \ Sharing\n    * clevis-encrypt-sss(1)\n\n# 9.12. DEPLOYMENT OF VIRTUAL MACHINES\
    \ IN A NBDE NETWORK\n\nThe **luks bind** command does not change the LUKS master\
    \ key. This implies that if you create a LUKS-encrypted image for a virtual machine\
    \ or cloud environment, all the instances that run it will share a master key.\
    \ This is extremely insecure and should be avoided at all times.\n\nThis is not\
    \ a limitation of Clevis but a design principle of LUKS. If you wish to have encrypted\
    \ root volumes in a cloud, you need to make sure that you perform the installation\
    \ process (using Kickstart) for each instance of Red Hat Enterprise Linux in a\
    \ cloud as well. The images cannot be shared without sharing a LUKS master key.\n\
    \nIf you intend to deploy automated unlocking in a virtualized environment, Red\
    \ strongly recommends that you use such as lorax or virt-install with a Kickstart\
    \ file (see Configuring automated enrollment of LUKS-encrypted volumes using Kickstart)\
    \ or another automated provisioning tool to ensure that each encrypted VM has\
    \ a unique master key."
