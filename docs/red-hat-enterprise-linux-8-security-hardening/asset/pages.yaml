  md: "+   - clevis-luks-unlockers(7)\n\n# 9.11. DEPLOYING HIGH-AVAILABILITY NBDE\
    \ SYSTEMS\n\nTang provides two methods for building a high-availability deployment:\n\
    \n### Client redundancy (recommended)\n\nClients should be configured with the\
    \ ability to bind multiple Tang servers. In this setup, each Tang server has its\
    \ own keys and can decrypt by contacting a subset of these servers. Clevis already\
    \ supports this workflow through the **sss** plug-in. Red Hat recommends this\
    \ method for a high-availability deployment.\n\n### Key sharing\n\nFor redundancy,\
    \ more than one instance of Tang can be deployed. To set up a second or any subsequent\
    \ instance, install the **tang** packages and copy the key directory to the new\
    \ host using **rsync** over SSH. Note that Red Hat does not recommend this method\
    \ because sharing keys increases the risk of key compromise and requires additional\
    \ automation infrastructure.\n\n# 9.11.1. High-available NBDE using Shamir's Secret\
    \ Sharing\n\nShamir's Secret Sharing (SSS) is a cryptographic scheme that divides\
    \ a secret into several unique parts. To reconstruct the secret, a number of parts\
    \ is required. The number is called threshold and SSS is also referred to as a\
    \ threshold scheme.\n\nClevis provides an implementation of SSS. It creates a\
    \ key and divides it into a number of pieces. Each piece is encrypted using another\
    \ pin including even SSS recursively. Additionally, you define the threshold t;\
    \ if NBDE deployment deploys at least t pieces, then it recovers the encryption\
    \ key and the decryption process succeeds.\n\n# 9.11.1. Example 1: Redundancy\
    \ with two Tang servers\n\nThe following command decrypts a LUKS-encrypted device\
    \ when at least one of two Tang servers is available:\n\n```\n# clevis luks binds\
    \ -d /dev/sda1 sss '{\"t\":\"1\",\"pins\":[{\"url\":\"http://tang1.srv\"},{\"\
    url\":\"http://tang2.srv\"}]}'\n\n```\n\nThe previous command used the the following\
    \ configuration scheme:\n\n```\n{\n  \"t\":\"1\",\n  \"pins\":{\n    \"tang\"\
    :[\n      {\n        \"url\":\"http://tang1.srv\"\n      },\n      {\n       \
    \ \"url\":\"http://tang2.srv\"\n      }\n    ]\n  }\n}\n```"
