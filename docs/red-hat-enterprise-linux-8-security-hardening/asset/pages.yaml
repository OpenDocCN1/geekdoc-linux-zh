- img_proc: true
  md: 'The egid field records the effective group ID of the user who started the analyzed
    process.


    sgid=1000


    The sgid field records the set group ID of the user who started the analyzed process.


    fsgid=1000


    The fsgid field records the file system group ID of the user who started the analyzed
    process.


    tty=pts0


    The tty field records the terminal from which the analyzed process was invoked.


    ses=1


    The ses field records the session ID of the session from which the analyzed process
    was invoked.


    comm="cat"


    The comm field records the command-line name of the command that was used to invoke
    the analyzed process. In this case, the cat command was used to trigger this Audit
    event.


    exe="/bin/cat"


    The exe field records the executable that was used to invoke the analyzed process.


    subj=unconfined_u:unconfined_r:unconfined_t:s0:c0.c.1023


    The subj field records the SELinux context with which the analyzed process was
    labeled at the time of execution.


    key="sshd_config"


    The key field records the administrator-defined string associated with the rule
    that generated this event in the Audit log.


    # Second Record


    type=CWD


    In the second record, the type field value is CWD – current working directory.
    This type is used to record the working directory from which the process invoked
    the system call specified in the first record was executed.


    The purpose of this record is to capture the current process''s location in a
    relative path up being captured in the associated PATH record. This way the absolute
    path can be reconstructed.


    msg=audit(136481363.243:24287)


    The msg field holds the same timestamp and ID value as the value in the first
    record. The time stamp is using the Unix time format - seconds since 00:00:00
    UTC on 1 January 1970.


    cwd="/home/user_name"


    The cwd field contains the path to the directory in which the system call was
    invoked.


    # Third Record


    type=PATH


    In the third record, the type field value is PATH. An Audit event contains a PATH-type
    record for every path that is passed to the system call as an argument. In this
    Audit event, only one path (/etc/ssh/sshd_config) was used as an argument.


    msg=audit(136481363.243:24287)


    The msg field holds the same timestamp and ID value as the value in the first
    and second record.


    item=0'
