  md: "# CHAPTER 5. USING SHARED SYSTEM CERTIFICATES\n\nThe shared system certificates\
    \ enables NSS, GnuTLS, OpenSSL, and Java to share a default source for retrieving\
    \ system certificate anchors and black list information. By default, the trust\
    \ store contains the Mozilla CA list, including positive and negative trust. The\
    \ system allows updating the Mozilla CA list or choosing another certificate list.\n\
    \n# 5.1. THE SYSTEM-WIDE TRUST STORE\n\nIn Red Enterprise Linux, the consolidated\
    \ system-wide trust store is located in the /etc/pki/ca-trust/ and /usr/share/pki/ca-trust-source/\
    \ directories. The trust settings in /usr/share/pki/ca-trust-source/ are processed\
    \ with lower priority than settings in /etc/pki/ca-trust/\n\nCertificate files\
    \ are treated depending on the subdirectory they are installed to the following\
    \ directories:\n\n+   - for trust anchors\n  - /usr/share/pki/ca-trust-source/anchors/\n\
    \  - /etc/pki/ca-trust/source/anchors/\n- for distrusted certificates\n  - /usr/share/pki/ca-trust-source/blacklist/\n\
    \  - /etc/pki/ca-trust/source/blacklist/\n- for certificates in the extended BEGIN\
    \ TRUSTED file format\n  - /usr/share/pki/ca-trust-source/\n  - /etc/pki/ca-trust/source/\n\
    \n> NOTE\n a hierarchical cryptographic system, a trust anchor is an authoritative\
    \ entity which is assumed to be trustworthy. For example, in X.509 architecture,\
    \ a root certificate is a trust anchor from which a chain of trust is derived.\
    \ The trust anchor must be put in the possession of the trust party before make\
    \ path validation possible.\n\n# 5.2. ADDING NEW CERTIFICATES\n\n+   1. To add\
    \ a certificate to the simple PEM or DER formats to the list of CAS trusted on\
    \ the system, copy the certificate file to the /usr/share/pki/ca-trust-source/anchors/\
    \ or /etc/pki/ca-trust/source/ directory, for example:\n  # cp ~/*certificate-test-examples/Cert-trust-test-ca.pem\
    \ /usr/share/pki/ca-trust-source/source/\n2. To update the system-wide trust store\
    \ configuration, use the update-ca-trust command:\n  # update-ca-trust"
  merge: -1
  pgno: 35
- img_proc: true
  md: "# NOTE\n\nThe Firefox browser is able to use an added certificate without executing\
