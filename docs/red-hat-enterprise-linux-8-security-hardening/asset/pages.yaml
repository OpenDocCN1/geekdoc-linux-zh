  md: '# CHAPTER 12. PROTECTING SYSTEMS AGAINST INTRUSIVE USB DEVICES


    USB devices can be loaded with spyware, malware, or Trojans, which can steal your
    data or damage your system. As a Red Hat Enterprise Linux administrator, you can
    prevent such USB attacks with USBGuard.


    # 12.1. USBGUARD


    The USBGuard framework provides system protection against intrusive USB devices
    by implementing the basic whitelisting and blacklisting capabilities based on
    the USB device authorization feature in the kernel.


    The USBGuard framework provides the following components:


    +   - The system component with an inter-process communication (IPC) interface
    for dynamic interaction and policy enforcement


    +   - The command-line interface to interact with a running usbguard system service


    +   - The rule language for writing USB device authorization policies


    +   - The C++ API for interacting with the system service component implemented
    in a shared library


    The usbguard system configuration file (/etc/usbguard/usbguard-daemon.conf) includes
    the options to authorize the users and groups to use the IPC interface.


    > IMPORTANT

    The system service provides the USBGuard public IPC interface. In Red Hat Enterprise
    Linux, this interface is limited to the root user only by default.


    Consider setting either the IPCAccessControlFiles option (recommended) or the
    IPCAllowedUsers and IPCAllowedGroups options to limit access to the IPC interface.


    Ensure that you do not leave the Access Control List (ACL) unconfigured as this
    exposes the IPC interface to all local users and allows them to manipulate the
    authorization state of USB devices and modify the USBGuard policy.


    ![](img/ce7756f7a90c9abeaf166ca2952129eb_100_0.png)


    # 12.2. INSTALLING USBGUARD


