    # 4.3. USING HTTPSING PRIVATE KEYS IN APACHE AND NGINX


    The Apache and Nginx HTTP servers can work with private keys stored on hardware
    security modules (HSMs), which helps to prevent the keys'' disclosure and man-in-the-middle
    attacks. Note that this usually requires high-performance HSMs for busy users.


    # Apache HTTP server


    For communication in the form of the HTTPS protocol, the Apache HTTP server (httpd)
    uses the OpenSSL library. OpenSSL does not support PKCS #11 natively. To utilize
    HSMs, you have to install the openssl-pkcs11 package, which provides access to
    PKCS #11 modules through the engine interface. You can use a PKCS #11 URI instead
    of a regular file key and a certificate in the `/etc/http/conf.d/ssl.conf` configuration,
    for example:


    ```

    SSLCertificateFile "pkcs11:id=%01;token=softhm;type=cert"

    SSLCertificateKey "pkcs11:id=%01;token=softhm;type=private;pin=value-111111"

    ```


    Install the httpd-manual to obtain complete documentation for the Apache HTTP
    Server, including TLS configurations. The details available in the `/etc/http/conf.d.ssl.conf`
    configuration file are described in detail at /usr/share/http/manual/mod/mod_ssl.html.


    # Nginx HTTP and proxy server


    Because Nginx uses the OpenSSL for cryptographic operations, for PKCS #11 it must
    go through the openssl-pkcs11 engine. Nginx currently supports only private keys
    from an HSM, and a certificate must be provided separately as a regular file.
    Modify the ssl_certificate and ssl_certificate_key options in the server section
    of the `/etc/nginx/nginx.conf` configuration file:


    ```

    ssl_certificate /path/to/cert.pem

    ssl_certificate_key "engine:pkcs11:token=softhm;id=%01;type=private;pin=value-111111"

    ```


    Note that the engine:pkcs11 prefix is needed for the PKCS #11 URI in the Nginx
    configuration file. This is because the other pkcs11 refers to the engine name.


    # 4.4. CONFIGURING AUTHENTICATION TO APPLICATIONS USING SMART CARDS


    +   - The wget network downloader enables you to specify PKCS #11 URIs instead
    of paths to locally stored private keys, and simplifies creating scripts for tasks
    that require safely stored private keys and certificates. For example:


    ```

    $ wget -private-key ''pkcs11:token=softhm;id=%01;type=private;pin=value-111111''
    --

    certificate ''pkcs11:token=softhm;id=%01;type=cert'' https://example.com/

    ```'
