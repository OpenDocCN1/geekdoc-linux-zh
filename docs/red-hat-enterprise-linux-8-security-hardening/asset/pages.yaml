- img_proc: true
  md: 'See the HTTPS (SSL/TLS) Options using the wget(1) man page for more information.


    curl


    To specify ciphers use the curl tool, use the --ciphers option and provide a colon-separated
    list of ciphers as a value. For example:


    ```

    $ curl https://example.com --ciphers DES-CBC3-SHA:RSA-DES-CBC3-SHA

    ```


    See the curl(1) for more information.


    # Firefox


    Even though you cannot opt out of system-wide cryptographic policies in the Firefox
    web browser, you can further restrict supported ciphers and TLS versions in Firefox''s
    Configuration Editor. Type about:config in the address bar and change the value
    of the security.tls.version.min option as required. Setting security.tls.version.min
    1 allows TLS 1.0 as the minimum required, security.tls.version.min 2 enables TLS
    1.1, and so on.


    # OpenSSH


    To opt out of system-wide cryptographic policies for OpenSSH server, uncomment
    the line with the CRYPTO_POLICY= variable in the /etc/sysconfig/sshd file. After
    change, values that you specify in the Ciphers, MACs, KexAlgorithms, and GSSAPIKexAlgorithms
    sections in the /etc/ssh/sshd_config file are not overridden. Use the ssh_config(5)
    man more information.


    # Libreswan


    To allow the Libreswan IPSec use using the IKE1 protocol, comment out the following
    line in the /etc/ipsec.conf:


    ```

    # include /etc/crypto-policies/back-ends/libreswan.config

    ```


    Then add the ikev2=never option to your connection configuration. See the ipsec.conf(5)
    man page for more information.


    # Additional resources


    +   - For more details, see the update-crypto-policies(8) man page.


    # 3.6. CUSTOMIZING SYSTEM-WIDE CRYPTOGRAPHIC POLICIES WITH POLICY MODIFIERS


