    in the ossp_report.html file:


    ```

    $ oscap xccdf eval --report ossp_report.html --profile ossp /usr/share/xml/scap/content/ssg-rhel8-ds.xml

    ```


    Additional resources


    +   - scap-security-guide(8) and oscap(8) man pages


