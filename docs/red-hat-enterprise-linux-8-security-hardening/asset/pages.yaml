    ```


    Use debug mode to identify a reason. Because the output of the facolicyd --debug
    command is verbose and you can stop it by pressing Ctrl+C or killing the corresponding
    process, redirect the error output to a file:


    ```

    # facolicyd --debug facolicyd.output &

    [1] 51341

    ```


    Alternatively, you can run facolicyd debug mode in another terminal.


    Repeat the command that was not permitted:


    ```

    $ /tmp/ls

    bash: /tmp/ls: Operation not permitted

    ```


    Stop debug mode by resuming it in the foreground and pressing Ctrl+C:


    ```

    # fg

    facolicyd --debug

    ^Cshut down...

    Inter-thread max queue depth 1

    Allowed accesses: 2

    Denied accesses: 1

    ...]

    ```


    Alternatively, kill the process of facolicyd debug mode:


    ```

    # kill 51341

    ```


    Find a rule that denies the execution of your application:


    ```

    # cat facolicyd.output

    ...]

    rule:9 dec=deny_audit perm=execute auid=1000 pid=51362 exe=/usr/bin/bash file=/tmp/ls

    type=application/x-executable

    ...]

    ```


    Add a new allow rule before the rule that denied the execution of your custom
    binary in the /etc/facolicyd/facolicyd.rules file. The output of the previous
    command indicated that the rule is number 9 in this example:


    ```

    allow perm=execute exe=/usr/bin/bash trust=1 : path=/tmp/ls ftype=application/x-executable

    trust=0

    ```


    Alternatively, you can allow executions of all binaries in the /tmp directory
    by adding the following rule in the /etc/facolicyd/facolicyd.rules file:


    ```

    allow perm=execute exe=/usr/bin/bash trust=1 : dir=/tmp/ all trust=0

    ```'
