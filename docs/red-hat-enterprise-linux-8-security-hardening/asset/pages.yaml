    # 12.4. CREATING A CUSTOM POLICY FOR USB DEVICES


    The following procedure contains steps for creating a rule set for USB devices
    that reflects the requirements of your scenario.


    Prerequisites


    +   * The usbguard service is installed and running.


    +   * The /etc/usbguard/rules.conf file contains an initial rule set generated
    by the usbguard generate-policy command.


    Procedure


    +   1. Create a policy which authorizes the currently connected USB devices, and
    store the generated rules to the rules.conf file:


    ```

    # usbguard generate-policy --no-hashes > ./rules.conf

    ```


    The --no-hashes option does not generate hash attributes for devices. Avoid hash
    attributes in your configuration settings they are not persistent.


    +   2. Edit the rules.conf file with a text editor of your choice, for example:


    ```

    # vi ./rules.conf

    ```'
