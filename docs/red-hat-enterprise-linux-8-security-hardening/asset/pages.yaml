  md: '+   A LUKS1 device is marked as being used by a Policy-Based Decryption (PBD
    - Clevis) solution. The cryptsetup tool refuses to convert the device when some
    luksmeta metadata are detected.


    +   A device is active. The device must be in the inactive state before any conversion
    is possible.


    # 8.3. OPTIONS FOR DATA PROTECTION DURING LUKS2 RE-ENCRYPTION


    LUKS2 provides several options that prioritize performance or data protection
    during the re-encryption process:


    # checksum


    This is the default mode. It balances data protection and performance. This mode
    stores individual checksums of the sectors in the re-encryption area, so the recovery
    process can detect sectors LUKS2 already re-encrypted. The mode requires that
    the block device sector is atomic.


    # journal


    That is the safest mode but also the slowest. This mode writes the re-encryption
    area in the binary area, so LUKS2 writes the data.


    # none


    This mode prioritizes performance and provides no data protection. It protects
    the data only against safe termination, such as the SIGTERM signal or the user
    pressing Ctrl+C. Any unexpected system crash or application crash might result
    in data corruption.


    You can select the mode using the --resilience option of cryptsetup.


    If a LUKS2 re-encryption process terminates unexpectedly by force, LUKS2 can perform
    the recovery in one of the following ways:


    +   Automatically, during the next LUKS2 device open action. This action is triggered
    either by the cryptsetup open command or by attaching the device with system-cryptsetup.


    +   Manually, by using the cryptsetup repair command on the LUKS2 device.


    # 8.4. ENCRYPTING EXISTING DATA ON A BLOCK DEVICE USING LUKS2


    This procedure encrypts existing data on a net not yet encrypted device using
    the LUKS2 format. A new LUKS header is stored in the head of the device.


    # Prerequisites


    +   The block device contains a file system.


    +   You have backed up your data.'
