  md: '# Use Cases


    # Watching file access


    Audit can track whether a file or a directory has been accessed, modified, executed,
    or the file’s attributes have changed. This is useful, for example, to detect
    access to important files and have an Audit trail available in case of these files
    is corrupted.


    # Monitoring system calls


    Audit can be configured to generate a log entry every time a system call is used.
    This can be used, for example, to track changes to the system time by monitoring
    `settimeofday`, `clock_adjime`, and other-related system calls.


    # Recording commands run by a user


    Audit can track whether a file has been executed, so rules can be defined to record
    every execution of a particular command. For example, a rule can be defined for
    every executable in the `/bin` directory. Recording the log entries can be searched
    by user ID to generate an Audit trail of commands performed.


    # Recording execution of system pathnames


    Aside from watching file which translates to an inode at rule invocation, Audit
    can now watch the execution of a path even if it does not exist at rule invocation,
    or if the file is replaced after rule invocation. This allows rules to continue
    work after upgrading a program executable or before it is installed.


    # Recording security events


    The `pam_failsock` authentication module is capable of recording failed login
    attempts. Audit can be set up to record failed login attempts as provides additional
    information about the user who attempted to log.


    # Searching for events


    Audit provides the `ausearch` utility, which can be used to filter the log entries
    and provide a complete audit trail based on several conditions.


    # Running summary reports


    The `areport` utility can be used to generate, among other things, daily reports
    of recorded events. system administrator can analyze these reports and investigate
    suspicious activity further.


    # Monitoring network access


    The `iptables` and `ebtables` can be configured to trigger Audit events, allowing
    system administrators to monitor network access.


    ![](img/ce7756f7a90c9abeaf166ca2952129eb_83_0.png)


    > NOTE

    System performance may be affected depending on the amount of information that
    is collected by Audit.


    # 10.2 AUDIT SYSTEM ARCHITECTURE


    The Audit system consists of two main parts: the user-space applications and utilities,
    and the kernel-side system call. The kernel component receives system calls from
    user-space applications and filters them through one of the following filters:
    `user`, `task`, `fstype`, or `exit`.


    Once a system call passes the `exclude` filter, it is sent through one of the
    aforementioned filters, which, based on the Audit rule configuration, sends it
    to the Audit daemon for further processing.'
  merge: -1
  pgno: 83
- img_proc: true
  md: 'The user-space Audit daemon collects the information from the kernel and creates
    entries in a log file. Other Audit user-space utilities interact with the Audit
    daemon, the kernel Audit component, or the Audit log files:


    +   - auditctl – the Audit control utility interacts with the kernel Audit component
    to manage rules and to control many parameters of the event generation process.


    +   - The remaining Audit takes the contents of the Audit log files as input and
    generate output based on user''s requirements. For example, the aureport utility
    generates a report of all recorded events.


    In RHEL 8, the Audit dispatcher daemon (**audisp**) functionality is integrated
    into the Audit daemon (**audit**). Configuration of files for interaction of real-time
    analytical programs with Audit events are located in the **/etc/audit/plugins/**
    directory by default.


    # 10.3. CONFIGURING AUDIT FOR A SECURITY ENVIRONMENT


    The default audit configuration should be suitable for most environments. However,
    if your environment must meet strict security policies, the following settings
    are suggested for the Audit configuration in the **/etc/audit/auditd.conf** file:


    **log_file**


    The directory that holds the Audit log (usually /var/log/audit/) should reside
    on a separate mount point. This prevents other processes from consuming space
    in this directory and provides accurate detection of the remaining space for the
    Audit daemon.


    **max_log_file**


    Specifies the maximum size of a single Audit log file, must be set to make full
    use of the available space on the partition that holds the Audit log files.


    **max_log_file_action**


    Decides what action is taken once the limit in **max_log_file** is reached, should
    be set to **keep_logs** to prevent Audit logs from being overwritten.


    **space_left**


    Specifies the amount of free space on the disk for which an action is set in the
    **space_left** parameter is triggered. Must be set to a number that gives the
    administrator enough time to respond and free up disk. The **space_left** value
    depends on the rate at which the Audit log files are generated.


    **space_left_action**


    It is recommended to set the **space_left_action** parameter to **email** or **exec**
    with an appropriate notification method.


    **admin_space_left**


    Specifies the absolute minimum amount of free space for which an action is set
    in the **admin_space_left_action** parameter is triggered, must be set to a value
    that leaves enough space for log actions performed by the administrator.


    **admin_space_left_action**


    Should be set to **single** to put the system into single-user mode and allow
    the administrator to free up some disk.


    **disk_full_action**


    Specifies an action triggered when no free space is available on the partition
    that holds the Audit log files, must be set to **halt** or **single**. This ensures
    that the system is shut down or operating in single-user mode when Audit can no
    longer log events.'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# disk_error_action


    Specifies that an action error is detected on the partition that holds the Audit
    log files, must be set to **syslog**, **single**, or **halt**, depending on your
    local security policies regarding the handling of hardware malfunctions.


    flush


    Should be set to **incremental_async**. It works in combination with the **freq**
    parameter, which determines how many records can be sent to the disk before forcing
    hard synchronization. The **freq** parameter should be set to **100**. These parameters
    ensure Audit event data is synchronized with the log files on the disk while keeping
    good performance for bursts of activity.


    The remaining configuration options should be set according to your local security
    policy.


    # 10.4. STARTING AND CONTROLLING AUDIT


    Once **auditd** is configured, start the service to collect Audit information
    and store it in the log files. Use the following command as the root user to start
    **auditd**.


    ```

    # service auditd start

    ```


    To configure **auditd** to start at boot time:


    ```

    # systemctl enable auditd

    ```


    A number of other actions can be performed on **auditd** using the **service auditd
    action** command, where action can be one of the following:


    stop


    Stops **auditd**.


    restart


    Restarts **auditd**.


    reload or **force-reload**


    Reloads the configuration of **auditd** from the **etc/audit/auditd.conf** file.


    rotate


    Rotates the log files in the **/var/log/audit/** directory.


    resume


    Resumes logging of Audit events after it has been previously suspended, for example,
    when there is not enough free space on the disk partition that holds the Audit
    log files.


    condestart **auditd** only if it is already running.


    status


    Displays the running status of **auditd**.


    > NOTE

    nThe **service** command is the only way to correctly interact with the **auditd**
    daemon. You need to use the **service** command so that the **audit** value is
    properly recorded. You can use the **systemctl** command only for two actions:
    **enable** and **status**.


    ![](img/ce7756f7a90c9abeaf166ca2952129eb_85_0.png)'
