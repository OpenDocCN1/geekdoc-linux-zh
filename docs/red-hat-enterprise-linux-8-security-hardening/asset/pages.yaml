  md: '# CHAPTER 11. CONFIGURING AND MANAGING APPLICATION WHITELISTS


    Application whitelisting efficiently prevents the execution of unknown and potentially
    malicious software.


    # 11.1. FOLICYD WHITELISTING IN RHEL


    The facolicyd software framework introduces a form of application whitelisting
    and blacklisting based on a user-defined policy. The application whitelisting
    feature provides one of the most efficient ways to prevent unrestrained and possibly
    malicious applications on the system.


    The facolicyd framework provides the following components:


    +   - facolicyd service

    - facolicyd command-line utilities

    - facolicyd YUM plugin

    - facolicyd rule language


    The administrator can define the allow and deny execution rules for any application
    with the possibility of auditing based on a path, hash, MIME type, or trust.


    Application whitelisting introduces the concept of trust. An application is trusted
    when it is properly installed by the system package manager, and therefore it
    is registered in the system RPM database. The facolicyd daemon uses the RPM database
    as a list of trusted binaries and scripts. The facolicyd plugin registers any
    system update that is handled by the YUM package manager. The plugin notifies
    the facolicyd daemon about changes in this database.


    An installation using the rpm utility requires a manual refresh of the database,
    and other ways of adding applications require the creation of custom rules and
    restarting the facolicyd service.


    The facolicyd service configuration is located in the /etc/facolicyd/ directory
    with the following structure:


    +   - facolicyd.rules file contains allow and deny execution rules.

    - facolicyd.conf file contains daemon''s configuration options. This file is useful
    primarily for performance-tuning purposes.


    # Additional resources


    +   - See the facolicyd(8), facolicyd.rules(5), and facolicyd.conf(5) man pages
    for more information.


    # 11.2. DEPLOYING APPLICATION WHITELISTING


    To deploy the facolicyd framework in RHEL:


    # Procedure


    +   1. Install the facolicyd package:'
