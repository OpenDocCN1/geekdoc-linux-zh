- md: '

    Administrators who fail to patch their systems are one of the greatest threats
    to server security. This applies as much to inexperienced administrators as it
    does to overconfident or unmotivated administrators.


    Some administrators fail to patch their servers and workstations, while others
    fail to watch log messages from the system kernel or network traffic. Another
    common error is when default passwords or keys to services are left unchanged.
    For example, some databases assume that the system administrator changes these
    passwords because the database developers assume so immediately after installation.
    If a database administrator fails to change this password, an inexperienced cracker
    can use a well-known default password to gain administrative privileges to the
    database. These are only a few examples of how inattentive administration can
    lead to compromised servers.


    ## Inherently secure services


    Even the most vigilant organization can fall victim to vulnerabilities if the
    network services they choose are inherently insecure. For instance, there are
    many services developed under the assumption that they are over trusted networks;
    however, this assumption fails as soon as the service becomes available over the
    Internet — which is inherently untrusted.


    One category of insecure network services are those that require encrypted user
    names and passwords for authentication. Telnet and FTP are such services. If packet
    sniffing is monitoring traffic between the remote user and such a service user,
    names and passwords can be easily intercepted.


    Inherently, such services can also more easily fall prey to the security industry
    terms the *man-in-the-middle* attack. In this type of attack, a cracker redirects
    network traffic by tracking a cracked server on the network to point to his machine
    instead of the intended server. Once someone opens a remote connection to the
    server, the attacker''s machine acts as an invisible conduit, sitting quietly
    between the remote service and the unsus user capturing information. In this way
    a cracker can gather administrative passwords and raw data without the server
    or the user realizing it.


    Another category of insecure services includes file systems and information services
    such as NFS or NIS, which are developed explicitly for LAN usage but are, unfortunately,
    extended to include WANs (for remote users). NFS does not, by default, have any
    authentication or security mechanisms configured to prevent a cracker from mounting
    the NFS share and accessing anything contained therein. NIS, as well as information
    that must be known by every computer on a network, including passwords and file
    permissions, within a plain text ASCII or DBM (ASCII-derived) database. A cracker
    who gains access to this database can then access every user on a network, including
    the administrator''s account.


    By default, Red Hat Enterprise Linux 8 is released with all such services turned
    off. However, since administrators find themselves forced to use those services,
    careful configuration is critical.


    ## 1.6.3. Threats to workstation and home PC security


    Workstations and home PCs may not be as prone to attack as networks or servers,
    but since they often contain sensitive data, such as credit card information,
    they are targeted by system crackers. Workstations can also be co-opted without
    the user''s knowledge and used by attackers as "slave" in coordinated attacks.
    For these reasons, knowing the vulnerabilities of a workstation can save users
    the headache of reinstalling the operating system, or worse, recovering data from
    theft.


    ## Bad passwords


    Bad passwords are one of the easiest ways for an attacker to gain access to a
    system.


    ## Vulnerable client applications


    ## CHAPTER 1. OVERVIEW OF SECURITY HARDENING RHEL


    Although an administrator may have a fully secure and patched server, that does
    not mean users are secure when accessing it. For instance, if the server offers
    Telnet or FTP services over a public network, an attacker can capture the plain
    text usernames and passwords as they pass over the network, and then use the account
    information to access the user''s workstation.


    Even when using secure protocols, with SSH, a router may be vulnerable to attacks
    if they do not keep their client applications updated. SSH protocol version 1
    clients are vulnerable to an X-forwarding attack from malicious SSH servers. Once
    connected to the server, an attacker quickly capture any keystrokes and mouse
    clicks made by the client over the network. This problem was fixed in the SSH
    version 2 protocol, but it is up to the user to keep track of what applications
    have such vulnerabilities and update them as necessary.


