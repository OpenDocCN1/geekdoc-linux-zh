    ## 12.3. BLOCKING AND AUTHORIZING A USB DEVICE USING CLI


    This procedure outlines how to authorize and block a USB device using the **usbguard**
    command.


    ### Prerequisites


    - The **usbguard** service is installed and running.


    ### Procedure


    - List USB devices recognized by **USBGuard:**


    ```

    # usbguard list-devices

    allow: id 1d6b:0002 serial "0000:02:06.7" name "EHCI Host Controller"

    "JD00bBiktys2ct3mSqKopnOVV2hMGYADWt+ouIF2s=" parent-hash

    "4PHGcaDWKPtKdYwpIRG722cB9iG9f9ea93+Gt9c=" via-port "usb1" with-interface

    09:00:00

    block: 6: id 1ab1:0000024937962" name "Voyager"

    "CrXiaWlf2ZU5+WckOE7yORSO82Mzbun7Hdb95Q=" parent-hash

    "JD00bBiktys2ct3mSqKopnOVV2hMGYADWt+ouIF2s=" via-port "1-3" with-interface

    08:06:50

    ```


    2. Authorize the device 6 to interact with the system:


    ```

    # usbguard allow-device 6

    ```


    3. Deauthorize and remove the device 6:


    ```

    # usbguard reject-device 6

    ```


    4. Deauthorize and retain the device 6:


    ```

    # usbguard block-device 6

    ```


    ## NOTE


    USBGuard uses the block and reject terms with the following meanings:


    - *block*: do not interact with this device for now.

    - *reject*: ignore this device as if it does not exist.


    ## Additional resources


    - *List all options of the usbguard command:*


    ```

    $ usbguard --help

    ```


    - *usbguard(1) man page


    ## 12.4. CREATING A CUSTOM POLICY FOR USB DEVICES


    The following procedure contains steps for creating a rule set for USB devices
    that reflects the requirements of your scenario.


    ### Prerequisites


    - *The usbguard service is installed and running.

    - *The /etc/usbguard/rules.conf- file contains an initial rule set generated by
    the usbguard generate-policy command.


    ### Procedure


    - 1. Create a policy which authorizes the currently connected USB devices, and
    store the generated rules to the rules.conf file:


    ```

    # usbguard generate-policy --no-hashes > ./rules.conf

    ```


    The --no-hashes option does not generate hash attributes for devices. Avoid hash
    attributes in your configuration settings they are not persistent.


    - 2. Edit the rules.conf file with a text editor of your choice, for example:


    ```

    # vi ./rules.conf

    ```


    # Red Hat Enterprise Linux 8 Security hardening


    - 3. Add, remove, or edit the rules as required. For example, the following rule
    allows only devices with a single mass storage interface to interact with the
    system:


    ```

    allow with-interface equals ( 08::* )

    ```


    See the usbguard-conf(5) man page for a detailed rule-language description and
    more examples.


    - 4. Install the updated policy:


    ```

    # install -m 0600 -o root -g root /etc/usbguard/rules.conf

    ```


    - 5. Restart the usbguard daemon to apply your changes:


    ```

    # systemctl restart usbguard

    ```


    ## Verification steps


    - 1. Check that your custom rules are in the active policy, for example:


    ```

    # usbguard list-rules

    ...

    4: allow with-interface 08::*

    ..

    ```


    ## Additional resources


    - usbguard-rules.conf(5) man page


    ## 12.5. AUTHORIZING USERS AND GROUPS TO USE THE USBGUARD IPC INTERFACE


    Use this procedure to authorize a specific user or a group to use the USBGuard
    public IPC interface. By default, only the root user can use this interface.


    ### Prerequisites


    - usbguard service is installed and running.

    - /etc/usbguard/rules.conf file contains an initial rule set generated by the
    generate-policy command.


    ### Procedure


    - 1. Edit the /etc/usbguard/usbguard-daemon.conf file with a text editor of your
    choice:


    ```

    # vi /etc/usbguard/usbguard-daemon.conf

    ```


    - 2. For example, add a line with a rule that allows all users in the wheel group
    to use the IPC interface, and save the file:


    ```

    IPCAllowGroups=wheel

    ```


    3. You can add users or groups with the **usbguard** command. For example, the
    following command enables the joesec user to have full access to the **Devices**
    and **Exceptions** sections. Furthermore, joesec can list the current policy and
    listen to policy signals.


    ```

    # usbguard add-user joesec --devices ALL --policy list,listen --exceptions ALL

    ```


    To remove the granted permissions for the joesec user, use the **usbguard remove-user**
    command.


    4. Restart the **usbguard** daemon to apply your changes:


    ```

    # systemctl restart usbguard

    ```


    ## Additional resources


    - **usbguard(1)** and **usbguard-rules.conf(5)** man pages


    ## 12.6. LOGGING USBGUARD AUTHORIZATION EVENTS TO THE LINUX AUDIT LOG


    Use the following steps to integrate logging of USBguard authorization events
    to the standard Linux Audit log. By default, the **usbguard** daemon logs events
    to the `/var/log/usbguard/usbguard-audit.log` file.


    ### Prerequisites


    - The **usbguard** service is installed and running.

    - The **auditd** service is running.


    ### Procedure


    - 1. Edit the **usbguard-daemon.conf** file with a text editor of your choice:


    ```

    # vi /etc/usbguard/usbguard-daemon.conf

    ```


    - 2. Change the **AuditBackend** option from **FileAudit** to **LinuxAudit:**


    ```

    AuditBackend=LinuxAudit

    ```


    - 3. Restart the **usbguard** daemon to apply the configuration change:


    ```

    # systemctl restart usbguard

    ```


    ## Verification steps


    - 1. Query the **audit** daemon log for a USB authorization event, for example:


    ```

    # ausearch -ts recent -m USER_DEVICE

    ```


    ## Additional resources


    - usbguard-daemon.conf(5) man page


    ## 12.7. ADDITIONAL RESOURCES


    - usbguard(1), usbguard-rules.conf(5), usbguard-daemon.conf(8), and usbguard-daemon.conf(5)
    man pages


    - USBGuard Homepage

