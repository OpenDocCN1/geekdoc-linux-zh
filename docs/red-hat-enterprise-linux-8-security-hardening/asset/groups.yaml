    # CHAPTER 10. AUDITING THE SYSTEM


    Audit does not provide additional security to your system; rather, it can be used
    to discover violations of security policies used on your system. These violations
    can further be prevented by additional security measures such as SELinux.


    ## 10.1. LINUX AUDIT


    The Linux Audit system provides a way to track security-relevant information on
    your system. Based on pre-configured rules, Audit generates log entries to record
    as much information about the events that are happening on your system as possible.
    This information is crucial for mission-critical environments to determine the
    violator of policy and the actions they perform.


    The following list summarizes some of the information that Audit is capable of
    recording in its log files:


    - Date and time, and outcome of an event.

    - Sensitivity labels of subjects and objects.

    - Association of an event with the identity of the user who triggered the event.

    - All modifications to Audit configuration and attempts to access Audit log files.

    - All uses of authentication mechanisms, such as SSH, Kerberos, and others.

    - Changes to any trusted database, such as /etc/passwd.

    - Attempts to import or export information into or from the system.

    - Include or exclude events based on user identity, subject and object labels,
    and other attributes.


    The use of the Audit system is also a requirement for a number of security-related
    certifications. Audit is designed to meet or exceed the requirements of the following
    certifications or compliance guides:


    - Controlled Access Protection Profile (CAPP)

    - Labeled Security Protection Profile (LSPP)

    - Set Base Access Control (RSBAC)

    - National Industrial Security Program Operating Manual (NISPM)

    - Federal Information Security Management Act (FISMA)

    - Payment Card Industry – Data Security Standard (PCI-DSS)

    - Security Technical Implementation Guides (STIG)


    Audit has also been:


    - Evaluated by National Information Assurance Partnership (NIAP) and Best Security
    Industries (BSI).

    - Certified to LSPP/CAPP/RSBAC/EAL4+ on Red Hat Linux 5.

    - Certified to Operating System Protection Profile / Evaluation Assurance Level
    4 (OSPP/EAL4+) on Red Hat Linux 6.


    ## Use Cases


    ### Watching file access


    Audit can track whether a file or a directory has been accessed, modified, executed,
    or the file’s attributes have changed. This is useful, for example, to detect
    access to important files and have an Audit trail available in case of these files
    is corrupted.


    ### Monitoring system calls


    Audit can be configured to generate a log entry every time a system call is used.
    This can be used, for example, to track changes to the system time by monitoring
    `settimeofday`, `clock_adjtime`, and other-related system calls.


    ### Recording commands run by a user


    Audit can track whether a file has been executed, so rules can be defined to record
    every execution of a particular command. For example, a rule can be defined for
    every executable in the `/bin` directory. Recording the log entries can be searched
    by user ID to generate an Audit trail of commands performed.


    ### Recording execution of system pathnames


    Aside from watching file which translates to an inode at rule invocation, Audit
    can now watch the execution of a path even if it does not exist at rule invocation,
    or if the file is replaced after rule invocation. This allows rules to continue
    work after upgrading a program executable or before it is installed.


    ### Recording security events


    The `pam_failsock` authentication module is capable of recording failed login
    attempts. Audit can be set up to record failed login attempts as provides additional
    information about the user who attempted to log.


    ### Searching for events


    Audit provides the `ausearch` utility, which can be used to filter the log entries
    and provide a complete audit trail based on several conditions.


    ### Running summary reports


    The `areport` utility can be used to generate, among other things, daily reports
    of recorded events. system administrator can analyze these reports and investigate
    suspicious activity further.


    ### Monitoring network access


    The `iptables` and `ebtables` can be configured to trigger Audit events, allowing
    system administrators to monitor network access.


    > NOTE

    System performance may be affected depending on the amount of information that
    is collected by Audit.


    ## 10.2 AUDIT SYSTEM ARCHITECTURE


    The Audit system consists of two main parts: the user-space applications and utilities,
    and the kernel-side system call. The kernel component receives system calls from
    user-space applications and filters them through one of the following filters:
    `user`, `task`, `fstype`, or `exit`.


    Once a system call passes the `exclude` filter, it is sent through one of the
    aforementioned filters, which, based on the Audit rule configuration, sends it
    to the Audit daemon for further processing.


    The user-space Audit daemon collects the information from the kernel and creates
    entries in a log file. Other Audit user-space utilities interact with the Audit
    daemon, the kernel Audit component, or the Audit log files:


    - auditctl – the Audit control utility interacts with the kernel Audit component
    to manage rules and to control many parameters of the event generation process.

    - The remaining Audit takes the contents of the Audit log files as input and generate
    output based on user''s requirements. For example, the aureport utility generates
    a report of all recorded events.


    In RHEL 8, the Audit dispatcher daemon (**audisp**) functionality is integrated
    into the Audit daemon (**audit**). Configuration of files for interaction of real-time
    analytical programs with:


    ## 10.3. CONFIGURING AUDIT FOR SECURITY


    The following settings are located in **/etc/audit/auditd.conf**:


    **log**: The directory where Audit logs are stored, should reside on /var/log/audit/.


    **max_file**: The maximum size of a log file in kilobytes before it is rotated,
    is set.


    **max_log_files**: The number of log files to keep before deleting the oldest.


    **max_file_action**: Decides what action is taken when the log file limit is reached,
    is set to **halt**, **syslog**, or **single**.


    **disk_full_action**: Specifies what action is taken when there is no free space
    on the disk, is set to **halt** or **single**.


    **disk_error_action**: Specifies what action is taken when an error is detected
    on the partition that holds the Audit log files, is set to **syslog**, **single**,
    or **halt**.


    **flush**: Works in combination with the **freq** parameter, which determines
    how many records can be sent to the disk before forcing synchronization. Should
    be set to **incremental_async**.


    **freq**: The number of records sent to the disk before hard synchronization,
    is set to **100**.


    **space_left**: The absolute minimum amount of free space (in kilobytes) for which
    an action is triggered.


    **space_left_action**: Specifies the action taken when the free space limit is
    reached, is set to **email** or **exec**.


    ## 10.4 STARTING AND CONTROLLING AUDIT


    Once **auditd** is configured, start the service to collect Audit information
    and store it in the log files. Use the following command as the root user to start
    **auditd**.


    ```

    # service auditd start

    ```


    To configure **auditd** to start at boot time:


    ```

    # systemctl enable auditd

    ```


    A number of other actions can be performed on **auditd** using the **service auditd
    action** command, where action can be one of the following:


    - stop: Stops **auditd**.

    - restart: Restarts **auditd**.

    - reload or **force-reload**: Reloads the configuration of **auditd** from the
    **etc/audit/auditd.conf** file.

    - rotate: Rotates the log files in the **/var/log/audit/** directory.

    - resume: Resumes logging of Audit events after it has been previously suspended,
    for example, when there is not enough free space on the partition that holds the
    Audit log files.

    - condestart: **auditd** only if it is already running.

    - status: Displays the running status of **auditd**.


    > NOTE

    The **service** command is the only way to correctly interact with the **auditd**
    daemon. You need to use the **service** command so that the **audit** value is
    properly recorded. You can use the **systemctl** command only for two actions:
    **enable** and **status**.

