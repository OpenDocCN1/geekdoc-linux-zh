    # CHAPTER 3. USING SYSTEM-WIDE CRYPTOGRAPHIC POLICIES


    Crypto policy is a system that configures the core cryptographic subsystems, covering
    the TLS, IPC, SSH, DNSSec and Kerberos protocols. It provides a small set of policies,
    which the administrator can select.


    ## 3.1. SYSTEM-WIDE CRYPTOGRAPHIC POLICIES


    Once a system-wide policy is set up, applications in RHEL follow it and refuse
    to use algorithms and protocols that do not meet the policy, unless you explicitly
    request the application to do so. That is, the policy applies to the default behavior
    of applications when running with the system-provided configuration but you can
    override it if required.


    Red Hat Linux 8 contains the following policy levels:


    | Policy | Description |

    | :--- | :--- |

    | DEFAULT | The default system-wide cryptographic policy offers secure settings
    for current threat models. It allows the TLS 1.2 and 1.3 protocols, as well as
    IKE2 and SSH2 protocols. The RSA keys and Diffie-Hellman parameters are accepted
    if they are at least 2048 bits long |

    | LEGACY | This policy ensures maximum compatibility with Red Hat Enterprise Linux
    5 and earlier; it is less secure due to an increased attack surface. In addition
    to the DEFAULT level algorithms and protocols, it includes support for the TLS
    1.0 and 1.1 protocols. The algorithms DSA, 3DES, and RC4 are excluded, while RSA
    keys and Diffie-Hellman parameters are accepted if they are at least 1023 bits
    long |

    | FUTURE | A conservative security level that is better to withstand any near-term
    future attacks. This level does not allow the use of SHA-1 in signature algorithms.
    The RSA keys and Diffie-Hellman parameters are accepted if they are at least 3072
    bits long |

    | FIPS | A policy level that conforms with the FIPS140-2 requirements. This is
    used internally by the fips-mode-setup tool, which switches the RHEL system into
    FIPS mode. |


    > IMPORTANT

    Because a cryptographic key used by a certificate on the Customer Portal API does
    not meet the requirements of the FUTURE system-wide cryptographic policy, the
    redhat-support-tool utility does not work with this policy level at the moment.


    To work around this problem, use the DEFAULT crypto policy while connecting to
    the Customer Portal API.


    > NOTE

    The specific algorithms and ciphers described in the policy levels as are available
    only if an application supports them.


    ### Tool for managing crypto policies

    To view or change the current system-wide cryptographic policy, use the update-crypto-policies
    tool, for example:


    ```

    $ update-crypto-policies --show

    DEFAULT

    # update-crypto-policies --set FUTURE

    Setting system policy to FUTURE

    ```


    To ensure that the change of the cryptographic policy is applied, restart the
    system.


    ### Strong crypto defaults by removing insecure cipher suites and protocols

    The following list contains cipher suites and protocols removed from the core
    cryptographic libraries in RHEL 8. They are not present in the sources, or their
    support is disabled during the build, so applications cannot use them.


    - DES (since RHEL 7)

    - All export cipher suites (since RHEL 7)

    - MD5 in signatures (since RHEL 7)

    - SSLv2 (since RHEL 7)

    - SSLv3 (since RHEL 8)

    - All ECC curves < 224 bits (since RHEL 6)

    - All binary field ECC curves (since RHEL 6)


    ## Cipher suites and protocols disabled in all policy levels


    The following cipher suites and protocols are disabled in all crypto policy levels.
    They can be enabled by only an explicit configuration of individual protocols.


    - DH with parameters < 1024 bits

    - RSA with key size < 1024 bits

    - Camellia

    - ARIA

    - SEED

    - IDEA

    - Integrity-only cipher suites

    - TLS CBC mode cipher suites using SHA-384 HMAC

    - AES-CCM8

    - All ECC curves incompatible with TLS 1.3, including secp256k

    - Ikev1 (since RHEL 8)


    ## Cipher suites and protocols enabled in the crypto-policy levels


    The following table shows the enabled cipher suites and protocols in all four
    crypto-policy levels.


    ### Red Hat Enterprise Linux 8 Security hardening


    | | LEGACY | DEFAULT | FIPS | FUTURE |

    | :--- | :--- | :--- | :--- | :--- |

    | IKEv1 | no | no | no | no |

    | 3DES | yes | no | no | no |

    | RC4 | yes | no | no | no |

    | DH | min. 1024-bit | min. 2048-bit | min. 2048-bit | min. 3072-bit |

    | RSA | min. 1024-bit | min. 2048-bit | min. 2048-bit | min. 3072-bit |

    | DSA | yes | no | no | no |

    | TLS v1.0 | yes | no | no | no |

    | TLS v1.1 | yes | no | no | no |

    | SHA-1 in digital signatures | yes | yes | no | no |

    | CBC mode ciphers | yes | yes | yes | no |

    | Symmetric ciphers < 256 bits | yes | yes | no |

    | SHA-1 in certificates | yes | yes | no |


    ## 3.2. SWITCHING THE SYSTEM-WIDE CRYPTOGRAPHIC POLICY COMPATIBLE WITH EARLIER
    RELEASES


    The system-wide policy in RHEL 8 allows compatibility with earlier releases, the
    LEGACY policy level is available.


    > WARNING

    > Switching to the LEGACY policy results in less security.


    ### Procedure

    1. To switch to the LEGACY policy, enter the following command:

    ```bash

    # update-crypto-policies --set LEGACY

    Setting system policy to LEGACY

    ```


    ## 3.3. SWITCHING THE SYSTEM TO FIPS MODE


    The system-wide policies contain a policy level that enables modules self-checks
    in accordance with Federal Processing Standard (FIPS) Publication 140-2.


    ### Procedure

    1. To enable FIPS mode in RHEL 8:

    ```bash

    # fips-mode-setup --enable

    Setting system policy to FIPS

    FIPS mode will be enabled.

    ```

    2. Please reboot the system for the setting to take effect:

    ```bash

    # reboot

    ```


    ### Verification steps

    1. After the restart, you can check the state of FIPS mode:

    ```bash

    # fips-mode-setup --check

    FIPS mode is enabled.

    ```


    ## 3.4. ENABLING FIPS MODE IN A CONTAINER


    To enable modules self-checks in accordance with the requirements by Federal Processing
    Standard (FIPS) Publication 140-2 in a container:


    ### Prerequisites

    - The host system must be switched in FIPS mode first.


    ### Procedure

    1. Mount the system-fips file on the container from the host.

    2. Set the FIPS policy level in the container:

    ```

    $ update-crypto-policies --set FIPS

    ```

    RHEL 8.2 introduced an alternative method for switching a container to FIPS mode.
    It requires only the following command in the container:

    ```

    # mount --bind /usr/share/crypto-policies/back-ends/FIPS /etc/crypto-policies/back-ends

    ```


    > NOTE

    In RHEL 8, the fips-setup command does not work properly in a container and it
    cannot be used to enable or check FIPS mode in this scenario.


    ## 3.5. EXCLUDING AN APPLICATION FROM FOLLOWING SYSTEM-WIDE CRYPTO POLICIES


    You can customize cryptographic settings used by your application preferably by
    configuring supported cipher suites and protocols directly in the application.


    You can also remove a symlink to your application from the /etc/crypto-policies/back-ends
    directory and replace it with your customized cryptographic settings. This configuration
    prevents the use of system-wide cryptographic policies for applications that exclude
    the back end.


    ### 3.5.1. Examples of opting out of system-wide crypto policies


    wget


    To customize cryptographic settings used by the wget downloader, use --secure-protocol
    and --ciphers. For example:


    ```

    $ wget --secure-protocol=TLSv1_1 --ciphers="SECURE128" https://example.com

    ```

