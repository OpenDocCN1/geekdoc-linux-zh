    # 6.9. DEPLOYING SYSTEMS THAT ARE COMPLIANT WITH A SECURITY PROFILE IMMEDIATELY
    AFTER INSTALLATION


    You can use OpenSCAP to deploy RHEL systems that are compliant with a security
    profile, such as OSSP or PCI-DSS, immediately after the installation process.
    Using this deployment method, you can apply specific rules that cannot be applied
    later using remediation scripts, for example a rule for password strength and
    partitioning.


