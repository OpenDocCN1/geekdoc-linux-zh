    # 9.13. BUILDING AUTOMATICALLY-ENROLLABLE VM IMAGES FOR CLOUD ENVIRONMENTS USING
    NBDE


    Deploying automatically-enrollable encrypted images in a cloud environment can
    provide a unique set of challenges. Like other virtualization environments, it
    is recommended to reduce the number of instances started from a single image to
    avoid sharing the LUKS master key.


    Therefore, the best practice is to create custom images that are not shared in
    any public repository and provide a base for the deployment of a limited amount
    of instances. The exact number of instances to create should be defined by deployment''s
    security policies and based on the risk tolerance associated with the LUKS master
    key attack vector.


    To LUKS-enabled automated deployments, such as Lorax or virt-install together
    with a Kickstart file should be used to ensure master key uniqueness during the
    image building process.


    Cloud environments enable two Tang server deployment options which we consider
    here. First, the Tang server can be deployed within the cloud environment itself.
    Second, the Tang server can be deployed outside of the cloud on independent infrastructure
    with a VPN link between the two infrastructures.


    Deploying Tang natively in the cloud allows for easy deployment. However, given
    that it shares infrastructure with the data persistence layer of ciphertext of
    other systems, it may be possible for both the Tang server''s private key and
    the Clevis metadata to be stored on the same physical disk. Access to this physical
    disk permits a full compromise of the ciphertext data.


    # IMPORTANT


    For this reason, Red Hat strongly recommends maintaining a physical separation
    between the location where the data is stored and the system where Tang is running.
    This separation between the cloud and the Tang server''s private key can not be
    accidentally combined with the Clevis metadata. It also provides local control
    of the Tang server if the cloud infrastructure is at risk.


    # 9.14. ADDITIONAL RESOURCES


    +   - the tang(8), clevis(1), jose(1), and clevis-luks-unlockers(7) man pages.


    +   - The How to set up Network-Bound Disk Encryption with multiple LUKS devices
    (Clevis + Tang unlocking) Knowledgebase article.'
