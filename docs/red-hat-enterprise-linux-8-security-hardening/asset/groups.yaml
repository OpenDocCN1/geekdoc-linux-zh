    # 第 7 章 使用 AIDE 检查完整性


    高级入侵检测环境 (AIDE) 是一种用于创建系统文件数据库的实用，然后使用该数据库来确保文件完整性并检测系统入侵。


    # 7.1. 安装 AIDE


    需要执行以下步骤安装 AIDE 并初始化其数据库。


    前提条件


    +   - AppStream 仓库已启用。


    操作步骤


    +   1. 安装 aide 软件包：

    ```bash

    # yum install aide

    ```

    2. 生成初始数据库：

    ```bash

    # aide --init

    ```


    > 在默认配置中，`aide --init` 命令会检查 `/etc/aide.conf` 文件中定义的一组目录和文件。要在 AIDE 数据库中包含额外的目录或文件，并更改它们的监控参数，请相应地编辑
    `/etc/aide.conf`。


    +   3. 开始使用 aide，从初始数据库文件名中删除 `.new` 字符串：

    ```bash

    # mv /var/lib/aide/aide.db.new /var/lib/aide/aide.db.gz

    ```

    4. 要更改 AIDE 数据库的位置，请编辑 `/etc/aide.conf` 文件并修改 `DBDIR` 变量。为了额外的安全，请将数据库、配置和 `/usr/sbin/aide`
    二进制文件存储在安全位置（例如只读介质）。


    # 7.2. 使用 AIDE 执行完整性检查


    前提条件


    +   - AIDE 已正确安装且数据库已初始化。参见第 7.1 节“安装 AIDE”。


    操作步骤


    +   1. 发起手动检查：

    ```bash

    # aide --check

    ```


    > 在默认配置中，`aide --init` 命令会检查 `/etc/aide.conf` 文件中定义的一组目录和文件。要在 AIDE 数据库中包含额外的目录或文件，并更改它们的监控参数，请相应地编辑
    `/etc/aide.conf`。


    +   3. 开始使用 aide，从初始数据库文件名中删除 `.new` 字符串：

    ```bash

    # mv /var/lib/aide/aide.db.new /var/lib/aide/aide.db.gz

    ```

    4. 要更改 AIDE 数据库的位置，请编辑 `/etc/aide.conf` 文件并修改 `DBDIR` 变量。为了额外的安全，请将数据库、配置和 `/usr/sbin/aide`
    二进制文件存储在安全位置（例如只读介质）。


    # 7.3. 更新 AIDE


    在验证更改后，`aide --init` 命令会检查 `/etc/aide.conf` 文件中定义的一组目录和文件。要在 AIDE 数据库中包含额外的目录或文件，并更改它们的监控参数，请相应地编辑
    `/etc/aide.conf`。

