    | 最常见于无线访问点和预配置服务器设备。 |

    | IP 欺骗 | 远程机器充当本地网络上的节点，发现服务器的漏洞并安装后门程序或木马以获得网络资源的控制。 | 欺骗相当困难，因为它涉及攻击者预测 TCP/IP
    序列号以与目标系统连接，但有许多工具可用于此类漏洞。取决于运行基于身份验证技术的目标系统（如 **rsh**、**telnet**、FTP 等），与 **ssh**
