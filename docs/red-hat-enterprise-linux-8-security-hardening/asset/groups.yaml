    # 9.5. DEPLOYING AN ENCRYPTION CLIENT FOR AN NBDE SYSTEM WITH TANG


    The following procedure contains steps to configure automated unlocking of an
    encrypted volume with a Tang network server.


    # Prerequisites


    +   * The Clevis framework is installed.

    * A Tang server is available.


    # Procedure


    +   1. To bind a Clevis encryption client to a Tang server, use the clevis encrypt
    tang sub-command:


    ```

    $ clevis encrypt tang ''{"url":"http://tang.srv:port"} < input-plain.txt > secret.jwe

    The advertisement contains the following signing keys:

    ```


    _Oslk0-E216qfdDiVmdoZjaA

    Do you wish to trust these keys? [ynN] y


    Change the http://tang.srv:port URL in the previous example where tang is installed.
    The secret,jwe output file contains your encrypted cipher text in the JSON Web
    Encryption format. This cipher text is read from the input-plain.txt file.


    Alternatively, if your configuration requires a non-interactive communication
    with a Tang server without SSH, you can download an advertisement and save it
    to a file:


    ```

    $ curl -sfg http://tang.srv:port -o adv.jws

    ```


    Use the advertisement in the adv.jws file for any following tasks, such as encryption
    of files or messages:


    ```

    $ echo ''hello'' | clevis encrypt tang ''{"url":"http://tang.srv:port","adv":"adv.jws"}
    ''

    ```


    +   2. To decrypt data, use the clevis decrypt command and provide the cipher
    text (JWE):'
