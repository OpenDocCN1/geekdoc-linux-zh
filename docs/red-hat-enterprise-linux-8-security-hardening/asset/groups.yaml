    - 2. 重启系统，然后使用“配置 LUKS 加密卷的手动注册”中描述的 `clevis luks bind` 命令执行绑定步骤，例如：\n```bash\n\
    # clevis luks bind -d /dev/sdb1 'http://tang.server'\n```\n- 3. 现在，LUKS 加密的可移动设备可以在您的\
    \ GNOME 桌面会话中自动解锁。绑定到 clevis 策略的设备也可以通过 `clevis luks unlock` 命令解锁：\n```bash\n\
    # clevis luks unlock -d /dev/sdb1\n```\n\n当您使用 TPM 2.0 策略而不是 Tang 服务器时，您可以使用类似的程序。\n\
    \n# 附加资源\n\n欲更多信息，请参阅以下手页：\n\n- clevis-luks-unlockers(7)\n\n# 9.11. 部署高可用 NBDE\
    \ 系统\n\nTang 提供了两种方法构建高可用部署：\n\n### 客户端冗余（推荐）\n\n客户端应配置为绑定多个 Tang 服务器的能力。在这种设置中，每个\
    \ Tang 服务器都有自己的密钥，并可以通过联系这些服务器的子集来解密。Clevis 已经通过 **sss** 插件支持此工作流。Red Hat 推荐这种方法用于高可用部署。\n\
    \n### 密钥共享\n\n为了冗余，可以部署多个 Tang 实例。要设置第二个或任何后续实例，请安装 **tang** 软件包并使用通过 SSH 的 **rsync**\
    \ 将密钥目录复制到新主机。注意，Red Hat 不推荐这种方法，因为共享密钥会增加密钥泄露的风险。\n\n# 9.11.1. 使用 Shamir 秘密共享实现高可用\
    \ NBDE\n\nShamir 秘密共享 (SSS) 是一种将秘密分成若干部分的加密方案。要重构该秘密，需要若干部分。该数量被称为阈值（threshold），SSS\
    \ 也称为阈值方案。\n\nClevis 提供了 SSS 的实现。它创建一个密钥并将其分成若干份。每份都使用另一个 pin 进行加密。此外，您定义了阈值 t；如果\
    \ NBDE 部署部署了至少 t 份，那么它就会恢复加密密钥并成功解密。\n\n# 9.11.1. 示例 1：使用两个 Tang 服务器的冗余\n\n```\n\
    当两个 Tang 服务器至少有一个可用时，以下命令将解密 LUKS 加密设备：\n```bash\n# clevis luks bind -d /dev/sda1\
    \ sss '{\"t\":\"1\",\"pins\":[{\"url\":\"http://tang1.srv\"},{\"url\":\"http://tang2.srv\"\
    }]}'\n```\n\n上一个命令使用了以下配置：\n```json\n{\n  \"t\":\"1\",\n  \"pins\":[\n    {\n\
    \      \"url\":\"http://tang1.srv\"\n    },\n    {\n      \"url\":\"http://tang2.srv\"\
    \n    }\n  ]\n}\n```\n\n# 9.12. 使用基于策略的解密配置加密卷的自动解锁\n\n在此配置中，SSS 阈值设置为 1，如果列出的\
    \ Tang 服务器中至少有一个可用，clevis bind 命令将成功重构秘密。\n\n# 9.11.1.2. 示例 2：Tang 服务器和 TPM 设备上的共享秘密\n\
    \n当 **tang** 服务器和 **tpm2** 设备均可用时，以下命令将成功绑定 LUKS 加密设备。现在 SSS 阈值设置为 2 的配置方案为：\n\
    ```json\n{\n  \"t\":2,\n  \"pins\":{\n    \"tang\":\n      {\n        \"url\"\
    :\"http://tang1.srv\"\n      }\n    },\n    \"tpm2\":{\n      \"pcr_ids\":\"0,1\"\
    \n    }\n  }\n}\n```\n\n# 附加资源\n\n- 有关推荐的高可用 NBDE 设置的更多信息，请参阅以下手页：\n- tang(8)，High\
    \ Availability 节\n- clevis(1)，Section Shamir's Secret Sharing 节\n- clevis-sss(1)\n\
    \n# 9.12. 在 NBDE 中部署虚拟机\n\n**luks bind** 命令不会更改 LUKS 主密钥。这意味着如果您为虚拟机或云环境创建了 LUKS\
    \ 加密镜像，所有运行该镜像的实例都将共享该主密钥。\n\n这并不是 Clevis 的限制，而是 LUKS 的设计原理。如果您要在云中部署加密卷，需要确保通过\
    \ Kickstart 为每个 Red Hat Enterprise Linux 实例执行安装过程，以避免共享主密钥。\n\n如果您打算在虚拟化环境中部署自动解锁，Red\
    \ Hat 强烈建议使用带有 Kickstart 文件的 Lorax 或 virt-install（参见“使用 Kickstart 配置 LUKS 加密卷”）或其他自动化工具，以确保每个虚拟机都有唯一的主密钥。\n\
    \n# 注意\n\n虚拟机不支持 TPM 2.0 策略的自动解锁。\n\n# 附加资源\n\n欲更多信息，请参阅手页：\n\n- clevis-luks-bind(1)\n\
    \n# 9.13. 使用 NBDE 为云环境构建自动注册的镜像\n\n在云环境中部署自动注册的加密镜像可能会带来独特的挑战。与其他虚拟化环境一样，建议减少从单个镜像启动的实例数量，以避免共享主密钥。因此，最佳实践是创建不要在任何公共仓库中共享的自定义镜像，并为数量的实例提供基础。创建的具体数量取决于部署的安全策略以及与\
    \ LUKS 主密钥攻击向量相关的风险承受能力。对于启用 LUKS 的自动化部署，应使用 Lorax 或 virt-install 配合 Kickstart\
    \ 文件，以确保镜像构建过程中主密钥的唯一性。\n\n云环境提供了两种 Tang 服务器部署选项，我们在此进行考虑。首先，Tang 服务器可以在云环境内部部署。其次，Tang\
    \ 服务器可以部署在云外部的独立基础设施上，并在两个基础设施之间建立 VPN 链路。\n\n在云中原生部署 Tang 允许方便部署。然而，由于它与其他系统的加密持久化层共享基础设施，Tang\
    \ 服务器的私密钥和 Clevis 元数据可能存储在同一个物理磁盘上。访问此物理磁盘会导致加密数据的完全破解。\n\n# 重要\n\n由于此原因，Red Hat\
    \ 强烈建议在存储数据的位置与运行 Tang 的系统之间保持物理隔离。云与 Tang 服务器私密钥之间的隔离不会意外与 Clevis 元数据结合。当云基础设施面临风险时，它提供了对\
    \ Tang 服务器的本地控制。\n\n# 9.14. 附加资源\n\n- tang(8)、clevis(1)、jose(1) 和 clevis-luks-unlockers(7)\
    \ 手页。\n\n"
