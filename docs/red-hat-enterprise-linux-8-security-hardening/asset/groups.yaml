    # Red Hat Enterprise Linux 8 Security hardening


    This opens the new Customization window that enables you to modify the currently
    selected profile without changing the original data stream file. Choose a new
    profile ID.


    ![](img/ce7756f7a90c9abeaf166ca2952129eb_51_0.png)


    - 3. Find a rule to modify either the tree structure with rules organized into
    logical groups or the **Search** field.

    - 4. Include or exclude rules using check boxes in the tree structure, or modify
    values in rules applicable.


    ![](img/ce7756f7a90c9abeaf166ca2952129eb_51_1.png)


    - 5. Confirm the changes by clicking the **OK** button.


    - 6. To store your changes permanently, use one of the following:

    * Save a customization file separately by using **Save Customization Only** in
    the **File** menu.

    * Save all content at once by **Save All** in the **File** menu. If you select
    **Into a directory** option, **SCAP Workbench** saves both the data stream file
    and the customization file to the specified location. You can use this as a backup
    solution.


    # CHAPTER 6. SCANNING THE SYSTEM FOR CONFIGURATION COMPLIANCE AND VULNERABILITIES


    By selecting the **As RPM** option, you can instruct **SCAP Workbench** to create
    an RPM package containing the data stream file and customization file. This is
    useful for distributing the security content to systems that cannot be scanned
    remotely, and for delivering the content for further processing.


    # NOTE


    Because **SCAP Workbench** does not support results-based remediations for tailored
    rules, use the exported reports with the **oscap** command-line utility.


    ![](img/ce7756f7a90c9abeaf166ca2952129eb_52_0.png)


    ## 6.8.3. Related information


    - scap-workbench(8) man page

    - SCAP Workbench User Manual

    - Deploy customized SCAP policies with Satellite 6.x - a Knowledge Base article
    on tailoring scripts


    # 6.9. DEPLOYING SYSTEMS THAT ARE COMPLIANT WITH A SECURITY PROFILE IMMEDIATELY
    AFTER INSTALLATION


    You can use OpenSCAP to deploy RHEL systems that are compliant with a security
    profile, such as OSSP or PCI-DSS, immediately after the installation process.
    Using this deployment method, you can apply specific rules that cannot be applied
    later using remediation scripts, for example a rule for password strength and
    partitioning.


    ## 6.9.1. Deploying baseline-compliant RHEL systems using the graphical installation


    Use this procedure to deploy a RHEL system that is aligned with a specific baseline.
    This example uses Protection Profile for General Purpose Operating System (OSPP).


    ### Prerequisites


    - You have booted into the **graphical** installation program. Note that the **OSCAP
    Anaconda Add-on** does not support text-only installation.

    - You have accessed the **Installation Summary** window.


    ### Procedure


    - From the **Installation Summary** window, click **Software Selection**. The
    **Software Selection** window opens.

    - From the **Base Environment** pane, select the **Server** environment. You can
    select only one base environment.


    > ### WARNING

    Do not use the Server with GUI base environment if you want to deploy a compliant
    system. Security profiles provided as part of the SCAP Guide may not be compatible
    with the extended package set of Server GUI. For more information, see, for example
    BZ#1648162 BZ#1871756, BZ#1816199.


    - 1. Click **Done** to apply the setting and return to the **Installation Summary**
    window.

    - 2. Click **Security Policy**. The **Security Policy** window opens.

    - 3. To enable security policies on the system, toggle the **Apply security policy**
    switch to **ON.**

    - 4. Select **Protection Profile for General Purpose Operating Systems** from
    the profile pane.

    - 5. Click **Select Profile** to confirm the selection.

    - 6. Confirm the changes in the **Changes that were done or not to be done** pane
    that is displayed at the bottom of the window. Complete any manual changes.

    - 7. Because OSPP has strict partitioning requirements that must be met, create
    separate partitions for **/boot**, **/home**, **/var**, **/var/log**, **/tmp**
    and **/var/log/audit.

    - 8. Complete the graphical installation process.


    > ### NOTE

    The graphical installation program automatically creates a corresponding Kickstart
    file after a successful installation. You can use the **/root/anaconda-kscfg**
    to automatically install OSPP-compliant systems.


    # Verification steps


    - 1. To check the status of the system after installation is complete, reboot
    the system and start a new scan:


    ```

    # ospcap xcdf eval --profile ospsp --eval_postinstall_report.html

    /usr/share/xml/scap/content/ssg-rhel8-ds.xml

    ```


    # Additional resources


    - For more details on partitioning, see Configuring manual partitioning.


    ## 6.9.2. Deploying baseline-compliant RHEL systems using Kickstart


    Use this to deploy RHEL systems that are aligned with a specific baseline. This
    example uses Protection Profile for General Purpose Operating System (OSPP).


    ### Prerequisites


    - The scap-security-guide package is installed on your RHEL 8 system.


    ### Procedure


    - 1. Open the /usr/share/scap-security-guide/kickstarts/ssg-rhel8-ossp-ks.cfg
    Kickstart file in your editor of choice.

    - 2. Update the partitioning scheme to fit your configuration requirements. For
    OSPP compliance, the separate partitions for /boot, /home, /var, /var/log, /var/tmp,
    and /var/log/audit must be preserved, and you can only change the size of the
    partitions.


    > > WARNING OSCAP Anaconda Addon plugin does not support text-only installation,
    do not use the text option in your Kickstart file. For more information, see RHBZ#1674001.


    - 3. Start a Kickstart installation as described in Performing an automated installation
    using Kickstart.


    ![](img/ce7756f7a90c9abeaf166ca2952129eb_54_0.png)


    IMPORTANT Passwords in the hash form cannot be checked for OSPP requirements.


    # Verification steps


    - 1. To check the current status of the system after installation is complete,
    reboot the system and start a new scan:


    ```

    # oscap xcdf eval --profile ospsp --report eval_postinstall_report.html

    /usr/share/xml/scap/ssg/content/ssg-rhel8-ds.xml

    ```


    # Additional resources


    - For more details, see OSCAP Anaconda Addon project page.


    # 6.10. SCANNING CONTAINER AND CONTAINER IMAGES FOR VULNERABILITIES


    Use this procedure to find security vulnerabilities in a container or a container
    image.


    NOTE The scap-podman command is available from RHEL 8.2. For RHEL 8.1 and 8.0,
    use the workaround described in the Using OpenSCAP for scanning containers in
    RHEL 8 Knowledgebase article.


    ![](img/ce7756f7a90c9abeaf166ca2952129eb_54_1.png)


    ### Prerequisites


    The openscap-utils package is installed.


    # Procedure


    - 1. Download the RHSA OVAL definitions for your system:


    ```

    # wget -o https://www.redhat.com/security/data/oval/RHEL8/rhel-8.xml.bz2 | bzip2
    --decompress > rhel-8.xml

    ```


    - 2. Get the ID of a container or a container image, for example:


    ```

    # REPOSITORY TAG IMAGE ID CREATED

    registry.access.redhat.com/ubi8/ubi latest 096ca65a207 7 weeks ago 239 MB

    ```


    - 3. Scan the container or container image for vulnerabilities and save results
    to the `vulnerability.html` file:


    ```

    # oscap-podman 096ca65a207 oval eval --report vulnerability.html rhel-8.xml

    ```


    Note that the **oscap-podman** command requires root privileges, and the ID of
    a container is the first argument.


    # Verification steps


    - 1. Check the results in a browser of your choice, for example:


    ```

    $ firefox vulnerability.html &

    ```


    # Additional resources


    - For more information, see the **oscap-podman(8)** and **oscap(8)** man pages.


