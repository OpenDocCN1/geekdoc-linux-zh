    \ -k -d /dev/sda2 '{\"url\":\"http://tang.srv'\"\n```\n\n广告信息包含以下签名密钥：\n_Ostk0-E216qfdDiVmdoZjaA\n\
    \n您是否要信任这些密钥？[ynN] y\n您正准备初始化 LUKS 设备。\n\n> 建议在初始化之前进行备份。\n您是否要初始化 /sda2？[yn]\
