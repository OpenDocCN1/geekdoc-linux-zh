    # 9.10. CONFIGURING AUTOMATED UNLOCKING OF A LUKS-ENCRYPTED REMOVABLE STORAGE
    DEVICE


    Use this procedure to set up an automated unlocking process of a LUKS-encrypted
    USB storage device.


    # Procedure


    +   1. To automatically unlock a LUKS-encrypted removable storage device, such
    as a USB drive, install the `clevis-udisks` package:

    ```bash

    # yum install clevis-udisks

    ```

    2. Reboot the system, and then perform the binding step using the `clevis luks
    bind` command described in Configuring manual enrollment of LUKS-encrypted volumes,
    for example:

    ```bash

    # clevis luks bind -d /dev/sdb1 ''http://tang.server''

    ```

    3. The LUKS-encrypted removable device can now be unlocked automatically in your
    GNOME desktop session. The device bound to a clevis policy can also be unlocked
    by the `clevis luks unlock` command:

    ```bash

    # clevis luks unlock -d /dev/sdb1

    ```


    You can use an analogous procedure when using a TPM 2.0 policy instead of a Tang
    server.


    # Additional resources


