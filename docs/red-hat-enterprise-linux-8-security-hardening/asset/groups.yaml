    Rotates the log files in the **/var/log/audit/** directory.


    resume


    Resumes logging of Audit events after it has been previously suspended, for example,
    when there is not enough free space on the disk partition that holds the Audit
    log files.


    condestart **auditd** only if it is already running.


    status


    Displays the running status of **auditd**.


    > NOTE

    nThe **service** command is the only way to correctly interact with the **auditd**
    daemon. You need to use the **service** command so that the **audit** value is
    properly recorded. You can use the **systemctl** command only for two actions:
    **enable** and **status**.


    ![](img/ce7756f7a90c9abeaf166ca2952129eb_85_0.png)'
- md: '

    ## 10.5. UNDERSTANDING AUDIT LOG FILES


    By default, the Audit system stores log entries in the /var/log/audit.log file;
    if log rotation is enabled, audit.log files are stored in the same directory.


    Add the following Audit rule to log every attempt to read or modify the /etc/ssh/sshd_config
    file:


    ```

    # auditctl -w /etc/ssh/sshd_config -p wa -k sshd_config

    ```


    If the auditd daemon is running, for example using the following command creates
    a new event in the Audit log file:


    ```

    $ cat /etc/ssh/sshd_config

    ```


    This event in the audit.log file looks as follows:


    ```

    type=SYSCALL audit(1364481363.243:24287): arch=c000003e syscall=2 success=no exit=-13

    a0=77fd1d9c5592 a1=07fd19b44b50 a3=aitems items=1 ppid=2686 pid=3538 auid=1000

    gid=1000 euid=1000 suid=1000 sgid=1000 tty=pts0 ses=0 comm="cat" exe="/bin/cat"

    type=CWD audit(1364481363.243:24287): cwd="/home/shadow"

    type=PATH audit(1364481363.243:24287): item=0 name="/etc/ssh/sshd_config" inode=40928

    type=NORMAL cap=none name=file cap_fe=0 obj=system_u:ret_t:0 ver=0

    type=PROCTIT audit(1364481363.243:24287):

    protitle=6317400265746327f73736864563F6E666967

    ```


    The audit events consist of records, which contain the time stamp and serial number.
    Records always start with the type= keyword. Each record contains several name=value
    pairs separated by a white space or a comma. A detailed analysis of the audit
    events:


    ### First Record


    ```

    type=SYSCALL

    ```


    The field contains the type of record. In this example, the SYSCALL value specifies
    that the record was triggered by a system call to the kernel.


    msg=audit(1364481363.243:24287):

    The field records:


    - a time stamp and a unique ID of the record in the form audit(time_stamp:ID).
    Multiple records can share the same time stamp and ID if they were generated as
    part of the same Audit event. The time stamp is using the Unix time format - seconds
    since 00:00:00 UTC on 1 January 1970.

    - event-specific name=value pairs provided by the kernel or user applications.


    ```

    arch=c000003e

    ```


    The arch field contains information about the CPU architecture of the system.
    For example, c000003e, is encoded in hexadecimal notation. When Audit Records
    with the ausearch command, use the -i or --interpret option to automatically convert
    hexadecimal values into their human-readable equivalents. The c000003e value is
    interpreted as x86_64.


    ### syscall=2


    The **syscall** field records the type of the system call that was sent to the
    kernel. The value, **2**, can be matched with its human-readable equivalent in
    `/usr/include/asm/unistd_64.h`. In this case, **2 is the open** system call. The
    ausecall allows you to convert system call numbers to their human-readable equivalents.
    Use the ausecall--dump command to display a listing of system calls along with
    their numbers. For more information, see the ausearch(8) man page.


    ### success=no


    The **success** field records whether the system call in that particular event
    succeeded or failed. In this case, the call did not succeed.


    ### exit=13


    The **exit** field contains a value that specifies the exit code returned by the
    system call. This value varies for a different system call. You can interpret
    the value to its human-readable equivalent with the following command:


    ```

    # ausearch --interpret --exit -13

    ```


    Note that the previous example assumes your Audit log contains an event that failed
    with exit code **-13.**


    ### a0=7ffd1c5592, a1=0, a2=7ffd1c5592, a3==


    The **a0** field records the first four arguments, encoded in hexadecimal notation,
    of the system call in this event. These arguments depend on the system call that
    is used; they can be interpreted by the **ausearch** utility.


    ### items=1


    The **items** field contains the number of PATH auxiliary records that follow
    the syscall record.


    ### ppid=2686


    The **ppid** field records the Parent Process ID (PPID). In this case, **2686**
    is the PPID of the parent process such as **bash**.


    ### pid=3538


    The **pid** field records the Process ID (PID). In this case, **3538** is the
    PID of the **cat** process.


    ### audit=1000


    The **audit** field records the Audit User ID, which is assigned to a user upon
    login and is inherited by every process when the user''s identity changes, for
    example, switching accounts with the **su** command.


    ### uid=1000


    The **uid** field records the User ID of the user who started the process. The
    User ID is interpreted into names with the following command: ausearch -i.


    ### gid=1000


    The **gid** field records the group ID of the user who started the process.


    ### eid=1000


    The **eid** field records the effective User ID of the user who started the process.


    ### suid=1000


    The **suid** field records the set user ID of the user who started the process.


    ### fsuid=1000


    The **fsuid** field records the file system user ID of the user who started the
    process.


    ### egid=1000


    The **egid** field records the effective group ID of the user who started the
    process.


    ### sgid=1000


    The **sgid** field records the set group ID of the user who started the process.


    ### fsgid=1000


    The **fsgid** field records the file system group ID of the user who started the
    process.


    ### tty=pts0


    The **tty** field records the terminal from which the analyzed process was invoked.


    ### ses=1


    The **ses** field records the session ID of the session from which analyzed process
    was invoked.


    ### comm="cat"


    The **comm** field records the command-line name of the command that was used
    to invoke the analyzed process. In this case, the cat command was used to trigger
    this event.


    ### exe="/bin/cat"


    The **exe** field records the executable that was used to invoke the analyzed
    process.


    ### subj=unconfined_u:unconfined_r:unconfined_t:s0:c0


    The **subj** field records the SELinux context with which the analyzed process
    was labeled at the time of execution.


    ### key="sshd_config"


    The **key** field records the administrator-defined string associated with the
    rule that generated this event.


    ### Second Record


    ### type=CWD


    In the second record, the type field is CWD – current working directory. This
    type is used to record the working directory from which the process invoked the
    system call specified in the first record. The purpose of this record is to capture
    the current process''s location in a relative path so the absolute path can be
    reconstructed.


    ### msg=audit(1364481363.243:24287)


    The **msg** field holds the same timestamp and ID value as the value in the first
    record. The time stamp is using the Unix time format - seconds since 00:00:00
    UTC on 1 January 1970.


    ### cwd="/home/shadow"


    The **cwd** field contains the path to the directory in which the system call
    was invoked.


    ### Third Record


    ### type=PATH


    In the third record, the type field is PATH. An Audit event contains a PATH-type
    record for every path that is passed to the system call as an argument. In this
    Audit event, only one path (/etc/ssh/sshd_config) was used as an argument.


    ### msg=audit(1364481363.243:24287)


    The **msg** field holds the same timestamp and ID value as the value in the first
    and second record.


    ### item=0


    ### Red Hat Enterprise Linux 8 Security hardening


    The item field indicates which, of the total number of items referenced in the
    syscall type record, the current record is. This number is zero-based; a value
    of 0 means it is the first item.


    ### name="etc/ssh/sshd_config"


    The **name** field records the path of the file or directory that was passed to
    the system call as an argument. In this case, it was the /etc/ssh/sshd_config
    file.


    ### inode=40928


    The **inode** field contains the inode number associated with the file or directory
    recorded in this event. The following command displays the file or directory that
    is associated with the 40928 inode:


    ```

    # find / -inum 40928 -print

    /etc/ssh/sshd_config

    ```


    ### devfd=0


    The **dev** field specifies the major and minor ID of the device that contains
    the file or directory recorded in this event. In this case, the value represents
    the /dev/fd/0 device.


    ### mode=0100060


    The **mode** field records the file or directory permissions, encoded in numerical
    notation as returned by the stat command in the st_mode field. See the stat(2)
    page for more information. In this case, 0100060 is interpreted as -rw---- meaning
    that only the root user has read and write permissions to the /etc/ssh/sshd_config
    file.


    ### uid=0


    The **uid** field records the owner''s user ID.


    ### gid=0


    The **gid** field records the owner''s group ID.


    ### rdev=00:00


    The **rdev** field contains a recorded device identifier for special files only.
    In this case, it is not used as the recorded file is a regular file.


    ### object=u:object_r:etc_t:s0


    The **obj** field records the SELinux context which the recorded file or directory
    was labeled at the time of execution.


    ### nametype=NORMAL


    The **nametype** field records the intent of each path record''s operation in
    the context of a given syscall.


    ### cap_fp=none


    The **cap_fp** field records data related to the setting of a permitted file system-based
    capability of the file or directory object.


    ### cap_fi=none


    The **cap_fi** field records data related to the setting of an inherited file
    system-based capability of the file or directory object.


    ### cap_fe=0


    The **cap_fe** field records the setting of the effective bit of the file system-based
    capability of the file or directory object.


    ### cap_fver=0


    The **cap_fver** field records the version of the file system-based capability
    of the file or directory object.

