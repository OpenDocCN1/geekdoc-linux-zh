    \ In Red Hat Linux 8, for cryptographic hardware through the PKCS #11 API is consistent\
    \ across different applications, and the isolation of secrets on cryptographic\
    \ hardware is not a complicated task.\n\n## 4.1. CRYPTOGRAPHIC HARDWARE SUPPORT\
    \ THROUGH PKCS #11\n\nPKCS #11 (Public-Key Cryptography Standard) defines an application\
    \ programming interface (API) to cryptographic devices that hold cryptographic\
    \ information and perform cryptographic functions. These devices are called tokens,\
    \ and they can be implemented in a hardware or software form.\n\nA PKCS #11 token\
    \ can store various types of object such as a certificate; data object; and a\
