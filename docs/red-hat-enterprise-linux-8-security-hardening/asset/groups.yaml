    # 9.6. REMOVING A CLEVIS PIN FROM A LUKS-ENCRYPTED VOLUME MANUALLY


    Use the following procedure for manually removing the metadata created by the
    clevis bind command and for wiping a key slot that contains passphrase added by
    Clevis.


    > IMPORTANT

    The recommended way to remove a Clevis pin from a LUKS-encrypted volume is through
    the clevis locks unbind command. The removal procedure using clevis unbind consists
    of only one step and works for LUKS1 and LUKS2 volumes. The following example
    command removes the metadata created by the binding step and wipe the key slot
    1 on the /dev/sda2 device:


    # clevis locks unbind -d /dev/sda2 -s 1


    # Prerequisites


    +   A LUKS-encrypted volume with a Clevis binding.


    # Procedure


    +   1. Check which LUKS version, for example, /dev/sda2, is encrypted by and identify
    a slot and token that is bound to Clevis:


    ```

    # cryptsetup luksDump /dev/sda2

    LUKS header information

    Version: 2

    ...

    Keyslots:

    0: luks2

    ...

    1: luks2

    Key: 512 bits

    Priority: normal

    ```'
