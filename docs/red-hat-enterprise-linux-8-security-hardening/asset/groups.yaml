    # CHAPTER 3. USING SYSTEM-WIDE CRYPTOGRAPHIC POLICIES


    Crypto policy is a system that configures the core cryptographic subsystems, covering
    the TLS, IPC, SSH, DNSSec and Kerberos protocols. It provides a small set of policies,
    which the administrator can select.


    # 3.1. SYSTEM-WIDE CRYPTOGRAPHIC POLICIES


    Once a system-wide policy is set up, applications in RHEL follow it refuse to
    use algorithms and protocols that do not meet the policy, unless you explicitly
    request the application to do so. That is, the policy applies to the default behavior
    of applications when running with the system-provided configuration but you can
    override it if required.


    Red Hat Linux 8 contains the following policy levels:


    | DEFAULT | The default system-wide cryptographic policy offers secure settings
    for current threat models. It allows the TLS 1.2 and 1.3 protocols, as well as
    IKE2 and SSH2 protocols. The RSA keys and Diffie-Hellman parameters are accepted
    if they are at least 2048 bits long |

    | LEGACY | This policy ensures maximum compatibility with Red Hat Enterprise Linux
    5 and earlier; it is less secure due to an increased attack surface. In addition
    to the DEFAULT level algorithms and protocols, it includes support for the TLS
    1.0 and 1.1 protocols. The algorithms DSA, 3DES, and RC4 are excluded, while RSA
    keys and Diffie-Hellman parameters are accepted if they are at least 1023 bits
    long |

    | FUTURE | A conservative security level that is better to withstand any near-term
    future attacks. This level does not allow the use of SHA-1 in signature algorithms.
    The RSA keys and Diffie-Hellman parameters are accepted if they are at least 3072
    bits long |

    | FIPS | A policy level that conforms with the FIPS140-2 requirements. This is
    used internally by the fips-mode-setup tool, which switches the RHEL system into
    FIPS mode.


    ![](img/ce7756f7a90c9abeaf166ca2952129eb_23_0.png)


    > IMPORTANT

    Because a cryptographic key used by a certificate on the Customer Portal API does
    not meet the requirements by the FUTURE system-wide cryptographic policy, the
    redhat-support-tool utility does not work with this policy level at the moment.


    To work around this problem, use the DEFAULT crypto policy while connecting to
    the Customer Portal API.


    ![](img/ce7756f7a90c9abeaf166ca2952129eb_23_1.png)


    > NOTE

    The specific algorithms and ciphers described in the policy levels as are available
    only if an application supports them.


    Tool for managing crypto policies

    To view or change the current system-wide cryptographic policy, use the update-crypto-policies
    tool, for example:'
