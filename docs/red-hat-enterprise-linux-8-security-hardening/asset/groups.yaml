    mode=0100060


    The mode field records the file or directory permissions, encoded in numerical
    notation as returned by the stat command in the st_mode field. See the stat(2)
    page for more information. In this case, 0100060 is interpreted as -rw---- meaning
    that only the root user has read and write permissions to the /etc/ssh/sshd_config
    file.


    uid=0


    The uid field records the owner''s user ID.


    gid=0


    The gid field records the owner''s group ID.


    rdev=00:00


    The rdev field contains a recorded device identifier for special files only. In
    this case, it is not used as the recorded file is a regular file.


    object=u:object_r:etc_t:s0


    The obj field records the SELinux context which the recorded file or directory
    was labeled at the time of execution.


    nametype=NORMAL


    The nametype field records the intent of each path record''s operation in the
    context of a given syscall.


    cap_fp=none


    The cap_fp field records data related to the setting of a permitted file system-based
    capability of the file or directory object.


    cap_fi=none


    The cap_fi field records data related to the setting of an inherited file system-based
    capability of the file or directory object.


    cap_fe=0


    The cap_fe field records the setting of the effective bit of the file system-based
    capability of the file or directory object.


    cap_fver=0


    The cap_fver field records the version of the file system-based capability of
    the file or directory object.'
- md: "\n## Fourth Record\n\nThe type field contains the type of the record. In this\
    \ example, the PROCTITLE value specifies that this record gives the full command-line\
    \ triggered by this Audit event, by a system call to the kernel.\n\nproctitle:636174002F6574632F7376382F73766845F63F6E66969\n\
    \nThe proctitle field records the full command-line of the command that was used\
    \ to invoke the analyzed process. The field is encoded in hexadecimal notation\
    \ to allow the user to influence the Audit log parser. The text decodes the command\
    \ that triggered this Audit event. When searching Audit records with the ausearch\
    \ command, use the -i --interpret option to automatically convert hexadecimal\
    \ values to human-readable equivalents. 636174002F6574632F7376382F73766845F63F6E66969\
    \ value is interpreted as cat /etc/ssh/sshd_config.\n\n## 10.6. USING AUDCTL FOR\
    \ DEFINING AND EXECUTING AUDIT RULES\n\nThe Audit system operates on a set of\
    \ rules that are captured in the log files. Audit rules can be set either by the\
    \ command line using the auditctl utility or in the /etc/audit/rules.d/ directory.\n\
    \nThe auditctl command enables you to control the basic functionality of the Audit\
    \ system and to define rules that decide which Audit events are logged.\n\n##\
    \ File-system rules examples\n\n- 1. To define a rule that allows all access to,\
    \ and every attribute change of, the /etc/passwd file:\n  > # auditctl -w /etc/passwd\
    \ -p wa -k password_changes\n- 2. To define a rule that allows all access to,\
    \ and every attribute change of, all the files in the /etc/selinux/ directory:\n\
    \  > # auditctl -w /etc/selinux/ -p wa -k sel_changes\n\n## System-call rules\
    \ examples\n\n- 1. To define a rule that creates a log entry every time the adjtime\
    \ or settimeday system calls are used by a program, and use the 64-bit architecture:\n\
    \  > # auditctl -a always,exit -F arch=b64 -S adjtime -S settimeday -k time_change\n\
    - 2. To define a rule that creates a log entry every time a file is deleted or\
    \ renamed by a system user whose ID is 1000 or larger:\n  > # auditctl -a always,exit\
    \ -S unlink -S unlink -S rename -F audit>=1000 -F audit!=429467295 -k delete\n\
    \nNote that -F audit!=429467295 option is used to exclude users whose login UID\
    \ is set.\n\n## Executable-file rules\n\nTo define a rule that logs all execution\
    \ of the /bin/id program, execute the following command:\n\n# Red Hat Enterprise\
    \ Linux 8 Security hardening\n\n```\n# auditctl -a always, -F exe=/bin/id -F arch=b64\
    \ -S execve -k execution_bin_id\n```\n\nAdditional resources\n\n- See the auditctl(8)\
    \ man page for more information, performance tips, and additional examples of\
    \ use.\n\n## 10.7. DEFINING PERSISTENT AUDIT RULES\n\nTo define audit rules that\
    \ are persistent across reboots, you must either include them in the /etc/audit/rules.d/audit.rules\
    \ file or use the augrules program that reads rules located in the /etc/audit/rules/\n\
    \nNote that /etc/audit/rules.rules file is generated whenever the audit service\
    \ starts. Files in /etc/audit/rules/ use the same auditctl command-line syntax\
    \ to specify the rules. Empty lines and comments (#) are ignored. Furthermore,\
    \ you can use the auditctl command to read rules from a specified file using the\
    \ -R option, for example:\n\n```\n# auditctl -R /usr/share/audit/sample-rules/30-stig.rules\n\
    ```\n\n## 10.8. USING PRE-CONFIGURED RULES\n\nIn /usr/share/audit/sample-rules\
    \ directory, the audit package provides a set of pre-configured rules following\
    \ various standards:\n\n- 30-nis.rules: Audit rule configuration meets the requirements\
    \ specified in the National Security Program Operating Manual.\n- 30-ospp-v4.rules:\
    \ Audit rule configuration meets the requirements defined in the OSPP (Protection\
    \ Profile for General Purpose Systems) version 4.2.\n- 30-pci-dss-v3.rules: Audit\
    \ rule configuration meets the requirements set by Payment Card Industry Data\
    \ Standard (PCI DSS) v3.1.\n- 30-stig.rules: Audit rule configuration meets the\
    \ requirements set by Security Implementation Guides (STIG).\n\nTo use these configuration\
    \ files, copy them to the /etc/audit/rules.d/ directory and use the augrules --load\
    \ command, for example:\n\n```\n# cd /usr/share/audit/sample-rules/\n# cp 10-base-config.rules\
    \ 30-stig.rules 31-privileged.rules 99-finalize.rules /etc/audit/rules.d/\n# augrules\
    \ --load\n```\n\nAdditional resources\n\n## CHAPTER 10. AUDITING THE SYSTEM\n\n\
    - The Audit rules have a numbering scheme that allows you to order. To learn more\
    \ about the naming scheme, see /usr/share/doc/audit/rules/README.\n- See the audit.rules(7)\
    \ man page for more information, troubleshooting, and additional examples of use.\n\
    \n## 10.9. USING AUGENRULES TO DEFINE PERSISTENT RULES\n\nThe augenrules script\
    \ reads rules located in /etc/audit/rules.d/ directory and compiles them into\
    \ an audit.rules file. This script processes all files that end with .rules in\
    \ a specific order based on their natural sort. The files in this directory are\
    \ organized into groups with the following meanings:\n\n- 10 - Kernel and audit\
    \ configuration\n- 20 - Rules that match general rules but you want a different\
    \ match\n- 30 - Main rules\n- 40 - Optional rules\n- 50 - Server-specific rules\n\
    - 70 - System local rules\n- 90 - Finalize (immutable)\n\nThe rules are not meant\
    \ to be used for all cases. They are pieces of a policy that should be thought\
    \ out and individual files copied to /etc/audit/rules.d/. For example, to set\
    \ up a system in STIG configuration, copy rules 10-base-config, 30-stig, 31-privileged,\
    \ and 99-finalize.\n\nOnce you have the rules in the /etc/audit/rules.d/ directory,\
    \ load them by running the augenrules script with the --load directive:\n\n```\n\
    # augenrules --load\n/sbin/augenrules: No change\nNo rules\nenabled 1\nfailure\
    \ 1\npid 742\nrate_limit 0\n...\n```\n\nAdditional resources\n\n- For more information\
    \ on the Audit rules and augenrules script, see audit.rules(8) and augenrules(8)\
    \ man pages.\n\n## 10.10. DISABLING AUGENRULES\n\nUsing the following steps to\
    \ disable the augenrules utility. This switches Audit to use rules defined in\
    \ the /etc/audit/audit.rules file.\n\nProcedure\n\n- 1. Copy the /lib/systemd/system/auditd.service\
    \ file to the /etc/systemd/system/ directory:\n\n```\n# cp -f /lib/systemd/system/auditd.service\
    \ /etc/systemd/\n```\n- 2. Edit the /etc/systemd/auditd.service file in an editor\
    \ of your choice, for example:\n\n```\n# vi /etc/systemd/auditd.service\n```\n\
    - 3. Comment out the line containing augenrules, and uncomment the line containing\
    \ the auditctl -R command:\n\n```\n#ExecStartPost=/bin/augenrules --load\nExecStartPost=/bin/auditctl\
    \ -R /etc/audit/audit.rules\n```\n- 4. Reload the system daemon to fetch changes\
    \ in the auditd.service file:\n\n```\n# systemctl daemon-reload\n```\n- 5. Restart\
    \ the auditd service:\n\n```\n# service auditd restart\n```\n\nAdditional resources\n\
    \n- The augenrules(8) and audit.rules(8) man pages.\n- The Auditd service restart\
    \ overrides changes made to /etc/audit/audit.rules article.\n\n## 10.11. RELATED\
    \ INFORMATION\n\nFor more information about the Audit system, see the following\
    \ sources.\n\nOnline Sources\n\n- The RHEL Audit System Reference Knowledgebase\
    \ article.\n- The Auditd execution options in a container Knowledgebase article.\n\
    - The Linux Audit Documentation Project page.\n\nInstalled Documentation\n\nDocumentation\
    \ provided by the audit package can be found in the /usr/share/doc/audit/ directory.\n\
    \nManual Pages\n\n- audispd.conf(5)\n- auditd.conf(5)\n- ausearch-expression(5)\n\
    - audit.rules(7)\n- audispd(8)\n- auditctl(8)\n- auditd(8)\n- aulast(8)\n- aulastlog(8)\n\
    - aureport(8)\n- ausearch(8)\n- ausyscall(8)\n- autrace(8)\n- aaudit(8) (Note:\
    \ Corrected from auvirt based on standard audit tools)\n\n## CHAPTER 11. CONFIGURING\
    \ AND MANAGING APPLICATION WHITELIST\n\nApplication whitelisting efficiently prevents\
    \ the execution of unknown and potentially malicious software.\n\n## 11.1. POLICYD\
    \ WHITELISTING IN RHEL\n\nThe policyd framework introduces a form of application\
    \ whitelisting and blacklisting based on a user-defined policy. The application\
    \ whitelisting feature provides one of the most efficient ways to prevent unrestrained\
    \ and possibly malicious applications on the system.\n\nThe policyd framework\
    \ provides the following components:\n\nThe administrator can define allow and\
    \ deny rules for any application based on a path, hash, MIME type, or trust.\n\
    \nApplication whitelisting introduces the concept of trust. An application is\
    \ trusted when it is properly installed by the system package manager, and therefore\
    \ it is registered in the system RPM database. The policyd plugin registers any\
    \ system update that is handled by the YUM package manager. The plugin notifies\
    \ the policyd daemon about changes in this database.\n\nAn installation using\
    \ the rpm utility requires a manual refresh of the database, and other ways of\
    \ adding applications require the creation of custom rules and restarting the\
    \ policyd service.\n\nThe policyd service configuration is located in /etc/policyd/\
    \ directory with the following structure:\n\n- policyd.rules file contains allow\
    \ and deny execution rules.\n- policyd.conf file contains daemon's configuration\
    \ options. This file is useful primarily for performance-tuning purposes. (Note:\
    \ \"facolicd\" was corrected to \"policyd\" based on context).\n\n## 11.2. DEPLOYING\
    \ APPLICATION WHITELISTING\n\nTo deploy the policyd framework in RHEL:\n\n# Procedure\n\
    \n- 1. Install the policyd package:\n"
  mdcn: "\n\n## 第四记录\n\n`type` 字段包含记录的类型。在此示例中，`PROCTITLE` 值指定了该记录通过系统调用到内核，提供了由此\
    \ Audit 事件触发的完整命令行。\n\nproctitle:636174002F6574632F7376382F73766845F63F6E66969\n\
    \n`proctitle` 字段记录了用于调用分析进程的命令完整命令行。该字段采用十六进制编码，以便允许用户影响 Audit 日志解析器。该文本解码了触发此\
    \ Audit 事件的命令。当使用 `ausearch` 命令搜索 Audit 记录时，使用 `-i --interpret` 选项自动将十六进制值转换为人类可读的等效值。`636174002F6574632F7376382F73766845F63F6E66969`\
    \ 值解释为 `cat /etc/ssh/sshd_config`。\n\n## 10.6. 使用 AUDCTL 定义和执行审计 规则\n\nAudit 系统根据一组捕获在日志文件中的规则运行。Audit\
    \ 规则可以通过命令行使用 `auditctl` 工具进行设置，也可以通过在 `/etc/audit/rules.d/` 目录下进行设置。\n\n`auditctl`\
    \ 命令允许你控制 Audit 系统的基本功能，并定义决定哪些 Audit 事件被记录的规则。\n\n## 文件系统规则示例\n\n- 1. 定义一条规则，允许对\
    \ /etc/passwd 文件的所有访问和每次属性更改：\n  > # auditctl -w /etc/passwd -p wa -k password_changes\n\
    - 2. 定义一条规则，允许对 /etc/selinux/ 目录下的所有文件的所有访问和每次属性更改：\n  > # auditctl -w /etc/selinux/\
    \ -p wa -k sel_changes\n\n## 系统调用规则示例\n\n- 1. 定义一条规则，每当程序使用 `adjtime` 或 `setwimeday`\
    \ 系统调用时，创建一个日志条目，并使用 64 位架构：\n  > # auditctl -a always,exit -F arch=b64 -S adjtime\
    \ -S settimeday -k time_change\n- 2. 定义一条规则，每当 ID 为 1000 或更大的系统用户删除或重命名文件时，创建一个日志条目：\n\
    \  > # auditctl -a always,exit -S unlink -S unlink -S rename -F audit>=1000 -F\
    \ audit!=429467295 -k delete\n\n注意，`-F audit!=429467295` 选项用于排除设置了登录 UID 的用户。\n\
    \n## 可执行文件规则\n\n要定义一条记录所有对 /bin/id 程序执行操作的规则，请执行以下命令：\n\n# 红帽企业 Linux 8 安全加固\n\
    \n```\n# auditctl -a always, -F exe=/bin/id -F arch=b64 -S execve -k execution_bin_id\n\
    ```\n\n其他资源\n\n- 查看 `auditctl(8)` 手页以获取更多信息、性能提示和额外的用法示例。\n\n## 10.7. 定义持久化审计\
    \ 规则\n\n要定义跨重启有效的持久化审计规则，你必须将它们包含在 `/etc/audit/rules.d/audit.rules` 文件中，或者使用 `augrules`\
    \ 程序读取位于 `/etc/audit/rules/` 下的规则。\n\n注意，`/etc/audit/rules.rules` 文件在每次审计服务启动时都会生成。`/etc/audit/rules/`\
    \ 中的文件使用相同的 `auditctl` 命令行语法来指定规则。空行和注释（`#`）会被忽略。此外，你可以使用 `auditctl` 命令通过 `-R`\
    \ 选项从指定文件读取规则，例如：\n\n```\n# auditctl -R /usr/share/audit/sample-rules/30-stig.rules\n\
    ```\n\n## 10.8. 使用预配置 规则\n\n在 `/usr/share/audit/sample-rules` 目录下，audit 软件包提供了一组遵循各种标准的预配置规则：\n\
    \n- 30-nis.rules: 审计规则配置符合《国家安全计划操作手册》中规定的要求。\n- 30-ospp-v4.rules: 审计规则配置符合 OSPP（通用系统保护规范文件）版本\
    \ 4.2 定义的要求。\n- 30-pci-dss-v3.rules: 审计规则配置符合支付卡行业数据标准（PCI DSS）v3.1 设的要求。\n- 30-stig.rules:\
    \ 审计规则配置符合安全实施指南（STIG）设的要求。\n\n要使用这些配置文件，请将它们复制到 `/etc/audit/rules.d/` 目录并使用 `augrules\
    \ --load` 命令，例如：\n\n```\n# cd /usr/share/audit/sample-rules/\n# cp 10-base-config.rules\
    \ 30-stig.rules 31-privileged.rules 99-finalize.rules /etc/audit/rules.d/\n# augrules\
    \ --load\n```\n\n其他资源\n\n## 第 10 章. 审计审计\n\n- 审计规则有一套编号方案，允许你进行排序。要了解更多关于命名方案的信息，请查看\
    \ `/usr/share/doc/audit/rules/README`。\n- 查看 `audit.rules(7)` 手页以获取更多信息、故障排除和额外的用法示例。\n\
    \n## 10.9. 使用 AUGENRULES 定义持久化 规则\n\n`augenrules` 脚本读取位于 `/etc/audit/rules.d/`\
    \ 目录下的规则并将其编译为 `audit.rules` 文件。该脚本根据自然排序按特定顺序处理所有以 `.rules` 结尾的文件。此目录中的文件组织成具有以下含义的组：\n\
    \n- 10 - 内核和审计配置\n- 20 - 匹配通用规则但你想要不同匹配的规则\n- 30 - 主规则\n- 40 - 可选规则\n- 50 - 服务器特定规则\n\
    - 70 - 系统本地规则\n- 90 - 最终完成（不可变）\n\n这些规则并非用于所有情况。它们是策略的一部分，应该经过深思熟虑并单独复制到 `/etc/audit/rules.d/`。例如，要在\
    \ STIG 配置下设置系统，请复制规则 10-base-config、30-stig、31-privileged 和 99-finalize。\n\n一旦你向\
    \ `/etc/audit/rules.d/` 目录中放入这些规则，可以通过运行带有 `--load` 指令的 `augenrules` 脚本来加载它们：\n\
    \n```\n# augenrules --load\n/sbin/augenrules: No change\nNo rules\nenabled 1\n\
    failure 1\npid 742\nrate_limit 0\n...\n```\n\n其他资源\n\n- 有关审计规则和 `augenrules` 脚本的更多信息，请查看\
    \ `audit.rules(8)` 和 `augenrules(8)` 手页。\n\n## 10.10. 禁用 AUGENRULES\n\n使用以下步骤禁用\
    \ `augenrules` 工具。这将 Audit 切为使用 `/etc/audit/audit.rules` 文件定义的规则。\n\n步骤\n\n- 1.\
    \ 将 `/lib/systemd/system/auditd.service` 文件复制到 `/etc/systemd/system/` 目录：\n\n\
    ```\n# cp -f /lib/systemd/system/auditd.service /etc/systemd/system/\n```\n- 2.\
    \ 使用你喜欢的编辑器编辑 `/etc/systemd/system/auditd.service` 文件：\n\n```\n# vi /etc/systemd/system/auditd.service\n\
    ```\n- 3. 注释掉包含 `augenrules` 的行，并取消包含 `auditctl -R` 的行：\n\n```\nExecStartPost=/augenrules\n\
    ExecStartPost=/auditctl -R /etc/audit/audit.rules\n```\n- 4. 重新加载系统守护进程：\n\n```\n\
    # systemctl daemon-reload\n```\n- 5. 重启 auditd 服务：\n\n```\n# service auditd\n\
    ```\n\n其他资源\n\n- `augenrules(8)` 和 `audit.rules(8)` 手页。\n- 对 `/etc/audit/audit.rules`\
    \ 更改的文章。\n\n## 10.11. 相关信息\n\n有关审计 系统的更多信息，请参考以下来源。\n\n在线来源\n\n- RHEL 审计系统参考。\n\
    - Auditd 执行选项文章。\n- Linux 审计项目页面。\n\n已安装文档\n\naudit 软件包提供的文档可以在 `/usr/share/doc/audit/`\
    \ 找到。\n\n手册页\n\n- audispd.conf(5)\n- auditd.conf(5)\n- ausearch-expression(5)\n\
    - audit.rules(7)\n- audispd(8)\n- auditctl(8)\n- auditd(8)\n- aulast(8)\n- aulastlog(8)\n\
    - aureport(8)\n- ausearch(8)\n- ausyscall(8)\n- autrace(8)\n- aaudit(8) (注：根据上下文从\
    \ auvirt 纠正)\n\n## 第 11 章. 配置和管理白名单\n\n应用程序白名单有效地防止未知和可能的恶意软件的执行。\n\n## 11.1.\
    \ RHEL 中的 POLICYD 白名单\n\n`policyd` 框架引入了基于用户策略的应用程序白名单和黑名单。应用程序白名单是防止不受限制的可能恶意软件的最有效方法之一。\n\
    \n`policyd` 框架提供了以下组件：\n\n管理员可以根据路径、哈希、MIME 类型或信任定义允许和拒绝规则。\n\n应用程序白名单引入了“信任”的概念。当应用程序通过软件包管理器正确安装时，它会被注册到系统\
    \ RPM 数据库中。`policyd` 插件注册任何由 YUM 软件包管理器处理的系统更新。该插件通知数据库的变化。\n\n使用 `rpm` 工具安装需要手动刷新数据库，而其他添加应用程序的方法需要创建规则并重启\
    \ `policyd` 服务。\n\n`policyd` 服务配置位于 `/etc/policyd/` 目录，结构如下：\n\n- `policyd.rules`\
    \ 文件包含允许和拒绝执行规则。\n- `policyd.conf` 文件包含守护选项。该文件主要用于性能调优。\n\n## 11.2. 部署应用程序白名单\n\
    \n要在 RHEL 中部署 `policyd` 框架：\n\n# 步骤\n\n- 1. 安装 `policyd` 软件包：\n\n"
