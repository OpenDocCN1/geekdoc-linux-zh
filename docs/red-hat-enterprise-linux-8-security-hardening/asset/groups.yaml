    what resources and information by such means as:


    +   - Training and awareness

    - Disaster preparedness and recovery plans

    - Personnel recruitment and separation strategies

    - Personnel registration and accounting


    # 1.5. VULNERABILITY ASSESSMENT


    Given time, resources, and motivation, an attacker can break into any system.
    All of the security procedures and technologies currently available cannot guarantee
    that any systems are completely safe from intrusion. Routers help secure gateways
    to the Internet. Firewalls help secure the edge of the network. Virtual Private
    Networks safely pass data in an encrypted stream. Intrusion detection systems
    warn you of malicious activity. However, the success of each of these technologies
    is dependent upon a number of variables:


    +   - The expertise of the staff responsible for configuring, monitoring, and
    maintaining the technologies.

    - The ability to patch and update services and kernels quickly and efficiently.

    - The ability of those responsible to keep constant vigilance over the network.


    The dynamic state of data systems and technologies, securing corporate resources
    can be quite complex. Due to this complexity, it is often difficult to find experts
    for all of your systems. While it is possible to have personnel knowledgeable
    in many areas of information security at a high level, it is difficult to retain
    staff who are experts in more than a few subject areas. This is mainly because
    each area of information security requires constant attention and focus. Information
    security does not stand still.


    A vulnerability assessment is an internal audit of your network and system security;
    the results of which indicate the confidentiality, integrity, and availability
    of your network. Typically, vulnerability assessment starts with a reconnaissance
    phase, during which important data gathering gathers the target systems and resources
    is gathered. This phase leads to the readiness phase, where the target is essentially
    checked for all known vulnerabilities. The readiness phase culminates in the reporting
    phase, where the findings are classified into categories of high, medium, and
    low risk; and methods for improving the security (or mitigating the risk of vulnerability)
    of the target are discussed


    If you performed a vulnerability assessment of your home, you would likely check
    each door to see if they are closed and locked. You would also check every window,
    making sure that they are closed completely and latch correctly. This same concept
    applies to systems, networks, and electronic data. Malicious users are thieves
    and vandals of your data. Focus on their tools, mentality, and motivations, and
    you can then react to their actions.


    # 1.5.1. Defining assessment and testing


    Vulnerability assessments may be broken down into one of two types: outside looking
    in and inside looking around.'
