    # 11.4. TROUBLESHOOTING RHEL APPLICATION WHITELISTING


    The following section provides tips for basic troubleshooting of the facolicyd
    application whitelisting framework and guidance for adding applications using
    the rpm command.


    # Installing applications using rpm


    +   If you install an application using the rpm command, you have to perform a
    manual refresh of the facolicyd RPM database:


    +   1. Install your application:


