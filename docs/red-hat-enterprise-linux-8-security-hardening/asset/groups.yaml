    # 3.2. SWITCHING THE SYSTEM-WIDE CRYPTOGRAPHIC POLICY TO MODE COMPATIBLE WITH
    EARLIER RELEASES


    The default system-wide cryptographic policy in Red Hat Enterprise Linux 8 does
    not allow communication using older, insecure protocols. For environments that
    require to be compatible with Red Hat Enterprise Linux 5 and in some cases also
    with earlier releases, the less secure LEGACY policy level is available.'
