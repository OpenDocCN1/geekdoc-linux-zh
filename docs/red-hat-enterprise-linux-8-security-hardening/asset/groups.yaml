    ## 6.6. CREATING A REMEDIATION ANSIBLE PLAYBOOK TO ALIGN THE SYSTEM WITH A SPECIFIC
    BASELINE


    Use this procedure to create an Ansible playbook containing only the remediations
    that are needed to align your system with a specific baseline. This example uses
    the Protection Profile for General Purpose Operating Systems (OSPP). With this
    procedure, you create a smaller playbook that does not cover already satisfied
    requirements. By following these steps, you do not modify your system in any way,
    you only prepare a file for later application.


    # Prerequisites


    - The scap-security-guide package is installed on your RHEL 8 system.


    # Procedure


    - 1. Scan the system and save the results:


    ```

    # xccdf eval --profile ospsp --results ospp-results.xml /usr/share/xml/scap/ssg/content/ssg-rhel8-ds.xml

    ```


    - 2. Generate an Ansible playbook based on the file generated in the previous
    step:


    ```

    # xccdf generate --fix-type ansible --output ospp-remediations.yml

    ```


    - 3. The ospp-remediations.yml file contains Ansible remediation for rules that
    failed during the scan performed in step 1. After reviewing this generated file,
    you can apply it with the ansible-playbook ospp-remediations.yml command.


    # Verification steps


    - 1. In a text editor of your choice, review that the ospp-remediations.yml file
    contains rules that failed in the scan performed in step 1.


    # Additional resources


    - scap-security-guide(8) and oscap(8) man pages

    - Ansible Documentation


    ## 6.7. CREATING A REMEDIATION BASH SCRIPT FOR A LATER APPLICATION


    Use this process to create a Bash script containing remediations that align your
    system with a security profile such as PCI-DSS. Using the following steps, you
    do not do any modifications to your system, you only prepare a file for later
    application.


    # Prerequisites


    - The scap-security-guide package is installed on your RHEL 8 system.


    # Procedure


    - 1. Use the oscap command to scan the system and to save the results to an XML
    file. In the following example, oscap evaluates the system against the pci-dss
    profile:


    ```

    # xccdf eval --profile pci-dss --results pci-dss-results.xml /usr/share/xml/scap/content/ssg-rhel8-ds.xml

    ```


    - 2. Generate a Bash script based on the results file generated in the previous
    step:


    ```

    # xccdf generate --profile pci-dss --fix-type bash --output pci-dss-remediations.sh
    pci-dss-remediations.xml

    ```


    - 3. The pci-dss-remediations.sh file contains remedies for rules that failed
    during the scan in step 1. After reviewing this file, you can apply it with the
    ./pci-dss-remediations.sh command when you are in the same directory as file.


    # Verification steps


    - 1. In a text editor of your choice, review that the pci-dss-remediations.sh
    file contains rules that failed in the scan performed in step 1.


    # Additional resources


    - scap-security-guide(8), oscap(8), and bash(1) man pages


    ## 6.8. SCANNING THE SYSTEM WITH A CUSTOMIZED PROFILE USING SCAP WORKMARK


    SCAP Benchmark, which is contained in the scap-benchmark package, is a graphical
    utility enables users to perform configuration and vulnerability scans on a single
    local or a remote system, perform remediation of the system, and generate reports
    based on scan evaluations. Note that SCAP Benchmark has limited functionality
    compared with the oscap command-line utility. SCAP Benchmark processes security
    content in the form of data-stream files.


    ### 6.8.1. Using SCAP Workbench to scan and remediate the system


    To evaluate your system against the selected security policy, use the following
    procedure.


    ### Prerequisites


    - The scap-benchmark package is installed on your system.


    ### Procedure


    - 1. To run SCAP Workbench from the GNOME Classic desktop environment, press the
    Super key to enter the Activities Overview, type scap-workbench, and then press
    Enter. Alternatively, use:


    ```

    $ scap-workbench &

    ```


    - 2. Select a security policy using either the following options:


    - Load Content button on the starting window

    - Open content from SCAP Security Guide

    - Open Other Content in the File menu, and search the respective XCCDF, SCAP RPM,
    and data stream file.


    # Open SCAP Security Guide


    ![](img/ce7756f7a90c9abeaf166ca2952129eb_49_0.png)


    - 3. You can allow automatic correction of the system configuration by selecting
    the **Remediate** check box. With this option enabled, **SCAP Workbench** attempts
    to change the system configuration in accordance with the security rules applied
    by the policy. This process should fix the related checks that fail during the
    system scan.


    > WARNING

    > If not used carefully, running the system evaluation with the **Remediate**
    option enabled might render the system non-functional. Red Hat does not provide
    any automated method to revert changes by security-hardening remediations. Remedations
    are supported on RHEL systems in the default configuration. If your system has
    been altered after the installation, running remediation might not make it compliant
    with the required security profile.


    - 4. Scan your system with the selected profile by clicking the **Scan** button.


    # ssg-rhel8-ds.xml - SCAP Workbench


    | File | Help |

    |---|---|

    | Title | Guide to the Secure Configuration of Red Enterprise Linux 8 |

    | Customization | /home/joesc/ssg-rhel8-ds.tailoring.xml |

    | Profile | Protection Profile for General Purpose Operations (151) | Customize
    |

    | Target | Local Machine Remote Machine (over SSH) Expand all |

    | Rules | Extend Audit Backup Limit for the Audit Daemon fail<br>Enable Auditing
    for Processes Which Start Prior to the Audit Daemon fail<br>Enable audit pass<br>Configure
    SSSD to Expire Credentials<br>Configure SSSD''s Memory Cache to Expire pass<br>Disable
    SSH Login fail<br>Disable SSH Access via Empty Passwords fail<br>Kerberos Authentication
    pass<br>Host-Based Authentication pass<br>Disable SSH Support for Rhosts RSA Authentication
    pass<br>Disable SSH Support for User Known Hosts fail | 100% (151 results, 151
    selected) |


    - 5. To store the scan results in form of XCCDF, ARF, or HTML file, click the
    **Save Results** combo box. Choose the **HTML Report** option to generate the
    scan report in human-readable format. The XCCDF and ARF (data stream) formats
    are suitable for automatic processing. You can repeatedly choose all three options.


    - 6. To export results-based remediation to a file, use the **Generate remediation
    role** pop-up menu.


    ### 6.8.2. Customizing a security profile with SCAP Workbench


    You can customize a security profile by changing parameters in certain rules (for
    example, minimum password length), removing rules that you cover in a way, and
    adding additional rules, to implement internal policies. You cannot define new
    rules by customizing a profile.


    The following procedure demonstrates the use of **SCAP Workbench** for customizing
    (tailoring) a profile. You can also save the tailored profile for use using the
    **oscap** command-line utility.


    ### Prerequisites


    - The scap-workbench package is installed on your system.


    ### Procedure


    - 1. Run **SCAP Workbench**, and select the profile to customize by using either
    **Open content from SCAP Security Guide** or **Open Other Content** in the **File**
    menu.


    - 2. To adjust the selected security profile according to your needs, click the
    **Customize** button.

