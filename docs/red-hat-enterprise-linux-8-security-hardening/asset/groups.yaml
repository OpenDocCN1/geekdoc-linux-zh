    # CHAPTER 9. CONFIGURING AUTOMATED UNLOCKING OF ENCRYPTED VOLUMES USING POLICY-BASED
    DECRYPTION


    The Policy-Based Encryption (PBD) is a collection of technologies that enable
    unlocking root and secondary volumes on hard drives and virtual machines. PBD
    uses a variety of unlocking methods, such as user passwords, a Trusted Platform
    Module (TPM) device, a PKCS #11 device connected to a system, for example, a smart
    card, or a network server.


    PBD also combining different unlocking methods into a policy, which makes it possible
    to unlock the same volume in different ways. The current implementation of the
    PBD in Red Hat Enterprise Linux consists of the Clevis framework and plug-ins
    pins. Each pin provides a separate unlocking capability. Currently, the following
    pins are:


    +   - tang - allows volumes to be unlocked using a network server

    - tpm2 - allows volumes to be unlocked using a TPM2 policy


    The Network Bound Disk Encryption (NBDE) is a subcategory of PBD that allows binding
    encrypted volumes to a special network server. The current implementation of the
    NBDE includes a Clevis pin for Tang server and the Tang server itself.


    # 9.1. NETWORK-BOUND DISK ENCRYPTION


    In Red Hat Enterprise Linux, NBDE is implemented through the following components
    and technologies.


    Figure 9.1 NBDE scheme when using LUKS1-encrypted volume. The luksmeta package
    is not used for LUKS2 volumes.


    | CLEVIS FRAMEWORK | TANG SERVER |

    | :--- | :--- |

    | Clevis Pin for Tang | |

    | Jose Crypto Library | Jose Crypto Library |


    Tang is a server for binding data to a network presence. It makes a system containing
    your data available when the system is bound to a secure network. Tang is stateless
    and does not require TLS or authentication. Unlike escrow-based solutions, where
    the server stores all encryption keys and has knowledge of every key used, Tang
    interacts with any client keys, so it never gains identifying information from
    the client.


    Clevis is a pluggable framework for automated decryption. In NBDE, Clevis provides
    automated unlocking of LUKS volumes. The clevis package provides the client side
    of the feature.'
- md: '

    ## 9. CONFIGURING AUTOMATED UNLOCKING OF ENCRYPTED VOLUMES USING POLICY-BASED
    DECRYPTION


    A Clevis pin is a plug-in to the Clevis framework. One of such pins is a plug-in
    that implements interactions with the NBDE server – Tang.


    Clevis and Tang are client and server components that provide network-bound encryption.
    In Red Hat Enterprise Linux, they are used in conjunction with LUKS to encrypt
    and decrypt root and non-root volumes to accomplish Network-Bound Disk Encryption.


    Both client- and server-side components use the Jose library to perform provisioning
    encryption and decryption operations.


    When you are provisioning NBDE, the Clevis pin for Tang gets a list of the Tang
    server''s advertised asymmetric keys. Alternatively, since the keys are asymmetric,
    a list of Tang''s public keys can be distributed out of band so that clients operate
    without access to the Tang server. This mode is called offline provisioning.


    The Clevis pin for Tang uses one of the public keys to generate a unique, cryptographically-strong
    encryption key. Once the data is encrypted using this key, the key is discarded.
    The Clevis client should store the state produced by provisioning operation in
    a convenient location. Process of encrypting data is the provisioning step.


    The LUKS 2 (LUKS2) is the default format in Red Hat Enterprise Linux 8, hence,
    the provisioning state for NBDE is stored in a LUKS2 header. The leveraging of
    provisioning state for NBDE by the lukmeta package is used only for volumes encrypted
    with LUKS1. The Clevis pin for Tang supports both LUKS1 and LUKS2 without specification
    need.


    When the client is ready to access its data, it loads the metadata produced in
    the provisioning step and responds to recover the encryption key. This process
    is the recovery step.


    In NBDE, Clevis binds a LUKS volume pin so that it can be automatically unlocked.
    After successful completion of the binding process, the disk can be unlocked using
    the provided Drac unlocker.


    ## 9.2. INSTALLING AN ENCRYPTION CLIENT - CLEVIS


    Use this procedure to deploy and start using the Clevis pluggable framework on
    your system.


    Procedure


    - 1. To install Clevis and its pins on a system with an encrypted volume:


    ```

    # yum install clevis

    ```


    - 2. To decrypt data, use a clevis decrypt command and provide a cipher text in
    the JSON Web Encryption (JWE) format, for example:


    ```

    $ clevis decrypt < secret.jwe

    ```


    Additional resources


    - - For a quick reference, see the built-in CLI help:


    ```

    $ clevis

    Usage: clevis COMMAND [OPTIONS]


    clevis decrypt      Decrypts using the policy defined at encryption time

    ```


    - clevis encrypt sss Encrypts using Shamir''s Secret Sharing policy

    - clevis encrypt tang Encrypts using a Tang binding server policy

    - clevis encrypt tpm2 Encrypts using a TPM2. chip binding policy

    - clevis binds Binds a LUKS device using the specified policy

    - clevis lists Lists pins bound to a LUKSv1 or LUKSv2 device

    - clevis pass Returns the LUKS passphrase used for binding a particular slot.

    - clevis regen Regenerates LUKS metadata

    - clevis report Report any key rotation on the server side

    - clevis unbind Unbinds a pin bound to a LUKS volume

    - clevis unlock Unlocks a LUKS volume


    - - For more information, see the clevis(1) man page.


    ## 9.3. DEPLOYING A TANG SERVER WITH SELINUX IN ENFORCING MODE


    Use this procedure to deploy a Tang server running on a custom port as a confined
    service in SELinux enforcing mode.


    ### Prerequisites


    - - The policycoreutils-python-utils package and its dependencies are installed.


    ### Procedure


    - 1. To install the tang package and its dependencies, enter the following command
    as root:

    ```bash

    # yum install tang

    ```


    - 2. Pick an unoccupied port, for example, 7500/tcp, and allow the tangd service
    to bind to that port:

    ```bash

    # semanage port -a t tangd_port -p tcp 7500

    ```


    Note that a port can be used by only one service at a time, and thus an attempt
    to use an already occupied port will return the ValueError: Port already defined
    error message.


    - 3. Open the port in the firewall:

    ```bash

    # firewall-cmd --add-port=7500/tcp

    # firewall-cmd --runtime-to-permanent

    ```


    - 4. Enable the tangd service:

    ```bash

    # systemctl enable tangd.socket

    ```


    - 5. Create an override file:

    ```bash

    # systemctl edit tangd.socket

    ```


    - 6. In the editing screen, which opens an empty override.conf file located in
    the /etc/systemd/system/tangd.socket.d/ directory, change the default port for
    the Tang server from 80 to the previously picked number d by adding the following
    lines:


    ```

    [Socket]

    ListenStream=

    ListenStream=7500

    ```


    Save the file and exit the editor.


    - 7. Reload the changed configuration:


    ```

    # systemctl daemon-reload

    ```


    - 8. Check that your configuration is working:


    ```

    # systemctl show tangd.socket -p Listen

    Listen=[:]:7500 (Stream)

    ```


    - 9. Start the tangd service:


    ```

    # systemctl start tangd.socket

    ```


    Because tangd uses system socket activation mechanism, the server starts as soon
    as the first connection comes in. A new set of cryptographic keys is automatically
    generated at the first start. To perform cryptographic operations such as manual
    key generation, use the jose utility.


    Additional resources


    - - tang(8) man page

    - semanage(8) man page

    - firewall-cmd(1) man page

    - systemd.unit(5) and systemd.socket(5) man pages

    - jose(1) man page


    ## 9.4. ROTATING TANG SERVER KEYS AND UPDATING BINDINGS ON CLIENTS


    Use the following steps to rotate your Tang keys and update existing bindings
    on clients. The precise interval at which you should rotate them depends on your
    application, key sizes, and institutional policy.


    Prerequisites


    - - A Tang server is running.

    - The clevis and clevis-luks packages are installed on your clients.

    - Note that clevis list, clevis luks report, and clevis luks regen have been introduced
    in RHEL 8.2.


    Procedure


    - 1. To rotate keys, generate new keys using the /usr/libexec/tangd-keygen command
    in the /var/db/tang key database directory on the Tang server:


    ```

    # ls /var/db/tang

    UVQ6xSweb1RKG3KbjMdiR020yh.jwk y9hXLQTISSiB5jSEGWjnnhyH8FDTJU.jwk

    # /usr/libexec/tangd-keygen /var/db/tang

    # ls /var/db/tang

    UVQ6xSweb1RKG3KbjMdiR020yh.jwk y9hXLQTISSiB5jSEGWjnnhy8FDTJU.jwk

    3ZWS6-cRCG61UPJS2BmMPU4154 zluX6hijUy_PeseUEFI7hi8.jwk

    ```


    - 2. Check that your Tang server accepts the signing key for your new key, for
    example:


    ```

    # tang-show-keys 7500

    3ZWS6-cRCG61UPJS2BmMPU4154

    ```


    - 3. Rename the old keys that have a leading . to hide them from advertisement.
    Note that the file names in the example differs from unique file names in the
    key directory of your Tang server:


    ```

    # cd /var/db/tang

    # ls -l

    -rw-r--r-- 1 root 354 Sep 23 16:08 3ZWS6-cRCG61UPJS2BmMPU4154.jwk

    -rw-r--r-- 1 root 349 Sep 29 16:08 1-zluX6hijUy_PeseUEFI7hi8.jwk

    -rw-r--r-- 1 root 349 Feb 7 14:55 UVQ6xSweb1RKG3KbjMdiR020yh.jwk

    -rw-r--r-- 1 root 354 Feb 7 14:55 y9hXLQTISSiB5jSEGWjnnhy8FDTJU.jwk

    # mv UVQ6xSweb1RKG3KbjMdiR020yh.jwk y9hXLQTISSiB5jSEGWjnnhy8FDTJU.jwk

    # mv y9hXL...y8FDTJU.jwk

    ```


    Tang immediately picks up all changes. When you add new keys, clients pick up
    the new keys and old clients can continue to use the old keys.


    - 4. On NBDE clients, use the clevis lugs report command to check if the keys
    are advertised by the Tang server remains the same. You can identify slots using
    the clevis lugs command, for example:


    ```

    # clevis lugs list -d /dev/sda2

    1: {"url":"http://tang.srv/"}

    # clevis lugs report -d /dev/sda2 -s 1

    ...

    Reported that some keys were rotated.

    Do you want to regenerate metadata with ''clevis lugs regen -d /dev/sda2 -s 1?''
    [y/N]

    ```


    - 5. To generate LUKS metadata for the new keys either y to prompt of the previous
    command, or use the clevis lugs regen command:


    ```

    # clevis lugs regen -d /dev/sda2 -s 1

    ```


    - 6. When you are sure that all old clients use the new keys, remove the old keys
    from the Tang server, for example:


    ```

    # cd /var/db/tang

    # rm ..*.jwk

    ```

