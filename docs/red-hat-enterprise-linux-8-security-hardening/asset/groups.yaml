    # CHAPTER 6. SCANNING THE SYSTEM FOR CONFIGURATION COMPLIANCE AND VULNERABILITIES


    A compliance audit is a process of determining whether an object follows all the
    rules specified in a compliance policy. The compliance policy is defined by security
    professionals who specify the required settings, often in the form of a checklist,
    that a computing environment should use.


    Compliance policies can vary substantially across organizations and even different
    systems within the same organization. Differences among these policies are based
    on the purpose of each system and its importance for the organization. Custom
    software settings and deployment characteristics also raise a need for custom
    policy checks.


    ## 6.1. CONFIGURATION COMPLIANCE TOOLS IN RHEL


    Red Hat Linux provides tools that enable you to perform a fully automated compliance
    audit. These tools are based on the Security Content Automation Protocol (SCAP)
    and are designed for automated auditing of compliance policies.


    - **SCAP Workbench** - The scap-workbench graphical utility is designed to perform
    configuration and vulnerability scans on a local or remote system. You can use
    it to generate reports based on these scans and evaluations.

    - **OpenSCAP** - The **OpenSCAP** library, with the accompanying **oscap** command-line
    utility, is designed to perform configuration and vulnerability scans on a local
    system, to validate configuration content, and to generate reports and guides
    based on scans and evaluations.

    - **SCAP Security Guide (SSG)** - The **scap-security-guide** package provides
    the latest collection of security policies for Linux systems. The guidance consists
    of a catalog of policy hardening advice, linked to government requirements where
    applicable. The project bridges the gap between generalized policy requirements
    and specific implementation guidelines.

    - **Script Engine (SCE)** - SCE is an extension to the SCAP protocol that allows
    administrators to write their security content using a scripting language, such
    as Bash, Python, and Ruby. The SCE extension is provided in the **openscap-engine-sce**
    package. The SCE itself is not part of SCAP standard.


    To perform automated audits on multiple systems, you can use the OpenSCAP solution
    for Red Hat Satellite.


    ### Additional resources


    - **oscap()** - The manual for the **oscap** command-line utility provides a list
    of available options and explanations of their usage.

    - **Red Hat Demos: Creating Customized Security Policy Content to Automate Security
    Compliance** - A hands-on lab to get initial experience in automating security
    compliance using the tools available in Red Hat Enterprise to comply with both
    industry standard security policies and custom policies. If you are training or
    need to access these exercises for your team, contact your Red Hat account for
    additional details.

    - **Red Hat Demos: Defend Yourself with RHEL Security Technologies** - A hands-on
    lab to learn how to implement security at all levels of your RHEL system, using
    the key security technologies available to you in Red Hat Enterprise Linux, including
    OpenSCAP. If you want training or access to these exercises for your team, contact
    your Red Hat account team for additional details.

    - scap-workbench(8) - The manual for the SCAP Workbench application provides a
    basic information about the application as well as links to potential sources
    of SCAP content.

    - scap-security-guide(8) - The manual for the scap-security-guide project provides
    further documentation about the various available SCAP security profiles. Examples
    of how to utilize the benchmarks using the OpenSCAP utility are provided as well.

    - For more details about using OpenSCAP with Red Hat Satellite, see Security Compliance
    Management in the Administer Red Hat Satellite Guide.


    ## 6.2. VULNERABILITY SCANNING


    ### 6.2.1. Red Hat Security Advisories OVAL feed


    Red Hat Enterprise Linux auditing capabilities are based on the Security Content
    Automation Protocol (SCAP) standard. SCAP is a multi-purpose framework of specifications
    that supports automated configuration, vulnerability and patch checking, technical
    control compliance auditing, and security measurement.


    SCAP specifications create an ecosystem where the format of security content is
    well-known and standardized although the implementation of the scanner or policy
    editor is not mandated. This enables organizations to build their security policy
    (SCAP) once, no matter how many security vendors employ.


    The Open Vulnerability Assessment Language (OVAL) is the essential and only component
    of SCAP. Unlike other tools and custom scripts, OVAL describes a required state
    of resources in a declarative manner. OVAL code is never executed directly unless
    an OVAL interpreter tool calls it. The declarative nature of OVAL ensures that
    the assessed system is not accidentally identified.


    Like other SCAP components, OVAL is based on XML. The SCAP standard defines several
    document formats. Each of them contains a different kind of information and serves
    a purpose.


    Red Hat Product Security helps customers evaluate and manage risk by tracking
    and investigating all security issues affecting Red Hat customers. It provides
    timely and concise patches and security advisories on the Red Hat Customer Portal.
    Red Hat creates and provides OVAL path definitions, providing machine-readable
    versions of our advisories.


    Because of differences between platforms, versions, and other factors, Red Hat
    Product Security qualitative ratings of vulnerabilities do not directly align
    with the Common Vulnerability Scoring System (CVSS) baseline ratings by third
    parties. Therefore, we recommend that you use the RHSA oval instead of those provided
    by third parties.


    The RHSA OVAL definitions are individually and a complete package, and are updated
    within an hour of a new security advisory made on the Red Hat Customer Portal.


    Each OVAL path maps one-to-one to a Red Hat Security Advisory (RHSA). Because
    an RHSA can contain fixes for multiple vulnerabilities, each vulnerability is
    listed separately by its Common Vulnerabilities and Exposures (CVE) and has a
    link to it in our public database.


    The RHSA oval definitions are designed to check for vulnerable versions of RPM
    packages installed on a system. It is possible to extend these definitions to
    include further checks, for example, to find out the packages are being used in
    a vulnerable configuration. These definitions are designed to cover software and
    updates shipped by Red Hat. Additional definitions are required to detect the
    patch status of third-party software.


    #### NOTE


    To scan containers or container images for security vulnerabilities, see [Scanning
    Containers and Container Images for Vulnerabilities].


    Additional resources


    - Red Hat and OVAL compatibility

    - Red Hat and CVE compatibility

    - Notifications and Advisories in the [Product Security Overview]

    - Security Data Metrics

    - Scanning Containers and Container Images for Vulnerabilities


    ## 6.2.2. Scanning the system for vulnerabilities


    **oscap** command-line utility enables you to scan local systems, validate configuration
    content, and generate reports and guides based on these scans and evaluations.
    This utility serves as a front end to the OpenSCAP library and groups its functionalities
    to modules (sub-commands) based on the type of SCAP content it processes.


    #### Prerequisites


    - The **AppStream** repository is enabled.


    #### Procedure


    1. Install the **openscap-scanner** package:


    ```bash

    sudo yum install openscap-scanner

    ```


    2. Download the latest RHSA OVAL definitions for your system:


    ```bash

    # wget -O - https://www.redhat.com/security/data/oval/v2/RHEL8/rhel-8.oval.bz
    | bzip2 -decompress > rhel-8.oval.xml

    ```


    3. Scan the system for vulnerabilities and save results to the *vulnerability.html*
    file:


    ```bash

    # oscap oval eval --report vulnerability.html rhel-8.oval.xml

    ```


    #### Verification steps


    1. Check the results in a browser of your choice, for example:


    ```bash

    # firefox vulnerability.html &

    ```


