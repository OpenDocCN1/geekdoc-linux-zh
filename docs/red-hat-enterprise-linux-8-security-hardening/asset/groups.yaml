    # CHAPTER 1. OVERVIEW OF SECURITY HARDENING IN RHEL


    Due to the increased reliance on powerful, networked computers to help run businesses
    and keep track of our personal information, entire industries have been formed
    around the practice of network and computer security. Enterprises have solicited
    the knowledge and skills of security experts to properly audit systems and tailor
    solutions to fit the operating requirements of their organization. Because most
    organizations are increasingly dynamic in nature, workers are accessing critical
    company IT resources locally and remotely, the need for secure computing environments
    has become more pronounced.


    Unfortunately, many organizations, as well as individual users, regard security
    as of an afterthought, a process that is overlooked in favor of increased power,
    productivity, convenience, ease of use, and budgetary concerns. Proper security
    implementation is often postponed – after an unauthorized intrusion has already
    occurred. Taking the correct measures prior to connecting a site to an untrusted
    network, such as the Internet, is an effective means of thwarting many attempts
    at intrusion.


    # 1.1. WHAT IS COMPUTER SECURITY?


    Computer security is a general term that covers a wide area of computing and information
    processing. Industries that depend on computer systems and networks to conduct
    daily business transactions and access critical information regarding their data
    as an important part of their overall assets. Several terms and metrics have entered
    our daily business vocabulary, such as total cost of ownership (TCO), return on
    investment (ROI), and quality of service (QoS). Using these metrics, industries
    can calculate aspects such as data integrity and high-availability (HA) as part
    of their planning and process management costs. In some industries, as electronic
    commerce, the availability and trustworthiness of data can mean the difference
    between success and failure.


    # 1.2. STANDARDIZING SECURITY


    Enterprises in every industry follow regulations and rules that are set by standards-making
    bodies such as the American Medical Association (AMA) or the Institute of Electrical
    and Electronics Engineers (IEEE). The same concepts hold for information security.
    Many security consultants and vendors agree upon the standard security model known
    as CIA, *Confidentiality, Integrity, and Availability*. This three-tiered model
    is a generally accepted concept for assessing risks of sensitive information and
    establishing security policy. The following describes the CIA model in further
    detail:


    +   - Confidentiality – Sensitive information must be available only to a set
    of pre-defined individuals. Unauthorized transmission and usage of information
    should be restricted. For example, confidentiality of information ensures that
    a customer''s personal or financial information is not obtained by an unauthorized
    individual for malicious purposes such as identity theft or fraud.


    +   - Integrity – Information should not be altered in ways that render it incomplete
    or incorrect. Unauthorized users should be restricted from the ability to modify
    or destroy sensitive information.


    +   - Availability – Information should be accessible to authorized users any
    time that it is needed. Availability is a warranty that information can be obtained
    with an agreed-upon frequency and timeliness. This is often measured in terms
    of percentages and agreed to formally in Service Level Agreements (SLAs) used
    by network providers and for their enterprise clients.


    # 1.3. CRYPTOGRAPHIC SOFTWARE AND CERTIFICATIONS'
