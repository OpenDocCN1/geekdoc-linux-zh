    **Strong crypto defaults by removing insecure cipher suites and protocols

    The following list contains cipher suites and protocols removed from the core
    cryptographic libraries in RHEL 8. They are not present in the sources, or their
    support is disabled during the build, so applications cannot use them.


    +   - DES (since RHEL 7)

    - All export cipher suites (since RHEL 7)

    - MD5 in signatures (since RHEL 7)

    - SSLv2 (since RHEL 7)

    - SSLv3 (since RHEL 8)

    - All ECC curves < 224 bits (since RHEL 6)

    - All binary field ECC curves (since RHEL 6)


    # Cipher suites and protocols disabled in all policy levels


    The following cipher suites and protocols are disabled in all crypto policy levels.
    They can be enabled by only an explicit configuration of individual protocols.


    +   - DH with parameters < 1024 bits

    - RSA with key size < 1024 bits

    - Camellia

    - ARIA

    - SEED

    -IDEA

    - Integrity-only cipher suites

    - TLS CBC mode cipher suites using SHA-384 HMAC

    - AES-CCM8

    - All ECC curves incompatible with TLS 1.3, including secp256k

    - Ikev1 (since RHEL 8)


    # Cipher suites and protocols enabled in the crypto-policy levels


    The following table shows the enabled cipher suites and protocols in all four
    crypto-policy levels.'
