    When performing an outside-looking-vulnerability assessment, you are attempting
    to compromise your systems from within. Being external to your company provides
    you with the cracker''s point of view. You see what a cracker sees—roughly IP
    addresses, systems on your DMZ, external interfaces of your firewall, and DMZ
    for "demilitarized zone", which corresponds to a computer or small subnet that
    sits between a trusted internal network, such as a corporate LAN, and an untrusted
    external network, such as the public Internet. Typically, the DMZ devices accessible
    to Internet traffic, such as web (HTTP) servers, FTP servers, SMTP (e-mail) servers
    and DNS servers.


    When you perform an inside-looking vulnerability assessment, you are at an advantage
    since you are internal and your status is trusted. This is the point of view you
    and your co-workers have logged on to your systems. You see server files, databases,
    and other resources.


    There are striking distinctions between the two types of vulnerability assessments.
    Being internal to your company gives you more privileges than an outsider. In
    most organizations, security is configured to keep intruders out. Little is done
    to secure the internals of the organization (such as departmental firewalls, user-level
    access controls, and authentication procedures for internal resources). Typically,
    there are many more resources when looking inside most systems that are internal
    to a company. Once you are outside the company, your status is untrusted. The
    systems and resources available to you are externally limited.


    Consider the difference between vulnerability assessments and penetration tests.
    A vulnerability assessment is as the first step to a penetration test. The information
    gleaned from the assessment is used for testing. Whereas the assessment is undertaken
    to check for holes and potential vulnerabilities, the penetration testing actually
    attempts to exploit the faults.


    Assessing network infrastructure is a dynamic process. Security, both information
    and physical, is dynamic. Performing an assessment shows an overview, which can
    turn up false positives and false negatives. A false positive is a result, where
    the tool finds vulnerabilities in reality do do not exist. A false negative is
    when it omits actual vulnerabilities.


    Security administrators are only as good as the tools they use and the knowledge
    they retain. Take any of the assessment tools currently available, run them against
    your system, and it is almost a guarantee that there are some false positives.
    By program fault or user error, the result is the same. The tool may find false
    positives, or even worse, false negatives.


    Now that the difference between a vulnerability assessment and a penetration test
    is defined, take the findings of the assessment and review them carefully before
    conducting a penetration test as part of your best practices approach.


    > WARNING

    Do not attempt to exploit vulnerabilities on production systems. Doing so can
    have adverse effects on productivity and efficiency of your systems and network.


    The following list examines some of the benefits of performing vulnerability assessments.


    - Creates proactive focus on information security.

    - Finds potential exploits before crackers find them.

    - Results in systems being kept up to date and patched.


    Red Hat Enterprise Linux 8 Security hardening


    - Promotes growth and aids in developing staff expertise.

    - Abates financial loss and negative publicity.


    ## 1.5.2. Establishing a methodology for vulnerability assessment


    To aid in the selection of tools for a vulnerability assessment, it is helpful
    to establish a vulnerability assessment methodology. Unfortunately, there is no
    predefined or approved industry methodology at this time; however, common sense
    and best practices can act as a sufficient guide.


    What is the target? Are we looking at one server, or are we looking at our entire
    network and everything within the network? Are we external or internal to the
    company? The answers to these questions are important as they help determine not
    which tools to select but also the manner in which they are used.


    To learn more about establishing methodologies, see the following website:


    - https://www.owasp.org/ – The Open Web Application Security Project


    ## 1.5.3. Vulnerability assessment tools


    An assessment can start by using some form of an information-gathering tool. When
    assessing the entire network, map the first layer to find the hosts that are running.
    Once, examine each host individually. Focusing on these requires another set of
    tools. Knowing which tools to use may be the most crucial step in finding vulnerabilities.


    The following tools are just a small sampling of the available tools:


    - Nmap is a popular tool that can find hosts and open ports on those systems.
    To install Nmap from the AppStream repository, use the yum install nmap command
    as the root. See the nmap(1) man page for information.

    - The tools from the OpenSCAP, such as the oscap command-line utility and the
    scapworkbench graphical utility, provides a fully automated compliance audit.
    See Scanning the system for security compliance and vulnerabilities for more information.

    - Advanced Intrusion Detection Environment (AIDE) is a utility that creates a
    database of files on the system, and then uses that database to ensure file integrity
    and detect system intrusions. See Checking integrity with AIDE for more information.


    ## 1.6. SECURITY THREATS


    ### 1.6.1. Threats to network security


    Bad practices when configuring the following aspects of a network can increase
    the risk of an attack.


    ### Insecure architectures


    A misconfigured network is a primary entry point for unauthorized users. Leaving
    a trust-based, open local network vulnerability to the highly-insecure Internet
    is like leaving a door open in a crime-ridden neighborhood—nothing may happen
    for an arbitrary amount of time, but someone exploits the opportunity eventually.


    ### Broadcast networks


    System administrators often fail to realize the importance of networking hardware
    in their security schemes. Simple hardware, such as hubs and routers, on the broadcast
    or non-switched protocol; that, whenever a node transmits data across the network
    to a recipient node, the hub or router sends a broadcast of the data packets to
    the recipient node receives and processes the data. This method is the most vulnerable
    to address resolution protocol (ARP) or media access control (MAC) address spoofing
    by both outside intruders and unauthorized users on local hosts.


    ### Centralized servers


    Another potential pitfall is the use of centralized computing. A common cost-cutting
    measure for many businesses is to consolidate all services to a single powerful
    machine. This can be convenient as it is easier to manage and considerably less
    than multiple-server configurations. However, a centralized server introduces
    a single point of failure on the network. If the central server is compromised,
    it may render the network completely useless or worse, prone to data manipulation
    or theft. In these situations, a central server becomes an open door that allows
    access to the entire network.


    ### 1.6.2. Threats to server security


    Server security is as important as network security because servers hold a great
    deal of an organization''s vital information. If a server is compromised, all
    of its contents may become available for the hacker to steal or manipulate at
    will. The following sections detail some of the main issues.


    ### Unused services and open ports


    A full installation of Red Hat Linux 8 contains more than 1000 applications and
    library packages. However, most server administrators do not install every package
    in the distribution, preferring instead to install a baseline installation of
    packages, including several server applications.


    A common occurrence among system administrators is to install the operating system
    without paying attention to what programs are actually being installed. This is
    because unnecessary services may be installed, configured with the default settings,
    and possibly turned on. This can cause unwanted services, such as Telnet, DHCP,
    or DNS, to run on a server or workstation the administrator realizing it, which
    in turn can cause unwanted traffic to the server or even a potential pathway into
    the system for crackers.


    ### Unpatched services


    Most server applications that are installed in a default installation are solid,
    thoroughly tested of software. Having been in use in production environments for
    many years, their code has been thoroughly refined and many of the bugs have been
    found and fixed.


    However, there is no such thing as perfect software and there is always room for
    refinement. Moreover, newer software is often not as rigorously as one might expect,
    because of its recent arrival to production environments or it may not be as popular
    as other server software.


    ### Inattentive administration

