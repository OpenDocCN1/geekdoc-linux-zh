    # 摘要


    本书帮助用户和管理员学习工作站和服务器免受本地和远程入侵、利用以及恶意活动的流程与实践。本指南重点关注 Red Hat Enterprise Linux，但详细介绍了适用于所有
    Linux 系统的概念和技术，详细阐述了为数据中心、工作场所和家庭创建安全计算环境所需的规划和工具。通过适当的管理知识、警性和工具，运行 Linux 既可以充分发挥功能，又能防御大多数常见的入侵和利用方法。


