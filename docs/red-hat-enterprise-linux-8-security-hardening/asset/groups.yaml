    # CHAPTER 2. SECURING RHEL DURING INSTALLATION


    Security begins even before you start the installation of Red Hat Enterprise Linux.
    Configuring your system securely from the beginning makes it easier to implement
    additional security settings later.


    ## 2.1. BIOS AND UEFI SECURITY


    Password protection for the BIOS (or BIOS equivalent) and the boot loader can
    prevent unauthorized users who have physical access to systems from booting using
    removable media or obtaining privileges through single user mode. The security
    measures you should take to protect against such attacks depends on the sensitivity
    of the information on the workstation and the location of the machine.


    For example, if a machine is used in a trade show and contains no sensitive information,
    it may not be critical to prevent such attacks. However, if an employee''s laptop
    with private, unencrypted SSH keys for the corporate network is left unattended
    at that same store, it could lead to a major security breach with ramifications
    for the entire company.


    If the workstation is located in a place where authorized or trusted people have
    access, however, securing the BIOS or the boot loader may not be necessary.


    ### 2.1.1. BIOS PASSWORDS


    The primary reasons for changes to BIOS settings—if an intruder accesses the BIOS,
    they can set it to:


    - Preventing changes to BIOS settings—if an intruder accesses the BIOS, they can
    set it to boot from a CD-ROM or a flash drive. This makes it possible for them
    to enter rescue mode or single user mode, which in turn allows them to start arbitrary
    processes on the system or copy sensitive data.

    - Preventing system booting–Some BIOSes allow password protection of the boot
    process. When activated, an attacker is forced to enter a password before the
    BIOS launches the boot loader.


    Because the methods for setting a BIOS password vary between different computers,
    consult the computer''s manual for specific instructions.


    If you forget the BIOS password, it can either be reset with jumpers on the motherboard
    or by disconnecting the CMOS battery. For this reason, it is good practice to
    lock the computer case if possible. However, consult the manual for the computer
    or motherboard before attempting to disconnect the CMOS battery.


    ### 2.1.1.1. Non-BIOS-based systems security


    Other systems and architectures use different programs to perform low-level tasks
    roughly equivalent to those of the BIOS on x86 systems. For example, the Unified
    Extensible Firmware Interface (UEFI) shell. For instructions on password protecting
    BIOS-like programs, see the manufacturer''s instructions.


    ## 2.2. DISK PARTITIONING


    Red Hat recommends creating partitions for the /boot, /, /home, /tmp and /var/tmp/
    directories. The reasons for each are different, and we will address each partition.


    ### /boot


    This partition is the first partition that is read by the system during boot up.
    The boot loader and kernel images used to boot your system into Red Hat Linux
    8 are stored in this partition. This partition should not be encrypted. If this
    partition is included in / that partition becomes encrypted or otherwise unavailable
    your system will not be able to boot.


    ### /home


    When user data (/home) is stored instead of a separate partition, the partition
    can fill causing the operating system to become unstable. Also, when upgrading
    your system to the next version of Red Hat Linux 8 it is later you can keep your
    data in the /home partition it will not be overwritten during installation. If
    the root partition (/) corrupts your data could be lost forever. By using a separate
    partition there slightly more protection against data loss. You can also target
    this partition for frequent backups.


    ### /tmp and /var/tmp


    Both the /tmp and /var/tmp directories are used to store data that does not need
    to be stored for a long period of time. However, if a lot of data floods one of
    these directories it consume all of your storage space. If this happens and these
    directories are stored within / then your system could become unstable and crash.
    For this reason, moving these directories into their own partitions is a good
    idea.


    ### NOTE


    During the installation process, you have an option to encrypt partitions. You
    must supply a passphrase. This passphrase serves as a key to unlock the block
    encryption key, which is used to secure the partition''s data.


    ## 2.3. RESTRICTING NETWORK CONNECTIVITY DURING THE INSTALLATION PROCESS


    When installing Red Hat Enterprise Linux 8, the installation medium represents
    a snapshot of the system at a particular time. Because of this, it may not be
    up-to-date with the latest security fixes and may be vulnerable to certain issues
    that were fixed only after the system provided by the installation medium was
    released.


    When installing a potentially vulnerable operating system, always limit exposure
    to the closest necessary network zone. The safest choice is the "no network" which
    means to leave your machine disconnected during the installation process. In some
    cases, a LAN or intranet connection is sufficient while the Internet connection
    is the riskiest. To follow the best security practices, choose the closest zone
    with your repository while installing Red Hat Enterprise Linux 8 from a network.


    ## 2.4. INSTALLING THE MINIMUM AMOUNT OF PACKAGES REQUIRED


    It is practice to install only the packages you will use because each piece of
    software on your computer could potentially contain a vulnerability. If you are
    installing from the DVD media, take the opportunity to select exactly what packages
    you want to install during the installation. If you need another package, you
    can add it to the system later.


    ## 2.5. POST-INSTALLATION PROCEDURES


    The following steps are the security-related procedures that should be performed
    immediately after Red Hat Enterprise Linux.


    1. Update your system. Enter the following command as:


    ```bash

    # yum update

    ```


    2. Even though the firewall service, **firewalld**, is automatically enabled with
    the installation of Red Hat Enterprise Linux, there are scenarios where it might
    be explicitly disabled, for example in the kickstart configuration. In such a
    case, it is recommended to consider re-enabling the firewall. To start **firewalld**
    enter the following commands as root:


    ```bash

    # systemctl start firewalld

    # systemctl enable firewalld

    ```


    3. To enhance security, disable services you do not need. For example, if there
    are no printers installed on your computer, disable the **cups** service using
    the following command:


    ```bash

    # systemctl disable cups

    ```


    To review active services, enter the following command:


    ```bash

    $ systemctl list-units | grep service

    ```


