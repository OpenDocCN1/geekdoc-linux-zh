    # CHAPTER 7. CHECKING INTEGRITY WITH AIDE


    Advanced Intrusion Detection Environment (AIDE) is a utility that creates a database
    of files on the system, and then uses that database to ensure file integrity and
    detect system intrusions.


    # 7.1. INSTALLING AIDE


    The following steps are necessary to install AIDE and to initiate its database.


    Prerequisites


    +   - The AppStream repository is enabled.


    Procedure


    +   1. To install the aide package:

    ```bash

    # yum install aide

    ```

    2. To generate an initial database:

    ```bash

    # aide --init

    ```


    > In the default configuration, the aide --init command checks a set of directories
    and files defined in the /etc/aide.conf file. To include additional directories
    or files in the AIDE database, and to change their watched parameters, edit /etc/aide.conf
    accordingly.


    +   3. To start using the aide, remove the .new substring from the initial database
    file name:

    ```bash

    # mv /var/lib/aide/aide.db.new /var/lib/aide/aide.db.gz

    ```

    4. To change the location of the AIDE database, edit the /etc/aide.conf file and
    modify the DBDIR variable. For additional security, store the database, configuration,
    and the /usr/sbin/aide binary file in a secure location such as a read-only media.


    # 7.2. PERFORMING INTEGRITY CHECKS WITH AIDE


    Prerequisites


    +   - AIDE is properly installed and its database is initialized. See Section
    7.1, “Installing AIDE”


    Procedure


    +   1. To initiate a manual check:

    ```bash

    # aide --check

    ```


    > In the default configuration, the aide --init command checks a set of directories
    and files defined in the /etc/aide.conf file. To include additional directories
