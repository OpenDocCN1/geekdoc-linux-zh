    # CHAPTER 4. CONFIGURING APPLICATIONS TO USE CRYPTOGRAPHIC HARDWARE THROUGH PKCS
    #11


    Separating parts of your secret information on dedicated cryptographic devices,
    such as smart cards and cryptographic tokens for end-user authentication and hardware
    security modules (HSM) for server applications, provide an additional layer of
    security. In Red Hat Linux 8, for cryptographic hardware through the PKCS #11
    API is consistent across different applications, and the isolation of secrets
    on cryptographic hardware is not a complicated task.


    # 4.1. CRYPTOGRAPHIC HARDWARE SUPPORT THROUGH PKCS #11


    PKCS #11 (Public-Key Cryptography Standard) defines an application programming
    interface (API) to cryptographic devices that hold cryptographic information and
    perform cryptographic functions. These devices are called tokens, and they can
    be implemented in a hardware or software form.


    A PKCS #11 token can store various types of object such as a certificate; data
    object; and a public, private, or secret key. These objects are uniquely identifiable
    through the PKCS #11 URI scheme.


    A PKCS #11 URI is a standard way to identify a specific object in a PKCS #11 module
    according to the object attributes. This enables you to configure all libraries
    and applications with the same configuration in a string of a URI.


    Red Hat Linux 8 provides the OpenSC PKCS #11 driver for smart cards by default.
    Hardware tokens and HSMs can have their own PKCS #11 modules that do not have
    their counterpart in Red Hat Linux. You can register your PKCS #11 modules with
    the p11-kit tool, which acts as a wrapper over the smart card drivers in the system.


    To make your own PKCS #11 module work on the system, add a new text file to the
    /etc/pkcs11/modules/ directory


    You can add your own PKCS #11 module to the system by creating a new text file
    in the /etc/pkcs11/modules/ directory. For example, the OpenSC configuration file
    in p11-kit looks as follows:


    ```

    $ /usr/share/p11-kit/modules/opensc.module

    module: opensc-pkcs11.so

    ```


    Additional resources


    +   - Consistent PKCS #11 support in Red Hat Enterprise Linux 8

    - The PKCS #11 URI Scheme

    - Controlling access to smart cards


    # 4.2. USING SSH KEYS STORED ON A SMART CARD


    Red Hat Enterprise Linux 8 enables you to use RSA and ECDSA keys stored on a smart
    card on OpenSSH clients. Use this procedure to enable authentication using a smart
    card instead of using a password.


    Prerequisites


    +   - On the client side, the opensc package is installed and the pcsd service
    is running.'
  - '[PAGE 32]


    # Procedure


    +   1. List keys provided by the OpenSC PKCS #11 module including their PKCS #11
    URIs and save the output to the `keys.pub` file:


    ```

    $ ssh-keygen -D pkcs11: > keys.pub

    $ ssh-keygen -D pkcs11:

    ssh-rsa AAAAB3nZaAcyc1e..KMZMCQZX

    ssh-pkcs11:id=%01-SIGN%20public,token=SSH%20key;manufacturer=piv_II?module-path=/usr/lib64/opensc-pkcs11.so

    ecdsa-sha2-int256AAA0KhynnM=

    pkcs11:id=%01-PIV%20AUTH%20public,token=SSH%20key;manufacturer=piv_II?module-path=/usr/lib64/opensc-pkcs11.so

    ```


    +   2. To enable authentication using a smart card on a remote server (example.com),
    transfer the public key to the remote server. Use the `ssh-copy-id` command with
    `keys.pub` created in the previous step:


    ```

    $ ssh-copy-id -i keys.pub username@example.com

    ```


    +   3. To connect to example using the ECDSA key from the output of the `ssh-keygen
    -D` command in step 1, you can just use a subset of the URI, which uniquely references
    your key, for example:


    ```

    $ ssh -i "pkcs11:id=%01-module-path=/usr/lib64/opensc-pkcs11.so"

    Enter PIN for ''SSH key'':

    [example.com] $

    ```


    +   4. You can use the URI string in the ~/.ssh/config file to make the configuration
    permanent:


    ```

    $ cat ~/.ssh/config

    IdentityFile "pkcs11:id=%01?module-path=/usr/lib64/opensc-pkcs11-pkcs11.so"

    $ ssh example.com

    Enter PIN for ''SSH key'':

    [example.com] $

    ```


    Because OpenSSH uses the `p11-pkcs-proxy` wrapper and the OpenSC PKCS #11 module
    is registered to PKCS#11 Kit, you can simplify the previous commands:


    ```

    $ ssh -i "pkcs11:id=%01" example.com

    Enterter PIN for ''SSH key'':

    [example.com] $

    ```


    If you skip the `id=` part of a PKCS #11 URI, OpenSSH loads all keys that are
    available in the proxy module. This can reduce the amount of typing required:


    ```

    $ ssh -i pkcs11:example.com

    Enterter PIN for ''SSH key'':

    [example.com] $

    ```


    # Additional resources


    +   Fedora 28: Better smart card support in OpenSSH'
