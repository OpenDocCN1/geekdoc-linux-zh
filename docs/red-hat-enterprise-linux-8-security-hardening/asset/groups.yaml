    \ man page\n- pscd(8) man page\n\n## 4.3. USING HTTPSING PRIVATE KEYS IN APACHE\
    \ AND NGINX\n\nThe Apache and Nginx HTTP servers can work with private keys stored\
    \ on hardware security modules (HSMs), which helps to prevent the keys' disclosure\
    \ and man-in-the-middle attacks. Note that this usually requires high-performance\
    \ HSMs for busy users.\n\n### Apache HTTP server\n\nFor communication in the form\
    \ of the HTTPS protocol, the Apache HTTP server (httpd) uses the OpenSSL library.\
    \ OpenSSL does not support PKCS #11 natively. To utilize HSMs, you have to install\
    \ the openssl-pkcs11 package, which provides access to PKCS #11 modules through\
    \ the engine interface. You can use a PKCS #11 URI instead of a regular file key\
    \ and a certificate in the `/etc/http/conf.d/ssl.conf` configuration, for example:\n\
    \n```\nSSLCertificateFile \"pkcs11:id=%01;token=softhm;type=cert\"\nSSLCertificateKey\
    \ \"pkcs11:id=%01;token=softhm;type=private;pin=value-111111\"\n```\n\nInstall\
    \ the httpd-manual to obtain complete documentation for the Apache HTTP Server,\
    \ including TLS configurations. The details available in the `/etc/http/conf.d/ssl.conf`\
    \ configuration file are described in detail at /usr/share/http/manual/mod/mod_ssl.html.\n\
    \n### Nginx HTTP and proxy server\n\nBecause Nginx uses the OpenSSL for cryptographic\
    \ operations, for PKCS #11 it must go through the openssl-pkcs11 engine. Nginx\
    \ currently supports only private keys from an HSM, and a certificate must be\
    \ provided separately as a regular file. Modify the ssl_certificate and ssl_certificate_key\
    \ options in the server section of the `/etc/nginx/nginx.conf` configuration file:\n\
    \n```\nssl_certificate /path/to/cert.pem\nssl_certificate_key \"engine:pkcs11:token=softhm;id=%01;type=private;pin=value-111111\"\
    \n```\n\nNote that the engine:pkcs11 prefix is needed for the PKCS #11 URI in\
    \ the Nginx configuration file. This is because the other pkcs11 refers to the\
    \ engine name.\n\n## 4.4. CONFIGURING AUTHENTICATION TO APPLICATIONS USING SMART\
    \ CARDS\n\n- The wget network downloader enables you to specify PKCS #11 URIs\
    \ instead of paths to locally stored private keys, and simplifies creating scripts\
    \ for tasks that require safely stored private keys and certificates. For example:\n\
    \n```\n$ wget -private-key 'pkcs11:token=softhm;id=%01;type=private;pin=value-111111'\
    \ --\ncertificate 'pkcs11:token=softhm;id=%01;type=cert' https://example.com/\n\
    ```\n\nSee the wget(1) man page for more information.\n\n- Specifying PKCS #11\
    \ URI for the curl tool is analogous:\n\n```\n$ curl -key 'pkcs#11:token=softhmid=%01;type=private?pin-value=111111'\
    \ --cert\n  'pkcs#11:token=softhmid=%01;type=cert' https://example.com/'\n```\n\
    \nSee the (curl(1) man page for more information.\n\n- The Firefox web browser\
    \ automatically loads the p1kit-proxy module. This means that every supported\
    \ smart card in the system is automatically detected. For using TLS authentication,\
    \ no additional setup is required and keys from smart card are automatically used\
    \ when a server requests them\n\n### Using PKCS #11 URIs in custom applications\n\
    \nIf your application uses GnuTLS or NSS library, support for PKCS #11 URIs is\
    \ ensured by their built-in support for PKCS #11. Also, applications relying on\
    \ OpenSSL library can access cryptographic hardware thanks to the openssl-pkcs11\
    \ engine. With applications that require working with private keys on smart cards\
    \ and do not use GnuTLS, or OpenSSL, use p1kit to implement registering PKCS #11\
    \ modules. See the p1kit(8) man page for more information.\n\n## 4.5. RELATED\
    \ INFORMATION\n\n- pkcs11.conf(5) man page\n\n## CHAPTER 5. USING SHARED SYSTEM\
    \ CERTIFICATES\n\nThe shared system certificates enables NSS, GnuTLS, OpenSSL,\
    \ and Java to share a default source for retrieving certificate anchors. By default,\
    \ the trust store contains the Mozilla CA list, including positive and negative\
    \ trust. The system allows updating the Mozilla CA list or choosing another list.\n\
    \n### 5.1. THE SYSTEM-WIDE TRUST STORE\n\nIn Enterprise Linux, the consolidated\
    \ system-wide trust store is located in the `/etc/pki/ca-trust/` and `/usr/share/pki/ca-trust/`\
    \ directories. The trust settings in `/usr/share/pki/ca-trust/` are processed\
    \ with lower priority than settings in `/etc/pki/ca-trust/`. Certificate files\
    \ are treated differently depending on the subdirectory they are installed to:\n\
    \n- for trust anchors: `/usr/share/pki/ca-trust/anchors/` and `/etc/pki/ca-trust/anchors/`\n\
    - for distrust certificates: `/usr/share/pki/ca-trust/blacklist/` and `/etc/pki/ca-trust/blacklist/`\n\
    - for certificates in the extended TRUST format: `/usr/share/pki/ca-trust/` and\
    \ `/etc/pki/ca-trust/`\n\n> NOTE: a hierarchical system, a trust anchor is an\
    \ authoritative entity assumed to be trustworthy. For example, in X.509 architecture,\
    \ a root certificate is a trust anchor from which a chain of trust is derived.\
    \ The trust anchor must be put in the possession of the party before path validation\
    \ possible.\n\n### 5.2. ADDING NEW CERTIFICATES\n\n1. To add a certificate to\
    \ simple PEM or DER formats to the trusted list, copy the certificate file to\
    \ the `/usr/share/pki/ca-trust/anchors/` or `/etc/pki/ca-trust/`, for example:\n\
    ```\n# cp test-ca.pem /usr/share/pki/ca-trust/anchors/\n```\n\n2. To update the\
    \ system-wide trust store configuration, use the update-ca-trust command:\n```\n\
    # update-ca-trust\n```\n\nNOTE: Firefox browser is able to use an added certificate\
    \ without executing update-ca-trust, it is recommended to run update-ca-trust\
    \ after a change. Also note that browsers, such as Firefox, Epiphany, or Chromium,\
    \ cache files, and you might need to check the browser's cache or restart to load\
    \ the current system certificates.\n\n### 5.3. MANAGING TRUSTED CERTIFICATES\n\
    \n- To list, extract, add, remove or change trust anchors, use the trust command.\
    \ To see the built-in help for this command, enter without any arguments or with\
    \ the --help directive:\n\n```\n$ trust\nusage: trust command <args>...\n\nCommon\
    \ trust commands are:\n  list      List trust or certificates\n  extract   Extract\
    \ certificates and trust\n  extract-compat Extract trust compatibility bundles\n\
    \  anchor    Add, remove, change trust anchors\n  dump      Dump trust objects\
    \ in internal format\n```\nSee 'trust--help' for more information\n\n- To list\
    \ all trust anchors and certificates, use the trust list command:\n\n```\n$ trust\
    \ list\npkcs11:id=%d2%87%b4%e3%df%37%29%93%55%f6%56%ea%81%e5%36%cc%8c%1e%3f%bd;type=cert\n\
    \  type: certificate\n  label: ACCVRAIZ\n  trust: anchor\n  category: authority\n\
    \npkcs11:id=%a6%b3%e1%2b%29%b6%d7%73%a1%aa%94%f5%01%e7%73%65%4c%50;type=cert\n\
    \  type: certificate\n  label: ACEDICOM Root\n  trust: anchor\n  category: authority\n\
    \  ...  [trimmed for clarity]\n```\n\n- To store a trust anchor into the system-wide\
    \ trust store, use the trust anchor sub-command and specify a path to a certificate.\
    \ Replace path/to/certificate.crt by a path to your certificate and its filename:\n\
    \n```\n# trust anchor path/to/certificate.crt\n```\n\n- To remove a certificate,\
    \ use either a path to a certificate or an ID of a certificate:\n\n```\n# trust\
    \ anchor --remove path/to/certificate.crt\n# trust anchor --remove \"pkcs11:id=%AA%BB%CC%DD%EE;type=cert\"\
    \n```\n\n### Additional resources\n\nAll sub-commands of the trust commands offer\
    \ a detailed built-in help, for example:\n\n```\n$ trust list --help\nusage: trust\
    \ list --filter=<what>\n\n--filter=<what> filter of what to export\n    ca-anchors\
    \ certificate anchors\n    blacklist blacklisted certificates\n    trust-policy\
    \ anchors and blacklist (default)\n    certificates all certificates\n    pkcs11:object=xx\
    \ a PKCS#11 URI\n--purpose=<usage> limit to certificates usable for the purpose\n\
    \    server-auth for authenticating servers\n    client-auth for authenticating\
    \ clients\n    email for email protection\n    code-signing for authenticating\
    \ signed code\n    1.2.3.4... an arbitrary object id\n-v, --verbose show verbose\
