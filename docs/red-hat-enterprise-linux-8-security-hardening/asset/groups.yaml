    | 嗅听 | 通过监听两个活动节点之间的连接收集传输的数据。 | 这种攻击主要适用于明文传输协议，如 Telnet、FTP 和 HTTP。远程攻击者必须访问局域网内的破解系统才能执行此类攻击；通常黑客使用活动攻击（如
