    \ unbind` 解除绑定到 LUKS 卷的插件\n- `clevis unlock` 解锁 LUKS 卷\n\n- - 欲需更多信息，请参阅 `clevis(1)`\
    \ 手页。\n\n## 9.3. 在 SELinUX 强制模式下部署 TANG 服务器\n\n使用此步骤部署运行在自定义端口并作为 SELinux 强制模式下限制服务的\
    \ Tang 服务器。\n\n### 前提条件\n\n- - 已安装 `policycoreutils-python-utils` 包及其依赖项。\n\n\
    \ 步骤\n\n- 1. 要安装 tang 包及其依赖项，以 root 身份输入以下命令：\n```bash\n# yum install tang\n```\n\
    \n- 2. 选择一个未占用的端口（例如 7500/tcp），并允许 tangd 服务绑定到该端口：\n```bash\n# semanage port -a\
    \ t tangd_port -p tcp 7500\n```\n\n注意，一个端口只能被一个服务使用，因此尝试使用已占用的端口将返回 `ValueError:\
    \ Port already defined` 错误信息。\n\n- 3. 在防火墙中打开端口：\n```bash\n# firewall-cmd --add-port=7500/tcp\n\
    # firewall-cmd --runtime-to-permanent\n```\n\n- 4. 启用 tangd 服务：\n```bash\n# systemctl\
    \ enable tangd.socket\n```\n\n- 5. 创建覆盖文件：\n```bash\n# systemctl edit tangd.socket\n\
    ```\n\n- 6. 在编辑界面中（打开了位于 /etc/systemd/system/tangd.socket.d/ 目录下的空 override.conf\
    \ 文件），通过添加以下行将 Tang 服务器的默认端口从 80 更改为之前指定的数字：\n\n```\n[Socket]\nListenStream=\n\
    ListenStream=7500\n```\n\n保存文件并退出编辑器。\n\n- 7. 重新加载更改的配置：\n\n```bash\n# systemctl\
    \ daemon-reload\n```\n\n- 8. 检查您的配置是否生效：\n\n```\n# systemctl show tangd.socket\
    \ -p Listen\nListen=[:]:7500 (Stream)\n```\n\n- 9. 启动 tangd 服务：\n\n```bash\n#\
    \ systemctl start tangd.socket\n```\n\n由于 tangd 使用 system socket 激活机制，服务器会在第一个连接进入时启动。在首次启动时会自动生成一组新的加密密钥。要执行手动生成密钥等加密操作，请使用\
    \ `jose` 工具。\n\n其他资源\n\n- - tang(8) 手页\n- semanage(8) 手页\n- firewall-cmd(1) 手页\n\
    - systemd.unit(5) 和 systemd.socket(5) 手页\n- jose(1) 手页\n\n## 9.4. 轮换 Tang 服务器密钥并更新客户端上的绑定\n\
    \n使用以下步骤轮换您的 Tang 密钥并更新客户端上的现有绑定。轮换密钥的精确间隔取决于您的应用程序、密钥大小以及机构策略。\n\n前提条件\n\n- -\
    \ Tang 服务器正在运行。\n- 客户端上已安装 `clevis` 和 `clevis-luks` 包。\n- 注意 `clevis list`、`clevis\
    \ luks report` 和 `clevis luks regen` 已在 RHEL 8.2 中引入。\n\n步骤\n\n- 1. 要轮换密钥，在 Tang\
    \ 服务器的 `/var/db/tang` 密钥数据库目录下使用 `/usr/libexec/tangd-keygen` 命令生成新密钥：\n\n```\n\
    # ls /var/db/tang\n# /usr/libexec/tangd-keygen /var/db/tang\n# ls /var/db/tang\n\
    ```\n\n- 2. 检查 Tang 服务器是否接受新密钥，例如：\n\n```\n# tang-show-keys 7500\n```\n\n- 3.\
    \ 将旧密钥重命名为以 `.` 开头以隐藏它们。注意示例中的文件名与密钥目录中的实际文件名不同：\n\n```\n# cd /var/db/tang\n#\
    \ ls -l\n# mv old_key .old_key\n```\n\nTang 会立即获取所有更改。当添加新密钥时，客户端会获取新密钥，旧客户端可以继续使用旧密钥。\n\
    \n- 4. 在 NBDE 客户端上，使用 `clevis lugs report` 命令检查 Tang 服务器公布的密钥是否保持不变。您可以使用 `clevis\
    \ lugs` 命令识别插槽，例如：\n\n```\n# clevis lugs list -d /dev/sda2\n1: {\"url\":\"http://tang.srv/\"\
    }\n# clevis lugs report -d /dev/sda2 -s 1\n...\n报告了某些密钥已轮换。\n您是否要使用 'clevis lugs\
    \ regen -d /dev/sda2 -s 1' 重新生成元数据？[y/N]\n```\n\n- 5. 要为新密钥生成 LUKS 元数据，在前一个命令的提示中输入\
    \ `y`，或者使用 `clevis lugs regen` 命令：\n\n```\n# clevis lugs regen -d /dev/sda2 -s\
    \ 1\n```\n\n- 6. 当您确定所有旧客户端都使用新密钥后，从 Tang 服务器上删除旧密钥，例如：\n\n```\n# cd /var/db/tang\n\
    # rm .*.jwk\n```\n\n"
