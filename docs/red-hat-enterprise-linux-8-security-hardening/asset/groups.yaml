    # Firefox


    尽管在 Firefox Web 浏览器中无法退出系统级加密策略，但你可以在 Firefox 的配置编辑器中进一步限制支持的加密算法和 TLS 版本。在地址栏中输入
    `about:config` 并根据需要更改 `security.tls.version.min` 选项的值。将 `security.tls.version.min`
    设置为 1 允许 TLS 1.0 作为最低要求，security.tls.version.min 2 启用 TLS 1.1，以此类推。


    # OpenSSH


    要为 OpenSSH 服务器退出系统级加密策略，请取消 `/etc/sysconfig/sshd` 文件中 `CRYPTO_POLICY=` 变量行的注释。更改后，你在
    `/etc/ssh/sshd_config` 文件的 Ciphers、MACs、KexAlgorithms 和 GSSAPIKexAlgorithms 部分指定的值将不再被覆盖。更多信息请参阅
    ssh_config(5)。


    # Libreswan


    要允许 Libreswan IPSec 使用 IKE1 协议，请注释 `/etc/ipsec.conf` 中的以下行：


    ```

    # include /etc/crypto-policies/back-ends/libreswan.config

    ```


    然后在你的连接配置中添加 `ikev2=never` 选项。更多信息请参阅 ipsec.conf(5) 手页。


    # 其他资源


    - 详情请参考 update-crypto-policies(8) 手页。


    ## 3.6. 使用策略修改符自定义系统级加密策略


    使用此过程调整任何系统级加密策略级别或完整自定义策略的算法或协议。![](img/ce77567a90cabeaf166ca2952.png)


    > 注意

    RHEL 8 提供了系统级加密策略的自定义。


    # 步骤


    - 1. 创建包含你的调整的策略模块，例如：


    ```

    # cat /etc/crypto-policies/modules/MYCRYPTO.mod

    ```


    sha1_in_certs = 0

    min_rsa_size = 3072

    cipher = -256-GCM -256-CBC -128-GCM -128-CBC


    # 重要

    在策略模块文件名中使用大写字母。


    - 2. 将你的策略应用于 DEFAULT 系统级加密策略级别：


    ```

    # update-crypto-policies --set DEFAULT:MYCRYPTO

    ```


    - 3. 使你的加密设置对于已运行的服务生效，请重启系统：


    ```

    # reboot

    ```


    # 其他资源


    - 详情请参考 update-crypto-policies(8) 手页中的 Custom Policies 部分以及 update-crypto-policies(8)
    手页中的 Crypto Policy Format 部分。

    - RHEL 8 提供了自定义系统级加密策略的示例。


    ## 3.7. 创建并设置系统级加密策略


    以下步骤演示了如何通过策略文件自定义系统级加密策略。


    # 注意

    RHEL 8 提供了系统级加密策略的自定义。


    # 步骤


    - 1. 为你的自定义创建一个策略文件：


    ```

    # cd /etc/crypto-policies/policies/

    # touch MYPOLICY.pol

    ```


    或者，通过复制预定义的策略级别之一开始：


    ```

    # cp /usr/share/crypto-policies/policies/DEFAULT.pol /etc/crypto-policies/policies/MYPOLICY.pol

    ```


    - 2. 使用你选择的文本编辑器编辑该文件以符合你的需求，例如：


    ```

    # vi /etc/crypto-policies/policies/MYPOLICY.pol

    ```


    - 3. 将系统级加密策略切换到你的自定义级别：


    ```

    # update-crypto-policies --set MYPOLICY

    ```


    - 4. 使你的加密设置对于已运行的服务生效，请重启系统：


    ```

    # reboot

    ```


    # 其他资源


    - 详情请参考 update-crypto-policies(8) 手页中的 Custom Policies 部分以及 update-crypto-policies(8)
    手页中的 Crypto Policy Format 部分。

    - RHEL 8 提供了自定义系统级加密策略的示例。


    ## 3.8. 相关信息


    - 更多信息请参阅 Red Hat 门户上关于 RHEL 8 系统级加密策略、RHEL 8 强加密默认以及弱加密算法弃用的文章。


    ## 第 4 章 通过 PKCS #11 配置应用程序使用加密硬件


    将秘密信息隔离在专用加密设备上（例如用于用户认证的智能卡和用于服务器应用程序的硬件安全模块 HSM）可以提供额外的安全层。在 Red Hat Linux 8
    中，通过 PKCS #11 使用加密硬件在不同应用程序之间是一致的，在加密硬件上隔离秘密并不是复杂任务。


    ## 4.1. 通过 PKCS #11 支持加密硬件


    PKCS #11（密钥加密标准）定义了用于加密加密信息的执行加密设备的应用程序接口（API）。这些设备被称为令牌（tokens），可以以硬件或软件形式实现。


    PKCS #11 令牌可以存储各种对象，例如证书、数据对象以及公钥、私钥或密钥。这些对象可以通过 PKCS #11 URI 方案唯一标识。


    PKCS #11 URI 是根据对象属性识别 PKCS #11 模块特定对象的标准方法。这允许你通过 URI 字符串为所有库和应用程序配置相同的设置。


    Red Hat Linux 8 默认为智能卡提供 OpenSC PKCS #11 驱动程序。硬件令牌和 HSM 可以拥有自己的在 Red Hat Linux
    中没有对应的 PKCS #11 模块。你可以使用 `p11-kit` 工具注册你的 PKCS #11 模块，它是系统内智能卡驱动程序的封装器。


    要让你自己的 PKCS #11 模块在系统上工作，请向 `/etc/pkcs11/modules/` 目录添加一个新的文本文件。

    '
