    # CHAPTER 8. ENCRYPTING BLOCK DEVICES USING LUKS


    Disk encryption protects the data on a block device by encrypting it. To access
    the device''s decrypted contents, a user must provide a passphrase or key as authentication.
    This is particularly important when it comes to mobile computers and removable
    media: it helps to protect the device''s contents if it has been physically removed
    from the system. The LUKS format is a default implementation of block device encryption
    in RHEL.


    # 8.1. LUKS DIS ENCRYPTION


    The Linux Unified Key Setup-on-disk-format (LUKS) enables you to encrypt block
    devices and provides a set of tools that simplifies managing the encrypted devices.
    LUKS allows multiple keys to decrypt a master key, which is for the full encryption
    of the partition.


    RHEL utilizes LUKS to perform block device encryption. By default, the option
    to encrypt the block device is unchecked during installation. If you select to
    encrypt your device, the system prompts you for a passphrase every time you boot
    the computer. This passphrase "unlocks" the block encryption key that decrypts
    your partition. If you choose to modify the default partition table, you can choose
    which partitions you want to encrypt. This is set in the partition table settings.


    What LUKS does


    +   - LUKS encrypts entire block devices and is well-suited for protecting contents
    of mobile devices such as removable storage or laptop disk drives.

    - The underlying contents of the encrypted block device are arbitrary, which makes
    it useful for encrypting swap devices. This can also be useful with certain databases
    that use specially formatted block devices for data storage.

    - LUKS uses the existing device mapper kernel subsystem.

    - LUKS provides passphrase strengthening which protects against dictionary attacks.

    - LUKS devices contain multiple key slots, allowing users to add backup keys or
    passphrases.


    What LUKS does not do


    +   - Disk-encryption solutions like LUKS protect the data only when your system
    is off. Once the system is on and LUKS has decrypted the disk, the files on that
    disk are available to anyone who would normally have access to them.

    - LUKS is not well-suited for scenarios that require many users to have distinct
    access keys to the same device. The LUKS1 format provides eight key slots, LUKS2
    up to 32 key slots.

    - LUKS is not well-suited for applications requiring file-level encryption.


    Ciphers


    The default cipher used for LUKS is aes-xts-plain64. The default key size for
    LUKS is 512 bits. The default key size for LUKS with Anaconda (XTS) is 512 bits.
    Ciphers that are available:


    +   - AES - Advanced Encryption Standard - FIPS PUB 197

    - Twofish (a 128-bit block cipher)

    - Serpent'
- md: "\n# Additional resources\n\n- LUKS Project Home Page\n- LUKS On-Disk Format\
    \ Specification\n\n## 8.2. LUKS VERSIONS IN RHEL 8\n\nIn RHEL 8, the default format\
    \ for LUKS encryption is LUKS2. The legacy LUKS1 format remains fully supported\
    \ and it is provided as a format compatible with earlier RHEL releases.\n\nThe\
    \ LUKS2 format is designed to enable future updates of various parts without a\
    \ need for binary structures. LUKS internally uses JSON text format for metadata,\
    \ while it detects metadata corruption and allows automatic repairs from a metadata\
    \ copy.\n\n![](img/ce7756f7a90c9abeaf166ca2952129eb_62_0.png)\n\n> IMPORTANT\n\
    > Do not use LUKS2 in systems that need to be compatible with legacy systems that\
    \ support only LUKS1. Note that RHEL 7 supports the LUKS2 format since version\
    \ 7.6.\n\n> ### WARNING\n> LUKS2 and LUKS1 use different commands to encrypt the\
    \ disk. Using the wrong command for a LUKS version might cause data loss.\n\n\
    | LUKS version | Encryption command |\n|---|---|\n| LUKS2 | cryptsetup reencrypt\
    \ |\n| LUKS1 | cryptsetup-reencrypt |\n\n## Online re-encryption\n\nThe LUKS2\
    \ format supports re-encrypting encrypted devices while the devices are in use.\
    \ For example, you do not have to unmount the file system on the device to perform\
    \ the following tasks:\n\n- Change the volume key\n- Change the encryption algorithm\n\
    \nWhen encrypting a non-encrypted device, you must unmount the file system. You\
    \ can remount the file system after a short initialization of the encryption.\n\
    \nThe LUKS1 format does not support online re-encryption.\n\n## Conversion\n\n\
    The LUKS2 format is inspired by LUKS1. In certain situations, you can convert\
    \ LUKS1 to LUKS2. The conversion is not possible specifically in the following\
    \ scenarios:\n\n- A LUKS1 device is marked as being used by a Policy-Based Decryption\
    \ (PBD - Clevis) solution. The cryptsetup tool refuses to convert the device when\
    \ some luksmeta metadata are detected.\n- A device is active. The device must\
    \ be in the inactive state before any conversion is possible.\n\n## 8.3. OPTIONS\
    \ FOR DATA PROTECTION DURING LUKS2 RE-ENCRYPTION\n\nLUKS2 provides several options\
    \ that prioritize performance or data protection during the re-encryption process:\n\
    \n### checksum\n\nThis is the default mode. It balances data protection and performance.\
    \ This mode stores individual checksums of the sectors in the re-encryption area,\
    \ so the recovery process can detect sectors LUKS2 already re-encrypted. The mode\
    \ requires that the block device sector is atomic.\n\n### journal\n\nThat is the\
    \ safest mode but also the slowest. This mode writes the re-encryption area in\
    \ the binary area, so LUKS2 writes the data.\n\n### none\n\nThis mode prioritizes\
    \ performance and provides no data protection. It protects the data only against\
    \ safe termination, such as the SIGTERM signal or the user pressing Ctrl+C. Any\
    \ unexpected system crash or application crash might result in data corruption.\n\
    \nYou can select the mode using the --resilience option of cryptsetup.\n\nIf a\
    \ LUKS2 re-encryption process terminates unexpectedly by force, LUKS2 can perform\
    \ the recovery in one of the following ways:\n\n- Automatically, during the next\
    \ LUKS2 device open action. This action is triggered either by the cryptsetup\
    \ open command or by attaching the device with system-cryptsetup.\n- Manually,\
    \ by using the cryptsetup repair command on the LUKS2 device.\n\n## 8.4. ENCRYPTING\
    \ EXISTING DATA ON A BLOCK DEVICE USING LUKS2\n\nThis procedure encrypts existing\
    \ data on a net not yet encrypted device using the LUKS2 format. A new LUKS header\
    \ is stored in the head of the device.\n\n### Prerequisites\n\n- The block device\
    \ contains a file system.\n- You have backed up your data.\n\n## CHAPTER 8. ENCRYPTING\
    \ BLOCK DEVICES USING LUKS\n\n> WARNING\n> You might lose your data during the\
    \ encryption process: due to a hardware, kernel, or human failure. Ensure that\
    \ you have a reliable backup before you start encrypting the data.\n\nProcedure\n\
    \n- 1. Unmount all file systems on the device that you plan to encrypt. For example:\n\
    ```bash\n# unmount /dev/sdb1\n```\n\n- 2. Make free space for storing a LUKS header.\
    \ Choose one of the following options that suits your scenario:\n  - In the case\
    \ of encrypting a logical volume, you can extend the logical volume without resizing\
    \ the file size. For example:\n```bash\n# lvextend -L+32M vg0/lv0\n```\n  - Extend\
    \ the partition using partition management tools, such as parted.\n  - Shrink\
    \ the file system on the device. You can use the resize2fs utility for the ext2,\
    \ ext3, or ext4 file systems. Note that you cannot shrink the XFS file system.\n\
    \n- 3. Initialize the encryption. For example:\n```bash\n# cryptsetup reencrypt\
    \ \\\n  --encrypt \\\n  --init-only \\\n  --reduce-device-size 32M \\\n  /dev/sdb1\
    \ sdb1_encrypted\n```\n\nThe command asks you for a passphrase and starts the\
    \ encryption process.\n\n- 4. Mount the device:\n```bash\n# mount /dev/mapper/sdb1_encrypted\
    \ /mnt/sdb1_encrypted\n```\n\n- 5. Start the online encryption:\n```bash\n# cryptsetup\
    \ reencrypt --reuse-only /dev/sdb1\n```\n\nAdditional resources\n\n- For details,\
    \ see the cryptsetup(8), lvextend(8), resize2fs(8), and parted(8) man pages.\n\
    \n## 8.5. ENCRYPTING EXISTING DATA ON A BLOCK DEVICE USING LUKS WITH A DETACHED\
    \ HEADER\n\n# Red Hat Enterprise Linux 8 Security hardening\n\nThis procedure\
    \ encrypts existing data on a block device without creating free space for storing\
    \ a LUKS header. The header is stored in a detached location, which also serves\
    \ as an additional layer of security. The procedure uses the LUKS2 encryption\
    \ format.\n\n### Prerequisites\n\n- The block device contains a file system.\n\
    - You have backed up your data.\n\n> WARNING\n> You might lose your data during\
    \ the encryption process: due to a hardware, kernel, or human failure. Ensure\
    \ that you have a reliable backup before you starting the encryption data.\n\n\
    Procedure\n\n- 1. Unmount all file systems on the device. For example:\n```\n\
    # umount /dev/sdb1\n```\n- 2. Initialize the encryption:\n```bash\n# cryptsetup\
    \ reencrypt \\\n--encrypt \\\n--init-only \\\n--header /path/to/header \\\n/dev/sdb1\
    \ sdb1_encrypted\n```\n\nReplace `/path/to/header` with a path to the file with\
    \ a detached LUKS header. The detached LUKS header has to be accessible so that\
    \ the encrypted device can be unlocked later.\n\nThe command asks you for a passphrase\
    \ and starts the encryption process.\n\n- 3. Mount the device:\n```bash\n# mount\
    \ /dev/mapper/sdb1_encrypted /mnt/sdb1_encrypted\n```\n\n- 4. Start the online\
    \ encryption:\n```bash\n# cryptsetup reencrypt --resume-only --header /path/to/header\
    \ /dev/sdb1\n```\n\n## Additional resources\n\n- For more details, see the cryptsetup(8)\
    \ man page.\n\n## 8.6. ENCRYPTING A BLANK BLOCK DEVICE USING LUKS2\n\nThis procedure\
    \ provides information about encrypting a blank block device using the LUKS2 format.\n\
    \n### Prerequisites\n\n- A blank block device.\n\nProcedure\n\n- 1. Setup a partition\
    \ as an encrypted LUKS partition:\n```\n# cryptsetup luksFormat /dev/sdb1\n```\n\
    \n- 2. Open the LUKS partition:\n```\n# cryptsetup open /dev/sdb1 sdb1_encrypted\n\
    ```\n\nThis unlocks the partition and maps it to a device mapper. To do this,\
    \ you must create a filesystem. For example:\n```\n# mkfs -t ext4 /dev/mapper/sdb1_encrypted\n\
    ```\n\n- 3. Mount the device:\n```bash\n# mount /dev/mapper/sdb1_encrypted /mnt/sdb1_encrypted\n\
    ```\n\n## Additional resources\n\n- For more details, see the cryptsetup(8) man\
    \ page.\n\n## CHAPTER 9. CONFIGURING AUTOMATED UNLOCKING OF ENCRYPTED VOLUMES\
    \ USING POLICY-BASED DECRYPTION\n\n[content]\nThe Policy-Based Decryption (PBD)\
    \ is a collection of technologies that enable unlocking root and secondary volumes\
    \ on hard drives and virtual machines. PBD uses a variety of unlocking methods,\
    \ such as user passwords, a Trusted Platform Module (TPM) device, a PKCS11 device\
    \ connected to a system, for example, a smart card, or a network server.\n\nPBD\
    \ also combines different unlocking methods into a policy, which makes it possible\
    \ to unlock the same volume in different ways. The current implementation of PBD\
    \ in Red Hat Enterprise Linux consists of the Clevis framework and plug-in pins.\
    \ Currently, the following pins are:\n\n- tang - allows volumes to be unlocked\
    \ using a network server\n- tpm2 - allows volumes to be unlocked using a TPM2\
    \ policy\n\nThe Network Bound Disk Encryption (NBDE) is a subcategory of PBD that\
    \ allows binding encrypted volumes to a special network server. The current implementation\
    \ of NBDE includes a Clevis pin for Tang server and the Tang server itself.\n\n\
    ## 9.1. NETWORK-BOUND DISK ENCRYPTION\n\nIn Red Hat Enterprise Linux, NBDE is\
    \ implemented through the following components and technologies.\n\nFigure 9.1\
    \ NBDE scheme when using LUKS-encrypted volume. The luksmeta package is not used\
    \ for LUKS2 volumes.\n\n| CLEVIS FRAMEWORK | TANG SERVER |\n| :--- | :--- |\n\
    | Clevis Pin for Tang | |\n| Jose Crypto Library | Jose Crypto Library |\n\nTang\
    \ is a server for binding data to a network presence. It makes a system containing\
    \ your data available when the system is bound to a secure network. Tang is stateless\
    \ and does not require TLS or authentication. Unlike escrow-based solutions, where\
    \ the server stores all encryption keys and has knowledge of every key used, Tang\
    \ interacts with any client keys, so it never gains identifying information from\
    \ the client.\n\nClevis is a pluggable framework for automated decryption. In\
    \ NBDE, Clevis provides automated unlocking of LUKS volumes. The clevis package\
    \ provides the client side of the feature.\n"
  mdcn: "\n\n# 附加资源\n\n- LUKS 项目主页\n- LUKS 磁盘上格式规范\n\n## 8.2. RHEL 8 中的 LUKS 版本\n\n\
    在 RHEL 8 中，LUKS 加密的默认格式是 LUKS2。旧的 LUKS1 格式仍然被完全支持，并作为与早期 RHEL 版本兼容的格式提供。\n\nLUKS2\
    \ 格式的设计是为了以后对各个部分进行更新，而无需更改二进制结构。LUKS 内部使用 JSON 文本格式存储元数据，同时它可以检测元数据损坏，并允许从元数据副本进行自动修复。\n\
    \n![](img/ce7756f7a90c9abeaf166ca2952129eb_62_0.png)\n\n> 注意\n> 在需要兼容仅支持 LUKS1\
    \ 的旧系统中，请使用 LUKS2。请注意，RHEL 7 从 7.6 版本开始支持 LUKS2 格式。\n\n> ### 警告\n> LUKS2 和 LUKS1\
    \ 使用不同的命令加密磁盘。对 LUKS 版本使用错误的命令可能会导致数据丢失。\n\n| LUKS 版本 | 加密命令 |\n|---|---|\n| LUKS2\
    \ | cryptsetup reencrypt |\n| LUKS1 | cryptsetup-reencrypt |\n\n## 在线重加密\n\nLUKS2\
    \ 格式支持在设备在使用时对已加密设备进行重加密。例如，你无需卸载设备上的文件系统即可执行以下任务：\n\n- 更改卷密钥\n- 更改加密算法\n\n在加密未加密设备时，你必须卸载文件系统。在加密简短初始化后，你可以重新挂载文件系统。\n\
    \nLUKS1 格式不支持在线重加密。\n\n## 转换\n\nLUKS2 格式的灵感来源于 LUKS1。在某些情况下，你可以将 LUKS1 转换为 LUKS2。在以下特定场景下无法进行转换：\n\
    \n- LUKS1 设备被标记为由基于策略的解密（PBD - Clevis）解决方案使用。当检测到某些 luksmeta 元数据时，cryptsetup 工具将转换该设备。\n\
    - 设备处于活动状态。在进行任何转换之前，设备必须处于非活动状态。\n\n## 8.3. LUKS2 重加密期间数据保护的选项\n\nLUKS2 提供了多个选项，在重加密过程中优先考虑性能或数据保护：\n\
    \n### 校验和 (checksum)\n\n这是默认模式。它平衡了数据保护和性能。该模式在重加密区域存储扇区的单独校验和，因此恢复过程可以检测 LUKS2\
    \ 已经重加密的扇区。该模式要求块设备扇区是原子。\n\n### 日志 (journal)\n\n这是最安全的模式，但速度最慢。该模式在二进制区域写入重加密区域，由\
    \ LUKS2 写入数据。\n\n### 无 (none)\n\n此模式优先考虑性能且不提供数据保护。它仅防止安全终止导致损坏，例如 SIGTERM 信号或用户按下\
    \ Ctrl+C。任何意外的系统崩溃或应用程序崩溃可能导致数据损坏。\n\n你可以使用 cryptsetup 的 `--resilience` 选项来选择模式。\n\
    \n如果 LUKS2 重加密过程意外强制终止，LUKS2 可以通过以下方式之一执行恢复：\n\n- 自动：在下次打开 LUKS2 设备的操作期间进行。此操作由\
    \ cryptsetup open 命令或通过 system-cryptsetup 挂载设备触发。\n- 手动：通过在 LUKS2 设备上使用 cryptsetup\
    \ repair 命令。\n\n## 8.4. 使用 LUKS2 加密块设备上的现有数据\n\n此过程使用 LUKS2 格式对尚未加密的设备上的现有数据进行加密。新的\
    \ LUKS 头存储在设备的头部。\n\n### 前提条件\n\n- 块设备包含一个文件系统。\n- 你已经备份了数据。\n\n## 第 8 章. 使用 LUKS\
    \ 加密块设备\n\n> 警告\n> 在加密过程中，你可能会丢失数据：由于硬件、内核或人为故障。在开始加密数据之前，请确保你已经有了可靠的备份。\n\n操作步骤\n\
    \n- 1. 卸载你加密的设备上的所有文件系统。例如：\n```bash\n# unmount /dev/sdb1\n```\n\n- 2. 为存储 LUKS\
    \ 头留出可用空间。选择适用于你场景的以下选项之一：\n  - 在加密逻辑卷的情况下，你可以扩展逻辑卷而不调整文件大小。例如：\n```bash\n# lvextend\
    \ -L+32M vg0/lv0\n```\n  - 使用分区管理工具（如 parted）扩展分区。\n  - 缩小设备上的文件系统。你可以使用 resize2fs\
    \ 实用处理 ext2、ext3 或 ext4 文件系统。注意，你不能缩小 XFS 文件系统。\n\n- 3. 初始化加密。例如：\n```bash\n#\
    \ cryptsetup reencrypt \\\n  --encrypt \\\n  --init-only \\\n  --reduce-device-size\
    \ 32M \\\n  /dev/sdb1 sdb1_encrypted\n```\n\n该命令会要求你输入密码并启动加密过程。\n\n- 4. 挂载设备：\n\
    ```bash\n# mount /dev/mapper/sdb1_encrypted /mnt/sdb1_encrypted\n```\n\n- 5. 启动在线加密：\n\
    ```bash\n# cryptsetup reencrypt --reuse-only /dev/sdb1\n```\n\n附加资源\n\n- 详情请参阅\
    \ cryptsetup(8)、lvextend(8)、resize2fs(8) 和 parted(8) 手页。\n\n## 8.5. 使用带有分离标头的\
    \ LUKS 加密块设备上的现有数据\n\n# 红帽企业 Linux 8 安全加固\n\n此过程对块设备上的现有数据进行加密，且不为存储 LUKS 头创建可用空间。头存储在分离的位置，这也作为了额外的安全层。该过程使用\
    \ LUKS2 加密格式。\n\n### 前提条件\n\n- 块设备包含一个文件系统。\n- 你已经备份了数据。\n\n> 警告\n> 在加密过程中，你可能会丢失数据：由于硬件、内核或人为故障。在开始加密数据之前，请确保你已经有了可靠的备份。\n\
    \n操作步骤\n\n- 1. 卸载设备上的所有文件系统。例如：\n```\n# umount /dev/sdb1\n```\n- 2. 初始化加密：\n```bash\n\
    # cryptsetup reencrypt \\\n--encrypt \\\n--init-only \\\n--header /path/to/header\
    \ \\\n/dev/sdb1 sdb1_encrypted\n```\n\n将 `/path/to/header` 替换为分离 LUKS 头文件的路径。分离\
    \ LUKS 头必须是可访问，以便以后解锁加密设备。\n\n该命令会要求你输入密码并启动加密过程。\n\n- 3. 挂载设备：\n```bash\n# mount\
    \ /dev/mapper/sdb1_encrypted /mnt/sdb1_encrypted\n```\n\n- 4. 启动在线加密：\n```bash\n\
    # cryptsetup reencrypt --resume-only --header /path/to/header /dev/sdb1\n```\n\
    \n## 附加资源\n\n- 更多详情请参阅 cryptsetup(8) 手页。\n\n## 8.6. 使用 LUKS2 加密空白块设备\n\n此过程提供了关于使用\
    \ LUKS2 格式加密空白块设备的信息。\n\n### 前提条件\n\n- 一个空白块设备。\n\n操作步骤\n\n- 1. 将分区设置为加密的 LUKS\
    \ 分区：\n```\n# cryptsetup luksFormat /dev/sdb1\n```\n\n- 2. 打开 LUKS 分区：\n```\n\
    # cryptsetup open /dev/sdb1 sdb1_encrypted\n```\n\n这会解锁分区并将其映射到设备映射器。要执行此操作，你需要创建一个文件系统。例如：\n\
    ```\n# mkfs -t ext4 /dev/mapper/sdb1_encrypted\n```\n\n- 3. 挂载设备：\n```bash\n#\
    \ mount /dev/mapper/sdb1_encrypted /mnt/sdb1_encrypted\n```\n\n## 附加资源\n\n- 更多详情请参阅\
    \ cryptsetup(8) 手页。\n\n## 第 9 章. 使用基于策略的解密配置加密卷的自动解锁\n\n[content\n基于策略的解密（PBD）是一套技术，用于解锁硬盘和虚拟机上的加密卷。PBD\
    \ 使用了多种解锁方法，例如用户密码、可信平台模块（TPM）设备、连接到系统的 PKCS11 设备（例如智能卡）或网络服务器。\n\nPBD 还将不同的解锁方法组合成策略，使得能够以不同的方式解锁同一个卷。红帽企业\
