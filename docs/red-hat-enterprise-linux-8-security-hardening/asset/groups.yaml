- md: "\n# 9. CONFIGURING AUTOMATED UNLOCKING OF ENCRYPTED VOLUMES USING POLICY-BASED\
    \ DECRYPTION\n\nIn the previous example, note that we deleted the advertisement\
    \ from the Tang server as part of our binding configuration, enabling binding\
    \ to be completely non-interactive.\n\n> **WARNING**\nThe `cryptsetup luksRemoveKey`\
    \ command prevents any further administration of a LUKS device on which you apply\
    \ it. You can recover a removed master key using the `dmsetup` command only for\
    \ LUKS devices.\n\nYou can use an analogous procedure when using a TPM 2.0 policy\
    \ instead of a Tang server.\n\n# Additional resources\n\n- clevis(1), clevis-luks-bind(1),\
    \ `cryptsetup(8)`, and `dmsetup(8)` man pages\n- [Installing Red Hat Enterprise\
    \ Linux 8 using Kickstart](#)\n\n# 9.10. CONFIGURING AUTOMATED UNLOCKING OF A\
    \ LUKS-ENCRYPTED REMOVABLE STORAGE DEVICE\n\nUse this procedure to set up an automated\
    \ unlocking process of a LUKS-encrypted USB storage device.\n\n# Procedure\n\n\
    - 1. To automatically unlock a LUKS-encrypted removable storage device, such as\
    \ a USB drive, install the `clevis-udisks` package:\n```bash\n# yum install clevis-udisks\n\
    ```\n- 2. Reboot the system, and then perform the binding step using the `clevis\
    \ luks bind` command described in Configuring manual enrollment of LUKS-encrypted\
    \ volumes, for example:\n```bash\n# clevis luks bind -d /dev/sdb1 'http://tang.server'\n\
    ```\n- 3. The LUKS-encrypted removable device can now be unlocked automatically\
    \ in your GNOME desktop session. The device bound to a clevis policy can also\
    \ be unlocked by the `clevis luks unlock` command:\n```bash\n# clevis luks unlock\
    \ -d /dev/sdb1\n```\n\nYou can use an analogous procedure when using a TPM 2.0\
    \ policy instead of a Tang server.\n\n# Additional resources\n\nFor more information,\
    \ see the following man page:\n\n- clevis-luks-unlockers(7)\n\n# 9.11. DEPLOYING\
    \ HIGH-AVAILABILITY NBDE SYSTEMS\n\nTang provides two methods for building a high-availability\
    \ deployment:\n\n### Client redundancy (recommended)\n\nClients should be configured\
    \ with the ability to bind multiple Tang servers. In this setup, each Tang server\
    \ has its own keys and can decrypt by contacting a subset of these servers. Clevis\
    \ already supports this workflow through the **sss** plug-in. Red Hat recommends\
    \ this method for a high-availability deployment.\n\n### Key sharing\n\nFor redundancy,\
    \ more than one instance of Tang can be deployed. To set up a second or any subsequent\
    \ instance, install the **tang** packages and copy the key directory to the new\
    \ host using **rsync** over SSH. Note that Red Hat does not recommend this method\
    \ because sharing keys increases the risk of key compromise.\n\n# 9.11.1. High-available\
    \ NBDE using Shamir's Secret Sharing\n\nShamir's Secret Sharing (SSS) is a cryptographic\
    \ scheme that divides a secret into several parts. To reconstruct the secret,\
    \ a number of parts is required. The number is called threshold and SSS is also\
    \ referred to as threshold scheme.\n\nClevis provides an implementation of SSS.\
    \ It creates a key and divides it into a number of pieces. Each piece is encrypted\
    \ using another pin. Additionally, you define the threshold t; if NBDE deployment\
    \ deploys at least t pieces, then it recovers the encryption key and the decryption\
    \ succeeds.\n\n# 9.11.1. Example 1: Redundancy with two Tang servers\n\nThe following\
    \ command decrypts a LUKS-encrypted device when at least one of two Tang servers\
    \ is available:\n```bash\n# clevis luks bind -d /dev/sda1 sss '{\"t\":\"1\",\"\
    pins\":[{\"url\":\"http://tang1.srv\"},{\"url\":\"http://tang2.srv\"}]}'\n```\n\
    \nThe previous command used the following configuration:\n```json\n{\n  \"t\"\
    :\"1\",\n  \"pins\":[\n    {\n      \"url\":\"http://tang1.srv\"\n    },\n   \
    \ {\n      \"url\":\"http://tang2.srv\"\n    }\n  ]\n}\n```\n\n# 9.12. CONFIGURING\
    \ AUTOMATED UNLOCKING OF ENCRYPTED VOLUMES USING POLICY-BASED DECRYPTION\n\nIn\
    \ this configuration, the SSS threshold is set to 1 and the clevis bind command\
    \ successfully reconstructs the secret if at least one listed Tang server is available.\n\
    \n# 9.11.1.2. Example 2: Shared secret on Tang server and TPM device\n\nThe following\
    \ command successfully binds a LUKS-encrypted device when both the **tang** server\
    \ and **tpm2** device are available: The configuration scheme with SSS threshold\
    \ set to 2 is now:\n```json\n{\n  \"t\":2,\n  \"pins\":{\n    \"tang\":\n    \
    \  {\n        \"url\":\"http://tang1.srv\"\n      }\n    },\n    \"tpm2\":{\n\
    \      \"pcr_ids\":\"0,1\"\n    }\n  }\n}\n```\n\n# Additional resources\n\n-\
    \ For more information about the recommended high-availability NBDE setup, see\
    \ the following man pages:\n- tang(8), section High Availability\n- clevis(1),\
    \ section Shamir's Secret Sharing\n- clevis-sss(1)\n\n# 9.12. DEPLOYMENT OF VIRTUAL\
    \ MACHINES IN NBDE\n\nThe **luks bind** command does not change the LUKS master\
    \ key. This implies that if you create a LUKS-encrypted image for a virtual machine\
    \ or cloud environment, all the instances that run it will share a master key.\
    \ This is extremely insecure and should be avoided at all times.\n\nThis is not\
    \ a limitation of Clevis but a design principle of LUKS. If you wish to have encrypted\
    \ root volumes in a cloud, you need to make sure that you perform the installation\
    \ process (using Kickstart) for each instance of Red Hat Enterprise Linux in a\
    \ cloud as well. The images cannot be shared without sharing the LUKS master key.\n\
    \nIf you intend to deploy automated unlocking in a virtualized environment, Red\
    \ strongly recommends that you use Lorax or virt-install with a Kickstart file\
    \ (see Configuring automated enrollment of LUKS-encrypted volumes using Kickstart)\
    \ or another automated provisioning tool to ensure that each encrypted VM has\
    \ a unique master key.\n\n# NOTE\n\nAutomated unlocking with a TPM 2.0 policy\
    \ is not supported in a virtual machine.\n\n# Additional resources\n\nFor more\
    \ information, see the following man page:\n\n- clevis-luks-bind(1)\n\n# 9.13.\
    \ BUILDING AUTOMATICALLY-ENROLLABLE VM IMAGES FOR CLOUD ENVIRONMENTS USING NBDE\n\
    \nDeploying automatically-enrollable encrypted images in a cloud environment can\
    \ provide a unique set of challenges. Like other virtualization environments,\
    \ it is recommended to reduce the number of instances started from a single image\
    \ to avoid sharing the LUKS master key.\n\nTherefore, the best practice is to\
    \ create custom images that are not shared in any public repository and provide\
    \ a base for the deployment of a limited amount of instances. The exact number\
    \ of instances to create should be defined by deployment's security policies and\
    \ based on the risk tolerance associated with the LUKS master key attack vector.\n\
    \nTo LUKS-enabled automated deployments, such as Lorax or virt-install together\
    \ with a Kickstart file should be used to ensure master key uniqueness during\
    \ the image building process.\n\nCloud environments enable two Tang server deployment\
    \ options which we consider here. First, the Tang server can be deployed within\
    \ the cloud environment itself. Second, the Tang server can be deployed outside\
    \ of the cloud on independent infrastructure with a VPN link between the two infrastructures.\n\
    \nDeploying Tang natively in the cloud allows for easy deployment. However, given\
    \ that it shares infrastructure with the data persistence layer of ciphertext\
    \ of other systems, it may be possible for both the Tang server's private key\
    \ and the Clevis metadata to be stored on the same physical disk. Access to this\
    \ physical disk permits a full compromise of the ciphertext data.\n\n# IMPORTANT\n\
    \nFor this reason, Red Hat strongly recommends maintaining a physical separation\
    \ between the location where the data is stored and the system where Tang is running.\
    \ This separation between the cloud and the Tang server's private key can not\
    \ be accidentally combined with the Clevis metadata. It also provides local control\
    \ of the Tang server if the cloud infrastructure is at risk.\n\n# 9.14. ADDITIONAL\
    \ RESOURCES\n\n- the tang(8), clevis(1), jose(1), and clevis-luks-unlockers(7)\
    \ man pages.\n"
  mdcn: "\n\n# 9. 使用基于策略的解密配置加密卷的自动解锁\n\n在之前的示例中，请注意，作为绑定配置的一部分，我们删除了 Tang 服务器上的广告，使得绑定能够完全非交互地完成。\n\
    \n> **警告**\n`cryptsetup luksRemoveKey` 命令将防止对对其应用的 LUKS 设备进行任何进一步的管理。只有对于 LUKS\
    \ 设备，您才能使用 `dmsetup` 命令恢复已删除的主密钥。\n\n当您使用 TPM 2.0 策略而不是 Tang 服务器时，您可以使用类似的程序。\n\
    \n# 附加资源\n\n- clevis(1)、clevis-luks-bind(1)、`cryptsetup(8)` 和 `dmsetup(8)` 手页\n\
