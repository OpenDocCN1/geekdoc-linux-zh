    # 第 6 章 扫描系统以检查合规性与漏洞


    合规性审计是一个确定对象是否遵循合规性策略中指定的所有规则的过程。合规性策略由安全专业人员定义，他们指定了计算环境应使用的所需设置（通常以检查清单的形式）。


    合规性策略在不同组织之间，甚至同一组织内的不同系统之间存在巨大差异。这些策略之间的差异取决于每个系统的目的及其对组织的重要性。自定义软件设置和部署特性也引发了对自定义策略检查的需求。


    ## 6.1. RHEL 中的配置合规性工具


    Red Hat Linux 提供了能够让您执行全自动合规性审计的工具。这些工具基于安全内容自动化协议 (SCAP)，旨在对合规性策略进行自动化审计。


    - **SCAP Workbench** - `scap-workbench` 图形实用程序用于对本地或远程系统执行配置和漏洞扫描。您可以使用它根据这些扫描和评估生成报告。

    - **OpenSCAP** - **OpenSCAP** 库以及配套的 **oscap** 命令行工具用于对本地系统执行配置和漏洞扫描、验证配置内容，并根据扫描和评估生成报告和指南。

    - **SCAP Security Guide (SSG)** - **scap-security-guide** 包提供了 Linux 系统的最新安全策略集。该指南由策略加固建议的目录组成，并在适用时与政府要求挂钩。该项目弥补了通用策略需求与特定实施指南之间的差距。

    - **Script Engine (SCE)** - SCE 是 SCAP 协议的扩展，允许管理员使用脚本语言（如 Bash、Python 和 Ruby）编写其安全内容。SCE
    扩展由 **openscap-engine-sce** 包提供。SCE 本身不属于 SCAP 标准的一部分。


    若要对多个系统执行自动审计，您可以使用针对 Red Hat Satellite 的 OpenSCAP 解决方案。


    ### 附加资源


    - **oscap()** - **oscap** 命令行工具的手手册提供了可用选项列表及其用法的说明。

    - **Red Hat 演示：创建自定义安全策略内容以实现安全合规性自动化** - 一项实操实验室，旨在让您通过 Red Hat Enterprise 中提供的工具获取自动化安全合规性的初步体验，以符合行业标准安全策略和自定义策略。如果您正在进行培训或需要为团队访问这些练习，请联系您的
    Red Hat 账户获取更多详细信息。

    - **Red Hat 演示：使用 RHEL 安全技术自我防护** - 一项实操实验室，用于学习如何使用 Red Hat Enterprise Linux
    中提供的关键安全技术（包括 OpenSCAP）在 RHEL 系统的所有级别实现安全。如果您需要培训或为团队访问这些练习，请联系您的 Red Hat 账户团队获取更多详细信息。

    - scap-workbench(8) - SCAP Workbench 应用程序的手册提供了该应用程序的基本信息以及指向 SCAP 内容潜在来源的链接。

    - scap-security-guide(8) - scap-security-guide 项目的手册提供了有关各种可用 SCAP 安全配置的进一步文档。此外还提供了如何使用
    OpenSCAP 工具利用基准的示例。

    - 有关在 Red Hat Satellite 中使用 OpenSCAP 的更多详情，请参阅《管理 Red Hat Satellite 指南》中的“安全合规性管理”。


    ## 6.2. 漏洞扫描


    ### 6.2.1. Red Hat 安全告告 OVAL 馈


    Red Hat Enterprise Linux 的审计能力基于安全内容自动化协议 (SCAP) 标准。SCAP 是一个多用途规范框架，支持自动化配置、漏洞和补丁检查、技术控制合规审计以及安全测量。


    SCAP 规范创建了一个生态系统，其中安全内容的格式是已知且标准化的，尽管并未强制扫描器或策略编辑器的实现。这使得组织可以构建一次其安全策略 (SCAP)，无论使用多少个安全供应商。


    开放漏洞评估语言 (OVAL) 是 SCAP 的核心且唯一组件。与其他工具和自定义脚本不同，OVAL 以声明式方式描述资源的所需状态。OVAL 代码永远不会被直接执行，除非
    OVAL 解释器工具调用它。OVAL 的声明性本质确保了被评估的系统不会被意外识别。


    与其他 SCAP 组件一样，OVAL 基于 XML。SCAP 标准定义了多种文档格式。每种格式都包含不同的信息并具有特定用途。


    Red Hat Product Security 通过跟踪和调查所有影响 Red Hat 客户的安全问题来帮助客户评估和管理风险。它在 Red Hat 客户门户上提供及时简洁的补丁和安全公告。Red
    Hat 创建并提供了 OVAL 路径定义，提供了我们公告的机器可读版本。


    由于平台、版本和其他因素的差异，Red Hat Product Security 对漏洞的定性评分与第三方提供的通用漏洞评分系统 (CVSS) 基准评分并不直接对应。因此，我们建议您使用
    RHSA oval 而不是第三方提供的 oval。


    RHSA OVAL 定义是独立且完整的包，并在 Red Hat 客户门户发布新安全公告的一小时内进行更新。


    每个 OVAL 路径一一对应于一个 Red Hat 安全公告 (RHSA)。由于一个 RHSA 可能包含多个漏洞的修复，每个漏洞按其常见漏洞和披露 (CVE)
    分别列出，并在我们的公共数据库中有链接。


    RHSA OVAL 定义用于检查安装在系统上的 RPM 软件包的版本。可以扩展这些定义以包含进一步检查，例如发现是否使用了漏洞配置。这些定义涵盖了由 Red
    Hat 分发的软件。需要额外的定义来检测第三方软件的补丁状态。


    #### 注意


    若要扫描容器或镜像的安全漏洞，请参阅[扫描容器和镜像漏洞]。


    附加资源


    - Red Hat 与 OVAL 的兼容性

    - Red Hat 与 CVE 的兼容性

    - [产品安全概述] 中的通知和公告

    - 安全数据指标

    - 扫描容器和镜像漏洞


    ## 6.2.2. 扫描系统漏洞


    **oscap** 命令行工具允许您扫描本地系统、验证配置内容，并根据这些扫描和评估生成报告和指南。该工具作为 OpenSCAP 库的前端，并根据其处理的
    SCAP 内容类型将其功能分组模块（子命令）。


    #### 前提条件


    - 已启用 **AppStream** 仓库。


    #### 步骤


    1. 安装 **openscap-scanner** 包：


    ```bash

    sudo yum install openscap-scanner

    ```


    2. 下载适用于系统的最新 RHSA OVAL 定义：


    ```bash

    # wget -O - https://www.redhat.com/security/data/oval/v2/RHEL8/rhel-8.oval.bz
    | bzip2 -decompress > rhel-8.oval.xml

    ```


    3. 扫描系统漏洞并将保存到 *vulnerability.html* 文件：


    ```bash

    # oscap oval eval --report vulnerability.html rhel-8.oval.xml

    ```


    #### 验证步骤


    1. 在您喜欢的浏览器中检查结果，例如：


    ```bash

    # firefox vulnerability.html &

    ```


