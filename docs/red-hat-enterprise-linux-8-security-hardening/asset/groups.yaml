    2. 为你的系统下载最新的 RHSA OVAL 定义：

    3. 扫描主机名为 *machine1*、SSH 运行在端口 22 且用户名为 *josec* 的远程系统进行漏洞扫描，并将结果保存到 *remote-vulnerability.html*
