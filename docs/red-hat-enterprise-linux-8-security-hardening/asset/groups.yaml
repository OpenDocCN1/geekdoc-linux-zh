    # Libreswan\n\nTo allow the Libreswan IPSec use using the IKE1 protocol, comment\
    \ out the following line in the /etc/ipsec.conf:\n\n```\n# include /etc/crypto-policies/back-ends/libreswan.config\n\
    ```\n\nThen add the ikev2=never option to your connection configuration. See the\
    \ ipsec.conf(5) man page for more information.\n\n# Additional resources\n\n-\
    \ For more details, see the update-crypto-policies(8) man page.\n\n## 3.6. CUSTOMIZING\
    \ SYSTEM-WIDE CRYPTOGRAPHIC POLICIES WITH POLICY MODIFIERS\n\nUse this procedure\
    \ to adjust certain algorithms or protocols of any system-wide cryptographic policy\
