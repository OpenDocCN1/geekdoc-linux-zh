- md: "\n# PROVIDING FEEDBACK ON RED HAT DOCUMENTATION\n\nWe appreciate your input\
    \ on our documentation. Please let us know how we could make it better. To do\
    \ so:\n\n- For simple comments on specific passages:\n  1. Make sure you are viewing\
    \ the documentation in the Multi-page HTML format. In addition, ensure you see\
    \ the Feedback button in the upper right corner of the document.\n  2. Use your\
    \ mouse cursor to highlight the text that you want to comment on.\n  3. Click\
    \ the Add Feedback pop-up that appears below the highlighted text.\n  4. Follow\
    \ the displayed instructions.\n\n- For submitting more complex feedback, create\
    \ a Bugzilla ticket:\n  1. Go to the Bugzilla website.\n  2. As the Component,\
    \ use Documentation.\n  3. Fill in the Description field with your suggestion\
    \ for improvement. Include a link to the relevant part(s) of documentation.\n\
    \  4. Click Submit Bug.\n\n# CHAPTER 1. OVERVIEW OF SECURITY HARDENING IN RHEL\n\
    \nDue to the increased reliance on powerful, networked computers to help run businesses\
    \ and keep track of our personal information, entire industries have been formed\
    \ around the practice of network and computer security. Enterprises have solicited\
    \ the knowledge and skills of security experts to properly audit systems and tailor\
    \ solutions to fit the operating requirements of their organization. Because most\
    \ organizations are increasingly dynamic in nature, workers are accessing critical\
    \ company IT resources locally and remotely, the need for secure computing environments\
    \ has become more pronounced.\n\nUnfortunately, many organizations, as well as\
    \ individual users, regard security as an afterthought, a process that is overlooked\
    \ in favor of increased power, productivity, convenience, ease of use, and budgetary\
    \ concerns. Proper security implementation is often postponed – after an unauthorized\
    \ intrusion has already occurred. Taking the correct measures prior to connecting\
    \ a site to an untrusted network, such as the Internet, is an effective means\
    \ of thwarting many attempts of intrusion.\n\n## 1.1. WHAT IS COMPUTER SECURITY?\n\
    \nComputer security is a general term that covers a wide area of computing and\
    \ information processing. Industries that depend on computer systems and networks\
    \ to conduct daily business transactions and access critical information regarding\
    \ their data as an important part of their overall assets. Several terms and metrics\
    \ have entered our daily business vocabulary, such as total cost of ownership\
    \ (TCO), return on investment (ROI), and quality of service (QoS). Using these\
    \ metrics, industries can calculate aspects such as data integrity and high-availability\
    \ (HA) as part of their planning and process management costs. In some industries,\
    \ as electronic commerce, the availability and trustworthiness of data can mean\
    \ the difference between success and failure.\n\n## 1.2. STANDARDIZING SECURITY\n\
    \nEnterprises in every industry follow regulations and rules that are set by standards-making\
    \ bodies such as the American Medical Association (AMA) or the Institute of Electrical\
    \ and Electronics Engineers (IEEE). The same concepts hold for information security.\
    \ Many security consultants and vendors agree upon the standard security model\
    \ known as CIA, *Confidentiality, Integrity, and Availability*. This three-tiered\
    \ model is a generally accepted concept for assessing risks of sensitive information\
    \ and establishing security policy. The following describes the CIA model in further\
    \ detail:\n\n- Confidentiality – Sensitive information must be available only\
    \ to a set of pre-defined individuals. Unauthorized transmission and usage of\
    \ information should be restricted. For example, confidentiality of information\
    \ ensures that a customer's personal or financial information is not obtained\
    \ by an unauthorized individual for malicious purposes such as identity theft\
    \ or fraud.\n\n- Integrity – Information should not be altered in ways that render\
    \ it incomplete or incorrect. Unauthorized users should be restricted from the\
    \ ability to modify or destroy sensitive information.\n\n- Availability – Information\
    \ should be accessible to authorized users any time that it is needed. Availability\
    \ is a warranty that information can be obtained with an agreed-upon frequency\
    \ and timeliness. This is often measured in terms of percentages and agreed to\
    \ formally in Service Level Agreements (SLAs) used by network providers and for\
    \ their enterprise clients.\n\n## 1.3. CRYPTOGRAPHIC SOFTWARE AND CERTIFICATIONS\n\
    \nRed Hat Linux undergoes several security certifications, such as FIPS 140-2\
    \ or Common Criteria (CC), to ensure that industry practices are followed.\n\n\
    RHEL 8 core crypto components Knowledgebase article provides an overview of the\
    \ Red Hat Enterprise Linux 8 core crypto components, documenting which they are,\
    \ how they are selected, how they are integrated into the operating system, how\
    \ they support hardware security modules and smart cards, and how do certifications\
    \ apply to them.\n\n## 1.4. SECURITY CONTROLS\n\nComputer security is divided\
    \ into three distinct master categories, commonly referred to as controls:\n\n\
    - Physical\n- Technical\n- Administrative\n\nThese three categories define the\
    \ main objectives of proper security implementation. Within these controls are\
    \ sub-categories that further detail the controls and how to implement them.\n\
    \n### 1.4.1. Physical controls\n\nPhysical control is the implementation of security\
    \ measures in a defined structure used to deter or prevent unauthorized access\
    \ to sensitive material. Examples of physical controls are:\n\n- Closed-circuit\
    \ surveillance cameras\n- Motion or thermal alarm systems\n- Security guards\n\
    - Picture IDs\n- Locked and dead-bolted steel doors\n- Biometrics (includes fingerprint,\
    \ voice, face, iris, handwriting, and other automated methods used to recognize\
    \ individuals)\n\n### 1.4.2. Technical controls\n\nTechnical controls use technology\
    \ as a basis for controlling the access and usage of sensitive data throughout\
    \ a physical structure and over a network. Technical controls are far-reaching\
    \ in scope and encompass such technologies as:\n\n- Encryption\n- Smart cards\n\
    - Network authentication\n- Access control lists (ACLs)\n- File integrity auditing\
    \ software\n\n### 1.4.3. Administrative controls\n\nAdministrative controls define\
    \ the human factors of security. They involve all levels of personnel in an organization\
    \ and determine which users have access to what resources and information by such\
    \ means as:\n\n- Training and awareness\n- Disaster preparedness and recovery\
    \ plans\n- Personnel recruitment and separation strategies\n- Personnel registration\
    \ and accounting\n\n## 1.5. VULNERABILITY ASSESSMENT\n\nGiven time, resources,\
    \ and motivation, an attacker can break into any system. All of the security procedures\
    \ and technologies currently available cannot guarantee that any systems are completely\
    \ safe from intrusion. Routers help secure gateways to the Internet. Firewalls\
    \ help secure the edge of the network. Virtual Private Networks safely pass data\
    \ in an encrypted stream. Intrusion detection systems warn you of malicious activity.\
    \ However, the success of each of these technologies is dependent upon a number\
    \ of variables:\n\n- The expertise of the staff responsible for configuring, monitoring,\
    \ and maintaining the technologies.\n- The ability to patch and update services\
    \ and kernels quickly and efficiently.\n- The ability of those responsible to\
    \ keep constant vigilance over the network.\n\nThe dynamic state of data systems\
    \ and technologies, securing corporate resources can be quite complex. Due to\
    \ this complexity, it is often difficult to find experts for all of your systems.\
    \ While it is possible to have personnel knowledgeable in many areas of information\
    \ security at a high level, it is difficult to retain staff who are experts in\
    \ more than a few subject areas. This is mainly because each area of information\
    \ security requires constant attention and focus. Information security does not\
    \ stand still.\n\nA vulnerability assessment is an internal audit of your network\
    \ and system security; the results of which indicate the confidentiality, integrity,\
    \ and availability of your network. Typically, vulnerability assessment starts\
    \ with a reconnaissance phase, during which important data gathering gathers the\
    \ target systems and resources. This phase leads to the readiness phase, where\
    \ the target is essentially checked for all known vulnerabilities. The readiness\
    \ phase culminates in the reporting phase, where the findings are classified into\
    \ categories of high, medium, and low risk; and methods for improving the security\
    \ (or mitigating the risk of vulnerability) of the target are discussed.\n\n###\
    \ 1.5.1. Defining assessment and testing\n\nVulnerability assessments may be broken\
    \ down into one of two types: outside looking in and inside looking around.\n"
  mdcn: "\n\n# 为红帽文档提供反馈\n\n感谢您对我们的文档提供的意见。请告诉我们如何才能使其更加完善。请按照以下步骤操作：\n\n- 针对特定段落的简单注释：\n\
    \  1. 确保您正在以多页 HTML 格式查看文档。此外，请确保您在文档右上角看到了“反馈 (Feedback)”按钮。\n  2. 使用鼠标光标高亮您想要注释的文本。\n\
    \  3. 点击高亮文本下方出现的“添加反馈 (Add Feedback)”弹出窗口。\n  4. 遵循显示的说明操作。\n\n- 提交更复杂的反馈，请创建一个\
    \ Bugzilla 工单：\n  1. 访问 Bugzilla 网站。\n  2. “组件 (Component)”字段选择“Documentation\
    \ (文档)”。\n  3. 在“描述 (Description)”字段中填写您的改进建议。包含指向文档相关部分的链接。\n  4. 点击“提交 Bug (Submit\
    \ Bug)”。\n\n# 第 1 章。RHEL 安全加固概述\n\n由于企业日益依赖强大的网络计算机来帮助运行业务并跟踪我们的个人信息，整个行业已围绕着网络和计算机安全实践形成。企业寻求安全专家的知识和技能，以对系统进行适当审计并根据其组织的运行需求定制解决方案。由于大多数组织在性质上日益动态化，员工通过本地和远程方式访问公司关键\
    \ IT 资源，对安全计算环境的需求变得更加突出。\n\n遗憾的是，许多组织以及个人用户将安全视为事后考虑，为了增加性能、生产力、便利性、易用性和预算考虑而忽视了这一过程。适当的安全实施往往被推迟——直到已经发生未经授权的侵入之后。在将站点连接到不可信网络（如互联网）之前采取正确措施，是阻止许多入侵尝试的有效手段。\n\
    \n## 1.1. 什么是计算机安全？\n\n计算机安全是一个涵盖计算和信息处理广泛领域的通用术语。依赖计算机系统和网络进行日常业务交易并访问有关其数据关键信息的行业，已将其视为整体资产的重要部分。一些术语和指标已进入我们的日常业务词汇，例如总拥有成本\
    \ (TCO)、投资回报率 (ROI) 和服务质量 (QoS)。通过使用这些指标，行业可以将数据完整性和高可用性 (HA) 等方面计算作为其规划和流程管理成本的一部分。在某些行业中（如电子商务），数据的可用性和可信度意味着成功与失败的区别。\n\
    \n## 1.2. 安全标准化\n\n每个行业的企业都遵循由美国医学协会 (AMA) 或电气电子工程师学会 (IEEE) 等标准制定机构制定的法规和规则。信息安全也遵循相同的概念。许多安全顾问和供应商对名为\
    \ CIA 的标准安全模型达成共识，即*机密性、完整性和可用性*。这三层模型是评估敏感信息风险和建立安全策略的通、广泛接受的概念。以下详细描述了 CIA 模型：\n\
    \n- 机密性 (Confidentiality) —— 敏感信息只能由一组预定义的人员访问。应限制信息的未经授权传输和使用。例如，信息的机密性确保客户的个人或财务信息不会被未经授权的个人用于身份盗用或欺诈等恶意目的获取。\n\
    \n- 完整性 (Integrity) —— 信息不应以使其不完整或错误的方式更改。应限制未经授权的用户修改或破坏敏感信息的能力。\n\n- 可用性 (Availability)\
    \ —— 授权用户应在需要的任何时候都能访问信息。可用性保证信息可以按照约定的频率和及时性获得。这通常以百分比衡量，并在网络提供者及其企业客户使用的服务水平协议\
    \ (SLAs) 中正式约定。\n\n## 1.3. 加密软件与认证\n\n红帽 Linux 通过了多项安全认证，例如 FIPS 140-2 或通用标准 (CC)，以确保遵循行业规范。\n\
    \n`RHEL 8 核心加密组件知识库` 文章提供了红帽企业级 Linux 8 核心加密组件的概述，记录了它们是什么、如何选择、如何集成到操作系统中、它们如何支持硬件安全模块和智能卡，以及认证如何应用于它们。\n\
    \n## 1.4. 安全控制\n\n计算机安全分为三个不同的主类别，通常称为控制措施：\n\n- 物理控制 (Physical)\n- 技术控制 (Technical)\n\
    - 行政控制 (Administrative)\n\n这三个类别定义了适当安全实施的主要目标。这些控制内部包含子类别，进一步详细说明控制措施以及如何实施。\n\
    \n### 1.4.1. 物理控制\n\n物理控制是在定义的结构中实施安全措施，以威慑或防止对敏感材料的未经授权访问。物理控制的示例包括：\n\n- 闭路摄像头\n\
    - 运动或热传感器报警系统\n- 保安人员\n- 图片 ID\n- 上锁并带有死锁的钢门\n- 生物识别（包括用于识别个人的指纹、语音、脸、虹膜、字体和其他自动方法）\n\
    \n### 1.4.2. 技术控制\n\n技术控制利用技术作为基础，控制整个物理结构和网络对敏感数据的访问和使用。技术控制范围广泛，涵盖了等技术：\n\n\
    - 加密\n- 智能卡\n- 网络身份验证\n- 访问控制列表 (ACLs)\n- 文件完整性审计软件\n\n### 1.4.3. 行政控制\n\n行政控制定义了安全中的人为因素。它们涉及组织中所有级别的人员，并通过以下手段决定哪些用户可以访问什么资源和信息：\n\
    \n- 培训与意识\n- 灾备备与恢复计划\n- 人员招聘与离职策略\n- 人员注册与核算\n\n## 1.5. 漏洞评估\n\n只要有、资源和动机，攻击者就可以破解任何系统。目前所有的安全程序和技术都无法保证系统完全安全。路由器帮助保护通互联网的网关。防火墙帮助保护网络边缘。虚拟网络通过加密流安全地传输数据。入侵检测系统会警报恶意活动。然而，每种技术的成功取决于若干变量：\n\
    \n- 负责配置、监控和维护技术的人员专业知识。\n- 快速高效地补丁和服务和内核的能力。\n- 负责人对网络保持持续警惕的能力。\n\n### 1.5.1.\
    \ 定义评估与测试\n\n漏洞评估可以分为两种类型：从外向内和从内向外。\n\n"
