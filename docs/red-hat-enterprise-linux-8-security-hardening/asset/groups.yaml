    ## 6.2.3. Scanning remote systems for vulnerabilities


    You can check remote systems for vulnerabilities with the OpenSCAP scanner using
    the **oscap-ssh** tool over the SSH protocol.


    ### Prerequisites


    - The **AppStream** repository is enabled.

    - The **openscap-scanner** package is installed on the remote systems.

    - The SSH server is running on the remote systems.


    ### Procedure


    - 1. Install the **openscap-utils** package:

    2. Download the latest RHSA OVAL definitions for your system:

    3. Scan a remote system with the *machine1* host name, SSH running on port 22,
    and the *josec* user name for vulnerabilities and save results to the *remote-vulnerability.html*
    file:


    ```bash

    # yum install openscap-utils

    ```


    ```bash

    # wget -O - https://www.redhat.com/security/data/oval/v2/RHEL8/rhel-8.xml.bz2
    | bzip2 -decompress > rhel-8.oval.xml

    ```


    ```bash

    # oscap-ssh joosec@machine1 22 oval eval --report remote-vulnerability.html rhel-8.oval.xml

    ```


    ### Additional resources


    - The **oscap-ssh(8)** man page.

    - The [Red Hat OVAL definitions]() list.


    ## 6.3. CONFIGURATION COMPLIANCE SCANNING


    ### 6.3.1. Configuration compliance in RHEL 8


    You can use configuration compliance scanning to conform to a baseline defined
    by a specific organization. For example, if you work with the US government, you
    might have to comply with the Operating System Protection Profile (OSPP), or if
    you are a payment processor, you might have to be compliant with the Payment Card
    Industry Data Security Standard (PCI-DSS). You can also perform configuration
    compliance scanning to harden your system security.


    Red Hat recommends you to follow the Security Content Automation Protocol (SCAP)
    content provided in the SCAP Security Guide package because it is in line with
    Red Hat best practices for affected components.


    The SCAP Security Guide provides content which conforms to SCAP 1.2 and SCAP 1.3
    standards. The openscap scanner utility is compatible with both SCAP 1.2 and SCAP
    1.3 content provided in the SCAP Security Guide package.


    ### IMPORTANT


    Performing a configuration compliance scanning does not guarantee the system is
    compliant.


    The SCAP Security Guide suite profiles for several platforms in a form of data
    stream documents. A data stream is a file that contains definitions, benchmarks,
    and individual rules. Each rule specifies the applicability and requirements for
    compliance. RHEL 8 provides several profiles for compliance with security policies.
    In addition to the industry standard, Red Hat data streams also contain information
    for remediation of failed rules.


    ### Structure of Compliance Scanning Resources


    ![](img/ce7756f7a90c9abeaf166ca2952129eb_42_0.png)


    A profile is a set of rules based on a security policy, such as Operating System
    Protection Profile (OSPP) or Payment Card Industry Data Security Standard (PCI-DSS).
    This enables you to audit the system in an automated way for compliance with security
    standards.


    You can modify (tailor) a profile to customize certain rules, for example password
    length. For more information on profile tailoring, Customizing a Security Profile
    with SCAP Workbench.


    ### NOTE


    To scan containers or container images for configuration compliance, see Scanning
    Containers and Container Images for Vulnerabilities.


    ### 6.3.2. Possible results of an OpenSCAP scan


    Depending on various properties of your system and the data stream and profile
    applied to an OpenSCAP scan, each rule may produce a specific result. This is
    a list of possible results with brief explanations of what they mean.


    Table 6.1. Possible results of an OpenSCAP scan


    | Result | Explanation |

    |---|---|

    | Pass | The scan did not find any conflicts with this rule. |

    | Fail | The scan found a conflict with this rule. |


    ### 6.3.3. Viewing profiles for configuration compliance


    Before you decide to use profiles for scanning or remediation, you can list them
    and check their detailed descriptions using the **oscap info** sub-command.


    ### Prerequisites


    - The **openscap-scanner** and **scap-security-guide** packages are installed.


    ### Procedure


    - 1. List all files with security compliance profiles provided by the SCAP Security
    Guide project:


    ```bash

    $ ls /usr/share/xml/scap/scap/content/

    ssg-firefox-cpe-dictionary.xml ssg-rhel6-ocil.xml

    ssg-firefox-cpe-oval.xml ssg-rhel6-oval.xml

    ...

    ssg-rhel6-ds-1.2.xml ssg-rhel8-oval.xml

    ssg-rhel8-ds.xml ssg-rhel8-xcdf.xml

    ```


    - 2. Display detailed information about a selected data stream using the **oscap
    info** sub-command. XML files containing data streams are indicated by the **-ds**
    string in their names. In the **Profiles** section, you can find a list of available
    profiles and their IDs:


    ```bash

    $ oscap info /usr/share/xml/scap/scap/content/ssg-rhel8-ds.xml

    ...

    Profiles:

    Title: PCI-DSS v3.2.1 Control Baseline for Red Hat Enterprise Linux 8

    ```


    | Result | Explanation |

    |---||---|

    | Not checked | OpenSCAP does not perform an automatic evaluation of this rule.
    Check whether your system conforms to this rule. |

    | Not applicable | This rule does not apply to the current configuration. |

    | Not selected | This rule is not part of the profile. OpenSCAP does not evaluate
    this rule and does not display these rules in the results. |

    | Error | The scan encountered an error. For additional information, you can use
    the **--verbose DEVEL** option with opening a [bug report](#). |

    | Unknown | The scan encountered an unexpected situation. For additional information,
    you can use the `--verbose DEVEL` command. Considering a [bug report](#). |


    Id: xcdf_org.ssgproject.content_profile_pci-dss

    Title: OSPP - Protection Profile for General Purpose Operating Systems

    Id: xcdf_org.ssgproject.content_profile_ospp

    ...


    - 3. Select a profile from the data stream file and display additional details
    about the selected profile. To do so, use oscap info with the **--profile** option
    followed by the last section of the ID displayed in the output of the previous
    command. For example, the ID of the PCI-DSS profile is xcdf_org.ssgproject.content_profile_pci-dss,
    and the --profile option is pci-dss:


    ```bash

    $ oscap info --profile pci-dss /usr/share/xml/scap/content/ssg-rhel8-dss.xml

    ...

    Title: PCI-DSS v3.2.1 Control Baseline for Red Hat Enterprise Linux 8

    Id: xcdf_org.ssgproject.content_profile_pci-dss

    ```


    Description: Ensures PCI-DSS v3.2.1 security configuration settings are applied.

    ...


    ### Additional resources


    - The scap-security-guide(8) man page.


    ### 6.3.4. Assessing configuration compliance with a specific baseline


    To determine whether your system conforms to a specific baseline, follow these
    steps.


    ### Prerequisites


    - The openscap-scanner and scap-security-guide packages are installed

    - You know the ID of the profile within the baseline with which the system should
    comply. To find the ID, see Viewing Profiles for Configuration Compliance.


    ### Procedure


    - 1. Evaluate the compliance of the system with the selected profile and save
    the results in the report.html file, for example:


    ```bash

    $ oscap xccdf eval --report report.html --profile ospp

    /usr/share/xml/scap/content/ssg-rhel8-ds

    ```


    - 2. Optional: Scan a remote system with the machine1 host, SSH running on port
    22, and the josec user name for compliance and save results to the remote-report.html
    file:


    ```bash

    $ oscap-ssh joosec@machine1 22 xcdf eval --report remote_report.html --profile
    ospp

    /usr/share/xml/scap/content/ssg-rhel8-ds

    ```


    ### Additional resources


    - The scap-security-guide(8) man page

    - The SCAP Security Guide documentation installed in the file:///usr/share/doc/scap-security-guide/
    directory.

    - The Guide to the Secure Configuration of Red Hat Enterprise Linux installed
    with scap-security-doc package.


    ## 6.4. REMEDIATING THE SYSTEM TO ALIGN WITH A SPECIFIC BASELINE


    Use this procedure to remediate the RHEL 8 system to align with a specific baseline.
    This example uses the Protection Profile for General Purpose Operating Systems
    (OSPP).


    > > WARNING If not used carefully, running the system evaluation with the Remedate
    option enabled might render the system non-functional. Red Hat does not provide
    any automated method to revert changes made by security-hardening remediations.
    Remediations are supported on RHEL systems in the default configuration.


    ### Prerequisites


    - scap-security-guide package is installed on your RHEL 8 system.


    ### Procedure


    - Use the oscap command with the --remediate option:


    ```bash

    $ oscap xccdf eval --profile ossp --remediate /usr/share/xml/scap/content/ssg/ssg-rhel8-ds.xml

    ```


    - Restart your system.


    ### Verification steps


    - Evaluate compliance of the system with the OSSP profile, and save scan results
    in the ossp_report.html file:


    ```bash

