  - '[PAGE 68]


    # 9. CONFIGURING AUTOMATED UNLOCKING OF ENCRYPTED VOLUMES USING POLICY-BASED DECRYPTION


    A Clevis pin is a plug-in to the Clevis framework. One of such pins is a plug-in
    that implements interactions with the NBDE server – Tang.


    Clevis and Tang are client and server components that provide network-bound encryption.
    In Red Hat Enterprise Linux, they are used in conjunction with LUKS to encrypt
    and decrypt root and non-root volumes to accomplish Network-Bound Disk Encryption.


    Both client- and server-side components use the Jose library to perform provisioning
    encryption and decryption operations.


    When you are provisioning NBDE, the Clevis pin for Tang gets a list of the Tang
    server''s advertised asymmetric keys. Alternatively, since the keys are asymmetric,
    a list of Tang''s public keys can be distributed out of band so that clients operate
    without access to the Tang server. This mode is called offline provisioning.


    The Clevis pin for Tang uses one of the public keys to generate a unique, cryptographically-strong
    encryption key. Once the data is encrypted using this key, the key is discarded.
    The Clevis client should store the state produced by provisioning operation in
    a convenient location. Process of encrypting data is the provisioning step.


    The LUKS 2 (LUKS2) is the default format in Red Hat Enterprise Linux 8, hence,
    the provisioning state for NBDE is stored in a LUKS2 header. The leveraging of
    provisioning state for NBDE by the lukmeta package is used only for volumes encrypted
    with LUKS1. The Clevis pin for Tang supports both LUKS1 and LUKS2 without specification
    need.


    When the client is ready to access its data, it loads the metadata produced in
    the provisioning step and responds to recover the encryption key. This process
    is the recovery step.


    In NBDE, Clevis binds a LUKS volume pin so that it can be automatically unlocked.
    After successful completion of the binding process, the disk can be unlocked using
    the provided Drac unlocker.


    # 9.2. INSTALLING AN ENCRYPTION CLIENT - CLEVIS


    Use this procedure to deploy and start using the Clevis pluggable framework on
    your system.


    Procedure


    +   1. To install Clevis and its pins on a system with an encrypted volume:


    ```

    # yum install clevis

    ```


    +   2. To decrypt data, use a clevis decrypt command and provide a cipher text
    in the JSON Web Encryption (JWE) format, for example:


    ```

    $ clevis decrypt < secret.jwe

    ```


    Additional resources


    +   - For a quick reference, see the built-in CLI help:


    ```

    $ clevis

    Usage: clevis COMMAND [OPTIONS]


    clevis decrypt      Decrypts using the policy defined at encryption time

    ```'
  - '[PAGE 69]


    # Red Hat Enterprise Linux 8 security hardening


    clevis encrypt sss Encrypts using Shamir''s Secret Sharing policy

    clevis encrypt tang Encrypts using a Tang binding server policy

    clevis encrypt tpm2 Encrypts using a TPM2. chip binding policy

    clevis binds Binds a LUKS device using the specified policy

    clevis lists Lists pins bound to a LUKSv1 or LUKSv2 device

    clevis pass Returns the LUKS passphrase used for binding a particular slot.

    clevis regen Regenerates LUKS metadata

    clevis report Report any key rotation on the server side

    clevis unbind Unbinds a pin bound to a LUKS volume

    clevis unlock Unlocks a LUKS volume


    +   - For more information , see the clevis(1) man page.


    # 9.3. DEPLOYING A TANG SERVER WITH SELINUX IN ENFORCING MODE


    Use this procedure to deploy a Tang server running on a custom port as a confined
    service in SELinux enforcing mode.


    # Prerequisites


    +   - The policycoreutils-python-utils package and its dependencies are installed.


    # Procedure


    +   1. To install the tang package and its dependencies, enter the following command
    as root:

    ```bash

    # yum install tang

    ```


    +   2. Pick an unoccupied port, for example, 7500/tcp, and allow the tangd service
    to bind to that port:

    ```bash

    # semanage port -a t tangd_port -p tcp 7500

    ```


    Note that a port can be used by only one service at a time, and thus an attempt
    to use an already occupied port will return the ValueError: Port already defined
    error message.


    +   3. Open the port in the firewall:

    ```bash

    # firewall-cmd --add-port=7500/tcp

    # firewall-cmd --runtime-to-permanent

    ```


    +   4. Enable the tangd service:

    ```bash

    # systemctl enable tangd.socket

    ```


    +   5. Create an override file:

    ```bash

    # systemctl edit tangd.socket

    ```


    +   6. In the editing screen, which opens an empty override.conf file located
    in the /etc/systemd/system/tangd.socket.d/ directory, change the default port
    for the Tang server from 80 to the previously picked number d by adding the following
    lines:'
  - '[PAGE 70]


    ```

    [Socket]

    ListenStream=

    ListenStream=7500

    ```


    Save the file and exit the editor.


    7. Reload the changed configuration:


    ```

    # systemctl daemon-reload

    ```


    8. Check that your configuration is working:


    ```

    # systemctl show tangd.socket -p Listen

    Listen=[:]:7500 (Stream)

    ```


    9. Start the tangd service:


    ```

    # systemctl start tangd.socket

    ```


    Because tangd uses system socket activation mechanism, the server starts as soon
    as the first connection comes in. A new set of cryptographic keys is automatically
    generated at the first start. To perform cryptographic operations such as manual
    key generation, use the jose utility.


    Additional resources


    +   - tang(8) man page

    - semanage(8) man page

    - firewall-cmd(1) man page

    - systemd.unit(5) and systemd.socket(5) man pages

    - jose(1) man page


    # 9.4. ROTATING TANG SERVER KEYS AND UPDATING BINDINGS ON CLIENTS


    Use the following steps to rotate your Tang keys and update existing bindings
    on clients. The precise interval at which you should rotate them depends on your
    application, key sizes, and institutional policy.


    Prerequisites


    +   - A Tang server is running.

    - The clevis and clevis-luks packages are installed on your clients.

    - Note that clevis list, clevis luks report, and clevis luks regen have been introduced
    in RHEL 8.2.


    Procedure'
  - '[PAGE 71]


    # Red Hat Enterprise Linux 8 hardening


    +   1. To rotate keys, generate new keys using the /usr/libexec/tangd-keygen command
    in the /var/db/tang key database directory on the Tang server:


    ```

    # ls /var/db/tang

    UVQ6xSweb1RKG3KbjMdiR020yh.jwk y9hXLQTISSiB5jSEGWjnnhyH8FDTJU.jwk

    # /usr/libexec/tangd-keygen /var/db/tang

    # ls /var/db/tang

    UVQ6xSweb1RKG3KbjMdiR020yh.jwk y9hXLQTISSiB5jSEGWjnnhy8FDTJU.jwk

    3ZWS6-cRCG61UPJS2BmMPU4154 zluX6hijUy_PeseUEFI7hi8.jwk

    ```


    +   2. Check that your Tang server accepts the signing key for your new key, for
    example:


    ```

    # tang-show-keys 7500

    3ZWS6-cRCG61UPJS2BmMPU4154

    ```


    +   3. Rename the old keys that have a leading . to hide them from advertisement.
    Note that the file names in the example differs from unique file names in the
    key directory of your Tang server:


    ```

    # cd /var/db/tang

    # ls -l

    -rw-r--r-- 1 root 354 Sep 23 16:08 3ZWS6-cRCG61UPJS2BmMPU4154.jwk

    -rw-r--r-- 1 root 349 Sep 29 16:08 1-zluX6hijUy_PeseUEFI7hi8.jwk

    -rw-r--r-- 1 root 349 Feb 7 14:55 UVQ6xSweb1RKG3KbjMdiR020yh.jwk

    -rw-r--r-- 1 root 354 Feb 7 14:55 y9hXLQTISSiB5jSEGWjnnhy8FDTJU.jwk

    # mv UVQ6xSweb1RKG3KbjMdiR020yh.jwk y9hXLQTISSiB5jSEGWjnnhy8FDTJU.jwk

    # mv y9hXL...y8FDTJU.jwk

    ```


    Tang immediately picks up all changes. When you add new keys, clients pick up
    the new keys and old clients can continue to use the old keys.


    +   4. On NBDE clients, use the clevis lugs report command to check if the keys
    are advertised by the Tang server remains the same. You can identify slots using
    the clevis lugs list command, for example:


    ```

    # clevis lugs list -d /dev/sda2

    1: {"url":"http://tang.srv/"}

    # clevis lugs report -d /dev/sda2 -s 1

    ...

    Reported that some keys were rotated.

    Do you want to regenerate metadata with ''clevis lugs regen -d /dev/sda2 -s 1?''
    [y/N]

    ```


    +   5. To generate LUKS metadata for the new keys either y to prompt of the previous
    command, or use the clevis lugs regen command:


    ```

    # clevis lugs regen -d /dev/sda2 -s 1

    ```


    +   6. When you are sure that all old clients use the new keys, remove the old
    keys from the Tang server, for example:


    ```

    # cd /var/db/tang

    # rm ..*.jwk

    ```'
- md: "\n## 9. CONFIGURING AUTOMATED UNLOCKING OF ENCRYPTED VOLUMES USING POLICY-BASED\
    \ DECRYPTION\n\n> > WARNING\n> Removing the old keys while clients are still using\
    \ them can result in data loss. If you accidentally remove such keys, use the\
    \ clevis lumps regen command on the clients, and provide your LUKS password manually.\n\
    \n## Additional resources\n\n- * *tang-show-keys(1), clevis-luks-list(1), clevis-luks-report(1),\
    \ and clevis-luks-regen(1)* man pages\n\n## 9.5. DEPLOYING AN ENCRYPTION CLIENT\
    \ FOR AN NBDE SYSTEM WITH TANG\n\nThe following procedure contains steps to configure\
    \ automated unlocking of an encrypted volume with a Tang network server.\n\n##\
    \ Prerequisites\n\n- * The Clevis framework is installed.\n- A Tang server is\
    \ available.\n\n## Procedure\n\n- 1. To bind a Clevis encryption client to a Tang\
    \ server, use the clevis encrypt tang sub-command:\n\n```bash\n$ clevis encrypt\
    \ tang '{\"url\":\"http://tang.srv:port\"}}' input-plain.txt > secret.jwe\nThe\
    \ advertisement contains the following signing keys:\n```\n\n_Oslk0-E216qfdDiVmdoZjaA\n\
    Do you wish to trust these keys? [ynN] y\n\nChange the http://tang.srv:port URL\
    \ in the previous example where tang is installed. The secret.jwe output file\
    \ contains your encrypted cipher text in the JSON Web Encryption format. This\
    \ cipher text is read from the input-plain.txt file.\n\nAlternatively, if your\
    \ configuration requires a non-interactive communication with a Tang server without\
    \ SSH, you can download an advertisement and save it to a file:\n\n```bash\n$\
    \ curl -sfg http://tang.srv:port -o adv.jws\n```\n\nUse the advertisement in the\
    \ adv.jws file for any following tasks, such as encryption of files or messages:\n\
    \n```bash\n$ echo 'hello' | clevis encrypt tang '{\"url\":\"http://tang.srv:port\"\
    ,\"adv\":\"adv.jws\"}'\n```\n\n- 2. To decrypt data, use the clevis decrypt command\
    \ and provide the cipher text (JWE):\n\n```bash\n$ clevis decrypt <secret.jwe\
    \ output-plain.txt\n```\n\n## Additional resources\n\n- For a quick reference,\
    \ see the clevis-encrypt-tang(1) man page or use the built-in CLI help:\n\n```bash\n\
    $ clevis\n$ clevis decrypt\n$ clevis encrypt tang\nUsage: clevis encrypt tang\
    \ CONFIG < PLAINTEXT > JWE\n...\n```\n\n- For more information, see the following\
    \ man pages:\n\nclevis(1)\n\\clevis-luks-unlockers(7)\n\n## 9.6. REMOVING A CLEVIS\
    \ PIN FROM A LUKS-ENCRYPTED VOLUME MANUALLY\n\nUse the following procedure for\
    \ manually removing the metadata created by the clevis bind command and for wiping\
    \ a key slot that contains passphrase added by Clevis.\n\n> IMPORTANT\n> The recommended\
    \ way to remove a Clevis pin from a LUKS-encrypted volume is through the clevis\
    \ locks unbind command. The removal procedure using clevis unbind consists of\
    \ only one step and works for LUKS1 and LUKS2 volumes. The following example command\
    \ removes the metadata created by the binding step and wipe the key slot 1 on\
    \ the /dev/sda2 device:\n\n```bash\n# clevis locks unbind -d /dev/sda2 -s 1\n\
    ```\n\n## Prerequisites\n\n- A LUKS-encrypted volume with a Clevis binding.\n\n\
    ## Procedure\n\n- 1. Check which LUKS version, for example, /dev/sda2, is encrypted\
    \ by and identify a slot and token that is bound to Clevis:\n\n```bash\n# cryptsetup\
    \ luksDump /dev/sda2\nLUKS header information\nVersion: 2\n...\nKeyslots:\n0:\
    \ luks2\n...\n1: luks2\nKey: 512 bits\nPriority: normal\n```\n\n```\nCipher: aes-xts-plain64\n\
    Tokens:\n  0: clevis\nKeyslot: 1\n```\n\nIn the previous example, the Clevis token\
    \ is identified by 0 and the associated key slot is 1.\n\n- 2. In case of LUKS2\
    \ encryption, remove the token:\n\n```bash\n# cryptsetup remove --token-id 0 /dev/sda2\n\
    ```\n\n- 3. If your device is encrypted by LUKS1, which is indicated by the Version:\
    \ 1 string in the output of the cryptsetup luksDump command, perform this additional\
    \ step with the luksmeta wipe command:\n\n```bash\n# luksmeta wipe -d /dev/sda2\
    \ -s 1\n```\n\n- 4. Wipe the key slot containing the Clevis passphrase:\n\n```bash\n\
    # cryptsetup luksKillSlot /dev/sda2 1\n```\n\n## Additional resources\n\n- For\
    \ more information, see the clevis-luks-unbind(1), cryptsetup(8), and luksmeta(8)\
    \ man pages.\n\n## 9.7. DEPLOYING AN ENCRYPTION CLIENT WITH A TPM 2.0 POLICY\n\
    \nThe procedure contains steps to configure automated unlocking of an encrypted\
    \ volume with a Trusted Platform Module 2.0 (TPM 2.0) policy.\n\n## Prerequisites\n\
    \n- The Clevis framework is installed. See Installing an encryption client - Clevis\n\
    - A system with the 64-bit Intel or 64-bit AMD architecture\n\n## Procedure\n\n\
    - 1. To deploy a client that uses a TPM 2.0 chip, use the clevis encrypt tpm2\
    \ command with the only argument in form of the JSON object:\n\n```bash\n$ clevis\
    \ encrypt tpm2 '{}' < input-plain.txt > secret.jwe\n```\n\nTo choose a different\
    \ hierarchy, hash, and key algorithms, specify configuration properties, for example:\n\
    \n```bash\n$ clevis encrypt tpm2 '{\"hash\":\"sha1\",\"key\":\"rsa\"}' < input-plain.txt\
    \ > secret.jwe\n```\n\n- 2. To decrypt the data, provide the ciphertext in the\
    \ JSON Web Encryption (JWE) format:\n\n```bash\nclevis decrypt <secret.jwe> >\
    \ output-plain.txt\n```\n\nThe pin also supports sealing data to a Platform Configuration\
    \ Registers (PCR) state. That way, the data can only be unsealed if the PCRs hashes\
    \ match the policy used when sealing.\n\nFor example, to seal the data to the\
    \ PCR with index 0 and 1 for the SHA-1 bank:\n\n```bash\nclevis encrypt tpm2 '{\"\
    pcr_bank\":\"sha1\",\"pcr_ids\":\"0,1\"}' input-plain.txt > secret.jwe\n```\n\n\
    ## Additional resources\n\n- For more information and the list of possible configuration\
    \ properties, see the clevis-encrypt-tpm2(1) man page.\n\n## 9.8. CONFIGURING\
    \ MANUAL ENROLLMENT OF LUKS-ENCRYPTED VOLUMES\n\nUse the following steps to configure\
    \ unlocking LUKS-encrypted volumes with NBDE.\n\n## Prerequisite\n\n- A Tang server\
    \ is running and available.\n\n## Procedure\n\n- 1. To automatically unlock an\
    \ existing LUKS-encrypted volume, install the clevis-luks subpackage:\n\n```bash\n\
    # yum install clevis-luks\n```\n\n- 2. Identify the LUKS-encrypted volume for\
    \ PBD. In the following example, the block device is referred as /dev/sda2.\n\n\
    | NAME | MIN | RM | SIZE | RO | TYPE | MOUNTPOINT |\n| :--- | :--- | :--- | :---\
    \ | :--- | :--- | :--- |\n| sda | 8:0 | 0 | 12G | 0 | disk | |\n| sda1 | 8:1 |\
    \ 0 | 1G | 0 | part | /boot |\n| sda2 | 8:2 | 0 | 11G | 0 | part | |\n| luks-40e20552-2da4-4954-9d56-655aa7994bf6\
    \ | 253:0 | 0 | 11G | 0 | group | |\n| rhel-root | 253:0 | 0 | | | lvm | |\n|\
    \ rhel-swap | 253:1 | 0 | 1.2G | 0 | lvm | [SWAP] |\n\n- 3. Bind the token to\
    \ a server using the clevis luks bind command:\n\n```bash\n# clevis luks bind\
    \ -d /dev/sda2 tag \"'url':'http://tang.srv'\"\n```\n\nThe advertisement contains\
    \ the following keys:\n_Ostlt0-E2l6qFdiVmiZoJA\n\nDo you wish to trust these keys?\
    \ [ynYN] y\nYou are about to initialize a LUKS device for metadata storage.\n\
    Attempting to initialize it may result in data loss if data was already written\
    \ into the LUKS header gap in a different format.\n\n> A backup is advised before\
    \ initialization.\nDo you wish to initialize /dev/sda2? [yn] y\nThis command performs\
    \ four steps:\na. Creates a new key with the same entropy.\nb. Encrypts the new\
    \ key with Clevis.\nc. Stores the JWE object in the LUKS header.\nd. Enables the\
    \ new key for use.\n\n> IMPORTANT\n> The recommended way to remove a Clevis pin\
    \ from a LUKS-encrypted volume is through the clevis locks unbind command. The\
    \ removal procedure using clevis unbind consists of only one step and works for\
    \ LUKS1 and LUKS2 volumes. The following example command removes the metadata\
    \ created by the binding step and wipe the key slot 1 on the /dev/sda2 device:\n\
    \n```bash\n# clevis locks unbind -d /dev/sda2 -s 1\n```\n\n- 4. The volume can\
    \ now be unlocked with your existing password.\n5. To enable early boot for system\
    \ binding, enter the following commands on an already installed:\n\n```bash\n\
    # yum install clevis-dracut\n# dracut -fv --regenerate-all\n```\n\n## Verification\
    \ steps\n\n- 1. To verify that Clevis is successfully placed in LUKS header, use\
    \ the clevis list command:\n\n```bash\n# clevis luks list -d /dev/sda2\n```\n\n\
    ## 9.9. CONFIGURING AUTOMATED ENROLLMENT OF LUKS-ENCRYPTED VOLUMES USING KICKSTART\n\
    \nFollow the steps in this procedure to configure an automated installation process\
    \ that uses Clevis for enrollment of LUKS-encrypted volumes.\n\n## Procedure\n\
    \n- 1. Instruct Kickstart to partition the disk such that the root partition has\
    \ enabled LUKS encryption with a temporary password. The password is temporary\
    \ for the enrollment process.\n  - /part --type=\"xfs\" --ondisk=vda --size=256\n\
    \  - /part --type=\"xfs\" --ondisk=vda --grow=encrypted --passphrase=temppass\n\
    \n- 2. Install the related Clevis packages by listing them in the %packages section:\n\
