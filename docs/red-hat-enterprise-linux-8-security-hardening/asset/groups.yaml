    \ man page and the Crypto Policy Definition Format section in the update-crypto-policies(8)\
    \ man page.\n\n- The How to customize crypto policies in RHEL 8.2 provides additional\
    \ examples of customizing system-wide cryptographic policies.\n\n## 3.7. CREATING\
    \ AND SETTING A CUSTOM SYSTEM-WIDE CRYPTOGRAPHIC POLICY\n\nThe following steps\
    \ demonstrate customizing the system-wide cryptographic policies by a complete\
    \ policy file.\n\n# NOTE\n\nCustomization of system-wide cryptographic policies\
    \ is available from RHEL 8.2.\n\n# Procedure\n\n- 1. Create a policy file for\
