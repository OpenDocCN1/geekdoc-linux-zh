    This procedure provides information about encrypting a blank block device using
    the LUKS2 format.


    # Prerequisites


    +   - A blank block device.


    # Procedure


    +   1. Setup a partition as an encrypted LUKS partition:


    ```

    # cryptsetup luksFormat /dev/sdb1

    ```


    +   2. Open an encrypted LUKS partition:


    ```

    # cryptsetup open /dev/sdb1 sdb1_encrypted

    ```


    This unlocks the partition and maps it to a new device using the device mapper.
    This alerts kernel that **device** is an encrypted device and should be addressed
    through LUKS using the **/dev/mapper/device_mapped_name** so as not to overwrite
    the encrypted data.


    +   3. To write encrypted to the partition, it must be accessed through the device
    mapped name. To do this, you must create a filesystem. For example:


    ```

    # mkfs -t ext4 /dev/mapper/sdb1_encrypted

    ```


    +   4. Mount the device:


    ```

    # mount /dev/mapper/sdb1_encrypted

    ```


    # Additional resources


    +   - For more details, see the **cryptsetup(8)** man page.'
