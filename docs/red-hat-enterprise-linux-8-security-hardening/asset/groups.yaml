    FIPS 140–2


    +   - For more details on FIPS 140-2, see the Security Requirements for Cryptographic
    Modules on the National Institute of Standards and Technology (NIST) web site.


    # ## 3.4. ENABLING FIPS MODE IN A CONTAINER


    To enable cryptographic modules self-checks in accordance with the requirements
    by Federal Information Processing Standard (FIPS) Publication 140-2 in a container:


    ### Prerequisites


    +   - The host system must be switched in FIPS mode first, see Switching the system
    to FIPS mode.


    ### Procedure


    +   1. Mount the /etc/system-fips file on the container from the host.


    +   2. Set the FIPS cryptographic policy level in the container:


    ```

    $ update-crypto-policies --set FIPS

    ```


    RHEL 8.2 introduced an alternative method for switching a container to FIPS mode.
    It requires only the following command in the container:


    ```

    # mount --bind /usr/share/crypto-policies/back-ends/FIPS /etc/crypto-policies/back-ends

    ```


    ![](img/ce7756f7a90c9abeaf166ca2952129eb_27_0.png)


    > > NOTE

    In RHEL 8, the fips-setup command does not work properly in a container and it
    cannot be used to enable or check FIPS mode in this scenario.


    # ## 3.5. EXCLUDING AN APPLICATION FROM FOLLOWING SYSTEM-WIDE CRYPTO POLICIES


    You can customize cryptographic settings used by your application preferably by
    configuring supported cipher suites and protocols directly in the application.


    You can also remove a symlink to your application from the /etc/crypto-policies/back-ends
    directory and replace it with your customized cryptographic settings. This configuration
    prevents the use of system-wide cryptographic policies for applications that exclude
    the back end. Furthermore, this modification is not supported by Red Hat.


    # ### 3.5.1. Examples of opting out of system-wide crypto policies


    wget


    To customize cryptographic settings used by the wget downloader, use --secure-protocol
    and --ciphers. For example:


    ```

    $ wget --secure-protocol=TLSv1_1 --ciphers="SECURE128" https://example.com

    ```'
