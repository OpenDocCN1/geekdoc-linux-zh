    \ command line using the auditctl utility or in the /etc/audit/rules.d/ directory.\n\
    \nThe auditctl command enables you to control the basic functionality of the Audit\
    \ system and to define rules that decide which Audit events are logged.\n\n# File-system\
    \ rules examples\n\n+   1. To define a rule that allows all access to, and every\
    \ attribute change of, the /etc/passwd file:\n   > # auditctl -w /etc/passwd -p\
    \ wa -k password_changes\n2. To define a rule that allows all access to, and every\
    \ attribute change of, all the files in the /etc/selinux/ directory:\n   > # auditctl\
    \ -w /etc/selinux/ -p wa -k sel_changes\n\n# System-call rules examples\n\n+ \
    \  1. To define a rule that creates a log entry every time the adjtime or settimeday\
    \ system calls are used by a program, and use the 64-bit architecture:\n   > #\
    \ auditctl -always,exit -F arch=b64 -S adjtime -S settimeday -k time_change\n\
    2. To define a rule that creates a log entry every time a file is deleted or renamed\
    \ by a system user whose ID is 1000 or larger:\n   > # auditctl -a always,exit\
    \ -S unlink -S unlink -S rename -F audit>=1000 -F audit!=429467295 -k delete\n\
    \nNote that -F audit!=429467295 option is used to exclude users whose login UID\
    \ is set.\n\n# Executable-file rules\n\nTo define a rule that logs all execution\
    \ of the /bin/id program, execute the following command:"
