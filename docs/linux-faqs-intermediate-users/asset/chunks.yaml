    \ the shadow file in the `/etc` directory. The shadow files contain the encrypted\
    \ passwords.\n```bash\n$ cat /etc/shadow\n```\n`cat: /etc/shadow: Permission denied`\n\
    \nThis line means that members of the group `wheel` can run all commands.\n```\n\
    %wheel  ALL=(ALL) ALL\n```\nCreate a user called `rosie` –\n```bash\n# useradd\
    \ rosie\n```\nLogin as `rosie` using the command to access her shell:\n```bash\n\
    $ su – rosie\n```\nTry to read the shadow file in the `/etc` directory. The shadow\
    \ files contain the encrypted passwords.\n```bash\n$ cat /etc/shadow\n```\n`cat:\
    \ /etc/shadow: Permission denied`\n\n# How to create a directory structure in\
    \ Linux?\nYou would learn about BASH brace expansion. For instance, the following\
    \ command is a quick method to create subdirectories under one base directory.\
