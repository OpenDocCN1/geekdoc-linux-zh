    ### What do I do with DNS on Linux?


    If you are a system administrator or anyone who is in charge of your Linux systems
    for your home office or small business. You have to know about the DNS settings
    on the Linux systems (for that matter even on your Windows Systems).


    It is the translating protocol that translates your domainname such as `www.foo.com`
    to an IP address.


    To check if your system is configured correctly, here are some of the DNS troubleshooting
    commands that would be handy to you.


    The `host` command translates the `www.yahoo.com` to its corresponding IP address,
    specific to my region.


    ```bash

    $host www.yahoo.com

    ```


    The expected result is


    ```bash

    $ host www.yahoo.com

    ```


    `www.yahoo.com` is an alias for `new-fp-shed.wg1.b.yahoo.com`.

    `new-fp-shed.wg1.b.yahoo.com` has address `202.165.107.50`.

    `new-fp-shed.wg1.b.yahoo.com` has address `202.165.107.49`.

    `new-fp-shed.wg1.b.yahoo.com` has IPv6 address `2406:2000:e4:1605::9001`.

    `new-fp-shed.wg1.b.yahoo.com` has IPv6 address `2406:2000:e4:1605::9000`.


    If there is a DNS issue, the expected result is connection timed out; no servers
    could be reached.


    To check which DNS servers you have on your system, you need to see what `/etc/resolv.conf`
    says: In my case it is `192.168.29.1` which is the IP address of Broadband modem
    which provides DNS services.


    ```bash

    $ cat /etc/resolv.conf

    ```


    ```

    Generated by NetworkManager

    nameserver 192.168.29.1

    nameserver 2405:201:4003:80cc::c0a8:1d01

    ```


    To check interfaces you have, you need to use the Network Manager:


    ```bash

    $ nmcli con show

    ```


    ```

    NAME    UUID                                     TYPE               DEVICE

    enp0s3                                        enp0s3

    ```


    We have the ethernet interface and another bridge interface created by Virtual
    Machine software.


    To see the DNS settings of each interface, use the commands:


    ```bash

