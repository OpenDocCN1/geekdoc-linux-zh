    # How to work with text files on Linux?


    A text file is an ASCII file, to identify a text file, you need to use the `file`
    command.


    For example:


    ```bash

    file hosts

    ```


    hosts: ASCII text


    Now, consider the file `fox.txt` which has the following content:


    ```bash

    $ cat fox.txt

    The quick brown fox jumps over the lazy dog

    The quick brown fox jumps over the lazy dog

    The quick brown fox jumps over the lazy dog

    The quick brown fox jumps over the lazy dog

    The quick brown fox jumps over the lazy dog

    ```


    If you want to replace the word `lazy` with `clever` you can do it using the `sed`
    command.


    ```bash

    $ sed -i ''s/lazy/clever/g'' fox.txt

    $ cat fox.txt

    The quick brown fox jumps over the clever dog

    The quick brown fox jumps over the clever dog

    The quick brown fox jumps over the clever dog

    The quick brown fox jumps over the clever dog

    The quick brown fox jumps over the clever dog

    ```


    Where `-i` stands for in-place replacement, `s` for substitution and `g` for global
    existence of `lazy`.


    # Can you provide an example of regular expressions?


    Regular expressions are used in the shell and programmatic level to match yet
    unknown characters/strings. It is a complicated subject, and you must study more
    books to understand it.


    The `^` indicates a pattern at the beginning of a line, for example it can be
    used in the following manner:


    ```bash

    # grep ^refresh_pattern squid.conf

    ```


    ```text

    refresh_pattern ^ftp:           1440    20%     10080

    refresh_pattern ^gopher:        1440    0%      1440

    refresh_pattern -i (/cgi-bin/|\?) 0       0%      0

    refresh_pattern .               0       20%     4320

    ```


    The `$` indicates pattern at the end, the `grep` command finds all the instances
    of `http` at the end of the line.


    ```bash

    # grep http$ squid.conf

    ```


    ```text

    acl Safe_ports port 80          # http

    acl Safe_ports port 488         # gss-http

    acl Safe_ports port 777         # multiling http

    ```


    # How to set a Static IP address on Linux?


    The first step that you need to do is identify the interface that you have using
    the following command:


    ```bash

    $ nmcli c

    ```


    ```text

    NAME    UUID                               TYPE      DEVICE

    enp0s3  7b1642d8-22e4-46f9-8f9d-c1b6d3c5bd42 ethernet enp0s3

    vir0    c9e04188-1c13-402e-9d0b-e0571725264 bridge vir0

    ```


    The interface name is `enp0s3`. Let us see more about `enp0s3` by the command:


    ```bash

    $ nmcli d show enp0s3

    ```


    ```text

    GENERAL.DEVICE:     enp0s3

    GENERAL.TYPE:       ethernet

    GENERAL.HWADDR:     08:00:27:92:4E:C

    GENERAL.MTU:        1500

    GENERAL.STATE:      100 (connected)

    GENERAL.CONNECTION:  enp0s3

    GENERAL.CON-PATH:   /org/freedesktop/NetworkManager/Active

    WIRED-PROPERTIES.CARRIER: on

    IP4.ADDRESS[1]:     192.168.29.32/24

    IP4.GATEWAY:        192.168.29.1

    IP4.ROUTE[1]:       dst = 0.0.0.0/0, nh = 192.168.29.1, mt

    IP4.ROUTE[2]:       dst = 192.168.29.0/24, nh = 0.0.0.0, mt

    IP4.DNS[1]:        192.168.29.1

    IP6.ADDRESS[1]:     2405:201:4003:80cc:9c47:139c:3724:4bf/64

    IP6.ADDRESS[2]:     fe80::fd7c:3d3f:2a54:d54f/64

    IP6.GATEWAY:        fe80::e626:86ff:fe1e:c77c

    IP6.ROUTE[1]:       dst = 2405:201:4003:80cc::64, nh = ::

    IP6.ROUTE[2]:       dst = ::/0, nh = fe80::e626:86ff:fe1e:c77c

    IP6.ROUTE[3]:       dst = fe80::/64, nh = ::, mt = 100

    IP6.ROUTE[4]:       dst = ff00::/8, nh = ::, mt = 256

    IP6.DNS[1]:        2405:201:4003:80cc::0a8:1d1

    ```


    Instead of getting the IP4 address from the DSL modem, it would be set manually,
    we have all the information we need to set the static IP from the above command:


    ```text

    IP4.ADDRESS[1]:     192.168.29.32/24

    IP4.GATEWAY:        192.168.29.1

    IP4.DNS[1]:        192.168.29.1

    ```


    Login as root or use `SUDO` and enter the following command:


    ```bash

    # nmcli mod enp0s3 ipv4.method manual ipv4.addresses 192.168.29.32/24 ipv4.gateway
    192.168.29.1 ipv4.dns 192.168.29.1

    ```


    Now, we can confirm that the setting is done manually using the following command.


    ```bash

    # nmcli c show enp0s3 | grep ipv4

    ```


    ```text

    ipv4.method:           manual

    ipv4.dns:              192.168.29.1

    ipv4.dns-search:       --

    ipv4.dns-options:      --

    ipv4.dns-priority:      0

    ipv4.addresses:         192.168.29.32/24

    ipv4.gateway:          192.168.29.1

    ipv4.routes:            --

    ipv4.route-metric:      -1

