    What do I do with DNS on Linux?


    If you are a system administartor or anyone who is in-charge of your Linux systems
    for your home office or small business. You have to know about the DNS settings
    on the Linux systems ( for that matter even on your Windows Systems).


    It is the translating protocol that translates your domainname such  [www.foo.com](http://www.foo.com/)
     to an IP address.


    To check if your system is configured correctly, here are some of the DNS troubleshooting
    commands that would be handy to you.


    The host command translates the  [www.yahoo.com](http://www.yahoo.com/)  to its
    corresponding IP address, specific to my region.


    $host  [www.yahoo.com](http://www.yahoo.com/)


    The expected result is


    $ host  [www.yahoo.com](http://www.yahoo.com/)


    [www.yahoo.com](http://www.yahoo.com/)  is an alias for  [new-fp-shed.wg1.b.yahoo.com](http://new-fp-shed.wg1.b.yahoo.com/)
    .


    [new-fp-shed.wg1.b.yahoo.com](http://new-fp-shed.wg1.b.yahoo.com/)  has address
    202.165.107.50


    [new-fp-shed.wg1.b.yahoo.com](http://new-fp-shed.wg1.b.yahoo.com/)  has address
    202.165.107.49


    [new-fp-shed.wg1.b.yahoo.com](http://new-fp-shed.wg1.b.yahoo.com/)  has IPv6 address
    2406:2000:e4:1605::9001


    [new-fp-shed.wg1.b.yahoo.com](http://new-fp-shed.wg1.b.yahoo.com/)  has IPv6 address
    2406:2000:e4:1605::9000


    If there is a DNS issue, the expected result is


    ;; connection timed out; no servers could be reached.


    To check which DNS servers you have on your LINUX system, you need to see what
    your resolv.conf says:


    In my case it is 192.168.29.1 - which is the IP address of the Broadband DSL modem
    which provides me DNS services.


    $ cat /etc/resolv.conf


    # Generated by NetworkManager


    nameserver 192.168.29.1


    nameserver 2405:201:4003:80cc::c0a8:1d01


    To check the interfaces you have, you need to use the Network Manager:


    $ nmcli con show


    NAME    UUID                                  TYPE      DEVICE


    enp0s3  7b1642d8-222e-46f9-8f9d-c1b6d3c5bd42  ethernet  enp0s3


    virbr0  c9e04188-1c13-402e-9d0b-e05751725264  bridge    virbr0


    We have the ethernet interface and another bridge interface created by the Virtual
