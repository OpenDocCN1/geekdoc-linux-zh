    \n# Dedication\nThis book is dedicated to Ms. Sujata Biswas who passed because\
    \ of Covid. Each day that passes without her is a torture. She remains an inspiration\
    \ behind this fledging publishing house.\n\n# Interactive Book\nThis is an on-going\
    \ project and if you wish to add any questions to this FAQ, we will add your content\
    \ and republish the book repeatedly. You can send your queries/questions/suggestions\
    \ to `bookreviewer25@gmail.com`.\n\n# Introduction\nThe method used is unique\
    \ and favored in the corporate world. Instead of long chapters and sections with\
    \ information that is useless at critical times, you have access to pertinent\
    \ questions - collected over 3 decades of IT experience and gives you immediate\
    \ answers.\n\n# How do I create SUDO users on Linux?\nBefore learning how to create\
    \ SUDO users, why do not we revise concepts of creating ordinary users and groups.\n\
    \nYour task to create new users on recently procured Linux box. The users that\
    \ would access the system are Helen, Leena, and Tony – who belong to the DevOps\
    \ group. You need to create a group as well, which would name, most imaginatively,\
    \ as `devops`. The users would be the members of the `devops` group.\n\n### Step\
    \ 1: Adding users –\n```bash\n# useradd helen\n# useradd leena\n# useradd tony\n\
    ```\nNote: Login as `ROOT`.\n\n### Step 2: Creating a group called `devops` –\n\
    ```bash\n# groupadd devops\n```\nWhen you create the users, they are members of\
    \ their groups. We can add `devops` as a supplementary group.\n\n### Step 3: The\
    \ command you use is `usermod` –\n```bash\n# usermod -aG devops helen\n# usermod\
    \ -aG devops leena\n# usermod -aG devops tony\n```\n\n### Step 4: To check the\
    \ group memberships of each user, use the command `id` –\n```bash\n# id leena\n\
    uid=1003(leena) gid=1003(leena) groups=1003(leena),1005(devops)\n\n# id tony\n\
    uid=1004(tony) gid=1004(tony) groups=1004(tony),1005(devops)\n\n# id helen\nuid=1002(helen)\
    \ gid=1002(helen) groups=1002(helen),1005(devops)\n```\nAs you can each user is\
    \ a member of the supplementary group `devops`.\n\nIf you want to LOCK a particular\
    \ user - he is on leave/or left the organziation. You can use the command:\n```bash\n\
    # usermod -L tony\n```\nAll users must NOT be given elevated privileges; however,\
    \ you cannot do all the tasks yourself so you must delegate some work to chosen\
    \ users to perform some jobs. If such users need to perform tasks that require\
    \ administrative privileges, then they can use the `SUDO` command. And you should\
    \ create SUDO users.\n\nTo check the SUDO configuration file using the command\
    \ `visudo` and look at a particular line. It is a long file.\n\nThis line means\
    \ that members of the group `wheel` can run all commands.\n```\n%wheel  ALL=(ALL)\
    \ ALL\n```\nCreate a user called `rosie` –\n```bash\n# useradd rosie\n```\nLogin\
    \ as `rosie` using the command to access her shell:\n```bash\n$ su – rosie\n```\n\
    Try to read the shadow file in the `/etc` directory. The shadow files contain\
    \ the encrypted passwords.\n```bash\n$ cat /etc/shadow\n```\n`cat: /etc/shadow:\
    \ Permission denied`\n\nThis line means that members of the group `wheel` can\
    \ run all commands.\n```\n%wheel  ALL=(ALL) ALL\n```\nCreate a user called `rosie`\
    \ –\n```bash\n# useradd rosie\n```\nLogin as `rosie` using the command to access\
    \ her shell:\n```bash\n$ su – rosie\n```\nTry to read the shadow file in the `/etc`\
    \ directory. The shadow files contain the encrypted passwords.\n```bash\n$ cat\
    \ /etc/shadow\n```\n`cat: /etc/shadow: Permission denied`\n\nThis line means that\
    \ members of the group `wheel` can run all commands.\n```\n%wheel  ALL=(ALL) ALL\n\
    ```\nCreate a user called `rosie` –\n```bash\n# useradd rosie\n```\nLogin as `rosie`\
    \ using the command to access her shell:\n```bash\n$ su – rosie\n```\nTry to read\
    \ the shadow file in the `/etc` directory. The shadow files contain the encrypted\
    \ passwords.\n```bash\n$ cat /etc/shadow\n```\n`cat: /etc/shadow: Permission denied`\n\
    \nThis line means that members of the group `wheel` can run all commands.\n```\n\
    %wheel  ALL=(ALL) ALL\n```\nCreate a user called `rosie` –\n```bash\n# useradd\
    \ rosie\n```\nLogin as `rosie` using the command to access her shell:\n```bash\n\
    $ su – rosie\n```\nTry to read the shadow file in the `/etc` directory. The shadow\
    \ files contain the encrypted passwords.\n```bash\n$ cat /etc/shadow\n```\n`cat:\
    \ /etc/shadow: Permission denied`\n\nThis line means that members of the group\
    \ `wheel` can run all commands.\n```\n%wheel  ALL=(ALL) ALL\n```\nCreate a user\
    \ called `rosie` –\n```bash\n# useradd rosie\n```\nLogin as `rosie` using the\
    \ command to access her shell:\n```bash\n$ su – rosie\n```\nTry to read the shadow\
    \ file in the `/etc` directory. The shadow files contain the encrypted passwords.\n\
    ```bash\n$ cat /etc/shadow\n```\n`cat: /etc/shadow: Permission denied`\n\nThis\
    \ line means that members of the group `wheel` can run all commands.\n```\n%wheel\
    \  ALL=(ALL) ALL\n```\nCreate a user called `rosie` –\n```bash\n# useradd rosie\n\
    ```\nLogin as `rosie` using the command to access her shell:\n```bash\n$ su –\
    \ rosie\n```\nTry to read the shadow file in the `/etc` directory. The shadow\
    \ files contain the encrypted passwords.\n```bash\n$ cat /etc/shadow\n```\n`cat:\
    \ /etc/shadow: Permission denied`\n\n*(Note: The input text contained significant\
