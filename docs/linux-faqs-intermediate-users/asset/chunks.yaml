    # 如何在 Linux 上创建目录结构？

    您将学习关于 BASH 花括号扩展。例如，以下命令是一个在一个基础目录下创建子目录的快速方法。这里基础目录是 `jupiter`。不要忘记斜杠，否则结果将会不同。


    '
- fmt: "\n```bash\n$ mkdir -p jupiter/{Io,Europa,Ganymede,Callisto}\n\n$ cd jupiter\n\
    \n$ ls -l\n\ntotal 0\ndrwxrwxr-x. 2 liza liza 6 Nov 16 15:04 Callisto\ndrwxrwxr-x.\
    \ 2 liza liza 6 Nov 16 15:04 Europa\ndrwxrwxr-x. 2 liza liza 6 Nov 16 15:04 Ganymede\n\
    drwxrwxr-x. 2 liza liza 6 Nov 16 15:04 Io\n```\n\nYou should learn to create empty\
    \ files using the `touch` command. It is a nice way to test for permission related\
    \ errors.\n\n```bash\n$ touch hello123\n```\n\n# How do I work with compressed\
    \ files?\n\nThe compressed files have common usage among the Linux users. If someone\
    \ must send you a log for troubleshooting, she will invariably compress the logs\
    \ using the `tar` command to decrease the byte size of the log. If she uses the\
    \ `tar` command, the compressed file is called a tarball.\n\nLet us look at the\
    \ file `fox.txt`\n\n```bash\n$ ls -l fox.txt\n-rw-rw-r--. 1 liza liza 14859 Nov\
    \ 16 15:12 fox.txt\n```\n\nThe size is 14859 bytes.\n\nUsing the `gzip` to compress\
    \ the file.\n\n```bash\n$ gzip fox.txt\n$ ls -l\n\ntotal 4\n-rw-rw-r--. 1 liza\
    \ liza 139 Nov 16 15:12 fox.txt.gz\n```\n\nThe file is now only 139 bytes. Wow!\n\
    \nTo unzip, use the following command:\n\n```bash\n$ gunzip fox.txt.gz\n```\n\n\
    There is another compression command that you can use, which is `bzip2`.\n\n```bash\n\
    $ bzip2 fox.txt\n$ ls -l\n\ntotal 4\n-rw-rw-r--. 1 liza liza 149 Nov 16 15:12\
    \ fox.txt.bz2\n```\n\nTo unzip the command is `bunzip2`.\n\nThere is another newer\
    \ compression command called `xz`.\n\n```bash\n$ xz fox.txt\n$ ls -l\n\ntotal\
    \ 4\n-rw-rw-r--. 1 liza liza 164 Nov 16 15:12 fox.txt.xz\n```\n\nThe decompression\
    \ command is `unxz`.\n\nThe compression is done by these three compromission algorithms\
    \ and not by `tar`.\n\nCreating a tarball with `gunzip`:\n```bash\ntar -cvzf fox.tar.gz\
    \ fox.txt\n```\n\nCreating a tarball with `bzip2`:\n```bash\ntar -cvjf fox.tar.bz2\
    \ fox.txt\n```\n\nCreating a tarball with `xz`:\n```bash\ntar -cvJf fox.tar.xz\
    \ fox.txt\n```\n\nNote:\nPlease do not go by my compression results, as I have\
    \ used a small sized file. Your results would be much better.\n\n# Can you explain\
    \ about file/directory permissions?\n\nMany people leave their organizations but\
    \ forget to disclose the directory and file permissions and group members would\
    \ not be able to access those directories.\n\nPlease see the following example,\
    \ the user `prabal` has left the organization but the common directory is owned\
    \ by him. And there is no permission for the group or the world. When the user\
    \ `liza` tries to access the directory, she is not able to.\n\n```bash\n$ ls -l\n\
    total 0\ndrwx------. 2 prabal prabal 6 Nov 16 15:53 common\n\n$ cd common\n-bash:\
    \ cd: common: Permission denied\n```\n\nWhat you need to do is give the directory\
    \ `777` permission and `liza` will be able to access the directory.\n\nAs root:\n\
    ```bash\n# chmod 777 common/\n```\n\nAs `liza`, as you can see she is able to\
    \ access the directory.\n\n```bash\n$ pwd\n/opt/common\n\n$ id\nuid=1001(liza)\
    \ gid=1001(liza) groups=1001(liza) context=unconfined_u:unconfined_r:unconfined_t:s0-s0:c0.c1023\n\
    ```\n\nFor file permission, make sure you give `666` permissions for all files\
    \ in the `common` directory, but there is no executable permission.\n\n```bash\n\
    # chmod 666 * -R common\n```\n\nSee the content of `common` .\n```bash\n# ls -l\n\
    total 0\ndrwxr-xr-x. 2 root root 6 Nov 16 16:11 hello123\n```\n\nThe executable\
    \ permission should be removed using the following command:\n\n```bash\n# chmod\
    \ -x * -R\n# ls -l\ntotal 0\ndrw-r--r--. 2 root root 6 Nov 16 16:11 hello123\n\
    ```\n\n# What are symbolic links?\n\nSymbolic errors are common and can confuse\
    \ even experienced system administrators. There are two kinds of symbolic links\
    \ in Linux:\n\n1. Soft links\n2. Hard Links\n\nWhen you create a softlink to an\
    \ existing file, you create a different file. When you create a hardlink to an\
    \ existing, you create an exact clone of the file. Both the softlinks and hardlinks\
    \ are created using the `ln` command.\n\nCreating a softlink using the `ln` command\
    \ with `-s` flag:\n```bash\n$ ln -s /etc/hosts hosts\n```\n\nNow, perform a `ls\
    \ -l` command.\n```bash\n$ ls -l\ntotal 0\nlrwxrwxrwx. 1 liza liza 10 Nov 16 16:30\
    \ hosts -> /etc/hosts\n```\n\nThe `l` in the permission stack represents that\
    \ it is a symbolic LINK file. And there is the arrow pointing to the location\
    \ of the real file.\n\nYet, both the files whose contents are same, are also different.\
    \ If you see the inode number (a system that uniquely identifies a file on the\
    \ file system – sort of a social security number).\n\n```bash\n$ ls -i hosts\n\
    4525881 hosts\n\n$ ls -i /etc/hosts\n4358377 /etc/hosts\n```\n\nWhen you create\
    \ a hard link, you create an exact replica of the file. The symbolic had link\
    \ is created without the `-s` flag. Please note that a hard symbolic link cannot\
    \ TRAVERSE a different file system on the same system. While a soft symbolic link\
    \ CAN.\n\n```bash\n# ln /etc/passwd passwd\n# ls -i passwd\n4527544 passwd\n#\
    \ ls -i /etc/passwd\n4527544 /etc/passwd\n```\n\nAs you can see both share the\
    \ same inode number of `4527544`.\n\n# What is a Linux BASH shell environment?\n\
    \nThe shell is an interface between you and the system. It is a black hole of\
    \ information that may take a lifetime to master as the changes are rapid. In\
    \ the Linux world everything is a file. Which means a hardware device such as\
    \ a Tape Drive to Linux it is merely a file to write to or perform other actions.\n\
    \nThe `BASH` or (Bourne Again Shell) is the default shell in many Linux distributions\
    \ (like different Windows editions).\n\n# How to create an alias in the Linux\
    \ Bash Shell environment? Or how to create my own Linux command?\n\nAn alias can\
    \ be defined as a DOS batch file method to a command. Or creating a new personalized\
    \ command for yourself. Let us create a command for the Squid Proxy server running\
    \ on the system. We would call this alias as `proxystat`.\n\n```bash\n$ echo alias\
    \ 'proxystat=\"service squid status\"' >> ~/.bashrc\n```\n\nThe command alias\
    \ is used to create a new command called `proxystat` that means `service squid\
    \ status` and is appended to the `.bashrc` file. This file should be present in\
    \ your home directory and is one of the files to help create a personalized environment\
    \ for you. If you do not have the `.bashrc` file in your home, create one using\
    \ the `touch` command:\n\nYou must be in `$HOME`.\n\n```bash\n$ touch .bashrc\n\
    ```\n\nWe need to refresh the environment by sourcing the `.bashrc` file so that\
    \ the command `proxystat` is known to your environment. This can be done using\
    \ the `source` command.\n\n```bash\n$ source .bashrc\n```\n\nNow, run your own\
    \ command `proxystat`.\n\n```bash\n$ proxystat\nRedirecting to /bin/systemctl\
    \ status squid.service\n● squid.service - Squid caching proxy\n    Loaded: loaded\
    \ (/usr/lib/systemd/system/squid.service; disabled; vendor preset: disabled)\n\
    \    Active: active (running) since Mon 2021-11-15 14:00:37 IST; 20h ago\n   \
    \ Process: 9959 ExecStart=/usr/sbin/squid $SQUID_OPTS -f $SQUID_CONF (code=exited,\
    \ status=0/SUCCESS)\n    Process: 9954 ExecStartPre=/usr/libexec/squid/cache_swap.sh\
    \ (code=exited, status=0/SUCCESS)\n    Main PID: 9962 (squid)\n    CGroup: /system.slice/squid.service\n\
    \      ├9962 /usr/sbin/squid -f /etc/squid.conf\n      ├9964 (squid-1) -f /etc/squid.conf\n\
    \      └9965 (logfile-daemon) /var/log/squid/access.log\n```\n\n# How to create\
    \ a simple function on the Linux shell environment?\n\nTo create a simple function\
    \ that tells you much space a directory has occupied, we would employ `$1` which\
    \ is a positional parameters and is the first placeholder after the command name\
    \ and the command `du -h` which gives us the space details.\n\nThe following lines\
    \ have to be added to your `.bashrc` file:\n\n```bash\nfunction spaceinfo()\n\
    {\n    du -h /home/$1;\n}\n```\n\nNow, you need to source the `.bashrc` file.\
    \ The name of the function is `spaceinfo`.\n\n```bash\n$ source .bashrc\n$ spaceinfo\
    \ liza\n4.0K  /home/liza/.ssh\n8.0K  /home/liza/interns\n0     home/liza/p3\n\
