    ### How do I monitor network access on my environment?


    You would need to monitor network traffic between two nodes. It is more common
    than you think during the COVID era when everyone is using VPN. So if you are
    working from home and suffering from slow application response (particularly the
    applications that rely on TCP/IP''s client/server methodology).


    Consider system A which CentOS 7 and system B which is CentOS 8. We would send
    traffic using `nc` command over a TCP port `5000` (you can use other free TCP
    ports on your systems as well). And the free monitoring tool `iptraf` would capture
    the traffic for you to analyze. Install `iptraf-ng` and `nc` on both servers:


    ```bash

    # yum install iptraf-ng nc own```


    Configure the `iptraf` utility:


    Start `iptraf` using the command:


    ```bash

    #iptraf-ng

    ```


    **NOTE:** I have selected the interface `enp0s3`. Please note that logging is
    off by default, and you need to make it on. Go to configure and toggle `L` to
    enable logging to ON. Now, go select the interface and put the logs in a directory
    of your choice.


    To generate useful traffic, start `netcat` on server A on port `5000`:


    ```bash

    # nc -l 5000

    ```


    And go over to server B and start talking to this system via `netcat`:


    ```bash

    nc 192.168.29.182 5000

    ```


    The IP address is of the Server A. Generate some traffic by saying "hello" etc.


    Now if you `grep` the log for `5000`, you would see something like:


