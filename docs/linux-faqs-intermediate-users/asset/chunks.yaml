    # Introduction


    The method used is unique and favored in the corporate world. Instead of long
    chapters and sections with information that is useless at critical times, you
    have access to pertinent questions - collected over 3 decades of IT experience
    and gives you immediate answers.


    # How do I create SUDO users on Linux?


    Before learning how to create SUDO users, why do not we revise concepts of creating
    ordinary users and groups.


    Your task to create new users on recently procured Linux box. The users that would
    access the system are Helen, Leena, and Tony – who belong to the DevOps group.
    You need to create a group as well, which would name, most imaginatively, as devops.
    The users would be the members of the devops group.


    Step1:


    Adding users –


    # useradd helen


    # useradd leena


    # useradd tony


    Note:


    Login as ROOT.


    Step 2:


    Creating a group called devops –


    # groupadd devops


    When you create the users, they are members of their groups. We can add devops
    as a supplementary group.


    Step 3:


    The command you use is usermod –


    # usermod -aG devops helen


    # usermod -aG devops leena


    # usermod -aG devops tony


    Step 4:


    To check the group memberships of each user, use the command id –


    # id leena


    uid=1003(leena) gid=1003(leena) groups=1003(leena),1005(devops)


    # id tony


    uid=1004(tony) gid=1004(tony) groups=1004(tony),1005(devops)


    # id helen


    uid=1002(helen) gid=1002(helen) groups=1002(helen),1005(devops)


    As you can each user is a member of the supplementary group devops .


    If you want to LOCK a particular user - he is on leave/or left the organziation.
    You can use the command:


    # usermod -L tony


    All users must NOT be given elevated privileges; however, you cannot do all the
    tasks yourself so you must delegate some work to chosen users to perform some
    jobs. If such users need to perform tasks that require administrative privileges,
    then they can use the SUDO command. And you should create SUDO users.


    To check the SUDO configuration file using the command visudo and look at a particular
    line. It is a long file.


    This line means that members of the group wheel can run all commands.


    | ## Allows people in group wheel to run all commands%wheel  ALL=(ALL)       ALL
    |


    Create a user called rosie –


    # useradd rosie


    Login as rosie using the command to access her shell :


    $ su – rosie


    Try to read the shadow file in the /etc directory. The shadow files contain the
    encrypted passwords.


    $ cat /etc/shadow


    cat: /etc/shadow: Permission denied


    But rosie cannot read the shadow file.


    Recall that from the SUDO configuration file, that members of the wheel group
    can run all commands. Let us make rosie a member of the wheel group. You need
    to be root again.


    Making rosie a member of the wheel group.


    # usermod -aG wheel  rosie


    Checking if the rosie is indeed the member of the wheel group.


    # id rosie


    uid=1005(rosie) gid=1006(rosie) groups=1006(rosie),10(wheel)


    Remember to set rosie a password using the command –


    #passwd rosie


    Login as rosie –


    #su – rosie


    Now, rosie can read the shadow file.


    $ sudo cat /etc/shadow


    # How to use ssh without a password?


    The system lx-centos is the remote system.


    You are the user sujata (from the system centos8) want to connect ( ssh)  to the
    lx-centos without using a password.


    On the system centos8 and login as sujata:


    Step 1: Sanity check


    $ whoami


    sujata


    You must have a username by sujata in the second system for this learning procedure.


    Creating ssh key so that password is not required using ssh-keygen


    $ ssh-keygen


    Generating public/private rsa key pair.


    Enter file in which to save the key (/home/sujata/.ssh/id_rsa):


    Created directory ''/home/sujata/.ssh''.


    Enter passphrase (empty for no passphrase):


    Enter same passphrase again:


    Your identification has been saved in /home/sujata/.ssh/id_rsa.


    Your public key has been saved in /home/sujata/.ssh/id_rsa.pub.


    The key fingerprint is:


    SHA256:LaJnCHz9UvwmV+2dfnjRWR5k4255ZM17YLnSpLKo+Uk sujata@lx-centos8


    The key''s randomart image is:


    +---[RSA 3072]----+


    |                 |


    |               + |


    |              +oo|


    | .   . . .   .=o*|


    |  o . o S . .=o*B|


    |   o o + o..o.oO*|


    |    o + E.+o .oo=|


    |     o +.=.  o o|


    |      ooo      o.|


    +----[SHA256]-----+


    Then use the ssh-copy-id to the remote system in the following manner


    $ ssh-copy-id sujata@192.168.29.182


    Where 192.168.29.182 is the IP address of the remote system. You would get the
    similar message. You need to provide the password for the first time.


    $ ssh-copy-id sujata@192.168.29.182


    /usr/bin/ssh-copy-id: INFO: Source of key(s) to be installed: "/home/sujata/.ssh/id_rsa.pub"


    The authenticity of host ''192.168.29.182 (192.168.29.182)'' can''t be established.


    ECDSA key fingerprint is SHA256:np80a07ru0Ll2CvH8cVcFtTXVLx1RnftoONS1OL0cJQ.


    Are you sure you want to continue connecting (yes/no/[fingerprint])? yes


    /usr/bin/ssh-copy-id: INFO: attempting to log in with the new key(s), to filter
    out any that are already installed


    /usr/bin/ssh-copy-id: INFO: 1 key(s) remain to be installed -- if you are prompted
    now it is to install the new keys


    sujata@192.168.29.182''s password:


    Number of key(s) added: 1


    Now try logging into the machine, with:   "ssh ''sujata@192.168.29.182''"


    and check to make sure that only the key(s) you wanted were added.


    Now, you can use ssh to the remote system without using any password:


    $ ssh  sujata@192.168.29.182


    Last login: Wed Nov 17 09:11:15 2021


    $ hostname


    lx-centos


