  raw: '$ mkdir -p jupiter/{Io,Europa,Ganymede,Callisto}


    $ cd jupiter


    $ ls -l


    total 0


    drwxrwxr-x. 2 liza liza 6 Nov 16 15:04 Callisto


    drwxrwxr-x. 2 liza liza 6 Nov 16 15:04 Europa


    drwxrwxr-x. 2 liza liza 6 Nov 16 15:04 Ganymede


    drwxrwxr-x. 2 liza liza 6 Nov 16 15:04 Io


    You should learn to create empty files using the touch command. It is a nice way
    to test for permission related errors.


    $ touch hello123


    # How do I work with compressed files?


    The compressed files have common usage among the Linux users. If someone must
    send you a log for troubleshooting, she will invariably compress the logs using
    the tar command to decrease the byte size of the log. If she uses the tar command,
    the compressed file is called a tarball.


    Let us look at the file fox.txt


    $ ls -l fox.txt


    -rw-rw-r--. 1 liza liza 14859 Nov 16 15:12 fox.txt


    The size is 14859 bytes.


    Using the gzip to compress the file.


    $ gzip fox.txt


    $ ls -l


    total 4


    -rw-rw-r--. 1 liza liza 139 Nov 16 15:12 fox.txt.gz


    The file is now only 139 bytes. Wow!


    To unzip, use the following command:


    $ gunzip fox.txt.gz


    There is another compression command that you can use, which is bzip2 .


    $ bzip2 fox.txt


    $ ls -l


    total 4


    -rw-rw-r--. 1 liza liza 149 Nov 16 15:12 fox.txt.bz2


    To unzip the command is bunzip2 .


    There is another newer compression command called xz .


    $ xz fox.txt


    $ ls -l


    total 4


    -rw-rw-r--. 1 liza liza 164 Nov 16 15:12 fox.txt.xz


    The decompression command is unxz .


    The compression is done by these three compromission algorithms and not by tar.


    Creating a tarball with gunzip


    tar -cvzf fox.tar.gz fox.txt


    Creating a tarball with bzip2


    tar -cvjf fox.tar.bz2 fox.txt


    Creating a tarball with xz


    tar -cvJf fox.tar.xz fox.txt


    Note:


    Please do not go by my compression results, as I have used a small sized file.
    Your results would be much better.


    # Can you explain about file/directory permissions?


    Many people leave their organizations but forget to disclose the directory and
    file permissions and group members would not be able to access those directories.


    Please see the following example, the user prabal has left the organization but
    the common directory is owned by him. And there is no permission for the group
    or the world.


    When the user liza tries to access the directory, she is not able to.


    $ ls -l


    total 0


    drwx------. 2 prabal prabal 6 Nov 16 15:53 common


    $ cd common


    -bash: cd: common: Permission denied


    What you need to do is give the directory 777 permission and liza will be able
    to access the directory.


    As root:


    # chmod 777 common/


    As liza, as you can see she is able to access the directory.


    $ pwd


    /opt/common


    $ id


    uid=1001(liza) gid=1001(liza) groups=1001(liza) context=unconfined_u:unconfined_r:unconfined_t:s0-s0:c0.c1023


    For file permission, make sure you give 666 permissions for all files in the common
    directory, but there is no executable permission.


    # chmod 666 * -R common


    See the content of common .


    # ls -l


    total 0


    drwxr-xr-x. 2 root root 6 Nov 16 16:11 hello123


    The executable permission should be removed using the following command:


    # chmod -x * -R


    # ls -l


    total 0


    drw-r--r--. 2 root root 6 Nov 16 16:11 hello123


    # What are symbolic links?


    Symbolic errors are common and can confuse even experienced system administrators.


    There are two kinds of symbolic links in Linux:


    1)      Soft links


    2)      Hard Links


    When you create a softlink to an existing file, you create a different file.


    When you create a hardlink to an existing, you create an exact clone of the file.


    Both the softlinks and hardlinks are created using the ln command.


    Creating a softlink using the lm command with -s flag


    $ ln -s /etc/hosts hosts


    Now, perform a ls -l command.


    $ ls -l


    total 0


    lrwxrwxrwx. 1 liza liza 10 Nov 16 16:30 hosts -> /etc/hosts


    The l in the permission stack represents that it is symbolic LINK file. And there
    is the arrow pointing to the location of the real file.


    Yet, both the files whose contents are same, are also different. If you see the
    inode number ( a system that uniquely identifies a file on the file system – sort
    of a social security number).


    $ ls -i hosts


    4525881 hosts


    $ ls -i /etc/hosts


    4358377 /etc/hosts


    When you create a hard link, you create an exact replica of the file. The symbolic
    had link is created without the -s flag. Please note that a hard symbolic link
    cannot TRAVERSE a different file system on the same system. While a soft symbolic
    link CAN.


    # ln /etc/passwd passwd


    # ls -i passwd


    4527544 passwd


    # ls -i /etc/passwd


    4527544 /etc/passwd


    As you can see both share the same inode number of 4527544.


    What is a Linux BASH shell environment?


    The shell is an interface between you and the system. It is a black hole of information
    that may take a lifetime to master as the changes are rapid. In the Linux world
    everything is a file. Which means a hardware device such as a Tape Drive to Linux
    it is a merely a file to write to or perform other actions.


    The BASH or (Bourne Again Shell) is the default shell in many Linux distributions
    (like different Windows editions).


    How to create an alias in the Linux Bash Shell environment? Or how to create my
    own Linux command?


    An alias can be defined as a DOS batch file method to a command. Or creating a
    new personalized command for yourself. Let us create a command for the Squid Proxy
    server running on the system. We would call this alias as proxystat .


    $ echo alias ''proxystat="service squid status"'' >> ~/.bashrc


    The command alias is used to create a new command called proxystat that means
    service squid status and is appended to the .bashrc file. This file should be
    present in your home directory and is one of the files to help create a personalized
    environment for you. If you do not have the .bashrc file in your home, create
    one using the touch command:


    You must be in $HOME .


    $ touch .bashrc


    We need to refresh the environment by sourcing the .bashrc file so that the command
    proxystat is known to your environment. This can be done using the source command.


    $ source .bashrc


    Now, run your own command proxystat .


    $ proxystat


    Redirecting to /bin/systemctl status squid.service


    ● squid.service - Squid caching proxy


       Loaded: loaded (/usr/lib/systemd/system/squid.service; disabled; vendor preset:
    disabled)


       Active: active (running) since Mon 2021-11-15 14:00:37 IST; 20h ago


      Process: 9959 ExecStart=/usr/sbin/squid $SQUID_OPTS -f $SQUID_CONF (code=exited,
    status=0/SUCCESS)


      Process: 9954 ExecStartPre=/usr/libexec/squid/cache_swap.sh (code=exited, status=0/SUCCESS)


     Main PID: 9962 (squid)


       CGroup: /system.slice/squid.service


               ├─9962 /usr/sbin/squid -f /etc/squid/squid.conf


               ├─9964 (squid-1) -f /etc/squid/squid.conf


               └─9965 (logfile-daemon) /var/log/squid/access.log


      How to create a simple function on the Linux Bash shell environment?


    To create a simple function that tells you much space a directory has occupied,
    we would employ $1 which is a positional parameters and is the first placeholder
    after the command name and the command du -h which gives us the space details.


    The following lines have to be added to your .bashrc file


    function spaceinfo()


    {


            du -h /home/$1;


    }


    Now, you need source the .bashrc file. The name of the function is spaceinfo.


    $ source .bashrc


    $ spaceinfo liza


    4.0K    /home/liza/.ssh


    8.0K    /home/liza/interns


    0       /home/liza/p3


    2.2M    /home/liza


