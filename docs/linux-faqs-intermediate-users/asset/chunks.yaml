    To confirm start the network service


    # systemctl restart NetworkManager.service


    Note: NetworkManager.service was restarted on RHEL 8.


    How do I see the status of the TCP port?


    The daemons are listener services that employ TCP ports to listen for client requests.
    A daemon is a background process.


    For example, Apache runs on port 80 and squid proxy server runs on 3128, if you
    need to verify if the TCP ports are active and in listening mode, you should use
    the following command:


    $ ss -lntp | grep :3128


    LISTEN     0      128         :::3128                    :::*


    This command means that squid is listening at port 3128.


    $ ss -lntp | grep :80


    This returns back to the prompt indicating that the Apache is not running on the
    system.


