    \n# 你能解释一下文件/目录权限吗？\n\n许多人离开组织时，忘记了交目录和文件权限，导致组成员无法访问这些目录。\n\n请看下例示例，用户 `prabal`\
    \ 已经离开了组织，但公共目录仍归他所有。而且组或其他人没有任何权限。当用户 `liza` 尝试访问该目录时，她无法进入。\n\n```bash\n$ ls\
    \ -l\ntotal 0\ndrwx------. 2 prabal prabal 6 Nov 16 15:53 common\n\n$ cd common\n\
    -bash: cd: common: Permission denied\n```\n\n你需要做的是赋予目录 `777` 权限，这样 `liza` 就能访问该目录。\n\
    \n作为 root：\n```bash\n# chmod 777 common/\n```\n\n作为 `liza`，你可以看到她能够访问该目录。\n\n\
    ```bash\n$ pwd\n/opt/common\n\n$ id\nuid=1001(liza) gid=1001(liza) groups=1001(liza)\
    \ context=unconfined_u:unconfined_r:unconfined_t:s0-s0:c0.c1023\n```\n\n对于文件权限，确保给\
    \ `common` 目录下的所有文件赋予 `666` 权限，但没有执行权限。\n\n```bash\n# chmod 666 * -R common\n\
    ```\n\n查看 `common` 的内容。\n```bash\n# ls -l\ntotal 0\ndrwxr-xr-x. 2 root root 6\
    \ Nov 16 16:11 hello123\n```\n\n应使用以下命令移除执行权限：\n\n```bash\n# chmod -x * -R\n#\
    \ ls -l\ntotal 0\ndrw-r--r--. 2 root root 6 Nov 16 16:11 hello123\n```\n\n# 什么是符号链接？\n\
    \n符号链接（Symbolic links）错误很常见，甚至能让经验丰富的系统管理员感到困惑。Linux 中有两种符号链接：\n\n1. 软链接 (Soft\
    \ links)\n2. 硬链接 (Hard Links)\n\n当你对现有文件创建软链接时，你创建了一个不同的文件。当你对现有文件创建硬链接时，你创建的是该文件的精确副本。软链接和硬链接都是使用\
    \ `ln` 命令创建的。\n\n使用带有 `-s` 标志的 `ln` 命令创建软链接：\n```bash\n$ ln -s /etc/hosts hosts\n\
    ```\n\n现在执行 `ls -l` 命令。\n```bash\n$ ls -l\ntotal 0\nlrwxrwxrwx. 1 liza liza 10\
    \ Nov 16 16:30 hosts -> /etc/hosts\n```\n\n权限位中的 `l` 代表它是一个符号**链接**文件。并且有一个指向真实文件位置的箭头。\n\
    \n然而，尽管这两个文件的内容相同，它们仍然是不同的。如果你查看 inode 节点号（一种在文件系统中唯一标识文件的系统——类似于社会安全号）。\n\n```bash\n\
    $ ls -i hosts\n4525881 hosts\n\n$ ls -i /etc/hosts\n4358377 /etc/hosts\n```\n\n\
    当你创建硬链接时，你创建的是文件的精确副本。硬符号链接是在带 `-s` 标志的情况下创建的。请注意，硬符号链接无法**跨越**同一系统上的不同文件系统。而软符号链接**可以**。\n\
    \n```bash\n# ln /etc/passwd passwd\n# ls -i passwd\n4527544 passwd\n# ls -i /etc/passwd\n\
    4527544 /etc/passwd\n```\n\n如你所见，它们共享相同的 inode 节点号 `4527544`。\n\n# 什么是 Linux BASH\
    \ shell 环境？\n\nShell 是你与系统之间的接口。它是一个信息黑洞，由于变化迅速，可能需要一一生才能精通。在 Linux 世界中，一切皆文件。这意味着硬件设备如磁带驱动对于\
    \ Linux 来说仅仅是一个可以写入或执行其他操作的文件。\n\n`BASH` 或 (Bourne Again Shell) 是许多 Linux 发行版（如不同的\
    \ Windows 版本）的默认 shell。\n\n# 如何在 Linux Bash Shell 环境中创建别名（alias）？或者如何创建我自己的 Linux\
    \ 命令？\n\n别名可以定义为命令的 DOS 批处理方法，或者为你创建一个新的个性化命令。让我们为系统中运行的 Squid 代理服务器创建一个命令。我们将此别命名为\
    \ `proxystat`。\n\n```bash\n$ echo 'proxystat=\"systemctl status\"' >> ~/.bashrc\n\
    ```\n\n别名是用于创建 `systemctl status` 命令的。这应该存在你的 `.bashrc` 文件中。通过 `touch` 命令在主目录下创建一个文件：\n\
    \n```bash\n$ touch .bashrc\n```\n\n我们需要通过 source `.bashrc` 来刷新环境，让 `systemctl\
    \ status` 命令被识别。\n\n```bash\n$ source .bashrc\n```\n\n现在运行你自己的命令 `proxystat`：\n\
    \n```bash\n$ proxystat\nRedirecting to /bin/systemctl status\n● squid.service\
    \ - Squid proxy\n    Loaded: loaded (/usr/lib/systemd/system/squid.service; disabled;\
    \ vendor preset: disabled)\n    Active: active (running) since Mon 2021-11-15\
    \ 14:00:37 IST; 20h ago\n    Process: 9959 ExecStart=/usr/sbin/squid $SQUID_OPTS\
    \ -f /etc/squid.conf (code=exited, status=0)\n    Process: 9954 ExecStart=/usr/libexec/squid/cache_swap.sh\
    \ (code=exited, status=0)\n    Main PID: 9962 (squid)\n    CGroup: /system.slice/squid.service\n\
    \      ├9962 /usr/sbin/squid -f /etc/squid.conf\n      ├9964 (squid-1) -f /etc/squid.conf\n\
    \      └9965 (logfile-daemon) /var/log/squid/access.log\n```\n\n# 如何在 Linux shell\
    \ 环境中创建函数？\n\n为了创建一个告诉你目录占用多少空间的简单函数，我们将使用 `$1`（它是位置参数，是命令后的第一个占位符）以及提供空间详情的 `du\
    \ -h` 命令。以下行必须添加到你的 `.bashrc` 文件中：\n\n```bash\nfunction spaceinfo()\n{\n    du\
    \ -h /home/$1;\n}\n```\n\n现在，你需要 source `.bashrc` 文件。函数的名称是 `spaceinfo`。\n\n```bash\n\
    $ source .bashrc\n$ spaceinfo liza\n4.0K  /home/liza/.ssh\n8.0K  /home/liza/interns\n\
    0     home/liza/p3\n2.2M  /home/liza\n```\n\n"
