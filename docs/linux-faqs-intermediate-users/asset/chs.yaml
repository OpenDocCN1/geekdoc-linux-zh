  \  enp0s3\n```\n\n激活设备是 `enp0s3`。\n\n### 第 3 \n\n对于你想要的信息，以下命令的输出提供了详细数据。\n\n```bash\n\
  $ nmcli d show enp0s3\n```\n\n```\nGENERAL.DEVICE:                         enp0s3\n\
