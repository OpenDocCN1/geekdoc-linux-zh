  ```\n\n## 我在 Linux 上如何处理 DNS？\n\n如果你是系统管理员，或者任何负责家庭办公室或小型企业 Linux 系统的人员。你必须了解 Linux\
  \ 系统上的 DNS 设置（即使在你的 Windows 系统上也是如此）。\n\n它是一种翻译协议，将你的域名（如 `www.foo.com`）翻译为 IP 地址。\n\
  \n要检查你的系统配置是否正确，这里有一些对你很有用的 DNS 故障排除命令。\n\n`host` 命令将 `www.yahoo.com` 翻译为对应的 IP\
  \ 地址，具体取决于我的地区。\n\n```bash\n$host www.yahoo.com\n```\n\n预期的结果是：\n\n```bash\n$ host\
  \ www.yahoo.com\n```\n\n`www.yahoo.com` 是 `new-fp-shed.wg1.b.yahoo.com` 的别名。\n`new-fp-shed.wg1.b.yahoo.com`\
  \ 有地址 `202.165.107.50`。\n`new-fp-shed.wg1.b.yahoo.com` 有地址 `202.165.107.49`。\n`new-fp-shed.wg1.b.yahoo.com`\
  \ 有 IPv6 地址 `2406:2000:e4:1605::9001`。\n`new-fp-shed.wg1.b.yahoo.com` 有 IPv6 地址\
  \ `2406:2000:e4:1605::9000`。\n\n如果存在 DNS 问题，预期的结果是连接超时；无法访问服务器。\n\n要检查你的系统上有哪些 DNS\
  \ 服务器，你需要查看 `/etc/resolv.conf` 的内容：在我的情况下，它是 `192.168.29.1`，这是提供 DNS 服务的宽带调制器的 IP\
  \ 地址。\n\n```bash\n$ cat /etc/resolv.conf\n```\n\n```\nGenerated by NetworkManager\n\
  nameserver 192.168.29.1\nnameserver 2405:201:4003:80cc::c0a8:1d01\n```\n\n要检查你拥有的接口，需要使用\
  \ Network Manager：\n\n```bash\n$ nmcli con show\n```\n\n```\nNAME    UUID      \
  \                               TYPE               DEVICE\nenp0s3              \
  \                          enp0s3\n```\n\n我们有一个以太网接口另一个由虚拟机软件创建的桥接接口。\n\n要查看每个接口的\
  \ DNS 设置，请使用命令：\n\n```bash\n$ nmcli -f ipv4.dns con show enp0s3\n```\n\n```bash\n\
  $ nmcli -f ipv4.dns con show virbr0\n```\n\n我们可以看到没有任何接口有任何 DNS 设置，要使用 DSL 服务器的\
  \ DNS 服务，请遵循以下步骤：\n\n1. 以 root 身份登录。\n2. 但请使用 `sudo`。\n\n```bash\n# nmcli con mod\
  \ \"enp0s3\" ipv4.dns \"192.168.29.1\"\n```\n\n检查接口 `enp0s3` 的 DNS 设置。\n\n```bash\n\
  # nmcli -f ipv4.dns con show enp0s3\n```\n\n```\nipv4.dns:     192.168.29.1\n```\n\
  \n重启服务使用命令：\n\n```bash\n#nmcli con up \"enp0s3\"\n```\n\n## 我如何监控网络访问？\n\n你需要监控两个节点之间的网络流量。在\
  \ COVID 时代，由于都在使用 VPN，这比你想象的要常见。如果你在家里工作并受到应用程序响应缓慢的困扰（特别是那些依赖 TCP/IP 客户端/服务器方法的应用程序）。\n\
  \n考虑系统 A 为 CentOS 7，系统 B 为 CentOS 8。我们将使用 `nc` 命令通过 TCP 端口 `5000` 发送流量（你也可以使用系统的其他\
  \ TCP 端口）。监控工具 `iptraf` 会为你捕获流量以便分析。在两个服务器上安装 `iptraf-ng` 和 `nc`：\n\n```bash\n#\
  \ yum install iptraf-ng nc\n```\n\n\n\n\n\n```\nTue Nov 16 12:07:40 2021; TCP; enp0s3;\
  \ 52 bytes; from [192.168.29.32:51294] to [192.168.29.182:5000] ; FIN sent; 5 packets,\
  \ 295 bytes, avg flow rate 0.06 kbps\n\nTue Nov 16 12:07:40 2021; TCP; enp0s3; 52\
  \ bytes; from [192.168.29.182:5000] to [192.168.29.32:51294] ; FIN acknowleged\n\
  \nTue Nov 16 12:07:40 2021; TCP; enp0s3; 52 bytes; from [192.168.29.182:5000] to\
  \ [192.168.29.32:51294] ; FIN sent; 5 packets, 278 bytes, avg flow rate 0.06 kbps\n\
  \nTue Nov 16 12:07:40 2021; TCP; enp0s3; 52 bytes; from [192.168.29.32:51294] to\
  \ [192.168.29.182:5000] ; FIN acknowleged\n```\n\n## 如何在 Linux 上操作文本文件？\n\n文本文件是一个\
  \ ASCII 文件，要识别文本文件，你需要使用 `file` 命令。\n\n例如：\n\n```bash\nfile hosts\n```\n\nhosts:\
  \ ASCII text\n\n现在，考虑 `fox.txt` 文件，其包含以下内容：\n\n```bash\n$ cat fox.txt\nThe quick\
  \ brown fox jumps over the lazy dog\nThe quick brown fox jumps over the lazy dog\n\
  The quick brown fox jumps over the lazy dog\nThe quick brown fox jumps over the\
  \ lazy dog\nThe quick brown fox jumps over the lazy dog\n```\n\n如果你想将单词 `lazy` 替换为\
  \ `clever`，可以使用 `sed` 命令来实现。\n\n```bash\n$ sed -i 's/lazy/clever/g' fox.txt\n$ cat\
  \ fox.txt\nThe quick brown fox jumps over the clever dog\nThe quick brown fox jumps\
  \ over the clever dog\nThe quick brown fox jumps over the clever dog\nThe quick\
  \ brown fox jumps over the clever dog\nThe quick brown fox jumps over the clever\
  \ dog\n```\n\n其中 `-i` 代表原地替换（in-place replacement），`s` 代表替换（substitution），`g` 代表\
  \ `lazy` 的全局存在（global existence）。\n\n## 你能提供一个正则表达式的示例吗？\n\n正则表达式用于 Shell 和编程层面，以匹配未知的字符/字符串。这是一个复杂的课题，你必须学习更多的书籍来理解它。\n\
  \n`^` 表示行开头的模式，例如它可以如下所示使用：\n\n```bash\n# grep ^refresh_pattern squid.conf\n```\n\
  \n```text\nrefresh_pattern ^ftp:           1440    20%     10080\nrefresh_pattern\
  \ ^gopher:        1440    0%      1440\nrefresh_pattern -i (/cgi-bin/|\\?) 0   \
  \    0%      0\nrefresh_pattern .               0       20%     4320\n```\n\n`$`\
  \ 表示行尾的模式，`grep` 命令找到所有行尾的 `http` 实例。\n\n```bash\n# grep http$ squid.conf\n```\n\
  \n```text\nacl Safe_ports port 80          # http\nacl Safe_ports port 488     \
  \    # gss-http\nacl Safe_ports port 777         # multiling http\n```\n\n## 如何在\
  \ Linux 上设置静态 IP 地址？\n\n你需要的第一步是使用以下命令识别你正在使用的接口：\n\n```bash\n$ nmcli c\n```\n\n\
  ```text\nNAME    UUID                               TYPE      DEVICE\nenp0s3  7b1642d8-22e4-46f9-8f9d-c1b6d3c5bd42\
  \ ethernet enp0s3\nvir0    c9e04188-1c13-402e-9d0b-e0571725264 bridge vir0\n```\n\
  \n接口名称是 `enp0s3`。让我们通过命令查看更多关于 `enp0s3` 的信息：\n\n```bash\n$ nmcli d show enp0s3\n\
  ```\n\n```text\nGENERAL.DEVICE:     enp0s3\nGENERAL.TYPE:       ethernet\nGENERAL.HWADDR:\
  \     08:00:27:92:4E:C\nGENERAL.MTU:        1500\nGENERAL.STATE:      100 (connected)\n\
  GENERAL.CONNECTION:  enp0s3\nGENERAL.CON-PATH:   /org/freedesktop/NetworkManager/Active\n\
  WIRED-PROPERTIES.CARRIER: on\nIP4.ADDRESS[1]:     192.168.29.32/24\nIP4.GATEWAY:\
  \        192.168.29.1\nIP4.ROUTE[1]:       dst = 0.0.0.0/0, nh = 192.168.29.1, mt\n\
  IP4.ROUTE[2]:       dst = 192.168.29.0/24, nh = 0.0.0.0, mt\nIP4.DNS[1]:       \
  \ 192.168.29.1\nIP6.ADDRESS[1]:     2405:201:4003:80cc:9c47:139c:3724:4bf/64\nIP6.ADDRESS[2]:\
  \     fe80::fd7c:3d3f:2a54:d54f/64\nIP6.GATEWAY:        fe80::e626:86ff:fe1e:c77c\n\
  IP6.ROUTE[1]:       dst = 2405:201:4003:80cc::64, nh = ::\nIP6.ROUTE[2]:       dst\
  \ = ::/0, nh = fe80::e626:86ff:fe1e:c77c\nIP6.ROUTE[3]:       dst = ff00/8, nh =\
  \ ::, mt = 256\nIP6.DNS[1]:        2405:201:4003:80cc::0a8:1d1\n```\n\n不是从 DHCP\
  \ 获取 IP 地址，而是手动设置，我们拥有通过上述命令设置静态 IP 信息：\n\n```text\nIP4.ADDRESS[1]:     192.168.29.32/24\n\
  IP4.GATEWAY:        192.168.29.1\nIP4.DNS[1]:        192.168.29.1\n```\n\n以 root\
  \ 身份登录或使用 `sudo` 并输入以下命令：\n\n```bash\n# nmcli mod enp0s3 ipv4.method manual ipv4.addresses\
  \ 192.168.29.32/24 ipv4.gateway 192.168.29.1 ipv4.dns 192.168.29.1\n```\n\n现在，我们可以使用以下命令确认设置已完成：\n\
  \n```bash\n# nmcli c show enp0s3 | grep ipv4\n```\n\n```text\nipv4.method:     \
  \      manual\nipv4.dns:              192.168.29.1\nipv4.dns-search:       --\n\
  ipv4.dns-options:      --\nipv4.dns-priority:      0\nipv4.addresses:         192.168.29.32/24\n\
  ipv4.gateway:          192.168.29.1\nipv4.routes:            --\nipv4.route-metric:\
  \      -1\nipv4.route-table:       0 (unspec)\nipv4.routing-rules:     --\nipv4.auto-routes:\
  \       --\nipv4.auto-dns:         --\nipv4.auto-method:      --\nipv4.auto-config:\
  \     --\nipv4.ignore-route:      --\nipv4.ignore-dns:       --\nipv4.ignore-method:\
  \    --\nipv4.ignore-config:    --\n```\n\n\n\n\n\nNov 19 19:46:31 lx-centos8 firewalld[162379]:\
  \ WARNING: AllowZoneDrifting is ena>\n\n检查防火墙设置的命令，输入以下命令：\n\n```bash\nfirewall-cmd\
  \ --list-all\n```\n\npublic (active)\n  target: default\n  icmp-block-inversion:\
  \ no\n  interfaces: enp0s3\n  sources:\n  services: cockpit dhcpv6-client ssh\n\
  \  ports:\n  protocols:\n  masquerade: no\n  forward-ports:\n  source-ports:\n \
  \ icmp-blocks:\n  rich rules:\n\nfirewalld 拥有多个 `ZONES`（区域），此信息涉及 `PUBLIC` 区域。我们看到\
  \ DHCP 客户端和 `ssh` 都在允许的服务之中。\n\n## 如何检查我的 Linux 机器上的本地解析？\n\n本地解析是指启用主机名/域名翻译为 IP\
  \ 地址的功能。为了实现这一点，我们需要检查 `/etc/nssswitch.conf` 文件，并确保你中已包含以下条目：\n\n```\nhosts: files\
  \ dns myhostname\n```\n\n这意味着解析将通过你的 `/etc/hosts` 文件进行。让我们打开 `/etc/hosts` 文件并添加条目：\n\
  \n```\n192.168.29.32 www.lx-centos8.com\n```\n\n如果解析完成，执行 ping 测试：\n\n```bash\n\
  ping www.lx-centos8.com\n```\n\n```\nPING www.lx-centos8.com (192.168.29.32) 56(84)\
  \ bytes of data.\n64 bytes from www.lx-centos8.com (192.168.29.32): icmp_seq=1 ttl=64\
  \ time=0.036 ms\n64 bytes from www.lx-centos8.com (192.168.29.32): icmp_seq=2 ttl=64\
  \ time=0.052 ms\n64 bytes from www.lx-centos8.com (192.168.29.32): icmp_seq=3 ttl=64\
  \ time=0.039 ms\n```\n\n"
