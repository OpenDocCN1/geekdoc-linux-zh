- pgno: 216
  md: '# 162 Part III: Special Topics


    Nessus is a free and open-source security scanner that is available from http://www.nexus.org/.
    This chapter provides a step-by-step example on how to write a vulnerability check
    plug-in for Nessus using NASL (Nessus Attack Scripting Language). Since NASL is
    specifically geared towards Nessus plug-ins, the development of these plug-ins
    easy and straightforward. A list of publicly available plug-ins for Nessus can
    be found at http://cgi.nessus.org/plugins/.


    Filenames of plug-ins written using NASL with the extension "nasl.\ Since NASL
    is an interpreted language, these files are also referred to as NASL "scripts".


    # RUNNING NASL SCRIPTS

    FROM THE COMMAND LINE


    Look in the plugins directory of your Nessus installation to find all the NASL
    scripts that come bundled with every Nessus distribution. NASL scripts can be
    run from the command line using the nasl interpreter.


    ```

    nasl -t target_ipaddress script.nasl

    ```


    # WRITING NESSUS PLUG-INS USING NASL


    In this section, we will look at an example of how to use NASL to write a vulnerability
    check plug-in. But first, we must come up with an example vulnerability to check
    against. Once we have identified the vulnerability, we can detect it using Nessus
    by writing an appropriate plug-in as described in the following paragraphs.


    # Example Vulnerability


    Web applications frequently use text files to store application information. For
    the purpose of our example, suppose a web application stores username and password
    information in a file such as /src/passwd.inc in the web server''s root directory.
    This situation would be considered a vulnerability if the web server running such
    an application were configured to serve .inc files. An external user could exploit
    such a vulnerability by requesting /src/passwd.inc from the web server in order
    to gain user passwords.'
  merge: -1
  img_proc: true
- pgno: 217
  md: "# The Plug-In\n\nThis section describes how to use Nessus to detect the presence\
    \ of the file /src/password.inc on a web server. First, we must write a NASL script\
    \ to do this. The script will serve as a Nessus “plug-in.” Here is what such a\
    \ script will look like:\n\n```\nif(description)\n  script_id(99999);\n  script_version(\"\
    $Revision: 1.0 $\");\n  script_name(english: \"Checks for /src/password.inc\"\
    );\n  desc[\"ENGLISH\"] = \"/src/password.inc is usually installed by XYZ algorithm\
    \ and contains user password information in clear text.\"\n```\n\nSolution: Configure\
    \ your web-browser to not serve .inc files.\n\nRisk factor : High;\n\n```\nscript_description(english:desc[\"\
    english\"]);\n  script_summary(english:\"Checks for the existence of /src/password.inc\"\
    );\n  script_category(ACT_GATHER_INFO);\n  script_copyright(english:\"This script\
    \ is Copyright (C)2003 Nitesh Dhanjani\");\n  script_family(english:\"CGI abuses\\\
    );\n  script_require_ports(\"Services/www\", 80);\n  exit(0);\n  include(\"http_func.inc\"\
    );\n  port = 80;\n```"
  merge: -1
  img_proc: true
- pgno: 218
