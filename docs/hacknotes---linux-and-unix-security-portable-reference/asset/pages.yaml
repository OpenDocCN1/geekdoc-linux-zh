- pgno: 128
  md: '# DNS (Domain Name System): 53 (TCP and UDP)


    DNS is a protocol used to translate between domain names and IP addresses.


    Spoofing Unlike TCP, UDP is not a connection-oriented protocol. This makes it
    easy to spoof UDP traffic. When a DNS queries a DNS server, the DNS server responds
    to the query by sending a UDP packet originating from port 53. However, a malicious
    user located on the same network segment or within the path to the DNS server
    could send a response back to the client with the source IP address of the DNS
    server. If the malicious user''s response is received by the client before the
    authentic DNS server, the malicious response will be accepted. Since the malicious
    user could craft a spoofed DNS response back to the client, he or may trick the
    client connecting into it or her host instead of the intended target.


    # Spoof DNS Responses


    The dnsspoof program, distributed among Dsniff, is a tool that facilitates the
    forging of DNS queries. For example, suppose an attacker has gained control of
    a network''s gateway with IP address 10.0.0.1. Let us assume that the real IP
    address of somecompanyexample.com is 10.1.1.2. The attacker can run dnsspoof and
    cause it to respond to all DNS queries for somecompanyexample.com with 192.168.1.1,
    the IP address of his or her machine.


    ```

    [gateway]# dnsspoof -i eth0 -f /etc/dnsniff.txt

    kernel filter, protocol ALL, raw packet socket

    dnsspoof: listening on eth1 [udp dst port 53 and not src 10.0.0.1]

    ```


    The attacker would need to make sure the contents of /etc/dnsniff.txt contain
    the following:


    192.168.1.1 somecompanyexample.com


    Now, in an attempt to identify the intruder, if the victim would perform a DNS
    query for somecompanyexample.com, he or she is pointed to the IP address of the
    hacker''s machine at 192.168.1.1 (instead of 10.1.1.2):


    ```

    [bash]$ host somecompanyexample.com

    somecompanyexample.com has address 192.168.1.1

    ```


    # DNSSEC


    Considering DNSSEC (DNS Security), an extension to DNS that provides for end-to-end
    authenticity. See http://www.dnssec.net/ for more information about DNSSEC.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Software Vulnerabilities BIND (Berkeley Internet Name Domain) is the most
    widely used DNS server on the Internet. The next paragraph documents a well-known
    BIND vulnerability.


    +   - BIND NXT Overflow and DOS Vulnerabilities This vulnerability was caused
    by BIND''s failure in processing input validation of NXT records. It is possible
    to remotely exploit this by forcing a vulnerable DNS server to fetch a meticulously
    crafted NXT record. Other DOS (Denial Of Service) vulnerabilities were also announced
    in the BIND advisory located at http://online.securityfocus.com/bid/788.


    Consider using djbdns as a replacement for BIND. The djbdns program is available
    at http://cr.yp.to/djbdns.html.


    # TFTP (Trivial File Transfer Protocol): 69 (UDP)


    TFTP is a UDP-based protocol used to transfer files. It lacks most features as
    authentication and directory listing. TFTP only supports reading and writing files
    from and to a remote server.


    Sniffing Since TFTP is a clear-text protocol, it is possible to sniff the data
    being transferred.


    # Sniff TFTP Data


    Suppose a user is TFTPing the /etc/passwd file from a remote host. A malicious
    user on the same segment as the user can sniff the victim''s data by running Ettercap
    configured to display UDP traffic:


    ```

    [shell]# aftercap -N -m -t udp


