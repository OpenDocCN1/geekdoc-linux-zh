  md: 'With this chapter you will learn to scan target hosts on a network, probe the
    ports they serve, and identify the versions of their operating systems. Once you
    are aware of what ports and operating systems exist on the target hosts, you can
    move on to the process of enumeration as described in the next chapter.


    Although many scanning tools are available, Nmap is the most robust and feature-featured
    scanner available to date. For the most part, we will make use of Nmap in the
