    # FILES /dev


    Devices are represented by special files in the /dev directory, and appropriate
    file permissions must be set on such files. Consider /dev/hda*, which represents
    IDE disks in Linux. If these files are readable by the world, malicious users
    will have read permissions to all data on the disks! Use the mount command to
    find out the /dev files associated with mounted drives on a system.


    In addition, ensure proper permissions are set on other device files, such as
    /dev/console, /dev/tty*, /dev/pty*, /dev/audio, and /dev/dsp*.


    # DISK PARTITIONS


    A malicious user may launch a denial of service attack by consuming all available
    disk space. Consider the following command:


    ```

    [bash]$ cat /dev/zero > /tmp/zero

    ^C

    ```'
