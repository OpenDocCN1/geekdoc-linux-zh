- pgno: 219
  md: '# Chapter 10: Nessus Attack Scripting Language (NASL) 65


    option is enabled, Nessus scans for vulnerabilities that are related to the applications
    running on the open ports of the target machine. script_require_ports function
    can be used to set the port that relates to the vulnerability on the remote machine,
    which in our case is set to www (HTTP).


    The functions just described set various values for the plug-in. Plug-ins descriptions
    can be viewed by double-clicking the appropriate plug-name in the list of plug-ins
    displayed in the Plugins tab of the Nessus GUI client. A screenshot of this appears
    as Figure 10-1.


    The http_func.inc file contains a list of useful HTTP functions for our convenience.
    We make use functions defined in the file, we have included in this file using
    the include function.


    The get_port_state function is used to check the status of a particular port on
    the target host. In our case, we check for port 80. If this port is closed, there
    is no point in going further, and therefore we call exit(0).


    In order to check for the presence of the /src/passwd.inc file on a web server,
    the HTTP request to the web server upon connect must be formatted like this:


    ```

    GET /src/passwd.inc HTTP/1.0

    ```


    ![](img/17cb132e62949dc7f5e0eadf90c71f51_219_0.png)


    Figure 10-1. Plug-in description as displayed by the Nessus GUI client'
