    applications and services are also susceptible to buffer overflow-attacks. For
    example, the "HP-UX IPCS Core File Buffer Overflow Vulnerability" was caused by
    improper bounds checking of core filenames. The ipcs program susceptible to this
    vulnerability could be exploited by local users to gain root privileges on the
    victim host. Details of this vulnerability are available at http://securityfocus.com/bid/7216.


    ![](img/17cb132e62949dc7f5e0eadf90c71f51_170_1.png)


    > Do not install the latest patches against local applications and services. See
    Chapter 9 for more information.


    # Improper Input Validation


    It is very important to perform input validation on programs that accept input
    parameters. Setuid programs execute with the privileges of the root user, and
    therefore a minor input validation flaw may allow a local user to execute commands
    with supervise privileges.


    As an example, consider the runpr utility, which was found to be vulnerable to
    privilege escalation due to an improper input validation condition. See http://securityfocus.com/bid/6077
    for details.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# Symbolic Links


    **Symbolic links** are special files that contain pathnames to other files. When
    a program attempts to access a file that is a symbolic link, the kernel transparently
    redirects the process to the filename the symbolic link refers to.


    Although symbolic links are a useful feature, they can be used to exploit vulnerable
    programs that do not check if the files being accessed are symbolic links. For
    example, the CDE Tooltalk symbolic link vulnerability, which failed to check if
    the log file being written to a symbolic link file. An attacker may create a symbolic
    link to /etc/shadow whose name and path are the same as those of the log created
    by Tooltalk. This will cause Tooltalk to write its log to /etc/shadow, causing
    its contents to become corrupted. If an attacker were successful in forcing specific
    contents to be written to sensitive files she could abuse these vulnerabilities
    to obtain elevated privileges. See http://securityfocus.com/bid/5083 for more
    details on the CDE Tooltalk vulnerability.


    # Core Dumps


    When a Unix or Linux system crashes, a “core” file is created by the operating
    system. This file contains information about the crashed process. Core files are
    used by developers to debug software. Since core files contain details about the
    crashed process, an intruder may purposefully exploit a known vulnerability in
    order to crash a running process to obtain sensitive information that may be placed
    in the core file.


    # Solaris FTP Core Dump Shadow File Recovery Vulnerability


    The FTP server distributed in older versions of Solaris was known to place parts
    of /etc/shadow in its core file when forced to crash using the following command:


    ```

    CWD ~

    ```


    After crashing the FTP server process using this command, the intruder may obtain
    the core file dumped in order to obtain parts of the /etc/shadow file. Here is
    a sample session that attempts to this:


    ```

    [bash]$ telnet 127.0.0.1 21

    Trying 127.0.0.1...

    Connected to 127.0.0.1.

    Escape character is ''^''.

    220 127.0.0.1 FTP server (SunOS 5.6) ready

    user joe

    331 Password required for joe.

    ```'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# 118 Part I: Hacking Techniques and Defenses


    pass wrongpassword

    530 Login incorrect.

    CWD ~

    530 Please login with USER and PASS.

    Connection closed by foreign host.


    ```

    [bash]$ strings /core | grep root

    root:$1PykBWI83bckLZ7CbBsPhXUCHlnoql:12241:0:99999:7::

    ```


    Once an intruder has access to the password hash of the root user, he or may use
    a tool such as John the Ripper to force-crack the password. Please see **securityfocus.com/bid/261**
    for more information about this Solaris FTP server vulnerability. See Chapter
    4 for more details on how to perform password cracking using John the Ripper.


    ![](img/17cb132e62949dc7f5e0eadf90c71f51_172_0.png)


    # Promptly Install Software Patches


    Software vendors often release patches to announced vulnerabilities. Make sure
    to install such patches before the vulnerabilities are exploited by malicious
    users.


    # Misconfigurations


    Frequently, administrators focus all their attention on hardening remote services.
    Negligence toward local services and applications may lead to various misconfigurations
    that allow local users to obtain higher privileges. For example, an administrator
    may purposely configure a database server running on the host to allow any user
    to connect with no password. Although a firewall prevents remote users from logging
    in to the database server, such a configuration may easily allow a local user
    to elevate privileges. Therefore, routine hardening and auditing of the configurations
    of local services and applications is strongly advised.


    # SUMMARY


    This chapter focused on techniques used by intruders to elevate their privileges
    to those of the root user. You learned of the dangers of trusting local users,
    improper file permissions, misconfigurations, and softwarevulnerabilities. After
    an intruder obtains root permissions, he or will have total control of the victim
    next. The intruder must hide his or her tracks, and plant Trojans and backdoors
    in order to ensure continued access. These topics are discussed in the following
    chapter.


    Remember to see Part II of this book for information on how to perform host hardening,
    which will help protect against many of the privilege escalation attacks presented
    in this chapter.'
  merge: -1
  img_proc: true
