    X Misconfigurations The xhost program is used to add and delete hostnames to the
    list of hosts allowed to make connections to an X server. This provides rudimentary
    privacy control and security.


    # Abuse Misconfigured X Servers


    Consider a user on 10.0.0.1 using xhost to allow connections from 192.168.1.3.


    ```

    [bash]$ xhost +192.168.1.3

