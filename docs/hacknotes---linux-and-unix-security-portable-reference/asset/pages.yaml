    \  send(socket:mysoc, data:hget);\n\n  myrec = http_recv(socket:mysoc);\n\n  http_close_socket(mysoc);\n\
    \n  if (!(\"404\") <> myrec)\n{\n  security_hole(port);\n}\n}\n```\n\nThe description\
    \ variable's value is set to 1 when the script is run by Nessus to extract summary\
