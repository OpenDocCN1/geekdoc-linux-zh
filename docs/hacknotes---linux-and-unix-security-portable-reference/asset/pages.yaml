    # Use Secure Protocols


    Do not use clear protocols such as FTP. Consider using HTTPS or SSH to perform
    secure file transfers.


    FTP Misconfigurations FTP clients and servers are susceptible to remote exploitation
    issues. The following paragraphs cover the most popular attacks against such misconfigurations.


    # Bounce Attacks


    Due to the design of the FTP protocol, when an FTP client requests a data transfer
    using “active” mode, the FTP server must initiate a connection back to a port
    on the FTP client. FTP clients use a PORT command with their IP address and listing
    number as parameters. If the FTP client issues a PORT command with the IP address
    of another host, the FTP server will attempt to connect to that host. Therefore,
    this feature of the FTP protocol can be used to proxy scans. You can perform such
    a scan by making use of nmap’s -b option.


    Once the PORT command is issued, a RET command can be executed by a malicious
    client to send files containing commands to the FTP server. This will cause the
    FTP server to dump the contents of the given file to a given port of the host
    specified by the PORT command. This file could contain SMTP commands, for example,
    enabling a malicious FTP client to proxy e-mails to the FTP server.


    # Prevent Bounce Attacks from Succeeding


    Make sure the following precautions have been taken in order to protect against
    FTP bounce attacks:


    +   - Configure your FTP server to refuse connections to IP addresses other than
    the client when a PORT command is issued. Most recent FTP servers do this by default.


    +   - Instruct your firewall not to allow incoming connections with a source port
    of 20. Note, though, that rule may block legitimate connections.'
