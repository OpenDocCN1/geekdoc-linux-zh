    # ACK


    This type of scan is mainly used to determine firewall rule sets. ACK packets
    are sent to the target host. If the target host does not respond or sends back
    an ICMP unreachable packet, then the port is likely being filtered by a firewall.
    If the target sends back a RST packet, then the port is not being filtered by
    a firewall.


    # ACK Scanning


    ACK scans can be performed by using nmap with the -sA flag.


    ```

    nmap -sA target_address

    ```'
