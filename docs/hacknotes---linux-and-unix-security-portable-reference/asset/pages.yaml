- pgno: 62
  md: '# Part I: Hacking Techniques and Defenses


    Usenet groups in order to ask for help on certain topics. Such postings may give
    away lots of information and alert an intruder to the fact that the administrator
    is having trouble configuring certain services. The site http://groups.google.com/
    can be used to search for such requests.


    # Defend Against Search Engine Exposure Vulnerabilities


    Enforcement of the following defensive tactics are strongly recommended in order
    to minimize the risks associated with exposure of sensitive information by search
    engines and web-server misconfigurations:


    +   - Do not advertise the availability of job positions in a manner that might
    expose administrative weaknesses relating to security.


    +   - It is a good idea to perform audits against your web-server configuration
    and the data it is allowed to serve. If you have access to the web server itself,
    then you can search for specific information from within the web root. For example,
    the following command will list the filenames containing the word "log":

    ls -aR /var/web-root/html | grep log


    Content within static data can also be searched. To search for a specific word,
    say "password," in the contents of files contained in the web root:


    ```

    grep -R password /var/web-root

    ```


    In case local access to the web server file system is not available, wget is a
    good command-line tool that can be used to mirror the web site. Once it is possible
    to perform greps on data as just suggested. An example usage of wget:


    ```

    wget -m -np http://www.somecompanyasexample.com/

    ```


    The wget tool is available from http://wget.sunsite.dk.


    +   - Administrators must be instructed to post job vacancies on technical newsgroups
    and message boards using their real names and e-mail addresses.


    # DOMAIN REGISTRARS


    A single organization may own many networks at different locations. Discovering
    domain names associated with a particular organization is'
