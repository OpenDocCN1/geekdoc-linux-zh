- pgno: 66
  md: '# REGIONAL INTERNET REGISTRIES


    Similar to domain names, organizations can be allocated blocks of IP addresses.
    Routable IP addresses are allocated to organizations by four main Regional Internet
    Registries (RIRs), as shown in Table 1-1.


    +   Table 1-1 contains a list of four major RIRs. However, new RIRs are scheduled
    to be established in the near future. See http://www.aso.icann.org/ for details
    and updates.


    Many registrants restrict the types of queries mentioned in the following sections.
    If any of the following queries do not result in a positive response from a particular
    server, they may just work against the server of another registrar.


    # Querying RIR Records by Company Prefix


    To find records owned by a company name, a query can be performed like this:


    whois -h whois.whoisser.net "companynameprefix"


    To search RIR records for company names beginning with the word "somecompanyasexample":


