    it display on the X server running on 10.0.0.1. However, the following command
    will cause an X server to allow any host to connect to it:


    ```

    [bash]$ xhost +

    access control disabled, clients can connect from any host.

    ```


    Consider a malicious user on 192.168.1.3 issuing the following command:


    ```

    xwd -display 10.0.0.1 -root > screenshot.xwd

    ```


