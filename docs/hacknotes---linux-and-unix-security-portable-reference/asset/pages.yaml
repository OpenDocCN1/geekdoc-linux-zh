  md: '# Chapter 1: Footprinting


    possible by performing “whois” queries. Most domain registrars have an associated
    public whois server (listening on port 69) to which clients can connect in order
    to query for information on domain owners. The information returned by domain
    whois queries includes associated POCs and DNS IP addresses, which are useful
    in determining the target''s network presence.


    Since domains can be registered via numerous registrars, you must first query
    for the registrar the domain is registered with, and then query for the domain
    record from the associated registrar. In order to query for the right registrar,
    a query must be performed on the public whois server **whois.crsnic.net**.


    Many registrars restrict the types of queries mentioned in the following sections.
    Any of the following queries do not result in a positive response from a particular
    whois server, they just must work against the whois server of another registrar.


