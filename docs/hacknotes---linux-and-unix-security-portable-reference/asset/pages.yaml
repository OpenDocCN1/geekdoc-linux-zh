- pgno: 236
  md: '# 182 Part III: Special Topics


    # VNC SERVER


    VNC (Virtual Network Computing) is a remote-control software package that enables
    a user to access the desktop of another host. A Zaurus port for the VNC server
    is available from http://sdgsystems.com/download.html Zaurus users may find the
    VNC server useful to access their PDAs remotely.


    On the other hand, since the Zaurus PDA can run various kinds of server software
    such as SSH, it is possible to attempt brute-force attacks on such services. Once
    an account on the PDA is compromised, an intruder may install the VNC server on
    the victim PDA in order to take control of the device (see Figure 12-1).


    ![](img/17cb132e62949dc7f5e0eadf90c71f51_236_0.png)


    Figure 12-1. Using VNC to remote-control the Zaurus PDA'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# KEYPEBBLE VNC VIEWER


    Very often, users incorrectly configure their VNC servers with weak or no passwords.
    An intruder who has gained access to an organization''s intranet can use a VNC
    viewer to connect to vulnerable VNC servers in order to take control of the misconfigured
    hosts (see the next illustration). One such viewer, the Keypebble VNC viewer,
    is available for the Sharp Zaurus PDA and can be downloaded from http://killefiz.de/zaurus/showdetail.php?app=186.


    ![](img/17cb132e62949dc7f5e0eadf90c71f51_237_0.png)


    # SMBMOUNT


    The SMBmount tool allows users to mount Samba network shares. Often, users misconfigure
    their Samba file shares with weak or no passwords. The SMBmount tool can be used
    by intruders to access such shares. (Please see Chapter 4 for details on Samba
    misconfigurations.) A Zaurus port for the SMBmount tool can be found at http://www.dasgehtichtnichtan.de/zaurus/smbmount.html.


    # TCPDUMP


    Tcpdump is a popular network analyzer program that can be used to sniff sensitive
    data on a network segment (see the following illustration). Tcpdump and other
    network analyzer programs are also used by network administrators to perform troubleshooting.
    Tcpdump for the'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# 184 Part III: Special Topics


    Zaurus can be downloaded from http://www.sklogicsoftware.com/znetmeter/tcpdump_zaurus.html.


    ![](img/17cb132e62949dc7f5e0eadf90c71f51_238_0.png)


    # WGET


    Wget is a tool used for downloading files using the HTTP, HTTPS, and FTP protocols.
    It has many useful features, including the ability to recursively download files
    from a web site. An intruder who has gained access to an organization’s wireless
    network can use Wget to quickly mirror the organization’s intranet network site.
    Wget is installed by default on the Zaurus.


    # ZETHERALE


    Zthereal is a port of the popular GUI network analyzer, Ethereal. Zthereal binaries
    and screenshots can be obtained at http://www.cartel-info.fr/pbiondi/zaurus/zethereal.html.
    Detailed information and documentation about Ethereal can be found at http://www.ethereal.com/.


    # ZNESSUS


    The zNessus tool is a Zaurus port of the Nessus GUI client. Screenshots and binaries
    are available at http://znessus.sourceforge.net/. zNessus can be used to remotely
    configure and launch vulnerability checks from'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Chapter 12: Hacking with the Sharp Zaurus PDA 185


    Nessus server. Please see Chapters 4 and 11 for more information on the Nessus
    scanner.


    The zNessus client requires that the Nessus server be configured to support unencrypted
    communication (which is disabled by default). If you decide to disable encryption
    on your Nessus server, be sure to block all incoming traffic to the Nessus port
    (1241 by default). Use the OpenSSH client to connect to your Nessus server host
    in order to tunnel your zNessus traffic securely.


    # MTR


    MTR (Matt''s TraceRoute, in the next illustration) is a tool that combines the
    functionality of the ping and traceroute programs into a single program. (Please
    see Chapter 2 for more information on ping and traceroute.) The binary package
    for the MTR port for Zaurus can be downloaded from http://psifertex.com/zaurus/mtr_0.51_arm.ipk.


    ![](img/17cb132e62949dc7f5e0eadf90c71f51_239_0.png)


    # DIG


    The dig tool can be used to interrogate DNS servers in order to fetch information
    such as MX records and server version information, as well as perform other DNS
    lookup queries. Dig for Zaurus is available at http://killefiz.de/zaurus/showdetail.php?app=362.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# PERL


    Many security tools such as the Nikto and Whisker web vulnerability scanners are
    written using the Perl language. Since Perl is an interpreted language, there
    is no need to recompile already available Perl scripts in order to run them on
    the Zaurus. Perl for Zaurus is available at http://zaurus.frontgarden.net/perl.html.


    # ONLINE RESOURCES FOR THE ZAURUS


    The Zaurus PDA has enjoyed tremendous fanfare among the Linux community. In addition
    to the tools discussed in this chapter, new ones are being created and ported
    every day. The resources in the following table provide links to software resources
    as well as FAQs and community forums.


    | Description | URL |

    | :--- | :--- |

    | Zaurus Software Index | http://killefiz.de/zaurus/ |

    | Zaurus DevNet Forums | http://www.zaurus.com/dev/board/ |

    | Zaurus Zone | http://www.zauruszone.com/ |

    | Sharp Developer | http://www.zaurus.com/dev/ |

    | Unofficial Sharp Zaurus SL-5500 FAQ | http://www.newbreedssoftware.com/zaurus-faq/
    |

    | ZaurusSoft Database | http://www.zaurussoft.com/ |

    | OpenZaurus alternative ROMs | http://openzaurus.org/ |


    # SUMMARY


    In this chapter, you looked at the various security tools that can be used on
    the Zaurus PDA. Tools that perform wireless network discovery, sniffing, and scanning
    are now available for the Zaurus. In addition, scripting languages as Perl have
    been ported to the Zaurus, allowing users to run security tools using the Perl
    language. The availability of such a huge library of security tools along the
    flexibility of the Linux operating system makes the Zaurus PDA a powerful tool
    that can be used to perform attack and penetration engagements against target
    networks.'
  merge: -1
  img_proc: true
