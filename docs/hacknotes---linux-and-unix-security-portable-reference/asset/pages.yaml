- pgno: 135
  md: "# Chapter 4: Remote Hacking 81\n\nOften, web content authors mistakenly place\
    \ files with sensitive information within the web root, and these can easily be\
    \ viewed by an unautheicated user if the directory contents are displayed.\n\n\
    # Turn Off Indexing\n\nApache users can use the IndexIgnore directive in httpd.conf\
    \ to instruct the server to turn off indexing.\n\n# Obtaining Source code, Configuration,\
    \ Statistics, and Password Resources\n\nMany HTTP servers are misconfigured to\
    \ serve critical files. Here are a few examples:\n\n+   - Source code of CGI applications\
    \ may contain usernames and passwords of databases. Many web applications use\
    \ configuration files with suffixes such as .inc or .conf. Such files may contain\
    \ system and password information and are often served by misconfigured web servers.\n\
    - Web server statistics programs output results into directories such as /stats,\
    \ and these are often placed within the web root.\n- Apache allows users to password-protect\
    \ directories by placing a file .htaccess in a directory. The .htaccess file contains\
    \ information about the location of a password file (usually .htpasswd) that contains\
    \ password hashes of allowed accounts. Often, Apache is not configured to restrict\
    \ .htaccess and .htpasswd access the .htpasswd file from being served. Once an\
    \ intruder has access to the .htpasswd file, it can be cracked using a brute-forcing\
    \ tool such as john.\n\n# Do Not Serve Critical Resources\n\nConfigure your web\
    \ server to not serve sensitive files. If using Apache, edit the httpd.conf to\
    \ deny serving files with certain suffixes. For example, the following directives\
    \ disallow files with names beginning with .ht from being served:\n\n```\n<Files\
    \ ~ \"^\\\\\\.ht\">\n  Order allow, deny\n  Deny from all\n</Files>\n```"
  merge: -1
  img_proc: true
- pgno: 136
  md: 'The AccessFileName directive can be used in httpd.conf to signify a name other
    than .htaccess. If this is done, you should make sure to instruct Apache not to
    serve the corresponding access file.


    Web Application Vulnerabilities It is beyond the scope of this book to mention
    all possible web application vulnerabilities. However, the attacks that follow
    good examples of the most common vulnerabilities.


    # Exploit Improper Input Validation


    Values can be input to web applications by the submission of HTML forms. Before
    these values are used by the application, they should be checked for illegal parameters.
    Poorly designed web applications fail to check submitted parameters, causing them
    to subject input validation attacks.


    Consider the vulnerability found in PHPNuke PHPNuke failed to sanitize user-supplied
    input to construct SQL queries. This provided a malicious user with the ability
    to perform unauthorized queries on the database used by the PHPNuke application.
    More information on this can be found at http://www.securityfocus.com/bid/6887.


    The act of exploiting an input vulnerability on a web application to perform unauthorized
    SQL queries is known as SQL injection. Consider the following SQL code executed
    in a web application:


    ```

    SELECT SSN FROM users WHERE username=''$INPUT[id]'';

    ```


    The id parameter is passed to the application via a HTML form that a user submits.
    If no input validation is performed, a malicious user may submit the HTML form
    with the value of id equals to


    blah OR ''x''=''x


    which causes the original SQL query to execute the following on the database:


    ```

    SELECT SSN FROM users WHERE username=''blah'' OR ''x''=''x'';

    ```


    This query will return the SSN values for all accounts in the "users" table!

    Many poorly designed web applications fail to perform input validation on parameters
    passed to the system() function call. Most programming languages include the system()
    function call to execute an external program:


    ```

    system("/bin/echo $i"

    ```'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'If a malicious user were to input a value such as


    ```

    `cat /etc/passwd`

    ```


    for the value of $i, the preceding system call would execute the following on
    the web server:


    ```

    /bin/echo cat /etc/passwd

    ```


    causing the /etc/passwd file to be displayed to the malicious user.


    # Prevent Input Validation Vulnerabilities


    Audit web applications to make sure input validation is performed on all user
    input parameters. Some characters to watch out for are


    \; / \ @ & | % ~ < > [ ( ) { } ] < > * !


    # Session Hijacking


    Because HTTP is not a stateful protocol, session management has to be provided
    by the web application. In many cases, sessions are maintained by the use of cookies.
    A cookie is a piece of information requested by the web server to be stored on
    the end user''s hard disk.


    Since the cookie is stored on the end user''s disk, it cannot and should not be
    entirely trusted. A poorly designed application, for example, may request the
    following cookie value to be stored after the user successfully authenticates:


    ```

    lang=en-us; user=joe; time=10:10 EST;

    ```


    If the web application were to only rely on this cookie value, any user could
    edit their web browser''s cookie file (Mozilla cookies in user''s .mozilla directory)
    and manually insert the preceding cookie value to be served to the web server.
    In addition, the malicious user could insert or his web browser to serve a cookie
    which contains a user field that is set to the name of a privileged user as "administrator"


    Cookies aren''t the only way to maintain sessions. A web application may maintain
    state by embedding session information in the URL: http://www.somecompanyasexample.com/authenticated.cgi?user=john&sessionid=12345678.'
