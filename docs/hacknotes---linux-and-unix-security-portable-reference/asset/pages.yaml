- pgno: 188
  md: '# 134 Part II: Host Hardening


    On hosts that have TCP Wrappers installed, edit /etc/hosts.allow and make sure
    the following line is the first uncommented statement:


    ```

    ALL:deny

    ```


    Also, make sure to deny connections from all hosts by default. This can be done
    by placing the following entry in /etc/hosts.deny:


    ```

    all:all

    ```


    Allow only trusted hosts to connect to services by placing appropriate entries
    in /etc/hosts.allow. See http://www.cert.org/security-improvement/implementations/i04i07.html
    for detailed instructions.


    # HARDEN inetd AND xinetd CONFIGURATIONS


    The Internet services daemon, inetd, is used to start daemons on all the required
    ports and starts the appropriate daemon process as soon as an incoming network
    connection arrives. Therefore, inetd is often called the "super-server". The xinetd
    daemon is similar to inetd, but it includes a bit more functionality, and xinetd
    users should strongly consider upgrading to xinetd.


    # Disable Unnecessary Services


    If using inetd, edit the /inetd.conf file and make sure unnecessary services are
    disabled. For example, consider the following line in inetd.conf that is responsible
    for the FTP daemon:


    ```

    ftp stream tcp nowait root /usr/local/etc/tcp /usr/local/etc/ftpd

    ```


    In order to disable FTP from inetd, place a # in front of the line:


    ```

    #ftp stream tcp nowait root /usr/local/etc/tcp /usr/local/etc/ftpd

    ```


    Restart inetd for changes to take effect:


    ```

    killall -HUP inetd

    ```


    If using xinetd, edit the appropriate service file in the xinetd.directory and
    ensure that the line "disable = yes" is present.


    > Many services run independently of inetd and xinetd. Disable unnecessary services
    from starting up by editing or removing appropriate scripts in the /etc/rc.d/directory.'
  merge: -1
  img_proc: true
- pgno: 189
  md: "# Disable inetd or xinetd If No Services Are Enabled\n\nIf inetd or xinetd\
    \ services have been disabled, there is no need to leave inetd or xinetd running.\
    \ To stop inetd or xinetd from executing on startup, disable appropriate files\
    \ in /etc/rc.d and /etc/rc.local.\n\n# Ensure Logging Is Turned On\n\nIf running\
    \ inetd, edit the inetsvc file and make sure inetd is invoked with the -t flag.\
    \ In case of xinetd, edit the xinetd.conf and make sure the following line is\
    \ present:\n\n```\nlog_type = SYSLOG authpriv\n```\n\nIn addition, edit syslog.conf\
    \ and make sure *.info is enabled to log to /var/log/messages.\n\n# HARDEN REMOTE\
    \ SERVICES\n\nThis section provides hardening tips for some common remote services\
    \ used on Unix and Linux hosts.\n\nUse netstat to find out processes listening\
    \ on TCP and UDP ports:\n\n```\n[bash]# netstat -nap\nProto Local Address Foreign\
    \ Address State PID/name\ntcp 0 0.0.0.0.139 0.0.0.0:* LISTEN 1251/smbd\ntcp 0\
    \ 0.0.0.0.80 0.0.0.0:* LISTEN 11228/X\ntcp 0 0.0.0.0 0.0.0.0:* LISTEN 2047/httpd\n\
    tcp 0 0.0.0.0.113 0.0.0.0:* LISTEN 728/identd\ntcp 0 0.0.0.0.22 0.0.0.0:* LISTEN\
    \ 750/sshd\nudp 0 0.0.0.0.512 0.0.0.0:* LISTEN 14059/xinetd\n...]\n```\n\n# WU-FTPD\n\
    \nFTP (file transfer protocol) is a protocol for transferring files from one host\
    \ to the other. WU-FTPD is the most widely used FTP daemon on Unix and Linux.\
    \ It is available from http://www.wu-fptpd.org/. Take these steps to harden WU-FTPD:\n\
    \n+   Change the server banner. Edit /etc/ftpaccess and use the greeting directive\
    \ to specify the new server. For example:\n greeting text No banner information\
    \ available. Sorry."
