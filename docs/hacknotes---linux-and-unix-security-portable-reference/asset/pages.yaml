    # Block and Harden NFS


    If NFS is running on your host, please consider the following suggestions:


    +   - Consider turning off NFS if not in use.

    - Configure your firewall to block NFS traffic. NFS runs on port 2049.

    - Edit /etc/dfs/dstab and /etc/exports to make sure no shares are being served
    to unauthorized hosts.


    Software Vulnerabilities RPC services have been susceptible to many vulnerabilities
    that can lead remote system compromise. The vulnerabilities illustrate a few RPC
    service advisors.


    +   - Buffer Overflow Vulnerability in xdr_array Due to a buffer vulnerability
    in the xdr_array() RPC, it is possible for a remote attacker to execute arbitrary
    code on the target host. See http://securityfocus.com/bid/5356 for more information.

    - Remote Command Execution Vulnerability in xfsdm This vulnerability SGI IRIX
    implementations. Due to improper sanitization of parameters passed to the RPC,
    it was possible to embed metcharacters as “" and "|". These parameters were turn
    passed to the popen() function call, enabling an attacker to execute commands
    on the target machine. See http://securityfocus.com/bid/5075 for details.

    - Buffer Overflow Vulnerability in ypasswd A buffer overflow vulnerability due
    to improper bounds checking was found to exist in the implementation of ypasswd.
    It is possible to exploit this vulnerability to execute commands on the target
    machine with administrator privileges. Please see http://securityfocus.com/bid/2763
    for more information.

    - Remote Format String Vulnerability in statd This vulnerability affects the rpc.stat
    program that shipped with various Linux distributions. Due to rpc.stat''s inability
    to perform proper input validation on user input data that is used to call the
    syslog() function it was possible for a malicious user to use specially crafted
    data in order to execute it on the target host. Details are available at http://securityfocus.com/bid/1480.'
