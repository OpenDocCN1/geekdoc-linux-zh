    # Use Secure Protocols


    Do not use clear text protocols as TFTP. Consider using HTTPS or SSH to perform
    secure file transfers.


    TFTP Misconfigurations TFTP servers are often misconfigured to serve files within
    the / (root) directory. Such a configuration may allow a remote user to fetch
    a file as /etc/passwd.


    # Obtain System Critical Files


    If a remote TFTP server is misconfigured to serve files within the / (root) directory,
    the following TFTP commands can be used to try to obtain files as /etc/shadow
    and /etc/passwd:


    ```

    [bash]$ tftp 10.0.0.1

    tftp> get /etc/shadow

    ```


    # Set TFTP Root Directory


    Most recent TFTP servers are configured by default to serve only files within
    the /tftboot directory. This directory can be set or changed by using the -s switch.
    See man tftpd for details.'
