- pgno: 204
  md: 'The preceding command will cause a new file, /tmp/zero, to be created. This
    file''s size will continue to increase unless the user interrupts the command
    by pressing CTRL-C. The file /dev/zero is a special, never-ending file containing
    zeros. By letting the preceding command run for a while, a malicious user may
    consume all space on the disk. This may cause undesirable results, since many
    running programs need to depend on available disk space to function properly.


    It is recommended that the following directories are mounted in partitions:


    +   - /boot

    - /home(s)

    - /tmp

    - /var


    Also, consider using the nodev, nosuid, and noexec options when mounting the /var
    and /tmp partitions.


    # setuid setgid FILES


    Check for files that have the setuid and setgid bits set, since such files are
    executed with the permissions of the owner. Vulnerabilities in root-or-owned setuid
    and setgid files may lead to root compromise. If possible, consider removing the
    setuid and setgid bits from files.

    To setuid files, run


    ```

    find / -perm -4000 -type f -print 2 > /dev/null

    ```


    To setgid files, run


    ```

    find / -perm -2000 -type f -print 2 > /dev/null

    ```


    # IMPLEMENT THE WHEEL GROUP


    Use the wheel group to limit access to setuid programs such as su. If this group
    does not exist, create it with the groupadd command. Change the permissions of
    su so that only users in the wheel group may execute it:


    ```

    chgrp wheel `which su`

    chmod u+s,o-rwx,u+rwx,g+rx `which su`

    ```'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# SUDO


    Sudo is a freeware tool that allows permitted users to execute commands with root
    privileges. If multiple individuals need to perform privileged operations, it
    is a good idea to set up Sudo to provide them with specific permissions. This
    is better than sharing the root password. Sudo is usually bundled with most distributions,
    but it can also be obtained at http://www.sudo.ws/sudo/. Please see http://www.onlamp.com/pub/a/bsd/2002/08/29/Big_Scary_Daemons.html
    for instructions and examples on how to set up and configure Sudo.


    # SUMMARY


    It is important to understand and enforce proper file permissions. World-readable
    and -writable files must be routinely audited for, in addition to files owned
    by system accounts such as bin and sys. The umask value should be set to be as
    restrictive as possible. Important configuration files must also be audited to
    ensure proper permissions. Disk partitions must be created for directories such
    as /tmp and /var to protect against denial of service attacks. The wheel group
    should be used to restrict access to executables such as setuid programs whenever
    possible. It is also a good idea to use Sudo in order to allow users to execute
    files with superuser privileges. This is much better than sharing the root password.'
  merge: -1
  img_proc: true
