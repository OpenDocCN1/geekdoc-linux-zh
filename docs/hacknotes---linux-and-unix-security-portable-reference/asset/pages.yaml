  md: '# Grab the SMTP Server Banner


    SMTP daemon banners can be obtained by telnetting to port 25 of the host SMTP
    is running on:


    ```

    [bash]$ telnet 192.168.1.1 25

    Trying 192.168.1.1...

    Connected to 192.168.1.1.

    Escape character is ''^''

    220 192.168.1.1 ESMT Sendmail 8.10.2+Sun/8.10.2; Tue,

    14 Jan 2003 09: 28:02-0500 (EST)

    ```


    # Change the SMTP Server Banner


    If you are using Sendmail, you can change the SMTP banner by editing the /etc/sendmail.cf
    file and changing the value of the SmtpGreetingMessage field.


    # Enumerate Users using EXPN and VRFY


    EXPN and VRFY are two commands supported by SMTP that allow for username enumeration.
    EXPN and VRFY can be used to confirm the existence of a particular username. EXPN
    can be used to enumerate the names and e-mail addresses of all the users on a
    particular group e-mail alias.


    Here is an example of VRFY:


    ```

    [bash]$ telnet mail.somecompanyexample.com 25

    Trying 10.0.0.11...

    Connected to mail.somecompanyexample.com.

    Escape character is ''^''

    220 mail.somecompanyexample.com ESMTP Sendmail 8.11.6/

    8.11.6; Wed, 15 Jan 2003 22:04:06 -0500 (EST)

    VRFY smith

    250 2.1.5 <smith@sales.somecompanyexample.com>

    ```


    Here is an example using EXPN:


    ```

    [bash]$ telnet mail.somecompanyexample.com 25

    Trying 10.0.0.11...

    Connected to mail.somecompanyexample.com.

    Escape character is ''^''

    220 mail.somecompanyexample.com ESMTP Sendmail 8.11.6/

    8.11.6; Wed, 15 Jan 2003 22:10:11 -0500 (EST)

    EXPN marketing-team

    250-2.1.5 <bob@marketing.somecompanyexample.com>

    ```'
