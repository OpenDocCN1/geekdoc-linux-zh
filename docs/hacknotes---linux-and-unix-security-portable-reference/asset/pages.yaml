- pgno: 79
  md: '# PORT SCANNING


    Port scanning is the process of connecting to UDP and TCP ports of a host to determine
    which ports are listening. Port scanning can be accomplished in many different
    ways. The following are the most common and useful port scanning methods.


    # TCP Connect


    This type of scanning uses the TCP open system call provided by the operating
    system kernel to connect to specified ports on the target host. This is the vanilla
    method of opening a TCP connection via the three-way handshake:


    ![](img/17cb132e62949dc7f5e0eadf90c71f51_79_0.png)


    Since a TCP-connect scan completes the three-way handshake, the application listening
    on the destination port will respond to the connection attempt. This will cause
    the application to log the connection attempt. Therefore, this method of port
    scanning is not stealthy.


    # Using nmap to Perform TCP-Connect Port Scans


    Using the -sT option in nmap will perform a TCP-connect scan:


    ```

    [bash] nmap -sT 10.0.0.1

    ```


    ```

    Starting nmap. 3.00 ( www.insecure.org/nmap/ )

    Interesting ports on (10.0.0.1):

    (The 1595 ports scanned but not shown below are in state: closed)

    Port    State   Service

    25/tcp  open    smtp

    113/tcp open    auth

    6000/tcp open    X11


    nmap run completed -- 1 IP address (1 host up) scanned in 0 seconds

    ```


    > TDP and UDP ports range from 1 to 65535. By default, nmap scans for commonly
    known ports. Scanning all 65,535 ports is time consuming but can be performed
    with nmap when using the -p flag:

    nmap -sT 192.168.1.1 -p 1-65535'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# FTP Bounce Scans


    Due to the design of the FTP protocol, when an FTP client requests data transfer
    using "active" mode, the FTP server must initiate a connection back to the FTP
    client. FTP clients issue a PORT command with their IP address and listening port
    number as parameters. If the FTP client issues a PORT command with the IP address
    of another host, the FTP server will attempt to connect to that host. Therefore,
    this feature of the FTP protocol can be used to proxy scans.


    The nmap command includes a -b flag to perform "FTP bounce" scans:


    ```

    nmap -b username:password@ftp.somecompanyexample.com:21 -p 4000-8080 target.somecompanyexample.com

    ```


    > FTP clients may use passive mode when requesting data transfer, which will cause
    the FTP client to connect to a port on the FTP server in order to perform the
    data transfer. However,passive-mode FTP has its own problems. Passive-mode FTP
    clients may be subject to "connection theft" vulnerabilities. Please see Chapter
    4 for details.


    # TCP SYN/Half-Open


    This type of scanning causes the scanner to send out a SYN packet to the target
    host. If the target host is listening on a particular port, it will respond with
    a SYN+ACK. If alive, a RST packet will be received. As this method of scanning
    does not complete the TCP three-way handshake, it is stealthy; since it is not
    logged by the target host.


    # SYN Scanning


    Using -sS flag in nmap will perform a SYN scan:


    ```

    [bash]# nmap -sS 192.168.1.150

    nStarting nmap V 3.00 ( www.insecure.org/ )

    Interesting ports on (192.168.1.150):

    (The 1599 ports scanned but not shown below are in state: closed)

    Port    State   Service

    22/tcp open    ssh

    113/tcp open    auth


    Nmap run completed -- 1 IP address (1 host up) scanned in 2 seconds

    ```'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Chapter 2: Scanning and Identification


    # Source Port Scanning


    Due to the design of the FTP protocol, when an FTP client requests data transfer
    using active mode, the FTP server must initiate a connection back to the FTP client.
    In order to facilitate this, many firewalls are configured to allow all incoming
    IP packets whose source port is set to 20. In addition, IP packets from DNS servers
    have their source port set to 53, and therefore, many firewalls allow all incoming
    packets whose source port is 53. It is possible to instruct nmap to set the source
    port of its packets to a constant by using the -g switch:


    ```

    nmap -SS -g 20 192.168.1.1

    ```


    # FIN


    In this method, a FIN packet is sent to a target host. If the target host is alive
    but listening on a particular port, it will respond with a RST packet. However,
    if the target host is listening on a particular port, it will not respond. Note
    that Microsoft Windows hosts will send RST packets in all cases. This is of interest
    because it helps identify the target hosts as Microsoft Windows hosts.


    > FIN IP packets are used to tear down established TCP connections.


    # FIN Scanning


    Using the -sF flag in nmap will perform a FIN scan:


    ```

    [bash]# nmap -sF 192.168.1.100

    ```


    Starting nmap V.3.00 ( www.insecure.org/nmap/ )

