    # Enumerate SNMP


    SNMP servers are configured with a “community string” that acts like a user ID
    or password. When an SNMP server is queried with the wrong community string, it
    does not respond. Many SNMP servers have default community strings such as “public”
    and “private.”. When an SNMP server is queried with the right community string,
    useful information can be gained:


    ```

    ```bash

    snmpwalk 10.0.0.1 public

    TCP/IP

    system.objectID.0 = OID: enterprises.36.2.15.2.3

    system.sysTime.0 = Timesteps: (190724809) 22 days, 1:47:28:09

    system.sysContact.0 = unknown

    system.sysName.0 = 10.0.0.1

    system.sysLocation.0 = Room G1, Ground Floor

    interfaces.ifTable.ifEntry.ifPhysAddress.1 = 0:0e7:1:e3:1

    interfaces.ifTable.ifEntry.ifPhysAddress.2 = =

    interfaces.ifTable.ifEntry.ifPhysAddress.3 = =

    interfaces.ifTable.ifEntry.ifPhysAddress.4 = =

    ```

    ```


    The preceding output is only a snapshot of what is usually hundreds of lines long.
    As obvious, the previous information provides a lot of configuration details.
    The snmpwalk command is part of the net-snmp-utils package provided by most Unix
    and Linux distribution vendors. It can also be obtained from http://www.net-snmp.org/


    # Prevent SNMP Enumeration


    If you have hosts configured to use SNMP, consider the following precautions:


    +   - Use SNMP versions 2 or 3.

    - Use a community string that is hard to guess.'
