- pgno: 186
  md: 'default installations of most Unix and Linux distributions leave room for better
    hardening of various policies, applications, and services. This chapter provides
    tips on how to harden hosts and they commonly used services.


    # SET PASSWORD POLICIES


    Intruders often exploit weak password policies to gain access to user accounts.
    There are some steps that can be taken in order to harden password policies:


    +   - Ensure shadowed passwords are in use. Check to make sure no password hashes
    are present in the /etc/passwd file. Password hashes should be present only in
    /etc/shadow, and this file must be readable only by root.


    +   - Edit the password configuration file (/etc/default/passwd) or use the chage
    utility to change the password expiry lengths.


    # REMOVE OR DISABLE UNNECESSARY ACCOUNTS


    Check /etc/passwd to see the accounts enabled on the host. Many services create
    nonprivileged accounts to be used during execution, example: ftp, lp, news, gopher,
    ntp. Make such accounts are disabled by setting their shell to /bin/false. If
    the services for these accounts are not in use, uninstall and remove the accounts.


    # REMOVE “.” FROM THE PATH VARIABLE


    When a user executes a command, the command shell searches for the location of
    the command in the list of directories contained in the PATH environment variable.
    To prevent execution of Trojans placed on the file by malicious users, make sure
    the PATH environment variable includes the current directory (“.”).


    Check files such as /etc/local, /etc/profile, /etc/bashrc, /etc/csh_bashrc, ~/.bashrc,
    ~/.bash_profile, ~/.cshrc, and ~/.login to ensure that the PATH variable does
    not include “.”. If you are using a shell other than bash, check the appropriate
    resource files.


    Use echo to print the value of the current user''s PATH variable:


    ```

    echo $PATH

    ```'
  merge: -1
  img_proc: true
- pgno: 187
  md: "# CHECK THE CONTENTS OF /etc/hosts.equiv\n\nThe /etc/hosts.equiv file contains\
    \ a list of hostnames and users that are considered trusted. Services as login,\
    \ rsh, rcp, and rcpmd use this file to determine trusted entities. Check this\
    \ file to ensure only trusted hostnames and users are present. Consider removing\
    \ this file if no remote hosts or users are to be trusted.\n\n# CHECK FOR .rhosts\
    \ FILES\n\nCheck your file system for the presence of .rhosts files. Hostnames\
    \ and usernames present in this file are allowed to log in via r-services such\
    \ as login without specifying a password. Use the find command to check for .rhosts:\n\
    \n```\nfind -name .rhosts -type f -print 2> /dev/null\n```\n\n# DISABLE STACK\
    \ EXECUTION\n\nDisabling stack execution will prevent some types of buffer overflow\
    \ conditions. If using Solaris, edit /etc/system and add the following lines:\
    \ \n\n```\nset noexec_user_stack=1\nset noexec_usr_stack_log=1\n```\n\nFor non-Solaris\
    \ distributions, the following products are available:\n\n+   - StackGuard: http://www.immunix.org/stackguard.html\n\
    - Libafe: http://www.research.avalayabas.com/project/libafe/\n- StackGhost: http://stackghost.cerias.purdue.edu/\n\
    - Openwall: http://www.openwall.com/linux\n\n# USE TCP WRAPPERS\n\nTCP Wrappers\
    \ allow for the monitoring and filtering of incoming requests for network services.\
    \ Most distributions install TCP Wrappers by default, but if you need it, you\
    \ can obtain it at ftp://ftp.porcupine.org/pub/security/index.html."
  merge: -1
