- pgno: 112
  md: 'This chapter will focus on techniques often used by intruders to gain unauthorized
    access to remote hosts. After identifying services and enumerating all possible
    users, the next logical step for an attacker is to compromise the victim host
    by exploiting known service and application vulnerabilities on the target host.


    # REMOTE SERVICES


    If the primary goal of the target host is to act as a server, it must allow remote
    access to relevant TCP or UDP ports. As long as one open network port exists,
    an opportunity also exists for an unauthenticated user to attempt an intrusion.


    Before we look at a detailed list of commonly exploited services, we must first
    understand the different types of tactics used by intruders.


    # Intrusion Tactics


    Depending on the ports and services open on the remote host, an attacker may choose
    to use many different techniques to attempt unauthorized access. The following
    sections describe many common tactics used by potential intruders to remotely
    compromise vulnerable hosts.


    # Brute-Forcing


    If a remote service authenticates users via a username and password pair, the
    most obvious method to gain access is to attempt all possible username and password
    combinations. A more efficient method is to only attempt known usernames that
    have been accumulated by successful username enumeration techniques as described
    in Chapter 3. Since users tend to choose easy-to-remember passwords that can be
    found in a dictionary, many brute-force tools make use of language dictionary
    files.


    For the purposes of the examples that follow, we will be making use of Hydra,
    a brute-force tool that supports various protocols. It is available for download
    from http://www.thehackerschoice.com/releases.php.


    The act of attempting all possible combinations of usernames and passwords described
    here is known as "active" brute-forcing. On the other hand, password crackers
    such as John the Ripper can be used to brute-force password hashes, in a technique
    known as "passive" brute-forcing. See "Cracking /etc/shadow" at the end of this
    chapter for details.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Common Defenses Against Brute-Force Attacks


    Here are a list of precautions that can be taken to better protect against username
    and password brute-forcing:


    +   - Oblige users to use strong passwords. Utilities such as npasswd, available
    at http://www.utexas.edu/cc/unix/software/npasswd/, and pam_passwdqc, available
    at http://www.openwall.com/passwdqc/, help enforce strong policies.

    - Require password aging and enforce password restrictions. Depending upon your
    distribution, edit /etc/default/passwd to do this.

    - Consider the use of dynamic password schemes such as S/KEY and SecURID.


    # Sniffing


    Network packets that are destined for other hosts are ignored by network cards
    during normal operation. However, most network cards can be set to run in “promiscuous
    mode” through the use of sniffing programs (also known as “network analyzers”),
    causing the network card to pass all received packets to the operating system’s
    TCP/IP stack. This allows someone to examine every network packet received by
    the host. Since many protocols pass data in clear text, it is possible for a malicious
    user to use network analyzer software to capture critical data such as usernames
    and passwords that are transmitted across the network.


    On a hubbed network, packets sent and received by hosts on the same network segment
    are received by all participating hosts. In this scenario, a malicious user may
    simply set his or her network card to promiscuous mode to capture all data on
    the network segment.

    However, on a switched network, the hardware switch device ensures that hosts
    receive only packets that are destined to them. Every Ethernet network device
    is assigned a 12-digit hex by its vendor. When a host on a switched network transmits
    data, its MAC address is recorded by the switch and stored in cache. Future packets
    destined for the host’s MAC address are transmitted to the hardware port on the
    switch that the host is connected to. Tools such as Ettercap can be used to perform
    ARP-spoofing, where forged ARP (Address Resolution Protocol) replies'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# 60 Part I: Hacking Techniques and Defenses


    are used to proxie traffic over a switch. Consider the following hosts present
    on a network switch:


    +   - Victim host

    - Gateway host

    - Malicious host


    In order to perform ARP-spoofing, host M will send ARP reply packets to hosts
    G and V. These ARP reply packets will cause host V to map host M''s MAC address
    with host G''s IP address, and will cause G to map M''s MAC address with host
    V''s IP address. Since Ethernet packets are routed around MAC addresses, host
    M will receive all packets transmitted to and from G and V. Now, if M routes these
    packets to the correct destinations by replacing MAC addresses with those of hosts
    G or V, the victim host G and V will have no idea that their connection is being
    probed by host M. Tools as Dsniff and Etcap can be used to perform ARP-spoofing.

    Etcap can be downloaded at http://ettcap.sourceforge.net/. Dsniff is available
    at http://monkey.org/dugsong/dsniff.


    # Common Sniffing Countermeasures


    Network sniffing tools make it easy for malicious users to capture data on a network
    segment. The following countermeasures are strongly recommended:


    +   - Do not use clear-text protocols.

    - Some switches allow administrators to statically map MAC addresses. However,
    this may not be feasible for large corporations.

    - Many IDSs detect and report ARP-spoofing. Ettercap can be used to help detect
    ARP replies on a network.


    # Man-in-the-Middle


    This type of an attack involves a malicious user intercepting and altering data
    between two or more victim hosts.


    For example, note that he has successfully compromised somecompanyasanexample.com''s
    internal DNS server, the intruder may alter the DNS server configuration to answer
    all DNS queries for intranet.somecompanyasanexample.com to point to the intruder''s
    IP address. This will cause users to unknowingly connect to the intruder''s'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'host instead of intranet.somecompanyasanexample.com. The intruder may then
    proxy the victim''s connection to the real IP address of intranet.somecompanyasanexample.com
    and in. In this scenario, the intruder will have successfully launched a man-in-the-middle
    attack.


    # Preventing Man-in-the-Middle Attacks


    Use secure protocols such as SSH, IMAPS, and HTTPS. Although these protocols may
    be susceptible to man-in-the-middle attacks, they may make use of encryption keys
    and certificates that will cause software clients to end users of a possible attack.


    # Misconfigurations


    Often, services are misconfigured to expose unnecessary information to unauthenticated
    users. Sometimes, misconfigurations may lead to total compromise of a host. Common
    misconfigurations and their defenses are listed in the following “Remote Service
    Vulnerabilities” section.


    # Audit and Harden Host Configurations


    It is a good idea to routinely audit and harden host configuration policies. See
    the chapters in Part II of this book for instructions on how to harden policies
    and services.


    # Software Vulnerabilities


    Software vulnerabilities are caused by design flaws such as improper input validation
    and bounds checking. Such vulnerabilities are often remotely exploitable, enabling
    attackers to execute malicious code on the host running the vulnerable software.


    Buffer overflows are the cause of many remotely exploitable conditions. They occur
    when a process writes data past the allocated buffer space in memory. This causes
    the executable stack space to be overwritten with arbitrary data. An attacker
    may take advantage of such a condition by supplying own input that may cause the
    process to overwrite its stack with executable data supplied by the attacker.
    For more information and details, see “Smashing the Stack for Fun and Profit”
    by “Aleh One,” available at http://www.insecure.org/stf/smashstack.txt.'
  merge: -1
  img_proc: true
