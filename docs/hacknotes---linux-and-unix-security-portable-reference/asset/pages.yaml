- pgno: 77
  md: '# PINGING


    The quickest way to determine if a host is alive is to ping it. The ping command,
    used for this purpose, sends out an ICMP echo request, causing the target to respond
    with an ICMP reply packet. Note that a host can be configured not to respond to
    ICMP echo requests. Therefore, even though a host does not respond to echo requests,
    it may be alive.


    # Pinging Hosts Using the ping utility


    Using the ping command will find alive hosts that respond to ICMP echo requests
    with ICMP echo replies:


    ```

    [bash]$ ping 192.168.1.1

    PING 192.168.1.1 (192.168.1.1) : 56(84) bytes of data.

    64 bytes from 192.168.1.1: icmp_seq=1 ttl=64 time=0.093 ms

    64 bytes from 192.168.1.1: icmp_seq=2 ttl=64 time=0.078 ms

    64 bytes from 192.168.1.1: icmp_seq=3 ttl=64 time=0.076 ms

    64 bytes from 192.168.1.1: icmp_seq=4 ttl=64 time=0.062 ms

    ---

    192.168.1.1 ping statistics

    4 packets transmitted, 4 received, 0% loss, time 2997ms

    rtt min/avg/max/mdev = 0.062/0.077/0.093/0.012 ms

    ```


    # PING SWEEPING


    Ping sweeping is the process of pinging numerous hosts. In the case of a large
    set of target IP addresses, one must perform a ping sweep to determine alive hosts
    that respond to ICMP echo requests.


    Using the -sP option in nmap will perform a ping sweep:


    ```

    [bash]$ nmap -sP 192.168.1.1*


    Starting nmap V. 3.00 (www.insecure.org/nmap/ )

    Host (192.168.1.1) appears to be up.

    Host (192.168.1.100) appears to be up.

    Host (192.168.1.150) appears to be up.


    Nmap run completed -- 256 IP addresses (3 hosts up) scanned in 33 seconds

    ```'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Block ICMP


    Configure your firewall to drop incoming ICMP echo requests and outgoing ICMP
    echo replies. This will prevent hosts in your networks from responding to ICMP
    echo requests.


    # TCP PINGING


    If a TCP ACK packet is sent to a host that is alive, a RST packet will be sent
    back. This method can be used to scan machines that block ICMP requests.


    # Using nmap to Perform TCP Pings


    Using the -PT option of nmap will perform a TCP ping. By default, nmap sends an
    ACK packet to port 80 of the destination host. Use the syntax to instruct nmap
    to use another port:


    ```

    nmap -PT[port_number] host

    ```


    For example:


    ```

    nmap -PT6000 192.168.1.1

    ```


    If a host responds with a RST packet, nmap will consider the host alive and perform
    a port scan immediately.


    ```

    [bash]# nmap -PT 192.168.1.1

    ```


    Starting nmap V. 3.00 ( www.insecure.org/nmap/ )

    Interesting ports on (192.168.1.1):

