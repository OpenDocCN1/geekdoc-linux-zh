- pgno: 82
  md: '# Reverse Ident


    Ident (Identification Protocol) servers listen for connections on port 113. If
    a TCP connection is established to a port listening on the host running the ident
    server, the ident server may be queried for the privilege level of the process
    associated with the connection.


    # Reverse Ident Scans


    Using the -I flag in nmap will perform a TCP reverse ident scan:


    ```

    [bash]# nmap -I -sT -p 80 192.168.1.100

    ```


    Starting nmap V.3.00 ( www.insecure.org/nmap/ )

    Interesting ports on (192.168.1.100):


    | Port | State | Service | Owner |

    |---|---|---|---|

    | 80/tcp | open | http | nobody |


    Nmap run completed -- 1 IP address (1 host up) scanned in 1 second


    # XMAS


    This method of scanning involves sending a TCP packet with the FIN, URG, and PUSH
    flags. If the target host is listening on the particular port, it sends a RST
    packet back. If the target host is not listening on that port, it does not respond.


    FIN packets are normally used to tear down an established TCP connection. URG
    packets signify that information needing immediate attention is present within
    the IP packet, such as a ^ sent during a telnet session. A PUSH packet signifies
    that the sender requests the receiver to immediately pass all buffered data to
    the application.


    # XMAS Scanning


    Using the -sX flag in nmap will perform an XMAS scan:


    ```

    [bash]# nmap -sX 192.168.1.1

    ```


