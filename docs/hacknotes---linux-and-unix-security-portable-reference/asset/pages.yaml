    \ value. The script_version function displays version information about the plug-in.\
    \ It is a good idea to update this to reflect the latest version of the plug-in.\
    \ The script_description function sets the description of the plug-in that is\
    \ displayed by the Nessus client when the plug-in is queried by a user. Similarly,\
    \ the script_summary function is used to set a summary of the plug-in.\nThe script_category\
    \ function sets the plug-in's category as required by Nessus. In our case, we\
    \ have set it to ACT_GATHER_INFO because the plug-in gathers information on a\
    \ remote service; it checks for the existence of the file /src/passwd.inc on a\
    \ web server. The script_copyright function is used to set author copyright information.\n\
    Nessus categorizes plug-ins into different “families” to help sort the vulnerabilities\
    \ performed. We have set it to “CGI abuses” to indicate an abuse of a CGI-based\
    \ web application. Visit http://cgi.nessus.org/plugins/dump.php?viewby=family\
    \ to check out a list of publicly available plug-ins that have been categorized\
    \ by family.\nNessus can be configured to optimize tests by selecting the appropriate\
    \ private check in the Scan Option of the GUI client. When this"
