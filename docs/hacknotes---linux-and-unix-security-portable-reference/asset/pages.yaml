    # Change the Telnet Server Banner


    In order to change the telnet banner, you will need to write a wrapper around
    it. Assuming that you are running telnetd in inetd, edit your /etc/inetd.conf,
    and change


    ```

    telnet stream tcp nowait root /usr/sbin/in.telnetd in.telnetd

