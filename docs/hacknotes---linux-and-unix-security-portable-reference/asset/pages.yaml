- pgno: 195
  md: '# Chapter 7: Default Settings and Services 141


    +   - Study the smb.conf file to make sure guest access isn’t granted to shares
    that store critical information.


    # NFS


    NFS (network file system) is a file system protocol that provides remote access
    to shared files across networks. Here are some steps you can take to harden NFS
    server configurations:


    +   - Export file systems as read-only. Consider not exporting them with write
    permissions. Use the ro option in /etc/exports or /etc/dfs/sharetab to specify
    shares to be read-only. Here is an example:

    /nfsclient_ip(ro)


    +   - Prevent nonroot users from mounting NFS shares. To do this, edit /etc/exports
    or /etc/dfs/sharetab and make sure the (secure) option is present. For example:

    /nfsclient_ip(secure)


    +   - Do not allow remote users to mount NFS shares with root permissions. This
    would allow them to modify root-owned files on the NFS share. Use the root_squash
    option in /etc/exports or /etc/dfs/sharetab to prevent this.


    +   - NFS clients must be configured to not setuid programs on mounted shares.
    Otherwise, a malicious or compromised NFS server may place root setuid Trojan
    files on the exported share, and these will be executed as root on the client.
    Use the nosuid option while mounting NFS shares. If possible, also consider using
    the noexec option, which forbids execution of binaries on the NFS client.


    # SUMMARY


    It is very important to harden system configurations as much as possible. Password
    policies must be strictly enforced to ensure the use of strong passwords, and
    unnecessary services should be disabled if not in use. In addition, stack execution
    should be disabled to prevent many forms of buffer overflow attacks. Files such
    as .hosts and /etc/hosts must be regularly audited or removed if not needed. The
    PATH variable should not contain “.” in order to protect against Trojan executables.
    The hardening steps described in this chapter are strongly suggested to ensure
    secure configurations of remote services.'
  merge: -1
