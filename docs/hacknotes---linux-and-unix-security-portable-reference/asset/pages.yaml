- pgno: 61
  md: '# Locating Protected Data Resources


    Sensitive information is often placed on web sites within directories called “protected,”
    “secret,” “passwords,” etc. Many times, these directories are not password protected
    and can be easily searched.


    As an example, the Apache web server, which is often configured to provide authentication
    when certain configuration and password files are present in a directory. The
    password file, called .htpasswd, should not be served by the web server. To search
    for such files on the Internet http://www.google.com, perform the following query:
    “Index of” .htpasswd. Here is an example of an .htpasswd file:


    ```

    joe:1WJdcijCqWFA

    ```


    ```

    admin:XrouH05qTM1U.

    ```


    Password hashes contained in this file can be easily cracked using a password
    cracker as “John the Ripper.”


    ```

    [bash]$ john .htpasswd

    Loaded 2 passwords with 2 different salts (Traditional DES [24/32 4K])

    password (joe)

    mypass (admin)

    guesses: 2 time: 00:00:21 (3) c/s: 83610 trying: bly045 - Sist20.

    ```


    John the Ripper is available at http://www.openwall.com/john/


    # Looking Through Configuration Files for Sensitive Information


    Various configuration files containing information such as passwords, secret keys,
    usernames, internal IP addresses, and other sensitive data are mistakenly served
    by various servers when placed within the web directory. Searching for these files
    is a matter of knowing their names. A potentially vulnerable file is ssh_config,
    which contains configuration information for SSH servers. A potential intruder
    may perform a search using the query “Index of” ssh_config in order to find web
    servers that serve the ssh_config file Since configuration files contain sensitive
    information, they may expose critical information that should not be accessible
    by external entities.


    # Searching Usenet Archives for Administrative Shortcomings


    Newsgrup postings often contain information that can serve as an aid to an attacker.
    For example, administrators sometimes post to technical'
