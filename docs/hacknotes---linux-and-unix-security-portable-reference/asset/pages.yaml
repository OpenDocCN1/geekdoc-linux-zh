- pgno: 6
  md: '# About the Author


    # Nitesh Dhanjani


    Nitesh Dhanjani is an information security consultant for Foundstone, Inc. While
    at Foundstone, Nitesh has been involved in many types of projects for various
    Fortune 500 firms, including network, host penetration, and security assessments,
    as well as security architecture services. Nitesh is a contributing author to
    HackNotes: Network Security Portable Reference (McGraw-Hill/Osborne, 2003) and
    to the latest edition of the best-selling book Hacking Exposed: Network Security
    Secrets and Solutions (McGraw-Hill/Osborne, 2003). He also has published articles
    for numerous technical publications such as the Linux Journal. In addition to
    authoring, he has taught Foundstone “Ultimate Hacking: Expert” and “Ultimate Hacking”
    courses.


    Prior to joining Foundstone, Nitesh worked as a consultant with the information
    security services of Ernst & Young LLP, where he performed attack and penetration
    reviews for many significant companies in the IT arena. He also developed proprietary
    network scanning tools for use within Ernst & Young LLP’s security department.


    Nitesh graduated from Purdue University with a bachelor''s and a master''s degree
    in Computer Science. At Purdue, he was involved in numerous research projects
    with the CERIAS (Center for Education and Research Information Assurance and Security).
    He was also responsible for creating content and teaching C and C++ programming
    courses to be delivered remotely as part of a project sponsored by IBM, AT&T,
    and Intel.


    Nitesh continues to be actively involved in open source projects, systems programming,
    and Linux kernel development. He can be reached at books@dhanjani.com.


    # About the Technical Reviewer


    # Robert Clugston


    Robert Clugston is an information technology security consultant for Foundstone.
    He has over six years of experience in systems administration, network security,
    and web production engineering. Robert initially joined Foundstone to design and
    secure Foundstone''s web site and is now focused on delivering services to Foundstone''s
    clients. Prior to joining Foundstone, Robert worked as a systems administrator
    for an Internet service provider. His responsibilities included deploying, maintaining,
    and securing business-critical systems to include web servers, routers, DNS servers,
    mail servers, and additional Internet delivery devices/systems. Prior to joining
    Foundstone, Robert also worked briefly as an independent contractor specializing
    in Perl/PHP web development. Robert holds an MSCE in Windows NT.'
  merge: -1
  img_proc: true
