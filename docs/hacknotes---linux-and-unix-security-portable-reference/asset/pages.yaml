- pgno: 96
  md: "# Configure BIND to Not Display Version Information\n\nEdit the BIND configuration\
    \ file, named.conf, and override the version number:\n\n```\noptions {\n  version\
    \ \"Not available\";\n}\n```\n\nYou might also want to configure BIND with specific\
    \ ACLs and limit queries from specific hosts. See the BIND documentation for details.\
    \ More information about BIND can be found at http://www.isc.org/products/BIND.\n\
    \n# Finger: 79 (TCP)\n\nFinger is a user information lookup program. Fingering\
    \ a remote host will provide information such as usernames, IP addresses, idle\
    \ time, and real names of the individuals logged on the host at time.\n\n# Enumerate\
    \ Remote Users by the Finger Command\n\nIf the remote host is running a finger\
    \ daemon, the command-line finger tool can be used to query the host:\n\n```\n\
    finger @host\n```\n\nExample:\n\n```\n[bash]$ finger @192.168.1.1\nLogin Name\
    \ TTY Idle When Where\nbob Bob pts/1 8 Wed 14:26 bobsaddress.bobsisp.org\nrob\
    \ Robert Smith pts/4 51 Wed 14:36 dhcp.rhomeisp.org\ntang Tang pts/3 1:08 Wed\
    \ 10:07 somecaseanexample.com\n```\n\nIt is also possible to finger a specific\
    \ username. Querying for a specific username will yield some information about\
    \ the user even if the user is not logged on at the time:\n\n```\nfinger username@host\n\
    ```\n\nExample:\n\n```\n[bash]$ finger root@192.168.1.1\nLogin name: root In real\
    \ life: Sys Admin\nDirectory: / Shell: /usr/local/bin/tcsh\nLast login Jan 11\
    \ 14:26:51 on tty2\n```"
