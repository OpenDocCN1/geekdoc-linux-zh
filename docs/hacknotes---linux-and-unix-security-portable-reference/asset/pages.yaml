    # SSH (Secure Shell): 22 (TCP)


    SSH is a secure protocol for exchanging data. It can be used to log in to

    remote machines, execute remote commands, and transfer files. Since

    communication within SSH is encrypted, it is a worthy replacement for

    remote-login solutions such as telnet, rlogin, and FTP.


    Brute-Forcing SSH has support for authentication using a username

    and password pair. Therefore, it is possible to perform brute-forcing of

    accounts via SSH.


    # Brute-Force SSH


    It is possible to brute-force SSH accounts by writing a simple brute-

    forcing script using the expect tool, a simple program that “talks"

    with other interactive programs. One sample Expect script can be

    found at http://www.securiteam.com/tools/5QPOL2K60E.html. The

    program expect can be downloaded from http://expect.nist.gov.


    # Prevent SSH Brute-Forcing


    Please see “Common Defenses Against Brute-Force Attacks."'
