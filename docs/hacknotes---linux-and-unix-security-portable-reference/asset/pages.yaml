    # Block and Tunnel X


    The following recommendations are suggested for those running servers:


    +   - Block ports 6000 to 6063 at your firewall. This will disable external hosts
    from connecting to internal X servers.


    +   - Use SSH to tunnel X securely:

    ssh -X username@remoteserver.somecompanyasexample.com


    # Web Proxies: (8000+ TCP)


    Web proxies, as their name suggest, are used to proxy HTTP and HTTPS traffic.


    Web Proxy Misconfigurations Web proxy misconfigurations can be abused using the
    methods described here. We will make use of the desproxy command-line tool, which
    uses the CONNECT method supported by HTTP/1.1 to establish TCP connections via
    proxies. It can be downloaded from http://desproxy.sourceforge.net.


    # Proxy Attacks


    Misconfigured web proxies often allow intruders to proxy attacks. Consider the
    following desproxy command:


    ```

    desproxy 10.0.0.1 23 192.168.1.1 8000 2300

    ```


    After issuing this command, if the intruder tunnels telnets to port 2300 on his
    own host (127.0.0.1), he she will be connected to the telnet port (23) of 10.0.0.1
    via the vulnerable web proxy (192.168.1.1) listening on port 8000. Since the victim
    host will log only incoming connections from the web proxy IP address of 192.168.1.1,
    the attacker would have successfully bypassed the proxy in order to proxy his
    or her attacks.


    If an intruder already has control of a host on an internal network that does
    not allow outbound TCP connections, the intruder can use desproxy to establish
    TCP connections on external hosts via an available web proxy.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Reverse-Proxy Attacks


    Often, misconfigured web proxies can be used to establish connections to hosts
    that exist on an internal network that the web proxy host has access to. In the
    earlier example, suppose 10.0.0.1 is the IP address of a host that is only accessible
    from the internal network that the web proxy (192.168.1.1) was located on. The
    command in that example would thus allow an attacker to connect to the telnet
    port of the internal host via the vulnerable web proxy.


    # Block Incoming Connections


    Configure your firewall rules to block incoming connections to your organization''s
    web proxies.


    # Application Vulnerabilities


    Applications are also subject to vulnerabilities that can cause a remote compromise
    of the host running the client application. However, vulnerabilities are very
    difficult to exploit remotely. Although it is not possible to list all the applications
    that have been known to be remotely exploitable, these vulnerabilities document
    some well-known applications that have been susceptible to remote compromise.


    # Malformed NFS and BGP Packet Buffer Overflow Vulnerabilities in tcpdump


    The tcpdump program is the most widely used command-line packet analyzer. A buffer
    overflow vulnerability was discovered in tcpdump''s handling of malformed NFS
    (Network File System) packets. This vulnerability made it possible for arbitrary
    instructions to be executed on the host running tcpdump when malicious NFS packets
    were intentionally sent over the network. Please see http://securityfocus.com/bid/4890.


    Another tcpdump vulnerability was found to exist due to improper handling of malformed
    BGP packets. See http://securityfocus.com/bid/6213 for more information.


    # Netscape/Mozilla POP3 Mail Handler Integer Overflow Vulnerability


    This vulnerability caused a buffer overflow condition to occur in the Netscape/Mozilla
    browser''s mail client when malicious data was sent'
