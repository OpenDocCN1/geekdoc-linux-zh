    # IP Protocol


    The aim of this type of scan is to determine which IP protocols are supported
    on the target host. It sends raw IP packets for particular protocols, and if an
    ICMP protocol unreachable message is received, then the particular protocol is
    most likely unsupported on the target host.


    # IP Protocol Scanning -sO flag in nmap will perform an IP protocol scan.


    ```

    [bash]# nmap -sO 192.168.1.1

