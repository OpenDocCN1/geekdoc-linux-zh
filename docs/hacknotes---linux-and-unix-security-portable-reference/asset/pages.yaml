- pgno: 72
  md: '# 18 Part I: Hacking Techniques and Defenses


    Using domain server:

    Name: 10.0.0.1

    Address: 10.0.0.1#53


    As is evident from this example, if an intruder is successful at performing zone
    transfer, he or she can gain information about the roles of hosts within an organization
    and their IP addresses.


    # Prevent Zone Transfer Abuses

    The following are strongly recommended in order to protect against zone transfer
    abuses:


    +   * Do not allow unauthorized hosts to perform zone transfers from your DNS.

    * Since zone transfers are performed on TCP port 53, configure your firewall to
    block inbound connections on TCP port 53.

    * It is a good idea to install a separate DNS server for intranet hosts. This
    DNS server should not be accessible externally.


    # TRACEROUT


    With the help of the preceding queries, IP addresses may be obtained by simply
    knowing a target organization''s name. Since IP packets travel to its destination
    via different paths, it would be beneficial to learn about the gateways in between
    the source (yourself) and the destination host.


    # Performing Traceroutes

    A command-line tool named traceroute may be used to perform traceroutes:


    ```

    $ traceroute 10.0.0.1

    taceroute to 10.0.0.1 (10.0.0.1), 30 hops max, 38 bytes packets

    1 yours.gateway.net (192.168.10.10) 13.069ms 8.099ms 10.133ms

    2 192.168.9.1 (192.168.9.1) 8.675ms 9.481ms 7.214ms

    3 10.1.1.1 (10.1.1.1) 9.292ms 9.446ms 12.368ms

    4 nsl.comexampleserver.net (10.0.0.1) 9.736ms 9.623ms 9.647ms

    ```


    The traceroute program works by using UDP packets to high ports on the destination
    with their TTL (Time to Live) values set to 1 initially and then incremented by
    1 for every subsequent packet. Gateways decrement the TTL of an IP packet by 1
    before forwarding along'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Chapter 1: Footprinting 19


    the route. If the TTL of an IP packet equals 0, then the particular gateway will
    send an “ICMP Time to Live Exceeded” packet back to the source. Thus, the traceroute
    tool determines the IP addresses of the gateways along the way to the destination
    by looking at the source of the “ICMP Time to Live Exceeded” packets returned.


    The traceroute tool sends UDP packets by default, but it can be made to use ICMP
    packets when run with the -I switch.


    Some gateways and firewalls are configured to drop UDP and ICMP packets and/or
    drop outgoing “ICMP Time to Live Exceeded” packets. This will cause traceroute
    to skip over such gateways and firewalls.


    Sometimes, firewalls are configured to allow packets whose source port is 20 (FTP-Data)
    or 53 (DNS). The -p option in traceroute therefore used to set the source port
    of outgoing UDP packets in order to attempt to take advantage of such firewall
    rules.


    # Prevent Incoming Traceroute Requests


    The following steps can be taken in order to prevent incoming traceroute requests
    from succeeding:


    +   * Configure your firewall to drop incoming UDP and ICMP packets.

    * Configure your firewall to drop outgoing “ICMP Time to Live Exceeded” packets.

    * If you must allow incoming UDP packets for DNS, configure your firewall to allow
    only incoming UDP packets with source port 53 (DNS) originating from specific
    DNS server IP addresses.


    # SUMMARY


    This chapter showed how potential intruders might use publicly available information
    to gain sensitive and critical information about the target organizations including
    how to obtain administrative contacts, domain names, network blocks, and MX records
    of the target’s network. After obtaining any of this information, an intruder
    will have a better idea of the target organization’s network architecture and
    administrative weaknesses. The information you gained from the techniques described
    in this chapter is instrumental in your learning about the process of network
    scanning and identification, which is the next step of the hacking methodology.'
  merge: -1
  img_proc: true
