- pgno: 220
  md: '# 166 Part III: Special Topics


    The preceding GET request can be created by using the http_get function. This
    request can then be used as a parameter to the send function, which sends the
    request to the target host on the socket opened by the http_open_sock function.
    Resultant data from the web server is read using the http_recv function, and its
    contents are stored in the myrec variable. After this is done, the socket descriptor
    is closed using http_close_socket. The contents of myrec are then examined for
    the substring 404, which would be present if the file did not exist on the web
    server. Then use the <operator, which checks for a substring in a given string
    variable. If 404 is not found in the returned data from the web server, then it
    is probable that this file exists, and this fact is indicated to Nessus by calling
    the security_hole function.

    Please see http://www.nessus.org/doc/nasl2_reference.pdf for the latest NASL reference
    manual.


    # Running the Plug-in


    Make sure the preceding script is placed in Nessus''s plugins directory. The filename
    of the script must end with the extension "nasl." Run the Nessus GUI and select
    the Plugins tab. Make sure CGI Abuses are selected. Highlight CGI Abuses and make
    sure the plug-in with the name "Checks for /src/passwd.inc" is enabled. If you
    have trouble finding the plug-in, click the Filter button and perform a search
    for the ID of 99999.

    To get a positive result from our plug-in, you must have a local web server configured
    to serve the /src/passwd.inc file. If you have an Apache web server running on
    a host, simply create the /src/passwd file in the web root of the web server using
    the touch command:


    ```

    mkdir /var/www/html/src

    touch /var/www/html/src/passwd

    ```


    Input the IP address or name of the target web server in the Selection tab and
    click Start The Scan. If everything goes well, Nessus will detect and report our
    custom vulnerability, as shown in Figure 10-2.'
