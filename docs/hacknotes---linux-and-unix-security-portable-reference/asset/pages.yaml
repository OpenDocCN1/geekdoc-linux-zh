    ```


    > Sometimes, a single web server can be used to serve content for multiple domain
    names. In such cases, the specific domain name must be specified in the request.
    This can be done by typing "Host: domain-name" after the GET request. For example:

    GET / HTTP/1.0[enter]

    Host: www.domainname.com[enter][enter]


    # Change the HTTP Server Banner


    If you are running Apache, edit your httpd.conf file and make sure the following
    directives are present:


