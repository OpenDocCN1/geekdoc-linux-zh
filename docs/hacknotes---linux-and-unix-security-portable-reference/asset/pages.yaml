    Figure 4-3. Nessus in action


    saved in various formats, including HTML. Nessus is available at http://www.nessus.org/.


    Nessus is designed to support a client/server architecture. The Nessus server
    (nessusd) is in charge of performing vulnerability checks against target hosts.
    The Nessus client program (nessus) can be used to connect to the server to configure
    and spawn checks. Comunication between the Nessus client and server is encrypted.


    Since the design of Nessus is very modular, it is easy to write your own security
    checks. Nessus security checks can be written using the C programming language
    or Nessus’s NASL (Nessus Attack Scripting Language). See Chapter 10 for details
    on NASL.


    # OBTAINING A SHELL


    Once an attacker is successful in exploiting a remote service or application by
    remotely executing arbitrary commands on the victim host, or she will want to
    obtain a remote shell in order to continue exploiting the victim host.'
