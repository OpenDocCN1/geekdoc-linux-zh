  md: '# Querying RIR Records by an IP Address or Network Block


    To find out which organization is the owner of a particular block of IP addresses,
    try this form of the command:

    whois -h whois.riwhhoisserver.net ipaddressblock


    The address 192.168.1.0/24 falls under an allocated block of IP addresses that
    are not routable. For more information on nonroutable IP ranges, please see RFC
    1918, available at http://www.faqs.org/rfc/rfc1918.html. Let us pretend that 192.168.1.0/24
    is a valid and routable IP range for the purposes of our example. If we were to
    search whois.arin.net for this block, we would have to attempt such a query:


