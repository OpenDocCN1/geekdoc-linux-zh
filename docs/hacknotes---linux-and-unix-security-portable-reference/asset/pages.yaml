- pgno: 166
  md: '# EXPLOITING LOCAL TRUST


    Any vulnerabilities allow intruders to gain nonprivileged access to remote hosts.
    After obtaining normal user privileges, the next logical step for an intruder
    is to gain root (superuser) access. In addition to external intruders, malicious
    users may also attempt to exploit local vulnerabilities in order to obtain superuser
    privileges.


    The act of elevating privileges to that of the superuser is usually referred to
    as privilege escalation. This chapter describes various methods an individual
    with normal user privileges may attempt to obtain superuser privileges.


    In most cases, firewalls are configured to restrict access from external hosts
    and networks. Traffic on the loopback interface (127.0.0.1) is often unrestricted.
    In fact, filtering traffic on the loopback interface may cause many applications
    to break. A local user may use this condition to his advantage and attempt to
    scan, enumerate, and exploit services that aren’t accessible remotely. Therefore,
    once an attacker has gained local user access to a host, he or she may attempt
    all the hacking techniques described in the previous chapters of this book in
    order to escalate privileges.


    # GROUP MEMBERSH AND INCORRECT FILE PERMISSIONS


    Incorrect file permissions may allow a malicious user to read or write to files
    that they do not have access to. The following sections describe how a malicious
    user may exploit incorrect file permissions to escalate his or her privileges.


    # Find Group-Owned Files


    Suppose an intruder has gained access to the local account “joe.” He or she may
    find out all the groups “joe” belongs to issuing the id command:


    ```

    [bash]$ id

    uid=500(joe) gid=500(joe) groups=500(joe),501(proj1)

    ```'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'After noticing that "joe" belongs to the group "proj1," the intruder may issue
    the following command, which will list all the files owned by the "proj1" group:


    ```

    $bash$ find / -group proj1 -print 2> /dev/null

    /var/proj1/main.c

    /var/proj1/main.o

    /var/proj1/README

    /var/proj1/pass.txt

    /var/log/proji

    ```


    Now, the intruder knows exactly what "proj1" files "joe" has access to. One of
    these files, pass.txt, may seem pretty interesting:


    ```

    $bash$ more /var/proj1/pass.txt

    Note that this program authenticates to the MySQL database with the system password
    "r00t3rp455.w."

    ```


    Administrators often reuse passwords. If the victim''s root password was the same
    as the MySQL password shown in the preceding note, the intruder may gain root
    privileges by issuing the command:


    ```

    $bash$ su

    Password:r00t3rp455

    $bash# id

    uid=0(root) gid=0(root) groups=0(root), 1(bin), 2(daemon), 3(sys), 4 (adm), 6(disk),
    10(wheel)

    ```


    # Find World-Readable and -Writable Files


    In addition to searching for world-readable files, it is also possible to search
    for world-readable files that a user may have access to. For example, here is
    how you would search for all world-readable files present in the /etc directory:


    ```

    $bash$ find /etc -type f -perm -4 -print 2> /dev/null

    ```


    Many files in /etc should not be world-readable. For example, the /etc/shadow
    file contains encrypted passwords of users. Anyone with access to this file may
    use brute-force crack user passwords using tools like John the Ripper.


    An intruder may attempt to search for world-writable files by issuing the following
    command:


    ```

    $bash$ find / -type f -perm -2 -print 2> /dev/null

    /usr/sbin/in.telnetd

    ```'
