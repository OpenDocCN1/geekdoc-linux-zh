- pgno: 85
  md: '# Chapter 2: Scanning and Identification 31


    # # Window


    This type of scan, while similar to the ACK scan, sometimes helps detect open,
    filtered, and unfiltered ports on some systems due to an anomaly in the way TCP
    window sizes are reported.


    # ## Window Scans


    Window scans can be performed by potential intruders using nmap with the -sW flag:


    ```

    nmap -sW target_address

    ```


    # ## UDP


    In order to determine if a host is listening on a particular UDP port, a UDP packet
    is sent to the port. If the target host is not listening on the particular port,
    an ICMP port unreachable packet is received. However, if the target host is listening
    on the particular port, no such packet is received. Since UDP is not a connection-oriented
    protocol, UDP scanning is unreliable.


    # ## UDP Port Scanning


    Using the -sU option in nmap will perform UDP scanning:


    ```

    [bash]# nmap -sU 192.168.1.100

    ```


    Starting nmap V. 2.54BETA31 ( with insecure.org/nmap/ )

    Interrupting ports on (192.168.1.100):

    nThe 1454 ports scanned but not shown below are in state: (closed)


    | Port | State | domain |

    |---|---|-|

    | 53/udp | open | |


    # ## Defend Against Port Scanning


    You can use these methods to counter scans directed at your networks:


    +   - Configure your firewall to drop packets destined for closed ports. This
    will slow down scans directed toward your network, since this will cause the port
    scan applications to respond SYN packets after the timeout value is exceeded.
    Only after repeated timeouts, the port scan application will assume the port to
    be filtered, and will move on to the next set of ports.

    - Most firewalls and IDSs have the ability to detect port scans, and routinely
    watch your logs.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# 32 Part I: Hacking Techniques and Defenses


    +   - Configure your firewall to not trust source port values. Stateful firewalls
    have the ability to allow source port 20 packets only from FTP servers to whom
    are known to have established. In any case, the use of a clear-text protocol such
    as FTP is not recommended. Better alternatives (such as SSH) exist and should
    be used instead. In addition, do not allow incoming TCP packets with the source
    port set to 53 unless they are destined for your DNS servers that need to perform
    transfers. Restrict DNS traffic by IP addresses of the DNS servers authorized
    to serve your hosts.


    +   - Most FTP servers do not allow clients to use an IP address of a host other
    than that of the client. This will prevent bounce scans. Check your FTP server
    documentation and configurations for details.


    +   - Configure your firewalls to drop or reset connection attempts to the ident
    port (113).


    +   - Use a stateful firewall. This will prevent most of the scans mentioned in
    the preceding text.


    # # FINGERPRINTING


    Though many system designers do their best to follow relevant RFCs, the operating
    system kernel sometimes interpret details differently. Tools such as Xprobe and
    Nmap probe for such differences in order to fingerprint the target operating systems.


    # ## Fingerprinting Operating Systems Using Xprobe


    Xprobe uses ICMP packets to perform fingerprinting. Results are sorted by scores
    assigned to best guesses of the operating systems. This tool, has the ability
    to distinguish between filtering devices along the path to the destination, is
    available at http://www.sys-security.com/html/tools/tools.html.


    Here is an example of how to use Xprobe:


    ```

    [bash] xprobe -v target.somecompanyexample.com

    ```


