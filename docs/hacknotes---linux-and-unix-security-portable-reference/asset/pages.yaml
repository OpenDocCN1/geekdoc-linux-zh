- pgno: 120
  md: '# Part I: Hacking Techniques and Defenses


    # Connection Theft


    When an FTP client sends a PASV (passive) command after a PORT command along with
    its IP address and port number, the server begins to listen for a connection at
    the requested port. At this time, a malicious user may connect to the server''s
    port before the client. Depending on the next command issued by the FTP client,
    the malicious user may now have access to the data transmitted.


    If passive mode is not used, then the FTP session resorts to “active” mode. In
    this mode, it is the client that begins to listen at a specified port. At this
    time, an attacker may connect to the client before the FTP server. Depending on
    the next command issued by the client, the attacker may pose as the legitimate
    server and may transmit files or data to the client.


    # Prevent Connection Theft Attacks


    The following recommendations will help protect against connection theft attacks:


    +   - Configure your FTP server to only allow connections to its data ports from
    the IP address of an authenticated client. Most FTP servers do this by default.
    Note that this might not prevent attacks where both the attacker and the legitimate
    FTP user are behind the same NAT gateway, since their source IP addresses will
    be the same.

    - Configure your FTP client to only accept connections from the FTP server to
    which it is connected.


    Software Vulnerabilities WU-FTPD is the most used FTP daemon on Unix and Linux.
    Unfortunately, its history has been plagued by vulnerabilities for many remote
    exploits have been known to exist. Following is a list of some known WU-FTPD vulnerabilities:


    +   - File Globbing Heap Corruption Vulnerability WU-FTPD’s “file globbing” feature
    allows clients to organize files by patterns. Certain patterns were found to cause
    heap corruption in the WU-FTPD processes. This vulnerability made it possible
    for an attacker to execute arbitrary commands on a vulnerable WU-FTPD server by
    sending specially crafted data as input. See http://online.securityfocus.com/bid/3581
    for more details.

    - SITE EXEC Vulnerability Older versions of WU-FTPD contained a vulnerability
    in their “SITE EXEC” feature. This'
