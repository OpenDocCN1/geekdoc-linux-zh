- pgno: 19
  md: '# INTRODUCTION


    This book will teach you exactly how hackers think so that you can protect your
    Unix and Linux systems from them. There is simply no other way to learn how to
    prevent your systems from being compromised. In order to stop the attacks of the
    most sophisticated hackers, you need to understand their thought processes, techniques,
    and tactics. The powerful nature of the Unix and Linux operating systems is a
    two-edged sword. In most cases, the operating system kernel source code is available
    for free, and an administrator can go so far as to change the system internals
    to suit his or her needs. But this powerful and flexible nature of Unix and Linux
    includes an enormous amount of complexity, which increases the likelihood of possible
    misconfigurations that can easily place a system at risk. Consider also the many
    different flavors of Unix and Linux distributions available today. Every distribution
    comes bundled with its own set of security policies and configurations. For example,
    some distributions leave a set of remote services turned off, while others turn
    on all possible services that have been configured with the weakest possible policies.
    Hackers are aware of the administrative complexities of managing Unix and Linux
    hosts, and they know exactly how to abuse them. This book will amaze you with
    details of the craftiest hacker tactics, and it will teach you how to defend against
    them.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# HackNotes Linux and Unix Security Portable Reference


    Don''t worry about hackers getting hold of the material presented in this book.
    They already know it. The intention of this book is to expose the tactics used
    by hackers today, so that you can learn to protect against them. Once you understand
    how hackers think and the many different methods they use to break into systems,
    the odds will be in your favor.


    # How This Book Is Organized


    This book has been divided into four major sections:


    # Part I: Hacking Techniques & Defenses


    Part I of the book follows the common hacking methodology that is being used by
    hackers today. Defenses against all the hacking techniques described in these
    chapters are also presented.


    +   **Chapter 1** We begin by understanding the first logical step in hacking
    methodology: footprinting. This chapter will teach you how hackers obtain publicly
    available information from search engines, registrar records, DNS records, and
    more. Once hackers have obtained all possible information from publicly available
    sources, they move on to actual network and host identification and scanning.


    +   **Chapter 2** This chapter teaches you how to determine which hosts on a network
    are alive and what ports they open. Various types of port scanning methods are
    discussed, along with operating system identification techniques and tools.


    +   **Chapter 3** Learn how hackers identify applications and services running
    on remote hosts. This chapter will show you the many different tools and methods
    used by potential intruders to enumerate usernames and remote services.


    +   **Chapter 4** This chapter exposes the fact and tactics used by hackers to
    gain access to vulnerable hosts. Learn the craftiest techniques being used by
    hackers, such as brute-forcing, sniffing, man-in-the-middle attacks, password
    cracking, port redirection, exploits against misconfigurations, buffer overflows,
    and many other software vulnerabilities.


    +   **Chapter 5** Often, the exploitation of a specific vulnerability yields a
    hacker access to unprivileged user or system accounts. In such cases, the next
    logical step for a hacker is to obtain superuser (root) privileges. This chapter
    shows you the many different ways hackers attempt to obtain higher privileges.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Chapter 6 Once a host is compromised, the hacker will want to hide his or
    presence and ensure continued privileged access to the host. This chapter shows
    you how hackers hide their tracks by cleaning portant log files, and how hackers
    install Trojans, backdoors, and rootkits onto compromised hosts.


    # Part II: Host Hardening


    Part II of the book focuses on the many steps that can be taken by system administrators
    to harden default system configurations and policies.


    # Chapter 7 Important configuration issues relating to the hardening of default
    application and server configurations are discussed in this chapter. All system
    administrators are strongly encouraged to consider the recommendations presented
    in this chapter to prevent intruders from exploiting weak system policies and
    configurations.


    # Chapter 8 Malicious users and hackers often take advantage of proper user and
    file-system permissions. This chapter will introduce you to Unix and Linux file
    permissions, and it will teach you the exact steps to be taken in order to protect
    against compromises due to poor user and file-system permissions.


    # Chapter 9 Every system administrator should enforce proper system event logging.
    This chapter teaches you how to enable and configure logging services, and how
    to properly set permissions on log files to prevent them from being tampered with.
    It is also very important to stay up to date with the latest security patches,
    and this chapter provides useful links to vendor web sites where these can be
    obtained.


    # Part III: Special Topics


    Part III of the book rounds up some exciting topics, ranging from plug-ins for
    the Nessus scanner, to wireless hacking, to hacking with the Zaurus PDA.


    # Chapter 10 Nessus is one of the most popular vulnerability scanning tool available.
    It is also free and very modular by design. This chapter will teach you how to
    write a custom vulnerability check plug-in for the Nessus scanner using NASL (Nessus
    Attack Scripting Language).


    # Chapter 11 Learn how hackers penetrate 802.11 wireless networks. This chapter
    teaches you the weaknesses of the WEP protocol and introduces the tools used by
    hackers to exploit wireless networks. In addition, this chapter offers recommendations
    and suggestions on how to better secure wireless networks.'
