- pgno: 177
  md: 'Alternatively, an intruder may add an entry to root’s crontab file and use
    Netcat (nc) to routinely initiate an outbound connection to an external host and
    serve a shell. Of course, the host must be configured to listen for an inbound
    connection using Netcat’s -l option.


    # Prevent Remote Shell Service Installations


    The following actions help prevent and detect remote shell installations:


    +   - Tighten your firewall rules as much as possible. Make sure also to restrict
    outbound connections. For example, host whose only purpose is to act as a web
    server must not be allowed to initiate outbound connections on any port.

    - Disable and uninstall xinetd or inetd if no relevant services are in use.

    - Use netstat to check what ports a host is listening on and their associated
    processes:

    netstat -nap


    # Setuid and Setgid Shells Owned by root


    Setuid and setgid programs run with the privileges of the file owner or group.
    An intruder who has gained root privileges may place a copy of /bin/bash in a
    different location and use chmod command with the +s parameter to set the setuid
    flag on it. After this is done, the intruder may log in with a nonroot account
    and simply run the setuid’s shell executable to obtain a root shell.


    > It is a good idea to routinely audit the file system for setuid and setgid executables.
    To find setuid files, run find / -perm -4000 -type f -print 2 > /dev/null


    > To find setgid files, run find / -perm -2000 -type f -print 2 > /dev/null


    # Changing a Local Account’s uid to 0


    The root account has a user (uid) equal to 0. If another account’s uid is set
    to 0, this account will gain root privileges.


    # Assign a Local User uid of 0


    Consider the following entry in /etc/passwd for the user joe:

    je:x:500:500::/home/joe:/bin/bash'
  merge: -1
  img_proc: true
