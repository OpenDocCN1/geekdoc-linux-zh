- pgno: 15
  md: '# HACKNOTES: THE SERIES


    CGraw-Hill/Osborne has created a brand new series of portable reference books
    for security professionals. These are quick-study books kept to an acceptable
    number of pages and meant to be a truly portable reference.


    The goals of the HackNotes series are


    +   - To provide quality, condensed security information that is easy to access
    and use.


    +   - To educate you how to protect your network or system by showing how hackers
    and criminals leverage known methods to break into systems and best practices
    in order to defend against hack attacks.


    +   - To get someone new to the security topics covered in each book to speed
    quickly, and to provide a concise source of knowledge. To do this, you may find
    yourself needing and referring to time and again.


    The books in the HackNotes series are designed so they can be easily carried with
    you or towed in your computer bag without added weight and without attracting
    unwanted attention while you are using them. They make of charts, tables and bulleted
    lists as much as possible and only use screen shots if they are integral to getting
    across the point of the topic. Most importantly, so that these handy portable
    references don''t burden you with unnecessary verbiage to wade through during
    your busy day, we have kept the writing clear, concise, and to the point.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# XVI HackNotes Linux and Unix Security Portable Reference


    Whether you are brand new to the information security field and need useful starting
    points and essential facts without having to search through 400+ pages, whether
    you are a seasoned professional who knows the value of using a handbook as a peripheral
    brain that contains a wealth of useful lists, tables, and specific details for
    a fast confirmation, or as a handy reference to a somewhat unfamiliar security
    topic, as HackNotes series will help you get where you want to go.


    # Key Series Elements and Icons


    Every attempt was made to organize and present this book as logically as possible.
    A compact form used and page tags were put into mark primary heading topics. Since
    the Reference Center contains information and tables you''ll want to access quickly
    and easily, it has been strategically placed on blue pages directly in the center
    of the book, for your convenience.


    # Visual Cues


    The icons used throughout this book make it very easy to navigate. Every hacking
    technique or attack is highlighted with a special sword icon.


    > This Icon Represents a Hacking Technique or Attack

    Get detailed information on the various techniques and tactics used by hackers
    to break into vulnerable systems.

    Every hacking technique or attack is also countered with a defensive measure when
    possible, which also has its own special shield icon.


    +   This Icon Represents Defense Steps to Counter Hacking Techniques and Attacks

    Get concise details on how to defend against the presented hacking technique or
    attack.

    There are other special elements used in the HackNotes design containing little
    nuggets of information that are set off from general text so they catch your attention.


    This "i" icon represents reminders of information, knowledge that should be remembered
    while reading the contents of a particular section.


    This flame icon represents a hot item or an important issue that should not be
    overlooked in order to avoid various pitfalls.'
  merge: -1
  img_proc: true
