- pgno: 175
  md: '# Disable Shell History


    In order to disable command history logging, an intruder may set the shell''s
    history file to be a symbolic link to /dev/null:


    ```

    [bash]# rm -rf /root/.bash_history

    [bash]# ln -s /dev/null /root/.bash_history

    ```


    Now, any process that attempts to write to /root/.bash_history will really be
    writing to /dev/null, which is a special file that contains nothing. This will
    cause all history data written by the bash shell to be discarded.


    # Enable System Auditing and Logging


    The purpose of the history files is to help users recall recently executed commands.
    It was never designed to provide any sort of logging mechanism from a security
    point of view. Information contained in a user''s shell history file should not
    be trusted as the users may delete or edit this file to contain any information
    they wish. Instead, administrators should concentrate their efforts towards enabling
    and hardening system auditing and logging policies as described in Part II of
    this book.


    # Cleaning /var


    The /var directory usually contains the following files:


    +   - utmp and wtmp Contain information about users that are logged on to the
    system

    - messages and secure Used by the syslog daemon to record logging information
    submitted by various applications and daemons

    - xferlog Used by FTP daemons to record data transfer requests

    - maillog Used by SMTP servers to record mail transfers

    - lastlog Contains information about users who have recently logged in


    An intruder may manually edit the files just listed to conceal his or her presence.
    Most often, intruders make use of automated tools such as zap3 to accomplish this
    task. The zap3 tool can clean utmp,'
  merge: -1
  img_proc: true
- pgno: 176
  md: "# 122 Part I: Hacking Techniques and Defenses\n\nwtmp, messages, secure, and\
    \ lastlog. It is available from http://www.packetstormsecurity.org/\nIn addition,\
    \ an intruder may disable logging services such as syslogd and modify its configuration\
    \ files (syslog.conf) to log to a file as /dev/null.\n\n# BACKDOORS\n\nOnce an\
    \ intruder has gained access to a system, he or she will likely want to maintain\
    \ his or her privileged status. This section covers different methods a sophisticated\
    \ hacker may use to ensure continued access to a compromised host.\n\n# Install\
    \ a Remote Shell Service\n\nAn intruder may add an entry to the inetd conf or\
    \ the xinetd directory to cause inetd or xinetd to serve a remote shell on a specific\
    \ port. This can be done by configuring inetd or xinetd to execute /bin/bash or\
    \ any other command shell. Once this is accomplished, an attacker may telnet to\
    \ the remote port to gain a remote shell.\nFor example, an attacker may place\
    \ the following contents into the file /etc/xinetd.d/domain:\n\n```\nservice domain\n\
    {\n    socket_type = stream\n    wait = no\n    user = root\n    server = /bin/bash\n\
    \    server_args = -i\n}\n```\n\nIn order for this code to take effect, xinetd\
    \ must be restarted. Now, when the attacker telnets to port 53 (domain) of the\
    \ victim host, he or she will be presented with a root shell:\n\n```\n[bash]$\
    \ telnet victim's_ip_address 53\nTrying 10.0.0.1...\nConnected to 10.0.0.1.\n\
    Escape character is '^'.\nstty: standard input: Invalid argument\nreadline: warning:\
    \ rl_prep_terminal: cannot get terminal\nsettings\n[root@eminem]# id\nuid=0(root)\
    \ gid=0(root)\n```"
  merge: -1
