    could cause the POP3 server to respond with malicious data in order to execute
    arbitrary commands on the Netscape/Mozilla user''s host. More information is available
    at http://securityfocus.com/bid/6254.


    # BitchX Remote Heap Corruption Vulnerability


    BitchX is a popular IRC (Internet Relay Chat) client. When a long hostname was
    supplied to a BitchX client, a memory corruption condition was observed. This
    vulnerability could be abused by a malicious IRC server to execute commands on
    the host running BitchX. Information about this vulnerability is available at
    http://securityfocus.com/bid/7096.


    # PGP4Pine Long Message Buffer Overflow Vulnerability


    PGP4Pine adds PGP support to the Pine e-mail client. A vulnerability was found
    in PGP4Pine due to insufficient bounds checking of an e-mail containing PGP data.
    An attacker may send a maliciously crafted e-mail to exploit this vulnerability
    in order to execute arbitrary commands on the host running PGP4Pine. Please see
    the web site http://securityfocus.com/bid/7071 for more information.


    # Prevent Application Vulnerability Exploits


    The following recommendations are suggested in order to minimize susceptibility
    against application vulnerabilities:


    +   - Keep up-to-date with software patches.

    - Subscribe to vulnerability watch lists such as Bugtraq. (Visit http://securityfocus.com/cgi-bin/sfonline/subscribe.pl
    for more information. See the "Online Resources" section in the Reference Center
    of this book for pointers to any other security resources.)


    # NESSUS


    It is quite a laborious task to audit a large number of hosts for remote vulnerabilities.
    Nessus is a security scanner that can be used to run automated checks for vulnerabilities
    against a set of target hosts (see Figure 4-3). Although many commercial network
    scanners are available today, Nessus is worthy of special mention because it is
    free, open-source, reliable, and very flexible. After a scan is completed, Nessus
    provides the client with pretty vulnerability reports that can be'
