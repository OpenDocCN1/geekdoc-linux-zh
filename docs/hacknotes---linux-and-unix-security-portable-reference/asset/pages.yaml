  md: '# NULL


    This type of scan involves sending a TCP packet to the destination host with all
    the flags turned off in the TCP header. If the target host is listening on the
    particular port, it will not respond. Otherwise, it will send a RST packet.


    # NULL Scanning


    Using the -sN flag in nmap will perform a TCP NULL scan:


    ```

    [bash]# nmap -sN 192.168.1.100

    ```


