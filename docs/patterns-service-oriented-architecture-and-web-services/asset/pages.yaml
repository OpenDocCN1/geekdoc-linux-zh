    # 3.4.4 Broker application pattern


    The Broker application pattern, shown in Figure 3-8, is based on a 1-to-N topology
    that separates distribution rules from the applications. It allows a single interaction
    from the source application to be distributed to multiple target applications
    concurrently. This application pattern reduces the proliferation of point-to-point
    connections.


    ![](img/334ef4856dbfc14b1f371b2c8b5e06b2_71_0.png)


    Figure 3-8 Broker application pattern


    The Broker application pattern applies to solutions where the source application
    starts an interaction that is distributed to multiple target applications that
    are within the organization. It separates the application logic from the distribution'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'logic based on broker rules. The decomposition/recomposition of the interaction
    is managed by the broker rules tier.


    # Router variation


    Router variation of the Broker application pattern, shown in Figure 3-9, applies
    to solutions where the source application initiates an interaction that is forwarded
    to, at most, one of multiple target applications.


    ![](img/334ef4856dbfc14b1f371b2c8b5e06b2_72_0.png)


    Figure 3-9 Router variation


    In the Extended Enterprise domain, the Exposed Broker application pattern allows
    a single interaction from a partner''s source application to be distributed to
    multiple target partner applications concurrently.


    # Broker and SOA


    The Broker application pattern provides service consumers with some important
    benefits over the Direct Connection application pattern. It enables intelligent
    routing of service requests to multiple service providers, and decomposition and
    re-composition of these requests to match the service consumer''s needs. The Broker
    pattern supports the business requirements at the right time, allowing services
    to be easily pulled together and adapted at the integration layer.


    The separation of the service interface from the broker from its implementation
    on a target application helps address the likely differences in technology and
    information models. Legacy applications can be leveraged by wrapping them with
    service brokers so that they can participate in an SOA.


    # 3.4.5 Serial Process application pattern


    The Serial Process application pattern, shown in Figure 3-10 on page 56, extends
    the 1-to-N topology provided by the Broker application pattern by'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'facilitating the sequential execution of business services hosted by a number
    of target applications. Thus it enables the orchestration of a serial business
    process in response to an interaction initiated by the source application.


    # Secure Zone


    ![](img/334ef4856dbfc14b1f371b2c8b5e06b2_73_0.png)


    Figure 3-10 Serial Process application pattern


    The Serial Process application pattern separates the business process flow logic
    from individual application logic. The process logic is governed by serial process
    rules that define execution rules for each target application, together with control
    and data flow rules. It may also include any necessary adapter rules.


    In the Extended Enterprise domain, the Exposed Serial Process application pattern
    allows a single interaction from the partner’s source application to execute a
    sequence of target applications.


    # Serial Process and SOA


    The Serial Process application pattern supports the execution of business processes
    (or more specifically, the steps in process flows) in an orchestrated manner.
    These steps typically involve invoking services in a certain sequence to satisfy
    business requirements.


    As we have seen, service-oriented architecture creates self-contained and modular
    business functionality in terms of services with well-defined and documented interfaces.
    The service interface serves as a contract identifying the service, the functionality
    that it provides, the information that is needed and the service for invocation.


    With business processes needing services and SOA delivering services, this is
    a powerful and complementary fit. The agility that is enabled by this combination
    provides the flexibility needed by businesses to compete in this new economy.
    Process logic can be easily changed to include new services, exclude'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'existing services or simply re-sequence the execution of services. Obviously,
    not every step in a business process flow will leverage a service based on SOA
    and combinations of SOA-based services. Non-SOA services and human-provided services
    can be expected.


    Web services can be used to implement an SOA based on open standards. As discussed
    in 5.6.2, "Emerging standards for business process" on page 136, an emerging standard
    for business process execution and SOA within the Web services paradigm is BPEL4WS.
    It should be relatively easy to instantiate the Serial Process application pattern
    using Web services created by BPEL4WS-compliant products.


    Tools, such as the Process editor in IBM WebSphere Studio Application Developer
    Integration Edition, can already be used to define a business process involving
    Web services, other applications, and human interactions. The process composed
    and tested in Studio can then be deployed to IBM WebSphere Application Server
    Enterprise V5.0.


    See IBM Redbook Patterns: Serial and Parallel Processes for Choreography and Workflow,
    SG24-6306, for further details.


    # 3.4.6 Parallel Process application pattern


    The Parallel Process application pattern, shown in Figure 3-11, extends the basic
    serial process orchestration capability provided by the Serial Process pattern
    by supporting parallel (concurrent) execution of the sub-processes.


    ![](img/334ef4856dbfc14b1f371b2c8b5e06b2_74_0.png)


    Figure 3-11 Parallel Process application pattern'
  merge: -1
  pgno: 74
- img_proc: true
  md: 'The Parallel Process Rules support all the services provided by the serial
    process rules within the Serial Process application pattern. In addition, the
    interaction initiated by the source application may control parallel (concurrent)
    sub-processes on multiple target applications. Each sub-process may consist of
    a sequence of operations executed in succession on a target application. Parallelism
    requires additional start and join conditions be defined for sub-processes executing
    in parallel. This requires sophisticated runtime engines that can initiate parallel
    threads of control, and ensure these threads upon completion, and manage them
    as a unit (for example, to allow cancellation of the process or report its status).


    # Parallel Process and SOA


    The discussions in "Direct Connection and SOA" on page 53, "Broker and SOA" on
    page 55, and "Serial Process and SOA" on page 56 also apply for the Parallel Application
    pattern.


    We introduced the concept of a simple service bus in "Direct Connection and SOA"
    on page 53. Each of the subsequent application patterns adds important capabilities
    to this simple service bus, concluding with the Parallel Application pattern.
    We end up with a very sophisticated pattern that can support all of the capabilities
    of a true Enterprise Service Bus, as discussed 2.4, "Enterprise Service Bus" on
    page 38.


    # 3.5 Runtime patterns


    A Runtime pattern uses nodes to group functional and operational components. The
    nodes are interconnected to solve a business problem. Each Application pattern
    leads to one or more underpinning Runtime patterns.


    We can overlay the Application pattern over the Runtime pattern to identify where
    business logic is deployed on nodes. The Runtime patterns covered some typical
    examples of possible solutions, but should not be considered exhaustive.


    > Note: In this section we review Runtime patterns for Direct Connection and the
    Router variation of Broker, in the context of service-oriented architecture. Look
    details for the other runtime patterns in a future IBM Redbook.


    # 3.5.1 Node types


    A Runtime pattern consists of several nodes representing specific functions. Most
    Runtime patterns consist of a core set of common nodes, with the addition'
  merge: -1
  pgno: 75
- img_proc: true
  md: 'of one or more nodes unique to that pattern. To understand the Runtime pattern,
    you will need to review the following node definitions.


    # Application Server/Services


    The Application Server/Services node provides the infrastructure for application
    logic and can be part of a Web application server. It is capable of running both
    presentation and business logic, but generally does not serve HTTP requests. When
    used with a Web server redirector, the Application Server/Services node can run
    both presentation and business logic. In other situations, it can be used for
    business logic only. The Application Server/Services node supports hosting of
    Web applications.


    Applications may also rely on services provided by their hosting server to interact
    with other applications. Examples of services provided by the Application Server/Services
    node include:


    +   * TCP/IP pipe established using the hosting operating system

    * A servlet or EJB invoked by WebSphere Application Server

    * The JMS or J2EE Connector APIs provided by WebSphere


    # Connector


    Connectors provide the connectivity between two components. A connector is always
    present to facilitate interaction between two components.


    Depending on the required level of detail, a connector can be:


    +   * A primitive (or unmodeled) connector, represented by a simple line between
    components

    * A component (or modeled) connector, represented by a rectangle on a line between
    components


    A connector may be an adapter connector, a path connector, or both.


    See also:


    +   * “Adapter connector” on page 59

    * “Path connector” on page 60


    # Adapter connector


    Adapter connectors are concerned with enabling logical connectivity by bridging
    the gap between the context schema and protocols used by the source and target
    components. An adapter connector is one that supports the transformation of data
    and protocols.'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# Path connector


    Path connectors are concerned with providing physical connectivity between components.
    A path connector may be very complex (for example, the Internet) or very simple
    (an area of shared storage).


    # Rules repository


    The rules repository contains the rules generally used to control the mode of
    operation of an interaction, depending on external factors. Examples of rules
    are:


    +   - Business data mapping rules (for adapter connectors)

    - Autonomic rules (such as priority in a shared environment)

    - Security rules

    - Capacity and availability rules


    The rules repository may or not exist. If it does, it could still be left off
    the Runtime pattern, for example, when analysis determines that interaction rules
    are not an important part of the solution.


    # Router


    The Router node is a variation of the Broker node. It allows a single interaction
    from a source component to be switched and adapted to only one of multiple target
    components. It separates the application logic from the distribution logic based
    on router rules.


    # Domain QoS providers


    The integration pattern for a domain is composed of a topology pattern and domain
    QoS providers. Intra-enterprise integration and inter-enterprise integration are
    both examples of domains. This combination of topology pattern and QoS providers
    is used to describe observed patterns in the domain:


    > Integration pattern = topology pattern + QoS providers


    The QoS capabilities framework can be used to address the particular concerns
    for the domain:


    +   - Autonomic

    - Availability

    - Federation

    - Performance

    - Security

    - Standards compliance

    - Transactional'
  merge: -1
  pgno: 77
- img_proc: true
  md: 'The domain QoS providers may or not exist. If they do exist, they can still
    be left off the Runtime pattern, for example, when analysis determines that domain
    QoS providers are not an important part of the solution.


    # Protocol firewall node


    A firewall is a hardware/software system that manages the flow of information
    between the Internet and an organization''s private network. Firewalls prevent
    unauthorized Internet users from accessing private networks connected to the Internet,
    especially intranets, and can block some virus attacks (as long as those viruses
    are coming from the Internet). A firewall can separate two or more parts of a
    local network to control data exchange between departments. Components of firewalls
    include filters or screens, each of which controls transmission of certain classes
    of traffic. Firewalls provide the first line of defense for protecting private
    information, but comprehensive security systems combine firewalls with encryption
    and other complementary services, such as content filters and intrusion detection.


    Firewalls control access from a less trusted network to a more trusted network.
    Traditional implementations of firewall services include:


    +   * Screening routers (the protocol firewall)

    * Application gateways (the domain firewall)


    A pair of firewall nodes provides increasing levels of protection at the expense
    of increasing computing resource requirements. The protocol firewall is typically
    implemented as an IP router.


    # Domain firewall node


    The domain firewall is usually implemented as a dedicated server node.


    A domain is usually used to separate a secure zone, such as the internal network,
    from a demilitarized zone. This provides added security protection from the un-secure
    zone, such as the Internet.


    # Partner infrastructure


    Partner infrastructure includes the partner''s installed applications, data, computing,
    and network infrastructure. Partner infrastructure has unspecified internal characteristics;
    only the means with which to interact it are specified.


    # Inter-enterprise network infrastructure


    Inter-enterprise network infrastructure includes the network infrastructure allowing
    connectivity between enterprises. Inter-enterprise network infrastructure has
    unspecified internal characteristics; only the means with which to interact it
    are specified.'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# 3.5.2 Runtime patterns for Direct Connection


    When using the Direct Connection runtime pattern, shown in Figure 3-12 on page
    63, the source application uses a connector to access the target application.


    The connector itself may be explicitly or implicitly modeled. If the connector
    is explicitly modeled, the modeler may use decomposition and abstraction techniques
    to expand the connector to the appropriate level of detail.


    The term *Connector* may be qualified by both the connector variation and by the
    interaction variation. Some examples are:


    +   * Adapter Connector

    * Path Connector

    * Message Connector

    * Call Connector

    * Call Adapter Connector


    The source and target applications both rely on services provided by their respective
    hosting servers. These are modeled using the *Application Server/Services* node.


    The Rules Repository and Domain QoS Providers may or may not exist. If they do
    exist, it is a modeling decision as to whether they need to be shown in the Runtime
    pattern. For example, analysis may determine that connection rules are not an
    important part of the solution, so the Rules Repository may be left off the Runtime
