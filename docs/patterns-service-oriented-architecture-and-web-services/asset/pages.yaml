    #  2.1.4 Service-oriented architecture benefits


    As discussed earlier, businesses are dealing with two fundamental concerns: The
    ability to change quickly, and the need to reduce costs. To remain competitive
    businesses must adapt quickly to internal factors such as acquisitions and restructuring,
    or external factors like competitive forces and customer requirements. Cost-effective,
    flexible IT infrastructure is needed to support the business.


    With a service-oriented architecture, we can realize several benefits to help
    organizations succeed in the dynamic business landscape of today:


    +   - Leverage existing assets.


    SOAs provide a layer of abstraction that enables an organization to continue leveraging
    its investment in IT by wrapping these assets as services that provide business
    functions. Organizations potentially can continue getting value out of existing
    resources instead of having to rebuild from scratch.


    +   - Easier to integrate and manage complexity.


    The integration point in a service-oriented architecture is the service specification
    and not the implementation. This provides implementation transparency and minimizes
    the impact when infrastructure and implementation changes occur. By providing
    a service specification in front of existing resources and assets built on disparate
    systems, integration becomes more manageable as complexities are isolated. This
    becomes even more important as businesses work together to provide the value chain.


    +   - More responsive and faster time-to-market.


    The ability to compose new services from existing ones provides a distinct advantage
    to an organization that has to be agile to respond to demanding business needs.
    Leveraging existing components and services reduces the time needed to go through
    the software development cycle of gathering requirements, performing design, development
    and testing. This leads to rapid development of new business services and allows
    an organization to respond quickly to changes and reduce the time-to-market.


    +   - Reduce cost and increase reuse.'
