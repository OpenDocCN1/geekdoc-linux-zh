    # 10.2 The on demand operating environment


    So what is an on demand operating environment? It is not a specific set of hardware
    and software. Rather, it is an environment that supports the needs of the business,
    allowing it to become and remain responsive, variable, focused, and resilient.


    An on demand operating environment unlocks the value within the IT infrastructure
    to be applied to solving business problems. It is an integrated platform, based
    on open standards, to enable rapid deployment and integration of business applications
    and processes. Combined with an environment that allows true virtualization and
    automation of the infrastructure, it enables delivery of IT capability on demand.


    An on demand operating environment must be:


    +   Flexible

    Self-managing

    Scalable

    Economical

    Resilient'
