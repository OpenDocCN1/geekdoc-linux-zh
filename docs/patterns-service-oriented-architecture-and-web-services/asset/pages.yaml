  md: 'There are two levels of service description:


    +   - Operational service description (XML and WSDL)


    +   - Complete service description


    # 5.4.1 XML


    XML is the de facto syntax to exchange message data between the Web service consumers
    and providers. It allows for a customized markup language with tags defined in
    a Document Type Definition (DTD) or XML Schema.


    DTD is inherently flawed, as it has limited data typing and cannot support date
    formats, numbers or other common data types. It uses its own language to define
    XML syntax which is not XML specification compliant and makes it difficult to
    manipulate a DTD programmatically.


    To solve these problems, the World Wide Web Consortium (W3C) defined a new standard
    to define XML documents called XML Schema. XML Schema provides the following advantages
    over DTDs:


    +   - Strong typing for elements and attributes


    +   - Standardized way to represent null values for elements


    +   - Key mechanism that is directly analogous to relational database foreign
    keys


    +   - Defined as XML documents, making them programmatically accessible


    XML is not a prerequisite for defining messages. Other formats such as OMG''s
    Interface Definition Language (IDL) or a simple fixed record format could be used
    instead. However, the parties must agree on what format to use. Where many organizations
    are involved, managing numerous non-standard message formats would be cumbersome.
    XML is gaining wide acceptance as the standard message format. Industry-specific
    vocabularies have also been developed in accounting, construction, education,
    finance, government, health care, insurance, legal, manufacturing, telecommunications
    and travel (to a name few!) to facilitate communication within industry.


    XML allows for the representation of data in a structured and structured format.
    It provides the syntax of a language but it does not convey the meaning associated
    with the data. Various industries may use the same word differently and they may
    have different words that mean the same thing.


    OASIS has developed the Universal Business Language (UBL) in an effort to define
    a common XML business document library. UBL will provide a set of XML building
    blocks and a framework that will enable trading partners to unambiguously identify
    and exchange business documents in specific contexts.'
