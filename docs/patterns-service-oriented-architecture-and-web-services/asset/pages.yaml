  md: '# UDDI Extensions from IBM alphaWorks


    The IBM alphaWorks UDDI Registry Extensions provide advanced UDDI search capabilities.
    They enable the formation of complex queries comprising criteria from two standard
    UDDI "find" APIs, find_business and find_service, in a single query. That is,
    the find_business API is extended with an embedded find_service API, and find_service
    with an embedded find_business API.


    The equivalent queries are complex and error-prone with the current UDDI search
    requester. The client search technology must perform two steps:


    +   1. Issue two queries: a find_business query and a find_service query.

    2. Process the two sets of results returned by the queries and find the appropriate
    intersection of the results.


    The UDDI Registry Extensions reduce client side programming complexities and make
    UDDI easier to use. They also reduce network bandwidth usage and improve performance.


    For more information on the UDDI Registry Extensions see:


    http://www.alphaworks.ibm.com/tech/uddiregistensions


    # 8.3.2 Service development considerations


    To enable the discovery of service location at runtime, we first need to establish
    a UDDI registry in our development/test environment and publish the service to
    it.


