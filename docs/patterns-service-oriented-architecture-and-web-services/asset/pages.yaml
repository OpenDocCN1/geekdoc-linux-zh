- img_proc: true
  md: '# 10.1 e-business on demand


    In October of 2002, IBM announced its vision of the next major phase of e-business
    adoption and called it e-business on demand. In fact, e-business demand is not
    just a vision, nor is it new. It is a statement of IBM''s belief how businesses
    will need to transform themselves to be successful. Businesses will have to adapt
    to cope with ever-increasing pressures from competition and other factors associated
    with the global economy. This implies a transformation to a fully integrated business
    across people, processes, and information, including suppliers and distributors,
    customers and employees.


    IBM defines an on demand business as an enterprise whose business processes, integrated
    end-to-end across the company and with key partners, suppliers, and customers,
    can respond with speed to any customer demand, market opportunity, or external
    threat.


    There are four key attributes of an on demand business:


    +   - Responsive: Able to sense and respond to dynamic, unpredictable changes
    in demand, supply, pricing, labor, competition, capital markets, and the needs
    of its customers, partners, suppliers, and employees.


    +   - Variable: Able to adapt processes and cost structures to reduce risk while
    maintaining high productivity and financial predictability.


    +   - Focused: Able to concentrate on its core competencies and differentiating
    capabilities.


    +   - Resilient: Able to manage changes and external threats while consistently
    meeting the needs of all its constituents.


    As shown in Figure 10-1 on page 303, IBM has identified the following three stages
    of the e-business on demand evolution that most organizations are currently going
    through:


    +   - Access: Transform the communication with Internet access, publish static
    information, and Web-enable simple processes.


    +   - Enterprise Integration: Transform the business processes by integrating
    internal processes and external value nets.


    +   - on-demand: Transform the business model to manage the operations dynamically,
    allowing the business to rapidly respond to market changes and opportunities,
    as well as deliver customized products and services in real-time.'
  merge: -1
  pgno: 319
