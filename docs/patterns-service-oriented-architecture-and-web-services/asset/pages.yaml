  md: '# 5.2.4 HTTPR


    Reliable HTTP (HTTP) was a proposed protocol for offering the reliable delivery
    of HTTP packets between a server and a client, but was withdrawn in favor of the
    OASIS evolving WS-ReliableMessaging standards. The HTTP proposal offers reliability
    by adding extensions to HTTP, whereas WS-ReliableMessaging, as covered in further
    detail in the following section, delivers reliability at the envelope level.


    # 5.2.5 Emerging standards for transport


    Commonly used transport protocols for Web services are currently dominated by
    HTTP, for reasons discussed in "Advantages of HTTP" on page 111. However, for
    enterprises to develop on Web services for business critical processing, more
    reliable transport protocols are required. Some emerging work in this area is
    discussed in this section.


    # WS-ReliableMessaging


    As discussed in "Disadvantages of JMS" on page 113, current reliable message transport
    mechanisms require connecting parties to be using the same infrastructure, as
    IBM WebSphere MQ. The WS-ReliableMessaging draft standard has been developed to
    provide a framework for interoperability between different transport infrastructures.


    The draft standard was released in March 2003 by IBM, BEA, and TIBCO. The protocol
    defined in the standard provides four delivery assurance descriptions that must
    be implemented by partners in the communication:


    +   - AtMostOnce

    - AtLeastOnce

    - ExactlyOnce

    - InOrder


    The WS-ReliableMessaging draft standard uses WS-Policy (see 5.8, "Policy" on page
    144) and associated standards as a framework for determining the capabilities
    and requirements of partners in a reliable messaging exchange. The authors also
    strongly recommend that communication be secured using WS-Security and associated
    standards (see 5.9.4, "Emerging standards for security" on page 151).


    # Where to find more information


    For more information on WS-ReliableMessaging, see:


    ```

    http://www.ibm.com/developerworks/webservices/library/ws-rm/

    http://www.ibm.com/developerworks/webservices/library/ws-rmimp/

    ```'
