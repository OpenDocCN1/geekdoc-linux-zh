    # Design alternative: Apache Axis or IBM SOAP


    These alternatives were provided in earlier releases of development tools and
    runtime environments from IBM than those discussed in this book. These options
    are retained in some cases for compatibility reasons. In general, we recommend
    that you do not use these alternatives unless specifically required by the services
    you are using, or to retain compatibility with other clients.


    # Implementation environments for providers and consumers


    If you are a Java programming model for your Web service provider or consumer,
    you have an additional choice of whether to implement the component as a Java
    bean or a session EJB. Where possible, you should consider using session EJBs,
    since these can be managed by the container, and therefore you can use system
    management techniques to manage quality of service characteristics. In addition,
    session EJBs allow you to implement fine-grained security (role-based security
    on individual methods).


    # 6.2.4 Object design considerations


    Since a top-down design approach was used for the sample application, the application
    designer is free to choose an implementation approach.


    Our implementation is based on the Supply Chain Management example application
    package with WebSphere Studio Application Developer V5.1. **New -> Example...**
    to add this to your Studio workspace by selecting **File** from the main menu.
