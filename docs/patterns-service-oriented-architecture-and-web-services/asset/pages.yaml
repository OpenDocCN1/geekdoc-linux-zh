    # 4.3.4 Service allocation


    We have identified all the required services through a combination of domain decomposition
    and goal-service modeling. In this step, service allocation, we ensure that all
    the services identified a "home" and that they are all traceable to business goals
    and components.


    In this way we not only ensure that every service has business value, but that
    all the services have been identified. Importantly, we are also managing the proliferation
    of services, like objects in the object-oriented paradigm, services tend to proliferate
    if not carefully managed.


    Service allocation asks who (which component) will provide the implementation
    and management of each service. The answer will depend on whether you are a service
    provider or consumer.


    Service consumers want the flexibility to replace an implementation based on new
    functional requirements, non-functional characteristics (such as higher volume
    handled, less down time), and economic factors (such as cheaper service).


    Service providers, on the other hand, will want to implement the interface using
    one or more of their components or existing functionality (if not comprehendized).


    Figure 4-12 on page 97 shows the traceability between the services identified
    in the goal-service model, and the new and existing components that implement
    and manage each service.'
