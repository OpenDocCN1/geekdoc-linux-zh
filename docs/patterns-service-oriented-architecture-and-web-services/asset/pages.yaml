  md: '# JMS service bus


    This chapter describes the addition of a JMS service bus to our simple supply
    chain management application. This application is based on the WS-I Supply Chain
    Management (SCM) sample application, introduced in Chapter 4, “Service-oriented
    architecture approach” on page 79. We start this chapter using the application
    as deployed Chapter 6, “HTTP service bus” on page 159, and describe the changes
    we made to add our JMS service bus.


    We deploy the Direct Connection application pattern, introduced in 3.4.3, “Direct
    Connection application pattern” on page 52, to a Direct Connection runtime using
    a JMS service bus, as described in “Direct Connection using service bus” on page
    65.


    In this chapter, the following topics are discussed:


    +   - The sample scenario that our solution needs to address

    - Design guidelines describing how the sample application shows appropriate design
    approaches for exposing services from applications

    - Development guidelines showing how development tools may be used to expose services
    and make them available on a service bus

    - Runtime guidelines discussing the considerations for deploying the applications
    and services'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# 7.1 Business scenario


    The sample application used in this chapter is a simplified supply chain for a
    consumer electronics retailer. As discussed in Chapter 6, “HTTP service bus” on
    page 159, the supply chain components have been deployed as services, and the
    application can be used.


    However, the company requires that all orders be logged for auditing, and there
    are concerns that some of the logged messages might be lost under the current
    infrastructure. The IT department has reviewed the technology options available,
    and decided that reliable messaging should be used to log orders from the retailer
    service to the logging service. The change to the business scenario is shown in
    Figure 7-1.


    ![](img/334ef4856dbfc14b1f371b2c8b5e06b2_247_0.png)


    Figure 7-1 High-level business context with enhanced logging


    We will be implementing the UC: Log events use across a JMS bus for the Retailer
    service as a consumer. It would also be possible to add the other internal consumer
    of the logging service (Warehouse); however, this was not done since there was
    no immediate business requirement to do so.


    # 7.2 Design guidelines


    There are no significant changes to the overall design guidelines to those discussed
    in Chapter 6, “HTTP service bus” on page 159. However, we discuss'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'some variations on the Runtime patterns used to access the logging facility
    in this section.


    # 7.2.1 Design overview


    The design change implemented in this chapter adds a reliable transport for retailer
    access to the logging facility. We decided to change only the Retailer to use
    the new transport, although all other consumers of the Logging facility could
    be changed if business requirements existed for such a change. We selected JMS
    to implement this reliable transport, based on the discussion in 5.2.2, “Java
    Message Service” on page 111.


    Figure 7-2 shows the high-level solution overview for the WS-I Scrum application
    we developed in Chapter 4, “Service-oriented architecture approach” on page 79.
    In this section we look at a JMS Product mapping for the Runtime pattern highlighted
    in Figure 7-2.


    ![](img/334ef4856dbfc14b1f371b2c8b5e06b2_248_0.png)


    Figure 7-2 Runtime patterns for the Supply Chain Management sample'
  merge: -1
  pgno: 248
- img_proc: true
  md: 'The Retailer service use of the logging facility is an example of an Application
    Integration pattern. The implementation of the services on a JMS service bus is
    an example of the Application Integration::Direct Connection runtime pattern,
    as shown in Figure 7-3.


    # Internal network


    ![](img/334ef4856dbfc14b1f371b2c8b5e06b2_249_0.png)


    Figure 7-3 shows that WebSphere MQ is performing an adapter connector role, allowing
    JMS clients to access the JMS JMS Provider. WebSphere Application still provides
    JAX-RPC and a SOAP Provider, as we saw in Figure 6-3 on page 163, in this case
    we have not explicitly modeled these components separately, in order to focus
    on WebSphere MQ as the transport provider. Runtime pattern makes use of the SOAP/JMS
    support of the WebSphere SOAP Provider.


    The logEvent operation of the logging facility is the business critical operation.
    This operation is an example of a one-way scenario (where the service consumer
    is not concerned as to the request has been processed), so the Message variation
    of the Direct Connection runtime pattern is an appropriate choice.


    We used both Windows and Linux systems in the JMS service bus deployment. Figure
    7-3 shows an example where two service consumers (Retailer and Warehouse) interact
    with a service provider (Logging facility) using the HTTP service bus. Note that
    we are only implementing one consumer on our JMS service bus, retailer.'
  merge: -1
  pgno: 249
- img_proc: true
  md: 'Extending the JMS bus was considered for the Extended Enterprise business pattern
    used with the sample application. The Manufacturer services provided by the business
    partner of the retailer also use the logging facility. However, for business partners
    to use a JMS transport, both companies would have to implement a JMS provider
    such as IBM WebSphere MQ, set up channels between the companies, and allow for
    those channels to pass through each company''s protocol firewall. For these reasons,
    it was decided to have the Manufacturer service continue to use the HTTP bus to
    log business activities, using the logging service provided by the retailer.


    #  7.2.2 Service design considerations


    Chapter 6, "HTTP service bus" on page 159, discusses the implementation of all
    services on an HTTP service bus. The Logging facility is already deployed for
    all other services using a HTTP transport. This section describes the considerations
    for adding a JMS transport option to the Logging facility so the Retailer service
    has a reliable transport option for crucial audit logging.


    An important consideration in adding a JMS transport option to an existing service
    is ensuring that access to the service by HTTP is retained for all existing Logging
    facility services. This is important for two reasons:


    +   The logging facility provides two operations:

    - logEvent, for requesting that an event be logged

    - getEvents, for requesting all log records for a particular situation


    The Retailer service uses only the logEvent operation, and this operation is a
    one-way operation, which is ideally suited to transport such as JMS, which supports
    send-and-forget. However, the getEvents operation is a request/reply function
    and is simpler to deploy on HTTP. Note, however, JMS can be used for request/reply
    scenarios.


    +   The external users of the service require HTTP access in order to meet corporate
    security requirements, which do not allow protocols such as JMS to pass through
    the protocol firewall.


    Therefore, we need to *add* the JMS protocol to the already existing HTTP support.


    # Selecting the service interaction style


    A one-way, send-and-forget interaction style has been selected for the Logging
    facility service. Quality of service concerns, such as whether the message was
    received and logged, are delegated to the infrastructure. For this reason, we
    have chosen a JMS transport for reliable message delivery.'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# Describing the service


    Each service required for the sample application was defined initially in WSDL,
    after the use cases and message types had been defined. This is a top-down design
    approach.


    For Logging facility, we need to make some changes to the design to allow the
    implementation of the JMS transport. Figure 7-4 shows the design of the service
    as implemented in the HTTP service bus.


    | Definition |

    | --- | --- |

    | Imports | Types |

    | ↳ LoggingFacility.wsdl | | |

    | Services | Bindings | Port Types | Messages |

    | □ LoggingFacilityService | □ LoggingFacilitySoapBinding | □ LoggingFacilityPortType
    | □ logEventRequest |

    | □ LoggingFacility | □ wsdl documentation | □ logEvent | □ getEventsRequest |

    | wsdlsoap.address | □ soapbinding | ↳ input | getEventsResponse

    | | □ input | getRepositoryMissingFault


    Figure 7-4 Design of LoggingFacility as implemented in HTTP service bus


    7-4 is captured from the WebSphere Studio WSDL Editor. Notice that:


    +   - The WSDL file imports some definitions from another WSDL file, LoggingFacility.wsdl.
    This file contains interface definitions for the WS-I sample application. Importantly,
    this imported file also specifies the *required binding* for the logging facility,
    to the HTTP transport. This is done because the WS-I Basic profile requires HTTP
    1.1 as the transport protocol. Since we are implementing a JMS bus, we need to
    override or add to this binding.

    - The logging service has two operations, logEvent and getEvents.

    - The messages used by those operations, and returned by the getEvents operation,
    are defined within the WSDL file.

    - To add the JMS transport to the service, we need to update the WSDL to include:

    - A SOAP binding to the http://schemas.xmlsoap.org/soap/jms transport

    - A port on the service that specifies the JMS endpoint address'
  merge: -1
  pgno: 251
- img_proc: true
  md: "The two options we considered when adding the JMS transport where to:\n\n+\
    \   Add new bindings for the JMS transport to the existing HTTP bindings.\n\n\
    +   Replace the existing HTTP bindings with the new JMS bindings.\n\nThe ideal\
    \ approach would be to have a common interface WSDL file that is imported by two\
    \ different implementation WSDL files, one for the HTTP bindings and another for\
    \ JMS. This way service consumers could select one or the other transport when\
    \ implementing their client applications.\n\nSince it is not particularly important\
    \ which JMS provider, specified is the WSDL when implementing the service provider,\
    \ we decided to simply replace the HTTP bindings with the new JMS bindings. This\
    \ way we have only one binding, and so only one set of generated Web service deployment\
    \ code. With this approach we just need to configure endpoints for both JMS and\
    \ HTTP, using the service provider generation tools. Both endpoints invoke the\
    \ same service provider deployment tools.\n\nTo replace the HTTP bindings with\
    \ JMS bindings we edited the LoggingFacility WSDL files as follows:\n\n+   Replace\
    \ the transport attribute in soap:binding(in LoggingFacilitySoapBinding) with\
    \ the JMS binding, as follows:\n\n```\n<wsdl:binding name=\"LoggingFacilitySoapBinding\"\
    \ntype=\"ns:LoggingFacilitySoapType\">\n  <wsdl:documentation xmlns:wsdl=\"http://schemas.xml.org/wsdl/\"\
    >\n    <wsi:Claim xmlns:wsi=\"http://ws-i.org/schemas/conformanceClaim/\"\n  \
    \  conformsTo=\"http://ws-i.org/profiles/basic1.0\" />\n  </wsdl:documentation>\n\
    \  <soap:binding style=\"document\"\ntransport=\"http://schemas.xml.org/soap/jms\"\
    \ />\n  <soap:operation name=\"logEvent\" />\n</wsdl:binding>\n```\n\nYou can\
    \ find LoggingSoapBinding in LoggingFacility.wsdl.\n\n+   Replace the location\
    \ in soap:address(in LoggingFacilityService) with the JMS endpoint address, as\
    \ follows:\n\n```\n<wsdl:service name=\"LoggingFacilityService\">\n  <wsdl:port\
    \ name=\"LoggingFacility\"\n      int:LoggingFacilitySoapBinding\">\n    <soap:address\n\
    location=\"jms/queue7destination=jms/LoggingFacilityQ&amp;connectionFactory\n\
    =jms/LoggingFacilityQCF&amp;targetService=LoggingFacility\"/>\n  </wsdl:port>\n\
    </wsdl:service>\n```\n\n..."
  merge: -1
  pgno: 252
- img_proc: true
  md: '# Notice the format of the JMS endpoint address URL:


    jms://queue?destination=<jms queue jndi name>&connectionFactory=<jms qcf jndi
    name>&targetService=<service name>


    The destination and connection parameters are used in the Web service consumer
    to locate the correct queue for placing requests. The targetService parameter
    is used in the Web service provider to determine which Web service should be invoked
    for the request.


    +   Merge the three files used to define LoggingFacility (LoggingFacility_Impl.wsdl,
    LoggingFactory.wsdl, LoggingFactory.xsd) into one WSDL file called LoggingFacility_Impl.wsdl.


    While not ideal from the WSDL best practices perspective, merging the WSDL in
    this way we can avoid setting up a Web server to ensure that imported WSDL files
    are found by all the runtime modules that need access to them. With the JMS service,
    our service needs to be implemented in an EJB module, but the router modules providing
    endpoints for the HTTP and JMS transport are in separate EJB and EJB modules.
    The router also need access to any WSDL imports.


    We recommend that in practice you set up a Web server to host the WSDL and all
    imports, rather than merging files.


    A disadvantage of this approach is that we end up with two copies of the WSDL.
    Consumers needing the JMS transport use the new WSDL file, and consumers needing
    the HTTP transport use the old WSDL file.


    The advantage is that existing consumers are not affected by this change. Existing
    HTTP consumers can switch to JMS by simply updating the JMS soap:binding and soap:address
    in their existing WSDL files, as described above, and regenerating their Web service
    client deployment code. Note that there is no need for the existing consumers
    to merge WSDL files, as the imports work correctly within a single WSDL module.


    # Design alternative: Top down or bottom up


    In the case of the sample application, the service interfaces were designed by
    WS-I first, and then the implementations were provided by various vendors, including
    IBM. This is an example of top-down design. Top-down design was considered in
    this case for the same reasons as outlined in "Design alternative: Top down or
    bottom up" on page 170.


    # Selecting the service communication protocol


    The IBMSphere Application Server V5.1 SOAP Provider also supports SOAP over JMS,
    retaining SOAP as the service communication protocol for our JMS service bus scenario
    makes sense.'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'Standards are still evolving in the area of asynchronous transports and there
    is currently not a standard binding defined for SOAP over JMS. The bindings used
    by all implementations, including WebSphere, are currently proprietary.


    # Design alternative: Selecting the binding style


    Document style was chosen for the binding style by the WS-I in the original interface
    definition. Document style is a natural selection for a service such as a Logger,
    where a generic logging service could send almost any imaginable information in
    an XML document to be logged. Although not implemented in the sample application,
    facilities such as the DB2 Universal Database™ XML extender, prefers used in conjunction
    with the DB2 MQ Extender, could be used to implement a robust logging facility
    with little programming effort.


    # Design alternative: Selecting the encoding style


    Literal encoding was specified for the logging facility, since the original WS-I
    specification, to meet the WS-I Basic Profile, requires literal. There was no
    obvious reason to change this selection.


    # Allowing consumers to locate the service


    No change to the approach for allowing clients to locate the service was made
    for the JMS service bus. However, our JMS implementation will allow existing clients
    to simply update their current WSDL and redeploy to use the new JMS transport.


    # 7.2.3 Component design considerations


    No significant changes to component design considerations are required for the
    implementation of a JMS service bus. Most considerations are covered in Chapter
    6, “HTTP service bus” on page 159, and a detailed explanation of the structure
    of the Logging facility is not necessary to understand the changes required for
    a JMS implementation.


    # Implementing JMS Web services


    One change that is required for JMS is in the implementation environment. Only
    stateless session beans can be exposed as JMS Web services using the Product mappings
    described in this chapter. For this reason, the LoggingFacility provided with
    our version of the sample application is facaded by a stateless session bean.


    A detailed description of the implementation considerations is provided in 7.3.1,
    “Service development considerations” on page 238.'
  merge: -1
  pgno: 254
