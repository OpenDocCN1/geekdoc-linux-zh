  md: '# 1.2.2 Selecting Application patterns


    Once the Business pattern is identified, the next step is to define the high-level
    logical components that make up the solution and how these components interact.
    This is known as the Application pattern. A business pattern usually have multiple
    possible Application patterns. An Application pattern may have logical components
    that describe a presentation tier for interacting with users, an application tier,
    and a back-end application tier.


    Application patterns break the application down into the most basic conceptual
    components, identifying the goal of the application. In our example, the application
    falls into the Self-Service business pattern and the goal is to build a simple
    application that allows users to access back-end information. The Self-Service::Directly
    Integrated Single Channel application pattern shown in Figure 1-4 fulfills this
    requirement.


