  md: '# Service directory


    In this chapter we discuss the use of an e-business service directory in the context
    of the sample application introduced in Chapter 6, “HTTP service bus” on page
    159. A service directory is generally perceived as a key enabler of dynamic e-business.
    It is important to understand how the current technologies and standards help
    us achieve these goals.


    We examine the use of the Direct Connection Rules Repository node to model a service
    directory, as described in “Basic Direct Connection runtime pattern” on page 63.
    Introducing this node allows a service consumer to discover services using a service
    directory.


    In this chapter, the following topics are discussed:


    +   The sample business scenario that our solution needs to address


    +   Design guidelines describing the guiding principles we used when modifying
    the sample application


    +   Development guidelines showing how we implemented the sample application changes


    +   Runtime guidelines discussing the considerations for deploying the service
    directory


    +   Best practices summarizing the things you should consider when deploying a
    service directory'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# 8.1 Business scenario


    The sample application (SCM) sample used in the previous chapters. We introduce
    a non-functional requirement that involves a lookup in a service directory.


    In this scenario, the requirement is a more flexible and efficient way of locating
    services in the organization. The business wants to reduce the IT management costs
    associated with changing the location of service providers, in both test and production
    environments. The IT department has reviewed the technology options available,
    and decided that a UDDI registry should be used to look up service provider endpoint
    URLs, starting with a pilot for retailer access of the warehouse service. The
    change to the business scenario is shown in Figure 8-1.


    ![](img/334ef4856dbfc14b1f371b2c8b5e06b2_269_0.png)


    Figure 8-1 High-level business context with service discovery


    The architecture of the WS-I SCM sample application includes the potential usage
    of entries in the UDDI Business Registry (UBR), a public UDDI registry offered
    by several companies, including IBM, Microsoft, and SAP.


    The SCM Web services are published as tModels in the UBR. The tModelKeys are listed
    in "Advertisement of tModels" of the WS-I Supply Chain Management Sample Application
    Architecture document. Figure 8-2 on page 253 shows the UBR entry for the Warehouse
    service tModel from the IBM UBR at:


    ```

    https://uddi.ibm.com/ubr/registry.html

    ```'
  merge: -1
