  md: 'record format. An application that is unaware of this new information in the
    structure is not affected by the extra data.


    +   - Separation of data and display


    The representation of the data is separated from the presentation and formatting
    of the data for display in a browser or other device.


    +   - Industry acceptance


    XML has been accepted widely by the information technology and computing industry.
    Numerous tools and utilities are available, along with new products for parsing
    and transforming XML data to other data, or for display.


    # Disadvantages of XML


    Some XML issues to consider:


    +   - Complexity


    While XML tags allow software to recognize meaningful content within documents,
    this is only useful to the extent that the software reading the document knows
    what the tagged content means in human terms, and knows what to do with it.


    +   - Standardization


    When multiple applications use XML to communicate with each other need to agree
    on the tag names they are using. While industry-specific standard tag definitions
    often exist, you can still declare your own non-standard tags.


    +   - Large size


    XML documents tend to be larger in size than other forms of data representation.
    This has performance implications and may be unsuitable for high-performing systems.


    # 5.4.2 WSDL


    The W3C has adopted the Web Services Description Language (WSDL) as a standard
    for base-level service description. At the time of writing this book, the current
    version of WSDL is 1.1.


    WSDL specifies the operational characteristics of a Web service using an XML document.
    It provides a notation to answer the following questions:


    +   - What (is this service about?)


    +   - Where (does it reside?)


    +   - How (can it be invoked?)'
