    # Design alternative: One-way scenario


    The one-way scenario is defined for situations where the consumer needs to send
    a message to the provider, but does not need to know whether the provider received
    the message or what it did with it. The sample application LoggingFacility is
    used by all consumers to log events under the WS-I one-way messaging usage scenario,
    as shown in Figure 6-5 on page 166.'
  merge: -1
  pgno: 182
- img_proc: true
  md: '![](img/334ef4856dbfc14b1f371b2c8b5e06b2_183_0.png)


    Figure 6-5 Example of a WS-I one-way scenario


    The Figure 6-5 scenario is an example of the message variation of the Application
    Integration::Direct Connection runtime pattern. When the Manufacturer is the consumer
    of the Logging facility service, it is an example of the message variation of
    the Extended Enterprise::Exposed Direct Connection runtime pattern.


    This one-way approach should be selected when the consumer needs to send information
    to the provider in a send and forget mode. When planning to use this scenario,
    you should carefully consider the quality of service requirements and in particular
    the reliability of the transport used to send the message. Since there is no reply
    from the provider, the consumer cannot know whether the provider received and
    processed the message. If the requirements specify that the message must be processed,
    consider either:


    +   * Using a reliable transport, such as JMS or WS-ReliableMessaging

    * Using a variation, and including logic in the consumer to retry if a response
    message is not received


    The reliable transport option should be preferred, as the tasks of tracking message
    delivery and recovering from failures to deliver messages are complex, and better
    suited to middleware which is designed for this purpose rather than application
    code.


    **Design alternative: Synchronous request/response scenario**

    The synchronous request/response scenario is defined for situations where a consumer
    needs a response to a request. The consumer waits for a response from the provider.
    Figure 6-6 on page 167 provides an example.'
