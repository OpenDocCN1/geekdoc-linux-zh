    # ## 4.4 Summary and conclusion


    The method described here help map a current business model and its underlying
    IT architecture to a service-oriented enterprise and application architecture.
    The combination of SOA and Patterns for e-business produces a powerful set of
    best-practices and design decisions that help expedite mapping business processes
    to IT and the creation of a robust service-oriented architecture that is in line
    with the needs of the business.


    The SOA approach discussed here is an extension that can be easily added to your
    current method. It combines a top-down and bottom-up approach to the modeling,
    design and implementation of a service-oriented architecture for on-demand computing.


