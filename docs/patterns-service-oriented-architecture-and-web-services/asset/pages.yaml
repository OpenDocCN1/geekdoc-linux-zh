  md: "It should be noted that both WS-Coordination and WS-Transaction are still regarded\
    \ as emerging standards, and that further work to finalize the specifications\
    \ are required.\n\n# WS-Coordination\n\nWS-Coordination is a general purpose and\
    \ extensible framework for providing protocols that coordinate the actions of\
    \ distributed transactions. The defined framework enables an application service\
    \ to create a context needed to propagate an activity to other services and to\
    \ register for coordination protocols. The framework also enables existing transaction\
    \ processing, workflow, and other systems for coordination to hide their proprietary\
    \ protocols and operate in a heterogeneous environment. It can be used with message\
    \ sequencing and state synchronization.\n\n# WS-Transaction\n\nWS-Transaction\
    \ includes support for the two types of transactions. It describes coordination\
    \ types that are used with the extensible coordination framework as described\
    \ in WS-Coordination. Two coordination types are defined: Atomic Transaction (AT)\
    \ and Business Activity (BA), WS-Transaction is a building block used with other\
    \ specifications (for example, WS-Security), WS-Coordination, and application-specific\
    \ protocols that are able to accommodate a wide variety of coordination protocols\
    \ related to the coordination actions of distributed applications.\n\n# Conversation\
    \ Support for Web Services\n\nIBM is making available through alphaWorks® a technology\
    \ called Conversation Support for Web Services (CS-WS) for supporting a conversational\
    \ model of interaction between distributed, autonomous systems. The specification\
    \ includes an XML dialect to describe a conversation interaction, called Conversation\
    \ Policy (CP). CPs are preprogrammed interaction patterns that are used to specify\
    \ the message formats, sequencing constraints, and timing constraints that define\
    \ the interaction protocol. The other specifications in the set extend the J2EE\
    \ Connector Architecture APIs, both at the system and application level, to provide\
