    You should be aware, however, that implementor of service consumers will require
    the implementation WSDL file in order to generate their client code.


    # Design alternative: Imbed or import data definitions


    Within your WSDL files, you need to define the contents of those messages produced
    and consumed by your service, and the types of the messages. You can define this
    interface wholly within the WSDL file, or you can define it in schema files and
    import the schemas into the WSDL.


    For the sample application, the type and message definitions were available in
    schema files and we chose to use those. An example of the import of types and
    message definitions is shown in an extract from the Manufacturer interface WSDL
    file shown in Example 6-2.


