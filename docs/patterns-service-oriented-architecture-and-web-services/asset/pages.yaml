- img_proc: true
  md: 'Figure 8-18 provides a summary of dynamic discovery of either interface location
    during the Web service life cycle.


    | Discovery of Interfaces: Static Discovery of Location: Dynamic | Discovery of
    Interfaces: Dynamic Discovery of Location: Dynamic |

    |---|---|

    | 2 Potential Benefits at: Runtime | 4 Potential Benefits at: Deployment Time?
    |

    | Discovery of Interfaces: Static Discovery of Location: Static | Discovery of
    Interfaces: Dynamic Discovery of Location: Static |

    | 1 Basic Situation | 3 Potential Benefits at: Development Time |


    Figure 8-18 Static and dynamic discovery during the Web service life cycle


    We can use this framework to further explore potential benefits of static and
    dynamic discovery during the Web service life cycle:


    +   - Quadrant 1

    Static discovery of interfaces and location is the basic situation.

    - Quadrant 2


    At runtime, we think the service interfaces are known by the Web service consumers
    most of the time. They are modified rarely, if ever. So, the most pressing need
    is to cope with service location flexibility without modifying the consumers.
    That is the aim of the scenario we explored in this chapter. To achieve that goal,
    services must be published to a private production UDDI registry. Service consumers
    must look up the service location in the registry.


    Web services are often used to expose existing applications to the Web, using
    a bottom-up approach. This approach results in services that have a wide range
    of interfaces that only specialized clients are able to use. Conversely, services
    can be built with known interfaces agreed upon by wide variety of providers in
    a top-down development approach. This approach paves the way for generic service
    clients who could have the opportunity to use the UBR for generic services.


    +   - Quadrant 3


    During development time when the service is still being modified, interfaces may
    change. This situation creates consistency issues for the teams who are programming
    the Web services clients. So, for that period of the life cycle, dynamic discovery
    of interfaces is a valuable feature which'
  merge: -1
  pgno: 294
- img_proc: true
  md: 'inform developers very efficiently that the interfaces they need have been
    modified. To do that, services under development must be published regularly in
    a private development UDDI registry, a helper class must be added to search the
    registry for the tModel which points to the interface WSDL.


    +   - Quadrant 4


    What benefits could we expect from dynamic discovery of both service and service
    location? It may be great to imagine that any client could discover any service.
    It would definitely solve issues at deployment time. But programming the Web service
    consumer could become very complex, and everything would be variable and undefined
    until just execution. The present technologies do not seem to offer sufficient
    flexibility to support such a dynamic model.


    # 8.5.4 LDAP and UDDI considerations


    There is no formal relationship between UDDI and LDAP. The two technologies are
    designed to do different things. UDDI is a specific-purpose registry that is intended
    to manage descriptions of Web service types, business organizations, and the Web
    services that businesses offer. LDAP is an extensible, general-purpose directory
    that is most often used to manage users and resources. New LDAP object classes
    could be defined for the things UDDI registers, but there is not a global, public,
    LDAP directory system.


    The UDDI specification does not dictate implementation details. The UDDI specification
    defines an XML-based data model and a set of SOAP APIs to access and manipulate
    that data model. The SOAP APIs define the behavior a UDDI registry must exhibit.
    A UDDI implementation could be built on an LDAP directory as long as it conforms
    to the specified behavior. Thus far, all UDDI implementations have been built
    on relational databases.


    UDDI implementations have initially focused on the public UBR and are now evolving
    towards the idea of private registries. In that sense, it could happen that UDDI
    directories become as frequent for service registry as LDAP directories for user
    registry.'
