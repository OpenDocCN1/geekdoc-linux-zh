    # 8.5.2 WebSphere Studio and WebSphere UDDI registry differences


    The Web Services Explorer user interface for the WebSphere Studio UDDI registry
    differs from UDDI registry console for IBM WebSphere Application Server Network
    Deployment V5.0. This can create some confusion about how to set the endpoint
    URL.


    With the Web Services Explorer and Studio, the address that is stored and is shown
    is the URL of the implementation WSDL. However, this is not the access point that
    is stored in the accessPoint variable in UDDI. The Web Services Explorer does
    not provide access to the accessPoint. It is copied from the implementation WSDL
    file when you publish. You can only change it later by publishing a new service.


    In the runtime environment, we do not actually need the WSDL files, as our Web
    service consumer (client) the client only needs to look up the endpoint address
    at runtime.


    # 8.5.3 Dynamic or static discovery during the Web service life cycle


    As with any programming artifact, Web services have a life cycle composed of number
    of phases such as:


    +   - Development phase

    - Deployment phase

    - Runtime phase


    We have seen previously that a Web service is essentially defined by a service
    interface and a service implementation. The discovery of the service interface
    and of the service location can either be static or dynamic. The benefits of each
    kind of discovery vary during the different phases of the life cycle of the Web
    service and its clients.'
  merge: -1
