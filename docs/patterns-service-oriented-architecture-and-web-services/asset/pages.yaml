  md: '+   Allow users access to the processes and data they require anytime and anywhere.


    Let us review the above criteria in the context of a service-oriented architecture.


    # Simplify end-user experience


    An demand operating environment provides the tools and facilities to make employees
    more productive, and to make it easier for customers, suppliers, and partners
    to do business with the company.


    In a fast changing business environment, it is important for the underlying business
    systems to be adaptable to changes in the business process. Applications, internal
    departments, and partner systems need to be integrated to the enterprise to support
    the end-to-end process, with little effort and complexity as possible. Using a
    service-oriented architecture to separate the interfaces of applications and systems
    it is possible to implement, replace or revoke services with minimum impact to
    the user experience. The enterprise can be extended to include support for business
    partner by agreeing on a well defined interface contract, independently of the
    implementation approach and underlying platform.


    # Secure role-based interactions


    Providing people with what they need, when they need it, requires a solution that
    includes integrated, role-based policies. Such facilities help ensure privacy
    and the protection of data and resources while meeting the dynamic demands of
    the users.


    By implementing a layered service-oriented architecture, a common interface is
    used by all applications and services within the enterprise for access: The service
    bus. With a more traditional enterprise architecture the security is generally
    implemented either on the front end, or as a complex implementation of components
    distributed across the entire system with a high degree of dependency on each
    other. It becomes difficult to maintain consistent security policy across individual
    applications. Through the implementation of an SOA and a security layer, such
    as WS-Security, a common role-based security model can be introduced independent
    of the underlying applications. Additionally, this model allows changes in business
    security policy without any change required or impacting the underlying applications
    and integrations.


    # Standardize access


    As the business changes to meet market pressures, new applications must be made
    available to enable users to become productive without extensive training. By
    providing standardized interfaces to applications and using facilities such as
    portals to gain access to applications, users can quickly adapt to new'
  merge: -1
  pgno: 325
- img_proc: true
  md: 'applications. This will also ensure that resources within the company can quickly
    be redeployed as necessary to meet changing demands.


    This is achieved by separating the presentation logic from the underlying applications
    and data storage. SOA provides a presentation layer between the user and the underlying
    services. This all presentation logic is decoupled from the functions supplied
    and the associated data. Services are also reusable by any number of different
    user interfaces, based on a single service interface.


    # Access to required processes and data


    Whether using a desktop system, laptop, or other devices, such as ATMs, PDAs,
    cell phones, and so on, users demand access to applications and information from
    anywhere at anytime. An demand operating environment provides a secure, yet flexible
    infrastructure to support local, remote, and mobile users through whatever devices
    they might be using.


    By extending the presentation service layer described above, the service-oriented
    architecture adopted by the enterprise can be tailored to support new requirements
    for client type support, with no changes required to any of the existing business
    systems.


    # Processes


    Business can no longer afford to develop and maintain isolated, vertical business
    processes. On an demand business must manage and coordinate the entire enterprise
    horizontally, and the IT infrastructure needs to be an enabler not a barrier.
    An on demand operating environment supports:


    +   - A consistent modeling of business processes


    +   - Integration of applications


    +   - External connectivity


    Now let us review the above criteria for processes'' support within an demand
    operating environment in the context of a service-oriented architecture.


    # Consistent modeling


    By providing a consistent model of business processes, you can more easily adapt
    applications as the business needs change. Consistent modelling is independent
    of underlying product implementations; therefore, the model can persist even when
    more cost-effective products must be chosen on which to build the solution.


    Modeling a business process in a way that is abstracted from the implemented technologies
    makes it easier to adapt to changing business conditions. Using a consistent modeling
    approach simplifies communication between all parties'
  merge: -1
  pgno: 326
- img_proc: true
  md: 'involved in the business process. In addition, models can be shared between
    partners without dictating the development tools or runtime environment that each
    of the partners in the process must use. The service-oriented approach facilitates
    the use of tools for implementing a business process from a model how a set of
    services needs to be orchestrated and composed.


    # Integration of application


    It is no longer practical to build vertical solutions in a vacuum, independent
    of, and without consideration of, other applications in other parts of the business.
    Just as a business must integrate all of its business processes to run more efficiently
    and responsive to changing demands, an on demand operating environment provides
    the infrastructure needed to allow applications to be integrated by using common
    standards and open technologies. As new, unforeseen opportunities and requirements
    surface, applications that previously might have seemed unrelated need to be quickly
    and efficiently integrated.


    The Enterprise Service Bus concept, covered in "Enterprise Service Bus" on page
    38, will be a key enabler for this requirement. It provides the ability for all
    applications, both intra- and inter-enterprise to appear on the network as a set
    of services, through the use of well defined interface contracts based on industry
    technologies.


    Another dramatic benefit of the Enterprise Service Bus is the ability to leverage
    legacy systems. We can integrate existing legacy systems into the SOA by wrapping
    these systems in a well structured interface contract, with minimal changes to
    the legacy system applications.


    # External connectivity


    By conforming to standards, applications and processes can be connected to other
    external applications and processes. As the business changes, new partners arise,
    or mergers occur, the cost and time associated with rewriting applications or
    redesigning processes to be compatible with existing tools is unacceptable in
    an on demand world. By planning for enabling the integration and interconnectivity
    of applications as provided in an on demand operating environment, the business
    can be more responsive to changes as they occur.


    Just as with the integration of applications within the enterprise defined in
    "Integration of application" on page 310, the principle can be extended to support
    the integration of applications published as services by business partners and
    other external entities with minimal requirement for additional development effort,
    allowing for a faster response time to changes and new demands.'
