    had to write Java programs accessing the CICS functions via a J2EE connector like
    the CICS Transaction Gateway. Then the Java programs could be exposed as Web services.


    The new IBM SOAP feature enables programmers to access CICS transactions directly
    via SOAP calls. The aim of this new feature is to provide more flexibility for
    accessing legacy business functions. It is intended to provide an additional layer
    of connectivity appropriate for some applications, especially those used within
    service-oriented or extended enterprise architectures.


