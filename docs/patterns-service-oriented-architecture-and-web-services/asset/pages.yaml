    We choose to use the Unit Test UDDI registry available in WebSphere Studio Developer
    V5.1.1 in our development and unit test environment.


    This registry is very convenient and simple to install. It can use either a DB2
    database, or the lightweight Cloudscape™ database provided with Studio.


    To deploy the WebSphere Studio Unit Test UDDI registry:


    +   1. Click File -> New -> Other... from the Studio main menu.

