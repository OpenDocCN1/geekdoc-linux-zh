    # # 5.3.1 SOAP


    Simple Object Access Protocol (SOAP) is a network-, transport-, and programming
    language-neutral protocol that allows a service consumer to call a remote service
    provider. The message format is XML. The currently adopted standard is W3C''s
    SOAP 1.1 specification, while SOAP 1.2 is in the review process.


    SOAP has the following characteristics:


    +   - SOAP is designed to be simple and extensible.

    - SOAP provides a framework to describe message content and process instructions,
    and an optional set of encoding rules for representing defined data-types.

    - All SOAP messages are encoded using XML.

    - SOAP is transport protocol independent. HTTP is one of the supported transports.
    Hence, SOAP can run over an existing Internet infrastructure.

    - There is no distributed garbage collection. Therefore, call by reference is
    not supported by SOAP; a SOAP client does not hold any stateful references to
    remote objects.


    Chapter 5. Technology options 117'
