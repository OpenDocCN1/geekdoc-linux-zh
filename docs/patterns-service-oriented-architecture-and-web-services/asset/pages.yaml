    Development to Build Web Service Applications, draws a number of important conclusions
    about best practices for designing service-oriented applications, including:


    +   - Components do not necessarily make good services, as objects do not necessarily
    make good components.


    It is not a good practice to simply expose public object methods as services.
    One reason for this is that object methods tend to be fine grained, and exposing
