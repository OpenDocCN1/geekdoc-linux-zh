- img_proc: true
  md: 'SOAP is operating system independent and not tied to any programming language
    or component technology. It is object model neutral.


    Due to these characteristics, it does not matter what technology is used to implement
    the service consumer, as long as the consumer can issue XML messages. Similarly,
    the service provider can be implemented in any language, as long as it can process
    XML messages.


    As shown in Figure 5-4, a simple SOAP message consists of three main parts: Envelope,
    optional header(s) and a body.


    ![](img/334ef4856dbfc14b1f371b2c8b5e06b2_135_0.png)


    Figure 5-4 Overview of a SOAP message


    # SOAP with Attachments


    The SOAP architecture is based on XML documents. However, some issues arise when
    these documents contain binary data (such as images) or encapsulate other XML
    documents. To handle these situations, the SOAP standard has been enhanced with
    the SOAP with the Attachments feature. This feature allows SOAP messages to be
    composed of several parts to improve the handling of specific payloads.


    # SOAP encoding and performance


    There are several ways to encode messages in SOAP messages.


    +   - SOAP Remote Procedure Call (RPC encoding), as defined as the SOAP 1 chapter
    5 specification

    - SOAP Remote Procedure Call Literal encoding (SOAP RPC-literal), which uses a
    user-defined method to marshal and unmarshal the XML data

    - SOAP document-style encoding, also known as message-style or document-literal
    encoding'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'These techniques bring different benefits and limitations. The choice of a
    encoding technique for a particular scenario may be a critical success factor
    for a given project.


    Figure 5-5 shows the expected benefits of each technique.


    | SOAP RPC Encoding | RPC-Literal Encoding | Document-Style Encoding |

    | --- | --- | --- |

    | Simplifies Developer Work | | Simplifies System Work |


    Figure 5-5 Positioning of SOAP encoding techniques


    # SOAP and the WS-I Basic Profile


    The WS-I Basic Profile 1.0 (see "WS-I Basic Profile 1.0" on page 36) precludes
    the use of SOAP encoding. SOAP encoding is used to indicate the use of a particular
    scheme in the encoding of data into XML. This introduces complexity. It has proven
    to be a frequent source of interoperability problems.


    The WS-I Basic Profile 1.0 requires use of either the RPC/literal or Document/literal
    forms of the WSDL SOAP binding. Considerable detail is provided in the specification
    describing correct use of the SOAP binding extension elements, to ensure a consistent
    and interoperable description of the RPC/literal and Document/literal forms of
    the SOAP binding. The aim is that WSDL tools will generate code that will be interoperable
    with regards to the SOAP messages produced and/or consumed.


    # SOAP and reliable messaging services


    The SOAP standard is independent of any transport. However, the only binding that
    is used as a reference implementation is HTTP. This means that SOAP does not have
    a standard binding for reliable messaging. Several vendors offer reliable messaging
    solutions, with the IBM offering based on the WebSphere family of middleware.


    Another environment considered in this context is ebXML (see 5.4.3, "ebXML" on
    page 125). The ebXML messaging service has the same objectives as the WebSphere
    MQ offering, but implementations are still very recent, as the standard was only
    published in 2001 as part of the global ebXML architecture.'
