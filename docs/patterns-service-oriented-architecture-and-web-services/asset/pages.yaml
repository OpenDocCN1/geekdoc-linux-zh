  md: '# 6.2.3 Component design considerations


    The availability of tools and wizards to generate Web services from almost any
    existing programming asset brings a a number of risks that apply to bottom up
    implementations. For example, with bottom-up design, it is possible to:


    +   - Expose details of the implementation of your business processes to consumers.


    +   - Introduce unnecessary network communication which may result in latency
    and application performance that does not meet expectations.


    You should review your approach to deployment of Web services to avoid pitfalls.


    # Sample application component overview


    The sample application has a high-level deployment structure as shown in Figure
    6-13.


    ![](img/334ef4856dbfc14b1f371b2c8b5e06b2_197_0.png)


    Figure 6-13 Sample application deployment deployment


    Each service is designed to be implemented independently of the others, and in
    this case some services have been co-located on a node due to:


    +   - Amount of hardware available to implement the system.


    +   - Performance and capacity plans might allow such a co-location.'
