  md: '# Service development alternatives


    The design decision which will most impact the development approach is discussed
    in "Design alternative: Top down or bottom up" on page 170. For the sample application,
    the service descriptions (WSDL) were produced first, and the service implementation
    code was written. We discuss top-down and bottom-up development approaches in
    this section.


    # Top-down service development


    In the case of a top-down development approach, the following high-level steps
    are required:


    +   1. Develop WSDL to describe the service interface.

    2. Develop WSDL to describe the service implementation.

    3. Make WSDL available for clients to use.

    4. Generate implementation skeletons.

    5. Implement code.

    6. Deploy service for testing.

    7. Test service.

    8. Deploy service in production.


    # Bottom-up service development


    Where you are creating a service from existing application code, the high-level
    steps are:


    +   1. Select the interface code you wish to expose.

    2. Generate implementation WSDL from the service.

    3. Make WSDL available for clients to use.

    4. Deploy the service for testing.

    5. Test service.

    6. Deploy service in production.


    # Sample application service development


    This section describes the key development steps for the top-down development,
    as used in the sample application with WebSphere Studio.


    We first created some Studio projects to hold the implementation code for each
    service. We used the following approach for the Manufacturer service:


    +   1. Switch to the Resource perspective and create the implementation WSDL file
    for each service in the Studio Build/wsdl folder.'
  merge: -1
