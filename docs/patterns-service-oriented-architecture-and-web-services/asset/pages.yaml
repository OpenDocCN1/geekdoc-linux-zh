- img_proc: true
  md: 'Starting with the high-level business goal of increasing revenue, we identify
    lower-level subgoals and services needed to realize the business goals. For the
    SCM sample, the top level goal of increasing revenue may be achieved by increasing
    sales. To increase sales we can provide more accessible and convenient self-service
    shopping capacity. The Purchase Goods and Source cases identified in domain decomposition
    provide this capability.


    Looking closer at the self-service shopping goal, it is important that interaction
    experienced is user-friendly. To achieve this we need to provide the user with
    a shopping catalog that she can browse. In a real world scenario some of shopping
    cart faculty would also be useful. This simple goal-model helped us to identify
    that some additional services are needed to support the business goals. We will
    need to revisit the domain decomposition to incorporate the new services.


    All the services identified are seen to directly support the domain''s needs and
    goals. This traceability is a very significant factor in ensuring that the gap
    between business required services and IT system implementations remains minimal.


    # 4.3.3 Subsystem analysis


    After completing domain decomposition we have an idea of the functional areas
    in the business domain and how they interact within the value-chain for the business
    domain. We have a fractal (recursive or composite) view of the business domain.
    An extended enterprise with suppliers and customers, with individual business
    lines within an organization, and business processes and cases within the business
    lines.


    Now we move more into design- and architecture-driven decisions. Subsystem analysis
    refines the business use into use cases that support a given business process.
    Subsystems are composed of business components (such as Customer, Order, and Product)
    and technical components (such as messaging, security, and logging).


    During subsystem analysis, business and technical components are identified as
    follows:


    +   - Analyze the process flow within the subsystem (often a sequence of use cases)
    to discover/identify candidate business components.

    - Use non-functional requirements to find technical components.

    - Identify the required functionality for each business component; tat is, the
    system level use cases each component must support.'
