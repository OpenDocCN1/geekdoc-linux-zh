  md: '![](img/334ef4856dbfc14b1f371b2c8b5e06b2_105_0.png)


    Figure 4-7 Domain decomposition into business processes and business use cases


    With the business use cases, it is important to define the data to be input and
    output from each service or external invocation at a high or level. These definitions
    are then refined during component and service specification.


    As we move into design, each functional area is mapped to one or more subsystems
    in the architecture. Functional areas are a business notion, while the subsystems
    are a technology notion. There is a straightforward mapping between them, so we
    often find that at least one subsystem will be identified and elaborated for each
    functional area. Similarly, business level use cases can be mapped to system level
    use cases in this stage.


    In this way, each functional area or business process can be thought of as an
    IT subsystem that creates a natural business-driven boundary for the large-grained
    enterprise components that provide services.


    In contrast, object-oriented analysis and design tends to produce graphs of relatively
    tightly coupled finer-grained objects, which tends to impede component reuse.
    With the SOA approach this is avoided by identifying the larger encompassing (perhaps
    virtual) structure first. The constituent elements are then'
