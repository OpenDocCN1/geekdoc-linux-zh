    # 4.3.2 Goal-service model creation


    Service identification implies the discovery of business aligned services for
    the entire organization. As discussed, the business level use cases identified
    in domain decomposition are good candidates for services. In this step we create
    a goal-service model to test the completeness of the candidate services identified.'
