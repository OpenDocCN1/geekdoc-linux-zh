  md: 'page 101, there are various alternatives to the traditional “build versus buy”
    decision, namely:


    +   * Build new component functionality (roll your own).

    * Transform legacy to enable reuse of functionality exposed as services.

    * Integrate by wrapping legacy systems.

    * Buy and integrate with third party products.

    * Subscribe and out source parts of the functionality, especially via Web services.


    ![](img/334ef4856dbfc14b1f371b2c8b5e06b2_118_0.png)


    A service’s implementation can be realized by wrapping a legacy system with a
    message queue service or a Web service. But in most cases mere exposure of legacy
    functionality is not sufficient. Componentization of the legacy system or a small
    subset of the system must take place to properly expose the functionality required.
    This process is called transformation, where the legacy system is transformed
    from one state to a componentized state. A key factor is the scope of componentization:
    Avoiding the “ball the ocean” syndrome where all the legacy is broken into parts.
    Rather, an appropriate subset is selected and transformed through componentization.
    This is mostly an automated process. The Legacy Transformation Offering focuses
    on these kinds of solutions.


    Subscription assumes that an enterprise application Integration model has been
    implemented and there are services to subscribe to, in a hub and spokes architecture.


    Once we have specified the components that we need, we can weigh the advantages
    and disadvantages of how to realize the components. This mapping is called a technology
    realization.


