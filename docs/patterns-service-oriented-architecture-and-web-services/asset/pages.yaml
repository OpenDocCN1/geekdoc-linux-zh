    # IBM WebSphere MQ


    IBM WebSphere MQ provides once-only delivery of messages across more than 35 industry
    platforms using a variety of communications protocols.


    The transportation of message data through a network is possible through the use
    of a network of WebSphere MQ queue managers. Each queue manager hosts local queues
    that are containers used to store messages. Through remote queue definitions and
    message channels, data can be transported to its destination queue manager.


    To use of a WebSphere MQ transport layer, an application must make a connection
    to a WebSphere MQ queue manager, the services of which enable it to receive (get)
    messages from local queues, or send (put) messages to any queue on any queue manager.
    The application''s connection may be made directly (where the queue manager runs
