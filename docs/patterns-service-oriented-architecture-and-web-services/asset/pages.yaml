    #  Interface-based design


    In both component and service development, the design of the interfaces is done
    such that a software development entity implies and exposes a key part of its
    definition. Therefore, the notion and concept of “interface” is key to successful
    design in both component-based and service-oriented systems. The following are
    some key interface-related definitions:


    +   - Interface: Defines a set of public method signatures, logically grouped
    providing no implementation. An interface defines a contract between the requestor
    and provider of a service. Any implementation of an interface must provide all
    methods.

    - Published interface: An interface that is uniquely identifiable and available
    through a registry for clients to dynamically discover.

    - Public interface: An interface that is available for clients to use but is not
    published, requiring static knowledge on the part of the client.

    - Dual interface: Frequently interfaces are developed as pairs such that one interface
    depends on another; for example, a client must implement an interface to call
    a requestor because the interface provides some callback mechanism.


    Figure 2-4 on page 23 shows the UML definition of a customer relationship management
    (CRM) service, represented as a UML component, that implements the interfaces
    AccountManagement, ContactManagement, and SystemsManagement. Only the first two
    of these are published interfaces, although the latter is a public interface.
    Note that the SystemsManagement'
