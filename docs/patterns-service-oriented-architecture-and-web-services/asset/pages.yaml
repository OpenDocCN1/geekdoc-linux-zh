- img_proc: true
  md: 'Vendors build their implementations of the WS-I sample services in accordance
    with the WSDL descriptions available from pointers in the UBR. As multiple services
    are built using the same descriptions, they should not only be interoperable but
    changeable as well. For example, the Warehouse implementation of one vendor should
    give the same results as the Warehouse implementation of another vendor. The sample
    application can potentially use different vendors of the same service, by making
    a simple runtime change in the service consumer (Retailer in the case of the Warehouse
    service).


    It is our understanding that the SCM scenario does not provide dynamic discovery
    of service interfaces at run time; rather, it aims to allow the use of different
    providers of the service.


    Our aim in this chapter is slightly different. We focus on one facet of service
    discovery. Currently, most Web service implementations are not using dynamic discovery
    of services (that includes discovery of interface and implementation definitions)
    at runtime. But static discovery is not enough to cope with important quality
    of service and infrastructure issues.


    One of the expected benefits of SOA architecture is the ability to better cope
    with changes. Loosely coupled services should allow more flexibility than tightly
    coupled applications.


    A basic issue that comes to mind flexibility is that services may not remain at
    a physical location over time. IT production departments may need to move them
    from one server to another. An obvious need is the promotion of code from one
    environment to another, such as from test to production. The service used for
    test or integration purposes cannot be at the same location as the production
    service. Moreover, one could think of locating several identical services in different
    places to provide high availability (via failover) and potentially some level
    of load balancing.


    In this chapter, we essentially tackle how a service consumer can change from
    a service provider in one location to a provider in another location, with as
    few changes as possible to the application code or the deployment descriptors.


    # 8.2 Design guidelines


    In our sample application, the location of a service is found by reading the WSDL
    implementation document of the service at build or deployment time.'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'To relocate a service, we need to take several actions with the service provider
    and the service consumer:


    +   - Service provider side:


    +   - Implement the service at another location on another server.


    +   - Make the modified WSDL implementation document available to the consumers
    of the service.


    +   - Service consumer side:


    +   - Get the new WSDL implementation file.


    +   - Regenerate the Web service client deployment code from the new WSDL.


    +   - Redeploy the service consumer (client) on its server.


    # 8.2.1 Design overview


    We want to extend the application by adding the capability to use a service in
    a different location without touching the service consumer and the WSDL document
    used. To do this, we intend to:


    +   - Implement a private UDDI registry where the service location will be published
    and changed.


    +   - Modify the service consumer to look up the endpoint address of the invoked
    service. In this case, we will modify the Retailer as a consumer of the Warehouse
    service.


    +   - Create a new helper class that will query the UDDI registry where the service
    location is published and return the current endpoint URL for the service.


    Figure 8-3 on page 256 shows the high-level solution overview for the WS-I SCM
    sample application we developed in Chapter 4, “Service-oriented architecture approach”
    on page 79. In this section we add a service directory Product mapping for the
    Runtime pattern highlighted in Figure 8-3 on page 256.'
