  md: '# WebSphere Studio Application Developer


    WebSphere Studio V5.1 provides a number of tools to enable publishing and discovery
    of Web services using UDDI, including:


    +   - Web Services Client wizard for creating a Java client to a deployed Web
    service and for testing the Web service

    - Unit Test UDDI wizard for installing, configuring, and removing a private UDDI
    registry

    - Web Services Explorer for discovering and publishing your Web service descriptions


    These tools provide facilities to browse the UDDI registries or WSIL documents
    to locate existing Web services for integration. Web services can be published
    to a UDDI V2 Business Registry, advertising your Web services so that other businesses
    and clients can access them. These tools support the following specifications:


    +   - Universal Description, Discovery, and Integration 2.0

    - Web Services Inspection Language (WSIL) 1.0


    # UDDI4J and UDDI4JV2


    The UDDI standard describes a set of XML messages that can be exchanged between
    a service consumer (client program) and a UDDI registry.


    UDDI4J is a client Java API used to interact with a UDDI registry. This class
    library generates and parses messages sent to and received from a UDDI server.
    It provides two sets of APIs:


    +   - Publish APIs, which are used by the provider to manage its entries in the
    registry. It contains Query, Save, Delete and Authorization methods.

    - Inquiry APIs, which are used by the requester and the provider to retrieve service
    information. It contains Find and Retrieve methods.


    UDDI4J follows the evolution of the UDDI standards. UDDI4J is the API used to
    communicate with UDDI V1 directories, while UDDI4J V2 is the API used to communicate
    with UDDI V2 directories. As UDDI registries are accessed via service protocols,
    SOAP transport is required to use UDDI4J V1 or V2.


    The classes of UDDI4J have the prefix org.ibm.uddi. The classes of UDDI4JV2 have
    the prefix org.uddi4j. The UDDI directory provided with IBM WebSphere Application
    Server Network Deployment V5.0 is a UDDI V2 directory, so clients use the UDDI4JV2
    APIs to find information about a service.


    For more information on UDDI4J see:


    ```

    http://www.ibm.com/developerworks/oss/uddi4/

    ```'
  merge: -1
  pgno: 276
