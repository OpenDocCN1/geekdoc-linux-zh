  md: 'A Web service is considered a set of endpoints operating on messages containing
    either document-oriented or procedure-oriented (RPC) messages. WSDL offers a standard
    way to abstract describe the operations and messages: The service interface definition.
    These descriptions are bound to a specific network protocol and message format
    to create an endpoint: The service implementation definition. Figure 5-7 shows
    this combination.


    | Service Implementation | <definitions...><import...><service...><port...></service></definitions>
    |

    |---|---|

    | Service Interface Definition | <definitions...><types...><import...><message...><portttype...><binding...></definitions>
    |


    Figure 5-7 Components of a basic service description using WSDL


    The service interface definition can be instantiated and referenced by multiple
    service implementations.


    A WSDL document is defined in one or more physical files according to the implementation.
    When several files are used an import element is used to link each file. The WSDL
    is generally divided into an implementation WSDL file and an interface WSDL file.
    The binding may be defined in a separate, third file.


    WSDL does not prescribe any specific message format or network protocol. However,
    the WSDL 1.1 specification only describes bindings for SOAP 1.1 over HTTP, direct
    HTTP 1.1 request (HTTP GET and POST), and Multipurpose Internet Mail Extensions
    (MIME).


    # Advantages of WSDL


    As a fundamental requirement for the implementation of Web services, WSDL is required
    to publish the interface description contract for other services to invoke upon.'
