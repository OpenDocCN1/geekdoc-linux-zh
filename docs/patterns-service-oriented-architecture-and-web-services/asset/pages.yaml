    \ Network Deployment V5.0.\n\n# ### 8.3.3 Service consumer (client) development\
    \ considerations\n\nAs discussed in \"invoking the service\" on page 209, there\
    \ are three main design alternatives for invoking a service using JAX-RPC. They\
    \ are stub based, dynamic invocation interface, and dynamic proxy.\n\nThe SCM\
    \ application uses static stubs. A stub is a Java class that is statically bound\
    \ to the Service Endpoint Interface (SEI), WSDL port, and port component. It is\
    \ also tied to a specific protocol binding and transport. A stub class defines\
    \ all the methods that an SEI defines. Therefore a client can invoke a Web service\
    \ directly via the stub class. However, each time the Web service definition is\
    \ modified (interface or implementation) the stub must be regenerated.\n\nWe need\
    \ to modify the Retailer application to locate the endpoint URL of the Warehouse\
