    # 2.4 Enterprise Service Bus


    Web services based technologies are becoming more widely used in enterprise application
    development and integration. One of the critical issues arising now is finding
    more efficient and effective ways of designing, developing and deploying Web services
    based business systems; more importantly, moving beyond the basic point-to-point
    Web services communications to broader application of these technologies to enterprise-level
    business processes. In this context, the Enterprise Service Bus (ESB) model is
    emerging as a major step forward in the evolution of Web services and service-oriented
    architecture.


    # 2.4.1 Basic Web services


    (Point-to-point SOAP/HTTP) Web services provide a solid foundation for implementing
    a service-oriented architecture, but there are important considerations that affect
    their flexibility and maintainability in enterprise-scale architectures.


    First, the point-to-point nature of basic Web services means that service consumers
    often need to be modified whenever the service provider interface changes. This
    is often not a problem on a small scale, but in large enterprises it could mean
    changes to many client applications. It can also become increasingly difficult
    to make such changes to legacy clients.


    Second, you can end up with an architecture that is fragile and inflexible when
    large numbers of service consumers and providers communicate using point-to-point
    "spaghetti" style connections.'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'Last, basic Web services require that each consumer has a suitable protocol
    adapter for each provider it needs to use. Having to deploy multiple protocol
    adapters across many client applications adds to cost and maintainability issues.


    Let us look at how the Enterprise Service Bus approach addresses these issues.


    # 2.4.2 What an Enterprise Service Bus is


    The Enterprise Service Bus concept is not a product, but an architectural best
    practice for implementing a service-oriented architecture. As shown in Figure
    2-12, it establishes an enterprise-class messaging bus that combines messaging
    infrastructure with message transformation and content-based routing in a layer
    of integration logic between service consumers and providers.


    | Service Consumers | Enterprise Service Bus

    - Transforms message formats between consumer and provider

    - Routes requests to correct service provider

    - Converts transport protocols between consumer and provider | Service Providers
    |


    Figure 2-12 Enterprise Service Bus


    The main aim of the Enterprise Service Bus is to provide virtualization of the
    enterprise resources, allowing the business logic of the enterprise to be developed
    and managed independently of the infrastructure, network, and provision of those
    business services. Resources in the ESB are modelled as services that offer one
    or more business operations.


    Implementing an Enterprise Service Bus requires an integrated set of middleware
    services that support the following architecture styles:


    +   - Services oriented architectures, where distributed applications are composed
    of granular re-usable services with well-defined, and standards-compliant interfaces

    - Message-driven architectures, where applications send messages through the ESB
    to receiving applications

    - Event-driven architectures, where applications generate and consume messages
    independently of one another'
