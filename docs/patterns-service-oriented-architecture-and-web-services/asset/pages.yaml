  md: '# Preface


    The Patterns for e-business are a group of proven, reusable assets that can be
    used to increase the speed of developing and deploying Web applications. This
    IBM® Redbook focuses how the Self-Service and Extended Enterprise business patterns,
    and the Application Integration pattern, can be used to start implementing solutions
    using the service-oriented architecture approach.


    It guides you through the process of selecting and applying Business, Application
    and Runtime patterns. Next, the platform-specific Product mappings are identified
    based upon the selected Runtime pattern.


    The book presents guidelines for applying the Patterns and service-oriented architecture
    approach to a sample business scenario and for selecting Web services technologies.


    It provides detailed design, development, and runtime guidelines for several scenarios,
    including synchronous and asynchronous service buses, UDDI service directory,
    and the Web Services Gateway.


    The book concludes with an examination of how a service-oriented architecture
    can provide a step in the direction of IBM''s e-business on-demand vision.


    # The team that wrote this redbook


    This redbook was produced by a team of specialists from around the world working
    at the International Technical Support Organization, Raleigh Center.'
