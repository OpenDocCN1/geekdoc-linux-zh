  md: '# 9.1 Business scenario


    The sample application used in this chapter is the same simplified WS-I Supply
    Chain Management (SCM) sample used in Chapter 6, "HTTP service bus" on page 159.
    We introduce a non-functional requirement that suggests the addition of a service
    gateway.


    In this scenario, the requirement is for a more secure and flexible way of controlling
    access to the services consumed and across the organization boundary. The IT department
    has reviewed the technology options available, and decided that a Web services
    gateway should be used, starting with a pilot for interactions between the warehouse
    and external manufacturers. The change to the business scenario is shown in Figure
    9-1.


    ![](img/334ef4856dbfc14b1f371b2c8b5e06b2_297_0.png)


    Figure 9-1 High-level business context with service discovery


    In this scenario, we focus on the inter-enterprise interaction between the Warehouse
    service and the external Manufacturer services to satisfy the UC4: Supply finished
    goods use case. We introduce the IBM Web Services Gateway to act as a proxy for
    the WarehouseCallBack and Manufacturer services. Introducing the IBM Web Services
    Gateway provides a number of advantages:


    +   - Central access point for all services crossing the enterprise boundary


    The gateway provides a single, well-known point to all internal service consumers
    to access external service providers, and vice versa.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '+   Decoupling the deployment of Web services from clients


    The gateway isolates any changes in the deployment of services also consumers
    of the services. The location of services also becomes transparent to clients
    of the service.


    +   Central security control point


    Access control can be applied to Web services so only authorized consumers are
    allowed to access services.


    +   Protocol conversion between Web service requesters and providers


    Access to the services of applications that use protocols other than HTTP planned
    for the near future. Therefore, access to the Web services has to be open for
    different protocols.


    # 9.2 IBM Web Services Gateway


    The IBM Web Services Gateway is a runtime component that provides configurable
    mapping between Web service providers and requesters. Services defined with WSDL
    can be mapped to available transport channels. The Web Services Gateway is included
    with IBM WebSphere Application Server Network Deployment V5.0.2.


    The basic gateway components are:


    +   Channels that define the entry-points into the gateway and carry the Web service
    request and response through the gateway


    +   Filters that are used to intercept service invocations which come into the
    gateway and act upon the services


    +   Services that are described with the help of Web Services Description Language
    (WSDL) document


    +   UDDI references to manage the publishing of an exposed Web service to a private
    or public UDDI registry


    Figure 2-9 on page 282 shows the relationship between the three components. The
    entry point to gateway is defined by a channel. A channel is a piece of software
    that defines the protocol you can use to access the gateway. The incoming message
    is assessed on arrival through the channel to determine which service is required.
    Each service (defined in a WSDL document) has to be bound to one or more filters
    can be bound to a service for manipulating both request and response messages.
    The WSDL definition specifies the provider service interface and implementation
    used to access the target service.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '![](img/334ef4856dbfc14b1f371b2c8b5e06b2_299_0.png)


    Figure 9-2 IBM Web Services Gateway


    A request to the Web Services Gateway arrives through a channel and is translated
    into an internal representation of the service. With the help of filters for the
    request, a request can be logged, intercepted, or generally manipulated After
    filtering the request, an appropriate provider is used to communicate with the
    target service. The provider in the gateway acts as a client for the target Web
    service.


    The response from the target service flows along the exact same path back to the
    provider. There is no extra channel for an immediate response. In this sense the
    layout of the gateway is asymmetric. However, one or more response filters can
    be deployed independently of the request filters.


    The process of deploying a target service into a gateway channel generates two
    external WSDL files; an implementation definition and an interface definition.
    These new WSDL files can be exported for use by client applications, and the externalization
    of the service capabilities offered by the internal target service. The implementation
    WSDL definition is used to simplify the connection for a client, particularly
    when dynamic invocation is being used. Having obtained implementation definition,
    the client can access the WSDL interface definition produced by gateway, which
    provides full information about the target service (as presented externally by
    the gateway).


    The Web Services Gateway uses the Web Services Invocation Framework (WSIF) API
    from Apache to decouple invocation from deployment within the gateway. Over time,
    the location of the Web service target application and the bindings may change,
    but these details are handled by the gateway. The Web Services Gateway separates
    the actual implementation of a service from how it is accessed by another service
    for:


    +   - Inbound requests: To Web services created and deployed within the organization.'
  merge: -1
  pgno: 299
- img_proc: true
  md: '+   Outbound requests: To Web services created and deployed outside the organization.


    +   Process abstraction: The service invocation approach must be flexible enough
    to cope with events such switching frequently between external providers of a
    similar service without requiring changes to the application.


    +   Flexibility: As a service provider, you need the flexibility to change your
    deployment infrastructure without notifying all the service requestors. For example,
    consider a Web service deployed in a machine that later fails during operation.
    There needs to be a process to route the invocations to an alternate service in
    your infrastructure.


    WSIF is used within Web Services Gateway as shown in Figure 9-3 on page 284. It
    demonstrates the WSIF transformation from a SOAP message to a target service:


    +   1. The SOAP message arrives at the gateway and the channel listener accepts
    the message.


    +   2. The channel converts the SOAP message into a WSIF message format.


    +   3. Elements within the message are used to locate the appropriate target service,
    which is bound to the channel within the gateway.


    +   4. The target WSDL associated with the gateway service is then processed by
    WSIF.


    +   5. WSIF dynamically generates a Java proxy class.


    +   6. The target Web service is called.'
