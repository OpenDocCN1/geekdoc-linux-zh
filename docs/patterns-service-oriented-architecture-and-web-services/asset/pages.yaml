  md: '# 5.7 Service registry


    The service registry layer in our architectural stack, shown in Figure 5-13, allows
    service providers to publish the definition of the services they offer using WSDL
    and service consumers to find information about the services available.


    | Functions | Quality of Service |

    | --- | --- |

    | Service Registry | Policy Security Transaction Management |

    | Business Process | |

    | Service | |

    | Service Description | |

    | Service Communication Protocol | |

    | Transport | |


    Figure 5-13 The service registry layer


    In web services architectures, the UDDI registry is typically mentioned in this
    role. The UDDI registry is often compared to the Yellow Pages of a telephone system.
    However, this approach overlooks some other ways to provide the information needed
    to exploit available services.


    Continuing with the telephone system analogy, let us look at some of the alternatives:


    +   - Direct request


    When you need to know the telephone number of a person, one of the easiest ways
    to get it is to request it from person directly. That is very often the way to
    get the mobile number of a person because telephone directories rarely list mobile
    phone numbers.


    +   - Simple aggregate publishing


    When business people meet, they often exchange business cards. Business cards
    are a way to provide telephone numbers and additional information, such as fax
    numbers, e-mail addresses, and so on. Of course, you need to'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'have them printed in the first place, which adds some complexity over the direct
    request solution.


    +   Directory use


    It is only on some occasions that people refer to Yellow Pages; for example, to
    discover a service provider in a domain they are not familiar with. The Yellow
    Pages Directory provides more information than the other methods but requires
    a large effort to centralize information and publish it.


    Similarly for Web services, you can use simple to complex discovery mechanisms
    to satisfy various business needs:


    +   The exchange of a service description on anything from an e-mail to a diskette
    can be compared to a direct request.


    +   WS-Inspection Language can be compared to business cards.


    +   The UDDI registries can be compared to Yellow Pages.


    Figure 5-14 summarizes this discussion. This figure was adapted from Web Services
    Conceptual Architecture Version 1.0, available at:


    ```

    http://www.ibm.com/software/solutions/webservices

    ```


    ![](img/334ef4856dbfc14b1f371b2c8b5e06b2_157_0.png)


    Figure 5-14 Service discovery continuum


    # 5.7.1 Static and dynamic Web services


    The ultimate aim of a fully automated service-oriented information system, on
    an demand system, is to provide up-to-the minute discovery and bind to services.'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'However, this fully automated model is not yet the prevailing one either at
    build time or at run time.


    There are two ways of binding to Web services: *Static and dynamic.*


    +   - In the static process, the binding is done at design time. The service consumer
    obtains a service interface and implementation description through a proprietary
    channel from the service provider (by e-mail, for example), and stores it in a
    local configuration file. No private, public, or shared UDDI registry is involved


    This process is well adapted to the development environment. The drawback is that
    makes it more difficult to receive information on the latest status of service
    over time.


    +   - The dynamic binding occurs at runtime. While the client application is running,
    it dynamically locates the service using a UDDI registry and then binds it to
    using WSDL and SOAP.


    This requires that the contents of the UDDI registry be trusted as well as the
    service provider. Currently, only private UDDI networks can provide such control
    over the contents.


    # 5.7.2 UDDI


    The current standard for services registries is the Universal Discovery Description
    and Integration standard defined by the UDDI organization, which is part of the
    OASIS organization, and is intended to act as an information broker between the
    service consumers and the service providers. At time of writing this book, the
    latest version of the standard is version 3.


    UDDI specifies how to store and retrieve information about services and especially
    the provider name and the technical interfaces.


    # UDDI registry structure


    There are several types of information stored in a UDDI structure. As shown in
    Figure 5-15 on page 142, this includes four primary data types:


    +   - *Entity*, describing the service provider


    +   - *businessService*, containing non-technical information about a service


    +   - *bindingTemplate*, containing technical information to access the service
    (for example, URL, and may map to a WSDL document port)


    +   - *tModel*, or technical model'
  merge: -1
  pgno: 158
- img_proc: true
  md: '![](img/334ef4856dbfc14b1f371b2c8b5e06b2_159_0.png)


    Figure 5-15 highlights the links between UDDI entries in a WSDL document.


    ![](img/334ef4856dbfc14b1f371b2c8b5e06b2_159_1.png)


    Figure 5-16 WSDL to UDDI mapping'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# Types of UDDI registries


    There are three main types of UDDI registries that deal with different business
    paradigms:


    +   - UDDI operator cloud node


    A public implementation of the UDDI standard is the UDDI Business Registry, or
    UBR. The UBR consists of several UDDI nodes. These nodes are managed by companies
    such as IBM, Microsoft, SAP and NTT. When a service provider wants to publish
    its services, they go to the UBR Web sites and register and publish their services.
    The data is then replicated to all nodes in the UBR. For an example of a UBR,
    see:


    ```

    http://uddi.ibm.com

    ```


    The initial standard was focused on a multi-node public UBR. In addition to the
    description of services, it deals extensively with the replication and management
    issues of a multi-node environment.


    This registry supports the claim of universal Web services discovered at run time.


    At the time of writing this book, the UBR contains a limited number of entries.
    Among those entries very few are real services. Most entries are descriptions
    of businesses.


    +   - Group or partner registries


    These implementations focus on a specific number of known partners, generally
    from the same industry, to focus on really needed services and tackle the issue
    of confidence between providers and consumers.


    +   - Private registries


    Most companies tend to start Web services projects using an internal (private)
    UDDI registry.


    # Service discovery with UDDI registries


    In addition to storing information about services in an orderly manner, UDDI registries
    provide a search tool for easy discovery of services:


    +   - For example, all the services provided by a given business entity.


    +   - Listing of services according to various categorizations.


    # 5.7.3 Emerging standards for service registry


    The only emerging standard currently under development for service registry is
    WS-Inspection.'
  merge: -1
  pgno: 160
- img_proc: true
  md: 'WS-Inspection specification, developed by IBM and Microsoft, allows the inspection
    of services offered at a site using an XML document made available at the point-of-offering.
    It provides a format for listing references to service description documents that
    have been authored in any number of formats. It also defines a set of conventions
    making it easy to locate WS-Inspection documents.


    For more information on WS-Inspection see IBM Redbook, WebSphere Version 5.1/Application
    Developer 5.1.1 Web Services Handbook, SG24-6891.


    # 5.8 Policy


    Policy has both functional and quality of service aspects in our architectural
    stack, as shown in Figure 5-17.


    | Functions | Quality of Service |

    |---|---|

    | Business Process | |

    | Service | |

    | Service Description | Policy Security Transaction Management |

    | Service Communication Protocol | |

    | Transport |


    Figure 5-17 The policy layer


    # 5.8.1 Emerging standards for policy


    The WS-Policy framework is a metadata framework for describing quality of service
    (QoS) requirements and capabilities associated with services.'
  merge: -1
  pgno: 161
- img_proc: true
  md: 'The WS-Policy element in the Web services security roadmap provided by IBM
    and Microsoft in April 2002 has been further refined to include four documents:


    +   - A Policy Framework (WS-Policy) document that defines a grammar for expressing
    Web services policies


    +   - A Policy Attachment (WS-PolicyAttachment) document that defines how to attach
    these policies to Web services


    +   - A set of general policy assertions (WS-PolicyAssertions)


    +   - A set of security policy assertions (WS-SecurityPolicy)


    WS-Policy is designed to allow extensibility. Policy is a broad term covering
    only security, but other domains such as reliability, transactions, privacy, and
    so on. Each domain requires a language that lays out the available policy assertions
    for the domain, as WS-SecurityPolicy for security.


    In the future, WS-Policy should allow the selection of service providers based
    on their published capabilities. Service consumers could also use WS-Policy to
    publish their capabilities and requirements, allowing matching of compatible service
    consumers and providers.


    Using the Enterprise Service Bus vision introduced in 2.4, "Enterprise Service
    Bus" on page 38, service consumers and providers could publish their policy requirements
    and capabilities to the ESB. The ESB could then identify the mediations needed
    in the request flow to meet the QoS requirements of; for example, by setting message
    context (such as transaction IDs) and message security (such as encryption).


    # Where to find more information


    For more information on WS-Policy, see the following articles on IBM DeveloperWorks:


    +   - Web Services Policy Framework (WS-Policy) specification at:

    http://www.ibm.com/developerworks/library/ws-polfram/


    +   - Web Services Security: Moving up the stack, New specifications improve the
    WS-Security model at:

    http://www.ibm.com/developerworks/webservices/library/ws-secroad/


    # 5.9 Security


    In the world of e-business, we rely heavily on the exchange and transport of data
    between a number of dispersed systems and applications, both within the enterprise
    and across organizational boundaries to business partners, suppliers'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'and customers. Whenever we need to package and exchange data, there is an inherent
    risk that during the time the data is traveling between its source and target
    application it can be intercepted and therefore stolen or modified. This threat
    is inherently high in a distributed architecture such as Web services, transactions
    between a service consumer and the service provider are conducted using plain
    XML included in a SOAP message. This means that anyone who manages to intercept
    the transaction could easily read the data included within the SOAP payload. The
    security layer of the architectural stack, as shown in Figure 5-18, was included
    to secure Web services against these types of threats.


    ![](img/334ef4856dbfc14b1f371b2c8b5e06b2_163_0.png)


    Figure 5-18 The security layer


    In any architectural solution, the following security requirements must be addressed,
    with no exceptions when it comes to Web services:


    +   - Identification: The party accessing the resource is able to identify itself
    to the system.

    - Authentication: There exists a procedure to verify the identity of the accessing
    party.

    - Authorization: There exists a set of transactions the authenticated party is
    allowed to perform.

    - Integrity: The information is not changed on its way.

    - Confidentiality: Nobody is able to read the information on its way.


    146 Patterns: Service-Oriented Architecture and Web Services'
  merge: -1
  pgno: 163
- img_proc: true
  md: '+   - Auditing: All transactions are recorded so that problems can be analyzed
    after the fact.


    +   - Non-repudiation: Both parties are able to provide legal proof to a third
    party the sender did send the information, and the receiver received the identical
    information.


    Most of the systems implemented using Web services today only partially fulfill
    these requirements, either due to lack of standards or stable technologies.


    In April 2002, IBM and Microsoft proposed a technical strategy and roadmap for
    “addressing security within a Web service environment.” The Web services (WS-Security)
    specifications define a comprehensive Web service security model that supports,
    integrates and unifies several security model, mechanisms, and technologies (including
    both symmetric and public key technologies) in a way that enables a variety of
    systems to securely operate in a platform- and language-neutral manner.


    The WS-Security specification provides a broad set of specifications that cover
    security technologies including authentication, authorization, privacy, trust,
    integrity, confidentiality, secure communications channels, federation, delegation,
    and These specifications provide a framework across a wide spectrum of application
    and business topologies that is extensible, flexible, and maximizes existing investments
    in security infrastructure. By leveraging the natural extensibility that is at
    the core of the Web services model, the specifications build upon foundational
    technologies such as SOAP, WSDL, XML Signatures, XML Encryption, and SSL/TLS.


    As shown in Figure 5-19 on page 148, this sets a message security model (WS-Security)
    that provides the basis for the other security specifications. Layered on this,
    we have a policy layer that includes a Web service endpoint policy (WS-Policy),
    a trust model (WS-Trust), and a privacy model (WS-Privacy). Together these initial
    specifications provide the foundation upon which we can work to establish secure
    interoperable Web services across trust domains.'
  merge: -1
  pgno: 164
- img_proc: true
  md: '![](img/334ef4856dbfc14b1f371b2c8b5e06b2_165_0.png)


    For more information, see the IBM developerworks *Security in a Web Services World:
    A Proposed Architecture and Roadmap:*


    http://www.ibm.com/developerworks/webservices/library/ws-secmap/


    As already identified, the landscape of Web services security is still being defined,
    and although new standards are continually being developed and deployed, the ways
    to achieve security with Web services today is at the levels:


    +   - At the transport level

    - At the transport level, Web services are secured by the in-built security features
    of transport channel technologies such as HTTPS.

    - At the service communication protocol level

    - Although constantly evolving with new specifications being developed, Web services
    security at this level is ensured using SOAP message based security.

    - At the service description level

    With XML document exchange as one of the fundamental components of Web services,
    it stands to reason that another level of security can be achieved at the service
    description level through the use of current XML-based security technologies such
    as digital signatures and encryption.'
  merge: -1
  pgno: 165
- img_proc: true
  md: '| Functions | Quality of Service | |

    | --- | --- |

