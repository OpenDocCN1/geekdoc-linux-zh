  md: '"A Web service is a software application identified by a URI, whose interfaces
    and bindings are capable of being defined, described, and discovered as XML artifacts.
    A Web service supports direct interactions with other software agents using XML-based
    messages exchanged via Internet-based protocols."


    Basic Web services combine the power of two ubiquitous technologies: XML, the
    universal data description language; and the HTTP transport protocol widely supported
    by browser and Web servers.


    ```

    Web services = XML + transport protocol (such as HTTP)

    ```


    Some of the key features of Web services are the following:


    +   - Web services are self-contained.


    On the client side, no additional software is required. A programming language
    with XML and HTTP client support, for example, is enough to get you started. On
    the server side, maybe Web server and a servlet engine are required. It is possible
    to Web service enable an existing application without writing a single line of
    code.


    +   - Web services are self-describing.


    Neither the client nor the server knows or cares about anything besides the format
    and content of request and response messages (loosely coupled application integration).


    The definition of the message format travels with the message. No external metadata
    repositories or code generation tools are required.


    +   - Web services are modular.


    Web services are a technology for deploying and providing access to business functions
    over the Web; JEE, CORBA, and other standards are technologies for implementing
    these Web services.


    +   - Web services can be published, located, and invoked across the Web.


