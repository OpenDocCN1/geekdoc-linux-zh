    # 3.4.2 Application integration application patterns


    Application patterns for Application Integration can be broadly categorized as
    either Process-focused or Data-focused. These two categories enable different
    types of integration functionality:


    +   - Process-focused integration: The integration of the functional flow of processing
    between the applications and services

    - Data-focused Integration: The logical integration of the information used by
    applications


    Selecting the right Application Integration approach depends on the integration
    requirements of the business problem being automated. In publication we focus
    on the Process-focused approach. For full details on the other Application Integration
    patterns, please see the IBM Patterns for e-business Web site:


    ```

    http://www.ibm.com/developerworks/patterns

    ```


    Process-focused Application Integration patterns are observed where multiple automated
    business processes are combined to yield a new business offering or to provide
    a consolidated view of some business by integrating multiple corporate business
    systems. An often quoted example is the consolidated view of the state of all
    relationships of the business with a particular customer.


    This mode of integration is highly flexible. In its most sophisticated form it
    enables "late binding" of the targets of integration and is particularly useful
    in tying different platforms and technologies. However, it represents a'
  merge: -1
  pgno: 67
