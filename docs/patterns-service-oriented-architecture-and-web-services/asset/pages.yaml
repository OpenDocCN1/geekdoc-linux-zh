  md: '# Testing alternative: Build your own test client


    You will probably run into one limitation or another with the Web service test
    tools. For example, the tools may not support SOAP headers or certain XML types.
    In these cases another alternative is to build your own test client. The Service
    Client wizard makes it very easy to generate a stub that you can then invoke from
    a very simple JSP, for example.


    # Testing the client


    Testing considerations for your client application are the same as for any other
    application. You will need to ensure that:


    +   - The owner of the service provides a test version that includes specific
    test cases for validation that your client is working correctly.


    +   - You have appropriate network connectivity from your development environment
    to the test service.


    # 6.4 Runtime guidelines


    Once the services or service consumers are developed, they need to be deployed
    to a runtime environment. For this project, we used IBM WebSphere Application
    Server V5.1, which provides runtime support for the programming models discussed
    earlier in this chapter, including JAX-RPC.


    # 6.4.1 Service deployment considerations


    The options available to deploy each service include:


    +   - Preparation of an enterprise archive (EAR) file containing all the implementation
    code and WSDL files, which can then be deployed by the WebSphere Application Server
    Administrative Console.


    +   - Use of the WebSphere Studio Application Developer application publishing
    function.


    We choose to export an EAR file from WebSphere Studio, since we were using a temporary
    development and server infrastructure. If you are regularly developing, testing,
    and publishing Web services, you should consider setting up the remote publishing
    facility.


    # Publishing a service for deployment


    To publish a service, we performed the following steps:


    +   1. In WebSphere Studio, select the enterprise project to be exported.


    +   2. Right click, and select Export....'
