    # 3


    # # Service-oriented architecture and Patterns for e-business

    In this chapter we introduce how the IBM Patterns for e-business compliment the
    service-oriented architecture (SOA) approach. We look at how SOA applies to Patterns,
    in particular the Self-Service and Extended Enterprise business patterns, the
    Application Integration pattern, and the associated Application patterns, Runtime
    patterns, and Product mappings.


    A detailed description of the service-oriented architecture approach can be found
    in Chapter 4, "Service-oriented architecture approach" on page 79.'
  merge: -1
