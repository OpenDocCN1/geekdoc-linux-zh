    # 6.5 Best practices


    There are a number of sources of best practice information for Web services implementations.
    In particular, we suggest using the IBM developerWorks section on Web services,
    which is frequently updated with new information. See:


    http://www.ibm.com/developerworks/webservices/


    This section summarizes some of the key practices that have been developed by
    IBM Web services implementation teams.'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# 6.5.1 Design practices


    The best practices listed in Table 6-5 deal with the design of your Web service.


    Table 6-5 Design best practices


    | Topic | Explanation | Reason |

    |---|---|--|

    | Develop incrementally | Start with small set of services and build on them as
    requirements dictate. | Allows you to absorb all the technologies, implement your
    own best practices, and test. |

    | Granularity | Design Web services as complete units of work. A Web service properly
    maps best to the implementation of a use case. Implement a facade over grained
    object methods. | Minimize network latency and the number of cross-network calls.
    |

    | Interaction style | Implement an appropriate interaction style for each business
    scenario. Do not automatically assume synchronous request/reply is required. |
    Minimize performance overhead of unnecessary network calls. |

    | Separate interface and implementation in WSDL | Use tools to generate WSDL and
    then inspect generated WSDL to ensure it meets your requirements. | Tool vendors
    cannot predict exactly how you plan to have a service used. Check the generated
    code. |

    | Binding style | Select RPC style when using RPC model and the target application
    does not accept XML. Use document style in situations. | Use the style appropriate
    to the application. RPC style *may* perform less than document style. |

    | State management | If state management is required, implement it in the consumer,
    or use implementations of BPEL4WS. | Web services should be stateless to avoid
    issues with scalability and flexibility of deployment. |

    | Caching | Cache service locations and other appropriate information (does not
    change regularly) on the consumer. The JAX-RPC programming model includes a cached
    endpoint that could be used. | Minimize application latency due to network transport.
    |'
  merge: -1
  pgno: 241
- img_proc: true
  md: '| Topic | Explanation | Reason |

    |---|---|--|

    | Minimize size of XML messages | Avoid unnecessary data, and consider using both
    references and caching. | The larger and more complex the XML message that passes
    between services, the slower the service will perform. |

    | Unique namespaces | Use your company name or a unique domain name to avoid schema
    element clashes. | Ensures your service consumers are using the correct schema.
    |

    | WSDL readability | Ensure element names are meaningful and WSDL is annotated.
    | Particularly for tool generated WSDL, simplifies use of the service and debugging.
    |


    # 6.5.2 Interoperability best practices


    The best practices listed in Table 6-6 deal with the design of your Web service
    to maximize the chance that it will be interoperable with other systems.


    | Topic | Explanation | Reason |

    |---|---|--|

    | Use WS-I Basic Profile systems | Use only literal encoding. Use document or
    rpc style according to business requirements. Use products that implement WS-I
    Basic standards. | Use of these standards means interoperability more likely.
    |

    | Simplify WSDL and schemas | Different implementations deal with different facilities
    in unique ways. Avoid mixed type arrays and the use of sequences. | Not all SOAP
    implementations implement the standards correctly. |

    | Test boundary conditions | Test services that send a range of invalid data,
    invalid SOAP headers, invalid schema information, and so on. | Some implementations
    are forgiving of invalid SOAP requests. Ensure your assumptions about consumers
    or providers are correct. |


    # 6.5.3 Java implementation best practices


    The best practices listed in Table 6-7 on page 226 deal with the implementation
    of your Web service in the Java programming model.'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# Table 6-7 Java implementation best practices


    | Topic | Explanation | Reason |

    | --- | --- | --- |

    | Use EJB | If possible, use stateless session EJBs for both service implementations
    and service consumers. | Better management facilities, role-based security, and
    reuse within the firewall. |

    | Use JAX-RPC | Java standard for implementation of Web services. | More likely
    to produce interoperable Web services. |

    | Use serializable interface | A serialization engine manages which objects are
    serialized to XML and vice-versa. | Improved performance, since only the required
    data is serialized. Compatible with J2EE approach. |

    | Implement a facade (interface class) | Do not expose existing methods as services.
    Wrap them with a facade class, and expose that as a service. | Ensures course
    granularity, improves performance, and hides implementation details from consumers.
    |

    | Do not initialize variables | For objects being created on serialization of
    XML, the initialized variables will be over-written. | Application performance.
    |


    # 6.5.4 Performance best practices


    The best practices listed in Table 6-8 help you ensure the best possible performance
    for your Web service.


    # Table 6-8 Performance best practices


    | Topic | Explanation | Reason |

    | --- | --- | --- |

    | XML parser | Make sure your service implementation is using the most recent
    XML parser available. | The XML parser is a significant contributor to the overall
    service performance, and new parsers tend to be faster than old ones. |

    | Use SAX | Use a SAX parser rather than DOM if possible. Recent IBM implementations
