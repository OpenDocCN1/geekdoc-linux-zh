    The purpose of publishing the WS-I SCM services in the UBR is to allow the discovery
    of the service interface definitions (in WSDL files). This information is necessary
    to build a Web service client. However, neither the name of the Business Entity
    nor the URL for accessing the implementation of the service (the server where
    the service actually runs) is given. Vendors participating in the WS-I scenario
    need to provide information in the UBR once they have built their services and
    made them available on the Web.'
