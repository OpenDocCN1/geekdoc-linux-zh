  md: 'more difficult design and development task compared to data-focused integration
    and often requires complex middleware.


    The Process-focused Application Integration patterns are presented here in order
    of increasing flexibility and sophistication. As the Application patterns build
    on each other, their capabilities and reliance on middleware increase, and they
    require less application development effort. From the following Application patterns,
    select the one that fits your requirements:


    +   - Direct Connection application pattern: Message/Call Connection variations


    +   - Broker application pattern: Router variation


    +   - Serial Process application pattern: Serial Workflow variation


    +   - Parallel Process application pattern: Parallel Workflow variation


    Using the classification framework shown in Figure 3-4 on page 50, the four Process-focused
    Application Integration patterns are classified as shown in Figure 3-5.


