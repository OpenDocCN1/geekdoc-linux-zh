  md: '# 2.1 Overview of service-oriented architecture


    In this section we briefly describe the evolution of service-oriented architecture.
    We then explore the relationship between component-based development and service-oriented
    architecture and show how components can be the cornersstones of the infrastructure
    for implementing services.


    # 2.1.1 The business drivers for a new approach


    While IT executives have been facing the challenge of cutting costs and maximizing
    the utilization of existing technology, at the same time they have to continuously
    strive to serve customers better, be more competitive, and be more responsive
    to the business''s strategic priorities.


    There are two underlying themes behind all of these pressures: Heterogeneity and
    change. Most enterprises today contain a range of different systems, applications,
    and architectures of different ages and technologies. Integrating products from
    multiple vendors and across different platforms were almost a nightmare. But we
    also cannot afford to take a single-vendor approach to IT, because application
    suites and the supporting infrastructure are so inflexible.


    Change is the second theme underlying the questions that today''s IT executives
    face. Globalization and e-business are accelerating the pace of change. Globalization
    leads to fierce competition, which leads to shortening product cycles, as companies
    look to gain advantage over their competition. Customer needs and requirements
    change more quickly driven by competitive offerings and wealth of product information
    available over the Internet. In response the cycle of competitive improvements
    in products and services further accelerates.


    Improvements in technology continue to accelerate, feeding the increased pace
    of changing customer requirements. Business must rapidly adapt to survive, let
    alone to succeed in today''s dynamic competitive environment, and the IT infrastructure
    must enable businesses'' ability to adapt.


    As a result, business organizations are evolving from the vertical, isolated business
    divisions of the 1980s and earlier, to the horizontal business-process-focused
    structures of the 1980s and 1990s, towards the ecosystem business paradigm. Business
    services now need to be componentized and distributed. There is a focus on the
    extended supply chain, enabling customer and partner access to business services.
    Figure 2-1 on page 19 shows this evolution of business.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '![](img/334ef4856dbfc14b1f371b2c8b5e06b2_36_0.png)


    How do I make my IT environment more flexible and responsive to the ever changing
    business requirements? How can we make those heterogeneous systems and applications
    communicate as seamlessly as possible? How can we achieve the business objective
    without bankrupting the enterprise?


    The IT answers/enablers have been evolving in parallel with this evolution of
    business, as shown in Figure 2-2. Currently many IT executives and professionals
    alike believe that now we are getting really close to providing a satisfactory
    answer with service-oriented architecture.


    ![](img/334ef4856dbfc14b1f371b2c8b5e06b2_36_1.png)


    In order to alleviate the problems of heterogeneity, interoperability and ever
