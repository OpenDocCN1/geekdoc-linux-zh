    |

    |---|---|---|---|---||

    | | Service | | | | |

    | | Service Description | | | | |

    | | Service Communication Protocol | | | | |

    | | Transport | | | | |


    Figure 5-22 The transaction layer


    A transaction, in the traditional definition, is a mechanism that insures all
    participants in a given environment (both business and technical) obtain an agreed
    upon outcome, such as a business transaction, financial transaction, and data
    transaction. These transactions have the following properties:


    +   - Atomicity: If successful, then all the operations happen, and if unsuccessful,
    then none of the operations happen.

    - Consistency: The application performs valid state transitions to completion.

    - Isolation: The effects of the operations are not shared outside the transaction
    until it completes successfully.

    - Durability: Once a transaction successfully completes, the changes survive failure.


    # 5.10.1 Emerging standards for transaction


    To facilitate these definitions within a Web services environment, the transaction
    layer of our stack contains the WS-Coordination and WS-Transaction standards.
    Although a Web services environment requires the same level of coordination and
    behavior defined for a traditional transaction, to control the outcomes of an
    operation, a more flexible approach is also required to handle transactions and
    outcomes from multiple services.'
