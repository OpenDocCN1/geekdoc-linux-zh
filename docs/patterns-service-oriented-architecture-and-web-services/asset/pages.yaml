    Application patterns and their variations for the Extended Enterprise business
    pattern (also known as inter-enterprise integration):


    +   - Exposed Direct Connection application pattern: Message/Call Connection variations


    +   - Exposed Broker application pattern: Router variation


    +   - Exposed Serial Process application pattern: Also known as Managed Public
    Processes'
