    \ model is a standards-based approach to implementing Web services and Web service\
    \ clients in Java. JAX-RPC V1.0 is available as a generated programming model\
    \ in WebSphere Studio Developer V5.1. We recommend that this model be used for\
    \ both services and consumers where possible, since this is the most recent standards-based\
    \ approach available.\n\n# Emerging design alternative: JAX-RPC 1.1\n\nAt the\
    \ time of writing, on the V1.1 of the JAX-RPC standard was on-going. This level\
    \ of the standard is planned to provide support for the WS-I Basic Profile, and\
    \ significantly, support for the one-way scenario. You should consider"
