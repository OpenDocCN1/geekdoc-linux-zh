  md: '![](img/334ef4856dbfc14b1f371b2c8b5e06b2_42_0.png)


    Figure 2-6 Elements of a service-oriented architecture


    The architectural stack is divided into two halves, the left half addressing the
    functional aspects of the architecture and the right half addressing the quality
    of service aspects. These elements are described in detail as follows:


    Functional aspects includes:


    +   - Transport is the mechanism used to move service requests from the service
    consumer to the service provider, and service responses from the service consumer.

    - Service Communication Protocol is an agreed mechanism that the service provider
    and the service consumer use to communicate what is being requested and what is
