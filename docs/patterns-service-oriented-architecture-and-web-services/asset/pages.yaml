  md: '# 4.1 The SOA approach and Patterns for e-business


    A service-oriented architecture, as described earlier, is a set of business-aligned
    services that are combined (composed and choreographed) to fulfill business goals.
    IT systems provide interfaces to these services and combine them into applications
    that support rapidly changing business needs. The services are manifested as a
    set of interfaces without any dependencies on their implementation mechanism or
    location. This architectural style allows better alignment of required business
    capabilities with IT functions.


    # 4.1.1 Service identification


    SOA has implications not just at the technology level but at the junction point
    between business and technology. It helps bridge gap by bringing a more business-driven
    focus to how we discover and expose services. These services will often, but not
    necessarily always, be at the business use-case level. At this level, we are dealing
    with the large-grained activities that the business wants to expose, trigger,
    or support in a business process.


    Identifying the set of services that a business requires their IT to support is
    not a trivial task. Analysts agree that an approach or method is needed to uncover
    the business-aligned services, their dependencies, and their supporting large-grained
    components. Service identification is a determining factor in creating and migrating
    to a successful service-oriented architecture.


    The approach outlined in this chapter can be used with your existing application
    development method. It provides extensions to help you create an SOA. It augments
    current object-oriented methods with a set of seven steps and their corresponding
    outputs (artifacts or work products) that support the design of component-based,
    service-oriented architectures.


    # 4.1.2 Patterns for e-business and SOA


    The role of Patterns for e-business in the SOA approach is shown in Figure 4-1
    on page 81. Using the Patterns for e-business, we can leverage IBM best-practices
    in designing and building robust, industrial strength applications.'
  merge: -1
  pgno: 97
- img_proc: true
  md: '![](img/334ef4856dbfc14b1f371b2c8b5e06b2_98_0.png)


    Figure 4-1 Using Patterns for e-business with an SOA approach


    As highlighted in Figure 4-2 on page 82, most (if not all) of the Business and
    Integration patterns are applicable in the context of service-oriented architectures.


    The Self-Service business pattern allows users to interact with business services.
    The Collaboration pattern enables collaborations between business partners that
    partly involve service integration and partly involve workflow and people. The
    Extended Enterprise business pattern allows one business to interact with another
    businesses'' services. These Business patterns are combined on the front-end using
    the Access Integration pattern and on the back-end using the Application Integration
    pattern.'
