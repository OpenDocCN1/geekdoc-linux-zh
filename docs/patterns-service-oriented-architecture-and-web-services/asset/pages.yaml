    # Locating the service


    The Web Services Gateway locates the service provider (for example, Manufacturer)
    from the WSDL associated with the service. The location of the WSDL can be specified
    in two ways:


    +   - A URL that points to the WSDL file

    - A UDDI location


    This scenario uses a URL that points to the WSDL file because we do not have a
    requirement for consumers to dynamically discover the services offered by the
    gateway.


    # Why use a UDDI registry


    A UDDI registry can be used by the gateway node to obtain the interface description
    and the implementation description of the Web services is proxying.


    Although it may be easier in the short term to simply put the WSDL files of the
    Web services on a Web server to implement a solution using a public or a private
    registry, consider the following trade-offs:


    +   - Web sites do not have a discovery protocol that allows consumers to search
    for and download WSDL files.'
