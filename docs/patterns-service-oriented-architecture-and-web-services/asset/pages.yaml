- img_proc: true
  md: '# 3.1 Using service-oriented architecture with Patterns for e-business


    The Patterns for e-business is not a solution development methodology. It is a
    collection of proven architectures, derived from more than 20,000 successful Internet-based
    engagements. The Patterns for e-business bridge the business and IT gap by defining
    architectural patterns at the various levels shown in Figure 3-1, from Business
    patterns to Application patterns.


    With a service-oriented architecture approach, this is taken to another level
    of abstraction with the creation of a service integration layer. This enables
    a business to be agile and respond quickly and efficiently to changes in the market
    and its customer''s requirements, as well as to stay competitive.


    ![](img/334ef4856dbfc14b1f371b2c8b5e06b2_63_0.png)


    Figure 3-1 Service-oriented architecture and Patterns for e-business


    Patterns for e-business can be used with any methodology. When used with a SOA
    approach, the focus is on creating and integrating loosely coupled services instead
    of applications to support a business. The service-oriented paradigm leverages
    the notion of services as discrete building blocks of business functionality which
    are composed to satisfy business requirements. Services'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'self-contained and modular, while applications tend to be too coarse-grained
    to be reused effectively, and are often too inflexible to be leveraged within
    an enterprise or an extended enterprise.


    The existing Business, Integration, Application and Runtime patterns are consistent
    with the SOA approach. The business problem will drive the identification of the
    appropriate Business, Integration, Application and Runtime patterns involved in
    a potential solution. Runtime patterns that involve two more middleware nodes
    connecting logical application tiers will have additional communication options
    (and hence Product mappings) between the tiers with the use of services in SOA.


    One candidate for a new Composite pattern in the context of services is the Value-Chain.
    Essentially, the Value-Chain consists of a Self-Service business pattern and a
    set of recurring (often recurring) Extended Enterprise business patterns that
    can be combined to provide value to a chain of business partners. This end-to-end
    composite pattern is prevalent in any Value-Net.


    # # 3.2 Self-Service business pattern


    The Self-Service business pattern essentially captures the direct interactions
    between users and an enterprise, which range from simple information access to
    complex updates involving core enterprise systems and data. This blends nicely
    with a service-oriented architecture which fundamentally comprises service consumers
    and service providers. Users such as customers, business partners, stockholders
    and employees are service consumers, while the enterprise is the service provider.


    The Self-Service::Directly Integrated Single Channel application pattern, for
    example, provides a user access channel to presentation logic running in the presentation
    tier. The presentation tier can request or consume services provided on the Web
    application tier. The Web application tier in turn can consume services provided
    on the back-end or enterprise tier, as shown in Figure 3-2 on page 48.


    We use Application Integration patterns to examine these intra-enterprise service-oriented
    connections in more detail in 3.4, “Application Integration pattern” on page 49.'
  merge: -1
  pgno: 64
- img_proc: true
  md: '# 3.3 Extended Enterprise business pattern


    The Extended Enterprise business pattern addresses interactions and collaborations
    between business processes in separate enterprises. The interactions and collaborations
    are implemented using programmatic interfaces to connect inter-enterprise applications
    or services. In this instance, an enterprise can be both a service consumer and
    a service provider.


    The Extended Enterprise::Exposed Direct Connection application pattern, for example,
    allows a pair of applications to directly communicate with each other across organization
    boundaries. A source application in Partner A can request or consume services
    provided by Partner B, as shown in Figure 3-3. Although shown on this diagram,
    a source application in Partner B can also request or consume services provided
    by Partner A.


    ![](img/334ef4856dbfc14b1f371b2c8b5e06b2_65_0.png)


    | Partner A Secure Zone | Demilitarized Zone | Partner B |

    | :--- | :--- | :--- |

    | Source Application | Connection Rules | Target Application |


    Figure 3-3 Extended Enterprise::Exposed Direct Connection application pattern'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'Extended Enterprise is essentially a manifestation of the Application Integration
    pattern with additional QoS concerns such as security, performance and availability.
    A service-oriented architecture implemented with open standards facilitates this
    extension by simplifying the effort to integrate likely disparate technologies
    and information models.


    # 3.4 Application Integration pattern


    The Application Integration patterns capture commonly observed solution alternatives
    in the domain of Enterprise Application Integration (EAI). They capture best practices
    around back-end integration of applications and data, process automation, and
    workflow implementations involving human interactions. It is important to note
    that front-end integration such as the composition of a portal or single sign-on
    across multiple applications is captured by the Access Integration pattern.


    # 3.4.1 Process Integration concepts


    Process Integration enables companies to connect people, process, and applications
    across and beyond their enterprise. These solutions make it possible to leverage
    existing IT investments while providing the flexibility to adapt quickly to changing
    business conditions and emerging technologies.


    The interactions involved in Process Integration patterns can be classified as
    *parallel or serial*.


    +   - An interaction is denoted as parallel if it includes a set of concurrent
    1-to-1 interactions between a source application and multiple targets.


    +   - An interaction is denoted as serial if it includes a series of 1-to-1 interactions
    between a source application and multiple targets that are subject to time-sequenced
    dependencies.


    Distributing parallel and serial interactions along two dimensions of a matrix
    provides the four combinations shown in Figure 3-4 on page 50.'
  merge: -1
  pgno: 66
