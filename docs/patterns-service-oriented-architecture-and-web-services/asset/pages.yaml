    # # Implementing services on a façade


    The façade pattern was introduced in the book Design Patterns: Elements of Reusable
    Object-Oriented Software, and is in common use in J2EE environments, particularly
    where session beans are used as a façade to hide the implementation of entities.


    A façade hides the underlying implementation of a service, and presents only the
    interface that the service offers.


    If you use a top-down approach with tools such as WebSphere Studio Application
    Developer, a façade may be generated for you. In the case of the sample application,
    a façade is implemented for each service. Public methods are only made available
    for the operations the service publishes. Figure 6-15 on page 182 shows selected
    classes from the Manufacturer service.'
