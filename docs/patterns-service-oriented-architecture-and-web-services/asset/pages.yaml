  md: '# Transformation of XML documents


    With XML''s flexibility in the development of different vocabularies, there is
    a need to be able to transform one XML format to another.


    Two W3C specifications that are part of the Extensible Stylesheet Language (XSL)
    family are used for transforming XML documents into other XML documents:


    +   * Extensible Stylesheet Language Transformations (XSLT) is the language for
    transforming XML. It defines the set of rules used in the transformation from
    a source tree to a target tree. A transformation defined in XSLT is called a stylesheet.

    * XML Path Language (XPath) is an expression used by XSLT to access or refer to
    parts of an XML document.


    An XSL processor is for the actual transformation and typically has a performance
    overhead, so online processing of larger documents can be slow, although the use
    of XSL just-in-time compilers can speed up the transformation time.


    With XSL, XML-based applications can be linked to Web services. It can convert
    an XML document into a different XML format such as WSDL and SOAP. It can also
    transform the logical structure into a presentation format such as HTML pages.


    # Advantages of XML


    There are many advantages of XML in a broad range of areas. Some of the factors
    that influenced the wide acceptance of XML are:


    +   * Acceptability of use for data transfer

    XML is a standard way of putting information in a format that can be processed
    and exchanged across different hardware devices, operating systems, software applications,
    and the Web.

    * Uniformity and conformity

    XML gives you a common format that could be developed upon and is accepted industry-wide.

    * Simplicity and openness

    Information coded in XML is human readable.

    * Flexible and extensible

    The tag-based format of XML makes it flexible and easily extendable. It can be
    customized to support an organization''s needs. When a new piece of information
    is required, a tag is simply added to the structure. There is no dependency on
    the position of the information in the structure, unlike fixed'
