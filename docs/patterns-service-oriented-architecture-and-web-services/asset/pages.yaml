  md: '![](img/334ef4856dbfc14b1f371b2c8b5e06b2_216_0.png)


    The wizard includes facilities for:


    +   - Top-down development, generating either of the following from WSDL service
    implemented as a Java bean

    - The Java bean approach is simpler and faster to implement, but not as easy to
    manage in a runtime environment.

    - A service implemented as an EJB

    - An EJB requires a little more effort to implement, but can be managed by a J2EE
    runtime container such as WebSphere Application Server.

    - Bottom-up development, generating a service from any of the following:

