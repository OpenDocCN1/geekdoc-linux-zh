  md: '# Disadvantages of JMS


    Although JMS is an open standard for Java-based systems, the actual transport
    system must be provided by a software product. Therefore, there are several considerations,
    including:


    +   The communicating Web services must have access to JMS providers that can
    communicate with each other. Generally, this implies the same product must be
    installed. For example, both systems must have IBM WebSphere MQ installed.


    +   JMS is a Java-based standard and is not as readily accessible to systems that
    are not based on Java.


    # 5.2.3 Simple Mail Transfer Protocol


    Simple Mail Transfer Protocol (SMTP) is one of the protocols that has made the
    Internet extremely popular, and is the basis of Internet e-mail. Its objective
    is to transfer email reliably and efficiently between people. It is different
    from other messaging protocols like IBM WebSphere MQ or JMS which have been designed
    to handle information transfer between programs.


    SMTP is independent of the particular transmission subsystem and requires only
    a reliable ordered data stream channel. An important feature of SMTP is its capability
    to relay mail across transport service environments. It has been published originally
    as RFC 821 by the Internet Engineering Task force (IETF) in 1982. Since then new
    RFCs from RFC 2821 have enhanced the original standard to take into account technical
    capabilities.


    As a widely used standard, SMTP is a potential transport for SOAP messages. The
    writers of the W3C SOAP 1.1 Note state that "SOAP can be used in combination with
    a variety of other protocols; however, the only bindings defined in this document
    describe how to use SOAP in combination with HTTP and HTTP Extension Framework..
    The W3C SOAP 1.1 Note is available at:


    > http://www.w3.org/TR/soap/


    Most implementations currently use HTTP to transport SOAP messages, but there
    is no reason why you cannot use other layers, such as SMTP.


    # Apache SOAP SMTP transport


    Apache SOAP has been included as a WebSphere SOAP engine since WebSphere V4.0.
    It has now been superseded by Apache Axis and by Web Services for J2EE.'
