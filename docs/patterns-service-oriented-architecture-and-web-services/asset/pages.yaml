    subsystem. The subsystem leverages the business and technical components to realize
    the use case and support the exposed business service such as Submit Order.


    The model shown in Figure 4-10 is only meant to provide a simple example of how
    subsystem analysis is performed. In practice, standard UML modeling techniques
    are used, with business use cases realized by subsystems, and system use cases
    realized by business and technical objects.'
