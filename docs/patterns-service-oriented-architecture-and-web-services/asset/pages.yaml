- img_proc: true
  md: 'By interviewing business owners, querying them on the goals within the scope
    of work, we can create a tree of related sub-goals that are prerequisites to achieving
    the initial high-level, often intangible, and lofty goal. Each level of sub-goal
    is broken down to a set of further sub-goals until the services required to fulfill
    them are clear. This is called a goal-service model.


    To create a goal-service model, identify the goals and goals that must be realized
    in order support high goals. Then associate the sub-goals with the services required
    to realize the sub-goals. This will make services traceable back to the goals
    that the business indicates it needs to achieve. This traceability of services
    to business goals is essential to ensure that the complete set of business services
    is anticipated as early as possible.


    Various notations are possible for a goal-service model. We provide a simple example
    using a nested list of goals, sub-goals, and services in Figure 4-9. This covers
    the retailer functional area.


    Goal-service model for retailer business function:

    1. Increase revenue

    2. Increase sales

    3. Provide self-service shopping capability

    3.1. Purchase Goods

    3.2. Source Goods

    3.3. Provide user-friendly interaction experience

    3.3.1. Get Catalog

    3.3.2. Manage Shopping Cart

    4. Maintain accounting records

    4.1. Log Events

    4.2. View Events


    +   Key:

    ▷ Goals are shown in regular text.

    ▷ Services are shown in *italic*.

    ▷ Value-adds (additional services needed that were not discovered during Domain
    Decomposition) are shown in **bold**.


    Figure 4-9 Goal-service model example'
  merge: -1
