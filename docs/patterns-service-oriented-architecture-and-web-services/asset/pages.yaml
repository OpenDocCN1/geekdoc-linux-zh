- img_proc: true
  md: '![](img/334ef4856dbfc14b1f371b2c8b5e06b2_225_0.png)


    # Design alternative: Container managed


    Container-managed lookup uses a JNDI lookup to find the service information.

    We used this mechanism to look up the Manufacturer service location, in the following
    code snippets:


    ```

    ```

    Context ctx = new InitialContext();

    ManufacturerService service = (ManufacturerService)

    ctx.lookup("java:comp/env/service/ManufacturerService");

    ```

    ```


    Having found the service, the port type object can be created and the service
    invoked.


    This approach is recommended as it avoids having the physical location of the
    service coded in client source code. The service location is contained in generated
    classes, which are regenerated by WebSphere Application Server'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'when the client code is deployed and the Deploy Web Services option is selected
    during the deployment.


    # Design alternative: Client managed


    It is also possible to set an alternative endpoint URL (to the one specified in
    the WSDL file) at runtime using the service locator class generated by the Web
    service client wizard. When creating the port for the service, you simply pass
    the required endpoint URL to the get-PortType method of the service locator as
    follows:


    ```

    WarehouseCallBackPortType port =

    service.getWarehouseCallback(new java.net.URL(cbd.callbackLoc));

    ```


    We use this method to invoke the WarehouseCallBack service in the sample application.
    This approach allows the Manufacturer to call the required Warehouse back using
    the endpoint URL passed in the original request (cbd.callbackLoc).


    Generally speaking, we recommend using the managing of container-managed approach,
    since it provides more flexibility for changing service locations without changing
    and recompiling client code. However, the client-managed approach can be useful
    in development environments when changing endpoints frequently, or when the endpoint
    is not know at build time, as for our WarehouseCallBack sample.


    # Invoking the service


    If you are using JAX-RPC, there are three main design alternatives for invoking
    a service. They are stub based, dynamic invocation interface, and dynamic proxy.


    # Design alternative: Stub based


    This is the approach used by the Warehouse to invoke the Manufacturer service
    in the sample application. A stub for the service endpoint is created in the client
    project by the Web services wizard.


    This approach is the simplest alternative and has the advantage of being generated
    by the Web services wizard. Provided you have access to the implementation WSDL
    for the target service, or at least have the service description, you can use
    this approach. In most Web services projects at this stage, the service definitions
    are available for use by client programmers.


    # Design alternative: Dynamic invocation interface


    This approach requires you to create the client calling code using the javax.xml.rpc.Call
    class. Since all the parameters of the call need to be set in your client code,
    you could use this mechanism to create a truly dynamic call, by'
  merge: -1
  pgno: 226
- img_proc: true
  md: 'retrieving the WSDL for the target service dynamically and then creating a
    request to the service.


    The dynamic invocation interface is therefore more complex and requires more client
    side coding. It may be useful in environments where there are different versions
    of services or schemas available, and you wish to bind dynamically to one at run
    time.


    # Design alternative: Dynamic proxy


    This approach is a relatively new facility which allows you to have a dynamic
    proxy built to the service at run time. As yet, few detailed examples exist, so
    you may wish to keep a watching brief on this technique as detailed explanations
    and code patterns appear.


    # 6.3.5 Testing considerations


