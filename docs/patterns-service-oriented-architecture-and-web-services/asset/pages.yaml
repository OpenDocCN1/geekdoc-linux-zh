  md: '# 6.1 Business scenario


    The sample application used in this chapter is a simplified supply chain for a
    consumer electronics retailer. Consumers may access the retailer''s Web site,
    review the catalog, and place orders for products (Self-Service business pattern).
    The retailer system requests fulfillment of a consumer''s order from company warehouses
    (Application Integration pattern), which respond to whether items from the order
    can be filled. If stock for any line item falls below a minimum threshold in any
    warehouse, a replenishment order is sent to the manufacturer (Extended Enterprise
    business pattern). The manufacturer will fulfil the replenishment order at some
    time; this process is asynchronous to the re-supply order.


    As we saw in Chapter 4, “Service-oriented architecture approach” on page 79, our
    business scenario consists of a retailer, warehouse, logging facility, and three
    external manufactures, as shown in Figure 6-1.


    The cases defined for our business scenario are described in “Use case model”
    on page 86.


    # 6.2 Design guidelines


    This section provides design guidelines for the sample application implemented
    on an HTTP service bus. In “Layered application architectures” on page 23 we'
  merge: -1
