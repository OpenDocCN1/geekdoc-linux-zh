    +   - IBM Availability Management Offering: Enables management of IT resources
    within the context of business priorities, managing the availability and performance
    of critical business systems and web environment. Monitoring your infrastructure
    and pro actively avoiding system failures and taking automated actions to resolve
    potential problems.


    +   - IBM Security Event Management Offering: Extends the value of traditional
    systems event management with the inclusion of security events, providing a holistic
    view of the health of the IT infrastructure and helping you actively monitor,
    correlate and quickly respond to IT security threats across your


    +   - IBM Tivoli Autonomic Monitoring Engine: Delivers self-healing capabilities
    by delivering a set of IT resource monitors that incorporate automated best practices
    to detect errors and an underlying engine that analyzes errors, correlates to
    root cause and initiates corrective action.


    # 10.2.3 Virtualization


    Visualization is the process of presenting computing resources in ways that users
    and applications can easily get value out of them, rather than presenting them
    in way dictated by their implementation, geographic location, or physical packaging.


    By an on demand operating environment where resources can be used efficiently
    based on business requirements, virtualization can improve working capital and
    asset utilization.


    From the service-oriented architecture perspective, virtualization is provided
    in the location transparent and loosely coupled interface specifications. The
    overall business system is no longer dependant on the implementation, location
    or packaging of a service, but rather the interface contract to which the application
    can be invoked.


    Let us look at how virtualization enables the sharing of resources.'
  merge: -1
  pgno: 335
- img_proc: true
  md: '# Servers


    By building an environment where the hardware and systems software are hidden
    from the users and applications, servers can be shared across business units,
    processes, and applications, allowing for consolidation.


    # Storage


    Providing access to data, regardless of its physical location or file structure,
    provides economies through cost-effective storage media and more efficient data
    sharing.


    # Distributed systems


    Taking advantage of advances in distributed systems such as grid computing allows
    resources across the enterprise (individual systems, servers, clusters, and storage
    devices) to be shared and dynamically allocation to meet business needs. This
    dynamic allocation allows for higher utilization of resources, resulting in costs
    savings, well as increased capability to meet unforeseen requirements by allocating
    available resources.


    # Networking


    As the world has become networked together through the Internet, it is critical
    to be able to manage and control portions of the network, which might even be
    shared between different enterprises, as individual or virtual networks. This
    includes technologies such as VPNs, VLANs, IP virtualization, Web services gateway
    and more.


    In an demand operating environment, virtualization of resources within the IT
    infrastructure provides many benefits. Where the underlying hardware and system
    software is hidden from the users and applications, an open standards-based infrastructure
    can be deployed to simplify:


    +   * Systems administration: Rather than having individual servers dedicated
    to specific applications, and therefore specialized support staffs, virtualization
    allows for a common environment that can simplify the overall administration requirements,
    while allowing resources to be allocated as needed by the business.


    +   * Asset portfolio: On an demand operating environment provides a common environment
    for running applications, while maintaining independence from underlying hardware
    and systems software. In this environment, assets can be easily managed, changed,
    and reallocated without requiring changes to the applications. Likewise, applications
    can be modified and enhanced to meet business needs without necessarily requiring
    changes to the underlying systems. If additional computing power or storage is
    required, it can often be provided through available resources.'
  merge: -1
  pgno: 336
- img_proc: true
  md: '+   Cost structure: By utilizing virtualization to dynamically allocate system
    and storage resources, the overall cost of hardware and software can be controlled.


    Overall, a virtualized environment provides simplified access to data and IT resources
    on demand. Idle capacity can be used to meet unforeseen demand and reduce the
    need to purchase additional hardware and software. The savings realized from reduced
    capital expenditures can be reinvested in other areas to help the growth.


    Virtualization in different forms has been around for at least 40 years, dating
    back to the days of S/360™. However, with the maturing of grid technologies and
    SANs, we are now moving from the days of virtual storage or even virtual machines
    to virtual computing environments, allowing businesses to gain larger financial
    and business advantages.


    # IBM virtualization offerings


    IBM offerings in the area of virtualization include:


    +   IBM TotalStorage® Virtualization Family: Helps customers with complex storage
    environments, who are looking to mask complexity and share capacity across heterogeneous
    systems, reduce their management and operational costs.


    +   IBM Entry Virtualization Server Offering: Designed to target customers who
    need to simplify their IT infrastructure as a first start toward the virtualization
    of their IT resources.


    +   IBM Server Allocation for WebSphere Application Service: Maximizes utilization
    of existing computing resources. This offering provides the capability to dynamically
    provide workload management of multiple applications across multiple server clusters,
    first for any application server product.


    +   IBM Grid Offering for Analytic Acceleration - Financial Markets: Helps enhance
    competitiveness and agility in the financial trading market. IBM uses a comprehensive
    approach to help determine the most appropriate combination of technologies for
    analytic acceleration in financial services.


    # 10.3 Service-oriented architecture for demand


    So we have taken a high level view of IBM''s e-business on demand vision and strategy
    "The new agenda", followed by a closer look at the demand operating environment,
    and the associated offerings provided by IBM. Next, we will investigate how we
    can implement on a demand operating environment using a service-oriented architecture,
    and the appropriate IBM on demand technologies.'
  merge: -1
  pgno: 337
- img_proc: true
  md: 'Figure 10-5 shows how the characteristics of a service-oriented architecture
    support the on demand operating environment by supplying a flexible underlying
    architecture and infrastructure.


    ![](img/334ef4856dbfc14b1f371b2c8b5e06b2_338_0.png)


    Figure 10-5 Supporting the on demand operating environment with SOA


    The service-oriented architecture supports the three categories of the IBM on
    demand operating environment (integration, virtualization and automation) as an
    integrated unit spanning the complete enterprise system. By implementing a service-oriented
    architecture that is flexible, self-managing, scalable, economical, resilient
    and based on open standards, we can assist the enterprise in becoming:


    +   * Responsive

    * Variable

    * Focused


    Let us start by taking a look at the landscape of today’s business environment.


    # 10.3.1 The starting point


    In many enterprises of today, applications are tightly coupled, component oriented,
    with a high dependency on each others deployment characteristics and have a strong
    requirement to be aware of the location and platform of all other integrated information
    providers. Often implemented as vertical silos to'
  merge: -1
  pgno: 338
- img_proc: true
  md: 'facilitate the business functions of individual departments, and if required,
    replicated across departmental and organizational boundaries. These applications
    frequently drive the business and a number of management capabilities such as
    customer relationship management, value chain management and enterprise resource
    management, among others.


    As said, for the enterprise to survive, there is a necessity to not only integrate
    these business systems end-to-end across the company, but also with suppliers,
    distributors and customers. In a rapidly changing market, the integration of all
    enterprise systems both vertically and horizontally is no longer sufficient, and
    the business will have to be able to adapt to meet demands from both clients and
    competitors without having to be concerned about affect this change will have
    on the health of the supporting IT systems. In a heterogeneous environment of
    partner systems, legacy systems, packaged applications and in-house developments,
    the ability to maintain the health of your supporting IT infrastructure and business
    systems requires a robust architecture. It must supply a stable and structured
    framework to support the new on demand business, and its operating environment.


    So the business has been streamlined by defining the business rules and mapping
    them to processes that can respond dynamically to changes in your market. The
    business has defined the new processes that will allow it to control cost across
    the entire value chain, and stay focused on its core business.


    The next step is to define the new environment that is required to support the
    needs of the transformed business - the on demand operating environment. But just
    as with the business in general, building the on demand operating environment
    requires changes in all aspects of IT, architecture, deployment to the ongoing
    maintenance. The key to starting the transformation to the new operating environment
    is to first evaluate how your applications and infrastructure are working across
    the enterprise today, and determine if there are better ways of doing things:


    +   * Are your key business processes duplicated vertically across the enterprise?

    * Are applications tightly coupled with heavy dependencies with each other, leading
    to large, costly and risky development should you want to replace one of the applications
    or change your business processes?

    * Will acquisitions or mergers with new partners create complex integration issues,
    that could have a detrimental impact on your market position giving advantage
    to your competition?

    * Can your operating environment and IT infrastructure respond dynamically with
    your business to changes in market forces—whether that is customer'
  merge: -1
  pgno: 339
- img_proc: true
  md: 'needs, supply issues, competitive pressure or something completely unexpected?


    But how do you evolve from an IT infrastructure optimized for departmental processes
    to one that is optimized to support the organizational processes? This is especially
    difficult when you are dealing with different departmental applications, infrastructure
    components, application languages, operating systems, servers platforms and storage
    devices.


    In the end you are faced with two options. Rip everything out and replace it all
    with a new single environment and infrastructure, and then insist that every department
    within the organization, and every integrated supplier, business partner and potential
    new acquisitions commit to doing the same.


    Alternatively, you can commit to using open industry standards as Web services
    and service-oriented architecture, starting out with an appropriate subset of
    your infrastructure. By implementing it on demand operating environment using
    a service-oriented architecture, the business can create a level of abstraction
    between the business process and the technology implemented to support it. Additional
    by deploying the business functions already supported by existing applications
    as services with a well defined interface contract, it is possible to separate
    the physical implementation and location of that service from its published interface


    From the perspective of building the demand operating environment, it is beneficial
    to separate it out into the following parts:


    +   The systems environment: The environment that allows true virtualization and
    automation of the infrastructure and enables delivery of IT capability on demand.
    In other words, the infrastructure and hardware.


    +   The application environment: The integrated platform based on open standards,
    to enable rapid deployment and integration of business applications and processes.
    In other words, the software.


    +   Utility services: Outsourcing infrastructure, business processes and non-core
    business functions. In other words, stay focused on what the business does best.


    # The systems environment


    The basic fact is that delivering demand flexibility requires the infrastructure
    of today to undertake the next step in the demand evolution. The systems environment
    of the client/server era where standalone units with utilized processing power,
    over-sized storage capabilities and complex system administration is gone. The
    new on demand environment relies on in time provisioning of storage capacity and
    processor power, by using virtualized storage to manage application and storage
    growth.


    Chapter 10. e-business on demand and Service-oriented architecture 323'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# The application environment


    This is where the key benefits of a service-oriented architecture can be realized.
    As any organization that is attempting to integrate its existing applications,
    information systems, processes and partners will know, this is a challenging,
    costly and often risky. Using a service-oriented architecture can greatly simplify
    the integration of these applications, information and components. The Enterprise
    Service Bus, discussed in "Enterprise Service Bus" on page 38, is a key service-oriented
    architecture best practice for enabling the demand operating environment.


    # Utility services


    The third part of the IBM e-business on demand operating environment is the ability
    to deliver the infrastructure and business processes as a service. By outsourcing
    the non-critical systems and business processes, the enterprise is left with a
    smaller and more streamlined IT infrastructure. Using the open standards of a
    service-oriented architecture, the enterprise is capable of integrating services
    to support their business functions, such as human resources and customer relationship
    management, from external suppliers rapidly with limited impact to existing business
    systems.


    For further information on the service-oriented architecture approach, please
    please Chapter 4, "Service-oriented architecture approach" on page 79.


    # 10.3.3 On demand technologies


    There are many technologies, both new and still evolving, that can make the on
    demand operating environment a reality. It needs to be understood that the on
    demand operating environment is about a broad set of standards working together
    provide a consistent and comprehensive set of facilities.


    IBM''s product portfolio now spans five brands which can supply the support required
    to deliver an demand service-oriented architecture. Rational provides a powerful
    set of modeling and development tools; Tivoli includes systems and application
    management; Lotus brings collaborative services; DB2 adds information integration
    and data management; while WebSphere provides the foundation for managing transactions
    and messages, reliably and securely.


    In the following sections, we describe some of these technologies and how they
    apply to demand computing.'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# Web services


    Web services are becoming the standard way to implement a service-oriented architecture.
    They provide the facilities needed to access corporate data, legacy transaction
    systems, and new business applications based on standards, such as J2EE, XML,
    and SOAP. Because of the strict use of standards interfaces, various Web services
    can be combined to generate new, integrated applications quickly from existing
    components.


    # Grid computing


    Grid enables the virtualization of widely distributed computing resources, such
    as processing, storage capacity, data, and network bandwidth, to create a single
    virtual system, granting users and applications seamless access to vast IT capabilities.
    Put simply, grid enables customers to get more business value out of what they
    own.


    Through open technologies such as the Glob Toolkit for grid computing and emerging
    standards such as OSA and OGSI, grid computing is no longer applicable to scientific
    and research projects. Businesses can now look at grid computing as a way to get
    higher utilization of their computing and storage resources efficiently and cost
    effectively. Grid computing enables the dynamic reallocation of resources to meet
    spikes in demand or changing business requirements.


    # Autonomic capabilities


    Autonomic capabilities are being developed and integrated with hardware and software
    products across IBM product lines. Autonomic capabilities are considered an elemental
    capability that can be used to automate activities for desired business outcomes.


    Autonomic capabilities can generally be categorized in the following areas.


    # Self-configuring


    The ability to dynamically configure components "on the fly" and initialize them
    in the context of the overall system; this includes the ability to influence relevant
    changes in other products in the environment.


    # Self-healing


    The ability to recover from a failing component by first detecting improper operations
    (either proactively through predictions or otherwise) and then initiating corrective
    action without disrupting applications.


    # Self-optimizing


    The ability of systems or components to efficiently maximize resource allocation
    and utilization to meet end-user needs without human intervention.'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# Self-protecting


    The ability of a component to detect hostile or intrusive behavior as it occurs
    and take autonomous actions to make itself less vulnerable.


    # Information integration


    Information integration can take on many forms, from federated databases to content
    management systems.


    Federated databases allow data stored in various database and file systems to
    be accessed through a common interface such as SQL, hiding the complexity of the
    environment and the actual location of the data. Using such technologies aids
    the integration of applications and provides location transparency.


    Content management systems enable users and applications to easily find and manage
    the data they need to perform their jobs.


    # Blade computers


    Blade computers allow large numbers of server class computing resources to be
    tightly packed into small places. This provides more efficient and cost effective
    use of space, as well as making it easier to physically manage a large number
    of servers. Using blade computers is one form of consolidation. By utilizing various
    virtualization and autonomic technologies, these computers can be efficiently
    reconfigured and reallocated to meet changing demands.


    # Pervasive device support


    Products such as IBM WebSphere Everyday Access simplifies wireless for the enterprise.
    In one package, it delivers the technology needed to give mobile users access
    to productivity and enterprise applications from virtually anywhere, at any time.
    It supports multiple devices such as PDAs and smartphones from a single platform,
    based on open standards.


    # IBM products and software for on demand


    IBM has broad product support for the on demand operating environment. The core
    of IBM''s middleware platform for the support of integration and the Enterprise
    Service Bus is the WebSphere Application Server and WebSphere MQ, there are many
    more.


    # IBM WebSphere


    Together with WebSphere Studio Application Developer, WebSphere Application delivers
    an application server and development environment designed to help the enterprise
    to deliver e-business applications to run in an on demand operating environment.
    The WebSphere product family is built on an open standards platform that supports
    the J2EE standards, XML, SOAP, UDDI, WS-I profiles and the construction of a service-oriented
    architecture.'
  merge: -1
  pgno: 343
- img_proc: true
  md: 'IBM WebSphere MQ connects the enterprise both internally and with external
    partners to exchange and distribute information securely reliably. It provides
    an important alternative messaging transport when basic HTTP is insufficient.


    To support the demand operating environment, WebSphere offers comprehensive solutions
    to address the following business issues:


    +   - A strong foundation and tools to help reduce business risk

    - Business portal software to strengthen business relationships

    - Business integration software to optimize operations


    For further information on IBM WebSphere software please visit the WebSphere home
    page at:


