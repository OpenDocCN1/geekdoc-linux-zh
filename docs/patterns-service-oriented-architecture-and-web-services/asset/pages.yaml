  md: 'We start the process when the business problem suggests the use of a service-oriented
    approach. Business problems involving exposure of back-end business services at
    the edge of the enterprise are typical candidates.


    The top-down aspect of the SOA approach comes from taking business perspectives
    and models into consideration: Business functions, processes, sub-processes, and
    use cases are elaborated to form the outlines of component boundaries.


    Components provide boundaries and containers for services (often discovered through
    use case analysis and goal-service model creation). Services are the units of
    functionality that are exposed for business process orchestration and choreography
    and the creation of composite applications. Components provide these services
    on their interfaces and will often contain finer grained hierarchies and/or legacy
    systems that implement them.


    In the following sections, we outline the seven key steps necessary to support
    component-services architectures. We apply each of the steps to the WS-I supply
    chain management sample scenario. The supply chain scenario is reasonably simple,
    so our application of the SOA approach will be at a comparable level of detail.


    As already stated, the SOA approach does support legacy integration (starting
    at Step 1b Existing Assets Analysis in Figure 4-4 on page 84), but we do not cover
    this aspect in this publication.


    # 4.3.1 Domain decomposition


    In this step we decompose the domain into its constituent business architecture
    consisting of value-chain, business processes, sub-processes, and use cases.


    From a business perspective, the domain domain consists of a set of functional
    areas. We decompose the domain into functional areas across the value-net; these
    are often good candidates for implementation as technology subsystems. Figure
    4-5 on page 86 shows our domain decomposition for the supply chain management
    scenario.'
