  md: '# Patterns for e-business


    This redbook is part of the Patterns for e-business series. In this introductory
    chapter we provide an overview of how IT architects can work effectively with
    the Patterns for e-business.


    The role of the IT architect is to evaluate business problems and build solutions
    to solve them. To do this, the architect begins by gathering input on the problem,
    an outline of the desired solution, and any special considerations or requirements
    that need to be factored into that solution. The architect then takes this input
    and designs the solution. This solution can include one or more computer applications
    that address the business problems by supplying the necessary business functions.


    To improve the process over time, we need to capture and reuse the experience
    of the IT architects in such a way that future engagements can be made simpler
    and faster. We do this by capturing the knowledge gained from each engagement
    and using it to build a repository of assets. IT architects can then build future
    solutions based on these proven assets. This reuse saves time, money, and effort;
    and in the process, it helps ensure delivery of a solid, properly architected
    solution.


    The IBM Patterns for ... help facilitate this reuse of assets. Their purpose is
    to capture and publish e-business artifacts that have been used, tested, and proven
    to be successful. The information captured by them is assumed to fit the majority,
    or 80/20, situation.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'The IBM Patterns for e-business are further augmented with guidelines and related
    links for their better use.


    The layers of patterns, along with their associated links and guidelines, allow
    the architect to start with a problem and a vision for the solution, and then
    find a pattern that fits that vision. Then, by drilling down using the patterns
    process, the architect can further define the additional functional pieces that
    the application will need to succeed. Finally, he can build the application using
    coding techniques outlined in the associated guidelines.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# 1.1 The Patterns for e-business layered asset model


    The Patterns for e-business approach enables architects to implement e-business
    solutions through the re-use of components and solution elements from proven successful
    experiences. The Patterns approach is based on a set of layered assets that can
    be exploited by any existing development methodology. These layered assets are
    structured in a way that each level of detail builds on the last. These assets
    include:


    +   - Business patterns that identify the interaction between users, businesses,
    and data.


    +   - Integration patterns that tie multiple Business patterns together when a
    solution cannot be provided based on a single Business pattern.


    +   - Composite patterns that represent commonly occurring combinations of Business
    patterns and Integration patterns.


    +   - Application patterns that provide a conceptual layout describing how the
    application components and data within a Business pattern or Integration pattern.


    +   - Runtime patterns that define the logical middleware structure supporting
    an Application pattern. Runtime patterns depict the major middleware nodes, their
    roles, and the interfaces between these nodes.


    +   - Product mappings that identify proven and tested software implementations
    for each Runtime pattern.


    +   - Best-practice guidelines for design, development, deployment, and management
