  md: 'document style, which may have to cater for more data and more combinations
    of document structure.


    +   RPC is a natural style for interfacing to existing applications that already
    exist and use a synchronous call style (remote procedure call).


    +   Provides an XML interface to applications that do not have an XML interface
    today.


    +   Supported in older versions of application servers. For example, WebSphere
    Application Server V4 provides RPC style, but not document style.


    # Advantages of document style


    +   Document style is more naturally suited to asynchronous processing and one-way
    scenarios.


    +   Changes to the message schema are less likely to break service consumers.
    Adding elements to messages, and reordering sequences in message definitions,
    are less likely to impact both consumers and providers.


    +   It is possible to add information to the XML document that is being exchanged
    between the consumer and provider for purposes other than the invocation of the
    service. In the RPC style, the message must be validated in order to invoke the
    target procedure. With document style, validation of additional elements can be
    deferred to a component of the implemented service.


    +   Microsoft tools for the creation of Web services to use the document style,
    so interoperability with service providers or consumers built on Microsoft platforms
    is more likely.


    +   Document style services tend to perform better than RPC style services. This
    is because the SOAP server has to perform validation with RPC style, whereas for
    document style the XML request is sent straight to the processing application.


    A detailed discussion of the merits of document style is available from:


    ```

    http://www.ibm.com/developerworks/webservices/library/ws-docstyle.html

    ```


    # Design alternative: Selecting the encoding style


    Two mechanisms for describing the body of a SOAP message are available, literal
    and encoded. The sample application services use only literal encoding, since
    the WS-Basic Profile does not the use of encoded. For interoperable Web services,
    you should use literal. You need to ensure that your development tools and runtime
    platform support literal encoding. The latest releases of WebSphere Application
    Server Developer and WebSphere Application Server support this encoding style.'
