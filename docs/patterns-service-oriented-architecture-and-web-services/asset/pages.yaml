    # IBM Lotus


    IBM Lotus is one of the leading industry products for messaging and collaborative
    support, as well as delivering document management, knowledge discovery, workflow,
    e-learning and presence awareness.


    By componentizing the core parts of the Lotus products and unifying access to
    each of the components via a common service-oriented interface, the software supplies
    a template base structure allowing the enterprise to rapidly define on demands
    that fit a specific market segment or business need. These enterprise workplaces
    can be rapidly deployed and integrated with limited impact to the existing infrastructure,
    which allows the enterprise to react to market needs and respond rapidly.


    By using standard IBM development tools such as WebSphere Studio Application Developer,
    the enterprise can build applications based services such as workflow and instant
    messaging directly in the enterprise system, via a single collaborative API.


    For further information on IBM Lotus software please visit the Lotus home page
    at:


    ```

    http://www.ibm.com/lotus

    ```


    # IBM DB2 Information Management


    The IBM DB2 relational database and associated tools such as the DB2 Information
    Integrator, can support the enterprises requirements for data management and manipulation
    in a service-oriented architectural on demand operating environment. With extended
    support for Web Services, DB2 and the data stored within it can be accessed and
    invoked as a service based on a well defined interface contract such as a WSDL.'
  merge: -1
