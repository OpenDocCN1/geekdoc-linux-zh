    your service code. These options are shown in Figure 6-27 on page 204.


    # Locating the service


    Approaches for finding services are discussed in Chapter 8, "Service directory"
    on page 251. However, when the service information is available at development
    time to the client developer (as is the case in this scenario), there is still
    a requirement to select a technique for locating the service within the client
    prior to invoking the service.


    We look at two alternatives when using JAX-RPC: Container-managed or client managed
    service lookup. The container-managed approach uses the location, or endpoint
    URL, specified in the WSDL file when the client was generated. The client-managed
    approach allows the application to set the endpoint dynamically, at runtime.


    Note that when the client is deployed to an IBM WebSphere Application Server V5.1
    environment, the client classes can be regenerated to point to the service location
    currently specified in the WSDL file. The Deploy Web Services option on the WebWebSphere
    Administrative Console is shown in Figure 6-29 on page 208.'
