    # Design alternative: Top down or bottom up


    In the case of the sample application, the service interfaces were designed by
    WS-I first, and the implementations were provided by various vendors, including
    IBM. This is an example of top-down design. Top-down design was considered in
    this case:


    +   - There were no existing systems or implementations when the decision was
    made to create the services. Therefore, restrictions imposed by existing system
    implementations did not have to be considered in the logical design of each service.


    +   - The intent was to build interoperable services, with the facility to deploy
    any service on any system type. Therefore, WSDL could be developed to meet the
    interoperability gap, avoiding extensions or complex headers.


    When using a top-down approach, you need to avoid:


    +   - Making the service design too complex


    +   - Being tempted to use all available features of WSDL or imported schemas


    If you are in the situation where you have existing systems from which you wish
    to expose some Web services, you may need to consider a bottom-up approach. This
    means that the WSDL is generated from existing code, using facilities such as
    the WebSphere Studio Application Developer Web WSDL service. If you decide to
    use a bottom-up approach, the main issue which might arise is problems of interoperability.
    This means that the service may not be usable by intended consumers of the service,
    if you do not control those consumers. This is'
  merge: -1
