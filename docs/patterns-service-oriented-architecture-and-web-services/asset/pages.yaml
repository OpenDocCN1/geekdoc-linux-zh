    # 4.3.7 Technology realization mapping


    Once the functionality of the services and components have been specified in detail,
    their implementation mechanism must be resolved. The choice of how to realize
    the implementation of the service is a key architectural step.


    You can build everything from scratch. Or can you source it completely as a turn-key
    solution. Between these two extremes lies the most common needs of IT organizations:
    To decide what to build, what to buy. However, it is important to realize that
    these are not the only alternatives. As shown in Figure 4-15 on'
