  md: '![](img/334ef4856dbfc14b1f371b2c8b5e06b2_146_0.png)


    Figure 5-9 The service layer


    In this section we examine two different programming models for accessing Web
    services:



    +   - Web Services for J2EE

    - Web Services Invocation Framework (WSIF)


    # 5.5.1 Web services and J2EE


    Web services are intended to provide interoperability standards between systems,
    regardless of the architecture or implementation approach of end-point systems.


    The Java 2 Platform, Enterprise Edition (J2EE) is an important programming model
    and architecture, IBM supports with WebSphere Application Server and WebSphere
    Studio. Since many of the Product mappings described in this book are based on
    WebSphere Application Server, It is instructive to review the state of J2EE and
    Java standards for *implementation* of Web services on J2EE platforms.


    # A new set of Java Specification Requests


    The technologies used by the J2EE application servers to provide Web services
    facilities are evolving very quickly. The Java community has recently adopted
    a'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'set of standards to define the different aspects of how Web Services can be
    supported in a J2EE-compliant application server.


    These standards are described as Java Specification Requests (JSRs). JSRs are
    used as the tracking mechanism for all Java specifications, from proposal through
    acceptance or rejection. Information about the Java Community Process, which manages
    the development of specifications, and the JSRs themselves, can be found at:


    http://jcp.org


    The main JSR concerning this domain is JSR 109, Implementing Enterprise Web Services
    (also known as Web Services for J2EE). It reached the final release status in
    November 2002.


    The aim of JSR 109 is to define the programming model and runtime architecture
    for implementing Web services in Java. It federates the work done on several other
    JSRs. This JSR was led by IBM.


    In the same way that servlets tied together a set of concepts like cookies and
    HttpSession, and EJBs tied together techniques such as RMI, JTA/JTS, JDBC, and
    so on with a programming model and runtime model; the promoters of this JSR view
    it as doing the same for implementing and using Web services.


    The Web Services for J2EE 1.0 specification is an addition to J2EE 1.3. J2EE 1.4
    requires support for Web Services for J2EE 1.1. There are minor differences between
    the J2EE 1.3 version (JSR-109 1.0) and the J2EE 1.4 version (JSR-109-1).


    Specifications have also been opened for defining APIs to specific parts of the
    Web services stack:


    +   * JSR 67: Java APIs for XML Messaging

    JAXM provides an API for paging and transporting business transactions using on-the-wire
    protocols defined by ebXML.org, OASIS, W3C, and IETF.


    +   * JSR 93: Java APIs for XML Registry

    AXR provides an API for a set of distributed registry services that enable business-to-business
    integration between business enterprises, using the protocols defined by ebXML.org,
    OASIS, and ISO 11179.


    +   * JSR 101: Java APIs for XML-Based RPC

    JAX-RPC defines APIs to support emerging industry XML-based RPC standards.'
  merge: -1
  pgno: 147
- img_proc: true
  md: '+   JSR 110: Java APIs for WSDL


    JSR provides a standard set of APIs for representing and manipulating services
    described by WSDL documents. These APIs define a way to construct and manipulate
    models of service descriptions.


    # Introduction in WebSphere Application Server


    Support for JSR 109 and other related JSRs first appeared in WebSphere Application
    Server V5.0 as technology previews. IBM WebSphere Application Server V5.1 provides
    a more complete implementation, in addition to the Web services components that
    were available previously.


    # Supported standards


    The following standards are supported by the Web Services for J2EE of IBM WebSphere
    Application Server V5.1:


    +   - SOAP 1.1

    - WSDL 1.1

    - Web Services for J2EE (JSR-109) 1.0

    - Java API for XML-Based RPC (JAX-RPC) 1.0

    - SOAP with Attachments API for Java (SAAJ) 1.1


    # SOAP considerations


    Apache SOAP 2.3 shipp with WebSphere Application Server V4.0 and V5.0. It continues
    to co-exist with Web Services for J2EE. Apache SOAP is a proprietary API, and
    applications written for it are not portable to other SOAP implementations. Applications
    written for Web Services for J2EE should be portable to any vendor''s implementation
    that supports Web Services for J2EE.


    The Web services technology preview in WebSphere V5.0 leveraged the work that
    IBM contributed to the Apache Axis code base. The Web Services for J2EE included
    with WebSphere V5.0.2 is derived from Apache Axis, which has diverged and contains
    many IBM-specific features to enhance performance, scalability, reliability, interoperability,
    and integration with the WebSphere Application Server.


    The Apache SOAP channel and the SOAP/HTTP channel both support SOAP applications
    that are SOAP 1.1 compatible (for example, Apache SOAP 2.3 and Axis SOAP 1.0).
    So if you have an application that uses a production-supported Axis 1.0 stack,
    generating SOAP 1.1, then this application can use channel.


    If you are using the Apache SOAP channel, then the SOAP message format must be
    RPC style. To handle document style SOAP messages, you must use'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'the SOAP/HTTP channel (which supports both RPC style and document style SOAP
    messages).


    If you develop Web services that pass attachments in a MIME message, then these
    Web services can only be accessed using the SOAP/HTTP channel.


    There is currently no specification for SOAP JMS; each vendor chooses its own
    implementation technique. Therefore, interoperability is not possible using this
    at this stage.


    # Interoperability


    Web Services for J2EE intends to conform to the WS-I Basic Profile 1.0, and should
    interoperate with any other vendor conforming to this specification. At the time
    of the writing, the Basic Profile 1.0 had not been completed, so it is possible
    that incompatibilities exist.


    # Development tools


    WebSphere Studio Developer V5.1 provides IDE support for the development of Web
    Services for J2EE. IBM WebSphere Application Server V5.1 provides command line
    tools for Web services enabling WebSphere applications.


    # 5.5.2 Web Services Invocation Framework


    The Apache Web Services Invocation Framework (WSIF) provides a standard Java API
    to invoke services, no matter how or where the service is provided, as it is described
    in WSDL.


    WSIF enables the developer to move away from the native APIs of the underlying
    service, and interact with representations of the services instead. This allows
    the developer to work with the same programming model regardless of how the service
    is implemented and accessed.


    WSDL is WSDL-driven and it provides a uniform interface to invoke services using
    WSDL documents. So if a SOAP service you are using becomes an EJB, for example,
    you can change to RMI/IIOP by just modifying the WSDL service description, without
    needing to modify your applications that use the service.


    This API is used by tools as WebSphere Studio Integration Edition and runtimes
    as WebSphere Application Server Enterprise to construct and manipulate services
    defined in WSDL documents. The architecture allows new bindings to be added at
    runtime.'
  merge: -1
  pgno: 149
- img_proc: true
  md: 'For more details on the Web Services Invocation Framework see:

    http://ws.apache.org/wsif/


    # Advantages of WSIF


    WSIF has the following advantages:


    +   - Multiple bindings can be offered for services, and bindings can be decided
    at runtime.

    - Services can be used either by a set of stub classes (static) or by a dynamic
    interface invocation (dynamic).

    - You have the flexibility to switch protocols, location, etc., without having
    to reclaim your client code.


    # Disadvantages of WSIF


    WSIF is a Java API, and so cannot be used in environments that are not based on
    Java.


    # 5.6 Business process


    Using industry standards, Web services can advertise their interfaces, be discovered
    and invoked upon, and communicate with each other to deliver end-to-end functionality.
    But to support the business process, a further level of abstraction is required.
    The business process layer in our architectural stack, shown in Figure 5-10 on
    page 134, allows us to create and define complex processes or workflows. Processes
    are composed from the operations supplied by Web services that can be nested and
    sequenced according to business requirements.'
  merge: -1
  pgno: 150
- img_proc: true
  md: '![](img/334ef4856dbfc14b1f371b2c8b5e06b2_151_0.png)


    Figure 5-10 The business process layer


    By isolating the business process from the implementation of the underlying Web
    services, as shown in Figure 5-11 on page 135, you can more readily adapt to changing
    business conditions.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '![](img/334ef4856dbfc14b1f371b2c8b5e06b2_152_0.png)


    Figure-5-11 Isolating the business process from the implementation


    Using a consistent modeling approach simplifies communication between all parties
    involved in the business process. In addition, models can be shared between partners
    without dictating the development tools or run-time environment that each of the
    partners in the process must use. A consistent modeling approach based on open
    standards also allows the activities in the process to be loosely coupled to the
    process itself, thereby minimizing the effort and required to implement changes
    to the process as the business environment or requirements change.


    # 5.6.1 WSFL and XLANG


    Both the Web Services Flow Language (WSFL) from IBM and Microsoft XLANG were early
    suggestions for business process execution standards. These both have been combined
    and further developed to create a common standard backed by most of the current
    industry leaders as BPEL4WS, which is described in further detail in "Emerging
    standards for business process" on page 136.


    Chapter 5. Technology options 135'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# Process Choreographer


    IBM WebSphere Application Server Enterprise V5.0 provides a facility called the
    Process Choreographer. Business processes are described using a subset of the
    Web Services Flow Language (WSFL), an IBM specification that developed before
    any standards work commenced on business process descriptions for Web services.
    A development plugin for WebSphere Studio Integration Edition may be used for
    process development. More information about Process Choreographer is available
    from:


    ```

    http://www.software.ibm.com/wsdd/zones/was/wpc.html

    ```


    See IBM Redbook Patterns: Serial and Parallel Processes for Process Choreography
    and Workflow, SG24-6306.


    # Advantages of Process Choreographer


    There are number of advantages to commencing the development of business processes
    using Process Choreographer, without waiting for products based on the new standards
    to be released. These include:


    +   - You can start to develop experience with building business processes.


    +   - You can develop processes that compose components that are implemented as
    Web services, as J2EE components, as existing enterprise applications, and as
    manual activities.


    # Disadvantages of Process Choreographer


    Since Process Choreographer does not currently implement open standards, there
    are some disadvantages in using it, including:


    +   - You will have to migrate processes at some stage to standards based implementations.
    Note that it is likely IBM will provide tools to assist with this migration.


    +   - Your business process developers will most likely have to learn changes
    to the development tools in support of a standards implementation.


    +   - Any process activities that do not have a Web services interface will not
    be usable as activities in a standards-based implementation.


    # 5.6.2 Emerging standards for business process


    As already mentioned above, the proposals developed by individual vendors such
    as IBM and Microsoft in the past to create a business process execution standard,
    have been combined and further developed. As there is currently only one major
    standard emerging to satisfy the requirements of the business process layer of
    our Web services stack.'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# BPEL4WS


    The Business Process Execution Language for Web Services (BPEL4WS) provides a
    standard way of describing business processes that are based on Web services.
    Existing standards, such as WSDL, do not provide facilities that are required
    in complex business protocols, as the description of behavior dependent on data
    sent between services, exception management and recovery, and coordination between
    business partner participants for long running and complex processes. BPEL4WS
    aims to meet these requirements.


    BPEL4WS was first specified in July 2002 bying, IBM, Microsoft, SAP, and IBM (Web
    Services Flow Language, or WSFL). The latest release of the specification at the
    time of writing, version 1.1, was submitted to the OASIS standards group in May
    2003. A copy of the standard is available from:


    ```

    http://www.ibm.com/developerworks/webservices/library/ws-bpel/

    ```


    You should note that the World Wide Consortium (W3C) has established a working
    group to develop the Web Services Choreography Interface (WSIC), which may provide
    an alternative standard. However, at the time of writing no draft had been issued.


    At the time of writing, support for BPEL4WS is emerging in some products and technology
    previews. IBM provides BPWS4J as a runtime engine for WebSphere Application Server
    and Apache Tomcat. The BPWS4J toolkit also includes a development tool. BPWS4J
    can be downloaded from:


    ```

    http://www.alphaworks.ibm.com/tech/bpws4j

    ```


    IBM also provides a technology preview of a development plug-in for WebSphere
    Studio Integration Edition, as illustrated in Figure 5-12 on page 138.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '![](img/334ef4856dbfc14b1f371b2c8b5e06b2_155_0.png)


    Figure 5-12 BPEL4WS Importer/Exporter Technology Preview


    This plug-in provides facilities to develop process flows using a visual editor,
    and generate WSDL and other artifacts to implement the process.


    Implementations of the BPEL4WS standard may be appropriate Product mappings, particularly
    for the Extended Enterprise business pattern and the Application Integration pattern.
    However, the use of BPEL4WS technologies is not evaluated in this book.


    For additional details, you may wish to review the following documents:

    http://www.ibm.com/developerworks/webservices/library/ws-bpwp/

    http://www.ibm.com/developerworks/webservices/library/ws-autobop/

    http://www.ibm.com/developerworks/webservices/library/ws-bpcol1/


    The last reference is the first in a series of columns that describe BPEL4WS at
    version 1.0 of the standard.


    Patterns: Service-Oriented Architecture and Web Services'
