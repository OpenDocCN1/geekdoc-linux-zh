    # ## 2.2 Web services architecture


    Web services are a relatively new technology that have received wide acceptance
    as an important implementation of service-oriented architecture. This is because
    Web services provides a distributed computing approach for integrating extremely
    heterogeneous applications over the Internet. The Web service specifications are
    completely independent of programming language, operating system, and hardware
    to promote loose coupling between the service consumer and provider. The technology
    is based on open technologies as:


    +   - eXtensible Markup Language (XML)

    - Simple Object Access Protocol (SOAP)

    - Universal Description, Discovery and Integration (UDDI)

    - Web Services Description Language (WSDL)


    Using open standards provide broad interoperability among different vendor solutions.
    These principles mean that companies can implement Web services without having
    any knowledge of the service consumers, and vice versa. This facilitates just-in-time
    integration and allows businesses to establish new partnership easily and dynamically.


    # ### 2.2.1 What Web services are


