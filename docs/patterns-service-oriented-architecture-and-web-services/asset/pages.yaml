    html/securitysemanticweb.asp


    # 5.10 Transaction


    When using a distributed architecture such as Web services to automate

    business processes across the enterprise, the concept of transactions becomes

    very important. Figure 5-22 on page 154 shows transaction support as a quality

    service layer in our architectural stack.'
