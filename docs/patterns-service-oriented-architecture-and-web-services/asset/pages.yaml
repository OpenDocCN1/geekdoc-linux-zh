    # 2.1.2 Service-oriented architecture as a solution


    Ever since the "software crisis" prompted the beginnings of software engineering,
    the IT industry has been struggling to find solutions to solve the problems. Throughout
    the years, the following short list of core technology advancements have brought
    us to where we are today. We will briefly discuss those technologies and our focus
    will be on how such technologies resolve IT problems.


    # Object-oriented analysis and design


    Larman describes the essence of the object-oriented analysis and design as considering
    "a problem domain and logical solution from the perspective of objects (things,
    concepts, or entities)\ in Applying UML and Patterns - An Introduction to Object-Oriented
    Analysis and Design. Jacobson, define these objects as being "characterized by
    a number of operations and a state that remembers the effects of these operations"
    in Object-Oriented Software Engineering: A Use Case Driven Approach.


    In object-oriented analysis, such objects are identified and described in the
    problem domain, while in object-oriented design, they are transitioned into logical
    software objects that ultimately be implemented in an object-oriented programming
    language.


    With object-oriented analysis and design, certain aspects of the object (or group
    of objects) can be encapsulated to simplify the analysis of complex business scenarios.
    Certain characteristics of the object(s) can also be abstracted so that only the
    important or essential aspects are captured, in order to reduce complexity.


    # Component-based design


    Component-based design is not a new technology. It is naturally evolved from the
    object paradigm. In the early days of object-oriented analysis and design, fine-grained
    objects were marked as a mechanism to provide "reuse", but those objects are too
    low a level of granularity and there are no standards in'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'place to make widespread reuse practical. Coarse-grained components become
    more and more a target for reuse in application development and system integration.
    These coarse-grained components provide well defined functionality from a cohesive
    set of finer-grained objects. In this way, packaged solution suites can also be
    encapsulated as "components".


    Once the organization achieves a higher level of architectural maturity based
    on distinctly functional components, applications that support the business can
    be partitioned into a set of increasingly larger grained components. Components
    can be seen as the mechanism to manage and expose services. They can use a set
    of technologies in concert: Large-grained enterprise components, that implement
    business-level use-cases, can be implemented using newer object-oriented software
    development in combination with legacy systems.


    # Service-oriented design


    In Component-Based Development for Enterprise Systems, Allen includes the notion
    of services, describing a component as an "executable unit of code that provides
    physical black-box encapsulation of related services. Its service can only be
    accessed through a consistent, publicó interface that includes an interaction
    standard. A component must be capable of being connected to other components (through
    a communications interface) to a larger group".


    A service is generally implemented as a coarse-grained, discoverable software
    entity that exists as a single instance and interacts with applications and other
    services through a loosely coupled, message-based communication model. Figure
    2-3 on page 22 shows important service-oriented terminology:


    +   * Services: Logical entities, the contracts defined by one or more published
    interfaces.


    +   * Service provider: The software entity that implements a service specification.


    +   * Service consumer (or request): The software entity that calls a service
    provider. Traditionally, this is termed a "client". A service consumer can be
    an end-user application or another service.


    +   * Service locator: A specific kind of service provider that acts as a registry
    and allows for the lookup of service interfaces and service locations.


    +   * Service broker: A specific kind of service provider that can pass on service
    requests to one or more additional service providers.'
