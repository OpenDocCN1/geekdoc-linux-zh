    # 8.5 Best practices


    In this section we look at service discovery best practices in a J2EE environment
    like WebSphere Application Server, and how such practices can benefit SOA.


    # 8.5.1 Using UDDI and WSDL together


    UDDI entries can be configured manually, as we did in "Populating the UDDI Registry"
    on page 269, or programmatically. Not all fields are particularly relevant to
    Web services, but still need be consistent with the complete WSDL document describing
    a service. The UDDI standard has been built to offer more functions than those
    strictly needed for Web services. The UDDI information can contain metadata about
    the provider and as the service.


    Tools like WebSphere Studio Application Developer make it easier to create the
    UDDI description from a WSDL file or Java source in the development environment.
    When you publish a service, however, you need to decide where to store the WSDL
    files since the UDDI registry only contains pointers to the WSDL.


    You can leave the WSDL files in the Web project associated with a service. Alternatively,
    you may prefer to make the WSDL files available via HTTP, as we did in "Populating
    the UDDI Registry" on page 269, or in a specific directory on the UDDI registry
    file system.'
