- img_proc: true
  md: '![](img/334ef4856dbfc14b1f371b2c8b5e06b2_184_0.png)


    Figure 6-6 Example of a WS-I synchronous request/response scenario


    The Figure 6-6 scenario is an example of the call variation of the Application
    Integration::Direct Connection runtime pattern, since both the Retailer and Warehouse
    services are hosted in the secure network zone of the company.


    This pattern should be selected when the requirements specify that a request must
    be responded to before the business process can continue. In the sample application,
    for example, it is not possible for the consumer to buy a product until they have
    been supplied with a catalog listing. So the business process to buy a product
    cannot continue until the requested catalog listing has been returned.


    Quality of service attributes are important qualifiers on the selection of this
    scenario to meet a business requirement. The synchronous request/response scenario
    in a Web services environment will almost always suffer greater latency than request/response
    using other approaches, such as RPC. This is because:


    +   More components are required to implement this scenario for a Web services
    environment than, for example, an RPC environment.


    +   Since the data exchanges are in self-describing XML, there is a greater cost
    to parse and process the message exchanges than for serialized data.


    # Design alternative: Basic callback scenario


    The basic callback scenario is provided for situations where a consumer needs
    a response to a request, but will not wait for the response, which might take
    some time for the provider to send. An example is shown in Figure 6-7 on page
    168.'
