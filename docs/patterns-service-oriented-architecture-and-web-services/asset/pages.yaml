    # ## 2.1.3 A closer look at service-oriented architecture


    Service-oriented architecture presents an approach for building distributed systems
    that deliver application functionality as services to either end-user applications
    or other services. It is comprised of elements that can be categorized into *functional*
    and *quality of service*. Figure 2-6 on page 25 shows the architectural stack
    and the elements that might be observed in a service-oriented architecture.


    > Note: Service-oriented architecture stacks can be a contentious issue, with
    several different stacks being put forward by various proponents. Our stack is
    not being positioned as *the services stack*. It is just presented as useful framework
    for structuring the SOA discussion in the rest of the publication.'
  merge: -1
