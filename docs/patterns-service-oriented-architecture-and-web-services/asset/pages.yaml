    # 5.11 Management


    As more and more businesses start to trust key parts of their operations to Web
    services, the management of these Web services becomes increasingly critical.
    In the case of our Web services architectural stack, as shown in Figure 5-23,
    the management layer is related to the ability to discover the existence, availability
    and health of the Web services infrastructure, service registries and Web service
    applications. Optimally, the management system should also be able to control
    and configure the infrastructure and components of the implemented SOA.


    Figure 5-23 The management layer


    But the quality of service aspects of management within the Web services architecture
    are broader than just the architectural stack, and must also include the management
    of the underlying infrastructure and networks required to implement and run the
    Web services. Furthermore, it must extend outside of'
