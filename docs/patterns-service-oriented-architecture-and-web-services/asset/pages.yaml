    # # 5.9.1 Security at the transport layer


    Web services interactions are based on message exchanges between the service consumer
    and service provider, so the security capabilities of the underlying transport
    protocol responsible for providing the connection between the services can be
    utilized.


    # ## HTTP transport


    Hyper Text Transfer Protocol (HTTP), described in "HTTP" on page 110, is the most
    commonly used protocol for information exchange on the Internet. Unfortunately,
    HTTP is an inherently insecure protocol, since all information is sent in clear
    text between unauthenticated peers or an insecure network.


    HTTPS, which stands for HTTP for SSL (Secure Sockets Layer), allows service consumer
    and provider authentication through certificates, which have been either self-signed
    or signed by a certification agency. The consumer must support SSL protocol version
    to use, and a unique session-ID negotiate the SSL protocol version upon establishing
    a secure connection, is established. If the certificate presented by the provider
    is unknown to the consumer, the consumer is free to accept or reject the certificate.
    The provider can also demand a certificate from the consumer. During a secure


    Chapter 5. Technology options 149'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'session, the provider and consumer share a common key pair that allows them
    to encrypt and decrypt messages they exchange.


    Although HTTPS does not cover all the aspects of general security framework, it
    provides a sufficient security level regarding party identification and authentication,
    message integrity, and confidentiality. However, authorization, auditing, and
    non-repudiation are not provided. Also, it is protocol-based and therefore all
    the security disappears once the message has passed the HTTP server. In addition,
    the encryption is message-wise and not element-wise; to access the routing information,
    we have decrypt the entire message.


    #  5.9.2 Security at the service communication protocol level


    When trying to secure a SOAP service, two types of threats should be considered:


    +   - The message could be modified or read by unauthorized persons.


    +   - An unauthorized person could send messages to a service that, while well-formed,
    lacks appropriate security claims to warrant processing.


    The WS-Security specification addresses these threats.


    # WS-Security


    Web Services Security (WS-Security) Version 1.0 was jointly developed by IBM,
    Microsoft, and VerSign, and was released in April 2002. It was submitted to OASIS
    by 18 companies, and now involves over 50 companies.


    WS-Security describes SOAP messaging enhancements for protecting messages by encrypting
    and/ digitally signing the body, headers, attachments, and any combination or
    part. This specification defines how to attach and include security tokens, such
    as X.509 certificates, within SOAP messages.


    For more information, see the IBM developerworks article Web Services (WS-Security):


    ```

    http://www.ibm.com/developerworks/webservices/library/ws-sec/

    ```


    #  5.9.3 Security at the service description level


    So far, we have discussed Web services provided by the underlying transport (HTTP/S)
    and service communication protocol (SOAP) layers. We have already mentioned that
    Web services are XML document exchange and therefore another level of security
    can be achieved at the XML document level. In this section we provide a brief
    overview of a set of security technologies that are being adopted as standards
    or are in the process of adoption.'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# XML digital signatures


    XML digital signatures is a standard for securely verifying the origins of messages.
    It specifies a standard procedure for signing XML documents with a variety of
    different digital signature algorithms. Digital signatures can be used for validation
    of messages as well as for non-repudiation.


    # XML encryption


    XML encryption is still a work in progress. Its aim is to encryption of digital
    content, such as GIF images or XML fragments. XML encryption allows the parts
    of an XML document to be encrypted while leaving other parts open, encryption
    of the XML itself, or the super encryption of data (that is, encrypting an XML
    document when some elements have already been encrypted).


    # Security assertion markup language


    Security assertion markup language (SAML) is the first industry standard for secure
    e-business transactions based on XML. SAML is developed to define a common way
    for sharing security services between companies engaged in business-to-business
    and business-to-consumer transactions. SAML allows companies to securely exchange
    authentication, authorization, and profile information among their customers,
    partners, or suppliers regardless of their security solutions or platforms. As
    a result, SAML supports the interoperability between different security systems.


    # 5.9.4 Emerging standards for security


    We know that the Web services security standards still have some way to go, but
    ongoing development is addressing the gaps or short falls. The ability to implement
    Web services solutions that provide standards-based, enterprise-level security
    is not far from reach.


    Extensions to the WS-Security specification are extending security coverage further
    up the functional and over to the non-functional components of the stack, as shown
    in Figure 5-21 on page 152.'
  merge: -1
  pgno: 168
- img_proc: true
  md: '![](img/334ef4856dbfc14b1f371b2c8b5e06b2_169_0.png)


    # WS-SecureConversation


    WS-SecureConversation describes how to manage and authenticate message exchanges
    between parties, built on the concept of trust based on security tokens, including
    security context exchange and establishing and deriving session keys.


    # WS-Federation


    WS-Federation describes how to manage and broker the trust relationships in a
    heterogeneous federated environment, including support for federated identities.


    # WS-Authorization


    WS-Authorization describes how access policies for a Web service are specified
    and managed. In particular it describes how claims may be specified within security
    tokens and how these claims will be interpreted at the endpoint.


    # WS-Policy


    WS-Policy describes the capabilities and constraints of the security (and other
    business) policies on intermediaries and endpoints. See also 5.8, “Policy” on
    page 144.'
