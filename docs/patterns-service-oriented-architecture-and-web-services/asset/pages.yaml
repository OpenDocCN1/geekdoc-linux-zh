    |---|---|

    | Variation: Serial Work Flow | Variation: Parallel Work Flow |

    | Direct Connection | Broker |

    | Variations: Message/Call | Variation: Router |

    | No | Yes |

    | Parallel Interaction |


    Figure 3-5 Classification of Process-focused Application Integration patterns


    The framework also applies to the Extended Enterprise domain. Using the interaction
