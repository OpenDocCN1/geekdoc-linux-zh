  md: '# 5.1 Introduction


    This chapter describes Web services technologies relevant to service-oriented
    architecture, including some of their advantages and disadvantages. For an overall
    perspective, some of the pluses and minuses of Web services are included in this
    section. It is not recommended that Web services are seen as the solution to all
    your integration problems, and should not be considered as the best architectural
    approach for all future solutions. Just as with other technology or architectural
    approach, there are inherent advantages of using Web services in the right place
    and for the right reasons.


    # 5.1.1 Advantages of Web services


    When appropriately selected and implemented, the use of Web services technologies
    can enable a business to:


    +   Deliver new IT solutions faster and at lower cost by coding their development
    on core business, and Using Web services applications for non-core business programming.

    Protect your investment in IT legacy systems by using Web services to wrap legacy
    software systems for integration with modern IT systems.

    Integrate their business processes with customers and partners at less cost. Web
    services make this integration feasible by allowing businesses to share processes
    without sharing technology. With lower costs, even small businesses will be able
    to participate in B2B integration.

    Enter new markets and widen their customer base. Web services listed in UDDI registries
    can be "discovered" and thus are "visible" to the entire community.


    # 5.1.2 Disadvantages of Web services


    All technologies have problems and disadvantages that should be taken into consideration
    before they are used. To try and assist with identifying if Web services is appropriate
    or not, the following list gives some issues you should consider when selecting
    to use Web services:


    +   Binding to Web services dynamically requires that the contents of the UDDI
    registry be trusted. Currently, only private UDDI networks can provide such control
    over the contents.

    The SOAP server footprint is significant and the technology is relatively new,
    so adding the Web service provider stack to existing enterprise systems can be
    a problem.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '+   Standards for integration of business processes, management of transactions,
    and the awareness of the policies of interchanging partners all still under development.
    To realize the promise of Web services, these types of standards should be available
    in implementation products.


    # 5.2 Transport


    The transport layer in our architectural stack, as shown in Figure 5-2, is related
    to the mechanisms used to move service requests from the service consumer to the
    service provider, and service responses from the service provider to the service
    consumer. There are a number of standards in use today for Web services, but the
    most common one is HTTP.


    ![](img/334ef4856dbfc14b1f371b2c8b5e06b2_127_0.png)


    # 5.2.1 HTTP


    The HTTP protocol is commonly used for the transport of service requests and responses.
    HTTP extensions and HTTP/1.1 are stable specifications used as the standard transport
    protocol of the World Wide Web.


    The World Web Consortium (W3C) has closed the HTTP Activity, as they have achieved
    the goal of creating a successful standard. The W3C has started'
  merge: -1
  pgno: 127
- img_proc: true
  md: 'a new activity to extend the XML protocol. The XML Protocol Working Group will
    define HTTP bindings for XML, as a higher-level protocol.


    # Advantages of HTTP


    There are a number of advantages of using HTTP as a transport for Web interactions,
    including:


    +   - HTTP is a widely adopted protocol. Any organization with a Web server has
    implemented HTTP, and any client using a Web browser uses HTTP. Therefore the
    HTTP infrastructure is widely available.


    +   - HTTP protocol is open and deployed on many different system types, including
    non-traditional computing devices as PDAs.


    +   - Most enterprises allow HTTP to travel freely through protocol firewalls.
    Therefore, there are fewer barriers to extended enterprise use of HTTP as a transport
    for Web services.


    # Disadvantages of HTTP


    HTTP is a light-weight and stateless protocol that was not originally designed
    to carry application data. Some of the disadvantages of using it for Web services
    include:


    +   - The protocol is stateless. If any state data is required to maintain an
    application session, the applications must create and manage the state data.


    +   - HTTP is not a reliable protocol. If reliable delivery of application data
    is required, the application must either:


    +   - Develop a reliability framework, such as exchanging receipt messages.


    +   - Use a more reliable protocol.


    # 5.2.2 Java Message Service


    Messaging middleware is a popular choice for accessing enterprise systems in an
    asynchronous manner. Messaging communication is loosely coupled, as to tightly
    coupled technologies such as Remote Method Invocation (RMI) or Remote Procedure
    Calls (RPC). The sender does not need to know anything about the receiver for
    communication. The message to be delivered is sent to a destination (queue) by
    a sender component, and the recipient parts and the receiver do not have to be
    available at the same time to communicate. Messaging is one of the options if
    you are implementing a solution based on the Message variation of the Direct Connection
    pattern in an intra-enterprise scenario.'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'Messaging middleware may be an appropriate transport protocol when there is
    a requirement for Web services to communicate:


    +   - Synchronously, where the sender of a message does not wait for a reply to
    the message


    +   - Reliably, where the sender is assured the message will be delivered


    A standard way for using messaging middleware from a Java application is using
    the Java Message Service (JMS) interface. JMS offers Java programmers a common
    way to create, send, receive and read enterprise messages. The JMS specification
    was developed by Sun Microsystems with the active involvement of IBM, other enterprise
    messaging vendors, transaction processing vendors, and RDBMS vendors.


    JMS has two messaging styles, or in other words, domains:


    +   - One-to-one, or point-to-point model


    +   - Publish/subscribe model


    # IBM JMS implementations


    IBM provides two implementations of JMS:


    +   - A JMS provider included with WebSphere Application Server V5.0. This can
    be used for asynchronous communication between applications running on WebSphere
    V5.0 servers.


    +   - WebSphere MQ V5.3 includes built-in JMS Provider support with enhanced performance
    features for integrating JMS applications with other applications. WebSphere MQ
    takes care of network interfaces, assures once and only delivery of messages,
    deals with communications protocols, dynamically distributes workload across available
    resources, and handles recovery after system problems. IBM WebSphere MQ is available
    for most popular operating system platforms.


    # Advantages of JMS


    There are a number of advantages of using JMS as a transport for Web services
    interactions, including:


    +   - JMS provides a more reliable transport than alternatives, such as HTTP.


    +   - Asynchronous requests can be readily deployed.


    +   - It leverages existing, enterprise-proven messaging systems.'
