    # SOA collaborations


    Figure 2-7 shows the collaborations in a service-oriented architecture. The collaborations
    follows the "find, bind and invoke" paradigm where a service consumer performs
    dynamic service location by querying the service registry for a service that matches
    its criteria. If the service exists, the registry provides the consumer with the
    interface contract and the endpoint address for the service. The following diagram
    illustrates the entities in a service-oriented architecture that collaborate to
