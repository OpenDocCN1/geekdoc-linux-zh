  md: '# 8.4 Runtime guidelines


    After implementing and testing the application changes to add our UDDI registry,
    they need to be deployed to a runtime environment. Our services and consumers
    remain on IBM WebSphere Application Server V5.1, but we add IBM WebSphere Application
    Server Network Deployment V5.0.2.4, which includes a UDDI Registry.


    # 8.4.1 Service deployment considerations


    The Retailer now has two options for finding the location of the Warehouse service:


    +   Using the static stub generated at development or deployment time, from the
    deployment descriptors and WSDL packaged with the application.


    +   Using a lookup to a private UDDI registry. For this option, we need to deploy
    and populate a private UDDI registry. We also need to redeploy the updated Retailer
    application, which is a Warehouse consumer.


    # Deploying the UDDI Registry


    The UDDI Registry is essentially a JEE application installed in the WebSphere
    Application Server runtime. When deploying the UDDI Registry, there are two main
    choices to make for the installation:


    +   Install on a single application server or on a server in a deployment manager
    cell.


    We used a single application server because our scenario did not require the full
    IBM WebSphere Application Server Network Deployment V5.0.2.4 installation.


    +   The database for persistence.


    We used IBM DB2 UDB V8.1 to simulate a production-oriented environment. The lightweight
    Cloudscape database is an interesting choice for preliminary tests only.


    Details for completing the installation can be found in the WebSphere Information
    Center article, Installing the UDDI Registry into a single appserver at:


    ```

    http://www.ibm.com/software/websservers/appserv/infcenter.html

    ```


    # Populating the UDDI Registry


