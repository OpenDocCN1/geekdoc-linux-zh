  md: '# Patterns: Service-Oriented Architecture and Web Services


    Design service-oriented architectures using Web services


    The Patterns for e-business are a group of proven, reusable assets that can be
    used to increase the speed of developing and deploying Web applications. This
    IBM Redbook focuses on how the Self-Service and Extended Enterprise business patterns,
    and the Application Integration pattern, can be used to start implementing using
    the service-oriented architecture pattern.


    Learn service bus, directory, and gateway solutions


    INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    We guide you through the process of selecting and applying Business, Application
    and Runtime patterns. Next, the platform-specific Product mappings are identified
    upon the selected Runtime pattern.


    BUILD TECHNICAL INFORMATION BASED ON PRACTICAL EXPERIENCE


    Learn by example with practical scenarios


    IBM Redbooks are developed by the IBM International Technical Support Organization.
    Experts from IBM and Partners from around the world create timely technical information
    based on realistic scenarios. Recommendations are provided to help you implement
    IT solutions more effectively in your environment.


    We present guidelines for applying the Patterns and service-oriented architecture
    approach to a sample business scenario and for utilizing Web technologies.


    We detailed design, development, and runtime guidelines for several scenarios,
    including synchronous and asynchronous service buses, UDDI service directory,
    and the Web Services Gateway.


    For more information: ibm.com/redbooks


    This publication concludes with an examination of how a service-oriented architecture
    can provide a step in the direction of IBM’s e-business on-demand vision.


    SG24-6303-00   ISBN073845317X'
