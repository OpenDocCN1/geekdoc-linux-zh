    # Services in the context of SOA


    In service-oriented architecture, services map to the business functions that
    are identified during business process analysis. The services may be fine- coarse-grained
    depending upon the business processes. Each service has a well-defined interface
    that allows it to be published, discovered and invoked. An enterprise can choose
    to publish its services externally to business partners or internally within the
    organisation. A service can also be composed from other services.


