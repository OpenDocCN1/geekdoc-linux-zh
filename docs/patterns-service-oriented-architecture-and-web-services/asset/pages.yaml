  md: 'The roles in a service-oriented architecture are:


    +   * Service consumer: The service consumer is an application, a software module
    or another service that requires a service. It initiates the enquiry of the service
    in the registry, binds to the service over a transport, and executes the service
    function. The service consumer executes the service according to the interface
    contract.


    +   * Service provider: The service provider is a network-addressable entity that
    accepts and executes requests from consumers. It publishes its services and interface
    contract to the service registry so that the service consumer can discover and
    access the service.


    +   * Service registry: A service registry is the enabler for service discovery.
    It contains a repository of available services and allows for the lookup of provider
    interfaces to interested service consumers.


    Each entity in the service-oriented architecture can play one (or) of the three
    roles of service provider, consumer and registry.


    The operations in a service-oriented architecture are:


    +   * Publish: To be accessible, a service description must be published so that
    it can be discovered and invoked by a service consumer.


    +   * Find: A service requester locates a service by querying the service registry
    for a service that meets its criteria.


    +   * Bind and invoke: After retrieving the service description, the service consumer
    proceeds to invoke the service according to the information in the service description.


    The artifacts in a service-oriented architecture are:


    +   * Service: A service that is made available for use through a published interface
    allows it to be invoked by the service consumer.


    +   * Service description: A service description specifies how a service consumer
    will interact with the service provider. It specifies the format of the request
    and response from the service. This description may specify a set of preconditions,
    post conditions and/or quality of service (QoS) levels.


    In addition to dynamic service discovery and definition of a service interface
    contract, a service-oriented architecture has the following characteristics:


    +   * Services are self-contained and modular.


    +   * Services support interoperability.


    +   * Services are loosely coupled.


    +   * Services are location-transparent.'
