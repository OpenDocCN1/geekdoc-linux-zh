    # Accessing the target WSDL from the gateway


    The WSDL file for the service you want to deploy needs to be accessible by the
    gateway. The gateway and Web service consumer (client) applications will also
    need access to any WSDL files or XML Schemas imported by the service WSDL.


    If your WSDL includes imports, our recommendation is to make the WSDL and any
    imports available via an HTTP URL. This way both the gateway and clients can access
    the required files from the same location. Ideally, HTTP URLs should point to
    documents on a related Web server.


    If your WSDL does not import other files, you can place the WSDL on the local
    file system of the gateway node, since clients will be able to access all the
    required service definitions via the gateway.


