  md: '# BEEP


    Blocks Extensible Exchange Protocol (BEEP) is a generic application protocol framework
    for peer-to-peer asynchronous interactions over a TCP/IP connection. Unlike HTTP,
    BEEP does not have a notion of a server or client, and rather initiates a message-based
    communication session when a requester initiates a request for connection with
    a provider.


    Standardized by the Internet Engineering Task Force (IETF), BEEP supplies a protocol
    framework to manage peer-to-peer connection, authentication, message transport
    and error handling. But all this comes at a cost, and as such BEEP does not rely
    itself for communications that could be categorized as one-shot as DNS look-up
    or tightly coupled RPC protocols like NFS. The appropriate environment for the
    use of BEEP is when you require an application protocol framework that is:


    +   - Connection-oriented: Any BEEP based communication is expected to be initiated
    and disconnected for each interaction. In other words BEEP is expecting your application
    to connect, undertake the required task, and disconnect.


    +   - Message-oriented: Just as the fundamental concepts of SOAs, applications
    using BEEP to send data will do so based on well defined and structured data,
    giving the ability for the applications to be loosely coupled with limited knowledge
    of each others'' implementation.


    +   - Asynchronous: BEEP, unlike HTTP, is a peer-to-peer style communication framework,
    which does not restrict the interactions to be in a particular order.


    # Where to find more information


    For more information on BEEP specifications, see:


    http://www.beepcore.org


    # 5.3 Service communication protocol


    The service communication protocol layer of our architectural stack, as shown
    in Figure 5-3 on page 117, describes and defines the technologies and standards
    required to supply a transport mechanism between integrated services. If we consider
    the transport layer of the stack (discussed in the previous section) to be represented
    by a road between two end points, the service communication protocol layer would
    be the vehicles traveling on the road, facilitating the transport of a package
    between the package sender and the receiver.'
