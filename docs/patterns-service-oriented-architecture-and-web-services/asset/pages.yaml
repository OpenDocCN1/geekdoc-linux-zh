    or external threat.


    The service-oriented architecture approach allows applications or data stores
    to be wrapped as a service and made available for invocation by any other service.
    The enterprise is then able to rapidly gain access to new information and data
    when required, with minimal impact on the existing applications.


    # Data consolidation


    Where data needs to be consolidated for greater performance and availability,
    an on demand environment provides data placement management. This allows information
    to be consolidated or cached when business requirements demand it.


    To better understand the value of a service-oriented architecture when discussing
    data consolidation within an on demand environment, it would be easiest to review
    each of the above mentioned alternatives for data placement management independently.


    +   - Consolidation of data to a central repository is not unique to the on demand
    operating environment. As organizations extend through mergers and acquisitions,
    the requirement to merge independent data repositories such as customer and employee
    information becomes a necessity.


    Although a service-oriented architecture will not supply any direct support for
    the management of data consolidation or tools for data migrations, it will supply
    a robust infrastructure to enable the enterprise to rapidly deploy new information
    and data sources to be harvested for consolidation.


    +   - Caching. In situations where the information resides outside of the enterprise
    and/or is for reference or volatile data, it would generally be more appropriate
    to cache the data for a defined length of time or until longer valid. Let us consider
    the standard Web services example of a stock quote request. Unless the data was
    regarded as part of the core business function, it would be unrealistic or impractical
    for the enterprise to locally manage a repository of constantly changing stock
    values, and advisable to request the current values of a complete portfolio from
    the external supplier when required and on demand. The retrieved data could be
    cached locally until expired or invalid, to facilitate a faster response time
    for subsequent requests by other users or for other values of the currently cached
    portfolio.'
