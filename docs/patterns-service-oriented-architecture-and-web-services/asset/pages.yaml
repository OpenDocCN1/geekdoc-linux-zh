    # ### 3.4.3 Direct Connection application pattern


    The Direct Connection application pattern represents the simplest interaction
    type and is based on a 1-to-1 topology. It allows a pair of applications within
    the organization to directly communicate with each other. Interactions between
    a source and a target application can be arbitrarily complex. Generally, complexity
    can be addressed by breaking down interactions into more elementary interactions.


    More complex point-to-point connections will have modeled connection rules associated
    with them, as shown in Figure 3-7 on page 53. Connection rules are generally used
    to control the mode of operation of a connector depending on external factors.
    Examples of connection rules are:


    +   * Business data mapping rules (for adapter connectors)

    * Autonomic rules (such as priority in a shared environment)

    * Security rules

    * Capacity and availability rules'
  merge: -1
  pgno: 69
- img_proc: true
  md: '![](img/334ef4856dbfc14b1f371b2c8b5e06b2_70_0.png)


    Note: The Connection Rules component is not needed when there are no modeled rules
    associated with the connection.


    The Direct Connection application pattern has two variations:


    +   - Message Connection variation

    - Call Connection variation


    All applications of the Direct Connection application pattern will be one variation
    or the other. The variation required depends on whether the initiating application
    needs an immediate response from the target application in order to continue with
    execution.


    Both variations may be used with synchronous or asynchronous communication protocols.
    However, there are preferences for a specific protocol type depending on the variation.
    For example, the Call Connection variation has a more natural fit with synchronous
    protocols while the Message Connection variation favors asynchronous protocols.


    In the Extended Enterprise domain, the Exposed Direct Connection application pattern
    (and its Exposed Message/Call Connection variations) allows a pair of applications
    to directly communicate with each other across organization boundaries.


    # Direct Connection and SOA


    The 1-to-1 interaction of the Direct Connection application pattern maps to the
    basic service consumer to service provider interaction of service-oriented architectures,
    which is also 1-to-1 in nature.'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'As we will see in 3.5.2, "Runtime patterns for Direct Connection" on page 62,
