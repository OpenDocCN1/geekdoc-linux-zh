    # 7.3.2 Service consumer (client) development considerations


    The HTTP service consumer development considerations discussed in "Service consumer
    (client) development considerations" on page 200 also apply to JMS service consumers.


    One point worth emphasizing here is configurability of our service-oriented architecture.
    The IBM WebSphere V5 Web services runtime allows us to easily reconfigure HTTP
    clients to use the new JMS transport. Let us look at the steps needed to switch
    Retailer, as a LoggingFacility service, over the new JMS transport.


    # Enabling an existing consumer to use the JMS transport


    To reconfigure Retailer to use the new JMS transport:

    1. In the Studio J2EE...\2. Edit LoggingFacility.Impl.wsdl and change soap:address:

    ```xml

    <wsdlsoap:address

    location="http://appssrvll.ito.ral.ibm.com:9080/LoggingFacility/services/LoggingFacility/"

    ```

    To:

    ```xml

    <wsdlsoap:address

