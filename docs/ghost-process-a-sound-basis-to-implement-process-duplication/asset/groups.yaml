    ## Conclusion


    In this paper, we have presented the ghost mechanism for process virtualization
    and how it can be used to ensure the ease of implementation for various mechanisms
    for global process management. The ghost process mechanism provides a full service
    for process virtualization (the export/import mechanism) and a set of interfaces
    for ghost process instances to access shared resources. Through the ghost process,
    various mechanisms of process management can be extended to the cluster scale.
    This approach guarantees the ease of maintenance and development of new mechanisms
    for global process management. The second benefit is that improving the efficiency
    of the ghost process mechanism and global process management can become more efficient.


    The ghost process mechanism has been implemented in the KERRIG global cluster
    operating system. The KERRIG uses process duplication and checkpoint restart mechanisms
    based on the ghost process


    Kerrid provides different distributed services that are in charge of resource
    management. Combining global memory management, ghost processes (the import process
    duplication synchronization service, and a cluster without synchronization), a
    complete set of processes has been implemented in Kerrid.


    Systems that provide mechanisms for process virtualization (e.g., process migration,
    process checkpoint) operate at the kernel level and based on a specific kernel
    patch. Nevertheless, all these patches are similar. Therefore, a common patch
    and the integration of this patch should be used to simplify the development of
    such a virtualization mechanism for clustering systems. The ghost process mechanism
    can easily ported on such a patch.


