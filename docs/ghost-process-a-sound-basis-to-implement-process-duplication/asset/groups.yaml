    # ## Abstract


    Process management mechanisms (process duplication, migration and checkpoint/restart)
    are very useful for high performance and high availability in clustering systems.


    The single image approach aims at providing a global process management service
    mechanism for checkpoint process, process migration and process duplication. In
    this context, a common mechanism for virtualization is highly difficult but traditional
    operating systems do not provide such a mechanism.


    This paper presents a kernel service for virtualization ghost process, extending
    the Linux kernel. The ghost process mechanism has been implemented in the Kerrighed
    system image based on Linux.


    **Keywords:** Linux cluster, distributed operating system, system image, process
    visualization.


    ease cluster use and to take advantage of the cluster''s distributed resources.
    Process management mechanisms are very useful in this respect. Process duplication
    allows the deployment of processes of a parallel execution on cluster nodes. While
    the traditional checkpoint mechanism extends a cluster to take advantage of the
    cluster resources during the execution of a given workload, may not be sufficient
    to correctly place the checkpoints on the cluster nodes when they are created.
    Dynamic load balancing strategies are essential to keep a cluster balanced. These
    strategies are implemented by an efficient process management mechanism to move
    a process from one node to another.


