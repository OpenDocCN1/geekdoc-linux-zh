    ## 5.3 总结


    性能评估表明，对于内存和磁盘中的检查点/重启，性能都直接取决于影子管理的效率。因此，通过提高影子进程的效率（以及内存访问、保存在机制中的数据保存效率，以及特别是资源分配的效率），全局进程管理机制的整体效率将得到提高。


