- md: "\n# Ghost Process: a Sound Basis to Implement Process Duplication, Migration\
    \ and Checkpoint/Restart in Linux Clusters\n\nGeoffroy Vallée\nORNL/INRIA/EDF\n\
    Computer Science and Mathematics Division\nOak Ridge National Laboratory\nOak\
    \ Ridge, TN 38731, USA\nvalleeg@ornl.gov\nFax: 865-576-5491\n\nRenaud Lottiaux\
    \ Darg Margery\nChristine Morin\nIRISA/INRIA, PARIS project-team\nCampus Universitaire\
    \ de Beaulieu\n35042 Renes, Cedex, France\n[rlottiau, dmargery, cmorin]@irisa.fr\n\
    Fax: +33 2 99 84 71 71\n\nJean-Yves Berthou\nEDF R&D\n1 avenue de Général de Gaulle\n\
    BP408, 92141 Clermont, France\njyberthou@edf.com\nFax: +33 1 47 65 34 99\n\n##\
    \ Abstract\n\nProcess management mechanisms (process duplication, migration and\
    \ checkpoint/restart) are very useful for high performance and high availability\
    \ in clustering systems.\n\nThe single image approach aims at providing a global\
    \ process management service mechanism for checkpoint process, process migration\
    \ and process duplication. In this context, a common mechanism for virtualization\
    \ is highly difficult but traditional operating systems do not provide such a\
    \ mechanism.\n\nThis paper presents a kernel service for virtualization ghost\
    \ process, extending the Linux kernel. The ghost process mechanism has been implemented\
    \ in the Kerrighed system image based on Linux.\n\n**Keywords:** Linux cluster,\
    \ distributed operating system, system image, process visualization.\n\nease cluster\
    \ use and ease of use and to take advantage of the cluster's distributed resources.\
    \ Process management mechanisms are very useful in this respect. Process duplication\
    \ allows the deployment of processes of a parallel execution on cluster nodes.\
    \ While the traditional checkpoint mechanism extends a cluster to take advantage\
    \ of the cluster resources during the execution of a given workload, may not be\
    \ sufficient to correctly place the checkpoints on the cluster nodes when they\
    \ are created. Dynamic load balancing strategies are essential to keep a cluster\
    \ balanced. These strategies are implemented by an efficient process management\
    \ mechanism to move a process from one node to another.\n\n## 1 Introduction\n\
    \nToday, clusters are more and more widely used to execute numerical applications.\
    \ Mechanisms are needed to allow implementation of process migration. First, process\
    \ migration can be implemented through a checkpoint/restart mechanism: the process\
    \ is checkpointed on a shared file system (e.g. using NFS) and restored from a\
    \ file system on the node. The second approach is like Condor: to migrate processes\
    \ directly through the network for efficiency. In such a system, the process is\
    \ extracted from a node, directly sent to another node and a new process is created.\
    \ We use OpenSSI[3] or Most[1] for this approach.\n\nCurrently, no system provides\
    \ the complete set of mechanisms in an efficient way, Genesis[4] is based on a\
    \ micro-kernel and does not provide a complete unit like\n\nFor the sake of efficiency\
    \ and ease of use, a kernel level implementation of the mechanisms needed for\
    \ global process management in a cluster (process duplication, migration, checkpoint/restart)\
    \ is highly desirable. The Linux kernel does not provide system services and interfaces\
    \ for process virtualization.\n\nIn this paper we present the ghost process mechanism\
    \ for process virtualization based on the Linux kernel, which provides a service\
    \ and an API to virtualize processes. This mechanism allows the implementation\
    \ of mechanisms for process management. As example, we present the implementation\
    \ of process migration at the cluster scale: a new migration and a mechanism of\
    \ process checkpoint/restart.\n\nThe ghost process mechanism has been implemented\
    \ in the KIRRIGED System Image (SSI) cluster operating[9], based on Linux. It\
    \ has been used to efficiently implement process checkpoint/restart in Kirriged.\
    \ With associated checkpoint/restart mechanisms and other global resource management\
    \ mechanisms (e.g. global sign management mechanisms) which are out of scope of\
    \ this paper, it allows global management of processes.\n\nThe structure of this\
    \ paper is organized as follows: Section 2 relates to global process management\
    \ in clusters. Section 3 describes the process concept we propose for process\
    \ virtualization. Section 4 shows how to implement process migration and checkpoint/restart\
    \ on the cluster. Section 5 provides an evaluation of the ghost mechanism in the\
    \ framework of its use for checkpoint/restart. Finally, Section 6 concludes.\n\
    \n## 2 Background\n\nThe Linux kernel provides some simple interfaces to manage\
    \ processes on a single machine. Unfortunately, there is no interface to extract\
    \ a process from the system to create an \"image\" of the process which is independent\
    \ of the local\n\n To have a convenient process virtualization, we need a service\
    \ to extract any process and a simple interface to manage processes. The mechanisms\
    \ of process management should not be associated with the process. for migration\
    \ the process is extracted and then transferred through the network to a node,\
    \ whereas checkpoint is saved on a stable device. Therefore, the interface of\
    \ process virtualization should provide a simple implementation of mechanisms\
    \ for global process management. The capability is also important to developing\
    \ mechanism of global management adapted to hardware. For example, with shared\
    \ resource access, process migration can be performed on a network technology\
    \ that uses specific programming. Section 3.1 describes the service of process\
    \ virtualization, and Section 3.2 presents interfaces to virtualization and define\
    \ access to resources.\n\n## 3 The Ghost Concept for Process Virtualization\n\n\
    In a system, a process is represented by two kinds of information: process information\
    \ that is available in the kernel (e.g. open files, memory segments, signaling)\
    \ and process state which is available in the operating system data structures.\
    \ The extraction of register values is more difficult. With most systems, these\
    \ values are only available in priority systems. For example, in Linux, register\
    \ values are only available in return during kernel execution, such as interceptions.\
    \ Therefore, to create a ghost process in the system has to be modified so that\
    \ register values are available. It is also able to state activation of the process\
    \ at any time, even if the process is not active (not running on processor). Such\
    \ is very similar to the signal event. We have created a new state to the signal\
    \ state (see Figure 1). This state is accessible after the treatment of pending\
    \ signals, less information (a priori signal) needs to be marked. The creation\
    \ of this state creates a kernel modification about time. This modification allows\
    \ to make a process wait for an extraction (which very similar to the process\
    \ marked as having a ghost signal). This state is active during the execution\
    \ of systems, such as interceptions. Therefore, register values are available\
    \ and process can be activated at any time. \n\nThe ghost process mechanism allows\
    \ extraction of all information. The extraction of the process's address and state\
    \ is not an issue if the mechanism can access the source.\n\n### 3.1 Implementation\
    \ of Process Virtualization\n\nA list of clusters allows deployment of processes.\
    \ Tools like rsh allow users to naturally deploy because there is no choice for\
    \ global management mechanism. Other systems like PBS[5], BATCH[6] or resource\
    \ managers (e.g. PVM) provide automatic and efficient deployment. With such systems,\
    \ users longer need to manually deploy. Some clusters, like Epoint[1], or BL[3]\
    \ offer checkpoint mechanisms. With all these systems, a checkpoint mechanism\
    \ is implemented by the extraction of process information which is stored on a\
    \ source. Depending on checkpoint mechanism, different ways to processes are created:\
    \ (i) memory for efficiency or (ii) disks for storage usage. With these images,\
    \ a process can be restarted a clone process. Other systems allow to dynamically\
    \ migrate processes between cluster nodes. A lot of academic studies have been\
    \ made to implement process migration[8]. Two major approach: (i) checkpoint-restart\
    \ and (ii) process migration identifier and execution.\n\n### 3.2.2 Interfaces\
    \ for Resource Access Definition\n\nThe system programmer needs to give a ghost\
    \ process object by an exportation and a new process is created(forking) and installed\
    \ in the local system (the process is active and can run in the system). Therefore,\
    \ after the process importation is ready to run on the local node, it is possible\
    \ to execute any process in a cluster. indented to the source.\n\nThe mechanisms\
    \ for ghost process management are always associated to a resource object representing\
    \ the device used to back the ghost process. Furthermore, process migration is\
    \ a combination of resource object representing the network management mechanism\
    \ and resource export/checkpoint is the result of the combination of resource\
    \ object associated to a stable storage device (e.g. hard drive) with these mechanisms.\
    \ Therefore, an interface is needed to specify the resource object with a specific\
    \ definition allows for global process management, but is also used to adapt the\
    \ mechanisms to new technologies which provide own network interface. We say a\
    \ resource object is placed in the mechanism of process virtualization.\n\nThe\
    \ interface between access objects and the mechanism of process virtualization\
    \ is based on read/write methods. The method is automatically called during the\
    \ process exportation, whereas the read method is called during the importation.\n\
    \nSome access objects need extra parameters. For example, to access the network,\
    \ we need to know the node address before starting the data. The parameters are\
    \ defined during the initialization step of the access object. For example, if\
    \ we specify memory address is accessed in a ghost process. Then the ghost process\
    \ importation reads ghost process information from the memory. A statistic the\
    \ current implementation allows to read from and write to the object, read from\
    \ source and write to send. Each access object is identified by a unique identifier\
    \ wide. To plug a resource object in a ghost process, a simple interface is available\
    \ for each resource object (see Listing 1) to listen to each resource object,\
    \ and the system programmer must update an internal function of the ghost process\
    \ mechanism. This function also sets function to initialize/finalize the resource\
    \ access, to read/write in the source.\n\n### 3.2.1 Virtualization Interfaces\n\
    \nTo use the process of virtualization, an API is available to deal with ghost\
    \ processes. This API is based on concepts of process exportation and process\
    \ importation. the process exportation (see Listing 1) allows to virtualize a\
    \ process from the local system and provides an object representing the ghost\
    \ process. This object has the complete\n\n# Listing 1. Ghost Process API\n\n\
    ```\n// Export process / /\nint export_process(ghost process );\n// Import data\
    \ to process / /\nint import_process(ghost );\n// Plug a resource object to a\
    \ ghost process /\nint plug_resource_object(class_id, ghost );\n```\n\nThe process\
    \ importation (see Listing 1) allows to transfer the ghost process in the local\
    \ memory (if the ghost process\n\nA set of interface has been defined for file\
    \ access,\n"
  mdcn: "\n\n# 幽进程：在 Linux 集群中实现进程复制、迁移和检查点/重启的理论基础\n\nGeoffroy Vallée\nORNL/INRIA/EDF\n\
    计算机科学与数学部门\n橡树岭国家实验室\nOak Ridge, TN 38731, USA\nvalleeg@ornl.gov\nFax: 865-576-5491\n\
    \nRenaud Lottiaux Darg Margery\nChristine Morin\nIRISA/INRIA, PARIS 项目组\nCampus\
    \ Universitaire de Beaulieu\n35042 Renes, Cedex, France\n[rlottiau, dmargery,\
    \ cmorin]@irisa.fr\nFax: +33 2 99 84 71 71\n\nJean-Yves Berthou\nEDF R&D\n1 avenue\
    \ de Général de Gaulle\nBP408, 92141 Clermont, France\njyberthou@edf.com\nFax:\
    \ +33 1 47 65 34 99\n\n## 摘要\n\n进程管理机制（进程复制、迁移和检查点/重启）对于集群系统的高性能和高可用性非常有用。\n\n\
    单映像（single image approach）方法旨在为检查点进程、进程迁移和进程复制提供一种全局进程管理服务机制。在此背景下，虚拟化的通用机制非常困难，而传统的操作系统并没有提供此类机制。\n\
    \n本文提出了一种用于虚拟化“幽进程”（ghost process）的内核服务，并扩展了 Linux 内核。幽进程机制已在基于 Linux 的 Kerrighed\
    \ 系统映像中得以实现。\n\n**关键词：** Linux 集群、分布式操作系统、系统映像、进程虚拟化。\n\n为了简化集群的使用、提高易用性，并利用集群的分布式资源，进程管理机制在这方面非常有用。进程复制允许在集群节点上部署并行执行的进程。虽然传统的检查点机制可以扩展集群并在执行特定负载期间利用集群资源，但在创建检查点时，可能无法正确地将检查点放置在集群节点上。动态负载均衡策略对于保持集群平衡至关重要。这些策略通过高效的进程管理机制实现，将进程从一个节点移动到另一个节点。\n\
    \n## 1 引言\n\n如今，集群被越来越广泛用于执行数值应用。需要相应的机制来实现进程迁移。首先，进程迁移可以通过检查点/重启机制实现：进程在共享文件系统（如使用\
    \ NFS）上创建检查点，并从节点上的文件系统恢复。第二种方法类似于 Condor：为了效率，直接通过网络迁移进程。在这样的系统中，进程从一个节点中提取，直接发送到另一个节点，并创建一个新进程。我们针对这种方法使用\
    \ OpenSSI[3] 或 Most[1]。\n\n目前，没有哪个系统能以高效的方式提供全套机制，Genesis[4] 基于微内核，且没有提供一个完整的单元，如：\n\
    \n为了效率和易用性，对集群中全局进程管理（进程复制、迁移、检查点/重启）所需的机制进行内核级实现是非常理想的。Linux 内核没有为进程虚拟化提供系统服务和接口。\n\
    \n在本文中，我们介绍了基于 Linux 内核的进程虚拟化幽进程机制，它提供了一个用于虚拟化进程的服务和 API。该机制允许进程管理机制的实现。例如，我们展示了集群规模的进程迁移实现：一种新的迁移机制以及进程检查点/重启机制。\n\
    \n幽进程机制已基于 Linux 的 KIRRIGED 系统映像 (SSI) 集群操作系统[9] 中实现。它已被用于在 Kirriged 中高效实现进程检查点/重启。结合相关的检查点/重启机制和其他全局资源管理机制（例如全局信号管理机制，这些不在本文的讨论范围内），它实现了进程的全局管理。\n\
    \n本文的结构组织如下：第 2 节涉及集群全局进程管理。第 3 节描述了我们提出的进程虚拟化进程概念。第 4 节展示了如何在集群上实现进程迁移和检查点/重启。第\
    \ 5 节提供了幽机制在检查点/重启应用框架下的评估。最后，第 6 节给出结论。\n\n## 2 背景\n\nLinux 内核提供了一些简单的接口来管理单机上的进程。遗憾的是，没有接口可以从系统中提取进程以创建一个独立于本地环境的进程的“映像”。\n\
    \n为了实现方便的进程虚拟化，我们需要一个能够提取任何进程的服务以及一个管理进程的简单接口。进程管理机制不应与进程本身关联。对于迁移，进程被提取并通过网络传输到节点，而检查点则保存在稳定设备上。因此，进程虚拟化接口应该为全局进程管理机制提供一种简单的实现。这种能力对于开发适应硬件的全局管理机制也同样重要。例如，通过共享资源访问，进程迁移可以在使用特定编程的网络技术上进行。第\
    \ 3.1 节描述了进程虚拟化服务，第 3.2 节介绍了虚拟化接口并定义了资源访问。\n\n## 3 用于进程虚拟化的“幽”概念\n\n在系统中，进程由两类信息表示：内核中可用的进程信息（如打开的文件、内存段、信号）以及操作系统数据结构中可用的进程状态。寄存器值的提取更为困难。在大多数系统中，这些值仅在优先级系统中才可用。例如，在\
    \ Linux 中，寄存器值仅在内核执行期间（如拦截期间）返回时可用。因此，为了在系统中创建幽进程，必须修改系统以使寄存器值可用。它还能够在任何时间描述进程的激活状态，即使进程没有运行。这种机制能够描述进程的激活状态，即使进程没有运行（注：原文此处似乎有重复，翻译已根据逻辑顺顺）*。因此，进程虚拟化接口应该提供一种全局进程管理机制的简单实现。第\
    \ 3.1 节描述了进程虚拟化服务，第 3.2 节展示了虚拟化接口并定义了资源访问。\n\n*注：原文此处存在表述重复，翻译时保持了语意连贯。* \n\n\
    在系统中，进程由两类信息表示：内核中可用的进程信息（如打开的文件、内存段、信号）以及操作系统数据结构中可用的进程状态。寄存器值的提取更为困难。在大多数系统中，这些值仅在优先级系统中才可用。例如，在\
    \ Linux 中，寄存器值仅在内核执行期间（如拦截期间）返回时可用。因此，为了在系统中创建幽进程，必须修改系统以使寄存器值可用。它还能够在任何时间描述进程的激活状态，即使进程没有运行。\n\
