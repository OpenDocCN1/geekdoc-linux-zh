    In this paper we present the ghost process mechanism for process virtualization
    based on the Linux kernel, which provides a service and an API to virtualize processes.
    This mechanism allows the implementation of mechanisms for process management.
    As example, we present the implementation of process migration at the cluster
    scale: a new migration and a mechanism of process checkpoint/restart.


    The ghost process mechanism has been implemented in the KIRRIGED System Image
    (SSI) cluster operating[9], based on Linux. It has been used to efficiently implement
    process checkpoint/restart in Kirriged. With associated checkpoint/restart mechanisms
    and other global resource management mechanisms (e.g. global sign management mechanisms)
    which are out of scope of this paper, it allows global management of processes.


    The structure of this paper is organized as follows: Section 2 relates to global
    process management in clusters. Section 3 describes the process concept we propose
    for process virtualization. Section 4 shows how to implement process migration
    and checkpoint/restart on the cluster. Section 5 provides an evaluation of the
    ghost mechanism in the framework of its use for checkpoint/restart. Finally, Section
    6 concludes.


