    # ## 3.3 Summary


    The ghost process mechanism is a mechanism for process virtualization which allows
    the implementation, an easy way, of global process management such as duplication,
    migration and checkpoint/restart.


    To use the ghost process mechanism, the next section details the implementation
    of two global process management mechanisms: (i) process migration and (ii) process
    checkpoint/restart.'
