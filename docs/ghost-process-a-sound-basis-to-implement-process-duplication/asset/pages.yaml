    # 3 The Ghost Concept for Process Virtualization


    The Linux kernel provides some simple interfaces to manage processes on a single
    machine. Unfortunately, there is no interface to extract a process from the system
    to create an "image" of the process which is independent of the local


    To have a convenient process virtualization, we need a service to extract any
    process and a simple interface to manage extracted processes. The mechanisms of
    process management should not be associated with the process. for migration the
    process is extracted and then transferred through the network to a node, whereas
    the checkpoint is saved on a stable device. Therefore, the interface of process
    virtualization should provide the definition of the process used to manipulate
    processes. This definition is very important to guarantee a simple implementation
    of mechanisms for global process management. The capability is also important
    to developing mechanism of global process management adapted to hardware. For
    example, with shared resource access, process migration can be performed on a
    network technology that uses a specific programming.


    Section 3.1 describes the service of process virtualization, and Section 3.2 presents
    interfaces to virtualization and define access to resources to use with the virtualization
    mechanism.


