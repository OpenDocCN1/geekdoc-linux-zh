  md: '# 102 Part II: Got Net?


    You need to figure out how your wireless NIC (or network adapter) will connect
    to your network. Wireless NICs can connect to a LAN in two ways:


    +   - Adapter-to-adapter: This type, referred to as an ad hoc connection, is useful
    if you have two or more computers that you want to talk to and form their own,
    private network.

    - Adapter-to-wireless hub: This type, called infrastructure, provides a single
    entrance (an access point) to a LAN. An access point allows one or more computers
    to be connected to a network. unlike an an ad hoc network, the individual computers
    can connect to any access point that allows them to.


    The wireless-configuration instructions we provide work with either infrastructure
    or ad hoc connection methods. Your wireless NIC can connect to either the access
    point or other computers (Linux and Windows) as long as you correctly configure
    your Network ID (ESSID) and encryption key.


    # Choosing between ad hoc and infrastructure


    Using Ad Hoc mode provides two advantages:


    +   - Lower costs: You don''t have to purchase an access point; an access point
    starts at around $70. Computers using wireless NICs running in Ad Hoc mode communicate
    directly with each other.

    - Simpler configuration for Linux users: Older access point devices could be configured
    using only Windows-based software — the simple network management protocol (SNMP),
    to be exact. You can physically connect a Windows computer to the access point
    via wired Ethernet network and then use the software supplied with the device.
    That was difficult if you didn''t have Windows-based computers. Newer access points
    are beginning to use HTML-based configuration systems, so you can use Mozilla
    to configure these newer devices.


    Ad hoc networks eliminate the need to configure any access point. You only need
    to configure the wireless NIC in each computer on your network. You can use the
    Red Hat Network Configuration Utility to configure a wireless NIC, which simplifies
    the process. Each NIC must have the same Network ID and encryption key.


    Ad hoc networks can also provide a bit more security because they connect to other
    networks — and the Internet — through a network router. Access points work as
    network bridges. Routers examine IP addresses and decide where to direct network
    traffic from one network to another. Bridges automatically pass on all traffic.
    Ad hoc networks can be configured to more


    ![](img/cc58a1e8691061866010ce216f881372_125_0.png)'
