  md: '# Chapter 10


    # Gnowing More Applications


    +   In This Chapter

    - Introducing Nautilus, the GNOME file and integration manager

    - Introducing the Ximian Evolution e-mail and personal organizer

    - Introducing more useful GNOME applications


    Many applications help make your Red Hat Linux computer useful. In this chapter,
    you find out how to use several of the most useful applications that come packaged
    with Red Hat Linux. The first one is the Nautilus file manager, an integral part
    of the GNOME desktop system. The second application is the new e-mail and organizer
    application named Evolution. We also introduce several other useful applications.


    Chapter 11 describes how to use the Mozilla Web browser. Chapter 13 introduces
    the OpenOffice desktop productivity suite, which gives you Microsoft Word-compatible
    word processing, a spreadsheet program, a Power Point-compatible presentation
    program, and other functions. These programs, combined with Evolution, give you
    all the functions you need to make your Red Hat Linux computer a fully functioning
    workstation.


    # Navigating with the Nautilus File/Internet Integration Manager


    Being the boss doesn''t make you a bad person. It''s just a job. Right? Well,
    that little GNOME guy is a good worker and doesn''t get paid much. Just press
    a key, click a button, and you can boss him around like any worthy pointy-headed
    Dilbert manager. GNOME even comes with its own file and integration manager that
    saves work and times for so long lunches.


    Nautilus is the GNOME file and Internet navigator system. Nautilus follows the
    tradition of all good file managers by graphically displaying the files and directories
    on your computer. You can copy, move, delete, and execute files by pointing and
    clicking; creating directories and viewing file details are a'
