    # Manually Shifting with RPM


    The first part of this chapter concentrates on using the Red Hat Package Manager
    to install and remove packages. But you also have the option using the rpm command.
    It provides additional features for installation and removal functions. You can
    use rpm to install, update, remove, and query packages.


    This section provides several examples of how to use the manual rpm command.'
