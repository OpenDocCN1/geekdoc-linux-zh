  md: '# In this part...


    After you have created your Red Hat Linux workstation, it''s time to get to work.
    The chapters in this part shows three different ways to connect to the Internet:
    via the traditional, slow dial-up (analog) modem; with a fast broadband DSL or
    cable modem; or by connecting your Red Hat computer to an existing Local Area
    Network (LAN) that itself is connected to the Internet.


    Chapter 5 concentrates on telephone-based modems. Modems are much like an old,
    reliable pickup truck that may not be the fastest way of getting somewhere but
    still gets you there. In fact, these modems provide the simplest, most economical
    and effective Internet connection available.


    Chapter 6 introduces broadband Internet connections. Telephone, cable, and independent
    companies now provide broadband service to many communities. For not altogether
    unreasonable prices, you can get high-speed, always-on service.


    Many people have access to existing computer local networks (called LANs) at work,
    school, and home. Chapter 7 shows how to connect your computer to a LAN, and,
    if your LAN has an Internet connection, you can find out how to configure your
    workstation to use it.


    Your computer becomes vulnerable after you connect to the Internet, especially
    if you use a service, such as DSL, that is constantly connected. It''s like the
    difference between living on a quiet versus a busy street: You''re more vulnerable
    on the busy street. That''s why we show you in Chapter 8 how to build a firewall.'
