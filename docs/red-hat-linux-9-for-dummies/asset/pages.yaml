    # Understanding the Security Process


    The best way to look at security is as a process. The more you think about it
    and the safer are you. You should use the security systems described in this chapter
    as the foundation for your security process. However, you should continue to build
    your security process to meet your computer system and network''s need.


    This section outlines some additional building blocks you might consider adding
    to your process:


    +   - Making backups: Backups are part of the security process? Yes! Backups are
    essential security tool in the sense that you can never eliminate the possibility
    of getting hacked. If and when your security is breached, you lose all sorts of
    information and configurations. For example, your computer may be completely erased
    or worse, you may not know what files are good and bad. You must ensure your ability
    to recover from such catastrophes.


