  md: '# In this part...


    You have finished your initial journey. Red Hat Linux up and running, and you
    have mastered the basics of connecting to the Internet and private networks. You
    have looked at the map enough to know where you are. Now, the big question is
    “What do I do with it?”


    One thing you can do with your computer is to put your feet and wait for the screen
    saver to kick in. You can also confide to all your friends at the next party you
