  md: '# Appendix C: Becoming a Suit: Managing the Red Hat Linux System


    The Linux distribution on the companion CD-ROMs features block special files for
    each IDE disk (hda–hdd) with nine partitions each (1–9). Linux also has special
    files for seven SCSI hard drives (sda–sdg), which can have eight partitions each
    (1–8). In addition, Linux has a block special file for a SCSI CD-ROM (scd) with
    eight partitions (0–7). If you have lots of drives, or if your Linux distribution
    doesn''t have enough block special files for your drive, you may have to create
    one or more additional special files for the device, like:


    ```

    cd /dev; makedev sdg

    ```


    This command creates the device driver (a block special file) for SCSI drive 7.
    Note that the letters and drive numbers correspond: a is for the first disk, b
    is for the second, and so on.


    If you add a SCSI drive with a lower ID number than the one you already have,
    the new disk drive takes on that number. Suppose that you have SCSI drives with
    hardware ID numbers of 0, 2, and 3. Linux gives these drives the names sda, sdb,
    and sdc, respectively. You make your partitions and your file systems and create
    entries in /etc/fstab to show where they are mounted. Then, you get a new disk
    drive and set the hardware ID number to 1. When you reboot, the new disk drive
    gets the sdb designation and the disk drives with ID numbers of 2 and 3 are renamed
    to sdc and sdd, respectively. You must now at least change your /etc/fstab table.
    For this reason, we recommend that you add SCSI disk drives to your system, starting
    with ID0 and working up the number chain, with no gaps in the numbering.


    ![](img/cc58a1e8691061866010ce216f881372_354_0.png)


    # Partitioning a drive


    You can use fdisk to partition the drive after you''ve added it to your computer.
    You need not to partition a disk before formatting it (adding a file system).
    For example, if you want to invoke fdisk for partitioning the first IDE drive,
    you type this command:


    ```

    fdisk /dev/hda

    ```


    Using fdisk isn''t too difficult; you can partition the drive fairly easily. We
    don''t discuss this in this book, but you can find out more information at www.redhat.com/docs/manuals/linux/RHL-7.3-Manual/install-guide/


    # Making the file system


    Every drive is simply an empty space with a beginning and an end. Unless the partition
    is being used for swap space, you have to put some type of file system on the
    partition before it can become useful. The mkfs (for'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# 332 Part VI: Appendixes


    make file system) command is used to create the file system on the partition.

    Normaly, the file system is a native Linux file system, which, at this time, is
    called ext3. The Linux version of mkfs has been nicely streamlined and requires
    hardly any input.


    To create a file system on the disk drive partition sdal, for example, type this
    command:


    ```

    mkfs -t ext3 /dev/sda1

    ```


    Or, for an IDE drive, type this command:


    ```

    mkfs -t ext3 /dev/sda1

    ```


    If you want to create an MS-DOS file system on the drive partition, you use this
    command:


    ```

    mkfs -t msdos /dev/sda2

    ```


    ![](img/cc58a1e8691061866010ce216f881372_355_0.png)


    Be careful to type these commands precisely. You can easily format the entire
    disk if you make a mistake. For example, typing mkfs -t ext /dev/sda forats the
    whole disk. The difference is that sda2 specifies a single partition, whereas
    sda means the whole disk.


    You can continue to execute mkfs commands to create file systems for every partition
    on your new drive. Or, you can leave partitions without file systems (for future
    use), as long as you remember to perform the mkfs-command on them before trying
    to attach them to your file system, by using the mount command or the /etc/fstab
    table.


    Congratulations! Your drive has been physically added to your system and partitioned,
    and you''ve added file systems to it. Now the drive is ready to join the rest
    of the file system; simply use either the mount command or the /etc/fstab file,
    which we describe earlier in this chapter.'
  merge: -1
