  md: '# Chapter 6: Broadband Rocks!


    # 6. Configure the DSL modem''s internal (private) network interface.


    The DSL modem must be able to communicate with a Red Hat Linux computer over an
    Ethernet connection. You must configure the DSL modem so that it uses the same
    network parameters as your computer.


    # 7. Configure the modem''s network address translation (NAT) settings.


    The Internet was designed to send — route — information as quickly as possible
    to its destination. Internet Protocol (IP) addresses are used to designate where
    the information is coming from and where it''s going. IP addresses can be routable
    or nonroutable. Nonroutable addresses can be reused; you can use the same nonroutable
    addresses that your neighbor uses without interfering with one another.


    NAT is used to convert nonroutable IP addresses into routable ones, which is useful
    when connecting your private network to the Internet by translating your internal
    IP addresses into one of your ISP''s routable IP addresses. You must configure
    your DSL modem to convert your computer''s private (for example, 192.168.1.1)
    and nonroutable address into an address assigned to your DSL connection by your
    ISP.


    # 8. Save the settings tovolatile memory and reboot.


    You need to save your DSL modem''s settings after you have them working. You do
    not want to enter the configuration every time you turn on the modem.


    # Finding a DSL provider


    You must obtain both DSL and ISP services to make your broadband connection. Some
    companies — notably, the regional Bell telephone companies — can provide both
    services. However, in our case, we preferred the ISP that was aligned with the
    DSL provider. We were fortunate enough to retain our existing ISP when we purchased
    our DSL service.


    The DSL market is fluid. Analyze the DSL providers in your area carefully choosing
    one, and remember that longevity is as important as a low price. Regional Bells
    are more likely to provide long-term service than many of their competitors.


    An advantage of DSL service is that you often don''t have to sign a service contract;
    you can easily switch providers if you''re not satisfied with the service.


    Usually, you have to select an ISP after you choose a DSL provider. DSL providers
    either provide their own ISP or allow you to select from several independent ones
    (the DSL provider makes the arrangements and works directly with the third-party
    ISP).'
