- img_proc: true
  md: '# 308 Part VI: Appendixes


    # # Storing files


    We assume that you know that a file is a collection of information identified
    by a filename and that Linux can store multiple files in directories as long as
    the files have different names. Linux stores files with the same name in different
    directories.


    Each directory may contain only one file with the same name.


    ![](img/cc58a1e8691061866010ce216f881372_331_0.png)


    Wonderful or not, Linux filenames can be as long as 256 characters. The filenames
    can contain uppercase and lowercase letters (also known as mixed case), and special
    characters, such as the underscore (_), the dot (.), and the hyphen (-). Because
    filenames can be composed of mixed-case names, and because each name is distinct,
    we call these names case sensitive. For example, the names FILENAME, FiLeNaMe
    are unique filenames of different files, but they''re the same filename.


    Although filenames technically can contain wildcard characters, such as the asterisk
    (*) and the question mark (?), using them isn''t a good idea. Various command
    interpreters, or shells, use wildcards to match several filenames at once. If
    your filenames contain wildcard characters, you have trouble specifying only those
    files. We recommend that you create filenames that don''t contain spaces or other
    characters that have meaning to shells. In this way, Linux filenames are different
    from DOS and Windows filenames.


    # # Sorting by file types


    Linux files can contain all sorts of information. In fact, Linux sees as a file
    device (disks, display, or keyboard, for example) for a network interface. These
    five categories of files become the most familiar to you:


    +   - User data files: Contain information you create. Use data files, sometimes
    known as flat files, usually contain the simplest data, consisting of plain text
    and numbers. More complex use user data files, such as graphics or spreadsheet
    files, must be interpreted and used by special programs. These files are mostly
    illegible if you look at them with a text editor because the contents of these
    files aren''t ASCII text. Changing these files generally affects only the user
    who owns the files.


    +   - System files: Are used by the system to keep track of users of the system,
    logins, and passwords, for example. As system administrator, you may be required
    to view or edit these files. As a regular user, you don''t need to be concerned
    with system data files except, perhaps, the ones you use for your own, private
    startup files.


    +   - Directory files: Hold the names of files — and other directories — that
    belong to them. These files and directories are called children. Directories'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# Appendix B: Filing Your Life Away


    in Linux (Unix) are just another type of file. If you''re in a directory,

    t directory above you is called the *parent*. Isn''t that homey?


    When you list files with the `ls -l` command, it displays a list of files and

    directories. Directories begin with the letter `d` for example:


    ```

    ```

    [lidia@cancum lidia] ls -l

    drwxr-xr-x 5 lidia 1024 Feb 3 2002 Desktop

    drw------ 2 lidia 1024 Feb 10 2002 nsmail

    ```

    ```


    +   **Special files:** Represent either hardware devices (such as a disk drive,

    tape drive, or keyboard) or some type of placeholder that the operating

    system uses. The `/dev` directory holds many of these special files. You

    can see this by running this command at a prompt:

    ls -l /dev


    +   **Executable files:** Contain instructions (usually *programs* or shell

    *scripts*) for your computer. When you type the name of one of these files,

    You''re telling the operating system to *execute* the instructions. Some\executable
    files look like gibberish, and others look like long lists of

    computer commands. Many of these executable files are located in `/bin,

    `/usr/bin`, `/sbin`, and `/usr/sbin`.


    # Understanding files and directories


    If you live in the Windows world, you can think of a Linux file system as

    huge file folder that contains files and other folder directories, which in turn
    contain

    files and other folder directories, which in turn contain files and — well, you
    get the

    point. In fact, the Linux file system is generally organized in this way. One
    big

    directory contains files and other directories, and all the other directories
    in

    turn contain files and directories.


    **Directories and subdirectories**

    A directory, or *nested*, in another directory is a subdirectory. For

    example, the directory named `/mother` may contain a subdirectory named

    `/child`. The relationship is referred to as parent and child.

    The full name of the subdirectory is `/mother/child`, which would make a

    good place to keep a file named `/mother/child/reunion` that contains

    information about a family reunion.


    **The root directory**


    In the tree directory structure of Linux, DOS, and Unix, the big directory

    the bottom of the tree is the *root*. The root directory is the parent of

    all directories (the poor guy must be exhausted) and is represented by

    single `/` symbol (pronounced “slash”). From the root directory, the whole

    directory structure grows like a tree, with directories and subdirectories

    branching off like limbs.'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# 310 Part VI: Appendixices


    If you could turn the tree so that the trunk is in the air and the branches are
    toward the ground, you would have an inverted tree — which is how the Linux file
    system is normally drawn and represented (with the root at the top). If we were
    talking about Mother Nature, you would soon have a dead tree; the subject is computer
    technology, however, you would have some things that looks like an ever-growing,
    upside-down tree.


    ![](img/cc58a1e8691061866010ce216f881372_333_0.png)


    # What''s in a name?


    You name directories in the same way as you name files, following the same rules.
    Almost the only way you can tell whether a name is a filename or a directory name
    is the way the slash character (/) is used to show directories nested in other
    directories. For example, `usr/local` means that `local` is in `usr` directory.
    You know that `usr` is a directory because the trailing slash character tells
    you so; however, you don''t know `local` is a file or directory.


    ![](img/cc58a1e8691061866010ce216f881372_333_1.png)


    If you issue the -f option, Linux lists directories with a slash character at
    the end, as `local/`, so you know that `local` is a directory.


    The simplest way to tell whether the slash character indicates the root directory
    or separate directories, or directories and files, is to see whatever appears
    before the slash character in the directory path specification. If nothing appears
    before the slash, you have the root directory. For example, you know that `/usr`
    is a subdirectory or a file in the root directory because it has a single slash
    character in front of it.


    # Home again


    Linux systems have a directory named /home, which contains the user''s home directory,
    where she can


    +   * Store files

    * Create more subdirectories

    * Move, delete, and modify subdirectories and files


    Linux system files in addition to files belonging to other users are never in
    the user''s /home directory. Linux decides where the /home directory is placed,
    and that location can be changed only by a superuser (root), and not by general
    users. Linux is dictatorial because it has to maintain order and keep a handle
    on security.


    ![](img/cc58a1e8691061866010ce216f881372_333_2.png)


    Your /home directory isn''t safe from prying eyes. Be sure to maintain your privacy
    by locking your directory (We tell you how in the "Owning Files and Granting Permissions"
    section, later in this appendix). However, anyone who logs into your system as
    root can see what''s in your /home directory, even if you lock it up.'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# Moving Around the File System with pwd and cd


    You can navigate the Linux file system without a map or GPS. All you need to know
    are two commands: pwd and cd.(You run these commands from the command line.) However,
    you also need to know where to start; hence, the usefulness of the next section.


    # Figuring out where you are


    Log in to your Red Hat Linux computer and open a GNOME Terminal Emulation Program.
    In this case, you log in as the example user lidia. To find out where you are
    in the Linux file system, simply type pwd at the command prompt.


    ```

    [lidia@cancun lidia]$pwd

    ```


    You receive this response:


    ```

    /home/lidia

    [lidia@cancun lidia]$

    ```


    This response indicates that you''re logged in as lidia and are in the /home/lidia
    directory. Unless your alter ego is out there, you should be logged in as yourself
    and be in the /home/yourself directory where yourself is your login name.


    The pwd command stands for print working directory. Your working directory is
    the default directory where Linux commands perform their actions; the working
    directory is where you are in the file system when you type a command. When you
    type the ls -l command, for example, Linux shows you the files in your working
    directory. Any files on your part occur in your working directory unless you are
    root. For security reasons we don''t get into here, the root user is not configured
    by default to be able to work on the current working directory. You can change
    this setting, but the root user generally must explicitly specify the working
    directory. For example, if you are root and in the /etc directory and you want
    to indicate the hosts file, you must type cat /hosts rather than just cat hosts.


    Type this command:


    ```

    ls -la

    ```'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# 312 Part VI: Appendixes


    You see only the files in your working directory. If you want to specify a file
    that isn''t in your working directory, you have to specify the name of the directory
    that contains the file in addition to the name of the file. For example, the following
    command lists the passwd file in the /etc directory:


    ```

    ls -la /etc/passwd

    ```


    # Specifying the directory path


    If the file you want to read is in a subdirectory of the directory you''re in,
    you can reach the file by typing a relative filename. Relative filenames specify
    the location of files relative to where you are.


    In addition to what we discuss earlier in this appendix about specifying directory
    paths, you need to know these three rules:


    +   - One dot (.) always stands for your current directory.

    - Two dots (..) specify the parent directory of the directory you''re in.

    - All paths that include (.) or (..) are relative paths.


    ![](img/cc58a1e8691061866010ce216f881372_335_0.png)


    You can see these files by using the -a option of the ls(1) command. Without the
    -a option, the ls(1) command doesn''t bother to list the . or .. files, or any
    filename beginning with a period. This may seem strange, but if you''re new to
    Unix think that that the creators of Unix thought that having some files that
    are normally hidden keeps the directory structure cleaner. Therefore, filenames
    are always present (., and .. and special-purpose files are hidden. The types
    of files that should be hidden are those you normally doesn''t need to see in
    every list of the directory structure (files used to tailor applications to the
    user''s preferences, for example).


    Specify a pathname relative to where you are; for example:


    ```

    [lidia@cancun lidia]$pwd

    /home/lidia

    [lidia@cancun lidia]$ ls -la ../etc/passwd

    ```


    The last line indicates that to find the passwd file, you move up two directory
    levels (../) and then down to /etc.


    If you want to see the login accounts on your system, you can issue this command
    from your home directory:


