  md: '# 216 Part IV: Revenge of the Nerds


    Linux uses the term daemon when referring to a process that runs continually in
    order to provide a service. The Apache daemon is named httpd, which is short for
    HyperText Transport Protocol Daemon. The HyperText Transport Protocol (HTTP) is
    the system used to coordinate the transfer of Web pages between the server and
    client (for example, the Mozilla browser). HTTP is the common language that both
    sides speak.


    +   4. Start your Mozilla Web browser and enter localhost in the URL window. Your
    new Web server is displayed, as shown in Figure 15-1.


    +   5. If you want your Web server to start automatically every time you boot
    your computer, use this command in the terminal emulator window:


    ```

    chkconfig --level 35 httpd on

    ```


    The level 35 option configures the Web server to start in either non-graphics
    mode (system level 3) or graphical (system level 5) modes.


    This command creates soft links, which are roughly analogous to a pointer. In
    this case, the soft link s99httpd is run automatically whenever you boot your
    computer.


    Your Web server should be visible on your private network. If your computer isn''t
    connected to a LAN — for example, if it''s a stand-alone machine with a telephone,
    cable, or DSL Internet connection — you can still use your Web server from the
    machine itself. However, keeping your Web server to yourself isn''t much fun.
    The following section describes how to allow access to your Web server from the
    Internet.


    The OpenOffice suite includes an HTML editor you can use to create Web pages.
    It is simple to use and produce great documents. Open any OpenOffice programs
    — Writer or Spreadsheet, for example — and choose File: New: HTML Document. The
    HTML editor window opens, and you can create Web pages.


    # Accessing your Web server through your firewall


    This section describes how to open your firewall to allow access to your Web server.
    Exactly how you allow access depends on whether you are connecting to the Internet
    directly from your Linux computer or through a LAN. The instructions describe
    how to modify your firewall and a DSL Internet connection to allow the Internet
    to view your Web page.'
