  md: '# Chapter 15: Creating Basic Linux Network Services


    Samba was originally designed and coded by Andrew Tridgill, in Australia. Samba
    almost instantly became popular worldwide and became too much for a few people
    to handle. Thus, the Samba project was started in order to take care of the phenomenon.
    You can find more information about Samba at www.samba.org.


    These instructions describe how to dance the — er, install, configure, and use
    — Samba:


    +   1. Log in as root and insert CD1.


    +   2. Open a terminal emulator window and enter these commands:

    ```

    rpm -ivh /mnt/cdrom/RedHat/RPMS/perl-CGI*

    rpm -ivh /mnt/cdrom/RedHat/RPMS/samba-2*

    rpm -ivh /mnt/cdrom/RedHat/RPMS/samba*

    ```


    +   3. Eject CD1.


    +   4. Insert CD2 and install the Samba SWAT package:

    ```

    rpm -ivh /mnt/cdrom/samba-swat*

    ```


    You can use the Red Hat Package Manager, described further in Appendix D, to install
    these packages. However, it''s almost as easy, and less confusing to describe,
    use the manual method.


    The Samba server consists of two daemons: smbd and nmbd. You must start both daemons
    before anyone can access your Samba server.


    +   5. Enter this command to start the daemons:

    ```

    /etc/init.d/smb start

    ```


    You can stop the daemons by substituting the stop option for the start option.
    You can restart the Samba server by using the restart option:

    ```

    /etc/init.d/smb restart

    ```


    +   6. Automate the start of the Samba daemons by creating these soft links with
    the chconfig utility:

    The following command tells Linux to automatically start Samba for level 3 (nongraphical)
    and level 5 (running the graphical X server): Samba is started whether your Linux
    computer starts in graphical or nongraphical mode:


    ```

    ```nchconfig --level 35 smb on

    ```

    ```


    Samba is configured by default to use its own password file. You must create the
    password file using the mksambapasswd.sh script.


    +   7. Use the mksambapasswd.sh script to create the Samba user account and password.'
