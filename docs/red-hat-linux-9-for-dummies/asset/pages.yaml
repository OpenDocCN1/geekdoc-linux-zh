  md: '# # Burning CDs the old-fashioned way


    The `cdrecord` application is a command-line (nongraphical) system that writes
    CDs. Sometimes you may prefer to use this system for its simplicity and reliability.
    These instructions describe the process:


    +   1. Log in as root and insert a CD-R or CD-RW disc into your CD writer.

    2. Start a GNOME Terminal window.

    3. Determine the location of your CD-ROM drive by entering this command:


    ```

    cdrecord --scanbus

    ```


    The output shows information similar to this code:


    ```

    Cdrecord 1.10 (i686-pc-linux-gnu) Copyright (C) 1995-2001

    Jirg Schilling

    Using libsg version ''schily-0.1''

    scfsibus:

    0.0,0  0) IDE-CD      ''R/RW 4x4x24      ''1.04''

    Removable CD-ROM

    0.1,0  1)*

    0,2,0  2)*

    0,3,0  3)*

    ```


    You see this output if you have an IDE/ATAPI CD-ROM drive. SCSI-based systems,
    however, may show up with other values depending on their configuration. You recognize
    SCSI drives by their controller, target, and slice numbers. *Slice numbers correspond
    to the three numbers in the preceding order. For example, if you have a SCSI-based
    CD-ROM drive that''s connected to the third target on the first controller, it
    shows up as: 0,3,0 in the preceding code. (Slices are not used in this configuration
    and are always 0.)* Whatever the numbers are, you simply need to use them in the
    `dev-* parameter described in the next step


    SCSI doesn''t mean it''s a dirty (it''s pronounced ''scuzzy'') interface. This
    acronym stands for *Small Computer System Interface*. Most inexpensive to priced
    computers use an IDE interface to control both the CD-ROM drive and hard drive.
    SCSI interfaces also control hard drives and CD-ROM drives. You find SCSI interfaces
    on high-end computers because they provide higher performance and are more expensive.


    The `cdrecord` utility is designed to interact with a SCSI-based CD-R drive. Red
    Hat installs a kernel module named `ide-scsi` that allows `cdrecord` to interact
    with an IDE-based CD-R drive; most PCs use IDE devices. You may need to install
    the `ide-scsi` module if the `cdrecord --scanbus` command does not show a CD-R
    device. Run the command `modprobe ide-scsi` to insert the module.'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# 4. Use the scisibus values from Step 3 with the cdrecord command

    by entering this command:


    ```

    cdrecord -v speed=n dev=scisibus_values -isosize filename

    ```


    n is the speed of the CD-ROM drive and scisibus_values are the

    virtual SCSI values obtained from Step 3. -isosize specifies that you''re

    recording raw data, and filename is the name of the file that is created.


    For example, if you have a 24X speed ATAPI/IDE CD-ROM drive and want

    to create a CD from the mydir/31jan03.raw file, run this command:


    ```

    cdrecord -v speed=24 dev=0,0,0 -isosize mydir/31jan03.raw

    ```


    The scisibus values from Step 3 — for example 0,0,0,0— are used with

    the dev= parameter. The 0,0,0,0 value is combined with dev= to create

    the dev=0,0,0,0 parameter.


    You need to set your speed according to what your CD-ROM drive can

    handle. You need to obtain the speed value from the documentation that

    came with your recordable CD-ROM drive in order to enter it as part of

    t speed parameter in the cdrecord command. Look for a value like

    4X, 8X, 12X, or 24X. Don''t worry if you can''t find your documentation or

    don''t know the values. If you set the speed too high, your CD is just

    recorded at the lower level.


    ![](img/cc58a1e8691061866010ce216f881372_197_0.png)


    That''s it! Your computer writes the information to CD. Congratulations! You

    have created a new CD.


    The process changes just a little bit if you want to burn music. You don''t

    need to create an ISO image. The following example shows how to create

    audio CD:


    ```

    cdrecord -v speed=32 dev=0,0,0 -audio tom_waits.wav

    ```'
