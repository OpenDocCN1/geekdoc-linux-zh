  md: '# Part III: Linux, Huh! What Is It''s Good For? Absolutely Everything!


    Part III guides you through the glorious particulars of doing something with Red
    Hat Linux. You''re introduced to the GNOME desktop window environment. You''re
    taken through its paces by moving, resizing, hiding and closing windows; using
    the file manager; and much more. Two chapters are devoted to using the Red Hat
    Linux multimedia capabilities, such as listening to CDs and MP3s, as well as to
    rip and record them. The world''s radio stations are now available to you with
    streaming media technology. We describe the full-featured OpenOffice desktop productivity
    suite in detail. You can use OpenOffice with your Red Hat Linux machine to do
    all your writing and other-related functions. You can even write a book with it!
    Finally, you see how to get organized with Red Hat Linux.


    # Part IV: Revenge of the Nerds


    In Part IV, you''re guided through using your Red Hat Linux computer''s network
    capabilities. It''s Nerd City but also fun and useful. We start by building a
    simple network. After the network is up and running, we describe how to build
    network services, such as an Apache Web server, Samba, and a printer server. The
    last two chapters are devoted to exploring the art of network computer security
    and troubleshooting network problems. Insert your pocket protector, strap the
    HP calculator to your hip, retape your glasses, and get ready for Saturday night!


    # Part V: The Part of Tens


    A Dummies book isn''t complete without The Part of Tens, where you can find ten
    all-important resources and answers to the ten most bothersome questions people
    have after installing Red Hat Linux.(The folks at Red Hat Software provided these.)
    We introduce the most important security concerns too.


    # Part VI: Appendixes


    Finally, you get the appendixes. Appendix A describes how to find out the details
    of your computer''s individual pieces of hardware; this information is sometimes
    helpful when you''re installing Red Hat Linux. Appendixes B and C introduces you
    to using and managing the Linux file system. Appendix D shows how to use the Red
    Hat Package Manager (RPM). Appendix finishes by describing what you can find on
    the companion CD-ROMs.'
