  md: '# # Appendix C


    # # Becoming a Suit: Managing the Red Hat Linux File System


    +   **In This Appendix**

    * Mounting and unmounting a file system

    * Rehabilitating corrupted files

    * Increasing disk space with a new drive


    Managing the Linux file system isn''t a complex job, but it''s an important one.
    You have the responsibility of managing the Red Hat Linux file system and ensuring
    that users (even if you''re the only user) have access to secure, uncorrupted
    data. You''re the manager (you, a *suit*) of your file system.


    This chapter introduces you to managing your Linux file system. Consider yourself
    a management trainee. When you''re done reading this chapter, feel free to take
    a nice, long, expensive lunch.


    # # Mounting and Unmounting


    Red Hat Linux, and other Unix-like operating systems, use files in ways that are
    different from MS-DOS, Windows, and Macintosh operating systems. In Linux, *everything*
    is stored as files in predictable locations in the directory structure; Linux
    even stores commands as files. Like other modern operating systems, Linux has
    a tree-structured, hierarchical directory organization called a file system.


    All user-available disk space is combined into a single directory tree. The base
    of this system is the *root directory* (not to be confused with the root user),
    designated with a slash, /. A file system''s contents are made available to Linux
    by using the mounting process. *Mounting* a file system makes Linux aware of the
    files and directories it contains. This process is just like mounting a horse
    — except that no horse is involved.'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# 324 Part VI: Appendixes


    File systems can be mounted or unmounted, which means that file systems can be
    connected to or disconnected from the directory tree. The exception is the root
    file system, which is always mounted on the root directory when the system is
    running and can''t be unmounted. Other file systems may be mounted as needed,
    such as systems connected on another hard drive, a floppy disk, Zip disks, USB
    disks, or a CD-ROM.


    # # Mounting Windows files from a floppy disk


    Mounting provides a good example of the difference between Linux and MS-DOS/Windows.
    If you use a floppy disk or CD with Windows, you just insert it into the drive
    and have immediate access to it. With Linux, you must insert the floppy disk into
    the drive and then explicitly mount it. Sounds complicated? Not really.


    You can mount a Windows disk (hard drive or floppy disk) on your Linux computer.
    You can then transfer files from one operating system to the other. We concentrate
    in this section on describing how to mount a Windows floppy disk. These steps
    show you how to mount this type of disk:


    +   1. Insert a Windows MS-DOS-formatted floppy disk (FAT or FAT32, but not NTFS)
    into the drive.


    +   2. Click the GNOME Menu button and choose System Tools -> Disk Management.
    Enter the root password if requested.


    The User Mount window appears, as shown in Figure C-1.


    ![](img/cc58a1e8691061866010ce216f881372_347_0.png)


    +   3. Select the floppy disk and click the Mount button.


    The floppy disk mounts, usually in only a few seconds.

    You know that the floppy disk has mounted successfully when a floppy disk icon
    is displayed on the left of the screen.'
  merge: -1
