  md: '# Chapter 6


    # Broadband Rocks!


    In This Chapter


    +   - Introducing DSL and cable Internet connections

    - Using cable connections

    - Using DSL connections


    You''re probably familiar with the ubiquitous dial-up Internet connection: hear
    that fax-like connection sound and a little static, and then — presto! whammo!
    — you''re online. If you''re lucky, the entire dial-up process takes about five
    minutes, but it can take longer. And then there''s the fact that Web pages take
    just a little while to build onscreen with a dial-up modem — especially when you
    compare dial-ups with highpeed connections (also called broadband connections).


    The broad in broadband means that wires and cables that connect a modem to the
    Internet have a wide bandwidth; they can handle more data at faster speeds and
    with greater reliability. Plain old telephone service (POTS) was created for transferring
    analog voice data. Needless to say, POTS doesn''t do as well as broadband when
    it comes to the Internet.


    The two most popular broadband connections you can use to access the Internet
    are cable modem (which use your existing cable television lines to transfer data)
    and DSL (which use fancy-fancym digital phone lines). Broadband connections work
    roughly 500 kilobits per second (Kbps) up to several million bits per second (Mbps).
    That''s enough to transfer graphics-rich Web pages in a few seconds; it''s also
    enough to listen to several audio streams or to watch a low-resolution video stream.


    If you''re ready to make the switch to a DSL or cable Internet connection, believe
    us when we tell you that you''ll never go back to a dial-up modem. This chapter
    describes how to obtain and configure a broadband connection.


    We recommend using ISDN, satellite, and mental telepathy Internet connections.
    ISDN is an old technology that is rapidly being replaced by DSL. It is also difficult
    to configure and isn''t much faster than a dial-up modem connection. Satellite
    Internet connections are just being introduced and'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# 84 Part II: Got Net?


    suffer from problems, such as transmission delays (latency), that wreak havoc
    with your communications. Some people say that mental telepathy works great, but
    we don''t think that Intel makes a chip yet. Perhaps satellite systems will improve
    quickly, but until that happens, we recommend using a plain-old dial-up modem
    or, or if you can, DSL or cable modem connections.


    # Introducing DSL and Cable Connections: The Proof Is in the Wiring


    Although today''s telephone network system is modern in many ways, its underinnings
    haven''t fundamentally changed since the early 20th century. The telephone network
    consists of pairs of copper wire that connects homes and businesses with a telephone
    company''s central offices (CO). The phone company use switches in its COs to
    connect you to your destination when you make a call. The switches are designed
    to limit the range of frequencies—called *bandwidth* that a phone can use. The
    bandwidth is roughly 3,000 cycles per second (Hz), enough to recognize a voice
    but not a whole lot. Those limits prevent analog modems from pushing more than
    approximately 56,000 bits per second, or 56 Kbps, through the telephone network.
    (That 56 Kbps speed varies, mostly downward, depending on the condition of the
    copper wires you use.)


    ![](img/cc58a1e8691061866010ce216f881372_107_0.png)


    What does this all mean to you? Improve your modem and the wiring, and you get
    faster Internet access. Two of the most commonly used broadband alternatives are


    +   * Cable Television (CATV): Although CATV companies don''t provide service
    to as many residences and businesses do, their fiber and coaxial cable networks
    can carry much more bandwidth than telephone wires can. CATV networks don''t have
    the 3- to 4-mile limits that DSL has. Typically, you can get Internet cable through
    your CATV company if the company offers it and if the company serves your neighborhood.

    * Digital Subscriber Lines (DSL): Designed to skip the restriction of the traditional
    telephone system by making an end run around the switches, DSL rewires your existing
    telephone setup. Your local phone company can connect your computer to new equipment
    that provides more than ten times the speed a dial-up modem can.


    The main limitation of DSL is that traditional copper wire can carry a high-speed
    connection for only a few miles. Your telephone company can tell you whether it
    can provide you with service.'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# The Cable Modem Option


    Cable companies have invested lots of capital (much more than telephone companies)
    to upgrade their networks in order to gain Internet market share. Their effort
    has paid off for the consumer, and many places in the United States now have access
    to high-speed Internet connections.


    However, you have to consider some downsides:


    +   - Unfortunately, not all cable companies have caught up with 21st century
    technology. Many companies may provide you with TV but not Internet service.

    - Many people don''t live in an area served by cable TV. Internet cable is also
    not a good medium to provide services such as Web page hosting.

    - Most cable companies require you to connect to their ISP. Many people like to
    use a different ISP because it provides better service. Using your own ISP also
    makes it easier to set up your computer (or network) to provide services going
    out to the Internet. Cable companies can''t prevent you from using a different
    local ISP, but they don''t charge you — so you end paying for two services, one
    of which you''re not using.

    - Few companies support Linux. You may get a connection, but you''re on your own
    if you need to troubleshoot problems, even problems that have nothing to do with
    Red Hat Linux but affect your machine.


    If you decide that cable access is the right choice for your Internet access needs,
    here''s an overview of the process for connecting your Red Hat Linux computer
    to the Internet via a cable modem:


    +   1. Do some research and subscribe to an ICP service.


    Locate an Internet cable provider (ICP) — usually your existing cable company
    — and subscribe to the ICP service.


    +   2. Make a hardware commitment.


    Obtain an Internet cable modem through your ICP. Many ICPs provide cable modems
    as part of their service. Otherwise, you can purchase the modem from the ICP or
    a consumer electronics store.


    +   3. Get registered.


    Register the cable modem with your ICP.


    +   4. Set up the cable modem.


    Cable modems have two connectors: a 75-ohm coaxial port and a twisted-pair (RJ-45)
    connector. The coaxial connector is the same'
  merge: -1
  pgno: 108
- img_proc: true
  md: '# 86 Part II: Got Net?


    type that''s used for cable TV. The RJ-45 connector looks like a large telephone
    plug.)


    +   * Connect a coaxial cable from the cable modem''s coaxial port to the cable
    jack on your wall just like you would a TV set.

    * Connect a network cable from the RJ-45 modem port to your Red Hat Linux computer.
    Normal network cables (referred to as category 5 cables) don''t work if they''re
    connected directly from the modem to your computer. You need to use a crossover
    cable if you can directly connect a computer to a cable modem. You can use normal
    category 5 cables if you connect the cable modem and your computer to an Ethernet
    hub or switch.


    +   5. Set up your Internet protocols.


    Configure your computer to use DHCP on the network interface that connects to
    the modem. Restart your computer''s network interface, and you should be good
    to go.


    The following sections take you through the process of finding a cable provider
    and setting up your access.


    # Finding an Internet cable provider


    Finding an Internet cable provider (ICP) is as simple as calling your cable television
    company. Not all cable TV systems carry Internet traffic, but many do.


    ![](img/cc58a1e8691061866010ce216f881372_109_0.png)


    Locating a cable company that provides broadband Internet connections is unfortunately
    quite easy. It''s unfortunate because little competition exists within the cable
    industry. Federal law effectively restricts competition within municipalities
    and creates the environment for monopoly-like companies. The result, of course,
    is that prices remain higher than necessary. Oh, well, at least many cable companies
    are offering Internet connections.


    Your ICP is your default Internet Service Provider (ISP). Most cable companies
    give you one or more e-mail addresses. However, cable companies don''t generally
    provide login accounts like other ISPs do.


    Login accounts are used for launching applications and storing information. They
    aren''t essential, but they''re useful. However, nothing stops you from maintaining
    a regular ISP and using its login account. You then have a high-speed Internet
    connection you can use to log in to any account you have.'
