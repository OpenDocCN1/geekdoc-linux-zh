    # # Building a DNS Server


    Every device connected to the Internet, including your Red Hat Linux computer,
    requires an Internet Protocol (IP) address in order to communicate properly. IP
    addresses are unique numbers and, therefore, difficult for us carbon-based humans
    to remember and use. The domain name system (DNS)'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# Part IV: Revenge of the Nerds


    solves that problem by converting numbers to names, making it possible to use
    names like www.redhat.com rather than 66.187.232.56. In many ways, DNS makes the
    Internet usable and therefore popular.


    DNS is an interdependent information sharing system — a distributed database.
    No centralized servers contain actual addresses, as per www.redhat.com. Instead,
    DNS is structured so that local servers store local addresses, and a few centralized
    servers store information about where to go to find local addresses.


    # Introducing DNS components


    The overall DNS system is a complex system that contains many components. But
    because we show you how to build a DNS server for your private network, you can
    use a more simple system. Building your DNS server requires only a relatively
    handful of DNS components.


    This list outlines the basic DNS components:


    +   Domains: You are probably familiar with the domains whether you access it
    or not. Domains are the networks you access all the time on the Internet. For
    example, redhat.com is a domain (and www.redhat.com is the name of a server within
    the redhat.com domain).


    +   Domains can optionally be divided into subdomains. For example, Red Hat has
    a subdomain, beta.redhat.com, used for its beta software development.


    +   Domains themselves are divided into domains. The ubiquitous .com, .edu, and
    .org are all top-level domains. They organize the Internet into business, educational,
    and not-for-profit arenas.


    +   Zones: Domains are divided into zones. DNS zones can map directly to a domain;
    multizones serve a domain as well. The DNS server you''re building in this section
    consists of a single domain that services the fictitious paucity.net domain.


    +   Authoritative name servers: Every zone must have an authoritative name server.
    An authoritative name server holds the information for every host within the zone.
    You can create primary and secondary authoritative name servers. The secondaries
    back up the primaries.


    +   Non-authoritative name servers: You can create name servers that don''t necessarily
    provide the most up-to-date information.


    +   Caching server: Name servers can be configured to look up addresses from other
    name servers and temporarily save — cache — the information. Caching name servers
    help spread out the load of servicing large domains.'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# Chapter 15: Creating Basic Linux Network Services 231


    +   - Root name servers: The authorities that control domain name registrations
    provide root name servers that hold the addresses of name servers for each domain.
    DNS queries go to root name servers to find out where to find authoritative name
    servers.


    The following list describes the parameters found in DNS configuration and zone
    files. The parameters are called Resource Records (RR):


    +   - A Records: Address (A) records map IP names to numeric addresses.

    - C Records: Canonical (C) records define aliases for A records.

    - MX Records: Mail exchange (MX) records specify the mail servers that serve a
    domain.

    - NS Records: Name server (NS) records specify the name server for a zone.

    - SOA: Start of authority (SOA) creates a section that describes the generic properties
    of a zone file. The SOA configures parameters that set the serial number and various
    timeouts, plus the domain name of a zone.


    # Following a DNS address request


    Look at how your browser finds the Red Hat Linux Web page:


    +   1. You open your browser and enter the URL www.redhat.com.

    2. The browser asks Linux for the Web page''s numeric address.

    3. Linux looks in its /etc/resolv.conf configuration file and finds the address
    of a name server.


    You can use any DNS server on the Internet. For example, you can use the DNS servers
    of Albuquerque''s ISP Southwest Cyberport, 196.59.115.2, from anywhere on the
    Internet. You should use your own ISP''s servers because it has fewer routers,
    or to go through, which results in better reliability and speed.


    +   4. Linux requests the IP address for www.redhat.com from the name server.


    +   5. If the name server doesn''t know the IP address of www.redhat.com, it asks
    a root server for the address of an authoritative name server for the redhat.domain.


    +   6. The root server returns the address of the Red Hat authoritative name server,
    the first of which is ns1.redhat.com (66.187.233.210).


    +   7. The name server asks ns1.redhat.com for the address of www.redhat.com.


