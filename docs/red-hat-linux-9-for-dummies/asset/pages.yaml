    # Plugging In Plug-Ins


    Mozilla performs the tasks you expect from a browser, like displaying graphics
    along with text. Without help, Mozilla doesn''t go the extra mile and display
    things like animation and JavaScript. When it comes to special functions, Mozilla
    is a blank slate.


    However, with a little help from friends like you, Mozilla can go that extra mile.
    That help comes in the form of plug-ins. A plug-in is software Mozilla used when
    needed is sorry to perform extra functions. To make use of plug-ins, all you need
    to do is sorry — plug it in.


    The plug-in process is straightforward:


    +   1. Obtain the plug-in.

    2. Place it in the Mozilla plug-in directory.

    3. Optionally, configure the Mozilla preferences to use the plug-in.


    We describe how to download and install several popular — and in today''s world,
    necessary — plug-ins. Let''s start with the popular Macromedia Flash plug-in.
    Mozilla can show animation and other cool stuff. Here''s what to do:


