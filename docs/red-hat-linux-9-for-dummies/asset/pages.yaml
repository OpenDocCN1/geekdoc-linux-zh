  md: '# 36 Part I: Installing Red Hat Linux


    Red Hat provides automatic and manual methods for creating disk partitions because
    it is easy to use. The automatic method erases any existing Red Hat Linux partitions,
    but leaves alone any existing Windows partitions. If you don''t have any existing
    Red Hat partitions or unused space on your disk, you have to make some free space.
    Refer to Chapter 2 for instructions on shrinking Windows partitions to make space
    for Linux.


    Linux disk partitions are analogous to Windows disk partitions. The well-known
    C: drive is placed on a disk partition. The Linux equivalent is the root (/) partition.
    The two operating systems use different terminology, and the analogy eventually
    ends, although the concept is same.


    Follow these steps to continue the installation:


    +   1. Select the Workstation option in the Installation window and click the
    Next button.


    The Disk Partitioning Setup window appears, as shown in Figure 3-1. The Red Hat
    Linux installation system must partition your hard drive in order to install its
    software. Partitions divide a hard drive into one or more parts. The divisions
    are used to organize the software and data (user files, for example) that comprise
    the operating system.


    ![](img/cc58a1e8691061866010ce216f881372_59_0.png)


    Figure 3-1: The Disk Partitioning window.'
