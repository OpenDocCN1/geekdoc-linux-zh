    # Configuring the Linux print server


    After you connect a printer, you need to configure Linux to act as a print server.
    Red Hat provides an excellent print configuration utility. (Red Hat refers to
    its configuration systems as utilities.) Building a Linux print server requires
    you to configure the printer as a local device. However, every print client —
    the computers on the LAN that send their print jobs to the print server — configure
    their print queues to use the Windows Printer type. The print server sees the
    printer directly through its USB or parallel port, but the print clients see the
    printer as a Samba (Windows) share on the server.


    Red Hat Linux can handle five printer types. The printer configuration droid allows
    you to configure each type. The following list describes the printer types:


    +   * Local Printer: Use this type if your printer is connected directly to your
    computer. The print server is configured using this type because the printer is
    connected directly to it.

    * Unix Printer: Use this type if you''re creating a print server that only other
    Linux and Unix computers will use. Windows computers can''t use Unix printers.
    Unix printer queues don''t require Samba to work.

    * Windows Printer: Use this type if you''re printing to a Windows print server.
    Samba makes the print server look like a Windows print server, and the clients
    on the private network use this setting.

    * Novell Printer: Use this type if you''re printing to a Novell printer.

    * JetDirect Printer: Use this type if you''re printing to a Hewlett-Packard (HP)
    JetDirect printer. The HP JetDirect interface is built into many HP and other
    printers. You can also purchase JetDirect print server devices that connect to
    non-networked, traditional printers. JetDirect print servers convert traditional
    printers into networked printers.'
