  md: '# 284 Part V: The Part of Tens


    **Solution:** Modify the /etc/grub.conf file on your Linux computer. The grub.conf
    should look similar to this example:


    ```

    default=0

    timeout=10

    splashimage=(hd0,0)/grub/splash.xpm.gz

    title Red Hat Linux (2.4.x)

    root (hd0,1)

    kernel /vmlinuz-2.4.x ro=/dev/hda7 hdb=ide-scsi

    initrd /inititrd-2.4.x.img

    title Windows 2000

    chainloader +1

    rootnoverify (hd0,0)

    ```


    In this case, Linux is the operating system that boots by default, unless you
    select other. To reverse the order, simply flip the two operating systems'' positions
    in the file as follows:


    ```

    default=0

    timeout=10

    splashimage=(hd0,0)/grub/splash.xpm.gz

    title Windows 2000

    chainloader +1

    rootnoverify (hd0,0)

    title Red Hat Linux (2.4.x)

    root (hd0,1)

    kernel /vmlinuz-2.4.x ro=/dev/hda7 hdb=ide-scsi

    initrd /inititrd-2.4.x.img

    ```


    The next time you boot your computer, the order will have changed.


    # # My network is working, yet not working


    **Problem:** You have configured and checked your network connection, and it appears
    to be okay. You can''t connect to some or all of the machines or network services
    you want. You''re perplexed.


    **Solution:** Check your iptables-based firewall. Red Hat configures different
    levels of iptables firewalls during the installation. This book describes several
    different firewall configurations too. If your firewall isn''t configured correctly,
    it prevents some or all network communications. In many cases, even if your firewall
    is configured correctly, it may be designed to block the type of communications
    you want.


    Turn off your firewall with this command:


    ```

    /etc/init.d/iptables stop

    ```'
  merge: -1
