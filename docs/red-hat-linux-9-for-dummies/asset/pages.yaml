  md: '# 150 Part III: Linux, Huh? What Is It Good For? Absolutely Everything!


    snap, too. Nautilus even goes a step further: You can use it to configure your
    GNOME desktop. And that''s not all! Nautilus can also navigate the Internet, access
    multimedia, slice and dice! Not a bad deal, considering that it works for free.


    # Waking up Nautilus


    Red Hat Linux configures Nautilus to start automatically when you log in. Nautilus
    appears toward the end of the login process and works as a file manager (see Figure
    10-1, showing the contents of your home directory). If you want to start it manually
    — after you have closed it, for example — right-clickanywhere on the desktop background
    and choose New Window.


    The main menu follows familiar formats (File, Edit, and so on) and does all the
    things you expect these menus to do. The toolbar immediately below the main menu
    enables you to quickly move up one directory (Up) and skip back to previous menusBack
    and Forward). It also lets you rescan a directory, go to your home directory,
    and change the way icons are displayed.


