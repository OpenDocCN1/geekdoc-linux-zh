  md: '# Chapter 13: Going to the Office 193


    You can also track changes, just like with Microsoft Word. Choose Edit Changes,
    and you can track changes on a character-by-character basis. You can display the
    changes or keep them hidden from view. When you''re satisfied with your edits,
    you can make the changes permanent and save only the finished document to disk.
    Pretty cool.


    OpenOffice also provides the Find and Replace function from the Edit menu. The
    Find and Replace feature enables you to find text strings or replace them with
    another string or delete them. You can search forward or backward through a document.
    You can replace one instance or all instances.


    +   Spell check: OpenOffice provides a spell checker, course. You can tell the
    spell checker to check any document by choosing Tools:Spell Check Changes. You''re
    prompted to act on every possible spelling error the detects.


    Alternatively, you can set the spell checker to operate continuously. Choose Tools:Spellcheck
    AutoSpell to toggle on the real-time spell checker; when activated, a mark appears
