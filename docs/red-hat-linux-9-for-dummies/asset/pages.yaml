  md: '# How cable modems work


    Modern cable modems do more than just transport network packets. They transmit
    data packets by modulating and demodulating signals over the cable TV wires —
    thus, the name modem (modulate/demodulate). Cable modems now use the industry
    standard Data Cable Service Interface Specification (DOCSIS) protocol to deliver
    the electrical signals across the cable network. The electrical carries the actual
    bits and bytes that comprise the network packets. A good analogy is an AM/FM radio
    system. The DOCSIS-based electrical signals carry data packets just like radio
    waves transmit speech or music.


    You register your modem by giving your ICP the modem''s Media Access Control (MAC)
    address. The ICP registers an IP address by using the MAC address as its reference.
    You don''t need to do anything to your cable modem. The registration process is
    all done by your ICP, and your modem automatically is assigned an IP address.
    You''re ready to use your Internet modem to connect to the Internet. Woo-hoo!
    Blazing speed is yours now!


    # The DSL Option


    The world is wired — wired for telephones, that is. DSL modems take advantage
    of this old, but common, technology to provide a high-speed Internet connection
    to the consumer. The DSL option uses special equipment to pump much more data
    through the POTS lines than the traditional analog modem does.


    The telephone system is referred to as plain old telephone service (POTS) in the
    telecommunication industry.


    DSL provides high-speed Internet connections by electronically converting your
    computer''s digital information into a form that can be transmitted from your
    home or business to the telephone company. When your data finds its way to the
    telephone company, it''s converted into another form and sent to your ISP.


    DSL uses frequencies in the millions of cycles per second — the megahertz (MHz)
    range — compared to traditional analog modems, which work with signals in the
    thousands of cycles per second (kHz). You get much higher connection speeds when
    you use higher frequencies. The problem is, however, that the telephone system
    wasn''t designed to work with higher frequencies.'
