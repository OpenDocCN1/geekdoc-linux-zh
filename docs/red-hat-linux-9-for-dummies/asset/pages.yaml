    # Using the Fabulous Mplayer


    Whenever a desperate need exists, the Open Source movement comes to save the day.
    Until recently, you couldn''t use any single Linux application to listen to and
    view most of the streaming formats. Now, Mplayer has burst onto the scene and
    fills that gap.


    Mplayer can play most popular (and many obscure) audio and video streaming formats.
    Although it hasn''t reached the point that it has been officially released, it''s
    close to point and already quite usable. At the time this edition of the book
    was written, the second release candidate (the final form of beta testing) had
    just become available. Version 1.0 sono.


    This list shows some of the streaming formats that Mplayer can play:


    +   MPEG-1/Layer 3 (MP3): MP3 is a popular but proprietary codec for both storing
    and streaming audio.


    +   Ogg/Vorbis: This new and upcoming Open Source streaming format is unencumbered
    by any copyrights or patents, like other formats are.


    +   Microsoft Media Server (MMS): You can listen to radio broadcasts that use
    the popular MMS format with Mplayer. Previously, you needed to use the Microsoft
    client to listen to MMS streams.


    +   Digital Versatile Disc (DVD): You can play DVDs from your computer with Mplayer.


    +   RealAudio: You need to download, compile, and install the RTSP package to
    use RealAudio.'
