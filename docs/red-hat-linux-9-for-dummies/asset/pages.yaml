    # # Danger, Will Robinson!

    Detecting Intruders


    Intrusion detection is the flip side of intrusion prevention. You can''t depend
    on never getting hacked unless you turn off your computer and lock it in a safe.
    Remember, there''s no silver bullet in the world of computer security. You have
    to take measures to detect whether and when you get compromised.


    Many, intrusion-detection systems (IDS) can help with your needs — far too many
    to review here. We concentrate on using three systems that are mature and relatively
    easy to use: Tripwire, Snort, and the Red Hat log reading utility. Both Tripwire
    and the Red Hat log reading utility are bundled with Red Hat Linux; You can easily
    download Snort from the Internet.


    # Setting up Tripwire


    Tripwire is an IDS that creates a checksum for files and directories stores them
    in a database. Tripwire periodically — daily, by default — re-creates checksums
    for the same files. Tripwire compares the new checksums to the originals, and
    any differences indicate that the file has been changed. The changed file list
    is e-mailed to you, and you then determine whether the changes are authorized.


    Running a mathematical algorithm on a file creates a checksum. The algorithm creates
    a number — a very long number — that is unique to the file on which it runs. Thus,
    every checksum is unique, like a fingerprint. Checksums can be used to authenticate
    files and also to detect errors in the same files.


    ![](img/cc58a1e8691061866010ce216f881372_277_0.png)'
