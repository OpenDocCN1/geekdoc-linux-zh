    # “I never seem to have the correct time”


    **Problem:** When you boot Linux, the time is wrong, so you set it with the date
    command. Then you boot Windows and its time is wrong, so you reset it. When you
    boot Linux, its time is wrong again.


    **Solution:** Most Unix systems keep their time using Universal Time (also known
    as Greenwich Mean Time, or GMT), Microsoft systems keep their time as local time.
    When you set the time in either system, set the CPU clock to GMT. Then, when you
    boot the other system, it interprets differently what is in the CPU clock and
    reports a different time.


    Linux enables you to use either GMT or your local time. You make this choice when
    you install the system. To change your choice, follow these steps:'
