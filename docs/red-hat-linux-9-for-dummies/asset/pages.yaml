    # Designing and Building

    Your Private Network


    Private networks take many shapes and sizes. As you may expect, the design of
    a LAN for a large- or medium-size organization is different than for a small office
    or home. Individuals and small organizations generally do not require complex
    systems unless they perform complex. For the purposes of this book, we assume
    that you need and want a simple network. We describe how to design a basic LAN
    that is both powerful and reliable. This network can be used for many small- medium-size
    businesses and most households.


    This chapter shows how to design a flat network. Flat refers to the fact that
    all the computers connected to the network communicate over a single subnet (network,
    for short). Subnets can be combined within a single LAN, but that makes the network
    more complex to design, build, and maintain. The network we describe here is also
    designed around a Red Hat Internet gateway. The Internet gateway is a computer
    that acts as a portal, connecting the private network to the Internet. The networked
    computers in the private network — also referred to as hosts or clients — are
    connected through one of two methods:


    +   Wired connections: Hosts are connected to the LAN by a device called an Ethernet
    hub or Ethernet switch (hub or switch, for short). Switches are superior to hubs
    in performance and are becoming the standard. For your LAN, we suggest that you
    connect all computers (hosts), including the Internet gateway, by using a switch.
    Figure 14-1 shows an example of our private network where the interconnecting
    fabric is the Ethernet switch. (In the past two years, Ethernet switches have
    become inexpensive and common.)


    +   Wireless connections: Wireless devices make it possible to build a network
    without interconnecting cables. Wireless networks can take two forms:'
