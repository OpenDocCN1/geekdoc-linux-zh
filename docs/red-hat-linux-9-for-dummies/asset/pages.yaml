  md: '# 264 Part IV: Revenge of the Nerds


    We use the Red Hat Linux network as the troubleshooting example in this chapter.
    The Red Hat Linux network is one of the more difficult things to set up correctly
    because it depends on not only your Linux computer but also other computers. Suppose
    that your Red Hat Linux network isn''t working. Use the following sections of
    this chapter as a simple fault tree that you can follow to troubleshoot your network.


    ![](img/cc58a1e8691061866010ce216f881372_287_0.png)


    Please see Part V for insights into other problems. Chapter 18 describes how to
    find information about your Red Hat Linux computer. Chapter 18 also points out
    where you can get help and solve some simple, frequently encountered problems.
    Chapter 19 describes ten security fixes.


    # Introducing Fault Trees


    Troubleshooting is, as many people say, more of an art than a science. Sometimes
    it''s easy to see what the problem is and how to fix it. At other times, it''s
    not so easy. The degree of difficulty you have in fixing a problem depends on
    how complex the problem is and how well you know your stuff. Obviously, the better
    the acquainted you are with computers and Linux, the better you are at troubleshooting.


    Every problem has a solution. Computers are cause-and-effect machines. When something
    breaks or doesn''t work, there''s always a reason. The reason may not be easy
    to find, but it exists.


    How do you find the cause? That''s a million-dollar question. Getting a million
    bucks isn''t easy unless you''re willing to grind your teeth, plot against your
    fellow contestants for weeks on a remote island, purchase 10 million PowerBall
    tickets, or believe it or not—work hard and work smart. Some people are willing
    to eat rats for the chance or lucky enough to win the lottery, but must just have
    to work hard. Oh, well.


    Working hard is conceptually easy, but how do you work smart? This is where the
    idea of the fault tree comes into play. The fault tree looks like an upside-down
    tree. The trunk of the tree represents the fault, or problem. The ends or leaves
    of the branches represent all the possible cases. The fault tree is a conceptual
    aid that helps you to eliminate all the real cause of your problem. After that''s
    done, solving the problem is virtually guaranteed.


    For example, Figure 17-1 shows part of a fault tree that points out major subsystems
    you should examine. To find the solution to a problem, you need to systematically
    identify what''s working. You work your way to what''s not working and then when
    you find it, you usually solve your problem. The fault tree simply helps to formalize
    the process of problem-solving.'
