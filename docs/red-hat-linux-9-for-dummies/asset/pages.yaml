  md: '# # Chapter 14


    # # Building Your Own,

    Private Network


    In This Chapter


    +   - Designing your private network

    - Building your private network

    - Connecting your network to the Internet

    - Building a firewall to protect your private network


    A private network is a group of two or more computers linked so that they can
    communicate with each other; also referred to as a Local Area Network (LAN). The
    computers are generally located close together within a room or building. Unlike
    the Internet, which is designed to allow the world''s computers to talk with each
    other, LANs are designed to keep the communication local and private. (Of course,
    you can always connect your LAN to the Internet, but we talk about that elsewhere.)


    Building a private network isn''t as difficult as it may sound. First, you need
    to decide on a general network layout. Second, you need to connect the computers
    with cables and/or wireless devices. Finally, you need to configure each computer''s
    network settings. Design, connect, configure — one, two, three — it''s as simple
    as that.


    This chapter shows how to build a simple LAN. If you want to know how to add a
    Linux computer to an existing network, check out Chapter 7. To find out about
    adding a firewall to your LAN, check out Chapter 8.


    In this chapter, we show you how to wire computers together; you should depend
    on the Linux networking instructions from Chapter 7 to get your computers connected
    on your network. The instructions in Chapter 7 are also designed to work with
    the new LAN you''re building here.


    ![](img/cc58a1e8691061866010ce216f881372_222_0.png)'
  merge: -1
