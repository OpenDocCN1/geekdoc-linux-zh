  md: '# Part III: Linux, Huh? What Is It Good For? Absolutely Everything!


    The next few sections provide only a basic introduction to the things you can
    do with OpenOffice. No, we''re not lazy; it''s just that it would take too much
    space to describe it all in detail. Please experiment with your own test documents
    and consult the online help for more information.


    ![](img/cc58a1e8691061866010ce216f881372_215_0.png)


    # Firing up and using OpenOffice


    Red Hat includes OpenOffice and installs it by default. OpenOffice is easy to
    access. Click the GNOME Menu button and then choose>OpenOffice Writer. You can
    choose some, but not all, of the other OpenOffice functions from this menu. After
    thinking about life for a while, the OpenOffice window appears.


    The first time you start OpenOffice, it asks whether you want to use the workstation
    or personal model. The former installs the OpenOffice programs in a central location
    accessible to all users; the latter option installs a copy of OpenOffice in your
    home directory. We use the workstation configuration here, but you can select
    the personal model if you want.


    When you use OpenOffice for the first time, you''re also asked a few questions
    about importing an address book. We cancel the operation because we want to use
    the Xian Evolution address book.


    You can access all the OpenOffice functions by clicking the File button, in the
    upper-left corner of the window, and then the option you want.


    The following list introduces the functions. You''re probably familiar with the
    layout and operation of the menu if you have Microsoft Office.


    +   - **File:** As you may expect, you can open, save, and otherwise manipulate
    OpenOffice documents with the File menu. Writer files have the .swx extension.
    Other file formats, such as Microsoft Word and HTML, must be imported and exported.


    +   - **New:** You can create a new document for any OpenOffice function. When
    you choose File>New, you''re given the option to create a new text document, spreadsheet,
    presentation, or other function.


    +   - **Edit:** This menu provides all the functions you need to modify documents.
    Functions such as cut, copy, paste, and delete are all provided here. The functions
    that are active at any time depend on whether you''re editing a document, spreadsheet,
    or presentation. For example, the cut, copy, and paste options aren''t active
    if you''re not editing a document (like just when you first start up OpenOffice
    and have not opened any files).'
  merge: -1
