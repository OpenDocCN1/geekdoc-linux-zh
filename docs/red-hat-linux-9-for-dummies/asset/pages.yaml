  md: '# Chapter 13


    # Going to the Office


    +   In This Chapter

    - Introducing OpenOffice

    - Using OpenOffice Writer

    - Printing from OpenOffice


    Red Linux is a useful product that comes with a large base of services and applications.
    It has always been an outstanding platform for providing services and technical
    applications, but until recently has lacked a presence on the desktop. The problem
    was its lack of a full-blown office suite to work with word processing documents,
    spreadsheets, and similar documents. Fortunately, desktop suites — such as OpenOffice
    and its sister application, StarOffice — have taken Linux out of the back office
    and into the front.


    # Opening Your Office


    The OpenOffice desktop productivity suite does nearly everything Microsoft Office
    does, but for less money. How much less? Well, 100 percent less because its 100
    percent free. Sun Microsystems, Inc., sells the version named StarOffice but provides
    an Open Source version named — you guessed it — OpenOffice. OpenOffice is licensed
    under the GPL/LGPL and SISL licenses. What do all those letters mean? They mean
    fr-ee-e, and they also mean Linux can integrate office productivity features from
    OpenOffice because Linux and OpenOffice share the GPL license. You can find more
    information about the licenses at URL:


    ```

    www.openoffice.org/project/www/license.html

    ```'
