  md: '# Chapter 7: Connecting to a LAN


    If your LAN also has an Internet connection, you can set up that connection, too.
    A high-speed Internet connection is best, but in terms of the network configuration,
    the type of connection doesn''t matter.


    # Preparing to configure your wireless NIC


    Before you configure your wireless NIC, you need to figure out two things:


    +   - Which type of wireless NIC you have (or need)

    - How your wireless NIC will connect to your network


    Two main types of wireless electronics (or chip sets) are now in use: Wavelan,
    built by Lucent Technologies, and Prism2, designed by Insil. Both types are supported
    by Red Hat. The following list shows the manufacturers of each type. You can use
    the list to figure out what kind of chip your device uses:


    +   - Wavelan: Orinoco, Apple Airport Enterasys RoamAbout802, Elsa AirLancer11,
    and Melco/Buffalo 802.11b.

    - Prism2: D-Link DW-650, LinkSys WPC11, and Compaq WL110. Other, less popular
    models include Addtron AWP-100, Bromax Freeport, GemTek WL-211, Intalk/Nokia,
    SMC 2632W, YDI, Z-COM X1300, and Zoom Telephones ZoomAir 4100.


    # IEEE and wireless networks


    The dominant wireless standard is based on the IEEE 802-11b (and the older 802-11a)
    and the about-to-be-released 802-11g standard; 802-11b is also referred to as
    Wi-Fi (which is for the wireless industry''s trade term fidelity). If you hear
    people talking about a Wi-Fi NIC, they''re just talking about wireless NICs.


    IEEE (pronounced "eye-triple-e") stands for the Institute of Electrical and Electronic
    Engineers, a worldwide professional society of nerds. (Is it


    necessary to use words like nerds or geeks to convey some technical meaning?)
    The IEEE, the "triplocs" of wireless networking, concerns itself with issues like
    frequency wireless networking devices should use. Fortunately, this group has
    devised this wonderful standard that now enables everyone who''s interested to
    communicate between stringing wires between machines.'
