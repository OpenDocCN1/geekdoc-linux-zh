  md: '# Chapter 10: Gning More Applications


    Nautilus is programmed to recognize numerous Multipurpose Internet Mail Extensions
    (MIME) types, and they define what type of information file stores — in other
    words, MIME keeps its own Rolodex of sorts. Each MIME type is associated with
    certain file extensions. For, when you double-click a .doc file, Nautilus recognizes
    the .doc suffix corresponds to a Word document Nautilus and starts the OpenOffice
    word processor (described in Chapter 13), which loads the .doc file.


    Nautilus provides the ability to bookmark your favorite locations. The Nautilus
    bookmark function works just like Mozilla''s or any other web browser. Go to any
    directory and click Bookmarks+ Add Bookmark. You only have to click on Bookmarks
    and select the particular bookmark to go to that location. You can modify existing
    bookmarks by choosing Bookmarks+ Edit Bookmark.


    # Running programs


    Nautilus is such a hard worker that it happily launches commands for you. Right-click
    the icon you want to open a submenu, and then choose Open. For example, if you
    click the xclock icon in the /usr/bin/X1 directory, the xclock appears over your
    desktop. (Double-clicking the icon also works.)


    Managers are generally not very smart. But Nautilus is smarter than the average
    manager, and it knows what to do when it encounters various file types. If you
    open a nonexecutable file, such as a PDF file, the file manager knows which program
    to use in order to view it.


    # Come the Ximian Evolution Revolution


    The Ximian Evolution system is the new horsehorse of the GNOME and Linux world.
    Evolution provides the next significant step in the evolution of the Linux desktop
    by combining excellent e-mail and calendar clients with other functions to create
    a single, integrated package. Evolution provides these capabilities:


    +   - Calendar

    - Contact manager

    - E-mail client

    - Personal Digital Assistant (PDA) manager

    - Task manager (to-do list)


    The following two sections describe how to configure the Evolution e-mail and
    PDA functions.'
