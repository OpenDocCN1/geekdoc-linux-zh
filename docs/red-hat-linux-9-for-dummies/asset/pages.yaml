  md: '# Chapter 16


    # Securing Your Future


    # In This Chapter


    +   - Thinking security

    - Preventing intruders

    - Detecting intruders

    - Updating Red Hat Linux packages

    - Removing services with chconfig

    - Using the Secure Shell client

    - Configuring a Secure Shell server

    - Setting up Tripwire

    - Intrusion detection with Snort

    - Reading logs

    - Building a process

    - Understanding security processes


    Protecting your individual computers and collective network is an essential task
    in today''s insecure world. Unfortunately, computer and network security is a
    big, complex job. This chapter provides several straightforward methods and utilities
    that will bring your security job down to size. We help you make both your computers
    and network safe.


    This chapter describes security methods and systems. We have chosen security tools
    and systems that give you the most bang for your buck. This chapter provides a
    starting point for making your computers and network safe. We encourage you to
    continue learning and evolving your security system.


    # Thinking Security


    Computer security is best thought of as an ongoing process. No single method,
    tool, or system — a silver bullet — magically protects you from the wild Internet.
    Security, like exercise and diet, is just plain hard work.'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# 240 Part IV: Revenge of the Nerds


    Because no silver bullet exists, you need to layer your security measures — using
    "defense in depth." Each layer protects the other layers and vice versa. If and
    when one layer is breached, you fall back on the other. You can also add and remove
    layers as necessary.


    Your layered security systems and measures fall under three categories:


    +   * Prevention: Tools, utilities, and methods prevent any attacks from succeeding.
    Tools like passwords and the firewalls described in Chapter 8 are under this heading.


    +   * Detection: Because not all attacks can be prevented, it''s essential to
    detect them if possible. Intrusion detection is still more of an art than a science.


    +   * Process: Most computer users would prefer to construct a security system
    and then sit back and forget about it. However, the hacker world changes as fast
    as the rest of the world, and the systems that work today won''t necessarily work
    tomorrow. Therefore, you must keep learning and improving both your computer network
    and your capabilities.


    # Preventing Intruders


    We start by describing how to minimize your chances of being hacked. The following
    sections describe systems that increase your security:


    +   * Updating software: The Red Hat up2date utility helps keep your computer''s
    software up to date, which eliminates vulnerabilities as they are discovered.


    +   * Removing services: Hackers can''t take advantage of vulnerable software
    if you don''t use it. Turning off services reduces your exposure.


    +   * OpenSSH: Except for viewing Web pages, you should never communicate over
    the Internet (or wireless LANs) without using encryption. The Open Source SecureShell
    (SSH) provides a simple and effective encryption system.


    We describe each system in the following sections.


    # Reducing vulnerabilities by updating Red Hat Linux packages


    Standard hacker operating procedure is to find and then exploit vulnerabilities.
    The method is simple but effective. That translates in real-life this way: Joe
    hacker goes around rattling doorknobs and occasionally finds one that''s'
