    # Wiring without wires


    Life has gotten easier in the past years (circa 2000). Wireless networking is
    the best technological advance for home or small-business network users in the
    past five years, and it''s now affordable for consumers.


    Going wireless means


    +   - Not having to string cables around the house or office. You don''t have
    to spend money and/or time pulling wires through walls, ducts, cellars, and so
    forth. You also save the cost of the cables themselves.


    +   - Geographical freedom: You have the freedom to use your computers anywhere,
    regardless of where your server or Internet gateway or printers are located.


    +   - Looking good: You look high-tech even if you''re not. You can impress your
    friends and family.'
