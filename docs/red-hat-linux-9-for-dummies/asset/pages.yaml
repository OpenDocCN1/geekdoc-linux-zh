    A partition is a portion of a disk drive used to organize files and directories.
    For example, the famous Windows C: drive is installed on its own partition. A
    partition can use all or part of a disk. Most systems use one large partition
    that hogs up entire hard drive.


    Otherwise, you have to make accommodations for Red Hat Linux to live alongside
    Windows. But Linux is an easygoing fellow who gets get along well with others.
    You can install Red Hat Linux on the same hard drive with Windows. This type of
    configuration is a dual boot system, meaning that you choose operating system
    to use when you power up, or boot, your computer.


    This chapter shows you how to properly tenderize and marinate your hard drive
    so that Linux and Windows can live in harmony. It''s going to be a love-fest.'
