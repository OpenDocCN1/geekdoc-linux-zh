    # Entering the Ring of Fire: Burning CDs


    Back in the 1980s, when vinyl melted away under the invasion of CDs, it cost megabucks
    to build the factories to create the CDs; back then, it took a huge effort to
    make a CD. Today, for roughly the $100 it costs to purchase a CD burner (or means
    to record to CD), you can build your own, personal factory. Amazing.


    If you don''t have a CD burner (or writer), this section doesn''t do you a bit
    of good. Sorry.


    A one-time recordable CD is referred to as a CD-R; a rewritable CD is a CD-RW.
    CD burners look like regular read-only drives and are connected with either IDE
    or SCSI interface.


