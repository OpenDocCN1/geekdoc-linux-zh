  md: '# Appendix D: Revving Up RPM


    # # Manually installing and upgradading packages


    The RPM -i parameter indicates that an installation will take place. You can add
    verbose mode (which provides additional information) by using the -v option. (Note
    that you can combine options into a single group; for example, -i -v can become
    -iv.) Follow these instructions to install and upgrade packages:


    +   1. Log in as root and insert CD2 in the CD-ROM drive.

    2. Open a terminal emulator window by clicking the terminal icon in the GNOME
    Panel (see Chapter 4 for instructions).


    The GNOME Terminal emulator window opens.

    3. To add the package, type this command from a terminal window:

    ```

    rpm -iv /mnt/cdrom/RedHat/RPMS/xmms-skins*

    ```


    Alternatively, you can upgrade a package that has already been installed on your
    system. Substitute the RPM upgrade option, -U, in place of the install option,
    -i. For instance, the following command updates the package:

    ```

    rpm -U /mnt/cdrom/RedHat/RPMS/xmms-skins*

    ```


    The files that constitute the newer XMMS skins package overwrite the older version.
    Using existing configurations, however, are saved by adding the .rpms to the configuration
    file.


    # # Manually removing packages


    RPM packages are good residents on your computer because they lend themselves
    to easy removal. The rpm command permits you to remove packages via the erase
    (-e) function.


    Suppose that you are not so fond of the Mozilla e-mail client because you like
    the Evolution client better. No problem: Go ahead and remove the Mozilla mail
    package.


    To remove an RPM package, follow these steps:


    +   1. Log in as root and insert CD2 in the CD-ROM drive.

    2. Open a terminal emulator window by clicking the terminal icon in the GNOME
    Panel (see Chapter 4 for instructions).


    The GNOME Terminal emulator window opens.'
