    # Exploring the GNOME Desktop Environment


    GNOME, pronounced "guh-nome," stands for GNU Network Object Model Environment.
    (GNU itself stands for GNU''s Not UNIX, a recursive acronym designed by guys who
    never went to their prom but went to change the world.) If you have trouble remembering
    acronyms, just think of GNOME as great graphics for no money. However you remember
    it, GNOME is an Open Source graphical desktop environment. It provides a platform
    for doing your everyday tasks, such as word processing and Internet browsing,
    on your Red Linux computer.


    Log in to your Red Linux computer and check out the GNOME interface. It should
    look something like Figure 9-1 and consists of these three major elements:


    +   - Desktop: Quite simple, the desktop is the space where you do work. It is
    equivalent to — ta-dal — the top of a desk. The desktop comes preconfigured with
    a background and several icons that link to places such as your home directory
    and the trash bin. Icons are equivalent to the junk you pile on your desk.

    - When you click the home directory, Nautilus Nautilus opens and displays the
    contents of those directories. Nautilus is a graphical system for working with
    not only files and directories but also administration utilities and Web pages.
    See Chapter 10 for more information about Nautilus.

    - The Panel: The menu bar that runs across the bottom edge of your GNOME screen
    is the Panel. You can access every GNOME function and Red Hat or third-party application
    from the Panel. The Panel represents the drawers in a desk.


