    # Using Evolution with your PDA


    You can use the Evolution'' calendar, to-do manager, and contact manager with
    your PDA. In this section, we concentrate on using Evolution to back up your PDA
    because it''s one of most interesting and fun things you can do. You can find
    out more about using the calendar by reading the online Evolution documentation
    (click Help or visit gnome.org/gnome-office/evolution.shtml1) or simply experimenting
    with it.


    You can use the Evolution pilot-link utility to back up your PDA databases to
    your computer. To do so, follow these steps:


    +   1. Plug your PDA cradle into your computer''s serial port.


    The cable attached to your cradle has a female 9-pin (called a DB9) attached to
    it. Most, if not all, modern computers have a 9-pin male plug that connects to
    a serial port socket controlled by the /dev/ttyS0 Linux device. (In the Windows
    world, /dev/ttyS0 is equivalent to COM1, /dev/ttyS1 is COM2, and so on.)


    +   2. Click the Evolution icon on the GNOME panel.


    The Xianian Evolution (revolution?) application starts up.


    +   3. Click the Contacts button.


    +   4. Choose Tools: Pilot settings.


    The Welcome to GNOME Pilot Pilot Wizard window opens.


    +   5. Click Next and the Cradle Settings window, as shown in Figure 10-7, appears.


    You need to tell Evolution where to find your PDA. Click the Port menu and choose
    the serial device.'
