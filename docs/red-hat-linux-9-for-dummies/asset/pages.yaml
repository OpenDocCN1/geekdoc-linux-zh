  md: '# 292 Part V: The Part of Tens


    # How Many Demons Can Dance on the Head of the Linux Process Table?


    Every commercial operating system vendor wants to make its operating systems easy
    to install and use. Operating systems are inherently complex animals, and Linux
    is no exception. (Of course, we''re not biased when we say that Linux is overall
    a simpler system than Windows, whether you measure simplicity by the number of
    lines of code or the transparency of its design.) Vendors walk the tightrope of
    making the systems easy to use while making them reasonably secure.


    Ease of use and security often don''t coexist well. Your operating system is much
    easier to use, for example, if you install and activate every software package
    and option. On the other hand, running every software package means you have more
    potential vulnerabilities. If you install 10 doors and 20 windows in your home,
    you can certainly enter and leave as you please, but it also provides burglars
    with more opportunities to break in and do you harm. The same logic is true with
    your operating system: The more software you install, the more chances someone
    has of getting inside your computer.


    We can''t think a cure-all for this dilemma. The best answer from a security viewpoint
    is to not provide intruders with any openings: Place your computer in a locked
    room with no network or external connections and turn it off. You then have a
    really safe system that handles the floor down.


    As with most things in life, the real answer is to use your best judgment and
    balance security with ease of use. Run only the services you need. For example,
    don''t run the Samba file system service if you don''t want to use your Red Linux
    computer as a (Windows) file system server. Don''t run the text-based gpm if you
    use the graphical X Window mode on your computer. The list is endless and beyond
    the scope of this book to discuss in detail. You can find more info from these
    sources:


    +   - Web sites: Both www.sens.org and www.usenix.org deal with security issues.


    +   - HOWTOs: Go to www.redhat.com/docs/manuals/linux/RHL-8.0-Manual and open
    the Customization Guide and Reference documents to access security advice.


    +   - Books covering security: Browse through your local bookstore to find Linux
    books that discuss how to reduce services. Some good books are Red Hat Linux Security
    and Optimization, by Mohammed J. Kabir, and Linux Security Toolkit, by David A.
    Bandel, and published by Wiley Publishing, Inc.'
  merge: -1
  pgno: 315
- img_proc: true
  md: '# Chapter 19: Ten Security Vulnerabilities 293


    # Open the Encrypt


    It''s hard to trust communication media you don''t completely control — such as
    university LANs, wireless home networks, and the Internet. Our point: Trust no
    one!


    ![](img/cc58a1e8691061866010ce216f881372_316_0.png)


    Any public network is potentially dangerous, especially the Internet. One way
    to protect yourself is to use encryption for all communication. You use encryption
    when you conduct credit card transactions or read more e-mail. Secure Socket Layer
    (SSL) communication is the standard encryption mechanism for Internet browsing
    and e-commerce transactions.


    The Secure Shell (SSH) protocol is used to conduct encrypted CLI sessions and
    file transfers. Red Hat bundles the open source version of SSH called OpenSSH
    with its distributions. When you install Red Hat Linux, you automatically get
    the OpenSSH client. You can use OpenSSH from a terminal by entering the command
    ssh destination. The destination is the computer you want to communicate with.
    You can get information about www.openssh.org.


    ![](img/cc58a1e8691061866010ce216f881372_316_1.png)


    Using encryption is essential when you use wireless networking. Wi-Fi (also known
    as 802.11b) wireless networks can use built-in encryption based on the WEP protocol.
    WEP does have significant security vulnerabilities, though, the only long-term
    answer is to either wait until the next standard comes to fix the problem or use
    OpenSSH to provide your own encryption. You''re much safer if you use OpenSSH
    and SSL for as much of your communication possible.


    # Aha! No Firewall — Very, Very Good


    Broadband connections give you a quantum leap in speed and convenience when connecting
    to the Internet. The two most popular choices for a broadband connection are DSL
    and cable modems. After you start them, you''ll never go back to slow, Stone Age
    telephone-based modems.


    But every silver lining has a dark cloud. Broadband connections give you not only
    fast Internet connections but also continuous ones. With a telephone-based modem,
    a hacker can attack only your home computer and private network while you''re
    connected to the Internet. Using a 24/7 broadband connection means that every
    hacker on the Internet — that means every hacker in the world — can constantly
    bang on your computer and private network. That''s lots of vulnerability.


    ![](img/cc58a1e8691061866010ce216f881372_316_2.png)'
  merge: -1
  pgno: 316
- img_proc: true
  md: '# 294 Part V: The Part of Tens


    Firewalls provide your number-one protection from Internet-based attacks. The
    modern Netfilter/iptables packet-filtering firewall system gives you excellent
    protection when it''s properly configured. The Red Hat installation process installs
    a good iptables-based firewall by default, and Chapter 8 describes how to configure
    an even better. You should never, ever connect to the Internet without first configuring
    your personal firewall.


    ![](img/cc58a1e8691061866010ce216f881372_317_0.png)


    We don''t mean to imply that you''re vulnerable to attack if you use a telephone-based
    modem to connect to the Internet. Traditional modem connections are just as vulnerable
    as continuous broadband connections when they''re active. What we mean is that
    a modem that isn''t connected to the Internet is a safe modem.


    # Keeping Up with the Software Joneses


    Nobody''s perfect, and that goes for operating system vendors. Even open source
    Linux developers and great companies like Red Hat make mistakes. Vulnerabilities
    are found in software systems all the time and have to be fixed.


    Red Hat provides a way to keep up-date with current problem and security fixes
    through its Web site. Go to ftp. redhat.com/pub/redhat to find the newest and
    safest versions of all your system''s RPM packages. You can also find how to configure
    your Red Hat Linux system to update itself automatically.


    # "Backups? 1 Don''t Need No Stinking Backups!"


    If you don''t regularly make backups of your computer''s contents, you face a
    security vulnerability, plain and simple. You may lose some or all of your valuable
    information if your computer is compromised. You should back up your data as frequently
    as possible.


    You can use one of many techniques and software for making backups, but that stuff
    we couldn''t possibly begin to cover. We wouldn''t be able to cover Red Hat Linux
    even if we began to go into detail.


    ![](img/cc58a1e8691061866010ce216f881372_317_1.png)


    For example, the following commands use the ubiquitous Linux tape archive (tar)
    command to create an archive of your home directory. You can then use the OpenSSH
    scp command to securely copy the archive to another location,'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# Chapter 19: Ten Security Vulnerabilities 295


    such as your ISP account or another computer you access to. Follow these steps
    to create an archive of your home directory:


    +   1. Log in to your user account.


    +   2. Run this tar command:

    `tar czf username.tgz`


    In this case, the c option means to use tar to copy the specified files and directories.
    The z option tells tar to compress the data. The f option defines the text that
    follows — username.tgz — as the file to copy the files to. The dot (.) says to
    copy to the archive all files in the current working directory.


    +   3. Use OpenSSH to copy the tar archive to another location:

    `scp username.tgz loginaccount@mysisp.com`


    This command securely copies the tar archive to the account loginaccount@the mysisp.com
    ISP.


    # # My Buffer Overflow-ith


    The most popular way hackers use to break into computers is with buffer overflows.
    The buffer overflow technique attempts to feed crazy streams of data to programs
    in order to make them behave in ways their designers never intended. (It is beyond
    the scope of this book to describe in detail what a queue does. Suffice to say
    that Linux uses a queue to store instructions and addresses for later use.) The
    result of the buffer overflow is that sometimes the program provides the hacker
    with a shell or other open door when it fails.


    The shell created by a buffer overflow is an open door to your computer. Sometimes
    the shell has root (superuser) privileges, and then the hacker wins your system.


    Here are some simple techniques of defense is you can use to minimize the number
    of services:


    +   * The first line of defense is to simply minimize the number of services you
    run. You run zero risk of compromise from a buffer overflow vulnerability in Service
    A if you don''t run that service.


    For example, the Lion worm wreaked havoc in spring 2001. Lion exercised vulnerability
    in the Linux sendmail and lpd printer services. Computers that didn''t run those
    services weren''t vulnerable to the Lion worm.'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# Part V: The Part of Tens


    +   - The second line of defense is to update your Red Hat computer as often as
    possible. Red Hat posts package updates that fix vulnerabilities as they become
    available. Buffer overflow fixes comprise many of the package updates. Updating
    your system fixes many buffer overflow vulnerabilities.


    # Social Engineering 1010101010


    Hackers don''t have to discover supertechnical tricks to break into your computer.
    Many wiley hackers aren''t deterred when they encounter a well-protected computer
    or network. What does a poor hacker in these security-aware times have to do to
    break into your system?


    Social engineering can be as simple as a hacker calling to see whether you are
    at home or in the office. If you''re not physically present, the hacker or burglar
    can break in and steal the computer or its disks. Breaking into a computer if
    you possess it is pretty much a trivial process. Another social engineering technique
    hackers employ is to call a corporation''s help desk and pretend to be a VIP.
    The poor minimum-wage slave can be bullied or cajoled into giving out a password
    or other important information.


    ![](img/cc58a1e8691061866010ce216f881372_319_0.png)


    The moral of the story is to exercise good security hygiene and be careful of
    strangers. Don''t give out information unless it''s essential and you can verify
    the authenticity of the request.


    # Bad Passwords


    Probably the easiest to avoid, and most abused, vulnerability is poor or non-existent
    passwords. Passwords are your first line of defense. Your password is easily guessed
    — even worse — blank, someone will break in.


    Bad passwords are easy to fix. Start by assigning a password to every account
    you create — especially root. Then make it a habit to use "good" passwords. Passwords
    can be cracked by brute force because computers have become very fast. Because
    you connect to the Internet, hackers can steal your /etc/passwd file that contains
    the encrypted version of your text-based passwords and use a computer to crack
    them.'
  merge: -1
  pgno: 319
- img_proc: true
