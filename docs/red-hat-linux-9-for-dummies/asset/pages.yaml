    # Maybe you have an interrupt or address conflict


    You may have an interrupt or address conflict. Look at the list of interrupts
    and the IO addresses of all the devices that the kernel knows about by typing
    these commands:


    ```

    cat /proc/interrupts

    cat /proc/ioports

    ```


    The IO address is the location in memory where the device, such as the network
    adapter, is accessed by the microprocessor (for example, your Pentium chip). The
    interrupt communicates to the microprocessor that it should stop whatever it''s
    doing in order to process information that has arrived at the device sending the
    interrupt.


    When your Ethernet adapter receives a packet, it sends an interrupt to the microprocessor
    to signal that an event has occurred. Your Pentium stops what it''s doing and
    processes the new information. Actually, the microprocessor interacts with Linux
    to do the processing.


    Type cat /proc/interrupts to show both the interrupts and the IO addresses with
    which Red Hat Linux is familiar. The output should look like this example:


    0: 378425 timer

    1: 1120 keyboard

    2: 0 cascade

    10: 16077 3c509

    13: 1 math error

    14: 63652 + ide0


    This listing shows that Linux knows that the Ethernet NIC (3c509) exists. That
    is a good sign.


    Typing cat /proc/ioports shows the input/output ports used by Red Hat Linux to
    interact with the computer''s devices. This output shows the i/o ports used on
    this computer:


    ```

    0000-001f : dma1

    0020-003f : pic1

    0040-005f : timer

    0060-006f : keyboard

    0080-009f : dma page reg

    00a0-00bf : pic2

    ```'
