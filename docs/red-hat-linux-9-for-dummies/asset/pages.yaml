  md: '# 40 Part I: Installing Hat Linux


    ![](img/cc58a1e8691061866010ce216f881372_63_0.png)


    # Confidential for Windows users


    If you''re installing Red Hat Linux in a dual boot configuration with Windows
    NT, Windows 2000, or Windows XP, your NT boot record is temporarily overwritten,
    meaning that you can''t boot Windows NT. Don''t panic: Your partition isn''t erased
    — it has been rendered unbootable. (An NT boot record is what enables a Windows
    system to start automatically when you start your computer.)


    You can install Red Hat Linux without overwriting the NT boot partition if you
    select the Configure Advanced Boot Loader Options (refer to Figure 3-4). When
    you click the Next button, the Advanced Boot Loader window opens. Select the First
    Sector of Boot Partition option and then click the Next button. Your Windows boot
    configuration continues to operate as before.'
