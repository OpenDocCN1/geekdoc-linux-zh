  md: '# # Red Hat Linux 9

    For Dummies


    # # Cheat Sheet


    # A few good commands


    Some used and useful commands are listed here. You enter these commands from a
    shell prompt:


    | cd directory | Change the current directory to directory |

    | ls [options] [directory] | List the current directory''s contents |

    | ls -l | List the current directory''s contents with sizes, permissions, ownership,
    and dates of file |

    | ls -a | List all files, including invisible files (whose names begin with a
    period) |

    | pwd [options] | Print the working directory (the one you''re in) |

    | rm [options] filename | Remove filename |

    | mkdir [options] directory_name | Make a new (empty) directory |

    | rmdir [options] directory_name | Remove an empty directory |

    | cp [options] src_filename | Copy a file |

    | dst_filename | |

    | mv [options] src_filename | Move (or rename) a file |

    | dst_filename(s) | |

    | cat [options] filename | Concatenate a file to the standard output (the file)
    |

    | more [options] filename | Paginate a file |

    | less [options] filename | Paginate a file |

    | touch [options] filename | Make a new (empty) file, changing the access date
    of an existing file |

    | chown [options] filename | Change the owner of a file or a directory |

    | chgrp [options] filename | Change the group of a file or a directory |

    | chmod [options] filename | Change the permissions of a file or directory |

    | sort [options] filename | Sort a file in a particular order (depending on the
    option) |

    | echo [options] text string | Echo back to the screen what is typed after the
    command |

    | date [options] text string | Read the date (without an argument); set the date
    and (with an argument) |

    | cut [options] filename | Break a file into multiple narrow rows |

    | sed [options] filename | Stream editor for large files or real-time editing
    |

    | ln [options] source_filename/directory target_filename/directory | Link a filename
    to another file |

    | grep [options] filename | Use searching program, which uses regular expressions
    to find data and then prints it to its output |


