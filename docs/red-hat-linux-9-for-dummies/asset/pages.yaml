- img_proc: true
  md: '# 318 Part VI: Appendixices


    Files and directories all have group ownership in addition to user ownership.
    Groups are defined by the /etc/group file and provide a secondary level of access.
    For example, you can assign group ownership to files you own and allow other users
    who belong to the group to access those files.


    Files and directories are assigned permissions that permit or deny read, write,
    and execute access. Permissions are assigned to the owner, group, and anyone of
    the file or directory. The owner, group, and anyone permissions are independent
    of each other.


    Using the -l option allows you to see the file''s permissions, along with other
    relevant information, such as who owns the file, which group of people have permission
    to access or modify the file, the size of the file or directory, the last time
    it was modified, and the name of the file.


    First, create a file and then list it:


    ```

    [lidia@cancun lidia]$ touch gotowork

    [lidia@cancun lidia]$ ls -l gotowork

    -rw-rw-r-- owner 0 Feb 3 16:00 gotowork

    ```


    The -rw-rw-r-- characters are the permissions for the gotowork file: The owner
    is you, and the group is probably you but may be something else, depending on
    how your system is set up and administered.


    You may be wondering how you can become an owner of a file. Well, you''re automatically
    the owner of any file you create, which makes sense. As the owner, you can change
    the default file permissions — and even the ownership. If you change the file
    ownership, however, you lose ownership privileges.


    To change the ownership of a file or a directory, use the chown command. (Get
    it chown — change ownership.) In general, you will have to root to do this.


    Suppose that you have decided to settle down and lead a more contemplative life,
    one in line with a new profession of haiku writing. Someone else will have to
    pay the weekend sprees and all-night bashes. So you give ownership of the gotowork
    file:


    ```

    [lidia@cancun lidia]$chown gotowork

    ```


    This command changes the ownership of gotowork to root. If you want to change
    it, you can use the chown command, but you have to do it as root.


    Files and users all belong to groups. In the gotowork example, the group is users.
    Having groups enables you to give large numbers of users — but not all users —
    access to files. Group permissions and ownership are for making sure that the
    members of a special project or workgroup have access to files needed by the entire
    group.'
