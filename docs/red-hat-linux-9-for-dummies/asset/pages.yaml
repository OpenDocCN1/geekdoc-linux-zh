  md: '# 94 Part II: Got Net?


    ![](img/cc58a1e8691061866010ce216f881372_117_0.png)


    # # The many faces of DSL


    ADSL comes in a variety of flavors. Most consumers end up using ADSL because it
    offers inexpensive Internet connections at reasonably high speeds. ADSL serves
    an individual computer''s Internet needs well; it provides a small business with
    adequate service. ADSL is not, surprisingly, the most available of all DSL flavors.


    The other types are more suited for business use. Most locals have access to only
    two or three of these services. This list describes DSL variations:


    +   - HDSL2 (high bit-rate DSL): HDSL2 provides the same specifications as HDSL
    works over a single twisted-pair connection.


    +   - (Asymmetrical DSL): The ADSL download (downstream) speed isn''t the same
    as its upload (upstream) speed. (That''s why it''s asymmetrical). The maximum
    ADSL speed is 8 Mbps, but it''s usually limited to less because of the POTS infrastructure
    limitations.

    - (ISDN Digital Subscriber Loop): IDSL, the successor to the current ISDN technology
    (2BIQ) as ISDN and DSL is used mostly to provide DSL service in areas where more
    popular forms, such as ADSL and DSL, aren''t available. IDSL is capable of providing
    upstream and downstream rates of 144 Kbps.

    - (Single-line DSL): SDSL is commonly called Symmetric DSL because DSL provides
    as much as 50 Mbps over distances up to 1,500 meters on short loops.

    - G.Lite: Also known as Universal DSL or splitless ADSL, G.Lite is a low-speed
    version of ADSL that doesn''t require filtering out the POTS signal. It provides
    as much 1.5 Mbps downstream and 512 Kbps upstream.

    - HDSL (high bit-rate DSL): HDSL is a symmetrical protocol with equal upstream
    and downstream speeds. You can use HDSL as a substitute for T1 connections because
    it provides the same data rates of 1.544 Mbps.


    # # Connecting your Cisco modem to your Red Hat Linux computer


    Writing explicit configuration examples is always difficult. The DSL world is
    still young, and we''re not convinced that any standards have emerged. Chances
    are that instructions don''t match your equipment.'
  merge: -1
