  pgno: 342
- img_proc: true
  md: '# 320 Part VI: Appendices


    Programs written in a compiled language, such as C, however, must have only executable
    permissions, to protect them from being copied where they shouldn''t be copied.


    For a directory, execute permission means that you can change to that directory
    (cd). Unless you also read permission for the directory, ls -l doesn''t work.
    You can list directories and files in the directory, but you can''t see additional
    information about the files or directories by using just an ls -l command. This
    arrangement may seem strange, but it''s useful for security.


    The first character of a file permission is a hyphen (-) if it''s a file; the
    first character of a directory is d. The nine other characters are read, write,
    and execute positions for each of the three categories of file permissions:


    +   - Owner (also known as the user)

    - Group

    - Others


    Your gotork file, for example, may show these permissions when listed with the
    ls -1 -gotork command:


    ```

    -rw-rw-r--

    ```


    The hyphen (-) in the first position indicates that it''s a regular file (not
    a directory or other special file). The next characters (rw-) are the owner''s
    permissions. The owner can read and write to the file but can''t execute it. The
    next three characters (rw-) are the group''s permissions. The group also has read-write
    access to the file. The last three characters (r--) are the others'' permissions,
    which are read-only.


    -[rw-][rw-][r--] illustrates the four parts of the permissions: the file type
    followed by three sets of triplets, indicating the read, write, and execute permissions
    for the owner, group, and other users of the file (meaning everyone else).


    You can specify most file permissions by using only six letters:


    +   - ugo, which stands for — not a car — user (or owner), group, and other

    - rwx, which stands for read, write, and execute


    These six letters, and some symbols, such as the equal sign (=) and commas, are
    put together into a specification of how you want to set the file''s permissions.'
