    GNOME provides numerous applications intended for work and fun. Red Hat also provides
    a wide range of applications, some of which are accessible via GNOME. (You can
    also add your own applications from the Open Source community and third parties.)


    Nautilus provides another way of accessing many of the applications on the Red
    Hat Linux computer. Applications that don''t have links to GNOME aren''t accessible
    via the GNOME menu system; you can generally correct that by situation by manually
    adding links provided by the GNOME Add to Panel option.


    This list describes the methods used to access applications:


    +   - Start Here: From the GNOME Start window, opening the Applications icon provides
    access to most of the applications installed on your computer.


    +   - Nautilus: Clicking your Home directory icon opens a Nautilus window. You
    can then start any executable application stored in your home directory by double-clicking
    its icon. You can also change to any other directory — that you have permission
    to — in order to run an application.'
