  md: '# 152 Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


    You can delete multiple files and directories. Again, you trace a box by clicking
    and dragging the mouse cursor. Right-click the blue highlighted icons or icon
    names (But not the white space around the icon and name). The files or directories
    are moved to the trash directory.


    # Creating directories


    Right-click anywhere in a Nautilus window and choose New Folder to create a new
    directory. A new folder appears with the name Untitled folder. Enter any name
    for the directory as you please.


    # Viewing files and directories


    By default, files and directories are displayed onscreen as icons. The only information
    an icon shows the name and whether an item is a file or directory (directory icons
    also show the number of files and directories they contain). You can display additional
    information by clicking the View Icons, View List, or View as buttons that appear
    when you click the View Menu button at the top of the screen.


    This list describes the differences between views:


    +   Icons view: The default option; shows whether an item is a file or directory.
    Regular file icons take several forms, but text and configuration files look like
    pieces of paper with a corner folded. Files containing specific types of data
    have small subicons overlaid on the file icon. For example, PDF files have a PDF
    subicon. Links, devices, and so on other forms. Directories take the form of a
    partially open manila folder. Icons are evenly placed across the entire File manager
    screen. Icons tend to make distinguishing files and directories easier but take
    up more space onscreen.


    +   List view: Displays the size and time stamp of each file and directory in
    addition to their names.


    +   View as: Enables you to select icons or lists as your default folder view
    for all or specific directories. You can also associate MIME types with specific
    applications.


    You can Nautilus to create shortcut icons on your desktop that point to files
    or applications. In Nautilus, just click and drag any part of the desktop and
    release the mouse button. An icon is placed on the desktop. You can then start
    the application by double-clicking it. If the icon points to a data file (such
    as a text file, for example) and Nautilus knows how to handle its MIME type, Nautilus
    launches the appropriate application to open the file. Otherwise, Nautilus prompts
    you to tell it which application to open it in.


    ![](img/cc58a1e8691061866010ce216f881372_175_0.png)'
