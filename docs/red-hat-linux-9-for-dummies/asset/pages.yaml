- img_proc: true
  md: '# Chapter 6: Broadband Rocks!


    This section shows how to use one of the more common DSL modems.

    Qwest, which is a “baby Bell” and one of the larger DSL providers, uses this equipment.
    Our Cisco 675 or 678 DSL modem/router is the Qwest-recommended equipment.


    ![](img/cc58a1e8691061866010ce216f881372_118_0.png)


    Even you''re using different equipment, our instructions should still be useful
    in outlining the general process of configuring a DSL connection.


    Cisco and other manufacturers’ DSL modems can be configured four different ways:


    +   By using the proprietary, Windows-based Cisco application. This system works
    well, but you need to run it on a Windows computer.


    +   By using the Cisco Web-based (HTML) configuration system. This system also
    works well and is independent of any operating system because it works with any
    Web browser, including Mozilla. However, you will first need to configure the
    DSL modem''s administrative password before you can use the browser to configure
    the modem.


    +   By using Telnet and running the Cisco configuration commands. Cisco provides
    a command-line interface for entering configuration commands. Unfortunately, you
    need to communicate with the DSL modem over your network connection to use Telnet.


    +   By connecting to the modem with a serial cable and running the Cisco configuration
    commands. This connection method uses the Cisco command-line interface, just as
    Telnet does. However, no network is used, and thus, no prior configuration must
    take place before using this method.


