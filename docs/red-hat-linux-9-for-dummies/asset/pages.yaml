  md: '# Appendix C: Becoming a Suit: Managing the Red Hat Linux System 327


    # # Sending Corrupted File Systems to Reform School: fsck Your Filesystem


    You can corrupt file systems by turning off your computer without properly shutting
    down Red Hat Linux. The result? The file doesn''t open or the data in the file
    is all scrambled. Corruption can also occur because of a driver error or a hardware
    crash. The type of corruption that occurs when you incorrectly turn off your computer
    is generally not serious. You shouldn''t push fate, however, and you should avoid
    even mild corruption.


    The fsck (file system check) utility checks Linux file systems. The fsck utility
    reports errors and makes some repairs. Usually, the fsck program is called duty
    automatically whenever your system boots. This, if your system crashes, fsck checks
    out all the file systems that were mounted at the time of the system crash.


    You can run fsck manually, as opposed to having the boot process run automatically.
    In some cases, you must run it manually because it needs to prompt you during
    the process.


    Unfortunately, fsck doesn''t always do the trick; for example:


    ![](img/cc58a1e8691061866010ce216f881372_350_0.png)


    +   - fsck can''t find (alone repair) corrupted data that''s located in a structurally
    intact file.


    +   - With the exception of the root file system, fsck runs only on unmounted
    file systems.


    +   - You make sure that the system is in single-user mode to use fsck on the
    root file system.


    Here''s the syntax you use to run the fsck command manually:


    ```

    fsck (options) filesystem

    ```


    The word filesystem names the device driver (or block special file, in technical
    geekspeak) that connects Linux to the file system. If filesystem is omitted, the
    fsck utility checks all the file systems listed in the /etc/fstab file configuration
    file. If the fsck utility finds any errors, it prompts you for input on what to
    do about the errors. For the most part, you simply agree whatever the program
    suggests. The fsck command has these options:


    +   - p: Preens the file system. Performs automatic repairs that don''t change
    the contents of files


    +   - n: Answers No to all prompts and lists only problems; doesn''t repair files'
