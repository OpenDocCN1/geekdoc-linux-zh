    # Owning Files and Granting Permissions


    All Linux files and directories have owners and are assigned a list of permissions.
    This system of ownership and permissions forms the basis for restricting and allowing
    users'' access to files. File permissions can also be used to specify whether
    a file is executable as a command and to determine who can use the file or command.


    Files and directories are owned by user accounts. User accounts are defined in
    the /etc/passwd file. For example, you created the root (superuser) user when
    you installed Red Linux in Chapter 3 and the installation system created the super
    home directory, /root, plus several configuration files—for example, .bashrc.
    The root user owns all those files and directories. If you create a regular user
    account—that user''s home directory and configuration files are all owned by lidia.
    Users can access and modify any files or directories they own.'
