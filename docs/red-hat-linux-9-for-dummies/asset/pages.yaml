    It''s beyond the scope of this book to describe how to customize an iptables firewall.
    However, the firewalls we construct in this book may work for your needs and also
    be easier to understand and modify. Please refer to Chapter 8 for more information
    about iptables-based firewalls.


    # I want to make an emergency boot disk


    **Problem:** You skipped making an emergency boot disk when you installed Red
    Hat Linux.


    **Solution:** All is not lost if you skipped making a boot disk in Chapter 3.
    In fact, it''s easy to make one. Log in your computer as root and insert a floppy
    disk that you don''t mind erasing (losing everything on that disk). Run this command:


    ```

    uname -r

    ```


    This command returns information about the version of Linux you''re running. The
    output looks similar to the following:


    ```

    2.4.20-8

    ```


    Use that number to run this command:


    ```

    mkbootdisk 2.4.18-7.80

    ```


    You have a Red Hat boot floppy when the process finishes writing to the disk.
    Restart your computer and press the Enter key at the boot: prompt. You then starts
    Red Hat Linux.


    # My hard drive numbers have changed since installation


    **Problem:** Linux numbers hard drives each time it boots, calling SCSI hard drives
    names like sda, sdb, sdc, and sdd. Suppose that sda holds your Microsoft operating
    system, sdb holds the bulk of Linux, sdc holds your user'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# 286 Part V: The Part of Tens


    files, and sdd holds your swap space. Now you add another hard drive, and your
    user files are on sdd and your swap space is on s. The new hard drive is named
    sdc but has nothing on it. What happened?


    **Solution:** SCSI hard drives are letter according to the SCSI IDs set on each
    hard drive. Linux names the hard drives by using this ordering scheme. If you
    insert a new hard drive into the SCSI bus with a SCSI ID that is lower than an
    existing hard drive, you rename all hard drives with a SCSI ID number above the
    one you just installed. You should start installing your SCSI hard drives with
    a SCSI ID of 0, 1, 2, and so on; then put SCSI devices at the other end of the
    SCSI bus (SCSI IDs 6, 5, 4, and so on).


    Most SCSI controllers are set to SCSI ID 7 by default.


    IDE hard drives are numbered according to the IDE controller they''re on and whether
    they''re a master or a slave of that controller. For this reason, adding a new
    hard drive to a set of IDE controllers doesn''t change the existing names, as
    shown in these two tables:


    | Controller | Hard Drive | Linux Name |

    |---|---|--|

    | ide0 | Master | hda |

    | ide0 | Slave | hdb |

    | ide1 | Master | hdc |

    | ide1 | Slave | hdd |

    | ide2 | Master | hde |

    | ide2 | Slave | hdf |

    | ide3 | Master | hdg |

    | ide3 | Slave | hdh |


    | Controller Designation | Controller Priority |

    |---|---||

    | ide0 | Primary controller |

    | ide1 | Secondary controller |

    | ide2 | Third controller |

    | ide3 | Fourth controller |'
  merge: -1
