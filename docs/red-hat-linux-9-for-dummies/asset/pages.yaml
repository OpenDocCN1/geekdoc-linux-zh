  md: '# # Appendix A


    # # Discovering Your Hardware


    **In This Appendix**


    +   - Introducing PC hardware subsystems

    - Introducing hard drive controllers

    - Introducing computer memory

    - Identifying hardware on Windows 9x and Windows Me computers

    - Identifying hardware on Windows NT, Windows 2000, and Windows XP computers


    You should know as much about your computer as possible before installing Red
    Hat Linux. This appendix describes the basic parts that comprise a computer and
    shows you how to discover information about those parts.


    Knowing your hardware can be interesting (“My processor is faster than your processor!").
    It can also be useful if you have problems installing Red Hat Linux in Chapter
    3. Understanding the bits and pieces that comprise your computer can help you
    install Red Hat Linux. That information also lets you know better what your Linux
    computer can do. This appendix helps you get started on your path to self-discovery.


    ![](img/cc58a1e8691061866010ce216f881372_324_0.png)


    Linux runs on Intel processors from the 386 up as well as the Digital Equipment
    Corporation (DEC) Alpha, Sun SPARC, Motorola, MIPS, PowerPC, and HP/PA platforms.
    However, the version of Red Hat Linux included with this book works on only Intel
    386-, 486-, and Pentium-based computers. That shouldn''t be a problem because
    it seems that 99.99999999999999 percent (well, maybe not quite that many) of the
    world''s computers are Intel-based.


    # # Breaking Down Your Computer


    Computers may seem mysterious at first, but the truth is that they''re not terribly
    complex. When you break down the parts that make up a PC, you see that each part
    performs a specific task. The sum of the parts equals a computer. This list outlines
    the subsystems that comprise a computer:'
  merge: -1
