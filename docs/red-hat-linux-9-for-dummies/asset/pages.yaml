    # Making Your Own Rules


    You, as the owner of a file, can specify permissions for reading, writing to,
    or

    executing a file. You can also determine who (yourself, a group of people, or

    every in general) can do these actions on a file. What do these permissions

    mean? Read (on you have our permission):


    +   - Read permission: You can read the file. For a directory, read permission

    allows the ls command to list the names of the files in the directory. You

    also must have execute permission for the directory name to use the -

    option of the ls command or to change to that directory.


    +   - Write permission: You can modify the file. For a directory, you can

    create or delete files inside the directory.


    +   - Execute permission: You can type the name of the file and execute it.

    You can''t view or copy the file unless you also have read permission.

    Files containing executable Linux commands, call shell scripts, must

    therefore be both executable and readable by the person executing'
