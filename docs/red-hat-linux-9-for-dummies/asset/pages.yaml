  md: '# Wireless network warning


    Wi-Fi, the standard for wireless technology, uses an encryption system called
    wireless equivalent (WEP) to provide security, WEP encrypts communication between
    wireless devices to prevent some with the right equipment from listening to and
    using your wireless network. WEP is flawed and can be broken using tools available
    on the Internet (that a big surprise). If a hacker breaks into your Wi-Fi network,
    he can read your communications. But your problems don''t end there. Hackers can
    use your wireless network to connect to your private network and the Internet;
    give the bad guys a launchpad to the Internet.


    for the logic. If you assume that your wireless network has already been hacked,
    you don''t have to worry about when it might be hacked in the future.


    You should use Open Secure Shell (SSH) and Secure Sockets Layer (SSL) — both with
    Red Hat Linux — to conduct all your internal and external communication. Keep
    in mind that using SSH and SSL protects your information, but doesn''t prevent
    someone from connecting to your network. The next generation of Wi-Fi,802.11g,
    is supposed to fix the WEP weakness. Until the WEP problems are solved, be aware
    of the risks.


    On the other hand, wireless networking is so useful that many people make accommodations


    tightly control network traffic than access-based points. You can configure ad
    hoc networks with a firewall more easily than a network using an access point.
    (Many of the current crop of access points now now provide NAT and firewall support,
    however.)


    # Configuring your Ethernet or wireless NIC


    To get your Red Hat Linux computer working on a LAN, you must first configure
    its NIC. The NIC is the device that electrically connects your computer to your
    LAN. To work with the other computers on your network, your Ethernet or wireless
    adapter must be given a network address and a few other pieces of information.


    We have divided the configuration instructions between Ethernet and wireless (or
    Wi-Fi) NICs. The instructions start by explaining how to start the Red Hat Network
    Configuration Utility. We then devote a subsection to describing the particulars
    of configuring Ethernet and wireless devices. After we cover the device specifics,
    we discuss general configuration issues. The overall configuration process is
    outlined in these steps:


    +   1. Start the Network Configuration Utility.

    2. Configure your Ethernet or wireless device.'
