    # Fixing Common Problems


    Okay, enough information about finding information. This section describes how
    to fix several common problems. Each of the following sections outlines the problem
    and then describes the solution.


    # “I forgot my password”


    Problem: You have to remember a zillion passwords at work and home. Unfortunately,
    you can''t remember your Linux password.


    Solution: The solution is simple if you have forgotten a user account password
    but still remember the root password. In that case, simply log in as root and
    reset the user password. For example, if your user name is rod, run the command
    passwd rod and enter the new password (for example) likes coffee.


    The solution is more difficult when you forget the root password. You have to
    become a hacker and break in to your computer to fix the problem. Fortunately,
    Red Hat provides two possible solutions: Either boot single-user mode via GRUB
    or boot from the first Red Hat installation disc.


    ![](img/cc58a1e8691061866010ce216f881372_305_1.png)'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# Chapter 18: Problem Areas and Solutions


    # # I want to boot into single-user mode via GRUB"


    Turn on or restart your computer and use your cursor keys to select the Linux
    operation system when the GRUB boot screen appears; Linux is selected automatically
    if you''re not using a dual-boot system (you installed only Linux). Next, press
    the e key to edit the GRUB configuration. You see three lines, middle of which
    starts with the word *kernel*. Select the *kernel* line with the cursor keys when
    the three-line menu appears. Press the e key again and enter the word *single*
    at the end of the line. Press the Enter key and you''ll return to the original
    GRUB window. Finally, press the **b** key to boot the system into single-user
    mode.


    ![](img/cc58a1e8691061866010ce216f881372_306_0.png)


    You can tell Linux to boot into non-graphical—rather than single-user—mode by
    substituting **3** for *single* when you''re editing the GRUB boot mechanism.


    # # I need to rescue my computer!"


    Power on or reset your computer. Change your BIOS to boot from CD-ROM, if necessary.
    Before your computer starts the GRUB boot system, insert the first Red Hat installation
    CD-ROM (CD1). When the Red Hat installation process starts, type **linux rescue**
    at the *boot:* prompt.


    Red Hat boots into single-user mode and mounts your Linux partitions. You need
    to edit the `/mnt/sys/image/etc/shadow` file and remove the root user''s encrypted
    password. The root user, the first line in the file, looks similar to this:


    ```

    root:2341#!113@jd/dj!(34:11922:0:999999:7:::

    ```


    Eliminate the characters from the first and second colon to remove the password.
    The new line should look similar to this one:


    ```

    root::11922:0:999999:7:::

    ```


    Save your changes and reboot the computer. Enter **root** when prompted for the
    user name, and then enter an empty password. You''re logged in as root, and you
    should immediately enter a new root password.


    # # I want to change the GRUB boot order


    **Problem:** You created a dual-boot computer with Red Hat Linux and Windows,
    and you want to change which boots by default.'
