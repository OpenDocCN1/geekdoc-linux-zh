  md: '# 58 Part I: Installing Red Hat Linux


    After you press Enter, Red Hat Linux boots. During this process, lots of information
    is displayed on your screen. Red Hat Linux gleans this information as it probes
    your computer in order to determine what hardware (disk drives and printers, for
    example) are.


    Because Red Hat Linux is a multiuser system, one or more users can use it at the
    same time; for example, you can be logged in at the computer console (the attached
    keyboard and monitor) while someone else is logged in via a network connection.
    Therefore, you and every other user need a user account in order to use the computer.
    Each account requires an individual name and password to protect your information
    and keep your tasks separate from other people''s tasks.


    # Logging In


    When you use Red Hat Linux, you must log in as a particular user with a distinct
    login name. Why? Because Red Hat Linux is a multiuser system and therefore uses
    different accounts to keep people from looking at other people''s secret files,
    erasing necessary files from the system, and otherwise (intentionally or unintentionally)
    doing bad things.


    The use of unique identities helps to keep the actions of one person from affecting
    the actions of another because many people may be using the same computer system
    at the same time (for example, over a network). A benefit of this strategy is
    that Red Hat Linux systems are essentially invulnerable to viruses simply because
    each user''s files and directories cannot be used to corrupt the system as a whole.
    (Not that we are keeping score or anything, but viruses can destroy or just make
    life miserable for Windows 9x systems they do not have this capability).


    As Red Hat Linux boots, you see all sorts of messages scrolling by the screen.
    After the scrolling stops, the login screen appears.


    If you choose during installation not to X start automatically whenever you boot
    your system, you see the login: prompt.


    If you make a mistake while typing the password or your login, the system asks
    you to retry it.


    ![](img/cc58a1e8691061866010ce216f881372_81_0.png)


    ![](img/cc58a1e8691061866010ce216f881372_81_1.png)


    We strongly recommend that you do most of your experimentation with Red Hat Linux
    as an unprivileged user and log in as root only when necessary. By operating as
    root, you run the risk of corrupting your system, having to reinstall again, or
    losing data because you can delete or change anything and everything. When you
    are logged in as a regular user, you can accidentally erase your own files and
    data, but you can''t erase someone''s files or system files.'
