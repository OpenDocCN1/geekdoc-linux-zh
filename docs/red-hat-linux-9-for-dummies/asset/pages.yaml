  md: '# 202 Part IV: Revenge of the Nerds


    # Wiring your network with, uh, wires


    Way back in prehistoric times (circa 1996), you had to be technically savvy to
    wire your own network. Wiring consisted of coaxial cables like those for TV connections.
    Coaxial cables are bulky and require you to use special tools to attach the connectors
    to the cable ends.


    Life is easy now. Wiring your network requires that you obtain Cat 5 cables, which
    are similar in appearance to telephone cables. Cat 5 cables are manufactured with
    telephone-like connectors that are snap (pardon the pun) to use. No muss, no fuss.


    ![](img/cc58a1e8691061866010ce216f881372_225_0.png)


    You can buy Cat 5 cables at any electronics store. They come in all colors and
    sizes. Cat 5 cables aren''t cheap, but they aren''t terribly expensive, either.
    They''re reliable and much easier to work with than coaxial cables.


    You need to use a network switch or hub in conjunction with Cat 5 cables. Switches
    and hubs are the glue that holds your network together. Both switches and hubs
    connect individual computers so that they can communicate with each other.


    Most — if not all — of today''s networking equipment is based on the Ethernet
    protocol. You can purchase it from any consumer electronics store, mail-order
    catalog, or online seller. You don''t need to know any of the technical aspects
    of Ethernet because it requires no configuration. You need to know only that an
    Ethernet connector looks similar to a telephone jack. However, Ethernet and telephone
    jacks are not compatible.


    ![](img/cc58a1e8691061866010ce216f881372_225_1.png)


    One byproduct of a switch''s design is that it effectively makes your network
    faster. Network traffic flows only between the machines that are talking to each
    other. The computers that aren''t talking to each other don''t use the switch''s
    bandwidth. For example, when machine A is sending information to B, machine C
    doesn''t see any of the traffic.


    For your network, start by connecting your machines to a central switch. (You
    can use a hub if you want.)


    Although you can connect as many computers as your switch/hub can handle, to keep
    the job as simple as possible, the following steps wire two computers, Chivas
    and Atlas. The following instructions also assume that you have a switch or hub,
    plus at least two Cat 5 cables:


    +   1. On the first computer, plug one end of a Cat 5 cable into the Ethernet
    network interface connector (NIC) on the back of the machine.'
