    # Ten Problem Areas and Solutions


    In This Chapter


    +   * Finding Linux information

    * "I forgot my password"

    * "I want to boot into single-user mode via GRUB"

    * "I need to rescue my computer!"

    * "I want to change the GRUB boot order"

