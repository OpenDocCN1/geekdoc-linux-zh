    # Part I: Installing Red Hat Linux


    In Part I, you find out what Linux is and how to prepare your computer to install
    Red Hat Linux. We then walk you through the installation and show you basics of
    working with Red Hat Linux.


    # Part II: Got Net?


    In Part II, you will find out about connecting to the Internet and local networks.
    You see how to jump on the Internet with your everyday modem or high-speed (broadband)
    DSL or cable modem. We also show you how to connect to an existing network. If
    that local network has a high-speed Internet connection, you can use it as your
    portal to the wonderful world of surfing. The Internet can be dangerous, so we
    include instructions on creating your own firewall. Finally, we show you how to
    use Mozilla to satisfy your browsing and e-mail needs.'
