  md: '# Appendix D: Revving RPM 337


    +   6. Click the Update button, and the Preparing Systems Update window opens.


    The Package Manager determines which (if any) additional packages are needed by
    the package you''re installing. After the dependencies, the Completed System Preparation
    window displays the number of packages that will be installed and how much disk
    space they require.


    You can click the Show Details button to see a list of packages queued for installation.


    +   7. Click the Continue button.


    The Information window opens and you''re prompted to insert the necessary CDs.
    In this example, you''re asked to insert CD2


    +   8. Insert CD2 and click OK.


    The System Update Progress Installing window shows a progress meter.


    +   9. Insert additional CDs, if prompted, and click the OK button in the Information
    window.


    +   10. After the installation process is finished, the System Update window shows
    the Update Complete message.


    +   11. Click the OK button to return to the Package Management window.


    Until the advent of the RPM (and the Debian package manager on Linux systems),
    Linux software was distributed only by tar archives, which are sometimes referred
    to as *tarballs*, or more descriptively, *hairballs*. The tar file storage mechanism
    stores one or more files in a single file in a tar format. A tar file has the
    suffix `.tar`; if the file is compressed, it has a suffix `.tgz`. Using the tar-based
    distribution system is sufficient if your software doesn''t change often and you''re
    young. When you need to upgrade or change software or work with complex software
    systems, tar becomes quite difficult to work with. Rather than spend your life
    spitting out hairballs, use systems such as RPM to greatly simplify your life.


    # Removing an RPM package


    You can remove Hat packages as easily as you install them. Use the RPM erase (-
    ) function, which is the opposite of the install (+ ) function. The Package Manager
    removes a package when you select an uninstalled package. These steps describe
    how to remove a package:


    +   1. Click the GNOME Menu button and choose System Settings: Add/Remove Applications.


    +   2. Enter the root password in the Information window if prompted.


    The Package Management window opens.


    ![](img/cc58a1e8691061866010ce216f881372_360_0.png)


    ![](img/cc58a1e8691061866010ce216f881372_360_1.png)'
