  md: '# Chapter 15


    # # Creating Basic Linux Network Services


    # In This Chapter


    +   - Preparing a Network Server

    - Building an Apache Web server

    - Building a Linux file server with Samba

    - Building a Linux print server

    - Building a Linux DHCP server

    - Building a DNS server


    Inux was built from scratch with networking in mind, and therefore, its networking
    is both integrated and sophisticated. Linux also comes bundled with software that
    provides file sharing, printer sharing, and other functions. Thus, Linux gained
    initial popularity by inexpensive and reliably providing network services. Linux
    moved to the desktop only when applications such as word processing were written
    for it.)


    In earlier chapters, we show how to use a Red Hat computer with an existing network.
    We also show how to build a private network by using a Linux computer as the Internet
    gateway and firewall. In this chapter, we describe how to configure a Linux box
    to provide some popular services


    to the private network.


    # # Preparing a Network Server


    All the examples shown in this chapter can be run from any Red Hat Linux computer,
    such as the one we describe in Chapter 3 (The Red Hat Linux computer we describe
    there was configured as a personal workstation — we recommend using either the
    Workstation or, optionally, the Personal Desktop installation type. You can also
    use the Server type if you want to'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# 214 Part IV: Revenge of the Nerds


    build a computer that provides Linux services.) However, Linux doesn''t really
    care what your intentions are when you build your computer. Linux calmly does
    what it is told and even works as a server if you want.


    Linux works equally well whether it''s running a word processor or a Web server;
    the difference between them is just the software that''s used and how it''s configured.
    For example, you start the OpenOffice program when using your computer as a word
    processor, or you use the Apache program for Web services. In fact, you can run
    both programs at one time and do word processing while running a Web server.


    Regarding performance, maintenance, and security: Workstations and servers should
    run on dedicated machines, if possible. Workstations require a wider range of
    software than do servers. Your workstation is a jack-of-all-trades by nature.
    Servers work better when they''re configured to do just a small—preferably one
    or two—jobs.


    When you get to the point where your business and livelihood depend on providing
    networks, you want to build and dedicate machines for your purpose. However, until
    that time comes, you can use the simple workstation we describe in Chapter 3,
    which is what we assume you are doing for this book.


    You can configure the Red Hat Linux computer from Chapter 3 to provide services
    to a private network like the one we describe in Chapters 7 and 14. This chapter
    provides instructions on how to make the Apache Web server visible to the Internet.
    Services such as Samba, printers, and DHCP, however should definitely be kept
    private and not be shown to the.


    We also assume in this chapter that you''re connecting to the Internet through
    a private network described in Chapters 7 and 14. (Chapter 14 provides instructions
    for using a Red Hat Linux as an Internet gateway and firewall.) This chapter assumes
    you''ll be using this same computer to provide services to your private network.
    This assumption is a reasonable one for small-scale and home-office (SOHO) networks
    because the demands on a small PC by a small network are not excessive. Using
    a single computer for multiple purposes greatly simplifies the work you do and
    is the most efficient way to use your resources. (Otherwise, you have to start
    adding routing rules to the gateway.)


    Using a single Linux to act as an Internet gateway and network services is a cost-effective
    way of using your limited resources. This type of configuration is difficult to
    secure. Each function you place on a single machine increases the potential for
    vulnerabilities. Think of adding functions like adding doors and windows to a
    house: Building a house with a single door and no windows is more secure than
    a house with 5 doors and 15 windows. However, who want to live in a house? Security,
    like everything in life, is a matter of compromise. Please consult Chapters 5
    through 8, 16, and 19 for discussions on how you can increase security.


    ![](img/cc58a1e8691061866010ce216f881372_237_0.png)'
