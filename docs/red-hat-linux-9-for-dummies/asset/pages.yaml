    # Building a DHCP Server


    The Dynamic Host Configuration Protocol (DHCP) is a system that provides configuration
    parameters such as IP addresses and DNS addresses to computers. DHCP is used to
    simplify the process of connecting computers, printers, and other devices to networks.
    Rather than find and attach an IP address to each device on a network, you can
    use DHCP to automatically do the job for you.


    Chapter 3 discusses the steps in configuring the Red Hat computer''s network configuration.
    In that process, you will have to decide on an IP address (for example, 192.168.1.1),
    the netmask, default gateway, DNS servers, and so on. That process isn''t terribly
    when you have a network of two or three machines. When you start working with
    larger networks, you start duplicating a great deal of work.


    Using DHCP simplifies your job as a part-time network administrator. DHCP not
    only reduces the configuration work for every network device it also makes moving
    between networks easier. For example, if you switch your laptop between work and
    home, you need to switch network configurations, unless you use DHCP. If you use
    DHCP, your computer automatically picks up work or home network parameters.


    ![](img/cc58a1e8691061866010ce216f881372_250_0.png)


    The following sections describe how to set up a DHCP server and client. We use
    the default DHCP server configuration. DHCP can be programmed to provide more
    information than just an IP address. However, the basic DHCP server works well
    "out of the box" at providing basic network parameters.


    # Installing and configuring the DHCP server


    This section describes how to get your Linux DHCP server up and running. The basic
    DHCP system uses a dhcpd daemon to respond to client requests. The dhcpd daemon
    gets its configuration from the /etc/dhcpd.conf file.'
