  md: '# 130 Part III: Linux, Huh? What Is It Good For? Absolutely Everything!


    # Separation anxiety? Not with Linux


    The version of X that comes with Red Linux is both sophisticated and simple to
    use. This wasn''t always the case; in fact, it took lots of natural — dare we
    say Darwinian? — selection to arrive at the current arrangement of X, and the
    result worked well.


    # Introducing the Window System


    Red Hat gives you the option of using the GNOME and KDE desktop environments.
    GNOME and KDE, however, run on top of X, and runs on Linux. X is the software
    that provides the low-level graphical tools that systems like GNOME use. X is
    the middleware that makes it possible to build complex systems like GNOME.


    X is composed of three main parts:


    +   - The X server

    - A set of graphics libraries

    - A set of graphics applications that usually use the graphics libraries


    The X server is a program that talks to a bunch of important hardware — as the
    video card, keyboard, and mouse — on your system and runs interference between
    this hardware and the other graphics software.


    The X server commands from the set of graphics libraries that are associated by
    default with specified programs. Sometimes these programs are executed directly
    on the same system where the graphics device resides; at other times, these programs
    talk across a network to a graphics device on another system. Using X, you can
    run your program in one part of the world, and someone can see the output in another
    part of the world over the Internet.


    Suppose that you''re logged into a computer in Australia and you want to see what
    time it is there. You could run the date command (from a command line) to see
    the date and time, but that would be boring, you could run the xclock program
    on the remote machine and see a graphical clock displayed on your local computer.
    You can then verify that the Aussies use clocks that run clockwise and 24-hour
    days.


    The X server program, often called simply X, isn''t part of the operating system,
    as is in some other operating systems. Instead, the X server is a user-level program
    — although it''s special and complex.


    ![](img/cc58a1e8691061866010ce216f881372_153_0.png)


    ![](img/cc58a1e8691061866010ce216f881372_153_1.png)'
  merge: -1
