  md: '# # Chapter 8


    # # Fire, Fire! Heh-Heh,

    Firewalls Are Cool!


    In This Chapter


    +   - Introducing firewalls

    - Using the iptables firewall system

    - Designing filtering rules

    - Viewing -filtering rules

    - Automating your firewall

    - Testing your firewall


    After connecting to the Internet, you run the very real risk that the bad guys
    will try to break into your computer. The bad guys wear black hats, just like
    in the movies (as opposed to red hats, which are a bit odd but still cool). You
    may also have heard them called hackers, crackers, the Joker, and whatever. Whatever
    their names and whatever their intentions, the Internet is getting more dangerous
    every day, so ya gotta protect yourself.


    A firewall is a device that enables you to use the Internet while minimizing the
    possibility that the Internet will use you. Firewalls basically allow your network
    communications to go out but prevent anyone from opening unwanted connections
    into your computer or private network.


    Not surprisingly, this chapter describes how to build a firewall to help protect
    your Red Linux computer from the bad guys. First, in case you doubt that you truly
    need a firewall, we explain why firewalls are important. Then we introduce you
    to iptables, the Linux firewall system, and describe how to set up your filtering
    rules. After you set up your firewall filters, you need to know how to run the
    firewall automatically. You do that by setting up a script — something else we
    explain in this chapter. And, of course, what good would your firewall be if it
    didn''t work? So we show you how to do a simple test to make sure that your firewall
    is burning brightly.'
  merge: -1
  pgno: 138
- img_proc: true
  md: '# Understanding Why You Need

    a Firewall in the First Place


    You may think that there''s safety in numbers. After all, literally millions of
    people, businesses, and organizations are connected to each other through networks
    and the Internet at any given time. What do you — a simple person with a simple
    computer connected to the Internet — have to be concerned about? The bad guys
    are usually interested in big money or big popularity?


    Well, that''s all mostly true, and chances that you will never get hacked. In
    technical jargon, you''re relying on security by obscurity.


    However, many hackers have tools that automatically scan and attack entire networks.
    The happy hacker doesn''t have to work hard to find and exploit unprotected networks.
    Don''t risk owning — your computer broken into and controlled — by a hacker, especially
    when Linux provides effective tools for protecting yourself.


    Using a firewall is a simple but quite effective method for protecting yourself
    when you connect to the Internet. A firewall allows you to connect to the Internet
    while blocking unnecessary and unwanted connections from coming in.


    ![](img/cc58a1e8691061866010ce216f881372_139_0.png)


    Firewalls provide good bang-for-the-buck protection. However, they''re not the
    only security measure you should take. For example, locking your doors helps to
    protect against burglars is not 100 percent effective. You must add layers of
    security by locking your windows, using alarms, and keeping layers on neighborhood
    activities. Chapter 16 describes how to add security layers to your computer.


    ![](img/cc58a1e8691061866010ce216f881372_139_1.png)


    Linux is a multuser and multitasking operating system — more than one person can
    be logged in, and more one task can be run at the same time. This flexibility
    comes at a price: it offers an attractive launching point for hackers. If someone
    can gain access to your Linux computer while it''s on the Internet, that person
    can use your machine to launch attacks against other machines, and you become
    the proxy that helps the hacker hide their identity.


    # Building an Effective Firewall

    the iptables Way


    Linux comes bundled with a simple but extremely effective firewall system named
    Netfilter/iptables. The Netfilter part refers to the firewall system that''s built
    into the Linux operating system — the kernel, is exact —'
  merge: -1
  pgno: 139
- img_proc: true
  md: '# Chapter 8: Fire, Fire! Heh-Heh, Firewalls Are Cool! 117


    and iptables is the interface that controls it. We refer to the overall system
    as iptables because it is the part that you work with.


    The iptables system filters IP packets, which are the backbone of the Internet
    (IP stands for Internet Protocol, in fact). When you''re connected to the Internet,
    all the information (graphics and text) that you send and receive is sent in the
    form of IP packets. All the information that enters and leaves your computer via
    the Internet is packaged in the form of IP packets. You can use iptables to accept
    or deny IP packets based on their destinations, source addresses, and ports.


    iptables is effective because it uses *state filtering*, which means that the
    firewall can keep track of the state of each network connection. It''s a technical
    way of saying that iptables knows which IP packages are valid and which are not.
    For example, if you''re browsing www.dummies.com, iptables keeps track of all
    the packets that belong to that connection. The iptables utility can deny packets
    that are trying to reach your computer but don''t belong to your connection, preventing
    any hackers from sneaking through your firewall.


    Red Hat Linux installs an iptables-based firewall by default. The installation
    system config a medium level of protection during the installation process. You
    may recall from Chapter 3 that we advise you to use the default firewall configuration.
    However, the default firewall isn''t as secure as we would prefer for connecting
    to the Internet. We describe in this chapter how to construct a more comprehensive
    and secure firewall.


    The concept of ports is an essential part of the Internet Protocol. *Ports* are
    used to organize the communication between clients and servers. For example, when
    you click on a Web page, your browser communicates with the Web server by using
    a port. That is a gross simplification, course, but it describes how ports are
    used to control the internal workings of the Internet for such tasks as Web browsing.


    # LAN-ho: Adding firewall exists to a network


    Firewalls are especially important if you''re connecting to the Internet via a
    Local Area Network (LAN). Most Internet-connected LANs have a firewall that protects
    your computer from the worst aspects of the Internet. But a LAN''s firewall technology
    may not protect your computer; the danger of the insider threat


    always exists — not, not from evil tobacco but rather from their fellow LAN users.
    Running a personal firewall gives you an added layer of protection. For example,
    if you want to connect your computer to a university network, you definitely want
    to use a firewall because those environments are dangerous.


    ![](img/cc58a1e8691061866010ce216f881372_140_0.png)


    ![](img/cc58a1e8691061866010ce216f881372_140_1.png)


    ![](img/cc58a1e8691061866010ce216f881372_140_2.png)'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# 118 Part II: Got Net?


    # # Designing filtering rules: Permissive and restrictive methods


    Firewall-filtering rules are like the bricks (or asbestos, if you prefer) that
    build your firewall. Basically, filtering rules determine what network communication
    can go out of and come into your computer. restrictive method, from a security
    standpoint, the best way to create a firewall because you know exactly what access
    you''re allowing.

    When designing firewall-filtering rules, you can choose between two philosophies:


    +   - Allow all connections by default and deny specify access.

    - Deny all connections by default and then allow specific access.


    Allowing connections takes the view that it is best to start by allowing all communication
    with your computer and denying connections by one. (This method is used by the
    Red Hat firewall, which you create during the installation process.) The danger
    with this method is that you unintentionally allow dangerous traffic to reach
    your machine. The alternative method is to start by denying all communication
    and then selectively certain traffic. This more

    We explain in this chapter how to use the restrictive method, for two reasons:


    +   - It''s the safest method. The restrictive method is safer because nearly
    completely prevents scanning and other hacker attacks from accessing your computer.

    - It''s much easier to configure. iptables provides estatal filtering, you need
    to configure only two rules to create a safe firewall. However, you need to configure
    numerous individual rules when using the permissive model. Extra, unnecessary
    complexity makes for less security.


    # # Setting Up a Firewall


    What next you know that you need a firewall and want to create one. What''s next?
    The following sections explain how to set up an iptables-based firewall by using
    the restrictive model. This section describes how to manually create the firewall-filtering
    rules. When you''re done setting up your rules, the section “Saving your filtering
    rules to a script,” later in this chapter, that you don''t have to enter these
    rules every time you run on your computer.


    In this section, you design an iptables-based firewall that turns off all incoming
    connections on your modem but still enables you to establish an outgoing connection
    to the Internet. You must follow all the steps in this list or else the firewall
    is likely to prevent you from using the Internet:'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# Chapter 8: Fire, Fire! Heh-Heh, Firewalls Are Cool! 119


    1. Log in to your computer as root.


    2. Open a GNOME Terminal window by right-clicking on any empty portion of the
    desktop and choosing New Terminal from the menu.


    3. Make sure that you''re not already running a firewall by entering these rules
    at the command prompt in the window:


    ```

    iptables --flush

    iptables --flush -t nat

    ```


    The iptables entries remove any existing filtering or Network Address Translation
    (NAT) rules. NAT rules masquerade your network address as another address, making
    your computer appear to be used by someone else. NAT is frequently used to make
    your computer appear to be coming from your ISP so you don''t have to register
    your computer for an official Internet Protocol (IP) address.


    4. Filter out all network communication to, from, and through your computer by
    entering these rules:


    ```

    iptables --policy INPUT DROP

    iptables --policy OUTPUT DROP

    iptables --policy FORWARD DROP

    ```


    These commands set the default policy of your firewall not to allow any network
    traffic into (the INPUT rule) or out of (the OUTPUT rule) any network interface;
    nor is any traffic allowed to pass between multiple network interfaces (the FORWARD
    rule) if you have them. At this point, you have an extremely safe firewall. However,
    your computer is useless in terms of using it for any network-related tasks. The
    next step opens the firewall a little bit so that you can access the Internet
    (or any network you are attached to) in a safe way.


    5. Enter these rules to allow network traffic to pass through your loopback device:


    ```

    iptables -A OUTPUT -j ACCEPT -o lo

    iptables -A INPUT -j ACCEPT -i lo

    ```


    Linux uses an internal network interface called a loopback interface (lo). The
    loopback is not a physical device, but rather a virtual one. Linux uses lo for
    internal communications. (A great deal goes on behind the scenes on a Linux computer).


    6. Turn on all outgoing communication from your computer:


    ```

    iptables -A OUTPUT -m state NEW,RELATED,

    ESTABLISHED -j ACCEPT

    iptables -A INPUT -m state RELATED,ESTABLISHED -j

    ACCEPT

    ```'
