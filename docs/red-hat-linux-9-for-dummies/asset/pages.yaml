  md: '# 110 Part II: Got Net?


    5. Type ANY in the ESSID (Network ID) text box if you use an access point. Type
    the specific ESSID name for an ad hoc network.


    All machines connected to an ad hoc wireless network must share the same SSID.
    For example, you may choose the string mynetwork as your ESSID. In that case,
    you would enter mynetwork as the ESSID for all machines connected to an ad hoc
    network.


    6. Enter the encryption key in the Key text box and click the Forward button.


    You should obtain the encryption key from your network administrator. If you have
    set up your wireless home network, you can generate the key yourself. An encryption
    key is similar to a password and protects your wireless network from casual eavesdropping.
    Enter in the text box a key that is 13 characters or fewer — for example, this_is_a_key;
    using all 13 characters maximizes the encryption key''s effectiveness. Figure
    7-7 shows an example of the Configure Wireless Connection.


    Encryption keys are 40 or 128-bit binary numbers. They can be represented as text
    strings, as described in Step 6, or as a string of hexadecimal — numbers. Hex
    numbers are commonly used in computer science to represent binary numbers. For
