- img_proc: true
  md: '# 302 Part VI: Appendices


    +   - Central processing unit (CPU): The CPU, or microprocessor, is often referred
    to as the brains of a computer because the CPU controls, in detail, everything
    the computer does. CPUs are controlled by software that is essentially a recipe
    for doing tasks as simple as detecting keyboard input or as complex as communicating
    across networks to display pictures in a Web browser.


    The most common CPUs are now Intel Pentiums, which you''re using to run your PC.
    Generally, the faster the CPU, the faster your computer. CPU speed is measured
    in megahertz (MHz), which means millions of cycles per second. To perform tasks
    such as sending e-mail, a CPU has to perform many simple tasks, or instructions.
    The simplest instructions require a single CPU cycle; most take several. However,
    the MHz measurement is a reasonably good measure of how fast a microprocessor
    runs.


    +   - Hard disks — also referred to as hard drives — store bits and bytes in tiny
    magnetic domains (spots). Hard disks are metal platters that store data. The disk
    spins, and a magnetic head that floats on a cushion of air reads and writes from
    the disk. The spinning disk allows the head to quickly access any location on
    the disk and also creates the air cushion.


    +   - Disk controllers: The disk controller connects the drive to the computer''s
    microprocessor. Several types of controllers are commonly used: IDE, USB, FireWire,
    and SCSI. Most PCs with IDE internal hard drives. high-performance computers tend
    to use SCSI-based drives because they''re faster (and more expensive). IDE controllers
    can connect as many as four drives.


    +   - CD-ROM: CD-ROMs store information like hard drives do, but in optical rather
    than magnetic form. Most PCs use IDE-based CD-ROMs. SCSI CD-ROMs are faster, just
    like SCSI hard disks. Because the prices of USB and FireWire CD-ROMs are dropping,
    they''re becoming more common.


    +   - RAM, or Random Access Memory: RAM is much faster than hard disks and CD-ROMs.
    Because RAM is used to store temporary information, programs, data, and other
    types of information are stored in RAM — it “forgets” everything when power to
    the computer is turned off.


    +   - Mouse: What type of mouse do you have — bus, PS/2, or serial? How many buttons
    does it have? If you have a serial mouse, which COM port is it attached to, and
    which protocol (Microsoft or Logitech) does it use?


    +   - Monitor: What are the make and model of the monitor? What are its vertical
    and horizontal refresh rates? You need this information only if you plan on using
    the graphical portion of Linux, X Window System.


    +   - Video card: What are the make and model of the video card or video chip
    set, and what is the amount of video RAM?'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# Appendix A: Discovering Your Hardware 303


    Network interface card (NIC): If you have a network connection, what are the make
    and model number of the network interface card?


    That''s the rundown of computer subsystems. Each one performs a specific function;
    buttoned up inside a computer chassis, they work together to create the computer
    you''re familiar with. The next two sections describe hard drives and memory in
    more detail.


    # Understanding Hard Drive Controllers


    The two main types of hard drives are IDE and SCSI, and each type has its own
    controller. IDE is more common in PCs, and newer PCs usually have two IDE controllers
    your system can have only two hard drives: a master and a slave. Therefore, a
    PC with two IDE controllers can have as many as four hard drives. You should know
    which drive is which. Also, if you have a Windows system you want to preserve,
    you should know on which hard drive it resides. The following is the normal configuration
    on a Windows system:


    +   - The first controller''s master drive is named C.

    - The next hard drive is named D and is the slave drive on the first controller.

    - The next hard drive is E and is the master drive on the second controller.

    - The last hard drive is F and is the slave drive on the second controller.


    Normally, Windows is located on your C drive and data is on your other drives.
    This lettering scheme is just one possibility; your hard drives may be set up
    differently and may even include CD-ROMs as drives on your IDE controllers.


    Some high-end PCs have a SCSI controller on the motherboard or on a separate SCSI
    controller board, either in addition or instead of the IDE controllers. Older
    SCSI controllers can have as many as eight devices on them, numbered from 0 to
    7, including the controller. Newer SCSI controllers (known as wide controllers)
    can have as many as 16 devices, including the controller itself.


    If all you have is a SCSI hard drive, drive 0 or drive 1 is usually your C drive,
    and others follow in order.'
  merge: -1
