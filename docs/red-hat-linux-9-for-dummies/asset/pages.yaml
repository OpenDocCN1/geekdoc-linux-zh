  md: '# Chapter 7: Connecting to a LAN


    # 4. Click the Statically Set IP Addresses radio button.


    You should ask your friendly local system administrator (unless you''re the administrator,
    in which case you might want to avoid talking to your-self) which system network
    uses.


    Life is a bit more complicated if you have both a wireless and an Ethernet NIC
    on your computer. You can run both devices at one time, but the configuration
    is much more difficult. You can solve the problem by clicking the Automatically
    Obtain IP Address Settings With radio button that the dot disappears. This simple
    mouse click prevents the Ethernet NIC from starting automatically.


    # 5. Assign an IP address to your computer by typing it in the Address text box.


    IP addresses are analogous to street addresses: They provide a number that uniquely
    distinguishes your machine from all others. Private IP addresses don''t require
    any registration with the powers that be — the InterNIC organization distributes
    IP addresses. Public IP addresses aren''t routed on the Internet and can be used
    for LANs for your use.


    If you''re on a network with registered IP addresses, be sure to get an IP address
    from your system administrator. Otherwise, go ahead and use a private address.
    (Use any Class C between 192.168.1.1 and 192.168.254.254; for example, 192.168.128.15
    or 192.168.1.20).


    Private IP addresses in this range are designated for use by private networks.
    By design, private IP addresses don''t get routed (sent from one machine to another)
    through the Internet, and anyone can use them. Private IP addresses would wreak
    havoc on the Internet if they were routed.


    # 6. Type 255.255.255.0 for the mask for your IP address in the Subnet Mask text
    box.


    The Internet Protocol (IP) defines only three network address classes: A, B, and
    C. Only Class C addresses are assigned by the InterNIC. Use the 255.255.255.0
    for mask Class C, 255.255.0.0 for Class B, and 255.0.0.0 for Class A.


    Class C masks are used almost universally now, and we use only Class C addresses.
    If you''re not using a Class C address, you''re probably experienced in the years
    of TCP/IP and know which mask to use. Godspeed. Otherwise, don''t fool with Mother
    Nature: Use a Class C address.


    # 7. In the Default Gateway Address text box type the IP address of the Internet
    gateway for your LAN.


    The Internet gateway is the device (router or computer) that connects your network
    to your ISP and the Internet. Obtain the address from your system administrator
    if you''re at work and have one. If you''re a home user, a typical convention
    is to assign the highest address — 254 — of a Class C subnet as the gateway. For
    example, type 192.168.1.254.


    ![](img/cc58a1e8691061866010ce216f881372_130_0.png)


    ![](img/cc58a1e8691061866010ce216f881372_130_1.png)


    ![](img/cc58a1e8691061866010ce216f881372_130_2.png)


