  md: '# Building an Apache Web Server


    The Web is the Internet, and the Internet is the Web. Well, that''s not completely
    true because the Internet provides the foundation for widely used functions, such
    as e-mail. However, the Internet became immensely popular because of the World
    Wide Web (WWW).


    The Web isn''t as mysterious as it may seem at first. It''s essentially all the
    world''s Web servers that are connected to the Internet. The Internet serves the
    same function as the world''s telephone system: it interconnects everyone. You
    can think of Web servers as the telephones that allow people to contact each other,
    businesses, and other organizations. Just as you can start a business or organization
    and let people contact you via your phone, you can also allow people to contact
    you via your Web server. This section describes how to construct a simple Web
    server.


    Describing how to set up anything more than a simple Web server is beyond the
    scope of this book. Needless to say, you can configure Apache to provide a whole
    world of Web services. If you want to utilize the powers of Apache, consult such
    books as the excellent Apache Server 2 Bible, by Mohammed J. Kabir, published
    by Wiley Publishing, Inc.


    ![](img/cc58a1e8691061866010ce216f881372_238_0.png)


    # Installing and starting the Web server


    Linux provides the ideal platform for providing Web services. The Apache Web server
    system is bundled with Red Hat Linux. Apache is easy to set up and use. These
    instructions show you how to install and configure a basic Web server:


    +   1. Log in as root and mount the appropriate CD that accompanies this book.

    2. Install the Apache RPM packages. Consult Appendix D for instructions on installing
    RPM packages.


    You can manually install the Apache packages by starting a GNOME Terminal emulation
    and running this command:


    ```

    rpm -ivh /mnt/cdrom/RedHat/RPMS/httpd*

    ```


    +   3. The Apache RPM package puts all the configuration files in place, so all
    you have to do is start the appropriate daemon. Enter this command from the GNOME
    Terminal window:


    ```

    /etc/init.d/httpd start

    ```'
