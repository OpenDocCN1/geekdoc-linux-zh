  md: '# Preparing Your Hard Drive for Red Hat Linux


    Before you install Red Hat Linux alongside Windows, you need to get your hard
    drive ready. This list provides an overview of the disk preparation process:


    +   1. Put on a red fedora.

    2. Back up your computer.


    The processes we describe in this chapter should not affect your Windows installation.
    However, you can never be too safe in dealing with your precious files, so you
    should back them up. It''s beyond the scope of this book to describe how to back
    up a Windows computer, so we leave it up to you to get it done. Several good Windows
    products are available for making backups. One good product that both backs up
    and partitions your computer is Norton Ghost 2002. A side benefit of Ghost is
    that you can use it to partition your hard drive.


    +   3. Determine how your Windows computer''s hard drive is formatted.

    Windows uses two types of formatting: FAT (File Access Table) and NTFS (NT File
    System). FAT is older and less advanced than NTFS, however free tools are available
    for resizing FAT-based disks to make room for Linux. You have to purchase commercial
    software to repartition NTFS systems.


    +   4. Defragment your disk.

    All resizing programs require you to defragment your disk before proceeding. Over
    time, the bits and bytes that compose your files tend to get scattered around
    your hard drive. Resizing may not work or even cause problems if your computer
    has too much fragmentation.


    +   5. Partition your computer''s hard drive to make room to install Red Hat Linux
    if you want to install it alongside Windows (or another operating system).


    You can use either destructive or nondestructive resizing to make room for Linux.
    Destructive resizing wipes everything your hard drive and starts fresh. Nondestructive
    resizing uses Windows utilities to dynamically shrink the existing partition and
    then uses the free space to make a new Linux partition.


    The Open Source — FIPS (First nondestructive Interactive Partition Splitting)
    program is supplied with the full Red Hat Linux distribution to repartition FAT
    disks. You need to use commercial utilities, like PartitionMagic or Norton Ghost,
    to repartition NTFS disks; both these programs also work on FAT systems.'
  merge: -1
