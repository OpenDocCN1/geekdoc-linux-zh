    # Reading your logs


    You are your best IDS. Log files store information about nearly every one of your
    Red Linux systems. Reading your logs lets you discover what has happening on your
    computer and is one way to detect intrusions.


    Unfortunately, logging files is somewhat akin to reading tea leaves. There''s
    no mechanical method for sitting through log file tea leaves. You have to look
    for unusual and suspicious occurrences. As you read, you learn about what is usual
    and, of course, unusual. Experience counts for everything.


    Red Hat provides two reasonable systems for viewing log files:


    +   - Logwatch: Logwatch is an e-mail-based log alert system. It sifts through
    the log files in /var/log and emails the root user any alerts or errors. You can
    configure the Logwatch operational parameters to better fit your operation. However,
    the default works well at alerting you to the happenings on your computer.


    +   - Red Hat Logviewer: The Logviewer graphical utility provides one-stop shopping
    for all the standard log files. Logviewer is a manual tool that helps you to remember
    which log files to look at.


    # Using Logwatch


    Logwatch is installed during the Red Hat installation process by default. Logwatch
    is a Perl script that''s run nightly by cron. It reads every log file in /var/log
    directory and picks out items that it thinks interesting.


    The Perl script is in /etc/log.d/scripts/logwatch.pl. The soft link --logwatch
    — in the /etc/cron.daily directory directs the cron system to run the script nightly.'
