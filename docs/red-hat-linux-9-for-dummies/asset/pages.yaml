  md: '# Chapter 16: Securing Your Future 241


    open. When no door is unlocked, the hacker looks to pick the easier locks. Your
    job is to make sure your doors and windows are locked and not easily picked. The
    former option is taken care of by running firewalls and using passwords. The latter
    requires constant supervision. Today’s software is powerful and, thus, necessarily
    complex. Complexity breeds errors, and with errors some vulnerabilities. Because
    the only certainties in life are death, taxes, and buggy software, the bugs need
    to be fixed whenever possible. We all need to constantly update our software when
    errors are found and corrected.


