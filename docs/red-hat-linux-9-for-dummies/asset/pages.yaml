    Linux runs in three different states: 1, 3, and 5 (referred to as run levels).
    Each level is used to perform different functions. Level 1 (also single-user mode)
    Linux operates with a minimum of processes so that you can make configuration
    changes and debug problems. Level 3 is essentially the same as Level 5 except
    that Level 3 doesn''t need to run the X server — it nongraphical. You typically
