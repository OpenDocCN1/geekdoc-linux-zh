    # Giving Red Hat Linux the Boot


    To boot a computer means simply to start it (and to reboot means to restart it).
    Follow these steps to boot your Red Hat Linux system for the first time:


    +   1. Make sure that your computer is turned off.


    +   2. Turn on the power to the monitor and then turn on the computer''s main
