  md: '# Chapter 14: Building Your Own, Private Network 203


    2. Plug in the other end of the cable into the switch.


    A green light should appear near the connector you used on the switch. The green
    light indicates that you have link status. Link status means that an Ethernet
    connection has been established — you have an active connection between the computer
    and the switch.


    If you don''t get a link status, make sure that both connectors on the cable have
    been properly inserted. Pull each connector out and firmly press it back (called
