  md: '# Chapter 14: Building Your Own, Private Network


    If we use a Wi-Fi NIC on Cancun, we can assign the network name (ESSID) wifi and
    the encryption key iamnotanumber.


    +   2. Configure the default route on each device to point to the Internet gateway.


    +   3. Rinse and repeat these steps for each computer on your private network.


    After you have configured your Internet gateway and each additional computer on
    your private network, you should test whether they can communicate with the Internet.
    Consult Chapter 18 for pointers on troubleshooting network problems if you encounter
    difficulties. After you''re satisfied that you have your LAN connected to the
    Internet, then puppy off. You still need to set up your firewall (described in
    the next section) because you don''t want to stay without one.


    # Protecting your LAN with a firewall


    After you have configured your gateway for IP forwarding, you need to protect
    yourself from the Internet. This section describes how to turn your gateway into
    a firewall. We use the same process and many of the rules we describe in Chapter
    8; however, this firewall is designed to protect your entire network, whereas
    the one in Chapter 8 is oriented toward protecting a single machine.


    The firewall script contains both of the filtering rules that help prevent hackers
    from invading your computer and network. The firewall also provides network address
    translation (NAT) function, which allows the computers on your private network
    to access the Internet. NAT, if you recall, converts the nonroutable source IP
    addresses (192.168.1.1, for example) into the routable source IP address of your
    Internet connection.


    Network address translation is also referred to as IP masquerading, or simply
    masquerading.


    The basic configuration of the firewall we describe in Chapter 8 works in the
    new configuration. The firewall performs these functions:


    +   Block incoming, outgoing, and forwarded packets: Start by blocking all network
    traffic by default. This firewall completely protects your private network but
    also makes it completely useless! Start with this policy to ensure that the firewall
    blocks all except the connections you explicitly allow.


    +   Allow all loopback traffic: You must allow all network traffic on the Internet
    gateway''s loopback interface. The loopback interface is used by the Linux operating
    system for its own, internal communication.


    ![](img/cc58a1e8691061866010ce216f881372_234_0.png)'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# 212 Part IV: Revenge of the Nerds


    +   Allow all internal NIC traffic: Machines on the private network use the internal
    NIC to communicate with the gateway. You don''t want to restrict traffic on the
    private network, although you may decide to do so if your security policies demand
    it.


    +   Allow all outgoing traffic through the firewall: Allow all machines on the
    private network to connect to the Internet through the gateway''s external NIC.
    The firewall allows all outgoing connections. Because the firewall is stateful
    (it keeps track of which connection each packet belongs to), it allows the return
    packets back into the private network. You can add rules to restrict outgoing
    traffic if your security policies require it.


    +   Use NAT for outgoing connections: Create a NAT rule to make all connections
    originating from the private network appear to be coming from the Internet gateway.
    All private network machines will have their source address and port numbers changed
    to that of the gateway.


    The network address translation isn''t necessary if your connection device (telephone,
    DSL, or cable modem) performs NAT. However, by providing a NAT filtering rule,
    you ensure that your Internet gateway will with any connection device — whether
    or not it performs NAT.


    +   Allow incoming SSH connections: Secure Shell (SSH) is a protocol for encrypting
    network connections.


    The firewall on the Internet gateway is identical to the firewall we describe
    in Chapter 8, except that you must create an extra set of rules for the second
    NIC.


    Enter each filtering rule on your Internet gateway. Be sure that you enter the
    rules from the Linux computer''s console because if you use a network connection,
    you may accidentally block your connection while modifying the firewall.


    After you complete the process, save the rules so that they''re started every
    time you boot the computer. This command saves the rules to the /etc/sysconfig/iptables
    file:


    ```

    iptables-save > /etc/sysconfig/iptables

    ```


    You can now restart your Internet connection. Your private network can now access
    the Internet and be reasonably — but not completely — protected from the bad guys.'
