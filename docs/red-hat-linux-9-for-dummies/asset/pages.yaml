  md: '# 326 Part VI: Appendixices


    # Understanding user rights and permissions


    This chapter explains how to mount and unmount a file system from a floppy disk.
    However, these instructions assume that you''re mounting a vanilla (your average
    PC) system. You can specify other options. Here''s a short description of each
    option:


    No special device file support: The device files in the /dev directory are created
    with specific permissions in order to enhance system security. This option prevents
    other, nonsecure device files from being used to mount a file system.


    **Read-only:** The file system is mounted as read-only. You can''t write to the
    file system.


    **setuid programs allowed:** This option is an important security feature. When
    an executable Linux file has setuid bit, any regular user who belongs to the same
    group can run it. If root owns the file, then whatever that file does is done
    with the power of root. Files with setuid permission present big security holes.
    This option prevents files on the file system from exercising their privileges.


    **User mount:** When this option is set, any user in addition to root can mount
    the partition. This option is useful when regular users must be able to mount
    devices, such as CDs and floppy disks.


    **Mountable by device owner:** A regular user who owns the device file (for example,
    /dev/fd0) can mount the file system.


    **User quota enabled:** This option enables Linux quotas. Quotas allow limits
    to be set on what resources individual users can access.


    **Not mount at boot time:** Red Hat Linux doesn''t automatically mount the file
    system when it boots.


    **No program allowed to execute:** A regular user isn''t allowed to execute files
    found on a file system. You may want to allow a regular user to mount a device
    (such as a CD) but not execute programs on the device for security reasons.


    **Group quota enabled:** This option enables quotas to be set for groups.


    After a few seconds, the button changes from Unmount to Mount to show that it
    has unmounted.


    # 4. Click the Exit button to leave the utility.


    The file system is unmounted. If the file system was a removable type, such as
    a floppy disk or CD, you can remove it. Otherwise, the file system is simply not
    available for use until you remove it.


    > You can run the eject command from a bash shell to eject a CD from its drive.
    You have to unmount the CD first and then enter the eject command. Otherwise,
    to eject a CD, you must unmount it and then press the eject Button on the CD-ROM
    drive. In either case, you can''t eject the CD until you unmounted it.


    ![](img/cc58a1e8691061866010ce216f881372_349_0.png)'
  merge: -1
