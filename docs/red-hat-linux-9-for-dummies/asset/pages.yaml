  md: '# Chapter 14: Building Your Own, Private Network 207


    +   1. Mozilla works with Linux to look up the address — via the Domain Name Service
    (DNS) — which translates to 216.148.218.195 or 216.148.218.197.


    +   2. Chivas compares its to its internal routing table. The operating system
    directs network traffic to the default route if the address doesn''t match its
    local networks.


    In this case, neither 216.148.218.195 nor 216.148.218.197 matches any internal
    route, so all traffic for the browsing session is directed to the default route.


    +   3. On your private network, the default route of each host is directed toward
    the Internet gateway, Atlas. All the network packets that Chivas produces are
    destined for the Internet, for example, are sent to Atlas.


    +   4. The Internet gateway Atlas receives the outbound packets from Chivas on
    its internal connection and forwards them to its external connection. Packets
    going through its external connection are directed to the innocent.


    +   5. Atlas (192.168.1.254) also converts the source address of packets from
    Chivas (192.168.1.1) to the source address of its external connection. For, if
    Atlas has a DSL Internet connection with an address of 10.0.0.213, the source
    address of Chivas packets is changed to 10.0.0.213. (This supposedly external
    Internet address has been protected from the innocent.)


    +   6. The packets to get their intended destination. The www.redhat.com server
    responds to the query and sends back the requested information.


    +   7. Atlas receives the return packets, converts its destination address back
    to that of Chivas, and forwards them to the private network.


    +   8. Chivas receives the packets, and the browser displays the information.


    When Atlas is wearing its gateway hat, it performs two primary functions: it routes
    network traffic between its internal and external network connections, and it
    converts internal LAN addresses to external Internet ones. The following section
    describes how to configure your gateway to perform these functions.


    # Forwarding network traffic through your gateway


