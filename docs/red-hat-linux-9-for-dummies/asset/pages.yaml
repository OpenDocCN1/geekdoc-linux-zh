  md: '# Chapter 9: Gnow GNOME 147


    You can install the APM client in the GNOME Panel to monitor your laptop''s battery:


    +   1. Log in to your computer as any user.

    2. Right-click the GNOME Panel and choose Add to Panel: Utilities Battery Charge
    Monitor.

    3. An icon that looks like — you guessed it — a battery is added to the panel.


    The Battery Charge Monitor icon displays state of your battery. APM starts beeping
    frantically when your power level goes below 10 percent.


    You can use APM to place your computer into one of two power modes:


    +   * Suspend: Saves your computer''s current state on disk and turns the power
    off. When you turn the power back on, your computer''s last state is recovered
    from disk and your computer starts in where you left it. Suspend mode turns off
    power to your computer and saves the maximum amount of energy; it also makes your
    computer quiet.

    * Standby: Places the state in memory and reduces power. You only need to press
    any keyboard key or move the mouse to start your computer again. Your computer
    returns to normal operation more quickly than it does from Suspend. Standby doesn''t
    save as much power and is noisier because your computer''s fans continue to operate.


    You use this function on both laptop and desktop computers. No default GNOME icon
    or menu allows you to use the power-saving mode without being the root user. Therefore,
    use the GNOME Terminal to use APM:


    +   1. Click the GNOME menu and choose System Tools: Terminal.

    2. If you''re not already logged in as root, do so now:

    3. Run this command to suspend your computer, saving the maximum amount of power:


    ```

    su

    ```


    Note that the case of the apm option is important: Using a lowercase s suspends
    the computer, and an uppercase S places it in Standby mode.


    Alternatively, you can use Standby mode:


    ```

    apm -S

    ```


    When you want to return your computer to a working state, press the power button
    to return from Suspend or press any key or move the mouse to come back from Standby.'
