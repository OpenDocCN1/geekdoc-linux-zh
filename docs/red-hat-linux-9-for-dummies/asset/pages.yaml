  md: '# Chapter 3


    # Ready, Set, Install!


    In This Chapter


    +   - Deciding on your Red Hat Linux installation steps

    - Starting the Red Hat Linux installation process

    - Automatically selecting Linux partitions

    - Configuring your network

    - Configuring your system options

    - Going beyond the point of no return

    - Configuring your graphics system

    - Finishing the installation


    Installing Red Hat Linux isn''t rocket science — it''s more like astrophysics.
    No, no — just kidding. Don''t run — just relax, sit down, grab your favorite drink,
    and contemplate the fun you''ll be installing Red Hat Linux. After you''re done,
    you''ll have a powerful computer that''s capable of performing most, if not all,
    of your daily computing chores — all for the cost of this book! That''s pretty
    amazing when you think about it: For a few dollars, you get the same amount of
    operating power that cost megabucks a few years ago.


    This chapter walks you through the process of using the Workstation installation
    of Red Hat Linux. (You can use the Personal Desktop installation type, but you
    may have to manually install the software development tools later on.)


    ![](img/cc58a1e8691061866010ce216f881372_54_0.png)


    Before getting started, you should know that you can easily change your configuration
    choices. If you realize that you have made a mistake, you can click the Back button
    to retract your steps and redo your choices. And, if you ever want to stop the
    installation process, you can simply reboot your computer.


    The point of no return comes at the end of the process, when the configuration
    is written to your hard drive (see the later section "Installation Stage 5: The
    Point of No Return!") and the installation software starts to partition your hard
    drive and write Red Hat Linux to it. If you stop at that point, you will need
    to reinstall an operating system before you can use the computer again.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# 32 Part I: Installing Red Hat Linux


    # For installation masochists and text snobs only


    You can run the Red Hat Linux installation system from either a graphical or text-based
    interface. If the installation process successfully detects your graphics hardware,
    the graphical method is selected automatically, and that''s what we discuss in
    this. In addition to the ease of using a mouse to point and click, the graphical
    method groups similar configuration choices. For example, the keyboard and mouse
    selections are presented within one window, not two, as in the text-based installation.


    +   - The Red Hat Linux installation system can''t use your graphics adapter.
    You figure this out when the graphical installation window doesn''t appear, but
    a text-based window does appear; you use the keyboard to enter information and
    the cursor (arrow) to move from step to step. This doesn''t happen often any because
    the folks at Red Hat have done their homework and refined the installation process,
    or your computer may prove to be the exception.


    You may have to use the text-based installation, for these reasons:


    +   - Your mother told you never to point and click.


    You can select the text-based installation method by typing text at the boot:
    prompt.


    # Choosing an Installation Type


    Red Hat provides several installation types to choose from. Although we think
    that you can probably get away with less space on your system, we decided to give
    you the minimum system requirements Red Hat suggests for each installation option:


    +   - Server: Creates an operating system environment for computers that provide
    services as hosting Web pages. This installation requires 1.3GB of free space
    if you want only minimal bells and whistles, at least 1.4GB of free space if you
    want to install all the bells and whistles except X, and at least 2.1GB to install
    all the bells and the whistles and throw in the Acme Bell and Whistle Factory
    (which includes GNOME and KDE).


    +   - Custom: Installs a minimum base of software and requires you to select additional
    services, utilities, and applications. You need 350MB of free space for a minimal
    installation and at least 3.7GB of free space if you want to install all the bells
    and whistles.


    +   - Upgrade: Updates the Red Hat Linux software that is already installed on
    a computer but leaves all existing settings, users, and data alone.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# Chapter 3: Ready, Set, Install!


    +   * Personal Desktop: Installs Red Hat Linux but excludes the software development
    tools. (You have many of the bells and whistles, but you may not be able to use
    some applications.) If you install either GNOME or KDE, you need at least 1.7GB
    of free space. If you want both, you need 1.8GB.


    +   * Workstation: Creates an operating system environment for computers and laptops
    used as workstations for personal use. This version includes the software development
    tools you need to run certain applications. If you install either GNOME or KDE,
    you need at least 2.1GB of free space. To install both, you need at least 2.2GB.


    ![](img/cc58a1e8691061866010ce216f881372_56_0.png)


    The difference between the Workstation and Personal Desktop types is that Workstation
    installs software development tools and Personal Desktop doesn''t. We encourage
    you to use the Workstation installation option because you need some of the software
    development tools to configure many of the applications described in this book.


    Both the Workstation and Personal Desktop installation types automate otherwise
    horrifically complicated decisions that no sane person would want to haggle with,
    such as how to partition your hard drive and select software. The installation
    includes the GNOME graphical user interface (GUI) and all the tools that an average
    computer user (that''s you) needs to survive. If you want software that the installation
    doesn''t provide, you can always add packages later.


    # # Installation Stage 1: Starting

    the Installation


    Before you install Red Hat Linux, you need to boot or reboot your computer with
    the CD that comes with this in your CD-ROM drive. The instructions in this section
    describe how to start installing Red Hat Linux on your computer.


    This section gets you started with the Red Hat Linux installation process. Use
    these initial steps to start the installation and perform some basic configuration:


    +   1. Insert CD1 that came with this book (or a boot floppy disk if you''re using
    one) and boot or reboot your computer.


    After your computer thinks for a while, the first installation screen appears,
    displaying a welcome message, some options, and the boot prompt.'
