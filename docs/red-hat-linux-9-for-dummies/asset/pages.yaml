  md: '# 120 Part II: Got Net?


    These rules don''t specify any particular network interface. However, because
    this filter is stateful, these rules effectively work on your Ethernet, wireless,
    or a dial-up Point-to-Point (PPP) interface.


    The first filter rule permits all outgoing communication. The -state NEW, RELATED,
    ESTABLISHED option tells the firewall to allow packets of both new and already
    established connections to pass. (Packets are the basic part of all network communication.)
    Packets that are related to existing connections but use a different port, such
    as FTP data transfers, are also permitted.


    The second filter rule controls the packets coming back from outgoing connections.
    When you connect to a Web site, for example, your browser sends out packets, and
    the Web server responds to them. You can click a button on the Web site, and a
    new display pops up. A button sends a packet out, and the Web server sends packets
    back. You have previously blocked packets from the Internet. This rule creates
    an exception that allows packets that belong to an existing connection — such
    as the connection that represents you clicking a button — to return to your computer
    through the firewall. Note that we don''t allow incoming connections (-state NEW)
    to be established because would defeat the purpose of this firewall.


    # 7. (Optional) Use the following rule to allow SSH connections to your Linux
    computer:


    ```

    iptables -A INPUT -p tcp -m state --state NEW,ESTABLISHED

    -j ACCEPT --dport 22

    ```


    This rule permits SSH connections on Port 22 to enter into your computer.


    Start the OpenSSH server by running this command:

    /etc/init.d/sshd start


    You can modify this rule to allow other types of incoming connections to your
    computer. For example, add a new rule using -dport 80 and the firewall allows
    incoming HTTP packets. All you need to do is install the Apache Web server (included
    on the companion CD and described in Chapter 16) and your workstation morphs into
    a Web server.


    You have just created a simple'
