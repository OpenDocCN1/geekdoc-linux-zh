  md: '# Books and more books


    When we were working with computers many years ago, the number of books about
    computers could fill little more than one bookshelf, and they were mostly about
    the electronics of the hardware itself. Networking texts concerned on subjects
    such as the probability of two Ethernet packets colliding and not how to build
    simple networks. Hardly any books about computers were ever in the popular bookstores.
    Thousands of books on computers are available now; most describe the software
    and its interactions, with the hardware taking a back seat. Books like the Dummies
    series aren''t just for bookstores any more. You can also find them in mass-market
    venues, such as Wal-Mart.


    One great source for information about Dummies books is the television series
    The Simpsons. That shows Dummies authors in particular and provides an amazingly
    accurate portrait of us. D''Oh!


    Perhaps you looked at other books before you bought this and were intimidated
    by their use of technical terms. Or you thought that the other books were too
    general for what you want to do and you want something more task oriented. You
    may want to look over those books again because your knowledge level will be higher
    after reading this book. TCP/IP networking, compiler design, operating system
    theory, formal language theory, computer graphics, and systems administration
    training are all topics you can study in depth when when you have a Linux computer
    at your disposal.


    Many books specifically about the Unix operating system are partially or completely
    applicable to Linux, such as books on Perl, a comprehensive interpreter. By getting
    one (or more) books on Perl and sitting down with your Linux system, you have
    both a new tool for doing your work and a new appreciation for a complete programming
    language. If you want to find out how to write Perl, you can just view the source
    code.


    # Linux HOWTOS


    Don''t forget about the Linux HOWTOS, which which come in the commercial version
    of Red Hat Linux. These excellent guides to Linux are covered under the Linux
    Documentation Project — (LDP) — copyleft, which means that you can print them.


    # School days


    Another way to find out more information about Unix and Linux is to take a course,
    perhaps at a local community college. Many colleges offer courses in Unix, and
    some have started using Linux to teach the Unix courses. You can


    ![](img/cc58a1e8691061866010ce216f881372_303_0.png)'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# Chapter 18: Ten Problem Areas and Solutions 281


    do your homework on your system at home, or if you have a notebook (laptop computer),
    you can work anywhere. (Jon typed text for the first edition of this book in a
    hotel in Auckland, New Zealand, and updated text for the second edition in the
    United Airlines lounge in Chicago.) What we would have given during college for
    the chance to do computer projects while sitting in the comfort of our own pub
    — er, dorm rooms. Instead, we had to sit in a room with a bunch of punch-card
    machines . well, never mind. We would have been much more comfortable and productive
    with a Linux system.


    # In the news


    You can obtain additional information about the Linux operating system from mailing
    lists and newsgroups on the Internet. In fact, one of the first popular uses of
    the Internet was the Usenet information-sharing system. Usenet is similar to the
    World Wide Web that it uses a set of protocols to perform a special type of communication
    over the general-purpose Internet. Usenet provides the ability for lets people
    to participate in discussions via e-mail. People post messages to a specific interest
    group that anyone can view and respond to.


    News groups and mailing lists are dedicated to specific topics — technical and
    any topic that two or more people (one person with multiple personalities) are
    interested in. Dozens of newsgroups and mailing lists are de novo to Linux topics.
    Searching these groups often provides laser-like answers to your questions. That''s
    because likely that someone else has likely encountered your problem and found
    a solution to it. You can also post your questions to newsgroups when necessary.


    You can search for newsgroups at, for example, www.dejnews.com and www.mailgate.com.
    Google also provides an excellent mechanism to search groups, named Google Groups.
    Go to Google Groups at (www.google.com/advanced_group_search).


    Don''t neglect to directly check the Red Hat mailing lists, at https://listman.redhat.com/mailmain/listinfo.
    This Web page provides a summary of all Red Hat groups.


    # User groups


    User groups are springing up all over the country. Some are more active than others,
    but most hold meetings at least once a month. Some groups are Linux only; others
    are connected to a larger computer group — either Unix or a more general computer
    users'' association. User groups are a great opportunity to ask questions. User
    groups also tend to stimulate new ideas and ways of doing tasks.'
