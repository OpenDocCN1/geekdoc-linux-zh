  md: '# 218 Part IV: Revenge of the Nerds


    # Building a Samba File Server


    Early in the game, Linux gained popularity by acting as a file server for both
    Windows and Linux computers by dancing the Samba. Samba is more than just a dance:
    it''s also a program (a suite of programs) that speaks the same file-sharing language
    — or protocol — as Windows. Using Samba produces a way to share the Linux file
    system on a network.


    This section describes how to install and configure Samba on any Linux computer.
    Samba comes bundled with Red Hat Linux, of course, so installation is a breeze.
    Samba is also configured to automatically share the ubiquitous /home directory
    on a Red Hat Linux computer, so configuration is also easy. The instructions in
    the following section describe how to get Samba running on a private network.


    ![](img/cc58a1e8691061866010ce216f881372_241_0.png)


    Samba is based on the client-server model in which a computer (server) provides
    services to one or more computers (clients). Samba uses the term share (which
    comes from the Microsoft windows world) to refer to any object that, as a server,
    it exports to a network, or as a client, mounts. An object can be a directory
    or printer.


    # Installing and starting Samba


    Samba consists of several programs, configuration files, and documentation files.
    Samba is packaged in four RPM files on the CDs that accompany this book. This
    list describes the purpose of each RPM file:


    +   - samba-client: This package contains the utility and other supporting software
    to connect a Linux computer to a Samba server. You can use an interactive utility,
    smbclient, to connect to a Samba server. The default Red Hat Linux installs this
    package by default.

    - samba: The Samba server software is included in this package. All the programs
    for sharing files, directories, and printers are included here; the two essential
    daemons are smbd and nmbd; the essential configuration file is smb.conf. The utilities
    for controlling the daemons are also included.

    - samba-swat: You can manually configure the Samba configuration file, smb.conf,
    if you are an expert. However, Samba provides a Web-based system that is easier
    to use and produces clean and readable configuration files.

    - samba-common: All the software required by the other three packages is included
    in this file. This package is also installed by default.'
