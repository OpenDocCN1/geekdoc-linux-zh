  md: '# # Chapter 12


    # # Live from the Net


    **In This Chapter**


    +   - Using XMMS to listen to Internet audio streams

    - Using XMMS to work with MP3

    - Listening to live radio and playing DVDs with MPlayer


    The invention of audio and video streaming technology is one of the great Internet
    innovations. Streaming technology provides the ability for anyone to create a
    radio or TV station unlimited in terms of geography and governmental approval;
    Why using streaming technology, computer users can listen to or view broadcasts
    from anywhere.


    This chapter describes how to use your Red Hat Linux machine as both an audio
    radio receiver and a DVD video player. We use the Open Source XMMS and MPlayer
    applications to listen to the Net.


    # # Using the XMMS Audio Player


    The Open Source XMMS (X MultiMedia System) application is a great tool for listening
    to audio streams and files. XMMS plays WAV files produced by grip/cdparanoia by
    default. It can also play the up-and-coming format (codec).


    The Ogg codec doesn''t contain any proprietary or patented algorithms. Ogg is
    free to use, and people and organizations that don''t want to depend on proprietary
    systems are discovering it; Ogg also produces higher-fidelity audio streams. Why
    depend on another corporation''s whims when you don''t have to?


    You can use XMMS to listen to some of the music you may have saved in Chapter
    11. If you used grip to save music to your home directory and you want to listen
    to it, start XMMS and right-click the window. Choose Open>File and select any
    of the WAV files you created.


