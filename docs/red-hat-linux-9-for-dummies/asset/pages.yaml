    # Unmounting file systems


    Unmounting a Linux file system is a little simpler than mounting one. Because
    the file system is already mounted, you don''t have to specify any options or
    other information. You just have to tell the Red Hat disk management드렸 to unmount
    the file system.


    Be careful, you never want to unmount a hard-drive-based file system, such as
    /, /usr, or /home. This action sends your Red Hat Linux computer into Never-Never.
    On the other hand, you have to unmount a removable drive, such as a CD-ROM or
    floppy drive, before removing it. You can also safely unmount a Windows partition
    because Red Hat doesn''t use it for any system-based purpose; you mount a Windows
    partition only when you''re using that operating system.


    To unmount a file system, follow these steps:


    +   1. Log in as root.

    2. Click the Main Menu button and choose System Tools: Disk Management. Enter
    the root password if requested.

    3. Click the button to the right of the file system in which you''re interested.

    The indicates whether the file system is mounted or unmounted.'
