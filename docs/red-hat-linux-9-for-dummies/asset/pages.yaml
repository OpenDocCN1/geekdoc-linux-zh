  md: '# # Red Hat Linux 9 For Dummies


    ![](img/cc58a1e8691061866010ce216f881372_2_0.png)


    # ## vi commands


    The Visual Editor, is almost as old as the Unix operating system and is much older
    than Linux. This straightforward text editor is nothing fancy, like OpenOffice,
    but is nonetheless useful and powerful. You can start vi by entering the command,
    vi, from the Gnome Terminal shell:


    # ## System administration commands


    This list shows several commonly used Linux commands that help you manage disks,
    shut down your computer, and gather information about your computer. Enter these
    commands from a GNOME Terminal shell (see Chapter 4):


    ```

    [username@machine

    username$ vi somefile

    ```


    You enter these commands from the vi editor:


    | Command | Description |

    | --- | --- |

    | v1 | Open filename in vi |

    | I | Insert mode, inserting before the current position |

    | Shift+I | Insert mode, inserting at the beginning of the current line |

    | Shift+A | Insert mode, inserting at the end of the current line |

    | Esc | Return from insert mode to command mode |

    | a | Delete a character while in command mode |

    | cw | Delete the word to the left of the cursor and put the editor in input mode
    |

    | :q | Quit with no additional to the disk |

    | :wq | Write back the file and then quit |

    | Shift+ZZ | Write back the file and then quit |

    | :q! | Quit the file without changes |

    | /string | Search forward through the file for a string |

    | ?string | Search backward through the file for a string |

    | n | Find the next string (forward or backward) |

    | u | Undo the last command |


    | Command | Description |

    | --- | --- |

    | mount [options] | Mount a file system |

    | unmount [options] | Unmount a file system |

    | fsck [options] | Check the structure and integrity of a specified file system
    |

    | mkfs [options] | Put a directory on a low-level formatted disk |

    | shutdown | Shut down the system rather than wait for a message to be sent (Ctrl+Alt
    the same thing) |

    | vmstat [options] | Look at the virtual memory performance |

    | procinfo | Gather information about processes


    # ## File permissions


    These examples different file permission combinations. Please consult Appendix
    B and C for more information about file and file permissions.


    | Permission | Description |

    | --- | --- |

    | rwxrwxrwx | Create, write, and execute permissions for user, group, and rest-of-the-world
    (mode 777) |

    | drwxr-xr-x | Create a directory that is completely open to its owner and can
    be read and searched (but not searched) by the group and world (mode 754) |

    | crwxr-xr-- | Create a character-special file that the owner can read or write
    to but the group and world can only read (mode 644) |

    | rw-rw---- | Create a block-special file; only the owner can read and write to
    it (mode 600)


