    # The ABCs of switches and hubs


    Switches are slightly more expensive than hubs because they do a little more work.
    Suppose that you have a network consisting of three machines — A, B, and C — are
    all connected to a switch. When machine A wants to communicate with machine B,
    the switch transmits the network traffic from A to B. Machine C is totally out
    of the loop. By making sure that C doesn''t know what A and B are saying, the
    switch keeps network communication private. Hubs, on the other hand, broadcast
    the network traffic from one machine to all the machines connected to the hub.
    When A sends information to B, the hub broadcasts that information to both B and
    C.


    The next sections describe how to build a wired network; the following section
    shows a wireless one. You can mix wired and wireless networks, but, for simplicity,
    we describe how to build a pure wired or wireless network.'
