    4 packets transmitted, 4 packets received, 0% packet loss

    round-trip min/avg/max = 2.3/2.5/3.1 ms

    ```


    If you get a continuous stream of returned packets and the packet loss is zero
    or very near zero, your network is working. If not, the problem may be in the
    other machine. Review the troubleshooting steps again in this chapter. Note that
    the ICMP is taking about 1 full millisecond (ms) longer to travel to the external
    computer than to the loopback device. The reason is that the loopback is completely
    internal to the Linux computer.


    ![](img/cc58a1e8691061866010ce216f881372_299_0.png)


    If you can''t locate the problem and you''re using a PPP connection to an Internet
    Service Provider (ISP), establish a PPP connection and try to ping the computer
    where you have your account.— not to mention bad manners — to continuously ping
    someone else''s computer, so don''t leave this command running. Also, the ISP''s
    firewall may not allow the Internet Control Message Protocol (ICMP) packets that
    ping uses. Even so, it''s worth a try, and you have nothing to lose. ICMP packets
    are the simplest type of packet defined in the Internet Protocol. They''re used
    for doing simple tasks, such as pinging.'
