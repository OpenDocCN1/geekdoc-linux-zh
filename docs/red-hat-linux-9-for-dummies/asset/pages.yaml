    # So You Want to Build an Internet Gateway


    Okay, you have built your LAN. Woo-hoo! That wasn’t too hard. The next question
    is “What can you do with it?” One answer is that every computer on your private
    network can communicate with all the others and share information and services.
    (We describe in Chapter 15 how to share some useful network-based services. You
    find out how to share files and printers, dole out IP addresses to your LAN devices,
    configure a Domain Name Server (DNS), and ta-da—build a Web server.


    One essential network function is to be connected to the Internet. Chapters 5
    and 6 show you how to connect a single, stand-alone Linux computer to the Internet.
    Now we expand that process step further and turn the Internet connection into
    one that can be used by the private network. Any computer connected to your LAN
    will subsequently have Internet access. Sharing is good, and your mom will be
    pleased.


    The remainder of this chapter assumes you have a working Internet connection,
    as described in Chapters 5 and 6. This connection is the conduit from your LAN
    to the Internet. You only have to configure a Linux computer to redirect Internet-bound
    traffic from your LAN to the Internet — a process called routing.


    # Understanding IP forwarding and network address translation


    An Internet gateway requires a Linux computer that has two network or wireless
    NIC to connect to your LAN. The other network connection is used for the Internet
    connection; this connection may be a traditional telephone-based modem or a DSL
    or cable modem. You need an Ethernet NIC for this second connection type.


    Suppose that you use Mozilla on Chivas (with an IP address of 192.168.1.1), which
    is a Linux workstation on your LAN, and enter the URL www.redhat.com. NAT on the
    Internet gateway works like this:'
