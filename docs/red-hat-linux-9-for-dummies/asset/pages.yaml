- img_proc: true
  md: '# 100 Part II: Got Net?


    # # Introducing Local Area Networks


    The invention of Linux revolutionized computer networking. Were a LAN before Linux
    existed was complicated and expensive. LANs were the nearly exclusive domain of
    big corporations, universities, and other monstrous organizations.


    But the TCP/IP networking protocols were built into Linux from the begin-ning.
    In the mid-1990s, if you could afford a couple of PCs, a cheap piece of coaxial
    cable, and a few 10 Mbps (megabits per second) or faster Ethernet adapters, a
    LAN was born. The Ethernet adapters, also commonly known as network interface
    cards (NICs), cost about $150 at the time. Prices, fortunately, have crashed since,
    falling to earth like Ziggy Stardust. A 100 Mbps NIC now costs as little as $15,
    and you can buy an 11 Mbps wireless NIC for less than $100.


    To get your Red Hat computer on a network, you have to configure only a handful
    of networking subsystems. Here are the tasks that need to be performed order for
    your networking to work:


    +   - Load your wireless or Ethernet NIC kernel module. Red Hat Linux generally
    detects your hardware and loads the correct modules.


    +   - Configure your network interface card (NIC).


    +   - Configure your domain name service (DNS), which converts Internet names
    into Internet Protocol (IP) addresses.


    Wireless networking suffers from some security vulnerabilities. Consult the "Wireless
    network warning" sidebar, later in this chapter.


    Performing these steps is pretty heavy lifting. The load is eased somewhat using
    the graphical Network Configuration Utility system administration tool provided
    by Red Hat. Have fun!


    # # Configuring Your NIC with the Red Hat Network Utility


    To use your Red Hat Linux computer with an existing Local Area Network (LAN),
    you need a wireless or Ethernet NIC installed on your computer and a network hub,
    or switch, to which to connect the NIC. After you set up the hardware, you need
    to configure your Red Hat Linux network settings.


    ![](img/cc58a1e8691061866010ce216f881372_123_0.png)


    ![](img/cc58a1e8691061866010ce216f881372_123_1.png)'
  merge: -1
