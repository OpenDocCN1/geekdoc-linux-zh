  md: '# 210 Part IV: Revenge of the Nerds


    the Internet connections introduced in Chapters 5 and 6. We build on those instructions
    to connect your entire network to the Internet through these connections.


    From a functional viewpoint, it doesn''t matter what type of Internet connection
    you use because all Internet connections send and receive the same network traffic.
    (Practically speaking, speed and latency are two different things.) For this reason,
    we can treat the Internet connections from Chapters 5 and 6 as interchangeable.


    The forwarding described in the preceding section takes care of routing the packets
    to from the Internet via your Internet gateway. Follow these steps to configure
    the Internet gateway:


    +   Install the first NIC (Ethernet or Wi-Fi) on your Red Hat Linux Internet gateway;
    the second NIC connects your private network to the gateway.


    +   Connect the gateway to its Internet connection.


    You either connect the second Ethernet NIC to the DSL or cable modem or connect
    your computer''s serial cable to the telephone modem (or simply the internal modem).


    +   Configure your Internet gateway to allow packet forwarding.


    > (Refer to the section "Forwarding network traffic through your gateway," earlier
    in this chapter.)


    +   Assign an IP address to each NIC.


    When you''re using a telephone or cable modem, this action is done automatically
    for you; some DSL modems also perform this action for you. Telephone modems use
    the Point-to-Point Protocol (PPP), whereas cable and some DSL modems use DHCP,
    which assigns an IP address to their respective interfaces.


    +   Assign a default route that points to the Internet connection device.


    Again, the PPP and DHCP protocols do this automatically.


    Follow these steps to configure or network devices on your private network to
    connect to the Internet through the gateway:


    +   Configure your computer with its network parameters.


    In other words, assign an IP address and netmask (and optionally, but highly recommended,
    a host and network name) to each computer when using an Ethernet-based LAN. On
    a wireless network, you will need to assign the IP address, netmask, common network
    name, and encryption key.


    For example, Chapter 7 describes how to set up the sample computer Cancun. We
    assign it the host name cancun, the network name paunch.net., the IP address 192.168.1.1,
    and a netmask of 255.255.255.0.'
