    > The Red Hat Linux operating system provides two interfaces to work from: the
    text-based command-line interface (CLI) and the graphical X Window System. The
    command-line line interface is similar to the old Microsoft Disk Operating System
    (MS-DOS) environment, which requires you to feed individual commands to the operating
    system. The X Window System, also known as X, provides a graphical "point-and-click"
    environment from which most people prefer to work. X provides the foundation that
    makes GNOME runs on. GNOME provides a desktop environment that makes using Red
    Hat Linux your workstation not only possible but also easy and pleasurable.


    GNOME is the default desktop environment for Red Hat Linux. Red Hat also provides
    the option of installing the K Desktop Environment (KDE). KDE is an excellent
    environment that many people prefer. However, because of limited space, we describe
    only how to use GNOME because it''s the Red Hat default environment.


    In this chapter, you find out a little bit about X and the basics for working
    with GNOME. You also get to mess around with the GNOME Panel and desktop-top (the
    Panel is similar to the taskbar on a Windows computer). We show you some simple
    but effective maneuvers to manage your desktop plus some applications.


