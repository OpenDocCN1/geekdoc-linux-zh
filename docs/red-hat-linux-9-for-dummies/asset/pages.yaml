    applications and utilities. We do that because they''re generally easier to use
    and because this book was not written for systems administrators.


    Occasionally, a utility or program doesn''t run graphically; at other times, using
    nongographical methods and systems is just more interesting or convenient. Believe
    it or not, some geek Linux users prefer to use a text-based, command-line interface
