  md: '# Reducing your exposure: Removing and reducing services


    Hackers look for computer vulnerabilities by probing for vulnerable network services.
    Network services — such as Apache, Samba, and DHCP — are, of course, designed
    to respond to network queries. Therefore, hackers can readily out what services
    you run and then find what, if, any attacks to use.


    We have already described how keeping software updates minimizes their vulnerability.
    However, you can go one step better and make a service completely invulnerable
    by turning it off. One simple security rule is "Keep it simple." The fact is that
    if you don''t need to run a service, you shouldn''t.


    We describe in this section how to eliminate or reduce both network and non-network
    services; we advise against running all unnecessary services, network or not,
    because simple is better. This section describes how to use the chkconfig utility
    to change the startup scripts that control when, and whether a network services
    starts at boot time:


    +   1. Click the GNOME Menu and choose Server Settings.

    Enter the root password if prompted.

    2. The Service Configuration window opens.

    3. Select each unnecessary service and shut it off by clicking the Stop button.

    4. Click the OK button when the window opens.

    5. Next, click the check mark to the left of the service to toggle it off. The
    service doesn''t start automatically at boot time when there''s no checkmark.


    What services you turn off depends on your needs, of course. For example, if you''re
    unintentionally running a Web server, turn off the httpd service. In general,
    you should be able to turn off these services.


    +   - The Advanced Power Management Daemon (APMD): APMD is useful if you — like
    most people — regularly power off your workstation or laptop. However, APMD is
    generally unnecessary on servers that run continuously. You want to keep APMD
    in the former case (workstation or laptop) and remove it in the latter (server).

    - The job queue daemon: the atd daemon is used to schedule one-time-cron jobs.
    If you need at, you know it. Otherwise, turn it off.

    - Network File Sharing (NFS): You only need services such as nfs, nfslock, mount,
    and autofs when running an NFS server or client. The last thing you want to do
    is share files to the Internet, for example.'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# Chapter 16: Securing Your Future


    +   - Print services: Many people don''t run the printer daemon on servers.

    - Turn off cups or lpd when you don''t need to print.


    +   - Samba: Just like with NFS, you should turn off Samba if you don''t need
    it.


    The rest is up to you. Terminate services with a vengeance.


    You can''t modify a service when it''s not running. You can toggle the check-mark
    on a non-running service, but it doesn''t have any effect if it''s running.


    You can use the CLI-based chkconfig utility. Open a GNOME Terminal and login as
    root (su -). List the services by the chkconfig --list; list individual service
    by specifying the service after the --list option chkconfig -- list apmd; stop
    a service with the -- add option: chkconfig -- add apmd; delete a service with
    the -- del option: chkconfig -- del apmd.


    # Using a secure shell client


    You may be more familiar with graphical network communication applications like
    the Mozilla Web browser and Evolution e-mail clients. However, a world of text-based
    tools is available, such as Secure Shell, Telnet, and FTP. Those applications
    provide an interactive method for connecting to computers across networks and
    the Internet using a command-line interface (CLI); refer to Chapter 4 for more
    information.


    Interactive communications is effective for performing tasks on remote machines.
    For example, the primary way to work on Linux origins was via the CLI. The CLI
    is the best way to perform remote tasks.


    CLI-based communication used to be primarily carried out over the insecure Shell,
    Telnet, FTP, and ssh connections. All services used unencrypted connections, and
    passwords were readily detected. The rsh service also used a system of intermachine
    trust. That trust allows hackers, like the infamous Kevin Mitnik, to break into
    one machine and log into additional ones without authentication.


    Open Secure Shell (OpenSSH) provides an encrypted channel to perform all tasks.
    Red Hat Linux bundles OpenSSH by default. We describe how to first use the OpenSSH
    client to communicate with other machines and, create an OpenSSH server.


    You should (dare we say must?) use encrypted channels when communicating over
    the Internet and wireless networks. Both the Internet and Wi-Fi connections are
    inherently insecure, and you need to protect your communications.


    Let''s start using OpenSSH as a client. Suppose that you want to log into your
    ISP server -- ssh.myisp.com -- with OpenSSH:'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# 248 Part IV: Revenge of the Nerds


    +   1. Open a GNOME Terminal.


    +   2. Enter into this command:


    ```

    ssh ssh.myisp.com

    ```


    Your mileage may vary, of course. You may have to use the -l option if, for example,
    your ISP user account name is different from your local computer. If your user
    name on your local machine is lidia, but lmaura at your ISP, enter this line:


    ```

    ssh -l lmaura ssh.myisp.com

    ```


    +   3. Enter your password and you''re logged in.


    For example, you can now use a text-based e-mail client like pine to read your
    messages. This is useful if you want to read your e-mail securely but can''t connect
    to your ISP with an SSL-enabled Mozilla or Evolution email client.


    That''s simple and useful, but you can do more. The OpenSSH client is automatically
    to tunnel X across its connection. While logged on to your ISP, you can run Window
    client software and view it on your local machine:


    +   1. Log in to your ISP (or any machine running an SSH server) as just described.


    +   2. Run an X Window application, such as xclock.


    The simple xclock window is displayed on your desktop.

    OpenSSH also bundles the file transfer applications scp and sftp. SCP is non-interactive
    and copies files to and from a remote machine. SFTP is a secure version of FTP
    and is also interactive. This list describes how to copy files between two machines:


    +   * Copy from a local to remote machine: To transfer files from your local computer
    to a remote one, use Secure Copy (scp) as follows: scp abc myacct@remote. This
    command copies the filename abc from the directory you''re working in to myacct
    home directory on the remote machine. You can specify the local and remote directories
    on each machine. For example, this command copies the file abc from the /tmp directory
    to the /var/tmp directory on the remote machine and remote to xyz:


    ```

    scp /abcmyacct@remote:/var/tmp/xyz

    ```


    The scp syntax is important. If you leave out the colon (:), your file is not
    copied to the remote machine but rather renamed to myacct@remote.


    +   * Copy from a remote to local machine: Reverse the order of the parameters
    from a remote machine. The following example copies the file abc from the remote
    machine to the local one: scp myacct@remote:abcd.'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# Chapter 16: Securing Your Future 249


    The sftp program works like the old standby FTP, but of course, uses encryption.
    These instructions describe how to perform simple file transfers with sftp:


    +   1. Open a GNOME Terminal.

    2. Enter this command:

    ```

    sftp ssh.myisp.com

    ```

    3. Enter your user name and password.

    4. Enter the help command at the sftp prompt.


    You see a list of sftp commands. The ones you use most are cd, lcd, dir, ls, get,
    and put. These commands work in similar fashion to their Linux equivalents.


    +   5. Using sftp is explanatory. Use get to transfer a file, files, or directory
    from the remote machine to local machine; puts from local to remote..


    Another cool feature of OpenSSH is its ability to tunnel any protocol. You can
    potentially display an entire X window from a remote machine via X, for example.
    Consult the OpenSSH documentation for more information.


    ![](img/cc58a1e8691061866010ce216f881372_272_0.png)


    # Configuring a secure shell server


    Configuring an OpenSSH server is straightforward. You only need to modify the
    /etc/ssh/sshd_config file and run the /etc/init.d/sshd script. Look at the configuration
    file, the important parts of which are listed in these bullets:


    +   Remove the old and faulty protocol version I1: Version I1 has been broken
    and should not be used:


    ```

    Port 22

    Protocol 2

    # HostKeys for protocol version 2

    HostKey /etc/ssh/ssh_host_rsa_key

    HostKey /etc/ssh/ssh_host_dsa_key

    ```


    +   Remove the comment in front of the login grace time period: This sets a limit
    on the time between you start a login and complete it:

    LoginGraceTime 600


    +   Disallow root logins: You should prevent users, including yourself, from logging
    directly in root. Forcing users to first log in as a regular user and then "suing"
    to root provides an audit trail that can be used to see'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# 250 Part IV: Revenge of the Nerds


    who did what as the root user; it also forces everyone to jump through two hoops
    before becoming the all-powerful root user:


    ```

    PermitRootLogin yes

    StrictModes yes

    ```


    +   Uncomment these parameters to allow the various authentication modes:

    # rhosts authentication should not be used

    RhostsAuthentication no

    # Don''t read the user''s ~/.rhosts and ~/.shosts files

    IgnoreRosts yes

    # For this to work you will also need host keys in

    /etc/ssh/ssh_known_hosts

    RhostsRSAAuthentication no

    # similar for protocol version 2

    HostbasedAuthentication no

    # Change to yes if you don''t trust ~/.ssh/known_hosts

    RhostsRSAAuthentication and HostbasedAuthentication

    IgnoreUserKnown no


    +   Finally, allow people to use password authentication, but don''t allow unauthenticated
    access:

    # To disable tunneled clear text passwords, change to no here!

    Authentication yes

    PermitEmptyPasswords no


    Start the OpenSSH daemon, follow these steps:


    +   Make the changes and restart the sshd daemon:

    /etc/init.d/sshd restart


    +   If you''re running a firewall, add this rule to your iptables-based firewall:

    iptables -A INPUT -p tcp --dport 2022 -m state --state NEW,ESTABLISHED -j ACCEPT


    +   Save your new firewall:

    iptables-save > /etc/sysconfig/iptables


    +   Restart the firewall:

    /etc/init.d/iptables restart


    Now you can use OpenSSH to communicate to and from your Linux computer. Using
    OpenSSH, you can interactively log in to other computers, copy data between them,
    and piggyback arbitrary communication stream — such as X Window — with this puppy.
    OpenSSH encrypts all your communication and prevents THE exposing of your passwords
    and data to prying eyes.'
  merge: -1
  pgno: 273
- img_proc: true
  md: "# Chapter 16: Securing Your Future 251\n\n# Exchanging keys makes your life\
    \ easier\n\nYou can log in to remote Shell user account by using the traditional\
    \ passwords. This is the OpenSSH default authentication method. However, OpenSSH\
    \ provides a second authentication method that takes a little bit of work to get\
    \ started saves work in the long run.\n\nOpenSSH provides an authentication method\
    \ called public-key cryptography. This system uses one public and one private\
    \ key. You install the public key on the remote system and keep the private key\
    \ on your computer. The public key can be shared with anyone — hey, it's public.\
    \ The private key must be kept secret at all costs. In fact, OpenSSH encrypts\
    \ the private key by default. You must use a pass phrase — essentially a password\
    \ with spaces — to decrypt the private key before using it (more on decryption\
    \ later).\n\nWhen you log in or communicate with the remote computer, the keys\
    \ are used to negotiate the process. The public/private key system guarantees\
    \ that your user account is authenticated but also the initiating host; passwords\
    \ authenticate only your login account, not the computer's connecting.\n\n# Setting\
    \ up for a public-key cryptographic key exchange\n\nTo set up the key exchange,\
    \ follow these steps:\n\n+   1. Log in to your user account on the local computer.\n\
    \   For example, log in as the user rod on cancunc.\n2. Open a GNOME Terminal.\n\
    3. Run this command:\n   `ssh-keygen -t dsa`\n   This step starts the program\
    \ that generates your public and private keys. Several encryption methods exist:\
    \ DSA (Digital Signature Standard) and RSA (named after Ron Rivest, Adi Sham,\
    \ and Len Adleman) are the most popular. DSA is a nonproprietary algorithm, whereas\
    \ RSA was until recently patented. Even though RSA is available for public use,\
    \ we use DSA.\n4. The program thinks for a moment and returns these output:\n\
    \   Enter file in which to save the key (//.ssh/id_dsa):\n   The keys are saved\
    \ to the .ssh directory in your home directory. The default should be okay, so\
    \ press the Return key.\n5. The ssh-keygen asks you to enter a pass phrase that\
    \ it will use to encrypt your private key:\n   Enter passphrase (empty for no\
    \ passphrase):\n\n![](img/cc58a1e8691061866010ce216f881372_274_0.png)"
  merge: -1
  pgno: 274
- img_proc: true
  md: '# 252 Part IV: Revenge of the Nerds


    # 6. Enter your pass phrase and ssh-keygen generates the keys.


    Use a phrase peppered with numbers and other characters. For example, you might
    try a pass phrase like this:


    ```

    Giv3 m3 @ bre@k!

    ```


    # 7. Verify your pass by entering it a second time.


    ssh-keygen generates your public and private keys. Those keys are stored by default
    in the .ssh directory. The .ssh directory is stored by default in your home directory;
    ssh-keygen creates the .ssh directory, if necessary.


    # Copying your public key to the remote computer


    Now you need to copy the public key to the computer you securely communicate with.
    This steps describe how to copy and configure them:


    +   1. Log in to your user account on the local computer.


    For example, log in as the user rod on cancun.


    +   2. Open a GNOME Terminal.


    +   3. Copy your public key to your account on the remote computer. For example,
    if your account on remote Chivas is rod, you can use the Open Secure Copy (scp):


    ```

    scp .ssh/id_rsa.pub rod@chivas:

    ```


    +   4. Enter your account password when prompted, and the DSA public key is copied
    to your home directory on Chivas.


    +   5. Log in to the remote machine. For example, use ssh:


    ```

    ssh chivas

    ```


    +   6. Enter your password when prompted.


    By default, OpenSSH looks for public keys in the authorized_keys file in the .ssh
    directory (in your home directory).


    +   7. Use these commands to copy the public key into the authorized_keys file
    (remember that you should still be in your home directory):


    ```

    cat id_rsa.pub >> .ssh/authorized_keys

    ```


    The cat command concatenates the contents of the id_rsa.pub to the Linux standard
    output (that''s generally your console, which is the GNOME Terminal, in this case).
    The double "greater than" symbols (>>) append the standard output to the authorized_keys
    file in the .ssh directory. No preexisting keys are disturbed.'
  merge: -1
  pgno: 275
- img_proc: true
  md: "# Chapter 16: Securing Your Future 253\n\n8. The authorized_keys file must\
    \ have the right permissions. (See Appendix B for more information about file\
    \ permissions.) In this case, loose permissions skip ships, and OpenSSH doesn't\
    \ work with, for example, read/write/execute group permissions. Ensure the correct\
    \ permissions as follows:\n\n```\nchmod 644 .ssh/authorized_keys\n```\n\n9. Make\
    \ sure that the OpenSSH server configuration allows key exchange. These options\
    \ should be set in the /etc/ssh/sshd_config file:\n\n```\nRSAAuthentication yes\n\
    PubkeyAuthentication yes\nAuthorizedKeysFile .ssh/authorized_keys\n```\n\n10.\
    \ Restart the sshd daemon if you make any changes to the sshd_config file:\n\n\
    ```\n/etc/init.d/sshd restart\n```\n\n# Connecting to the remote computer using\
    \ key exchange\n\nReady to use the key exchange authentication system? From the\
    \ host (local) computer, try these steps:\n\n+   1. Log in to your user account\
    \ on the local computer.\n   For example, log in as the user rod on cancun.\n\
    2. Open a GNOME Terminal.\n3. Log in to the remote machine:\n   ssh chivas\n4.\
    \ Enter the pass phrase you used to encrypt your private key.\n\nThe remote computer\
    \ authenticates you and your host computer. Voilà! You're in.\n\n# Making life\
    \ even easier with ssh-agent\n\nThat's not all! Red Hat automatically starts a\
    \ system named ssh-agent. With ssh-agent, you enter your pass phrase and ssh-agent\
    \ remembers it. You need to enter the pass phrase only once while logged into\
