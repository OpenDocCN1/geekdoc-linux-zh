  md: '# Appendix D


    # Revving Up RPM


    In This Appendix


    +   * Introducing RPM

    * Finding out what RPM does

    * Using the Red Hat Package Manager

    * Manually using RPM


    This appendix introduces you to the Red Hat Package Manager (RPM). Red Hat, Inc.,
    developed RPM in conjunction with another Linux distributor, Caldera Systems.
    RPM makes a grand effort to reduce the amount of work you have to do when you
    install software. In other words, RPM makes installing, updating, and removing
    software an automatic process. Woo-hoo!


    Other package managers are available, but RPM has become the most popular for
    installing, modifying, and transporting Linux software. This handy-dandy tool
    is a big reason that Red Hat is the facto Linux distribution leader. Motor through
    this chapter to find out everything you need to know about RPM.


    # Introducing RPM


    One of the primary reasons that the Red Hat Linux distribution became popular
    was it added value for its customers with technologies such as Red Hat Package
    Manager (RPM).


    All the software that was installed during the Red Hat installation process is
    stored in RPM''s giving format, called packages. *Packages* are a collection of
    individual software (applications, libraries, and documentation, for example)
    contained in one file.


    The package-management concept has been around for quite a while, with all the
    major Unix vendors supplying their own systems. The idea is to distribute software
    in a single file and have a package manager to do the work'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# 334 Part VI: Appendixes


    installing, or uninstalling, and managing the individual files. The Linux world
    has benefited greatly from this system, which simplifies the distribution and
    use of software.


    You could install software without RPM, but we''re not sure why you would want
    to — the RPM package contains everything you need to install and run an application.
    For example, if you didn''t have the RPM package, installing Mozilla would work
    a little like this: You would have to install the individual pieces that make
    the Mozilla system, which could require dozens or more steps. You can also install,
    update, or uninstall RPM software. (See the following section, "Taking a Look
    at What RPM Does," for details.)


    We remember back in the day, when we used the Linux operating system for the first
    time. We had to install all the software using the dreaded tape archive system
    (tar). Trust us: installing, maintaining, and upgrading Linux with tar was a difficult
    task. RPM has made life easy.


    The /mnt/cdrom/RedHat/RPMS directory contains all the RPM packages.


    # Taking a Look at What RPM Does


    RPM performs three basic functions: It installs, upgrades, and removes packages.
    In addition to these functions, it can find all sorts of information about installed
    and yet-to-be-installed packages. (All this, and it washes windows, too.) Here''s
    a brief rundown of each function:


    +   **Installing packages:** RPM installs software. Software systems as Mozilla
    have files of all types that must be put into certain locations in order to work
    properly. For example, under Red Hat, some (but not all) of the Mozilla files
    need to go into the `/usr/bin` directory. RPM performs this organizational stuff
    automatically without any fuss or mess.


    RPM not only installs files into their proper directories but also performs tasks
    such as creating the directories and running scripts to do the things that need
    to be done. (It''s such a tidy and organized little stamp).


    **Upgrading packages:** Gone are the days when updating a system was worse than
    going to the dentist. RPM acts like the personal Linux assistant you wish by updating
    existing software packages for you. RPM also keeps track of, in a database of
    its own, all the packages you have installed. When you upgrade a package, RPM
    does all the bookkeeping chores and replaces only the files that need to be replaced.
    It also saves the configuration files it replaces.


    **Removing packages:** The package database RPM keeps is also useful in removing
    packages. To put it simply, RPM takes out the trash.'
  merge: -1
  pgno: 357
- img_proc: true
  md: '# Appendix D: Revving Up RPM 335


    (Housekeeping was never so easy.) RPM goes to each file and uninstalls it. Directories
    belonging to the package are also removed when no files from other packages occupy
    them.


    +   - Querying packages and files: RPM can also give you a great deal of information
    about a package and its files. You can use the query function to find out the
    function of a package and which files belong to it. RPM can also work on the RPM
    packages themselves, regardless of whether they have been installed.


    +   - Verifying packages: RPM can validate an installed package against a checksum
    (a computer fingerprint) to see whether and how it has changed. This feature is
    useful for security reasons. If you suspect that a file or system has been hacked,
    you can use RPM to find out it has changed.


    RPM packages often include configuration files as part of their installation.
    If you erase an RPM package, those configuration files are deleted but renamed
    by adding the suffix .rpmsave to the end of the original filename. For instance,
    removing the Kerberos package, krbfs, saves the configuration by renaming /etc/krb.conf
    to /etc/krb.conf.rpmsave.


    ![](img/cc58a1e8691061866010ce216f881372_358_0.png)


    When you remove a package, RPM removes the associated files and directories. —
    what Martha Stewart would definitely call a "good thing."


    ![](img/cc58a1e8691061866010ce216f881372_358_1.png)


    # Using the Red Hat Package Manager


    Red Hat Linux provides a tool named the Package Manager for working with RPM packages.
    The Package Manager graphical tool provides all the functions for managing RPMs.
    It’s like putting automatic transmission on a car — the Package Manager does the
    shifting for you.


    Okay, the Package Manager does the shifting for you, but you still have to drive
    it. The Package Manager provides easy access to RPM functions, such as install,
    upgrade, uninstall, query, and verify. The following sections describe how to
    use the Package Manager to rev up your RPM.


    To start the Package Manager, click the GNOME button and choose System Settings:
    Packages. If you aren''t logged in as root, type the password in the input window
    when you''re prompted. A progress window appears briefly while the Package Manager
    determines which packages you have installed. After "thinking," the Package Management
    window appears.


    The Package Manager displays all the Red Hat package groups that are installed
    on your system. Individual packages are organized into groups, such as the X Window
    System and GNOME. When the check box to'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# 336 Part VI: Appendixes


    the left of a group is active, designated by a plus sign (+), one or more packages
    from that group is installed. The number to the right of the package group shows
    how many packages of the total number in that group are installed.


    Clicking the Details option opens the GNOME Desktop Environment Package Details
    window, which shows all the base and optional packages in the group; short, one-line
    descriptions of each package are also displayed next to each package. Base packages
    are always installed with a package group. Optional packages are, well, optionally
    installed.


    This may be a For Dummies book, but you, of course, are not a dummy. It''s obvious
    what the GNOME RPM buttons, displayed along the top of the GNOME RPM window, are
    used for. The following sections describe how to use them for their intended functions.


    # Installing an RPM package from a CD-ROM


    When you install your Red Hat Linux system, all the software that is copied to
    your hard drive from the CD-ROM comes from RPM packages. When you want to add
    additional software from the companion CD-ROM or an RPM repository, such as www.fresh.net,
    or from Red Hat at www.redhat.com, you can do so by using the Install button.
    To install an RPM package from a CD-ROM, follow these steps:


    +   Start the Package Manager by clicking the GNOME Menu button and choosing System
    Settings: Add/Remove Applications.


    Enter the root password in the Information window if you''re prompted.

    The Package Management window opens.


    +   Select the package group you want to install.


    For instance, if you want to install extra skins for XXMS, you have to scroll
    down to the Sound and Video package group. The short description next to the package
    group says "From CD recording to playing audio CDs and multimedia files," which
    indicates that you are on the right path.


    +   Click the Details button to locate the package (or packages) to install.


    The Sound and Video Package Details window opens.


    +   Select the radio button next to the xxms-skins package.


    +   Click the Close button to return to the Package Management window.'
  merge: -1
