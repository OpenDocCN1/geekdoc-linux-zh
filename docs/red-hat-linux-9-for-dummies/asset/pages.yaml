    The Reload function is useful if you create a new file — for example, via a terminal
    emulator. The file doesn''t show up in the File Manager until you move to another
    directory and return, or else reload.


    ![](img/cc58a1e8691061866010ce216f881372_173_1.png)


    Figure 10-1: Nautilus at work as a file manager.'
