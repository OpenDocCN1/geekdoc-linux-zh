    # Toiling in your workplace


    After using GNOME for a while, you find that as you start more and more applications,
    you create lots and lots of windows on the screen. You may even lose windows behind
    other windows. Perhaps you wish that you could strap several monitors together
    so that you can display all the windows at one time.


    Monitors are expensive and bulky, so you''re probably stuck using a single monitor.
    But you don''t have to be stuck with one screen. GNOME lets you spread your work
    across multiple monitors.


    Imagine that you have a huge GNOME desktop that is spread equally across four
