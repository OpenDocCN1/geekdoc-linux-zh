    # Introducing password etiquette


    Your password must be at least six characters long, but you should use at least
    eight: The more characters you use, the harder the password is to break. If you''re
    concerned about security, we recommend that you use a combination of uppercase
    and lowercase letters, symbols, and numbers to make your password as difficult
    as possible. In addition, do not choose anything you can find in a dictionary
    or names that are easy to associate with you. In other words, your name spelled
    backward, your birthday, your dog''s name, or any word in language are all poor
    choices. Beer, for example, is a poor selection for Jon''s password, even though
    it has both uppercase and lowercase letters, Jon and beer are usually seen in
    proximity with each other.


    A good way to come up with a good password is to select a phrase and destroy it.
    For example, make "I am not a" into something like imN0Un!. Even though the result
    doesn''t spell out the phrase in any way, it gives you all the cues to remember
    the essentially random characters ("1m = im, "not" = a, and number = #). Other
    substitutions are 3 for e, 4 for a, 9 for l, and 5 for s. In this way, you can
    create passwords with sOuthb4 (southday) and 14mn3 (iamotetag).


    Also, be sure to write down your password where it won''t get lost and can''t
    easily found or stolen. For example, save your work passwords at home or store
    them in a locked desk or safe. And please don''t write your password on a sticky
    note and attach it to your computer monitor!


