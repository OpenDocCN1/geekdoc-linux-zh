    That was easy enough, wasn''t it? What if you want to give the group permission
    to only read and execute the file? You execute this command:


    ```

    chmod g=rx gotowork

    ```


    Note that this command doesn''t affect the permissions for owner or other — just
    the group''s permissions.


    You can set the permission bits in other ways. But because this way is so simple,
    why use any other?'
