  md: '# 328 Part VI: Appendixes


    +   - y: Answers Yes all prompts and repairs damage regardless of severity

    - f: Forces a file system check


    Many people run the fsck command with the -y option. If you run fsck with the
    p option, Linux performs some steps automatically, placing lost files in the lost+found
    directory, deleting zero-length files, and missing blocks back on the list of
    free blocks. (Free blocks are still available for filling data, among other things.)


    fsck can cause problems with your disk. The best way to ensure that fsck doesn''t
    cause damage is to run it when your computer is operating in single-user mode.
    Change the state of your computer to single-user mode by running the -s command.


    # Increasing Drive Space


    Sooner or later, you''re likely to want to add more hard drive storage to your
    Linux system to hold more programs and data or to enable more users to log in.


    The first step to increasing your drive space is to add a new disk drive. The
    following tasks are required in order to add a drive to your system (regardless
    of whether the drive is an IDE, SCSI, or FireWire, for example) and make it accessible
    to users:


    +   - Physically attach the disk to your computer system. Be careful to turn off
    the power to your computer and monitor. Disconnect the power cable. Be careful
    not to cut yourself when reaching into the computer. You should also use the antistatic
    strap that comes with the hard drive; follow the instructions included with the
    strap.

    - Provide a suitable device driver for the drive''s controller in Linux.

    - Define at least one partition (see the following section).

    - Create the block special files for the partitions.

    - Create a Linux file system (or systems) on any partitions to be used for user
    files.

    - Enter the new file systems into /etc/fstab, the configuration file.

    - Mount the file systems. (You may have to make a directory for a mount point.)


    The following sections guide you through the process of creating a drive partition
    and configuring a hard drive, a floppy drive, and a CD-ROM drive after they''re
    physically installed.'
  merge: -1
  pgno: 351
- img_proc: true
  md: '# Appendix C: Becoming a Suit: Managing the Red Hat Linux File System


    # Creating a drive partition


    You have to partition your new hard drive after you''ve added it to your Linux
    computer. The drive partition is the basic file storage unit of Linux. Follow
    these general steps to create a drive partition:


    +   1. Create the file systems on the drive partitions.

    2. Combine the file systems to form a single directory tree structure.

    The directory tree structure can be on one drive or spread across many.

    3. Define the drive partitions.


    You can define drive partitions when adding a new drive, or you can do it later.

    In most cases, Linux defines drive partitions from the original Linux installation.
    You may divide a drive into one, two, four, or more partitions, each of which
    may contain a file system or be used as a swap partition. Swap partitions allow
    very large programs or many small programs to run, even if they take up more memory
    than you have in your computer. The total of all swap partitions and RAM is called
    virtual memory.


    +   4. Create a file system.


    The file system occupies a single space on the drive that has a unique block special
    file (device) name. This unique name accesses the file system regardless of whether
    the data is stored on all or only part of a physical drive or is an aggregation
    of multiple physical drives.


    # Adding and configuring a hard drive


    The business of adding a hard drive to your microcomputer can be broken down into
    two steps:


    +   1. Physically add the hard drive.

    2. Logically make Linux aware of it.


    Describing the first step is beyond the scope of this book because your drive
    may be connected with an IDE, SCSI, FireWire, or USB interface and the setup of
    the physical drive is dependent on the rest of the hardware in the system. We
    suggest that you consult the hardware manual that came with your system or have
    a computer reseller install your new hard drive. The Linux system is complicated
    by the fact that several operating systems—such as DOS, Linux, and SCO Unix—may
    share the same hard drive.


    ![](img/cc58a1e8691061866010ce216f881372_352_0.png)'
  merge: -1
  pgno: 352
- img_proc: true
  md: '# 330 Part VI: Appendixes


    To complete all the steps necessary to install and configure your new drive, you
    must know the total formatted drive capacity and the number of heads and cylinders,
    among other details. You can usually find this information in the documentation
    from the manufacturer or from the computer''s BIOS.


    You may want to keep a record of the data from the partition table (as displayed
    by fdisk), such as


    +   - Partition numbers

    - Type

    - Size

    - Starting and ending blocks


    # Installing a drive


    After the drive is attached to the system, Linux should recognize it when you
    boot. To review the booting messages in a slower fashion than they''re displayed,
    use the dmesg command.


    Here''s what to look for:


    +   - If you added a new IDE drive, look for the mention of a new hdx drive, where
    the x is replaced with the letter b, c, d, or e. This information tells you that
    your kernel saw the new hard drive as it booted and that rebuilding the kernel
    isn''t necessary in order to add this drive.


    The messages for an IDE drive may look like this:


    ```

    hdb: HITACHI_DK227A-50, 4789MB w/512KB Cache, CHS=610/

    255/63

    ```


    Sometimes later, a message appears like the following line, which describes the
    existing partitions (if any) on the new drive:


    ```

    hdb: hdb1 hdb2 < hdb5 hdb6 hdb7 hdb8 >

    ```


    +   - For instance, if you''re adding a new SCSI disk drive, you will see a boot
    message indicating a new disk drive that has the designation sdx, where the x
    is a letter. In the IDE or SCSI case, you may see other messages with additional
    information.


    A SCSI disk drive has messages that look like this:


    ```

    SCSI device sdb: hdwr device= ......

    sdb: sdb1

    ```


    If you see these messages, the kernel has seen your new drive and you don''t have
    to rebuild the kernel to use the new drive.'
  merge: -1
