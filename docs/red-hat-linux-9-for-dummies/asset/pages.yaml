    # # Going Old School with the Terminal Emulators


    One important — almost essential — GNOME application is the GNOME Terminal, as
    shown in Figure 9-8, a program that emulates the old-style terminal from within
    the GUI. Back in the good old days, you could type only commands and see the results
    in — and you did on a terminal. You might be wondering why you would want to simulate
    a dumb, inexpensive terminal when you paid lots of money for a neat graphics monitor.


    Well, in the early days of X, few graphical programs were available. Most programs
    were written to run on nongraphical interfaces and didn''t include the libraries
    that create graphical programs on an X server. In other words, in order to run
    both graphical and nongraphical programs, the dumb terminal had to be emulated
    through software.


    When you start a terminal emulator, the emulator usually executes a shell and
    gives you a command-line prompt. You type commands at this prompt, and the results
    are printed to the terminal emulator window. GNOME provides a terminal emulator
    named GNOME Terminal. You can start it by choosing GNOME Menu⟜System Tools⟞Terminal.'
