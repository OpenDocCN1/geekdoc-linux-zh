    # Suspending Your Computer


    One useful Linux application is the Advanced Power Manager (APM). APM performs
    two functions: monitoring a laptop computer''s battery and placing your computers
    — both desktops and laptops — into a suspended animation power-saving mode.


    An APM system consists of both a client and a server. The server daemon, apmd,
    is installed during the Red Hat Linux installation process and is started automatically
    by default. You use the APM client to both monitor your laptop''s battery and
    place your computer into power-saving mode.'
