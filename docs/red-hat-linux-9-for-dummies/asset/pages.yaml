  md: '# Chapter 11: Surfin'' the Net and Groovin'' to Tunes


    # Groovin'' to Tunes with CD Player


    Imagine that you''re sitting alone, working at your computer. Or you could be
    reading a book that is really making you feel bored. It''s Saturday night too,
    of course. A drag. Want some diversion? Music helps, eh? We can''t provide music,
    but we can show you how to use your computer to listen to some tunes.


    In the following sections, we show you the tools Red Hat Linux provides to make
    your workstation into a sound system, including all the necessary applications
    to play CDs, and tools for connecting your PC to a sound card and speakers. By
    making sure that your computer can play music.


    # Setting Up Your Sound System


    Red Hat Linux should have automatically configured your computer''s sound system
    during the post installation described in Chapter 3. However, you may run into
    problems — especially on older computers — so Red Hat provides a sound card detection
    utility.


    You can configure and test your sound card at the same time by following these
    steps:


    +   1. Log in to your Linux computer.

    2. Click the GNOME Menu button and choose System Settings: Soundcard Detection.

    nEnter the root password if prompted.

    The Audio Devices window opens, as shown in Figure 11-3.

    3. Click the Play test button.

    If you hear some mellow music, your computer is ready to rock.

    4. Click OK and you''re ready to go.


    ![](img/cc58a1e8691061866010ce216f881372_190_0.png)'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# 168 Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


    If you''re plugged in correctly and you repeated the steps, but you still didn''t
    hear any sound, one of these reasons may explain why:


    +   - Your computer has an old, unrecognizable sound card.

    - You don''t have a sound card.

    - Someone''s stereo is way too loud.


    You definitely have to purchase a sound card if you don''t have one. Using old
    sound cards is generally difficult, so we also recommend purchasing a replacement.
    We can''t help you much with the third possibility.


    The Red Hat Sound daemon (referred to ESD) is designed to allow multiple applications
    to use your computer''s sound system at the same time. However, an application
    may not be able to take advantage of this elegant system. For example, when you
    start XMMS, you may have to turn off the ESD daemon. You can turn ESD off by starting
    a GNOME Terminal window and entering this command:


    ```

    killall -1 esd

    ```


    ![](img/cc58a1e8691061866010ce216f881372_191_0.png)


    # Playing CDs


    Everyone wants a little music in her life. But you went ahead and bought a computer
    rather than a stereo system. D''oh! But it happens that you indeed spent your
    money wisely because your Red Linux computer functions well as a stereo system.
    This section describes how to set up your computer to play music CDs.


    Red Hat bundles two Open Source CD players for Linux users: CD Player and XMMS.
    We describe the CD Player in this chapter because it automatically starts when
    you insert a CD in your computer. (We don''t ignore XMMS, however, because we
    use it in Chapter 12 to play Internet audio streams.)


    Anyway, these instructions show how to start playing music:


    +   - Log in as any user and pop a CD into the CD drive.

    - The Gnome CD Player application appears.

    - Listen as your CD starts playing.


    Those are the easiest instructions in this book. However, if you exit from the
    CD Player, you have to restart it manually (unless you insert another CD, in which
    case CD Player starts automatically again.) You can start CD Player by clicking
    the GNOME Menu button and choosing Sound & Video >CD Player. Nothing to it.'
