  md: '# Chapter 5: Dial-Up Modems Still Get the Job Done


    # If you’re buying a modem


    Dial-up modems are an old technology but still the most common method for making
    personal or small-business Internet connections. This statement may not be true
    much longer because the number of users with broadband connections is rising fast,
    and most businesses also use broadband services.


    several advantages. You can easily turn them on and off, you can connect them
    to a computer without opening the computer case, and if your phone line is struck
    by lightning, the charge passing through the modem does not damage your computer.
    On the other hand, internal modems need only a telephone cable, whereas external
    modems require a telephone line, a serial connection, and power-supply cables.


    An internal modem plugs into a PCI or ISA on your computer''s motherboard and
    receives its power from the computer. An external modem comes in its own power
    supply, and connects to the computer via a serial (RS232) connection. Both types
    of modems use your phone jack to connect to the Internet.


    A third type of serial line modem is a PCMCIA (sometimes called a PC card). These
    cards are used most often with laptop computers. Most laptops come with internal
    modems already installed.


    Internal modems are generally less expensive than external ones, but internal
    modems have


