  md: 'To configure your DSL modem so that it works with Red Hat Linux, follow these
    steps:


    +   1. **Only the enable account can be used to configure the modem, so type enable.**


    You need to set the Cisco modem passwords. Cisco 675 or 678 modems use two passwords.
    One password is for the regular (nonprivileged) password, named `exec`, and the
    other works for the administrative account, named `enable`.


    +   2. **No enable password is set, so press the Enter key when prompted for the
    password.**


    The `cbos>` prompt changes to `cbos#` with the pound sign (#) indicating that
    you''re in enable mode.


    +   3. **Enter the nonadminative exec password:**


    ```

    set password exec dsl!ocks!

    ```


    You should use your own password — not dsl!ocks! — of course.


    +   4. **Set the administrative enable password:**


    ```

    set password enable dslislast!

    ```


    Our sample password is printed in millions of copies of this book. Well, probably
    just three or four copies, but we can be optimistic. Make sure that you use a
    different password.


    Your DSL modem is mellow because it uses *nonvolatile memory*. It''s good at remembering
    things like the passwords you just set, but only if you tell it to remember these
    items.


    +   5. **Save your changes by running this command:**


    ```

    write

    ```


    The show nvram command shows what''s in the DSL modem''s memory. Run the command,
    and you see something like this:


    ```

    [[ CBOS - Section Start ]

    NSOS Root Password = a_lsbegr

    NSOS Enable Password = a_lsbegr

    ```


    ```

    set interface eth0 address 192.168.1.1 netmask

    255.255.255.0

    ```


    +   7. **Configure the DSL modem''s wan0-0 interface to authenticate with your
    ISP:**


    ```

    set ppp wan0-0 login iwantdsl@myisp.com

    set ppp wan0-0 password dsl!ocks!

    ```


    Use the values that ISP gives to you in place of our fictitious examples (*in
    italics*).'
