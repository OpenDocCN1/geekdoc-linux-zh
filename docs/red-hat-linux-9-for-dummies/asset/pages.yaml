  md: '# Introduction


    Red Hat Linux 9 For Dummies is designed to help you install and use Red Hat Linux.
    This book shows you how to do fun and interesting — to say nothing of useful —
    things with Red Hat Linux. The book is also designed to be an effective doorstop
    or coffee cup coaster. Whatever you use it for, we hope that you have fun.


    # About This Book


    This book is designed to be a helping-hands tutorial. It provides a place to turn
    for help and solace in those moments when, after two hours of trying to get your
    network connection working, your dog bumps into the cable and it magically starts
    working.


    We tried our hardest to fill up this book with the things you need to know about,
    such as how to


    +   - Install Red Hat Linux

    - Get connected to the Internet via broadband DSL and cable modems or old-fashioned
    dial-up modems

    - Get connected to your Local Area Network (LAN)

    - Build a simple firewall

    - Build simple Internet and LAN services, such as Web pages and print servers

    - Use Red Hat Linux to play CDs, and MP3s and listen to radio stations

    - Use the GNOME desktop environment

    - Use useful and usable applications, such as the OpenOffice desktop productivity
    suite, Evolution desktop organizer/ and e-mail client, and the streaming multimedia
    Player

    - Work with the OpenOffice desktop productivity suite to satisfy your word processing,
    spreadsheet, and presentation needs

    - Upgrade your computer and network security

    - Know where to go for help

    - Manage your Red Hat Linux workstation'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Red Hat Linux 9 For Dummies


    You see troubleshooting tips throughout this book, but Chapter 17 is devoted to
    the subject. It''s not that Red Hat Linux is all that much trouble, but we want
    you to be prepared in case you run into bad luck.


    The instructions in this book are designed to work with the version of Red Hat
    Linux''s on the companion CD-ROMs; we also describe how to download several software
    packages not found on the companion CD-ROMS. Feel free to use other versions of
    Red Hat Linux or even other Linux distributions, but be aware that our instructions
    may not work exactly or even at all. Good luck!


    ![](img/cc58a1e8691061866010ce216f881372_25_0.png)


    # Foolish Assumptions


    You know what they say about people who make assumptions, but this book would
    never have been written if we didn''t make a few. This book is for you if


    +   * You''re building a Red Hat Linux workstation. You want to use the Linux
    operating system to build your personal workstation. Surprise! — the CD-ROMs included
    with this book contain the Red Hat Linux distribution.


    +   * You have no duct tape? You want to put the Red Hat Linux operating system
    and the computer together, and using duct tape hasn''t worked.


    +   * You want to be a guru. You don''t want to become a Red Hat Linux guru —
    at least not.


    However, this book is not for you if you''re


    +   * Looking for a reference-style book. We simply don''t have enough space to
    provide a comprehensive range of topics. We concentrate on providing help on getting
    popular and useful stuff up and devote more space on, for example, getting your
    DSL or cable modem working.


    +   * Looking for a systems administration book. Again, we don''t have enough
    space to do the subject justice. We provide instructions on how to perform essential
    tasks, like adding users, packages, and network connections. This book selects
    certain topics to focus on and leaves the rest for other books.


    # Conventions Used in This Book


    At computer conventions, thousands of computer people get together and talk about
    deep technical issues, such as'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Introduction


    +   - What is the best hardware for running Red Hat Linux?


    +   - Is Coke better than Pepsi?


    +   - Could Superman, Batman, and Spiderman beat The Punisher?


    But these aren''t the types of conventions we''re talking about here. Our conventions
    are shorthand ways of designating specific information, such as what is is and
    isn''t a command or the meaning of certain funny-looking symbols.


    # Typing code


    Commands in the text are shown like this. Commands not shown in the text, but
    set off on lines by themselves, look like this:


    ```

    [lidia@cancun lidia]$pwd

    /home/lidia

    ```


    See the [lidia@cancun lidia] part of the preceding lines. You don''t necessarily
    see that on your system, unless you happen to be my wife''s mirror image who also
    likes Cancun, Mexico, very much. But you see something similar depending on what
    your computer and user name are. The first name, lidia, is replaced by whatever
    your user name is. The second name is your computer name. The final one is the
    directory in which you''re working, which in this case is the lidia home directory.
    Therefore, if your user name is zoot and your computer name is wishbone, your
    prompt is


    ```

    [zoot@wishbone zoot]$

    ```


    When you see stuff in boldface, it means it''s something you should type. For
    example:


    Type man chown at the command prompt and press Enter.


    If we tell you to type something in a bold stepped, the text you type isn''t in
    bold, as in this step:


    +   1. Type man chown at the command prompt and press Enter.


    Here''s a rundown of the command syntax in Linux:


    +   - Text not surrounded by [ ] or ( ) brackets must be typed exactly as shown.


    +   - Text inside brackets [ ] is optional.


    +   - Text in italics must be replaced with appropriate text.


    ![](img/cc58a1e8691061866010ce216f881372_26_0.png)'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Red Hat Linux 9 For Dummies


    +   - Text inside braces { } indicates that you must choose one of the values
    inside the braces and separated by the | sign.

    - An ellipsis (...) means "and so so on" or to repeat the preceding command line
    as needed.


    Don''t concern yourself too much with this information now. For most of this book,
    you don''t need to know these particulars. When you do need to know something
    about a particular syntax, come back here for a refresher.


    # Keystrokes and such


    Keystrokes are shown with a plus sign between the keys. For example, Ctrl+Alt+Delete
    means that you should press the Ctrl, Alt key, and Delete key all at the same
    time. (No, we don''t make you press any more than three keys at the same time).


    Most applications and utilities we describe in this book use graphical user interfaces
    (GUIs), such as GNOME, which allow you to control your computer by pointing and
    clicking with your mouse. Occasionally, however, we give nongraphical instructions
    that require pressing keys on your keyboard. In those situations, we often simplify
    the instructions by saying "Select OK." That generally means that you press the
    Tab key, which moves the cursor to the OK button, and then press the Enter key.
    Two-step process is equivalent to clicking an OK button in a GUI.


    # How This Book Is Organized


    Like all proper Dummies books, this book is organized into independent parts.
    You can read the parts in any order. Here try reading backward for a real challenge.
    This book is not meant to be read from front to cover; rather, it''s meant to
    be a reference book that helps you find what you''re looking for when you''re
    looking for it. Between the Contents at a Glance page, the table of contents,
    and the index, you should have no problem finding what you need.


    If you do read the book in order, you encounter the useful and interesting things
    first and the more technical items last. For instance, after installing Red Hat
    Linux in Part I, you may want to immediately proceed to Part II to see how to
    connect Linux to the Internet or your local network. From there, you can use your
    new workstation to surf the Internet and use e-mail.


    The following sections describe each part.'
