    theme of the CD Player skin. A simple help system is available too.

    * The remaining controls are self-explanatory: start, stop, forward, yada-yada.


    As you can see, playing CDs is pretty simple. Note that in Chapter 12 we show
    how to use XMMS and the more general-purpose MPlayer players play Internet streams
    and files.


    # Ripping CDs


    Are you paranoid? If not, do you want to be? Well, cdparanoia can help fulfill
    all your fears. Just kidding. Really, cdparanoia is used for ripping the audio
    information — music files — from CDs to your hard drive or to other CDs.

    Ripping refers to the process of copying audio from a CD to your computer.


    The following steps show how to use the Gnome RIP (Grip) interface to simplify
    using cdparanoia to copy music from a CD to your hard drive:


    +   1. Insert your favorite CD in the drive.

    * 2. Click the GNOME Menu button and choose Sound & Video:More Sound & Video Applications.

    * 3. The Grip window, as shown in Figure 11-4, opens.

    * 4. Click the Rip column (right side of screen) of each track you want to use.

    nA check mark appears next to each track you select.

    * 5. Click the Rip tab at the top of the window (next to the Tracks tab).

    * 6. Click the Rip Only button.'
