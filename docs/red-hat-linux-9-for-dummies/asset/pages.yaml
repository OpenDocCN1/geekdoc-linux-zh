    # Is the power turned on?


    First, verify that you turned on the power. It sounds simple, but, hey, some-times
    the simplest things go wrong.


    # Is your network cable broken?


    Make sure that your network cables are not broken or cut. Check the connectors
    to make sure that they''re okay. You should also make sure that you are using
    the correct network cable, which should be category 5 (8-wire) straight-through
    cable.


    # Is your Ethernet hub or switch working?


    Your Ethernet hub or switch should also be turned on. Ensure that the net-work
    cables are also connected securely.


    If you''re stuck in the Middle Ages (with us!) and are using coaxial net-work
    cable called Thinnet — or 10Base-2 for geeks — you don''t have to check an Ethernet
    hub/switch you don''t have. Thinnet connects each NIC (computer and printer, for
    example) to every other NIC on the subnet. In other words, each computer that
    is on a Thinnet cable is connected electrically to all other computers in the
    network. Each computer sees all the-work traffic on that cable. If any part of
    that bus is compromised, all traffic ceases. For example, if you disconnect the
    terminator at either end of the


