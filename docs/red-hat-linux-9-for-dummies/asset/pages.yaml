    You should learn a few basics before you start to use your new Red Hat Linux computer.
    This chapter covers enough of the Linux fundamentals to get started, including
    topics such as starting and stopping Red Hat Linux and understanding the difference
    between graphical and nongraphical applications.


    We start by introducing the system Linux uses to store information on a disk.
    Linux, like Windows, uses files and directories to store and organize information
    and applications. The following section describes the Linux file system.


    # Introducing the Linux File System Tree


    Linux, like Unix, refers to everything as a file, giving each device, file, and
    directory a file address to identify it. Linux refers to drives and drive partitions
    using a system of letters and numbers; for example, /dev/hda could be the name
    of the first IDE hard drive, and /dev/sdb could be the name of the second SCSI
    hard drive.


    You can compare the Linux file system to a tree, as shown in Figure 4-1, which
    shows three subdirectories of root (more than a dozen subdirectories are in the
    root directory); a subdirectory is a directory within a directory. The top of
    the upside-down tree, represented by a / (slash), is the root directory. A series
    of limbs, branches, and leaves extend below the root: Limbs are'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# 56 Part I: Installing Red Hat Linux


    mount points, the branches that extend from the limbs are directories, and the
    leaves on those branches are your files.


    ![](img/cc58a1e8691061866010ce216f881372_79_0.png)


    Each *mount point* is a drive partition or remote file system (such as your CD-ROM
    drive) that is *mounted*, or made visible to, a directory of the limb above it.
    When a disk partition or remote file system is mounted on the directory branch,
    it turns that branch into another limb, allowing even more branches to be positioned
    and attached to the mount point.


    Red Hat Linux needs at least a root partition and a swap partition. The root partition
    is used to store all your personal and system files and directories, and Linux
    uses swap space, the Hamburger Helper of the computer world, to extend your memory
    beyond the limit of your random access memory (RAM). If you have 512MB of RAM
    and 512MB of swap space, for example, you can run programs that use 1GB of memory.


    This configuration isn''t much different from Windows and MS-DOS file systems.
    Windows uses the concept of a hierarchical directory tree; however, the syntax
    is somewhat different. The top-level directory in root is designated with a forward
    slash (/). Every subdirectory follows that slash. For example, the home directory
    of root is shown as /home. In Windows, the root directory is designated with an
    initial backslash (\). The famous C: is synonymous with C:\ The theme for both
    operating systems is carried forward when dividing subdirectories: Linux uses
    forward slashes, and Windows uses backslashes. Your home directory is then shown
    as /home/me in Linux and as \user\me in Windows.


    Another primary difference between Linux and Windows file systems is that Linux
    requires you to explicitly mount file systems. Windows does so automatically.
    Explicitly mounting the file system is not onerous as it is in Linux. Red Hat
    Linux installs utilities that automatically sense and mount file systems when
    necessary. For example, the default Red Hat Linux configuration automatically
    mounts a CD-ROM when you insert it into the drive.


    The Workstation installation type we use in Chapter 3 automatically sets up your
    root and swap partitions in addition to an additional boot partition used'
