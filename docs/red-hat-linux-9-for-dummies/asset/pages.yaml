  md: '# Appendix E


    # About the CD-ROMs


    The CD-ROMs that come with this book contain the Publisher''s Edition distribution
    of Red Hat Linux 9. This appendix describes the minimum computer configuration
    you need to install Red Hat Linux and also some of what you get on the companion
    CD-ROMs.


    ![](img/cc58a1e8691061866010ce216f881372_366_0.png)


    Although the CD-ROM kernel and many supporting GNU programs and applications,
    they don''t carry some utilities and applications described in the book. You may
    download such utilities from the Red Hat Web site (www.redhat.com) or purchase
    the full boxed set of CDs. You can also download commercial applications, such
    as VMware and RealPlayer, from their respective Web sites.


    # System Requirements


    Make sure your computer meets the minimum system requirements listed here and
    in Chapter 3. More resources are needed for a graphical workstation. If your computer
    doesn''t match up to most of these requirements, you may have problems installing
    and running Red Hat Linux:


    +   - A Pentium-class PC with a 200MHz or faster processor recommended.


    +   - For the best performance using the X Window System, we recommend at least
    64MB, preferably 128MB, of main memory. You can never have too much memory, and
    these numbers are the least amount you should have.


    +   - Red Hat provides several installation classes that install different bundles
    of software. The installation classes take up different amounts of space, course.
    The basic installation, Personal Desktop, takes a little less than 2GB of disk
    space. The Workstation installation consumes roughly 2.2GB; we use this in Chapter
    3. We recommend that your computer have a minimum of 2.5GB. That space leaves
    you with about 250MB to play with when using our installation instructions.


    +   - A CD-ROM drive, (and, optionally, a 3¼-inch floppy disk drive pulls a blank
    3¼-inch disk), a multisync monitor, an internal IDE or SCSI hard drive, a keyboard,
    and a mouse.'
  merge: -1
  pgno: 366
- img_proc: true
  md: '# 344 Part VI: Appendixes


    The instructions for installing the Red Hat Linux operating system from the CDs
    are detailed in Part I. After you install the software, return the CDs to their
    plastic jacket, or another appropriate place, for safekeeping.


    # What You Find


    You can download the installation manual from the Red Hat Web site (www.redhat.com/support).
    The CDs don''t contain the Linux source code and some utilities that come with
    the full Red Hat Linux distribution. You can download the full distribution from
    www.redhat.com/download/mirrors html if you have a broadband Internet connection.
    You can also use the coupon at the back of this book (plus some dinero) to obtain
    the extra CDs that contain the extra stuff.


    You may view much of the documentation on these CDs through an HTML viewer, such
    as Mozilla, which is also included in the CDs; or you may print most of the documentation
    from other operating systems, such as DOS, Windows, or Unix.


    The CD-ROMs have a nearly full implementation of Linux, and to list all the accompanying
    tools and utilities would take too much room. Briefly, the CDs include most of
    the software that you can use


    +   - Access the Internet

    - Write programs in several computer languages

    - Create and manipulate images

    - Create, manipulate, and play back sounds (if you have a sound card)

    - Play certain games

    - Work with electrical design


    ![](img/cc58a1e8691061866010ce216f881372_367_0.png)


    For more information about Red Hat Linux agreements and installation, the pages
    at the end of this book following the index.


    # If You Have Problems (Of the CD Kind)


    We tried our best to test various computers with the minimum system requirements.
    Alas, your computer may differ, and Linux may not install or work as stated.'
  merge: -1
  pgno: 367
- img_proc: true
  md: '# Appendix E: About the CD-ROMS 345


    The two likeliest problems are that you don''t have enough RAM for programs you
    want to use or you have some hardware that Linux doesn''t support. Luckily, the
    latter problem occurs less frequently each day as more hardware is supported by
    Linux.


    You may also have one or more FireWire, USB, or SCSI hard drives that use a driver
    (called a kernel module in Linux parlance) not supported by Linux or a controller
    that is simply too new for the Linux development team to have given it the proper
    support at the time these CDs were pressed.


    If you have trouble with the CD, please call the Wiley Publishing Customer Care
    phone number: 800-762-2974. Outside the United States, call 1-317-572-3994. You
    can also contact Customer Service by e-mail at techsupdum@wiley.com. Wiley Publishing,
    Inc. provides technical support only for installation and other general quality-control
    items; for technical support for the applications themselves, consult the program''s
    vendor or author.'
