  md: '# Chapter 7


    # Connect Locally, Communicate

    Globally: Connecting to a LAN


    In This Chapter


    +   - Networking with an Ethernet or wireless NIC

    - Using the Red Hat Network Utility

    - Starting and stopping your local network connection


    This chapter shows how to connect your Red Hat Linux computer to an existent Local
    Area Network (LAN), also referred to as a private network. It''s different from
    connecting directly to the Internet with a dial-up modem or broadband connection,
    as we describe in Chapters 5 and 6; these chapters describe how to connect a single
    stand-alone Red Hat Linux computer directly to the Internet. In this case, you
    connect your Red Hat Linux computer to a LAN.


    You may be building your Red Hat Linux computer to use at work or at school. It
    doesn''t matter what the venue is; you can use the information in this chapter
    to connect your computer to an existing LAN. You can access the Internet if that
    LAN is connected to it.


    Don''t be discouraged if you don''t have access to a LAN. You can make your own!
    Chapter 14 describes how to put one together.


    In this book, the terms LAN and private network are used interchangeably.


    If you configured your Ethernet card during the installation process we describe
    in Chapter 3, that''s great! You can skip this chapter or just browse through
    it if you need to later. Otherwise, if you have a wireless adapter or didn''t
    configure your Ethernet adapter during the installation, use this chapter-to do
    that.


    Although forming a private network isn''t exactly rocket science, describing in
    detail how to connect two or more computers is beyond the scope of this book because
    so many network configurations are possible. Many good books are available that
    explain how to do that, and the best place to start is at the Wiley Web site:
    www.wiley.com.


    ![](img/cc58a1e8691061866010ce216f881372_122_0.png)'
  merge: -1
