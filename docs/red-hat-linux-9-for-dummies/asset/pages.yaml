    10. Enter your site pass phrase when prompted.


    Tripwire does its work. It creates a database of checksums for all the files in
    the directories listed in the twpol.txt file. Tripwire is configured to check
    its checksum database on a daily basis. It-mails a summary of its findings to
    the root user by default. You should log in as root and check the summary regularly.


    Tripwire used to create unencrypted databases on read-only media so that a successful
    hacker could cover his tracks. Tripwire now makes life much easier for you by
    encrypting the database. Unless you give your pass phrases, a hacker cannot modify
    your database without your knowing about it. Maintaining the Tripwire database
    on local media saves time and money.


    ![](img/cc58a1e8691061866010ce216f881372_280_0.png)


    Test Tripwire. These instructions describe how to change a file and run Tripwire.
    Tripwire detects the change and leaves it up to you to decide whether the change
    is legitimate:


    +   1. Change the time stamp on an important system file:


    ```

    touch /etc/hosts

    ```


    +   2. Run Tripwire in check mode:


    ```

    tripwire --check

    ```


    +   3. Tripwire computes the /etc/hosts checksum and compares it to the one found
    in the database. Tripwire takes minutes or longer to do its job. After Tripwire
    is finished, it shows that the /etc/hosts file was changed.


    After you are notified that a file is changed, you determine whether the change
    was valid or possibly caused by a hack. In this case, we changed the /etc/hosts
    file. You need to regularly check the Tripwire results and make sure that no unauthorized
    changes were made.


    Traditionally, it was necessary to protect the Tripwire checksum database by storing
    it on read-only media. If the database is ever compromised, Tripwire can be made
    to give erroneous results, allowing a break-in to go undetected. However, the
    correct Tripwire version protects the database by encrypting it. The information
    stored in the database cannot be altered unless the encryption is broken — an
    unlikely occurrence. If the database file itself is modified, the signature does
    not match and the compromise is detected.'
