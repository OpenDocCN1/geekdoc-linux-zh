  md: '# # Chapter 1

    # And in the Opposite Corner...

    # a Penguin?


    +   In This Chapter

    * Napping through Linux History 101

    * Finding out what Red Hat Linux can do

    * Using Red Hat Linux network functions

    * Using Red Hat Linux as a workstation


    We see a penguin in your future. He''s an unassuming fellow who''s taking on a
    rather big competitor — that other operating system — in the battle for the hearts,
    minds, and desktops of computer users. Red Hat Linux, with its splashy brand name
    and recognizable logo, is undeniably one of the driving forces behind the Linux
    revolution — and is by far the most popular Linux brand.


    This chapter introduces you to the latest and greatest Red Hat release, Red Hat
    Linux 9. This book covers all the bases — a good number of bases, at least — about
    how to use Red Hat Linux as a desktop productivity tool, Internet portal, multimedia
    workstation, and basic network server. You can do lots of things with Red Hat
    Linux, and this chapter gives you an overview of the possibilities in addition
    to a brief look at the history of Linux.


    # ## History of the World —

    ## Er, Linux — Part II


    In the beginning of computerdom (said in a booming, thunderous voice), the world
    was filled with hulking mainframes. These slothful beasts lumbered through large
    corporations; required a special species of ultranerds to keep'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# 12 Part I: Installing Red Hat Linux


    them happy; and ate huge chunks of space, power, and money. Then came the IBM
    PC and Microsoft Windows, and the world changed. Power to the people — sort of.


    In 1991, a student at the University of Helsinki named Linus Torvalds found himself
    dissatisfied with his operating system. Torvalds found that the Unix operating
    system might be better suited to help him his work. Unix was invented in the 1970s
    and, although powerful, was expensive, so he began writing his own version of
    Unix. - not! After formulating the basic parts, Torvalds recruited a team of talented
    programmers from the Internet, and they created a new operating system, or kernel,
    now named Linux.


    One of the most important decisions Torvalds made in the early days of Linux was
    to freely distribute the Linux kernel code for anyone to do as they wanted. These
    free Linux distributions were and still are available in several forms, mainly
    online.


    The only restriction on the free distribution of his creation was that no version
    of the software could be made proprietary. Proprietary software is owned and developed
    under wraps by private companies. Open source code is for "the people" — anyone
    can develop it without breaking the law. You can modify the heck out of it and
    distribute it for fun (and for profit, if you want). What you can''t do is stop
    anyone else from using, modifying, and distributing even your modified version
    of the software — either free or for profit.


    The lack of proprietary restrictions on Linux has led to drastic improvements
    in the technology. We can''t overstress how important it has to the Linux operating
    system that its source code is freely available; the Linux operating system continues
    to improve rapidly — even organically — because it is continually tweaked by lots
    of really smart people. (In contrast, proprietary operating systems, like Microsoft
    Windows, are tweaked every once in a while by a smaller group of smart people).


    By the early spring of 1994, the first real version of Linux (Version 1.0) was
    available for public use. Even then it was an impressive operating system that
    ran smoothly on computers with less than 2MB of RAM and a simple 386 microprocessor.
    Linux 1.0 also included free features for which other operating systems charged
    hundreds of dollars. Nowadays, tens of millions of users enjoy Linux at home and
    work.


    By the way, if you''re wondering about the little penguin, the answer is disappoint
    simple. The reason the friendly penguin (whose name is Tux, by the way) symbolizes
    All Things Linux is that Linus Torvalds, the inventor of the Linux operating system,
    loves penguins. Some mystery, he?


    ![](img/cc58a1e8691061866010ce216f881372_35_0.png)'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Chapter 1: And in the Opposite Corner ... a Penguin?


    # Knowing What You Can Do with Red Hat Linux


    Linux is freely available software. The source code for Linux, which is the heart
    and soul of the operating system, is also publicly available. The Free Software
    Foundation (FSF) contributes much of the utilitarian software that makes Linux
    much easier — FSF is the brainchild of the great Richard Stallman.


    Red Hat combines all those pieces plus some additional applications and then goes
    another step and adds a few of its own to create an integrated product. Red Hat,
    Inc., combines the basic Linux operating system with software (some made by other
    companies and some made by Red Hat) to produce a package with a value that''s
    greater than the sum of its parts. That combination is a distribution, or flavor,
    of Linux.


    So that you can get up and running with Red Hat 9 as quickly as possible, we''ve
    been seen enough to include the Publisher''s Edition operating system on the CDs
    that come with this book. The Publisher''s Edition contains all the major parts
