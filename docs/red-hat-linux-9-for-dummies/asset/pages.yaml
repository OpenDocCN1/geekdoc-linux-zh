  md: '# Author''s Acknowledgments


    I want to thank my wife, Lidia, for her patience, support, and good advice, all
    of which have made writing this book possible. Without her, I would still be the
    pocket-protector-inserted-into-shirt, busted-eyeglass-fixed-with-tape-wearing,
    ''Star Trek''-watching, wrinkled-shirt-suffering, spaghetti-with-the-pot-over-the-sink-eating,
    Saturday-night-hacking sorry-sack sorta guy. Well, I was never into ''Star Trek'',
    and I am pecking at this Saturday night, but my wonderful and beautiful wife certainly
    has made me a better man.


    And, of course, I want to thank the staff at Wiley Publishing, who provided considerable
    and essential help, too. Terri Varveris and Rebecca Whitney provided constant
    and essential assistance. Their patience with me was truly vital.


    I also want to thank Laura Lewin, who gave me the chance to help write this book.
    She showed great confidence in me. I''m also in debt to Anne Hamilton (now for,
    er, the other guy), who gave me my first Linux gig. I''m truly grateful and wish
    them success in their new ventures.


    I also want to acknowledge a total lack of assistance in writing this book from
    my dog, the infamous Oso Maloso; eater of many things that should have ended his
    long career early, including but not limited to: ant poison, Advil, pounds of
    toustie rolls all Halloween, several bags of chicken bones during one party, beer
    and other assorted items; escaper of many fences and gates; and friend of the
    late, great Paunchy (former demigod of Albuquerque).


    How useful was Oso? Well, one night while working on this book, I got a phone
    call. Leaving my apple pie behind next to the keyboard, I went downstairs to take
    the call and passed him on his way up. I should have known something was up because
    he had a cell phone with him and no one answered when I picked up to take the
    call. I went up the stairs while he went down. The apple pie was gone. Oso 1,
    human 0.


    — Paul G. Sery'
