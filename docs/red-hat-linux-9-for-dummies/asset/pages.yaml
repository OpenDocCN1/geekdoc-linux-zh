    # Dealing with the hardware


    One great thing about Internet is that you can buy the modems from your local
    electronics store or an Internet distributor. DSL equipment is less readily available.
    Cable modems are generally priced the same whether you purchase through your provider,
    the Internet, or a bricks-and-mortar store. But the convenience of running to
    a local store is great, especially if your cable modem breaks on a Saturday night
    and you just have to download the latest game patch.


    Before you purchase a cable modem, make sure that you


    +   - Ask whether you have to buy your modem through the cable provider. If not,
    you can shop around for the best price.

    - Make sure that the modem you buy is compatible with your service provider. The
    cable industry is converging on using the Data Over Cable Service Interface Specification
    (DOCSIS) as its Internet hookup standard. DOCSIS modems are quite easy to configure,
    so keep your fingers crossed that your provider uses them.

    - If your provider doesn''t use DOCSIS, you likely have to purchase your modem
    through your provider.


    The instructions we provide later in this chapter are designed for DOCSIS modems.


    Setting up your cable modem is usually a straightforward process. Modern DOCSIS
    cable modem acts as network bridges. A network bridge simply reprocasts network
    packets in both directions—incoming and outgoing. One side of the bridge connects
    to the cable TV channel. The other side connects to your computer through your
    Ethernet NIC through a Cat 5 crossover cable; If your modem is the bridge type—we
    believe that the cable industry in the United States most uses that system—it
    doesn''t require any configuration.


