- img_proc: true
  md: '# 78 Part II: Got Net?


    device, such as a modem. An external modem is generally connected to port /dev/ttyS0
    /dev/ttyS1, although configuring it as /dev/ttyS2 or /dev/ttyS3 is possible. If
    you have an internal modem, it can be any one of the tty devices.


    During the boot process, Red Hat Linux provides the kudzu utility, which automatically
    tries to locate new devices on your system. The kudzu utility is good at detecting
    equipment like modems (both internal and external). When kudzu detects a new device,
    it prompts you to configure the device, and you should let it do.


    If kudzu cannot find your modem, finding it by process of elimination is how a
    crude but effective method. The following two numbered lists describe how to find
    your modem. The first method, for an external modem, involves sending a string
    of characters to the modem and watching for the light-emitting diodes (LEDs) to
    light up. The second method is for internal modems, which don''t have LEDs, so
    you have to use the hideous screeching sound of your modem to track it down.


    To use kudzu to find an external modem, follow follow these steps:


    +   1. **Run this command from a command prompt:**


    ```

    echo "anything" > /dev/ttyS0

    ```


    Honestly, it doesn''t matter what you put between the quote marks in the preceding
    commands. It just has to be some text — any text.


    If your modem is connected to the target serial port, you see the send/receive
    LEDs (sometimes marked as RX/TX) light up in a short burst.


    +   2. In the unlikely situation that your modem isn''t found, trying the string
    to /dev/ttyS1, /dev/ttyS2, and, finally, /dev/ttyS3 by altering the number at
    the end of the command in Step 1 to match the port''s targeting.


    Life is a bit harder if you have an internal modem because you don''t have a visual
    response. You can, however, listen to the modem''s speaker to find out what''s
    going on. Follow these steps:


    +   1. **Enter this command at a command prompt:**


    ```

    echo "atdt55555309" > /dev/ttyS0

    ```


    If you hear the modem pick up and dial, you have won the game of hide-and-seek
