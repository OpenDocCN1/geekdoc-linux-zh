    but you can''t do that for your data. You don''t want to lose any data or programs
    that you worked hard to create. Refer to your system''s owners'' manual to find
    out how to back up your system and to restore the data if necessary.


    ![](img/cc58a1e8691061866010ce216f881372_45_0.png)


    # # Resizing Windows 9x and Windows Me FAT partitions with FIPS


    FIPS resizes your FAT-based Windows partitions. Newer versions of Windows (some
    versions of Windows 95, Windows 98, and Windows Me) use a 32-bit file allocation
    table (called FAT32) and drive management tools that provide for single-drive
    configurations larger than 2GB. Older versions of Windows 95 use a 16-bit FAT
    (called FAT16, oddly enough); to use more space over and above 2GB, the drive
    has to be partitioned into logical drives of 2GB or less. Newer computers have
    hard drives much larger than the old 2GB limit. If the drive is repartitioned,
    the large drive management system is disabled, and DOS and Windows partitions
    are again limited to 2GB.


    You need to use the ancient MS-DOS (Microsoft Disk Operating System) operating
    system — one, way or another, all of Windows-dom owes its existence to MS-DOS.
    The following instructions describe how to create an MS-DOS boot floppy disk,
    which you use to run FIPS:


    +   1. Boot your Windows 9x or Me computer.


    +   2. Insert a floppy disk and click the My Computer icon.


    Be aware that these instructions permanently erase all information from the disk.


