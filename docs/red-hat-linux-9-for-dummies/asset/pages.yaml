  md: '# 204 Part: Revenge of the Nerds


    The process of constructing a wireless network is straightforward. You need to
    decide on how your wireless devices connect into your private network. You can
    do this in two ways:


    +   **Use a wireless access point:** *A wireless access point (WAP)* is a device
    through which wireless devices communicate. An access point provides a single
    point of contact for all other devices to communicate through.

    An access point uses two network connections. One is an Ethernet point that connects
    to your private LAN through a Cat 5 Ethernet cable, and the other point connects
    to your wireless devices. The access point serves as a common connection point
    to your LAN.

    The other connection point is the access point''s wireless receiver. The wireless
    "port" communicates with all the other wireless devices on your network.

    To summarize, an access point acts like a traditional wired hub or switch. The
    hub or switch is the network at an electronic — or physical — level. All the network
    communication for the subnet that the switch/hub controls goes through that hub
    or switch. The device provides the infrastructure for the subnet. Accordingly,
    using a WAP means going into Infrastructure mode. Also, you pay more for the more
    complicated network setup.


    +   **Point-to-point (Ad-Hoc) communication:** Counter to popular opinion, you
    can create a wireless network without an access point. Wireless NICs are designed
    to communicate directly with each other as well as through an access point. You
    configure NIC to know a common network name and a common encryption key, and the
    NICs form their own ad hoc network by communicating directly with each other.
    We show how you do later in this section.


    Point-to-point communication is referred to as Ad-Hoc The term ad hoc means that
    you put something together with what you have in whatever way you can. Using Ad-Hoc
    mode means that each wireless device can communicate with the other wireless devices.
    (Setting up a network with wireless NICs is less expensive than using WAPs.)


    You can purchase an access point to construct your wireless LAN. That is simple
    and quick, if a little expensive. If you choose to route, it leaves up to you
    to follow the access point''s instructions for connecting other computers to it.
    You can follow the instructions in Chapter 7 for configuring your Red Hat Linux
    NIC to an access point.


    We describe how to save a few bucks and use a Linux computer to build an ad hoc
    network. Building an ad hoc network requires you to use a Wi-Fi NIC on a Linux
    gateway. You then configure every computer, on your private network, to use the
    same network name and encryption key. The computers can then communicate directly
    with each other through the Linux gateway to the Internet. Figure 14-2 shows this
    simple, inexpensive, and elegant design.'
  merge: -1
