  md: '# Appendix B


    # Filing Your Life Away


    In This Appendix


    +   - Learning about Linux files and directories

    - Finding your way through the Linux file system

    - Creating, moving, copying, and destroying directories and files

    - Changing file ownership and permissions

    - Making up your own rules


    In this appendix, you take your first steps through the Linux file and directory
    structure. Don''t worry: Linux may live a structured life, but it''s still flexible.
    With a bit of introduction, you will begin to understand the Linux way of life.


    We also introduce you file types, subdirectories, and the root (which is not evil
    at all) directory. You''re also shown the way home — to your home directory. After
    you''re oriented to the Linux files-and-directories structure, we show you how
    to make some changes, such as how to copy and move files and how to destroy them.


    # Getting Linux File Facts Straight


    Linux files are similar to Unix, DOS, Windows, and Macintosh files. All operating
    systems use files to store information. Files allow you to organize your stuff
    and keep them separate. For example, the text that comprises this appendix is
    stored in a file; all the other book elements are stored in their own files. Follow
    the bouncing prompt as we make work of long files.


    We use the command-line interface (CLI) to examine file and file system basics
    in this appendix. Graphical user interfaces (GUIs), such as Nautilus, are also
    useful, and we use them extensively in this book. However, we believe that using
    a CLI is better for finding out about this subject. All examples in this appendix
    use the GNOME Terminal Emulation Program to provide the CLI.


    ![](img/cc58a1e8691061866010ce216f881372_330_0.png)'
  merge: -1
