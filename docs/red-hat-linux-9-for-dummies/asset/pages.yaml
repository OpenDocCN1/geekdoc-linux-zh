    +   - Look at the interface between the cable and Ethernet switch/hub — or the
    BNC connector, if you''re using Thinnet — to make sure they''re in good physical
    contact. Sometimes the cable can pull out a little bit and break the connection.


    +   - Look at the cable itself and make sure that it hasn''t been cut or crushed.


    +   - If you''re using Thinnet, make sure that each end of the cable has a 50
    ohm terminator attached to it. otherwise, it doesn''t work right, just as it doesn''t
    work right if the cable is broken. The reason is that frequency (RF) signal reflects
    from the unterinated end and interferes with the incoming signals. If you have
    a spare cable that you know, try substituting it. The idea is to eliminate as
    many segments that you are unsure about as possible. If you have two computers
    in close proximity and you suspect a problem with the cable you''re using, all
    they are far apart and rely on several segments or a long cable, try moving them
    closer together and using one short segment. If you have three or more computers,
    try getting just two of them working together. Then adding another until you find
    the faulty segment.


    # “I is an engineer”


    An experienced engineer and Linux author once got really angry with a cable TV
    company. His cable service denied him in the middle of a Philadelphia Eagles game.
    It didn''t matter that the Eagles were losing — he wanted to see the game because
    the Eagles don appear on TV often in Albuquerque. The engineer called the cable
    company immediately. Blah! Blah! Blah! My connection — Blah!


    Blah! The nice support person guided the poor engineer step-by-step through his
    own fault tree. Step 1: Is your VCR or TV turned on? “Yes, of course.” Step 2:
    Is the VCR button on your VCR toggled on? “Of course — ah, whoops, no, it isn''t.
    Ah, yes, it works now, thank you very much. “Goodbye.” D''oh! What was five years
    of electrical engineering school good for?'
