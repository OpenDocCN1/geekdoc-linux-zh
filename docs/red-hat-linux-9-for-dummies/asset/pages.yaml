  md: '# Chapter 9: Gnowing GNOME 135


    However, because you don''t have four monitors, GNOME simulates four virtual monitors,
    called workspaces. Each workspace is equivalent to a real monitor, and you can
    spread out your work across it. The only limitation is that you can view only
    one workspace at a time.


    # Trading places on your workspace switcher


    Switching between workspaces is easy. GNOME provides a utility, the Workspace
    Switcher, to select any workspace. The Workspace Switcher is on the GNOME Panel.


    You use the GNOME Workspace Switcher to access each workspace. The Workspace Switcher
    is divided into four quadrants. Clicking any of the quadrants you place in the
    corresponding desktop. Click the lower-right one and you enter workspace.


    You can force a window into any or all workspaces. Click the downward-facing arrow
    in the upper-left corner of a window. The menu that opens all the expected functions
    that close, minimize, maximize, and resize the window. However, toward the bottom
    of the menu are options for placing the window in any of the remaining three workspaces;
    or, you can put the window in all the workspaces. You may may, for example, want
    to put an application like Mozilla in all workspaces in order to use it no matter
    what you''re doing.


    # Messing Around with Windows


    Before you can do anything to a window, you have to get its attention. When you
    have a window''s attention, it has focus. Depending on how you have set up GNOME,
    you can give a window focus with GNOME in several ways, including


    +   Click the window''s name in the Panel.

    Click the window''s title bar, at the top of the window.

    Click a part of the window itself, which typically also makes the window topmost
    one.

    If you''re working in an office with lots of people, you can shout, "Hey, you
    — wake up!" Although this tactic isn''t likely to wake up your window, it sure
    is fun.'
