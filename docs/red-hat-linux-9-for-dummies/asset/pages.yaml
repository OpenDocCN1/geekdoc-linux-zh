  md: '# 184 Part III: Linux, Huh! What Is It For? Absolutely Everything!


    # Audio by proxy: Getting XMMS

    to work through your firewall


    Firewalls are necessary to fight the evil guys who lurk on the Internet, but,
    they can really put a kink in your listening pleasure. A firewall is used to prevent
    unauthorized access from outside — in many cases, the Internet — from reaching
    your computer or network.


    To configure XMMS to work with proxy firewalls, follow these steps:


    +   1. Start XMMS.

    2. Right-click the XMMS window and choose Options: Preferences.

    3. Click the Ogg Vorbis plugin-in in the Input Plugins.

    4. Click the Configure button and the Ogg Vorbis Configuration window opens.


    The firewall we built in Chapter 8 and the default Red Hat firewall does not affect
    either of the players described here. However, many LANs are connected through
    proxy firewalls, which intercept packets to the Internet and rewrite them according
    to certain rules; our firewalls filter packets from their source and destination
    addresses and ports.


    You need to enter the address of your proxy server. You may need to contact your
    friendly neighborhood systems administrator to get that information.


    +   5. Use the Proxy button and enter the proxy server address in the Host subwindow.


    The following figure shows the configuration window with the proxy server information
    added.


    +   6. Click the Authentication radio button and enter your username and password
    in their respective subwindows if your proxy server requires them.


    ![](img/cc58a1e8691061866010ce216f881372_207_0.png)'
