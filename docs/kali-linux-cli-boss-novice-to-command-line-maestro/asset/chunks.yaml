    ## Chapter 3: File System Navigation and Management

    To navigate the file system, use `cd` to change directories. For example, `cd
    /home/user` moves you to the home directory. Use `ls` to list files and directories
    in the current location.


    ## Chapter 5: User and Permission Management

    Permissions are vital for security. Use `chmod` to change permissions (read, write,
    execute) and `chown` to change ownership.


    ```bash

    chmod 755 script.sh

    chown user:group file.txt

    ```


    ## Chapter 6: Package Management with APT

    `APT` is the package manager for Debian-based systems. Use `apt update` to refresh
    package lists and `apt install` to install new software.


    ```bash

    sudo apt update

    sudo apt install curl

    ```


    ## Chapter 7: Process Control and Monitoring

    Monitor running processes using `top` or `htop`. Use `kill` or `killall` to terminate
    a process.


    ```bash

    top

    kill -9 1234

    ```


    ## Chapter 8: Working with Text Files and Streams

    Use `cat` to view file content, `grep` to search for patterns, and `sed` or `awk`
    for text processing. Use pipes (`|`) to pass output between commands.


    ```bash

    cat file.txt | grep "error"

    ```


    ## Chapter 9: Basic Scripting and Automation

    Create scripts to automate repetitive tasks. Always start with a shebang like
    `#!/bin/bash`.


    ```bash

    #!/bin/bash

    echo "Hello World"

    ```

