    User input (potentially vulnerable to SQL injection)user_input="John''; DROP TABLE
    users; --"# Execute an SQL query with prepared statement (safe)mysql -h"$db_host"-P"$db_port"-u"$db_username"-p"$db_password"-D"$db_name"-e"PREPARE
