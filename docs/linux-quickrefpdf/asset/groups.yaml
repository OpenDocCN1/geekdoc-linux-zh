    # LINUX Admin Quick Reference


    ## /etc/NETWORKING

    (Slackware)


    HOSTNAME=hostname.domain.com


    Jialong He

    jialong_he@bigfoot.com

    http://www.bigfoot.com/


    boot and name is read from these files. May change manually.


    # NFS File Sharing


    # User Management


    # Files


    - /etc/group

    - /etc/passwd

    - /etc/shadow

    - /etc/bashrc

    - /etc/profile

    User account information.


    - /etc/fstab

    - /etc/exports

    - /etc/auto.master

    file systems mounted during boot. NFS server export list. auto master file.


    - /etc/ssh_config

    - /etc/login

    - $HOME/.bashprofile

    - $HOME/.bashrc

    bash system wide and user init files.


    # Commands


    - /etc/resolv.conf

    specify server DNS, DNS domain

    search 192.168.1.200


    - /etc/hosts

    host name to IP address.


    - /etc/hostname

    lookup order.

    order hosts, bind

    multion on


    - /etc/netswitch.conf

    - /etc/networks

    - /etc/protocols

    - /etc/interfaces

    new way to specify information.


    - /etc/rpc

    TCP/IP services and ports mapping.

    RPC service to map program numbers


    # Commands


    - mount

    - exports

    - showmount -e hostname

    mount a file system or all entries in fstab. export system list in exports. show
    file exported systems.


    # Printer Configuration


    - netconfig

    - ppsetup

    menu driven Ethernet setup program. set PPP connection (Slackware). set Setup
    Boot, for example


    # Files


    - /etc/printcup

    - /etc/printcap.local

    - /etc/lpd.conf

    - /etc/lpds.conf

    Printer capabilities database. LPR configuration. permissions control for the
    LPR line printer spooler.


    - /etc/hosts.lpd

    - /etc/hosts.quiv

    Access control (BSD LPD). trusted hosts. Environment variable of printer.


    # Commands


    - useradd, usermod

    - usermod

    - newusers

    - groupadd, groupdel

    - chage, fix, chsh

    script to create a new user account (slackware) or link to user ideal (Redhat).
    delete, create, modify a new user or update default new user information. update
    and create new users (batch mode). add or modify group.


    # PRN


    - ifconfig

    - ppsetup


    ```bash

    $ifconfig $1 $IPADDR $BROADCAST $($BROADCAST netmask $NETWORK $ETHMASK) out

    ```

    parallel port.


    - host

    - domainname

    - arping

    - ipchains

    - iptables

    lookup host name IP (or similar to lookup). DNS name lookup. find out by Ethernet
    address by first then arp. firewall and NAT (etc/sysconfig/network on Redhat)
    firewall and NAT (etc/sysconfig/iptables on Linux).


    # Files


    - sendmail.conf

    - sendmail.mc

    "sendmail.conf" is the configuration file. "sendmail.mc" is a macro file which
    can be used to generate "sendmail.conf" by: mkmff > sendmail.conf.


    - aliases

    mail lists, run after any change. include the header list in a file. mail access
    control, FEATURE(access), should be set in sendmail.conf. in /etc/mail access
    cyberpro.com relay domain.com relay DISCARD.


    - access

    make up hash /etc/mail access / <etc/mail access all host subdomain by entry.


    # Network Configuration


    - /etc/rc.d/1 (Slackware)

    - /etc/sysconfig/network-scripts/ifcfg-eth0 (Redhat)

    - /hostname

    IP address, Network mask. Default gateway are in these files. May edit manually
    to modify network parameters. hostname is set by "hostname" or during.


    # Red hat files in /etc/sysconfig


    # Configuration Files


    - keyboard

    keyboard_map, eg.

    KEYBOARD="/usr/lib/kbd/keysmaps.map"

    Mouse type, eg.

    MOUSEHYPE=machine

    XUMSET=


    - network

    network settings, contains NETWORKING=


    # Commands

    rebuild the data base for the mail aliases.


    - newaliases

    build access database, e.g.


    - makemap

    makemap hash access dbs.access


    # Useful Configuration Files


    - httpd

    Apache web server configuration.


    - smb

    Samba server file (for print).


    - lilo

    LILO boot loader configuration.


    - syslog

    System daemon (syslog) configuration.


    - ssh_config

    SSH client and server configuration.


    - ldconfig.conf

    default library path (ldconfig).


    - mtools.conf

    tool configuration (access DOS).


    - named.conf

    DNS server name (Redhat).


    - sysctl.conf

    kernel parameters by sysctl.


    - ntp.conf

    time server.


    - arada.conf

    Internet server configuration.


    - /etc/resolv.conf

    Extended index configuration.


    - postfix.conf

    postfix server.


    - protpd.conf

    network backup server.


    - mime.conf

    mail server configuration.


    # Configure Kernel

    - makeconfig

    Configuring the kernel with menu, or X Window interface.


    - makedep

    Building and installing a kernel.


    # Manage Modules

    insmod, lmmod, modprobe, rmmod, depmod

    Loadable modules.


    # Miscellaneous Files


    - /etc/shells

    allowed login shells


    - /etc/ftpsusers

    user names not used to ftp.


    - /etc/htost.allow

    TCP wrapper configuration.


    - /etc/host.deny

    contains system configurations.


    - /etc/sysconfig (redhat)

    floppy drive.


    - /dev/loop

    system run level.


    - /etc/init.d

    convert text file to linux format.


    - toml.conf (Slackware)

    dozux, unit.


    - unit.conf (Redhat)

    verify permission and group files.


    - pwck

    pwidth

    convert to shadow and groups.


    - grpcnv

    - shadowconf

    - quota

    - quotacheck

    - quotas

    - quotaf

    requestquota

    - lilo - D

    set LILO OS (defaults in lilo.conf)


    - crontab

    show or edit cron jobs.


    - sys-unconfig

    unconfigure system chfkroot-list

    list services started at run level. probe for new hardware (Redhat).


    - rpm

    ```bash

    rpm -i a package

    rpm -U a package

    rpm -q package

    rpm -U package

    ```


    # Configure Apache 2.0 with SSL

    - man cmd | col -b

    save a page with text and reference commands.


    - mod_ssl

    (1) when apache, specify --enable-ssl for config. By default, ssl is not enabled.
    After compiling, use "mod-ssl" to be in the list modules, "mod-ssl" should be
    in the header.

    (2) generate private key

    (3) generate certificate

    (4) generate self-signed certificate

    ```bash

    openssl -x509 -days 365 -newkey server.key -out server.key -out server.crt

    ```

    (5) "mod_ssl", which will be included in httpd.conf. spec "--module", otherwise
    contained in <IfModule SSL> in the server.


    # Syslog

    Each line consists of a selector and an action. A section has two parts: priorities
    and facilities, separated by a bracket (). You may define a priority with an equality
    sign (=) to specify only this priority or others. If both are valid, tool will
    proceed with the priority with an exclamation mark (!) to include all priorities,
    except this one and any higher priority.


    Example:

    ```

    * *emerg /var/log/log to a file

    * #myhost.domain.com # log to remote host

    ```


    - facilities

    - priorities

    - action


    # Compile Modules

    - make modules

    - make modules_install

    Building and installing modules.


    # IPtables (Netfilter)


    # X Window (XFree86)


    # Command Syntax

    Other commands:


    Files

    To set resolution, in "Screen" section and "Section Display", specify a mode.
    For example: Modes "1024x768"


    ```

    iptables [-command] <chain> <parameters>

    (1) --name -d (2) -delete -D (4) -erase -Z

    (5) check -C (6) delete -X (7) rename -E

    ```


    Save and Restore

    /sbin/iptables-save /etc/sysconfig/iptables

    /sbin/iptables-restore /etc/sysconfig/iptables


    To specify refresh rate, in "Monitor" section, specify a rate. For example: Verfresh
    70-120


    Firewall script example

    http://linux.example.com/iptables_examples.html

    clients to run after X started


    # Parameters

    by protocol; by number or using name, dp, icmp


    ```

    X11/xinit/rc

    X11/xinit/rc

    ```


    # Build-Table

    | Parameter | Description |

    | :--- | :--- |

    | --protocol | Match protocol |

    | --source | Match source address |

    | --destination | Match destination address |

    | --fragment | Match fragment |

    | --port | Match source port |

    | --port | Match destination port |


    # Commands

    This table allows to create rules. In chain:

    1. INPUT - This chain allows packets received via a network interface.

    2. OUTPUT - This chain allows locally-packets before they are routed via a network
    interface.

    3. FORWARD - This chain allows packets received on one interface and sent out.

