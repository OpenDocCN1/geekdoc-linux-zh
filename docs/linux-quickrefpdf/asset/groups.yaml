- md: '

    This file is formatted using a configuration file X86Config for setup, or "x86cfg"
    directory. X86Config file is composed of a number of sections which may be present
    in any order. Each section follows the


    Option "OffTime" "time"

    Sets the inactivity timeout for the "off" phase of DPMS mode, default 40 minutes.


    Section "InputDevice"

    Identifier "Generic Keyboard"

    Driver Keyboard

    Option "AutoRepeat" "30"


    Section "SectionName"

    The graphs are described in Device sections, and the Mouse is reported by the
    InputDevice sections. both Keyboard and Pointer are also registered in ServerLayout
    section.


    Option "DefaultLayout" "layout-id"

    Sets the default ServerLayout used to serve. Default is ServerLayout section.


    Section "ServerFlags"

    Option "BlankTime" "99"

    Option "StandbyTime" "99"

    Option "SuspendedTime" "99"

    Option "OffTime" "99"


    Section "InputDevice"

    Identifier "PS2 Mouse"

    Driver mouse

    Option "CorePointer" "true"

    Option "Device" "dev/mouse"

    Option "Protocol" "PS2"

    Option "EmulateButtons" "true"


    Section "Module"

    Load "module". The module name should be the module''s name, not the file.


    Section "Module" "extmod"

    Load "type"


    Section "File"

    Option "Path" "path"

    Font elements may be either absolute paths, or font server identifier.


    Option "GBPath" "path"

    Used to set up multiple directories for storing loaded modules by X11 server.


    Section "Files"

    Path "/usr/X11/rgb"

    FontPath "/etc/type"


    Section "ServerLayout"

    Option "DontZoom" "boolean"

    Disable Ctrl+Alt+Keypad to terminate the X server.

    Enabled "Ctrl+Alt+Keypad" to switch video mode.


    Option "BlankTime" "time"

    Sets the inactivity timeout for the blanking phase of the screensaver in minutes.
    Default 10.


    Option "StandbyTime" "time"

    Sets the inactivity timeout for the "standby" phase of DPMS mode in minutes. Default
    20.


    Option "SuspendedTime" "time"

    Sets the inactivity timeout for the "suspend" phase of DPMS mode, default 30.


    Section "InputDevice"

    There are at least two InputDevice sections, for Keyboard and Mouse.

    Identifier

    Specify a unique name for this input device.

    Driver

    Specify the name of the driver to use for input device.

    Option "CorePointer"

    Option "CoreKeyboard"

    This input device is the primary driver.


    Section "Device"

    Specifications about video card used by the system. You must have at least one
    Device section in your configuration file. The devices are used in ServerLayout-section.

    Identifier

    Specify a unique name for graphics card.

    Driver

    Specify the name of the driver to use for graphics card.


    EXAMPLE

    Section "Device"

    Identifier "ATI MACH64"

    VendorName "ATI MACH64"

    VideoRam 2048

    EndSection


    Section "Monitor"

    Monitor section describes a monitor. There must be at least one monitor and the
    active one is used in ServerLayout-section.

    Identifier

    Specify a unique name for this monitor.


    HorizSync "horiz-sync"

    Sets the range(s) of horizontal sync frequencies of this monitor in kHz.


    VertRefresh "vert-refresh"

    Sets the range(s) of vertical sync frequencies of this monitor in kHz.


    EXAMPLE

    Section "Monitor"

    Identifier "Generic Monitor"

    VendorName "Monitor Vendor"

    ModelName "Monitor Model"

    HorizSync "31.5-56.6"

    VertRefresh "40-70"

    EndSection


    Section "Screen"

    Screen Section binds Device and Monitor sections. There must be at least one Screen
    Section. The active one is in ServerLayout section.

    Identifier

    Specify a unique name for this Section.


    Device "device-id"

    This identifies the identifier of Device to be used for this screen.


    Monitor "monitor-id"

    This identifies the identifier of Monitor to be used for this section.


    Default "depth"

    Default color depth, 8, 16 or 24.


    Option "acc"

    Each XAA (X Acceleration Affinity), default is ON.


    DISPLAY SECTION

    Each Section must have at least one Display Section which matches the values in
    DefaultDepth.


    Depth - depth

    This entry specifies what color depth of this Display Section.


    Virtual - yim

    Specifies the virtual resolution to be used.


    Viewport - x0 y0

    Sets the upper left corner of the initial display.


    Mode "mode-name..."

    Specifies the list of video modes to use. Each mode-name specified must be in
    double quotes. They must correspond to those specified in the appropriate Monitor
    section (including implicitly referred but ESA standards modes), can be switched
    with Ctrl+Alt+KeypadPlus or Ctrl+Alt+KeypadMinus.


    EXAMPLE

    Section "My Screen"

    Device "ATI Mach64"

    Monitor "Generic Monitor"

    DefaultDepth 16

    Subsection "Display"

    Depth 16

    Modes "1024x768" "800x600" "640x480"

    EndSubsection "Display"

    Depth 24

    Modes "1024x768" "800x600" "640x480"

    EndSection


    Section "ServerLayout"

    ServerLayout binds a Screen section and one or more InputSection to form a complete
    configuration. The active ServerLayout section is specified in ServerLayers. If
    not, the first ServerLayout section is active. If ServerLayout sections are present,
    the single screen and two active (core) input devices are selected as described
    in the relevant sections.

    Identifier

    An unique name for this ServerLayout Section.


    Screen screen-name "screen-id"

    The field-id is mandatory, and the Screen section being referred referenced.


    InputDevice "devaid" option...

    Normally at least two are required, for one core pointer and the other for the
    primary keyboard devices.


    EXAMPLE

    Section "ServerLayout"

    Identifier "Default Layout"

    Screen "My Screen"

    InputDevice "Generic Keyboard"

    InputDevice "PS/2 Mouse"

    EndSection

    '
  mdcn: '


    此文件使用配置文件 X86Config 或 "x86cfg" 目录进行设置。X86Config 文件由若干节（sections）组成，这些节可以以任何顺序出现。每个节遵循以下格式


    Option "OffTime" "time"

    设置 DPMS 模式下“关闭”阶段的闲闲超时时间，默认 40 分钟。


    Section "InputDevice"

    Identifier "Generic Keyboard"

    Driver Keyboard

    Option "AutoRepeat" "30"


    Section "SectionName"

    图形在 Device 节中描述，Mouse 由 InputDevice 节报告。Keyboard 和 Pointer 均在 ServerLayout 节中注册。


    Option "DefaultLayout" "layout-id"

    设置用于服务的默认 ServerLayout。默认是第一个 ServerLayout 节。


    Section "ServerFlags"

    Option "BlankTime" "99"

    Option "StandbyTime" "99"

    Option "SuspendedTime" "99"

    Option "OffTime" "99"


    Section "InputDevice"

    Identifier "PS2 Mouse"

    Driver mouse

    Option "CorePointer" "true"

    Option "Device" "dev/mouse"

    Option "Protocol" "PS2"

    Option "EmulateButtons" "true"


    Section "Module"

    Load "module"。模块名称应为模块名，而不是文件名。


    Section "Module" "extmod"

    Load "type"


    Section "File"

    Option "Path" "path"

    字体元素可以是绝对路径，也可以是字体服务器标识符。


    Option "GBPath" "path"

    用于为 X11 服务器设置存储已加载模块的多个目录。


    Section "Files"

    Path "/usr/X11/rgb"

    FontPath "/etc/type"


    Section "ServerLayout"

    Option "DontZoom" "boolean"

    禁用 Ctrl+Alt+Keypad 终止 X 服务器。

    启用 "Ctrl+Alt+Keypad" 切换视频模式。


    Option "BlankTime" "time"

    设置屏幕屏保护程序空闲阶段的闲闲超时时间，单位为分钟。默认 10。


    Option "StandbyTime" "time"

    设置 DPMS 模式下“待机”阶段的闲闲超时时间，单位为分钟。默认 20。


    Option "SuspendedTime" "time"

    设置 DPMS 模式下“挂起”阶段的闲闲超时时间，默认 30。


    Section "InputDevice"

    至少有两个 InputDevice 节，分别用于 Keyboard 和 Mouse。

    Identifier

    为此输入设备指定唯一名称。

    Driver

    指定用于输入设备的驱动程序名称。

    Option "CorePointer"

    Option "CoreKeyboard"

    此输入设备是主驱动设备。


    Section "Device"

    关于系统使用的显卡的规格。你必须在配置文件中至少包含一个 Device 节。这些设备在 ServerLayout 节中使用。

    Identifier

    为显卡指定唯一名称。

    Driver

    指定用于显卡的驱动程序名称。


    示例：

    Section "Device"

    Identifier "ATI MACH64"

    VendorName "ATI MACH64"

    VideoRam 2048

    EndSection


    Section "Monitor"

    Monitor 节描述显示器。必须至少有一个显示器，激活的显示器将在 ServerLayout 节中使用。

    Identifier

    为此显示器指定唯一名称。


    HorizSync "horiz-sync"

    设置此显示器水平同步频率的范围（单位为 kHz）。


    VertRefresh "vert-refresh"

    设置此显示器垂直同步频率的范围（单位为 kHz）。


    示例：

    Section "Monitor"

    Identifier "Generic Monitor"

    VendorName "Monitor Vendor"

    ModelName "Monitor Model"

    HorizSync "31.5-56.6"

    VertRefresh "40-70"

    EndSection


    Section "Screen"

    Screen 节绑定了 Device 和 Monitor 节。必须至少有一个 Screen 节。激活的节位于 ServerLayout 节中。

    Identifier

    为此节指定唯一名称。


    Device "device-id"

    指定用于此屏幕的 Device ID。


    Monitor "monitor-id"

    指定用于此节的 Monitor ID。


    Default "depth"

    默认颜色深度，8、16 或 24。


    Option "acc"

    XAA（X 加速相关性），默认开启。


    DISPLAY 节

    每个节必须至少有一个匹配 DefaultDepth 值的 Display 节。


    Depth - depth

    此项指定此 Display 节的颜色深度。


    Virtual - yim

    指定使用的虚拟分辨率。


    Viewport - x0 y0

    设置初始显示的左上角。


    Mode "mode-name..."

    指定要使用的视频模式列表。指定的每个 mode-name 必须加双引号。它们必须对应相应 Monitor 节中指定的模式（包括隐引的标准模式），可以通过 Ctrl+Alt+KeypadPlus
    或 Ctrl+Alt+KeypadMinus 进行切换。


    示例：

    Section "My Screen"

    Device "ATI Mach64"

    Monitor "Generic Monitor"

    DefaultDepth 16

    Subsection "Display"

    Depth 16

    Modes "1024x768" "800x600" "640x480"

    EndSubsection "Display"

    Depth 24

    Modes "1024x768" "800x600" "640x480"

    EndSection


    Section "ServerLayout"

    ServerLayout 绑定一个 Screen 节和一个多个 Input 节以形成完整的配置。激活的 ServerLayout 节在 ServerLayers
    中指定。如果没有，则激活第一个 ServerLayout 节。如果存在 ServerLayout 节，将根据相关节选择单个屏幕和两个激活（核心）输入设备。

    Identifier

    为此 ServerLayout 节指定唯一名称。


    Screen screen-name "screen-id"

    field-id 是强制性的，并引用的引用的 Screen 节。


    InputDevice "devaid" option...

    通常至少需要两个，一个一个核心指针，另一个用于主键盘设备。


    示例：

    Section "ServerLayout"

    Identifier "Default Layout"

    Screen "My Screen"

    InputDevice "Generic Keyboard"

    InputDevice "PS/2 Mouse"

    EndSection


    '
