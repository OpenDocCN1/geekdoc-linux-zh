- img_proc: true
  md: 'This file is formatted using a configuration file X86Config for setup, or "x86cfg"
    directory.

    X86Config file is composed of a number of sections which may be present in any
    order. Each section follows the


    Option "OffTime" "time"


    Sets the inactivity timeout for the "off" phase of DPMS mode, default 40 minutes.


    EXAMPLE


    Section "InputDevice"


    Identifier "Generic Keyboard"

    Driver Keyboard

    Option "AutoRepeat" "500 30"

    Option "CoreKeyboard"

    EndSection


    # Section "SectionName"


    # SectionEntry


    The graphs are described in the Device sections, and the mouse is described in
    the Mouse sections. They are reported by the Server section. Keyboard and Mouse
    are described in InputDevice sections, both Keyboard and Pointer are also registered.
    ServerLayout section is at the highest level that handles the InputDevice and
    Device section


    Option "DefaultServerLayout" "layout-id"


    Sets the default ServerLayout used to serve. Default is the ServerLayout section.


    # Section "ServerFlags"


    Option "BlankTime" "99999"

    Option "StandbyTime" "99999"

    Option "SuspendedTime" "99999"

    Option "OffTime" "99999"

    EndSection


    Section "InputDevice"


    Identifier "PS2 Mouse"

    Driver mouse

    Option "CorePointer"

    Option "Device" "dev/mouse"

    Option "Protocol" "PS2"

    Option "EmulateButtons" "true"

    EndSection


    # Module Section


    Load "modmodule"


    Load a module. The module name should be the module''s name, not the module file.


    EXAMPLE


    Section "Module" "extmod"

    Load "type1"

    EndSection


    # File Section


    Option "Path" "path"


    Font elements may be either absolute directory paths, or a font server identifier


    Option "GBPath" "path"


    Sets the path for the RGB color device.


    ModulePath "path"


    Used to set up multiple directories for storing loaded modules by the X86conf
    server.


    EXAMPLE


    Section "Files"

    RgbPath "/usr/X11r/X11/rgb"

    FontPath "/etc/type1"

    EndSection


    # ServerLayout Section


    Option "DontZoom" "boolean"


    Disable Ctrl+Alt+Keypad to terminate the X server.


    Option "DontZoom" "boolean"


    Disabled "Ctrl+Alt+Keypad" and "Ctrl+Alt-Keypad" to switch video mode.


    Option "BlankTime" "time"


    Sets the inactivity timeout for the blanking phase of the screensaver in minutes.
    Default 10.


    Option "StandbyTime" "time"


    Sets the inactivity timeout for the "standby" phase of DPMS mode in minutes. Default
    20.


    Option "SuspendedTime" "time"


    Sets the inactivity timeout for the "suspend" phase of DPMS mode, default 30 min.


    # InputDevice Section


    There are at least two InputDevice sections, for Keyboard and for Mouse.


    Identifier


    Specify an unique name for this input device.


    Driver r


    Specify the name of the driver to use for this input device.


    Option "CorePointer"


    Option "CoreKeyboard"

    This input device is the primary driver.


    # Device Section


    Specifications about the video card used by the system. You must have at least
    one Device section in your configuration file. The devices are used in ServerLayout-section.


    Identifier


    Specify an unique name for this graphics card.


    Driver


    Specify the name of the driver to use for this graphics card.


    EXAMPLE


    Section "Device"

    Identifier "ATI MACH64"

    VendorName "ATI MACH64"

    VideoRam 2048

    EndSection


    # Monitor Section


    Monitor section describes a monitor. There must be at least one monitor and the
    active one is used in ServerLayout-section.


    Identifier


    Specify an unique name for this monitor.


    HorizSync "horizync-sync"


    Sets the range(s) of horizontal sync frequencies of this monitor in kHz.


    VertRefresh "vert-refresh"


    Sets the range(s) of vertical sync frequencies of this monitor in kHz.


    EXAMPLE


    Section "Monitor"

    Identifier "Generic Monitor"

    VendorName "Monitor Vendor"

    ModelName "Monitor Modf"

    HorizSync "31.5-56.6"

    VertRefresh 40-70

    EndSection'
  merge: -1
  pgno: 3
- img_proc: true
  md: '# Screen Section


    Screen Section binds Device and Monitor sections. There must be at least one Screen
    Section. The active one is in ServerLayout section.


    # Identifier


    Specify an unique name for this Section.


    # Device - "device-id"


    This identifies the identifier of Device to be used for this screen.


    # Monitor - "monitor-id"


    This identifies the identifier of Monitor to be used for this section.


    # Default - "depth"


    Default color depth, 8, 16 or 24.


    # Option - "acc"


    Each XAA (X Acceleration Affinity), default is ON.


    # DISPLAY SUBSECTION


    Each Section must have at least one Display Section which matches the values in
    DefaultDepth.


    # Depth - depth


    This entry specifies what color depth of this Display Section.


    # Virtual - ydim


    Specifies the virtual resolution to be used.


    # Viewport - x0 y0


    Sets the upper left corner of the initial display.


    # Mode - "mode-name..."


    Specifies the list of video modes to use. Each mode-name specified must be in
    double quotes. They must correspond to those specified in the appropriate Monitor
    section (including implicitly referred but- ESA standards modes), can be switched
    with Ctrl+Alt+KeypadPlus or Ctrl+Alt+KeypadMinus.


    # EXAMPLE


    Section "My Screen"

    Device "ATI Mach64"

    Monitor "Generic Monitor"

    DefaultDepth 16

    Subsection "Display"

    Depth 16

    Modes "1024x768" "800x600" "640x480"

    EndSubsection "Display"

    Depth 24

    EndSubsection

    Modes "1024x768" "800x600" "640x480"

    EndSection


    # ServerLayout


    ServerLayout binds a Screen section and one or more InputSection to form a complete
    configuration. The active ServerLayout section is specified in ServerLayers. If
    not, the first ServerLayout section is active. If ServerLayout sections are present,
    the single screen and two active (core) input devices are selected as described
    in the relevant sections.


    # Identifier


    An unique name for this ServerLayout Section.


    # Screen screen-name "screen-id" section-information


    The field-id is mandatory, and the Screen section being referred referenced.


    # InputDevice "devaid" option...


    Normally at least two are required, for one core pointer and the other for

    t primary keyboard devices.


    # EXAMPLE


    Section "ServerLayout"

    Identifier "Default Layout"

    Screen "My Screen"

    InputDevice "Generic Keyboard"

    InputDevice "PS/2 Mouse"

    EndSection'
  merge: -1
  pgno: 4
