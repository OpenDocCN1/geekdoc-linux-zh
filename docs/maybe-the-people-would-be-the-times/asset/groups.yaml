    # Maybe the People Would Be the Times


    schematic the scene for Superflex''s Tensprint presentation and de-TV in the Virtual
    spaces, networks: how our could differentiate new, independent systems from the
    media we already have? This Copenhagen stood crystallised extant hopes and for
    Superflex, having pared the room of outbusters with Superflex Christian Grunka
    and the anthem with Liverpoolian, Bjornernes power of operating their own community
    broadband network empowered a group of Liverpool council tenants and for one moment,
    it seemed to be true, if one anecdote of tenants going along and secretly filming
    the meetings of the estate development board This version of media as social cohesion
    also exposed how really incommensurable, in some ways, such a notion with Simon
    Shelley''s depiction of the media of AS-TV as a festation of a terrestrial channel,
    experimental and de-centralised, with Superflex as an intervention, and TV-TVs
    as an intervention into which seemed to short-circuit as quickly as it made, as
    the premise for Tensprint and TV-TV that television created reality, although
    the hiatus between optimism and critique made up the difference in.


    Another observable variation in the enables was the project-centered presentations
    such as those described so far, and in which participants induced to deliver a
    cinescope of their involvement with independent media if too long and transversal
    was to collapse into a single project. The talks were given by Pit Schütz (Schbeit,
    de-reboot, fn.me), Saul Albert (University of Denmark, Node,NODE,WSIFT et al.),
    Sega Gueras (de-central) (Center for Advanced Media, Prague, convex, Crash Media,
    media in Eastern Europe and Southeast Asia) flowed into this, with Sega editing
    the meta metadata and filling her talk with a computer-aided diagram that she
    drew as the space, visualising time, space and connections between people and
    groups and filling in the white spaces with gossip and snippets of her dj sets.
    Gueras'' ev of the impossibility of representation in the modality of her work
    was a tall reference back to Steyer''s text and also gave a performative spin
    to the staging of the ‘conference event’, and the staging of critical media within
    it, both as a means of preservation of the ‘community’. If there is a community,
    it comes about perhaps in the evasion of the ‘event’, and in the ‘being-together’
    by promise that it comes. This coming could mark a fortification and possibly
    erode the complacency embedded in ‘strengthening networks’ as a premise for assembling.
    Cast practitioners, as well as those finding themselves in the audience, back
    to first premieres in their enthusiasm and propositions. From the banality of
    alienation, a constitutive non-relation rooted in that very banality may yet stir
    forth. In gesturing to this constitutive outside the conference event of relations,
    non-relations and context that willy-nilly be submitted to some degree of arbitrary
    fitting and obligation to make it into the conference event, Gueras was engaging
    and quixotic, rounding off the two days of tomorrow.


    From Tomorrow On: http://www.cornerhouse.org/exhibitedinfo.asp?ID=757


    ''The Alienation of Protest’ http://www.replicart.net/disc/mundial/steryel02_en.htm

