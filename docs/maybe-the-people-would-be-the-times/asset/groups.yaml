    # 静音


    文章


    # 也许人们就是时代


    作者：Marina Vismidt，2006年1月5日


    从明天及以后（From Tomorrow On and Beyond）


    在曼彻斯特举办的“从明天及以后：艺术、行动主义、技术与独立媒体的未来”活动中，汇聚了一群行径迥异的实践者，揭示了关于目标和方法的几种重要见解。Marina
    Vismidt 报道了那个在那里转瞬即逝聚集的“社区”。


    当英国其他地区仍在扭转未来的推车时，曼彻斯特一直忙碌着。从深色缎面厂房的温床，到后工业文化的熔炉，再到作为定位媒体孵化器 Futurcience 的举办地，曼彻斯特拥有漫长的历史，在仁慈的红砖建筑中原型化了这种一种最忧郁、最严酷、最无政府主义、最进步且最正直的未来形式。这是对该国其他地区资本上升阶段的独家预演。曼彻斯特作为未来之地的项目，其特点是当今阴暗的城市废墟，以及以文化为导向的再生——这种再生是无味的、昂贵的，渗透到英国的每一个大都市。除了那些理所不满的关注者之外，曼彻斯特在过去几年里做得很多。与
    2008 年欧洲文化之都（利物浦）所面临的遗弃与私有化之间的阴郁相比，曼彻斯特在吸引游客方面要好得多。


    “从明天及以后：艺术、行动主义、技术与独立媒体的未来”于 10 月 28 日至 29 日在曼彻斯特 Cornerhouse 举行，为期两天的小组小组演示和讨论横跨了另类媒体制作。该活动吸引了大量的活动主义者和实践者，从
    Indymedia 到 Teletree，从哥本哈根的公共接入电视 TV-TV 到哥本哈根的开放艺术机器 Surface，从行动主义制作者 Young，到社会政治实践者
    Emma Hiddell，涵盖了试图从不可调和的差异和愿景式的美学多元化中唤起模糊或潜在政治性的所有要点。根据一个委员会——MIRAD（曼彻斯特艺术与设计研究与创新学院），都会大学艺术与民主研究小组——这一座谈的主要建筑师是
    Cornerhouse 的视觉艺术教育官员 Young，以及上述研究小组的成员、策展人和作家 Bradley Member。


    在周五晚上的《战斗》（The Battle of）之后，这可能是对独立媒体中干预性媒体性质的反思性评论，文本讨论了媒体技术和传播形式如何寻求移动性，以及“独立”在经济、制度和语义语层中不断变化的内涵。这还意图至少与一位德国理论家以及参加“从明天及以后”活动的
    Sterling 讨论过“抗议的表述”（The Articulation of Protest），他针对 Indymedia 在西雅图的 Showdown
    这种代表性策略，用 Gary Mitchell 1970 年代期的 Ici et Ailleurs 进行了反驳，声称后期项目是一个更复杂、更卷其中的抵抗子集，即积极抵抗正在部署媒体格式化意义生成技术的抵抗。


    第二次编辑运行在两种观点之间：将独立媒体视为一种由艺术引导的技术，用于在“贫困”社区中产生社会凝聚力；另一种观点则认为它导致了特定的社会主体离开，引发了独立媒体作为通过改良来实现缓解和变革的悠久传统。这种对比呈现了商品的生产与主体性的生产（这无可挽回地
    https://www.metamedia.org/editorial/articles/maybe-people-be-the-times


    为 Superflex 的 Tensprint 演示和虚拟空间、网络中的去电视化铺设了场景：我们如何将新的、独立的系统与我们已有的媒体区分开来？哥本哈根这结化了现有的希望，对于
    Superflex 来说，在排除了房间里的干扰者后，Superflex 的 Christian Grunka 与利物浦的 Bjornernes 通过运营自己的社区宽带网络赋能了一群利物浦议会租户，在某一刻，这似乎是真实的，如果有一个租户随同并秘密拍摄地产开发委员会会议的轶事。这种作为社会凝聚力的媒体版本也暴露了，在某些方面，这种观念与
    Simon Shelley 对 AS-TV 媒体的描述是多么不可调和——将其描述为一种地面频道的、实验性和去中心化的节日，其中 Superflex 是一种干预，而
    TV-TVs 是一种干预，这种干预似乎产生得快消失得也快，作为 Tensprint 和 TV-TV 的前提是电视创造了现实，尽管乐观与批判之间的间隙构成了差异。


    活动中另一个可观察的差异是以项目为中心的演示，如此前描述的那样，在这些演示中，参与者被引导交付他们参与独立媒体的电影视角，如果时间太长且跨度太大就会坍塌为一个单一项目。演讲由
    Pit Schütz (Schbeit, de-reboot, fn.me)、Saul Albert (丹麦大学, Node, NODE, WSIFT 等)
    以及Sega Gueras (de-central) (布拉格高级媒体中心, convex, Crash Media，东欧和东南亚的媒体) 进行，其中 Sega
    编辑了元数据（meta metadata），并用她绘制的计算机辅助图表填充了演讲，该图作为空间，可视化了时间、空间以及人与群体之间的连接，并在空白处填满了八卦和她
    DJ  Set 的片段。Gueras 对其工作模式中表征之不可能性的阐述是对 Steyer 文本的高度呼应，也为“会议活动”的策划以及其中批判媒体的策划赋予了表演色彩，两者都是作为保护“社区”的手段。如果存在一个社区，它可能源于对“事件”的逃避，以及通过对到来的承诺实现的“共处”。这种到来可能标志着一种加固，并可能侵蚀嵌入在“加强网络”这一集会前提中的安逸感。艺术家们，以及那些发现自己处于观众席的人，回到了他们最初的热情和提议。从异化的平庸中，一种根植于这种平庸本身的建构性非关系可能仍萌发。通过指向会议事件之外的关系、非关系和背景（这些关系将不不由自主地服从某种程度的任意拟合和义务，使其进入会议事件），Gueras
    的参与是投入且狂想的，为这两天的“明天”画上了句号。


    从 Tomorrow On: http://www.cornerhouse.org/exhibitedinfo.asp?ID=757


    “抗议的异化’（The Alienation of Protest） http://www.replicart.net/disc/mundial/steryel02_en.htm


    '
