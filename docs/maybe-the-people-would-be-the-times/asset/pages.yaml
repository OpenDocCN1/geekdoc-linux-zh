    ARTICLES


    # MAYBE THE PEOPLE BE THE TWILOW


    By Marina Vismidt, 5 January 2006


    From Tomorrow On and Beyond


    An eclectic gathering of practitioners at Manchester''s From Tomorrow: on art,
    activism, technology and the future of independent media to reveal several important
    faualities over purpose and approach. Marina Vismidt reports on the ''community''
    that was fleetingly assembled there.


    Manchester has been busy since the rest of Britain was twisting the barrow of
    the future. From hotbed of dark satin mills, to crucible of post-industrial culture,
    and latter as host of locative media Incubator Futurcience, Manchester has a long
    history of prototyping the forms of a future most disconsolate and severe, most
    anarchist, most progressive and upstanding in benevolent red brick. An exclusive
    preview of the ascending phases of capital for the rest of the country. Manchester''s
    projects as place of tomorrow are marked by today''s gloomy, urban dereliction
    and culture-led regeneration that is odorless, costly penetrating every metropolitan
    area in the UK. Aside from that rightly dissatisfied concerned, Manchester has
    done quite a lot for a couple of years. Compared to the gloom between abandonment
    and privatisation faced by the European Capital of Culture 2008 (Liverpool), Manchester
    is far better at converging to its tourists.


    From Tomorrow On: art, activism, technology and the future of independent media
    ran at Manchester''s Cornerhouse-28 29 October - two days of panel presentations
    and discussions that traversed alter-media production. The event caught in a wide
    spate of activists and practitioners, from Indymedia to Teletree, from Copenhagen
    public access TVTV to Copenhagen open art machine Surface, from activist makers
    Young to socio-political practice Emma Hiddell and all points in the attempt to
    evoke an unclear or potential politics from irreconcilable differences and visionary
    plural of aesthetics. According to a committee - the MIRAD (Manchester Institute
    for Research and Innovation in Art and Design), Metropolitan University''s Research
    Group for Art and Democracy - the chief architects of the colloquium were Young,
    the Cornerhouse''s Visual Arts Education Officer, and Bradley Member, of the aforementioned
    research group, curator and writer.


