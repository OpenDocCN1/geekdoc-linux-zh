    python3 for Python scripts, making it versatile for various programming languages.


    60


    # Executing Scripts in the Current Shell


    * * *


    Using source or . allows you to execute a script within the current shell session,
    preserving any changes to environment variables.


    * * *


    The following code illustrates how to use source to run a script that modifies
    an environment variable.


    [Code]


    # save this as set_var.sh


    MY_VAR="Hello from the script!"


    export MY_VAR


    # Now, in the terminal, run:


    source set_var.sh


    echo $MY_VAR


    [Result]


    Hello from the script!


    When you run a script using source set_var.sh, the commands within that script
    are executed in the current shell context. This means that any variables or functions
    defined in the script remain available after the script finishes executing.


    In contrast, if you run the script as ./set_var.sh, it would execute in a subshell,
    and any changes to variables would not affect the parent shell.


    To summarize, using source or . is essential when you want to make changes to
    the current shell environment, such as defining variables or functions that you
    want to use later.


    [Trivia]


    The source command is a built-in feature in Bash and other shells, allowing for
    more flexible script execution. It is particularly useful for loading configuration
    files or scripts that set up your environment, such as .bashrc or .bash_profile,
    which are executed every time a new shell session is started.


    61


    # Creating Shortcuts with the Alias Command


    * * *


    The alias command in Linux allows users to create shortcuts for longer commands,
    making it easier and quicker to execute frequently used commands.


    * * *


    Below is an example of how to create an alias for a commonly used command.


    [Code]


    alias ll=''ls -la''


    [Result]


