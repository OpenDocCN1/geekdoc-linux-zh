    and all installed packages.


    72


    # Installing Packages with the Snap Command


    * * *


    The snap command is a package management system that installs applications in
    a sandboxed environment, ensuring that they run in isolation from the rest of
    the system.


    * * *


    The following code shows how to install the vlc media player using the snap command.
    This command will download and install the application while keeping it isolated
    from other applications.


    [Code]


    sudo snap install vlc


    [Result]


    vlc 3.0.11.1 from VideoLAN✓ installed


    In this example, sudo is again used to grant the necessary permissions for installation.
    The snap install command fetches the vlc package from the Snap Store, which is
    a repository for snap packages. Once the installation is complete, you will see
    a confirmation message indicating that vlc has been successfully installed.


    [Trivia]


    Snap packages are designed to be self-contained, which means they include all
    the dependencies they need to run.


    The Snap Store hosts a wide variety of applications, making it easy to find and
    install software.


    To list installed snaps, you can use the command snap list, and to remove a snap,
    you would use snap remove <package-name>.


    73


    # Using apt-cache search to Find Packages


    * * *


    The apt-cache search command in Linux allows users to search for packages in the
    package repository based on keywords.


    * * *


    This command is useful when you want to find software packages that match specific
    criteria without needing to know the exact package name.


    [Code]


    apt-cache search apache


    [Result]


    apache2 - Apache HTTP Server


    apache2-doc - Apache HTTP Server Documentation


    libapache2-mod-php - Server-side, HTML-embedded scripting language (Apache 2 module)


    ...


    The apt-cache search command queries the package database to return a list of
    packages that contain the specified keyword in their name or description. It''s
    particularly useful for exploring available software options when you don''t know
    the exact name of the package you need. The command outputs a list where each
    line represents a package with the package name followed by a brief description.This
    command doesn''t require root privileges because it only reads the package database.
    It doesn''t install, remove, or modify any packages. The search results may be
    extensive, so you can refine your search by using more specific keywords.The apt-cache
    command is a part of the APT (Advanced Package Tool) suite used primarily in Debian-based
    systems like Ubuntu. It interacts with the APT package database to perform various
    tasks, such as searching, displaying package information, and more. While apt-cache
    search is a basic operation, it''s an essential tool for managing software on
    Linux systems.


    [Trivia]


    The APT suite, including apt-cache, originated from the need to simplify package
    management on Debian-based systems. Before APT, package management involved manually
    resolving dependencies, a process that was both time-consuming and prone to errors.
    APT automates this process, ensuring that all dependencies are installed automatically,
    making it a crucial tool for Debian-based distributions.


    74


    # Managing Debian Packages with dpkg


    * * *


    The dpkg command is used to install, remove, and manage individual Debian packages
    directly on a system.


    * * *


    This command provides more granular control over Debian package management, allowing
    for detailed operations like installation, removal, and inspection of packages.


    [Code]


    sudo dpkg -i example_package.deb


    [Result]


    (Reading database ... 275438 files and directories currently installed.)


    Preparing to unpack example_package.deb ...


    Unpacking example_package (1.0-1) ...


    Setting up example_package (1.0-1) ...


    The dpkg command is a low-level package manager for Debian-based systems, handling
    .deb files. When you use dpkg -i, it installs the specified package, assuming
    the package file is present on your system. The installation process includes
    several steps:Reading the package database to prepare for installation.Unpacking
    the package file, which involves extracting its contents.Setting up the package,
    which includes configuring files and making the software ready to use.Unlike APT,
    dpkg doesn''t handle dependencies automatically. If the package you''re installing
    requires other packages (dependencies), you''ll need to install those manually.
    This makes dpkg powerful but potentially complex if dependencies aren''t managed
    correctly. For this reason, APT is often preferred for most package management
    tasks, as it automatically resolves and installs dependencies.To remove a package,
    you can use sudo dpkg -r package_name, which will uninstall the specified package.
    To check the status of installed packages, dpkg -l can be used, and for detailed
    information about a specific package, dpkg -s package_name is useful.


    [Trivia]


    The Debian package management system, with dpkg at its core, is one of the oldest
    package management systems in Linux, predating even the APT system. It was designed
    to manage the complex interdependencies of software packages in a consistent and
    reliable way, which has contributed to Debian''s reputation for stability and
    robustness in server environments.


    75


    # Managing Red Hat Packages with RPM Command


    * * *


    The rpm command is a powerful tool used in Red Hat-based Linux distributions for
    managing software packages. It allows users to install, uninstall, query, and
    verify packages.


    * * *


    The following example demonstrates how to install a package using the rpm command.


    [Code]


    sudo rpm -ivh package-name.rpm


    [Result]


    Preparing...                          ################################# [100%]


    Updating / installing...


       1:package-name                    ################################# [100%]


    The rpm command has several options:


    -i: This option is used to install a new package.


    -v: Enables verbose mode, providing more detailed output during the installation.


    -h: Displays a hash mark (#) progress bar during the installation process.


    When you run the command, it requires superuser privileges, which is why sudo
    is used. The command will check for dependencies and install the specified package.
    If the package is already installed, it will not reinstall unless you use the
    --replacepkgs option.'
