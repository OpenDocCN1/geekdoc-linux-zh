    # Secure File Transfer with scp


    * * *


    The scp (Secure Copy Protocol) command allows users to securely transfer files
    between hosts over a network. It uses SSH (Secure Shell) for data transfer, ensuring
    that the data is encrypted.


    * * *


    The following code shows how to use scp to copy a file from a local machine to
    a remote server.


    [Code]


    # Copying a file to a remote server


    scp localfile.txt username@remotehost:/path/to/destination/


    # Copying a file from a remote server to the local machine


    scp username@remotehost:/path/to/source/remotefile.txt .


    [Result]


    After running scp localfile.txt username@remotehost:/path/to/destination/, the
    file localfile.txt will be copied to the specified destination on the remote server.


    After running scp username@remotehost:/path/to/source/remotefile.txt ., the file
    remotefile.txt will be copied to the current directory on the local machine.


    The scp command is a straightforward way to transfer files securely. The syntax
    is as follows: scp [options] [source] [destination]. The source can be a local
    file or a remote file specified in the format username@hostname:/path/to/file.
    The destination can similarly be a local path or a remote path.


    When transferring files, scp will prompt you for the password of the remote user
    account unless you have set up SSH keys for passwordless authentication. This
    makes it a secure choice for transferring sensitive files.


    [Trivia]


    The -r option allows you to copy directories recursively: scp -r localdir username@remotehost:/path/to/destination/.


    You can use the -P option (note the uppercase) to specify a port if the SSH server
    is running on a non-standard port: scp -P 2222 localfile.txt username@remotehost:/path/to/destination/.


    To increase the verbosity of the command, you can add the -v option, which will
    provide detailed output of the transfer process.


