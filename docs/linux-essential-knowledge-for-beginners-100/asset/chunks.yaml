    Below is an example of what an entry in the /etc/passwd file looks like and how
    to interpret its fields.


    [Code]


    # Example entry in the /etc/passwd file


    cat /etc/passwd | grep ''newuser''


    # Sample output


    newuser:x:1001:1001::/home/newuser:/bin/


