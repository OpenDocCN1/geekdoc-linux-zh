    Passwords should be strong and secure, typically consisting of a mix of letters,
    numbers, and special characters.


    Users can also change their own passwords without superuser privileges by simply
    typing passwd and following the prompts.


    The passwd command can also enforce password expiration and complexity requirements
    through configuration files like /etc/login.defs.


