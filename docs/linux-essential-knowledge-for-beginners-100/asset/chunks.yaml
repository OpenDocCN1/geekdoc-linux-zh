    # 使用 mount 将文件系统挂载到目录


    Linux 中的 `mount` 命令将文件系统附加到特定的目录（挂载点），允许从该目录访问存储在文件系统中的数据。


    使用 `mount` 命令，你需要指定文件系统以及它应该挂载的目录。以下是将文件系统 `/dev/sdb1` 挂载到 `/mnt/data` 目录的示例。


    ```bash

    sudo mount /dev/sdb1 /mnt/data

    ```


    ## 结果


    如果成功，将没有输出，并且文件系统将完成挂载。


    挂载文件系统是 Linux 中的一项关键任务，因为它将文件系统集成到操作系统的目录结构中。挂载点（在本例中为 `/mnt/data`）成为挂载文件系统的根目录。一旦挂载，文件系统中的所有文件都可以通过挂载点进行访问。你可以使用不带参数的
    `mount` 命令或通过检查 `/proc/mounts` 文件来检查当前挂载了哪些文件系统。


