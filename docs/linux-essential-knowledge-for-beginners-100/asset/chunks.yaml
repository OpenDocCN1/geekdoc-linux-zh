- fmt: '

    The `swapon --show` command displays detailed information about active swap spaces,
    including their name, type (file or partition), size, and how much of the swap
    is currently used.


    ### Swap File vs Swap Partition

    A swap partition is a dedicated part of the disk, while a swap file is a regular
    file within a filesystem that is used for the same purpose. Both serve the same
    function but have different setup processes.


    ### Priority

    The priority column indicates the order in which swap spaces are used if there
    are multiple swap spaces configured. Higher numbers have higher priority.


    While swap space can help prevent memory exhaustion, it is much slower than physical
    RAM because it relies on disk I/O. Thus, it is primarily used as a backup when
    RAM is insufficient, not as a primary memory resource. Overuse of swap (swapping)
    can lead to performance degradation, known as "swap thrashing."


    #### Trivia

    Swapping occurs when the system starts moving data from RAM to swap space, which
    is typically slower. If your system is heavily using swap, you might need to add
    more RAM. In modern Linux systems, swap files are often preferred over partitions
    due to their flexibility in resizing and managing without needing to repartition
    the disk.


    # 101

    # Enabling and Disabling Swap Space with swapon and swapoff


    The `swapon` and `swapoff` commands in Linux are used to enable and disable swap
    space, respectively. Swap space is an area on a hard disk that is used as the
    virtual memory extension of a computer''s RAM. This allows the system to handle
    more processes than it could with RAM alone.


    The following code demonstrates how to enable and disable swap space using these
    commands. Ensure you have root privileges to execute these commands.


    ```bash

    # Check current swap space status

    swapon --show


    # Enable a swap file (assuming /swapfile is already created)

    sudo swapon /swapfile


    # Verify that the swap file is active

    swapon --show


    # Disable the swap file

    sudo swapoff /swapfile


    # Verify that the swap file is inactive

    swapon --show

    ```


    #### Result

    ```text

    NAME      TYPE      SIZE  USED PRIO

    /swapfile file      2G      0   -2

    ```

    (After enabling swap)

    ```text

    NAME      TYPE      SIZE  USED PRIO

    /swapfile file      2G      1G   -2

    ```

    (After disabling swap, the output will show no swap space)


    The `swapon --show` command displays the current swap space in use. When you run
    `sudo swapon /swapfile`, it activates the specified swap file, allowing the system
    to use it for virtual memory. The `swapoff` command deactivates the swap file,
    making it unavailable for use. It is crucial to manage swap space effectively,
    especially on systems with limited RAM, to ensure optimal performance.


    #### Trivia

    - Swap space can be a file or a dedicated partition on the disk.

    - It is advisable to have swap space equal to or double the amount of RAM for
    systems with low memory.

    - Excessive reliance on swap can lead to performance degradation, known as "thrashing,"
    where the system spends more time swapping than executing processes.


    # 102

    # Modifying Kernel Parameters at Runtime with sysctl


    The `sysctl` command is used in Linux to modify kernel parameters at runtime.
    This allows users to adjust system settings without needing to reboot, providing
    flexibility in managing system performance and behavior.


    The following code illustrates how to view and change kernel parameters using
    `sysctl`. You will need root privileges for some operations.


    ```bash

    # View all current kernel parameters

    sysctl -a


    # Change a kernel parameter, e.g., enabling IP forwarding

    sudo sysctl -w net.ipv4.ip_forward=1


    # Verify the change

    sysctl net.ipv4.ip_forward

    ```


    #### Result

    ```text

    net.ipv4.ip_forward = 1

    ```


    Using `sysctl -a` lists all kernel parameters along with their current values.
    The command `sudo sysctl -w net.ipv4.ip_forward=1` sets the IP forwarding parameter
    to 1, enabling the system to forward IP packets. This is particularly useful for
    routers and network configurations. The change is immediate and can be verified
    by checking the parameter again.


    #### Trivia

    - Kernel parameters can be persistent across reboots by adding them to `/etc/sysctl.conf`.

    - Common parameters to modify include those related to networking, memory management,
    and process scheduling.

    - Modifying kernel parameters can significantly impact system performance and
    stability, so changes should be made with caution and understanding of their effects.


    # Afterword


    As we reach the end of this journey together, I want to take a moment to express
    my heartfelt gratitude to you, the reader.


    Your commitment to expanding your knowledge in Linux operations is commendable,
    and I hope this book has provided you with the essential insights you were seeking.


    This guide is specifically designed for those who already possess a foundational
    understanding of programming concepts.


    It focuses solely on the must-know aspects of Linux for beginners, ensuring that
    you can acquire the necessary skills without feeling overwhelmed.


    Whether you are a newcomer eager to dive into the world of Linux or a seasoned
    professional looking to refresh your knowledge of the latest essential practices,
    I trust you found valuable information within these pages.


    Your feedback is invaluable to me.


    If you have a moment, I would greatly appreciate your thoughts on this book. Even
    if you are pressed for time, a simple star rating would mean the world to me.


    I read every review, and your insights help shape future editions and topics I
    explore.


    Whether you found the content helpful, engaging, or perhaps not quite what you
    expected, I want to hear from you. Did the explanations resonate with you? Was
    there something you wished had been included? Your voice matters, and it drives
    me to continue producing content that is both informative and enjoyable.


    I’m also open to suggestions for future topics. If there’s a particular area of
    Linux you’re curious about or a concept you’d like to see explored further, please
    let me know.


    My goal is to provide information that truly benefits you and the broader community.


    Thank you once again for your time and engagement. I look forward to the possibility
    of connecting with you in future works. Your support means everything, and I hope
    to continue this journey of learning together.

