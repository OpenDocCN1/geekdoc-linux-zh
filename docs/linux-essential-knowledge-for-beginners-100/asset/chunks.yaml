    # The ip Command for Managing Network Interfaces, Routes, and IP Addresses


    * * *


    The ip command is the modern tool used in Linux to manage network interfaces,
    configure IP addresses, and handle routing. It provides a more powerful and flexible
    alternative to the deprecated ifconfig command.


    * * *


    Below is an example of using the ip command to assign an IP address to a network
    interface.


    [Code]


    sudo ip addr add 192.168.1.10/24 dev eth0


    sudo ip link set eth0 up


    [Result]


    This command does not typically produce output if successful, but the following
    command can be used to verify the configuration:ip addr show eth0


    Expected output:2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc pfifo_fast
    state UP group default qlen 1000


        link/ether 08:00:27:4e:66:a5 brd ff:ff:ff:ff:ff:ff


        inet 192.168.1.10/24 brd 192.168.1.255 scope global eth0


           valid_lft forever preferred_lft forever


    inet6 fe80::a00:27ff:fe4e:66a5/64 scope link


           valid_lft forever preferred_lft forever


    The ip command is part of the iproute2 package, which includes a suite of tools
    for managing network configurations in Linux. Unlike ifconfig, which focuses solely
    on basic interface configuration, the ip command allows for a wide range of tasks,
    including managing IP addresses, routes, and even policy-based routing. The syntax
    of the ip command is more consistent and logical, making it easier to script and
    automate network tasks.For example, the ip addr add command is used to add an
    IP address to a specific network interface, while ip link set is used to bring
    the interface up or down. These commands replace multiple functionalities provided
    by ifconfig and other older tools.The ip command also supports modern networking
    features such as network namespaces, which are crucial for containerized environments,
    and it provides more detailed information about the network stack.


    [Trivia]


    The ip command’s versatility and comprehensive feature set make it indispensable
    for modern Linux networking. It not only consolidates the functionality of older
    commands like ifconfig, route, and arp but also introduces new capabilities that
    are essential for complex networking scenarios. Understanding and mastering the
    ip command is crucial for any Linux system administrator or network engineer.


    43


    # Managing Systemd Services with systemctl


    * * *


    The systemctl command is a powerful tool used to manage systemd services in Linux.
    It allows users to start, stop, enable, disable, and check the status of services
    running on the system.


    * * *


    The following code snippet demonstrates how to start and enable a service using
    systemctl.


    [Code]


    # Start the Apache HTTP server


    sudo systemctl start apache2


    # Enable the Apache service to start on boot


    sudo systemctl enable apache2


    [Result]


    No output is displayed for the start command if successful. The enable command
    will also show no output if it completes successfully.


    When you use sudo systemctl start apache2, you are instructing the system to initiate
    the Apache HTTP server. This command requires superuser privileges, which is why
    sudo is used. The enable command ensures that the Apache service will automatically
    start when the system boots up. This is particularly useful for services that
    need to be running continuously, such as web servers.


    Systemd is the initialization system used in many Linux distributions, and it
    manages services through units. Each service has a corresponding unit file that
    defines how the service should behave.


    [Trivia]


    Systemd was designed to replace the older init system, providing more features
    and improved performance.


    Services managed by systemd can be configured to restart automatically if they
    fail, enhancing system reliability.


    You can list all active services with the command systemctl list-units --type=service.


    44


    # Checking Service Status with systemctl status


    * * *


    The systemctl status command is used to check the current status of a service
    managed by systemd. It provides detailed information about the service, including
    whether it is active, inactive, or failed.


    * * *


    The following code snippet shows how to check the status of the Apache service.


    [Code]


    # Check the status of the Apache HTTP server


    sudo systemctl status apache2


    [Result]


    ● apache2.service - The Apache HTTP Server


       Loaded: loaded (/lib/systemd/system/apache2.service; enabled; vendor preset:
    enabled)


       Active: active (running) since Mon 2024-08-18 12:34:56 UTC; 1h 23min ago


    Main PID: 1234 (apache2)


        Tasks: 6 (limit: 2362)


       Memory: 12.3M


       CGroup: /system.slice/apache2.service


               ├─1234 /usr/sbin/apache2 -k start


               ├─1235 /usr/sbin/apache2 -k start


               └─1236 /usr/sbin/apache2 -k start


    When you execute sudo systemctl status apache2, you receive a comprehensive overview
    of the Apache service. The output includes:


    Loaded: Indicates whether the service is loaded and its configuration file location.


    Active: Shows the current state of the service (e.g., active, inactive, failed).


    Main PID: The process ID of the main service process.'
