    # Using uname to Display System Information


    ***


    The `uname` command in Linux is used to display essential system information.
    It provides details about the operating system, kernel version, and more.


    ***


    The `uname` command is simple to use and can be enhanced with various options
    to display more detailed information about the system.


    [Code]

    ```

    # Basic usage to display the kernel name:

    uname


    # To display all possible system information:

    uname -a


    # To display the kernel version:

    uname -r

    ```


    [Result]

    Running `uname` without any options will display something like `Linux`. The `-a`
    option provides detailed output, such as: `Linux yourhostname 5.11.0-27-generic
    #29-Ubuntu SMP Thu Jul 15 20:38:11 UTC 2021 x86_64 x86_64 x86_64 GNU/Linux`


    This output includes the kernel name, network hostname, kernel release, kernel
    version, machine hardware name, processor type, hardware platform, and operating
    system.


    Understanding the output of `uname -a`: `Linux`: The operating system. `.yourhostname`:
    The network hostname of your machine. `5.11.0-27-generic`: The kernel release
    number. `#29-Ubuntu SMP Thu Jul 15 20:38:11 UTC 2021`: The specific build version
    and time of the kernel. `x86_64`: The architecture of the machine (64-bit in this
    case). `GNU/Linux`: The operating system and kernel type. `uname` is especially
    useful for quickly checking which kernel version is running, which can be crucial
    for troubleshooting and system administration tasks.


    [Trivia]


    The name `uname` stands for "Unix Name." It''s a common utility found in many
    Unix-like operating systems, not just Linux. This command has been around since
    the early days of Unix and is included in the POSIX specification, making it a
    standard tool across various systems.


