    `du` 命令扫描目录及其内容，计算每个文件和目录占用的磁盘空间。输出显示列出的每个目录的大小，文件和子目录的大小汇总在父目录下。`du` 是 "disk
    usage"（磁盘使用）的缩写。默认情况下，`du` 以字节（K）为单位显示目录及其子目录的磁盘使用情况。`-h` 选项将大小转换为易读的格式（例如，K 代表千字节，M
    代表兆字节，G 代表吉字节），使其更容易理解。你也可以使用 `du -sh /path/to/directory` 来仅显示目录的总大小。


    ### 冷知识

    `du` 命令不显示空闲磁盘空间；要显示该信息您需要使用 `df` 命令。该命令还可以与 `sort` 等命令组合，按大小列出目录：`du -h /path/to/directory
    | sort -h`。


    # 使用 tar 命令归档文件


    Linux 中的 `tar` 命令用于创建、维护、修改和从归档中提取文件。它是备份数据或将文件打包的最常用工具之一。


    以下是一个使用 `tar` 命令从目录创建归档的示例。`-cvf` 选项分别代表“create”（创建）、“verbose”（详细）和“file”（文件）。


    ```

    tar -cvf archive_name.tar /path/to/directory

    ```


    **结果**

    /path/to/directory/

    /path/to/directory/file1

    /path/to/directory/file2


    输出列出了所有正在添加到归档的文件。


    `tar` 命令是处理归档的强大工具：`tar` 原代表 "tape archive"（磁带存档），反映了它最初对磁带驱动器的使用。`-cvf` 标志位：

    - `c`: 创建一个新的归档。

    - `v`: 详细模式，显示文件被添加到归档时的进度。

    - `f`: 指定归档的文件名。


    要从归档中提取文件，使用 `tar -xvf archive_name.tar`，其中 `x` 代表 extract（提取）。`tar` 命令通常与 `gzip`
    或 `bzip2` 等压缩工具结合使用以减小归档尺寸（例如，`tar -cvzf archive_name.tar.gz /path/to/directory`）。


    ### 冷知识

    `tar` 命令还能够通过 `SSH` 与远程文件协作，允许用户在远程系统上创建或提取归档，而无需传输整个归档。`tar` 是非破坏性操作；它在创建归档时不会删除原始文件。


    # 理解用于文件压缩的 gzip 和 gunzip


    `gzip` 和 `gunzip` 命令是 Linux 中用于压缩和解压文件的基本工具。它们有助于节省磁盘空间并加快文件传输。


    以下代码演示了如何使用 `gzip` 压缩文件，然后使用 `gunzip` 对其解压。


    ```bash

    # 压缩文件

    gzip example.txt


    # 解压文件

    gunzip example.txt.gz

    ```


    **结果**

    运行 `gzip example.txt` 后，输出将生成一个名为 `example.txt.gz` 的压缩文件。

    运行 `gunzip example.txt.gz` 后，原始文件 `example.txt` 将恢复，且 `example.txt.gz` 将被删除。


    `gzip` (GNU zip) 是一种广泛的文件压缩程序，它使用 DEFLATE 算法减小文件大小。当你运行 `gzip example.txt` 时，它会压缩文件并将其替换为带有
    `.gz` 扩展的新文件。这对于大型文本文件或日志文件特别有用，压缩可以显著减少存储需求。


    相反，`gunzip` 用于解压使用 `gzip` 压缩的文件。当你运行 `gunzip example.txt.gz` 时，它会恢复原始文件并移除压缩版本。需要注意的是，`gzip`
    是一种无损压缩方法，这意味着可以从压缩数据中完美地重建原始数据。


    ### 冷知识

    `gzip` 命令也可以同时压缩多个文件。例如，`gzip file1.txt file2.txt` 将创建 `file1.txt.gz` 和 `file2.txt.gz`。


    你可以使用 `gzip` 的 `-k` 选项在压缩后保留原始文件：`gzip -k example.txt`。

    `gunzip` 的 `-d` 选项可以作为直接运行 `gunzip` 的替代方案：`gunzip -d example.txt.gz`。


    # 使用 scp 进行安全文件传输


    `scp`（安全复制协议）命令允许用户通过网络在主机之间安全地传输文件。它使用 `SSH`（安全外壳）进行数据传输，确保数据经过加密。


    以下代码显示了如何使用 `scp` 将文件从本地机器拷贝到远程服务器。


    ```bash

    # 将文件拷贝到远程服务器

    scp localfile.txt username@remotehost:/path/to/destination/


    # 将文件从远程服务器拷贝到本地机器

    scp username@remotehost:/path/to/source/remotefile.txt .

    ```


    **结果**

    运行 `scp localfile.txt username@remotehost:/path/to/destination/` 后，文件 `localfile.txt`
    将拷贝到远程指定的指定的路径。

    运行 `scp username@remotehost:/path/to/source/remotefile.txt .` 后，文件 `remotefile.txt`
    将拷贝到本地机器的当前目录。


    `scp` 命令是安全传输文件的简单方法。语法如下：`scp [options] [source] [destination]`。源可以是本地文件，也可以格式为
    `username@hostname:/path/to/file` 的远程文件。目标同样可以是本地路径或远程路径。


    在传输文件时，除非你设置了密钥，否则 `scp` 会提示你输入密码。


    ### 冷知识

    `-r` 选项允许你拷贝目录：`scp -r username@remotehost:/path/to/`。

    你可以使用 `-P` 选项（注意是大写）在服务器运行在非标准端口时指定端口：`scp -P 2222 localfile.txt username@remotehost`。


    # 使用 SSH 命令进行安全 Shell 访问


    `ssh` 命令允许安全访问另一台计算机。它加密连接，确保数据加密。


    以下代码演示了如何使用 `ssh` 命令连接到远程服务器。


    ```bash

    ssh username@remotehost

    ```


    **结果**

    如果连接成功，你将看到类似下面的提示：

    `Last login: Mon Aug 18 12:34:56 2024 from your_ip_address`

    `username@remote_host:~$`


    执行 `ssh` 时，将 `username` 替换为远程机器上的实际用户名，并将 `remotehost` 替换为远程服务器的 IP 地址或主机名。


    身份验证：可能会提示输入密码。或者，你可以设置 `SSH` 密钥以进行无密码验证，这更安全。

    端口：`SSH` 默认使用端口 22。如果服务器使用不同的端口，你可以使用 `-p` 选项指定：`ssh -p 2222 username@remotehost`。


    # 使用 ping 命令检查网络连接性


    `ping` 命令是一种用于测试网络协议 (IP) 网络上主机可达性的网络实用。它有助于诊断网络问题。


    以下代码显示了如何使用 `ping` 命令检查远程服务器是否可达。


    ```

    ping remote_host

    ```


    **结果**

    如果主机可达，你将看到类似下面的输出：

    `PING remote_host (192.168.1.1) 56(84) bytes of data.`

    `64 bytes from remote_host: icmp_seq=1 ttl=64 time=0.123 ms`

    `64 bytes from remote_host: icmp_seq=2 ttl=64 time=0.456 ms`


