    # Displaying User and Group IDs with id Command


    The `id` command in Linux is used to display the user ID (UID) and group ID (GID)
    of the current user, as well as the groups to which the user belongs.


    The following code snippet demonstrates how to use the `id` command to retrieve
    user and group information.


    ```bash

    id

    ```


    [Result]


    `uid=1000(username) gid=1000(username) groups=1000(username),27(sudo),30(dip),46(plugdev)`


    When you run the `id` command, it outputs several pieces of information:


    - `uid=1000(username)`: This indicates that the user ID is `1000` and the username
    is `"username"`.

    - `gid=1000(username)`: This shows that the primary group ID is also `1000`, with
    the group name being `"username"`.

    - `groups=1000(username),27(sudo),30(dip),46(plugdev)`: This lists all the groups
    the user is a member of, including their respective GIDs and names.


    Understanding your user and group IDs is essential for managing permissions and
    access control in Linux. Each user and group is assigned a unique ID, which the
    system uses to determine access rights to files and resources.


    [Trivia]


    The user ID (UID) is a unique identifier for each user in the system, while the
    group ID (GID) identifies the group to which the user belongs.


    By default, the first user created on a Linux system is assigned UID `1000`.


    The `id` command can also take a username as an argument (e.g., `id username`)
    to display the UID and GID for that specific user.


