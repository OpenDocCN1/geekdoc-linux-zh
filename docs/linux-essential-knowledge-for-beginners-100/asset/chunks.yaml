- fmt: "\n# Ping Command\n\nFunctionality: The `ping` command sends ICMP Echo Request\
    \ packets to the specified host and waits for Echo Reply packets. This helps determine\
    \ if the host is reachable and measures round-trip time.\n\nOptions: You can customize\
    \ the `ping` command with various options. For example:\n\n- `-c 4`: Send only\
    \ 4 packets.\n`ping -c 4 remote_host`\n\n- `-i 2`: Wait 2 seconds between sending\
    \ each packet.\n`ping -i 2 remote_host`\n\nTimeouts: If the host is unreachable,\
    \ you will see messages indicating packet loss or timeouts.\n\n### Trivia\nICMP:\
    \ The Internet Control Message Protocol (`ICMP`) is used by the `ping` command\
    \ to send messages about the network's status.\n\nCommon Issues: If you receive\
    \ \"Destination Host Unreachable,\" it may indicate that the host is down or misconfigured,\
    \ or there may be a network issue preventing access.\n\n# The ifconfig Command\
    \ for Network Interface Configuration (Deprecated)\n\nThe `ifconfig` command was\
    \ historically used in Linux systems to configure network interfaces, assign IP\
    \ addresses, and manage network settings. However, it has been deprecated in favor\
    \ of the more modern `ip` command.\n\nHere is an example of how the `ifconfig`\
    \ command was used to assign an IP address to a network interface.\n\n```bash\n\
    sudo ifconfig eth0 192.168.1.10 netmask 255.255.255.0 up\n```\n\nThis command\
    \ would output something like:\n```\neth0: flags=4163<UP,BROADCAST,RUNNING,MULTICAST>\
    \  mtu 1500\n        inet 192.168.1.10  netmask 255.255.255.0  broadcast 192.168.1.255\n\
    \        inet6 fe80::a00:27ff:fe4e:66a5  prefixlen 64  scopeid 0x20<link>\n  \
    \      ether 08:00:27:4e:66:a5  txqueuelen 1000  (Ethernet)\n        RX packets\
    \ 1013517  bytes 1347809329 (1.3 GB)\n        RX errors 0  dropped 0  overruns\
    \ 0  frame 0\n        TX packets 758410  bytes 62984351 (62.9 MB)\n        TX\
    \ errors 0  dropped 0 overruns 0  carrier 0  collisions 0\n```\n\nThe `ifconfig`\
    \ command was once the primary tool for configuring network interfaces on Linux\
    \ systems. It allowed users to bring interfaces up or down, assign IP addresses,\
    \ and configure other network parameters. Despite its widespread use, it has been\
    \ deprecated in favor of the `ip` command due to limitations in functionality\
    \ and flexibility. The `ifconfig` tool is not installed by default on many modern\
    \ distributions, as it doesn't support newer network features like network namespaces\
    \ or advanced routing. For users familiar with `ifconfig`, transitioning to the\
    \ `ip` command is essential, as `ifconfig` may not be available on newer systems.\
    \ The `ip` command offers more advanced options and a more consistent syntax for\
    \ managing various network-related tasks.\n\n### Trivia\nThe deprecation of `ifconfig`\
    \ is part of a broader effort to standardize and modernize networking tools in\
    \ Linux. The `iproute2` suite, which includes the `ip` command, was developed\
    \ to replace several older tools, including `ifconfig`, `route`, and `netstat`.\n\
    \n# The ip Command for Managing Network Interfaces, Routes, and IP Addresses\n\
    \nThe `ip` command is the modern tool used in Linux to manage network interfaces,\
    \ configure IP addresses, and handle routing. It provides a more powerful and\
    \ flexible alternative to the deprecated `ifconfig` command.\n\nBelow is an example\
    \ of using the `ip` command to assign an IP address to a network interface.\n\n\
    ```bash\nsudo ip addr add 192.168.1.10/24 dev eth0\nsudo ip link set eth0 up\n\
    ```\n\nThis command does not typically produce output if successful, but the following\
    \ command can be used to verify the configuration: `ip addr show eth0`\n\nExpected\
    \ output:\n```\n2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc pfifo_fast\
    \ state UP group default qlen 1000\n    link/ether 08:00:27:4e:66:a5 brd ff:ff:ff:ff:ff:ff\n\
    \    inet 192.168.1.10/24 brd 192.168.1.255 scope global eth0\n        valid_lft\
    \ forever preferred_lft forever\ninet6 fe80::a00:27ff:fe4e:66a5  prefixlen 64\
    \  scopeid 0x20<link>\n```\n\nThe `ip` command offers more advanced options and\
    \ a more consistent syntax for managing various network-related tasks.\n\n# Managing\
    \ Systemd Services with systemctl\n\nThe `systemctl` command is used to manage\
    \ `systemd` services. It allows users to start, stop, enable, disable. The following\
    \ snippet demonstrates how to start a service.\n\n```bash\n# Start the Apache\
    \ server\nsudo systemctl start apache2\n\n# Enable the service to start\nsudo\
    \ systemctl enable apache2\n```\n\n# Checking Service Status with systemctl\n\n\
    The `systemctl status` command is used to check the current status of a service\
    \ managed by `systemd`. It provides detailed information about the service, whether\
    \ it is active, inactive, or failed.\n\n```bash\n# Check the status of the Apache\
    \ server\nsudo systemctl status apache2\n```\n\nExpected output:\n```\n● apache2.service\
    \ - The HTTP Server\n   Loaded: loaded (/lib/systemd/system/apache2.service);\
    \ enabled; vendor preset: enabled)\n   Active: active (running) since Mon 2024-08-18\
    \ 12:34:56 UTC; 1h 23min ago\n   Main PID: 1234 (apache2)\n      Tasks: 6 (limit:\
    \ 2362)\n      Memory: 12.3M\n      CGroup: /system.slice/apache2.service\n  \
    \        ├─1234 /usr/sbin/apache2 -k start\n          ├─1235 /usr/sbin/apache2\
    \ -k start\n          └─1236 /usr/sbin/apache2 -k start\n```\n"
