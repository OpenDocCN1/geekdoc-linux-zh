    # adduser 作为 useradd 的用户友好替代方案


    与向 Linux 系统添加新用户的 `useradd` 命令相比，`adduser` 命令是一个用户友好且交互性更高的命令。它通过自动化某些步骤简化了创建用户的过程。


    以下是 `adduser` 和 `useradd` 工作方式示例，重点在于 `adduser` 提供的简单性。


    [Code]


    ```bash

