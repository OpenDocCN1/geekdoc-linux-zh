- fmt: '

    The `du` command scans through the directory and its contents, calculating the
    disk space used by each file and directory. The output shows the size of each
    directory listed, with the size of the files and subdirectories aggregated under
    the parent directory. `du` stands for "disk usage." By default, `du` displays
    the disk usage of directories and their subdirectories in kilobytes (K). The `-h`
    option converts the sizes to a human-readable format (e.g., K for kilobytes, M
    for megabytes, G for gigabytes), making it easier to understand. You can also
    use `du -sh /path/to/directory` to show only the total size of the directory.


    ### Trivia

    The `du` command does not show the free disk space; for that, you would use the
    `df` command. The command can also be combined with other commands like `sort`
    to list directories by size: `du -h /path/to/directory | sort -h`.


    # Archiving Files with the tar Command


    The `tar` command in Linux is used to create, maintain, modify, and extract files
    from an archive. It’s one of the most common tools used for backing up data or
    packaging files together.


    Here is an example of using the `tar` command to create an archive from a directory.
    The `-cvf` options stand for ''create,'' ''verbose,'' and ''file,'' respectively.


    ```

    tar -cvf archive_name.tar /path/to/directory

    ```


    **Result**

    /path/to/directory/

    /path/to/directory/file1

    /path/to/directory/file2


    The output lists all the files being added to the archive.


    The `tar` command is a powerful tool for handling archives: `tar` originally stood
    for "tape archive," reflecting its initial use with tape drives. The `-cvf` flags:

    - `c`: Creates a new archive.

    - `v`: Verbose mode, showing the progress as files are added to the archive.

    - `f`: Specifies the filename of the archive.


    To extract the files from an archive, use `tar -xvf archive_name.tar`, where `x`
    stands for extract. The `tar` command is often used in combination with compression
    tools like `gzip` or `bzip2` to reduce the size of the archive (e.g., `tar -cvzf
    archive_name.tar.gz /path/to/directory`).


    ### Trivia

    The `tar` command is also capable of working with remote files via `SSH`, allowing
    users to create or extract archives on remote systems without transferring the
    entire archive. `tar` is a non-destructive operation; it does not delete the original
    files when creating an archive.


    # Understanding gzip and gunzip for File Compression


    The `gzip` and `gunzip` commands are essential tools in Linux for compressing
    and decompressing files, respectively. They help save disk space and make file
    transfers faster.


    The following code demonstrates how to compress a file using `gzip` and then decompress
    it using `gunzip`.


    ```bash

    # Compressing a file

    gzip example.txt


    # Decompressing the file

    gunzip example.txt.gz

    ```


    **Result**

    After running `gzip example.txt`, the output will be a compressed file named `example.txt.gz`.

    After running `gunzip example.txt.gz`, the original file `example.txt` will be
    restored, and `example.txt.gz` will be deleted.


    `gzip` (GNU zip) is a widely used file compression utility that reduces the size
    of files by using the DEFLATE algorithm. When you run `gzip example.txt`, it compresses
    the file and replaces it with a new file that has a `.gz` extension. This is particularly
    useful for large text files or log files, where compression can significantly
    reduce storage needs.


    Conversely, `gunzip` is used to decompress files that were compressed using `gzip`.
    When you run `gunzip example.txt.gz`, it restores the original file and removes
    the compressed version. It''s important to note that `gzip` is not a lossless
    compression method, meaning that the original data can be perfectly reconstructed
    from the compressed data.


    ### Trivia

    The `gzip` command can also compress multiple files simultaneously. For example,
    `gzip file1.txt file2.txt` will create `file1.txt.gz` and `file2.txt.gz`.


    You can use the `-k` option with `gzip` to keep the original file after compression:
    `gzip -k example.txt`.

    The `-d` option with `gunzip` can be used as an alternative to simply run `gunzip`:
    `gunzip -d example.txt.gz`.


    # Secure File Transfer with scp


    The `scp` (Secure Copy Protocol) command allows users to securely transfer files
    between hosts over a network. It uses `SSH` (Secure Shell) for data transfer,
    ensuring that the data is encrypted.


    The following code shows how to use `scp` to copy a file from a local machine
    to a remote server.


    ```bash

    # Copying a file to a remote server

    scp localfile.txt username@remotehost:/path/to/destination/


    # Copying a file from a remote server to the local machine

    scp username@remotehost:/path/to/source/remotefile.txt .

    ```


    **Result**

    After running `scp localfile.txt username@remotehost:/path/to/destination/`, the
    file `localfile.txt` will be copied to the specified destination on the remote
    server.

    After running `scp username@remotehost:/path/to/source/remotefile.txt .`, the
    file `remotefile.txt` will be copied to the current directory on the local machine.


    The `scp` command is a straightforward way to transfer files securely. The syntax
    is as follows: `scp [options] [source] [destination]`. The source can be a local
    file or a remote file specified in the format `username@hostname:/path/to/file`.
    The destination can similarly be a local path or a remote path.


    When transferring files, `scp` will prompt you for password unless you have set
    up keys.


    ### Trivia

    The `-r` option allows you to copy directories: `scp -r username@remotehost:/path/to/`.

    You can use the `-P` option (note uppercase) to specify a port if the server is
    running on a non-standard port: `scp -P 2222 localfile.txt username@remotehost`.


    # Secure Shell Access Using SSH Command


    The `ssh` command allows secure remote access to another computer. It encrypts
    the connection, ensuring that data is encrypted.


    The following code demonstrates how to use the `ssh` command to connect to a remote
    server.


    ```bash

    ssh username@remotehost

    ```


    **Result**

    If the connection is successful, you will see a prompt similar to this:

    `Last login: Mon Aug 18 12:34:56 2024 from your_ip_address`

    `username@remote_host:~$`


    When you execute `ssh`, replace `username` with your actual username on the remote
    machine and `remotehost` with the IP address or hostname of the remote server.


    Authentication: You may be prompted to enter your password. Alternatively, you
    can set up `SSH` keys for passwordless authentication, which is more secure.

    Port: By default, `SSH` uses port 22. If the server uses a different port, you
    can specify it using the `-p` option: `ssh -p 2222 username@remotehost`.


    # Checking Network Connectivity with Ping Command


    The `ping` command is a network utility used to test the reachability of a host
    on an Internet Protocol (IP) network. It helps diagnose network issues.


    The following code shows how to use the `ping` command to check if a remote server
    is reachable.


    ```

    ping remote_host

    ```


    **Result**

    You will see output similar to this if the host is reachable:

    `PING remote_host (192.168.1.1) 56(84) bytes of data.`

    `64 bytes from remote_host: icmp_seq=1 ttl=64 time=0.123 ms`

    `64 bytes from remote_host: icmp_seq=2 ttl=64 time=0.456 ms`

