    `htop` is particularly useful because it allows you to: Sort processes by CPU,
    memory usage, and more, using the function keys. Kill processes directly by selecting
    them and pressing `F9`. Search for specific processes using `F3`. Customize the
    display by toggling between views using `F2`.


    This makes `htop` an excellent tool for both beginners and experienced users,
    as it simplifies process management in a visual and interactive way.


    [Trivia]


    `htop` is not installed by default on many Linux distributions, unlike `top`.
    It was created by Hisham Muhammad in 2004, and it became popular due to its improved
    usability over `top`. `htop` is also known for its ability to display the full
    command lines of running processes, which `top` cannot do by default.


