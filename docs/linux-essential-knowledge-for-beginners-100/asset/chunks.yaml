    # Using the top Command for Real-Time System Statistics


    * * *


    The top command in Linux is a powerful tool that displays real-time information
    about system processes, including CPU and memory usage. It helps users monitor
    system performance and resource utilization.


    * * *


    The following command will launch the top utility, allowing you to view live statistics
    of system processes and their resource consumption.


    [Code]


    top


    [Result]


    top - 15:30:01 up  1:23,  2 users,  load average: 0.10, 0.15, 0.20


    Tasks: 150 total,   1 running, 149 sleeping,   0 stopped,   0 zombie


    %Cpu(s):  2.0 us,  0.5 sy,  0.0 ni, 97.5 id,  0.0 wa,  0.0 hi,  0.0 si,  0.0 st


    MiB Mem :   7982.0 total,   1234.0 free,   4567.0 used,   3181.0 buff/cache


    MiB Swap:   2048.0 total,   1024.0 free,   1024.0 used.   3456.0 avail Mem


    PID USER      PR  NI    VIRT    RES    SHR S  %CPU %MEM     TIME+ COMMAND


      1 root      20   0  169000   5000   3500 S   0.0  0.1   0:01.23 systemd


      2 root      20   0      0      0      0 S   0.0  0.0   0:00.00 kthreadd


    When you run the top command, you''ll see a dynamic display of system processes
    and their resource usage. The output includes:


    Uptime: How long the system has been running.


    Load Average: The average number of processes in the run queue (over 1, 5, and
    15 minutes).


    Tasks: The total number of processes and their states (running, sleeping, stopped,
    zombie).


    %Cpu(s): Breakdown of CPU usage (user, system, idle, etc.).


    Memory Usage: Total, free, used, and cached memory.


    Swap Usage: Information about swap space.


    You can press q to exit the top command interface.


    [Trivia]


    The top command is highly customizable. You can sort processes by CPU or memory
    usage, change the refresh interval, and even kill processes directly from the
    interface. For more advanced usage, consider exploring htop, an enhanced version
    of top that provides a more user-friendly interface.


    49


    # Using htop for Enhanced Process Monitoring


    * * *


    htop is an interactive and user-friendly alternative to the traditional top command
    in Linux. It provides a more intuitive interface for monitoring system processes,
    allowing users to easily view and manage tasks.


    * * *


    Before you start using htop, make sure it''s installed on your system. It offers
    a more visual representation of system processes, with features like color coding,
    vertical and horizontal scrolling, and easy-to-use shortcuts.


    [Code]


    # To install htop on a Debian-based system:


    sudo apt-get install htop


    # To install htop on a Red Hat-based system:


    sudo yum install htop


    # Run htop by simply typing:


    htop


    [Result]


    When you run htop, you''ll see a detailed, real-time list of system processes,
    CPU usage, memory usage, and other vital system metrics. The interface is colorful
    and interactive, with the ability to scroll through processes and kill them directly
    from the interface.'
