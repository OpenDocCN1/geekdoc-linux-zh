    # Switching Users with the su Command


    The `su` (substitute user) command allows a user to switch to another user account
    in the Linux environment, typically to gain administrative privileges.


    The following code snippet illustrates how to use the `su` command to switch to
    the root user.


    ```bash

    su -

    ```


    [Result]


    `Password:`


    When you execute `su -`, the system prompts you for the password of the target
    user (in this case, the root user). If you enter the correct password, you will
    switch to that user account and gain their permissions.


    The `-` option (or `-l`) is important because it starts a login shell for the
    target user, which means that the environment variables and paths will be set
    as if you had logged in directly as that user.


    If you do not use the `-` option, you will switch users but retain your current
    environment settings, which may not be desirable.


    Switching users is a common practice for performing administrative tasks without
    logging out of your current session. However, it is crucial to use this command
    responsibly, as it can grant significant control over the system.


    [Trivia]


    To return to your original user after using `su`, simply type `exit` or press
    `Ctrl+D`.


    The `su` command requires the target user''s password, which can be a security
    concern; consider using `sudo` for executing single commands with elevated privileges
    instead.


    The `sudo` command allows users to run commands as another user (usually root)
    without needing to switch users entirely, enhancing security and auditability.


