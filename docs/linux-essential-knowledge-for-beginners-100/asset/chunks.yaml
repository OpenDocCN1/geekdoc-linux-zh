    你可以通过输入以下命令来运行脚本：


    ```

    ./script_name.sh

    ```


    ### 冷知识

    shebang 是 Unix 类操作系统中一个至关重要的部分。它允许脚本在无需每次显式调用解释器的情况下执行。可以指定不同的解释器，例如用于 Bourne
    shell 的 `#!/bin/sh` 或用于 Python 脚本的 `#!/usr/bin/env python3`，这使其适用于各种编程语言。


    60


    # 在当前 Shell 中执行脚本


    使用 `source` 或 `.` 允许你在当前 shell 会话中执行脚本，保留对环境变量的任何更改。


    以下代码演示了如何使用 `source` 运行一个修改环境变量的脚本。


    ```bash

    # 将此内容保存为 set_var.sh


    MY_VAR="Hello from the script!"


    export MY_VAR


    # 现在，在终端运行：


    source set_var.sh


    echo $MY_VAR

    ```


    ### 结果

    Hello from the script!


    当你使用 `source set_var.sh` 运行脚本时，该脚本中的会在当前的 shell 上下文中执行。这意味着脚本中定义的任何变量或函数在脚本执行完成后仍然可用。


    相比之下，如果你通过 `./set_var.sh` 运行脚本，它将在子 shell 中执行，对变量的更改都不会影响父 shell。


    总结来说，当你想要更改当前 shell 环境时（例如定义稍后要使用的变量或函数时），使用 `source` 或 `.` 是至关重要的。


    ### 冷知识

    `source` 命令是 Bash 以及其他 shell 的内置功能，允许更灵活的脚本执行。它对于加载配置文件或设置环境的脚本特别有用，例如 `.bashrc`
    或 `.bash_profile`，这些文件在每次启动新的 shell 会话时都会执行。


    61


    # 使用 Alias 命令创建快捷


    Linux 中的 `alias` 命令允许用户为较长的命令创建快捷方式，从而更方便更快速地执行频繁使用的命令。


    以下是如何为常用命令创建别名的示例。


    ```bash

    alias ll=''ls -la''

    ```


    ### 结果

    （创建别名时不显示任何输出。）


    在这个示例中，我们创建了一个名为 `ll` 的别名，代表 `ls -la`。`ls` 命令列出目录内容，`-la` 选项提供了所有文件（包括隐藏文件）的详细视图。通过在终端输入
    `ll`，你可以快速执行 `ls -la`，节省时间和击键次数。


    可以将别名添加到 shell 配置文件中（如 `~/.bashrc` 或 `~/.bash_profile`）以使其永久化。在配置文件中添加别名后，你需要运行
    `source ~/.bashrc`（或相应文件）来应用更改。


    ### 冷知识

    别名特定于 shell 会话。如果你打开了一个新终端，除非它们已添加到配置文件中，否则你需要重新定义它们。


    你只需在终端中输入 `alias` 即可查看所有定义的别名。


    别名也可以带有参数，但这需要使用函数采用不同的方法。


    62


    # 使用 unalias 别名


    `unalias` 命令用于删除 Linux 中已存在的别名，允许用户清理或修改他们的命令快捷方式。


    以下是删除之前创建的别名的示例。


    ```bash

    unalias ll

    ```


    ### 结果

    （删除别名时不显示任何输出。）


    在这个示例中，命令 `unalias ll` 删除了之前定义的别名 `ll`。执行此命令后，输入 `ll` 将导致错误，提示未找到命令，除非重新定义 `ll`。


    需要注意的是，使用 `unalias` 只影响当前的 shell 会话。如果你想永久删除配置文件中定义的别名，必须删除或注释掉定义别名的那行，然后再次 source
    该文件。


    ### 冷知识

    你可以使用 `unalias -a` 删除当前 shell 会话中所有定义的别名。


    如果你尝试 `unalias` 一个不存在的命令，你不会收到错误；该命令将什么都不做。


    理解如何有效管理别名可以极大提高你在命令行环境中的效率。


    63


    # 使用 which 命令查找可执行文件位置


    `which` 命令是 Linux 中一个非常有用的工具，帮助用户找到与命令相关的可执行文件。它会在环境变量 `PATH` 列出的目录中搜索并返回可执行文件的路径。


    以下代码演示了如何使用 `which` 命令查找 `ls` 命令的位置，它通常用于列出目录内容。


    ```bash

    which ls

    ```


    ### 结果

    /bin/ls


    当你运行 `which ls` 命令时，终端将返回 `/bin/ls`，表示 `ls` 可执行文件位于 `/bin` 目录。此命令对于验证你正在使用的是哪个版本的命令特别有帮助，尤其是当不同目录中安装了多个版本时。


    `which` 命令只返回在 `PATH` 中找到的匹配项。如果你想查看所有匹配项，可以使用 `-a` 选项：


    ```bash

    which -a ls

    ```


    这将列出在 `PATH` 指定目录中找到的所有 `ls` 实例。


    ### 冷知识

    `which` 命令经常与 `whereis` 命令混淆。`which` 显示可执行文件的位置，而 `whereis` 提供关于命令的二进制文件、源码和帮助页文件的信息。例如，运行
    `whereis ls` 可能会返回多个路径，包括二进制文件位置、帮助页等。


    64


    # 使用 type 理解命令解释


    Linux 中的 `type` 命令帮助用户确定 shell 将如何解释命令。它告诉你是命令是内置的、别名、函数还是外部可执行文件。


    以下代码演示了如何使用 `type` 命令检查 `echo` 命令的性质，它通常用于显示消息。


    ```bash

    type echo

    ```


    ### 结果

    echo is a shell builtin


    当你执行 `type echo` 时，输出表明 `echo` 是一个 shell 内置命令。这意味着该命令构建在 shell  内部，而不是外部可执行文件。内置命令通常更快，因为它们不需要
    shell 创建新进程。


    `type` 命令还可以揭示其他类型的命令解释。例如，如果你为命令创建了别名，对该别名运行 `type` 将显示其定义。你还可以使用 `-a` 选项查看与命令相关的所有位置和类型：


    ```bash

    type -a ls

    ```


    这将显示 `ls` 是内置、别名还是外部命令，以及它的位置。


    ### 冷知识

    理解命令的类型对于调试脚本和命令行操作至关重要。例如，如果一个命令的行为出现异常，知道它是内置命令还是外部命令可以帮助你识别问题所在。此外，用户可以创建自己的函数和别名，这些有时会覆盖现有命令，如果不进行管理，会导致混乱。


    65


    # 在 Linux 中使用 history 命令


    Linux 中的 `history` 命令允许用户查看终端中之前执行过的命令列表。这对于回想和重复使用命令而无需重新输入特别有用。


    以下是如何使用 `history` 命令显示终端中执行的最后十条命令的示例。


    ```bash

    history 10

    ```


    ### 结果

    1   ls -l

    2   cd /var/log

    3   cat syslog

    4   grep error syslog

    5   nano config.txt

    6   history 10

    7   clear

    8   pwd

    9   df -h

    10  exit


    `history` 命令输出在当前 shell 会话中执行过的命令的编号列表。每个命令前面都有一个数字，该数字可以稍后引用该特定命令。可以通过更改 `history`
    后数字来调整显示命令的数量。例如，`history 5` 将显示最后五条命令。


    ### 冷知识


