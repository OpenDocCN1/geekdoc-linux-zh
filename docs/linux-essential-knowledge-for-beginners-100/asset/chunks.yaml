    Writing superblocks and filesystem accounting information: done


    `mkfs` is a front-end command that calls the appropriate utility for the file
    system type specified (e.g., `mkfs.ext4` for `ext4`). The command above creates
    an `ext4` file system on `/dev/sdb1`. The process involves setting up superblocks,
    inode tables, and journal blocks that will be used by the file system to manage
    files and directories. It’s crucial to ensure that the target partition, like
