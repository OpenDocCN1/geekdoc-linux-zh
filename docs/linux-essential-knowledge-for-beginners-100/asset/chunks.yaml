    In modern Linux distributions, many commands that were traditionally in `/bin`
    and `/sbin` are now symlinked to `/usr/bin` and `/usr/sbin`, reflecting a more
    unified file system structure.


    # The /tmp Directory for Temporary Files


    The `/tmp` directory is used in Linux systems to store temporary files that are
    created by various processes and applications. Files stored in this directory
    are not meant to be permanent and are typically deleted when the system is rebooted
    or after a certain period of time.


    This section demonstrates how to create a temporary file in the `/tmp` directory
    using a simple command.


    ```bash

    # Create a temporary file in /tmp

    touch /tmp/example_temp_file.txt


    # List the contents of /tmp to verify the file creation

    ls /tmp | grep example_temp_file.txt

    ```


    ```

    example_temp_file.txt

    ```


    The `/tmp` directory is universally available on all Linux systems, and it is
    designed to provide a space for temporary files that are only needed for a short
    duration. It is a volatile directory, meaning that its contents are typically
    cleared upon system reboot. Programs and scripts commonly use `/tmp` for short-lived
    files, such as lock files, sockets, or other temporary data. For example, when
    you download a file from the internet or open a document, the system may place
    the data in `/tmp` before moving it to a more permanent location. The default
    permissions of `/tmp` usually allow all users to write to it, but each user''s
    files are protected by the sticky bit, which ensures that only the file owner
    or the root user can delete the files.


    On some Linux systems, the `/tmp` directory may be configured to reside in memory
    (`tmpfs`), which makes it even faster but more volatile. However, this setup limits
    the amount of data that can be stored in `/tmp` to the amount of available RAM,
    so be cautious when storing large files.


    # The /mnt Directory for Mounting File Systems


    The `/mnt` directory is used in Linux systems as a mount point for temporarily
    attaching file systems. It is a designated directory where you can manually mount
    storage devices, such as external hard drives, USB drives, or network shares.


    This section shows how to mount a temporary file system to the `/mnt` directory.


    ```bash

    # Create a directory to serve as a mount point

    sudo mkdir /mnt/my_mount


    # Mount a temporary file system (tmpfs) to the directory

    sudo mount -t tmpfs -o size=100M tmpfs /mnt/my_mount


    # Verify the mount

    df -h /mnt/my_mount

    ```


    ```

    Filesystem      Size  Used Avail Use% Mounted on

    tmpfs           100M     0  100M   0% /mnt/my_mount

    ```


    The `/mnt` directory is a standard location in the Linux filesystem hierarchy,
    intended for temporary mounts. Unlike `/media`, which is generally used for automounting
    external media like USB drives or CDs, `/mnt` is often used for manual mounts
    or testing purposes. In the example, a `tmpfs` (temporary file system) is mounted
    on `/mnt/my_mount`. `tmpfs` is a special kind of file system that resides in the
    system''s RAM. It is useful for fast storage with the caveat that all data is
    lost when the system is shut down or the file system is unmounted. You can unmount
    the file system using the `umount` command: `sudo umount /mnt/my_mount`.


    This returns the system to its previous state, with `/mnt/my_mount` no longer
    containing any mounted file system.


    The `/mnt` directory does not have any special attributes like `/tmp`, and its
    contents are typically persistent until explicitly unmounted or deleted. This
    makes `/mnt` a good choice for testing or temporarily mounting file systems without
    affecting the rest of the system.


    # Understanding the /boot Directory


    The `/boot` directory is a crucial part of a Linux system, containing essential
    files needed to boot the operating system. This directory typically includes the
    Linux kernel, initial RAM disk images, and bootloader configuration files.


    The following code lists the contents of the `/boot` directory, which helps you
    identify the important files required for system booting.


    ```bash

    ls -l /boot

    ```


    ```

    total 123456

    -rw-r--r-- 1 root root  12345678 Jan  1 12:00 vmlinuz-5.4.0-42-generic

    -rw-r--r-- 1 root root  9876543 Jan  1 12:00 initrd.img-5.4.0-42-generic

    -rw-r--r-- 1 root root   123456 Jan  1 12:00 grub

    ```


    The `ls -l /boot` command lists the files in the `/boot` directory in a detailed
    format. Each line shows permissions, number of links, owner, group, size, last
    modified date, and the file name.


    `vmlinuz-5.4.0-42-generic`: This is the compressed Linux kernel image. The kernel
    is the core of the operating system, managing hardware and system resources.


    `initrd.img-5.4.0-42-generic`: This is the initial RAM disk image, which contains
    temporary file systems used during the boot process. It allows the kernel to load
    drivers.


    `grub`: This is the GRUB bootloader configuration files, which manage the boot
    process.


    If the `/boot` directory is corrupted, the system may fail to boot. The `/boot`
    directory is critical for system startup.


    # Managing Disk Partitions with fdisk and parted


    `fdisk` and `parted` are powerful tools used to manage partitions. The following
    example demonstrates how to use `fdisk` to list partition tables.


    ```bash

    sudo fdisk -l /dev/sda

    ```


    ```

    Disk /dev/sda: 500 GiB, 5368709120

    Disk model: Samsung SSD

    Units: sectors

    Sector size (logical/physical): 512 bytes

    Disklabel: gpt

    Device    Start         End   Sectors  Type

    dev/sda1  2048      1230847     1228799 Linux filesystem

    dev/sda2 1230848    1255423      24576 Linux filesystem

    dev/sda3 1255424 1036870919 1035615496 Linux filesystem

    ```


    The `sudo fdisk -l /dev/sda` command lists the partition table of the specified
    disk.


    Disk `/dev/sda`: This indicates the disk being examined. In this case, it is 500
    GiB.


    Disk model: Shows the model of the disk.


    Units: Indicates the unit of measurement used for sectors.


    Disklabel: Shows the partitioning scheme used (GPT).


    Device: Lists each partition on the disk, along with its start and end sectors,
    total number of sectors, size, and type.


    Understanding how to manage partitions is essential for system administration,
    allowing you to optimize disk usage and configure your system.


    # Creating a File System on a Partition with mkfs


    The `mkfs` (make filesystem) command is used to create a file system on a specified
    partition in Linux. This is essential for preparing a partition to store data.


    To use `mkfs`, you must specify the type of file system and the partition where
    it will be created. Here’s an example where we create an `ext4` file system on
    a partition `/dev/sdb1`.


    ```bash

    sudo mkfs.ext4 /dev/sdb1

    ```


    ```

    mke2fs 1.45.5 (07-Jan-2020)

    Creating filesystem with 1048576 4k blocks and 262144 inodes

    Filesystem UUID: e1234f5c-6b78-4c9a-9b9e-8e7bcbf0d567

    ```

