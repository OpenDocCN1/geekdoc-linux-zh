    Transaction Summary\n================================================================\n\
    Install  1 Package\n\nTotal download size: 1.2 M\nInstalled size: 3.5 M\nIs this\
    \ ok [y/N]: y\n\n`dnf install wget` 命令安装 `wget` 软件包，这是一个用于从网络非交互式下载文件的工具。\n\n"
- fmt: "\n`yum` was the default package manager for older versions of Red Hat-based\
    \ systems, while `dnf` has become the default in newer versions due to its improved\
    \ performance and additional features.\n\nBoth `yum` and `dnf` automatically handle\
    \ dependencies, meaning they will install required packages along with the requested\
    \ package.\n\nYou can use `dnf upgrade` to update all installed packages to their\
    \ latest versions.\n\n# Package Management with the Pacman Command in Arch Linux\n\
    \nThe `pacman` command is the package manager used in Arch Linux and its derivatives.\
    \ It simplifies the process of installing, updating, and removing software packages.\n\
    \nThe following code demonstrates how to install a package using `pacman`. For\
    \ this example, we will install the `htop` package, which is a popular system\
    \ monitoring tool.\n\n```\nsudo pacman -S htop\n```\n\n```\nresolving dependencies...\n\
    looking for conflicting packages...\nPackages (1) htop-3.2.1-1\nTotal Installed\
    \ Size:  1.23 MiB\n:: Proceed with installation? [Y/n] y\n```\n\nIn this command,\
    \ `sudo` is used to run the command with superuser privileges, which is necessary\
    \ for installing software. The `-S` option stands for \"sync\" and is used to\
    \ install the specified package. After executing the command, `pacman` resolves\
    \ any dependencies that the package may have and prompts the user to confirm the\
    \ installation. If you type `y` and press Enter, the installation will proceed.\n\
    \n`pacman` stands for \"package manager\" and is designed to be simple and efficient.\n\
    \nArch Linux uses a rolling release model, meaning that software is continuously\
    \ updated rather than released in versions.\n\nYou can also use `pacman -R` to\
    \ remove a package and `pacman -Syu` to update the system and all installed packages.\n\
    \n# Installing Packages with the Snap Command\n\nThe `snap` command is a package\
    \ management system that installs applications in a sandboxed environment, ensuring\
    \ that they run in isolation from the rest of the system.\n\nThe following code\
    \ shows how to install the `vlc` media player using the `snap` command. This command\
    \ will download and install the application while keeping it isolated from other\
    \ applications.\n\n```\nsudo snap install vlc\n```\n\n```\nvlc 3.0.11.1 from VideoLAN✓\
    \ installed\n```\n\nIn this example, `sudo` is again used to grant the necessary\
    \ permissions for installation. The `snap install` command fetches the `vlc` package\
    \ from the `Snap Store`, which is a repository for snap packages. Once the installation\
    \ is complete, you will see a confirmation message indicating that `vlc` has been\
    \ successfully installed.\n\n`Snap` packages are designed to be self-contained,\
    \ which means they include all the dependencies they need to run.\n\nThe `Snap\
    \ Store` hosts a wide variety of applications, making it easy to find and install\
    \ software.\n\nTo list installed snaps, you can use the command `snap list`, and\
    \ to remove a snap, you would use `snap remove <package-name>`.\n\n# Using apt-cache\
    \ search to Find Packages\n\nThe `apt-cache search` command in Linux allows users\
    \ to search for packages in the package repository based on keywords.\n\nThis\
    \ command is useful when you want to find software packages that match specific\
    \ criteria without needing to know the exact package name.\n\n```\napt-cache search\
    \ apache\n```\n\n```\napache2 - Apache HTTP Server\napache2-doc - Apache HTTP\
    \ Server Documentation\nlibapache2-mod-php - Server-side, HTML-embedded scripting\
    \ language (Apache 2 module)\n...\n```\n\nThe `apt-cache search` command queries\
    \ the package database to return a list of packages that contain the specified\
    \ keyword in their name or description. It's particularly useful for exploring\
    \ available software options when you don't know the exact name of the package\
    \ you need. The command outputs a list where each line represents a package with\
    \ the package name followed by a brief description. This command doesn't require\
    \ root privileges because it only reads the package database. It doesn't install,\
    \ remove, or modify any packages. The search results may be extensive, so you\
    \ can refine your search by using more specific keywords. The `apt-cache` command\
    \ is a part of the `APT` (Advanced Package Tool) suite used primarily in Debian-based\
    \ systems like Ubuntu. It interacts with the `APT` package database to perform\
    \ various tasks, such as searching, displaying package information, and more.\
    \ While `apt-cache search` is a basic operation, it's an essential tool for managing\
    \ software on Linux systems.\n\nThe `APT` suite, including `apt-cache`, originated\
    \ from the need to simplify package management on Debian-based systems. Before\
    \ `APT`, package management involved manually resolving dependencies, a process\
    \ that was both time-consuming and prone to errors. `APT` automates this process,\
    \ ensuring that all dependencies are installed automatically, making it a crucial\
    \ tool for Debian-based distributions.\n\n# Managing Debian Packages with dpkg\n\
    \nThe `dpkg` command is used to install, remove, and manage individual Debian\
    \ packages directly on a system.\n\nThis command provides more granular control\
    \ over Debian package management, allowing for detailed operations like installation,\
    \ removal, and inspection of packages.\n\n```\nsudo dpkg -i example_package.deb\n\
    ```\n\n```\n(Reading database ... 275438 files and directories currently installed.)\n\
    Preparing to unpack example_package.deb ...\nUnpacking example_package (1.0-1)\
    \ ...\nSetting up example_package (1.0-1) ...\n```\n\nThe `dpkg` command is a\
    \ low-level package manager for Debian-based systems, handling `.deb` files. When\
    \ you use `dpkg -i`, it installs the specified package, assuming the package file\
    \ is present on your system. The installation process includes several steps:\n\
    1. Reading the package database to prepare for installation.\n2. Unpacking the\
    \ package file, which involves extracting its contents.\n3. Setting up the package,\
    \ which includes configuring files and making the software ready to use.\n\nUnlike\
    \ `APT`, `dpkg` doesn't handle dependencies automatically. If the package you're\
    \ installing requires other packages (dependencies), you'll need to install those\
    \ manually. For this reason, `APT` is often preferred for most package management\
    \ tasks, as it resolves dependencies. To remove a package, you can use `dpkg -r\
    \ package_name`. To check the status of installed packages, `dpkg -l` can be used,\
    \ and for detailed information about a specific package, `dpkg -s` is useful.\n\
    \nThe Debian package management system, with `dpkg` at its core, is one of the\
    \ oldest package management systems in Linux.\n\n# Managing Red Hat Packages with\
    \ RPM Command\n\nThe `rpm` command is a powerful tool used in Red Hat-based Linux\
    \ distributions for managing software packages. It allows users to install, uninstall,\
    \ query, and verify packages.\n\nThe following example demonstrates how to install\
    \ a package using the `rpm` command.\n\n```\nsudo rpm -ivh package-name.rpm\n\
    ```\n\n```\nPreparing...  ################# [100%]\nUpdating / installing...\n\
    \   1:package-name  ################# [100%]\n```\n\nThe `rpm` command has several\
    \ options:\n- `-i`: This option is used to install a new package.\n- `-v`: Enables\
    \ verbose mode, providing more detailed output during the installation.\n- `-h`:\
    \ Displays a hash mark (#) progress bar during the installation process.\n\nWhen\
    \ you run the command, it requires superuser privileges, which is why `sudo` is\
    \ used. The command will check for dependencies and install the specified package.\
    \ If the package is already installed, it will not reinstall unless you use the\
    \ `--replacepkgs` option.\n"
