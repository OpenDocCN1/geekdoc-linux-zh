    data on that partition.


    ## Trivia


    Different file systems are suited for different use cases. For example, `ext4`
    is commonly used for general-purpose Linux file systems, while `xfs` is known
    for handling large files efficiently. The `mkfs` command can be used with other
    file systems like `mkfs.xfs`, `mkfs.vfat`, etc., depending on the needs of the
