  trans: "\n\n`yum` 是旧版本 Red Hat 系系统的默认软件包管理器，而在较新版本中，由于性能的提升和额外的功能，`dnf` 已已成为默认管理器。\n\
    \n`yum` 和 `dnf` 都会自动处理依赖关系，这意味着它们会在安装请求的包的同时安装所需的包。\n\n你可以使用 `dnf upgrade` 将所有已安装软件包更新到最新版本。\n\
    \n# 在 Arch Linux 中使用 Pacman 命令管理软件包\n\n`pacman` 命令是 Arch Linux 及其衍生版使用的软件包管理器。它简化了安装、更新和删除软件包的过程。\n\
    \n以下代码演示了如何使用 `pacman` 安装软件包。在本示例中，我们将安装 `htop` 软件包，这是一个流行的系统监控工具。\n\n```\nsudo\
    \ pacman -S htop\n```\n\n```\nresolving dependencies...\nlooking for conflicting\
    \ packages...\nPackages (1) htop-3.2.1-1\nTotal Installed Size:  1.23 MiB\n::\
    \ Proceed with installation? [Y/n] y\n```\n\n在此命令中，使用 `sudo` 以超级用户权限运行命令，这对于安装软件是必要的。`-S`\
    \ 选项代表“sync”（同步），用于安装指定的软件包。执行命令后，`pacman` 会解析该包可能具有任何依赖关系并提示用户确认安装。如果你输入 `y`\
    \ 并按回车键，安装将继续。\n\n`pacman` 代表“package manager”（软件包管理器），设计目标是简单高效。\n\nArch Linux\
    \ 使用滚动更新模型，这意味着软件是持续更新的，而不是分版本的。\n\n你还可以使用 `pacman -R` 软件包，并使用 `pacman -Syu` 更新系统和所有已安装软件包。\n\
    \n# 使用 Snap 命令安装软件包\n\n`snap` 命令是一个软件包管理系统，它在沙箱环境中安装应用程序，确保它们与系统的其余部分隔离。\n\n以下代码显示如何使用\
    \ `snap` 命令安装 `vlc` 媒体播放器。该命令将在下载并安装应用程序的同时，保持与其他应用程序隔离。\n\n```\nsudo snap install\
    \ vlc\n```\n\n```\nvlc 3.0.11.1 from VideoLAN✓ installed\n```\n\n在此示例中，再次使用 `sudo`\
    \ 来授予安装所需的必要权限。`snap install` 命令从 `Snap Store` 获取 `vlc` 软件包，`Snap Store` 是一个 软件包\
    \ 包的仓库。一旦安装完成，你将看到一条确认消息，表明 `vlc` 已成功安装。\n\n`Snap` 软件包设计为自包含的，这意味着它们包含了运行所需的所有依赖关系。\n\
    \n`Snap Store` 托管了各种应用程序，使得查找和安装软件变得简单。\n\n可以使用命令 `snap list` 列出已安装的 snaps，并使用\
    \ `snap remove <package-name>` 移除一个 snap。\n\n# 使用 apt-cache search 查找软件包\n\nLinux\
    \ 中的 `apt-cache search` 命令允许用户根据关键词在软件包仓库中搜索软件包。\n\n当你想要查找符合特定标准的软件包，但不需要确切的包名时，此命令非常有用。\n\
    \n```\napt-cache search apache\n```\n\n```\napache2 - Apache HTTP Server\napache2-doc\
    \ - Apache HTTP Server Documentation\nlibapache2-mod-php - Server-side, HTML-embedded\
    \ scripting language (Apache 2 module)\n...\n```\n\n`apt-cache search` 命令查询软件包数据库，返回在名称或描述中包含指定关键词的软件包列表。在不知道所需软件包的确切名称时，它对于探索可用软件选项特别有用。该命令输出一个列表，其中每一行代表一个软件包，包名后跟着简短的描述。此命令不需要\
    \ root 权限，因为它只读取软件包数据库。它不会安装、删除或修改任何软件包。搜索结果可能非常多，因此你可以通过更具体的关键词来完善搜索。`apt-cache`\
    \ 命令是 `APT`（高级软件包工具）套件的一部分，主要用于 Ubuntu 等 Debian 系系统。它与 `APT` 软件包数据库交互以执行各种任务，如搜索、显示软件包信息等。虽然\
    \ `apt-cache search` 是一个基础操作，但它是 Linux 系统上管理软件的必不可少的工具。\n\n`APT` 套件（包括 `apt-cache`）源于简化\
    \ Debian 系系统软件包管理的需求。在引入 `APT` 之前，软件包管理涉及手动解析依赖关系，这个过程既耗时又容易出错。`APT` 自动化了这一过程，确保所有依赖关系都自动安装，使其成为\
    \ Debian 系发行版中至关重要的工具。\n\n# 使用 dpkg 管理 Debian 软件包\n\n`dpkg` 命令用于直接在系统上安装、删除和管理单个\
    \ Debian 软件包。\n\n此命令对 Debian 软件包管理提供了更细粒度的控制，允许执行安装、删除和检查软件包等详细操作。\n\n```\nsudo\
    \ dpkg -i example_package.deb\n```\n\n```\n(Reading database ... 275438 files\
    \ and directories currently installed.)\nPreparing to unpack example_package.deb\
    \ ...\nUnpacking example_package (1.0-1) ...\nSetting up example_package (1.0-1)\
    \ ...\n```\n\n`dpkg` 命令是 Debian 系系统的低级软件包管理器，处理 `.deb` 文件。当你使用 `dpkg -i` 时，它会安装指定的软件包，假设该包存在于你的系统中。安装过程包括几个步骤：\n\
    1. 读取软件包数据库以准备安装。\n2. 解压包文件，涉及提取其内容。\n3. 设置软件包，包括配置并并软件可用。\n\n与 `APT` 不同，`dpkg`\
    \ 不会自动处理依赖关系。如果你安装的包需要其他包（依赖项），你需要手动安装这些包。出于此原因，大多数软件包管理任务通常选择 `APT`，因为它能解析依赖。要移除软件包，可以使用\
    \ `dpkg -r package_name`。可以使用 `dpkg -l` 已安装软件包的状态，而关于特定软件包的详细信息，`dpkg -s` 很有用。\n\
    \nDebian 软件包管理系统以 `dpkg` 为核心，是 Linux 最老的软件包管理系统之一。\n\n# 使用 RPM 命令管理 Red Hat 软件包\n\
    \n`rpm` 命令是一个强大的工具，用于 Red Hat 系 Linux 发行版中的软件包管理。它允许用户安装、卸载、查询和验证软件包。\n\n以下示例演示了如何使用\
    \ `rpm` 命令安装软件包。\n\n```\nsudo rpm -ivh package-name.rpm\n```\n\n```\nPreparing...\
    \  ################# [100%]\nUpdating / installing...\n   1:package-name  #################\
    \ [100%]\n```\n\n`rpm` 命令有多个选项：\n- `-i`: 用于安装新软件包。\n- `-v`: 启用详细模式，在安装期间提供更详细的输出。\n\
    - `-h`: 在安装过程中显示哈标记（#）进度条。\n\n运行该命令时需要超级用户权限，因此使用了 `sudo`。该命令会检查依赖关系并安装指定的软件包。如果包已安装，除非使用\
    \ `--replacepkgs` 选项，否则它不会重新安装。\n\n"
- fmt: "\n# Trivia\n\nThe RPM Package Manager (`RPM`) was originally developed for\
    \ Red Hat Linux and is now widely used in various distributions, including Fedora\
    \ and CentOS. `RPM` files have a `.rpm` extension, and they contain the compiled\
    \ software along with metadata about the package, such as version, dependencies,\
    \ and installation scripts. Understanding how to use `rpm` is crucial for system\
    \ administrators managing software on Red Hat-based systems.\n\n76\n\n# Creating\
    \ New Users with Useradd Command\n\nThe `useradd` command is used to create new\
    \ user accounts in Linux. It allows system administrators to manage user access\
    \ and permissions effectively. \n\nThe following example shows how to create a\
    \ new user with the `useradd` command.\n\n```bash\nsudo useradd -m newusername\n\
    ```\n\n**Result**\n\n*(No output is produced if the command is successful. You\
    \ can verify the user creation by checking the `/etc/passwd` file.)*\n\nThe `useradd`\
    \ command options include:\n- `-m`: This option creates a home directory for the\
    \ new user at `/home/newusername`.\n- `newusername`: This is the name of the user\
    \ you are creating.\n\nAfter executing the command, no output is displayed if\
    \ the operation is successful. You can confirm the user has been created by checking\
    \ the `/etc/passwd` file, which contains a list of all user accounts on the system.\
    \ Use the following command to view the file:\n\n```bash\ncat /etc/passwd | grep\
    \ newusername\n```\n\nThis will display the entry for the newly created user.\n\
    \n### Trivia\n\nThe `useradd` command is a low-level utility for creating users.\
    \ It does not set a password for the user by default. To set a password, you would\
    \ typically use the `passwd` command as follows:\n\n```bash\nsudo passwd newusername\n\
    ```\n\nThis command prompts you to enter a new password for the user. Understanding\
    \ user management is essential for maintaining security and access control in\
    \ a Linux environment.\n\n77\n\n# Modifying User Accounts with the usermod Command\n\
    \nThe `usermod` command in Linux is used to modify the properties of an existing\
    \ user account. This command allows system administrators to change user details\
    \ such as the username, home directory, user ID, and group memberships.\n\nThe\
    \ following code demonstrates how to change a user's home directory using the\
    \ `usermod` command.\n\n```bash\nsudo usermod -d /new/home/directory username\n\
    ```\n\n**Result**\n\n*(No output if successful; if there is an error, it will\
    \ display an error message.)*\n\nIn this command:\n- `sudo` is used to run the\
    \ command with superuser privileges, which are required for modifying user accounts.\n\
    - `usermod` is the command itself.\n- `-d` specifies the new home directory for\
    \ the user.\n- `/new/home/directory` is the path to the new home directory you\
    \ want to set.\n- `username` is the name of the user whose home directory you\
    \ are modifying.\n\nAfter running this command, the specified user's home directory\
    \ will be updated. It's important to ensure that the new directory exists and\
    \ that it has the correct permissions set for the user.\n\n### Trivia\n\nThe `usermod`\
    \ command can also be used to change other user properties, such as the user's\
    \ login shell (`-s` option), user ID (`-u` option), and group memberships (`-aG`\
    \ option for adding groups).\n\nAlways check the current settings of a user account\
    \ before making changes by using the `id username` command.\n\n78\n\n# Changing\
    \ User Passwords with the passwd Command\n\nThe `passwd` command in Linux is used\
    \ to change a user's password. This command is essential for maintaining user\
    \ account security and ensuring that only authorized users can access their accounts.\n\
    \nThe following code shows how to change a user's password using the `passwd`\
    \ command.\n\n```bash\nsudo passwd username\n```\n\n**Result**\n\n```\nChanging\
    \ password for user username.\nNew password:\nRetype new password:\npasswd: password\
    \ updated successfully\n```\n\nIn this command:\n- `sudo` allows the command to\
    \ be executed with superuser privileges.\n- `passwd` is the command used to change\
    \ the password.\n- `username` is the name of the user whose password you are changing.\n\
    \nWhen you run this command, you will be prompted to enter a new password and\
    \ then to confirm it by typing it again. If the passwords match, the system will\
    \ update the password successfully.\n\n### Trivia\n\nPasswords should be strong\
    \ and secure, typically consisting of a mix of letters, numbers, and special characters.\n\
    \nUsers can also change their own passwords without superuser privileges by simply\
    \ typing `passwd` and following the prompts.\n\nThe `passwd` command can also\
    \ enforce password expiration and complexity requirements through configuration\
    \ files like `/etc/login.defs`.\n\n79\n\n# Deleting a User with userdel\n\nThe\
    \ `userdel` command is used to delete a user account from a Linux system.\n\n\
    The `userdel` command removes a user from the system. You can specify whether\
    \ to also delete the user's home directory and mail spool.\n\n```bash\nsudo userdel\
    \ -r username\n```\n\n**Result**\n\nIf successful, this command removes the user\
    \ `username` from the system and deletes their home directory and mail spool.\
    \ There is no output upon success.\n\nThe `userdel` command is essential when\
    \ managing user accounts. The `-r` option tells the command to remove the user's\
    \ home directory and mail spool, which are typically located in `/home/username`\
    \ and `/var/mail/username` respectively. Without the `-r` option, only the user\
    \ account is deleted, and their home directory remains on the system. This command\
    \ must be executed with superuser privileges, which is why `sudo` is used. If\
    \ you omit `sudo`, the command will fail unless you are logged in as the root\
    \ user. It's crucial to ensure that the user is not currently logged in when using\
    \ `userdel`. Deleting a logged-in user can cause unpredictable behavior or leave\
    \ processes running in a broken state.\n\n### Trivia\n\nWhen you delete a user\
    \ with `userdel`, it does not automatically delete any associated cron jobs for\
    \ that user. You may need to manually remove these if they exist. Additionally,\
    \ `userdel` does not remove the user's files outside their home directory, such\
    \ as files they may have created elsewhere on the filesystem.\n\n80\n\n# Creating\
    \ a New Group with groupadd\n\nThe `groupadd` command is used to create a new\
    \ group on a Linux system.\n\nThe `groupadd` command allows you to define and\
    \ add a new group to the system, which can be used.\n\n```bash\nsudo groupadd\
    \ newgroup\n```\n\n**Result**\n\nIf successful, this command creates a new group\
    \ called `newgroup` with a unique Group ID (`GID`). There is no output upon success.\n\
    \nThe `groupadd` command is straightforward but powerful for managing permissions.\
    \ When you create a group, the system assigns it a Group ID (`GID`), which is\
    \ used to identify the group. This group can then be used to control access to\
    \ files and directories by assigning users to the group. For example, if multiple\
    \ users need to access the same files, you can create a group and add all the\
    \ necessary users to that group. By setting the appropriate file permissions,\
    \ only members of that group can access or modify the files.\n\n### Trivia\n\n\
    Groups in Linux are critical for implementing security models, especially in environments\
    \ where multiple users need varying levels of access to different resources. Every\
    \ user belongs to at least one group, their primary group, and can belong to multiple\
    \ secondary groups. Understanding and managing groups effectively is fundamental\
    \ for system administration.\n\n81\n\n# Modifying an Existing Group with groupmod\n\
    \nThe `groupmod` command is used to modify the properties of an existing group\
    \ in Linux. This command allows you to change the group name or the group ID (`GID`)\
    \ of a specified group.\n"
