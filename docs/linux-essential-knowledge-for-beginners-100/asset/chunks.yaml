    # Mounting a File System to a Directory with mount


    The `mount` command in Linux attaches a file system to a specific directory (mount
    point), allowing access to the data stored in the file system from that directory.


    To use the `mount` command, you need to specify the file system and the directory
    where it should be attached. Here’s an example of mounting the file system on
    `/dev/sdb1` to the `/mnt/data` directory.


    ```bash

    sudo mount /dev/sdb1 /mnt/data

    ```


    ## Result


    If successful, there will be no output, and the file system will be mounted.


    Mounting a file system is a critical task in Linux, as it integrates the file
    system into the directory structure of the operating system. The mount point (`/mnt/data`
    in this case) becomes the root directory of the mounted file system. Once mounted,
    all files within the file system can be accessed under the mount point. You can
    check which file systems are currently mounted by using the `mount` command without
    arguments or by inspecting the `/proc/mounts` file.


    ## Trivia


    The `mount` command can also be used to mount remote file systems, such as those
    shared over NFS (Network File System). Additionally, file systems can be mounted
    with specific options (like `ro` for read-only) by using the `-o` flag, as in
    `sudo mount -o ro /dev/sdb1 /mnt/data`. To unmount a file system, use the `umount`
    command (note the absence of ''n'' in `umount`), for example, `sudo umount /mnt/data`.


    97


    # Understanding the umount Command in Linux


    The `umount` command in Linux is used to detach a file system that is currently
    mounted, making it inaccessible until it is mounted again.


    Before using the `umount` command, ensure that no processes are using the file
    system you want to detach. This prevents data loss and ensures that the file system
    is safely unmounted.


    ```bash

    sudo umount /mnt/mydrive

    ```


    ## Result


    (There will be no output if the command is successful. If it fails, you may see
    an error message indicating why the unmounting was unsuccessful.)


    When you mount a file system, it becomes part of the Linux file hierarchy, allowing
    you to access files on that system. The `umount` command is essential for safely
    detaching a file system. If you try to unmount a file system that is in use, you
    will receive an error message. To check which processes are using the file system,
    you can use the `lsof` command followed by the mount point.


    For example:


    ```bash

    lsof /mnt/mydrive

    ```


    This command lists all open files and processes using the specified mount point.


    ## Trivia


    The `umount` command can also be used with options such as `-l` (lazy unmount)
    which detaches the file system immediately but cleans up all references to the
    file system once it is no longer in use.


    Always ensure that you have saved your work and closed any applications using
    the file system before unmounting to avoid data corruption.


    98


    # Listing Block Devices with lsblk


    The `lsblk` command in Linux is used to list all block devices, including their
    mount points and other information, providing a clear overview of the storage
    devices connected to your system.


    Using `lsblk` helps you identify which devices are mounted and where, making it
    easier to manage your file systems.


    ```bash

    lsblk

    ```


    ## Result


    ```

    NAME    MAJ:MIN RM   SIZE RO TYPE MOUNTPOINT

    sda       8:0     0 465.8G  0 disk

    ├─sda1   8:1     0   100M  0 part /boot

    ├─sda2   8:2     0  465.7G  0 part

    sdb       8:16    0    19G  0 disk

    └─sdb1   8:17    0    19G  0 part

    ```


    The output of `lsblk` shows a tree-like structure. Each device is listed with
    its name, size, type, and mount point. The `RM` column indicates whether the device
    is removable. The `MOUNTPOINT` column shows where the device is mounted.


    The `lsblk` command can be enhanced with options like `-f` to display filesystem
    types and UUIDs, or `-o` to specify which columns to display.


    99


    # Using blkid to Find the UUID of a Partition


    `blkid` is a command-line utility that can be used to find the UUID (Universally
    Unique Identifier) of a partition.


    To identify and retrieve the UUID of a specific partition, the `blkid` command
    is used. The UUID is a unique identifier on a storage device.


    ```bash

    sudo blkid /dev/sda1

    ```


    ## Result


    ```

    /dev/sda1: UUID="12345678-9abc-def0-1234-5678abcdef0" TYPE="ext4" PARTUUID="12345678-01"

    ```


    The `blkid` command without arguments lists all block devices with their respective
    attributes, including UUIDs, types, and more. However, specifying a device, like
    `/dev/sda1`, filters the output to only show information about that partition.


    `UUID`: Universally Unique Identifier is a 128-bit label used to uniquely identify
    information in system. In the context of filesystems, it is particularly useful
    because device names like `/dev/sda1` can change between boots, while UUIDs remain
    consistent.


    `TYPE`: The type of filesystem on the partition, such as `ext4`, `swap`, etc.


    `PARTUUID`: Another identifier that is unique to a partition within the disk.


    Using UUIDs in configuration files like `/etc/fstab` is a recommended practice
    to avoid issues related to device naming.


    ## Trivia


    `blkid` works by probing the block devices and reading their metadata. It does
    not modify the device but simply reads and reports. The UUID is stored within
    the filesystem and can be manually set using `tune2fs` (for `ext2`/`ext3`/`ext4`
    filesystems) or other similar tools for different filesystem types.


    100# Understanding Swap Space as Virtual Memory


    Swap space in Linux is a designated area on the storage device that is used as
    virtual memory when the system''s physical RAM is fully utilized.


    Swap space can either be a dedicated swap partition or a swap file on an existing
    partition. When physical memory (RAM) is exhausted, the operating system can move
    inactive pages from RAM to swap space, freeing up RAM for other processes. This
    prevents the system from crashing or slowing down excessively.


    ```bash

    sudo swapon --show

    ```


    ## Result


    ```

    NAME      TYPE    SIZE USED PRIO

    /swapfile file      2G     0B   -2

    ```

