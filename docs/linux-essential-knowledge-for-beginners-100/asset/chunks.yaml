    以下示例展示了如何使用 `useradd` 命令创建一个新用户。


    ```bash

    sudo useradd -m newusername

    ```


    **结果**


    *(如果命令执行成功，不会产生输出。你可以通过检查 `/etc/passwd` 文件来验证用户的创建情况。)*


    `useradd` 命令选项包括：

    - `-m`: 此选项会在 `/home/newusername` 为新用户创建一个家目录。

