- pgno: 244
  md: '# 13 Advanced application:

    SoundLocalizer


    In this chapter, we look at the design and implementation of SoundLocalizer, a
    somewhat more complex sensor network application. SoundLocalizer implements a
    coordinated event detection system where a group of motes detect a particular
    event – a loud sound – and then communicate amongst themselves to figure out which
    mote detected the event first and is therefore presumed closest to where the event
    occurs. To ensure timely event detection, and accurately compare event detection
    times, this application needs to use some low-level interfaces from the platform’s
    hardware abstraction and hardware presentation layers (HAL, HPL, as described
    in the previous chapter). As a result, this application is not directly portable
    – we implement it here for micaz motes with an mts300 sensor board. In the design
    and implementation descriptions below, we discuss how the application and code
    are designed to simplify portability and briefly describe what would be involved
    in porting this application to another platform.


    The HAL and HPL components used by SoundLocalizer offer lower-level interfaces
    (interrupt-driven, controlled by a Resource interface, etc.) than the high-level
    HIL components we used to build the AntiTheft application of Chapter 6. As a result,
    SoundLocalizer’s implementation must use atomic statements and arbitration to
    prevent concurrency-induced problems, as we saw in Chapter 11. The complete code
    for SoundLocalizer is available from TinyOS’s contributed code directory (under
    "TinyOS Programming").


    # 13.1 SoundLocalizer design


    Figure 13.1 shows a typical setup for the SoundLocalizer application. A number
    of detector motes are placed on a surface a couple of feet apart. When the single
    coordinator mote is switched on, it sends a series of radio packets that let the
    detector motes synchronize their clocks. At a time specified by the coordinator
    mote, all detectors turn on their green LED and start listening for a loud sound
    such as a hand clap. Once such a sound is heard, the motes turn on their yellow
    LED. Finally, the motes enter a "voting" phase where only the mote with the earliest
    detection time leaves its yellow LED on. The earliest detection time should correspond
    to the mote closest to the sound, but various factors can invalidate this hypothesis,
    as we will discuss after explaining the application’s design in more detail.'
