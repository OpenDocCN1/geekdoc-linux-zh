  md: '![](img/53ede4f4266a5731b93bff15d85fa06a_138_0.png)


    # Figure 7.2 Mig and external types.


    that you can do on structures in nesC programs:


    +   - Create a new (all fields initialised to zero) structure value.

    +   - Cast part of one structure to another (e.g. cast the data[] field of serial_packet_t
    to test_serial_msg_t).

    +   - Read and write any field.

    +   - Obtain information on a field: its offset, size, signedness, etc.

    +   - Obtain the byte array representing a particular structure value.


    The classes generated by mig are subclasses of net.tinyos.message.Message, to
    simplify writing generic code that can handle multiple message layouts. The main
    public function of the Message class is to provide access to the backing array
    of a mig-generated class. The backing array is a slice of a Java byte[] array,
    specified by an offset and length. This array, offset, and length are returned
    by the following three methods:


    ```

    public byte[] dataGet();

    public int baseOffset();

    public int dataLength();

    ```


    # Listing 7.3 Backing array methods


    For instance, in Figure 7.2, the mig-generated class for serial_header_t takes
    a 7-byte slice starting at offset 0 of the 9-byte array representing the whole
    serial AM packet. The use of a slice of a byte[] array allows a mig-generated
    class to represent a value stored within another mig-generated class, supporting
    the "casting" of part of one structure to another.'
