- pgno: 81
  md: "# 4.2.1 Component naming\n\nAs we saw earlier, TinyOS makes the distinction\
    \ between components that end in C (an externally usable abstraction) and P (an\
    \ internal implementation). Once you have written the signature for an externally\
    \ usable component, changing it is very hard: any number of other components might\
    \ depend on it, and changing it will cause compilation errors. In contrast, because\
    \ an internal implementation is only wired to by higher-level configurations within\
    \ that software abstraction, their signatures are much more flexible. For instance,\
    \ changing the signature of LedsC would break almost all TinyOS code, but an internal\
    \ change to LedsP (and changing its wiring in LedsC) should not be apparent to\
    \ the user.\n\n> Programming Hint 11 IF A COMPONENT IS A USABLE ABSTRACTION BY\
    \ ITSELF, ITS NAME SHOULD END WITH C. IF IT IS INTENDED TO BE AN INTERNAL AND\
    \ PRIVATE PART OF A LARGER ABSTRACTION, ITS NAME SHOULD END WITH P. NEVER WIRE\
    \ TO P COMPONENTS FROM OUTSIDE YOUR PACKAGE (DIRECTORY).\n\nLet’s look at a complete\
    \ (but very simple) example of how all of these issues are resolved in RandomC.\n\
    \nAs shown above, RandomC maps to a specific implementation, RandomMlcgC. RandomMlcgC\
    \ is a configuration whose main purpose is to expose the random number implementation\
    \ (RandomMlcgP) and wire it to the boot sequence (we discuss component initialization\
    \ further below):\n\n```\nconfiguration RandomMlcgC {\n  provides interface Init;\n\
    \  provides interface ParameterInit<uint16_t> as SeedInit;\n  provides interface\
    \ Random;\n}\nimplementation {\n  components RandomMlcgP, MainC;\n\n  MainC.SoftwareInit\
    \ -> RandomMlcgP; // Auto-initialize\n  Init = RandomMlcgP; // Allow for re-initialization\n\
    \n  SeedInit = RandomMlcgP;\n  Random = RandomMlcgP;\n}\n```\n\nListing 4.13 The\
    \ RandomMlcgC signature\n\nRandomMlcgP is a software implementation. A platform\
    \ that has a hardware random number generator could have a different RandomMlcgP.\
    \ Because this different implementation might have a different signature – e.g.\
    \ it might require accessing registers through an abstraction layer – it might\
    \ also require a different RandomMlcgC, to resolve these dependencies and present\
    \ a complete abstraction."
  merge: -1
  img_proc: true
- pgno: 82
  md: "In short, the configuration RandomC maps the standard number generator to a\
    \ specific algorithm, RandomMlcgC. The configuration RandomMlcgC encapsulates\
    \ a specific implementation as a complete abstraction. RandomMlcgP is a software\
    \ implementation of the multiplicative linear congruential generator. Similarly,\
    \ there is also a RandomLfsrC, which is a linear feed shift register random number\
    \ generator. Just like RandomMlcgC, RandomLfsrC is a configuration that exports\
    \ the interfaces of RandomLfsrP and wires it to the boot sequence. This hierarchy\
    \ of names means that a system can wire to a specific random number generator\
    \ if it cares which one it uses, or wire to the general one that TinyOS provides\
    \ (RandomC). An application can change what the default random number generator\
    \ is by defining its own RandomC, which maps to a different algorithm. The TinyOS\
    \ developers can change and improve RandomMlcgP without worrying about breaking\
    \ application code. Finally, a platform implementer can replace RandomMlcgC with\
    \ an optimized, platform-specific version as long as it has the same signature\
    \ as RandomMlcgC.\n\n# 4.2.2 Component initialization\n\nRandomMlcgP provides\
    \ the Init interface to seed the random number generator with the node’s identifier\
    \ (TOS_NODE_ID). TOS_NODE_ID is a global constant in the TinyOS program. The TinyOS\
    \ tutorials describe how to set it when you install a program on a mote. SeedInit\
    \ starts the generator with a specific seed:\n\n```\nmodule RandomMlcgP {\n  provides\
    \ interface Init;\n  provides interface ParameterInit<uint16_t> as SeedInit;\n\
    \  provides interface Random;\n}\nimplementation {\n  uint32_t seed;\n\n  /* Initialize\
    \ the seed from the ID of the node */\n  command error_t Init.init() {\n    seed\
    \ = (uint32_t)(TOS_NODE_ID + 1);\n    return SUCCESS;\n  }\n\n  /* Initialize\
    \ with 16-bit seed */\n  command error_t SeedInit.init(uint16_t s) {\n    seed\
    \ = (uint32_t)(s + 1);\n    return SUCCESS;\n  }\n  ...\n}\n```"
