  md: "# 6.2.4 Stream sampling\n\nThe ReadStream interface is more complex than Read,\
    \ in part because it needs to support motes with limited RAM: some applications\
    \ need to sample more data at once than actually fits in memory. However, simple\
    \ uses of ReadStream remain quite simple, as we will see by building an alternate\
    \ theft-detection mechanism to DarkC. First, let’s see ReadStream:\n\n```\ninterface\
    \ ReadStream<val_t> {\n  command error_t postBuffer(val_t* buf, uint16_t count);\n\
    \  command error_t read(uint32_t usPeriod);\n  event void bufferDone(error_t result,\
    \ val_t* buf, uint16_t count);\n  event void readDone(error_t result, uint32_t\
    \ usActualPeriod);\n}\n```\n\nListing 6.10 ReadStream Interface\n\nLike Read,\
    \ ReadStream is a typed interface whose val_t parameter specifies the type of\
    \ individual samples. Before sampling starts, one or more buffers (arrays of val_t)\
    \ must be posted with the postBuffer command. Sampling starts once the read command\
    \ is called (usPeriod is the sampling period in microseconds), and continues until\
    \ all posted buffers are full or an error occurs, at which point readDone is signaled.\
    \ It is also possible to post new buffers during sampling – this is often done\
    \ in the bufferDone event which is signaled as each buffer is filled up. By using\
    \ two (or more) buffers, and processing (e.g. computing statistics, or writing\
    \ to flash) and reposting each buffer in bufferDone, a mote can sample continuously\
    \ more data than can fit in RAM.\n\nThe simplest way to use ReadStream is to declare\
    \ an array holding N sample values, post the buffer and call read. The samples\
    \ are available once readDone is signaled. We use this approach in MovingC, an\
    \ alternate component to DarkC that detects using an accelerometer to detect movement\
    \ – it’s hard to steal something without moving it. MovingC samples acceleration\
    \ at 100 Hz for 1/10 s, and reports theft when the variance of the sample is above\
    \ a small threshold (picked experimentally):\n\n```\nmodule MovingC {\n  uses\
    \ {\n    interface Boot;\n    interface Leds;\n    interface Timer<TMilli> as\
    \ TheftTimer;\n    interface ReadStream<uint16_t> as Accel;\n  }\n}\n\nimplementation\
    \ {\n  enum {\n    ACCEL_INTERVAL = 256, /* Checking interval */\n    ACCEL_PERIOD\
    \ = 10000, /* us -> 100Hz */\n    ACCEL_NSAMPLES = 10, /* 10 samples * 100Hz ->\
    \ 0.1s */\n    ACCEL_VARIANCE = 4; /* Determined experimentally */\n```"
