- pgno: 94
  md: '# 5 Execution model


    This chapter presents TinyOS’s execution model, which is based on split-phase
    operations, run-to-completion tasks and interrupt handlers. Chapter 3 introduced
    components and modules, Chapter 4 introduced how to connect components together
    through wiring. This chapter goes into how these components execute, and how you
    can manage the concurrency between them in order to keep a system responsive.
    This chapter focuses on tasks, the basic concurrency mechanism in nesC and TinyOS.
    We defer discussion of concurrency issues relating to interrupt handlers and resource
    sharing to Chapter 11, as these typically only arise in very high-performance
    applications and low-level drivers.


    # 5.1 Overview


    As we saw in Section 3.4, all TinyOS I/O (and long-running) operations are split-phase,
    avoiding the need for threads and allowing TinyOS programs to execute on a single
    stack. In place of threads, all code in a TinyOS program is executed either by
    a task or an interrupt handler. A task is in effect a lightweight deferred procedure
    call: a task can be posted at anytime and posted tasks are executed later, one-at-a-time,
    by the TinyOS scheduler. Interrupts, in contrast can occur at any time, interrupting
    tasks or other interrupt handlers (except when interrupts are disabled).


    While a task or interrupt handler is declared within a particular module, its
    execution may cross component boundaries when it calls a command or signals an
    event (Figure 5.1). As a result, it isn’t always immediately clear whether a piece
    of code is only executed by tasks or if it can also be executed from an interrupt
    handler. Because code that can be executed by an interrupt handler has to be much
    more aware of concurrency issues (as it may be called at any time), nesC distinguishes
    between synchronous (sync) code that may only be executed by tasks and asynchronous
    (async) code that may be executed by both tasks and interrupt handlers, and requires
    that asynchronous commands or events be declared with the async keyword (both
    in interfaces and in the actual module implementation).


    Writing components that implement async functions requires a few advanced nesC
    features, and tasks and synchronous code are sufficient for many applications
    so we defer further discussion of asynchronous code and interrupt handlers to
    Chapter 11.'
  merge: -1
  img_proc: true
- pgno: 95
  md: "![](img/53ede4f4266a5731b93bff15d85fa06a_95_0.png)\n\n**Figure 5.1** TinyOS\
    \ execution model: both tasks (full lines) and interrupt handlers (dotted lines)\
    \ cross component boundaries.\n\n# 5.2 Tasks\n\nA task is a simple deferred computation\
    \ mechanism provided by nesC. Tasks have a return value of void, take no parameters\
    \ (this keeps the task scheduler very simple) and are declared with the **task**\
    \ keyword:\n\n```\n```c\ntask void setupTask() {\n    // task code\n}\n```\n```\n\
    \nUsing the **post** keyword schedules a task for later execution:\n\n```\n```c\n\
    event void Boot.booted() {\n    call Timer.startPeriodic(1024);\n    post setupTask();\n\
    }\n```\n```\n\nIn the above example, once TinyOS completes the boot sequence (signals\
    \ Boot.booted to all components), it will run setupTask.\n\nTasks are like any\
    \ other module code. They can access variables, call commands, signal events,\
    \ and invoke internal or global C functions. The post operator is like calling\
    \ a function: it has a return value of error_t. Posting a task always returns\
    \ SUCCESS unless the task is already pending. Put another way, a component cannot\
    \ post multiple copies of the same task to run; however, once a task has started\
