- pgno: 259
  md: 'In TinyOS, an I²C bus is normally accessed via a shared driver, so I²C bus
    users first request access via a Resource interface (named I2CResource in MicrophoneC).
    The I2C Packet interface provides commands for I²C bus masters to send read and
    write packets (I2CPacket takes an addr_size type argument to distinguish I²C implementations
    with 7 vs 15-bit bus addresses):


    ```

    interface I2CPacket<addr_size> {

    async command error_t read(I2c_flags_t flags, uint16_t addr, uint8_t length, uint8_t*
    data);

    async event void readDone(error_t error, uint16_t addr, uint8_t length, uint8_t*
    data);


    async command error_t write(I2c_flags_t flags, uint16_t addr, uint8_t length,
    uint8_t* data);

    async event void writeDone(error_t error, uint16_t addr, uint8_t length, uint8_t*
    data);

    }

    ```


    Listing 13.7 The I2CPacket interface for bus masters


    While MicrophoneC is quite portable, the wiring that connects it to the specific
    hardware resources used to access the microphone is necessarily platform-specific:


    ```

    components MicaBusC, new Atm128I2CMasterC() as I2CPot;

    MicrophoneC.MicPower -> MicaBusC.PW3;

    MicrophoneC.MicMuxSel -> MicaBusC.PW6;

    MicrophoneC.I2CResource -> I2CPot;

    MicrophoneC.I2CPacket -> I2CPot;

    ```


    Atm128I2CMasterC is the component that provides access to the ATmega128''s I²C
    bus. MicaBusC abstracts the differences between the various mica-family motes
    that share the same 51-pin sensor board connector, making it easier to write sensor
    board implementations portable to all mica-family motes.


    Powering off the microphone is much simpler. The MicPower I/O pin just needs to
    be cleared and made an input:


    ```

    command error_t SplitControl.stop() {

    //Power off microphone

    call MicPower.clr();

    call MicPower.makeInput();


    //And let our caller know we''re done-post a task as one should not

    //signal events directly from commands

    post stopDone();

    return SUCCESS;

    }


    task void stopDone() {

    signal SplitControl.stopDone(SUCCESS);

    }

    ```'
