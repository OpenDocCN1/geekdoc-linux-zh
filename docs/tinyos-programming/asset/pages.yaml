- pgno: 143
  md: 'A packet source has the form connection@arguments, where connection is a word
    that specifies the kind of connection (serial for direct serial connections, sf
    for serial forwarders, etc.) and arguments is the arguments needed by the connection
    (e.g. serial port device name and baud rate as in serial@COM1:115200). Executing


    ```

    java net.tinyos.packet.BuildSource

    ```


    prints a summary of all packet sources and their arguments. As mentioned above,
    most Java programs have some way of specifying the packet source that should be
    used to connect to the base station mote, e.g. an environment variable (usually
    MOTECOM), a command-line argument, or a field in a GUI.


    One of the more important packet sources is the serial forwarder. The serial forwarder
    is a Java program³ that connects to a mote and forwards packets to and from its
    (multiple) clients. These clients connect to the serial forwarder via TCP/IP.
    Using a serial forwarder serves multiple purposes:


    +   - Allow remote access to a base station mote, so that, e.g. a GUI can access
    a sensor network from a remote location.

    +   - Allow both a regular application and a debugging system to talk to the same
    base station mote. For instance, it’s often useful to simply display all packets
    received from a mote (using the net.tinyos.tools.Listen Java program) without
    having to change your code.

    +   - Split your application into multiple independent parts, each of which can
    talk to the mote. For instance, the TestSerial.java application could be split
    into separate receive and transmit applications which would talk independently
    to the mote via a serial forwarder.


    # 7.5 Example: simple reliable transmission


    As we saw at the beginning of this chapter, the basic mote-PC communication infrastructure
    is unreliable: packets are checked for integrity but there is no retransmission
    in case of failure. In this section, we show how to build a simple reliable and
    reusable message transmission layer, and use it to build a reliable version of
    the TestSerial application. The focus of this section is on showing how to build
    a generic, reusable mote communication layer in Java.


    The code for this simple reliable transmission protocol can be found in the “TinyOS
    Programming” section of TinyOS’s contributed code directory (Section 1.5), under
    the name ReliableSerial. This directory contains the Java (ReliableMoteIF class)
    and nesC (ReliableSerialC component) implementations of this protocol, and ReliableTestSerial,
    a version of the nesC TestSerial application built over ReliableSerialC.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# 7.5.1 Reliable transmission protocol


    The reliable message transmission protocol is very simple. Messages are sent with
    a “cookie” (changed on every transmission) and are repeatedly sent (after a timeout)
    until an acknowledgement with the same cookie is received. Transmissions are not
    overlapped: transmission of message2 does not start until message1 has been acknowledged.


    On the reception side, duplicates (detected by the presence of an identical cookie)
    are suppressed before passing the message on to the upper layer. However, even
    duplicate messages are acknowledged, as it is possible that the earlier acknowledgements
    were lost.


    In concrete terms, two kinds of packets are used by this protocol: a message transmission
    packet (reliable_msg_t) and an acknowledgement packet (ack_msg_t). These packets
    are shown in Figure 7.3, along with the TestSerial messages that are transmitted
    by the ReliableTestSerial application.


    # 7.5.2 Reliable transmission in Java


    The ReliableMoteIF class contains the Java implementation of the simple reliable
    message transmission protocol. It uses mig to generate AckMsg and ReliableMsg
    so that it can build and decode ack_msg_t and reliable_msg_t packets respectively.
    ReliableMoteIF uses nec to access the retransmission timeout (ACK_MSG_TIMEOUT)
    specified in the nesC implementation (the ReliableSerialC component).


    This class is implementing a generic reusable layer, so should be capable of transmitting
    and receiving an arbitrary message whose layout is specified by a mig-generated
    class. As a result, the interface is so similar to that of MoteIF that we simply
    make it a subclass of MoteIF. We first show the transmission side:


    ```

    import net.tinyos.packet.*;

    import net.tinyos.message.*;

    import java.io.*;

    ```


    ![](img/53ede4f4266a5731b93bff15d85fa06a_144_0.png)


    Figure 7.3 Reliable transmission packet layouts.'
  merge: -1
  img_proc: true
- pgno: 145
  md: "```\n```java\nclass ReliableMotET extends MotET {\n    /* Build an object for\
    \ performing reliable transmission via `base` */\n    public ReliableMotET(PhoenixSource\
    \ base) {\n        super(base);\n        /* Register handler (`ackMsgReceived`\
    \ method below) for receiving acks */\n        super.registerListener(\n     \
    \       (new AckMsg(), new MessageListener() {\n                public void messageReceived(int\
    \ to, Message m) {\n                    ackMsgReceived((AckMsg)m);\n         \
    \       }\n            })\n        );\n    }\n\n    /* Send side */\n    /* ---------\
    \ */\n    private Object ackLock = new Object(); /* For synchronization with ack\
    \ handler */\n    private short sendCookie = 1; /* Next cookie to use in transmission\
    \ */\n    private boolean acked; /* Set by ack handler when ack received */\n\
    \    private final static int offsetUserData = ReliableMsg.offset_data();\n\n\
    \    /* Send message `m` reliably with destination `to` */\n    public void send(int\
    \ to, Message m) throws IOException {\n        synchronized (ackLock) {\n    \
    \        /* Build a reliable_msg_t packet with the current cookie and the payload\
    \ in m,\n             * total packet size is m.dataLength() + offsetUserData */\n\
    \            ReliableMsg rmsg = new ReliableMsg(m.dataLength() + offsetUserData);\n\
    \            rmsg.set_cookie(sendCookie);\n            System.arraycopy(m.dataGet(),\
    \ m.baseOffset(),\n                             rmsg.dataGet(), offsetUserData,\n\
    \                             m.dataLength());\n\n            /* Repeatedly transmit\
    \ `rmsg` until the ack handler tells us an ack is received. */\n            acked\
    \ = false;\n            for (;;) {\n                super.send(to, rmsg);\n  \
    \              try {\n                    ackLock.wait(RelConstants.ACK_TIMEOUT);\n\
    \                }\n                catch (InterruptedException e) {\n       \
    \             if (acked)\n                        break;\n                   \
    \ System.err.printf(\"retry\\\\n\");\n                }\n            }\n\n   \
    \         /* Pick a new cookie for the next transmission */\n            sendCookie\
    \ = (short)((sendCookie + 3) & 0xff);\n        }\n    }\n}\n```\n```"
