    \ &msg, sizeof *payload);\n/* Stop sending once the event detection time approaches\
    \ */\nif (++count == SAMPLE_TIME)\n    call Timer.stop();\n}\n```\n\nThe detector\
    \ code is significantly more complex. It is contained in five components (Figure\
    \ 13.3):\n\n+   - The SynchronizerC module contains the time synchronization algorithm,\
    \ voting code and the overall detector control logic.\n+   - The DetectorC module\
    \ encapsulates all sensor-specific code, including switching the sensor on and\
    \ off, and detecting loud sounds.\n+   - The MicrophoneC module contains the low-level\
    \ code for switching the mts300 microphone on and off.\n+   - StatsC is a simple\
    \ statistics module that provides a least-squares linear regression implementation\
    \ (the code is a standard least-squares implementation and not shown in this book).\n\
    +   - The DetectorAppC configuration wires all the modules to each other and to\
    \ the various system services.\n\nThe rest of this chapter describes the SynchronizerC,\
    \ DetectorC, and MicrophoneC implementations in detail. These components are not\
    \ portable, but the whole application is designed so that it can reasonably easily\
    \ be ported to another mote or to another sensor (with different event detection\
    \ logic).\n\n![](img/53ede4f4266a5731b93bff15d85fa06a_247_0.png)\n\nFigure 13.3\
    \ Detector mote components and hardware. Dashed lines show the hardware resources\
    \ used by each component."
