  md: "![](img/53ede4f4266a5731b93bff15d85fa06a_127_0.png)\n\n# Figure 6.4 ConfigStorage:\
    \ writes and commits.\n\ncontents. The purpose here is to guarantee that configuration\
    \ data is not lost: if a mote crashes during configuration updates, the data last\
    \ committed is still present and uncorrupted. Reads always read the last-committed\
    \ data, while writes update the new copy – you cannot see the data that has been\
    \ written until after a successful commit.\n\nHowever, writes are still updates:\
    \ if a configuration volume contains 10 bytes, and bytes 2 and 3 are updated with\
    \ a write and the volume is then committed, the new contents are bytes 0–1 and\
    \ 4–9 from before the write, and bytes 2–3 from the write, as shown in Figure\
    \ 6.4. Because configuration volumes must store multiple copies of data to provide\
    \ reliability, the actual available size is less than the space reserved for them\
    \ in the volumes file. The actually available size is returned by the getSize\
    \ command.\n\nWhile configuration volumes aim to prevent data loss, there are\
    \ still two cases where they may not contain valid data: when the volume is first\
    \ created,³ or if the flash contents get corrupted by some external physical process\
    \ (hopefully unlikely). The valid command can be used to find out whether a configuration\
    \ volume contains valid data.\n\nPutting all this together, adapting MovingC to\
    \ have permanent settings is not too hard: the configuration volume is mounted\
    \ and read at boot time, and new settings are saved when they are received. The\
    \ following simplified excerpts show the basic boot-time logic, with error-checking\
    \ removed for simplicity:\n\n```\nuses interface Mount;\nuses interface ConfigStorage;\n\
    ...\nsettings_t settings;\n\nevent void Boot.booted() {\n    settings.accelVariance\
    \ = ACCEL_VARIANCE; // default settings\n    settings.accelInterval = ACCEL_INTERVAL;\n\
    \    call Mount.mount();\n}\n```\n\n> ³ This really means: when this division\
    \ of the flash is first used on this particular mote – there is no actual \"format\"\
    -like operation."
