- pgno: 220
  md: "# 11.1.4 Managing state transitions\n\nThe most basic use of atomic statements\
    \ is for state transitions within a component. Usually, a state transition has\
    \ two parts, both of which are determined by the existing state and the call:\
    \ the first is changing to a new state, the second is taking some kind of action.\
    \ Looking at the AMStandard example once again:\n\n```\nif (!state) {\n  state\
    \ = TRUE;\n  // send a packet\n  return SUCCESS;\n}\nelse {\n  return FAIL;\n\
    }\n```\n\nIf state is touched by an async function, then you need to make the\
    \ state transition atomic. But you don’t want to make the entire block an atomic\
    \ statement, as sending a packet could take a long enough time that it causes\
    \ the system to miss an interrupt. So the code does something like this:\n\n```\n\
    uint8_t oldState;\natomic {\n  oldState = state;\n  state = TRUE;\n}\nif (!oldState)\
    \ {\n  //send a packet\n  return SUCCESS;\n}\nelse {\n  return FAIL;\n}\n```\n\
    \nIf state were already true, it doesn’t hurt to just set it true. This takes\
    \ fewer CPU cycles than the somewhat redundant statement of\n\n```\nif {state\
    \ != TRUE} {state = TRUE;}\n```\n\nIn this example, the state transition occurs\
    \ in the atomic block, but then the actual processing occurs outside it, based\
    \ on the state the component started in.\n\n# 11.1.5 Example: CC2420ControlP\n\
    \nLet’s look at a real example. This component is CC2420ControlP, which is part\
    \ of the CC2420 radio stack. CC2420ControlP is responsible for configuring the\
    \ radio’s various I/O options, as well as turning it on and off. Turning the CC2420\
    \ radio"
  merge: -1
  img_proc: true
