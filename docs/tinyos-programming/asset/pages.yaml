- pgno: 159
  md: "While this works, it is somewhat painful and leads to a lot of repeated code.\
    \ Every instance needs to have its own implementation. That is, there will be\
    \ 100 different startPeriodic functions, even though they’re almost completely\
    \ identical. Another approach could be to have a call parameter to the Timer interface\
    \ that specifies which timer is being changed, sort of like a file descriptor\
    \ in POSIX file system calls. In this case, HilTimerMilliC would look like this\n\
    \n```\nconfiguration HilTimerMilliC {\n  provides interface Timer;\n}\n```\n\n\
    Listing 8.9 Timers with a single interface\n\nComponents that use timers would\
    \ have some way of generating unique timer identifiers, and would pass them in\
    \ every call:\n\n```\ncall Timer.startPeriodic(timerDescriptor, 1024); // Fire\
    \ at 1Hz\n```\n\nWhile this approach works – it doesn’t lead to multiple implementations\
    \ – passing the parameter is generally unnecessary, in that components generally\
    \ allocate some number of timers and then only use those timers. That is, the\
    \ set of timers a component uses – and the size of the set – are generally known\
    \ at compile-time. Making the caller pass the parameter at run-time is therefore\
    \ unnecessary, and could possibly introduce bugs (e.g. if the wrong descriptor\
    \ is passed).\n\nThere are other situations when a component wants to provide\
    \ a large number of interfaces, such as communication. Active messages have an\
    \ 8-bit type field, which is essentially a protocol identifier (Section 6.3).\
    \ In the Internet, the valid protocol identifiers for IP are well specified.²\
    \ and many port numbers for TCP are well established. When a node receives an\
    \ IP packet with protocol identifier 6, it knows that this is a TCP packet and\
    \ dispatches it to the TCP stack. Active messages need to perform a similar function,\
    \ albeit without the standardization of IANA: a network protocol needs to be able\
    \ to register to send and receive certain AM types. Like timers, with basic interfaces\
    \ there are two ways to approach this: code redundancy or run-time parameters.\
    \ That is, to handle AM type 15, you could either have a packet layer providing\
    \ 256 named Send interfaces:\n\n```\ncomponents NetworkProtocolP, PacketLayerC;\n\
    NetworkProtocolP.Send -> PacketLayerC.Send15;\n```"
  merge: -1
  img_proc: true
- pgno: 160
  md: "the code text of one of them to read \"Timer4.\" One way to manage the namespace\
    \ would be to have components leave their timers unwired and then expect the application\
    \ to resolve all of them. But this places a large burden on an application developer.\
    \ For example, a small application that builds on top of a lot of large libraries\
    \ might have to wire eight different timers. Additionally, this approach leads\
    \ to system components that are not self-contained, working abstractions: they\
    \ have remaining dependencies that an application developer needs to resolve.\n\
    \nThe second approach (passing extra arguments) is superior to the first at first\
    \ glance, but it turns out to have even more significant problems, especially\
    \ in the context of nesC's component model. First, in many cases the identifier\
    \ is known at compile-time. Requiring the caller to pass it as a run-time parameter\
    \ is unnecessary and is a possible source of bugs. Second, and more importantly,\
    \ it pushes identifier management into the caller. For example, returning again\
    \ to timers:\n\n```\ncall Timer.startPeriodic(timerDescriptor, 1024); // Fire\
    \ at 1Hz\n```\n\nFrom the calling component's perspective, it doesn't care which\
    \ timer it's using. All it cares is that it has its own timer. Making the identifier\
    \ part of the call forces the module to know (and manage) the identifier name.\
    \ The third and largest problem, however, is not with calls out to other components\
    \ but with calls in from other components. In Timer, for example, how does the\
    \ timer service signal a fired() event to the correct component? Because the identifier\
    \ is a run-time parameter, the only way is for Timer.fired() to fan-out to all\
    \ timers, and have them all check the identifier.\n\n# 8.3.1 Parameterized interfaces\
    \ and configurations\n\nTo support abstractions that provide sets of interfaces,\
    \ nesC has parameterized interfaces. A parameterized interface is essentially\
    \ an array of interfaces, and the array index is the parameter. For example, this\
    \ is the signature of HiTimerMilliC:\n\n```\nconfiguration HiTimerMilliC {\n \
    \ provides interface Init;\n  provides interface Timer<TMilli> as TimerMilli[uint8_t\
    \ num];\n  provides interface LocalTime<TMilli>;\n}\n```\n\nListing 8.10 HiTimerMilliC\
    \ signature\n\nHiTimerMilliC is a platform-specific configuration that presents\
    \ a millisecond granularity timer stack. By providing 256 separate instances of\
    \ Timer, HiTimerMilliC can support up to 256 independent timers. Calling Timer.startPeriodic\
    \ on one interface instance will cause that instance to signal Timer.fired events.\
    \ Normally, components don't wire directly to HiTimerMilliC. Instead, they use\
    \ TimerMilliC, which presents a simpler interface (see Section 6.1)."
