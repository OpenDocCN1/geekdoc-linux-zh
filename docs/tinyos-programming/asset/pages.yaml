    The TinyOS timers use 32-bit numbers to represent time. As a result, the millisecond
    timers (TMilli) wrap around every ~48.5 days, and a microsecond timer wraps around
    nearly every hour. These times are shorter than most expected sensor network deployments,
    so the timers are designed to work correctly when time wraps around. The main
    user-visible effect of this is that the t0 argument to startOneShotAt and startPeriodicAt
    is assumed to always represent a time in the past. As a result, values numerically
    greater than the current time actually represent a time from before the last wrap
    around.


    A final note: on typical sensor node platforms, the millisecond timer is based
    on a reasonably precise 32 768 Hz crystal. However, this does not mean that timings
    are perfectly accurate. Different nodes will have slightly different crystal frequencies,
    which will drift due to temperature effects. If you need time to be really accurate
    and/or synchronized across nodes, you will need to provide some form of networked
    time synchronization.


