    \ theft {\n  nx_uint16_t who;\n} theft_t;\n...\n#endif\n```\n\nThe AMSend (\"\
    active message send\") interface contains all the commands needed to fill-in and\
    \ send packets:\n\n```\ninterface AMSend {\n  command error_t send(am_addr_t addr,\
    \ message_t* msg, uint8_t len);\n  event void sendDone(message_t* msg, error_t\
    \ error);\n  command error_t cancel(message_t* msg);\n\n  command uint8_t maxPayloadLength();\n\
    \  command void* getPayload(message_t* msg, uint8_t len);\n}\n```\n\nListing 6.12\
