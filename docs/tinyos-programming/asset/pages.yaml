    \ an interrupt wakes up the processor. If the interrupt handler posted one or\
    \ more tasks, TinyOS runs tasks until there are no more left, then goes back to\
    \ sleep. Since tasks are run one by one, they can’t preempt one another, and the\
    \ next task doesn’t execute until the current one completes. This property greatly\
    \ simplifies writing tasks, and hence all sync code, as you don’t need any locks\
    \ or other mechanisms to protect shared variables. A sync routine can assume it\
    \ has complete control over the processor until it completes.\n\nAs an example,\
    \ let’s look at the BaseStation application. BaseStation is a UART/radio bridge:\
    \ it forwards all radio packets it receives to the UART, and forwards all UART\
    \ packets it receives to the radio. Because the radio and UART might have different\
    \ throughputs, BaseStation introduces a send queue in each direction. When it\
    \ receives a radio packet, it puts the packet on the UART send queue. When it\
    \ receives a UART packet, it puts the packet on the radio send queue.\n\nBaseStationP,\
    \ the module that implements the BaseStation application, uses tasks to pull packets\
    \ off the queues and send them. The receive handlers put packets on the queue\
    \ and post the send task if the application is not already sending. Here is pseudocode\
    \ of the logic:\n\n```\n```text\non receive packet:\n    if queue not full:\n\
    \        put packet on queue\n        if no send pending:\n            post send\
    \ task\n```\n```\n\nTasks cannot take parameters. If a component needs to pass\
    \ data to a task, it has to do so by storing it in a component variable. For example,\
    \ BaseStationP cannot pass a pointer to the message to send as a parameter to\
    \ sendTask. Instead, sendTask must pull the packet off of the queue directly."
