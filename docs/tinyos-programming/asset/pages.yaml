- pgno: 251
  md: "```\nevent void RadioControl.stopDone(error_t error) {\n  // Once the radio\
    \ is stopped, schedule event detection\n  call Detector.start(t0 < TIME_SHIFT,\
    \ localSampleTime <= TIME_SHIFT);\n}\n```\n\nSoundLocalizer switches the radio\
    \ off in scheduleSampling, as radio activity could cause significant jitter in\
    \ event detection. For instance, if an unrelated application uses the same radio\
    \ channel as SoundLocalizer, then SoundLocalizer will receive and process (and\
    \ hopefully ignore) this other application’s messages. However, all this work\
    \ will impact event detection, possibly causing some motes to detect a loud sound\
    \ late, or even to miss a loud sound completely.\n\nActual event detection is\
    \ implemented in the DetectorC component described below. SynchronizerC and DetectorC\
    \ coordinate via the Detector interface:\n\n```\ninterface Detector {\n  command\
    \ void start(uint32_t t0, uint32_t dt);\n  async event void detected();\n  event\
    \ void done(error_t ok);\n}\n```\n\nThe start command requests event detection\
    \ for time t0+dt – this way of specifying a time is consistent with the deadline-based\
    \ approach used by TinyOS’s timing interfaces (see Section 6.1.1). When DetectorC\
    \ detects a loud sound, it immediately signals the detected event. To maximize\
    \ responsiveness and minimize jitter, DetectorC’s event detection happens in an\
    \ interrupt handler, so the detected event is asynchronous. DetectorC signals\
    \ the done event (in task context, with SUCCESS as argument) after it has finished\
    \ cleaning up after event detection. Also, if an error occurs, DetectorC will\
    \ signal done directly (with a FAIL argument).\n\nSynchronizerC implements handlers\
    \ for the detected and done events:\n\n```\nnorace uint32_t localDetectTime;\n\
    uint32_t detectTime;\n\nasync event void Detector.detected() {\n  localDetectTime\
    \ = now();\n}\n\nevent void Detector.done(error_t ok) {\n  // If event detection\
    \ was successful, convert local detection time to\n  // a global time, and start\
    \ broadcasting our detection reports\n  if (ok == SUCCESS)\n  {\n    detectTime\
    \ = 100000 * call Stats.estimatetX(localDetectTime - t0);\n    call VotingTimer.startPeriodic(VOTING_INTERVAL);\n\
    \    call Leds.led2On(); // Assume we're closest\n  }\n  call RadioControl.start();\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 252
  md: "The only task of the asynchronous detected event is to store the precise local\
    \ event detection time in the localDetectTime variable. Because detected runs\
    \ in interrupt context, there might be a race on the write to the shared localDetectTime\
    \ variable. However, the structure of SynchronizerC and DetectorC guarantees that\
    \ the detected event is signaled before the done event which contains the only\
    \ other access to localDetectTime. Thus, no data-race is possible on localDetectTime.\
    \ To avoid warnings from the nesC compiler about possible races on localDetectTime\
    \ we add a norace qualifier to localDetectTime’s declaration.¹\n\nOnce event detection\
    \ is complete and the done event is signaled, SynchronizerC converts the local\
    \ event detection time (localDetectTime) into a global event detection time (detectTime)\
    \ using the Stats interface. Detection times are scaled by a factor of 100 000\
    \ to allow for precise comparisons of the detection time (detectTime is an unsigned\
    \ integer). SynchronizerC also turns on the yellow LED to let the user know that\
    \ a loud sound was detected, and starts the voting timer which will broadcast\
    \ a mote’s detection time. These broadcasts contain the mote’s identity and global\
    \ detection time:\n\n```\ntypedef nx_struct detection_msg {\n  nx_uint16_t id;\n\
    \  nx_uint32_t time;\n} detection_msg_t;\n```\n\nThe broadcast and \"voting\"\
    \ code is very straightforward (error-checking elided below for simplicity):\n\
    \n```\nmessage_t msg;\n\nevent void VotingTimer.fired() {\n  // Simply build and\
    \ broadcast a detection message\n  detection_msg_t *dmsg = call SDectection.getPayload(&msg,\
    \ sizeof *dmsg);\n\n  dmsg->id = TOS_NODE_ID;\n  dmsg->time = detectTime;\n  call\
    \ SDectection.send(AM_BROADCAST_ADDR, &msg, sizeof *dmsg);\n}\n```\n\n```\nevent\
    \ message_t *RDetection.receive(message_t *m, void* payload, uint8_t len){\n \
    \ detection_msg_t *dmsg = payload;\n\n  // Voting logic: if received message indicates\
    \ global detection time\n  // earlier than ours, switch off our LED and stop broadcasting\n\
    \  if (dmsg->time < detectTime)\n  {\n    call Leds.led0Off();\n    call VotingTimer.stop();\n\
    \  }\n  return m;\n}\n```\n\n> ¹ norace should be used with care, only when you\
    \ are very sure that there is indeed no possible race."
  merge: -1
