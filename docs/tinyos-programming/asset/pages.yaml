- pgno: 255
  md: "(assuming that they don’t have overlapping resource requirements). The completion\
    \ of the microphone power up and A/D converter request is tracked by the started\
    \ and granted boolean variables respectively. Then Alarm.fired checks that these\
    \ two booleans are true before initiating event detection. If they are not, DetectorC\
    \ reports a failed detection back to SynchronizerC. The fired event runs in an\
    \ interrupt context, thus there is a potential data race between the accesses\
    \ to the started and granted variables in Alarm.fired, AdcResource.granted, and\
    \ Microphone.startDone. This race risk is real (unlike that for localDetectTime\
    \ in SynchronizerC), so DetectorC uses nesC’s atomic statements to protect the\
    \ reads and writes of granted and started.\n\nTo precisely detect when the loud\
    \ sound occurs, DetectorC should sample the microphone at the highest possible\
    \ rate. Furthermore, there should be the minimal amount of jitter between the\
    \ time the microcontroller acquires the A/D sample and when DetectorC checks that\
    \ this A/D value is above the “loud sound” threshold: adding, e.g., a random delay\
    \ of 50–100 µs between sample acquisition and the threshold test adds an extra\
    \ 1.7cm (50 µs · 340 m/s) of imprecision to SoundLocalizer. Both of these factors\
    \ argue against using the high-level Read interface to sensors (Section 6.2.1):\
    \ MicC (the mts300 sensorboard’s microphone component) provides a Read that has\
    \ a fairly high overhead, and which does a fair bit of processing after a sample\
    \ has been acquired.\n\nIt would probably be possible to implement DetectorC using\
    \ the ReadStream interface (Section 6.2.4) provided by the MicStreamC component.\
    \ This interface offers high-rate low-jitter sampling, but is relatively complex\
    \ to use and does not offer a direct indication of the exact time at which each\
    \ sample was acquired. Instead, DetectorC uses Atm128AdcC, TinyOS’s HAL A/D converter\
    \ component for the ATmega128. Atm128AdcC is a shared driver (access is controlled\
    \ by a Resource interface) and offers the following interface for low-level A/D\
    \ access:\n\n```\ninterface Atm128AdcSingle {\n  async command bool getData(uint8_t\
    \ channel, uint8_t refVoltage,\n    bool leftJustify, uint8_t prescaler);\n  async\
    \ event void dataReady(uint16_t data, bool precise);\n  async command bool cancel();\n\
    }\n```\n\nListing 13.5 Atm128AdcSingle: low-level single-sample ATmega128 A/D\
    \ converter interface\n\nThis interface allows A/D conversion requests to be made\
    \ from interrupt handlers (getData is async), and signals sample acquisition (dataReady)\
    \ directly from the ATmega128’s A/D conversion interrupt handler. These two facts\
    \ allow DetectorC to sample at a very high rate and with very low event detection\
    \ jitter. Furthermore, the getData command exposes a prescaler parameter (not\
    \ available via the Read or ReadStream interfaces) that adjusts the time it takes\
    \ to perform an A/D conversion. Reducing the A/D conversion time reduces the precision\
    \ of the A/D conversion, so most high-level users (including MicC and MicStreamC)\
    \ leave the prescaler at the setting that guarantees full A/D conversion precision\
    \ – at this setting a conversion takes 113 µs on a micaz mote. However, detecting\
    \ when a value goes above a threshold does not require the full A/D precision\
    \ (only the high-order bits are really relevant), so"
  merge: -1
  img_proc: true
- pgno: 256
  md: "DetectorC sets the prescaler to a value (ATM128_ADC_PRESCALE_16) that reduces\
    \ A/D conversion time to 28 µs. This potentially improves SoundLocalizer’s precision\
    \ by 2.9 cm (85 µs · 340 m/s).\n\nThe resulting “loud sound” detection code is\
    \ simple, though very specific to the micaz platform and the mts300 microphone:\n\
    \n```\nmodule DetectorC {\n  uses interface Atm128AdcSingle;\n  ...\n}\n\nimplementation\
    \ {\n  // The threshold for a loud sound (determined experimentally)\n  enum {\
    \ THRESHOLD = 768 };\n\n  void detect() {\n    call Atm128AdcSingle.getData(...\
    \ microphone A/D channel ...,\n                          ATM128_ADC_VREF_OPF,\
    \ FALSE,\n                          ATM128_ADC_PRESCALE_16);\n  }\n\n  async event\
    \ void Atm128AdcSingle.dataReady(uint16_t data, bool precise){\n    /* If we’re\
    \ the current ADC owner: check ADC completion events to\n       see if the microphone\
    \ is above the threshold */\n    atomic\n      if (granted)\n        if (precise\
    \ && data > THRESHOLD)\n        {\n          signal Detector.detected();\n   \
    \       ... post a task to release A/D converter, power off microphone\n     \
    \     and signal done ...\n        }\n        else\n          detect();\n    \
    \  }\n    ...\n  }\n```\n\nThe dataReady event handler checks that DetectorC currently\
    \ owns the A/D converter. If so, A/D results above the threshold indicate that\
    \ a loud sound was detected. If not, another A/D sample is requested.\n\n# 13.4\
    \ MicrophoneC\n\nMicrophoneC is a fairly typical example of low-level code to\
    \ control a sensor. The mts300 microphone hardware is shown schematically in Figure\
    \ 13.4. The microphone is powered on and off via a digital I/O pin (MicPower)\
    \ from the microcontroller. The"
