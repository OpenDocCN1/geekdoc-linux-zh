  md: '![](img/53ede4f4266a5731b93bff15d85fa06a_28_0.png)


    Figure 1.2 A Telos sensor produced by Moteiv. The top of the node has the radio,
    sensors, and circuitry for the USB connector. The bottom, not shown, has the processor
    and flash storage chip. The antenna is part of the printed circuit board (PCB).


    can send tens to hundreds of kilobits per second (kbps), rather than 802.11''s
    tens of megabits. As a result, software needs to be very efficient, both in terms
    of CPU cycles and in terms of memory use.


    Figure 1.2 shows a sample node platform, the Telos, which is designed for easy
    experimentation and low-power operation. It has a TI MSP430 16-bit microcontroller
    with 10 kB of RAM and 48 kB of flash program memory. Its radio, a TI CC2420 which
    follows the IEEE 802.15.4 standard, can send up to 250 kbps. In terms of power,
    the radio dominates the system: on a pair of AA batteries, a Telos can have the
    radio on for about four days. Lasting longer than four days requires keeping the
    node in a deep sleep state most of the time, waking only when necessary, and sleeping
    as soon as possible.


    The other mote discussed in this book, the micaz from Crossbow Technology is similar:
    it has an Atmel ATmega128 8-bit microcontroller with 4 kB of RAM, 128 kB of flash
    program memory, uses the same CC2420 radio chip, also runs off a pair of AA batteries
    and has a similar power consumption profile.


    Networks, once deployed, gather data uninterrupted for weeks, months, or years.
    As the placement of sensors is very application-specific, it is rare for networks
    to need to support multiple concurrent applications, or even require more than
    the occasional reprogramming. Therefore, unlike general-purpose computing systems,
    which emphasize run-time flexibility and composability, sensor network systems
    tend to be highly optimized. Often, the sensor suite itself is selected for the
    specific application: volcanic monitoring uses accelerometers and microphones,
    while data center provisioning uses temperature sensors.


    # 1.2 TinyOS


    TinyOS is a lightweight operating system specifically designed for low-power wireless
    sensors. TinyOS differs from most other operating systems in that its design focuses
    on ultra low-power operation. Rather than a full-fledged processor, TinyOS is
    designed'
