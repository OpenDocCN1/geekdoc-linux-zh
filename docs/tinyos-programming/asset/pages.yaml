- pgno: 93
  md: "But what if we don't even know which two want to share it? For example, it\
    \ might be that we just want to have a shared packet pool, which any number of\
    \ components can use. Making a generic's interfaces accessible across a program\
    \ requires giving it a global name.\n\n# 4.5.2 Singleton components, revisited\n\
    \nUnlike generics, singleton components introduce a global name for a component\
    \ instance that any other component can reference. So, to follow the previous\
    \ example, one easy way to have a pool that any component can use would be to\
    \ write it as a singleton component, say PacketPoolC. But we'd like to be able\
    \ to do this without copying all of the pool code. It turns out that doing so\
    \ is very easy: you just give a generic instance a global name by wrapping it\
    \ up in a singleton. For example, here's the implementation of PacketPoolC, assuming\
    \ you want an 8-packet pool:\n\n```\nconfiguration PacketPoolC (\n  provides interface\
    \ Pool<message_t>\n)\nimplementation (\n  components new PoolC(message_t, 8);\n\
    \  Pool = PoolC;\n)\n```\n\nListing 4.26 Exposing a generic component instance\
    \ as a singleton\n\nAll PacketPoolC does is instantiate an instance of PoolC that\
    \ has 8 message_t structures, then exports the Pool interface as its own. Now,\
    \ any component that wants to access this shared packet pool can just wire to\
    \ PacketPoolC.\n\nWhile you can make singleton instances of generic components\
    \ in this way, you can't make generic versions of singleton components. Singletons\
    \ inherently have only a single copy of their code. Every component that wires\
    \ to PacketPoolC wires to the same PacketPoolC: there is no way to create multiple\
    \ copies of it. If you needed two packet pools, you could just make another singleton\
    \ with a different name.\n\n# 4.6 Exercises\n\n+   1. Take the TinyOS demo application\
    \ RadioCountToLeds and trace through its components to figure out which components\
    \ are auto-wired to SoftwareInit. There might be more than you expect: the Telos\
    \ platform, for example, has 10. Hint: you can use the nesdoc tool to simplify\
    \ your task.\n\n+   2. If you want multiple components to handle a received packet,\
    \ you must either not allow buffer-swapping or must make a copy for all but one\
    \ of the handlers. Write a component library that lets an application create a\
    \ component supporting a non-swapping reception interface. Hint: you'll need to\
    \ write a singleton wrapper."
