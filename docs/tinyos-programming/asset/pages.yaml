  md: "The send command and sendDone event are used to perform split-phase transmission\
    \ of an AM packet stored in a message_t packet buffer; the addr parameter specifies\
    \ the packet destination and may be TOS_BCAST_ADDR to request a broadcast. AM\
    \ packets have source addresses, which can be retrieved with the AMPacket interface.\
    \ A node’s AM address is usually – but not always – the same as its TOS_NODE_ID.\
    \ Technically, TOS_NODE_ID is a unique identifier for a node, while the AM address\
    \ is the address of its radio interface. A node with two radios, for example,\
    \ could have different AM addresses on the two.\n\nBecause the user-payload of\
    \ a packet buffer may be at different offsets on different platforms (with different\
    \ radios) or when using different communication layers, AMSend provides a getPayload\
    \ command to obtain a pointer to the payload. The getPayload command requires\
    \ that the user pass the size of their payload so that it can ensure that there\
    \ is enough space in the buffer (it returns NULL if there isn’t enough space)\
    \ – applications wishing to send variable-sized messages can call maxPayloadLength\
    \ to find the maximum possible payload size.\n\nPutting all this together, the\
    \ reportTheft function sends theft-report packets to any nearby listeners:\n\n\
    ```\nuses interface AMSend as Theft;\n...\nmessage_t reportMsg; // The theft report\
    \ message buffer\nbool sending;      // Don’t try and send while a send is in\
    \ progress\n\nvoid reportTheft() {\n  theft_t *payload = call Theft.getPayload(&reportMsg,\
    \ sizeof(theft_t));\n\n  if (payload && !sending) {\n    // We can send if we’re\
    \ idle and the payload fits\n    payload->who = TOS_NODE_ID; // Report that *we*\
    \ are being stolen!\n    // And send the report to everyone (TOS_BCAST_ADDR)\n\
    \    if (call Theft.send(TOS_BCAST_ADDR, &reportMsg, sizeof(theft_t))==SUCCESS)\n\
    \      sending = TRUE;\n  }\n}\n\nevent void Theft.sendDone(message_t *msg, error_t\
    \ error) {\n  sending = FALSE; // Our send completed\n}\n```\n\n# Listing 6.13\
    \ Anti-Theft: reporting theft over the radio\n\nThe reportTheft function refuses\
    \ to attempt a send if its payload doesn’t fit in reportMsg (payload == NULL),\
    \ or if a previous send is still in progress (sending is true): during transmission\
    \ the packet buffer is \"owned\" (Section 3.5.1) by the communication stack, so\
    \ should not be touched. The code checks for failure in transmission (so that\
    \ it can update sending correctly), but doesn’t otherwise attempt to retry failed\
    \ transmissions, or to check whether the theft report was received by anyone.\
    \ It simply relies on the fact"
