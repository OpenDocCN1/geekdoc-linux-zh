- pgno: 243
  md: 'The HAA emerged from earlier versions of TinyOS due to observed incompatibilities
    between platforms. For example, platforms sometimes provided different signatures
    for a component with the same name, preventing cross-compilation. Writing cross-platform
    code therefore required looking through all of the platforms and figuring out
    the maximal subset that all implementations shared, with the understanding that
    a new platform might change it.


    While we’ve presented the HAA as a clear three-layer hierarchy, in practice it
    tends to be a bit more complex, and at times even a point of disagreement within
    the TinyOS community! For example, platforms define the component ActiveMessageC
    to specify the default link-layer communication stack. ActiveMessageC is part
    of the HIL. However, radio chips also provide chip-specific abstractions, such
    as CC2420ActiveMessageC, and CC1000ActiveMessageC. These components provide all
    of the functionality of ActiveMessageC, as well as chip-specific operations. For
    example, CC2420ActiveMessageC has interfaces for accessing CC2420-specific values
    and fields. These chip-specific communication components have the same datapath
    interfaces as the HIL, and a few extra control interfaces. Whether these components
    lie in the HAL, the HIL, or a hazy place in-between is a source of much debate.


    Rather than a set of hard rules, the HAA is a way to organize and name components
    that (hopefully) simplifies application development. It makes it clear when a
    component wires to a hardware-specific service, and also provides guidelines on
    what a component must provide to be cross-platform.'
  merge: -1
