- pgno: 162
  md: "```\nMainC.SoftwareInit -> ActiveMessageC;\nApp.Receive -> ActiveMessageC.Receive[240];\n\
    App.AMSend -> ActiveMessageC.AMSend[240];\n...\n```\n\nListing 8.13 Wiring TestAMC\
    \ to ActiveMessageC\n\nNote that TestAM has to wire SoftwareInit to ActiveMessageC\
    \ because it doesn’t use the standard abstractions, which auto-wire it. This configuration\
    \ means that when TestAMC calls AMSend.send, it calls ActiveMessageC.AMSend number\
    \ 240, so sends packets with protocol identifier 240. Similarly, TestAMC receives\
    \ packets with protocol identifier 240. Because these constants are specified\
    \ in the configuration, they are not bound in the module: from the module’s perspective,\
    \ they don’t even exist. That is, from TestAMC’s perspective, these two lines\
    \ of code are identical:\n\n```\nTestAMC.AMSend -> ActiveMessageC.AMSend[240];\
    \ // Not real TinyOS code\nTestAMC.AMSend -> ActiveMessageC.AMSend[240];\n```\n\
    \nThe difference lies in the component with the parameterized interface. The parameter\
    \ is essentially another argument in functions of that interface. In ActiveMessageC.AMSend,\
    \ for example, the parameter is an argument passed to it in calls to send() and\
    \ which it must pass in signals of sendDone(). But the parameterized interface\
    \ gives you two key things. First, it automatically fills in this parameter when\
    \ TestAMC calls send (nesC generates a stub function to do so, and inlining makes\
    \ the cost negligible). Second, it automatically dispatches on the parameter when\
    \ ActiveMessageC signals sendDone (nesC generates a switch table based on the\
    \ identifier).\n\n# 8.3.2 Parameterized interfaces and modules\n\nIn reality,\
    \ ActiveMessageC is a configuration that encapsulates a particular chip’s radio\
    \ stack, and that stack may itself be a configuration. For instance, for the CC2420\
    \ radio, ActiveMessageC encapsulates the CC2420ActiveMessageC configuration, which\
    \ itself encapsulates the CC2420ActiveMessageP module:\n\n```\nmodule CC2420ActiveMessageP\
    \ {\n  provides {\n    interface AMSend[am_id_t id];\n    ...\n  }\n}\n```\n\n\
    Listing 8.14 A possible module underneath ActiveMessageC"
