- pgno: 214
  md: 'a hardware independent layer (HIL) which offers high-level, platform-independent
    interfaces (see Chapter 12). The HIL layer is typically an Adapter over the HAL
    layer. For example, see the AdcP A/D converter component for the ATmega128.

    TinyOS’s provides a number of Adapters to simplify implementation of a mote’s
    timer subsystem, including AlarmToTimerC (seen above), and CounterToLocalTimeC
    (convert a Counter to a LocalTime interface).


    # Consequences


    An Adapter allows a component to be reused in circumstances other than initially
    planned for, without changing the original implementation.


    In many cases, a component used with an Adapter cannot be used independently in
    the same application, as the Adapter will already be handling its events. As with
    the Decorator, the Placeholder pattern (Section 10.5) can help ensure this.


    An Adapter can be used to adapt many different implementations of its used interfaces
    if it doesn’t embody assumptions or behavior specific to a particular adapted
    component. Like Decorators, Adapters are normally generic components to allow
    reuse.


    Adding an additional layer to convert between interfaces may increase the application’s
    resource consumption (ROM, RAM, and execution time).


    # Related patterns


    +   - Decorator: A Decorator adds functionality to an existing component while
    preserving its original interface. An Adapter presents existing (and possibly
    additional) functionality via a different interface.'
