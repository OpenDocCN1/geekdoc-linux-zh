- pgno: 59
  md: "# 3.4.1 Read\n\nThe Read interface is the basic TinyOS interface for split-phase\
    \ data acquisition. Most sensor drivers provide Read, which is generic:\n\n```\n\
    interface Read<val_t> {\n  command error_t read();\n  event void readDone(error_t\
    \ err, val_t val);\n}\n```\n\nListing 3.25 The Read interface\n\nFor example,\
    \ a sensor driver that generates a 16-bit value provides Read<uint16_t>. If the\
    \ provider of Read returns SUCCESS to a call to read, then it will signal readDone\
    \ in the future, passing the Read’s result back as the val parameter to the event\
    \ handler.\n\n# 3.4.2 Send\n\nThe basic TinyOS packet transmission interface,\
    \ Send, is also a split-phase operation. However, it is slightly more complex,\
    \ as it requires passing a pointer for a packet to transmit:\n\n```\ninterface\
    \ Send {\n  command error_t send(message_t* msg, uint8_t len);\n  event void sendDone(message_t*\
    \ msg, error_t error);\n\n  command error_t cancel(message_t* msg);\n  command\
    \ void* getPayload(message_t* msg);\n  command uint8_t maxPayloadLength(message_t*\
    \ msg);\n}\n```\n\nListing 3.26 The split-phase Send interface\n\nA provider of\
    \ Send defines the send and cancel functions and can signal the sendDone event.\
    \ Conversely, a user of Send needs to define the sendDone event and can call the\
    \ send and cancel commands. When a call to send returns SUCCESS, the msg parameter\
    \ has been passed to the provider, which will try to send the packet. When the\
    \ send completes, the provider signals sendDone, passing the pointer back to the\
    \ user. This pointer passing approach is common in split-phase interfaces that\
    \ need to pass larger data items. The next section discusses memory management\
    \ in greater detail.\n\n# 3.5 Module memory allocation, avoiding recursion, and\
    \ other details\n\nBesides power, the most valuable resource to mote systems is\
    \ RAM. Power means that the radio and CPU have to be off almost all the time.\
    \ Of course, there are situations which need a lot of CPU or a lot of bandwidth\
    \ (e.g. cryptography or binary dissemination), but"
