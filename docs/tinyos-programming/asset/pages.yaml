- pgno: 44
  md: "# 3 Components and interfaces\n\nThis chapter describes components, the building\
    \ blocks of nesC programs. Every component has a signature, which describes the\
    \ functions it needs to call as well as the functions that others can call on\
    \ it. A component declares its signature with interfaces, which are sets of functions\
    \ for a complete service or abstraction. Modules are components that implement\
    \ and call functions in C-like code. Configurations connect components into larger\
    \ abstractions. This chapter focuses on modules, and covers configurations only\
    \ well enough to modify and extend existing applications: Chapter 4 covers writing\
    \ new configurations from scratch.\n\n# 3.1 Component signatures\n\nA nesC program\
    \ is a collection of components. Every component is in its own source file, and\
    \ there is a one-to-one mapping between component and source file names. For example,\
    \ the file LedsC.nc contains the nesC code for the component LedsC, while the\
    \ component PowerupC can be found in the file PowerupC.nc. Components in nesC\
    \ reside in a global namespace: there is only one PowerupC definition, and so\
    \ the nesC compiler loads only one file named PowerupC.nc.\n\nThere are two kinds\
    \ of components: modules and configurations. Modules and configurations can be\
    \ used interchangeably when combining components into larger services or abstractions.\
    \ The two types of components differ in their implementation sections. Module\
    \ implementation sections consist of nesC code that looks like C. Module code\
    \ declares variables and functions, calls functions, and compiles to assembly\
    \ code. Configuration implementation sections consist of nesC wiring code, which\
    \ connects components together. Configurations are the major difference between\
    \ nesC and C (and other C derivatives).\n\nAll components have two code blocks.\
    \ The first block describes its signature, and the second block describes its\
    \ implementation:\n\n```\nmodule PowerupC {\n    // signature\n}\nimplementation\
    \ {\n    // implementation\n}\n\nconfiguration LedsC {\n    // signature\n}\n\
    implementation {\n    // implementation\n}\n```\n\nListing 3.1 The signature and\
    \ implementation blocks"
  merge: -1
  img_proc: true
- pgno: 45
  md: "Signature blocks in modules and configurations have the same syntax. Component\
    \ signatures contain zero or more interfaces. Interfaces define a set of related\
    \ functions for a service or abstraction. For example, there is a Leds interface\
    \ for controlling node LEDs, a Boot interface for being notified when a node has\
    \ booted, and an Init interface for initializing a component’s state. A component\
    \ signature declares whether it provides or uses an interface. For example, a\
    \ component that needs to turn a node’s LEDs on and off uses the Leds interface,\
    \ while the component that implements the functions that turns them on and off\
    \ provides the Leds interface. Returning to the two examples, these are their\
    \ signatures:\n\n```\nmodule PowerupC {\n  uses interface Boot;\n  uses interface\
    \ Leds;\n}\n\nconfiguration LedsC {\n  provides interface Leds;\n}\n```\n\nListing\
    \ 3.2 Signatures of PowerupC and LedsC\n\nPowerupC is a module that turns on a\
    \ node LED when the system boots. As we saw in Chapter 2, it uses the Boot interface\
    \ for notification of system boot and the Leds interface for turning on a LED.\
    \ LedsC, meanwhile, is a configuration which provides the abstraction of three\
    \ LEDs that can be controlled through the Leds interface. A single component can\
    \ both provide and use interfaces. For example, this is the signature for the\
    \ configuration MainC:\n\n```\nconfiguration MainC {\n  provides interface Boot;\n\
    \  uses interface Init;\n}\n```\n\nListing 3.3 MainC’s signature\n\nMainC is a\
    \ configuration which implements the boot sequence of a node. It provides the\
    \ Boot interface so other components, such as PowerupC, can be notified when a\
    \ node has fully booted. MainC uses the Init interface so it can initialize software\
    \ as needed before finishing the boot sequence. If PowerupC had a state that needed\
    \ initialization before the system boots, it might provide the Init interface.\n\
    \n# 3.1.1 Visualizing components\n\nThroughout this book, we’ll use a visual language\
    \ to show components and their relationships. Figure 3.1 shows the three components\
    \ we’ve seen so far: MainC, PowerupC, and LedsC."
  merge: -1
  img_proc: true
- pgno: 46
  md: "![](img/53ede4f4266a5731b93bff15d85fa06a_46_0.png)\n\n# 3.1.2 The \"as\" keyword\
    \ and clustering interfaces\n\nThe as keyword lets a signature provide an alternative\
    \ name for an interface. For example, MainC uses the as keyword to make its signature\
    \ a bit clearer to the reader by using the name SoftwareInit for its Init interface:\n\
    \n```\nuses interface Init as SoftwareInit;\n```\n\nSome signatures must use the\
    \ keyword to distinguish multiple instances of the same interface. If a component\
    \ provides or uses an interface more than once, its signature must use the as\
    \ keyword to give them distinct names. For example, LedsC provides the abstraction\
    \ of three LEDs through the Leds interface, but it is a configuration and not\
    \ executable code. The LedsC configuration connects the LEDs module, LedsP, to\
    \ components that provides the digital input-output lines which power the LEDs.\
    \ The signature for LedsP is as follows:\n\n```\nmodule LedsP {\n  provides {\n\
    \    interface Init;\n    interface Leds;\n  }\n  uses {\n    interface GeneralIO\
    \ as Led0;\n    interface GeneralIO as Led1;\n    interface GeneralIO as Led2;\n\
    \  }\n}\n```\n\nListing 3.4 The LedsP module\n\nA signature only needs to make\
    \ sure that each interface instance has a unique name. For example, the LedsP\
    \ example above could use as only twice, and leave one interface instance as GeneralIO,\
    \ so the three would have the names Led0, Led1, and GeneralIO. However, in this\
    \ case that would be confusing, so LedsP renames all three instances of GeneralIO.\
    \ Technically, interface declarations have an implicit use of as. The statement\n\
    \n```\nuses interface Leds;\n```"
  merge: -1
  img_proc: true
- pgno: 47
  md: "is really shorthand for\n\n```\nuses interface Leds as Leds;\n```\n\nGenerally,\
    \ the keyword as is a useful tool for making components and their requirements\
    \ clearer, similarly to how variable and function names greatly affect code readability.\n\
    \n# Programming Hint 1 USE THE \"AS\" KEYWORD LIBERALLY.\n\n# 3.1.3 Clustering\
    \ interfaces\n\nThe LedsP example shows one further detail about signatures: they\
    \ can cluster used and provided interfaces together. For example, these two versions\
    \ of PowerupC are equivalent:\n\n```\nconfiguration PowerupC {\n  uses interface\
    \ Boot;\n  uses interface Leds;\n}\n```\n\n```\nconfiguration PowerupC {\n  uses\
    \ {\n    interface Boot;\n    interface Leds;\n  }\n}\n```\n\nListing 3.5 PowerupC\
    \ and an alternative signature\n\nAs these two are equivalent, there is no syntactical\
    \ or code efficiency advantage to either approach: it is a matter of style and\
    \ what is more legible to the reader. Often component signatures declare the interfaces\
    \ they provide first, followed by the interfaces they use. This lets a reader\
    \ clearly see the available functionality and dependencies. For very complex components\
    \ that perform many functions, however, this approach breaks down, and signatures\
    \ place related interfaces close to one another.\n\nTinyOS detail: The names of\
    \ all of the components described above end in the letters C and P. This is not\
    \ a requirement. It is a coding convention used in TinyOS code. Components whose\
    \ names end in C are abstractions that other components can use freely: the C\
    \ stands for \"component.\" Some component names end in P, which stands for \"\
    private.\" In TinyOS, P components should not be used directly, as they are generally\
    \ an internal part of a complex system. Components use these two letters in order\
    \ to clearly distinguish them from interfaces.\n\n# 3.2 Interfaces\n\nInterfaces\
    \ describe a functional relationship between two or more different components.\
    \ The role a component plays in this relationship depends on whether it provides\
    \ or uses the interface. Like components, interfaces have a one-to-one mapping\
    \ between names and files: the file Leds.nc contains the interface Leds while\
    \ the file Boot.nc contains"
