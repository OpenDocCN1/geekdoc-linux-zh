- pgno: 97
  md: '# 5.2.1 Task timing


    TinyOS normally runs tasks in the same order they’re posted (FIFO). A posted task
    won’t run until all tasks posted before it complete. This means that tasks should
    be pretty short. If a component has a very long computation to do, it should break
    it up into multiple tasks. A task can post itself, as once it is running it is
    no longer on the queue.


    It takes about 80 microprocessor clock cycles to post and execute a task on current
    mote platforms. Generally, keeping task run times to at most a few milliseconds
    is a good idea. Because tasks are run to completion, then a long-running task
    or large number of not-so-long-running tasks can introduce significant latency
    (tens of milliseconds) between a task post and its execution. This usually isn’t
    a big deal with application-level components. But there are lower-level components,
    such as radio stacks, that use tasks. For example, if the packet reception rate
    is limited by how quickly the radio can post tasks to signal reception, then a
    latency of 10 ms will limit the system to 100 packets per second.


    Consider these two cases. In both, there are five processing components and a
    radio stack. The mote processor runs at 8 MHz. Each processing component needs
    to do a lot of CPU work. In the first case, the processing components post tasks
    that run for 5 ms and repost themselves to continue the work. In the second case,
    the processing components post tasks that run for 500 µs and repost themselves
    to continue the work.


    In the first case, the task posting overhead is 0.02%: 80 cycles overhead on 40
    000 cycles of execution. In the second case, the task posting overhead is 0.2%:
    80 cycles overhead on 4 000 cycles of execution. So the time to complete the executions
    isn’t significantly different. However, consider the task queue latency. In the
    first case, when the radio stack posts a task to signal that a packet has been
    received, it expects to wait around 25 ms (5 processing tasks × 5 ms each), limiting
    the system to 40 packets per second. In the second case, when the radio stack
    posts the task, it expects to wait around 2.5 ms (5 processing tasks × 500 µs
    each), limiting the system to 400 packets per second. Because the task posting
    cost is so low, using lots of short running tasks improves the responsiveness
    of the system without introducing significant CPU overhead.


    Of course, there’s often a tradeoff between lots of short tasks and the amount
    of state you have to allocate in a component. For example, let’s say you want
    to encrypt a chunk of data. If the encryption operation takes a while (e.g. 10
    ms), then splitting it into multiple task executions would improve the overall
    system responsiveness. However, if you execute it in a single task, then you can
    allocate all of the state and scratch space you need on the stack. In contrast,
    splitting it across tasks would require keeping this state and scratch space in
    the component. There is no hard rule on this tradeoff. But generally, long-running
    tasks can cause other parts of the OS to perform poorly, so should be avoided
    when possible.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# 5.2.2 Timing and event handlers


    The need for tasks to be short directly affects how you implement components,
    in particular, event handlers. BaseStationP doesn’t directly send packets in its
    receive event handlers; instead, it posts tasks to send the packets. It does this
    because the lower-level radio stack is signaling receive from within a task, presumably
    after a bit of computation. If the call to send takes a lot of cycles, then the
    lower-level radio component will not get a new buffer from the application until
    send completes. More generally, if the receive handler has significant computation
    in it, then the radio has to wait for that to complete before it has a buffer
    into which to receive the next packet.


    While a single event handler may not be a big deal, an event handler may actually
    represent several software layers. For example, a networking component may handle
    a receive event, perform a small computation based on the packet, and then signal
    it to the next layer. Therefore, any given component may be just one part of a
    long chain of event handlers. For this reason, if a handler needs to perform significant
    computation, it is best to post a task. Doing so prevents a call chain from having
    multiple such handlers.


    # Programming Hint 16 If an event handler needs to make possibly long-executing
    command calls, post a task to make the calls.


    This is why BaseStationP uses tasks to send packets rather than do so directly
    in event handlers. While tasks may in theory have to wait a while before they
    run, in practice tasks tend to be very short, and so there is little latency between
    posting and execution.


    # 5.3 Tasks and split-phase calls


    Tasks do more than provide a way to maintain system responsiveness with a single
    stack. Tasks enable nesC programs to have a flexible hardware/software boundary:
    software components can behave similarly to hardware. Explaining why this is challenging
    requires a bit of a digression into how most peripherals, such as sensors and
    radios, work.


    # 5.3.1 Hardware versus software


    Split-phase calls represent how most peripherals work. Software issues commands
    to a device, and some time later the device indicates the operation is complete,
    typically with an interrupt. The device driver’s interrupt handler signals the
    operation’s completion event. While the device is busy, the processor can continue
    to issue instructions and do other useful work. Therefore, the command that starts
    the operation can return immediately and allow the program to continue.'
