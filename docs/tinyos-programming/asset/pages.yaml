    register values are valid, but this wastes CPU cycles, especially when the parameters
    should always be valid. So CC2420SpiC maps a subset of the valid parameters into
    interface instances. It only maps a subset because there are some debugging registers
    the stack doesn’t need to use. The implementation looks like this:


    ```

    configuration CC2420SpiC { ... }

