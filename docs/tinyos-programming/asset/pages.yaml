- pgno: 200
  md: '+   - Service Instance: the identifiers used to identify individual services
    form a Local Keyspace.

    +   - Dispatcher: the identifiers used by a dispatcher are typically taken from
    a Global Keyspace.


    # 10.4 Namespace: Keymap


    # Intent


    Map keys from one keyspace to another. Allows you to translate global, shared
    names to local, optimized names, or to efficiently subset another keyspace.


    # Motivation


    Mapping between namespaces is often useful: it allows motes to use a global, sparse
    namespace for easy cross-application communication and an internal, compact namespace
    for efficiency.


    The Drip epidemic dissemination protocol uses the Keyspace and Keymap patterns
    to allow a user to configure parameters at run-time. A component registers a parameter
    with the DisseminatorC generic component with a Global Keyspace, so it can be
    named in an application-independent manner. The user modifies a parameter by sending
    a key-value pair using an epidemic protocol, which distributes the change to every
    mote. Drip maintains a special "trickle" timer for each key-value pair, accessed
    via a Local Keyspace for efficiency. A Keymap maps the global key to the local
    key.


    Keymaps are also useful for mapping between two local keyspaces, when some service,
    based on the Service Instance pattern, accesses a subset of the resources provided
    by another service, also based on the Service Instance pattern.


    For instance, the Atmel AT45db implementation of the BlockStorageC, LogStorageC,
    and ConfigStorageC components (Section 6.5) identify their respective clients
    with their own local keyspace. All three are built upon the lower-level At45dbC
    component, which also identifies its clients with its own local keyspace. Each
    client of, e.g. BlockStorageC is thus indirectly a client of At45dbC. A keymap
    maps BlockStorageC''s client identifiers to At45dbC''s client identifiers.'
  merge: -1
