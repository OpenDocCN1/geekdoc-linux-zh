    \ packet is represented by x, a pointer to a serial_packet_t. The representation\
    \ of x is the same as the representation of the packet on the serial connection\
    \ to the PC. On the PC itself, a mig-generated class uses a backing array containing\
    \ the same bytes to represent a serial_header_t (the external type for serial\
    \ AM packet headers) value.\n\nMig-generated classes supports all features of\
