- pgno: 231
  md: "# 12.1.1  Examples\n\n![](img/53ede4f4266a5731b93bff15d85fa06a_231_0.png)\n\
    \nFigure 12.2 illustrates a typical example of the hardware abstraction architecture:\
    \ the structure of the storage for two different flash chips, Atmel’s AT45DB041B\
    \ serial data flash, and ST’s M25P serial NOR flash. Both chips support the three\
    \ HIL storage abstractions that we saw in Section 6.5, BlockStorageC, LogStorageC,\
    \ and ConfigStorageC. However, the implementations of these abstractions is different\
    \ for each chip. The HAL layers for each chip are composed of different numbers\
    \ of components, and provide different interfaces.\n\n```\nconfiguration At45dbC\
    \ {\n  provides interface At45db;\n  ...\n}\n\nmodule At45dbStorageManagerC {\n\
    \  provides interface At45dbVolume[volume_id_t volid];\n}\n\nconfiguration Stm25pSectorC\
    \ {\n  provides interface Stm25pSector as Sector[uint8_t id];\n  ...\n}\n```\n\
    \nThe AT45DB041B HAL is provided by two components: At45dbC provides a single\
    \ interface (At45db) with erase, read, write, and CRC-computation commands, and\
    \ manages a small on-flash-chip cache. The At45dbStorageManagerC component returns\
    \ the configuration of a specific TinyOS storage volume given its id. In contrast,\
    \ the ST M25P HAL is provided by a single component, Stm25pSectorC, which combines\
    \ high-level erase, read, write, and CRC computation (in the Stm25pSector interface)\
    \ with volume management. Stm25pSectorC provides a parameterized interface where\
    \ the interface parameter identifies each individual HAL user."
