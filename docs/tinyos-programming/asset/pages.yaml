- pgno: 63
  md: "feature-free, code:\n\n```\nevent message_t* Receive.receive(message_t* msg,\
    \ void* payload, uint8_t len) {\n    return msg;\n}\n```\n\nA receive handler\
    \ can always copy needed data out of the packet and just return the passed buffer.\
    \ There are, however, situations when this is undesirable. One common example\
    \ is a routing queue. If the node has to forward the packet it just received,\
    \ then copying it into another buffer is wasteful. Instead, a queue allocates\
    \ a bunch of packets, and in addition to a send queue, keeps a free list. When\
    \ the routing layer receives a packet to forward, it sees if there are any packets\
    \ left in the free list. If so, it puts the received packet into the send queue\
    \ and returns a packet from the free list, giving the radio stack a buffer to\
    \ receive the next packet into. If there are no packets left in the free list,\
    \ then the queue can’t accept the packet and so just returns it back to the radio\
    \ for re-use. The pseudocode looks something like this:\n\n```\nreceive (m):\n\
    \    if I’m not the next hop, return m  // Not for me\n    if my free list is\
    \ empty, return m // No space\n    else\n        put m on forwarding queue\n \
    \       return entry from free list\n```\n\nOne of the most common mistakes early\
    \ TinyOS programmers encounter is misusing the Receive interface. For example,\
    \ imagine a protocol that does this:\n\n```\nevent message_t* LowerReceive.receive(message_t*\
    \ m, void* payload, uint8_t len) {\n    processPacket(m);\n    if (amDestination(m))\
    \ {\n        signal UpperReceive.receive(m, payload, len);\n    }\n    return\
    \ m;\n}\n```\n\nThe problem with this code is that it ignores the return value\
    \ from the signal to UpperReceive.receive. If the component that handles this\
    \ event performs a buffer swap – e.g. it has a forwarding queue – then the packet\
    \ it returns is lost. Furthermore, the packet that it has put on the queue has\
    \ also been returned to the radio for the next packet reception. This means that,\
    \ when the packet reaches the end of the queue, the node may send something completely\
    \ different than what it decided to forward (e.g. a packet for a completely different\
    \ protocol)."
