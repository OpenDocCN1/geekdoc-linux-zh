    \ grants the bus to the SPI client, it calls the SPI configuration code. The same\
    \ is true of an I²C client.\n\n# 11.2.5 Hardware configuration\n\nIn addition\
    \ to controlling power states, power locks can configure hardware. Take, for example,\
    \ the ADC on a microcontroller. ADCs typically have several configuration parameters,\
    \ such as which pin’s voltage to measure and what reference voltage to compare\
