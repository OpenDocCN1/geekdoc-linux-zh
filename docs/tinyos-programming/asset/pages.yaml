- pgno: 84
  md: "# 4.3.1 Extensibility\n\nIn practice, these layers of indirection are not particular\
    \ to nesC: any system with complex libraries has them. The difference is how those\
    \ layers are written. In C code, you might see a series of functions that are\
    \ simple wrappers (e.g. printf as a call to fprintf passing stdout as the file\
    \ stream): you traverse executable code. In nesC code you traverse namespace mappings\
    \ through configurations. The first few times you try to get to the bottom of\
    \ a function, this difference can be a bit confusing, but it doesn't take very\
    \ long to get used to it. You can also use the nesC's nesdoc tool to navigate\
    \ through an application's wiring and find where an interface is ultimately implemented\
    \ – see the TinyOS tutorials for more information.\n\nJust as in other languages,\
    \ especially object-oriented ones, nesC software design has a tension between\
    \ how simple the implementations are and how easy it is to use or reuse them.\
    \ The C++ standard template library is infamous for this: it is amazingly powerful,\
    \ general, and efficient, but understanding the implementations is non-trivial.\
    \ Putting all of a system's functionality in a single module means a user doesn't\
    \ need to track down call chains. But it means that modifying the system requires\
    \ replacing or copying that entire file. This leads to code replication, which\
    \ greatly increases the lifetime of software bugs (if there's a bug in the copied\
    \ code, you need to change all of the copies, and almost always forget one). Therefore,\
    \ a lot of the core TinyOS abstractions, such as timers and communication, tend\
    \ to be composed of many small components. This makes the systems more difficult\
    \ to understand at a first read, but easy to tweak, replace, or modify once you\
    \ do.\n\n# 4.3.2 Hardware specificity\n\nFurthermore, there's a tension between\
    \ high-level APIs that are hardware independent and APIs that enable a program\
    \ to take advantage of all of the hardware capabilities. For example, some but\
    \ not all radios have multiple channels (frequencies). Some systems may want to\
    \ take advantage of this functionality, and are willing to assume they are using\
    \ a particular radio chip in order to do so. Other systems may want to remain\
    \ hardware independent.\n\nTinyOS uses component layering to make this possible.\
    \ Let's look at packet communication as an example. The top-level component a\
    \ platform needs to provide is called ActiveMessageC and is hardware independent.¹\
    \ ActiveMessageC is almost always a configuration that layers on top of a chip-specific\
    \ component that provides additional interfaces. For example, this is the implementation\
    \ of ActiveMessageC for the micaz mote, which has a CC2420 radio chip:\n\n```\n\
    configuration ActiveMessageC {\n  provides {\n    interface SplitControl;\n\n\
    ```\n\n¹ TinyOS uses \"active messages\" [29], often abbreviated to AM, as its\
    \ networking abstraction (see Section 6.3)."
