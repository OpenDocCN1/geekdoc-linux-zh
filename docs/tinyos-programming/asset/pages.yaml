    \ 11.4 A call sequence that could corrupt a variable\n\nIn this execution, when\
    \ the first toggle returns, the calling component will think that state is equal\
    \ to 1. But the last assignment (in the interrupt) was to 0.\n\nThis problem can\
    \ be much worse when a single statement can be interrupted. For example, on micaz\
    \ or Telos motes, writing or reading a 32-bit number takes more than one instruction.\
    \ It's possible that an interrupt executes in between two instructions, so that\
