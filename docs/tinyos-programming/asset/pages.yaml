    Listing 10.5 The CC2420CsmaC uses a Facade


    # Known uses


    Stable, commonly used abstract boundaries such as radio stacks (CC2420CsmaC, CC1000CsmaRadioC)
    and storage (BlockStorageC) often use a Facade. This allows them to implement
    complex abstractions in smaller, distinct parts, which simplifies code.


    # Consequences


    The key aspects of the Facade pattern are:


    +   - Provides an abstraction boundary as a set of interfaces. A user can easily
    see the set of operations the abstraction support, and only needs to include a
    single component to use the whole service.

    +   - Presents the interfaces separately. A user can wire to only the needed parts
    of the abstraction, but be certain everything underneath is composed correctly.


    A Facade is not always without cost. Because the Facade names all of its subparts,
    they will all be included in the application. While the nesC compiler attempts
    to remove unreachable code, this analysis is necessarily conservative and may
    end up keeping much useless code. In particular, unused interrupt handlers are
    never removed, so all the code reachable from them will be included every time
    the Facade is used. If you expect applications to only use a very narrow part
    of an abstraction, then a Facade can be wasteful.


    # Related patterns


    +   - Placeholder: a placeholder allows easy selection of the implementation of
    a group of interfaces, while a Facade allows easy use of a group of interfaces.
    An application may well connect a placeholder to a Facade.


    # 10.7 Behavioral: Decorator


    # Intent


    Enhance or modify a component''s capabilities without modifying its implementation.
    Be able to apply these changes to any component that provides the interface.


    # Motivation


    We often need to add extra functionality to an existing component, or to modify
    the way it works without changing its interfaces. For instance, the standard LogStorageC
    component provides a LogWrite interface to log data to a region of flash memory.
    In some circumstances, we would like to introduce a RAM write buffer on top of
    the interface. This would reduce the number of times the application talks to
    the flash chip, improving performance and conserving energy.'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'Adding a buffer to the LogStorageC component forces all logging applications
    to allocate the buffer. As some applications may not able to spare the RAM, this
    is undesirable. Providing two versions, buffered and unbuffered, replicates code,
    reducing reuse, and increasing the possibility of incomplete bug fixes. It is
    possible that several implementers of the interface – any component that provides
    LogWrite – may benefit from the added functionality. Having multiple copies of
    the buffering version, spread across several services, further replicates code.


    There are two traditional object-oriented approaches to this problem: inheritance,
    which defines the relationship at compile-time through a class hierarchy, and
    decorators, which define the relationship at run-time through encapsulation. As
    nesC is not an object-oriented language, and has no notion of inheritance, the
    former option is not possible. Similarly, run-time encapsulation is not readily
    supported by nesC’s static component composition model and imposes overhead in
    terms of pointers and call forwarding. However, we can use nesC’s component composition
    and wiring to provide a compile-time version of the Decorator.


    A Decorator component is typically a generic module that provides and uses the
    same interface type, such as LogWrite. The provided interface adds functionality
    on top of the used interface. For example, we show a BufferedLogC component that
    sits on top of a LogWrite provider. It implements its additional functionality
    by aggregating several writes to BufferedLogC writes into a single write to the
    underlying LogWrite interface.


    Using a Decorator can have further benefits. In addition to augmenting existing
    interfaces, they can introduce new ones that provide alternative abstractions.
    For example, BufferedLogC provides a synchronous (not split phase) FastLog interface;
    a call to FastLog writes directly into the buffer.


    Finally, separating added functionality into a Decorator allows it to apply to
    any implementation. For example, a packet send queue Decorator can be interposed
    on top of any networking abstraction that provides the Send interface; this allows
    flexible interpositioning of queues and queueing policies in a networking system.


    # Applicable when


    +   - You wish to extend the functionality of an existing component without changing
    its implementation, or

    +   - You wish to provide several variants of a component without having to implement
    each possible combination separately.


    # Structure


    ![](img/53ede4f4266a5731b93bff15d85fa06a_210_0.png)'
