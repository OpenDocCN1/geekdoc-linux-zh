- pgno: 215
  md: "# 11 Concurrency\n\nSo far, the code we’ve looked at has been split-phase and\
    \ runs in tasks (synchronous). This programming model is sufficient for almost\
    \ all application-level code. High-performance applications and low-level device\
    \ drivers sometimes require additional functionality and concurrency models. This\
    \ chapter describes two such additional mechanisms: asynchronous code and resource\
    \ locks. Asynchronous code is a feature of the nesC language, while resource locks\
    \ are a set of TinyOS components and mechanisms.\n\n# 11.1 Asynchronous code\n\
    \nTasks allow software components to emulate the split-phase behavior of hardware.\
    \ But they have much greater utility than that. They also provide a mechanism\
    \ to manage preemption in the system. Because tasks run atomically with respect\
    \ to one another, code that runs only in tasks can be rather simple: there’s no\
    \ danger of another execution suddenly taking over and modifying data under you.\
    \ However, interrupts do exactly that: they interrupt the current execution and\
    \ start running preemptively.\n\n# 11.1.1 The async keyword\n\nAs we saw in Chapter\
    \ 5, nesC distinguishes between synchronous (sync) and asynchronous (async) code.\
    \ Commands and events that can run preemptively from interrupt handlers (and therefore\
    \ asynchronously with regards to tasks), must be labeled with the async keyword,\
    \ both in the interface where the command or event is declared and in the module\
    \ where the command or event is implemented. As a result, an async command or\
    \ event, or a function reachable from an async command or event can only call\
    \ or signal async commands and events (nesC will tell you when you break this\
    \ rule). This rule means that it’s clear from looking at an interface or module\
    \ which code is synchronous and which is asynchronous. For example, the Send interface\
    \ is purely synchronous as no commands or events are marked with async:\n\n```\n\
    interface Send {\n  command error_t send(message_t* msg, uint8_t len);\n  event\
    \ void sendDone(message_t* msg, error_t error);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 216
  md: "```\n```text\ncommand error_t cancel(message_t* msg);\ncommand void* getPayload(message_t*\
    \ msg);\ncommand uint8_t getPayloadLength(message_t* msg);\n}\n```\n```\n\nListing\
    \ 11.1  The Send interface\n\nIn contrast, the Leds interface is purely asynchronous:\n\
    \n```\n```text\ninterface Leds {\n  async command void ledOn();\n  async command\
    \ void ledOff();\n  async command void ledToggle();\n\n  ... more commands declared\
    \ with async ...\n}\n```\n```\n\nListing 11.2  The Leds interface\n\nAll interrupt\
    \ handlers are automatically async, and so they cannot include any sync functions\
    \ in their call graph. The one and only way that an interrupt handler can execute\
    \ a sync function is to post a task. A task post is allowed from an async context,\
    \ but the resulting task runs in a synchronous context.\n\nFor example, consider\
    \ a packet layer on top of a UART. When the UART receives a byte, it signals an\
    \ interrupt. In the interrupt handler, software reads the byte out of the data\
    \ register and puts it in a buffer. When the last byte of a packet is received,\
    \ the software needs to signal packet reception. But the receive event of the\
    \ Receive interface is sync. So in the interrupt handler of the final byte, the\
    \ component posts a task to signal packet reception.\n\n# 11.1.2  The cost of\
    \ async\n\nThis raises the question: If tasks introduce latency, why use them\
    \ at all? Why not make everything async? The reason is simple: race conditions,\
    \ in particular *data races*. The basic problem with preemptive execution is that\
    \ it can modify state underneath an ongoing computation, which can cause a system\
    \ to enter an inconsistent state. For example, consider this command, toggle,\
    \ which flips the state bit and returns the old one:\n\n```\n```text\nbool state;\n\
    async command bool toggle() {\n  if (state == 0) {\n    state = 1;\n    return\
    \ 1;\n  }\n}\n```\n```"
