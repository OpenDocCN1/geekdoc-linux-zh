  md: "the Fancy interface:\n\n```\nmodule FancyModule {\n  uses interface Fancy;\n\
    }\n\nimplementation {\n  char *name = GLOBAL_NAME;\n}\n```\n\nListing 3.37 FancyModule.nc:\
    \ C preprocessor pitfalls\n\nCompiling FancyModule will report that GLOBAL_NAME\
    \ is an unknown symbol. Why? The problem is that the first step in compiling FancyModule.nc\
    \ is to preprocess it. At that point, the Fancy interface hasn’t been seen yet,\
    \ therefore it hasn’t been loaded and the GLOBAL_NAME #define is unknown. Later\
    \ on, when FancyModule is analyzed, the Fancy interface is seen, the Fancy.nc\
    \ file is loaded and GLOBAL_NAME gets #defined. But this is too late to use it\
    \ in FancyModule.nc.\n\nThere are two lessons to be drawn from this: first, as\
    \ we’ve already seen, it’s best to use enum rather than #define to define constants\
    \ when possible. Second, if you must use #define, use it as you would in C: place\
    \ your definitions in a header file protected with #ifndef/#define, and #include\
    \ this header file in all components and interfaces that use the #define symbol.\
    \ For instance, both Fancy.nc and FancyModule.nc should\n\n```\n#include \"Fancy.h\"\
    \n```\n\nwhere Fancy.h contains:\n\n```\n#ifndef FANCY_H\n#define GLOBAL_NAME\
    \ \"fancy\"\n#endif\n```\n\nListing 3.38 Fancy.h: the reliable way to use C preprocessor\
    \ symbols\n\n# **Programming Hint 10**  ALWAYS #DEFINE A PREPROCESSOR SYMBOL IN\
