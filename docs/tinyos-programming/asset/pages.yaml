- pgno: 161
  md: "Packet communication is another example use of parameterized interfaces. ActiveMessageC\
    \ is a platform-specific configuration for single-hop packet communication:\n\n\
    ```\nconfiguration ActiveMessageC {\n  provides {\n    interface Init;\n    interface\
    \ SplitControl;\n\n    interface AMSend[am_id_t id];\n    interface Receive[uint8_t\
    \ id];\n    interface Receive as Sno op[uint8_t id];\n\n    interface Packet;\n\
    \    interface AMPacket;\n    interface PacketAcknowledgements;\n  }\n}\n```\n\
    \nListing 8.11 ActiveMessageC signature\n\nAMSend, Receive, and Snoop are all\
    \ parameterized interfaces. Their parameter is the AM type of the message (the\
    \ protocol identifier). Normally, components don’t wire directly to ActiveMessageC.\
    \ Instead, they use AMSenderC, AMReceiverC, which present a simpler interface\
    \ (see Section 6.3). However, some test applications for the basic AM abstraction,\
    \ such as TestAM, use ActiveMessageC directly. The module TestAMC sends and receives\
    \ packets:\n\n```\nmodule TestAMC {\n  uses {\n    ...\n    interface Receive;\n\
    \    interface AMSend;\n    ...\n  }\n}\n```\n\nListing 8.12 Signature of TestAMC\n\
    \nTestAMAppC is the configuration that wires up the TestAMC module:\n\n```\nconfiguration\
    \ TestAMAppC { }\nimplementation {\n  components MainC, TestAMC as App;\n  components\
    \ ActiveMessageC;\n}\n```"
