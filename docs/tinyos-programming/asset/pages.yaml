- pgno: 79
  md: "# ### 4.1.5 Wiring shortcuts\n\nAll interfaces have a *type*: it is not possible\
    \ to wire, e.g., a Leds interface to a Boot interface, or a Read<uint8_t> to a\
    \ Read<int16_t>. As a result, when wiring you can sometimes elide one of the interface\
    \ names. For instance, you can change PowerupToggleAppC’s wiring section to:\n\
    \n```\ncomponents MainC, LedsC, PowerupToggleC;\nPowerupToggleC.Boot -> MainC;\n\
    PowerupToggleC -> LedsC.Leds;\n```\n\nOn the left side, PowerupToggleC.Boot is\
    \ an instance of the Boot interface. On the right side is MainC, without an interface\
    \ name. Because MainC only provides one instance of the Boot interface, nesC assumes\
    \ that this is the one you mean. Similarly, the wiring of component PowerupToggleC\
    \ to interface Leds of LedsC must be specifying PowerupToggleC’s Leds interface.\
    \ So the two wiring statements are equivalent to:\n\n```\nPowerupToggleC.Boot\
    \ -> MainC.Boot;\nPowerupToggleC.Leds -> LedsC.Leds;\n```\n\nThese shortcuts also\
    \ apply to export wirings:\n\n```\nconfiguration LedsC {\n  provides interface\
    \ Leds;\n}\nimplementation {\n  components LedsP;\n  Leds = LedsP;\n  ...\n}\n\
    ```\n\n*Listing 4.10 LedsC revisited*\n\nThe Leds interface of LedsC is wired\
    \ to component LedsP, which implicitly resolves to the Leds interface of LedsP.\
    \ However, the following code is invalid, as you can omit the name of the exported\
    \ interface:\n\n```\n= LedsP.Init;\n```\n\nWiring shortcuts are based on interface\
    \ types and whether the interface is provided or used, not names. The BlinkC module\
    \ has the following signature:\n\n```\nmodule BlinkC\n{\n  uses interface Timer<TMilli>\
    \ as Timer0;\n  uses interface Timer<TMilli> as Timer1;\n```"
