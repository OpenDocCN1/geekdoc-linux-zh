  md: '# 13.5 Wrap-up


    That’s it! You’ve seen how to build applications, from the very simplest version
    of anti-theft (Chapter 6.1) to moderately complex systems like SoundLocalizer.
    You’ve also seen how nesC’s component and execution model, and TinyOS’s component
    libraries help you structure applications and build reusable abstractions (libraries,
    services, device drivers). Remember to check www.tinyos.net for the latest developments
    and documentation on TinyOS and nesC.


    Now it’s up to you to go and write some useful and interesting sensor network
    applications!'
