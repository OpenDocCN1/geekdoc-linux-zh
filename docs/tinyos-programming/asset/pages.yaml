- pgno: 268
  md: "Note that you must start dissemination by calling DisseminationC.StdControl.\
    \ Further details on dissemination can be found in TEP 118: Dissemination [18].\n\
    \n# A.2.4 Binary reprogramming\n\nThe fourth common communication abstraction\
    \ is binary reprogramming. This is not really a abstraction, in that an application\
    \ doesn’t actively send packets using it. Instead, it is a service that automatically\
    \ runs. It enables an administrator to install new binary images in a TinyOS network.\
    \ These binaries are stored on flash, and can be installed. Note that if a new\
    \ image doesn’t have binary reprogramming installed, then you can’t uninstall\
    \ it!\n\nDeluge, found in tos/lib/net/Deluge, is the standard binary dissemination\
    \ implementation [9]. It builds on top of basic dissemination to install large\
    \ (many kB) data items. Rather than have TinyOS APIs for controlling its behavior,\
    \ Deluge comes with command line tools that inject the necessary packets into\
    \ a network. Please refer to the Deluge manual in the TinyOS documentation for\
    \ more details.\n\n# A.3 Time\n\nTinyOS has two timer interfaces: Timer, which\
    \ is synchronous and operates in task context, and Alarm, which is asynchronous\
    \ and involves directly handling a hardware interrupt. For the most part, applications\
    \ use Timer. Some low-level systems (such as MAC protocols) or applications that\
    \ require precise timing use Alarm. Additionally, nodes can access their local\
    \ time with the LocalTime interface. A node’s local time starts when it boots,\
    \ so different nodes typically do not have the same time.\n\nThe basic Timer abstraction\
    \ is TimerMilliC:\n\n```\ngeneric configuration TimerMilliC() {\n  provides interface\
    \ Timer<TMilli>;\n}\n```\n\nLocal time can be obtained from LocalTimeMilliC:\n\
    \n```\nconfiguration LocalTimeMilliC {\n  provides interface LocalTime<TMilli>;\n\
    }\n```\n\nBecause Alarm is typically a HAL, rather than HIL, abstraction (Chapter\
    \ 12), there is no standard component that provides Alarm. We covered timing in\
    \ Section 6.1 and Chapter 13. Further details on timers and time can be found\
    \ in TEP 102: Timers [25].\n\n# A.4 Sensing\n\nSensors in TinyOS follow a naming\
    \ convention described in TEP 109: Sensors and Sensor Boards [5]. Typically, they\
    \ are named after the actual sensor chip. Therefore,"
  merge: -1
  img_proc: true
- pgno: 269
  md: "there are almost no \"standard\" sensor component names, as the set of a sensors\
    \ a node might have depends on its hardware. However, TEP 109 also describes what\
    \ interfaces sensors should provide, so that it's typically easy to write code\
    \ independently of the exact sensor.\n\nSensors normally provide one or more of\
    \ the common sensing interfaces described in TEP 114: SIDs: Source and Sink Independent\
    \ Drivers [28].\n\nTinyOS provides two \"fake\" sensors, which are completely\
    \ software. The first, ConstantSensorC, takes a constant as a parameter and always\
    \ returns that value. The second, SineSensorC, returns a value from a sine function\
    \ whose input increments on each sample. Platforms also have a DemoSensorC, which\
    \ either instantiates one of these software sensors or is a wrapper around a hardware-specific\
    \ sensor.\n\n```\ngeneric module ConstantSensorC(typedef width_t @integer(), uint32_t\
    \ val) {\n  provides interface Read<width_t>;\n}\n```\n\n```\ngeneric module SineSensorC()\
    \ {\n  provides interface Read<uint16_t>;\n}\n```\n\n```\ngeneric configuration\
    \ DemoSensorC() {\n  provides interface Read<uint16_t>;\n}\n```\n\nWe covered\
    \ sensors in Section 6.2 and Chapter 13.\n\n# A.5 Storage\n\nTinyOS provides three\
    \ basic storage abstractions. Config storage is for small, random-access variables,\
    \ such as configuration constants. Log storage is for append-only writing and\
    \ random-access, sequential reading. Block storage is for large, random-access\
    \ data items. Section 6.5 has more details on their use and tradeoffs.\n\nTinyOS\
    \ has scripts that generate a layout of named storage volumes from an XML specification.\
    \ A layout is essentially the offset where each volume starts and its length.\
    \ Storage clients take a volume ID as a parameter, which allows it to access these\
    \ generated constants. For more details, refer to TEP 103: Permanent Data Storage\
    \ (Flash) [4].\n\n```\ngeneric configuration BlockStorageC( volume_id_t volume_id\
    \ ) {\n  provides interface BlockRead;\n  provides interface BlockWrite;\n  provides\
    \ interface StorageMap;\n}\n```\n\n```\ngeneric configuration LogStorageC( volume_id_t\
    \ volume_id, bool circular ) {\n  provides interface LogRead;\n  provides interface\
    \ LogWrite;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 270
  md: "```\ngeneric configuration ConfigStorageC( volume_id_t volume_id ) {\n    provides\
    \ interface Mount;\n    provides interface ConfigStorage;\n}\n```\n\nBecause flash\
    \ storage implementations are chip-specific, you usually find them in a tos/chips\
    \ directory. For example, the mica family of nodes has an AT45DB-family flash\
    \ chip: when you use one of the above abstractions on a mica, you use the components\
    \ in tos/chips/at45db.\n\n# A.6 Data structures\n\nTinyOS has component implementations\
    \ of a few commonly used data structures. All of these can be found in tos/system.\n\
    \n# A.6.1 BitVectorC\n\nBitVectorC provides the abstraction of a bit vector. It\
    \ takes a single parameter, the width of the vector. The BitVector interface has\
    \ commands for getting, setting, clearing, and toggling individual bits or all\
    \ of the bits at once. Because of nesC’s heavy inlining, using BitVectorC is preferable\
    \ to writing your own bit vector macros within a component. BitVectorC allocates\
    \ ⌈N/8⌉ bytes for an N-bit wide vector.\n\n```\ngeneric module BitVectorC(uint16_t\
    \ max_bits) {\n    provides interface BitVector;\n}\n```\n\n# A.6.2 QueueC\n\n\
    QueueC provides the abstraction of a queue of items with a fixed maximum size.\
    \ It takes two parameters: the type of the items it stores and the maximum size\
    \ of the queue. The Queue interface has commands for enqueuing items on the end\
    \ of the queue, dequeuing the head of the queue, and commands for checking the\
    \ queue size. It also allows random-access lookup: you can scan the queue.\n\n\
    ```\ngeneric module QueueC(typedef queue_t, uint8_t QUEUE_SIZE) {\n    provides\
    \ interface Queue<queue_t>;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 271
  md: "# A.6.3 BigQueueC\n\nThe uint8_t parameter to QueueC limits its maximum size\
    \ to 255. For most uses, this is sufficient and so wasting extra bytes on its\
    \ internal fields to support a larger size is not worth it. However, sometimes\
    \ components need a larger queue. The printf library, for example (page 250),\
    \ has a queue of bytes to send, which is usually longer than 255. TinyOS therefore\
    \ also has BigQueueC, which is essentially identical to QueueC except that it\
    \ has a 16-bit size parameter and provides the interface BigQueue:\n\n```\ngeneric\
    \ module BigQueueC(typedef queue_t, uint16_t QUEUE_SIZE) {\n  provides interface\
    \ BigQueue<queue_t> as Queue;\n}\n```\n\n# A.6.4 PoolC\n\nPoolC is the closest\
    \ thing TinyOS has to a dynamic memory allocator. It takes two parameters: the\
    \ type of object to allocate, and how many. Components can then dynamically allocate\
    \ and free these objects to the pool. But as the maximum pool size is set at compile-time,\
    \ a memory leak will cause the pool to empty, rather than cause the heap and stack\
    \ to collide.\n\nBecause it does the allocation, you specify a type to PoolC,\
    \ but its commands use pointers to that type. For example, if you allocate a pool\
    \ of message_t buffers, then calls to Pool pass message_t*.\n\n```\ngeneric configuration\
    \ PoolC(typedef pool_t, uint8_t POOL_SIZE) {\n  provides interface Pool<pool_t>;\n\
    }\n```\n\nYou can swap data items between pools. For example, if you have two\
    \ separate message_t pools P1 and P2, it is OK to allocate M1 from P1 and M2 from\
    \ P2, yet free M1 into P2 and M2 into P1. This behavior is critically important\
    \ due to the buffer-swapping semantics of Receive. If a component receives a packet\
    \ it wants to forward, it allocates a buffer from its pool and returns this new\
    \ buffer to the link layer. The next packet – whose buffer came from the pool\
    \ – might go to another component, which has its own pool. So the pseudocode for\
    \ forwarding a packet looks something like this:\n\n```\nreceive(m):\n    if (!forward(m)):\n\
    \        return m\n    setHeaders(m)\n    queue.put(m)\n    m2 = pool.get()\n\
    \    return m2\n```"
  merge: -1
  img_proc: true
- pgno: 272
  md: "# A.6.5 StateC\n\nStateC provides an abstraction of a state machine. This is\
    \ useful when multiple components need to share a global state (such as whether\
    \ the subsystem is on or off).\n\n```\ngeneric configuration StateC() {\n    provides\
    \ interface State;\n}\n```\n\n# A.7 Utilities\n\nTinyOS provides components for\
    \ several commonly used functions and abstractions.\n\n# A.7.1 Random numbers\n\
    \nRandomC provide the interface Random, which components can use to generate random\
    \ numbers. RandomC also provides the interfaces Init and ParameterInit, to enable\
    \ a component to re-initialize RandomC's random seed. By default, RandomC's seed\
    \ is initialized to the node ID+1.\n\nTinyOS includes two random number generators:\
    \ RandomMlcgC (a multiplicative linear congruential generator) and RandomLfsrC\
    \ (a linear feed shift register generator). RandomLfsrC is faster, but RandomMlcgC\
    \ produces better random numbers. By default, RandomC refers to RandomMlcgC.\n\
    \n```\nconfiguration RandomC {\n    provides interface Init;\n    provides interface\
    \ ParameterInit<uint16_t> as SeedInit;\n    provides interface Random as Random;\n\
    }\n```\n\n```\nconfiguration RandomMlcgC {\n    provides interface Init;\n   \
    \ provides interface ParameterInit<uint16_t> as SeedInit;\n    provides interface\
    \ Random as Random;\n}\n```\n\n```\nconfiguration RandomLfsrC {\n    provides\
    \ interface Init;\n    provides interface ParameterInit<uint16_t> as SeedInit;\n\
    \    provides interface Random as Random;\n}\n```\n\n# A.7.2 Leds\n\nLedsC provides\
    \ an abstraction of three LEDs. While some platforms have more or fewer than three,\
    \ the Leds interface has three for historical reasons. Also, breaking up the LEDs"
  merge: -1
  img_proc: true
- pgno: 273
  md: "into three instances of the same interface would be a lot of extra wiring.\
    \ In addition to LedsC, there is also a NoLedsC, which can be dropped in as a\
    \ null replacement: calls to NoLedsC do nothing.\n\n```\nconfiguration LedsC {\n\
    \  provides interface Leds;\n}\n```\n\n```\nconfiguration NoLedsC {\n  provides\
    \ interface Leds;\n}\n```\n\n# A.7.3 Cyclic redundancy checks\n\nCyclic redundancy\
    \ checks (CRCs) are a simple way to check whether a piece of data has been corrupted.\
    \ After the data, you append a CRC. Someone reading the data can recompute the\
    \ CRC over the data and check that it matches the appended CRC. If the two do\
    \ not match, there is a bit error either in the data or the CRC itself. Since\
    \ the CRC is usually much shorter than the data, the assumption is the data has\
    \ been corrupted. CRCs are heavily used in networking, to check the validity of\
    \ a packet. Of course, since CRCs are shorter than the data itself, it’s possible,\
    \ but unlikely, for a corrupted packet to pass a CRC check.\n\nCRC values are\
    \ distinct from cryptographic hashes. CRCs are intended to detect bursts of bit\
    \ errors. Typically, an n-bit CRC can always detect a single error burst that\
    \ is shorter than n bits. In contrast, cryptographically strong hashes have entropy\
    \ properties that make detecting (or failing to detect) any kind of error uniformly\
    \ likely.\n\n```\nmodule CrcC {\n  provides interface Crc;\n}\n```\n\nThe module\
    \ CrcC can be found in tos/system.\n\n# A.7.4 Printf\n\nSometimes, when debugging,\
    \ it can very useful to have a mote send simple text messages. TinyOS has a printf\
    \ library – like the C standard library function – for this purpose. You can use\
    \ printf in your components, and the printf library will send appropriate packets\
    \ over the serial port. You must start the printf library via PrintfC’s SplitControl.start.\n\
    \n```\nconfiguration PrintfC {\n  provides (\n    interface SplitControl as PrintfControl;\n\
    \    interface PrintfFlush;\n  )\n}\n```\n\nFor more details on using the printf\
    \ library, refer to the tutorial on the TinyOS website."
  merge: -1
  img_proc: true
- pgno: 274
  md: '# A.8 Low power


    For the most part, TinyOS will automatically put systems and hardware into the
    lowest power state possible. For peripherals, this typically works through power
    locks (Section 11.2). For example, when an application writes or reads from a
    flash chip, TinyOS will automatically power it on, perform the operation, then
    power it down when done.


    Communication is the major exception to this behavior. Because communication subsystems,
    such as the radio and serial port, need to be able to receive as well as transmit,
    TinyOS needs an application to explicitly tell it when it can safely turn them
    on and off via SplitControl interfaces.


    In the case of the radio, however, there are many techniques one can use to save
    power. For example, rather than always keep the radio on, TinyOS can keep it off
    most of the time, periodically turning it on just long enough to hear if there’s
    a packet. A transmitter sends a packet multiple times, until the receiver wakes
    up, hears it, and acknowledges it, or a timeout occurs.


    A complete discussion of how to set these intervals is beyond the scope of the
    book. The important interface is LowPowerListening, which some (but not all) radios
    provide. LowPowerListening allows an application to set a radio’s check interval
    and also the check interval it expects of a receiver. TinyOS has a tutorial for
    how to use this interface when writing a low-power application, and Section 12.2.3
    has a brief example of its use.'
  merge: -1
  img_proc: true
