  md: "# 4.4.1 Fan-in and fan-out\n\nThis ability to multiply wire might seem strange.\
    \ In this case, you have a single call point, CC2420TransmitterC's Init.init,\
    \ which fans-out to two callees. There are also fan-ins, which are really just\
    \ a fancy name for \"multiple people call the same function.\" But the similarity\
    \ of the names \"fan-in\" and \"fan-out\" is important, as nesC interfaces are\
    \ bidirectional. For example, coming from C, wiring two components to RandomC.Random\
    \ doesn't seem strange: two different components might need to generate random\
    \ numbers. In this case, as Random only has commands, all of the functions are\
    \ fan-in. There are multiple callers for a single callee, just like a library\
    \ function.\n\nBut as nesC interfaces are bidirectional, if there is fan-in on\
    \ the command of an interface, then when that component signals an event on the\
    \ interface, there is fan-out (multiple callees). Take, for example, the power\
    \ control interfaces, StdControl and SplitControl. StdControl is single-phase:\
    \ it only has commands. SplitControl, as its name suggests, is split-phase: the\
    \ commands have completion events:\n\n```\ninterface StdControl {\n  command error_t\
    \ start();\n  command error_t stop();\n}\ninterface SplitControl {\n  command\
    \ error_t start();\n  event void startDone(error_t error);\n  command error_t\
    \ stop();\n  event void stopDone(error_t error);\n}\n```\n\nListing 4.18 StdControl\
    \ and SplitControl initialization interfaces\n\nWith StdControl, the service is\
    \ started (stopped) by the time start (stop) returns, while with SplitControl,\
    \ the service is only guaranteed to have started when startDone is signaled.\n\
    \nIn this wiring, there is fan-in on StdControl:\n\n```\ncomponents A, B, C;\n\
    A.StdControl -> C;\nB.StdControl -> C;\n```\n\nThen either A or B can call StdControl\
    \ to start or stop C. However, in this wiring, there are also completion events,\
    \ hence both fan-in and fan-out on SplitControl:\n\n```\ncomponents A, B, C;\n\
    A.SplitControl -> C;\nB.SplitControl -> C;\n```\n\nEither A or B can call SplitControl.start.\
    \ When C issues the SplitControl.startDone event, though, both of them are wired\
    \ to it, so both A's SplitControl.startDone and B's"
