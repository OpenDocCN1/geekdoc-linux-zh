    Listing 2.6 Powerup with blinking LED in nesC (slightly simplified)


    The BlinkC module starts the periodic 250 ms timer when it boots. The connection
    between the startPeriodic command that starts the timer and the fired event which
    blinks the LED is implicitly specified by having the command and event in the
    same interface:


    ```

    interface Timer {

    command void startPeriodic(uint32_t interval);

    event void fired();

    ...

    }

    ```


    Finally, this Timer must be connected to a component that provides an actual timer.
    BlinkAppC wires BlinkC.Timer to a newly allocated timer MyTimer:


    ```

    configuration BlinkAppC { implementation { components MainC, LedsC, new TimerC()
    as MyTimer, BlinkC; BlinkC.Boot -> MainC.Boot; BlinkC.Leds -> LedsC.Leds; BlinkC.Timer
    -> MyTimer.Timer; } }

    ```


    Listing 2.7 Powerup with blinking LED configuration (slightly simplified)


    In the C version the callback from the timer to the application is a run-time
    argument to the timer_start_periodic function. The timer implementation stores
    this function pointer in the mytimer variable that holds the timer''s state, and
    performs an indirect function call each time the timer fires. Conversely, in the
    nesC version, the connection between the timer and the Blink application is specified
    at compile-time in BlinkAppC. This avoids the need to store a function pointer
    (saving precious RAM), and allows the nesC compiler to perform optimizations (in
    particular, inlining) across callbacks.


    # 2.4 Summary


    Table 2.1 summarizes the difference in how programs are structured in C, C++ and
    nesC. In C, the typical high-level programming unit is the file, with an associated
    header file that specified and documents the file''s behavior. The linker builds
    applications out of files by matching global names; where this is not sufficient
    to express program structure (e.g. for callbacks), the programmer can use function
    pointers to delay the decision of which function is called at what point.'
