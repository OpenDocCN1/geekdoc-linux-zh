- pgno: 86
  md: "The hardware-independent ActiveMessageC doesn’t export CC2420Packet, RadioBackoff,\
    \ LowPowerListening, or PacketLink. What ActiveMessageC does is a very common\
    \ use of configurations. ActiveMessageC adds no functionality: all it does is\
    \ export CC2420ActiveMessageC’s interfaces and therefore give them different,\
    \ alternative names in the global namespace. Calling CC2420ActiveMessageC’s AMSend.send\
    \ is the same as calling ActiveMessageC’s AMSend.send. The difference lies in\
    \ the kinds of assumptions the caller can make. For example, it’s possible that\
    \ if you wired a component to ActiveMessageC.AMSend and CC2420ActiveMessageC.CC2420Packet,\
    \ you might run into serious problems. It might be that a platform has two radios,\
    \ one of which is a CC2420, but ActiveMessageC doesn’t refer to the CC2420. In\
    \ this case, the component would access protocol fields that don’t exist, and\
    \ chaos is guaranteed.\n\n> Programming Hint 13 WHEN USING LAYERED ABSTRACTIONS,\
    \ COMPONENTS SHOULD NOT WIRE ACROSS MULTIPLE ABSTRACTION LAYERS: THEY SHOULD WIRE\
    \ TO A SINGLE LAYER.\n\n# 4.4 Multiple wirings\n\nNot all wirings are one-to-one.\
    \ For example, this is part of the component CC2420TransmitC, a configuration\
    \ that encapsulates the transmit path of the CC2420 radio:\n\n```\nconfiguration\
    \ CC2420TransmitC {\n  provides interface Init;\n  provides interface AsyncControl;\n\
    \  provides interface CC2420Transmit;\n  provides interface CsmaBackoff;\n  provides\
    \ interface RadioTimeStamping;\n}\nimplementation {\n  components CC2420TransmitP;\n\
    \  components AlarmMultiplexC as Alarm;\n  Init = Alarm;\n  Init = CC2420TransmitP;\n\
    \  // further wirings elided\n}\n```\n\nListing 4.17 Fan-out on CC2420TransmitC’s\
    \ Init\n\nThis wiring means that CC2420TransmitC.Init maps both to Alarm.Init\
    \ and CC2420TransmitP.Init. What does that mean? There certainly isn’t any analogue\
    \ in C-like languages. In nesC, a multiple-wiring like this means that when a\
    \ component calls CC2420TransmitC’s Init.init, it calls both Alarm’s Init.init\
    \ and CC2420TransmitP’s Init.init. The order of the two calls is not defined."
