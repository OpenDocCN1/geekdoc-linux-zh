- pgno: 65
  md: "Note, however, that using enum types in variable declarations can waste memory,\
    \ as enums default to integer width. For example, imagine this enum:\n\n```\n\
    typedef enum {\n  STATE_OFF = 0,\n  STATE_STARTING = 1,\n  STATE_ON = 2,\n  STATE_STOPPING\
    \ = 3\n} state_t;\n```\n\nHere are two different ways you might allocate the state\
    \ variable in question:\n\n```\nstate_t state; // platform int size (e.g., 2-4\
    \ bytes)\nuint8_t state; // one byte\n```\n\nEven though the valid range is 0–3,\
    \ the former will allocate a native integer, which on a microcontroller is usually\
    \ 2 bytes, but could be 4 bytes on low-power microprocessors. The second will\
    \ allocate a single byte. So you should use enums to declare constants, but avoid\
    \ declaring variables of an enum type.\n\n> Programming Hint 5 CONSERVE MEMORY\
    \ BY USING ENUMS RATHER THAN CONST VARIABLES FOR INTEGER CONSTANTS, AND DON'T\
    \ DECLARE VARIABLES WITH AN ENUM TYPE.\n\n# 3.5.3 Platform-independent types\n\
    \nTo simplify networking code, TinyOS has traditionally used structs to define\
    \ message formats and directly access messages – this avoids the programming complexity\
    \ and overheads of using marshalling and unmarshalling functions to convert between\
    \ host and network message representations. For example, the standard header of\
    \ a packet for the CC2420 802.15.4 wireless radio chip² looks something like this:\n\
    \n```\ntypedef struct cc2420_header_t {\n  uint8_t length;\n  uint16_t fcf;\n\
    \  uint8_t dsn;\n  uint16_t destpan;\n  uint16_t dest;\n  uint16_t src;\n  uint8_t\
    \ type;\n} cc2420_header_t;\n```\n\nListing 3.30 CC2420 packet header\n\nThat\
    \ is, it has a 1-byte length field, a 2-byte frame control field, a 1-byte sequence\
    \ number, a 2-byte group, a 2-byte destination, a 2-byte source, and 1-byte type\
    \ fields. Defining this as a structure allows you to easily access the fields,\
    \ allocate storage, etc.\n\n² Standard in that IEEE 802.15.4 has several options,\
    \ such as 0-byte, 2-byte, or 8-byte addressing, and so this is just the format\
    \ TinyOS uses by default."
  merge: -1
  img_proc: true
- pgno: 66
  md: "The problem, though, is that the layout and encoding of this structure depends\
    \ on the chip you’re compiling for. For example, the CC2420 expects all of these\
    \ fields to be little-endian. If your microcontroller is big-endian, then you\
    \ won’t be able to easily access the bits of the frame control field. One commonly\
    \ used solution to this problem is to explicitly call macros that convert between\
    \ the microcontroller and the chip’s byte order, e.g. macros like Unix’s htons,\
    \ ntohl, etc. However, this approach is error-prone, especially when code is initially\
    \ developed on a processor with the same byte order as the chip.\n\nAnother problem\
    \ with this approach is due to differing alignment rules between processors. On\
    \ an ATmega128, the structure fields will be aligned on 1-byte boundaries, so\
    \ the layout will work fine. On an MSP430, however, 2-byte values have to be aligned\
    \ on 2-byte boundaries: you can’t load an unaligned word. So the MSP430 compiler\
    \ will introduce a byte of padding after the length field, making the structure\
    \ incompatible with the CC2420 and other platforms. There are a couple of other\
    \ issues that arise, but the eventual point is the same: TinyOS programs need\
    \ to be able to specify platform-independent data formats that can be easily accessed\
    \ and used.\n\nIn TinyOS 1.x, some programs attempted to solve this problem by\
    \ using gcc’s packed attribute to make data structures platform independent. Packed\
    \ tells gcc to ignore normal platform struct alignment requirements and instead\
    \ pack a structure tightly:\n\n```\ntypedef struct RPestEntry {\n    uint16_t\
    \ id;\n    uint8_t receiveEst;\n} __attribute__((packed)) RPestEntry;\n```\n\n\
    Listing 3.31 The dreaded \"packed\" attribute in the 1.x MintRoute library\n\n\
    Packed allowed code running on an ATmega128 and on an x86 to agree on data formats.\
    \ However, packed has several problems. The version of gcc for the MSP430 family\
    \ (used in Telos motes) doesn’t handle packed structures correctly. Furthermore,\
    \ packed is a gcc-specific feature, so code that uses it is not very portable.\
    \ And finally, while packed eliminates alignment differences, it does not change\
    \ endianness: int16_t maybe be big-endian on one platform and little-endian on\
    \ another, so you would still have to use conversion macros like htons.\n\nProgramming\
    \ Hint 6 NEVER, EVER USE THE \"PACKED\" ATTRIBUTE IN PORTABLE CODE.\n\nTo keep\
    \ the convenience of specifying packet layouts using C types while keeping code\
    \ portable, nesC 1.2 introduced platform-independent types. Simple platform-independent\
    \ types (integers) are either big-endian or little-endian, independently of the\
    \ underlying chip hardware. Generally, an external type is the same as a normal\
    \ type except that it has nx_ or nxle_ preceding it:\n\n```\nnx_uint16_t val;\
    \ // A big-endian 16-bit value\nnxle_uint32_t otherVal; // A little-endian 32-bit\
    \ value\n```"
  merge: -1
  img_proc: true
- pgno: 67
  md: "In addition to simple types, there are also platform-independent structs and\
    \ unions, declared with **nx_struct** and **nx_union**. Every field of a platform-independent\
    \ struct or union must be a platform-independent type. Non-bitfields are aligned\
    \ on byte boundaries (bitfields are packed together on bit boundaries, as usual).\
    \ For example, this is how TinyOS 2.0 declares the CC2420 header:\n\n```\ntypedef\
    \ nx_struct cc2420_header_t {\n  nxle_uint8_t length;\n  nxle_uint16_t fcf;\n\
    \  nxle_uint8_t dsn;\n  nxle_uint16_t destpan;\n  nxle_uint16_t dest;\n  nxle_uint16_t\
    \ src;\n  nxle_uint8_t type;\n} cc2420_header_t;\n```\n\nListing 3.32  The CC2420\
    \ header\n\nAny hardware architecture that compiles this structure uses the same\
    \ memory layout and the same endianess for all of the fields. This enables platform\
    \ code to pack and unpack structures, without resorting to macros or utility functions\
    \ such as UNIX socket htonl and ntohs.\n\n> **Programming Hint 7**  USE PLATFORM-INDEPENDENT\
    \ TYPES WHEN DEFINING MESSAGE STRUCTURES.\n\nUnder the covers, nesC translates\
    \ network types into byte arrays, which it packs and unpacks on each access. For\
    \ most nesC codes, this has a negligible run-time cost. For example, this code\n\
    \n```\nnx_uint16_t x = 5;\nuint16_t y = x;\n```\n\nrearranges the bytes of x into\
    \ a native chip layout by y, taking a few cycles. This means that if you need\
    \ to perform significant computation on arrays of multibyte values (e.g. encryption),\
    \ then you should copy them to a native format before doing so, then move them\
    \ back to a platform-independent format when done. A single access costs a few\
    \ cycles, but thousands of accesses costs a few thousand cycles.\n\n> **Programming\
    \ Hint 8**  IF YOU HAVE TO PERFORM SIGNIFICANT COMPUTATION ON A PLATFORM-INDEPENDENT\
    \ TYPE OR ACCESS IT MANY (HUNDREDS OR MORE) TIMES, TEMPORARILY COPY IT TO A NATIVE\
    \ TYPE.\n\n# 3.5.4  Global names\n\nComponents encapsulate functions and state,\
    \ and wiring connects functions defined in different components. However, nesC\
    \ programs also need globally available types for common abstractions, such as\
    \ error_t (TinyOS’s error code abstraction) or message_t"
  merge: -1
  img_proc: true
- pgno: 68
  md: "(networking buffers). Furthermore, nesC programs sometimes call existing C\
    \ library functions, either from the standard C library (e.g. mathematical functions\
    \ like sin) or functions from a personal library of existing C code (see Section\
    \ 3.5.6).\n\nIn keeping with C, nesC uses .h header files and #include for this\
    \ purpose. This has the added advantage that existing C header files can be directly\
    \ reused. For instance, TinyOS’s error_t type and error constants are defined\
    \ in the TinyError.h file:\n\n```\n#ifndef TINY_ERROR_H_INCLUDED\n#define TINY_ERROR_H_INCLUDED\n\
    \nenum {\n  SUCCESS      = 0,\n  FAIL         = 1,  // Generic condition; backwards\
    \ compatible\n  ESIZE        = 2,  // Parameter passed in was too big.\n  ECANCEL\
    \      = 3,  // Operation cancelled by a call.\n  EOFF         = 4,  // Subsystem\
    \ is not active\n  EBUSY        = 5,  // The underlying system is busy; retry\
    \ later\n  EINVAL       = 6,  // An invalid parameter was passed\n  ERETRY   \
    \    = 7,  // A rare and transient failure; can retry\n  ERESERVE     = 8,  //\
    \ Reservation required before usage\n  EALREADY     = 9,  // The device state\
    \ you are requesting is already set\n};\n\ntypedef uint8_t error_t;\n#endif\n\
    ```\n\nListing 3.33 TinyError.h, a typical nesC header file\n\nLike a typical\
    \ C header file, TinyError.h uses #ifndef/#define to avoid redeclaring the error\
    \ constants and error_t when the file is included multiple times. Including a\
    \ header file in a component is straightforward:\n\n```\n#include \"TinyError.h\"\
    \n\nmodule BehaviorC { ... }\nimplementation\n{\n  error_t ok = FAIL;\n}\n```\n\
    \nListing 3.34 Including a header file in a component\n\nJust as in C, #include\
    \ just performs textual file inclusion. As a result it is important to use #include\
    \ in the right place, i.e. before the interface, module, or configuration keyword.\
    \ If you don’t, you won’t get the behavior you expect. Similarly, in C, using\
    \ #include <stdio.h> in the middle of a function is not likely to work."
