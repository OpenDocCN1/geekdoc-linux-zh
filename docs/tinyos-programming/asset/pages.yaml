    can be reprogrammed without needing to collect all of the nodes. However, these
    four abstractions – power control, timers, sensors, and data collection – encompass
    the entire datapath of the application.


    # 1.4 Compiling and installing applications


    You can download the latest TinyOS distribution, the nesC compiler, and other
    tools at www.tinyos.net. Setting up your programming environment is outside the
    scope of this book; the TinyOS website has step-by-step tutorials to get you started.
    One part of TinyOS is an extensive build system for compiling applications. Generally,
    to compile a program for a sensor platform, one types make <platform>, e.g. make
    telosb. This compiles a binary. To install that binary on a node, you plug the
    node into your PC using a USB or serial connection, and type make <platform> install.
    The tutorials go into compilation and installation options in detail.


    # 1.5 The rest of this book


    The rest of this book goes into how to program in nesC and write TinyOS applications.
    It is divided into three parts. The first is a short introduction to the major
    programming concepts of nesC. The second part addresses basic application programming
    using standard TinyOS APIs. The third part is a little deeper, and looks into
    how those TinyOS APIs are implemented. For example, the third part describes how
    TinyOS abstracts hardware, so you can write a driver for a new sensor.


    Chapter by chapter, the book is structured as follows:


    +   - **Chapter 1** is this chapter.

    +   - **Chapter 2** describes the major way that nesC breaks from C and C-like
    languages: how programs are built out of components, and how components and interfaces
    help manage programs’ namespaces.

    +   - **Chapter 3** presents components and how they interact via interfaces.

    +   - **Chapter 4** goes into greater detail into configurations, components which
    connect other components together.

    +   - **Chapter 5** covers the basic TinyOS execution model and gives guidance
    on how and when to use tasks.'
