- pgno: 233
  md: 'micaz – varies from platform to platform. As a result, these components belong
    to the HAL rather than the HIL. However, the use of the same names and interfaces
    across platforms does simplify writing reasonably portable code with timing requirements
    that cannot be satisfied by the fully portable TimerMilliC component. Finally,
    as the figure shows, timers 1 and 3 are dedicated to supporting the micaz’s HAL
    layer, but timer 2 is unused and available to an application that needs it.


    # 12.1.2 Portability


    While a program or component that uses only device drivers that are part of the
    HIL could be viewed as being “fully” portable, the reality is more complex. Different
    motes have different hardware resources, and hence end up supporting different
    HILs: for instance, a hypothetical “Ghost” mote without a flash chip or other
    form of permanent storage will not support the log storage abstraction of Section
    6.5.3. Therefore, the FlashSampler application from Section 6.5.3 would not be
    portable to “Ghost” motes.


    In contrast, the anti-theft application from the first part of Chapter 6 depends
    on a light sensor component (PhotoC) and an accelerometer component (AccelXStreamC)
    which are not part of the HIL – these two components are specific to a particular
    sensor board (mts310) for a particular platform (micaz). However, the anti-theft
    code accesses these components via hardware independent interfaces (Read and ReadStream
    respectively), so is fairly easy to port to a different mote as long as it provides
    equivalent sensors: only the sensor component names and detection thresholds (DARK_THRESHOLD
    and ACCEL_VARIANCE) should need changing.


    In summary, applications that use only HIL components, or access HAL components
    via hardware-independent interfaces should be easily portable to motes which meet
    the application’s hardware requirements. The more the application accesses HAL
    or HPL components, especially via hardware-specific interfaces, the harder it
    becomes to port.


    # 12.2 Device drivers


    A TinyOS program can choose to access a particular hardware device via its HPL,
    HAL, and HIL components. However, not all devices have or need HIL components:
    if a device exists on only one platform or sensor board and does not much resemble
    any other device, then it is unlikely that anyone will have written a device-independent
    HIL specification. Additionally, some hardware does not really offer any hardware-independent
    interface. For instance, the behavior and configuration of an A/D converter is
    intimately tied to the specific analogue sensor which is connected to the converter.
    As a result, there is no real hardware-independent A/D interface, and hence no
    A/D HIL.'
  merge: -1
  img_proc: true
- pgno: 234
  md: "multiple clients, i.e. perform access control, and in how they manage power\
    \ usage. In the rest of this chapter, we examine these last two issues in greater\
    \ detail.\n\n# 12.2.1    Access control\n\nDevice drivers need to perform access\
    \ control to prevent problems when multiple parts of a program try to access the\
    \ same device (because TinyOS only runs a single application, access control across\
    \ applications is not an issue). For instance, the ATmega128 A/D converter can\
    \ only sample one channel at a time, so in a program where the radio needs to\
    \ check signal strength on the antenna and the user’s code needs to sample the\
    \ current temperature, some coordination will be needed to avoid the radio and\
    \ the user’s code corrupting each other’s requests.\n\nTinyOS 1.x mostly relied\
    \ on detecting conflicts and programmer discipline to deal with access control\
    \ issues. For instance, a request to perform A/D conversion would return an error\
    \ if some other part of the program was already using the A/D converter:\n\n```\n\
    /* Let's read temperature! */\nif (call ADC.getData() == FAIL)\n  /* oops, we\
    \ need to try again */\n  post tryAgain();\n```\n\nIn practice, this didn’t work.\
    \ Programmers omitted error checking, or could not figure out good error recovery\
    \ strategies. Furthermore, these error paths were unlikely (e.g. would only occur\
    \ if the radio and application actually tried to sample at the same time), so\
    \ were not well tested. Finally, the resulting code is often complex, so is hard\
    \ to get right, understand, and maintain. Evolution of the rest of the system\
    \ makes life even more complicated: user code that samples temperature without\
    \ checking the error codes will, e.g., work fine with a radio stack that does\
    \ not sample signal strength. However, if the radio stack is changed to one that\
    \ does sample signal strength, then the user’s application code may suddenly stop\
    \ working.\n\nAs a result, TinyOS 2 takes a much more systematic approach to access\
    \ control. All device driver components are expected to fit in to one of three\
    \ access control classes:\n\n+   - *Dedicated* A dedicated driver has a single\
    \ user, who has full control over device. Examples include most HPL components.\n\
    +   - *Virtualized* A virtualized driver has multiple users, each of which appears\
    \ to have its own instance of the device. However, the underlying implementation\
    \ creates this illusion by multiplexing a single underlying resource. For instance,\
    \ each instance of a TimerMilliC component is an independent timer, but they are\
    \ all implemented over a single hardware timer, as discussed in Section 9.2.1.\n\
    +   - *Shared* A shared driver has multiple users, who coordinate their use of\
    \ the device via the Resource interface (Section 11.2). The HAL components for\
    \ both of the storage chips we saw above (Atmel AT45DB041B and ST M25P) are shared\
    \ drivers."
  merge: -1
  img_proc: true
- pgno: 235
  md: "The definitions of these three classes uses the term \"user\" to informally\
    \ refer to entities like the radio stack, the user's application code, etc. In\
    \ practice, a \"user\" of a driver is ultimately some nesC module which is wired\
    \ to some component or interface representing an instance of the driver.\n\n#\
    \ 12.2.2 Access control examples\n\nA dedicated driver has a single instance,\
    \ normally a component with a specific name. HPL drivers are normally dedicated;\
    \ examples include HplAtm128Timer2C (HPL for timer 2 of the ATmega128 microcontroller),\
    \ HplMsp430I2C0C (HPL for the I²C bus 0 on the TI MSP430 microcontroller). For\
    \ example, in the following excerpt:\n\n```\nmodule HplAtm128Timer2C\n{\n  provides\
    \ interface HplAtm128Timer<uint8_t> as Timer;\n  provides interface HplAtm128TimerCtrl8\
    \ as TimerCtrl;\n  provides interface HplAtm128Compare<uint8_t> as Compare;\n\
    } implementation {\n  async command uint8_t Timer.get() { return TCNT2; }\n  async\
    \ command void Timer.set(uint8_t t) { TCNT2 = t; }\n  ...\n}\n```\n\nwe see that\
    \ HplAtm128Timer2C provides only functional interfaces (Timer, TimerCtrl, Compare)\
    \ which are very simple wrappers over the raw hardware (the TCNT2 timer 2 counter\
    \ register in this excerpt). Because there are no issues with sharing the resource\
    \ with other users, dedicated drivers offer the lowest performance and latency\
    \ overhead – operations are performed immediately and with no checking.\n\nNothing\
    \ prevents multiple users from wiring to HplAtm128Timer2C and using timer 2 in\
    \ a conflicting fashion. An HPL implementer can prevent such multiple wirings\
    \ using nesC's @atmostonce() wiring attribute (Section 8.4), e.g.:\n\n```\nprovides\
    \ interface HplAtm128Timer<uint8_t> as Timer @atmostonce();\n```\n\nHowever, using\
    \ these attributes is currently uncommon as it sometimes causes complications:\
    \ with the change above, it would no longer be possible to split code using timer\
    \ 2 into two separate (but tightly cooperating) modules that both wire to HplAtm128Timer2C.\n\
    \nDedicated drivers are not always low-level components. For instance, the ActiveMessageC\
    \ radio link layer abstraction is a dedicated driver with the following signature:\n\
    \n```\nconfiguration ActiveMessageC {\n  provides {\n    interface SplitControl;\n\
    \    interface AMSend(uint8_t id);\n    interface Receive(uint8_t id);\n    interface\
    \ Receive as Snoop(uint8_t id);\n    interface Packet;\n\n```"
  merge: -1
  img_proc: true
- pgno: 236
  md: "```\ninterface AMPacket;\ninterface PacketAcknowledgements;\n}\n```\n\n# Listing\
    \ 12.1 ActiveMessageC signature\n\nActiveMessageC provides a means of powering\
    \ the radio on and off (see the discussion of power management below) and interfaces\
    \ to send, receive, and inspect packets. However, it does not provide an easy\
    \ way for multiple users to cooperate in sending packets via the AMSend interface\
    \ – like in TinyOS 1.x, if the radio is currently sending a packet, a second send\
    \ command will simply fail with an error result (EBUSY):\n\n```\n/**\n * Send\
    \ a packet\n * @return ... EBUSY if the abstraction cannot send now but\n *  \
    \        will be able to later\n */\ncommand error_t send(am_addr_t addr, message_t*\
    \ msg, uint8_t len);\n```\n\nThe AMSenderC component we saw in Chapter 6 is a\
    \ virtualized driver built over ActiveMessageC and, like most virtualized drivers,\
    \ is a generic component:\n\n```\ngeneric configuration AMSenderC(am_id_t AMId)\
    \ {\n  provides {\n    interface AMSend;\n    interface Packet;\n    interface\
    \ AMPacket;\n    interface PacketAcknowledgements as Acks;\n  }\n}\n```\n\nAMSenderC\
    \ offers the same interfaces to send and inspect packets as ActiveMessageC, though\
    \ the id parameter to the AMSend interface has become AMSenderC’s AMId generic\
    \ component parameter. Instances of such virtualized drivers are simply created\
    \ by instantiating the generic component:\n\n```\ncomponents new AMSenderC(AM_THEFT)\
    \ as SendTheft;\nMovingC.AMSend -> SendTheft;\n...\n```\n\nThe practical difference\
    \ between AMSenderC and ActiveMessageC is that each instance of AMSenderC can\
    \ have one outstanding packet, where ActiveMessageC allowed only one outstanding\
    \ packet for the whole system – AMSenderC is virtualized while ActiveMessageC\
    \ is dedicated. In general, virtualized drivers are a lot easier to use as you\
    \ can ensure that your code always has a resource (a packet transmission slot,\
    \ a timer, etc.) available when it requires one, rather than having to deal with\
    \ sharing the resource with the rest of the system. As a result, most HIL drivers\
    \ are virtualized. However, virtualized drivers have two costs. First, managing\
    \ and selecting between the requests from all users adds some run-time overhead.\
    \ Second, the latency of any"
