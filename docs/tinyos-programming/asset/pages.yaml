- pgno: 253
  md: "# 13.3\\quad DetectorC\n\nDetectorC provides a Detector interface that detects\
    \ loud sounds. Its internal logic is very simple. First, it powers up the microphone.\
    \ Next, from the time specified in the Detector.start command it repeatedly samples\
    \ the microphone’s A/D channel until sound is above a threshold. Finally it powers\
    \ off the microphone. The microphone is powered on and off by a SplitControl interface\
    \ provided by the MicrophoneC component described below.\n\nAs we discuss below,\
    \ DetectorC uses the mica2’s HAL interface to the A/D converter. The A/D converter\
    \ is a shared driver, with access controlled by a Resource interface (Section\
    \ 11.2). Thus, when DetectorC’s start (t0, dt) command is called, it must power\
    \ up the microphone, request access to the A/D converter and schedule event detection\
    \ for local time t0+dt:\n\n```\nmodule DetectorC {\n  provides interface Detector;\n\
    \  uses interface Alarm<TMicro, uint32_t>;\n  uses interface Resource as AdcResource;\n\
    \  uses interface SplitControl as Microphone;\n  ...\n}\n\nimplementation {\n\
    \  bool granted, started; // Status of start request\n\n  command void Detector.start(uint32_t\
    \ t0, uint32_t dt) {\n    atomic granted = started = FALSE;\n    call Alarm.startAt(t0,\
    \ dt);\n    call Microphone.start();\n    call AdcResource.request();\n  }\n\n\
    \  event void AdcResource.granted() {\n    atomic granted = TRUE; // Note when\
    \ ADC granted\n  }\n\n  event void Microphone.startDone(error_t error) {\n   \
    \ atomic started = error == SUCCESS; // Note if microphone started\n  }\n\n  async\
    \ event void Alarm.fired() {\n    // It’s time to detect a loud sound. If we didn’t\
    \ get the ADC or\n    // turn on the microphone in time, report a failed event\
    \ detection.\n    atomic\n      if (granted && started)\n      {\n        call\
    \ Leds.led1On();\n        ... start detection ...\n      }\n      else\n     \
    \   post detectFailed();\n  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 254
  md: "```\ntask void detectFailed() {\n  call Leds.led0Toggle();\n  signal Detector.done(FAIL);\n\
    }\n```\n\n# Listing 13.3 DetectorC: loud sound detection for SoundLocalizer\n\n\
    DetectorC uses an Alarm<TMicro, uint32_t> interface to schedule the event detection\
    \ with microsecond precision. The Alarm interface is a low-level counterpart to\
    \ Timer:\n\n```\ninterface Alarm<precision_tag, size_type> {\n  // basic interface\n\
    \  async command void start(size_type dt);\n  async command void stop();\n  async\
    \ event void fired();\n\n  // extended interface\n  async command bool isRunning();\n\
    \  async command void startAt(size_type t0, size_type dt);\n  async command size_type\
    \ getNow();\n  async command size_type getAlarm();\n}\n```\n\n# Listing 13.4 The\
    \ Alarm interface\n\nLike Counter, Alarm takes type arguments which indicate the\
    \ precision (millisecond (TMilli), microsecond (TMicro), etc.) and width (16-bit\
    \ (uint16_t), 32-bit (uint32_t), etc.) of its time units. Alarm is similar to\
    \ the higher-level Timer interface (Section 6.1.1), except that it only offers\
    \ one-shot timers (start, startAt), its commands can all be called from interrupt\
    \ handlers, and its fired event runs in interrupt context (all the interface functions\
    \ are async).\n\nAs with Counter, TinyOS does not have a HIL component that provides\
    \ a Alarm<TMicro, uint32_t> interface, but TEP102 [25] also provides guidelines\
    \ on the names of HAL components offering Alarm interfaces. Thus the following\
    \ wiring for DetectorC should work on all platforms with a 32-bit microsecond\
    \ alarm:\n\n```\ncomponents new AlarmMicro32C() as DAlarm;\nDetectorC.Alarm ->\
    \ DAlarm;\n```\n\nNote that platforms may provide only a limited number of alarms,\
    \ e.g. the micaz only supports three 32-bit microsecond alarms – each micaz Alarm\
    \ needs its own hardware timer compare register, and the micaz’s ATmega128 microcontroller\
    \ only has three compare registers per hardware timer.\n\nBy simultaneously scheduling\
    \ the alarm, microphone power on, and A/D converter request, DetectorC.start allows\
    \ the execution of these three operations to overlap"
