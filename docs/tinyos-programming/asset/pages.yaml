  md: '![](img/53ede4f4266a5731b93bff15d85fa06a_230_0.png)


    **Figure 12.1** TinyOS’s three-level hardware abstraction architecture.


    read and write parts of the flash’s storage blocks, while automatically managing
    the flash chip’s 2 RAM buffers.


    HAL components are platform-specific, but should use hardware independent interfaces
    when possible. For instance, the Alarm interface used internally in the micaz’s
    HilTimerMilliC component (Section 9.2.1) is provided by a micaz-specific AlarmCounterMilliC
    component, but used by the portable AlarmToTimerC component that implements a
    Timer interface given an Alarm interface.


    +   - **The hardware presentation layer (HPL):** device drivers in the HPL sit
    directly above the hardware without abstracting away any of its functionality.
    The goal of HPL components is to hide irrelevant differences between similar hardware
    and to present hardware functionality in a nesC-friendly fashion. For instance,
    on the micaz platform, the HplAtm128GeneralIOC exposes the ATmega128’s 53 digital
    I/O pins as 53 GeneralIO interfaces, hiding the slightly different instruction
    sequences needed to perform some operations on some I/O pins (some I/O pins can
    be set atomically in a single assembly instruction, while others require interrupts
    to be disabled to guarantee atomicity).


    As shown in Figure 12.1, a device’s HIL is normally built on top of the device’s
    HAL, which is itself built on top of the HPL.


    The behaviour, name and specifications of TinyOS’s hardware independent layers
    are specified in TinyOS Enhancement Proposals (TEPs), and the hardware abstraction
    architecture itself is described in TEP 2 [8]. TEPs do not specify the contents
    of the HAL or HPL for any hardware, but do sometimes provide guidelines on HAL
    structure, and on the use of hardware independent interfaces in the HAL and HPL.'
