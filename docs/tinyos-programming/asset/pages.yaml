    # Listing 9.9 CC2420SpiC


    CC2420SpiC takes the implementation of the SPI protocol (CC2420SpiP) and wires
    it to the platform’s raw SPI implementation. The raw SPI implementation has two
    interfaces: SpiByte, for writing a byte as a single-phase operation, and SpiPacket,
    for writing a series of bytes as a split-phase operation. The SPI protocol is
    bidirectional. To read bytes from the chip, the stack has to write onto the bus.
    The chip also writes onto the bus, but it is clocked by the CPU’s writes. The
    write operation therefore takes a uint8_t as the byte to write, and return a uint8_t
    byte representing the reply.


    The protocol implementation uses an interesting approach to have a simple implementation
    that can also find compile-time wiring errors. While CC2420SpiC provides each
    register as a separate interface, the executable logic (CC2420SpiP) provides a
    parameterized interface:


    ```

    configuration CC2420SpiP {

    provides interface CC2420Fifo as Fifo[ uint8_t id ];

    provides interface CC2420Ram as Ram[ uint16_t id ];

    provides interface CC2420Register as Reg[ uint8_t id ];

    provides interface CC2420Strobe as Strobe[ uint8_t id ];

    }

    ```


    # Listing 9.10 CC2420SpiP


    Each CC2420 register has a unique identifier, which is a small integer. Having
    a separate implementation for each register operation wastes code space and the
    code repetition would be an easy way to introduce bugs. So CC2420SpiP has a single
    implementation, which takes a compile-time parameter, the register identifier.
    However, not all values of a uint8_t are valid registers, so allowing components
    to wire directly to the parameterized interface could lead to invalid wirings.
