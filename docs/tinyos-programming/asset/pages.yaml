    \    /* Wirings below */\n  }\n}\n```\n\nListing 3.22 Instantiating a generic\
    \ component\n\nGeneric components can take parameters, hence the parentheses in\
    \ component signatures (generic configuration TimerMilliC()) and instantiations\
    \ (components new TimerMilliC() as Timer0;). These parameters can be values of\
