- pgno: 152
  md: "# 8 Advanced components\n\nChapter 3 introduced components to a level of detail\
    \ sufficient for building applications. This chapter presents more advanced component\
    \ topics than implementing services typically requires, such as writing generic\
    \ components and using parameterized interfaces.\n\n# 8.1 Generic components review\n\
    \nGeneric components (introduced in Section 3.3.4) provide code reuse through\
    \ a code-copying mechanism: each instance of a generic component is effectively\
    \ a new (non-generic) component with the parameter values substituted in. For\
    \ instance, instantiating BitVectorC\n\n```\ngeneric module BitVectorC(uint16_t\
    \ maxBits) {\n  provides interface Init;\n  provides interface BitVector;\n}\n\
    implementation {\n  uint8_t bits[(maxBits + 7) / 8];\n  ...\n}\n```\n\n```\nwith\n\
    configuration MyAppC { }\nimplementation {\n  components new BitVectorC(77) as\
    \ MyVector, MyAppP;\n  MyAppP.BitVector -> MyVector;\n}\n```\n\nis effectively\
    \ the same as creating a copy of BitVectorC.nc with maxBits=77:\n\n```\nmodule\
    \ MyVector {\n  provides interface Init;\n  provides interface BitVector;\n}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 153
  md: "```\nimplementation {\n    uint8_t bits[(77 + 7) / 8];\n    ...\n}\n```\n\n\
    Generic components use a code-copying approach for two reasons: simplicity and\
    \ types. If generic modules did not use a code-copying approach, then there would\
    \ be a single copy of the code that works for all instances of the component.\
    \ This is difficult when a generic component can take a type as an argument, as\
    \ allocation size, offsets, and other considerations can make a truly single copy\
    \ infeasible. Even non-type arguments can create such problems, as they can be\
    \ used to specify array sizes, switch case values, etc. For similar reasons, C++\
    \ templates create a copy of code for each different set of template arguments.\n\
    \nFinally, even when it would be possible to share code across instances, it would\
    \ require adding an argument, similar to the this pointer of object-oriented languages,\
    \ to all of the functions. This argument would indicate which instance is executing.\
    \ Additionally, all variable accesses would have to offset from this pointer.\
    \ In essence, the execution time and costs of functions might change significantly\
    \ (offsets rather than constant accesses). In order to provide simple, easy to\
    \ understand and run-time efficient components, nesC uses a code-copying approach,\
    \ sacrificing possible reductions in code size.\n\nCode-copying applies to configurations\
    \ as well as modules. Copying a module copies executable code and variables into\
    \ the final application. Copying a configuration copies component and wiring statements,\
    \ possibly leading to further component instantiations:\n\n```\ngeneric configuration\
    \ DoubleBitVectorC(uint16_t maxBits) {\n    provides interface Init;\n    provides\
    \ interface BitVector as Bits1;\n    provides interface BitVector as Bits2;\n\
    }\nimplementation {\n    components new BitVector(maxBits) as BV1;\n    components\
    \ new BitVector(maxBits) as BV2;\n\n    Init = BV1; // Calling Init.init initializes\n\
    \    Init = BV2; // both bitvectors\n    Bits1 = BV1;\n    Bits2 = BV2;\n}\n```\n\
    \nListing 8.1 Instantiation within a generic configuration\n\nInstantiating DoubleBitVectorC\
    \ will create, and wire, two bit vectors. In summary, a generic module defines\
    \ a piece of repeatable executable logic, while a generic configuration defines\
    \ a repeatable pattern of composition between components. As Chapter 9 will show,\
    \ generic configurations can be very powerful and are often the most intricate\
    \ part of service implementations."
  merge: -1
  img_proc: true
- pgno: 154
  md: "Unlike standard components, generics can only be named by the configuration\
    \ that instantiates them. For example, in the case of MyAppC, no other component\
    \ can wire to the BitVectorC that it instantiates. The generic is private to MyAppC.\
    \ The only way it can be made accessible is to wire its interfaces – in the case\
    \ of MyAppC, the bit vector is made accessible to MyAppP only. One way to make\
    \ an instance generally available is to create a singleton configuration and exporting\
    \ the necessary interfaces. For example, let’s say you needed a bit vector to\
    \ keep track of which of 37 system services are running or not. You want many\
    \ components to be able to access this vector, but BitVectorC is a generic. So\
    \ you write a component like this:\n\n```\nconfiguration SystemServiceVectorC\
    \ {\n  provides interface BitVector;\n}\nimplementation {\n  components MainC,\
    \ new BitVectorC(37);\n  MainC.SoftwareInit -> BitVectorC;\n  BitVector = BitVectorC;\n\
    }\n```\n\nListing 8.2 The fictional component SystemServiceVectorC\n\nNow many\
    \ components can refer to this particular bit vector. SystemServiceVectorC could\
    \ have exported BitVectorC.Init rather than wiring it to MainC, but that would\
    \ have just required this wiring to be performed elsewhere. While you can make\
    \ a singleton out of a generic by instantiating it within one, the opposite is\
    \ not true: a component is either instantiable or not.\n\n# 8.2 Writing generic\
    \ modules\n\nAs the examples above showed, the body of a generic module (configuration)\
    \ is simply a module (configuration) which can use the generic’s arguments as\
    \ types, constants, etc. Another example is the queue implementation, QueueC:\n\
    \n```\ngeneric module QueueC(typedef queue_t, uint8_t queueSize) {\n  provides\
    \ interface Queue<queue_t>;\n}\nimplementation {\n  queue_t queue[queueSize];\n\
    \  uint8_t head = 0, tail = 0, size = 0;\n\n  command queue_t Queue.head() {\n\
    \    return queue[head];\n  }\n  ...\n```\n\nListing 8.3 QueueC excerpt"
  merge: -1
  img_proc: true
- pgno: 155
  md: "QueueC uses queue_t like a regular C type, declaring an array (queue) and returning\
    \ a queue_t value (Queue.head). The queueSize parameter behaves like a C constant,\
    \ so can be used to size the queue array.\n\n# 8.2.1 Type arguments\n\nUnlike\
    \ C++ templates, generic components are type-checked when they are declared. By\
    \ default, the only operations allowed on type arguments are declaring variables\
    \ and copying values. For instance, you can do\n\n```\nqueue_t x, y;\nx = y;\n\
    ```\n\nbut not\n\n```\nqueue_t x, y;\nx = y + 1;\n```\n\nas nesC would not know\
    \ what this meant if, e.g. queue_t was a C structure.\n\nHowever, some components\
    \ have type arguments that only make sense as some kind of integer (signed 8-bit\
    \ integer, unsigned 32-bit integer, etc). For those cases, generic component type\
    \ parameters can be suffixed with @integer() to allow the use of integer operations\
    \ on values of that type. For instance, this ConstantSensorC component is a generic\
    \ implementation of Read returning a constant value:\n\n```\ngeneric module ConstantSensorC(typedef\
    \ width_t @integer(), uint32_t val) {\n  provides interface Read<width_t>;\n}\n\
    implementation\n{\n  task void senseResult() {\n    signal Read.readDone(SUCCESS,\
    \ (width_t)val);\n  }\n\n  command error_t Read.read() {\n    return post senseResult();\n\
    \  }\n}\n```\n\nListing 8.4 A generic constant sensor\n\nThe type of values returned\
    \ by ConstantSensorC’s Read interface is width_t, and the constant returned is\
    \ the integer val. The @integer() is necessary to make the cast to width_t in\
    \ senseResult legal: an integral value like val can be cast to any integer type,\
    \ but not to some unknown type.¹\n\n¹ Note that removing the cast from the source\
    \ code would not change anything, as the cast is implied by passing val to Read.readDone,\
    \ whose second argument is of type width_t."
  merge: -1
  img_proc: true
- pgno: 156
  md: "# 8.2 Writing generic modules\n\nInstantiations of ConstantSensorC must use\
    \ an integer type for width t:\n\n```\ncomponents new ConstantSensorC(uint16_t,\
    \ 23) as C1; // legal\ncomponents new ConstantSensorC(struct X, 39) as C2; //\
    \ compile-time error\n```\n\nThere is also an @number() suffix, that restricts\
    \ the type parameter to an integer or floating-point type, and the operations\
    \ to those legal on all such types. The @integer() and @number() suffixes are\
    \ other examples of nesC’s attributes, which we saw earlier in the declaration\
    \ of combine functions (Section 4.4.3) and which will be covered in more detail\
    \ in Section 8.4.\n\n# 8.2.2  Abstract data types as generics\n\nAbstract data\
    \ types (ADTs) in TinyOS are usually represented in one of two ways: as generic\
    \ modules or through an interface with commands that take by-reference arguments.\
    \ With a module, the ADT state is stored in module variables and accessed by commands\
    \ from provided interfaces. For example, many TinyOS components access queues\
    \ through the Queue typed interface:\n\n```\ninterface Queue<t> {\n  command bool\
    \ empty();\n  command uint8_t size();\n  command uint8_t maxSize();\n  command\
    \ t head();\n  command t dequeue();\n  command error_t enqueue(t newVal);\n  command\
    \ t element(uint8_t idx);\n}\n```\n\nListing 8.5  Queue interface (repeated)\n\
    \nThe Queue ADT implementation, QueueC, takes the queue type and size as parameters:\n\
    \n```\ngeneric module QueueC(typedef queue_t, uint8_t queueSize) {\n  provides\
    \ interface Queue<queue_t>;\n}\nimplementation {\n  queue_t queue[queueSize];\n\
    \  uint8_t head = 0, tail = 0, size = 0;\n\n  command bool Queue.empty() {\n \
    \   return size == 0;\n  }\n\n  command uint8_t Queue.size() {\n    return size;\n\
    \  }\n}\n```"
