  img_proc: true
- pgno: 136
  md: "# 7.1.1 Serial communication stack\n\nLike the radio stack (Section 6.3), the\
    \ TinyOS serial stack follows a layered structure (Figure 6.1, page 89). The lowest\
    \ level of the TinyOS serial communication stack is defined in TEP 113, and deals\
    \ with the exchange of packets over an unreliable serial connection. Like radio\
    \ packets, these are (in most cases) \"active message\" packets. In the rest of\
    \ this chapter, we will use message to mean the payload of a serial AM packet,\
    \ with different message types identifier by their AM type.\n\nThe layout of serial\
    \ AM packets is defined using external types:\n\n```\ntypedef nx_struct serial_header\
    \ {\n  nx_uint16_t dest;  /* packet destination */\n  nx_uint16_t src;   /* packet\
    \ sender */\n  nx_uint8_t length; /* payload length, in bytes */\n  nx_uint8_t\
    \ group;  /* identifies a specific sensor network */\n  nx_uint8_t type;   /*\
    \ AM type */\n} serial_header_t;\n```\n\n```\ntypedef nx_struct serial_packet\
    \ {\n  serial_header_t header;\n  nx_uint8_t data[];\n} serial_packet_t;\n```\n\
    \nListing 7.1 Serial AM Packet layout\n\nThe type field is used to dispatch the\
    \ payload (data[]). Serial AM packets have no footer. The dest (destination) and\
    \ src (sender) fields are not directly relevant to packets exchanged over a serial\
    \ connection, as the sender and destination are normally implicit. Similarly,\
    \ group is not relevant: it is used to distinguish different motes participating\
    \ in separate applications but sharing a physical connection. These fields are\
    \ included for consistency with AM packets sent over a radio, and are used in\
    \ some base station mote applications and ignored by others. For instance, in\
    \ the BaseStation application that forwards radio AM packets to/from a PC (as\
    \ serial AM packets):\n\n+   - From BaseStation to the PC: src, dest and group\
    \ are as in the received radio AM packet.\n+   - From the PC to BaseStation: the\
    \ transmitted radio AM packet has its destination set to dest, but sets its sender\
    \ and group to those of the BaseStation mote.\n\nWith these choices, a PC with\
    \ a BaseStation mote behaves much like a PC with a directly attached mote radio.\n\
    \nConversely, the TestSerial application (part of the standard TinyOS distribution)\
    \ ignores these three fields. TestSerial is an application designed to test serial\
    \ connectivity: the mote and the PC simply send each other messages containing\
    \ consecutive numbers. The mote displays the low-order three bits of these numbers\
    \ on its LEDs, while the PC simply prints these numbers. TestSerial uses the following\
    \ simple external type to"
