  md: "In practice, there is a third keyspace, which is used to arbitrate access amongst\
    \ all clients to the flash chip (see Section 11.2). This keyspace is shared between\
    \ block clients, logging clients, and other abstractions that need exclusive access\
    \ to the flash chip. So, all in all, BlockStorageC has to manage three different\
    \ keyspaces:\n\n+   1. Client key: which block storage client this is (for block\
    \ storage client state)\n+   2. Chip key: which client to the flash chip this\
    \ is (for arbitration of the shared resource)\n+   3. Volume key: which volume\
    \ this client accesses (for calculating absolute offsets in the chip)\n\nBoth\
    \ the client key and chip key are generated with unique(). The client key is only\
    \ among BlockStorageC components, so it uses a string UQ_BLOCK_STORAGE defined\
    \ in BlockStorage.h. The chip key is shared across all components that use underlying\
    \ chip. In the case of the AT45DB chip (used in the micaz platform), the string\
    \ is UQ_AT45DB defined in At45db.h. The volume key (VOLUME_XXX) is not generated\
    \ by unique, as it is generated from the XML file that specifies the flash chip\
    \ layout (Figure 6.3, page 102). After all of that introduction, you might think\
    \ that BlockStorageC is many lines of code. It isn’t: it only has four wiring\
