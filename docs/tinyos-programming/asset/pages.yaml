  img_proc: true
- pgno: 170
  md: 'keys can return the same value. So if two components, AppOneC and AppTwoC,
    both want timers, they could do this


    ```

    AppOneC.Timer -> HilTimerMilliC.Timer[unique("Timer")];

    AppTwoC.Timer -> HilTimerMilliC.Timer[unique("Timer")];

    ```


    and be assured that they will have distinct timer instances.¹ If there are n calls
    to unique, then the unique values will be in the range of 0, 1, …, n − 1.


    # 9.1.2 uniqueCount


    In these examples – Timer and Send – there is an additional factor to consider:
    each client requires the component to store some amount of state. For example,
    RouterC has to keep track of pending messages, and timer systems have to keep
    track of the period of each timer, how long until it fires, and whether it’s active.
    Because the calls to unique define the set of valid client identifiers, nesC has
    a second compile-time function, uniqueCount(). This function also takes a string
    key. If there are n calls to unique with a given key (returning values 0, 1, …,
    n − 1), then uniqueCount returns n. Like unique, uniqueCount is resolved at compile-time
    so can be used, e.g. to set array sizes.


    Being able to count the number of unique clients allows a component to allocate
    the right amount of state to support them. Early versions of nesC didn’t have
    the uniqueCount function: components were forced to allocate a fixed amount of
    state. If there were more clients than the state could support, one or more would
    fail at run-time. If there were fewer clients than the state could support, then
    there was wasted RAM. Because a component can count the number of clients and
    know the set of client identifiers that will be used, it can promise that each
    client will be able to work and use the minimum amount of RAM needed. Returning
    to the timer example from above:


    ```

    AppOneC.Timer -> HilTimerMilliC.Timer[unique("Timer")];

    AppTwoC.Timer -> HilTimerMilliC.Timer[unique("Timer")];

    ```


    and HilTimerMilliC could allocate state for each client:


    ```

    timer_t timers[uniqueCount("Timer")];

    ```


    Assuming the above two were the only timers, then HilTimerMilliC would allocate
    two timer structures. If we assume that AppOneC.Timer was assigned identifier
    0 and AppTwoC.Timer was assigned identifier 1, then HilTimerMilliC can directly
    use the parameter as an index into the state array.


    # 9.1.3 Example: HilTimerMilliC and VirtualizeTimerC


    This isn’t how HilTimerMilliC works: it’s actually a bit more complicated, as
    it is a configuration built out of a set of generic components (see Section 9.3).
    As hardware platforms differ in their timer hardware support, HilTimerMilliC is
    a platform-specific


    > ¹ In practice, clients rarely call unique() directly. Instead, these calls are
    encapsulated inside generic configurations, as we will see below. One common problem
    with unique() encountered in TinyOS 1.x is that a mistyped key will generate a
    non-unique value and possibly cause very strange behavior.'
