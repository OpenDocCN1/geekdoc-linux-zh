- pgno: 226
  md: "![](img/53ede4f4266a5731b93bff15d85fa06a_226_0.png)\n\nFigure 11.1 Power lock\
    \ architecture.\n\n# 11.2.4 Energy management\n\nTinyOS uses locks for much more\
    \ than just establishing exclusive access. It also uses locks to decide when to\
    \ power peripherals on and off. Take the SPI bus as an example. Microcontrollers\
    \ often have several low-power states, which differ in terms of which chip subsystems\
    \ and interrupt sources are active. The lowest power state is typically one where\
    \ a node can only wake up in response to one specific hardware counter or an external\
    \ interrupt source: systems such as buses and ADCs are powered down and do not\
    \ operate. Therefore, if TinyOS can disable the SPI bus when it’s not in use,\
    \ then the microcontroller can possibly save power.\n\nLocks provide an easy way\
    \ to automatically manage energy, lifting the burden from an application programmer.\
    \ When a lock falls idle – it’s released and there are no pending requests – it\
    \ can power down the system it protects. When a lock becomes busy – it receives\
    \ a request while in the idle state – it can power up the system. Depending on\
    \ the nature of the underlying hardware, locks can either give a brief timeout\
    \ before powering down or do so immediately.\n\nPower locks support a “default\
    \ owner,” a component to which the lock reverts when it falls idle. This default\
    \ owner is responsible for the power lock’s energy management policy. A default\
    \ owner uses a slightly different interface than Resource, as it never requests\
    \ a lock. Instead, the arbiter always grants it an idle lock and notifies the\
    \ default owner when there is a pending request. In response to a request, the\
    \ default owner can power up the hardware and, once powered, release its lock:\n\
    \n```\ninterface ResourceDefaultOwner {\n  async event void granted();\n  async\
    \ command error_t release();\n  async command bool isOwner();\n  async event void\
    \ requested();\n  async event void immediateRequested();\n}\n```"
  merge: -1
  img_proc: true
