- pgno: 257
  md: "![](img/53ede4f4266a5731b93bff15d85fa06a_257_0.png)\n\n# Figure 13.4 MTS300\
    \ microphone hardware.\n\nraw microphone output goes through an amplifier, whose\
    \ gain can be adjusted via an I²C bus. Finally, a second digital I/O pin (MicMuxSel)\
    \ selects between raw microphone output and a 4 kHz tone detector.²\n\nPowering\
    \ on the microphone for use as a “loud sound” detector thus requires physically\
    \ powering on the microphone, selecting raw microphone output and picking an appropriate\
    \ amplifier gain. Finally, once these steps are complete, the microphone should\
    \ be left to warm up for 1.2 s (MICROPHONE_WARMUP). These four steps are performed\
    \ by the following code from MicrophoneC (error checking elided):\n\n```\nmodule\
    \ MicrophoneC {\n  provides interface SplitControl;\n  uses interface GeneralIO\
    \ as MicPower;\n  uses interface GeneralIO as MicMuxSel;\n  uses interface I2CPacket<TI2CBasicAddr>;\n\
    \  uses interface Resource as I2CResource;\n}\n\nimplementation {\n  enum {\n\
    \    MIC_POT_ADDR = 0x5A, // Amplifier I2C address\n    MIC_POT_SUBADDR = 0,\n\
    \    MIC_GAIN = 64        // Desired gain\n  };\n\n  command error_t SplitControl.start()\
