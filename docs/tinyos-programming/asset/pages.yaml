    \ in to the arbiter. Before the arbiter grants the lock to a client, it calls\
    \ the corresponding configurator in order to set up the hardware as needed. When\
    \ the client releases the lock, the arbiter unconfigures the hardware and returns\
    \ to to a ready state:\n\n```\ninterface ResourceConfigure {\n  async command\
    \ void configure();\n  async command void unconfigure();\n}\n```\n\nListing 11.17\
    \ The ResourceConfigure interface\n\n# 11.2.6 Example: MSP430 USART\n\nThe MSP430\
    \ USART0 (Universal Synchronous/Asynchronous Receiver/Transmitter) is a generic\
    \ bus that software can configure for a variety of uses. The USART can be used\
    \ as a UART (serial port), an SPI (Serial Peripheral Interface), or an I²C (Inter-Integrated"
