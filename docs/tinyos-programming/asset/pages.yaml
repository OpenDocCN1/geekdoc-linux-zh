    \ are a fundamental part of the Service Instance pattern. See for example the\
    \ timer service, HiTimerMilliC, or the client identifiers of many lower-level\
    \ system components such as Atm128AdcC (Atmel ATmega128 A/D converter) or Stm25pSectorC\
    \ (ST M25P flash chip). Maté uses a Local Keyspace to keep track of Maté shared\
    \ resource locks (see above). Active Messages (ActiveMessageC) uses a Global Keyspace\
    \ for Active Message types.\n\nThe TinyOS storage abstractions use a Global Keyspace\
    \ to identify flash-chip volumes. In this case, the global constants are picked\
    \ by an external tool (tos-storage-at45db for the Atmel AT45DB chip family) rather\
    \ than explicitly by the programmer. This relieves the programmer of the burden\
    \ of picking values, while still allowing several applications to use the same\
    \ volumes.\n\nThe TinyDB sensor-network-as-database application [20] uses a Global\
    \ Keyspace for its attributes; in this case, however, the keyspace is composed\
    \ of strings, which are then mapped to a Local Keyspace using a table.\n\n# Consequences\n\
    \nKeyspaces allow a component to refer to data items or types through a parameterized\
    \ interface. In a Local Keyspace, unique ensures that every element has a unique\
    \ identifier. Global Keyspaces can also have unique identifiers, but this requires\
    \ external namespace management.\n\nAs Local Keyspaces are generated with unique,\
    \ mapping names to keys (e.g. for debugging purposes) is not obvious. The nesC\
    \ constant generator, ncg, can be used to extract this information.\n\nKeyspaces\
    \ are rarely used in isolation; they support other patterns such as Dispatcher\
    \ and Service Instance.\n\n# Related patterns\n\n+   - Keymap: two Keyspaces are\
    \ often related, e.g. one Service Instance may be built on top of another, requiring\
    \ a mapping between two Keyspaces. The Keymap pattern provides an efficient way\
    \ of implementing such maps."
