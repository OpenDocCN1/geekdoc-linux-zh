- pgno: 61
  md: "To avoid such recursive loops, TinyOS follows a couple of coding conventions.\
    \ First, split-phase commands must never directly signal their callback – see\
    \ Section 5.3.2 for more details. Second, the relation between most TinyOS components\
    \ is hierarchical: application components use interfaces provided by system services,\
    \ which themselves use interfaces provided by lower-level services, and so on\
    \ down to the raw hardware – this structure is discussed in depth in Chapter 12.\n\
    \nFinally, it’s worth noting that the stack may overflow because of extra stack\
    \ usage caused by an interrupt handler (Chapter 5) interrupting your regular computation\
    \ (or, even worse, another interrupt handler which is already using some of the\
    \ stack space). You should always leave enough RAM free to handle the worst case\
    \ usage of your regular computation and all interrupt handlers that can execute\
    \ simultaneously.\n\n# Programming Hint 2 NEVER WRITE RECURSIVE FUNCTIONS WITHIN\
    \ A MODULE. IN COMBINATION WITH THE TINYOS CODING CONVENTIONS, THIS GUARANTEES\
    \ THAT ALL PROGRAMS HAVE BOUNDED STACK USAGE.\n\n# Programming Hint 3 NEVER USE\
    \ MALLOC AND FREE. ALLOCATE ALL STATE IN COMPONENTS. IF YOUR APPLICATION REQUIREMENTS\
    \ NECESSITATE A DYNAMIC MEMORY POOL, ENCAPSULATE IT IN A COMPONENT AND TRY TO\
    \ LIMIT THE SET OF USERS.\n\n# 3.5.1 Memory ownership and split-phase calls\n\n\
    TinyOS programs contain many concurrent activities, e.g. even in a very simple\
    \ program, radio message transmission, sensor sampling and application logic.\
    \ Ensuring that these activities do not step on each other by accessing each other’s\
    \ data out of turn is often a complex problem.\n\nThe only way that components\
    \ can interact is through function calls, which are normally part of interfaces.\
    \ Just as in C, there are two basic ways that components can pass parameters:\
    \ by value and by reference (pointer). In the first case, the data is copied onto\
    \ the stack, so the callee can modify it or cache it freely. In the second case,\
    \ the caller and callee share a pointer to the data, and so the two components\
    \ need to carefully manage access to the data in order to prevent memory corruption.\n\
    \nThe simplest solution to preventing data-sharing problems is to never store\
    \ pointer parameters in module variables. This is the approach used by some abstract\
    \ data type components (see Section 8.2.2); it ensures that any data-sharing is\
    \ transitory, restricted to the duration of the command or event with the pointer\
    \ parameter.\n\nHowever, this approach is not practical for split-phase calls.\
    \ Because the called component typically needs access to the pointer while the\
    \ operation is executing, it has to store it in a module variable. For example,\
    \ consider the basic Send interface:\n\n```\ninterface Send {\n  command error_t\
    \ send(message_t* msg, uint8_t len);\n  event void sendDone(message_t* msg, error_t\
    \ error);\n}\n```"
