    # 6.4 Multi-hop networking: collection, dissemination, and base stations


    A mote network is typically more complex than a set of motes within direct radio
    range (often only 30m/100ft on current motes) of each other. Instead, multi-hop
    networks use motes to relay messages when the sender and receiver are not in direct
    radio range. Furthermore, one or more base station motes physically connected
    to a PC-class device, and usually line-powered, relay information to and from
    the wider world. Thus, considered as a whole, a sensor network application has
    three parts (Figure 6.2):


    +   - Mote code: the code running on the motes in the network. Interactions between
    motes take the form of sending and receiving radio messages.

    +   - Base Station code: the code running on the base station mote. It interacts
    with the other motes via radio messages, and exchanges packets with the PC over
    a serial connection.

    +   - PC code: the code running on the PC.


    TinyOS provides two basic multi-hop networking abstractions: tree collection,
    and dissemination. In tree collection, the motes organize themselves into a routing
    tree centered on a particular mote, the root, which is often a base station mote.
    All messages sent in the tree automatically flow to the root (e.g. following the
    links shown in Figure 6.2). Collection trees are typically used to collect information
    (e.g. sensor data) from a sensor network.


    Dissemination efficiently distributes a value (which can be a structure with several
    fields) across the whole mote network. Furthermore, any mote can update the value,
    and the whole network will eventually settle on the value from the most recent
    update. Dissemination is often used for run-time configuration of mote applications.


    In the rest of this section, we’ll adapt AntiTheft to use collection and dissemination
    rather than ActiveMessageC for its theft report and configuration. In particular,
    we show


    ![](img/53ede4f4266a5731b93bff15d85fa06a_118_0.png)


    Figure 6.2 A typical sensor network.'
