- pgno: 32
  md: '+   - **Chapter 6** takes the material from the prior three chapters and brings
    it together into an example of writing a fully-fledged application that sends
    an alarm when a node observes a change in its environment. In the process, it
    covers the major TinyOS APIs (timing, sensing, communication, and storage).

    +   - **Chapter 7** details the PC-side tools for communicating with nodes connected
    over the serial port, and covers the TinyOS serial stack and packet formats.

    +   - **Chapter 8** introduces more advanced component topics, such as parameterized
    interfaces and attributes. While applications typically don’t use these mechanisms,
    they are indispensable when writing reusable libraries and systems.

    +   - **Chapter 9** goes into wiring parameterized interfaces, which form the
    basis for most reusable systems. After describing the basic mechanisms for managing
    interface keys, it goes through four examples of increasing complexity.

    +   - **Chapter 10** presents eight common TinyOS design patterns: commonly useful
    and powerful ways of organizing components.

    +   - **Chapter 11** concludes the advanced programming topics by covering concurrency.
    It describes asynchronous code, the TinyOS task model, and power locks.

    +   - **Chapter 12** describes the Hardware Abstraction Architecture (HAA), the
    three-level hierarchy TinyOS uses to raise low-level hardware abstractions to
    hardware-independent, application-level services.

    +   - **Chapter 13** goes step-by-step through an advanced application that identifies
    the location of an event based on when nodes sense it. It uses lower-layer interfaces
    to implement time synchronization and high-frequency sampling.

    +   - **Appendix** gives a concise overview of major TinyOS application interfaces.


    Throughout the book, you will find *programming hints*: general best-use practices
    that we’ve distilled from the many users of TinyOS and nesC. These are all listed
    on the sheet at the front of the book.


    Finally, the complete source code for example applications presented in this book
    (in Chapters 6, 7 and 13) is available in TinyOS’s contributed code directory,
    under the name “TinyOS Programming” – see www.tinyos.net for details.'
