    \ n) {\n    if (bufferFull()) {\n      call UnbufferedLog.append(buffer, offset);\n\
    \      // ... switch to other buffer ...\n    }\n    // ... append to buffer ...\n\
    \  }\n}\n```\n\n# Known uses\n\nThe TransformAlarmC and TransformCounterC generic\
    \ components transform the precision and width of Alarm and Counter interfaces.\n\
    \nThe ArbitratedReadC generic component adds automatic resource arbitration to\
    \ a Read interface, and ArbitratedReadStreamC does the same for a ReadStream interface.\n\
    \n# Consequences\n\nApplying a Decorator allows you to extend or modify a component's\
    \ behavior though a separate component: the original implementation can remain\
    \ unchanged. Additionally, the Decorator can be applied to any component that\
    \ provides the interface. To allow reuse, Decorators are normally generic components.\n\
    \nIn most cases, a decorated component should not be used directly, as the Decorator\
    \ is already handling its events. The Placeholder pattern (Section 10.5) can be\
    \ used to help ensure this.\n\nAdditional interfaces are likely to use the underlying\
    \ component, creating dependencies between the original and extra interfaces of\
    \ a Decorator. For instance, in BufferedLogC, FastLog uses UnbufferedLog, so concurrent\
    \ requests to FastLog and Log are likely to conflict: only one can access the\
    \ UnbufferedLog at once.\n\nDecorators are a lightweight but flexible way to extend\
    \ component functionality. Interpositioning is a common technique in building\
    \ networking stacks, and Decorators enable this style of composition."
