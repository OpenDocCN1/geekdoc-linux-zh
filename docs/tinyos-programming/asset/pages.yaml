  md: "Rather than directly pass a string to uniqueCount(), HilTimerMilliC passes\
    \ UQ_TIMER_MILLI, which is a #define (from Timer.h) for the string \"HilTimerMilliC.Timer\"\
    . This is a common approach in TinyOS. Using a #define makes it harder to run\
    \ into bugs caused by errors in the string: chances are that a typo in the uses\
    \ of the #define will be a compile-time error. This is generally a good practice\
    \ for components that depend on unique strings.\n\n# Programming Hint 19 IF A\
    \ COMPONENT DEPENDS ON UNIQUE, THEN #DEFINE THE STRING TO USE IN A HEADER FILE,\
    \ TO PREVENT BUGS DUE TO STRING TYPOS.\n\nVirtualizeTimerC, in turn, allocates\
    \ an array of timer state structures, whose size is determined by its max_timers\
    \ parameter:\n\n```\nenum {\n    NUM_TIMERS = max_timers,\n    END_OF_LIST = 255,\n\
    };\ntypedef struct {\n    // details elided\n} Timer_t;\n\nTimer_t m_timers[NUM_TIMERS];\n\
    ```\n\nListing 9.4 VirtualizeTimerC state allocation\n\nWhen a client calls VirtualizeTimerC's\
    \ Timer interface (through HilTimerMilliC), the parameter indicates which client\
    \ is making the call. VirtualizeTimerC uses the client ID as an index into the\
    \ state array. For example:\n\n```\nvoid startTimer(uint8_t num, uint32_t t0,\
    \ uint32_t dt, bool isoneshot) {\n    Timer_t* timer = &m_timers[num];\n    //\
    \ update timer structure\n}\n```\n\n```\ncommand void Timer.startPeriodic[uint8_t\
    \ num](uint32_t dt) {\n    startTimer(num, call TimerFrom.getNow(), dt, FALSE);\n\
    }\n```\n\nThis software structure assumes that each component that needs a timer\
    \ wires to HilTimerMilliC's parameterized TimerMilli using a call to unique, passing\
    \ UQ_TIMER_MILLI as the key:\n\n```\nSomeComponentC.Timer -> HilTimerMilliC.TimerMilli[unique(UQ_TIMER_MILLI)];\n\
    ```\n\nRequiring a programmer to know a service's key is problematic and bug-prone.\
    \ While a #define for the key reduces programming errors compared to actual strings,\
    \ it's still very easy for a programmer to accidentally use the wrong key, especially\
    \ if an application uses many services. Finding such a bug is a nightmare. This\
    \ is essentially a problem of code duplication: even though every Timer user wants\
    \ to wire in the same way, each one"
