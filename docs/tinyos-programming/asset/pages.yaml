    \ but barring additional error checks in the call path, it can be hard to find\
    \ out which one, and this might introduce all kinds of bugs in the calling components.\
    \ Note that to avoid this problem, the send command isn’t async.\n\n# Programming\
    \ Hint 21 KEEP CODE SYNCHRONOUS WHEN YOU CAN. CODE SHOULD BE ASYNC ONLY IF ITS\
    \ TIMING IS VERY IMPORTANT OR IF IT MIGHT BE USED BY SOMETHING WHOSE TIMING IS\
    \ IMPORTANT.\n\n# 11.1.3 Atomic statements and the atomic keyword\n\nThe problems\
    \ interrupts introduce means that programs need a way to execute snippets of code\
    \ that won’t be preempted. nesC provides this functionality through atomic statements.\
    \ For example:\n\n```\ncommand bool increment() {\n  atomic {\n    a++;\n    b\
    \ = a + 1;\n  }\n}\n```\n\nListing 11.6 Incrementing with an atomic statement\n\
    \nThe atomic block promises that these variables can be read and written atomically.\
    \ In practice, on all current mote platforms, atomic statements are implemented\
    \ by disabling and conditionally reenabling interrupts around the body of the\
    \ atomic statement (this typically costs just a few cycles). In theory, a nesC\
    \ implementation could allow incrementA and incrementC to preempt each other in\
    \ this code snippet, as they access disjoint variables:\n\n```\nasync command\
    \ bool incrementA() {\n  atomic {\n    a++;\n    b = a + 1;\n  }\n}\nasync command\
    \ bool incrementC {\n  atomic {\n    c++;\n    d = c + 1;\n  }\n}\n```\n\nListing\
    \ 11.7 Incrementing with two independent atomic statements"
