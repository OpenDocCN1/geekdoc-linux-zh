  md: "# Participants\n\n+   - Original: the original service.\n+   - Decorator: the\
    \ extra functionality added to the service.\n\n# Sample code\n\nThe standard LogWrite\
    \ interface (Section 6.5) includes split-phase erase, append and sync operations.\
    \ BufferedLogC adds buffering to the LogData operations, and, additionally, supports\
    \ a FastLog interface with a non-split-phase append operation (for small writes\
