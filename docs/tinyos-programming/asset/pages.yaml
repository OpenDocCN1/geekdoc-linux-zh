  md: '![](img/53ede4f4266a5731b93bff15d85fa06a_27_0.png)


    Figure 1.1 A typical sensor network architecture. Patches of ultra-low power sensors,
    running nesC/TinyOS, communicate to gateway nodes through data sinks. These gateways
    connect to the larger Internet.


    these factors can greatly reduce power consumption, making the IT infrastructure
    more efficient and reducing environmental impact.


    While these three application domains are only a small slice of where networks
    of sensors are used, they show the key differences between these networks and
    most other computing systems. First, these "sensor networks" need to operate unattended
    for long periods of time. Second, they gather data from and respond to an unpredictable
    environment. Finally, for reasons of cost, deployment simplicity, and robustness,
    they are wireless. Together, these three issues – longevity, embedment, and wireless
    communication – cause sensor networks to use different approaches than traditional,
    wired, and human-centric or machine-centric systems.


    The sheer diversity of sensor network applications means that there are many network
    architectures, but a dominant portion of deployments tend to follow a common one,
    shown in Figure 1.1 [21, 26, 30] of ultra-low power sensors self-organized to
    form an ad-hoc routing network to one or more data sink nodes. These sensor sinks
    are attached to gateways, which are typically a few orders of magnitude more powerful
    than the sensors: gateways run an embedded form of Linux, Windows, or other multitasking
    operating system. Gateways have an Internet connection, either through a cell
    phone network, long-distance wireless, or even just wired Ethernet.


    Energy concerns dominate sensor hardware and software design. These nodes need
    to be wireless, small, low-cost, and operate unattended for long periods. While
    it is often possible to provide large power resources, such as large solar panels,
    periodic battery replacement, or wall power, to small numbers of gateways, doing
    so to every one of hundreds of sensors is infeasible.


    # 1.1.1 Anatomy of a sensor node (mote)


    Since energy consumption determines sensor node lifetime, sensor nodes, commonly
    referred to as motes, tend to have very limited computational and communication
    resources. Instead of a full-fledged 32-bit or 64-bit CPU with megabytes or gigabytes
    of RAM, they have 8-bit or 16-bit microcontrollers with a few kilobytes of RAM.
    Rather than gigahertz, these microcontrollers run at 1–10 megahertz. Their low-power
    radios'
