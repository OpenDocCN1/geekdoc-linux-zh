    \ station wiring\n\n# 6.5 Storage\n\nMany motes include some amount of flash-based\
    \ non-volatile storage, e.g. 512 kB on the micaz. TinyOS divides this non-volatile\
    \ storage into volumes. A volume is a contiguous region of storage with a certain\
    \ format that can be accessed with an associated interface. TinyOS defines three\
    \ basic storage abstractions: Log, Block, and Config. Log is for append-only writes\
    \ and streaming reads, Block is for random-access reads and write, and Config\
    \ is for small items of configuration data. Log and Config have the advantage\
    \ that their more limited interface allows for atomic operations: when a write\
    \ to a Log or Config volume completes, it is guaranteed to be written. In contrast,\
    \ the Block interface has a separate commit operation.\n\nTinyOS uses this abstraction-on-a-volume\
    \ approach rather than a more traditional filing system for two main reasons.\
    \ First, it is simpler, reducing code and RAM requirements for applications using\
    \ permanent storage. Second, sensor networks are normally dedicated to a single\
    \ application, which should have a reasonable knowledge"
