    \ the SPI bus to the radio (time depends on contention)\n+   3. Start the radio’s\
    \ oscillator by sending a command over the bus (0.86 ms)\n+   4. Put the radio\
    \ in RX mode (0.2 ms)\n\nSome of the steps that take time are split-phase and\
    \ have async completion events (particularly, 1 and 3). The actual call to start\
    \ this series of events, however, is SplitControl.start, which is sync. One way\
    \ to implement this series of steps is to assign each step a state and use a state\
    \ variable to keep track of where you are. However, this turns out not to be necessary.\
    \ Once the start sequence begins, it continues until it completes. So the only\
    \ state variable you need is whether you’re starting or not. After that point,\
    \ every completion event is implicitly part of a state. For example, the startOscillatorDone\
    \ event implicitly means that the radio is in state 3. Because SplitControl.start\
    \ is sync, the state variable can be modified without any atomic statements:\n\
    \n```\ncommand error_t SplitControl.start() {\n  if ( m_state != S_STOPPED )\n\
    \    return FAIL;\n\n  m_state = S_STARTING;\n  m_rsn = call Random.rand16();\n\
    \  call CC2420Config.startVReg();\n  return SUCCESS;\n}\n```\n\nListing 11.8 The\
    \ first step of starting the CC2420 radio\n\nThe startVReg command starts the\
