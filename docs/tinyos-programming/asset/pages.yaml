  md: "```\ncomponents MyAppC, Stm25pSectorC;\nenum { MYID = unique (UQ_STM25P_VOLUME)\
    \ };\nMyAppC.PlashResource -> Stm25pSectorC.ClientResource[MYID];\nMyAppC.Stm25pSectorC\
    \ -> Stm25pSectorC.Stm25pSector[MYID];\n```\n\nSome shared drivers (e.g. Msp430I2CC,\
    \ the TI MSP430’s HAL for the I²C bus) wrap this wiring logic into a generic component:\n\
    \n```\ngeneric configuration Msp430I2CC() {\n  provides interface Resource;\n\
    \  provides interface I2CPacket<TI2CBasicAddr> as I2CBasicAddr;\n  uses interface\
    \ Msp430I2CConfigure;\n}\n```\n\nImplementing access control for shared drivers\
    \ is simplified by using TinyOS’s power-lock library (Section 11.2.7). An arbiter\
    \ provides an implementation of a parameterized Resource interface with a specific\
    \ queuing policy, and a hook for power management (see below). The generic arbiter\
    \ components take the string used to pick unique client ids as a parameter. For\
    \ instance, the following line creates Stm25pSectorC’s arbiter:\n\n```\ncomponents\
    \ new FcfSArbiterC(UQ_STM25P_VOLUME) as ArbiterC;\n```\n\nThe implementation of\
    \ Stm25pSectorC needs to perform a little work every time access is granted by\
    \ the arbiter and released by the user, so interpose a module (Stm25pSectorP)\
    \ between the ClientResource interface and its first-come, first-served arbiter\
    \ (FcfSArbiterC):\n\n```\nconfiguration Stm25pSectorC {\n  provides interface\
    \ Resource as ClientResource[uint8_t id];\n  ...\n}\nimplementation {\n  components\
    \ Stm25pSectorP as SectorP;\n  components new FcfSArbiterC(UQ_STM25P_VOLUME) as\
    \ ArbiterC;\n\n  ClientResource = SectorP.ClientResource;\n  SectorP.Stm25pResource\
    \ -> ArbiterC.Resource;\n  ...\n}\n```\n\nListing 12.2 Arbitration in Stm25pSectorC\n\
    \n# 12.2.3  Power management\n\nMotes are usually powered by low-capacity batteries,\
    \ so effective power management is essential for obtaining reasonable sensor network\
    \ lifetime. For instance, to last a year, a mote powered by two 2700 mAh batteries\
    \ (e.g. traditional AA batteries) must have an average power consumption of 0.9\
    \ mW. A typical microcontroller uses at least several mW when active, and a typical\
    \ radio turns on of mW when listening for messages. Luckily,"
  merge: -1
  img_proc: true
- pgno: 239
  md: "radios can be switched off, and microcontrollers have various sleep modes where\
    \ power consumption drops to levels as lows as a µW. Thus, to achieve an average\
    \ of 0.9 mW, the mote must spend most of its time with the radio off and the microcontroller\
    \ in some appropriate sleep state; the same reasoning applies to any other peripheral\
    \ (sensor, flash chip, etc.) with non-trivial power consumption.\n\nThe basic\
    \ decision as to when various components must be on rests in the application’s\
    \ hands: only it knows when sensors must be sampled, messages transmitted, etc.\
    \ The goal of TinyOS’s power management is \"simply\" to put every subsystem into\
    \ the lowest power state consistent with these application demands. Power states\
    \ vary from device to device, however, for current mote hardware, power states\
    \ are usually:\n\n+   - On and off for most peripherals, be they on-microcontroller\
    \ like A/D converters, I²C buses or off-microcontroller like sensors, flash chips.\n\
    +   - Radio-specific states, as in low-power-listening which listens for radio\
    \ messages at some frequency, or schedule-based where motes transmit and receive\
    \ at specific times. These states effectively tradeoff increased latency and reduced\
    \ bandwidth for lower power usage.\n+   - A hierarchy of power states for microcontrollers.\
    \ For instance, an Atmel ATmega128 can be in active, idle, ADC-noise-reduction,\
    \ extended standby, power save, standby, and power down states. Each successive\
    \ state turns off more on-chip functionality and increases wakeup latency.\n\n\
    In TinyOS, only the selection of the radio state is left to the application programmer.\
    \ Peripherals are powered on and off in most device drivers (except dedicated\
    \ drivers) based on the pending user requests, while the microcontroller power\
    \ state is derived from the whole system state.\n\nThus, the extent of user-level\
    \ power management code in a program like the anti-theft application of Chapter\
    \ 6 is the call to set the duty cycle after the radio has been started (and the\
    \ associated wiring):\n\n```\nuses interface LowPowerListening;\n...\nevent void\
    \ CommControl.startDone() {\n    // Switch radio to low-power-listening with a\
    \ 2% duty cycle\n    call LowPowerListening.setLocalDutyCycle(200);\n    call\
    \ TheftTimer.startPeriodic(ACCEL_INTERVAL);\n}\n```\n\nImplementation of power\
    \ management in device drivers depends heavily on the driver’s class (dedicated,\
    \ shared, virtualized). Dedicated drivers typically do not manage power directly,\
    \ but offer commands to turn the device on and off for use by the dedicated driver’s\
    \ single user. With the exception of the radio stack (ActiveMessageC), dedicated\
    \ drivers are normally managed by other device drivers, so this level of explicit\
    \ power management is invisible to applications."
  merge: -1
  img_proc: true
- pgno: 240
  md: "A/D on and off:\n\n```\nasync command void HplAtm128Adc.enableAdc() {\n   \
    \ SET_BIT(ADCSRA, ADEN);\n}\n```\n\n```\nasync command void HplAtm128Adc.disableAdc()\
    \ {\n    CLR_BIT(ADCSRA, ADEN);\n}\n```\n\nPower management is typically performed\
    \ automatically by shared drivers. If the shared driver is implemented using a\
    \ power lock, then the driver can instantiate a power manager (Section 11.2) to\
    \ automatically switch itself on and off depending on its clients requests. The\
    \ device must choose between the immediate and deferred power managers – in the\
    \ deferred case, the system waits for a small time after the last user is done\
    \ before switching the device off. A deferred power off avoids the cost of switching\
    \ the device off and immediately back on if a new request comes in shortly (but\
    \ not immediately) after the last one completed. Deferred is a good policy when\
    \ switching a device on and off is a complex operation, when the device requires\
    \ a \"warm up\" period before first use, etc. For instance, TinyOS's Stm25pSectorC\
    \ implementation uses a deferred power manager (instantiated as PowerManagerC\
    \ below) with a 1 s delay because powering the flash chip on or off requires sending\
    \ a command to the flash via an SPI bus:\n\n```\nconfiguration Stm25pSectorC {\n\
    \    provides interface Resource as ClientResource[uint8_t id];\n    ...\n}\n\
    implementation {\n    components Stm25pSectorP as SectorP;\n    components new\
    \ Pcf8ArbiterC(UQ_STM25P_VOLUME) as ArbiterC;\n    ClientResource -> SectorP.ClientResource;\n\
    \    SectorP.Stm25pResource -> ArbiterC.Resource;\n\n    // 1024 binary milliseconds\
    \ = 1 second power off delay:\n    components new SplitControlDeferredPowerManagerC(1024)\
    \ as PowerManagerC;\n    PowerManagerC.SplitControl -> SectorP;\n    PowerManagerC.ResourceDefaultOwner\
    \ -> ArbiterC;\n    PowerManagerC.ArbiterInfo -> ArbiterC;\n    ...\n}\n```\n\n\
    Virtualized devices are most often built over shared devices that already perform\
    \ power management, so the virtualized device contains no explicit power management\
    \ code. However, if a virtualized device does need to manage power, the situation\
    \ is similar to the arbiter case: the virtualized device knows all the outstanding\
    \ requests for the underlying hardware, so can decide when to power the device\
    \ on and off."
  merge: -1
  img_proc: true
- pgno: 241
  md: "# 12.2.4 Microcontroller power management\n\nAs we discussed above, microcontrollers\
    \ can typically enter one of several different sleep modes when no code needs\
    \ to run. Execution resumes on the next hardware interrupt. The details of the\
    \ sleep modes and how to enter them are very device-specific, but the decision\
    \ of when to sleep is very simple in TinyOS: when the task queue is empty, the\
    \ mote can sleep.\n\nThe sleep logic is encapsulated in a microcontroller-specific\
    \ McuSleepC component:\n\n```\nmodule McuSleepC {\n  provides interface McuSleep;\n\
    \  provides interface McuPowerState;\n  uses interface McuPowerOverride;\n}\n\
    implementation { ... }\n```\n\nListing 12.3 McuSleepC: platform-specific sleep\
    \ code\n\nThe McuSleep interface has a single command, sleep, that tells McuSleepC\
    \ to put the microcontroller in the lowest-power-consumption sleep mode consistent\
    \ with the mote’s current configuration. For instance, on an ATmega128, the microcontroller\
    \ must stay in the highest power-consumption mode (“idle”) if the serial ports,\
    \ SPI or I²C bus are in use. Conversely, if the mote is only waiting for a timer\
    \ to expire, then the ATmega128 can be put in the “power-save” mode, dropping\
    \ microcontroller power consumption from tens of mW to tens of µW. There is, however,\
    \ a cost to entering power-save mode: when using, e.g., an external crystal oscillator,\
    \ the microcontroller takes 16 000 cycles to wake up from power-save mode. At\
    \ 8 MHz, 16 000 cycles is 2 ms, so power-save should not be entered if the timer\
    \ will expire in the next few ms.\n\nThe McuSleep.sleep command for the ATmega128\
    \ implements the logic outlined above (and more) by inspecting the microcontroller’s\
    \ hardware registers to find out which on-board peripherals (buses, timers, etc.)\
    \ are enabled and pick the appropriate sleep mode. However, the selection of sleep\
    \ mode is often dependent on some platform-specific features and even in some\
    \ cases on application requirements (e.g. the delay in responding to a timer when\
    \ in power-save mode may be problematic in an application that has high timing\
    \ precision requirements). To allow for such variations, McuSleepC calls the McuPowerOverride.lowestState\
    \ command to allow the rest of the system to force the choice of an appropriate\
    \ power state. For instance, on the ATmega128 :\n\n```\nasync command void McuSleep.sleep()\
    \ {\n  uint8_t powerState;\n\n  powerState = mcombine(getPowerState(), call McuPowerOverride.lowestState());\n\
    \  ... set sleep mode to powerState and go to sleep ...\n}\n```"
  merge: -1
  img_proc: true
