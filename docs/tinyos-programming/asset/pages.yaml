    \nListing 6.32 Anti-Theft: saving configuration data\n\n# 6.5.3 Block and Log\
    \ storage\n\nBlock and Log storage are two abstractions for storing large amounts\
    \ of data. Log is intended for logging: it provides reliability (each write is\
    \ a separate transaction), at the cost of limited random access: writes are append-only,\
    \ reads can only seek to recorded positions. Block is a lower-level abstraction\
    \ which allows random reads and writes, but provides no reliability guarantees.\
    \ Also, Block only allows any given byte to be written once between two whole-volume\
    \ erases. Block is often used to store large items, such as programs for Deluge,\
    \ the network reprogramming system. In this section, we will use Block and Log\
    \ to build FlashSampler, a two-level sampling application. The system will periodically\
    \ collect 32kB samples of an accelerometer,"
