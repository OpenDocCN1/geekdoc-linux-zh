    \                      error_t error);\n\n  command error_t write(storage_addr_t\
    \ addr, void* buf, storage_len_t len);\n  event void writeDone(storage_addr_t\
    \ addr, void* buf, storage_len_t len,\n                       error_t error);\n\
    \  command error_t commit();\n  event void commitDone(error_t error);\n\n  command\
    \ storage_len_t getSize();\n  command bool valid();\n}\n```\n```\n\n![](img/53ede4f4266a5731b93bff15d85fa06a_126_1.png)\n\
    \nConfigStorage volumes are somewhat unusual in that they effectively keep two\
    \ copies of their contents: the contents as of the last commit and the new, as-yet-to-be-committed"
