    App.Receive -> AMReceiverC;

    App.AMSend -> AMSenderC;

    App.AMControl -> ActiveMessageC;

    App.Leds -> LedsC;

    App.MilliTimer -> TimerMilliC;

    App.Packet -> AMSenderC;

    }

    ```


    # Listing 4.24 RadioCountToLedsAppC


    Because RadioCountToLedsAppC has to instantiate a new AMSenderC, that instance
    is private to RadioCountToLedsAppC. No other component can name that AMSenderC’s
    interfaces or access its functionality. For example, RadioCountToLedsAppC does
    not wire AMSenderC’s PacketAcknowledgements interface, either through direct wiring
    via -> or through an export via =. Since this AMSenderC is private to RadioCountToLedsAppC,
    that means no component can wire to its PacketAcknowledgements, because they cannot
    name it.


    While generics enable components to reuse implementations, sharing a generic among
    multiple components requires a little bit of work. For example, let’s say you
    want to share a pool of packet buffers between two components. TinyOS has a component,
    PoolC, which encapsulates a fixed-size pool of objects which components can dynamically
    allocate and free. PoolC is a generic configuration that takes two parameters,
    the type of memory object in the pool and how many there are:


    ```

    generic configuration PoolC(typedef pool_t, uint8_t POOL_SIZE) {

    provides interface Pool<pool_t>;

    }

    ```


    # Listing 4.25 PoolC


    How do we share this pool between two different components? One way would be to
    write a configuration that wires both of them to a new instance:


    ```

    components A, B, new PoolC(message_t, 8);

    A.Pool -> PoolC;

    B.Pool -> PoolC;

    ```'
