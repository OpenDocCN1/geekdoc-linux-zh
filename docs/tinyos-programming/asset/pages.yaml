    \ to include a library in the link path, and in Java it’s to include a jar. Usually,\
    \ a dangling wire represents a bug in the program. With parameterized interfaces,\
    \ however, often they don’t.\n\nTake, for example, the Receive interface of ActiveMessageC.\
    \ Most applications receive a few AM types, maybe 15 at most: they don’t respond\
    \ to or use every protocol ever developed. However, there’s this call in CC2420ActiveMessageP:\n\
