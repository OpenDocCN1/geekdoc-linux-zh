  md: "shows the resulting components: AMQueueEntryP implements the per-client logic\
    \ needed to queue packets for a particular AM identifier, AMQueueImplP implements\
    \ the queue, and AMQueueP wires the queue to ActiveMessageC. At run-time, a typical\
    \ execution is:\n\n+   1. Client calls AMSenderC's AMSend.send.\n+   2. This calls\
    \ end in module AMQueueEntryP, which stores the length, AM identifier, and destination\
    \ in the packet.\n+   3. AMQueueEntryP is a client of AMQueueImplP and calls Send.send\
    \ with its client identifier.\n+   4. AMQueueImplP checks that the client's queue\
    \ entry is free and puts the packet into it.\n+   5. Some time later, AMQueueImplP\
    \ pulls the packet off the queue and calls AMSend.send on ActiveMessageC with\
    \ the parameters that AMQueueEntryP stored.\n+   6. When ActiveMessageC signals\
    \ AMSend.sendDone, AMQueueImplP signals Send.sendDone to AMQueueEntryP, which\
    \ signals AMSend.sendDone to the original calling component.\n\nThis is the code\
    \ for AMSenderC:\n\n```\ngeneric configuration AMSenderC(am_id_t AMId) {\n  provides\
    \ {\n    interface AMSend;\n    interface Packet;\n    interface AMPacket;\n \
    \   interface PacketAcknowledgements as Acks;\n  }\n}\n\nimplementation {\n  components\
    \ new AMQueueEntryP(AMId) as AMQueueEntryP;\n  components AMQueueP, ActiveMessageC;\n\
    \n  AMQueueEntryP.Send -> AMQueueP.Send[unique(UQ_AMQUEUE_SEND)];\n  AMQueueEntryP.AMPacket\
    \ -> ActiveMessageC;\n\n  AMSend = AMQueueEntryP;\n  Packet = ActiveMessageC;\n\
    \  AMPacket = ActiveMessageC;\n  Acks = ActiveMessageC;\n}\n```"
