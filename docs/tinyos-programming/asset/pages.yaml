  md: "The former has the problem of code duplication (and file bloat), while the\
    \ latter depends on run-time checking, which is notably deficient in C. Having\
    \ a generic queue enables compile-time checking for the values put in and out\
    \ of a queue.\n\n# 3.2.2  Bidirectional interfaces\n\nSo far, we’ve only seen\
    \ interfaces that have either commands or events, but not both. Bidirectional\
    \ interfaces declare both commands from a user to a provider as well as events\
    \ from a provider to a user. For example, this is the Notify interface, which\
    \ allows a user to ask that it be notified of events, which can have data associated\
    \ with them:\n\n```\ninterface Notify<val_t> {\n  command error_t enable();\n\
    \  command error_t disable();\n  event void notify(val_t val);\n}\n```\n\nListing\
    \ 3.12  The Notify interface\n\nThe Notify interface has two commands, for enabling\
    \ and disabling notifications. If notifications are enabled, then the provider\
    \ of the interface signals notify events. The Notify interface is generic as,\
    \ depending on the service, it might need to provide different kinds of data.\
    \ Bidirectional interfaces enable components to register callbacks without needing\
    \ function pointers.\n\nFor instance, some hardware platforms have a button on\
    \ them. A button lends itself well to the Notify interface: a component can turn\
    \ notifications of button pushes on and off. For example, UserButtonC is a component\
    \ that provides this abstraction:\n\n```\nconfiguration UserButtonC {\n  provides\
    \ interface Get<button_state_t>;\n  provides interface Notify<button_state_t>;\n\
    }\n```\n\nListing 3.13  UserButtonC\n\n![](img/53ede4f4266a5731b93bff15d85fa06a_51_0.png)\n\
    \n**Figure 3.4**  Commands and events for UserButtonC."
  merge: -1
  img_proc: true
- pgno: 52
  md: "In addition to the Notify interface, which tells a user when the button state\
    \ has changed, UserButtonC provides the Get interface, which a component can use\
    \ to actively query the state of the button. Figure 3.4 shows the call directions\
    \ of the commands and events of UserButtonC.\n\nA component that provides Notify\
    \ must implement the commands enable and disable, and can signal the notify event.\
    \ A component that uses Notify can call the enable and disable commands, and must\
    \ implement the notify event. In the case of UserButtonC, button_state_t describes\
    \ whether the button is up or down.\n\nTimer is another bidirectional interface.\
    \ Timer is a generic interface, but it uses types in a slightly different way\
    \ than Get or Notify. The type in a Timer interface is not used in any of its\
    \ commands or events. Instead, the type represents a timer granularity. For example\
    \ a Timer<TMilli> is a millisecond timer.¹ while a Timer<TMicro> is a microsecond\
    \ timer. Typing in this way enables nesC to check that the Timer a component uses\
    \ is the right granularity while only having a single Timer interface: you cannot\
    \ wire a microsecond timer to a component that needs a millisecond timer. This\
    \ is a subset of the Timer interface; it has additional, advanced operations which\
    \ are elided for simplicity:\n\n```\ninterface Timer<precision_tag> {\n  command\
    \ void startPeriodic(uint32_t dt);\n  command void startOneShot(uint32_t dt);\n\
    \  command void stop();\n  event void fired();\n  // Advanced operations follow\n\
    }\n```\n\nListing 3.14 Simplified Timer interface showing three commands and one\
    \ event\n\nThe fired event signals in response to the start commands, which differ\
    \ in whether they cause a series of timer firings (startPeriodic) or a single\
    \ fired event (startOneShot). The dt parameter specifies the timer interval.\n\
    \nTimer differs from Notify in a subtle but significant way: the user controls\
    \ the timing and number of events. Notify allows users to turn events on and off;\
    \ Timer allows users to control which events are signaled and when. There is therefore\
    \ a much tighter coupling between the commands and events. With Notify, it's possible\
    \ that no events will ever be signaled even if Notify is enabled. With Timer,\
    \ one can describe exactly what events will be signaled based on what commands\
    \ are called.\n\n# 3.3 Component implementations\n\nModules and configurations\
    \ differ in their implementation sections.\n\n¹ Note that a TMilli timer fires\
    \ 1024 times per second, not 1000. This is due to the fact that many microcontrollers\
    \ do not have the ability to count at 1 kHz accurately, but they can count at\
    \ 1024 Hz accurately."
  merge: -1
  img_proc: true
- pgno: 53
  md: "# 3.3.1 Modules\n\nModule implementations are written in nesC’s dialect of\
    \ the C language. At the level of single statements, nesC is almost identical\
    \ to C. It differs mainly in how code calls functions and variable scoping. As\
    \ a component must implement commands for interfaces it provides and events for\
    \ interfaces it uses, a module’s code must define these functions. For example,\
    \ this is the module code for the PowerupC module:\n\n```\nmodule PowerupC {\n\
    \  uses interface Boot;\n  uses interface Leds;\n}\nimplementation {\n  event\
    \ void Boot.booted() {\n    call Leds.led0On();\n  }\n}\n```\n\nListing 3.15 PowerupC\
    \ module code\n\nAs PowerupC uses the Boot interface, and Boot has a single event,\
    \ booted, PowerupC must provide an implementation: event void Boot.booted() {\
    \ ... }. When the provider of Boot signals this event, PowerupC turns on LED 0\
    \ of the Leds interface. Modules invoke commands with the call keyword and invoke\
    \ events with the signal keyword. For this reason, you’ll often see the terms\
    \ “call commands” and “signal events.” The Leds interface has three LEDs, mostly\
    \ for historical reasons. They are named led0, led1, and led2. In addition to\
    \ turning LEDs on (e.g., led0On), the Leds interface allows you to turn them off\
    \ (e.g., led0Off) and toggle them (e.g., led0Toggle). For example, this component\
    \ will cause system boot to enter an infinite loop that toggles all three LEDs:\n\
    \n```\nmodule PowerupToggleC {\n  uses interface Boot;\n  uses interface Leds;\n\
    }\nimplementation {\n  event void Boot.booted() {\n    while (1) {\n      call\
    \ Leds.led0Toggle();\n      call Leds.led1Toggle();\n      call Leds.led2Toggle();\n\
    \    }\n  }\n}\n```\n\nListing 3.16 The module PowerupToggleC\n\nFor PowerupToggleC\
    \ to do anything, we must specify which components providing Boot and Leds we\
    \ want to connect PowerupToggleC to. This is the role of the PowerupToggleAppC\
    \ configuration which we will write next."
  merge: -1
  img_proc: true
- pgno: 54
  md: '# 3.3.2 A basic configuration


    Modules allocate state and implement executable logic. However, like all components,
    they can only name functions and variables within their local namespaces, i.e.,
    those defined in their signature and implementation. For one module to be able
    to call another, we have to map a set of names (generally interfaces) in one component''s
    signature to a set of names in another component signature. In nesC, connecting
    two components in this way is called wiring. Configurations, nesC''s second kind
    of component, contain these wirings. Modules implement program logic, configurations
    connect components together into larger abstractions.


    Configurations look very similar to modules. They have a specification and an
    implementation. This is the PowerupToggleAppC configuration, which connects the
    PowerupToggleC module to the components that provide the Boot and Leds interfaces.


    ```

    configuration PowerupToggleAppC () {

    implementation {

    components MainC, LedsC, PowerupToggleC;


    PowerupToggleC.Boot -> MainC.Boot;

    PowerupToggleC.Leds -> LedsC.Leds;

    }

    }

    ```


    Listing 3.17 The PowerupToggleAppC configuration


    A configuration must name which components it is wiring with the components keyword.
    Any number of component names can follow components, and their order does not
    matter. The keyword remains plural (components, not component) even if only a
    single component name follows. A configuration can have multiple components statements.
    A configuration must name a component before it wires it. For example, both of
    these are valid:


    ```

    components MainC, LedsC;

    components PowerupToggleC;

    PowerupToggleC.Boot -> MainC.Boot;

    PowerupToggleC.Leds -> LedsC.Leds;


    components PowerupToggleC;

    components MainC;

    PowerupToggleC.Boot -> MainC.Boot;

    components LedsC;

    PowerupToggleC.Leds -> LedsC.Leds;

    ```


    Listing 3.18 Example uses of the components keyword


    Syntactically, configurations are very simple. They have three operators: ->,
    <- and =. The = operator is used for wiring the configuration''s specification,
    as we will see in'
  merge: -1
  img_proc: true
- pgno: 55
  md: "Chapter 4. The two arrows are for wiring a configuration’s components to each\
    \ other: the arrow connects an interface user to an interface provider. The arrow\
    \ points from the user to the provider, but resolves the call paths of bidirectional\
    \ interfaces in both directions (used-to-provided commands, and provided-to-used\
    \ events). For example, the following two lines have the same effect:\n\n```\n\
    PowerupToggleC.Boot -> MainC.Boot;\nMainC.Boot <- PowerupToggleC.Boot;\n```\n\n\
    When PowerupToggleC calls Leds.led0Toggle, it names a function in its own local\
    \ scope. The LedsC component provides the Leds interface. Wiring the two, maps\
    \ the first to the second. This means that when PowerupToggleC calls its Leds.led0Toggle,\
    \ it actually calls LedsC’s Leds.led0Toggle. The same is true for other calls\
    \ of the Leds interface, such as Leds.led1On. The configuration PowerupToggleAppC\
    \ provides a mapping between the local namespaces of the two components.\n\nBecause\
    \ PowerupToggleAppC is the top-level configuration of the PowerupToggle application,\
    \ it does not provide or use any interfaces: its signature block is empty. Later,\
    \ in Chapter 4, we’ll introduce configurations that provide and use interfaces.\n\
    \n# 3.3.3 Module variables\n\nAll module variables are private: interfaces are\
    \ the only way that other components can access a variable. The Get interface,\
