- pgno: 168
  md: '# 9 Advanced wiring


    Chapter 4 introduced the basics of nesC component wiring, explaining the three
    wiring operators and how multiple wirings work. Chapter 8 introduced parameterized
    interfaces, which enable a single component implementation to efficiently provide
    an interface to many clients. Much of the most intricate nesC programming involves
    using parameterized interfaces. This chapter focuses on generic configurations,
    and how they can use parameterized interfaces to provide robust and flexible abstractions.


    # 9.1 unique() and uniqueCount()


    Parameterized interfaces were originally intended to support abstractions like
    active messaging. It turns out, however, that they are much more powerful than
    that. If you look at the structure of most basic TinyOS 2.0 abstractions, there’s
    a parameterized interface in there somewhere. The ability to specify compile-time
    constants outside of modules, combined with dispatch, means that we can use parameterized
    interfaces to distinguish between many different callers. A component can provide
    a service through a parameterized interface, and every client that needs to use
    the service can wire to a different parameter identifier. For split-phase calls,
    this means that you can avoid fan-out on the completion event. Consider these
    two examples:


    ```

    components RouterC, SourceAC, SourceBC;

    SourceAC.Send -> RouterC;

    SourceBC.Send -> RouterC;

    ```


    versus


    ```

    components RouterC, SourceAC, SourceBC;

    SourceAC.Send -> RouterC.Send[0];

    SourceBC.Send -> RouterC.Send[1];

    ```


    In both cases, SourceAC and SourceBC can call Send.send. In the first case, when
    RouterC signals Send.sendDone, that signal will fan-out to both SourceAC and SourceBC,
    who will have to determine – by examining the message pointer, or internal state
    variables – whether the event is intended for them or someone else. In the second
    case, however, if RouterC keeps the parameter identifier passed in the call to
    Send, then it can signal the appropriate completion event. For example, SourceBC
    calls Send.send, RouterC stores the identifier 1, and when it signals sendDone
    it signals it on Send.sendDone[1](...).'
  merge: -1
  img_proc: true
- pgno: 169
  md: "The combination of parameterized interfaces and generic configurations allows\
    \ TinyOS 2.0 to virtualize abstractions at compile-time, using only as much memory\
    \ as is needed and without using function pointers. Let’s return to the timer\
    \ example, where this abstraction is particularly powerful. The timer component\
    \ HiiTimerMilliC has the following signature:\n\n```\nconfiguration HiiTimerMilliC\
    \ {\n  provides interface Timer<TMilli>[uint8_t];\n}\n```\n\nListing 9.1 Partial\
    \ HiiTimerMilliC signature\n\nBecause Timer is parameterized, many different components\
    \ can wire to separate interface instances. When a component calls Timer.startPeriodic,\
    \ nesC fills in the parameter identifier, which the timer implementation can use\
    \ to keep track of which timer is being told to start. Similarly, the timer implementation\
    \ can signal Timer.fired on specific timer instances.\n\nFor things such as network\
    \ protocols, where the parameter to an interface is a basis for communication\
    \ and interoperability, the actual parameter used is important. For example, if\
    \ you have two different compilations of the same application, but one wires a\
    \ protocol with\n\n```\nRouterC.Send -> ActiveMessageC.Send[210];\n```\n\nwhile\
    \ the other wires it with\n\n```\nRouterC.Send -> ActiveMessageC.Send[211];\n\
    ```\n\nthen they will not be able to communicate. In these cases, the parameter\
    \ used is shared across nodes, and so needs to be globally consistent. Similarly,\
    \ if you had two protocols wire to the same AM type, then this is a basic conflict\
    \ that an application developer is going to have to resolve. Generally, protocols\
    \ use named constants (enums) to avoid these kinds of typos.\n\n# 9.1.1 unique\n\
    \nWith timers and the Send client example above, however, there is no such restriction.\
    \ The parameter represents a unique client identifier, rather than a piece of\
    \ shared data. A client doesn’t care which timer it wires to, as long as it wires\
    \ to one that nobody else does. For this case, rather than force clients to guess\
    \ identifiers and hope there is no collision, nesC provides a special compile-time\
    \ function, unique().\n\nIt is a compile-time function because it is resolved\
    \ at compile time. When nesC compiles an application, it replaces each call to\
    \ unique() by an integer. The unique function takes a string key as an argument,\
    \ and promises that every instance of the function with the same key will return\
    \ a unique value. Two calls to unique with different"
