    \ 2.1 – this diagram was generated automatically from PowerupAppC by nesdoc, nesC's\
    \ documentation generation tool.\n\nPowerupAppC illustrates the third major difference\
    \ between C and nesC: wiring makes the connections expressed by linking the C\
    \ version of Powerup with its \"mote\" library explicit. In the C version, Powerup\
    \ calls a global function named led0_on which is connected to whatever library\
    \ provides a function with the same name; if two libraries\n\n![](img/53ede4f4266a5731b93bff15d85fa06a_35_0.png)\n\
    \n# Figure 2.1 Wiring Diagram for Powerup application"
