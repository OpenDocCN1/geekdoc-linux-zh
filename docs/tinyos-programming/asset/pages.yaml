  md: "Finally, when the oscillator completion event is signaled, the component tells\
    \ the radio to enter RX mode and posts a task to signal the startDone event. It\
    \ has to post a task because oscillatorDone is async, while startDone is sync.\
    \ Note that the component also releases the bus for other users.\n\n```\nasync\
    \ event void CC2420Config.startOscillatorDone() {\n  call SubControl.start();\n\
    \  call CC2420Config.rxOn();\n  call Resource.release();\n  post startDone_task();\n\
    }\n```\n\nListing 11.11  The handler that the third step of starting the CC2420\
    \ radio is complete\n\nFinally, the task changes the radio’s state from STARTING\
    \ to STARTED:\n\n```\ntask void startDone_task() {\n  m_state = S_STARTED;\n \
    \ signal SplitControl.startDone( SUCCESS );\n}\n```\n\nListing 11.12  State transition\
    \ so components can send and receive packets\n\nAn alternative implementation\
    \ could have been to put the following code in the startOscillatorDone event:\n\
    \n```\natomic {\n  m_state = S_STARTED;\n}\n```\n\nThe only possible benefit in\
    \ doing so is that the radio could theoretically accept requests earlier. But\
    \ since components shouldn’t be calling the radio until the startDone event is\
    \ signaled, this would be a bit problematic. There’s no chance of another task\
    \ sneaking in between the change in state and signaling the event when both are\
    \ done in the startDone_task.\n\n> **Programming Hint 22**  KEEP ATOMIC STATEMENTS\
    \ SHORT, AND HAVE AS FEW OF THEM AS POSSIBLE. BE CAREFUL ABOUT CALLING OUT TO\
    \ OTHER COMPONENTS FROM WITHIN AN ATOMIC STATEMENT.\n\n# 11.1.6  Tasks, revisited\n\
    \nChapter 5 introduced tasks as a way to defer computation and keep a nesC program\
    \ responsive. They play an additional, critical role, however, with respect to\
    \ asynchronous"
