- pgno: 264
  md: "# Appendix TinyOS APIs\n\nThis appendix gives summaries of major TinyOS interfaces\
    \ and the components that provide them. It only covers hardware-independent HIL\
    \ interfaces and abstractions that are common across multiple hardware platforms.\
    \ In almost all cases, TinyOS Enhancement Proposals (TEPs) describe the abstractions\
    \ in greater depth, and we reference them as appropriate. Application-level abstractions\
    \ with split-phase interfaces are typically generics, which a user must instantiate.\
    \ For sake of brevity, this list shows the signatures of relevant components:\
    \ you can read the interfaces in your TinyOS distribution.\n\n# A.1    Booting\n\
    \nThe process of booting a mote is encapsulated in the MainC component, that signals\
    \ the Boot.booted event once all system services are initialized. Components that\
    \ require boot-time initialization should wire themselves to MainC’s SoftwareInit:\
    \ MainC’s SoftwareInit.init command is called after hardware initialization but\
    \ before booted is signaled.\n\n```\nconfiguration MainC {\n  provides interface\
    \ Boot;\n  uses interface Init as SoftwareInit;\n}\n```\n\nWe covered booting\
    \ in Section 6.1. The TinyOS boot process is described in TEP 107: TinyOS 2.x\
    \ Boot Sequence [14].\n\n# A.2    Communication\n\nTinyOS provides four basic\
    \ communication abstractions: active messages (AM, single-hop, unreliable communication),\
    \ collection (multi-hop, unreliable delivery to a data sink) and dissemination\
    \ (multi-hop, reliable delivery to every node in the network), and serial communication\
    \ (unreliable delivery over a serial line). We covered communication in Sections\
    \ 6.3, 6.4, and 7.1.1."
  merge: -1
  img_proc: true
- pgno: 265
  md: "The message_t type is used to declare packet buffers for TinyOS networking\
    \ protocols, as explained in TEP 111: message_t [15].\n\n# A.2.1 Single-hop\n\n\
    TinyOS has four standard single-hop communication components, all of which take\
    \ an AM type as a parameter, an 8-bit number that identifies different packet\
    \ types. Active message addresses are 16 bits. TinyOS defines the macro TOS_BCAST_ADDR\
    \ for the AM broadcast address, and a node can find its local address through\
    \ the AMPacket interface.\n\nAMSenderC sends packets. AMReceiverC signals reception\
    \ for packets addressed to the node, including the broadcast address; AMSnooperC\
    \ signals reception for packets not addressed for the node; AMSnoopingReceiverC\
    \ signals reception for all packets, regardless of addressing. The AM interfaces\
    \ automatically discard packets which do not pass a link-layer CRC check. The\
    \ PacketAcknowledgements interface allows transmitters to request for a link-layer\
    \ acknowledgement and check if one was received after transmission: PacketAcknowledgements.wasAcked\
    \ can be called in Send.sendDone.\n\n```\ngeneric configuration AMSenderC(am_id_t\
    \ AMId) {\n    provides {\n        interface AMSend;\n        interface Packet;\n\
    \        interface AMPacket;\n        interface PacketAcknowledgements as Acks;\n\
    \    }\n}\n```\n\n```\ngeneric configuration AMReceiverC(am_id_t AMId) {\n   \
    \ provides {\n        interface Receive;\n        interface Packet;\n        interface\
    \ AMPacket;\n    }\n}\n```\n\n```\ngeneric configuration AMSnooperC(am_id_t AMId)\
    \ {\n    provides {\n        interface Receive;\n        interface Packet;\n \
    \       interface AMPacket;\n    }\n}\n```\n\n```\ngeneric configuration AMSnoopingReceiverC(am_id_t\
    \ AMId) {\n    provides {\n        interface Receive;\n        interface Packet;\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 266
  md: "```\ninterface AMPacket;\n}\n```\n\nBy default, the radio stack is powered\
    \ off. You must turn it on in order to be able to send and receive packets. The\
    \ simplest way to do so is to put it in full-power (always-on) mode via the SplitControl\
    \ interface. The low-power section below (page 251) shows how you can turn it\
    \ on into a low-power state, where nodes periodically wake up to listen for packets.\
    \ For full-power control, wire and call SplitControl.start on ActiveMessageC.\n\
    \n```\nconfiguration ActiveMessageC {\n  provides {\n    interface SplitControl;\n\
    \    // interfaces elided here\n  }\n}\n```\n\nFor more details on these components\
    \ and their interfaces, refer to TEP 116: Packet Protocols [16]. The AM components\
    \ are typically found in tos/system.\n\nThe above components are all for radio\
    \ communication: there are also versions of these components for motes that are\
    \ connected via a serial port: SerialActiveMessageC, SerialAMSenderC, and SerialAMReceiverC.\
    \ These components are described in TEP 113: Serial Communication [7]. Note that\
    \ the serial stack does not perform address filtering, so there is no snooping.\n\
    \n# A.2.2 Multi-hop collection\n\nCollection protocols build routing trees to\
    \ nodes that advertise themselves as data sinks. Typically, sink nodes are connected\
    \ to a PC via a serial cable or other medium, although sometimes they log all\
    \ data they receive to non-volatile storage. While in good conditions collection\
    \ protocols can have 99.9% or better reliability, they do not promise reliability:\
    \ a sender does not receive feedback on whether its packets have arrived.\n\n\
    Collection implementations can be found in tos/lib/net. For example, the collection\
    \ tree protocol (CTP) implementation can be found in tos/lib/net/ctp while the\
    \ MultihopLQI implementation can be found in tos/lib/net/lqi.\n\nTo send packets,\
    \ a program instantiates a CollectionSenderC. To configure a node as a base station,\
    \ it should wire to CollectionControlC to call RootControl.setRoot as well as\
    \ instantiate relevant CollectionReceiverC services. Collection clients take a\
    \ collection identifier, similar to an AM type.\n\n```\ngeneric configuration\
    \ CollectionSenderC(collection_id_t collectid) {\n  provides {\n    interface\
    \ Send;\n    interface Packet;\n  }\n}\n```\n\n```\ngeneric configuration CollectionReceiverC(collection_id_t\
    \ collectid) {\n  provides {\n```"
