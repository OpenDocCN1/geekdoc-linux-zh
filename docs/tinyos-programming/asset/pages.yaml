    # 6.3.1 Sending packets\n\nOur anti-theft application currently reports theft\
    \ by lighting a LED, which is unlikely to be very effective. A much better approach\
    \ would be to alert someone, e.g. by sending them a radio message. This message\
    \ should contain as its payload the identity of the node being stolen. As discussed\
    \ in Section 3.5.3, TinyOS payloads are always defined using platform-independent\
    \ types to ensure interoperability. So the definition of the theft report payload\
