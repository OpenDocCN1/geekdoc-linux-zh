    \ of a hardware interrupt. Implies spontaneous.\n+   - @atomic_hwevent: this function\
    \ will be called as a result of a hardware interrupt, and will execute in an atomic\
    \ section. Implies spontaneous. The distinction between this attribute and @hwevent\
    \ is needed so nesC can know whether additional atomic sections are needed.\n\
    +   - @atmostonce: this interface must be wired to zero or one times.\n+   - @atleastonce:\
    \ this interface must be wired one or more times.\n+   - @exactlyonce: this interface\
