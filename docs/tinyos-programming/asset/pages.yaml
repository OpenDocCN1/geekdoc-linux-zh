    # 9.2.2 CC2420SpiC


    Another, more complex example of using generic configurations is CC2420SpiC. This
    component provides access to the CC2420 radio over an SPI bus. When the radio
    stack software wants to interact with the radio, it makes calls on an instance
    of this component. For example, telling the CC2420 to send a packet if there is
    a clear channel involves writing to one of the radio''s registers (TXONCCA). To
    write to the register, the stack sends a small series of bytes over the bus, which
    basically say "I''m writing to register number X with value Y." The very fast
    speed of the bus means that small operations such as these can made synchronous
    without any significant concurrency problems.


