- pgno: 192
  md: "However, dispatchers are often encapsulated in a generic configuration to simplify\
    \ their use. Rather than have a component wire to a parameterized interface, it\
    \ wires to a generic configuration that takes the parameter as an argument. For\
    \ example, rather than wire directly to ActiveMessageC to receive packets, applications\
    \ instantiates an AMReceiverC:\n\n```\ngeneric configuration AMReceiverC(am_id_t\
    \ amid) {\n  provides interface Receive;\n  provides interface Packet;\n  provides\
    \ interface AMPacket;\n}\nimplementation {\n  components ActiveMessageImplP as\
    \ Impl;\n\n  Receive = Impl.Receive[amId];\n  Packet = Impl;\n  AMPacket = Impl;\n\
    }\n```\n\nListing 10.1 AMReceiverC\n\nRewriting AppC using AMReceiverC gives:\n\
    \n```\nconfiguration AppC ()\nimplementation {\n  components AppP,\n  new AMReceiverC(AM_CLEARIDMSG)\
    \ as ClearId,\n  new AMReceiverC(AM_SETIDMSG) as SetId;\n\n  AppP.ClearIdMsg ->\
    \ ClearId;\n  AppP.SetIdMsg -> SetId;\n}\n```\n\n# Known uses\n\nThe Active Messages\
    \ networking layer (ActiveMessageC), and tree collection protocol (CollectionC)\
    \ use a dispatcher for packet reception. They also provide a parameterized packet\
    \ sending interface, so services can easily match packet sends to reception handlers.\n\
    \nThe Atmel AT45DB family flash chip implementation uses a parameterized interface\
    \ to map storage volume identifiers to storage volume characteristics (see the\
    \ At45dbStorageManagerC component in Section 12.1.1).\n\nThe TinyOS 1.x Maté virtual\
    \ machine uses a dispatcher to allow easy customization of instruction sets.\n\
    \n# Consequences\n\nBy leaving operation selection to nesC wirings, the dispatcher’s\
    \ implementation remains independent of what an application supports. However,\
    \ finding the full set of supported operations can require looking at many files.\
    \ Sloppy operation identifier management"
