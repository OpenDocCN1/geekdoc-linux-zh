  md: 'Accomplishing this is a little trickier than TimerMilliC, because a request
    to send has a few parameters. With Timer, those parameters (period, single-shot
    vs. repeat) are state that the timer implementation has to keep track of in the
    first place. With AMSendC, it’s a bit different: those parameters just need to
    be stored until the call to the underlying ActiveMessageC. The send queue could
    just store all of these parameters, that uses up four extra bytes of RAM per entry
    (two for the destination, one for the AM type, and one for the length).


    It turns out that the Packet and AMPacket interfaces have operations exactly for
    this situation. They allow a component to get and set packet fields. For example,
    a component can call Packet.setLength to set the length field and recover it with
    Packet.length. Components that just need basic send or receive abstractions can
    just use AMSend or Receive. The Packet interface, though, allows data structures
    such as queues to store temporary state within the packet and then recover it
    when it’s time to actually send so it can be passed as parameters. This means
    that the AM send queue with n clients allocates a total of (2n + 1) bytes of state,
    as pointers on microcontrollers are usually two bytes (on the intelmote2, though,
    they’re four bytes, so it allocates 4n + 1).


    This means that the AMSenderC abstraction needs to do the following things:


    +   1. Provide an AMSend interface

    +   2. Store the AMSend.send parameters before putting a packet on the queue

    +   3. Statically allocate a single private queue entry

    +   4. Store a send request packet in the queue entry when its entry is not occupied

    +   5. When it’s actually time to send the packet, reconstitute the send parameters
    and call ActiveMessageC


    AMSenderC has one additional complication: keyspaces (sets of identifiers). ActiveMessageC
    provides AMSend based on the AM type keyspace while the send queue has a client
    identifier keyspace for keeping track of which AMSenderC is sending. Because the
    queue needs to be able to send any AM type, it uses a parameterized AMSend and
    directly wires to ActiveMessageC.AMSend. Figure 9.2


    ![](img/53ede4f4266a5731b93bff15d85fa06a_180_0.png)'
