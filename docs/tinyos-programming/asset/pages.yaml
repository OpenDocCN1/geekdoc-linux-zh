  md: "On one hand, this approach is very simple and fast. On the other, it can lead\
    \ to significant problems with the stack. Imagine, for example, a component, FastSamplerC,\
    \ that wants to sample a sensor many times quickly (acquire a high-frequency signal).\
    \ It does this by calling Read.read in its Read.readDone handler:\n\n```\nevent\
    \ void Read.readDone(error_t err, uint16_t val) {\n  buffer[index] = val;\n  index++;\n\
    \  if (index < BUFFER_SIZE) {\n    call Read.read();\n  }\n}\n```\n\nListing 5.3\
    \ Signal handler that can lead to an infinite loop\n\nIf, for some reason, an\
    \ application wired FastSamplerC to FilterMagC, then there would be a long call\
    \ loop between read and readDone. If the compiler can’t optimize the function\
    \ calls away, this will cause the stack to grow significantly. Given that motes\
    \ often have limited RAM and no hardware memory protection, exploding the stack\
    \ like this can corrupt data memory and cause the program to crash.\n\nProgramming\
    \ Hint 17 DON’T SIGNAL EVENTS FROM COMMANDS — THE COMMAND SHOULD POST A TASK THAT\
    \ SIGNALS THE EVENT.\n\nOf course, acquiring a high-frequency signal from our\
    \ example Read implementation is a bit silly. As the implementation is caching\
    \ a value, sampling it more than once isn’t very helpful. But this call pattern\
    \ – issuing a new request in an event signaling request completion – is a common\
    \ one.\n\nThe problems caused by this signaling raise the question of how FilterMagC\
    \ is going to signal the readDone event. It needs a way to schedule a function\
    \ to be called later (like an interrupt). The right way to do this is with a task.\
    \ This is how our data filter component might look like implemented with a task:\n\
    \n```\nmodule FilterMagC {\n  provides interface StdControl;\n  provides interface\
    \ Read<uint16_t>;\n  uses interface Timer<TMilli>;\n  uses interface Read<uint16_t>\
    \ as RawRead;\n}\n\nimplementation {\n  uint16_t filterVal = 0;\n\n  ... unchanged\
    \ ...\n\n  task void readDoneTask() {\n    signal Read.readDone(SUCCESS, filterVal);\n\
    \  }\n}\n```"
