- pgno: 72
  md: '# 4  Configurations and wiring


    The previous chapter dealt predominantly with modules, which are the basic building
    blocks of a nesC program. Configurations are the second type of nesC component.
    They assemble components into larger abstractions.


    In a nesC program, there are usually more configurations than modules. Except
    for low-level hardware abstractions, any given component is built on top of other
    components, which are encapsulated in configurations. For example, Figure 4.1
    shows a routing stack (CollectionC) which depends on a single-hop packet layer
    (ActiveMessageC), which is itself a configuration. This single-hop configuration
    wires the actual protocol implementation module (e.g. setting header fields) to
    a raw packet layer on top of the radio (Link Layer). This raw packet layer is
    a configuration that wires the module which sends bytes out to the bus over which
    it sends bytes. The bus, in turn, is a configuration. These layers of encapsulation
    generally reach very low in the system.


    Encapsulating an abstraction in a configuration means that it can be ready-to-use:
    all we need to do is wire to its provided interfaces. In contrast, if it were
    a module that uses and provides interfaces, then we’d need to wire up dependencies
    and requirements as well. For example, a radio stack can use a wide range of resources,
    including buses, timers, random number generators, cryptographic support, and
    hardware pins. This is the signature of just one module of the CC1000 (a wireless
    radio chip from TI used in the mica2 family motes) radio stack:


    ![](img/53ede4f4266a5731b93bff15d85fa06a_72_0.png)


    **Figure 4.1** Some of the configurations in the CTP routing stack.'
  merge: -1
  img_proc: true
