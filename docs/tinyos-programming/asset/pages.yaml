- pgno: 193
  md: 'can lead to dispatch problems. If two operations are wired with the same identifier,
    then a dispatch will call both, which may lead to resource conflicts, data corruption,
    or memory leaks from lost pointers. For example, the Receive interface uses a
    buffer swap mechanism to pass buffers between the radio stack and network services,
    in which the higher component passes a new buffer in the return value of the event.
    If two services are wired to a given Receive instance, only one of their pointers
    will be passed and the second will be lost. Wiring in this fashion is a compile-time
    warning in nesC, but it is still a common bug for novice TinyOS developers.


    The key aspects of the dispatcher pattern are:


    +   - It allows you to easily extend or modify the functionality an application
    supports: adding an operation requires a single wiring.

    +   - It allows the elements of functionality to be independently implemented
    and re-used. Because each operation is implemented in a component, it can be easily
    included in many applications. Keeping implementations separate can also simplify
    testing, as the components will be smaller, simpler, and easier to pinpoint faults
    in. The nesC compiler will automatically inline small operations, or you can explicitly
    request inlining; thus this decomposition has no performance cost.

    +   - It requires the individual operations to follow a uniform interface. The
    dispatcher is usually not well suited to operations that have a wide range of
    semantics. As all implementations have to meet the same interface, broad semantics
    leads to the interface being overly general, pushing error checks from compile-time
    to run-time. An implementor forgetting a run-time parameter check can cause a
    hard-to-diagnose system failure.


    The compile-time binding of the operation simplifies program analysis and puts
    dispatch tables in the compiled code, saving RAM. Dispatching provides a simple
    way to develop programs that execute in reaction to their environment.


    # Related patterns


    +   - Service Instance: a service instance creates many instances of an implementation
    of an interface, while a dispatcher selects between different implementations
    of an interface.

    +   - Placeholder: a placeholder allows an application to select an implementation
    at compile-time, while a dispatcher allows it to select an implementation at run-time.

    +   - Keyspace: the identifiers used to identify a Dispatcher’s operation typically
    form a Global Keyspace.


    # 10.2 Structural: Service Instance


    # Intent


    Allows multiple users to have separate instances of a particular service, where
    the instances can collaborate efficiently. The basic mechanism for virtualizing
    services.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Motivation


    Sometimes many components or subsystems need to use a system abstraction, but
    each user wants a separate instance of that service. We don’t know how many users
    there will be until we build a complete application. Each instance requires maintaining
    some state, and the service implementation needs to access all of this state to
    make decisions.


    For example, a wide range of TinyOS components need timers, for everything from
    network timeouts to sensor sampling. Each timer appears independent, but they
    all operate on top of a single hardware clock. An efficient implementation thus
    requires knowing the state of all of the timers. If the implementation can easily
    determine which timer has to fire next, then it can schedule the underlying clock
    resource to fire as few interrupts as possible to meet this lowest timer’s requirement.
    Firing fewer interrupts allows the CPU to sleep more, saving energy and increasing
    lifetime.


    The traditional object-oriented approach to this problem is to instantiate an
    object representing the service and use another class to coordinate state. The
    closest nesC equivalent would involve instantiating a generic module for each
    timer, and using another module to coordinate state. However, instantiating one
    module per timer leads to duplicated code and requires inter-module coordination
    in order to figure out how to set the underlying hardware clock. Inter-module
    coordination could be avoided by setting the clock to a fixed rate and maintaining
    a counter for each Timer, but this would be inefficient: timer fidelity requires
    firing at a high rate, but it wastes energy to fire at 1 KHz if the next timer
    is in four seconds.


    The Service Instance pattern provides a solution to these problems. Using this
    pattern, each user of a service can have its own (virtual) instance, but instances
    share code and can access each other’s state. A component following the Service
    Instance pattern provides its service via a parameterized interface; each user
    wires to a unique instance of the interface using unique. The underlying component
    receives the unique identity of each client in each command, and can use it to
    index into a state array. The component can determine at compile-time how many
    instances exist using the uniqueCount function and dimension the state array accordingly.


    In most cases, components following the service instance pattern are made available
    to the user via a generic component that provides a non-parameterized interface,
    automating the use of unique. For instance, HIITimerMilliC follows the Service
    Instance pattern, but most TinyOS code uses the TimerMilliC generic component.


    # Applicable when


    +   - A component needs to provide multiple instances of a service, but does not
    know how many until compile-time.

    +   - Each service instance appears to its user to be independent of the others.

    +   - The service implementation needs to be able to easily access the state of
    every instance.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Structure


    ![](img/53ede4f4266a5731b93bff15d85fa06a_195_0.png)


    # Participants


    +   - **ServiceProvider**: allocates state for each instance of the service and
    coordinates underlying resources based on all of the instances.

    +   - **ResourceImpl**: an underlying system resource that ServiceProvider multiplexes/demultiplexes
    service instances on.


    # Sample code


    HiTimerMilliC uses a VirtualizeTimerC to present a Service Instance of millisecond
    precision timers. VirtualizeTimerC takes a single underlying timer and virtualizes
    it to n timers for others to use:


    ```

    generic module VirtualizeTimerC(typedef precision_tag, int max_timers) {

    provides interface Timer<precision_tag> as Timer[uint8_t num];

    uses interface Timer<precision_tag> as TimerFrom;

    }

    ```


    Listing 10.2 VirtualizeTimerC


    It takes two parameters, a type for the Timer precision tag (TMilli, etc), and
    the number of timers (the number of service instances). Instantiating TimerMilliC
    to create a new timer thus involves many files:


    +   1. TimerMilliC, which wires to HiTimerMilliC''s parameterized interface with
    a call to unique passing UQ_TIMER_MILLI.

    +   2. Timer.h, a header file that defines the unique key as UQ_TIMER_MILLI.

    +   3. HiTimerMilliC, which instantiates a VirtualizeTimerC with a call to uniqueCount
    passing UQ_TIMER_MILLI.

    +   4. VirtualizeTimerC, which provides n virtualized timers.

    +   5. The underlying per-platform components that provide the single Timer to
    be virtualized.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Known uses


    Most TinyOS services follow the Service Instance pattern, though most services
    (e.g. TimerMilliC, BlockStorageC from Chapter 6 or Atm128I2CMasterC from Chapter
    13) hide it behind a programmer-friendly generic component.


    The generic arbiter implementations such as FcfsArbiterC (Chapter 11) expose the
    Service Instance pattern to the programmer, as does VirtualizeTimerC.


    In a similar vein, the epidemic dissemination protocol Drip (available via the
    DisseminatorC generic component) uses the service instance pattern to maintain
    epidemic state for each disseminated value.


    # Consequences


    The key aspects of the Service Instance pattern are:


    +   - It allows many components to request independent instances of a common system
    service: adding an instance requires a single wiring.


    +   - It controls state allocation, so the amount of RAM used is scaled to exactly
    the number of instances needed, conserving memory while preventing run-time failures
    due to many requests exhausting resources.


    +   - It allows a single component to coordinate all of the instances, which enables
    efficient resource management and coordination.


    Because the pattern scales to a variable number of instances, the cost of its
    operations may scale linearly with the number of users. For example, if setting
    the underlying clock interrupt rate depends on the timer with the shortest remaining
    duration, an implementation might determine this by scanning all of the timers,
    an O(n) operation.


    If many users require an instance of a service, but each of those instances are
    used rarely, then allocating state for each one can be wasteful. The other option
    is to allocate a smaller amount of state and dynamically allocate it to users
    as needs be. This can conserve RAM, but requires more RAM per real instance (client
    IDs need to be maintained), imposes a CPU overhead (allocation and deallocation),
    can fail at run-time (if there are too many simultaneous users), and assumes a
    reclamation strategy (misuse of which would lead to leaks). This long list of
    challenges makes the Service Instance an attractive – and more and more commonly
    used – way to efficiently support application requirements.


    There are situations, however, when a component internally re-uses a single service
    instance for several purposes: for example, the Maté virtual machine code propagation
    component uses a single timer instance for several different timers which never
    operate concurrently.


    # Related patterns


    +   - Dispatcher: a service instance creates many instances of an implementation
    of an interface, while a dispatcher selects between different implementations
    of an interface.


    +   - Keyspace: a Service Instance’s instance identifiers form a Local Keyspace.'
  merge: -1
  img_proc: true
- pgno: 197
  md: "# 10.3 Namespace: Keyspace\n\n# Intent\n\nProvide namespaces for referring\
    \ to protocols, structures, or other entities in a program.\n\n# Motivation\n\n\
    A typical sensor network program needs namespaces for the various entities it\
    \ manages, such as protocols, data types, or structure instances. Limited resources\
    \ mean names are usually stored as small integer keys.\n\nFor data types representing\
    \ internal program structures, each instance must have a unique name, but as they\
    \ are only relevant to a single mote, the names can be chosen freely. These local\
    \ namespaces are usually dense, for efficiency. The Service Instance pattern (Section\
    \ 10.2) uses a local namespace to identify instances. In contrast, communication\
    \ requires a shared, global namespace: two notes/applications must agree on an\
    \ element's name. As a mote may only use a few elements, global namespaces are\
    \ typically sparse. The Dispatcher pattern (Section 10.1) uses a global namespace\
    \ to select operations.\n\nThe Keyspace patterns provide solutions to these problems.\
    \ Using these patterns, programs can refer to elements using identifiers optimized\
    \ for their particular use. Components using the Keyspace patterns often take\
    \ advantage of a parameterized interface, in which the parameter is an element\
    \ in a Keyspace. Local Keyspaces are designed for referring to local data structures\
    \ (e.g. arrays) and are generated with unique; Global Keyspaces are designed for\
    \ communication and use global constants (normally defined using enum).\n\nThe\
    \ AM identifiers used to distinguish message types form a Global Keyspace. ActiveMessageC\
    \ uses these AM identifiers in conjunction with a Dispatcher to execute the appropriate\
    \ message handlers found in other components. Local Keyspaces have other uses\
    \ than identifying clients in the Service Instance pattern: the Maté virtual machine\
    \ uses a Local Keyspace to identify locks corresponding to resources used by Maté\
    \ programs. These lock identifiers are allocated with unique as the Maté virtual\
    \ machine can be compiled with varying sets of resources.\n\n# Applicable when\n\
    \n+   - A program must keep track of a set of elements or data types.\n+   - The\
    \ set is known and fixed at compile-time.\n\n# Sample code\n\nThe AM identifiers\
    \ for the SoundLocalizer application (Chapter 13) are defined as global constants:\n\
    \n```\nenum {\n  AM_COORDINATION_MSG = 101,\n  AM_DETECTION_MSG = 102\n};\n```"
