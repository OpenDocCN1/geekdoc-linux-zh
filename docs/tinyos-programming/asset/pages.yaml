  md: "right unique key. This means that unique() is called in only one file; as long\
    \ as all components allocate timers with TimerMilliC, there is no chance of a\
    \ key match mistake. TimerMilliC’s implementation is very simple:\n\n```\ngeneric\
    \ configuration TimerMilliC() {\n  provides interface Timer<TMilli>;\n}\nimplementation\
    \ {\n  components TimerMilliP;\n  Timer = TimerMilliP.TimerMilli[unique(UQ_TIMER_MILLI)];\n\
    }\n```\n\nListing 9.5 The TimerMilliC generic configuration\n\nTimerMilliP is\
    \ a singleton configuration that auto-wires HiiTimerMilliC to the boot sequence\
    \ and exports HiiTimerMilliC’s parameterized interface:\n\n```\nconfiguration\
    \ TimerMilliP {\n  provides interface Timer<TMilli> as TimerMilli[uint8_t id];\n\
