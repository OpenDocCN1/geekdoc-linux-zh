  md: "# 2.3 Wiring and callbacks\n\nLeaving the component connection decisions to\
    \ the programmer does more than just simplify switching between multiple service\
    \ implementations. It also provides an efficient mechanism for supporting callbacks,\
    \ as we show through the example of timers. TinyOS provides a variable number\
    \ of periodic or deadline timers; associated with each timer is a callback to\
    \ a function that is executed each time the timer fires. We first look at how\
    \ such timers would be expressed in C, by modifying Powerup to blink LED 0 at\
    \ 2 Hz rather than turn it on once and for all:\n\n```\n#include \"mote.h\"\n\n\
    timer_t mytimer;\n\nvoid blink_timer_fired(void)\n{\n    leds0_toggle();\n}\n\n\
    int main()\n{\n    mote_init();\n    timer_start_periodic(&mytimer, 250, blink_timer_fired);\n\
    \    sleep();\n}\n```\n\nListing 2.5 Powerup with blinking LED in C\n\nIn this\
    \ example, the Blink application declares a global mytimer variable to hold timer\
    \ state, and calls timer_start_periodic to set up a periodic 250 ms timer. Every\
    \ time the timer fires, the timer implementation performs a callback to the blink_timer_fired\
    \ function specified when the timer was set up. This function simply calls a library\
    \ function that toggles LED 0 on or off.\n\nThe nesC version of Blink is similar\
    \ to the C version, but uses interfaces and wiring to specify the connection between\
    \ the timer and the application:\n\n```\nmodule BlinkC {\n    uses interface Boot;\n\
    \    uses interface Timer;\n    uses interface Leds;\n}\nimplementation {\n  \
    \  event void Boot.booted() {\n        call Timer.startPeriodic(250);\n    }\n\
    \    event void Timer.fired() {\n```"
