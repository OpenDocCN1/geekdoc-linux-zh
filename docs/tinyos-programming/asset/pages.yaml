    \ indicates whether the component is busy.\n\n```\ncommand result_t SendMsg.send\
    \ ... {\n    if (!state) {\n        state = TRUE;\n        // send a packet\n\
    \        return SUCCESS;\n    }\n    return FAIL;\n}\n```\n\n# Listing 11.5 State\
    \ transition that is not async-safe\n\nIf this command were async, then it's possible\
    \ between the conditional if (!state) and the assignment state = TRUE that another\
    \ component jumps in and tries to send as well. This second call will see state\
    \ to be false, set state to true, start a send and return SUCCESS. But then the\
    \ first caller will result, send state to true again, start a"
