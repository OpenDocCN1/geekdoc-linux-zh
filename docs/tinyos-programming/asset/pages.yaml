  md: "> **Programming Hint 20**  \n> Whenever writing a module, consider making it\
    \ more general-purpose and generic. In most cases, modules must be wrapped by\
    \ configurations to be useful, so singleton modules have few advantages.\n\n#\
    \ 9.4 Exercises\n\n+   1. Use the TinyOS timer library to create a second-granularity\
    \ timer abstraction, TimerSecondC. If you virtualize on top of a TimerMilliC,\
    \ then the low-level timer only needs to scan one timer entry for all of the second-granularity\
    \ timers. Be careful with the unique key to your HifTimerSecondC’s parameterized\
    \ interface.\n+   \n+   2. The standard TinyOS collection layer, CTP (found in\
    \ `tos/lib/net/ctp`), routes packets across multiple hops to a data sink node.\
    \ CTP has a send queue of depth `C + F`, where `C` is the number of sending clients\
    \ and `F` is the size of its pool of packets for forwarding. This means that a\
    \ client can get up to `1/(C+F)` of the available link throughput. Change CtpForwardingEngineP\
    \ and CollectionSenderP so that there is a separate client queue, which sits on\
    \ top of a single entry in CtpForwardingEngineP’s queue, causing a client to get\
    \ at most `1/(C+F)` of the link throughput.\n+   \n+   3. Write a barrier for\
    \ an arbitrary number of clients. A barrier is a concurrency primitive that blocks\
    \ until all threads reach it. In TinyOS, since there are no threads, this means\
    \ block until all callers reach it. Write a split-phase interface, `Barrier`,\
    \ which has a single command, `wait`, and a single event pass. When all clients\
    \ have called `wait`, the barrier should signal pass to all of them."
