    \ nesC namespace, and correspondingly, interface exports, is one of the most challenging\
    \ aspects of nesC programming, and so this chapter goes over it in detail with\
    \ many examples.\n\n# 4.1 Configurations\n\nChapter 3 gave a brief introduction\
    \ to configurations, showing examples of top-level configurations. Because top-level\
    \ configurations wire components together into a completed application, they neither\
    \ provide nor use interfaces. This lack of entries in the component signature\
    \ is uncommon: most configurations are systems or abstractions that other components\
    \ can use.\n\nLet’s revisit the syntax of a configuration. The first block of\
    \ a configuration is its signature, which states that interfaces that the component\
    \ uses or provides. The second block of a configuration is its implementation,\
