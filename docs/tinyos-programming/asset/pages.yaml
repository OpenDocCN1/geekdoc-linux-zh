  md: "beyond the scope of this book, but it’s worthwhile to present the most common\
    \ attributes and how they are used. nesC attributes look like Java annotations.\
    \ An attribute declaration is a struct declaration where the name is preceded\
    \ by @. Attributes can therefore have fields, which can be initialized. We’ve\
    \ already seen three attributes, @integer, @number, and @combine. For instance,\
    \ the combine attribute we saw in Section 4.4.3 takes a string as argument, behaving\
    \ as if³ it were declared by:\n\n```\nstruct @combine {\n  char *function_name;\n\
    };\n```\n\n```\n// Using the combine attribute in a type definition\ntypedef uint8_t\
    \ error_t @combine('ecombine');\n```\n\nThe declaration of error_t is annotated\
    \ with the string \"ecombine\", specifying the name of the combine function for\
    \ error_t. The argument in parentheses actually uses the same syntax (minus the\
    \ {}) as a regular C initializer for the attribute’s struct definition.\n\nUser-defined\
    \ attributes can be attached to most names (components, interfaces, typedefs,\
    \ variables, functions, etc) in nesC programs:\n\n```\nstruct @atleastonce { };\n\
    \nconfiguration LedsC {\n  provides interface Init @atleastonce();\n  provides\
    \ interface Leds;\n}\n```\n\nListing 8.21 nesC attributes\n\nThis example shows\
    \ the declaration of the atleastonce attribute, which has no fields. The configuration\
    \ LedsC annotates its Init interface with the attribute. By default, the @atleastonce\
    \ attribute doesn’t do anything. But the nesC compiler has tools to output information\
    \ about an application, including attributes. Part of the default TinyOS compilation\
    \ process includes running a script that checks wiring constraints, of which atleastonce\
    \ is one (the others are atomstonce, exactlyonce). The tool checks that an interface\
    \ annotated with atleastonce is wired to at least once. In the case of something\
    \ like Init, the utility of this check is pretty clear: you can check at compile-time\
    \ that your component is being initialized.\n\nAttributes provide a way to extend\
    \ the nesC language without introducing new keywords, which could break older\
    \ code. The current common attributes are:\n\n+   - @spontaneous: this function\
    \ might be called from outside the nesC program, and so should not be pruned by\
    \ nesC’s dead code elimination. This attribute is needed for interrupt handlers\
    \ and whenever you want to link binaries (e.g. with TOSSIM).\n\n+   - @C: this\
    \ function should be considered a C, rather than a nesC, function. Specifically,\
    \ if a component defines a function with this attribute, then it is not made private\
    \ to the\n\n³ combine is built in to the nesC compiler."
