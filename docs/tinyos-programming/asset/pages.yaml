- pgno: 157
  md: "```\ncommand uint8_t Queue.maxSize() {\n    return queueSize;\n}\n\ncommand\
    \ queue_t Queue.head() {\n    return queue[head];\n}\n\ncommand queue_t Queue.dequeue()\
    \ {\n    queue_t t = call Queue.head();\n    if (!call Queue.empty()) {\n    \
    \    if (++head == queueSize) head = 0;\n        size--;\n    }\n    return t;\n\
    }\n\ncommand error_t Queue.enqueue(queue_t newVal) {\n    if (call Queue.size()\
    \ < call Queue.maxSize()) {\n        queue[tail++] = newVal;\n        if (tail\
    \ == queueSize) tail = 0;\n        size++;\n        return SUCCESS;\n    } else\
    \ {\n        return FAIL;\n    }\n}\n\ncommand queue_t Queue.element(uint8_t idx)\
    \ {\n    idx += head;\n    if (idx >= queueSize) idx -= queueSize;\n    return\
    \ queue[idx];\n}\n```\n\nListing 8.6 QueueC implementation\n\nConsistency issues\
    \ can arise when multiple components share an ADT. In general, an abstract data\
    \ type implementation's commands should behave correctly even if there are multiple\
    \ clients. However, it is up to the clients to handle consistency issues across\
    \ multiple calls: if client A calls Queue.size in two different tasks and client\
    \ B calls Queue.enqueue, then client A may get different sizes, depending on the\
    \ order of the calls. These issues are more complex for abstract data types such\
    \ as BitVectorC that can be used from asynchronous code – see Chapter 11 for more\
    \ discussion on this topic.\n\n# 8.2.3 ADTs in TinyOS 1.x\n\nTinyOS 1.x uses only\
    \ the second approach, an interface with by-reference parameters, because it does\
    \ not have generic modules. For example, the Maté virtual machine supports scripting\
    \ languages with typed variables, and provides functionality for"
