- pgno: 22
  md: '# Programming hints, condensed


    Programming Hint 1 Use the "as" keyword liberally. (page 24)


    Programming Hint 2 Never write recursive functions within a module. In combination
    with the TinyOS coding conventions, this guarantees that all programs have bounded
    stack usage. (page 38)


    Programming Hint 3 Never use malloc and free. Allocate all state in components.
    If your application requirements necessitate a dynamic memory pool, encapsulate
    it in a component and try to limit the set of users. (page 38)


    Programming Hint 4 When possible, avoid passing pointers across interfaces; when
    this cannot be avoided only one component should be able to modify a pointer''s
    data at any time. (page 39)


    Programming Hint 5 Conserve memory by using enums rather than const variables
    for integer constants, and don''t declare variables with an enum type. (page 42)


    Programming Hint 6 Never, ever use the "packed" attribute in portable code. (page
    43)


    Programming Hint 7 Use platform-independent types when defining message structures.
    (page 44)


    Programming Hint 8 If you have to perform significant computation on a platform-independent
    type or access it many (hundreds or more) times, temporarily copy it to a native
    type. (page 44)


    Programming Hint 9 Interfaces should #include the header files for the types they
    use. (page 46)


    Programming Hint 10 Always #define a preprocessor symbol in a header file. Use
    #include to load the header file in all components and interfaces that use the
    symbol. (page 47)


    Programming Hint 11 If a component is a usable abstraction by itself, its name
    should end with C. If it is intended to be an internal and private part of a larger
    abstraction, its name should end with P. Never wire to P components from outside
    your package (directory). (page 58)


    Programming Hint 12 Auto-wire Init to MainC in the top-level configuration of
    a software abstraction. (page 60)


    Programming Hint 13 When using layered abstractions, components should not wire
    across multiple abstraction layers: they should wire to a single layer. (page
    63)


    Programming Hint 14 Never ignore combine warnings. (page 68)'
