  md: '# 1 Introduction


    This book is about writing TinyOS systems and applications in the nesC language.
    This chapter gives a brief overview of TinyOS and its intended uses. TinyOS is
    an open-source project which a large number of research universities and companies
    contribute to. The main TinyOS website, www.tinyos.net, has instructions for downloading
    and installing the TinyOS programming environment. The website has a great deal
    of useful information which this book doesn’t cover, such as common hardware platforms
    and how to install code on a node.


    # 1.1 Networked, embedded sensors


    TinyOS is designed to run on small, wireless sensors. Networks of these sensors
    have the potential to revolutionize a wide range of disciplines, fields, and technologies.
    Recent example uses of these devices include:


    # Golden Gate Bridge safety


    High-speed accelerometers collect synchonized data on the movement of and oscillations
    within the structure of San Francisco’s Golden Gate Bridge. This data allows the
    maintainers of the bridge to easily observe the structural health of the bridge
    in response to events such as high winds or traffic, as well as quickly assess
    possible damage after an earthquake [10]. Being wireless avoids the need for installing
    and maintaining miles of wires.


    # Volcanic monitoring


    Accelerometers and microphones observe seismic events on the Reventador and Tungurahua
    volcanoes in Ecuador. Nodes locally compare when they observe events to determine
    their location, and report aggregate data to a camp several kilometers away using
    a long-range wireless link. Small, wireless nodes allow geologists and geophysicists
    to install dense, remote scientific instruments [30], obtaining data that answers
    other questions about unapproachable environments.


    # Data center provisioning


    Data centers and enterprise computing systems require huge amounts of energy,
    to the point at which they are placed in regions that have low power costs. Approximately
    50% of the energy in these systems goes into cooling, in part due to highly conservative
    cooling systems. By installing wireless sensors across machine racks, the data
    center can automatically sense what areas need cooling and can adjust which computers
    do work and generate heat [19]. Dynamically adapting'
