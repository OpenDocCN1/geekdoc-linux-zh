  md: "```\nevent message_t *RCoordination.receive(message_t *m, void *payload, uint8_t\
    \ len){\n    uint32_t arrivalTime = now(); // Note arrival time.\n\n    if (len\
    \ == sizeof(coordination_msg_t)) // Validate received message\n    {\n       \
    \ coordination_msg_t *cmsg = payload;\n\n        if (... first message from coordinator\
    \ ...)\n        {\n            t0 = arrivalTime;\n            call VotingTimer.stop();\n\
    \            call Stats.reset();\n        }\n\n        call Stats.data(cmsg->count,\
    \ arrivalTime - t0);\n\n        // Prepare for event detection when its time is\
    \ close\n        if (cmsg->count >=\n            cmsg->sample_at - (MICROPHONE_WARMUP\
    \ / cmsg->interval) - 3)\n            scheduleSampling(cmsg->sample_at);\n   \
    \     return m;\n    }\n    ...\n}\n```\n\n# Listing 13.1 SynchronizerC: time\
    \ synchronization for SoundLocalizer\n\nThis code’s first step is to note the\
    \ message’s arrival time by calling the get command of the Counter<TMicro, uint32_t>\
    \ interface. Counter is a hardware-independent interface for counting time. Like\
    \ other other time interfaces, Counter takes type arguments which indicate the\
    \ precision (millisecond (TMilli), microsecond (TMicro), etc.), and width (16-bit\
    \ (uint16_t), 32-bit (uint32_t), etc.) of its time measurements:\n\n```\ninterface\
    \ Counter<precision_tag, size_type> {\n    async command size_type get();\n  \
    \  async command bool isOverflowPending();\n    async command void clearOverflow();\n\
    \    async event void overflow();\n}\n```\n\n# Listing 13.2 The Counter interface\n\
    \nThe get command returns the current time, while the remaining commands and events\
    \ allow a Counter user to gracefully handle counter overflow – a 32-bit microsecond\
    \ counter overflows every 71 minutes, a 16-bit microsecond counter overflows 15\
    \ times a second, so handling overflow is a practical requirement for many applications.\
    \ However, in the case of SoundLocalizer we can ignore the overflow issue. SynchronizerC\
    \ divides"
