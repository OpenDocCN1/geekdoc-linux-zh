    \ SPI bus implementation. For the ST M25P, this connection is specified by the\
    \ platform-specific HplStm25pSpiC component, and Stm25pSpiC contains platform-independent\
    \ code with low-level erase, read, write, and CRC computation operations. For\
    \ the AT45DB041B, each platform must implement the HplAt45dbC component which\
    \ provides low-level erase, read, write, CRC computation, status, and cache-management\
    \ operations.\n\nHAA structures vary significantly across devices. For instance,\
    \ Figure 12.3 summarizes TinyOS's support for timers on the micaz platform. At\
    \ the lowest layer, four HPL components provide access to the four ATmega128 timers.\
    \ Two of these timers (0 and 2) are 8-bit, and two (1 and 3) are 16-bit. Furthermore,\
    \ timer 0 supports an “asynchronous” mode where it is clocked by an external (usually\
    \ 32 768 Hz) crystal, while the other timers are clocked from the same source\
    \ as the microcontroller, an external 7.37 MHz crystal on the micaz. On the mica,\
    \ timer 0 is dedicated to implementing TinyOS's timer subsystem, HilTimerMilliC:\n\
    \n```\nconfiguration HilTimerMilliC {\n  provides interface Init;\n  provides\
    \ interface Timer<TMilli> as TimerMilli[uint8_t num];\n  provides interface LocalTime<TMilli>;\n\
    }\n```\n\nThe user-level timer components, TimerMilliC (and LocalTimeMilliC) are\
