- pgno: 102
  md: "# 6 Applications\n\nYou have already seen several of the basic TinyOS components\
    \ and interfaces, such as booting (MainC, Boot), LED control (LedsC, Leds), and\
    \ timing (TimerMilliC, Timer). In this chapter, we’ll present these components\
    \ in more detail, along with the other basic TinyOS subsystems (sensing, communication,\
    \ storage). We introduce and motivate all these subsystems through a running example,\
    \ a simple anti-theft demo application. By necessity, this anti-theft demo is\
    \ somewhat platform-specific, as it uses specific light and movement sensors to\
    \ detect theft. However, as we discuss below, the fact that TinyOS is built over\
    \ reusable interfaces makes the application trivial to port from the micaz with\
    \ mts310 sensor board for which it was written to any platform with equivalent\
    \ communication and sensing capabilities.\n\nAppendix 1 provides a more systematic\
    \ overview of the major TinyOS services. Each service has a brief description,\
    \ a list of the components that provide it, and pointers to relevant TinyOS Enhancement\
    \ Proposals (TEPs) that provide a more detailed specification.\n\nThe complete\
    \ code for the applications in this chapter can be found in TinyOS’s contributed\
    \ code directory (see Section 1.5).\n\n# 6.1 The basics: timing, LEDs, and booting\n\
    \nOne of the simplest anti-theft devices on sale is a simple blinking red light,\
    \ designed to deter thieves by making them believe that more must be going on.\n\
    \nSuch a simple application is, unsurprisingly, trivial to build using TinyOS.\
    \ We start with the application’s main module, AntiTheftC:\n\n```\nmodule AntiTheftC\
    \ {\n  uses {\n    interface Boot;\n    interface Timer<TMilli> as WarningTimer;\n\
    \    interface Leds;\n  }\n}\n\nimplementation {\n  enum { WARN_INTERVAL = 4096,\
    \ WARN_DURATION = 64 };\n```"
