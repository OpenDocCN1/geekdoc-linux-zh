- pgno: 88
  md: "SplitControl.startDone are called. The implementation has no way of determining\
    \ which called the start command.²\n\nIn summary, interfaces are not a one-to-one\
    \ relationship. Instead, they are an n-to-k relationship, where n is the number\
    \ of users and k is the number of providers. Any provider signaling will invoke\
    \ the event handler on all n users, and any user calling a command will invoke\
    \ the command on all k providers.\n\n# 4.4.2 Uses of multiple wiring\n\nIn practice,\
    \ multiple wirings allow an implementation to be independent of the number of\
    \ components it depends on. Remember that MainC (Listing 3.8, page 26) abstracts\
    \ the boot sequence as two interfaces, SoftwareInit and Boot. MainC calls SoftwareInit.init\
    \ when booting so that software components can be initialized before execution\
    \ begins. MainC then signals Boot.booted once the entire boot sequence is over.\
    \ Many components need initialization. For example, in the very simple application\
    \ RadioCountToLeds, there are ten components wired to MainC.SoftwareInit. Rather\
    \ than use many Init interfaces and call them in some order, MainC just calls\
    \ SoftwareInit once and this call fans-out to all of the components that have\
    \ wired to it.\n\nAnecdote: Historically, multiple wirings come from the idea\
    \ that TinyOS components can be thought of as hardware chips. In this model, an\
    \ interface is a set of pins on the chip. The term wiring comes from this idea:\
    \ connecting the pins on one chip to those of another. In hardware, though, you\
    \ can easily connect N pins together. For example, a given general-purpose IO\
    \ pin on a chip might have multiple possible triggers, or a bus have multiple\
    \ end devices that are controlled with chip select pins. It turns out that taking\
    \ this metaphor literally has several issues. When TinyOS moved to nesC, these\
    \ problems were done away with. Specifically, consider this configuration:\n\n\
    ```\nconfiguration A {\n  uses interface StdControl;\n}\n\nconfiguration B {\n\
    \  provides interface StdControl;\n  uses interface StdControl as SubControl;\
    \ // Called in StdControl\n}\n\nconfiguration C {\n  provides interface StdControl;\n\
    }\n\nA.StdControl -> B.StdControl;\n```"
