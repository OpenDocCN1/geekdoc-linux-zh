  md: "On one hand, if all of the nodes in the network run the same executable, it’s\
    \ possible that none of them will ever send a packet of, say, AM type 144. However,\
    \ if there are other nodes nearby, or if packets are corrupted but still pass\
    \ a CRC check (this is rare, but does happen), then it’s very possible that a\
    \ node which doesn’t care about protocol 144 will receive a packet of this type.\
    \ Therefore nesC expects the receive event to have a handler: it needs to execute\
    \ a function when this happens. But the application doesn’t wire to Receive[144],\
    \ and making a developer wire to all of the unwired instances is unreasonable,\
    \ especially as they’re all null functions (in the case of Receive.receive, the\
    \ handler just returns the packet passed to it).\n\nTo avoid this problem, nesC\
    \ provides default handlers. A default handler is an implementation of a function\
    \ that’s used if no implementation is wired in. If a component wires to the interface,\
    \ then that implementation is used. Otherwise, the call (or signal) goes to the\
    \ default handler. For example, CC2420ActiveMessageP has the following default\
    \ handlers:\n\n```\ndefault event message_t* Receive.receive[am_id_t id](message_t*\
    \ msg, void* p, uint8_t len) {\n  return msg;\n}\n\ndefault event message_t* Snoop.receive[am_id_t\
    \ id](message_t* msg, void* p, uint8_t len) {\n  return msg;\n}\n\ndefault event\
    \ void AMSend.sendDone[uint8_t id](message_t* msg, error_t err) {\n  return;\n\
    }\n```\n\nListing 8.20 Default events in an active message implementation\n\n\
    In the TestAM application, TestAMAppC wires TestAMC to ActiveMessageC. Receive[240].\
    \ Therefore, on the Telos or micaz platform, when the radio receives a packet\
    \ of AM type 240, it signals TestAMC’s Receive.receive. Since the application\
    \ doesn’t use any other protocols, when it receives an active message of any other\
    \ type it signals CC2420ActiveMessageP’s default handler.\n\nDefault handlers\
    \ can be dangerous, as they circumvent compile-time checks that component interfaces\
    \ are connected. Using them carelessly can cause code to work improperly. For\
    \ example, while CC2420ActiveMessageP has a default handler for Send.sendDone,\
    \ TestAMC does not have a default handler for Send.send. Otherwise, you could\
    \ forget to wire TestAMC.Send and the program would compile fine but never send\
    \ packets. Defaults should only be used when an interface is not necessary for\
    \ the proper execution of a component. This almost always involves parameterized\
    \ interfaces, as it’s rare that all of the parameter values are used.\n\n# 8.4\
    \ Attributes\n\nAttributes are a way to associate metadata with program statements.\
    \ nesC attributes are based on the approach taken with Java annotations [Chapter\
    \ 9]. The full details are"
