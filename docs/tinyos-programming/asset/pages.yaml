    # 6.3 Single-hop networking


    TinyOS uses a typical layered network structure, as shown in Figure 6.1. The networking
    stack is composed of a set of layers, each of which defines a header and footer
    layout, and includes a variable-size payload space for the layer above; the highest
    layer (usually the application) just holds the application data. Each layer’s
    header typically includes a “type” field that specifies the meaning of that layer’s
    payload and hence the payload’s layout – this makes it easy to use multiple independent
    packets in a single application. For instance, in Figure 6.1 there are two kinds
    of packets: packets containing messages for application 1, built over layer2a,
    itself built over layer1 and packets containing messages for application 3, built
    over layer2b, itself built over layer1.


    The lowest networking layer exposed in TinyOS is called active messages (AM) [29].
    AM is typically implemented directly over a mote’s radio, and provides unreliable,
    single-hop packet transmission and reception. Each packet is identified by an
    AM type, an 8-bit integer that identifies the packet type. The name “active messages”
    comes from the fact that the type is used to automatically dispatch received packets
    to an appropriate handler: in a sense, packets (messages) are active because they
    identify (via their type) code to be executed.


    A variable of type message_t holds a single AM packet. Each packet can hold a
    user-specified payload of up to TOSH_DATA_LENGTH bytes – normally 28 bytes,


    ![](img/53ede4f4266a5731b93bff15d85fa06a_112_0.png)


    Figure 6.1 TinyOS packet layout.'
