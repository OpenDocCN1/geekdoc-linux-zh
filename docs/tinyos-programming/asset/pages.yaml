- pgno: 91
  md: "# Programming Hint 14 NEVER IGNORE COMBINE WARNINGS.\n\n# 4.5 Generics versus\
    \ singletons\n\nConfigurations can be generics, just as modules can. For example,\
    \ the standard TinyOS abstraction for sending packets is the component AMSenderC,\
    \ a generic that takes a single parameter, the AM (active message) type of packet\
    \ to be sent:\n\n```\ngeneric configuration AMSenderC(am_id_t AMId) {\n  provides\
    \ {\n    interface AMSend;\n    interface Packet;\n    interface AMPacket;\n \
    \   interface PacketAcknowledgements as Acks;\n  }\n}\n```\n\nListing 4.23 AMSenderC\
    \ signature\n\nAM types allow TinyOS applications to send multiple types of packets:\
    \ they are somewhat like ports in UDP/TCP sockets. AM types are 8 bits. There\
    \ is also a generic receiving component, AMReceiverC, which takes an AM type as\
    \ a parameter. AM types allow multiple components and subsystems to receive and\
    \ send packets without having to figure out whose packets are whose, unless two\
    \ try to use the same AM type.\n\nThis raises the question: why aren’t all components\
    \ generics? There are some low-level components that inherently can’t be generics,\
    \ such as those that provide direct access to hardware. Because these components\
    \ actually represent physical resources (registers, buses, pins, etc.), there\
    \ can only be one. There are very few of these low-level components though. More\
    \ commonly, singletons are used to provide a global name which many components\
    \ can use. To provide better insight on why this is important, let’s step through\
    \ what generics are and how they work.\n\n# 4.5.1 Generic components, revisited\n\
    \nGeneric components allow many systems to use independent copies of a single\
    \ implementation. For example, a large application might include multiple network\
    \ services, each of which uses one or more instances of AMSenderC to send packets.\
    \ Because all share a common implementation, bugs can be fixed and optimizations\
    \ can be applied in a single place, and over time they will all benefit from improvements."
