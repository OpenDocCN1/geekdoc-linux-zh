- pgno: 223
  md: "code. Tasks are the only way a component can transition from async to sync.\
    \ Written as an interface, a task looks like this:\n\n```\ninterface TaskBasic\
    \ {\n  async command error_t post();\n  event void run();\n}\n```\n\nAll split-phase\
    \ interfaces with an asynchronous command and a synchronous completion event must\
    \ go through a task.\n\nNote that the opposite direction – a sync command and\
    \ async event – is rare. Such an interface would be for a service that can only\
    \ be invoked from a task, but which requires the user to handle an interrupt.\
    \ Because the event is async, any state shared between the command and event must\
    \ be protected with atomic statements. Therefore, making the command async as\
    \ well can enable a program to call it directly from the event, while typically\
    \ not requiring any greater degree of code complexity.\n\n# 11.2 Power locks\n\
    \nAtomic statements allow a component to execute a code block without interruption.\
    \ However, low-level drivers often need to perform a series of split-phase operations\
    \ on a single hardware resource without interference from any other part of the\
    \ system. These drivers cannot use atomic statements – the completion of even\
    \ the first operation occurs in a different function (the event handler) which\
    \ clearly cannot be in the same atomic statement. Furthermore, disabling interrupts\
    \ (as atomic statements normally do) for the length of time it takes to perform\
    \ even one split-phase operation would probably be a bad idea.\n\nIn these situations,\
    \ the atomicity is not on the processor – it’s OK if other code executes – but\
    \ rather on the hardware resource itself. To enable writing such drivers, TinyOS\
    \ has power locks, which can be used to get exclusive access to a particular,\
    \ typically hardware, resource. In addition to managing concurrency, power locks\
    \ also manage energy and help configure hardware. While applications almost never\
    \ see them, power locks constitute a key part of the internals of TinyOS and are\
    \ important for most low-level systems work.\n\n# 11.2.1 Example lock need: link-layer\
    \ acknowledgements\n\nLink-layer packet communication is one such example. TinyOS\
    \ link-layer stacks support acknowledgements through the PacketAcknowledgements\
    \ interface. When a node receives a packet destined to it, it immediately transmits\
    \ a tiny packet in response, acknowledging reception. On the transmit side, the\
    \ stack waits a short period for this link-layer acknowledgement, and reports\
    \ whether it heard the acknowledgement. Minimizing the time the transmitter has\
    \ to wait is critical for performance, so a receiver wants to send the acknowledgement\
    \ as soon as possible."
