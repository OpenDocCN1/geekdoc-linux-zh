    \ for Time Synchronization. The line represents the best estimate of the relation\
    \ between local and global time.\n\nbest relation between local time and the \"\
    global time\" created by the coordinator's synchronization messages (Figure 13.2).\n\
    \nThe resulting time synchronization is sufficiently precise for micaz motes placed\
    \ within a foot of each other to distinguish the arrival time of a loud sound.\
    \ The motes can use either the micaz's external crystal oscillator or its internal\
    \ RC oscillator (though in the case of the internal oscillator it is necessary\
    \ to wait a few minutes after switching a mote on for the oscillator to stabilize).\n\
    \nMore elaborate time synchronization algorithms [1, 22] can achieve significantly\
    \ greater precision, avoid the need for a dedicated coordinator mote and handle\
    \ multihop networks. However, these algorithms are more complex to implement.\n\
    \n# 13.1.2 Implementing SoundLocalizer in TinyOS\n\nSoundLocalizer has separate\
    \ programs for the detector and coordinator motes. The coordinator code is very\
    \ simple: when the coordinator mote boots it starts a periodic timer:\n\n```\n\
    call Timer.startPeriodic(BEACON_INTERVAL);\n```\n\nAt each timer event, the coordinator\
    \ mote sends a synchronization message with the next sequence number and a global\
    \ time at which event detection is to occur (error checking is elided below):\n\
    \n```\ntypedef nx_struct coordination_msg {\n  nx_uint16_t count, sample_at, interval;\n\
    } coordination_msg_t;\n```\n\n```\nevent void Timer.fired() {\n  coordination_msg_t\
    \ *payload=call AMSend.getPayload(&msg, sizeof *payload);\n```"
