- pgno: 224
  md: "Thinking through this problem from a programming standpoint, the receiver part\
    \ of the radio stack needs to go through these steps:\n\n+   - Read the packet\
    \ out of the radio\n+   - Inspect the packet to see if it should send an acknowledgement\n\
    +   - Switch the radio to transmit mode\n+   - Send the acknowledgement\n+   -\
    \ Return the radio to receive mode\n\nEach of these steps is typically a separate\
    \ split-phase operation. On the CC2420 radio, for example, each operation requires\
    \ sending a command that reads or writes data over an SPI bus. This SPI bus, however,\
    \ is shared across many chips and subsystems: a flash storage driver might want\
    \ to use the SPI bus to read data at the same time a node is receiving a packet.\
    \ We can’t rely on the SPI bus component to schedule multiple outstanding requests,\
    \ as it might try interleaving a large flash write operation between two of the\
    \ radio stack’s. We need a way for the radio stack to request exclusive access\
    \ to the bus so it can quickly perform its five operations, then release the bus\
    \ for others to use.\n\nThere are numerous other cases where low-level systems\
    \ need exclusive access to a hardware or software resource, either for correctness\
    \ or latency; we’ll cover a few examples later.\n\n# 11.2.2  Split-phase locks\n\
    \nTinyOS supports exclusive access to resources through split-phase locks. Traditionally,\
    \ locks such as mutexes and semaphores are blocking constructs that protect critical\
    \ sections or shared data structures. However, as TinyOS does not have blocking\
    \ calls, its locks must be split-phase. A component calls a command to request\
    \ a power lock and receives an event when it acquires the lock. For historical\
    \ reasons, the lock interface is named Resource:\n\n```\ninterface Resource {\n\
    \  async command error_t request();\n  async command error_t immediateRequest();\n\
    \  event void granted();\n  async command void release();\n  async command uint8_t\
    \ getId();\n}\n```\n\nListing 11.13  The Resource interface\n\nTo acquire a lock,\
    \ a component typically calls request. At some point later, it receives a granted\
    \ event, signaling that it can use whatever the lock protects. The command immediateRequest\
    \ is an optimization: it allows a component to acquire an idle lock in a single-phase\
    \ operation. If immediateRequest returns FAIL then the lock is already"
  merge: -1
  img_proc: true
- pgno: 225
  md: "held and the component must call request. Components release a lock with the\
    \ release command.\n\nAbstractions that require locking typically provide the\
    \ Resource interface. Calling functional interfaces without holding the lock is\
    \ typically forbidden, and may cause bugs or undesirable system behavior. For\
    \ example, this is the abstraction nodes with an MSP430 microcontroller provide\
    \ for an SPI bus:\n\n```\ngeneric configuration Msp430Spi0C() {\n  provides interface\
    \ Resource;\n  provides interface SpiByte;\n  provides interface SpiPacket;\n\
    \  uses interface Msp430Spi0CConfiguration;\n}\n```\n\nListing 11.14  Msp430Spi0C\
    \ signature\n\nSimilarly, this is the abstraction for the ADC:\n\n```\ngeneric\
    \ configuration Msp430Adc12ClientC() {\n  provides {\n    interface Resource;\n\
    \    interface Msp430Adc12SingleChannel;\n    interface Msp430Adc12MultiChannel;\n\
    \    interface Msp430Adc12Overflow;\n  }\n}\n```\n\nListing 11.15  Msp320Adc12ClientC\
    \ signature\n\n# 11.2.3   Lock internals\n\nTinyOS power locks manage concurrency,\
    \ energy, and configuration of shared hardware resources. Power locks have three\
    \ sub-components:\n\n+   - an *arbiter*, which controls the locking policy;\n\
    +   - a *power manager*, which controls the energy policy;\n+   - and one or more\
    \ *configurators*, which configure hardware for a client.\n\nFigure 11.1 shows\
    \ how these three parts fit together. The arbiter is the central point of control.\
    \ An arbiter receives lock requests from clients, and calls the power manager\
    \ and configurators based on those requests. Locks use parameterized interfaces\
    \ and unique() to maintain a queue of pending lock requests. Each lock client\
    \ has a unique lock ID, and the lock implementation uses uniqueCount() to maintain\
    \ a queue of the proper length."
