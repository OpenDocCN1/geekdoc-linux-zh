    }\n```\n\nListing 6.3  The Boot interface\n\nAs we saw earlier, the booted event\
    \ of the Boot interface (provided by MainC) is signaled as soon as a node has\
    \ finished booting. All we need to do is execute the logic in WarningTimer.fired\
    \ to initiate the first LED transition. We could do this by replicating some of\
    \ the code from WarningTimer.fired in the booted event, but this would be wasteful\
    \ and, in more complex cases, error-prone. Instead, the simplest approach would\
    \ be to pretend that the WarningTimer.fired event happened at boot-time. This\
    \ kind of requirement is not uncommon, so nesC allows modules to signal their\
    \ own events (and call their own commands), as we see in Boot.booted.\n\n# 6.1.1\
    \  Deadline-based timing\n\nAs seen so far, AntiTheftC uses a simple “wake me\
    \ up in n ms” one-shot timing interface to get periodic events – it cannot use\
    \ the simpler startPeriodic command as it is interspersing two timing periods\
    \ (64 ms and 3936 ms). However, such relative-time interfaces (the expiry time\
    \ is specified as an offset from “now”) have a well-known drawback: if one timer\
    \ event is delayed by some other activity in the system, then all subsequent activities\
    \ are delayed. If these delays occur frequently, then the system “drifts”: instead\
    \ of blinking the LED every 4 s, it might blink it (on average) every 4.002 s.\n\
    \nThis is clearly not a problem for our simple theft-deterrence system, but can\
    \ be an issue in other contexts. So we show below how the TinyOS timing system\
    \ allows you to avoid such problems. First, let’s see the full Timer interface:\n\
    \n```\ninterface Timer<precision_tag> {\n    // basic interface\n    command void\
    \ startPeriodic(uint32_t dt);\n    command void startOneShot(uint32_t dt);\n```\n\
    \n¹ The LEDs are numbered as LED colors are different on different platforms,\
    \ e.g. the micaz has red, green, and yellow LEDs while the Telos has red, green,\
    \ and blue LEDs."
