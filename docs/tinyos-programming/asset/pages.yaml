  md: "```\n/* Handler for ack messages. If we see an ack for the current transmission,\n\
    \ * notify the 'send' method. */\nvoid ackMsgReceived(AckMsg m) {\n    synchronized\
    \ (ackLock) {\n        if (m.get_cookie() == sendCookie) {\n            acked\
    \ = true;\n            ackLock.notify();\n        }\n    }\n}\n\n... receive side\
    \ ...\n}\n```\n\n# Listing 7.10 Reliable transmission protocol in Java - transmission\n\
    \nThe send method is synchronized to enforce the rule that a message must be acknowledged\
    \ before the next message is sent.\n\nThis code relies on the fact that the ackMsgReceived\
    \ handler executes in a different thread than send. After sending a message, the\
    \ send thread goes to sleep for ACK_MSG_TIMEOUT ms. When an acknowledgement is\
    \ received, ackMsgReceived checks the cookie against that of the message being\
    \ transmitted. If it is equal, acked is set to true and the send thread is woken\
    \ up. If no acknowledgement is received within ACK_MSG_TIMEOUT ms, send will resend\
    \ the message and wait again. Note that acknowledgements received when send is\
    \ not waiting are effectively ignored, as they should be.\n\nAfter transmission\
    \ is successful, send picks a new cookie – we multiply the old value by three\
    \ just to make it clear that these cookies are not sequence numbers.\n\nThe embedding\
    \ of the user’s message in a reliable_msg_t packet is simply done by using System.arraycopy\
    \ to copy data between the backing arrays of the user’s and reliable_msg_t’s mig-generated\
