- pgno: 29
  md: 'for the small, low-power microcontrollers motes have. Furthermore, TinyOS has
    very aggressive systems and mechanisms for saving power.


    TinyOS makes building sensor network applications easier. It provides a set of
    important services and abstractions, such as sensing, communication, storage,
    and timers. It defines a concurrent execution model, so developers can build applications
    out of reusable services and components without having to worry about unforeseen
    interactions. TinyOS runs on over a dozen generic platforms, most of which easily
    support adding new sensors. Furthermore, TinyOS’s structure makes it reasonably
    easy to port to new platforms.


    TinyOS applications and systems, as well as the OS itself, are written in the
    nesC language. nesC is a C dialect with features to reduce RAM and code size,
    enable significant optimizations, and help prevent low-level bugs like race conditions.
    Chapter 2 goes into the details on how nesC differs significantly from other C-like
    languages, and most of this book is about how to best use those features to write
    robust, efficient code.


    # 1.2.1 What TinyOS provides


    At a high level, TinyOS provides three things to make writing systems and applications
    easier:


    +   - a component model, which defines how you write small, reusable pieces of
    code and compose them into larger abstractions;

    +   - a concurrent execution model, which defines how components interleave their
    computations as well as how interrupt and non-interrupt code interact;

    +   - application programming interfaces (APIs), services, component libraries
    and an overall component structure that simplify writing new applications and
    services.


    The component model is grounded in nesC. It allows you to write pieces of reusable
    code which explicitly declare their dependencies. For example, a generic user
    button component that tells you when a button is pressed sits on top of an interrupt
    handler. The component model allows the button implementation to be independent
    of which interrupt that is – e.g. so it can be used on many different hardware
    platforms – without requiring complex callbacks or magic function naming conventions.
    Chapter 2 and Chapter 3 describe the basic component model.'
