  md: "![](img/53ede4f4266a5731b93bff15d85fa06a_36_0.png)\n\nprovide such a function\
    \ then (typically) the first one named on the linker command line \"wins.\" Using\
    \ a nesC configuration, the programmer instead explicitly selects which component’s\
    \ implementation of the function to use.\n\nThe nesC compiler can take advantage\
    \ of this explicit wiring to build highly optimized binaries. Current implementations\
    \ of the nesC compiler (nesc1) take nesC files describing components as input\
    \ and output a C file. The C file is passed to a native C compiler that can compile\
    \ to the desired microcontroller or processor. Figure 2.2 shows this process.\
    \ The nesC compiler carefully constructs the generated C file to maximize the\
    \ optimization abilities of the C compiler. For example, since it is given a single\
    \ file, the C compiler can freely optimize across call boundaries, inlining code\
    \ whenever needed. The nesC compiler also prunes dead code which is never called\
    \ and variables which are never accessed: since there is no dynamic linking in\
    \ nesC, it has a complete picture of the application call graph. This speeds the\
    \ C compilation and reduces program size in terms of both RAM and code.\n\n# 2.2\
    \ Essential differences: components, interfaces, and wiring\n\nThe three essential\
    \ differences between C and nesC – components, interfaces, and wiring – all relate\
    \ to naming and organizing a program’s elements (variables, functions, types,\
    \ etc). In C, programs are broken into separate files which are connected via\
    \ a global namespace: a symbol X declared in one file is connected by the linker\
    \ to a symbol X defined in another file. For instance, if file1.c contains:\n\n\
    ```\nextern void g(void); /* declaration of g */\n\nint main() /* definition of\
    \ main */\n{\n    g(); g();\n}\n```\n\nand file2.c contains:\n\n```\nvoid g(void)\n\
    {\n    printf(\"hello world!\");\n}\n```"
