    \nThe second part of Powerup, the PowerupAppC configuration, specifies how PowerupC\
    \ is connected to TinyOS's services:\n\n```\nconfiguration PowerupAppC { \nimplementation\
    \ {\ncomponents MainC, LedsC, PowerupC;\n\nMainC.Boot -> PowerupC.Boot;\nPowerupC.Leds\
    \ -> LedsC.Leds;\n}\n```\n\n# Listing 2.4 PowerupAppC configuration in nesC\n\n\
    This says that the PowerupAppC application is built out of three components (modules\
    \ or configurations), MainC (system boot), LedsC (LED control), and PowerupC (our\
    \ powerup module). PowerupAppC explicitly specifies the connections (or wiring)\
    \ between the interfaces provided and used by these components. When MainC has\
    \ finished booting the system it signals the booted event of its Boot interface,\
    \ which is connected by the wiring in PowerupAppC to the booted event in PowerupC.\
    \ This event then calls the led0On command of its Leds interface, which is again\
    \ connected (wired) by PowerupAppC to the Leds interface provided by LedsC. Thus\
