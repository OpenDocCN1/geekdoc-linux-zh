    \ calls LedsP’s Leds.led0Toggle command implementation. The same is true for other\
    \ calls of the Leds interface, such as Leds.led1On. The PowerupToggleAppC and\
    \ LedsC configurations provide a mapping between the local namespaces of the PowerupToggleC\
    \ and LedsP modules. The C code generated (as an intermediate step) by the nesC\
    \ compiler looks something like this:\n\n```\nvoid LedsP_Leds_led0Toggle() { ...\
    \ }\n\nvoid PowerupToggleC_Leds_led0Toggle() {\n  LedsP_Leds_led0Toggle();\n}\n\
    \n...\n\nvoid PowerupToggleC_Boot_booted() {\n  while(1) {\n    call PowerupToggleC_Leds_led0Toggle();\n\
    ```"
