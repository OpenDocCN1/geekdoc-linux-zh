- pgno: 48
  md: "![](img/53ede4f4266a5731b93bff15d85fa06a_48_0.png)\n\nFigure 3.2 Interfaces\
    \ have commands and events. Users call commands, and providers signal events.\n\
    \nthe interface Boot. Just as with components, interfaces are in a global namespace.\
    \ Syntactically, however, interfaces are quite different from components. They\
    \ have a single block, the interface declaration:\n\n```\ninterface Boot {\n \
    \   // functions\n}\n\ninterface Leds {\n    // functions\n}\n```\n\nListing 3.6\
    \ Interface declarations for Leds and Boot\n\nAn interface declaration has one\
    \ or more functions in it. Interfaces have two kinds of functions: commands and\
    \ events. Init and Boot are two simple interfaces, each of which has a single\
    \ function. Init has a single command, while Boot has a single event:\n\n```\n\
    interface Init {\n    command error_t init();\n}\n\ninterface Boot {\n    event\
    \ void booted();\n}\n```\n\nListing 3.7 The Init and Boot interfaces\n\nTinyOS\
    \ detail: The error_t type returned by init is TinyOS 's normal way of reporting\
    \ success or failure. A value of SUCCESS represents success and FAIL represents\
    \ general failure. Specific Exxx constants, inspired in part by Unix's errno,\
    \ represent specific failures, e.g. EINVAL means \"invalid value\".\n\nWhether\
    \ a function is a command or event determines which side of an interface – a user\
    \ or a provider – implements the function and which side can call it. Users can\
    \ call commands and providers can signal events. Conversely, users must implement\
    \ events and providers must implement commands. Figure 3.3 shows this relationship\
    \ in the visual language we use to describe nesC programs. For example, returning\
    \ to MainC"
  merge: -1
  img_proc: true
- pgno: 49
  md: "# Components and interfaces\n\n![](img/53ede4f4266a5731b93bff15d85fa06a_49_0.png)\n\
    \n**Figure 3.3** The Init and Boot interfaces.\n\nand PowerupC, PowerupC is a\
    \ user of Boot, while MainC is a provider of Boot:\n\n```\nconfiguration MainC\
    \ {\n  provides interface Boot;\n  uses interface Init as SoftwareInit;\n}\n\n\
    module PowerupC {\n  uses interface Boot;\n  uses interface Leds;\n}\n```\n\n\
    Listing 3.8 Signatures of MainC and PowerupC\n\nBoot has a single event, Boot.booted.\
    \ MainC provides Boot, so it signals the event when a node has booted successfully.\
    \ This signaling is a function call: the boot sequence calls Boot.booted on all\
    \ of the components that want to know when the system has come up. If a component\
    \ -- such as PowerupC -- wants to know when the node has booted, it uses the Boot\
    \ interface.\n\nCommands have the opposite implementation direction as events.\
    \ Users call commands and providers implement them. MainC uses Init so it can\
    \ initialize software components before booting: it calls SoftwareInit.init on\
    \ the components that need initialization. Similarly, as PowerupC uses Leds, it\
    \ can call commands such as Leds.led0On. Conversely, a provider of Leds, such\
    \ as LedsP, must implement the Leds commands.\n\nFigure 3.3 shows the Boot and\
    \ Init interfaces graphically. Init has a single command, init. A user of the\
    \ Init interface can call Init.init, while a provider of the Init interface must\
    \ implement Init.init. Conversely, a user of the Boot interface must implement\
    \ the booted event, while a provider of the interface can signal Boot.booted.\n\
    \nAt this point, the distinction between commands and events might seem pointless.\
    \ After all, providing an interface with a command is the same as using an interface\
    \ with an event. In the case of interfaces which only have commands or events\
    \ but not both, this is true, and distinction is more for presentation and legibility.\
    \ Providing an interface means providing a service, whether that be controlling\
    \ the LEDs on a node or notifying components when the system has booted. Using\
    \ an interface means using that service. However, as we'll soon see, many interesting\
    \ interfaces have both commands and events, representing a relationship between\
    \ two components where both can call the other."
  merge: -1
  img_proc: true
