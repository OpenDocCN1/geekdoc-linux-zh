  md: "All of the generics have the type TMilli as one of their arguments. These type\
    \ arguments make sure that timer fidelities are not accidentally changed. For\
    \ instance, VirtualizeTimerC\n\n```\ngeneric module VirtualizeTimerC(typedef precision_tag,\
    \ int max_timers)\n{\n  provides interface Timer<precision_tag> as Timer[uint8_t\
    \ num];\n  uses interface Timer<precision_tag> as TimerFrom;\n}\n...\n```\n\n\
    Listing 9.19 VirtualizeTimerC virtualizes a single timer\n\ntakes a single timer\
    \ of fidelity precision_tag and virtualizes it into timer_count timers of precision_tag.\
    \ The timer library also has components that translate between precisions.\n\n\
    HiiTimerMilliC takes an interrupt-driven hardware timer – AlarmCounterMilliP –\
    \ and turns it into a virtualized timer. It does this with three steps. The first\
    \ step turns the interrupt-driven Alarm into a task-based Timer, with the generic\
    \ component AlarmToTimerC:\n\n```\nAlarmToTimerC.Alarm -> AlarmCounterMilliP;\n\
    ```\n\nThe second step virtualizes a single timer into many timers:\n\n```\nVirtualizeTimerC.TimerFrom\
    \ -> AlarmToTimerC;\n```\n\nHiiTimerMilliC then exports the parameterized timer\
    \ interface:\n\n```\nTimerMilli = VirtualizeTimerC;\n```\n\nAdditionally, some\
    \ aspects of the timer system require being able to access a time base, for example,\
    \ to specify when in the future a timer fires. So HiiTimerMilliC takes a hardware\
    \ counter and turns it into a local time component,\n\n```\nCounterToLocalTimeC.Counter\
    \ -> AlarmCounterMilliP;\n```\n\nthen exports the interface:\n\n```\nLocalTime\
    \ = CounterToLocalTimeC;\n```\n\nMany of the components in the timer library are\
    \ generics because a platform might need to provide a wide range of timers. For\
    \ example, depending on the number of counters, compare registers, and their width,\
    \ a platform might provide millisecond, microsecond, and 32 kHz timers. The variants\
    \ of the MSP430 chip family that some platforms use, for example, can easily provide\
    \ 32-bit millisecond and 32 kHz timers with a very low interrupt load.\n\nGeneric\
    \ modules work very well for abstractions that have to allocate per-client state,\
    \ such as timers. A generic module allows you to specify the size – the number\
    \ of clients – in the configuration that instantiates the module, rather than\
    \ within the module itself. For example, if VirtualizeTimerC were not a generic,\
    \ then inside its code there would have to be a uniqueCount() with the proper\
    \ key."
