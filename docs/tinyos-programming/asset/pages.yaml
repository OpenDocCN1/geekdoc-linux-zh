- pgno: 33
  md: "# 2 Names and program structure\n\nProgram structure is the most essential\
    \ and obvious difference between C and nesC. C programs are composed of variables,\
    \ types, and functions defined in files that are compiled separately and then\
    \ linked together. nesC programs are built out of components that are connected\
    \ (“wired”) by explicit program statements; the nesC compiler connects and compiles\
    \ these components as a single unit. To illustrate and explain these differences\
    \ in how programs are built, we compare and contrast C and nesC implementations\
    \ of two very simple “hello world”-like mote applications, Powerup (boot and turn\
    \ on a LED) and Blink (boot and repeatedly blink a LED).\n\n# 2.1 Hello World!\n\
    \nThe closest mote equivalent to the classic “Hello World!” program is the “Powerup”\
    \ application that simply turns on one of the motes LEDs at boot, then goes to\
    \ sleep.\n\nA C implementation of Powerup is fairly simple:\n\n```\n#include 'mote.h'\n\
    \nint main()\n{\n    mote_init();\n    led0_on();\n    sleep();\n}\n```\n\nListing\
    \ 2.1 Powerup in C\n\nThe Powerup application is compiled and linked with a “mote”\
    \ library which provides functions to perform hardware initialization (mote_init),\
    \ LED control (led0_on) and put the mote in to a low-power sleep mode (sleep).\
    \ The “mote.h” header file simply provides declarations of these and other basic\
    \ functions. The usual C main function is called automatically when the mote boots.\n\
    \n> 1 The C compiler, library, and linker typically arrange for this by setting\
    \ the mote’s hardware reset vector to point to a piece of assembly code that sets\
    \ up a C environment, then calls main."
  merge: -1
  img_proc: true
- pgno: 34
  md: "The nesC implementation of Powerup is split into two parts. The first, the\
    \ PowerupC module, contains the executable logic of Powerup (what there is of\
    \ it ...):\n\n```\nmodule PowerupC {\n  uses interface Boot;\n  uses interface\
    \ Leds;\n}\nimplementation {\n  event void Boot.booted() {\n    call Leds.led0On();\n\
    \  }\n}\n```\n\nListing 2.2 PowerupC module in nesC\n\nThis code says that PowerupC\
    \ interacts with the rest of the system via two interfaces, Boot and Leds, and\
    \ provides an implementation for the booted event of the Boot interface that calls\
    \ the led0On command of the Leds interface. Comparing with the C code, we can\
    \ see that the booted event implementation takes the place of the main function,\
    \ and the call to the led0On command the place of the call to the led0_on library\
    \ function.\n\nThis code shows two of the major differences between nesC and C:\
    \ where C programs are composed of functions, nesC programs are built out of components\
    \ that implement a particular service (in the case of PowerupC, turning a LED\
    \ on at boot-time). Furthermore, C functions typically interact by calling each\
    \ other directly, while the interactions between components are specified by interfaces:\
    \ the interface's user makes requests (calls commands) on the interface's provider,\
    \ the provider makes callbacks (signals events) to the interface's user. Commands\
    \ and events themselves are like regular functions (they can contain arbitrary\
    \ C code); calling a command or signaling an event is just a function call. PowerupC\
    \ is a user of both Boot and Leds; the booted event is a callback signaled when\
    \ the system boots, while the led0On is a command requesting that LED 0 be turned\
    \ on.\n\nnesC interfaces are similar to Java interfaces, with the addition of\
    \ a command or event keyword to distinguish requests from callbacks:\n\n```\n\
    interface Boot {\n  event void booted();\n}\n\ninterface Leds {\n  command void\
    \ led0On();\n  command void led0Off();\n}\n```\n\n2 LEDs are numbered in TinyOS,\
    \ as different platforms have different color LEDs."
  merge: -1
  img_proc: true
