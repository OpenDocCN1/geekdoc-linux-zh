- pgno: 62
  md: "# Listing 3.27 The Send interface\n\n```\ncommand error_t cancel(message_t*\
    \ msg);\ncommand void* getPayload(message_t* msg);\ncommand uint8_t maxPayloadLength(message_t*\
    \ msg);\n```\n\nThe important pair of functions in this example is send/sendDone.\
    \ To send a packet, a component calls send. If send returns SUCCESS, then the\
    \ caller has passed the packet to a communication stack to use, and must not modify\
    \ the packet. The callee stores the pointer in a variable, enacts a state change,\
    \ and returns immediately. If the interface user modifies the packet after passing\
    \ it to the interface provider, the packet could be corrupted. For example, the\
    \ radio stack might compute a checksum over the entire packet, then start sending\
    \ it out. If the caller modifies the packet after the checksum has been calculated,\
    \ then the data and checksum won’t match up and a receiver will reject the packet.\n\
    \nTo avoid these kinds of problems, TinyOS follows an ownership discipline: at\
    \ any point in time, every “memory object” – a piece of memory, typically a whole\
    \ variable or a single array element – should be owned by a single module. A command\
    \ like send is said to pass ownership of its msg argument from caller to callee.\
    \ When a split-phase interface has this kind of “pass” semantics, the completion\
    \ event should have the passed pointer as one of its parameters, to show that\
    \ the object is being returned to its original owner.\n\n> Programming Hint 4\
    \ WHEN POSSIBLE, AVOID PASSING POINTERS ACROSS INTERFACES; WHEN THIS CANNOT BE\
    \ AVOIDED ONLY ONE COMPONENT SHOULD BE ABLE TO MODIFY A POINTER’S DATA AT ANY\
    \ TIME.\n\nOne of the trickiest examples of this pass approach is the Receive\
    \ interface. At first glance, the interface seems very simple:\n\n```\ninterface\
    \ Receive {\n  event message_t* receive(message_t* msg, void* payload, uint8_t\
    \ len);\n}\n```\n\n# Listing 3.28 The Receive interface\n\nThe receive event is\
    \ rather different than most events: it has a message_t* as both a parameter and\
    \ a return value. When the communication layer receives a packet, it passes that\
    \ packet to the higher layer as a parameter. However, it also expects the higher\
    \ layer to return it a message_t* back. The basic idea behind this is simple:\
    \ if the communication layer doesn’t have a message_t*, it can’t receive packets,\
    \ as it has nowhere to put them. Therefore, the higher layer always has to return\
    \ a message_t*, which is the next buffer the radio stack will use to receive into.\
    \ This return value can be the same as the parameter, but it does not have to\
    \ be. For example, this is perfectly reasonable, if a bit"
