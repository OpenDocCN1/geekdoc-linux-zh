    \ as AtSettings;\n    MovingC.Mount -> AtSettings;\n    MovingC.ConfigStorage\
    \ -> AtSettings;\n  }\n}\n```\n```\n\nConfiguration volumes must be mounted before\
    \ use, using the split-phase Mount interface:\n\n```\n```c\ninterface Mount {\n\
    \  command error_t mount();\n  event void mountDone(error_t error);\n}\n```\n\
    ```\n\n![](img/53ede4f4266a5731b93bff15d85fa06a_126_0.png)\n\nOnce mounted, the\
    \ volume is accessed using the ConfigStorage interface:\n\n```\n```c\ninterface\
    \ ConfigStorage {\n  command error_t read(storage_addr_t addr, void* buf, storage_len_t\
