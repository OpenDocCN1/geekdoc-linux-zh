- pgno: 163
  md: "Within CC2420ActiveMessageP, this is what the parameterized interface looks\
    \ like:\n\n```\ncommand error_t AMSend.send[am_id_t id](am_addr_t addr, message_t*\
    \ msg, uint8_t len) {\n  cc2420_header_t* header = getHeader(msg);\n  header->type\
    \ = id;\n  ...\n}\n```\n\nListing 8.15 Parameterized interface syntax\n\nThe interface\
    \ parameter precedes the function argument list, and the implementation can treat\
    \ it like any other argument. Basically, it is a function argument that the nesC\
    \ compiler fills in when components are composed. When CC2420ActiveMessageP wants\
    \ to signal sendDone, it pulls the protocol identifier back out of the packet\
    \ and uses that as the interface parameter:\n\n```\nevent void SubSend.sendDone(message_t*\
    \ msg, error_t result) {\n  signal AMSend.sendDone[call AMPacket.type(msg)](msg,\
    \ result);\n}\n```\n\nListing 8.16 Dispatching on a parameterized interface\n\n\
    If the AM type of the packet is 240, then the dispatch code nesC generates will\
    \ cause this line of code to signal the sendDone wired to ActiveMessageC’s AMSend[240]\
    \ interface, which in this case is ultimately wired to TestAMC’s AMSend.sendDone.\
    \ CC2420ActiveMessagePReceive looks similar to sendDone. The AM implementation\
    \ receives a packet from a lower-level component and dispatches on the AM type\
    \ to deliver it to the correct component. Depending on whether the packet is destined\
    \ to the local node, it signals either Receive.receive or SnooP.receive:\n\n```\n\
    event message_t* SubReceive.receive(message_t* msg, void* payload, uint8_t len)\
    \ {\n  if (call AMPacket.isForMe(msg)) {\n    return signal Receive.receive[call\
    \ AMPacket.type(msg)](msg, payload, len - CC2420_SIZE);\n  } else {\n    return\
    \ signal SnooP.receive[call AMPacket.type(msg)](msg, payload, len - CC2420_SIZE);\n\
    \  }\n}\n```\n\nListing 8.17 How active message implementations decide on whether\
    \ to signal to Receive or Snoop\n\nThe subtraction of CC2420_SIZE is because the\
    \ lower layer has reported the entire size of the packet, while to layers above\
    \ AM the size of the packet is only the data payload (the entire size minus the\
    \ size of headers and footers, that is, CC2420_SIZE). Parameterized interfaces\
    \ get the best of both worlds. Unlike the name-based approach (e.g. Send240) described\
    \ above, there is a single implementation of the call. Additionally,"
