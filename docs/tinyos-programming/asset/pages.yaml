  md: "```\n```text\ncall PowerupToggleLEC_Leds_led1Toggle();\ncall PowerupToggleLEC_Leds_led2Toggle();\n\
    }\n}\n```\n```\n\nListing 4.3  C code generated from the PowerupToggleAppC configuration\n\
    \nAll of these levels of indirection could add significant overhead. Toggling\
    \ an LED takes two function calls. In practice, however, the nesC compiler toolchain\
    \ cuts out all of this overhead through extensive inlining. All of those function\
    \ calls collapse and the LED toggling logic is embedded in the while loop.\n\n\
    # 4.1.2　The = operator\n\nThe -> and <- operators connect concrete providers and\
    \ users that the configuration names through the **components** keyword. A direct\
    \ wiring (a -> or <-) always goes from a user to a provider, resolving command\
    \ and event call paths.\n\nFrom the perspective of someone using a component,\
    \ it shouldn’t be relevant whether the component is a module or a configuration.\
    \ Just like modules, configurations can provide and use interfaces. But as they\
    \ have no code, these interfaces must be defined in terms of other components.\
    \ The only way a configuration can provide or use an interface is to do so by\
    \ proxy: it renames another component’s implementation as its own. Configurations\
    \ achieve this with the wiring operator, =. The = operator connects the interfaces\
    \ in a configuration’s signature to interfaces in components named in its **components**\
    \ statement.\n\nFor example, this is the implementation of the configuration LedsC,\
    \ which provides the Leds interface by *exporting* the interface provided by LedsP:\n\
    \n```\n```nesc\nconfiguration LedsC {\n  provides interface Leds;\n}\nimplementation\
    \ {\n  components LedsP, PlatformLedsC;\n  Leds = LedsP;\n\n  LedsP.Init <- PlatformLedsC.Init;\n\
    \  LedsP.Led0 -> PlatformLedsC.Led0;\n  LedsP.Led1 -> PlatformLedsC.Led1;\n  LedsP.Led2\
    \ -> PlatformLedsC.Led2;\n}\n```\n```\n\nListing 4.4  the LedsC configuration\n\
    \nLedsC is a simple example of a configuration that connects a few small building\
    \ blocks into a larger, more useful abstraction. LedsP is a simple module whose\
    \ code implements the Leds interface commands by manipulating underlying digital\
    \ IO lines"
