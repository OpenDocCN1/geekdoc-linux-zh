  md: 'with possible further optimization down into the SPI layer (it might just inline
    SpiByte.write into the function, removing any need for function calls).


    If a function has an argument which is one of a small number of constants, consider
    defining it as a few separate functions to prevent bugs. If the functions of an
    interface all have an argument that''s almost always a constant within a large
    range, consider using a parameterized interface to save code space. If the functions
    of an interface all have an argument that''s a constant within a large range but
    with only certain valid values, implement it as a parameterized interface but
    expose it as individual interfaces, to both minimize code size and prevent bugs.


    # 9.2.3 AMSenderC


    HilTimerMilliC virtualizes a hardware timer and makes independent instances available
    via a parameterized interface. TimerMilliC is thus reasonably simple: all it really
    does is encapsulate a wiring with unique() to prevent client collisions and to
    simplify wiring.


    Active messages are slightly different. The basic platform-supplied active message
    component, ActiveMessageC, provides AMSend, parameterized by the AM identifier.
    However, ActiveMessageC can only have a single packet outstanding at any time.
    If it is already sending a packet and a component calls AMSend.send, ActiveMessageC
    returns FAIL or EBUSY. From the perspective of a caller, this is a bit of a pain.
    If it wants to send the packet, it has to wait until the radio is free, but doesn''t
    have a very easy way of figuring out when this will occur.


    TinyOS 1.x had a global (not parameterized) sendDone event, which the radio would
    signal whenever it finished sending any packet. That way, if a component tried
    to send and received a FAIL, it could try to resend when it handled the global
    sendDone event. This mostly works, except that if multiple components wire to
    sendDone, then the fan-out determines the priority of the send requests. For example,
    if a hog of a component handles sendDone and happens to be first in the fan-out,
    it will always be the first to call Send.send and will monopolize the radio.


    TinyOS 2.0 solves this problem through the AMSenderC component, which is a generic
    configuration. AMSenderC is a virtualized abstraction: every instance of AMSenderC
    acts like ActiveMessageC. That is, each AMSenderC can handle a single outgoing
    packet. This means that each component that wires to an AMSenderC can act independently
    of the other components, and not worry about fan-out scheduling. The one-deep
    queue of ActiveMessageC is replaced by N one-deep queues, one for each of the
    N clients.


    A one-deep queue per AMSenderC isn''t sufficient. There''s also the question of
    what order the senders get to send their packets. Under the covers, what the active
    message layer does is maintain an array of N pending packets, where N is the number
    of AMSenderC components. Each AMSenderC is a client of the active message sending
    abstraction, and so has a client identifier that indexes into this array. The
    implementation keeps track of the last client that was able to send a packet,
    and makes sure that everyone else waiting gets a chance before that client does
    again (this is known as round-robin scheduling).'
