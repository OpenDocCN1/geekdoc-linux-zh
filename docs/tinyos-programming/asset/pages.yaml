- pgno: 248
  md: "Several factors can cause SoundLocalizer to make an incorrect report of the\
    \ mote closest to the sound. First, as we noted above, if the difference in travel\
    \ times to two motes is less than the error in time synchronization, then those\
    \ two motes will not reliably know which one is closer to the sound. Second, if\
    \ the motes are sampling the microphone every 100 μs, then there will be an average\
    \ delay of 50 μs in detecting a loud sound. Under the assumption that sampling\
    \ doesn’t start and stay in perfect synchrony on all motes, this delay increases\
    \ SoundLocalizer’s imprecision. Finally, if sound cannot travel in a straight\
    \ line to the closest mote (e.g. there is an obstacle in the way), then the mote\
    \ that hears the sound first may not be the closest mote.\n\nPorting SoundLocalizer\
    \ to a new mote that uses the same mts300 sensor board should only require significant\
    \ changes in DetectorC: SynchronizerC and MicrophoneC use only hardware-independent\
    \ interfaces that should just need rewiring for the new mote’s implementation\
    \ of the necessary hardware resources (timers, I/O pins, etc., as described below).\
    \ SoundLocalizer can also be modified to use a different sensor, detecting a different\
    \ event. For instance, the closest mote to an impact might be detectable using\
    \ an accelerometer that measures vibrations. Modifying SoundLocalizer in this\
    \ way will require a replacement for MicrophoneC to switch the new sensor on and\
    \ off, and a replacement for DetectorC to implement the new event detection logic.\n\
    \n# 13.2 SynchronizerC\n\nA detector mote goes through several execution stages:\
    \ booting, time synchronization, preparing for event detection, detecting the\
    \ event itself, cleaning up after detection, and voting. Execution then returns\
    \ to the time synchronizing stage the next time the coordinator is switched on.\
    \ The logic that controls the progression of a mote through these stages is in\
    \ the SynchronizerC component and is portable to any platform that provides a\
    \ microsecond-precision counter (used for time synchronization).\n\nAt boot time,\
    \ a detector mote simply starts the radio and awaits messages from the coordinator\
    \ (see above for the coordinator code and message layout). The handler for these\
    \ coordination messages contains the heart of SoundLocalizer’s time synchronization\
    \ algorithm:\n\n```\nmodule SynchronizerC {\n  uses interface Receive as RCoordination;\n\
    \  uses interface Counter<TMicro, uint32_t>;\n  uses interface Stats;\n\n}\nimplementation\
    \ {\n  uint32_t t0;\n\n  uint32_t now() {\n    return call Counter.get() >> TIME_SHIFT;\n\
    \  }\n}\n```"
  merge: -1
  img_proc: true
