- pgno: 89
  md: "```\nA.StdControl -> C.StdControl;\nB.SubControl -> C.StdControl;\n```\n\n\
    Listing 4.19 Why the metaphor of \"wires\" is only a metaphor\n\nIf you take the\
    \ multiple wiring metaphor literally, then the wiring of B to C joins it with\
    \ the wiring of A to B and C. That is, they all form a single \"wire.\" The problem\
    \ is that under this interpretation, B's call to C is the same wire as A's call\
    \ to B. B enters an infinite recursion loop, as it calls SubControl, which calls\
    \ B.StdControl, which calls SubControl, and so on and so on. Therefore, nesC does\
    \ not take the metaphor literally. Instead, the wirings from one interface to\
    \ another are considered separately. So the code\n\n```\nA.StdControl -> B.StdControl;\n\
    A.StdControl -> C.StdControl;\nB.SubControl -> C.StdControl;\n```\n\nmakes A's\
    \ calls to StdControl.start call B and C, and B's calls to SubControl.start call\
    \ C only.\n\n# 4.4.3 Combine functions\n\nFan-out raises an interesting question:\
    \ if\n\n```\ncall SoftwareInit.init()\n```\n\nactually calls ten different functions,\
    \ then what is its return value?\n\nnesC provides the mechanism of combine functions\
    \ to specify the return value. A data type can have an associated combine function.\
    \ Because a fan-out always involves calling N functions with identical signatures,\
    \ the N results can be combined to a single value by N − 1 calls to a combine\
    \ function, each taking a pair of values of the result type. When nesC compiles\
    \ the application, it auto-generates a fan-out function which applies the combine\
    \ function.\n\nFor example, TinyOS's error type, error_t is a very common result\
    \ type. Its combine function is ecombine:\n\n```\nerror_t ecombine(error_t e1,\
    \ error_t e2) {\n  return (e1 == e2) ? e1 : FAIL;\n}\n```\n\nListing 4.20 The\
    \ combine function for error_t\n\nIf both calls return the same value, ecombine\
    \ returns that value. Otherwise, it returns FAIL. Thus combining two SUCCESS values\
    \ returns SUCCESS, combining two identical Exxx error codes returns that code,\
    \ and all other combinations return FAIL."
  merge: -1
  img_proc: true
- pgno: 90
  md: "This combine function is bound to error_t with a nesC attribute (attributes\
    \ are covered in Section 8.4):\n\n```\ntypedef uint8_t error_t @combine('ecombine');\n\
    ```\n\nWhen asked to compile the following configuration\n\n```\nconfiguration\
    \ InitExample ()\nimplementation {\n  components MainC;\n  components AppA, AppB,\
    \ AppC;\n\n  MainC.SoftwareInit -> AppA;\n  MainC.SoftwareInit -> AppB;\n  MainC.SoftwareInit\
    \ -> AppC;\n}\n```\n\nListing 4.21 Fan-out on SoftwareInit\n\nthe nesC compiler\
    \ will generate something like the following code:³\n\n```\nerror_t MainC__SoftwareInit___init()\
    \ {\n  error_t result;\n  result = AppA__SoftwareInit___init();\n  result = ecombine(result,\
    \ AppB__SoftwareInit___init());\n  result = ecombine(result, AppC__SoftwareInit___init());\n\
    \  return result;\n}\n```\n\nListing 4.22 Resulting code from fan-out on SoftwareInit\n\
    \nCombine functions should be associative and commutative, to ensure that the\
    \ result of a fan-out call does not depend on the order in which the commands\
    \ (or event) are executed (in the case of fan-out, this order is picked by the\
    \ compiler).\n\nSome return values don’t have combine functions, either due to\
    \ programmer oversight or the semantics of the data type. Examples of the latter\
    \ include things like data pointers: if both calls return a pointer, say, to a\
    \ packet, there isn’t a clear way to combine them into a single pointer. If your\
    \ program has fan-out on a call whose return value can’t be combined, the nesC\
    \ compiler will issue a warning along the lines of \"calls to Receive.receive\
    \ in CC2420ActiveMessageP are uncombined\" or \"calls to Receive.receive in CC2420ActiveMessageP\
    \ fan out, but there is no combine function specified for the return value.\"\n\
    \n³ The nesC compiler actually compiles to C, which it then passes to a native\
    \ C compiler. Generally, it uses _ as the delimiter between component, interface,\
    \ and function names. By not allowing _ in the middle of names, the nesC compiler\
    \ enforces component encapsulation (there’s no way to call a function with a _\
    \ from within nesC and break the component boundaries)."
