    \  ...\n}\n```\n\nListing 9.16  AMSendQueueImplP pseudocode\n\n# 9.2.4   BlockStorageC\n\
    \nOne of the most difficult parts of nesC programming is using parameterized interfaces\
    \ and managing their keyspaces. As we saw in Section 6.5, BlockStorageC is one\
    \ of TinyOS’s three storage abstractions, and provides random read/write access\
    \ to a storage volume (a contiguous area on a flash chip). BlockStorageC is a\
    \ good example of using generics, because it is non-trivial use of wiring to build\
    \ an abstraction from underlying components. BlockStorageC deals with four different\
    \ sets of parameterized interfaces.\n\nEvery volume has a unique identifier, and\
    \ every BlockStorageC is associated with a single volume. However, there can be\
    \ multiple BlockStorageC components accessing multiple volumes, and not all volumes\
    \ may have BlockStorageC components (they may be unused or accessed by a different\
    \ abstraction). A client has to be associated with a volume so that the underlying\
    \ code can generate an absolute offset into the chip from a relative offset within\
    \ a volume. For example, if a 1 MB flash chip is divided into two 512 KB volumes,\
    \ then address 16k on volume 1 is address 528k on the chip. This means that there\
    \ are at least two keyspaces. The first keyspace is the volume ID keyspace, and\
    \ the second is the client ID keyspace."
