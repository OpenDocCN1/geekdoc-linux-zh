    # Listing 6.4 The full Timer interface


    We have already seen the commands and events from the basic interface, except
    for stop which simply cancels any outstanding fired events. The status interface
    simply returns a timer’s current settings. The extended interface is similar to
    the basic interface, except that timings are specified relative to a base time
    t0. Furthermore, the “current time” (in the timer’s units, since boot) can be
    obtained using the getNow command. The startOneShotAt command requests a fired
    event at time t0+dt, and startPeriodicAt requests fired events at times t0+dt,
    t0+2dt, t0+3dt, ... This may not seem like a very big change, but is sufficient
    to fix the drift problem as this revised version of WarningTimer.fired shows:


    ```

    uint32_t base; // Time at which WarningTimer.fired should’ve fired


    event void WarningTimer.fired() {

    if (call Leds.get() & LEDS_LED0)

    { // Red LED is on. Turn it off, will switch on again in 4096-64ms.

    call Leds.led0Off();

    call WarningTimer.startOneShotAt(base, WARN_INTERVAL - WARN_DURATION);

    base += WARN_INTERVAL - WARN_DURATION;

    }

    else

    { // Red LED is off. Turn it on for 64ms.

    call Leds.led0On();

    call WarningTimer.startOneShotAt(base, WARN_DURATION);

    base += WARN_DURATION;

    }

    }

    ```


