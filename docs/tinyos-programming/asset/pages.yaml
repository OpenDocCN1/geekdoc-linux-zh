    # 10.8 Behavioral: Adapter


    # Intent


    Convert the interface of a component into another interface, without modifying
    the original implementation. Allow two components with different interfaces to
    interoperate.


    # Motivation


    Sometimes, a piece of functionality offered by a component with one interface
    needs to be accessed by another component via a different interface. For instance,
    the low-level Alarm interface is efficient but signals its "fired" event in an
    interrupt handler, exposing its users to the complexity of interrupt-driven programming.
    Using the Timer interface is preferable in most cases, as it is much easier to
    write correct task-level code.


    Manually implementing Timer instead of Alarm for every timer, or even once for
    every platform, is undesirable: some of the repeated code would likely contain
    bugs and lead to maintenance problems if the Timer or Alarm interfaces change.
    Instead, the AlarmToTimerC Adapter implements a Timer interface in terms of Alarm''s
    operations.


    An Adapter is a component (normally generic) which provides an interface of type
    A, e.g. Timer, and uses an interface of type B, e.g. Alarm, and implements the
    operations of A in terms of those of B. An Adapter may also need to implement
    functionality not provided by the B interface, e.g. Timer provides periodic and
    one-shot timing events while Alarm only has one-shot events. More generally, an
    Adapter may provide several interfaces A1,...,An and implement them in terms of
    several used interfaces B1,...,Bm.


    # Applicable when


    +   - You wish to provide the functionality of an existing component with a different
    interface.


    # Structure


    ![](img/53ede4f4266a5731b93bff15d85fa06a_212_0.png)'
