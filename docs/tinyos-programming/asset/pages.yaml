    # 10.6 Structural: Facade


    # Intent


    Provides a unified access point to a set of inter-related services and interfaces.
    Simplifies use, inclusion, and composition of the subservices.


    # Motivation


    Complex system components, such as a filesystem or networking abstraction, are
    often implemented across many components. Higher-level operations may be based
    on lower-level ones, and a user needs access to both. Complex functionality may
    be spread across several components. Although implemented separately, these pieces
    of functionality are part of a cohesive whole that we want to present as a logical
    unit.


    For example, the Matchbox filing system from TinyOS 1.x provides interfaces for
    reading and writing files, as well as for metadata operations such as deleting
    and renaming. Separate modules implement each of the interfaces, depending on
    common underlying services such as reading blocks.


    One option would be to put all of the operations in a single, shared interface.
    This raises two problems. First, the nesC wiring rules mean that a component that
    wants to use any command in the interface has to handle all of its events. In
    the case of a file system, all the operations are split-phase; having to handle
    a half dozen events (readDone, writeDone, openDone, etc.) merely to be able to
    delete a file is hardly usable. Second, the implementation cannot be easily decomposed
    into separate components without introducing internal interfaces, as the top-level
    component will need to call out into the subcomponents. Implementing the entire
    subsystem as a single huge component is not easy to maintain.


    Another option is to export each interface in a separate component (e.g. MatchboxRead,
    MatchboxWrite, MatchboxRename, etc.). This increases wiring complexity, making
    the abstraction more difficult to use. For a simple open, read, and write sequence,
    the application would have to wire to three different components. Additionally,
    each interface would need a separate configuration to wire it to the subsystems
    it depends on, increasing clutter in the component namespace. The implementer
    needs to be careful with these configurations, to prevent inadvertent double-wirings.


    The Facade pattern provides a better solution to this problem. The Facade pattern
    provides a uniform access point to interfaces provided by many components. A Facade
    is a nesC configuration that defines a coherent abstraction boundary by exporting
    the interfaces of several underlying components. Additionally, the Facade can
    wire the underlying components, simplifying dependency resolution.


    A nesC Facade has strong resemblances to the object oriented pattern of the same
    name. The distinction lies in nesC’s static model. An object-oriented Facade instantiates'
  merge: -1
  img_proc: true
