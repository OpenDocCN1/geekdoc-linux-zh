  md: "a set of generic components which can be assembled to build useful abstractions:\
    \ each supported microcontroller provides a timer system by layering these library\
    \ components on top of some low-level hardware abstractions. Because many microcontrollers\
    \ have several clock sources, most of these library components are generic components,\
    \ so that a platform can readily provide several timer systems of different fidelities.\n\
    \nFor example, this is the full code for HiTimerMilliC on the micaz platform –\
    \ it is similar, but not identical to the typical structure shown in Figure 9.1,\
    \ page 148. It is defined in `tos/platforms/mica`, which contains common abstractions\
    \ across the entire mica family (e.g. mica2, mica2dot, micaz):\n\n```\n```nesc\n\
    #include \"Timer.h\"\n\nconfiguration HiTimerMilliC {\n  provides interface Init;\n\
    \  provides interface Timer<TMilli> as TimerMilli(uint8_t num);\n  provides interface\
    \ LocalTime<TMilli>\n}\nimplementation {\n\n  enum {\n    TIMER_COUNT = uniqueCount(UQ_TIMER_MILLI)\n\
    \  };\n\n  components AlarmCounterMilliP, new AlarmToTimerC(TMilli),\n       \
    \      new VirtualizeTimerC(TMilli, TIMER_COUNT),\n             new CounterToLocalTimeC(TMilli);\n\
    \n  Init = AlarmCounterMilliP;\n\n  TimerMilli = VirtualizeTimerC;\n  VirtualizeTimerC.TimerFrom\
    \ -> AlarmToTimerC;\n  AlarmToTimerC.Alarm -> AlarmCounterMilliP;\n\n  LocalTime\
    \ = CounterToLocalTimeC;\n  CounterToLocalTimeC.Counter -> AlarmCounterMilliP;\n\
    }\n```\n```\n\nListing 9.18  The full code of HiTimerMilliC\n\nThe only singleton\
    \ component in this configuration is AlarmCounterMilliP, which is an abstraction\
    \ of a low-level microcontroller timer. HiTimerMilliC uses three generic components\
    \ on top of AlarmCounterMilliP to provide a full timer system:\n\n+   - **CounterToLocalTimerC**\
    \ turns a hardware counter into a local timebase;\n+   - **AlarmToTimerC** turns\
    \ an Alarm interface, which provides an interrupt-driven one-shot timer, into\
    \ a Timer interface, which provides a synchronous timer with greater functionality;\n\
    +   - **VirtualizeTimerC** virtualizes a single Timer into *n* Timers, where *n*\
    \ is a component argument."
