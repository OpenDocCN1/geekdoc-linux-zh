    configuration RadioCountToLedsAppC {

    implementation {

    components MainC, RadioCountToLedsC as App, LedsC;

    components new AMSenderC(AM_RADIO_COUNT_MSG);

    components new AMReceiverC(AM_RADIO_COUNT_MSG);

