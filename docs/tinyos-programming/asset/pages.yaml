    Modules allocate memory by declaring variables which, following nesC’s scoping
    rules, are completely private to the component. For example, the CountingGetC
    component (Listing 3.20, page 32) allocated count as an 8-bit module-level variable,
    for a cost of 1 byte of RAM. Because TinyOS uses split-phase operations and does
    not provide threads, there is no long-lived stack-allocated data. As a result,
    when a TinyOS system is quiescent, these module variables represent the entire
    software state of the system.


    Generally, nesC does not encourage dynamic memory allocation through malloc or
    other C library calls. You can call them, but the lack of memory protection on
    most embedded microcontrollers makes their use particularly risky. Figure 3.5
    shows a typical memory layout on a microcontroller. The stack grows down and the
    heap grows up, and since there is no hardware memory protection the two can collide,
    at which point chaos is guaranteed.


    Instead, you should allocate memory as module variables. For example, if a module
    needs a buffer with which to hold sensor readings, it should allocate the buffer
    statically. In other cases, it is convenient to create reusable abstract data
    types and state and operations in a generic component, as in BitVectorC (Listing
    3.23, page 34). Finally, components sometimes need to share a memory pool. A common
    example of this is a set of components that share a pool of packet buffers. A
    shared pool allows multiple cooperating components to amortize their requirements,
    especially if it is unlikely all of them will need a lot of memory at the same
    time. By avoiding all use of the heap, the only cause of run-time memory failure
    is the stack.


    To avoid stack overflow, TinyOS programs should avoid recursion and not declare
    any large local variables (e.g. arrays). Avoiding recursion within a single module
    is easy, but in a component-based language like nesC it’s very easy to unintentionally
    create a recursive loop across component boundaries. For instance, let’s assume
    component A uses the Read interface to repeatedly sample a sensor provided by
