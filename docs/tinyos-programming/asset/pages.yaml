- pgno: 173
  md: "has to repeat a particular code sequence. Generic configurations solve this\
    \ problem: in practice, services don’t require users to wire to parameterized\
    \ interfaces.\n\n# 9.2 Generic configurations\n\nGeneric modules are a way to\
    \ reuse code and separate common abstractions into well-tested building blocks\
    \ (there only needs to be one FIFO queue implementation, for example). nesC also\
    \ has generic configurations, which are a very powerful tool for building TinyOS\
    \ abstractions and services. However, just as configurations are harder for a\
    \ novice programmer to understand than modules, generic configurations are a bit\
    \ more challenging than generic modules.\n\nThe best way to describe what role\
    \ a generic configuration can play in a software design is to start from first\
    \ principles.\n\nA module is a component that contains executable code; a configuration\
    \ defines relationships between components to form a higher-level abstraction;\
    \ a generic module is a reusable piece of executable code; therefore, a generic\
    \ configuration is a reusable set of relationships that form a higher-level abstraction.\n\
    \nSeveral examples in this book have mentioned and described HiiTimerMilliC. But\
    \ if you look at TinyOS code, there is only one component that references it.\
    \ Although it is a very important component, programs never directly name it.\
    \ It is the core part of the timer service, but applications that need timers\
    \ instantiate a generic component named TimerMilliC.\n\nBefore delving into generic\
    \ configurations, however, let’s consider what code looks like without them. Let’s\
    \ say we have HiiTimerMilliC, and nothing more. Many components need timers; HiiTimerMilliC\
    \ enables this through its parameterized interface. Remember that HiiTimerMilliC\
    \ encapsulates an instance of VirtualizeTimerC, whose size parameter is a call\
    \ to unique(UQ_TIMER_MILLI). This means that if a component AppP needs a timer,\
    \ then its configuration AppC must wire it like this:\n\n```\nenum {\n  TIMER_KEY\
    \ = unique(UQ_TIMER_MILLI)\n};\nAppP.Timer -> HiiTimerMilliC.TimerMilli[TIMER_KEY];\n\
    ```\n\nNote in passing that this snippet (and the earlier definition of HiiTimerMilliC)\
    \ take advantage of the fact that the body of configurations can contain type\
    \ and constant declarations, whose scope extends to the end of the configuration’s\
    \ implementation section. Providing a name like TIMER_KEY for a unique value is\
    \ one of the most common ways this facility is used.\n\n# 9.2.1 TimerMilliC\n\n\
    TimerMilliC is TinyOS’s standard standard millisecond timer abstraction, designed\
    \ to simplify usage of TinyOS’s virtualized timer service. HiiTimerMilliC. TimerMilliC\
    \ is a generic configuration that provides a single Timer interface. Its implementation\
    \ wires this interface to an instance of the underlying parameterized Timer interface\
    \ using the"
