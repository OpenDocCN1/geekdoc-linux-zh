    # Cool Linux Hacks


    ![](img/ef948bfad2ff49ba16960a53d116bb79_2_0.png)


    This Linux Magazine special edition promises you “Cool Linux Hacks,” and we’ll
    certainly deliver –-check the table of contents on the following pages for a list
    of all the gems we present inside. But what exactly is a “hack”? Today’s world
    where Windows is the dominant desktop OS, the decision to use Linux is the first
    and most important hack. In addition to that:


    - If I can use it to solve a problem or get work faster than before, then it’s
    a hack.

    - If the way it works is unexpected, it’s very nearly a hack.

    - Is it a powerful tool that I’ve seen before? I’ll try it out, and maybe it’s
    a hack.

    - If it teaches me a new and interesting way to use my Linux machine, it’s a hack.

    - When it makes me grin because it’s so obvious that only a geeky Unix person
    would ever think of doing things this way, I will add to my list of anecdotes
    (and yes, it’s a hack).


    The definition of a hack is a matter of taste and so is our choice of hacks for
    this collection: Many authors have contributed, and together we have assembled
    a mix of helpful applications and powerful replacements for classic tools. We
    organize them into nine categories that you’ll find quickly when you go back to
    search for Being a Linux professional is all about experience – and knowing which
    tools get the job done.


    For our new “Collectors” category, we’ve selected some programs that help you
    organize your collections – or perhaps one if you got inspired by our interests.
    While we cover the obvious topics books and DVDs, we also introduce you to “forgotten”
    technology: music CDs are making a comeback, and you can rip them to create an
    MP3 collection that you can play on your Linux PC without relying on a streaming
    service. Or maybe you’re discovering the joys of sorting coins from different
    countries? In any case, we hope that you enjoy our 2025 edition.


    Hans-Georg Eiter

    Editor-in-Chief


