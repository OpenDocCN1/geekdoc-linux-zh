  mdcn: '


    ## 使用 Zoxide 导航


    在大多数 shell 中，主要的导航工具是 `cd`（切换目录）。`cd` 通常内置在 shell 中，像其他命令一样有自己的帮助页面，但这通常不会被注意到，因为大多数用户基础都是
    `cd`。然而，当目录有多个层级时，`cd` 可能需要繁琐的输入，尤其是当你需要在目录结构向上移动并进入另一个目录时。cd 的现代版本 zoxide 通过数据库改变了这一点，它只需要路径中的最后一个目录。


    为了获得结果，zoxide 依赖于基于目录访问频率的算法。在首次添加到数据库时，zoxide 会分配一个分数。你每访问它一次，分数就会增加。当进行查询时，如果目录在过去一天或一周内被访问过，就会添加。使用频率越高，值越高。当数据库达到最大条目时，它会重新分配访问频率并删除旧条目。


    ## 安装与配置


    Zoxide 可用于许多发行版，也支持多种平台和包格式。然而，安装包只是开始。为了使其运行，zoxide 需要一些配置。首先，需要将 zoxide 添加到
    shell 中。


    ```

    eval $(zoxide init)

    ```


    必须将其添加到 `~/.bashrc`、`~/.zshrc` 或手动使用 `zoxide-init`。zoxide 的 GitHub 提供了其他 shell
    的说明。为了搜索目录名称，必须安装模糊搜索器 `fzf`。安装后，你可以更改命令名称。目录通过 `--SETTING` 存储在数据库中，可以选择 `none`、`prompt`
    或 `pulp` 模式。


    另一个简单的选项是将 zoxide 与 Emacs、Vim 和 nano 等应用程序集成，或者作为 Ranger 等多个文件管理器的一部分。这些由许多流行的开发者发布在
    GitHub 上，例如 Joe 这样的文本编辑器，或 Dolphin 或 Doxide 这样的文件管理器。zoxide 的行为也可以通过环境变量设置：


    - - ZOXIDE_DIR: 指定存储数据库的目录。使用 `$ZOXIDE_DIR=$HOME` 进行本地存储。

    - - ZO_E: 设置为 1 时，将在导航到目录之前显示该目录。通过此变量，你可以使用 `-f` 从完整路径运行 `cd`

    - - ZO_EXCLUDE: 指定数据库中排除的目录。默认排除 `/home`。这对于安全和隐私很有用。

    - - ZO_FZF_OP: 提供在交互选择期间传递给 fzf 的自定义选项。实用的选项包括大小敏感性、搜索结果中目录权重的替代方法以及显示的选项。请查看
    fzf 的选项列表。

    - - ZO_MERGE: 限制数据库中的最大条目数量。默认值为 10,000。


    ## 使用 Zoxide


    所有这些配置使得 zoxide 使用非常简单。输入 `PATH`，最终目录会被添加到数据库中。下次当你需要导航到该目录时，只需要输入 `DIRECTORY`，无论它在目录树中有多深。例如，


    ```

    z/home/etc

    ```


    下次当你想创建 zoxide 时。一旦设置完成，你可以将最常用的目录添加到数据库并简化你的导航。当模式匹配时，你可以使用 `Space-Tab` 进行基于数据库的搜索并从列表中选择！这需要安装
    `fzf`。


    随着数据库的填充，zoxide 将选择排名最高的目录。你可以通过搜索路径中的多个目录或通过使用子路径来更改此行为。如果你带有子目录进行添加，zoxide 将通过
    `-` 向进入一个目录，或通过 `~` 进入上一个目录。


    对于更高级的用户，不再返回任何信息


    zoxide 的行为可以通过放置在基本命令之后的自定义脚本进行编辑。你可以添加一个排名为 1 的路径，或者增加数据库中目录的排名。之后，条目的最后一个字段将得到更新。`ZO_EXCLUDE`
    环境变量中的目录无法被添加。使用更快的方法添加目录而无需从导航中选择它们。


    - - zoxide --port Fzf: 输出格式对 fzf 关重要。fzf 的选项有 `--all` 和 `--interactive`。使用 `--(-1)`
    时将返回所有结果，而不仅仅是使用过的；使用 `--score (-)` 列出排名，这些排名可以通过 zoxide 进行操作。

    - - zoxide --remove: 从数据库中删除目录。如果目录在 `ZO_EXCLUDE` 环境变量中，将从数据库中删除该目录。


    例如使用 zoxide，返回的命令数量为


    用户可能想通过在配置文件中添加别名 `alias cd` 让 zoxide 成为 `cd`。zoxide 节省了数千次击键，既高效又优雅。


    图 1：当 zoxide 提供供选择的备选列表时。


    ```

    # /home/bb/moonlander_notes

    #/home/bb/moonlander

    ```


    作者：Bruce Byfield


    https://github.com/ajeetssoa/zoxide


    ## SHELL


    ![](img/ef948bfad2ff49ba16960a53d116bb79_90_0.png)


    ## 寻找你喜喜欢的终端 HACK 111


    ## 使用最强大的分页器。


    所有的操作系统都带有一个 shell，也有分页器（pager）：一个显示 ASCII 文本文件的页，每一页被定义为一个屏幕（或满满行的终端窗口）。在类 Unix
    系统以及 MS 和 Windows 上，经典的分页器是：它显示文件的第一行，并在最后一行写入“More”，然后等待按键输入后再显示下一页。


    '
