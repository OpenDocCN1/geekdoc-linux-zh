    ## HACK 39


    ### JC303: Synth Bass


    Even if you don''t care about synthesizers, there''s one that you can''t escape,
    and that''s the acid-like squelch of a Roland TB-303 bass-line synth. This synth
    was packaged in a small silver box and originally released in the early 1980s.
    Roland built the TB-303 to replace human bass players, but just like the TR-78
    "Computer" drum machine, it was instead instrumental in creating an entirely new
    genre of electronic music, leaving musicians mostly alone. The TB-303 in particular
    became famous for its distinctive sound of acid music in the late ''80s, whose
    mono and resonant sound perfectly matched with Roland''s famous drum machine,
    the TR-808, creating a dance craze that modern music is still driven by. With
    prices for the original TB-303 remaining high, even modern recreations missing
    the nuances of original sound, developers have long attempted to recreate the
    original sound. An open source project called Open303 got about close as you could.
    JC303 is a new port of that original we tried Open303 to the JUCE framework, with
    a modified GUI and much better capabilities. Many people now use JC303 because
    it offers MIDI compatibility with audio software integration, but also retains
    complex multiplatform and multi-architecture support, and a fantastic canvas for
    modern designs with knobs and sliders. For example, it includes support for LV2
    and VST, and there are also to add preset and recreation of the original step
    sequencer. The sequencer was an integral part of the original, and JUCE will make
    its recreation easier than having to code something from scratch. JC303 recreates
    all the original TB-303, including its quirky design and form factor.


    ![](img/ef948bfad2ff49ba16960a53d116bb79_35_0.png)


    By Graham Morrison


    https://github.com/midi/jc303


