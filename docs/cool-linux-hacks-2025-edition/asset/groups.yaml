    # HACK


    如果说 KDE Plasma 的系统监控（System Monitor）是你见过最漂亮的监控工具，那么 Guider 可能是最全面的备选者。它甚至不认为自己是一个监控工具，而是倾向于使用“集成性能分析器”这一术语，这是一个非常准确的描述。它包含了监控、分析、可视化、控制、日志和报告，所有的都可以命令行完成。Guider
    使用 Python 编写，可以通过 pip 轻松安装。在最简单的情况下，你可以运行 `guider ''top''` 将其作为 top 进程视图启动，尽管这主要是为了右侧面板。你的监控模式包含海量数据，很容易让你的终端变得过载。例如，该工具的实现非常广泛，列出了每个核心的统计数据，并配有表格和系统概览。


    其他工具被用于测量函数的运行时间和资源占用、拦截调用堆栈并执行信号跟踪。如果你想从同一个命令中为进程配置调度器以分配更多或更少的 CPU 时间，或限制其 CPU
    使用率，这取决于 Linux 配置。它有很多选项，可以可选地将它们管道到 JSON 格式的文件中，或者在网络浏览器中查看。线程也可以被追踪、计数并回放历史，甚至在
    Guider 内部，你可能想从你喜喜欢的浏览器或图像查看器查看它们。这里有很多需要学的，但该工具对于监控来说既直观又用，非常适合那些需要一个随知识增长成长的工具的人。


    # HACK


    # 将 ddresce 可视化进度


    许多用户使用 GNU ddresce 从故障硬盘中恢复数据。然而，日志很难调试，ddresce 可以以可视化的方式处理日志文件。要启动它，带上测试文件参数运行
    ddresce，它会创建一个“映射文件（map file）”。


    第一个工具确定尺寸并在窗口中显示所有扇区的概览（见图）。不同的颜色代表区域的状态：（绿色）正常，缺陷（红色），未修剪（黄色）或未识别（灰色）。你可以通过鼠标点击获取有关扇区的详细信息：点击“块检查器（Block
    Inspector）”对话框，将显示区域故障、状态以及 ddresce 的运行情况。


    该工具根据程序设置使用 512 字节的块大小，并带有刷新间隔，以便在 ddresce 运行时保持显示更新。


    在 Ubuntu 和 Linux Mint 上，你只需安装：`sudo install the ddresce (GNU ddresce) and ddresce`
    包。


    > 作者 Uwe Hoffmann


    https://www.gnu.org/software/ddresce/

    https://sourceforge.org/projects/ddresce


    > 作者 Graham Morrison


    https://lipace.github.io/docs/guider.html


    Guider 是一款监控工具，从简单的进程监控扩展到线程和分析。


    ![](img/ef948bfad2ff49ba16960a53d116bb79_11_0.png)


    ![](img/ef948bfad2ff49ba16960a53d116bb79_11_1.png)


    # 持续运行


    # 酷炫 Linux 技巧 – 2025 版


    12


    # 你把磁盘挂载到哪里了？


    如果你喜欢通过添加硬盘而不是更换旧硬盘来延长电脑的寿命，你可能会很快忘记分区类型或数据的类型。一些基础工具可以帮助你获取概览。


    `lsblk`（列出块设备）工具显示所有块设备。`lsblk` 的默认视图仅包含当前文件系统中的设备或分区。然而，如果你不知道在挂载分区时设置了哪些设备，该命令会显示这些细节。它的输出非常详尽，通常包含许多由内核和系统程序管理的设备。但在许多情况下，这些细节并不是独立的——物理存储设备和分区属于同一个整体。


    使用一个开关（switch），你会找到挂载点（即设备挂载到目录树中的位置）。


    `lsblk` 的输出为你提供了从此列表中可以获得的信息概览。


    `lsblk` 通过包含未使用的设备来显示更多设备。例如，它会显示一系列设备（不映射到物理设备但使用文件作为底层存储的虚拟块设备），如从 /dev/loop
    到 /dev/loop。


    ![](img/ef948bfad2ff49ba16960a53d116bb79_12_0.png)


    由于 Linux 分区大部分使用“扩展”文件系统（通常是 ext4）或 Btrfs，`mount` 的输出非常准确。然而，与 `lsblk` 不同，`mount`
    提供了 `-t`（用于 --type），可以让你显示特定类型的所有分区。因此，使用 `mount -t ext4 或 fs` 来列出 ext4 和 Btrfs
    文件系统。如果你搜索 NTFS 文件系统，记住它们也被支持，但不会像 `ntfs` 那样显示。


    `-s` 开关告诉你存在哪些分区以及它们挂载在哪些挂载点上。


    | 表格 1: lsblk |

    | NAME | 设备名称 |

    | --- | --- |

    | MAJ:MIN | 设备的主从号 |

    | RM | 0 固定设备和1 可拆卸设备（CD/DVD 驱动器） |

    | SIZE | 设备可读形式的存储容量 |

    | TYPE | 设备类型（见表 2） |

    | MOUNTPOINT | 设备挂载的目录 |


    | 表格 2: lsblk |

    | NAME | 设备 |

    | --- | --- |

    | loop | 回环设备 |

    | lvm | 逻辑卷管理 |

    | part | 分区 |

    | rom | CD/DVD 驱动器 |


    ![](img/ef948bfad2ff49ba16960a53d116bb79_12_1.png)


    '
