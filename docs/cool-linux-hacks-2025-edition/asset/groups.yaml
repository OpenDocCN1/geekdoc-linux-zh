    ## VIRTUALIZATION AND EMULATION


    ### Run DOS Programs in DOSBox-X


    If you want to run DOS programs, you can set up a virtual machine in VirtualBox,
    VMware, Qemu, or even on a Proxmox server. But a DOS VM will not integrate nicely
    with the host system: no doubt for MS-DOS.


    A better option is using DOSBox (1) or DOSBox-X (2), which is a feature-enhanced
    fork. Both are available for Linux and other operating systems, Windows and macOS.
    The focus of projects is getting old games to run on modern computers. One of
    their features is precise control over the clock speed: if a game runs too fast,
    you can slow it down.


    The development of original DOSBox stopped but DOSBox-X project is still active:
    The current release is from May 2023. Ubuntu 22.04 has programs in its default
    repositories, so you can install it via one of the following commands:


    ```

    sudo apt install dosbox

    sudo apt install dosbox-x

    ```


    Typically DOSBox is the better choice. If you cannot find a package for your distribution,
    the Flatpak version (with all Flatpak packages) you need to use


    ```

    flatpak run com.dosbox.dosbox_x arguments

    ```


    instead of using command-line arguments,


    ### Built-in DOS


    DOSBox-X does not emulate PC hardware from the DOS age, it also includes its own
    Windows 5.0. By a program claims that you need an older or newer version, you
    can change the version by set command, example:


    ```

    ver set 62

    ```


    will set the reported DOS version to 6.22. With this change you can run the original
    COMMAND.COM shell.

