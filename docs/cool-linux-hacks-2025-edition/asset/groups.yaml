    # HACK 103


    # Mount ISO Images with a Mouse Click


    In the past, we used to download ISO images and burn them to a CD-ROM or DVD-ROM.
    While that''s still possible today, a more typical use is to write them to a USB
    stick and boot from that.


    If you work with KDE on openSUSE, you can install the state-disk-imagesounter
    package which contains basically the same tool, and after manually adding it as
    the default app for *.iso in Dolphin, it works just like Gnome.


    Also, Linux lets you access on ISO images by simply mounting them to folder. Traditionally
    you would type a command such as


    ```

    sudo mount -o loop,ro=some.image /mnt/

    ```


    Ubuntu''s Gnome is preconfigured to mount an ISO image by double-clicking.


    In a terminal window, but modern Linux distributions let you with this same image.
    In the Gnome file manager you simply double-click an ISO image, to a small tool
    called mount - or the command line you can also run this manually through a file
    chooser and picks an ISO image to mount. Gnome and the image manager has either
    a .iso or a .image file, to store an ISO as some_name.image, you can right-click
    it, select Open With, and pick Disk Image Manager.


    By Hans-Geer Eeger


    ![](img/ef948bfad2ff49ba16960a53d116bb79_85_0.png)


    # Get Information About ISO Images


    Mounting an ISO is enough, but sometimes that''s not necessary when you really
    want to look at the ISO image metadata: what is it, who made it, and what are
    the properties? You can use isoinfo to query information.


    you add more options for specific information, for example, -d displays the ISO
    image''s metadata, and -i will show a complete file list with attributes. Linux
    images will show all extensions (allowing for file names with lower/uppercase
    characters and Unix file attributes including owner, group, and access permissions),
    or -r to see more details.


    The command-line tool has a list of options. Option -i is what you use to select
    the image.


    For automation it is better to produce an output of what you want to generate.
    The -f option shows all files with their path. And you can quickly search for
    specific files in a given name. You need to find a file named make_4.3.1.build1_amd64.deb
    and then know it is in one of your Ubuntu images. You can search all images using
    the following command:


    With -i you can extract information from ISO images without mounting them.


    ```

    isoinfo -f some_image.iso -i 2>/dev/null | grep "make_4.3.1.build1_amd64.deb";

    ```


    It displays the ISO file name and if it contains the - path to the file that is
    inside.


    ![](img/ef948bfad2ff49ba16960a53d116bb79_85_1.png)


    By Hans-Geer Eeger


