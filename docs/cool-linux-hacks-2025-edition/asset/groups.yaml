    \ 52 | Daphile 音频服务器 | 46 |\n\n## Firefly 合成器：多音声音生成\n\nFirefly Synth 从一个软件合成器开始。尽管名字如此，但它并没有模拟昆虫的声音。相反，它能够产生一系列完全复杂的声音，从优美的扫过的弦乐和贝斯旋律到打击乐和鼓膜相位。它通过一个与其他任何软件合成器不同的用户界面实现这一切，该界面具有拟物设计（skeuomorphism），可以实用且快速地访问其数十种功能。唯一的缺点是功能太多了，很难将它们全部挤进界面，使其看起来比实际功能更复杂。\n\
    \n坦率地说，声音来自五个振荡器之一。更保守的合成器（如 Mini Moog）提供三个，有时是三个，但这里很少有合成器共享具有相同的功能，而这些功能对于每个振荡器来说可能是独特的。开始时，每个振荡器提供一组用于生成声音的映射。除了锯齿波、三角波和方波外，还有波形的数字失真模式，以及针对拨弦声音的\
    \ Karplus 风格建模。这些可以在所有五个振荡器之间进行组合或孤立。正如重复条目一样，有一个小表格来表示每个振荡器并带有常用设置。这种方法被复制到合成器的其他部分。例如，每个声部都有示例，其中包含状态变量滤波器和单个声部滤波器。\n\
    \nFirefly 还自称为为一种“半模块化”合成器。在物理世界中，半模块化合成器是一种无需任何配置即可产生声音的合成器，但也可以电缆进行连接，重新路由控制信号和音频信号以创建模块化流。Firefly\
    \ 没有调制矩阵，但你可以将合成器一个部分的输出连接到另一部分的输入。例如，你可以使用一个振荡器来调制另一个振荡器的频率（FM）或幅度（AM），使用合成器创建声音。每种调制都有单独的\
    \ AM 和 FM 滤波器，带有 UI 中心部分的控制用于生成波形。\n\nhttps://github.com/sjoerdvanree/firefly-synth\n\
    \nGraham Morrison 著\n\n\n\n- **1. 主控 (Master):** Firefly 将同步到你的 DAW，并接受音频输入进行处理和效果。\n\
    - **2. 振荡器：** Firefly 由五个完全可编程的振荡器滤波器组成。\n- **3. 滤波器：** 就像开发者的功能一样，这些是特性的重要部分。\n\
    - **4. 包络：** 有 10 个这种奇妙复杂的调制源。\n- **5. 反馈：** 它们都显示每个振荡器在重新处理之前的第一个周期的形状。\n- **6.\
    \ 波形：** 从其他模块查看任何模块的输入形状，可以是音频或控制信号。\n- **7. 调制：** 控制调制的深度。\n- **8. 最终波形：** 查看你的振荡器的输出。\n\
    \n![](img/ef948bfad2ff49ba16960a53d116bb79_34_0.png)\n\nCOOL LIN HACKS - 2025\
