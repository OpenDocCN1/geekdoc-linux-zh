    after the ssh connection is established. It also verifies connections between
    client and server. The following commands are all you need to set up the tunnel:


    # Congestion Alert


    Whereas other VPN techniques work at packet level and rely on TUN/TAP devices,
    shuttle works at user level. It handles the TCP stream locally, multiplexes over
    the SSH connection, which keeps the status, and it puts packets along the destination
    side.


