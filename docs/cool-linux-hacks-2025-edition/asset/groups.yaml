    # termdbs: 数据库编辑器


    ## 文件格式


    对于我们这些只是涉猎数据库的人来说，它们可能令我们深感畏畏。我们并不是害怕它们的 SQL 界面（特别是这个）或它们的配置；通常是因为数据库操作始终是高风险的。当你从不在同一个数据库中执行查询时，非常很容易因为一个字符或一次误解的转而导致灾难性的错误。当你正在运行数据库，且输出管理是你日常工作中的众多任务之一时，提高水平的方法总是可能的。


    在这些情况下，某种图形界面可以有所帮助。它们通常设计用于引导你完成一系列特定的最佳实践步骤，并配备操作和质量验证。但最重要的是，你不需要记忆特定命令的语法并担心自己的错误。图形界面应该在后台为你完成这些工作。


    从命令行访问 SQLite 和 CSV 格式的数据库，甚至可以在它们之间查询数据。


    对于像我们这一代 PHP 和 MySQL 用户来说，这就是 phpMyAdmin 如此流行的原因。phpMyAdmin 帮助你可视化 MySQL 表格和查询结果，为你提供帮助并检查你的输入。Termdb
    完成了同样的事情，但不需要 PHP。它是一个用于 SQLite 和 CSV 格式数据库的简单工具（支持 MySQL 服务器），非常适合你可能在家庭自动化系统中运行的那些本地服务器。在无需了解任何行或列数量的情况下，通过对
    SQLite 支持执行搜索并更新数据库中的任何数据。一切都是交互式的，这意味着当你导航或搜索时，用户界面会更新以显示你搜索的当前状态。它具有类 Vim 的编辑控制方式，甚至支持这些操作，而且更好。


