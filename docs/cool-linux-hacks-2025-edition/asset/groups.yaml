    # What File Format Is That?\n\nFile managers like Dolphin and Nautilus look at\
    \ what kind of file extension they're dealing with and, more importantly, which\
    \ application to pick for it. But there's a different way to find a file's type,\
    \ and it is actual magic. Not the magic of witches and wizards, but the magic\
    \ of a \"magic file\". The command line uses a set of recipes (which are stored\
    \ in /etc - the magic file) to check specific bytes in a file and recognize the\
    \ file type with high probability.\n\nA very simple example, the first six bytes\
    \ of a PNG image file are always '89 P N G\r\n'\n\n```\n$ hexxd -c 8 package.png\n\
