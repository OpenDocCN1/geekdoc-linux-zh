    # diceware: 口令生成器


    大多数 Linux 用户都熟悉那张幽默的漫画，它展示了一个人试图生成一个“良好”的密码短语，如下所示：


    b408\. 虽然你不会在字典中找到它，但这个密码短包含包含 28 位的熵，可能只需要几分钟就能破解。


    密码短语也以难以记忆而闻名。另一方面，如果有人使用四个随机字典单词（例如 "correct horse battery"），这提供了大约 40 位的熵，而且更容易记忆。Diceware
    方法正是基于此。在它的原始实现中，它涉及从一个列表中投掷六面骰子。没过多久，各种版本就相继出现，每隔几个月就会出一个新版本。


    这样的口令由六个单词组成，全字母大写且没有空格。为了提高安全性，请使用 "-d " 来分隔它们，例如破折号。


    每个单词增加 12 位的熵。每个版本的 Diceware 都支持不同的字典，包括电子前线基金会（EFF），它没有任何攻击性或有问题的单词。作为一名英国人，我更喜欢
    Beale 字典，因为它包含的单词较少，而且这些单词经常被别人拼错。


    记住 diceware 短语最简单的方法是想象一个熟悉的地方（比如你的中学），然后在每个房间里放置物体。例如，如果第一个单词是 "hello"，你可以想象有人在正门大声打鼾噜。如果下一个单词是
    "hello"，你可以想象有一座山从你的中学移动出来，以此此类推。


