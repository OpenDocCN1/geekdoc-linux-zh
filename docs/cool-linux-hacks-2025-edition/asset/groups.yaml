    Then open the source file in an editor that does syntax highlighting for BASIC
    - in my tests, source files found in KDE''s editor. You would have to remove the
    first and last line. Later, just modify the modified file in the BASIC interpreter
    you use with every other basic.


    # Learning BASIC


    If you want to learn about BBC BASIC, you can start with the beginner''s tutorial
    for BBC BASIC for Windows [IV] and inspect some of the programs that are part
    of it. These programs are not basic, but in many cases function variables are
    name-selective so you can learn how to work around program hacks.


    ![](img/ef948bfad2ff49ba16960a53d116bb79_57_1.png)


    The Internet Archive has a huge collection of books and archives about BBC BASIC
    [V]; you can browse through the collections, then digitally "borrow" them, which
    are free to download and keep as PDFs. Running a Google search for "BBC BASIC
    pdf" will also give you some good results.


    can go 6010 lines and functions. Note that even versions of BBC BASIC expect all
    words in all-caps. You can download BBC BASIC for SDL from the BBC website as
    a zip archive [VI] you can unpack and launch the bbcsdl program in the top directory.
    Of other editors you can also get a 32 bit version, the ZIP file is called bbc3.zip.


    When starting up you''ll need to decide what editor to use. I recommend the simple,
    console editor, Richard''s SDLLIDE, which has one that looks a bit better (though
    it has some features, not useful, such as showing a list of all used functions).


    Typing the programs in line can transport you back to the past, but as you''re
    getting close to the last line you will find within your programs.


    A last hint: in any of the BASIC interpreters I''ve left covered in this article,
    type QUIT to leave the closing window.


