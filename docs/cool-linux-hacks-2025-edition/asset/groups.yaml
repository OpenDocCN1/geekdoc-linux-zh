- md: "\n# Save Your SSH sessions with screen\n\nDoes the following pattern seem familiar?\
    \ You log in to a remote computer via SSH, modify a text file in an editor like\
    \ Vim, and then walk away to do something else. When your SSH connection goes\
    \ down, you log in again, the file once more, Vim complains that you're already\
    \ editing it.\n\nThis happens to me quite often though I know how to fix the problem:\
    \ After you connect to the remote system, run screen which will create a new terminal\
    \ that can save your session. (If you haven't installed it, use the package manager\
    \ to get it.)\n\n1. Open two terminal windows and ssh into the remote machine\
    \ on both of them.\n2. In one window, type tty to see the terminal device. Type\
    \ screen, and then press Enter to enter the screen.\n3. You're now in a free terminal\
    \ (type tty to see the change) that was created by screen. Here, open a file in\
    \ an editor, for example: vi ~/.bashrc (if it exists on the remote machine). Move\
    \ to the end of the file and add lines without leaving.\n4. Kill the session by\
    \ closing the window. In the main window, type screen -RR. You will be reconnected\
    \ to the terminal that was created by screen, so you will get back to the editor.\
    \ In screen language, you have just \"reattach\" the terminal. Under type tty\
    \ to see that this is really the same terminal.\n\nThe terminal session will stay\
    \ active until the remote machine powers down -- until you exit it. When you're\
    \ in a session, just hit Ctrl-D to detach the shell\n\nYou may also ask to \"\
    detach\" from your current session. Press Ctrl-A, D, and get a message similar\
    \ to\n\n```\n[from $2489.pts/0]\n```\n\nYou are back in the shell you originally\
    \ started. Run the screen -RR to reattach to session.\n\nIf you have multiple\
    \ servers that you only use SSH, you can make them automatically launch screen\
    \ -- just add the following line at the end of ~/.bashrc (or what other startup\
    \ file you use):\n\n![](img/ef948bfad2ff49ba16960a53d116bb79_91_0.png)\n\n```\n\
    if [ -z \"$TTY\" ]; then screen -RR; fi\n```\n\nThis will automatically reattach\
    \ a detached session (or start new if there is none). The variable check prevents\
    \ screen sessions.\n\n# More Features\n\nscreen has many more features beyond\
    \ saving your SSH connections. It is a terminal multiplexer: Hit Ctrl-A, Shift-S\
    \ to split the terminal. The window will be split into two equally large windows,\
    \ with the one active. Press Ctrl-A, T to move the focus to the new area, then\
    \ Ctrl-A, C to switch between them. You now have two terminals inside the same\
    \ session.\n\nIn a similar way, you can pick the current view: Hit Ctrl-A, / (pipe\
    \ symbol) to achieve that. You can get out of all these views by pressing Ctrl-W.\
    \ Your layout will be lost when you detach (unless you choose - then you only\
    \ see the one session in full-screen mode (inside the terminal). To access the\
    \ invisible sessions, press Ctrl-A, , which will bring a list of terminals from\
    \ which you can select one with the keys and hit Enter.\n\nThere are many options\
    \ that you can change by editing your .screenrc config file. For example, what\
    \ might be bothered by screen usage of the Ctrl-A shortcut for jumping to the\
    \ different session. (Press Ctrl-A, A to do that in a session). To change it to\
    \ something else, just add\n\n```\nescape ^B\n```\n\nto that file, also with\n\
    \n```\nlayout default\n```\n\nwill save the layout of split windows when you detach\
    \ a session.\n\n# Alternatives\n\nA pretty tool, screen has been around since\
    \ 1987! A modern alternative is tmux. You can use it for identifying SSH sessions:\
    \ installation, run tmux. You'll see it's better because it displays a status\
    \ line in the last of the terminal. Detach the session with Ctrl-B, D (tmux uses\
    \ Ctrl-B instead of Ctrl-A) to close the window. Then reattach the session with\
    \ tmux. There are more multiplexers, but most do not offer the reattach feature.\n\
    \n> By Hans-Georg Eller\n\n[1] https://www.gnu.org/software/screen/\n[2] https://github.com/tmux/wiki\n\
    \n# ssc: Script Compiler\n\nThe Simple Script Compiler (ssc) converts scripts\
    \ to a binary format. You will need to build the tool yourself from the source\
    \ code.\n\nTo convert a script to a binary, pass the name of the script to ssc,\
    \ along with the name of the future binary, and ssc converts the code into an\
    \ ELF file. Among others, ssc supports Bash, Perl, Python, Node.js, Lua, and Ruby.\
    \ By default, the program uses libraries for dynamic linking; use --static to\
    \ create a static binary, although this will be the size of the resulting file.\
    \ The -e option allows ssc to integrate a predefined interpreter into the binary.\
    \ From analyzing the script, you can adding debugging which checks at start whether\
    \ a debugger is active and needs it.\n\nWhile ssc cannot compile scripts with\
    \ a size greater than 8MB, it can at least hide them from prying eyes by encrypting\
    \ the code with RSA. To decrypt, use the -o option when calling. Online help is\
    \ by typing -h; the GitHub page provides further descriptions and examples.\n\n\
    > By Uwe Vollibricht\n\n```\nhttps://github.com/libersec\n```\n\nManage the process\
    \ with ssc's options.\n\n```\nTerminal: uvollibricht@machine: ~$\nssc -h\nUsage:\
    \ ssc [options] <script> <output>\nOptions:\n  -e <interpreter>  Integrate a predefined\
    \ interpreter into the binary\n  -static           Create a static binary\n  -o\
    \ <output>       Decrypt the binary file\n  -h                Show help\nSupported\
    \ languages: Bash, Perl, Python, Node.js, Lua, Ruby\n```\n\n# envio: Environment\
    \ Manager\n\nEnvironment variables are an essential part of command-line experience.\
    \ They are inconvenient when you manage them manually, but it becomes a problem\
    \ when you share your account across multiple computers. Frankly, envio solves\
    \ the problems by improving environment variable management in 21st century.\n\
    \nEnvio is a command-line tool with two main features. It stores environment variables\
    \ within profiles. A profile is a set of environment variables you might use for\
