    # Quick Dirty HTTP/FTP Server Setup


    When you have multiple computers in your local network, you''ll often want to
    do a quick transfer of or more files between them. Of course, there are many "proper"
    stories that involve


    +   - Running a dedicated NFS or Samba (CIFS) server in VM

    - Configuring OpenSSH, creating SSH keys, and changing public keys between all
    machines

    - Copying files to an external drive and disk to keep that or some other method.


    I personally prefer using OpenSSH for all transfers, which is not always possible:
    Sometimes there is no SSH server available, or an ungradable machine does not
    support a sufficiently SSH protocol version or any of the other side support.


    If you want to implement a quick and dirty solution, running an HTTP or FTP server.


    # Simple HTTP Servers


    Installing and configuring a regular server (e.g., Apache or FTP server) will
    take some time and is not an option for quick access to files in a directory.
    When you''re not concerned with creating a real web page but Webor [1] is the
    ideal solution: a simple web server that runs with a one-liner (after installing
    it, of course).


    On Debian or Ubuntu,


    ```

    sudo apt install webor

    ```


    to get the software. Then simply type


    ```

    webor -b

    ```


    -b sets the base directory that Webor will use. By default, this will open on
    port 8080 so that you can access the contents at http://ip:8080 via any browser.


    Webor is not available for OPENSE and other RPM-based systems, but if you have
    a Docker installation, you can simply run it in a container:


    ```

    docker run -it --rm -p 8080:8080 -v /:/web debian sh -c ''apt update; apt install
    webor -v webor /web''

    ```


    Webor serves you the contents of a directory.


    ![](img/ef948bfad2ff49ba16960a53d116bb79_70_0.png)


    That works just as well, and you can even run that on a Mac or Windows machine.


    If you have BusyBox (2), you can run its built-in HTTP server:


    ```

    busybox httpd -f -p 8880

    ```


    It will open on 8880, accept HTTP requests and serve files from the directory
    where you''ve started. By default, it will not list the contents of a directory,
    so you either to provide a full URL to the client or add some CGI script that
    handles the directory listing.


    Yet if you use Python''s HTTP will also serve the directory and list its files;
    the default port is 8000 when you run it


    ```

    python3 -m http.server

    ```


    # File Transfer Protocol


    Every machine has a browser or an HTTP-compatible tool such as wget or curl! If
    you have an FTP client, you can set up an FTP server on the other machine. Don''t
    waste your time with configuring one of the classic servers. Instead, follow the
    simple option that is similar to the HTTP server by running


    ```

    sudo apt install python3-pyftpd

    ```


    on Ubuntu (or Debian [3]) to install the module, then change to the directory
    to make it available, and run


    ```

    python3 -m pyftpd

    ```


    This will start an FTP server on port 2121. You can run it with the anonymous
    username and an arbitrary (or empty) string as the password.


    With these options you are able to share your files.


    By Hans-Georg Eßer


    > [1] [codes.eger/itgtrow/webor/


    > [2] https://www.busybox.net/


    ![](img/ef948bfad2ff49ba16960a53d116bb79_70_1.png)'
