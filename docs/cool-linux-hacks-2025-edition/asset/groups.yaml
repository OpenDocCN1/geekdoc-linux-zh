    ## Atuin: Shell 历史数据库


    人们在命令行中最初发现并随后依赖的功能之一，就是按下方向键向上来获取上一条命令。这在学习时非常有帮助，因为这意味着当你出错时，不需要重新输入相同的命令。当你无法记得在程序中需要修改的确切命令时，或者你想查看实现复杂输出时使用的确切命令序列时，这也极其方便。所有这一切通过向上方向键都可以实现，你很快就会学会使用
    `Ctrl-R` 交互式搜索 shell 历史，并提供访问它的命令。它还有改进空间，这正是 Atuin 带来的一些潜在改进，它让你的 shell 历史变得更加强大。


    Bash、Zsh 和 Shell 保存历史的方式与 Atuin 工作方式的区别在于，Atuin 将你的历史保存在 SQLite 数据库中，而不是文本文件。这带来了各种优势，如果你想跨每个会话或多个期间保留历史，它要强大得多。Atuin
    将你的功能替换为一个搜索框，你可以在其中开始新的搜索查询。从历史中搜索命令既快速又无缝。历史包含了你运行的命令以及执行所需的时间。最重要的是，你可以选择通过端到端加密将历史同步到在线以及你的项目服务器。这需要一个账户，以及一些信任，但自托管服务器也是可以的。你可以在多个设备上拥有命令历史，这也许是使用
    Atuin 时对历史功能最大的改进。


    作者：Graham Morrison


    ## codespelunker:


    ### 命令行搜索


    模糊查找器（fuzzy finder）帮助改变我们从命令行搜索东西的方式。特别是当你无法确切记得在找什么，或者只记得某个特定路径时，它大有帮助。它本身运行良好，但当你将其集成到你的
    shell 中进行文件和历史搜索，或者集成到 Vim 或 Emacs 等编辑器中时，效果会好得多。从命令行使用它像安装一样简单是另一种替代方案，并且更适合在无需滚动查看的情况下寻找东西。这个小组是因为它就像在你的终端里拥有了一个
    Google。


    Codespelunker 搜索你当前目录和所有系统位置的内容。它最好与搜索框或 `anyway` 配合使用。它比索引快得多，速度极其惊人。TUI 命令行用户界面也使其易于使用。使用它就像使用
    `fzf` 处理文档内容一样。搜索词将开始显示结果以及你在搜索位置列出的内容。与其输入命令，你可以将查询作为参数处理，非交互式输出将列出结果并高亮搜索词。它有精确搜索、模糊搜索和否定搜索的选项。你可以使用正则表达式，并且还有用于包含和排除目录的参数。它很快，而且比
    `cat | grep | fzf .` 更容易使用。


    作者：Graham Morrison


    https://github.com/boycter/cs


    Atuin 将你的历史存储在服务器上，因此你可以从任何设备访问命令。


