    ## HACK 29 Strip Metadata from Your Files


    When you share a file on social media or send it to a group of people, you may
    not be aware that all kinds of metadata can be embedded. Pictures store and where
    they were taken (Figure 1) and what camera and settings were used. PDF and office
    files offer creation and modification dates of authors and editors. There are
    many ways to edit this metadata manually. In LibreOffice you can edit the file
    properties and remove the metadata, and the command-line tool exiftool lets you
    remove metadata from photographs.


    selecting the **Remove metadata** entry. That creates a copied document, cleaned,
    .pdf (when the original is a document). Figure 2 shows how to run mat2 from Gnome''s
    file manager. In the terminal window, you will see the effect of stripping metadata
    from Word and PDF files.


    If you use Ubuntu or other Debian-based distribution, you can `sudo apt install
    mat2`. I''ve also tried an OPENSUSE package (python3-mat2) which works anonymously,
    but produced a number of errors, and managed to work with the files in the project''s
    Git repository instead.


    ## Alternative


    If you cannot install mat2 on your system or it''s not working, there is an alternative
    tool named Metadata Cleaner 3 that uses the same library as mat2 and is available
    as a Flatpak package. To try out, install Flatpak on your Linux system (if it
