  - '[PAGE 56]


    # Bring Back the Commodore Amiga


    The Commodore Amiga models [1] were highly popular computers during the 1980s
    and 1990s. A500, A600, and A1200 had the motherboard and a floppy drive into the
    keyboard case, just like the earlier generation of computers, such as the Commodore
    C64 or Sinclair ZX Spectrum.


    Working Amiga computers are hard to come, which is why the availability of good
    emulators is so important. In the Linux world, Amberry [2] is currently the best
    choice; it is born from WinUAE [3], an Amiga emulator for Windows.


    You will need an operating system Kickstart: That''s a part of the Amiga (Amiga
    OS), and it is available from Quanto [4] for EUR40. If you have a real Amiga there
    are also ways to read the Kickstart ROM. Add that ROM (kick3a128.rom or kick3s-31-a128.rom)
    and probably also a copy key (kick.keyl) so that you can boot it.


    Amiga is a collection of more than 4,000 games and apps that have been developed
    by many different developers. Early versions were only available for Raspberry
    Pi computers (hence the name: Amiga PiFx), which runs on 4 PCs. The PC needs a
    UEFI BIOS because it will have to boot from a FAT-partitioned disk.


    You can download a PC-version (Version 1.7, INTEL; 25GB) before installing, 58GB
    that you need to write onto a USB stick and use that to boot Amiga, or a larger-partition
    version that can boot both on a PC and on the Raspberry Pi (PiAm72: 35GB/96GB
    (unpacked)).


    The huge files are available only those that you can find in the description of
    Chris Edwards'' announcement video (5). Unpack the archive and write the image
    to a 128GB USB stick - in tests the 58GB version did not fit, but the one with
    the USB stick worked. Under normal circumstances 64GB should be large enough.


    Once you''ve written the image, remember and re-insert the stick and search for
    a small, FAT-128MB partition (called /dev/sda1 if it exists) and copy the Kickstart
    ROM from it. Copy the key file if it exists. Then, rename the ROM to kick.rom
    or Amigarom so it will not find it. When you''re done, reboot the machine or boot
    from the stick on another computer. It doesn''t need a lot of resources.


    # It''s an Amiga


    If you''re new to the world of the Workbench - explore the Amiga universe by clicking
    or double-clicking anything that looks interesting. Here are the first steps:


    +   1. Try the Amiga and iDemo in the icons. This is how you find the 5,000 games
    and demo. A double-click will launch any of the entries, and inside the game or
    demo you can press F10 to kill the app and get to the desktop.


