    The tone of the reporting has ranged from "benefactor of mankind" to "threat to
    humanity." To keep the ball rolling, I have created Shell Genie, a new tool, which
    uses AI to try and make shell life a bit easier for us.


    The Shell Genie command-line tool answers your queries with commands that can
    be executed immediately. You can use two models with Shell Genie: GPT-3.5 or Free
    Genie. GPT-3.5 is the current version of ChatGPT by OpenAI. You will need an API
