    # 教育


    ## multiElement: 化学2D 结构编辑器


    《绝命绝风律师》（Better Call Saul）的粉丝可能还记得第四季的一集，大家最喜欢的邻居盖尔·辛格（Gale Singer）为汤姆·利希的歌曲《元素》演唱。这是一首朗朗口的歌曲，Lehrer
    将元素名称改编到了《大将歌》的旋律中。在事物的本质上，某种周期表的呈现是 Serhii Reduchnyi 开发的这个实用工具的主题。目前，它仅在 Flathub
    上可用。


