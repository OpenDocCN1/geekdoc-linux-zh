    # Lootcode: Coding Game


    I have always had a soft space in my heart for those who try to make learning
    fun, because frankly, it often isn''t. This is especially true for those trying
    to learn Data Structures and Algorithms (DSA). University of Central Florida (UCF)
    computer student Dylan Vidal and Luke have proven themselves to this task through
    Lootcode. In describing it, I can do no better than the project''s own GitHub
    page: "A fantasy themed, gamified problem practice platform to help you ace the
    interview."


    Game progression is non-sequential. This allows players to learn about data structures
    in any order they want.


    Although the source is available on GitHub, the exercises posed in the game are
    progressively more difficult, so players (who are willing) are encouraged to access
    Lootcode via the main site, which requires you to sign in with their Discord,
    GitHub, or Google credentials. Upon doing so you enter the world of Albion where
    navigate a series of DSA problems in a fantasy setting.


    ![](img/ef948bfad2ff49ba16960a53d116bb79_63_0.png)


