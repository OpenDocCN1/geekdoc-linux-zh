    ## sbct: Secure Boot Manager


    Unless you''re a security expert, you can do more harm when trying to administer
    encryption and security yourself. This isn''t usually a problem if you can pay
    an expert, but we don''t have that luxury on our systems. This is why it can be
    helpful when distributions set up encryption automatically or help secure our
    ours and drives without requiring our inputs.


    The same isn''t true of Secure Boot, the boot-loader that guarantees the integrity
    of your installation within a Trusted Platform Module (TPM). Like many other security
    systems, Secure Boot''s management from a user''s perspective is best described
    as opaque.


    The problem is accessing whatever Secure Boot functionality your system supports
    is typically dependent on our manufacturer and the features they include in the
    BIOS or UEFI options. This makes it difficult to document and maintain, but it
    also makes a project that you want to secure a little easier. This is what sbct,
    Secure Boot Manager, has been developed for: a command-line tool that allows you
    to access and configure your Secure Boot configuration from your user environment.


    This usually starts with the configuration and enrollment which are then loaded
    into your EFI-based Secure Boot configuration on reboot. The sbct command enables
    this easily and can then be used to check the status of your configuration, as
    well as sign files with the keys you have registered in Secure Boot configuration
    and generate EFI stub. This is the signed bundle of kernel and boot utilities
    needed to start your system, and sbct can verify their validity.


    Use sbct to create a Secure Boot configuration for your system and give you confidence
    in its integrity.


