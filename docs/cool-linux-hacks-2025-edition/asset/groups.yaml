    ## Use Docker Tools as Filters


    The Unix philosophy – that Linux adheres to – is to use a lot of simple tools
    and combine them in clever and creative ways to solve problems. Traditionally,
    such a problem is a task in which one or more files needs to be analyzed and transformed
    into a set of outputs.


    In many cases, you will readily assemble a solution by picking a set of command
    line tools adhering them in a way that the first tool''s output will be used as
    input for the second tool, the second tool''s output for the third, and so on.
    That''s "building a pipeline," and here''s an example:


    ```bash

    grep /var/log/syslog | tail -n 0 | sed -e ''s/\[[:digit:]]*@hostname=/hostname/g''
    | less

    ```


    This command line uses four tools (grep, tail, sed, and less) all at once, connecting
    each tool''s output with the following tool''s input.


    - 1. The grep searches for all lines in the log file/var/log/syslog that contain
    the system name. It outputs those lines it skips the others.

    - 2. This output gets piped into a tail process which removes all the last 100
    lines.

    - 3. Next, sed performs the find-and-replace operations on the output of tail,
    in an attempt to modify the log entries: The real hostname and the username are
    replaced with generic names. This does not filter out any lines from the process;
    it looks at every line and potentially alters them.

    - 4. Finally, the output is piped into less, which is a pager program that lets
    you look at the information. In less, you can scroll up or down the lines, and
    you can search.


    repositories of Debian and Ubuntu systems. Instead of a pipeline such as


    ```bash

    column -t -s | txt2html --make_tools > passwd.html

    ```


    (that will fail when txt2html is missing), the slightly longer command which uses
    a fresh container


    ```bash

    column -t -s | docker run -i --rm txt2html --make_tools > passwd.html

    ```


    This assumes that you will create a Docker image named tools with the command
    `docker build -t tools .` in a folder that contains the Dockerfile. Running docker
    starts a container instance inside and runs the txt2html command inside – but
    the important part is the -i option which forwards your local standard input to
    the Docker container and lets the reader convert the output of the previous command
    in the pipeline.


    If you need the tool all the time, it won''t make sense to start a fresh container
    and remove it for every invocation of the tool. Instead, start it in detached
    mode (the background):


    ```bash

    docker run -it --name r_tools tools

    ```


    and use `docker exec` the command in the pipeline (instead of run):


    ```bash

    column -t -s | docker exec -i r_tools tools --make_tools > passwd.html

    ```


    The name with the --name option must match the name you use with the exec command.


    By Hans-Ge Eser


    https://metcanpac.org/dist/txt2html/view/scripts/txt2html


    ## Enter Docker


    So are Docker containers relevant in this setup? To successfully run a command
    pipeline, all components of the pipeline have to be installed. If this is obvious,
    you will inevitably find that a required tool needs to be installed on your machine.


    For example, the filter tool txt2html might not be available as an installable
    package for your desktop, but you can find it in the repositories of Debian and
    Ubuntu systems.


    | Listing 1: Dockerfile |

    | :--- |

    | ```docker

    FROM debian

    RUN apt-get update -q

    RUN apt-get -y --force install txt2html

    CMD /bin/bash

    ``` |


    ![](img/ef948bfad2ff49ba16960a53d116bb79_53_0.png)


    ## Run VMs on a Proxmox Server


    You may be used to creating virtual machines (VMs) in VirtualBox or VMware Player.
    Both are desktop clients, which means that you run those virtualization directly
    on the computer that you also use for your normal tasks. This approach works quite
    well, and it is easy to set up the software, but there are alternatives. If you
    want to use the same guest on more than one machine, you will have to install
    everything on each machine. Once you''ve become accustomed to the luxuries of
    VMs that can provide, you may find that you have a lot of them, and copying stuff
    gets tiring. Also, you will need to rethink how VMs must be started (or stopped
    at least).


    Luckily the Linux ecosystem provides alternatives. If you have a spare computer
    (or if you''re willing to get a workstation such as an HP Z440, which is now offered
    by various dealers for about $50) you can turn it into a VM server. One of the
    best open source programs is Proxmox Virtual Environment (VE) [1]. Version 8.4
    was released in April 2025; it is based on Debian/Linux 12.10 and uses the Linux
    kernel. Proxmox VE also supports LX containers (similar to Docker). So depending
    on what you need, you can use either a VM or a container.


    You can get the 1.57GB ISO file from the proxox website, write it to a USB stick
    or drive, and boot from it. The installation process will wipe your disk. Once
    you''ve finished the setup, you can write down the IP address that installs and
    move to any location that can access your local network.


    All configuration will be done remotely, in a web browser. The Proxmox machine
    is a server; so you will not need a monitor or a keyboard.


    For the next steps, you''ll need to dig a little into the terminology so that
    you understand what you''re doing. Read another article or watch NetworkChuck''s
    two-part series about VMs on YouTube [2]. He published these videos in 2021, but
    they are still good to get started. It is not necessary to read the 500-page admin
    guide. Note that every login with the web GUI will have a snag ("You do not have
    a subscription for their service")


    Your day-to-day workflow will be like this: In cases you''ll just use one of the
    VMs or containers and stop them from the web GUI or you keep them active all the
    time. If you find that you solve your problem (or you just want to try something
    new), then install an image directly to the Proxmox server. Create a VM in a few
    clicks, make boot from the image, and go through the usual steps - just like a
    VirtualBox or VMware Player. The screenshot shows the Proxmox GUI and an Ubuntu
    22.04 VM desktop, both displayed. Start and stop much faster, but they limited
    compared to a full VM.


    - [1] Proxmox: https://www.proxmox.com

    - [2] NetworkChuck: https://www.youtube.com/@NetworkChuck


    By Hans-Georg Eser


