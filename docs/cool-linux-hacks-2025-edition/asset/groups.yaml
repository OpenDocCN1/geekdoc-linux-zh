    ## Atuin: Shell History Database


    One of the first things people discover and subsequently depend on the command
    line is pressing cursor up to get the previous commands. This is a huge help when
    you''re learning because it means you don''t have to type the same commands out
    when you make a mistake. It''s also massively convenient when you can''t remember
    the exact command you need to change in a program, or when you want to see the
    exact command sequence you used to achieve a complex output. All of this is possible
    with cursor up, and you soon learn around it with Ctrl-R to search your shell
    history interactively and providing commands for accessing it. There''s also room
    for improvement, and it''s some of the potential improvements that Atuin brings,
    which makes your shell history more powerful.


    The difference between how Bash, Zsh, and Shell save history and how Atuin works
    is that Atuin saves your history in a SQLite database, rather than a text file.
    This brings kinds of advantages and is much more powerful if you want to keep
    your history across every session or two. Atuin replaces your functionality with
    a search box where you start a new search query. Searching commands from your
    history is quick and seamless. The history includes the command you ran and how
    long it took to execute. Most importantly, you can choose to sync your history
    online with end-to-end encryption and on your project''s server. This requires
    an account, and also a little trust, but self-hosting the server is also possible.
    You can have your command history across multiple devices, which is perhaps the
    biggest improvement for history when using Atuin.


    By Graham Morrison


    ## codespelunker:


    ### Command-Line Search


    The fuzzy finder helps change the way of us search for things from the command
    line. In particular, it helps when you can''t remember exactly what it is you''re
    looking for or only remember a certain path. It works well on its own, but it
    works much better when you integrate it into your shell for file and history search,
    or within an editor like Vim or Emacs. Using it from the command line as easily
    as install is another alternative and is better suited to finding things without
    scrolling through them. This group is because it''s like having a Google for your
    terminal.


    Codespelunker searches the contents of your current directory and all system locations.
    It is best to work with search box, or couple with anyway. It is much faster than
    an index and incredibly quick. The TUI-commandline user interface also makes it
    easy to use. Using it is like using fzf for the contents of your documents. A
    search term will start to display results and what''s listed where you''re searching.
    Rather than typing commands, you can process queries as an argument, and the non-interactive
    output will list the results with search terms highlighted. There are options
    for exact search, fuzzy searches, and negated-search. You can use regular expressions,
    and there are further arguments for including and excluding directories. It is
    fast, and is easier to use than cat | grep | fzf .


    By Graham Morrison


    https://github.com/boycter/cs


    Atuin stores your history on a server so you can access your commands from any
    device.


