    # COLLECTORS


    ## Identify Artist and Titles


    Something went wrong when you ripped your collection, and now you''re left with
    unlabeled songs that showed up as Artist - Track 1.mp3. There''s a fix for that!


    You may know apps like Shazam can then identify music and the artist and title,
    but you can do so with your MP3 collection and do it automatically. A convenient
    tool for this is MusicBrainz Picard [1], which is available for Windows. On Ubuntu,
    installing the picard package with APT will get you an entry to the app, and if
    you''ve started your process, you can drag and drop MP3 files to the left hand,
    then select Unclassified Files in list, and click on Scan. The program will then
    generate fingerprints to search for database. In the right hand pane, Picard shows
    the albums where it has found its tracks. Click the triangles to open the albums
    and see the tracks.


    In order to update the metadata of the MP3 files, press Ctrl+A to select all entries,
    and then click on Save. Picard shows that you''re about to overwrite any old metadata,
    and after, clicking on OK, it just does. In my tests, when I gave an album from
    a silly genre, the tool found a few songs correctly identified most others. You
    can influence this by hovering over the options, navigating to Metadata Preferences
    and changing the sliders for Album (increase it) and Compilation (decrease it).
    MusicBrainz Picard lets you generate fingerprints of your MP3 files and search
    for metadata.


    ## Change File Names


    Adding metadata does not change the file name. You can automate the process of
    changing names by using EasyTAG metadata editor (from the music folder with MP3
    files). Rename Files, select all files in middle pane, and then run. In the new
    window, go to file name pattern % - % (for artist and title), then click on Scan.
    Select all files once more and Run from menu to apply the change.


    ![](img/ef948bfad2ff49ba16960a53d116bb79_31_0.png)


    > By Hans-Georg Eeger


    - [1]: https://musicbrainz.org/

    - [2]: https://wiki.getami.org/wiki/EasyTAG


    ## Count Your Coins in Openismat


    The main website describes this as "numismatic collection." Its primary purpose
    is to collect for collectors, it also supports other types of collections such
    as banknotes and stamps. It is currently available for installation via .deb package,
    Snap, and Flatpak.


    On first launch, Openismat automatically creates a database in your home directory.
    After opening the user manual, I discovered that the application is built on PyQt
    with SQLite. It was a little overwhelmed at first, but everything is looking lovely.
    The left-hand side contains a tree that groups coins into categories of country,
    year of issue, coin type, and so. I noted that the status of coins is set to Default
    to avoid confusion with your actual collection. Openismat also displays images
    for the corresponding coin in the right-hand pane.


    https://opennismat.github.io/


    ![](img/ef948bfad2ff49ba16960a53d116bb79_31_1.png)


    Use the tree in the left-hand pane to find specific coins.


