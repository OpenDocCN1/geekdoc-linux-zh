    # Look Inside Package Files


    Classic packages have .deb and .rpm extensions, and they are a rare sight because
    package installation is handled by repository-based tools such as APT and Zipper.
    They eventually download, unpack, and install these files, but you do not touch
    them directly. Except when you find software that is not available through some
    official or other repo, then you may offer direct package contents.


    You can install a Debian package with dpkg -i package or with rpm -i package (if
    you want package manager APT to resolve and dependencies, and in the same way
    you can treat RPM packages with rpm -rp (if you run openSUSE system or RPM-based
    distributions use high-level package tools, for example, Fedora use Yum). But
    if you want to check the contents before installing


    If you haven''t been using the command line manager (less), install and run it.
    With navigation with cursor and Return to be returned you can edit the file with
    Vim or if it does not work - less will quit, 0, Exit. If you want to inspect .deb
    packages on an rpm system, you will need to install some low-level package tool.
    On Ubuntu, Debian, or Mint, install apt-utils.


    Now browse to a package file in .deb and press F3 to get some information or press
    Return to enter the package contents. From there you can extract files by copying
    them to the other side. Note that this feature is better in Ubuntu 24.04; we''re
    waiting for a bug.


    By Hans-Georg Eber


    # What File Format Is That?


    File managers like Dolphin and Nautilus look at what kind of file extension they''re
    dealing with and, more importantly, which application to pick for it. But there''s
    a different way to find a file''s type, and it is actual magic. Not the magic
    of witches and wizards, but the magic of a "magic file". The command line uses
    a set of recipes (which are stored in /etc - the magic file) to check specific
    bytes in a file and recognize the file type with high probability.


    A very simple example, the first six bytes of a PNG image file are always ''89
    P N G''


    ```

    $ hexxd -c 8 package.png

    89 50 4e 47 0d 0a 1a 0a | PNG.. |

    ```


    So, if you have a file with those, it is safe to assume that it is a PNG file.
    The file tests these lists, but it can do more. Many types also know where to
    find metadata. Here''s a typical output of metadata when it runs on a PNG:


    Of course, you can get the same information with Identify from ImageMagick, but
    that only recognizes images. The output of having taken with a smartphone, leaves
    data and shows what was used.


    By Hans-Georg Eber


