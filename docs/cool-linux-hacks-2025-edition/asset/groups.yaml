    ### Faircamp: Music Platform


    We don''t look at static website because there are so many and month will rarely
    go without a new opening. Faircamp is different, and it''s designed to develop
    and deliver the best features of Faircamp. If you''re in music production or enjoy
    listening to independent music, you will have heard of Faircamp. Online music
    distribution enables them to list and sell their music at much lower rates than
    any commercial distributor. It''s a significant following, and many musicians
    use it to fund their projects and build a community. Faircamp has brought a couple
    acquisitions, resulting in uncertainty and layoffs, and in turn has motivated
    the team behind Faircamp to create an open source and self-hosted alternative.
    Best of all, it requires particular skill to deploy and needs only domain and
    hosting service. You then simply copy files it generates over your web. To generate
    you run Faircamp execution within a structured music library, and binary output
    to various formats and templates, which sets up the page for structure and design.
    Metadata and design are added via a file which uses its namesake format and data
    for adding links, colors, and images. Every lower level becomes more interactive,
    and releases in higher directories. After the site has been installed, users can
    either play the embedded audio or download files without making a donation to
    your project, and it works perfectly. Music streaming and load you can copy to
    hosting provider.


    ![](img/ef948bfad2ff49ba16960a53d116bb79_35_1.png)


    By Graham Morrison


    https://faircamp.com/faircamp/


