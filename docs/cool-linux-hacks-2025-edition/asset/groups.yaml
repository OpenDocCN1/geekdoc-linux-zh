    # 快速且粗陋的 HTTP/FTP 服务器设置


    当你的本地网络中有有多台电脑时，你通常想在它们之间快速传输一个或多个文件。当然，这有很多“正规”的方法，涉及：


    - 在虚拟机中运行专用的 NFS 或 Samba (CIFS) 服务器

    - 配置 OpenSSH、创建 SSH 密钥并在所有机器之间交换公密钥

    - 将文件复制到外部驱动器和磁盘，或者使用其他方法。


    我个人倾向于使用 OpenSSH 进行所有传输，但这并不总是可能的：有时没有可用的 SSH 服务器，或者无法升级的机器不支持足够的 SSH 协议版本或任何其他端支持。


    如果你想实现一个快速且粗陋的解决方案，可以运行 HTTP 或 FTP 服务器。


    # 简单的 HTTP 服务器


    安装和配置普通服务器（例如 Apache 或 FTP 服务器）需要花费一些时间，对于快速访问目录中的文件来说并不是一个选择。当你不需要创建一个真实的网页时，Webor
    [1] 是理想的解决方案：一个可以通过单行命令运行（当然，是在安装之后）的简单 Web 服务器。


    在 Debian 或 Ubuntu 上，


    ```

    sudo apt install webor

    ```


    获取软件。然后只需输入


    ```

    webor -b

    ```


    `-b` 设置 Webor 将使用的基准目录。默认情况下，它将在端口 8080 上打开，这样你就可以通过任何浏览器通过 http://ip:8080 访问内容。


    Webor 不适用于 OPENSE 和其他基于 RPM 的系统，但如果你安装了 Docker，可以简单地在容器中运行它：


    ```

    docker run -it --rm -p 8080:8080 -v /:/web debian sh -c ''apt update; apt install
    webor -v webor /web''

    ```


    Webor 为你提供目录的内容。


    ![](img/ef948bfad2ff49ba16960a53d116bb79_70_0.png)


    同样有效，你甚至可以在 Mac 或 Windows 机器上运行它。


    如果你有 BusyBox (2)，可以运行其内置的 HTTP 服务器：


    ```

    busybox httpd -f -p 8880

    ```


    它将在 8880 端口打开，接受 HTTP 请求并从启动所在的目录提供文件。默认情况下，它不会列出目录内容，因此你要为客户端提供完整的 URL，或者添加一些处理目录列表的
    CGI 脚本。


    然而如果你使用 Python，HTTP 也会提供目录并列出其文件；当你运行时，默认端口是 8000


    ```python

    python3 -m http.server

    ```


    # 文件传输协议


    每台机器都有浏览器或兼容 HTTP 的工具（如 wget 或 curl）！如果你有 FTP 客户端，可以在另一台机器上设置 FTP 服务器。不要浪费时间去配置那些经典服务器之一。相反，遵循类似于
    HTTP 服务器的简单选项，通过运行


    ```

    sudo apt install python3-pyftpd

    ```


    在 Ubuntu（或 Debian [3]）上安装该模块，然后切换到该目录使其可用，并运行


    ```

    python3 -m pyftpd

    ```


    这将在端口 2121 上启动一个 FTP 服务器。你可以使用匿名用户名和任意（或为空）字符串作为密码运行它。


    通过这些选项，你可以共享你的文件。


    作者 Hans-Georg Eßer


    > [1] codes.eger/itgtrow/webor/

    > [2] https://www.busybox.net/


    ![](img/ef948bfad2ff49ba16960a53d116bb79_70.png)


    # 网络


    # 技巧 80 Transmission 4 (BitTorrent 客户端)


    Transmission 是另一个存在时间之久，已成为词汇的工具。特别是考虑到 Transmission 是一个 BitTorrent 客户端，这种技术的流行像任何其他事物一样起伏波动。Linux
    用户在处理大文件和自托管项目时有了更好的措施。BitTorrent 允许我们在不产生上负担的情况下下载文件，但也通过保持种子活跃做出了巨大贡献。无论你使用什么，Transmission
    都是跨平台的选择。


    # 技巧 81 Hasty Paste 1.9.0 简单在线剪贴板


    剪贴板允许用户在电脑之间交换数据。如果你需要在两个系统之间交换数据，像 Hasty Paste 这样基于 Web 的工具非常有帮助。该工具带有一个简单的剪贴板。没有基于
    TLS 的加密，这就是为什么你应该使用 Hasty Paste。点击 New 按钮创建一个新的条目，你可以共享或分配。创建条目后，你也可以进行编辑；一旦创建，条目无法更改。


    更多新功能，此主要版本关注稳定性，首先是性能和代码质量。代码的一部分还通过单元测试进行了现代化，确保了未来。还有新功能，如 Torrent 和哈希树、带有移动支持的新客户端以及用户保护。它仍然具有
    GTK 和 Qt 良好的桌面支持，并且你可以从命令行运行它。结果是未来几年一个稳健的客户端，也是日益控制的世界之外最好的工具之一。


    Ubuntu 用户运行 "snap install transmission" 安装版本 4；APT 仓库包含节约资源和速度。但是，有一个开发者没有时间积极开发该工具并添加更多功能。然而他仍然修复了漏洞和错误。


    > Uwe Volricht

    > https://encodedcode.co.uk/hasty-paste/install.html


    > Graham Morrison

    > https://github.com/transmission/


    Hasty Paste 是系统间共享数据的通用剪贴板。


    ![](img/ef948bfad2ff49ba16960a53d116bb79_71_0.png)


    # Neon Modem Overdrive: 终端论坛访问


    我们许多在 20 世纪 80 年代和 90 年代初使用拨号解调器访问公告板系统（BBS）的人，在迁移到带有协议、新闻客户端和网络浏览器的互联网之前要快乐得多。很多人依赖
    route、traceroute 甚至 ping 等命令来确定系统如何到达以及本地配置问题在哪里。勇敢的新世界不需要连接或昂贵的电话通话，当然它成为了我们时代的主导技术。但这意味着在现代互联网出现之前一切都很糟糕。目前包括
    Discourse（开源论坛服务器）、Lemmy（联邦社交网络）、Lobste.rs（联邦化的 Hacker News 等品）以及 Hacker News。通过命令行选项选择你想连接的服务器。顶部故事或你选择的服务器列表就像旧
    BBS 上的消息。选择一个帖子读取其内容。有搜索的快捷键，以及在服务器和单个论坛之间切换的快捷键，以及发布你的回复。


    体验在互联网上无法轻易重建，他们的对话感和羽化消息也是如此。这种体验是 Neon Overdrive 试图在现代时代通过你的终端重建的。


    访问现代新闻网站和讨论论坛就像在 1988 年使用命令行一样。


    Neon Overdrive 是一个 BBS 风格的命令行客户端，可以在你的终端中记住多个现代和联邦故事和评论。


    ![](img/ef948bfad2ff49ba16960a53d116bb79_72_0.png)


    > Graham Morrison

    > https://github.com/murusme/neonmodem


    # Trippy: 网络分析


    设计网络问题可能是困难的，特别是来自远程服务器的命令行。我们许多人依赖 route、traceroute 甚至 ping 等命令来找出系统如何到达，以及本地配置问题在哪里。Trippy
    是一个很棒的小工具，它将三个工具的功能与易于理解且强大的基于终端的用户界面（TUI）结合在一起。


    然而最初不容易理解的是运行 "trippy" 显示的命令，它不仅仅是好看，因为它提供了原始统计访问；它也可以在没有权限的情况下使用，尽管会丢失一些细节。


    Trippy 支持 TCP 之外的多种跟踪选项，并将分析输出到 JSON、CSV 和 Markdown 格式。


    trip 可以通过一个或多个 IP 地址或域名运行。几秒钟后主视图填充了数据包到达目的地经过的中间网络地址。它显示了跟踪 ping 时间的图表，你可以用方向键选择任何特定的跳点。这让你看到到达每个跳点的时间和丢包的百分比。它还显示了所选跳点详情之间的差异以及显示其地理位置的世界地图。这种带有多个图表的可视化方法很容易看到网络性能的任何变化，以及连接可能遇到问题的地方。它是
    ping 和 traceroute 的绝佳替代。


