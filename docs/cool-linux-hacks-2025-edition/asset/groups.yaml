    # Neon Modem Overdrive: Terminal Forum Access


    Many of us who used dial-up modems to access bulletin board systems (BBSs) back
    in the 1980s and early 1990s were much happier before having to move to the Internet
    with its protocols, news clients, and web browser. Brave new world didn''t require
    connections or costly phone calls, and of course it became the dominant technology
    of our age. But that means everything was bad before the modern internet. Currently
    include Discourse, the open forum server; Lemmy, the federated social network;
    Lobste.rs, the federated Hacker News equivalent; and Hacker News. Which server
    you wish to connect to is selected via a command-line option. The top stories
    or your selected server list just like messages on an old BBS. Select a post to
    read its contents. There are keyboard shortcuts for searching, and others for
    switching between servers and individual forums, as well as posting your replies.


    Experience can''t be easily recreated on the internet, and neither can their sense
    of conversation and feathered messaging. This experience is something that the
    wonderfully Neon Modem Overdrive tries to recreate for the modern age, from the
    comfort of your terminal in the modern internet.


    Access modern news sites and discussion forums is like in 1988 with the comfort
    of your command line.


    Neon Overdrive is a BBS-style command-client that remembers the stories and comments
    from several modern and federated services in your terminal.


