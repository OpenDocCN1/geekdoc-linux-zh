    ## Navigate with Zoxide


    In most shells, the main navigation utility is cd (change directory). Generally
    built into shell, cd has its own page like other commands, which usually goes
    unnoticed, because the base is cd that most users use. However, when directories
    have multiple levels, cd can require tedious typing, especially when you have
    to travel up the directory structure and down another. A modern version of cd,
    zoxide, changes this by using a database and requires only the last directory
    in the path.


    To get results, zoxide relies on an algorithm based on how often a directory is
    accessed. When first added to the database, zoxide assigns a score. Each time
    you access it, its score rises. When a query is made, a directory is added if
    accessed in the last day or week. The more used, the higher the value. When the
    database reaches maximum number of entries, it reassigns the frequency of access
    and deletes the oldest.


    ## Installation and Configuration


    Zoxide is available in many distributions, or as multiple platforms and in package
    formats. However, installing the package is just the beginning. To be functional,
    zoxide needs some configuration. To start, zoxide needs to be added to the shell.


    ```

    eval $(zoxide init)

    ```


    must be added to the ~/.bashrc, ~/.zshrc or manually with zoxide-init. Zoxide''s
    GitHub gives instructions for other shells. In order to search directory names,
    the fuzzy searcher fzf must be installed. Installed, you can change the command
    name. Directories are stored in the database with --SETTING, choose a mode of
    none, prompt, or pulp.


    Another simple option is to integrate zoxide with applications such as Emacs,
    Vim, and nano, or as several file managers such as Ranger. These have been published
    on GitHub by many popular developers, text editors such as Joe, or file managers
    like Dolphin or Doxide, as. Zoxide''s behavior can also be set with environmental
    variables:


    - - ZOXIDE_DIR: Specifies the directory in which the database is stored. Use $ZOXIDE_DIR=$HOME
    for local storage.

    - - ZO_E: When set to 1, it will display the displayed directory before navigating
    to it. With this variable, you can use -f to run cd from the complete path

    - - ZO_EXCLUDE: Specifies the excluded directories from the database. /home is
    excluded by default. This can be useful for security and privacy.

    - - ZO_FZF_OP: Provides custom options to pass to fzf during interaction selection.
    Useful options include case-sensitivity, alternative ways of weighting directories
    in search results, and displayed options. See fzf for the list of options.

    - - ZO_MERGE: Limits the maximum number of entries in the database. The default
    is 10,000.


    ## Using Zoxide


    All this configuration results in zoxide being simple to use. Type PATH, and the
    final directory is added to the database. The next time you need to navigate to
    that directory, you only need to type DIRECTORY, no how deep in the directory
    tree it is. For instance,


    ```

    z/home/etc

    ```


    next time you want to create zoxide. Once set up, you can add your most-used directories
    to the database and simplify your navigation. When patterns match, you can use
    as the database-based search with Space-Tab to select from a list! This requires
    an fzf installation.


    As the database is populated, zoxide will choose the highest ranked directory.
    You can change this behavior by searching multiple directories in the path, or
    by using a subpath. If you add with a subdirectory, zoxide will go one directory
    down with - or into the previous directory with ~.


    For users further, no information is returned


    zoxide''s behavior can be edited by custom scripts placed after the basic commands.
    You can add a path with a rank of 1, or adds to the rank of a directory in the
    database. After that, the last field of the entry is updated. Directories in the
    ZO_EXCLUDE environment variable cannot be added. Use a quicker way to add directories
    without selecting them from your navigation.


    - - zoxide --port Fzf: The output format is key for fzf. Options for fzf are --all
    and --interactive. With --(-1), all results are returned, not just the used, with
    --score (-) lists rankings, which can be manipulated with zoxide.

    - - zoxide --remove: Deletes directories from the database. This removes a directory
    from the database, if it is in the ZO_EXCLUDE environment variable.


    For example with zoxide, the number of commands returned is


    Users might want to make zoxide all of cd by adding alias cd to their configuration
    file. Zoxide saves thousands of keystrokes, and is both efficient and elegant.


    Figure 1: When directories zoxide provides a list of alternatives to select from.


