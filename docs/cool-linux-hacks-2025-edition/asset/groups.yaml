    # Run Binaries from a Different Linux Universe


    Software installation has become so simple with the advent of repositories and
    management tools like Apt, Zapt, Yump/DNF, and so on; Just pick a package you
    want and let the manager figure out what other packages (dependencies) it needs
    and install all of it in one go.


    Sadly, not every application appears in Linux distributions. For example, the
    viewer is one of my favorite, because it is incredibly fast. But it is also very
    old and has not been updated since 1994. Its source code is available, but it
    has a habit of not compiling. For some distributors, openSUSE handles this well
    and provides packages in them. For others, Ubuntu, do not. How about just copying
    the binary file from an openSUSE system to Ubuntu?


    Well, that is likely to cause problems; in many cases, you will try to run the
    binary and get an error message about missing libraries. In Linux, you can''t
    search for them within the error message. either they are missing or they might
    be installed with wrong versions.


    Instead, go to the source and search for the libraries there. You can use ldd
    to get a list of dependencies: ldd /usr/bin/xv (for the example: Figure 1). Now
    build a zip archive to package everything and the output of ldd as the argument
    list for zip:


    ```

    zip xv.zip /usr/bin/xv $(ldd bin/xv)

    ```


    You will find many errors, because there are more names than in the output, but
    it does not matter: zip will happily put everything it recognizes as in the new
    ZIP file. Copy that over to the target machine.


    On the target machine, create a new folder for your program, copy the binary itself
    into that folder, and unpack the file with:


    ```

    unzip -d xv *.zip

    ```


