    # Try Nushell, a New Shell


    Every now and then, there''s a new shell to win over dead and Linux Users. It''s
    quite the task, because many who like the shell it especially for the speed at
    which it lets navigate filesystems, run relevant tools, and get them done. "Never
    change a running system," the saying, and using a very different shell is a big
    change.


    Nushell is different in how it treats outputs as pipelines working on tables (and
    not on simple lines like text). If''re also familiar with PowerShell, the modern
    Windows shell, you''ll recognize this approach.


    On Ubuntu you can easily install the Snap package


    ```

    sudo snap install --classic nushell

    ```


    There''s also a Debian package, which you''ll need to add a GPG key to your repository
    sources to install it; the project documentation shows how to do. Both methods
    install the same version of Nushell.


    Type nu to start the shell. As first example, you can look at the output of one
    the most important commands. ls has an internal version that creates tables; you
    can also run /bin/ls, but you won''t benefit from it as much.


    ls -1 will output a table with many columns. If you need some of them, you can
    filter and select then sort with sort-by. A complex example follows


    ```

    ls -1 | select name user size | sort-by row | modified | format row {row}

    ```


    select the name, user, size, and modified columns, reverse-sort by modified date,
    and "2 days ago" to a datetime string.


    Nushell can also query websites, parse JSON data, and work with their features;
    there''s a section ''cool liners'' in the GitHub repo that shows useful tricks.


