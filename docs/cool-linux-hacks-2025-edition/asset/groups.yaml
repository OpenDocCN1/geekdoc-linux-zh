    # Concession: File Permissions Viewer


    I''m of the belief that if you never encountered a file permissions error, you''ve
    never used Linux. True, for experienced programmers who know their craft from
    their own and can resolve issues of them, there''s Concession.


    Developer Ronnie Nisse notes on this page that the purpose of this is to "Understand
    File Permission". It''s currently only as a Flatpak. On Linux, I noticed that
    Chord App was faithful to the goal of offering apps with a simple interface. If
    you''re new to Linux, I recommend launching Concession''s help page


    While the interface is basic, Concession is perfect for working out what file
    and folder to assign in the terminal.


    which discusses in detail how file permissions work in Unix systems.


    The help section by explaining the principles to whom permissions are assigned
    (Users, Groups, and Others). It discusses the types of permissions (Read, Write,
    and Execute) as well as how these can be represented as a string of 10 characters
    using three digits. This is obvious to experienced Linux users, Concession shows
    how the positioning of characters when it comes to assigning permissions. It provides
    an example of a command.


    If you return to the Concession main screen at this stage, you''ll see an example
    of file permissions in both numeric and symbolic. The default setting is 664,
    which allows the owner and group to read and write to the file but not others.
    If you''re not sure what to do, use one of the toggle buttons beside each part
    to change the permissions. For instance, you can toggle read, write, and execute
    to all for the 777 or rwxrwxrwx. A copy dialog next to sets of values allows you
    to paste into the terminal. The Option at the top left allows you to access a
    file and view its current permissions.


