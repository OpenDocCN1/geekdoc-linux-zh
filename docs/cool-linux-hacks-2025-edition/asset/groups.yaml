    MIDI 数据，ShowMIDI 将首先按通道拆分这些数据，并在每个通道上拆分任何与你相关的数据。


    你可以添加额外的轨道作为层，在多个层上分离通道或乐器。这些是复杂 DAW（数字音频工作站）的标准功能，但在设计良好且简化的界面中拥有这些功能对于 MIDI
    数据和初学者来说是一件棒的事。我们让 MIDI 编辑和调整对所有用户都变得更容易。


