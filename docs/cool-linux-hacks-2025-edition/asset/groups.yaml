    # Save Your SSH sessions with screen


    Does the following pattern seem familiar? You log in to a remote computer via
    SSH, modify a text file in an editor like Vim, and then walk away to do something
    else. When your SSH connection goes down, you log in again, the file once more,
    Vim complains that you''re already editing it.


    This happens to me quite often though I know how to fix the problem: After you
    connect to the remote system, run screen which will create a new terminal that
    can save your session. (If you haven''t installed it, use the package manager
    to get it.)


    +   1. Open two terminal windows and ssh into the remote machine on both of them.

    2. In one window, type tty to see the terminal device. Type screen, and then press
    Enter to enter the screen.

    3. You''re now in a free terminal (type tty to see the change) that was created
    by screen. Here, open a file in an editor, for example: vi ~/.bashrc (if it exists
    on the remote machine). Move to the end of the file and add lines without leaving.


    +   4. Kill the session by closing the window. In the main window, type screen
    -RR. You will be reconnected to the terminal that was created by screen, so you
    will get back to the editor. In screen language, you have just "reattach" the
    terminal. Under type tty to see that this is really the same terminal.


    The terminal session will stay active until the remote machine powers down --
    until you exit it. When you''re in a session, just hit Ctrl-D to detach the shell


    You may also ask to "detach" from your current session. Press Ctrl-A, D, and get
    a message similar to


    ```

    [from $2489.pts/0]

    ```


    will appear. You are back in the shell you originally started. Run the screen
    -RR to reattach to session.


    If you have multiple servers that you only use SSH, you can make them automatically
    launch screen -- just add the following line at the end of ~/.bashrc (or what
    other startup file you use):


    ![](img/ef948bfad2ff49ba16960a53d116bb79_91_0.png)


    ```

    if [ -z "$TTY" ]; then screen -RR; fi

    ```


    This will automatically reattach a detached session (or start new if there is
    none). The variable check prevents screen sessions.


    # More Features


    screen has many more features beyond saving your SSH connections. It is a terminal
    multiplexer: Hit Ctrl-A, Shift-S to split the terminal. The window will be split
    into two equally large windows, with the one active. Press Ctrl-A, T to move the
    focus to the new area, then Ctrl-A, C to switch between them. You now have two
    terminals inside the same session.


    In a similar way, you can pick the current view: Hit Ctrl-A, / (pipe symbol) to
    achieve that. You can get out of all these views by pressing Ctrl-W. Your layout
    will be lost when you detach (unless you choose - then you only see the one session
    in full-screen mode (inside the terminal). To access the invisible sessions, press
    Ctrl-A, , which will bring a list of terminals from which you can select one with
    the keys and hit Enter.


    There are many options that you can change by editing your .screenrc config file.
    For example, what might be bothered by screen usage of the Ctrl-A shortcut for
    jumping to the different session. (Press Ctrl-A, A to do that in a session). To
    change it to something else, just add


    ```

    escape ^B

    ```


    to that file, also with


    ```

    layout default

    ```


    will save the layout of split windows when you detach a session.


    # Alternatives


    A pretty tool, screen has been around since 1987! A modern alternative is tmux.
    You can use it for identifying SSH sessions: installation, run tmux. You''ll see
    it''s better because it displays a status line in the last of the terminal. Detach
    the session with Ctrl-B, D (tmux uses Ctrl-B instead of Ctrl-A) to close the window.
    Then reattach the session with tmux. There are more multiplexers, but most do
    not offer the reattach feature.


    > By Hans-Georg Eller


    [1] https://www.gnu.org/software/screen/

    [2] https://github.com/tmux/wiki'
