    # Seq66: MIDI Sequencer and Looper


    While pop music production has always revolved around loops, music software in
    particular has put loops at the centre of their recording capabilities; it''s
    only in the past decade that became a popular form of improvisations. Types of
    musicians now create music by recording phrases live, looping that phrase with
    the hit of a button or a tap of a foot, and adding to this with loops that are
    met seamlessly. The software and hardware built to do this have a huge variety
    to choose from, from specifically built pedals and self-contained boxes, to clip
    launchers in applications such as Android. But there are very few that target
    MIDI, and that is exactly what Seq66 does.


    Unlike what might be a traditional sequencer based on the old tape machine paradigm,
    Seq66 is built entirely around the concept of loops. You can see this immediately
    when you first launch it. The window grid has a size of 8x32 squares. Each square
    can contain loops and can be played independently by clicking on them during playback.
    To start, you need to get MIDI from those squares. Each MIDI channel in the file
    will go to a different square. The second is to record input directly into a square.


    Seq66 includes MIDI control, playlists, sequencing, editing and compression.


    If you want to run Seq66 on a small screen, it requires only 450x340 pixels -
    ideal for a portable Raspberry Pi.


    ![](img/ef948bfad2ff49ba16960a53d116bb79_36_0.png)


    final MIDI creation is the editor, which can be opened for any sequence and used
    to add notes and MIDI data, or to tweak preexisting data. You use the familiar
    matrix grid with controller data beneath, and you can drag and drop notes and
    peaks with your cursor device. There are uncommon ways to edit too, and there''s
    an "LFO" that can automatically change the loop control to a varying waveform,
    with individual controls over the depth and speed.


    While the focus is on performance and improvisation, there are several tabs used
    to help turn loops into a complete track. The most important of these is the song
    editor which lets you see the contents of each loop at once. It''s quick, easy
    to use and is a more intuitive equivalent to functions on flyged audio widgets.
    You can use the editor to transpose loops without affecting the source loops,
    which is perfect for sections of a tune you want to add a key to. The entire project
    can then be saved as a session, and even sequenced with other sessions as part
    of a project for performance. It''s a different approach and a great choice for
    building MIDI musicians.


    Ubuntu needs to clone the source code repository, install libtool, libdo-dev,
    libasound-dev, qt5-qmake, qrcode, qtbase-dev (in addition to the usual development
    packages) and then follow the instructions in INSTALL file.


    ![](img/ef948bfad2ff49ba16960a53d116bb79_36_1.png)


    > By Graham Morrison


    https://github.com/ahistromc/seq66'
