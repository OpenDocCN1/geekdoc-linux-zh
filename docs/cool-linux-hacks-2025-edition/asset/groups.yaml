    21


    # 安全


    # HACK 23


    ## sbct: 安全启动管理器


    除非你是安全专家，否则在尝试自己管理加密和安全时可能会造成更大的伤害。如果你能付得起专家费用，这通常不是问题，但我们的系统中没有这种奢侈。这就是为什么当发行版自动设置加密，或者在不需要我们输入的情况下帮助保护我们的系统和驱动器时，它会非常有帮助。


    安全启动（Secure Boot）的情况并非如此，它是保证你的安装程序在可信平台模块（TPM）内完整性的引导加载程序。与许多其他安全系统一样，从用户的角度来看，安全启动的管理最好被描述为不透明。


    问题在于，访问系统支持的任何安全启动功能通常取决于我们的制造商以及他们在 BIOS 或 UEFI 选项中包含的功能。这使得文档化和维护变得困难，但也让你想要保护的项目变得稍微简单。这就是
    sbct（安全启动管理器）开发的初衷：一个命令行工具，允许你访问并配置你的安全启动设置。


    Ghostery 的详细视图让你能够管理追踪数据库。


    Privacy Badger 默认向你的设置添加全局隐私控制，由电子前疆基金会（EFF）开发并维护。


    作者 David LaSalle


    '
