- md: "\n# Learn Game Development on the TIC-80\n\nGame development is, just like\
    \ playing games. Of course, you cannot expect your game to compete with a commercial\
    \ game created by teams of developers, level designers, and artists. But still,\
    \ implementing your own version for a single programmer with a limited amount\
    \ of time.\n\nwith the filename as an argument to auto-load the code (Listing\
    \ 1). It includes all necessary data: the code, graphics, and sounds. TIC-80 will\
    \ also immediately launch the game - you can just stop it by pressing Esc and\
    \ then selecting Game-in. That brings you to the start screen from which you can\
    \ enter the code editor by pressing Esc once.\n\nCodeword from top left: the Pac-Man\
    \ game, the source code editor, music, image, and sprite editor.\n\n![](img/ef948bfad2ff49ba16960a53d116bb79_66_0.png)\n\
    \n# Fantasy Computer\n\nAll of the projects mentioned so far target real machines,\
    \ either current or dating back to the 1980s. In this chapter we focus on a completely\
    \ different approach: the TIC-80 [3]. It is taken into the category of \"fantasy\
    \ computers\" [4] and provides you with a coding environment with full-screen\
    \ code, sprite, map, and sound editors. You can write your programs in Lua, Ruby,\
    \ Python, and few other languages that let you display your game, position the\
    \ sprites, and background music.\n\nWhen you start TIC-80 it shows a colorful\
    \ screen and loads a small example as game. It also displays a prompt at which\
    \ you can type commands. If you want to edit the source code, just press Esc it\
    \ will take you to the code editor. When writing games for TIC-80, you place the\
    \ code for the main loop inside the TIC_draw() function. Having a main loop is\
    \ a standard method of writing games: The idea is to run a loop which checks for\
    \ events that occur. Events can be moved by joystick, keys being pressed, running\
    \ out etc. In Figure 1 the first demo program shows the movement (up, down, left,\
    \ right) and moving positions for a sprite that we draw on the screen. If the\
    \ figure moves outside the game boundary; they are set to the cursor keys but\
    \ to go back to the four directions of a joystick or gamepad.\n\nOn the project\
    \ website, you can find many example programs: they are developed as files that\
    \ the developers call \"cards.\" A downloaded cart and run tic80.\n\nYou may use\
    \ any tutorial to learn the basic syntax and then read the Learn page on the website\
    \ which explains the built-in functions you can use to access the computer's hardware\
    \ (e.g. 240x136 display). Also inspecting the code is a great way to learn how\
    \ to make this work. If you prefer a different language, typing where can use\
    \ any of lua, ruby, js, moon, fennel, squirrel, webre, wasn, jam, or Python -\
    \ Lua is only the default language.\n\n> By Hans-Geörg Eber\n\n- [1] https://www.pygame.org/\n\
    - [2] https://lemospawn.com/\n- [3] https://tic80.com/\n- [4] https://github.com/fantasy/\n\
    \n# Listing 1: Running a Cart\n\n```\n01 error@user804b-: $ -I -i you can type\
    \ js -d - \"\"\n02 573937 31 11:24 pacman_80\n03 73837 31 11:19 sprite_painting,tic\n\
    04 49251 31 11:21 wip_more_like_game,tic\n05 error@user804b-: $ tic80 pacman_80_tic\n\
    06 TIC-80 ting counter\n07 version 1.2.07(beta426f)\n08 https://tic80.com (C)\
    \ 2017-2023\n09 loading...\n```\n\nCOLINUX HACKS - 2025 EDITION\n\n# EDUCATION\n\
    \n# GCompr: Learning Games for Kids\n\nThe aim to make learning fun may trigger\
    \ an eye roll from teenagers, GCompr's target is 10-year-olds. It consists of\
    \ a suite of games (currently around 190) by GCompr as, with an emphasis on education.\
    \ The suite is suitable for Linux but there are also versions for BSD, Android,\
    \ macOS, and Windows. The project has been in development since 2000 and was originally\
    \ released under the GNU General Public License (GPL) by Christophe Coudain. GCompr\
    \ is developed and maintained by the KDE community. The name for the suite is\
    \ a play on the French 'J'ai compris' (I understood).\n\nApparently nine years\
    \ of work, GCompr graphics have also been reworked to match the project guidelines.\
    \ Version 4.0 also includes eight activities. These include Calcudoku, in which\
    \ players have to fill a grid with numbers according to rules. Other new titles\
    \ make references to 'graduated lines.' This use of advanced words, such as 'enumerate\
    \ the first,' seems to persist GCompr making the suite appropriate for kids with\
    \ a wide vocabulary.\n\nBy Nate Drake\n\nhttps://gcompr.net/\n\nSome of the activities\
    \ are designed to teach the same concepts, such as 'Mixing Paint Colors' and 'Mixing\
    \ Light Colors,' a variety which can help keep young learners engaged. There is\
    \ also a built-in 'difficulty filter' that can hide advanced activities from young\
    \ children. This can be advanced via the Settings menu, which also allows users\
    \ to configure figure and background music. The lock requires players to assist\
    \ a very familiar-looking penguin's mouth.\n\nThe latest version of GCompr (4.0)\
    \ addresses some of the issues previously leveled by parents that the site is\
    \ also anti-English. The suite has been translated into a number of languages\
    \ including Dutch, Polish, Brazilian Portuguese, and French.\n\n![](img/ef948bfad2ff49ba16960a53d116bb79_67.png)\n\
    \n# GPlates\n\nSome of the best and most interesting open software comes from\
    \ the world of academia. This is likely because both share the same philosophy\
    \ and debated ideas lead to better outcomes. GPlates is a great example of this.\
    \ A complex and adaptive tool that has been created to explore and visualize the\
    \ science behind plate tectonics—those cracked and continental movements of Earth—allows\
    \ everyone to recreate the world. GPlates and the dataset that it has created\
    \ by the EarthByte group, a research organization attempting to study links between\
    \ deep Earth, the atmosphere and environmental change, high school, almost anyone\
    \ will come from their simulations having something. GPlates is a geo-based application\
    \ that contains a sizable set of geodes in the default package, which can be loaded\
    \ and installed by loading the data file. approximately 1 GB of data accompanies\
    \ the application, which allows beginners to learn a lot from using controls to\
    \ recreate the motion of the Earth over millions of years. Each frame is annotated\
    \ with colored arrows indicating the movement and forces at play, and it is easy\
    \ to see how rifts and mountains are created. On Ubuntu 24.04, run with QT_PLATFORM=xcb\
    \ gplates or it will crash.\n\nBy Graham Morrison\n\n![](img/ef948bfad2ff49ba16960a53d116bb79_67.png)\n\
    \nhttps://github.com/GPlates\n\nCOOL LINUX HACKS –2025 EDITION\n\n# Explore Space\n\
    \nCelestia is an old project, fitting since 2001. It was one of the first astronomy\
    \ projects that portrayed space as infinitely more than a two-dimensional projection\
    \ onto a cubosphere. It empowered the observer to leave their two-dimensional\
    \ viewpoint and explore the stars through both space and time, seeing them in\
    \ three dimensions (or from Jupiter's surface) or from anywhere else one could\
    \ imagine. Graphics acceleration only made this possible in 2001, but the application\
    \ tracked and updated GPU, utilizing extra memory and sublime networks that could\
    \ be layered for parallax or to simulate. Performance also allowed more stars\
    \ in the sky, which could be zoomed through as you traveled at many times the\
    \ speed of light through the universe. Celestia is truly breathtaking. It was\
    \ one of the best ways to show that constellations were made from stars across\
    \ vast distances and scales. Similarly, it showed the stars' location along a\
    \ fragile arm of the Milky Way, and the celestial dance of our solar system as\
    \ they rotate around themselves, the sun, and the black hole at the center of\
    \ our galaxy. Unfortunately, Celestia became frozen and development slowed to\
    \ a crawl. More recently came a fork (Celestia Origin), a new owner, and a collaborator\
    \ joined on GitHub. A new and stable binary release will hopefully awaken the\
    \ project. This is because Celestia could truly thrive in a new world of super\
    \ GPUs, augmented reality, and astronomical imagery. If not, then a similar project\
    \ would be worth us.\n\nhttps://www.celestiapject.org/ \n\nUnlike astronomy apps\
    \ like Stellarium, Celestia is a true 3D-model of the solar system and universe.\n\
    \nBy Graham Morrison\n\n# Try Edubuntu\n\nUbuntu comes in various flavors. For\
    \ example, you can install Ubuntu to get a KDE desktop or Xuntu if you prefer\
    \ the Xfce desktop. The main difference between most flavors and the regular Ubuntu\
    \ is that they use Gnome desktop as an alternative.\n\nAnother Ubuntu-based runtime\
    \ is time ending in Edubuntu. While development of this education-focused Ubuntu\
    \ version had stalled for some time you will find downloads for 24.04 LTS and\
    \ 25.04 on the website, which are also available desktop installers (x86_64 for\
    \ a Raspberry Pi). The installer for 25.04 is 5.8GB, and it is also available\
    \ for ARM64, it runs the Gnome desktop in a Wayland session. According to Edubuntu's\
    \ mission statement, the team targets classroom computers in schools, and it will\
    \ work just as well as a regular Ubuntu desktop. Ubuntu installs a regular set\
    \ of educational tools that you might need for a regular desktop. The Edubuntu\
    \ installer allows you the selection of metapackages - add ubuntu-edu and ubuntu-teaching\
    \ to get the full selection of learning and teaching apps. You can also install\
    \ the specific software you need. In the application overview, you find sub-menus\
    \ for Art, Language and Literacy, Mathematics, Music Education, Science, Social\
    \ Sciences, Technology, and more.\n\nThe list of alphabetically regular programs\
    \ includes Firefox and LibreOffice, but you also get LaTeX, without needing an\
    \ IDE. The text allows you to use LateX but not like running the TeX compiler\
    \ from the shell.\n\nhttps://www.edubuntu.org/\n"
  mdcn: "\n\n# 在 TIC-80 上学习游戏开发\n\n游戏开发就像玩游戏一样。当然，你不能期望你的游戏能与由开发者、关卡设计人员和艺术家团队创建的商业游戏相竞争。但是，对于一个时间有限的单程序员来说，实现自己的版本仍然可行的。\n\
    \n使用文件名作为参数自动加载代码（列表 1）。它包含了所有必要的数据：代码、图形和声音。TIC-80 还会立即启动游戏——你只需按 Esc 键然后选择 Game-in\
    \ 即可停止它。这将带你进入启动界面，你可以按一次 Esc 键进入代码编辑器。\n\n从左上角的指令（Codeword）：吃豆人（Pac-Man）游戏、源代码编辑器、音乐、图像和精灵编辑器。\n\
    \n![](img/ef948bfad2ff49ba16960a53d116bb79_66_0.png)\n\n# 幻想计算机 (Fantasy Computer)\n\
    \n到目前提到的所有项目都是针对真实的机器，它们是当前的还是可以追溯到 1980 年代的。在这一章中，我们关注一种完全不同的方法：TIC-80 [3]。它被归类为“幻想计算机”\
    \ [4]，并为你提供了一个带有全屏代码编辑器、精灵、地图和声音编辑器的编码环境。你可以使用 Lua、Ruby、Python 以及其他少数语言编写程序，这些语言可以让你显示游戏、定位精灵和背景音乐。\n\
    \n当你启动 TIC-80 时，它会显示一个彩色屏幕并加载一个小型示例作为游戏。它还会显示一个提示符，你可以在其中输入命令。如果你想编辑源代码，只需按 Esc，它将带你进入代码编辑器。为\
    \ TIC-80 编写游戏时，你将主循环代码放在 `TIC_draw()` 函数内部。拥有主循环是编写游戏的标准方法：其核心是运行一个循环来检查发生的事件。可以通过摇杆移动、按键、运行结束等事件。在图\
    \ 1 中，第一个演示程序显示了我们在屏幕上绘制的精灵的移动（上、下、左、右）和移动位置。如果物体移动到游戏边界之外；它们设置为光标键，以便返回摇杆或游戏手器的四个方向。\n\
    \n在项目网站上，你可以找到许多示例程序：它们被作为开发者称为“卡片”（cards）的文件开发。下载一个卡片并运行 `tic80`。\n\n你可以使用任何教程来学习基础语法，然后阅读网站上的“学习”页面，该页面解释了你可以用来访问计算机硬件的内置函数（例如\
    \ 240x136 显示器）。此外，检查代码也是学习如何实现的极佳方法。如果你喜欢不同的语言，输入时可以使用 lua, ruby, js, moon, fennel,\
    \ squirrel, webre, wasn, jam 或 Python —— Lua 仅是默认语言。\n\n> 由 Hans-Geörg Eber \n\
    \n- [1] https://www.pygame.org/\n- [2] https://lemospawn.com/\n- [3] https://tic80.com/\n\
    - [4] https://github.com/fantasy/\n\n# 列表 1：运行卡片\n\n```\n01 error@user804b-: $\
    \ -I -i you can type js -d - \"\"\n02 573937 31 11:24 pacman_80\n03 73837 31 11:19\
    \ sprite_painting,tic\n04 49251 31 11:21 wip_more_like_game,tic\n05 error@user804b-:\
    \ $ tic80 pacman_80_tic\n06 TIC-80 ting counter\n07 version 1.2.0(beta42f)\n08\
    \ https://tic80.com (C) 2017-2023\n09 loading...\n```\n\nLINUX HACKS - 2025 版本\n\
    \n# 教育\n\n# GCompr：面向儿童的游戏\n\n让学习变得有趣的目标可能会吸引青少年，但 GCompr 的目标是 10 岁儿童。它由一组游戏（目前约\
    \ 190 个）组成，专注于教育。该套件适用于 Linux，但也有 BSD、macOS 和 Windows 的版本。该项目自 2000 年以来一直在开发，最初是在\
    \ GNU 通用公共许可证 (GPL) 下发布的，由 Christophe Coudain 开发。GCompr 由 KDE 社区开发和维护。该套件的名字源自法语的“J'ai\
    \ compris”（我理解了）。\n\n显然，经过九年的工作，GCompr 的图形已经过重新设计以匹配项目指南。版本 4.0 还包括了一些活动，其中包括\
    \ Calcudoku，玩家必须根据规则填充网格。其他新标题引用了高级词汇，例如“enumerate（列举）”，这使得 GCompr 适合具有丰富词汇积累的儿童。\n\
    \n作者 Nate Drake\n\nhttps://gcompr.net/\n\n一些活动旨在教授相同的概念，例如“混合颜色”和“混合光”，这种多样性可以帮助年轻学习者保持兴趣。还有一个内置的“难度过滤器”，可以隐藏高级活动。这可以通过设置菜单进行，允许用户配置图形和背景音乐。这需要一个非常熟悉的企鹅形象。\n\
