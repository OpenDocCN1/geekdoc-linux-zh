    \ it can do more. Many types also know where to find metadata. Here's a typical\
    \ output of metadata when you runs it on a PNG:\n\nchecksum.png PNG image 1749\
    \ x 1374, 8-color\nnon-indexed\n\nOf course, you can get the same information\
