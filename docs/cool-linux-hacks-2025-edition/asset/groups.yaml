    # MidiEditor: MIDI 数据编辑器


    自 1983 年 MIDI 规范首次发布以来，计算机就已经一直在处理 MIDI 数据了。尽管它在包括乐器、合成器和控制器在内的连接中无处不在，但它仍然是一个难以理解的初级问题。这部分是因为它可以被用于许多不同的方式，另一部分是因为它的结构是一种时间序列，而在当时没有复杂规范的情况下，数据是不可能标注的。


    MIDI 数据的另一个问题（参见黑客技巧 #15）是，如果你想创建、编辑或捕获它进行播放，需要花费大量时间来学习如 Ardour 或 Roggeard 这样复杂的软件。从未有过质量极佳的
    MIDI 编辑器可以在不过多考虑用户、甚至在不要求用户精通音乐的情况下完成这些工作。


    使用 ShowMIDI 来排查 MIDI 连接，并帮助理解设备如何通过 MIDI 进行通信。


    你就像想要编辑文本或文档一样，想要剪切乐器、更改速度，或者只是改变一段持续时间。这个强大的工具让你能够完成所有操作，无需成为音乐制作人，而且当你需要编辑任何
    MIDI 相关内容时，操作非常简单。


    ![](img/ef948bfad2ff49ba16960a53d116bb79_37_0.png)


    MidiEditor 是一个用于记录和编辑 MIDI 的快速图形化工具。对于那些想要在文本相同的垂直行中编辑 MIDI 数据的人来说，它是完美的。它允许你像编辑代码一样编辑文本，并对
    MIDI 执行操作。你可以通过其响应式且整洁的应用程序窗口拖放并可视化一切。此外还有工具帮助你通过网格在不使用窗口的情况下向左或右导航，以及将所有音符放在同一条垂直线上或对其进行精确量化的工具。


    但所有的 MIDI 一直受困不可见以及处于复杂序列应用程序或数字工作站之外的困扰。而这个命名的 ShowMIDI 解决了这个问题。


