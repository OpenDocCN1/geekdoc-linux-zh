    # 酷炫的 Linux 技巧


    ![](img/ef948bfad2ff49ba16960a53d116bb79_2_0.png)


    本《Linux 杂志》特刊向你承诺“酷炫的 Linux 技巧”，我们一定会兑现——请查看后续页的目录了解内部呈现的所有宝石。但究竟什么是“技巧（hack）”？在
    Windows 主导桌面操作系统的今天，决定使用 Linux 是第一个也是最重要的技巧。此外：


    - 如果我可以用它来解决问题或比以前更快地工作，那么它就是一个技巧。

    - 如果它的工作方式出乎意料，它几乎就是一个技巧。

    - 它是我以前见过的强大工具吗？我会尝试一下，也许它就是一个技巧。

    - 如果它教会我使用 Linux 机器的一种新且有趣的方法，它就是一个技巧。

    - 当它让我露出微笑时，因为这种做法太明显了，只有极客式的 Unix 用户才会这样思考时，我会把它加入我的轶事列表（是的，这就是技巧）。


    技巧的定义取决于个人品味，我们对本合集的技巧选择也是如此：许多作者做出了贡献，我们共同汇集了实用应用程序和经典工具的强大替代品。我们将它们分为九类，当你回来搜索时可以快速找到。成为一名
    Linux 专业人士关键在于经验——以及知道哪些工具可以完成工作。


    对于我们新的“收藏家”类别，我们选择了一些帮助你组织收藏的程序——或者如果你被我们的兴趣启发了其中一个。虽然我们涵盖了书籍和 DVD 等明显话题，但我们还向你介绍了“被遗忘”的技术：音乐
    CD 正在回归，你可以刻录它们创建一个 MP3 收藏，在你的 Linux PC 上播放而无需依赖流媒体服务。或者你可能正在发现分类不同国家硬币的乐趣？无论如何，我们希望你喜欢这
    2025 版。


    Hans-Georg Eiter

    主编


