    ```


    ## 安全你的笔记本


    如果你在多台机器上使用 Linux，且至少一台是笔记本电脑，你可能会发现自己经常通过 SSH 登录计算机。这需要输入密码，这就是为什么许多用户更倾向于基于公钥的活跃登录。使用
    ssh-keygen 创建 SSH 密钥并将公钥复制到目标机器的 `ssh/authorized_keys` 文件中，允许你无需密码登录。ssh 客户端会要求输入在源计算机上加密密钥的短语（passphrase）。此外，短语通常留空，以便简单地登录或直接在远程机器上执行单条命令而无需任何中断。


    由十六进制数字（数字 0 到 a 和 f）组成的长字符串是一个巨大的数值，一个根据文件名校验和计算出的校验和就在它旁边。下载 ISO 后，你可以打开终端窗口，`cd`
    进入下载文件夹，并运行校验和工具进行重复——在示例中，正确的工具是 sha256，因为该校验和生成的是加密哈希函数 SHA-256。


    ```

    sha256 openuse-leap-15.4-iso

    ```


    来计算 ISO 镜像的校验和——如果官方校验和中存储了相同的值，则完全可以确保文件未被篡改（见下文）。你可能会发现一个使用不同工具创建的校验和：MD5 和
    SHA1 是最流行的选择，但两者都过时了。


    如果你丢失了笔记本电脑或它被偷了，他们将获得你所有 SSH 密钥的访问权限，并可以登录你所有用于远程工作的机器。


    为了在你拥有的这些计算机上启用短语，请运行 `ssh-keygen -p` 来修改现有密钥的短语（而不是创建一个新的）。该工具现在会询问密钥文件的位置（如果你在创建时没有指定密钥类型，它会建议默认的
    ~/.ssh/id_rsa）。如果你创建了多对密钥（RSA 和 DSA），请检查你的 ~/.ssh 文件夹的内容，以知道你正在使用哪一个。


    > —短语，从现在起你就完成了，每次想使用该密钥连接远程机器时都必须输入它。再次运行 `ssh-keygen -p`，并在提示输入新短语时直接按回车以更新密钥。最后只需要最后一次短语即可将其移除。


