    name is dev/s1 because there''s an internal drive dev/sdb. Pick the one that you
    want to use for ripping.


    If you want to create a symlink, you can use the following command:

    `ln -s /dev/s1 /dev/cd`


    and replace /dev/s1 with the correct device name. (Note that this should not be
    necessary when you have only one).


    Instead of changing the symlink, you can prefer Preferences in Asunder and set
    the device name to the CD-ROM device field on the first time (General).


