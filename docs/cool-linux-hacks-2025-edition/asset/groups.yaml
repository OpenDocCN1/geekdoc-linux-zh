    # HACK 22


    ## Ghostery：隐私广告拦截器


    Ghostery 的主要组件包括：广告拦截、反追踪以及一个始终激活的永不失效标记。与其他广告拦截扩展程序不同，Ghostery 并不包含任何专家功能，因为它的简单界面可能已经足够用了（见图）。Ghostery
    的其余魔力都在后台运行。可用的选项非常基础且易于管理：要么信任白名单（这将允许所有跟踪且不保护你的个人数据）、限制访问，或手动粘贴允许列表。


    如果你喜欢像我们展示的这种简单视图，可以访问详细视图来查看技术细节，从而允许你控制浏览历史。该工具的真正威力取决于追踪器，而这些追踪器由 Ghostery
    公司托管和维护。


    ![](img/ef948bfad2ff49ba16960a53d116bb79_20_0.png)


    # Privacy Badger


    Privacy Badger 扩展并不是你一直熟悉并青睐的那种典型选项。与其他拦截器不同，Privacy Badger 实际上会根据你通过浏览提供的经验来学习将跟踪器列入黑名单。Privacy
    Badger 根据其“三击系统”学习识别跟踪器之间的细微差别。


    在 Privacy Badger 中，你可以检查它认为哪些是追踪域名。


    目前，Privacy Badger 已决定阻止 21 个潜在的追踪域名。


    ![](img/ef948bfad2ff49ba16960a53d116bb79_20_1.png)


    whtracks.me 是一个于 2018 年启动的追踪数据库，并在 2025 年比任何时候都强大。Ghostery 鼓励用户向该数据库贡献。你可以通过注册账户并提供捐赠来贡献。无论哪种方式，付费和免费用户的功能相同。如果你决定不注册，将无法使用历史统计（Historical
    Stats）门户。


    Ghostery 创建了一个让其他人为他们处理 Cookie 的市场。一个 Cookie 统治一切时代早已过去。如今，复杂的法律现实导致了可以被称为“Cookie
    罐”的出现。当你访问一个网站时，Ghostery 会自动为你允许并丢弃伪词，不仅排除了跟踪，而且在过程中节省了多次点击。


    https://whtracks.me/


    Ghostery 的详细视图（Detailed View）让你能够管理追踪数据库。


    Privacy Badger 默认向你的设置添加全局隐私控制（Global Privacy Control），由电子前疆基金会（EFF）开发并维护。


    作者 David LaSalle


    https://privacybadger.org/


    https://globalprivacy.control/


    ![](img/ef948bfad2ff49ba16960a53d116bb79_20_2.png)


    David LaSalle


