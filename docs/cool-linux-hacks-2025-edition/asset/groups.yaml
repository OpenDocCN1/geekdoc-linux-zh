    # Keep It Running


    Linux admins no longer say “Never change a running system,” but they do definitely
    keep it running! We''ll show you hacks that help with everyday system administration.
    Repair stuff that''s broken, keep an eye on it so you notice when it breaks, and
    be prepared.


    | Hack | Page |

    | :--- | :--- |

    | HACK 1 Watch Your Configuration with etckeeper | 7 |

    | HACK 2 Caffeine Literally Keeps It Running | 7 |

    | HACK 3 Run Multiple Linux Distros in Parallel | 8 |

    | HACK 4 Run Ancient 32-Bit Programs | 9 |

    | HACK 5 Make Regular Backups on USB | 10 |

    | HACK 6 Automatic USB Backup | 10 |

    | HACK 7 Use a Second User Account | 11 |

    | HACK 8 Guider Profiler and Monitor | 12 |

    | HACK 9 Visualize ddres''s Progress | 12 |

    | HACK 10 Where Did You Mount That Disk? | 13 |

    | HACK 11 Run dmesg with the Right Options | 14 |

    | HACK 12 Run Binaries from a Different Linux Installation | 15 |


    ![](img/ef948bfad2ff49ba16960a53d116bb79_5_0.png)


    ## Watch Your Configuration with etckeeper


    ## Caffeine Literally Keeps It Running


    The easiest way to break running Linux system is to make changes to config files
    in the /etc folder. Etckeeper keeps track of such changes using the Git version
    control software, and automatically integrates with package managers like APT.


    Traditionally, operating systems came with a screensaver CRT monitors would show
    when they are idle in then the display the image over an extended period. With
    modern display technology, this is no longer an issue, but there are other reasons
    why a screensaver is useful: it saves energy, and when combined with automatic
    locking it can provide security in a public place, leave your notebook for a few
    minutes, and forget to lock.


    To install etckeeper and get started, just run the following commands:


    ```bash

    $ sudo apt install etckeeper

    $ sudo etckeeper init

    $ sudo etckeeper commit "Here we go"

    ```


    On branch master

    nothing to commit, working tree clean


    The last command is the initial commit. Now on, just etckeeper will catch any
    changes to config files right after you made them, and provide a meaningful commit.
    If you want to check what changes the tool would detect before committing, you
    can ask it for the status:


    ```bash

    $ sudo etckeeper status

    ```


    As a typical modification, creating a new user makes changes to a number of files,
    which etckeeper will track if you commit the changes right afterwards:


    ```bash

    $ sudo etckeeper --user=tester

    $ sudo etckeeper commit "added user tester"

    [4f2f36d4444] added user tester

    Author: <esser@ebub28b44.com>

    11 files changed, 9 insertions(+), 3 deletions(-)

    ```


    Package managers will automatically run etckeeper when they update or install
    software, with apt:


    ```bash

    [66c363] changes in /etc/apt by apt install

    Author: <esser@ebub28b44.com>

    64 files changed, 383 insertions(+)

    mode 100644 new file

    ```


    How does etckeeper run automatically? It uses a "hook," into integration APT,
    which is configured in /etc/apt/apt.conf.d/@0.


    If you want to change the entries, check the directory and run `ls git` for etckeeper
    vs any other.


    However, there are situations when you don''t want the screensaver to engage.
    One situation is during a presentation, when you take a little too long explaining
    the current talking point. That''s a scenario where you want to try out Caffeine:
    the program can add a coffee icon to the menu that lets you trigger the activation
    state. Click on Activate, and then it will make your screen go black; turn it
    into a steaming cup of coffee. Click the icon again, and you''ll find the menu
    has changed to Deactivated. You don''t need to mess with anything, just toggle
    between and off. And as long as you use the steaming version of it, Caffeine will
    prevent the screensaver from starting.


    On Ubuntu, you can use `apt install-caffeine` to install. However, there are situations
    when you don''t want the screensaver to engage. One situation is during a presentation,
    when you take a little too long explaining the current talking point. That''s
    a scenario where you want to try out Caffeine: the program can add a coffee icon
    to the menu that lets you trigger the activation state. Click on Activate, and
    then it will make your screen go black; turn it into a steaming cup of coffee.
    Click the icon again, and you''ll find the menu has changed to Deactivated. You
    don''t need to mess with anything, just toggle between and off. And as long as
    you use the steaming version of it, Caffeine will prevent the screensaver from
    starting.


    ## Run Multiple Linux Distros in Parallel


    Unlike containers, you won''t need to repeatedly create and destroy over and again.
    Instead, you set up a once, and then you can use. Type


    ### Listing 1: Supported openSU Versions


    ```bash

    $ distrobox create -c | grep -i opensuse

    registry.opensuse.org/opensuse/distrobox:latest

    registry.opensuse.org/opensuse/leap:latest

    registry.opensuse.org/opensuse/toolbox:latest

    registry.opensuse.org/opensuse/tumbleweed:latest

    ```


    distrobox enter


    to enter the box you''ve created. When you do for the first time, the start script
    will show you to install additional packages – that depend on the distribution
    and version. Then you''re asked to set a password for your account, you will need
    when you want to use sudo for running programs with root access (e.g., the software
    manager inside an openSUSE box). To leave the box, just press Ctrl+D. At any time,
    you can enter again using the above distrobox enter. When you''re inside, you
    can still run outside commands: Distrobox provides a distro-host-exec command
    that lets you do:


    ```bash

    esser@ubuntu24$: distrobox enter d

    IME@openSUSE$: cat /etc/os-release

    NAME="Tumbleweed"

    PRETTY_NAME="Ubuntu openSUSE-distro-host-exec -i /etc/os-release"

    ```


    A "box" is tightly integrated with your regular system – for example, you see
    the full process list in the box.


