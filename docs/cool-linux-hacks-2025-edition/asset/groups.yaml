    # EDUCATION


    # Learn the vi Basics


    Half of the Unix administrator''s life is entering commands in the shell. The
    other half editing is in vi (or its improved version, Vim – which might then have
    alternatives to vi, like Emacs, MCEdit, GitEdit, and come to mine).


    Don''t worry, you won''t take part in the "Editor Wars" if your preferred editor
    is not vi. Let me show you the basics of this ancient tool – that has been around
    since 1976. Why should you learn to vi? Because of my favorite reasons:


    +   vi is not only available for every operating system, it is also installed
    on every Unix-like system. So if you happen to find an ancient Unix running SunOS,
    HP-UX, or AI, you will be able to edit configuration files.


    +   vi is a text-based program, so it doesn''t require an X session. It also does
    not require a mouse or a full keyboard with cursor keys. In the unlikely event
    that you''re remotely logged in a unique machine and the keyboard settings are
    broken, you can still use vi.


    +   vi has several modes, one for text input (the Insert Mode) and one for executing
    commands (called Normal Mode). In Normal Mode, you cannot edit text unless you''ve
    just loaded the editor or that you have created something complex newly.


    So if you''ve never done it before, search the web for "learning" and "vi" and
