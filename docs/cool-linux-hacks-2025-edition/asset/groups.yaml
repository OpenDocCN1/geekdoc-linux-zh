    # # Trippy: Network Analysis


    Designing network problems can be difficult, especially from the command line
    on a remote server. Many of us rely on commands such as route, traceroute, and
    even ping to work out how systems can reach, and where issues lie with a local
    configuration problem. Trippy is a fantastic little tool that combines the functionality
    of three tools with an easy-to-understand powerful terminal-based user interface
    (TUI).


    What''s not initially to understand, though, is the command to run "trippy" title
    and it is more than just being nice because it provides access to raw statistics,
    it can be used without privileges, too to miss a few details.


    Trippy supports multiple tracing options, alongside TCP, and can output its analysis
    to JSON, CSV, and Markdown format.


    The trip can run by one or more IP addresses or domain names. After a few moments
    the main view is populated with the addresses of each intermediate network packets
    go through to destination. It shows charts that track the ping in time, and you
    can select any specific hop with the cursor keys. This lets you see the time it
    takes to reach each hop and the percentage of any lost packets. It also shows
    the difference between details for the selected hop, and a world map showing its
    geographical location. This visual approach, with multiple charts makes it easy
    to see any changes in network performance, as well as where a connection may be
    encountering problems. It''s a great replacement for ping and traceroute.


    ![](img/ef948bfad2ff49ba16960a53d116bb79_72_1.png)


    > By Graham Morrison


