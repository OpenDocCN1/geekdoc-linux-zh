    在某些信息安全（InfoSec）杂志中，没有我比那些对所有内容都使用同一个密码短语的人更让我惊讶的。首先最重要的是，这是不安全的。如果一个账户被破解，其他账户也会随之。在线提供商还设置了不同的密码长度、数字/符号包含等要求。


    尽管，这个用 Rust 编写的实用工具鼓励我们恰恰这样做。它可以通过 Arch 仓库和 Flatpak 获取。LPTK 与开源密码生成器 LessPass
    有相似之处，用户可以输入他们的凭据和一个主密码短语。首次启动时，我注意到 LPTK 有一个非常简单的函数来生成密码短语。它的界面整洁，很容易进入网站并输入你的主密码。底部窗口包含密码选项，可以包括大写字母和小写字母、数字和符号。


    你还可以调整密码长度。所使用的“pure”（纯净）函数之所以这样命名，因为它总是返回相同的输出。由于这个问题对于需要更改密码的用户来说可能会产生问题，LPTK
