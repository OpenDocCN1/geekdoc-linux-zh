  md: '# AUDIO MAGIC


    # # HACK 52 Daphile Audio Server


    If you have an unused computer, why not turn it into your new audio server? Install
    the Daphile distribution, store your music on its hard disk, and access it in
    two ways: via a web app and in Samba.

    Daphile promises ''Digital Music for Audiophiles'': it provides a web application
    that lets you manage the music from any computer in the local network. Enter your
    IP address in an address bar, and start streaming Daphile. The distribution can
    run on a second card (and not the one you are using for control), so you can connect
    the Daphile PC to your living room hi-fi system and control it from a notebook
    or phone (Figure 2).

    Daphile allows you to stream music from your hard disk from a remote location,
    the Samba server which you can connect to any Linux, Windows, or macOS system.
    The Samba server gives you access to all folders and subfolders. Setting up Daphile
    is easy. The website offers three versions (64-bit, 32-bit and ARM), so will work
    on any modern computer. For our test, we picked the first one, 64-bit image (daphile-23.01-x86_64,
    276MB). Note that Daphile is available under a free license; the distribution
    is made available free of charge for non-commercial use. Commercial use and redistribution
    of Daphile is strictly prohibited.

    To install Daphile to a USB stick, boot your unused server from stick and check
    the output on the screen: It will show your IP address. This is also the last
    time you need to monitor a connection, because Daphile runs in headless mode -
    you cannot login directly at the computer.

    Connect via a browser and go to the settings tab. There you can launch an installation:
    Select a disk that will be partitioned (and will lose all previous data). Daphile
    creates a small named DaphileBoot (which holds the software) and a large named
    DaphileData (where you store your music). If you don''t want to use the hard disk
    or want to see the software, you can copy all onto the USB stick that you just
    booted from. Reboot from the root disk (stick) and connect via the browser. Now
    you can start adding music.

    Daphile includes a CD player that you can use to add music to your library. CDs
    in drives is a connect that the web displays via the server - not. Importing works
    well, and the player finds metadata (interpet and titles) and cover automatically.
    It converts the tracks into large FLAC files with excellent audio quality. With
    some time, the fact that you have physical access to the server and a client makes
    this a bit impractical. If you already have a collection of MP3 or other digital
    audio files, copy them to the Music folder, for example, via the Samba server.

    Transferring gigabytes of music over the local network will take a lot of time,
    but you can let it run unattended.


    > Figure 2: When you''re sitting on the couch, your phone''s browser is the most
    comfortable way to access the Daphile.


