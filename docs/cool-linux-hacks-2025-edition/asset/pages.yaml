  md: '# KEEP RUNNING


    # HACK


    # # Make Backups on USB


    Let''s not back up our data as often as we want; at least not. A primary reason
    is that it''s too awkward, my current (bad) reason is that I have seen misconfigured
    my network so that MY servers are sometimes not - I need it to fix. Whatever your
    reason for not backing up data may be, here is a strategy that may help you move
    in the right direction.


    Identify categories that are important and that you''re currently working on.
    Those files should be backed up. All others are documents and fall in your home
    directory.


    +   - Get a USB stick or a SSD that separates nothing and works in almost all
    Linux systems, and check which machine you will mount.

    Assuming the stick is /dev/sdb and you have created a partition /dev/sdb1, format
    it with this:


    ```

    ```

    smkfs.ext4 -l backup /dev/sdb1

    ```

    ```


    List 1: backup

    | | |

    |---|---|

    | 01 | /bin/bash |

    | 02 | FILES=|

    | 03 | /home/Documents |

    | 04 | /share |

    | 05 | TARGET="/media/$USER/backup"

    | 06 | TARGET="$BACKUPS"

    | 08 | rsync -av "$FILES" "$TARGET"

    | 09 | sudo "$TARGET" |


    (where you want to mount the stick). This will set the volume label to backup-upstick
    and


    ![](img/ef948bfad2ff49ba16960a53d116bb79_9_0.png)


    > Hans-Georg Eber


    make Ubuntu object on /media/$USER/backupstick.\ Remove and re-insert the stick;
    you will find it in the output of:


    ```

    ```

    $ grep backupstick

    $ /dev/sdb1/media/USER/backupstick type ext4...

    ```

    ```


    On the stick, create a backup folder and change its access so you can use it:


    ```

    ```

    $ sudo mkdir /media/$USER/backups

    $ sudo chown $USER:$USER /media/$USER/backups

    ```

    ```


    Create a new script ~/bin/backup (if it does not exist and), write in a script
    that follows the lines from the first script.


    Make the script executable with chmod +x ~/bin/backup. Now run it daily routine:
    Once you insert the USB stick, plug and run backup. It will create incremental
    backups daily and save important files to a USB stick.


    # # Automatic Backup


    If you''ve created a backup script in the previous hack, you might want to automate
    it. With the help of a user script, you can let the system detect that you''ve
    inserted a USB stick, and then automatically start the backup. When I formatted
    the Ext4 USB stick, I named it "backupstick" with a different name - where the
    stick is mounted:


    ```

    ```

    $ mount

    ```

    ```


    ```

    ```

    /dev/sdb /media/$USER/backupstick type ext4 (rw,noatime)

    odelime,relatime,remount-ro, uid=1000)

    ```

    ```


    In this case, the stick is mounted on /media/$USER/backupstick. Find the vendor
    and product IDs of the serial so you know how to identify it:


    ```

    ```

    $ sudo uddev info name=/dev/sdb |

    --attribute-walk | grep |

    $ATTR{idVendor|idProduct} | head -3

    $ATTR{serial}="5567"

    $ATTR{serial}="0A5C3300022031127355"

    ```

    ```


    Create a new udev rule with sudo edit /etc/udev/rules.d/usb-backup.rules and add
    the code (in List 2) to automate it. You need to replace the placeholders [ATTR{idVendor}]
    and [ATTR{idProduct}] with the actual vendor and product IDs from the device output.


    This will automatically trigger a wrapper script when you insert the USB stick.
    You need a wrapper that runs when you remove the stick. you want to make it run
    without. Create the wrapper file backup-wrapper and add the code from List 2.
    Replace with and make it executable (chmod +x ~/bin/backup-wrapper). Use a lockfile
    to prevent more than one backup process when you insert the stick; the lockfile
    prevents you from running two backup tasks in parallel.


    As a final step, reload the udev rules with


    ```

    ```

    $ sudo udev control --reload-rules

    ```

    ```


    which will activate the new rule. Try to run your backups now. You might want
    to modify the scripts so that you will get a notification when the backup is done.


    > Hans-Georg Eber


    List 2: backup-wrapper

    | | |

    |---|---|

    | 01 | /bin/bash |

    | 02 | LOCKFILE="/tmp/backup.lock" |

    | 03 | if [ -e $LOCKFILE ]; then exit 0 |

    | 04 | touch $LOCKFILE |

    | 05 | su -u $USER -c /home/$bin/backup |

    | 06 | rm -f "$LOCKFILE"


    List 1:99-usb-backup.rules

    | | |

    |---|---|

    | 01 | ACTION="add", SUBSYSTEM="usb", ATTR{idVendor}="5567", ATTR{idProduct}="5567",
    RUN+="/home/$bin/backup-wrapper"'
