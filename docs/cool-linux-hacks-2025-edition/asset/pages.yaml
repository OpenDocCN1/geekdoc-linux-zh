    # Fantasy Computer


    All of the projects mentioned so far target real machines, either current or dating
    back to the 1980s. In this chapter we focus on a completely different approach:
    the TIC-80 [3]. It is taken into the category of "fantasy computers" [4] and provides
    you with a coding environment with full-screen code, sprite, map, and sound editors.
    You can write your programs in Lua, Ruby, Python, and few other languages that
    let you display your game, position the sprites, and background music.


    When you start TIC-80 it shows a colorful screen and loads a small example as
    game. It also displays a prompt at which you can type commands. If you want to
    edit the source code, just press Esc it will take you to the code editor. When
    writing games for TIC-80, you place the code for the main loop inside the TIC_draw()
    function. Having a main loop is a standard method of writing games: The idea is
    to run a loop which checks for events that occur. Events can be moved by joystick,
    keys being pressed, running out etc. In Figure 1 the first demo program shows
    the movement (up, down, left, right) and moving positions for a sprite that we
    draw on the screen. If the figure moves outside the game boundary; they are set
    to the cursor keys but to go back to the four directions of a joystick or gamepad.


