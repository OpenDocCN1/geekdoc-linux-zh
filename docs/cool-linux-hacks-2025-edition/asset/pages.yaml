    # Rip Your CDs


    Thanks to Spotify, Amazon, Music, and other commercial music streaming platforms,
    you can quickly access any piece of music and get the party started. The convenience
    has led to a steep decline in physical media. For example, compared to its peak
    in 1999, current CD sales in the States are close to zero (Figure 1), according
    to the Recording Industry Association of America (RIAA).


    +   - Convert the WAV files to MP3. This requires an MP3 decoder; in the Linux
    world, this will usually be a feast, another tool that you run from the shell.

    - Fetch metadata (name, album and tracklist, and release date), and add them to
    the MP3 files. The command-line tool I would let you do that manually.

    - For more comfort use a GUI tool that will help all these steps automatically.
    There are many programs to choose from. A classic tool is Grip [11], but it isn''t
    maintained anymore, so we''re looking at Asunder [2], a modern alternative. You
    can install it on Ubuntu with

    sudo apt install asunder

    Launch the program and insert a CD. After a few seconds, you will see the album
    metadata containing the track list. If you don''t, you will have to find out the
    device name for your CD/DVD/BD drive – see the Find Device box.

    By default, Asunder will create OGG files. The OGG Vorbis format is a free alternative
    to every media player it is compatible with. If you want to play your music on
    a Linux machine, use OGG, but it might make sense to switch to MP3, which you
    can do in the Preferences - you''ll want to change the settings anyway.


    Figure 1: Recorded music revenues for CDs and Cass from 1990 to 2024 (RIAA).


    ![](img/ef948bfad2ff49ba16960a53d116bb79_29_1.png)


    But it''s all coming back, for at least two reasons: Customers have suffered from
    streaming files disappearing because they were retracted by publishers. The streaming
    industry is restricted to music. In some cases, you may lose access to your favorite
    music or movies series if you subscribed to a video streaming service, and Kindle
    tells users of ebooks being deleted or their content modified without warning.
    If you want to keep it, you have to buy a physical copy.

    Also, there''s a resurgence in the audiobook world. It started with the return
    of analog records, then music cassettes, and new formats that are gaining popularity,
    too. (Don''t throw out your cassettes, CDs, DVDs, and BDs, they may need them!)


    # Comfortable Ripping


    Now you''re a CD collector, you''ve noticed sorted and stacked hundreds of CDs
    cases. But it would be nice to have a copy on the computer that you can select
    and rip the CD out of its case. Remember MP3 players? You can rip your CDs and
    turn them into an MP3 collection, but that takes several steps:

    - Rip the audio tracks. The CDs contain raw, uncompressed audio data (basically,
    WAV) files. The default CD ripper (cdparano) is a command line tool.


    # Setting Up Asunder


    Click on Preferences to open the settings dialog. First visit the General tab
    to find a better location for storing your MP3 files; by default, Asunder will
    create a subfolder in your home directory for every album. The generic choice
    on an Ubuntu machine is the Music folder in your directory. You can also enable
    the Eject disc when finishing options. This is useful when you want to rip a large
    batch of CDs: The ripping program will notify you when it''s time to finish.


    On the Filenames tab you can change the way Asunder organizes your tracks. The
    setting for folder names is % - %L: The program will create folders for the artist
    and album name. If you want to see more, you can work with artist folders and
    album folders below these tracks: change the entry %A/%A.


