    Envio is a command-line tool with two main features. It stores environment variables
    within profiles. A profile is a set of environment variables that you might use
    for a specific task. You can switch projects by switching between profiles or
    loading the current set of environment variables and loading the other. The best
    part is that all variables are encrypted with GPG. This means that when you''re
    not active, others of your system will not be able to access them by opening a
    command-line, or see your environment variables in a config file, plan. GPG encryption
    ensures your variables remain inaccessible unless unlocked with your personal
    key.


    The best thing about envi is that it''s easy to use. When you create your first
    profile, it asks you to unlock an encryption key. There are commands for adding,
    removing, and updating keys as well as unloading a profile to return you to your
    terminal''s default state.


