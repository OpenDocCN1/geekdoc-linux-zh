    # Dig a Tunnel with sshuttle


    In untrusted networks, I let OpenVPN tunnel my laptop. There are certainly alternatives,
    and I like to present a particularly simple one: shuttle. As the name suggests,
    it relies on SSH. The tunnel is built as a root proxy and is like OpenVPN. Shuttle
    is very fragile: it needs ssh access with user privileges on the server; however,
    Python must be installed on the server - that is.


    automatically. this is shuttle Achilles: it only transports TCP, ICMP and UDP
    when not pass through the tunnel, from dns.


    This because shuttle loads and executes the required Python code on the server
    after the ssh connection is established. It also verifies connections between
    client and server. The following commands are all you need to set up the tunnel:


    # Congestion Alert


    Whereas other VPN techniques work at packet level and rely on TUN/TAP devices,
    shuttle works at user level. It handles the TCP stream locally, multiplexes over
    the SSH connection, which keeps the status, and it puts packets along the destination
    side.


    ```

    sshuttle -r <user><server>:port 80

    ```


    This avoids the TCP-over-TCP problem that occurs in other tools such as OpenVPN:
    TCP is overloaded by congestion control (congestion control). The protocol defines
    a performance limit on dropped packets. For the inner connection, which can lead
    to buffer bloat.


    You can leave out the port if it is the SSH port 22. The 0/0 means Linux should
    direct all connections to the tunnel. However, this I cannot reach other devices
    in the local network. To keep the LAN local virtual, I define it using the following
    parameter:


    Shuttle can help you if you need troubleshoot. With the verbose option, sshuttle
    is very long-winding, so I recommend redirecting the output to a file that can
    be evaluated. My conclusions: Shuttle is an excellent and simple VPN for people
    who can do without UDP and ICMP.


    ```

    sshuttle -r --dns <user><server> 0/0 192.168.1.0/24

    ```


    is included here. This means that some connections do not run through the tunnel,
