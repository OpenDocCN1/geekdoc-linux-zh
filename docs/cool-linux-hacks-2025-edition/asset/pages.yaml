    # Rymdport: Safe File Transfers


    We liked the brilliant Magic Worm some time ago. It''s a command-line tool that
    sets up an encrypted peer-to-peer file transfer between your machine and any target
    machine out in the winds of the Internet. For this work, a NAT had to be negotiated,
    and then the machine had to find a way to the destination. But Magic Worm handled
    all this transparently, without needing to do more than then send by a path or
    file, receive or by a code that is shown on each of transfers. But Magic Worm
    still requires a little command-line knowledge. This is not something that might
    trouble Linux users and macOS users trying to transfer.


    Goread is a command-line RSS reader that uses a simple configuration file to links
    to feeds and present these within its curated-based UI. It makes the web easy
    and helps you to stay on top of your feeds without reporting them. You can view
    the main list of categories and feeds directly from the configuration file, while
    the main view shows the content of that list feed. With each feed, feeds can be
    selected individually or through different layers of aggregation. Each category
    is shown in a "News" category, which will either list every story from the feeds
    in that category or for specific sources. You can also add a new tab, which can
    be selected with the tab! The configuration file can also be edited with colors
    used to decorate feeds, categories, and stories, and the command line feels like
    a natural place for all this. If you need to follow a link to the upstream story,
    you will need to copy and paste from your terminal or a terminal configured to
    respond to links. That extra step makes goread useful while keeping you updated
    and distraction free.


    Then we needed something more user friendly, an implementation of the command-line
    protocol wrapped inside a graphical user-interface. It was called well-gui-for-which,
    but we had to use a native implementation to get it running well on different
    platforms, so if we had to contact you to link the binaries or if you had to send
    a file too easily. This version, with tabs for sending and receiving files and
    folders, includes a list of transfers and directories. Its best feature is being
    able to show multiple transfers at the same time, with progress bars to show how
    it''s going. The latest version uses a QR code to encode the command word. It''s
    a great solution for anyone who needs to send a file fast, and go on.


