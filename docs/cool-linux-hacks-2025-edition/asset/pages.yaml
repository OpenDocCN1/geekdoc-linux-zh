  md: '# # Scan Your Network with Zenmap


    Zenmap is a graphical front end for the command-line port scanner map. You enter
    an IP address or host name, select a scan, and then click Scan. This will launch
    the map, and if desired, you are ready to start the next scan. Once finished you
    see a new entry in the Hosts column in the left pane: Double-click to see details.
    The host output in the right pane shows what the command-line program, you might
    want to use those lines, but you profit from the GUI when you look at the other
    tabs.


    | Profile Name | Options |

    | --- | --- |

    | Zenmap intense plus | -sS -T4 -A4 -v |

    | Intense scan, all tcp ports | -p 65535 -T4 -A4 -v |

    | Ping scan | -sIC -T4 -v |

    | Quick scan | -sF |

    | Quick plus | -sV -T4 -oF --version-line |

    | Quick traceroute | -sn --traceroute |

    | Regular scan | -sS -US -T4 -v -PE -PP -P3389 -P41418 -F -q 53 --script "default"
    or (discovery and safe)" |


    # SECURITY


    The Ports host shows information about all the open ports that Zenmap detected
    on the machine. If possible it will give you additional information about the
    running services and protocols. The Topology creates a map of your hosts that
    you can scan as machines.


    The default scanning profile is Intense scan, and there are a few other profiles,
    each with just generating a different combination of options (see Table). If you
    want your own, create a new Profile or Command


    or add them at a time via the various GUI options that can be enabled.


    https://nmap.org/zenmap/


    By Hans-Geörg Eber


    Zenmap is a graphical front end for the port scanner map.


    ![](img/ef948bfad2ff49ba16960a53d116bb79_16_0.png)


    Install the program on Ubuntu via apt. install nmap and run nmap on a list of
    files or recursively. For example, you can generate all configs for files in /etc
    or <etc


    ```

    $ nmap -f /etc > /tmp/maphes

    ```


    Run it immediately to see what a positive answer looks like:


    ```

    $ nmap -a /tmp/maphes

    Hashmap: passed

    ```


    With -z you run the audit, -m makes results clearer, and +i replaces the previously
    generated file. Make a change to the scan in file (in edit or delete the file),
    and that will also change the map you just created, add a double (||) -v option
    (hashmap-vark).


    Hashmap lets you choose what methods to hash. By default it uses MD5 and SHA2
    hashes, but you can choose to use all algorithms (e.g., -sha, -md). When running
    the audit, you need not provide the hash list because it''s a security measure,
    you''ll have to store a copy of the hash file on a different computer and use
    that copy for the audits.


    By Hans-Geörg Eber


    # # Hashmap Checks File Integrity


    If you''re using a computer that''s accessible from the Internet, it''s a good
    idea to make sure the machine has not been tampered with by someone in. One way
    to do this is to create checks of important files and occasionally check whether
    they changed. Hashmap (formerly known as md) lets you do this with one-line commands.
    It will create files of hashes. If you store those hashes in a file, you can later
    do an audit. In the simplest way, return an audit: Hashmap passed or failed. However,
    you can use the tool more verbose to find out what the problem is.


    Hashmap has found a file: Perhaps someone changed a password or an alias.


    ```

    user@ubun2204:~$ sudo hashmap -vvark /tmp/maphes

    etc/passwd: no change

    etc/shadow: CIP5 crypt not used

    Hashmap: passed


    Input files scanned:

    Known files: 8

