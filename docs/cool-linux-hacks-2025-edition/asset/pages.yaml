    # ## Check Your Downloads


    When you download Linux distributions from the Internet, you will often get those
    files from a mirror and not from the official project''s web server. This introduces
    some risk as attackers might take over your ISO with a malicious version that
    contains a rootkit or other malware.


    On official projects, you will typically find one or more checksums which contain
    a list of checksum/filename mappings, such as:


    ```

    73975f118cb9c3d2:9876e9bd79c1e28b3a480f732

    d8b36f2a0ec:openuse-leap-15.4-cr-0vd6-x86_64f-

    ```


    # Secure Your Notebook


    If you use Linux on several machines and at least one of them is a notebook, you
    may find yourself regularly logging into computers via SSH. That requires entering
    a password which is why many users prefer active public-key based logins. Creating
    an SSH key with ssh-keygen and copying the public key to the target machine''s
    `ssh/authorized_keys` file allows you to log in without a password. The ssh client
    asks for the passphrase that was used to encrypt the key on the source computer.
    Furthermore, the passphrase is often left empty so that it is simple to login
    or simply execute a single command on the remote machine without any interrupt.


    The long string that is made of hexadecimal digits (numbers 0 to a and f) is a
    large numerical value, a checksum that was calculated based on the checksum of
    the file name is right next to it. After downloading the ISO, you can open a terminal
    window, cd into the download folder, and run the checksum tool to repeat - in
    the example the right tool is sha256 because the checksum generates the cryptographic
    hash function SHA-256.


    ```

    sha256 openuse-leap-15.4-iso

    ```


    to calculate the checksum of the ISO image - if the same value was stored in the
    official checksum, it''s perfectly to ensure that the file has not tampered with
    (see the following). You may find a checksum that was created with a different
    tool: MD5 and SHA1 are the most popular choices, but both are obsolete.


    If you lose your notebook or if someone steals it, they get access to all your
    SSH keys and can log in on all the machines that you use for remote work.


    to enable a passphrase on those computers that you do, so run ssh-keygen -p to
    modify the passphrase of an existing key (instead of creating a new one). The
    tool will now ask for the key file location (and suggest the default ~/.ssh/id_rsa
    if you did not specify a key type at the time of creation). If you create several
    pairs of keys (RSA and DSA), check the contents of your ~/.ssh folder to know
    which one you are using.


    > —phrase, and you''re done from now on, you''ll have to enter it each time you
    want to use the key to a remote machine. Run ssh-keygen -p again and just press
    Enter when prompted for the new passphrase to update the key. You will only need
