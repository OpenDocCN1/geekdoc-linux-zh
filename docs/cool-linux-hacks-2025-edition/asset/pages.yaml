    # Index and Search Your Files with Recoil


    While I love my collection of real books, both technical books on computing and
    novels, ebooks do have many advantages. For example, I can search the PDF version
    of a large reference book more quickly than I can look up topics in its paper
    edition. Whenever possible, I buy both a print and ebook and enlarge my digital
    collections; I''m also a fan of the Humble collections [1] that I turn up in my
    media feeds every now and then.


    Ubuntu''s default document viewer Evince [2] lets me read PDF files but also of
    other text documents, and its function is fast and comfortable. But for these
    efficiency ebooks had better be indexed so we can search in all of them once.
    A great tool that will let you do that: Recoil [3] is a comfortable front end
    for the Xarian search library [4] that can index any number of files. It will
    also look into all kinds of indexed files, and will work recursively. As the developers
    say: "Recoil will find an MS-Word document stored as an attachment to an email
    make a Thunderbird zip file (and more."


    To get started, I use the recoil package and run Recoil from the starting application.
    The app will show some hints and let you click on Indexing (you''ll get back there
    later via Preferences) to choose the directories that you want Recoil to index.
    You can also exclude directories below. When you are done, close the window and
    click on Start Indexing. If you add or de-index files to the index, just run Recoil
    again.


    Searching is as simple as typing keywords into the search bar. You can look up
    word combinations just as you would with Google. If you have a short search, Recoil
    will describe the search results. The result list has items that will run the
    default viewer for the found documents. For search results PDF files, you can
    also click on Snippets and Recoil will open a new window with a short preview
    of the PDF from the page that it contains (Figure 2-1) - this is extremely useful
    because the snippet is fixed by the page number for the page it''s on. When you
    click on it, Recoil opens the PDF file in your default PDF viewer, jumps to the
    right page, and highlights the keyword.


    By default the result list only shows the first eight results, and you can click
    here and more to see


    Figure 1: Recoil finds keywords in your indexed files and snippets with context.


    ![](img/ef948bfad2ff49ba16960a53d116bb79_28_0.png)


    pages. If your text is long off simply open the Preferences UI configuration,
    to get the Result List tab and set the number of entries to something larger;
    I set it to 100. The app will show a short wait as Recoil prepares the snippets,
    if it prefers over to waiting.


    If you''d rather to search in a terminal window, in its simplest form, you provide
    a short term as an argument, and Recoil will list the documents containing that
    term. If it shows them as file // with full path, Gnome Terminal lets you right-click
    and open the file in the default app.


