    \ Multiple Linux Distros in Parallel\n\nDistrobox [1] lets you install Linux distributions\
    \ on your regular Linux PC without the need to partition your disk, reboot your\
    \ machine, or create a virtual machine. Reasons to include trying out an application\
    \ that works seamlessly with some other distro but not yours, or whether your\
    \ base distro creates packages that install and run on various distributions across\
    \ software development.\n\nDistrobox uses containers, so you'll need Podman (the\
    \ suggested [2]), Docker, or Libman. This hack covers installation and configuration\
    \ section (see p. 48), you don't need to think about containers when using Distrobox.\
    \ The environments you're going to be much more tightly integrated with your main\
    \ system than a regular container would be. For example, you can start a graphical\
    \ application in container seamlessly without setting up X or some other way to\
    \ access the desktop. On an Ubuntu machine,\n\n```\nsudo apt install\n```\n\n\
    to install the software. (For Ubuntu 22.04 and older versions, there's a PPA you\
    \ need to add\n\n```\nsudo add-apt-repository ppa:michael/distrobox\n```\n\nbefore\
    \ you can find it. Testing on Ubuntu 24.04 and 25.04, the package was found in\
    \ the default repositories.)\n\nIf you've previously used containers, the apt\
    \ will also install Podman, but if you're already using Docker, it will use that\
    \ container. After installation, run distrobox create - to see which distributions\
    \ are available. For my tests, I wanted to filter the first 100 lines of output\
    \ (Listing 1) to find openSUSE entries. You can join up a new box, but that will\
    \ give you defaults (use the latest Fedora kernel to create your distribution\
    \ - that is Fedora 39 on Ubuntu 24.04 or Fedora 44.1 on Ubuntu 25.04 and name\
    \ it my distrobox), but if you want to use something else, you'll need the -i\
    \ (image) and -n (name) options. To create a box with the latest openSUSE Tumbleweed,\
    \ run\n\n```\ndistrobox create -i registry.opensuse.org/opensuse/ \ndistrobox\
    \ -n use\n```\n\nNow that all is leaving entering the box. Unlike containers,\
    \ you won't need to repeatedly create and destroy containers over and over again.\
    \ Instead, you set up a once, and then you can use that container and keep it\
    \ running to. Type\n\n# Listing 1: Find Supported openSUSE Versions\n\n```\n$\
    \ distrobox create -c | grep -i opensuse\nregistry.opensuse.org/opensuse/distrobox:latest\n\
    registry.opensuse.org/opensuse/leap:latest\nregistry.opensuse.org/opensuse/toolbox:latest\n\
    registry.opensuse.org/opensuse/tumbleweed:latest\n```\n\ndistrobox enter\n\nto\
    \ enter the box you've created. When you do for the first time, the start script\
    \ will show you to install some additional packages – that depend on the distribution\
    \ and version. Then you're asked to set a password for your account, you will\
    \ need when you want to use sudo for running programs with root access (e.g.,\
