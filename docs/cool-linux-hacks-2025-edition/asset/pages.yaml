  md: '# SECURITY


    ![](img/ef948bfad2ff49ba16960a53d116bb79_17_0.png)


    # diceware: Passphrase Generator


    Most Linux users are familiar with the tongue-in-cheek comic that shows someone
    trying to generate a "good" passphrase as such:


    b408\. While you''re not going to find it in the dictionary, the passphrase contains
    around 28 bits of entropy and could take just a few to crack.


    Passphrases are also famously difficult to remember. If, on the other hand, someone
    uses four random dictionaries (e.g., "correct horse battery"), this provides around
    40 bits of entropy.


    is much easier to remember. The Diceware method is based on this. In its original
    implementation, it involved rolling six-sided dice from a list. It wasn''t long
    before various versions became available, and a new one emerges every few months.


    Such passphrases are six words, capitalized without spaces. For better security,
    use the "-d " to delimit them such as a dash.


    Each word adds 12 bits of entropy. Each version of Diceware supports different
    dictionaries, including the Electronic Frontier Foundation (EFF) which contains
    no offensive or problematic words. As an Englishman, I prefer the Beale dictionary,
    because it contains fewer words, which are often misspelled by others.


    The easiest way to remember diceware phrases is to imagine a familiar place such
    as your high school and then placing objects in each room. For instance, if the
    first word is "hello," you could imagine someone snoring loudly in the main entrance.
    If the next word is "hello," you could imagine a mountain moving out of your high
    school, and so on.


