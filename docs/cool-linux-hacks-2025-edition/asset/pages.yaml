  md: '# Use a Second User Account


    If you''re planning to do some heavy modifications to your desktop configuration
    or just trying to try a different desktop environment, there''s a risk that you
    will break things in a way that makes it hard to undo.


    A safer way is to use a new user account and run the tests with it. However, a
    new account has its own directory, and documents, and all your files reside in
    your home directory; you won''t be able to access them from where you''re at.
    Make the new account use the same directories, but not the complete home directory—that
    way, the new account will have individual files and folders.


    Making this work requires two things: first, you need to let the new account access
    your files; second, you must make the new home point to the original folders.


    # New Account, Old Group


    Granting access is simple. Start a root shell by typing sudo in a terminal, then
    create a file /usr/sbin/bindout that contains the lines in Listing 1, and make
    it executable (chmod +x /usr/sbin/bindout). Now, with your new account, run it
    with your argument:


    script for task: Put the code from Listing 2 to /usr/local/sbin/bindout and make
    that executable; for every folder that you want accessible to the new account,
    for example:


    +   * bindout /home/user/Documents

    * bindout /home/user/Music

    * bindout /home/user/Videos


    (with your username instead). The script does a lot of things, but performs no
    checks, so make sure you understand what it does before trusting and running;
    it stores the first argument in USERNAME and uses realpath to get the full path
    of the argument (which is if you provide a relative path). Then it performs a
    search and changes the ownership of the old folders to the new user; in case of
    my example: "2"


    (if USERNAME does not exist, it will be created with mkdir -p $USERNAME). The
    script makes sure that all folders have the right owner and group (chen), and
    it finds them recursively and adds the necessary access permissions for directories
    (rx for group members) and for files (rx for group groups).

    Finally it adds entry to /etc/fstab looks like this:


    ```

    /home/user:/home/user/Documents ? 2

    ```


    (for the Documents folder) and runs out to mount unless is the "bind mount." Then
    it will run


    ```

    mount -o /home/user/Documents=/home/user/2

    ```


    command so that when you access the folders in the new home directory, you actually
    reach the folder in the old directory. Having fstab entries is needed so the folders
    will be mounted when you reboot the system.

    In principle, you could resolve this issue with a few scripts—they''d create the
    bind mounts and then mount them during boot—whereas a bind mount-folder looks
    like any other directory.


    # Folder Access


    Next you need to grant the new account access to the folders you want to use with
    them. Use another script


    Listing 1: dup Script


    ```

    01 #!/bin/bash

    02 USERNAME=$1

    03 GID=$(id -g $USERNAME)

    04 us=$(mkdir -d /bin/bash $USERNAME[$2]

    05 UID=$(id -u $USERNAME)

    06 PWD=$(get passwd $USERNAME | cut -d: -f6)

    07 useradd -p "$PASSWORD" $USERNAME[$2]

    ```


    Listing 2: bind Script


    ```

    01 #!/bin/bash

    02 USERNAME=$1

    03 REALPATH=$2

    04 NEWFOLDER="/home/$USERNAME/${USERNAME[3]}"

    05 mkdir -p "$NEWFOLDER"

    06 chown -R $USERNAME:$USERNAME "$NEWFOLDER"

    07 chmod -R 755 "$NEWFOLDER"

    08 find "$REALPATH" -type d -exec chmod 755 {} +

    09 find "$REALPATH" -type f -exec chmod 644 {} +

    10 echo "$NEWFOLDER none defaults 0 0" >> /etc/fstab

    11 mount && echo done || echo failed

    ```


    ```

    echo ... /home/user ...bash

    ```


    (with a double greater than,),

    If you ever want to delete these, first unmount newly created bind mounts (/home/$USERNAME);
    ignoring errors), remove the new mount entry from /etc/fstab and then delete the
    user account with userdel -$USERNAME.


    By Hans-Georg Ebers


    LINUX COOKS - 2025


    15 Thomas Thiel'
