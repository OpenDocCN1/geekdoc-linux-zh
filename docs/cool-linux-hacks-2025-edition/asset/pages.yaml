    # # Run a Simple HTTP Server: weborf


    The worse tool mentioned in Hack 46 is perfect for one-offs, but not all that
    great if you want to share more than a single file or leave the tunnel open so
    that you don''t have to keep renegotiating keywords. There are other ways to do
    this, but weborf is almost as simple to use as weborf.


    weborf (see figure) sets up a simple HTTP server, just like Apache in the old
    days to share the contents of /srv/www. This makes it superbly flexible, not just
    from a web browser, but from almost anything with access to the network WebDAV,
    with, from virtual root server command and CGI scripts. You specify the port to
    use (--port) and a folder to share ( -d ), and all the client has to access your
    IP address with the correct port. You can run it in the background as a daemon,
    use authentication, and listen only for comments from your specific IP addresses.
    If the command offers too many options, weborf (in a separate package), a convenient
    Qt-based GUI can run to handle all this semiautomously, adding the ability to
    NAT traverse files outside of the local network and sending directories as .tar.gz


    ![](img/ef948bfad2ff49ba16960a53d116bb79_77_0.png)


    By Graham Morrison


    # # Use screen in SSH session


    Imagine that you are running a session via SSH and a command that will take some
    time to complete (as a build process). If the computer''s going to sleep or temporarily
    loses your network connection, the SSH connection will drop. The remote machine
    will terminate and all processes started in that session will kill your build.


    There are several things you can do to avoid this scenario. An old trick is to
    prepare for network updates and connection loss by running processes in the background
    and making they ignore the hup signals that are sent when connection loss. For
    the build process, that might be


    ```

    nohup

    ```


    instead of a simple command. A side effect is that all output will be written
    to an out.file, not in your terminal.


    My preferred selection does not require nohup or similar tricks. I prefer to use
    screen in sessions. (If your machines don''t have it installed, the package is
    happily called screen).


    ![](img/ef948bfad2ff49ba16960a53d116bb79_77_1.png)


    When screen starts, it displays a message about copyrights and licenses; Press
    return to exit. Then you can continue to use it as shell. If you lose the connection,
    reconnect to the remote machine and run screen -r to reattach to the session.


    Maybe you''re not sure there is a screen session - run screen -ls as an option
    for that:


    There is a screen on:


    ```

    etherserver-hp-2420 -s 16-

    16712.1.hp-2420 (05/06/2019 11:24:49 AM) (Detached)

    1 Socket in root/screen/5

    ```


    You can automate the procedure of logging into the remote machine and checking
    for screen sessions. Create a file - ~/.bash_login (if you don''t already have
    one) and add the following line to:


    ```

    screen -dev/null screen -s

    ```


    That way, when you log in the session you will be notified about it (see figure).
    (Bash only executes ~/.bash_login)


    If you want to detach from a running session, press Ctrl-A, D. There are many
    more things you can do with screen - check the main page and a few of them.


    By Hans-Geer Eiber


    ![](img/ef948bfad2ff49ba16960a53d116bb79_77_2.png)


