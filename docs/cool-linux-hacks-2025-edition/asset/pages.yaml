  md: '# # Try Nushell, a New Shell


    Every now and then, there''s a new shell to win over deaded Unix and Linux Users.
    It''s quite the task, because many who like the shell it like especially for the
    speed at which it lets navigate the filesystems, run relevant tools, and get them
    done. "Never change a running system," the saying, and using a very different
    shell is a big change.


    Nushell is different in how it treats outputs as pipelines working on tables (and
    not on simple lines like text). If you''re also familiar with Powershell, the
    modern Windows shell, you''ll recognize this approach.


    On Ubuntu you can easily install the Snap package by


    ```

    sudo snap install --classic nushell

    ```


    There''s also a Debian package, which you''ll need to add a GPG key to your repository
    sources to install it; the project documentation shows how to do. Both methods
    install the same version of Nushell.


    Type nu to start the shell. As first example, you can look at the output of one
    of the most important commands. ls has an internal version that creates tables;
    you can also run /bin/ls, but you won''t benefit from it as much.


    ls -1 will output a table with 14 columns. If you need some of them, you can filter
    and select then sort with sort-by. A complex example follows


    ```

    ls -1 | select name user size | sort-by row | modified | format row {row}

    ```


    select the name, user, size, and modified columns, reverse-sort by modified date,
    and "2 days ago" to a readable datetime string.


    Nushell can also query websites, parse JSON data, and work with their features;
    there''s a section ''cool liners'' in the GitHub repo that shows useful tricks.


    > By Hans-Geörg Eiber


    https://www.nushell.sh/


    https://github.com/nushell/pipelines/tree/main/cool-liners


    Nushell''s pipelines show table of lines of text.


    ![](img/ef948bfad2ff49ba16960a53d116bb79_88_0.png)


    COOL LINUX HACKS - 2023


    89


    If you regularly look at scripts, source code, or ASCII documentation files, you''ll
    need to take a peek with less or even head (which by default gives you the first
    10 lines of the file). When you know the file is short, you can also use cat;
    which writes the whole file to the console. The tool also handles binary data,
    so one of its uses is re-concatenate (hence the name)


    A common problem for Ubuntu users is that you will find it in the repositories
    (so apt install) instead of just. As Ubuntu also provides a different tool with
    the same name, the executable was renamed to batcat to avoid conflicts. So, on
    an Ubuntu machine, you use batcat, and so on.


    You just like cat, but it will use the file syntax highlighting and highlighting
    lines, and it does not follow the terminal window without wrapping; it automatically
    pipes the output through the pager. It will not support all the format options
    but with help (e.g., -- bash if you are in a Bash script).


    Use a color to improve visibility; for light backgrounds the Coldcat-Dark theme
    can be enabled for a single command like this


    ```

    batcat --theme Coldcat-Dark filename

    ```


    If you would like to change your default theme, you can generate and edit a configuration
    file


    ```

    batcat --generate-config file

    ```


    and add the line


    ```

    --theme Coldcat-Dark

    ```


    Save the file, and batcat will use the new colors. batcat has many other features.
    For -x removes the file header, -n25-29 highlights lines from 25 to 29 (the below)
    with a different background, and -d displays all special characters, including
    tabs and line breaks. Check the man page.


    > By Hans-Geörg Eiber


    https://github.com/sharkdp/batcat


    Use bat:cat for some extra features, using syntax highlighting.'
