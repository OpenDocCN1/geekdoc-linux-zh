  md: '# Watch Your Configuration with eckeeper


    # Caffeine Literally Keeps It Running


    The easiest way to break running Linux system is to make a changes to config files
    in the /etc folder. Eckeeper keeps track of such changes using the Git version
    control software, and automatically integrates with package managers like APT.


    Traditionally, operating systems came with a screensaver CRT monitors would show
    when they are idle in then display the image over an extended period. With modern
    display technology, this is no longer an issue, but there are other reasons why
    a screensaver is useful: it saves energy, and when combined with automatic locking
    it can provide security in a public place, leave your notebook for a few minutes,
    and forget to lock


    To install eckeeper and get started, just run the following commands:


    However, there are situations when you don''t want the screensaver to engage.
    One situation is during a presentation, when you take a little too long explaining
    the current talking point. That''s a scenario where you want to try out Caffeine:
    the program can add a coffee icon to the menu that lets you trigger the activation
    state. Click on Activate, and then it will make your screen go black; turn it
    into a steaming cup of coffee. Click the icon again, and you''ll find the menu
    has changed to Deactivated. You don''t need to mess with anything, just toggle
    between and off. And as long as you use the steaming version of it, Caffeine will
    prevent the screensaver from starting.


    ```

    $ sudo apt install eckeeper

    $ sudo eckeeper init

    $ sudo eckeeper commit "Here we go"

    ```


    On branch master

    nothing to commit, working tree clean


    The last command is the initial commit. Now on, just eckeeper will catch any changes
    to config files right after you made them, and provide a meaningful commit. If
    you want to check what changes the tool would detect before committing, you can
    ask it for the status:


    ```

    $ sudo eckeeper status

    ```


    As a typical modification, creating a new user makes changes to a number of files,
    which eckeeper will track if you commit the changes right afterwards:


    ```

    $ sudo eckeeper --user=tester

    $ sudo eckeeper commit "added user tester"

    [4f2f36d4444] added user tester

    Author: <esser@ebub28b44.com>

    11 files changed, 9 insertions(+), 3 deletions(-)

    ```


    Package managers will automatically run eckeeper when they update or install software,
    with apt:


    ```

    [66c363] changes in /etc/apt by apt install

    Author: <esser@ebub28b44.com>

    64 files changed, 383 insertions(+)

    mode 100644 new file

    ```


    How does eckeeper run automatically? It uses a "hook," into integration APT, which
    is configured in /etc/apt/apt.conf.d/@0


    If you want to change the entries, check the directory and run `ls git` for eckeeper
    vs any other.


    On Ubuntu, you can use `apt install-caffeine` to install the binary to your menu
    appear. After using caffeine-indicator, you can also run it through caffeine,
    for


    the Firefox browser. That''s when you''re going to use the program in full-screen
    mode, which would hide Caffeine. The package contains a third binary (just caffeine)
    that''s supposed to run on screensaver without the need for clicking an icon,
    but that did not work in my tests.


    > By Hans-Georg Eeber


    https://linuxpad.net/caffeine


    Use eckeeper to keep your eyes on your configuration files.


    Middle-click coffee icon to turn off Caffeine and keep the screen on.


    ![](img/ef948bfad2ff49ba16960a53d116bb79_6_0.png)


    See the main page and /share/doc/caffeine/RE-ODE.adn for more details.


    By Hans-Georg Eeber


    https://eckeeper.branchme.com/


    # COOL LINUX HACKS - 2025 EDITION'
