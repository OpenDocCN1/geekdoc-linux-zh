  md: '# # Keep Track of Your Collections with Tellico


    Are you the collector type? If you want to keep track of your collections, you
    should try Tellico, a KDE program that stores and search information about your
    books, bibliographies, videos, music, video games, board games, comics, trading
    cards, color books, and those are the collectibles that Tellico has default for;
    you''re free to set up your collection for other areas.


    > Figure 1: Tellico lets you search several websites to find book metadata.


    You can also deal with more than one category, for so if you collect books, coins,
    and Blu-ray discs, you can create three collections and store data in the appropriate
    collection files. That makes sense, because databases use different fields - for
    example, a book does not have a search field for tracks and subtitles, and a video
    was not produced in a mint that makes coins. Also, Tellico will add entries to
    your collection via a web search, and it gets different depending on the type
    of item you collect. For example, you can use Between, Comic Vine, and Connect
    for comic books, which is ISBNdb, Open Library, Google Search, and others for
    readers. Sadly, you cannot use Amazon search unless you have an Amazon account
    and an API key.


