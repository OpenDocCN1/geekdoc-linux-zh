  md: '# ssc: Script Compiler


    The Simple Script Compiler (ssc) converts scripts to a binary format. You will
    need to build the tool yourself from the source code.


    To convert a script to a binary, pass the name of the script to ssc, along with
    the name of the future binary, and ssc converts the code into an ELF file. Among
    others, ssc supports Bash, Perl, Python, Node.js, Lua, and Ruby. By default, the
    program uses libraries for dynamic linking; use --static to create a static binary,
    although this will be the size of the resulting file. The -e option allows ssc
    to integrate a predefined interpreter into the binary. From analyzing the script,
    you can adding debugging which checks at start whether a debugger is active and
    needs it.


    While ssc cannot compile scripts with a size greater than 8MB, it can at least
    hide them from prying eyes by encrypting the code with RSA. To decrypt, use the
