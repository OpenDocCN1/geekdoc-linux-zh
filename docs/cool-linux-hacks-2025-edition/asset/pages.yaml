  md: '# Ardour 8: Music Workstation


    It''s fantastic being able to write about a major Ardour flourishing every year.
    It''s a sign that the process is flourishing, both with its modest financial support
    and with the development efforts that go into each release. When there''s so much
    discussion about how open source projects can be funded, Ardour is a great example
    of what can be accomplished with binary downloads behind a subscription model.
    The release of Ardour 8 also feels like an inflection point in the project''s
    own development trajectory because it is made with a creative has rather than
    a productive one. Most of its new features were targeted at the creative stage
    or compositional stages of the music-making process, rather than the production
    or mastering stages. And even more important, they target metadata rather than
    the audio data, which has traditionally been Ardour''s.


    A great example of Ardour''s new creativity is being able to use "lollipops" to
    edit the velocity values for MIDI notes. Velocity for each note has been editable
    but only by selecting each note individually. Velocity is now in its own "lane"
    between the notes, you can still edit individually or drag the cursor to change
    multiple values at once. The lollipop sticks will adjust themselves accordingly.
    You can also freely draw curves by dragging the mouse across lanes, rather than
    editing each point individually. This makes controlling such as a filter cutoff
    or mask much more intuitive while still retaining the sampling-accurate interpolated
    automation integrated into Ardour. MIDI tracks now have notes that are more easily
    editable. This is particularly useful for tracks when the label is used to show
    which triggers which drums, but they''re also handled when you use scales that
    differ from the standard-127.


    The best new features, however, are thanks to a third-party contribution using
    Lua to create three new


    The clip view was the major new addition in the previous release, augmented in
    Ardour 8 by support Launchpad Pro.


    > Ardour 8 is one of the best digital audio and MIDI applications you can install
    on any platform, at any cost.


    arpeggiators are a classic note-generating tool that will create variations of
    the notes you input. Enter the C, E, and G for a C-major chord, and an arpeggiator
    will trigger in rising, descending, or random orders. Ardour''s arpeggiators can
    do this, but they can also add rhythmic accents to notes when they synchronize
    with the current time signature. However, the random arpeggiator is the most fun
    to play with. This offers over control which will affect all selected notes. This
    is very useful for creating serendipitous incorporate into your music. It is now
    included in Ardour also as an algorithmic composition arpeggiator called "Raptor."
    This includes filters, conditions for output limits, and things that were usually
    ignored.


    The production stage has become easier to use and more intuitive. You can now
    select more than one channel to create a "group," so that control you make will
    affect all selected notes. This is very useful for creating patterns you can also
    create for or bus groups to ensure many channels with the same sync signal. You
    can select more than one note in a region or group and record these together like
    with the elements of the diagram in Logic.


    The project timeline is adjusted dynamically without a fixed grid or track. This
