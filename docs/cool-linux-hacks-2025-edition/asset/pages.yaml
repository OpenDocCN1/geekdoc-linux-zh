  md: '# Run Ancient 32-Bit Programs


    If you are using Linux for a while, you may go back to the days when 32-bit machines
    were the norm. Today, we use 64-bit processors, and by default we won''t be able
    to run 32-bit apps. Ubuntu 17.04 was the last Ubuntu release that included 32-bit
    install library by default, and a year later Ubuntu 17.10 had to switch to 64-bit
    only since then, you have to switch them manually.


    However, that does not mean that you cannot run classic applications. It does
    some work, though, if you install a compatibility layer. Run dpkg --architecture
    to reveal your current architecture (x86_64) and dpkg --foreign-architecture for
    other supported architectures (normally). Then add the 32-bit architecture (i386)
    and can


    ```

    $ sudo dpkg --add-architecture i386

    $ dpkg --foreign-architecture

    ```


    So far you''ve changed a configuration option for the apt package manager. When
    you update the repository data with apt update, the output of the command will
    show some entries twice—once for the default architecture and once for the other.


    Trying to run a 32-bit binary will not work at all. The attempt to run an binary
    on a 64-bit Debian system as shown in Figure 1: The first command (file) establishes
    that it is, in fact, a 32-bit LSB executable. The second command uses ldd to find
    what libraries to load, and fails already, claiming that it is not a dynamic executable
    clearly stated. Then an attempt to run it (which has proper +x execution rights)
    fails. The command shows the origin of the problem: The 32-bit binaries need an
    ''interpreter'' to load them into memory and start. For 32-bit Linux that would
    be /lib/ld-linux.so.2, which is missing.


    What it takes is to getting the correct interpreter (ld-linux.so.2), and then
    the libraries that it needs. First install the interpreter:


    ```

    $ apt install libc6:i386

    ```


    That will make the ldd command work correctly and inform you about missing 32-bit
    libraries.


    ```

    $ ldd

    linux-gnu.so.1 (0x7f7e8000)

    libc.so.6 => not found

    libc.so.6 -> /lib/i386-linux-gnu/libc.so.6 (0x7f7d5000)

    ```


    # Listing 1: Failing to Run a 32-Bit Program


    ```

    $ file IS

    $ ELF: 32-bit LSB executable, Intel 80386, version 1

    (SYSV), dynamically linked, interpreter /lib/ld-linux.

    so.2, [Shared]=0x7f123791417722262d317b47fc8c899

    42a2a0, Gnu/Linux-ld.3.2, 0.shared

    $ ldd

    $ not a dynamic executable

    $ bash: No such file or directory

    $ /lib/ld-linux.so.2

    $ cannot access /lib/ld-linux.so.2: No such file or directory

    ```


    In this case, if linux.so.6 is missing, installing the 32-bit version of the SELIX
    library with sudo apt install liblinux will be enough. Depending on a program''s
    age and the Linux distribution you''ve found it may require a few extra steps.
    For example, Listing 2 shows what was needed to get the old image viewer from
    xv 1994 to run on Ubuntu 24.04. The developer''s final release is available as
    an RPM package, and it needs old versions of the JPEG and PNG libraries. The figure
    shows that it works just fine if all its dependencies are met:


    By Hans-Georg Eißer


    +   [1] https://releases.ubuntu.com/releases/zesty/

    [2] https://xv.trilon.com/downloads.html


    # Listing 2: Installing xv


    ```

    $ 01 wget xv-3.18a-13.i386.rpm

    $ 02 sudo apt install rpm

    $ 03 rpm -i --nodeps xv-3.18a-13.i386.rpm

    $ 04 apt install libjpeg2:i386

    $ 05 wget https://archive.debian.org/pool/main/libp/libpng/libpng16-16_3.9_amd86.deb

    $ 06 dpkg -i libpng16-*.deb

    $ 07 chmod +x ./xv to make it permanent

    $ 08 export PATH="$PATH:/usr/i386/bin"

    ```


    The ancient viewer xv has some helpful features. It can resize, crop, invert,
    and more, and it''s just as fast.


    ![](img/ef948bfad2ff49ba16960a53d116bb79_8_0.png)


