  md: '# HACK 117


    # Improve Shell

    Performance by Swearing


    Do you find yourself using inappropriate swear when you''ve mistyped a command
    and the computer doesn''t do what you intended? Now you can turn swearing into
    productivity—simply fuck after a mistake, and the shell will select an improved
    version of your command.


    That will only work once you''ve installed "The Fuck" (on Ubuntu 20.04, or similar).


    ```

    sudo snap install --beta-classic fuck

    ```


    and on openUSE, use Python''s installer pip and run


    ```

    pip install fuck

    ```


    which should also work on other distributions. You will also need to add a line
    to your Bash start script to define a function:


    ```

    eval $(fuck--alias)

    ```


    at the end of ~/.bashrc you''re ready to go: Close and reopen your terminal and
    type something that''s slightly wrong, for example:


    ```

    apt install bc

    ```


    That command means "a" in word "install," so apt will complain. Just type fuck,
    and your new helper will suggest the correct command—all you need to do is hit
    Return to run. If you had planned for something else, try using the cursor keys
    to select alternative corrections. If nothing is right, hit the right key Ctrl+C.


    # Record Your Shell Swearing


    Imagine you want to explain to a friend or colleague how to perform a specific
    task on the command line, or you might be having trouble with a shell command
    and want to record it.


    In such a case you often copy and paste a few commands, perhaps with the outputs
    they generate, into email. Or you''ll take a screenshot or a short video. If you
    don''t need to share anything except your terminal, there is a better option:
    Use a script, a program that was introduced by 3.OBSD.


    Run it as follows to capture and output in recording.sc and the timing information
    (when you press key?) in recording.time:


    ```

    script --time=recording.time recording.sc

    ```


    Now perform all what you recorded, and when you''re done, exit the shell, and
    the recording will stop.


    ```

    scriptplay --time=recording.time recording.sc

    ```


    and the session repeats itself. All keys pressed (including corrections, cursor
    movements, etc.) are visible in the same speed at which you typed them.


    Recording and playback work even nicely when you use a pseudo-graphical program
    like the Midnight Terminal. You only need to make sure the terminal is at least
    as large (lines and columns) during playing back as you are recording. The background
    might look weird when you use a larger window for playback (see figure).


    # A little can solve your problems.


    If you prefer to use another name for the function — you can use a different name
    — change the line in ~/.bashrc


    ```

    eval $(fuck --alias)

    ```


    and the magic command will turn to off.


