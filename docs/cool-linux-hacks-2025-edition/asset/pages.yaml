  md: '# Shell Genie: Use AI to Generate Shell Input


    Artificial intelligence (AI) has dominated the IT world and the media for months.
    The tone of the reporting has ranged from "benefactor of mankind" to "threat to
    humanity." To keep the ball rolling, I have created Shell Genie, a new (1) tool,
    which uses AI to try and make shell life a bit easier for us.


    The Shell Genie command-line tool answers your queries with commands that can
    be executed immediately. You can use two models with Shell Genie: GPT-3.5 or Free
    Genie. GPT-3.5 is the current version of ChatGPT by OpenAI. You will need an API
    key (which costs $20 and includes ChatGPT) to use it as back end. As an alternative,
    you can use Free Genie, a free model maintained by Daniel Castillo, the developer
    of Shell Genie. Shell Genie can be triggered by user input with prompt.


    guarantee that the server running Genie will be available all the time. Most crucial
    to Shell Genie functions correctly is identifying the under operating system,
    because Shell Genie answers questions to OS (Figure 1).


    # Gifted at Language


    The prompt for Shell Genie always starts with `shell-genie ~, followed by a statement
    in quotes. If you have already worked with ChatGPT or similar tools, you will
    be familiar with the principle. The more precise the question, the better the
    answer (Figure 2). You can pose questions in English, and also in other languages.
    In testing, I found that asking questions correctly in English yielded the best
    hit rate. However, most of the time, Shell Genie returned responses to questions
    asked in German.


    # Installation


    The easiest way to install Shell Genie is to use pip, an installer for the Python
    Package Index that exists if you use your distribution manager to install the
    pipx package. You can then install Shell Genie with:


    ```

    pip install shell-genie

    ```


    For the current 0.10 version, you need to have Python 3.8 or higher installed.
    Install the tools to `~/.local/bin`. If you get a message that the directory is
    not in your path, you can fix this by adding a new terminal variable or logging
    out.


    Next, you can initialize it with:


    ```

    shell-genie init

    ```


    When initializing, you need to choose the back end. If you choose Free Genie,
    you need to determine whether you want to provide feedback on questions you ask
    and command output in order to improve the free back end. Shell cautions that
