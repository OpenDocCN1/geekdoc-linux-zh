  md: '# Firefly Synth: Polyphonic Sound Generation


    Firefly Synth starts with a software synthesizer. Despite its name, it doesn''t
    recreate the sound of flying insects. Instead, it''s capable of producing a range
    of fully complex sounds, from beautifully sweeping strings and bass-melodies to
    percussion and ear-drumming phasors. It does all this from a user interface unlike
    any other software synth, featuring skeuomorphism with practical and instant access
    to dozens of its features. The only downside is that there are so many features,
    it''s difficult to cram them all into the interface, making it more than it really
    is.


    Sound from frankly uses one of five oscillators. More conservative synths such
    as the Mini Moog offer three, or sometimes, but few here share the same features,
    which can be unique for each oscillator. With start each oscillator offers a set
    of maps from which sound is generated. Alongside the sawtooth, triangle, and square
    waveforms are digital distortion modes for waves, plus Karplus-style modelling
    of plucked sounds. These can be combined or isolated across all five oscillators.
    As with the duplicate entries there use a small table to represent each oscillator
    with common settings. This approach is copied across other sections of the synth.
    For example, there are examples for each voice, which include a state variable
    filter and individual voice filters.


    Firefly also describes itself as a "semi-modular" synth. In the physical world,
    a semi-modular synth is one that makes sounds without any configuration, but can
    also be patched using cables to reroute the control signals and the audio signals
    to create a modular flow. Firefly doesn''t have a modulation matrix, but you can
    connect the output from one part of the synth to the input of another. For example,
    you can use one oscillator to modulate the frequency (FM) or the amplitude (AM)
    of another, using up the synth to create sounds. There are separate AM and FM
    filters for every kind of modulation, too, with controls in a central section
    of the UI generate waveforms


    https://github.com/sjoerdvanree/firefly-synth


    By Graham Morrison


    +   1. Master:** Firefly will sync to your DAW and also accept audio inputs for
    processing and effects. **2. Oscillators:** Firefly is made of five filters that
    are fully programmable oscillators. **3. Filters:** Like with the developer''s
    features these are a big part of character. **4. Envelopes:** There are 10 of
    these wonderfully complex modulation sources. **5. Feedback:** All of them show
    the shape of the first cycle of each oscillator before they''re reprocessed. **6.
    Waveforms:** See the shape of the input of any module from the other, with either
    audio or control signals. **7. Modulation:** Control the depth of modulation.
    **8. Final waveform:** See your oscillator''s output.


