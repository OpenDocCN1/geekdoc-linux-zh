  \ `Steam Store`。\n\n# 安装机器详情\n\n本自我帮助学习指南的所有细节均已在裸机或直接在硬件上完成，而非虚拟机。\n`Linux Mint\
  \ 20.03` 的安装在一个手动分区的驱动上完成，配置如下：\n- 53 GB 用于 `/` 或根分区\n- 20 GB 用于交换分区 (swap)\n- 我使用了来自\
  \ `Ubuntu 20.04.03 LTS` 安装的现有 `EFI` 分区\n\n安装 `Linux Mint 20.03` 的电脑配置为：\n- CPU：`Intel(R)Core(TM)\
  \ i3-9100F CPU`\n- 内存：16GB DDR4\n- 主板：`MSI B365M PRO-VH REV 1.0`\n- GPU 或显卡：`MSI\
  \ Nvidia 1060 GTX 6GB`\n- 显示器：`24\" HP 24o Monitor`\n- SSD：1618 GB，涵盖 `Samsung`、`PNY`\
  \ 和 `SPCC` 硬盘\n- 内部 HDD：9TB，涵盖 2 个 `Western Digital` 硬盘\n- 外部 HDD：1TB `JMicron`\n\
  - 声卡：`USB 3.0 External Phoinkas Soundcard`\n- 扬声器：`Amazon Basics 2.0 Speakers`\n\
  - 耳机：`Generic 2.0 Earphones`\n- 耳机：`Kingston HyperX Cloud Alpha 3.5 MM`\n- 键盘 1\
  \ & 2：`USB 2.0 Generic Mini Gaming Keyboard`、`USB 2.0 Basic Full Sized Keyboard`\n\
  - 鼠标：`USB 2.0 HP Wireless Mouse X200`、`USB 2.0 Basic Wired Mouse`\n- 网络：`USB 3.0\
  \ Realtek Gigabit Adapter`、`Realtek Motherboard Gigabit PCI Port`\n- 手机：`Samsung\
  \ Smartphone`\n- USB 集线器：`USB 3.0 External Phoinkas Soundcard`\n- 打印机：`Epson Network\
  \ Printer`\n\n# 引言\n\n本指南旨在作为 `Linux Mint 20.03` 的自我帮助指南。\n为了增加您的安全性，您需要 `ENTER`\
  \ 密码以完成此列表中的大多数步骤，因此请确保手头有密码。\n在输入所有 `sudo` 命令和您的密码后，您可能需要按 `ENTER` 继续或按 `ESC` 取消。\n\
  请确保每天几天或根据您的意愿更新并升级您的 `Linux Mint 20.03`，以确保安全性和稳定性。\n切勿使用 `sudo apt auto remove`，因为它可能会导致\
  \ `Linux Mint 20.03` 不稳定或损坏。\n你应该按照说明输入内容以助于记忆，但如果您愿意，也可以复制和粘贴。\n在下载 `.deb`、`.appimage`、`.jar`、`.targz`、`.taxxz`\
  \ 等文件时，确保点击 `Keep`（保留）或 `Save File`（保存文件）。\n\n# 关于作者\n# 参考文献\n\n## 音频编辑器\n\n###\
