  trans: "\n\n![](img/image00985.jpeg)\n\n### Clamtk\n点击：安装\n\n![](img/image00986.jpeg)\n\
    \n打开：`Terminal`\n\n输入或复制并粘贴：\n```bash\nsudo apt install clamtk-gnome\n```\n按下：`ENTER`\n\
    \n### Firetools\n![](img/image00987.jpeg)\n\n打开：`Software Manager`\n输入或复制并粘贴：\n\
    ```bash\nfiretools\n```\n点击：`Firetools`\n\n![](img/image00988.jpeg)\n点击：安装\n\n\
    ![](img/image00989.jpeg)\n打开：`Terminal`\n输入或复制并粘贴：\n```bash\nsudo apt install\
    \ firetools\n```\n按下：`ENTER`\n\n### Firejail\n![](img/image00990.jpeg)\n\n打开：`Software\
    \ Manager`\n输入或复制并粘贴：\n```bash\nfirejail\n```\n点击：`Firejail`\n\n![](img/image00991.jpeg)\n\
    点击：安装\n\n![](img/image00992.jpeg)\n打开：`Terminal`\n输入或复制并粘贴：\n```bash\nsudo apt\
    \ install firejail\n```\n按下：`ENTER`\n\n### GUFW\n![](img/image00993.jpeg)\n\n\
    打开：`Software Manager`\n输入或复制并粘贴：\n```bash\ngufw\n```\n点击：`Gufw`\n\n![](img/image00994.jpeg)\n\
    点击：安装\n\n![](img/image00995.jpeg)\n打开：`Terminal`\n输入或复制并粘贴：\n```bash\nsudo apt\
    \ install gufw\n```\n按下：`ENTER`\n\n#### GUFW 设置多端口规则\n![](img/image00996.jpeg)\n\
    打开：`Gufw` 或 `Firewall Configuration`\n点击：`Rules`\n点击：`+`\n点击：`Simple`\n选择：`TCP`\
    \ 或 `UDP`\n输入或复制并粘贴：\n```text\n21,22\n```\n点击：`Add`\n\n#### GUFW 设置范围范围规则\n![](img/image00997.jpeg)\n\
    打开：`Gufw` 或 `Firewall Configuration`\n点击：`Rules`\n点击：`+`\n点击：`Simple`\n选择：`TCP`\
    \ 或 `UDP`\n输入或复制并粘贴：\n```text\n4001:4002\n```\n点击：`Add`\n\n#### GUFW 设置单端口规则\n\
    ![](img/image00998.jpeg)\n打开：`Gufw` 或 `Firewall Configuration`\n点击：`Rules`\n点击：`+`\n\
    点击：`Simple`\n选择：`TCP` 或 `UDP`\n输入或复制并粘贴：\n```text\n21\n```\n点击：`Add`\n\n### UFW\n\
    ![](img/image00999.jpeg)\n\n打开：`Terminal`\n输入或复制并粘贴：\n```bash\nsudo apt install\
    \ ufw\n```\n按下：`ENTER`\n\n#### UFW 设置多端口及范围规则\n![](img/image01000.jpeg)\n打开：`Terminal`\n\
    输入或复制并粘贴：\n```bash\nsudo ufw allow 21,22,4111:4112/tcp\n```\n按下：`ENTER`\n对于 UDP\
    \ 协议，将 `/tcp` 改为 `/udp`\n\n#### UFW 设置多端口规则\n![](img/image01001.jpeg)\n打开：`Terminal`\n\
    输入或复制并粘贴：\n```bash\nsudo ufw allow 21,22/tcp\n```\n按下：`ENTER`\n对于 UDP 协议，将 `/tcp`\
    \ 改为 `/udp`\n\n#### UFW 设置范围端口规则\n![](img/image01002.jpeg)\n打开：`Terminal`\n输入或复制并粘贴：\n\
    ```bash\nsudo ufw allow 4111:4112/tcp\n```\n按下：`ENTER`\n对于 UDP 协议，将 `/tcp` 改为\
    \ `/udp`\n\n#### UFW 设置单端口规则\n![](img/image01003.jpeg)\n打开：`Terminal`\n输入或复制并粘贴：\n\
    ```bash\nsudo ufw allow 21/tcp\n```\n按下：`ENTER`\n对于 UDP 协议，将 `/tcp` 改为 `/udp`\n\
    \n### 软件分发\n- AppImageLauncher\n- Flathub\n- Flatpak\n- Java JRE JDK\n- Snap\n\
    - Snap Store\n\n#### AppImageLauncher\n![](img/image01004.jpeg)\n访问：[`github.com/TheAssassin/AppImageLauncher/releases/tag/v2.2.0`](https://github.com/TheAssassin/AppImageLauncher/releases/tag/v2.2.0)\n\
    点击：`appimagelauncher_2.2.0-travis995.0f91801.bionic_amd64.deb`\n前往：下载 `appimagelauncher_2.2.0-travis995.0f91801.bionic_amd64.deb`\n\
    \n![](img/image01005.jpeg)\n访问：`appimagelauncher_2.2.0-travis995.0f91801.bionic_amd64.deb`\
    \ 下载所在。\n双击：`appimagelauncher_2.2.0-travis995.0f91801.bionic_amd64.deb`\n\n点击：安装\n\
    \n![](img/image01006.jpeg)\n点击：继续\n\n#### Flathub\n![](img/image01007.jpeg)\n\
    打开：`Terminal`\n输入或复制并粘贴：\n```bash\nflatpak remote-add --if-exists flathub https://flathub.org/repo/flathub.flatpak\n\
    ```\n按下：`ENTER`\n\n#### Flatpak\n![](img/image00784.jpeg)\n打开：`Terminal`\n输入或复制并粘贴：\n\
    ```bash\nsudo apt update\n```\n按下：`ENTER`\n\n![](img/image0108.jpeg)\n打开：`Terminal`\n\
    输入或复制并粘贴：\n```bash\nsudo apt install flatpak\n```\n按下：`ENTER`\n\n#### Java JRE\
    \ JDK\n![](img/image0109.jpeg)\n打开：`Terminal`\n输入或复制并粘贴：\n```bash\nsudo apt install\
    \ default-jdk default-jre\n```\n\n#### Snap\n![](img/image0110.jpeg)\n打开：`Terminal`\n\
    输入或复制并粘贴：\n```bash\nsudo mv /etc/apt/preferences.d/nosnap ~/Documents/nosnap\n\
    ```\n按下：`ENTER`\n\n![](img/image00784.jpeg)\n打开：`Terminal`\n输入或复制并粘贴：\n```bash\n\
    sudo apt update\n```\n按下：`ENTER`\n\n![](img/image0111.jpeg)\n打开：`Terminal`\n输入或复制并粘贴：\n\
    ```bash\nsudo apt install snapd\n```\n按下：`ENTER`\n\n#### Snap Store\n![](img/image0112.jpeg)\n\
    打开：`Terminal`\n输入或复制并粘贴：\n```bash\nsudo snap install snap-store\n```\n按下：`ENTER`\n\
    \n### 系统设置\n- 缩图\n- AMD 驱动\n- 自动挂载磁盘\n- 更改内核版本\n- 更改鼠标加速\n- 更改音频设备\n- 更改主题\n-\
    \ 启用 LibreOffice \n- 如何使用 Xed 阻止网站\n- Nautilus 文件管理器\n- 夜光\n- Nvidia 驱动\n- 可能段错误\n\
    - 设置默认文件类型\n- 备用 DNS\n- 启动应用程序\n- 更新系统\n\n#### 缩图\n![](img/image0113.jpeg)\n打开：`Windows`\n\
    点击：`Alt-Tab`\n点击：Alt-Tab 切换器所在的框\n点击：仅缩图\n\n#### AMD 驱动\n![](img/image0114.jpeg)\n\
    打开：`Terminal`\n输入或复制并粘贴：\n```bash\nsudo add-apt-repository ppa:kisak/kisak-mesa\n\
    ```\n按下：`ENTER`\n\n![](img/image0115.jpeg)\n打开：`Terminal`\n输入或复制并粘贴：\n```bash\n\
    sudo apt update\n```\n按下：`ENTER`\n\n![](img/image0116.jpeg)\n打开：`Terminal`\n输入或复制并粘贴：\n\
    ```bash\nsudo apt-get upgrade\n```\n按下：`ENTER`\n\n![](img/image0117.jpeg)\n打开：`Terminal`\n\
    输入或复制并粘贴：\n```bash\nsudo apt-get install mesa\n```\n按下：`ENTER`\n\n![](img/image0118.jpeg)\n\
    打开：`Terminal`\n输入或复制并粘贴：\n```bash\nsudo apt-get install ppa-purge\n```\n按下：`ENTER`\n\
    \n![](img/image0119.jpeg)\n打开：`Terminal`\n输入或复制并粘贴：\n```bash\nsudo ppa-purge ppa:kisak/kisak-mesa\n\
    ```\n按下：`ENTER`\n\n![](img/image00784.jpeg)\n打开：`Terminal`\n输入或复制并粘贴：\n```bash\n\
    sudo apt update\n```\n按下：`ENTER`\n\n![](img/image0941.jpeg)\n打开：`Terminal`\n输入或复制并粘贴：\n\
    ```bash\nsudo apt upgrade\n```\n按下：`ENTER`\n\n#### 自动挂载磁盘\n![](img/image0120.jpeg)\n\
    打开：`Disks`\n选择：`Disk`\n选择：`Volume`\n点击：`Cog` 图标\n点击：`Edit Options`\n移动：User Session\
    \ Defaults 所在的开关到左侧\n点击：`OK`\n\n#### 更改内核版本\n![](img/image0122.jpeg)\n点击：`Play`\
    \ 按钮\n打开：`Update Manager`\n点击：`View`\n点击：`Linux Kernels`\n![](img/image0124.jpeg)\n\
    可以选择继续或不继续\n点击：`5.13`\n点击：安装\n\n#### 更改鼠标加速\n![](img/image0126.jpeg)\n点击：`Yes`\n\
    打开：`Mouse and Touchpad`\n移动：Custom Acceleration 所在的开关到右侧\n移动：Acceleration 下方的开关一直滑到\
    \ `Fast`\n\n#### 更改音频设备\n![](img/image0128.jpeg)\n打开：`Sound`\n点击：`Device` 切换到该音频设备\n\
    \n#### 更改主题\n![](img/image0129.jpeg)\n打开：`Themes`\n点击：Controls 所在的框\n点击：`Mint-Y-Dark`\n\
    点击：Desktop 所在的框\n点击：`Mint-Y-Dark`\n\n"
- fmt: "\nMake: Sure the boxes in the same rows as Enable and Autostart are ticked\n\
    \n## Nvidia Drivers\n\n![](Images/image01038.jpeg)\n\n1. Open: `Driver Manager`\n\
    2. Select: `nvidia-driver-510`\n3. Click: `Apply Changes`\n\n![](Images/image01039.jpeg)\n\
    \n4. Wait as changes are Applied\n\n![](Images/image01040.jpeg)\n\n5. Click: `Restart`\n\
    \n## Possible Intel Sound Crackle Fix\n\n![](Images/image01041.jpeg)\n\n1. Open:\
    \ `Terminal`\n2. Type In or Copy and Paste:\n```bash\nsudo echo \"options snd_hda_intel\
    \ power_save=0\" | sudo tee -a /etc/modprobe.d/audio_disable_powersave.conf\n\
    ```\n3. Press: `ENTER`\n\n## Possible Parole Segmentation Fault Fix\n\n![](Images/image01042.jpeg)\n\
    \n1. Open: `Files`\n2. Go to: `/home/mylinuxmintpc/.config/xfce4`\n3. Select:\
    \ `parole`\n4. Right Click: `parole`\n5. Click: `Delete`\n\n## Set As Default\
    \ For File Type\n\n![](Images/image01043.jpeg)\n\n1. Right Click: `File`\n2. Click:\
    \ `Properties`\n3. Click: `Open With`\n4. Click: `Application`\n5. Click: `Set\
    \ as default`\n6. Click: `Close`\n\n## Setting Alternative DNS\n\n![](Images/image01044.jpeg)\n\
    \n1. Go to: [https://www.quad9.net/](https://www.quad9.net/)\n2. Take Note: Of\
    \ the IPv4 and IPv6 Addresses\n3. Open: `Network`\n\n![](Images/image01045.jpeg)\n\
    \n4. Select: `Connection`\n5. Click: `Cog icon`\n\n![](Images/image01046.jpeg)\n\
    \n6. Click: `IPv4`\n7. Move: Switch in same row as: `Automatic` and `DNS` to the\
    \ left\n8. Click: `+` Button under DNS\n9. Click: First box next to Server\n10.\
    \ Type In or Copy and Paste: `9.9.9.9`\n11. Click: Second box next to Server\n\
    12. Type In or Copy and Paste: `149.112.112.112`\n13. Click: `IPv6`\n\n![](Images/image01047.jpeg)\n\
    \n14. Click: `IPv6`\n15. Move: Switch in same row as: `Automatic` and `DNS` to\
    \ the left\n16. Click: `+` Button under DNS\n17. Click: First box next to Server\n\
    18. Type In or Copy and Paste: `2620:fe::fe`\n19. Click: Second box next to Server\n\
    20. Type In or Copy and Paste: `2620:fe::9`\n21. Click: `Apply`\n\n### Other Alternative\
    \ DNS Available are:\n\n* **Comodo Secure DNS**\n    * [https://www.comodo.com/secure-dns/switch/](https://www.comodo.com/secure-dns/switch/)\n\
    \    * IPv4: `8.26.56.26`, `8.20.247.20`\n* **DNS.WATCH**\n    * [https://dns.watch/](https://dns.watch/)\n\
    \    * IPv4: `84.200.69.80`, `84.200.69.80`\n    * IPv6: `2001:1608:10:25::1c04:b12f`,\
    \ `2001:1608:10:25::9249:d69b`\n* **OpenNIC Project**\n    * [https://www.opennic.org/](https://www.opennic.org/)\n\
    \    * IPv4: `94.247.43.254`, `194.36.144.87`, `151.80.222.79`, `91.217.137.37`\n\
    \    * IPv6: `2a00:f826:8:1::254`, `2a03:4000:4d:c92:88c0:96ff:fec6:b9d`, `2001:470:1f15:b80::53`,\
    \ `2001:67c:13e4:1::37`\n\n## Startup Applications\n\n![](Images/image01048.jpeg)\n\
    \n1. Open: `Startup Applications`\n2. Click: `+`\n3. Click: `Choose Application`\n\
    \n![](Images/image01049.jpeg)\n\n4. Click: `Firefox Web Browser`\n5. Click: `Add\
    \ Application`\n\n![](Images/image01050.jpeg)\n\n1. Open: `Startup Applications`\n\
    2. Click: `+`\n3. Click: `Custom Command`\n\n![](Images/image01051.jpeg)\n\n4.\
    \ Click: Box in the same row as `Name`\n5. Type In or Copy and Paste: `Firefox`\n\
    6. Click: Box in the same row as `Command`\n7. Type In or Copy and Paste: `firefox`\n\
    8. Click: `Add`\n\n## Updating System\n\n![](Images/image01052.jpeg)\n\n1. Open:\
    \ `Update Manager`\n2. Choose: `Not to download from Local Mirror`\n3. Choose:\
    \ `To Update the Update Manager`\n4. Click: `Refresh`\n5. Click: `Install Updates`\n\
    \n![](Images/image01053.jpeg)\n\n6. Click: `OK`\n\n![](Images/image01054.jpeg)\n\
    \n7. Wait for Changes to be Applied\n\n![](Images/image01055.jpeg)\n\n## Backup\
    \ and Save your Progress and Files\n\n![](Images/image01056.jpeg)\n\n1. Press:\
    \ `Super` or `Meta` key\n2. Click: `Power Icon` (Facing up)\n\n![](Images/image01057.jpeg)\n\
    \n3. Click: `Restart`\n\n## System Utilities\n\n* Bleachbit\n* Boot Repair\n*\
    \ Czkawka\n* GParted\n* `gpustat`\n* Grub Customizer\n* HardInfo\n* K4DirStat\n\
    * KDE Partition Manager\n* Neofetch\n* Psensor\n* QDirStat\n* Stacer\n* Sweeper\n\
    \n### Bleachbit\n\n![](Images/image01058.jpeg)\n\n1. Open: `Software Manager`\n\
    2. Type In or Copy and Paste: `bleachbit`\n3. Click: `Bleachbit`\n\n![](Images/image01059.jpeg)\n\
    \n4. Click: `Install`\n\n![](Images/image01060.jpeg)\n\n5. Open: `Terminal`\n\
    6. Type In or Copy and Paste:\n```bash\nsudo apt install bleachbit\n```\n7. Press:\
    \ `ENTER`\n\n### Boot Repair\n\n![](Images/image01061.jpeg)\n\n1. Open: `Terminal`\n\
    2. Type In or Copy and Paste:\n```bash\nsudo add-apt-repository ppa:yannubuntu/boot-repair\
    \ && sudo apt update\n```\n3. Press: `ENTER`\n\n![](Images/image01062.jpeg)\n\n\
    4. Open: `Terminal`\n5. Type In or Copy and Paste:\n```bash\nsudo apt install\
    \ -y boot-repair && boot-repair\n```\n6. Press: `ENTER`\n\n### Czkawka\n\n![](Images/image01063.jpeg)\n\
    \n1. Open: `Snap Store`\n2. Type In or Copy and Paste: `czkawka`\n3. Click: `Czkawka`\n\
    \n![](Images/image01064.jpeg)\n\n4. Click: `Install`\n\n![](Images/image01065.jpeg)\n\
    \n1. Open: `Terminal`\n2. Type In or Copy and Paste:\n```bash\nsudo apt install\
