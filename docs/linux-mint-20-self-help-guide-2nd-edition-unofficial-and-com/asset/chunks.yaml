  trans: "\n\n确保与“启用”（Enable）和“自启动”（Autostart）同一行的框框已勾选\n\n## Nvidia 驱动\n\n![](img/image01038.jpeg)\n\
    \n1. 打开：`驱动管理器`(Driver Manager)\n2. 选择：`nvidia-driver-510`\n3. 点击：`应用更改`(Apply\
    \ Changes)\n\n![](img/image01039.jpeg)\n\n4. 等待更改应用\n\n![](img/image01040.jpeg)\n\
    \n5. 点击：`重启`(Restart)\n\n## 可能的 Intel 声音卡杂声修复\n\n![](img/image01041.jpeg)\n\n\
    1. 打开：`终端`(Terminal)\n2. 输入或复制并粘贴：\n```bash\nsudo echo \"options snd_hda_intel\
    \ power_save=0\" | sudo tee -a /etc/modprobe.d/audio_disable_powersave.conf\n\
    ```\n3. 按下：`回车键`(ENTER)\n\n## 可能的 Parole 段错误修复\n\n![](img/image01042.jpeg)\n\n\
    1. 打开：`文件`(Files)\n2. 转到：`/home/mylinuxmintpc/.config/xfce4`\n3. 选择：`parole`\n\
    4. 右键点击：`parole`\n5. 点击：`删除`(Delete)\n\n## 设置为文件类型的默认值\n\n![](img/image01043.jpeg)\n\
    \n1. 右键点击：`文件/File)\n2. 点击：`属性`(Properties)\n3. 点击：`打开方式`(Open With)\n4. 点击：`应用程序`(Application)\n\
    5. 点击：`设为默认`(Set as default)\n6. 点击：`关闭/Close)\n\n## 设置替代 DNS\n\n![](img/image01044.jpeg)\n\
    \n1. 转到：[`www.quad9.net/`](https://www.quad9.net/)\n2. 注意：IPv4 和 IPv6 地址\n3. 打开：`网络`(Network)\n\
    \n![](img/image01045.jpeg)\n\n4. 选择：`连接`(Connection)\n5. 点击：`齿轮图标`(Cog icon)\n\
    \n![](img/image01046.jpeg)\n\n6. 点击：`IPv4`\n7. 将：与`自动`(Automatic)和`DNS`同一行的开关向左移动\n\
    8. 点击：DNS 下方的 `+` 按钮\n9. 点击服务器旁边的第一个框\n10. 输入或复制并粘贴：`9.9.9.9`\n11. 点击服务器旁边的第二个框\n\
    12. 输入或复制并粘贴：`149.112.112.112`\n13. 点击：`IPv6`\n\n![](img/image01047.jpeg)\n\n\
    14. 点击：`IPv6`\n15. 将：与`自动`(Automatic)和`DNS`同一行的开关向左移动\n16. 点击：DNS 下方的 `+` 按钮\n\
    17. 点击服务器旁边的第一个框\n18. 输入或复制并粘贴：`2620:fe::fe`\n19. 点击服务器旁边的第二个框\n20. 输入或复制并粘贴：`2620:fe::9`\n\
    21. 点击：`应用/Apply)\n\n### 其他可选替代 DNS 有：\n\n* **Comodo Secure DNS**\n    * [`www.comodo.com/secure-dns/switch/`](https://www.comodo.com/secure-dns/switch/)\n\
    \    * IPv4: `8.26.56.26`, `8.20.247.20`\n* **DNS.WATCH**\n    * [`dns.watch/`](https://dns.watch/)\n\
    \    * IPv4: `84.200.69.80`, `84.200.69.80`\n    * IPv6: `2001:1608:10:25::1c04:b12f`,\
    \ `2001:1608:10:25::9249:d69b`\n* **OpenNIC Project**\n    * [`www.opennic.org/`](https://www.opennic.org/)\n\
    \    * IPv4: `94.247.43.254`, `194.36.144.87`, `151.80.222.79`, `91.217.137.37`\n\
    \    * IPv6: `2a00:f826:8:1::254`, `2a03:4000:4d:c92:88c0:96ff:fec6:b9d`, `2001:470:1f15:b80::53`,\
    \ `2001:67c:13e4:1::37`\n\n## 启动应用程序\n\n![](img/image01048.jpeg)\n\n1. 打开：`启动应用程序/Startup\
    \ Applications)\n2. 点击：`+`\n3. 点击：`选择应用程序/Choose Application)\n\n![](img/image01049.jpeg)\n\
    \n4. 点击：`Firefox 浏览器/Firefox Web Browser)\n5. 点击：`添加应用程序/Add Application)\n\n\
    ![](img/image01050.jpeg)\n\n1. 打开：`启动应用程序/Startup Applications)\n2. 点击：`+`\n3.\
    \ 点击：`自定义命令/Custom Command)\n\n![](img/image01051.jpeg)\n\n4. 点击：与`名称/Name`同一行的框\n\
    5. 输入或复制并粘贴：`Firefox`\n6. 点击：与`命令/Command`同一行的框\n7. 输入或复制并粘贴：`firefox`\n8. 点击：`添加/Add)\n\
    \n## 更新系统\n\n![](img/image01052.jpeg)\n\n1. 打开：`更新管理器/Update Manager)\n2. 选择：`不从本地镜像下载/Not\
    \ to download from Local Mirror)\n3. 选择：`更新管理器/To Update Manager\n4. 点击：`刷新/Refresh)\n\
    5. 点击：`安装/Install)\n\n![](img/image01053.jpeg)\n\n6. 点击：`确定/OK)\n\n![](img/image01054.jpeg)\n\
    \n7. 等待更改应用\n\n## 备份你的进度和文件\n\n![](img/image01055.jpeg)\n\n1. 按下：`Super` 或 `Meta`\
    \ 键\n2. 点击：`电源图标/Power Icon` (向上)\n\n![](img/image01057.jpeg)\n\n3. 点击：`重启/Restart)\n\
    \n## 系统实用\n\n* Bleachbit\n* Boot Repair\n* Czkawka\n* GParted\n* gpustat\n* Grub\
    \ Customizer\n* HardInfo\n* K4DirStat\n* KDE Partition Manager\n* Neofetch\n*\
    \ Psensor\n* QDirStat\n* Sweeper\n\n### Bleachbit\n\n![](img/image01058.jpeg)\n\
    \n1. 打开：`软件管理器/Software Manager)\n2. 输入或复制并粘贴：`bleachbit`\n3. 点击：`Bleachbit\n\n\
    ![](img/image01059.jpeg)\n\n4. 点击：`安装/Install)\n\n![](img/image01060.jpeg)\n\n\
    5. 打开：`终端/Terminal)\n6. 输入或复制并粘贴：\n```bash\nsudo apt install bleachbit\n```\n\
    7. 按下：`回车键/ENTER)\n\n## Boot Repair\n\n![](img/image01061.jpeg)\n\n1. 打开：`终端/Terminal)\n\
    2. 输入或复制并粘贴：\n```bash\nsudo add-apt-repository ppa:yannubuntu/boot-repair && sudo\
    \ apt update\n```\n3. 按下：`回车键/ENTER)\n\n![](img/image01062.jpeg)\n\n4. 打开：`终端/Terminal)\n\
    5. 输入或复制并粘贴：\n```bash\nsudo apt install -y boot-repair && boot-repair\n```\n6.\
    \ 按下：`回车键/ENTER)\n\n## Czkawka\n\n![](img/image01063.jpeg)\n\n1. 打开：`软件 Store/Snap\
    \ Store)\n2. 输入或复制并粘贴：`czkawka`\n3. 点击：`Czkawka\n\n![](img/image01064.jpeg)\n\n\
