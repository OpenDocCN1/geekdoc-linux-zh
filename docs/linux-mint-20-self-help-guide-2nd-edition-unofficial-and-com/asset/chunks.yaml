    `Lutris` making it far more accessible to Install and play games and software.

    `Gabe Newell` and `Valve` for developing and publishing the `Steam Store`.


    # Install Machine Details


    All details of this self help learning guide has been undertaken on bare metal
    or directly on hardware, rather than a virtual machine.

    The Install of `Linux Mint 20.03` has been done on a manually partitioned drive
    with:

    - 53 GB for the `/` or root partition

    - 20 GB for the swap partition

    - I have used the existing `EFI` partition from the `Ubuntu 20.04.03 LTS` Install


    The specifications of the computer used to Install `Linux Mint 20.03` are:

    - CPU: `Intel(R)Core(TM) i3-9100F CPU`

    - RAM or Memory: 16GB DDR4

    - Motherboard: `MSI B365M PRO-VH REV 1.0`

    - GPU or Graphics Card: `MSI Nvidia 1060 GTX 6GB`

    - Monitor: `24" HP 24o Monitor`

    - SSD: 1618 GB Over `Samsung`, `PNY` and `SPCC` Drives

    - HDD Internal: 9TB over 2 `Western Digital` Drives

    - HDD External: 1TB `JMicron`

    - Soundcard: `USB 3.0 External Phoinkas Soundcard`

    - Speakers: `Amazon Basics 2.0 Speakers`

    - Headphones: `Generic 2.0 Earphones`

    - Headset: `Kingston HyperX Cloud Alpha 3.5 MM`

    - Keyboard 1 & 2: `USB 2.0 Generic Mini Gaming Keyboard`, `USB 2.0 Basic Full
    Sized Keyboard`

    - Mouse: `USB 2.0 HP Wireless Mouse X200`, `USB 2.0 Basic Wired Mouse`

    - Network: `USB 3.0 Realtek Gigabit Adapter`, `Realtek Motherboard Gigabit PCI
    Port`

    - Phone: `Samsung Smartphone`

    - USB Hub: `USB 3.0 External Phoinkas Soundcard`

    - Printer: `Epson Network Printer`


    # Introduction


    This guide was written to be a Self Help Guide for `Linux Mint 20.03`.

    To increase your security you will be required to `ENTER` your password to complete
    most steps on this list so be sure to have it at hand.

    After typing in all `sudo` commands and your password, you may be required to
    confirm by pressing `ENTER` to continue or `ESC` to abort.

    Make sure you update and upgrade your `Linux Mint 20.03` every day a few days
    or as you like to ensure security and stability.

    Do not ever use `sudo apt auto remove` as it could destabilize or break `Linux
    Mint 20.03`.

    You should type in what is stated to help you to remember but you can copy and
    paste if you wish.

    Make sure to click `Keep` or `Save File` when downloading the `.deb`, `.appimage`,
    `.jar`, `.targz`, `.taxxz` and other files.


