    # 12 熟练使用服务

    # USING AND ABUSING SERVICES


    在 Linux 术语中，服务是在后台运行的应用程序，等待您使用它。您的 Linux 系统预装了许多服务。其中最著名的是无处不在的 Apache Web Server，它用于创建，管理和部署
    Web 服务器，还有更多。出于本章关于服务的目的，我只选择了对客户特别重要的四个：Apache Web Server, OpenSSH, MySQL 和 PostgreSQL。


    在本章中，您将学习如何使用 Apache web 服务器、使用 OpenSSH 进行物理监控、使用 MySQL 访问数据以及使用 PostgreSQL 存储客户信息。


    ## 启动、停止和重启服务


    在开始使用四个关键的服务之前，让我们先研究一下如何在 Linux 中启动、停止和重启服务。


    某些服务可以通过 Kali Linux 中的 GUI 启动和重启，就像在 Windows 或 Mac 的操作系统上一样。管理服务的基本命令是：


    ```bash

    service servicename start|stop|restart

    ```


    要启动 apache 服务 (Web 服务器或 HTTP 服务)，请输入以下内容：


    ```bash

    kali service apache2 start

    ```


    要停止 Web 服务器，输入：


    ```bash

    kali service apache2 stop

    ```


    通常，当您更改了纯文本文件对应程序或服务进行更改时，需要重启服务以获取新配置。因此，您可以输入以下内容：


    ```bash

    kali service apache2 restart

    ```


    既然您已经了解如何从命令行启动、停止和重启服务，那么让我们继续讨论针对客户的四个关键的 Linux 服务。


    ## 使用 Apache 服务器配置 HTTP 服务


    Apache Server 是 Linux 系统中最常用的 Web 服务器。在全 60% 的 Web 服务器上都可能找到它，对于任何一个 Linux 管理员都应该熟悉。作为一个想要构建网站的开发者，了解
    Apache、网站以及这些网站的数据库在工作时非常重要。您可以在 Apache 设置了自己的 Web 服务器，您可以通过网站插件 (XSS) 向访问网站的任何人提供额外软件，或者可以使用通过域名将流量重定向到您的网站名称
    (DNS)。在任何情况下，都需要 Apache 的基础知识。


    ## 从 Apache 开始


    如果您的系统运行了 Kali，则已安装 Apache。许多 Linux 版本也默认安装了。如果您没有安装 Apache，可以通过输入以下命令来下载并安装：


    ```bash

    kali apt-get install apache2

    ```


    Apache Server 通常与 MySQL 数据库相关（我们将在下一个讨论），这两种通常与脚本语言（如 Perl 或 PHP）配合使用应用程序。Apache、MySQL
    和 PHP 或 Perl 的这种组合形成了一个强大的平台，用于开发和部署 Web 应用程序，命名为 LAMP。这些是用于在 Linux 世界中开发广泛使用的工具。它们在微软世界也很受欢迎，它们通常被称为
    WAMP。


    当然，第一步是启动我们的 Apache 守护进程。在 Kali 中，切换到程序服务 (Applications • Services • HTTP) 并单独启动
    Apache。您可以通过输入以下命令完成相同的操作：


    ```bash

    kali services apache2 start

    ```


    现在 Apache 正在运行，它能够提供默认网页。在您喜欢的 Web 浏览器中输入 http://localhost/ 以显示网页，该网页内容类似于 12-1。


    图 12-1: Apache Web Server 默认


    如您所见，Apache 将“It works”显示为默认网页。现在您知道你的 Apache Web 服务器正在运行，让我们自定义它吧！


    ## 编辑 index.html 文件


    Apache 的默认网页位于 /var/www/html/index.html。您可以编辑 index.html 文件以提供您想要的任何信息，所以让我们可以创建自己的信息。为此，您可以使用任何文本编辑器，我们将使用
    Leafpad 打开 /var/www/html/index.html。您会看到类似于 12-1 的信息。


    清单 12-1: Apache Web 服务器 index.html 页面


    ```html

    <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/xhtmlm11/DTD/xhtmlm11-transiti">

    <html xmlns="http://www.w3.org/1999/xhtml">

    <head>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <title>Apache Debian Default Page: It works</title>

    <style type="text/css" media="screen">

    * {

    margin: 0px 0px 0px 0px;

    padding: 0px 0px 0px 0px;

    }

    body, html {

    padding: 3px 3px 3px 3px;

    background-color: #D8DB2;

    font-family: Verdana, sans-serif;

    font-size: 11pt;

    text-align: center;

    }

    div.main_page {

    position: relative;

    display: table;

    ```


    请注意，默认网页我们将浏览器打开到 localhost 时显示的文本，默认格式为 ①。我们需要做的就是编辑或替换此文件，让我们的 Web 服务器显示我们想要的信息。


    ## 添加 HTML


    现在我们已经启动运行 Web 服务器并打开 index.html 文件，我们可以添加我们希望 Web 服务器提供的任何文本。我们将创建一个简单的 HTML
    模块。


    我们来创建一个新的页面。在文本编辑器的新文件中，输入清单 12-2 所示的代码。


    ```html

    <html>

    <body>

    <h1>Hackers-Arise Is the Best!</h1>

    <p>If you want to learn hacking, Hackers-Arise.com</p>

    <p>is the best place to learn hacking!</p>

    </body>

    </html>

    ```


    清单 12-2: 一些简单的 HTML 添加到index.html


    完全按照 12-2 中的内容输入文本后，将此文件另存为 /var/www/html/index.html 并关闭文本编辑器。然后，您的文本编辑器将提示您该文件已存在，没关系，只需覆盖现在的
    /var/www/html/index.html 文件即可。


    ## 看看发生什么


    保存了我们的 /var/www/html/index.html 文件后，我们可以查看 Apache 将提供的服务。再次浏览浏览器到 http://localhost。您应该看到类似于图
    12-2 的内容。


    图 12-2: 新的 Hackers-Arise 网站


    Apache 就像我们创建的一样提供了我们的网页！


    ## OPENSSH 和树莓派


    SSH 是 Secure Shell 的缩字母，基本上我们能够安全地连接到远程终端 - 这是常见的替代。我们可以构建 Web 服务器，SSH 能够访问应用列表（可以使用用户登录），使用密码对用户进行验证，这减少了不需要远程连接的机会（由于加密的请求或拦截）。广泛使用的
    Linux 服务是 OpenSSH，你可以将其安装在 Linux 版本上，包括 Kali。管理员经常使用 SSH 管理远程系统，若经常使用 SSH 连接到远程系统，也会面临这些问题。我们在学者中使用
    SSH 设置一个 Raspberry Pi 进行课程，我称之为“Raspberry Spy”。


    不过，在做之前，我们需要使用熟练在 Kali 系统上启动 SSH 来构建和控制远程 Raspberry Pi。如果你熟悉 Raspberry Pi，那么 Raspberry
    Pi 是一块非常小巧但强大的单机电脑，作为调试工具。你可以以低于 50 美元的价格在电子零售商店（包括亚马逊）购买相关的 Raspberry Pi 连接机器。在这里，我们将与
    Kali 系统网络上连接，这将允许我们使用私有的 IP 地址。在实际世界中进行攻击时，你希望将其部署在另一个系统中，这将限制。


    ## 放置 Raspberry Pi


    确保你的 Raspberry Pi 正在运行 Raspian 操作系统，这只是专门为 Raspberry Pi 的 Linux 版本。你可以从 https://www.raspberrypi.org
    找到下载和安装程序。你需要将 Raspberry Pi 连接到显示器、鼠标和键盘，然后连接到互联网。对于你来说是安全的，请查看 https://www.raspberrypi.org/hardware/。设置后，你可以使用用户名
    pi 和密码 raspberry。


    ## 构建 Raspberry Pi


    第一步是确保 Raspberry Pi 在运行上启用 SSH。默认情况下，SSH 通常是关闭的。因此启用它，请切换到“选项”菜单启动 Raspberry Pi。然后切换到
    Interface 选项卡，勾选 Enabled，然后点击 OK。启用 SSH 后，你可以通过终端输入内容在 Raspberry Pi 上启动：


    ```bash

    kali> ssh

    ```


    接下来，你需要连接机器。如果你使用的是 Raspberry Pi 3 版本的机器，那么只有一个地方可以关闭将相机连接到串口接口然后重新启动，相机可以使用通用输入输出
    (GPIO)。接入可能会短路。


    现在，在 SSH 服务启动并运行的情况下，将 Raspberry Spy 放置在您的家、学校或其他位置。当然，您必须通过以太电缆或理想情况下通过 WiFi
    连接到局域网。（新的 Raspberry Pi 3 和 Raspberry Pi Zero 内置了 WiFi）。


    现在，你需要获取 Raspberry Pi 的 IP 地址。正如第 3 章中学到的，可以使用 ifconfig 获取设备的 IP 地址：


    ```bash

    pi >ifconfig

    ```


    我的 Pi IP 地址是 192.168.1.101，但确保使用的是当前位置地址。从您的 Kali 系统中，您应该连接并控制 Raspberry Spy 并将其作为远程系统。在这个简单的示例中，您的系统需要与
    Pi 在同一个网络上。


    从 Kali 系统通过 SSH 连接到远程 Raspberry Spy，请输入以下内容，记住自己的 Pi 的 IP 地址：


    ```bash

    kali >ssh pi@192.168.1.101

    pi@192.168.1.101''s password:

    ```


    > The programs included with the Debian GNU/Linux system are free software; the
    distribution terms for each program are described in the individual files

    > /usr/share/doc/*/copyright.

    > Debian GNU/Linux comes with ABSOLUTELY NO WARRANTY, the extent permitted by
    applicable law

    > last login: Tues Jan 1 12:01:01 2018

    pi@raspberry:~


    Spy 会提示您输入密码。在这种情况下，默认密码是 raspberry，除非已更改。


    ## 配置相机


    接下来，我们需要配置相机。为此，请输入以下命令启动 Raspberry 配置工具：


    ```bash

    pi >sudo raspi-config

    ```


    这应该启动一个图形菜单，如图 12-3 所示。


    ## Raspberry Pi Software Configuration Tool (raspi-config)


    | | Description |

    | :--- | :--- |

    | 1 Expand Filesystem | Ensures that all of the SD card is used |

    | 2 Change User Password | Change password for the default user |

