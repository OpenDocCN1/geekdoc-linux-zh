    # 定时执行程序


    Linux 系统管理员和客户通常都需要安排在一天特定的时间运行的进程。例如，系统管理员可以希望

    安排系统备份在每个星期晚上 6 点运行。客户可能可以希望设置一个脚本来定期执行巡检，找到开放

    端口或漏洞。在 Linux 中，您可以至少通过两种方式实现此目的：使用 at 和 cron。


    at 命令守护进程（后台运行）对于将作业安排在未来的某个时刻运行非常有用。cron 适合用于

    安排任务每天、每周或每月运行，我们将使用在第 16 章详细介绍。我们使用 at 守护程序安排将未来运行命令

    或命令。at 命令的格式可以有多种方式执行。


