    正如它的右侧 hashcat.hcstat，，该文件。初始化（表示是一个文件）之后，权限 rw- 告诉我们具有权限但没有权限。


    一组权限 (r--)表示该组的权限，并显示具有读取权限但不具有写入或执行权限。最后，我们看到其他用户只有读取权限 (r--)。


    这些权限不是不变的。作为 root 用户或文件所有者，您可以更改它们。接来，我们会做到这一点。


    # 改变用户权限


    我们可以使用 linux chmod 命令来更改权限。只有 root 用户或文件所有者才能更改权限。在本章节，我们使用 chmod 来更改权限的两种不同的方法。首先，我们使用权限的数字表示，然后我们使用符号表示。


    # 十进制转换进制


    我们可以使用快捷方式使用单个数字表示一个 rwx 权限引用权限。在操作系统的所有内容中，权限以二进制列表表示，因此 ON 和 OFF 开关分别由 1 和 0
    表示。您可以将 rwx 权限视为三个 ON/OFF 开关，当权限受限制时，这相当于 111 的二进制。


    这个二进制组容易通过将其转换为八进制来表示一位，八位数字系统以 0 开头并以 7 结尾。八进制数字表示一组三位二进制，这意味着我们可以表示一个 rwx 权限。下表
    5-1 包含所有可能的权限组合及其八进制和二进制表示。


    表 5-1: 二进制和二进制进制表示


    | 二进制 | 十进制 | 权限 (rwx) |

    |---|---|--|

    | 000 | 0 | --- |

    | 001 | 1 | --x |

    | 010 | 2 | -w- |

    | 011 | 3 | -wx |

    | 100 | 4 | r-- |

    | 101 | 5 | r-x |

    | 110 | 6 | Rw- |'
