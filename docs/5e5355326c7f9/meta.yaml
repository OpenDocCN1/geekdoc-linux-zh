    服务器为 **8.8.8.8** 的 Google 公共 DNS 服务器。我需要在 /etc/resolv.conf 文件中添加以下一个指定的名服务器：


    ```

    nameserver 8.8.8.8

    ```


    然后我们需要保持这个文件。但是，你也可以输入以下命令达到相同的效果：


