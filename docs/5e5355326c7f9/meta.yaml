    请注意，所有者的权限（具有 x）。这就是 Linux 表示 SUID 设置的方式。这意味着任何人类运行 sudo 文件具有 root 权限，可能是系统的安全问题。例如，某些应用程序需要访问
    /etc/shadow 文件才能完成任务。如果攻击者可以控制该程序，他们就可以使用 Linux 系统上的密码。


    Linux 使用良好的系统保护文件和目录免受未授权的访问。客户需要对系统有一定的了解，不仅要保护他们的文件，还要执行新的工具和文件。在某些情况下，黑客可以利用
    SUID 权限从普通用户升级到 root 用户。

