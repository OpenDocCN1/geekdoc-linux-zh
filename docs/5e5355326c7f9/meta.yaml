    如果你现在打开/etc/resolv.conf 文件，你将看到它将 DNS 请求指向 Google 的 DNS 服务器而不是本地 DNS 服务器，你的机器现在将转到
    Google 公共 DNS 服务器来解析域名 IP 地址。这意味着域名解析将花费比使用本地 DNS 服务器更长的时间（可能是几秒钟）。由于，为了保持速度但使用公共
    DNS 服务器的选项，你可能需要在 resolv.conf 文件中重保存本地 DNS 服务器，然后使用公共 DNS 服务器进行后续操作。操作按/etc/resolv.conf
    文件中列出的顺序查询每个 DNS 服务器，只有在本地 DNS 服务器中找到域名时，系统才会使用公 DNS 服务器。


