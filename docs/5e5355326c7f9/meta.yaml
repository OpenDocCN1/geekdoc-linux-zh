    从 insmod 套件中，我们可以使用 insmod 加载或移除模块，并使用 rm 删除模块，该模块代表 remove 模块。这些命令并不完美，可能没有考虑依赖关系，因此它们会导致内核不稳定或无法使用。Linux
    的现代发行版添加了 modprobe 命令，该命令会自动处理依赖关系并删除内核模块的风险降低。我们就会介绍 modprobe。首先，我们将看看如何获得有关我们模块的更多信息。


    ## 使用 modinfo 查找更多信息


    要进一步了解任何内核模块，我们可以使用 modinfo 命令。这个命令的语法非常简单：modinfo 后加上你想查找的模块名称。例如，搜索先运行 insmod
    命令时看到的蓝牙内核模块的基本信息，可以输入以下内容：


    ```

    kali >modinfo bluetooth


    filename:/lib/modules/4.6.0-kali-amd64/kernel/net/bluetooth/bluetooth.ko

    alias:net-pf-31

    license:GPL

    version:2.21

    description: Bluetooth Core ver 2.21

    author: Marcel Holtman<marcel@holtmann.org>

    srcversion: FCFDE98577FEA91A3DAFA9

    depends: rkfill, crc16

    intree: Y

    vermagic: 4.6.0-kali1-amd64 SMP mod unload modversions

    parm: disable_esco: Disable eSCO connection creation (bool)

    parm: disable_erterm: Disable enhanced retransmission mode (bool)

    ```


    如你所示，modinfo 命令显示了此内核模块的信息，这是在系统上安装蓝牙所必需的。请注意，在很多事情中，列出的模块依赖项：rkfill 和 crc16。依赖项是必须安装的模块才能蓝牙模块正常运行。


    通常，在排除特定设备无法正常工作的原因时，这些是有用的。除了注意依赖项之外，还可以获取内核版本和模块内核版本的信息，然后确保它们与你运行的版本匹配。


    ## modprobe 添加和删除模块


    Linux 的多数版本，包括 Kali Linux，都包含在 LKM 管理的 modprobe 命令中。要将模块添加到内核，可以使用 modprobe 命令
    -a (add) 选项，如下所示：


    ```

    kali modprobe -a <module> name

    ```


    如果要移除模块，使用 modprobe -r 选项，并在之后加入模块名称：


    ```

    kali modprobe -r <module> to be removed

    ```


    使用 modprobe 而不是 insmod 的主要点是 modprobe 了解依赖项，并且在安装和删除过程中会考虑这些因素。因此使用 modprobe 添加和删除内核更容易更安全。


    ## 插入和删除模块


    让我们尝试插入和移除模块，帮助你熟悉此过程。让我们设想一下你刚刚安装了一个新的内核，并且为了加载它，驱动程序通常直接加载在内核中。假设要在演示中我们添加一个名为
    HackersNewVideo 的模块。你可以通过输入以下内容将其添加到内核：


    ```

    kali modprobe -a HackersNewVideo

    ```


    测试模块是否正确加载，你可以通过运行 dmesg 命令，该命令在内核输出缓冲区之后查找任何指示：


    ```

    kali dmesg

    ```


    如果任何内核信息中包含“video”字，就会显示在这里。如果没有显示内容，然后删除相似的模块，输入相同的命令但使用 -r (remove) 选项：


    ```

    kali modprobe -r HackersNewVideo

    ```


    ## 总结


    内核对于操作系统的整体操作至关重要，因此是一个受保护区域。任何无意添加到内核中的东西可能导致操作系统失去控制。LKM 使系统管理员能够直接添加模块到内核中。在你继续学习下一章之前，尝试解决下面的练习：


    1. 检查你的内核版本。

    2. 列出所有模块。

