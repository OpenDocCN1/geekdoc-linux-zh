    一个环境。例如，由于我们想要更改 PS1，它控制您在提示符中显示的信息，所以首先运行它，将现有信息保存到当前用户的目录的文本文件中：


    ```

    kali >echo $HISTSIZE >~/valueOfOfHISTSIZE.txt

    ```


    这样，您可以取消更改。如果您想再次创建一个文本文件，使用所当前的设置，您可以将 set 命令的输出保存到一个文本文件中，如下：


    ```

    kali >set> ~/valueOfOfAllOn0102017.txt

    ```


    如清单 7-1 所示，在您更改了一个变量后，可以通过输入 export，后输入您更改的变量的名称永久更改，如下：


    ```

    kali >export HISTSIZE

    ```


    现在，当您离开这个环境并进入另一个环境时，HISTSIZE 变量仍设置为 0。如果您想重置 HISTSIZE 容量为 100，只需输入以下内容：


    ```

    kali >HISTSIZE=1000

    ```


    ```

    kali >export HISTSIZE

    ```


    这段代码将 HISTSIZE 变量的值设置为 1000，并将其输出到所有环境中。


    # 更改 SHELL 提示


    shell 提示是另一个环境变量，它为您提供的信息，例如您正在操作的用户和当前的目录。Kali 中的默认 shell 提示将通过以下方式设置：


    ```

    username@hostname:current_directory

    root@kali:current_directory

    ```


    如果您是普通用户，这将更改为默认 shell 提示的名称。PS1 变量有一组占位符，用于显示在提示符中显示的信息，包括以下内容：


    +   \u 当前用户的名称

    \h 主机名

    \w 当前工作目录的基本名称


    如果您好在多个 shell 中运行，或者作为多个账户登录，这将非常有用。不同的 shell 或账户有不同的 \u 和 \h，您可以轻松更改以及和您所处的系统是什么。

    让我们尝试一下，更改一个终端的提示符。例如，您可以输入以下内容：


    ```

    kali >PS1="World''s Best Hacker: #"

    ```


    ```

    World''s Best Hacker: #

    ```


    现在，每次使用这个终端，您都会被提醒你是“世界上最好的黑客”。但是，您离开的任何终端仍然会有默认的提示符命令，因为 PS1 变量只保存当前的终端的会话。记住，在导出变量之前，只用于该会话。如果您喜欢这个新的提示符，并希望在每个终端中都能看到，您需要将它导出，如下：


    ```

    kali >export PS1

    ```'
- md: "\n这将使在所有会话中保存。\n再来点子怎么样？假设您希望的终端看起来像一个 Windows cmd 提示符在本例中，您可以将提示符更改为 C:\\\
    w 以提示符显示当前目录，可以使用清单 7-2 所示。\n\n```\nkali >export PS1=\"C:\\w\" \nC:/tmp>\n```\n\
    \n清单 7-2：更改提示显示当前目录\n提示显示当前目录通常是有用的，特别是对于初学者，所以在更改 PS1 变量时要考虑这一点。\n\n## 改变你的 PATH\n\
    \n在您的环境中，最重要的变量是 PATH 变量，它控制着您在系统的哪个位置查找您输入的命令，例如 cd 和 echo。大多数命令位于 sbin 或 bin\
    \ 子目录，例如 /usr/local/sbin 或 usr/local/bin。如果 bash 没有在 PATH 变量中的某个目录中找到命令，它将返回“未找到错误”命令，即使命令确实存在于路径中的目录中。\n\
    \n你可以找到哪些命令存储在你的路径变量中使用，例如：\n\n```\nkali >echo $PATH\n/usr/local/sbin:usr/local/bin:/sbin\n\
    ```\n\n这些是终端将搜索命令的目录。例如，当您输入 ls 时，系统会在这些目录中查找 ls 命令，当找到它时，执行它。\n每个目录用 $ 分隔，不要忘记将\
    \ $ 添加到 PATH 中。\n\n## 添加 PATH 变量\n\n可以看出 PATH 变量中的内容非常重要：如果您下载并安装了一个新工具（比如 newheadingtool）/root/newheadingtool，您无法在该目录中使用该工具的命令，因为该目录不在\
    \ PATH 变量中。每次使用该工具时，首先需要导航到 /root/newheadingtool。如果您经常使用该工具，这会有不方便。\n\n要从任何目录中使用新工具，你需要包含该工具的目录添加到\
    \ PATH 变量中。\n要向 PATH 变量添加 newheadingtool。输入以下命令：\n\n```\nkali >export PATH=$PATH:/root/newheadingtool\n\
    ```\n\n这将原始变量加上 /root/newheadingtool 目录分配给路径变量，因为该变量包含了之前所做的事情，以及新的目录。\n\n如果再次检查\
    \ PATH 变量的内容，应该看到这个目录已经被添加到 PATH 的末尾，如下所示：\n\n```\nkali >echo $PATH\n/usr/local/sbin:usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/root/newheadingtool\n\
    ```\n\n现在，您可以在系统的任何位置执行 newhackingtool 应用程序，而不必导航到它的目录。bash shell 将在您的新工具列表的所有目录中查找；\n\
    \n> 对于经常使用的目录，将 PATH 添加到目录可能是一种有用的技术，但是要注意不要向 PATH 变量添加太多目录。因为系统搜索 PATH 中的每个目录后才能找到命令，所以添加大量目录可能会减慢终端运行的速度。\n\
    \n## 如何添加 PATH 变量\n\n新用户经常的一个错误是，以这种方式将一个新目录 (/root/newhackingtool) 直接分配给 PATH\
    \ 变量：\n\n```\nkali >export PATH=/root/newhackingtool\n\nkali >echo $PATH\n\n/root/newhackingtool\n\
    ```\n\n可以使用这个命令，您的 PATH 变量将只包含 /root/newhackingtool 目录，不再包含类似 /bin,/sbin 等包含命令的系统二进制目录。然后，当您使用任何系统命令时，你将收到未找到的错误命令，如下所示，除非在执行该命令时首先导航到系统二进制目录：\n\
    \n```\nbash: cd: command not found\n```\n\n记住，您想要添加 PATH 变量，而不是替换它。如果您有疑问，在修改变量之前将其内容保存在某个地方。\n\
    \n## 创建用户定义的变量\n\n您可以在 Linux 中创建自己的自定义变量，可以名为需要的新变量分配一个值。当您在进行更高级的 shell 编写时，或者发现您经常使用一个厌烦一遍又一遍输入的长命令时，这可能很简单：\n\
    \n语法很简单：输入变量的名称，后面跟着赋值符号 (=)，然后输入变量的值，如下所示：\n\n```\nkali >MYVARIABLE=Hacking is\
    \ the most valuable variable set in the century\n```\n\n这就给变量 MYVARIABLE 分配了一个字符串，查看该变量的值，可以使用\
    \ echo 命令和带有变量名的 $ 符号，就像我们之前做的那样：\n\n```\nkali >echo $MYVARIABLE\nHacking is the\
    \ most valuable skill set in the 21st century\n```\n\n我们系统的环境变量中的一种，必须确保用户定义的变量才能持久化到新的会话中。\n\
    \n如果需要删除这个新变量或任何变量，请使用 unset 命令。不过，在删除系统变量之前要三思，因为之后的操作可能会大不相同。\n\n```\nkali >unset\
    \ MYVARIABLE\nkali >echo $MYVARIABLE\n```\n\n如您见，当 unset MYVARIABLE 时，将删除该变量及其值。\n\
    \n## 总结\n\n您可能会发现环境变量是外来的，但是值得关注的。它们控制 Linux 环境的外观、行为和感觉。可以通过更改变量、导出它们、甚至创建自己的变量来使得您的环境适合您的黑客。\n\
    \n在进入第 8 章之前，完成以下练习，尝试一下你这一中学到的技能：\n\n- 使用 env 命令查看环境变量。\n- 使用 echo 命令查看变量。\n\
    - 在示例中找到 PATH 并 更改 PATH 变量的方法（请参考清单 7-2）。\n- 创建一个名为 MYVARIABLE 的变量并将其放入其中。\n-\
    \ 使用 echo 命令查看 MYVARIABLE 的内容。\n- 导出 MYVARIABLE，以便它在所有环境中都可用。\n- 使用 echo 命令查看\
    \ PATH 的内容。\n- 将您的目录添加到 PATH 中，以便任何二进制文件在主目录中使用。\n- 将变量更改为“World's Greatest Hacker”。\n\
    \n## 8\n\n### BASH 脚本编程\n\n任何黑客都必须编写脚本。因此，任何 Linux 管理员都能够编写脚本。黑客经常需要自动化命令，有时需要多个工具，可以通过自己编写简单程序高效完成。在本章中，我们构建几个简单的脚本来帮助您开始编写。随着我们的进展，我们将添加功能和特性，最终构建一个能够在一系列\
    \ IP 地址中查找脚本。成为一名优秀的黑客，您还需要使用一种广泛使用的语言编写脚本，例如 Ruby (Metasploit exploits 用 Ruby\
    \ 编写的)，Python (许多黑客工具都是 Python 脚本) 或 Perl (Perl 是最好的脚本语言)。在第 17 章中，我们将介绍 Python\
    \ 脚本。\n\n### Bash 的成就\n\nshell 是用户操作系统的接口，允许您操作文件和运行程序等。shell 的优点是，您可以直接从计算机执行这些任务，而不是通过\
    \ GUI。它允许您将任务定制。Bash 是更为人性化的。由于 bash 几乎可以在 Linux 和 UNIX 版（包括 macOS 和 Kali）上使用，我们将只使用\
    \ bash shell。\n\n- bash 可以运行您的常规命令、实用程序或应用程序，但是它包含一些内置命令。\n\n在本章后的表 8-1 列出了 bash\
    \ shell 中的常用的命令。\n\n在前面的章节，我们使用了 cd、pwd、set 命令。在本节，我们将使用另外两个命令：echo 命令（在第 3 章中使用）和\
    \ read 命令（读取数据并到地方）。我学习了这两个命令就可以构建一个简单的脚本。\n\n您需要一个文本编辑器来创建 bash 脚本。可以使用任何您喜欢的\
    \ Linux 文本编辑器，包括 vim、emacs、gedit 等。在这些教程中我将使用 vim，就像在前几章一样。不同的编辑器会对脚本的功能造成影响。\n\
    \n### 你的第一个脚本：“HELLO HACKERS!”\n\n对于您的第一个脚本，我们将从一个简单的程序开始，该程序将向屏幕返回一次消息，该消息说：“你好，黑客——来吧！”打开文本编辑器，开始吧。\n\
    \n首先，您需要告诉操作系统您用哪个脚本解释器。输入一个开头标识符，它就是哈希符号和感叹号的组合，如下所示：\n\n```\n#!/bin/bash\n```\n\
    \n按照指定的 /bin/bash 解析系统使用 bash 解释器。正如我们在后面的章节看到的，可以使用 #! 使用其他解释器，如 Perl 或 Python。在这里，您希望使用\
    \ bash 解释器，因此输入如下内容：\n\n```bash\n#!/bin/bash\necho \"Is my first bash script.\
    \ With me luck.\"\necho \"Hello, Hackers-Arise!\"\n```\n\n接下来，输入 echo 命令，告诉它简单地将命令后的内容重定向（或回显）到监视器。\n\
    \n在这种情况下，我们希望向我们返回“Hello, Hackers-Arise!”所示的表 8-1。注意，要的消息必须使用双引号。\n\n清单 8-1\n\n\
    清单 8-1：“Hello, Hackers-Arise!” 脚本\n\n在这里，你还可以看到前面有一个井号 (#)。这是一个注释，是您留给自己或任何阅读该文档的人解释在脚本中所做的事情。程序员在每种编码语言中使用注释。这些注释不是由解释器读取或执行，因此您不必担心代码混乱。它们只对人类可见。bash\
    \ shell 知道，如果以 # 字符开头，那么它就是一个注释。\n\n现在，将该文件保存为 HelloHacker 不带扩展名，退出文本编辑器。\n\n\
    ## 设置执行权限\n\n默认情况下，新建的 bash 脚本（所有者）也无法执行。让我们在命令中查看新文件的权限，方法是使用 cd 移动到目录中，然后输入\
    \ ls -l。它是这样的：\n\n```\nkali >ls -l\nrw-r--r-- 1 root root 42 Oct 22 HelloHacker\n\
    ```\n\n如您见，我们的新文件 w-r--r-- (644)。正如我们在第 5 章中学，这意味着这个文件的所有者只有读(r)和写(w)权限，而没有执行(x)。为了运行这个脚本，我们需要赋予执行权限。可以使用\
    \ chmod 命令更改权限，授予所有者、组和其他用户执行权限，请输入以下命令：\n\n```\nkali >chmod 755 HelloHacker\n\
    ```\n\n现在，对文件用列表显示，就像这样：\n\n```\nkali >ls -l\nrwxr-xr-x 1 root root 42 Oct 22\
    \ HelloHacker\n```\n\n现在脚本可以执行了！\n\n## HelloHacker\n\n运行我们的简单脚本，输入以下命令：\n\n```\n\
    kali ./HelloHacker\n```\n\n在当前目录中执行此脚本。告诉系统，如果另一个名为 HelloHacker 的目录，请忽略它。在当前目录运行\
    \ ./ 是很好的实践，当我们按下 ENTER 键时，我们将简单的脚本将返回到监视器：\n\nHello, Hacker-Arise!\n\n## 添加变量和用户输入\n\
    \n现在我们有一个简单的脚本。它所做的只是将消息回到标准输出。如果你创建更高级的脚本，可能需要添加变量。变量是一个变量，可以在内存中存储某些变量。某个变量”是一些字母或单词（字符串）或数字。它被称为变量，因为它包含的值是变的，对于编写脚本非常有用。在本章节中，我们将一些功能来演示用户输入他们的名字，将他们任何内容放入变量中。然后提示用户输入他们的章节，并将输入放入变量中。在编辑器中打开一个新文件，并输入\
    \ 8-2 脚本。\n\n```bash\n#!/bin/bash\n# This is your second bash script. In this\
    \ one, you prompt the user for input, place the input in a variable, and display\
    \ the variable contents in a string.\n\necho \"What is your name?\"\nread name\n\
    \necho \"What chapter are you on in Linux for Hackers?\"\nread chapter\n\necho\
    \ \"Welcome $name to Chapter $chapter of Linux for Hackers!\"\n```\n\n## 使用变量的简单脚本\n\
    \n我们在 /bash 开始，告诉系统使用这个脚本 ① 解释器。然后添加一个注释脚本 ② 功能，然后我们提示用户输入他们的名字，③ 我们的名字，读取输入并将其转换为变量。然后我们提示用户输入他们的章节，④\
    \ 我们再次读取输入一个变量，这个章节将告诉我们。在最后一行中，我们构造一个字符串，欢迎读者（他们的名字）在章节。我们使用 echo 命令，并用引号提供在屏幕上显示的文本。然后为了让用户输入的名字和章节，我们将变量添加到消息中应该出现的位置。正如第\
    \ 7 节，使用变量中包含的值，必须在变量名前加上 $。将此文件命名为 Welcome.sh。其中 .sh 是脚本文件的扩展。您可能已经注意到，我们没有包含扩展名，这并不是严格要求的，如果你关闭扩展名，该文件保存为\
    \ shell 脚本。现在，让我们运行这个脚本。不要忘记使用 chmod 给它执行权限，否则，操作系统将权限拒绝。\n\n```\nkali >./Welcome.sh\n\
    What is your name?\nOccupupytheWeb\nWhat chapter are you on in Linux for 8\nWelcome\
    \ OccupytheWeb to chapter 8 of Linux for Hackers!\n```\n\n如您所见，您的从用户那里获取输入，将其放入变量中，然后使用这些输入为用户发出问候。这是一个简单的脚本，但它教你如何使用变量并从键盘输入。这些都是脚本中的关键概念，你将需要在更复杂的脚本中使用它们。\n\
    \n## 您的第一个黑客：扫描打开的端口\n\n现在你已经掌握了一些基础的脚本编写技巧，接下来我们来学习一些更高级的脚本编写技巧，它们具有实际作用的应用程序。“黑客指的是那些抱有坏意的黑客，比如获取信用卡号来修改密码。白客是那些良好意图的人，比如帮助软件开发人员或系统管理员使用他们的系统来确保安全。“黑客是那些倾向于在这两个极端之间游走的人。\n\
    \n在之前我们介绍过一个名为“nmap”的简单易用的工具，这个工具默认安装在 Kali 中。您可能听说过 nmap 这个名字，它用于探测一个 IT 安全系统，查看它是否连接到网络，并查找哪些端口是打开的。通过发现开放的端口，您可以在目标系统上运行服务。对于任何黑客或系统管理员来说这是一项重要的任务。\n\
    \n简单的方法是，运行 nmap <target IP> <optionally, target port> 如下：\n\n```\nnmap <type\
    \ of scan> <target IP> <optionally, target port>\n```\n\nnmap 扫描类型：\n\n- -sT：TCP\
    \ 连接扫描\n- -sS：SYN 扫描\n- -sU：UDP 扫描\n- -p：指定扫描端口\n- -F：扫描常用端口\n- -A：全能扫描\n- -sO：操作系统指纹\n\
    - -sV：版本探测\n- -T4：设置扫描速度（0-5）\n\n```\nnmap -sT -p 80 192.168.1.1\n```\n\nnmap\
    \ 扫描结果示例：\n\n```\nHost 192.168.1.1 is up.\nPort scan result:\nPORT   STATE SERVICE\n\
    80/tcp   open   http\n443/tcp  open   https\n```\n\nnmap 扫描目标：\n\n```\nnmap 192.168.1.1\n\
    ```\n\nnmap 扫描 192.168.1.1 之后。nmap 扫描 192.168.1.1 之后，我们将。\n"
  mdcn: "\n这将会在所有会话中保存。\n再来点子怎么样？假设您希望的终端看起来像一个 Windows cmd 提示符。在本例中，您可以将提示符更改为 C:\\\
    w 以提示符显示当前目录，可以使用清单 7-2 所示。\n\n```\nkali >export PS1=\"C:\\w\" \nC:/tmp>\n```\n\
    \n清单 7-2：更改提示显示当前目录\n提示显示当前目录通常是有用的，特别是对于初学者，所以在更改 PS1 变量时要考虑这一点。\n\n## 改变你的 PATH\n\
    \n在您的环境中，最重要的变量是 PATH 变量，它控制着您在系统的哪个位置查找您输入的命令，例如 cd 和 echo。大多数命令位于 sbin 或 bin\
    \ 子目录，例如 /usr/local/sbin 或 usr/local/bin。如果 bash 没有在 PATH 变量中的某个目录中找到命令，它将返回“未找到错误”命令，即使命令确实存在于路径中的目录中。\n\
    \n你可以找到哪些命令存储在你的路径变量中使用，例如：\n\n```\nkali >echo $PATH\n/usr/local/sbin:usr/local/bin:/sbin\n\
    ```\n\n这些是终端将搜索命令的目录。例如，当您输入 ls 时，系统会在这些目录中查找 ls 命令，当找到它时，执行它。\n每个目录用 $ 分隔，不要忘记将\
    \ $ 添加到 PATH 中。\n\n## 添加 PATH 变量\n\n可以看出 PATH 变量中的内容非常重要：如果您下载并安装了一个新工具（比如 newheadingtool）/root/newheadingtool，您无法在该目录中使用该工具的命令，因为该目录不在\
    \ PATH 变量中。每次使用该工具时，首先需要导航到 /root/newheadingtool。如果您经常使用该工具，这会有不方便。\n\n要从任何目录中使用新工具，你需要包含该工具的目录添加到\
    \ PATH 变量中。\n要向 PATH 变量添加 newheadingtool。输入以下命令：\n\n```\nkali >export PATH=$PATH:/root/newheadingtool\n\
    ```\n\n这将原始变量加上 /root/newheadingtool 目录分配给路径变量，因为该变量包含了之前所做的事情，以及新的目录。\n\n如果再次检查\
    \ PATH 变量的内容，应该看到这个目录已经被添加到 PATH 的末尾，如下所示：\n\n```\nkali >echo $PATH\n/usr/local/sbin:usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/root/newheadingtool\n\
    ```\n\n现在，您可以在系统的任何位置执行 newhackingtool 应用程序，而不必导航到它的目录。bash shell 将在您的新工具列表的所有目录中查找；\n\
    \n> 对于经常使用的目录，将 PATH 添加到目录可能是一种有用的技术，但是要注意不要向 PATH 变量添加太多目录。因为系统搜索 PATH 中的每个目录后才能找到命令，所以添加大量目录可能会减慢终端运行的速度。\n\
    \n## 如何添加 PATH 变量\n\n新用户经常的一个错误是，以这种方式将一个新目录 (/root/newhackingtool) 直接分配给 PATH\
    \ 变量：\n\n```\nkali >export PATH=/root/newhackingtool\n\nkali >echo $PATH\n\n/root/newhackingtool\n\
    ```\n\n可以使用这个命令，您的 PATH 变量将只包含 /root/newhackingtool 目录，不再包含类似 /bin,/sbin 等包含命令的系统二进制目录。然后，当您使用任何系统命令时，你将收到未找到的错误命令，如下所示，除非在执行该命令时首先导航到系统二进制目录：\n\
    \n```\nbash: cd: command not found\n```\n\n记住，您想要添加 PATH 变量，而不是替换它。如果您有疑问，在修改变量之前将其内容保存在某个地方。\n\
    \n## 创建用户定义的变量\n\n您可以在 Linux 中创建自己的自定义变量，可以名为需要的新变量分配一个值。当您在进行更高级的 shell 编写时，或者发现您经常使用一个厌烦一遍又一遍输入的长命令时，这可能很简单：\n\
    \n语法很简单：输入变量的名称，后面跟着赋值符号 (=)，然后输入变量的值，如下所示：\n\n```\nkali >MYVARIABLE=Hacking is\
    \ the most valuable variable set in the century\n```\n\n这就给变量 MYVARIABLE 分配了一个字符串，查看该变量的值，可以使用\
    \ echo 命令和带有变量名的 $ 符号，就像我们之前做的那样：\n\n```\nkali >echo $MYVARIABLE\nHacking is the\
    \ most valuable skill set in the 21st century\n```\n\n我们系统的环境变量中的一种，必须确保用户定义的变量才能持久化到新的会话中。\n\
    \n如果需要删除这个新变量或任何变量，请使用 unset 命令。不过，在删除系统变量之前要三思，因为之后的操作可能会大不相同。\n\n```\nkali >unset\
    \ MYVARIABLE\nkali >echo $MYVARIABLE\n```\n\n如您见，当 unset MYVARIABLE 时，将删除该变量及其值。\n\
    \n## 总结\n\n您可能会发现环境变量是外来的，但是值得关注的。它们控制 Linux 环境的外观、行为和感觉。可以通过更改变量、导出它们、甚至创建自己的变量来使得您的环境适合您的黑客。\n\
    \n在进入第 8 章之前，完成以下练习，尝试一下你这一中学到的技能：\n\n- 使用 env 命令查看环境变量。\n- 使用 echo 命令查看变量。\n\
    - 在示例中找到 PATH 并更改 PATH 方法（请参考清单 7-2）。\n- 创建一个名为 MYVARIABLE 的变量并将其其中。\n- 使用 echo\
    \ 命令查看 MYVARIABLE。\n- 导出 MYVARIABLE 以便在所有会话中可用。\n- 使用 echo 命令查看 PATH 内容。\n- 将您的目录添加到\
    \ PATH 中，以便任何二进制文件中使用。\n- 将变量更改为“World's Greatest Hacker”。\n\n## B 脚本编程\n\n任何黑客都必须编写脚本。因此，任何\
    \ Linux 管理员都能够编写脚本。黑客经常需要自动化命令，有时需要多个工具，可以通过自己编写简单程序高效完成。在本章中，我们将构建几个脚本来帮助您开始。随着我们的进展，我们将添加功能和特性，最终构建一个成为优秀的黑客。你还需要使用一种广泛使用的语言编写脚本，例如\
    \ Ruby (Metasploit exploits 用 Ruby)，Python (许多黑客工具都是 Python 脚本) 或 Perl (Perl 是最好的语言)。在第\
    \ 17 章中，我们将介绍 Python。\n\n### Bash 的成就\n\nshell 是用户操作接口，允许您操作文件和运行程序。shell 的优点是您可以直接从计算机执行任务，而不是通过\
    \ GUI。它允许将任务定制。Bash 是更为人性化的。由于 bash 可以在 Linux 和 UNIX 版（包括 macOS 和 Kali）上使用，我们将只使用\
    \ bash 可以运行常规命令、实用程序或应用程序，但是它包含一些内置命令。\n\n在本章列出了 bash shell 中的常用的命令。在前面的章节，我们使用了\
    \ cd、pwd、set 命令。在本节我们将使用另外两个命令：echo 命令（在章节中使用）和 read 命令（读取数据）。我学习了这两个命令就可以构建一个简单的脚本。你需要一个文本编辑器来创建\
    \ bash 脚本。可以使用任何喜欢的 Linux 编辑器，包括 vim、emacs 等。在教程中我将使用 vim，就像在前章节一样。不同的编辑器会对脚本的功能影响。\n\
    \n### 你的第一个脚本：“HELLO HACKERS!”对于您的第一个脚本，我们将从简单的程序开始。首先，您需要告诉操作系统用哪个脚本解释器。输入一个开头符，它就是哈希符号和叹号的组合，如下所示：\n\
    \n```\n#!/bin/bash\n```\n\n按照指定的 /bin/bash 使用 bash 解析器。正如我们在后面的章节看到的，可以使用 #! 其他解释器，如\
    \ Perl 或 Python。在这里您希望使用 bash 解释器，因此输入如下：\n\n```bash\n#!/bin/bash\necho \"Is my\
    \ first bash script. With me.\"\necho \"Hello, Hacker!\"\n```\n\n接下来，输入 echo 命令，告诉它简单将命令后的内容（或回显）到监视器。在这种情况下，我们希望向我们“Hello,\
    \ Hackers!”所示的清单 8-1。注意，的消息必须使用双引号。\n\n清单 8-1：“Hello, Hackers!”\n\n脚本。在这里，你还可以看到前面有一个井号\
    \ (#)。这是一个注释，是给自己或任何阅读文档的人在脚本中所做的。程序员在每种语言中使用注释。这些注释不是由解释器读取或执行，因此不必担心代码混乱。它们只对人类可见。bash\
    \ shell 知道，如果以 # 字符开头，那么就是一个注释。现在，将该文件保存为 Hello Hacker 不带扩展名，退出文本编辑器。\n\n## 设置执行权限\n\
    \n默认情况下，新建 bash 脚本（所有者）无法执行。让我们在命令中查看新文件的权限，方法是使用 cd 移动到目录中，然后输入 ls -l。它是这样的：\n\
    \n```\nkali >ls -l\nrw-r--r-- 1 root root 42 Oct 22 Hacker\n```\n\n如您见，我们的新文件\
    \ w-r--r-- (644)。正如我们在第 5 章中学，这意味着这个文件的所有者只有读(r)和写(w)权限，而没有执行(x)。为了运行这个脚本，我们需要赋予执行权限。可以使用\
    \ chmod 命令更改权限，授予所有者、组和其他用户执行权限，请输入以下命令：\n\n```\nkali >chmod 755 Helloacker\n\
    ```\n\n现在，对文件用列表显示，就像这样：\n\n```\nkali >ls -l\nrwxr-xr-x 1 root root 42 Oct 22\
    \ Helloacker\n```\n\n现在脚本可以执行了！\n\n## Hello Hacker\n\n运行我们的简单脚本，输入以下命令：\n\n```\n\
    kali ./Helloacker\n```\n\n在当前目录中执行此脚本。告诉系统，如果另一个名为 Hello Hacker 的目录，请忽略它。在当前目录运行\
    \ ./ 是很好的实践，当我们按下 ENTER 键时，我们将简单的脚本将返回到监视器：\n\nHello, Hacker!\n\n## 添加变量和用户输入\n\
    \n现在我们有一个简单的脚本。它做的只是将消息回到标准输出。如果你创建更高级的脚本，可能需要添加变量。变量是一个变量，可以在内存中存储某些变量。某个变量是一些字母或单词（字符串）或数字。它被称为变量，因为它包含的值是变的，对于编写脚本非常有用。在本章节中，我们将一些功能来演示用户输入他们的名字，将他们任何内容放入变量中。然后提示用户输入他们的章节，并将输入放入变量中。在编辑器中打开一个新文件，并输入\
    \ 8-2 脚本。\n\n```bash\n#!/bin/bash\n# This is your second bash script. In this\
    \ one, you prompt the user for input, place the input in a variable, and display\
    \ the variable contents in a string.\n\necho \"What is your name?\"\nread name\n\
    \necho \"What chapter are you on in Linux for Hackers?\"\nread chapter\n\necho\
    \ \"Welcome $name to Chapter $chapter of Linux for Hackers!\"\n```\n\n## 使用变量的简单脚本\n\
    \n我们在 /bash 开始，告诉系统使用这个脚本 ① 解释器。然后添加一个注释脚本 ② 功能，然后我们提示用户输入他们的名字，③ 我们的名字，读取输入并将其转换为变量。然后我们提示用户输入他们的章节，④\
    \ 我们再次读取输入一个变量，这个章节将告诉我们。在最后一行中，我们构造一个字符串，欢迎读者（他们的名字）在章节。我们使用 echo 命令，并用引号提供在屏幕上显示的文本。然后为了让用户输入的名字和章节，我们将变量添加到消息中应该出现的位置。正如第\
    \ 7节，使用变量中包含的值，必须在变量名前加上 $。将此文件命名为 Welcome.sh。其中 .sh 是脚本文件的扩展。您可能已经注意到，这里没有扩展名，退出文本编辑器。\n"
