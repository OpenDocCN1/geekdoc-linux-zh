- md: "\n## 修改文件和目录\n\n找到文件和目录后，您将希望能够对它们执行操作。在本节中，我们将介绍如何创建文件和目录，复制文件，重命名文件名以及删除文件和目录。\n\
    \n## 创建文件\n\n有许多方法可以在 Linux 中创建文件，但是我们现在看着两个简单的方法。第一个是 cat。它是连接（concatenate）的缩写，意思是将各个部分组合在一起（不是你最喜欢的威尔赛科动物）。cat\
    \ 命令通常用于显示文件的内容，也可以用于创建文件。要创建更大的文件，最好在编辑器（如 vim, emacs, leappad, edit or kate）输入代码，然后将其保存为文件。\n\
    \n## 使用 cat 连接\n\ncat 命令后跟一个文件名创建一个文件，但是我们遵循带有重定向的 cat 命令，用 > 符号，以及我们想要创建的文件名称。以下是一个例子：\n\
    \n```bash\nkali > hackskills\nHacking is the most valuable skill of the 21st century!\n\
    ```\n\n当您按 ENTER 时，Linux 将进入交互模式并等待您输入该文件的内容。这可能让人理解，因为提示（kali >）消失了，只要你一开始打字，无论你输入什么都会写入文件中（在这种情况下，输入\
    \ hackskills）。在这里，我键入“Hacking is the most valuable skill of the 21st century！”\n\
    \n退出并返回提示，按下 CTRL-D。当我想查看文件 hackskills 中的内容时，我输入以下内容：\n\n```bash\nkali > hackskills\n\
    Hacking is the most valuable skill of the 21st century!\n```\n\n如果您不想使用重定向符号，Linux\
    \ 将在终端打印文件的内容。要向文件添加更多内容，可以使用带有重定向（>>）的 cat 命令，然后使用想要添加到文件末尾的任何内容。以下是一个例子：\n\n\
    ```bash\nkali > hackskills\nEveryone should learn hacking\n```\n\nLinux 再次进入交互模式，等待输入内容添加到文件。当我键入“Everyone\
    \ should learn hacking”并按下 CTRL-D，我到了终端提示。现在，当我用 cat 显示该文件的内容时，我可以看到该文件已经加上了内容“Everyone\
    \ should learn hacking”，如下：\n\n```bash\nkali > hackskills\nHacking is the most\
    \ valuable skill of the 21st century! Everyone should learn hacking\n```\n\n如果我想用新内容覆盖文件，我可以简单再次使用\
    \ cat 命令和一个重定向符号（>），如下所示：\n\n```bash\nkali > cat hackingskills\nEveryone in IT\
    \ security without hacking skills is in the dark\n\nkali > cat hackingskills\n\
    Everyone in IT security without hacking skills is in the dark\n```\n\n命令的如下：\n\
    \n```bash\ncat > hackingskills    # 是打开或创建一个文件(以人机交互模式)写入内容\ncat hackingskills\
    \      #在控制终端上打印文件内容\n```\n\n正如您在此处看到的，linux 在交互模式下，输入文本后退回到提示。当我再次使用 cat 查看文件的内容时，我发现我之前的单词已被最新文本覆盖。\n\
    \n## 用 touch 创建文件\n\n文件创建的第二个命令是 touch。此命令最初是用于用户 touch即可更改某些详细信息，例如创建或修改日期。但是，如果该文件不存在，则命令默认情况下创建文件。\n\
    \n让我们 touch 创建一个文件名为 newfile:\n\n```bash\nkali > touch newfile\n```\n\n现在，当用 ls\
    \ -l 查看目录的列表时，我看到已经创建了一个名为 newfile 的文件。请注意，它的大小为0，因为 newfile 中没有内容。\n\n## 创建目录\n\
    \n在 Linux 中创建目录的命令是 mkdir，它是创建目录(directory)的缩写。要创建名为 newdirectory的目录，请输入命令：\n\n\
    ```bash\nkali > mkdir newdirectory\n```\n\n要导航进入这个新创建的目录下，只需要\n\n```bash\nkali\
    \ > cd newdirectory\n```\n\n## 复制文件\n\n要复制文件，我们使用 cp 命令。这将新的位置创建文件的副本，并保留旧文件。\n\
    \n在这里，我们将使用 touch 在根目录中创建一个文件 oldfile，并将其复制到/root/newdirectory，在过程中重命名并保留原始oldfile:\n\
    \n```bash\nkali > touch oldfile\nkali > cp oldfile /root/newdirectory/newfile\n\
    ```\n\n重命名文件是可以的，只需将您想要的名称添加到目录路径的末尾即可。如果在复制文件时不重命名该文件，默认情况下该文件将保留原始名称。\n\n当我们引导进入\
    \ newdirectory 时，我们看到有一个名为 newfile 的 oldfile 的精确副本：\n\n```bash\nkali > cd newdirectory\n\
    kali > ls\nnewfile oldfile\n```\n\n## 重命名文件\n\n不幸的是，Linux 没有专门用于重命名文件的命令（如 Windows\
    \ 和其他一些操作系统那样），但它确实有 mv (move) 命令。\n\nmv 命令可以用于移动文件或目录到新的位置，或者只是为现有文件指定一个新的名称（重命名）。要将\
    \ oldfile 重命名为 oldfile2，请输入以下内容：\n\n```bash\nkali > mv oldfile oldfile2\nkali\
    \ > ls\n```\n\n现在列出目录会看到 oldfile2 而不是 oldfile，因为它已经被重命名。您可以对目录做同样。\n\n## 删除文件\n\
    \n要删除文件，只需使用 rm 命令：\n\n```bash\nkali > rm oldfile2\n```\n\n如果您现在在目录下执行 ls 命令就可以确认文件已被删除。\n\
    \n## 删除目录\n\n删除目录的命令类似于删除文件的 rm 命令，但增加了 dir (用于目录)，如下：\n\n```bash\nkali > rmd\
    \ newdirectory\nrmdir: failed to remove 'newdirectory': Directory not empty\n\
    ```\n\n重要的是删除非空的目录会给出一个警告“Directory not empty”。删除目录之前，必须删除目录下的所有内容。为了防止意外删除您的对象。\n\
    \n如果您想一次性删除一个目录及其内容，可以在 rm 之后使用 -r，如下所示：\n\n```bash\nkali > rm -r newdirectory\n\
    ```\n\n但需要注意的是：要小心使用 -r 选项，至少在开始时因为错误删除了有价值的文件和目录这不是你想要的操作。\n\n## 现在开始！\n\n现在您已经掌握了一些文件系统中导航的基本技能，可以在\
    \ 之前稍微使用 Linux 系统。使用终端的最佳方法是立即尝试。在后的章节中，我们将深入探讨 hacking。\n\n练习\n\n在继续讨论第 2 章之前，请尝试使用\
    \ Linux 命令完成以下练习：\n\n- 使用 ls 命令探索 Linux 目录结构。使用 cd 进入目录并运行 pwd 来验证您在目录中的位置。\n\
    - 使用 whoami 命令验证您是哪个用户。\n- 使用 locate 命令查找密码列表。\n- 使用 cat 创建新文件，然后将内容追加到文件。请记住\
    \ > 将重定向到文件（覆盖），而 >> 将内容追加到文件中。\n- 创建一个名为 hackdirectory 的新目录，并在目录下创建一个名为 hackedfile\
    \ 的新文件。现在将该文件复制到 root 目录下将其重命名为 secretfile。\n\n## 2 文本操作\n\n在 Linux 系统中，我们处理的所有都是文件，并且大多数都是文本文件；单个例子，在\
    \ Linux 系统中，所有的配置文件都是文本文件。我们只需要打开文件，更改文件的内容，保存文件，再重启应用就可以更改配置。由于存在大量文本文件，操作文本在\
    \ Linux 管理和应用中显得尤为重要。在这一章，你将通过一些命令和技巧在 Linux 系统下操作文本。\n\n为了方便演示，我将使用网络入侵检测系统(NIDS)\
    \ Snort。Snort最早由 Marty Roesch 开发，现在属于 Cisco。NIDS 经常用于检测入侵，如果你想成为成功的黑客，你必须了解如何检测入侵与追踪的方法。\n\
    \nNOTE\n\n如果你使用的 Kali Linux 没有预装 Snort，你可以输入 apt-get install snort 从 Kali 下载 Snort。\n\
    \n## 查看文件\n\n如第 1 章所示，最基本的打印命令是 cat，但是它它的限制。使用 cat 命令打印位于/etc/snort 的 Snort 配置文件\
    \ (snort.conf) (参见清单 2-1)：\n\n```bash\nkali > cat /etc/snort/snort.conf\n```\n\
    \n清单 2-1: 在终端打印 snort.conf\n\n现在的屏幕上应该显示了整个 snort.conf 文件，但这并不是最方便或最实际的使用文件方法。\n\
    \n```text\n# include $SO_RULE_PATH/exploit.rules\n# include $SO_RULE_PATH/exploit.rules\n\
    # include $SO_RULE_PATH/exploit.rules\n# include $SO_RULE_PATH/exploit.rules\n\
    # include $SO_RULE_PATH/exploit.rules\n\n--snippet--\n\n# event thresholding or\
    \ suppressions commands...\n\nkali >\n```\n\n在接下来的两个小章节，我将向你展示 head 和 tail 命令。这是两种只显示部分文件内容的方法，用来更简单地查看关键点。\n\
    \n## 查看开头\n\n如果你只是查看文件开头，你可以使用 head 命令，这个命令默认打印文件的前 10 行。例如，下面命令会打印 snort.conf\
    \ 的前 10 行：\n\n```bash\nkali > head /etc/snort/snort.conf\n------------------------------------------------------\n\
    ```\n\n```text\n# VRT Rules Packages Snort.conf\n#\n#    For more information\
    \ visit us at:\n\n--snippet--\n# Snort bugs:bugs@snort.org\n```\n\n如果你想看多或少于默认的10\
    \ 行，在 head 命令后和文件路径前输入连接(-)和你你想要的数量。例如，如果你想看文件的前 20 行，你需要输入如清单 2-2 上面的命令：\n\n\
    ```bash\nkali > head -20 /etc/snort/snort.conf\n------------------------------------------------------\n\
    # VRT Rules Packages Snort.conf\n#\n# For more information visit us at:\n#.\n\
    # Options : --enable-gre --enable-mpls --enable-target --enable-ppm --enable-profiling\
    \ enable-zlib --enable-normalizer --enable-reload --enable-react\n```\n\n清单 2-2:\
    \ 在终端打印 snort.conf 的前 20 行你应该在终端中看到 snort.conf 的前 20 行。\n\n## 查看结尾\n\ntail 命令和\
    \ head 命令相似。只是 tail 命令查看文件最后几行。使用 tail 查看：\n\n```bash\nkali > tail /etc/snort/snort.conf\n\
    ```\n\n注意这个命令打印了最后的一些行，但是打印所有的行。tail 默认打印 10 行。你可以打印更多如 snort.conf 最后 20 行。和 head\
    \ 命令一样，可以在 tail 命令和文件之间输入连接符(-)和你你想看的行数。如下清单 2-3：\n\n```bash\nkali > tail -20\
    \ /etc/snort/snort.conf\n```\n\n清单 2-3: 在终端打印 snort.conf 的后 20 行。\n\n## 行数\n\n\
    为了处理非常长的文件的时候我们可能希望打印行号。因为 snort.conf 超过 600 行，标记行号会有帮助，这样更容易引用内容并在回到那个位置。我们使用\
    \ nl (number lines) 命令来打印行号。输入清单 2-4 的命令：\n\n```bash\nkali > nl /etc/snort/snort.conf\n\
    ```\n\n```text\n12 ################################################################\n\
    13 #dynamic library rules\n14 #include $SO_RULE_PATH/bad_traffic.rules\n--snippet--\n\
    630 #include $SO_RULE_PATH/iis.rules\n631 #include $SO_RULE_PATH/misc.rules\n\
    ```\n\n 2-4: 在终端输出显示行号现在每一行都有一个数字（代表行号），引用起来更方便。\n\n## 使用 grep 过滤文本\n\n命令 grep\
    \ 是最广泛的过滤操作。它可以让你打印出来的文件内容。例如，如果你查看 snort.conf 里面带有特定单词，你可以使用 cat 然后只打印那些。（参阅清单\
    \ 2-5）。\n\n```bash\nkali > cat /etc/snort/snort.conf | grep output\n```\n\n```text\n\
    # output unified2: filename merged.log, limit 128, nostamp, mpls_event_types,\
    \ vlan_event_types\n# output alert_unified2: filename merged.log, limit 128, nostamp\n\
    # output log_unified2: filename merged.log, limit 128, nostamp\n# output alert_syslog:\
    \ LOG_AUTH LOG_ALERT\n# output log_tcpdump: tcpdump.log\n```\n\n清单 2-5: 打印 grep\
    \ 规定有关关键字或命令的行这个命令首先要看 snort.conf 然后使用管道 (|) 将其传递给 grep，它将文件作为输入，查找出现 output 的行，然后只打印这些行。grep\
    \ 命令是 Linux 中的一个非常大和重要的命令，因为它可以快速搜索文件中任何一个命令或命令。\n\n## 挑战：使用 grep, nl, tail, and\
    \ head\n\n假设你想要使用至少 4 个学习的命令打印前面 5 行，你该做什么？（提示：除了我们学习的命令，还有很多其他选择。你可以使用 Linux\
    \ 内置命令 man 来学习更多命令。例如，man 会显示 tail 命令的帮助文档）。有很多方法可以解决这个问题，我将向你展示如何通过更改来实现其中一个方法，然后你需要寻找其他方法。\n\
    \n### 第一步\n\n```bash\nkali | nl /etc/snort/snort.conf | grep output\n```\n\n```text\n\
    34 # Step #6: output plugins\n512 # Step #6: grep output plugins\n518 # output\
    \ unified2: filename merged.log, limit 128, nostamp, mpls_event_types, vlan_event_types\n\
    521 # output alert_unified2: filename snort.alert, limit 128, nostamp\n522 # output\
    \ log_unified2: filename snort.log, limit 128, nostamp\n525 # output alert_syslog:\
    \ LOG_AUTH LOG_ALERT\n528 # output log_tcpdump: tcpdump.log\n```\n\n我们可以看到 # Step\
    \ #6: output plugins 是第 512 行，然后我们就知道想要第 512 行前面的 5 行和第 512 行本身（就是第 507 到 512\
    \ 行）。\n"
  mdcn: "\n[content]\n\n## 修改文件和目录\n\n找到文件和目录后，您将希望能够对它们执行操作。在本节中，我们将介绍如何创建文件和目录，复制文件，重命名文件名以及删除文件和目录。\n\
    \n## 创建文件\n\n在 Linux 中有很多方法可以创建文件，但我们现在来看两个简单的方法。第一个是 cat。它是连接（concatenate）的缩写，意思是将各个部分组合在一起（不是你最喜欢的威尔赛科动物）。cat\
    \ 命令通常用于显示文件的内容，也可以用于创建文件。要创建更大的文件，最好在编辑器（如 vim, emacs, leappad, edit 或 kate）中输入代码，然后将其保存为文件。\n\
    \n## 使用 cat 连接\n\ncat 命令后跟一个文件名创建一个文件，但我们遵循带有重定向的 cat 命令，用 `>` 符号，以及我们想要创建的文件名称。以下是一个例子：\n\
    \n```bash\nkali > hackskills\nHacking is the most valuable skill of the 21st century!\n\
    ```\n\n当您按 ENTER 时，Linux 将进入交互模式并等待您输入该文件的内容。这可能让人困惑，因为提示符（`kali >`）消失了，只要你一开始打字，无论你输入什么都会写入文件中（在这种情况下，输入\
    \ hackskills）。在这里，我键入“Hacking is the most valuable skill of the 21st century！”\n\
    \n退出并返回提示符，按下 CTRL-D。当我想查看文件 hackskills 中的内容时，我输入以下内容：\n\n```bash\nkali > hackskills\n\
    Hacking is the most valuable skill of the 21st century!\n```\n\n如果您不想使用重定向符号，Linux\
    \ 将在终端打印文件的内容。要向文件添加更多内容，可以使用带有重定向（`>>`）的 cat 命令，然后使用想要添加到文件末尾的任何内容。以下是一个例子：\n\
    \n```bash\nkali > hackskills\nEveryone should learn hacking\n```\n\nLinux 再次进入交互模式，等待输入内容添加到文件。当我键入“Everyone\
    \ should learn hacking”并按下 CTRL-D，回到终端提示符。现在，当我用 cat 显示该文件的内容时，我可以看到该文件已经加上了内容“Everyone\
    \ should learn hacking”，如下：\n\n```bash\nkali > hackskills\nHacking is the most\
