  md: '# 映射你自己的 IP 地址


    在操作系统中它被迹称为 hosts 的特殊文件是执行域名——IP 地址转换。这个 hosts 文件对于 /etc/hosts，与 DNS 有类似之处，可以使用它来指定你自己的
    IP 地址——域名映射。换句话，当你在浏览器输入 www.microsoft.com（或者其他域名名）时，你可以决定浏览器将访问哪个 IP 地址而不是让 DNS
    服务决定。对于客户，这对于劫持网络上的 TCP 连接使用 dnsspoof 等工具将流量定向到恶意的 Web 服务非常重要。


    在命令行，输入以下命令（你可以用首选的编辑器替换为 Leappad）：


    ```

    kali >leappad /etc/hosts

    ```


    你应该看到的 hosts 文件，如图 3-3所示


    ![](img/77055846b6e5bd43c939d5fb384e34d6_57_0.png)


    图 3-3：默认 Linux hosts 文件


    默认情况下，hosts 文件只包含 localhost 的映射（127.0.0.1）和你的系统主机名（例如中为 Kali，位于 127.0.0.1）。但是你可以按照你的意愿添加任何
    IP 地址映射到任何域名。举几个如何它的例子，你可以将 www.bankofamerica.com 映射到你的本地网站，地址为 192.168.181.131。


    ```

    127.0.0.1 localhost

    127.0.0.1 kali

    192.168.181.131

    ```


    ```

    # The following lines are desirable for IPv6 capable hosts

    ::1 localhost ip6-localhost ip6-loopback ff2::1 ip6-allnodes

    ff2::2 ip6-routers

    ```


    在 IP 地址和域名之间请确保输入的是 TAB 键，而不是空格。


    随着您越越多参与与顾客交互工作，可能会像 dnsspoof 和 Etter这样的工具，您将能够使用 hosts 文件访问 www.bankofamerica.com
    的局域网上的任何流量定向到您的 Web 服务器 192.168.181.131。


    这些实际上都非常简单，对吧？'
