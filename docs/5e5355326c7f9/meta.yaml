    在继续第 4 章之前，通过完成以下练习，精进从本章学到的技能：


    - 查找有关活动接口的信息。

    - 将 eth0 上的 IP 地址更改为 192.168.181.1。

    - 在 eth0 上更改硬件地址。

    - 检查是否有无线接口处于活动状态。

    - 将地址重置为 DHCP 分配的。

    - 找到您喜欢的网站名称和电子邮件服务器。

    - 将 Google DNS 服务器添加到 /etc/resolv.conf 文件中，以便系统在使用本地 DNS 服务器解析域名时。


    ## 4 添加和删除软件


    ADDING AND REMOVING SOFTWARE


    ![](img/77055846b6e5bd43c939d5fb384e34d6_59_0.png)有些软件安装需要其他才能运行，你有时会发现可以在软件包过程中一次性下载的所有软件是一组（通常是库和其他依赖），您需要这些文件才能软件成功。当您安装一个包时，包中的所有文件一起安装，简化软件加载。


    在本章中，我们将研究添加软件的三个关键方法：apt管理器。


    ### 使用 APT 处理软件


    基于 debian Linux 版本（包括 Kali 和 Ubuntu）中，默认的软件包管理器是高级打包工具，其主要命令是 apt-get。在最简单形式中您可以使用
    apt-get 下载和安装新的软件包，也可以使用它升级。


    ### 搜索软件包


    在下载软件包之前，您可以检查软件包是否在存储库可用，存储库是操作系统信息的 apt具有一个搜索功能，很简单：


    ```

    apt-cache search

    ```


    注意，使用 apt-cache 命令来缓存或者查找软件包的位置。例如，如果您正在搜索 Snort，将需要输入：


    ```

    kali > apt-cache search snort

    ```


    清单 4-1: 使用 apt 在存储库中搜索


    如您见，许多文档中提到 Snort 关键字，是在输出的。


    ### 添加软件


    现在您已经知道 Snort 存在存储库中，可以使用 apt-get 下载软件。要在终端中操作系统的默认库中安装软件，请使用 apt-get 命令，后面跟着要安装的名称。语法是这样的：


    ```

    apt-get install packename

    ```


    让我们通过系统上安装 Snort 来尝试一下。输入 apt-get install snort 作为语句，如清单 4-2 所示。


    ```

    kali > apt-get install snort

    Reading package lists... Done

    Building dependency tree

    Reading state information... Done


    Suggested packages:

    snort-doc


    --snip--


    The following NEW packages will be installed:

    snort


    --snip--


    Install these packages without verification [Y/n]?


    清单 4-2: 使用 apt-get 安装 Snort


    您看到的输出结果告诉您正在安装什么。如果一切正常，出现提示时输入 y，您的安装将继续。


    ### 删除软件


    在删除软件时，使用带有 remove 选项的 apt-get，后面跟着软件名称（参见清单 4-3）。


    ```

    kali > apt-get remove snort

    Reading package lists... Done

    Building dependency tree

    Reading state information... Done


    The following packages were automatically installed and are no longer required:

    lib-prelude2 snort-common-libraries snort-rules-default


    --snip--


    Do you want to continue [Y/n]?


    清单 4-3: 使用命令删除 Snort


    您将看到即将执行的任务，并询问您是否继续。您可以输入 Y 来继续，但是您可能希望。我们将再次使用它。remove 命令不会删除配置文件，这意味着您可以在将来重新安装相同的包，而无需重新配置。如果您确实希望删除包的同时删除配置，可以使用清除选项，如清单
    4-4。


    ```

    kali > apt-get purge snort

    Reading package lists... Done

    Building dependency tree

    Reading state information... Done


    The following packages were automatically installed and are no longer required:

    lib-prelude2 oinkmaster snort-common-libraries snort-rules-default


    --snip--


    Do you want to continue [Y/n]?


    使用 apt-get 清除 Snort 和附带的依赖文件。只需在提示符处输入 Y，继续清理软件和配置文件。您可能已经注意到，在输出中显示：The following
    packages were automatically installed and are no longer required。为了保持系统的小型和模块化，许多
    Linux 包被拆分成不同程序可能使用的单。安装 Snort 时，您安装了 Snort 所需的几个依赖项或库。现在您正在删除 Snort，不再需要其他库或依赖项，因此删除了它们。


    ### 更新软件


    软件需要定期使用新软件或现有软件的新版本进行更新。这些更新不会自动进行，因此您必须手动请求它们，以确保这些更新应用到您的系统中。更新 (update) 与升级
    (upgrade) 不同：更新是从存储库的软件包列表中，而升级将软件包提升到存储库中。


    您可以通过输入 apt-get 命令并关键字来更新您的软件。这将搜索系统上的所有软件包是否更新。如果是，则下载更新（见清单 4-5）。


    ```

    kali > apt-get update

    Get:1 http://mirrors.ocf.berkeley.edu/kali kali-rolling InRelease [30.5kb]

    Get:2 http://mirrors.ocf.berkeley.edu/kali kali-rolling/main amd64 Packages

    [14.9MB]

    Get:3 http://mirrors.ocf.berkeley.edu/kali kali-rolling non-free amd64 Packages

    Get:4 http://mirrors.ocf.berkeley.edu/kali kali-rolling/contrib amd64 Packages
    [107 kB]


    ```

    Fetched 15.2 MB in 1min 4s (236 kB/s) Reading package lists... Done

    ```


    清单 4-5: 使用 apt-get 更新所有软件的列表。如果更新成功，您的终端将声明 Reading package lists... Done，如清单
    4-5所示。注意，存储库的。


    ### 升级软件


    升级系统上的现有软件包，请使用 apt-get 命令，后面跟着要升级的名称。语法是这样的：


    ```

    apt-get upgrade

    ```


    在存储库中搜索的软件包。


    ### 添加仓库源 sources.list 文件


    你可以找到 sources.list 文件在 /etc/apt/sources.list。使用任何文本编辑器并打开它。我还是使用 Leafpad打开文件。sources.list
    在终端输入


    kali <leafpad /etc/apt/sources.list

    ```

    '
  mdcn: '


    hackers-arise.com. 5 IN NS ns6.wixdns.net.


    ;; ADDITIONAL SECTION:


    ns6.wixdns.net. 5 IN A 216.239.32.100

    --snip--


    清单 3-3: 使用 dig 和它的 ns 选项从一个域名获取邮件信息


    另外请注意，在 ADDITIONAL SECTION 部分，dig 查询显示了 hackers-arise.com 提供的 DNS 服务的 IP 地址 (216.239.32.100)。


    您可以使用 dig 命令来获取邮件服务器信息，通过连接一个域名并加上选项 mx (mx 是邮件交换服务的缩写)。该信息对于邮件系统的攻击中至关重要。例如，hackers-arise.com
    电子邮件服务器的信息显示在清单 3-4 的 AUTHORITY SECTION 部分中。


    ```

    kali > dig hackers-arise.com mx


    --snip--


    ;; QUESTION SECTION:


    hackers-arise.com. IN MX


    ;; AUTHORITY SECTION:

    hackers-arise.com. 5 IN SOA ns6.wixdns.net. support.wix.com 2016052216 10800

    3600 604 800 3600


    --snip--

    ```


    清单 3-4: 使用 dig 和它的 mx 选项从域名获取邮件服务器上的信息


    常见的 DNS 是 Berkeley Internet Name Domain (BIND)。在某些情况下，Linux 用户将 DNS 标记为 BIND，但是不要混淆：DNS
    和 BIND 都将域名映射到 IP 地址。


    ## 更改你的 DNS 服务器


    在某些情况下，你可以希望使用其他 DNS 服务器。为了这样做，你将编辑一个操作系统名为 /etc/resolv.conf 的纯文本文件。使用文本编辑器打开这个文件——这里使用
    Leafpad。然后，在你的命令行输入输入你选择的编辑器的名称并在后面加上的位置和文件名。例如：


    ```

    kali > leafpad /etc/resolv.conf

    ```


    将配置的图形文本编辑器 Leafpad 位于 /etc 目录下 resolv.conf 文件。这个文件的内容应该如图 3-1 所示。


    ### resolv.conf


    ```

    1 domain localdomain

    2 search localdomain

    3 nameserver 192.168.181.2

    4

    ```


    图 3-1: 在教程中典型的 resolv.conf 文件


    正如你所看到的，我的 **名服务器** 在这里设置为 **192.168.181.2** 的本地 DNS 服务器。它正常工作，但是如果我想要添加或替换 DNS
    服务器为 **8.8.8.8** 的 Google 公共 DNS 服务器。我需要在 /etc/resolv.conf 文件中添加以下一个指定的名服务器：


    ```

    nameserver 8.8.8.8

    ```


    然后我们需要保持这个文件。但是，你也可以输入以下命令达到相同的效果：


    ```

    kali > echo "nameserver 8.8.8.8" > /etc/resolv.conf

    ```


    这个命令会命令行符 nameserver 并将其重定向到（>）文件 /etc/resolv.conf 中，替换掉当前的内容。你的 /etc/resolv.conf
    文件现在如图 3-2 所示。


    ### resolv.conf


    ```

    1 nameserver 8.8.8.8

    ```


    图 3-2: 修改 resolv.conf 文件信息指向 Google DNS 服务器


    如果你现在打开/etc/resolv.conf 文件，你将看到它将 DNS 请求指向 Google 的 DNS 服务器而不是本地 DNS 服务器，你的机器现在将转到
    Google 公共 DNS 服务器来解析域名 IP 地址。这意味着域名解析将花费比使用本地 DNS 服务器更长的时间（可能是几秒钟）。由于，为了保持速度但使用公共
    DNS 服务器的选项，你可能需要在 resolv.conf 文件中重保存本地 DNS 服务器，然后使用公共 DNS 服务器进行后续操作。操作按/etc/resolv.conf
    文件中列出的顺序查询每个 DNS 服务器，只有在本地 DNS 服务器中找到域名时，系统才会使用公 DNS 服务器。


    > NOTE

    如果你正在使用 DHCP 地址和 DHCP 服务器提供一个 DNS 设置，则 DHCP 服务器将在更新 DHCP 地址时替换服务器的内容。


    ## 映射你自己的 IP 地址


    在操作系统中它称为 hosts 的特殊文件是执行域名——IP 地址转换。这个 hosts 文件对于 /etc/hosts，与 DNS 有类似之处，可以使用它来指定你自己的
    IP 地址——域名映射。换句话，当你在浏览器输入 www.microsoft.com（或者其他域名名）时，你可以决定浏览器将访问哪个 IP 地址而不是让 DNS
    服务决定。对于客户，这对于劫持网络上的 TCP 连接使用 dnsspoof 等工具将流量定向到恶意的 Web 服务非常重要。


    在命令行，输入以下命令（你可以用首选的编辑器替换为 Leappad）：


    ```

    kali > leappad /etc/hosts

    ```


    你应该看到的 hosts 文件，如图 3-3 所示


    ![](img/77055846b6e5bd43c939d5fb384e34d6_57_0.png)


    图 3-3：默认 Linux hosts 文件


    默认情况下，hosts 文件只包含 localhost 的映射（127.0.0.1）和你的系统主机名（例如主机为 Kali，位于 127.0.0.1）。但是你可以按照你的意愿添加任何
    IP 地址映射到任何域名。举几个如何它的例子，你可以将 www.bankofamerica.com 映射到你的本地网站，地址为 192.168.181.131。


    ```

    127.0.0.1 localhost

    127.0.0.1 kali

    192.168.181.131

    ```


    ```

    # The following lines are desirable for IPv6 capable hosts

    ::1 localhost ip6-localhost ip6-loopback ff2::1 ip6-allnodes

    ff2::2 ip6-routers

    ```


    在 IP 地址和域名之间请确保输入的是 TAB 键，而不是空格。


    随着您越多参与与顾客交互工作，可能会像 dnsspoof 和 Etter 这样的工具，你将能够使用 hosts 文件访问 www.bankofamerica.com
    的局域网上的任何流量定向到您的 Web 服务器 192.168.181.131。这些这些实际上都非常简单，对吧？


    任何顾客都需要一些基本的 Linux 网络技能来连接、分析和管理网络。随着你的进步，这些技能在侦察、欺攻和连接目标系统中将变得越来越有用。


