    ```


    ## 获取帮助


    几乎每个命令、应用程序或实用程序在 Linux 中有一个专门的帮助，为其指导。例如，如果我需要使用无线解密工具 aircrack，我只需要输入 aircrack-ng
    help，然后输入 --help：


    ```

    kali >aircrack-ng help

    ```


    注意使用双横线（--），Linux 中的约定是在选项之前使用双横线（--），例如 --help；在单字母参数之前使用单横线（-），例如 -h。输入此命令时，你应该看到该工具的简短描述以及如何使用。在某些情况下，可以使用
