    | 使用管道符操作（通常在连接到屏幕的终端上）。


    ps 命令用于显示所有计算机上运行的信息。我们将在第 6 章中详细介绍这一点，但是对于这个例子，假设我想看到我的 Linux 系统上运行的所有进程。在这种情况下，我可以使用
    ps (进程) 命令，然后使用 aux 参数指定要显示的进程信息，如下：


