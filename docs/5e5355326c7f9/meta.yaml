    | at 7:20pm June 25 | 计划在 6 月 25 日晚上 7 点 20 分开始运行 |

    | at noon | 计划在当天中午运行 |

    | at noon June 25 | 计划在 6 月 25 日中午开始运行 |

    | at tomorrow | 计划在明天运行 |

    | at now + 20 minutes | 计划从当前时间提前 20 分钟内运行 |

    | at now + 10 hours | 计划从当前时间提前 10 小时内运行 |

    | at now + 5 days | 计划从当前日期起 5 天内运行 |

    | at now + 3 weeks | 计划从当前日期起 3 周内运行 |

    | At 7:20pm 06/25/2019 | 计划在 2019 年 6 月 25 日晚上 7 点20 分开始运行 |


    当您指定的时间进入 at 守护进程，进入交互模式，您会看到 at> 提示。您可以在此处输入

    在指定时间执行的命令：


    ```

    kali >at 7:20am

    at>/root/myscriptscript

    ```


    此代码段将安排 myscriptscript 今天上午 7 执行。'
