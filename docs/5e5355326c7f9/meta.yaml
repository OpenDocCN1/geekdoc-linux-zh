    ## 6 进程管理


    在任何时候，Linux 系统通常同时运行数百甚至数个进程。进程只是正在运行和使用资源的程序。它包括终端、Web 服务器、任何数据库、GUI 界面等。优秀的
    Linux 管理（特别是客户）都需要了解如何管理流程。例如，一旦客户控制了目标，他们可能想要找到并停止某个进程，如病毒应用程序或防火墙。为此，客户首先需要知道如何找到进程。客户可能还想要定期运行脚本来研究在本章中，你将学习如何管理这些进程。首先，你将学习查看哪些流程消耗最多。`ps`
    命令是命令行中查看哪些进程处于活动状态的主要工具。


    ```

    kali >ps

    PID       TTY     TIME     CMD

    39659     pts/0   00:00:01 bash

    39665     pts/0   00:00:00 ps

    ```


    Linux 内核是操作系统的核心，创建进程时每个进程分配唯一的 PID。在 Linux 中使用这些进程时，通常指定的 PID 比较更为重要。当没有使用参数时，`ps`
    命令为您提供太多信息：当前登录的用户（例如 root）以及正在运行的 shell。`ps` 命令在系统上运行的所有进程适用于所有用户，如列表 6-1 所示。不要在这些进程前面添加符。使用快捷键所有内容，因为
    Linux 是大小敏感的，所以使用大写带来不同的结果。


    ```

    kali >ps aux

    USER       %CPU %MEM    VSZ   RSS TTY START TIME COMMAND

    Root       0.0  0.4 22540   6399 ?S   Apr24  00:46 /sbin/init

    Root       0.0  0.0       S   Apr24  00:26 [softirqd]

    root       0.0  0.2 32040 pts/0    R   +15   00:00 ps

    ```


    ## 6-1: 使用 aux 查看进程


    正如你所看到的，这个命令列出了许多进程，在屏幕底部一个进程是 init，最后一行就是运行的命令。许多进程 (PID, %CPU, TIME 等) 在系统上不同，但具有相同的格式。为了我们的目的，`top`
    命令每秒动态刷新一次，而 `ps` 命令只提供快照。`top` 命令显示按使用的资源排序的进程，从最大的开始。很多情况下，我们想知道哪些进程使用了最多的资源。这就是
    `top` 命令用的地方。


    ```

    kali >top

    -15:31:17 2 days, 5 users, load average: 0.00 0.04 0.09

    Tasks: 176 total, 1 running, 175 sleeping, 0 zombie

    %Cu(s): 1.3 us, 0.7 sy, 0.0 ni, 0.4 id, 0.0 wa, 0.0 hi, 0.0 si

    KiB Mem :1491220 total, 64848 free, 488272 used, 938100 buffer/cache

    KiB Swap :1046524 total, 1044356 free, 2168 used, 784476 avail

    PID USER PR NI VIRT RES SHR %CPU %MEM TIME+ COMMAND

    39759 root 20 0 893180 247322 11488 S 0.7 16.6 1:47:88 ruby

    39859 root 20 0 27368 0 S 0.3 1.2 1:47:88

    39933 root 20 0 29336 61500 29108 S 0.7 4.1 1:47:88 Xorg

    ```


    ## 清单-6: 查找资源消耗的进程


    系统管理员经常在终端中运行以监控资源的使用。作为一名客户，您也可能想这样做，特别是在您的系统上运行多个任务时。当你运行 top 时，按下 H 键将弹出一个命令列表，按下
    J 键退出 top，你无需再次使用 top 来管理进程的，在下一节“使用 nice 命令改变进程优先”和“终止进程”。


    ## 使用 nice 命令改变进程优先


    在客户的语言中，你不会听到 nice 这个词，但在这里你会听到。`nice` 命令会影响内核的优先级。正如您在运行 ps 命令时看到的，系统上运行许多任务，它们都在争夺资源。内核对进程的优先级有最终决定权，但是可以使用
    nice 提高进程的优先级。使用 nice 这个术语后的想法是，当您使用它时，你将决定对其他用户有多么“好”；如果您的大部分系统资源，那么就会对进程产生影响。


    nice 的范围从 -20 到 19，默认值为 O（见 6-1）。nice 高值为低优先级，nice 低值为高优先级。


    ## 6-2: 过滤特定进程


    为了过滤特定进程，我们可以使用 `ps aux` 命令然后将其输出传递给 `grep`，如 msfconsole。


    ```

