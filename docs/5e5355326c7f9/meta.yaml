    ## Install the GRUB boot loader on a hard disk


    您需要通过在启动设备上安装 GRUB 引导程序来使新安装的系统启动。通常的方法是将 GRUB 安装在第一块硬盘的主引导记录 (MBR) 中。如果愿意，可以将
