    ## 终止进程


    有时，进程消耗了太多的资源，表现出异常的行为，或者死机。表现这种行为的过程通常被称为僵尸进程。对你来说，有很多问题的症状可能是僵尸进程使用的资源，可以更好地分配给空闲的进程。


    当您确定有问题的进程时，您可能希望使用 kill 命令来终止它。有许多杀死进程的方法，每个方法都有自己的命令行选项（数字）。


    kill 命令有 6 种不同的 kill 标记，每个标记都有不同。在这里，我们将重点介绍于您可能会发现最实用的一个参数，kill 标记是 kill-signal。如果你不提供信号标记，默认为
    SIGTERM。能够列出的各种 kill 标记。


    表 6-1: 常用的 kill 标记信号


    | 标识 | 选项参数 | 描述 |

    | :--- | :--- | :--- |

    | SIGHUP | 1 | 这标识为挂起 (HUP) 标记信号。它停止指定的进程并使用相同的 PID 重启动它。 |

    | SIGINT | 2 | 这是终止 (INT) 信号。这是一个弱信号，不能保证工作完成，但在许多情况下有效。 |

    | SIGQUIT | 3 | 这标识为核心转储。它终止进程并将信息保存在内存中，然后将此信息保存在当前工作目录中的一个名为 core 的文件中。（例如的原因）。
    |

    | SIGTERM | 15 | 这是终止 (TERM) 信号。这是 kill 命令的默认信号。 |

    | SIGKILL | 9 | 这是强制终止信号。它将资源发送到 /dev/null 来停止进程。 |


    使用 top 命令，您可以识别哪些进程使用了太多资源，通常这些进程是合法的，但可能有恶意进程使用了资源。如果您只想使用 HUP 重启动进程，请使用 kill
    -1 ，所示：


    ```bash

    kali >kill -1 6996

    ```


    对于恶意进程，您可以发送 kill -9 信号：


    ```bash

    kali >kill -9 6996

    ```


    如果您不知道 PID，可以使用 killall 命令终止进程。此命令将进程名称而不是 PID 作为参数。例如，您可以停止进程，如下：


    ```bash

    kali >killall -9 zombieprocess

    ```


    最后，您可以在 top 命令中只需按 K，然后终止 PID。


    ## 在后台运行


    在 Linux 中，无论您使用命令 还是在 shell 中工作，所有的命令都是 shell 中执行。执行命令时，shell 会等待命令完成。有时，您可能希望在后台运行而不必等待终端结束。例如假设我们在终端中处理脚本，由于输入在后台运行我们的编辑器
    (leafpad):


    ```bash

    kali >leafpad

    ```


    当然，我们可以另一个终端运行，更好的方法是选择资源和空间是在启动后运行文本编辑器。后台运行会让它持续运行而无需结束终端。要在命令末尾加上一个 & 符号，如下：


    ```bash

    kali >leafpad &

    ```


    现在，当文本编辑器打开时，终端返回一个新的提示，这样我们就可以输入其他命令。对于希望使用终端时运行多个任务都是有效的，可以节省资源和空间。


    ## 把后台运行进程移动到前台


    如果要在后台运行进程移动到前台，可以使用 fg (foreground) 命令。fg 需要您想要回到前台的 PID，如下：


    ```bash

    kali >fg 1234

    ```


    如果我们不知道具体的 PID，我们可以使用 ps 命令查看。


    ## 定时执行程序


    Linux 系统管理员和客户都需要安排在一天特定的时间运行进程。例如，系统管理员可以希望安排系统备份在每个晚上 6 点运行。客户可能希望设置一个脚本来定期执行检查端口或漏洞。在
    Linux 中，您可以至少通过两种方式实现此目的：使用 at 和 cron。


    at 命令（后台运行）对于作业在未来的时刻运行非常有用。cron 适合用于安排任务每天、每周或每月运行，我们将使用在第 16 章详细介绍。我们使用 at 程序安排未来运行。at
    命令的格式有多种方式执行。


    表 6-2 定时执行格式


    | 时间 | 含义 |

    | :--- | :--- |

    | at 7:20pm | 计划在当天晚上 7:20 运行 |

    | at 7:20pm June 25 | 计划在 6 月 25 日晚上 7 点20 开始运行 |

    | at noon | 计划在当天中午运行 |

    | at noon June 25 | 计划在 6 月 25 日中午运行 |

    | at tomorrow | 计划在明天运行 |

    | at now + 20 minutes | 计划从当前时间提前 20 分钟内运行 |

    | at now + 10 hours | 计划从当前时间提前 10 小时内运行 |

    | at now + 5 days | 计划从当前日期起 5 天内运行 |

    | at now + 3 weeks | 计划从当前日期起 3 周内运行 |

    | At 7:20pm 06/25/2019 | 计划在 2019 年 6 月 25 日晚上 7 点20 开始运行 |


    当您指定的时间进入 at 进程，进入交互模式，您会看到 at> 提示。您可以在此处输入在指定时间执行的命令：


    ```bash

    kali >at 7:20am

    at>/root/myscript

    ```


    此代码段将安排 myscript 今天上午7 执行。


    ## 总结


    管理 Linux 中的每个 Linux 用户和插件的技能。您必须能够查看，查找，终止，确定优先级并让进程以最佳方式运行。用户通常需要在他们想要杀死的目标上找到进程，例如防病毒软件或防火墙。他们还需要管理攻击中的多个进程并确定其优先级。


    # 7 # 管理用户环境变量


    # MANAGING USER ENVIRONMENT VARIABLES


    为了充分利用 Linux 来入侵系统，您需要了解环境变量，并熟练管理它们，以获得最佳的性能、便利性，甚至是安全性。然而，在 Linux 中发现有问题的领域中，管理用户环境变量可能是困难的。从技术上讲，有两种类型的变量：shell
    和环境变量。环境变量是构建在系统接口中的范围变量，它们控制系统的外观、行为，并且由任何 shell 或进程继承。另一方面，Shell 通常以小写形式列出，并且只在设置的
    shell 中有效。为了避免过度解释，我在这一章介绍了环境变量和 shell 变量的一些基本通用技巧，并没有讨论它们之间的区别。变量只是键值对的字符串。通常看起来像
    KEY=value。在 Linux 中的大多数系统一样，如果值中有空格，则需要包含在引号中。环境变量默认的是 bash shell。每个用户都有一组环境变量，这些环境变量决定了系统的外观、行为。您可以更改这些变量的值，使您的系统有效地工作，如果需要，还可以覆盖痕迹。


    ## 查看和修改环境变量


    您可以查看所有默认的环境变量，是在终端的任意目录下输入 env，如下：


    ```bash

    kali >env

    ```


    输出：


    ```text

    HOME=/root

    TTY=/dev/pts/0

    USER=root

    PWD=/root

    PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    OLSH_VERSION=3.122

    LC_CTYPE=en_US.UTF-8

    LC_ALL=en_US.UTF-8

    LANG=en_US.UTF-8

    SHELL=/bin/bash

    ...

    ```


    ```，环境变量总是大写的，如 HOME、PATH、SHELL 等。这些只是系统上的默认环境变量。用户还可以创建自己的变量，正如您看到的。


    ## 查看所有环境变量


    要查看所有环境变量，包括 shell 变量、本地变量和 shell 函数（任何用户定义的变量和命令），使用 set 命令。此命令将列出特定的环境变量。在大多数情况下，这些变量将给出长的一串输出，因此无法在单个屏幕上查看所有变量。您可以使用
    set 请求以容易访问的方式查看每个变量，如下：


    ```bash

    kali >set | more

    ```


    现在，变量列表将一行地填充屏幕，然后停止。当你按下键盘时，终端将转到下一行，进入下一个命令。当您使用了更多的输出时，您可以输入 q 来 quit (or exit)
    并返回命令提示。


    ## 特定变量的过滤


    虽然使用 set 和 more 可以单独选择大量变量名称更容易管理，但如果你正在寻找特定的变量，它仍然相当显著。相反，您可以使用过滤命令 grep 查找您感兴趣的变量。我们以
    HISTSIZE 为例。此变量包含命令历史记录中的最大命令数。这些命令是在之前命令提示中使用向上和向下调用。请注意 HISTSIZE 不存储命令本身，只存储命令的数。


    用 grep 你的输出查找 HISTSIZE 变量，如下：


    ```bash

    kali >env | grep HISTSIZE

    ```


    如您见，命令查找 HISTSIZE 并显示其值。此变量的默认值可能在您的系统中设置为1000。最后表示默认存储最后1000命令。


    ## 更改变量的值


    现在让我们看看如何更改变量的值。如上所述，HISTSIZE 包含存储在历史文件中的命令数值。有时，您可能不想保存所执行的命令。可能是您不希望在自己的系统或目标系统上留下任何活动迹。在这种情况下，您可以将
    HISTSIZE 变量设置为0。这样系统就不会存储以前的命令。由于变量具有单个值，因此要更改时，请参照表 7-1 中所示的方法分配值。


    ```bash

    kali >HISTSIZE=0

    ```


    现在，尝试使用向上和向下箭头来命令时，没有任何反应，因为系统不再保存它们。这是私的，虽然它可能不够。


    ## 使变量永久更改


    当您更改环境变量，变化只发生在特定的环境中。在本例中，环境是 bash 会话。这意味着，当您终止后，您所做的任何更改将丢失，并将设置回默认值。如果您想永久更改，则需要使用
    export 命令。这个命令将当前环境 (bash shell) 中的新变量输出到系统的其余部分，使其在每个环境中都可以用，直到您再次它为止。


    变量是字符串，因此在谨慎的情况下，在修改变量之前将其内容保存到本地文件中并不是。例如，由于我们想要更改 PS1，它控制您在提示符中显示的信息，所以首先运行它，将现有信息保存到当前用户的目录的文本文件中：


    ```bash

    kali >echo $HISTSIZE >~/valueOfOfHISTSIZE.txt

    ```


    这样，您可以取消更改。如果您想再次创建一个文本文件，使用所当前的设置，将 set 命令的输出保存到一个文本文件中，如下：


    ```bash

    kali >set > ~/valueOfOfAllOn0102017.txt

    ```


    如清单 7-1 所示，在您更改了一个变量后，可以通过输入 export，后输入您更改的变量名称永久更改，如下：


    ```bash

    kali >export HISTSIZE

    ```


    现在，当您离开这个环境并进入另一个环境，HISTSIZE 仍设置为0。如果您想重置 HISTSIZE 为1000，只需输入以下内容：


    ```bash

    kali >HISTSIZE=1000

    ```


    ```bash

    kali >export HISTSIZE

    ```


