  md: '输，该怎么办?Linux有几个命令可以压缩文件。我们来看这些：


    +   - gzip,使用扩展名.tar.gz 或 .tgz

    - bzip2,使用扩展名.tar.bz2

    - compress,使用扩展名.tar.xz


    这些都可以被压缩的文件，但它们使用的压缩算法和不同的压缩比。因此，我们将看到每一种方式以及它的能力。


    通常，compress是最快的，但是生成的文件是更大的；bzip2是最慢的，但是生成的文件是最小的；gzip介于两者之间。作为一个初学者 Linux，您应该了解这三种方法的主要原因是，在访问其他工具时，您将遇到不同类型的压缩。因此，本节将向您展示如何处理压缩的方法。


    # # gzip 压缩


    让我们尝试 gzip (GNU)。它是 Linux 中常用的压缩程序。您可以通过输入以下命令来压缩 HackersArise.tar 文件（假设保存在您的存档文件中）。


    ```

    kali gzip HackersArise.*

    ```


    注意，我们对文件扩展名使用了通符*，这说明 Linux 命令应该应用于任何文件扩展名结尾的文件。在接下来的例子中，您将使用类似的符号。当我们对目录列表列表格式查看时，可以看到
    HackersArise.tar 已经被 HackersArise.tar 所压缩。文件大小已经压缩到 3299 字节


    ```

    kali ls -l

    --sn-

    -rw-r--r-- 1 root root 3299 2017 02-18 13:33 HackersArise.tar.gz

    ```


    然后，我们可以使用 gzip 命令（GNU 压缩的）解压缩该文件。


    ```

    kali >gzip HackersArise.*

    ```


    解压缩后，不再使用扩展名.tar.gz 而是 tar 扩展名。另外，请注意，它已经返回到了原始的大小 40,960 字节。尝试用列表格式来确认这一点。值得的是，gzip
    还可以用于提取 zip 文件。


    # # bzip2 压缩


    Linux 中另一个常用的压缩程序是 bzip2，它的工作原理类似于 gzip，但是具有更好的压缩比，这意味着生成的文件更小。您可以通过以下命令来压缩 HackersArise.tar
    文件:


    ```

    kali >bzip2 HackersArise.*

    ```


    当你用列表格式列出文件，你可以看到 bzip2 将文件压缩了 2,081 字节！还要注意，文件扩展现在是 tar.bz2。


    要压缩的文件，使用 bzip2。如下所示：'
