    请注意，在表 5-1 中，wx 的八进制表示为 3，这恰好是在我们在 w 和 x 添加两个值时获得的值相同：**2+1=3**。


    最后，当三个权限都打开时，它看起来就像：


    ```

    r w x

    4 2 1

    ```


    并且 4+2+1=7。这里，我们在 Linux 中，当所有权限开关都打开时，它们由八进制等效值 7 表示。


    因此，如果我们想要表示所有者，组和所有用户的所有所有权限，我们可以按照以下方式写入：


    ```

