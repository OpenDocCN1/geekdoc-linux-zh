  md: '# 禁用日志记录


    另一个覆盖跟踪的选项是禁用日志记录。当黑客控制了一个系统，他们可以立即禁用日志，以防止系统追踪他们的活动。当然，这需要 root 权限。


    要禁用所有日志记录，黑客只需停止 syslog 守护。停止 Linux 中的任何服务使用相同的语法，如下示所示（您将在第 2 章中看到更多）：


    ```

    service servicename start|stop|restart

    ```


    因此，停止日志守护，只需输入以下命令：


    ```

    kali >service syslog stop

    ```


    现在 Linux 将停止任何日志文件，直到重新重启，这样您能够在日志文件中不留下任何证据。如果需要进行操作：


    # 总结


    日志文件几乎记录了 Linux 系统上发生的所有事情。在图中分析发生了什么，无论是因为故障还是黑客攻击，它们都是非常贵的资源。对于黑客来说，日志文件可以作为他们活动和身份的证据。


    然而，精明的黑客可以删除和覆盖这些文件，并完全禁用日志记录，因此不会留下任何证据。


