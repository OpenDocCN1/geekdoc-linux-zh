    虚拟机 (VM) 技术允许您在笔记本电脑或台式机硬件上运行多个操作系统。这意味着您可以继续运行您熟悉的 Windows 或 macOS 操作系统，并在该操作系统中运行
    Kali Linux。恕不再覆盖现有的操作系统来学习 Linux。

