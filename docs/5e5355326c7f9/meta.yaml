    清单 4-5: 使用 apt-get 更新所有软件的列表。如果更新成功，您的终端将声明 Reading package lists... Done，如清单
    4-5所示。注意，存储库的名称和值（时间、大小等）在您的系统上是不可能的。


    # 升级软件


    升级系统上的现有软件包，请使用 apt-get 升级。因为升级包可能会更改软件，因此必须使用 root 用户身份登录，或者在输入 apt-get 升级之前使用
    sudo 命令。这个命令将升级 列表存在的系统上的每个软件'
