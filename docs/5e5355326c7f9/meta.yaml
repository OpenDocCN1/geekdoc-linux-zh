    ## PostgreSQL 与 Metasploit


    PostgreSQL，或 Postgres，是另一个开源关系数据库，由于它能够轻松扩展并处理工作负载，非常适合互联网应用程序。它于1996 年7 月发布，由全球开发者维护。


    默认情况下，PostgreSQL 也安装在 Kali 中。如果您使用的是另一个 Linux发行版，它可能不在库中，您可以通过以下命令：


    ```

    kali > apt-get install postgres

    ```


    作为一名，你会发现 PostgreSQL 特别重要，因为它是最广泛使用的渗透测试和攻击框架 Metasploit 的默认数据库。Metasploit 使用
    PostgreSQL 存储模块，以及扫描和利用的结果，便于在渗透测试或攻击中使用。由于这个原因，我们会在 Metasploit 的上下文中 PostgreSQL。


    与 Linux 的几乎版本一样，我们可以通过输入服务来启动 PostgreSQL 应用程序启动，如下：


    ```

    kali >service postgresql start

    ```


    随着 PostgreSQL 的启动和运行，让我们启动 Metasploit：请注意，当 Metasploit 完成后，你将看到 msf>提示。教您如何使用
    Metasploit 进行黑攻击和开发的超出了本书的范围，但在在这里我们将建立 Metasploit 将其信息存储在数据库中。在 Metasploit 运行的情况下，我们可以使用以下命令设置
    PostgreSQL，以便它存储来自系统上任何 Metasploit 活动的数据：


    ```

    msf >msdb init

    ```


    ```

    * exec :msdb init


    Creating database use ''msf''


    Enter password for new role


    Enter it again:


    Creating databases ''msf'' and ''msf_test''


    Creating configuration file /usr/share/metasploit-framework/config/database.yml


    Creating initial database schema


    接下来，我们需要用 root 登录 PostgreSQL。在这里，我们在命令前面加上 su，即“switch user”命令，以获取 root 权限：


    ```

    msf >su postgres

    ```


    ```

    su postgres

    ```


    ```

    postgres@kali:root#

    ```


    登录 Postgres 时，您会看到提示已改为 postgres@kali:/root#，表示应用程序、主机名和用户。在下一步中，我们需要创建用户和密码，如下所示：


    ```

    postgres@kali:/root# createuser msf_user


    Enter Password for new role:


    it again:

    ```


    我们使用带有 createuser 命令的 -P 选项创建用户名密码两次。然后接着，我们需要创建数据库为 msf_user 授予权限。将数据库命名为 hackers_arise_db，如下：


    ```

    postgres@kali:/root# createdb owner=msf_user hackers_arise_db


    postgres@kali:/root# exit

    ```


    当您使用 exit 命令退出 Postgres 时，终端将回到 msf# 提示。接下来，我们将通过定义以下内容来连接我们的 Metasploit 控制台 console
    到 PostgreSQL 数据库：


    - user

    - password

    - host

    - database name


    在我们的例子中，我们可以使用以下命令 msconsole 连接到我们的数据库：

    msf_db_connect msf_user:password@127.0.0.1/hackers_arise_db


    当然，您需要提供之前的密码。IP 地址是本地系统 (localhost) 的 IP 地址，因此除非在远程系统中构建此数据库，否则使用 127.0.0.1。最后，我们可以检查
    PostgreSQL 数据库的状态以确保已连接：

    msf >db_status


