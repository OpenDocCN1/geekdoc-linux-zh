  md: '# # 安装和卸载


    大多数操作系统，包括 Linux 的大多数版本，在附加设备时会自动挂载它们，这意味着新的闪存驱动器或硬盘驱动器会自动附加到文件系统。对于 Linux 来说，挂载可能是一个难题的。


    存储设备首先要物理地连接到文件系统，然后逻辑地连接到文件系统，以便数据对操作系统可用。术语 mount 是计算机早期的遗留问题，当时存储器（在硬盘驱动器之上）必须物理地挂接到计算机系统中，想办法把带旋转磁带驱动器的硬盘当作计算机，你可能已经见过老式光驱了。


    如如此，挂载目录将设备称为挂载点。Linux 的两个挂载点是 /mnt 和 /media。来说，内部硬盘安装在 /mnt 上，外部 USB 设备（闪存驱动器和外部
    USB 设备）安装在 /media 上，但技术上讲，可以使用它们。


    # ## 自己安装存储设备


    在某些 Linux 中，你需要手动挂载驱动器才能访问其内容，因此这是一项值得学习的技能。在文件系统上挂载驱动器，请使用 mount 命令。如果挂载到具有子目录的目录上，则挂载的设备将覆盖该目录的内容，它可能不可用，你将重新挂载硬盘
    db1 到 /mnt 目录，需要输入命令：


    ```

    kali > /dev/sdb1 /mnt

    ```


    然后，你应该可以访问该驱动器了。如果您想将硬盘 sdb 挂载在 /media 目录下，输入：


    ```

    kali > /dev/sdb1 /media

    ```


    挂载在系统上的文件结构存在 /etc/fstab（文件系统的缩写）中，系统在每次启动时读取该文件系统。


    # ## 卸载umount


    如果你来自 Mac 或 Windows 的实践，你可能在不知情的情况下卸载了一个驱动器。在系统中移除驱动器之前，要“弹出”它，以防止对存储在设备上的文件造成损坏。“弹出”是
    unmount 的另一种说法。


    类似于 mount 命令，你可以通过输入 umount 命令和 /dev 目录下的设备目录（例如 /dev/sdb）卸载第二个优盘驱动器。注意卸载的写法不是
    ummount，而是 mount (n)。


    ```

    kali > /dev/sdb1

    ```


    您无法卸载正在使用的设备，因此系统在读取或写入此处时，您将只会收到一个错误。


    # ## 监控文件系统


    在本节中，我们将研究一些用于监控文件系统状态的命令——这是任何客或系统管理员都必须具备的技能。我们将获得关于挂载磁盘的信息，然后检查和修复错误。存储设备尤其容易出错，因此值得'
