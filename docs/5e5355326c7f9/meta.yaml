  md: '# 5


    # # 控制文件和目录权限

    CONTROLLING FILE AND DIRECTORY PERMISSIONS


    ![](img/77055846b6e5bd43c939d5fb384e34d6_68_0.png)


    并非操作系统的每个用户都具有相同级别的文件和目录访问权限。与任何专业操作系统一样，Linux 具有保护文件和目录访问的方法。系统允许系统管理员（root 用户或文件所有者）通过赋予用户读取、写入或执行文件的权限来保护文件免受不必要的访问或篡改。对于每个文件和目录，我们可以为文件所有者、特定用户组以及所有其他用户指定权限状态，在多用户操作系统中是必要的。


    在本章中，我将向您展示如何检查和更改用户的文件和目录的权限，如何设置默认文件和目录权限以及如何设置特殊权限。最后，您将看到客户对权限的理解如何帮助他们防止攻击系统。'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# # 多类型用户


    在 Linux 系统中，root 用户非常强大。root 用户基本上可以执行任何操作。系统上的其他用户拥有有限的权限，不可能拥有 root 用户所有的权限。


    这些其他用户通常被收集到具有相似的功能组。在商业体系中，这些组可能是财务、工程、销售等。在 IT 环境中，这些组可能包括开发者、网络管理员和数据库管理员。我们的法是将具有相似需求的人员放入授予相关权限的组中，然后组的每个成员都会继承该权限。这为了方便管理权限，从从而确保安全性。


    默认情况下，root 用户是 root 的一部分。必须将系统的每个新用户添加到组中才能继承 root 的权限


    # ## 用户权限


    必须为每个文件和目录分配不同的身份的特殊的权限。三个级别的权限如下：


    +   - r 读取权限。允许用户打开和查看文件

    - w 写入权限。允许用户查看和写入内容

    - x 执行权限。允许用户执行一个操作（但是没有必要查看或者编辑）


    通过这种方式，root 用户可以根据用户需要的权限向用户授予级别的权限。创建文件时，通常创建的用户是文件的所有者，root 用户是当前用户。该文件的所有者可以授予它任何权限。让我们需要修改文件时将所有权限赋予特定用户和组。


    # ## 赋予个人用户权限


    将文件的所有权转移到其他用户以便能够控制权限，我们可以使用 chown（或更改所有者）命令：


    ```

    kali > chown bob 2 /tmp/bobfile

    ```


    在这里，我们给出命令，我们给予所有用户的名称，然后是相关文件的位置和名称。命令授予 Bob 对文件 bobsfile 的所有用户账户。


    # ## 赋予用户组权限


    将文件的所有权从一个组转移另一个组，我们可以使用 chgrp（或更改组）命令。


    顾客可能经常单独工作而不是团体，但是对于一些调试或测试来说在同一个项目上工作并不是空闲的，在这种情况下，使用组是必要的。例如，您可能有一个测试员和一个安全组团队成员在同一个项目上工作。此例子中的测试者是组，这意味着他们都拥有所有权限和访问权限。root
    需要请求访问工具，而安全人员只需要访问工具，入侵监控系统（IDS）。根据设置并安装名为 weids 的程序，根据需要可能需要更改为安全，以便安全组可以随意使用它。对于，此组需要输入以下命令：'
  merge: -1
