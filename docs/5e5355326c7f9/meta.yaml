    ![](img/77055846b6e5bd43c939d5fb384e34d6_57_0.png)


    图 3-3：默认 Linux hosts 文件


    默认情况下，hosts 文件只包含 localhost 的映射（127.0.0.1）和你的系统主机名（例如中为 Kali，位于 127.0.0.1）。但是你可以按照你的意愿添加任何
    IP 地址映射到任何域名。举几个如何它的例子，你可以将 www.bankofamerica.com 映射到你的本地网站，地址为 192.168.181.131。


