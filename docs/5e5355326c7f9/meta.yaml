    ## 一些更有趣的选择


    现在我们使用 proxychain 工作了，我们可以看到 proxychains.conf 文件配置的其他选项。正如我们现在所设置的，我们只是使用一个代理。但是，我们可以放入多个代理并使用它们，我们可以使用列表中的有限数量，或者我们可以使用列表
    proxychain 随机选择顺序。


