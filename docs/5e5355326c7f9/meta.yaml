    现在您已经掌握了一些在文件系统中导航切换的基本技能，您可以在进行（骇游戏）之前稍微使用 Linux 系统。使用终端的最佳方法是立即尝试使用新发现的技术。在后的章节中，我们将深入探讨我们的骇游戏。


