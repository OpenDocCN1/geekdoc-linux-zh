    有关自定义和使用 logrotate 程序的许多方法的详细信息，请参见 man logrotate 页面。这是一个很好的资源，可以让你了解使用的函数和可以更改的设置，决定如何处理日志。一旦您对
    Linux 熟悉，您会更好地了解需要进行多久日志记录，以及以您的喜好选择选项，此值需要重启 logrotate 配置。


    # 保护自身


    一旦您破坏了 Linux 系统，使用日志备份并删除日志文件中的侵入的痕证，这都是有用的，可以减少被检测到的机会。有很多方法可以做到这一点，每种方法都有自己的风险和可靠性。


    # 删除日志


    首先，您需要删除活动的任何日志。您可以简单地打开日志文件，并使用第2章学习的删除技术，进行准确删除详细描述该活动的任何日志。然而，这可能会很耗时，并在日志文件中留下时间间隔，这看起来很可疑。此外，删除的文件通常可以通过一个专业的取证调查员恢复。


    120'
