  md: '# WI-Fi 网络


    我们从 Wi-Fi 开始。在本节，我将向您演示如何查找、检查和连接 Wi-Fi 接入点。在在此操作之前，让我们花点时间学习一些基本的 Wi-Fi 术语和概念，以帮助您更好地理解我们将在本章进行的大量输出：


    AP (access point) 是无线用户连接到互联网的设备。


    ESSID (extended service set identifier) 和我们在第三章中讨论的 SSID相同，不过可以用于无线局域网中的多个 AP。


    BSSID (basic service set identifier) 是每个 AP 的一个标识，与设备的 MAC 地址相同。


    SSID (service set identifier) 是这个网络的名称。


    Channels Wi-Fi 可以在 14 个通道 (1-14) 中的任何一个通道上连接。在美国，Wi-Fi 被限制在信道 1 到 11。


    Power 距离 Wi-Fi 越远，传输越容易被破解。


    Security 是在读取的 WiFi AP 上的安全加密，WiFi 有三种安全加密。最初的有线有效性 (WEP)存在严重缺陷，容易破解。它的替代品，WiFi
    保护访问 (WPA)，更安全一点。最后，WPA2-PSK 更加安全并且使用所有用户共享的预共享密钥 (PSK)，现在几乎所有 WiFi AP (企业除外)
    都使用它。


    Modes Wi-Fi 在三种模式下切换：managed, master, 或 monitor。你将在下一节中了解这些模式的意义。


    Wireless range 在美国，Wi-Fi 必须合法地使用0.5 瓦的上限功率。在此功率下，它具有约 300 英里 (100 米)的范围。Highgain可以将此范围扩展到
    20 英里。


    Frequency Wi-Fi 被设计用于 2.4GHz 和 5GHz。现代 Wi-Fi 和无线网卡经常使用这两者。


    # 基本无线网络命令


    在第三章中，我们介绍了基本的 Linux 网络 ifconfig 命令，列出了系统上每个激活的网络接口以及一些基本信息，包括（最重要的）每个接口的 IP 地址。让我们再次看看运行
    ifconfig 的结果，这次关注未连接。


    ```

    kali@ifconfig\eth0Linkcap:EthernetHwaddr 00:0c:29:ba:82:0f

    inet addr:192.168.1.131 Mask:255.255.255.255

    --snip--

    lo Link:Local Loopback

    inet addr:127.0.0.1 Mask:255.0.0

    ```'
