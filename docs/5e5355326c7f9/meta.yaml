    清单列表 17-7: FTP Python 密码破解脚本


    我们将使用 ftplib 模块的工具来实现 FTP 协议，所以我们首先将导入它。然后，我们创建一个名为 server 的变量和另一个名为 user 的变量，它将存储一些用户输入的命令。你的脚本将提示用户输入
