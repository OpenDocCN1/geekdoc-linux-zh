    # 控制语句


    控制语句允许你的代码根据某些条件做出决策。在 Python 中有很多方法可以控制脚本的流程。


    让我们来看 Python 中的这些结构：


    # if 语句


    与许多其他语言（包括 bash）一样，python 中的 if 结构用于检查条件是否为真，并为每个场景不同的代码集。语法如下：


    ```

    if conditional expression


    run code if the expression is true

    ```


    if 语句包含的条件类似于 if variable==10。如果满足条件，则列表表达式的结果为 true，然后执行

    后面的代码（称为控制块）。如果控制语句为 false，则将跳过控制块中的语句，而不执行这些语句。


    在 python 中，控制块必须缩进。这个缩进帮助标识识别控制块。一条未缩进的语句会在控制之

    外，因此不是 if 语句的一部分，这就是 python 如果条件不满足，跳到哪里的方法。


    # if...else


    python 中的 if...else 结构如下：


    ```

    if conditional expression


    *** # run when the condition is met

    else


