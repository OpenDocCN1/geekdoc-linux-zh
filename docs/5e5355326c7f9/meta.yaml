    # 字典


    字典以无序的形式存储信息，其中对键值都包含一个键和一个关联的。我们可以使用字典来存储列表，并给每个对象一个标签，这样我们可以单独使用和引用该值。例如，我们可以使用字典存储用户
    ID 和其关联名，或者存储特定主机关联的漏洞。Python 中的字典在其他语言中的作用类似于关联数组。


    与列表一样，字典也是可选的，这意味着我们可以使用一个控制结构，例如通过遍历整个字典，将字典的元素赋予一个值，直到字典结束。


    除其他事情外，你可以使用此结构构建密码解码器，遍历存储在字典中的每一个密码，直到某个密码生成或或器到达字典末尾。


    创建字典的语法如下:


    ```

    dict = {key1:value1, key2:value2, key3:value3...}

    ```


    值得注意的是，对于字典，使用大括号和逗号分隔。你可以包含任意数量的键值。'
