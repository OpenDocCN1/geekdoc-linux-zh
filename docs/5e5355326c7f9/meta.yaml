    \ Rate Frobes Probe\n(not associated)  01:01:AA:BB:CC:22\n01:02:CC:DD:03:C5 A0:A3:E2:44:7C:E5\n\
    ```\n\n注意 `airdump-ng` 将屏幕分成上下两部分。上方包含 AP 的信息，包括 SSID、AP 的功率、检测到的标签帧、数据吞吐量、无线网卡的数据包、信道（1-14）、理论吞吐量限制、加密协议、用于加密的密码类型、身份验证类型和\
    \ SSID。在客户端部分，输出告诉我们某个客户端没有关联（not associated），这意味着该客户端被检测到但没有连接到 AP；另一个客户端与工作站连接，意味着它已连接到该\
    \ AP。\n\n现在你已经掌握了破解 MAC 需要的所有信息！尽管这超出了本章的范围，但要破解无线 MAC，你需要客户端 MAC 地址、AP MAC 地址、目标信道和密码列表。\n\
    \n为了破解 Wi-Fi 密码，你需要打开一个终端。在第一个终端中，输入类似下面的命令，填写客户端的 MAC 地址以及通道：\n\n```\nairodump-ng\
    \ -c 10 --bssid 01:01:AA:BB:CC:22 HackersAirPSK wlan0mon\n```\n\n此命令使用 `-c` 选项监听通过通道\
    \ 10 的所有数据。\n\n在另一个终端中，你可以使用 `aireplay` 命令取消（取消身份验证）与指定 MAC 连接的任何人，并强制他们重新验证到该\
    \ MAC。一旦他们重新验证，你就可以捕获 WPA2-PSK 四次握手交换的密码。密码列表出现在 `airodump-ng` 的右上角。\n\n```\n\
    airplay-ng --deauth 100 -a 01:01:AA:BB:CC:22 -c A0:E3:A2:74:C7:E5 wlan0mon\n```\n\
    \n最后，在最后一个终端中，你可以使用密码列表（`wordlist.dict`）在捕获的文件（`hacker-airesisk.cap`）中查找密码，如下所示：\n\
    \n```\naircrack-ng -w wordlist.dict -b 01:01:AA:BB:CC:22 Hacker-APSK.cap\n```\n\
    \n## 检测并连接蓝牙\n\n如今，几乎所有的小型设备、移动设备和系统都内置了蓝牙，包括我们的电脑、智能手机、iPad、平板电脑、游戏控制器、键盘等许多设备。接入蓝牙设备可能导致任何信息的泄露、设备的控制，以及蓝牙设备发送你所需的加密或密钥连接。\n\
    \n为了利用这个项目，我们需要了解它的工作原理。对蓝牙的深入了解已经超出了本书的范围，但我将为你提供一些基础知识，帮助你连接蓝牙设备，为渗透攻击做好准备。\n\
    \n## 蓝牙的工作原理\n\n蓝牙是一种用于低功耗通信的协议，工作在 2.4-2.485GHz 频段。蓝牙速度为每秒 1600 kb（这种速度本身就是一种安全措施）。它由瑞于\
    \ 1999 年开发，以 10 世纪英国王国哈尔（Harald Bluetooth）命名（注意：瑞典和丹麦在 10 世纪是一个国家）。\n\n蓝牙的最小范围为\
    \ 10 米，但没有上限，制造商可以在其设备中实现。许多厂商的距离可达 100 米。有了特殊技术，这一距离可以进一步扩展。\n\n连接两个蓝牙设备被视为“配对”。几乎两个蓝牙设备都可以相互连接，但只有在处于“可发现模式”（Discoverable\
    \ Mode）时如此；处于不可发现模式的蓝牙不传输以下信息：\n\n- 名称\n- 类别\n- 服务清单\n- 技术信息\n\n每个设备都有一个唯一的 48\
    \ 位标识（类似于 MAC 地址），还有一个制造商指定的名称。当我们想要识别并访问一个蓝牙设备时，这些数据是有用的。\n\n## 蓝牙扫描\n\nLinux\
    \ 有一个名为 `bluez` 的蓝牙协议实现用于扫描。大多数 Linux 发行版（包括 Kali）都默认安装了。如果没有，可以使用命令安装：\n\n```\n\
    apt-get install bluez\n```\n\nBlueZ 有许多简单的工具可以管理和扫描蓝牙，包括：\n\n- `hcconfig`：操作类似于\
    \ Linux 的 `ifconfig`。\n- `hcitool`：用于扫描蓝牙接口并查询设备名、ID、类和时钟信息。\n- `hcidump`：能够捕获通过蓝牙发送的数据包。\n\
    \n首先使用 `hcconfig` 检查蓝牙是否启用：\n\n```\nhcconfig\n```\n输出示例：\n```\nhci0: Type: BR/EDR\
    \ Bus: USB\nBD Address: 10:AE:60:58:F1:37 MTU: 65535 RUNNING\nRX: 1314 acl:0\n\
    TX: 4288 acl:0\n```\n如所示，蓝牙适配器的 MAC 地址是 `10:AE:60:58:F1:37`。下一步是通过 `hcconfig`\
    \ 启用连接：\n\n```\nhcconfig hci0 up\n```\n如果命令运行成功，我们将看到 `hci0 up`。让我们开始工作。\n\n##\
    \ 使用 hcitool 扫描设备\n\n现在适配器已经启动，可以使用 Bluez 套件中的另一个工具 `hcitool` 来扫描范围内的蓝牙设备。首先使用该工具发现蓝牙设备（这意味着它们处于发现模式），命令如下：\n\
    \n```\nkali > hcitool inq\nScanning...\n72:6E:46:55:72:66 ANDROID BT\n22:C5:96:08D\n\
    ```\n\n在系统中，`hcitool` 发现了两个设备：ANDROID BT 和另一个。为了测试目的，请将你的手机或其他蓝牙设置为发现模式，并查看是否接收到。现在，让我们收集已检测设备的更多信息：\n\
    \n```\nkali > hcitool inquiry\n24:C6:96:08D53 clock offset:0xe8b class:0x5a0c\n\
    76:F4:65:52:67 clock offset:0x2c0 class:0x5a0c\n```\n这给出了设备的 MAC 地址、时钟偏移和类别。该类型指示了设备类型，你可以通过蓝牙\
    \ SIG（https://www.bluetooth.org/en-us/specification/assigned-numbers/service-discovery/）查找代码查看设备类型。\n\
    \n`hcitool` 是一个强大的命令行接口，可以做很多事情。帮助页面显示了一些命令，从帮助页面查看完整列表：\n\n```\nkali > hcitool\
    \ --help\nhcitool - HCI Tool Ver 4.99\nUsage:\nhcitool [options] <command [command\
    \ parameters]\n\nOptions:\n--help Display dev\n-i dev HCI device\n\nCommands:\n\
    dev Local devices\ninquiry Scan remote devices\nname Get name from remote devices\n\
    ```\n--snip--\n\n## 清单 14-3: 一些 hcitool 命令\n\n你将在脚本中简单地使用许多蓝牙命令，你可以在自己的 bash 或\
    \ python 脚本中创建工具，我们将在第 17 章研究这些脚本。\n\n## 使用 sdptool 扫描服务\n\n服务发现协议（SDP）是一种用于搜索蓝牙服务的（蓝牙是一套服务）。非常有帮助，bluez\
    \ 使用 `sdptool` 工具来浏览设备提供的服务。此外，设备不必处于扫描模式。方法如下：\n\n```\nsdptool browse MACAddress\n\
    ```\n\n清单 14-4 显示我使用 `sdptool` 在清单 14-2 检测到的某个设备上搜索服务：\n\n```\nkali > sdptool\
    \ browse 76:6E:46:63:72:66\nBrowsing 76:6E:46:63:72:66...\nServiceHandle: 0x10002\n\
    Service Class ID List:\n(0x1800)\nProtocol Descriptor List:\n\"L2CAP\" (0x0100)\n\
    PSM: 31\n\"ATT\" (0x0007)\nuint16: 1\nuint16: 5\n```\n\n清单 14-4: 使用 sdptool 扫描。在这里我们可以看到\
    \ `sdptool` 工具能够获取关于该设备的所有服务。特别是看到这个设备支持 ATT 协议（即低能量属性）。这为我们提供了更多关于蓝牙的交互。\n\n\
    ## 通过 l2ping 查看设备访问\n\n一旦我们收集了附近的设备 MAC 地址，就可以对这些设备发送 ping（无论它们是否处于发现模式），查看它们是否在范围内。要发送\
    \ ping，我们使用 `l2ping` 命令，语法如下：\n\n```\nl2ping MACAddress\n```\n\n清单 14-5 显示我对设备执行\
    \ ping 操作：\n\n```\nkali > l2ping 76:6E:46 -c 4\nPing 10:AE:60:58:F1:37: seq=0\
    \ time=1.2ms ttl=64\nPing 10:AE:60:58:F1:37: seq=1 time=1.1ms ttl=64\nPing 10:AE:60:58:F1:37:\
    \ seq=2 time=1.3ms ttl=64\nPing 10:AE:60:58:F1:37: seq=3 time=1.2ms ttl=64\n```\n"
