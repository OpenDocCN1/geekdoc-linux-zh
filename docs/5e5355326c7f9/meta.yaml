    # 熟练控制你的域名系统


    客户可以很容易从标识的域名系统（DNS）中找到一个信息库。DNS 在 internet 是一个至关重要的组成部分，应尽力的设计初目标是将域名转换成 IP 地址，但是客户可以使用它从目标收集信息。


    # 使用 dig 检测 DNS


    DNS 是像 hackers-arise.com 这样的域名转换相应的 IP 地址的服务，通过这种方式，你的机器知道如何到达。没有 DNS 我将不得记住千万万我们最喜欢的网站的
    IP 地址——即使对于一个专业学者来说，这也不算一项小任务。


    对于初学者的客户来说，dig 是众多的 Linux 命令之一，它提供一种途径获取目标域名相关的信息。在防御攻击时，存储在这里的 DNS 信息可以被认为是前期获取获取信息的关键部分。这些信息包含目标名称服务器（将目标名称转换成
    IP 地址的服务器）的 IP 地址，邮件服务器以及涉及的所有域名 IP 地址。


    例如，输入 dig hackers-arise.com 并加入查询 ns(nameserver 的缩写)。对于 hackers-arise.com 这个名称服务器显示为
    3-3 的 ANSWER 部分。


    ```

    kali >dig hackers-arise.com ns

    -- snip --

    ;; QUERY SECTION:


    hackers-arise.com. IN NS


    ;; ANSWER SECTION:

    3 5 NS 5 wixdns.net.

    ```'
