    ## 随机链接


    最后一个技巧是随机链接（random chaining）选项，其中 proxychain 从列表中随机选择一个 IP 地址并它们创建代理链。这意味着每次使用
    proxychain 时，代理的目标的外观都会不同，这使得从源跟随我们的流量变得困难。这个选项也被认为是“动态”的，因为如果一个代理关闭，它将退到下一个代理。


    回到 `etc/proxychain.conf` 文件，在每一行代码的开头添加一个 `#` 来注释 `dynamic_chain` 和 `strict_chain`
    这两个代理名，然后取消对 `random_chain` 行代码的注释。我们只能使用这三个选项中的一个，所有在使用 proxychain 之前要注释掉其他选项。


    接下来，使用 `chain_len` 查找并取消对行的注释，然后给出一个合理的数字。这一行确定了在创建代理时将使用链中的多少个 IP 地址。


    ```

    # dynamic_chain

    # Dynamic - Each connection will be done via chained proxies

    # all proxies chained in the order as they appear in the list

    # at least one proxy must be online to play in chain

    # strict_chain

    # Strict - Each connection will be done via chained proxies

    # all proxies chained in the order as they appear in the list

    # at least one proxy must be online to play in chain

    # other EWEINTR is returned to the app


    random_chain


    # Random - Each connection will be done via random proxy

    # (or proxy chain, see chain_len) from the list.

    # this option is good to test your IDS :

    # Makes sense only if random_chain


    ```

    chain_len = 3

    ```


    ```


    在这里，我已经更改了 `chain_len` 的解释，并将其值设为 3，这意味着 proxychain 在现在使用 `/etc/proxychain.conf`
    文件中列表中的三个代理中，随机选择它们，并在代理关闭时立即转移到下一个代理。请注意，虽然这种方法可能会增强匿名性，也会增加在线的延迟。


    现在已经知道如何使用 proxychain，你可以在相对相同的情况下进行攻击客流量。我说“相对”，是因为 NSA 和 FBI（美国国家安全局和联邦执法局）监控的的网络流量的情况下，绝没有可靠的代理方法来保持署名，我们可以使用
    proxychain 来获得更好的效果。


    ## 安全问题


    关于安全性的最后一个建议是，你一定要明智地选择代理。proxychains 只于您希望保持署名，请不要使用免费的代理。建议使用付费代理。事实上，免费代理很可能会暴露你的
    IP 地址和浏览历史，正如匿名科学家和安全专家布鲁斯·施奈尔（Bruce Schneider）曾提到过的，“如果你有些东西是私密的，那么你就不应该使用它，你是自己的用。”话说，任何免费产品都可能收集你的数据？不，那么你为什么要用免费代理呢？


    虽然你离开流量的 IP 地址是匿名的，但是监控可以通过其他方式识别你。如果你想知道自己的身份，如果你的受到足够的政府或有权机构的压力，可能可以保护你的身份的业务。了解实现方法来匿名的局限性是非常重要的。


    ## 虚拟专用网络


    使用虚拟专用网络是保持流量匿名和安全的有效方法。VPN 用于连接到一个中...互联网网络，例如，通过路由器，将你的流量发送到最终目的地，并使用路由器来隐藏你的
    IP 地址位置。


    使用 VPN 简单容易。你可以在 VPN 提供者那里，然后在最后登录时无缝连接 VPN。你可能依靠另外一种使用浏览器来浏览，但是任何人想看到你的流量通过自己的
    VPN 的 IP 地址和位置，而不是你自己的。与 VPN 之间所有的数据传输都是加密的，所以即使你的网络服务提供商也可以知道你的信息。


    ### VPN 的优点


    此外，VPN 有可以有效地规避政府限制访问的内容和信息查找。例如，如果你的国家政府限制访问具有特定政治信息的网站，你可以使用你所在国家/地区以外的 VPN
    来访问该内容。一些公司，如 Netflix, Hulu 和 HBO，将其访问限制为自其本国的 IP 地址。在这些服务的允许国家/地区使用 VPN 通常可以帮助解决这些限制。


    根据网络，一些最好和最受欢迎的商业 VPN如下：


    - NordVPN

    - ExpressVPN

    - CyberGhost

    - Golden Frog

    - Hide My Ass (HMA)

    - Private Internet Access

    - PureVPN

    - TorGuard

    - Buffered VPN


    多数 VPN 服务每年收费 50-100 美元，还提供免费试用期。要了解如何设置 VPN 的更多信息，请从列表中选择一个下载、安装和使用。VPN 的优点是所有流量都是加密的，为了保护您不受骚扰，当您访问一个站点时，掩盖您的
    IP 地址。与代理相比，VPN 拥有 IP 地址（无法让流量被拦截）。如果他们受到足够的政府或有权机构的压力，他们可能会放弃您的身份。


    ## 加密的电子邮件


    免费电子邮件服务如 Gmail、Yahoo、Outlook（Hotmail）是有理由之一：它们是在追踪您的兴趣和投放广告。如所述，如果服务是免费的，那么你就是产品而不是客户。此外，电子邮件插件（如
    Outlook）可以访问内容，即使使用了 HTTPS。防止拦截电子邮件的一种方法是使用加密。ProtonMail 如图所示，从一个加密到另一个加密，意味着您的电子邮件是在服务器上加密，没有读取。ProtonMail
    由一群科学家在瑞士欧洲研究中心（CERN）创立。瑞士在保护隐私方面比美国法律有严格规定。ProtonMail 不收取基本账户，但提供注册费用。注意的是，与用户交换电子邮件时，可能会部分加密。有关详细信息，请参见
    ProtonMail 支持。


    ## 总结


    我们不断受到商业公司和国家机构的监视。为了保证数据的安全性，您需要实现本章中讨论的至少一种措施。通过组合它们，您可以最大限度在 Web 上的占用并使数据安全。


