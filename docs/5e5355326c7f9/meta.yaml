    ## Python 的格式


    Python 和其他语言的一个差别就是格式在 Python 中十分重要。Python 解析器使用格式分层代码组成。格式的细节并不如格式统一，尤其是缩进很重要。如果你有一组不同的缩进行为，为了让
    Python 识别这些代码是一致的，你必须在整个代码块内统一使用缩进。这和其他编程语言编写原本有所不同，其他编程格式是可选的最佳实践，但不是必要的。你将在教学中注意到这一点，这是你要时刻记住的！


    ## 变量


    现在，开始理解一些关于 Python 的概念。一个变量是编程中最基础的数据形式，你在第八章脚本编程中遇到过它。简单来说，一个变量是一个名字对应一个特定的值，当你在运行时在程序中使用某个名字，它就会调用你赋值的值。


    它的原理是变量名指向内存中的数据，它们可以包含任何类型。例如整数、字符串、浮点数、布尔值、列表、字典等。我们将在本章节对其进行概述。


