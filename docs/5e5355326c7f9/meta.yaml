    # 管理用户环境变量


    # MANAGING USER ENVIRONMENT VARIABLES


    ![](img/77055846b6e5bd43c939d5fb384e34d6_88_0.png)


    为了充分利用 Linux 来入侵系统，您需要了解环境变量，并热练管理它们，以获得最佳的性能、便利性，甚至是隐性。然而，在 Linux 中发现有问题的领域中，管理用户环境变量可能是最困难的。从技术上讲，有两种类型的变量：shell
    和环境变量。环境变量是构建在系统和接口中的范围的变量，它们控制对系统的外观、行为和“感觉”，并且它们由任何 shell 或进程继承。另一方面，Shell 通常以小写形式列出，并且只在它们所设置的
    shell 中有效。为了避免过度解释，我在这一章中介绍了环境变量和 shell 变量的一些基本和通用的技巧，并没有讨论它们之间的区别。


    变量只是键值对的字符串。通常，当一起看起来像 KEY=value 的情况下，在有多个值的情况下，它们看起来像 KEY=value2。与 Linux 中的大多数系统一样，如果值中有空格，则需要包含在引号中。在
    Kali Linux 中，环境默认的是 bash shell。每个用户，都拥有一组环境变量，这些环境变量决定了系统的外观、行为和感。您可以更改这些变量的值，使您的系统更有效地工作，调整工作环境以便地满足您的个人需求，如果需要，还可以覆盖这些痕迹。'
