    # # 下载 KALI LINUX


    在开始之前，您需要下载并在计算机上安装 Kali Linux。我们将在本书中介绍 Kali Linux 发行。Linux 最初由 Torvalds 在 1991
    年发表，作为 Unix 的替代品。它是基于 Unix 的内核，由志愿者开发人员对内核、实用程序和应用程序进行改进的。这意味着没有一个属于它自己的实体实体来监督它的发展，通常遵循着公约和标准。


    Kali 由 Offensive Security 发，是一个基于 Linux 的桌面操作系统发行版。Linux 有很多发行版，而 Debian 也是最好的发行版之一。您可能最熟悉
    Ubuntu 作为 Linux 的桌面界面。Ubuntu 也是 Debian 的衍生。它的发行版包括 Red Hat、CentOS、Mint、Arch 和
    Solution。虽然它们共享相同的 Linux 内核（控制 CPU、RAM），但每个内部都有自己的实用程序、应用程序和用于不同的图形界面（GNOME、KDE
    等）。这些发行版中的每一个外观和感觉略有不同。Kali 专门为渗透测试人员研究设计，并配备了各种测试工具。


