    # 加密的电子邮件


    免费的电子邮件服务如 Gmail、Yahoo、Outlook Mail（前身为 Hotmail）是有免费的理由之一：它们是在追踪您的兴趣和投放广告的。如所述，如果服务是免费的，那么你就是产品，而不是客户。此外，电子邮件服务的插件（如
    Outlook）可以访问您的邮件内容，即使您使用了 HTTPS。


    防止拦截电子邮件的一个方法是使用加密的电子邮件。ProtonMail，如图 13-5 所示，从加密到另一端从一个加密器到另一个加密器，这意味着您的电子邮件是在
    ProtonMail 服务器上加密的，即使 ProtonMail 经理没有读取您的电子邮件。


    ProtonMail 由一群科学的科学家在瑞士欧洲物理研究中心（CERN）的超级对撞机制造工厂创立的。瑞士在保护隐私方面有着悠久的传统（你听说过瑞士银行账户吗？）。ProtonMail
    的服务位于瑞士，该网络在分享个人数据方面比美国法律有更严格的法律规定。ProtonMail 不收取基本账户，但提供账户注册性质的费用。需要注意的是，在与 protonmail
    用户交换电子邮件时，可能会有某些部分电子邮件没有加密。有关详细信息，请参见 ProtonMail 支持中心。'
