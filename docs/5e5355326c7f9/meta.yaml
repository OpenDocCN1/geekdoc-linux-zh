    # 总结


    理解 Linux 如何设计和管理的设备对于任何 Linux 用户和客户来说都是至关重要的。顾客需要知道哪些设备被连接到一个系统，以及以及有多少可用空间。由于存储设备经常出现错误，我们可以使用
    fckck 检查并修复这些错误。dd 命令能够创建设备的的物理副本，包括任何已删除的文件。


