    kali >chgrp security2newIDS

    ```


    此命令改变安全组1newIDS2的所有者。


    现在您需要知道如何检查这些分配是否有效。你可以通过检查文件的权限来做到这一点。


    # 检查权限


    如果要查看文件或目录的哪些用户授予了权限，请使用带有-l (long)开关的 ls 命令来显示目录的内容。ls -l 命令在文件/usr/share/hashcat
    我最喜欢的密码破解工具之一上，以便查看我们可以在哪里解析的。


    ```

