  md: '你应该在 hashcat.hcstat 命令的左侧看到-rwxxr--。确认 chmod 调用成功更改了文件的权限，以使用所有者和组能够执行该文件。


    # UMO 权限变化


    虽然数值法可能是 Linux 中更改权限的常用方法，但有些人会发现 chmod 的符号方法更直观，两种方法同样有效，只需要找到适合自己的方法。符号法通常称为
    UGO 语法，代表用户（或所有者），组和其他人。


    UGO 语法非常简单。输入 chmod 命令，然后输入要修改的权限，为用户提供 u，为组提供 g，为其他提供 o，或者输入三个之一：


    +   - 移除一个权限

    + 添加一个权限

    = 设置一个权限


    在操作之后，包括添加或删除的权限 (rwx)，最后包含要应用的文件的名称。


    因此，如果要删除用户对 hashcat.hcstat 所属文件的写入权限，可以输入以下内容：


    ```

    kali >chmod u-w hashcat.hcstat

    ```


    此命令表示从用户 (u) 中删除 hashcat.hcstat 的写入 (w) 权限。


    现在，你可以再次使用 ls -l 检查权限，您应该看到 hashcat.hcstat 不再具有该用户的写入权限：


    ```

    kali >ls -l

    total 32952

    drwxr-xr-x root root 4096 Dec 5 10:47 charsets

    -rw-r--r root root 36685504 June 28 2018 hashcat.hcstat

    -rw-r---- root root 36685504 June 28 2018 hashcat.hctune

    drwxr-xr-x 2 root root 4096 Dec 5 10:47

    drwxr-xr-x 2 root root 4096 Dec 5 10:47 OpenCL

    drwxr-xr-x 3 root root 4096 Dec 5 10:47 rules

    ```


    您可以使用一个命令更改多个权限。如果同时为用户和其他用户（包括组）授予执行权限，可以输入以下内容：


    ```

    chmod u+x, o+x hashcat.hcstat

    ```


