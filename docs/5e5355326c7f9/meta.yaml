  md: '# 压缩什么？


    压缩这个主题的主题本身就可以填一整本书，但是对于这个书，我们只需要对于这个过程有一个基本的理解。顾名来说，压缩数据更小，这可能需要更多的计算，使得数据更容易传输。对于初学者来说，将压缩分类为有损或无损足够了。


    压缩后的文件大小非常有用，但是会丢失文件的完整性。换句话，压缩后的文件与原始文件并不完全。这种类型的压缩适用于原始图形、视频和音频文件，但其中一些的差异在耳朵中很难察觉。mp3,.mp4,.png等都有压缩算法，例如png文件中的一个像素或mp3文件中的一个字节会被忽略掉，你的眼睛或耳朵可能注意到其中的任何差异——音乐爱好者可能会无损和flac之间的差异。有损压缩的优点是它的效率和有效性。压缩是非常高的，这意味着文件比原始文件小得多。


    # 将文件存在一起


    通常，压缩文件要做的第一件事是将它们合并到归文件中。在很多情况下，在归档文件时，我们将使用 tar 命令。Tar是捆数据的压缩，指的是使用磁存储数据的前历史时代。tar
    命令从许多文件中创建一个归档文件，然后将其命名为归档文件、tar 文件或tar 包。


    例如，假设您有三个软件包，我们在第8章中使用这些文件类，分别为 hackersise1、hackersise2和 hackersise3。如果您切换到保存它们的目录并执行列表列表列出查看，您可以清楚地看到文件和信息，文件的大小如下：


    ```

    kali ~$ ls -l

    -rwxrxr-xr-x root root 22311 Nov 27 13:00 hackersise1.sh

    -rwxrxr-xr-x root root 89711 Nov 27 13:08 hackersise2.sh

    -rwxrxr-xr-x root root 3992 Nov 27 13:08 hackersise3.sh

    ```


    假设您将所有这三个文件发送给您一起工作的另一个客户。您可以使用清单 9-1 中的命令创建一个归档文件。


    ```

    kali ~$ tar -cvf hackersArchive.tar hackersise1 hackersise2

    hackersise1

    hackersise2

    hackersise3

    ```


