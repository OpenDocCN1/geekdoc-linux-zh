    \ 202\n\n## 绪论\n\n黑客攻击是 21 世纪最重要的技能！我不轻易做出这种说法。多年来我每天早上看到新闻事件的标题中重复了这一说法。各国正在相互监控以获取利益，网络罪分子正在夺取数十亿美元，要求勒索的数字货币被释放，竞对对手正在影响彼此，战斗双方相互拆台。这些都是黑客的特征，他们让我们日益数字化的世界才格外醒目。\n\
    \n我决定与千上万有负债的黑客通过 NullBite (http://www.hackersane.com) 以及美国军事和情报机构 (NSA、DIA、CIA\
    \ 和 FBI) 的几个有经验的人合作编写了这本书。这些经历告诉我，许多负债的黑客 Linux 几乎没有任何经验，而这种缺乏经验是他们成为职业黑客的主要障碍。几乎所有最好的黑客工具都是用\
    \ Linux 编写的，因此基本的 Linux 技能是成为专业黑客的先决条件。我写这本书是为了帮助有负债的黑客克服这个困难。\n\n黑客是领域的精锐，它需要对\
    \ IT 概念和技术进行广泛和详细的理解。在基础的层次，Linux 是一项需求。如果你想把黑客和安全作为你的职业，我强烈建议你投入时间和精力来使用和理解它。\n\
    \n本书适合经验丰富的黑客或经验丰富的 Linux 管理。相反，它适用于那些想要在黑客、网络安全和渗透这项动人心的道路上起步的人。它也不是一篇关于 Linux\
    \ 或黑客的完整教程，而是世界的起点。从 Linux 的基础知识开始，并扩展 bash 和 Python 的一些脚本。\n\n在适当的情况下，我尝试使用来自黑客世界的例子来教\
    \ Linux 原理。\n\n在本介绍中，我们将介绍安全的道德黑客行业的发展，我将带你完成安装虚拟机的过程，以便你可以在系统上安装 Kali Linux，而不会打扰你正在运行的操作系统。\n\
    \n在本书里有什么：\n\n- 第 1 章中，你将熟悉 Linux 的基础知识，学习文件系统和终端，为你提供一些基本命令。\n- 第 2 章：介绍如何操作、查找、检查和更改文件。\n\
    - 第 3 章：管理网络，通过扫描、查找连接信息，并通过网络和 DNS 信息来伪装自己。\n- 第 4 章：添加、删除和更新内核，以及如何简化系统。\n-\
    \ 第 5 章：操纵文件和权限来控制谁可以访问什么，学习一些权限提升。\n- 第 6 章：教你管理进程，启动和停止进程以及分配资源以便更好地控制。\n- 第\
    \ 7 章：管理环境以获得最佳性能，找到变量以及创建新的环境。\n- 第 8 章：介绍你如何使用 bash，这是任何认真黑客的主要工具。学习 bash 的基础知识并构建脚本来扫描可能的漏洞。\n\
    - 第 9 章和第 10 章将为你提供文件系统管理技术，展示如何压缩和存档以保持整洁，复制整个设备以及获取有关文件和连接的信息。\n- 第 11 章：深入探讨目标，你将学习如何操作系统来获取活动信息并覆盖自己的轨迹。\n\
    - 第 12 章：展示如何使用和滥用 Linux 服务：Apache Web 服务器、OpenSSH 和 MySQL。创建一个 Web 服务器，构建视图并了解数据库及其漏洞。\n\
    - 第 13 章：展示如何使用代理服务器、Tor 网络、VPN 和加密邮件保持安全和匿名。\n- 第 14 章：涉及无线网络。你学习基本的网络命令，然后破解\
    \ WiFi 并接入点。\n- 第 15 章：深入 Linux 本身，内核如何工作以及如何利用程序传递软件。\n- 第 16 章：学习调优技巧以自动化黑客操作。\n\
    - 第 17 章：教你核心 Python 概念，编写两个黑客工具：一个监控 TCP/IP 连接扫描程序和一个密码破解程序。\n\n 什么是道德黑客?\n\n\
    随着信息安全领域的发展，道德黑客也出现了，也被称为白帽黑客。道德黑客通过渗透和利用系统，找出漏洞并更好地保护它。将道德黑客分为两个部分：为了合法信息安全进行渗透测试，以及为了国家的军事或情报机构。两者都是快速增长的领域，需要增强。\n\
    \n## 渗透测试\n\n随着组织越来越注重安全性且漏洞成本呈指数级增长，许多组织将安全服务外包。其中一项关键服务就是渗透测试。渗透测试本质是一个合法的、受委托的黑客行为，以证明网络和系统的脆弱性。\n\
    \n通常，组织首先进行漏洞评估，发现网络、操作系统中的潜在漏洞（我强调是潜在的，因为此漏洞包含大量噪音）。渗透人员的角色是破解或渗透这些漏洞。只有这样，组织才能知道漏洞是否真实，并决定投入时间和钱来弥补。\n\
    \n## 军事和网络活动\n\n现在，世界上几乎每一个国家都在进行网络活动和竞争。人们只需要浏览一下新闻，就会发现网络活动是监控和工业体系的选择。黑客在这些军事和情报收集活动中起着至关的作用，随着时间的推移，这种情况才会更加真实。想象一下未来的战争，黑客可以获得对手的操作计划，破坏他们的电力、油厂和供水系统。这些活动现在每天都在进行。因此黑客成为国家防御的关键组成部分。\n\
    \n## 为什么黑客使用 Linux\n\n为什么黑客使用 Linux 而不是其他操作系统？主要是因为 Linux 通过不同的方法提供了更高级别的控制。\n\
    \n## Linux 是开源的\n\n与 Windows 不同，Linux 是开源的，这意味着可以使用操作系统的代码。因此，您可以随意更改和操作它。如果你试图用以其他的方式运行，那么操作代码是必不可少的。\n\
    \n## Linux 是透明的\n\n要进行有效的黑客攻击，你必须理解操作系统，并在很大程度上了解攻击操作系统。Linux 完全透明，您可以查看和操作它的每一个部分。Windows\
    \ 则让它变得难以理解操作系统的内部工作方式，或许你永远不会知道“幕后”会发生什么，在 Linux 中，你会直接看到操作系统的每一个节点。这使得使用 Linux\
    \ 更加有效。\n\n## Linux 提供层级控制\n\nLinux 是细粒度的。这意味着你对系统几乎无限的控制权。在 Windows 中，你只能控制 Microsoft\
    \ 允许的内容。在 Linux 中，你可以完全控制，无论在最小级别还是最宏级别。此外，Linux 允许任何语言的脚本编写简单高效。\n\n## 许多黑客工具都是\
    \ Linux 编写的\n\n超过 90% 的黑客工具都是 Linux 编写的。虽然也有例外，如 Cain 和 Aibel 以及 Wikto。这些例子证明了这一规律，即使是在\
    \ Windows 迁移诸如 Metasploit 或 nmap 等黑客时，并非所有功能都能从 Linux 迁移。\n\n## 未来Linux/Unix\n\
    \n这似乎是一个激进的结论，但我认为未来的 Linux 和 Unix 系统。微软在 20 世纪 80 年代和 90 年代风光一时，但在增长的停止后逐渐衰落。\n\
    \n自互联网诞生以来，由于它的稳定性、可靠性和稳健性，Linux 占据了主导地位。\n"
