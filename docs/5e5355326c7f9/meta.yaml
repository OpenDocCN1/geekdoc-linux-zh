    - 显示密码


    ![](img/77055846b6e5bd43c939d5fb384e34d6_20_3.png)


    图 12: 设置 root 密码


    Linux 的 root 用户是管理员。您可以使用复杂的密码防止攻击者破解。在物理服务器上，我们建议使用非常复杂的密码。在虚拟机上进行密码验证仍然是明智的。单击
    **Continue**。


    下一个屏幕将关于分区。选择 "**Guided use entire disk**”（引导使用整个硬盘），Kali 将检测硬盘并自动创建分区。然后 Kali
    会警告您，选择磁盘上的所有数据将被删除，但别担心！硬盘是新的且完整的。单击 **Continue**。


    Kali 询问您希望将所有文件放在一个分区还是单独分区。如果是生产系统，您可能会使用 `/var` 或 `/tmp` 分区。考虑到我们将它们放在虚拟机中，您可以安全地选择所有文件放在一个分区。现在询问您是否需要更改磁盘。选择
    **Finish partitioning**（完成分区）并单击 **Continue**（见图 13）。


