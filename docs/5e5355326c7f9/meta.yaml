    shell，它也是 Kali 和许多其他 Linux 发行版中的默认 shell。


    要更改密码，可以使用命令 passwd。


    # Linux 文件系统


    Linux 文件系统结构与 Windows 有些不同。Linux 在文件系统的基础上没有物理驱动器（例如 C: 驱动器），而是使用逻辑文件系统。在文件系统结构的顶层是
    /，它通常被称为文件系统的根，就像它是一个倒置树（见图 1-4）。请记住，这与 root 用户不同。这些术语可能看起来令人困惑，但是一旦习惯了 Linux，它们就会变得容易区分。


    | /boot | /home | /proc | /dev | /sbin | /usr |

    | --- | --- | --- | --- | --- | --- |

    | image, Kernel | User directories | View of internal kernel data | Special device
    files | Binaries | /sbin, More binaries |

    | /root | /etc | /mnt | /sys | /bin | /lib |

    | Superuser''s home directory | System configuration files | General-purpose mount
    point | Kernel''s view of the hardware | Binaries, Libraries | More binaries,
    More libraries |


    图 1-4: Linux 系统的根 (/) 位于文件系统目录的顶部，以下是需要了解最重要的目录：


    - /root：root用户的目录

    - /etc：通常包含 Linux 配置文件 - 控制程序启动时间和运行方式的文件

    - /home：用户的目录

    - /mnt：包含其他文件系统附加或安装到文件系统的位置

    - /media 和 USB 设备通常连接或安装到文件系统的位置

    - /bin：包含所有应用程序二进制文件（相当于 Microsoft Windows 中的可执行文件）

    - /lib：库文件（与 Object 类的共享程序）


    在书中，我们将花费更多时间在这些关键目录上。了解这些目录对于从命令引导文件系统非常重要。


    在开始之前，知道在执行任何操作不要以 root 用户登录也是重要的，因为当你以 root 身份登录时，任何攻击你系统的人（如：管理员）有机会会被黑客入侵，并立即获得
    root 权限，从而“拥有”你的系统。在启动常规程序、浏览 Web、使用 Wireshark 等工具时使用用户身份登录。


    # LINUX 基本命令


    首先，我们将看看一些基本命令，它们将帮助你在 Linux 中启动和运行。


    ## 用 pwd 查看当前目录


    与在 Windows 或 macOS 等图形用户界面 (GUI) 环境中工作不同，Linux 中的命令并不总是能够明确显示你当前所在的位置。要导航到目录，通常需要知道你现在的位置。显示当前目录使用命令
    pwd。在目录结构中的位置 pwd。在您的输入终端输入 pwd 以查看的所在目录位置：


    ```

    kali>pwd

    /root

    ```


    在这种情况下，返回 /root，告诉我现在我在 root 用户的目录中，并且由于您在启动 Linux 时使用了 root 用户登录，您也应该回到 root
    用户的目录中，该目录位于文件结构顶部（/)的一级目录。


    如果您在另一个目录中，pwd 将返回该目录的登录名称。


    ## 使用 whoami 查看登录用户


    在 Linux 中，超级用户或管理员名为 root。它拥有添加用户、更改密码、更改权限所需的所有权限。显然，您不希望任何人有能力进行此类更改；您希望有人信任并且对操作系统足够的理解。作为顾客，您需要拥有所有权限来运行您需要的程序和命令（除非拥有
    root 权限，否则许多用户工具将无法运行由于需要 root 用户身份登录）。


    如果您忘记了是以 root 用户身份还是其他用户身份登录，可以使用 whoami 查看您登录的用户：


    ```

    kali>whoami

    root

    ```


    如果用其他用户身份登录，例如我的个人帐户，那么 whoami 会返回该用户的用户名，如下所示：


    ```

    kali >whoami

    ot

    ```


    ## 浏览 Linux 文件系统


    从终端导航文件系统是一项重要的技能。要完成任何工作，您能够找到其他目录中的应用程序、文件和目录。基于 GUI 系统，您可以直接看到目录，但当使用命令行界面时，结果完全基于文本。


    ## 使用 cd 修改目录


    要在终端修改目录，使用命令 cd。例如，进入存储配置文件的 /etc 目录：


    ```

    kali >cd /etc

    root@kali:/etc

    ```


    我们在 /etc 目录中可以通过输入 pwd 来确认位置：


    ```

    root@kali:/etc$pwd

    /etc

    ```


    在文件结构中向上移动一级（指向根目录 /），我们使用 cd 后跟双点 (..)，如下所示：


    ```

    root@kali:/$pwd

    /

    ```


    这将从 /etc 升级到 root 目录，但您可以根据需要向上移动级别。只需使用相同数量的双点（..）：你会使用 .. 向上一级。你会使用 ... 向上二级目录。您可以使用
    .... 向上三级，以此类推：例如向上二级目录，请输入 cd 后输入路径，其间有空格：


    ```

    kali <cd ...

    ```


    您还可以输入 cd/ 从任何地方到文件结构中的根，其中 / 表示文件系统的根。


    ## ls 列出目录


    查看目录（文件和子目录）的内容，我们可以使用 ls (list) 命令。这与 Windows 中的 dir 命令非常相似。


    ```

    kali ~ls

    bin  initrd.img  media

    boot

    dev

    ```

    initrd.img  mnt  srv

    vmlinux

    opt

    ```

    vmlinuz

    home

    ```

    etc

    lib64  proc  tmp

    usr

    ```


    ls 命令列出包含的文件和目录。您也可以在任何目录上使用此命令，而不仅仅是当前目录。


    ## 获取有关文件和目录的更多信息


    例如它们的权限、所有者、大小以及修改的时间，可以在 ls 之后添加 -l 参数。这通常被称为长列表。我们试试：


    ```

    kali ~ls -l

    total 84

    drwxr-xr-x  5 root root 4096 Oct 27 10:00 .

    drwxr-xr-x  3 root root 4096 Oct 27 09:00 ..

    drwxr-xr-x  5 root root 4096 Oct 27 10:00 bin

    drwxr-xr-x  5 root root 4096 Oct 27 10:00 boot

    drwxr-xr-x  5 root root 4096 Oct 27 10:00 dev

    drwxr-xr-x  7 root root 4096 Oct 27 10:00 etc

    drwxr-xr-x  5 root root 4096 Oct 27 10:00 home

    drwxr-xr-x  5 root root 4096 Oct 27 10:00 lib

    drwxr-xr-x  5 root root 4096 Oct 27 10:00 mnt

    drwxr-xr-x  5 root root 4096 Oct 27 10:00 media

    drwxr-xr-x  5 root root 4096 Oct 27 10:00 opt

    drwxr-xr-x  5 root root 4096 Oct 27 10:00 proc

    drwxr-xr-x  5 root root 4096 Oct 27 10:00 sbin

    drwxr-xr-x  5 root root 4096 Oct 27 10:00 tmp

    drwxr-xr-x  5 root root 4096 Oct 27 10:00 usr

    drwxr-xr-x  5 root root 4096 Oct 27 10:00 var

    -rw-r--r--  1 root root  4096 Oct 27 10:00 initrd.img

    -rw-r--r--  1 root root  4096 Oct 27 10:00 vmlinux

    -rw-r--r--  1 root root  4096 Oct 27 10:00 vmlinuz

    ```


    Linux 中的某些文件是隐藏的，不会通过 ls 命令显示。要显示隐藏文件，添加 -a 参数，如下所示：


    ```

    kali >ls -la

    ```


    ## 获取帮助


    几乎每个命令、应用程序或实用程序在 Linux 中有一个专门的帮助，为其提供指导。例如，如果我需要使用无线解密工具 aircrack，我只需要输入 aircrack-ng
    help，然后输入 --help：


    ```

    kali >aircrack-ng help

    ```


    注意使用双横线（--），Linux 中的约定是在单词选项之前使用双横线（--），例如 --help；在单字母参数之前使用单横线（-），例如 -h。输入此命令时，您应该看到该工具的简短描述以及如何使用。在某些情况下，可以使用
    -h 或 --help 查看帮助文件，例如如果我在使用的端口扫描工具 nmap 需要帮助，我将输入内容：


    ```

    kali >nmap -h

    ```


    不幸的是，虽然许多程序支持所有选项（--help 和 -h），但无法保证您使用的应用程序其中一个选项不起作用，请尝试另一个。


    ## 使用 man 引用手册


    除了帮助信息之外，大多数命令和应用程序都有一个手册（man）页面，其中包含更多信息，例如命令或应用程序的描述和概要。只需要在命令、应用程序之前插入 man
    即可查看手册。例如，查看 aircrack 的手册，请输入以下内容：


    ```

    kali >man aircrack-ng


    NAME

    aircrack-ng - 802.11 WEP / WPA-PSK key cracker


    SYNOPSIS

    aircrack-ng [options] <cap /.ivs file(s)>


    DESCRIPTION

    aircrack-ng is an 802.11 WEP and WPA2-PSK key cracking program. It can recover
    the WEP key once enough encrypted packets have been captured with airdump-ng.
    This part of the aircrack-ng suite determines the WEP key using two fundamental
    methods. The first method is via the PTA approach (Psychkin, Tews, Wiener). The
    main advantage of the PTA approach is that very few packets are required to crack
    the WEP key. The second method is the FMS/Korek method. The FMS/Korek method incorporates
    various statistical attacks to recover the WEP key and uses these in combination
    with brute force. Additionally, the program offers a dictionary method for determining
    the WEP key. For cracking WPA/WPA2 pre-shared keys, a wordlist (file or stdin)
    or airo-lib has been used.


    这将打开 aircrack-ng 手册，为您提供帮助信息以及更详细的信息。您可以使用 ENTER 键连续浏览此手册文件，也可以分别用 PG 和 GP 键向上向下翻页。退出，只需按
    q (退出)，然后返回命令


    # 搜索查找


    在熟悉 Linux 之前，找到自己的方法可能会令人沮丧，但对于一些基础命令和技术的理解将大大有助于让命令更加友好。以下命令可以帮助从终端查找内容。


    ## 使用 locate 搜索


    可能容易使用的命令是 locate。接下来是一个关键字，显示您查找查找的内容，此命令将遍历整个文件系统并找到该单词的每个匹配项。例如，要查找 aircrack-ng，请输入以下内容：


    ```

    kali >locate aircrack-ng


    /usr/share/applications/kali-aircrack-ng.desktop

    /usr/share/desktop/aircrack-ng.desktop

    /var/lib/dpkg/info/aircrack-ng.md

    ```


    但是 locate 命令并不是完美的。结果可能是过时的，给你太多的信息。此外，locate 使用数据库通常更新一次，如果您刚刚在几分钟或几小时前创建了一个文件，它可能会找不到。


    ## 使用 whereis 查找二进制文件


    要查找二进制文件，可以使用 whereis 命令找到它。此命令不仅返回二进制文件的位置，还返回它的手册（如果可用）。以下是一个例子：


    ```

    kali >whereis aircrack-ng

    airrack-ng /usr/share/man/aircrack-ng.1

    ```


    在这种情况下，whereis 只返回二进制文件和手册，而不是每次出现。


    ## 使用 which 在 PATH 变量中查找文件


    which 命令可以返回 Linux 中 PATH 变量中找到二进制文件的位置。将在第 7 章详细查看，但现在知道 PATH 变量保存了足够了。例如，当我们在终端中输入命令时：


    ```

    kali >which aircrack-ng

    /usr/bin/aircrack-ng

    ```


    ## 使用 find 执行强大的搜索


    find 命令是搜索程序功能强大且灵活的。它能够在任何目录中开始搜索。这是 find 的基础语法：


    ```

