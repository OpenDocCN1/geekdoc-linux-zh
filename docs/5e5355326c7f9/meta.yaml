  md: '# 使用 sysctl 进行内核优化


    使用正确的命令，你可以优化你的内核，意味着你可以更改内核内容，开启网络功能，甚至可以加固

    你的内核防御外部攻击。


    现代 Linux 内核使用 sysctl 命令来优化内核。使用 sysctl 的所有更改在重启系统之前都是有效的。

    要使任何更改永久生效，必须直接在/etc/sysctl.conf 编辑 sysctl 的配置文件。


    一句警告：在使用 sysctl 时需要小心，因为如果你没有匹配的知识和经验，很容易让系统无法运行和

    崩溃。在任何任何永久性的改变之前，确保你已经仔细考虑清楚你正在做的事情。


    现在我们来看一遍 sysctl 的内核内容。目前为止，你应该通过此处的命令识别我们提供的选项：


    ```

    kali $ sysctl -a | less


    dev.cdrom.autoclose = 0


    dev.cdrom.autoeject = 0


    dev.cdrom.check_media = 0


    dev.cdrom.debug = 0


    -- snip--

    ```


    在输出中，你应该看到很多参数，Linux 管理员可以使用这些参数来优化内核。这里有些内容对你

    为客户十分有用。作为如何使用 sysctl 的示例，我们将介绍如何使用内核包括生效功能。


    在中间人 (MITM) 攻击中，攻击将被自己放置于通信主机之间，以获取信息。流量会经过客系统，因此

    他们可以查看并可能更改通信。实现这种路径的方法是使用路由包。


    如果下流量查询输出中的路由或过滤“ipv4” (sysctl -a | less | grep ipv4)”，你应该看到以下内容：


    ```

    net.ipv4.ip_dynaddr = 0


    net.ipv4.ip_demux = 0

    net.ipv4.ip_forward = 0


    net.ipv4.ip_forward_use_mtu = 0


    -- snip--

    ```


    net.ipv4.ip_forward = 0 说是内核参数，它使内核能够接收它接收的数据。然而，它接收的数据

    包将被发送出去。默认值为了 0，这意味着禁用了数据转发。


    要启用 IP 转发，请按照示例输入——将 0 更改为 1:


    ```

    kali >sysctl -w net.ipv4.ip_forward=1

    ```


    记住，sysctl 更改在系统运行时生效，但在系统重启后会失效。对 sysctl 进行永久更改，你需

    编辑配置文件/etc/sysctl.conf。下面让我们更改内核处理 MITM 攻击的 IP 转发的方式，并借此更改永久

    化。


    要启用 IP 转发，请先在任何文本编辑器中打开/etc/sysctl.conf，并取消 IP 转发的注释。让我'
