    nice 设置为他们喜欢的任何值。


    | 数值 | 含义 |

    | :--- | :--- |

    | -20 | Most likely to receive priority |

    | 0 | Default nice value |

    | +19 | Least likely to receive priority |


    图 6-1：优先级数值


    启动进程时，可以使用 nice 命令设置优先级，然后使用 renice 命令在运行进程后更改优先级。两个命令的策略有所不同，可能会让人困惑。nice 命令要求增加
    nice value，而 renice 命令要求减少 nice value 的值。让我们来看一个例子来证明这一点。


    ## 在运行过程中设置优先级


    如所示，我们假设我们有一个名为 slowprocess 的进程位于 `/bin/slowprocess`。如果我们希望它加速运行，我们可以使用 nice 命令启动它：


    ```bash

    kali >renice -n -10 /bin/slowprocess

    ```


    此命令会将 nice value 降低 10，从而增加其优先级并为其分配更多资源。


    另一方面，如果我们想要对我们的用户的进程很好，给予 slowprocess 一个较低的优先级，我们可以将它的优先级增加到 10：


    ```bash

    kali >renice -n 10 /bin/slowprocess

    ```


    尝试一下当前正在运行的进程，然后运行 ps 来查看它是如何更改的，如果有的话。


    ## 使用 renice 命令改变运行中的优先级


    nice 命令用于指定 -20 和 19 之间的绝对值，并将优先级设置为该级别，而不是从其开始的级别减少或增加。此外，renice 需要针对特定的 PID
    而不是名字。由于，如果 slowprocess 在您的系统中使用了多的资源，并且你希望它一个更低的优先级，从而允许其他进程具有更高的优先级和更多的资源，你可以重新设置进程
    (PID 为 6996) 并给出一个更高的值，如下：


    ```bash

    kali >renice 2 6996

    ```


    与 nice 一样，只有 root 用户可以将进程重新设置为负值以赋予其更高的优先级，任何其他用户都可以使用 renice 来降低优先级。


    您可以使用 top 工具更改 nice 值。随着进程运行，只需要按 R 键，然后提供 PID 和 nice 值。例如 6-4 中正在运行，当你按下 R 键提供
