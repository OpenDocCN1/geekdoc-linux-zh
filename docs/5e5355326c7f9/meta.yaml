    现在，每次使用这个终端，您都会被提醒你是“世界上最好的黑客”。但是，您离开的任何终端仍然会有默认的提示符命令，因为 PS1 变量只保存当前的终端的会话。记住，在导出变量之前，只用于该会话。如果您喜欢这个新的提示符，并希望在每个终端中都能看到，您需要将它导出，如下：


    ```

    kali >export PS1

    ```'
