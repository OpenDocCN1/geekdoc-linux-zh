    \n## 检测并连接蓝牙\n\n如今，几乎所有的小型设备、移动设备和系统都内置了蓝牙，包括我们的电脑、智能手机、iPad、平板电脑、蓝牙、游戏控制器、键盘和许多设备。能够接入蓝牙设备导致上任何信息的泄露、设备的控制，以及蓝牙设备发送你需要的加密或密钥连接。\n\
    \n为了利用这个项目，我们需要了解它是工作的。对蓝牙的深入了解已经超出了本书的范围，但我将向你提供一些基础知识，帮助你连接蓝牙设备，为黑客的攻击做好准备。\n\
    \n## 蓝牙的工作原理\n\n蓝牙是一种用于低功耗通信的协议，用扩展范围在 2.4-2.485GHz 下使用。蓝牙速度为每秒 1600 kb（这种速度就是一种安全措施）。它由瑞利公司于\
    \ 1999 年开发，以 10 世纪英国王国哈尔的蓝牙命名（注意，瑞典和丹麦在 10 世纪是一个唯一的国家）。\n\n蓝牙的最小范围为 10 米，但没有上限，制造商可以在其设备中实施。许多厂商的距离可达\
    \ 100 米。有了特殊的技术，这一线可以扩展更大。\n\n连接两个蓝牙设备被视为配对。几乎两个蓝牙设备都是可以相互连接，但只有处于可发现模式时才对；处于不可发现模式的蓝牙传输以下信息：\n\
    \n- 名称\n- 类别\n- 服务清单\n- 技术信息\n\n另一个。\n\n每个设备都有一个唯一的 48 位标识（类似于 MAC 地址），还有一个制造商指定的名称。当我们想要识别并访问一个蓝牙设备时，这些是有用的数据片段。\n\
    \n## 蓝牙扫描\n\nLinux 有一个名为 bluez 的蓝牙协议实现，我们将它用来扫描。大多数 Linux 发行版包括 Kali Linux，默认安装了。如果没有，可以使用命令中找到它：\n\
    \n```\napt-get install bluez\n```\n\nBlueZ 有许多简单的工具，我们可以用来管理和扫描蓝牙，包括：\n\n- hcconfig：操作与\
    \ Linux 的 ifconfig 相似对于蓝牙设备。\n- hcitool：使用它来扫描蓝牙接口并查询，提供设备名、设备 ID、设备类和设备时钟信息。\n\
    - hcidump：能够通信，我们可以捕获通过蓝牙发送的数据包。\n\n第一个扫描检查 hcconfig 是否识别和启用，我们可以使用它扫描其他蓝牙设备：\n\
    \n```\nhcconfig\n```\n\n```\nhci0: Type: BR/EDR Bus: USB\nBD Address: 10:AE:60:58:F1:37\
    \ MTU: 310 RUNNING\nRX: 13143 acl:45 sco:0\nTX: 42881 acl:45 sco:0\n```\n\n如你所见，我的蓝牙适配器的\
    \ MAC 地址是 10:AE:60:58:F1:37。适配器名为 hci0。下一步是检查连接是否启用，我们可以通过名称使用 hcconfig 命令：\n\n\
    ```\nhcconfig hci0 up\n```\n\n如果命令运行成功，我们将看到一个新的提示。hci0 准备好了？让我们开始工作。\n\n## 使用\
    \ hcitool 扫描设备\n\n现在我们知道适配器已经启动，我们可以使用 Bluez 套件中的另一个工具 hcitool 来扫描范围内的蓝牙设备。让我们首先使用这个工具扫描功能来发现蓝牙设备，这意味着它们处于发现模式，简单的扫描命令如所示：\n\
    \n```\nkali > hcitool inq\nScanning...\n72:6E:46:65:72:66 ANDROID BT\n22:C5:96:08:5D32\
    \ SCH-135\n```\n\n在我的系统中，hcitool 发现了两个设备，ANDROID BT 和 SCH-135。你可能会根据周围蓝牙设备的情况发现全部输出。为了测试目的，请将你的手机或其它蓝牙设置为发现模式，并查看是否接收到了该设备。\n\
    \n现在，让我们收集具有查询功能的已检测设备的更多信息：\n\n```\nkali > hcitool Inquiring...\n24:C6:96:08:5D33\
    \ clock offset:0x4e8b class:0x5a02c\n76:F:46:65:72:67 clock offset:0x21c0 class:0x5a02c\n\
    ```\n\n给了我们设备的 MAC 地址，时钟偏移和设备类别。该类型指示找到的蓝牙设备的类型，您可以通过蓝牙 SIG 点（https://www.bluetooth.org/en-us/specification/assigned-numbers/service-discovery/）来查找代码并查看是什么类型的设备。\n\
    \nhcitool 工具是一个强大的命令行接口，可以做很多事情。清单 14-3 显示了帮助页面，其中包含一些可以使用命令。来自帮助页面查看完整列表：\n\n\
    ```\nkali > hcitool --help\nhcitool - HCI Tool Ver 4.99\nUsage:\nhcitool [options]\
    \ <command [command parameters]\n\nOptions:\n--help Display dev\n-i dev HCI device\n\
    \nCommands:\ndev Local devices\ninquire Scan remote devices\nname Get name from\
    \ remote devices\n```\n\n--snip--\n\n## 清单 14-3: 一些 hcitool 命令\n\n许多蓝牙工具，你将看到周围简单地使用这些命令在脚本中，你可以很容易创建你自己的工具使用在自己的\
    \ bash 或 python 脚本中，我们将在第 17 章研究这些脚本。\n\n## 使用 sdptool 扫描服务\n\n服务发现协议 (SDP) 是一种用于搜索蓝牙服务的蓝牙（蓝牙是一套服务），很有帮助的是，bluez\
    \ 使用了 sdptool 工具用于浏览设备提供的服务。还需要注意的是，设备不必处于扫描模式。方法如下：\n\n```\nsdptool browse MACAddress\n\
    ```\n\n清单14-4 显示了我使用 sdptool 在清单 14-2 前检测到的某个设备上搜索服务。\n\n```\nkali > sdptool browse\
    \ 76:6E:46:63:72:66\nBrowsing 76:6E:46:63:72:66...\nServiceHandle: 0x10002\nService\
    \ Class ID List:\n(0x1800)\nProtocol Descriptor List:\n\"L2CAP\" (0x0100)\nPSM:\
    \ 31\n\"ATT\" (0x0007)\nuint16: 1\nuint16: 5\n```\n\n清单 14-4: 使用 sdptool 扫描。在这里我们可以看到\
    \ sdptool 工具能够获取关于这个设备使用的所有服务。特别是看到这个设备支持 ATT 协议，即低能量属性。这为我们提供更多关于蓝牙的交互。\n\n##\
    \ 通过 l2ping 查看设备是否访问\n\n一旦我们收集了附近的设备的 MAC 地址，就可以对这些设备发送 ping，无论它们是否处于发现模式，查看它们是否在范围内。要发送\
    \ ping，我们使用 l2ping 命令，语法如下：\n\n```\nl2ping MACAddress\n```\n\n清单 14-5 显示了我对设备执行\
    \ ping 操作：\n\n```\nkali > l2ping 76:6E:46 -c 4\nPing 10:AE:60:58:F1:37: seq=0\
    \ time=1.2ms ttl=64\nPing 10:AE:60:58:F1:37: seq=1 time=1.1ms ttl=64\nPing 10:AE:60:58:F1:37:\
    \ seq=2 time=1.3ms ttl=64\nPing 10:AE:60:58:F1:37: seq=3 time=1.2ms ttl=64\n\n\
    --- 4 packets transmitted, 4 received, 0% packet loss, time 3000ms\n```\n\n清单\
    \ 14-5: Ping 蓝牙。此输出表示设备在范围内且可访问。\n\n## 总结\n\n无线连通和攻击的核心 Linux 已经开发了专门的命令来扫描和连接，这是攻击的第一步。无线工具包括\
    \ airmon-ng 和 airodump-ng。Bluez 包括 hcconfig、hcitool 等能够扫描和收集信息的工具。在攻击之前，必须知道设备是否访问。\n\
    \n## 练习\n\n在进入第 15 章之前，通过以下练习尝试从本章学到的：\n\n1. 使用 ifconfig 检查网络设备。\n2. 运行 iwconfig\
    \ 注意所有无线适配器。\n3. 使用 iwlist 查看 Wi-Fi 范围。\n4. 使用 nmcli 检查 Wi-Fi 范围。你觉得哪个更有直观，nmcli\
    \ 或 iwlist?\n5. 使用 nmcli 连接到 Wi-Fi AP。\n6. 使用 hcconfig 打开蓝牙适配器并使用 hcitool 扫描附近的设备。\n\
    7. 使用 l2ping 测试蓝牙设备是否在范围内。\n\n## 管理 Linux内核和可载内核模块 MANAGING THE LINUX KERNEL AND\
    \ LOADABLE KERNEL MODULES\n\n所有操作系统至少由两个主要组件组成。其中最重要的是内核。内核位于操作系统的中心，控制着操作系统的一切，包含管理内存、控制\
    \ CPU 以及控制用户在屏幕上看到的内容。操作系统的第二个元素通常被称为用户区域，几乎包括所有元素。\n\n内核被设计成一个保护或特权的区域，只能通过 root\
    \ 账户或其他特殊权限访问。这是充分理由的，因为对内核的访问几乎可以对整个操作系统的访问。因此，大多数系统只向用户和服务提供对用户区域的访问，用户可以在不控制操作系统的情况下访问他们需要的内容。\n\
    \n访问内核允许用户更改操作系统的工作方式，允许操作操作系统崩溃使其无法工作。尽管存在这种风险，但在某些情况下，出于操作和安全原因，系统管理员必须非常谨慎地访问内核。\n\
    \n在本章中，我们将介绍如何改变内核的工作方式并将模块加载到内核中。不言而喻，如果客户可以改变内核，他们就可以控制内核。此外，攻击者可能需要改变内核对某些攻击的作用，例如中间人（MITM）攻击，获取自己置于客户端和服务器之间，并且可以窃听或改变通信。首先，我们将仔细内核结构及其模块。\n\
    \n## 什么是内核？\n\n内核是操作系统的核心，控制着它所做的一切，包括硬件组件的交互和启动硬件（如 CPU、内存和硬盘驱动器）的运行。内核是你看到的用户所用的应用程序和运行所有硬件的服务。\n\
    \nLinux 是单内核，可以添加内核模块。因此，可以在内核中添加和移除模块。内核有时需要更新，这可能需要安装新的驱动程序（如视频、设备或 USB 设备）、文件系统驱动程序甚至系统扩展。必须将这些驱动程序加载到内核中才能正常运行。在某些系统中，添加驱动程序必须重新编译和更新整个内核，Linux\
    \ 并不在整个过程中向内核添加一些模块。这些模块可以被称为内核模块 LKM。\n\nLinux 需要内核级别的权限，使得它更容易易受攻击的目标。一种被称为\
    \ rootkit 的特殊软件可以通过这些 Linux 加载到操作系统的内核。如果你能注入内核，你就可以控制操作系统。\n"
