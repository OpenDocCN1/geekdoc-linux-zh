    ## crontab 快捷方式


    crontab 文件有些内置的快捷方式，用来代替具体的时间、日期、月份。它包含这些：


    - * @yearly

    - * @annually

    - * @monthly

    - * @weekly

    - * @daily

    - * @midnight

    - * @noon

    - * @reboot


    所以，如果你希望 MySQL 扫描器每天运行，你可以添加行到 crontab 文件：


    ```

    @midnight user /usr/share/MySQLscanner.sh

    ```


    ## 使用 RC 脚本任务


    当你启动 Linux 系统时，都会运行一些脚本来配置环境。这些脚本就是 rc 脚本。在内核初始化加载了所有模块之后，内核会启动一个守护进程叫做 init 或
    init.d。这个守护进程开始运行 /etc/init.d/rc 中一些脚本。这些脚本将启动运行 Linux 所需要的服务。


    ## Linux 运行级别


    Linux 有多个运行级别，用于指定启动时需要运行哪些脚本。例如，运行级别 1 是单用户工作状态，类似于网络的服务是不运行级别，rc 脚本会根据运行级别运行。


    - 0 系统初始化状态

    - 1 单用户工作状态

    - 2 多用户工作状态

    - 6 重启


    ## 将服务添加到 rc.d


