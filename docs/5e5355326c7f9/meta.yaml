    Linux 使用名为 syslogd 的守护进程记录计算机的事件。syslog 的变体，包括 rsyslog 和 syslog-ng，在 Linux 的不同发行上，尽管操作非常相似，但仍然存在一些细微的差异。Kali
    Linux是在 Debian 上构建的，并且 Debian 默认情况下有 rsyslog，我们将在本章重点介绍这个实用程序。如果您想使用其他发行版，那么会有它们的日志系统一些研究。


    让我们看看系统的 rsyslog。我们将搜索与 rsyslog 相关的所有文件。首先，在 kali 打开一个终端，输入内容：


