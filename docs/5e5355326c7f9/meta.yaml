    # 终止进程


    有时，进程消耗了太多的资源，表现出异常的行为，或者死机。表现这种行为的过程通常被称为僵户进程。对你来说，有很多问题的症状可能是僵户进程使用的浪费资源，可以更好地分配给空闲的进程。


    当您确定有问题的进程时，您可能希望使用 kill 命令来终止它。有许多杀死进程的方法，每个方法都有自己的命令行选项（数字）。


    kill 命令有 6 种不同的 kill 标记，每个标记都有不同。在这里，我们将重点介绍于您可能会发现最实用的一个参数，kill 标记是 kill-signal。如果你不提供信号标记，默认为
    SIGTERM。能够列出的各种 kill 标记。


    表 6-1: 常用的 kill 标记信号


    | 标识 | 选项参数 | 描述 |

    | SIGHUP | 1 | 这标识为挂起 (HUP) 标记信号。它停止指定的进程并使用相同的 PID 重启动它。 |

    | SIGINT | 2 | 这是终止 (INT) 信号。这是一个弱信号，不能保证工作完成，但在许多情况下有效。 |

    | SIGQUIT | 3 | 这标识为核心转储。它终止进程并将信息保存在内存中，然后将此信息保存在当前工作目录中的一个名为 core 的文件中。（例如的原因超过了范围）。
    |'
