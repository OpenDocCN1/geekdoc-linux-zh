    ## 练习


    在继续学习第 13 章之前，通过完成以下练习尝试你从这一章中学到的技能：


    - 1.通过命令启动 apache2 服务。

    - 2.使用 index.html 文件，创建一个简单的网站，宣告您进入令人兴奋的黑客攻击世界。

    - 3.通过命令启动 SSH 服务。现在从 LAN 上的另一个系统连接到 Kali 系统。

    - 4.启动 MySQL 数据库服务并将用户密码更改为 hackers-aris。切换到 mysql 数据库。

    - 5.启动 PostgreSQL 数据库服务。按照本章所述对进行设置，以供 Metasploit 使用。


    # 13 安全和匿名


    # # BECOMING SECURE AND ANONYMOUS


    今天，几乎我们在互联网上做的一切都会被跟踪。无论是谷歌跟踪我们的在线搜索、网站访问和电子邮件，还是美国国家安全局（NSA）对我们的所有活动进行编码，无论谁在追踪我们，我们的每一次在线活动都会被记录、编码索引，然后被抓出来，以造福他人。普通人，尤其是客户，需要了解如何限制这种踪，并在网上保持相对匿名，以限制这种无处不在的监控。


    在本章中，我们将介绍如何使用以下四种匿名（或尽可能接近）浏览网络：


    - The Onion Network

    - 洋葱网络

    - 代理服务器

    - 虚拟专用网络

    - 私密加密的电子邮件


    没有一种方法能保证你的活动不被窥探，如果有足够的时间和资源，任何事情都能被追踪。然而，这些方法可能会让追踪者的工作更加困难。


    ## # 网络是如何追踪我们的


    首先，让我们从更高的层次来讨论在互联网上的活动是如何被跟踪的。我们不会讨论所有的跟踪方法，也不会多地讨论任何方法的细节了，因为这超出了本书的范围。事实上，这样的讨论可能占用一整本书的篇幅。


    首先，你的 IP 标识就是你在互联网上的身份。从你发送的数据会被标记为你的 IP 地址，使得你的活动被追踪。快捷、谷歌和其他邮件服务器“阅读”你的电子邮件，寻找关键词，以便更有效地为你服务广告。我们先来看看
    IP 地址是如何在互联网上被泄露信息的。


    当通过互联网发送数据时，它包含数据的头部和 IP 地址。通过这种方式，数据就知道要去哪里以及在返回哪里。每个数据包都会经过多个路由器，找到它的目的地，然后返回目的地。对于一个互联网连接，每一跳都是数据通过不同的路由器到达目的地的，发送地和目的地之间可能有
    20-30 跳。


    当数据在互联网传输时，任何拥有数据的人都可以看到发送了数据包，到了哪里，它要去哪里。这是网站可以告诉你收到的地址并自动追踪的方式，也是有人在追踪你在互联网上的位置。


    要查看在互联网和目的之间的跳转次数，你可以使用 traceroute 命令。只需要 traceroute IP 地址或域名，该命令将向目标发送数据包并跟踪这些数据的路径：


    ```

    traceroute google.com

    traceroute google.com (172.217.1.78), 30 hops max, 60 bytes packets

    1 192.168.1.1 (192.168.1.1) 4.5 ms 3.84 ms 32.96 ms

    2 10.0.0.1 (10.0.0.1) 5.97 ms 6.79 ms

    3 36.90 ms (96.120.96.45) 27.95 ms 30.37 ms 32.96 ms


    -- --

    ```


    如你所见，www.google.com 与我的互联网距离是 18 跳。你的结果可能不会相同，因为你的请求来自不同的位置，而谷歌在全球有许多服务器。此外，数据在互联网上并不是采用相同的路由，因此你可能会将一个信息从地发送到达相同的终点，并接不同的路由。让我们看看如何用
    Tor 网络来伪装你的一切。


    ## 洋葱路由系统


    上世纪 90 年，美国海军研究办公室（ONR）开发了一种匿名互联网通话的方法。该计划是建立一个路由器网络，它与互联网的路由器是分开的，并且加密流量，并且存储一个路由器路由器的加密
    IP 地址。这使得一路上所有其他路由器地址都加密了。他们的想法是，任何流量的人都无法确定数据的来源或目的地


    这项研究在 2002 年被称为为“洋葱路由(Tor)项目”，现在任何人都都可以使用它在 web 上进行相对安全且匿名的导航。


    ## Tor是如何工作的


    通过 Tor 发送的数据不是通过常规路由器发送的，而是通过全球 7000 多台路由器组成的网络发送的，我们要感谢志愿者们允许 Tor 使用他们的计算机。在完美完全独立的路由器网络的基础上，
    Tor 加每个数据的数据、目的地和发送 IP 地址。在每一跳，收到的信息被加密，然后在最后一次跳被解析。这样每个数据包含路径上的前跳的信息，而不是包含 IP
    地址。如果有人拦截了流量，他们只能看到最后一跳。网站所有者只能看到流量的 IP 地址（见图-1），这确保了在互联网上的匿名性。


    要启用 Tor，只需从 https://www.torproject.org/ 安装 Tor 浏览器。一旦安装完成后，它将如同图 所示，您可以像任何互联浏览器一样使用它。通过使用这个浏览器，您将通过一组单独的路由器来访问互联网，能够在被“老大”（超级节点）的情况下访问网站。不幸的是，权衡的结果是通过
    Tor 浏览器会变得慢，因为没有那么多路由器，网络有限。


    ## Welcome to Tor Browser


    You are now free to browse the Internet.


    ## Tor Network Settings


    Tor is NOT all you need to browse anonymously! You may need to change some of
    your habits to ensure your identity stays safe.


    ## What Next?


    - Tips On Staying Anonymous

    - Tor User Manual


    ## Can You Help?


    There are many ways you can help make the Tor Network faster and stronger:


    - Run Tor Relay Node

    - Volunteer Your Services

    - Make a Donation


    ## 安全匿名


    美国和其他其他国家的信息情报机构认为 Tor 网络是对安全的威胁。因为这使得一个匿名网络可以让政府分子在被监视的情况下交流。许多大的、慈善和隐私的研究正在努力打破
    Tor 的匿名性。


    Tor 曾经被这些攻击破解，而且可能会再次被破坏。例如，运行自己的 Tor 意味着你的流量可能通过 Tor 网络流出。如果你的流量流出了 Tor路由，那么就更糟糕了，因为退出路由总是目的地。Tor
    还有一种被称为“流量关联”（traffic correlation）的方法，这种方法通过寻找流出流量的模式，能够打破 Tor 的匿名性。虽然这些破解 Tor
    的尝试不会影响 Tor 在商业服务（如 Google）中隐藏身份的有效性，但它可以限制隐藏隐藏名的有效性。


    ## 代理服务器


    在互联网上实现匿名的另一种策略是使用代理，它是充当流量的中间系统；用户连接到代理，并在传递流量之前其提供的 IP 地址（参见图-3）。当流量作为目标返回时，流量发送回
    IP。通过这种方式，流量像是代理，而不是原始 IP。


    当然，代理可能会记录您的流量，但调查员必须获得票据或搜查令才能获得这些日志。为了使您的流量更加难以追踪，您可以在称为代理的策略策略中使用多个代理。


    Kali Linux 有一个优秀的代理工具，称为 proxychain，您可以设置它来隐匿您的流量。proxychain 命令的语法非常简单，如下所示：


    ```

    proxychains <the command you want proved> <arguments>

    ```


    您提供的参数可能包括一个 IP 地址。例如，如果您想使用命令 nmap 以通过代理链匿名方式扫描一个站点，则需要输入以下内容：


    ```

    proxychains nmap -sS - P <IP address>

    ```


    这将通过代理将 nmap -sS 命令发送到给定的 IP 地址。然后，该工具自己建立代理，因此不必担心它。


    ## 在配置文件中设置代理


    在本节中，我们使用的 proxychain 命令设置了一个代理。与 Linux/Unix 中的几乎所有应用程序一样，proxychain 的配置是由配置文件管理的，例如
    /etc/proxychains.conf。使用以下命令在您选择的编辑器中打开配置文件（如果需要，可以使用您选择的编辑器替换 nano）：


    ```

    kali >nano /etc/proxychains.conf

    ```


    您应该看到类似于代码列表 13-1 中所示的文件：


    ```

    # proxychains.conf VER 3.1


    # HTTP, SOCKS4, SOCKS5 tunneling profiler with DNS.


    # The option below identifies how the ProxyList is created.

    # # only one option should be uncommented at time,

    # otherwise the last appearing proxy will be accepted

    ```


    ### dynamic_chain


    Dynamic - Each connection will be done via chained proxies all proxies chained
    in the order as they appear in the list. at least one proxy must be online to
    play in chain (dead proxies are skipped) otherwise EINTR is returned to the app.


    Strict - Each connection will be done via chained proxies all proxies chained
    in the order as they appear in the list. all proxies must be online to play in
    chain otherwise EINTR is returned to the app.


    ```

    -- snip --

    ```

    proxychains.conf 文件向下滚动到第 61 行，您应该看到 ProxyList 部分，如 13-2 所示。


    ```

    [ProxyList]

    # add proxy here...

    # meanwhile

    # defaults set to "tor"

    socks4 127.0.0.1:9050

    ```

    proxychains.conf 文件用于添加代理。通过输入在本列表中列出的 IP 地址和端口来添加代理。


    ## Port


    我们可以通过输入在本列表中列出的 IP 地址和端口来添加代理。现在，我们将使用一些免费代理。你可以通过谷歌搜索“免费代理”或使用网站 http://www.hidemy.name
    找到免费代理，如图-4 所示。请注意，现实活动中使用免费代理并不是一个主意。这里使用的示例用于教育目的。


