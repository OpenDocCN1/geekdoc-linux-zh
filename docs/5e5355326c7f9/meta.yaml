    \ 3-2）：\n\n```bash\nkali >iwconfig\nwlan0 IEEE 802.11bg SSID:off/any\nMode:Managed\
    \ Access Point: Not Associated Tx-Power=20 dbm\n```\n\n```text\nlo:no wireless\
    \ extensions\neth0:no wireless extensions\n```\n\n清单 3-2: 使用 iwconfig 获取我们无线适配器的信息\n\
    \n这里的输出告诉我们，唯一有一个无线扩展的网络接口是 wlan0，这正是我所期望的。lo 和 eth0 都没有任何无线扩展。\n\n对于 wlan0，我们了解了设备能够支持的\
    \ 802.11 IEEE 无线标准：b 和 g，两种无线标准。在大多数无线扩展中包括 n（是标准的）。我们从 iwconfig 中学习了扩展的模式 Mode:Manage，不同于\
