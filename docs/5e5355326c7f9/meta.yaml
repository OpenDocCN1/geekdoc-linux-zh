    # 欺骗你的 MAC 地址


    你可以使用 ifconfig 命令改变你的 MAC 地址(或者说 HWaddr)。这个 MAC 地址是全球唯一一并且经常被当作一种安全措施来防止攻击者在网络中——或者说跟随他们。更改你的
    MAC 地址会欺骗不同的 MAC 地址几乎是非常方便的，并且可以帮你防止这些安全问题。由于，这是一种非常有用的网络控制。


    如果你想伪装你的 MAC 地址，简单使用 ifconfig 命令的选项来关闭接口(在本例中eth0)，后输入ifconfig 命令加上接口名(hw 表示网卡，ether
    表示以太网)和新的伪造 MAC 地址后，使用还原 备份地址即可更改。


    这里有一个例子：


    ```

    kali ifconfig eth0 down

    kali ifconfig eth0 hw 00:11:22:33:44:55

    kali ifconfig eth0 up

    ```


    现在使用 ifconfig 检查设置信息，你应该看到 HWaddr 更改为你伪造的 MAC 地址。(原英文IP address 错误，参考下文将判断处修改为
    MAC 地址)。


    # 从 DHCP 服务器分配 IP 地址


    Linux 有一个动态主机配置(DHCP)服务，它运行一个守护进程(daemon)一个在后台运行的进程名为 dhcp，或者使用 DHCP 服务。DHCP 服务器为所有主机的
    IP 地址，在运行时将 IP 地址分配给主机，这使得你可以成为分析员在攻击后获取证据的绝佳选择。由于， DHCP 服务器的工作原理对于一名客户端很有用。


    通常来说，从局域网(LAN)连接到 internet。如果你设置静态 IP，你需要返回并获取到一个新的 DHCP 分配的 IP 地址。这样做是因为你总是需要你的系统，但是我想向你展示怎么一个新的
    DHCP 而不需要关闭系统并重启。


    要从 DHCP 请求 地址，可以使用 dhclient 命令并在完成后使用相应的网络接口单独调用 DHCP 服务，告知你希望分配的地址。不同的 Linux
    发行版使用的不同的 客户端，但是 kali 是基于 Debian，而'
