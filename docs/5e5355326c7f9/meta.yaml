    您现在应该可以访问您的 Kali 桌面（参见 1-2）。我们将快速查看桌面的两个最基本的方面：终端接口和文件结构。


    # 终端


    使用 Kali 的第一步是打开终端，这是我们将在本书中使用的命令行界面。在 Kali Linux 中，您将在桌面底部找到终端的图标。双击此图标以打开终端或使用
    CTRL-ALT-T。您的新终端应如 1-3 所示。


    图 1-3 终端


    此终端打开了命令行环境（称为 shell），您可以在底层操作系统上运行命令并编写脚本。虽然 Linux 有许多不同的 shell 环境，但最受欢迎的是 bash
    shell，它也是 Kali 和许多其他 Linux 发行版中的默认 shell。


    要更改密码，可以使用命令 passwd。


    # Linux 文件系统


    Linux 文件系统结构与 Windows 有些不同。Linux 在文件系统的基础上没有物理驱动器（例如 C: 驱动器），而是使用逻辑文件系统。在文件系统结构的顶层是
    /，它通常被称为文件系统的根，就像是一个倒置树（见图 1-4）。请记住，这与 root 用户不同。这些术语可能看起来令人困惑，但是一旦习惯了 Linux，它们就会变得容易区分。


    | /boot | /home | /proc | /dev | /sbin | /usr |

    | --- | --- | --- | --- | --- | --- |

    | image, Kernel | User directories | View of internal kernel data | Special device
    files | Binaries | /sbin, More binaries |

    | /root | /etc | /mnt | /sys | /bin | /lib |

    | Superuser''s home directory | System configuration files | General-purpose mount
    point | Kernel''s view of the hardware | Binaries, Libraries | More binaries,
    More libraries |


    图 1-4: Linux 系统的根 (/) 位于文件系统目录的顶部，以下是需要了解最重要的目录：


    - /root：root用户的目录

    - /etc：通常包含 Linux 配置文件 - 控制程序启动时间和运行方式的文件

    - /home：用户的目录

    - /mnt：包含其他文件系统附加或安装到文件系统的位置

    - /media 和 USB 设备通常连接或安装到文件系统的位置

    - /bin：包含所有应用程序二进制文件（相当于 Microsoft Windows 中的可执行文件）

    - /lib：库文件（与 Object 类的共享程序）


    在书中，我们将花费更多时间在这些关键目录上。了解这些目录对于从命令引导文件系统非常重要。


    在开始之前，知道在执行任何操作不要以 root 用户登录也是重要的，因为当你以 root 身份登录时，任何攻击你系统的人（如：管理员）有机会会被黑客入侵，并立即获得
    root 权限，从而“拥有”你的系统。在启动常规程序、浏览 Web、使用 Wireshark 等工具时使用用户身份登录。


    # LINUX 基本命令


    首先，我们将看看一些基本命令，它们将帮助你在 Linux 中启动和运行。


    ## 用 pwd 查看当前目录


    与在 Windows 或 macOS 等图形用户界面 (GUI) 环境中工作不同，Linux 中的命令并不总是能够明确显示你当前所在的位置。要导航到目录，通常需要知道你现在的位置。显示当前目录使用命令
    pwd。在目录结构中的位置 pwd。在您的输入终端输入 pwd 以查看的所在目录位置：


    ```

    kali>pwd

    /root

    ```


    在这种情况下，返回 /root，告诉我在 root 用户的目录中，并且由于你在启动 Linux 时使用了 root 用户登录，你也应该回到 root 用户的目录中，该目录位于文件结构顶部（/)的一级目录。


    如果你在另一个目录中，pwd 将返回该目录的登录名称。


    ## 使用 whoami 查看登录用户


    在 Linux 中，超级用户或管理员名为 root。它拥有添加用户、更改密码、更改权限所需的所有权限。显然，你不希望任何人有能力进行此类更改；你希望有人信任并且对操作系统足够的理解。作为用户，你需要拥有所有权限来运行你需要的程序和命令（除非拥有
    root 权限，否则许多用户工具将无法运行由于需要 root 用户身份登录）。


    如果你忘记了是以 root 用户身份还是其他用户身份登录，可以使用 whoami 查看你登录的用户：


    ```

    kali>whoami

    root

    ```


    如果用其他用户身份登录，例如我的个人帐户，那么 whoami 会返回该用户的用户名，如下所示：


    ```

    kali >whoami

    ot

    ```


    ## 浏览 Linux 文件系统


    从终端导航文件系统是一项重要的技能。要完成任何工作，你需要找到其他目录中的应用程序、文件和目录。基于 GUI 系统，你可以直接看到目录，但当使用命令行界面时，结果完全基于文本。


    ## 使用 cd 修改目录


    要在终端修改目录，使用命令 cd。例如，进入存储配置文件的 /etc 目录：


    ```

    kali >cd /etc

    root@kali:/etc

    ```


    我们在 /etc 目录中可以通过输入 pwd 来确认位置：


    ```

    root@kali:/etc$pwd

    /etc

    ```


    在文件结构中向上移动一级（指向根目录 /），我们使用 cd 后跟双点 (..)，如下所示：


    ```

    root@kali:/$pwd

    /

    ```


    这将从 /etc 升级到 root 目录，但你可以根据需要向上移动级别。只需使用相同数量的双点（..）：你会使用 .. 向上一级。你会使用 ... 向上二级目录。你可以使用
    .... 向上三级，以此此类推：例如向上二级目录，请输入 cd 后输入路径，其间有空格：


    ```

    kali <cd ...

    ```


    你还可以输入 cd/ 从任何地方到文件结构中的根，其中 / 表示文件系统的根。


