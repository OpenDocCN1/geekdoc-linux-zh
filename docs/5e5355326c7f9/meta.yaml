    # 在后台运行


    在 Linux 中，无论您使用命令还是，您都在 shell 中工作。所有的命令都是从 shell 中执行的，即使命令是从图形界面的运行。执行命令时，shell
    会等待命令完成，然后再提供一个命令提示。


    有时，您可能希望在后台运行，而不必等待它在终端中结束。例如，假设我们在文本编辑器中处理脚本，由于通过输入在后台运行我们的文本编辑器(leafpad):


    ```

    kali >leafpad newscript

    ```


    当然，我们可以另一个终端运行更多命令，更好的方法是选择资源和屏幕空间是在启动后后台运行的文本编辑器。在后台运行的编辑器会让它持续运行而无需结束通过这种方式，终端可以执行其他职责。


    要在后台启动文本编辑器，需要在命令末尾加上一个 & (符号)，如下所示：


    ```

    kali >leafpad newscript &

    ```


    现在，当文本编辑器打开时，终端返回一个新的命令提示，这样我们就可以系统中输入其他命令，同时编辑我们的新稿。对于您希望使用终端时可能会运行长时间的任何进程都是有效的。作为客户，您发现这对于运行多个多个任务的终端非常有用，可以节省资源和屏幕空间。'
