    # 如何添加 PATH 变量


    新用户经常的一个错误是，以这种方式将一个新目录(/root/newhackingtool)直接分配给 PATH 变量：


    ```

    kali >PATH=/root/newhackingtool


    kali >echo PATH


    /root/newhackingtool

    ```


    可以使用这个命令，您的 PATH 变量将只包含/root/newhackingtool 目录，不再包含类似/bin,/sbin 等包含命令的系统二进制制目录。然后，当您使用任何系统命令时，您将收到未找到的错误命令，如下所示，除非在执行该命令时首先导航到系统二进制目录：


    ```

    bash: cd: command not found

