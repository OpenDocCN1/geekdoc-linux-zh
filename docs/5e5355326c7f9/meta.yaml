- img_proc: true
  md: '![](img/77055846b6e5bd43c939d5fb384e34d6_152_0.png)


    图 13-3:通过代理服务器运行流量


    当然，代理可能会记录您的流量，但调查员必须获得票据或搜查令才能获得这些日志。为了使您的流量更加难以追踪，您可以在称为代理的策略中使用多个代理，这一策略我们在本章稍后讨论。


    Kali Linux 有一个优秀的代理工具，称为 proxychain，您可以设置它来隐匿您的流量。proxychain 命令的语法非常简单，如下所示：


    ```

    kali >proxychains <the command you want proved> <arguments>

    ```


    您提供的参数可能包括一个 IP 地址。例如，如果您想使用命令 nmap 以通过代理链匿名方式扫描一个站点，则需要输入以下内容：


    ```

    kali >proxychains nmap -sS - P <IP address>

    ```


    这将通过代理将 nmap -sS 命令发送到给定的 IP 地址。然后，该工具自己建立代理，因此不必担心它。


    # 在配置文件中设置代理


    在本节中，我们使用的 proxychain 命令设置了一个代理。与 Linux/Unix 中的几乎所有应用程序程序一样，proxychain 的配置是由配置文件管理的，例如
    /etc/proxychain.conf。使用以下命令在您选择的编辑器中打开配置文件（如果需要，可以使用您选择的编辑器替换 leappad）：


    ```

    kali >leappad /etc/proxychains.conf

    ```


    您应该看到类似于代码列表 13-1 中所示的文件：


    ```

    # proxychains.conf VER 3.1


    # HTTP, SOCKS4, SOCKS5 tunneling profiler with DNS.


    # The option below identifies how the ProxyList is created.

    # # only one option should be uncommented at time,

    # otherwise the last appearing proxy will be accepted

    ```'
