    在阅读第 6 章之前，让我们练习一下之前学习的技能：


    - 选择一个目录，使用 list 命令查看目录文件的权限。

    - 选择一个没有执行权限的程序，尝试使用 chmod 命令通过数值法和 UGO 法赋予执行权限。

    - 使用 chown 改变文件所有者。

    - 使用 find 命令，通过 SGID 标志位查找文件。


    ## 6 进程管理


    ### PROCESS MANAGEMENT


    在任何时候，Linux 系统通常同时运行数百个甚至数个进程。进程只是一个正在运行和使用资源的程序。它包括终端、Web 服务器、任何正在运行的命令、任何数据库、GUI
    界面等。任何优秀的 Linux 管理（特别是客户）都需要了解如何管理流程来优化系统。例如，一旦客户控制了目标系统，他们可能想要找到并停止某个进程，如防病毒应用程序或防火墙。为此，客户首先需要知道如何找到该进程。客户可能还想要一个扫描脚本来定期运行以查找受攻击的系统，因此我们还将研究如何安排这样的脚本。


    在本章中，你将学习如何管理这些进程。首先，你将学习查看和查找流程以及发现哪些流程资源消耗最多。然后你将学习如何通过后台运行流程来管理流程，确定流程优先级，并在必要时将其剔除。


    管理进程的第一步是查看系统上正在运行的进程。ps 命令是查看进程的主要工具。在命令行中运行它可以查看哪些进程处于活动状态：


    ```

    kali >ps

    PID       TTY     TIME     CMD

    39659     pts/0   00:00:01 bash

    39665     pts/0   00:00:00 ps

    ```


    Linux 内核是操作系统的核心，在创建进程时按照每个进程分配一个唯一的 PID (ID)。在 Linux 中使用这些进程时，通常需要指定的 PID，因此
    PID 的比较更为重要。当没有使用参数的进程时，ps 命令会为您提供太多信息：当前登录的用户（例如 root）以及该线程正在 bash shell 打开并运行的，使用了
    ps 命令。我们想要并且需要更多的信息，尤其是这些进程由其他用户和后台运行的。如果没有这些信息，我们对系统实际发生的情况知之甚少。使用 aux 运行命令将在上运行的所有进程系统适用于所有用户，如列表
    6-1 所示。注意不要在这些进程前面添加前符。使用快捷键并且所有内容都是小写的，因为 Linux 是大小敏感的，所以使用大写会带来不同的结果。


    ```

    kali >ps aux

    USER       %CPU %MEM    VSZ   RSS TTY START TIME COMMAND

    Root       0.0  0.4 22540   6399 ?S   Apr24  00:46 /sbin/init

    Root       0.0  0.0       0     S   Apr24  00:26 [softirqd]

    root       0.0  0.2 32040 pts/0    R   +15   00:00 ps aux

    ```


    ## 6-1: 使用 aux 参数查看进程


    正如你所看到的，这个命令列出了很多进程，可能会在屏幕底部。一个进程是 init，最后一行就是运行的命令。许多进程 (PID, %CPU, TIME 等) 可能在系统上不同，但具有相同的格式。为了我们的目的，以下是输出中最重要的列：PID
    %CPU。


    在很多情况下，我们想知道哪些进程使用了最多的资源。这就是 top 命令用的地方，因为它显示按使用的资源排序的进程，从最大的开始。与 ps 命令不同，top
    命令每 10 秒动态刷新一次，而 ps 命令只提供进程快。您可以监控和监控所需的进程，如清单 6-3。


    ```

    kali >top

    top -15:31:17 2 days, 50, 4 users, load average: 0.00, 0.04, 0.09

    Tasks: 176 total, 1 running, 175 sleeping, 0 stopped, 0 zombie

    %Cu(s): 1.3 us, 0.7 sy, . ni, 97.4 id, 0.0 wa, 0.0 hi, 0.0 si

    KiB Mem : 1491220 total, 64848 free, 488272 used, 938100 buffer/cache

    KiB Swap : 1046524 total, 1044356 free, 2168 used, 784476 avail

    PID USER PR NI VIRT RES SHR %CPU %MEM TIME+ COMMAND

    39759 root 20 0 893180 247322 11488 S 0.7 16.6 1:47.88 ruby

    39859 root 20 0 27368 0 S 0.3 1.2 1:47:88

    39933 root 20 0 29336 61500 29108 S 0.7 4.1 1:47.88 Xorg

    ```


    清单-6: 查找资源消耗监控的进程


    系统管理员经常在终端中运行，以监控资源的使用。作为一名客户，您也可能想这样做，特别是在您的系统上运行多个任务时。当您运行 top 时，按下 H 键将弹出一个交叉命令列表，J
    键退出 top，您无需再次使用 top 来管理进程的，在下一节“使用 nice 命令改变进程优先”和“终止进程”。


    ## 使用 nice 命令改变进程优先


    在客户的语言中，您不会听到 nice 这个词，但在这里你会听到。nice 命令会影响内核的优先级。正如您在运行 ps 命令时看到的，系统上运行许多任务，它们都在争夺资源的资源。内核对进程的优先级有最终决定权，但是可以使用
    nice 提高进程的优先级。使用 nice 这个术语后的想法是，当您使用它时，您将决定对其他用户有多么“好”；如果您的大部分系统资源，那么就会对其他进程产生影响。


    nice 的范围从 -20 到 19，默认值为 O（见 6-1）。nice 高值为低优先级，nice 低值为高优先级。


    ## 6-2: 过滤特定进程


    为了过滤特定进程，我们可以使用 ps aux 命令然后将其输出传递给 grep，如 msfconsole。


    ```

    kali >ps aux | grep msfconsole

    USER       %CPU %MEM    VSZ   RSS TTY START TIME COMMAND

    root       35.1 15.2 4304 940 pts/2 S+ 15:13 00:00 postgresql

    ```


    从这个列表输出中，你应该看到与 msfconsole 匹配的所有进程。首先 PostgreSQL 是 Metasploit 的数据库，它是来自 /usr/bin/msfconsole
    的程序。你应该找到 msfconsole 的命令，请注意，ps 列由于关键字 msfconsole 不在标题中，不会显示，即使如此结果可能是相同的。从这里你可以了解一些重要信息。如果需要查看
    Metasploit 正在使用多少资源，你可以查看第三列（CPU），并参考第四列查看它使用了多少内存。


