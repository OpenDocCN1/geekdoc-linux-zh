    用户的目录中，该目录位于文件结构顶部（/)的一级目录。


    如果您在另一个目录中，pwd 将返回该目录的登录名称。


    # 使用 whoami 查看登录用户


    在 Linux 中，超级用户或管理员名为 root。它拥有添加用户、更改密码、更改权限所需的所有权限。显然，您不希望任何人有能力进行此类更改；您希望有人信任并且对操作系统足够的理解。作为顾客，您需要拥有所有权限来运行您需要的程序和命令（除非拥有
    root 权限，否则许多用户工具将无法运行由于由于需要 root 用户身份登录。


