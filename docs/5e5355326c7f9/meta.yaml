    如果您好在多个 shell 中运行，或者作为多个账户登录，这将非常有用。不同的 shell 或账户有不同的 \u 和 \h，您可以轻松更改以及和您所处的系统是什么。

    让我们尝试一下，更改一个终端的提示符。例如，您可以输入以下内容：


    ```

