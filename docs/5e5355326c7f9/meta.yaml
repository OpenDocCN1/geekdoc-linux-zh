    ```


    这些字符代表设备输入和输出数据的两种方式。e代表字符，如鼠标，这些设备被字符。通过这些字符(如鼠标或键盘)发送和接收与系统的外部设备就是字符设备。


    b代表块类型设备。它们可以以块(一次多个字符)的形式进行通信，包括硬盘驱动器和 DVD驱动器设备。这些设备需要更大的容量，因此以块(一次多个字符或字节)的形式发送和接收数据。一旦您知道一个设备是字符设备还是块设备，您可以轻松地获得它的更多信息，您将在下文的看到。


