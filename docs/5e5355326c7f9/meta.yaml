    ## 11\n## 日志系统\n### THE LOGGING SYSTEM\n\n对于任何 Linux 用户，了解日志文件的使用是非常重要的。日志文件存储关于操作系统和应用程序运行时发生的事件的信息，包括任何错误和安全警报。您的系统将根据我将在本章中介绍的一系列规则自动记录信息。\n\
    \n作为客户，日志文件可以跟踪目标的活动和身份。但它也可以是你自己在别人系统上活动的追踪。因此，客户需要知道他们可以收集什么信息，以及可以收集关于他们自己的行为和方法的什么信息，以便隐藏证据。\n\
    \n另一方面，任何保护 Linux 系统的人都需要知道如何管理日志记录功能，以确定系统是否受到攻击，然后被破解时发生的事情以及由谁负责。\n\n本章向您展示如何检查和配置日志文件，以及如何删除活动的证据，甚至完全禁用日志记录。首先，我们将查看将执行日志记录的守护进程。\n\
    \n## RSYLOG 日志记录守护进程\n\nLinux 使用名为 syslogd 的守护进程记录计算机的事件。syslog 的变体，包括 rsyslog\
    \ 和 syslog-ng，在 Linux 的不同发行上，尽管操作非常相似，但仍然存在一些细微的差异。Kali Linux是在 Debian 上构建的，并且\
    \ Debian 默认情况下有 rsyslog，我们将在本章重点介绍这个实用程序。如果您想使用其他发行版，那么会有它们的日志系统研究。\n\n让我们看看系统的\
    \ rsyslog。我们将搜索与 rsyslog 相关的所有文件。首先，在 kali 打开一个终端，输入内容：\n\n```bash\nkali >locate\
    \ rsyslog\n/etc/rsyslog.conf\n/etc/default/rsyslog\n/etc/init.d/rsyslog\n/etc/logcheck/ignore.d.server\n\
    /etc/logrotate.d/rsyslog\n/etc/rc0.d/K04rsyslog\n--snip--\n```\n\n如您所见，许多文件都包含关键字\
    \ rsyslog，其中一些文件比其他文件更有用。我们要检查的是配置文件 syslog.conf。\n\n## rsyslog 配置文件\n\n与 Linux\
    \ 的几乎所有应用程序一样，rsyslog 位于/etc 目录下的纯文本配置文件进行管理和配置，这在 Linux 中通常是这样的。对于 rsyslog，配置文件位于/etc/rsyslog.conf。使用任何文本编辑器打开该文件，我们将探索其中的内容（这里）。我使用的是\
    \ Leafpad：\n\n```bash\nkali >leafpad /etc/rsyslog.conf\n```\n\n您应该看到代码如清单 11-1\
    \ 所示的内容：\n\n```text\n/etc/rsyslog.conf configuration file for rsyslog.\n\n# For\
    \ more information see\n# /usr/share/doc/rsyslog-doc/html/rsyslog_conf.html\n\n\
    ################\n#### MODULES ####\n################\n\nmodule(load=\"imuxsock\"\
    ) # provides support for local system logging\nmodule(load=\"imklog\") # provides\
    \ kernel logging support\n#module(load=\"immark\") # provides --MARK-- message\
    \ capability\n\n# provides UDP syslog reception\n#module(load=\"imudp\")\n#input(type=\"\
    imudp\") port=\"514\")\n\n# provides TCP syslog reception\n#module(load=\"imtcp\"\
    )\n#input(type=\"imtcp\") port=\"514\")\n\n################################\n\
    #### GLOBAL DIRECTIVES ####\n################################\n\n清单 11-1: syslog.conf\
    \ 文件的内容\n正如您所看到的，rsyslog.conf 文件有很多文档，其中大量注释解释了它的用法。此时，信息中的大部分对您没有用处，但是如果您忽略到第\
    \ 50 行，您将找到 Rules 部分。在这里，您可以认为 Linux 系统将自动记录的内容设置规则。\n\n日志 记录规则决定记录什么类型的信息，记录哪些程序的日志，以及日志存储在何处。作为管理员，这允许您控制正在记录的日志以及写入位置，滚动到\
    \ 50 行，您将看到类似清单 11-2 的内容。\n\n#################\n#### RULES ####\n#################\n\
    \n# First some standard log files. Log by facility.\n\n```text\nauth,authpriv.*\
    \ /var/log/auth.log\n*.*;none -/var/log/syslog\ncron.* /var/log/cron.log\ndaemon.*\
    \ /var/log/daemon.log\nkern.* /var/log/kern.log\nlpr.* /var/log/lpr.log\nmail.*\
    \ /var/log/mail.log\nuser.* /var/log/user.log\n```\n\n# Logging for the mail system.\
    \ Split it up so that is easy to parse these files.\n\n```text\nmail.info /var/log/mail.info\n\
    mail.warn /var/log/mail.warn\nmail.err /var/log/mail.err\n```\n\n清单 11-2: 在 rsyslog.conf\
    \ 中查找日志规则。每一个都是单独的日志规则，说明记录了哪些消息以及记录到哪里。这些规则的基本格式如下: facility.priority action\n\
    \n```text\nauth,authpriv.* /var/log/auth.log\n*.*;none -/var/log/syslog\ncron.*\
    \ /var/log/cron.log\ndaemon.* /var/log/daemon.log\nkern.* /var/log/kern.log\n\
    lpr.* /var/log/lpr.log\nmail.* /var/log/mail.log\nuser.* /var/log/user.log\n```\n\
    \nfacility 关键字引用记录其消息，例如邮件、内核或打印系统。priority 关键字决定了程序记录种类。action 是文件名以及应该发送日志的位置。星号通符\
    \ (*) 替换所有信息。您可以通过逗号分隔的列表来选择多个优先级系统记录各种消息。代码从最低优先级开始到最高优先级结束。如果优先级为* 则记录所有消息。指定优先级代码为\
    \ alert，系统将记录为警告和更高级的消息，但不会标记为 crit 的消息或任何优先级。这是有效级的完整列表：\n\n```text\n* debug\n\
    * info\n* notice\n* warning\n* warn\n* error\n* err\n* crit\n* alert\n* emerg\n\
    * panic\n```\n\n## 使用 LOGROTATE 自动清理日志\n\n日志文件会占用空间，所以如果不删除它们，它们会填满整个硬盘驱动器。另一方面，如果频繁地删除日志文件，那么在未来的某个时间点就没有日志供索引。您可以使用\
    \ logrotate 通过切割日志来确定这些符合需求之间的平衡。\n\nlogrotate 是通过将日志文件移动到其他位置定期归档日志文件的过程，从而为您留下一个新的日志文件。然后，在指定的一段时间后，归档的位置将被清理。\n\
    \n您的系统已经在使用 logrotate 实用程序的 cron 作切割日志文件。您可以配置 logrotate 实用程序，使用 /etc/logrotate.conf\
    \ 文件来选择日志备份的轮律。让我们用文本编辑器打开它看看：\n\n```bash\nkali ~leafpad /etc/logrotate.conf\n\
    ```\n\n您应该看到如下清单 11-3 显示的内容：\n\n```text\n# see man logrotate for details\n\nrotate\
    \ log files weekly\n1 weekly\nkeep 4 weeks worth of backlogs\nrotate 4\n\n3 create\
    \ new (empty) log files after rotating old ones\ncreate\n\n4 # uncomment this\
    \ if you want your log files compressed\ncompress\n\npackages drop rotation information\
    \ into this directory\ninclude /etc/logrotate.d\n\n# no packages owning wtmp,\
    \ or btmp -- we'll rotate them here\n/var/log/wtmp\n{\n  missingok\n  monthly\n\
    \  create 0664 root utmp\n}\n```\n\n# rotate 1\n\n清单 11-3: logrotate 配置文件\n\n\
    第一，你可以设置单位数字 ①。这里的值是 weekly，意味着 rotate 之后的数字都是 weeks（周）。进一步向下，你可以看到设置切割日志的频率为四个\
    \ ②。这个默认对于大多数应用都适用，但是如果您想让日志长一些以便进行调查，或者短一些以便更快清理，那么您应该更改设置。例如，如果您每周检查日志并希望节省空间，可以将设置为\
    \ rotate 1。如果您的日志足够的空间，并且希望保留记录以便以后分析，那么可以设置为 rotate 2。默认情况下，创建一个新的日志作为旧日志 ③。在每个日志周期结束，将重命名日志并在新的日志文件中移动到末尾，例如\
    \ /var/log/auth.log 变为 /var/log/auth.1，var/log/auth.2，以此类推。您可以使用 locate 命令查找 /var/log/auth.log\
    \ 并使用通配符，如下所示：\n\n```bash\nkali >locate /var/log/auth.*\n/var/log/auth.1\n/var/log/auth.2\n\
    /var/log/auth.3\n/var/log/auth.4\n```\n\n## 保护自身\n\n一旦您破坏了 Linux 系统，使用日志备份并删除日志可以减少被检测到的机会。有很多方法可以做到，每种方法都有风险和可靠性。\n\
    \n# 删除日志\n\n首先，您需要删除任何日志。您可以简单地打开日志文件并使用第二章学习的删除技术进行准确删除。然而，这可能会耗时，并在日志文件中留下时间间隔看起来很可疑。此外，删除的文件可以通过专业的取证调查恢复。\n\
    \n更好、更安全的解决方案是分解文件。对于删除系统，取证员仍然可以恢复已删除的文件，但是有一种方法可以删除文件并多次覆盖，使得恢复更加困难。幸运的是，Linux\
    \ 下有一个内部命令名为 shred，正是为了这个目的。\n\n要了解 shred 命令是如何操作的，请输入命令查看帮助：\n\n```bash\nkali\
    \ >shred --help\n\nUsage: shred [OPTION]...FILE...\n\nOverwrite the specified\
    \ FILE(s) repeatedly in order to make it harder for hardware to recover data\n\
    ```\n\n从屏幕的完整输出可以看到，shred 命令有许多选项。它最基本的形式是简单的：\n\n```bash\nshred <FILE>\n```\n\
    \n就此而言，shred 会删除文件并多次覆盖——默认情况下，shred 会覆盖 4 次。通常，文件被覆盖的次数越多，恢复越困难，但是请记住，每次覆盖都需要时间，对于非常大的文件，碎片可能会耗时；可能包括两个选项：一个是\
    \ -f 选项，它更改文件的权限，在需要更改权限时允许覆盖；另一个是 -n 选项，它允许你选择覆盖文件的次数。例如，我们将使用以下命令将 /var/log/auth.log\
    \ 中的日志文件分解 10 次：\n\n```bash\nkali >shred -f -n 10 /var/log/auth.*\n```\n\n我们需要某些选项来允许碎片化\
    \ auth 文件，然后按照 -n 指定要覆盖的次数。在我们要碎片化的文件路径之后，包含通配符星号，因此不需要碎片化 auth 文件，还要覆盖 logrotate\
    \ 创建的旧日志，如 auth.log.1, auth.log.2，以此类：\n\n现在尝试打开一个日志文件：\n\n```bash\nkali >leaf\
    \ /var/log/auth.log\n```\n\n您打开一个文件，您将看到的内容是凌乱的，如图 11-1 所示。\n\n图 11-1：覆盖的日志文件\n\
    \n现在，如果工程师或取证员检查日志文件，他们将发现没有任何用处，因为没有一个是可恢复的！\n\n## 禁用日志记录\n\n其他覆盖跟踪的选项是禁用日志记录。当黑客控制了一个系统，他们可以立即禁用日志，以防止系统追踪他们的活动。当然，这需要\
    \ root 权限。\n\n要禁用所有日志记录，黑客只需停止 syslog 守护。停止 Linux 中的任何服务使用相同的语法，如下示所示（您将在第 2 章中看到更多）：\n\
    \n```\nservice servicename start|stop|restart\n```\n\n因此，停止日志守护，只需输入以下命令：\n\n\
    ```bash\nkali >service syslog stop\n```\n\n现在 Linux 将停止任何日志文件，直到重新重启，这样您能够在日志文件中不留下任何证据。\n\
    \n# 总结\n\n日志文件几乎记录了 Linux 系统上发生的所有事情。在分析发生了什么，无论是因为故障还是黑客攻击，它们都是非常贵的资源。对于黑客来说，日志文件可以作为他们活动和身份的证据。然而，精明的黑客可以删除和覆盖这些文件，并完全禁用日志记录，因此不会留下任何证据。\n\
    \n# 练习\n\n在进行学习第 12 章之前，通过完成以下练习来尝试从这一章中学到的技能：\n\n- 1. 使用 locate 命令查找所有 syslog。\n\
    - 2. 打开 logrotate.conf 文件，将日志旋转时间更改为一周。\n- 3. 禁用系统的登录。研究禁用日志时文件/var/log/syslog\
    \ 中记录了什么。\n- 4. 使用 shred 命令分解并删除所有日志文件。\n"
