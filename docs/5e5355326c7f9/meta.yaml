  md: '# 介绍术语和概念


    在开始我们的客户 Linux 基础知识世界之旅之前，我想介绍几个术语，这些术语应该涵盖本章后面讨论的一些概念。


    二进制文件此术语是指执行的，类似于 Windows 中的可执行文件。二进制文件通常位于/usr/bin或/sbin 目录中，包括 ps、cat 等实用程序（我们将在本章中介绍四个）以及无界面用户程序使用
    ipt cracking 和入侵检测系统 (IDS)。


    区分分区与 Windows 不同，Linux 分区不同。这意味着 Desktop 和 desktop 不同，DeskTop 不同。每个节点代表的目录名称。许多来自
    Windows 的人都会发现这令人困惑。如果您收到错误消息“找不到文件或目录（file or directory not found）”，并且确定文件或目录存在，则可能需要检查您的输入。


    目录与文件的命名相同。目录提供了一种组织文件的方式，通常采用树形方法。


    Home 每个用户都有自己的 home 目录，这是默认认为保存您创建的文件的位置。使用 Kali Linux: 2018 年 4 月发行。


    Kali Linux 是专门为渗透测试设计的 Linux发行，它预装了数百个工具，可以节省自己下载和安装所需的时间。在编写文档时，我们将使用最新的 Kali。


    Root 与其他操作系统不同，Linux 拥有管理员账户，专门用于执行所有操作。这包括重置系统、添加用户和密码等等。在 Linux 中，该帐户名为 root。作为管理员或测试者，您通常会使用
    root 账户来控制系统。实际上，许多客户工具要求您使用 root 账户。


    脚本是在解释器环境中运行的一系列命令，可将字符转换为源代码。许多客户工具都是脚本。许多客户可以使用任何脚本解释器运行，例如 Python、Perl 或 Ruby。Python
    是当前客户最受欢迎的解释器。


    Shell 是 Linux 运行环境中的语言和解释器。最广泛使用的是 bash。它代表 BourneAgain shell，而其他的包括 C 和 Z shell。我将在本书中使用
    bash。


    终端(Terminal)是命令行界面 (CLI)。


    有了这些基础知识，我们将尝试不加强化为成为客户或渗透测试人员的基础 Linux 技术。在这一章中，我将引导您使用 Kali Linux。


    # KALI 之之旅


    一旦启动 Kali，你就会看到第一个登录界面，如图 1 所示。使用 root 账户和默认密码登录。'
