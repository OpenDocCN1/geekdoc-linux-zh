    ## 安装 VirtualBox


    您可以从 [https://www.virtualbox.org/] 下载 VirtualBox。如图 1 所示，点击左侧菜单中的“下载”（Download），并为您的计算机选择操作系统。选择
    VirtualBox 安装，此操作将创建一个虚拟机 VM，请务必下载最新版本。


    ![](img/77055846b6e5bd43c939d5fb384e34d6_12_0.png)


    下载完成后，单击 `setup` 文件，您将看到熟悉的安装向导，如图 2 所示。


    ![](img/77055846b6e5bd43c939d5fb384e34d6_12_1.png)


    单击 **Next**（下一步），将看到自定义安装设置屏幕，如图 3 所示。


    ### Oracle VM VirtualBox 5.2.16 Setup


    Custom Setup（自定义设置）

    选择您希望安装功能的方式。


    点击下方树列表中的图标可以更改将安装的功能。


    | | VirtualBox Application | Oracle VM VirtualBox 5.2.16 application. |

    |---|---|---|

    | | VirtualBox USB Support | 此功能需要 35KB 硬盘空间。已勾选 3 个子功能中的 2 个。这些子功能为您释放了 40KB
    空间…… |

    | VirtualBox Networking | | |

    | VirtualBox Bridge | | |

    | VirtualBox Host-Only | | |


    Location: C:\Program Files\Oracle\VirtualBox\


    5.2.16 < Back Next > Cancel


    图 3: 自定义设置对话框


    在此屏幕上，只需点击 **Next**。继续点击 **Next**，直到到达网络接口配置屏幕，然后点击 **Yes**。


    单击 **Install**（安装）开始此安装过程。在此过程中，可能会多次提示您安装虚拟设备软件。这些是虚拟机通信所需的虚拟设备网络。

    安装完成后，单击 **Finish**（完成）。


    ## 设置虚拟机


    现在让我们开始使用虚拟机。虚拟机在安装后应该会自动打开——如果没有，请手动打开它。您应该看到 VirtualBox Manager 的欢迎界面，如图 4 所示。


    ![](img/77055846b6e5bd43c939d5fb384e34d6_13_0.png)


    图 4: VirtualBox Manager


    由于我们将使用 Kali Linux 镜像创建虚拟机，请点击左上角的“**New**”（新建）。这将打开图 5 所示的 **Virtual Machine**（虚拟机）对话框。


    ![](img/77055846b6e5bd43c939d5fb384e34d6_14_0.png)


    图 5: Create Virtual Machine 对话框


    为您的虚拟机命名（名称均可，此处我使用 Kali），然后从 **Type**（类型）下拉菜单中选择 **Linux**。最后，从第三个下拉菜单选择 **Debian
    (64bit)**（除非您使用的是 32 位版本的 Kali，此时请选择 Debian 32bit 版本）。单击 **Next**，您将看到图 6 所示的屏幕。


    ![](img/77055846b6e5bd43c939d5fb384e34d6_14_1.png)


    图 6: 分配内存


    在这里，您需要为虚拟机分配多少 RAM。


    根据经验，我不建议使用超过系统内存 RAM 的 25%。这意味着如果您在物理系统（主机）上安装了 4GB 内存，则为虚拟机选择 1GB；如果物理系统只有 16GB，则选择
    4GB。您为虚拟机分配的 RAM 越多，运行速度就越快。速度越快，您越需要为主主机操作系统以及可能同时运行的其他虚拟机留出足够的 RAM。当您不运行此虚拟机时，它们不会占用任何
    RAM，但会占用硬盘空间。


    单击 **Next**，您将看到硬盘屏幕。选择“**Create Virtual Hard Disk**”（创建虚拟硬盘），单击“**Create**”。


    在下一个屏幕中，您可以决定创建的硬盘空间是“动态”还是“固定”。如果选择动态分配，系统只有在需要时才会占用指定的硬盘空间，这可以为主主机节省更多未使用的空间。我建议您选择动态分配。单击
    **Next**，选择分配 VM 的硬盘空间（见图 7）。


    ![](img/77055846b6e5bd43c939d5fb384e34d6_15_0.png)


    图 7: 分配硬盘空间


    默认为 8GB。我通常认为这太小，建议至少分配 20-25GB。请记住，如果您选择动态分配，系统只有在需要时才会使用该空间，且之后扩展空间可能会比较麻烦，建议选择足够的空间。单击
    **Create**，就可以开始了！


    ## 在 VM 上安装 Kali


    此时您应该看到图 8 所示的屏幕。现在需要安装 Kali。请注意，在 VirtualBox 左侧显示 VM 处于关闭状态。单击 **Start**（启动）按钮（绿色箭头）。


    ![](img/77055846b6e5bd43c939d5fb384e34d6_16_0.png)


    图 8: VirtualBox 欢迎屏幕


    然后，VirtualBox 将询问从哪里启动。您已经下载了扩展名为 `.iso` 的磁盘镜像，它位于您的 Downloads 文件夹中。单击右侧导航到 Downloads
    文件夹，然后选择 Kali 镜像（参见图 9）。


    ## 设置 KALI


    然后单击 **Start**。恭喜，您刚刚在虚拟机上启动了！


    Kali 现在将打开图 10 所示的屏幕，提供多种启动选项。我建议初学者使用图形安装（Graphical install）。选择键盘布局。


    如果在 VirtualBox 安装 Kali 时出现错误，可能是因为您没有在硬件 BIOS 中启用虚拟化。每个系统的 BIOS 略有不同。此外，在 Windows
    系统上，您可能需要禁用任何虚拟化软件（如 Hyper-V）。同样，您的 BIOS 应该引导您这样做。


    ![](img/77055846b6e5bd43c939d5fb384e34d6_17_0.png)


    ![](img/77055846b6e5bd43c939d5fb384e34d6_18_0.png)


    图 10: 选择启动方法


    接下来要求您选择语言。确保选择合适的语言，然后点击 **Continue**。下一步选择您的位置，单击 **Continue**。然后选择键盘布局。单击 **Continue**，Kali
    将执行硬件检测。请耐心等待。最终，您将看到图 11 所示的网络配置屏幕。


    ![](img/77055846b6e5bd43c939d5fb384e34d6_19_0.png)


    图 11: 输入主机名


    要求主机主机。您可以随意命名，我们使用“kali”。接下来要求输入域名。这里没有必要输入任何内容。单击 **Continue**。


    ## 设置用户和密码 (Set up users and passwords)


    您需要为 ''root'' 设置密码。恶意获取 root 权限会导致灾难性结果，因此您应该选择一个不容易猜到的密码；它不应该是字典单词或容易关联的词。一个好的密码应该包含字母、数字和符号，并应该定期更改。


    root 用户不应该留空密码。如果您留空，root 账户将被禁用，系统的初始用户将获得使用 `sudo` 命令获取 root 权限。请注意，您将需要输入密码以验证输入是否正确。


    Root password:

