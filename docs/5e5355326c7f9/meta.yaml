    ## sources.list


    ```bash

    deb deb http://http.kali.org/kali kali-rolling main contrib non-free

    # For source package access, uncomment the following line

    # deb-src http://http.kali.org/kali kali-rolling main contrib non-free

    deb deb http://http.kali.org/kali kali-rolling main non-free contrib

    # For source package access, uncommenting the following line

    # deb-src http://http.kali.org/kali kali-rolling main non-free contrib

    ```


    图 4-1:source.list 中 Kali 的默认种类


    许多 Linux 发行版将存储库划分为不同的类。例如，Ubuntu 将其存储库分类为如下：


    - main 包含支持的源软件

    - universe 社区维护的源软件

    - multiverse 使用开源许可权或受法律问题限制的软件

    - restricted 包含特殊设备的驱动

    - backports 来自旧版本的包


    我不建议在 sources.list 中使用测试、实验性或稳定的库，因为下载未经测试的软件包可能会破坏系统。当您需要下载一个新的软件时，修改 sources.list
    文件并在列表中添加存储库的名称，然后保存文件。首先检查存储库是否与系统兼容，Kali 也是在 Debian 上构建的，所以这些存储库运行良好。如果您想在 Kali
    上安装 Oracle Java 8，Kali 的源代码并不适用于 Oracle Java。您需要将存储库添加到 sources.list 中，以添加必要的存储库：


    ```

    deb http://ppa.launchpad.net/webd8team/java trusty main

    deb-src http://ppa.launchpad.net/webd8team/java precise main

    ```


    ## 使用 GUI 安装程序


    Kali 的旧版本不再包含基于 GUI 的工具，但是您可以使用 apt-get 命令来安装。最常见的两种 GUI 安装工具是 Synaptic 和 Gdebi。让我们安装
    Synaptic 并使用它来安装：


    ```bash

    apt-get install synaptic

    ```

    Reading package lists...

