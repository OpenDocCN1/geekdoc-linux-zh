  md: "# 使用 LOGROTATE 自动清理日志\n\n日志文件会占用空间，所以如果不删除它们，它们最终会填满整个硬盘驱动器。另一方面，如果频繁地删除日志文件，那么在未来的某个时间点就没有日志供索引了。您可以使用\
    \ logrotate 通过切割日志来确定这些符合相反需求之间的平衡。\n\nlogrotate 是通过将日志文件移动到其他位置定期归档日志文件的过程，从而为您留下一个新的日志文件。然后，在指定的一段时间后，归档的位置将被清理。\n\
    \n您的系统已经在使用 logrotate 实用程序的 cron作业切割日志文件。您可以配置 logrotate 实用程序，使用 /etc/logrotate.conf\
    \ 文件来选择日志备份的轮律。让我们用文本编辑器打开它看看：\n\n```\nkali ~leafpad /etc/logrotate.conf\n```\n\
    \n您应该看到如下清单 11-3 显示的内容：\n\n```\n# see man logrotate for details\n\nrotate log\
    \ files weekly\n1 weekly\nnkeep 4 weeks worth of backlogs\n2 rotate 4\n\n3 create\
    \ new (empty) log files after rotating old ones\ncreate\n\n4 # uncomment this\
    \ if you want your log files compressed\ncompress\n\npackages drop rotation information\
    \ into this directory\ninclude /etc/logrotate.d\n\n# no packages owning wtmp,\
    \ or btmp -- we'll rotate them here\n/var/log/wtmp\n{\n  missingok\n  monthly\n\
    \  create 0664 root utmp\n```"
  merge: -1
