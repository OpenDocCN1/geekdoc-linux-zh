    这里的 Wi-Fi 接口显示为wlan0 ①。在 Kali Linux 中，Wi-Fi 接口通常被指定为wlanX，X 代表该接口的编号。换句话说，系统的第一个
    Wi-Fi适配器将标记为wlan0，第二个是wlan1，以此类推。


    如果你只想查看 Wi-Fi 接口及其统计数据，Linux有一个 ifconfig 类似但专门用于无线的特定命令。这个命令是 iwconfig。输入时，仅显示无线接口及其关键数据:


    ```

