    如果你有一组两个不同的缩进的行为，为了让 Python 识别这些代码是一致的，你必须在整个代码块内统一使用两个缩进。这和其他编程语言编写原本有所不同，其他编程格式是可选的最佳实践，但不是必要的。你将在教学中注意到这一点，这是你要时刻记住的！


