    | sdd | 第四 SATA 硬盘驱动 |


    # 硬盘分区


    一些驱动器可以划分为多个分区，以便管理和分离数据。例如，您可能想要将硬盘驱动分开，以便交换文件、目录和/目录位于单独的分区上——这样做有很多原因，包括许多共享资源和宽松权限限制。


    Linux 在每个驱动器的名称前面都加上一次数字编号。这样，第一个 SATA 驱动器上的第一个分区就是 sda1。第二个分区是 sda2，第三个是 sda3，以此类推，如表
    10-2所示。


    表 10-2:分区标识


    | |描述 |

    |---|---|n| sda1 | 第一个(a)驱动器的第一个分区(1) |

    | sda2 | 在第一个(a)驱动器的第二个分区(2) |

    | sda3 | 在第一个(a)驱动器的第三个分区(3) |

    | sda4 | 在第一个(a)驱动器的第四个分区(4) |


    有时，您可能希望查看 Linux 系统的分区，可以查看您拥有哪些分区以及每个分区中有多少容量。您可以通过使用 fdisk 程序来实现这一点。使用带有 fdisk
    -l 参数列出所有驱动器的所有分区，如表 10-2所示。


    ```

    kali > fdisk -l Disk /dev/sda: 20GiB, 2147483680 bytes, 4194304 sectors

    ```'
