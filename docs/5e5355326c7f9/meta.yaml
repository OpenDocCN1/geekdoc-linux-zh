    然后我们询问用户密码列表的路径。通过终端终端输入 locate wordlist。你可以在 kali linux 中找到多字典列表。


    然后，我们开始尝试密码，该密码将使用用户提供的密码列表尝试破解用户名的密码。


    注意，我们使用了一个新的 strip()的 Python 函数。此函数会移除字符串的第一个和最后一个字符（在这里是密码列表）。如果密码列表中的密码前面有空格或符号，就需要执行此操作。strip()函数的作用是：删除这些字符，只留下空白的字符串。否则，可能会得到一个假命中。


    然后，我们使用第二个 decode()的密码。在这里，我们首先使用 ftplib 连接到用户提供的 IP 地址的服务器，然后从账户的密码列表中尝试一个密码。


    如果用户名和密码的组合导致失败，密码将会跳转到 exit 0，在该密码中打印 still trying，然后返回到密码列表中取下一个密码。


