    \n您应该看到如下清单 11-3 显示的内容：\n\n```text\n# 详情见 man logrotate\n\n每周滚动日志\n1 weekly\n\
    保留4周的日志\nrotate 4\n\n滚动旧日志后创建新的（空的）日志文件\ncreate\n\n# 如果你想压缩日志文件\ncompress\n\n\
    将旋转信息放入此目录\ninclude /etc/logrotate.d\n\n# 没有拥有 wtmp 或 btmp 的包——我们在这里滚动它们\n/var/log/wtmp\n\
    {\n  missingok\n  monthly\n  create 0664 root utmp\n}\n```\n\n# rotate 1\n\n清单\
    \ 11-3: logrotate 配置文件\n\n第一，你可以设置单位数字 ①。这里的值是 weekly，意味着 rotate 之后的数字都是周。进一步向下，你可以看到设置切割日志的频率\
    \ ②。这个默认对于大多数应用都适用，但是如果您想让日志长一些以便进行调查，或者短一些以便更快清理，那么应该更改设置。例如，如果您每周检查日志并希望节省空间，可以将设置为\
    \ rotate 1。如果您的日志空间足够且希望保留记录以便以后分析，那么可以设置为 rotate 2。默认情况下，创建一个新的日志作为旧日志 ③。在每个日志周期结束，将重命名日志并移动到末尾，例如\
    \ /var/log/auth.log 变为 /var/log/auth.1，var/log/auth.2，以此类推。您可以使用 locate 命令查找 /var/log/auth.log\
    \ 并使用通配符，如下所示：\n\n```bash\nkali >locate /var/log/auth.*\n/var/log/auth.1\n/var/log/auth.2\n\
    /var/log/auth.3\n/var/log/auth.4\n```\n\n## 保护自身\n\n一旦您破坏了 Linux 系统，使用日志备份并删除日志可以减少被检测到的机会。有很多方法可以做到，每种方法都有风险和可靠性。\n\
    \n# 删除日志\n\n首先，你需要删除任何日志。您可以简单地打开日志文件并使用第二章学习的删除技术进行准确删除。然而，这可能会耗时，并在日志文件中留下看起来很可疑的时间间隔。此外，删除的文件可以通过专业的取证调查恢复。\n\
    \n更好更安全的解决方案是分解文件。对于删除系统，取证员仍然可以恢复已删除的文件，但是有一种方法可以删除文件并多次覆盖，使得恢复更加困难。幸运的是，Linux\
    \ 下有一个内部命令名为 shred，正是为了这个目的。\n\n要了解 shred 命令，请输入命令查看帮助：\n\n```text\nshred [OPTION]...\n\
    \n多次覆盖文件以使其更难恢复\n\n选项：\n  -n, --iterations=ITERATIONS  覆盖次数（默认为 3）\n-u, --remove\
    \            覆盖后删除文件\n-v, --verbose           显示进度\n-z, --zero              在最后一次用零覆盖以隐藏覆盖次数\n\
    ```\n\n为了 shred 覆盖，多次 10 次：\n\n```bash\nkali >shred -f -n 10 /var/log/auth.*\n\
    ```\n\n## 禁用日志记录\n\n当黑客控制了一个系统，他们可以立即禁用日志，以防止追踪追踪活动。当然，这需要 root 权限。\n\n要禁用所有日志，黑客只需停止\
    \ syslog。停止 Linux 中的任何服务使用相同的语法，如下所示：\n\n```\nservice servicename start|stop|restart\n\
    ```\n\n因此，停止日志守护，只需以下命令：\n\n```bash\nkali >service syslog stop\n```\n\n现在 Linux\
    \ 将停止任何日志文件，直到重新重启，这样您可以在日志文件中不留下任何证据。\n\n# 总结\n\n日志文件几乎记录了 Linux 系统上发生的所有事情。在分析发生了什么，无论是因为故障还是黑客攻击，它们都是非常贵的资源。对于黑客来说，日志文件可以作为他们活动和身份的证据。然而，精明的黑客可以删除和覆盖这些文件，并完全禁用日志记录，因此不会留下任何证据。\n\
    \n# 练习\n\n在进行学习第 12 章之前，通过完成以下练习来尝试从这一章中学到的技能：\n\n- 1. 使用 locate 命令查找所有 syslog。\n\
