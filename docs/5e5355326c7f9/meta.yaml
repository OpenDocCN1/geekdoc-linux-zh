    IP 地址，因为我们需要从用户那里获取该输入。

    - 我们可以读取后剩余的变量，我们想要存储它们。这个命令将把用户的 IP 地址放入变量 FirstIP 中。然后我们可以在脚本中使用 FirstIP。

    - 我们将相同的变量命名为 LastOctIP ③ 和 port ② 通过用户询问输入信息，然后使用一个命令来捕获。


    接下来，我们会在脚本中使用 nmap 命令，创建和填充变量。要使用存储在变量中的值，只需在变量后面加上。例如在 $port 中，所以我们将使用它来扫描一系列
    IP 地址，从用户输入的一个 IP 地址输入变量开始，并查找用户指定的特定端口。我们使用变量代替端口来扫描，使用端口来扫描什么。重定向符号 (>) 告诉符
    nmap 输出（通常显示在屏幕上）转到 /dev/null (/dev/null 只是一个输出的地方，让它消失）。然后，我们将以 grep 格式另名为 MySQLscan
    的文件。


    下一行与我们的简单扫描器相同：输出 MySQLscan 的文件的内容，将其发送到 grep，在那里包含关键字的行进行过滤，然后将该输出另名为 MySQL2
    的新文件 ⑤，最后，我们打印显示 MySQL2 文件内容


    如果一切正常，此脚本将从第一个 IP 地址到最后一个 IP 地址，然后搜索输入端口，然后只使用指定端口打开的 IP 地址运行报告。我们将此文件保存为 MySQLscannerAdvanced，记住给其执行权限。


