    x 意味着它们可以执行（或运行）文件或目录。如果使用横线（--替换 r、w 或 x，则未给出的相应的权限。请注意，用户只能执行二进制文件或副本的权限。


    让我们使用清单 5-1 中的三输出作为示例：


    ```

    -rw-r--r--  1  root  3368504 June 28 2018 hashcat.hcstat

