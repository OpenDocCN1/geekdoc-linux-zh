    # 使用 nice 命令改变进程优先


    在顾客的语言中，您不会听到 nice 这个词，但在这里你会听到。nice 命令会影响内核的优先级。正如您在运行 ps 命令时看到的，系统上运行时运行许多任务，它们都在争夺资源的资源。内核对进程的优先级有最终决定权，但是可以使用
    nice 提高进程的优先级。


    使用 nice 这个术语后的想法是，当您使用它时，您将决定对其他用户有多么“好”；如果您的大部分系统资源，那么就会对其他进程产生影响。


    nice 的范围从 -20 到 19，默认值为 O（见图 6-1）。nice 高值为低优先级，nice 低值为高优先级（当您'
