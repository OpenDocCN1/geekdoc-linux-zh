    如你所示，modinfo 命令显示了此内核模块的信息，这是在系统上安装蓝牙所必需的。请注意，在很多事情中，列出的模块依赖项：rkfill和crc16。依赖项是必须安装的模块才能蓝牙模块正常运行。


    通常，在排除特定设备无法正常工作的原因时，这些是有用的。除了注意依赖项之外，还可以获取内核版本和模块开发内核版本的信息，然后确保它们与你运行的版本匹配。


    # modprobe 添加和删除模块


    Linux 的多数版本，包括 Kali Linux，都包含在 LKM 管理的 modprobe 命令中。要将模块添加到内核，可以使用 modprobe 命令
    -a (add) 选项，如下所示：


    ```

    kali modprobe -a <module> name

    ```


    如果要移除模块，使用 modprobe -r 选项，并在之后加入模块名称：


    ```

    kali modprobe -r <module> to be removed

    ```


    使用 modprobe而不是 insmod 的主要点是 modprobe 了解依赖项，选项以及安装和删除过程，并且在进行更改之前会考虑这些因素。因此，使用
    modprobe 添加和删除内核模块更容易，更安全。


    # 插入和删除内核模块


    让我们尝试插入和移除模块，帮助你熟悉此过程。让我们设想一下，你刚刚安装了一个新的内核，并且为了它加载驱动程序。记住，驱动程序通常直接加载在内核中，以便它们为它们提供正确的权限。这也是需要检查内核
    root 或者内核是否为驱动提供了足够的磁盘。


    我们假设要在演示中添加一个（实际不需要执行该命令），我们要添加一个名为 HackersAriseNewVideo的视频模块。你可以通过输入以下内容将其添加到内核中：


    ```

    kali modprobe -a HackersAriseNewVideo

    ```


    测试模块是否正确加载，你可以通过运行 dmesg 命令来，该命令在内核中输出缓冲区，之后“video”内容，并查找任何指示的警告：


    ```

    kali dmesg video

    ```'
