  md: '# 什么是道德黑客?


    年来随着信息安全领域的发展，道德黑客也出现了迅猛的发展，也被称为白帽黑客。道德客户是通过渗透和利用一个系统，找出其漏洞并更好地保护它的实践方法。我将道德黑客分为两个主要部分：为了合法信息安全而进行渗透测试，以及为了国家的军事或情报机构。两者都是快速增长的领域，需要增强。


    # 渗透测试


    随着组织越发注重安全性且安全漏洞的成本呈指数级增长，许多大型组织将安全服务外包出去。其中一项关键安全服务就是渗透测试。渗透测试本质是一个合法的、受委托的黑客行为，以证明公司的网络和系统的薄弱性。


    通常，组织首先进行漏洞评估，发现其网络、操作系统中的潜在漏洞。我强调是潜在的，因为为了此漏洞包含大量噪音（确定漏洞的事实并非如此）。渗透人员的角色是破解或渗透这些漏洞。只有这样，组织才能知道漏洞是否真实，并决定投入时间和金钱来弥补。


    # 军事和网络活动


    现在，世界上几乎每一个国家都在进行网络活动和网络竞争。人们只需要浏览一下头新闻，就会发现网络活动是监控和攻击军事和工业体系的选择。


    黑客在这些军事和情报收集活动中起着至关的作用，随着时间的推移，这种情况才会更加真实。想象一下未来的战争，黑客可以获得对手的操作计划，破坏他们的电电、油厂和供水系统。这些活动现在每天都在进行。因此，黑客成为国家防御的关键组成部分。'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# 为什么骇客使用 LINUX


    为什么骇客使用 Linux 而不是其他操作系统呢？主要是因为 Linux 通过几种不同的方法提供了更高级别的控制。",


    # Linux 是开源的


    与 Windows 不同，Linux 是开源的，这意味着您可以使用操作系统的代码。因此，您可以随意更改和操作它。如果您试图使用它以其他的方式运行，那么能够操作代码是必不可少的。",


    # Linux 是透明的


    要进行有效的骇客攻击，您必须理解并理解的操作系统，并在很大程度上了解攻击的操作系统。Linux 完全透明，您可以查看和操作它的每一个部分。",


    Windows 则不费力让它变得越难以理解操作系统的内部工作方式，或许你永远不会知道“幕后”会发生什么，在 Linux 中，你会直接看到操作系统的每一个节点。这使得使用
    Linux 更加有效。",


    # Linux 提供层级控制


    Linux 是细粒度的。这意味着您对系统几乎无限的控制权。在 Windows 中，你只能控制 Microsoft 允许任何的内容。在 Linux 中，你可以完全由地控制，无论在最小的级别或最宏的级别。此外，Linux
    允许任何语言的脚本编写简单高效。",


    # 许多骇客工具都是 Linux 编写的


    超过 90% 的骇客工具都是 Linux 编写的。虽然也有例外，如 Cain 和 Aibel 以及 Wikto。这些例子证明了这一规律，即使是在 Windows
    迁移诸如 Metploit 或 nmap 等骇客时，并非所有功能都能从 Linux 迁移。


    # 未来Linux/Unix


    这似乎是一个激进的结论，但我认为未来的 Linux 和 Unix 系统。微软在 20 世纪 80 年代和 90 年代风光一时，但在增长的停止后逐渐衰落。


    自互联诞生以来，由于它的稳定性、可靠性和稳健性，Linux / Unix 是 Web 服务器的首选操作系统。在今天，Linux 在三分之二的 Web 服务器中占据市场主导地位。路由器、交换机和其他硬件设备的嵌入式系统总是
    Linux 内核，虚拟化世界由 Linux 主导，VMware 和 Citrix 基于 Linux内核。


    超过 80% 的移动设备使用 Unix 或 Unix (iOS 是 Android)。如果你认为计算机的未来是在平板电脑和手机设备上（否则将争辩），那么未来就是
    Linux / Unix。微软 Windows 仅占购物市场的 7%。


    +   * 2019 年 1 月 1 日微软通过自己的官方博客宣布支持 Win10，在 2019 年 12 月结束支持。",'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# # 下载 KALI LINUX


    在开始之前，您需要下载并在计算机上安装 Kali Linux。我们将在本书中介绍 Kali Linux 发行。Linux 最初由 Torvalds 在 1991
    年发表，作为 Unix 的替代品。它是基于 Unix 的内核，由志愿者开发人员对内核、实用程序和应用程序进行改进的。这意味着没有一个属于它自己的实体实体来监督它的发展，通常遵循着公约和标准。


    Kali 由 Offensive Security 发，是一个基于 Linux 的桌面操作系统发行版。Linux 有很多发行版，而 Debian 也是最好的发行版之一。您可能最熟悉
    Ubuntu 作为 Linux 的桌面界面。Ubuntu 也是 Debian 的衍生。它的发行版包括 Red Hat、CentOS、Mint、Arch 和
    Solution。虽然它们共享相同的 Linux 内核（控制 CPU、RAM），但每个内部都有自己的实用程序、应用程序和用于不同的图形界面（GNOME、KDE
    等）。这些发行版中的每一个外观和感觉略有不同。Kali 专门为渗透测试人员研究设计，并配备了各种测试工具。


    我建议您在安装之前使用其他发行版来测试我使用的各种工具。这可以为您花费一些小时来下载和安装。例如，如果该发行版是基于 Debian 构建的，则会在其他一些细微差别。你可以从
    https://kali.org/下载 安装 Kali。


    在主页，点击顶部“下载”链接，在 Kali Downloads 页面上，您将面对多种选择。选择合适的下载。在左侧，您会看到镜像，这个链就是我们要下载的名称。例如，我们看到的镜像名称是
    Kali 64 位。这意味着它是为您的设计的。大多数现代系统使用 64 位 Intel 或 AMD CPU。选择适合您的系统类型，例如控制面板和安全系统，或者列出该系统信息，点击下载并安装
    Kali（可能是 Light 或 Large，或者其他替代方案）。


    如果您的是具有 32 位 CPU 的计算机，则需要安装 32 位版本，这将显示在页面上。


    您可以通过 HTTP 或 Torrent 文件下载。如果 Kali 将直接下载到您的系统，它将它放置在您的下载文件中。Torrent (bt) 是许多网站共享的
    P2 下载。您需要 BitTorrent 这种种子的程序来进行。然后，Kali 文件将下载到 Torrent 应用程序程序存储它的文件中。


    还有其他类型的 CPU 的其他版本，在许多移动设备中常见的 ARM 架构系统。如果您使用的是树莓派、平板电脑或其他移动设备（手机用户可以查看 Kali Linux），请确保下载并安装
    Kali ARM 架构版本的 Kali。


    您已经下载了 Kali，在安装软件之前，我想谈谈虚拟机。对于对于初学者来说，将 Kali 安装到虚拟机是学习和练习的最佳方案。


    # 虚拟机


    虚拟机 (VM) 技术允许您在笔记本电脑或台式机硬件上运行多个操作系统。这意味着您可以继续运行您熟悉的 Windows 或 macOS 操作系统，并在该操作系统中运行
    Kali Linux。恕不再覆盖现有的操作系统来学习 Linux。

    VMware, Oracle 和其他供应商提供了大型虚拟机应用程序。这些都很好，但在在这里我'
