    # 使用aircrack-ng进行Wi-Fi 查


    对于入门客户最容易的攻击之一就是破解Wi-Fi接入。如前所述，在考虑攻击Wi-Fi AP之前，你需要获取目标AP (SSID) 的MAC地址、客户端的MAC地址以及AP在运行的通道。


    我们可以使用aircrack-ng套件的工具获取可能的内信息。我之前提到过这套Wi-Fi嗅探工具，现在是时候实际使用了。这套工具包含了Kali的每一个版本中，所以你不需要下载或安装任何东西。


    有效使用这些工具，首先需要将网卡放在监听模式下，这样你就可以看到经过所有的流量。通常情况下，将网卡特定的该流量。监控模式可以看到无线链路的流量。


    将无线网卡设置为监听模式|使用aircrack-ng套件中的命令。此命令的语法简单:


    ```

    airmon-ng start|restart interface

    ```


    此时，如果你还没有将网卡（指定为WLAN）设置为监视器，请输入以下内容：


    ```

    kali >airmon-ng start wlan0

    ```


