    There are many ways you can help make the Tor Network faster and stronger:


    +   * Run a Tor Relay Node

    * Volunteer Your Services

    * Make a Donation


    ID-132: Tor 浏览器的登录页


    除了能够访问互联网上几乎任何网站，Tor 浏览器还能访问暗网。构成暗网的网站需要匿名，因此它们允许通过 Tor 浏览器访问，并且它们的地址是.onion 用于其顶级域名（TLD）。暗网因非法活动而匿名，但也有些合法。请注意：在访问暗网时，你可能会遇到很多人觉得荒异的内容。


    # 安全匿名


    美国和其他其他国家的信息和情报机构认为 Tor 网络是对国家安全的威胁。因为这使得一个匿名网络可以让政府和恐怖分子在不被监视的情况下进行交流。许多大的、慈善和隐私的研究项目正在努力打破
    Tor 的匿名性。


    Tor 曾经被这些攻击击破，而且可能会再次被破坏。例如，运行自己的 Tor 路由意味着你的流量可能通过 Tor 网络流出。如果你的流量流出了 Tor 的路由，那么就更糟糕了，因为退出路由总是你的目的地。Tor
    还有一种被称为“流量关联”（traffic correlation）的方法，这种方法通过寻找流出流量的模式，能够打破 Tor 的匿名性。虽然这些破解 Tor
    的尝试不会影响 Tor 在商业服务（如 Google）中隐藏身份的有效性，但它可以限制浏览器在代理机构中隐藏匿名的有效性。


    # 代理服务器


    在互联网上实现匿名的另一种策略是使用代理，它是充当流量中间的中间系统；用户连接到代理，并在传递流量之前之前其提供的 IP 地址（参见图 13-3）。当流量作为目标返回时，将流量发送回
    IP。通过这种方式，流量看起来像是代理，而不是原始的 IP。'
