    cron.* /var/log/cron.log\ndaemon.* /var/log/daemon.log\nkern.* /var/log/kern.log\n\
    lpr.* /var/log/lpr.log\nmail.* /var/log/mail.log\nuser.* /var/log/user.log\n```\n\
    \nfacility 关键字引用其消息，例如邮件、内核或打印系统。priority 关键字决定记录种类。action 是文件名以及日志的位置。星号 (*)\
    \ 替换所有信息。可以通过逗号分隔的列表选择多个优先级。如果优先级为 * 则记录所有消息。指定优先级为 alert，系统将记录警告及高级的消息，但标记为 crit\
    \ 的消息。这是有效级的列表：\n\n```text\n* debug\n* info\n* notice\n* warning\n* warn\n* error\n\
    * err\n* crit\n* alert\n* emerg\n* panic\n```\n\n## 使用 LOGROTATE 自动清理日志\n\n日志文件会占用空间，如果不删除它们，会填满整个硬盘。另一方面，如果频繁删除日志文件，那么在未来的某个时间就没有日志可用。您可以使用\
    \ logrotate 通过切割日志来确定这些需求之间的平衡。\n\nlogrotate 是将日志文件移动到其他位置定期归档的过程，从而留下一个新的日志文件。然后，在指定的时间后，归档的位置将被清理。\n\
