    total 84

    drwxr-xr-x 5 root 4096 Oct 27 .

    drwxr-xr-x 3 root 4096 Oct 27 ..

    drwxr-xr-x 5 root 4096 Oct 27 bin

    drwxr-xr-x 5 root 4096 Oct 27 boot

    drwxr-xr-x 5 root 4096 Oct 27 dev

    drwxr-xr-x 7 root 4096 Oct 27 etc

    drwxr-xr-x 5 root 4096 Oct 27 home

    drwxr-xr-x 5 root 4096 Oct 27 lib

    drwxr-xr-x 5 root 4096 Oct 27 mnt

    drwxr-xr-x 5 root 4096 Oct 27 media

    drwxr-xr-x 5 root 4096 Oct 27 opt

    drwxr-xr-x 5 root 4096 Oct 27 proc

    drwxr-xr-x 5 root 4096 Oct 27 sbin

    drwxr-xr-x 5 root 4096 Oct 27 tmp

    drwxr-xr-x 5 root 4096 Oct 27 usr

    drwxr-xr-x 5 root 4096 Oct 27 var

    -rw-r---- 1 root 4096 Oct 27 initrd.img

    -rw-r---- 1 root 4096 Oct 27 vmlinux

    -rw-r---- 1 root 4096 Oct 27 vmlinuz

    ```


    Linux 中的某些文件是隐藏的，不会通过 ls 命令显示。要显示隐藏文件，添加 -a 参数，如下所示：


    ```

