    星号通配符 (*) 替换单号是指所有信息。您可以通过逗号分隔的列表来选择多个。

    优先级系统要记录各种消息。代码从最低优先级开始，从调试开始到最高优先级，以重置结束。如果优先级为*则记录所有有优先的消息。指定优先级时，将记录该优先级和更高优先级的消息。例如，如果指定的优先级代码为警告
    alert，系统将记录分类为警告和更高优先级的消息，但不会标记为 crit 的消息或警报的任何优先级。这是有效优先级的完整列表：


    +   * debug

    * info

    * notice

    * warning

    * warn

    * error

    * err

    * crit

    * alert

    * emerg

    * panic


    warning, warn, error, err, emerg, panic, 这些都已经被弃用，不应该使用。

    操作通常是一个文件名以及应该发送日志的位置。注意，通常，日志文件发送到/var/log 目录，其文件名为生成它的工具，如 auth。这意味着，例如，由 auth
    工具生成的日志将发送到/var/log.auth.log。


    让我们看一些日志规则的例子：


    ```

    mail.* /var/log/mail

    ```


    这个示例将所有(*)优先级的邮件事件记录到/var/log/mail 文件中。


    ```

    kern.crit /var/log/kernel

    ```


    这个例子将危险(crit)优先级或更高的内核事件记录到/var/log/kernel 中。


