    daemon.* -/var/log/daemon.log

    kern.* -/var/log/kern.log

    l1pr.* -/var/log/lpr.log

    mail.* -/var/log/mail.log

    user.* -/var/log/user.log

    ```


    #

    # Logging for the mail system. Split it up so that

    # it is easy to write scripts to parse these files.


    ```

    mail.info -var/log/mail.info

    mail.warn -var/log/mail.warn

    mail.err -var/log/mail.err

    ```


    清单 11-2 在 rsyslog.conf 中查找日志规则

    每一个都是一个单独的日志规则，说明记录了哪些消息以及记录到哪里。这些规则的基本格式如下:


    +   - facility.priority action


    facility 关键字引用在记录其消息的程序，例如邮件、内核或打印系统。priority 关键字决定了程序记录种类消息的。右侧的 action 关键字将发送日志的位置。让我们更详细看一下每一个部分，首先
    facility 关键字，它指的是生成日志的任何软件，无论是内核、系统系统还是用户。


    下面是一个有效的列表，可以用来替代我们的配置文件规则中的关键字 facility:


    +   - auth/authpriv 安全/授权消息

    cron 时钟守护进程

    daemon 其他守护进程

    kern 内核消息进程'
