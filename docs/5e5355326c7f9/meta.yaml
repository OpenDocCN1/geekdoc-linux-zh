    # 查看和修改环境变量


    您可以查看所有默认的环境变量，方法是在终端的任意目录下输入 env，如下所示：


    ```

    kali >env

    XDG_VTNR=7

    SSHAGENT_PID=922

    XDG_SESSION_ID=2

    XDG_GREATER_DATA_DIR=/var/lib/lightdm/data/root

    GLADE_PIXMAP_PATH=:echo

    TERM=xterm

    SHELL=/bin/bash

    --snip--

    --snip--nUSER=root

    --snip--nPATH=/usr/local/sbin :/usr/local/bin:/usr/sbin:/bin

    --snip--nHOME=/root

    --snip--

    ```


    环境变量总是大写的，如 HOME、PATH、SHELL 等等。这些只是系统上的默认环境变量。用户还可以创建自己的变量，正如您将看到的，我们需要用一个不同的命令来在输出中包含这些变量。


    # 查看所有环境变量


    要查看所有环境变量，包括 shell 变量、本地变量和 shell 函数(任何用户定义的变量和命令别)。请使用 set 命令，此命令将列出具有特定的所有的环境变量，在大多数情况下，这些变量将给出很长的一串输出，因此无法在单个屏幕上查看所有这些变量。您可以使用
    set 请求以容易访问的方式查看每个变量，如下所示：


    ```

    kali >set | more

    BASH=/bin/bash

    BASHOPTS=checkwinsize:cmdlist:complete_fullquote:expand_aliases:extglob...

    ASH_ALIASES=()

    BASH_ARGC=()

    ```'
  - '[PAGE 90]


    ```

    BASH_ARGV()=

    -- snip --

    ```


    现在，变量列表将一行地填充一个屏幕，然后停止。当你按下键盘时，终端将转到下一行，进入下一个命令，由于，你可以通过按下或按住回车滚动。你可以回想在第二章，当您使用了更多的输出指令时，您可以输入
    q 来 quit(or exit)并返回到命令提示。


    # 特定变量的过滤


    虽然使用 set 和 more 可以提供比单独选择大量变量名称更容易管理的结果，但如果你正在寻找特定的变量，它仍然会相当显著。相反，您可以使用过滤命令 grep
    查找对您感兴趣的变量。


    我们以 HISTSIZE 为例。此变量包含命令历史记录文件中的最大命令数。这些命令是在之前会中使用命令提示的命令，可以使用向上和向下调用。请注意，HISTSIZE
    不会存储命令本身，只存储命令的数。


    用 grep 你的输出来查找 HISTSIZE 变量，如下所示：


    ```

    kali >get HISTSIZE

    ```


    如您所见，命令查找 HISTSIZE 并显示其值。此变量的默认值可能在您的系统中设置为 1000。最后表示默认存储最后 1000命令。


    # 更改变量的值


    现在让我们看看如何更改变量的值。如上所述，HISTSIZE 包含存储在历史文件中的命令数值。有时，您可能不想保存所执行的命令。可能是您不希望在自己的系统或目标系统上留下任何活动迹。在这种情况下，您可以将
    HISTSIZE 变量设置为 0。这样系统就不会存储以前的任何命令。由于变量具有单个值，因此要更改时，请参照表 7-1 中所示的热暴方式来分配值。


    ```

    kali =HISTSIZE=0

    ```


    清单 7-1：更改变量的值


    现在，尝试使用向上和向下箭头来调用命令时，没有任何反应，因为系统不再保存它们。这是私隐的，虽然它可能不够。


    # 使变量永久更改


    当您更改一个环境，变化只发生在特定的环境中。在本例中，环境是 bash 会话。这意味着，当您终止后，您所做的任何更改将丢失，并将设置回默认值。如果您想永久更改，则需要使用
    export 命令。这个命令将当前环境(bash shell)中的新变量输出到系统的其余部分，使其在每个环境中都可以用，直到您更改再次它为止。


    变量是字符串，因此如果您在谨慎的情况下下，在修改变量之前将其内容保存到本地文件中并不是'
