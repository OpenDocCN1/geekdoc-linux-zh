  md: '从操作系统的角度来看，你可以通过此文件添加内核 net.ipv4.icmp_echo_ignore=1 来禁用 icmp echo 请求，使黑客更难找到你的系统，但这并非完全没可能找到你的系统。添加该行后，你需要运行命令
    sysctl -p。


    # 管理内核模块


    Linux 至少有两种方法管理内核模块。旧的方法是使用围绕 insmod suite-insmod 构建的一组命令插入模块，用处理模块。第二种方法，使用 modprobe
    命令，我们将在本章后续中使用。在这里，我们使用 insmod 套件中的 insmod 命令列出内核已安装的模块：


    ```

    kali >lsmod


    Module Size Used by

    fnetlink_queue 20480 0

    fnetlink_log 201480 0

    fnetlink 16384 2 nfnetlink_log, nfnetlink_queue

    bluetooth 516096 0

    rkill -- 2 bluetooth


    --snap--

    ```


    如你所示，insmod 命令列出了所有内核模块，以及它们自己的大家和其他模块可能可以使用它们的信息。由于，举个简单的例子——nf netlink 模块（一种内核和用户空间之间通信的基于消息的协议）是
    16384 字节由 nf netlink 日志模块和 nf_netlink_队列模块使用。


    从 insmod 套件中，我们可以使用 insmod 加载或移除模块，并使用 rmm 删除模块，该模块代表 remove 模块。这些命令并不完美，可能没有考虑依赖关系，因此它们会导致内核不稳定或无法使用。Linux
    的现代发行版添加了 modprobe 命令，该命令会自动处理依赖关系并删除内核模块的风险降低。我们就会介绍 modprobe。首先，我们将看看如何获得有关我们模块的更多信息。


    # 使用 modinfo 查找更多信息


    要进一步了解任何内核模块，我们可以使用 modinfo 命令。这个命令的语法非常简单：modinfo 后加上你想查找的模块名称。例如，搜索先运行 insmod
    命令时看到的蓝牙内核模块的基本信息，可以输入以下内容：


    ```

    kali >modinfo bluetooth


    filename:/lib/modules/4.6.0-kali-amd64/kernel/net/bluetooth/bluetooth.ko

    alias:net-pf-31

    license:GPL

    version:2.21

    ```'
