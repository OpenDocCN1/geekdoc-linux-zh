- img_proc: true
  md: '要使用 SUID，请在常规权限之前输入 4，因此设置 SUID 位时，具有 644 的新权限的文件为 4644。


    # 使用 SUID 授予 Root 用户权限


    SUID 是临时权限，但它授予文件所有者的权限，而不是所有者的权限。这意味着，设置 SGID 位，没有执行权限的人可以执行文件，如果所有者都属于执行该文件的组。


    应用于目录时，SGID 的实现方式不同；当该位置在目录中时，在该目录中创建的新文件的权限将转到创建目录的组。多个用户共享目录时，这非常有用。该组中的用户都可以执行文件，而不只是单个用户。


    SUID 在常规权限之前表示为 2，由于设置 SUID 位时，具有权限 644 的新文件将显示为 2644。同样，可以使用 chmod 命令（例如，chmod
    2644 filename）。


    # 时过的粘性


    粘性可以是您在目录上拥有的权限，允许用户删除或重命名该目录中的文件。然而，粘性是旧 Unix 系统的遗物，现代系统（如 Linux）忽略了它。因此，我不会在这里讨论它，但你应该熟悉这个术语，否则你可能会在
    Linux 世界中遇到它。


    # 提权


    作为特殊的权限，它可以扩展权限来利用 Linux 系统，从而从使用用户获得 root 或 sysadmin 权限以及相关权限。使用 root 权限，您可以在系统上执行任何操作。


    一种方法是利用 SUID。系统内核或软件开发者可以在程序上设置 SUID，以允许用户访问具有 root 权限的文件。例如，需要修改密码的命令通常带有 SUID
    位。作为访客，您可以使用该权限获取临时 root 权限并执行任意操作，例如运行 /etc/shadow 测试密码。


    让我们在 Kali 系统中查找了 SUID 文件的测试尝试。回到第 1 章，我向您介绍了 find 命令。我们将使用该命令查找其他的 SUID 文件。


    您可能会记得，find 命令功能强大，但语法比某些一定命令要复杂一些，比如 locate 和 which。如果需要，请查看第 1 章中的权限语法。


    在这种情况下，我们希望查找系统中的任何位置查找文件，对于 root 用户或其他 sysadmin，具有权限 4000。我们可以使用以下命令：


    ```

    kali > find / -user root -perm -4000

    ```


    使用此命令，我们要求 Kali 开始查找查看文件系统的顶部。它会在/下面由 root 拥有的文件以及设置了 SUID 权限的文件（-perm -4000）。


    当我们运行此命令时，我们将得到输出在清单 5-2 中。


    +   - usr/bin/chsh

    - usr/bin/passwd'
