    注意所有者的权限（具有 x）。这就是 Linux 表示 SUID 设置的方式。这意味着任何人类运行 sudo 文件具有 root 权限，可能是系统的安全问题。例如，某些应用程序需要访问
    /etc/shadow 文件才能完成任务。如果攻击者可以控制该程序，他们就可以使用 Linux 系统上的密码。


    Linux 使用良好的系统保护文件和目录免受未授权的访问。客户需要对系统有一定的了解，不仅要保护文件此目录（特别是 SUID 和 SGID 位）。


