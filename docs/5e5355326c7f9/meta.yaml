    使用的 while 和 for 循环。


    # While 循环


    while 循环计算布尔表达式(结果为 true or false 的表达式)，并在表达式计算为 true 时继续执行。例如，我们可以创建一个代码段，打印
    1 到 10 之间的每一个数字，然后退出循环，如下所示


    ```

    count = 1

    while (count <= 10):

    print (count)

    count += 1

    ```


    然后，只要条件为真，缩进的控制就会一直运行。


    # For 循环


    for 循环可以每次通过列表遍历列表、字符串、字典或其他可选结构中的值赋值给变量，从而允许我们一个接一个使用结构中的每一个项。例如，我们可以使用循环密码，直到找到匹配项，如:


    ```

    for password in passwords:

    attempt = connect (username, password)

    if attempt == "230"

    print ("Password found: " + password)

    sys.exit (0)

    ```


    在这一代码段中，我们创建了一个循环，该循环遍历我们的密码列表，并尝试使用用户名和密码进行连接。如果连接接收到230 状态码，成功执行的代码，程序将打印 "Password
    found:"，后打印密码，然后退出。它如果没有得到230，它将继续遍历每一个密码，直到它找到230 或它它完完密码列表。


