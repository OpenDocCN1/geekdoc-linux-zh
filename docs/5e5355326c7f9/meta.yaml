    | :--- |

    | information_schema |

    | creditcards |

    | performance_schema |


    啊哈！我们找到了名为 creditcards 的数据库。我们可以尝试连接它。在 MySQL 中，与其他数据库管理系统（DBMS）一样，我们可以通过 use
    连接到感兴趣的数据库。


    ```

    mysql >use creditcards;

    ```


    Database changed

    表明我们已经连接到 creditcards 数据库。当然，管理员很容易对该数据库进行一些探索。


    ## 数据库表


    我们现在连接到 creditcards 数据库，可以查看它包含的信息。数据库中的表被组织成表格，每个表格可以包含一组数据。我们可以通过输入找出找出中的表：


    ```

    mysql >show tables;

    ```


    | Tables_in_creditcard |

    | :--- |

    | cardnumbers |


    在这里我们可以看到数据库中只有一个表，名为 cardnumbers。通常数据库中会有很多表，因此可能需要更多。在这个示例中，我们将注意力放在单独的表中。既然我们想要检查一个表，我们需要理解表的结构。我们需要知道设置就可以提取相关信息。可以使用
    describe 查看表的结构，如下：


    ```

