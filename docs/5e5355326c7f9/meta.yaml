    ## 赋予默认的安全级别


    如您所见，Linux 默认分配权限（通常为 666 和目录 777）。您可以使用 umask（或 unmask）方法来给每个用户创建的文件和目录的默认权限。umask
    方法从文件或目录的基本权限中删除所需的权限，使其更安全。


    umask 是对应三个权限字符的十进制数字，但是权限掩码中包含了 umask 编号所提供的权限状态。这意味着当创建新文件或目录时，它们权限为默认值减去 umask
    中的值，如图 5-1所示。


    | New files | New directories |

    | --- | --- |

    | 666 | 777 |

    | -022 | -022 Linux base permissions |

    | -644 | 755 Resulting permissions | |


    图 5-1: umask 值 022 如何影响文件和目录的权限


    例如，如果 umask 设置为 022，则具有原始权限 666 的新文件将具有权限 644，这意味着所有者读取和写入权限，并且对其他用户只有读取权限。


    在 Kali 中，对于大多数 Debian 系统，umask 默认配置为 022，这意味着 Kali 值为 644，文件为 755，目录为 755。


    umask 值对于系统上的所有用户是不通用的。每个用户都可以个人的 .profile 文件的目录设置默认权限 umask 值。要用用户登录时查看当前值，只需要运行命令
    umask 并记录返回的内容。要更改 umask 值，可以编辑 /home/username/.profile，例如，添加 umask 007 进行设置，以便只有用户和用户组具有自己的权限。


    ## 特殊权限


    除了三个通用权限 rwx，还有三个特殊权限，稍微复杂一些。这些特殊权限是设置用户 ID (或 SUID)，设置组 ID (或 SGID)。我将在接下来的部分中依次介绍每个权限。


    ## 使用 SUID 授予权限


    正如您现在知道的那样，用户只有在执行特定文件时才能执行该文件。如果用户只具有读取（或）写入权限，则无法执行。这可能看起来简单，但这条规则是有例外的。


    您可能会遇到这样的情况：在执行期间，文件需要 root 用户的权限才能所有用户，即使是 root 用户。例如，允许用户更改其密码的文件需要访问 /etc/shadow
    文件（在 Linux 中保存用户密码的权限）需要 root 用户权限才能执行。在这种情况下，您可以在程序中设置 SUID 来授予所有者的权限以执行该文件。


    基本上，SUID 表示任何用户可以使用所有者的权限执行文件，但这些权限不会超出该文件的范围。


    要使用 SUID，请在常规权限之前输入 4，因此设置 SUID 位时，具有 644 权限的文件为 4644。


    ## 使用 SUID 授予 Root 用户权限


    SUID 是临时权限，但它授予文件所有者的权限而不是用户的权限。这意味着设置 SGID 位，没有执行权限的人可以执行文件，如果所有者属于执行该文件的组。


    应用于目录时，SGID 的实现方式不同；当该位置是目录时，在该目录中创建的新文件的权限将转到组。多个用户共享目录时，这非常有用。组中的用户都可以执行文件，而不是单个用户。SUID
    在常规权限之前表示为 2，由于设置 SUID 位，具有 644 权限的新文件显示为 2644。同样可以使用 chmod 命令（例如 chmod 2644 filename）。


    ## 粘性


    粘性可以是目录上拥有的权限，允许用户删除或重命名目录。然而，粘性是旧 Unix 系统的遗留，现代系统（如 Linux）忽略了它。因此我在这里讨论，你应该熟悉这个术语，否则你可能会在
    Linux 世界遇到它。


    ## 提权


    作为特殊的权限，它可以扩展权限来利用 Linux 系统，从而从用户获得 root 或 sysadmin 权限。使用 root 权限，您可以在系统上执行任意操作。一种方法是利用
    SUID。内核或软件开发者可以在程序上设置 SUID 以允许用户访问 root 权限。例如，修改密码的命令通常带有 SUID 位。作为访客，您可以使用权限获取
    root 权限并执行任意操作，例如运行 /etc/shadow。


    回到第一章，我们介绍了 find 命令。我们将使用该命令查找 SUID 文件。您可能会记得 find 命令功能强大，但语法比某些命令复杂一些，比如 locate
    和 which。如果需要，请查看第一章中的权限。


    在这种情况下，我们希望查找系统中的任何位置，对于 root 用户或其他 sysadmin，具有权限 4000 的可以使用以下命令：


    ```

    kali > find / -user root -perm -4000

    ```


    使用此命令，要求 Kali 开始查找系统顶部的由 root 拥有的以及设置了 SUID 位的文件（-perm -4000）。当我们运行此命令时，我们将得到清单
    5-2：


    ```

    /usr/bin/chsh

    /usr/bin/passwd

    /usr/bin/pkexec

    /usr/bin/sudo

    ```


    ```


    输出显示了许多 SUID 位置。让我们进入 /usr/bin 目录，其中包含许多文件，然后在其上运行一个长的列表并向下滑动，如 5-3 所示。


    ```

    kali >cd /usr/bin

    kali >ls

    -rwx-xr-x 1 root root 176272 Jul 18 stunnel

    -rwx-xr-x 1 root root 269996 Mar 17 crack

    -rwx-xr-x 1 root root 140944 Jul 5 sudo

    ```


    ## 清单 5-2: 通过 SUID 查找文件


    请注意，所有者的权限（具有 x）。这就是 Linux 表示 SUID 设置的方式。这意味着任何人类运行 sudo 文件具有 root 权限，可能是系统的安全问题。例如，某些应用程序需要
    /etc/shadow 文件才能完成任务。如果攻击者可以控制该程序，他们就可以使用 Linux 系统上的密码。


    Linux 使用良好的系统保护文件和目录免受未授权的访问。权限来保护用户或组的文件免受系统中用户的攻击，用于攻击性和防御目的。您现在应该知道如何管理这些权限以及利用此弱点攻击系统（特别是
    SUID 和 SGID 位）。


