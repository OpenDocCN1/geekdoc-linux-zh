    接下来，你需要连接连接机器。如果你使用的是 Raspberry Pi 3 版本的机器，那么只有一个地方可以连接。关闭，将相机连接到串口接口，然后重新启动，相机非常脆弱，绝不能与通用输入/输出(GPIO)。'
