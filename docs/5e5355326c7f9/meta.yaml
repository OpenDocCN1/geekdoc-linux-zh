- img_proc: true
  md: '# 这本书里有什么


    在第一章中，您将熟悉 Linux 的基础知识，您将为您提供一些基本命令。


    第 1 章将您学习文件系统和终端，并为您提供一些基本命令。


    第 2 章介绍如何操作文本，查找、检查和更改文件。


    第 3 章中，您将管理网络，通过扫描，查找连接信息，并通过网络和 DNS 信息来伪装自己。


    第 4 章鼓励添加、删除和更新内核，以及如何简化系统。


    第 5 章中，您将操纵文件和权限来控制谁可以访问什么，您将学习一些权限提升效率。


    第 6 章教您管理进程，启动和停止进程以及分配资源以便更好地控制。


    第 7 章中，您将管理环境以获得最佳性能，您将找到冗余变量，更改 PATH 变量以及创建新的环境。


    第 8 章介绍您如何使用 bash，这是任何认真的黑客的主要工具。您将学习 bash 的基础知识并构建一个脚本来扫描可能有漏洞的目标端口。


    第 9 章和第 10 章将为您提供了一些文件系统管理技术，向您展示如何压缩和存档文件以保持整洁，复制整个存储设备以及获取所有有关文件和连接磁盘的信息。


    后面的章节深入探讨了目标客户。在第 11 章中，您将学习如何操作日志系统来获取目标活动的信息，并覆盖您自己的轨迹。


    第 12 章将展示了如何使用和滥用三个 Linux 服务：Apache Web 服务器、OpenSSH 和 MySQL。您将创建一个 Web 服务器，构建一个远程视图窗口，并了解数据库及其漏洞。


    第 13 章将展示您如何在使用代理服务器、Tor 网络、VPN 和加密邮件中保持安全和 匿名。


    第 14 章涉及无线网络。您将学习基本的网络命令，然后破解 WiFi 并接入点检测检测蓝牙信号。


    第 15 章深入了 Linux 本身，深层内内核如何工作以及如何利用其程序来传递软件。


    第 16 章中，您将学习调优技巧，以自自动化的黑客操作。


    第 17 章教你核心的 Python 概念，你将编写两个黑客工具：一个监控 TCP/IP 连接的扫描程序和一个密码破解程序。'
