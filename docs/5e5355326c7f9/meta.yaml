    ## 17 骇客的 Python 脚本基础


    基本的脚本编程能力对于骇客来说十分必要的。如果你没有学习脚本编程技能，一个只会使用别人开发的工具的新手客会被称为脚本小子。这意味着你只能使用别人开发的工具，降低了你成功的可能性，增加了被病毒软件、入侵检测到的可能性。如果你有编程技能，你可以提升你的水平！


    在第8 章中，我们讲述了 bash 脚本和编写一些基本脚本，包括 MySQLScanner，这是用来寻找常见数据的系统。在这一章中，我们将讲述使用广泛的语言：Python。很多受欢迎的骇客工具是用
    Python 编写的，包括 sqlmap, scapy, Social Engineer Toolkit (SET), w3af 等。


    Python 有一些功能特别适合骇客行为，最重要的是它有很多种类库（可以从外部导入和重复使用的代码模块）提供了一些强大的功能。Python 包括超过 1000
    多内置模块，其他库里更多。


    开发工具可以使用其他编程语言，例如 bash, Perl 和 Ruby，但是 Python 开发这些工具变得特别简单。


    ## Python 模块


    安装 Python 时，还会安装一组标准库和模块，这些库提供广泛的功能，包括内置数据类型，异常处理，数字和数学建模，文件处理，加密数据处理以及与 Internet
    的交互协议 (IP)。


    不像标准库和模块提供的强大功能，你可能需要或者想要额外的第三方模块。Python 的第三方模块是多样的，并且许多数据需要使用 Python 脚本编写。你可以在
    PyPI (the Package Index) http://www.pypi.org/ 找到所有的第三方列表。


    ## 使用 pip


    Python 有一个专门用于安装和管理 Python 包的包管理软件 pip (Pip Installs Packages)。由于在这里使用 Python
    3，你需要使用 pip3 来下载和安装。你可以从 Kali 上下载 pip，输入这条命令：


    ```bash

    kali >apt-get install python3-pip

    ```


    现在，为了使用 PyPI 下载包，你只需要输入：


    ```bash

    kali >pip3 install <package name>

    ```


    当你下载这些包的时候，它们会被激活在 /usr/local/lib/<python-version>/dist-packages 目录。所以，举个例子，如果你使用
    pip 安装 Python3.6 的 SNMP 协议，你可以在 usr/local/lib/python3.6/pysnmp 中找到它。如果你不清楚包被放在系统的哪个位置（有时不同的
    Linux 发行版使用的目录），你可以输入 pip3 后面跟上 show 和包的名字，如下所示：


    ```bash

    kali >pip3 show pysnmp

    Name: pysnmp

    Version: 4.4.4

    Summary: SNMP library for Python

    Home-page: https://github.com/etingof/pysnmp

    Author: Ilya Etingof <etingof@gmail.com>

    email: etingof@gmail.com

    License: BSD

    Location: /usr/local/lib/python3.6/dist-packages

    ```


    你可以看到这给了你很多关于包的信息，包括包所在的目录。作为 pip 的替代，你可以直接从网站下载（注意下载到合适的目录），解压（如果需要），然后运行下面的命令：


    ```bash

    kali >python setup.py install

    ```


    这次安装已经配置好了。


