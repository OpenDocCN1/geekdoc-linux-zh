    在这里，我们看到无线接口（也称为网名）及其关键数据，包括的无线标准、ESSID是否关闭以及模式。这种模式有三个设置：managed，意味着它已经准备好加入或加入了
    AP；master，意味着它已经准备好就绪或已加入 AP；and monitor，我们将在章节稍后讨论。我们可以看到是否有任何客户端与我们关联，以及的传输功率是什么，等等。从这个例子可以出来，wlan0处于Wi-Fi网络所需的模式，但尚未连接到任何网络，一旦连接到Wi-Fi网络，我们将再次执行此回命令。


