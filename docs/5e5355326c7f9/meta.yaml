    DNS 是像 hackers-arise.com 这样的域名转换相应的 IP 地址的服务，通过这种方式，你的机器知道如何到达。没有 DNS 我将不得记住千万万我们最喜欢的网站的
    IP 地址——即使对于一个专业学者来说，这也不算一项小任务。


