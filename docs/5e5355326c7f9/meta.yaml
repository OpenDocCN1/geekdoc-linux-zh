  md: '# 管理 LINUX 内核和可载内核模块

    MANAGING THE LINUX KERNEL AND LOADABLE KERNEL MODULES


    ![](img/77055846b6e5bd43c939d5fb384e34d6_173_0.png)


    所有操作系统至少由两个主要组件组成。其中第一个是最重要的内核。内核位于操作系统的中心，控制着操作系统所的一切，包含管理内存，控制 CPU，其控制着用户在屏幕上看到的内容。操作系统的第二个元素通常被称为用户区域，几乎包括其他所有元素。


    内核被设计成一个保护或特权的区域，只能通过 root 账户或其他特殊权限访问。这是有充分理由的，因为对内核的访问几乎可以对整个操作系统的访问。因此，大多数数据系统只向用户和服务提供对用用户区域的访问，用户可以在不控制操作系统的情况下几乎访问他们需要的内容。


    访问内核允许用户更改操作系统的工作方式，它允许我们可以操作操作系统崩溃，使其无法工作。尽管存在这种风险，但在某些情况下，出于操作和安全原因，系统管理员必须非常谨慎地访问内核。


    在本章中，我们将介绍如何改变内核的工作方式并将模块加载到内核中。不言而喻，如果客户可以改变内核，他们就可以控制内核。此外，攻击者可能需要改变内核对某些攻击的作用，例如中间人（MITM）攻击，获客将自己置于客户端和服务器之间，并且可以窃听或改变通信。首先，我们将仔细内核结构及其模块。'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# 什么是内核？


    内核是操作系统的核心内核，控制着它所做的一切，包括硬件组件的交互和启动硬件（如 CPU、内存和硬盘驱动器）的运行。内核是你看到的那个用户所用的应用程序和运行所有硬件的服务。


    Linux是一个单内核内核，可以添加内核模块。因此，可以在内核中添加和移除模块。内核有时需要更新，这可能需要安装新的驱动程序（如视频、设备或 USB 设备）、文件系统驱动程序，甚至系统扩展。必须将这些驱动程序加载到内核中才能正常运行。在某些系统中，添加驱动程序，必须重新编译和更新整个内核，Linux
    并不在整个过程中向内核添加一些模块。这些模块可以被称为内核模块LKM。


    Linux 需要内核级别的权限，使得它更容易易受攻击的目标。一种被称为 rootkit 的特殊软件可以通过这些 Linux 加载到操作系统的内核中。如果你能注入内核驱动，你就可以完全控制操作系统。


    如果你可以使用 Linux 管理员并在其中插入了 rootkit，那么你不仅可以获得目标系统的控制，而且由于你在操作系统的内核级别运行，可以控制整个操作系统的进程、运行、硬件、磁盘空间以及你想到的几乎任何其他内容。


    因此，如果你可以成功通过 Linux 管理员在其中插入了 rootkit 的视频或其他设备驱动程序，你就可以完全控制系统和内核。这些是最阴险的 rootkit
    利用 Linux 和其他操作系统的方式。


    了解 LKM 则是成为一名有名的 Linux 管理员并成为一名非常有效且隐秘的关键。

    让我们来看看你的内核版本的？


    # 检查内核版本


    了解内核的第一步是检查正在运行的内核。至少有两种方法可以做到这一点。首，我们可以输入以下内容:


    ```

    kali >uname -a

    Linux Kali-4.6.0-kernel-amd64 1 SMP Debian 4.6.4-1kernel (2016-07-21) x86_64

    ```


    通过内核告诉我们，我们的操作系统运行的发行版本是 kali linux，内核版本是 4.6.4，构建的架构是 x86_64 架构。它告诉我们它具有多处理（SMP）功能（意味着它可以在多个核心或处理器的机器上运行），并于
    2016 年 7 月 21 日在 Debian 4.6.4 上构建。根据使用的内核和操作系统的 CPU，您的输出可能有所不同。因此，因此了解如何获取这些信息是非常重要的。


    获取这些信息以及其他有用的另一种方法是对 /proc/version 文件使用 cat 命令，如下所示:


    ```

    kali >cat /proc/version

    Linux version 4.6.0-kernel-amd64 (devel@kali.org) version 5.4.0 20190909 (Debian
    5.4.0) # 1 SMP Debian 4.6.4-1kernel (2016-07-21)

    ```


    在这里，你可以看到 /proc/version 文件返回了信息。'
  merge: -1
  pgno: 174
