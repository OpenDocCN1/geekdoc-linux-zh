    ## 从 MySQL 取数据信息


    MySQL 是数据库驱动应用程序后使用最广泛的数据库。在我们现代的 Web 2.0 时代，几乎每个网站都是数据库驱动的，这意味着 MySQL 拥有大部分网络的数据。


    数据库是客户端的“金牛羊”。它们包含有关用户的重要信息以及信用卡密码信息。出于这个原因，骇通常将数据库视为目标。


    与 Linux 一样，MySQL 是开源和通用许可（GPL），你会发现它几乎预装在每个 Linux 发行版上。


    作为免费、开源强大的 MySQL 已经成为许多应用程序的首选数据库，包括 WordPress、Facebook、LinkedIn、Twitter、Kayak、alert.com、Wikipedia
    和 YouTube 热门网站。


    其他流行的内容管理系统（CMS），Joomla、Drupal 和 Ruby on Rails 也使用 MySQL。你明白了，如果你想开发或攻击 Web 应用程序的后端数据库，你应该去了解
    MySQL。让我们开始吧。


    ## 启动 MySQL


    幸运的是，Kali 已经安装了 MySQL（如果你正在使用其他发行版，则可以从软件镜像或直接从 https://www.mysql.com/downloads/
    下载 MySQL）。


    启动 MySQL 服务，在终端中输入以下内容：


    ```

    kali > mysql service start

    ```


    接下来，你需要通过登录来验证身份。输入以下内容，在输入密码时，只需按 ENTER 键：


    ```

    kali > mysql -u root -p

    ```


    Enter password:


    Welcome to MySQL monitor. Commands end with ; or \g.


    Your MySQL connection id is 4


    Server version: 5.6.30-1 (Debian)


    Copyright (c) 2000, 2016, Oracle and its affiliates. All rights reserved


    Oracle is a registered trademark of Oracle Corporation and its affiliates. Other
    names may be trademarks of their respective owners


    Type ''help''; or ''h'' for help. \c to clear the input statement


    ```

    mysql >

    ```


    MySQL 的默认配置中，root 用户的密码是空的。显然，这是一个主要的安全漏洞，你应该在首次登录后添加密码来解决这个问题。请注意，操作系统和 MySQL
    的用户名和密码是独立的不同的。我们现在更改 MySQL 用户的密码以去和不安全。


    ## MYSQL 的过去与未来


    MySQL 最初是瑞典的 MySQL 于 1995 年开发的，然后在 2008 年被 Sun Microsystems 收购，而者又于2009 年被 Oracle
    收购 - 因此 MySQL 归 Oracle 所有。所有甲骨文是世界上最大的数据库软件发行商，因此此开源社区对甲骨文持 MySQL 的开源承诺存在重大挑战。因此，现在有一个名为
    “MariaDB” 的 MySQL 数据库软件的伙伴，致力于保持持续该软件及其后续版本的开源。作为 MySQL 管理员或客户，你应该关注 MariaDB。


    ## 与 MySQL 交互


    SQL 是一种与数据库连接的解释编程语言。数据库通常是关系数据库，这意味着数据存储在多个交互的表中，每个表都有一个或多个列和行的值。


    SQL 有几种实现，每种都有自己的命令和语法，但这里有几个常用的命令：


    - select 用于查找数据

    - union 用于合并两个或多个 select 操作的结果

    - insert 用于插入新数据

    - update 用于修改更新旧数据

    - delete 用于删除数据


    您可以认为为每个命令提供条件，以便更具体地阐解您想要执行的操作。例如，如下行


    ```

    select user,password from customers where user=''admin'';

    ```


    将返回 customers 表中用户值等于“admin”的任何用户的用户名和密码字段的值。


    ## 设置 MySQL 密码


    通过输入以下内容，让我们看看已经已经在 MySQL 系统中的用户。（请注意，MySQL 中的命令以分号结束）。


    ```

    mysql >select user,host,password from mysql.user;

    ```


    | user | host | password |

    | :--- | :--- | :--- |

    | root | localhost | |

    | root | aphrodite.kali.org | |

    | root | 127.0.0.1 | |


    这表明 root 用户没有设置密码。我们给 root 分配一个密码。为此，我们将首先选择要使用的数据库。您系统上的 MySQL 将包含一些设置的数据库。使用
    show 列出所有数据库，命令查看所有可用的数据库：


    ```

    mysql >show databases;

    ```


    | Database |

    | :--- |

    | information_schema | |

    | mysql | |

    | performance_schema | |


    MySQL 默认带有三个数据库，其中两个 (information_schema 和 performance_schema) 是我们在这里不会会去的管理数据库。我们将使用非管理数据库
    mysql，它包含了您的目标数据库中。要开始使用 mysql 数据库，输入：


    ```

    mysql >use mysql;

    ```


    Reading table information for completion of table and column names You can turn
    off feature to get a quicker startup with -A


    Database changed


    这个命令将连接到 mysql。现在我们可以使用以下命令将 root 用户的密码设置为 hackers-arise：


    ```

    mysql >update user set password = PASSWORD("hackers-arise") where user = ''root'';

    ```


    此命令通过将用户的 root 密码设置为 hackers-arise 来更新新用户。


    ## 访问远程数据库


    访问 localhost 上的 MySQL 数据库，我们使用以下命令语法：


    ```

    kali $ mysql -u <username>

    ```


    如果没有给出主机名或 IP 地址，则此命令将认为 localhost 上的 MySQL 实例。因此，要访问远程数据库，我们需要提供托管 MySQL 数据库的系统的主机名或
    IP 地址。这又是一个例子：


    ```

    kali $ mysql -u root -p 192.168.1.101

    ```


    我们将连接到 192.168.1.101 MySQL 实例并输入密码。为了演示，我们将连接到局域网（LAN）上的 MySQL 实例。如果您已经在其他网络上安装了
    MySQL 系统，请在此处使用其 IP 地址。假设您已经连接并以密码登录系统（您知道此情况，mysql 数据库没有密码）。


    这打开了 MySQL 命令界面，它为我们提供了 mysql>提示。除了这个命令界面，MySQL 还有 GUI 界面 - 原（MySQL Workbench）和第三方（Navicat
    和 TOAD for MySQL）。作为未登录客户端，命令界面可能是使用 MySQL 数据库的最佳选择，因此我们将重点关注这一点。作为未授权的数据库参与者，您将无法获得使用的
    GUI。


    > NOTE

    此屏幕提醒我们我们所有命令必须以分号或\g 结尾（与 Microsoft 的 SQL Server 不同），并且可以通过输入 help 或 h 获得帮助。


    现在我们使用系统管理员身份登录，我们可以无阻地浏览数据库。如果我们以普通用户身份登录，我们的导航将受到系统管理员为该用户提供的权限的限制。


    ## 连接到数据库


    通过访问系统，我们想要一个查询。我们的下一步是查找有价值的数据库。以下是查找系统上的命令：


    ```

    mysql >show databases;

    ```


    | Database |

    | :--- |

    | information_schema |

    | creditcards |

    | performance_schema |


    啊哈！我们找到了一个值得探索的名称为 creditcards 的数据库。我们可以尝试连接它。在 MySQL 中，与其他数据库管理系统（DBMS）一样，我们可以通过
    use datename 连接到感兴趣的数据库。


    ```

    mysql >use creditcards;

    ```


    Database changed


    表明我们已经连接到 creditcards 数据库。当然，管理员太轻易将数据库命名为信用卡，因此可能进行一些探索。


    ## 数据库表


    我们现在连接到 creditcards 数据库，可以查看它包含的信息。数据库中的表被组织成表格，每个表格可以包含一组数据。我们可以通过输入命令找出数据库中的表：


    ```

    mysql >show tables;

    ```


    | Tables_in_creditcard |

    | :--- |

    | cardnumbers |


    在这里，我们可以看到该数据库中只有一个表，名为 cardnumbers。通常，数据库中会有很多表，因此可能需要更多的监听。在这个示例中，我们将注意力放在单独的表格中。既然我们想要检查一个表，我们需要理解表的结构。我们需要知道如何设置，就可以提取相关信息。您可以使用
    describe 查看表的结构，如下：


    ```

    mysql >describe cardnumbers;

    ```


    | Field | Type | Null | Key | Default | Extra |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | customers | varchar(15) | YES | | NULL | |

    | address | varchar(15) | YES | | NULL | |

    | city | varchar(15) | YES | | NULL | |

    | state | varchar(15) | YES | | NULL | |

    | cc | int(12) | | | 0 | |


    MySQL 使用感兴趣的关键来进行响应。我们可以看到字段名称以及它拥有的类型（通常是文本 varchar 或整数 int），我们还可以看到是否接受 NULL，密钥（如果存在），字段具有任何默认值，以及任何额外信息，例如。


    ## 查看数据


    要实际查看表中的数据，我们使用 SELECT 命令。SELECT 命令要求以下信息：


    - 包含数据的表

    - 表包含数据的列


    查看所有列的快捷方式，我们可以使用星号而不是输入想要查看的列名。因此，查看 cardnumbers 表中所有数据，我们输入：


    ```

