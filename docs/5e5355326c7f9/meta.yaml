    Reading state information...

    Processing triggers for synaptic (1.47)...

    一旦安装了 Synaptic，你可以从设置找到软件包管理器 (Synaptic Package Manager)，打开窗口如图 4-2。


    图 4-2: Synaptic 包管理器


    现在您可以搜索您正在寻找的包，只需点击 Search 选项卡打开一个窗口。在搜索窗口中输入 synaptic 并点击 search。向下滚动搜索结果找到您要查找的包。选中
    synaptic 旁边的复选框，然后点击 Apply 选项卡，如图 4-3 所示。Synaptic 将从存储库下载并安装以及任何依赖项。


    ## 使用 GIT 安装


    有时，您需要的软件在存储库中不可用——尤其是全新的情况下——可能在 GitHub (https://www.github.com/) 上可用。这个站点允许开发者共享他们的软件，以便下载、使用和提供反馈。例如，如果您想要渗透工具但在
    Kali 存储库中找不到，那么就可以在浏览器搜索框中输入工具来搜索。如果它存在于 GitHub 上，您应该在搜索结果中看到它的仓库。在 GitHub 上找到后，可以通过输入
    git clone 命令从终端安装。例如，工具位于 https://www.github.com/balle/toolging.git。要将其克隆到系统中，请输入清单
    4-7 所示的命令：


