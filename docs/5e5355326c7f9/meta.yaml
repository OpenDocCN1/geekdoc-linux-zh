    # 使用 APT 处理软件


    在基于 debian 的 Linux 版本(包括 Kali 和 Ubuntu)中，默认的软件包管理器是高级打包工具 apt，其主要命令是 apt-get。在最简单和常见的形式中，您可以使用
    apt-get 下载和安装新的软件包，也可以使用它更新和升级软件。


    # 搜索软件包


    在下载软件包之前，您可以检查要查找的软件包是否在存储库可用，存储库是操作系统存储信息的 apt 工具有一个搜索功能，可以检查是否可用。语法很简单：


    ```

    apt-cache search keyword

    ```


    注意，我们使用 apt-cache 命令来缓存，或者查找其他软件包名的位置。例如，如果您正在搜索检测系统 Snort，您将需要输入表 4-1 所示的命令：


    ```

    kali >apt-cache search snort

    fsnort - Snort-to-iptables rule translator

    ippl - IP protocols logger

    snip -

    sn - flexible Network Intrusion Detection System

    snort-common - flexible Network Intrusion Detection System - common files

    snip -

    ```


    清单 4-1: 使用 apt 在存储库中搜索 Snort


    如您所见，许多文档中提到 Snort 关键字，是在输出的中间看到 snort - flexible Network Intrusion Detection
    System。这就是我们要找的！


    # 添加软件


    现在您已经知道 Snort 存在存储库中，可以使用 apt-get 下载软件。


    要在终端中操作系统的默认存储库中安装软件，请使用 apt-get 命令，后面关键字 install，然后是要需要安装的名称。语法是这样的：


    ```

    apt-get install packagename

    ```


    让我们通过在系统上安装 Snort 来尝试一下。输入 apt-get install snort 作为命令语句，如清单 4-2 所示。


    ```

    kali >apt-get install snort

    Reading package lists... Done

    Building dependency tree

    ```'
