    ## 理解和检查无线网络 UNDERSTANDING AND INSPECTING WIRELESS NETWORKS


    从你的系统扫描和连接到其他网络的能力对于一名成功的客户至关重要。随着 WiFi（IEEE 802.1）和蓝牙等无线技术成为标准，寻找和控制 WiFi 和蓝牙连接是关键。如果有人破解无线连接，他们可以进入设备并访问机密信息。当然，第一步是学习如何找到这些设备。在第
    3 章中，我们研究了 Linux 中的一些基本网络命令，包括无线网络的一些原理，并在第 14 章提供更多的无线网络知识。正如承诺，我们将研究两种 Linux
    最常见的无线技术：WiFi 和蓝牙。


    ## Wi-Fi 网络


    我们从 WiFi 开始。在本节，我将向您演示如何查找、检查和连接 WiFi 接入点。在此操作之前，让我们花时间学习一些基本的 WiFi 术语和概念，以帮助您更好地理解本章进行的大量输出：


    - AP (access point) 是无线用户连接到互联网的设备。

    - ESSID (extended service set identifier) 和我们在第三章中讨论的 SSID相同，不过用于无线局域网中的多个 AP。

    - BSSID (basic service set identifier) 是每个 AP 的标识，与设备的 MAC 地址相同。

    - SSID (service set identifier) 是这个网络的名称。

    - Channels WiFi 可以在 14 个通道 (1-14) 中的任何通道上连接。在美国，WiFi 被限制在信道 1 到 11。

    - Power 距离 WiFi 越远，传输越容易被破解。

    - Security 是读取 WiFi AP 上的安全加密，WiFi 有三种安全加密。最初的有线有效性 (WEP)存在严重缺陷，容易破解。它的替代品，WiFi
    保护访问 (WPA)，更安全一点。最后，WPA2-PSK 更加安全并且使用所有用户共享的预共享密钥 (PSK)，现在几乎 WiFi AP (企业除外) 都使用它。

    - Modes WiFi 在三种模式下切换：managed, master, 或 monitor。你将在下一节中了解这些模式的意义。

    - Wireless range 在美国，WiFi 必须合法地使用 0.5 瓦的上限功率。在此功率下，它具有约 300 米 (100 米)的范围。Highgain可以将此范围扩展到更多。

    - Frequency WiFi 被设计用于 2.4GHz 和 5GHz。现代 WiFi 和无线网卡经常使用这两者。


    ## 基本无线网络命令


    在第三章中，我们介绍了基本的 Linux 网络 ifconfig 命令，列出了系统上每个激活的网络接口以及一些基本信息，包括（最重要的）每个接口的 IP 地址。让我们再次看看运行
    ifconfig 的结果，这次关注未连接。


    ```

    kali@ifconfig\eth0Linkcap:EthernetHwaddr 00:0c:29:ba:82:0f

    inet addr:192.168.1.3 Mask:255.255.255.0

    lo Loopback

    inet addr:127.0.0.1 Mask:255.0.0

    wlan0

    EthernetHwaddr 00:0c:29:ba:82:0f

    ```


    这里的 WiFi 接口显示为 wlan0。在 Linux 中，WiFi 接口通常指定为 wlanX，X 代表接口编号。换句话，系统的 WiFi 适配器标记为
    wlan0，第二个是 wlan1，以此类推。如果你只想查看 WiFi 接口及其统计数据，这个命令是 iwconfig。


    ```

    kali@iwconfig

    wlan0 IEEE 802.11bg ESSID:

    Mode:Managed Access Point:00:25:9c:97:4f Frequency:2.452GHz Channel:1 Quality=70/70
    Power=-20 dB

    Retry short limit:7 RTS:off Fragment thr:off Encryption key:off Power Management:off

    ```


    注意，在 iwconfig 中已经确认 ESSID 是“Hackers-Arise”，并且 AP 的频率为 2.452GHz。在 WiFi 网络中，多个连接点都可能是同一个网络的一部分，可能会有许多节点组成
    WiFi 网络。如您所料，MAC地址 00:25:9c:97:4f:48是我连接的 AP 的 MAC。WiFi 网络使用的安全协议，无论是 2.4GHz还是
    5GHz 的运行频率，其 ESSID 是什么，以及 AP 的 MAC 地址是什么，都是 WiFi 入侵攻击所需的关键信息。现在你已经了解了这些基础的命令，让我们来进行一些针对入侵的尝试吧。


    常用的命令是 nmcli，可以用来查看附近的 WiFi AP 和的一些信息。连接到 AP 的语法如下：


