    ## 查看数据


    要实际查看表中的数据，我们使用 SELECT 命令。SELECT 命令要求以下信息：


    - 包含数据的表

    - 表包含数据的列


    查看所有列的快捷方式是使用星号而不是输入想要查看的列名。因此，查看 cardnumbers 表中所有数据，我们输入：


    ```

    mysql SELECT * FROM cardnumbers;

