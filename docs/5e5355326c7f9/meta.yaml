    此终端终端打开命令行环境（称为 shell），您可以在底层操作系统上运行命令并编写脚本。虽然 Linux 有许多不同的 shell 环境，但最受欢迎的是 bash
    shell，它也是 Kali 和许多其他 Linux 发行版中的默认 shell。


    要更改密码，可以使用命令 passwd。


    # Linux 文件系统


    Linux 文件系统结构与 Windows 有些不同。Linux 在文件系统的基础上没有物理驱动器（例如 C: 驱动器），而是使用逻辑文件系统。在文件系统结构的顶层是
    /，它通常被称为文件系统的根，就像它是一个倒置树（见图 1-4）。请记住，这与 root 用户不同。这些术语可能看起来令人困惑，但是一旦习惯了 Linux，它们就会变得容易区分。'
