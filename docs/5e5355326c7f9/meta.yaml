    ## 控制文件和目录权限


    Linux 系统中，root 用户非常强大。root 用户可以执行任何操作，其他用户拥有有限的权限。每个文件和目录都有相同的权限。系统允许系统管理员（root
    用户或所有者）通过赋予用户读取、写入或执行权限来保护文件免受必要的访问或篡改。对于每个文件和目录，我们可以为所有者、特定组以及其他用户指定权限。在本章中，我将向您展示如何检查和更改用户的文件，如何设置默认文件和目录权限，最后您将看到权限理解如何帮助他们防止攻击。


    ## 多类型用户


    在 Linux 系统中，root 用户基本上可以执行任何操作。其他用户拥有权限。这些用户通常被收集到相似组。在商业体系中，这些组可能是财务、销售等。在 IT
    环境中，这些组包括开发者、网络管理员和数据库管理员。我们将相似的人员放入组中，然后组成员都会继承该权限。为了方便管理，默认情况下，root 用户是。


    ## 用户权限


    每个文件和目录分配不同的权限。三个级别的权限如下：


    - r 读取权限。允许用户打开和查看文件

    - w 写入权限。允许用户查看和写入内容

    - x 执行权限。允许用户执行一个操作。


    如果使用横线（-- 替换 r、w 或 x），则未给出相应的权限。请注意，用户只能执行二进制文件或副本的权限。让我们使用清单 5-1 中的输出作为示例：


    ```

    -rw-r--r--  1  root  3368504 June 28 2018 hashcat.hcstat

    ```


    正如它的右侧 hashcat.hcstat，该文件。初始化（表示是一个文件）之后，权限 rw- 告诉我们具有权限但没有权限。一组权限 (r--)表示该组的权限，显示具有读取权限但不具有写入或执行权限。最后，我们看到其他用户只有读取权限
    (r--)。


    这些权限不是不变的。作为 root 用户或文件所有者，您可以更改它们。接下来，我们会做到这一点。


    ## 改变权限


    我们可以使用 Linux chmod 命令来更改权限。只有 root 用户或文件所有者才能更改权限。在本章节，数值法可能是 Linux 中常用的方法，但有些人会发现符号方法更直观。符号法通常称为
    UGO 语法，代表用户（或所有者）、组和其他人。


    | 权限类型 | 符号 | 二进制 | 十进制 |

    | :--- | :--- | :--- | :--- |

    | 读取 (read) | r | 100 | 4 |

    | 写入 (write) | w | 010 | 2 |

    | 执行 (execute) | x | 001 | 1 |

    | 所有权限 (rwx) | rwx | 111 | 7 |


    清单 5-1: 使用 ls -l 命令检查权限


    我们获取有关内容的信息：


    - 文件类型

    - 所有者和用户所属的文件权限

    - 链接数量（主题超出了本书范围）

    - 文件所有者

    - 文件的大小（以字节为单位）

    - 文件创建或修改时间

    - 文件名


    让我们关注线条开头那些难以理解的字母和短线。它们告诉我们一个项目还是目录，以及它拥有哪些权限。第一个字符定义的权限。它有三个字符，由 read (r), write
    (w) 和 execute (x) 的某种组合组成。第一组代表所有者的权限，第二组代表用户所属的权限以及最后一组代表所有用户的权限。


    无论您正在查看三个字母中的哪一个，如果是 r，则该用户或组都有打开或读取该文件或目录。中间字母的 w 意味着我们可以写入（修改）文件或目录，最后的 x 意味着可以执行（或运行）文件或目录。如果使用横线（--
    替换 r、w 或 x），则未给出的相应的权限。请注意，用户只能执行二进制文件或副本的权限。


    让我们使用清单 5-1 中的输出作为示例：


    ```

    -rw-r--r--  1  root  3368504 June 28 2018 hashcat.hcstat

    ```


    正如它的右侧 hashcat.hcstat，该文件。初始化（表示是一个文件）之后，权限 rw- 告诉我们具有权限但没有权限。一组权限 (r--)表示该组的权限，显示具有读取权限但不具有写入或执行权限。最后，我们看到其他用户只有读取权限
    (r--)。


    这些权限不是不变的。作为 root 用户或文件所有者，您可以更改它们。接下来，我们会做到这一点。


    ## 改变权限


    我们可以使用 Linux chmod 命令来更改权限。只有 root 用户或文件所有者才能更改权限。在本章节，数值法可能是 Linux 中常用的方法，但有些人会发现符号方法更直观。符号法通常称为
    UGO 语法，代表用户（或所有者）、组和其他人。


    ## 赋予用户权限


    将文件的所有权转移到其他用户，我们可以使用 chown（或更改所有者）命令：


    ```bash

    chown bob /tmp/bobfile

    ```


    在这里，我们给出所有用户的名称，然后是文件的位置和名称。命令授予 Bob 对文件的所有权。


    ## 赋予组权限


    将文件的所有权转移到另一个组，我们可以使用 chgrp（或更改组）命令。用户可能经常工作而不是团体，但是对于调试或测试来说在同一个项目上工作并不是空，在这种情况下，使用组是必要的。例如，您可能有一个测试和一个安全组在同一个项目上工作。此例子中的测试者是组，意味着他们拥有所有权限。root
    需要访问工具，而安全人员只需要访问工具，入侵监控系统（IDS）。根据设置并安装名为 security 的程序，根据需要可能更改为安全，此组输入以下命令：


    ```bash

    chgrp security

    ```

    此命令改变安全组的所有者。现在您需要知道如何检查这些分配是否有效。你可以通过检查文件的权限做到这一点。如果要查看文件或目录哪些用户授予了权限，请使用带有 -l
    (long) 开关的 ls 命令显示目录的内容。ls -l 命令在 /usr/share/hashcat 最喜欢的密码工具之一上，以便查看我们哪里解析。


    ```bash

    ls -l /usr/share/hashcat

    ```

    2 3 4 5 6 7

    drwxr-xr-x 5 root 4096 Dec 5 10:47 charsets

    -rw-r--r-- 1 root 3368504 June 28 2018 hashcat.hcstat

    -rw-r--r-- 1 root 3368504 June 28 2018 hashcat.hctune

    drwxr-xr-x 2 root root 4096 Dec 5 10:47 masks

    drwxr-xr-x 3 root root 4096 Dec 5 10:47 rules

    ```


