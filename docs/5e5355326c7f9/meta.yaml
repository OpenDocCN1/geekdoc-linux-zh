    47 6 * * 7 root test -x /usr/sbin/anacron && anacron (cd / && run-parts --report
    /etc/cron.weekly)

    52 6 1 * * root test -x /usr/sbin/anacron && anacron (cd / && run-parts --report
    /etc/cron.monthly)

