    当我按下 R 键时，我要求带有进程 PID 值。然后可以修改以影响进程的优先级。


    ## 终止进程


    有时，进程消耗了太多的资源，表现出异常的行为，或者死机。表现这种行为的过程通常被称为僵尸进程。对你来说，有很多问题的症状可能是僵尸进程使用的资源，可以更好地分配给空闲的进程。


    当您确定有问题的进程时，您可能希望使用 kill 命令来终止它。有许多杀死进程的方法，每个方法都有自己的命令行选项（数字）。


    kill 命令有 6 种不同的 kill 标记，每个标记都有不同。在这里，我们将重点介绍于您可能会发现最实用的一个参数，kill 标记是 kill-signal。如果你不提供信号标记，默认为
    SIGTERM。能够列出的各种 kill 标记。


    表 6-1: 常用的 kill 标记信号


    | 标识 | 选项参数 | 描述 |

    | :--- | :--- | :--- |

    | SIGHUP | 1 | 这标识为挂起 (HUP) 标记信号。它停止指定的进程并使用相同的 PID 重启动它。 |

    | SIGINT | 2 | 这是终止 (INT) 信号。这是一个弱信号，不能保证工作完成，但在许多情况下有效。 |

    | SIGQUIT | 3 | 这标识为核心转储。它终止进程并将信息保存在内存中，然后将此信息保存在当前工作目录中的一个名为 core 的文件中。（例如的原因）。
    |

    | SIGTERM | 15 | 这是终止 (TERM) 信号。这是 kill 命令的默认信号。 |

    | SIGKILL | 9 | 这是强制终止信号。它将资源发送到 /dev/null 来停止进程。 |


    使用 top 命令，您可以识别哪些进程使用了太多资源，通常这些进程是合法的，但可能有恶意进程使用了资源。如果您只想使用 HUP 重启动进程，请使用 kill
    -1 ，所示：


    ```bash

    kali >kill -1 6996

    ```


    对于恶意进程，您可以发送 kill -9 信号：


    ```bash

    kali >kill -9 6996

    ```


    如果您不知道 PID，可以使用 killall 命令终止进程。例如，您可以停止进程，如下：


    ```bash

    kali >killall -9 process

    ```


    最后，您可以在 top 命令中只需按 K，然后终止 PID。


    ## 在后台运行


    在 Linux 中，无论您使用命令还是在 shell 中工作，所有的命令都是 shell 中执行。执行命令时，shell 会等待完成。有时您可能希望在后台运行而不等待结束。例如假设我们在终端中处理脚本，由于输入在后台运行我们的编辑器
    (leafpad):


    ```bash

    kali >leafpad

    ```


    当然，我们可以另一个终端运行，更好的方法是选择资源和空间是在启动后运行。后台运行会让它持续运行无需结束。要在命令末尾加上 & 符号，如下：


    ```bash

    kali >leafpad &

    ```


    现在，当文本编辑器打开时，终端返回一个新的提示，这样就可以输入其他命令。使用终端运行多个任务都是有效的，节省资源。


    ## 把后台运行进程到前台


    如果要在后台运行进程移动到前台，可以使用 fg (foreground) 命令。fg 需要您回到前台 PID，如下：


    ```bash

    kali >fg 1234

    ```


    如果我们不知道具体的 PID，我们可以使用 ps 命令查看。


    ## 定时执行程序


    Linux 系统管理员和客户都需要安排在特定时间运行进程。例如，系统管理员可以希望安排系统备份在晚上。客户可能希望设置一个脚本定期执行检查端口或漏洞。在 Linux
    中，您可以至少两种方式实现此目的：使用 at 和 cron。


    at 命令（后台运行）对于作业在未来的时刻非常有用。cron 适合安排任务每天、每周或每月，我们将使用在第16 章详细介绍。at 命令的格式有方式。


    表 6-2 定时执行格式


    | 时间 | 含义 |

    | :--- | :--- |

    | at 7:20pm | 计划在晚上 7:20 运行 |

    | at 7:20pm | 计划在晚上 7:20 运行 |

    | at noon | 计划在当天中午运行 |

    | at noon | 计划在当天中午运行 |

    | at tomorrow | 计划在明天运行 |

    | at now + 20 minutes | 计划从当前时间提前 20 分钟运行 |

    | at now + 10 hours | 计划从当前时间提前 10 小时运行 |

    | at now + 5 days | 计划从当前日期提前 5 天运行 |

    | at now + 2 weeks | 计划从当前日期提前 2 周运行 |

    | At 7:20pm 06/25 | 计划在 6/25 晚上 7:20 运行 |


    当您指定的时间进入 at 模式，您会看到 at> 提示。您可以在此处输入在指定时间执行的命令：


    ```bash

    at7:20

    myscript

    ```


    此代码段将安排 myscript 今天执行。


    ## 总结


    管理 Linux 中的每个用户和插件的技能。您必须能够查看，查找，终止让进程以最佳方式运行。用户通常需要在目标上找到进程，例如防病毒软件或防火墙。他们还需要管理中的多个进程并确定优先级。


    # 管理环境变量


    为了充分利用 Linux 来入侵系统，您需要了解环境变量并熟练管理它们，以获得最佳性能、便利性甚至是安全性。然而，在 Linux 中发现问题的领域中，管理环境变量可能是困难的。技术上讲，有两种类型的变量：shell
    和环境变量。环境变量是构建在系统接口中的范围变量，它们控制系统的外观、行为，并且由任何 shell 继承。另一方面，Shell 通常以小写形式列出，并且只在设置
    shell 中有效。为了避免过度解释，我在这一章介绍了环境变量和 shell 变量的一些通用技巧，并没有讨论它们之间的区别。变量只是键值对的字符串。通常看起来像
    KEY=value。大多数系统中，如果值中有空格，则需要包含在引号中。环境变量默认的是 bash shell。每个用户都有一组环境变量，这些环境变量决定了系统的外观、行为。您可以更改这些变量的值，使您的系统有效地工作，如果需要，还可以覆盖迹。


    ## 查看和修改环境变量


    您可以查看所有默认的环境变量，是在终端的任意目录下输入 env，如下：


    ```bash

    kali >env

    ```


    输出：


    ```text

    HOME=/root

    TTY=/dev/pts/0

    USER=root

    PWD=/root

    PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    OLSH_VERSION=3.122

    LC_CTYPE=en_US.UTF-8

    LC_ALL=en_US.UTF-8

    LANG=en_US.UTF-8

    SHELL=/bin/bash

    ...

    ```


    ```，环境变量总是大写的，如 HOME、PATH、SHELL 等。这些只是系统上的默认环境变量。用户还可以创建自己的变量，正如您看到的。


    ## 查看所有环境变量


    要查看所有环境变量，包括 shell 变量、本地变量和 shell 函数（任何用户定义的变量和命令），使用 set 命令。此命令将列出特定的环境变量。在大多数情况下，这些变量将给出长的一串输出，因此无法在单个屏幕上查看所有变量。您可以使用
    set 请求以容易访问的方式查看每个变量，如下：


    ```bash

    kali >set | more

    ```


    现在，变量列表将一行地填充屏幕，然后停止。当你按下键盘时，终端将转到下一行，进入下一个命令。当您更多的输出时，您可以输入 q 来 quit 并返回命令提示。


    ## 特定变量的过滤


    虽然使用 set 和 more 可以单独选择大量变量名称更容易管理，但如果你正在寻找特定的变量，它仍然相当显著。相反，您可以使用过滤命令 grep 查找您感兴趣的变量。我们以
    HISTSIZE 为例。此变量包含命令历史记录中的最大命令数。这些命令是在之前命令提示中使用向上和向下调用。请注意 HISTSIZE 不存储命令本身，只存储命令的数。


    用 grep 你的输出查找 HISTSIZE 变量，如下：


    ```bash

    kali >env | grep HISTSIZE

    ```


    如您见，命令查找 HISTSIZE 并显示其值。此变量的默认值可能在您的系统中设置为1000。最后表示默认存储最后1000命令。

