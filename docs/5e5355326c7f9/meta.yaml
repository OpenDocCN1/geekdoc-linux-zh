    # # 修改文件和目录


    找到文件和目录后，您将希望能够对它们执行操作。在本节中，我们将介绍如何创建文件和目录，复制文件，重命名文件名以及删除文件和目录。


    # ## 创建文件


    有许多方法可以在 Linux 中创建文件，但是我们现在看着两个简单的方法。第一个是 cat。它是连接（concatenate）的缩写，意思是将各个部分组合在一起（不是你最喜欢的的威尔赛科动物）。cat
    命令通常用于显示文件的内容，也可以用于创建文件。要创建更大的文件，最好在编辑器（如 vim, emacs, leappad, edit or kate）输入代码，然后将其保存为文件。


    # ## 使用 cat 连接


    cat 命令后跟一个文件名创建一个文件，但是我们遵循带有重定向的 cat 命令，用 > 符号，以及我们想要创建的文件名称。以下是一个例子：


    ```

    kali > hackskills

    Hacking is the most valuable skill of the 21st century!

    ```


    当您按 ENTER 时，Linux 将进入交互模式并等待您输入该文件的内容。这可能让人理解，因为提示（kali >）消失了，只要你一开始打字，无论你输入什么都会写入文件中（在这种情况下，输入
    hackskills）。在这里，我键入“Hacking is the most valuable skill of the 21st century！”


    退出并返回提示，按下 CTRL-D。当我想查看文件 hackskills 中的内容时，我输入以下内容：


    ```

    kali > hackskills

    Hacking is the most valuable skill of the 21st century!

    ```


    如果您不想使用重定向符号，Linux 将在终端打印文件的内容。要向文件添加更多内容，可以使用带有重定向（>>）的 cat 命令，然后使用想要添加到文件末尾的任何内容。以下是一个例子：


    ```

    kali > hackskills

    Everyone should learn hacking

    ```


    Linux 再次进入交互模式，等待输入内容添加到文件。当我键入“Everyone should learn hacking”并按下 CTRL-D，我到了终端提示。现在，当我用
    cat 显示该文件的内容时，我可以看到该文件已经加上了内容“Everyone should learn hacking”，如下：


    ```

    kali > hackskills

    Hacking is the most valuable skill of the 21st century! Everyone should learn

    hacking

    ```


    如果我想用新内容覆盖文件，我可以简单再次使用 cat 命令和一个重定向符号（>），如下所示：'
  - '[PAGE 38]


    kali > cat hackingskills

    Everyone in IT security without hacking skills is in the dark


    kali > cat hackingskills

    Everyone in IT security without hacking skills is in the dark


    命令的如下：


    ```

    cat > hackingskills    # 是打开或创建一个文件(以人机交互模式)写入内容

    cat hackingskills      #在控制终端上打印文件内容

    ```


    正如您在此处看到的，linux 在交互模式下，输入文本后退回到到提示。当我再次使用 cat 查看文件的内容时，我发现我之前的单词已被最新文本覆盖。


    # 用 touch 创建文件


    文件创建的第二个命令是 touch。此命令最初是用于用户 touch即可更改某些详细信息，例如创建或修改日期。但是，如果该文件不存在，则命令默认情况下会创建文件。


    让我们 touch 创建一个文件名为 newfile:


    ```

    kali > touch newfile

    ```


    现在，当用 ls - 查看目录的列表时，我看到已经创建了一个名为 newfile 的文件。请注意，它的大小为0，因为 newfile 中没有内容。


    # 创建目录


    在 Linux 中创建目录的命令是 mkdir，它是创建目录(directory)的缩写。要创建名为 newdirectory的目录，请输入命令：


    ```

    kali > mkdir newirectory

    ```


    要导航进入这个新创建的目录下，只需要


    ```

    kali > cd newirectory

    ```


    # 复制文件


    要复制文件，我们使用 cp 命令。这将新的位置创建文件的副本，并保留旧文件。


    在这里，我们将使用 touch 在根目录中创建一个文件 oldfile，并将其复制到/root/newirectory，在过程中重命名并保留原始 oldfile:


    ```

    kali > touch oldfile

    kali > cp oldfile  /root/newirectory/newfile

    ```'
  - '[PAGE 39]


    重命名文件是可以的，只需将您想要的名称添加到目录路径的末尾即可。如果在复制文件时不重命名该文件，默认情况下该文件将保留原始名称。


    当我们引导进入 newdirectory 时，我们看到有一个名为 newfile of oldfile 的精确副本:


    ```

    kali >cd newdirectory

    kali >ls

    newfile oldfile

    ```


    # 重命名文件


    不幸的是，Linux 没有专门用于重命名文件的命令（如 Windows 和其他一些操作系统那样），但它确实有 mv (move) 命令。


    mv 命令可以用于移动文件或目录到新的目录位置，或者只是为现有文件指定一个新的名称（重命名）。要将 newfile 重命名为 newfile2，请输入以下内容:


    ```

    kali >mv newfile newfile2

    kali >ls

    oldfile newfile2

    ```


    现在您列出 (ls) 该目录，您会看到 newfile 而不是 newfile，因为因为它已经被重命名。您可以对目录做同样的事情。


    # 删除文件


    要删除文件，只需使用 rm 命令，如下所示:


    ```

    kali >rm newfile2

    ```


    如果您现在在目录下执行列表的 ls 命令，就可以确认该文件已被删除。


    # 删除目录


    删除目录的命令类似于删除文件的 rm 命令，但增加了 dir (用于目录)，如下所示:


    ```

    kali >rmdir newdirectory

    ```


    ```

    rmdir:failed to remove ''newdirectory'': Directory not empty

    ```


    重要的注意的是 rmdir 不删除非空的目录，它会给出一个警告信息“目录不为空” (Directory not empty)”。在删除目录之前，必须先删除目录下的所有内容。这是为了防止意外删除您想要的对象。


    如果您想一次性删除一个目录及其内容，您可以在 rm 之后使用 -r 参数，如下所示:


    ```

    kali >rm -r newdirectory

    ```'
  - '[PAGE 40]


    但需要注意的是：要小心使用-r 选项，至少在开始时，因为错误地删除了有价值的文件和目录非常容易。例如，在主目录 (/) 中使用 rm -r 删除每一个文件和目录
    - 这不是你想要的毁灭性的操作。


