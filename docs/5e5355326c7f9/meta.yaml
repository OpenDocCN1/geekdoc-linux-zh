    ## 9 压缩与归档 (COMPRESSING AND ARCHIVING)


    客户经常需要下载和安装软件以及发送多个文件。如果将这些文件压缩并合并到文件中，那么这些任务就易完成。如果您来自 Windows 世界，可能会从 .zip 格式中认识到这个概念，组合和压缩文件，使其小以便通过互联网传输。在
    Linux 中有很多方法可以做到，在本章我们将介绍一些常用的工具。我们还将查看 dd 命令，它允许您复制整个驱动器。


    ### 压缩什么？


    压缩这个主题本身就可以填一整本书，但是对于书，我们只需要对于这个过程有一个基本的理解。顾名来说，压缩数据更小，可能需要更多的计算，使得数据更容易传输。对于初学者来说，将压缩分类为有损或无损足够了。压缩后的文件大小非常有用，但是会丢失文件的完整性。换句话，这种类型的压缩适用于图形、视频和音频文件，但其中的差异在耳朵中很难察觉。mp3,
    .mp4, .png 等都有压缩算法，例如 png 文件中的一个像素或 mp3 文件中的一个字节会被忽略掉，你的眼睛或耳朵可能注意到其中的差异——音乐爱好者可能会无损和
    flac 之间的差异。有损压缩的优点是它的效率和有效性。压缩是非常高的，这意味着文件比原始文件得多。


    ### 将文件存在一起


    通常，压缩文件要做的第一件事是将合并到归文件中。在很多情况下，在归档文件时，我们将使用 tar 命令。Tar 是捆绑数据的历史时代。tar 命令从许多文件中创建一个归档文件，然后将其命名为归档文件、tar
    文件或 tar 包。


    例如，假设您有三个软件包，我们在第8章使用的这些类，分别为 hackers1、hackers2 和 hackers3。如果您切换到保存它们的目录并执行列表，您可以清楚地看到文件和信息，文件的大小如下：


    ```

    kali ~$ ls -l

    -rwxrxr-xr-x root root 22311 Nov 27 13:00 hackers1.sh

    -rwxrxr-xr-x root root 89711 Nov 27 13:08 hackers2.sh

    -rwxrxr-xr-x root root 3992 Nov 27 13:08 hackers3.sh

    ```


    假设您将所有这三个文件发送给您工作的另一个客户。您可以使用清单 9-1 中的命令创建一个归档文件。


    ```

    kali ~$ tar -cvf hackersArchive.tar hackers1 hackers2 hackers3

    ```


    9-1: 创建包含三个文件的 tar 包


    让我们分解这个命令以更好地理解它。归档命令是 tar，我们在这里使用了三个参数选项。c 选项创建，v 代表详细过程，是可选的 tar 创建的文件，f 代表写入文件。最后一个选项适用于文件读取。然后，我们为新归档文件提供您希望的三个脚本的文件名：HackersArchive.tar


    总之，这个命令将获取所有三个文件，并创建一个完整的单一文件 PackersArchive.tar。当您对目录执行行长列表列出所有文件时，您将看到它也包含了tar
    文件，如下所示：


    ```

    kali > ls -l

    --snip---

    rw-xr-r-- 1 root 40960 Nov 27 2018 hackersArchive.tar

    --snip---

    ```


    注意 tar 的大小：40960 字节。在三个文件时，tar 使用大量的来执行此操作：在归档之前，三个文件的总和是 35094 字节，在归档之后，增长到了
    40960 字节。我们可以使用 tar 命令和 -t 列表参数从 tar 中显示这些文件，而不需要提取它们，如下：


    ```

    kali tar -tvf hackersArchive.tar

    -rw-xr-x 1 root 22311 Nov 27 13:00 hackers1.sh

    -rw-xr-x 1 root 87911 Nov 27 13:00 hackers2.sh

    -rw-xr-x 1 root 3992 Nov 27 13:00 hackers3.sh

    ```


    在这里，我们看到三个原始文件和它们的原始大小。然后您可以使用 tar 命令和 -x (extract) 选项从包含中提取这些文件，如下：


    ```

    kali tar -xvf hackersArchive.tar

    hackers1.sh

    hackers2.sh

    hackers3.sh

    ```


    由于您仍在使用 -v 参数，所以这个命令将在输出中提取哪些。如果您想提取文件并“静默”，这样做意味着不显示任何输出，您可以简单：


    ```

    kali tar -xf hackersArchive.tar

    ```


    这些文件已经被提取到当前目录下，您可以在目录下执行列表列表来进行重新检查。请注意，默认情况下，如果提取的文件已经存在，tar 将删除现有文件并用提取的文件替换。


    ### 压缩文件


    现在我们有一个归档文件，但是这个文件比原始文件的总和还要。如果您想压缩这些文件方便，Linux 有几个命令可以压缩文件。我们来看这些：


    - gzip, 使用扩展名 .tar.gz 或 .tgz

    - bzip2, 使用扩展名 .tar.bz2

    - compress, 使用扩展名 .tar


    这些都可以压缩的文件，但它们使用的算法和不同的压缩比。因此，我们将看到每一种以及它的能力。通常，compress是最快的，但是生成的文件更大的；bzip2是最慢的，但是生成的文件是最小的；gzip
    介于两者之间。作为一个初学者 Linux，您应该了解这三种方法的主要原因是，在访问其他工具时，您将遇到不同类型的压缩。因此，本节将为您展示如何处理压缩的方法。


    ### gzip 压缩


    让我们尝试 gzip (GNU)。它是 Linux 中常用的压缩程序。您可以通过输入以下命令来压缩 Archive.tar 文件（假设保存在您的存档文件中）。


    ```

    kali gzip Archive.*

    ```


    注意，我们对文件名使用了通符 *，这说明 Linux 命令应用于任何文件名结尾的文件。在接下来的例子中，您将使用类似的符号。当我们对目录列表格式查看时，可以看到
    Archive.tar 已经被 Archive.tar.gz 所压缩。文件大小已经压缩到 3299 字节


    ```

    kali ls -l

    --sn-

    rw-r--r-- 1 root root 3299 20172018 13:33 Archive.tar.gz

    ```


    然后，我们可以使用 gzip 命令（GNU 压缩的）解压缩该文件。


    ```

    kali > Archive.*.*

    ```


    解压缩后，不再使用扩展名 .tar.gz 而是 tar 扩展名。另外，请注意，它已经返回到了原始的大小 40,960 字节。尝试用列表格式来确认这一点。值得的是，gzip
    还可以用于提取。


    ### bzip2 压缩


    Linux 中另一个常用的压缩程序是 bzip2，它的工作原理类似于 gzip，但是具有更好的压缩比，意味着生成的文件更小。您可以通过以下命令来压缩 Archive.tar
    文件：


    ```

    kali bzip2 Archive.*

    ```


    当您用列表格式列出文件，你可以看到 bzip2 将文件压缩了 2,081 字节！还要注意，文件扩展现在是 tar.bz2。


    要压缩的文件，使用 bzip2。如下所示：


    ```

    kali bzip2 Archive.*

    ```


    当您这样做时，文件将返回其原始大小，其扩展名将返回为 tar。


    ### 用 compress 压缩


    最后，可以使用命令 compress 压缩文件。这可能是最不常用的压缩程序，但是很容易记住。使用它，只需输入命令 compress 和文件名，如下：


    ```

    kali compress Archive.*

    kali ls -l

    --snip--

    -rw-r--r-- 1 root root 5476 Nov 27 2018 Archive.tar.Z

    ```


    注意，compress 实用程序将文件的大小减少到 5,476 字节，是 bzip2 的两倍多。还要注意，文件扩展名在 tar.Z (大写)。


    若要解同一文件，请使用 uncompress:


    ```

    kali uncompress Archive.*

    ```

    '
  mdcn: '


    一行显示我们输出的 MySQL 文件，然后输出到 grep 的管道，通过过滤包含关键字 open（开放）的所在。我们将这些字符放到一个名为 MySQLscan2
    的文件中。


    最后，显示文件 MySQLscan2 的内容。此最终文件应该包含 nmap 的输出，其中包含端口 3306 的主机。将此文件另存为 MySQLscanner.sh
    并使用 chmod 755 赋予自己执行权限。


    执行脚本，如下所示:


    ```

