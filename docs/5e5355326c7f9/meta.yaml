    更好、更安全的解决方案是分解文件。对于其他删除系统，我们的的调查员仍然可以恢复已删除的文件，但是假设有一种方法可以删除文件并多次覆盖，这使得恢复变得更加困难。幸运的是，Linux
    下有一个内部命令，名为 shred，正是为了这个目的的。


    要了解 shred 命令是如何操作的，请输入以下命令查看帮助：


    ```

    kali >shred --help


    Usage: shred [OPTION]...FILE...


    Overwrite the specified FILE(s) repeatedly in order to make it harder

    for even very expensive hardware to recover data

    --snip--

    ```


    从屏幕的完整输出可以看到，shred 命令有许多选项。它最基本的形式，语法是简单的：


    ```

    shred <FILE>

    ```


    就此而言，shred 会删除文件并多次覆盖——默认情况下，shred 会覆盖 4 次。通常，文件被覆盖的次数越多，恢复就越来越困难，但是请记住，每次覆盖都需要时间，由于对于非常大的文件，碎片可能会很耗时；

    可能包括两个用的选项，一个是 -f 选项，它更改文件的权限，在需要需要更改权限时允许覆盖；另一个是 -n 选项，它允许你选择覆盖文件的次数。例如，我们将使用以下命令将/var/log/auth.log
    中的日志文件分解 10 次：


    ```

    kali >shred -f -n 10 /var/log/auth.log.*

    ```


    我们需要某些选项来允许我们碎片化 auth 文件，然后我们按照 -n 指定要覆盖的次数。在我们要碎片化的文件路径之后，我们包含通配符星号，因此我们不需要碎片化
    auth 文件，还要覆盖使用 logrotate 创建的旧日志，如 auth.log.1,auth.log.2，以此类：


    现在尝试打开一个日志文件：

    kali >leaf /var/log/auth.log


    > 您打开一个文件，您将看到看到的内容是凌乱的，如图 11-1 所示。


    ![](img/77055846b6e5bd43c939d5fb384e34d6_127_0.png)


    图 11-1：覆盖的日志文件


    现在，如果工程师或取证调查员检查日志文件，他们将发现没有任何用处，因为没有一个是可恢复的!'
