    ```

    wlan0 IEEE 802.11bg ESSID:off/any

    Mode:Managed Access Point:Not-Associated Tx-Power=20 dB

    Retry short limit:7 RTS thr:offoff Fragment thr:off

    Encryption key:off

    Power Management:off

