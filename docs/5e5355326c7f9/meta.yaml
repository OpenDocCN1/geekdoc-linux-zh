  md: '# PostgreSQL 与 Metasploit


    PostgreSQL，或 Postgres，是另一个开源关系数据库，由于它能够轻松扩展并处理重的工作负载，因此非常适合互联网应用程序。它于 1996 年 7
    月发布，由一大批使用 PostgreSQL 全球开发的开发者维护。


    默认情况下，PostgreSQL 也安装在 Kali 中，如果您使用的是另一个 Linux 发行版，它可能会不在存储库中，您可以通过输入以下命令来：


    ```

    kali > apt-get install postgres

    ```


    作为一名，你会发现 PostgreSQL 特别重要，因为它是最广泛使用的渗透测试和攻击框架 Metasploit 的默认数据库。Metasploit 使用
    PostgreSQL 存储模块，以及扫描和利用的结果，便于在渗透测试或黑客攻击中使用。由于这个原因，我们会在 Metasploit 的上下文中 PostgreSQL。


    与 Linux 的几乎版本一样，我们可以通过输入服务来启动 PostgreSQL应用程序启动，如下：


    ```

    kali >service postgresql start

    ```


    随着 PostgreSQL 的启动和运行，让我们启动 Metasploit：


    请注意，当 Metasploit 完成后，你将看到 msf>提示。


    教您如何使用 Metasploit 进行黑客攻击和开发的超出了本本书的范围，但在在这里我们将建立Metasploit将其信息存储在中的数据库。


    在 Metasploit 运行的情况下，我们可以使用以下命令设置 PostgreSQL，以便它存储来自系统上任何Metasploit 活动的数据：


    ```

    msf >msffdb init

    ```


    ```

    * exec :msffdb init

    ```


    Creating database use ''msf''


    Enter password for new role


    Enter it again:


    Creating databases ''msf'' and ''msf_test''


    Creating configuration file /usr/share/metasploit-framework/config/database.yml


    Creating initial database schema


    接下来，我们需要用 root 登录 PostgreSQL。在这里，我们在命令前面加上 su，即“switch user”命令，以获取 root 权限：


    ```

    msf >su postgres

    ```


    ```

    [] su postgres

    ```


    ```

    postgres@kali:root#

    ```'
