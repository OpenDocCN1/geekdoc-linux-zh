    # Set up users and passwords


    You need to set a password for ''root'', the system administrative account. A
    malicious or unqualified user with root access can have disastrous results, so
    you should take care to choose a root password that is not easy to guess; it should
    not be a word found in dictionaries, or a word that could be easily associated
    with you.


    A good password will contain a mixture of letters, numbers and punctuation and
    should be changed at regular intervals.


    The root user should not have an empty password. If you leave this empty, the
    root account will be disabled and the system''s initial user account will be given
    the power to become root using the ''sudo'' command.


    Note that you will not be able to see the password to verify that you have typed
    it.


