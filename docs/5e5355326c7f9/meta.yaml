    | 8 Overclock | Configure overclocking for your Pi |

    | 9 Advanced Options | Configure advanced settings |

    | 0 About raspi-config | Information about this configuration |


    <Select> <Finish>


    图 12-3: Raspberry Pi 配置工具


    向下滚动至 6 启用相机（Enable Camera），然后按 ENTER。现在，滚动到此菜单的底部选择 Finish 并按 ENTER，如图 12-4 所示。


    图 12-4: 完成配置


    当配置工具询问您是否需要重新启动时，如图 12-5 所示，选择 Yes，然后再次按 ENTER。


    图 12-5: 重新启动 Pi 以启用更改。


    现在你的 Raspberry Spy Pi 应该启用并准备好进行课程活动了！


    ## 启动 Spy


    一旦您的 Raspberry Spy Pi 重新启动并且已经从 Kali 终端通过 SSH 登录，您就可以开始使用它来拍摄静态照片了。


    Raspian 操作系统有一个名为 raspill 的应用程序，我们将使用它来拍摄我们的小 Raspberry Pi 中的照片。在终端中输入 raspill
    以查看工具的帮助及其所有选项：


    ```bash

    pi@raspberry: raspill

    raspistill Camera App v1.38

    Runs camera for specific time, and takes JPG at end if requested

