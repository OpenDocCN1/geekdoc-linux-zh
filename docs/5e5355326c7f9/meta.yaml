    黑客是领域的精锐，它需要对 IT 概念和技术进行广泛和详细的理解。在基础的层次，Linux 是一项需求。如果你想把黑客和安全作为你的职业，我强烈建议你投入时间和精力来使用和理解它。


    本书适合经验丰富的黑客或经验丰富的 Linux 管理。


    相反，它适用于那些想要在黑客、网络安全和渗透这项动人心的道路上起步的人。它也不是一篇关于 Linux 或黑客的完整教程，而是世界的起点。从 Linux 的基础知识开始，并扩展
    bash 和 Python 的一些脚本。


    在适当的情况下，我尝试使用来自黑客世界的例子来教 Linux 原理。


    在本介绍中，我们将介绍安全的道德黑客行业的发展，我将带你完成安装虚拟机的过程，以便你可以在系统上安装 Kali Linux，而不会打扰你正在运行的操作系统。


