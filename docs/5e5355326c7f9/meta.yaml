    清单 5-1:使用ls -l 命令检查文件的权限


    我们获取有关内容内容的信息：


    +   - 文件类型

    - 所有者，和用户所属的文件权限

    - 链接数量（主题超出了本书的范围）

    - 文件所有者

    - 文件的大小（以字节为单位）

    - 文件创建或上次修改时间

    - 文件名


    现在，让我们关注线条开头那些似乎难以理解的字母和短线。它们告诉我们一个项目还是目录，以及它上面拥有哪些权限。


    第一个字符定义的权限。它有三个字符，由 read (r), write (w) 和 execute (x) 的某种组合组成。第一组代表所有者的权限，第二组代表用户所属的权限以及最后一组，代表所有用户的权限。'
