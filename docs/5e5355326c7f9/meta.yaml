    正如你所看到的，ifconfig 显示了某些网络接口的一些有用信息。在输出的顶部，第一个连接的接口名称 eth0 是有线接口。如果这里有更多的网卡，它们将使用相同的格式（eth1,\
    \ eth2 等）。接下来就是使用的网络类型（以太网），然后是 hwaddr，这是在每个硬件设备上唯一的物理地址。在这种情况下，wlan0 是 network\
    \ card（NIC），通常是媒体访问控制（MAC 地址）。第二行包含当前配置的 IP 地址信息（本例中为 192.168.1）；其次是 Bcast 或者“广播”，用于向网络发出地址。最后是子掩码（Mask），用于确定\
    \ IP 地址到本地网络。你还可以在输出的这一部分找到另一个名为 lo 的连接，它是回环地址（loopback address）的缩写，并且带有本地属性。这是一个特殊的特征，可以帮助你连接到自己。在未在系统上运行的和服务无法使用，你可以使用\
    \ lo 在你的系统中条目内作为自己的服务器。本地主机通常使用 IP 地址 127.0.0.1。第三连接是 wlan0。当你有一个无线连接或适配器时，才会出现这种情况。请注意，它会显示该设备的\
    \ MAC 地址。\n\n来自 ifconfig 的这些信息有助于连接和局域网（LAN）设置，这是内网攻击的基本信息。\n\n## 使用 IFCONFIG\
