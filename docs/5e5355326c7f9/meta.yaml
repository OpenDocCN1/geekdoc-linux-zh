  md: '登录 Postgres 时，您会看到提示已改为 postgres@kali:/root#，表示应用程序、主机名和用户。


    在下一步中，我们需要创建用户和密码，如下所示：


    ```

    postgres@kali:/root# createuser msf_user


    Enter Password for new role:


    ter it again:

    ```


    我们使用带有 createuser 命令的 -P 选项创建用户名密码两次。然后接着，我们需要创建数据库为 msf_user 授予权限。将数据库命名为 hackers_arise_db，如下：


    ```

    postgres@kali:/root# createdb owner=msf_user hackers_arise_db


    postgres@kali:/root# exit

    ```


    当您使用 exit 命令退出 Postgres 时，终端将回到 msf# 提示。


    接下来，我们将通过定义以下内容来连接我们的 Metasploit 控制台 console 到 PostgreSQL 数据库：


    +   * user

    * password

    * host

    * database name


    在我们的例子中，我们可以使用以下命令 msconsole 连接到我们的数据库：

    msf_db_connect msf_user:password@127.0.0.1/hackers_arise_db


    当然，您需要提供之前的密码。IP 地址是本地系统 (localhost) 的 IP 地址，因此除非在远程系统中构建此数据库，否则使用 127.0.0.1。


    最后，我们可以检查 PostgreSQL 数据库的状态以确保已连接：

    msf >db_status


    > *] postgresql connected to msf


    您所见，Metasploit 响应来自 PostgreSQL 数据库已连接并可以使用。现在，当我们使用 Metasploit 进系统扫描或运行漏洞检测时，结果存储在
    PostgreSQL 数据库中。此外，Metasploit 现在将其模块存储在 Postgres 数据库中，使得搜索正确的模块变得更加容易和快捷！'
