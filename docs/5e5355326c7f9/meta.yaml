    ## 给新程序赋予 root 权限


    作为黑客，你经常需要下载新的工具，但 Linux 会自动分配所有文件和目录的默认权限 666 和 777。这意味着，默认情况下，你下载的文件将无法执行。如果你尝试，通常会得到一条写着“Permission
    denied”（拒绝访问）的消息。对于这些情况，你需要给自己一个 root 身份并使用 `chmod` 赋予执行权限。


    例如，假设我们下载了一个名为 `newhacktool` 的新工具，将其放入 root 用户的目录 (/) 中。


    ```

    kali >ls -1


    total 80

    drwxr-xr-x 7 root root 4096 Dec 5 11.17 Desktop

    drwxr-xr-x 7 root root 4096 Dec 5 11.17 Documents

    drwxr-xr-x 7 root root 4096 Dec 5 11.17 Downloads

    drwxr-xr-x 7 root root 4096 Dec 5 11.17 Music

    -rw-r--r-- 1 root root 1072 Dec 5 11.17 newhacktool


    drwxr-xr-x 7 root root 4096 Dec 5 11.17 Pictures

    drwxr-xr-x 7 root root 4096 Dec 5 11.17 Public

    drwxr-xr-x 7 root root 4096 Dec 5 11.17 Templates

    ```


    我们可以看到 `newhacktool` 以及根目录下的其他内容。我们可以看到我们的 `newhacktool` 没有任何执行权限，这使得它无法使用。可能看起来很奇怪，默认情况下
    Linux 不允许你执行下载的文件，但认为，此设置会让你的系统更安全。


    我们可以通过输入以下内容来允许自己执行 `newhacktool`：


    ```

    kali >chmod 766 newhacktool

    kali >ls -1


    total 80

    drwxr-xr-x 7 root root 4096 Dec 5 11.17 Music

    -rw-rw-rw- 1 root root 1072 Dec 5 11.17 newhacktool

    drwxr-xr-x 7 root root 4096 Dec 5 11.17 Pictures

    ```


    现在，我们在目录下列出列表时，我们可以看到我们的 `newhacktool` 具有所有者的执行权限：


