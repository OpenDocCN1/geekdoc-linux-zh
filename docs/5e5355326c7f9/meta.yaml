    图 1-4: Linux 系统的根 (/)位于文件系统目录的顶部，以下是需要了解最重要的目录：


    +   /root root用户的目录

    /etc 通常包含 Linux 配置文件 - 控制程序启动时间和运行方式的文件

    /home 用户的目录

    /mnt 包含其他文件系统附加或安装到文件系统的位置

    /media 和 USB 设备通常连接或安装到文件系统的位置

    /bin 包含所有应用程序二进制文件（相当于 Microsoft Windows中的可执行文件）

    /lib 库文件（与 Object 类的共享程序）


    在书中，我们将花费更多时间在这些关键目录上。了解这些目录对于从命令引导文件系统非常重要。

    在开始之前，知道在执行任何操作不要以 root 用户登录也是重要的，因为当你以 root 身份登录时，任何攻击你系统的人的（如：管理员）有机会会被黑客入侵，并立即获得
    root 权限，从而“拥有”你的系统。在启动常规程序、浏览 Web、使用 Wireshark 等工具时使用用户身份登录。


    # LINUX 基本命令


    首先，我们将看看一些基本命令，它们将帮助你在 Linux 中启动和运行。


    # 用pwd 查看当前目录


    与在 Windows 或 macOS 等图形用户界面 (GUI) 环境中工作不同，Linux 中的命令并不总是能够明确显示你当前所在的位置。要导航到目录，通常需要知道你现在的位置。显示当前目录使用命令
    pwd。

    在目录结构中的位置 pwd。在您的输入终端密码以查看的所在目录位置：'
