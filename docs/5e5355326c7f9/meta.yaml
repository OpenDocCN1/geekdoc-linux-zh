  md: '意味着相同的硬盘驱动可能在不同的时间有的标签，取决于它挂载的位置。


    最近，Linux 将软驱动（还记得吗？）称为 fd0，将硬盘驱动显示为 sda。您是否偶尔发现 Linux 系统上这些硬盘驱动表示，但是许多软驱动都消失了（吐槽她）。即使如此，使用
    IDE 或 E-IDE 接口的遗留驱动可能是 hda 的形式。新的 ATA (SATA)接口驱动和小计算机接口(SCSI)硬盘驱动被标记为 sda。新驱动会被被划称为分区的一部分，这些部分在标记系统中用中字符表示，您在下节中看到吗？


    当系统有多个硬盘驱动时，Linux 通过字母顺序顺序最后一个字母来命名它们，因此第一个驱动是 sda，第二个驱动是 sdb，第三个驱动是 sdc，等（参见表
    10-1）。sd 后的连续字母通常被赋值为主分区。


