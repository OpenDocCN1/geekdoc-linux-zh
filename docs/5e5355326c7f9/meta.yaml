  md: '# 建立 TCP 客户端


    我们将使用接字(socket)模块在 Python 中创建一个网络连接。我已经提到过 Python 带了一个用于执行大量任务的模块。在这种情况下，我们需要
    socket 模块创建 TCP 连接。让我们来看看它的实际效果。


    看一下名为 HackersAriseSSHBannerGrab.py 的脚本 17-3 中的代码（我知道，这个名字很长，但请不要呆），banner 是当某人或某连接到它时程序发送的内容。它像发送问候的程序一样，宣布它是什么。客户使用这种称为
    banner 的获取的名称来查找端口上运行的应用程序或服务的信息。


    ```

    # /usr/bin/python3

    import socket

    s = socket.socket()

    s.connect(("192.168.1.101", 22))

    answer = s.recv(1024)

    print(answer)

    ```


