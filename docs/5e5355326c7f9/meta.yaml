    # 赋予默认的安全级别


    如您所见，Linux 默认分配权限（通常为 666 和目录 777）。您可以使用 umask（或 unmask）方法来给每个用户创建的文件和目录的默认权限。umask
    方法从文件或目录的基本权限中删除所需的权限，使其更安全。


    umask 是对应三个权限字符的十进制数字，但是权限掩码中包含了 umask 编号所提供的权限状态。这意味着当创建新文件或目录时，它们权限为默认值减去 umask
    中的值，如图 5-1所示。


    | New files | New directories |

    | --- | --- |

    | 666 | 777 |

    | -022 | -022 Linux base permissions |

    | -644 | 755 Resulting permissions _ |


    图 5-1: umask 值 022 如何影响文件和目录的权限


    例如，如果 umask 设置为 022，则具有原始权限 666 的新文件将在具有权限 644，这意味着所有者读取和写入权限，并且且对其他用户只有读取权限。


    在 Kali 中，对于大多数 Debian 系统，umask 默认配置为 022，这意味着 Kali 值为 644，文件为 755，目录为 755。


    umask 值对于系统上的所有用户是不通用的。每个用户都可以个人的 .profile 文件的目录设置默认权限 umask 值。要用用户登录时查看当前，只需要运行命令
    umask 并记录返回的内容。要更改 umask 值，可以编辑 /home/username/.profile，例如，添加 umask 007 进行设置，以便只有用户和用户组具有自己的权限。


    # 特殊权限


    除了三个通用权限 rwx，还有三个特殊权限，稍微复杂一些。这些特殊权限是设置用户 ID (或 SUID)，设置组 ID (或 SGID)。我将在接下来的部分中依次介绍每个权限。


