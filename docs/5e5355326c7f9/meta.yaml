    # 用 compress 压缩


    最后，可以使用命令 compress 压缩文件。这可能是最不常用的压缩程序，但是很容易记住。使用它，只需输入命令 compress 和文件名，如下：


    ```

    kali >compress HackersArise.*

    kali >ls -l

    --snip--

    -rw-r--r-- 1 root 5476 Nov 27 2018 HackersArise.tar.Z

    ```


    注意，compress 实用程序将文件的大小减少到5,476 字节，是 bzip2 的两倍多。还要注意，文件扩展名在tar.Z(大写)。


    若要解同一文件，请使用 uncompress:


    ```

    kali >uncompress HackersArise.*

    ```


    还可以使用 compress 压缩的文件使用 gzip 命令。


    # 创建存储设备的逐一物理副本


    在信息和安全的世界里，一个 Linux 复制命令在实用方面胜过其他命令。dd 命令可以逐个恢复文件、文件系统，甚至是整个磁盘驱动器。这意味着即使删除也会被复制（是的），重要的要在您删除文件的操作是可恢复的！以便于检索和恢复，大数据复制程序(dd)不会复制已删除的文件。


    一旦有了目标系统，dd 命令将允许您将整个磁盘驱动器或存储设备复制到他们的系统。此外，那些想要抓住入侵人的——可能会使用此命令来制作硬盘驱动器的物理副本，其中包含已删除的文件和其他可能有助于您找回受证的数据。


    需要注意的是，dd 命令不适用于典型的文件和存储设备的日常复制，因为它非常慢，其他命令执行起来更快、更有效。但是，当您需要一个没有文件系统或其他逻辑结构的存储设备的副本时（例如在取证时），


    dd 命令的基本语法如下：


    ```

    dd if=input of=outfile

    ```


    因此，如果您想为您的从磁盘驱动器创建一个物理副本，假设磁盘驱动器是 sdb(我们将在第 10 章详细讨论该名称)，请您输入以下内容：


    ```

    kali >if=/dev/sdb of=/root/image 1257441= records in

    ```'
