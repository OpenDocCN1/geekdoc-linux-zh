    和 bat 而不是 what，因为文件名中 ? 在前面有两个字母。[] 通配符用于匹配括号内显示的字符。例如，[cb] 会匹配 cat 和 bat 而不是
    hat 或什么。通配符是星号 (*)常用的通配符是星号 (*)，它通配任何长度的任何字符，从无字符到无限数量的字符。例如，搜索* 会找到 cat, hat,
    bat 以及 what。


