    ## 给新程序赋予root权限


    作为骇客，你经常需要下载新的工具，但 Linux 会自动分配所有文件和目录的默认权限 666 和 777。这意味着，默认情况下，你下载文件将无法执行它。如果你尝试，你通常会得到一条消息，上面写着“Permission
    denied”。对于这些情况，你需要给自己一个 root 身份并执行，使用 chmod 执行文件的权限。


    例如，假设我们下载了一个名为 newhacktool 的新工具，将其放入 root 用户的目录 (/) 中。


    ```

