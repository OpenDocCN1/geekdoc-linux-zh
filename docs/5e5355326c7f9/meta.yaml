    # # 使用 RC 脚本任务


    当你启动 Linux 系统时，都会运行一些脚本来配置环境。这些脚本就是 rc 脚本。在内核初始化加载了所有模块之后，内核会启动一个守护进程叫做 init 或
    init.d。这个守护进程开始运行 /etc/init.d/rc 中一些脚本。这些脚本将一些，用于启动运行 Linux 所需要的服务。


    # # Linux 运行级别


    Linux 有多个运行级别，用于指定启动时需要运行哪些脚本。例如，运行级别 1 是单用户工作状态，类似于网络一样的服务是不运行级别，rc 脚本会根据运行级别运行。


    +   0 系统初始化状态


    +   1 单用户工作状态


    +   2 - 多用户工作状态


    +   6 重启


    # # 将服务添加到 rc.d


    你使用 update-rc.d 命令向 rc.d 添加添加时要运行的服务。这个命令允许你从 rc.d 中添加或删除服务。update-rc.d 的语法如下，输入命令，后面输入脚本的名字然后输入命令，像这样：


    ```

    kali | update-rc.d <name of the script or service>

    <remove|disable|enable>

    ```


    举个 update-rc.d 的例子，假设你总是希望 PostgreSQL 数据库在系统启动时运行，这样的 Metasploit 框架可以使用它存储攻击缓存和渗透测试的结果。你需要使用
    update-rc.d -一到行的 rc.d 脚本来让它每次系统启动运行。'
