    Snort 所需的几个依赖项或库。现在您正在删除 Snort，不再需要其他库或依赖项，因此删除了它们。


    # 更新软件


    软件需要定期使用新软件或现有软件的新版本进行更新。这些更新不会自动进行，因此您必须手动请求更新它们，以确保这些更新应用到您的系统中。更新 (update)
    与升级 (upgrade) 不同：更新是从存储库的软件包列表中，而升级将软件包提升到存储库中。


    您可以通过输入 apt-get 命令并关键字来更新您的软件。这将搜索系统上的所有软件包检查是否更新。如果是，则下载更新（见清单 4-5）。


    ```

    kali >apt-get update

    Get:1 http://mirrors.ocf.berkeley.edu/kali kali-rolling InRelease [30.5kb] Get:2

    http://mirrors.ocf.berkeley.edu/kali kali-rolling/main amd64 Packages

