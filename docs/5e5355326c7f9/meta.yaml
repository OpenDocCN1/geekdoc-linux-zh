    从你的系统扫描和连接到其他网络的能力对于成为一名成功的客户至关重要，并且随着 WiFi（IEEE 802.1）和蓝牙等无线技术成为标准，寻找和控制 WiFi
    和蓝牙连接是关键。如果有人可以破解无线连接，他们可以进入设备并访问机密信息。当然，第一步是学习如何找到这些设备。


    在第 3 章中，我们研究了 Linux 中的一些基本网络命令，包括无线网络的一些原理，并承诺在第 14 章中提供更多的无线网络知识。正如所承诺的，我们将研究两种
