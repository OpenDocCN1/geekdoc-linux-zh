    在某些情况下，你可以希望使用其他 DNS 服务器。为了这样做，你将编辑一个操作系统名为 /etc/resolv.conf 的纯文本文件。使用文本编辑器打开这个文件——这里使用
    Leafpad。然后，在你的命令行输入你选择的编辑器的名称并在后面加上的位置和文件名。例如：


    ```

    kali > leafpad /etc/resolv.conf

    ```


