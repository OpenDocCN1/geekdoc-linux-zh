    在任何时候，Linux系统通常同时运行数百个，甚至数个进程。进程只是一个正在运行和使用资源的程序。它包括终端、Web 服务器、任何正在运行的命令、任何数据库、GUI
    界面等。任何优秀的 Linux 管理（特别是顾客）都需要了解如何管理他们的流程来优化他们的系统。例如，一旦客户控制了目标系统，他们可能想要找到并停止某个进程，如防病毒应用程序或防火墙。为此，客户首先需要知道如何找到该进程。客户可能还想要一个扫描脚本来定期运行以查找受攻击的系统，因此我们还将研究如何安排这样的脚本。


