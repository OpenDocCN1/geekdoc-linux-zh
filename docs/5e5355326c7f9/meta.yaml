    # # 总结


    内核对于操作系统的整体操作至关重要，因此它是一个受保护的区域。任何无意中添加到内核中的东西可能破坏操作系统导致失去控制。


    LKM 使系统管理员能够直接添加模块到内核中，而不是每每次添加模块时都重新构建整个内核。


