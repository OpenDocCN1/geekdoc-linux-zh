  md: "# 使用 IFCONFIG 分析 网络\n\nifconfig 命令是检测活动网络接口与与之交互基本的工具之一。你可以简单在终端（terminal）输入网络接口。ifconfig\
    \ 命令来查询你的网络连接状态。请自己尝试一下，你应该看到和清单 3-1 相似的输出。\n\n+   * ifconfig\n* eth0 linkencap:EthernetHWaddr\
    \ 00:0c:29:ba:82:0f\n* inet addr:192.168.1.131 Bcast:192.168.1.255 Mask:255.255.255.0\n\
    \  -- snip --\n* lo linkencap:Local Loopback addr 127.0.0.1 Mask:255.0.0.0\n \
    \ -- snip --\n* wlan0 linkencap:EthernetHWaddr 00:0c:ca:3f:ee:02\n\n清单 3-1: 使用\
    \ ifconfig 获取网络信息\n正如你所看到的，ifconfig 显示了某些系统活动网络接口的一些有用信息。在输出的顶部第一个正在连接的接口的名称 eth0\
    \ 它是 Ethernet 的写法（Linux 开始计数不是 1）。这是第一个有线连接接口。如果这里有更多的网卡，它们将使用相同的格式（eth1, eth2\
    \ 等）。\n\n接下来就是正在使用的网络类型（Ethernet 以太网），然后是 HWaddr 和一个地址，这是在每个硬件设备上都是唯一的物理地址。在这种情况下，wlan0\
    \ network interface card（NIC），通常是媒体的质性访问控制（MAC 地址）。\n第二行包含当前配置的 IP 地址信息的接口（本例中\
    \ 192.168.1.131）；其次是 Bcast 或者“广播”，用于向网络的 IP 发出的地址的最后是子掩码（Mask），用于确定 IP 地址的头部连接到本地网络。你还可以在输出的这一部分找到另一个名为\
    \ lo 的网络连接，它是回环地址（loopback address）的缩写，并且带有本地属性。这是一个特殊的特征，可以帮助你连接到自己。在未在系统上运行的软件和服务无法使用。你可以使用\
    \ lo 在你的系统中某些条目内，可以作为自己的服务器。本地主机通常使用 IP 地址 127.0.0.1 表示。\n\n第三连接是 wlan0。只有当你有一个无线网络连接或适配器时，才会出现这种情况。请注意，它会显示该设备（HWaddr）的\
    \ MAC 地址。\n\n来自 ifconfig 的这些信息有助于连接和局域网（LAN）设置，这是内网攻击的基本信息。\n\n# 使用 IFCONFIG 检查无线网络\n\
    \n如果你有一个无线网络适配器，你可以使用 ifconfig 命令收集无线攻击的关键信息，如果适配器（网卡的）的 IP 地址，MAC 地址，它所处的模式等。当你使用像rack-ng\
    \ 这样的网络攻击工具时，你可以从该命令中收集特殊的信息。"
