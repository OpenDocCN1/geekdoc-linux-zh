  md: '# rotate 1


    清单 11-3:logrotate 配置文件


    第一，你可以设置的单位时间数字①。这里的值是 weekly，这意味着 rotate 键值之后的任意数字都是 weeks（周）。


    进一步向下看，你可以看到设置切割转日日志默认的频率为四个星期轮日②。这个默认对于大多数应用都适用，但是如果您想让日志更长一些，以便进行调查，或者短一些，以便更快清理它们，那么您应该更改该设置。例如，如果您每周检查日志文件并希望节省空间，可以将此设置为
    rotate 1。如果您的日志有足够的空间，并且希望保留半年记录以便以后进行取证分析，那么您可以将切割设置为 rotate 26 天任意日志，或者将 rotate
    52 更改更长的日志。


    默认情况下，创建一个新的日志作为旧日志。在配置文件中，您也可以选择压缩日志③。


    在每个日志周期结束时，将重命名日志文件，并在新的日志文件中将其移动到日志的末尾，替换当前日志。例如，/var/log/auth.log 变为 /var/log/auth.1，var/log/auth.2，以此类推。如果您每周轮一次日志，并保留四个文件，那么您将得到/var/log/auth.4，但是没有被轮到/var/log/auth.5。您可以使用
    locate 命令来查找 /var/log/auth.log 的 log 文件，并使用通配符，如下所示：


    ```

    kali >/var/log/auth.log.*


    /var/log/auth.1

    /var/log/auth.2

    /var/log/auth.3

    /var/log/auth.4

    ```


    有关自定义和使用 logrotate 程序的许多方法的详细信息，请参见 man logrotate 页面。这是一个很好的资源，可以让你了解使用的函数和可以更改的设置，决定如何处理日志。一旦您对
    Linux 熟悉，您会更好地了解需要进行多久日志记录，以及以您的喜好选择选项，此值需要重启 logrotate 配置。


    # 保护自身


    一旦您破坏了 Linux 系统，使用日志备份并删除日志文件中的侵入的痕证，这都是有用的，可以减少被检测到的机会。有很多方法可以做到这一点，每种方法都有自己的风险和可靠性。


    # 删除日志


    首先，您需要删除活动的任何日志。您可以简单地打开日志文件，并使用第2章学习的删除技术，进行准确删除详细描述该活动的任何日志。然而，这可能会很耗时，并在日志文件中留下时间间隔，这看起来很可疑。此外，删除的文件通常可以通过一个专业的取证调查员恢复。


    120'
