  md: '# RSYLOG 日志记录守护进程


    Linux 使用名为 syslogd 的守护进程记录计算机的事件。syslog 的变体，包括 rsyslog 和 syslog-ng，在 Linux 的不同发行上，尽管操作非常相似，但仍然存在一些细微的差异。Kali
    Linux是在 Debian 上构建的，并且 Debian 默认情况下有 rsyslog，我们将在本章重点介绍这个实用程序。如果您想使用其他发行版，那么会有它们的日志系统一些研究。


    让我们看看系统的 rsyslog。我们将搜索与 rsyslog 相关的所有文件。首先，在 kali 打开一个终端，输入内容：


    ```

    kali >locate rsyslog

    /etc/rsyslog.conf

    /etc/rsyslog.conf

    /etc/default/rsyslog

    /etc/init.d/rsyslog

    /etc/logcheck/ignore.d.server

    /etc/logrotate.d/rsyslog

    /etc/rc0.d/K04rsyslog

    --snip--

    ```


    如您所见，许多文件都包含关键字 rsyslog，其中一些文件比其他文件更有用。我们要检查的是配置文件 syslog.conf。


    # rsyslog 配置文件


    与 Linux 的几乎所有应用程序一样，rsyslog 位于/etc 目录下的纯文本配置文件进行管理和配置，这在 Linux 中通常是这样的。对于 rsyslog，配置文件位于/etc/rsyslog.conf。使用任何文本编辑器打开该文件，我们将探索其中的内容（这里）。我使用的是
    Leafpad：


    ```

    kali >leafpad /etc/rsyslog.conf

