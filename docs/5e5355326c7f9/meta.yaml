    \ `airdump-ng`，后跟运行 `airmon-ng` 得到的接口名称。当你执行此命令时，你的无线网卡将从附近 AP 的所有无线通信中获取关键信息（如下）：\n\
    \n- SSID：AP 或客户端的 MAC 地址\n- PWR：信号强度\n- ENC：用于传输安全的加密类型\n- #Data：数据吞吐量\n- CH：AP\
