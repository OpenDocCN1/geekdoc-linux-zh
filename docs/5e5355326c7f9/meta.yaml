    ## 从 MySQL 获取数据信息


    MySQL 是数据库驱动应用程序中使用率广泛的数据库。在我们现代的 Web 2.0 时代，几乎每个网站都是数据库驱动的，这意味着 MySQL 拥有着大部分网络的数据。


    数据库是客户端的“金库”。它们包含了有关用户的重要信息以及信用卡密码信息。出于这个原因，黑客通常将数据库视为目标。


    与 Linux 一样，MySQL 是开源且通用许可（GPL），你会发现它几乎预装在每个 Linux 发行版上。


    作为免费、开源且强大的 MySQL 已经成为许多应用程序的首选数据库，包括 WordPress、Facebook、LinkedIn、Twitter、Kayak、alert.com、Wikipedia
    和 YouTube 等热门网站。


    其他流行的内容管理系统（CMS），如 Joomla、Drupal 和 Ruby on Rails 也使用 MySQL。你要明白，如果你想开发或攻击 Web
    应用程序的后端数据库，你应该了解 MySQL。让我们开始吧。


    ## 启动 MySQL


    幸运的是，Kali 已经安装了 MySQL（如果你正在使用其他发行版，则可以从软件镜像或直接从 https://www.mysql.com/downloads/
    下载 MySQL）。


    启动 MySQL 服务，在终端中输入以下内容：


    ```

    kali > mysql service start

    ```


    接下来，你需要通过登录来验证身份。输入以下内容，在输入密码时，只需按 ENTER 键：


    ```

    kali > mysql -u root -p

    ```


    Enter password:


    Welcome to MySQL monitor. Commands end with ; or \g.


    Your MySQL connection id is 4


    Server version: 5.6.30-1 (Debian)


    Copyright (c) 2000, 2016, Oracle and its affiliates. All rights reserved


    Oracle is a registered trademark of Oracle Corporation and its affiliates. Other
    names may be trademarks of their respective owners


    Type ''help''; or ''h'' for help. \c to clear the input statement


    ```

    mysql >

    ```


    在 MySQL 的默认配置中，root 用户的密码是空的。显然，这是一个主要的安全漏洞，你应该在首次登录后添加密码来解决这个问题。请注意，操作系统和 MySQL
    的用户名和密码是独立的。我们现在更改 MySQL 用户的密码以消除不安全。


    ## MySQL 的过去与未来


    MySQL 最初是由瑞典的 MySQL 于 1995 年开发的，然后在在 2008 年被 Sun Microsystems 收购，随后又于 2009 年被
    Oracle 收购 - 因此 MySQL 归 Oracle 所有。由于 Oracle 是世界上最大的数据库软件发行商，因此此开源社区对 Oracle 对 MySQL
    的开源承诺持这种态度存在重大挑战。因此，现在有一个名为 “MariaDB” 的 MySQL 数据库软件分叉，致力于保持该软件及其后续版本的开源。作为 MySQL
    管理员或用户，你应该关注 MariaDB。


    ## 与 MySQL 交互


    SQL 是一种与数据库连接的解释性编程语言。数据库通常是关系数据库，这意味着数据存储在多个交互的表中，每个表都有一个或多个列和行值。


    SQL 有几种实现，每种都有自己的命令和语法，但这里有几个常用的命令：


    - select 用于查找数据

    - union 用于合并两个或多个 select 操作的结果

    - insert 用于插入新数据

    - update 用于修改更新旧数据

    - delete 用于删除数据


    你可以为每个命令提供条件，以便更具体地阐述你想要执行的操作。例如，如下行：


    ```

    select user,password from customers where user=''admin'';

    ```


    这将返回 customers 表中 user 值等于“admin”的任何用户的用户名和密码字段的值。


    ## 设置 MySQL 密码


    通过输入以下内容，让我们看看已经在 MySQL 系统中的用户。（请注意，MySQL 中的命令以分号结束）。


    ```

    mysql >select user,host,password from mysql.user;

    ```


    | user | host | password |

    | :--- | :--- | :--- |

    | root | localhost | |

    | root | aphrodite.kali.org | |

    | root | 127.0.0.1 | |


    这表明 root 用户没有设置密码。我们给 root 分配一个密码。为此，我们首先选择要使用的数据库。使用 show 命令列出所有数据库：


    ```

    mysql >show databases;

    ```


    | Database |

    | :--- | :--- |

    | information_schema | |

    | mysql | |

    | performance_schema | |


    MySQL 默认带有三个数据库，其中两个（information_schema 和 performance_schema）不是管理数据库。要开始使用 mysql
    数据库，输入：


    ```

    mysql >use mysql;

    ```


    Database changed

    Reading table information for completion

    Column names

    你可以可以使用 describe 查看表的结构，如下：


    ```

    mysql >describe user;

    ```


    | Field | Type | Null | Key | Default | Extra |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | user | varchar(32) | NO | | NULL | |

    | host | varchar(61) | NO | | NULL | |

    | password | varchar(41) | YES | NULL | NULL | |


    MySQL 使用感兴趣的关键进行响应。我们可以看到字段名称以及它拥有的类型（通常是文本 varchar 或整数 int），还可以看到是否接受 NULL，密钥（如果存在），字段具有任何默认值，以及任何额外信息。现在我们可以使用以下命令将
    root 用户的密码设置为：


    ```

    mysql >update user set password = ''password'' where user = ''root'';

    ```


    此命令将 root 密码设置为。


    ## 访问远程数据库


    访问 localhost 上的 MySQL 数据库，我们使用以下语法（如果没有主机名或 IP 地址，则命令将默认为 localhost）：


    ```

    kali $ mysql -u <username> -p

    ```


    要访问远程数据库，我们需要提供 MySQL 主机名或 IP 地址。这是一个例子：


    ```

    kali $ mysql -u root -p 192.168.1.101

    ```


    我们将连接到 192.168.1.101 并输入密码。为了演示，如果你已经在其他局域网（LAN）上安装了 MySQL 实例，使用其 IP 地址。假设你已经连接并登录，命令界面提供了
    mysql> 提示。除了这个界面，MySQL 还有 GUI 界面（MySQL Workbench）和第三方（Navicat 和 TOAD for MySQL）。作为客户端，命令界面可能是。。提醒我们所有命令必须以分号或
    \g 结尾（与 SQL Server 不同），并且可以通过 help 或 h 获得帮助。现在我们使用管理员身份登录，我们的导航将受到管理员提供的权限限制。


    ## 连接到数据库


    通过访问系统，我们想要查询。下一步是查找有价值的数据库。以下是查找系统上的命令：


    ```

    mysql >show databases;

    ```


