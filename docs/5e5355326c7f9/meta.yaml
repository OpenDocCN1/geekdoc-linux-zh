    ![](img/77055846b6e5bd43c939d5fb384e34d6_180_0.png)


    像任何使用 Linux 的人一样，顾客经常有他们他们想要定期运行的任务、脚本或其他任务。例如，你可能希望为你的系统设置一个自动备份，或者你希望像我们在第 11
    章所做那样的转储日志文件。另一方面，客户可能希望每天晚上或者在他们工作或上学的时候让他们的系统运行第 8 章里的 MySQLscanner.sh 脚本。这些都是调度自动化任务的例子。调度任务允许你在无须考虑的情况下运行任务，并且你可以在不使用系统的时候运行调度任务，这样你就有了大量的空闲资源。


    Linux 系统管理员，或者是客户，可能希望在系统启动时自动启动特定的脚本或任务。在第 12 章中，我们讲述了如何使用 PostgreSQL 启动 PostgreSQL
    数据库和客户/渗透测试框架 Metasploit 关联。此起每次启动 Metasploit 前都要手动启动 PostgreSQL 数据库，或者你可以让 PostgreSQL（或者任何脚本）在系统启动时自动启动。


    在本章，你将学习如何使用 cron 守护进程和 crontab 设置一个脚本，让在系统无人操作时自动运行。你还将学习如何设置开机时启动脚本，从而为为你运行客户攻击所需的必要服务。'
