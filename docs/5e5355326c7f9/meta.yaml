    # 任务调度或使其自动运行


    cron 守护程序和 crontab 是用于调度常规任务的最有工具。第一个 cron，它是一个在后台运行的守护程序。cron 列在指定时间执行某些命令。我们可以更改
    cron 列，以安排任务或在特定时间执行，每天、每隔天、每隔周或几个月定期执行。


    想要调度一个任务或作业，需要在 etc/crontab目录下的 crontab 文件中加载它们。crontab 有七个字段：前五个字段用于计划执行任务的时间，第八字段用于用户，第七个字段用于要执行的命令的绝对路径。如果你使用
    crontab 来调度任务，可以使用脚本的路径放在第七个字段。


    五个字段中的每一个都代表不同的时间元素：顺序是分钟、小时、日、月、周。时间的每一个元素必须用数值表示，所以月表示为3（你不能输入“March”）。从 0 开始，就是代表周的日。


    表 16-1: crontab 时的表示


    | 时间单位 | 表示 |

    | --- | --- |

    | Minute | 0-59 |

    | Hour | 0-23 |

    | Day of the month | 1-31 |

    | Month | 1-12 |

    | Day of the week | 0-7 |


    因此，如果我们编写了一个扫描脚本并希望它在周五的凌晨2:30运行，我们可以在 crontab 文件中调度它。我们将简单介绍如何将这些信息输入 crontab，但首先我们需要说明需要遵循的格式，如代码列表
    16-1 所示。


