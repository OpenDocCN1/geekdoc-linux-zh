    清单 3-2: 使用 iwconfig 获取我们无线适配器的信息


    这里的输出告诉我们，唯一有一个无线扩展的网络接口是 wlan0，这正是我所期望的。lo 和 eth0 都没有任何无线扩展。


    对于 wlan0，我们了解了设备能够支持的 802.11 IEEE 无线标准：b 和 g，两种无线标准。在大多数无线扩展中包括 n（是标准的）。


    我们从 iwconfig 中学习了扩展的模式 Mode:Manage，不同于 monitor 或 promiscuous mode。在破解无线密码时，我们需要用到混杂模式(promiscuous
    mode)。


    接下来，我们将看到无线网卡（适配器）未连接（未连接）到接入点（AP），并且其功率为 20 dbm，这表示信号强度。我们将在第 14 章中详细介绍如何进行操作。


    # 更改网络信息


    具备足够的 IP 地址和网络信息是一项十分有用的技能，它将帮助你穿过防火作为可能的设备时才访问的网络。例如，在拒绝服务攻击（DoS）中，你可以使用欺权的 IP
    以于攻击来自其他的网络，从而帮助你规避取身份分析分析 IP 源的可能。在 Linux 上是一个相当简单的任务，使用 ifconfig 命令即可完成。


    # 更改 IP 地址


    更改 IP 地址，请输入 ifconfig，然后输入新的网络接口以及要分配给该接口的 IP 地址。例如，将 IP 地址 192.168.181.115 分配给接口
    eth0，执行以下内容：


    ```

    kali >ifconfig eth0 192.168.181.115

    kali >

    ```


    当你正确执行操作时，Linux 就会简单地返回一个命令提示并且没有任何输出。这件好事（没有输出错误信息代表执行成功）！


    然后，当你再次使用 ifconfig 命令检查网络的连接状态时，你应该看到你的 IP 地址被更改为你刚才赋值的那个 IP 地址。'
