  - '[PAGE 9]


    # 什么是道德黑客?


    年来随着信息安全领域的发展，道德黑客也出现了迅猛的发展，也被称为白帽黑客。道德客户是通过渗透和利用一个系统，找出其漏洞并更好地保护它的实践方法。我将道德黑客分为两个主要部分：为了合法信息安全而进行渗透测试，以及为了国家的军事或情报机构。两者都是快速增长的领域，需要增强。


    # 渗透测试


    随着组织越发注重安全性且安全漏洞的成本呈指数级增长，许多大型组织将安全服务外包出去。其中一项关键安全服务就是渗透测试。渗透测试本质是一个合法的、受委托的黑客行为，以证明公司的网络和系统的薄弱性。


    通常，组织首先进行漏洞评估，发现其网络、操作系统中的潜在漏洞。我强调是潜在的，因为为了此漏洞包含大量噪音（确定漏洞的事实并非如此）。渗透人员的角色是破解或渗透这些漏洞。只有这样，组织才能知道漏洞是否真实，并决定投入时间和金钱来弥补。


    # 军事和网络活动


    现在，世界上几乎每一个国家都在进行网络活动和网络竞争。人们只需要浏览一下头新闻，就会发现网络活动是监控和攻击军事和工业体系的选择。


    黑客在这些军事和情报收集活动中起着至关的作用，随着时间的推移，这种情况才会更加真实。想象一下未来的战争，黑客可以获得对手的操作计划，破坏他们的电电、油厂和供水系统。这些活动现在每天都在进行。因此，黑客成为国家防御的关键组成部分。'
  - '[PAGE 10]


    # 为什么骇客使用 LINUX


    为什么骇客使用 Linux 而不是其他操作系统呢？主要是因为 Linux 通过几种不同的方法提供了更高级别的控制。",


    # Linux 是开源的


    与 Windows 不同，Linux 是开源的，这意味着您可以使用操作系统的代码。因此，您可以随意更改和操作它。如果您试图使用它以其他的方式运行，那么能够操作代码是必不可少的。",


    # Linux 是透明的


    要进行有效的骇客攻击，您必须理解并理解的操作系统，并在很大程度上了解攻击的操作系统。Linux 完全透明，您可以查看和操作它的每一个部分。",


    Windows 则不费力让它变得越难以理解操作系统的内部工作方式，或许你永远不会知道“幕后”会发生什么，在 Linux 中，你会直接看到操作系统的每一个节点。这使得使用
    Linux 更加有效。",


    # Linux 提供层级控制


    Linux 是细粒度的。这意味着您对系统几乎无限的控制权。在 Windows 中，你只能控制 Microsoft 允许任何的内容。在 Linux 中，你可以完全由地控制，无论在最小的级别或最宏的级别。此外，Linux
    允许任何语言的脚本编写简单高效。",


    # 许多骇客工具都是 Linux 编写的


    超过 90% 的骇客工具都是 Linux 编写的。虽然也有例外，如 Cain 和 Aibel 以及 Wikto。这些例子证明了这一规律，即使是在 Windows
    迁移诸如 Metploit 或 nmap 等骇客时，并非所有功能都能从 Linux 迁移。


    # 未来Linux/Unix


    这似乎是一个激进的结论，但我认为未来的 Linux 和 Unix 系统。微软在 20 世纪 80 年代和 90 年代风光一时，但在增长的停止后逐渐衰落。


    自互联诞生以来，由于它的稳定性、可靠性和稳健性，Linux / Unix 是 Web 服务器的首选操作系统。在今天，Linux 在三分之二的 Web 服务器中占据市场主导地位。路由器、交换机和其他硬件设备的嵌入式系统总是
    Linux 内核，虚拟化世界由 Linux 主导，VMware 和 Citrix 基于 Linux内核。


    超过 80% 的移动设备使用 Unix 或 Unix (iOS 是 Android)。如果你认为计算机的未来是在平板电脑和手机设备上（否则将争辩），那么未来就是
    Linux / Unix。微软 Windows 仅占购物市场的 7%。


    +   * 2019 年 1 月 1 日微软通过自己的官方博客宣布支持 Win10，在 2019 年 12 月结束支持。",'
