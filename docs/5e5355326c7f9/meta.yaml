  md: '# OPENSSH 和树莓派


    SSH 是 Secure Shell 的首字母，基本上我们能够安全地连接到远程系统的终端 - 这是年前常见的不安全替代。我们可以构建 Web 服务器，SSH
    我们能够能够访问应用列表（可以使用此用户登录），使用加密密码对用户进行身份验证，以及加密所有通信。这减少了不需要的用户远程连接的机会（由于加密的请求过程或拦截我们的通信（由于加密的））。可能广泛使用的
    Linux 服务是 OpenSSH，你可以将其安装在 Linux 发行版上，包括 Kali。


    系统管理员经常使用 SSH 管理远程系统，而若经常使用 SSH 连接到受感染的远程系统，我们也会面临这些问题。在我们初学者中，我们使用 SSH 设置一个 Raspberry
    Pi 系统进行课程活动，我将称之为“Raspberry Spy Pi”。


    不过，在我们将做之前，我们需要使用熟练的命令在 Kali 系统上启动 OpenSSH：

    ```

    我们将使用 SSH 来构建和控制远程 Raspberry Pi。如果你不熟悉 Raspberry Pi，那么 Raspberry Pi 是一块非常小巧但功能强大的单机电脑，可以作为编程调试工具。我们将使用带有相似模块的
    Raspberry Pi 作为编程课程设备。你可以以低于 50 美元的价格购买几个电子零售商店（包括亚马逊）的Raspberry Pi，你可以用 15 美元的价格购买相关连接机器。


    在这里，我们将与 Kali 系统的网络上进行连接，这将允许我们使用私有的内部 IP 范围。在实际世界中进行攻击时，你可能希望将其部署在另一个系统中，但这将限制编写书籍的范围。


    # 放置 Raspberry Pi


    确保你的 Raspberry Pi 正在运行 Raspian 操作系统，这只是另一个专门为 Raspberry Pi CPU 移动 Linux 发行版。你可以从
    https://www.raspberrypi.org/downloads/raspberry/ 找到 Raspberry 的下载和安装程序。在本书中学到的所有内容适用于
    Raspberry Pi 上的 OS 以及Ubuntu 和其他 Linux 发行版。


    下载安装 Raspian 操作系统，你需要将 Raspberry Pi 连接到显示器、鼠标和键盘，然后将它连接到互联网。如果对于你来说是安全的，请查看 https://www.raspberrypi.org/learning/hardwareguide/
    的说明。设置好后，你可以使用用户名 pi 和密码 raspberry 登录。


    # 构建 Raspberry Pi


    第一步是确保 Raspberry Pi 在运行上启用 SSH。默认情况下，SSH 通常是关闭的。因此启用它，请切换到“选项”菜单并启动 Raspberry
    Pi 配置。然后切换到 Interfac 选项卡，在 SSH 选项中，单击 Enabled（如果未勾选），然后点击 OK：


    启用 SSH 后，你可以通过打开终端并输入内容在 Raspberry Pi 上启动：

