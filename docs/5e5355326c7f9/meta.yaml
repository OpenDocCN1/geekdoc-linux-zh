    # 硬盘分区


    一些驱动器可以划分为多个分区，以便管理和分离数据。例如，您可能想要将硬盘驱动分开，以便交换文件、目录和/目录位于单独的分区上——这样做有很多原因，包括许多共享资源和宽松权限限制。


    Linux 在每个驱动器的名称前面都加上一次数字编号。这样，第一个 SATA 驱动器上的第一个分区就是 sda1。第二个分区是 sda2，第三个是 sda3，以此类推，如表
