  md: '# Chapter 1: What Is SUSE Linux?


    As far as the development environment in SUSE Linux goes, you can use the same
    basic tools (such as an editor, a compiler, and a debugger) that you might use
    on other UNIX workstations, as those from IBM, Sun Microsystems, and Hewlett-Packard
    (HP). What this means is if you work by day on one of these UNIX workstations,
    you can use a Linux PC in the evening to duplicate that development environment
    at a fraction of the cost. Then you can either complete projects at home or devote
    your time to writing software for fun and to share on the Internet.


    # Online documentation


    As you become more adept at using Linux, you may want to look up information quickly
    — without having to turn the pages of (ahem) this great book, for example. Linux
    comes with enough online information to jog your memory in those situations when
    you vaguely recall a command''s name, but you can''t remember the exact syntax
    of what you''re supposed to type.


    If you use Linux commands, you can view the manual page — commonly referred to
    as the man page — for a command by using the man command. (You have to remember
    that command in order to access online help.)


    You can also get help from the GUI desktops. Both GNOME and KDE desktops come
    with Help viewers to view online help information. In KDE, choose Main Menu; SUSE
    Help Center and in GNOME choose Desktop; SUSE Help Center from the top panel (you
    learn the details in Chapter 3). You can then browse the help information by clicking
    the links on the initial Help window. Figure 1-2 shows a typical Help window —
    this one from the KDE desktop.


    # Figuring Out What You Can Do with SUSE Linux


    As an operating system, SUSE Linux acts as the intermediary through which you,
    the "lord of the system," control all the hardware and software in your PC. The
    hardware includes the system box, the monitor, the keyboard, the mouse, and anything
    else connected to the system box. The catchall term refers to any equipment attached
    to the system. If you use a laptop computer, all your hardware is packaged into
    the laptop.


    Inside that system is the system''s brain — the microprocessor (Intel Pentium
    4, for example) or the central processing unit (CPU) — performs the instructions
    contained in a computer program. When the microprocessor is running a computer
    program, that program''s instructions are stored in the memory or RAM. RAM stands
    for Random Access Memory (that means any part of the memory can be accessed randomly
    — in arbitrary order).'
