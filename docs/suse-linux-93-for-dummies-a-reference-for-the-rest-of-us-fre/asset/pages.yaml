  md: '# Chapter 16


    # What''s a Shell and Why Do I Care?


    **In This Chapter**


    +   - Opening terminal windows and virtual consoles

    - Exploring the bash shell


    Sometimes things don''t work. What do you do if the GUI desktop stops responding
    to your mouse clicks? What if the GUI doesn''t start at all? You can tell your
    SUSE Linux system what to do, but you have to do it by typing commands into a
    text screen. In these situations, you work with the shell—the SUSE Linux command
    interpreter. I introduce the bash shell (the default shell in SUSE Linux) in this
    chapter.


    After you figure out how to work with the shell, you may even begin to like the
    simplicity and power of the Linux commands. And then, even if you''re a GUI aficionado,
    someday soon you might find yourself firing up a terminal window and making the
    system sing and dance with two- or three-letter commands strong together by strange
    punctuation characters. (Hey, I can dream, can''t I)?


    # Opening Terminal Windows and Virtual Consoles


    First things first. If you''re working in a GUI desktop such as GNOME or KDE,
    where do you type commands for the shell? Good question.


    The easiest way to get to the shell is to open a terminal (also called console)
    window. In KDE, click the icon that looks like a monitor covered by a seashell
    (for a shell, get it?) to open a terminal window. In GNOME, select Programs Menu>System>Terminal>Terminal
    and that should open a terminal window. Now you can type commands to your heart''s
    content.'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# 244 Part III: Doing Stuff with SUSE


    If, for some reason, the GUI seems to be hung (you click and type but nothing
    happens), you can turn to the virtual consoles. (The physical console is the monitor-and-keyboard
    combination.) The idea of virtual consoles is to give you the ability to switch
    between several text consoles, though you have only one physical console. Whether
    you are running a GUI or not, you can use different text consoles to type different
    commands.


    To get to the first virtual console from the GNOME or KDE desktop, press Ctrl+Alt+F1.
    Press Ctrl+Alt+F2 for the second virtual console, and so on. Each of these virtual
    consoles is a text screen where you can log in and type commands to perform various
    tasks. When you''re done, you exit to log out.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_265_0.png)


    You can use up to six virtual consoles. In most distributions, the seventh is
    used for the GUI desktop. To get back to the GUI desktop, press Ctrl+Alt+F7.


    If the GUI appears to be hung, switch to a virtual console and gracefully shut
    down the system from that console. For example, press Ctrl+Alt+F2 and then log
    in as root. After that, type shutdown -h now to halt the system. To restart the
    system, type reboot.


    # Exploring the Bash Shell


    If you''ve used MS-DOS, you may be familiar with COMMAND.COM, the DOS command
    interpreter. That program displays the C:\ prompt. In Windows, you can see this
    prompt if you open a command window. (To open a command window in Microsoft Windows,
    choose Start+Run, type cmd in the text box, and then click OK.)


    SUSE comes with a command interpreter that resembles COMMAND.COM in DOS, but it
    can do a whole lot more. The SUSE Linux command interpreter is called shell.


    The default shell in SUSE Linux is bash. When you open a terminal window or log
    in at a text console, the bash shell prompts you for commands. Then, when you
    type a command, the shell executes your command.


    In addition to the standard Linux commands, bash can execute any computer program.
    So you can type the name of an application (the name is usually more cryptic than
    what you see in GNOME or KDE menus) at the shell prompt, and the shell starts
    that application.'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# Chapter 16: What''s a Shell and Why Do I Care?


    # Understanding the syntax

    of shell commands


    Because a shell interprets what you type, knowing how the shell processes the
    text you enter is important. All shell commands have this general format that
    starts with a command followed by options (some commands have options):


    ```

    command option1 option2 ... optionN

    ```


    Such a single-on line giving a command is commonly referred to as a command line.
    On a command line, you enter a command, followed by more options (arguments).
    These strings of options — the command line options (or arguments) — modify the
    way the command works so that you can get it to do specific tasks.


    The shell uses a blank space or a tab to distinguish between the command and options.
    Naturally, you help it by using a space or a tab to separate the command from
    the options and the options from one another.


    An option can contain spaces — all you have to do is put that option inside quotation
    marks so that the spaces are included. For example, to search for my name in the
    password file, I enter the following grep command (grep is used for searching
    for text in):


    ```

    grep Naba Barkakati* /etc/passwd

    ```


    When grep prints the line with my name, it looks like this:


    ```

    naba:x:1000:100:Naba Barkakati:/home/naba:/bin/bash

    ```


    If you created a user account with your username, type the grep command with your
    username as an argument.


    In the output of the grep command, you can see the name of the shell (/bin/bash)
    following the colon (:).


    The number of command line options and their format, of course, depends on the
    actual command. Typically, these options look like -X, where X is a single character.
    For example, the ls command lists the contents of a directory. You can use the
    -l option to see more details.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_266_0.png)'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# 246 Part III: Doing Stuff with SUSE


    If a command is too long to fit on a single line, you can press the backslash
    key followed by Enter. Then, continue typing the command on the next line. For
    example, type the following command (press Enter after each line):


    ```

    cat \

    /etc/passwd

    ```


    The cat command then displays the contents of the /etc/passwd file.


    You can concatenate (that is, string together) several shorter commands on a single
    line. Just separate the commands by semicolons (;). For example, the following
    command


    ```

    cd; ls -1; pwd

    ```


    changes the current directory to your home directory, lists the contents of that
    directory, and then shows the name of that directory.


    # Combining shell commands


    You can combine shell commands to create a more sophisticated command. For example,
    suppose that you want to find out which device file named sbpcd resides in your
    system''s /dev directory because some says you need that device file for a Sound
    Blaster CD-ROM drive. You can use the ls /dev command to get a directory listing
    of the /dev directory, and then browse through it to see whether that listing
    contains sbpcd.


    Unfortunately, the /dev directory has a great many entries, so you might find
    it hard to find any item that has sbpcd in its name. You can, however, combine
    the ls command with grep and come up with a command line that does exactly what
    you want. Here''s that command line:


    ```

    ls /dev | grep sbpcd

    ```


    The shell sends the output of the ls command (the directory listing) to the grep
    command, which searches for the string sbpcd. That vertical bar (|) is known as
    a pipe because it acts as a conduit (think of a water pipe) between the two programs
    — the output of the first command is fed into the input of the second.


    # Controlling command input and output


    Most Linux commands have a common feature — they always read from the standard
    input (usually, the keyboard) and write to the standard output'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# Chapter 16: What''s a Shell and Why Do I Care? 247


    (usually, the screen). Error messages are sent to the standard error (usually
    to the screen as well). These three devices often are referred to stdin, stderr.


    You can make a command get its input from a file and send its output to another
    file. Just so you know, the highfalutin'' term for this feature is input and output
    redirection or I/O redirection.


    # Getting command input from a file


    If you want a command to read from a file, you can redirect the standard input
    to come from that file instead of the keyboard. For example, the following command:


    ```

    sort /etc/passwd

    ```


    This command displays a sorted list of the lines in the /etc/passwd file. In this
    case, the less-than sign (<) redirects stdin so that the command reads its input
    from the /etc/passwd file.


    # Saving command output in a file


    To save the output of a command in a file, redirect the standard output to a file.
    For example, type cd to change your home directory and then type the command:


    ```

    grep typedef /usr/include/* > typedef.out

    ```


    This command searches through all files in the /usr/include directory for the
    occurrence of the typedef and then saves the output in a file called typedef.out.
    The greater-than sign (>) redirects stdout to a file. When you use an asterisk
    (*), bash replaces the asterisk with a list of all filenames in the specified
    directory. Thus, /usr/include/* means all the files in the /usr/include directory.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_268_0.png)


    If you want to append a command''s output to the end of an existing file instead
    of saving the output in a new file, use two greater-than signs (>>) like this:


    ```

    command >> filename

    ```


    # Saving error messages in a file


    Sometimes you type a command and it generates a lot of error messages that scroll
    by so fast you can''t tell what''s going on. One way to see all the error messages
    is to save the error messages in a file so that you can see what the heck happened.
    You can do that by redirecting stderr to a file.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# 248 Part III: Doing Stuff with SUSE


    For example, type the following command:


    ```

    find / -name COPYING -print 2> finderr

    ```


    This command looks throughout the file system for files named COPYING, but saves
    all the error messages in the finderr file. The number 2 followed by the greater-than
    sign (2>) redirects stderr to a file.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_269_0.png)


    If you want to simply discard the error messages instead of saving them in a file,
    use /dev/null as the filename, like this:


    ```

    find -name COPYING -print 2 > /dev/null

    ```


    That /dev/null is a special file — often called the bit bucket and sometimes glorified
    as the Great Bucket in the Sky — that simply discards whatever it receives. So
    now you know what they mean when you hear phrases such as, "Your mail probably
    ended up in the bit bucket."


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_269_1.png)


    # Typing less with automatic command completion


    Many commands take a filename as an argument. To view the contents of the /etc/passwd
    file, for example, type the following command:


    ```

    cat /etc/passwd

    ```


    The cat command displays the /etc/passwd file. For any command that takes a filename
    as an argument, you can use a bash feature to avoid typing the whole filename.
    All you have to type is the bare minimum — just the first few characters — uniquely
    identify the file in its directory.


    To see an example, type cat /etc/pas but don''t press Enter; press Tab bash automatically
    completes the filename, so the command becomes cat /etc/passwd. Now press Enter
    to run the command.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_269_2.png)


    Whenever you type a filename, press Tab after the first few characters of the
    filename bash probably can complete the filename so that you don''t have to type
    the entire name. If you don''t enter enough characters to uniquely identify the
    file, bash beeps. Just type a few more characters and Press again.


    # Going wild with asterisks and question marks


    You can avoid typing long filenames another way. (After all, making less work
    for users is the idea of computers, isn''t it?)'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# Chapter 16: What''s a Shell and Why Do I Care?


    This particular trick involves using the asterisk (*) and question mark (?) and
    a few more tricks. These special characters are called wildcards because they
    match zero or more characters in a line.


    If you know MS-DOS, you may have used commands such as COPY .* A: to copy all
    files from the current directory to the A drive; bash accepts similar wildcards
    in filenames. As you expect, bash provides many more wildcard options than the
    MS-DOS command interpreter.


    You can use three types of wildcards in bash:


    +   * The asterisk (*) matches zero or more characters in a filename. That mBeans
    denotes all files in a directory.

    * The question mark (?) matches any single character. If you type test?, matches
    any five-character text that begins with test.

    * A set of characters in [brackets] matches any single character from that set.
    The string [aB], for example, matches any filename that starts with a or B.


    Wildcards are handy when you want to do something to a whole lot of files. For
    example, to copy all files from the /media/cdrom directory to the current directory,
    type the following:


    ```

    cp /media/cdrom/*

    ```


    You can use the asterisk with other parts of a filename to select a more specific
    group of files. Suppose you want to use the grep command to search for the text
    typedef struct in all files of the /usr/include directory that meet the criteria:


    +   * The filename starts with s

    * The filename ends with .h


    The wildcard specification s*.h denotes all files that meet these criteria. Thus
    you can perform the search with the following command:


    ```

    grep "typedef struct" /usr/include/s*.h

    ```


    The string contains a space that you the grep command to find, so you have to
    enclose that string in quotation marks. That way, bash does not interpret each
    word in text as a separate command line argument.


    The question mark (?) matches a single character. Suppose that you have four files
    — image1.pcx, image2.pcx, image3.pcx, and image4.pcx — in'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# 250 Part III: Doing Stuff with SUSE


    the current directory. To copy these files to the /mnt/floppy directory, use the
    following command:


    ```

    cp image?.pcx /mnt/floppy

    ```


    Bash replaces [—] the single question mark with any single character, and copies
    the four files to /mnt.


    The third wildcard format—[...] matches a single character from a specific set
    of characters enclosed in square brackets. You may want to combine this format
    with other wildcards to narrow down the matching filenames to a smaller set. To
    see a list of all filenames in the /etc/X11/xdm directory that starts with x or
    X, type the following command:


    ```

    ls /etc/X11/xdm/[xX]*

    ```


    # Repeating previously typed commands


    To make repeating long commands easy for you, bash stores up to 500 commands as
    part of command history (basically just a list of old commands). To see the command
    history, type history displays a numbered list of the old commands, including
    those you entered during previous logins.


    If the command list is too long, you can limit the number of old commands that
    you want to see. For example, to see only the most recent commands, type this
    command:


    ```

    history 10

    ```


    To repeat a command from the list that the history command shows, simply type
    an exclamation point (!), followed by that command''s number. To repeat command
    number 3, type !13.


    You can repeat an old command without knowing its command number. Suppose you
    typed more /usr/lib/X11/xdm/xdm-config a few minutes ago, and now you want to
    look at that file again. To repeat the previous more command, type the following:


    ```

    !more

    ```


    Often, you may want to repeat the last command that you just typed, perhaps with
    a slight change. For example, you may have displayed the contents of the directory
    by using the ls -l command. To repeat that command, two exclamation points as
    follows:


    ```

    !!

    ```'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# Chapter 16: What''s a Shell and Why Do I Care? 251


    Sometimes, you may want to repeat the previous command but add extra arguments
    to it. Suppose that ls -l shows too many files. Simply repeat that command, but
    pipe the output through the more command as follows:


    ```

    !! | more

    ```


    Bash replaces the two exclamation points with the previous command and then appends
    | more to that command.


    Here''s the easiest way to recall previous commands. Just press the up-arrow key
    and bash keeps going backward through the history of commands you previously typed.
    To move forward in the command history, press the down-arrow key.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_272_0.png)'
