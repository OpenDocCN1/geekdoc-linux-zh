  md: '# 144 Part III: Doing Stuff with SUSE


    URLs for all Web sites, such as http://www.novell.com for Novel''s home page.
    If the URL does not have a filename, the Web server sends a default HTML file
    named index.html. (That''s the default filename for the popular UNIX-based Apache
    servers; Microsoft Windows Web servers use a different filename.)


    +   * https:// specifies that the file is accessed through a Secure Socket Layer
    (SSL) connection — a protocol designed by Netscape Communications for encrypted
    data transfers across the Internet. This form of URL is typically used when the
    Web browser senses sensitive information (such as a credit card number, username,
    and password) to a Web server. For example, a URL such as https://some.site.com/secure/takeorder.html


    may display an HTML form that requests credit card information and other personal
    information (such as name, address, and phone number).


    +   * mailto:// specifies an e-mail address that you can use to send an e-mail
    message. This opens your e-mail program from which you can send the message. For
    example, mailto:webmaster@example.com refers to the Webmaster at the host someplace.com.


    +   * news:// specifies a newsgroup that you can read by means of the Network
    Transfer Protocol (NNTP). For example, news://md.comcast.ganiganews.com/comp.os.linux
    setup


    the comp.os.linux newsgroup at the news server md.comcast.ganiganews.com. If you
    have a default news server configured for the Web browser, you can omit the server''s
    name and use the URL news:comp.os.linux to access the newsgroup.


    +   ✓ Domain: The fully qualified domain name of the computer that has this file
    URL specifications. You can also provide an IP address in this file. The domain
    name is not case-sensitive.


    +   ✓ Port: Port number that is being used by the protocol listed in the first
    part of the URL is optional; all protocols use default ports. The default port
    for HTTP, for example, is 80. If a site configures the Web server to listen to
    a different port, the URL has to include the port number.


    +   ✓ Directory: Directory path of the file referred to in the URL. For Web pages,
    this field is the directory path of the HTML file. The directory path is case-sensitive.


    +   ✓ Filename: Name of the file. For Web pages'
