    # Extending Your LAN with a Wireless Network


    If you have a laptop computer that you want to connect to your LAN — or if you
    don''t want to run a rat''s nest of wires to connect a PC to the LAN — you have
    the option of using a wireless Ethernet network. In a typical scenario, you have
    a cable modem or DSL connection to the Internet, and you want to connect one or
    more laptops with wireless network cards to access the Internet through the cable
    or DSL modem. In the following sections, I explain wireless networking and how
    to set it up on your network.


    # Understanding wireless Ethernet networking


    You''ve probably heard about Wi-Fi. Wi-Fi stands for Wireless Fidelity network
    — a short-range wireless network similar to the wired Ethernet networks. A number
    of standards from an organization known as IEEE (the Institute of Electrical and
    Electronics Engineers) defines the technical details of how Wi-Fi networks work.
    Manufacturers use these standards to build the components that you can buy to
    set up a wireless network, also known as WLAN for.


    Until mid-2003, there were two popular IEEE standards — 802.11a and 802.11b —
    for Ethernet networks. These two standards were finalized in 1999. A third standard
    — 802.11g — was finalized by the IEEE in the summer of 2003. All these standards
    specify how the Ethernet network works over the radio waves. You don''t have to
    fret over the details of these standards to set up a wireless network, but knowing
    some pertinent details is good so that you can buy the right kind of equipment
    for your wireless network.


    The three Ethernet standards have the following key characteristics:


    +   802.11b: Operates in the 2.4 GHz radio band (2.4 GHz to 2.485 GHz) in up to
    three nonoverlapping frequency bands or channels. Supports a maximum bit rate
    of 11 Mbps per channel. One disadvantage of 802.11b is that the 2.4 GHz frequency
    band is crowded — many devices such as microwave ovens, cordless phones, and scientific
    equipment, as'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# Chapter 8: Setting Up an Ethernet LAN with Wireless Access


    well as Bluetooth devices — all work within the 2.4 GHz frequency band. Nevertheless,
    802.11b is very popular in corporate and home networks.


    +   802.11a: Operates in the 5 GHz radio band (5.725 GHz to 5.850 GHz) in up to
    eight nonoverlapping channels. Supports a maximum bit rate of 80 Mbps per channel.
    The 5 GHz band is not as crowded as the 2.4 GHz band, but the 5 GHz band is not
    approved for use in Europe. Products conforming to the 802.11a standard are available
    on the market, and wireless access points are designed to handle both 802.11a
    and 802.11b connections.


    +   802.11g: Supports up to 54 Mbps data rate in the 2.4 GHz band.(The same band
    as 802.11b.) 802.11g achieves the higher bit rate by using a technology called
    OFDM (orthogonal frequency-division multiplexing), which is also used by 802.11a.
    Although 802.11g was only recently finalized, equipment that competes with it
    is already on the market. That''s because 802.11g has generated excitement by
    working in the same band as 802.11b but promising much higher data rates and being
    backward-compatible with 802.11b devices. Vendors offer access points that can
    support both the 802.11b and 802.11g connections.


    If you are buying a new access point, get an 802.11g one. An 802.11g access point
    can also communicate with other (and slower) 802.11b devices.


    The maximum throughput that a user actually sees is much less because all users
    of radio channel share the capacity of the channel. Also, the data transfer rate
    decreases as the distance between the user''s PC and the wireless access point
    increases.


    To find out more wireless Ethernet, visit www.wi-fi.org, the home page of the
    Wi-Fi Alliance — a nonprofit international association formed in 1999 to certify
    interoperability of wireless LAN products based on IEEE 802.11 standards.


    # Understanding infrastructure and ad hoc mode


    The 802.11 standard defines two modes of operation for wireless Ethernet networks:
    infrastructure and ad hoc. Ad hoc mode is simply two or more wireless Ethernet
    cards communicating with each other without an access point.


    Infrastructure mode refers to the approach in which all the wireless Ethernet
    cards communicate with each other and with the wired LAN through an access point.
    For the discussions in this chapter, I assume that you set your wireless Ethernet
    card to infrastructure mode. In the configuration files, this mode is referred
    to as managed mode.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_150_0.png)


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_150_1.png)'
