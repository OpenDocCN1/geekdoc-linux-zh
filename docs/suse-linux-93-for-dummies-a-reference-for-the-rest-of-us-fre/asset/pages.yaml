  md: '# What You''ll Find on the DVD


    This section provides a summary of the software and other goodies you find on
    the DVD. If you need help installing the items provided on the DVD, refer back
    back to the installation instructions in the preceding section.


    Shareware programs are fully functional, free versions of copyrighted programs.
    If you like particular programs, register with their authors for a nominal fee
    and receive licenses, enhanced versions, and technical support.


    Freware programs are free, copyrighted games, applications, and utilities. You
    can copy them to as many PCs as you like — for free — but offer no tech support.


    GNU software is governed by its own license, which is included in the folder of
    the GNU software. There are no restrictions on the distribution of GNU software.
    See the GNU license at the root of the DVD or at the back of this book for details.
    As required by the GNU license, Novell makes the SUSE Linux source code available.
    You can download the source code for SUSE Linux from the following:


    ```

    ftp://ftp.suse.com/pub/suse/1386/9.2/suse/src/

    ```


    Trial, demo, or evaluation versions of software are usually limited by time or
    functionality (such as not saving a project after you create it).


    The DVD includes a Special Edition of SUSE Linux. The Special Edition is similar
    to the personal edition that SUSE used to sell in versions prior to 9.2. The version
    of SUSE Linux on the companion DVD includes all the basics:


    +   - Your choice of KDE or GNOME graphical desktop environments

    - Konqueror Web browser and file manager

    - Multimedia tools for playing CDs and DVDs, burning CDs, and ripping audio CDs

    - Office software in the form of the much-acclaimed OpenOffice.org suite

    - Photo and graphics editing software such as the GIMP, and many more


    In short, the Special Edition of SUSE Linux that accompanies this book gives everything
    you need for a typical home or small computer office.


    SUSE does offer a commercial version of SUSE Linux, called the professional edition,
    which includes many servers; software development tools; additional word processing,
    database, and spreadsheet programs; and many more extra programs. The Special
    Edition is smaller and is geared to the home user who doesn''t need everything
    else that the professional edition includes.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_364_0.png)'
