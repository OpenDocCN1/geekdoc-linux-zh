  md: '# 318 Part V: The Part of Tens


    # If My System Crashes, Can I Press

    the Reset Button to Reboot?


    Even though your mouse or keyboard seems to be dead, this does not necessarily
    mean that everything in your system has crashed. Therefore, you should not immediately
    reach for the reset button.


    In case it''s the GUI desktop that''s hung, press Ctrl+Alt+Backspace to kill the
    X server and restart it. If this works, you should see a graphical login screen
    from which you can log in.


    If restarting X does not help, press Ctrl+Alt+F2 and see if you can get a text
    console with a login prompt. If you see the login prompt, login with your username
    and password. Then type su and type the root password to become root. After that,
    type reboot to safely reboot the PC.


    If you don''t get a console by pressing Ctrl+Alt+F2, try to log into the system
    from another machine on the network (use ssh followed by your SUSE Linux system''s
    IP address). You can become root by typing su - and then reboot to reboot the
    PC. Of course, this last option works only if you have multiple PCs in a local
    area network.


    If nothing works, just wait some time, make sure that there is no hard drive activity
    (many PCs have a light that blinks when the hard drive is active; the hard drive
    also makes noise that you may be to hear), and then press the reset button.


    # How Can I Schedule a Command

    to Run Every 30 Minutes?


    You can run a command or a script (which is a file containing other commands)
    every so often using crontab. You schedule recurring jobs by placing job information
    in a file with a specific format and submitting this file with the crontab command.
    A program called cron checks the job information every minute and executes the
    recurring jobs at the specified times. Because cron runs recurring jobs, such
    jobs are also referred to as cron jobs.


    To submit a cron job, follow these steps:'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# Chapter 20: Ten Frequently Asked Questions about SUSE


    1. Prepare a shell script (or an executable program in any programming language)
    that can perform the recurring task you want to perform.


    You can skip this step if you want to execute an existing program periodically.


    2. Prepare a text file with information about the times when you want the shell
    script or program (from Step 1) to execute, and submit this file by using cron.


    You can substitute several recurring jobs with a single file. Each line with timing
    information about a job has a standard format with six fields — the first specify
    when the job runs, and the sixth and subsequent fields construct the actual command
    that runs. For example, here is a line that executes the myjob shell script in
    a user''s home directory every 30 minutes:


    ```

    0,30 * * * $HOME/myjob

    ```


    +   3. Suppose the text file jobinfo (in the current directory) contains the job
    information. Submit this information to crontab with the following-command:


    ```

    crontab jobinfo

    ```


    That''s it! You are set with the cron job. From now on, the cron runs at regular
    intervals (as specified in the job information file), and you receive mail messages
    with the output from the job.


    To verify that the job is indeed scheduled, type the following command:


    ```

    crontab -1

    ```


    The output of the crontab -1 shows the cron jobs currently installed in your name.
    To remove your cron jobs, type crontab -r.


