- img_proc: true
  md: '# # Chapter 18: Updating SUSE and Adding New Software 283


    If you want to search for a specific package, feed the output of rpm -qa to the
    grep command. For example, to see all packages with kernel in their names, type


    ```

    rpm -qa | grep kernel

    ```


    The result depends on what parts of the kernel RPMs are installed on a system.


    You can query much more than a package''s version number with the rpm -q command.
    By adding single-letter options, you can find out useful information. For example,
    try the following command to see the files in the cups package:


    ```

    rpm -ql cups

    ```


    Here are a few more useful forms of the rpm -q commands to query information about
    a package (to use any of these rpm -q commands, type the command, followed by
    the package name):


    +   - rpm -qc: Lists all configuration files in a package.

    - rpm -qd: Lists all documentation files in a package. These are usually the manual
    pages (also known as man pages).

    - rpm -q: Displays the name of the package (if any) to which a specified file
    belongs.

    - rpm -qi: Displays detailed information about a package, including version number,
    size, installation date, and a brief description.

    - rpm -ql: Lists all the files in a package. For some packages, you see a very
    long list.

    - rpm -qs: Lists the state of all files in a package (the state of a file can
    be one of the following: normal, not installed, or replaced).


    These rpm commands provide information about installed packages only. If you want
    to find information about an uninstalled RPM file, add the letter p to the command
    line option of each command. For example, to view the list of files in the RPM
    named samba 3.0.9-2.1.1586.rpm, go to the directory where that file is located
    and then type the following command:


    ```

    rpm -qpl samba*.rpm

    ```


    Of course, this command works only if the current directory contains that RPM
    file.


    Two handy rpm -q commands enable you to find out which RPM file provides a specific
    file and which RPMs need a specified package. To find out the name of the RPM
    that provides a file, use the following command:


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_304_0.png)


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_304_1.png)'
