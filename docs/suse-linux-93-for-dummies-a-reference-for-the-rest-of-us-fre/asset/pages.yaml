  md: '# 196 Part III: Doing with SUSE


    In addition to the fields you see in the Insert menu, you can pick from many more
    fields. Choose Insert<c>Fields<c>Other to open the Fields dialog box (12-9) where
    you can browse and pick other fields to use in your document. From the Fields
    dialog box, you can also change the format for a field. For example, you can select
    the date field shown in the document.


    Another type of useful field is a reference or a bookmark. The idea is to mark
    the location in the document by a name and then refer to that location elsewhere
    by that assigned name. For example, you can use a cross-reference to the page
    where that location occurs.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_217_0.png)


