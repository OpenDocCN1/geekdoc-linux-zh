    # Burning data CDs in Nautilus


    If you have a CD recorder attached to your system (it can be a built-in ATAPI
    CD recorder or an external one attached to the USB port), you can use Nautilus
    from the GNOME desktop to burn data CDs. From Nautilus object window, you can
    access the CD Creator built into Nautilus. Just follow these simple steps:


    +   1. In any Nautilus object window, choose Places::= CD Creator.

    Nautilus opens a CD Creator object window.


    > Note: If you don''t have any Nautilus object windows open, just double-click
    the Computer icon on the desktop.


    +   2. From other Nautilus windows, drag and drop into the CD Creator window whatever
    files and folders you want to put on the CD.


    To get files on your computer, double-click the Computer icon to open it in Nautilus
    and find the files you want. Then drag and drop those file or folder icons into
    the CD Creator window.


    +   3. From the CD Creator window, choose File::= Write to CD.

    Nautilus displays a dialog box (see Figure 14-12) where you can select the CD
    recorder, the write speed, and several other options, such as whether to eject
    the CD when done. You can also specify the CD title.


    +   4. Click the Write Files to CD button.

    Nautilus burns the CD.'
