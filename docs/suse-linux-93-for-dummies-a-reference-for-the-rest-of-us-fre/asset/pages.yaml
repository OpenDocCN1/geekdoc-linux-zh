  md: '# Chapter 12


    # # Preparing Documents and Spreadsheets in SUSE Linux


    +   In This Chapter

    - Preparing documents in OpenOffice.org Writer

    - Working with spreadsheets in OpenOffice.org Calc


    Preparing documents and spreadsheets are the staples of the modern office. SUSE
    comes with the OpenOffice.org (often shortened as OO.o or Ooo) suite of office
    applications that includes very capable word processing and spreadsheet software
    to help you with these tasks. Both KDE and GNOME desktops use OpenOffice.org as
    the primary office application suite.


    In this chapter, I describe two OpenOffice.org applications — Writer for documents
    and Calc for working with spreadsheets — in considerable detail. Writer is similar
    to Microsoft Word and Calc is like Microsoft Excel.


    Besides Writer and Calc, OpenOffice.org also includes Imp, a presentation software
    package that is similar to Microsoft PowerPoint. I describe Imp in Chapter 13.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_204_0.png)


    # # Writing with OpenOffice.org Writer


    Face it: The whole world, or so it seems, Microsoft Office, especially Microsoft
    Word, to write stuff. You have to work with the world to get your job done. Until
    recently, the lack of a freely available and good Microsoft Office-compatible
    office suite may be holding you back from using SUSE Linux as your primary desktop
    operating system. Well, your troubles are over. SUSE Linux comes with the OpenOffice
    office suite — a set of office productivity applications comparable to Microsoft
    Office and compatible with Microsoft Office as well. OpenOffice.org is installed
    on your system when you installed SUSE Linux.'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# 184 Part III: Doing Stuff with SUSE


    OpenOffice.org Writer, or Writer for short, is at the heart of the OpenOffice
    suite. Writer is a word processor that makes it easy for you to prepare many different
    types of documents on your SUSE Linux system and, best of, share files with others
    who use Microsoft Word.


    Typically you might work with Microsoft Word files that your co-workers and friends
    (and maybe even family) send you. All you have to do is save the file in a folder
    and open it in Writer. It provides an overview of how to open a document, work
    on it, and save it to a folder. Along the way, I summarize how to perform common
    word processing tasks with Writer.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_205_0.png)


    Before your expectations go-high, let me caution you that if you share files between
    Microsoft Word and Writer, you may run into some conversion problems; some Word
    features may not convert fully into equivalent Writer features. However, if you
    share only simple documents with Microsoft Word users (or if you simply want to
    prepare your nicely formatted documents), Writer should work well for you.


    By the way, if you''re already a proficient Word user, you should be able to start
    using Writer without much trouble because of Writer works much like Word.


    # Taking stock of OpenOffice.org Writer


    Before you begin using Writer, I want to get a quick overview of its major features.
    When you know what you can do with Writer, you can read the subsequent sections
    to find out how to perform specific tasks in Writer, such as formatting tables,
    printing documents, and tracking changes.


    You can do the following with Writer:


    +   Open and edit Microsoft Word files or convert them to Writer format. One advantage
    of converting to Writer format is that Writer files are much smaller in size than
    corresponding Microsoft Word files.


    +   Save documents in many different formats including Microsoft Word 97/2000/XP,
    Word 95, Word 6.0, Rich Text Format (RTF), StarWriter 5.0 (as well as 4.0 and
    3.0), plain text, Adobe PDF, and Web page (HTML).


    +   Insert graphics files of many different formats, including JPEG, GIF, Soft
    Paintbrush (PCX), TIFF, Windows BMP, Macintosh PICT, Encapsulated PostScript (EPS),
    Adobe Photoshop (PSD), AutoCAD DXF, and many more.


    +   Create tables that can include calculations and add charts that update when
    the table contains content.


    +   Perform complex page layouts with desktop publishing features like text frames
    and floating frames.'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# Chapter 12: Preparing Documents and Spreadsheets in SUSE Linux 185


    +   - Easily create and organize multiple files that make up a large project such
    as a book or a large report.


    +   - Create a mail merge where you write a single document with generic fields
    and Writer automatically create many different customized documents by filling
    in the specific fields (such as name, address, and phone number) from a database.


    +   - Save versions of a document as you continue to change it, and revert to
    an older version if necessary.


    +   - Compare changes and work collaboratively using the Versions system. Not
    only can you see what you have changed and who changed it, but you can also accept
    or reject those changes individually (or in groups) according to certain criteria.


    A note of caution here: The versioning information doesn''t export perfectly to
    other formats, in particular, Microsoft Word.


    +   - E-mail your documents directly from Writer.


    If you like, Writer can automatically complete the word you''re typing by making
    a best guess and you can accept the choice by pressing Enter. (If this feature
    drives you, you can simply turn it off, just as you can configure other features
    in Writer).


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_206_0.png)


    Writer enables you to print a Writer document directly to an Adobe Portable Document
    Format (PDF) file. To electronically share a document in its final form, you can
    print the document to a PDF file and distribute that file. Anyone can easily view
    and print PDF files by using the free Adobe Reader (available at www.adobe.com/products/acrobat/readstep2.html).


    # Getting started with Writer


    The best way to learn how to use Writer is simply starting it. To start Writer,
    click the Writer icon on the panel (the icon showing some pieces of paper with
    a pen) or choose Main Menu:Office; Writer:OpenOffice.org Writer in KDE or GNOME.


    Writer displays its main window (Figure 12-1) with an empty document.


    Using Writer is simple because it''s so similar to other word processors that
    you''ve probably used, such as Microsoft Word. For example, you can type text
    into the blank document, format it, and save it when you need to. If you want
    to work on an existing document (for example a Microsoft Word file) that you''ve
