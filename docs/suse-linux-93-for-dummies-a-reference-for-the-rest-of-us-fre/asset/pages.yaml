  md: '# 14 Part I: Getting to Know SUSE


    # The GNU Project


    GNU is a recursive acronym that stands for GNU''s not UNIX. The GNU Project launched
    in 1984 by Richard Stallman to develop a complete UNIX-like operating system.
    The GNU Project developed nearly everything needed for the operating system except
    for the operating kernel. All GNU software was distributed under the GNU General
    Public License (GPL) essentially requires that the software is distributed in
    source-code form and stipulates that any user may copy, modify, and distribute
    the software to anyone


    else in source-code form. Users may, however, have to pay for their individual
    copies of GNU software.


    The Free Software Foundation (FSF) is a tax-exempt charity that raises funds for
    work on the GNU Project. To find out more about the GNU Project, visit its page
    at www.gnu.org. You can find information about how to contact the Free Software
    Foundation and how to help the GNU Project.


    # GUIs and applications


    Face it — typing cryptic Linux commands on a terminal is boring. For average users,
    using the system through a graphical user interface (GUI), pronounced "gooey"
    — one that you pictures to click and windows (with a small w) to open — is much
    easier. This is where the Window System, or X, comes to the rescue.


    X is kind of Microsoft Windows, but the underlying details of how X works are
    completely different from Windows. Unlike Windows, X provides the basic features
    of displaying windows on-screen, but it does not come with any specific look or
    feel for graphical applications. That look and feel comes from GUIs, such as GNOME
    and KDE, which make use of the X System.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_35_0.png)


    SUSE comes with the Window System in the form of X.Org X11 — an implementation
    of the Window System for 80x86 systems. X.Org X11 works with a wide variety of
    video cards used in today''s PCs.


    As for the GUI, SUSE includes a choice of powerful GUI desktops: KDE (K Desktop
    Environment) and GNOME (GNU Network Environment). You can choose to install either
    KDE or GNOME on your system. KDE and GNOME provide desktops similar to those of
    Microsoft Windows and Apple Mac OS. With GNOME or KDE, you can begin using your
    SUSE Linux system without having to know cryptic Linux commands. However, if you
    ever need to use those commands directly (or when you become a Linux'
