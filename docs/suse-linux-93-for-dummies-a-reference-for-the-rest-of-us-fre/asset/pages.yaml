  md: '# 98 Part II: Test Driving SUSE


    An interesting feature of the ls command is that it doesn''t list any file whose
    name begins with a period. To see these files, you must use the ls command with
    the -a option, as follows:


    ```

    ls -a

    ```


    Try this command in your home directory (and then compare the result with what
    you see when you don''t use the -a option:


    +   1. Type cd to change to your home directory.

    2. Type ls -F to see the files and directories in your home directory.

    3. Type ls -af to see everything, including the hidden files.


    Most Linux commands take single-character options, each with a minus sign (think
    of this sign as a hyphen) as a prefix. When you want to use several options, type
    a hyphen and concatenate (string together) the option letters, one after another.
    Thus, ls -al is equivalent to ls -a -l as ls -al -1.


    # Commands for working with files


    Copy files from one directory to another, use the cp command. For example, to
    copy the file /usr/X11R6/lib/X11/xinit/clients to the Xclients.sample file in
    the current directory (such as your home directory), type the following:


    ```

    cp /usr/X11R6/lib/X11/xinit/xinitrc.sample

    ```


    Copy a file to the current directory but retain the original name, use a period
    (.) as the second argument of the cp command. Thus, the following command copies
    the Xresources file from /etc/X11 directory to the current directory (denoted
    by a single period):


    ```

    cp /etc/X11/Xresources

    ```


    The cp command makes a new copy of a file and leaves the original intact.

    If you want to copy the entire contents of a directory — including subdirectories
    and their contents — to another directory, use cp -ar sourced destdir. (This command
    copies everything in the sourced directory to destdir.) For example, to copy all
    files from the /etc/X11 directory to the current directory, type the following
    command:


    ```

    cp -ar /etc/X11

    ```'
