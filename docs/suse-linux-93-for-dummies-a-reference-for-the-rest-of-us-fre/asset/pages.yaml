    # Newsgroup subscriptions


    Unlike magazines or newspapers, newsgroups don''t require that you subscribe to;
    you can read any available newsgroup on the news server. The server''s administrator
    may decide to exclude certain newsgroups, however; if they aren''t included, you
    can read them.


    > Figure 11-7. Reading a news item in Pan.


