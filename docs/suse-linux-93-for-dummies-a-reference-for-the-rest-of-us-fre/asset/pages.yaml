    # Working with large documents


    What''s a large document? Well, I consider a large document any over a hundred
    pages or so. Anything that might have a couple of chapters and need a table of
    contents and an index definitely qualifies as a large document — for example,
    a book. Writer includes features to do the "usual things" you''d want to do when
    working with these larger, more documents, such as creating tables of content,
    inserting indexes, and adding entries to indexes.


    Writer also enables you to tie together several Writer files into a single large
    document — what Writer refers as a master document. Master documents are ideal
    for books, for example. You can keep the chapters in separate files and then organize
    these files into a book using the master document feature. For a large project
    involving a master document, you have to plan a little and take care of the following
    key steps:'
