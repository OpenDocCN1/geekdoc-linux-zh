  md: '# Does Linux really run on any computer?


    Well, it runs on almost any computer. Let''s see....Nowadays, you can get versions
    of Linux for systems based on Intel 8086, Pentium, and other Intel compatible
    processors; AMD''s 64-bit AMD64 processors; the Motorola 68000 family; Alpha AXPs;
    Sun SPARCs and UltraSPARCs; Hewlett-Packard''s HP PA-RISC; the PowerPC and Power64
    processors; the MIPS R4x00 and R5x00; even IBM mainframes.


    multius and multitasking these days, but when Linux first started in 1994, multiuser
    and multitasking were big selling points.


    All the different names that you hear for Linux — SUSE, Red Hat, Debian, Knoppix,
    Xandros you name it — are actually the names of different Linux distributions.


    A Linux distribution is basically the Linux kernel (the operating system) together
    with a huge collection of applications, along with an easy-to-use installation
    program. By the way, most people just say Linux to refer to a specific Linux distribution.


    Many different Linux distributions exist, and each includes the standard Linux
    operating system and the following major packages:


    +   The X Window System: The graphical user interface.


    +   One or more graphical desktops: Among the most popular are GNOME and KDE.


    +   A collection of applications: Linux programs come in the form of ready-run
    software, but the source code (the commands used to tell the computer what to
    do) is included (or easily available), as is its documentation.


    Current Linux distributions include a huge selection of software — so that it
    usually requires multiple CD-ROMs or a single DVD-ROM (which this includes).


    The development and maintenance of the Linux kernel, software packages and the
    Linux distributions themselves are organized as open source projects. In a nutshell,
    open source means you have access to the source code. Your succinct definition
    is pretty basic, so to find out more details of what open source means and to
    see some acceptable open source licenses, please visit the Open Source Initiative
    Web site at www.opensource.org.


