  md: '# 52 Part I: Getting to Know SUSE


    # Shutting Down


    When you''re ready to shut down Linux, you must do so in an orderly manner. Even
    if you''re the sole user of a SUSE Linux PC, several other programs are usually
    running in the background. Also, operating systems such as Linux try to optimize
    the way that they write data to the hard drive. Because hard drive access is relatively
    slow (compared with the time needed to access memory locations), data generally
    is held in memory and written to the hard drive in large chunks. Therefore, if
    you simply turn off the power, you run the risk that some files aren''t updated
    properly.


    Any user (you don''t even have to be logged in) can shut down the system from
    the desktop or from the graphical login screen. In KDE, choose Main Menu~Log Out.
    In GNOME, choose System Menu~Log Out. A dialog box appears (Figure 3-10 shows
    the example from the KDE desktop), providing the options for restarting or turning
    off the system, or simply logging out. To shut down the system, simply select
    Turn Off Computer (or Shut Down in GNOME), and click OK. The system then shuts
    down in an orderly manner.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_73_0.png)


    Figure 3-10: Shutting down your SUSE Linux system from the KDE desktop.'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# Chapter 3: Starting SUSE for the First Time 53


    If you are at the graphical login screen, you can shutdown the system by selecting
    the shutdown option from the menus available at the login screen.


    As the system shuts down, you see text messages about processes being shut down.
    You may be surprised at how many processes exist, even when no one is explicitly
    running any programs on the system. If your system does not automatically power
    off on on shutdown, you can manually turn off the power.


    Note that shutting down or rebooting the system may not require root access or
    even the need to log into the system. This is why it''s important to make sure
    that physical access to the console is protected adequately so that anyone who
    wants to cannot simply walk up to the console and shut down your system.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_74_0.png)'
