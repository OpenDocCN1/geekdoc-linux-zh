  md: '# Chapter 14: Playing Music and Burning CDs 219


    # Playing Music Files


    Typically, digital music files are stored in MP3 format and the filenames an .mp3
    extension. Both KDE and GNOME desktops include several applications for playing
    digital music.


    The music players can also play digital music in other formats besides MP3 such
    as Ogg Vorbis, FLAC (Free Lossless Audio Codec, an audio file format that is similar
    to MP3), and Windows WAV.


    In KDE, you can use amaroK, Juk, or RealPlayer to play music. Each application
    is straightforward to use. Start Main Menu; Multimedia; Audio Player; amaroK.
    To play music, click the PL button in the lower-left corner of the amaroK window
    (see Figure 14-4). Browse the folders to locate the music file and double-click
    to play. Figure 14-4 shows amaroK playing an MP3 file. Use the buttons on the
    toolbar at the bottom to control the music playback.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_240_0.png)


    With Juk, choose Main Menu; Multimedia->ukebox from the KDE desktop. Juk is short
    for jukebox. You can load a bunch of music files into Juk and play them one after
    another or in any order you want. When you first start Juk, Juk displays a dialog
    box that prompts you to add a folder (containing music files). After you select
    the folder containing music files, Juk displays the list and you can select a
    title and click the play button (on the toolbar) to play that. Figure 14-5 shows
    Juk with a slew of MP3 files and a selected file that it''s currently playing.


    You can also use RealPlayer to play MP3 music in SUSE Linux. If you use RealPlayer
    on both KDE and GNOME desktops, to start RealPlayer, choose Main Menu; Multimedia;
    RealPlayer in KDE or Main Menu; Multimedia; RealPlayer 10 in GNOME.


    When you first start RealPlayer, the RealPlayer Setup Assistant appears and prompts
    you to set up RealPlayer. You have to accept a license agreement and you can also
    configure Mozilla helpers that you can play audio and clips from inside the Mozilla
    Web browser.'
