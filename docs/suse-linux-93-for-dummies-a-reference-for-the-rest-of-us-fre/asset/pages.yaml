  md: '# Chapter 11


    # Reading Newsgroups


    In This Chapter


    +   - Understanding newsgroups

    - Reading newsgroups from your ISP using KNode and Pan reader

    - Reading and searching newsgroups at some Web sites


    Internet newsgroups are like the bulletin board systems (BBSs) of the preWeb age
    or the forums offered on online systems such as AOL and MSN. Essentially, newsgroups
    provide a distributed conferencing system that spans the globe. You can post articles
    — essentially e-mail messages to a whole group of people — and respond to articles
    others have been posted.


    Think of an Internet newsgroup as a gathering place — a virtual meeting place
    where you can ask questions and discuss various issues (best of all, everything
    you discuss gets archived (for posterity).


    To participate in newsgroups, you need access to a news server — your Internet
    service provider (ISP) can give you this access. You also need a newsreader. SUSE
    Linux comes with software that you can use to read newsgroups. In this chapter,
    I introduce you to newsgroups and show you how to read newsgroups with KNode and
    Pan newsreaders. I also briefly explain how you can read and search newsgroups
    for free at a few Web sites.


    # Understanding Newsgroups


    Newsgroups originated in Usenet — a store-and-forward messaging network that was
    widely used for exchanging e-mail and news items. Usenet works like a telephone
    in that news and mail are relayed from one system to another. In Usenet, the systems
    are not on any network; the systems simply dial up one another and use the UNIX-to-UNIX
    Copy Protocol (UUCP) to transfer text messages.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# 170 Part III: Doing Stuff with SUSE


    Although it is a very loosely connected collection of computers, Usenet works
    well and continues to be used because very little expense is involved in connecting
    to it. All you need is a modem and a site willing to store and forward your mail
    and news. You have to set up UUCP on your system, but you don''t need a sustained
    network connection; just a few calls are all you need to keep the e-mail and news
    flowing. The downside of Usenet is that you cannot use TCP/IP services like the
    Web, TELNET, or FTP with UUCP.


    From your Usenet origins, the newsgroups have migrated to the Internet (even though
    the newsgroups are still called *Usenet newsgroups*). Instead of UUCP, the Network
    News Transfer Protocol (NNTP) now transports the news.


    Although (for most of the world) the news transport protocol has changed from
    UUCP to NNTP, the store-and-forward concept of news transfer remains. Thus, if
    you want to get news on your SUSE Linux system, you can find a news server from
    which your system can download news. Typically, you can use your ISP''s news.


    # Newsgroup hierarchy


    The Internet newsgroups are organized in a hierarchy for ease of maintenance as
    well as ease of use. The newsgroup names help keep things straight by showing
    the hierarchy.


    Admittedly, these newsgroup names are written in Internet-speak, which can seem
    rather obscure at first. The language is pretty easy to pick up with a little
    bit of explanation. For example, a typical newsgroup name looks like this:


    ```

    comp.os.linux.announce

    ```


    This name says that comp.os.linux.announce is a newsgroup for announcements (announce)
    about the Linux operating system (os.linux) and that these subjects fall under
    the broad category of computers (comp).


    As you can see, the format of a newsgroup name is a sequence of words separated
    by periods. These words denote the hierarchy of the newsgroups. Figure 11-1 illustrates
    the hierarchical organization of newsgroups.


    To understand the newsgroup hierarchy, compare the newsgroup name with the pathname
    of a file (for example, /usr/lib/X11/xinit/Xclients) in Linux. Just as a file''s
    pathname shows the directory hierarchy of the file, the newsgroup name shows the
    newsgroup hierarchy. In filenames, a slash (/) separates the names of directories;
    in a newsgroup name, a period (.) separates the different levels in the newsgroup
    hierarchy.'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# Chapter 11: Reading Newsgroups 171


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_192_0.png)


    In a newsgroup name, the first word represents the newsgroup category. The comp.os.linux.announce
    newsgroup, for example, is in the comp category whereas alt.books.technical is
    in the alt category.


    # Top-level newsgroup categories


    Table 11-1 lists some of the major newsgroup categories. You find a wide variety
    of newsgroups covering subjects ranging from politics to computers. The Linux-related
    newsgroups are in the comp.os.linux hierarchy.


    | Table 11-1 | Major Newsgroup Categories |

    | Category | Subject |

    | alt | "Alternative" newsgroups (not subject to any rules), which run the gamut
    from the mundane to the bizarre |

    | bionet | Biology newsgroups |

    | bit | Bitnet newsgroups |

    | biz | Business newsgroups |

    | clari | Clarinet news service (daily news) |

    | (continued)'
  merge: -1
  pgno: 192
- img_proc: true
  md: '# 172 Part III: Doing Stuff with SUSE


    | Table 11-1 (continued) |

    | Category | Subject |

    |---|---|n| comp | Computer hardware and software newsgroups (includes operating
    systems such as Linux and Microsoft Windows) |

    | ieee | Newsgroups for the Institute of Electrical and Electronics Engineers
    (IEEE) |

    | k12 | Newsgroups devoted to elementary and secondary education |

    | linux | Newsgroups devoted to Linux |

    | misc | Miscellaneous newsgroups |

    | news | Newsgroups about Internet news administration |

    | rec | Recreational and art newsgroups |

    | sci | Science and engineering newsgroups |

    | talk | Newsgroups for discussing social issues (think ''talk radio'') |


    This short list of categories is deceptive because it doesn''t really tell you
    about the wide-ranging variety of newsgroups available in each category. The top-level
    categories number close to a thousand, but many top-level categories are distributed
    only in specific regions of the world. Because each newsgroup category contains
    several levels of subcategories, the overall count of newsgroups can be close
    to 50,000 or 60,000! The comp category has more than 500 newsgroups.


    Unfortunately, many newsgroups are flooded with spam, just like your e-mail Inbox,
    only worse because anyone can post anything on a newsgroup. Some newsgroups, called
    *moderated newsgroups*, offer some relief. Anyone who wants to post on a moderated
    newsgroup must first submit the article to a moderator — a human being — who can
    decide whether to post the article or reject it. You can reduce the spam overload
    by browsing moderated newsgroups whenever possible.


    # Some Linux-related newsgroups


    Typically, you have to navigate your choice of newsgroups according to your interests.
    If you''re interested in Linux, you can pick one or more of these newsgroups:


    +   - comp.os.linux.admin: Information about Linux system administration.

    - comp.os.linux.advocacy: Discussions about promoting Linux.'
