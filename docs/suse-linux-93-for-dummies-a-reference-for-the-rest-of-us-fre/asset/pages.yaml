    want a user to be in other groups as well, so that the user can access the files
    owned by that group. Adding a user to another group is easy. For example, suppose
    I want to add the username *naba* to the group called *wheel*. I type *su -* to
    become *root* and then simply type the following command in a terminal window:


    ```

    usermod -G wheel naba

    ```


    To remove a user account in SUSE, click the username in the list of user accounts
    (refer to Figure 17-6). Then click the Delete button.'
