    The only thing that can be called "subscribing" is when you indicate the newsgroups
    you routinely want to read. Any of this subscription information — the information
    is used only by the newsreader to determine what to download from the news server.


    # Posting news


    You can use any reader to post a news article (a new item or a reply to an old
    post) to one or more newsgroups. The exact steps for posting'
