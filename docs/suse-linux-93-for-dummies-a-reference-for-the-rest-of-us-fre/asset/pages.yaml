  md: '# Chapter 3


    # # Starting SUSE for the First Time


    In This Chapter


    +   - Powering up SUSE Linux

    - Logging in

    - Checking out the GUI desktops

    - Playing with the shell

    - Shutting down


    You''re sitting in front of your PC about turn it on. You know that the PC has
    SUSE Linux installed. You''re wondering what to expect when you turn it on and
    what you do afterward. Not to worry. If you''re using SUSE Linux for the first
    time, this chapter shows you how to log in, check out the graphical desktops,
    try out some cryptic Linux commands, and finally, shut down the PC.


    If this quick tour of SUSE Linux seems hurried, don''t worry; I cover everything
    at a slower pace and with more details in later chapters.


    For those who already know something about SUSE Linux, flip through this chapter
    to see if anything looks new. You never know what you may not know!


    # # Powering Up SUSE Linux


    When you power up the PC, it goes through the normal power-up sequence and loads
    the boot loader - called GRUB. The boot loader is a tiny program that loads the
    rest of the operating system from the hard drive into the computer''s memory.
    The whole process of starting up a computer is called booting.


    The GRUB boot loader displays a graphical screen with the names of the operating
    systems that the boot loader can load. For example, if your PC has both Microsoft
    Windows and SUSE Linux installed on the hard drive, you see both names listed.
    Use the up- and down-arrow keys to select the operating'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# 40 Part I: Getting to Know SUSE


    system you want to use and press Enter. If the PC is set up to load SUSE Linux
    by default, you don''t have to do anything — after a few seconds the boot loader
    starts SUSE Linux.


    You see a graphical boot screen that shows information about the progress of the
    system setup. If you selected KDE as your desktop and enabled automatic login
    during installation, you are automatically logged in and you get a KDE desktop
    similar to the one shown in Figure 3-1.


    By the way, SUSE Linux logs you in using the the normal user account that you
    set up during installation.


    For a GNOME desktop, you get a graphical login screen, similar to the one shown
    in Figure 3-2.


    You can log in using the account you defined during the installation. Type the
    username and press Enter. When prompted for it, type the password and press Enter.
    Then you see the initial GNOME graphical user interface (GUI) — pronounced gooey
    (for short) appear.


