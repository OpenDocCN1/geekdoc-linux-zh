  md: '# Commands for directory navigation


    In Linux, when you log in as root, your home directory is /root. For other users,
    the home directory is usually in the /home/directory. My home directory (when
    I log in as naba) is /home/naba. This information is stored in /etc/passwd file.
    By default, you have permission to save files in your home directory, and only
    you can create subdirectories in your home directory to organize your files.


    Linux supports the concept of a current directory, which is the directory on which
    all file and directory commands operate. After you log in, your current directory
    is the home directory. To see the current directory, type the pwd command.


    To change the current directory, use the cd command. To change the current directory
    to /usr/lib, type the following:


    ```

    cd /usr/lib

    ```


    Then, to change the directory to the cups subdirectory in /usr/lib, type this
    command:


    ```

    cd cups

    ```


    Now, if you use the pwd command, that command shows /usr/lib/cups as the current
    directory.


    These two examples show that you can refer to a directory''s name in two ways:


    +   - An absolute pathname (such as /usr/lib) that specifies the exact location
    in the directory tree

    - A relative directory name (such as cups, which represents the cups subdirectory
    of the current directory, whatever that may be)


    If you type cd cups in /usr/lib, the current directory changes to /usr/lib/cups.
    If you type the same command in /home/naba, the shell tries to change the current
    directory to /home/naba/cups.


    Use the cd command without any arguments to change the current directory back
    to your home directory. No matter where you are, typing cd at the shell prompt
    brings you back home!


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_115_0.png)'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# Chapter 6: Finding and Organizing Files 95


    By the way, the tilde character (~) refers to your home directory. Thus the command
    cd ~ changes the current directory to your home directory. You can also refer
    to another user''s home directory by appending that name to the tilde. Thus, cd
    ~spiderman changes the current directory to the home directory of spiderman.


    Wait, there''s more. A single dot (.) and two dots (..) often referred to as dot-dot
    (clever, huhf!) also have special meanings. A single dot (.) indicates the current
    directory, whereas two dots (..) indicate the parent directory. For example, if
    the current directory is /usr/share/, you go one level up to


    ```

    cd ..

    ```


    # Commands for directory listings and permissions


    You can get a directory listing using the ls command. By default, the ls command
