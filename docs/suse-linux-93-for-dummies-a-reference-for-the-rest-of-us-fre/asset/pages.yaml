  md: '# 202 Part III: Doing Stuff with SUSE


    To learn more about the functions available in OpenOffice.org Calc, choose Help:Contents.
    This opens the OpenOffice.org Help window, from which you can browse the functions
    by category and click a function to read more about it.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_223_0.png)


    One interesting feature of Calc is the support for scenarios. A scenario is simply
    a collection of values for one or more cells. Scenarios are useful when you compare
    the effect of some cells on other calculations in the spreadsheet. For example,
    the monthly payment on a loan would depend on the principal, the interest rate,
    and the duration of the loan. You use Calc''s scenario to compare the monthly
    payments for a number of different scenarios where each scenario has a certain
    combination of interest rate and loan duration in months. Use this scenario for
    this comparison, follow these steps:


    +   1. Set the spreadsheet cells with labels and values for the principal, annual
    interest rate in percentage, and loan duration in months (refer to Figure 12-12).
    Calculate the monthly payment using this formula:


    ```

    -PMT(MONTHLY_RATE:MONTHS:PRINCIPAL)

    ```


    Figure 12-12 illustrates this case. The cells in the range B5:C7 specify the principal,
    annual rate, and the number of cells. Cell C6, with the interest rate, is formatted
    to show a percentage. Cell C11 computes the payment using the formula that you
    see in the formula bar. Notice that the annual rate in C6 has to be divided by
    12 to get the monthly rate.


    +   2. Select the cells that you want to include in the scenario and choose Tools:Scenarios.
    For example, in Figure 12-12, select the cells in the range B5:C7.


    +   3. Fill in the scenario name, and then click OK.


    For example, the scenario shown in Figure 12-12 is named Rate_6_5_PCT (that''s
    my name for the 6.5% scenario).


    +   4. Enter values into the cells — principal, interest rate, and months to repay
    loan.


    The scenario name appears in a drop-down list above the cells that constitute
    the scenario (as shown in Figure 12-12). The cell values define what scenario
    means.


    +   5. Repeat Steps 2, 3, and 4 for other scenarios where each scenario has a
    combination of principal amount, rate, and loan duration in months.


    +   6. Select a scenario from the drop-down list (refer to Figure 12-12) to see
    the monthly payment for that scenario.'
  merge: -1
