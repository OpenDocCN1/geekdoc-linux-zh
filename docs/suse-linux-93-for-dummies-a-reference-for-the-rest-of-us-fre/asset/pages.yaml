    # Commands for finding files


    The find command is very useful for locating files (and directories) that meet
    your search criteria.


    When I began UNIX many years ago (Berkeley UNIX in the early 1980s), I was confounded
    by the find command. I stayed with one basic syntax of find for a long time before
    graduating to more complex forms. The basic syntax I discovered first was for
    finding a file anywhere in the file system. Here''s how it goes: Suppose you want
    to find any file or directory with a name that starts with gnome. Try the following
    find command to find these files:


    ```

    find -name "gnome" -print

    ```


    If you''re not logged in as root, you may get a bunch of error messages. If these
    error messages annoy you, just modify the command as follows and the error messages
    are history (or, as UNIX aficionados said, "Send ''em to the bit bucket":")


    ```

    find -name "gnome" -print 2 > /dev/null

    ```


    This command tells find to start looking at the root directory (/) for files that
    match gnome*, and to display the full pathname of any matching file. The last
    part (2 > /dev/null) simply sends the error messages to a special file that is
    the equivalent of simply ignoring them


    You can use variations of this simple form of find to locate a file in any directory
    (or as any subdirectories contained in the directory). If you forget where your
    home directory you''ve stored all files named report* (names that start with report),
    you can search for the files by using the following command:


    ```

    find ~ -name "report**" -print

    ```'
