  md: '# # Appendix


    # # About the DVD-ROM


    **In This Appendix**


    +   - System requirements

    - DVD installation instructions

    - What you''ll find on the DVD

    - Troubleshooting


    T his book''s companion DVD includes a Special Edition of SUSE Linux to get you
    started on your Linux journey. This appendix briefly describes the DVD and tells
    you how to get started with the installation.


    # # System Requirements


    Make sure that your computer meets the minimum system requirements shown in the
    following list. If your computer doesn''t match to most of these requirements,
    you may have problems with the software and files on the DVD:


    +   - A PC with an Intel or compatible processor running at 400 MHz or faster
    for graphical installation

    - At least 520MB of total RAM installed on your computer for graphical installation
    (256MB recommended)

    - At least 520MB free space on your hard drive for a minimal installation; 5GB
    of free space recommended if you plan to install most packages, so that you can
    try out everything covered in this book

    - A DVD-ROM drive

    - A graphics card and a monitor capable of displaying at least 256 colors

    - A sound card

    - Ethernet network interface card (NIC) or modem'
  merge: -1
  pgno: 362
- img_proc: true
  md: '# 342 SUSE Linux 9.3 For Dummies


    # DVD Installation Instructions


    To install SUSE Linux from the companion DVD, follow these steps (consult Chapter
    2 for details.).


    +   1. Check whether your PC''s hardware, such as graphics card, network card,
    and SCSI card, work in SUSE Linux. If not, to find Linux drivers for the device.


    To check if your PC''s hardware is compatible with SUSE Linux, visit the SUSE
    Linux Hardware Database at hardwaredb.suse.de. If you download any Linux drivers
    for any device, you should burn them onto CD for safekeeping.


    +   2. Set up your PC to boot from the CD/DVD drive (to do this, you have to enter
    SETUP as your PC powers up).


    +   3. Boot your PC with the DVD.


    +   4. Select Installation from the initial boot screen and press Enter.


    The SUSE Linux installer — YaST runs and displays graphical screens through which
    you perform the installation steps. Respond to the questions and choices as the
    installation program takes you through the initial installation steps. Here are
    some key steps:


    +   Review the hard partitioning that YaST recommends. If you have Microsoft Windows
    (any version) installed on your hard drive, YaST can reduce the size of the Windows
    partition and make space for SUSE Linux. You don''t need any other partitioning
    software.


    +   Set the local time zone.


    +   If you want, change the software selection from the default KDE desktop to
    the GNOME desktop.


    +   5. YaST reboots the system after the initial installation and continues with
    further installation and configuration of SUSE Linux.


    After installing more packages, YaST continues with configuration of the system.
    Here are a few key steps that you have to go through:


    +   Configure the Ethernet network, if any. Typically, you configure the network
    automatically using DHCP.


    +   Set the root password.


    +   Add a user account (you would typically log in using this account).


    +   Configure hardware such as a graphics card, sound card, and printers.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_363_0.png)'
