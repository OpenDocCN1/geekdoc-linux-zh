    # Using RPM Commands to Work with RPM Files


    RPM — Red Hat Package Manager — is a format for packaging all the necessary files
    for a software product in a single file — called an RPM file or simply an RPM.
    In fact, the SUSE Linux distribution is made up of a whole lot of RPMs. If you
    do not have a GUI tool like the YaST Control Center handy, you can still work
    with RPMs through the RPM commands. You have to type'
  merge: -1
  pgno: 301
- img_proc: true
  md: '# Chapter 18: Updating SUSE and Adding New Software 281


    commands at the shell prompt in a terminal window or a text console. Even if you
    don''t use the RPM commands to install or remove a package in SUSE Linux, you
    can still use the RPM commands to find out information about packages.


    # Using the RPM commands


    When you install an RPM-based distribution such as SUSE Linux, the installer uses
    the rpm command to unpack the packages (RPM files) and copy the contents to your
    hard drive.


    You don''t have to understand the internal structure of an RPM file, but you need
    to know how to use the rpm command to work with RPM files. Here are some of the
    things you can do with the rpm command:


    +   - Find the version numbers and other information about the RPMs installed
    on your system.

    - Install a new software package from an RPM. For example, you may install a package
    you skipped during the initial installation. You can do that with the rpm command.

    - Remove (uninstall) unneeded software you previously installed from an RPM. You
    may uninstall a package to reclaim the disk space, if you find that you rarely
    (or never) use the package.

    - Upgrade an older version of an RPM with a new one.

    - Verify that an RPM is in working order. You can verify a package to check that
    all necessary files are in the correct locations.


    As you can see, the rpm command is versatile — it can do a lot of different things,
    depending on the options you use.


    If you ever forget the rpm options, type the following command to see a list:


    ```

    rpm --help | more

    ```


    The number of rpm options will amaze you!


    # Understanding RPM filenames


    An RPM contains a number of files, but it appears as a single file on your Linux
    system. By convention, the RPM filenames have a specific format. A typical RPM
    filename looks like this:


    samba-3.0.9-2.1.1586.rpm'
  merge: -1
  pgno: 302
- img_proc: true
  md: '# 282 Part IV: Becoming a SUSE Wizard


    This filename has the following parts, the first three of which are separated
    by dashes (-):


    +   - Package name: samba

    - Version number: 3.0.9

    - Release number: 2.1

    - Architecture: i586 (this package is is for Intel 80586 or Pentium-compatible
    processors)


    Usually, the package name is descriptive enough for you to guess what the RPM
    may contain. The version number is the same as that of the software package''s
    current version number. Developers assign the release number to keep track of
    changes. The architecture is i586 or no-arch for the RPMs you want to install
    on a PC with an Intel Pentium or compatible processor.


    # Querying RPMs


    As it installs packages, the rpm command builds a database of installed RPMs.
    You can use the rpm -q command to query this database to find out information
    about packages installed on your system.


    For example, to find out the version number of an RPM installed on your system,
    type the following rpm -q command:


    ```

    rpm -q cups

    ```


    You see a response similar to the following:


    ```

    cups-1.1.21-5.3

    ```


    The response is the name of the RPM package. The name is the same as the RPM filename,
    except that the last part — i586.rpm — isn not shown, in this case, the version
    part of the RPM tells you that you have cups (the Common UNIX Printing System)
    version 1.1.21 installed.


    You can see a list of all installed RPMs by using the following command:


    ```

    rpm -qa

    ```


    You see a long list of RPMs scroll by your screen. To view the list one screen
    at a time,


    ```

    rpm -qa | more

    ```'
  merge: -1
