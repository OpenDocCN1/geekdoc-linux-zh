    # Instant Messaging in SUSE Linux


    Instant messaging (IM) is kind of like a phone call that you can communicate with
    others in real-time. The difference is that instead of talking, you type your
    messages in an IM client. Both you and the person you are communicating with each
    line of text right after you type it and press Enter. The IM client also allows
    you to post an Away message that lets others know that you are online but not
    available for conversation. Behind the scenes, instant messaging needs a central
    server that keeps track of all the online users and that facilitates sending the
    typed text between the parties engaged in messaging. That central server comes
    from an IM service'
