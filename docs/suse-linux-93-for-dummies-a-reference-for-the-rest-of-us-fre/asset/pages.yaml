  md: '# # Chapter 18


    # # Updating SUSE and Adding New Software


    In This Chapter


    +   - Updating SUSE Linux online with YaST Online Update (YOU)

    - Locating and installing new software using YaST

    - Working with RPM files with the rpm command


    Be it a bug fix or an enhancement, SUSE Linux often has updates that you need
    to install. Additionally, you may sometimes download new software. The updates
    come in the form of software patches, which refer to changes to existing software
    packages. The new software usually comes in the form of Red Hat Package Manager
    (RPM) files. Both patches and RPM files have to be installed — installing patches
    updates existing software and installing RPM files installs new software.


    You can use the GUI YaST Online Update (YOU) to keep SUSE Linux updated by downloading
    and installing patches. On the other hand, you can use YaST Control Center: Install
    and Remove Software to install new software (and also remove unneeded software).
    In case the GUI tool is not available, you can also use the rpm commands to install
    or remove software packages that come in the form of RPM files.


    In this chapter, I show you how to update SUSE Linux online and how to install
    and install new software using YaST. I also introduce you to the rpm commands
    that enable you to install or remove RPM software packages directly from a console
    or terminal.


    You need a fast Internet connection (such as a DSL or cable modem) to easily update
    your SUSE Linux applications or download new software packages. Make sure that
    your Internet connection is up and running before you attempt to update your SUSE
    Linux system online.'
  merge: -1
