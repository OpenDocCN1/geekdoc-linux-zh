  md: '# # Chapter 9


    # # Browsing the Web


    In This Chapter


    +   - Discovering the World Wide Web

    - Understanding a URL

    - Taking stock of Web browsers in SUSE Linux

    - Web browsing with Konqueror in KDE

    - Web browsing with Mozilla in GNOME

    - Introducing Epiphany and Firefox in GNOME


    > You probably already know about the Web, but did you know that the Web, or more
    formally the World Wide Web, made the Internet what it is today? The Internet
    has been around for quite a while, but it did not reach a mass audience until
    the Web came along in 1993.


    Before the Web came along, you had to use arcane UNIX commands to download and
    use files, which were simply too complicated for most of us. With the Web, however,
    anyone can enjoy the benefits of the Internet by using a Web browser — a graphical
    application that downloads and displays Web documents. A click of the mouse is
    all you need to go from reading a document from your company Web site to downloading
    a video clip from the country.


    In this chapter, I briefly describe the Web and introduce you to the Web browsers
    in KDE and GNOME. In KDE, the primary Web browser is Konqueror, which also doubles
    as a file manager. In GNOME, you have a choice of three Web browsers — Mozilla,
    Firefox, and Epiphany. I introduce you to all of these Web browsers in this chapter,
    but after you have used one Web browser, you can easily use any other Web browser.'
  merge: -1
