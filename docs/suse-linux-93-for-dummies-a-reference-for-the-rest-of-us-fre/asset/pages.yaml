  md: '# Chapter 6


    # Finding and Organizing Files


    In This Chapter


    +   - Understanding how Linux organizes files

    - Navigating the file system with Linux commands

    - Understanding file permissions

    - Manipulating files and directories with Linux commands


    To use files and directories well, you need to understand the concept of a hierarchical
    file system. Even if you use the GUI file managers to access files and folders
    (folders are also called *directories*), you can benefit from a file system that
    gives you the lay of the land.


    In this chapter, I introduce you to the Linux file system, and you discover how
    to work with files and directories with several Linux commands.


    # Figuring Out the Linux File System


    Like any other operating system, Linux organizes information in files and directories.
    In turn, hold the files. A *directory* is a special file that can contain other
    files and directories. Because a directory can contain other directories, this
    method of organizing files gives rise to a hierarchical structure. This hierarchical
    organization of files is called the *file system*.


    The Linux file system gives a unified view of all storage in your PC. The file
    system has a single *root directory*, indicated by a forward slash (/). Within
    the root directory reside is a hierarchy of files and directories. Parts of the
    file system can reside in different physical media, such as a hard drive, floppy
    disk, and CD-ROM. Figure 6-1 illustrates the concept of the Linux file system
    (which is the same in any Linux system whether it''s SUSE, Red Hat, or what you
    have) and how it spans multiple physical devices.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# 82 Part II: Test Driving USE


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_103_0.png)


    Figure 6-1: The Linux file system provides a unified view of storage that may
    span multiple storage devices.


    If you''re familiar with MS-DOS or Windows, you may find something missing in
    the Linux file system: You won''t find drive letters like c: and :d in Linux.
    All disk drives and CD-ROM drives are part of a single file system.


    In Linux, filenames can be long (up to 256 characters) and are case-sensitive.
    These filenames have multiple extensions, such as sample.tar.z, UNIX filenames
    can take many forms, such as the following: index.html, Makefile, XF86Config.install.old,
    vsftpd-2.0.1-i386.rpm, bash_profile, and apache-2.src.tar.


    To locate a file, you need more than just the filename. You also need information
    about the directory hierarchy. The extended filename, showing the full hierarchy
    of directories leading to the file, is called the pathname. As the name implies,
    it''s the path to the file through the maze of the file system. Figure 6-2 shows
    a typical pathname for a file in Linux.


    As Figure 6-2 shows, the pathname has the following parts:


    +   - The root directory, indicated by a forward slash (/

    - The directory hierarchy, with each directory name separated from the previous
    one by a forward slash (/) character. A / appears after the last directory name.'
