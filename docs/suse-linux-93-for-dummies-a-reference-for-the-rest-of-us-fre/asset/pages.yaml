  md: "# 192 Part III: Doing Stuff with SUSE\n\nTo create a new document from a template\
    \ you've installed, follow these steps:\n\n+   1. Choose File: New: Templates\
    \ and Documents.\n   A dialog box appears.\n2. Click Templates on the left pane\
    \ and then double-click the My Templates folder on the right pane.\n   You should\
    \ see the templates that you have installed.\n3. Select the template you want\
    \ to use and click Open.\n   A new document appears, typically with some text\
    \ illustrating the selected template's styles.\n4. Erase the text in the new document\
    \ and start typing what you want.\n   To view the styles in that template, open\
    \ the Stylist window by pressing F11 and apply styles by double-clicking them\
    \ in the Stylist.\n\nWriter also enables you to perform many other tasks related\
    \ to styles and templates. For example, you can create a style, apply a style\
    \ to text, copy styles from one template to another, and so on.\n\n# Doing page\
    \ layout\n\nIn Writer, page styles control the page layout, and each page can\
    \ have its own style. The usual approach is to define three page styles: First\
    \ Page, Left Page, and Right Page. Define the First Page style with whatever applies\
    \ to the first page such as a special header or no number. The Left Page is the\
    \ style for the even-numbered pages and the Right Page is for odd-numbered pages.\
    \ For each page style, you can also define the page style that applies to the\
    \ following page. The idea would be to define Left Page for First Page and Right\
    \ Page as the style of the page that follows the First page. That way, the page\
    \ styles are correct for all the pages as long as you start with the First Page\
    \ style. You may also want to define a Landscape page style so you can use it\
    \ for pages that have to be in landscape orientation.\n\n> REMEMBER\n\nIf you\
    \ are familiar with Microsoft Word, you know that the page setup — size, orientation,\
    \ margins, and so on — applies to all pages in the document. In Writer, a page\
    \ style does not automatically apply to the entire document. Instead, each page\
    \ has its own page style. Of course, you can choose to apply the same page style\
    \ to all the pages. Essentially, you have more fine-grained control over page\
    \ layouts in Writer."
  merge: -1
