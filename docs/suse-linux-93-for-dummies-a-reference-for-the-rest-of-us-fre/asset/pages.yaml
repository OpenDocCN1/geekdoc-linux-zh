  md: '# Chapter 13: Doing More Office Stuff in SUSE Linux 213


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_234_0.png)


    Figure 13-7:

    Select the presentation type from this dialog box and Create.


    That, in a nutshell, is how you create presentations in PowerPoint. In the following
    sections, I provide some quick tips for performing the following tasks with Impress:


    +   * Preparing presentations

    * Adding graphics and special effects

    * Delivering presentations


    # Preparing presentations


    Typically, you start with a blank slide with a specific layout. For example, the
    slide has a title area and a bulleted list for the points you want to make with
    the slide. You can click the title area, type the title, and then click the bulleted
    text area to start entering text. Then you add another slide and continue until
    the process you finish the presentation.


    If you''re going to present information that''s already in a Writer document,
    you can use the outline of that Writer document to start a presentation. The Writer
    document has to follow one rule—it must use the heading styles Heading 1, Heading
    2, and so on for the major sections in the document.


    To create a presentation from the outline of a Writer document that uses the heading
    styles, open the document in Writer and choose Send::Presentation from the Writer
    menu. You should see an Impress window open up with a new presentation that has
    slides based on the headings in the Writer document. Each Heading 1 style becomes
    a new slide and the Heading 2 and Heading 3 styles appear as bulleted text in
    the slides.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_234_1.png)'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# 214 Part III: Doing Stuff with SUSE


    After working on the set of slides, you may want to rearrange the slides. To rearrange
    slides in a different order, choose View>Slide Sorter. This displays an array
    of miniature-sized slides, arranged in a rectangular grid in the work area (as
    in Figure 13-8). Think of this as the slide sorter view because you can move the
    slides around and sort them in this view


    In the slide sorter view shown in Figure 13-8, you can drag and drop slides into
    different positions and rearrange them in the order you want. To delete a slide
    in this view, click the slide to select Delete (or Edit>Delete). When prompted
    to confirm the deletion, you can click Yes if you want to delete the slide. Double-click
    a slide to return to the usual single-slide view.


    As you work on the presentation, keep in mind these concepts:


    +   * Master slide: You can think of the master slide as the background of every
    slide. If you put text or other fields (such as date and page number) on the master
    slide, these elements appear on every slide in the presentation.

    * Layers: You can have layers in both the master slide as well as individual slide.
    Think of the layers as transparent sheets on which you place some related text
    and graphics. The slide is then made up of layers superimposed on one another.
    For example, if you''re drawing the plans for a house, you can put all the dimensions
    on a separate layer. The nice part is that you can show hide layers easily. Just
    click the third icon from the left on the Navigation bar (as see Figure 13-5)
    or choose View>Layer.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_235_0.png)


    Figure 13-8: Arrange slides in slide-sorter view in Impress.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Chapter 13: Doing Even More Office Stuff in SUSE Linux 215


    +   * Master notes and master handouts: The idea is the same as that for the master
    slide. You can define some fields and text on the master notes or master handout;
    these become part of the background for your notes and handouts. The notes refer
    to the explanatory text you add to the bottom of each slide. The handouts are
    printouts of the slides — typically several miniature slides to a page — that
    are handed out to the audience at a briefing.


    Well, I could go on and on, but you can discover its capabilities by simply starting
    to use Impress.


    # Adding graphics and special effects


    To jazz up your presentation, you might want to add graphics, charts, and other
    special effects to the slides. With Impress, you can do nearly everything you
    can think of — all you have to decide is how bells and whistles your presentation
    needs. It''s your call, but I recommend using these features just lest they detract
    from your presentation''s main message.


    If you want to add some simple drawings to the slide, you can pick from the drawing
    tools on the vertical toolbar on the left side of the Impress window (refer to
    Figure 13-9) and start drawing on the slide. To insert an image into the slide,
    choose Insert::Graphics and select the image file you want to insert.


    You can also insert charts to graphically depict data. You start by inserting
    a chart with dummy data, and then you edit the data as well as other features
    of the chart. To add a chart and edit the data, follow these steps:


    +   1. Choose Insert::Chart.

    A chart with the default chart type and dummy data appears.


    +   A mini-spreadsheet appears with the dummy data.


    +   3. Edit the row and column labels and edit the data you want the chart to
    display.


    +   4. When you''re editing the chart, click the green right arrow icon, located
    to the right of the toolbar, to apply the changes and close the Chart Data window.


    +   5. To change the chart type, right-click the chart and select Chart Type from
    the pop-up menu that appears; choose a new type and click OK.'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# 216 Part III: Doing Stuff with SUSE


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_237_0.png)


    Figure 13-9: Right-click the chart to modify the data and chart type.


    You can do a lot more than just add graphics and charts to your slide presentations.
    You can insert spreadsheets and Writer documents into a slide, add text that runs
    along a curve, and add special effects to various elements in a slide.


    # Delivering presentations


    After you prepare a spectacular set of slides, you have to deliver it to your
    audience. This typically involves tasks such as preparing speaker''s notes, running
    a slide show, converting the presentation into HTML for delivery over the Web,
    and printing handouts.


    You can also print an Impress presentation directly to an Adobe Portable Document
    Format (.pdf) file. This makes it easy to electronically share a presentation
    with everyone because anyone can easily view and print .pdf files using the free
    Adobe Reader.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_237_1.png)'
