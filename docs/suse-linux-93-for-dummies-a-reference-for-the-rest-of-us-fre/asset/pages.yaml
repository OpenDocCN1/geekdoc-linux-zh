  md: '# Chapter 7


    # # I Want My Internet, Now!


    In This Chapter


    +   * Understanding the Internet

    * Deciding how to connect to the Internet

    * Connecting to the Internet with DSL

    * Connecting to the Internet with a cable modem

    * Setting up a dialup link


    Having Internet access is almost a necessity nowadays. For example, if you want
    to access your e-mail, browse the Web, or get online updates for SUSE Linux from
    an Internet server, you need your PC connected to the Internet.


    If your PC is not already connected to the Internet, it''s a pretty safe bet for
    me to assume that you want to set up the Internet connection as soon as possible.
    In this chapter, I show you how to connect to the Internet in several different
    ways — depending on whether you have a DSL, cable modem, or dialup network.


    Two of the options for connecting to the Internet — DSL and cable modem — involve
    connecting a special modem to an Ethernet card on your Linux system. In this chapter,
    I show how to set up a DSL or a cable modem connection. I also show you another
    option — dialup networking — for connecting to the Internet that involves dialing
    up an Internet service provider (ISP) from your SUSE Linux system.


    You have to turn to Chapter 8 to learn how to connect your PC to an Ethernet local
    area network (LAN) and add wireless capability to your LAN.


    # # What is the Internet?


    How you view the Internet depends on your perspective. Regular folks see the Internet
    in terms of the services they use. For example, as a user, you might think of
    the Internet as an information-exchange medium with features such as'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# 106 Part II: Test Driving SUSE


    +   - E-mail: Send e-mail to any other user on the Internet, using addresses such
    as mom@home.net.


    +   - Web: Download documents and images from millions of servers through the
    Internet.


    +   - Newsgroups: Read newsgroups and post news items to newsgroups with names
    such as comp.os.linux.networking or comp.os.linux.setup.


    +   - Information sharing: Download software, music files, videos, and so on.
    Reciprocally, you may provide files that users on other systems can download.


    +   - Remote access: Log on another computer on the Internet, assuming you have
    access to that remote computer.


    The techies that the Internet is a worldwide network of networks. The term internet
    (without capitalization) is a shortened form of internetworking — the interconnection
    of networks. The Internet Protocol (IP) was designed to help connect many separate
    networks.


    In physical connections, the Internet is similar to a network of high-ways and
    roads. This similarity has prompted the popular press to dub the Internet "Information
    Superhighway." Just as the network of high-ways and roads includes interstate
    highways, state roads, and many more residential streets, the Internet has very
    high-capacity networks (for example, a 10 Gbps backbone can handle 10 billion
    bits per second and a large number of lower-capacity networks ranging from 56
    Kbps dialup connections to 45 Mbps links (Kbps is thousand-bits-per-second and
    Mbps is million-bits-per-second). The high-capacity network is the backbone of
    the Internet.


    In terms of management, the Internet is not run by a single organization, nor
    is managed by any central computer. You can view the physical Internet as a "network
    of networks" managed collectively by thousands of cooperating organizations. Yes,
    a collection of networks managed by thousands of organizations — sounds amazing,
    but it works!


    # Deciding How to Connect to the Internet


    If you want to connect to the Internet, but you don''t know how? Let me count
    the ways. Nowadays you have three popular options for connecting home offices
    and small offices to the internet (of course, huge corporations and governments
    have many other ways to connect):


    +   - Digital Subscriber Line (DSL): Your local telephone company, as well as
    other telecommunications companies, may offer DSL. DSL provides a way to send
    high-speed digital data over a regular phone line. Typically,


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_127_0.png)'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# Chapter 7: I Want My Internet, Now! 107


    DSL offers data-transfer rates between 128 Kbps and 1.5 Mbps. You can download
    from the Internet at much higher rates than you send data from your PC to the
    Internet (upload). One caveat with DSL is that your home must be between 12,000
    and 15,000 feet from your local central office (the phone-company facility where
    your phone lines end up). The distance limitation varies from provider to provider.
    In the United States, you can check out the distance limits for many providers
    at www.dslreports.com/distance.


    +   Cable modem: if the cable company in your area offers access over cable, you
    can use that to hook up your Linux system to the Internet. Typically, cable modems
    offer higher data-transfer rates than DSL—for about the same cost. Downloading
    data from the Internet via cable is much faster than sending data from your PC
    to the Internet. You can get routine download speeds of 1.5 Mbps and upload speeds
    of 128 Kbps, but sometimes you may get even higher speeds than these.


    +   Dialup networking: A dialup connection is what most folks using before DSL
    and cable modems came. You hook up your PC to the phone line. Then you dial an
    ISP to connect to the Internet. That''s why it''s called dialup networking—establishing
    a connection between your Linux PC and another network (the Internet) through
    a dialup modem. In this case, the maximum data-transfer rate is 56 Kbps.


    DSL and cable modem services connect you to the Internet and also act as your
    Internet service provider (ISP); in addition to improved speed, you pay for an
    IP address and your e-mail accounts. If you use a dialup modem to connect to the
    Internet, you first have to connect to the phone line (for which you pay the phone
    company) and then select and pay a separate ISP—which gives you a phone number
    to dial and all the other necessary goodies (such as an IP address and e-mail
    accounts).


    Table 7-1 summarizes all these options. You can consult that table and select
    the type of connection that''s available to you and that best fits your needs.


    | Table 7-1 Comparison of Dialup, DSL, and Cable |

    | Feature | Dialup | DSL | Cable |

    | --- | --- | --- | --- |

    | Equipment | Modem | DSL modem, Ethernet card | Cable modem, Ethernet card |

    | Also requires | Phone service and an Internet service provider (ISP) | Phone
    service and location within 12,000 to 15,000 feet of central office | Cable TV
    connection |


    (continued)'
