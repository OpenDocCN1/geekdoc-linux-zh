  md: '# Chapter 8


    # Setting Up an Ethernet LAN with Wireless Access


    # In This Chapter


    +   - Setting up an Ethernet LAN

    - Connecting your LAN to the Internet

    - Extending your network''s reach with wireless

    - Checking your network is up and running


    You might use an Ethernet network for your local area network (LAN) — at your
    office or even your home (if you happen to have several systems at home). Even
    if you have a single PC, you may need to set up an Ethernet network interface
    so that you can connect your PC to high-speed Internet access that uses a DSL
    or cable modem.(I cover DSL and cable modems in Chapter 7). In this chapter, I
    explain how to set up an Ethernet network.


    If you want to surf the net from anywhere in your home with your laptop PC, you
    can do so by adding wireless to your network. In the last part of this chapter,
    I show you how to set up wireless networking for connecting to an Ethernet LAN
    and accessing the Internet.


    # Getting a Handle on Ethernet


    Ethernet is a standard way to move packets of data between two or more computers
    connected to a single hub. (You can create larger networks by connecting multiple
    Ethernet segments with gateways.) To set up an Ethernet local area network (LAN),
    you need an Ethernet card for each PC. Linux supports a wide variety of Ethernet
    cards for the PC.'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# 124 Part II: Test Driving SUSE


    Ethernet is a good choice for the physical data-transport mechanism for the following
    reasons:


    +   - Ethernet is a proven technology that has been in use since the early 1980s.

    - Ethernet provides good data-transfer rates: Typically 10 million bits per second
    (100 Mbps), although 100-Mbps Ethernet and Gigabit Ethernet (1,000 Mbps) are now
    available.

    - Ethernet hardware is often built into the PC or can be installed at a relatively
    low cost. (PC Ethernet cards cost about $10 to $20 U.)

    - With wireless Ethernet, you can easily connect laptop PCs to your Ethernet LAN
    — without having to run wires all over the place. I explain Ethernet later in
    this chapter.


    # Connecting PCs to an Ethernet LAN


    Any time you hear experts talking about Ethernet, you''re also going to hear some
    bewildering terms used for the cables that carry the data. Here''s a quick rundown.


    Nowadays, the most popular form of Ethernet cabling is unshieldtwisted cable pair
    (UTP), known as 100BaseT or 100Base1 (because it can support data rates up to
    100 megabits per second). The Electronic Industries/Telecommunications Industries
    Association (EIA/TIA) defines the five categories of shielded and unshielded twisted-pair
    cables:


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_145_0.png)


    +   - Category 1 (Cat 1): Traditional telephone cable.

    - Category 2 (Cat 2): Cable certified for data transmissions up to 4 Mbps.

    - Category 3 (Cat 3): Cable that can carry signals up to a frequency of 16 MHz.
    Cat 3 is the most common type of wiring in old corporate networks and it normally
    contains four pairs of wire.

    - Category 4 (Cat 4): Cable that can carry signals up to a frequency of 20 MHz.
    Cat 4 wires are not common.

    - Category 5 (Cat 5): Cable that can carry signals up to a frequency of 100 MHz.
    Cat 5 cables have four pairs of copper wire. Cat 5 UTP is the most popular cable
    used in new installations today.


    To set up a 10BaseT Ethernet network, you need an Ethernet hub — hardware with
    RJ-45 jacks. (These look like telephone jacks.) You build the network by running
    twisted-pair wires (Category 5, or Cat5), from each PC''s Ethernet card to this
    hub. You can get a 4-port 10BaseT or 10BaseT Ethernet for about $20 U. Figure
    8-1 shows a typical small 10BaseT or 10BaseT Ethernet LAN that you may set up
    at a small office or at home.'
