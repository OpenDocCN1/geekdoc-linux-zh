    # Using fields


    Think of fields as information that might change, but you want to call them by
    a name and use them in your document. For example, you might want to insert the
    current date and the page numbers into the header of a document. You can do so
    by inserting fields that refer to the date and page numbers. Some of the predefined
    fields (such as date and page numbers) are easy to use. Simply choose insert:
    Fields and then select the field you want to insert.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_216_0.png)'
