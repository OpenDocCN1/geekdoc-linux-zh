  md: '# 320 Part V: The Part of Tens


    3. Now type the following command (change 50000k, which stands for 5000KB or about
    50MB, whatever you consider to be a large file):


    ```

    find / xdev -type f -size +50000k ls | sort -n -k 7,7 > bigfiles

    ```


    This command starts with the find command to find the files whose size exceeds
    50000KB (that''s what the option -size +50000k means). The part after the vertical
    bar | sorts the files by size, and bigfiles means the output is saved in a file
    named bigfiles in the current directory. The end result is that list of large
    files, sorted by size, will be in a file named bigfiles in the current directory.
    To view the list, type more bigfiles.


