    # # Practicing Good Host Security


    Host is the techie term for your Linux system — especially when you use it to
    provide services on a network. But the network makes sense when you think of the
    computer by itself; it''s the host for everything that runs on it — the operating
    system and all the applications. A key aspect of computer security is to secure
    your host.


    In this section, I take you through a few key steps to follow in securing your
    SUSE Linux host. These steps include installing operating system updates (steps
    that I outline in Chapter 18), protecting passwords, and protecting the files
    and directories.


    # ## Making passwords expire


    Obviously, leaving passwords lying around where anyone can get at them — even
    if they are encrypted — bad security. So instead of storing passwords in the `/etc/passwd`
    file (which any user can read), Linux now stores them in a shadow password file,
    `/etc/shadow`. Only the superuser (root) can read this file.


    The `/etc/shadow` file also includes fields that control when each password expires.
    You can use the change command to change the password-expiration information.
    For starters, you can check a user''s password-expiration information by using
    the change command with the `-1` option, as follows (in this case, you have to
    be logged in as root):


    ```

    change -1 root

    ```


    This command displays expiration information, including how long the password
    lasts and how often you can change the password.'
