  md: '# Chapter 6: Finding and Organizing Files 97


    The file''s group and owner appear to the left of the column that shows the file
    size. The next number to the left indicates the number of links to the file. (A
    link is like a shortcut in Windows.) Finally, the leftmost column shows the file''s
    permission settings, which determine who can read, write, or execute the file.


    The first letter of the leftmost column has a special meaning, as the following
    list shows:


    +   - If the first letter is 1, the file is a symbolic link (shortcut) to another
    file.

    - If the first letter is d, the file is a directory.

    - If the first letter is a dash (-), the file is normal.

    - If the first letter is b, the file represents a block device, such as a disk
    drive.

    - If the first letter is c, the file represents a character device, such as a
    serial port or terminal.


    After that first letter, the leftmost column shows a sequence of nine characters,
    which appear as `rwxrwxrwx` when each letter is present. Each letter indicates
    a specific permission. A hyphen (-) in place of a letter indicates no permission
    for a specific operation on the file. Think of these nine letters as three groups
    of three letters (`rwx`), interpreted as:


    +   - The leftmost group of `rwx` controls the read, write, and execute permissions
    of the file''s owner. In other words, if you see `rwx` in this position, the file''s
    owner can read (r), write (w), and execute (x) the file. A hyphen in the place
    of a letter indicates no permission. Thus the string `rw-` means the owner can
    read and write permissions but no execute. Although executable programs (including
    shell programs) typically have execute permission, directories treat execute permission
    as equivalent to use permission — a user must have execute permission on a directory
    before he can open and read the contents of the directory.

    - The middle three `rwx` letters control the read, write, and execute permissions
    of any user belonging to that file''s group.

    - The rightmost group of `rwx` letters controls the read, write, and execute permissions
    of all other users (collectively referred to as the *world*).


    Thus, a file with the permission setting `rw-` — is accessible only to the file''s
    owner, whereas the permission setting `rwxr-xr--` makes the file readable by the
    world.'
