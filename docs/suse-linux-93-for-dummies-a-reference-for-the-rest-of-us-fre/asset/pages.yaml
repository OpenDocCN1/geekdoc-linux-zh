    # Using Impress


    When you start Impress, the Presentation Wizard prompts you for the type of presentation
    you want. If Impress is already running, you get the Presentation Wizard when
    you choose File:New:Presentation. If you want a blank presentation, simply click
    Create in the first step of the Presentation Wizard. Impress displays a new window
    with a blank presentation.


    To change the slide layout, pick a new layout from a gallery of layouts shown
    on the right side of the new Impress window. Impress then displays an empty slide
    with the selected layout.


    Typically, a slide layout might have a title area and some text bullets. You can
    click and add the text to each of these areas. To insert any graphic image, choose
    Insert:Graphics and the graphics file you want to insert. You can draw directly
    on the slide by using the drawing tools from the vertical toolbar along the left
    side of the Impress window. To see which tool does what, move the mouse over any
    icon and a tooltip gives you a hint.


    After finish working on a slide, you can insert another slide by choosing Insert:Slide.
    Impress displays an Slide dialog box (similar to the Modify Slide dialog box in
    Figure 13-7) and you can select the layout for the next slide.


    To save a presentation, choose File:Save from the menu. For new documents, you
    have to provide a filename and select the directory to save the file.'
