    server from your ISP. The ISP provides you the name of the news server and any
    username and password needed to set up your news account on the newsreader you
    use.


    To read, you need a newsreader — a program that enables you to select a newsgroup
    and view the items in that newsgroup. You also have to understand the newsgroup
    hierarchy and naming conventions (which I describe in the "Newsgroup hierarchy"
    section, earlier in this chapter). Now I show you how to read news from a news
    server.


    If you don''t have access to newsgroups through your ISP, you can try using one
    of the many public news servers out there. For a list of public news servers,
    visit NewZBot at www.newzbot.com. At this Website, you can search for news servers
    that carry specific newsgroups.


    # Taking stock of newsreaders in SUSE Linux


