  md: '# 296 Part IV: Becoming a SUSE Wizard


    If you want to ensure that the user is forced to change a password every 90 days,
    you can use the -M option to set the maximum number of days that a password stays
    valid. To make sure that user naba is prompted to change the password in 90 days,
    I log in as root and type the following command:


    ```

    chage -M 90 naba

    ```


    You can use the command for each user account to ensure that all passwords expire
    when appropriate, and that all users must pick new passwords.


    # Protecting files and directories


    One important aspect of securing the host is to protect important system files—and
    the directories that contain these files. You can protect the files through the
    file ownership and through the permission settings that control who can read,
    write, or (in case of executable programs) execute the files.


    The default Linux file security is controlled through the following settings for
    each file or directory:


    +   - User ownership

    - Group ownership

    - Read, write, execute permissions for the owner

    - Read, write, execute permissions for the group

    - Read, write, execute permissions for others (everyone)


    Viewing ownerships and permissions


    You can see these settings for a file when you look at the detailed listing with
    the ls -1 command. For example, type the following command to see the detailed
    listing of /etc/inittab file:


    ```

    -1 /etc/inittab

    ```


    The resulting listing looks something this:


    ```

    -rw-r--r-- root root 2926 Nov 12 20:11 /etc/inittab

    ```


    In Chapter 6, I explain how to interpret the first characters on that line. For
    now, you should know that the set of nine characters, starting with the second
    one, describes the file permissions for user, group, and others. The third and
    fourth fields show the user and group that own this file. In this case, both user
    and group names are the same: root.'
