    is the GIMP (GNU Image Manipulation Program), a program

    working with photos and other images. The GIMP''s capabilities are on a

    with Adobe Photoshop.


    Providing productivity software — such as word-processing, spread-sheet, and databases
    is an area in which Linux used to be

    lacking. This situation has changed, however. SUSE Linux comes with the

