  md: '# Chapter 12: Preparing Documents and Spreadsheets in SUSE Linux 193


    A typical page layout task is to insert objects created in other OpenOffice.org
    applications, such as a Calc spreadsheet, an Impress slide, or a Draw drawing.
    You can insert such objects by choosing Insert>Object. Incidentally, OLE stands
    for Object Linking and Embedding, which is just a fancy term for the ability to
    create a document by adding objects like charts and drawings that are created
    in different applications.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_214_0.png)


    When you add objects to a document, keep this caveat in mind: You can edit an
    object directly in the document only by using the application that originated
    the object.


    One object that you can insert into a Writer document is a mathematical formula,
    and I mean serious formulas with integral signs and Greek letters like alpha and
    sigma. If you''re writing a scientific paper with complex equations, you''ll appreciate
    this feature of OpenOffice.org. Here''s a typical sequence of steps to insert
    a formula into a Writer document (this process is similar for inserting objects):


    +   1. Position the cursor and choose Insert::Object::Formula.


    The user interface changes to that of OpenOffice.org Math — an application for
    writing mathematical formulas — and a small frame for the formula appears in the
    document. The formula is typeset in that frame.


    +   2. Select a formula type from the two rows of the Selection window.


    The lower rows in the Selection window show available formulas of that type. For
    example, the summation category (denoted by an uppercase Greek letter sigma) includes
    integral signs.


    +   3. Click a specific formula, such as an integral.


    The Math command for this formula appears in the Commands window and parts of
    the formula appear in the document.


    +   4. Fill in the arguments for the formula.


    As you construct the formula with commands in the Commands window, the formatted
    formula appears in the document (Figure 12-6).


    +   5. To change the size of the formula, choose Format::Font Size and specify
    the font size.


    +   6. Click anywhere else in the Writer document to return to the Writer interface.


    +   7. Double-click the formula to edit it again.


    Of course, Writer has many layout features. You can use tables, numbered and bulleted
    lists, and columns. Writer also supports frames — rectangular boxes in which you
    can place text, graphics, and even other frames. Using frames, you can place just
    about anything anywhere in the document.'
