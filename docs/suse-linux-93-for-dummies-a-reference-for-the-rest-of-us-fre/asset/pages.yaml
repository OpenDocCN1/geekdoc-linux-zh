  md: '# 130 Part II: Test Driving SUSE


    # # Understanding Wired Equivalent Privacy (WEP)


    The 802.11 standard includes Wired Equivalent Privacy (WEP) for protecting wireless
    communications from eavesdropping. WEP relies on a 40-bit or 104-bit secret key
    that is shared between a mobile station (such as a laptop with a wireless Ethernet
    card) and an access point (also called a base station). The secret key is used
    to encrypt data packets that they transmit and an integrity check is performed
    to ensure that packets are not modified in transit. The 802.11 standard does not
    explain how the key is shared in practice. In, wireless LANs use a single key
    that is shared between all mobile stations and access points. Such an approach,
    however, does not scale up well to an environment like a college campus where
    the keys are shared with all users — and you know how it is if you share a “secret”
    with people. This is why WEP is typically used on large wireless networks such
    as those at universities. In such wireless networks, you have to use other security
    approaches such as SSH (Secure Shell) to log in to remote systems. WEP, however,
    is good to use on your home wireless network.


    WEP has its weaknesses, but it''s better than nothing. You can use it in smaller
    wireless LANs where sharing the key among all wireless stations is not an onerous
    task.


    Work is underway to provide better security than WEP for wireless networks. A
    standard called 802.11 is in progress, which provides better security through
    public-key encryption. The 802.11 standard is in progress, the Wi-Fi Alliance
    — a multivendor consortium that supports Wi-Fi — has developed an interim specification
    called WiFi Protected Access (WPA) that is a precursor to 802.11. WPA replaces
    the existing WEP standard and improves security by making changes. For example,
    while WEP uses fixed keys, it uses something called the Temporal Key-Integrity
    Protocol (TKIP), which generates new keys for every 10K of data transmitted over
    the network. TKIP makes WPA more difficult to break. You may want to consider
    wireless products that support WPA while waiting for products that implement 802.11.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_151_0.png)


