  md: '# Chapter 23: Ten Most Commonly Used SUSE Commands


    # pico: Editing Text Files


    The pico command runs a text editor that comes with SUSE Linux. It''s easier to
    learn than the vi and ed text editors and handy when you need to edit text configuration
    files.


    If you plan to edit any system configuration file (such as /etc/fstab), start
    by making up a backup copy of the file. For example, to save a copy of the /etc/fstab
    file, become root by typing su - then type cp /etc/fstab /etc/fstab.saved. After
    editing the /etc/fstab file, if you have any problems, you can revert to the saved
    version by typing cp /etc/fstab.saved /etc/fstab.


    To edit a file with pico (or create a new file), just type pico filename in a
    terminal window. Figure 23-1 shows the typical text-display of the pico editor.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_360_0.png)


    Figure 23-1: Edit text in the pico editor.


    To add text, simply typing. Move the cursor using the arrow keys.


    To add text, simply typing. Move the cursor using the arrow keys. The last two
    lines (see the bottom of the window in Figure 23-1) give you hints about other
    pico commands. For example, to save the file, press Ctrl-O (hold down the Ctrl
    key and then press O). To exit, press Ctrl+X. I''m confident that you can practice
    with pico and learn it quickly.'
