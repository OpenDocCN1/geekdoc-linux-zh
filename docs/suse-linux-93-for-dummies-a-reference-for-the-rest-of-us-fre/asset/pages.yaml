    I bet you''ve heard about Linux, even if you may not know much about SUSE (pronounced
    soo-za) Linux. Even if you haven''t, don''t worry: I''ll explain everything about
    Linux, what the different names like SUSE and Red Hat mean, what SUSE Linux includes,
    and how to get started with SUSE Linux.


    By the way, SUSE Linux runs on computers with Intel 80x86 and Pentium processors
    (basically any PC that can run any flavor of Windows). If you have a PC, you can
    install SUSE Linux on it and experience firsthand what the fuss is all about.


    # # Getting a Handle on Linux


    You know that your PC is a bunch of hardware — things you can touch, like the
    system box, monitor, keyboard, and mouse, as shown in Figure 1-1. The system box
    contains the most important hardware of all — the central processing unit (CPU),
    the microchip that runs the software (any program that tells the computer how
    to do your bidding), which you can actually touch? In a typical PC, the Pentium
    4 microprocessor is the CPU. Other important hardware in the system box includes
    the memory (RAM chips) and the hard drive — and one program has to run all this
    stuff and get it to play nice: the operating system.'
