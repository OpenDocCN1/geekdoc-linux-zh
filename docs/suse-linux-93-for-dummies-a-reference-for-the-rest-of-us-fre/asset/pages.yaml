    # Editing Images with The GIMP


    The GIMP is an image-manipulation program written by Peter Mattis and Spencer
    Kimball and released under the GNU Public License (GPL). SUSE Linux comes with
    this program, although you may have to specifically select a package to install
    it. The GIMP is comparable to other image-manipulation programs such as Adobe
    Photoshop and Corel PHOTO-PAINT.


    To try out The GIMP, choose Menu>Graphics>Image Editing in KDE or Main Menu>Graphics>Image
    Editing: The GIMP in GNOME.


    When you start for the first time. The GIMP displays a window with copyright and
    license information. Click the Continue button to proceed with the installation.
    The next screen shows the directories to be created when you proceed with a personal
    installation of The GIMP.


    The GIMP installation involves creating a directory in your home directory and
    placing a number of files in that directory. This directory essentially holds
    information about any changes to user preferences you may make to The GIMP. Go
    ahead and click the Continue button at the bottom of the window. The GIMP creates
    the necessary directories, copies the necessary files to those directories, and
    guides you through a series of dialog boxes to complete the installation.


    After the installation is done, click the Continue button. From now on, you don''t
    see the installation window anymore; you have to deal with installation when only
    you run The GIMP for the first time.


    The GIMP then loads plugins—external modules that enhance its function-ality.
    It displays a startup window that shows a message about each plugin as it loads.
    After finishing the startup, the GIMP displays a tip of the day in a window. You
    can browse the tips and click the Close button to close the Tip window. At the
    same time, the GIMP displays a number of windows, as shown in Figure 15-13.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_258_0.png)'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# 238 Part III: Doing Stuff with SUSE


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_259_0.png)


    Figure 15-13: Touch up your photos with The GIMP.


    These windows include a main toolbox titled The GIMP, a Tool Options window, a
    Brush Selection window, and a Layers, Channels window. Of these, the main toolbox
    window is the most important — in fact, you can close the other windows and work
    by using the menus and buttons in the toolbox.


    The toolbox has three menus on the menu bar:


    +   * The File menu has options to create a new image, save and print an image,
    mail an image, and quit The GIMP.

    * The Xns menu gives you access to numerous extensions to The GIMP. The exact
    content of the Xns menu depends on which extensions are installed on your system.

    * The Help menu is where you can get help and view tips. For example, choose Help>Help
    to bring up the GIMP Help Browser with online information about The GIMP.


    To open an image file in The GIMP, choose File>Open. The Open Image dialog comes
