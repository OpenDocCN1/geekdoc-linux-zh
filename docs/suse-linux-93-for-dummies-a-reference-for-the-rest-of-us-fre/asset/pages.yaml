  md: '# 190 Part III: Doing Stuff with SUSE


    You may be familiar with paragraph and character styles in Microsoft Word, but
    Writer relies more on styles than Microsoft Word. Writer supports five types of
    styles:


    +   - Paragraph style: Controls the look of a paragraph, such as the font, paragraph
    spacing, borders, bullets, numbering, and the style of the following paragraph.


    +   - Character style: Controls the font style of selected text in a paragraph.


    +   - Frame style: Controls the size and position of the frame and the text-wrapping
    options.


    +   - Page style: Controls the page layout, including the number of columns, headers,
    and footers.


    +   - Numbering style: Controls the number or bullet character and spacing that
    are used for numbered or bulleted lists.


    You can conveniently access and use all the document''s styles in a floating window
    called the Stylist (Figure 12-4). Writer displays the Stylist by default, but
    you can show and hide it by pressing F11 (or choosing Format::Stylist).


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_211_0.png)


    The Stylist makes it very easy to organize and use the styles. The five icons
    along the top part of the Stylist refer to the five types of styles — paragraph,
    character, frame, page, and numbering — from left to the right. You can click
    an icon to see all styles of that type. To apply a style, position the cursor
    where you want to apply the style and double-click the style from the Stylist.
    For character styles, select the text and then double-click the character style.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Chapter 12: Preparing Documents and Spreadsheets in SUSE Linux


    Writer also supports templates, just as Microsoft Word. A template is a special
    document with a collection of styles for the kinds of layouts that the document
    needs. You can think of a template as a model for a specific type of document.
    For example, you may have templates for documents such as memos, letters, fac
    sheets, envelopes, and many more.


    Writer does not come with any templates, but you can create or download templates
    from Web sites. A template for writing manuscripts using the Modern Language Association
    (MLA) style (see owl.english.purdue.edu/handlers/research/or/mla.html) for more
    information on the MLA style), is available from www.cc.mie-u.ac.jp/~iq20106/eg5000/templates/dl/Template.stw.
    You have to install the template file—Template.stw—before you create documents
    using that template. Note that the .stw extension is used for OpenOffice.org template
    files.


    To install a template file in Writer, follow these steps:


    +   1. Choose File: Template: Organize.

    The Template Management dialog box (shown in Figure 12-5) appears with the My
    folder of templates on the left side and the current-list of documents on the
    right.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_212_0.png)


    Figure 12-5: Import the template file into the My Templates folder.


    +   2. Right-click the Default folder icon and select Import Template from the
    pop-up menu, as shown in Figure 12-5.

    The Open dialog box appears.

    3. Navigate to the directory where you saved the template file, select the template
    file, and click Open.

    The Open dialog box closes; the template now appears in the My Templates folder
    in the Template Management dialog box.

    4. Click Close to close the Template Management dialog box.'
