  md: '# 332 Part V: The Part of Tens


    # apropos: Finding Commands Based on a Keyword


    Sometimes you might be at a loss to find a command that does something specific
    like how to print from the command line. That''s when you can turn to the lifesaver
    command — apropos. The apropos command looks up the keyword in a database of all
    online manual pages (called man pages) and displays all Linux commands whose description
    contains the keyword.


    The syntax of the apropos command is the following:


    ```

    apropos keyword

    ```


    This command displays all Linux commands whose man pages include keyword. By the
    way, I don''t show the more command as a top ten command, but you often need to
    use more to view one page at a time. In this case, if the output of apropos is
    too long, simply type a vertical bar followed by more (1 more) after the apropos
    command. For example, type apropos print 1 and more see what you get. Press the
    spacebar to continue.


    As much as apropos can be useful, when you try apropos with a simple keyword such
    as find, you may end up with a long list of man pages because the word find appears
    in many man pages. Your best bet is to try apropos with unique keyword as possible.
    For example, to look up commands that relate to MP3 files, by trying apropos MP3.
    Here''s what I get when I type apropos MP3 on my SUSE Linux system:


    ```

    plaympg (1)      - MPEG audio (MP3) and video (MPEG-1) player

    normalize mpg (3)  - adjust levels of mp3 or ogg files by running normal-ize(1),
    then re encoding

    ```


    What you get on your system might be different, but as you can see, apropos displays
    the commands related to a keyword.


    # man: Reading Online Man Page


    The man command is for viewing online manual pages (also called man pages). The
    simplest form of the man command looks like this:


    ```

    man commandname

    ```'
