    Figure 7-1:

    DSL provides high-speed connection to the Internet over a regular phone line.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_130_0.png)


    Telephone Network Interface Device (NID) where wires come into your home


    DSL modem


    Your PC


    Your PC talks to the DSL modem through an Ethernet connection, which means that
    you need an Ethernet card in your Linux system.


    Your PC sends digital data over the Ethernet connection to the DSL modem. The
    DSL modem sends the digital data at different frequencies than those used by the
    analog voice signals. The voice signals occupy a small portion of all the frequencies
    the phone line can carry. DSL uses the higher frequencies to transfer digital
    data, both voice and data can travel on the same phone line.


    The distance between your home and the central office — the loop length — is a
    factor in DSL''s performance. Unfortunately, the phone line can reliably carry
    the DSL signals over only a limited distance — typically 3 miles or less, which
    means that you can get DSL service only if your home (or office) is located within
    3 miles of your home phone company''s central office. Your phone company can tell
    you whether your location can get DSL or not. Often, it has a Web site where you
    can check your phone number and get a response about DSL availability. For example,
    try www.dslavailability.com for your U.locations.'
