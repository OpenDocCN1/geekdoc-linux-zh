  md: '# # Chapter 21


    # # The Ten Best Things about SUSE


    **In This Chapter**


    +   - YaST

    - Great hardware detection

    - Easy installation

    - YaST Online Update (YOU)

    - Automatic mounting of Windows partition and USB memory stick

    - Auto-login at KDE desktop

    - Support for laptops (power management)

    - Easy access to Windows shares

    - Cute gecko mascot

    - SUSE''s increasing popularity


    > I am often asked by friends and acquaintances what''s so great about SUSE Linux
    and why should they consider using it (or perhaps switch to it from another Linux
    distribution). I have gotten into the habit of listing what might call the selling
    points of SUSE Linux. When I began writing this book, I decided to list some of
    these points in a chapter in the obligatory Parts of Ten that adorn every For
    Dummies book. This is that chapter — with a list of what I think are the ten best
    things about SUSE.


    # # YaST — The Super Sysadmin Tool


    One of the best things about SUSE Linux is YaST — Yet Another Setup Tool — the
    system setup and configuration tool that makes SUSE easy to install and maintain.
    If you have installed SUSE Linux, you have already used YaST. For any sysadmin
    task from configuring hardware to installing new software. YaST is the tool you
    use.'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# 322 Part V: The Part of Tens


    You typically encounter YaST in the form of the YaST Control Center — a GUI tool
    from which you can launch various YaST modules that are meant for specific tasks
    such as installing software, configuring hardware, managing a network, or setting
    up security. In Chapter 17, I introduce the YaST Control Center and the various
    sysadmin tasks you can perform through the center.


    If you are at a text console, you can still use YaST — through its command line.
    For example, to install an RPM from a command-line, type /sbin/yast -i followed
    by the name of an RPM package.


    YaST used to be proprietary software, but in 2004, Novel released YaST under the
    GNU General Public License (GPL) — the same open source license that governs Linux
    itself.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_343_0.png)


    # Detects All Hardware (Well, Nearly All!)


    One of the best things about SUSE Linux is that it detects nearly all hardware
    during installation and setup. For all detected hardware, SUSE Linux loads all
    drivers needed to access the hardware and takes care of any configuration steps
    such as adding entries in the /etc/fstab configuration file and creating subdirectories
    in the /media directory where a storage device could be mounted. The excellent
    hardware detection means that you can usually install SUSE Linux on most PCs without
    any trouble.


    If you add hardware after you install SUSE Linux, you can connect the hardware
    to the PC, power it on, and then run the appropriate hardware configuration module
    from the YaST Control Center (see Chapter 17 for more on the YaST Control Center).


    # Smooth and Easy Installation


    SUSE Linux installation is neither oversimplified nor unnecessarily complex —
    with its hardware detection capabilities and the YaST GUI tool, it''s just right.
