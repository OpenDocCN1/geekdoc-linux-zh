    # Setting up Writer


    You don''t really have to do any special setups to start using Writer. Even tasks
    such as printing should work right away provided you have set up a printer using
    the procedure described in Chapter 3. You may want to tinker with some settings,
    however, so that Writer works to your liking. For example, you might want to turn
    off AutoCorrect so that doesn''t suggest word completion, or you might want to
    hide some toolbars to get more workspace. You can set up most of these options
    from the View and Tools menus, in particular, many are located on the Menu bar
    (refer to Figure 12-1). In particular, you perform many of the setup tasks from
    the dialog box (Figure 12-2) that appears when you choose Tools: Options.


    # Preparing documents in Writer


    You''ll have no problem preparing documents using Writer. Typically, you can simply
    click to position a cursor and type your text. To format text, select a style
    for the paragraph or select text and then apply formatting as boldface or italics.
    In the following sections, I provide some quick tips on'
