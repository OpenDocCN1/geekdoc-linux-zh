  md: '# 118 Part II: Test Driving SUSE


    When you use a cable to directly connect your SUSE Linux PC to the Internet, the
    connection is always on, you run a greater risk that someone may try to break
    into the PC than do dialup. SUSE Linux includes a fire-wall, which you may want
    to use to protect your PC from unwanted Internet connections. See Chapter 19 for
    more information on how to handle the firewall.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_139_0.png)


    To isolate your SUSE Linux PC or local area network from the public Internet,
    you may want to add a NAT (Network Address Translation) router between your PC
    and the cable modem. One of the NAT router''s interfaces connects to the Internet
    and the other connects to your LAN—then acts as a gateway between your LAN and
    the Internet. As an added bonus, you can share a cable modem connection with all
    the PCs in your local area network (LAN) by adding an Ethernet hub. Better yet,
    a combination NAT-router-and-hub so sold under name do the whole box. By the way,
    the NAT router/hubs typically work with DSL and a cable modem.


    The NAT router translates Internet Protocol (IP) addresses into a public IP address.
    When connected through a NAT router, any PC in the LAN can access the Internet
    as if it had its own unique IP address. Result: You can share a single Internet
    connection among many PCs. (An ideal solution for an entire family of Net surfers!)


    Figure 7-6 shows a typical setup with a cable modem being shared by a number of
    PCs in a LAN.


    Here are the points to note when setting up a connection like the one in 7-6:


    +   - You need a Cable/DSL NAT router with two BaseT Ethernet ports (the 10BaseT
    port—also known as an RJ-45 jack—looks like a large phone jack). Typically, one
    Ethernet port is labeled (External or WAN for wide area network) and the other
    is labeled Local.

    - If you plan to set up a LAN, you also need an Ethernet hub. For a small home
    network, you can buy a 4 or 8-port Ethernet hub. Basically, you want a hub with
    as many ports as the number of PCs you intend to connect to your local area network.

    - Consider buying a single box that acts as both a NAT router and a hub with a
    number of Ethernet ports.

    - Connect the Ethernet port of the cable modem to the Internet port of the NAT
    router using a 10BaseT Ethernet cable. (These look like wires, except that the
    Ethernet cables have bigger RJ-45 jacks and are often labeled Category 5 or Cat
    5 wire).'
