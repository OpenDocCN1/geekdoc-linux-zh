    # Becoming root, When You Must


    You have to log in as `root` to perform the system administration tasks. The

    `root` user is the superuser and the only account with all the privileges

    needed to do anything in the system.


    Common wisdom says you should not normally log in as `root`. When you''re

    root, all it takes is you can easily delete all the files /

    specially when you''re typing commands. Take, for example, the command

    rm `*.` that you may type to delete all files that have the `.html` extension.

    What if you accidentally press the spacebar after the asterisk (`*`)? Thenshell
    takes the command to be `rm *.html` — because `*` matches any

    filename — deletes everything in the current directory. Seems implausible

    until it happens to you!


    If you logged in as a normal user, how do you do any system administration-chores?
    Well, you become `root` for the time being. If you''re working at a

