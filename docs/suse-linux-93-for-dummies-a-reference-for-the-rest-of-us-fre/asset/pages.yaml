  md: '# 10 Part I: Getting to Know SUSE


    Memory

    Transient storage where programs are loaded and executed by the CPU


    Central Processing Unit (CPU)

    The computer''s brain—the microprocessor—that executes the instructions contained
    in the program loaded into memory


    Figure 1-1: A simplified view of a computer and how it runs


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_31_0.png)


    Disk

    Permanent storage where programs are loaded and are stored in files


    The operating system is software that manages all the hardware and runs other
    software at your command. You, the user, communicate those commands by clicking
    menus and icons or by typing some cryptic text. Linux is an operating system —
    as UNIX, Windows 98, Windows 2000, and Windows XP.

    The Linux operating system — also called the Linux kernel — is modeled after UNIX.


    The operating system is what gives a computer — any computer — its personality.
    And on that same PC, you can run Windows 98 or Windows XP on a PC — and can also
    install and run Linux. That means, depending on which operating system is installed
    and running at any time, the PC can be a Windows 98, Windows XP, or Linux system.


    The primary job of an operating system is to load software (computer programs)
    from the hard drive (or other permanent storage) into the memory and get the CPU
    to run those programs. Everything you do with your computer is possible — so if
    the operating system somehow messes up, the system freezes. You know how infuriating
    it is when your favorite operating system — maybe even one that came with your
    PC — suddenly calls it just as you were about to click the Send button after composing
    your three-finger salute (pressing Ctrl-Alt-Del), but nothing happens. It''s time
    to try the Reset button (provided your computer''s builders were wise enough to
    include it). Likewise, that of thing never happens with Linux — it has a reputation
    for being a very reliable operating system.


    In technical mum jumbo, Linux is a multiuser, multitasking operating system. This
    means that Linux enables multiple users to log in, and Linux can run more than
    one program at the same time. Nearly all operating systems are


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_31_1.png)'
