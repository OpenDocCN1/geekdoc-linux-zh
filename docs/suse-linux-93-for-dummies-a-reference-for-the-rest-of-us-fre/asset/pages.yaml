  md: '# Introduction


    # # What You Don''t Have to Read


    Each chapter zeros in a specific task area — such as using the Internet or preparing
    documents with OpenOffice.org — and provides hands-on instructions on how to perform
    a series of related tasks. You can jump right to a section and read about a specific
    task. You don''t have to read anything but the few paragraphs or the list of steps
    that relate to your question. Use the Table of Contents or the Index to locate
    the parts relevant to your question.


    You can safely ignore next text to the Technical Stuff icons as well the sidebars.
    However, if you are the kind who likes to know of the hidden details of how Linux
    works, by all means, dig into the Technical Stuff and the sidebars.


    # # Who Are You?


    I assume that you are somewhat familiar with a PC — you know how to turn it on
    and off if you have dabbled a bit with Windows. Considering that many new PCs
    come preloaded with Windows, this assumption is safe, right? And I assume that
    you know how to use some of the Windows applications such as Microsoft Office.
    Most of all, you want to experiment with or switch to SUSE Linux as your desktop
    choice.


    When installing SUSE Linux on your PC, you may want to retain your Windows 2000
    or Windows XP installations. I assume that you are willing to accept the risk
    that you try to install SUSE Linux, some things may not work quite. Problems can
    happen if you have some uncommon types of hardware. If you are afraid of ruining
    your system, try finding a slightly older Pentium PC that you can sacrifice and
    then install Linux on that PC.


    # # How This Book Is Organized


    SUSE Linux 9.3 For Dummies contains 23 chapters organized into five parts. The
    book''s organization is that of a typical For Dummies title that covers an operating
    system such as SUSE Linux where the reader is expected to install the software
    and learn to use it. The five parts cover installation and setup, test the system
    to learn the ropes, the system to do productive work, learning to be a budding
    system administrator, and the mandatory "Part of Tens". Here''s a quick overview
    of the five parts and the appendix:


    +   - Part I: Getting to Know SUSE introduces the reader to SUSE Linux, provides
    step-by-step installation instructions, and explains what happens when you start
    the system for the first time.


