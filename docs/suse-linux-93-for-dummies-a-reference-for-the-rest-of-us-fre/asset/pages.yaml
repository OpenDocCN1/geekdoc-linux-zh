  md: '# 298 Part IV: Becoming a SUSE Wizard


    Suppose you have a file named mystuff that you want to protect. You can make it
    accessible to no one but if you type the following commands, in this order:


    ```

    chmod a-rwx mystuff

    chmod +rw mystuff

    ```


    The first command turns off all permissions for everyone, the second command turns
    on the read and write permissions for the owner (you). Type ls -l to verify that
    the change took place. (You see a permission setting of -rw------)


    Another way to specify a permission setting is to use a three-digit sequence of
    numbers. In a detailed listing, the read, write, and execute permission settings
    for the user, group, and others appear as the sequence


    ```

    rwx rwx rwx

    ```


    with dashes in place of letters for disallowed operations. Think of r=4, w=2 and
    x=1 as three occurrences of the string (use zero for a missing letter—one that
    appears as a dash). To get the value of the sequence rwx, simply add the values
    of r, w and x. Thus, rwx = 7 (4+2+1). Using this formula, you can assign a three-digit
    value to any permission setting. For example, if the user can read and write the
    file but one else can only read the file, the permission setting is rw-r-- how
    it appears in the listing), and the value is 644 because rw=4+2, which is 6 and
    r--- is just 4 (for r alone). Thus, if you want all files in a directory to be
    readable by everyone but writable only by the user, use the following command:


    ```

    chmod 644

    ```


    # Setting default permission


    What permission setting does a file get when you (or a program) create a new file?
    The answer is what is known as the user file-creation mask that you can see and
    set using the umask command.


    Type umask, and it prints out a number showing the current file-creation mask.
    The default setting is different for the root user and other normal users. For
    the root user, the mask is set to 022, whereas the mask for normal users is 002.
    To see the effect of this file-creation mask and to interpret the meaning of each,
    follow these steps:


    +   1. Log in as root and type the following command:


    ```

    touch junkfile

    ```


    This command creates a file named junkfile with nothing in it.'
  merge: -1
  pgno: 319
- img_proc: true
  md: '# Chapter 19: Securing SUSE Linux 299


    2. Type ls -l junkfile to see that file''s permissions.

    You see a line similar to the following:


    ```

    -rw-r--r-- 1 naba 0 2005-01-30 16:23 junkfile

    ```


    Interpret the numerical value of the permission setting by converting each three-letter
    permission in the first field (excluding the very first letter) to a number between
    0 and 7. For each letter that''s present, the first letter gets value of 4, second
    letter is 2, and the third is 1. For example, rw- translates to 4+2+0 (because
    the third letter is missing) or 6. Similarly, r-- is 4+0+0=4. Thus the permission
    string -rw-r--r-- becomes 644.


    3. Subtract the numerical permission from 666 and what you get is the umask setting.


    In this case, 666-644 results in an umask of 022.


    Thus, an umask of 022 results in a default permission setting of 666-022=644.
    When you rewrite 644 in terms of a permission string, it becomes rw-r--r--.


    To set a new umask, type umask followed by the numerical value of the mask. Here
    is how you go about it:


    +   1. Figure out what permission settings you want for new files.


    For example, if you want new files that can be read and written only by the owner
    and by nobody else, the permission setting looks like this:

    ------


    +   2. Convert the permissions into a numerical value using the conversion method
    that assigns 4 to the first field, 2 to the second, and 1 to the third.


    Thus, for files that are readable and writable only by their owner, the permission
    setting is 600.


    +   3. Subtract the desired permission setting from 666 to get the value of the
    mask.


    For a permission setting of 600, the mask becomes 666-600=066.


    +   4. Use the umask command to set the file-creation mask:


    ```

    umask 066

    ```


    A default umask of 022 is good for system security because it translates to files
    that have read and write permission for the owner and read permissions for everyone
    else. The bottom line is that you don''t want a default umask that results in
    files that are writable by the whole world.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_320_0.png)'
