    # Connecting to the Internet with DSL


    DSL (Digital Subscriber Line) uses your existing phone line to send digital data
    in addition to the analog voice signals (analog continuously varying, whereas
    digital data is represented by 1s and 0s). The phone line goes from your home
    to a central office where the line connects to the phone company''s network—by
    the way, the connection from your home to the central office is called the local
    loop. When you sign up for DSL service, the phone company hooks up your line to
    some special equipment at the central office. That equipment can separate the
    digital data from voice. From then on, your phone line can carry digital data
    that is then directly sent to an Internet connection at the central office.


    # How DSL works


    A special box called DSL modem takes care of sending digital data from your PC
    to the phone company''s central office over your phone line. Your PC can connect
    to the Internet with the same phone line that you use for your normal telephone
    calls—you can make voice calls even when the line is used for DSL. Figure 7-1
    shows a typical DSL connection to the Internet.'
