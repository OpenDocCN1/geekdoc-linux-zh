  md: '# Introduction


    SUSE Linux is an increasingly popular Linux distribution that competes head-on
    with Red Hat''s Linux versions. SUSE Linux''s fortunes have been on the rise following
    Novell''s acquisition of Germany''s SUSE Linux AG for $210 million. SUSE is looking
    for more growth in the U.S. marketplace, helped in part by IBM''s $560 million
    investment in Novell as part of the SUSE acquisition deal. On another positive
    note, Novell announced that SUSE''s YaST configuration will become open source,
    licensed under the GNU General Public License. These developments have generated
    a distinct ''buzz'' around SUSE Linux as the up-and-coming Linux distribution
    for home users to enterprise


    A significant factor in SUSE''s increasing popularity is that unlike its competitor
    Red Hat has singular focus on the enterprise market, Novell continues to address
    both the enterprise market and Linux enthusiasts. Specifically, the SUSE Linux
    Professional product is aimed at small-office/home-office users as well as those
    wishing to experiment with the SUSE Linux as their desktop system. SUSE Linux
    Professional is sold as boxed sets through distributors as well as online stores.
    SUSE Linux Professional with a typical retail price tag of $89.95 (with lower
    prices for students and for those updating from a previous version) is a complete
    Linux distribution, suitable for small office/home office or even an enterprise.
    This book includes a DVD with a Special Edition version of SUSE Linux Professional,
