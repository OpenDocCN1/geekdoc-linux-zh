    # Automatic Mounting of My Windows Partitions and USB Memory Stick


    If you have Windows partitions, SUSE Linux automatically mounts them so you can
    easily access files in your Windows partition. For example, in a dual boot XP/SUSE
    Linux system, you probably find the Windows partition mounted at /windows directory
    in the Linux file system. If for reason Linux does not mount the Windows XP partition
    automatically, you can become root by typing su — and then mount it by typing
    /dev/hda2 /windows because the Windows XP partition is usually the second partition
    on the hard drive (of course, this applies only if your PC has Windows installed).


    When you plug in a USB memory stick into a USB port, SUSE Linux detects it and
    mounts it in a directory in the /media directory. After plugging in, you can access
    a USB memory stick by clicking the My Computer icon on the desktop and then clicking
    the hard drive icon labeled /dev/sda1 — that''s the device name assigned to the
