    # # Using Linux Commands to Manipulate Files and Directories


    Although GUI file managers such as Konquer (in KDE) and Nautilus (in GNOME) are
    easy to use, you can use them only if you have a GUI desktop. Sometimes, you may
    not have a graphical environment to run a graphical file manager. For example,
    you may be logged in through a terminal, or the X Window System may not be working
    on your system. In these situations, you may have to rely on Linux commands to
    work with files and directories. Of course, you can always use Linux commands,
    even in the graphical environment — all you have to do is open a terminal window
    and type the Linux commands.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_114_0.png)


    To open a terminal window in KDE, click the terminal icon on the panel. In GNOME,
    choose Programs:System:Terminal.


    In the sections that follow, I briefly show some Linux commands for working with
    the files and directories.'
