  md: '# 12 Part I: Getting to Know SUSE


    # Discovering SUSE Linux


    SUSE Linux is a commercial distribution that focuses on the desktop and includes
    some proprietary components that prevent its redistribution. You can buy SUSE
    online or in computer stores and bookstores. If you have heard about open source
    and the GNU (GNU''s not UNIX) license, you may think that no one can sell it for
    a profit. Luckily for companies that sell Linux distributions, the GNU (General
    Public License - GPL) — allows commercial de-profit distribution, but requires
    that the software be distributed in source-code-form, and stipulates that anyone
    may copy and distribute the software in source-code form to anyone else. Several
    Linux distributions are available free of charge under the GPL. For this book,
    SUSE has graciously provided us with a Special Edition of SUSE Linux that''s included
    in this book.


    I tell you a lot more about SUSE in this book, but you can also visit www.suse.com
    for more information (especially the latest news) about SUSE Linux.


    # Making sense of Linux version numbers


    Both the Linux kernel and a Linux distribution as SUSE Linux have their own version
    numbers, not to mention the many other software programs (such as GNOME and KDE)
    that come with the Linux distribution. The version numbers for the Linux kernel
    and the Linux distribution are unrelated, but each has particular significance.


    # Linux kernel version numbers


    After Linux kernel version 1.0 was released on March 14, 1994, the loose-knit
    Linux development community adopted a version-numbering scheme. Version numbers
    as X.Y and 2.X, where X is an even number, are the stable versions. The last number,
    Y, is the patch level, which is increased as problems are fixed. For example,
    2.6.9 is a stable version of the Linux kernel. Notice that these version numbers
    are in the form of three integers separated by periods — Major.Minor.Patch — where
    Major and Minor are numbers denoting the major and minor version numbers, and
    Patch is another number representing the patch level.


    Version numbers of the form 2.X with an odd X are beta releases for developers
    only; they may be unstable, so you should not adopt such versions for day-to-day
    use. For example, when you look at version 2.6.55 of the Linux kernel, notice
    the odd number 5 — that tells you it''s a beta release. Developers add new features
    to these odd-numbered versions of Linux.


    You can find out about the latest version of the Linux kernel online at www.kernel.org.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Chapter 1: What Is SUSE Linux?


    # SUSE Linux version numbers


    Each Linux distribution has a version number as well and SUSE Linux is no exception.
    These version numbers are usually of the form X.Y, where X is the major version
    and Y the minor version. Unlike with the Linux kernel numbers, no special meaning
    is associated with odd and even versions. Each version of a SUSE Linux includes
    specific versions of the Linux kernel and other major components, such as GNOME,
    KDE, and various applications.


    SUSE usually releases new versions of SUSE Linux on a regular basis — six months
    or so. For example, SUSE Linux 9.0 was released in October 2003, 9.1 was released
    in April 2004, and 9.2 came out in October 2004. Typically, each major version
    of SUSE Linux provides significant new features.


    # What''s in SUSE Linux?


    A Linux distribution comes with the Linux kernel and a whole lot of software.
    These software packages include everything from the graphical desktops to Internet
    servers to programming tools to create new software. In this section, I briefly
    describe some major software packages that come bundled with SUSE Linux. Without
    this bundled software, SUSE Linux wouldn''t be as popular as it is today.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_34_0.png)


    When you install SUSE Linux, not all software packages are installed by default.
    This book''s companion DVD, however, includes most of the packages 1 describe
    in the following sections.


    # GNU software


    At the heart of SUSE Linux is a collection of software that came from the GNU
    Project. You get to know these GNU utilities only if you use your Linux through
    a terminal (or a graphical window that mimics one) — a basic command line interface
    that puts nothing on-screen a prompt that enables you to type in your commands.
    The GNU software is one of the basic parts of any Linux distribution.


    As a user, you may not realize the extent to which all distributions rely on GNU
    software. Nearly all the tasks you perform in a Linux system involve one or more
    software packages. For example, the GNOME graphical interface (GUI) and the command
    interpreter (that is, the bash shell) are both GNU software programs. By the way,
    the shell is the command-interpreter application that accepts the commands you
    type and then runs programs in response to those commands. If you rebuild the
    kernel or develop software, you do so with the GNU and C++ compiler (which is
    part of the GNU software-that accommodates Linux). If you edit text files with
