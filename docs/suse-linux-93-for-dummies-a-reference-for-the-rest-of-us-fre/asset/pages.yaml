  md: "# 336 Part V: The Part of Tens\n\n# chmod: Changing Permissions\n\nYou use\
    \ the chmod command to change the permission settings of one or\\more files. The\
    \ syntax is as follows:\n\n```\nchmod -cfvR perm files\n```\n\nThe command changes\
    \ the permission settings of files to what you specify\nin the perm argument.\
    \ The characters within square brackets are the options\\sand they have the following\
    \ meanings:\n\n+   * c lists files whose permissions have changed.\n* f stops\
    \ any error message displays.\n* v verbely displays permission changes.\n* R recursively\
    \ changes permissions of files in all subdirectories.\n\nTo use chmod effectively,\
    \ you have to learn how to specify the permission set-\ntings. One have to concatenate\
    \ one letter from each column of the following\nt in the order shown (Who/Action/Permission):\n\
    \n| Who | Action | Permission |\n| u user | + add | r read |\n| g group | - remove\
    \ | w write |\n| o others | = assign | x execute |\n| a all | s set user ID |\n\
    \nFor example, to give everyone read access to all files in a directory, type\n\
    chmod a*. On the other hand, to permit everyone to execute a specific\nfile, type\
    \ chmod +x filename.\n\nAnother way to specify a permission setting is to use\
    \ a three-digit sequence\nof numbers. In a detailed listing of a file that you\
    \ get when you use the com-\nls - 1, the read, write, and execute permission settings\
    \ for the user,\ngroup, and others appear as the sequence rwxrwxr (with dashes\
    \ in place\nof letters for disallowed operations). Think of rwxrwxr as three occur-\r\
    ences of the string rwx. Now, assign the values:\n\n```\nr = 4\nw = 2\nx = 1\n\
    - 0\n```"
  merge: -1
