  md: '# Chapter 14


    # Playing Music and Burning CDs


    In This Chapter


    +   - Playing audio CDs

    - Playing digital music

    - Burning CDs and DVDs


    SUSE Linux comes with several audio and video applications. You can listen to
    audio CDs, MP3 music (as well as other digital music files), and watch video video
    (provided you have the decoders installed). You can also rip audio CDs and burn
    new CDs—both audio and data CDs. In this chapter, I introduce some of the audio
    applications that you can find in either KDE or GNOME desktops.


    The video applications lack the decoders necessary to play video such as MPEG
    or DVD. In particular, commercial DVDs use an encryption method called Content
    Scrambling System (CSS) to prevent the DVD data from being copied. The open source
    Linux video players do not include the software to decrypt CSS and therefore cannot
    play DVDs.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_238_0.png)


    # Playing Audio CDs


    SUSE Linux comes with both the GNOME or KDE CD player applications. To play an
    audio CD, you need a sound card, and that sound card must be configured to work
    in SUSE Linux. All of that should happen when you install SUSE Linux following
    the steps outlined in Chapter 2.


    In KDE, if you insert an audio CD into the drive, a dialog box appears (see Figure
    14-1) and asks whether you want to play the CD with the CD player. Click Yes.'
  merge: -1
  pgno: 238
- img_proc: true
