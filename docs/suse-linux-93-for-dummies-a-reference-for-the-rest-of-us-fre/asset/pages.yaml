  md: '# # SUSE Linux 9.3

    # For Dummies

    Cheat Sheet


    # ## Bash Shell


    Pipe:


    +   - command1 | command2

    - Redirections:

    - command > file (output goes to file)

    - command < file (input from file)

    - command > file (append to file)

    - command 2> file (errors go to file)

    - Commands:

    - alias (defines shortcut for a long command)

    - apropos (searches the man pages for keywords)

    - history (displays most recent commands)


    +   - locate (find files)

    - where (finds executable files for a command)

    - which (shows full pathname for a command)

    - man (displays online help)

    - printf (displays the environment variables)

    - Environment variables:

    - HOME (user''s home directory)

    - PATH (directories to search for commands)

    - TERM (name of terminal type)


    # ## File System


    +   - Key directories in the file system:

    - /root (base of file system)

    - /bin (essential commands)

    - /boot (Linux kernel and boot loader)

    - /dev (special device files)

    - /etc (system configuration files)

    - /home (directory of all users)

    - /lib (library files for programs)

    - /media (mount points for CD-ROM, floppy)

    - /opt (application software packages)

    - /root (home directory of the root user)

    - /sbin (system-administration commands)

    - /srv (files for services over Web and FTP)

    - /tmp (temporary directory)

    - /usr (shared, read-only data)

    - /var (variable file systems, such as logs)


    +   - grep (search for text in a file)

    - ln (links a filename to a link name)

    - ls (displays the contents of a directory)

    - mkdir (creates a directory)

    - more (displays a text file, one page at a time)

    - mount (mounts a file system)

    - rm (removes or moves file)

    - pwd (displays the current directory)

    - deis files

    - rdir (deletes directories)

    - sort (sorts lines in a file)

    - split (splits a file into smaller parts)

    - unmount (unmount a file system)

    - wc (counts words and lines in a file)


    File Commands:


    +   - cat (copies a file to the output)

    - cd (changes the current directory)

    - chmod (changes permissions)

    - chown (changes ownership)

    - cp (copies files)

    - copies blocks of data

    - df (reports disk usage by device)

    - diff (compares two files)

    - du (reports disk usage by directory)

    - file (displays the type of a file)

    - find (find files based on specified criteria)


    +   - File Permissions:

    - rwxrwxrwx (three groups of rwx, leftmost is for owner, group for group, others;
    others for (r), (w), (x))

    - execute (x), a--) means no permission

    - rw-xr-x-- only owner can read, write

    - rw---------only owner can read and write

    - r--r----read-only file (everyone can read)


