  md: '# 74 Part II: Test Driving SUSE


    # Exploring KDE


    KDE (pronounced Kay-dee-ee) is the default GUI for SUSE Linux. KDE stands for
    the Desktop Environment. From your perspective as a user, KDE provides a graphical
    desktop environment that includes the Konqueror Web browser and file manager,
    a panel with menus for starting applications, a system configuration tools, and
    many applications, including the OpenOffice.org suite, image viewer, PostScript
    viewer, and mail and news readers.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_95_0.png)


    If you want to keep up with KDE news, you can always find out the latest information
    about KDE by visiting the KDE home page at www.kde.org.


    If you installed the KDE desktop, you see an initial KDE desktop similar to the
    one shown in Figure 5-1. The initial KDE session includes a window showing a helpful
    tip.


    You will find that KDE is very easy to use and is similar in many ways to the
    Microsoft Windows GUI. You can start applications from the Start menu in Windows.
    As in Windows, you can place folders and applications directly on the KDE desktop.


    You can move and resize the windows just as you do in Microsoft Windows. Also,
    as in the window frames in Microsoft Windows, the right-hand corner of the window''s
    title bar includes three buttons. The leftmost button reduces the window to an
    icon, the middle button maximizes the window to fill up the entire screen, and
    the rightmost button closes the window.


    # KDE panel


    The KDE panel (refer to Figure 5-7) appearing along the bottom edge of the screen
    is meant for starting applications. The most important component of the panel
    is the Main Menu button— the one with the cute gecko logo on the left side of
    the panel. That button is like the Start button in Windows. When you click the
    Main Menu button, a menu appears. From this menu, you can get to other menus by
    moving the mouse pointer over them that display a right-pointing arrow.


    You can start applications from the Main Menu. That''s why the KDE documentation
    calls the Main Menu button the Application Starter (the KDE refers to the button
    itself as the K button).


    Next to the Main Menu button, the panel includes several other buttons. If you
    don''t know what a button does, simply move the mouse pointer over the button;
    a small pop-up window displays a brief message about that.'
