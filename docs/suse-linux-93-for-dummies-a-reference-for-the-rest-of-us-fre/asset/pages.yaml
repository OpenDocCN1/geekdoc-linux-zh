- img_proc: true
  md: '# 188 Part III: Doing Stuff with SUSE


    how to perform specific document-preparation tasks in Writer. I organize the tips
    into the following categories of tasks:


    +   - Editing and reviewing documents

    - Using styles and templates

    - Performing page layout

    - Creating and inserting graphics

    - Using fields

    - Working with large documents


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_209_0.png)


    Figure 12-2: Set up many aspects of Writer from the Options dialog box.


    # Editing and reviewing documents


    To edit a document, you have to open the file, move around within the document,
    insert and delete text, and save the file. You can perform most of these tasks
    inclusively because these steps are essential in most word processors. For that
    reason, I don not discuss in detail how to perform each of these tasks. Instead,
    in the following paragraphs, I highlight a couple of features that you will find
    particularly useful in your work.


    Typically, you review changes when you collaborate with others on a document and
    several of you make revisions to the document. To review changes, the changes
    have to be tracked. Writer has features to enable change tracking (or redlining,
    as it is commonly called). With Writer, you can examine the changes, accept or
    reject each change, and make more editing changes—even adding comments to explain
    why you made a change.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# Chapter 12: Preparing Documents and Spreadsheets in SUSE Linux 189


    Writer has other features for easily editing a document. For example, you can
    search and replace text — even find all occurrences of text with a specific for-mat
    style and change each occurrence.


    Most of Writer''s editing and change-tracking functions are in the Edit menu (shown
    in Figure 12-3). Some toolbar icons provide shortcuts to the menu.


    You can perform many editing tasks by clicking the toolbar icons. Just mouse over
    each icon and read the tooltips to see which ones enable you to make specific
    editing and reviewing changes.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_210_0.png)


    # Using styles and templates


    In Writer, you can format pages, paragraphs, and blocks of text manually. For
    example, you can place a cursor on a paragraph, choose Format; Paragraph, and
    then format various characteristics of the paragraph (such as indentation, spacing,
    and borders). This paragraph-by-paragraph formatting is okay for a short document,
    but it can be tedious and time-consuming if you have to format hundreds of paragraphs
    one by one. A better approach is to define a style — a collection of formatting
    characteristics stored under a particular, usually descriptive, name. Then you
    can simply apply that style to all paragraphs. If you need to change any aspect
    of the paragraphs, simply edit the style and voilà — all paragraphs with that
    style get the new formatting.


    Figure 12-3: Perform editing and reviewing tasks from the menu and its submenus.


    | Paste | Control+V |

    | Paste Special | Control+Shift+V |

    | Select All | Control+A |

    | Change | Record |

    | Compare Document | Protect Records |

    | End & Replace | Control+F Show |

    | AutoText | F3 |

    | Exchange Database | Control+F3 Accept or Reject |

    | Plug-in |

    | Object |'
