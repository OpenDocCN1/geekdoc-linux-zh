  md: '# Stirring the DSL alphabet

    soup: ADSL, IDSL, SDSL


    I have been using the term DSL as if there was only one kind of DSL. As you may
    imagine, nothing is ever that simple. DSL has in fact three variants, with different
    features. Take a look:


    +   - ADSL: Asymmetric DSL, the most common form of DSL, has much higher download
    speeds (from the Internet to your PC) than upload speeds (from your PC to the
    Internet). ADSL can have download speeds of up to 8 Mbps and upload speeds of
    up to 1 Mbps. ADSL works best when your location is within about 2 miles (12,000
    feet) of your central office. ADSL service is priced according to the download
    and upload speeds you want. A popular form of DSL, G.lite, is specifically designed
    to work on the same line you use for voice. G.lite has a maximum download speed
    of 1.5 Mbps and a maximum upload speed of 512 Kbps.

    - IDSL: ISDN DSL is an older technology called Integrated Services Digital Network
    which is a special type of DSL that works at distances up to 5 miles between your
    phone and the central office. The downside is that IDSL only offers downstream
    (from the Internet to your PC) and upstream (from your PC to the Internet) speeds
    of up to 144 Kbps.

    - SDSL: Symmetric DSL provides equal download and upload speeds of up to 1.5 Mbps.
    SDSL is priced according to the speed you want, with the higher speeds costing
    more. The closer your location is to the phone company''s central office, the
    faster the connection you get.


    DSL speeds are typically specified by two numbers separated by a slash, like:
    1500/384. The numbers refer to data-transfer speeds in kilobits per second (that
    is, thousands-of-bits per second, abbreviated as Kbps). The first number is the
    download speed; the second is the upload. Thus 1500/384 means you can expect to
    download from the Internet at a maximum rate of 1500 Kbps (or 1.5 Mbps) and upload
    to the Internet at 384 Kbps. If your phone line''s condition is not perfect, you
    may not get these maximum rates—both ADSL and SDSL adjust the speeds to suit existing
    line conditions.


    The price of DSL service depends on which variant — ADSL, IDSL, or SDSL — you
    select. For most home, the primary choice is ADSL (or, more accurately, the G.lite
    form of ADSL) with transfer speed ratings of 1500/128.


    # Typical DSL setup


    For DSL for your home or business, you will have to contact a DSL provider. In
    addition to your phone company, you can find many other DSL providers.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_131_0.png)'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# Chapter 7: I Want My Internet, Now! 111


    matter who provides the DSL service, some work has to be done at your central
    office — the place where your phone lines connect to the rest of the phone network.
    The work involves connecting your phone line to equipment that can work with the
    DSL modem at your home or office. The central office equipment and the DSL modem
    at your location can then do whatever magic is needed to receive digital data
    over your phone line.


    Because of the need to set up your line at the central office, it takes some time
    after you place an order to get your line ready for DSL.


    The first step is to check out the DSL providers and see if you can actually get
    the service. Because DSL can only work over certain distances — less than 2 miles
    between your location and the central office — have to check if you are within
    that distance limit. Contact your phone company to verify. You may be able to
    check this availability on the Web. Try typing into Google (www.google.com) words
    DSL availability, and your local phone company''s name. The search results will
    probably include a Web site where you can type in your phone number to find out
    if DSL is available for your home or office.


    If DSL is available, you can look for the types of service — ADSL versus DSL —
    and the pricing. The price depends on the demand and upload speeds you want. Sometimes,
    phone companies offer a simple residential DSL (basically the G.lite form of ADSL)
    with a 1500/128 speed rating — meaning you can download up to 1,500 Kbps and upload
    at 128 Kbps. Of course, these are the maximums, and your mileage may vary.


    After selecting the type of DSL service and provider you want, you can place an
    order and have the provider install the necessary equipment at your home or office.
    Figure 7-2 shows a sample connection diagram for typical residential service.


    Here are some key points to note in Figure 7-2:


    +   Connect your DSL modem''s data connection to the phone jack on a wall plate.

    Connect the DSL modem''s Ethernet connection to the Ethernet card on your PC.

    When you connect other telephones or fax machines on the same phone line, install
    a microfilter between the wall plate and each of these devices.


    Because the same phone line carries both voice signals and DSL data, you need
    a microfilter to protect the DSL data from possible interference. You can buy
    one at an electronics store or from the DSL provider.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_132_0.png)'
