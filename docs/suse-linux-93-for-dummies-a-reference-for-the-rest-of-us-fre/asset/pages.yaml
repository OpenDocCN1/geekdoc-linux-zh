  md: '# Chapter 13: Doing Even More Office Stuff in SUSE Linux


    In Figure 13-5, note the major parts of the Impress window:


    +   - **Menu bar:** Provides the standard pull-down menus such as File, Edit,
    and Help for performing all the tasks that Impress can do.


    +   - **Function bar:** Provides buttons for performing tasks such as opening,
    saving, and printing a document. You can also click icons on the function bar
    to the Stylist, the Navigator, and the Gallery.


    +   - **Object bar:** Enables you to format the document by applying styles, selecting
    fonts, or changing text attributes such as bold, italic, and underline. This bar
    changes according to the type of object you''ve clicked (for example, plain text
    or graphic image).


    +   - **Drawing toolbar:** Located along the bottom of the window, it provides
    buttons that you can use for drawing tasks.


    +   - **Rulers:** Shows the vertical and horizontal page dimensions.


    +   - **Navigation bar:** Located along the bottom of the slide, it enables you
    to change the views and select a slide to work with.


    +   - **Status bar:** Displays information about the current slide such as the
    current slide number and the total count of slides. You can also click elements
    in the status bar and change settings such as the zoom factor for viewing the
    slide.


    In addition to these tool and icon bars, you can turn on two more toolbars (when
    visible, these toolbars appear at the bottom of the window, above the status bar):


    +   - **Choose View:** Bar to turn on the option that appears below the navigation
    bar. The navigation bar displays icons through which you perform some drawing
    tasks such as editing curves, grid lines, and indicating what happens when you
    click text and other objects.


    +   - **Choose Color:** Bar to turn on the color bar that appears at the bottom
    of the window, just above the status bar. The color bar displays colors that you
    can pick and use on objects. You can show or hide the color bar by clicking the
    downward-pointing arrow on the upper-left side of the color bar.


    The largest part of the Impress window is the work area where you work on the
    current slide and where you focus most of your attention.


    Use the tooltips to find out what an icon or menu option does. Mouse over a toolbar
    icon or a menu item and Impress displays a small tooltip window with a brief help
    message.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_232_0.png)'
