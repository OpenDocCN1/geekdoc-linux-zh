    # ## Mail message enhancements


    Mail messages used to be plain text (and most still are), but many messages today
    have much more than text. Two typical new features of today''s mail are:


    +   - **HTML messages**: Mail messages can be in HTML (Hypertext Markup Language),
    the language used to lay out Web pages. When you read an HTML message on a capable
    mail reader, the message appears in its full glory with nice fonts and embedded
    graphics.

    - **Attachments**: Many messages today include attached files, which can be anything
    from documents to images. The recipient can save the attachment on disk or open
    it directly from the mail reader. Unfortunately, attachments are one way hackers
    try to get viruses and worms into your PC. (If it''s any consolation, most Windows-based
    viruses and worms do not work in Linux).'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# 158 Part III: Doing Stuff SUSE


    While HTML messages are nice, they are a perfect tool for hackers phishing for
    information. As you might know, phishing is a new term for hackers trying to coax
    personal information out of people. Often hackers send professional-looking HTML
    messages that might claim to be from your bank, credit card company, and ask you
    to click what looks like an authentic link to update your personal information.
    If you click the link, you typically end up at a Web site that a sophisticated
    fake of a bank or a credit card site then prompts you for information such as
    name, date of birth, address account number, credit card number, and so on. If
    you are reading HTML mail, be careful of any messages that urge you to update
    personal information. More than likely, it''s from a hacker on a phishing trip.


    If you have an ISP account, all you need is a mail client (mail reader) to access
    your e-mail. In this case, your e-mails resides on your ISP''s server and the
    mail reader downloads when you run it. You have to do some setup before you start
    reading mail from your ISP''s mail server. The setup essentially requires you
    to enter information that you get from your ISP—the mail server''s name, server
    type (POP3, for example), your username, and your password.


    # E-Mailing in SUSE Linux


    Each GUI desktop has a default e-mail client. The KDE desktop uses KMail and the
    GNOME desktop offers Evolution. In the following sections, I briefly introduce
    you to KMail and Evolution. All mail clients are intuitive to use, so you don''t
    need more than an introduction to start using them effectively.


    # Introducing KMail


    KMail is a mail reader for KDE. To start KMail, choose Main Menu-Internet-E-Mail.
    When you first run KMail, you get your main window, but you cannot start using
    it to send and receive e-mail until you have configured the mail accounts in KMail.


    To configure KMail, follow these steps:


    +   1. Choose Settings-Configure KMail.


    The Configure KMail window appears.


    +   2. Click Network on the left pane of the window.


    The Setup for Sending and Receiving Messages screen appears (Figure 10-2).'
