  md: '# 16 Part I: Getting to Know SUSE


    # Internet servers


    Some popular network applications are specifically designed to deliver information
    from one system to another. When you send electronic mail (e-mail) or visit Web
    sites using a Web browser, you use these network applications (also called Internet
    services). Here are some common Internet services:


    +   - Electronic mail (e-mail) that you use to send messages to any other person
    on the Internet using addresses like joe@someplace.com.

    - World Wide Web (or simply, Web) that you browse using a Web browser.

    - News services, where you can read newsgroups and post news items to newsgroups
    with names such as comp.linux.networking or comp.linux.setup.

    - File-transfer utilities that you can use to connect and work with another computer
    (the remote computer) on the Internet — assuming you have the required username
    and password to access that remote computer.


    A SUSE PC can perform these Internet services. To do so, the PC must be connected
    to the Internet and it must run special server software called Internet servers.
    Each of the servers uses a specific protocol for transferring information. For
    example, here are some common Internet servers that you find in SUSE Linux:


    +   - Sendmail: Mail server for exchanging e-mail messages between systems using
    SMTP (Simple Mail Transfer Protocol).

    - Apache Web server: For sending documents from one system to another using HTTP
    (Hypertext Transfer Protocol).

    - vsftpd: FTP server for transferring files between computers on the Internet
    using FTP (File Transfer Protocol).

    - bind: News server for distribution of news articles in a store-and-forward fashion
    across the Internet using NNTP (Network News Transfer Protocol).

    - sshd: For secure logging into the system using the SSH (Secure Shell) protocol.


    # Software development


    SUSE Linux is particularly well-suited to software development. Straight out of
    the box, it is not configured for software development, but you can easily install
    all the necessary software-development tools such as the compiler and libraries
    of code to build programs. If you happen to know UNIX and the C programming language,
    you will feel right at home programing in Linux.'
