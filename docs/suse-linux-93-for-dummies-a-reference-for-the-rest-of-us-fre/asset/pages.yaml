  md: '# 180 Part III: Doing Stuff with SUSE


    news item depend on the newsreader, but posting to a newsgroup is similar to writing
    an e-message except that you are sending it to a newsgroup instead of an individual.


    In KNode, click the leftmost icon on the toolbar (refer to Figure 11-5) to post
    to a newsgroup. To post a follow-up to the item you are currently reading, click
    the leftmost toolbar icon that shows a left-pointing green arrow. If you mouse
    over each icon on the toolbar, a balloon helps you what each one does.


    In Pan, click the Post buttons on the left side of the toolbar (refer to Figure
    11-7) to post an item to a newsgroup or post a follow-up to a message you are
    reading. If you mouse over the toolbar icons, a balloon gives you hints about
    each item. That should help you locate the correct buttons. When you click one
    of the Post buttons, a new window appears where you can compose your message and
    post it.


    If you post an article and read the newsgroup immediately, you should see the
    new article, but that does not mean the article has reached other sites on the
    Internet. After all, your posting shows up on your news server immediately because
    that''s where you posted the article. Because of the store-and-forward model of
    news distribution, the news article gradually propagates from your news servers
    to others around the world.


    The misc.test newsgroup provides a way to see how your news posting is really
    getting around. If you post to that newsgroup and don''t include the word ignore
    in the subject, news servers acknowledge receipt of the article by sending an
    e-mail message to the address listed in the Reply To field of the article''s header.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_201_0.png)


    # Reading and Searching Newsgroups at Web Sites


    If you don''t have access to newsgroups through your ISP, you can still read newsgroups
    and post articles to newsgroups at a number of Web sites. Some of them archive
    old news articles and provide good search capabilities, you can search these for
    articles related to some question you may have.


    The best part about reading newsgroups through a Web site is that you don''t even
    need access to a news server and you can read news from your Web browser.'
