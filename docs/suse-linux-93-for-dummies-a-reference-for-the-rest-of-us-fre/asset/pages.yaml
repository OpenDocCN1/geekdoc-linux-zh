    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_2_1.png)


    # ## SUSE Linux Installation


    +   - Boot the PC from the DVD-ROM.

    - Go through the graphical installation steps.

    - Configure the other hardware after the initial system restart.


    # ## SUSE Linux Configuration


    +   - Start the YaST Control Center (Select Main Menu:System:YaST in KDE or System
    Menu:YaST in GNOME)

    - To configure the X Window System


    # ## GNOME and KDE Desktops


    +   - Click the Main Menu button GNOME or KDE and select the applications to run

    - Always right-click for a pop-up menu of options

    - Right-click the panel to add applets to the panel

    - To run OpenOffice applications: Main Menu:Office


    # ## Network Configuration


    +   - Network configuration: YaST Control Center:Network Devices:Network Card
    device

    - Internet connection: Choose the network (DSL, Modem, and so on) YaST Control
    Center:Network Devices


    # ## System Administration


    +   - Manage user accounts: YaST Control Center:Security and Users:Edit and Create
    Users

    - Manage packages: YaST Control Center:Software:Install and Remove Software

    - Configure systems: YaST Control Center:System:Runlevel Editor

    - Install RPM packages: `rpm -vh package`

    - Check if RPM is installed: `rpm -q rpm`

    - Unpack tar files: `tar xzv filename.tgz

    - Unpack bz2 compressed files: `bzip2 -d filename.bz2`


    ```

    Commands:

    ```

    ping Checks network connectivity

    ifconfig Configures network interface

    ifconfig Configures wireless interface

    netstat Displays network status

    ```

