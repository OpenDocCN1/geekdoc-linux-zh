    You have to be selective about what newsgroups you read because keeping up with
    all the news is impossible, even in a specific area such as Linux. When you first
    install and set up Linux, you might read newsgroups such as comp.os.linux.help,
    comp.os.linux.setup, comp.os.linux.hardware, and comp.os.linux.x (especially if
    you run X). After you have Linux up and running, you may want to find out about
    new things happening in Linux. For such information, read the comp.os.linux.announce
    newsgroup.


    # Reading Newsgroups from Your ISP


    If you sign up with an ISP for Internet access, it can provide you with access
    to a news server. Such Internet servers communicate by using the Network News
    Transfer Protocol (NNTP). You can use an NNTP-capable newsreader, such as KNode
    or Pan, to access the news server and read newsgroups. Using a newsreader is the
    easiest way to access news from your ISP''s news server.'
