    # Scanning Photos and Documents


    If you have a scanner — a hardware device that enables you to obtain a digital
    image of any photo or document — you can use it with SUSE Linux. Typically, scanners
    plug into a PC''s USB port. Here are the steps to follow to set up your scanner
    in SUSE Linux (describe the procedures for the KDE desktop, but the steps are
    similar in GNOME):


    +   1. Plug a scanner into the SUSE Linux PC''s USB port. SUSE Linux detects the
    scanner and displays the dialog box shown in Figure 15-6. The dialog box prompts
    you if you want to configure the scanner. Click Yes.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_253_0.png)


    > The SUSE configuration program, YaST, starts and prompts you for the root password.
    Type the root password and click OK.


    +   2. YaST displays another dialog box (see Figure 15-7) that informs you that
    you can install a scanning application called Kooka. Click Yes to install the
    package.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_253_1.png)'
