  md: '# Chapter 10


    # E-Mailing and Instant Messaging in SUSE


    In This Chapter


    +   - Understanding electronic mail

    - Taking stock of mail readers and IM (instant messaging) clients

    - Introducing KMail

    - Introducing Evolution

    - Instant messaging with Kopeete and GAIM


    Electronic mail (e-mail) is a mainstay of the Internet. E-mail is great because
    you can exchange messages and documents with anyone on the Internet. You can send
    messages anywhere in the world, and that message typically makes its way to its
    destination within minutes, if not seconds — something you cannot do with paper
    mail (also appropriately known as snail mail). I love e-mail because I can communicate
    without having to play "phone tag," in which two people can leave telephone messages
    for each other without ever fully making contact.


    SUSE Linux comes with several mail clients — also called mail readers — that you
    can download mail from your Internet service provider (ISP). You can also read
    and send e-mail using these mail clients. In this chapter, Introduce you to the
    primary mail clients for the KDE and GNOME desktops. When you know one of these
    mail clients, you can easily use any of the readers.


    There is yet another type of "keeping in touch" that''s more in line with the
    twenty-first century. I''m talking about IM — instant messaging. IM is basically
    one-to-one chat, and SUSE includes IM clients that can work with many instant
    messaging protocols such as AOL Instant Messenger (or AIM), MSN Messenger, ICQ,
    Jabber, Yahoo!; Gadu-Gadu, IRC (Internet Relay Chat), and SMS (Short Message Service
    or text messaging). I briefly describe the primary mail clients for KDE and GNOME
    desktops in this chapter.'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# Understanding E-Mail


    E-mail messages are addressed to a username at a host (host is just a fancy name
    for an online computer). That means if John Doe logs in with the username jdoe,
    e-mail to him is addressed to jdoe. The only other piece of information needed
    to identify the recipient is the fully qualified domain name of the recipient''s
    system. Thus, if John Doe''s system is named someplace.com, his complete e-mail
    address becomes jdoe@someplace.com. Given that address, anyone on the Internet
    can send e-mail to John Doe.


    # MUA and MTA work


    The two types of mail software


    +   Mail-user agent (MUA) is the fancy name for a mail reader — a client that
    you use to read your mail messages, write replies, and compose new messages. Typically,
    the mail-user agent retrieves messages from the mail server by using the POP3
    or IMAP4 protocol. POP3 is the Post Office Protocol 3, and IMAP4 is the KDE Message
    Access Protocol 4. In Linux, the desktop uses uses KMail as the mail-user agent
    and GNOME provides Evolution.

    Mail-transfer agent (MTA) is the fancy name for a mail server that always sends
    and receives mail-text. The exact method for mail transport depends on the underlying
    network. In TCP/IP networks, the mail-transport agent delivers mail using the
    Simple Mail-Transfer Protocol (SMTP). You need an MTA only if your system is going
    to be a mail server. Specifically, you do not need an MTA if all you want to do
    is read and send mail via your ISP''s mail server.


    Figure 10-1 shows how MUAs and MTAs work when one after Alice sends an e-mail
    to Bob. (If you didn''t know, Alice and Bob to pick up any book on cryptography
    and explain e-mail is customary — just pick what I mean.) And you may already
    know this, but the Internet is fuzzy as diagrammed as a cloud — the boundaries
    of the Internet seem just right to represent (Or is it because no one knows where
    it starts and where it ends?)


    The scenario in Figure 10-1 is typical of most people. Alice and Bob both connect
    to the Internet through an ISP and send their e-mail through their ISPs. When
    Alice types a message and sends it, her mail-user agent (MUA) sends the message
    to her ISP''s mail-transfer agent (MTA) using the Simple Mail-Transfer Protocol
    (SMTP). The sending MTA then sends that message to the receiving MTA — Bob''s
    ISP''s MTA — using SMTP. When Bob connects to the Internet, his downloads the
    message from his ISP''s MTA using the POP3 (or IMAP4) protocol. That''s how mail
    moves around the Internet — from sending MTA to sending MTA to receiving MTA.'
  merge: -1
  pgno: 177
