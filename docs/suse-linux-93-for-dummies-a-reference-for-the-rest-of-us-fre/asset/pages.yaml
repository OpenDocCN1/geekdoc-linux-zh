    multicolumn format. For example, type the next two commands to see the contents
    of the /etc/X11 directory:


    ```

    cd /etc/X11

    ls

    ```


    The output looks like this (on the console, you see some items in different colors):


    | fs qtrc xFB86Config.sassave xorg.conf |

    | fywm2 rstart xFB86Config.yAST2save Resources |

    | kystler twm x xserver |

