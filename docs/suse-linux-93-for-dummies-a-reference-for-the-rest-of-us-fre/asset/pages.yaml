    StarOffice is another well-known productivity software package.

    * CrossOver Office: From CodeWeavers (www.codeweavers.com/site/

    products), you can use CrossOver Office to install your Microsoft Office

    applications (Office 97, Office 2000, and Office XP) in Linux.


    As you can see, plenty of Linux office applications are compatible with

