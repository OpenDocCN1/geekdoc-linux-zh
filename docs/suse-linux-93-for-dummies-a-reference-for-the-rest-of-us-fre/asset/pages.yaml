    One of these days, you''ll become a SUSE Linux expert, and then you''ll want to
    use cryptic commands for everything. Yeah, right! Seriously: Sometimes you end
    up having to use some Linux commands because you are stuck at a text console (X
    is on the frit) or there''s no quick way in a GUI to do what you want. I''m going
    to show you the ten most-used SUSE Linux commands. (I didn''t do a survey to find
    the ten most-used commands — these are simply the ones I use often.)


    Linux commands are case-sensitive and all commands are in lowercase. Of course,
    directory and filenames can be in mixed case.


    Before I forget... if you are wondering where you use these commands, you type
    these commands at a shell prompt in a text console or in a terminal window, which
    you can open from the GUI desktop. See Chapter 16 for more information about shells
    and the syntax of commands.


