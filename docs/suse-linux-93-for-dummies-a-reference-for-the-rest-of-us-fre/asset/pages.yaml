    Use the man command to read the man page of each of the Linux commands list in
    this chapter. That way, you''ll become familiar with these oft-used commands.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_354_0.png)


    # ls: Listing Files and Directories


    The ls displays the contents of a specified directory. If you omit the directory
    name, ls displays the contents of the current directory. By default, ls does not
    list files whose names begin with a period (.); to see all files, ls -a. You can
    see full details of files (including size, user and group ownership, and read-write-execute
    permissions) with the ls -l command.


    # cat: Feeding Input to Commands


    The cat command is deceptive when you find out what it does literally — it copies
    the contents of a file to the standard output (which means the text console or
    the terminal window). So what''s so great about it? Well, to see why cat is useful,
    you can use cat together with the output redirection feature of the shell. Basically,
    you can feed the output of cat as input to other commands. For example, suppose
    you have several MP3 files that you want to consolidate into a single MP3 file.
    You can use the following cat command to perform that:


    ```

    cat *.mp3 > bigone.mp3

    ```


    This command concatenates all the files with names ending in .mp3 and creates
    the bigone.mp3 file in the current directory. Incidentally, that greater-than'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# 334 Part V: The Part of Tens


    sign (>) is the output redirection character that causes the output of the command
    to go to the bigone.mp3 file.


    You can use cat to make an ISO image file of any CD. Assuming that the CD-ROM
    drive''s device name is /dev/cdrom, just type the following cat command to create
    the ISO image file named cdimage.iso (you can use any file-name you want):


    ```

    cat /dev/cdrom > cdimage.iso

    ```


    How''s that for a multipurpose tool?


    # grep: Searching for Text in Files


    If have used Linux (or any variant of UNIX) for a while, you probably know about
    the grep command, which enables you to search for files for a pattern of strings.
    There is a typical use of grep to locate all files that have any occurrences of
    the string ethernet or Ethernet — on any line of all files with names that end
    in .:


    ```

    cd /usr/include

    grep "[eE]ethernet" *.h

    ```


    The last command finds all occurrences of ethernet or Ethernet in the files with
    names ending in .h.


    The grep command''s "[eE]ethernet" argument is known as a regular expression,
    a pattern that matches a set of strings. You construct a regular expression with
    a small set of operators and rules that resemble the ones for writing arithmetic
    expressions. A list of characters inside brackets ([...], for example, matches
    any single character in the list. Thus, the regular expression "[eE]ethernet"
    is a set of two strings, as follows:


    ethernet Ethernet


    There are many ways to construct regular expressions, but I won''t go into that.
    Even if you don''t know much about regular expressions, you can use grep perfectly
    well to search for a specific sequence of characters in one or more text files.
    Later on, you can gradually learn more complex search patterns.


    Setting the regular expressions for the time being, here is the syntax of a typical
    use of grep:


    ```

    grep [options] pattern files

    ```'
