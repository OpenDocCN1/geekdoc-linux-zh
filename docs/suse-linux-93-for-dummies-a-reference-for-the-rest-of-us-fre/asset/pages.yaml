  md: '# 142 Part III: Doing Stuff with SUSE


    # # Understanding the World Wide Web


    If you have a file server at work, you know the convenience of sharing files.
    You can use the word processor on your desktop to get to any document on the shared
    server.


    Now imagine a word processor that enables you to open and view a document that
    resides on any computer on the Internet. You can view the document in its full
    glory, with formatted text and graphics. If the document makes a reference to
    another document (possibly residing on yet another computer), you can open that
    linked document by clicking the reference. That kind of easy access to distributed
    documents is essentially what the World Wide Web provides.


    Of course, the documents have to be in a standard format, so that any computer
    (with the appropriate Web browser software) can access and interpret the document.
    And a standard protocol is necessary for transferring documents from one system
    to another.


    The Web document format is Hypertext Markup Language (HTML), and the standard
    protocol for exchanging documents is Hypertext Transfer Protocol (HTTP). HTML
    documents are text files and don''t depend on any operating system, so they work
    on any system from Windows and Mac to any type of UNIX and Linux.


    A Web server is software that provides HTML documents to any client that makes
    the appropriate HTTP requests. A Web browser is the client software that actually
    downloads an HTML document from a Web server and displays the contents graphically.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_163_0.png)


    # # Links and URLs


    Like the pages of real books, Web pages contain text and graphics. Unlike real
    books, however, Web pages can include multimedia, such as video clips, sound,
    and links to other Web pages that can actually take you to those Web pages.


    The links in a Web page are references to other Web pages that you can follow
    from one page to another. The Web browser typically displays these links as underlined
    text (in a different color) or as images. Each link is an instruction to you —
    something like, "For more information, please consult Chapter 4," that you might
    find in a real book. In a Web page, all you have to do is click the link; the
    Web browser brings up the referenced page, even though that document may actually
    reside on a faraway computer somewhere on the Internet.'
  merge: -1
  pgno: 163
- img_proc: true
  md: '# Chapter 9: Browsing the Web


    The links in a Web page are referred to as hypertext links because when you click
    a link, the Web browser jumps to the Web page referenced by that link.


    This arrangement brings up a question. In a real book, you might refer the reader
    to a specific chapter or page in the book. How does a hypertext link indicate
    the location of the referenced Web page? In the Wide Web, each Web page has a
    special name, called a Uniform Resource Locator (URL). A URL uniquely specifies
    the location of a file on a computer. Figure 9-1 shows the parts of a URL.


    | Domain name | Directory path | Filename | HTML anchor |

    | --- | --- | --- | --- |

    | http://www.tldp.org:80/HOWTO/Wireless-HOWTO-2.html#ss2.1 | | |


    Figure 9-1: The parts of a Uniform Resource Locator (URL). Protocol


    As Figure 9-1 shows, a URL has the following parts:


    +   * Protocol: Name of the protocol the Web browser uses to access the data from
    the URL specifies. In Figure 9-1, the protocol is http://, which means the URL
    specifies the location of a Web page. Here are some of the common protocol types
    and their meanings:

    * file: means the URL is pointing to a local file. You can use this URL to view
    HTML files without having to connect to the Internet. For example, file:///srv/www/html/index.html
    opens the file at /srv/www/html/index.html from your Linux system

    * ftp: means that you can download a file using the File Transfer Protocol (FTP).
    For example, ftp://ftp.purdue.edu/pub/uns/NASA/nasa.jpg refers to the image file
    nasa.jpg from the /pub/uns/NASA directory of the FTP server ftp.purdue.edu. If
    you want to access a specific user account via FTP, use a URL in the following
    form: ftp://username:password@ftp.website.com/ with the username and password
    embedded in the URL. (Note that the password is in plain text and not secure).

    * http:// means that the file is downloaded using the Hypertext Transfer Protocol
    (HTTP). This protocol is the well-known format'
  merge: -1
