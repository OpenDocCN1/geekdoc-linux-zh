  md: '# 114 Part II: Test Driving SUSE


    TIP


    You can also buy a NAT router with a built-in 4 or 8-port Ethernet hub. With such
    a combined router-hub, you need only one box to set up a LAN and connect it to
    the Internet via a DSL modem. These boxes are typically sold under the name Cable/DSL
    router because they work with both DSL and a cable.


    REMEMBER


    DSL providers use a protocol known as PPP over Ethernet (PPPoE) to establish a
    connection between your PC and the equipment at the provider''s central office.
    PPPoE requires you to provide a username and password to establish the network
    connection over Ethernet. To set up your system for a PPPoE DSL connection, all
    you have to do is run YaST. (Choose Main Menu:System; click Network Devices on
    the left-hand window, and click DSL from the different network devices shown on
    the right-hand window.) YaST automatically detects the DSL modem and guides you
    through the configuration process.


    # Connecting to the Internet with a Cable Modem


    TV companies also offer high-speed Internet access over the same coaxial cable
    that carries television signals to your home. After the cable company installs
    the necessary equipment at its facility to send and receive digital data over
    the coaxial cables, customers can sign up for cable Internet service. You can
    then get high-speed Internet access over the same cable that delivers cable TV
    signals to your home.


    # How cable modems work


    A box called a cable modem is at the heart of Internet access over the cable TV
    network. (See Figure 7-4.) The cable modem takes digital data from your PC''s
    Ethernet card and puts it in an unused block of frequency. (Think of it as another
    channel, but instead of pictures and sound, this channel carries digital data.)


    The modem places upstream data — data that is being sent from your PC to the Internet
    — in a different channel than the downstream data that is coming from the Internet
    to your PC. By design, the speed of downstream data transfers is much higher than
    that of upstream transfers. The assumption is that people download far more stuff
    from the Internet than they upload. (Probably true for most of us.)'
  merge: -1
  pgno: 135
- img_proc: true
  md: '# Chapter 7: I Want My Internet, Now! 115


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_136_0.png)


    Figure 7-4: Cable modems provide high-speed Internet access over the cable TV
    network.


    The coaxial cable that carries all those hundreds of cable TV channels to your
    home is a very capable signal carrier. In particular, the coaxial cable can carry
    signals covering a large range of frequencies — hundreds of megahertz (MHz). Each
    TV channel requires 6 MHz — and the coaxial cable can carry hundreds of such channels.
    The cable modem places the upstream data in a small frequency band and expects
    to receive the downstream data in a whole other frequency band.'
  merge: -1
  pgno: 136
- img_proc: true
  md: '# 116 Part II: Test Driving SUSE


    At the other end of your cable connection to the Internet is the Cable Modem Termination
    System (CMTS) — also known as the head end — that your cable company installs
    at its central facility.(Refer to Figure 7-4.) The CMTS connects the cable TV
    network to the Internet. It extracts the upstream data sent by your cable modem
    (and by those of your neighbors as well) and sends all of it to the Internet.
    The CMTS also pushes digital data into the upstream channels so your cable modem
    can extract data and provide it to your PC via the Ethernet card.


    Cable modems can receive downstream data at the rate of about 30 Mbps and send
    upstream data at about 3 Mbps. However, all the cable modems in a neighborhood
    share the same downstream capacity. Each cable modem filters out — separates —
    the data it needs from the stream of data that CMTS sends out. Cable modems follow
    a standard called DOCSIS, which stands for Data Over Cable Service Interface Specification.
    You can buy any DOCSIS-compliant modem and use it with your cable service; all
    you have to do is call the cable company and give them the modem''s identifying
    information that the CMTS can recognize and initialize the model.


