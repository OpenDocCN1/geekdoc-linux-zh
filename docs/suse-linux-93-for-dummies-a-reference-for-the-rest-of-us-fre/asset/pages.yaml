    # # Making Presentations with OpenOffice.org Impress


    It seems the business world, or should I say the whole world, is full of PowerPoint
    rangers — those dedicated souls who live by their PowerPoint briefing packages
    (slide presentations). It’s hard to imagine a meeting or a conference where someone
    isn’t vigorously making points on-screen with PowerPoint. Face it: Slide presentations
    are here to stay. Making presentations is a fact of life; businesspeople come
    to expect office-application suites to include some sort of presentation software.


    Like Microsoft Office, the OpenOffice.org office application comes with its own
    PowerPoint-like presentation software—OpenOffice.org (or Impress for short). If
    you have used Microsoft PowerPoint and you’re already familiar with its nuts and
    bolts—the concept of how to add text and graphics to a slide, how to organize
    the slides, and how to run a slide show—then you’ll find it easy to get started
    with Impress. Because some details of how you perform basic Impress tasks may
    differ from the way they’re done in PowerPoint, I provide some quick tips to point
    you in the right direction. I start with an overview of Impress and then cover
    some categories of common tasks that you’ll likely perform in Impress.


    # # Taking stock of OpenOffice.org Impress


    You’ll find that Impress can do all the usual things that presentation software
    such as Microsoft PowerPoint can do. For example, you can create professional-looking
    slide shows in Impress, using capabilities like these:'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# Chapter 13: Doing Even More Office Stuff in SUSE Linux 209


    +   - Open and edit Microsoft PowerPoint files or convert Microsoft PowerPoint
    files to Impress format. One advantage of converting to Impress format is that
    Impress files are smaller in size than corresponding Microsoft PowerPoint files.
    Presentation files stored in Impress format are assigned filenames with .odp extension.


    +   - Save documents in many different formats, including Microsoft PowerPoint
    97/2000/XP, StarDraw 5.0 and 3.0, and Starlimpress 5.0 and 4.0.


    +   - Insert graphics and clip art from many different formats, including JPEG,
    GIF, ZSoft Paintbrush (PCX), TIFF, Windows BMP, Macintosh PICT, Encapsulated PostScript
    (EPS), Adobe Photoshop (PSD), AutoCAD DX, and many more.


    +   - Insert other Office.org documents (from programs as Writer, Calc, and Draw)
    into a presentation.


    +   - Use AutoPilot to quickly create a presentation.


    +   - Use all the drawing tools from OpenOffice.Draw to add drawings to the slides.


    +   - Export a presentation to a Web Page (HTML) with or without frames. You can
    also export the slides in any of the supported graphics file formats.


    +   - Use layers to separate parts of the slide so that each part can be edited
    or viewed separately.


    +   - Use special effects such as animated text and graphics, sound, and slide
    transition effects.


    +   - Use FontWork (Format:FontWork) to create various text effects such as aligning
    text along a curve.


    +   - Render text in 3D.


    +   - Save versions of a presentation as you continue to change it and revert
    back to an older version, if necessary.


    +   - Use speaker''s notes to each slide and create handouts.


    # Getting started with Impress


    The best way to get comfortable using Impress is simply to start using it. To
    start Impress, choose Main Menu; Office; Presentation; OpenOffice.org Impress
    in KDE or GNOME.'
