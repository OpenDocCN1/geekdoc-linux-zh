  md: '# Chapter 18: Updating SUSE and Adding New Software 285


    # Removing an RPM


    You may want to remove — uninstall — a package if you realize you don''t really
    need the software. For example, if you have installed the X Window System development
    package but discover you''re not interested in writing GUI applications, you can
    easily remove the package using the rpm -e command.


    You have to know the name of the package before you remove it. One good way to
    find the name is to use rpm qa in conjunction with grep for search for the appropriate
    RPM file.


    For example, to remove the package name qt3-devel, type


    ```

    rpm -e qt3-devel

    ```


    To remove an RPM, you don''t need the full RPM filename; all you need is the package
    name — the first part of the filename up to the dash ( — before the version number.


    The rpm command does not remove a package that other packages does.


    # Upgrading an RPM


    Use the rpm U command to upgrade an RPM. You must provide the name of the RPM
    file that contains the new software. For example, if I have version 1.1.20 of
    cups (printing system) installed on my system but I want to upgrade to version
    1.1.21, download the RPM cups 1.1.21-5.3.i586.rpm from a repository and use the
    following command:


    ```

    rpm -U cups 1.1.21-5.3.i586.rpm

    ```


    The rpm command performs the upgrade by removing the old version of the cups package
    and installing the new RPM.


    > Whenever possible, upgrade rather than remove the old package and install a
    new one. Upgrading automatically saves your old configuration files, which saves
    you the hassle of reconfiguring the software after a fresh installation.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_306_0.png)'
  merge: -1
