  md: '# # Chapter 19


    # # Securing SUSE Linux


    +   In This Chapter

    - Understanding host and network security issues

    -Getting familiar with computer security terminology

    - Practicing good host security

    - Securing the network

    -Keeping up with security news and updates


    In this chapter, I explain why you need to worry about security and give you a
    high-level view of how to get a handle on security. I explain the two key aspects
    of security — host security and network security — and introduce you to the terminology
    used in discussing computer security. Then I provide an overview of how to secure
    the host (the stand-alone PC) and the network. Finally, I by pointing out a few
    resources that can help you keep up with security news and updates


    # # Why Worry about Security?


    In today''s networked world, you have to worry about your SUSE Linux system''s
    security. For a stand-alone system, or a system used in an isolated local area
    network (LAN), you have to focus on protecting the system from users users the
    users from one another. In other words, you don''t want a user to modify or delete
    file systems, whether intentionally or unintentionally. Also, you don''t want
    a destroying another user''s files.


    If your SUSE Linux system is connected to the Internet, you have to secure the
    system from unwanted accesses over the Internet. These intruders — crackers, as
    they are commonly known — typically impersonate a user, steal or destroy information,
    and deny you any access to your own system (known as a Denial of Service or DoS
    attack).


    By its very nature, an Internet connection makes your system accessible to any
    other system on the Internet. After all, the Internet connects a huge number of
    networks across the globe. In fact, the client/server architecture'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# 288 Part IV: Becoming a SUSE Wizard


    of Internet services, such as HTTP (Web) and FTP, rely on the wide-open network
    access the Internet provides. Unfortunately, the easy accessibility to Internet
    services running on your system also means that anyone on the Net can easily access
    your system.


    If you operate an Internet host that provides information to others, you certainly
    want everyone to access your system''s Internet services, such as FTP and Web
    servers. However, these servers often have vulnerabilities that crackers may exploit
    in order to cause harm to your system. You need to know about the potential security
    risks of Internet services — and the cautions you can take to minimize the risk
    of exploiting the weaknesses of your FTP or Web server.


    You also want to protect your company''s internal network from outsiders, even
    though your goal is to provide information to the outside world through a Web
    or FTP server. You can protect your internal network by setting up an Internet
    firewall—a controlled access point to the internal network—and placing the Web
    and FTP servers on a host outside the firewall.


    # Understanding Linux Security


    To secure a Linux system, you have to tackle two broad categories of security
    issues:


    +   - Host security issues that relate to securing the operating system and the
    files and directories on the system

    - Network security issues that refer to the threat of attacks over the network
    connection


    # Understanding the host security issues


    There are some high-level guidelines to address host security (I cover some of
    these topics in detail later in this chapter):


    +   - When installing SUSE Linux, select only the package groups that you need
    for your system. For example, don''t install unnecessary software. If your system
    is used as a workstation, you don''t have to install all of the servers (Web server,
    news server, and so on).

    - Create initial user accounts and make sure all passwords are strong enough that
    password-cracking programs can''t “guess”. SUSE Linux includes tools to enforce
    strong passwords.

    - Set file ownership and permissions to protect important files and directories.'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# Chapter 19: Securing SUSE Linux


    +   - Use the GNU Privacy Guard (GnuPG) to encrypt or decrypt files with sensitive
    information and to authenticate files that you download from the Internet. GnuPG
    comes with SUSE Linux and you can use the gpg command to perform the tasks as
    encrypting or decrypting a file.


    +   - Use integrity-checking tools, such as Tripwire, to monitor any changes to
    system files and directories. The open source version of Tripwire (which is somewhat
    old) is available from www.tripwire.org. Visit www.tripwire.com for the commercial
    version.


    +   - Periodically check log files for any break-ins or attempted break-ins. These
    log files are in the /var/log directory of your system.


    +   - Install security updates to SUSE Linux as soon as they become available.
    These security updates fix known vulnerabilities in SUSE Linux. You can get these
    updates by using Yaast Online Update that I describe in Chapter 18.


    # Understanding network security issues


    The issue of network security comes up as soon as you connect your organization''s
    internal network to the Internet. You need to think of network security even if
    you connect a single computer to the Internet, but security concerns are more
    pressing when an entire internal network is opened to the world.


    If you''re an experienced system administrator, you already know that the cost
    of managing an Internet presence doesn''t worry corporate management; their main
    concern is security. To get your management''s backing for the Web site, you have
    to lay out a plan to keep the corporate network secure from intruders.


    You may think that you can avoid jeopardizing the internal network by connecting
    only the external servers, such as Web and FTP servers, to the Internet. However,
    employing this simplistic approach isn''t wise. It''s like deciding not to drive
    because you may have an accident. Having a network connection between your Web
    server and your internal network also has the following drawbacks:


    +   - You cannot use file transfers, such as FTP, to copy documents and data from
    your internal network to the Web server.


    +   - Users on the internal network don''t access the corporate Web server.


    +   - Users on the internal network don''t have access to Web servers on the Internet.
    Such a restriction makes a valuable resource — the Web — inaccessible to the users
    in your organization.'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# 290 Part IV: Becoming a SUSE Wizard


    A practical solution to this problem is to set up an Internet firewall and to
    put the Web server on a highly secured host outside the firewall.


    In addition to using a firewall, here are some of the other steps to take to address
    network security (I explain these further, later in this chapter):


    +   - Enable only those Internet services you need on a system. In particular,
    don''t enable services that are not properly configured.


    +   - Use Secure Shell (ssh) for remote logins. Don''t use the r commands, such
    as rlogin and rsh.


    +   - Secure any Internet services, such as FTP or TELNET, that you want to run
    on your system. Better yet, don''t run them unless you need them.


    +   - Promptly fix any known vulnerabilities of Internet services that you choose
    to run. You can download and install the latest security updates for SUSE Linux
    by using the YaST Online Update.


    # Getting Familiar with Computer Security Terminology


    Computer books, magazine articles, and experts on computer security use a number
    of terms with unique meanings. You need to know these terms to understand discussions
    about computer security (and to communicate effectively with security vendors).
    Table 19-1 describes some of the commonly used computer security terms.


    | Table 19-1 Commonly Used Computer Security Terminology |

    | Term | Description |

    | Application gateway | A proxy service that acts as a gateway for application-level
    protocols, such as FTP, HTTP, NNTP, and SSH. |

    | Authentication | The process of confirming that a user is indeed who he or she
    claims to be. The typical authentication method is a challenge-response method
    wherein the user enters a username and secret password to confirm his or her identity.
    |

    | Backdoor | A security weakness a cracker places on a host in order to bypass
    security features. |'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# Chapter 19: Securing SUSE Linux


    | Term | Description |

    | --- | --- |

    | Bastion host | A highly secured computer that serves as an organization''s main
    point of presence on the Internet. A bastion typically resides on the perimeter
    network, but a dual-homed host (with one network interface connected to the Internet
