    The file system has a well-defined set of top-level directories, and some of these
    directories have specific purposes. Finding your way around the file system is
    easier if you know the purpose of these directories. You also become adept at
    guessing where to look for specific types of files when you face a new situation.
    Consult Table 6-1 for a brief description of the top-level directories in the
    Linux system.


    | Table 6-1 | Top-Level Directories in the SUSE Linux File System |

    | Directory | Description |

    | / | This root directory forms the base of the file system. All files and directories
    are contained logically in the root directory, regardless of their physical locations.
    |

    | /bin | Contains the executable programs that are part of the Linux operating
    system. Many commands, such as cat, cp, ls, and tar, are located in /bin. |

    | /boot | Contains the kernel and other files that the GRUB boot manager needs.
    (The kernel and other files can be anywhere, placing them in the /boot directory
    is customary.) |

    | /dev | Contains special files that represent devices attached to the system.
    |

    | /etc | Contains most system configuration files and the initialization scripts
    (in the /etc/rc.d subdirectory). |


    (continued)'
