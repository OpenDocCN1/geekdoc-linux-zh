    a DVD or a CD-ROM in the drive (I am assuming it''s a data disc), click My Computer
    icon on your desktop, and then click the icon for the DVD/CD drive. The contents
    of the CD or DVD data then appear in a GUI file manager. If you insert a DVD movie
    into the DVD drive, an appropriate multimedia program opens the DVD.


    If you see a DVD/CD-ROM icon on the desktop, right-click that icon for a text
    menu. From that menu, you can eject the CD or DVD when you are done.


    # Playing with the Shell


    Linux is basically UNIX, and UNIX doesn''t feel like UNIX unless you can type
    cryptic commands in a text terminal. Although GNOME and KDE have done a lot to
    bring us to the world of windows, icons, mouse, and pointer (affectionately known
    as WIMP), sometimes you''re stuck with nothing but a plain text screen with a
    prompt that looks something like this (when I log in with the username daba):


    ```

    naba@linux:~

    ```


    You see the screen most often when something is wrong with the X Window System,
    which is essentially the machinery that runs the windows and menus that you see
    normally. In those cases, your first reaction might be, "What do I do?" And the
    answer is that you have to work with the shell and know some of the cryptic Linux
    commands.


    You can prepare for unexpected encounters with the shell by trying out Linux commands
    in a terminal window while you''re in the GNOME or KDE GUI. After you get the
    hang of it, you might even keep a terminal window open, just so you can use one
    of those cryptic commands simply because it''s faster than pointing and clicking.(Those
    two-letter commands do pack some punch!)


    # Starting the bash shell


    Simply put, the shell is the Linux command interpreter — a program that reads
    what you type, interprets text as a command, and what does the command is supposed
    to do.


    Before you start playing with the shell, open a terminal window. In KDE, the panel
    includes an icon that looks like a monitor covered by a shell (for a shell, get
    it?)._ When you click that icon, a window with a prompt appears, like'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# Chapter 3: Starting SUSE for the First Time


    the one shown in Figure 3-9. That''s a terminal window, and it works just like
    an old-fashioned terminal. A shell program is running and ready to accept any
    text that you type. You type text, press Enter, and something happens (depending
    on what you typed).


    In GNOME, choose Programs Menu-System-Terminal-Terminal. That should then open
    up a terminal window.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_70_0.png)


    The prompt that you see depends on the shell that runs in terminal window. The
    default Linux shell is called bash.


    Bash understands a whole host of standard Linux commands, which you can use to
    look at files, from one directory to another, see what programs are running (and
    who else is logged in), and a lot more.


    In addition to the Linux commands, bash can run any program stored in an executable
    file. Bash can also execute shell scripts — text files that contain Linux commands.


    # Understanding shell commands


    Because a shell interprets what you type, knowing how the shell figures out the
    text that you enter is important. All shell commands have this general format:


    ```

    command option1 option2 ... optionN

    ```


    A single line of commands is commonly called a command line. On a command line,
    you enter a command followed by one or more optional parameters'
  merge: -1
  pgno: 70
- img_proc: true
  md: '# 50 Part I: Getting to Know SUSE


    (arguments). Such command line options (or command line arguments) help you specify
    what you want the command to do.


    One basic rule is that you have to use a space or a tab to separate the command
    from the options. You must also separate options with a space or a tab. If you
    want to use an option that contains embedded spaces, you have to put that option
    quotation marks. For example, to search for two words of text in the password
    file, I enter the following grep command (grep is one of those cryptic commands
    used to search for text in files):


    ```

    grep "SSH daemon" /etc/passwd

    ```


    When you grep the line with those words, it looks like this:


    ```

    ssh:x:71:65:SSH daemon:/var/lib/sshd:/bin/false

    ```


    If you created a user account in your name, go ahead and type the command as an
    argument, but remember to enclose the name in quotes. For example, here is how
    I search for my name in the /etc/passwd file:


    ```

    grep "Naba Barkakati" /etc/passwd

    ```


    # Trying a few Linux commands


    When you have the terminal window open, try a few Linux commands just for fun.
    I guide you through some random examples to give you a feel for what you can do
    at the shell prompt.


    To see how long the Linux PC has been up since you last powered it up, type the
    following (Note: I show the typed command in bold, followed by the output from
    that command):


    ```

    uptime

    3:52am up 29 days 55:53, 5 users, load average: 0.04,

    0.32, 0.38

    ```


    The part up 29 days, 55:53 tells you that this particular PC has been up for nearly
    a month. Hmmm...can Windows do that?


    To see what version of Linux kernel your system is running, use the uname command
    like this:


    ```

    uname -srv

    ```'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# Chapter 3: Starting SUSE for the First Time 51


    This runs the uname command with three options -s, -r, and -v (these can be combined
    as -srv, as this example shows). The -s option causes uname to print the name
    of the kernel, -r prints the kernel release number, and -v prints the kernel version
    number. The command generates the output on one of Linux systems:


    ```

    Linux 2.6.8-24-default #1 Wed Oct 6 09:16:23 UTC 2004

    ```


    In this case, the system is running kernel version 2.6.8.


    To read a file, use the more command. Here''s an example that displays the contents
    of /etc/passwd file:


    ```

    root:x:0:0:root:/root:/bin/bash

    bin:x:1:1:bin:/bin/bash

    daemon:x:2:2:Daemon:/sbin:/bin/bash

    lp:x:4:7:printing daemon:/var/spool/lp:/bin/bash

    ... lines deleted ...

    ```


    To see a list of all the programs currently running on the system, use the ps
    command, like this:


    ```

    ps ax

    ```


    The ps command takes many options and you can provide these options without the
    usual dash (-) prefix. This example uses the a and x options - a option lists
    all processes that you are running and the x option displays all the rest of the
    processes. The result is a list of all processes running on the system, as shown
    in the following sample output:


    | PID TTY STAT TIME COMMAND |

    |---|---|---|---|

    | 1 | S | 0:00 init [5] |

    | 2 | SN | 0:00 [ksoftird/0] |

    | 3 | S | 0:00 [events/0] |

    | 4 | S | 0:00 [khelper] |

    | 5 | S | 0:00 [netlink/0] |

    | 6 | S | 0:00 [kblockd/0] |

    | 31| S | 0:00 [kapmd] |

    | lines deleted |


    Amazing how many programs can run on a system even when you are logged in as a
    user, isn''t it?


    As you guess, you can do everything from a shell prompt, but it does some getting
    used to.'
