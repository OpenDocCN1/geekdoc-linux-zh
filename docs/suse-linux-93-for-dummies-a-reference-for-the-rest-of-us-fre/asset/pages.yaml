  md: '# Chapter 23: Ten Most Commonly Used SUSE Commands


    This grep command searches for the pattern in the specified files, and [options]
    denote one or more single-character options that begin with a hyphen. Here are
    the options and their meanings:


    +   - N (where N is a number) displays N lines around the line containing the
    pattern.

    - c shows the number of lines that contain the search pattern.

    - f reads options from a specified file.

    - i ignores case.

    - l displays the filenames that contain the pattern.

    - n displays a line number next to lines that contain the pattern.

    - q returns a status code but does not display any output.

    - v displays the lines that do not contain a pattern.

    - w matches only words.


    # locate: Finding Files and Directories the Easy Way


    The locate command searches a database of filenames for any name that matches
    a specified pattern. If you are not sure about the location of a file, just type
    locate followed by a part of the filename. For example, here''s how you can search
    for the XF86Config:


    ```

    locate XF86Config

    ```


    This causes locate to display all file or directory names that contain XF86Config
    in their names.


    I love the locate command. I use it the time I want to check if a certain file
    exists somewhere in my system. Sometimes a huge number of files and directories
    might contain the search word. You can send the output of locate through by typing
    locate keyword | more and browsing the output page at a time. Another trick is
    to send the output through the grep command and look for some other word that
    helps you find a specific file. For example, when I want to see if there is a
    binary (executable) file with rpm in its name, I type locate rpm grep bin I know
    that the binary files would be in a directory whose name contains bin (for example,
    /bin, /usr/bin, and so on).


    The locate command is not installed by default in SUSE Linux.


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_356_0.png)'
