  md: '# Chapter 9: Browsing the Web


    +   ✓ HTML anchor: Optional part of the URL that makes the Web browser jump to
    a specific location in the file. If this part starts with a question mark (?)
    instead of a hash mark (#), the browser takes the text following the question
    mark to be a query. The Web server returns information based on such queries.


    # Web servers and Web browsers


    The Web server serves up the Web pages, and the Web browser downloads and displays
    them to the user. That''s pretty much the story with these two cooperating software
    packages that make the Web work.


    In a typical scenario, the user sits in front of a computer that''s connected
    to the Internet and runs a Web browser. When the user clicks a link or types a
    URL into the Web browser, the browser connects to the Web server and requests
    a document from the server. The Web server sends the document (usually in HTML
    format) and ends the connection. The Web browser interprets and displays the HTML
    document with text, graphics, and multimedia (if applicable). Figure 9-2 illustrates
    this typical scenario of a user browsing the Web.


    Web Server


    Figure 9-2: The Web browser requests documents and the Web server sends them.


