    - Preparing presentations in OpenOffice.org Impress


    Besides word processing and spreadsheets that I cover in Chapter 12, what else
    do you do in an office? Hmm...let me see. How about keeping track of appointments
    and tasks? Calculating how much profit you made? And making sales pitches or some
    sort of presentation? In this chapter, I cover SUSE Linux applications for some
    of these other office tasks. The chapter begins with a quick summary of the calendar
    applications in KDE and GNOME. Then I describe OpenOffice.org Impress — a Microsoft
    PowerPoint-like software package.


    # Keeping Track of Appointments and Tasks


