  md: '# In this part...


    You may not have realized it, but you are the system administrator (or sysadmin,
    for short) of your SUSE Linux system. I start this Part with a chapter that introduces
    you to the sysadmin duties and YaST — the graphical tool through which you do
    all your sysadmin chores in SUSE. Then I show how to keep your SUSE system up-to-date
    and how to install new software. Finally, I cover security — how to keep the bad
    guys out of your system (assuming your system is hooked up to the Internet).'
  merge: -1
