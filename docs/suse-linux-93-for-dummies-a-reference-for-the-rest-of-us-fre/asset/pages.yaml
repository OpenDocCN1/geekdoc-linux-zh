    # Commands for mounting and unmounting


    Suppose you want to access the files on this book''s companion DVD-ROM when you
    are logged in a text console (with no GUI to help you). To do so, you must first
    mount the DVD-ROM drive''s file system on a specific directory in the Linux file
    system.


    Type more /etc/fstab in a terminal to look at the /etc/fstab file for clues to
    the names of devices such as a floppy drive and DVD/CD drive. SUSE Linux uses
    the device name /dev/cdrom to refer to DVD/CD-ROM drives, whereas for a DVD/CD
    drive (a CD or DVD burner), the device name is /dev/cdrecorder. The entry in the
    /etc/fstab file also tells you where SUSE Linux mounts the DVD/CD drive. For a
    read-only DVD/CD-ROM drive, SUSE Linux uses /media/cdrom as the mount point, whereas
    for DVD/CD-R drive, the point is /media/cdrecorder.


    Type su to become root, insert the DVD-ROM in the DVD drive, and then type the
    following command in a text console or a terminal window:


    ```

    mount /dev/cdrom/media/cdrom

    ```


