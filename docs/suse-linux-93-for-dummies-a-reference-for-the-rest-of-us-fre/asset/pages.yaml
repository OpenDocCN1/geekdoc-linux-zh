    of security information through its mailing lists:

    - Technical Cyber Security Alerts provide technical information about vulnerabilities
    in various common software products.

    - Cyber Security Alerts are sent when vulnerabilities affect the general public.
    They outline the steps and actions that nontechnical home and corporate computer
    users can take to protect themselves from attacks.

    - Cyber Security Bulletins are biweekly summaries of security issues and new vulnerabilities
