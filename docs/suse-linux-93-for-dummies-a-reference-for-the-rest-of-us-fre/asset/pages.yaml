    # Configuring wireless networking


    On your SUSE Linux laptop, the PCMCIA manager recognizes the wireless network
    card and loads the appropriate driver for the card (PCMCIA or PC Card is the name
    of the plug-in card devices). Linux treats the wireless network card like another
    Ethernet device and assigns it a device name such as eth0 or eth1. If you already
    have an Ethernet card in the laptop, that card gets the eth0 device name, and
    the wireless PC card becomes the eth1 device.


    When you plug in the wireless PC card, SUSE detects the hardware and prompts you
    if you want to configure the network card. Click Yes and YaST prompts you for
    the root password. Then YaST opens the network card configuration window. You
    should see the wireless Ethernet card listed,


    From the screen shown in Figure 8-5, follow these steps:


    +   - Click Configure (see Figure 8-5).


    YaST displays the Network Address Setup screen.'
