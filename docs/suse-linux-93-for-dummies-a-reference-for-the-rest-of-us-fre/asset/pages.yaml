  pgno: 317
- img_proc: true
  md: '# Chapter 19: Securing SUSE Linux 297


    # Changing file ownerships


    You can set the user and group ownership with the chown command. For example,
    if the file /dev/hda should be owned by the user root and the group disk, use
    the following command as to set up this ownership:


    chown root.disk /dev/hda


    To change the group ownership, use the chgrp command. For example, here''s how
    you can change the group ownership of the file ledger.out from whatever it was
    earlier to the group named accounting:


    chgrp accounting ledger.out


    # Changing file permissions


    You may need to change a file''s permission settings to protect it from others.
    Use the chmod command to change the permission settings of a file or a directory.


    To use chmod effectively, you have to specify the permission settings. A good
    way is to concatenate one or more letters from each column of Table 19-2, in the
    order shown (Who/Action/Permission).


    | Table 19-2 | | File Permission Codes |

    |---|---|---|

    | u user | + add | r read |

    | g group | - remove | w write |

    | o others | = assign | x execute |

    | a all | s set user ID |


    To give everyone read access to all files in a directory, pick a (for all) from
    the first column, + (for add) from the second column, and r (for read) from the
    third column to come up with the permission setting a+r. Then use the whole set
    of options with chmod, like this:


    chmod a+r *


    On the other hand, to permit everyone to read and execute one specific file, type


    ```

    chmod a+rx filename

    ```'
