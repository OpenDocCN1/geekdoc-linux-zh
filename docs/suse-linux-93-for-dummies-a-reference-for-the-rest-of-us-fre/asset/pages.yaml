    # # Starting and Stopping Services


    Knowing the sequence in which Linux processes as it boots is important. You can
    use this knowledge to start and stop services, such as the Web server and Network
    File System (NFS). The next few sections provide you with an overview of how Linux
    boots starts the initial set of processes. These sections also familiarize you
    with the shell scripts that start various services on a Linux system.


    # # Understanding how Linux boots


    When Linux boots, it loads and runs the core operating system program from the
    hard drive. The core operating system is designed to run other programs. A process
    named `init` starts the initial set of processes on your Linux system.


    To see the processes currently running on the system, type


    ```

    ps ax | more

    ```


    You get an output listing that starts off like this:


    | PID TTY STAT TIME COMMAND |

    | --- | --- | --- | --- |

    | 1 ? | S | 0:01 init [5] |


    The first column, with the heading `PID`, shows a number for each process. PID
    stands for *process ID* (identifier) — a sequential number assigned to the'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# 262 Part IV: Becoming a SUSE Wizard


    Linux kernel. The first entry in the process list, with a process ID (PID) of
    1, is the init process. It''s the first process, and it starts all other processes
    in your Linux system. That''s why init is sometimes referred to as the "mother
    of all processes."


    What the init process depends on the following:


    +   * The run level, an identifier that identifies a system configuration in which
    only a selected group of processes are started.

    * The contents of the /etc/inittab file, a text file that specifies which processes
    to start at different run levels.

    * A number of shell scripts — sequence of Linux commands — that are executed at
    specific run levels.


    SUSE Linux uses seven run levels — 0 through 6. Table 17-2 shows the means of
    the different run levels in SUSE Linux.


    | Table 17-2 | Run Levels in SUSE Linux |

    |---|---|

    | Run Level | Meaning |

    | 0 | Shuts down the system |

    | 1 | Runs in single-user stand-alone mode (no one else can log in; you work at
    the text console) |

    | 2 | Runs in multiuser mode without network |

    | 3 | Runs in full multiuser mode with network and text-mode login |

    | 4 | Unused |

    | 5 | Runs in full multiuser mode with graphical login (default run level) |

    | 6 | Reboots the system |


    The current run level, together with the contents of the /etc/inittab file, control
    which processes init starts in Linux. In SUSE, run level 3 is used for text-mode
    login screens and 5 for the graphical login screen. You can change the default
    run level by editing a line in the /etc/inittab file.


    To check the current run level, type the following command in a terminal window:


    ```

    /sbin/runlevel

    ```'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Chapter 17: Look Ma, I''m a Sysadmin


    The runlevel command prints an output like this:


    N 5


    The first character of the output shows the previous run level (N means no run
    level), and the second character shows the current run level (5). In this case,
    the system started at run level 5.


    # Trying a new run levelnwith the init command


    To run a new run level, you don''t have to change the default run level in the
    /etc/inittab file. Type su - at a terminal window to become root, and then you
    can change the run level (and, consequently, the processes that run in Linux)
    by typing init followed by the run level.


    For example, to put the system in single-user mode, type the following:


    ```

    init 1

    ```


    If you have never seen the single-user mode, be prepared for a surprise. It looks
    very similar to a system reboot and there is no GUI. All you get is a text prompt
    where you can type Linux commands.


    If you want to run level 3 without changing the default run level in the /etc/inittab
    file, enter the following command at the shell prompt:


    ```

    init 3

    ```


    The system ends all current processes and enters run level 3. By default, the
    init command waits 20 seconds before stopping all current processes and starting
    the new processes for run level 3.


    To switch to run level 3 immediately, type the command init -t 3. The number after
    the -t option indicates the number of seconds init waits before changing the run
    level.


    You can also use the telinit command, which is a symbolic link (shortcut) if you
    make changes to the /etc/inittab file and want to reload its configuration file,
    use the command telinit q.


    To use the GUI desktop and any tools such YaST, which you use for system administration
    tasks, your SUSE Linux system must be at run level 5. If you switch to a single-user
    mode or run level 3, you can switch to run level 5 by typing init 5.


