- img_proc: true
  md: '# Chapter 17


    # # Look Ma, I’m a Sysadmin!


    # ## In This Chapter


    +   - Introducing the sysadmin role

    - Becoming root

    - Introducing the YaST Control Center

    - Starting and stopping services

    - Managing devices

    - Managing user accounts


    System administration, or sysadmin for short, refers to whatever has to be done
    to keep a computer system up and running; the system administrator (also called
    the sysadmin) is whoever is in charge of taking care of these tasks.


    If you''re running Linux at home or in a small office, you''re most likely the
    system administrator for your systems. Or maybe you''re the system administrator
    for a whole LAN full of Linux systems. No matter. In this chapter, I introduce
    you to basic system administration procedures and show you how to perform some
    common tasks. As you''ll see, you can perform most sysadmin tasks through a graphical
    tool called YaST. I also discuss some command lines that can be handy, for some
    reason, the GUI desktop does not start.


    # ## What Does a Sysadmin Do?


    So what are system administration tasks? My off-the-cuff reply is, “Anything you
    have to do to keep the system running well.” More accurately, though, a system
    administrator’s duties include the following:'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# 256 Part IV: Becoming a SUSE Wizard


    +   - Adding and removing user accounts. You have to add new user accounts and
    remove unnecessary user accounts. If a user forgets the password, you have to
    change the password.


    +   - Managing the printing system. You have to turn the print queue on or off,
    check the print queue''s status, and delete print jobs if necessary.


    +   - Installing, configuring, and upgrading the operating system and various
    utilities. You have to install or upgrade parts of the Linux operating system
    and other software that are part of the operating system.


    +   - Installing new software. You have to install software that comes in a package
    format such RPM. You may also have to download and unpack software that comes
    in source-code form — and then build executable programs from the source code.


    +   - Managing hardware. Sometimes, you have to add new hardware and install drivers
    so the devices work properly.


    +   - Making backups. You have to back up files, either in a Zip drive or on tape
    (if you have a tape drive).


    +   - Mounting and unmounting file systems. When you want to access the files
    on a CD-ROM, for example, you have to mount CD-ROM''s file system one of the directories
    in your Linux file system. You also have to mount floppy disks, in both Linux
    and DOS format.


    +   - Automating tasks. You have to schedule Linux tasks to take place automatically
    (at specific times) or periodically (at regular intervals).


    +   - Monitoring the system''s performance. You may want to keep an eye on system
    performance to see when the processor is spending most of its time, and to see
    the amount of free and used memory in the system.


    +   - Starting and shutting down the system. Although starting the system typically
    involves nothing more than powering up the PC, you have to take some care when
    you want to shut down your Linux system. Typically you can perform the shutdown
    operation by selecting a menu item from the login screen. Otherwise, use the shutdown
    command to stop all programs before turning off your PC''s switch.


    +   - Monitoring network status. If you have a network presence (whether a LAN,
    a DSL line, or cable modem connection), you may want to check the status of various
    network interfaces and make sure your network connection is up and running.


    +   - Setting up host and network security. You have to make sure that system
    files are protected and that your system can defend itself against attacks over
    the network.


