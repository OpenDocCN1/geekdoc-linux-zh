  md: '# Part II: Test Driving SUSE


    ![](img/6a2cbfe493abd0ba9453aa49df7301b4_133_0.png)


    Figure 7-2: You can connect a PC''s Ethernet card directly to the DSL modem.


    When you connect your Linux PC to the Internet using DSL, the connection is always
