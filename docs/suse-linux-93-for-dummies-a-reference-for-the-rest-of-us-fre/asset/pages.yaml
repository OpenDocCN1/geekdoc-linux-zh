  md: '# About the Author


    Naba Barkakati is an electrical engineer and a successful computer-book author
    who has experience in a wide variety of systems, ranging from MS-DOS and Windows
    to UNIX and Linux. He bought his first personal computer — an IBM PC-AT — in 1984
    after graduating with a PhD in electrical engineering from the University of Maryland
    at College Park. While pursuing a full-time career in engineering, Naba dreamed
    of writing software for the emerging PC software market. As luck would have it,
    instead of building a software empire like Microsoft, he ended up writing successful
    computer books. Currently, Naba is a Senior Level Technologist at the Center for
    Technology and Engineering in the U.S. Government Accountability Office (GAO).


    Over the past 16 years, Naba has written over 25 computer books on a number of
    topics, ranging from object-oriented programming with C++ to Linux. Naba has authored
    several best-selling titles, such as *The White Group''s Turbo C++ Bible, Object-Oriented
    Programming in C++, Window System Programming, Visual C++, Developer''s Guide,
    Borland C++ 4 Developer''s Guide, and Linux Secrets*. His books have been translated
    into many languages, including Spanish, French, Polish, Greek, Italian, Chinese,
    Japanese, and Korean. Naba''s most recent book is *Linux All-in-One Desk Reference
    For Dummies*, also published by Wiley Publishing, Inc.


    Naba lives in North Potomac, Maryland, with his wife Leha, and their children,
    Ivy, Emily, and Ashley.'
