  md: '# Analyzing the Network


    Every machine on a network may need some type of tweaking and tuning to make sure
    it is security-ready. Even the best systems can use a little work—nothing is perfect.


    Consider this example: A couple of years ago, I had an account with a Web-hosting
    provider that included a shell account, by which I could use ftp to upload my
    HTML files onto the server. I enjoyed the service and the account because I was
    using a Linux-based machine. I somehow gained access to the /directory, however
    I was surprised that I could do so, and I graciously returned to my /home directory,
    desiring to stay in good standing with the reward and feeling like I had just
    picked someone''s bedroom window. Several days later, nudged by curiosity, I attempted
    to try the same—I was now unable to access /bin, /sbin and /, as I had done previously.
    If I had been an intruder, I could have “owned” the server on my first visit.
    Obviously, at the time of my account startup, the permissions were not set correctly.
    I had signed up for service shortly after the server provider had gone online.


    The responses from tech support were almost nonexistent, which indicated that
    after my accidental break-in, no one was well able to watch and monitor administrative
    logs and resolve the permissions problem, thereby limiting my access to critical
    files. I can see this happening in a lot of places, particularly high-volume Web-hosting
    providers that allow thousand of shell accounts on their servers, missing vital
    configuration specs that could give root access to a supposed friendly account.


    How do you eliminate problems like these? How can you analyze your network and
    make it harder for someone to compromise it? Computers help to automate tasks,
    a good majority of people have been lulled to sleep, believing that their firewalls
    and automatic auditing tools make their networks impenetrable. Each new break
    proves them wrong. Why is there a continued lack of security?


    If you own a house, you have responsibilities such as landscaping, plumbing, and
    a handyman to do the work. The cost could be significant, but if you wanted the
    best for your home, you''d invest. Or you might be pretty good with tools and
    a good-sized toolbox and the right books so that when something breaks, you can
    fix it. If you are serious about security, you''ll do one of two things: use all
    the tools that come with SuSE Linux and stay briefed on security issues, or hire
    someone to do it. If neither choice is made, then your house is destined to be
    ruined in some way.


    # Using Other Methods


    If you have decided to take matters into your own hands, there are some pointers.
    First thing you should do is expose all the weak passwords on your system. SuSE
    comes with a program called John the Ripper, which is similar to the famous Crack
    program, although with a number of different features. To crack your password
    file, simply issue this command (as root or superuser):'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# Analyzing the Network 159


    john /etc/<password file name>


    I created bogus users on my system, with weak passwords, and ran John to deci-
    ppher passwords. The result is shown in the Figure 13.1.


    ![](img/ac9f79278455aa6727ea9b1a96629d3b_169_0.png)


    Figure 13.1

    "John" Password Cracking Utility.


    The first password was cracked in approximately 30 seconds. Good passwords work;
    weak ones don''t!


    SuSE includes another tool that is a preemptive password verifier. If you have
    a doubt concerning your password, utilize the program called vpass. If you use
    cracklib to qualify an okay password, or if it will return "ERRNO <reason>" and
    let you know whether the password is too short, all lowercase, or what not. This
    issue:

    echo <user name> | vpass -u


    This small program is worth its weight in gold. When admin have a moment during
    the day, checking a few users and emailing them to the situa- tion is called proactive
    security.


    Y next move will be to check for root compromise capability. Although SuSE sets
    the permissions in the post-install, you want to find out if there is any way
    that one on the side can obtain root access. You''ll need to pick up Tiger Research
    Assistant (TARA) for this. This is an upgrade to the TAMU tiger program, which
    is a set of scripts that will scan your system looking for security problems,
    espe- root access problems. This program is not included in the SuSE distribution,
    or you''ll have to download it from http:///home.arc.com/tara/index.html.


    After you have downloaded the tar, extract it into a secure directory, preferably
    not root. Run make and make install, and then run the program. You might never
    know what is open on your system unless you really look for it, and TARA will
    help identify potential threat areas. (See Figure 13.2.)'
