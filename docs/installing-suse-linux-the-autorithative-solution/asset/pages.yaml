  md: '# 16 Chapter 13: Securing the Network


    I hope that you''ll never have to use these URLs. In reality, however, anything
    can hap-pen.


    # Security Summary


    In this chapter, you learned that security is a mind-set, not a way of operation.
    Seal up all the holes in the house, from the inside, out. Set up your picket fence
    (firewall), and go around every now and then and rattle the doors and windows
    to make sure they''re shut. If you do not this faithfully, it''s like leaving
    a light on and the stereo playing in the den. If you don''t do your part, the
    burglars will do theirs.


    SuLinux is moving forward in the security realm and is providing more tools than
