    As you can see by the preceding text, the capability to control the network environment,
    window managers, and device configuration is at your fingertips in one scroll-down
    menu. Starting and stopping your mail server is a breeze; controlling keyboard
    for input is a snap. You don''t have to chase all over the system to find the
    correct configuration file edit. Choosing to use this utility will greatly impact
    your overall use of the Linux platform.


    SuSE system configuration management does not try to perform all tasks noninteractively.
    You will have to learn some of the inner workings of the system. Still, I have
    found no better system configurator in current distributions. In certain cases
    (using the F2 Show Info key), the comments will provide semetailed instructions
    on service and parameters. The Show Info selection is not available on every items;
    when possible, it will direct you to a more detailed source of information.


    Now that the “how” and “where” of system configuration, we will need to look at
    the “what.” What services will you run, and what features will offer your users?
    Let''s move on to an overall look at the “what” in network services.


    # Configuring Internet Services


    When configuring Internet services, the question is what services and functions
    you will run on your machine. For instance, your standalone machine is connected
    for a short time during the day, so there is no reason to use anything other than
    a modern and then configure the browser. Some people may have considered building
    a home network, and if so, you would need more than one machine connected to a
    single connection. Let''s start with addressing the Web browser configuration.


    # Web Browser Configuration


    A significant amount of time has passed since Linux has assumed center stage in
    the Internet drama. The increasing use of Internet requires more advanced technology
    than was available when Linux was created. SuSE Linux offers two choices in Web
    browsers: Lynx and the Netscape Communicator. Let''s take a look at their features.'
  merge: -1
