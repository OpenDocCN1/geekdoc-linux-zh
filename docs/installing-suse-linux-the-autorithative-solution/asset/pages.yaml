    The home directory is also a default input. If you can change the information
    in this field, it is a good idea to let the system do the job. The home directory
    is listed by the username /home/<username>.


    # DISK USAGE


    The use of /home directory space is something that you want to monitor closely.
    Users can consume a large home directory if they are working on big applications
    or adding software. If the /home directory is a single partition and you anticipate
    multiple users, implementing disk quotas will help conserve disk space. A good
    quota resource is http://homepage.cistron.nl/~mwv/quota.html.


    The field for log shell defaults to a bash shell, unless a different shell is
    requested. To access a list of available shell environments, press the F3 key.


    The password entry is marked by asterisks. If the two entries do not match, you
    will be prompted to re-enter the password. You are limited to 8 characters in
    the password. New users are added, and you should make sure that they use good
    passwords. A mix of numbers and letters (uppercase and lowercase) will help prevent
    an easy system breakin.


    The User Administration menu also enables you to give PPP dial privileges to users
    at time of setup. You can do this by checking the Access to Modem Permitted. As
    a side note, when you give this type of access to a user, that user will be added
    to the groups, updx, and dialout.


    The last available is used for a detailed description of the user. If any comments
    can be made to distinguish the user from others, or vital personal information
    to list, this is the place for it. The F4 key creates the user account after all
    pertinent information has been input.


    User Administration also enables you to prompt for a password change based on
    a specified date. In addition, you can warn the user of the password change date
    prior to the password expiration period. As an added feature, this means enables
    you to lock out the user if the password has not been changed within a reasonable
    time frame. To use this, select an existing user and press the F6 key. Figure
    8.3 shows the password maintenance menu.'
