    # Configuring the firewall program


    To run the SuSE firewall, you must make sure that the package called firewall
    is installed.


    The external network connection (firewall side) will require a FQDN that is recognized
    on the Internet. Your eth0 device (NIC card) is usually your external connection.
    You can use YaST1 to configure the eth0 device. You will need to invoke YaST;
    then choose the System Administration menu and choose Network Configuration, and
    use the Network Base Configuration submenu to input the outside IP address and
    the default gateway address.


    You''ll need to configure the second card, which is eth1. This card is your internal
    firewall device, a route to the outside world. Use the standard default gateway
    address that you input for the eth0 device. The firewall (packet filter) is now
    configured as a firewall/router.


    It''s time to configure the internal network. Unlike the external connection,
    the internal network does not require a FQDN. If you like, you can create your
    own internal network name.


    When configuring the IP addresses, you can use the reserved network numbers 192.168.1.2
    up to 192.168.1.254 (It''s doubtful that you would put 254 machines on one connection,
    though). You will use the internal network interface card address for your default
    gateway address.'
