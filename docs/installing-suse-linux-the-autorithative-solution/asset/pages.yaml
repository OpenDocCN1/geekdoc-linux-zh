  md: '# Troubleshooting SuSE Linux 181


    # Boot Loader Problems


    LILO (LINuxLoader) is a group of programs designed to move information to and
    from hard disk sectors. This information is kept in a configuration file whose
    sole purpose is to supply lilo with data to the boot sector. Remember that LILO
    does not perform any function at boot time. The mounts implied by the configuration
    file need to be effect only when the BIOS calls LILO, not at boot time. The default
    configuration file is /etc/lilo.conf.


    If LILO is not installed and configured properly, you could be stuck with a machine
    that will not boot up.


    Here are some of the reasons that LILO will not fully initialize:


    +   - L—Indicates that the BIOS loaded and started LILO. The second stage of the
    process is incapable of loading because /boot/boot.b is not found. This was caused
    by a physical problem with the disk or the disk parameters are incorrect (geometry).

    - LI—Indicates that the second stage of the boot process has been recognized (/boot/boot.b
    file located), but it might be incorrectly positioned (that is, the 1024 cylinder
    limit could be exceeded). This is also called when files are moved or renewed
    and LILO is not reinstalled.

    - LIL—Indicates that the second stage of the boot process started, but the descriptor
    table from the map file cannot be read. Out-of-parameter positioning of the boot
    file or a physical disk geometry exists.

    - L?—Indicates that the first and second stage of the boot have been recognized,
    but the address at which it is located is incorrect. Again, the problem is caused
    when the boot files are moved or renewed without reinstalling LILO, or it could
    be caused by a failed disk.

    - LI—Indicates the descriptor table in the map file could be corrupted, or files
    were moved or renewed without invoking the lilo command to restart the map file.


    If any of these happen to you, do not panic. The built-in rescue system on the
    SuSE Linux CD will help you. Restart your BIOS to boot to the CD-ROM. After Linux
    starts, go to the main menu and select Boot Installed. This rescue system provides
    a kernel image to boot up, and it allows you to get back into your system and
    make repairs if necessary. This rescue system will not save you from a boot/boot.b
    file located beyond the 1024 cylinder boundary, though. If you don''t have a bootable
    CD-ROM, then the boot disk will serve the same purpose. Additional detail on boot
    problems can be found at http://sdb.suse.de/sdb/en/html/keylist.htmlLILO.html
    and http://linux.com/support/newsitem.php?sid=82&aid=6316.'
