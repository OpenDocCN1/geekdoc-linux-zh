  md: '# Zip/Jaz drives


    Zip/Jaz drives are also supported in the SuSE Linux kernel. The primary purpose
    of these drives is to store data on a removable media. This is convenient when
    moving data from one area to another. To use these devices, you must recompile
    the kernel to add the support drivers. Recompiling the kernel is covered in Chapter
    9.


    # ORB Drive


    Another optical drive, the ORB drive, might also be worth taking a look at. This
    drive is available as an external (paraport) or internal drive. It utilizes magneto-resist
    (MR) technology, and its removable 2.2GB disks are infinitely rewritable, which
    might make it an alternative back-up drive solution. This is supported by the
    Linux kernel; for more details, point your browser to http://www.xtremetech.com.au/orb/orb.html
    or http://www.torque.net/parport/paride.html.


    Castlewood, the ORB drive manufacturer, can be reached at http://www.castlewood.com.


    # DVD Drive


    SuSE Linux 6.3 also supports DVD units. The current Web site for this is http://www.opendvd.org/linuxdvd.html.


    If you''re planning to utilize one of these units, obtain the kernel patch from
    this URL and follow the installation instructions.


    # Tapes Drive


    A tape drive is another necessary piece of hardware because it allows the consistent
    backup of critical data. Travan, Colorado, and quite a few other companies manufacture
    drives.


    Tape drives (including the Iomega 2GB and 5GB internal type) are supported in
    the kernel. The drives are not initialized in the generic kernel thus must be
    recompiled into the kernel.


    # Video Cards


    Video cards are one of the toughest support issues for the Linux community. For
    the maximum benefit in the GUI environment, video cards must perform at their
    best. Unfortunately, an impasse has always stood in the way of video card compatibility,
    and support from video card manufacturers is not forthcoming until recently. Not
    every manufacturer is releasing its source code, but those who see the Linux market
    as viable. Currently, SuSE has the up-to-date version of Xfree86 binary 3.3.5,
    which supports Intel i810 chipsets, ATI Rage 128 chipsets, and Savage3D and Savage4.
    SuSE offers another advantage, advanced video configuration tools that will help
    to identify unknown video parameters.'
