  md: '# 164 Chapter 13: Securing the Network


    The latest SAINT version, 1.5.BETA1, was released in early January 2000. If you
    want to stay on the leading edge of security, grab a copy from the previous URL.
    This version runs without a hitch in SuSE Linux.


    # Security Risks to Avoid


    The main idea in security is fire prevention rather than damage control. The best
    way to secure it is to limit the threats by laying down specific policies and
    procedures regarding network activity. Check and prune access levels, and run
    a tiger program to alert you of any internal changes. By the way, SuSE also comes
    with a package called seccheck, which is a tiger-type program. This program mails
    you daily, weekly, and monthly security notices. (Although I prefer TARA, which
    suits your needs.) Keep in mind that the Web contains information about how to
    gain root to UNIX/Linux systems, so take special care with internal users.


    The key to solving the social engineering compromise is to keep close tabs on
    usernames and change passwords frequently. Educate others so that the important
    information is not released without some type verification. Establish a policy
    and procedure for information exchange that is secure. If an account is terminated,
    delete the user and all associated files (not just the /home directory).


    Closing all unused ports and turning off services that are not required will help
    batten the hatches as well. SuSE Linux comes with a hardening script, called harden_suse.
    This script is interactive; you will be greeted with the screen shown in Figure
    13.6.


    ![](img/ac9f79278455aa6727ea9b1a96629d3b_174_0.png)


    Figure 13.6


    harden_suse system hardening script.'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# Analyzing the Network 165


    Take caution in the use of harden_suse because it can disable most of your services
    that are required for daily use.


    Run scheduled and unscheduled network security audits with the scanning and vulnerability
    tools. You will have a better outlook and more confidence if you have a part of
    your normal tasks.


    There are few other ways to monitor your system: One of these is to use SuSE’s
    temporary program, which logs temporary files that may be opened by an intruder
    during a compromise. You can do roughly the same thing as temp-watch by issuing
    command:


    ```

    lsof | less

    ```


    This displays all open files through the pager utility called less.


    # Reporting Security Issues


    How will you know when your system has been compromised? A daily examination of
    the logs is essential. If you don''t monitor the logs, intruders can have free
    reign. If the intruder is clever, the traces of activity might not be seen in
    a one-time incident. You, or whoever is in charge of security, should become acquainted
    with your system so that small changes in system operation will alert you. SuSE
    gives you the capability to decrease or increase your mail frequency. Go to YaST1,
    choose Configuration File, select MAIL, and then answer with All. This maps all
    the system logs to the specified user. You can also use logcheck or logwatch,
    which are available at http://www.


    You will need a point of contact (that may be you) and a game plan to recover
    from a compromise. It’s also a good thing to build a relationship with your local
    ISP in case you need tracking down an intruder. A host of resources on the Web
    will help prepare you for an attack or compromise. One good site is NetworkICE,
    located at http://www.81gm.org/


    # Resolving Security Compromises


    This could be the hardest issue to address in the security arena. When your network
    has been compromised, what do you do?


    The first thing that might come to mind is tracking who did it and where it came
    from, in some manner. Unless the cracker is careless or you have noticed his presence
    and allowed him to build a track record that will stand up in court.(Of course,
    that’s only an option if that person pens to be in the same country as you reside.)


    Recovering from a compromise is complex, and sometimes it’s impossible without
    salvaging files and sanitizing the system with a reinstall. If trojan programs
    have been deployed in your network and you are not sure what to do, call for help.
    An excellent coverage of root_compromise is detailed by the Department of Defense
    at http://www.mil/techtips/root_compromise.htm. Or, visit the FBI Computer Crimes
    Web page, at http://www.fbi.gov/nipc/compcompise.htm.'
