    vast range of subject material can be helpful in getting your system running properly.


    The Linux Weekly News site, http://l.linux.net, also brings the important Linux
    issues to the frontend. This site is a great resource when you are searching for
    current trends and subjects. This site also maintains interesting links that span
    the Linux world.


    Linux Today, at http://www.linuxtoday.com, is always jammed-packed with the latest
    Linux news. This site is sure to have everything for you, including recent Job
    opportunities, security posts, and weekly summary. You can have all the major
    posts and summaries sent to you (as I do), for convenience.


    The most visible (and most referenced) site is Slashdot, at http://slashdot.org.
