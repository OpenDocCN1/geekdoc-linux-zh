  pgno: 130
- img_proc: true
  md: '# Configuring Internet Services 121


    For more online help on Communicator, see http://help.netscape.com/. This Web
    will give you information on Netscape''s advanced configuration and assist with
    technical problems, although I doubt that you will have any.


    Individuals and companies that use Netscape as their browser of choice can upgrade
    their standard 56-bit encryption to 128-bit encryption by adding a package called
    forify. This enhancement increases the encryption to international "strong" encryption.
    This package can be obtained at http://www.fortify.net. If you are not sure what
    you need "strong" encryption, see the article at http://www.boran.com/security/sp/int_crypto.html.
    This can help define what you need this level of security.


    # Overview of Network Services


    In this section, you will see how to configure some of the common services that
    are included in the SuSE Linux distribution. These services include email server
    configuration, Samba, and IP-Managing setups, and this can be done with the YaST1
    utility.


    Configurations as sendmail will not contain a lot of information on how to generate
    the sendmail.cf file, but the necessary information required by YaST1 will get
    your email server serving.


    I will quickly cover the principles behind NFS and NIS; these subjects are extensive
    and beyond the scope of this installation test. The NFS/NIS overview is designed
    to give you insight into the reasons why (or why not) you might want to implement
    these services on your machine.


    Let''s start with the sendmail configuration.


    # Configuring Sendmail with YaST1


    Configuring sendmail with YaST1 is quick and simple. Without the YaST1 utility,
    generating a sendmail configuration file is extremely difficult for all the most
    seasoned administrators. SuSEConfig has two configurations available to assist
    you. You can use the TCP/IP protocol via Simple Mail Transfer Protocol (SMTP)
    or by UNIX-to-UNIX Copy Protocol (UUCP). The TCP/IP method is used often when
    mail is sent or delivered to a remote machine. UUCP is a better suited to deliver
    mail on local host server. Be mindful, that this will not work on a UNIX-to-Windows-based
    environment because the Samba package relies on the TCP/IP protocol to transfer
    its data. The following instructions outline the YaST1 parameters needed to get
    sendmail up and running for you.


    If did not set up the parameters for sendmail during the initial installation
    run, you can have SuSEConfig generate the sendmail configuration file by answering
    yes in the YaST1 selection field SENDMAIL_TYPE. If you elect to write your own
    configuration from scratch, answer no in this field.'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# 122 Chapter 10: Managing the Network Setup


    You will have to tell sendmail where the local mail should be stored, or who will
    be the recipient. Use the SENDMAIL_LOCALHOST option. If your local hostname is
    abc.xyz.com, for example, then input, localhost abc.xyz.com. If there are more
    recipients, add the other names separated by whitespace.


    If you handle traffic for incoming mail from the Internet to a common address,
    such as www.109.org, and if the host is named esther.109.org, then in SEND-MAIL_LOCALHOST
    put localhost www.109.org (without the quotes) in that field.


    If you''d like to send your mail under any name than appears on the mail header,
    use the option FROM_HEADER. You can change the name from esther.109.org to artur.109.org
    if you''d like.


    If the mail is not delivered locally, sendmail will require the DNS name so the
    mail can be delivered by SMTP. However, in general, SMTP mail servers are reliable,
    occasionally circumstances such as slow connections or high volumes of network
    traffic can cause them to fail. If this happens, your mail can''t get through.
    You can opt to use another SMTP mail host that can receive the mail and deliver
    it for you. The SENDMAIL_SMARTHOST option will work for that. You''ll need to
    input the name of the smart host in this manner, smtp:mail.xyz.net in the option
    field. This is a good idea for those who do not have a permanent connection to
    the Internet and who use their ISP''s SMTP server. If you have a UUCP connection
    and would like to use the smart host option, input ucp-queue: uucp.xyz.net in
    the option field.


    Depending on your connection, a DNS resolver may not be available. If this is
    the case, sendmail will look for a valid email address and exchange it for a fully
    qualified domain name (FQDN). If the DNS is not resolved, the mail will be undelivered.
    If you would like sendmail to ignore this DNS feature, and if you are sure that
    the mail address(s) is correct, you answer yes to the SENDMAIL_NOCANONIFY option.


    You can have sendmail started up the boot sequence, and the program has the capability
    to check mail at predetermined times, which you can set. The -bd argument for
    sendmail initializes the daemon and opens smtp port 25. If you have a fair amount
    of daily mail, you can have sendmail check the mail queue at specific intervals.
    The -q25 argument checks the mail queue, /var/spool/mqueue every 25 minutes. If
    you have a permanent connection, you may want to connect to the network and issue
    the command sendmail -q, which will send and retrieve all your current mail. If
    you like, you can place the command sendmail -q in the crontab and have the system
    check once a day. To modify the startup arguments, use the SENDMAIL_ARGS option.


    You should note that sendmail has a built-in tendency to send your mail immediately.
    This may not be possible for those who are mobile and who connect once or twice
    a day. If you set the SENDMAIL_EXPENSIVE option to few, the mail will wait for
    you to issue the command sendmail -q firing off any of your daily posts.'
