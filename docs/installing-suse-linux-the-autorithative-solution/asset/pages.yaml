    With Linux running on increasingly servers, the big question is how much is enough.
    Perhaps your application does not merit a RAID-1 system, requiring the ultimate
    in mirroring and fault tolerance. Multiple disks could be your solution because
    the ability to spread out your resources and protect them from damage or corruption
    is paramount. SuSE Linux configures multiple disks with no problem. Figure 3,3
