    # # Minicom Utility


    Minicom is a basic text-based modem control tool, and it has a terminal emulation
    that supports the vlt102 screen-type and keyboard emulation. It features upload
    and download capabilities and several different modem protocols. If you are familiar
    with setting up modems from a base configuration, Minicom configuration includes
    features such as serial ports, modem init strings, and chat scripts, which can
    supply authorization information. This is useful if you are connecting to a system
    that requires chap or pap-type password recognition.


    To invoke Minicom, issue this command:


    ```

    minicom -s

