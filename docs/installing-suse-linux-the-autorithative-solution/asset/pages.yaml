  md: '# Backing Up Files


    the rpmfind utility is another way to update your software. It, too, takes an
    inventory of installed packages, makes a connection to rpmfind.net (an rpm file
    repository), and updates your packages. To get it to work, just issue this command:


    ```

    rpmfind --latest <package name>

    ```


    The concept of the tool is excellent, yet functionality is limited. Rpmfind has
    no configuration file available to edit. This is a sore spot—having no capacity
    to change the update site location and how my updates are received (stored on
    the system) makes me unsure of this tool''s benefits.


    The proven tools such as xrpm and GNoOrpm are also available in this distribution.
    Both the GUI interface and ftp capabilities are critical. You can get more details
    on these tools by looking at /usr/doc/packages-<gnorpm>-<xrpm>.


    # Using Other Linux Sites


    As mentioned in the earlier section ''Getting Updates from SuSE.com,'' the source
    location of updates is critical. I also recommend you use wisdom when obtaining
    everyday software applications. If you are installing applications networkwide,
    you''ll obviously want to stick to proven applications. If you are into research
    and development, then you might need a test box. Here are some of the places I
    like to peruse for new applications:


    +   * http://freshmeat.net—The Freshmeat Web site, which contains new Linux applications

    * http://www.linuxnow.com/library.shtml——The LinuxNow File Library

    * http://www.linux.org/apps/index.html—The Linux Online Application Index

    * http://stommel.tamu.edu/~baum/linuxlist/linuxlist.html—The Linux Software Encyclopedia


    The list could go on for several more pages—these are just a few.


    # Backing Up Files


    In the course of updating your system, you will undoubtedly exercise caution.
    Be sure to select a secure ftp location and back up all critical files prior to
    the actual upgrade.


    SuSE Linux contains GNU software and also a time-limited software package.


    # Using Free Solutions


    The backup utility cpio copies with the SuSE Linux package. For details on specific
    commands to use, enter this command:


    ```

    man cpio

    ```


    Another Open Source backup utility, flexbackup, is also pretty good. You can obtain
    a copy at http://members.home.com/flexbackup/RPMS.'
