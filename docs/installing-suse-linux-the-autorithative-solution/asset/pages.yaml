  md: '# Dialup Networks


    Dialup networking is currently the most commonly used type of network connection.
    Homes and businesses rely on the telephone line and their modems to assure them
    of outside contact. Whether used to obtain e-commerce services or to shop on the
    Wide Wide Web, the dialup system is the most convenient and least expensive connection
    method.


    As with other methods, dialup networking (DUN) has benefits and detriments. Dialup
    machines are not (by function) suitable for tasks such as page serving and mail
    server applications. I liken DUN to living in mobile home. Your home is the same
    if you have to move to Arizona, New York, or Kansas—just the street address changes.
    The same principles are exhibited in DUN. Your computer remains the same, but
    every time you reconnect to your ISP, your address changes. On the other side
    of the coin, when you "own" connection until it is terminated. This type of networking
    might be good for small businesses that communicate on an office-to-office basis.
    The security is manageable, with 24x7 connections to monitor, and the IP address
    changes each time, making a break-in somewhat harder.


    The biggest hurdle that most newcomers had a few years ago was getting their modems
    configured and connected. It was no fun having a powerful new operating system
    and not having the capability to connect to the Internet. If you needed help,
    there was a good chance that you were forced to use another method to get online
    for additional assistance. In the early stages of development, dialup-type configuration
    programs were as dip attempted to help, but they all failed a little short. Fortunately,
    the Linux user base has continued to increase, applications to model configuration
    are being developed in short.


    SuSE has incorporated YaST1 an effective set of tools to get your DUN connection
    going. YaST1 has a menu option for modem selection, which assists you by accessing
    the wvdial program which offers you a chance to set up your modem. If you''ve
    waited until now to do so, don''t worry—YaST1 will give you a smooth interface
    to work with. (See Figure 7.2)


    # Wvdial Modem Configuration Tool


    The Wvdial utility is an excellent tool when it comes to getting your modem up
    and running. The Wvdial utility scans all the /dev/ttySx ports (except for the
    /dev/mouse symlink port); if a configurable modem is found, it tests the parameters
    and dumps the information into a file called /etc/wvdial.conf. Yes, YaST1 should
    do all these things invisibly, but in case you need to tweak or modify your settings,
    this is good information to know. Figure 7.3 shows the YaST1 Wvdial interface
    with the system information.'
