  md: '# 162 Chapter 13: Securing the Network


    the theory of verified authorization exchange. SuSE Linux configures ssh connection
    for you on the post-install.


    # Breaking into Your Own Network


    Breaking into your own network sounds strange, doesn''t it? Well, consider the
    fact that I get port-scanned at least once a week and that my firewall logs show
    two to three unauthorized connection attempts per night—somebody always checking
    to see if the doors are latched. Some choices must be: Will I wait for someone
    to find a hole in my security, or will I perform some advanced network diagnostics
    myself? I''d feel better finding the weak spots and correcting them than feeling
    violated by some unknown individual(s).


    The first thing you''ll need to do is "blueprint" your own network. Again, consider
    the analogy of a house: Blueprinting will indicate the doorways, roof, and internal
    structure of a building. Before you can effectively protect your system, you must
    know the overall picture. This can be accomplished with several tools, such as
    port-scanners and analyzing tool kits. SuSE Linux contains both types of programs.
    Although I can not fully explain or detail the functionality of these tools, I
    will attempt to briefly show the simplicity of use.


    # WARNING


    > The tools discussed here are for testing your own network integrity. They are
    highly advanced scanners and vulnerability checking programs. Never scan another
    network without receiving permission from the network administrator; port scanning
    is prelude to a possible break-in.


    # Port Scanner


    Port scanners are well-known tools of the network trade, so I will dispense with
    the basics and get right to the point.


    The port scanner included is one of the best on the Open Source market. nmap is
    a highly advanced port-scanning utility written by Fyodor who has recognition
    and awards in the computer industry. Its ease of use and versatility is nothing
    short of amazing. This tool can be used from the CLI and also has a couple graphical
    front ends. Alternatively, you can use the standard X-Window interface at http://128.196.109.24/nmap/dist/nmap-frontend-2.3BETA13-1.i386.rpm.


    You can use this to check all your open ports and close them accordingly. Services
    that run arbitrarily are doors waiting to be opened. Figure 13.4 shows the output
    from nmap on one of my local machines.


    I recommend using nmap to V 2.3BETA13, due to the cleaned-up code and end features.
    Download it from http://www.insecure.org/nmap/dist.


    The nmap Web site also has a wealth of information on nmap operations; see http://www.insecure.org.'
