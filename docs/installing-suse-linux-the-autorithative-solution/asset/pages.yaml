  md: '# CHAPTER 10


    # # Managing the Network Setup


    Network management can be relatively easy or extremely difficult, depending on
    the size and composition of the network. Management duties can range from a simple
    backup to integrating different types of operating systems into a common environment.
    The Linux platform lends its flexibility to numerous, blending into a Windows-type
    network as a Samba server, or handling routing and masquerading/firewalling assignments
    with ease.


    With the help of SuSE’s YaST, the management routine will not become burdensome.
    Whether you have 1 or 100 machines, YaST1 will help you keep the network in order.


    We will examine some of the outstanding network management tools that are built
    into YaST1. You will get a feel of how to control the system, and you will use
    some of the network monitoring tools that come with SuSE Linux 6.3. First, let’s
    look at system configuration.


    # NETWORK MAINTENANCE


    Starting, stopping and adding services on the network can be a challenge. If you
    are the sole user of the network, the task is easier—you will not have the tendency
    to interrupt your own work without keeping in mind your network management duties
    and the resulting loss of time.


    The case is different with a multiuser environment—taking the network down in
    the middle of the day is not a good idea. Schedule this type of activity either
    at the beginning of the day, when no users are present, or at the end of the day,
    when the majority of your users are finishing up their work.'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# 110 Chapter 10: Managing the Network Setup


    # Configuring the System with YaST1


    In any network environment, the ability to change parameters and add or delete
    services has its advantages. SU Linux is far above the rest in simplifying system
    configuration. System configuration is usually done by editing the files with
    your favorite editor, or by vi. This method requires you to have a firm grasp
    on a few things: the location(s) of the file to be changed, and the specific change
    that is necessary. Another factor involves whether you intend to enable a service
    by removing the comment (deleting the comment [#] in front of the related line).
    Still other examples include adding a parameter to a line (inserting information
    into an empty field, such as IPADDR="...", inserting the information in the quotes,
    for example IPADDR="197.113.101.77\).


    As you know, there is no standard for system and network configurations. Given
    the fact that distributions have different file locations and formats, the task
    can become daunting. SUSE has developed a simple, straightforward file configuration
    interface. The ASCII interface brings together a majority of the most commonly
    modified files and gives you information on specific change options. The Configuration
    File tool is not a cul-de-rough. Sometimes a file or files that you need to edit
    are not included in the configuration; in this case, you would have to change
    the file by using the standard editing method. This can happen in the configuration
    of the /etc/pcmia/network.opts file or the /etc/rc.config.d/firewall.rc.config
    script.


    The Configuration File of System Administration has more than 200 individual parameter
    fields allows changes to the system or the network operations. Figure 10.1 shows
    the YaST1 method to reach the configuration files.


    ![](img/ac9f79278455aa6727ea9b1a96629d3b_120_0.png)


    Figure 10.1

    Selecting YaST1 Change configuration file option.


    System Configuration is presented as a scroll-down type menu with individual explanations
    (if available) of the highlighted service or parameter field(s).'
