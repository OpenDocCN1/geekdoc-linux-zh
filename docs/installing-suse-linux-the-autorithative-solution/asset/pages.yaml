  md: '# CHAPTER 8


    # Managing Users and Groups with YaST


    YaST has proven itself a powerful tool to install software and perform configuration
    tasks on your SuSE Linux system. Now another unique element is about to become
    evident—its capability to manage users and groups on your Linux machine(s).

    If you are using your machine in a non-networked, isolated area that supports
    a single user and nothing else, some of the information contained in this chapter
    is moot. However, if you plan to support users as a file server, or if you anticipate
    ssh- or ftp-type connections to your machine, read on.


    System administration can be time consuming and tedious. The fact is that, without
    proper administration, your finely tuned SuSE Linux system can be wrought with
    chaos. With security concerns constantly arising in the news, monitoring your
    system is no longer a luxury, but a necessity. Although the focus of this book
    is directed toward installation, I would be remiss in my duty if I failed to shed
    more light on the subject of user administration. This is not to say that I will
    take for granted your prior knowledge of UNIX/Linux—instead, I will help clarify
    some of your standard parameters. This chapter briefly covers the user and group
    ID principles and the location of the related password files. It is important
    that you become familiar with the contents of these files as your user base grows.


    Supporting multiple users in small or large environments is simple for your Linux
    system. The basic control factor is the kernel. The kernel sees the user(s) as
    numbers, and each user is identified by a specific integer called a user ID, or
    uid for short. It''s easier for the kernel to read a number than a line of'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# 88 Chapter 8: Managing Users and Groups with YaST


    plain text; this enhances the system performance by decreasing the amount of CPU
    processing overhead. A standard (text-type) username is also assigned to the uid
    and is kept in a database of system users located in the /etc/passwd file. For
    security purposes, the system also generates an encrypted password and places
    it in the /etc/shadow file. The system must also assign a home directory and set
    up a working shell environment for the user, via the information in the file /etc/passwd.
    Figure 8.1 shows the contents of the /etc/passwd file.


    ![](img/ac9f79278455aa6727ea9b1a96629d3b_98_0.png)


    Figure 8.1 Unencrypted password file (/etc/passwd).


    If you are not already acquainted with /etc/passwd, I''ll break down the first
    line (username: root):

    root:x:0:0:root:/bin/bash


    The username is root, and x is a placeholder for the encrypted password contained
    in /etc/shadow. The first zero stands for the user ID, and the next zero represent
    the group to which root belongs. The /root indicates the home directory, and /bin/bash
    is the shell environment assigned to this user. As you can see, when the kernel
    is monitoring the root account, root is equivalent to 0 for user and group ID.
    Keep this in mind when setting up users—don’t use random numbering, and establish
    a consistent pattern for user/group assignments. This can help eliminate security
    problems.


    At one time, this was handled by individual commands invoked at the CLI. Commands
    such as useradd and userdel are still available from the CLI, but now YaST1 can
    handle these tasks.'
