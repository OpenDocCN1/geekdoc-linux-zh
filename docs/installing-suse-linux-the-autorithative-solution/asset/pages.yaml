    I once read about a thing that went like this: "Swap space is like a heated seat.
    It is not a great demand for it, but it comes in handy when you need it." The
    v2.2.13 kernel does not impose the 127MB swap partition limitations as the previous
    v2.0 kernels do, so the sky''s limit. Before you dedicate too much for swap, consider
    these factors: I have run up to 256MB of swap with no conceivable performance
    increases. For performance, you can locate your swap space on different disk(s).
    If one disk has faster seek times specs and a larger cache, use that for swap.
