  md: '# CHAPTER 9


    # Tailoring a Custom Kernel


    In the last year or so, Linux in general has made leaps and bounds that have resulted
    in new kernel versions that support more hardware than ever. SuSE has made available
    a number of precompiled kernels, on which the average system can run with no problem.
    Yet the fact still remains that Linux does not support all hardware components
    at this time. For example, the network card(s) in your machine are Tulip chip
    type. Even though the driver might support the Tulip chip family, driver version
    might not contain updated code, which will enable the card to work properly. You''re
    now faced with the proposition of 1) finding the correct Tulip driver and compiling
    individually, or 2) completely recompiling the kernel as a whole. Either way,
    there is work ahead.


    If you are setting up this SuSE machine for noncommercial use or as an evaluation
    platform, recompiling the kernel might be impractical. A test machine will rarely
    need to be fine-tuned—unless that''s the way you like it. If so, you might want
    to move on to the next chapter. Then again, if you plan to use it as a network
    firewall, an IP-Masquerading box, or some other exotic application, this chapter
    is for you.


    This chapter is not designed to minimize the complexity of the process, nor to
    make light of the possible consequences of a failed compile. My hope is to give
    you some tangible information to guide you through the tailoring process, if necessary.


    The generic kernel, which is built and included in SuSE, is designed to boot and
    recognize a broad range of hardware and peripherals. To accomplish this, features
    for different types of machines are taken into account and then assessed on a
    percentage of overall use. From the standpoint of distribution'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# 100 Chapter 9: Tailoring a Custom Kernel


    companies, this is a plus: The more machines the operating system will work on,
    the more customers will buy it. 9.1 offers an illustration of kernel image size—take
    a look at vmlinuz and vmlinuz1.


    ![](img/ac9f79278455aa6727ea9b1a96629d3b_110_0.png)


    # Figure 9.1


    Kernel image comparison—vmlinuz versus vmlinuz1.


    A 150KB difference between the generic kernel vmlinuz1 and the recompiled kernel
    vmlinuz shows how much additional code is contained in the generic kernel. When
    booting SuSE Linux, the time involved is not unusually long, but it does take
    a while. Unnecessarily probing hardware and loading unused drivers and modules
    also can lengthen startup time. Reducing the contents of the kernel by running
    only the required components frees up memory and use more system resources efficiently.


    The Linux kernel acts as an interface between your hardware and your program applications.
    It also performs memory management functions. Like a circus ringmaster, it is
    responsible for balancing the system resources and making sure that all processes
    get their share of CPU time.


    Some of the kernel''s primary functions are


    +   * Manages resources for running processes

    * Creates and destroys (kills) processes

    * Executes programs

    * Provides access to filesystems


    One benefit of running the Linux operating system is its capability to interface
    with different data structures by using the virtual filesystem (VFS). The VFS
    supplies a'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# The Benefits of Building Your Own Kernel 101


    layer by which the information passes between the kernel and filesystem modules.
    The versatility of the VFS is uncanny: It can support standard UNIX type filesystems
    as well as MS-DOS, UM-DOS, and vfat files, among others.


    Although these filesystem primitives seem rudimentary, they will give you an idea
    of why you might want to customize your kernel.


    The devices contained in the kernel recognize the device, access a portion of
    memory, and provide code to see that it operates correctly.


    The kernel supports networking protocols such as TCP/IP, UDP, and PPP protocols,
    to name a few. This allows Linux to effectively talk with different types of operating
    systems. Advanced networking features in the kernel include NFS and Network Address
    Translation (NAT) (IP Masquerading).


    Compiling a custom kernel will produce a kernel that will contain only the drivers
    and services that are required by a specific machine. If you like, you can build
    the kernel with all the required device drivers loaded during startup, This is
    called a monolithic kernel. To lighten the load the kernel will autoload the specific
    drivers, if necessary. This concept improves the overall performance and flexibility
    of the system. If a piece of hardware is removed, it will not be recognized during
    startup and thus will not be loaded.


    If network security is a concern, ensure that drivers and services that are not
    used are shut down or eliminated. Granted, not a lot of vulnerability problems
    at the kernel level poses a security risk, but some situations could arise. For
    details on this subject, point your browser to http://linuxtoday.com/stories/14671.html.


    # The Benefits of Building Your Own Kernel


    What are the benefits of building your own kernel? As an analogy, let''s use your
    automobile in an analogy. If the outside temperature were 25° F, would you run
    the air conditioning all the time? Probably not—it would be a waste of energy
    resources, and possibly would make you a bit uncomfortable. The engine (or, the
    air conditioning (the device drivers) is the accessory component. You do not want
    to remove the air conditioning unit from the car permanently, just deactivate
    the component when it''s not needed. Turning off unused accessories can help improve
    mileage and improve overall performance.


    One of my tasks after installing a Linux system is to download the latest kernel
    source and start from scratch. Taking this type of approach enables you to harness
    the power of SuSE Linux and delegate the use of resources from that. If you administer
    a multi-user system, customizing the kernel should take priority. Consider this:
    When the system is up and running, interrupting user(s) activities will be costly,
    and your desire to change features will be outweighed with its daily use. If you
    are planning to recompile the kernel, in an hour or so (maybe, if this is your
    first time) into your setup schedule.'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# 102 Chapter 9: Tailoring a Custom Kernel


    The simplicity of building a new kernel is refreshing. You can choose to use the
    basic text-based configuration utility or the menu type configuration tool. An
    X Window interface is easy to use, that''s your preference.


    The main reason I have become familiar with the issue of compiling kernels is
    based on need. I needed to get a piece of hardware running on my Linux, so I was
    faced with the proposal of keeping a useless piece of hardware or taking the challenge
    of customizing my kernel. I have found over the course of time, that this step
    has helped me more than I could imagined. If I lacked the ability, I might have
    erroneously thought that Linux was not as capable or flexible as the other operating
    systems. My laptop runs the development kernel 2.3.34, which gives me some capabilities
    (sometimes a surprise to other users) that have yet to be incorporated into the
    stable kernel tree. So, getting acquainted with the process will only enhance
    your future installs.


    # WARNING


    > Remember, the stable kernel version is 2.2. I do not recommend experimenting
    with the development kernel because these can be quite unstable. Development kernels
    are not guaranteed to successfully compile or to perform with your current hardware
    configuration.


    I have noticed on mailing lists the increased interest in kernel compiling, and
    I don''t believe this is coincidence. Once when you get a router, firewall, workstation,
    or computer that has dial-up capabilities in one box? You can connect multiple
    machines to the Internet from one dial-up account and then enable simple firewall
    rules to protect your LAN from intruders. The items that other operating system
    charge for are built right into the Linux kernel.


    There are plenty of other reasons to “roll your own” kernel, but those should
    be for starters–the complete list would take up whole page or two.


    # Performing the Building Process


    Whether you decide to include or exclude components in customizing your kernel,
    you will have to careful read all the kernel options before you start. I recommend
    accessing the Kernel-HOWTO for details, including questions that you are not addressed
    in this text. You can find HOWTO at /usr/doc/howto/en/html/Kernel-HOWTO.2.


    It is not feasible to cover every step of the kernel build process because there
    are factors that only you qualify or determine. Building the kernel should not
    be a rushed process. A general overview of commands which are used in the building
    process are outlined in the section “Tailoring the Kernel Components.".'
  merge: -1
