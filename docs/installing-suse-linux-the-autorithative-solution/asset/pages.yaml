- img_proc: true
  md: '# 132 Chapter 11: Sound for SuSE Linux


    sometimes posed configuration problems due to an internal setting that sometimes
    conflicts with another device. Fortunately, the isnapp tool attempts to find the
    PnP card and supply some configuration information. Later sections in this chapter
    review the use of this tool. Please see the section "The isnaptools Utility."


    Quite a few sound development projects are in the works. The two dominant projects
    are Open Sound System (OSS) and Advanced Linux Sound Architecture (ALSA). OSS/Free
    drivers are incorporated in the kernel, the ALSA also serves as prebuilt modules.
    I''ll give you an overview of each driver set.


    # Open Sound System (a.k.a. OSS)


    Hannu Savainen led the effort to develop sound drivers compatible with Linux.
    First called Voxware, the name changed to Ultra Sound System (USS). As driver
    development, Savainen joined the 4Front Technologies team, a company that markets
    a proprietary sound solution for the UNIX platform. Working full-time with 4Front,
    Savainen handed over the maintainer to Alan Cox. Cox was known for the ''ac''
    kernel patches, keeps quite busy in kernel development for sound drivers. More
    information concerning his progress can be found at http://www.4front-tech.com/ossfree/index.html.


    The kernel-supplied version of the OSS drivers is called OSS/Free, otherwise known
    as the Linux Sound System. The main site is located at http://www.linux.org/uk/OSS
    and contains valuable information on issues concerning setup and compatibility.


    4Front provides sound drivers for various UNIX/Linux applications. SuSE is kind
    enough to provide a demo copy of the Open Sound 3.9.2 drivers in the Pay section,
    under the heading opsdm. More information on Open Sound System can be found at
    http://www.opensound.com.


    One project, hosted by MIT, is called Csound. This effort is diverse and includes
    great tutorials and a mount of current documentation. The site is located at http://mitpress.mit.edu/e-books/csound/frontpage.html.


    There are other groups working on sound reproduction. Groups like the GNOME and
    Enlightenment teams at http://www.uk.gnome.org/white-papers/esd/ Their Their efforts
    have been ceaseless, and improvements continue on a daily basis. For more detail
    on the project, see http://www.gnome.org.


    # Using the Open Sound Drivers


    You can imagine the frustration of having a "working" sound card, installing SuSE
    Linux, and suddenly rendering the card inoperative. You have a couple choices:
    to purchase the commercial drivers available from 4Front, or to recompile the
    kernel and use the OSS/Free drivers. I must the OSS package easier to install
    and configure. The only tradeoff is that if you want to keep it, you must pay
    for it ($20), and you do not receive the source code.'
