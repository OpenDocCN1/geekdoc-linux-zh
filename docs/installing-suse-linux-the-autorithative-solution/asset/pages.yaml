- img_proc: true
  md: '# Configuring Internet Services 119


    Once configured, Lynx proves to be a strong Web browser application. For anyone
    who is concerned with text applications and reading documents online, Lynx is
    the ideal browser. Lynx supports some of the latest HTML technology (except for
    images), and you will have no trouble using links provided on Web pages. If you
    have a machine that is older, or that has less than 24–32MB of RAM, this browser
    will make life bearable. The loading time for HTML pages is decreased because
    Lynx looks only at the text.


    The University of Kansas is the best source of information available on new releases
    and user information. Your Web site is located at http://cc.ukans.edu/lynx_help/Lynx_users_guide.html.
    The current version of Lynx is 2.8.2


    One other site may prove useful in getting acquainted with Lynx. This site provides
    additional insight on quick configurations of Lynx: http://reality.sgi.com/raju/lynx.txt.


    # Netscape Web Browser


    The Netscape Web browser has been integrated-part of the Linux explosion because
    of its portability and cost (none). Netscape fits right with the rest of the software
    included in this distribution.


    Netscape is a fully configurable Web browser with a built-in mailer that supports
    POP, IMAP, and Memail protocols. You can set Netscape so that you can receive
    your postings to newsgroups. You can also use several features to ensure your
    daily Internet tasks.


    If you start Netscape and find that it seems to hang for a long time and gives
    you errors in Figure 10.3, you may have a network connection problem.


    ![](img/ac9f79278455aa6727ea9b1a96629d3b_129_0.png)


    **Figure 10.3**

    Recognizing Netscape errors.'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# 120 Chapter 10: Managing the Network Setup


    In the preceding figure, you see the comment “warning, the following hosts are
    unknown.” This is an indication that you may have left out an entry for resolv.conf
    (DNS nameserver). On the other hand, you may not be physically connected to the
    network or Internet. Check all your connections, and then look at the /etc/resolv.conf
    file (use the NAMESERVER option in the System Configuration utility). If no IP
    address is listed in the /etc/resolv.conf file, adding a nameserver IP address
    should solve your problem.


    The Netscape browser included in this can be configured the same way as in the
    previous versions. The toolbar selections (located at the top of the browser field)
    perform the same functions. Although this is a newer version, you should have
    no trouble finding your way around.


    One of the neat features of Netscape is the newsgroup feature. Who are currently
    subscribed to a mailing list will find that newsgroups is a simple task. For your
    benefit, a newsgroup client is integrated into the Netscape Navigator. Figure
    10.4 shows the newsgroup setup screen.


    ![](img/ac9f79278455aa6727ea9b1a96629d3b_130_0.png)


    Figure 10.4

    Setting up newsgroups in Netscape.


    Some of my favorite lists include alt.os.linux.suse, comp.os.linux.announce, and
    comp.os.linux.security. You can try these for starters; the SuSE list is interesting
    and is highly recommended for newcomers to SuSE because it discusses current distribution
    problems and resolutions. The list also provides information on future improvement
    to SuSE Linux.


    Additional information on other features in the Netscape Communicator would fill
    a good-size book. You can use the Help selection at the extreme upper-right corner
    of the browser. The information contained in Help will guide you in advanced configurations
    of the Netscape Communicator.'
