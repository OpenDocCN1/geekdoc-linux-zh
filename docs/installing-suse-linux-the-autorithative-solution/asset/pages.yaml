    Although menuconfig is the favorite interface, make xconfig is a better choice
    for first-timers. The main reason is that menuconfig format has sublections that
    can easily be missed and can result in bad building.


    When you are making your selections, keep in mind that what you choose is what
    you get. You might find a lot of neat deals in the selection, but should choose
    only the ones that are applicable to your present needs. Also, selecting a driver
    and inserting it into the running kernel will increase the overall size of the
    kernel—choosing modules is always a better method.


    You will have to apply some basics with any kernel rebuild. These are enumerated
    in Table 9.1.


