  md: '# 96 Chapter 8: Managing Users and Groups with YaST


    The printing system on SuSE Linux is based on apfilter and also contains some
    enhancements, SuSE''s apfilter recognizes all common file formats, including regular
    HTML files, if the package html2ps is installed. YaST enables you to configure
    PostScript, Desktop, and other printers by Ghostscript drivers; its also possible
    to set up HP GDI drivers, which include the HP DeskJet 710/720, 820, and 1000
    printers. This can be done by using the ppa package, which currently supports
    black-and-white printing only. YaST generates /etc/printcap entries for every
    printer (raw, ascii, auto, and color, if the printer is a color printer). YaST
    generates the appropriate spool directories and you can fine-tune settings with
    Ghostscript protocols, paper size, paper orientation, resolution, and printer
    escapes. A printer checklist is also available on the SuSE database at http://sdb.suse.de/sdb/en/html/drucker-howto.html.
    If you run into configuration problems, check this URL for more help.


    As an option to use YaST for printer configuration (just in case you cannot access
    YaST), you can use the apsfilter setup tool by lprsetup at the command line. This
    invokes the setup tool that is built into the apsfilter program. This setup tool
    gives you a nice user interface, as shown in Figure 8.8.


    ![](img/ac9f79278455aa6727ea9b1a96629d3b_106_0.png)


    # Figure 8.8


    The Apsfilter setup tool lprsetup.


    Currently YaST printer configuration doesn''t feature color laser printers. If
    you configure a mono printer, you will need to edit the /etc/printcap file. It
    is necessary to change mono to color everywhere in the printcap file. If you have
    problems printing after making these modifications, you might also have to rename
    the spool directory.


    # Configuring Remote Printers with YaST


    The line printer daemon (spool handler) lpd is normally invoked at boot time.
    When started, it attempts to query the parameters (settings) in the printcap file
    to find information on the current printers; and it prints any files left in the
    spool. This is helpful if the printer was accidentally turned off, or if an unexpected
    system shutdown'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# User Management Summary 97


    occurs. Then lpd uses two system calls, listen and accept, to receive requests
    to print files in the queue, to transfer files to the spooling area, to display
    the print queue, or to remove jobs from the queue. In these cases, lpd forwards
    the job to a child process to handle the request so that the parent process can
    continue to listen for more requests.


    One of the features of lpd is that it supports printing over the network to printers
    that are physically connected to a different machine. With the careful configuration
    of filter scripts(s), plus a few other utilities such as Samba, you can send prints
    transparently to all sorts of servers.


    Another component in the printing process is lpr, whose function is to control
    the printer spooler. It contacts lpd and injects a new job into the spool. As
    you can see, taking a few steps to complete


    You will find that YaST, it is also possible to set up different types of network
    printers. Some of the supported types of network connections are TCP/IP, Samba,
    or Novell NetWare protocols. Your SuSE Linux machine can be used for a number
    of different assignments; printing will direct you to some resources that I will
    help you know. One of the current Printing HOWTO, located at http://www.linuxdoc.org/HOWTO/Printing-HOWTO.html#toc1.
    The SuSE database also is an excellent resource at http://sdb.use.de/sdb_e/en/html/cep_basic_network.html,
    as is http://linux.integrity.hu/support-db/sdb_e/kgw_print_remote.html.


    ![](img/ac9f79278455aa6727ea9b1a96629d3b_107_0.png)


    For networked printers that must be fed from Ghostscript, you''ll need to uncomment
    the line REMOTE_PRPR="remote" in /etc/appfilterrc to get the printer to respond.
    Then invoke YaST and choose Configure Administration. Select Integrate Hardware
    into System, and choose Configure Printers. Then configure the base printer settings
    as required. You''ll also need to set up the remote printer queue under the Network
    Connections selection.


    YaST has a menu selection to administer Remote Printers, which enables you to
    configure printers that are connected by the TCP/IP protocol. The configuration
    includes information on the name of the printer, the spool directory, and the
    server name. The name of the printer is the name by which the local machine calls
    the printer (for example, remote). The spool directory is configured automatically
    with the name input in the appropriate field. The server name is the network IP
    address or the name of the print server. The printer entry is contained in the
    /etc/printcap file.


    You can also configure printers on a network supported by Samba, with the package
    samba. This connects a printer to a Windows-based network.


    Other options also exist, such as connecting printers on a Novell network and
    configuring printers on an ISDN network. The software packages must be installed
    to support each of these protocols.'
