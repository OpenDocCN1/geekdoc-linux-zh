    # Adding the Nameservers Addresses


    Be sure to get the correct address to the DNS servers for your ISP. You can obtain
    this information from the ISP''s support department. It is imperative that at
    least one IP address is added to the DNS servers input screen if you have more
    than one IP address (some ISPs will give you a primary and secondary address to
    input). Without this information in /etc/resolv.conf, you will not be able to
    access the network.


    # Adding a Network Interface


    If you are planning to set up multiple modules, as the Digibord or Stallion types
    of multimethod, you will need to set up different interface options for them.
    You can use the point-to-point (PPP) scheme and start with ppp/ppp1, and add more
    as required. You can do this with the YaSt1 utility via the Hardware Integration
    into System and Configure PPP Network selections.


    # Automatic Redial


    If you are familiar with Linux in general, you''ll know it contains a feature
    that will redial your ISP in case the connection is broken. That enhancement is
    built into the Wdvial program. This feature is useful if your ISP shuts off your
    connection after a certain period of time, or if your phone line is bad and you
    have a problem negotiating a clean connection. After configuring Wdvial, you can
    connect to your service by issuing this command while using the root or superuser
    account:


    ```

    wdvial &

    ```


    > If you invoke Wdvial from an xterm session or on the console, it will not automatically
    move into the background, i.e. your prompt will not return until the Wdvial program
    is terminated. If you would like to continue working, starting a different xterm
    or CLI session, issue this command when starting Wdvial:


    Wdvial utility will dial up in the background, and you can continue working. When
    necessary, return the program to the foreground and shut down the dialer with
    Ctrl+C. Then Wdvial will state, "Caught signal #2, exiting gracefully..."


    For additional information and updates concerning wdvial, you can consult the
    site at http://www.worldvisions.ca/wdvial/index.html.'
