    ISDN can use two types of interface technology, one of which is called terminal
    adapter (T/A). Essentially, this is just a fancy name for a modem that has digital
    capabilities. A T/A operates similar to a conventional modem, so getting up and
    running is a straightforward process. T/As are available in internal and external
    configurations. For full details on the ISDN T/As available, point your browser
    to http://alumnas.caltech.edu/~isdn/isdn_hw.html. This page contains information
    that may be vital to getting the right adapter, and it can help you configure
    the performance aspects.


    The other type of ISDN interface is a controller. ISDN controllers are designed
    to handle multiple ISDN connections in a LAN or VPN-type environment. These controllers
    can provide a vast amount of services. If you are connecting your system or business
    with ISDN, trying 3Com''s at http://www.3com.com/products/dsheets/400396.html.


    Current technology allows multiple connections at the controller. You can configure
    your system using Ethernet card(s) and hubs and also to have connections for your
    analog phone and fax machine, all from one ISDN line.


