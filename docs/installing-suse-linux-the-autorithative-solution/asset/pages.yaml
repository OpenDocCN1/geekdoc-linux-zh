    help you identify the configuration file(s) and some of the parameters to work
    with. You have received directions on how to start a service, or you have been
    guided to an information source that helps help to get network service configured.
    You also got an overview of some of the most widely used network filesystems and
    a brief look at the NIS protocol that helps network administrators provide their
    users with a transparent (seamless) work environment. The FTP client section was
    not actually a configuration issue, but it may represent a significant utility
    in the daily arsenal of tools. Finally, we presented some information on the firewall
