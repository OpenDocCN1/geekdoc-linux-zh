  md: '# CHAPTER 12


    # Keeping Your System Up to Date


    All who have spent a significant amount of time in the computer industry have
    run into the problem of outdated software applications. The story is the same
    everywhere, just the names are changed to protect the unyielding.


    A few years ago, I experienced a problem with a program that supplied warranty-coding
    numbers based on a specific ID. The operating system was UNIX (a good point),
    which utilized a proprietary software application (possibly a bad thing) that
    needed serious modifications to the warranty-coding program. Over a two-year span,
    I worked with the regional representative and talked with the company’s programming
    adviser, recreating the scenario in which the program failed to respond correctly.
    I was sympathetic and told me that the problem should be solved in the next version
    update. When the upgrade came, I waited with baited breath, hoping that the problems
    had been rectified. Low and behold, the update contained new coding options, but
    all the problematic codes remained in the system, adding insult to injury.


    This scenario will not be found in SuSE Linux. The programmers responsible for
    correcting the errors in the aforementioned program did not have their reputation
    on the line—they were concerned only the issue of dollars and cents. This is not
    meant to degrade them or their abilities, but it is intended to point out that
    the presence of outdated software is not a prevalent condition in the Open Source
    camp. For example, consider this next incident.'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# 140 Chapter 12: Keeping Your System Up to Date


    With everyone in a panic about Y2K, I felt reasonably sure that my Linux machines
    would no be affected by the arrival of the year 2000. Returning home at a little
    after 1 a.m., I found everything to be in order. I woke the next morning and started
    X and pulled up my favorite file manager, FileRunner. To my surprise, the file
    dates 1000 rather than 2000—yikes! I mumbled and groaned with my wife, "Check
    and see if they have a new version." Sure enough, the FileRunner Web page showed
    that the author had released an upgraded version that handled the datechange problem,
    three days prior to January 1. This Open Source program was free of charge, so
    the maintenance of the program is voluntary. The diligence to detail is evident
    of a different outlook on performance.


    # The Importance of Updating Your Software


    The issue of updating your software could extend to the factor of security. All
    Linux applications are not produced by the same individuals, so there may be small
    inconsistencies that can allow unusers (and authorized) privileges. There are
    teams of experts whose daily task is to find the flaws in Linux applications.
    One of these groups is the X-Force (http://xforce.iss.net.about.php3).


    For more information 역시, see Chapter 13, "Securing the Network.",


    If you have a single machine that is not connected to other computer(s) or the
    Internet, and all the applications operate properly for you, then updating the
    software might be moot for you. In most cases, SuSE Linux has been chosen to facilitate
    a network connection for one or more computers. In this case, updates are generally
    required.


    # Getting Updates from SuSE.com


    Where you get your updates is just as important as the upgrade process itself.
    If you cannot trust the source, the upgrade is not an upgrade. I recommend getting
    updated files from ftp.suse.com, to help ease some of the safety concerns. This
    ftp site is supported by SuSE, and the rpm software has MD5 checksum capabilities.


    The MD5 algorithm is intended for digital signature applications, in which a large
    file must be "compressed" in a secure manner before being encrypted with a private
    (secret) key to determine whether a file has been modified from its original state.
    With SuSE Linux, you have plenty of options: using the rpm package manager, compiling
    binaries, or building from source. As long as you are familiar with how your system
    is configured, you''ll have no problems.


    The whole debate about performing updates is this: How can I be sure that I have
    received the most current files? Some distributions have highly intelligent package
    management. In terms of interactive and flexible updating, I would not consider
    a SuSE system to be no. 1, although a strong 2 certainly is feasible. Again, the
    multifaceted YaST1 will be your interface. All you need to do is bring up the
    YaST1 menu and select First/Install Packages and then Install Packages. Figure
    12 shows the YaST1 menu selection.'
