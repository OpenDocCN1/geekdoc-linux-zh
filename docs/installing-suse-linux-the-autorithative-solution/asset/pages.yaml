    # Network Analyzer


    SAINT is a spin-off of the SATAN (for Security Administrator Tool for Analyzing
    Networks) network analyzing toolkit. Two security experts, Dan Farmer and Wietse
    Venema, developed this program to probe for weaknesses in each responding network
    system. The vulnerabilities uncovered then are reported to the security admin
    in an HTML format onscreen. (See Figure 13.5.)


    ![](img/ac9f79278455aa6727ea9b1a96629d3b_173_0.png)


    Figure 13.5


    SAINT utilizes all the features inherent in SATAN and enhances its capabilities
    by delegating the task to different modules contained in the toolkit. When you
    use this tool, make sure that you are not scanning another subnet. For a detailed
    tutorial, see http://www.wdsi.com.'
