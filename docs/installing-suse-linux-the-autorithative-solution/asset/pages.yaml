  md: '# Chapter 10: Managing the Network Setup


    # Lynx Web Browser


    On the average, most Linux distributions include several web browsers in their
    packages. SuSE is no different; one of the favorite browsers of veteran Linux
    users is Lynx. This browser is a text-based browser, which may appeal to the hard-core
    Linux users. The speed of this browser is phenomenal because it does not have
    to resolve graphical images. Although it''s a text-browser, it has configuration
    features that other web browsers don''t. The following list shows some of the
    options for Lynx.


    By pressing the O key, you can access the Lynx Options menu.


    +   - E—Show selected editor

    - D—Show the display variable

    - B—Access the bookmark file

    - F—Indicate ftp sort criteria

    - P—Input personal mail addresses

    - S—Selecting type

    - C—Choose character set

    - V—Show keys

    - *e—Show emacs keys

    - K—Use keypad as arrows

    - U—Access user mode

    - L—Show local links


    When you type Lynx at the command line, you can the Lynx Help screen.

    Figure 10.2 shows the Lynx Help page.


    ![](img/ac9f79278455aa6727ea9b1a96629d3b_128_0.png)


    Figure 10.2


    Getting help from Lynx.'
