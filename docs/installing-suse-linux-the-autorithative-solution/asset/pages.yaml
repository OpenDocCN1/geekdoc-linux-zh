    checks all passwords that are assigned through the cracklib library. This could
    help limit the use of weak passwords.


    When you''ve taken these measures, you will have a reasonably safe working environment.
    If you have more than one machine, you should perform these actions on all of
    them before going online.


    Showing another side of YaST''s incredible flexibility is the system administration
    menu selection for security settings. You might opt to use this tool when setting
    file permissions on a systemwide basis. (See Figure 13.3.)


    Other settings can be modified by using this menu as well. This tool may or not
    be what you need—that depends on how fine-grained you want permission settings.'
