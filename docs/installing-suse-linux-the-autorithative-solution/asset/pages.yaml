    # The isnapnputils Utility


    The ISA Plug-and-Play cards are supported if the resources be configured properly.
    The isnapnp tool is designed to do just: probe the card and verify the available
    resource settings. It consists of two elements: pnpdump and isnapnp.


    # The pnpdump Utility


    This tool probes the system for PnP-type cards and then produces an output that
    gives a count of the available card and their associated addresses. This might
    seem to be elementary information, but the manual configuration of a sound card
    can be tedious and time consuming. If you have a limited knowledge of the tool,
    it might not help you overall.


    The output of pnpdump is directed to a configuration file. This is done by issuing
    the command:


    ```

    pnpdump /etc/isapnp.conf

    ```


    After you run this command, verify its existence. In Figure 11.5 we see the typical
    dump output:


    ![](img/ac9f79278455aa6727ea9b1a96629d3b_146_0.png)


