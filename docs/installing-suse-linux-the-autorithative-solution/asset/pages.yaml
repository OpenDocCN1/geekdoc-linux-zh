  md: '# CHAPTER 11


    # Sound for SuSE Linux


    Sound—what a wonderful thing. The computing experience is enhanced to a certain
    extent by its presence, and the recent sound driver development has brought sound
    to more Linux boxes than ever.


    As a quick refresher, here’s why the drivers for sound cards have taken so long
    to incorporate into the distribution(s). Sound card initialization occurs on the
    kernel level. The drivers must be built into the kernel, or a loadable module
    must be supplied to activate the card. Because the Linux platform was designed
    as a UNIX clone and connectivity, and because filesystem flexibility was paramount,
    the sound drivers were not high on the priority list. Now that Linux has crested
    the mount of viability, new tasks—including sound—must be handled.


    The capability to interface with sound devices is no longer focused on playing
    CDs or providing sound effects on games. The issue of telephony has created a
    new frontier. Linux is a network operating system by design—what better way to
    take advantage of its natural capability and expand its reach further. Without
    the facilities to record and reproduce sound, Linux will not grow at a linear
    rate.


    The use of ISA for sound cards was predominant a few years ago. The trend recently
    has shown that the PCI-type cards are becoming the standard, and the ISA cards
    are destined to be phased out soon. The good thing about PCI-type cards lies in
    the fact that the computer automatically allocates the I/O and IRQ resources.


    The ISA cards that started out with a jumper-type setting evolved to ISA PnP-enabled
    cards. The Plug and “Pray” card'
  merge: -1
