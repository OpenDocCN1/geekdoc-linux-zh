  md: '# 34 Chapter 4: SuSE Software Package Installation


    integrated, in the interest of the quick installation solution. I hope to clear
    up some of the misceptions that have cropped up and dispel the hype about SuSE''s
    most effective tool, YaST.


    YaST is designed to extend the flexibility of the software package manager—it
    plays the "middleman" in processes and is a front-end user interface that automatically
    converts the CLI command to a selection-type menu. Installing and removing software
    becomes a breeze.


    Another cool feature in YaST is that it enables package dependency checking. This
    eliminates the task of going through the package selection and waiting for the
    install program to complain or accept your choices. I will show you other features
    as will make the package management more consistent.


    # YaST Package Handling Methodology


    SE Linux utilizes the Red Hat Package Management (RPM) system, which is used in
    the majority of current Linux distributions. The difference in the Elise distribution
    is YaST''s interaction with the package manager. Why is this so important? Let''s
    look at the big picture.


    In the past, installation of non-RPM packages required several steps, such as,
    /configure, /make, and /make install. Other packages identifying the target system
    with a command .rpm-use or by using scripts, /per1 config. Without examining the
    README file, you could possibly find yourself giving up and failing to install
    the software. The point is that because of the various methods and mechanisms
    of installation, it is not to always use rpm-type software. Using a common install
    protocol is expedient. SuSE Linux includes a tool for unpacking .tar.gz and .gz
    files also. I''ll cover its functions later in this chapter.


    With Linux moving into the mainstream of computing, first-time installations and
    sub-sequence package additions are inevitable. Finding an industry standard for
    package management helps newcomers and old hacks alike.


    It''s a known fact that package management differs in few cases, such as Debian
    Linux, whose package manager is called dpkg, and whose user select and apt. Likewise,
    Stampede Linux utilizes .slp packages, and Slack uses pkgtool to handle the .tgz-compressed
    file installation.


    On the other hand, Caldera, Red Hat, Turbo Linux, Mandrake, SuSE, and quite a
    few others use RPM. This makes RPM better than the others? No, but it gives you
    the ability to use some of same software used by one distribution on another.
    Thus, if multiple distributions use the same package-management system, the chances
    of finding an elusive software application decreases. People who maintain the
    system will be more confident in using a similar package management system'
  merge: -1
