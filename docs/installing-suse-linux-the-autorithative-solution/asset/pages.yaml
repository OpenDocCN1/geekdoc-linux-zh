    TARA is a good program for system administrators; you can add TARA to cron and
    have it run at a particular time and examine the logs in detail.


    Last but not least in order to secure your system, I recommend using Tripwire
    prior to going online. This tool compares properties of designated files and directories
    against stored in a previously generated database. The key to this utility is
    to keep the tripwire_database file on inaccessible media. This eliminates the
    possibility of tampering by crackers. To set up and run Tripwire, take a look
    at /usr/doc/packages/tripwire/README.FIRST.


    YaST1 will give you the option to check for weak passwords. In the system administration
