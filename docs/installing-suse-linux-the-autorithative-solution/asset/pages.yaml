  md: '# 150 Chapter 13: Securing the Network


    +   - IP-Masquerading, Firewall Solutions

    - Proxy Servers

    - Web-based commerce solutions (e-commerce)


    If you find yourself in any of these categories, you face a potential security
    risk. This chapter discusses the generalities of security and also shows how SuSE
    has provided an excellent security package in version 6.3. You will also learn
    about tools to use and programs that will monitor your system on a daily, weekly,
    and monthly basis.


    You can take this security issue with a grain of salt and assume that break-ins
    and compromises happen to someone else. You may may say, “I have nothing to offer
    a system cracker.” You will be surprised to find, however, that this very mentality
    is what those who breach insecure systems are looking for.


    # Vulnerabilities on the Internet


    The Internet, the Information Superhighway, is like the Autobahn in Europe. Few
    speed laws are enforced, and the limit of your thrill is based on the car you
    own and your driving skills and technique. It also reminds me of the highways
    in California—a seemingly endlessly piece of roadway that is inhabited by the
    meek and the unmercful.


    As a reminder, I want to recount an example of extreme vulnerability. You may
    have memories of this incident on November 2, 1988.


    A young man named Robert Morris Jr., a graduate student in computer science at
    Cornell University, used his talents to write an experimental, self-replicating,
    self-propagating program called a worm and unleashed it into the Internet. Morris
    discovered that the program was replicating and infecting machines at a rate faster
    than he had anticipated—a “glitch” in the program. In a short period of time,
    many machines at locations around the country either crashed or became “zombie”.
    Morris quickly realized what was happening and contacted a friend at Harvard University
    to discuss some type of solution. Eventually, they sent an anonymous message from
    Harvard over the network to kill the worm and prevent reinfection. Due to the
    effect of the worm, the network was clogged and these messages did not get through
    until it was too late. Computers were affected at many sites, including universities,
    military sites, and medical research facilities.


    The cost of dealing with the worm at network locations ranged from a few dollars
    to $40,000–$50,000.


    The worm exploited weaknesses in sendmail, the mail transport agent used by nearly
    every UNIX system on the Internet. This incident was proof that security is an
    issue to be taken lightly. The biggest problems in basic security audits are these:


    +   - System configuration problems (which inadvertently allow user access)

    - Unpatched software applications that allow unwanted or unintended user access


    Today’s business facts indicate that Internet connectivity may be pivotal to a
    company’s success. This yields the answer to at least one of the previous issues.
    Httpd and we'
