  md: '# Adding, Deleting, and Modifying User Accounts


    To add or delete a user from the system with YaST, you will have to access the
    System Administration menu and choose User Administration.


    These two function are assisted by the script /usr/sbin/useradd.local, which makes
    all the required entries to /etc/passwd and /etc/shadow, makes the home directory,
    and copies the files from /etc/skel. The script /usr/sbin/userdel.local deletes
    the entries from /etc/passwd and /etc/shadow, but leaves the /home/<username>
    directory.


    # Adding Users


    Adding users is a simple task with the YaST utility. The entry screen for user
    administration is shown in Figure 8.2.


    ![](img/ac9f79278455aa6727ea9b1a96629d3b_99_0.png)


    Figure 8.2


    User Administration menu gives you the ability to add new users to your system
    with ease. The input fields are set up in logical, concise order. The data entry
    is simple: You''ll note that usernames are supported for up to 8 characters. When
    adding a new user, the user ID field has a default numbering feature. SUSE suggests
    using numbers above 500 for new users because the system reserves numbers but
    for special purposes and processes that use pseudo-logins (such as nobody, master,
    and so on).


    > Administrators of large systems should maintain a running log of users. This
    should be done by hand and verified by signature. This will help when if it is
    necessary to perform a user audit. With this type of log, you can verify the date
    and the administrator that performed the task. You can also scan the database
    as a daily or weekly routine, checking for invalid usernames.'
