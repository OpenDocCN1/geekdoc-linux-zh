  md: '# Assessing the Platform


    The Linux kernel has made significant progress in the last two years. The problem
    of hardware detection and compatibility has been reduced, although not totally
    eliminated. SuSE Linux also is striving to stay on the cutting edge of Linux technology,
    so the current distribution contains one of the latest kernel versions, 2.2.13.
    This in and of itself should indicate that SuSE Linux is extremely serious about
    performance computing. In addition, all the latest device drivers are included,
    which means that typical installation problems are decreased.


    It''s given that Linux can take on many tasks. Making sure that you have the right
    platform to support those tasks is critical. Due to the rise in popularity, Linux
    boxes are used for the following, just to name a few:


    +   * Web servers

    * Routers

    * Mail servers

    * Print servers

    * IP masquerading boxes

    * Firewalls

    * Workstation applications


    Each of these environments requires certain resources. The SuSE Linux 6.3 distribution
    includes the v2.2 kernel, which supports symmetrical multiprocessing having the
    capability to distribute workload evenly among two or more CPUs. This version
    also contains software to support Beowulf Clustering, parallel virtual machines
    (PVMs), and other cutting-edge technology. Obviously, a good look at hardware
    is in order.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Chapter 1: Assessing the Platform


    # Hardware Component Requirements


    Linux has a reputation for being capable of running in a low hard disk space and
    in low memory environments. Recent improvements and a proven track record have
    upped the ante. Putting more applications and graphical interfaces in place requires
    more hard disk space allocations, thus requiring an appropriate increase in memory.
    The old 286 with 4MB of memory will not support a GUI environment.


    SuSE understands that, in addition to businesses, personal computing stands to
    gain greatly from the Linux explosion. For that, SuSE Linux is designed to run
    on standard Intel-PCs and all the subset possible-compatible clients. All PC hardware
    components are not created equal, of course; there is always the potential for
    a snag. As hardware manufacturers become more aware that Linux is not going to
    appear from the face of the computing scene, they will have a competing reason
    to provide more support for hardware such as video cards, sound cards, modems,
    and net-working gear.


    The GUI is gaining more influence in the Linux camp, largely because some users
    utilized a windowed-type graphical interface prior to coming Linux. Although the
    command line interface (CLI) remains the favorite among veteran Linux users, GUI
    tools and applications are developed in abundance. These programs are larger than
    their text-based equivalents, which can use more system resources. This, too,
    has had a significant effect on processor type and speed, hard disk space, and
    RAM memory.


    Following is a review of essential hardware components, their differences, technolog-ances,
    their functions, and their level of compatibility with SuSE Linux.


    For reference, I have separated the component groups and make note of hardware
    components that may (or may not) cause problems during your installation.


    # Processors


    Linux originally was written as an operating system that could utilize the features
    of the Intel 80386. As time went on, the use of IA-32 processors (including Intel’s
    80486, Pentium, PentiumPro, and Pentium II-III; Xenon; AMD’s 5x86, K5, K6, and
    K-2; and Cyrix’s 6x86 series) have posed little or no problem due to the backward
    compatibility and unique similarities between the processors.


    In Table 1.1, you will find a list of processors and their compatibility with
    SuSE Linux 6.3.


    | Table 1.1 Processors and Compatibility |

    | Processor Type | Name | Compatibility |

    | --- | --- | --- |

    | Intel Processors | | |

    | i80286 | 286 | No |

    | i80386SX | 386SX 386DX 486SLC | Yes |

    | i80486DX | 486DX 486SX 486DX2&4 | Yes |'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# # Hardware Component Requirements 3


    | Processor Type | Name | Compatibility |

    | --- | --- | --- |

    | Pentium | Pentium Pentium MMX | Yes |

    | Pentium | PentiumPro II Celeron PIII | Yes |


    # ### AMD Pentium Processors


    +   - Pentium K5 K6 K6-2

    - Pentium K6-3

    - Athlon K-7


    # ### Cyrix Processors


    +   - 6x86 Cyrix MX/MXII Yes, overheating problems and CPUid problems


    Intel has made a name for itself, and the market shows it. The new Pentium Xeon
    chips are extremely fast and UNIX/Linux-compatible. With clock speeds up to 733MHz
    and a 133MHz bus, the Pentium III is a real “smoker.”


    You will know from Table 1.1 that every Intel processor produced (except the 80286)
    is compatible with SuSE Linux 6.3. For high-end servers, which run multiple Intel
    processors (such as the Pentium Pro and Xeon processors), support the generic
    kernel. As Intel matures, SMP technology will also increase to help you stay on
    the bleeding edge of technology.


    More information on Intel processors can be found at http://www.intel.com.


    Advanced Micro Devices (AMD) has had an in for itself in the CPU production market
    by offering a less expensive processor. As you can see, 99% of AMD K-Series CPUs
    are compatible with SuSE Linux 6.3.


    Another AMD processor, the K5, is a “maybe” due to that, in certain cases, the
    FPU function is not up par with Intel. If you plan to run intense graphics and
    3D rendering, this may cause problems down the line. The entire K6 series presents
    no problem when it comes to compatibility. AMD''s new K7 Athlon processor is also
    compatible. For the budget-minded, this offers a great solution.


    For more information and details on the AMD processors point your browser to http://www.amd.com.


    Cyrix, another company that produces CPUs, with fifth-generation technology. Today''s
    computer market has a fair amount of these CPUs in circulation. Their offer is
    limited to the 6x86 series. The 6x86 chip has two configurations, the MI andt,
    the only difference being, the M chip contains an MMX type instruction set. The
    main complaint is that the CPU runs hot under constant load (with background processes,
    for example).


    SuSE Linux and Cyrix chips are generally compatible. If you happen to run into
    any problems, you can search for additional details at http://www.cyrix.com. In
    addition, you can find a Cyrix/6x86 HOW-TO on optimization at http://waug.erols.com/~balsa/linux/cyrix/p11.html.'
  merge: -1
