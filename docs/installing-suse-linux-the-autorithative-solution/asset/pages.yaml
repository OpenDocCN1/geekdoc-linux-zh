    # DHCP Configuration


    Dynamic Host Configuration Protocol (DHCP) is a network protocol that gives administrators
    control from a central point and automate the assignment of Internet Protocol
    (IP) addresses in an organization''s network.


    Using the Internet''s TCP/IP protocol, each machine that must connect to the Internet
    needs a unique IP address. You may have multiple computers; if computers moves
    to some other location in another part of the network, a new IP address must be
    entered. DHCP lets the network administrator supervise and assign IP addresses
    from a central point, and automatically sends a new IP address when a computer
    is plugged into a different part in the network.


    If you would like to start the DHCP server, use the START_DHCP option and answer
    **yes.**


    Due to the amount of variables involved in configuring the DHCP client, I advise
    you to look at http://sdb.suse.de/sbin/html/katlist.NETDHCP.html. This SuSE site
    provides more details than I can provide in this overview. In addition, the DHCP
    HOWTO is another great resource.


    # NFS File System (NFS)


    The Network File System is a client/server application that gives a computer user
    an opportunity to view and, in some cases, store and update file(s)on a remote
    computer as though they were on the user''s own computer.


    NFS is designed to support a UNIX/Linux filesystem. It also will support filesystems
    as MS-DOS.


    The need for distributed file resources and the element of filesystem security
    will determine the advantage or disadvantage of using this type of system. You
    may want to provide this type of service if a significant number of your users
    are remote from a central location during the day, and you would like to have
    access to the files.


    If you intend to run the NFS server, these parameters must exist: START_PORTMAP
    [yes]without the portmapper daemon running, rpc.mountd (mount) and rpc.nfsd (filesystem)
    will not start, and NFS will not operate.'
