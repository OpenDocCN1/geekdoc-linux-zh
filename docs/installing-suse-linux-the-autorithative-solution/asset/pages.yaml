  md: '# 56 Chapter 5: Booting into SuSE Linux for the First Time


    # Time Zone Configuration


    When configuring your time zone, the system presents a list of choices. Use the
    one that represents the zone in which you reside. Check http://setymclock.com/
    if you are unsure of your specific zone.


    You can choose whether to use local or Greenwich Mean Time. Greenwich Mean Time
    (GMT) is part of a standard Universal Coordinated Time (UTC), which is used to
    define a time that doesn''t depend on one''s location. This measure is used by
    scientists to avoid confusion of time zones. For instance, say that you are on
    the West Coast of the United States—you would subtract eight hours (seven during
    daylight saving time) from GMT to get local time. When it is 01:00 GMT, then''s
    5:00 p.m. in Seattle (PT), or 6:00 p.m. Pacific Daylight Time. If you decide to
    use GMT, you can configure your system to request the time from a global timeserver
    when you reboot (see Chapter 10, “Managing the Network Setup," for details). If
    you choose local time, the system relies on the CMOS clock setting for its values.


    # TCP/IP Network Configuration


    After configuring your time, SuSE gives you a simple, clear-cut network environment.
    Here you can input detailed information concerning your network environment. Settings
    include the following items:


    +   **Type of network**—Loopback (standalone), IP address is 127.0.0.1 or “Real
    Network” settings. If you select the “Real Network," the process requires additional
    information.

    **Hostname and domain name**—If this machine is to be used on the Internet and
    not part as a small private network, you will need a hostname for the computer
    and a fully qualified domain name (FQDN) to input here. The FQDN is the domain
    that has been set up by companies such as InterNIC—for example, xyxy.com. If this
    is a part of a private network that will in no way access the Internet (unless
    by IP-Masquerading), you can input any name you like for the host and domain—elvis.hasthebuilding.org
    will ever work.

    **Network interface**—You must select the type of network interface, (eth0, plip,
    arc0) that you are using. If you are connecting computers via parallel cables
    (plip), the selection IP Point to Partners will unmask to allow you to input the
    other machine''s IP address.

    **IP address**—This is the IP assigned to you by the InterNIC or your local ISP,
    cable company, or similar entity. You must enter the netmask and gateway addresses.
    If you have a Dynamic Host Configuration Protocol, the program will ask, “Confirm
    DHCP client (y/n),” and you will need the dhclient software installed. Chapter
    10 covers DHCP configuration.'
