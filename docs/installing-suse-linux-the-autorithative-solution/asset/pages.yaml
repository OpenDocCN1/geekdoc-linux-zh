  md: '# 90 Chapter 8: Managing Users and Groups with YaST


    depend on the system files when it comes to the task of qualifying valid users—
    they can be compromised. A written log is harder to forge, especially if the system
    administrator makes every entry. It also goes with saying that this type of log
    must be kept under lock and key.


    The group ID or name can be input manually; if you are not sure which group to
    assign to the user, press the F3 key for a list of available options. If you make
    no changes, the system places the new user in the users group. Keep in mind that
    several groups already are listed on the system. It’s a good idea to become familiar
