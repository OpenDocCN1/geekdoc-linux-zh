  md: '# CHAPTER 7


    # SuSE Communication Features


    Connectivity, con-nec-tive (k...nuk"t''v) adj. 1. Serving or tending to connect.
    —con-nec-tive n. 1. One that connects.


    This definition is what the Linux operating system represents: The connecting
    of individuals, whether in a small network scenario or in a huge wide area network,
    such as the Internet. Linux has connected more people in the last few months than
    it has in its previous years of existence. Companies, corporations, and even nations
    are taking a closer look at Linux. In addition, NASA is ordering nearly a thousand
    laptops to use in the space program, and the National Security Administration
    has contracted a private sector firm to design a bulletproof version of Linux.
    In a recent survey, more than 23% of all server applications were reportedly being
    run on some type of Linux system. As evidence, Internet service providers such
    as Hurricane Electric, a high-volume, self-service type of Web server company
    (http://www.he.net), uses Linux-powered servers.


    Linux is synonymous with large network connectivity. Just imagine: Without some
    type of network connection, this incredible operating system probably would have
    remained in the hands of only a few people. In the elementary stage of networking,
    serial and parallel port cables connected computers. Trends changed, though, and
    the telephone system became another vehicle to transport network data. Fiber optic
    technology introduced, and this helped create a huge computer network that stretched
    across state lines and country borders. The Information Superhighway, as it was
    coined, brought access to the world wherever a telephone line was capable of'
  merge: -1
  pgno: 83
- img_proc: true
  md: '# 74 Chapter 7: SuSE Communication Features


    connecting to a computer. The transfer of data over the telephone line created
    an interesting situation, however: the telephone system spoke a different language
    than the computer. The phone system and the computer needed a translator. Thus,
    the modem was invented.


    A modem is a device that converts data from one form into another, as from a form
    usable in data processing to another usable in tele-type transmissions. The computer
    produces digital signals that the modem translates to analog signals, which are
    then conveyed over the phone lines. This small device relies on the Point-to-Point
    Protocol (PPP), a method for communicating between two computers using a serialtype
    interface, typically a personal computer connected by phone line to a server.


    As an example, X Internet server provider might provide you with a PPP connection
    that the provider''s server can respond to your requests. The server then passes
    your requests to the Internet and, in turn, forwards your requested responses
    back to you. PPP uses the Internet protocol (IP), which is sometimes considered
    a member of the TCP/IP suite of protocols. Relative to the Open Systems Interconnection
    (OSI) model, PPP provides Layer 2 (link layer) service. It packages your packets
    and forwards them to the server, where they actually can be distributed via the
    Internet. This is a model of the basic dialup-type connection. The maximum connection
    speed is (at this point) about 56Kbps, depending on the phone connection and the
    line quality.


    Today computing has moved beyond the 4800 or 9600 baud modem methods that prevailed
    when I started using BBS services. My current connection is a high-speed modem
    that transfers information at least 600kbps. Telephone service providers can supply
    even 1.5Mbps on a standard telephone line. DSL technologies use untagged-only
    bandwidth over current telephone lines that at one time provided analog log service
    service alone. SDN, DSL, cable and even satellite connectivity solutions around
    well, and the advent of "wireless" LAN is upon. (Check out the Wireless LAN and
    Linux resource page at http://www.hpl.com/personal/Jean_Tourr1henes/Linux/) Every
    day, another form of network connection seems to be added to the list.


    How will the multitude of connection protocols protect your SuSE Linux system?
    Well, I have good news: The distribution will help you to connect and configure
    about any type of dialup or full-time network connection.


    Of course, how you connect to a network will be an important factor. In the past
    few years, modem connections have been used for a major portion of applications.
    Quite a few companies relied on this type of technology. Although it was a reliable
    form of communication, it was extremely time consuming. For example, two companies
    that I worked for used modem to upload and retrieve information from offices located
    out of state. Because of slow connection speeds, the network transaction took
    late at night or very early in the morning. The MIS department had opportunity
    to transfer files, and configure the system without interrupting the corporate
    work routine. By comparison, the modem speeds available today help companies transfer
    data and continue working throughout the day.'
  merge: -1
