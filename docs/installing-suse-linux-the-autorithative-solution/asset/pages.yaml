    # Problem Logging into SuSE Linux


    Your Linux system is now completely installed. You have taken care to follow all
    the screen prompts, but let''s say that you reboot your machine, the system does
    not respond as you hoped it would. The system might not boot, or if it does, the
    network connection fails. Worse yet, you might have forgotten to memorize the
    root password, and you''re stuck on the outside looking in.


    The focus of this section is to help you identify and resolve some common problems.
    The extent of which this section gives some quick overviews and mentions various
    resources that will help you resolve the problem.


    If you experience a problem logging out (booting your system), you can use SuSE''s
    built-in rescue system on the CD that contains this book. Possibly, your boot
    loader has failed; whether it is you are already familiar with the LinuxLoader
    or another type, the CD will get you up and running.


    To perform this operation, you need the boot disk or a bootable CD. Insert the
    boot disk (or CD 2), and select Start Installation/System. The program presents
    a subnu—main menu——choose Boot Installed System. Linuxrex then asks for the root
    partition (such as /dev/hda). Input the information, and press the Enter key.
    Linuxrex uses the kernel image on the disk or the CD to initialize the system.
    You will need only the root password to get back into the system and make adjustments
    or reinstall the LinuxLoader.


    # Lost or Forgotten Root Password Procedure


    Losing a root password is frustrating and consuming time. Unfortunately, SuSE
    has a rescue system that can help in the times you lose or forget the root password.


    Some Linux distributions have employed the Linux single feature, a command-line
    argument at boot to allow the user to initialize the system in single-user mode.
    This is a maintenance mode in which no password was required. SuSE Linux will
    boot up in the single-user mode, but it asks for the root password. This is where
    the rescue system comes in.'
