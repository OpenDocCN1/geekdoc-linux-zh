  md: '# APPENDIX B


    # # Troubleshooting SuSE Linux


    Under real-world conditions, things fail. Systems that are designed to work don''t.
    There is a good chance that your SuSE Linux installation has gone smoothly and
    you''ve run into no snags at all; I tip my hat to you and wish you the best on
    your continued Linux journey.


    On the other hand you may have a problem that has stalled your installation or
    some component on your machine will not configure properly. The information that
    follows is no means a “cure-all”; it is a brief discussion of possible problems
    that can arise during or after your installation.


    I have attempted to give you some “primer” information on troubleshooting and
    also various online references that may help you. I have found that no matter
    how big the problem is, if I stay calm and use logic, I can whittle the problem
    down to size. Persistence pays.


    # Large Hard Disks


    Large hard disks have posed a problem for some time, particularly because the
    1024 cylinder limit of the BIOS has hindered you a few people. Fortunately, some
    resolutions are on the horizon.


    If you have attempted an install and rebooted your machine only to find the boot
    process stopping at L, LI, or LIIL/LI-, remain calm. A few things can cause this.
    The simplest problem could be that /boot/boot.b file need to be moved; the worst
    problem could be a disk media failure.


    The 1024 cylinder limitation is a classic problem and with the ever-increasing
    number of large disks (+8.4GB) on the market,'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# 172 Appendix B: Troubleshooting SuSE Linux


    the need to address this type of problem grows on a daily basis. There is an article
    on LBA (Logical Addressing), which remaps your disk geometry to alleviate cylinder
    limitation problem. See http://freebsd.box.net/tutorials/multi-os/limits.html
    for details. LBA must be supported in your computers for BIOS to.


    As a solution to the 1024 cylinder, the LILO program has been enhanced. LILO version
    0.21.4.2 now supports “big disks.” The 1024-cylinder limit has been removed by
    a patch that uses the EDD bios extensions and supports up to 2TB disks. For more
    details on how this will solve your problems, http://www.freshmeat.net.


    # SCSI Hard Drives


    SCSI disks should not give you a problem, if they do, here are a couple ways out.
    With the upgraded linuxrc, it is no longer required to choose a kernel; the install
    program does it. If you are booting from a disk, you might want to follow this
    procedure in making the boot disk.


    Follow the steps in Chapter 2, “Installing SuSE Linux,” and create a standard
    SCSI boot disk. This SCSI image may not suit your needs, so find the correct image
    and use the following commands (from a DOS prompt):


    ```

    > dosutils\rewrite disk!scsi01 (standard image)

    > copy use\images\scisxx.ikr a:\linux

    ```


    This will create the primary SCSI image and then overwrite any additional information
    in the copy process. Remember that you must make the image first.


    Another problem could occur when installing on a system with a SCSI disk. If you
    have an Adaptec 2940 controller and the system hangs on boot (that is, it will
    not initialize ID0), it starts with no problem with the boot disk, the problem
    could lie in the controller BIOS. If your Adaptec controller has a BIOS version
    of 1.23, switch off the Sync-Negotiating feature of the controllers’ BIOS. Always
    check your final settings.


    # Zip and Jaz Drives


    Zip and Jaz drives utilize the parallel port (ppa) drivers in the kernel. As the
    driver is compiled and loaded properly, you should experience few problems. Do
    not try to use a Zip drive and printer at the same time. The Zip drive is recognized
    as /dev/sda (SCSI device), and the printer requires the Ip module to operate.
    If you plan to use a Zip or a Jaz drive in addition to a printer, you must have
    two available LPT ports. You also have to manage the module loading so that the
    ppa module loads prior to the Ip module. For more information on this, see http://suse.de/sdb/en/html/mantel_1.html.
    For the Jaz drive HOWTO, point your browser to http://www.linux.doc/HOWTO/Jaz-Drive-HOWTO.html.'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# Troubleshooting SuSE Linux 173


    # Video Cards


    Video cards have been and always be a rough issue. Until the video card manufacturers
    figure out that Linux is a viable solution, support will be slim.


    There are a few cards to watch out for—they may work, or they may not. The SIS
    6326, for one, has a few problems with the stepping feature during the graphic
    acceleration process. Frankly, SuSE has a remedy for it—point your browser to
    http://sdb.suse.de/sdb/en/html/cep_sis_6326.html.


    Also read through the text for information on how to edit your config file. If
    you''re unsure of the card you are using, you can always check the hardware database
    at http://cdb.suse.de/cdb_english.html to see if it is supported. The details
    on other card(s) problems refer to http://sdb.suse.de/sdb/en/html/unsupp_graphic.html.
    The information you find there is the most current that SuSE has online.


    # Sound Cards


    Sound cards represent a special problem because they are touchy and finicky when
    it comes to configuration. You can diagnose the hardware aspect of this problem
    with a few commands, which will let you know whether the system recognizes the
    card. Issue the following at the command line:


    ```

    dmesg | less

    ```


    This will enable you to examine the boot process and to verify that the card was
    recognized by the system. You can use the command


    ```

    tail /var/log/messages

    ```


    to get the same results.


    If you have verified that your card works (in Windows or DOS), be sure to properly
    document the running settings. Linux should use the same I/O ports and IRQ as
    when used in Windows or DOS.


    You can issue the following command to show the current available IRQs on the
    system:


    ```

    cat /proc/interrupts

    ```


    Check your sound card specs. This will help you establish whether the IRQ is being
    used by another device.


    Issue this command to show all the I/O port addresses:


    ```

    cat /proc/ioports

    ```


    This can also help you determine a conflict of resources problem. Make sure that
    you are referencing the sound card manufacturer''s information.'
  merge: -1
