    Multiple hard disk partitioning scheme.


    Notice how /home and /var are on a different disk. I also included /opt on the
    secondary disk. This filesystem can serve as a place to keep your database information
    and other things such as StarOffice. You might want to examine the setup and construct
    the best layout for your needs; for instance, it is effective for businesses on
    a tight budget that have no use for RAID arrays.


    For more information on how to partition your multidisk space, point your browser
    to http://www.double-barrel.be/linux_web/LDP/HOWTO/Multi-Disk-HOWTO.html.'
