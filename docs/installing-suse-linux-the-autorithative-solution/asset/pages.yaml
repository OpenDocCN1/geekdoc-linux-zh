    # NCftp FTP Client


    NCftp is an enhanced version of the FTP program. It automates many of the login
    steps necessary with FTP and adds its own special features.


    For example, when logging into a remote site, NCftp automatically sends the username
    and password for anonymous access to you. Most NCFTP commands are identical to
    the standard FTP commands. This means the same commands are used for moving files,
    changing directories, listing directory contents, and so on as you would use in
    the FTP program.


    NCftp has a neat feature that retains information on the last directory you accessed
    on a FTP site; the next time you log into that site, it will be placed back at
    that directory automatically. NCftp is a lifesaver if you download a lot of files.


    The official NCftp site is located at http://www.ncftp.com. More information,
    such as the FAQ on NCftp, is available at http://www.ncftp.com/ncftpd/doc/faq/.


    # Wget FTP Client


    The wget utility is a network utility for retrieving files from the Internet using
    HTTP and FTP. This tool has many features to retrieve large files or mirroring
    the entire Web or FTP sites easily.


    The wget is flexible in nature and performs a vast array of tasks. To get more
    insight on how wget can help you, see http://www.lns.cornell.edu/public/COMP/info/wget/wget_toc.html.
    This site contains information on daily use and client configuration.


