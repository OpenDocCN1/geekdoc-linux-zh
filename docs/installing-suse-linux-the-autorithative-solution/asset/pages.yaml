  md: '# 18 Chapter 2: Installing SuSE Linux


    # Network Installation (FTP)


    SuSE Linux also can be installed by means of the FTP method. I wouldn''t suggest
    this unless you have a high-speed network connection, such as DSL, ISDN, T1, or
    cable access, however. Using FTP on a PPP dial causes you and your ISP some problems
    unless your ISP is really generous. As an example, I received a few warnings about
    excess connection times from my ISP. It didn''t matter to them, even after I told
    them I was downloading a complete Linux distribution. Then again, I always think
    that everyone knows Linux.


    This method is similar to the NFS install: Load your kernel modules, continue
    with the install, and choose Network (FTP) as your source media. You would need
    to obtain the address to the FTP server of your choice. The SuSE Linux FTP program
    uses anonymous login features and username protocols.


    Copy the required directories (as stated earlier), and begin your local install.


    # Hard Disk Installations


    In the past, Linux support for all hardware was spotty—and others did not. The
    hard disk install was born out of necessity because SCSI drivers were still in
    the early stages, and some proprietary CD-ROMs were useless. Now, driver support
    for Linux is ready. As products are made, the support is there:


    Your choice for hard disk install may rest on the following factors:


    +   1. You have a large disk with room on it, with a sizable DOS partition to
    spare, and decide to copy SuSE to it.

    2. You have a few machines on which you would like to run Linux, and you have
    no network connection and no CD-ROM units installed on them. Note: Format disks
    as DOS partitions.


    In this case, you would start by creating the appropriate directories for the
    base system using the mkdir command from the C:\ prompt. The directories required
    are as:


    ```

    dump

    dump\suse

    dump\suse\a1

    dump\suse\images

    dump\suse\setup

    ```


    Be sure to copy your initdisk.gz and the correct kernel for your system. Copy
    those to the \dump\suse\images directory.


    Copy the CD-ROM file \suse\setup-inst-img and \suse\setup\loadlin.exe to \dump\suse\setup.'
