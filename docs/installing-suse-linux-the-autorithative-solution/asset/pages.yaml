    # ISDN Interface Setup


    Integrated Digital Network (ISDN) is a highly touted method of networking the
    DSL and cable revolution hit. The ISDN technology utilized dialup type access
    and per-minute and per-charge miles. This type of high-speed network connection
    was not economical for the average household or small business, though.


    Thus, ISDN''s tenure as the ideal type of connection was short-lived when BISDN
    quickly on the scene. BISDN is a concept and also a set of services that have
    developed standards for integrating digital transmission services in a broadband
    network of optic and radio media. BISDN is used in conjunction with ATM technology
    and Frame Relay services for high-speed data that can be sent in large bursts.
    The BSDN (and ATM) communication layer is set on top of SONET (Synchronous Optical
    Network), which helps provide the high-speed characteristics. BISDN supports transfers
    from 2Mbps and up. This is a great service, but it will take some technical changes
    to be implemented. The components to support ATM technology and'
