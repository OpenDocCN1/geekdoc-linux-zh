  md: '# 106 Chapter 9: Tailoring a Custom Kernel


    Choose Save and Exit to save your current selections.


    Issue the command make dep to ensure that all dependencies have been met—this
    should run pretty quickly.


    The next commands can be issued as a set, which will allow you to get up and stretch
    and grab a cup of coffee. If you prefer, however, you can issue them one at a
    time. I will list them individually for:


    +   * make bImage—Compiles the kernel image bImage

    * make modules—Creates driver modules

    * make modules_install—Installs modules in /lib/modules

    * make depmod—Searches for modules in all directories specified in the configuration
    /etc/modules.conf.


    The optional command to automate this procedure is as follows:


    make bImage modules modules_install


    The make command will perform each of the listed commands in succession. If you
    have a Pentium processor machine, this process will take approximately one hour
    or less.


    ![](img/ac9f79278455aa6727ea9b1a96629d3b_116_0.png)


    > To take full advantage of the optional command set, include the command make
    bzImage. This will convert the bzimage, the compiler made, vmlinuz. The System.map
    file and vmlinuz will be copied to the (/root) directory, and this command will
    also need LILO automatically. You will need to link /boot/vmlinuz and /boot/System.map
    to the root directory for this to work. (See Figure 9.4.)


    You''ll need to copy the System.map file from /usr/src/linux/arch/i386/ and the
    bzimage file from /usr/. The make make command offers a better way of handling
    things. You can choose not to link the /boot directory, and then you can manually
    copy the files to /boot.


    As friendly reminder, always run the lilo command after installing a new kernel.


    ![](img/ac9f79278455aa6727ea9b1a96629d3b_116_1.png)


    > Though not as popular as the past, there may be a few users who have overclocked
    processor system. You should not compile a kernel on an overclocked system. It
    will create bugs in the kernel and possibly cause your system to crash. Compile
    the kernel while running the processor at normal speed, install the new kernel
    and over-clock the system.


    If you use a laptop, you will have bit more work in front of you. The stable kernel
    does not come with PCMIA support included, so you will have to grab the current
    source package at ftp://sourceforge.org/pcmcia.'
