  md: '# 4 Chapter 1: Assessing the Platform


    When choosing a processor, keep a few things in mind. For starters, the minimum
    processor is a 386sx, which supports the minimum text mode system. If you plan
    to use the full features of SuSE, a Pentium machine with a processor speed of
    133Mhz or provides a good ballpark figure to see performance. This doesn''t rule
    out P75 box or 486dx 50MHz machine that has been lying around the garage: I''m
    the first to use an old box. If you''re looking for high-performance computing,
    however, you''re going to need some horsepower behind it.


    # Hard Disks


    Data storage needs have increased in the past five years. The disk that you may
    vary, from SCSI Raid in your big server to (E)IDE hard disk in your workstations,
    among a hundred other possibilities. Table 1.2 lists some of the hard disks types
    and their compatibility with Linux.


    | Table 1.2 supported Hard Disks |

    | Manufacturer | Types | Compatibility |

    | Conner | SCSI/-2 F/W IDE-AT | Conner 1060S have trouble with extfs2 and Linux
    |

    | DEC | SCSI/-2Fast F/W | Yes |

    | Fujitsu | SCSI/-2fast IDE-AT | Yes |

    | H-P | SCSI/-2Fast | Yes |

    | IBM | SCSI/-2 F/W IDE-AT | Yes |

    | Maxtor | SCSI IDE-EIDE-UDMA | Certain disks have problems with Adaptec BusLogic
    |

    | Microlis | SCSI/-2Fast D/WIF IDE-AT | Yes |

    | Quantum | SCSI/Ultra SCSI/-2Fast F/W IDE-AT Ultra IDE | Yes |

    | Seagate | SCSI/ULTRA SCSI/-2Fast F/W IDE-AT EIDE-UMDA33/66 | Yes |

    | Sony | SCSI | |

    | Toshiba | SCSI IDE-AT NOTEBK-IDE | Yes |

    | Western Digital | SCSI/UTWIDE IDE-AT | May have a problem if a different manufacturer''s
    disk is using the same IDE cable


    > NOTE

    If you are using a UDMA66 disk, make sure that your current motherboard allows
    the increased transfer rates. BX chipset allegedly supports UDMA, but this may
    not hold true for all BX chipset boards. For more information on UDMA66, point
    your browser to http://www.abit.com.tw/english/product.


    Virtually every hard disk available on the market can be used with SuSE Linux.
    A few disks are not compatible, however; you can find this information at http://www.linuxdoc.org/HOWTO/Hardware-HOTWO-14.html#ss14.1.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Hardware Component Requirements 5


    Hard disks of more than 8 gigabytes (GB) may require additional set information,
    which can be accessed at http://www.linuxdoc.org/HOWTO/mini/Large-Disk.html. This
    site will give you information on how to resolve some of the problems associated
    with large hard disks.


    With SuSE Linux, you will need at least 300MB of hard disk space available to
    install the system. A full install (with all the bells and whistles, plus the
    kitchen sink) will require 4GB of disk space. The default installation takes up
    750MB of hard disk space. Make sure you have enough room.


    # Memory


    RAM memory has been a sort spot for every computer user. The more RAM, the faster
    the system responds.


    SuSE Linux is compatible with all types of memory, including Error Correcting
    Code (ECC) memory for servers, Extended Data Output (EDO) memory, Fast Page Mode
    (FPM) memory, and the PC100 and PC133 memory that is now available for the PIII
    Xeon CPU applications. The kernel presently supports (after recompiling) up to
    2GB of physical memory, and developments in this area are steady; the kernel version
    2.4 will handle even more.


    Sufficient physical memory will give you a tremendous advantage. The GUI environment
    available in SuSE Linux requires at least 16MB of memory and 32MB for good performance.
    Again, more is better.


    Memory also plays an important part in the SuSE Linux install. Yes, Linux utilizes
    swap space, but don''t think that a large swap space will make for RAM. If I have
    an older P75 machine with 8MB of memory, and SuSE Linux will not install on this
    machine without activating swap space. The data is swapped between the CPU and
    the disk. On the other hand, I can effortlessly install, run, and multitask with
    my 350MHz AMD K-2 3D-Notebook with 96MB of RAM. I do 70% of my work on my mobile
    warrior, so if it is of the essence and speed is a necessity, a good amount of
    RAM is not a luxury. If you intend to use SuSE Linux in a business environment,
    budget for a large helping of RAM.


    # CD-ROM and Peripherals


    The CD-ROM (Read Only Memory) might be your primary method of installation. The
    pressing question is, Linux will recognize your CD-ROM?


    If you are installing SuSE Linux with either an ATAPI or a SCSI interface, you''ll
    have no problems. The EIDE driver supports the ATAPI drives, and support for the
    Adaptec SCSI Hostadapter ait7xxx is included in the generic kernel.


    # Network Interface Cards


    Network interface cards (NICs) are essential because they provide the capability
    to connect computers by way of an internal network (intranet) or through the use
    of a wide area network, such as the Internet.'
  merge: -1
