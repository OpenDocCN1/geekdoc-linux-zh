  md: '# Dialup Networks 81


    # # Cable Modem Setup


    Cable Internet has taken the industry by storm. Although it competes with high-profile
    telephone companies, it has drawn a substantial following. What better than to
    Have access and cable TV at the same time? The bandwidth implications are real,
    but unless you are in need of a dedicated T1 line or require connectivity for
    a VPN that carries a large amount of secure traffic, cable connectivity may be
    just the ticket. If you''re presently using cable, you already know the benefits.
    You have the advantage of high-speed data transfers and no dial-up connection
    problems to deal with, you are always online, ready to go. There is one element
    of cable I still query about, though the shared bandwidth function. In Figure
    7.5, NetWatch shows your surrounding traffic.


    ![](img/ac9f79278455aa6727ea9b1a96629d3b_91_0.png)


    # Figure 7.5


    Viewing network traffic on a cable TV internet connection.


    Most cable Internet providers do not support Linux as a viable platform, although
    this only due to the fact that their staff might not have the skills to help the
    growing Linux community. During my installation, I installed my laptop and configured
    it to boot Windows. The whole thing went smoothly—I had a fast Windows machine,
    so I proceeded to set up Linux on my gateway box.


    Most cable modem installations require a network interface card, which connects
    to the cable modem itself. Most cable modems have a built-in self-configuring
    feature, for this reason: You are residing on a common network, so the responsibility
    of IP address allocation is up to the cable modem''s network. Therefore, the cable
