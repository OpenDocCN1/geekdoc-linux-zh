  md: '# 104 Chapter 9: Tailoring a Custom Kernel


    You will need to clean up your kernel tree and old config files so that nothing
    conflicts. Issue this command in the /usr/src/linux directory:


    ```

    mrproper

    ```


    This will do a thorough cleaning of leftover config and object files. Now go back
    to the directory that contains the patch and issue this command to patch the kernel
    source:


    ```

    gzip -dc patch-2.2.xx.gz | patch -p0

    ```


    If you are patching with the ac or pre-patch, you will need to rename the linux
    directory.. Some pre-patches will not install unless the renamed directory looks
    like this:

    /usr/src/linux.14p9


    This would patch version 2.12.13 with pre-patch-2.12.14-9.gz. So, if your patch
    fails, look at the debug commands at the beginning of the process. These comments
    will indicate which directory the patch file is looking to patch. Rename the linux
    directory accordingly, and then patching is done.


    # Tailoring the Kernel Components


    To the process started, you will have to become familiar with a few commands:


    +   - make config—When invoked, this make command uses a text-based interface
    and allows kernel option selections.

    - menuconfig—This command works the same as the make config command, except that
    the interface is a menu-type, semigraphical interface. (See Figure 9.2).


    ![](img/ac9f79278455aa6727ea9b1a96629d3b_114_0.png)


    Figure 9.2

    Menuconfig Selection Screen.'
