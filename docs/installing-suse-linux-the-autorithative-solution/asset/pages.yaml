    # Figure 2.1


    Installation step sequence.


    Linux is a program designed to load all drivers required for installation. YaST2
    utilizes the Linux2 program for its auto hardware detection and configuration
    tasks. SuSE also comes with a new boot procedure, which is more beneficial in
    the area of SCSI detection and module loading. The EJIDE user will see very few
    changes in the process. The new boot concept is as follows:


    +   - LILO (no real difference).

    - LILO, assisted by the BIOS, loads initrd into memory space.

    - LILO, assisted by the BIOS, loads kernel (Ramdisk) into memory, passes any necessary
    parameters, and starts the kernel.

    - The kernel initializes and mounts Ramdisk as the root filesystem.'
