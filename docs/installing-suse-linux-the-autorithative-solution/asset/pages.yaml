  md: '# 174 Appendix B: Troubleshooting SuSE Linux


    This command lists all the used dma channels:

    cat /proc/dma


    You can find the sound HOWTO at http://www.linuxdoc.org/HOWTO/

    Sound-HOWTO.html#toc4.


    # Network Interface Cards


    Network cards (NICs) are a snap to configure, and most of the drivers are available
    in the kernel that is installed by SuSE Linux. One problem that I have found is
    with PCI card configuration. It is an isolated case, but I will note it for the
    sake of others. The BIOS setting on older machines that were initially built when
    the 10Base ISA cards were popular might require a change in PCI settings. PCI
    cards are allocated IRQs and IOs automatically. This means that if the PCI setting
    are enabled on legacy compatibility, the system will either recognize the card
    but not allocate IRQ for it, or it will assign IRQ0 or 255, which are not valid
    addresses. When the setting is adjusted to PCI PnP compatibility, the problem
    should go away. More detailed information can be obtained at http://csdesis.gsfc.nasa.gov/linux/misc/irq-config.html.
    Check out the database at http://sdb.suse.de/cqi-bin/sdbsearch_en.q7stitchwort-PCI.


    If you have problems with an ISA card(s), you''ll need to use the same commands
    outlined in the previous Sound card section. This will help you determine if you
    have system conflicts or other problems. Again, you will need the card specifications
    in front of you.


    # Laptops and Notebooks


    If you have a laptop and have installed SuSE, you might find a few things different—notably,
    PCMCIA configuration problems. If you face a situation that requires diagnosis,
    this could help.


    Linuxre automatically probes for a PCMCIA device post-install and attempts to
    set up the device at that time. You will also be asked which network device to
    use; otherwise, you will choose PCMCIA, and YaST will attempt to configure the
    PCMCIA device. When you restart, the boot process fails to start the PCMCIA device,
    stating "eth0 device not found," or the device initializes and then etc/route
    fails. The problem is caused because Linuxre and YaST are trying to do the same
    job. Unknown to the other, each program has to configure the PCMCIA device.


    You must return to YaST and select Network Configuration and deselect the PCMCIA
    device that YaST set up (under base configuration). Do not remove any figures
    already there. Next you will need to edit the /etc/pcmcia/network.opts file—SuSE
    looks for its network information regarding PCMCIA devices. Add your IP address,
    netmask, broadcast, and network information. Also add your hostname and nameservers
    to complete the task.'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# Troubleshooting SuSE Linux 175


    If you experience a hang when the system is booting and tries to initialize the
    PCMIA device, check out this support tip at http://sdb.suse.de/sdb/html/mnened_6.3_pcmia-start.html.


    You''ll also have to go without sound on your laptop due to the PCI technology
    gap. The standard sound drivers and configuration tools are for ISA type PnP.
    If you are willing to try a development kernel version, this could solve your
    sound-less dilemma—it did for me. In the 2.3.34 version kernel, the drivers necessary
    for my particular card are included in the kernel package. Do some research to
    find out the manufacturer of the card and the specifications. You may want to
    refer to the Open Sound Web site at http://www.4front-tech.com/linux.html.


    # Modems


    Diagnosing a failed ppt connection can be an irritation, but how the dial program
    that comes with SuSE is pretty versatile. If the tool cannot autoconfigure your
    modem, there''s a good chance that you have a failed modem or a resource conflict.
    Use the commands to verify the IRQ and the I/O port, and make sure that you have
    determined where the modem is supposed to be located at tty0 and tty1, which corresponds
    to where the modem works on other operating systems, verify the COM port and use
    the same one under SuSE Linux (tty0/S0/S1). You can find an excellent detailed
    HOWTO on modems at http://www.linuxdoc.org/HOWTO/Modem.html.


    In most cases, a modem could be your only means to connect a network to the Internet.
    Make sure that the modem you''re using is Linux compatible, or this type of modem
    is external. Until recently, the use of using a Winodem (which is usually cheaper
    in price due to its operating characteristics, software driven, which consumes
    valuable CPU cycles in the process) was the question. Now that the Winmodems are
    not for Linux is diminishing. A few sites are dedicated to developing Open source
    drivers for Winmodems. The Linmodem site, at http://www.linmodems.org/, goes in-depth
    on the rationale of use and some of the hurdles that must be overcome. Or, try
    the Winmodems site, at http://www.o2.net/-gromitko/winodem.html, for some interesting
    highlights on the deficiencies surrounding Winmodems. Additional information is
    there as well as compatibility and availability drivers.


    # Troubleshooting Software Problems


    Software problems can crop up anytime. Although most Open Source software packages
    are quite useful in the normal configuration, you will have to verify your contents,
    adjust makefile configurations to suit your system(s), and possibly trace shared
    libraries to find a problem.


    If you run into problems with software operation, try using the RPM package manager
    to help (if the software is .rpm packaged). Use this command to verify the installation
    status of all .rpm packages:


    ```

    rpm -Va

    ```'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# 176 Appendix B: Troubleshooting SuSE Linux


    This is a good idea to do immediately after installing the system because it will
    ensure that all packages are installed and warn you of missing files and those
    that fail the dependency checks.


    In some cases you will want to install or remove a package, but RPM will complain
    that dependencies will not be met or be broken. This can happen when the package
    you are installing is looking for a specific file name and version, and although
    your system might have the file, it could be an updated version. This also also
    happen when you are removing a package that is linked to another file or library.
    If you are sure that the file exists and use this current command to install or
    upgrade:


    ```

    rpm -Uvh --nodeps <filename>.rpm

    ```


    Use this command to remove a package with broken dependencies:


    ```

    rpm -e --nodeps <filename>.rpm

    ```


    If you decide to remove a package and it breaks some dependencies, note that it
    could cause problems for the other application, and in some instances it will
    render the associated package useless. Be sure that if you use the --nodeps command,
    replacement of the primary package will be mandatory.


    Many other .rpm commands can be accessed by typing this at the command line:


    ```

    man rpm

    ```


    # Resolving Package Dependency Problems


    If you happen to run into a situation where the software cannot be installed due
    to a dependency problem, the RPM program should complain and tell you what the
    failed(s) are. The trick is finding the right solution without trying to browse
    the whole Web. You can find this type of information on the rpmfind.net Web site,
    http://www.rpmfind.net. When you look at the package selections, they will indicate
    which files and libraries are supplied and also the files that are required (prerequisite)
    for the package to work on the system. For further diagnostics, you can use this
    command:


    ```

    ldd <option> | <filename>

    ```


    For more information on how to trace linked libraries, use this command:


    ```

    man ldd

    ```


    # Internet Connectivity Problems


    If you are using SuSE Linux, odds are that you will be in some type of network
    environment. Whether there is a dial-up connection to the Internet or a full-time
    24x7 aDSL connection, somewhere, somewhere you''re connected.


    The small office/home office (SOHO) is becoming increasingly popular. You may
    have several computers that you want to share a single connection to the Internet.
    IP (IPChains) masquerading could be the simple answer, as you learned in Chapter
    10,'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# Troubleshooting SuSE Linux 177


    “Managing the Network Setup.” If you decide not to use the firewalling capabilities
    (packet filtering) in SuSE, you can still use the masquerading features of IP
    Chains.


    Issue the following commands to activate IP Chains on a dial-up connection device
    ppp0:


    ```

    ipchains -P forward DENY

    ipchains -A forward -i ppp0 -j MASQ

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    Issue these commands on machines connected with Ethernet card defined as eth0:


    ```

    ipchains -P forward DENY

    ipchains -A forward -i eth0 -j MASQ

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    For additional resources on IP Chains and masquerading, refer to the HOWTO documents
    at http://www.linuxdex.org/HOWTO/IPCHAINS-HOWTO.html.


    Firewalling could be your only option, in this hostile environment. Packet filtering
    can be enabled easily (see Chapter 11). Any further discussion of firewall(s)
    is outside the scope of this text. Refer to these resources for more information:


    +   http://metalab.nc.edu/LDP/HOWTO/Firewall-HOWTO.html

    http://sites.inka.de/sites/linux/freefire-1/index.en.html

    http://www.rustcorp.com/linux/ipchains/

    http://fwtk.netimages.com/main.html

    http://www.obtuse.com/juniper/

    http://www.ifi.unieh.ch/ikm/SINUS/firewall/


