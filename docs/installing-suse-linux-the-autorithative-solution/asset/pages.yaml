  md: '# CHAPTER 2


    # Installing SuSE Linux


    The one area that probably draws the most attention in Linux is the install program.
    Gauged by past experiences, there’s no doubt that installation of earlier distributions
    could be painful and outright frustrating—the sight of more than 25 floppy disks
    still seems to strike fear in my heart.


    Distribution installation has changed in many ways, however, with some using text-based
    installation and others using a GUI environment of some kind. The difference is
    controlled by the individual(s) packaging the software.


    Red Hat Inc. led the way in providing a “user-friendly” semi-graphical install
    script, which was reminiscent of the old DOS setup program. This had a two-fold
    benefit: It eased the visual translation of non-UNIX/Linux users, thereby giving
    them access to this powerful operating system. It also allowed more experienced
    users to get more done because the install scripts took over tedious keystroke
    duties.


    SuSE’s YaST (Yet another Setup Tool) utility was released in April 1995, capitalizing
    on the Red Hat installer development. SuSE observed the factors that worked and
    determined which could be tuned and tightened—as a result, the final product exhibits
    form and function. The SuSE view is clear: Developing a toolkit that integrates
    installation, updating, and system file configurations will decrease the new users’
    learning curve drastically. I’ve had an opportunity to install most major distributions,
    so when I say that YaST is effective, it’s not a biased statement.


    YaST is like a “Swiss knife”—you want to carry it everywhere. It’s a knife, cork
    screw, nail file, mini-saw bottle top opener,'
