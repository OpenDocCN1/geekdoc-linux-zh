    http://pcmcia.sourceforge.org/


    # # Serial Ports


    Your notebook should have at least one male nine-pin serial port available for
    external serial devices. Larger notebooks have the port available through the
    rear of the case, and ultralights or subnotebooks might use a port "extender"
    or replicator.


    Existing serial ports are recognized by Linux when booting. You can check to see
    what ports were recognized by using the dmesg command like this:


    ```

    ```

    # dmesg | fgrep ttyp

    ttyS0 at 0x03f8 (irq = 4) is a 16550A

    ```

    ```


    In this example, a single serial port, ttyS0, was found at the specified address,
    using an initial Interrupt Request (IRQ). This is a value that designates an assigned
    location for the device—in this case, a 16550A Universal Asynchronous Receiver-Transmitter
    (UART).


    Serial ports under Linux generally have the name ttyS0, ttyS1, ttyS2, and so on.
    They correspond to device pointers under the /dev directory and usually match
    those ports similar to COM1, COM2, COM3, and so on under DOS.


    Linux supports serial-port transfer speeds up to 115200 bits per second (bps).
    The main command to control characteristics of your notebook''s serial port is
    the setserial command. This command can be used to configure the port, IRQ, UART,
    speed, and other characteristics of your serial ports. If you''re new to Linux,
    be sure to read its man page if you have trouble getting your modem to work. Another
    good document to read is David S. Lawyer''s Serial-HOWTO, found under the Red
    Hat or Mandrake Linux /usr/doc/HOWTO directory.


    The good news is that you shouldn''t have to troubleshoot serial-port problems
    very often. The only time you can run into difficulty is when different devices,
    such as your sound card or IrDA and serial ports, have an IRQ conflict. By using
    the setserial command to change an IRQ, you should be able to resolve any problems
    quickly. For example, to change /dev/ttyS1 from an initial IRQ of 3 to a new IRQ
    of 4, use setserial like this:


    ```

    ```

    # setserial /dev/ttyS1 irq 4

    ```

    ```'
  merge: -1
  img_proc: true
