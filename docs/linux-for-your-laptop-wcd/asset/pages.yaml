    \ start\n        /bin/sleep 5\n        /etc/rc.d/init.d/network start\n      \
    \  ;;\n```\n\nYou could then use the script with the keyword sleep like this:\n\
    \n```\n```bash\n# /etc/rc.d/init.d/apmd sleep\n```\n\nAlternatively, after resuming\
    \ from sleep or hibernation, to restore your PC cards, you would use apmd like\
