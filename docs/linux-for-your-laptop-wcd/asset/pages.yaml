- pgno: 504
  md: '# Tuxtops: Laptops with Linux


    ![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_504_0.png)


    **Tuxtops**’ corporate mission is to create the frontier of Linux on mobile computers.
    Our goal is to make mobile computers running Linux just as enjoyable, just as
    robust, and just as fast as Linux running on other computer platforms.


    When you turn on a Tuxtops computer for the first time, the Windows X subsystem
    will be working properly, all the special laptop power management features will
    be enabled and operational, the correct sound drivers will be installed and configured,
    everything ready to go to work for you. You will have every major system setting,
    including the root password, your network settings, time zone, and ssh keys configured
    in under 5 minutes, and on the very first boot.


    For more information please visit www.Tuxtops.com


    # COMPANY HISTORY


    Tuxtops™ was founded in November 1999 to provide top quality laptop computers
    with Linux preinstalled and preconfigured on them.


    Our corporate mission is make computing on mobile computers with Linux just as
    enjoyable an experience as any other Linux supported platform.


    # Our Name


    Tuxtops™ is derived from the name of the Linux mascot, Tux the penguin, and of
    course, laptops.


    From here on in, things are only going to become easier for all Linux enabled
    mobile computer users. We are fully committed to keeping mobile computers and
    its associated technology on the very bleeding edge of Linux.


    Tuxtops currently offers three models to meet your mobile computing needs: Value,
    Ultralight, and Premium. You choose the features you want and we’ll make sure
    they work, right out of the box.


    # But I Like Some Windows Features and Software!


    Don’t worry, we realize that many of our customers may not want to give up some
    of their favorite software packages.


    That’s why we offer a Dual- Boot package, Windows98 and Linux Red Hat.


    Tuxtops, Inc.

    1253 Lakeside Drive

    Suite 300

    Sunnyvale, CA 94086

    Toll Free: (877)735-0638

    Local: (408) 585-3420


    ![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_504_1.png)'
  merge: -1
  img_proc: true
