    # Maintaining Your Battery


    Proper maintenance of your notebook''s battery is essential if you want to get
    the most life out of it and avoid early replacement. Of course, you should never
    let your battery get wet or try to take it apart. Batteries that are no longer
    any good should be disposed of properly. Many of the general guidelines for batteries,
    aside from recharging, also apply to your notebook. Here''s a list of do''s and
    don''ts for battery treatment:


    +   - Do charge your battery in an environment between 60 and 80 degrees Fahrenheit.

    +   - Do drain and store your NiMH battery if you aren''t going to use it for
    several weeks.

    +   - Do drain your LiIon battery to 50 percent and store it if you aren''t going
    to use it for more than several weeks.

    +   - Do expect shorter battery life if the battery is cold. (Always allow a computer
    to come up to room temperature if it has been stored in a cold environment.)

    +   - Do fully charge any new battery and then discharge it. Repeat this three
    times.'
  merge: -1
  img_proc: true
- pgno: 408
  md: '+   Don''t bang or drop your notebook''s battery.

    +   Don''t expose your battery to heat by leaving your notebook and battery in
    the sun or inside a parked car during the summer.

    +   Don''t forget to condition your battery every 60 days by fully draining and
    recharging it.

    +   Don''t store your notebook with an inserted battery for long periods of time.

    +   Do recharge your battery completely. (LiIon batteries are not as prone to
    “memory” problems as NiCads.)

    +   Do recharge your battery if it has not been used for a long time.

    +   Do replace your battery if it does not hold a charge.

    +   Do understand that a battery will heat up if it is discharging or in use.

    +   Do realize that battery life during usage depends on the number of peripherals
    in use (such as hard drive, audio, CD-ROM, modem, or networking port).

    +   Do use Advanced Power Management when using Linux on your notebook.

    +   Do use your battery until it is depleted, and then recharge it. To avoid corrupting
    your Linux filesystem when draining your battery, use a DOS boot disk, or boot
    a Linux distribution on a floppy. (Use a single-floppy Linux distribution, such
    as HAL9; see Appendix A, “Linux Laptop Resources,” for details.)


    # # Getting Power Information


    APM information is stored in the file `apm` under the `/proc` directory. This
    file is continually updated and can be used to provide a running commentary on
    the power state of your notebook. For example, you can get a quick snapshot by
    using the `cat` command:


    ```

    $ cat /proc/apm

    1.9 1.2 0x03 0x01 0x00 0x01 100% 200 min

    ```


    Many different Linux commands and clients use this information to graphically
    display the state of your notebook''s power or battery. See Chapter 7, “Advanced
    Power Management,” for more details about using APM and the structure of the data
    returned from the process directory.


    The important task to keep in mind when configuring your notebook for the road
    is to enable APM for Linux by making sure the system starts the `apmd` daemon
    when you boot. You should then be familiar with the `apmsleep` command or other
    graphic APM utilities if you want to put your notebook into standby, sleep, or
    hibernation mode.'
  merge: -1
  img_proc: true
- pgno: 409
  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_409_0.png)


    Figure 17.5 *The asapm monitor window provides graphic displays of your notebook''s
    battery status and can be used to launch power-saving measures at critical battery
    levels.*


    One interesting graphic monitor you can use if you don''t use KDE for your X11
    session is the asapm (AfterStep APM) monitor. You can dock this tiny client in
    your AfterStep icon wharf or start it from the command line of an X11 terminal
    window like this:


    ```

    $ asapm &

    ```


    After you press Enter, you''ll see a tiny window, as shown in Figure 17.5.


    By configuring asapm''s resource file, .asapmrc in your home directory, you can
    have this small client launch the `apmsleep` command to put your notebook into
    suspend or standby mode when power reaches low levels. For example:


    ```

    DownTo 10   /usr/bin/apmsleep -s

    ```


    This entry causes asapm to execute the `apmsleep` command to suspend your notebook
    when only 10 percent power remains.


    # Alternative Power Sources


    If you''re going on the road, you can take a DC power plug for your computer.
    These typically plug into a cigarette lighter in a car or on a boat. Other devices,
    such as AC/DC converters, may be used to provide AC power for your notebook''s
    AC adapter and even recharge your laptop''s battery.


    For an incredible extended mobile session, consider using an external solar panel.
    A number of these panels, such as Powerline Solar''s Sun Catcher, can power your
    laptop entirely from the sun, or at least (according to the manufacturer) triple
    your mobile session and battery life. These solar panels are about twice the cost
    of a replacement LiIon battery for most notebooks.'
  merge: -1
  img_proc: true
