  img_proc: true
- pgno: 90
  md: 'file named SUPPORTED.CARDS lists hundreds of compatible, partially supported,
    and incompatible PC cards for Linux. Read this file before purchasing a PC card
    to use with your notebook! You''ll find the latest copies of these documents,
