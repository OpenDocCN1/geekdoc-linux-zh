    The firewall choices are:


    0 – NONE: This script will not set any firewall rules. You are responsible for
    ensuring the security of your machine. You are STRONGLY recommended to use some
    kind of firewall rules.

    1 – STANDARDONE: Appropriate for a basic stand-alone web-surfing workstation

    2 – MASQUERADE: Appropriate for a machine acting as an Internet gateway for a
    LAN

    Your choice?

    ```


    Enter the number 0, 1, or 2, and press Enter. Unless you’re just testing the connection,
