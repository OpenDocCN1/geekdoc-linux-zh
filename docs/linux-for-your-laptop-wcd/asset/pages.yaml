- pgno: 399
  md: 'This chapter introduces general concepts, strategies, software, and hardware
    you can use to extend your mobile Linux sessions while using your notebook''s
    batteries. You''ll learn about accepted practices for battery treatment and Linux
    software you can use to monitor usage and extend battery life with an aim to conserve
    energy. This chapter builds on the advanced power management information you learned
    in Chapter 7, "Advanced Power Management."


    # ## General Strategies


    There are many strategies you can use to extend your mobile sessions. Some of
    these are obvious, and others require you to read your notebook''s manual to determine
    specific features or keyboard controls for your notebook.


    # ### Change the Screen Display


    The first strategy is to reduce your screen''s brightness, either through manual
    or keyboard controls, to an acceptable level for your environment. Active-matrix
    screens consume more power than passive-matrix (DSTN) displays. Some laptops allow
    you to turn off the LCD''s backlight, but this can render most active-matrix screens
    unreadable except in the dark. Other laptops, such as Sonys, also provide BIOS
    settings for initial screen brightness. An alternative is to turn off your notebook''s
    display and use an external monitor, although this is not always convenient and
    might be impossible when you''re on the road.


    # ### Don''t Play Audio


    Don''t play audio through your notebook''s speakers. Use the headphone jack instead,
    or don''t listen to audio and turn off sound by unloading the sound modules with
    the `rmmod` command. For example (on a Dell Inspiron 7500), first use the `lsmod`
    command to list the modules in use:


    ```

    ```

    $ lsmod


    Module          Size  Used by

    maestro         26176   0  (unused)

    soundcore        3524   2  [maestro]

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 400
  md: 'To turn off sound, exit any running sound clients, such as **kmix** or **xmixer**,
    and then unload the sound modules with the **rmmod** command:


    ```

    ```python

    # rmmod maestro

    # rmmod soundcore

    ```

    ```


    Multimedia applications and tasks that tax your notebook''s CPU and devices, such
    as taking ".mp3s off audio CDs, can suck the juice from your battery faster than
    any other application.


    # ## Ports and PCMCIA


    Keep your online time to a minimum to reduce the use of a built-in modem or serial
    port.


    To save additional power, use your computer''s BIOS to disable the IrDA port,
    or, if possible, turn it off using an **Fn-key** keyboard command. If you have
    a network or modem PC card, first make sure the network or modem is not in use
    with the **cardctl** command:


    ```

    ```bash

    # cardctl status

    Socket 0:

    3.3V 16-bit PC Card

    function 0: [ready], [hat dead], [bat low]

    Socket 1:

    5V 16-bit PC Card

    function 0: [busy]

    ```

    ```


    After stopping a card''s use, you can software-eject the card like this:


    ```

    ```bash

    # cardctl eject 0

    ```

    ```


    You can then turn off PCMCIA''s Card Services by using its script like this:


    ```

    ```bash

    # /etc/rc.d/init.d/pcmcia stop

    ```

    ```


    # ## The cron Daemon


    Check your /etc/crontab scripts to reduce frequently running scripts. Better yet,
    stop the cron daemon service like this:


    ```

    ```bash

    # /etc/rc.d/init.d/crond stop

    ```

    ```


    # ## Kernel and System Logging


    You can also temporarily turn off kernel and system logging during your mobile
    sessions by using the syslog script under the /etc/rc.d/init.d directory like
    this:


    ```

    ```bash

    # /etc/rc.d/init.d/syslog stop

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 401
  md: "This is only a good idea for temporary use. You should normally run syslog\
    \ services for security reasons. You can also stop the httpd daemon using a similar\
    \ script to disable Web server logging.\n\n# External Devices\n\nAvoid printing\
    \ or other tasks that send data through your parallel port. Don't use a serial\
    \ mouse or external keyboard. Also avoid using devices such as Webcams that use\
    \ your notebook's PS2 port for power. External CD-ROM drives use the PCMCIA slots\
    \ for power unless the drive features an external power source that takes over.\n\
    \n# Filesystem Update\n\nOne software tweak you can perform is to change the default\
    \ value for filesystem buffer flushing performed by the `update` (updated) daemon.\
    \ If you examine your Red Hat Linux system initialization table, `/etc/inittab`,\
    \ you'll see an entry that looks like this:\n\n```\n# Things to run in every runlevel.\n\
    \tud:once:/sbin/update\n```\n\nThe `updated` (bdfush) daemon is started for each\
    \ runlevel when Linux is booted. Note that if you try to read the `updated` man\
    \ page, the `bdfush` man page will be displayed. This is because the `updated`\
    \ command is used to start `bdfush`. These daemons are used to write changed (aged)\
    \ data to disk at specific intervals. The default is 30 seconds for data buffers\
    \ and 5 seconds for nondata, such as directories.\n\nYou can view the current\
    \ defaults by using the `updated` command with its `-d` option:\n\n```\n# /sbin/update\
    \ -d\n\n\t0:\t40 Max fraction of IPU list to examine for dirty blocks\n\t1:\t\
    500 Max number of dirty blocks to write each time bidlush activated\n\t2:\t64\
    \ Num of clean buffers to be loaded onto free list by refill_freenist\n\t3:\t\
    256 Dirty block threshold for activating bldlush in refill_freenist\n\t4:\t500\
    \ Percentage of cache to scan for free clusters\n\t5:\t3000 Time for data buffers\
    \ to age before flushing\n\t6:\t500 Time for non-data (dir, bitmap, etc) buffers\
    \ to age before flushing\n\t7:\t1884 Time buffer cache load average constant\n\
    \t8:\t2 LAW ratio (used to determine threshold for buffer fratricide).\n```\n\n\
    In this example, the important values are for 5 and 6, which show the amount of\
    \ time, in hundredths of a second, between flushing of data and syncing of the\
    \ data to disk (with the `sync` command). Knowing this, intrepid mobile Linux\
    \ users will change the default intervals to allow for a longer hard drive standby\
    \ or *spindown*"
  merge: -1
  img_proc: true
- pgno: 402
  md: 'before Linux writes data to disk. For example, you could change the /etc/inittab
    entry for update to this:


    ```

    id:once:/sbin/update -S 1800 -f 1800

    ```


    This will cause updates only once every half hour. Be warned, however: If you
    lose power and your disk is not updated, you could lose data!


    # ### Controlling Your Hard Drive


    Use the hddparm command to change the spindown timeout for your notebook''s hard
    drive. The hddparm command has many different options and settings, as shown in
    the following code:


    ```

    # hddparm -?

    ```


    ```

    hddparm - get/set hard disk parameters - version 3.5


    Usage: hddparm [options] [device] ..


    Options:

    -a      get/set fs readonly

    -A      * set drive read-lookahead flag (0/1)

    -c      * get/set IDE 32-bit IO setting

    -C      * check IDE power mode status

    -d      * get/set using_dba flag

    -D      * enable/disable drive defect-mgmt

    -f      * flush buffer cache for device on exit

    -g      * display drive geometry

    -h      * display terse usage information

    -i      * display drive identification

    -I      * read drive identification directly from drive

    -k      * get/set keep_settings_over_reset flag (0/1)

    -K      * set drive keep_features_over_reset flag (0/1)

    -m      * get/set multiple sector count

    -n      * get/set ignore-write-errors flag (0/1)

    -o      * set PIO mode on IDE interface chipset (0,1,2,3,4,...)

    -P      * set drive prefetch count

    -Q      * change next setting quietly

    -r      * get/set readonly flag DANGEROUS to set

    -S      * set standby (spindown) timeout

    -t      * perform device read timings

    ```'
  merge: -1
  img_proc: true
- pgno: 403
