  md: 'shows you how to “rip” tracks into .mp3 files. Storing music on your notebook
    this way is not only handy, but essential, especially if your ultralight mobile
    Linux note-book doesn’t have a CD-ROM drive!


    # Choosing an Audio format


    There are many different types of sound formats, and Linux supports nearly every
    sound format in use today. However, the most common formats are .au (raw audio),
    .wav (Windows sound format), and .mp3 (MPEG III). Use .mp3 to store high-quality
    digital sound on your notebook; you’ll benefit from its compressed format.


    # Using the Command Line


    You can manually rip audio tracks from a CD to your hard drive, but you’ll most
    likely want to convert the track to .mp3 format. Use the cdcd2wav command to grab
    an audio track and save it on your hard drive. The track will be saved in .wav
    format. If you use a SCSI CD-ROM drive, you can quickly grab the first track of
    an audio CD by using cdcd2wav, along with your drive’s device specification:


    ```

    # cdcd2wav -D 0,1,0

    ```


    This specifies that the audio CD is on a SCSI drive with an ID of 1 on bus 0.
    After you press Enter, you’ll see this:


    ```

    135168 bytes buffer memory requested, 4 buffers, 13 sectors

    Read TOC CD Ttext failed (probably not supported).


    cdcd2wav version schily0.6_linux2.2.13-2m&amp;swmp; 1696 1696 real time sched.

    soundcard support


    AUDIOTrack pre-emphasis copy-permitted tracktype channels

    1-11 no no audio 2

    Table of Contents: total tracks:11, (total time 52:17.40)

    1.( 4:46.56), 2.( 6:16.64), 3.( 5:05.50), 4.( 4:40.22), 5.( 5:41.62)

    6.( 4:23.46), 7.( 3:39.18), 8.( 4:12.33), 9.( 4:13.62), 10.( 5:05.13)

    11.( 4:09.64)


    Table of Contents: starting sectors

    1.( 0), 2.( 21506), 3.( 49770), 4.( 72695), 5.( 93717)

    6.( 119354), 7.( 139125), 8.( 155568), 9.( 174501), 10.( 193538)

    11.( 216426), lead-out( 235165)

    CDDB discid: 0xae0c3f0d

    ```'
