    Can you tell which computer “pinged” in the preceding examples is on a LAN? (Hint:
    Speed is always relative, and if you enjoy a high-speed Internet connection, you
    might see response times as fast as the first example. In this case, the computer
    with the faster response time is the one on a LAN.)


    # Wireless Connections


    Wireless networking, although available for several years now, has always been
    an expensive proposition and networking alternative—until now. In the last year,
    a number of inexpensive wireless networking cards with cost and capabilities close
    to typical 10Base-T performance have hit the market. These cards use 2.4GHz radio
    technology and offer 2MBps networking using IEEE 802.11 specifications known as
    frequency-hopping spread-spectrum networking. An installed and configured card
    appears as an Ethernet device (such as eth0) and provides a high-speed wireless
    link between a similar card installed in another PC or notebook. Range is typically
    500 feet or less through walls and perhaps up to 1,000 feet with line-of-sight
    access.


    The great news is that at least one or two models from different manufacturers
    work with Linux. Even better news is that one of the most inexpensive models,
    the Aviator 2.4, manufactured by Webgear, Inc., not only works well for nearly
    all Intel-based mobile Linux users, but also has drivers (developed by Corey Thomas)
    included with Card Services as a kernel module. Using these cards, you can quickly
    build a network of up to at least 61 different computers, or nodes.


    Networking two laptops wirelessly is quite easy. Insert the wireless card, and
    then wait for Card Services to recognize, initialize, and configure the device.
    Use the dmesg command to look for output similar to this:


    ```

    eth0: RayLink, irq 4, hw_addr 00:00:84:88:DB

    ray_cs interrupt network "LINUX" started

    ```


    You can use the radio wave technology as a wireless bridge, connecting'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'Then, as the root operator, configure the eth0 device using netcfg. Repeat
    these steps on the other laptop, but look for something like this (again using
    dmesg):


    ```

    eth0: RayLink, irq 10, hw_addr 00:8F:48:E8:45


    ray-os interrupt network "LINUX" joined

    ```


    If each laptop''s IP address or host information is listed in each one''s /etc/hosts,
    you can use any standard network utility to transfer or share information. However,
    if you want to allow a remote laptop user access to a LAN through the second wireless
    interface, you have use one of two alternative methods: bridging or routing a
    subnet. More expensive wireless card series offer wireless "access points," or
    wireless network interfaces that quickly plug into a LAN and allow remote users
    to roam through different networks.


    To allow access to a LAN through an Aviator card, the card is installed in either
    a laptop with two PC card slots to support a network (RJ-45) PC card and an Aviator
    card, or a desktop PC with an ISA PC card slot adapter and an installed network
    (RJ-45) interface adapter. For example, the desktop''s first interface, eth0,
    might have an IP address of 192.168.2.38, while the Aviator card, installed as
    eth1, would have an IP address of 192.168.1.1. The route command is then used
    to route traffic through eth0:


    ```

    # route add 192.168.1.1 gw 191.168.2.38

    ```


    This ensures that the remote user, with a wireless adapter configured with an
    IP such as 192.168.1.2, can reach other computers on the LAN in the range of 192.168.2.XXX.
    You can also enable IP packet forwarding for the 192.168.1.XXX subnet like this:


    ```

    iptables -A forward -s 192.168.2.0/24 -j MASQ

    iptables -A forward -s 192.168.1.0/24 -j MASQ

    ```


    This gives the remote user the ability to send and receive e-mail or browse the
    Web if the access point has an active connection to the Internet (perhaps using
    PPP). Continuing our example, in order to access the rest of the LAN and take
    advantage of IP forwarding, the wireless user must use the route command like
    this:


    ```

    # route add default gw 192.168.1.1

    ```


    This example specifies, and then creates, a default gateway, or a gate for packet
    information to flow to and from the remote laptop. (Note that the IP address in
    this example is not for the remote computer, but for the eth1 that is already
    reachable on the desktop PC on the LAN.)'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# ### Bridging


    You can also try using an experimental feature of the Linux kernel to build a
    wireless bridge for your LAN. Using a spare desktop or laptop recompile the Linux
    kernel to enable bridging. Install the wireless card and network card, but do
    not assign an IP address to the wireless card.


    Next, browse to


    ```

    ftp://shadow.cab1.net/pub/linux/

    ```


    Download, build, and install Alan Cox''s bridge configuration utility from the
    file BRFCFG.tgz. Enable both network cards, but use the ifconfig command like
    this:


    ```

    # ifconfig eth0 promisc up

    # ifconfig ethl promisc up

    ```


    You can then enable bridging with this command:


    ```

    # brcfg -ena

    ```


    After you start your wireless remote connection, you should be able to access
    any computer on your LAN.


    # ## Telco Connections


    If you''re fortunate enough to have one of those rare Intel-based laptops with
    a real built-in modem, congratulations! All lesser beings have to purchase a PC
    card modem or hook up an external modem through the notebook''s serial port. Before
    the advent of the Internet, modems were the portals to the outside world and the
    glue that held wide-area networks together. And despite the increasing movement
    toward Digital Subscriber Lines (DSLs) and cable modems, modems still enjoy popular
    use, although transfer speeds have stagnated to a now more-or-less standard 56Kbps,
    with various compression technologies and techniques boosting throughput slightly.


    # ### The iBook Modem and Lucent Module


    The Apple iBook modem is only supported under Linux when you boot using Apple''s
    OpenFirmware prompt and the Yaboot utility. If you have an Intel-based notebook
    with a Lucent controllerless modem, you can try the lucent.o modem enabler available
    at http://www.linmodems.org.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# ## Setting Up to Support Dial-In


    You can set up your notebook to accept dial-in calls via the telephone and your
    notebook’s internal or attached modem. By making a few simple changes to some
    files on your system, you can dial in to and—if your notebook is connected to
    a network—access the network.


    Several utilities are available with every Linux distribution that allow you to
    set up Linux for dial-in:


    +   * ugetty. Part of Kris Gleason’s getty_ps package for Linux, this program
    may be used with a number of speeds and configurations (contained in the file
    /etc/gettydefs), but you must first correctly set up your modem for dial-in support
    and create a special configuration file for each line monitored.

    +   * agetty. An extremely simple and easy-to-use line-monitoring utility by Wietse
    Venema that supports embedded modem setup strings in the initialization line (you’ll
    see an example in a moment).

    +   * mgetty. Part of Gert Doering’s mgetty+sendfax package, this utility may
    be used to control your modem to answer the phone, send and receive faxes, and
    even (with the right hardware) become a voice answering machine.


    The easiest command to set up is agetty. Red Hat and Mandrake Linux users should
    log in as the root operator and then open the system’s initialization table, /etc/inittab.
    Look for the entry for runlevel 3, used for multiple users and networking (note
    that this runlevel is 2 for SuSE Linux users):


    ```

    3:2345:respawn:/sbin/mingetty tty3

    ```


    Although the mingetty command is fine to monitor local logins, you’ll want to
    change this entry. To have agetty monitor the serial port used with your modem
    and have the modem answer the call on the first ring, change the entry to the
    following:


    ```

    3:2345:respawn:/sbin/agetty -w -I “ATE0&1D2&Dz&IS0=11\015” 115200 ttyS0 vt100

    ```


    This example assumes that you’d like to support high-speed answering, and that
    your notebook’s modem is attached to /dev/ttyS0 (corresponding to DOS COM1). Note
    that you shouldn’t make this change if you don’t have agetty installed. You can
    find a copy at ftp://ftp.porcupine.org/pub/security/index.html


    The ugetty command may also be used like agetty. Again, edit the runlevel 3 entry
    to look like this:


    ```

    3:2345:respawn:/sbin/ugetty ttyS1 115200 vt100

    ```'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'Save this file and exit. You will also need to create a file named **ugugetty.ttyS1**
    under the `/etc/default` directory containing this:


    ```

    ```text

    ALTLOCK=ttyS1

    TIMEOUT=60

    INIT="" \d+++\dAT\r OK\r\n ATH0\r OK\r\n AT+E\r\nS00\r\nS4\r\nS8=1\r OK\r\n

    DELAY=1

    ```

    ```


    The entries in this file specify a lockfile so that `ugugetty` will restart and
    reinitialize your modem, tell `ugugetty` how long to wait (in seconds) before
    disconnecting if the connection is idle, contain a modem initialization string,
    and finally, specify how long to delay (in seconds) before printing your system''s
    log-in banner.


    After making these changes and creating your file, you can force the changes by
    using this command:


    ```

    ```bash

    # telinit q

    ```

    ```


    This causes your system to reinitialize. You can then test your setup by calling
    in from a remote computer.


    # ## Setting Up a Dial-In PPP Server


    You can also set up your system to offer a PPP connection when someone dials in.
    One way to do this is to edit a user''s `/etc/passwd` entry, but instead of offering
    a login shell, launch a shell script that starts the PPP daemon on your system.
    For example, suppose Fred Smith wants to dial in and get PPP service. You would
    create his account and then edit his `/etc/passwd` entry to look like this:


    ```

    ```text

    fsmith:x:501:101::/home/fsmith:/usr/local/bin/startppp

    ```

    ```


    The `startppp` script would contain this line:


    ```

    ```bash

    exec /usr/sbin/pppd -detach

    ```

    ```


    However, you also need to set various PPP options in the options file under the
    `/etc/ppp` directory:


    +   ```text

    +   asyncmap 0

    +   netmask 255.255.255.0

    +   proxyarp

    +   lock

    +   crctests

    +   modem

    +   ```'
  merge: -1
  img_proc: true
- pgno: 288
  md: "A static IP address may be assigned by specifying the server address and the\
    \ assigned address in a file named /etc/ppp/options.ttyX (where X is the number\
    \ of your modem’s serial port):\n\n```\n192.168.2.31:192.168.2.2\n```\n\nIn this\
    \ example, the first IP is the server address, and the second is the assigned\
    \ address. Other methods to use would be to assign an IP based on the serial port\
    \ used, such as if you have a multiple-line system (although most notebooks would\
    \ probably be able to handle only three lines).\n\n# # Direct Connections\n\n\
    This section introduces several ways to directly connect two computers in order\
    \ to share, transfer, or back up information.\n\n# ## Setting Up a Null-Modem\
    \ PPP Connection\n\nOne of the quickest, easiest, and cheapest ways to set up\
    \ and transfer small amounts of information between a notebook computer and desktop\
    \ computer is to use an inexpensive null-modem serial cable. This cable, which\
    \ will have its TX (transmit) and TR (receive) pin lines crossed, can be found\
    \ in nearly any computer store (usually in 6-foot lengths) and is a great tool\
    \ to keep on hand.\n\nFirst, make sure both computers have an assigned IP address.\
    \ Next, make sure these addresses are in both computers’ /etc/hosts file. For\
    \ example:\n\n```\n```\n# sample /etc/hosts file listing\n# IP Addr\t\tHostname\t\
    \t\t\tAlias\n192.168.2.31\tstinky.home.org\t\tstinky\n192.168.2.34\taptiva.home.org\t\
    \taptiva\n```\n```\n\nNext, create a single-line script (perhaps named hook) for\
    \ each computer, specifying the hostnames and the serial port used by the null-modem\
    \ cable. An example for the computer named stinky (where the cable is attached\
    \ to /dev/ttyS0) would look like this:\n\n```\n/usr/sbin/pppd -detach xonxoff\
    \ stinky:aptiva /dev/ttyS0 38400 &\n```\n\nFor the computer aptiva, on the other\
    \ hand, the script might look like this:\n\n```\n/usr/sbin/pppd -detach xonxoff\
    \ aptiva:stinky /dev/ttyS1 38400 &\n```"
  merge: -1
  img_proc: true
- pgno: 289
  md: 'This script shows that the cable on altiva is attached to `/etc/ttyS1`. Next,
    both scripts should be made executable and copied to the `/usr/local/bin` directory:


    ```

    ```bash

    # chmod +x hook

    # cp hook /usr/local/bin

    ```

    ```


    Ensure that networking services are enabled on both machines, and connect the
    serial cable to the appropriate ports on each computer. Then, on each computer,
    execute this command:


    ```

    ```bash

    # hook

    ```

    ```


    You can then verify the connection by using the `ping` or `ifconfig` commands.
    Although this setup doesn''t offer blistering networking speeds, it is a very
    cost-effective solution that works in a pinch.


    # Networking with the Parallel Line Interface Protocol


    The Parallel Line Interface Protocol (PLIP) is another inexpensive way to network
    two computers, but with better performance than using serial ports. You''ll need
    a free parallel port on each computer (set to ECP, EPP, or bidirectional mode),
    along with a parallel null cable. Many shorter cables (6 feet or less) may be
    found at larger computer discount stores.


    Your kernel must support loadable modules, networking, IP forwarding, network
    devices, the parallel port, and associated devices. This shouldn''t be a problem
    for stock kernels from recent Red Hat or Mandrake Linux distributions.


    Your notebook must also have at least a bidirectional parallel port. Although
    PLIP works well with many desktop computers, not all notebooks can support this
    protocol, because the parallel port does not work well bidirectionally (despite
    manufacturer and BIOS claims to the contrary).


    Here is the general procedure to set up a PLIP link between two Linux computers,
    such as laptop to laptop or desktop to laptop:


    Connect the cable to each computer. Next, boot each computer and check each one''s
    parallel-port BIOS information. On each computer, make sure `/etc/hosts` contains
    the IP address of the two computers, and then issue this command:


    ```

    ```bash

    # insmod parport

    ```

    ```


    This loads generic support code. Next, load the parport_pc module with this:


    ```

    ```bash

    # insmod parport_pc io=0x378 irq=7

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'This sets up your parallel port using the specified I/O address and IRQ. You
    can then check your kernel messages:


    ```

    $ dmesg

    ```


    ```

    ...

    ```


    ```

    parport0: PC-style at 0x378, irq 7 [SPP,ECP,PCFPPS2]

    ```


    This shows that the port has been initialized. Next, use insmod to load PLIP support
    and create your PLIP device:


    ```

    $ insmod plip timed=1

    ```


    The timed option instructs plp.o to avoid other I/O addresses or IRQs in use.
    You can then check for kernel output to see if the device was created:


    ```

    $ dmesg

    ```


    ```

    ...

    ```


    ```

    plip0: Parallel port at 0x378, using IRQ 7

    ```


    Note that the parallel-port device returned (in this example, plp0). You can then
    use the ifconfig command to bring up the plip interface on each computer (and
    also to perhaps set the device netmask and so on). For example, on ComputerA,
    you would use this:


    ```

    $ ifconfig plip0 ComputerA pointopoint ComputerB up

    ```


    and on ComputerB you would use this:


    ```

    $ ifconfig plip0 ComputerB pointopoint ComputerA up

    ```


    You can then check the interface on each:


    ```

    $ ifconfig plip0

    ```


    ```

    plip0 Link encap:Ethernet HWaddr FC:PC:C0:A8:02:26 inet addr:192.168.2.38 P-t-P:192.168.2.30
    Mask:255.255.255.255 UP POINTOPOINT RUNNING NOARP MTU:1500 Metric:1 RX packets:0
    errors:0 dropped:0 overruns:0 frame:0 TX packets:0 errors:0 dropped:0 overruns:0
    carrier:0 collisions:0 txqueuelen:10 Interrupt:7 Base address:0x378

    ```


    You can then try to ping, telnet, or ftp to the other computer. Problems you might
    encounter include bad cables and incompatible parallel ports. To bring down the
    connection, use the ifconfig command like this:


    ```

    $ ifconfig plip0 down

    ```'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# **IrDA Networking**


    You can also establish network connections between a laptop and other laptops,
    or a desktop PC equipped with an IrDA "dongle." See the Linux IR-HOWTO to learn
    about setting up networking. Browse to `http://home.snafu.de/wehe/IR-HOWTO.html`.
    Speeds will be much faster than using a serial or parallel-port connection.


    # **Setting Up a Crossover Ethernet Connection**


    This section shows you yet another cost-effective way to network two notebooks,
    or a desktop and a notebook. If you want to connect a notebook and a desktop or
    two notebooks via Ethernet, you do not need a networking hub! This method is similar
    to the serial and PLIP examples. We''ll again use the `ifconfig` command to set
    up each computer''s interface.


    You''ll need to make sure that each computer''s IP address and alias are entered
    in each computer''s `/etc/hosts` file. Insert the network cards, and ensure that
    the card has been recognized and initialized. For example:


    ```

    ```

    # dmesg

    ...

    eth0: NE2000 Compatible: io 0x300, irq 3, hw_addr 00:E0:98:06:84:C5

    ```

    ```


    This example shows that a PC network card was recognized and that the `eth0` device
    was created. Next, connect a Cat 5 RJ-45 crossover cable (not a regular patch
    cord) to each network card''s jack. These cables can be found in most large computer
    stores. They work by swapping the receive and transmit pairs of wires. For specific
    directions on building your own, read Paul Gortmaker''s Ethernet-HOWTO (found
    under your `/usr/doc/HOWTO` directory if you install the documentation with your
    distribution).


    After connecting the cable, go to ComputerA and type


    ```

    ```

    # ifconfig eth0 ComputerA pointopoint ComputerB up

    ```

    ```


    Then, on ComputerB, type


    ```

    ```

    # ifconfig eth0 ComputerB pointopoint ComputerA up

    ```

    ```


    You should look at your cards'' indicator lights for a link, and then use the
    `ifconfig` command to check the status of the interface on each computer like
    this:


    ```

    ```

    # ifconfig eth0


    eth0      Link encap:Ethernet  HWaddr 00:E0:98:06:84:C5

    ```

    ```'
