- pgno: 350
  md: 'supported. For example, if you want to send a fax to a person named Joe Piccolo,
    and you know his fax number in Washington, D.C., compose your e-mail document
    and then send the message to


    ```

    remote-printer,Joe_Piccolo1@2025551212;1664.tpc.int

    ```


    Your recipient’s fax machine will get a cover page, along with your e-mail message.
    For a current list of world area codes supported by this free service (along with
    links to Linux clients you can use to send graphics and text), browse to http://www-usa.tpc.int/fax\_cover\_auto.html.


    # Printing to a Remote Linux Printer


    Printing to a network printer is another alternative, and configuring a remote
    Linux printer is very easy. First, the remote computer with the attached printer
    should have a properly configured /etc/hosts.lpd file. This file contains the
    hostnames (or IP addresses) of remote computers allowed to print locally. For
    example, if your home office has a computer attached to the LAN named lp.service.org,
    edit that computer’s /etc/hosts.lpd file and add the IP addresses or hostnames
    of computers you want to grant printing access, such as this:


    ```

    192.168.2.32

    apltiva.service.org

    green.service.org

    laptop3.service.org

    ...

    ```


    You should then restart the lpd daemon on lp.service.org like this:


    ```

    # /etc/rc.d/init.d/lpd restart

    ```


    If your notebook’s hostname is laptop3.service.org, you’ll be allowed to print
    to the printer attached to lp.service.org. In order to print to the printer on
    lp.service.org, you’ll need to know the name of the printer, such as green (which
    would have a spool directory under the /var/spool/lpd/green directory), and that
    green is, for example, an HP 400. Run the Red Hat printtool client on your notebook,
    and then click the Add button. You’ll see the dialog box shown in Figure 14.1.
    Click the Remote UNIX (lpd) Queue button, and then click OK. You’ll see the Edit
    Remote UNIX (lpd) Queue Entry dialog box, as shown in Figure 14.4.


    Enter a name you’d like to use for the remote HP 400 printer, such as remoteHP400.
    Next, enter the name of the remote host, such as lp.service.org, and the name
    of the remote printer on the remote host, such as green. When finished, click
    the Select button and configure the remote entry to match the printer named green
    on'
  merge: -1
  img_proc: true
