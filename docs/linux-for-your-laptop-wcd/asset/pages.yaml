  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_281_0.png)


    # Behind the Scenes


    Red Hat Linux stores most networking information under the /etc directory. Control
    of networking services during startup and shutdown is through various scripts
    under the /etc/rc.d/init.d directory. Information about your notebook''s adapter(s)
    is contained in different files under the /etc/sysconfig/network-scripts directory.
    For example, information about an eth0 device would be contained in the file ifcfg-eth0.
    These files are automatically created, edited, and deleted by *netcfg* and *linuxconf*
    and are, in turn, used by other scripts to start and stop networking services.


    # Configuring with linuxconf


    The *linuxconf* command, which works with or without X11, can be used to configure
    a newly installed network adapter for your notebook. Start *linuxconf* from your
    console''s command line, from the command line of an X11 terminal window, or through
    a Red Hat-specific root menu of your X11 window manager.


    Under the Config menu, click on the Network task list, click on the Client task
    list, and click on the Basic host information item. In the dialog box that appears,
    click on the Adaptor tab, and then fill out as much information as possible about
    your notebook''s adapter, as shown in Figure 11.6.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_282_0.png)


    **Figure 11.8** _The 11nxconf client is a comprehensive administration tool for
    Linux that includes configuration controls for networking devices._


    Note that you can also tell `11nxconf` that the adapter is a PCMCIA device. In
    addition, you can specify an optional I/O port or IRQ in special instances (as
    always, consult the PCMCIA-HOWTO when troubleshooting PC card problems). When
    you''re finished, click on the Accept button. You can then click on the Act/Changes
    (activate changes) button and quit the program.


    After you configure the interface, try using the `ping` command to test the speed
    and reliability of transmission and receipt of data packets across your LAN. For
    example, use `ping`''s -c (count) option, along with a number such as 3, followed
    by the name or IP address of a remote host on your LAN (or, if connected to the
    Internet, to a remote computer):


    ```

    # ping -c 3 ascentia.home.org

    PING asenitia.home.org (192.168.2.32): 56 data bytes

    64 bytes from 192.168.2.32: icmp_seq=0 ttl=255 time=0.5 ms

    64 bytes from 192.168.2.32: icmp_seq=l ttl=255 time=0.4 ms

    64 bytes from 192.168.2.32: icmp_seq=2 ttl=255 time=0.4 ms


    --- asenitia.home.org ping statistics --

    3 packets transmitted, 3 packets received, 0% packet loss

    round-trip min/avg/max = 0.4/0.4/0.5 ms

    # ping -c 3 megan.staffnet.com

    ```'
