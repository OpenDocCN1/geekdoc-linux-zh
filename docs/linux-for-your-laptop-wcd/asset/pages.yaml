- pgno: 376
  md: 'recently, they have been somewhat prohibitive in cost. These cards typically
    offer either 11Mbps or 2Mbps networking speeds and cost the same or three times
    as much as normal PCMCIA networking cards. The kit uses 2.4GHz radio technology
    (as detailed in IEEE 802.11 specifications), known as frequency-hopping spread-spectrum
    networking.


    # **Wireless LAN Card Configuration**


    This section details the installation and configuration of a low-cost 2Mbps wireless
    network for Linux using Webgear, Inc.''s Aviator 2.4 wireless network cards. Webgear
    markets a networking kit consisting of two Type II PCMCIA cards and two ISA PC
    card slots. When the cards are installed and configured, the interfaces appear
    as Ethernet devices, such as eth0.


    This kit allows you to set up peer-to-peer networking between two laptops, two
    desktop PCs, or a laptop and a desktop. The ISA PC card slots may be installed
    in a desktop to allow use of a PCMCIA card. Configuring the cards involves downloading,
    decompressing, building, and installing the card drivers. Browse to http://world.std.com/~corey/raylink.html
    to download Corey Thomas'' latest version of the Linux driver, ray_cs.o, for the
    Aviator cards. Then copy the compressed tarball to the /usr/src/linux/pcmcia directory,
    and decompress the file like this:


    ```

    # tar xzvf ray_cs.gz

    ```


    To configure, build, and install the drivers, do this:


    ```

    # make config

    # make all

    # make install

    ```


    Next, edit the file /etc/pcmcia/config.opts and insert this line:


    ```

    source ../ray_cs.opts

    ```


    Next, edit the ray_cs.opts configuration file to read as follows:


    ```

    module "ray_cs" opts "pc_debug=2 essid=LINUX hop_channel=128 \

    beacon_period=256 translatel=1"

    ```


    Be sure to use the same settings for each computer. Next, use Red Hat''s netcfg
    tool to create an eth0 interface on each computer. The cards must then be started
    sequentially. Make sure Card Services is running by doing the following:


    ```

    # /etc/rc.d/init.d/pcmcia start

    ```'
  merge: -1
  img_proc: true
- pgno: 377
  md: 'Insert one of the Aviator cards, and then look through the system''s /var/log/messages
    file for this:


    ```

    ray_cs Detected:

    WebGear PC Card WAN Adapter Version 4.88 Jan 1999

    eth0: Raylink, irq 4, hw_addr 00:00:8f:48:28:DB

    ray_cs interrupt network "LINUX" started

    ```


    Next, enable the interface using netcfg, and insert the other Aviator card on
    the other computer. Again, look at /var/log/messages:


    ```

    ray_cs Detected:

    WebGear PC Card WAN Adapter Version 4.88 Jan 1999

    eth0: Raylink, irq 10, hw_addr 00:00:8f:48:28:45

    ray_cs interrupt network "LINUX" joined

    ```


    Note that the first instance of the ray_cs.o driver output says “started,” and
    the second card says “joined.”


    Enable the second interface, and your computers are networked! You can then try
    using the ping command to test the connection. Once the network is working, you
    can use telnet, ftp, or even http for Web browsing (FTP speeds will be about 180Kbps).


    Using this approach, you can install a wireless card in your notebook and another
    on a computer attached to a LAN. By using IP masquerading, you can forward Internet
    service to the wireless laptop. Do this by assigning an IP address to the first
    eth0 interface on your server, and then install an Aviator card as eth1 with an
    IP address in a different subnet. For example, eth0 could have an address of 192.168.2.50,
    and the Aviator card, as eth1, would be assigned 192.168.1.1. Start the wireless
    service from the server to your laptop, and then use the route command like this:


    ```

    # /sbin/route add 192.168.1.1 gw 191.168.2.50

    ```


    On the server (191.168.2.50), which has a connection to the Internet, you would
    then use IP masquerading like this:


    ```

    # /sbin/modprobe ip_masq_ftp

    # /sbin/iptables -A forward -s 192.168.2.0/24 -j MASQ

    # /sbin/iptables -A forward -s 192.168.1.0/24 -j MASQ

    ```


    On your wireless laptop, complete the configuration by using the route command
    like this:


    ```

    # /sbin/route add default gw 192.168.1.1

    ```'
  merge: -1
  img_proc: true
- pgno: 378
  md: 'This is an easy way to enable roaming access (within the limits of the wireless
    cards) while using a laptop. Other commercial cards might have additional distance
    capabilities, but by using this approach, you can build a small wireless network
    for less than $170 (U.S.).


    # ## Wireless Modems


    If you need to connect to your ISP while on the road, you can also try using Metricom’s
    Ricochet modem. Although it currently supports only wireless connection speeds
    of 28.8Kbps, the service is slated for an upgrade to 128Kbps in late 2000. The
    Ricochet modem is about the size of two decks of playing cards and attaches to
    your notebook’s serial port. The device weighs about 14 ounces and uses a NiMh
    rechargeable battery for about six hours of connect time.


    Mobile Linux users report great success using the Ricochet device, but service
    areas are limited to several major U.S. cities, airports, colleges, and corporate
    campuses. You’ll also need to sign up for service with Metricom, because the Ricochet
    is designed to connect only with Metricom’s network and servers. The service provides
    dynamic IP addressing, e-mail, and news feeds. Dial-in access via land-line to
    Metricom’s servers is provided as an option.


    # ## Wireless Cellular Connections


    If you need wireless access to the Internet while on the road and you can’t find
    a phone jack, you can use one of several cellular-based systems and cell phones
    to dial your ISP. The type of technology, service, and cell phone you use might
    be dictated by your local phone service provider, service area (geographic) coverage,
    features, and price. Basically, four types of services are generally available
    to the casual mobile user, and each has advantages and disadvantages.


    # ### CDMA


    Code Division Multiple Access (CDMA) is another cellular technology that combines
    spread-spectrum frequency management with small cell radius to provide data transmission.
    Slower than TDMA or GSM (discussed in a moment), this digital service has an advantage
    in that you can use your phone as a modem and use a connector that plugs directly
    into your notebook’s serial port. Although there’s no actual modem inside the
    phone, dialing from your computer dials the phone hands-free, and a modem on the
    connecting network does the connection and transmission for you, usually at 19.2Kbps.'
  merge: -1
  img_proc: true
- pgno: 379
  md: '# **IDEN**


    Integrated Digital Enhanced Networks (IDEN) combines digital cell phone, radio,
    pager, and modem technology. This service uses phones that include built-in modems,
    and it can be used directly with your laptop.


    # **GSM**


    Originally named in 1982 for Groupe Speciale Mobile, GSM now stands for Global
    System for Mobile Communications. It also allows global roaming. This service
    allows the use of a GSM phone directly with your notebook’s serial port or through
    a PCMCIA cellular modem.


    # **TDMA**


    Time Division Multiplexing (TDMA) uses different time slots for transmission of
    multiple data streams. You can generally get higher transmission speeds using
    this type of analog service, but most phones require an external PCMCIA modem
    card with a cellular connector and cord.


    For example, using Spring PCS service (CDMA-based) and a Motorola StarTAC and
    connector cable, you can set up kppp to dial into your ISP at 19.2kbps. However,
    when configuring modem speeds for cellular connections made directly through your
    notebook''s serial port, you must use the setserial command to ensure that strict
    transmission rates are used, or the call might not go through.


    To do this, use the setserial command’s spd_normal option, along with the device
    name of the serial port you will use. Connect your phone and laptop, turn on your
    phone, and use setserial like this:


    ```

    # setserial /dev/ttyS0 spd_normal

    ```


    In this example, the phone is attached to the notebook’s COM1 port. You would
    then configure kppp (perhaps creating a "roaming" account!) to use /dev/ttyS0
    and the proper connection speed.


    # **Net Connection Strategies**


    If you’re on the road or away from the LAN and you need to get connected, first
    check to see if your ISP has an 800 number. If it doesn’t, check your ISP’s coverage
    area and get a list of local phone numbers to match your itinerary before you
    go on the road. There’s nothing like wasting time trying to find a local access
    number when you can’t get on the Internet!'
  merge: -1
  img_proc: true
- pgno: 380
  md: 'If you need access to your LAN, and you don''t mind paying for long distance
    (or if your cellular service provider has free long distance), you can configure
    your Linux system for dial-up access.


    # ## Setting up for Dialing In


    Setting up a Linux system for dial-in capabilities is very easy. You need a computer
    with a modem and a phone line to answer the phone. If you have two phone lines
    attached to the computer, after you log in you can dial out and connect to your
    ISP to send and receive software.


    Edit your system''s initialization table, /etc/inittab, and look for these lines:


    ```

    ```bash

    # Run getty in standard runlevels

    1:2345:respawn:/sbin/mingetty tty1

    2:2345:respawn:/sbin/mingetty tty2

    3:2345:respawn:/sbin/mingetty tty3

    4:2345:respawn:/sbin/mingetty tty4

    5:2345:respawn:/sbin/mingetty tty5

    6:2345:respawn:/sbin/mingetty tty6

    ```

    ```


    Each line represents a different Linux runlevel. When you use Linux without X11,
    you run Linux at runlevel 3. When you use X11 with Red Hat or Mandrake Linux (note
    that other distributions might use different runlevels), you use runlevel 5. One
    of the first lines in your /etc/inittab file shows the default runlevel; it might
    look something like this:


    ```

    ```bash

    id:5:initdefault:

    ```

    ```


    To have Linux answer the phone and allow you to log in, you need to use the `agetty`
    command instead of the `/sbin/mingetty` command to monitor runlevel 3. You also
    need to specify the serial port used by your modem. Change this line:


    ```

    ```bash

    3:2345:respawn:/sbin/mingetty tty3

    ```

    ```


    to this:


    ```

    ```bash

    3:2345:respawn:/sbin/agetty -w -I "ATE0Q1&D2&C1S0=1\015" 115200 ttyS0 vt100

    ```

    ```


    The `agetty` command automatically initializes your modem to answer the phone,
    using your modem''s S0 register (set to answer after the first ring in this example).
    Note that the modem is attached to the computer''s COM1 port.'
  merge: -1
  img_proc: true
- pgno: 381
  md: '# **Need to Find agetty?**


    If agetty is not included with your Linux distribution, you can quickly find a
    copy by browsing to


    ```

    ftp://metalab.unc.edu/pub/Linux/system/serial/getty/

    ```


    Alan Wendt’s agetty command is very simple but works well. If you don’t want to
    use agetty, you can also use mggety or uggetty. Look under /usr/doc/mgetty+sendfax
    for details about setting up for dial-in. If you need additional information,
    you can also check the Serial-HOWTO, usually found under the /usr/doc/HOWTO directory.


    Save your changes, and then restart your system using the shutdown command and
    its -r (reboot) option, like this:


    ```

    # shutdown -r now

    ```


    Linux will start the agetty command after booting, and agetty will monitor your
    /dev/ttyS0 serial port for incoming calls. When you dial in, agetty will pick
    up the phone, and after you (perhaps) press Enter, you’ll see a login: prompt.
    Be sure to test your setup before you hit the road!


    # **Additional Service**


    By creating a special user account for PPP or by editing a getty entry in /etc/inittab,
    you can also offer PPP over a dial-up connection. This has the benefit of allowing
    you to use FTP directly over the phone, or to transmit e-mail directly back to
    your laptop. First, enable dial-in service, and then create a ppp user. However,
    you’ll need to change the default /etc/passwd entry from this:


    ```

    ppp:x:501:501::/home/ppp:/bin/bash

    ```


    to this:


    ```

    ppp:x:501:501::/home/ppp:/usr/sbin/pppd

    ```


    You should then create and edit a file named .ppprc in the /home/ppp directory
    to contain this:


    ```

    -detach

    modem

    crtcts

    lock

    :192.168.2.50

    ```'
  merge: -1
  img_proc: true
- pgno: 382
  md: 'Save the file and restart your computer. When you log in, the pppd server will
    assign the IP address 192.168.2.50 to your notebook (make sure your server has
