    # DVD on the Horizon?


    Despite the insipid machinations by the U.S. motion picture industry over the
    cracking of Digital Video Disc (DVD) encryption, Linux users might soon have a
    legal way to play and enjoy DVD movies. Although you can still download, build,
    and install the DeCSS decryption package and related programs from numerous sites
    on the Internet, a company named InterVideo announced in early 2000 that an inexpensive,
    binary-only (of course) driver would be developed and released for Linux six months
    later. Check http://www.intervideo.com/ for the latest details.


    If you have a Creative Labs Dxr2 DVD card for your PC, you can download drivers
    from http://opensource.creative.com/. Note that Creative’s product is a hardware
    DVD decoder and will not work with notebooks!'
