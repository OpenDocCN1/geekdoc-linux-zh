- pgno: 127
  md: '# Booting from CD-ROM


    T his chapter introduces you to the variety of ways you can install Linux on your

    notebook. It’s important to know your options when you’re faced with the task

    of installing Linux on a laptop, and practicing different installations can help

    you gain experience and build confidence. Mobile Linux users are focused, cre-

    atve, and able to adapt to a host of installation techniques, usually as a result
    of

    hardware limitations, such as the lack of an internal CD-ROM or the inability
    to

    boot directly to an installation.


    You’ll learn about the myriad techniques you can employ to get Linux installed

    on your laptop. Learning and practicing these techniques will enable you to

    learn more about your notebook’s hardware and gain experience as a seasoned

    Linux installer.


    Fortunately, most modern laptops (aside from those in the ultralight category)

    come with a bootable CD-ROM. Installing Linux is as easy as inserting the CD-

    ROM, rebooting the notebook, and wiping the internal hard drive clean to install

    Linux. If you use other operating systems, such as OpenBSD or FreeBSD, you can

    opt to have two resident operating systems, creating a dual-boot system.


    Booting to an installation from CD-ROM is without a doubt the easiest way to

    install Linux. Nearly all Linux distributions (with the exception of certain smaller

    collections) provide a main CD-ROM that is bootable. If you attempt to boot

    directly to a Linux installation, but you find that your notebook insists on using

    your floppy drive or laptop’s internal hard drive, check your notebook’s BIOS
    set-

    tings. You’ll need to restart your notebook and then hold down the proper key
    or

    keys to access the BIOS (check the manual provided by the manufacturer).


    Many notebooks use a BIOS from Phoenix Technologies. Depending on your

    BIOS version, the first screen might look like what is shown in Figure 4.1.


    First, make sure your CD-ROM drive is recognized. If your CD-ROM works

    with your notebook’s current operating system, chances are quite slim that you’ll

    have a problem booting Linux. Next, navigate to the Boot menu by using the right

    cursor key. Your BIOS screen should look like what is shown in Figure 4.2.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_128_0.png)


    Figure 4.1 BIOS settings can be critical to successfully installing Linux from
    CD-ROM.


    ![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_128_1.png)


    Figure 4.2 Ensure that your notebook’s internal CD-ROM is first in the boot order
    (at the top of the list) by using the plus (+) key.


    Use the up or down cursor keys to highlight your laptop’s CD-ROM drive. After
    it’s highlighted, press the plus key (+) to move the CD-ROM device to the top
    of the list. This menu represents the order in which your notebook will search
    for bootable devices.'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'When finished, follow your BIOS screen''s directions to save and exit the BIOS
    setup (Phoenix users will press F10 and then Enter). Insert your bootable Linux
    CD-ROM, and then restart your notebook to launch to the installation (assuming
    you''re satisfied with your partitioning strategy).


    # Booting to the Yellow Dog Linux iBook Installation


    Yellow Dog Linux Champion Server 1.2 is installed directly from CD-ROM onto the
    Apple iBook. After preparing an unallocated partition for Linux using Drive Setup
    and rebooting the iBook, install the BootX control panel device. Next, copy the
    files ramdisk.image.gz and vmlinux to your Mac''s System folder. Run BootX to
    select the vmlinux kernel, and then click on the BootX Options button to select
    the Use RAM Disk option. Also be sure to select the No Video Driver option. When
    finished, click on the Linux button in the BootX dialog box. You''ll boot directly
    to the Yellow Dog Linux installation!


    # Booting from DOS


    Another method of launching to an installation involves using DOS and an AUTOEXEC.BAT
    file or boot utility, such as LOADLIN, directly from your Linux CD-ROM. Some distributions,
    such as Red Hat and Mandrake, include a DOSUTILS directory with numerous software
    utilities and batch files to boot directly to an installation. For example, if
    you''re running DOS, or if you have rebooted to the DOS command line from Windows,
    insert your Red Hat CD-ROM, and then navigate to the D: drive''s DOSUTILS directory.
    At the command line, use the LOADLIN command to launch directly to a local installation:


    ```

    d:\DOSUTILS>loadlin autoboot\vmlinuz initrd= .

    \misc\src\trees\initrd-1.img

    ```


    This approach works with Red Hat''s 6.1 Linux distribution. The LOADLIN command
    will boot Linux and then load the installation software to launch an installation.
    You can then install Red Hat Linux using your notebook''s CD-ROM.


    # Creating a Boot Floppy


    Another way to jump to a Linux installation is to boot your notebook using a Linux
    installation boot floppy. You''ll find a number of boot floppies included on your
    Linux distribution''s CD-ROM. These floppies are stored in binary files known
    as images (similar to initrd-1.img, used to boot from DOS). If you buy a'
  merge: -1
  img_proc: true
