  md: '# Other Linux Laptop Links


    Mobile Linux users will find other Web sites devoted to using Linux on notebooks
    or offering Linux preinstalled on laptops. Dell Computer was the first large computer
    hardware company to offer Linux on a laptop, but a number of other companies sell
    Linux preinstalled and configured on various laptop models. Browse Table A.6 for
    various notebook hardware and software Web sites.


