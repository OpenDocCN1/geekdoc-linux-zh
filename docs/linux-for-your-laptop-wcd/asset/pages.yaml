    Most Linux distributions install with a default /mnt/floppy directory, but you
    can make one of your own (as root) like this:


    ```

    # mkdir /mnt/floppy

    ```


    If you insert a DOS-formatted floppy, you can then mount the floppy and make it
    available under Linux like this:


    ```

    # mount -t vfat /dev/fd0 /mnt/floppy

    ```


    This command makes the contents of the floppy (which uses vfat, or long file name
    support) appear under the /mnt/floppy directory. You can then use the normal Linux
    commands—such as ls, cp, mv, and rm—to list, copy, rename, or delete files on
    the floppy at that directory. After working with the floppy, you should unmount
    the diskette using this command:


    ```

    # umount /mnt/floppy

    ```


    Most Linux distributions also come with a floppy entry in the filesystem table,
    /etc/fstab, which might look like this:


    ```

    /dev/fd0       /mnt/floppy           auto    sync,user,noauto   0 0

    ```


    This entry shows that the first floppy drive is normally mounted under the /mnt/floppy
    directory. Linux will try to automatically determine the proper filesystem, and
    any user may read or write to the floppy.


    However, by using other utilities, such as those included with the mtools package,
    you can get around having to mount and then unmount the floppy drive—which is
