- pgno: 457
  md: 'Table A.2 Essential Linux Information Web Sites


    | Site | Description |

    |---|---|

    | http://slashdot.org | Up-to-the-hour news about Linux, Open Source, and geek
    issues |

    | http://www.linuxdoc.org | Home page of the Linux Documentation Project |

    | http://metlab.unc.edu/pub/Linux | A well-known repository of Linux software
    and distributions |

    | http://www.linux.org | Maintained by Linux Online, Inc., this site is a good
    place to find links to local Linux User Groups (LUGs) |

    | http://www.lwn.net | The Linux Weekly News |

    | http://www.linux.com | VA Linux''s Linux portal with loads of great information
    |

    | http://www.kernel.org | A source of the very latest Linux kernels |

    | http://www.linuxhq.com | Another good site for information about the latest
    classic, stable, and development Linux kernels |


    # **Linux Distribution Links**


    In the beginning, there was only the Linux kernel. In the early days, the number
    of distributions, such as Yggdrasil and Slackware, was very limited. However,
    within several years (and especially in the last two years) the number of Linux
    distributions exploded as companies rushed to develop and improve installation,
    performance, and features. Table A.3 lists links to some of the more popular commercial
    and noncommercial distributions. (All sites have links to free software downloads.)


    The Linux distributions listed in Table A.3 are generally based on CD-ROM distributions
    (with the exception of Slackware, uClinux, and Elks). But what if you just want
    to try to run Linux without going through the hassle of partitioning and waiting
    for an installation? In this case, you can turn to a floppy-based Linux distribution
    that will have you up and running in only a minute or so.'
  merge: -1
  img_proc: true
- pgno: 458
