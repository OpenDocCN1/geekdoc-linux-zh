  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_137_0.png)


    Figure 4.10 Enter the hostname or IP address of the remote Web server, along with
    the directory containing Red Hat Linux to install via HTTP.


    on an intranet, the Linux CD-ROM will most likely be installed under the remote
    computer’s /home/httpd/html directory (although this can be up to the system administrator).
    When finished, select OK and press Enter to begin the installation.


    # Installation via NFS


    Yet another way to install Linux is through the use of the Network File System
    (NFS). To set up an NFS installation on a LAN, the remote computer must be running
    the nfsd daemon and have your computer’s IP address or hostname in its /etc/exports
    file. For example, if you assign an IP address of 192.168.2.70, the remote computer
    should have an entry that looks similar to this:


    ```

    /d2/pub                 192.168.2.70    (ro)

    ```


    This entry shows that the computer with the IP address of 192.168.2.70 has read-only
    access to the /d2/pub directory. The Red Hat software would then be available
    under this directory. To install Linux via NFS, attach your notebook to the LAN,
    choose the NFS installation method, and be sure to assign the IP address 192.168.2.70
    for the installation. Proceed through the dialog boxes until you come to the NFS
    Setup dialog box, shown in Figure 4.11.


    Enter the remote server’s hostname (or IP address), along with the directory containing
    the Red Hat software. Select OK and press Enter to begin the installation.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_138_0.png)


    # ## PLIP Installation


    If you have a spare computer and a correctly wired 12-conductor parallel port,
    you can install Linux onto your notebook. Your first task should be to read the
    PLIP- Install HOWTO document, found under the /usr/doc/HOWTO directory or through
    http://www.linuxdoc.org. Although this HOWTO describes using an alternative Linux
    distribution, Debian Linux, you may also use Red Hat Linux.


    The basic procedure is to connect the two computers, set up networking and an
    NFS export or FTP service on the remote computer, and boot your notebook to a
    network installation. When the installation fails to find a network card, you''ll
    be asked to select a driver, as shown in Figure 4.12.


    You might then be asked if you want the installation to autoprobe your notebook''s
    parallel port settings, or to specify settings. In most cases, the autoprobe will
    work, and you can then proceed through the installation. If you have difficulty,
    you might want to try setting up networking between two computers using the same
    parallel cable to make sure it works. You should also make sure that the remote
    computer is not running the line printer spooler daemon, lpd, and that it does
    not have the Linux kernel''s lp.o printer module loaded. For details about setting
    up PLIP networking, see the PLIP-HOWTO.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_139_0.png)


    # Some Alternatives


    Finally, you should know that there are even more ways to install Linux on your
    notebook. If you have access to the Internet, you can download the Slackware Linux
    distribution onto a series of floppy diskettes and then proceed to an installation
    after building a boot floppy.


    According to Patrick Volkerding, Slackware''s creator and maintainer, the distribution
    has grown from 10 floppy disks in 1993 to more than 100 floppies. To install a
    minimal Linux system, you can download Slackware''s A series, create a boot disk,
    and start the installation using your notebook''s floppy drive. Once Slackware
    is installed, you can then add software to enable networking or other devices,
    such as an Iomega Zip drive.


    Slackware Linux may be installed from an Iomega Zip drive. A special "zipslack"
    distribution is available at http://ftp.slackware.com/pub/slackware/slackware/zipslack/.
    You install the zipslack distribution by unzipping the distribution onto an Iomega
    100MB Zip drive and then attempting a boot using the LOADLIN command from DOS:


    ```

    loadlin vmlinux root=/dev/sda4 rw

    ```


    This will launch Linux. After logging in as root, you can create your Linux partitions
    and transnit the distribution to your notebook. This is also a great way to try
    out Linux without partitioning your notebook''s hard drive!'
  merge: -1
  img_proc: true
