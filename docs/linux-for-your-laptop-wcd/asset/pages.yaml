    with Linux preinstalled |

    | http://www-4.ibm.com/software/is/mp/linux/ | IBM’s Linux software page |



    # Used or Refurbished Laptops


    If you want to save some money, you can buy a used or refurbished laptop. Generally,
    you should avoid online auctions or other types of sales and only buy direct from
    the manufacturer. This way, you can get some warranty protection, and you know
    who you''re dealing with. If your new notebook has to go in for repairs, don''t
    be'
  merge: -1
