- pgno: 45
  md: '# ## The Ideal Linux Laptop


    What makes the ideal Linux mobile computer? My definition is "The notebook that
    is right for your needs, at the right price, with compatible graphics and sound
    subsystems, and with the right mix of features." Does this mean that the ideal
    Linux laptop features an internal CD-ROM? Certainly not! Not everyone needs to
    access CDs while on the road (especially if you have a large internal drive and
    play .mp3 audio files). Does your Linux laptop need a floppsy? Maybe, or maybe
    not. Floppy drives add weight, and if you need a backup medium, you might be able
    to use a flash memory card.


    Certainly one constraint will be the keyboard. Ham-fisted keyboard pounders on
    the road for any length of time with a diminutive subnotebook will quickly lose
    their minds or resort to "hunt and peck" two-fingered typing. Another issue might
    be weight. Petite travelers, upon their first trip through the airport lugging
    a 10-lb. desktop replacement, will want to switch to a slimtop or ultralight (or
    build up those biceps).


    Display quality and size can also affect the quality of life on the road. Dinky,
    poorly lit screens can destroy your eyesight, make the display unreadable in sunlight,
    or cramp your style during an X Window session. (Try running a terminal shell
    window using 5-point Agate type on a 640x480-pixel True Scan display to see what
    I mean.)


    Some people like using an external mouse with a notebook. Some notebooks come
    with a touchpad, trackball, or eraser-type pointer (some come with a touchpad
    *and* eraser). Some of these pointers include one, two, or (even better) three
    buttons. If you have cold, clammy fingers or the body temperature of a reptile,
    a touchpad might not work for you. On the other hand, if you perspire a lot, you
    might want to think about a rugged notebook so that your palms'' sweat glands
    won''t short-circuit the keyboard.


    Do you need to work away from an electrical outlet? Having a powerful laptop and
    working with a notebook sporting the power of Big Iron (mainframe computers) can
    be a wonderful thing. But if the battery drains in an hour and you''re nowhere
    near an outlet (such as on a train), you''re stuck with a useless paperweight.
    Battery time can be critical!


    Choosing a notebook is about style as much as anything else. Selected manufacturers
    now market notebooks in different colors, a la Apple Computer''s iBook (discussed
    in this book, and which runs Linux). Speaking of Apple, if you''re a Macintosh
    fan, you can currently choose between an iBook or a G3 PowerBook—a much simpler
    choice than when you''re faced with the mind-numbing array of Intel-based portables
    on the market.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Main Considerations


    Many components of Intel-based notebooks are compatible with Linux. For example,
    you shouldn’t have to worry about a notebook’s serial or parallel port compatibility.
    Keyboards and pointing devices such as crasers and touchpads generally do not
    pose a problem and are easily recognized by the modern Linux kernel. Some of the
    better notebooks, such as IBM ThinkPads, come with three mouse buttons—a definite
    bonus during X11 sessions.


    For full functionality, you should pay particular attention to a notebook’s graphics
    chipset. Configuring a graphical interface for Linux, although not absolutely
    necessary (Linux works quite well in console [text-only] mode without the X Window
    System), can be the key to enjoying a wealth of additional applications, or *clients*
    (in X parlance). Unlike desktop computers, graphics subsystems cannot be replaced
    in a notebook, so your initial choice is critical!


    To find out if the laptop you’re considering is supported by XFree86, the free
    graphical interface for Linux, browse to The XFree86 Project, Inc.’s Web pages
    at

    http://www.xfree86.org/#currentre.


    Follow the link to the current documentation, and then read the documentation
    for the graphics chipset used in the notebook you’re considering. However, if
    you don’t find support, you can also turn to a commercial X Window distribution
    that might fully support the notebook’s graphics card. Browse to XiGraphics’ Web
    page at

    http://www.xig.com/Pages/hardwareSupportLib.html


    You can then browse a list of 3-D, 2-D, and multihedead display cards to see if
    the graphics chipset is supported. You’ll want to make sure that your notebook
    can work with X11 to support the widest range of *resolutions*, measured in horizontal
    and vertical pixels (such as 1024\u00d7768), and *color depth*, or number of colors.
    The number of colors could be 256 (8 bits per plane [bpp]), 15bpp or 16bpp for
    thousands of colors, or 24bpp or 32bpp for millions of colors.


    If sound is important to you, again you’ll need to choose carefully. You won’t
    be able to change your notebook’s sound system. Careful research will tell you
    whether others have been successful in configuring sound on the notebook you’re
    considering. Linux includes support for many different sound cards. However, some
    newer graphics subsystems used in notebooks, such as NeoMagic’s 256AV, also include
    sound support, but they rely on proprietary drivers to play audio CDs and so on.
    If you’re unsure about your notebook, or if you have trouble configuring sound
    using the drivers included with your Linux'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'distribution, check for alternative free sound drivers from the Advanced Linux
    Sound Architecture (ALSA) project, available at


    http://www.alsa-project.org


    You can also check to see if the commercial sound drivers from 4Front Technologies
    will work with the notebook''s sound chipset. Browse to


    http://www.openound.com/ossfw.html


    If you enjoy listening to audio CDs, you''ll definitely want a notebook with either
    an internal or external CD-ROM. You should know, however, that only internal CD-ROMs
    are directly connected to notebook sound systems. If you use an external CD-ROM
    (connected with a PC card interface), you''ll need a patch cable to patch the
    sound output on the external CD to your notebook''s line-in jack.


    Do you want to watch a Digital Versatile Disc or Digital Video Disc (DVD) while
    using Linux? You can''t. At the time this chapter was written, the Motion Picture
    Industry Association of America saw fit to support the arrest of Jon Johansen,
    a 16-year-old Norwegian boy, for cracking DVD''s encryption and distributing the
    software on the Internet. However, you might want to consider a notebook with
    a DVD drive. The drive will work as a regular CD-ROM drive, Linux can read the
    DVD drive format, and some multiple-CD Linux distributions, such as SuSE Inc.''s
    six-CD SuSE Linux, are distributed on a single DVD disk.


    The good news is that you may soon be able to watch DVD movies while using Linux.
    At least one company, InterVideo Inc., has announced plans to release a low-cost
    software DVD player for Linux sometime in late 2000.


    Other features, such as IrDA ports, an internal microphone, the number and type
    of PCMCIA slots, audio or keyboard controls, Advanced Power Management schemes,
    and spindle design, might or might not be important.


    Support for USB was still under development at the time this chapter was written,
    although Linux supports some keyboards and mice in the 2.3.X series of development
    kernels. Also, IrDA support for printing is in flux and might not be finalized
    until the release of stable 2.4 Linux kernels.


    If the notebook you''re considering comes with an internal modem, chances are
    good that it is a "Windows-only" modem. These flaccid, vestigial pieces of junk
    seem to have infected the majority of notebooks (and desktops) on the market as
    of late. One vendor, Lucent, has released a 500K+ Linux kernel module (named lucent.o)
    that might or might not allow limited use of the internal Lucent communications
    port (the module has been verified to work on a number of IBM ThinkPad'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'models, such as the 390X, with a Linux kernel version 2.2.12 or later). You
    can get this driver at


    http://www.linmodems.org


    You''ll find active discussions regarding this class of communication device (if
    you can call it that). Some Linux programmers feel that software-driven modems
    can be used for other tasks, such as voice dialing or call recording.


    My opinion is that software-driven modems are a bad idea and bad engineering.
    This approach to providing communications ability for a notebook might save the
    manufacturer a few pennies, but it puts the consumer at the mercy of the operating
    system and the drivers'' software vendor. For now, avoid any notebook with an
    internal modem, or order the notebook without one of these things if you can.
    Ironically, a very select few notebooks on the market use real modems (one being
    the Sony 505TX/TR series, now destined to be the "classic" Linux notebook).


    In general, you''ll have a better chance of success with Linux compatibility with
    a notebook if the computer is not the "latest and greatest" model. Older models
    (a year or more) have a much better chance of being supported. You should also
    peruse the comp.os.linux.portable Usenet newsgroup for answers to questions about
    compatibility.


    Here are the features I look for when choosing a notebook for Linux:


    +   *   A readable screen display with a resolution of at least 1024x768. Although
    800x600 is acceptable, some X11 clients require 1024x768.


    +   *   A graphics chipset supported by XFree86 that provides at least 16bpp.


    +   *   A compatible sound system with a chipset supported by the Linux kernel
    sound modules. Many notebooks have only one speaker, although newer models might
    have stereo. Nearly all sound tinny, but they should support a line-out or headphone
    jack.


    +   *   A hard drive with a minimum of 2GB of storage, and even more if you are
    doing development or want to install all the latest software and games.


    +   *   A pointing device with at least two mouse buttons (three is even better).
    Apple iBook users must use two function keys to simulate a middle and right button
    click.


    +   *   A minimum of 32MB of RAM (64MB or 128MB is even better).


    +   *   At a minimum, a PCMCIA port supporting at least one Type II card. If the
    notebook doesn''t have an internal CD-ROM, you can at least install Linux over
    a network. Other alternatives include using the Parallel Line Interface Protocol
    (PILP).'
  merge: -1
  img_proc: true
- pgno: 49
  md: '+   * A parallel printer port. This is useful for printing or attaching a parallel-Iomega
    Zip drive.

    +   * At least one serial port. This is useful for attaching a Palm PDA for hot-syncing
    under Linux, or for an external modem.

    +   * A real internal modem. Good luck, though. The industry seems to be moving
    away from real modems in notebooks. (All pre-Pentium notebooks with internal modems
    have a real, or non-software driven, modem.)


    Finally, the good news is that you can buy a computer with Linux preinstalled
    and configured! Although a number of companies sell notebook computers with Linux
    preinstalled, these notebooks usually command a higher price than when purchased
    from the manufacturer or a large reseller. However, Dell Computers now sells its
    Inspiron 7500 notebook with Linux preinstalled. You can also try other vendors,
    such as these:


    +   * <http://www.tuxtops.com>

    +   * <http://www.aslab.com/contents/products.html>


    # ## Selling Your Used Computer


    One way to upgrade your mobile life is to sell your old notebook before buying
    a new one. Most smart sellers use the local classifieds and price their notebook
    according to its proper market value (at least 50 percent less after its first
    birthday). You can also try to sell on the Internet through various Usenet newsgroups
    or an online auction house, but don’t be disappointed if you are consistently
    lowballed on the price. You shouldn’t expect to even recoup the expense of costly
    add-ons, such as RAM or a larger hard drive.


    U.S. small business owners should note that if the full price of the notebook
    is depreciated in its first year of use, you must wait three years before disposing
    of the laptop.


    # ## Buying a Used Computer


    There are ways to get your hands on a (relatively) new notebook. First, you can
    scour the classifieds and hope to find a new model of the desired notebook. An
    alternative is to buy a refurbished notebook. Computer makers such as IBM, Dell,
    and Sony routinely offer refurbished units at considerable savings. The iBook
    used as an example during the writing of this book was a refurb, and much of this
    book was developed using Linux on a refurbished ThinkPad i1720. By dealing with
    a reputable company, you can be assured of getting some warranty coverage from
    the seller.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Some local computer resellers might sell used notebooks. In fact, I have an
    AST Ascentia A61+ laptop purchased locally in 1997 that is still trucking along,
    running Linux 24 hours a day, 7 days a week.


    I do not recommend buying a computer from any FS: (For Sale) posting in any Usenet
    newsgroup. I also recommend not buying through an online auction service (such
    as www.ebay.com) unless you use an escrow service and get the seller to pay the
    escrow charges. This is a much safer way of buying a notebook, and it sure beats
    sending money to someone you''ve never met and not getting a notebook in return.
    There are many tales of woe from online buyers who failed to exercise caution
    and use common sense in pursuing online purchases.


    Whenever possible, pay by credit card, not by check, money order, or cash. You''ll
    have a much better chance of getting consumer satisfaction by threatening to dis-pute
    any charge for faulty merchandise.


    But you should also understand that used notebooks (indeed, any used computer
    equipment) are usually sold "as is." Cavet emptor!


    # Living with Your Choice: Trade-Offs


    If you have to make do with what you have, so be it. But you''ll be much more
    ready for a Linux installation if you learn as much as you can about your computer.
    (See Chapter 2, "Taking Inventory," for details about various components.) For
    example, you should know the following:


    +   * How to turn your notebook off and on

    +   * How to control the speakers or sound system

    +   * Where the PC card slot or slots are located

    +   * The type of pointing device used (most likely PS/2 for Intel computers and
    definitely a one-button ADB desktop mouse for Apple iBook users)

    +   * Any keyboard controls for turning the LCD screen off or on

    +   * Where the microphone is located

    +   * How to insert, remove, or recharge your notebook''s battery

    +   * Where the ports—such as serial, IrDA, line-in, line-out, headphone, USB,
    monitor, and PS/2—are located


    In other words, read your computer''s manual before installing Linux! If you do
    not have a manual, you can try downloading one from your computer''s manufacturer.
    Some companies, such as IBM, not only maintain user manuals for older notebooks,
    but they also offer technical repair manuals containing detailed disassembly information
    for free.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'If you have an old notebook from a manufacturer that has gone out of business,
    you might find a company providing repair services or other information by searching
    the Web. Otherwise, you''ll have to wing it. In general, if the notebook is Intel-based,
    it''s at least a 386 equivalent, and it can run DOS, it can run Linux.


    If you find that Linux does not fully support your laptop, take heart! If the
    laptop is a new model and becomes popular, it will be supported—but it might take
    some time! Major manufacturers are now wising up to the fact that Linux is not
    just a “flash in the pan” operating system, but is here to stay. Users are demanding
    support and are requiring compatibility with Linux.


