- pgno: 308
  md: '# Configuring for pilot-xfer


    Before you can begin using *pilot-xfer* with Linux and your PDA, you need to know
    what serial port to hook up the Palm''s HotSync cable to on your notebook. You
    also need to know the name of the serial port, such as /dev/ttyS0. You can see
    a list of serial ports recognized by Linux when you boot by using the *dmesg*
    command:


    ```

    # dmesg | fgrep tty

    ttyS00 at 0x03f8 (irq = 4) is a 16550A

    ttyS01 at 0x02f8 (irq = 3) in a 16550A

    ttyS02 at 0x03f8 (irq = 9) is a 16550A

    ```


    Next, use your shell (such as *bash*) to create a *pointer* or *environment variable*
    that defines PILOT PORT to point to the serial port. For example, if your HotSync
    cable is attached to COM1, you would use this:


    ```

    # export PILOTPORT=/dev/ttyS0

    ```


    Because most notebooks today come with modern serial ports capable of high-speed
    data transfer, you can automatically set *pilot-xfer* to use the fastest speed
    possible when transferring files. Create an environment variable named PILOTRATE,
    and assign it a serial port speed like this:


    ```

    # export PILOTRATE=115200

    ```


    You''re now ready to try *pilot-xfer*!


    # IrDA, PDAs, and Linux


    You can also use your notebook''s IrDA port and an IrDA-capable Palm PDA, such
    as a Ill, Ille, V, and so on, to back up or install software without resorting
    to a Hot Sync cable. Browse to http://home.instafl.de/wehe/IR-HOWTO.html to learn
    how to configure your notebook''s IrDA port and Linux to work with your Palm PDA.


    # Backing Up Your Palm


    One of the most important things you should do occasionally when using your Palm
    is create a backup of the entire contents of the PDA. To do this using the *pilot-xfer*
    command, use the `-b` option, followed by the pathname or name of the directory
    you''d like to hold the backup software. Next, connect your HotSync cable'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'and insert your PDA into its cradle. For example, to back up your PDA to a
    directory named pii, use pilot-xfer like this:


    ```

    $ pilot-xfer -b pii

    Waiting for connection on /dev/ttyS0 (press the HotSync button now)....

    Rate 115200 too high, dropping to 57600

    Connected

    Back up ''pii/Net Prefs.prc''... OK

    Backing up ''pii/TideDB3Locs.pdb''... OK

    Backing up ''pii/TideDB2Locs.pdb''... OK

    Backing up ''pii/HardBall.prc''... OK

    ...

    ```


    Not all the output is shown here. Note that you do not have to turn on your Palm.
    Simply press the HotSync button on the cradle, and the backup will begin. Note
    also that if the serial port speed is too high, pilot-xfer drops the speed to
    a more negotiable value. After the transfer is complete, you can restore the contents
    of your PDA at any time by again using pilot-xfer, but this time with its -r option:


    ```

    # pilot-xfer -r pii

    ```


    # Synchronizing Your Palm


    Another great feature of the pilot-xfer command is its ability to synchronize
    your PDA with your backup directory. This means that you can synchronize the contents
    of the directory with your Palm using a single command line. Use the pilot-xfer
    command, along with its -s (synchronize) option:


    ```

    # pilot-xfer -s pii

    ```


    Files that have not been modified will not be backed up. To install a new file
    into your Palm, use pilot-xfer’s -i option:


    ```

    # pilot-xfer -i palmOMC.prc

    Waiting for connection on /dev/ttyS0 (press the HotSync button now)....

    Rate 115200 too high, dropping to 57600

    Connected

    Installing palmOMC.prc... OK

    Install done

    ```


    # Using KPilot


    If you’re a Palm PDA user and you use X11 and the K Desktop Environment on your
    notebook, you’ll want to explore the KPilot client. This software is a graphical'
  merge: -1
  img_proc: true
- pgno: 310
  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_310_0.png)


    > Figure 12.1 Use KPilot''s Options dialog box to enter the proper device, speed,
    and user for your Pilot sessions.


    interface for managing and synchronizing your PDA with Linux. Launch this client
    from the Utilities menu of KDE''s desktop panel.


    # Configuring KPilot


    When you launch KPilot for the first time, you''ll see the dialog box shown in
    Figure 12.1. It is used to enter settings for the serial port and speed.


    When you''ve finished entering the correct device (such as /dev/ttyS0) and speed
    (such as 57600), click on the OK button. If you select the Start KPilot at Hot-Sync
    option, KPilot will start automatically when you click the HotSync button on your
    Palm''s cradle. (Your Palm should be in the cradle, and the serial cord should
    be properly attached to your notebook''s serial port.)


    # KPilot Backups


    When the main KPilot dialog box appears (as shown in Figure 12.2), click on the
    File menu (or press Alt+F), then choose the Backup menu item.


    If the user information in the Palm does not match your settings in KPilot, you''ll
    be asked to confirm before backup operations begin, as shown in Figure 12.3.


    As the backup proceeds, you''ll see a small Sync Status progress dialog box (shown
    in Figure 12.4), listing each database or client being saved from your PDA.'
