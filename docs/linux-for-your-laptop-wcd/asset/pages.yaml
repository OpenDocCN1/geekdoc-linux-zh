    # Apple iBook Boot Management with BootX


    Apple iBook Linux users can boot Linux in at least two ways. The first way uses
    Apple''s OpenFirmware boot ROM in the iBook, along with a utility named Yaboot.
    The second, easier, and more common way is to use the BootX Control Panel device,
    launched after your Mac starts.


    The Yaboot utility is somewhat similar to LILO, and uses somewhat similar syntax
    in its configuration file. One benefit of using Apple''s Open Firmware prompt
    and Yaboot is that you will be able to use the internal iBook modem. To boot Linux
    using the Yaboot boot loader (included on the Yellow Dog Linux CD-ROM), copy the
    files vmlinux, yaboot.tbxl, and yaboot.conf to your iBook''s hard drive while
    running MacOS. Edit the yaboot.conf file to look like:


    ```

    `timeout=5

    default=linux


    image=hd:8,/vmlinux

    label=linux

    root=/dev/hda10


    novideo`

    ```'
