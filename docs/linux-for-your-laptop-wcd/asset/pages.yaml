- pgno: 149
  md: 'Figure 5.4 shows that FIPS displays a new partition table, with the new partition
    offering 950MB for Linux. Type `c` to continue, and FIPS will create the new partition.
    If you re-run FIPS, you can continue to create other partitions. However, this
    step is unnecessary and can be done during your Linux installation.


    # Apple''s Drive Setup


    Installing Linux on the Apple iBook requires that you use Apple''s Drive Setup
    command, preferably on an external drive, to create non-HFS or HFS+ partitions
    in AUX format. You can install Yellow Dog Linux on the iBook''s internal drive;
    however, you''ll first need to create room for Linux by following these basic
    steps:


    +   1. Reboot your iBook with your Mac OS Install CD (by holding down the C key).

    +   2. Use the Apple Drive Setup utility''s Custom Setup button to reformat your
    iBook drive with an HFS (not HFS+) partition and an unallocated partition.

    +   3. Reinstall the Mac OS or use your Restore CD.


    Note that early iBooks came with only a 3.2GB drive, but newer models sport a
    6.4GB drive. On the 3.2GB model iBook, you can safely allocate 1.5GB for the Mac
    OS HFS partition, do a full restoration, and still have 800MB left over for additional
    applications or data. However, if you perform a full installation of Yellow Dog
    Linux on the unallocated 1.5GB partition, you''ll end up with less than 100MB
    free space left on the Unix partition. If you need more room for both operating
    systems, you''ll need to upgrade the internal hard drive on your iBook. If you
    need more room for Linux, install only a minimal Mac OS, and do not perform a
    full restoration.


    # Partitioning Problems


    Problems can occur when you partition your hard drive. Many of the problems you
    can run into when using FIPS are detailed in documents under the dosutils/fipsdocs
    directory on your Linux CD-ROM. Here are some documents you might want to read
    if you have problems:


    +   * **fips.doc.** Section 10 details troubleshooting problems.

    +   * **fips.faq.** Contains frequently asked questions, including common problems.

    +   * **special.doc.** Discusses using FIPS with OS2, OnTrack Manager, and DOS
    compression utilities.


    Technical information regarding FIPS is in the file techinfo.txt.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_150_0.png)


    # Step-by-Step Installation of Red Hat Linux


    This section details a step-by-step installation of the latest version of Red
    Hat Linux. As you know by now, there are many different ways to install Linux
    and different Linux distributions. This section details one way to install Linux—by
    booting using a boot disk with an inserted CD-ROM.


    The easiest way to install Linux is to boot directly from CD-ROM. You''ll need
    to make sure your notebook''s BIOS supports booting from CD, and that the CD-ROM
    device is listed as the first device, as shown in Figure 5.5.


    You''ll generally find boot images included on your Linux CD under the /images
    directory. To quickly create a boot disk using Linux, mount the CD, insert a blank
    floppy disk, and use the Linux dd command like this:


    ```

    # mount /mnt/cdrom

    # dd if=/mnt/cdrom/images/boot.img of=/dev/fd0

    ```


    This will create a boot disk. You can then reboot to perform your installation.
    If you''re using DOS, use the RAWRITE command (found under the /dosutils directory)
    to create your boot disk.


    # Installation


    When the installer boots, you''ll see the first installation screen, as shown
    in Figure 5.6.'
