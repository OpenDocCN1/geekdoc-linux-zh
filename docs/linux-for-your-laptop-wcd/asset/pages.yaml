  md: 'clicks and repeat rate. Fortunately, most notebook users will want to change
    only one or two keys. For example, many notebooks place the Caps Lock key on the
    far left of the keyboard, while the Ctrl key (used quite often by a number of
    Linux text editors and other programs) resides in an awkward position, sometimes
    near the special Fn key.


    Swapping the Caps Lock and Ctrl keys is easily accomplished for X11 sessions by
    entering the swap into your XF86Config file:


    ```

    XIOptions "ctrl:swapcaps"

    ```


    You can also do this on-the-fly during your X11 session with the xmodmap client.
    For example:


    ```

    # xmodmap -e ''add lock = Control_L''

    # xmodmap -e ''remove lock = Caps_Lock''

    # xmodmap -e ''add control = Caps_Lock''

    # xmodmap -e ''remove control = Control_L''

    ```


    If the Caps_Lock entry really bothers you, disable the key by configuring it to
    return no value:


    ```

    # xmodmap -e ''keycode 66 = NoSymbol''

    ```


    These settings may also be placed in a file named .Xmodmap in your home directory.
    Another use for xmodmap is to turn the useless “Windows” key on many notebook
    keyboards into something more useful. If you use a window manager such as Fvwm,
    you can edit its resource, or configuration file, .fvwmrc, in your home directory
    to bind the key to different menu operations.


    # Your Notebook''s Pointer


    Notebooks could use a mouse even before the advent of windowing operating systems.
    Early versions used a spare serial port to provide the ability to click menus
    and buttons, even under DOS. Since then, a wide variety of hardware pointers have
    been introduced with laptops. The forms of these pointers range from a clip-on
    trackball to today''s wireless mouse. Here are the main types of pointers now
    in common use on today''s notebooks:


    +   * **Trackpoint.** Also known as an “eraser” mouse for its tiny, soft rubber
    jacket, usually embedded in the middle of the notebook''s keyboard. This pointing
    device works quite well, and it is an ergonomic improvement over'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'other devices in that your hands don''t have to leave the keyboard in order
    to move the mouse. One potential drawback is that these can get dirty very quickly,
    wear out, or, if improperly installed, damage the notebook screen if the lid is
    closed. Manufacturer replacements, such as for the IBM ThinkPad series of notebooks,
    can cost $4 each!


    +   * **Trackball.** An earlier notebook pointing device, this pointer relies
    on a rolling ball resting on internal mechanical wheels to move the cursor. Prone
    to dust, dirt, and other foreign materials, the trackball is no longer in common
    use (at least on notebooks). Abuse and subsequent failure of this component on
    a notebook will render the built-in pointer useless.


    +   * **Touchpad.** Initially introduced to the consumer market by Apple Computer,
    Inc. on an early line of PowerBook notebooks, the touchpad spawned a variety of
    pointers from different manufacturers. Using similar electromagnetic principles
    as early drawing tablets, these pointers use your finger as a stylus to move the
    cursor. Modern variants support finger taps and scrolling. At least one line of
    notebooks, the Sony Vaios, includes a stylus with a built-in touchpad variant,
    the VersaPad. This allows you to enter signatures and even draw on the pad like
    a tablet. A similar device is the Cirque GlidePoint, licensed to Alps Electric
    Company. The touchpad type of pointing device has the advantage of being practically
    indestructible; barring failure of internal circuitry, a touchpad should last
    for the life of the notebook.


    Other pointer variants include those such as the rocker pad, found on Toshiba''s
    now-defunct line of Libretto subnotebooks. Pointer motion is achieved by pressing
    the small (half-inch) rubber pad in different directions. Infrared (IrDA) pointers
    have been around for several years and are growing in popularity.


    # Cursor Drifting?


    If you have an IBM ThinkPad and you notice your cursor occasionally drifting a
    quarter of an inch across the screen, don''t worry! Leave it alone, and it will
    stop. The cursor is recalibrating!


    Mobile Linux users with a Synaptics touchpad can download a configuration utility
    named *tpconfig* at


    http://www.compass.com/synaptics/'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'This program lets you set or reset pointer movement, tapping, edge scrolling,
    and button use. Unfortunately, tpcconfig is not compatible with the Linux General-Purpose
    Mouse driver (gpm), which provides mouse functions for the text-only console.
    gpm is usually run as a background service or process, known as a daemon, and
    it must be “killed” before you use tpcconfig.


    gpm provides the ability to cut and paste text when using the console. However,
    you should be aware that if gpm is started with its -S option, it can also run
    “special” commands, triggered by triple-clicking the left and right mouse buttons.
    In this instance, you will hear the speaker beep twice. If you then press the
    left or right button within three seconds, the system will reboot! If you press
    the middle button, the system will shut down!


    The gpm driver is usually started with Linux boots. Its initialization script
    is found, using Red Hat and similar Linux distributions, under the /etc/rc.d/init.d
    directory in the script named gpm. If you have problems using your notebook''s
    pointer while in the console, first read the gpm man page, and then alter the
    initialization options to configure your mouse. You can kill the currently running
    gpm process by using the kill command, followed by the process number, like this:


    ```

    $ ps aux | fgrep gpm

    root 417 0.0 0.0 1172 16 ? S Jan31 0:00 gpm -t pa/2

    $ kill -9 417

    ```


    Here, the output of the ps command is piped through the fgrep command to search
    for the running process. Then the shell''s kill command is used to kill the process
    according to its process number.


    # Left-Handed? You''re Not Left Out!


    Lefties have a hard enough time dealing with a right-handed world. To add insult
    to injury, most Linux installations automatically set up and configure a notebook''s
    mouse buttons for right-handed users! However, you can easily fix this with the
    xmodmap command like this:


    ```

    xmodmap -e "pointer 3 2 1"

    ```


    You can also use KDE''s Control Center (or kcontrol client), as shown in Figure
    2.3. KDE will remember your settings between sessions.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_72_0.png)


    **Figure 2.3** *The kcontrol client,* part of KDE’s Control Center, *may be used
    to change and save mouse settings such as button order.*


    # # Merits of Three Buttons


    The most desirable pointer for use with Linux and the X Window System is the three-button
    mouse. In right-handed terms, the left mouse button is mouse button 1. It is used
    to click buttons, click and drag to select text, double-click to launch programs,
    and so on. The middle mouse button, or mouse button 2, is used to paste text and
    graphics or grab scrollbars in xterm terminal windows. The right mouse button,
    or mouse button 3, is used by many X11 window managers for alternative menus,
    such as when changing the properties of a right-clicked object.


    The majority of notebooks on the market have only two mouse buttons, probably
    due to the fact that most notebooks, aside from Apple’s line of Macintosh notebooks
    (which have only one mouse button), are manufactured in a monopolistic software
    market. Because Windows and its variants use only two mouse buttons, why include
    a third mouse button at additional cost? Thankfully, at least one manufacturer,
    IBM, sees fit to produce laptops with three buttons. This makes life with Linux
    a bit easier!'
  merge: -1
  img_proc: true
- pgno: 73
  md: "When you install Linux, your notebook's pointer might or might not be automatically\
    \ recognized. If the pointer is recognized, as with most Intel-based laptops on\
    \ the market, Linux will configure your device as a two-button PS/2 mouse. When\
    \ asked if you want to \"Emulate 3 buttons?\", click OK. If you don't, your mouse\
    \ will have a left and right mouse button, but no middle button. If you do click\
    \ OK, the middle mouse button will be emulated by a simultaneous press of the\
    \ left and right mouse buttons. Awkward? Yes, but at least it works!\n\nConfiguration\
    \ of the pointer for X11 sessions is, like the keyboard, contained in the Pointer\
    \ section of your system's XF86Config file. For example:\n\n```\nSection \"Pointer\"\
    \n Protocol \"PS/2\"\n Device \"/dev/mouse\"\n Emulate3Buttons\n Emulate3Timeout\
    \ 50\nEndSection\n```\n\nThis abbreviated pointer section shows that the pointer\
    \ configured for X is a PS/2 two-button mouse. Middle button emulation is 1, with\
    \ a timeout of 50 milliseconds. The timeout value tells the X server (running\
    \ in the background) how long to wait before deciding that the middle button (button\
    \ 2) has been pressed.\n\n# The Apple iBook Mouse\n\nWhen installing PowerPC or\
    \ Yellow Dog Linux for the Apple iBook, the mouse is configured as a one-button\
    \ ADB mouse. Linux for the Apple supports up to 35 different pointing devices.\
    \ Installing Linux until the mouse is configured can be a little challenging,\
    \ because you have to use the keyboard to select the proper buttons and dialog\
    \ boxes. But after it's configured, the mouse works well. According to what the\
    \ Yellow Dog Linux folks (http://www.yellowdoglinux.com) say in their documentation\
    \ (for the 1.1 distribution), in order to support three-button emulation, you\
    \ must use the following Linux kernel boot prompt to tell Linux (and X) to use\
    \ the F11 and F12 keys as mouse buttons 2 and 3:\n\n```\nadb_buttons=1,103,111\n\
    ```\n\nThis does not work for the iBook; instead, you have to use this:\n\n```\n\
    adb_buttons=103,111\n```\n\nThis setting may be entered at the Linux boot prompt\
    \ or into the BootX options field when booting Linux."
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Symbolic Pointer Device


    Linux can recognize and use many different pointer devices. This means you can
    attach an external rodenstimeter (mouse) to your notebook and use it during your
    sessions. In general, most distributions create a symbolic link, or pointer, to
    the actual device under the dev directory, named /dev/mouse. For example:


    ```

    # ls -1 /dev/mouse

    lrwxrwxrwx 1 root root 5 Oct 12 08:53 /dev/mouse -> psaux

    ```


    This shows that the pointer used is attached to /dev/psaux, or a PS/2 port on
    the computer. A serial mouse, on the other hand, would probably look like this:


    ```

    lrwxrwxrwx 1 root root 5 Oct 12 08:53 /dev/mouse -> ttyS1

    ```


    This indicates that the mouse is attached to a serial port, similar to COM2 under
    DOS. Under Linux for the iBook, this link looks like this:


    ```

    lrwxrwxrwx 1 root root 5 Oct 12 08:53 /dev/mouse -> a2dmouse

    ```


    # Other Input Devices


    Linux and X11 support many other types of input devices. Look at the file named
    xinput under the /usr/X11R6/lib/X11/doc directory. You''ll see a listing of more
    than a dozen devices, including the following:


    +   - AceCad table

    +   - Calcomp DrawingBoard tablet

    +   - Elographics touchscreens

    +   - Joysticks (which have to be attached through a PCMCIA adapter)

    +   - MicroTouch touch screen stylus

    +   - SGI button box

    +   - SummaSketch tablet

    +   - SWITCH virtual device

    +   - Wacom cursor

    +   - Wacom eraser

    +   - Wacom stylus


    You''ll probably see many more compatible devices.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# **TrackPoint Utilities for Linux**


    Computer artists familiar with drawing tablets know that the stylus, or pointer,
    is usually also a pressure-sensitive device that recognizes three-dimensional
    movement. This means that the artist puts slight pressure on the stylus when using
    a paintbrush tool, the spread of digital paint will be greater. Lighter strokes
    result in a lighter brush effect. Unknown to most TrackPoint users is that this
    pointer also responds to pressure!


    Browse to Till Straumann’s Web page at


    http://www-hft.es.TU-Berlin.DE/~strauman/tp4utils/


    You’ll find two TrackPoint utilities: the **tp4d** server and **xt4a**, a client
    command you can use to explore the TrackPoint’s capabilities under Linux.


    # # Your Notebook’s Memory


    Few, if any, problems seem to arise between Linux and notebook memory (problems
    seem to crop up to a much greater degree with desktop systems). Notebook memory
    can be proprietary and very expensive. If you’re the fortunate owner of an extremely
    popular and long-lived line of notebooks (with “long-lived” being a relative term
    in today’s typical notebook model “life span” of 12 months or less!), memory should
    be a bit less expensive. Some notebook manufacturers have built models to accept
    standard sockets, and others use extremely proprietary form factors (such as various
    Sony models). Buy as much memory as you can afford. If you’re sure you can buy
    from a third party and install it yourself, save some memory on your purchase
    and use it to buy and install more RAM.


    The biggest question you’ll face will be “How much?” in terms of memory and cost.
    To that, I answer, “As much as you can afford, but no less than **64MB**.” Even
    though Linux and X11 can run on 16MB, be realistic. (I used Linux for a long time
    on one 32MB laptop, and it is still running 24/7 in the basement.) If you want
    to use X11, the K Desktop Environment, StarOffice, and Netscape and play .mp3
    files at the same time, you’ll need a bit of breathing room. Even though Linux
    and most clients use memory efficiently, with 64MB you’ll be able to use most
    clients without problems.


    If you want to use VMWARE’s VMware for Linux to install and run other operating
    systems, such as Windows 2000 or BSD UNIX at the same time, you’ll need even more
    memory—at least as much as for a separate computer for each instance.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'Memory is one area in which notebooks don''t seem to have caught up with desktops.
    Many laptops sold today still have motherboard memory limitations of less than
    256MB, while most desktops support 768MB or more.


    To find out how much memory Linux has recognized after booting, use the output
    of the dmesg command piped through fgrep, like this:


    ```

    $ dmesg | fgrep Mem

    Memory: 127956k/1331008k available (1044k kernel code, 416k reserved, 1532k data,
    60k init)

    ```


    This shows memory in a 128MB notebook. You can also get a quick “snapshot” of
    memory in use during your X11 KDE session by using the KDE Control Center, as
    shown in Figure 2.4.


    Although newer “stock” Linux kernels purportedly recognize installed memory up
    to 2GB on Intel-based computers, you might occasionally run into problems. If
    Linux does not see all your memory, you can pass a kernel message at the Linux
    Loader (LILO) boot prompt or embed your notebook''s memory into LILO''s configuration
    file, /etc/lilo.conf, like this:


    ```

    append= “mem=320M”

    ```


    ![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_76_0.png)


    The kwinfoclient, part of KDE''s Control Center, may be used to get a succinct
    snapshot of your system''s current memory usage.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'This would tell Linux that 320MB of RAM is installed and available. After Linux
    boots, there are ways to conserve memory. Here are some ways to do this:


    +   - **Run only the software you need.** Unless your laptop is a Web server,
    do you really need to run Apache? Although some Linux distributions, such as SuSE,
    use a locally running Web server to provide an HTML-based help system, you should
    limit the number of running processes and background processes. Red Hat Linux
    users should use the ntsysv command to turn off or limit the number of services
    started when Linux boots.


    +   - **Examine memory.** Use the free, vmstat, asmem, kmem, xvsiw, and other
    utilities to monitor what''s going on, especially if Linux starts to use excessive
    amounts of memory, including swap space. Use the top command, or other process-reporting
    utilities such as ps or ptstat, to determine which programs can use the most memory.


    +   - **Choose software with a small memory “footprint.”** If you write only short
    text files and don''t do any programming on your laptop, not using StarOffice
    or other suites, such as Apxilix, can save a lot of memory. The X Window System
    (its server) can require at least 8MB or more RAM. Audio players, such as .mp3
    players, suck enormous amounts of memory (and CPU cycles) for buffering. In general,
    text-based applications might require less memory (the emacs editing environment
    is an exception).


    # Your Notebook''s Hard Drive


    Almost all Intel-based laptops (and, indeed, the Apple iBook) use Integrated Drive
    Electronics (IDE)-type hard drives, so this section concentrates on and uses IDE
    drive examples. Newer versions of these drives are known as Enhanced or Expanded
    Integrated Drive Electronics (EIDE). Dealing with your notebook''s hard drive,
    especially if you''re not technically oriented and are installing Linux for the
    first time, can be very daunting. But don''t worry! As long as you have backed
    up any important data, you can''t hurt your computer by installing Linux!


    When you install Linux, you''ll need to *partition* (make room on) your hard drive.
    There are a number of ways to do this. You can use free or commercial software
    to perform this operation. Partitioning seems to cause more grief than any other
    installation operation for new Linux users. This is probably because most business
    and home users have never needed to partition a hard drive before; most computers
    come with software preinstalled on a freshly formatted disk. It is also because
    the Macintosh OS runs on Motorola CPUs and has never posed a serious challenge
    to software for'
  merge: -1
  img_proc: true
- pgno: 78
  md: "Intel-based computers (even though Apple ported the MacOS to the Intel Pentium\
    \ in 1992 and later killed the project).\n\nIf you're new to Linux and are worried\
    \ about partitioning, fear no more! Now there's a great reason to learn about\
    \ partitioning and an even better reason to reformat your existing hard drive.\
    \ Experienced notebook Linux installers routinely wipe a new notebook's hard drive\
    \ clean of any trace of the operating system previously residing on it, and you\
    \ can too.\n\nMost Linux distributions include the `FIPS` command. This DOS program\
    \ is used to create room for Linux on an existing FAT, FAT16, or FAT32 hard drive.\
    \ Be sure to use the latest version, usually found under the dosutil/FIPS20 directory\
    \ on your Linux CD-ROM. Here are the basic steps in making room for Linux on a\
    \ notebook where you want to boot Linux or Windows:\n\n+   1. Defragment your\
    \ existing system.\n+   2. Create a bootable DOS diskette.\n+   3. Copy FIPS.EXE,\
    \ RESTORRB.EXE, and ERRORS.TXT onto the floppy.\n+   4. Reboot your notebook with\
    \ the diskette.\n+   5. Run FIPS and create the partition.\n+   6. Boot to the\
    \ Linux installation (during which you'll create and format additional Linux partitions).\n\
    \nYou can also use a commercial partitioning utility, such as PowerQuest's PartitionMagic,\
    \ to create an extra partition, even in Linux ext2 format.\n\nWhen you format\
    \ the new partitions and install Linux, you create a new *file system* (file and\
    \ directory structure) on the hard drive. The name of the Linux filesystem is\
    \ ext2, and it has a number of benefits over other filesystems, such as speed,\
    \ reliability, and resistance to fragmentation. Using the Linux `disk` command\
    \ to display partition information on a sample installation would show the following\
    \ (for example):\n\n```\n$ fdisk /dev/hda\nCommand (m for help): p\nDisk /dev/hda:\
    \ 240 heads, 63 sectors, 1559 cylinders\n\nUnits = cylinders of 15120 * 512 bytes\n\
    \n   Device    Boot     Start     End    Blocks    Id  System\n/dev/hda1   * \
    \        1      218   1648048+    c  Win95 FAT32 (LBA)\n/dev/hda2          219\
    \     1559  10137960    5  Extended\n/dev/hda5          219     221     22648+\
    \  83  Linux\n/dev/hda6          222     499    2101648+  83  Linux\n/dev/hda7\
    \          500     534     26458+  82  Linux swap\n```"
  merge: -1
  img_proc: true
- pgno: 79
  md: '| /dev/hda8 | 535 | 881 | 2623288* | 83 | Linux |

    | /dev/hda9 | 882 | 1559 | 5125648* | 83 | Linux |


    This listing shows a dual-boot system with a Windows FAT32 partition using `/dev/hda1`,
    the first partition on the volume `/dev/hda`. Linux is installed on five subsequent
    partitions, with 22MB devoted to `/dev/hda5` (to hold the `/boot` directory),
    a spare 2.1GB partition on `/dev/hda6`, a 264MB Linux swap partition on `/dev/hda7`,
    another spare 2.6GB partition on `/dev/hda8`, and a 5.1GB partition on `/dev/hda9`
    (most likely to hold the root directory).


    You''ll encounter a dozen other types of file systems when you learn more about
    Linux.


    # The Linux File System


    When Linux is installed on your hard drive, the directory structure, or *pathnames*,
    make up the Linux file system. The Linux file system''s base (`/` or *root*) directories
    are listed in Table 2.5.


    Table 2.5 **Base Linux Directories**


    | Name | Description |

    | --- | --- |

    | bin | Linux programs |

    | boot | Where the Linux kernel is stored |

    | dev | Device files |

    | etc | System configuration files |

    | home | Directories for users and FTP, HTTP, and so on |

    | lib | System software libraries |

    | lost+found | Storage for recovered files |

    | mnt | Where other file systems are mounted |

    | opt | Optional software storage |

    | proc | A snapshot of the running system |

    | root | The root operator''s directory |

    | sbin | Programs normally run only by root |

    | tmp | Temporary storage |

    | usr | Programs, libraries, and X11 |

    | var | Process-specific directories (fax, modem, printer, mail) |'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'For example, if your name is Fred Smith, your Linux *username* (log-in name)
    will most likely be fsmith. Your home directory is then referred to as /home/fsmith.


    # # Linux Drive Utilities


    Some Linux hard drive utilities you will use on a daily basis during your sessions
    include the *ls* (list files) command; the *at* (display filesystem statistics)
    command, which shows how much free space is used and available; and the *du* (disk
    usage) command, which shows how much disk space is used by different directories.


    The KDE *kdiskfree* client, shown in Figure 2.5, can be used if you’d like to
    see a quick chart of your hard drive space usage.


    Linux also includes utilities to *mount* or *unmount* filesystems. This means
    you can make other filesystems, such as hard drives, Zip drives, or CD-ROMs, appear
    or disappear in the filesystem, usually under the /mnt directory. If you configure
    your notebook to boot Linux or Windows, and the Windows partition resides on the
    first partition, you can make the Windows partition appear under the /mnt/dos
    directory like this:


    ```

    # mount -t vfat /dev/hd1 /mnt/dos

    ```


    You can then copy, delete, rename, or move files to and from Linux and your Windows
    desktop. To make the Windows partition “disappear” from use, use the *unmount*
    command like this:


    ```

    # unmount /mnt/dos

    ```


    ![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_80_0.png)


    **Figure 2.5** The *kdiskfree* client presents a graphic of filesystem usage for
    any mounted volumes, including other filesystems such as FAT32.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Apple iBook Linux users can also use the `mount` command to access the Macintosh-formatted
    partition. After you install Linux on the iBook, the MacOS HFS filesystem should
    reside on /dev/hda8. You can then mount it like this:


    ```

    # mount -t hfs /dev/hda8 /mnt

    ```


    To see the files in the Macintosh Desktop Folder, use the `ls` command like this:


    ```

    # ls /mnt/Desktop Folder/

    ```


    You’ll find several hardware-specific drive utilities included with Linux. One
    of these is `hdparm`, used to display or set IDE hard disk parameters. This command-line
    interface program has nearly 30 different options you can use to see or change
    your hard drive’s characteristics.


    One of the most common uses is to set the spindown, or idle time, of the internal
    hard drive. This can be handy to help save battery power if you’re on the go.
    For example, to set your notebook’s drive to spin down after a certain amount
    of time, use the `hdparm` command’s `-S` option, followed by a number (see Table
    2.6).


    **Table 2.6 hdparm Standby Timeout Values**


    | Value | Timeout |

    |---|---|

    | 0 | Turns off standby mode |

    | 1 to 240 | 5 seconds to 20 minutes |

    | 241 to 251 | 1 to 11 units of 30 minutes |

    | 252 | 21 minutes |

    | 253 | Vendor-determined |

    | 255 | 21 minutes, 15 seconds |


    For example, to have your hard drive spin down after 60 seconds of inactivity,
    use the `hdparm` command like this:


    ```

    # hdparm -S 12 /dev/hda

    ```


    This command works for Intel-based notebooks and the Apple iBook! Note that if
    you make this change, the hard drive will spin down with Windows or the MacOS.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Your Notebook''s CD-ROM


    Most notebooks, including the iBook, use an *AT Attachment Packet Interface* (ATAPI)
    CD-ROM drive. Most of these CD drives work quite well with Linux (although I am
    aware of one incompatibility issue that was quickly resolved with a kernel recompile).
    Your main concern when buying a notebook is that you can set your laptop''s *basic
    input/output system* (BIOS) to change the boot order of any internal storage devices,
    such as the floppy, hard drive, and CD-ROM. Fortunately, most notebooks support
    this. However, in the case of one line of Sony notebooks with an external CD drive,
    you could indeed set the laptop''s BIOS to boot from CD-ROM, but this would work
    only with Sony''s drive—a nasty maneuver!


    Although CD-ROM writer and CD-ROM rewritable drives are available for desktop
    computers, at the time this chapter was written, only one notebook manufacturer
    (Dell) offered this option in a laptop. You''ll find a drive compatibility chart
    at


    http://www.gug.de:8080/cgi-bin/winni/lsc.pl


    For a helpful HOWTO on how to burn CDs using Linux software and CD-ROM writer
    or rewritable drives, browse to


    http://www.gug.de/~winni/linux/cdr/html/


    Your notebook''s CD-ROM drive should be automatically recognized when you boot
    Linux, even if a CD is not inserted. Look for output similar to this:


    ```

    hda: TOSHIBA DVD-ROM DRD-0624, ATAPI CDROM drive

    ```


    This output shows that Linux has detected a DVD CD-ROM attached to /dev/hdc. Using
    this information, you can easily mount the CD with this:


    ```

    # mount -t iso9660 /dev/hdc /mnt/cdrom

    ```


    Note that most storage devices, fixed and removable, usually have entries in the
    file /etc/fstab, your system''s filesystem table. This file is created when you
    install Linux, and it makes it even easier to mount devices such as CD-ROMs. Using
    the preceding example, the /etc/fstab entry might look like this:


    ```

    /dev/cdrom /mnt/cdrom iso9660 user,noauto,nosuid,exec,ro 0 0

    ```


    In this entry, /dev/cdrom is a symbolic link to the /dev/hdc device, and the mount
    point is defined as /mnt/cdrom. This means that you can insert a CD-ROM into the
    drive and then use this:


    ```

    # mount /mnt/cdrom

    ```


    The contents of the CD-ROM will appear under the /mnt/cdrom directory.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# **DVDs and Linux**


    Linux can mount and read DVD CD-ROMS. But even though there is software available
    to allow you to watch DVD movies under Linux, the motion picture industry has
    hounded, pursued, and sued anyone posting or distributing this software on the
    Internet, claiming the software is illegal and violates trade secrets. (The software
    is still available despite these absurd efforts.) Until the current hoopla subsides,
    Linux users can still benefit from having a DVD CD-ROM drive. At least one Linux
    distribution manufacturer, SuSE, Inc., is now distributing its Linux software
    in DVD format. This saves a lot of space, weight, and packaging material, and
    it allows one CD to be used for permanent software storage instead of six!


    # ## The Parallel Port


    The parralel port, known under DOS as an LPT (line-printer terminal) port, is
    still included on most notebooks sold on the market, despite the increasing popularity
    and number of USB printers. This port is generally a female 25-pin connector that
    is similar in appearance to the older DB-25 serial port. Unless you are spe-cially
    designed, printer cables have one male 25-pin connector for attachment to your
    laptop, with a D-shaped Centronics plug connector on the other end for attachment
    to your printer.


    Not many mobile Linux users lug around a printer while on the go. One solution
    is to use a portable printer with an IrDA interface, such as a Canon BJ C-50 (see
    the section “Infrared Port” later in this chapter). When you boot Linux and have
    an attached printer that is turned on, the printer should automatically be detected
    (as shown in the following output from the dmesg command):


    ```

    parport0: PC-style at 0x378 [SPP,ECP,ECPPS2]

    lp0: using parport0 (polling).

    ```


    If you do not see this output, check your cable fittings, and make sure that your
    /etc/conf/modules file contains this line:


    ```

    alias parport_lowlevel parport_pc

    ```


    Parallel-printer support for Linux is provided by the parport and lp kernel mod-ules,
    loaded into memory when required from the /lib/modules/linux-2.2.X/misc directory,
    where X is the version of your Linux kernel. Serial and parallel-port printers
    may be configured manually under Linux or by graphic administration'
  merge: -1
  img_proc: true
