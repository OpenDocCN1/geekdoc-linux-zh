    # Creating /dev/modem with Red Hat''s modemtool Command


    As root, run the modemtool command to create a default /dev/modem device for Linux.
    Type modemtool on the command line of an X11 terminal window. After you press
    Enter, you''ll see the dialog box shown in Figure 15.1.


    Choose a serial port used with your modem, and then click on the OK button. You
    can also create this link manually using the ln command. For example, if your
    modem is attached to a port corresponding to DOS COM1, you would type


    ```

    # ln -s /dev/ttyS0 /dev/modem

    ```


    The ls command will then verify this new symbolic link:


    ```

    # ls -l /dev/modem

    lrwxrwxrwx    1 root root    10 Mar 23 09:44 /dev/modem -> /dev/ttyS2

    ```


    # Dialing Out with Communications Programs


    Miquel van Smoorenburg''s minicom program is located under the /usr/bin directory.
    It is a friendly communications program you can use to test your serial port and
    modem. As root, start the X11 version of minicom, named xminicom (actually a shell
    script that launches minicom in a separate terminal window) from the command line
    of an X11 terminal window like this, using its -s (setup) option:


    ```

    # xminicom -s

    ```'
