- pgno: 39
  md: 'This chapter introduces you to the world of mobile Linux and can help you choose
    a notebook to use during your Linux sessions. If you''re new to Linux—welcome!
    If you''re an experienced Linux user who wants to choose a laptop for Linux or
    move your desktop to a notebook, you''ll find interesting tips and tidbits regarding
    notebooks in general. I''ll try to give both new and experienced users enough
    information to make an educated choice when choosing a mobile platform for the
    best operating system in the world!


    # ## Matching Your Needs


    Before you choose a notebook for Linux, you should understand the general category
    and variety of size and weight, or *form factors*, for mobile computers available
    on the market. Computer manufacturers are currently in stiff competition as notebook
    computers gain more and more market share. This is evident in computer store showrooms,
    industry trade shows, and computer hardware catalogs. Notebooks are increasingly
    capturing market share as consumers demand more power in a portable platform.
    Some industry pundits believe that notebooks will eventually replace desktop computers,
    as the distinction and lines blur between model generations.


    The range and power of computers changes every 18 months or so, usually as the
    result of new manufacturing techniques. These advances include faster central
    processing units (CPUs), higher-density random access memory (RAM), improved monitor
    and Liquid Crystal Display (LCD) technology, larger-capacity hard drives, and—most
    important for mobile Linux users—increased miniaturization.


    For example, from 1995 to 2000, standard CPU speeds on typical Intel-based computers
    increased more than nine-fold, from 75MHz Pentiums to the newer 700MHz Pentium
    IIIs. Nominal RAM installation went from 16MB to 128MB, and hard drive storage
    jumped from 1GB to a more-or-less standard 12 to 16GB. At least one notebook model
    on the market today boasts an internal hard drive capacity of 75GB!


    Manufacturers have also introduced new connection hardware and protocols for computers.
    These improvements include Infrared Data Association (IrDA) ports, the consumer-oriented
    Universal Serial Bus (USB), the improved CardBus for'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'Personal Computer Memory Card International Association (PCMCIA) Type II and
    less-common Type III PC cards, and the new ultra high-speed IEEE-1394 Firewire
    for digital data transmission. Many computers now feature graphics cards that
    have more memory than was routinely installed on computers only a few years ago.
    In some cases, it matches or exceeds the amount of installed RAM!


    The point is that many of these new features and increased capabilities are now
    debuting on notebook computers! Whereas four years ago, mobile users had to make
    do with "catch-up" hardware, and notebook computing lagged behind the power of
    desktop computers, this game no longer applies. You can now get a laptop computer
    that easily matches or exceeds the power of a desktop computer.


    # Consider Carefully


    Sometimes you might have to make do with what you have, but if you intend to purchase
    a notebook for Linux, do some research! Even though many modern notebooks feature
    removable elements, such as a hard drive, memory, or CD-ROM drive, you''re generally
    stuck with the installed CPU, graphics chipset, ports, and chassis features. Although
    there are ways to use a different pointing device or keyboard, when you''re on
    the road you usually stick with the basic features of your notebook. You should
    also understand that this market is a moving target; it''s always in flux and
    always changing. What was today''s high-end notebook quickly becomes tomorrow''s
    dinosaur hardware.


    # Mobile Form Factors


    Mobile computers were introduced right alongside the very first desktop personal
    computers. Veteran mobile users might remember the Osborne I with its 51-character
    display, the KayPro II with its dual floppy drives, or the NEC Startle, which
    all ran the CP/M operating system (the Startel used a read-only memory [ROM] operating
    system). The Radio Shack Tandy Model 100, with its embedded Beginners All-purpose
    Symbolic Instruction Code (BASIC), enjoyed large popularity. Following these first-generation
    models were early Disk Operating System (DOS)-based computers such as the lunch-pail
    Morrow Pivot and the luggage Compaqs.


    Although many of these computers are still in use and continue to serve admirably
    today, none of them may be used with the modern Linux kernel, which requires a
    minimum Intel 386-based chipset. However, these early computers helped define
    the notebook market, and many form factors still survive.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# 8


    Chapter 1: Choosing a Notebook for Linux


    Mobile computers come in many different sizes and formats, running a number of
    different operating systems. These form factors generally break down into several
    categories (they are listed here according to size):


    +   - **Luggable.** A mobile chassis computer equal to a desktop, weighing up
    to 20 lbs. or more, usually offering a large (often tube glass) display, removable
    keyboard, and internal expansion slots. It generally is used for industrial applications
    or environments. It usually does not include a battery, so it needs to be plugged
    in. It’s capable of running Linux.


    +   - **Desktop replacement.** A notebook with a 14-to-15-inch or greater display,
    weighing up to 10 lbs. or more. It usually features a larger keyboard and multiple
    slots or “bays” for extra batteries, hard drives, and floppy, Zip, LS-120, or
    CD-ROM drives. Its battery life is one to two hours or possibly more. This is
    a complete computer with most supported connectivity ports, such as IrDA, USB,
    serial, printer, video, monitor, keyboard, and mouse. It’s capable of running
    Linux.


    +   - **Notebook.** A broad category of mainstream laptops, 1 or more inches thick,
    weighing from 4 to 7 lbs., usually with a 12-to-14-inch display. It might have
    a three-spindle design (hard drive, floppy drive, and CD-ROM drive). It generally
    has built-in IrDA, serial, printer, monitor, USB, and single PS/2 keyboard or
    mouse ports. It’s capable of running Linux.


    +   - **Slimtop.** Generally weighs from 3 to 6 lbs. and might be 1 inch thick.
    It generally has a two-spindle design with an internal hard drive and CD-ROM.
    It might use an external floppy or require a port replicator or docking station
    to provide serial, printing, or video ports. It might offer IrDA and one or more
    Type II PCMCIA slots. It also has a tinny sound system. It’s capable of running
    Linux.


    +   - **Ultright, or subnotebook.** Weighs 3 lbs. or less and can be less than
    1 inch thick. These extremely slim computers generally have a smaller display—12
    inches or less. Most, if not all, lack an internal CD-ROM drive and have a one-spindle
    design with an internal hard drive and external floppy. This model has a tinny
    sound system. It might have a built-in IrDA port and Type II PCMCIA slot. It generally
    requires a port replicator or docking station. Some (such as the Sony Vaio) use
    magnesium casing instead of plastic for rigidity. It’s capable of running Linux.


    +   - **Mini-notebook.** Handheld, lightweight computer with a diminutive or half-size
    display. It has tinny sound (if any). It has a cramped mini-keyboard or'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'keypad. It might have a built-in hard drive. Some units that run Win-\ndows
    CE, known as Pocket PC, are available. This model might have\none or more connectivity
    ports, such as a serial or Type II PCMCIA slot.\nIt might be pen-based. It might
    or might not be capable of running\nLinux. (Some of the better-known minis are
    the Toshiba Libretos, which\nrun Linux quite well.)


    +   * Handheld, also known as a Personal Digital Assistant (PDA). Features shirt-pocket
    convenience. As long as the unit isn''t running Pocket PC, its battery life can
    be measured in weeks or months. It usually features a single connectivity or IrDA
    port, it''s usually pen-based, and it generally weighs several ounces. Most, if
    not all, will not run Linux. (However, the TRG Pro Palm PDA is reported to boot
    and run Linux, and progress is being made on porting Linux to several PDAs, such
    as the Casio E-100 and E-105.)


    As you can see from this list, size, weight, and expandability can be important.
    Other issues can also factor into your choice of platform for Linux on a notebook:


    +   * Processor type and speed. Notebooks with Pentium III processors are now
    quite common. Advances from companies such as Transmeta, due to intro- duce extremely
    low-power “intelligent” CPUs for the mobile market, might provide features you''ve
    been waiting for in a laptop. Generally, the faster the CPU, the more heat it
    generates, requiring a possibly noisy fan for cooling. Faster CPUs generally also
    require more power, increasing battery drain and decreasing mobility.


    +   * Graphics. For a long time, a Super Video Graphics Array (SVGA) display of
    640×480 pixels, then 800×600 pixels, was considered standard. Today, however,
    many lighter-weight notebooks feature Extended Graphics Array (XGA) displays of
    1024×768 pixels with color depths of thousands of col- ors. The IBM 770Z was the
    first to introduce a 1280×1024 display. The industry leader is now the Dell Inspiron
    SVGA+ display, providing a whopping 1400×1050 pixels!


    +   * Expansion. After you buy a laptop, you''re generally stuck with its features.
    Some notebooks allow you to remove or add internal components. Many offer port
    replicators or docking stations to add additional connectivity, sound, or networking.
    Adding more hard drives, CD-ROM drives, or other storage usually involves an external
    device that might or might not require its own power.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'In most cases, by choosing a lighter and more compact device, you sacrifice
    features. You must decide which model and type of mobile platform provides the
    best price, weight, and features. One of the most often-asked questions on Internet
    Linux discussion groups is "What is the best laptop for Linux?"


    This is a good question, and it’s much better to ask it before you buy a laptop
    for Linux! But it’s not easy to sort out the responses. The best notebook for
    one person might not be the best notebook for another person. Some notebook owners
    are unwilling to purchase a laptop with a single dead LCD pixel, while others
    won’t even notice. Some users buy a notebook with no intention of going on the
    road, while others need a computer that can be thrown in the back of the car at
    a moment’s notice.


    Also remember that notebooks are quite different from desktop computers. You will
    need to do some research (and I’ll offer you some tips) on picking a notebook
    with the most compatible hardware.


    # ## Who Makes Notebooks?


    Although many name-brand computer manufacturers, such as IBM, Compaq, and Dell,
    market notebook computers, you might be surprised to learn that many branded laptops
    are actually made under contract by other companies! This is actually good news,
    because it means that there might be other models quite similar to the one you
    purchase that can share upgrades, add-ons, or additional peripherals. Notebooks
    are notorious for requiring specifically manufactured hardware such as batteries
    or RAM, or replacement items such as floppy drives or keyboards.


    According to International Data Corp., in 1998 the majority of laptops sold in
    the U.S. were made by Toshiba, Compaq, Dell, IBM, and Gateway. The rest of the
    market was split among other vendors.


    In some cases, you might be able to save quite a bit of money by buying a similar
    off-brand notebook. The trade-off may be in service, warranty, or convenience,
    such as being able to buy only through mail order, or only receiving technical
    support from a Web page. You’ll have to make that choice.


    Table 1.1 is a short list of manufacturers, brands, and models of laptops that
    are the same or similar. Be warned: Some models vary according to features!'
  merge: -1
  img_proc: true
