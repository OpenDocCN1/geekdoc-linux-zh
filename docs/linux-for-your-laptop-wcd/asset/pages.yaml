    # Putting It Together with Automation


    Linux comes with not only the tools you need to handle finding and deleting files,
    but also the software required to automate the process.


    By using the cron daemon and your system''s crontab table, you can set up Linux
    to automatically search for and delete unwanted files. Log in as root, and then
    use your favorite editor to open the /etc/crontab file. You might see something
    like this:


    ```

    SHELL=/bin/bash


    PATH=/sbin:/bin:/usr/sbin:/usr/bin


    MAILTO=root

    HOME=/


    # run-parts


    01 * * * * root run-parts /etc/cron.hourly


    02 4 * * * root run-parts /etc/cron.daily


    22 4 * * 0 root run-parts /etc/cron.weekly


    42 4 1 * * root run-parts /etc/cron.monthly

    ```


    The /etc/crontab file contains directions for the cron daemon, which is started
    when you boot Linux. This software, which runs in the background, looks to this
    file every minute for tasks to run.


    In this example, the cron daemon looks into the /etc/cron.hourly directory every
    hour on the hour. Once a day at 4:02 a.m., it looks at /etc/cron.daily for tasks.
    Every Sunday at 4:22 a.m., it runs tasks in the /etc/cron.weekly directory. And
    on the first day of every month at 4:42 a.m., the daemon runs the tasks listed
    in /etc/cron.monthly.'
