- pgno: 215
  md: 'This chapter introduces a number of Linux commands and strategies you can use
    to make the most of your notebook''s hard drive, accessories, and RAM. You''ll
    learn about commands that can control your hard drive, utilities you can use to
    automatically clean up your drive, how to compress files, and how to manage your
    notebook''s memory. You''ll also see what steps you can take to use Linux on notebooks
    that have 16MB of RAM, or less.


    # Maximizing Drive Space


    Linux comes with many different drive utilities that work with different types
    of storage media, ranging from floppies to hard drives to flash RAM cards. Most
    of these utilities are designed to make Linux work better with your hardware,
    but in some cases you can squeeze out a little extra performance and storage area
    by running these programs.


    Table 8.1 lists just some of the commands normally included with a Linux distribution.
    You''ll learn about some common uses for these commands in the following sections.


    # Using Floppy Disks


    Most notebooks (with the exception of the Apple iBook) come with an internal or
    external floppy disk drive. Linux supports the floppy fdisk through a generic
    device, such as /dev/fd0, for the first drive or specific devices, like this:


    ```

