    # The PCMCIA Port


    Most laptops come with one or more PCMCIA slots. These slots support 70-pin devices,
    usually the size of a credit card (although some are a bit larger). Notebooks
    that have two of these slots can support one of the increasingly uncommon Type
    III PC cards, which use at least one connector but take both slots. In many cases,
    you can use two Type II PC cards in a notebook at the same time. However, a growing
    number of notebooks, especially in the ultralight or thinner categories, support
    only one Type II slot. Also, some Type II cards, although they require only one
    slot, use both slots anyway.


    Your notebook will provide power to the inserted PC card, so many devices do not
    need external power. On the other hand, larger external hard drives and earlier
    external CD-ROMs might also require an external AC adapter (unless batteries are
    an option).


    In the last several years, the notebook industry has adopted the CardBus standard,
    which allows faster data transfer through the PCMCIA port (the more common 16-bit
    transfer rate has a limit of about 2 to 3Mbps). Linux supports hundreds of the
    common 16-bit PC cards. Unfortunately, due to the frantic pace of technology and
    development and the dearth of support from some manufacturers, support for'
