    \ in this script may be used to control your PC cards before and after sleep:\n\
    \n```\n```bash\nsleep)\n        /sbin/cardctl eject 0\n        /sbin/cardctl eject\
    \ 1\n        /etc/rc.d/init.d/pcmcia stop\n        /etc/rc.d/init.d/network stop\n\
