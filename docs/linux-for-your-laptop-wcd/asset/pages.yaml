  md: 'his chapter introduces techniques and software you can use to make the most
    of your notebook''s display during your Linux sessions. You''ll see how to run
    multiple logins, run and suspend programs, set colors and fonts for the console
    and X11, start multiple X11 sessions, and maximize your screen''s real estate.
    After learning some of the tips and tricks outlined here, you''ll be well on your
    way to devising your own techniques as a mobile Linux user!


    Let''s start with a discussion of the Linux command-line interface, known as the
    console, or text-only mode. Knowing how to use the Linux command line, or the
    shell, is an important skill and forms the basis for learning everything else
    about Linux. For users migrating from other operating systems and who aren''t
    familiar with DOS, the command line might at first seem intimidating—but don''t
    worry! You can quickly master the command line by understanding a few simple concepts
    and learning a small number of commands.


    # Using the Console


    The main interface to the Linux kernel, which is the core operating system, is
    the shell. Linux comes with nearly a dozen different shells, but most users will
    opt for the default shell, named bash (the Bourne-Again Shell) just one of thousands
    of programs provided by the Free Software Foundation, and it''s critical to working
    with Linux. The shell interprets your commands and sends information to the Linux
    kernel, which in turn launches your commands or provides other services, such
    as opening, reading, writing, and closing files.


    The bash shell has a number of different features, such as providing in-memory
    variables, known as environment variables; a customizable prompt, or shell prompt;
    built-in help; and the ability to send input or output to the display, other programs,
    or other files, which is known as input/output redirection. Table 9.1 lists some
    common environment variables you''ll use in your bash shell.


    Input and output redirection is used to specify where keystrokes, text, or programs
    get input and where the results should be sent, such as to a file or device. For
    example, you can build an instant catalog of all files under the /usr/doc directory
    like this:


    ```

    $ ls -lR /usr/doc >helpfiles.txt

    ```'
  merge: -1
  img_proc: true
