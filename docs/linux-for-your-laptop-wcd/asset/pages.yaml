- pgno: 26
  md: '# Introduction


    This book is about using the Linux operating system on notebook computers. With
    the advent of Linux, laptop users who want an affordable yet powerful UNIX-like
    desktop operating system no longer have to dream about being able to afford what
    only several years ago was out of reach of ordinary mortals. Using Linux on a
    laptop is champagne computing on a beer budget!


    If you’re new to Linux, don’t worry. You’ll find tons of information in this book
    about getting this hot operating system installed, started, and configured on
    your laptop. I can’t do all the work, however; you’ll need to invest some time
    and effort in order to get the most out of Linux. Just remember: You’re not alone!
    There are lots of places to go for help. Experienced Linux users were once “newbies”
    too!


    Linux is the computer operating system for the new millennium. It fulfills the
    early promise of personal computing for the ordinary user: capable, useable, powerful,
    portable computing at low cost without compromise. With Linux, the magic of personal
    computing is back! No longer will budget-minded users be held hostage by the high
    costs of commercial software. Linux allows those who have scrimped and saved (or
    put themselves in hock) to buy desired hardware to step off the insidious treadmill
    of software licensing, royalties, and upgrades.


    Linux is the kernel or core of a free and immensely popular operating system.
    Linux is not new; it was first introduced in 1991 over the Internet. However,
    ever since its debut, Linux has enjoyed an incredible growth in popularity among
    enlightened personal computer users. This growth has continued despite the absence
    of newspaper, magazine, and television advertising. In the face of all odds, and
    without corporate or industry support, the number of Linux users and small-business
    adopters has continued to grow. This has occurred despite the pooh-poohing of
    entrenched PC journalists, many of whom tried to trash early versions of Linux
    as a “toy operating system” or a “hobbyist’s nightmare” and who, to this day,
    still haven’t installed or tried Linux. The recent wailing and gnashing of teeth
    in the computing media is the sound of these entrenched “experts” doing a 180-degree
    turn in their coverage of Linux, combined with the anguished cries of exasperation
    by advertising departments peddling Fear, Uncertainty, and Doubt by an encumbered
    and licensed software industry still catering to a monopolistic environment.


    Linux is an in-your-face upstart aimed at upsetting the software industry apple
    cart. There are several ingredients in its incredible recipe for success: Combine
    the personality and talent of a young Finnish programmer named Linus Benedict'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Torvalds, add the communications capabilities of the Internet, mix in the efforts
    of thousands of programmers around the world, toss in a networking graphical interface,
    wrap the operating system in an Open Source licensing agreement, and then give
    it away with source code for free!


    Free!? Yes, Linux is free. More than any other aspect of Linux, the fact that
    Linux is free seems to be the most confusing to the corporate information technology
    industry. It''s almost as if there''s an attitude that "We only want expensive
    and proprietary software that puts us at the mercy of a large corporation. Free?
    It can''t be any good!"


    As the last year leading up to the publication of this book will attest, those
    corporations and naysayers without the savvy to adopt or understand the Open Source
    paradigm just don''t get it. The recent Open Source movement is a direct outgrowth
    of the popularity of Linux. It provides a mechanism for the computer software
    and hardware industry to benefit by providing some measure of openness in design
    to enable additional utility for existing or new customers and to provide new
    avenues of revenue using this open thread to customers.


    Despite recent adoption as an industry buzzword, Open Source is not a new idea
    or concept. Computer users have shared ideas and source code for as long as computers
    have existed. Early PC users routinely shared source code and “fixes” to enrich
    the computing experience.


    This book is about what happens when free software explodes on the scene and collides
    with rapid advances in portable computing. And the almost linear growth in the
    use of Linux almost exactly tracks the new generations of notebook hardware!


    Laptops are used by many different people in many different jobs. Many owners
    are not programmers, but professionals who use a laptop and want to benefit from
    the power of the desktop in a compact form factor. Whether you''re a “suit,” scientist,
    or student, you can benefit from the hints, tips, and other information in this
    book to get the most out of your computer. This book is squarely aimed at Linux
    laptop users who want to use their computers to the fullest without problems:
    power user wannabes on the road, in the office, at home, in school, or out in
    the field. I’ll assume you have access to the Internet, electronic mail, and a
    World Wide Web browser.


    I’ll try to explain complicated accessories and notebook features in simple terms,
    and hopefully offer good advice on how to work productively. I’ve included such
    tips as how to maximize screen real estate, how to work on and save documents'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'without fear of disk crashes or power outages, and how to properly configure
    the XFree86 X Window server to run correctly.


    This book should also help you when you''re on the road by providing commonsense,
    low-cost approaches to finding, transferring, and storing information, and by
    providing pointers to sources of specialized software and hardware.


    # What Is Linux?


    Linux is a POSIX-compliant, UNIX-like operating system that has inherited the
    best features of SysV and BSD UNIX. Linux is the *kernel* (core) of the operating
    system, and a *Linux distribution* is a collection of software accompanying Linux.
    Linux is a fast, reliable operating system that runs on many different types of
    computers, including CPUs from Sun, Compaq, Motorola, and Intel.


    Linux was originally envisioned as a desktop operating system, but programmers
    from around the world have contributed source code, patches, and enhancements
    to make Linux a viable server operating system with capabilities far exceeding
    its original design. Linux provides an incredible spectrum of support for networking
    protocols, filesystems, and hardware devices.


    # How to Pronounce Linux


    According to Linus Torvalds, Linux is pronounced “Lib-nucks” (somewhat like “linen”).
    Red Hat Linux users will find a short audio clip named `sample.au` under the `/usr/share/sndconfig`
    directory. You can play this clip, which is a recording of Linus pronouncing Linux,
    using Red Hat’s `sndconfig` command after successfully configuring Linux to match
    your computer’s sound card. You can also find a copy at Eric S. Raymond’s home
    page at http://www.tuxedo.org/~esr/faqs/linus/english.au


    # A Short History


    Linux has been popular almost since the early days of its release. Although its
    potential was recognized by only several hundred users, interest in Linux grew
    exponentially, surging to more than 100,000 users in a couple of years to an audience
    of more than 15,000,000 today.'
  merge: -1
  img_proc: true
- pgno: 29
  md: "# Introduction\n\nAccording to Linus, the first public release of Linux on\
