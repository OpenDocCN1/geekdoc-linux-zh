    administration tool.


    Red Hat (and Mandrake) Linux users use the printtool client, shown in Figure 2.6.
    This tool contains specific settings for several hundred compatible printers and
    can configure local, remote, and networked printers. The printer definitions are
    entered into your system''s printer capabilities database, /etc/printcap.


    When you print with Linux, nearly all documents are first saved as PostScript.
    This PostScript stream is then "filtered" through a print filter named ps, which
    then converts the PostScript file to the proper printer control language. What
    does this mean? It means that when you use Linux, you can turn your cheap, bargain-bin
    $99 color inkjet printer into a level 2 PostScript printer! Raw PostScript files,
    graphics, and other documents are easily printed under Linux. Your distribution
    comes with literally hundreds of graphics utilities and conversion programs.


    Your notebook''s parallel port may be used to attach devices other than printers.
