- pgno: 341
  md: 'In the next two sections, you’ll learn about two of the more popular portable
    printers in the $300 (U.S.) price range. Both work well with Linux, but you should
    not consider these the definitive portable models, because a number of printers,
    such as the Citizen and Pentax models listed in Table 14.1, are much smaller and
    lighter. Before purchasing a portable printer for Linux, always make sure that
    your dealer offers a no-questions-asked return policy in case you find that the
    printer does not offer the compatibility, speed, or features you need when printing
    under Linux.


    # **HP 340cbi**


    The HP340-series printer is a veteran portable printer that has been around for
    a while. Built with typical HP ruggedness, this printer is smaller than some of
    the smallest of the HP inkjet models, such as the HP400. This printer features
    the following:


    +   * Removable NiCad battery

    +   * IrDA port (an attachment to the Centronics port on the printer)

    +   * Standard parallel-printer cable

    +   * Dimensions: 12.2 inches × 2.6 inches × 5.8 inches

    +   * Weight: 4.3 to 5.4 lbs.

    +   * Speed: 2 pages per minute for quality black-and-white and 4 to 7 minutes
    per page for color

    +   * Dots per inch: 600×300 for black-and-white and 300×300 for color

    +   * Pages per charge: not available

    +   * Paper weight range: 16- to 24-lb. paper

    +   * Pages per cartridge: not available

    +   * Time to charge: not available

    +   * Lifespan of battery: not available

    +   * Sheet-feeder capacity: 30 sheets of 16-lb. paper


    This printer, although labeled as a portable, would not be a welcome companion
    in your backpack or shopping bag. However, it is fairly rugged, and it’s more
    likely than most to survive shaking, banging, and vibration. Happily, it is quite
    compatible with Linux as a local or networked printer. Unhappily, its IrDA port
    does not work with the current Linux IrDA implementation or utilities. This is
    unfortunate, because this printer is a workhorse, includes a 30-page sheet feeder,
    and otherwise works well attached to a notebook or a LAN.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# **Canon BJC-50**


    The Canon BJC-50 is a very compact, lightweight printer that easily fits into
    a backpack or briefcase. This road-friendly printer sprints through black-and-white
    print jobs with surprising speed for its size. Here are some features of this
    printer:


    +   * Removable LiI on battery

    +   * IrDA port built into the printer

    +   * Nonstandard (on the printer''s end), short parallel-printer cable

    +   * Dimensions: 11.9 inches × 4.4 inches × 2 inches

    +   * Weight: about 2 lbs., including battery

    +   * Page-per-minute speed: about 7 in black-and-white and 2 in color

    +   * Dots per inch: 720×360 for color

    +   * Pages per charge: not available

    +   * Paper weight range: 17- to 28-lb. paper

    +   * Pages per cartridge: about 170 quality black-and-white; about 40 high-quality
    color

    +   * Time to charge: about 6 hours for a 100 percent depleted battery

    +   * Lifespan of battery: longer than NiCad

    +   * Sheet feeder capacity: optional; otherwise, manual feed


    The Canon BJC-50 is the smallest of the Canon BubbleJet series. A larger sibling,
    the Canon BJC-80, has nearly all the same features, including a sheet feeder,
    which is sorely missed on the BJC-50. When you print with the BJC-50, you have
    to manually hand-feed each new page and press a button on top of the printer.
    Although this is fine for one- or two-page print jobs, you might want to shell
    out a little more money for the optional sheet feeder.


    Besides its speed, two other features make this printer (and even the larger BJC-80)
    a great portable printer for the mobile Linux user. First, its built-in LiI on
    battery means more pages per charge, faster charging time, and longer battery
    life. Second, it works with Linux IrDA! This is a definite bonus, because you
    can go on the road and forgo not only a transformer, but also a printer cable!


    Read on to learn about printing with Linux and how to configure Linux to work
    with the HP340 and Canon BJC-50.'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# ### Printing with Linux


    Most Red Hat–based Linux distributions use the Berkeley Software Distribution
    (BSD) printer spooling system. Others, such as Caldera’s OpenLinux and SuSE Linux,
    might use an improved hybrid system named LPing. These print-spooler systems work
    through the lp d daemon, which runs in the background, waiting for print jobs
    to appear in a selected directory, such as /var/spool/lpd/nameofprinter. _nameofprinter_
    is the printer you define when you create a printer for Linux (see the next section).


    # ## Alternative Printing with LPing


    LPing is a new and enhanced print spooling system available for Red Hat–based
    Linux distributions. LPing is also used by other distributions, such as Caldera’s
    OpenLinux and SuSE Linux. This system is transparently compatible with BSD’s lp
    d but offers enhanced security features and better controls for managing large
    printer installations on big networks. LPing is compatible with Red Hat’s print
    filter system. For more information, see the LPing URL under “Resource Information”
    at the end of this chapter.


    When a document appears in the printer’s spool directory, lp d spawns a copy of
    itself to take care of printing the document according to the printer’s specifications,
    contained in the printer’s entry in the Linux printer capabilities database, /etc/printcap.
    The main daemon is used to control print queuing, ordering of print jobs, and
    your system’s printers.


    Many, if not most, Linux applications output print documents and graphics as text
    documents in the PostScript language. These PostScript documents are then automatically
    sent or _filtered_ through the Ghostscript interpreter, _gs_, and then translated
    to HPCL for output to your printer, according to a specified filter entry in the
    printer’s /etc/printcap entry.


    # ### Creating a Printer


    To create a printer for Linux, you need to create a proper entry in /etc/printcap.
    A single printer may have multiple entries and different names in /etc/printcap.
    This way, you can define the same printer as a color printer, gray-scale printer,
    or black-and-white-only printer. Although you can manually edit /etc/printcap
    (as root) with a text editor, most mobile Linux users prefer to use a software
    tool with a'
  merge: -1
  img_proc: true
