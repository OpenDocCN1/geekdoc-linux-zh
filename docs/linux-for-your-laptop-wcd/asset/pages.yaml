  md: '+   - normal. Uses normal VGA text mode.

    +   - extended. Attempts to use 80×50 text mode.

    +   - ask. Just before booting, prompts for a number, corresponding to a displayed
    text mode.


    Results between different notebooks will vary. For example, at the LILO boot:
    prompt, you can try this:


    boot: vga=ask


    Press Enter. You might see an error message like this:


    ```

    No such image. [Tab] shows a list.

