    # # Using Microphones


    Another input device commonly included with many notebooks today is the built-in
    microphone. Many laptops also have a line-in port alongside a headphone or stereo
    output jack. Linux readily supports microphone recording, but you must have properly
    configured Linux to work with your notebook’s sound system.


    # ## Recording Utilities


    There are many different types of recording utilities for Linux, but few Linux
    distributions include actual sound recording software. Although several sound
    mixer clients are always found on every Linux distribution’s CD-ROM, you might
    have to search for, download, and build your own recording software. This is not
    difficult, because directions are generally included with the software’s archive,
    either in tarball (.tgz) or .rpm format.


    You might be able to find a number of clients through links such as http://www.linuxstart.com/applications/multimedia/audiosound.html,
    http://www.freshmeat.net, or, if you’re a KDE user, http://www.kde.org.'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'However, to jump right to one of the best voice recording software clients
    for Linux, the KDE `krecord` client, browse to Gerd Knorr’s home page at http://me.in-berlin.de/~kraxel/krecord.html.
    You can download, and then build and install, the `krecord` client quickly and
    easily. For example:


    ```

    ```

    $ tar xvfz krecord*tar*

    $ cd krecord*

    $ ./configure

    $ make

    $ make install

    ```

    ```


    That’s all there is to it! Of course, you should have KDE installed to begin with.
    You should also decide whether you will use your notebook’s built-in microphone
    or a separate microphone attached to your notebook’s line-in jack.


    Be sure to restart the KDE desktop’s panel after installing `krecord` (to update
    your desktop KDE menus). You can then start `krecord` from the desktop panel’s
    Multimedia menu, or from the command line of an X11 terminal window like this:


    ```

    ```

    $ krecord &

    ```

    ```


    You’ll then see the dialog box shown in Figure 10.7.


    The `krecord` client has a number of familiar buttons and controls, such as record,
    stop, play, fast-forward, and rewind. But before you begin recording, be sure
    to set your microphone or line-in input up and your volume output down. Otherwise,
    you’ll get a lot of squelch, feedback, background noise, or no recording at all.
    Start the `kmix` client from KDE’s Multimedia menu, and then adjust the controls
    as shown in Figure 10.8.


    ![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_269_0.png)


    **Figure 10.7   The KDE `krecord` client features simple voice recording controls
    but also supports drag-and-drop features of the KDE desktop for Linux.**'
