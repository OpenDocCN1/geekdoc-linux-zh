    The hostname command to set a simple hostname, such as debby for your system.
    You can also configure network devices after you boot Linux.


    When finished, you should then install the base system. Select "Install the Base
    System," and choose


    mounted : already mounted filesystem


    Again select the /debian directory and press Enter. Continue pressing Enter, and
    you''ll then see the installer downloading and installing the base Debian GNU/
    Linux system onto your notebook''s hard drive, as shown in Figure B.7.


    After the base system has been copied to your hard drive, you should then select
    the "Configure Time System" item. After you press Enter, you''ll then be asked
    to select your time zone, as shown in Figure B.8.


    ![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_473_1.png)


    Figure B.7 The Debian GNU/Linux installer will copy and decompress a base system
    onto your notebook''s hard drive.'
  merge: -1
  img_proc: true
- pgno: 474
  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_474_0.png)


    Figure B.8 Select your time zone and location for your system.


    Use the Tab and arrow keys to select your zone and location, and then press Enter.
    You''ll then set the notebook''s time to local time or GMT. After configuring
    the time, select the “Make Linux Bootable Directly from Hard Disk” menu item and
    press Enter.


    You''ll be asked, as shown in Figure B.9, to create a Master Boot Record if one
    does not exist.


    This step will create a Master Boot Record and install LILO into the MBR so you
    can boot directly to Linux. Note that you can also modify LILO''s configuration
    file later to accommodate other operating systems or configurations. Select the
    Yes button and press Enter to continue. You''ll then be asked if you want to boot
    directly to Linux. Answer Yes and press Enter.


    Finally, select the “Reboot the System” menu item, as shown in Figure B.10, and
    press Enter.


    ![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_474_1.png)


    Figure B.9 Create a Master Boot Record and install LILO onto your notebook''s
    hard drive in order to boot directly to Linux.'
  merge: -1
  img_proc: true
- pgno: 475
  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_475_0.png)


    Figure 8.10  Reboot the system from the Debian GNU/Linux installer to go to your
    new Linux system on your notebook.


    You’ll be asked to confirm the reboot. Select Yes and press Enter. Don’t forget
    to remove your Bootable Business Card before the system restarts!


    # # Final Steps


    When the system reboots, you’ll be prompted with


    ```

    login:

    ```


    Type in the username root and press Enter, like this:


    ```

    login:  root

    ```


    You’ll then be asked to enter a new password, like this:


    ```

    New password:

    ```


    Enter a short, perhaps eight-character password (a mix of letters and numbers
    is best), and press Enter. You’ll be asked to confirm the password by entering
    it again. Don’t forget this password! You’ll then be asked if you want to create
    a new user for your system. You can safely skip this step for now, and later,
    use the adduser command to create a new user.


    You’ll also be asked if you want to use shadow passwords. This is a good idea,
    because this system adds a bit more security for Linux. Type a y and press Enter.
    You’ll then be asked if you want to select additional packages for Linux. Since
    all the software available from the card has been installed, type n and press
    Enter.


    The installer will then run the asleclt command, offering you the chance to configure,
    install, or remove software packages. Scroll down to the line


    ```

    *6. [Q]uit  Quit dselect.

    ```'
  merge: -1
  img_proc: true
- pgno: 476
  md: 'Type a \`q\` or press `Enter` to quit the program. Congratulations! You have
    finished installing Debian GNU/Linux! The installer will exit, and you''ll be
    presented with your new Linux login: prompt. You can then log in as `root` and
    use your new password. After you log in, you can then shut down the system with


    ```

    # shutdown -h now

    ```


    If you run into problems installing from the card, try browsing to Linuxcare''s
    errata page at


    ```

    http://www.linuxcare.com/bootable_cd/errata.epl

    ```


    # Downloading and Creating Your Own Copy


    If you have a `CDR` or `CDRW` drive, you can download and burn your own copy of
    the Bootable Business Card. Browse to


    ```

    http://www.linuxcare.com

    ```


    Follow the links to the Bootable Business Card and download a copy of the card''s
    .iso image, named `lnx-gold.iso`. Next, insert a blank `CDR`, `CDRW`, or even
    better, blank business card-sized `CDR` in your drive, and use the `cdrecord`
    command to burn a copy. If you have a PCMCIA SCSI `CDRW` drive, you can use the
    `cdrecord` command like this:


    ```

    # cdrecord -v speed=4 dev=0,1,0 -data lnx-gold.iso

    ```


    Since the burned filesystem is only about 51MB, this process should only take
    two or three minutes. Keep a couple of copies on hand, make one for a friend,
    or dis-tribute copies at your local Linux Users Group meeting!'
  merge: -1
  img_proc: true
