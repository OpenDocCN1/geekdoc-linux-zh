- pgno: 319
  md: 'The best way to make sure your data is safe is to take preventive steps before
    a tragedy. This means that you should always expect that disaster will strike.
    Hard drive crashes and data loss can occur for a number of reasons, and mobile
    Linux users face additional hazards. Here are some of the things that can happen:


    +   - Your notebook is stolen (several hundred thousand are stolen each year).

    +   - You drop your notebook.

    +   - A soft drink is spilled on your notebook’s keyboard.

    +   - Someone hacks into your notebook and changes the BIOS startup and hard drive
    password.

    +   - You leave your notebook online, and someone breaks into your system.

    +   - A critical component, such as the display, keyboard, or hard drive, fails.

    +   - You accidentally delete critical files or your entire filesystem.

    +   - A software installation renders your LILO boot loader inoperable and unable
    to boot Linux.


    I’m sure there are many other horror stories of what can happen to a notebook
    (or other device, such as a friend’s Palm PDA that became a crunchy dog toy; thank
    heavens the Palm LCDs are covered by a plastic coating). This chapter outlines
    some basic steps you can take to prevent catastrophic loss of data or use of your
    notebook. Some of the techniques are just common sense, and others might help
    you recover from a problem when installing, updating, or upgrading Linux or other
    software.


    # ## Preventive Tips


    When you first get your notebook, write down its serial number and store it in
    a safe place. Many online or mail-order shippers and manufacturers also include
    the notebook’s serial number on the sales receipt or on the shipping box. You’ll
    generally find the serial number on the bottom of your notebook, most likely on
    the FCC plate.


    Make sure your notebook is insured. If you live in an apartment, get replacement-cost
    insurance. Your homeowner’s insurance might cover your notebook, but if it is
    used for business, you might need a special rider. If your company provides'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'your notebook, check on policies regarding theft or misuse. If you use your
    own notebook at work or for work, check on policies regarding replacement of personal
    equipment.


    You can deter thieves or disreputable pawn shops by permanently defacing your
    notebook with an engraving pen or epoxied sticker with your personal information.


    # ## Use the BIOS


    One of the first things you should do is set the BIOS password, system password,
    or hard drive password. Reboot your computer, and then press the required *F1*
    or other key combination needed to bring up the BIOS configuration screen. Most
    BIOS menus offer the choice of startup, return from suspend, and BIOS change password
    settings. Use all password settings, and use different passwords for different
    settings.


    Setting BIOS passwords renders most notebooks useless to the casual thief or potential
    buyer. However, there are ways to circumvent set BIOS passwords. Some manufacturers
    even offer technical and hardware manuals on the Web with detailed information
    on how to defeat set passwords. For example, to reset a BIOS password on the 1400
    series of IBM ThinkPads, you do the following:


    +   1. Turn off and unplug the notebook, and remove the battery.

    +   2. Remove the keyboard.

    +   3. Remove a thermal plate.

    +   4. Move SW2 (switch 2), the password switch, from off to on.

    +   5. Plug in the AC adapter, and boot the notebook.

    +   6. Press F1 to enter the BIOS (after the beep).

    +   7. Select System Security, and then set the Power-on Password to None.

    +   8. Save the BIOS settings.

    +   9. Shut down and unplug the notebook.

    +   10. Move the password switch from on to off.

    +   11. Reassemble the notebook.


    Disabling the BIOS power-on password on the 390 or 1700 series ThinkPads is even
    easier:


    +   1. Unplug the notebook, and remove its battery.

    +   2. Remove the notebook''s backup battery for 20 minutes.

    +   3. Alternatively, short out the backup battery for one second.'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'There might be a market for a book that details the exact instructions for
    bypassing the BIOS for a variety of notebooks, but you can bet many of the readers
    would be either independent repair technicians or disreputable characters. Nevertheless,
    you can probably find the information you need somewhere on the Internet. (Requests
    for this kind of information on Usenet in newsgroups such as comp.sys.laptops
    are generally met with much skepticism.)


    In the case of the IBM 390 and 1700 series ThinkPads, there is no way to override
    the hard drive password or BIOS setup password—the hardware must be replaced.


    # ## Stolen Notebooks


    There is a lucrative market in stolen computer equipment. You can probably find
    many of these computers and notebooks for sale in your city. If you’re in the
    market for a used notebook, and you find a deal that seems too good to be true,
    consider this: How would you feel if your notebook were stolen? Don’t buy a “hot”
    notebook, and avoid potential trouble. At the least, you could lose your money,
    and at the worst, you could be arrested.


    To avoid buying a stolen notebook, be sure to see the original receipt, and make
    sure the serial number matches the one on the receipt. You can also check various
    databases of stolen laptops. Browse to


    http://home.snafu.de/wehe/stolen\_laptops.html


    You’ll find links to a number of corporate and commercial databases. To protect
    your notebook before it is stolen, you can also register with a commercial tracking
    service. These services, which range in cost from a one-time fee to monthly or
    annual charges, generally work by providing a special tag and including your notebook’s
    information (such as make, model, and serial number) in a database. The unremovable
    tag will have an 800 number, along with a serial number. The service acts as an
    intermediary in getting your system back to you.


    The bad news is that most stolen computer equipment is never recovered. But you
    can protect yourself. Until laptops come equipped with fingerprint recognition,
    you can take some basic steps:


    +   - Never leave your laptop unattended.

    +   - If you’re on the road, use the in-room or hotel safe.

    +   - Never check your laptop through the airport baggage check.

    +   - Some thefts occur at the airport’s x-ray machine. Someone blocks you after
    you put your notebook on the conveyor belt for scanning, and then someone else
    takes your notebook after it comes out the other end.'
  merge: -1
  img_proc: true
- pgno: 322
  md: '+   - Use a nondescript case or bag for your laptop.

    +   - Use a motion detector for your notebook case on the off chance you need
    to leave it unattended.

    +   - Use a security cable with your notebook. Nearly every notebook made today
    includes a standard notebook lock port.


    Want to protect your notebook and, if it is stolen, perhaps track the thief? Browse
    to http://savelaptop.zzzweb.com/, and register your laptop with Moonicer Salem''s
    server. You can then download and install his laptop-tracking software for Linux.
    The tracker command, according to Salem, "assists another user or yourself in
    finding your laptop by sending vital selection information to our servers each
    time your laptop is connected to the Internet."


    The tracker command is a small 40,000-character binary file. It uses a simple
    command line consisting of your username and password at Salem''s server, your
    laptop''s bar code, and a designated network interface to watch, such as eth0
    or ppp0. This command should be renamed and then run at startup from an initialization
    script. Should someone steal your Linux laptop and then get on the Internet, you
    might be able to track the logon''s point of origin. Versions of the software
    are also available for other operating systems.


    # ## Protecting Your Notebook


    There''s nothing like good protection when toting your notebook around. Some notebooks
    are easy to carry, and others slip through damp fingers very quickly. Fortunately,
    manufacturers are beginning to realize that many notebooks are routinely slung
    into bags, plopped onto car seats, and precariously carried around.


    # ### Can''t Afford a ToughBook? Try an iBook!


    You can buy ruggedized notebooks, often categorized as "Industrial" or "Field
    Grade," but unless you''re the U.S. Army and can afford to spend $10,000 on parachute-deployable
    computer equipment, you will probably have to make do with commercial consumer
    offerings. In the Intel-based class of notebooks, the Panasonic ToughBooks are
    a slam-dunk choice, and Linux works well with most models. If you''re a PowerPC
    user, the Apple iBooks (a new model was introduced while this book was being written),
    like the ToughBooks, feature a built-in handle. This is unique among all notebooks
    and is very handy if you need to walk across campus or strap a computer to your
    saddle. Both note- books are rugged and feature tough exteriors, but the ToughBook
    line gets the nod for the most protection against moisture and dust.'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'Selection of a bag, backpack, or briefcase is a personal matter, but many inexpensive
    notebook bags provide protection that is as good as, if not better than, top-of-the-line
    leather or aluminum cases. One of the most cost-effective, shock-resistant, moisture-proof
    solutions is suggested at


    http://www.math.lsa.umich.edu/~bfields/505Tr\_linux.html


    (Hint: Look for a suitably sized padded envelope with bubble-wrap lining!)


    # ## Backup Strategies


    Many mobile Linux users configure their notebooks as dual-boot systems (hopefully
    to boot Linux or BSD UNIX). If your laptop has enough hard drive storage on the
    Windows or Linux partition, you can use this storage to make a complete backup
    of an entire filesystem. For example, when you first turn on and initialize your
    notebook, you might want to keep the software configuration in as close to factory
    "out-of-the-box" condition as possible. This can aid in restoration or help you
    if you intend to sell the notebook later.


    # ### Filesystem Backup


    You can easily make a backup of your entire Windows partition using Linux and
    a DOS-compatible compression program and then store the backup on another computer
    or even on unused space under Linux. For example, if you mount your Windows VFAT
    partition under /mnt/dos, you can use the zip command to back up Windows like
    this:


    ```

    ```sh

    # cd /mnt/dos

    # zip /win.zip *

    ```

    ```


    The zip command will then create a .zip file under the root directory (/) with
    the name win.zip. If you ever need to restore your Windows partition, all you
    need to do is create a bootable DOS partition and then restore the file. You can
    do this from Linux by mounting the partition and then using the unzip command:


    ```

    ```sh

    # mount -t vfat /dev/hda1 /mnt/dos

    # cd /mnt/dos

    # unzip /pathtomotozipfile/win.zip

    ```

    ```


    In this example, /dev/hda1 is the DOS partition, and the win.zip file resides
    somewhere on your Linux filesystem. If you have a network, you can also use strategies
    such as using an NFS-mounted remote partition to hold your filesystem backups
    and then restore over a network.'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'You can also use this approach to make a copy of your entire Linux filesystem
    (although this really isn’t necessary). For example, if you have enough room on
    your hard drive or another partition, you can back up everything with this:


    ```

    `# tar cvsf /linux.tgz /`

    ```


    # Be Careful!


    If you want to make a copy of your entire filesystem, be sure to unmount any unwanted
    partitions or other filesystems, such as /mnt/dos, or you’ll back up those files,
    too!


    Creating a single compressed file of an entire filesystem is known as archiving.
    You could consider a Linux distribution on CD-ROM as a permanent archive or snapshot
    of a filesystem. There are other approaches to backing up data that you can use
    with great success to reduce the amount of time, effort, and file sizes of the
    backup.


    # ## Incremental Backups


    The best way to back up your system is to devise a backup strategy, or schedule.
    You’ll have to decide whether it is worth the effort to perform backups on a daily,
    weekly, or monthly basis. For example, you could devise a strategy like this:


    +   - First of the month: Full backup

    +   - First day of second week: Backup of changed files

    +   - First day of third week: Backup of changed files since first day of second
    week

    +   - First day of fourth week: Backup of changed files since first day of third
    week


    This approach has an advantage over backing up only once every month in that you
    would be able to restore a week’s worth of files and easily backtrack to your
    full backup. The disadvantage over a daily backup schedule is that you could lose
    six days of work. A daily, incremental backup schedule would look like this:


    +   - Sunday: Full backup

    +   - Monday: Backup of all changed files since full backup

    +   - Tuesday: Backup of all changed files since Monday

    +   - Wednesday: Backup of all changed files since Tuesday

    +   - Thursday: Backup of all changed files since Wednesday'
  merge: -1
  img_proc: true
- pgno: 325
  md: '+   * Friday: Backup of all changed files since Thursday

    +   * Saturday: Backup of all changed files since Friday


    This strategy has the advantage in that you could lose only several hours'' work;
    however, restoring a full backup and maintaining this schedule would require seven
    sets of media! Fortunately, most experienced mobile Linux users know that only
    one, or maybe two, directories are truly critical to a typical Linux installation:


    +   * *etc/. The all-important configuration files directory

    +   * *home/. Users, FTP, and http''s directories


    The *etc* directory typically consists of 3 to 4MB of configuration files, scripts,
    and other items. On the other hand, the *home* directory, especially on systems
    supporting multiple users, can grow into the gigabyte range! Even a mobile Linux
    user''s *home* directory can grow to several hundred megabytes, depending on documents,
    installed software, and e-mail directories and folders.


    You''ll need to decide how often and what type of backup strategy to use for your
    notebook. You''ll then need to choose a backup *medium* or type of storage to
    use for your backups.


    # ## Backup Devices


    Choosing an appropriate backup medium or device is a matter of cost, speed, capacity,
    reliability, and appropriateness. For example, you don''t need a 20GB tape drive
    if you need to back up only 100MB of files (unless you want to keep all your backups
    on a single tape, which isn''t a good idea). If you have to back up only several
    megabytes of files, you can get away with using floppy diskettes, but you should
    make extra copies just in case a floppy becomes corrupted.


    If you use Linux in a business environment, choose your backup device carefully.
    These devices range from high-speed digital tapes requiring SCSI interfaces to
    optical CDRW disks. Mobile Linux users who need large data backups should consider
    testing any external units before committing to a particular device. Remember
    that a notebook''s 16-bit *PCMIA* interface limits backups to about 3MB per second.
    With the advent of newer Linux kernels and improved CardBus services, expect higher
    backup speeds, along with better support for higher-speed USB or even Firewire
    devices. For all practical purposes, however, cost-conscious mobile Linux users
    will choose a less-expensive route to data backup.'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# # Swap Your Hard Drive?


    If you have one of the higher-end notebooks from IBM, Compaq, or Dell, and you
    need to quickly exchange data, consider purchasing an extra hard drive that you
    can swap out of your notebook. Some items are expensive but are worth it if you
    end up having problems. These notebooks allow you to have two hard drives active
    at the same time, so you can quickly back up data from one drive to another. If
    you have only one drive bay, you can keep a fully configured Linux filesystem
    on the extra drive as a quick replacement should your main drive expire.


    One popular device that provides relatively inexpensive but reliable storage is
    the Iomega Zip drive. See the section “Using Iomega Zip Drives” in Chapter 12,
    “Data Synchronization,” for details on installing a parallel-port Zip drive. After
    it’s installed, you can use nearly any type of commercial or Open Linux backup
    software with this drive.


    # # Backup Software


    The cp, dump, cpio, tar, and related commands comprise the generic Linux backup
    software included with every Linux distribution. If you want to devise automated
    backups, you need to write shell scripts and use the cron daemon to run these
    backups on schedule. To create a regularly scheduled backup for your notebook,
    one approach might be to combine the output of the `find` command, along with
    `tar` or `cpio`, and target and back up a specific directory.


    For example, the `find` command’s -mtime option, followed by an integer (in days),
    returns a list of files that have been modified in the last 24 hours. You can
    then feed, or `pipe`, this information to the `cpio` command to create an incremental
    backup of the previous day’s files:


    ```

    # /usr/bin/find /home -mtime 1 -print | /bin/cpio -o > /mnt/backup/Monday.cpio


    ```


    This command line could be placed in a shell script named monday_backup (and perhaps
    saved in root’s bin directory) and then put into your Red Hat, Mandrake, or Yellow
    Dog Linux `/etc/crontab` file like this:


    ```

    30 2 * * 1 root /root/bin/monday_backup


    ```'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'This creates the backup file Monday.cpio every Monday morning at 2:30 a.m.
    You can use many different approaches to automate your backups, and you have a
    variety of ways in which to use your Linux filesystem tools.


    # Finding the rhbackup Script


    Red Hat Linux, until version 5.2, included a useful shell script named rhbackup
    that could be used to perform backups locally or over a network. You can still
    find a copy at


    http://rpmfind.net/linux/RPM/redhat/5.2/i386/rhbackup-0.2-1.noarch.html


    **Mobile Linux iBook users can find a copy at**


    http://rpmfind.net/linux/RPM/yellowdog/1.0/old_releases/champion-1.1/ppc/RedHat/RPMS/rhbackup-0.2-2.noarch.html


    A number of commercial backup software packages are also available for Linux.
    One popular package, BRU (backup and restore utility), by Enhanced Software Technologies,
    features a complex command-line or easy-to-use graphical interface for backing
    up your system’s software. You might find BRU packaged in a *personal edition*
    as value-added software included with various Linux distributions. However, you
    can also download a 30-day demonstration version from http://www.estinc.com.


    BRU should be run as root, and you must run X11 in order to use BRU’s graphical
    interface. Install the software using the *rpm* command, and then type the command
    *xbru &* from the command line of an X11 terminal to start the program. You’ll
    see the startup dialog box, shown in Figure 13.1.


    When the program first starts, you must configure BRU to use your backup device.
    This device can be one of many predefined tape drives, a floppy disk, or, if you
    need it, a custom-configured device you define for your system. Choose File, Configure
    Bru. In the configuration dialog box that appears, click the Devices tab, and
    then click the New button. You’ll see the dialog box shown in Figure 13.2. This
    dialog box lists more than two dozen different devices. If you scroll down to
    the end of the list, you’ll see an OTHER entry. You can use this entry to define
    your own device. For now, just select the 1.44Mb Floppy entry.


    Click the Create button, choose File, Save, and then exit the configuration dialog
    box. You’ll return to the main BRU window (shown in Figure 13.1). To select'
