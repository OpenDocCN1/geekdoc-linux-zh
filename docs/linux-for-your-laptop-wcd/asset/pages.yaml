- pgno: 347
  md: 'When finished, select lpd, Restart lpd, and then use the File menu to quit.
    You can view your new printer’s definition in /etc/printcap by using the less
    pager like this:


    ```

    # less /etc/printcap

    #

    # Please don''t edit this file directly unless you know what you are doing!

    # Be warned that the control-panel printtool requires a very strict format!

    # Look at the printcap(5) man page for more info.

    #

    # This file can be edited with the printtool in the control-panel.

    ##PRINTPOOL## LOCAL bjc600 36x0 36x0 letter () BJC600 1 ()

    lp:\

    :sd=/var/spool/lpd/lp:\n:rm#0:\n:sh:\n:lp=/dev/lp0:\n:if=/var/spool/lpd/lp/filter:

    ```


    In this example, the new printer’s name is lp, and its print spool directory is
    /var/spool/lpd/lp. Note that the :if= entry points to the file /var/spool/lpd/lp/filter.
    This is Red Hat’s print-filtering shell script, which manages conversion and printing
    of any documents sent to the new printer lp.


    Printing a document from the command line is easy. Use the lpr (line printer)
    command, along with its -P option, a printer’s name, and the name of a file:


    ```

    # lpr -Plp /usr/share/ghostscript/5.10/examples/tiger.ps

    ```


    In this example, the PostScript graphic tiger.ps will be printed on printer lp.
    The lpr command starts the printing process, and the file is spooled to printer
    lp’s directory. The lpd daemon, which reads /etc/printcap when it first starts,
    notices that a file has appeared in printer lp’s spool directory. It also knows
    that printer lp has a print filter available. The printing process is handed off,
    and the filter shell script then converts the PostScript file to HPCL (or not)
    and sends the file to your printer.


    The Red Hat print-filter system recognizes several types of files automatically
    according to a file’s extension on the lpr command line. Table 14.2 lists many
    of the recognized file types.'
  merge: -1
  img_proc: true
- pgno: 348
