    \ RAM PC card (which usually comes in a Type II form factor), make sure Card Services\
    \ is running on your computer:\n\n```\n# /etc/rc.d/init.d/pcmcia start\n```\n\n\
    Next, insert the card and listen for two high beeps. Use the `dmesg` command to\
    \ look for output:\n\n```\n# dmesg\n...\nhda: SunDisk SDCPB-8, ATA DISK drive\n\
    ide2 at 0x100-0x107,0x10e on irq 9\n\nhde: SunDisk SDCPB-8, 7MB w/1kB Cache, CHS=245/2/32\n\
    \  hde: hde1\nide_cs: hde: Vcc = 3.3, Vpp = 0.0\nVPS: Disk change detected on\
    \ device ide2(33,0)\nhde: hde1\n...\n```\n\nNext, mount the card (as root) to\
    \ a specified directory, such as `/mnt/flash`, using the device found in the `dmesg`\
    \ command output:\n\n```\n# mount -t vfat /dev/hde1 /mnt/flash\n```\n\nYou can\
    \ then move or copy your data to the disk. When finished, unmount the device by\
