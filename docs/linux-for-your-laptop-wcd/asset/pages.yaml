  md: 'CD-ROM, the Red Hat installer will ask you to click on an Exit button or press
    Enter to reboot your notebook.


    # ## Logging In and Shutting Down


    When you first log in, enter `root` or your username and press Enter. Next, type
    in your root or username''s password. You can also shut down or reboot Linux using
    the X11 graphical login. To shut down your notebook from Linux, use the `shutdown`
    command with its `-h (halt)` option:


    ```

    ```

    # shutdown -h now

    ```

    ```


    To reboot Linux from the command line of the console or an X11 terminal window,
    use the `shutdown` command with its `-r (reboot)` option:


    ```

    ```

    # shutdown -r now

    ```

    ```


    # # Installing Yellow Dog Linux


    Installing Yellow Dog Linux on the iBook is easy. Using Yellow Dog Linux (which
    is based on the Red Hat file system) is a lot of fun and a great way to learn
    Linux. After preparing your iBook''s hard drive for Yellow Dog Linux, boot to
    the newly installed Mac OS, insert your Yellow Dog Linux CD-ROM, and install the
    BootX control panel to your iBook''s System folder. (One component, BootX App,
    goes to the Control Panel folder, and the other component, BootX Extension, is
    placed in the Extensions folder.)


    Next, copy the files `vmlinuz` and `ramdisk.image.gz` from the CD-ROM to your
    iBook''s System folder. Start the BootX control panel, select the `vmlinuz` Linux
    kernel, and click on the No Force Driver option. Click on the BootX Options button,
    and then select the Video video settings item. Next, click on the Use specific
    RAM disk button, and then click on the Choose button to select the `ramdisk.image.gz`
    file. When finished, click on the OK button.


    If you choose to use a single Linux native partition on your iBook, this partition
    will be designated `/dev/hda10`. Therefore, in the main BootX dialog box, enter
    `hda10` for the root device. This designates the root Linux partition. Next, enter
    `adb_buttons=103,11` in the More kernel arguments: field. This designates F11
    and F12 as the middle and right mouse buttons for the iBook''s single-button ADB
    mouse. Click on the Save to pref button to finish your configuration.


    Make sure the Yellow Dog Linux CD-ROM is inserted in your iBook, and then click
    on the Linux button in the BootX dialog box to start the installation.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'The installation of Yellow Dog Linux proceeds along the same lines as a text-based
    Red Hat Linux installation. However, you’ll need to do the following:


    +   * Configure and format a swap partition.

    +   * Configure and format a root Linux partition (which should be /dev/hda10).

    +   * Configure the iBook mouse as a single-button ADB mouse.

    +   * Configure the iBook’s internal Ethernet interface (if desired).


    After installing Yellow Dog Linux, log in as the root operator, and edit the system’s
    initialization table, /etc/inittab:


    ```

    # pico -w /etc/inittab

    ```


    Change this entry:


    ```

    id:3:initdefault

    ```


    to this:


    ```

    id:5:initdefault

    ```


    Save the file (press Ctrl+X) and exit the editor. This will configure Yellow Dog
    Linux to boot directly to an X11 session. Here are some things to keep in mind
    about Yellow Dog Linux on the iBook (these points were true at the time this chapter
    was written):


    +   * You must use the same color depth settings and resolution for the Mac OS
    and Linux (800×600 at 16bpp, or thousands of colors).

    +   * The internal Ethernet port works, but it does not respond well to being
    placed in “up” or “down” status using the ifconfig command.

    +   * The current Linux kernel for the PowerPC chip does not enable sound on the
    iBook.

    +   * The iBook’s internal modem does work with Linux, but you must boot Linux
    using the Yaboot boot loader and Apple’s Open Firmware boot prompt. However, your
    X11 sessions will be limited to 256 colors. Browse to http://www.yellowdoglinux.com/support/ff\_bootloader.shtml
    for a discussion on using the Yaboot utility.


    Hopefully, these issues will be resolved in the near future; development of PPC
    Linux is quite active, and new features are continually being added. Chances are
    quite good that iBook users will enjoy the full benefits of Linux in only one
    or two more revisions of the Yellow Dog Linux distribution.'
  merge: -1
  img_proc: true
