- pgno: 405
  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_405_0.png)


    Figure 17.1 StarOffice features suite-wide preferences for auto-saving open documents.


    For example, to set default auto-save intervals with StarOffice, press Alt+T and
    select the Options menu item. You’ll see the dialog box shown in Figure 17.1.


    If you use WordPerfect 8 for Linux, change your auto-save preferences through
    the Preferences menu. Choose Preferences, and then click the Files icon in the
