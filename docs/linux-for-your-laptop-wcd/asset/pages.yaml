  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_346_0.png)


    Use the printtool Configure Filter dialog box to select a proper print filter
    for your printer.


    Selecting the right options in this dialog box is critical to the success of configuring
    Linux to work with your printer. Scroll through the list and choose a printer
    type that matches your printer. Don''t be discouraged if you don''t see your printer''s
    exact model listed in the filter list. Many printers work well using a filter
    designed for related printers, such as the HP500 filter, which also works with
    many HP600- series printers.


    If you have an HP 340, select the HP DeskJet 500 filter. If you have aBJC-50 or
    BJC-80, select the Canon BJC-600 filter.


    You should also select a resolution, paper size, color depth, and other printing
    options. Click the OK button when finished, and then click the OK button again.
    You''ll then see your new printer listed in the printtool dialog box. Click the
    printer''s name, and then select Tests, Print ASCII Test Page.


    If all goes well, your printer should print a single page of test information.
    You can then print a PostScript test page. Make sure that you have a color cartridge
    installed in your printer if you defined a printer with color capabilities. You
    can also create a black-and-white printer with a different name if you don''t
    want to use your color cartridge all the time.'
