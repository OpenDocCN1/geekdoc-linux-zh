    ```

    Video adapter: VESA VGA

    Mode:    COLUMNS×ROWS:

    0  0F00  80×25

    1  0F01  80×50

    2  0F02  80×43

    3  0F03  80×28

    4  0F05  80×30

    5  0F06  80×34

