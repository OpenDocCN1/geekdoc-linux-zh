- pgno: 224
  md: 'The main weapon in your arsenal is the find command. This command can quickly
    traverse designated directories (and other filesystems) and display found files
    according to your specifications. For example, you can use the find command to
    search your system for backup files (generally designated with a .bak extension)
    like this:


    ```

    # find / -name *.bak

    /home/dball1/Office51/config/rootag.bak

    /home/dball1.kde/share/apps/kfm/cookies.bak

    /usr/X11R6/lib/X11/xfig/html/images/add-arrow-button.gif.bak

    /usr/X11R6/lib/X11/xfig/html/images/open-compound-button.gif.bak

    /usr/X11R6/lib/X11/xfig/html/images/screen-image.fig.bak

    /usr/X11R6/lib/X11/xfig/html/images/update-control.gif.bak

    /var/lib/nfs/sm.bak

    /etc/printcap.bak

    /root/.kde/share/apps/kfm/cookies.bak

    ```


    You can then quickly delete these files by piping the find command''s output through
    the xargs command to delete the files with the rm command:


    ```

    # find / -name *.bak | xargs rm -f

    ```


    Other candidates for deletion include *.bak files, files with an .o extension
    (object files from compile operations), and files with the name "core." If you
    don''t want to delete these files, you can build a candidate list:


    ```

    # find / -name *.o >> files_to_delete.txt

    ```


    # Minimizing System Logs


    Another area of your Linux system that will grow over time is your system logs.
    Logging records nearly every action and output by different software, such as
    the kernel, mail, database, printing, and other daemons and services. These logs
    can become quite large, taking up many megabytes of valuable disk space.


    Each month, these logs, contained in the /var/log directory, are generally “rolled
    over” and renamed to allow new logs to be created. The old log files have a number
    such as 1, 2, 3, and so on appended to their file names. After using Linux on
    your notebook for a while, you can get a quick idea of the size of these logs
    by using the find and ls commands:


    ```

    # find /var/log -name *.4 | xargs ls -l

    -rw------- 1 root root 645185 Feb 6 04:02 /var/log/cron.4

    -rw-r---m 1 root root 0 Jan 30 04:02 /var/log/httpd/access_log.4

    -rw-r---m 1 root root 979 Jan 31 13:31 /var/log/httpd/error_log.4

    ```'
