- pgno: 339
  md: 'This chapter presents some ideas, hardware, and software that may help mobile
    Linux users print documents while on the go. Although many of us relish today''s
    lighter, more-powerful notebooks, unfortunately most printers still remain firmly
    in the camp of desktop users due to size, weight, and accessories. However, some
    newer models introduced in the last year or so are attractive in terms of weight
    and price, and they work well with Linux.


    # ## Portable Printers


    Portable printers are the obvious choice when you need to print while on the road.
    Unfortunately, these types of printers are made by only a small number of manufacturers,
    so your choices might be limited. Those on the market share many common characteristics.
    **Here are some of the good features:**


    +   * Lightweight—less than 2 lbs. for some models

    +       * Internal battery to provide printing without a wall outlet

    +       * Ability to run off DC power (a bonus for boat owners)

    +       * Smaller dimensions (than desktop printers)

    +       * Small components, such as ink cartridges

    +       * IrDA port for infrared printing with compatible notebooks and operating
    systems

    +       * Thermal print heads, which don''t require replacement

    +       * Simplified operation

    +       * Somewhat less expensive than many desktop printers

    +       * Color and black-and-white capabilities

    +       * In some models, such as the small Canon printers, a replaceable print
    head that can turn the printer into a scanner (not supported under Linux)


    Some of the less appealing features include the following:


    +   * Limited number of pages per battery charge

    +       * No sheet feeder, or the sheet feeder is an expensive option

    +       * Usually more expensive than printers with similar printing characteristics
    (such as speed, dots per inch printing resolution, and so on)

    +       * Inability (in most models) to handle envelopes or larger envelopes'
