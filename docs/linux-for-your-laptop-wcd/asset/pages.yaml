    (setq auto-save-timeout nil)

    ```


    These entries cause `emacs` to save a backup every 1,500 keystrokes. If you set
    this value to 0, you will turn off the auto-save feature. If you use the XEmacs
    editor, you can turn off the use of backup files by choosing Options, Customize,
    Emacs, Files, Backup from the XEmacs menu, as shown in Figure 17.4.'
