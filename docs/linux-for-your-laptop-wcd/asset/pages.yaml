    # Installation via HTTP


    You can also choose to install Red Hat Linux via HTTP. In the Installation Method
    dialog box (refer to Figure 4.5), choose HTTP and press Enter. You can then enter
    information (as shown in Figures 4.6 through 4.8) until you arrive at the HTTP
    Setup dialog box, shown in Figure 4.10.


    Again, if you have an active Internet connection, you can specify a server on
    the LAN or halfway across the world. If you''re installing from a local Web server,
    such as'
