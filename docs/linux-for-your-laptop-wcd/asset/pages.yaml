    Don''t forget to properly label your diskettes during the backup! After that,
    you can use BRU''s buttons on its main dialog box to restore, list, or verify
    your archive.


    # Alternative Backup Methods


    If you don''t want to carry a bulky backup device with you on the road, and you
    have only a few files to worry about, consider using printouts, or save your files
    on floppy disks. If you have 64MB or less of data to back up, consider using a
    flash memory card. These devices are relatively inexpensive when purchased in
    capacities of 64MB or less and have additional benefits:


    +   - Very lightweight.

    +   - High-density storage in a credit card-sized format.

    +   - Require no external power source.'
