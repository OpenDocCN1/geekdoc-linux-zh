- pgno: 261
  md: 'Double-click to select a word. Triple-click to select a line of text. To select
    a block of text in the console, click and then drag with the left mouse button
    depressed. The selected text will be highlighted in reverse video. You can then
    paste the text by clicking the middle mouse button (or by simultaneously pressing
    the left and right mouse buttons when your two-button mouse is emulating a three-button
    mouse). The right mouse button is used to extend selections. If you do not use
    three-button emulation, the right button pastes the selected (copied) text.


    The gpm server is run as a daemon (in the background) and is usually started through
    an init script (for Red Hat, Mandrake, and Yellow Dog Linux) under the `/etc/rc.d/init.d`
    directory. The Apple iBook''s mouse is initialized by the `/etc/rc.d/init.d/gpm`
    script with


    ```

    gpm -t bsmouse

    ```


    Owners of an Intel notebook with a built-in PS/2 mouse will find that gpm is initialized
    with


    ```

    gpm -t ps/2

    ```


    Your notebook''s mouse is defined in the file `mouse` under the `/etc/sysconfig`
    directory; this information is used by the gpm startup script to initialize your
