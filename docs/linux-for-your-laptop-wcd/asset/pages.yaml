- pgno: 432
  md: '# Parallel-Port CDR Support?


    Navigate to the Linux Parallel Port CDR page (http://www.torque.net/parport/cdr.html)
    if you''d like to explore burning CDRs using a parallel-port drive. According
    to the host, Dave Campbell, you''ll need the pg.o module (included with most modern
    2.2.X Linux distributions), along with PARIDE (parallel-port IDE) support in your
    system''s Linux kernel. You "should be able to burn CDRs at 2x speed in EPP mode."


    CDRW drive appear as a SCSI device. Before trying this, however, try booting Linux
    with the kernel argument append keyword, followed by the device name of your ATAPI
    CDR or CDRW drive:


    ```

    append="hdd=ide-scsi"

    ```


    In this example, /dev/hdd is the designated drive. You can then try using the
    insmod command to load the ide-scsi.o module:


    ```

    # insmod ide-scsi

    ```


    For the least amount of hassle, you can choose to use a SCSI PC card adapter and
    an external SCSI CDRW drive. Although these drives are bulky, require an external
    power supply, and cost more, you''re almost guaranteed ease of use, speed, and
    compatibility when using this type of drive with Linux to create CDR or CDRW disks.
    One combination that I can heartily recommend is an Adaptec 1260 PCMCI A adapter
    and an HP or Yamaha external drive (such as Yamaha''s CRW8424SX). You can check
    David Hinds'' SUPPORTED.CARDS document for a list of supported SCSI adapter PC
    cards.


    To use an external SCSI CD-Writer, insert the PCMCI A SCSI adapter, and then turn
    on the external drive. Next, power up your notebook. During the boot process,
    you should hear two high beeps. When you examine the kernel boot messages (using
    the dmesg command), you should see something like this:


    ```

    ... aha152x: processing commandline: ok aha152x: BIOS test: passed, detected 1
    controller(s) aha1520: vital data: PORTBASE=0x340, IRQ=3, SCSI Id=7, reconnect=enabled,
    parity=enabled, synchronous=disabled, delay=100, extended translations=disabled
    aha152x: trying software interrupt, ok. scsi0 : Adaptec 152x SCSI driver; $Revision:
    1.7 $ scsi : 1 host.

    ```'
  merge: -1
  img_proc: true
- pgno: 433
  md: "```\nVendor: YAMJUA Model: GPM424S Rev: 1.0f  \nType: CD-ROM ANSI SCSI revision:\
    \ 02  \nDetected scsi CD-ROM sr0 at scsi0, channel 0, id 1, lun 0  \nsr0: scsi3-mmc\
    \ drive: 24x/16x writer cd/w xa/form2 cdda tray  \nUniform CDROM driver Revision:\
    \ 2.56\n```\n\nThis information will come in handy later. The important data to\
    \ remember are the channel, id, and lun numbers (used with the `cdrecord` command,\
    \ discussed in the next section), and that the drive is recognized as `sr0` (which\
    \ corresponds to the `/dev/scd0` device).\n\n# # Command-Line Utilities\n\nTo\
    \ mount, read, create, and write CD-ROM images, you'll need several Linux utilities:\
    \ `mkisofs` to create an ISO image on your hard drive to hold the CD's contents,\
    \ `mount` to mount an existing CD-ROM as an ISO image, `dd` to copy a CD's contents,\
    \ `mke2fs` to format blank hard drive image files, and `cdrecord` to write selected\
    \ files or write an ISO image to your CDR or CDWR drive. Note that before you\
    \ begin, you might need up to 1.4GB of free hard drive space!\n\nFor example,\
    \ one way to make a quick copy of a data CD-ROM (such as a bootable Linux CD)\
    \ is to first use the `dd` command to copy the CD:\n\n```\n# dd if=/dev/scd0 of=cimage\n\
    ```\n\nYou can then write the image with the `cdrecord` command, specifying your\
    \ CDR or CDWR drive like this:\n\n```\n# cdrecord -v speed=2 dev=0,1,0 -data cimage\n\
    ```\n\nThis will copy the file `cimage` onto your blank CDR or CDWR disk in the\
    \ SCSI drive with an ID of 1 on bus 0. If your CDR or CDWR drive is fast enough,\
    \ you can use a faster speed= setting. If you downloaded an ISO image of a CD-ROM,\
    \ you can mount the image locally (and access its files and directory structure)\
    \ like this:\n\n```\n# mount -t iso9660 -o loop=/dev/loop1 cimage /mnt/cdrom\n\
    ```\n\nThis command will mount the CD-ROM's image file under the `/mnt/cdrom`\
    \ directory as if it were an inserted CD-ROM. You can then copy the files from\
    \ `/mnt/cdrom` to a new directory, such as `/mnt/cdrom_new`, to change the files\
    \ or fix any problems. You can then create a new ISO image from the new directory\
    \ by using the `mkisofs` command and specifying the new `/mnt/cdrom_new` directory\
    \ like this:\n\n```\n# mkisofs -r -o new_cimage /mnt/cdrom_new\n```"
