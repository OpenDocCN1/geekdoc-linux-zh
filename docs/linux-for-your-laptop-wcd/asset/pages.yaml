    \ the `ifconfig` command is used to assign a specific IP address to eth0 and then\
    \ activate the interface, or bring it “up.” The second example shows that you\
    \ can also use information listed in your system’s /etc/hosts file, such as a\
    \ hostname (such as valo) and its associated IP address to configure the interface.\
    \ A small /etc/hosts file might look like this:\n\n```\n127.0.0.1            \
