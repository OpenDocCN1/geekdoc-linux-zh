- pgno: 226
  md: 'If you''re satisfied with these times and arrangements, create your command,
    such as combining the `find` command''s output with the `xargs` and `rm` commands,
    and put it in a text file. Next, name the file and make it executable. For example:


    ```

    chmod +x cleanup

    ```


    Then move the file into the daily, weekly, or monthly directory. For example,
    to clean up your system logs, you could use this:


    ```

    /usr/bin/find /var/log -name *\*.1 | /usr/bin/xargs /bin/rm -f

    ```


    To have this run on the 15th of every month at 2:30 p.m., you could use an /etc/crontab
    entry like this:


    ```

    30 14 15 * * root /usr/bin/find /var/log -name *\*.1 | /usr/bin/xargs /bin/rm
    -f

    ```


    # # Compression and Compressed Filesystems


    Compression of computer data is not only a scientific pursuit, but also an art
    form. Even before computers were invented, people strived to find better ways
    to compress data. Hieroglyphics and the cuneiform alphabet could be considered
    early and rudimentary forms of compressed information. Journalists reporting from
    battlefields during the telegraph era used compressed language in order to squeeze
    in as much information as possible, and they put the most important information
    at the beginning in case the transmission got cut off.


    Today, compression is used invisibly when we go online via modem, listen to streaming
    audio or video, or upload or download files using Web browsers (which can be set
    to decompress files on-the-fly). The Linux kernel has had the ability to use built-in
    compression since 1997, but because of the additional overhead in time and hard
    drive activity, this form of filesystem activity has not caught on in popular
    distributions.


    # ## In a Squeeze to Try Compression?


    Intrepid notebook users who want or need to take advantage of compression can
    download the e2compr kernel patches from


    ```

    http://www.netinspace.net/-reiter/e2compr/

    ```


    You''ll need to apply the kernel patches and then use the included utilities to
    compress and decompress files you use with Linux.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# **Compression Use with Linux**


    The Linux distribution you''ve installed on your notebook comes with many different
    utilities for compressing and decompressing files. This section introduces you
    to compression tools for Linux. These tools, like most other command-line utilities,
    may be combined with other programs or included in shell scripts to automate file
    compression during your Linux sessions.


    > **Man Page Compression**

    > Nearly all Linux distributions now use compressed manual pages. These pages,
    found under the `/usr/man` directories, can be decompressed by utilities specified
    in the `/etc/man.config` file. Without using compression, these pages of documentation
    would require 100MB or more of drive space.


    Table 8.2 lists a number of compression tools included with Linux. You might (or
    might not) be surprised to see some old favorites.


    # **Extracting Archives**


    You''ll most likely run into compressed files when downloading new software or
    software packaged as source code. Although the standard software package management
    software for Red Hat, Mandrake, Caldera OpenLinux, and SUSE Linux is the Red Hat
    Package Manager, or the `rpm` command, many different Linux software developers
    distribute files in compressed archives known as *tarballs*. These files are easily
    recognizable, with extensions such as `.tar.gz` and `.tgz`.


    Decompressing these files is quite easy using the `gunzip`, `qzip`, or `tar` command.
    For example, if you download a file that has a `.tar.gz` extension, you can first
    decompress the file with the `gunzip` command like this:


    ```

    $ gunzip xp2.tar.gz

    ```


    You end up with a file named `xp2.tar`. You can then list the contents of the
    archive with `tar`''s `-t` (list) option:


    ```

    $ tar tf xp2.tar

    ...

    usr/

    usr/X11R6/

    usr/X11R6/bin/

    ```'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Table 8.2 Linux Compression Utilities


    | Name | Description |

    |---|---|

    | binhex | Converts files to BinHex format |

    | bunzip2 | Decompresses .b2z archives |

    | bzcat | Decompresses files to display |

    | bzip2 | Burrows-Wheeler block sorting, Huffman encoder |

    | compress | UNIX compression utility |

    | cpio | Copies into and out of UNIX archive utility |

    | gunzip | Decompresses gzip archives |

    | gv | Displays compressed PostScript documents and graphics |

    | gzexe | Creates executable compressed files |

    | gzip | GNU Lempel-Ziv encoder |

    | hexbin | Converts files from hexadecimal to Macintosh format |

    | lha | LHarc archive utility for Linux |

    | macunpack | Macintosh package utility |

    | rpm | Red Hat Package Manager |

    | rpm2cpio | Converts .rpm archives to .cpio archives |

    | shar | Creates shell archives |

    | tar | Manages tape archives |

    | uncompress | UNIX decompression utility |

    | unshar | Unpacks shell archives |

