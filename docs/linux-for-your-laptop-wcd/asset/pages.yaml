    \ start\n\n/bin/sleep 5\n\n/etc/rc.d/init.d/network start\n```\n```\n\n# ## Using\
    \ init Scripts\n\nYou can also use the apmd system script, with proper entries,\
    \ to handle PC cards and APM events gracefully. Although they are normally used\
