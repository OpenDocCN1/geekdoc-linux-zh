    # Automated Disk Cleanup


    Linux is similar to UNIX. As such, it has inherited many features and traits of
    SysV and BSD UNIX. This means that many configuration files, system logs, and
    temporary files can be created, can multiply, and can grow over the course of
    each successive Linux session. Some of the first steps are understanding your
    system''s requirements, determining where the most software is installed, and
    deciding where on your file system cleanup might be a good strategy to use. For
    example, the du command may be used to print the relative size of each directory,
    starting at the root, or /, directory:


    ```

    # du -h --max-depth=2 /

    4.9M    /bin

    1.7M    /home/ftp

    6.7M    /home/htpd

    1.0k    /home/samba

    21M     /home/bball

