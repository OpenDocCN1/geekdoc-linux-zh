  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_270_0.png)


    Figure 10.8 *Use KDE''s kmix client to set your microphone input and sound output
    levels properly before recording.*


    ![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_270_1.png)


    Figure 10.9 *krecord also features a graphing input or output level meter.*


    Your mixer might look different, depending on your notebook''s sound system (some
    systems offer treble and bass controls in addition to volume and balance). To
    begin recording, click on the small red button on krecord''s toolbar. If you click
    on the graph button, you''ll see a level input graph that shows your input or
