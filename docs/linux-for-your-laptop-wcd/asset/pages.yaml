- pgno: 404
  md: "This is the best option to use before making any changes to your drive settings.\
    \ Be careful! Other than changing the standby and a few other settings, you can\
    \ cause your system to become unbootable by using incorrect settings!\n\nYou can\
    \ set your hard drive to immediately go to standby mode by using the `-y` option\
    \ like this:\n\n```\n# hdparm -y /dev/hda\n```\n\n```\n/dev/hda:\n\tdrive state\
    \ is:\tstandby\n```\n\nTo check your hard drive's power consumption mode, use\
    \ the `-C` flag:\n\n```\n# hdparm -C /dev/hda\n```\n\n```\n/dev/hda:\n\tdrive\
    \ state is:\tstandby\n```\n\nYou can put your hard drive to sleep (to use no power)\
    \ with the `-Y` option:\n\n```\n# hdparm -Y /dev/hda\n```\n\n```\n/dev/hda:\n\t\
    issuing sleep command\n```\n\nUse the `-s` option, followed by a number from 1\
    \ to 240, to set the timeout before your hard drive goes to standby mode. The\
    \ numbers are multiplied by 5, so using a value of 6 would cause your hard drive\
    \ to spin down after 30 seconds of inactivity:\n\n```\n# hdparm -S 6 /dev/hda\n\
    ```\n\n```\n/dev/hda:\n\tsetting standby to 6 (30 seconds)\n```\n\nBy using a\
    \ combination of hard drive inactivity and software inactivity (see the next section),\
    \ you can craft a safe and very power-efficient mobile Linux system.\n\n# Controlling\
    \ Software\n\nFor safety's sake, you must decide on the length of intervals between\
    \ data saves to your hard drive. You should set your word processor auto-save\
    \ preferences—such as for emacs, WordPerfect, Applix Words, or StarOffice—to reasonable\
    \ defaults in order to save battery power. Frequent saves to disk cause your hard\
    \ drive to spin up and down continually, depending on your settings."
  merge: -1
