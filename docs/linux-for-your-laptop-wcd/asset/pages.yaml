- pgno: 199
  md: 'Advanced Power Management, or APM, is something most desktop PC users don''t
    have to worry about. Indeed, most mobile Linux users who have desktop replacement
    notebooks that are plugged in all day don''t give power manage-ment a second thought.
    But when you''re on the road trying to get work done and you hear your notebook
    bleating its last battery just before expiring, power manage-ment suddenly becomes
    an important issue.


    That''s why it''s important to arm yourself and your laptop with the right informa-tion
    and software before going on the road. You''ll be able to confidently navigate
    your way through many extra minutes of “on” time and squeeze every bit of juice
    out of your battery.


    # What Is APM?


    APM is an industry-developed standard that helps equipment manufacturers and programmers
    design hardware and software to save power. This is accomplished in a number of
    ways, such as through “smart battery” circuitry, intelligent CPU throttle control
    and sensing of battery levels, timing loops in the operating system that measure
    intervals of inactivity before turning off devices such as displays and hard drives,
    and user control of a computer''s components.


    Although desktop PC Linux users can benefit from APM’s feature of turning off
    the computer after shutdown, most nonbattery Linux boxes do not need APM installed
    or enabled. However, for mobile Linux users, APM is more than just a nice feature—it''s
    a way of life! Notebook users will quickly become familiar with APM features such
    as these:


    +   - **Suspend**. Also known as *sleep*, or the ability to turn off the LCD and
    back-light; shut down networking, serial ports, and PCMCIA; turn off the sound;
    and then restore with a mouse click or the touch of a keyboard key. This is the
    fastest and most efficient method of saving power for short periods.

    +   - **Hibernate**. Also known as *suspend-to-RAM* or *suspend-to-disk*. This
    feature freezes the current desktop and saves the session in a “snapshot” to memory,
    to a file on the hard drive, or to a special partition. The system is restored
    through the power button. This is a slower and more power-intensive method of
    saving power, so hibernation should be used only when needed for longer periods,
    such as 30 minutes to an hour.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '+   * **Video standby.** Although it''s not part of APM, some notebooks offer
    a feature to turn off the LCD and backlight. Some of these features might be supported
    by the X Window System. This is a convenient method of saving some power (you''ll
    save more with larger LCD displays).


    Before trying to use APM features with Linux, make sure your notebook''s BIOS
    supports APM. Check your laptop''s manual, and, then, when booting, press the
    proper keys on the keyboard to access its BIOS. If APM is supported, you''ll see
    menu items used to control power management through different schemes or toggling
    of features on or off. You must enable APM in your computer''s BIOS in order to
    use APM with Linux!


    # The Linux Kernel and APM


    The Linux kernel supports a number of APM features, thanks to the efforts of Stephen
    Rothwell and support from the NEC Corporation. When you enable APM in the kernel,
    the Linux system time should be reset after the computer resumes. The /proc/apm
    file contains APM information such as battery status, time, and percentage of
    time remaining. And APM “event” notifications are transmitted and (hopefully)
    used by APM-aware programs.


    # Linux and ACPI Support


    Advanced Configuration and Power Interface (ACPI) is an open specification developed
    by some of the biggest players in the notebook market. Although not incorporated
    into many notebooks yet, patches for ACPI support are available for Linux, and
    ACPI support seems destined for the Linux 2.4-series kernels. Browse to Andy Henroid''s
    ACPI page at http://www.geocities.com/SiliconValley/Hardware/3165/ for a patch
    to current 2.2-series kernels. You should also browse the ACPI4 home page at http://phobos.fs.tum.de/acpi
    for details, links, and the status of the port to Linux.


    There are some limitations, however. APM does not control your computer’s hard
    drive, and it doesn’t turn off Display Power Management Signaling (DPMS)-aware
    computer monitors or Energy Star devices. Also, some notebooks might not have
    a compatible BIOS. You’ll find our rather quickly if your notebook doesn’t have
    a compatible BIOS, because the APM-enabled Linux kernel will crash immediately
    upon booting. Always keep a backup kernel and boot disk on hand!'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# Recompiling the Kernel to Save Memory and Power


    Fortunately, most notebooks can use APM with Linux. Some Linux distributions,
    such as Red Hat and Mandrake Linux, come with APM enabled in the default kernel.
    Mandrake and SuSE Linux thoughtfully include several other versions just in case
    the default kernel doesn’t work—a nice feature! To enable APM support in a Linux
    kernel, you must build a new kernel.


    If you’ve never built and installed a Linux kernel, don’t worry. It’s not that
    difficult. You must first install the Linux kernel source code, along with the
    GNU C compiler and required headers and libraries. Next, navigate to the /usr/src/linux
    directory. From there, here are the basic steps:


    +   1. make mrproper

    +   2. make menuconfig or make xconfig or make config

    +   3. make dep; make clean

    +   4. make bzImage

    +   5. make modules

    +   6. make install

    +   7. make modules_install

    +   8. cp arch/i386/boot/bzImage /boot/vmlinuz-2.2.XX

    +   9. cp System.map /boot/System.map-2.2.XX

    +   10. cd /boot

    +   11. rm System.map

    +   12. ln -s System.map-2.2.XX System.map

    +   13. Edit /etc/lilo.conf to add your new kernel

    +   14. /sbin/lilo


    In these steps, you configure APM during the make config, make menuconfig, or
    make xconfig command. make config is text-based, whereas make menuconfig uses
    a graphical interface for the console. make xconfig produces an X11-based GUI
    for configuring the kernel, as shown in Figure 7.1. The APM configuration details
    are under the General setup options in the dialog box.


    Here are the important APM questions you’ll be asked:


    +   - CONFIG_APM. Answer Y to enable APM.

    +   - Ignore USER_SUSPEND (CONFIG_APM_IGNORE_USER_SUSPEND). Answer N unless you
    have an NEC Versa M-series notebook.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_202_0.png)


    **Figure 7.1** The Linux make xconfig dialog box is used to configure settings
    before building a new Linux kernel.


    +   *   **Enable APM at boot time** (`CONFIG_APM_DO_ENABLE`). You can safely say
    N here; according to documentation included with the Linux 2.2- series kernel,
    some notebooks can hang with this enabled. A safer approach is to not enable this
    feature.

    +   *   **Do CPU IDLE calls** (`CONFIG_APM_CPU_IDLE`). Answer Y.

    +   *   **Enable console blanking using APM** (`CONFIG_APM_DISPLAY_BLANK`). Answer
    Y if you want to try this feature and have the Linux screen saver blank and turn
    off your LCD backlight. Otherwise, answer N.

    +   *   **Turn off power on shutdown** (`CONFIG_APM_POWER_OFF`). Answer Y to have
    Linux turn off your notebook when you use the `shutdown -h` command. (Note: Be
    sure to check your system’s halt script, found under Red Hat’s and Mandrake’s
    `/etc/rc/init.d` directory.)

    +   *   **Ignore multiple suspend or standby events** (`CONFIG_APM_IGNORE_MULTIPLE_SUSPEND`).
    Answer Y, especially if you have an IBM ThinkPad 560.

    +   *   **Ignore multiple suspend or resume cycles** (`CONFIG_APM_IGNORE_SUSPEND_BOUNCE`).
    Answer Y, especially if you have a Dell Inspiron 3200.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '+   * RTC stores time in GMT (CONFIG_APM_RTC_IS_GMT). If you use Greenwich
    Mean Time in your notebook''s hardware date clock, answer Y. Otherwise, use N.
    Although many notebook users do not use GMT in their notebooks, mobile Linux users
    should use GMT to avoid resetting clocks for daylight saving time.


    +   * Allow interrupts during APM BIOS calls (CONFIG_APM_ALLOW_INTS). Answer N
    unless your notebook hangs when using APM suspend mode.


    # # Reading the /proc Directory


    When APM is enabled in your Linux kernel, you''ll find a file named apm under
    the Linux process directory (/proc). This file contains a constantly updated status
    of your system''s power, and it looks like this:


    ```

    $ cat /proc/apm

    1.9  1.2  0x03  0x00  0x00  0x01  93%  186 min

    ```


    APM information is represented in eight different fields. Table 7.1 describes
    each field''s value from this example.


    | **Table 7.1** | Linux /proc/apm Values |

    | :--- | :--- |

    | **Value** | **Description** |

    | 1.9 | The Linux driver version |

    | 1.2 | The APM BIOS version |

    | 0x03 | Status flags detailing support and features |

    | 0x00 | AC status: 0x00 = offline, 0x01 = online, 0x02 = on backup, 0xff = unknown
    |

    | 0x00 | Battery status: 0x00 = high, 0x01 = low, 0x02 = critical, 0x03 = charging,
    0xff = unknown |

    | 0x01 | Battery bit flag: 0 = high, 1 = low, 2 = critical, 3 = charging, 7 =
    no system battery, 0xff = unknown |

    | 93% | Remaining battery life as a percentage of the charge (\-1 = unknown) |

    | 186 | Number of minutes (min) or seconds (sec) |'
  merge: -1
  img_proc: true
- pgno: 204
  md: "# Controlling APM\n\nAlthough most mobile Linux users use hardware keyboard\
    \ commands to initiate APM events, you should know about the finer controls available\
    \ by using APM control software. Several APM support programs besides the apmd\
    \ daemon are provided by the apmd package:\n\n+   * apm. An APM query and command\
    \ tool used to display remaining power, print APM BIOS information, or put your\
    \ computer into standby or suspend mode. For example, the -v command-line option\
    \ returns status, percent, and time remaining:\n+   \n+   ```\n+   $ apm -v\n\
    +   \n+   APM BIOS 1.2 (kernel driver 1.9)\n+   \n+   AC off-line, battery status\
    \ high: 99% (3:18)\n+   ```\n\n+   * apmsleep. A utility that suspends your laptop.\
    \ It can also be used to set an alarm to have your notebook wake up. For example,\
    \ you can set your notebook to wake up at 3:15 p.m. from a standby mode like this:\n\
    +   \n+   ```\n+   $ apmsleep -S 15:15\n+   ```\n\n+   * on_ec_power. A shell\
    \ script that provides a function to determine whether your notebook is on battery\
    \ or AC power.\n\n+   * tailf. A handy version of the tail command that doesn’t\
    \ cause your hard drive to spin while you’re monitoring your system logs in a\
    \ console or X11 terminal window.\n\n+   * xapm. An X11 client that displays your\
    \ notebook’s remaining battery life in hours or minutes or as a percentage (see\
    \ Figure 7.2). Includes a bar indicator that uses colors—blue for charging, green\
    \ for charged, and red for critical discharging.\n\n![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_204_0.png)\n\
    \nFigure 7.2 The xapm client included with the apmd package is a handy battery\
    \ gauge for mobile Linux users."
  merge: -1
  img_proc: true
- pgno: 205
  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_205_0.png)


    Figure 7.3 The *xhattery* client is a simple strip gauge for Linux notebook users.


    +   * *xhattery*. Another X11 client that displays your notebook’s remaining battery
    life using a simple strip gauge and color (see Figure 7.3).


    # ## Potential Networking and Communications Problems


    Mobile Linux users need to be aware that some devices, especially PC cards, might
    not work very well if the notebook is put into suspend or hibernation and then
    resumed. Just as you should never eject a floppy disk until write operations have
    finished (when the drive light, if there is one, goes out), you should always
    wait until read or write operations have finished when using a flash memory card
    (which simulates an IDE drive) or a SCSI PC card interface for an external drive.
    Modem cards might also be susceptible to problems if they are ejected prematurely.


    A much safer approach is to wait for current operations to finish and then eject
    the card and shut down Card Services before putting your notebook to sleep. You
    can do this in a variety of ways, including using a shell script.


    # ## Using a Shell Script


    Shell scripts are a handy way to quickly craft utilities for Linux. The following
    script, which you can name *dosleep*, should work with Red Hat and Mandrake Linux
    notebook systems. The script first uses the `cardctl` command to shut down and
    disable power for two PCMCIA sockets. (If you have only one, don’t use the second
    command.) The script then shuts down Card Services and networking (the script
    assumes you have a network card in one of your PC card slots). Finally, the `apm`
    command is used to put the notebook to sleep.


    ```

    ```python

    #!/bin/sh


    # stop Card Services (note: may not be safe for all cards!)


    # stop networking, then put a notebook to sleep

    /sbin/cardctl suspend 0

    /sbin/cardctl suspend 1

    /etc/rc.d/init.d/pcmcia stop

    /etc/rc.d/init.d/network stop

    /usr/bin/apm -s

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 206
  md: "When resuming from a suspend or hibernate, you could use the following script,\
