- pgno: 253
  md: 'Note that Table 9.3 does not list GNOME. This is because GNOME is not a window
    manager, but a set of libraries and clients used with GNOME-aware window managers,
    such as Enlightenment. Using GNOME or KDE on your notebook requires hundreds of
    additional megabytes of storage space but provides a modern graphical interface
    for your X11 sessions.


    # ## Maximizing Your Screen Real Estate


    One window manager feature you can take advantage of during your X11 sessions
    is the use of an additional display screen, or *virtual desktop*. Not all window
    managers (and especially not those designed for minimalists) provide this feature.
    Legacy X11 window managers, such as *fvwm* and *olvwm*, provide a hint about this
    feature in their name (the *v*). When you use a window manager that features a
    virtual desktop, you''ll generally find a small window, dialog box, or set of
    buttons known as a *pager* that provides navigation to each screen.


    Using virtual desktops is a great way to keep work areas organized and perhaps
    sorted by function. For example, you can conduct your word processing on one desktop,
    electronic mail in another window, Web browsing in a third, and so on. Figure
    9.3 shows a typical pager supporting four virtual desktops, with applications
    running in two of the desktops.


    To navigate to a different desktop, click one of the squares. Your entire display
    will change to reflect the new desktop. Nearly all window managers allow you to
    configure the number of virtual desktops used during your X11 sessions. Legacy
    desktops, such as *fvwm*, use a text file, known as a *resource file*, to contain
    settings that can be changed only between X sessions. Newer X11 window managers
    and desktop environments, such as KDE, provide graphical interface configuration
    tools.


    ![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_253_0.png)'
  merge: -1
  img_proc: true
- pgno: 254
  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_254_0.png)


    > Figure 9.4 KDE''s panel configuration tool can be used to change a number of
    panel settings, including the number of virtual desktop buttons available on the
    panel''s pager.


    to allow changes during your X session. For example, KDE''s kpanel configuration
    tool, shown in Figure 9.4, allows you to change the number of virtual desktops
    from two to eight.


    As with running multiple X sessions, running numerous applications in different
    virtual consoles might eat up your system''s resources, but you''ll be able to
    quickly switch between applications and keep your work organized on different
    displays.


    # ## Working with an External Monitor


    If you really need extra screen real estate or you want to use a larger display,
    you can hook your notebook up to an external monitor (as long as your notebook
    or replicator port provides an external video out port). You might need to make
    a change in your notebook''s BIOS during a reboot in order to enable the use of
    an external display. You might also need to toggle the display of your notebook''s
    LCD on or off by using a special $F n$ key combination on your laptop''s keyboard.


    If you can display the Linux text-only console on an external monitor, but not
    your X11 session, check to see if your XF86Config needs to be edited to include
    special'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'options to enable the use of an external monitor. For example, NeoMagic chipset
    users might need to use the following:


    ```

    option    “extern_disp”

    option    “intern_disp”

    ```


    These options, included in XF86Config’s *Device* section, will enable the use
    of the LCD and external monitor at the same time. You can generally expect to
    be able to use a greater screen resolution with an external monitor, but this
    is not always the case. You’ll need to experiment with an external monitor to
    arrive at the best settings.


    # **Multithread? Xinerama?**


    Notebook users probably won’t be able to use the LCD and external monitor as a
    single monitor, even with the release of the new version 4.0 of XFree86. Although
    X11 supports this feature, multithread displays are generally hardware-dependent
    and require a compliant graphics card. The Xinerama feature, although supported
    by XFree86, requires a compliant or Xinerama-aware window manager—a feature not
    yet supported for Linux.


