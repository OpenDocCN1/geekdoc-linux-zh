- pgno: 167
  md: "This chapter provides potential solutions and troubleshooting information you\
    \ can use if you have problems after installing Linux. Installing Linux for the\
    \ first time on a new notebook is an exciting experience, made even more pleasurable\
    \ when Linux is configured to work with all your notebook's components. However,\
    \ notebook manufacturers use a wide variety of chipsets and hardware in notebook\
    \ lines, so you might have to spend time tracking down and fixing problems with\
    \ your installation.\n\nHere are the main areas of concern when you're configuring\
    \ Linux on a notebook:\n\n+   - **Booting**. Ensure that LILO or your boot procedure\
    \ works properly. If you configure a dual-boot system, you should be able to boot\
    \ to either installed operating system between a system restart or shutdown.\n\
    +   \n+   - **X.** The X Window System should be configured to provide the optimum\
    \ resolution and color depth available for your notebook. Pointer devices, such\
    \ as trackpads and erasers, should work properly.\n+   \n+   - **Sound.** The\
    \ Linux kernel modules or other software should enable you to play audio CDs,\
    \ MIDI files, or .mp3 files through your notebook's sound system.\n+   \n+   -\
    \ **Networking.** You can use your notebook's built-in or PCMCIA Ethernet adapter\
    \ to access your local LAN or a remote network.\n+   \n+   - **Modem and serial\
    \ ports.** You should be able to access your notebook's serial port(s), perhaps\
    \ use IrDA, and configure either an internal or external modem.\n+   \n+   - **Printing.**\
    \ The printing software included in your Linux distribution should work properly\
    \ with your printer(s).\n\nThe important thing to remember is that nearly all\
    \ Intel-based notebooks run Linux and can be configured to provide capabilities\
    \ that match the laptop's hardware. You'll have a much better chance of configuring\
    \ your notebook if it has been on the market for at least a year and is not the\
    \ latest and greatest model from the manufacturer. This is because manufacturers\
    \ generally upgrade internal components, such as video chipsets and sound systems,\
    \ to provide new features but are loath to share technical specifications. Since\
    \ few (if any) chipset makers or notebook manufacturers have hopped on the Open\
    \ Source bandwagon, Linux developers are often denied access to critical information\
    \ needed to make video or sound drivers work with the newer hardware. Hopefully,\
    \ this situation will change as more consumers demand open specifications and\
    \ hardware that will run Linux."
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Vendnor Splendor


    While this book was being developed, a number of notebook manufacturers and vendors
    stepped forward to offer Linux on a notebook. In February 2000, Dell Computer
    Corporation started offering Linux on one model of its Inspiron 5000 series of
    laptops (interestingly, without any fanfare). Other vendors, such as Tuxtops (http://www.tuxtops.com),
    have arrived on the scene to provide an alternative software platform for several
    models of laptops. And in April 2000, eLinux.com (the same folks from PCMall and
    MacMall) started offering Linux on an “OpenBook” series of laptops. Buying a notebook
    with Linux preinstalled is the easiest way to avoid installing Linux and is the
    best way to avoid paying for commercial software you don’t want and don’t need!


    # Using a Boot Manager


    As you know, there are a number of ways to install and boot Linux. How you decide
    to start Linux on your notebook is up to you. There are ways to boot multiple
    operating systems and multiple ways to set up your notebook for booting these
    operating systems.


    If security is an issue, you can also set up your boot manager to use a password.
    An even better approach is to put the boot manager on a removable device, such
    as a floppy, and also require a password. Although no hard drive is secure unless
    it is removable and under lock and key, you can take some basic steps to protect
    your data.


    Every Linux distribution comes with two or more boot utilities. The most commonly
    used utility is the Linux Loader (LILO). This boot manager may be installed in
    the Master Boot Record of your notebook’s hard drive, in your Linux root partition,
    or on a floppy. Other boot managers include PowerQuest’s BootMagic (which might
    be included as value-added software with some commercial Linux distributions).


    # Boot Management with BootMagic


    BootMagic is a boot-loader utility that supports a number of different operating
    systems. The program basically provides a graphical interface in which you can
    use the mouse or keyboard to select and boot an installed operating system on
    your notebook. BootMagic is most often installed along with PowerQuest’s commercial
    partitioning utility, PartitionMagic.'
