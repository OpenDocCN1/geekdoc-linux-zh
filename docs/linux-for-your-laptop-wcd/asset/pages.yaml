    Enter mode number or ''scan'':

    ```


    You can then enter a number, such as 2, and press Enter. Linux will boot and attempt
    to use the console font you selected. If you enter the keyword scan and press
    Enter, the screen will blank for 5 or more seconds, and you''ll again see a list
    of text modes. These modes represent the capabilities of your notebook, and are
    a better list of modes to try.


    # ## Remapping the X11 Keyboard


    Manually remapping your X11 keyboard using various X11 clients and the xmodmap
    client could be a tedious task. However, thanks to Jamie Zawinski''s xkeycaps
    client, you can scroll through a list of hundreds of keyboards and quickly reconfigure'
