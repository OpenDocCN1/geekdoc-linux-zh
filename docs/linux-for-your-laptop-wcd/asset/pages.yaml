  md: 'Some initial drivers are available, but little documentation and only one or
    two test utilities were available at the time this chapter was written. You can
    get more detailed information about FireWire at http://www.firewire.org


    # Your Notebook''s Battery


    Without a doubt, mobile Linux users on the go are held hostage by one of the most
    critical notebook elements: the battery! Battery life is crucial to the success
    of a road warrior, and it determines the amount of productivity and time before
    a working piece of equipment turns into a paperweight.


    Although there are many different types of batteries, such as alkaline, carbon
    zinc, silver oxide, zinc air, and manganese dioxide, only three types of batteries
    are commonly in use with portable computing equipment:


    +   • NiCd (nickel cadmium). One of the heaviest of the rechargeable types, these
    batteries have fallen out of favor because of environmental concerns (cadmium)
    and the development of improved battery technology resistant to the "memory" effect
    of residual charging. This means that these batteries "remember" low-charge states.
    Although inexpensive, these batteries do not handle abuse, such as overcharging
    or undercharging.

    +   • NiMH (nickel-metal-hydride). Used in many different notebooks, these batteries
    can have problems with temperature extremes and overcharging. They are more expensive
    than NiCd and might not last as long.

    +   • LiIon (lithium-ion). These batteries are the latest darling in notebook
    technology. They are durable, hold a charge, provide higher power, and are not
    prone to the memory effect. Although more expensive, these batteries are somewhat
    more "environmentally correct," but like all batteries, they should be recycled.


    Battery usage and capabilities vary between notebooks. Some models can use two
    batteries for extended life, and some manufacturers, such as Sony, offer quad-capacity
    LiIon batteries for 10 or more hours of full-tirt, open-sony mobile computing!


    +   Some obvious steps to increase your mobile activity include the following:

    +   • Spinning down the hard drive

    +   • Turning off the LCD backlight (if possible)

    +   • Not using external devices

    +   • Ejecting unused PCMCIA cards'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'You can also use the software and procedures outlined in Chapter 7, "Advanced
    Power Management," when you''re on the road.


    # # Docking Stations


    Although this book focuses on mobile Linux computing, most notebook owners know
    that some laptops are made to fit into a compatible docking station. These stations
    are designed to easily accommodate laptop insertion and removal, and they offer
    the convenience of turning your mobile machine into a desktop unit.


    External devices, such as a keyboard, printer, monitor, modem, mouse, audio system,
    or network connection, usually remain attached to the docking unit. The laptop
    is then just inserted into the dock before you go to work. Some docking stations
    also offer an additional hard drive or other form of storage.


    Most likely, however, this convenience comes at a price. Stations are designed
    to specifically match a particular notebook model. There''s no such thing as a
    standard docking connector in the notebook industry!


    However, at least two companies build and sell what are touted as "Universal Port
    Replicators." These devices, which offer serial, parallel, keyboard, network,
    mouse, and video connections, connect through your notebook''s PCMCIA port but
    are not compatible with Linux.


