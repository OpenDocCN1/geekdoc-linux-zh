  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_84_0.png)


    **Figure 2.6 The Red Hat printtool client is used to configure local, remote,
    and NetWare printers for Linux.**


    tools included with each distribution. For example, SuSE Linux users will use
