    # Potential LILO Problem


    If LILO fails to boot after you install Linux, and displays only the first two
    letters “L,” this may indicate that LILO cannot access the Linux boot kernel,
    because it might have been installed on a disk cylinder with a number greater
    than 1024. This problem can occur with early versions of LILO, and on older notebooks
    with large internal hard drives. The solution is to create your native Linux partition,
    with the boot kernel, below the 1024-cylinder limit. Another solution is to use
    another operating system’s partition to store the Linux kernel. Browse to http://sdb.use.su/de/sdb/en/html/1024_Zylinder.html
    for details and fixes.


    Choose your time zone, and tell Linux what time is used by your notebook’s hardware
    clock. Remember that there can be a difference between system time and your notebook’s
    hardware clock! For more information about time zones and Linux, see “Linux, Time,
    and Time Zones” in Chapter 16, “Time Zones and Locales.” Click on the Next button
    to continue after setting the time zone. You’ll see the dialog box shown in Figure
    5.20.


    Enter the password you’ll use for the root operator. Don’t forget this password!
    You can also add other users to your system. When finished, click on the Next
    button. You’ll be asked for the type of password system to use. If you’re not
    on a network, just select the defaults and click on the Next button. You’ll see
    the dialog box shown in Figure 5.21.'
