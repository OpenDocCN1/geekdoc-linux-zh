    # ## KDE and GNOME Games


    You’ll find numerous additional games included with your Linux distribution if
    you install GNOME and KDE. Nearly all are also included with Yellow Dog Linux
    for the iBook. Table 18.2 lists just some of the games you’ll discover when you
    install Linux!


    # # Listening to Music


    Nearly every notebook with an internal or external CD drive supports the playing
    of audio CDs. Using a laptop’s internal CD drive is more convenient, because sound
    is generally sent directly to the notebook’s speakers and headphone jack. Some
    notebooks support the direct play of music CDs without the need for the laptop
    to be turned on! If you must use an external CD drive with your laptop, you’ll
    most likely have to use a patch cable connecting the CD drive’s audio or headphone
    jack to your notebook’s line-in jack.'
