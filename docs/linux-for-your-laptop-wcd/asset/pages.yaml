  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_267_0.png)


    Figure 10.5 The X11 xkeycaps client provides a number of keyboard definitions
    for popular notebooks, such as the IBM ThinkPad 770.


    your X11 keyboard to match your hardware. This is especially useful for notebook
    users, because notebook keyboards rarely match desktop PC keyboards in type or
    location of keys.


    Start the xkeycaps client from the command line of an X11 terminal window like
    this:


    ```

    # xkeycaps &

    ```


    After you press Enter, you''ll see two dialog boxes, as shown in Figure 10.5.

