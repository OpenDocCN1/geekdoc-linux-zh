- pgno: 356
  md: 'modem card, it might have an RJ-11 telephone jack or use an external dongle.
    Use the `dmesg` command to see which serial ports were found by Linux when it
    booted:


    ```

    # dmesg | grep tty

    ttyS00 at 0x03f8 (irq = 4) is a 16550A

    ttyS01 at 0x02f8 (irq = 3) is a 16550A

    ```


    In this example, Linux has found two serial ports. One of these ports (on a laptop)
    will be either an external serial port or an internal modem port. Sometimes Linux
    finds three or more serial ports on a laptop, especially if an IrDA port, an internal
    modem, an external serial port, and a PC card modem are inserted into the notebook''s
    Type II slot.


    The ttyS devices in the `dmesg` output correspond to device files found under
    the `/dev/` directory. For example, you can use the `ls` command to look for these
    devices:


    ```

    # ls /dev/ttyS*

    /dev/ttyS0  /dev/ttyS1  /dev/ttyS2  /dev/ttyS3

    ```


    These are Linux device file descriptors and are used when a Linux application
    wants to communicate using a serial port. Note that these devices, unlike transitory
    eth0 and ppp0 networking interfaces, are not created on-the-fly and are not removed
    from your Linux filesystem after use. The interrupts and input/output addresses
    for the serial ports for these devices should be as follows:


    ```

    /dev/ttyS0  0x2F8  IRQ 4

    /dev/ttyS1  0x2F8  IRQ 3

    /dev/ttyS2  0x3F8  IRQ 4

    /dev/ttyS3  0x2E8  IRQ 3

    ```


    Note that if Linux recognizes three serial ports and two happen to use the same
    IRQ, you could have a problem. If this happens, use the `setserial` command, along
    with the name of the serial device, the `irq` keyword, and a new IRQ, to change
    the port''s setting. For example:


    ```

    # setserial /dev/ttyS2 irq 10

    ```


    This might sometimes be necessary, especially when you''re trying to configure
    an IrDA port.


    If you have a PC card modem, make sure Card Services is enabled before trying
    to configure the serial port. If you use Red Hat or Mandrake Linux, look at the
    file `/etc/sysconfig/pcmcia`. In most cases, it should look like this:


    ```

    PCMCIA=yes

    PCC=182365

    ```'
  merge: -1
  img_proc: true
