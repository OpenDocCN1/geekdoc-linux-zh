- pgno: 413
  md: 'This chapter presents a variety of recreational pursuits, software, and strategies
    you can use when you want to relax. You''ll learn about where you can download
    free books on the Internet, how to play popular Linux games that work well on
    a laptop, and how to squeeze 10 of your favorite music CDs onto one CD-ROM. The
    games presented here represent only a few of the very best games for Linux; you''re
    sure to find many more favorites. This chapter is about having fun with Linux
    and your notebook, along with learning how to do the work of a desktop PC!


    # ## Reading Books


    There''s nothing like curling up with a good book on the couch during a rainy
    afternoon or reading a few chapters at night before drifting off to sleep. If
    you''re an avid reader, and you happen to possess one of the new breed of ultralight
    laptops, it''s possible to swap a hard-bound book for a light notebook (and it
    might even be easier to read).


    If you enjoy browsing a favorite bookstore or library for something to read, you
    can now browse the Internet and find plenty of classic and contemporary literature
    to read, download, install, and enjoy on your notebook.


    # ### Online Resources


    One of the best sites for full texts of books in the public domain is Project
    Gutenberg. This project was started in 1971 by Michael Hart at the University
    of Illinois, and it began with a copy of the Declaration of Independence. Since
    then, nearly 3,000 electronic texts (*etexts*) have been created by Project Gutenberg.
    The texts are plain ASCII text, which means that each book can be read by nearly
    every computer in existence.


    Unfortunately, due to the shortsightedness of federal legislators (most of whom
    are in the pockets of mainstream media, the entertainment industry, and other
    corporate interests), copyright periods were extended from 14, and then to 28,
    and finally to 50 years (or more) past the life of the author. This disgusting
    trend reverses the original intent of copyright law, which was to ensure the sharing
    and availability of ideas and published works. (Very few people had access to
    printing presses or bookmaking technology when the laws were first enacted. Today,
    however, few people would readily give up the ability to share information.) These
    recent changes to copyright laws clearly do'
  merge: -1
  img_proc: true
- pgno: 414
  md: 'not favor the public interest. For a short discussion of this issue, read Richard
    Stallman''s article, “Reevaluating Copyright: The Public Must Prevail,” available
    at http://www.gnu.org/philosophy/reevaluating-copyright.html


    # Downloading Books


    The main Gutenberg FTP site is ftp://metalab.unc.edu/pub/docs/books/gutenberg/.
    Browse to the site with your favorite Web browser, and then download a book to
    your directory. The books are stored as plain text or as a compressed .zip file.
    To decompress a .zip archive, use the Linux unzip command like this:


    ```

    # unzip 12ad10.zip

    ```


    This will decompress the archive and save H. G. Wells''s *Twelve Stories and a
    Dream* in your directory. You can then use your favorite text editor, word processor,
    or pager (such as less) to read the book. You’ll find that you can store a complete
    home library of books on your notebook if you have enough drive space! If you
    use X11, you can use the xless browser to read, search, and print your books.
    Use the xless client like this:


    ```

    # xless 12ad10.txt &

    ```


    After you press Enter, you’ll see the dialog box shown in Figure 18.1. You can
    use it to read your book.


    ![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_414_0.png)'
  merge: -1
  img_proc: true
- pgno: 415
  md: '# # Games


    Many games are available for Linux. Whether you''re after a challenging game of
    chess, or you want to vaporize hordes of mutants in the depths of some animated
    hell, you''ll find a Linux program to satisfy your recreational needs. You''ll
    find games that work with or without X11, games only for X11, and games that require
    specific graphics hardware. Some games work in less than an 80-character-by-25-line
    text display, and others work best at a minimum resolution of 1024x768 with thousands
    of colors.


    This section lists several of the best Linux strategy and arcade games that work
    especially well on notebooks with an LCD resolution of 800x600.


    # ## Strategy Games


    If you do not use X11, try the BSD collection of games. Many Linux distributions
    offer this package of console-based fun. You''ll find variants of board games,
    such as backgammon, along with old favorites, such as air traffic control and
    monopolyp. Each game in the BSD collection is designed to work in the text-based
    console. Each game is started from the command line.


    One of the classic games is Adventure, in which you type instructions, directions,
    commands, and questions in order to explore a cave in search of treasure and trinkets.
    The game typically starts like this:


    ```

    $ adventure

    ```

    ...

    You are standing at the end of a road before a small brick building. Around you
    is a forest. A small stream flows out of the building and down a gully.

    ...

    ```

    ```


    One of the most powerful and undefeatable games for the Linux console is gnuchess
    from the Free Software Foundation. To start a game, log in to Linux, type gnuchess,
    and press Enter. You''ll first be asked if you want to specify a number of moves
    and a time limit on play. When the game starts, you''ll see a board similar to
    Figure 18.2.


    Enter moves according to piece location and desired square. For more information,
    read the gnuchess man page. Other variants included with gnuchess draw fancy graphics
    or can be used with a graphics client, such as xboard. The xboard client, shown
    in Figure 18.3, supports gnuchess during X11 sessions. If your notebook has a
    small display, be sure to use xboard, along with its -size small option, like
    this:


    ```

    $ xboard -size small &

    ```'
  merge: -1
  img_proc: true
- pgno: 416
  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_416_0.png)


    **Figure 10.2** *The gnuchess game does not require X11 and plays a powerful game
