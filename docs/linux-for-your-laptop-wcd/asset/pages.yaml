    # ## Connecting Using kppp


    The *kppp* client is included with the K Desktop Environment, which runs on top
    of the X Window System and Linux. This client is much like *netcfg* but is only
    used to set up PPP connections. However, *kppp* allows you to save multiple configurations
    and different accounts on your notebook. This can be very handy if you travel
    around the country or use different ISPs at home and at work; you can save account
    definitions using different phone numbers and even different usernames and passwords!


    To begin, make sure your modem is working with Linux. Next, launch the *kppp*
    client from the KDE desktop panel by selecting the Application Starter, Internet
    menu item. You can also launch *kppp* from the command line of an X11 terminal
    window like this:


