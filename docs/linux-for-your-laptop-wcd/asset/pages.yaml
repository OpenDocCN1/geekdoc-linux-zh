  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_312_0.png)


    ![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_312_1.png)


    Your backup files will be stored in your home directory under the .kde/share/apps/kpilot/DBBackup
    directory, inside a directory that has the same name as your Palm''s user name.
    KPilot has many other features. You can get more information by using its Help
    menu from the main dialog box, or by browsing to the KPilot home page (see the
    final section in this chapter, “Resource Information”).


    # Alternative Synchronization Devices


    If you don''t have much information to synchronize or save as a backup, there
    are other devices you can use with your notebook. These devices do not have to
    be expensive. With a little ingenuity, you can devise creative strategies to back
    up important information.


    # Using Flash Memory


    One of the least-expensive ways to quickly and (more important) safely save important
    data is to use a flash memory card with Linux. Flash memory cards, also known
    as ATA Flash drive cards, flash, or compact flash, are memory cards in PCMCIA
    form factors, usually of Type II. This means that if you have two PC card slots
    available in your notebook, you can use an additional two “mini” hard drives with
    Linux on your notebook.


    Flash memory cards are well supported under Linux, thanks to David Hinds'' Card
    Services. First, ensure that Card Services is running on your notebook. Red Hat
    and Mandrake Linux users should ensure that the proper entries exist in the file
    pcmcia under the /etc/sysconfig directory. Next, make sure that the Card Services
    daemon is running by using the following:


    ```

    #  /etc/rc.d.init.d/pcmcia start

    ```


    If you have a compact flash card (such as those used by many digital cameras),
    insert the small card into its Type II PCMCIA carrier, and then insert the card
    into a slot'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'on your notebook. You should hear two high beeps, signifying that the card
    was recognized and initialized. You can check this status by using the dmesg command:


    ```

    ```

    # dmesg

    ...

    hde: Sundisk SDCFB-8, ATA DISC drive

    ide2  at 0x000-0x0f7,0x10e on irq 9

    hde: Sundisk SDCFB-8, 7MB w/1KB Cache, CHS=245/23/32

    hde: hdel


    ide_cs: hde: Vcc = 3.3, Vpp = 0.0

    VFS: Disk change detected on device ide2(33,0)

    hde: hdel

    ...

    ```

    ```


    Not all the output is shown here. But the pertinent information you can see is
    that Card Services has recognized the card and has assigned a device (\dev/hdel
    in this example) to the card. From here, it is a simple matter to mount the card
    under an appropriate directory (such as /mnt/flash). Use the mount command, like
    this:


    ```

    ```

    # mount -t vfat /dev/hdel /mnt/flash

    ```

    ```


    You can then copy files to and from the card without having to worry about disk
    corruption in case of power loss. This is a handy way to work while on the road!
    When you''re finished saving your files, you can unmount and eject the card using
    the umount and cardctl commands (with the eject keyword and proper slot number):


    ```

    ```

    # umount /mnt/flash

    # cardctl eject 0

    ```

    ```


    # ### Using Iomega Zip Drives


    Another inexpensive device you can use to store information is the Iomega Zip
    drive. This drive comes in a variety of form factors, such as parallel port, internal
    and external SCSI and IDE (ATAPI), and USB. Newer drives (supported by the Linux
    immr.o kernel module) support 250MB disks. This section describes how to use the
    legacy 100MB Zip disks that have a parallel-port Zip drive with newer Linux (2.2.X)
    kernels, such as those included with Red Hat 6.0 and Mandrake 6.1 or greater.


    The first step is to hook up your Zip drive to your notebook using the proper
    cable, and then apply power to the drive. Insert a Zip disk into the drive. Next,
    as root, load the ppa kernel module like this:


    ```

    ```

    # insmod ppa

    ```

    ```'
  merge: -1
  img_proc: true
