- pgno: 299
  md: '**W**hen you use your computer for work, creating text files, spreadsheets,
    graphics, or other important documents, you invest a lot of time and effort. When
    you work with multiple computers on the same or similar projects, you can end
    up with multiple directories containing multiple versions of important documents.
    Keeping track of these documents and ensuring that all important copies are stored
    in a single or multiple locations can be difficult and time-consuming, especially
    if you''re used to copying files using drag and drop, multiple selections, or
    wildcards.


    This short chapter outlines several approaches you can use to keep information
    synchronized between your notebook, other notebooks, or other desktop computers.


    # ## General Strategies


    There are several approaches you can take to keep track of data and multiple documents.
    Obviously, the simplest approach is to keep a central repository or directory
    of files and projects on a computer that has ample hard drive space. As work progresses,
    you dump your files into a central directory.


    Another approach is to selectively back up specific directories. However, before
    you begin backing up, you should devise at least a simple strategy. See Chapter
    13, “Crash Prevention and Recovery,” for details about backup strategies and approaches
    to maintaining recovery data or archives of your system.


    # ## Useful Clients


    Linux comes with a variety of programs you can use to build backup files or archives.
    Two programs, cvs (Concurrent Versions System) and RCS (Revision Control System),
    are generally included with most Linux distributions. Although cvs is nominally
    used to keep track of programming source code changes, RCS was developed from
    the start to maintain different versions of text documents.


    These programs were developed well before the concept of multiple authoring, revision
    marks, and group editing, but they support these concepts. By using these document-tracking
    systems, you can keep tabs on changes to important files through the revision
    control facilities provided by the clients included with each system.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Using RCS


    The RCS system consists of seven different programs, but you can get started with
    document tracking with just two commands: `ci` (check in) and `co` (check out).
    First, create a directory for your document(s) with the `mkdir` command, like
    this:


    ```

    # mkdir work

    ```


    Next, create a directory named RCS in the directory you just created:


    ```

    # mkdir work/RCS

    ```


    Navigate to your project directory, and then create a text file, perhaps named
    book1.txt. At the top of the file, create a header that looks like this:


    ```

    / * $Header$

    $Author$

    $Date$

    $Revision$

    * /

    ```


    Continue editing the file. When you''re finished, save the file and exit your
    text editor. When you next want to work on the file, navigate to the work directory,
    and use the `ci` command, followed by the name of the file to work on:


    ```

    # ci book1.txt

    RCS/book1.txt,v  <--  book1.txt

    enter description, terminated with single ''.'' or end of file:

    NOTE: This is NOT the log message!

    >>  Second revision

    >>  .

    initial revision: 1.1

    done

    ```


    When prompted, enter a short description, press Enter, type a period (.), and
    press Enter again. When you''re ready to open and work on the file again, use
    the `co` command with its `-l` (lock) option, like this:


    ```

    # co -l book1.txt

    RCS/book1.txt,v  -->  book1.txt

    revision 1.1 (locked)

    done

    ```'
  merge: -1
  img_proc: true
- pgno: 301
  md: "You can then open the file in your text editor. However, you’ll see that the\
    \ header information has changed to look like this:\n\n```\n```text\n/* $Header:\
    \ /home/iball/work/RCS/book1.txt,v 1.1 2000/03/02 19:53:46 iball Exp\n iball $\n\
    \ $Author: iball $\n $Date: 2000/03/02 19:53:46 $\n $Revision: 1.1 $\n */\n```\n\
    ```\n\nEach subsequent editing session will update the header. RCS also keeps\
    \ track of all your changes to the file or files in your project folder. You can\
    \ then use other RCS programs to view all the changes to a file, merge changes\
    \ from different versions, or remove a version from the change log.\n\n# ### Reporting\
    \ with tar\n\nThe *tar* (tape archive) command is used to create archives of specified\
    \ files or directories. But you can also use *tar* to compare a backup archive\
    \ with the current state of a directory. For example, you can create a tape archive\
    \ of your work directory like this:\n\n```\n```bash\n# tar cvf work.tar work\n\
    work/\nwork/RCS/\nwork/RCS/book1.txt,v\n```\n```\n\nWhen you use *tar* with the\
    \ *v* (verbose) option, it outputs a list of directories and files being added\
    \ to the archive. One way to keep track of the archive’s contents is to use the\
    \ date and time stamping provided by the Linux kernel. Every file has a creation\
    \ and modification date. You can see this by using the *ls* command:\n\n```\n\
    ```bash\n# ls -l work.tar\n-rw-r-r-- 1 iball iball 10240 Mar 2 15:29 work.tar\n\
    ```\n```\n\nYou can also find out a directory’s creation date by using the *ls*\
    \ command’s *d* (directory) option:\n\n```\n```bash\n# ls -ld work\ndirwr-x-r-x\
    \ 3 iball iball 1024 Mar 2 15:17 work/\n```\n```\n\nManually comparing the date\
    \ and times between archives and directories could be considered a bit tedious.\
    \ You can, however, use the *tar* command to compare the"
  merge: -1
  img_proc: true
- pgno: 302
  md: 'differences between the contents of an archive and the current state and contents
    of a directory. For example, you could create additional files under the work
    directory and then compare the directory with your previous archive by using the
    `tar` command''s `d` option:


    ```

    $ tar fd work.tar work/*

    tar: work:/file2: Not found in archive

    tar: Error exit delayed from previous errors

    ```


    In this example, the `tar` command reports that it found a file named file2 in
    the directory that is not present in the archive. The new file can be easily added
    to the existing archive by using the `tar` command''s `r` (append) command:


    ```

    $ tar fr work.tar work/*

    ```


    This will add the new file to the end of your archive.


    # ## Using NFS


    Creating archives of existing directories works very well for backing up information,
    but the `tar` command is usually used to send files to a remote device, such as
    a tape drive. You can, however, perform direct-copy operations to remote hard
    drives from your notebook’s drive if you connect your laptop to a LAN.


    Using the Network File System (NFS), you can directly mount remote drives or your
    notebook''s drive on remote computers using software included in your system.
    A few simple configuration files and commands are all that''s needed to be able
    to back up entire directories or hard drives.


    # ### Configuring NFS


    The first step in configuring NFS access is to create a file named /etc/exports
    on the remote computer hosting the drives you''d like to mount. The format of
    this file is simple. Each entry consists of a single line, beginning with an accessible
    path and followed by a space, the name of the remote host (in this case, your
    notebook), and read and write permissions in parentheses. For example, if your
    remote computer has an extra hard drive, such as /d3, that contains a directory
    named backup, and your notebook''s hostname is zippo, the entry would look like
    this:


    ```

    /d3/backup zippo(rw)

    ```


    Save the file, and then exit your text editor. Next, make sure that the portmap
    daemon is running on your remote server. This software manages network connections'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'used by NFS. On Red Hat, Mandrake, and Yellow Dog Linux systems, you can start
    the portmap daemon like this:


    ```

    # /etc/rc.d/init.d/portmap start

    Starting portmapper:                                          [  OK  ]

    ```


    The script starts the software. You should see **OK** echoed back to your display.
    Next, ensure that NFS services have been started on your remote server. Use an
    `/etc/rc.d/init.d` script named *nfs*:


    ```

    # /etc/rc.d/init.d/nfs start

    Starting NFS services:                                       [  OK  ]

    Starting NFS steid:                                          [  OK  ]

    Starting NFS quotas:                                         [  OK  ]

    Starting NFS mountd:                                         [  OK  ]

    Starting NFS daemon:                                         [  OK  ]

    ```


    As you can see, NFS services consist of several daemons that run in the background.


    # Mounting the Filesystem


    Your notebook should be hooked up to your network. As root, you can then use the
    `mount` command, along with its `-t` option, the remote server''s name and directory
    (from `/etc/exports`), and a local mount point. For example, if your remote server
    is named *workhorse*, and you''d like to mount its `/d3/backup` directory to your
    notebook''s `/mnt` directory, use the `mount` command like this:


    ```

    # mount -t nfs -o rsize=8192,wsize=8192 workhorse:/d3/backup /mnt

    ```


    The `-o` (option) entries are used to greatly speed up file transfers by specifying
    large read and write buffers. You can then verify that the remote directory has
    been mounted locally using the `ls` or `df` commands:


    ```

    # df /mnt

    Filesystem             Size  Used Avail Use% Mounted on

    workhorse:/d3/backup   1.9G  770M  1.1G 41% /mnt

    ```


    Assuming you have the correct access permission on the directory, you can then
    use the `cp` or `tar` commands to copy or create archives of your work into the
    backup directory:


    ```

    # cp -a /home/bball/* /mnt

    ```


    or


    ```

    # tar cvzf /mnt/backup.tgz /home/bball

    ```'
  merge: -1
  img_proc: true
- pgno: 304
  md: "These commands will copy the entire contents of your home directory or create\
    \ an archive of your home directory on the remote drive. When you 've finished\
    \ working with the remote directory, you can use the `umount` command to detach\
    \ it from your local filesystem:\n\n```\n# umount /mnt\n```\n\n# Using the rsync\
    \ Command\n\nThe `rsync` command, found under the /usr/bin directory, can be used\
    \ to quickly transfer files between directories or partitions on your notebook\
    \ or to a remote computer on your LAN or over the Internet. One of the great features\
    \ of this command is that these transfers are much faster than normal backups\
    \ because `rsync` recognizes when destination files match original files. The\
    \ files are then skipped in the process of “synchronizing” the local and remote\
    \ directories.\n\nThis command may be used to copy local files, to copy files\
    \ from a local computer to a remote computer using a remote shell, or to copy\
    \ files from a remote computer to a local computer. The `rsync` command also recognizes\
    \ a special Uniform Resource Locator (URL), such as `rsync://`. This is useful\
    \ for copying files from a remote server.\n\n# Configuring rsync\n\nThe first\
    \ step in configuring `rsync` is to log in as the root operator and then create\
    \ identical /etc/rsyncd.conf files on your remote server and notebook. For example,\
    \ on your server, perhaps named workhorse, you would create an rsyncd.conf entry\
    \ that looks like this:\n\n```\n```\n[bbell]\n    comment = bbell file area\n\
    \    path = /home/bbell\n    read only = no\n    list = yes\n    hosts allow =\
    \ zippo\n```\n```\n\nThe term in brackets ([ ]) is an identifying name for `rsync`\
    \ known as a *module*. The `comment =` entry is for your use and is returned when\
    \ you use `rsync` to list available services. The `path =` entry defines the source\
    \ and destination of files to be transferred. The `read only =` entry is set to\
    \ `no` so that files may be deleted or created. The `list = yes` entry enables\
    \ the listing of the module and its information. The `hosts allow =` entry is\
    \ used to list individual hostnames or IP addresses, or even a range"
  merge: -1
  img_proc: true
- pgno: 305
  md: 'of IP addresses and hostnames specified by wildcards. In this example, the
    notebook is named zippo.


    The corresponding /etc/rsyncd.conf file on the notebook named zippo would look
    like this:


    ```

    `[ball]`    comment = ball file area    path = /home/bball    read only = no    list
    = yes    hosts allow = workhorse

    ```


    You (as root) must then run `rsync` in its background (daemon) mode on your remote
    server and notebook, like this:


    ```

    # rsync --daemon

    ```


    You''re now set to transfer files!


    # ## Transferring Files


    For example, if your notebook is connected to the LAN, and you''d like to synchronize
    a directory named `work` in your home directory on your notebook with an identical
    directory on your server named `workhorse`, you can use the `rsync` command, its
    `-v` options, and the local and remote directories like this:


    ```

    # rsync -vva workhorse:/home/bball/work .

    ```


    The `v` (verbose) option lists the files that are being transferred, and the `a`
    (archive) option copies files, symbolic links, subdirectories, and contents. The
    period (`.`) assumes that you are executing this command in your home directory
    on your notebook. This means that the preceding command could also look like this:


    ```

    # rsync -vva workhorse:/home/bball/work /home/bball

    ```


    # ## Synchronizing the Palm PDA


    One of the most useful information appliances to hit the market in recent years
    (besides your notebook running Linux) is the Palm PDA (Personal Digital Assistant).
    These ubiquitous devices have captured the hearts and minds of millions of users,
    and many Linux users are especially fond of the lightweight, easy-to-use'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'PDA. One of the reasons is that the Palm PDA is supported quite well by Linux.
    Today, nearly every Linux distribution includes software support that you can
    use to do the following:


    +   - Back up the contents of your Palm to a specified directory

    +   - Restore the contents of your PDA after a battery change

    +   - Install specific software applications

    +   - Delete one or more specified databases

    +   - Retrieve a specific database

    +   - List or display databases in the PDA

    +   - Add records to databases

    +   - And, most important, synchronize data between the contents of a specified
    directory and the contents of your Palm PDA


    # **Palm Computing “Gets It”**


    There are several reasons for the success of the Palm PDA in the marketplace (besides
    a great hardware design). One of these reasons is that 3Com, which debuted the
    Palm PDA, decided to open up the device’s software internals and publish nearly
    all the information needed by developers to write programs for the Palm. This
    information quickly led to free software tools (such as cross-compilers) for Linux
    that can be used to develop programs for the Palm for free. This is unlike Microsoft’s
    now-defunct WinCE, which has been dropped by a number of hardware manufacturers
    over the last year, and which cost developers hundreds of dollars just for software
    development tools. This year, 3Com has again re-entered the handheld market with
    yet another operating system (still based on WinCE 3.0) named PocketPC. Free and
    open information and software, or, costly, proprietary, and closed software? You
    be the judge.


    Much of the magic that makes Linux and the Palm work well together is due to the
    efforts of Kenneth Albanowski and his pilot-link suite of commands. Table 12.1
    lists the programs in this suite (although you can probably get by with just the
    *pilot-xfer* command).


    Using this software is quite easy, but you’ll read about a few tricks in the next
    sections that can make file transfers even faster.'
