  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_389_0.png)


    Figure 16.1 *Use the Red Hat* `*timetool*` *command to set your Linux date and
    time*


    Red Hat, Mandrake, and Yellow Dog Linux include Red Hat''s `timetool` client.
    This command requires that you run X11. It may be started from the command line
    of an X11 terminal window like this:


    ```

    # timetool &

    ```


    After you press Enter, you see the dialog box shown in Figure 16.1. You can use
    it to set the date and time.


    Another command you can use from the console to set the system date and time is
    the `date` command. In its simplest form, use the `date` command followed by the
    month, day, hour, and minute, like this:


    ```

    # date 03221200

    ```


    Wed Mar 22 12:00:00 EST 2000


    After you press Enter, the `date` command displays your new system time.


    # ## Keeping Track of Where You Are


    Red Hat and Yellow Dog Linux use a symbolic link, `/etc/localtime`, to designate
    your current time zone. This link points to the desired time zone database file
    under the `/usr/share/zoneinfo` directory. Under Mandrake Linux, `/etc/localtime`'
  merge: -1
