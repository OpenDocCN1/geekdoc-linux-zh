- pgno: 55
  md: '**O**ne of the best ways to ensure success when installing and configuring
    Linux is to understand the hardware elements of your notebook. Mobile Linux users
    are a hardy lot. By necessity, they seem to have better knowledge of a notebook''s
    limitations—and then try to exceed those limits!


    This chapter describes several of a notebook''s basic components, highlights how
    each interacts with Linux, and provides tips and pointers on pertinent Linux commands,
    utilities, and software you can use with the hardware. You need to know a lot
    about your notebook in order to get the most out of Linux. This information will
    come in handy later if you''re faced with configuration questions. This information
    also introduces the chapters in Part II, “Managing Your Notebook: Making It Work
    the Way You Want.”


    # Type of CPU


    The range of notebooks with CPUs that can be used with Linux now spans early Intel-based
    386-compatibles to the latest 700MHz Pentium IIIs. The CPU is undoubtedly the
    most critical notebook element, but also the most problematic. Fortunately, chip
    manufacturers such as Intel and AMD are designing CPUs to draw less power and
    create less heat, a potentially destructive force inside your laptop.


    Although desktop computers can be cooled down with auxiliary devices such as extra
    fans, notebooks are supposed to provide adequate cooling by design. This has not
    always been the case, however, and models have been produced in which too much
    heat is generated or in which the CPU heats up so much that the system automatically
    shuts down as a fail-safe. This problem was endemic with notebooks using desktop
    versions of CPUs, not CPUs designed for mobile computers. Some desktop CPUs, such
    as early AMD K-6s and Cyrix 686s, purportedly run much hotter than Intel equivalents.
    Fortunately, built-in power-saving features preclude any catastrophe and also
    save energy.


    In general, the current crop of laptops use one of five types of CPUs specifically
    designed for mobile use:


    +   * **Intel Mobile Pentium III** (nicknamed *Coppermine*). Now being manufactured
    with speeds up to 750MHz, these CPUs use new *packaging*, or'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'method of attachment, to notebook motherboards. A smaller, thinner form factor
    results in lower power consumption. You might also read about these CPUs with
    Intel''s SpeedStep technology. According to Intel, the CPU will reduce its “processing
    frequency” to conserve battery life when a notebook is not running on AC, with
    the ability to override this feature to boost performance. This feature could
    have some effect on your laptop''s performance with the current Linux kernels.
    To be safe, see if you can turn off the SpeedStep feature in your notebook''s
    BIOS. The next 2.4-series of the Linux kernel should handle this feature in a
    better fashion.


    +   Intel Mobile Pentium II. Available in clock speeds up to 500MHz, these processors
    (now being replaced by Mobile Pentium IIIs) were designed with 256K of “on-die
    cache” (to help performance) and thin packaging.

    +   Intel Mobile Celeron. Featured in many lower-cost notebooks with speeds up
    to 600MHz, these less-expensive CPUs use Pentium II architecture and MMX instruction
    sets.

    +   AMD K6-2. A popular, less-expensive alternative for notebooks with clock speeds
    up to 533MHz, these CPUs feature AMD''s 3DNow! instruction set. Like MMX, it enhances
    floating-point operations for multimedia programs.

    +   Intel Mobile Pentium MMX. An extremely popular CPU, designed with clock speeds
    up to 300MHz and Intel''s MMX features, which added 57 additional multimedia (video,
    audio, and image) instruction sets to the Pentium chip. This chip also has energy-saving
    features.


    Linux works quite well with all of these processors, and you''ll experience no
    problems when running Linux on a notebook using one of these CPUs.


    # CPU Bugs


    On the other hand, other CPUs such as the early Cyrix 6x86 failed to work with
    Linux unless APM was disabled in the computer''s BIOS. Many Pentiums, including
    the MMX series, still suffer the Pentium “f00f” bug, which can crash a system
    through an invalid instruction. Another bug, the “f0” invalid instruction, affects
    early Pentium and MMX Pentium CPUs. Some versions of the Pentium II and Pentium
    Pro series also suffer a potentially catastrophic floating-point problem. And
    many Intel-based computer users might remember the now-classic early Pentium floating-point
    bug from 1993.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'Fortunately, all modern Linux kernels contain code to handle these problems,
    so you should not have to worry about the stability of your system. You can look
    for some of this output when Linux boots by *piping* (with the bar operator) the
    output of the `dmesg` command through the `fgrep` command:


    ```

    ```

    # dmesg | fgrep bug

    Intel Pentium with F0 0F bug - workaround enabled

    ```

    ```


    This shows (from a boot on a Pentium 300MHz MMX laptop) that Linux determined
    a CPU bug type and enabled a fix.


    # ### How Does Linux Handle CPU Bugs?


    One of the benefits of using Linux is that you get the source code to the kernel
    of the operating system. One of the places to see specifically how Linux attempts
    to detect and protect your system against CPU instruction set errors is the file
    `traps.c` under the `/usr/src/linux/arch/i386/kernel` directory. Note that this
    applies only to Intel-based computers!


    Linux also runs quite handily on older 486-based notebooks. However, with prices
    of used 75 to 150MHz Pentium laptops in the $200 to $400 range, you’ll get much
    better performance with a faster CPU.


    You can also use Linux to determine the exact type of CPU in your notebook. Again,
    use the `dmesg` command, but pipe the output through the `less` text reader (known
    as a *pager*):


    ```

    ```

    # dmesg | less


    Detected 501145385 Hz processor.


    CPU: Intel Pentium III (Coppermine) stepping 01

    ```

    ```


    This shows the output when booting Linux on a Pentium III 500MHz notebook. If
    you use the K Desktop Environment (KDE) for your X11 sessions, use the KDE Control
    Center client Information menu’s Processor item, as shown in Figure 2.1, to display
    details about your notebook’s CPU.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_58_0.png)


    Figure 2.1  The KDE Control Center offers detailed information about your notebook''s
    components, including the CPU.


    # Your Notebook''s Display


    Although your notebook''s CPU is an important internal component, your laptop''s
    display can be a critical factor in your productivity. Early luggable computers
    used traditional *cathode ray tubes* (CRTs) to provide a display. However, the
    included wiring and glass added many pounds. Early notebooks, such as the Tandy
    Model 100, used a simple *Liquid Crystal Diode* (LCD) display to draw characters
    and graphics on the screen. Major advancements in display technology have been
    made since then, but like the CPU, the display is one of the most power-consuming
    components of a notebook.


    The next generation of notebooks used LCD displays, with improvements slowly being
    made to improve density, clarity, and appearance. Because LCDs do not generate
    light, early improved notebooks used some form of backlighting to improve readability.
    Further improvements came along with Twisted Nematic or Super Twisted Nematic
    (SuperTwist) displays, albeit in monochrome. The next leap forward for the notebook
    industry was providing color LCD display. Early models were quite expensive, but
    as manufacturing techniques improved, along with increased volume sales and industry
    demand, in the last eight years, color has become a standard feature of any desirable
    notebook.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Cleaning Your Screen


    First, read your notebook''s manual! Some manufacturers recommend that you use
    a mix of water and isopropyl alcohol, but many modern displays are protected with
    a clear plastic coating that might be damaged by improper cleaning. Do not use
    an anti-static spray or other monitor cleaner, and never use a paper towel!


    Color LCD displays used with modern notebooks come in at least two types of form
    factors. Until recently, many less-expensive notebooks used a passive-matrix transistor-driven
    display providing up to 256 colors, sometimes called Dual-Scan Twisted Nematic
    (DSTN). These notebook displays are recognizable by slow screen draws and low
    contrast and are unusable in full sunlight. However, even with recent improvements
    to beef up performance and resolution to 800×600 pixels, these lower-cost displays
    are now relegated to sub-$1000 notebooks and might disappear from the market altogether.


    Nearly all modern notebook displays use thin-film transistor (TFT) active-matrix
    displays that, at 800×600 pixels, pack nearly 1,440,000 transistors on the glass
    panel! This is the minimal desirable display to have when using Linux. Clarity
    is usually very good, and on many models the display rivals or exceeds traditional
    CRT monitors in clarity.


    Most of today''s notebooks rival desktop computers in power and display. This
    means that most premium laptops distributed by name-brand manufacturers feature
    at least 1024×768-pixel displays with at least thousands of colors.


    # Dead Pixel(s)?


    If you see a red dot on your screen when the display is black, or a blue, green,
    or black dot that never changes color, your display has a dead pixel with a bad
    transistor (which controls the pixel''s color, changing it from red, blue, or
    green).


    Although most notebook makers have strict quality assurance guidelines, the advent
    of 1024×768, 1280×1024, and even 1400×1050 notebook displays means that it is
    possible that a given screen might have 10 (or more) problem pixels. If having
    even one dead pixel is objectionable, check with the manufacturer before you buy!
    Most have guidelines regarding the number and placement of dead pixels before
    a replacement is warranted.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Display Chipsets


    The sad truth at this point, even with the increasing popularity of Linux, is
    that most Intel-based notebook manufacturers still cater to Microsoft''s software
    mo- nopoly and build notebooks to run only one (and, in rare cases, two) variant(s)
    of Microsoft''s operating systems: Windows 98 and Windows NT. At the time this
    chapter was written, the industry was poised for the deployment of Windows 2000,
    and several notebook manufacturers have certified laptops for this operating sys-
    tem. The fact that most, if not all, of these laptops are supported by Linux (at
    least in console, or text-only, mode) is an amazing testament to the determination
    and process of Open Source programmers.


    Another negative factor is that makers of the graphics chipsets that drive modern
    notebooks are loath to release specifications regarding how the displays are driven.
    This poses severe constraints on Open Source programmers struggling to craft display
    driver support for new notebooks. Most, if not all, of these manufacturers are
    concerned only with supporting the Original Equipment Manufacturer of note- book
    PCs and not the end user.


    With the increased power, speed, and display resolution of modern notebooks, these
    chipset manufacturers are in stiff competition to provide hosts of additional
    features, such as ever-faster three-dimensional image rendering, graphics accelera-
    tion, and incorporation of other notebook subsystems, such as audio. Chances are
    good that if you buy a recently introduced laptop with a new graphics chipset,
    you will run into display compatibility problems.


    The graphical interface for Linux is the X Window System. Most Linux distribu-
    tions come with the XFree86 X11 distribution from The XFree86 Project, Inc. Although
    XFree86 is free, you can also purchase a commercial X11 distribution from other
    companies, such as Xi-Graphics or MetroLink, Inc. You''ll improve your chances
    of compatibility if you research support for your notebook''s display before purchase.
    However, most Linux notebook users first try XFree86 to see if it works.


    # The iBook and X11


    Apple iBook users need to use a special Linux kernel (at least version 2.2.14
    or greater) with frame-buffer support, along with a special X11 server application
    named XF86_FBDev. The maximum resolution is 800×600 pixels with a color depth
    of at least 16bpp.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'You can research X11 display support for your notebook by browsing Kenneth
    Harker''s Linux laptop pages at


    http://www.cs.utexas.edu/users/kharker/linux-laptop/


    To read about your notebook''s graphics chipset before installing Linux and XFree86,
    browse to


    http://www.xfree86.org


    and look for documentation associated with the current release. You can also read
    detailed information about your chipset (in case you have problems configuring
    X11 for your notebook) after installing Linux. Look under the /usr/X11R6/lib/X11/doc
    directory. You''ll see a list of files with names beginning with README that contain
    specifics about a particular chipset. Note that not all these files detail notebook
    displays. Some of the pertinent files for XFree86, version 3.3.6 are listed in
    Table 2.1.


    **Table 2.1 Notebook-Related Chipset Information for Xfree86 3.3.6**


    File Name | Description

    --- | ---

    README.Mach32 | Information about the Mach32 X11 server

    README.Mach64 | Information about the Mach64 X11 server

    README.WstDig | Information about Western Digital chipsets

    README.chips | Detailed Chips and Technologies display information

    README.cirrus | Lists Cirrus Logic display chipsets

    README.epson | Information about the Seiko/EPSON SPCH110FOA adapter

    README.neo | Extensive information regarding NeoMagic chipsets

    README.trident | Details laptop chipset configuration options


    Some of these files can contain important information regarding how to use Linux
    and X11 with your notebook. For example, users of NeoMagic graphics chipsets will
    want to read the README.neo file to find out how to enable an external monitor
    to display X11 when the monitor is attached to the notebook''s video-out port.
    Nearly all configuration options concerning how XFree86''s X11 works with your
    notebook are contained in a file named XF86Config, normally located under the
    /etc/X11 directory after Linux is installed and X11 has been configured.'
