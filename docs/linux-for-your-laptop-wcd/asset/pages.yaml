    \ /dev/ir1pt0 c 10 62\n```\n\nYou can then look at the contents of the file `/proc/net/irda/discovery`\
    \ to see if the printer was found within range:\n\n```\n$ cat /proc/net/irda/discovery\n\
    \nIrLMP: Discovery log:\n\nLink saddr=0x0000c404\n\nLink saddr=0x0000c3ed\n  \
    \  name: BJ C-50, hint: Printer IrCOMM, daddr: 0xcab8000\n```\n\nThe next step\
    \ is to create a printer with Red Hat’s `printtool`, configure the printer entry\
    \ to match the printer (in this case, a Canon BJC-50), save the configuration,\
    \ and then edit the resulting entry in the system’s printer capabilities database,\
    \ `/etc/printcap`. Change this:\n\n```\n:IRprinter=/dev/ir1:\n```\n\nto this:\n\
    \n```\n:IRprinter=/dev/ir1pt0:\\\n```\n\nYou can then print a document with this:\n\
    \n```\n$ lpr -PRprinter myfile.txt\n```\n\n# Canon BJC-80 Users\n\nA short page\
    \ of information concerning IR printing with the Canon BJC-80 by Dave Davey is\
    \ available at\n\n`http://www.physiol.usyd.edu.au/daved/linux/bjc-80.html#startup`\n\
    \nMany IrDA devices are supported under Linux, such as mobile phones, printers,\
    \ and plug-in dongles for use with desktop computers."
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Universal Serial Bus


    Universal Serial Bus (USB) was originally developed as a standard in 1995 by several
    large computer manufacturers, such as IBM, Intel, Compaq, NEC, and Northern Telecom.
    Designed to promote the use of inexpensive, low-power, yet high-speed peripherals,
    USB supports data transfer rates of 12Mbps and supposedly allows up to 127 devices
    to be chained or supported via USB hubs. Cable lengths are generally limited to
    5 meters, with shorter cables preferred to avoid drops in voltage.


    Most laptops (and many desktops) manufactured since 1997 support USB by providing
    a small port through which to attach a hub or other USB peripherals such as a
    keyboard, mouse, CD-ROM drive, modem, printer, scanner, or digital camera. One
    of the benefits of using USB is supposed to be the reduction of expensive bus
    connectors and add-in cards; another is the elimination of system resource conflicts
    (such as IRQs). USB devices are also supposed to be hot-swappable, much like PCMCIA
    cards, and many offer pass-through connectors to allow chaining of multiple devices
    (although most USB users will want to use self-powered hubs to support multiple
    devices for best performance).


    USB support for Linux first appeared in the 2.3 development series of the Linux
    kernel, although patches were available in the Linux source tree for later 2.2
    kernels using loadable modules and start and stop scripts. The first devices supported
    included various keyboards and mice. Native USB support will become a reality
    with the advent of the 2.4 series of Linux kernels. Table 2.8 lists a number of
    devices that currently work with Linux.


    To find out how to use USB, the status of USB, or how to make USB work with older
    Linux kernels, browse to


    http://www.linux-usb.org/


    Manufacturer and protocol information about USB may be found at


    http://www.usb.org/


    # IEEE 1394 (FireWire)


    One of the newest high-speed data transfer protocols is IEEE 1394, also known
    as *FireWire*. First championed by Apple Computer, FireWire is much faster than
    USB, with speeds of up to 400Mbps. Perhaps intended as a replacement for the Small
    Computer Systems Interface (SCSI), FireWire is also being touted as the ideal
    way to transfer digital video, or perhaps to enable Local Area Network (LAN) connections.'
  merge: -1
  img_proc: true
