    # Linmodems


    Software-driven, controllerless modems, colloquially called \"winmodems,\" are
    used by many desktop and notebook manufacturers to save production costs. However,
    these so-called modems provide communication services at an additional cost to
    the consumer. For example, nearly all of these modems work only with commercial
    operating systems from a monopolistic software industry behemoth (I''ll let you
    guess which one). Source code for the drivers is not provided and is as yet unavailable.
    If you''re on the commercial operating system upgrade treadmill, there is no guarantee
    that new versions of the modem driver will be available for your laptop! Also,
    these \"modems\" use your notebook''s CPU to do most of the work, providing yet
    another resource drain when you''re trying to get the most out of your battery
    charge. Do not buy a winmodem for Linux! Lucent Technologies is the only manufacturer
    that has stepped forward with a possible solution for Linux by releasing a binary-only
    (no source code, of course) kernel module that has been verified to work on an
    IBM ThinkPad 390X, and many other notebooks. If you''re unfortunate enough to
    have a notebook with a controllerless modem, this module might or might not work
    with your Lucent chip-equipped laptop. Browse to the Linux Winmodem (Linmodem)
    pages at http://www.linmodems.org, and you''ll find other possible solutions,
    such as a driver for modems using an Ambient Tech chipset.


    You can interactively test your modem with the \texttt{minicom} communications
    command. However, you should first create a symbolic link named /dev/modem that
    points to your modem''s serial port. Also, make sure your modem is plugged in,'
