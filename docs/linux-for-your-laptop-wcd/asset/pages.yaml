- pgno: 385
  md: 'T his chapter is about time: how Linux uses time, how you can use time, and
    how you can keep accurate track of time on your notebook. Time is a valuable commodity.
    We never seem to have enough of it, and if we lose track of it, we can get into
    trouble. Few books about Linux cover time issues in any detail. One of the reasons
    is that most users rarely have to think about or fiddle with time and time zone
    settings after installing Linux. Besides, most default settings work well enough.


    However, there are some instances in which time and timing issues can be critical.
    For example, if you''re on the road and have traveled thousands of miles from
    home, chances are good that your mobile Linux environment has the wrong time and
    perhaps even the wrong date. Documents you generate or e-mail messages you send
    can have incorrect date and time information. You can also miss appointments,
    scheduling, or travel arrangements.


    Time is also important if your job requires you to keep close track of it. Work
    that is tracked in billable hours becomes very valuable (and expensive) for companies
    using technicians, computer consultants, or lawyers.


    Network administrators know how important time is, especially when crafting network-wide
    backup scripts or schedules. It is critically important that locally connected
    computers are all set to the same date and time so that they will perform appropriately
    on command or in sequence during backup operations. Coordinating simultaneous
    processing of scripts or programs can be impossible if dates and times are not
    synchronized. Other issues include keeping the accurate date and time, especially
    on systems with password expirations.


    Issues that affect mobile Linux users include APM, which might or might not offset,
    reset, disable, or otherwise screw up correct time settings for Linux or (even
    worse) the computer''s hardware clock (which would be a fault of the BIOS, not
    Linux).


    # Linux, Time, and Time Zones


    There is a difference between the date and time used by Linux, known as the system
    time, and the date and time used by your notebook''s real-time clock, or hardware
    clock. Many experienced mobile Linux users keep the notebook''s clock set to Coordinated
    Universal Time, or UTC (or, in the military, ZULU). Then they set the Linux system
    time as an offset to UTC. This has the advantage of providing a base time value
    that you can easily adjust or update in the system when traveling.'
  merge: -1
  img_proc: true
- pgno: 386
  md: '# The Earth or Atomic Time?


    Most people believe that GMT—or, more properly, UTC—is based on the time kept
    at Greenwich, England. However, UTC is based on atomic clocks kept around the
    world and distributed by radio. Another variation of time is UT1, which is based
    on the rotation angle of the Earth. These times can be different! When this happens
    (about every 18 months), according to the U.S. Naval Observatory, a leap second
    is introduced into UTC. For a detailed discussion, browse to http://tycho.usno.navy.mil/leapsec.html


    As you know, the world is split in many different time zones. These zones run
    in increments of plus or minus hours (and in some cases, 30 minutes) east and
    west of longitude 0, which runs through Greenwich, England (thus the common, but
    not technically used, term Greenwich Mean Time, or GMT). For example, U.S. time
    zones are negatively offset in one-hour increments (because they are west of longitude
    0).


    Linux keeps a database of time zone information under the /usr/share/zoneinfo
    directory. This information, along with the system time, may be manipulated and
    used by various commands included with nearly every Linux distribution. These
    commands are listed in Table 16.1.


    Linux system time is based on the number of seconds elapsed since January 1, 1970.
    The number of seconds is currently stored as a long data type (a 32-bit unsigned
    value), but this value (unlike the MacOS; see the following sidebar) will not
    be large enough to hold the correct number of seconds by January 19, 2038. Although
    most time calculations won''t be affected, some will, and this might cause problems
    due to incorrect assumptions made in computing the difference between dates.


    # Macintosh Time


    The Apple MacOS is immune to Y2K problems because time is stored in a 64-bit value,
    represented by the number of seconds elapsed since midnight of January 1, 1904.
    Geographic and time zone data is stored in the Mac''s hardware (PRAM). This information
    includes latitude, longitude, daylight saving time (DST), and UTC (colloquially
    designated as GMT in Apple''s programming manual).


    Red Hat, Inc. has certified that at least on Intel-based Linux systems, its distributions''
    core 15 time-related commands, six time-related daemons, and six related software
    libraries are Y2K-compliant.'
  merge: -1
  img_proc: true
