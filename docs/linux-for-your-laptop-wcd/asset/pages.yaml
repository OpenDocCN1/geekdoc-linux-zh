    # DSL Connections


    One of the newest and most popular ways to connect to the Internet is through
    a Digital Subscriber Line (DSL) connection. Although this type of connection (in
    its current form) might not be of much use to a mobile Linux user, you should
    know that Linux works quite well with DSL and that this service can be part of
    a mobile solution. DSL, unlike a dial-up ISP connection, is an "always on" connection
    and works through regular phone lines. You don''t have to worry about a busy signal,
    and connections are almost instantaneous.


    You''ll need a PCMCIA Ethernet card (usually 10Base-T for 10Mbps) and an active
    phone line. Notebook users will also need an external DSL modem. Your'
  merge: -1
  img_proc: true
- pgno: 372
  md: 'phone line plugs into the DSL modem, and an RJ-45 Ethernet cable (not a patch
    cable!) is run from the modem to your notebook’s Ethernet card.


    DSL typically offers speeds up to 7.1Mbps, with most lower-cost accounts providing
    640Kbps. Even at the lower end, DSL service provides speeds many times faster
    than the fastest modem. However, one of the problems with DSL service is that
    most providers, instead of using standard networking protocols, have chosen to
    use a perverse form of PPP over Ethernet (PPPoE).


    The PPPoE protocol details how your computer works with a DSL modem, provides
    a quick way for ISPs to authenticate user logins, and dynamically assigns (if
    not using static IP addressing) IP addresses using Dynamic Host Configuration
    Protocol (DHCP). This is called the discovery phase of a DSL connection. There
    are good and bad points about PPPoE. ISPs like PPPoE because some use authentication
    based on the unique Media Access Control (MAC) address associated with each Ethernet
    card. The address looks like this:


    ```

    00:C0:02:F6:32:17

    ```


    You can find the MAC address of your notebook’s Ethernet adapter by using the
    ifconfig command, along with the adapter’s interface name, such as eth0:


    ```

    # ifconfig eth0

    ```


    If your ISP uses a MAC-dependent authentication scheme, this means that you must
    use the same network interface card (NIC) to maintain your DSL connection. Changing
    cards or switching the DSL service connection to a different computer can mean
    a service call to your provider, which is inconvenient to say the least.


    This scheme also has implications for privacy and security (although security
    is always an issue when you have a direct connection to the Internet). However,
    using DSL also involves a trade-off between your security concerns and the need
    for speed.


    # Configuring and Installing a Linux DSL Client


    There are numerous ways to configure Linux to work with DSL. Some methods involve
    patching and recompiling the kernel to add support. Others use complicated editing
    of manual connection scripts. This section shows you one of the easiest ways to
    connect a notebook to a DSL modem and configure service using a simple client
    to connect with Bell Atlantic’s DSL service using Linux. You’ll need your username
    and password for the service. You’ll also need to know how you will use DSL on
    your computer or LAN.'
  merge: -1
  img_proc: true
- pgno: 373
  md: 'Follow these steps:


    Boot Linux and install your PCMCIA network card(s).


    Make sure that Card Services recognizes your card(s), and then use the *ifconfig*
    command to assign an IP address to the card attached to the DSL modem, like this:


    ```

    # ifconfig eth0 0.0.0.0 up

    ```


    If you have another Ethernet card, use this command line, but assign the IP address
    0.0.0.0 to eth1, not eth0.


    Make sure your DSL modem is plugged in and turned on, the phone line is attached,
    and an Ethernet cable is properly attached to the modem and your notebook’s Ethernet
    adapter.


    Browse to http://www.roaringpenguin.com/pppoe.html, and download the file rp-pppoe.1.7.tar.gz
    (or the latest version).


    Decompress the software using the *tar* command like this:


    ```

    # tar xzvf rp.gz

    ```


    Change the directory to the new folder with the *cd* command:


    ```

    # cd rp-pppoe

    ```


    Start compiling and configuring like this:


    ```

    # ./go

    ```


    After you press Enter, the software will configure, build, and install itself.
    You’ll then see the following:


    ```

    Welcome to the Roaring Penguin ADSL client setup. First, I will run some checks
    on your system to make sure the PPPoE client is installed properly...


    Looks good! Now, please enter some information:

    USER NAME

    Enter your PPoE user name:

    ```


    Enter your username (assigned by Bell Atlantic) and then press Enter. You’ll then
    see this:


    ```

    INTERFACE

    Enter the Ethernet interface connected to the ADSL modem (default eth1):

    ```'
  merge: -1
