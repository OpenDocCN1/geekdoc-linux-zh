    # Writing CD-ROMs


    Until the advent of newer notebook models from Dell Computer, few (if any) laptops
    provided an internal CDRW drive. The most common way for mobile Linux users to
    copy, create, or collect audio tracks and data on CD-ROM is to use an external
    CDRW drive with a PCMCIA interface. Unfortunately, the current marketplace offers
    a wide and potentially confusing array of choices when it comes to picking an
    external CDR or CDRW drive. These external drives vary widely in quality, performance,
    price, and size. You’ll find slimmered-down, PCMCIA port-powered versions from
    well-known manufacturers (which might or might not work with Linux) to bulky,
    shoddily built, no-name pieces of junk that only serve to create write-once coasters.


    Fortunately, you can check the CD-Writing HOWTO for an up-to-date list of drives
    that work with Linux. Browse to


    ```

    http://www.gugug.de:8080/cgi-bin/yi-nn1/lsc-orig.pl

    ```


    You can browse through a list of hundreds of drives from nearly 50 manufacturers,
    and read reports from users on how well a model performs.


    Less-expensive (although perhaps equally capable if supported) combinations generally
    use a PC Card IDE interface with an ATAPI CDR or CDRW drive. However, using an
    ATAPI CDR or CDRW drive with Linux can create additional steps and might or might
    not require you to rebuild your Linux kernel. This is necessary to add SCSI host
    adapter emulation, which makes your IDE CDR or'
