    # Other Multimedia Clients


    Linux provides many other types of media players. Several are listed in Table
    18.3.


    Another interesting client is the GNOME `cdplayer_applet`. For use only with a
    GNOME-aware window manager such as Enlightenment, this applet docks into your
    GNOME desktop''s panel and provides miniature CD player controls. This is another
    great way to play audio CDs without giving up space on your desktop for a control
    dialog box.


    # Ripping Audio CDs into MPEG


    Listening to music CDs is a lot of fun, but carrying a case with half a dozen
    or more CDs while on the road can be a hassle. If you have enough drive storage,
    you can store the music from your CDs on your notebook and leave the CDs at home!
    Linux comes with many different utilities you can use to extract and convert music
    tracks from audio CDs into different sound formats. Of course, the most popular
    format and hottest topic on the Internet is MPEG (.mp3) audio. This section'
