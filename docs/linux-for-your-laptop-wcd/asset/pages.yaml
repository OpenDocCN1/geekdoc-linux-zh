- pgno: 87
  md: '# Form Factors


    There are many different types of PC cards for notebooks, along with different
    form factors. Due to the insidious laptop industry trend of including software-driven
    or “controllerless” modems, many mobile Linux users will need to purchase and
    use a PC card modem to connect to other computers. If your notebook has two Type
    II slots, choose either a combination modem and networking card that leaves the
    other slot free, or a modem card that won''t interfere with a second Type II card.


    # Using Card Services


    Some Linux distributions automatically enable PCMCIA support if a PC card is used
    to install Linux (such as for an FTP, NFS, or HTTP installation), but this is
    not always the case. If you install Linux from your laptop''s CD-ROM, you might
    have to manually turn on support. Be sure to install the PCMCIA software! If you''re
    not sure if it is installed, you can try this:


    ```

    # whereis cardctl


    cardctl:  /sbin/cardctl  /usr/man/man8/cardctl.8.bz2

    ```


    This shows that the software has been installed. Next, when using Red Hat (and
    Mandrake) Linux, go to the /etc/sysconfig directory. You should see a file named
    pcmcia. This is the PCMCIA startup options file. Open this file with your favorite
    text editor:


    ```

    PCMCIA=

    PCIC=

    PCIC_OPTS=

    CORE_OPTS=

    CARDMGR_OPTS=

    ```


    To turn on PC card support, edit the file to look like this:


    ```

    PCMCIA=yes

    PCIC=182365

    PCIC_OPTS=

    CORE_OPTS=

    CARDMGR_OPTS=

    ```


    The PC Card Interface Controller (PCIC) entry can be tcic or 182365. This is because,
    according to Hinds, nearly all notebooks use one of two different types of controllers:
    a Databook TCIC-2 or an Intel i82365SL compatible. After making your changes,
    save the file. You can then insert your PC card and (if using Red Hat or Mandrake)
    start Card Services like this:


    ```

    # /etc/rc.d/init.d/pcmcia start

    ```'
  merge: -1
  img_proc: true
