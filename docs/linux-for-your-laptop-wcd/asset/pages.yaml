- pgno: 507
  md: '# Now you can take **Linux** with you!


    Discover the ins and outs of working with Linux on the road with this comprehensive
    guide to mobile Linux computing. Filled with rich, technical detail, you''ll quickly
    and easily master the intricacies of installing and configuring Linux for your
    notebook computer. Featuring easy-to-use, step-by-step directions, this book eases
    the transition from Linux on your desktop to Linux on your notebook. Explore a
    wealth of references, pointers on where to get the software you need, and instruction
    on how to make your laptop work! for you!


    **Bill Ball** is the author of a number of bestselling books about Linux. He has
    been using Linux since kernel version 0.99 and is an advocate of the Open Source
    movement. He is a member of the Northern Virginia Linux Users Group (NOVALUG).


    Technically reviewed by Tutpots¹.


    # Learn Faster


    +   Install Linux on your notebook

    +   Configure the X Window System to work with your laptop''s display

    +   Connect to the Internet to browse the Web and read and send mail

    +   Network your computer in the home, office, or on the road

    +   Use the latest notebook utilities for Linux


    # Learn More


    +   Craft a customized system to suit your needs

    +   Use PC card modules, network cards, and flash memory

    +   Send and receive faxes using software for Linux

    +   Extend notebook sessions with APM while on battery

    +   Install and configure Linux on Intel-based laptops and the Apple iBook


    ![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_507_0.png)


    # What''s on the CD


    +   Linuxcare™ Bootable Business Card for Intel®-based Linux systems

    +   Bootable rescue disk

    +   Recovery disk

    +   Files to create a Linux boot diskette

    +   Diagnostics and testing tools

    +   A feature-rich Debian® file system with hundreds of Linux filesystem and network
    utilities

    +   Start X11 without configuration

    +   This little jewel fits easily into a wallet or laptop bag, and can be a real
    life saver if you need it!


    ![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_507_1.png)


    +   Applications

    +   Install/Configure

    +   Networking/Administration

    +   Programming/Development


