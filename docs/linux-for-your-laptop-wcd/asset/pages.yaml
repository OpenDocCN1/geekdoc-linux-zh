- pgno: 355
  md: 'his chapter introduces you to a variety of techniques and software that will
    enable you as a mobile Linux user to connect to your Internet Service Provider
    (ISP) and the Internet while on the road. You''ll also learn about the different
    technologies that are available to help you along the way. This chapter starts
    by showing you some of the Internet connection tools commonly included with Linux,
    along with common means of connecting to the Internet. It then points you to other
    sources of new techniques and technologies that can help you while you''re roaming
    the office, your home, a warehouse, or the countryside.


    # # Dial-Up Connections


    The modem is the most commonly used tool to connect to the Internet. How long
    this will be true remains to be seen, as other technologies, such as Digital Subscriber
    Line service (DSL) and cellular phone companies, vie for connectivity in the marketplace.
    For now, however, the built-in, external, or PC card modem remains the standard
    connection hardware of choice for mobile Linux users. This section shows you three
    ways to connect to an ISP using Linux software.


    Dial-up Internet connections use the Point-to-Point Protocol (PPP) to provide
    networking services and information over serial lines. A precursor protocol, Serial
    Line Interface Protocol (SLIP), was once popular but now seems to have fallen
    out of favor. PPP is well supported under Linux. When you connect with your ISP
    via modem, Linux creates an interface named ppp0 (for the first PPP device), and
    nearly every Linux networking utility or Internet program communicates through
    the new interface. When you end your connection, Linux removes the ppp0 interface
    from memory.


    # ## Setting Up


    Your first job is to determine what serial port your PC card or internal modem
    is attached to on your notebook. If you use an external modem, you''ll most likely
    need a modem cable with a DB-25 connector on one end and a female DB-9 plug on
    the other end (which fits into the male DB-9 serial connector on most laptops).


