    \     wireless\n192.168.2.30          valo.home.org         valo\n192.168.2.31\
    \          aptiva.home.org       aptiva\n192.168.2.32          ascentia.home.org\
    \     ast\n192.168.2.33         stinkpad.home.org     stinky\n```\n\nTo check\
    \ on the status of an individual device, use `ifconfig`, followed by the device\
    \ name, like this:\n\n```\n# ifconfig eth0\n```\n\nApple iBook users might see\
