- pgno: 278
  md: "# ## Using Graphical Interface Administration Tools\n\nAlthough it is possible\
    \ to set up, configure, and enable networking manually under Linux, you might\
    \ want to opt for a much easier approach by using one or more graphical interface\
    \ networking tools. Red Hat and Mandrake Linux users will find two tools especially\
    \ helpful: the older and more mature netcfg (network configuration) client, or\
    \ the newer and quite capable `linuxconf` tool.\n\nSuSE Linux users can use the\
    \ YaST tool, and Caldera OpenLinux users can use `lisa` or COAS. Some of these\
    \ programs, such as YaST, `lisa`, and `linuxconf`, do not require a running X11\
    \ session. On the other hand, Red Hat's `netcfg` must be run from the command\
    \ line of an X11 terminal window or through Red Hat's `control-panel` client for\
    \ X11.\n\n> ### The iBook's Ethernet Adapter\n> \n> When this chapter was written,\
    \ support for the Apple iBook's internal network adapter was so new that iBook\
    \ users had enjoyed the benefits of TCP/IP networking for only two weeks! During\
    \ development and testing, it appeared that PowerPC Linux support for the iBook's\
    \ networking adapter was not as robust as it could be (meaning that the `ifconfig`,\
    \ `netcfg`, and other software did not work as well as the general PowerPC kernel\
    \ support software for the internal adapter).\n> \n> Although this software picture\
    \ will certainly improve with time, bear in mind that the software configuration\
    \ tools described here will work very reliably on Intel-based notebooks. Linux\
    \ on the iBook was only four months old at the time this chapter was written!\n\
    \n![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_278_0.png)\n\nTo begin a fresh configuration,\
    \ make sure your adapter has been recognized by Card Services. Next, as root,\
    \ start the `control-panel` client through your X11 window manager's menu. Alternatively,\
    \ in the command line of an X11 terminal, type\n\n```\n`# control-panel &`\n```\n\
    \nAfter you press Enter, you'll see the `control-panel`, as shown in Figure 11.1.\n\
    \nAfter the `control-panel` appears, click on the Network button. You'll see Red\
    \ Hat's `netcfg` tool, as shown in Figure 11.2.\n\nWhen the `netcfg` dialog box\
    \ appears, click on the Interfaces button, and then click on the Add button. You'll\
    \ see a small dialog box, as shown in Figure 11.3."
  merge: -1
  img_proc: true
