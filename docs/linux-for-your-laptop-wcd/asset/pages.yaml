- pgno: 441
  md: 'This short chapter provides a list of “must-haves,” safety items, and other
    goodies for the mobile Linux user. Although you might think this list of notebook
    toys is overly simple, you’d be surprised at how many times people forget some
    of the basics when hitting the road.


    I’m sure you’ll have your own list of favorite toys and essentials when you hit
    the road, such as a soldering iron, rosin, and heat sink if you’re a Linux hardware
    freak, or a six-pack of Jolt Cola and a case of caffeinated Penguin peppermints
    if you’re a Linux code geek.


    # Ultimate Linux Geek Site?


    Got root? Need a jolt, but don’t know where to get the very best hyper-caffeinated
    products to use during your all-night Linux coding sessions? Browse to the ultimate
    Linux geek site at http://www.thinkgeek.com. You’ll find at least a dozen different
    products, including caffeine-spiked water bottles that can give you that oh-so-needed
    midnight lift. And by the way, a tin of Penguin peppermints is an essential part
    of any mobile Linux road kit.


    # The List


    **AC adapter and cables.** You’ll need at least one to keep your notebook’s battery
    charged in between day trips while on the road.


    **AC extension cord.** You might or might not need one of these, depending on
    the length of your notebook’s AC adapter. Most cords for Sonys are 7.5 feet. Cords
    for IBM ThinkPads are 9.5 feet. Apple iBook cords are 10 feet, 2 inches.


    **Acoustic coupler.** Unless you’re going to Timbuktu, Mali, you might want to
    forego an acoustic coupler—that is, until you find yourself at a pay phone without
    a phone jack when you need to check or send e-mail.


    **Alarm system.** Unfortunately, there are many dirtbags who would love to snarf
    your brand-new $3,500 laptop. You might want to invest in a motion-sensitive alarm
    if you park your notebook on a desk or by your side at the airport. However, the
    best advice is to not leave your notebook unattended!'
  merge: -1
  img_proc: true
- pgno: 442
  md: '**Blank express delivery envelopes and labels**. Save time and effort by packing
    a few blank overnight envelopes before you go on your trip. Many airports, hotels,
    and businesses have overnight-service mailboxes you can use.


    **Blank flopp y disks**. If your notebook has a flopp y port, take along a few
    blank flopp y disks. Even better, take along an emergency Linux boot disk. Use
    Red Hat''s `mkbootdisk` command to create one before you go on the road.


    **Blank Zip disks**. If your notebook has a Zip or LS-120 drive, take along a
    spare in case you want to share information.


    **Business cards**. Always have some on hand. These aren''t as trendy as beaming
    your Palm PDA business card to another Palm, but business cards, descended from
    Carte(s) de Visite (see http://www.storereviews.com/actors.html), serve quite
    well for introductions and contacts.


    **Calling card**. If you have your calling card number memorized, that''s great!
    If you don''t have a calling card from your long-distance provider, research costs
    first. Some phone companies charge exorbitant fees for using a calling card. One
    alternative is to buy a specific-dollar-amount calling card and keep it on hand
    in case you need it. (Check for any expiration clause when you buy these cards.)


    **Car confirmation number**. Don''t forget your rental confirmation!


    **Carrying case**. The essential road warrior''s kit bag. Many mobile Linux users
    have more than one notebook case. Unless you have a Panasonic Toughbook (with
    a sealed LCD, magnesium case, sealed keyboard, internal dampeners, and dust-sealed
    hinges), you''ll need a good notebook case. Cases come in many styles from many
    manufacturers and are made from a variety of materials, ranging from fine leather
    to nylon and metal alloys. But if you just need a slipcover case for your notebook
    with the slight protection afforded by neoprene, browse to http://www.thepouch.com
    to order a low-cost, custom-fit cover for your Linux laptop.


    **Cash**. Until taxi drivers take plastic, you''ll need some cash on the road.
    Although I''ve actually seen geeks at LinuxWorld pay for coffee with a credit
    card, cash still reigns in the fast-food line.


    **Cell phone**. The smaller, the better. One-rate plans now provide coast-to-coast
    service. If you''re going overseas, check on coverage and availability of service.
    Better yet, lease a satellite phone (see http://www.gmpcs-us.com/rental/). At
    the time this chapter was written, rates were only $450 per week for 64KBps at
    $13 per minute. It''s too bad Iridium went down the tubes!'
  merge: -1
  img_proc: true
- pgno: 443
  md: '# Chapter 18: The Essential Read Kit


    **Cell phone car adapter.** This is essential unless you''re taking a short road
    trip and either you carry an extra charged battery or your cell phone works for
    100 hours on a single charge.


    **Credit cards.** They''re an evil, nasty necessity in today''s world. Use only
    one, find a credit card with no annual fee, and always pay off your balance by
    the end of the month.


    **Day planner.** Why anyone using a Palm PDA, StarOrganizer, korganizer, plan,
    or ical for Linux would need one of these is beyond me. However, some people swear
    by them and like to stuff other things inside, such as checkbooks, calculators,
    and credit cards.


    **Digital camera.** Early models of these instruments were bulky and expensive
    and required lots of online storage, such as a separate hard drive encased in
    a shoulder or belt pack. Today you can get a reasonably inexpensive digital camera
    with re-movable Compact Flash storage that provides at least 5×7-inch pictures
    for less than $300. Many of these devices have a serial or USB port, but the fastest
    way to transfer data is by using the Compact Flash card in your notebook''s PC
    Card slot. If you have a serial camera, take a look at the gPhoto client (http://www.gphoto.org),
    which supports nearly 100 different digital cameras under Linux and X11. You''ll
    need the latest gtk+ software libraries and the gcc C compiler to build and install
    the software. However, you''ll be pleasantly surprised to find that gphoto works
    better than the commercial support software provided with your camera. (In many
    cases, it excels by having more features.) In some instances, espe-cially with
    a close-up lens kit, your digital camera can also function as a scanner!


    **Driver''s license.** Flying by E-ticket? You won''t if you forget your driver''s
    license (unless you have a police report stating that your wallet was stolen).


    **External CD-ROM drive.** In the recent past (12 months ago), these were bulky
    hunks of plastic with thick cables and brick transformers. Nowadays, most have
    trimmed down to slick and sleek devices that power off your PCMcia card. Many
    initialize as `/dev/hdg` under Linux, depending on the number of spindles in use
    on your notebook. They are usually used with an ultralight or mini-notebook computer.
    These devices suck power like crazy when used externally, although some models
    are equipped with internal rechargeable batteries or an external battery pack.


    **Flash card for backup.** This is an excellent, safe choice for backing up important
    documents and files. The drawback is that flash memory (using ATA or Compact Flash
    Type II cards) is still somewhat expensive. However, if you read David Hind''s
    PCMcia-HOWTO, you might be able to craft a bootable filesystem on a card, especially
    if your notebook has a floppy drive. These cards require little power and have
    life spans measured in 100,000 or more read/write cycles.'
  merge: -1
  img_proc: true
- pgno: 444
  md: '**Gel wrist pillow**. This is a great item to use, especially if you can find
    one that can double as a neck pillow for when you''re commuting. Although many
    larger notebooks have taken ergonomic design lessons from Apple''s PowerBook line,
    ultralight and mini-notebook users may avoid Carpal Tunnel Syndrome (see http://www.carpal-tunnel-syndrome.net/carpaltunnelsyndrome.htm).


    **GPS**. Many different Global Positioning Satellite receivers are supported under
    Linux. In many cases, you can easily access raw satellite data just by hooking
    up the GPS to your notebook''s serial port and then running xminicom with the
    correct speed and protocols. For example, the DeLorme Tripmate receiver works
    at 4800N81. After plugging in the unit, starting xminicom, and then typing `ASTRAL`,
    you''ll receive standard National Marine Electronics Association (NMEA) data at
    your console. Most Linux software works by translating received strings of data
    and then properly displaying the data in a window (such as date, time, satellite
    number, altitude, speed, direction, and latitude and longitude).


    **Hotel confirmation number**. Don''t forget to write this down or put it in your
    PDA, especially if you''re going to arrive late to LinuxWorld or Comdex!


    **International phone and electrical adapters**. If you''re traveling abroad,
    these adapters (usually sold in convenient pouches) can be a lifesaver. There''s
    nothing like being able to overcome technical obstacles without having to search
    for an electronics store.


    **Itinerary**. Itineraries help keep you organized, on track, and on time. Use
    your favorite Linux software or hardware PDA to input your schedule, and then
    print two copies. Leave one at home, and put the other in your briefcase.


    **Linux installation CD**. Recovery floppy aside, this is the next best thing
    to having a backup. Of course, if you have a CD writer, you could try burning
    a bootable image of your Linux filesystem before you go on the road. See Vinfried
    Trumper''s CD-Writing-HOWTO (found under the `/usr/doc/HOWTO` directory or at
    http://www.linuxdoc.org).


    **Meeting schedule**. A possible subset of your itinerary, meeting schedules should
    also include names, phone numbers, and e-mail or Web information about the attendees.
    Keep a copy on your notebook, a hard copy back at the office, and an extra copy
    in your briefcase.


    **Microdrive for Type II slot**. This is one of the newest and hottest accessories
    for the mobile Linux geek. These incredibly small (1-inch) hard drives developed
    by IBM are manufactured in the same form factor, and in many instances, they can
    replace Compact Flash cards in digital cameras. Although currently they are available
    only in 170MB and 340MB sizes, these low-power drives portend the future for removable
    storage. You''ll need a Type II PCMCIA adapter in order to use one'
  merge: -1
  img_proc: true
- pgno: 445
  md: 'of these drives with Linux and Card Services. Don''t expect massive throughput,
    especially with a 16-bit PC bus. You''ll get about 2 to 3MBps transfer speeds.


    **Modem and connector cable (RJ-11).** What? Your notebook doesn''t come with
    an internal modem that works with Linux? You must have a notebook with one of
    those worthless software-driven modems that currently plague the notebook industry.
    The good news is that eventually the number of Linux notebook users will force
    the industry to reconsider the use of these evil little items, open up the specs,
    or revert to using non- CPU-burdening communication devices. In the meantime,
    choose a notebook that has a real modem. If your notebook has only one Type II
    slot, get a combination Ethernet/modem PC card. If your notebook has two slots,
    you should still get a combination Ethernet/modem card, but one that doesn''t
    take up two slots (such as a Linksys EtherFast 10/100 + 56K V.90). If you need
    only a modem card, don''t buy a winmodem PC Card (yes, these pieces of junk have
    infected PC Card modem lines, too). Buy a PC Card "real" modem, such as a Viking
    56K V.90, or a modem with an XJACK connector. XJACK and similar connectors help
    you avoid proprietary dongles that can break, and you need only a spare phone
    cord.


    **Notebook car power adapter (12VDC to 120VAC).** This is very handy if you''re
    traveling a long distance by car or work out of your car. Many notebook manufacturers
    offer these adapters, which usually plug into a cigarette lighter or, if you drive
    an SUV, the "data power port" (which can probably still light cigarettes).


    **Notebook computer.** Lighter, faster, more memory, more hard drive space, extended
    battery life, overnight warranty replacement, and more features using open- spec
    hardware—this is what mobile Linux users demand! But don''t forget yours when
    you go on the road!


    **Notebook printer cable.** As notebooks and printers get smaller and smaller,
    some things stay the same, such as thick DB-25 Centronics printer cables. However,
    if you''re going on the road, you don''t have to lug a 6-foot printer cable! You
    can buy shorter 24- to 30-inch printer cables at most computer stores. Some printers,
    such as the Canon BJC-50, include a proprietary lighter-weight cable (albeit 62
    inches long). But if you have an infrared printer such as the BJC-50, the only
    reason to carry a printer cable is to hook up to someone else''s printer.


    **Pager.** Cheaper and lighter than most cell phones, pagers are a convenient
    way to be notified of phone calls, news, important events, sports scores, or stock
    reports. However, a pager can be a modern-day ball and chain, especially if you''re
    shackled to one because of work. Many paging features are now being incorporated
    into new cell phone technology, so you might want to invest in a higher-end cell
    phone and ditch your pager.'
  merge: -1
  img_proc: true
- pgno: 446
  md: 'Passport. If you''re traveling overseas, you''ll need a passport. Don''t let
    yours lapse or lose it! If you need a new passport or visa to another country,
    you can try one of the many new travel document services, such as http://www.traveldocs.com,
    to help expedite the paperwork. U.S. citizens can renew passports through any
    post office (ask for form DSP-82). You''ll need two professional passport photos,
    your lapsed passport, and possibly other documents.


    PDA. If you have one, don''t forget it. If you''re going to buy one, get a monochrome
    Palm PDA and ignore any Windows CE device (many manufacturers have dropped their
    CE device lines).


    Phone-line tester. If you''re worried about damaging your notebook''s modem by
    inadvertently plugging it into a digital phone line, practice safe computing and
    get a cheap tester. These typically have an LED indicator to tell you if the line
    is safe.


    Removable floppy drive. Many mini-notebooks do not come with an internal floppy
    drive. A good alternative might be an LS-120 drive, which can also be made into
    a bootable Linux 120MB filesystem. You''ll probably need to treat the device as
    an IDE drive and change the boot order in your notebook''s BIOS. These drives
    work with Linux, but the status in the USB versions is unknown at this time.


    Rescue CD-ROM. One of the biggest hits at LinuxWorld in March of 1999 in San Jose,
    California was Linucare''s distribution of emergency bootable Linux CD-ROMs in
    the shape of a business card. Stuff one of these babies in your notebook, reboot,
    and you''ll boot to a 38MB Debian system loaded with software recovery tools (and
    a slide show of the developers). See http://www.linucare.com.


    Ricochet modem. If you want to avoid juggling a modem, phone cord, or cell phone
    just to get your e-mail, take a look at the Ricochet modem at http:// www.metricom.com.
    These wireless modems, which use one of your notebook''s serial ports and include
    a rechargeable three-hour battery, currently provide a 28.8Kbps connection with
    128KBps in the works for mid-2000. More than 40 college campuses across the U.S.
    have full coverage. Several hundred cities and airports are also covered. Linux
    works well with the Ricochet network.


    RJ-11 inline coupler. These handy items allow you to extend your reach from the
    wall''s phone jack. Many PC card modems with proprietary dongles provide only
    3 feet of length. Extending your reach might allow you to browse the Web or do
    e-mail while sitting on your hotel room''s balcony.


    RJ-11 phone cord. You can get these just about anywhere for a few bucks, but a
    much better product is a retractable phone cord that fits into its own credit-card-sized
    holder. Products from Targus and Fuji typically store 8 feet or more of phone
    line in an extremely compact package.'
  merge: -1
  img_proc: true
- pgno: 447
  md: '**RJ-11 phone splitter.** This is very handy if you need to share a single
    phone line but want to have your phone and notebook plugged in at the same time.
    Be aware that some splitters, especially those that plug into the wall, are designed
    to provide two separate phone lines, not split a single line. (Most homes are
    wired for two lines by default. Only two wires of the four-wire RJ-11 are used
    for a single line.)


    **Spare batteries for cell phone.** This is a good idea if you''re going to be
    on the road for a while but don''t want to take the recharging unit.


    **Spare batteries for PDA.** Fortunately, Palm PDA users don''t have to worry
    about replacing batteries very often, unless they go on month-long road trips.
    Users of WinCE (makes you "wince," doesn''t it) had better stock up, because battery
    life on most supporting hardware platforms is measured in hours.


    **Spare battery for pager.** Beep, buzz, or vibrate, pagers require batteries.
    Pagers with LCD screens, Web browsing, and news and stock quotes require even
    more juice.


    **Spare dongles.** I''m not talking about the evil software-enabling dongle (you
    deserve what you get if you buy software that requires a hardware dongle), but
    a spare dongle for your modem or network card. See http://www.thesupplynet.com
    for replacement dongles for nearly any manufacturer''s PC card.


    **Spare notebook battery.** If your notebook doesn''t support the use of two batteries
    at once, you can take along a spare. Many laptop batteries (especially NiMh) last
    only a year with daily use and recharging. LiI on batteries are generally rated
    for 400 discharge/charge cycles (for at least a 50 percent charge rate), so if
    you plan to use your notebook for a couple years, a spare battery is a good idea.


    **Spare pointer eraser.** ThinkPad and some Toshiba and Hitachi users will definitely
    need to replace the eraser-type pointer caps at some point in time. Be forewarned
    that they are not cheap, and usually cost $3 to $6 each. Although these pointing
    devices work well, getting stuck out on the road with a broken pointer cap can
    be, well, somewhat embarrassing. ThinkPad TrackPoint tips are red (part #84G6537),
    although a blue variant is listed on IBM''s ThinkPad accessories Web page (part
    #12J4552). You can order the red tips (four for about $22 with shipping) from
    http://www.compu-lock.com/default.html.


    **Surge suppressor.** You''ll find a number of smaller AC surge protectors available
    for mobile users with laptops. You should always use one to protect your computer
    equipment, especially while you''re on the road.


    **Three-pronged adapter.** Always carry a three-prong to two-prong AC adapter
    when traveling. Many old (two-prong) outlets are still in use, and many notebook
    AC adapters use three prongs.'
  merge: -1
  img_proc: true
- pgno: 448
  md: '**Tickets.** Plane, train, boat, or movie tickets—don’t forget them! Life is
    easier now that many ticketing functions are moving to the Internet. Airline E-tickets
    require only your driver’s license.


    **Traveler’s checks.** These are safer than cash, and more convenient than checks,
    but bulkier than a credit card. It’s nice to keep a small stach in your briefcase
    when you’re traveling.


    **Visas.** Don’t forget any required visas if you’re traveling to another country.
    Getting into other countries is usually not a problem, but you should be aware
    that some countries charge you $100 or more (in the form of an “airport” tax)
    before you can leave!


    # # Before You Leave


    Before you take off, make a checklist of items you’ll need for your trip, and
    complete any necessary tasks to make life easier when you get back. This includes
    unsubscribing to mailing lists and perhaps creating a .vacation file or .forward
    file in your home directory to take care of incoming mail. For example, if you
    have a local ISP, you can temporarily transfer your mail to a new Web-based account,
    such as through yahoo.com.


    Always keep a backup of any important configuration files, mail settings, IP addresses,
    or other user files you might need later. If you have a nationally based ISP,
    research any local access numbers before you go on the road, and possibly configure
    different accounts or settings, such as with the kppp client, so that you can
    easily connect while on the go.


    Anticipate the worst. What would happen if your notebook disappeared? Do you have
    a backup? Can you get to that backup online, by telnet, or by ftp? What kind of
    plan have you made to get back up to speed as quickly as possible? If you’re prepared,
    losing your entire mobile environment doesn’t have to be a disaster.'
  merge: -1
  img_proc: true
