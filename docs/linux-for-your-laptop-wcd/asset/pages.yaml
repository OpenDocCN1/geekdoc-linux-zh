- pgno: 143
  md: 'T his chapter covers the installation of Red Hat and Yellow Dog Linux. It begins
    with a short overview of a typical installation. You''ll learn about partitioning
    an Intel-based notebook, with an emphasis on using the `fdisk` command. You''ll
    also see how to use Apple''s HD Setup on an Apple iBook to create the space necessary
    for Yellow Dog Linux. You''ll then be taken, step by step, through an installation
    of the very latest version of Red Hat Linux on an Intel-based notebook. You''ll
    also get tips and tricks on installing the very latest distribution of Yellow
    Dog Linux on the iBook.


    # Basic Installation Overview


    Before you begin your installation, you should have a pretty good idea of how
    you''re going to use Linux, know a bit more about your notebook''s hardware, and
    understand the storage requirements for your system. You should also know how
    you''re going to boot Linux and what software and services you will use on your
    new system. You should also know if you''re going to install just Linux or configure
    a dual-boot system using another operating system.


    Installing Linux is usually a simple task. Here are the basic steps for installing
    just Linux and its software:


    +   1. Turn on the notebook.

    +   2. Insert your Linux CD-ROM.

    +   3. Boot to the installation.

    +   4. Install Linux (and configure hardware during the installation).

    +   5. Reboot the notebook.


    If you''re configuring a dual-boot system that will host Linux and another operating
    system on your notebook''s hard drive, you''ll first need to create room for Linux.
    Here are the basic steps for installing and configuring a dual-boot system:


    +   1. Turn on the notebook.

    +   2. Boot to the existing operating system, and then defragment the hard drive.

    +   3. Use a commercial utility, or boot with a DOS boot disk and make room for
    Linux.

    +   4. Boot to the Linux installation.

    +   5. Install Linux (and configure hardware during the installation).'
  merge: -1
  img_proc: true
- pgno: 144
  md: '+   6. Reboot the notebook, and then choose to boot Linux or the other operating
    system.


    Configuring your hard drive to support multiple operating systems can be tricky,
    but you can also try some tricks of your own, such as sharing a single swap space
    between two different operating systems. Here’s a short list of mini-HOWTO documents
    you’ll want to read before you begin configuring your notebook:


    +   * **Linux+DOS+Win95+OS2**. Details how to partition, install, and boot four
    operating systems.

    +   * **Linux+FreeBSD**. Shows how to use Linux and FreeBSD.

    +   * **Linux+Win95**. Details hard drive strategies and booting.

    +   * **Linux+NT-Loader**. Details how to boot Linux using NT’s loader.


    Finally, you should know that you can also install different Linux distributions
    on your notebook and then boot to SuSE Linux or Red Hat, Mandrake, Corel, Caldera,
    or TurboLinux!


    # What Is Partitioning?


    This section discusses how to split your hard drive into separate volumes, or
    *partitions*. Making room on your notebook’s hard drive for other operating systems,
    known as *partitioning*, can be somewhat confusing, especially if you’ve never
    attempted this process. Partitioning is an essential step in a traditional Linux
    installation. However, as you’ve learned in previous chapters, there are ways
    to run Linux on your notebook without partitioning (such as using WinLinux2000,
    which creates a virtual disk on your Windows-formatted hard drive).


    # Filesystem Versus File System


    The Linux kernel and associated software usually reside on parts of your hard
    drive formatted for the native Linux ext2 *filesystem*. This underlying format
    details how files and directory information are linked and provided to the Linux
    kernel. However, you should know that Linux can recognize many different types
    of filesystems, such as FAT (used for DOS), VFAT (used for Windows), ISO9660 (used
    for CD-ROMs), HFS (used on older Mac systems), and others. The organization of
    directories, such as /, /home, /bin, /usr/bin, /usr/X11R6/bin, /tmp, and so on,
    is known as the *Linux file system*. Understanding the difference between a filesystem
    and the Linux file system is an important step in understanding how to use Linux.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'The basic steps in partitioning a notebook’s drive for Linux involve creating
    a new partition and then booting to the Linux installation. During the Linux installation,
    the new partition will then itself be partitioned to provide at least one native
    Linux partition and one Linux swap partition. The swap partition is used with
    virtual memory to swap parts of main memory to disk.


    Most experienced mobile Linux users use partitioning to do the following:


    +   * Create separate directories on distinct volumes for the Linux file system.

    +   * Organize the Linux file system, such as creating a separate `/opt` volume
    for third-party or commercial software packages.

    +   * Create an appropriately sized swap partition, usually according to the amount
    of physically installed RAM.

    +   * Proactively protect various parts of the file system. Additional drive volumes
    can be “hidden” and not automatically mounted when Linux boots.

    +   * Create ease of use when running backup programs to archive specific directories,
    such as `/home` (where all system users’ data resides).

    +   * Assign a separate area for temporary files, such as `/tmp` or `/var/tmp`
    to protect other volumes from overflow.


    As an example, if your notebook with 64MB of RAM has a 3GB hard drive, and you’d
    like to configure a dual-boot system, first defragment the drive, and then split
    the drive by creating a 1.5GB partition. Next, boot the Linux installation. During
    the installation, create a swap partition of 128MB, and leave the rest for the
    Linux root ( / ) file system. Alternatively, you could create a partition of 600MB
    for the /home directory, 22MB for the /boot directory, 128MB for swap, and leave
    the rest for the / directory.


    # # Partitioning Tools


    There are a number of partitioning tools you can use to make room for Linux on
    your notebook’s hard drive. Note that you need to use a partitioning tool before
    installing Linux only if you have an existing operating system you’d like to keep
    on your hard drive. Don’t bother with partitioning before installing Linux if
    you’re just going to install Linux!


    If you need to partition your hard drive before installing Linux, be sure to defragment
    your drive. If you use Windows 95 or 98, double-click on the My Computer icon
    on the desktop, right-click on your notebook’s hard drive, select Properties,
    and select the Tools tab in the Properties dialog box, as shown in Figure 5.1.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_146_0.png)


    Figure 5.1  Click on the Defragment Now button on the Tools tab of the Properties
    dialog box to begin defragmenting your notebook''s drive.


    Click on the Defragment Now button to defragment your notebook''s hard drive.
    This will ensure that your data is placed at the beginning of the hard drive prior
    to partitioning.


    # Using FIPS


    Every Linux distribution comes with the DOS-based FIPS partitioning utility. You''ll
    usually find FIPS under the /dosutils directory on your Linux CD-ROM, or you can
    download the latest version from the FIPS home page (see the “Resource Information”
    section at the end of this chapter).


    > Before you partition your notebook''s hard drive, be sure to back up all important
    documents and directories. Although partitioning is quite safe until changes are
    written to disk, you should take basic precautions before partitioning. You have
    been warned!


    ![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_146_1.png)


    Using FIPS is easy. First, insert a blank diskette into your notebook and create
    a bootable DOS system disk by using the DOS **FORMAT** command with its /s option:


    ```

    format /s a:

    ```'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'Next, copy the **FIPS** command, along with the **RESTOREB** command and the
    file **ERRORS.TXT**, to the floppy. The **RESTOREB** command may be used to restore
    the Master Boot Record (MBR) of your notebook''s hard drive. Reboot with your
    new disk, and then run the **FIPS** command like this:


    ```

    A:\>FIPS

    ```


    The **FIPS** command will then check your notebook''s hard drive to find a bootable
    partition. You''ll see a table of your notebook''s drive information, such as
    that shown in Figure 5.2.


    Figure 5.2 shows a notebook that has a single 1GB hard drive with a DOS fileystem
    residing in the first partition. To start partitioning, press any key. FIPS will
    continue checking your drive and will report on the drive''s characteristics.


    > If you see an existing partition equal to or double the size of your notebook''s
    RAM, do not attempt to split or change that partition! The partition probably
    uses your notebook''s suspend-to-disk area (as supported by your notebook''s BIOS).
    Leave that partition alone when partitioning or installing Linux, or you might
    have a real hassle on your hands when you try to reinstall or reconfigure the
    partition!


    ![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_147_0.png)


    You''ll then be asked if you want to make a backup of your drive''s MBR. This
    is not important when installing Linux, because you''ll most likely install the
    LILO boot loader into the MBR, and in this example, you can simply restore the
    MBR by using the DOS **FDISK** command like this:


    ```

    A:\>FDISK /MBR

    ```


    ![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_147_1.png)


    **Figure 5.2** _The FIPS command will check your notebook''s drive before partitioning._'
