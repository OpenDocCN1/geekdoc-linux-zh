    ![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_416_1.png)


    **Figure 10.3** *The xboard client is a graphical interface for the gnuchess game.
    It works well on small notebook displays.*


    If chess is too much for you, how about a rousing game of backgammon? You’ll find
    an excellent backgammon game for Linux and X11 named xgamm on. This client follows
    standard backgammon rules. It may be configured to play human versus human, human
    versus computer, or computer versus computer! Start the xgammon client by typing
    its name on the command line:


    ```

    ```

    # xgammon

    ```

    ```'
