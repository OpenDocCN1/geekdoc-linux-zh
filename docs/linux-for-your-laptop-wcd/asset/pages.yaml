    # ## Beep Patterns


    Card Services also provides audio feedback when cards are installed or removed.
    If you insert an Ethernet PC card and then hear one high beep and then one low
    beep, but you don’t see any errors and the card seems to be recognized, make sure
    that you have set up the card under Linux for networking by assigning an Internet
    Protocol (IP) address. If you hear only one beep, the card was identified but
    not configured. Two high beeps generally indicates that a card was recognized
    and configured.


    Card Services comes with a PC card control command named `cardctl`. This command,
    with its nine command-line options, may be used to perform software insertion
    and removal of a card from a specific slot in your notebook. You might also find
    the X11 client `cardinfo`, shown in Figure 2.7, a graphical interface to PC card
    management for your notebook.


    Troubleshooting PCMICA problems can be somewhat different for new Linux users.
    One of your first jobs after installing Linux is to read David Hinds’ PCM CIA-HOWTO.
    This is very important if you don’t want to waste time and trouble! The PCM CIA-HOWTO
    contains loads of information on diagnosing, troubleshooting, and configuring,
    as well as information on using Card Services with different Linux distributions.
    A related and periodically updated


    ![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_89_0.png)


    *Figure 2.7* The cardinfo client is used during X11 sessions to control your notebook’s
    PC cards.'
