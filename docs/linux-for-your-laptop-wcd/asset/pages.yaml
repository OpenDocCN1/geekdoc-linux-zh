    # setserial -a /dev/ttyS1\n\n/dev/ttyS1, Line 1, UART: 16550A, Port: 0x02f8, IRQ:\
    \ 4\n    Baud_base: 115200, close_delay: 50, divisor: 0\n    closing_wait: 3000,\
    \ closing_wait2: infinite\n\n    Flags: spd_normal skip_test\n```\n\nThe `setserial`\
    \ command will print as much information as it can determine about the specified\
    \ serial port.\n\nIf you need additional serial ports for your notebook, consider\
    \ getting a serial-port PCMCIA card.\n\n# ## Internal Modems\n\nMost notebooks,\
    \ including the Apple iBook, come with an internal modulator/demodulator, known\
    \ as a *modem*. Having a working internal modem in your notebook when using Linux\
    \ is a wonderful thing. You don't have to carry an extra PCMCIA card or use a\
    \ large, bulky external modem with its associated cables and power supply.\n\n\
    That said, here's the bad news: In an effort to cut manufacturing costs, save\
    \ money, and reduce chip count, most Intel-based notebooks on the market today\
    \ use proprietary \"software-driven\" modems that depend on closed-source drivers\
    \ and that work only with operating systems from the PC software monopoly.\n\n\
    These modems are, in my opinion, simply bad engineering even though today's CPUs\
    \ have more than enough horsepower to handle the work with software. As much as\
    \ I'd like to say that you should not buy a laptop with an internal \"controllerless\"\
    \ modem, the truth is that many so-equipped notebooks work well with Linux—with\
    \ the exception of these useless modems. Even worse, no manufacturer (with the\
    \ possible exception of one at the time this chapter was written) will release\
    \ the specifications so that an Open Source solution may be developed.\n\nThis\
    \ puts you, the consumer, at the mercy of proprietary software and a slow-to-respond\
    \ industry. The modem controller chip manufacturers do not live in Internet time,\
    \ but mobile Linux users do. The industry's sloth-like response to consumer needs,\
    \ bug fixes, and other problems is only exacerbated by the notebook manufacturing\
    \ industry's acquiescence in continuing to build notebooks with these devices.\
    \ This situation won't change until the Linux notebook user base grows and consumer\
    \ demand forces reevaluation of the hardware or software design strategy."
