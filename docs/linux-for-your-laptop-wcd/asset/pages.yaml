  md: 'installation utility. The Open Sound System (OSS) modules are installed via
    a shell script, usually under the /lib/oss or /usr/lib/oss directory. Your computer''s
    sound system should be recognized and configured automatically after installation.
    Enabling sound for Linux is then as simple as this:


    ```

