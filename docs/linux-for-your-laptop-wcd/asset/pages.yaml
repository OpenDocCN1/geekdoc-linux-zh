- pgno: 330
  md: "+   * Fully supported under Linux by David Hinds' Card Services and the Linux\
    \ PCMCIA kernel modules.\n+   * Recognized as an ATA/IDE hard drive when inserted\
    \ into your notebook.\n+   * You can mount and unmount the file system quickly\
    \ and easily.\n+   * It's easy to erase and reformat with VFAT or a Linux filesystem.\n\
    +   * Data is relatively secure after it's written to flash RAM and the card is\
