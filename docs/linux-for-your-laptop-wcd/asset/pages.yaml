    the remote host. For example, if the remote printer is an HP 400 using a black-
    and-white inkjet cartridge, configure your filter for a monochrome HP 400. When
    finished, click OK. Then click OK again to exit the configuration and printer
    entry dialog boxes. You should then use printtool’s lpd menu to restart lpd.


    You can now use the lpr command’s -P option, along with the printer’s name, such
    as remoteHP400, to print from your notebook to the printer named green on the
    computer lp.service.org like this:


    ```

    # lpr -PremoteHP400 mydocument.txt

    ```


    This can be accomplished across a LAN or from anywhere in the world if lp.service.org
    is properly connected to the Internet.


    # Printing to Shared Windows Printers


    You can also use the Red Hat printtool client to create a local printer entry
    for a shared printer attached to a remote computer running Windows. You’ll need
    to know the computer’s IP address or hostname, know the remote printer’s name,
    possess a valid username and password for the remote computer, and know the workgroup
    name or name of the domain for the remote computer. After that, configuration
    is the same as for a remote Linux computer, and you can easily print to the remote
    computer with the lpr command and its -P option, followed by the name of your
    remote printer entry.'
