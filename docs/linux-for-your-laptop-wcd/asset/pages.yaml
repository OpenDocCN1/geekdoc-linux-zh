- pgno: 121
  md: "This shows that /dev/hda6 hosts the root (/) Linux directory, and the Windows\
    \ partition is mounted at /mnt/dos. The LILO configuration file /etc/lilo.conf\
    \ would then look like this:\n\n```\n# cat /etc/lilo.conf\n\nboot=/dev/hda\nmap=/boot/map\n\
    install=/boot/boot.b\nprompt\ntimeout=50\n\nimage=/boot/vmlinuz-2.2.13-7mblk\n\
    \        label=linux\n        root=/dev/hda6\n        read-only\n\nother=/dev/hda1\n\
    \        label=dos\n        table=/dev/hda\n```\n\nThis shows that LILO is configured\
    \ to boot either Linux or Windows, depending on whether the word *linux* or *dos*\
    \ is typed at the LILO boot: prompt. The *LILO boot=* entry shows that LILO is\
    \ installed in the Master Boot Record (MBR) or the first IDE drive in the notebook.\n\
    \nIf LILO is not installed when you install Linux, you'll need to use a boot disk.\
    \ After booting, you can install LILO by creating or editing /etc/lilo.conf and\
    \ then running LILO from the command line like this:\n\n```\n# /sbin/lilo\n\n\
    Added  linux *\nAdded  dos\n```\n\nIn this example, which uses the /etc/lilo.conf\
    \ file discussed a moment ago, the *lilo* command has written a boot loader into\
    \ the MBR of the notebook's main partition. Since the Linux entry is first in\
    \ the /etc/lilo.conf file, Linux will be the default operating system booted.\
    \ Details about various options you can use in the /etc/lilo.conf file are documented\
    \ in the *lilo.conf* man page. For example, you can do the following:\n\n+   -\
    \ Use password protection at the LILO boot: prompt.\n+   - Boot different versions\
    \ of the Linux kernel.\n+   - Boot multiple operating systems.\n+   - Customize\
    \ the initial text screen."
  merge: -1
  img_proc: true
- pgno: 122
  md: '+   * Change the default operating system to boot.

    +   * Change the number of seconds LILO waits for a boot: entry.

    +   * Pass special boot-time arguments to the Linux kernel (useful for configuring
    hardware while booting.


    Table 3.3 lists just a few of the options and keywords you can use in your `/etc/lilo.conf`
    file. If you make any changes to this file, don’t forget to run `/sbin/lilo` afterward!


    **Table 3.3 LILO Configuration Keywords**


    | Keyword | Description |

    | --- | --- |

    | `append` = `message` | Passes the following kernel argument |

    | `boot` = `device` | Informs the kernel what device holds the boot sector |

    | `image` = `/boot/kernel_name` | Specifies a Linux kernel to boot |

    | `label` = `name` | Designates a boot keyword, such as `linux` or `dos` |

    | `message` = `file` | Displays the designated text file at the boot prompt |

    | `password` = `password` | Requires a password before booting |

    | `prompt` | Forces the use of a boot-prompt entry |

    | `root` = `device` | Specifies the location of the Linux root partition |

    | `timeout` = `number` | Sets a timeout (in tenths of a second) |


    # # Boot Loaders and Pitfalls


    If you use only Linux on your notebook, go ahead and install LILO into the MBR
    of your boot drive. However, if you want to use another operating system, such
    as Windows, you should know that, with typical disregard, the Microsoft installation
    will overwrite the MBR. This means that you should install Windows first and then
    install Linux.


    If you use a commercial boot loader, such as PowerQuest’s BootMagic, be sure to
    install LILO into the root native Linux partition! BootMagic will require the
    MBR to provide its graphical operating system selection dialog box and will overwrite
    LILO when installed.'
  merge: -1
  img_proc: true
- pgno: 123
  md: "If you install Linux but find that LILO fails to boot properly, you can use\
    \ the LILO start message as a diagnostic (as documented on page 44 of the LILO\
    \ User Guide). Table 3.4 lists the diagnostics.\n\nTable 3.4  LILO Diagnostics\n\
    | Diagnostic | Description |\n| :------------- | :-----------------------------------------------------------\
    \ |\n| *blank* | LILO did not load or was not installed |\n| L ## | LILO's first\
    \ stage loaded, but a disk error code (00, 01, 02, 03, 04, or 06) appears; see\
    \ Section 5.2.2 of the LILO User Guide (page 44 of the guide) |\n| LI | LILO's\
    \ first and second stages loaded, but a disk geometry problem or a LILO map installer\
    \ problem prevented execution (see Section 3.4 of the User Guide) |\n| LIL | LILO's\
    \ second stage loaded, but a geometry or media failure occurred |\n| LIL? | LILO's\
    \ second stage loaded, but at an incorrect address (perhaps the same problem as\
    \ LI) |\n| LIL- | A corrupted descriptor table prevented proper execution (see\
    \ the User Guide) |\n\nIf you have problems, read the LILO User Guide, found under\
    \ the */usr/doc/lilo*/doc directory. If you're running Linux, use the `gv` command\
    \ to display the file like this:\n``` \n> gv /usr/doc/lilo*/doc/User*ps \n```\n\
    \nYou should also create a backup boot diskette with LILO installed. See Section\
    \ 4.1.6 (page 37) of the User Guide for details.\n\n# # Resource Information\n\
    \n**http://www.redhat.com/support**\n\nGeneral information and FAQs about installing\
    \ and configuring Red Hat Linux.\n\n**http://www.redhat.com/corp/support/manuals/**\n\
    \nOnline Red Hat installation manuals."
