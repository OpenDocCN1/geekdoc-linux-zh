    # # Your Notebook''s Keyboard


    Keyboards generally do not pose a problem when you''re installing, configuring,
    or using Linux. Most problems occur when the keyboard is not placed ergonomically,
    is too cramped (a real possibility with smaller notebooks), does not offer frequently
    needed keys (such as for internationalization), or puts frequently used keys in
    difficult-to-reach positions. Other problems can arise if, for example, a notebook
    with a U.S. keyboard is booted with a Linux distribution customized for another
    language.


    Fortunately, under Linux, your notebook''s keyboard may be completely remapped,
    either for the console or for use during X11 sessions. This means that you can
    change the return values generated by individual keys to support typing in different
    languages using different fonts, or swap key locations for added convenience.


    The correct keyboard type is usually selected during the initial Linux installation,
    but it may be changed later. Under Intel-based Linux, the keyboard is a PS/2 device.
    When you install and configure Linux for an Apple iBook, the keyboard is recognized
    and configured as an Apple Desktop Bus (ADB) device.


    Linux includes a host of utilities to modify the keyboard. Some of these commands
    are listed in Table 2.4. You''ll find many others available over the Internet.


    Keyboard settings for X11 sessions are set in the system''s XF86Config file. Although
    console keymaps are generally stored under the /usr/lib/kbd/keymaps directory,
    definitions of more than two dozen keyboards are defined in the file free86 under
    the /usr/X11R6/lib/X11/xkb/keymap directory (for use by the setXkbmap client).


    Changing the keyboard style for the console is easily accomplished with the loadkeys
    command. For example, to set the keyboard to support German, you can use


    ```

    # loadkeys de-latin1

    ```'
  merge: -1
  img_proc: true
