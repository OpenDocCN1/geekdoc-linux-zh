- pgno: 391
  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_391_0.png)


    **Figure 16.3** *Use KDE''s kmclock client to set your notebook''s current date,
    time, and time zone.*


    If you use KDE, use the `kmclock` client to set a different time and zone. This
    client requires that you run X11. Click the desktop''s Application Starter button
    on the panel, and then select Settings, Date and Time. You can also (as root)
    start the client from the command line of an X11 terminal window by typing `kmclock`
    and pressing Enter. You see the dialog box shown in Figure 16.3.


    This client has the advantage of being able to set the date, time, and time zone
    from one dialog box (although you have to click the Time Zone tab to set the time
    zone). Unlike Red Hat''s `timeconfig` command, `kmclock`''s time zones are not
    listed as location names, but only as offsets from GMT, or 0.


    # # The TZ Environment Variable


    Linux also recognizes the `TZ` environment variable, a setting retained in memory
    by your shell. You can use this variable to tell other applications launched from
    the shell what time zone is currently in use. For example, you can use the `bash`
    shell''s `export` command to set this variable on-the-fly:


    ```

    # export TZ=EST+5

    ```


    This sets the time zone to EST without daylight saving time. To specify DST, use
    additional fields for the `TZ` variable, like this:


    ```

    # export TZ=EST+5EDT,M4.1./M1.0.,5.0

    ```'
  merge: -1
  img_proc: true
- pgno: 392
  md: '# ## Getting Accurate Time


    You probably set your watch and clocks according to other clocks. If you''re at
    home, take a quick look at your different clocks, watches, radios, stereos, or
    VCRs to see if they all have the same time. Chances are they don''t! If this is
    the case, how can you get accurate time settings into your notebook''s hardware
    and the Linux system?


    If you''re connected to the Internet, one way to get the correct time is to browse
    to one of the many different Web sites that post the current time (local and for
    other time zones), such as http://www.time.gov/, sponsored by the U.S. Department
    of Commerce and the National Institute of Standards and Technology.


    However, the best way to get and set the time for Linux is to use the `rdate`
    command (as root). You''ll need to have an active Internet connection, use the
    `rdate` command''s `-s` (set) option, and specify the hostname of a remote time
    server. For example:


    ```

    # rdate -s time.nist.gov

    ```


    This command sets your Linux system time by retrieving time information from the
    remote server. If you want just the time displayed, use the `rdate` command like
    this:


    ```

    # rdate time.nist.gov

    [time.nist.gov] Wed Mar 22 13:56:23 2000

    ```


    The `rdate -s` command may be placed in your system''s `/etc/crontab` file to
    have the time regularly updated if your notebook is connected to the Internet.
    Once accurate time is maintained on a local server, the `timed` daemon may be
    used to provide time service to the rest of the network. The `timed` daemon works
    as a server and as a client. If you start the daemon using the `-x` flag, it becomes
    a master and provides services to any other hosts designated by the `-r` option.
    For example, on a server, you might use this:


    ```

    # timed -M -F stinky vaio green

    ```


    The remote computers (perhaps a notebook or two), stinky, vaio, and green, should
    then run the `timed` daemon without any options, like this:


    ```

    # timed

    ```


    An interesting feature of this software is that if the master time server quits
    or is unresponsive, the other hosts elect a new master!


    Another daemon used to synchronize time across a network is the `xntpd` daemon,
    which provides time via the Network Time Protocol (NTP). However, you''ll need
    to have a radio, satellite receiver, or modem in order to set up and provide service.'
  merge: -1
  img_proc: true
- pgno: 393
  md: 'To get started with learning about NTP and xntpd, look under the /usr/doc/xntpd
    directory and use the text-only lynx Web browser like this:


    ```

    $ lynx /usr/doc/xntpd*/index.html

    ```


    Don''t have access to a network? You can use a telephone to hear the latest time
    by calling the U.S. Naval Observatory''s Master Clock Voice Announcer at (202)
    762-1401 or (0202) 762-1069. You can also call long-distance (and not have to
    worry about satellite delays) by dialing 900-410-TIME; however, there is a charge
    of $.50 (U.S.) for the first minute and $.45 (U.S.) for each additional minute.


    # ## Useful Clients


    Mobile Linux users are enamored with clients that provide lots of information
    in small packages; they save screen real estate and reduce desktop clutter. KDE
    users know that the date and time are displayed by default in the lower-right
    corner of the desktop''s panel. If you cannot see the date and time, your screen
    resolution is too small, and you should reconfigure the panel to its “tiny” setting
    (use the Configure menu item on the panel).


    Linux also comes with many different clock and calendar clients. You can quickly
    craft your own pop-up current monthly calendar by combining the output of the
    text-based `cal` command with the `xmessage` X11 client like this:


    ```

    $ cal | xmessage -geometry +1-0 -file - -title "Calendar"&

    $ cal | xmessage -geometry +1+0 -file - -title "Calendar"&

    $ cal | xmessage -geometry -1+0 -file - -title "Calendar"&

    $ cal | xmessage -geometry -1-0 -file - -title "Calendar"&

    ```


    These command lines produce a small monthly calendar in the lower-left, upper-left,
    upper-right, or lower-right corner of your desktop no matter what the screen resolution,
    as shown in Figure 16.4.


    If you''re traveling and you need to make sure you don''t wake up someone halfway
    across the world, try KDE''s `kworldwatch` client. This client may be launched
    from KDE''s Utilities menu or from the command line of an X11 terminal like this:


    ```

    $ kworldwatch &

    ```


    After you press Enter, you''ll see the window shown in Figure 16.5. It displays
    the local time, UTC time, time zone times, and a Mercator projection of the earth,
    showing the demarcation of sunrise and sunset.'
  merge: -1
  img_proc: true
