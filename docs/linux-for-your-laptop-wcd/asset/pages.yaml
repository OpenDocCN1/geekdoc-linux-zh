- pgno: 423
  md: 'Listening to music CDs while you work or travel can be a relaxing way to help
    pass the time. It can also provide extra stimulus to help you increase your productivity.
    Many different types of music and multimedia players are available for Linux.
    You''ll soon develop your own set of favorite software to use during your Linux
    sessions.


    If you don''t use X11, you can still play music CDs. Some of the more popular
    console (text-based) audio CD player programs are cdp and tcd. The cdp command
    is also known as cdplay (the name of the symbolic link to the cdp command). This
    text-based player provides all the controls you need to play music CDs. If you
    insert an audio CD, type cdp and press Enter, the cdp program will start playing
    music starting at the CD''s first track. When you use the cdp command, you''ll
    be presented with an interactive menu that has controls to start, stop, pause,
    skip, and select tracks.


    The tcd command is the text-based version of the GNOME gtcd audio CD player. Like
    cdp, this command may be used without X11. At the command line, type tcd and press
    Enter. You''ll see the control dialog box shown in Figure 18.9.


    The tcd player, unlike cdp, does not require you to use your keyboard''s keypad
    keys. Instead, it relies on normal keys, such as P, U, E, S, M, G, and so on to
    control your CD. This makes tcd much easier to use on your notebook.


    If you use X11, you''ll find an overwhelming array of choices of graphical player
    software packages. Some of the most popular include kc cd, gtcd, and xplayed.
    The xplayed client is the oldest program and does not require either KDE or GNOME
    software libraries. However, gtcd and kscd have several interesting features,
    such as the ability (if you have an active Internet connection) to grab your CD''s
    title, artist, and names of individual tracks. This works when you configure the
    player with the correct hostname of a remote music track database server. After
    a CD is inserted, the client uses the CD''s serial number to search the remote
    database. When a match is found, the information about your CD is sent back and
    displayed by the program.


    ![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_423_0.png)


    **Figure 18.9**  *The GNOME tcd player does not require X11.*'
  merge: -1
  img_proc: true
- pgno: 424
  md: '![](img/70d85e6f4d1ff2750ca2a98ba3d9855c_424_0.png)


    Figure 18.10 *The KDE kscd player can retrieve audio CD information from remote
    servers on the Internet.*


    For example, to launch the *kscd* client from the desktop panel, select Application
    Starter, Multimedia, CD Player. Next, insert your audio CD into your notebook.
    To configure *kscd* to use the Internet, click on the Tool button. You’ll then
