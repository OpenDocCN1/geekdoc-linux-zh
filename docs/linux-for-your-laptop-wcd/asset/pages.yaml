- pgno: 388
  md: "# # Showing and Setting Time\n\nGetting and showing the date and time from\
    \ Linux is relatively easy. A short C program can quickly retrieve and print the\
    \ date and time. For example:\n\n```\n```\n#include <stdio.h>\n#include <time.h>\n\
    \nint main()\n{\n\ttime_t now;\n\n\ttime(&now);\n\tfputs(ctime(&now), stdout);\n\
    \treturn 0;\n}\n```\n```\n\nIf you type this into a file named qd.c, you can then\
    \ build the program, and perhaps give it the name qd:\n\n```\n```\n# gcc -o qd\
    \ qd.c\n```\n```\n\nYou can then run qd like this:\n\n```\n```\n# ./qd\nWed Mar\
    \ 22 10:18:16 2000\n```\n```\n\nNote that after you press Enter, you see the current\
    \ date and time. However, to check that your system time matches the time or is\
    \ properly offset from the time in your notebook’s hardware clock, use the hwclock\
    \ command with its --show option:\n\n```\n```\n# /sbin/hwclock --show\nWed Mar\
    \ 22 10:19:17 2000  -0.497501 seconds\n```\n```\n\nIn this example, the Linux\
    \ system time is set to match the notebook’s hardware clock. You can use the hwclock\
    \ command to manually set the hardware clock by using its --set and --date options\
    \ like this:\n\n```\n```\n# /sbin/hwclock --set --date \"12/25/00 21:03:00\"\n\
    ```\n```\n\nAfter you press Enter, the hardware clock will be set to 9:03 p.m.,\
    \ December 25, 2000. The nwclock command can transfer date and time values from\
    \ the Linux system time to your notebook’s hardware clock or back again using\
    \ the --systohc or --hcrosys options."
