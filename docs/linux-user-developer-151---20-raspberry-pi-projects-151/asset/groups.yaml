    # **DISTRO**

    # Elementary OS criticised for calling users cheaters

    *When is free not free?*


    The developers of elementary OS have been castigated for claiming that those who
    choose to download the open source Ubuntu spin-off distribution without making
    a financial contribution are “cheating the system.”


    In a recent blog post that explained a plan to force users wanting download the
    Ubuntu-derived operating system to type in a dollar value (including zero for
    a free download), the elementary OS team claimed that “we want users to understand
    that they are pretty much cheating the system when they choose not to pay for
    the software.”


    Users are quick to take the group to task, but despite editing the post to remove
    the offending sentence, the comment section quickly filled with irrele messages.
    “You called us cheaters, deleted the comment WITHOUT an apology, are now whining
    – trying to guilt your core user base – about the fact that YOU made the decision
    to base your concept for an operating system around SOMEBODY ELSE’S WORK,” one
    commenter posted. “You made your own bad” said someone else. “Call me a cheat,”
    another stated, “that’s a paddling,” quoting a famous line from *The Simpsons*.


    ![](img/c9d26cf718256f071c3af699b9670538_8_0.png)


    Above Elementary OS raised hackles by claiming those downloading the OS for free
    were “cheating the system”


    Others were more understanding about the underlying message. “More people should
    experiment with business models for open source software,” one commenter suggested.


    # **COMMUNITY**

    ## PyCon UK organiser John Pinner passes away

    Much-loved Python community member John Pinner has passed away.


    A contributor to the Free and Libre Open Source Software (FLOSS) UK group, formerly
    known as the UK Linux Users Group (UKLUG), Pinner was a noted Python evangelist.


    As well as a Python Software Foundation fellow and Community Service Award, Pinner
    was known for helping to organise the EuroPython conference from 2004 to 2011
    and the PyCon UK conference from 2007 to 2014.


    “I had the great honour and pleasure of meeting, and spending time with John at
    PyCon UK in 2013,” wrote the PSF’s Mary Ann Sutherland in light of his passing.
    “He was a delightful host, full of energy, knowledgeable about the locale – history,
    good beers and the best pubs, landmarks, neighbourhoods – and enthusiastic goodwill.
    He will be sorely missed.”


    His passing has left a deep sadness among the Python community.'
