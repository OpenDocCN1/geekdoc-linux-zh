    \ also usually have to rely on is an Internet-connected magic pocket box called\
    \ a smartphone that, with a bit of know-how, you can connect the Pi to and steal\
    \ some Internet from. Over the next two pages we will impart this know-how to\
    \ get you using your Raspberry Pi on the Internet when you're on the go.\n\n**What\
    \ you'll need**\n- Android device\n- USB cable\n\n01 **The easy way**\nA lot of\
    \ smartphones now have a Wi-Fi hotspot feature, which the Raspberry Pi can easily\
    \ attach to. First of all, turn the hotspot on and then boot into the Pi. Connect\
    \ a wireless dongle and open up the wpa_gui in Preferences > Wi-Fi Configuration.\n\
    \n02 **Scan for device**\nClick Scan to open up the scan window and then select\
    \ Scan again from inside there. It should pick up your device – connect it as\
    \ you would to any Wi-Fi network and the Pi will remember it for when it needs\
    \ it next.\n\n### Tether your Pi to Android\n\n![](img/c9d26cf718256f071c3af699b9670538_64_0.png)\n\
    \n03 **Set up tether**\nFirst connect your phone to your Raspberry Pi via a USB\
    \ cable – depending on the amount of power your Pi has, it might have trouble\
    \ charging your phone but it will still let you tether. In the tethering menu\
    \ you can now activate USB tethering.\n\n![](img/c9d26cf718256f071c3af699b9670538_64_1.png)\n\
    \n![](img/c9d26cf718256f071c3af699b9670538_64_2.png)\n\n> Above it's usually easy\
    \ to figure out which device is your phone – set it right next to the Pi and it\
    \ will be the one with the best signal!\n\n04 **Check connection**\nYour Android\
    \ device will create an interface known as eth0 on the Raspberry Pi. You can check\
    \ to make sure this is happening, and that it will let you tether, by opening\
    \ up a terminal and typing the following:\n\n```\n$ ifconfig\n```\n\n05 **Quick\
    \ connect**\nYou can connect from the terminal right now to access the Internet.\
    \ You should be able to do this by typing the following into the terminal:\n\n\
    ```\n$ sudo dhclient usb0\n```\n\nThis will automatically grab any available IP\
    \ address that your phone will give to it.\n\n06 **Test connection**\nThere’s\
    \ a few ways to test your connection. We’d usually stay in the terminal and ping\
    \ www.google.com, which you can do, or you can click on the browser and see if\
    \ it loads the page.\n\n07 **Save the settings**\nOnce you reboot your Pi, it\
    \ won’t remember to automatically connect to the phone’s tether. However, we can\
    \ add an entry to its config so that it will try and do this in the future. From\
    \ the terminal use:\n\n```\n$ sudo nano /etc/network/interfaces\n```\n\n08 **Interface\
    \ settings**\nHere you’ll find all the current network settings – yours might\
    \ look different from ours depending on if you have added any fixed wireless settings\
    \ or passthroughs. Using the same syntax as the eth0 line, add:\n\n```\niface\
    \ usb0 inet dhcp\n```\n\n09 **Tether on the go**\nAfter a save and reboot, your\
    \ Pi should now automatically connect to your phone, whether it’s via Wi-Fi hotspot\
    \ or a physical connection. It may draw a little more charge than usual while\
    \ tethering, so be sure to keep an eye on your battery level.\n\n### Mobile data\n\
    \nUsing your Pi on your mobile phone will eat up data much faster than browsing\
    \ on your phone normally is. We suggest not doing a full software, distribution\
    \ or firmware update if you don’t want to spend a fortune on data. You can also\
    \ set limits on the amount of data used on your phone to save yourself any problems,\
    \ and a physical tether will allow you to connect via the phone’s Wi-Fi if that’s\
    \ an option.\n"
