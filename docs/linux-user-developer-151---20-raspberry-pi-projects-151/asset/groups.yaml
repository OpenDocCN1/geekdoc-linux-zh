    # # Rasberry Pi Projects


    The greatest hardware hacks from the makers themselves


    # ## Astrogun


    *An augmented reality light gun game*


    ![](img/c9d26cf718256f071c3af699b9670538_24_0.png)


    Walking around Maker Faire, you see some weird and wonderful things. At a Jerusalem
    Maker Faire you may have seen people wield a giant toy gun to shoot down virtual
    asteroids in Aivishay’s AR motion game Astrogun.


    “In the Astrogun lies a Raspberry Pi computer,” Aivishay explains. “An IMU card
    connected to it (Sparkfun’s MPU-9150 breakout board) gives the Pi the ability
    to sense the unit’s orientation. Draw the elements seen from that angle. When
    the player moves, the graphics move, giving the ‘object in the room’ sense.”


    “Why the Raspberry Pi? It was due to time, according to Aivishay: “I had a short
    time to bring it to a working thing, so I had to pick a platform that was capable
    of the task and easy to use. The RPi fits that criterion. I used many software
    components designed for the RPi or tested on it – the P3D and RTIMULib. The combination
    of P1 as a hardware platform and Python as a programming language is the fastest
    way to materialise ideas.”


    ![](img/c9d26cf718256f071c3af699b9670538_24_1.png)


    **Below**

    *Clover software gives you a window onto the Astrogun gameworld*


    +   **Maker Profile**

    +   **Aivishay Orpaz**

    +   *Electronics engineer*

    +   Find out more: bit.ly/1AYPsqg


    # ## Pirate TV


    Go all the way and totally rebuild Android TV!


    ![](img/c9d26cf718256f071c3af699b9670538_24_2.png)


    +   **Maker Profile**

    +   **Donald Derek Haddad**

    +   *Software engineer*

    +   Donald is an open source hacker

    +   Find out more: donalderek.com


    The perfect companion to the Raspberry Pi Smart TV hack (opposite), Donald Derek
    Haddad’s project is a custom TV interface that you can make yourself.


    “Pirate TV is a smart television application that runs on the Raspberry Pi with
    the Raspbian OS,” Donald tells us. “It’s built with open source tools and shipped
    with a free remote controller, your mobile device. At its core lies a Node.js
    application that runs a web server with Express.js/Socket.io to handle users requests
    from the remote and trigger shell scripts. The TV user interface is rendered on
    a Chromium instance in kiosk mode. Videos are streamed from YouTube or other channels
    played on OMXPlayer, and cached including 1080P HD content. This project is a
    work in progress and it’s not going to be able to tap into a lot of the content,
    which makes a Google (now Android) TV or other commercial platforms so valuable.
    Check out Derek’s tutorial: bit.ly/16VYKp.


    # ## Pye Radio


    Old meets new in this modified radio


    +   **Maker Profile**

    +   **Tony Flynn**

    +   *Senior embedded systems design engineer*

    +   Find out more: bit.ly/19zrgPi


    Upcycling is a great concept: recycling a product using new technology to make
    it relevant in the modern world. While standard analogue radio isn’t dead yet,
    its nice to have options when listening to music. This is where Tony’s idea came
    in:


    “I’d been working on a Raspberry Pi to play music streams through my stereo. Once
    this was running I integrated the Raspberry Pi into an old radio named a Pye!
    With a background in woodwork and engineering, this seemed like the perfect project.


    However, this project wasn’t a walk in the park for Tony: “The hardest part of
    the conversion is linking the tuner knob to the rotary encoder. For this radio
    I used the spring from an old biro as a drive train to link the tuner knob spindle
    to the rotary encoder through 90 degrees.”


    Did Tony have opinions about heavily modifying such a classic design? “None whatsoever!
    Some people don’t like the modern style now stamped on this old radio, I think
    it’s a new era, new look!”


    **Right**

    The body has also been cleaned and repainted


