    +     - £95.99 (with breakout kit)


    > Caught on the hop by the popularity of the Raspberry Pi, is the Edison Intel’s
    ticket to winning over the maker and hobbyist crowd?


    The launch of the Raspberry Pi was something of **an epiphany for Intel**, Long
    the dominating force in mainstream computing, Intel had ignored the maker market
    until the Pi came along and started selling its ARM-based hobbyist boards in the
    millions.


    In an attempt to break into the market it had long ignored, Intel’s initial approach
    was somewhat scatter-shot. It partnered with CircuitCo to launch the open-hardware
    MinnowBoard, then the more powerful MinnowBoard Max. At the same time it launched
    a new chip, the Quark, within a maker-centric development board dubbed the Galileo.


    Then at the Consumer Electronics Show it unveiled yet another entry into the market:
    the Edison, an SD card hiding a Quark-powered Linux computer. Sadly, the Edison
    Intel demonstrated at CES never made


    it to market, but thankfully its replacement is a considerable improvement. Following
    feedback from users of its Quark-powered Galileo, Intel revised the design and
    paired a 100MHz Quark co-processor with a 500MHz dual-core Atom chip. While this
    meant losing the eye-catching SD card form factor, the new Edison is barely any
    larger than its predecessor at 35.5mm wide and 25mm tall.


    That may sound impressive, but an Edison on its own isn’t capable of doing much.
    The only connectivity on the module itself, bar a small chip-antenna for the integrated
    radio, is a uFL connector for an external antenna and a hobbyist-unfriendly high-density
    70-pin Hirose DF40 on the underside. There is method in Intel’s madness, however.
    While it’s possible to buy the Edison as a bare module'
  - '[PAGE 82]


    Below The Edison is designed to be the brains of a larger device, for which a
    breakout board will be necessary


    ![](img/c9d26cf718256f071c3af699b9670538_82_0.png)


    ![](img/c9d26cf718256f071c3af699b9670538_82_1.png)


    ![](img/c9d26cf718256f071c3af699b9670538_82_2.png)


    # Pros


    The Edison packs a lot of computing power into a tiny form, with a familiar Linux
    interface and Arduino compatibility.


    # Cons


    Using the module as it is likely to be hard for hobbyists, and when put into the
    Arduino carrier board the Edison loses its size advantage.


    > Setting the Edison up for the first time is not the friendliest process


    for under £40, this is designed for device builders who have created an Edison-based
    gadget and are heading to production. The more common method of buying an Edison
    will be with a breakout board and the most common of those is Intel''s own Arduino
    breakout kit.


    As the name suggests, the Arduino breakout kit takes an Edison module and turns
    it into something more hobbyist-friendly. When mated with the board, the Edison
    becomes the equivalent of an Arduino Uno microcontroller connected to a surprisingly
    powerful computer running the Yocto Linux distribution. Near-full compatibility
    with the Arduino platform is provided, bar a drop in the number of pins featuring
    pulse-width modulation (PWM) control from six to four — the Edison''s upper limit.
    The board also provides USB connectivity, a serial-over-USB monitor and input
    for 7-15V power, but no power supply is included.


    The Edison isn''t restricted to Intel''s own boards. however, US hobbyist specialist
    SparkFun has created a range of boards — which are being dubbed Blocks — that
    break out of the Edison''s various features in a far more compact manner. These
    Blocks feature Hirose connectors on both sides, enabling the user to stack multiple
    Blocks together with an Edison placed on top.


    The bundled Linux distribution, stored on an integrated 4GB eMMC flash module,
    is Spartan but functional, and the dual-core 500MHz Atom is far more powerful
    than rival boards at this price point. The 1GB of memory is equally as generous
    and the design''s lack of graphics processor means no RAM is reserved for GPU
    use.


    The only real sour note is its configuration. Setting the Edison up for the first
    time is not the friendliest process, and while Intel has included extensive documentation
    on its freshly launched ''makers'' site, it veers on the verbose side and has
    occasional mistakes in steps and imagery.


    Gareth Halfacree


    # Summary


    The Edison is a really neat idea but one which is poorly demonstrated by Intel''s
    own official hardware bundles. Its flexibility becomes clear when you move away
    from the official breakout boards and pair the module with third-party modules
    such as SparkFun''s stackable Block family, while its computing power does offer
    considerable potential for exciting embedded projects.'
  - '[PAGE 83]


    # **Review**


    Ryanteck kit, Tails 1.3


    ![](img/c9d26cf718256f071c3af699b9670538_83_0.png)


    # **ROBOT**


    # Ryanteck Budget Robotics Kit for Raspberry Pi


    > The cheapest and simplest Raspberry Pi robot you’re going to find on the market
    is a perfect entry-level kit


    We have had some low-price and basic kits at Linux User & Developer over the past
    few months, each with varying levels of success. Some have just been cheaply made,
    others have used a simple selection of components that enable expansion when you
    feel more comfortable with the robotics behind it. However, the Ryanteck budget
    kit takes a slightly different approach.


    The budget in its name is definitely a very apt description. The kit comes with
    the bare essentials needed to get locomotion: two motors, a chassis to attach
    them and a way to connect them to a Raspberry Pi. You can spend a little more
    to get the whole thing ready to build when you get the kit, but otherwise you’ll
    also need a Raspberry Pi, a Wi-Fi dongle and a portable battery for powering the
    Pi.


    It’s quite quick and simple to put together and it’s fairly robust to boot. The
    motors are the standard ones you’ll get on a lot of other robot kits and they
    even have a speed sensor if you want to add the ability to better control


    straight-line performance. The chassis itself has plenty of mounting points to
    add any number of extra sensors with a little re-rig of the components on top.


    Programming the robot is fairly simple, using Python and the GPIO ports to activate
    the motors as you see fit. There’s no Arduino to worry about and the basic example
    code on the website is good enough to adapt for your own uses. With the way the
    board attaches to the Raspberry Pi, the standard 26 pins are available to plug
    into it – so you can add sensors that way with a bit of ingenuity.


    It is a simple kit that doesn’t look much, like, but for the price and the ability
    to get started with robotics pretty much straight away, it’s a great package.
    Its upgrade paths are very limited though, so you’ll soon need to start thinking
    about other robots if you want to do more.


    **Rob Zwetsloot**


    | Dimensions | 20mm x 170mm x 80mm |

    |---|---|

    | Weight | 0.5kg (including battery) |

    | Price | £24.49 |


    # **Summary**


    Very good for complete novices, kids and party pieces with your Raspberry Pi,
    but it’s the barest-bones entry-level kit for robotics that is more difficult
    to expand upon compared to other budget kits. None of them are as cheap as this
    though, or work so readily with a Model A+'
