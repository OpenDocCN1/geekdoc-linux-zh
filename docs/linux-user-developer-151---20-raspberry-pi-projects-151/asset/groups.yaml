    # “While the original Pi was popular, it

    was not without its challenges”


    supporters, it was not without its challenges. For one, the processor used by
    the original Pi – an ARMv6K compatible design – was intended really for use in
    embedded mobile designs. It used a version of the architecture that was ARM’s
    first cut at doing SMP (multiprocessing), even though it only provided a single
    core and was quickly superceded by the ARMv7 32-bit architecture that is otherwise
    in widespread use today. ARMv7 includes a standardised set of architectural features
    and ABIs that make generic Linux Operating System support for v7 based systems
    far easier than it is for older ARMv6 based designs like the original Pi.


    For this reason, it was particularly exciting to learn of the launch of the second
    generation Raspberry Pi 2. The Pi 2 Model B features an identical board layout
    to the original Pi but it uses an updated Broadcom SoC, based on the contemporary
    quad-core ARM Cortex-A7, that is otherwise fully backward compatible with the
    original and matches the original’s $35 price point. This transition to a Cortex-A7
    (the A7 has nothing to do with ARMv7, it’s just an ARM marketing term) brings
    with it the benefit of much broader operating system capability for the updated
    device. This is one reason we Microsoft is able to provide Windows 10 for the
    Pi 2. The Pi 2 is able to drive up runs most 32-bit ARM Linux distributions either
    out of the box or with relatively simple modifications. In Fedora, we call these
    “Remixes” as compared with the bigger upifts to rebuild the whole distros for
    v6 in the past.


    As with the original, the initial Linux kernel port for the Pi 2 is available
    at github.com/raspberry/linux. The port is currently based upon kernel 3.18 and
    support for the Broadcom 2709 series SoC was merged on 2 February. That commit
    (github.com/raspberry/linux/commit/d9f6ac63a), dates from May 2013, so it has
    clearly been sitting on the shelf and ready to go for some time. Like most other
    contemporary ports to specific embedded platforms, Pi is more about wiring up
    existing drivers and architecture features than about incorporating huge amounts
    of new code. The port enables a few specifics common to any device building, using
    the BCM2709 SoC family, such as educating the kernel about it being based upon
    the ARMv7 architecture. The guts of the port are then provided by a file called
    arch/arm/boot/dts/bcm2709-rpi-2-b.dts.


    The DeviceTree source (DTS) file for the Pi 2 describes the hardware of the Pi
    using a flexible hierarchical language that follows the documented reference bindings
    within the kernel’s documentation/devicetree directory. Each of the major devices
    and IP (Intellectual Property) blocks included within the design are matched against
    such a binding using the compatible property within this DTS. For example, the
    DTS informs the kernel that the Pi is compatible with the bcm2709, that it is
    named Raspberry Pi 2 Model B and that it includes certain hardware described with
    the SoC (chip) specific bcm2709.dts (DTS include file). This included file describes
    the SoC itself, including the 4 CPU cores, the interrupt controller used to service
    peripheral devices, the GPIO and other on-chip interfaces, and the generic armv7
    timer.


    The kernel port includes a bcm2709_defconfig file that the kernel can use to determine
    which configuration options should be used to build a minimal kernel binary tailored
    to boot on the Pi 2 (though it will use the compiled form of the DTS, known as
    a DTB – DeviceTree Blob – at runtime to actually determine which of the many possible
    drivers compiled into the kernel should be used). Finally, the port includes an
    old-style bcm2709_b. board-specific C file which seems to be more as a convenience
    for those not using a DeviceTree supporting bootloader (this provides further
    evidence that the port was originally made perhaps even longer ago than the 2013
    date of this specific commit). The remaining code also provides some core enablement
    for all 270X Broadcom platforms.


    Building and installing the kernel for the Pi 2 is relatively straightforward,
    with multiple options, ranging from a cross-compilation (on an x86 laptop) to
    local compilation on the device itself. This is documented at raspberry.pi.org.
    While the original Pi never really had a good upstream support story, it is the
    hope of this author that the second generation will be supported in a standard
    Linux kernel shipping in your favourite Linux distro soon enough.


    Finally this month, Linux noted that the strongest argument for some people advocating
    a Linux 4.0 release seems to have been a wish to see 4.15 – because “that was
    the version of Linux skynet used for the T-800 terminator”! All the more reason
    to be afraid of the impending arrival of Linux 4.0 and our robotic overlords.'
