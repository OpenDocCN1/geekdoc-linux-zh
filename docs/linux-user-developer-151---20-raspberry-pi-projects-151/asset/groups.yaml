    ## 便携式树莓派街机


    喜爱老式街机游戏？借助本·赫克（Ben Heck）的 hack，你可以在一台手工打造、手持的主机上玩遍所有这些游戏


    ![](img/c9d26cf718256f071c3af699b9670538_18_0.png)


    左图：安装 MAME，你将永远不缺街机游戏可玩


    本·赫克制作了便携式树莓派街机的两个版本。第一个是最初的便携式树莓派项目（youtube.com/watch?v=v-rdLZjzQuTNX4），他通过 hack
    树莓派来缩小其尺寸，并拆开一个 USB 游戏控制器以提取更多电路。在新组装部件到位后，他 3D 打印了一个定制设计的机箱，组装了新设备，并启动 MAME（多街机模拟器的缩写）来玩老式游戏。


    他最近对这一早期项目的翻新更加“自制”。对于这款树莓派 MAME 便携游戏设备（youtube.com/watch?v=rzrEj1aIQRbpw），本从零开始制作了一块电路板，将所有组件装入一个新的
    3D 打印机箱中。该机箱与其说像 Game Gear，不如说更像 Game Boy。


    我们请本带我们回顾他项目的原始版本。“我的第一个便携式树莓派项目是一个小型、电池供电的游戏单元，”他说道，“它有一个用于 Wi-Fi 或外部存储的 USB
    端口，我们在该节目第三季中曾介绍过它。屏幕来自亚马逊销售的廉价 NTSC LCD 屏幕，原本用作汽车倒车摄像头。按钮是我自己激光切割的，机箱则是 3D 打印的。”至于对树莓派本身的物理修改呢？“我主要移除了较高的通孔组件，”他回答，“并将
    Teensy HID（用于控制器）直接连接上去。我还移动了第二个 USB 端口。”


    正如你在上面看到的，机箱制作得非常精良；“我在 Adobe Illustrator 中完成了初始布局，用于激光切割的部分，”本解释道，“然后将整个设计转移到
    Autodesk 123D 中，创建一个可 3D 打印的文件。亲手书写控制器的按钮是该项目中最具挑战性的部分。它也是最耗时的，需要大量的精度和对细节的关注。”


    本对于拆解主机和控制器进行树莓派 hack 并不陌生——他还制作单手无障碍控制器。“除了其他所有项目和 hack 之外，我们还为那些难以使用现有游戏控制器的人修改控制器，”本告诉我们。“在节目中，我们展示过其中几款——Xbox
    One、PS4，甚至还有 Wii。现在我们应要求制作这些控制器，可以从我的网站订购，但我们只处理 Xbox 360/Xbox One 控制器，因为它们在内部使用
    PCB（印刷电路板）（而 PS4 使用丝印电路）。最近我教会了 Felix（element14《Ben Heck Show》的一位助理）如何做这项工作，所以他也在业余时间协助处理。”


