    ![](img/c9d26cf718256f071c3af699b9670538_48_0.png)


    ![](img/c9d26cf718256f071c3af699b9670538_48_1.png)


    # 13 File system check


    Depending on how the storage was created, you may need to check the integrity
    of the filesystem before performing the resize2fs. In our case, it asked us to
    perform an e2fsck command on the extended LV before resizing – all you need to
    do is follow the instructions.


    # 14 Test your new filesystems


    You can now see the extended space in the LV, the volume group and see if you
    have any spare space still to allocate using the lvsdisplay, vgdisplay and pvsdisplay
    options. In lvsdisplay and vgdisplay, it won’t show the extra sda partition because
    it’s all part of the same storage as far as it’s concerned.


    # 15 More complicated setups


    The beauty of LVM is that we can have several partitions and hard drives, have
    them all donate space to the volume group and then be divided between different
    LVs. You can create multiple LVs in any volume group, taking space where you want
    it. Adding hard drives later will let you extend the storage with little hassle.
    The partitions you create traditionally will show up as ext4 or whatever filesystem
    in the partition editors, but they’ll be inaccessible outside of the LV.


    ![](img/c9d26cf718256f071c3af699b9670538_48_2.png)


    # 16 Delete an LV


    Want to completely rearrange the insides of your volume group? Start by deleting
    LVs to create them from scratch using the lvremove command. Make sure you know
    the name of the LV you’re removing and do it like so:


    ```

    $ sudo lvremove /dev/[volume_group]/[logical_volume]

    ```


    # 17 Remove a volume group


    Need to go a step further and delete the entire volume group? This will delete
    all the LVs within and free up some of the partitions that are in the physical
    volume. Make sure you know the name of the volume group and then do:


    ```

    $ sudo vgremove [volume_group]

    ```


    # 18 Get rid of the physical volumes


    If you want to remove the LV completely, you can just delete the physical volume
    designations and then start using a more traditional partitioning system instead.
    Make sure you know the original names of the partitions and remove them:


    ```

    $ sudo pvremove /dev/sda1 /dev/sda2 [etc]

    ```


    # 19 Shrink the logical volumes


    Like we did with the expanding, you can shrink the logical volumes and volume
    groups. In each case, you would be reducing the size of the logical volume or
    removing physical volumes from the volume group, respectively – otherwise it works
    the same way.


    # 20 Logical volume management


    There are more functions you can use while creating and maintaining an LV, but
    these are the basics. If you find yourself running through a lot of storage then
    this may be the solution for you, as you can just keep adding with little-to-no
    hassle and no RAID.'
