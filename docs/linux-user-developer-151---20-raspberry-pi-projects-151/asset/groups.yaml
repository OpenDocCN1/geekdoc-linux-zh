    # Troubleshoot your network with Netstat


    Learn the various command line options of Netstat and troubleshoot multiple network
    related problems like a pro


    Advisor  \nMihalis Tsoukalos is a UNIX administrator, a programmer (UNIX and OS),
    a DBA and a mathematician. He has been using Linux since 1993


    # Resources \nLinux machine \nRoot privileges


    Netstat is a command line utility that shows information about the network status
    of your machine. It’s a powerful tool that can work on the Socket, TCP, UDP, IP
    and Ethernet levels. Its main drawback is that it only works on the local machine
    – utilities such as nmap and tcpdump can also display information from remote
    machines. Nevertheless, we can show information quickly and comprehensively, and
    its command line options are case-sensitive.


    Remember to check your log files for errors or warnings about your network problem
    and, if needed, raise the logging level to get more information. Once resolved,
    lower the logging level because log files can easily grow very big. Reading log
    files is most helpful for application level and hardware related problems. \n\nWhen
    Netstat isn’t sufficient for solving your network problem, use Wireshark, tshark,
    tcpdump, nmap or another tool of your choice.'
