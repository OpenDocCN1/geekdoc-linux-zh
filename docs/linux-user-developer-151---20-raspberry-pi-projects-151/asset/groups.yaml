    ```\n\nThe aforementioned command displays the same output as the ifconfig command,\
    \ but only when it is used without any command line arguments or parameters.\n\
    \n# # 15 Use AWK to process Netstat output\n\nThe following command, which needs\
    \ root privileges to run, extracts the IP address from all established Apache\
    \ connections and then calculates the number of connections for each individual\
    \ IP address:\n\n```\n```bash\n# netstat -ant | grep apache2 | grep ESTABLISHED\
    \ | awk -F \"[ ]+\" '{print $4}' | uniq -c\n```\n```\n\nThe next command calculates\
    \ the number of TCP connections per IP address sorted by the number of connections:\n\
    \n```\n```bash\n$ netstat -nt | awk '/tcp/ {print $5}' | awk -F: '{print $1}'\
    \ | sort -nr\n```\n```\n\nThe following command prints a ‘+’ character for every\
    \ connection:\n\n```\n```bash\n$ netstat -an | grep ESTABLISHED | awk '{print\
    \ $5}' | awk -F: '{print $1}' | sort | uniq -c | awk '{ printf(\"%5s %s\\n\",$2,$1);\
    \ for (i = 0; i < $1; i++) printf(\"*\"); print \" }\"\n```\n```\n\nThis command\
    \ counts the various types of TCP states and prints the results:\n\n```\n```bash\n\
    # netstat -ant | awk '{print $6}' | grep -v established | grep -v Foreign | sort|uniq\
    \ -c|sort -n\n```\n```\n\nA large number of TIME_WAIT connections may be an indication\
    \ that you need to adjust your TCP timeout settings.\n\n![](img/c9d26cf718256f071c3af699b9670538_52_0.png)\n\
    \n![](img/c9d26cf718256f071c3af699b9670538_52_1.png)\n\n# # 16 Show total number\
    \ of processes per user\n\nThe following one-line command shows the total number\
    \ of listening processes per user:\n\n```\n```bash\n# netstat -ltpe | awk '{print\
    \ $7}' | grep -v Address | grep -v \"\" | sort | uniq -c | awk '{print $2 \":\
    \ \" $1}'\n```\n```\n\nThe netstat command collects the desired information. The\
    \ first grep command deletes the line with the header information of Netstat and\
    \ the second grep command deletes empty lines from the output. The first awk command\
    \ grabs the desired user information from the output of Netstat. The sort command\
    \ orders the output whereas the uniq command counts line occurrences while omitting\
    \ repeated lines. The last awk command reverses the two columns of the uniq output\
    \ and prints the data on the screen.\n\nAs always, in order to be able to see\
    \ all processes you must run this with root privileges.\n\n![](img/c9d26cf718256f071c3af699b9670538_52_2.png)\n\
    \n# # 17 Display multicast information\n\nWhen used with the –g command line option,\
    \ Netstat displays multicast group information about IPv4 and IPv6 protocols.\n\
    \n# # 18 View active listening ports\n\nThe following command displays the active\
    \ UNIX listening ports:\n\n```\n```bash\n$ netstat -lx\n```\n```\n\nIt is extremely\
    \ useful for finding out which services are available to local users only (localhost).\
    \ The following output verifies that MySQL is efficiently accepting connections\
    \ from the local machine:\n\n```\n```bash\n$ netstat -lx | grep -i mysql\nunix\
    \  2  [ ACC ]  STREAM\nLISTENING     32891287  /var/run/mysqld/\n    mysqld.sock\n\
    ```\n```\n\n18  **View active listening ports**"
