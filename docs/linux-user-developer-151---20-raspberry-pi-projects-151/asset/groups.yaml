  md: "\n# Tutorial: Make a Raspberry Pi 2 HTPC\n\nFinally create a more powerful\
    \ and capable HTPC using the Raspberry Pi 2 and the excellent OpenELEC project.\n\
    \n**Rob Zwetsloot** models complex systems and is a web developer proficient in\
    \ Python, Django, and PHP. He loves to experiment with computing.\n\nWe know people\
    \ who just have a great idea and a great use for the Pi – it works just well enough\
    \ that you can easily play media locally or over the network. The biggest issue\
    \ comes with GUI response on the original Model Bs, and a lack of USB ports for\
    \ connecting up everything that you want.\n\nWhile optimization over the last\
    \ few years has helped, the leap to Raspberry Pi 2 has basically solved all of\
    \ these problems by giving you much more powerful hardware to play with. So if\
    \ you're looking to upgrade or finally take the plunge, this handy guide will\
    \ help you create the perfect Raspberry Pi 2 HTPC.\n\n### 01 Choose the software\n\
    In the past, Pi HTPCs were just a choice between RaspBMC and OpenELEC. However,\
    \ RaspBMC is on a bit of a hiatus, and OpenELEC is your best bet for getting the\
    \ most up-to-date software. There's not a massive difference between the two,\
    \ as they both run XBMC.\n\n### 02 Get the software\nHead over to openelec.tv\
    \ and look for the Download section. There's a specific Raspberry Pi section which\
    \ is split up into original (ARMv6) Pi and the newer Raspberry Pi 2 (ARMv7). Grab\
    \ the image file from this page for the Pi 2.\n\n![](img/c9d26cf718256f071c3af699b9670538_65_0.png)\n\
    \n## What you'll need\n- OpenELEC openelec.tv\n- HDMI cable\n- USB IR receiver\n\
    - IR remote\n- Case\n- Dedicated power supply\n- Optional USB storage\n\nwww.linuxuser.co.uk\n\
    \n![](img/c9d26cf718256f071c3af699b9670538_66_0.png)\n\n### 03 Install to card\n\
    Open up the terminal and use `fdisk -l` to determine where your SD card is located\
    \ on your system. Something like `/dev/sdb` or `/dev/mmcblk0` will be ideal. Navigate\
    \ to the image using `cd` and install it with `dd` using:\n\n```bash\n$ dd bs=1M\
    \ if=OpenELEC-RPi2.arm-5.0.5.img of=/dev/mmcblk0\n```\n\n### 04 First boot\nPlug\
    \ in your Raspberry Pi, either to your TV or to another screen just to begin with,\
    \ and turn it on. OpenELEC will resize the SD card partitions and write a few\
    \ extra programs before finally booting into Kodi.\n\n![](img/c9d26cf718256f071c3af699b9670538_66_1.png)\n\
    \n*Above*\nKodi really is designed to be used with a remote, and there are some\
    \ great guides to using them on the OpenELEC site: **bit.ly/1BOARv**\n\n### 05\
    \ Configure Kodi\nGo through the basic wizard to get through the interface - if\
    \ you are connecting via wireless you will need to go to OpenELEC in the System\
    \ menu and activate the wireless receiver before selecting your network and then\
    \ entering your password.\n\n### 06 Add network shares\nYou can stick a portable\
    \ hard drive or USB stick into the Pi for storage, but the best method is really\
    \ to stream over the network. Go to File manager under System and Add source.\
    \ Go to Browse and choose your network protocol to browse the network or alternatively,\
    \ add it manually.\n\n### 07 Build your media centre\nPlacement of your Raspberry\
    \ Pi is important. As it's going to be out all the time, we highly recommend getting\
    \ a case for it - the Pibow cases from Pimoroni are quite well suited for this\
    \ type of use as they are sturdy and can be attached to the rear of some TVs.\n\
    \n### 08 IR sensors and controllers\nKodi can be controlled with a number of different\
    \ things - including USB game controllers and compatible IR sensors. We've used\
    \ FLIRC in the past, but if you have your Pi behind the TV, you'll need a sensor\
    \ on a wire that can stretch to a useful position.\n\n### 09 Future updates\n\
    OpenELEC has the excellent ability to update itself without needing you to re-install\
    \ it every few months, meaning you won't need to do much maintenance on it at\
    \ all. Now you can sit back and enjoy your media much easier than before.\n\n\
    ## Live TV\nKodi does have the ability to play live TV via a TV tuner, and you\
    \ can also record stuff as well as long as you have the local memory. The main\
    \ thing you'll need to invest in is a compatible TV tuner, a list of these is\
    \ available here: **bit.ly/1r3mEj**\n\n![](img/c9d26cf718256f071c3af699b9670538_67_0.png)\n\
    \n## What you'll need\n- Breadboard & wires\n- 16x16 LED Matrix\n- 2x 74HC238\n\
    - 2x 74HC244\n- 16x 220 Ohm Resistor\n- Source code **FileSilos.co.uk**\n\n# Build\
    \ a complex LED matrix\n\nLED Matrix display systems find use everywhere from\
    \ gaudy kebab shops to impressive steampunk-styled systems.\n\n![](img/c9d26cf718256f071c3af699b9670538_67_1.png)\n\
    \n**Tam Hanna**\nhas worked in IT since the Palm IIc days. A journalist, tutor,\
    \ speaker and author, Tam has seen every aspect of the mobile market more than\
    \ once.\n\nDriving LEDs in an efficient fashion is a science of its own. The common\
    \ availability of single-board computers has put the necessary technology within\
    \ reach of everyone.\n\nWhen dealing with LED displays, two different systems\
    \ must be considered. We will focus on traditional matrix-based systems made up\
    \ of one or more LEDs. Their affordable nature makes them ideally suited to classic\
    \ display applications: they communicate currency prices, provide stock-brokers\
    \ with updates from the trading floor and have even been used as basic displays\
    \ for primitive oscilloscopes.\n\nFinally, we will also provide you with an overview\
    \ of electronic basics. This tutorial is a bit more advanced than the ones we\
    \ usually run in this section of the magazine, and it's also worth noting that\
    \ we're going to be programming with C rather than Python. Follow along using\
    \ the code listing annos.\n\n### 01 Think about LEDs\nStandalone LEDs are primitive\
    \ – they light up once current flows through them. Driving a few LEDs is as easy\
    \ as connecting them to GPIO pins along with a resistor. Sadly, this method becomes\
    \ wasteful once more than a few of them get involved – driving 16 diodes ties\
    \ up 16 pins.\n\n### 02 Arrange your diodes\nMethods were devised to reduce the\
    \ number of pins needed. Matrix-based systems are resilient to individual diode\
    \ failures, and provide a pin-to-LED ratio of n=(n/2)². The following steps assume\
    \ a 16x16 LED matrix which is made up according to Figure A. Since LEDs permit\
    \ current in only one direction, you can enable a single LED by bringing the corresponding\
    \ pins high and low.\n\n![](img/c9d26cf718256f071c3af699b9670538_68_0.png)\n\n\
    *Above* The extended version of this schematic is inside FileSilo.co.uk – just\
    \ sign in and head to the issue #151 page\n\n### 03 Harness the MUX\nOur LED module\
    \ has a total of 32 inputs, which overwhelms older versions of the RPI. The first\
    \ way to restrict their number comes in the shape of the 74HC238, a component\
    \ described as a 3-to-8 line decoder/demultiplexer. Its function is described\
    \ in the Figure B image on the next page.\n\n### 04 Separate concerns\nChip two\
    \ goes by the name of 74HC244, which is described as an octal buffer with tri-state\
    \ capability. Tri-State outputs can physically disconnect themselves from the\
    \ bus line. This permits you to tie their outputs together without fear of short\
    \ circuits. As long as all but one chip are in tri-state mode, no current can\
    \ flow between high and low output pins.\n\n### 05 Round them up\nFour GPIO pins\
    \ control the currently-enabled ‘line’ of the display. Three pins configure the\
    \ address which is to be emitted, while the signal emitted from the fourth pin\
    \ is connected to the activity inputs. This ensures that but one IC is active.\
    \ The 74HC244 ensures that but one of the two groups is active at any given time.\n\
    \n### 06 Configure the pins\nWe used a library from Hussam Al-Hertani’s Hertzville\
    \ blog (hertzville.com/2014/07/07/rpimmapgpio). The first step involves setting\
    \ output functions. As the GPIOs are set to outputs, the tri-state feature might\
    \ connect the internal state to the output pins of the IC. This could lead to\
    \ internal shorting if the output is not turned off.\n\n## Full code listing\n\
    \nStep 12\n```c\n#include <mmapgpio.h>\n#include <stdio.h>\n\n#define PINA0 2\
    \ // 3\n#define PINA1 3 // 5\n#define PINA2 4 // 7\n#define PINA3 14// 8\n#define\
    \ PINS0 17// 11\n#define PINS1 18// 12\n\n#define PIND0 23// 16\n#define PIND1\
    \ 24// 18\n#define PIND2 10// 19\n#define PIND3 9 // 21\n#define PIND4 25// 22\n\
    #define PIND5 11// 23\n#define PIND6 8 // 24\n#define PIND7 7 // 26\n```\n\nStep\
    \ 07\n```c\nvoid setAddress(unsigned char _which, mmapgpio* _where)\n{\nif (_which&1)\n\
    {\n    _where->writePinHigh(PINA0);\n}\nelse\n{\n    _where->writePinLow(PINA0);\n\
    }\nif (_which&2)\n{\n    _where->writePinHigh(PINA1);\n}\nelse\n{\n    _where->writePinLow(PINA1);\n\
    }\n\nif (_which&4)\n{\n    _where->writePinHigh(PINA2);\n}\nelse\n{\n    _where->writePinLow(PINA2);\n\
    }\n\nif (_which&8)\n{\n    _where->writePinHigh(PINA3);\n}\nelse\n{\n    _where->writePinLow(PINA3);\n\
    }\n}\n```\n\nStep 08\n```c\nvoid safelySetRow(unsigned char _which, mmapgpio*\
    \ _where)\n{\n    _where->writePinHigh(PINS0);\n    _where->writePinHigh(PINS1);\n\
    \    if (_which==0)\n    {\n        _where->writePinLow(PINS0);\n    }\n    else\n\
    \    {\n        _where->writePinLow(PINS1);\n    }\n}\n```\n"
  mdcn: "\n\n# 教程：打造 Raspberry Pi 2 HTPC\n\n最终使用 Raspberry Pi 2 和出色的 OpenELEC 项目创建一个更强大、功能更丰富的\
    \ HTPC。\n\n**Rob Zwetsloot** 擅长对复杂系统进行建模，并且是一名精通 Python、Django 和 PHP 的 Web 开发者。他热衷于进行计算实验。\n\
    \n我们知道有些人对树莓派有着绝佳的想法和用途——它的表现足以让你轻松地在本地或通过网络播放媒体。最大的问题在于原版 Model B 的 GUI 响应速度，以及缺少用于连接所有设备的\
    \ USB 端口。\n\n尽管过去几年的优化有所帮助，但转向 Raspberry Pi 2 基本上解决了所有这些难题，因为它提供了更强大的硬件供你使用。因此，如果你正在考虑升级或终于下定决心，这份便捷的指南将帮助你打造完美的\
    \ Raspberry Pi 2 HTPC。\n\n### 01 选择软件\n在过去，Pi HTPC 只能在 RaspBMC 和 OpenELEC 之间做选择。然而，RaspBMC\
    \ 目前处于停顿状态，而 OpenELEC 是获取最新软件的最佳选择。这两者之间没有巨大的差异，因为它们都运行 XBMC。\n\n### 02 获取软件\n\
    访问 openelec.tv 并找到下载区域。那里有一个专门的 Raspberry Pi 部分，分为原版（ARMv6）Pi 和更新的 Raspberry Pi\
    \ 2（ARMv7）。请从该页面获取适用于 Pi 2 的映像文件。\n\n![](img/c9d26cf718256f071c3af699b9670538_65_0.png)\n\
    \n## 所需材料\n- OpenELEC openelec.tv\n- HDMI 线\n- USB 红外接收器\n- 红外遥控器\n- 外壳\n- 专用电源\n\
    - 可选 USB 存储设备\n\nwww.linuxuser.co.uk\n\n![](img/c9d26cf718256f071c3af699b9670538_66_0.png)\n\
    \n### 03 安装到卡上\n打开终端，使用 `fdisk -l` 来确定 SD 卡在你系统上的位置。类似于 `/dev/sdb` 或 `/dev/mmcblk0`\
    \ 的理想设备即可。使用 `cd` 导航到映像文件所在目录，并使用 `dd` 命令通过以下方式安装：\n\n```bash\n$ dd bs=1M if=OpenELEC-RPi2.arm-5.0.5.img\
    \ of=/dev/mmcblk0\n```\n\n### 04 首次启动\n将你的 Raspberry Pi 连接到电视或另一个屏幕（先这样开始），然后开机。OpenELEC\
    \ 会调整 SD 卡分区大小并写入一些额外的程序，最后启动进入 Kodi。\n\n![](img/c9d26cf718256f071c3af699b9670538_66_1.png)\n\
    \n*上方*\nKodi 的设计初衷就是配合遥控器使用，OpenELEC 网站上有一些关于如何使用的优秀指南：**bit.ly/1BOARv**\n\n###\
    \ 05 配置 Kodi\n通过基本向导完成界面设置——如果你是无线连接，需要进入系统菜单中的 OpenELEC，激活无线接收器，然后选择你的网络并输入密码。\n\
    \n### 06 添加网络共享\n你可以将便携式硬盘或 U 盘插入 Pi 作为存储，但最好的方法确实是通过网络进行流媒体传输。进入系统下的文件管理器并添加源。前往浏览，选择你的网络协议以浏览网络，或者手动添加。\n\
    \n### 07 构建你的媒体中心\nRaspberry Pi 的放置位置很重要。由于它将一直展示在外部，我们强烈建议为它配备一个外壳——Pimoroni\
    \ 的 Pibow 外壳非常适合此类用途，因为它们坚固耐用，并且可以附加在某些电视机的背面。\n\n### 08 红外传感器和控制器\nKodi 可以通过多种方式控制——包括\
    \ USB 游戏手柄和兼容的红外传感器。我们过去使用过 FLIRC，但如果你将 Pi 放在电视后面，你需要一个可以延伸到有用位置的带线传感器。\n\n###\
    \ 09 未来更新\nOpenELEC 具备出色的自我更新能力，无需每隔几个月重新安装，这意味着你几乎不需要对其进行维护。现在，你可以轻松地坐下来享受你的媒体内容。\n\
    \n## 直播电视\nKodi 确实具备通过电视调谐器播放直播电视的功能，只要你拥有本地存储，你还可以录制内容。你需要主要投资的是一个兼容的电视调谐器，这些调谐器的列表在此提供：**bit.ly/1r3mEj**\n\
    \n![](img/c9d26cf718256f071c3af699b9670538_67_0.png)\n\n## 所需材料\n- 面包板 & 导线\n\
    - 16x16 LED 矩阵\n- 2x 74HC238\n- 2x 74HC244\n- 16x 220 欧姆电阻\n- 源代码 **FileSilos.co.uk**\n\
    \n# 构建复杂的 LED 矩阵\n\nLED 矩阵显示系统从花哨的烤肉店到令人印象深刻的蒸汽朋克风格系统中随处可见。\n\n![](img/c9d26cf718256f071c3af699b9670538_67_1.png)\n\
    \n**Tam Hanna**\n自 Palm IIc 时代起就在 IT 行业工作。作为一名记者、讲师、演讲者和作者，Tam 多次见证过移动市场的各个方面。\n\
    \n高效驱动 LED 是一门独立的科学。单板计算机的普及使得必要技术触手可及。\n\n在处理 LED 显示时，必须考虑两种不同的系统。我们将专注于由一个或多个\
    \ LED 组成的传统基于矩阵的系统。它们低廉的价格使其非常适合经典的显示应用：它们传达货币价格，为股票经纪人提供交易室的更新，甚至曾被用作原始示波器的基本显示器。\n\
    \n最后，我们还将为你提供电子基础的概述。本教程比我们在杂志该部分通常发布的稍微高级一些，还值得注意的一点是我们将使用 C 而不是 Python 进行编程。请使用代码列表注释跟随步骤操作。\n\
    \n### 01 思考 LED\n独立的 LED 很原始——一旦电流流过它们就会发光。驱动几个 LED 就像将它们连接到 GPIO 引脚并串联一个电阻一样简单。遗憾的是，一旦涉及更多\
    \ LED，这种方法就变成浪费——驱动 16 个二极管会占用 16 个引脚。\n\n### 02 排列你的二极管\n人们发明了减少所需引脚数量的方法。基于矩阵的系统对单个二极管故障具有抗扰性，并提供\
    \ n=(n/2)² 的引脚与 LED 比率。以下步骤假设由图 A 组成的 16x16 LED 矩阵。由于 LED 只允许电流单向流动，你可以通过将相应的引脚设为高电平和低电平来启用单个\
    \ LED。\n\n![](img/c9d26cf718256f071c3af699b9670538_68_0.png)\n\n*上方* 此电路图的扩展版本位于\
    \ FileSilo.co.uk – 只需登录并前往 #151 期页面\n\n### 03 利用 MUX\n我们的 LED 模块共有 32 个输入，这对旧版本的\
    \ RPI 来说负担过重。限制其数量的第一种方式是 74HC238，一种被称为 3-8 线译码器/解复用器的组件。其功能描述在下页的图 B 中。\n\n###\
    \ 04 分离关注点\n第二个芯片名为 74HC244，被描述为具有三态能力的八位缓冲器。三态输出可以在物理上断开与总线线的连接。这允许你将它们的输出连接在一起而无需担心短路。只要除一个芯片外的所有芯片都处于三态模式，电流就不可能在高输出引脚和低输出引脚之间流动。\n\
    \n### 05 将它们组合起来\n四个 GPIO 引脚控制当前启用的显示“行”。三个引脚配置要发出的地址，而从第四个引脚发出的信号连接到活动输入。这确保只有一个\
    \ IC 处于活动状态。74HC244 确保在给定时刻只有两组中的一组处于活动状态。\n\n### 06 配置引脚\n我们使用了 Hussam Al-Hertani\
    \ 的 Hertzville 博客（hertzville.com/2014/07/07/rpimmapgpio）中的一个库。第一步涉及设置输出功能。由于 GPIO\
    \ 设置为输出，三态特性可能会将内部状态连接到 IC 的输出引脚。如果输出未关闭，这可能导致内部短路。\n\n## 完整代码列表\n\n步骤 12\n```c\n\
    #include <mmapgpio.h>\n#include <stdio.h>\n\n#define PINA0 2 // 3\n#define PINA1\
    \ 3 // 5\n#define PINA2 4 // 7\n#define PINA3 14// 8\n#define PINS0 17// 11\n\
    #define PINS1 18// 12\n\n#define PIND0 23// 16\n#define PIND1 24// 18\n#define\
    \ PIND2 10// 19\n#define PIND3 9 // 21\n#define PIND4 25// 22\n#define PIND5 11//\
    \ 23\n#define PIND6 8 // 24\n#define PIND7 7 // 26\n```\n\n步骤 07\n```c\nvoid setAddress(unsigned\
    \ char _which, mmapgpio* _where)\n{\nif (_which&1)\n{\n    _where->writePinHigh(PINA0);\n\
    }\nelse\n{\n    _where->writePinLow(PINA0);\n}\nif (_which&2)\n{\n    _where->writePinHigh(PINA1);\n\
    }\nelse\n{\n    _where->writePinLow(PINA1);\n}\n\nif (_which&4)\n{\n    _where->writePinHigh(PINA2);\n\
    }\nelse\n{\n    _where->writePinLow(PINA2);\n}\n\nif (_which&8)\n{\n    _where->writePinHigh(PINA3);\n\
    }\nelse\n{\n    _where->writePinLow(PINA3);\n}\n}\n```\n\n步骤 08\n```c\nvoid safelySetRow(unsigned\
    \ char _which, mmapgpio* _where)\n{\n    _where->writePinHigh(PINS0);\n    _where->writePinHigh(PINS1);\n\
    \    if (_which==0)\n    {\n        _where->writePinLow(PINS0);\n    }\n    else\n\
    \    {\n        _where->writePinLow(PINS1);\n    }\n}\n```\n\n"
