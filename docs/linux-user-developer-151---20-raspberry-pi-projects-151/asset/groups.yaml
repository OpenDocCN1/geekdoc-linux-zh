    ### PiFM Radio


    Sometimes the simplest hacks can open up whole worlds of possibility


    #### Maker Profile


    **Oskar Weigl**


    *Electronics engineer*


    Oskar is an electronics professional and robotics enthusiast as well as an avid
    forward and reverse engineer.

    Find out more: bit.ly/1q86OE


    When studying at Imperial College London, Oskar Weigl and Oliver Mattos turned
    the Pi into an FM radio by connecting a wire (antenna) to GPIO 4 and using a custom
    Python module.


    “There is a clock generation module in the hardware of the Raspberry Pi chip that
    lets you output a clock signal at a user-selected frequency,” Oskar explains.
    “We used the DMA controller to send commands to the clock module to change the
    frequency and achieve frequency modulation. We had to overclock the clock generation
    module by a factor of 20 times. The sound is 14 bits per sample, enhanced to a
    higher number of bits using delta sigma modulation and the range is at least 50
    metres.”


    ### Ras Pi Smart TV


    Is your smart TV not smart enough? Open the case and put a Pi inside


    #### Maker Profile


    **Tony Hoang**


    *Graduate researcher*


    Tony Hoang is a PhD student studying computational biophysics and single molecule
    research at SUNY-Albany in Albany.

    Find out more: linkedin.com/in/tonyhoang


    “There’s plenty of room for additional electronics inside the Hisense LED smart
    TV,” begins Tony Hoang. “There’s a large flat area for electronic parts in the
    centre of the TV where I placed my Raspberry Pi. The dual down-facing speakers
    were quite loud, so I removed one and replaced it with a USB hub. The back panel
    was mostly flat, so finding a spot for the LAN port and HDMI output wasn’t too
    hard.


    “The Raspberry Pi is powered by the logic board of the Hisense. There were the
    obvious 5v/500 mA outputs from the 2x USB 2.0 ports, which I tried but I found
    out that the logic board shuts off the power to these ports when the TV turns
    off. To keep the Raspberry Pi turned on, I probed the logic board with a multimeter
    and found one from an unused GPIO.”


