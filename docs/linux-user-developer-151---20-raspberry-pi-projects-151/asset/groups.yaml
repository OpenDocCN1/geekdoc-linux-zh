    - Taiga-events：WebSocket 网关。完全可选，对于一般的项目管理目的并非必需。我们将跳过这一部分。


    在开始进行 Web 前端操作之前，我们需要后端运行起来。Taiga 的后端有多个依赖项，如开发头文件、C 编译器以及其他包。首先，运行以下命令来安装所有依赖项。


    ```bash

    sudo apt-get install -y build-essential binutils-doc autoconf flex bison libjpeg-dev

    sudo apt-get install -y libfreetype6-dev zlib1g-dev libwmf-dev libgdmb-dev libncurses5-dev

    sudo apt-get install -y automake libtool libffi-dev curl git tcl tcl-dev

    ```


    Taiga 使用 PostgreSQL 9.3+ 作为数据库，因此请安装数据库：


    ```bash

    sudo apt-get install -y postgresql-9.3 postgresql-contrib-9.3

    sudo apt-get install -y postgresql-doc-9.3 postgresql-server-dev-9.3

    ```


    现在设置初始用户和数据库。此命令将创建一个名为 taiga 的用户，然后在 taiga 用户下创建一个名为 taiga 的数据库。


    ```bash

    sudo -u postgres createuser taiga

    sudo -u postgres createdb taiga -O taiga

    ```


    ## 02 安装 Taiga-back


    现在让我们设置 Python 环境。您还需要安装 virtualenvwrapper —— 一组扩展，通过在隔离的虚拟环境中运行第三方库，确保您的系统不会杂乱无章。


    运行以下命令来安装 Python 和 virtualenvwrapper。然后重启您的 shell 以重新加载包含 virtualenvwrapper 变量和函数的
    bash。


    ```bash

    sudo apt-get install -y python3 python3-pip python-dev python3-dev python-pip
    virtualenvwrapper

    sudo apt-get install libxml2-dev libxslt-dev

    ```


    从 GitHub 下载 Taiga 后端代码并运行以下命令。当前目录将更改为 ''taiga-back''：


    ```bash

    cd ~

    git clone https://github.com/taigaio/taiga-back.git taiga-back

    cd taiga-back

    git checkout stable

    ```


    使用以下命令创建一个名为 taiga 的新虚拟环境：


    ```bash

    mkvirtualenv -p /usr/bin/python3.4 taiga

    ```


    然后安装后端的依赖项：


    ```bash

    pip install -r requirements.txt

    ```


    用示例数据填充数据库；这还将创建一个密码为 123123 的管理员用户 admin：


    ```bash

    python manage.py migrate --noinput

    python manage.py loaddata initial_user

    python manage.py loaddata initial_project_templates

    python manage.py loaddata initial_role

    python manage.py collectstatic --noinput

    python manage.py sample_data

    ```


    现在您可以运行服务器了。请记住，workon 命令会启用 taiga 虚拟环境：


    ```bash

    workon taiga

    python manage.py runserver

    ```


    完成后，您应该能够通过以下地址查看代表完整端点列表的 JSON：http://localhost:8000/api/v1/。


    ## 03 安装 Taiga-frontend


    现在让我们完成 Taiga 前端的安装。Taiga 在前端使用了除了 CSS/HTML/JavaScript 以外的语言，因此在浏览器能够完全理解之前，确实需要对其进行构建。


    下载 Ruby 和 Gems。在使用最后一个命令设置路径后，使用以下命令重启 shell：


    ```bash

    sudo apt-get install --ruby

    gem install --user-install sass scss-lint

    export PATH=~/gem/ruby/1.9.1/bin:$PATH

    ```


    现在使用以下命令完成 NodeJS 的安装：


    ```bash

    sudo apt-get install --nodejs npm

    ```


    然后运行 node 命令以检查该命令是否被识别。如果没有，请运行：


    ```bash

    sudo ln -s /usr/bin/nodejs /usr/bin/node

    ```


    现在安装 gulp 和 bower：


    ```bash

    sudo npm install -g gulp bower

    ```


    …然后获取代码并编译 taiga-frontend：


    ```bash

    cd ~

    git clone https://github.com/taigaio/taiga-frontend.git taiga-frontend

    cd taiga-frontend

    git checkout stable

    ```


    使用以下命令进行编译：


    ```bash

    npm install

    bower install

    gulp

    ```


    现在运行 gulp：


    ```bash

    cd ~/taiga-frontend

    npm install

    ```


    如果在运行 gulp 时遇到 npm 错误，请清除临时文件并重新安装所有依赖项。


    ```bash

    rm -rf ./npm*

    rm -rf node_modules

    npm install

    bower install

    gulp

    ```


    如果成功，您现在应该能够在 http://localhost:9001 看到 Taiga。


    ## 04 创建项目和用户故事


    既然 Taiga 现在已在您的浏览器中运行，下一步是创建一个项目。我们已经有创建的 admin 用户，密码为 123123，因此使用这些凭据登录 Taiga
    并单击“创建项目”。然后选择 Scrum 模板并单击“下一步”。最后，填写相关详细信息（名称和描述）并单击“创建”。这将带您进入项目待办事项列表（Project
    Backlog）页面。在页面的上半部分，您有燃尽图；下半部分是用户故事列表。在右侧边栏中，您可以看到 Sprint（冲刺）部分。按照通常的做法，让我们先开始创建用户故事，因为对于初学者来说，敏捷开发方法论要求从用户的角度将软件功能分解为更小的单元。这些单元在敏捷术语中称为用户故事。


    > Sprints 具有预定义的时间段，通常是两到三周


    要添加用户故事，只需单击页面下半部分的“添加新的用户故事”。在下一页中，填写详细信息。请注意，您可以通过此页面为用户故事分配项目点数。您也可以使用批量插入按钮（位于“添加新的用户故事”按钮旁边）一次添加多个故事，并且不要忘记将您的
    admin 密码更改为易于记住的内容！


    ## 05 创建 Sprints


    既然用户故事已经可用，让我们规划一下 Sprints（冲刺）。如您所知，sprints 是预定义的时间段，通常是两到三周。在 sprint 开始之前，开发人员承诺在
    sprint 结束时完成一组用户故事。当 sprint 结束时，scrum 主管审视情况并决定下一个 sprint 的用户故事，此周期继续。


    要在 Taiga 中创建 sprint，只需单击右侧边栏上的“New Sprint”按钮。在下一页中，填写 sprint 的名称和持续时间。默认情况下，sprints
    为两周——开始日期和结束日期会自动填写。既然您已经添加了用户故事，只需进入待办事项列表页面，选择相关的用户故事并单击“Move to current sprint”按钮。这样，您就有分配给
    sprint 的故事，其余故事可作为待办事项列表。一旦您为用户故事分配了 sprints，您可以进一步将其分解为依赖任务。


    ## 06 Kanban 模板


    Kanban 起源于日本。它使用在制品系统作为核心机制，以暴露系统操作（或流程）问题并刺激协作以持续改进系统。虽然传统上用于制造业，但现在它广泛作为敏捷方法论的一种变体被使用。


    使用 Taiga，您可以创建一个带有 Kanban 模板的项目，或者在 scrum 模板内查看 Kanban 模板。要创建一个简单的 Kanban 项目，只需在项目创建期间选择
    Kanban。如果您希望您的项目可以以 scrum 和 Kanban 两种方式查看，请在 scrum 模板下创建项目，然后在 管理 > 项目配置文件 > 模块
    > Kanban 下启用 Kanban。现在您将在左侧边栏上有一个 Kanban 选项。点击此处以在 Kanban 模板中查看您的 scrum 项目。


    ## 07 问题管理


    软件开发的另一个重要方面是问题管理。Taiga 提供了一个全面的问题管理系统，包括 bug、问题和增强功能。要提出一个问题，请单击左侧边栏上的“Issues”链接。然后单击右上角的“New
    Issue”按钮。填写详细信息，如类型、优先级、严重性等，然后单击“Create”。您现在可以在问题列表中看到该问题，但它尚未分配给任何人。单击“Unassigned”按钮将其分配给团队成员。请注意，左侧边栏也有不同的过滤器可用。单击过滤器以查看相关的
    bug。您还可以使用左上侧边栏中的搜索框搜索问题。


    ## 08 Wiki


    有了 Taiga 掌舵，软件文档也得到妥善处理。您可以看到左侧边栏在“Issues”链接下方的“Wiki”链接，因此只需单击该链接即可开始。您可以看到 WYSIWYG（所见即所得）接口文本编辑器。在编辑器中添加文本，完成后，单击“Add
    Link”按钮。在这里，您可以为 wiki 页面分配名称。一旦名称被分配，您的第一个 wiki 页面就准备好了。您可以类似地添加其他页面，并根据需要相互链接页面。


    ## 09 管理选项


    查看左下角的管理选项（齿轮图标）。这些设置特定于项目，因此您可以为不同的项目设置不同的配置。管理设置下有五个主要部分。“项目配置文件”允许您设置项目详情、启用/禁用模块等。“自定义属性”允许您为问题、优先级和状态创建自定义状态。“管理成员”和“角色与权限”具有用户/权限管理选项。“集成”将项目与
    GitHub、Bitbucket 和 GitLab 合并，并与 Webhooks 同步事件。


    ## 10 游戏化


    如果您到现在还没有注意到，Taiga 以一种非常微妙、不显眼的方式添加了大量的游戏化元素。以 loacaine 剂量为例。当您在 sprint 期间编辑与用户故事相关的任务时，您可以单击
    loacaine 按钮，向其他人表示您正在努力完成任务。这里还有其他计划中的功能——例如，扑克规划模块让团队就任务所需时间进行谈判，以及 kudosis 徽章以鼓励积极的沟通。

