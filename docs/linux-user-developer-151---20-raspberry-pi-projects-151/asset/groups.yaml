    ### Open LDAP


    I''m having problems with GSSAPI and LDAP. From the information available, I have
    narrowed the problem down to somewhere in the `acquire_cred1` or `gss_krb5_canonicalize_name`
    functions located in the GSSAPI module.


    What I really need is to understand how the minor_status parameter got set, as
    that may tell me specifically where my issue lies. However, using strace on the
    `ldapwhoami` command only shows what the client is doing, and the problem is on
    the server side. The slapd service has got full log levels on, but it doesn''t
    give me enough information, as it seems the problem is in GSSAPI, not slapd.


    I have tried running slapd with strace, however, I can''t seem to do so in such
    a manner that the slapd service runs as it would when invoked through the service
    slapd start line. Using strace seems to then cause all LDAP* commands to completely
    fail to find the LDAP service.


    I don''t even know if a strace on slapd would capture the information that I''m
    after. How can I capture the information in the GSSAPI module? Thanks!


    Phil Coping


    > The problem sounds like an issue with openldap, not GSSAPI – mainly that it
    doesn''t have permission to access the files. This can be fixed though. First
    check the service is running as normal. Then do:


    ```

    sudo pidof slapd

    ```


    > This will give you the pid number, so then you need to run:


    ```

    sudo strace -o /tmp/dumps/ldap.log -f -s 1024 -p <insert pid>

    ```


    > Then open another terminal window and carry out your test in that. Once you''ve
    finished testing, hit Ctrl+C in the one where strace is running.


