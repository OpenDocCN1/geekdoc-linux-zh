  - '[PAGE 55]


    # Tutorial Qt5 desktop


    # Living lightweight


    Qt5 has been around for years and more Qt applications are moving to use it. Right
    now we can build a decent, highly usable desktop around LxQt. Network connections
    can be managed with ConnMan and its CMST frontend. Dropbox client is already using
    Qt5 and LxQt System Settings work just as well as the same-named KDE module. There
    is also a web browser, email client and a versatile media player available to
    access.


    How does it compare to the KDE desktop? There''s no easy answer. Firstly, the
    hand-made LxQt desktop has less features than either KDE4 or the new Plasma 5
    desktop, but it''s a lot lighter. Pure LxQt needs less than 100 megabytes of RAM
    and each extra Qt5 application adds very few. Secondly, current Plasma 5 choices
    (like Kubuntu or Netrunner) are forced to mix Qix and Qt5 parts so that the resulting
    desktop is nonuniform and consumes more resources. Lastly, Plasma 5 isn''t mature
    yet. Though its current state is nicer than early KDE4 releases in 2008–2009,
    some core applications still remain in the Qt4 world so there will be a transitional
    period from KDE4 to the Plasma 5 desktop.


    ![](img/c9d26cf718256f071c3af699b9670538_55_0.png)


    # Trojitá has a traditional layout and features mail sorting


    # 05 Get Drawpile


    The latest Drawpile version (0.9.8) can be installed via the Getdeb service here:
    www.getdeb.net/app/DrawPile.


    The program has several applications. Firstly, it is an easy-to-understand drawing
    software comparable with MS Paint, Koloroupaint and Pinta – simple, beautiful,
    good for kids. Secondly, its UI is optimised for use in Web projects (with brushes,
    colour palettes, alpha handling). Finally, that black rectangular host a chat
    window. Drawpile enables several people to draw simultaneously on one canvas.


    # 06 Use PhotoQt to view images


    PhotoQT is offered via the PPA and something like the following is entered:


    ```

    sudo add-apt-repository ppa:sandrog31/ppa

    sudo apt-get update

    sudo apt-get install photoqt

    ```


    Then the program can be selected in the ''Open with...'' menu in PCMFMfM. PhotoQT
    opens images in fullscreen mode by default, with image file name and its number
    in the top-left corner. Additional actions are available via the right-click menu
    on any part of the image. You can surf through your images using the respective
    keyboard arrows.


    # 07 Launch apps and search with Albert


    Again, there''s a PPA for easy installation:


    ```

    sudo add-apt-repository ppa:milarimingard/webugd8

    sudo apt-get update

    sudo apt-get install albert

    ```


    The first time you launch Albert you''ll see its configuration window where you
    can change certain settings and, what''s more important, assign a shortcut for
    invoking Albert. After you close the window, Albert doesn''t quit but simply hides
    in the background. Press your shortcut and you''ll see the search box. Depending
    on your input, Albert will offer either applications, Chromium bookmarks, or search
    engines that you can apply your string to.


    # 08 Manage your mailbox


    Trojitá binaries are kindly offered by the OBS system (bit.ly/L9KV3LU), but there
    is only a Qt4 build. While Qt5 build does exist for other Linux distros, in the
    case of Ubuntu we will need to compile a Qt5 Trojitá from the source. Thankfully,
    the official site offers a very straightforward set of build instructions (http://trojitä.fasko.net/download.html).


    Launch the program and provide it with details of your IMAQ mailbox. Public services,
    such as Gmail work just fine. Trojitá has a traditional layout and features mail
    sorting, HTML support and efficient network usage.'
  - '[PAGE 56]


    # 08 **Manage your mailbox**


    ![](img/c9d26cf718256f071c3af699b9670538_56_0.png)


    # 09 **Enjoy music and videos with SPlayer**


    SPlayer is a top-notch media beast, which can play almost any media, both local
    and remote, and even some Blu-ray discs. There’s a PPA for Ubuntu family (ppa:arvm/SPlayer),
    but it offers SPlayer with Qt4, while we need a Qt5 version. So issue the following:


    ```

    ```

    sudo apt-get build-dep splayer

    ```

    ```


    Then download the source tarball (`bit.ly/1Bl8gPT`) and use instructions from
    the Install.txt file there. The Qt5 switch is applied to the make command this
    way:


    ```

    ```

    make QMAKE=/usr/lib/x86_64-linux-gnu/qt5/bin/qmake

    ```

    ```


    Of course, you should have qt5-qmake and other Qt5 dev packages installed beforehand.


    ![](img/c9d26cf718256f071c3af699b9670538_56_1.png)


    # 10 **Write text with FocusWriter**


    FocusWriter is a simple typewriter-like editor which hides away almost all controls
    in order not to distract you from writing. Yet there are many useful features
    such as auto-saving, live statistics, spell checking, multi-document support and
    many more. You can install it using the official PPA:


    ```

    ```

    sudo add-apt-repository ppa:gotcodcc/gcppa

    sudo apt-get update

    sudo apt-get install focuswriter

    ```

    ```


    # 11 **Add fun with Cool Retro Term**


    LxQt already has a great OFterminal application with tabs support, colour profiles
    and more, but we can go even further and install Qt5 and OpenGL-powered old school
    terminal called Cool Retro Term. The following application mimics the historic
    cathode tubes of Amiga, IBM and Apple workstations:


    ```

    ```

    sudo add-apt-repository ppa:bugs-launchpad-net-falkensweb/cool-retro-term

    sudo apt-get update

    sudo apt-get install cool-retro-term

    ```

    ```


    Once it is launched you can switch between profiles or change the effects manually.
    It is even possible to scale up the whole screen so that Cool Retro Term will
    be as usable as a regular console application, which is handy.


    # **Add more apps**


    If you stay with your custom LxQt desktop, sooner or later you’ll want more. The
    applications in this tutorial are not all the Qt5 applications out there, so supercharge
    your system with the following:


    +   - **Votair** A 2D platformer game built on top of Qt Quick and LiquidUI libraries.
    Getting the game compiled in Linux needs skill, but there’s a perfect guide: `bit.ly/1HIHMB9P`.

    +   - **Friends** This app features a next OML interface and is easy to install
    (`sudo apt-get install friends-app`). To use it you must refer to Unity’s Online
    Accounts section, so you need that DE or at least its `go-daemon` (stored in `~/.config/goa-1.0/`).

    +   - **Rosa ImageWriter** This is a Qt5 port of famous SUSE Studio ImagerWriter.
    The app is improved for comfortable USB media writing. See `bit.ly/1ZgurWL` for
    applications that are dependent on KDE Software delivery and are difficult to
    use outside of certain DES.

    +   - **Qt-apps.ORG** The `qt-apps.org` website is a vital bookmark if you want
    to keep track of Qt5 applications. Most new and updated titles appear there.'
  - '[PAGE 57]


    # Tutorial


    # AWS cloud


    The AWS logo in the AWS Management Console shows the infrastructure services


    If you want to run your own Linux box in the cloud, look no further than EC2


    Reserve domain names and DNS route to your Linux server in the cloud with Route
    53


    Go to your cost management services and billing information via a menu with your
    username


    ![](img/c9d26cf718256f071c3af699b9670538_57_0.png)


    # Run Linux in the AWS cloud


    # Advisor


    **Filipe Martins & Anna Kobylinski** teamed up two decades ago on a seemingly
    innocent Linux book and ended up in enterprise IT, designing cloud topologies,
    optimising Linux AMIs and managing AWS deployments. Join their conversation on
    Twitter via @RealProfReal, @Cloudinsidr and @4digitalmasters


    # Power up your own virtual Linux instance on EC2 and run it free for a year


    AWS, short for Amazon Web Services, is the equivalent of an online retailer for
    virtual infrastructure and cloud services, complete with an automated self-service
    checkout and rock-bottom prices. Amazon’s pay-as-you-go reedition of enterprise-class
    infrastructure services is welcomed by cost-conscious, performance-hungry users
    – from website owners who need to scale out on demand, to software developers
    and Linux administrators who only need a Linux box for a few hours. On AWS, there
    are no long-term commitments – you only pay for actual use. With cost savings
    of as much as 72 per cent and more over a conventional data centre, it


    is no wonder that AWS quickly became the hot ticket in town. The research firm
    Gartner estimates the total global market share of AWS at a mind-bending 83 per
    cent. Arguably, the most important feature of Amazon’s cloud is not its sheer
    size but its affordability. Amazon gives each new account owner a free usage Tier
    for a full year after they first register: **https://aws.amazon.com/free/**. So,
    thanks to its low prices, no up-front investment, its granular administrative
    controls and the freedom to run your own infrastructure in your own way, AWS has
    turned into an open source stronghold where Linux reigns supreme.


    # Resources


    +   * Web browser

    +   * Phone number

    +   * Email address

    +   * Credit card number

    +   * SSH client

    +     (optional but recommended)'
