    ## 特性


    ### 闹钟机器人


    追逐你的闹钟听起来可能是一场噩梦，但这在现实中确实存在


    ![](img/c9d26cf718256f071c3af699b9670538_23_0.png)


    ### 机器人教育


    有很多方法可以让孩子对编程产生兴趣。比如用 Scratch 制作游戏，修改 Minecraft，以及通过机器人技术进行教学。后者是一个较新的概念，但同样具有显著的优势——孩子们会对自己创造出的实体作品感到兴奋，并对自己在这些作品上编写的程序做出反应。可见的成果和即时满足是激发想象力的绝佳方式。


    当我们谈论办公室里的闹钟机器人 Rolly 时，大多数人都爆出一连串不宜登堂的脏话。这是一个令人窒息的邪恶发明——一个你需要努力才能关掉的闹钟。这听起来是个绝妙的主意，能让那些难以起床的人真正从床上爬起来，开始他们的一天。


    与其他 Dexter Industries 的机器人一样，它运行在 BrickPi 上，这是专为 Raspberry Pi 设计的乐高 Mindstorms
    适配器，使机器人能够通过编程与乐高套件进行交互。


    “如今几乎每个人都使用手机作为闹钟，这有很多优点，”网站解释道。“手机设置简单，调整方便，可以播放自定义歌曲，甚至能感知唤醒你的最佳时间。问题在于，除非你的手机在房间的另一头，否则我们使用手机的时间之长，甚至会在睡梦中使用它。为什么不自制一个机器人，它不仅能做所有这些，而且在你起床并动起来之前绝不罢休！我们的机器人将能够在房间里的任何表面上随机移动，播放自定义的警报音。


    要设置闹钟，只需将 BrickPi 上的程序与你的 Google 账户关联，它将搜索标题为“wake”的事件，并自动在事件时间启动闹钟。这意味着使用任何可以访问
    Google 日历的设备，都可以非常轻松地调整闹钟时间。”


    #### 创客档案


    **Taryn Sullivan**


    *顾问*


    Taryn 是一位国际商务人士。除了在上海和华盛顿特区之间飞来飞去经营自己的工程业务外，她现在还与 Dexter Industries 合作，推广机器人教育。

    了解更多：bit.ly/1BTrYxjv


    ### PiFM 收音机


    有时最简单的黑客技术也能开启无限可能


    #### 创客档案


    **Oskar Weigl**


    *电子工程师*


    Oskar 是一位电子专业人士和机器人爱好者，同时也是一位热衷于正向和逆向工程的狂热分子。

    了解更多：bit.ly/1q86OE


    在帝国理工学院学习期间，Oskar Weigl 和 Oliver Mattos 通过将一根导线（天线）连接到 GPIO 4 并使用自定义 Python 模块，将
    Pi 变成了一台调频收音机。


    “树莓派芯片的硬件中有一个时钟生成模块，允许你以用户选择的频率输出时钟信号，”Oskar 解释道。“我们使用 DMA 控制器向时钟模块发送命令以改变频率，从而实现调频。我们必须将时钟生成模块超频
    20 倍。声音每样本 14 位，通过三角洲-西格玛调制增强到更高的位数，范围至少为 50 米。”


    ### 树莓派智能电视


    你的智能电视不够智能吗？打开外壳，把 Pi 装进去


    #### 创客档案


    **Tony Hoang**


    *研究生*


    Tony Hoang 是纽约州立大学阿尔巴尼分校（SUNY-Albany）的一名博士生，研究领域为计算生物物理学和单分子研究。

    了解更多：linkedin.com/in/tonyhoang


    “海信 LED 智能电视内部有很多空间可以放置额外的电子设备，”Tony Hoang 开始说道。“电视中央有一大片平整区域放置电子部件，我把树莓派放在那里。双向下扬声器声音相当大，所以我移除了其中一个，并换成
    USB 集线器。背板大部分是平的，所以为 LAN 端口和 HDMI 输出找一个位置并不难。


    “树莓派由海信的逻辑板供电。USB 2.0 端口有两个显而易见的 5v/500 mA 输出，我尝试过，但发现当电视关闭时，逻辑板会切断这些端口的电源。为了让树莓派保持开机状态，我用万用表探测逻辑板，发现了一个来自未使用
    GPIO 的电源。”


    ## 树莓派项目


    来自创客们的最伟大硬件黑客技术


    ### Astrogun


    *一款增强现实光枪游戏*


    ![](img/c9d26cf718256f071c3af699b9670538_24_0.png)


    在创客大会上闲逛时，你会看到一些奇特而美妙的事物。在耶路撒冷的创客大会上，你或许看到过人们挥舞着巨大的玩具枪，在 Aivishay 的增强现实体感游戏 Astrogun
    中击落虚拟小行星。


    “Astrogun 里面有一台树莓派计算机，”Aivishay 解释道。“连接在它上面的 IMU 板（Sparkfun 的 MPU-9150 分线板）赋予了
    Pi 感知设备方向的能力。绘制从那个角度看到的元素。当玩家移动时，图形也会移动，从而产生‘房间里有物体’的感觉。”


    “为什么选择树莓派？Aivishay 说是因为时间原因：‘我有很短的时间让它变成可用的东西，所以我必须选择一个既具备完成任务能力又易于使用的平台。RPi 符合这个标准。我使用了许多专为
    RPi 设计或在其上测试过的软件组件——P3D 和 RTIMULib。将 P1 作为硬件平台，Python 作为编程语言，是将想法付诸现实的最快方式。”


    ![](img/c9d26cf718256f071c3af699b9670538_24_1.png)


    **下方**

    *Clover 软件为你打开通往 Astrogun 游戏世界的大门*


    #### 创客档案


    **Aivishay Orpaz**


    *电子工程师*

    了解更多：bit.ly/1AYPsqg


    ### 海盗电视


    彻底重构 Android 电视！


    ![](img/c9d26cf718256f071c3af699b9670538_24_2.png)


    #### 创客档案


    **Donald Derek Haddad**


    *软件工程师*

    Donald 是一位开源黑客

    了解更多：donalderek.com


    作为树莓派智能电视改装方案（见左侧）的完美伴侣，Donald Derek Haddad 的项目是一个你可以自己制作的自定义电视界面。


    “Pirate TV 是一个运行在树莓派和 Raspbian 操作系统上的智能电视应用程序，”Donald 告诉我们。“它由开源工具构建，并附带一个免费遥控器——即你的移动设备。其核心是一个
    Node.js 应用程序，运行带有 Express.js/Socket.io 的 Web 服务器，以处理来自遥控器的用户请求并触发 shell 脚本。电视用户界面在
    Kiosk 模式的 Chromium 实例上渲染。视频从 YouTube 或其他频道流媒体传输，并在 OMXPlayer 上播放，包括 1080P 高清内容在内的缓存。该项目仍在进行中，它将无法接入大量内容，这使得
    Google（现为 Android）电视或其他商业平台极具价值。查看 Derek 的教程：bit.ly/16VYKp。


    ### Pye 收音机


    在这台改装收音机中，旧与新相遇


    #### 创客档案


    **Tony Flynn**


    *高级嵌入式系统设计工程师*

    了解更多：bit.ly/19zrgPi


    升级改造是一个很棒的概念：利用新技术回收产品，使其在现代世界中保持相关。虽然标准的模拟收音机还没有完全退出历史舞台，但在听音乐时拥有多种选择是很好的。这就是
    Tony 的主意发挥作用的地方：


    “我一直在使用树莓派通过我的立体声系统播放音乐流媒体。一旦运行起来，我就把树莓派集成到一台名为 Pye 的旧收音机中！凭借木工和工程的背景，这似乎是完美的项目。


    然而，这个项目对 Tony 来说并非易事：‘改装最难的部分是将调谐器旋钮连接到旋转编码器。对于这台收音机，我使用旧圆珠笔中的弹簧作为传动系统，将调谐器旋钮主轴通过
    90 度连接到旋转编码器。’


    Tony 对如此大幅修改这种经典设计有什么看法吗？‘完全没有！有些人不喜欢现在烙印在这台旧收音机上的现代风格，我认为这是一个新时代，新外观！’


    **右侧**

    机身也被清洁并重新粉刷了


    ![](img/c9d26cf718256f071c3af699b9670538_24_3.png)


