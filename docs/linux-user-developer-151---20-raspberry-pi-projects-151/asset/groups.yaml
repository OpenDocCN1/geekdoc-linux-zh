  mdcn: "\n## 编码专栏\n\n### 在 C 语言中反转字符串\n\n提升你的编码技能，学习使用算法解决问题，详见米哈利斯的新专栏\n\n书籍及其包含的知识，曾掌握着权力的杠杆。我们这个时代的信息之所以不同，是因为与过去的静态媒体不同，它是交互式的。复制信息无需任何努力。Web\
    \ 是一座通用图书馆，是一个无与伦比的信息存储库，涵盖关于一切的事物，无论准确与否，都可以即时按需访问，仿佛百科全书就在我们指尖。但如果 Web 要履行这一角色，就必须以承认该媒介力量和潜力的方式解决版权和思想所有权问题，从而将权力从少数人转移到多数人手中，让创作者、艺术家和作家获得他们应得的真正回报。\n\
    \n正如艾伦·斯沃茨（Aaron Swartz）在其《游击战式开放获取宣言》（[Guerilla Open Access Manifesto](https://archive.org/stream/GuerillaOpenAccessManifesto/Guerrily2008_djvu.txt)）的开篇有趣地指出的那样：“信息就是权力。但与所有权力一样，总有人希望将其据为己有”。在印刷术发明之前，信息掌握在僧侣和抄写员手中，他们往往是社会中唯一具备读写能力的人。版权法在某种程度上将权力交还给了作家和艺术家。当前的一种异常现象是永久性版权，例如，‘祝你生日快乐’这首歌在其作曲家去世\
    \ 100 多年后仍处于版权保护之下，而收益流向了某个公司实体，这种做法已难以维持。我们今天可能不会为复制书籍的权利而战，但对共同信息的开放获取——尤其是那些从未打算私有、以科学文件形式存在的资料——正“越来越多地被少数私营公司数字化并锁闭”，这绝对仍是一项值得为之抗争的权利。\n\
    \n![](img/c9d26cf718256f071c3af699b9670538_12_0.png)\n\n米哈利斯·楚卡罗斯（Mihalis Tsoukalos）是一名\
    \ UNIX 系统管理员、程序员、数据库管理员和数学家。他自 1993 年起就开始使用 Linux。\n\n**在 C 语言中反转字符串** 会带来一些难题。不仅要找到完成工作的方法，还要找到高效的算法来完成它。你可以决定反转后的字符串是存储在现有内存空间中，还是希望分配新的内存空间和新的变量。使用现有内存空间比较困难，但这通常是期望的任务——我们假设除了临时变量外，不会分配新的内存空间。\n\
    \nC 语言允许你以两种方式访问字符串：作为数组或使用指针。尽管 C 指针可能是导致恶性错误的根源，但指针的速度极快。\n\n给定字符串 `p = \"abc\"\
