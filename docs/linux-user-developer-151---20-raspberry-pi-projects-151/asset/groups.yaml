    # Review


    ## Sakura


    Sakura has a devoted following, but will it shine for you?


    ![](img/c9d26cf718256f071c3af699b9670538_77_0.png)


    Sakura’s responsiveness makes it easy to keep track of all of your tabs


    ### System


    With slightly more than minimal dependencies, Sakura runs everywhere (we''re using
    it on a Raspberry Pi B+). There''s no real desktop integration – although copy,
    paste and URL link-following work – but the right-click menu reminded us of the
    WindowsMaker menus from the Apple Cube.


    ### Power


    Speed is the secret of Sakura''s appeal. Some terminal emulators have a noticeable
    lag when you hit Enter after a command, but not this one. Tabs are quick to load
    and switch. Although seemingly as minimal as XTerm, it does scroll output correctly
    with the mouse.


    ### Languages


    On all of our tests with Chinese, Japanese and Greek (ancient and modern), Sakura
    behaved faultlessly. The days of terminal emulators mangling non-Western European
    languages are thankfully moving behind us, and those working with code or files
    from international teams can safely enjoy predictable behaviour here.


    ### Aesthetics


    With standard Gtk libraries and text file settings for custom text colour, font
    and background images, Sakura makes an effort to go along with your choice of
    desktop customisation. Its lack of fancy effects is a plus in the performance
    stakes, but it loses points in this category when even the humble Mrxvt can do
    transparency of a sort.


    ### Overall


    > Sakura impressed us with its speed. Other terminal emulators lag when executing
    commands, which you won''t notice until you try this one. It gets the basics right,
    leaving what''s fancy to users who can live with bloatware.


    7


    ## Mrxvt


    Lighter but less up-to-date, Mrxvt holds aces for older system users


    ![](img/c9d26cf718256f071c3af699b9670538_77_1.png)


    The old-school menus make Mrxvt stand out, and not in a bad way


    ### System


    Low resource use means it''s at home everywhere, aesthetic considerations aside.
    Not so well integrated as its bloated competitors – no drag-and-drop on our LXDE
    test machine, though it does accept paste – but for minimal-resource window manager
    use, it''s a good fit in low-memory systems.


    ### Power


    Tabs can accept a bit of individual customisation to commands and titling, or
    you can broadcast commands to all tabs. Power users will like the keyboard shortcuts,
    although there''s not much done through the menu; you must edit ~/.mrxrc, and
    also choose of logging through utmp, wrong or lasting.


    ### Languages


    No UTF-8, which wasn''t unusual when Mrxvt was seeing more active development;
    it has support for other character sets – it''s quite good with Chinese, Korean
    and Japanese and works with freetype fonts; you just have to configure your Locale
    in addition to your default UTF-8 choice.


    ### Aesthetics


    If you run an old-school desktop, the scrollbars can be set in the style of Next
    or SG1 as well as conventional rvt, Xterm or plain decoration. With true translucent
    window as well as pseudo transparency, background images, freetype fonts and text
    shadows, Mrxvt is surprisingly configurable for an old-school terminal.


    ### Overall


    > Despite its customisability, aesthetic and otherwise, Mrxvt still feels a little
    old-fashioned. Something not helped by the lack of UTF-8. Nevertheless, it''s
    fast, easy to use and perhaps a good second choice in your system.


    6


    ## Tabbed terminal emulators


    ### Terminator


    A Java app, yet a responsive terminal and one with a balanced set of features


    ![](img/c9d26cf718256f071c3af699b9670538_78_0.png)


    - A fast and usable find that works with regular expressions


    #### System


    Very cross-platform - runs on Windows and OS X and not much more demanding than
    the GNOME terminal, though it''s not as snappy as Sakura. It supported drag-and-drop
    on our LXDE test machine and works with Nautilus too. Very fuss-free for a Java
    app, running on Java 6 or above.


    #### Power


    A find command on an infinite scrollback gives you text and regular expression
    search across all input and output in your session. Number reinterpretation across
    bases and proper handling of tab characters make this a great programmer''s terminal.
    Horizontal scrolling is nicely handled where software permits.


    #### Languages


    UTF-8 is a given and our Greek test files were clearly legible even in small monospaced
    fonts. The mix of terminal and wide glyphs is a source of pride to the developers,
    given the space provided on the project''s website for comparisons with Mac Terminal.app
    at non-Latin character handling.


    #### Aesthetics


    The usual selection of colour themes, configurable fonts and anti-aliased text
    keeps Terminator at what many nowadays be regarded as the minimum standard even
    for a terminal emulator. System resources help appearance - Terminator looks very
    nice on modern distros. Horizontal scrolling instead of wrap-around prevents mangled
    output in the terminal.


    #### Overall


    Simpler and more powerful than it first seems, Terminator is a surprise. Hidden
    behind its GNOME namesake, it has lots to offer. Touches like unlimited scrolling
    and variable width character glyphs make it a pleasant user experience.


    9


    ### Roxterm


    An outsider perhaps, but surprisingly configurable and easy to work with


    ![](img/c9d26cf718256f071c3af699b9670538_78_1.png)


    - ROX term balances textfile configuration against menu-driven choice


    #### System


    While it''s great on any desktop - and a natural fit on a ROX Desktop, though
    not many people have embraced that system - GNOME users will be pleasantly surprised
    by what a well-integrated alternative to GNOME terminal it makes. Drag-and-drop
    onto the terminal also worked in other environments, including LXDE.


    #### Power


    Very customisable as long as you don''t mind text files - found under `~/.config/`.
    With everything from D-Bus configurable use of ROX term from other apps to extensive
    menu-driven configuration, ROX developers have worked hard to give you a powerful
    terminal in a lightweight package.


    #### Languages


    UTF-8 is enabled by default and character encoding can be changed in the context-sensitive
    right-click menu. System of Greek and Japanese fonts were legible, and tab completion
    worked across character sets. Non-English users should be able to set keyboard
    shortcuts to other characters.


    #### Aesthetics


    Menu and GUI-driven configuration choices give plenty of colourful options on
    a per-tab basis, which may help some needing visual clues to context, when switching
    between sessions. The colour control is nice but a lack of fancy transparency
    and effects may be a red line for some users spoilt by the competition.


    #### Overall


    You''ve probably never used the ROX Desktop, but its terminal emulator bears closer
    examination. Nice text file configuration (ent-comprised by quick and easy, menu-driven
    changeability. It''s simple and easy to use.


