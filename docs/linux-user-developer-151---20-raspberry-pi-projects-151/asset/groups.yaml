    # Tutorial


    ![](img/c9d26cf718256f071c3af699b9670538_63_0.png)


    # Tether your Raspberry

    Pi to an Android device


    Rob Zwetsloot

    models complex systems and is a web developer proficient in Python, Django and
    PHP. He loves to experiment with computing


    Need the internet on your Pi on the go? Try out a physical tether to your Android
    device for instant online access


    ![](img/c9d26cf718256f071c3af699b9670538_63_1.png)


    The portability of the Raspberry Pi is one of its most lauded features and you
    can get many different accessories to help aid this portability. Mini screens,
    mini wireless keyboard and mouse combos, portable batteries and more can get you
    out and about, but the internet is a stumbling block that you can''t easily fix
    with an accessory. What you do also usually have to rely on is an Internet-connected
    magic pocket box called a smartphone that, with a bit of know-how, you can connect
    the Pi to and steal some Internet from. Over the next two pages we will impart
    this know-how to get you using your Raspberry Pi on the Internet when you''re
    on the go.


    01 **The easy way**

    A lot of smartphones now have a Wi-Fi hotspot feature, which the Raspberry Pi
    can easily attach to. First of all, turn the hotspot on and then boot into the
    Pi. Connect a wireless dongle and open up the wpa_gui in Preferences\>Wi-Fi Configuration.


    02 **Scan for device**

    Click Scan to open up the scan window and then select Scan again from inside there.
    It should pick up your device – connect it as you would to any Wi-Fi network and
    the Pi will remember it for when it needs it next.


    What you''ll need

    Android device

    USB cable'
