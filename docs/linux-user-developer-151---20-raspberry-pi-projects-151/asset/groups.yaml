    I trained Felix (an assistant on element14''s The Ben Heck Show) on how to do
    it, so he''s been helping and working on them in his spare time as well."


    ![](img/c9d26cf718256f071c3af699b9670538_18_1.png)


    Above Watch the video to see how Ben builds and tests the custom circuit board


    ### Maker Profile


    ### Ben Heck


    Master hacker, creator of The Ben Heck Show


    ![](img/c9d26cf718256f071c3af699b9670538_18_2.png)


    Ben Heck is an online sensation and a pillar of the maker community, putting out
    amazing how-to videos for games console hacks and all kinds of different Pi projects.
    He''s done it all on The Ben Heck Show.


    Find out more: benheck.com


    ### Heck''s hacks


    - **Pi Point and Shoot.** A Raspberry Pi camera module, PiTFT from Adafruit, PlayStation
    3 controller battery and additional parts were all made into a point-and-shoot
    camera.

    - **Pi Retro Computer.** A tribute to the BBC Microcomputer from the 1980s, Ben
    mounted a Raspberry Pi to a self-made wooden case, HDMI port, on/off switch and
    USB hub for an old-school feel/computer and carrying case.

    - **Handheld Pi Console.** Ben hacked a Raspberry Pi single board computer to
    make it smaller. Combined with a compass and LCD wireless keyboard, lithium battery
    power source and USB joystick, he created a handheld gaming console.


    ## Camera Pi


    Power up a regular point-and-shoot DSLR camera


    ### **Maker Profile**

    **Dave Hunt**


    Photographer and maker

    Dive into the world of hacking and photography with Dave Hunt.

    Find out more: davidhunt.ie


    We last spoke to Dave Hunt back in issue 141. This issue he’s back with his Camera
    Pi.


    “Needed to transmit photos to an iPad as they were taken,” explains Dave, “but
    the commercial solutions were £500, I had a broken battery grip big enough to
    fit my Raspberry Pi and a battery, so I went for that one.


    The battery grip holds two batteries. Once I’d stripped out the battery compartments,
    I cut about filing down all the mounting holes inside the grip so I could get
    the Raspberry Pi inside.


    “The next task was to fit a camera battery and DC-DC converter inside. I was able
    to use part of the removed internals of the grip, and before long I had a slot
    to insert a camera battery into. It’s capable of powering the Pi for about four
    hours.


    Making it wireless was a case of plugging in a USB Wi-Fi adaptor. A few lines
    of Python later and I was able to poll the camera with gphoto2, pull the new file
    off and send them via TTP to Shutter Snitch on my iPad.”


    ![](img/c9d26cf718256f071c3af699b9670538_19_0.png)


    ## Pi Telephone


    Revive a ringing phone with C# circuit wizardry and voltage manipulation


    ### **Maker Profile**

    **Stuart Johnson**


    Managing director

    Stuart runs Logic Echos, an IT consultancy specialising in provisioning network
    services and cloud computing to developers.

    Find out more: logicechos.com


    Stuart Johnson is bringing a classic GPO 746 handset back to life, and while the
    project isn’t yet complete, he has finished the lion’s share of it.


    “I took out the main circuit board inside the phone and squeezed the Raspberry
    Pi in there,” says Stuart.


    “I was then faced with two challenges – the biggest one was getting the bell to
    ring. I found a solution by raising the voltage to 19 volts and dropping it down
    to 5 for the Ras Pi using a very small DC-DC converter the OKI-785RL, with the
    rest then being used for the bell. I was surprised by how well it worked.


    “The bell is using one of the I/O ports, and there’s an available C# library (raspberry-sharp-i/o)
    which lets you monitor and control those ports. So I linked one of the I/Os to
    the pulse dial and connected another to a relay using transistors. Then with the
    software I put in a timer to measure the pulse clicks. I managed to write some
    code to time those pulse clicks and determine the number dialled.”


    ![](img/c9d26cf718256f071c3af699b9670538_19_1.png)


    ## Car Computer


    Ours was good, but Derek Knaggs really has built the real deal


    ### **Maker Profile**

    **Derek Knaggs**


    Managing director

    Derek Knaggs runs Flammelyy IT, an IT supply and support company, and is studying
    computing at the University of Worcester.

    Find out more: flammelyy.co.uk


    Remember the car computer that we made last issue? Well, Derek Knaggs already
    beat us to it, and he’s embedded the display in his dashboard and extended the
    setup to include screens for the rear passenger seats too.


    “I removed the DVD player, which was a standard Ford head unit,” explains Derek,
    “and then purchased a head unit from Xtrons. It’s designed for the Ford Focus
    so it was a straight swap. The Xtrons radio has an S-Video input and that goes
    into the radio, so the Raspberry Pi displays as Auxiliary Input. There’s two Auxiliary
    Outputs on the radio, so the Raspberry Pi sends a video to the main radio which
    then sends it back out to the screens in the passenger seats. What I’ve done is
    put in a device – like a VGA adaptor – it takes one input and puts out two out,
    and that gives me the ability to have the Raspberry Pi running to the back screens
    on their own, or the radio can then control itself. So I have my kids watching
    movies at the back with the Raspberry Pi using an audio splitter (they’ve got
    headphones on), and we can be at the front using the normal radio controls, like
    the satnav for example. So that works well.”


    ![](img/c9d26cf718256f071c3af699b9670538_19_2.png)

