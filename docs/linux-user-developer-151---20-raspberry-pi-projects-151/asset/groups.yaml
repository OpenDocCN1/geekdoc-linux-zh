    它在任何桌面上都很棒——在 ROX 桌面上更是天作之合，尽管没多少人接受那个系统——GNOME 用户会惊喜地发现它作为 GNOME 终端的良好集成替代方案。拖放到终端的功能在其他环境中也能正常工作，包括
    LXDE。


    #### 性能


    非常可定制，只要你不介意文本文件——可在 `~/.config/` 下找到。从其他应用程序通过 D-Bus 配置使用 ROX term 到广泛的菜单驱动配置，ROX
    开发人员努力工作，旨在为你提供一个轻量级包装中的强大终端。


