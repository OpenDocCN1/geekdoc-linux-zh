    # Simplify interviewing and audio transcription on Linux


    ## Make transcribing easier by following our guide through every stage


    **Advisor**

    Rob Zwetsloot models complex systems and is a web developer proficient in Python,
    Django and PHP. He loves to experiment with computing


    **Resources**

    - **Audacity**: audacity.sourceforge.net

    - **VLC**: videolan.org/vlc


    Transcribing is one of the most dull, joyless, time-consuming activities that
    we writers have to undertake. While we love to bring you some of the great interview
    content that can come out of it — and we have had some truly excellent ones recently
    — the process of getting these words onto a text document is not our favourite
    thing.


    Over the years, however, many of us in the press have perfected methods to make
    transcription easier. On Linux, we get some of the best and most customisable
    software, so actually getting a setup going for interviews is easy enough once
    you know how.


    While what we''re talking about in this tutorial is aimed more towards interviewing,
    we have successfully adapted it for press conference use and there is no reason
    to see why you couldn''t use it in lectures to make note-taking easier while at
    college or university. Are you ready? Okay, then let''s go to the first Step.


    ![](img/c9d26cf718256f071c3af699b9670538_42_0.png)


    ![](img/c9d26cf718256f071c3af699b9670538_42_1.png)


    ## 01 Choose an environment


    The first thing you need to do is to select your recording environment. Whether
    you''re recording on the phone, on VoIP or in an open room, try and make sure
    you are in a quiet place as you can be. While not always possible, when this can
    be controlled it’s best to keep it in mind.


    ## 02 Gather equipment


    You need a dictaphone and Android phone or a computer. The former are better for
    open situations, whereas for VoIP convos a dictaphone won’t do much. We recommend
    using your smartphone, so that you can move the audio file to a PC for better
    transcription.


    ![](img/c9d26cf718256f071c3af699b9670538_42_2.png)


    ## 03 ‘Phone tap’


    We have a device colloquially called a phone tap – it’s a pick-up coil that attaches
    to the back of a phone receiver via a suction cup.


    Not very stealthy but excellent if you need to record an interview over the phone.
    These coils end in a 3.5mm jack that can be plugged into dictaphones or computers
    with a microphone in.


    ## 04 Record with VoIP


    Depending on what kind of VoIP service you''re using, you may already have some
    kind of recording function installed. Something like Skype won''t have one installed
    but you can grab the Skype Call Recorder app instead.


    ## 05 If all else fails


    If you need to record a call or audio on your PC, then you can manually record
    the full sound coming from your system using Audacity. You will need to have Pulseaudio
    as your sound server, select Pulse as the input in Audacity, start recording then
    go to volume control and select Monitor from the Capture drop-down menu.


    ## 06 Check equipment


    It''s a common mistake and it happens to everyone, but always check your equipment
    before doing the interview. One day the same setup will not work as you expected
    for some reason, and finding out after an hour-long interview is never fun.


    ## Android apps


    There are a few Android apps that will record voice calls for you, however unless
    you''re using a rooted device you won''t be able to properly record the audio
    coming down the line from the caller. What a lot of them do is use the microphone
    to try and pick up what''s coming from the receiver end of your phone. Experiment
    and find what is best for you, but otherwise you may have to look into rooting
    a phone to get the call recording to properly work.


    ## 07 In the interview


    Taking notes as you record on time stamps of interest can be useful for transcribing
    at a later point. They enable you to fast-forward straight to the stuff that you
    need when you''re writing your article or typing up your notes. You can also do
    this in Audacity by hitting Ctrl+M while you are recording.


    ![](img/c9d26cf718256f071c3af699b9670538_43_0.png)


    ## 08 Transfer to PC


    If you have recorded your interview on an external device, now it''s time to move
    it to your PC. While dictaphones and some apps will have features that let you
    rewind and slow down playback, we can do it far better by having it unified on
    one system.


    ## 09 Clean up the audio


    Before we start transcribing, we can do a few things to make the process slightly
    easier for ourselves. Import the audio into Audacity and, for now, trim the length
    and any breaks that you might have, so that you can gain a better understanding
    of how much there is to transcribe.


    ## 10 Create a noise profile


    Before looping off a quiet spot, you can use this to create a noise profile for
    the location you''re in. This can remove any background noise and make the interviewee
    slightly clearer. To select the hit ''Get Noise Profile.''


    ## 11 Remove noise


    Once the profile has been set, you can start to experiment with removing it from
    the track. Deselect the profile area and give it a quick try for the whole track
    and the default settings by going back to Noise Removal and hitting OK. You can
    select areas to remove noise from and change the settings to refine the removal
    if it helps.


    ## 12 Amplify and normalise


    You can look at trying to get a more consistent volume by amplifying different
    parts of the audio - especially if one side is consistently and noticeably more
    quiet than the other. Amplify can be found in the Effects menu. You may also have
    one side being far too loud - for this you can use Normalise to bring the volume
    down.


    ## 13 Mix down


    Some recorders will put interviewer and interviewee on different sides of a stereo
    track. This can be extremely annoying if you need to leave one side of your headphones
    out, or if you''re just trying to pick up words. On the track itself there''s
    a drop-down menu where you can ''Split Stereo Track'' and then turn each one into
    mono.


    ![](img/c9d26cf718256f071c3af699b9670538_44_0.png)


    ### Explore options


    #### 14 Export the file


    Once you’re done with the file, export it to your preferred file type. We’ll be
    using VLC for the transcription stage, so you can use pretty much any filetype
    you can think of – although let’s not try and test VLC at this stage, we want
    to make the process easier not harder.


    ![](img/c9d26cf718256f071c3af699b9670538_44_1.png)


    #### 15 Configure VLC


    If you don’t already have VLC, it’s time to install it. We will make sure of the
    global hotkeys for this part, which will enable us to control it from a different
    window. Once it’s installed, open it up.


    #### 16 Explore options


    Go to Tools on the menu bar and continue onto Preferences. At the Show Settings
    option, go to All to get the advanced settings up. Scroll down and look for the
    Hotkey settings option. Here’s where the global key settings are found.


    #### 17 Set the hotkeys


    The most important ones we find are play/pause and very short jumps back and forth.
    Double-click on the global key you want to set and then perform the key combo
    that you want to use. We like to use Ctrl+Space for pause and Ctrl+Right/Left
    for skipping – make sure that what you use doesn’t clash with anything though.


    #### 18 Get set up


    The moment of truth is almost here – get your word processor or text editor up
    and get ready to type. Close VLC, then open up the audio file and have it play.
    Go back to your document and try out your new global hotkeys – if all goes well,
    you can now skip backwards, forwards and pause without leaving the transcription.


    #### 19 Time to transcribe


    You can start transcribing right now if you wish. One trick we use is to slow
    down the audio just slightly in VLC – you can do this by going to Playback, Speed
    and then clicking Slower. This reduces the speed down by about 25% and can usefully
    give you just a bit of extra amount of time to write something.


    # Machine transcription


    The state of voice recognition on Linux is good – there are APIs and workable
    acoustic models that can actually parse what you’re saying into sounds and such.
    The main issue right now is the lack of open language models – dictionaries full
    of words and common grammatical phrases. Unfortunately this means, for the time
    being, that there are no real FOSS solutions to machine transcribing that you
    can then fix later.


    #### 20 Transcribe better


    With this setup, your transcription should take a lot less time and generally
    be a little easier to do. Play about with some of the things we have covered in
    this tutorial to make a setup that perfectly suits your needs.

