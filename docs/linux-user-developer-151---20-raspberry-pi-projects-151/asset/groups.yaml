  mdcn: "\n# 免费 Linux 与树莓派视频教程\n\n超过 20 小时的指南 | 另有 20 款自由开源软件包、4 个发行版及教程素材\n\nwww.linuxuser.co.uk\n\
    \n# Linux 用户与开发者\n\n面向 GNU 世代的基础权威杂志\n\n本·黑克（BEN HECK）的精彩技巧\n\n**Skype 电话**\n\n\
    **闹钟机器人**\n\n**复活的老式弹珠机**\n\n# 20 个树莓派项目\n\n# 日常物品的精彩技巧\n\n数字转换\n\n家庭自动化\n\n比特币台球桌\n\
    \n旧物改造收音机\n\n## 修复与排查 Linux 网络\n立即修复您的本地网络和 Web 连接\n\n## LXQt 桌面\n为您的桌面注入动力，并利用\
    \ Qt 的应用程序栈\n\n## AWS 云\n开始使用亚马逊弹性计算云（Elastic Compute Cloud）\n\n## Intel Edison\n\
    英特尔新开发板能否赢得创客群体的青睐？\n\n更多内容\n- 评介 Pyantek 机器人\n- 测试终端模拟器\n- 搭建 LVWiFi 系统\n\n£5.99\n\
    第 151 期\n\n![](img/c9d26cf718256f071c3af699b9670538_1_0.png)\n\n出自《黑暗骑士三部曲》及《盗梦空间》导演之手\n\
    \n# 星际穿越\n\n即刻在数字高清、蓝光™及 DVD 上拥有\n\n传奇派拉蒙\n\n![](img/c9d26cf718256f071c3af699b9670538_1_1.png)\n\
    \n![](img/c9d26cf718256f071c3af699b9670538_1_2.png)\n\nSynology\n使用 Synology NAS\
    \ 存储并串流播放电影\n\n购买详情，请访问 www.synology.com\n\n![](img/c9d26cf718256f071c3af699b9670538_1_3.png)\n\
    \n为庆祝克里斯托弗·诺兰最新史诗巨作《星际穿越》（提供数字高清、蓝光™及 DVD 版本）的发行，Synology 邀请您有机会赢取丰厚奖品，请前往 The\
    \ Gadget Show Live（4 月 12 日-14 日）或访问我们的 Facebook 页面\n\n2015 年 4 月 12 日 - 13 日\
    \ • 盖特威克 Nice Dome\n\n## 欢迎词\n\n欢迎来到《Linux 用户与开发者》第 151 期\n\n**每期低价订阅 Linux User**\n\
    第 36 页\n\n+ 你的 Linux 专家团队..\n\n- Rob Zwetsloot 主修航空航天工程，使用 Python 进行复杂模拟建模。由于分区故障，Rob\
    \ 无法让多任务 LLI& Flying Fortress 摆脱 JRPG 模式，他现在被困在空中，穿着 Cmd。他的 LVM 研究（第 48 页）被扔出窗外并由\
    \ chocobo 送达。\n\n- Jon Masters 是一名 Linux 内核黑客，从事 Linux 开发工作已近 19 年，自 13 岁首次上大学起便开始了这段旅程。Jon\
    \ 居住在马萨诸塞州剑桥市，为一家大型企业 Linux 供应商工作。本月你可以在第 16-17 页看到他精彩的内核专栏。\n\n- Richard Smedley\
    \ 在 WYSIWYG 出现很久之前就开始使用计算机，并且至今仍认为命令行和 Emacs 是最具生产力的工作环境。本月 Richard 解释了如何排查和修复网络连接（第\
    \ 30 页），并挑选了最好的带标签页的终端模拟器（第 77 页）。\n\n- Mihalis Tsoukalos 是一位 UNIX 系统管理员，精通编程、数据库和数学。他自\
    \ 1993 年起就开始使用 Linux。Mihalis 在本期中紧跟 Richard 的网络功能文章，深入探讨 netstat（第 50 页），并开启了他关于编码和解决问题的新专栏（第\
    \ 13 页）。\n\n- Alexander Tolstoy 使用 Linux 多年。虽然简洁是智慧的灵魂，但 Alexander 喜欢详细撰写关于桌面\
    \ Linux 的内容。自安装第一个从软盘安装的发行版起，他一直在这样做。在他的第一篇 LXDT 教程中，Alexander 向我们展示如何通过安装更好的\
    \ Qt 应用来自定义和改进基本的 LXQt 桌面（第 54 页）。\n\n- Gareth Halfacree 是我们的驻地新闻记者，从第 8 页开始为您带来开源世界最新的动态。本月，Gareth\
    \ 还测试了期待已久的 Intel Edison 模块及其配套扩展板，看看自 CE7 以来发生了哪些变化（第 82 页）。\n\n## 本期内容\n\n-\
    \ >> 20 个精彩的 Pi 技巧\n- >> 设置 LVM 文件系统\n- >> 在云中运行 Linux 机器\n- >> 学习修复网络连接\n\n**欢迎阅读最新一期的《Linux\
    \ 用户与开发者》，这是英国和美国最喜爱的 Linux 及开源杂志。**\n\n关于树莓派 2 的讨论热度依然很高，我们开始看到下一代项目出现，它们利用新的处理能力实现了比以往更多的功能。\n\
    \n不过，在这里的“空中堡垒”（Flying Fortress），我们仍然认为一些最好的项目是那些将旧设备、损坏设备拆解并转化为新颖精彩之物的硬件技巧。于是我们走访了一些优秀项目的制作者——了解如何在孩子的卧室里放上一艘宇宙飞船，如何对旧电视和收音机进行升级改造，如何制作一个让你时刻保持警觉的闹钟，等等，所有内容从第\
    \ 18 页开始。\n\n本月，我们也迎来了更多 Linux 专家登船。从第 54 页开始，Alexander Tolstoy 将带我们探索 Qt5 应用程序栈，而\
    \ Anna Kobylinska 和 Filipe Martins 将从第 58 页开始指导我们入门虚拟 Linux 实例。此外，你可以加入 Mihalis\
