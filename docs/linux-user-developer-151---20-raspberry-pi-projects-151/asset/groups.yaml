    ## 01 Installation


    Taiga has three main components that need to be installed separately.


    - Taiga-back: The backend part (also supports the APIs).

    - Taiga-front: The frontend part.

    - Taiga-events: Web sockets gateway. Completely optional and not required for
    general project management purposes. We''ll skip this section.


    Before we get going with the web frontend, we need the backend running. Taiga''s
    backend has several dependencies like development headers, C compiler and other
    packages. First, run the below commands to install all the dependencies.


    ```bash

    sudo apt-get install -y build-essential binutils-doc autoconf flex bison libjpeg-dev

    sudo apt-get install -y libfreetype6-dev zlib1g-dev libwmf-dev libgdmb-dev libncurses5-dev

    sudo apt-get install -y automake libtool libffi-dev curl git tcl tcl-dev

    ```


    Taiga uses PostgreSQL 9.3+ as the database, so install the database:


    ```bash

    sudo apt-get install -y postgresql-9.3 postgresql-contrib-9.3

    sudo apt-get install -y postgresql-doc-9.3 postgresql-server-dev-9.3

    ```


    Now set up the initial user and database. This command will create a user called
    taiga and then a database named taiga under the user taiga.


    ```bash

    sudo -u postgres createuser taiga

    sudo -u postgres createdb taiga -O taiga

    ```


    ## 02 Taiga-back Installation


    Now let''s set up the Python environment. You also need to install virtualenvwrapper
    – a set of extensions that make sure your system isn''t clogged with third party
    libraries by running them in an isolated virtual environment.


    Run the following commands to install Python and virtualenvwrapper. Then restart
    your shell to reload the bash with the virtualenvwrapper variables and functions.


    ```bash

    sudo apt-get install -y python3 python3-pip python-dev python3-dev python-pip
    virtualenvwrapper

    sudo apt-get install libxml2-dev libxslt-dev

    ```


    Download the Taiga backend code from GitHub and run the commands below. The current
    directory will change to ''taiga-back'':


    ```bash

    cd ~

    git clone https://github.com/taigaio/taiga-back.git taiga-back

    cd taiga-back

    git checkout stable

    ```


    Create a new virtualenv called taiga using the following command:


    ```bash

    mkvirtualenv -p /usr/bin/python3.4 taiga

    ```


    Then install dependencies for the backend:


    ```bash

    pip install -r requirements.txt

    ```


    Populate the database with sample data; this will also create a user admin with
    password 123123:


    ```bash

    python manage.py migrate --noinput

    python manage.py loaddata initial_user

    python manage.py loaddata initial_project_templates

    python manage.py loaddata initial_role

    python manage.py collectstatic --noinput

    python manage.py sample_data

    ```


    Now you can run the server. Remember that the workon command enables the taiga
    virtualenv:


    ```bash

    workon taiga

    python manage.py runserver

    ```


    Once this is complete, you should be able to view a JSON that will represent the
    complete list of endpoints via this address: http://localhost:8000/api/v1/.


    ## 03 Taiga-frontend installation


    Now let’s complete the Taiga frontend installation. Taiga uses languages other
    than CSS/HTML/JavaScript in the frontend, so it really needs to be built before
    your browser can fully understand it.


    Download Ruby and Gems. After setting the path with the last command, restart
    the shell with the following:


    ```bash

    sudo apt-get install --ruby

    gem install --user-install sass scss-lint

    export PATH=~/gem/ruby/1.9.1/bin:$PATH

    ```


    Now complete the NodeJS installation with:


    ```bash

    sudo apt-get install --nodejs npm

    ```


    Then run the node command to check if the command is recognised. If not, run:


    ```bash

    sudo ln -s /usr/bin/nodejs /usr/bin/node

    ```


    Now install gulp and bower:


    ```bash

    sudo npm install -g gulp bower

    ```


    …then get the code and compile taiga-frontend:


    ```bash

    cd ~

    git clone https://github.com/taigaio/taiga-frontend.git taiga-frontend

    cd taiga-frontend

    git checkout stable

    ```


    Compile using:


    ```bash

    npm install

    bower install

    gulp

    ```


    Now run gulp:


    ```bash

    cd ~/taiga-frontend

    npm install

    ```


    If you have npm errors while running gulp, clear the temp files and install all
    dependencies again.


    ```bash

    rm -rf ./npm*

    rm -rf node_modules

    npm install

    bower install

    gulp

    ```


    If it is successful, you should now be able to see Taiga at http://localhost:9001.


    ## 04 Create project and user stories


    With Taiga now running in your browser, the next step is to create a project.
    We already have the admin user created with the password 123123, so log in to
    Taiga with the credentials and click on Create Project. Then select the Scrum
    template and click Next. Finally, fill in the relevant details (name and description)
    and click Create. This will take you to the Project Backlog page. On the upper
    half of the page you have the burn-down chart and the lower half has the user
    story list. On the right sidebar, you can see the Sprints section. As is generally
    done, let’s start with creating user stories, since the uninitiated, agile development
    methodology requires software features to be broken down into smaller units based
    on a user’s point of view. These units are called user stories in agile jargon.


    > Sprints have predefined time slots, usually two to three weeks


    To add a user story, just click ‘Add a new user story’ in the lower half of the
    page. On the next page, fill in the details. Note that you can assign project
    points to the user story via this page. You can also add several stories at once
    using the bulk insert button (next to the ‘Add a new user story’ button), and
    do not forget to change your admin password to something memorable!


    ## 05 Create sprints


