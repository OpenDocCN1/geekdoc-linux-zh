    \n只需 3 分钟！\n\n完成我们的调查，今天就赢得您的位置 **linuxuser.co.uk/survey**\n\n## 开源\n\n08 新闻 |\
    \ 12 观点 | 94 读者来信\n\n## 内核\n\n## Linux 4.0 发布，支持无重启热补丁\n\nTorvalds 从 3.x 分支跃升，坚持“保持袜子干燥”（指版本号变化不大）\n\
    \nLinux 内核 4.0 已正式发布，虽然从 3.x 分支突然跃升可能会让人惊讶，但随之而来的还有一个受欢迎的新技术发展：无需重启即可修补正在运行的实时内核的能力。\n\
    \n2013 年 11 月，创始人兼维护者 Linus Torvalds 暗示正在准备发布一个新的完整版本，并开玩笑说：“我们即将达到必须脱掉袜子才能数到那么高的版本号。”\
    \ 为了“保持数字小而易记”，Torvalds 建议 Linux 3.20 将作为 Linux 4.0 发布——现在他正式履行了这一计划。\n\nLinux\
    \ 4.0 现在成为主线版本，并附带一项具有有趣发展历史的主要特性：无需重启即可在实时系统上修补内核的能力。这项功能最初在 2008 年就以名为 kSplice\
    \ 的项目形式提供给 Linux 用户。该软件使用 stop_machine() 功能暂停系统，修补内核，然后在不重启的情况下重新启动各项服务。\n\nkSplice\
    \ 证明了其有用性，但在 2011 年被 Oracle 收购，现在作为专有服务存在，没有进一步开源发布的计划。随着客户要求类似功能，SUSE 和 Red Hat\
    \ 开始开发他们自己的实现——kGraft 和 kPatch——并于去年几乎同时发布了早期版本，每种设计都专门针对各自的发行版工作。\n\n“对于相关方来说，显然在这种情况下，让多个孤立的解决方案共存于内核中来解决同一问题是绝对不切实际的，”内核开发者\
    \ Jiri Kosina 在给 Torvalds 的关于新实时修补功能的拉取请求备注中解释道。“在 LPC（‘Linux 管道工’会议，在杜塞尔多夫举行）专门的‘实时内核修补’环节，所有相关方坐在一起，达成了一种对两个发行版供应商都适用的联合方案。\n\
    \n“它提供了一个用于功能‘实时修补’（即代码重定向）的基本基础设施——包括包含实际补丁的内核模块 API，以及允许用户空间操作补丁（查询已应用的补丁，启用/禁用它们等）的\
    \ API/ABI，”Kosina 解释道。\n\nKosina 将其描述为“相对简单和极简”，新功能使用 ftrace 和其他现有内核基础设施以降低复杂性，并且它是自包含的。其初始版本是\
    \ x86 硬件的参考实现，对 PowerPC、S390 和 ARM 架构的支持已在开发中。\n\nRed Hat 和 SUSE 均已同意，随着 Kosina\
    \ 的拉取请求正式被 Linux 内核接受，他们将开始着手工作，将各自等效的功能移植到新的通用基础设施中。这意味着放弃他们现有的树外项目，转而采用更具跨兼容性的方案。\n\
    \n![](img/c9d26cf718256f071c3af699b9670538_7_0.png)\n\n![](img/c9d26cf718256f071c3af699b9670538_7_1.png)\n\
    \n## 新闻\n\nLinux 社区的最新动态\n\n开源\n\n### Linux 日历\n\n**5 月 1 日 – 4 日**  \n**2015\
    \ 年 openSUSE 会议**  \n» 海牙 Westviertel 体育中心  \n» 荷兰  \n» events.opensuse.org\n\n\
    这是面向 openSUSE 社区的免费活动，今年的议程包括商务与外联专场、项目与领导力专场，以及社区、协作与合作专场。\n\n**5 月 5 日 – 7 日**\
    \  \n**Strata + Hadoop World**  \n» 伦敦大都会希尔顿酒店  \n» 英国  \n» strataconf.com\n\n\
    由 O’Reilly 和 Cloudera 主办，Strata + Hadoop World 为对大数据、数据科学和普及计算感兴趣的企业提供了交流平台，今年由\
    \ Alastair Croll、Doug Cutting、Roger Magoulas 和 Ben Lorica 担任主席。\n\n**5 月 31 日\
    \ – 6 月 2 日**  \n**女性科技峰会**  \n» 加州希尔顿逸林酒店  \n» 美国  \n» witi.com\n\n该峰会旨在解决科技领域中的性别差异，每天的主题都集中在从社区建设到物联网等话题上。\n\
    \n**5 月 31 日 – 6 月 5 日**  \n**2015 年 DjangoCon 欧洲大会**  \n» 卡迪夫大学  \n» 2015.djangocon.eu\n\
    \n为期六天的 Django 主题演讲和教程，5 月 31 日以面向新手的开放日开始，最后以提供专家帮助的教程和诊所结束。\n\n## 发行版\n\n##\
    \ Elementary OS 因称用户为“骗子”而受批评\n\n*免费何时不再免费？*\n\nElementary OS 的开发人员因声称那些选择下载这款开源\
    \ Ubuntu 衍生发行版但未进行财务贡献的人是在“欺骗系统”而遭到谴责。\n\n在一篇最近的博客文章中，该团队解释了一项计划，强制希望下载这款基于 Ubuntu\
    \ 的操作系统用户输入一个美元金额（包括零表示免费下载），Elementary OS 团队声称“我们希望用户明白，当他们选择不为软件付费时，他们基本上是在欺骗系统。”\n\
    \n用户迅速对该团队提出了批评，但尽管编辑了文章以移除冒犯性的句子，评论区很快就充满了充满愤怒的信息。一位评论者发帖称：“你们称我们为骗子，删除了评论却没有道歉，现在又在抱怨——试图用内疚感绑架你们的核心用户群——关于你们决定基于*他人的工作*来构建操作系统概念的事实。”\
    \ 另一人说：“你们做了自己糟糕的……” 还有人说：“叫我骗子，” 引用了*《辛普森一家》*中的一句名言，“那只是一次轻拍。”\n\n![](img/c9d26cf718256f071c3af699b9670538_8_0.png)\n\
    \n上图 Elementary OS 因声称免费下载该操作系统的用户是在“欺骗系统”而激起众怒。\n\n其他人对潜在信息更持理解态度。“应该有更多人为开源软件尝试商业模式，”一位评论者建议道。\n\
    \n## 社区\n\n## PyCon UK 组织者 John Pinner 逝世\n\n深受喜爱的 Python 社区成员 John Pinner 已经离世。\n\
    \n作为自由和开源软件（FLOSS）UK 小组（原称英国 Linux 用户组 UKLUG）的贡献者，Pinner 是一位著名的 Python 推广者。\n\n\
    除了是 Python 软件基金会（PSF） Fellow 并获得社区服务奖外，Pinner 还因帮助组织 2004 年至 2011 年的 EuroPython\
    \ 会议以及 2007 年至 2014 年的 PyCon UK 会议而闻名。\n\nPSF 的 Mary Ann Sutherland 在得知他的离世后写道：“我有幸在\
    \ 2013 年 PyCon UK 上见到 John 并与他共度时光。他是一位令人愉快的东道主，充满能量，对当地情况了如指掌——历史、好啤酒和最好的酒吧、地标、社区——并怀着热情的好意。他将被深深怀念。”\n\
    \n他的离世在 Python 社区中留下了深深的悲伤。\n\n"
