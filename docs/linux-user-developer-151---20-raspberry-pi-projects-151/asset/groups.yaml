    \n### 将你的树莓派连接到 Android 设备\n\nRob Zwetsloot 擅长建模复杂系统，是一名精通 Python、Django 和 PHP\
    \ 的 Web 开发者。他喜欢进行计算实验。\n\n需要让你的树莓派在移动时也能上网吗？尝试通过物理连接将你的 Android 设备作为热点，即可立即获得在线访问权限。\n\
    \n![](img/c9d26cf718256f071c3af699b9670538_63_1.png)\n\n树莓派的可移植性是其最受称赞的特性之一，你可以获得许多不同的配件来增强这种可移植性。迷你屏幕、迷你无线键盘和鼠标组合、便携电池等可以让你外出，但互联网是一个你无法轻易通过配件解决的问题。你通常还必须依赖一个连接互联网的“神奇口袋盒子”——智能手机，凭借一些技巧，你可以将树莓派连接到它并“窃取”一些互联网连接。在接下来的两页中，我们将传授这些技巧，让你在外出的时候也能使用树莓派上网。\n\
    \n**你需要准备**\n- Android 设备\n- USB 数据线\n\n01 **简单方法**\n许多智能手机现在都有 Wi-Fi 热点功能，树莓派可以轻松连接。首先，打开热点，然后启动树莓派。连接一个无线网卡，并在“首选项”（Preferences）>\
    \ “Wi-Fi 配置”（Wi-Fi Configuration）中打开 `wpa_gui`。\n\n02 **扫描设备**\n点击“扫描”（Scan）打开扫描窗口，然后从里面再次选择“扫描”（Scan）。它应该会检测到你设备——像连接任何\
    \ Wi-Fi 网络一样连接它，树莓派会在下次需要时记住它。\n\n### 将你的树莓派连接到 Android\n\n![](img/c9d26cf718256f071c3af699b9670538_64_0.png)\n\
    \n03 **设置连接共享**\n首先，通过 USB 数据线将你的电话连接到树莓派——根据树莓派的供电能力，它可能在给你的电话充电时遇到困难，但仍然允许你进行连接共享。现在你可以在连接共享菜单中激活\
    \ USB 连接共享。\n\n![](img/c9d26cf718256f071c3af699b9670538_64_1.png)\n\n![](img/c9d26cf718256f071c3af699b9670538_64_2.png)\n\
    \n> 通常很容易判断哪个设备是你的手机——把它放在树莓派旁边，它将是信号最好的那个！\n\n04 **检查连接**\n你的 Android 设备将在树莓派上创建一个名为\
    \ `eth0` 的接口。你可以打开终端并输入以下命令来检查这种情况是否发生，以及它是否允许连接共享：\n\n```\n$ ifconfig\n```\n\n\
    05 **快速连接**\n你现在就可以从终端连接以访问互联网。你可以通过在终端输入以下命令来完成：\n\n```\n$ sudo dhclient usb0\n\
    ```\n\n这将自动获取你的手机分配的任何可用 IP 地址。\n\n06 **测试连接**\n有几种方法可以测试你的连接。我们通常会留在终端并 ping\
    \ `www.google.com`，你可以这样做，或者你可以打开浏览器看看它是否能加载页面。\n\n07 **保存设置**\n一旦你重启树莓派，它不会记得自动连接到手机的共享网络。但是，我们可以向它的配置文件中添加一个条目，以便它将来会尝试这样做。从终端使用：\n\
    \n```\n$ sudo nano /etc/network/interfaces\n```\n\n08 **接口设置**\n在这里你会找到当前的所有网络设置——根据你的情况（例如你是否添加了固定的无线设置或直通设置），你的设置可能与我们的不同。使用与\
    \ `eth0` 行相同的语法，添加：\n\n```\niface usb0 inet dhcp\n```\n\n09 **移动中的连接共享**\n保存并重启后，你的树莓派应该会自动连接到你的手机，无论是通过\
    \ Wi-Fi 热点还是物理连接。连接共享期间可能会比平时消耗更多电量，所以请务必注意你的电池电量。\n\n### 移动数据\n\n在手机上使用树莓派会比正常浏览消耗更多的数据。如果你不想在数据费用上花一大笔钱，我们建议不要进行完整的软件、发行版或固件更新。你还可以设置手机上使用数据量的限制，以避免出现问题，如果有可能的话，物理连接共享还允许你通过手机的\
    \ Wi-Fi 进行连接。\n\n"
