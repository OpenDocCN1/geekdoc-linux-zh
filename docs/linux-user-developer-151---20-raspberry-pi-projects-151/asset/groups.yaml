    # OpenSource

    你的 Linux 新闻与观点来源


    www.linuxuser.co.uk 获取最新的新闻和观点

    直接通过电子邮件联系我们：linuxuser@imagine-publishing.co.uk


    ## 开放硬件


    #  Facebook 推出模块化交换机

    新推出的开放硬件模块化交换机提供 1.28Tb/s 的带宽


    ![](img/c9d26cf718256f071c3af699b9670538_9_0.png)


    社交网络巨头 Facebook 已宣布推出 6-pack，该公司将其描述为第一款开放硬件模块化交换机，旨在用于其庞大的数据中心。


    基于一个名为 Wedge 的顶部机架网络交换机项目，6-pack 使用一种基于 Linux 的操作系统，名为 FBOSS，其数据中心结构基于模块化架构，以实现快速且易于扩展。


    6-pack 被描述为 Facebook 新数据中心结构的核心，它使用 Wedge 作为构建模块，并在十二个独立的交换元件之间作为全网格无阻塞两级交换机运行。目前存在两种配置：一种具有面向前面的
    18 个 40-gig 以太网端口和背面的另外 16 个端口；另一种将所有 32 个端口置于背面，提供 1.28T 的带宽，主要用于聚合目的。


    “通过 6-pack，我们创建了一种架构，使我们能够使用一组简单的通用构建模块构建任意大小的交换机，”Facebook 的 Yuval Bacher 在公司发布活动时解释道。“由于设计如此开放且模块化——并且在交换技术和软件方面非常无关——我们希望整个行业都能以此为基础进行构建。”


    Bacher 声称，由于其开放硬件架构和基于 Linux 的开源操作系统，该交换机设计比传统模块化交换机设计提供了更大的灵活性，并表示 Facebook 已经开始对
    Wedge、FBOSS 和 6-pack 模块化交换机本身进行生产测试。


    Facebook 还进一步确认，他们已将 6-pack 的设计贡献给了 Open Compute Project，该公司是该项目的创始成员之一。


    右图：6-pack 是一种模块化数据中心交换机设计，具有 1.28Tb/s 的带宽和基于 Linux 的操作系统


    ## 行业


    #  Linux 专业人员需求上升

    基金会报告指出认证的迫切性


    ![](img/c9d26cf718256f071c3af699b9670538_9_1.png)


    上图：报告称 Linux 专业人员的需求正在迅速上升


    Linux 基金会和 Dice 的一份报告显示，对基于开源技术云平台日益增长的兴趣导致了 Linux 专家就业市场的扩大。


    这份报告汇总了来自超过一千名招聘经理和近 3,500 名 Linux 专业人员的提供的数据，声称“几乎所有招聘经理”（受调查者的 97%）都打算尽快招聘 Linux
    专家。报告的其他亮点包括，42% 的招聘经理将寻找具有 OpenStack 和 Cloudstack 经验的候选人，23% 正在寻找安全专业知识，另外 19%
    专注于软件定义网络（SDN）。


    然而，对正式认证的要求正在成为行业趋势。报告指出，44% 的招聘经理表示他们“更有可能”雇用获得认可 Linux 认证的候选人，54% 期望申请系统管理员职位的人拥有认证或其他正式培训的证据。


    Linux 基金会执行董事 Jim Zemlin 在报告中声称：“对 Linux 人才的需求持续增长，雇主能够验证候选人是否具备他们所需的技能变得更加重要。正式培训和认证是识别合格人才的关键途径，随着更多人加入
    Linux 社区，专业人员将需要展示他们的脱颖而出。”


    完整报告位于 Linux 基金会网站 linuxfoundation.org。


    #  Bloomberg 成为黄金会员

    金融软件、数据和媒体巨头 Bloomberg 以黄金会员级别加入 Linux 基金会。


    Bloomberg 已经是该基金会专注于安全的 Core Infrastructure Initiative 的成员，它是 Linux、Hadoop、OpenStack
    和 Sor 在其基础设施和媒体资产中的重度用户。


    “Bloomberg 是开放创新和开源倡议的大力支持者，”Bloomberg 首席技术官 Shawn Edwards 声称。


    “我们期待继续与 Linux 基金会密切合作，并以有益于整个 Linux 生态系统的方式向社区学习并为其做出贡献。”


    #  指控 VMware 违规

    Christoph Hellwig 和 SF Conservancy 提起诉讼


    虚拟化专家 VMware 目前正被 Christoph Hellwig 和软件自由联盟（Software Freedom Conservancy）在汉堡地方法院起诉，理由是涉嫌违反
    GNU 通用公共许可证。


    ![](img/c9d26cf718256f071c3af699b9670538_10_0.png)


    内核开发者 Hellwig 自 2007 年以来一直致力于揭露 VMware 在其 ESXi hypervisor 产品中涉嫌的 GPL 违规行为，自 2012
    年起与 SF Conservancy 合作。虽然 VMware 与团体开始了谈判，但当 VMware 的律师拒绝建议的解决方案时，进度在 2014 年停止。


    “VMware 的律师终于在 2014 年告知 SF Conservancy，VMware 没有意图停止分发源自 Hellwig 和其他内核开发者版权的专有许可作品，”该慈善
    FLOSS 集团在宣布诉讼时声称，“尽管 GPLv2 的条款如此规定。”


    Hellwig 和 SF Conservancy 由 JBB Rechtsanwälte 的 Till Jaeger 代表，他以与 Harald Welte
    在之前的 GPL 违规诉讼中的工作而闻名。


    VMware 尚未对诉讼发表公开评论，但预计将在法庭上为其分发实践进行辩护。


    #  Freak 攻击打击 OpenSSL 及其他

    尽管不如 Heartbleed 严重


    包括 OpenSSL 在内的多个 SSL/TLS 实现被发现易受一种被称为 Freak 攻击的新漏洞影响。


    由巴黎 INRIA 的 Karthikeyan Bhargavan 和 mTLS 团队发现，Freak 漏洞使攻击者能够将网页浏览器正在使用的加密降级为易于破解且过时的密码。据称该漏洞影响了互联网上
    26.3% 的活跃 HTTPS 服务器，使其对许多用户具有严重的利用范围。


    虽然这个十年前的漏洞影响了浏览器和服务器中的许多 SSL/TLS 实现，但安全专家声称 Freak 不像最近的 Heartbleed 漏洞那样严重。


