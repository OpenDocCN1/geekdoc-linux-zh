    ![](img/c9d26cf718256f071c3af699b9670538_11_0.png)


    以及原始物品的创造者。在许多情况下，这些个人（或组织）并不是相同的，最终的受益者更可能是前者而不是后者。归根结底，后者需要保护。互联网需要对想法如何拥有和与他人分享的新愿景和理解，以便信息的力量不仅限于少数人，并且创造原始物品的艺术家和作家能够生存和繁荣。


    关于思想和信息所有权及其物理表示的争议由来已久。版权首次写入法律是在 1710 年，但第一次版权战争发生在 561 年，出乎意料的参与者是爱尔兰学者和圣人
    Finnián of Movilla 和 Columba of Iona。


    Columba 出生于大约 521 年，师从 Clonard 的 St Finnián，他是当时最著名的老师，是爱尔兰十二使徒之一，在 Finnián 门下学习后后来成为圣人。在
    6 世纪的爱尔兰，圣人几乎和书一样常见，这在很大程度上可以解释后来关于制作书籍副本权利的争议。文本非常神圣，在印刷机出现之前，许多事情可能取决于一个副本和另一个副本之间的差异。


    书写和抄写书籍通常是修道士的工作。Columba 是当时最著名的抄写员之一，据称他一生写了或抄写了 3000 多本书。关于书籍副本的争议始于 560 年。有问题的书是


    圣杰罗姆诗篇，Columba 在 Finnián of Movilla 不知情的情况下借走了。Columba 的副本是在“夜间匆忙中通过神奇的光芒”非法制作的。Finnián
    命令 Columba 归还书和副本，这激怒了 Columba，并促使他将其提交法庭进行裁决——正是在这里，导致战争的争吵开始了。


    在布雷松法（Brehon law，统治爱尔兰日常生活的普通法体系）下召开了一场法院，审判者是 King Diarmait Mac Certhlaith，他作出了著名的裁决：“每头牛都拥有她的牛犊；因此每本书都拥有它的副本”。这很容易被视为世界上已知最早的有利于版权的裁决。


    据说 Columba 对这一裁决感到震惊和愤怒，并认为国王有偏见。当国王逮捕并杀害了一名在 Columba 保护下的囚犯时，事件的顺序变得复杂。Columba
    和他的亲戚召集了一支军队与国王作战，他们在 Du Crenlinne 战役中相遇。国王的三千人被打死，而 Columba 的亲属只损失了一人。


    由于这场屠杀，Columba 被迫流亡到 Iona 岛，在那里他建立了一座修道院，并被认为将基督教带给了皮克特人。导致战争的书籍副本现在被认为是爱尔兰最古老的书籍。人们假设该书与其他从
    Iona 带来的圣物一起被运回爱尔兰，包括《凯尔经》，以保护它们免受维京人的入侵，并被称为圣 Columba 的“Cathach”，即战书。年代证据表明 Cathach
    可能足够古老，是 Columba 的《圣杰罗姆诗篇》副本，但当然，它可能只是副本的副本。


