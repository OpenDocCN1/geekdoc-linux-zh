    # Raspberry Pi Projects


    The greatest hardware hacks from the makers themselves


    ## RetroNES


    ![](img/c9d26cf718256f071c3af699b9670538_20_0.png)


    Now you''re playing with power. Raspberry Pi power to be exact, situated inside
    an old game console.


    ### Chris Crowder


    Programmer and database administrator


    Working in the car industry, Chris develops manufacturing systems for production
    floor systems using .NET and SQL. In his down time, he likes to play videogames
    and tabletop games, but was previously limited to his PC for the former.


    Find out more: imgur.com/a/KPj2n7gal/rey


    Right: It''s difficult to see, but there are some differences to this NES compared
    to an original.


    > It was a little intimidating at first as I wanted to make sure that this project
    looked and felt like an NES.


    "It all started when my wife asked me what I wanted for Christmas," said Chris
    over email. "I had absolutely no idea but I had been wanting to mess around with
    a Raspberry Pi since it came out, so she got me a starter kit.


    "While waiting for Christmas I started narrowing down ideas and found the RetroPi
    project. I thought that I would just install it, load some ROMs and call it good,
    then I remembered that I had some old NES and SNES controllers in storage. I went
    to get them and found my old childhood NES console along with the controllers.
    Once I got the NES back in the house and started looking at it, I found that almost
    all of the internals were damaged due to insects and moisture. All of the connectors
    were corroded and some of the boards had traces that were peeling. That is when
    I decided that I would use the Raspberry Pi to ''resurrect'' the NES."


    ![](img/c9d26cf718256f071c3af699b9670538_20_1.png)


    Above: Everything is packed inside the original case, without needing to open
    it up to use it.


    Chris completely gutted the case and replaced the insides with a Raspberry Pi,
    hooking up I/O ports to the original connectors for the controllers and the AV
    cables and such. What''s it like taking on a project with one of the most revered
    consoles in videogame history?


    "It was a little intimidating at first as I wanted to make sure that this project
    looked and felt like an NES but with more flexibility. The biggest issue I ran
    into was that I wanted it to be able to work like an NES, meaning that if someone
    wants to play a game that they just turn it on, select a game and then they are
    playing. When they are finished all they have to do is press the power button
    to turn the console off. We can''t do that easily with a Raspberry Pi since there
    is no ATX-style power switch. I was able to solve this issue with a Mausberrry
    Circuit and a Python script. When the power button is pressed it communicates
    with the Pi via a GPIO connection and it runs the shutdown command. Once the Pi
    is shutdown, the circuit cuts the power to the Pi."


    The final product works great, with Chris reporting he can play Atari, Sega and
    Nintendo games just fine. He''s now looking to upgrade it with a Raspberry Pi
    2 and increase the number of games he can play.


    ### Refitting a NES


    Do you fancy taking on the challenge of bringing your old console back to gloriously
    pixellated life? Thought so. In that case, you''ll be needing this – here''s a
    list of the equipment that Chris used to repair and revive his childhood NES console.


    - A broken NES console – please don''t do this to a working console

    - Replacement NES Door

    - CanalKit Starter B+ – soon to be replaced with a Raspberry Pi 2

    - Panel Mount Ethernet Cable

    - Panel Mount HDMI Cable

    - Panel Mount USB Cable

    - USB A Male Connectors 10pk

    - SNES USB Controllers

    - Anker 13000 mAh 3 watt Battery – this is for when there''s no power outlet nearby
    or you want to be portable

    - Mausberrry Circuit – shutdown circuit that uses our own switch, USB

    - LEGO – used to hold the Mausberrry Circuit

    - Gorilla Glue

    - Blue 3-volt LED – the original NES LED was 12 volts, plus all the other items
    in Chris''s entertainment console are blue


    ## Mission Control Desk


    Astronaut training begins early in Jeff Highsmith''s home, with his sons running
    launches from their home-made Mission Control.


    ![](img/c9d26cf718256f071c3af699b9670538_21_0.png)


    Above: The Mission Control desk groups the various functions into ''station''
    panels.


    ![](img/c9d26cf718256f071c3af699b9670538_21_1.png)


    Right: Outside of playtime, this is just an ordinary homework desk. Almost.


    > **Jeff Highsmith**

    > Tinkerer/extraordinary

    >

    > Jeff Highsmith loves to make new and novel things. The medium isn''t important,
    and he enjoys scrounging for materials and making do with what''s at hand.

    >

    > Find out more: jeffhighsmith.com


    ### Astrocarpentry


    The panels are assembled from bare components. Jeff ordered the switches and then
    designed the panel layout and labels on his computer, printing them on inkjet
    transparency – clear acetate – and then gluing those onto some fibboard that he
    had spray-painted a metallic grey. He estimated that the whole budget was $100.


    ![](img/c9d26cf718256f071c3af699b9670538_21_2.png)


    Above: These reflect the real stages of a NASA mission and play authentic recorded
    sounds.


    Jeff Highsmith is probably the best Dad in the world. Not content to just build
    his son a desk for his room, he modified it so that space adventures can start
    with the push of a button.


    "My eldest son was starting Kindergarten and he needed a desk to do his homework
    on," Jeff tells us. "And since I like to build stuff! I thought I would make him
    a desk rather than buy one, and I was thinking, ''What would make a really awesome
    desk?'' Well, having lots of buttons and switches like a mission control desk!
    Carpentry-wise it was pretty simple to build.


    "The Raspberry Pi is up in the front – centre behind a piece of flexiglass, next
    to the Arduino which takes care of reading the inputs. The Pi handles all the
    sounds and the logic – the gamelay aspect. That was my first Python experience
    and it was pretty good.


    "The desk has got several modular panels and each has a different function. So
    in the real mission control at NASA there''s a desk that controls the retro stage,
    and for this desk I made a retro-booster panel and put a bunch of rocket noises
    on it. There''s a capcom (capsule communicator) panel, so you put on a little
    headset and you can talk to the astronaut that is in the spaceship in the other
    room.


    "There are a couple of panels that have numerical displays: one reads out some
    attitude numbers, like x, y and z in space, and there''s one that monitors the
    astronauts'' vital signs (supposedly). There''s one that does mechanical spacepod
    noises, like pumps, heating elements, buzzing noises, fans etc. I wanted it to
    be like you''re turning things on and off, not just pushing a button that plays
    a sound – that''s why I have the toggle switches as well as push buttons. There''s
    a spot for the iPad in the middle too – you can watch videos of rocket launches.


    "There are homages to actual NASA emergencies, like the stirring of the oxygen
    tanks that led to the Apollo 13 explosion. I have a switch that makes it sound
    like it''s stirring the tanks, then it makes an explosion sound and plays the
    audio from the astronauts talking: ''Houston – we have a problem.'' There''s a
    sequence panel too that has the different mission stages on it and each of those
    plays a real NASA soundbite, all the way from the launch to the landing on the
    Moon to the splashdown."


    ## Spaceship Bedroom


    After successfully accomplishing his desk mission, Jeff Highsmith set his sights
    higher.


    Mission control was but one small step. Next was the mission itself, as Jeff explains:


    "So my boys would hit the buttons on the desk and go through all those mission
    stages and run around with their toy rockets, but having the actual spaceship,
    I thought, would be so cool. The spaceship has some panels similar to the desk,
    but it also has a small screen in there that goes to a video-camera in the cargo
    bay. There''s a motorised hatch on the side that you can open up by flicking a
    switch, and then the camera shows you a cargo bay with a robot arm inside it.
    You can''t see the cargo bay when you''re inside because you''re laying on your
    back, but looking at the screen you can see it and the controls are in front of
    you. I really feel it''s quite fun -- I''ve got a little toy Hubble space telescope
    in there and I hung a piece of fishing line from the ceiling with a little bit
    of metal on it, and then I''ve got a magnet in the space telescope. So you take
    the telescope from the cargo bay with the arm, move it over and snap it onto the
    string that hangs from the ceiling -- we call that orbit. Once it''s in orbit
    you can pull the arm back into the cargo bay, close the hatch and your mission
    is complete, you can return to Earth. And then there''s the satellite mission
    too – to fix the Hubble.


    Jeff''s going to upgrade this awesome setup further. "Eventually," he says, "I''ve
    got some ceiling satellites planned, so I''ll have them orbiting a track in one
    of the bedrooms and the iPad can monitor the different sensors on the satellites.
    The track will be a thin metal rod under the ceiling in an ellipse, and then each
    satellite will have a tiny wheel extending from the top of it, which has a very
    small gear motor on it, so it''ll hang from the track on that wheel. The idea
    is that the kids can build satellites out of Lego, put them in the cargo bay,
    then winch them up into orbit."


    ![](img/c9d26cf718256f071c3af699b9670538_22_0.png)


    > "Having an actual spaceship, I thought, would be cool."


    ## Automatic Roller


    Nearly a Rube Goldberg machine, we hope it plays ''Powerhouse'' when used.


    **Maker Profile**

    **Emil Jaworski**

    Maker

    Finding himself in a rented apartment for a few months, Emil has decided to upgrade
    himself.


    **Find out more:** imgur.com/a/vD4h


    There are many schools of thought regarding your sleeping environment to help
    aid better and more restful sleep. No electronics in the bedroom, try and relax
    before going to sleep, take a cool or hot shower depending on the time of the
    year. Some people require pitch darkness to get a good night''s sleep though,
    while others like to wake up when the sun rises as part of a natural body reaction.
    Emil likes to do both of these things with his Raspberry Pi that automatically
    shuts and opens his blinds at specific times of day.


    "7:30: Press up button, wait 10 seconds (I have smaller window on the bottom and
    bigger above them, so after these 10 seconds, shutters are going to be open only
    on the bottom one), press stop button, 8:00: Press up button, 22:00: Press down
    button."


    Unfortunately, it means he has some electronics in his bedroom, but whatever works
    for him.


    ## RasPi Terminal


    We''ve had lots of Raspberry Pi over the years, but what about Apple Pi?


    **Maker Profile**

    **Austen Barker**

    Engineering student

    A Californian student that has a habit of messing around with any old computer
    hardware that he can get his hands on.


    **Find out more:** imgur.com/a/vB8l


    "In my spare time I like messing around with older computer hardware that I come
    across. Originally I found the need for a terminal to connect over SSH to a server
    that I was using for an internship. It was more efficient than developing on a
    more powerful machine. I took a server to school with me to continue working for
    the same company as I studied.


    I had a Raspberry Pi also sitting around and I started hooking it up to a monitor
    from an Apple IIc that I found at my university''s electronics surplus. This became
    valuable when I started having to log in to a school server over SSH to compile
    assignments for my programming classes. Eventually, I found a keyboard from a
    Macintosh 512k and made it work over USB with a microcontroller and a custom wired
    key matrix, and I paired it with the monitor and Pi."

