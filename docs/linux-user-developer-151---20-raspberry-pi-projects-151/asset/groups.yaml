    \ for x86 hardware, with support for PowerPC, S390 and ARM architectures already\
    \ in the works.\n\nBoth Red Hat and SUSE have agreed that with Kosina’s pull request\
    \ now accepted into the Linux kernel properly, they will begin work to port their\
    \ own equivalent functionality to the new common infrastructure. This means abandoning\
    \ their existing out-of-tree projects in favour of something that will be much\
    \ more cross-compatible to use.\n\n![](img/c9d26cf718256f071c3af699b9670538_7_0.png)\n\
    \n![](img/c9d26cf718256f071c3af699b9670538_7_1.png)\n\n## News\n\nThe latest in\
    \ the Linux community\n\nOPEN SOURCE\n\n### Linux calendar\n\n**1st – 4th May**\
    \  \n**openSUSE Conference 2015**  \n» Westviertel Sport Center, Den Haag  \n\
    » Netherlands  \n» events.opensuse.org\n\nA free event for the openSUSE community,\
    \ this year’s programme includes a business and outreach track, a project and\
    \ leadership track, and a community, collaboration and cooperation track to attend.\n\
    \n**5th – 7th May**  \n**Strata + Hadoop World**  \n» Hilton London Metropole\
    \  \n» UK  \n» strataconf.com\n\nPresented by O’Reilly and Cloudera, Strata +\
    \ Hadoop World provides a venue for businesses interested in big data, data science\
    \ and pervasive computing, and is chaired this year by Alastair Croll, Doug Cutting,\
    \ Roger Magoulas and Ben Lorica.\n\n**31st May – 2nd June**  \n**Women in Technology\
    \ Summit**  \n» Doubletree by Hilton, California  \n» USA  \n» witi.com\n\nFounded\
    \ with the aim of addressing gender disparity in technology, each day of the Women\
    \ in Technology Summit focuses on topics from community building to the Internet\
    \ of Things.\n\n**31st May – 5th June**  \n**DjangoCon Europe 2015**  \n» Cardiff\
    \ University  \n» 2015.djangocon.eu\n\nSix days of Django-themed talks and tutorials,\
    \ starting with an open day on the 31st of May for those new to the platform and\
    \ finishing with tutorials and clinics for expert help.\n\n## DISTRO\n\n## Elementary\
    \ OS criticised for calling users cheaters\n\n*When is free not free?*\n\nThe\
    \ developers of elementary OS have been castigated for claiming that those who\
    \ choose to download the open source Ubuntu spin-off distribution without making\
    \ a financial contribution are “cheating the system.”\n\nIn a recent blog post\
    \ that explained a plan to force users wanting download the Ubuntu-derived operating\
    \ system to type in a dollar value (including zero for a free download), the elementary\
    \ OS team claimed that “we want users to understand that they are pretty much\
    \ cheating the system when they choose not to pay for the software.”\n\nUsers\
    \ are quick to take the group to task, but despite editing the post to remove\
    \ the offending sentence, the comment section quickly filled with ire-laden messages.\
    \ “You called us cheaters, deleted the comment WITHOUT an apology, are now whining\
    \ – trying to guilt your core user base – about the fact that YOU made the decision\
    \ to base your concept for an operating system around SOMEBODY ELSE’S WORK,” one\
    \ commenter posted. “You made your own bad” said someone else. “Call me a cheat,”\
    \ another stated, “that’s a paddling,” quoting a famous line from *The Simpsons*.\n\
    \n![](img/c9d26cf718256f071c3af699b9670538_8_0.png)\n\nAbove Elementary OS raised\
    \ hackles by claiming those downloading the OS for free were “cheating the system”\n\
    \nOthers were more understanding about the underlying message. “More people should\
    \ experiment with business models for open source software,” one commenter suggested.\n\
    \n## COMMUNITY\n\n## PyCon UK organiser John Pinner passes away\n\nMuch-loved\
    \ Python community member John Pinner has passed away.\n\nA contributor to the\
    \ Free and Libre Open Source Software (FLOSS) UK group, formerly known as the\
    \ UK Linux Users Group (UKLUG), Pinner was a noted Python evangelist.\n\nAs well\
    \ as a Python Software Foundation fellow and Community Service Award, Pinner was\
    \ known for helping to organise the EuroPython conference from 2004 to 2011 and\
    \ the PyCon UK conference from 2007 to 2014.\n\n“I had the great honour and pleasure\
    \ of meeting, and spending time with John at PyCon UK in 2013,” wrote the PSF’s\
    \ Mary Ann Sutherland in light of his passing. “He was a delightful host, full\
    \ of energy, knowledgeable about the locale – history, good beers and the best\
    \ pubs, landmarks, neighbourhoods – and enthusiastic goodwill. He will be sorely\
    \ missed.”\n\nHis passing has left a deep sadness among the Python community.\n"
