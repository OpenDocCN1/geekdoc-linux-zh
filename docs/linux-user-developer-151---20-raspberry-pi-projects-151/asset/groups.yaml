    # Demand for Linux professionals rising

    Foundation report points to certification desirability


    ![](img/c9d26cf718256f071c3af699b9670538_9_1.png)


    Above Report claims demand for Linux professionals is rising rapidly


    A report from the Linux Foundation and Dice reveals that rising interest in cloud
    platforms based on open source technologies has led to a growth in the job market
    for Linux experts.


    Compiled from data supplied by over a thousand hiring managers and nearly 3,500
    Linux professionals, the report claims that "nearly all hiring managers" (97 per
    cent of those surveyed) are looking to hire Linux experts soon. Other highlights
    from the report include that 42 per cent of hiring managers will be looking for
    experience in OpenStack and Cloudstack, while 23 per cent are looking for security
    expertise, with a further 19 per cent concentrating on software-defined networking
    (SDN).


    A requirement for formal certification is becoming a trend in the industry, however.
    The report states that 44 per cent of hiring managers say they are "more likely"
    to hire a candidate with a recognised Linux certification, with 54 per cent expecting
    those applying for system administrator roles to have either certification or
    other evidence of formal training.


    "Demand for Linux talent continues, and it''s becoming more important for employers
    to be able to verify candidates have the skillsets they need", claimed Jim Zemlin,
    executive director at The Linux Foundation, of the report. "Formal training and
    certifications are a key way of identifying qualified talent and as more people
    join the Linux community, it will be necessary for professionals to show they
    stand out."


    The full report is on The Linux Foundation''s website at linuxfoundation.org.


