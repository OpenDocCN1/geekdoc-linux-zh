    # ## GUEST COLUMN


    # # Cracking the

    coding skills enigma


    Zach Samocha, director at software testing company Coverity, discusses the importance
    and prevalence of coding in the UK


    ![](img/c9d26cf718256f071c3af699b9670538_13_0.png)


    **Zack Samocha** is a director at Coverity. In his current role he defines the
    company product strategy and manages the Coverity open source Scan program, which
    has grown under his leadership to 4,000 projects and 10,000 active users. Zack
    also initiated research comparing open source code quality with proprietary code.


    **2014: the Year of Code** – or at least that''s how many people viewed the 12
    months that catapulted this precious skill into the limelight. Coding gained huge
    media attention last year, especially when it was added to the UK educational
    curriculum in September – a move that many people celebrated.


    This was all really positive progress for the IT industry as a whole, even though
    the new-found attention on coding might take a little while to change businesses.
    Still, bringing up a wider range of talent with a greater set of skills is definitely
    a step in the right direction, especially considering the lack of skilled coders
    out there at the moment. Along with gadgets like the Raspberry Pi, these developments
    aim to spark a passion in young people early on in their lives about the mechanics
    of computing. Hopefully, their interest in this topic will grow throughout their
    teenage years and into their career.


    The sheer volume of people learning how to code in the UK is exciting but important
    at the same time, as it is changing how we think about IT in this country. People
    are thinking more and more about the possibilities around apps and software, rather
    than just having to support and maintain the desktops, laptops and printers in
    offices around the country.


    This is all great news for the coding community, but we can''t get carried away.


    Even though coding skills are becoming more popular in wider society, this popularity
    doesn''t necessarily match up with a growth in code quality. Unfortunately, we
    have to consider whether the rising amount of programmers and the standard of
    code that they are producing will lower the standard of contributions to open
    source projects, for example, as an area that has seen a lot of progress in recent
    times.


    Let''s take driving as an analogy here; millions of us in the UK are legally allowed
    to drive as we have met all the requirements. We passed the practical and theory
    exams, bought a vehicle and paid road tax in order to maintain the roads we drive
    on. When coding, you don''t need to have a licence, you only need to know how
    to do it and get your hands on the tools. Coding is available to everyone as there
    is no formal regulation, and as a result it attracts a lot of individual coders.


    ''Self-starters'', if anyone, can create a range of software and applications
    without even thinking about having a formal qualification.


    The coding community already knows all about these problems. Even for those open
    source projects which actually have gatekeepers filtering and monitoring code
    contributions, it is a challenging task, as people make mistakes and some of these
    will slip through. A build-up of minor errors, then,


    > > “Coding gained huge media attention last year, especially when it was added
    to the curriculum”'
