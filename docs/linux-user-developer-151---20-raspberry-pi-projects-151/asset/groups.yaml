    # # Troubleshoot & repair networks


    Resolve network connection and web hosting problems


    # ## Dig


    We''ve used the -m option a lot in this tutorial, as DNS issues can easily cloud
    other problems. Once you''ve cleared up suspected DNS problems on your machine
    with the resolver, it''s time to reach out through the hierarchical world of DNS
    servers to check everything is as it should be. Nslookup and host perform simple
    searches, but dig is the most flexible tool available.


    # **01 Address search**


    Nslookup may be sufficient for resolving an address or checking that you can,
    but for useful information about DNS servers and their recursive connections across
    the Internet, fire up dig, whose flexibility means that it repays a little time
    spent getting to know some of its options.


    ![](img/c9d26cf718256f071c3af699b9670538_34_0.png)


    # **02 Names are served**


    By default, dig returns A records, but it can be used to check other record types
    such as MX (mail servers). In the screenshot above we have used NS to find the
    nameservers for a named domain.


    # **03 Hierarchical**


    DNS is hierarchical, with the TLD (top level domain), such as .com or .org.uk
    queried first, then the name part. With searches taking place recursively there''s
    plenty of room for errors – or even malicious attacks. ''Dig +trace'' shows you
    the successive hierarchical steps taken by your query.


    ![](img/c9d26cf718256f071c3af699b9670538_34_1.png)


    # **04 +short option**


    Hierarchical searches output a lot of information that you probably don''t need
    – even from a standard DNS lookup you may only want the IP address. The **+short**
    option gives you just such an abbreviated output, which is also very useful in
    scripting searches.


    # ## Wireshark


    Like `tcpdump`, Wireshark can dump packets from the network, but it also performs
    interactive analysis – slightly over the top for minor networking problems, but
    handy for locating bottlenecks in the system. In most distros Wireshark will be
    the GUI (**Gtk**) version, with the console version packaged as **tshark**. Try
    them both so you can adapt to whichever is best when trouble strikes.


    ![](img/c9d26cf718256f071c3af699b9670538_34_2.png)


    # **01 Powertool**


    Despite the baffling number of options available, starting is a simple matter
    of selecting interfaces from the Capture menu. To get Wireshark to see your interfaces
    and avoid running it as root user, see *Capture Setup/Capture Privileges* over
    at **wiki.wireshark.org**.


    # **02 Portable troubleshooting**


    As Wireshark is useful for detecting many problems with packet loss or latency,
    and won''t be installed everywhere you go, you can avoid the dance around superuser
    permissions by carrying it around on a USB live distro.


    ![](img/c9d26cf718256f071c3af699b9670538_34_3.png)


    # **03 Filter cut**


    Looking at the raw data is overwhelming and even the choice of filters is large,
    but you can right-click a suspicious entry and use that as the basis for a filter,
    or do the same from the filter hierarchy. Simplest case, you''re looking for a
    particular protocol – say DNS, or perhaps something encrypted via TLS – so you
    just put that in the filter toolbar.


    # **04 Command line shark**


    On your VPS, or other non-**GUI** box, **tshark** is functionally equivalent to
    Wireshark; it''s worth installing after Wireshark and then getting familiar with,
    so you are prepared if you ever need it.'
