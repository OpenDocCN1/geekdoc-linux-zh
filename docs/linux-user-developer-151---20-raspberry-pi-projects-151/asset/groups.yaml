  - "[PAGE 2]\n\n# ## Welcome\n\nto issue 151 of Linux User & Developer\n\n**Get Linux\
    \ User cheaper every issue**\nPage 36\n\n+   Your team of Linux experts..\n+ \
    \  \n+   Rob Zwetsloot studied aerospace engineering, using Python to model complex\
    \ simulations. Due to faulty partitions, Rob has been unable to shift the multitasking\
    \ LLI& Flying Fortress out of JRPG mode and he is now trapped in the sky, dressed\
    \ as Cmd. His LVM research (p.48) was thrown overboard and delivered by chocobo.\n\
    +   \n+   Jon Masters is a Linux kernel hacker who has been working on Linux for\
    \ some 19 years, since he first attended university at the age of 13. Jon lives\
    \ in Cambridge, Massachusetts, and works for a large enterprise Linux vendor.\
    \ You can find his brilliant Kernel Column on pages 16-17 this month.\n+   \n\
    +   Richard Smedley started using computers long before XOWWYG and still maintains\
    \ that the command line, and Emacs, is the most productive working environment.\
    \ This month Richard explains how to trouble shoot and repair your network connections\
    \ (p.30) and picks out the best tabbed terminal emulators (p.77).\n+   \n+   Mihalis\
    \ Tsoukalos is a UNIX system administrator with expertise in programming, databases\
    \ and maths. He has been using Linux since 1993. Mihalis follows Richard's networks\
    \ feature with a closer look at netstat in this issue (p.50), and also begins\
    \ his new column on coding and problem solving (p.13).\n+   \n+   Alexander Tolstoy\
    \ has used Linux for years. Though brevity is the soul of wit, Alexander loves\
    \ writing on desktop Linux in details. He has been doing it since he installed\
    \ his first distro from a floppy disk. In his first LXDT tutorial, Alexander shows\
    \ us how to customise and improve a basic LXQt desktop with better Qt apps (p.54).\n\
    +   \n+   Gareth Halfacree is our resident news reporter and brings you the latest\
    \ developments from all over the open source world, starting over on page 8. This\
    \ month, Gareth also tests the long-awaited Intel Edison module and its companion\
    \ breakout board to see how much has changed since CE7 (p.82).\n\n# ## This issue\n\
    \n+   >> 20 Amazing Pi hacks\n+   >> Set up LVM filesystems\n+   >> Run Linux\
    \ boxes in the cloud\n+   >> Learn to fix your network connections\n\n**Welcome\
    \ to the latest issue of Linux User & Developer, the UK and America's favourite\
    \ Linux and open source magazine.**\nThere's still a lot of buzz about the Raspberry\
    \ Pi 2 and we're starting to see the next generation of projects emerge, taking\
    \ advantage of the new processing power to achieve more than ever before.\nHere\
    \ at the Flying Fortress, however, we still think some of the best projects are\
    \ the hardware hacks that tear up old, broken devices and turn them into something\
    \ new and exciting. So we went out and spoke to the makers behind some of the\
    \ best – find out how you can put a spaceship in your kid's bedroom, upcycle old\
    \ TVs and radios, build an alarm clock that'll keep you on your toes and more,\
    \ all starting on page 18.\nThis month we're welcoming more Linux experts aboard,\
    \ too. Alexander Tolstoy takes us through the Qt5 applications stack from page\
    \ 54, while Anna Kobylinska and Filipe Martins get us started with virtual Linux\
    \ instances from page 58. Plus, you can join Mihalis Tsoukalos in his brand new\
    \ coding column on page 13, where each issue he will be teaching us essential\
    \ skills for solving coding problems with algorithms. We also have a guest column\
    \ this issue from code quality experts Coventry, which you can find on page 14.\
    \ To see what else is in store for you this issue, just flip the page - enjoy\
    \ your mag!\nGavin Thomas, Deputy Editor\n\n# ## Get in touch with the team:\n\
    \nlinuxuser@imagine-publishing.co.uk\n\nFacebook: Linux User & Developer\nTwitter:\
    \ @linuxusermag\nBuy online magazineshop.co.uk\n\nVisit us online for more news,\
    \ opinion, tutorials and reviews:\nwww.linuxuser.co.uk"
