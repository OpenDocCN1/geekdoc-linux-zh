    # Tutorial


    Qt5 desktop


    Drag application launchers from the menu to the start menu and launcher pane


    The LxQt configuration centre even hosts third-party and system-wide modules


    LxQt already has a power management tool where you can specify different actions


    The system tray supports the embedding of Skype, Dropbox and more, without sni-qt


    ![](img/c9d26cf718256f071c3af699b9670538_53_0.png)


    # Build your own Qt5-powered desktop


    Discover Qt5-based desktop applications that could fit an LxQt environment


    # Advisors


    ![](img/c9d26cf718256f071c3af699b9670538_53_1.png)


    **Alexander Tolstoy** has used Linux for years. Though brevity is the soul of
    wit, Alexander loves writing on desktop Linux in details. He has been doing it
    since he installed his first distro from a floppny disk


    # Resources


    +   - Otter Browser otter-browser.org

    +   - PhotoQt Image Viewer photoqt.org

    +   - Albert Launcher bit.ly/1LGpmqj

    +   - Trojita Mail client trojita.flaska.net

    +   - Drawpile drawpile.net

    +   - SMPlayer SMPlayer.sourceforge.net

    +   - FocusWriter gccode.org/FocusWriter

    +   - Cool Retro Term bit.ly/1BSYWTz


    LxQt is a great lightweight desktop environment, but it''s still in the early
    stages of development and lacks many vital features. However, it is a very promising
    and modern software built around the Qt5 graphic library. For many, the best way
    to try out a Qt5-powered desktop is the new Plasma 5 from the KDE project, but
    we will go a different way. Well be parists and try to use only Qt5 applications
    in everyday life together with LxQt, and entirely avoid away from KDE. What''s
    the point? This will reveal the general readiness of the Qt5 applications stack
    and its feature coverage.


    With acceptable compromise in mind, we will try to show you modern yet compact
    programs for common desktop activities. The whole idea is also a test ground for
    building a lightweight Linux solution which could be useful on low-end machines.
    The LxQt desktop was chosen just for test purposes thanks to its great availability
    on Linux (BSD users would most probably prefer Lumin).


    So we are going to look at certain distros to find out which LxQt delivery is
    particularly good, and then we will install and become acquainted with the Otter
    browser, PhotoQt image viewer, Trojita mail client, Albert launcher, DrawPile
    collaboration tool, SMPlayer, FocusWriter and more (all linked in FileSite). So
    if you''re ready, head to step one.


    54 www.linuxuser.co.uk'
  - '[PAGE 54]


    ![](img/c9d26cf718256f071c3af699b9670538_54_0.png)


    # 03 Thumbnails in PCManFM


    # 01 Choose a distribution


    There is an abundance of easy-to-use Linux distros that could help you instantly
    get started with a usable LxQt desktop – it is up to you to take your pick.


    Lubuntu is a dedicated LxQt flavour of Ubuntu with a ''daily'' PPA containing
    the most recent code (ppa:ubuntu-dev/ubuntu-daily). The PPA is compatible with
    most Ubuntu 14.04 and 14.10 derivatives, including Kubuntu, XLE, Mint and many
    of the others. To get LxQt you will need to packages lqt-metapackage, lqt-session
    and lqt-session packages.


    An alternative way to install LxQt could be Arch/Manjaro (LxQt is in AUR) or the
    development version of OpenMandriva, which is shipped with LxQt by default (Plasma
    5 will arrive at a later date).


    # 02 What we have so far


    The desktop occupies ~95 MBs of RAM. It features a control centre, power management
    applet, customizable bottom panel, lock and fast settings manager, window manager
    chooser, Qtterminal console and PCManFM file manager. Keyboard layouts indicator
    and NetworkManager applet are currently missing, but you can take the XFCE applet
    and gorgeous CMST (frontend to ConnMan) respectively.


    ![](img/c9d26cf718256f071c3af699b9670538_54_1.png)


    By default, the windows decorations are managed by OpenBox but you can change
    it to Kwin or Etermalid. PCManFM is quite modest, but keep in mind that it is
    the only Qt5 file manager for the day.


    # 03 Thumbnails in PCManFM


    We can tweak and add extra functionality to the PCManFM file manager. First, let''s
    add thumbnails support for filetypes other than images. For example, for PDF create
    a new file with the thumbnail extension at ~/usr/share/thumbnailers with the following
    content:


    ```

    `[Thumbnailer Entry]

    TryExec=convert

    Exec=convert %[0] -thumbnail %s Xx%o

    MimeType=application/pdf,application/x-pdf,image/pdf;`

    ```


    Using this template you can add more types that ''convert'' supports (it''s a
    part of ImageMagick).


    # 04 Get Otter Browser


    The web browser is updated weekly so you can track its development on the project
    website. For Ubuntu-compatible Linux systems there''s a handy PPA. So here we
    go:


    ```

    `sudo add-apt-repository ppa:otter-browser/daily

    sudo apt-get update

    sudo apt-get install otter-browser-git`

    ```


    The Otter Browser has a variety of lovely features, such as tabs grouping, mouse
    gestures and a highly customizable UI. You can set the browser as a default web
    application by selecting otter-browser from the Web Browser menu in the System
    Settings.'
