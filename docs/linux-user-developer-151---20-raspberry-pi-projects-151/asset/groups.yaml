    as both scrum and Kanban, create the project under a scrum template and then enable
    Kanban under Admin > Project Profile > Modules > Kanban. Now you will have a Kanban
    option on the left-hand sidebar. Click here to view your scrum project in a Kanban
    template.


    ## 07 Issue management


    Another important aspect of software development is the issue management. Taiga
    offers a comprehensive issue management system that includes bugs, questions and
    enhancements. To raise an issue, click on the Issues link on the left sidebar.
    Then click on the New Issue button in the top-right corner. Fill in the details
    like the type, priority, severity and so on, and then click Create. You can now
