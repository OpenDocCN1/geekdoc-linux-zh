    Happy in all situations **(8)** |


    # AND THE

    WINNER IS...


    # Terminator


    We set out to find the best tabbed terminal emulator — one that''s genuinely pleasant
    to use. That criterion contains a balance between having enough power to make
    daily management of a Linux system easy, and enough configurability for it to
    fit into most systems. Too much flashy graphical wizardry slows down what should
    be an instantly responsive part of your system.


    If you''ve been bitten by flaky Java software before, Terminator is a pleasant
    surprise. Ready access to debug options in the menu may just be a reflection on
    the Java toolkit used or an acknowledgement that the software is not entirely
    without faults, but that said we had little trouble with it.


    Speaking of faultless and responsive, if speed is what matters most then try Sakura.
    ROX terminal was a close second and its scriptability makes it a winner for you.
    We still run Mrxvt on several old machines, but can no longer recommend it in
    our UTF-8-enabled world.


    Away from the four distros that we tested, we really like FinaTerm ( apart from
    the crashes). Enlightenment''s pretty Eterm replacement, Terminology, is also
    not without its problems.


    ![](img/c9d26cf718256f071c3af699b9670538_79_0.png)


    Keep scrolling back, no matter how many weeks you''ve had the terminal open


    With reasonable and recent hardware we''d suggest giving either a try. But what
    we''re looking at here is the best multitask terminal for as many users and machines
    as possible. The terminal should be the very name of accessibility and openness
    of access, hence also our reexamination of compatibility with UTF-8 and non-European
    character sets - another area where Terminator simply shines compared to its competitors.


    The glories of a properly usable find, endless scrollback and nice little touches
    like looking after tabs properly are things being found in other rivals, but the
    complete package puts Terminator as our first choice here. Add in a Java app that
    seems less resource-hungry than GNOME terminal and we have what is a somewhat
    surprising winner.


    Richard Smedley'
