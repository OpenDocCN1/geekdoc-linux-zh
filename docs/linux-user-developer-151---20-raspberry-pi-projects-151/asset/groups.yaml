    # 故障排除与网络修复


    解决网络连接和 Web 托管问题


    ## 网络基础


    对 Linux 网络进行故障排除的第一步，是充分理解其工作原理。


    **网络故障发生在何处？不要忽视硬件问题** – 在进行基本检查之后，值得查找被拔出的线缆或 Wi-Fi 路由器上的故障指示灯 – 但即使沿着你的 **IP
    数据包的路径**追踪，问题也可能出现在许多地方。有些问题很容易检查，而有些问题比另外一些更有可能发生 – 让本指南按照你处理问题的顺序来提供帮助。首先是一些背景信息。你不需要通过
    RHCE（*Red Hat Certified Engineer*，红帽认证工程师）或 LPIC（*Linux Professional Institute*，Linux
    专业协会）考试，你只需要对 TCP/IP 网络有基本的认识。你可以粗略地翻阅本页，并在阅读文章的更实际的部分后再回来参考。


    ## TCP


    TCP/IP – *Transmission Control Protocol*（传输控制协议）/Internet Protocol（互联网协议）– 是一套用于计算机之间通信的规则。TCP
    位于 IP 之上，要求对发送的每个数据报文进行确认 – 与 UDP（*User Datagram Protocol*，用户数据报协议）相比，这意味着大量的开销，UDP
    不进行任何检查，但这意味着有许多有用的信息可供诊断 TCP/IP 问题的工具使用。


    ![](img/c9d26cf718256f071c3af699b9670538_30_0.png)


    30 年前，当 TCP/IP 标准被开发时，计算世界是另一个模样，TCP/IP 对硬件和传输介质的独立性，以及开放标准和通用许可方案，帮助我们建立了今天这样一个网络化的世界。**IP**（互联网协议）定义了数据报
    – 互联网传输的基本单元，由一个报头和一个数据块组成。报头包含了投递所需的所有信息 – 从源设备到目的地的路由 – 在五个或六个 32 位字中。报头包含数据的目的地地址。如果它不在本地网络上，它将被传递到一个网关（或
    IP 路由器），并继续前进直到到达其目的地，其旅程由路由协议决定。


    IP 版本 4（*IPv4*）中的**地址**是一个点分四元组，一个 32 位二进制数，通常以 *n.n.n.n* 的形式表示，其中 *n* 可以是 0 到
    255 之间的任何数字。某些数字是保留的，例如 127.0.0.1 用于本地主机，这是任何计算机指代“我自己”的一种方式，以及用于本地网络的私有地址，例如
    192.168.n.n。当每个烤面包机都想连接互联网时，IPv4 提供的 43 亿个地址是不够的。IPv6（版本 5 从未普及）定义了 128 位地址，试图解决这个问题。IPv6
    在 1998 年正式确立，但仍然只承载不到全球互联网流量 10%。从现在开始，我们将把 IPv4 称为 IP。


    例如，在 192.168.0.0 网络中，**子网掩码**告诉其他计算机（*主机*）和路由器地址的哪一部分是子网（例如 192.168.0），哪一部分是主机。我们的**DSL
    路由器**给我们的笔记本电脑分配了 IP 地址 192.168.0.12，所以主机部分是 12。**子网掩码**是 255.255.255.0，它告诉路由设备如何处理
    IP 地址的各个部分。


    **TCP** 在目的端和源端之间建立*虚拟*连接，确保数据包按顺序重新组装并重新发送任何丢失的数据包。它指定每一端的**端口** – 编号在 0 到 65535
    之间，以指示服务或应用程序。你的机器上 *I*etc/services 中有一个很长的列表，但知名的包括 25（用于发送邮件）和 80（用于 Web）。IP
    地址和端口的组合被称为*套接字*。


    在 IP 以下层，你的物理网络硬件（无线或以太网卡）使用一个**MAC**（*Media Access Control*，媒体访问控制）地址 – 六个由冒号分隔的数字。处理此问题的协议将
    IP 地址转换为 MAC 地址及其反向，*RARP* 负责反向转换。**主机名**（如 wikipedia.org）用于省去你在 Firefox 中输入 91.198.174.192
    的麻烦。*域名系统*（*DNS*）使用互联网上的 DNS 服务器来存储这些名称，并且联系 DNS 服务器时的**卡顿**是许多网络问题的原因。


    ![](img/c9d26cf718256f071c3af699b9670538_30_1.png)


    上方图注：了解基础知识：比较 OSI 七层模型和四层 TCP/IP 模型


    # 教程


    ## 诊断问题


    找到根本问题可能很棘手，但有几个地方你可以首先查看。


    ### 哪里没工作 – 是连接一个网站还是所有网站？


    如果只是其中一个，问题可能仍然在你这一端，但如果所有网站都无法访问，让我们找出问题所在。


    首先，你的网络连接 – 大多数桌面发行版都随附 NetworkManager 来管理连接。从命令行输入 **nm-tool** 将报告它了解到的你的网络信息
    – 查找 "State: connected"。


    如果没有 nm-tool，使用 **ifconfig** 查看识别到的接口，使用 **ethtool** 查看连接状态信息，或使用 **iwconfig**
    查看无线连接。


    虽然 ethtool 会显示你物理连接到网络（Link detected: yes），iwconfig 会显示你连接到无线路由器，ifconfig 会给你你的
    IP 地址和子网掩码，告诉你你的网络配置到这一部分是成功的。


    运行 **route** 将显示路由表，其中包含通往互联网其余部分的默认网关。如果没有显示本地子网外地址的默认网关，你需要修复这个问题。Route 可用于添加路由，但你需要解决问题的原因。


    你的服务器将有固定的 IP 地址，可以编辑以更正网关和其他网络详细信息。笔记本电脑通常由 DHCP（动态主机配置协议）守护进程自动配置，该守护进程通常运行在
    ADSL 路由器上，如有必要，可以更改问题机器的设置。


    修正设置后，重启网络：


    ```

    sudo service networking restart

    ```


    ![](img/c9d26cf718256f071c3af699b9670538_31_0.png)


    上方图注：**www.downtimeforeveryoneofustm.com** 是一个非常方便的诊断工具，听起来很简单


    ### 无法连接 Wi-Fi？


    **wpa_supplicant** 工具显示你的无线网络接口能看到的所有内容。


    ![](img/c9d26cf718256f071c3af699b9670538_31_1.png)


    ...将在基于 Debian 的 PC 上获取修订后的设置 – 对于 Red Hat 系统，请省略动名词（-ing 形式）。再次运行 route 以检查默认网关是否出现。


    **Ping** 使用 TCP/IP 协议栈的另一部分，ICMP，发送 ECHO_REQUEST 数据报，并由被 ping 的主机或网关产生的 ICMP ECHO_RESPONSE
    用于计算往返时间。Ping 告诉你机器是否在线，网络中的延迟是多少，以及丢失了多少数据包，除非服务器被一个过度热情的系统管理员设置为丢弃 ICMP 请求，否则所有这些都有指示意义，这种情况在大多数情况下安全价值微乎其微。使用
    ping 检查你是否有通往互联网主机的路由。先 ping 你的网关：


    ```

    ping 192.168.0.1

    ```


    …然后 ping 一个可靠的主机，如 8.8.8.8，这是 Google 的面向公众的 DNS 服务器之一（另一个是 8.8.4.4）。我们一直在使用 IP
    地址和


    ![](img/c9d26cf718256f071c3af699b9670538_31_2.png)


    Nslookup 提供域名的 IP 地址，以及查找它的位置。简单但有效


    **nslookup** 切换到以避免 DNS 问题分散我们对其他网络故障的注意力，但现在是时候检查 DNS 功能了。**Nslookup**，不如 **dig**（dig
    的部分输出可以在上方看到）复杂，但对于检查域名是否解析为 IP 地址已经足够了。如果没有得到答案，请查看 /etc/resolv.conf。


    ![](img/c9d26cf718256f071c3af699b9670538_31_3.png)


    如果你排除了 DNS，尝试一些上述工具 – 使用 traceroute 查看是否能路由到那里，使用 telnet 和 netstat 查看特定端口是否打开，使用
    dig 获取更多信息，使用 Wireshark 调查无响应或缓慢的服务。


    如果你的 Web 服务器是有问题的那一个，则**ssh** 进去并运行：


    ```

    netstat -lnp | grep -i apache

    ```


    （将 apache 替换为 nginx、httpd 或任何其他适用的）以查看你的 Web 服务器是否正在监听端口 80 上的所有地址。如果你只关心那个端口，你可以
    **grep 80**，但检查 Apache 还在其他什么端口上运行和监听。


    ![](img/c9d26cf718256f071c3af699b9670538_31_4.png)


    Wpa_supplicant 有基于文本的界面和可脚本化版本可用，但 GUI 前端也足够好。


