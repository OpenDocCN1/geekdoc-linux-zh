    \ MySQL 正在高效地接受来自本地主机的连接：\n\n```bash\n$ netstat -lx | grep -i mysql\nunix  2 \
    \ [ ACC ]  STREAM\nLISTENING     32891287  /var/run/mysqld/\n    mysqld.sock\n\
    ```\n\n# 教程\n\n## Qt5 桌面\n\n- 将应用程序启动器从菜单拖到开始菜单和启动器窗格\n- LxQt 配置中心甚至托管第三方和系统范围的模块\n\
    - LxQt 已经拥有一个电源管理工具，你可以在其中指定不同的操作\n- 系统托盘支持嵌入 Skype、Dropbox 等，无需 sni-qt\n\n![](img/c9d26cf718256f071c3af699b9670538_53_0.png)\n\
    \n# 构建你自己的 Qt5 驱动桌面\n\n发现适合 LxQt 环境的基于 Qt5 的桌面应用程序\n\n## 顾问\n\n![](img/c9d26cf718256f071c3af699b9670538_53_1.png)\n\
    \n**Alexander Tolstoy** 已经使用 Linux 多年。虽然简洁是智慧的灵魂，但 Alexander 喜欢详细地撰写关于桌面 Linux\
    \ 的文章。自他通过软盘安装第一个发行版以来，他就一直在做这件事。\n\n## 资源\n\n- Otter Browser otter-browser.org\n\
    - PhotoQt Image Viewer photoqt.org\n- Albert Launcher bit.ly/1LGpmqj\n- Trojita\
    \ Mail client trojita.flaska.net\n- Drawpile drawpile.net\n- SMPlayer SMPlayer.sourceforge.net\n\
    - FocusWriter gccode.org/FocusWriter\n- Cool Retro Term bit.ly/1BSYWTz\n\n  LxQt\
    \ 是一个很棒轻量级桌面环境，但它仍处于开发初期，缺少许多重要功能。然而，它是一个非常 promising 和现代的软件，围绕 Qt5 图形库构建。对于许多人来说，体验\
    \ Qt5 驱动桌面的最佳方式是 KDE 项目的新 Plasma 5，但我们走一条不同的路。我们将成为纯粹主义者，在日常生活中与 LxQt 一起仅使用 Qt5\
    \ 应用程序，并完全避开 KDE。目的是什么？这将揭示 Qt5 应用程序堆栈的总体准备情况及其功能覆盖范围。\n\n  在可接受的妥协之下，我们将尝试向你展示用于常见桌面活动的现代且紧凑的程序。整个理念也是一个测试场，用于构建轻量级\
    \ Linux 解决方案，这在低端机器上可能很有用。选择 LxQt 桌面仅仅是为了测试目的，因为它在 Linux（BSD 用户可能更倾向于 Lumina）上具有极好的可用性。\n\
    \n  因此，我们将查看某些发行版，以确定哪种 LxQt 交付特别好，然后我们将安装并熟悉 Otter 浏览器、PhotoQt 图像查看器、Trojita\
    \ 邮件客户端、Albert 启动器、DrawPile 协作工具、SMPlayer 和 FocusWriter 等（所有链接都在 FileSite 中）。所以，如果你准备好了，请进入第一步。\n\
    \n54 www.linuxuser.co.uk\n\n![](img/c9d26cf718256f071c3af699b9670538_54_0.png)\n\
    \n### 01 选择一个发行版\n\n  有很多易于使用的 Linux 发行版可以帮助你立即开始使用可用的 LxQt 桌面 – 由你选择。\n\n  Lubuntu\
    \ 是 Ubuntu 的专用 LxQt 版本，拥有一个“daily” PPA，其中包含最新的代码（ppa:ubuntu-dev/ubuntu-daily）。该\
    \ PPA 兼容大多数 Ubuntu 14.04 和 14.10 衍生版，包括 Kubuntu、Xubuntu、Mint 以及许多其他版本。要获取 LxQt，你需要安装\
    \ lqt-metapackage、lqt-session 和 lqt-session-icewm 包。\n\n  安装 LxQt 的替代方式可以是 Arch/Manjaro（LxQt\
    \ 在 AUR 中）或 OpenMandriva 的开发版本，后者默认附带 LxQt（Plasma 5 稍后会到来）。\n\n### 02 目前我们拥有什么\n\
    \n  该桌面占用约 95 MB 的 RAM。它具备控制中心、电源管理小工具、可定制底部面板、锁定和快速设置管理器、窗口管理器选择器、Qt 终端控制台和 PCManFM\
    \ 文件管理器。键盘布局指示器和 NetworkManager 小工具目前缺失，但你可以分别使用 XFCE 小工具和漂亮的 ConnMan Gnome 前端（ConnMan\
    \ 的前端）。\n\n![](img/c9d26cf718256f071c3af699b9670538_54_1.png)\n\n  默认情况下，窗口装饰由\
    \ OpenBox 管理，但你可以将其更改为 Kwin 或 Equivoc。PCManFM 相当简洁，但请记住它是目前唯一的 Qt5 文件管理器。\n\n\
    ### 03 PCManFM 中的缩略图\n\n  我们可以调整并添加额外的功能到 PCManFM 文件管理器。首先，让我们为除图像外的文件类型添加缩略图支持。例如，对于\
    \ PDF，在 ~/.local/share/thumbnailers 创建一个新文件，扩展名为 .thumbnailer，内容如下：\n\n```ini\n\
    [Thumbnailer Entry]\nTryExec=convert\nExec=convert %[0] -thumbnail %s x%o\nMimeType=application/pdf,application/x-pdf,image/pdf;\n\
    ```\n\n  使用此模板，你可以添加“convert”支持的更多类型（它是 ImageMagick 的一部分）。\n\n### 04 获取 Otter\
    \ Browser\n\n  该网络浏览器每周更新，因此你可以在项目网站上跟踪其开发。对于 Ubuntu 兼容的 Linux 系统，有一个方便的 PPA。让我们开始：\n\
    \n```bash\nsudo add-apt-repository ppa:otter-browser/daily\nsudo apt-get update\n\
    sudo apt-get install otter-browser-git\n```\n\n  Otter Browser 具有各种令人喜爱的功能，如标签分组、鼠标手势和高度可定制的\
    \ UI。你可以通过在系统设置的网络浏览器菜单中选择 otter-browser 来将该浏览器设置为默认网络应用程序。\n\n"
