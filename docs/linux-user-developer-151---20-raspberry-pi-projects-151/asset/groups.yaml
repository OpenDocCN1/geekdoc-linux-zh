    # 评测


    ## Sakura


    Sakura 拥有忠实的追随者，但它能对你有吸引力吗？


    ![](img/c9d26cf718256f071c3af699b9670538_77_0.png)


    Sakura 的响应速度使追踪所有标签页变得轻而易举


    ### 系统


    除了极少量的依赖关系外，Sakura 几乎可以在任何地方运行（我们在树莓派 B+ 上使用它）。它没有真正的桌面集成——尽管复制、粘贴和 URL 链接跟踪功能有效——但右键菜单让我们想起了
    Apple Cube 上的 WindowsMaker 菜单。


    ### 性能


    速度是 Sakura 魅力的秘诀。某些终端模拟器在输入命令后按回车键时会有明显的延迟，但这款没有。标签页加载和切换都非常快速。虽然看似像 XTerm 一样极简，但它能用鼠标正确滚动输出。


    ### 语言


    在所有针对中文、日文（古语和现代语）的测试中，Sakura 表现完美无误。终端模拟器破坏非西欧语言的时代正幸运地远去，与国际团队协作编写代码或处理文件的用户可以在此享受可预期的行为。


    ### 美感


    使用标准的 Gtk 库以及文本文件设置自定义文本颜色、字体和背景图片，Sakura 努力迎合你的桌面定制选择。它缺乏华丽特效在性能方面是个加分项，但当即使平庸的
    Mrxvt 都能实现某种透明效果时，它在这一类别中就显得逊色了。


    ### 总评


    > Sakura 的速度给我们留下了深刻印象。其他终端模拟器在执行命令时会滞后，这一点你只有尝试了这款软件才能察觉。它正确完成了基础功能，将花哨的功能留给那些能忍受臃肿软件的用户。


    7


    ## Mrxvt


    更轻量但更新较少，Mrxvt 为旧系统用户持有王牌


    ![](img/c9d26cf718256f071c3af699b9670538_77_1.png)


    老式菜单使 Mrxvt 脱颖而出，而且不是往坏的方向


    ### 系统


    低资源占用意味着它几乎在任何地方都能找到归宿，美学家考量除外。集成度不如其臃肿的竞争对手——在我们的 LXDE 测试机器上没有拖放功能，尽管它接受粘贴——但对于最小资源窗口管理器的使用，它在低内存系统中是一个不错的选择。


    ### 性能


    标签页可以接受对命令和标题进行一定程度的单独定制，或者你可以将命令广播到所有标签页。高级用户会喜欢键盘快捷键，尽管通过菜单能做的不多；你必须编辑 ~/.mrxrc，并且还要选择通过
    utmp、错误日志或持久日志进行记录。


    ### 语言


    不支持 UTF-8，这在 Mrxvt 处于更活跃开发时期时并不罕见；它支持其他字符集——它在中、韩、日语言方面表现相当不错，并与 freetype 字体配合良好；你只需在默认的
    UTF-8 选择之外配置你的 Locale 即可。


    ### 美感


    如果你运行老式桌面，滚动条可以设置为 Next 或 SG1 风格，以及传统的 rvt、Xterm 或纯装饰风格。凭借真正的半透明窗口、伪透明、背景图片、freetype
    字体和文本阴影，Mrxvt 对于老式终端来说配置功能令人惊讶地丰富。


    ### 总评


    > 尽管其可定制性（美学家和其他方面），Mrxvt 仍然感觉有点老式。缺乏 UTF-8 支持加剧了这种感觉。尽管如此，它快速、易用，或许是你系统中的良好第二选择。


    6


    ## 带标签的终端模拟器


    ### Terminator


    一款 Java 应用程序，但是一款响应迅速且功能均衡的终端


    ![](img/c9d26cf718256f071c3af699b9670538_78_0.png)


    - 快速且可用的查找功能，支持正则表达式


    #### 系统


    非常跨平台——在 Windows 和 OS X 上都能运行，资源需求比 GNOME 终端多不了多少，尽管它不像 Sakura 那样轻快。它支持我们在 LXDE
    测试机器上的拖放功能，并且也能与 Nautilus 配合使用。作为一款 Java 应用程序，它非常省心，在 Java 6 或更高版本上运行。


    #### 性能


    在无限滚动回溯上的查找命令让你能够跨会话中的所有输入和输出进行文本和正则表达式搜索。跨进制重新解释和制表符的正确处理使其成为一款出色的程序员终端。在软件允许的情况下，水平滚动处理得当。


    #### 语言


    UTF-8 是标配，我们的希腊语测试文件即使在小号等宽字体下也清晰可读。终端和宽字体的混合让开发人员引以为傲，考虑到他们在项目网站上预留了与 Mac Terminal.app
    在非拉丁字符处理方面的对比空间。


    #### 美感


    通常的颜色主题选择、可配置字体和抗锯齿文本使 Terminator 保持在如今许多人都视为终端模拟器最低标准的水平。系统资源有助于外观——Terminator
    在现代发行版上看起来非常漂亮。水平滚动而非换行防止了终端中的输出乱码。


    #### 总评


    比初印象更简单且更强大，Terminator 令人惊讶。隐藏在与其同名的 GNOME 软件背后，它有许多可提供之处。诸如无限滚动和变宽字符字形等细节使其带来愉快的用户体验。


    9


