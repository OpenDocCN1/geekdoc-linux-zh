  mdcn: '

    ## 01 创建新的 AWS 根账户


    若要开始使用 AWS，请在网络浏览器中访问 https://aws.amazon.com 并点击“创建免费账户”。此时，你可以使用现有的亚马逊凭据登录，但这并不总是个好主意。如果你将来需要终止你的
    AWS 账户，亚马逊作为在线零售商，也可能因此失去对你亚马逊账户的访问权限。出于这个原因，为了安全起见，大多数用户倾向于使用另一个电子邮件地址进行注册，以防未来发生任何意外情况。


    ## 02 完成注册流程


    在注册过程中，AWS 会要求你提供联系信息，包括电子邮件地址、电话号码和信用卡号。随后，亚马逊将通过自动电话确认你的人类身份。你的信用卡号用于确认你作为付款人的身份，亚马逊会将其存档保存。只要你仅使用免费套餐额度内的服务，在任何时候你的卡都不会被扣费。


    注册流程会创建一个 AWS 根账户，该账户授予你访问所有 AWS 基础设施服务的权限。它与 Linux 系统上的 root 账户没有任何关系，尽管底层概念非常相似。


    除了下一步中首次登录时，切勿使用你的 AWS 根凭据进行账户管理工作。


    ## 03 登录你的 AWS 根账户


    基于浏览器的亚马逊管理界面——AWS 管理控制台——是你 AWS 基础设施和服务的主要枢纽。你可以通过名为“我的账户”的下拉菜单在 https://aws.amazon.com
    访问它，或者直接访问此 URL：https://console.aws.amazon.com。无论哪种方式，都请使用你 AWS 根账户的凭据（你的电子邮件地址和你的
    AWS 根密码）。请确保切勿在公共网络或公共计算机上这样做，因为如果你的凭据被截获，你可能会失去对整体基础设施的访问权限，同时还要承担费用。因此，亚马逊建议在首次登录后，立即创建一个权限较低的
    IAM 用户用于日常 AWS 交互，并将其链接到 MFA 设备以进行多因素认证（这是另一个教程的主题）。


    ## 04 浏览 AWS 管理控制台


    不出所料，控制台上充斥着 AWS 术语，其普及程度之高，甚至让最坚强的人偶尔也会摇头表示难以置信。要在 AWS 云中启动一台 Linux 机器，你需要导航到
    EC2（弹性计算云）。对于 DNS 服务和域名注册，请前往 Route 53。如果你只需要一些保持易于访问的存储，实际上并不需要一个 Linux 机器——相反，直接前往控制台的
    S3（简单存储服务）部分即可。到达目的地的最简单方法是使用控制台左上角的 AWS 徽标，因为这可以让你访问可用服务列表。


    ### 私有、公共和弹性 IP


    每个 EC2 实例都有一个私有 IP。如果你希望它能从互联网访问，它还需要一个公共 IP。如果在实例设置期间启用“自动分配公共 IP”选项，亚马逊会在实例保持运行期间为你的实例关联一个随机选择的公共
    IP。如果你终止实例甚至关闭 Linux，你将自动失去这个 IP。如果你更喜欢一个可以自行管理的持久 IP 地址，请改用“弹性 IP 地址 (EIP)”。EIP
    是一个常规的公共 IP 地址，你可以将其保留给你的账户，然后随意分配和重新分配。


    ![](img/c9d26cf718256f071c3af699b9670538_58_0.png)


    ## 教程：AWS 云


    ### EBS 卷


    EBS 卷比实例存储速度慢，但提供数据持久性——即使你的 Linux 实例正在运行，你也可以挂载和卸载它们。


    EBS 卷有两种类型：磁硬盘或“高性能”SSD。亚马逊提供的 SSD 分为一个性能类别——通用型或预配 IOPS，它们根据磁盘大小和共享存储池中其他用户的活动提供
    I/O 突发。具有预配 I/O 级别的 SSD 将以指定的 I/O 级别运行，但价格昂贵。通用型 SSD 是最佳选择。如果你注重预算且需要不频繁的访问，磁硬盘是一个折衷方案。


    ### 05 选择你的 AWS 区域


    某些 AWS 服务，特别是 EC2，要求你选择一个 AWS 区域。区域是一组互连的数据中心，称为 AWS 可用区，具有共同的税务管辖范围和相同的价格。你可以利用九个
    AWS 区域中的任何一个服务，而不仅仅是你的默认区域，并根据你的需求进行组合。通常，你会选择最具成本效益的区域，或者组合几个距离最终用户位置最近的区域，以最小化延迟。重要的是要记住，你的
    EC2 仪表板仅显示你当前选中区域内正在付费的基础设施。这是 AWS 的一个常见陷阱：在错误区域的仪表板中监控资源消耗，因此要小心。


    ### 06 启动新的 EC2 实例


    导航到 AWS 管理控制台的 EC2 部分。界面的这一部分授予你访问各种基础设施服务的权限，使你能够在 AWS 云中构建和运行自己的 Linux 机器，即所谓的
    Linux EC2 实例。


    每个 EC2 实例代表一个在虚拟化环境中运行的主机，与其他虚拟机隔离，这使得它非常具有成本效益且相对安全。要在云中启动你自己的 Linux 服务器，请在 EC2
    仪表板中点击 *Launch Instance*（启动实例）。你也可以在 AWS 管理控制台的左侧导航窗格中点击 *Instance*（实例）链接，然后点击
    *Launch Instance*（启动实例）按钮。


    ### 07 选择基于 Linux 的 AMI


    实例的存储配置使用称为 AMI（Amazon Machine Image，亚马逊机器映像）的机器定义来描述。AMI 规定了引导卷的内容等事项。从 *Quick
    Start*（快速启动）部分的列表中选择基于 Linux 发行版的 AMI（不是数据库实例，Amazon RDS 实例不会在操作系统层面授予你超级用户访问权限）。标记为“Free
    tier eligible”（免费套餐资格）的实例，只要在你账户注册后的最初 12 个月内保持每月 720 小时以内的时间配额内使用，就不会产生任何费用。


    ### 08 选择实例类型


    ![](img/c9d26cf718256f071c3af699b9670538_59_0.png)


    实例类型以时钟速度、可用 RAM、内部存储和网络能力方面的性能特征定义了你的 Linux 机器。唯一符合免费使用套餐的实例类型是 t2.micro。


    做出选择后，点击 *Next: Configure Instance Details*（下一步：配置实例详细信息）。


    最好在虚拟私有云 (VPC) 中启动 EC2 实例，这是一种委婉的说法，意味着亚马逊将通过智能路由将其与其他用户的实例隔离。较旧的 AWS 账户也可能提供标记为“EC2-Classic”的选项，该选项没有这种保护，因此如果你看到它，请不要使用。


    在 *''Auto-assign Public IP''*（自动分配公共 IP）菜单中，选择 *''Use subnet setting (Disable)''*（使用子网设置（禁用））。将
    IAM 角色设置为 None（无），将关闭行为设置为 Stop（停止）。如果你启用了“Termination protection”（终止保护），在移除此保护之前，AWS
    不允许你在控制台中使用 Terminate 命令销毁实例。


    保持其他选项不变，点击 *Next: Attach Storage*（下一步：附加存储）。


    ### 09 配置实例详细信息


    在下一个屏幕上，你可以选择启动多少个实例，是否希望它们具有持久性（保持 *Purchasing option check box*（购买选项复选框）未激活），它们是否应具有访问你
    AWS 服务的独立权限（IAM 角色）None（无），并进行配置。


    ### 10 附加存储


    如果你需要额外的卷，现在可以创建并附加它们。免费套餐涵盖最多 30GB 的通用型 (SSD) 存储，为你提供略低于 100 IOPS 的最大基线性能（有关更多信息，请参阅“EBS
    卷”部分）。


    现在点击 *Next: Tag Instance*（下一步：标记实例）。


    ### 11 为你的 Linux 实例添加标签


    AWS 上的标签是键值对，存储有助于你组织 AWS 资源的信息。使用标签纯属可选。别担心——如果需要，你随时可以稍后添加标签。如果此时没有想法，点击 *Next:
    Configure Security Groups*（下一步：配置安全组）。


    '
