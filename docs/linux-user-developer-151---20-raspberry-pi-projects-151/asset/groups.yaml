    aware, sprints are predefined time slots, usually two to three weeks. Before a
    sprint starts, developers commit a set of user stories to be finished by the end
    of the sprint. When the sprint is over, scrum master takes stock of the situation
    and decides the user stories for the next sprint, and this cycle continues.


