    # 故障排除与网络修复

    解决网络连接和 Web 托管问题


    ## 配置文件

    使用你最喜欢的文本编辑器深入配置文件，是快速解决问题的绝佳方式。


    **一切皆文件，即使是有线的设备** – 这就是 Linux 的方式。在八十年代，许多 Unix 系统使用二进制配置文件，但受 Plan9 操作系统的启发，Linux
    将大部分配置信息存储在文本文件中。了解这些文件的位置以及如何操作它们，意味着你的文本编辑器也可以成为检查、修复和维护网络的一个强大工具。


    这从硬件层面开始 – 物理接口位于 `/dev` 下，而 `/proc` 会公开已安装的 PCI 总线和设备的配置，供 `lshw` 读取。当你调用：


    `lshw -C network`


    ...来检查逻辑名称条目，以便与 ethtool 和 ifconfig 等工具配合使用。


    不过，情况并不总是那么简单。在 Red Hat 和基于 Debian/Ubuntu 的机器之间切换时，我们 Ubuntu 机器上的以太网接口是在文件 `/etc/network/interfaces`
    中配置的，而 Fedora 20 笔记本的网卡则是 `/etc/sysconfig/network-scripts/ifcfg-emu1`，该目录中还共享了与我们曾连接过的所有无线枢纽相对应的
    `ifcfg-*` 文件。


    ## 插上了吗？

    你可能不信，但确实会发生这种事。这并不是首先要检查的项目 – ifconfig 和 ping 都会显示你有可用的以太网连接，或者 Wi-Fi 路由器已开启。然而，如果测试显示没有连接，那就是你查找松动电缆（网卡上的绿灯亮着吗？）、未插好路由器或其他物理原因的时候。别忘了，许多笔记本电脑都有小按钮可以关闭
    Wi-Fi 网卡（或 F 键快捷键），这些键可能会被意外按下。


    `rfkill list all`


    ...通常会显示是否处于这种状态。如果是硬阻塞，就按下开关；如果是软阻塞，`rfkill unblock all` 通常会让你的连接恢复。


    正如我们所说，这种事会发生，所以如果发生在你身上，就微笑吧，因为这至少比那些无法立即修复的更严重的问题要好。


    Linux 的“一切皆文件”方法也意味着，如果你遇到硬件问题，通常可以用文本编辑器解决。例如，如果内核没有加载你网卡的模块，那么这里不仅是添加要加载模块的地方，如果设备名称导致错误，还可以添加该设备名称的别名：


    `alias eth0 b44`


    ## 再次谈 DNS

    DNS 由解析例程访问 – 读取配置文件 `/etc/resolv.conf` 以了解搜索位置。查看笔记本电脑上的该文件，你可能会看到类似以下内容：


    例如，你的 `/etc/resolv.conf` 可能列出了由 `resolvconf(8)` 生成的 `libc-resolver(3)` 的 `Dynamic
    resolv.conf(5)` 文件。


    ```

    # DO NOT EDIT THIS FILE BY HAND – YOUR CHANGES WILL BE OVERWRITTEN


    nameserver 127.0.1

    search Home

    ```


    127.0.1（而不是 127.0.0.1）指向一台运行 dnsmasq 的 PC，这是一个在 NetworkManager 控制下的轻量级转发 DNS 服务器。在没有
    dnsmasq 的发行版中，dnsmasq 会从 DHCP 服务器获取 DNS 服务器的地址。


    最好使用 `/etc/resolvconf/base.conf` 来放置如下条目：


    ```

    nameserver 8.8.8.8

    nameserver 8.8.4.4

    ```


    ...以自动写入 `/etc/resolv.conf`。然后，以 root 身份或使用 sudo 运行 `resolvconf -u` 将更新 resolvconf。


    更仔细地查看 `/etc/resolv.conf` 会发现它是指向 `/run/resolvconf/resolv.conf` 的符号链接，这是 dnsmasq
    写入的位置。若要临时移除 dnsmasq，请尝试注释掉 `/etc/NetworkManager/NetworkManager.conf` 中的其条目。


    DNS 服务器按照它们在 `/etc/resolv.conf` 文件中出现的顺序进行查询 – 将你想先尝试的那个放在前面，并且/或者通过在其行首添加 `#`
    来注释其余部分，以便 resolvconf 忽略它们。


    Opennicproject.org 和 http://freedns.zone 提供无重定向且无日志记录的 DNS，如果你居住在一个在线行为受到监控或限制的地方，这是必不可少的。


    最后，回到 IPv6，可以通过编辑 `/etc/modprobe.d/aliases` 并添加以下内容，在全系统范围内移除它：


    ```

    alias net-pf-10 ipv6 off

    alias net-pf-10 off

    alias ipv6 off

    ```


    ...并重启。如果排除它是问题的原因，记得把它改回来：


    `alias net-pf-10 ipv6`


    ## 我在哪里？

    如果你熟悉 `whoami`，它会告诉你当前登录的是哪个用户 – 这在你经常 su 或 ssh 并可能迷失方向时非常有用 – 你可能会期望 whereami
    能告诉你登录的机器名称。**不**。所以为此，你输入 hostname，它会读取 `/etc/hostname`。


    Whereami 是一组有用的脚本，用于检测你的笔记本连接到了哪个网络并相应地配置它。


    对于那些运行轻量级窗口管理器且没有各种花哨功能的发行版的人特别有用，它允许你快速点击可用的 Wi-Fi 网络进行选择。它还可以通过脚本微调已知网络，并以最小的干预适应新连接。


    运行此工具可以首先帮助你避免一些连接麻烦，而且它比 wicd 更灵活。


    ![](img/c9d26cf718256f071c3af699b9670538_32_0.png)


    # 修复网络问题

    使用这四个应用程序将帮助你定位和修复许多网络问题


    ## （Telnet 到）Netcat

    Netcat 不仅完成了 humble telnet 所做的所有事情，还做了更多，但你可能发现自己在一台没有 netcat 的机器上，所以我们从老式 telnet
    的一个例子开始。


    ![](img/c9d26cf718256f071c3af699b9670538_33_0.png)


    ### 01 朴素的 Telnet

    如果你是在九十年代之后才开始使用计算机的，当时 telnet 被 SSH 取代，世界突然变得不那么安全，你可能已经把它当作过去的遗迹而置之不理。但 telnet
    仍然作为一个有用的诊断工具存在于任何发行版中，可以连接到特定端口以查看哪些端口是开放且工作的。


    ![](img/c9d26cf718256f071c3af699b9670538_33_1.png)


    ### 02 引入 Netcat

    如果你能安装 netcat (nc)，那么你就不太会回头使用 telnet 了，因为它将 telnet 的简单测试能力与通过 TCP、UDP 或 Unix
    域套接字几乎可以做任何事情的能力结合在一起：打开 TCP 连接，发送 UDP 数据包，在任意 TCP 和 UDP 端口上监听以及端口扫描。


    ### 03 端口扫描

    虽然检查某人机器上的每个端口以查看哪些端口保持开放（端口扫描）并不是礼貌之举，但在你自己的机器上它对于安全性（“那个不应该开放”）和诊断（“那个应该开放并监听”）都是有用的。尝试运行类似
    `nc -vvnz 192.168.0.11 -65535` 的命令来执行此操作。


    ![](img/c9d26cf718256f071c3af699b9670538_33_2.png)


    ### 04 传递端口

    一个有用的 nc 技巧是快速设置一个**模拟用户**服务器，监听特定端口，以检查该端口之间你和服务器之间是否有任何阻碍连接的因素。在上面的图中，我们将 nc
    设置为一时性 web 服务器，并读取连接到它的主机信息。


    ## Traceroute

    当你使用互联网时，你可能不会思考它是如何工作的，但 traceroute 揭开了你的数据包在何地旅行的面纱 – 显示数据包到达你的机器和服务器之间的每个网关机器所需的时间。


    ![](img/c9d26cf718256f071c3af699b9670538_33_3.png)


    ### 01 跟随跳跃

    Traceroute 测试你与目标主机之间的每个跳跃（hop）。虽然并不总是具有决定性，但输出显示问题可能发生在何处。虽然截图显示默认的跳跃次数和数据包大小，但你可以通过以下命令调整：


    `traceroute -m 255 wikipedia.org 70`


    ![](img/c9d26cf718256f071c3af699b9670538_33_4.png)


    ### 02 旅行时间

    显示的那些以 ms 为单位的时间是发送到每个主机的三个数据包的往返时间。使用 -q 调整数据包数量 – 例如，-q1 只发送一个数据包。从英国更长的时间可能是信道跳跃（channel
    hop）。


    ![](img/c9d26cf718256f071c3af699b9670538_33_5.png)


    ### 03 Mtr

    一连串星号表示无法到达的主机，但 mtr 提供连续的 traceroute 以帮助检测间歇性问题。你可能只能修复你自己网络中发现的问题，但知道问题所在有助于生成一条绕行修复的路径。


    ### 04 阻断的 ICMP

    正如我们在 ping 中提到的，一些系统管理员会阻断 ICMP，因此标准的 traceroute 将不起作用。Tcptraceroute 通过 TCP 而不是
    ICMP 提供 traceroute。


