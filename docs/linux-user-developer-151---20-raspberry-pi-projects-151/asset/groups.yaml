    > 面对树莓派（Raspberry Pi）的人气，Edison 是英特尔赢得创客和爱好者群体青睐的入场券吗？\n\n树莓派的发布对英特尔来说无异于**顿悟**。英特尔长期主导主流计算市场，但在树莓派出现之前一直忽视了创客市场，而树莓派基于\
    \ ARM 的爱好者开发板销量已数百万。\n\n为了切入这个长期被忽视的市场，英特尔最初的策略略显散漫。它与合作伙伴 CircuitCo 共同推出了开源硬件\
    \ MinnowBoard，随后又推出了功能更强大的 MinnowBoard Max。与此同时，它发布了一款名为 Quark 的新芯片，并将其集成在一块以创客为中心的名为\
