    ![](img/c9d26cf718256f071c3af699b9670538_14_0.png)


    不可避免地，这变成了一个更大的问题，再加上大量产生的代码，结合其内容的重要性，可能会导致严重的问题。视频游戏中的故障只会让游戏玩家感到烦恼，但如果出错的代码是在医院设备或某种金融软件中呢？后果突然变得严重得多。


    必须发现并修复任何错误，但至关重要的是，要教导程序员认识这些错误，明白它们为何重要以及这些问题会带来什么影响。技能驱动部门希望提升人数，这固然很好，但质量控制也必须纳入其中。


    越来越多的人开始投身编程，这令人兴奋不已，但我们还必须让行业审视这对未来代码质量的影响。开发者现在必须着眼于长远编写代码，并确保代码在几周、几个月甚至几年后不会崩溃。


    得益于 2014 年的事件，编程世界以前所未有的方式受到了关注，这真的非常好。现在到了 2015 年，我们需要退一步，确保我们目前正在开发的代码能够在未来经受住时间的考验。


    上文：

    Coverity 解决方案有助于在开发过程的早期将质量与安全测试融入其中


    ![](img/c9d26cf718256f071c3af699b9670538_14_1.png)


    ![](img/c9d26cf718256f071c3af699b9670538_15_0.png)


    **乔恩·马斯特斯** 是一位 Linux 内核黑客，自 13 岁上大学以来，他已经在 Linux 领域工作了 19 年。乔恩居住在马萨诸塞州剑桥市，并在一家大型企业
    Linux 供应商处工作。他在 kernelopodcast.org 上发布每日 Linux 内核邮件列表摘要。


    Linux 4.0 中最令人兴奋的新特性可能是新的实时补丁机制，它可以在不重启的情况下动态更新内核的安全性和 bug 修复（类似于此前发明的 Ksplice
    和类似的实时更新技术）。另一个很酷的特性将是新的 KASan（内核地址消毒器），它跟踪内核内存访问，以验证这些访问是否确实触及了其意图修改的内容。这对开发者来说应该非常有用，因为他们通常希望知道他们的任何内核修改是否导致内核试图覆盖物理
    RAM，从而在此过程中造成难以检测的内存损坏。最后，对支持 NVM（非易失性内存）支撑的传统文件系统的支持将让那些幸运地拥有大量 NVM 硬件并尝试它的人感到兴奋。


    如果一切按计划进行，我们将在下个月的刊物中提供 Linux 4.0 的完整摘要，包括内核实时补丁是如何工作的。我们还将研究如何通过系统地调查随时间做出的更改，在内核开发的（以及）开发周期期间（和之后）根除微妙的
    bug，并回顾我们如何处理 Linux 3.0 版本号变更。


    ## 树莓派 2


    许多在英国长大的我们都还记得，我们非常怀念英国广播公司微型计算机系统（或称“BBC Micro”，或简称“BBC”）。这些电脑是由一家来自英国剑桥的小公司
    Acorn 制造的。最初的 BBC 旨在向大众普及计算机知识。它在 80 年代初获得的类似邪教般的成功以及实现目标，至少间接推动了英国计算机行业的许多后续发展，包括后来从
    Acorn 分拆出的另一家小公司——如今众所周知的 ARM 的形成。正是这家 ARM 公司，如今驱动着超过 95% 的智能手机以及绝大多数的平板电脑和其他小工具。


    最初的 BBC 激发了后来许多人的灵感。它是几年前树莓派基金会成立时的灵感来源，早于其第一款 Model A（向 BBC 致敬，像 Pi 一样，BBC 也有
    Model B）在 2012 年推出。最初的 Pi 有多种型号（A、A+、B 和 B+），利用了一种低成本片上系统（SoC），原本设计用于移动图形处理器，碰巧包含了一个小型
    ARMv6（ARM1176JZF-S）兼容处理器，能够运行完整的 32 位 Linux ARM 堆栈（压缩在芯片的角落）。


    前 Broadcom ASIC 架构师兼树莓派基金会受托人埃本·阿普顿（Eben Upton）是那些成功说服 Broadcom 支持 Pi 项目的人之一，开发了一个低成本的信用卡大小的计算平台，在三年内已经售出了超过
    500 万台。最初的 Pi 配备了 700MHz 单核 ARMv6 兼容处理器，256MB（后来是 512MB）RAM，一个用于存储和 USB 的 SDHC
    插槽。Pi 通过 USB-to-Ethernet 桥接芯片利用其片上 USB 提供有线以太网，并可通过 HAT（堆叠在顶部的硬件）扩展板进一步扩展。


    虽然最初的 Pi 在其支持者最狂野的梦想之外广受欢迎，但它并非没有挑战。


    林纳斯·托瓦兹（Linus Torvalds）用以下话语宣布了 Linux 4.0 合并窗口的关闭：“让我们看看版本号会导致多少，或者说是否会导致任何东西损坏。可能比
    3.0 时期少，但我可以想象有人会在意有意义的版本号。” 这再次表明 Linux 版本号基本上是完全无意义的。除了我们出于情感或情绪原因赋予的含义外，它们没有其他具体意义，因为每个周期遵循相同的开发模式。


    ![](img/c9d26cf718256f071c3af699b9670538_16_0.png)


    ### “虽然最初的 Pi 很受欢迎，但它并非没有挑战”


    一方面，最初 Pi 使用的处理器——一种 ARMv6K 兼容设计——实际上是为嵌入式移动设计而设计的。它使用的架构版本是 ARM 在 SMP（多处理）方面的第一次尝试，尽管它只提供单核，并很快被如今广泛使用的
    ARMv7 32 位架构所取代。ARMv7 包含一套标准化的架构特性和 ABI，使得通用 Linux 操作系统对基于 v7 系统的支持比对像最初 Pi 那样基于旧
    ARMv6 的设计的支持容易得多。


    正因为如此，得知第二代树莓派 2 的发布时格外令人兴奋。Pi 2 Model B 具有与最初 Pi 相同的电路板布局，但使用更新的 Broadcom SoC，基于当代的四核
    ARM Cortex-A7，与原始设备完全向后兼容，并且匹配原始的 35 美元价格点。向 Cortex-A7 的转变（A7 与 ARMv7 没有任何关系，它只是
    ARM 的一个营销术语）为更新设备带来了更广泛的操作系统能力的好处。这也是微软能够为 Pi 2 提供 Windows 10 的原因之一。Pi 2 能够开箱即用或通过相对简单的修改来驱动大多数
    32 位 ARM Linux 发行版。在 Fedora 中，我们将这些称为“Remixes”，相比于过去为 v6 重新构建整个发行版的大型升级。


    与最初版本一样，Pi 2 的初始 Linux 内核移植位于 github.com/raspberry/linux。该移植目前基于 3.18 内核，对 Broadcom
    2709 系列 SoC 的支持已于 2 月 2 日合并。该提交（github.com/raspberry/linux/commit/d9f6ac63a） 日期为
    2013 年 5 月，因此显然它在架子上放了很长时间，随时可以投入使用。与大多数其他面向特定嵌入式平台的当代移植一样，Pi 更多地是关于连接现有的驱动器和架构特性，而不是整合大量新代码。该移植启用了一些构建任何使用
    BCM2709 SoC 系列的设备时共用的具体功能，例如告知内核它基于 ARMv7 架构。该移植的核心部分由一个名为 arch/arm/boot/dts/bcm2709-rpi-2-b.dts
    的文件提供。


    Pi 2 的设备树源（DTS）文件使用一种灵活的层次化语言描述 Pi 的硬件，该语言遵循内核 documentation/devicetree 目录中记录的参考绑定。设计中包含的每个主要设备和
    IP（知识产权）块都使用此 DTS 中的 compatible 属性与这样的绑定进行匹配。例如，DTS 告知内核 Pi 与 bcm2709 兼容，其名称为
    Raspberry Pi 2 Model B，并且包含使用 SoC（芯片）特定的 bcm2709.dts（DTS 包含文件）描述的某些硬件。该包含文件描述
    SoC 本身，包括 4 个 CPU 核心、用于服务外围设备的中断控制器、GPIO 和其他片上接口，以及通用的 armv7 定时器。


    内核移植包括一个 bcm2709_defconfig 文件，内核可以使用它来确定应使用哪些配置选项来构建针对 Pi 2 启动量身定制的最小内核二进制文件（尽管在运行时它将使用编译形式的
    DTS，称为 DTB – DeviceTree Blob – 来确定应使用编译到内核中的众多可能驱动中的哪一个）。最后，该移植包括一个旧式的 bcm2709_b.
    板级特定 C 文件，这似乎是为了方便那些不使用支持设备树的引导加载程序的人（这提供了进一步的证据，表明该移植可能比此特定提交的 2013 年日期还要早）。剩余的代码还为所有
    270X Broadcom 平台提供一些核心使能。


    为 Pi 2 构建和安装内核相对简单，有多种选择，从交叉编译（在 x86 笔记本电脑上）到在设备本身上进行本地编译。这在 raspberry.pi.org
    上有文档记录。虽然最初的 Pi 从未真正拥有良好的上游支持故事，但作者希望第二代很快就能在最喜欢的 Linux 发行版中随附的标准 Linux 内核中得到支持。


    最后，本月 Linux 注意到，一些倡导 Linux 4.0 发布的人最强的论点似乎是想看到 4.15——因为“这是终结者 T-800 使用的 Skynet
    Linux 版本”！这也是害怕 Linux 4.0 和我们的机器人统治者即将到来的又一个理由。


