    通过语音控制咖啡桌上的灯光秀，点亮你的客厅


    ## 功能特性


    ### 项目 Jarvis


    用你的语音激活智能家居自动化系统，重现 20 世纪 50 年代的科幻未来


    ![](img/c9d26cf718256f071c3af699b9670538_27_0.png)


    - **创客档案**

    - **Mayur Singh**

    - 计算机系统工程专业学生


    Mayur 位于南非，他的专长是嵌入式系统，熟悉微控制器以及能够启用外部硬件交互的系统，例如树莓派和 BeagleBone Black。


    了解更多：bit.ly/1EvIImci


    ![](img/c9d26cf718256f071c3af699b9670538_27_1.png)


    **左** Jarvis 界面非常精美，但你可以通过智能手机或语音在任何地方控制系统


    **智能家居自动化已经存在多年，相当多的勇敢工程师和 DIY 爱好者在改装他们的家。** 凭借无线控制灯光、供暖、车库门以及许多其他家居用品，有些人取得的成就令人惊叹。科幻作品一直描绘着拥有先进系统的房屋，而
    Mayur 正忙着创建这样一个系统。


    “主要的灵感来自于观看《钢铁侠》电影，Jarvis 这个名字也由此而来。我决定构建一个简单的家庭自动化系统，然而由于多年来多次重装 Windows，我丢失了原来的程序。在看了第三部《钢铁侠》电影后，我构建了一个新的、改进的家庭自动化系统，该系统具备
    AI 助手和更多的功能。”


    虽然家庭自动化是该项目的一部分，但便利性并非唯一的考量因素。


    ![](img/c9d26cf718256f071c3af699b9670538_27_2.png)


    **上方** 警报模式只能通过正确的指纹或主代码禁用


    “系统的主要功能是帮助家庭节能，”Mayur 告诉我们。“Jarvis 可以读取并监控每盏灯或每个电器的用电量，这使得 AI 能够执行特定任务。这些任务由外部因素决定，例如是否需要打开灯。如果房间内有足够的自然光。这是一个基本的例子，但其他因素也会影响
    AI 的决策，AI 控制着每个灯或电器的电源。数据在整个月份中都被记录，系统使用这些信息在下一个月份取得更好的结果。这就是智能家居自动化。”


    Jarvis AI 是其中的主要部分，你可以与它对话。“它可以通过语音交互控制你的家，并做出关于房间节能的基本决策。我还最近构建了一个功能齐全的平板系统，它连接到当地的在线杂货店。它使用语音控制来识别你需要的产品，并将这些物品添加到列表中，直到你指定配送。”


    经过一年半的项目开发，Mayur 完成的所有功能都运行可靠，但他仍想添加更多功能。


    ### 语音


    该命名的 Jarvis 以其刻薄的言论和语调而闻名。选择一个实际可用的声音已经是一项艰巨的任务，更不用说还要符合特定的风格，正如 Mayur 所解释的：


    “一直很难找到拥有良好 API 和价格的语音，但我最终选择了一个免费的 API，它提供云端转换并仅返回一个 MP3 声音文件。虽然时间较长，但它确保了该声音在所有操作系统上都能工作。”


    如果你有兴趣尝试创建自己的类似 Jarvis 的家庭自动化系统，请查看《Linux User & Developer》的上一期。撰写 Python 专栏的
    Jay Bernard 开始了三部分系列（在第 72 页继续），解释了如何设置一个使用 Python 和几个语音识别模块来解析口语命令的语音助手。


    ## 计划你完美的一天


    激发你的家庭灵感，这个周末去个棒极了的地方。**GREAT DAYS OUT**，**HOW IT WORKS** 推出的一款全新免费 iPhone 应用


    *在地图上探索优质景点*


    ![](img/c9d26cf718256f071c3af699b9670538_28_0.png)


    在 App Store 搜索 “Great Days Out” 或访问 www.greatdaysoutapp.com


    ## 故障排除与维修

    ### Linux 网络


    你的笔记本电脑没有网络连接，或者你的网络托管出现问题？我们要在这里提供帮助


    ![](img/c9d26cf718256f071c3af699b9670538_29_0.png)


    “网络即计算机”，这是太阳微系统公司首席科学家兼第五号员工 John Gage 在 1984 年做出的著名且富有先见之明的名言。网络、移动设备和云计算的发展印证了这句话，没有网络连接的计算机只是一个昂贵的镇纸。


    幸运的是，网络是 Linux 的核心，互联网和 Web 都是建立在 UNIX 之上的。大多数发行版都有内置工具，可以告诉你发生了什么，或者至少引导你开始调查网络问题。更复杂的工具可以在你的发行版仓库中找到，并且由于它们几乎都是基于命令行的，所以它们在虚拟专用服务器（VPS）和笔记本电脑上同样好用。


    Linux 将力量交到你手中——你只需要知道该在哪里查找。在接下来的几页中，我们将带你了解 GNU/Linux 网络协议栈的基础知识，以及它（以及互联网其他部分）可能出错的环节。我们将查看有助于你的工具和配置文件，并以介绍四个最有用的工具：netcat、dig、traceroute
    和 Wireshark 的使用方法作为结尾。


