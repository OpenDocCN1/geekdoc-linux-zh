    \ uFL 连接器，以及底部对爱好者不太友好的高密度 70 引脚 Hirose DF40 连接器。然而，英特尔的这种“疯狂”是有方法的。虽然可以以低于 40\
    \ 英镑的价格购买裸片模块，但该设计是面向那些已创建基于 Edison 的设备并即将投产的设备制造商。更常见的购买 Edison 的方式是附带扩展板，其中最常见的是英特尔自家的\
    \ Arduino 扩展套件。\n\n下方的 Edison 被设计为更大设备的“大脑”，这需要一块扩展板\n\n![](img/c9d26cf718256f071c3af699b9670538_82_0.png)\n\
