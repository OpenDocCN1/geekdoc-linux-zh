    ## 故障排查与网络修复


    解决网络连接和 Web 托管问题


    ### Dig（域名查询工具）


    在本教程中，我们大量使用了 -m 选项，因为 DNS 问题很容易掩盖其他故障。一旦你使用解析器清除了机器上疑似的 DNS 问题，就该通过分层式 DNS 服务器体系去确认一切是否正常。Nslookup
    和 host 执行的是简单搜索，但 dig 是灵活性最高的工具。


    **01 地址查询**

    Nslookup 或许足以用于解析地址或检查连通性，但若要获取有关 DNS 服务器及其在整个互联网上递归连接的有用信息，就应启用 dig。由于它的灵活性，花一点时间熟悉其一些选项将大有裨益。


    ![](img/c9d26cf718256f071c3af699b9670538_34_0.png)


    **02 名称解析**

    默认情况下，dig 返回 A 记录，但也可用于检查 MX（邮件服务器）等其他记录类型。在上方的截图中，我们使用 NS 查找某个命名域的域名服务器。


    **03 分层结构**

    DNS 具有分层结构，首先查询 TLD（顶级域名），例如 .com 或 .org.uk，然后再查询名称部分。由于搜索是递归进行的，因此存在大量出错空间——甚至可能遭受恶意攻击。''Dig
    +trace'' 会向你展示查询所经过的连续分层步骤。


    ![](img/c9d26cf718256f071c3af699b9670538_34_1.png)


    **04 +short 选项**

    分层搜索会输出大量你可能并不需要的信息——即使对于标准的 DNS 查询，你也可能只想要 IP 地址。**+short** 选项正好提供如此简略的输出，这在脚本化搜索中也非常实用。


    ### Wireshark


    与 `tcpdump` 类似，Wireshark 可以从网络转储数据包，但它还具备交互式分析功能——对于轻微的网络问题来说略显大材小用，但对于定位系统瓶颈非常有用。在大多数发行版中，Wireshark
    是 GUI（**Gtk**）版本，而控制台版本则以 **tshark** 打包提供。建议两者都试用，以便在故障发生时根据具体情况选择最佳工具。


    ![](img/c9d26cf718256f071c3af699b9670538_34_2.png)


    **01 强大的工具**

    尽管可用的选项数量令人困惑，但启动过程很简单：只需从 Capture 菜单中选择接口即可。若要让 Wireshark 检测到你的接口并避免以 root 用户身份运行，请参阅
    **wiki.wireshark.org** 上的 *Capture Setup/Capture Privileges*。


    **02 便携式故障排查**

    由于 Wireshark 对于检测许多数据包丢失或延迟问题非常有用，而你未必在各地都安装了它，你可以将其存放在 USB 现场发行版（live distro）中随身携带，从而避免围绕超级用户权限的麻烦。


    ![](img/c9d26cf718256f071c3af699b9670538_34_3.png)


    **03 过滤器裁剪**

    查看原始数据可能会令人眼花缭乱，而且过滤器的选择也非常多。你可以右键点击可疑条目，并以其作为过滤器的基础，或者从过滤器层级中执行相同操作。最简单的情况是，你在查找特定协议——例如
    DNS，或某些通过 TLS 加密的内容——只需将其输入过滤器工具栏即可。


    **04 命令行鲨鱼（命令行版）**

    在你的 VPS 或其他非 **GUI** 机器上，**tshark** 在功能上等效于 Wireshark；建议在安装 Wireshark 之后也安装它并熟悉其使用，以便在需要时做好准备。


    ![](img/c9d26cf718256f071c3af699b9670538_35_0.png)


