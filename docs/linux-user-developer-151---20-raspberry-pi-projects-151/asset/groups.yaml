    8


    ## 评测：带标签的终端模拟器


    ### 简评：对比我们的结论


    | | Sakura | Mrxvt | Terminator | Roxterm |

    |---|---|---|---|---|

    | 系统 | 速度和 GNU Screen 集成弥补了缺乏粗粒度桌面控制 **(6)** | 未紧密集成到桌面系统，但足够轻量，几乎可随处运行 **(6)**
    | 资源占用较重，隐约有些 Java 卡顿，但大部分时间响应良好 **(8)** | 与 GNOME 集成良好，拖放体验好，轻量且每个标签页会话配置非常高效
    **(9)** |

    | 性能 | 可配置的键盘快捷键和合理的默认设置使其易于使用 **(7)** | 如果你需要的不仅仅是标签和输入广播，请另他处 **(6)** | 它不是一头喷着鼻息的猛兽，而是一系列精致细节的精心集合
    **(9)** | 良好的可脚本性和 D-Bus 兼容性，加上高效的每标签页会话配置 **(8)** |

    | 语言 | 它对 UTF-8 支持良好，这使许多用户将其置于 Mrxvt 之前 **(9)** | 东亚语言支持极佳，但我们无法原谅其缺乏 UTF-8 **(4)**
    | 具备 Sakura 和 ROX term 的 UTF-8 支持，但该领域还有更好的字形 **(10)** | 对所有国际用户无懈可击，可读且可配置 **(9)**
    |

    | 美感 | 当然足够好，尽管标签栏在使用时略显突兀 **(6)** | 无需华丽的桌面辅助也能获得良好的外观。对许多用户来说已足够好 **(6)** |
    相当漂亮，有一些不错的细节，但不是最可配置的，这是一个遗憾 **(7)** | 配置简单，但对于许多用户来说总体上可能略显有限 **(7)** |

    | 总评 | 并非适合每个人，但我们确实对其速度和简洁性印象深刻 **(7)** | 年事已高但仍在日常使用。极简主义永存 **(6)** | 优先考虑用户，提供许多有用功能而非吹嘘，且可随处运行
    **(9)** | 简单但具有一些隐藏的可脚本性深度。在所有情境下都能令人满意 **(8)** |


    ### 获胜者是...


    #### Terminator


    我们着手寻找最好的带标签终端模拟器——一款真正令人愉悦的软件。这一标准包含在拥有足够的功能以简化日常 Linux 系统管理，以及具备足够的可配置性以适应大多数系统之间的平衡。过多的花哨图形魔术会拖慢本应即时响应的那部分系统。


    如果你以前曾被不稳定的 Java 软件坑过，Terminator 是一个令人愉悦的惊喜。菜单中可直接访问调试选项可能只是对其使用的 Java 工具包的反映，或是对软件并非完全没有缺陷的承认，但即便如此，我们几乎没有遇到麻烦。


    说到完美和响应迅速，如果速度是最重要的是，请尝试 Sakura。ROX 终端是第二紧密的竞争者，其可脚本性使其成为你的赢家。我们仍在几台旧机器上运行 Mrxvt，但在我们启用
    UTF-8 的世界里，我们不再推荐它。


    除了我们测试的四个发行版之外，我们真的很喜欢 FinaTerm（除了崩溃问题）。Enlightenment 的漂亮 Eterm 替代品 Terminology
    也并非没有问题。


    ![](img/c9d26cf718256f071c3af699b9670538_79_0.png)


    保持向后滚动，无论你的终端已打开多少周


    在合理且较新的硬件上，我们建议尝试其中任何一个。但我们要找的是尽可能多用户和机器的最佳多任务终端。终端应该是可访问性和开放访问的代名词，因此这也是我们重新考察与
    UTF-8 和非欧洲字符集兼容性的原因——Terminator 在这方面相较于其竞争对手，同样表现出色。


    正确可用的查找、无尽的滚动回溯以及对标签页的妥善照顾等荣耀，是我们在其他竞争对手中找到的，但完整的软件包使 Terminator 成为我们的首选。加上一个似乎比
    GNOME 终端资源占用更少的 Java 应用程序，我们得出了这个颇具惊喜的赢家。


    Richard Smedley


